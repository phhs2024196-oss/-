  student_record: 교과 20% (최고 20, 최저 14, 실질반영 7.0%; 논술 80은 실질 93.0%). 반영교과 국어, 영어, 수학, 한국사, 사회(역사/도덕 포함), 과학, 학년별 가중치 없음. 논술전형은 반영 교과의 상위 10개 과목 석차등급·학점(단위) 반영(약학과, 의예과, 간호학과는 반영 교과 전 과목), 진로선택과목 미반영. 석차등급
    배점 1등급 100, 2등급 99.5, 3등급 99, 4등급 98.5, 5등급 98, 6등급 97.5, 7등급 97, 8등급 90, 9등급 70. 2021년 2월 이전 졸업자는 논술성적에 의한 비교내신
