  student_record: 논술고사 90% + 학생부 교과 10%. 교과는 국어·영어·수학·택1(사회/과학) 교과군별 상위 3과목씩 총 12과목(학년 구분 없이, 1학년 1학기~3학년 1학기) 반영, 서울 석차등급 환산점수 1~9등급 100/99/97/95/93/90/70/40/0, 세종 100/99/97/94/90/85/60/30/0. 택1은 이수단위 합이 큰 교과 자동 반영(사회는 한국사·사회(역사/도덕 포함)). 교과를 점수로 반영할 수 없는 비교평가대상자는 논술고사 점수로 교과점수 산출. 학교폭력 조치사항 1~3호 각 1%·2%·3% 감점(전형 총점 대비), 제8·9호 등 상위 호수는 요강 표 참조
