    detect_cue: 첫 줄에 증명할 부등식이 전제로 쓰였고 $\iff$가 없다
    feedback: 참인 사실에서 출발하거나 각 단계가 동치($\iff$)임을 밝히세요.
    remedy: [RL-1]

