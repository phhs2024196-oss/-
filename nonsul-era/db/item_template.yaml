stimuli:                         # ○ 제시문. 숭실: 교과서 정리 + 【출처】, 동국: 【가】~【다】, 세종: 비움
- label: 가
  body: |
    미분가능한 함수 $f(x)$에 대하여 열린구간 $(a,b)$에서 $f'(x)<0$이면 $f(x)$는 $[a,b]$에서 감소한다.
    【출처: 미적분 「도함수의 활용」】

stem: |                          # ● 공통 발문
  함수 $f(x)=\dfrac{\ln x}{x}\ (x>0)$에 대하여 $e^{\pi}>\pi^{e}$임을 증명하시오.

subparts:                        # ● 단일 논제도 소문항 1개("1")로 쓴다
- id: '1'                        # 단일 논제는 소문항 "1" 하나. 소문항 발문은 짧게(공통 발문 반복 금지)
  stem: |
    위 명제를 증명하시오.
  points: 25
  depends_on: []                 # ○ 앞 소문항 결과를 쓰면 그 id (이월 FT 판단 근거)
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}   # ● kind: value|expression|proof|set|choice
  solutions:                     # ● (verified 이상) audience A(방향) 1개 + B(전 과정) 1개 이상, ALT 는 대체 풀이
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 로그를 취하면 $f(\pi)<f(e)$와 동치이고, $f$는 $x>e$에서 감소한다.
    steps:
    - {id: 1a, content: '$e^\pi>\pi^e\iff \dfrac{\ln\pi}{\pi}<\dfrac1e\iff f(\pi)<f(e)$', criteria: [1.M1, 1.R1, 1.A1]}
    hint_ladder:
    - 로그를 취해 보자.
    - 양변을 $e\pi$로 나누면 어떤 함수가 보이는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: null              # ◐ 기출: 이 해설이 따르는 원 해설의 쪽(예: '해설집 p.4'). 자체 문항은 null
    steps:
    - id: 1b-1
      content: |
        두 수는 양수이고 $\ln$은 증가함수이므로 $e^\pi>\pi^e\iff \pi>e\ln\pi\iff \dfrac1e>\dfrac{\ln\pi}{\pi}$, 즉 $f(e)>f(\pi)$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $f'(x)=\dfrac{1-\ln x}{x^2}$이고 $x>e$에서 $1-\ln x<0$이므로 제시문 (가)에 의해 $f$는 $[e,\infty)$에서 감소한다.
      criteria: [1.M2, 1.A2]
    - id: 1b-3
      content: |
        $\pi>e$이므로 $f(\pi)<f(e)$이고, 1b-1의 동치 관계에 의해 $e^\pi>\pi^e$이다. ■
      criteria: [1.R1, 1.A1]
  rubric:                        # ● 1마크 = 1행
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:                    # 글이 들어가는 값은 블록(줄바꿈) 형식으로 — {} 안에 쉼표·물음표가 있으면 깨짐
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: 로그를 취하거나 동치 변형으로 비교를 $f(\pi)$와 $f(e)$의 비교로 바꾼 식이 있다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: $f'(x)=\dfrac{1-\ln x}{x^2}$ 또는 동치식을 구했다.
      implied_ok: true
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $x>e$에서 $f'(x)<0$이므로 감소함을 밝혔다.
      depends_on: [1.M2]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 6
      evidence: $\pi>e$와 감소성을 근거로 $f(\pi)<f(e)$를 이끌었다.
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 동치 변형의 근거($\ln$의 증가성, 양수로 나눔)를 밝히고 결론을 적었다.
      depends_on: [1.M1, 1.R1]
      not_penalized:
      - $\iff$ 대신 「따라서」로 순방향 서술
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 결론을 가정하고 출발해 참인 식에 도달한 뒤 끝냄(동치 표시 없음)
      effect: minus             # minus | cap | zero
      value: 5
    - code: D1-2
      condition: 근삿값 계산만으로 대소를 판단
      effect: cap
      value: 5
  outcome_codes:                 # ○ 20~29 만점(방법별) 10~19 부분 70~78 특정 오개념 79 기타 오답 90 판독불가 99 백지
