# 전역 오개념 카탈로그 — 같은 오개념은 문항이 달라도 같은 ID (학생별 오개념 누적 통계·처방의 기준)
# ID: MC-<영역>-<4자리>. 영역: CAL(미적분) ALG(대수·수열) PRB(확률·통계) GEO(기하) PRF(증명·논증) CNT(경우의 수·정수)
