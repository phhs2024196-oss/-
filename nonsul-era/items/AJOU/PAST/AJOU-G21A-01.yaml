- id: '1-4'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (4) 모든 $1\le k\le n$에 대하여 $-1<x_k<1$인 $n$개의 실수 $x_1,x_2,\ldots,x_n$을 사용하여 함수 $B(x)$를 만들자. 방정식 $B(x)=n$의 해가 닫힌구간 $[-1,1]$에 존재하는지 여부를 판단하고 그 이유를 서술하여라.
  points: 8
  depends_on: []
  answer: {kind: proof, value: '항상 존재한다', equivalents: [], tolerance: null}
  solutions:
  - id: S14-A
    audience: A
    method_no: 1
    key_idea: $B(1)+B(-1)=2n$이므로 $B(\pm1)$ 중 하나는 $n$ 이하, 하나는 $n$ 이상이고 사잇값 정리를 쓴다.
    steps:
    - id: 14a
      content: |
        $B(1)=n-\sum x_k$, $B(-1)=n+\sum x_k$ $\Rightarrow$ $B(1)+B(-1)=2n$ $\Rightarrow$ 사잇값 정리
      criteria: ['1-4.M1', '1-4.R2', '1-4.R3']
    hint_ladder:
    - $\lvert x_k\rvert<1$이면 $\lvert1-x_k\rvert$와 $\lvert-1-x_k\rvert$는 어떻게 풀리는가?
    - $B(1)+B(-1)$을 계산해 보자.
  - id: S14-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 14b-1
      content: |
        $\lvert x_k\rvert<1$로부터 $B(1)=n-\sum x_k$, $B(-1)=n+\sum x_k$이다.
      criteria: ['1-4.M1']
    - id: 14b-2
      content: |
        $B(1)=n$이면 $x=1$이 $B(x)=n$의 해가 된다.
      criteria: ['1-4.R1']
    - id: 14b-3
      content: |
        $B(1)\ne n$이면, $B(1)+B(-1)=2n$이므로 $B(1)<n$, $B(-1)>n$이거나 $B(1)>n$, $B(-1)<n$이다.
      criteria: ['1-4.R2']
    - id: 14b-4
      content: |
        $B(x)$는 연속함수이므로 사잇값 정리에 의해 열린구간 $(-1,1)$에서 방정식 $B(x)-n=0$은 적어도 1개의 해를 가진다.
      criteria: ['1-4.R3']
    - id: 14b-5
      content: |
        따라서 방정식 $B(x)=n$은 닫힌구간 $[-1,1]$에서 항상 해를 가진다.
      criteria: ['1-4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
