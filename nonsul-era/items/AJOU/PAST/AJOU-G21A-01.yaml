- id: '2-2'
  stem: |
    [문제 1-2] 제시문 (나)를 읽고 다음 물음에 답하여라.
    (2) 함수 $f(x)=e^{3x}-\cos^2(\pi x)$를 사용하여 함수 $C(x)$를 만들었더니 $\displaystyle\lim_{x\to1}\frac{C(x)}{(\ln x)^2}$가 실수 $L$로 수렴하였다. 이때 $L$의 값을 구하여라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '18*exp(6)', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: 극한이 존재하므로 $C(1)=0$, 즉 $f(x_1)=f(x_2)=f(1)$이고 $L=2f'(1)^2$이다.
    steps:
    - id: 22a
      content: |
        $L=2\lim_{t\to0}\left(\frac{f(e^t)-f(1)}{t}\right)^2=2(f'(1))^2=2(3e^3)^2=18e^6$
      criteria: ['2-2.M1', '2-2.A2']
    hint_ladder:
    - 분모가 0으로 가면 분자는?
    - $C(1)=0$은 제시문 (나)에서 무엇을 뜻하는가?
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.9
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $\displaystyle\lim_{x\to1}\frac{C(x)}{(\ln x)^2}$ 이 수렴하고 분모의 극한 $\displaystyle\lim_{x\to1}(\ln x)^2=0$ 이므로 분자의 극한도 $\displaystyle\lim_{x\to1}C(x)=0$ 이다.
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        $C(x)$가 연속함수이므로, $0=\lim_{x\to1}C(x)=C(1)=(f(1)-f(x_1))^2+(f(1)-f(x_2))^2$ 이 되어 $f(1)=f(x_1)=f(x_2)$이고, $C(x)=2(f(x)-f(1))^2$이다.
      criteria: ['2-2.A1']
    - id: 22b-3
      content: |
        이를 계산하기 위해 $\ln x=t$로 치환하면
        $$\lim_{x\to1}\frac{C(x)}{(\ln x)^2}=2\cdot\lim_{x\to1}\left(\frac{f(x)-f(1)}{\ln x}\right)^2=2\cdot\lim_{t\to0}\left(\frac{f(e^t)-f(e^0)}{t}\right)^2$$
        이 된다. $g(t)=f(e^t)$라 두면, $g'(t)=f'(e^t)e^t$이며, 미분계수의 정의로부터 $\displaystyle\lim_{t\to0}\frac{g(t)-g(0)}{t-0}=g'(0)=f'(1)=3e^3$이다.
      criteria: ['2-2.M2']
    - id: 22b-4
      content: |
        ($f'(x)=3e^{3x}+\pi\sin(2\pi x)$이므로 $f'(1)=3e^3$.) 따라서 답은 $18e^6$이다.
      criteria: ['2-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: R
      points: 2
      evidence: |
        분모 $\to0$이므로 $\lim_{x\to1}C(x)=0$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [22b-1, 22a]
    - id: 2-2.A1
      mark_type: A
      points: 3
      evidence: |
        $C(1)=0$에서 $f(1)=f(x_1)=f(x_2)$, $C(x)=2(f(x)-f(1))^2$을 얻었다.
      depends_on: [2-2.M1]
      steps: [22b-2]
    - id: 2-2.M2
      mark_type: M
      points: 3
      evidence: |
        $\ln x=t$ 치환 등으로 극한을 미분계수 $f'(1)=3e^3$으로 바꿨다.
      depends_on: []
      implied_ok: false
      steps: [22b-3]
    - id: 2-2.A2
      mark_type: A
      points: 2
      evidence: |
        $L=18e^6$을 얻었다.
      depends_on: [2-2.M2]
      steps: [22b-4, 22a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

