- id: '2-1'
  stem: |
    [문제 1-2] 제시문 (나)를 읽고 다음 물음에 답하여라.
    (1) 함수 $f(x)=\sec x$ 와 $x_1=0$, $x_2=\dfrac{\pi}{3}$를 사용하여 함수 $C(x)$를 만들 때, $\displaystyle\int C(x)\tan x\,dx$를 구하여라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '-5*log(Abs(cos(x))) - 6*sec(x) + sec(x)**2 + C', equivalents: ['-5*log(Abs(cos(x))) - 6*sec(x) + tan(x)**2 + C'], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $C(x)=5-6\sec x+2\sec^2x$로 전개한 뒤 세 항을 따로 적분한다.
    steps:
    - id: 21a
      content: |
        $\int(5\tan x-6\sec x\tan x+2\sec^2x\tan x)dx=-5\ln\lvert\cos x\rvert-6\sec x+\sec^2x+C$
      criteria: ['2-1.M1', '2-1.A4']
    hint_ladder:
    - $\sec0$, $\sec\frac{\pi}{3}$의 값을 넣어 $C(x)$를 전개하자.
    - $(\sec x)'=\sec x\tan x$임을 이용하자.
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.9
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $\sec0=1$, $\sec\dfrac{\pi}{3}=2$이므로 $C(x)=(1-\sec x)^2+(2-\sec x)^2=5-6\sec x+2\sec^2x$이다. 따라서
        $$\int C(x)\tan x\,dx=5\int\tan x\,dx-6\int\tan x\sec x\,dx+2\int\sec^2x\tan x\,dx$$
      criteria: ['2-1.M1']
    - id: 21b-2
      content: |
        한편 $\int\tan x\,dx=-\ln\lvert\cos x\rvert+C$,
      criteria: ['2-1.A1']
    - id: 21b-3
      content: |
        $\int\tan x\sec x\,dx=\sec x+C$,
      criteria: ['2-1.A2']
    - id: 21b-4
      content: |
        $\int\sec^2x\tan x\,dx=\dfrac{\sec^2x}{2}+C$ (혹은 $\dfrac{\tan^2x}{2}+C$) 이므로,
      criteria: ['2-1.A3']
    - id: 21b-5
      content: |
        $\displaystyle\int C(x)\tan x\,dx=-5\ln\lvert\cos x\rvert-6\sec x+\sec^2x+C$ 가 된다. ($\sec^2x=1+\tan^2x$이므로 $-5\ln\lvert\cos x\rvert-6\sec x+\tan^2x+C$ 도 정답)
      criteria: ['2-1.A4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 2
      evidence: |
