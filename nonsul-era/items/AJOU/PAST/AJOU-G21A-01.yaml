stimuli:
- label: 가
  body: |
    양의 정수 $n$에 대하여 $n$개의 실수 $x_1$, $\ldots$, $x_n$(단, $x_1\le x_2\le\cdots\le x_n$)을 사용하여 함수 $B(x)$를 다음과 같이 정의한다.
    $$B(x)=\sum_{k=1}^{n}\lvert x-x_k\rvert=\lvert x-x_1\rvert+\cdots+\lvert x-x_n\rvert$$
    함수 $y=B(x)$의 그래프는 구간 $(-\infty,x_1]$과 구간 $[x_n,\infty)$에서 기울기가 각각 $-n$과 $n$인 직선이 되며, $x_k\ne x_{k+1}$이면 닫힌구간 $[x_k,x_{k+1}]$에서도 직선이다. 이와 같이 $y=B(x)$의 그래프에 나타나는 직선의 기울기의 집합을 $S$라 하자. $-n$과 $n$은 항상 $S$의 원소이며 $S$의 원소의 개수는 $n+1$ 이하이다. [그림 1-1]의 왼쪽의 예에서 $y=B(x)$의 그래프에 나타나는 직선의 기울기는 $-3,-1,1,3$이므로 $S=\{-3,-1,1,3\}$이다.
    [그림 1-1: 두 그래프. 왼쪽은 $x_1=1$, $x_2=2$, $x_3=4$일 때 $y=B(x)$ — 꺾인 점 $(1,4)$, $(2,3)$, $(4,5)$를 지나는 꺾은선(최솟값 3). 오른쪽은 $x_1=x_2=-1$, $x_3=0$, $x_4=2$일 때 — $(-1,4)$에서 $(0,4)$까지 수평, $(2,8)$로 이어지는 꺾은선]
- label: 나
  body: |
    함수 $f(x)$와 두 실수 $x_1$과 $x_2$에 대해, 함수 $C(x)$를 다음과 같이 정의한다.
    $$C(x)=(f(x)-f(x_1))^2+(f(x)-f(x_2))^2$$
    실수 $a$에 대해 $C(a)=0$이면, $(f(a)-f(x_1))^2=(f(a)-f(x_2))^2=0$ 이므로 $f(a)=f(x_1)=f(x_2)$ 이다.

stem: |
  다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (1) $n=401$이고 모든 $1\le k\le n$에 대하여 $x_k=k$인 $n$개의 정수 $x_1,x_2,\ldots,x_n$을 사용하여 함수 $B(x)$를 만들 때, $B(x)$의 최솟값을 구하여라.
  points: 6
  depends_on: []
  answer: {kind: value, value: '40200', equivalents: ['200*201'], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 기울기가 음에서 양으로 바뀌는 가운데 점 $x=201$에서 최소이다.
    steps:
    - id: 11a
      content: |
        $B(201)=2\sum_{k=1}^{200}k=40200$
      criteria: ['1-1.M1', '1-1.A1']
    hint_ladder:
    - 기울기가 음수에서 양수로 바뀌는 곳은 어디인가?
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        구간 $(-\infty,201]$에서 직선의 기울기가 음수이고, 구간 $[201,\infty)$에서 기울기가 양수이다. 따라서 그래프의 개형으로부터 $x=201$에서 최솟값을 가짐을 알 수 있다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        따라서 $B(201)=\sum_{k=1}^{401}\lvert201-k\rvert$가 최솟값이 되며, $B(201)=2\sum_{k=1}^{200}k$이다.
      criteria: ['1-1.M2']
    - id: 11b-3
      content: |
        $2\cdot\dfrac{200\times201}{2}=200\times201=40200$이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: R
      points: 3
      evidence: |
        $(-\infty,201]$에서 기울기 음수, $[201,\infty)$에서 기울기 양수임을 근거로 $x=201$에서 최소임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [11b-1, 11a]
    - id: 1-1.M2
      mark_type: M
      points: 1
      evidence: |
        $B(201)=2\sum_{k=1}^{200}k$로 정리했다.
      depends_on: []
      implied_ok: true
      steps: [11b-2]
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        최솟값 $40200$을 얻었다.
      depends_on: [1-1.M2]
      steps: [11b-3, 11a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (2) 서로 다른 $n$개의 실수 $x_1,x_2,\ldots,x_n$을 사용하여 함수 $B(x)$와 집합 $S$를 만들 때, $S$의 원소의 제곱의 합을 $a_n$이라 하자. $\displaystyle\lim_{n\to\infty}\frac{a_n}{n^3}$의 값을 구하여라.
  points: 7
  depends_on: []
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $S=\{-n+2i\mid i=0,\ldots,n\}$이므로 $a_n=\dfrac{n(n+1)(n+2)}{3}$이다.
    steps:
    - id: 12a
      content: |
        $a_n=\sum_{i=0}^{n}(-n+2i)^2=\dfrac{n(n+1)(n+2)}{3}$, 극한 $\dfrac13$
      criteria: ['1-2.M1', '1-2.A1', '1-2.A2']
    hint_ladder:
    - 구간 $[x_i,x_{i+1}]$에서 기울기는 (왼쪽 점의 개수)$-$(오른쪽 점의 개수)이다.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $x_k$들이 모두 다르기 때문에, 집합 $S$는 $n+1$개의 원소를 가지고 다음과 같은 형태를 가진다.
        $$S=\{-n,-(n-2),\cdots,n-2,n\}$$
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        따라서 $S$의 원소들의 제곱의 합은
        $$\sum_{i=0}^{n}(-n+2i)^2=\sum_{i=0}^{n}(n^2-4ni+4i^2)=n^2(n+1)-4n\cdot\frac{n(n+1)}{2}+4\cdot\frac{n(n+1)(2n+1)}{6}=\frac{n(n+1)(n+2)}{3}$$
      criteria: ['1-2.A1']
    - id: 12b-3
      content: |
        $a_n$은 $n$에 대한 삼차식으로 최고차항이 $\dfrac13n^3$이 되어 $\displaystyle\lim_{n\to\infty}\frac{a_n}{n^3}=\frac13$이다.
      criteria: ['1-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: |
        $S=\{-n,-(n-2),\cdots,n-2,n\}$($n+1$개)를 제시했다.
      depends_on: []
      implied_ok: false
      steps: [12b-1, 12a]
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        $a_n=\dfrac{n(n+1)(n+2)}{3}$ 또는 동치식을 계산했다.
      depends_on: [1-2.M1]
      steps: [12b-2, 12a]
    - id: 1-2.A2
      mark_type: A
      points: 2
      evidence: |
        극한값 $\dfrac13$을 얻었다.
      depends_on: [1-2.M1]
      steps: [12b-3, 12a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (3) $2$ 이상의 짝수 $n$에 대해, $1\le x_1\le x_2\le\cdots\le x_n\le3$을 만족하는 $n$개의 정수 $x_1,x_2,\ldots,x_n$을 사용하여 함수 $B(x)$와 집합 $S$를 만들자. $S$의 원소의 곱이 양수가 되게 하는 모든 순서쌍 $(x_1,x_2,\ldots,x_n)$의 개수를 $n$에 대한 식으로 나타내어라.
  points: 9
  depends_on: []
  answer: {kind: expression, value: 'n**2/4 + n/2 - 2', equivalents: ['(n/2-1)**2 + 3*n/2 - 3'], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 값 1, 2, 3의 개수 $a_1,a_2,a_3$로 나누면 $S$의 음수 원소 개수가 홀수(곱이 양수)여야 하므로 가운데 두 기울기의 부호가 정해진다.
    steps:
    - id: 13a
      content: |
        모두 양수: $\left(\frac n2-1\right)^2$, 하나가 0: $3\left(\frac n2-1\right)$, 합 $\frac{n^2}{4}+\frac n2-2$
      criteria: ['1-3.M1', '1-3.A1', '1-3.A2', '1-3.A3']
    hint_ladder:
    - $x_k$가 1, 2, 3인 것의 개수를 각각 $a_1,a_2,a_3$이라 하자.
    - $S$에 $0$이 있으면 곱은 0이다. 음수인 원소는 몇 개여야 하는가?
  - id: S13-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $x_k=1$인 $k$의 개수를 $a_1$, $x_k=2$인 $k$의 개수를 $a_2$, $x_k=3$인 $k$의 개수를 $a_3$이라 하고 다음 ①과 ②를 생각하자.
      criteria: ['1-3.M1']
    - id: 13b-2
      content: |
        ① $a_1,a_2,a_3$가 모두 양수인 경우: 집합 $S=\{-a_1-a_2-a_3,\,-a_1-a_2+a_3,\,-a_1+a_2+a_3,\,a_1+a_2+a_3\}$이 된다. 이때 $-a_1-a_2-a_3=-n$ 이고 $a_1+a_2+a_3=n$ 이므로 $S$의 원소의 곱이 양수가 되기 위해서는 $-a_1-a_2+a_3=-n+2a_3<0$ 이고 $-a_1+a_2+a_3=n-2a_1>0$ 이어야 한다. 즉, $a_1$과 $a_3$은 모두 $0$보다 크고 $\dfrac n2$보다 작은 정수이므로 $a_2$가 결정되고, 모든 가능한 경우의 수는 $\left(\dfrac n2-1\right)^2$이다.
      criteria: ['1-3.A1']
    - id: 13b-3
      content: |
        ② $a_1,a_2,a_3$ 중 어느 하나가 $0$인 경우: $0$인 것이 2개이면 $S=\{-n,n\}$이 되어 $S$의 원소의 곱이 항상 음수가 되어 모순이다. 따라서 정확히 하나만 $0$이 되는데, $a_i=0$이고 $a_j,a_l>0$ (단, $j<l$)이라 두자. 그러면 $S=\{-a_j-a_l,\,-a_j+a_l,\,a_j+a_l\}$이고 $-a_j-a_l=-n$ 이고 $a_j+a_l=n$ 이므로 $-a_j+a_l<0$가 성립해야 한다. 즉 가능한 경우는 $a_l$이 $0$보다 크고 $\dfrac n2$보다 작은 정수인 경우로 총 경우의 수는 $\dfrac n2-1$이 된다. $a_i=0$인 $i$를 고르는 방법이 3가지이므로, 이 경우 가능한 경우의 수는 $\dfrac{3n}{2}-3$이다.
      criteria: ['1-3.A2']
    - id: 13b-4
      content: |
        따라서 ①과 ②의 경우를 고려하면 $S$의 원소의 곱이 양수가 되는 $n$에 대한 식은 $\left(\dfrac n2-1\right)^2+\dfrac{3n}{2}-3=\dfrac{n^2}{4}+\dfrac n2-2$ 이다.
      criteria: ['1-3.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 1
      evidence: |
        $x_k=1,2,3$인 개수 $a_1,a_2,a_3$을 두고 경우(모두 양수 / 하나가 0)를 나눴다.
      depends_on: []
