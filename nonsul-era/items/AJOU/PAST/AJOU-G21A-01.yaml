intent: |
  절댓값 합 함수 $B(x)=\sum\lvert x-x_k\rvert$의 그래프(기울기 집합)를 해석해 최솟값·기울기 집합·경우의 수·사잇값 정리 판정을 하고, 두 함숫값 차의 제곱합으로 정의된 함수의 부정적분과 미분계수 정의를 이용한 극한을 구하는 능력을 본다.
key_idea: |
  $B(x)$의 기울기는 왼쪽 점의 개수와 오른쪽 점의 개수의 차이므로 $S$는 $-n+2i$ 꼴의 수로 이루어지고, $C(x)$의 극한은 $C(1)=0$에서 $f(1)=f(x_1)=f(x_2)$를 끌어내 미분계수의 정의로 바꾼다.
stuck: |
  (3)에서 $a_1,a_2,a_3$ 중 0이 있는 경우를 따로 세는 것, (4)에서 $B(1)+B(-1)=2n$을 찾아 사잇값 정리를 쓰는 것, 1-2 (2)에서 $x_1,x_2$가 주어지지 않아도 $f(x_1)=f(x_2)=f(1)$임을 이끄는 것
