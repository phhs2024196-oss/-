      depends_on: []
      implied_ok: false
      steps: [14b-1, 14a]
    - id: 1-4.R1
      mark_type: R
      points: 2
      evidence: |
        $B(1)=n$인 경우 $x=1$이 해임을 밝혔다.
      depends_on: []
      steps: [14b-2]
    - id: 1-4.R2
      mark_type: R
      points: 2
      evidence: |
        $B(1)\ne n$이면 $B(1)+B(-1)=2n$에서 $B(1)$, $B(-1)$ 중 하나는 $n$보다 작고 하나는 $n$보다 큼을 보였다.
      depends_on: [1-4.M1]
      steps: [14b-3, 14a]
    - id: 1-4.R3
      mark_type: R
