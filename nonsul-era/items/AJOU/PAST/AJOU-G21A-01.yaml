      evidence: |
        $\int\tan x\sec x\,dx=\sec x+C$
      depends_on: []
      steps: [21b-3]
    - id: 2-1.A3
      mark_type: B
      points: 2
      evidence: |
        $\int\sec^2x\tan x\,dx=\dfrac{\sec^2x}{2}+C$ 또는 $\dfrac{\tan^2x}{2}+C$
      depends_on: []
      steps: [21b-4]
    - id: 2-1.A4
      mark_type: A
      points: 2
      evidence: |
        $-5\ln\lvert\cos x\rvert-6\sec x+\sec^2x+C$ (또는 $\tan^2x$ 형태)를 답했다.
      depends_on: [2-1.M1]
      not_penalized:
      - $\sec^2x$ 대신 $\tan^2x$로 쓴 답(적분상수 차이)
