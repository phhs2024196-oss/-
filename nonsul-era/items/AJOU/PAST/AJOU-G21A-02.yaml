- id: '2'
  stem: |
    [문항 2-2] 제시문 (나)에서 $\displaystyle\lim_{n\to\infty}a_n$과 $\displaystyle\lim_{n\to\infty}(b_n)^{2n+2}$의 수렴, 발산을 각각 조사하고, 수렴한다면 그 값을 구하여라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'a=oo; b=exp(-2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $b_n=1-\frac{1}{n+1}$(망원), 전체 넓이는 조화급수로 발산, $(1-\frac1{n+1})^{2(n+1)}\to e^{-2}$.
    steps:
    - id: 2a
      content: |
        $a_n=\sum\frac1k-b_n\to\infty$ (발산), $(b_n)^{2n+2}\to e^{-2}=\frac1{e^2}$ (수렴)
      criteria: ['2.M1', '2.A2', '2.M2']
    hint_ladder:
    - $k$번째 직사각형의 검은 부분 넓이는?
  - id: S2-B
    audience: B
    source_flow: 모범답안 p.11
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $k$번째 직사각형 안에 검은색으로 칠해지는 부분의 넓이는 $\dfrac1k\times\dfrac{1}{k+1}$이다. 따라서 $b_n=\displaystyle\sum_{k=1}^{n}\frac{1}{k(k+1)}=\sum_{k=1}^{n}\left(\frac1k-\frac1{k+1}\right)=1-\frac1{n+1}$이므로 $\displaystyle\lim_{n\to\infty}b_n=1$로 수렴한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        또한 이 깃발 전체의 넓이는 $S_n=\displaystyle\sum_{k=1}^{n}\frac1k$이고,
        $$\lim_{n\to\infty}\sum_{k=1}^{n}\frac1k=1+\frac12+\left(\frac13+\frac14\right)+\left(\frac15+\cdots+\frac18\right)+\left(\frac19+\cdots\right)>1+\frac12+\frac12+\frac12+\cdots=1+\lim_{n\to\infty}\frac12n=\infty$$
        이므로 $\lim S_n=\infty$이다. $S_n=a_n+b_n$이고, $\lim b_n=1$ 이므로
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        $\displaystyle\lim_{n\to\infty}a_n=\infty$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        한편, $-\dfrac1{n+1}=h$라 놓으면 $n\to\infty$일 때, $h\to0$이므로,
        $$\lim_{n\to\infty}(b_n)^{2n+2}=\lim_{n\to\infty}\left(1-\frac1{n+1}\right)^{2(n+1)}=\lim_{h\to0}(1+h)^{\frac1h\times(-2)}=e^{-2}=\frac1{e^2}$$
      criteria: ['2.M2']
    - id: 2b-5
      content: |
        이므로 수렴한다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $b_n=1-\dfrac1{n+1}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        전체 넓이 $\sum\frac1k$의 발산(묶어서 $\frac12$ 이상)과 $S_n=a_n+b_n$, $\lim b_n=1$을 근거로 제시했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        $\lim a_n=\infty$(발산)라고 답했다.
      depends_on: [2.R1]
      steps: [2b-3]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $\left(1-\frac1{n+1}\right)^{2(n+1)}\to e^{-2}$을 $e$의 정의로 계산했다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-4, 2a]
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: |
        $(b_n)^{2n+2}$은 $\dfrac1{e^2}$로 수렴한다고 답했다.
      depends_on: [2.M2]
      steps: [2b-5, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3-1'
  stem: |
    [문항 2-3] 제시문 (다)를 읽고 다음 물음에 답하여라.
    (1) 함수 $f(x)=\dfrac12\cos^3\!\left(\dfrac{\pi}{2}x\right)+a$ (단, $\lvert a\rvert\le\dfrac12$) 이 균형 잡힌 깃발을 만들 때, $a$의 값을 구하여라.
  points: 9
  depends_on: []
  answer: {kind: value, value: '-2/(3*pi)', equivalents: [], tolerance: null}
  solutions:
  - id: S31-A
    audience: A
    method_no: 1
    key_idea: 그래프가 정사각형 안에 있고 우함수이므로 $\int_0^1f(x)dx=0$(오른쪽 반의 위·아래 넓이가 같음)이면 된다.
    steps:
    - id: 31a
      content: |
        $\int_0^1\left(\frac12\cos^3\frac{\pi x}{2}+a\right)dx=\frac1\pi-\frac1{3\pi}+a=0\Rightarrow a=-\frac{2}{3\pi}$
      criteria: ['3-1.M1', '3-1.A2']
    hint_ladder:
    - 오른쪽 절반 $[0,1]\times[-1,1]$에서 위·아래 넓이가 같다는 것을 식으로 쓰면?
  - id: S31-B
    audience: B
    source_flow: 모범답안 p.12
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $\lvert a\rvert\le\dfrac12$이므로 함수 $f(x)$는 $-1\le x\le1$ 범위에서 $-1\le f(x)\le1$을 만족하므로 정사각형 내부에 그려진다. 또한 $f(x)$는 $y$축에 대한 대칭이다. 따라서 $\displaystyle\int_0^1\left(\frac12\cos^3\left(\frac{\pi}{2}x\right)+a\right)dx=0$을 만족하는 $a$를 구하면 충분하다.
      criteria: ['3-1.M1']
    - id: 31b-2
      content: |
        한편, $\cos^3\left(\dfrac{\pi}{2}x\right)=\cos\left(\dfrac{\pi}{2}x\right)-\cos\left(\dfrac{\pi}{2}x\right)\sin^2\left(\dfrac{\pi}{2}x\right)$이므로
        $$\int\cos^3\left(\frac{\pi}{2}x\right)dx=\frac{2}{\pi}\sin\left(\frac{\pi}{2}x\right)-\frac{2}{3\pi}\sin^3\left(\frac{\pi}{2}x\right)+C\ (\text{단, }C\text{는 적분 상수})$$
      criteria: ['3-1.A1']
    - id: 31b-3
      content: |
        이고, 이를 이용하면 $\displaystyle\int_0^1\left(\frac12\cos^3\left(\frac{\pi}{2}x\right)+a\right)dx=\frac1\pi-\frac{1}{3\pi}+a=0$ 이다. 따라서 $a=-\dfrac{2}{3\pi}$이다.
      criteria: ['3-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 3
      evidence: |
        그래프가 정사각형 안에 있고 $y$축 대칭이므로 $\int_0^1f(x)dx=0$이면 충분함을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [31b-1, 31a]
    - id: 3-1.A1
      mark_type: B
      points: 3
      evidence: |
        $\int\cos^3\left(\frac{\pi}{2}x\right)dx=\frac2\pi\sin\left(\frac\pi2x\right)-\frac{2}{3\pi}\sin^3\left(\frac\pi2x\right)+C$를 구했다.
      depends_on: []
      steps: [31b-2]
    - id: 3-1.A2
      mark_type: A
      points: 3
      evidence: |
        $a=-\dfrac{2}{3\pi}$을 얻었다.
      depends_on: [3-1.M1]
      steps: [31b-3, 31a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3-2'
  stem: |
    [문항 2-3] 제시문 (다)를 읽고 다음 물음에 답하여라.
    (2) 이차함수 $f(x)=2-bx^2$ (단, $b>3$) 이 균형 잡힌 깃발을 만들 때, $\sqrt b$의 값을 구하여라.
  points: 9
  depends_on: []
  answer: {kind: value, value: '2*sqrt(3) - 2/3', equivalents: [], tolerance: null}
  solutions:
  - id: S32-A
    audience: A
    method_no: 1
    key_idea: $x\ge0$ 쪽에서 포물선 아래(정사각형 안) 넓이가 1이 되도록 윗변·아랫변과의 교점 사이를 적분한다.
    steps:
    - id: 32a
      content: |
        $1=\frac{2}{\sqrt b}+\int_{1/\sqrt b}^{\sqrt3/\sqrt b}(3-bx^2)dx=\frac{2\sqrt3-\frac23}{\sqrt b}\Rightarrow\sqrt b=2\sqrt3-\frac23$
      criteria: ['3-2.M2', '3-2.A1']
    hint_ladder:
    - 포물선이 정사각형의 윗변 $y=1$, 아랫변 $y=-1$과 만나는 $x>0$ 쪽 점을 구하자.
  - id: S32-B
    audience: B
    source_flow: 모범답안 p.12
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $f(x)=2-bx^2$는 $y$축에 대한 대칭인 함수이고 $b>3$이므로 꼭짓점 $(0,2)$가 정사각형 위에 있고 $x=1$에서 $f(1)=2-b<-1$인 개형을 가지고 있다. $f(x)$가 균형 잡힌 깃발을 만들기 위해서는 오른쪽 반(정사각형 안, $x\ge0$)에서 포물선 아래의 색칠된 넓이가 $1$이 되어야 한다.
        [그림: 정사각형과 $y=2-bx^2$, 교점 $\left(\frac1{\sqrt b},1\right)$, $\left(\frac{\sqrt3}{\sqrt b},-1\right)$, 오른쪽 반에서 포물선 아래 부분 음영]
      criteria: ['3-2.M1']
    - id: 32b-2
      content: |
        $f(x)=2-bx^2$과 정사각형의 윗변과 아랫변이 만나는 점을 $x>0$범위에서 구해보면 각각 점 $\left(\dfrac{1}{\sqrt b},1\right)$, 점 $\left(\dfrac{\sqrt3}{\sqrt b},-1\right)$이다.
      criteria: ['3-2.A1']
    - id: 32b-3
      content: |
        따라서 위 부분의 넓이는
        $$1=\frac{2}{\sqrt b}+\int_{\frac{1}{\sqrt b}}^{\frac{\sqrt3}{\sqrt b}}(2-bx^2+1)dx$$
      criteria: ['3-2.M2']
    - id: 32b-4
      content: |
        이므로 이를 계산하면 ($\int_{1/\sqrt b}^{\sqrt3/\sqrt b}(3-bx^2)dx=\dfrac{2\sqrt3-\frac83}{\sqrt b}$) $\sqrt b=2\sqrt3-\dfrac23$을 얻을 수 있다.
      criteria: ['3-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 1
      evidence: |
        우함수이고 $b>3$인 개형에서 색칠된(오른쪽 반의 한 영역) 넓이가 $1$이어야 함을 적었다.
      depends_on: []
      implied_ok: false
      steps: [32b-1]
    - id: 3-2.A1
      mark_type: B
      points: 2
      evidence: |
        교점 $\left(\frac1{\sqrt b},1\right)$, $\left(\frac{\sqrt3}{\sqrt b},-1\right)$을 구했다.
      depends_on: []
      steps: [32b-2, 32a]
    - id: 3-2.M2
      mark_type: M
      points: 3
      evidence: |
        $1=\dfrac{2}{\sqrt b}+\displaystyle\int_{1/\sqrt b}^{\sqrt3/\sqrt b}(2-bx^2+1)dx$ 또는 동치인 넓이 식을 세웠다.
      depends_on: [3-2.M1]
      implied_ok: false
      steps: [32b-3, 32a]
    - id: 3-2.A2
      mark_type: A
      points: 3
      evidence: |
        $\sqrt b=2\sqrt3-\dfrac23$을 얻었다.
      depends_on: [3-2.M2]
      steps: [32b-4]
    deductions: []
