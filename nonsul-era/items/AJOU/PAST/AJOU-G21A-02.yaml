stimuli:
- label: 가
  body: |
    [그림 2-1]과 같이 삼등분 된 모양의 깃발에 인접한 영역을 다른 색으로 칠한 것을 삼색기라 한다. 이때 회전하거나 뒤집어서 두 깃발이 같아지더라도 이들은 서로 다른 것으로 간주한다.
    [그림 2-1: 세로로 삼등분된 직사각형 깃발 — 왼쪽부터 연회색, 흰색, 진회색 영역]
    양의 정수 $k$에 대하여, $k$가지의 색을 사용하여 삼색기를 만드는 경우의 수를 $r(k)$라 하자. 예를 들어, 삼색기의 이웃하는 영역은 서로 다른 색을 가져야 하므로 곱의 법칙에 의해 $r(2)=2\times1\times1=2$이고, $r(3)=3\times2\times2=12$ 임을 알 수 있다.
- label: 나
  body: |
    양의 정수 $n(n\ge2)$에 대하여, $n$개의 직사각형으로 구성된 깃발이 있고, $1\le k\le n$인 정수 $k$에 대하여 $k$번째 직사각형의 가로의 길이는 $\dfrac1k$이고 세로의 길이는 $1$로 일정하다. 각 $k$번째 직사각형을 $k+1$개의 합동인 작은 직사각형으로 다시 쪼개어 이 중 한 개를 검은색으로 색칠하고 나머지는 검은색이 아닌 색으로 칠한다. 검은색으로 칠해진 모든 직사각형의 넓이의 합을 $b_n$, 나머지 부분의 넓이를 $a_n$이라 하자. [그림 2-2]는 $n=3$일 때 그려지는 깃발의 예이다.
    [그림 2-2: 가로 $1$, $\frac12$, $\frac13$, 세로 $1$인 세 직사각형을 이어 붙인 깃발. 첫째는 가로로 2등분해 위쪽을, 둘째는 3등분해 가운데를, 셋째는 4등분해 맨 위를 검게 칠함]
- label: 다
  body: |
    가로와 세로의 길이가 모두 $2$인 정사각형 모양의 깃발이 [그림 2-3]의 왼쪽 그림과 같이 좌표평면에 놓여있다. 이때 정사각형의 각 변은 직선 $x=1$, $x=-1$, $y=1$, $y=-1$ 의 일부이다. 함수 $f(x)$에 대하여, 깃발이 $y=f(x)$의 그래프와 $y$축에 의하여 같은 넓이를 가진 네 영역으로 나눠질 때, $f(x)$가 ‘균형 잡힌 깃발’을 만든다고 하자. 예를 들어 깃발이 $f(x)=\dfrac12\sin2\pi x$의 그래프와 $y$축에 의하여 같은 넓이를 가진 네 영역으로 나눠지므로 함수 $f(x)$가 균형 잡힌 깃발을 만든다. ([그림 2-3] 참조)
    [그림 2-3: 왼쪽은 꼭짓점 $(\pm1,\pm1)$인 정사각형. 오른쪽은 같은 정사각형에 $y=\frac12\sin2\pi x$의 그래프를 그리고, 그래프 아래의 왼쪽 영역과 그래프 위의 오른쪽 영역을 음영 처리한 그림]

stem: |
  다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 2-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (1) $\displaystyle\sum_{k=2}^{n}r(k)$을 $n$에 대한 식으로 나타내어라.
  points: 5
  depends_on: []
  answer: {kind: expression, value: '(n-1)*n*(n+1)*(3*n-2)/12', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $r(k)=k(k-1)^2$이고 $\ell=k-1$로 바꾸면 $\sum(\ell^3+\ell^2)$이다.
    steps:
    - id: 11a
      content: |
        $\sum_{\ell=1}^{n-1}(\ell^3+\ell^2)=\frac{1}{12}(n-1)n(n+1)(3n-2)$
      criteria: ['1-1.M1', '1-1.A1']
    hint_ladder:
    - 가운데 영역은 양옆과 달라야 한다. 양 끝 영역끼리는?
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $k$가지 색을 사용해서 삼색기를 칠하는 방법의 수는 깃발의 이웃하는 영역을 서로 다른 색을 칠하는 경우의 수이다. 이는 곱의 법칙에 의해 $r(k)=k(k-1)(k-1)$이 된다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        $$\sum_{k=2}^{n}r(k)=\sum_{k=2}^{n}k(k-1)(k-1)=\sum_{\ell=1}^{n-1}(\ell+1)\ell^2=\sum_{\ell=1}^{n-1}\ell^3+\sum_{\ell=1}^{n-1}\ell^2=\left(\frac{(n-1)n}{2}\right)^2+\frac{(n-1)n(2n-1)}{6}=\frac{1}{12}(n-1)n(n+1)(3n-2)$$
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        곱의 법칙으로 $r(k)=k(k-1)^2$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [11b-1, 11a]
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        $\dfrac{1}{12}(n-1)n(n+1)(3n-2)$ 또는 동치식을 얻었다.
      depends_on: [1-1.M1]
      steps: [11b-2, 11a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    [문제 2-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (2) $5$가지의 색을 사용한 $r(5)$개의 모든 삼색기 중에서 임의로 $2$개를 골랐을 때, 각 깃발에 사용된 색의 집합이 서로소일 확률을 구하여라.
  points: 8
  depends_on: []
  answer: {kind: value, value: '9/158', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 색 5개뿐이므로 (2색, 2색) 또는 (3색, 2색) 조합만 서로소가 될 수 있다.
    steps:
    - id: 12a
      content: |
        $\dfrac{60+120}{{}_{80}\mathrm{C}_2}=\dfrac{180}{3160}=\dfrac{9}{158}$
      criteria: ['1-2.M1', '1-2.A3']
    hint_ladder:
    - 한 삼색기는 색을 2개 또는 3개 쓴다.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        5가지 색으로 만드는 삼색기의 총 경우의 수 $r(5)=5\times4^2=80$이므로 이 중 두 개의 깃발을 뽑는 경우의 수는 ${}_{80}\mathrm{C}_2=40\times79=3160$이다. 각 삼색기를 색칠하기 위해서는 두 개 혹은 세 개의 색을 사용해야 한다. 골라진 두 깃발 모두가 세 개의 색을 사용하고 서로 중복되는 색이 사용되지 않았다면 최소 여섯 개의 색이 필요하다. 따라서 주어진 조건을 만족하기 위해서는 두 깃발 모두 두 개의 색을 사용하거나(①), 한 깃발은 세 개의 색, 다른 깃발은 두 개의 색을 사용(②)하여야 한다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        ① 두 깃발 모두 두 개의 색을 쓰는 경우: ${}_5\mathrm{C}_2\times2\times{}_3\mathrm{C}_2\times2\times\dfrac12=60$
      criteria: ['1-2.A1']
    - id: 12b-3
      content: |
        ② 한 깃발은 세 개의 색, 다른 깃발은 두 개의 색을 쓰는 경우: ${}_5\mathrm{C}_3\times3!\times{}_2\mathrm{C}_2\times2=120$
      criteria: ['1-2.A2']
    - id: 12b-4
      content: |
        ①과 ②에 따라서 원하는 확률은 $\dfrac{60+120}{3160}=\dfrac{9}{158}$
      criteria: ['1-2.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: |
        서로소가 되려면 (2색·2색) 또는 (3색·2색)이어야 함을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [12b-1, 12a]
    - id: 1-2.A1
      mark_type: A
      points: 2
      evidence: |
        ①의 경우의 수 $60$을 구했다.
      depends_on: [1-2.M1]
      steps: [12b-2]
    - id: 1-2.A2
      mark_type: A
      points: 2
      evidence: |
        ②의 경우의 수 $120$을 구했다.
      depends_on: [1-2.M1]
      steps: [12b-3]
    - id: 1-2.A3
      mark_type: A
      points: 2
      evidence: |
        전체 ${}_{80}\mathrm{C}_2=3160$으로 나눠 확률 $\dfrac{9}{158}$을 얻었다.
      depends_on: [1-2.M1]
      steps: [12b-4, 12a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    [문제 2-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (3) 아래의 그림과 같은 모양을 가진 두 깃발 $A$와 $B$가 있다. $3$가지의 색을 이용하여 인접한 영역이 서로 다른 색을 가지도록 칠하는 경우의 수를 각각 구하여라. (단, 회전하거나 뒤집어서 두 깃발이 같아지더라도 이들은 서로 다른 것으로 간주한다.)
    [그림: 깃발 $A$는 2행 3열, 깃발 $B$는 2행 5열의 합동인 정사각형 칸으로 이루어진 직사각형]
  points: 9
  depends_on: []
  answer: {kind: value, value: 'A=54; B=486', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 한 열(위·아래 두 칸)의 색 쌍은 6가지이고, 다음 열은 앞 열 쌍에 따라 3가지씩 가능하다.
    steps:
    - id: 13a
      content: |
        $A=6\cdot3\cdot3=54$, $B=6\cdot3^4=486$ (또는 $B=a\times\frac a6$)
      criteria: ['1-3.M1', '1-3.A1']
    hint_ladder:
    - 왼쪽 첫 열의 두 칸을 칠하는 방법은 몇 가지인가?
    - B의 가운데 열을 공유하는 두 개의 A로 볼 수 있다.
  - id: S13-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        ⅰ) 깃발 A를 칠하는 경우: 영역을 윗줄 ①②③, 아랫줄 ④⑤⑥이라 하자. 먼저 ②영역과 ④영역의 색이 같은 경우를 생각하면 ①과 ②의 색 선택은 모두 $3\times2$가지 경우가 있고, ③과 ⑤의 색이 같은 경우(4가지)와 다른 경우(2가지)를 고려하면, 경우의 수는 곱의 법칙에 의해 $6\times(4+2)=36$가지이다. 비슷하게 ②영역과 ④영역의 색이 다른 경우를 생각하면 $6\times(2+1)=18$가지이다. 따라서 $A$를 칠하는 경우의 수를 $a$라 하면, $a=36+18=54$이다.
      criteria: ['1-3.M1']
    - id: 13b-2
      content: |
        ⅱ) 깃발 $B$를 칠하는 경우: 깃발 $B$를 칠하기 위해 오른쪽 세 열(가운데 열의 칸을 ③, ⑥이라 표시)을 $A$와 모양이 동일한 부분으로 생각하자. ③, ⑥ 부분에 칠할 수 있는 경우의 수는 모두 6가지이므로 ③, ⑥의 색이 정해져 있다면 표시된 부분을 색칠할 수 있는 경우의 수는 $\dfrac a6$가지. 따라서 $B$를 색칠하는 경우의 수는 먼저 처음 세 줄을 색칠하고($a$가지) 뒤의 두 줄을 색칠하는($\dfrac a6$가지)를 색칠하는 경우와 같으므로 곱의 법칙에 의해 $a\times\dfrac a6=486$이다.
      criteria: ['1-3.A1']
  rubric:
