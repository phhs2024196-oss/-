- id: '3-2'
  stem: |
    [문제 1-3] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (2) 실수 $d$에 대하여 두 함수 $f(x)=\sin2x+d$ 와 $g(x)=-\left\lvert x-\dfrac{\pi}{2}\right\rvert$이 $x=a$에서 부드럽게 만난다고 하자. $f(x)$에서 $g(x)$로 $x=a$에서 갈아타는 함수의 최댓값을 $M$이라 하면, $M$이 가장 클 때의 $d$의 값을 구하여라.
  points: 11
  depends_on: []
  answer: {kind: value, value: 'sqrt(3)/2 - pi/6', equivalents: [], tolerance: null}
  solutions:
  - id: S32-A
    audience: A
    method_no: 1
    key_idea: $M=\max(d+1,0)$이고 $d+1>0$이려면 $\lvert a-\frac\pi2\rvert<2$, 기울기 $\pm1$ 조건으로 $a=\frac\pi6$ 또는 $\frac{2\pi}{3}$만 후보.
    steps:
    - id: 32a
      content: |
        $a=\frac{2\pi}{3}$에서 $d=\frac{\sqrt3}{2}-\frac{\pi}{6}$, $d+1>0$
      criteria: ['3-2.M1', '3-2.A2']
    hint_ladder:
    - 갈아타는 함수의 최댓값 후보는 무엇인가?
    - $a$가 $\frac\pi2$의 왼쪽인지 오른쪽인지에 따라 $g^{\prime}(a)$가 다르다.
  - id: S32-B
    audience: B
    source_flow: 모범답안 p.27–28
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        함수 $f(x)$와 $g(x)$가 $x=a$에서 부드럽게 만나므로, $f(a)=g(a)$이고 $a\ne\dfrac\pi2$이며, $f^{\prime}(a)=g^{\prime}(a)$이다. $f(a)=g(a)$로부터, $d=-\sin2a-\left\lvert a-\dfrac\pi2\right\rvert$가 된다. $f(x)$에서 $g(x)$로 $x=a$에서 갈아타는 함수의 최댓값 $M$은 $d+1$ 혹은 $0$이다. 따라서 $1+d>0$인 $d$의 존재여부와 존재하는 경우 그 최댓값을 살펴보면 된다.
      criteria: ['3-2.M1']
    - id: 32b-2
      content: |
        $\left\lvert a-\dfrac\pi2\right\rvert\ge2$이면 $1+d=1-\sin2a-\left\lvert a-\dfrac\pi2\right\rvert\le0$ 이므로 $\left\lvert a-\dfrac\pi2\right\rvert<2$이라 가정하자. 먼저 $a\le\dfrac\pi2$라 하자. $f^{\prime}(a)=g^{\prime}(a)$로부터 $2\cos2a=1$이므로 $a=\dfrac\pi6+k\pi$ 혹은 $a=\dfrac{5\pi}{6}+k\pi$ (단, $k$는 정수) 꼴이고 이 중 범위를 만족하는 $a$는 $\dfrac\pi6$ 뿐이다. 이때 $d+1=-\dfrac{\sqrt3}{2}-\left\lvert\dfrac\pi6-\dfrac\pi2\right\rvert+1=-\dfrac{\sqrt3}{2}-\dfrac\pi3+1<0$ 이다.
      criteria: ['3-2.A1']
    - id: 32b-3
      content: |
        $a>\dfrac\pi2$인 경우를 살펴보자. $f^{\prime}(a)=g^{\prime}(a)$로부터 $2\cos2a=-1$이므로 $a=\dfrac\pi3+k\pi$ 혹은 $a=\dfrac{2\pi}{3}+k\pi$ (단, $k$는 정수) 꼴이고 이 중 범위를 만족하는 $a$는 $\dfrac{2\pi}{3}$ 뿐이다. 이때 $d+1=\dfrac{\sqrt3}{2}-\dfrac\pi6+1>0$이다. 따라서 $M$이 최대가 되는 경우는 $a=\dfrac{2\pi}{3}$이고 $d=\dfrac{\sqrt3}{2}-\dfrac\pi6$일 때이다.
        [그림: $y=\sin2x+d$와 $y=-\lvert x-\frac\pi2\rvert$, 점선 $x=a$]
      criteria: ['3-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 3
      evidence: |
        $d=-\sin2a-\left\lvert a-\frac\pi2\right\rvert$이고 $M$은 $d+1$ 또는 $0$이므로 $1+d>0$인 경우를 조사하면 됨을 적었다.
      depends_on: []
      implied_ok: false
      steps: [32b-1, 32a]
    - id: 3-2.A1
      mark_type: A
      points: 3
      evidence: |
        $\lvert a-\frac\pi2\rvert<2$로 제한하고 $a\le\frac\pi2$인 경우 $a=\frac\pi6$에서 $d+1<0$임을 보였다.
      depends_on: [3-2.M1]
      steps: [32b-2]
    - id: 3-2.A2
      mark_type: A
      points: 5
      evidence: |
        $a>\frac\pi2$인 경우 $a=\frac{2\pi}{3}$, $d=\dfrac{\sqrt3}{2}-\dfrac\pi6$을 얻었다.
      depends_on: [3-2.M1]
      steps: [32b-3, 32a]
    deductions: []
