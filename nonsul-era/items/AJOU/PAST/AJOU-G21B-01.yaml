- id: '3-1'
  stem: |
    [문제 1-3] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (1) 실수 $b$와 $c$에 대하여 두 함수 $f(x)=-x^4-2x^2+b$ 와 $g(x)=-\dfrac43x^3-4x+c$ 가 $x=a$에서 부드럽게 만난다고 하자. $f(x)$에서 $g(x)$로 $x=a$에서 갈아타는 함수의 최댓값이 $20$ 일 때 $3(a+b+c)$의 값을 구하여라.
  points: 9
  depends_on: []
  answer: {kind: value, value: '130', equivalents: [], tolerance: null}
  solutions:
  - id: S31-A
    audience: A
    method_no: 1
    key_idea: 미분계수 조건에서 $a=1$, $g$는 $x\ge1$에서 감소하므로 최댓값은 $(-\infty,1]$에서 $f$의 최댓값 $f(0)=b$.
    steps:
    - id: 31a
      content: |
        $a=1$, $b=20$, $c=17+\frac{16}{3}$, $3(a+b+c)=130$
      criteria: ['3-1.M1', '3-1.A1', '3-1.A2']
    hint_ladder:
    - $f^{\prime}(a)=g^{\prime}(a)$를 인수분해하자.
  - id: S31-B
    audience: B
    source_flow: 모범답안 p.27
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $f(x)=-x^4-2x^2+b$와 $g(x)=-\dfrac43x^3-4x+c$가 $x=a$에서 부드럽게 만나므로 $f(a)=g(a)$이고 $f^{\prime}(a)=g^{\prime}(a)$이다. 즉, $-4a^3-4a=-4a^2-4$로부터, $4(a^2+1)(a-1)=0$이므로 $a=1$이다.
      criteria: ['3-1.M1']
    - id: 31b-2
      content: |
        한편, $g(x)$는 $x\ge1$에서 감소하므로 $h(x)$의 최댓값은 구간 $(-\infty,1]$에서 $f(x)$의 최댓값과 같고, 따라서 $f(x)$의 극댓값 혹은 $f(1)$에서 최댓값을 가진다. $f^{\prime}(x)=-4(x^2+1)x=0$의 실수해는 $x=0$이므로 $f(0)$와 $f(1)$의 값을 비교하면 $f(0)=b$이고 $f(1)=b-6$[판독확인: 원문 그대로. $f(1)=-1-2+b=b-3$의 오기로 보임]이므로 $b$ 최댓값이다. 즉, $b=20$이다.
      criteria: ['3-1.A1']
    - id: 31b-3
      content: |
        $f(1)=g(1)$로부터, $-3+b=-\dfrac{16}{3}+c$이고 $c=17+\dfrac{16}{3}$이다. 따라서 $3(a+b+c)=3\left(1+20+17+\dfrac{16}{3}\right)=130$ 이다.
      criteria: ['3-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 2
      evidence: |
        $f^{\prime}(a)=g^{\prime}(a)$에서 $a=1$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [31b-1, 31a]
    - id: 3-1.A1
      mark_type: R
      points: 4
      evidence: |
        $g$가 $x\ge1$에서 감소함과 $f(0)$, $f(1)$ 비교로 최댓값이 $b$임을 밝혀 $b=20$을 얻었다.
      depends_on: [3-1.M1]
      steps: [31b-2, 31a]
    - id: 3-1.A2
      mark_type: A
      points: 3
      evidence: |
        $f(1)=g(1)$에서 $c=17+\dfrac{16}{3}$, $3(a+b+c)=130$을 얻었다.
      depends_on: [3-1.M1]
      steps: [31b-3, 31a]
