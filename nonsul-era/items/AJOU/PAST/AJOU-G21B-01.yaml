stimuli:
- label: 가
  body: |
    두 함수 $f(x)$와 $g(x)$에 대하여 $f(a)=g(a)$를 만족하면 두 함수 $f(x)$와 $g(x)$가 $x=a$에서 ‘만난다’고 하고, 함수
    $$h(x)=\begin{cases}f(x)&(x\le a)\\g(x)&(x>a)\end{cases}$$
    를 $f(x)$에서 $g(x)$로 $x=a$에서 ‘갈아타는 함수’라 하자. 또한 $x=a$에서 만나는 두 함수 $f(x)$와 $g(x)$에 대하여, $f(x)$와 $g(x)$가 각각 $x=a$에서 미분가능하고 $f^{\prime}(a)=g^{\prime}(a)$이면, 두 함수 $f(x)$와 $g(x)$가 $x=a$에서 ‘부드럽게 만난다’고 하자.
    예를 들어, 두 함수 $f(x)=x^2+2x$ 와 $g(x)=-x^2+2x$ 에 대하여, $f(0)=g(0)=0$이고 $f^{\prime}(0)=g^{\prime}(0)=2$ 이므로 $f(x)$와 $g(x)$는 $x=0$에서 부드럽게 만난다. [그림 1-1]은 $f(x)$ 에서 $g(x)$로 $x=0$ 에서 갈아타는 함수의 그래프이다.
    [그림 1-1: $x\le0$에서 $y=x^2+2x$(극소 $(-1,-1)$), $x>0$에서 $y=-x^2+2x$(극대 $(1,1)$)를 실선으로 이은 그래프. 원점 근처에서 두 포물선의 나머지 부분은 점선]
- label: 나
  body: |
    실수 전체에서 미분가능한 함수 $f(x)$에 대하여, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 기울기는 $x=a$에서의 미분계수 $f^{\prime}(a)$와 같다. 즉, 곡선 위의 점 $\mathrm{P}$에서의 접선의 방정식을 $y=g(x)$라 하면 $g(a)=f(a)$이고, $g^{\prime}(a)=f^{\prime}(a)$이므로, $f(x)$와 $g(x)$는 $x=a$에서 부드럽게 만난다. 따라서 임의의 실수 $a$에 대해서 $f(x)$와 $x=a$에서 부드럽게 만나는 직선은 존재한다.
    함수 $f(x)$와 두 점에서 부드럽게 만나는 이차함수는 존재하지 않을 수 있다. 가령 함수 $f(x)=e^x$과 $x=0$, $x=2$에서 동시에 만나는 이차함수는 항상 찾을 수 있지만, 두 점 모두에서 부드럽게 만나는 이차함수는 존재하지 않는다.

stem: |
  다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (1) 실수 $c$에 대하여 두 함수 $f(x)=x^2-3x-6$과 $g(x)=x^3-4x+c$가 $x=a$에서 부드럽게 만난다. $a$가 정수가 아닐 때, $27c$의 값을 구하여라.
  points: 7
  depends_on: []
  answer: {kind: value, value: '-167', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $f^{\prime}(a)=g^{\prime}(a)$에서 $a=-\frac13$, 함숫값 조건으로 $c$.
    steps:
    - id: 11a
      content: |
        $3a^2-2a-1=0\Rightarrow a=-\frac13$, $27c=-167$
      criteria: ['1-1.M1', '1-1.A1']
    hint_ladder:
    - 미분계수 조건만으로 $a$가 정해진다.
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.25
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        두 함수 $f(x)=x^2-3x-6$과 $g(x)=x^3-4x+c$가 $x=a$에서 부드럽게 만나므로 $f(a)=g(a)$이고 $f^{\prime}(a)=g^{\prime}(a)$이다. 즉, $a^2-3a-6=a^3-4a+c$ 이고 $2a-3=3a^2-4$이다. 이를 풀면 $2a-3=3a^2-4$로부터, $3a^2-2a-1=(3a+1)(a-1)=0$ 이 되고 $a$는 정수가 아니므로 $a=-\dfrac13$이다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        이제 $a^2-3a-6=a^3-4a+c$에 $a=-\dfrac13$을 대입하면 $\dfrac19+1-6=-\dfrac{1}{27}+\dfrac43+c$이므로 $27c=-167$이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        두 조건을 세우고 $(3a+1)(a-1)=0$에서 $a=-\dfrac13$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [11b-1, 11a]
    - id: 1-1.A1
      mark_type: A
      points: 4
      evidence: |
        $a=-\dfrac13$을 대입해 $27c=-167$을 얻었다.
      depends_on: [1-1.M1]
      steps: [11b-2, 11a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (2) 두 함수 $f(x)=x^4-2x^2-2x$와 $g(x)=\dfrac32x^2-5x+\dfrac12$이 $x=a$에서 부드럽게 만난다. 함수 $h(x)$를 $f(x)$에서 $g(x)$로 $x=a$에서 갈아타는 함수라고 할 때, $\displaystyle\int_0^2h(x)dx$를 계산하여라.
  points: 8
  depends_on: []
  answer: {kind: value, value: '-149/30', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 미분계수 조건의 세 근 중 함숫값 조건을 만족하는 $a=1$을 고르고 구간을 나눠 적분한다.
    steps:
    - id: 12a
      content: |
        $a=1$, $\int_0^1f+\int_1^2g=-\frac{149}{30}$
      criteria: ['1-2.M1', '1-2.A1']
    hint_ladder:
    - $4a^3-7a+3$을 인수분해하자.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.25
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $f(x)$와 $g(x)$가 $x=a$에서 부드럽게 만나므로 $f(a)=g(a)$이고 $f^{\prime}(a)=g^{\prime}(a)$이다. 즉, $a^4-2a^2-2a=\dfrac32a^2-5a+\dfrac12$이고 $4a^3-4a-2=3a-5$이다. 이를 풀면 $4a^3-7a+3=(a-1)(2a-1)(2a+3)=0$이고 따라서 가능한 $a$의 값은 $1$, $\dfrac12$, $-\dfrac32$ 이다. 이 중 $a^4-2a^2-2a=\dfrac32a^2-5a+\dfrac12$ 을 만족하는 것을 찾으면 $a=1$ 이다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        따라서 $h(x)$는 $f(x)$에서 $g(x)$로 $x=1$에서 갈아타는 함수이고, 주어진 식을 계산하면 아래와 같다.
        $$\int_0^2h(x)dx=\int_0^1f(x)dx+\int_1^2g(x)dx=\left[\frac{x^5}{5}-\frac{2x^3}{3}-x^2\right]_0^1+\left[\frac{x^3}{2}-\frac{5x^2}{2}+\frac x2\right]_1^2=\left(\frac15-\frac23-1\right)+\left(4-10+1-\frac12+\frac52-\frac12\right)=-\frac{149}{30}$$
      criteria: ['1-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 4
      evidence: |
        $(a-1)(2a-1)(2a+3)=0$의 후보 중 함숫값 조건으로 $a=1$을 골랐다.
      depends_on: []
      implied_ok: false
      steps: [12b-1, 12a]
    - id: 1-2.A1
      mark_type: A
      points: 4
      evidence: |
        $\int_0^1f+\int_1^2g=-\dfrac{149}{30}$을 계산했다.
      depends_on: [1-2.M1]
      steps: [12b-2, 12a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 1-2] 제시문 (나)를 읽고 다음 물음에 답하여라.
    (1) 양의 정수 $n$에 대해, 함수 $f(x)=2^x$과 $x=n$에서 부드럽게 만나는 직선의 방정식을 $y=a_nx+b_n$ (단, $a_n$, $b_n$은 실수)라 할 때, $\displaystyle\sum_{n=1}^{100}\frac{b_n}{a_n}$의 값을 구하여라.
  points: 7
  depends_on: []
  answer: {kind: value, value: '100/log(2) - 5050', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: 접선이므로 $a_n=2^n\ln2$, $b_n=2^n-n2^n\ln2$, $\frac{b_n}{a_n}=\frac1{\ln2}-n$.
    steps:
    - id: 21a
      content: |
        $\sum_{n=1}^{100}\left(\frac1{\ln2}-n\right)=\frac{100}{\ln2}-5050$
      criteria: ['2-1.M1', '2-1.A1']
    hint_ladder:
    - 제시문 (나)에 의해 부드럽게 만나는 직선은 접선이다.
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.26
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        양의 정수 $n$에 대해, $y=2^x$와 $x=n$에서 부드럽게 만나는 직선의 방정식은 $x=n$에서의 접선이다. $f^{\prime}(n)=2^n\ln2$이고 점 $(n,2^n)$을 지나므로 접선의 방정식은 $y-2^n=2^n\ln2(x-n)$가 되어 $a_n=\ln2\,(e^{n\ln2})=2^n\ln2$ 이고, $b_n=2^n-n2^n\ln2$ 이다.
      criteria: ['2-1.M1']
    - id: 21b-2
      content: |
        따라서 $\displaystyle\sum_{n=1}^{100}\frac{b_n}{a_n}=\sum_{n=1}^{100}\left(\frac{1}{\ln2}-n\right)=\frac{100}{\ln2}-5050$ 이다.
      criteria: ['2-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 4
      evidence: |
        접선에서 $a_n=2^n\ln2$, $b_n=2^n-n2^n\ln2$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [21b-1, 21a]
    - id: 2-1.A1
      mark_type: A
      points: 3
      evidence: |
        $\dfrac{100}{\ln2}-5050$을 얻었다.
      depends_on: [2-1.M1]
      steps: [21b-2, 21a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    [문제 1-2] 제시문 (나)를 읽고 다음 물음에 답하여라.
    (2) 함수 $f(x)=e^x$과 이차함수 $g(x)$는 $x=0$에서 부드럽게 만나고 $x=2$에서 만난다. 점 $\mathrm{P}(2,e^2)$에서 $y=f(x)$의 접선과 점 $\mathrm{P}$에서의 $y=g(x)$의 접선이 이루는 예각을 $\theta$라 할 때, $\tan\theta$의 값을 구하여라.
  points: 8
  depends_on: []
  answer: {kind: value, value: '2/(exp(2)-1)**2', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: $g(x)=\frac{e^2-3}{4}x^2+x+1$, 두 기울기 $e^2$, $e^2-2$로 덧셈정리.
    steps:
    - id: 22a
      content: |
        $\tan\theta=\frac{e^2-(e^2-2)}{1+e^2(e^2-2)}=\frac{2}{(e^2-1)^2}$
      criteria: ['2-2.M1', '2-2.A2']
    hint_ladder:
    - $g(0)$, $g^{\prime}(0)$, $g(2)$ 세 조건으로 이차함수를 정하자.
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.26
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $g(x)=px^2+qx+r$이라 하자. $g(0)=f(0)$로부터 $r=1$이고 $g^{\prime}(0)=f^{\prime}(0)$로부터 $q=1$이다. $g(2)=f(2)$로부터 $p=\dfrac{e^2-3}{4}$이므로 $g(x)=\dfrac{e^2-3}{4}x^2+x+1$이다.
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
