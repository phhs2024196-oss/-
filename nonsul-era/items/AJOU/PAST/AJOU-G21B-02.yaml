intent: |
  공을 꺼낸 뒤 같은 색 공을 더 넣는 주머니(폴리아 항아리) 시행에서 확률의 덧셈정리·조건부확률·각 경로 확률이 같다는 성질을 이용하고, 넣는 개수가 수열 $a_n$으로 주어질 때 기댓값·분산과 수열의 결정(3진 표현·부등식 최소성)을 추론하는 능력을 본다.
key_idea: |
  특정 색 개수 조합으로 가는 모든 경로의 확률이 같으므로 이항계수 × 한 경로 확률로 센다. (나)에서 총 공의 수로 $a_n$을 결정하고, 흰 공 수를 $a_n$들의 부분합으로 표현한다.
stuck: |
  2-1 (3)에서 경로 확률이 순서와 무관함을 보는 것, 2-2 (2)에서 $546$을 $2\cdot3^k$들의 합으로 유일하게 표현, 2-2 (3)에서 $a_n\ge n-1$과 총합 조건으로 $a_n$을 결정하는 것
