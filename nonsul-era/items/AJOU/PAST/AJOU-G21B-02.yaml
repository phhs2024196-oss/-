stimuli:
- label: 가
  body: |
    주머니에 빨간 공이 $r$개, 파란 공이 $b$개 있다. 주머니에서 공 하나를 임의로 꺼내서 색을 확인한 다음 다시 주머니에 넣고, 방금 꺼낸 공과 같은 색의 공을 하나 더 가져와 주머니에 넣는 것을 1회 시행이라고 하자. 즉, 시행을 1회 할 때마다 주머니 속의 공의 개수는 하나씩 늘어난다. 예를 들어 $r=2$이고 $b=1$인 경우 첫 번째 시행에서 꺼낸 공이 파란 공이면, 첫 번째 시행을 마친 직후 주머니에는 빨간 공과 파란 공이 각각 정확히 2개씩 있다.
- label: 나
  body: |
    주머니에 빨간 공이 $r$개, 파란 공이 $b$개, 흰 공이 $w$개 있다. 수열 $\{a_n\}$을 음이 아닌 정수로 이루어진 수열이라고 하자. 양의 정수 $n$에 대하여 $n$번째 시행에서 공 하나를 임의로 꺼내서 색을 확인한 다음 다시 주머니에 넣고, 방금 꺼낸 공과 같은 색의 공을 $a_n$개 더 가져와 주머니에 넣는다. 예를 들어 $r=1$, $b=w=2$이고 $a_n=3n$인 경우, 첫 번째 시행에서 꺼낸 공이 빨간 공이면 첫 번째 시행을 마친 직후 주머니에는 빨간 공이 4개, 파란 공과 흰 공이 각각 2개씩 있다. 두 번째 시행에서 꺼낸 공이 파란 공이면, 두 번째 시행을 마친 직후 주머니에는 빨간 공이 4개, 파란 공이 8개, 흰 공이 2개 있다.

stem: |
  다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 2-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (1) $r$과 $b$가 양의 정수일 때, 두 번째 시행에서 꺼낸 공이 빨간 공일 확률을 $r$, $b$에 대한 식으로 나타내어라.
  points: 6
  depends_on: []
  answer: {kind: expression, value: 'r/(r+b)', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 첫 공의 색으로 나눠 더하면 $\frac{r(r+1)+br}{(r+b)(r+b+1)}=\frac{r}{r+b}$.
    steps:
    - id: 11a
      content: |
        $\frac{r}{r+b}\cdot\frac{r+1}{r+b+1}+\frac{b}{r+b}\cdot\frac{r}{r+b+1}=\frac{r}{r+b}$
      criteria: ['1-1.M1', '1-1.M2', '1-1.A1']
    hint_ladder:
    - 첫 번째에 꺼낸 공의 색으로 경우를 나누자.
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.29
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        두 번째 시행에서 꺼낸 공이 빨간 공일 확률을 경우를 나눠서 계산하자. 첫 번째 공이 빨간 공인 경우의 확률은 $\dfrac{r}{r+b}\times\dfrac{r+1}{r+b+1}$이고,
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        첫 번째 공이 파란 공인 경우의 확률은 $\dfrac{b}{r+b}\times\dfrac{r}{r+b+1}$이다.
      criteria: ['1-1.M2']
    - id: 11b-3
      content: |
        따라서 확률의 덧셈정리에 의해 두 번째 시행에서 꺼낸 공이 빨간 공일 확률은 $\dfrac{r(r+1)+br}{(r+b)(r+b+1)}=\dfrac{r}{r+b}$이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        첫 공이 빨강인 경우 $\dfrac{r}{r+b}\times\dfrac{r+1}{r+b+1}$
      depends_on: []
      implied_ok: false
      steps: [11b-1, 11a]
    - id: 1-1.M2
      mark_type: M
      points: 2
      evidence: |
        첫 공이 파랑인 경우 $\dfrac{b}{r+b}\times\dfrac{r}{r+b+1}$
      depends_on: []
      implied_ok: false
      steps: [11b-2, 11a]
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        합을 정리해 $\dfrac{r}{r+b}$를 얻었다.
      depends_on: [1-1.M1, 1-1.M2]
      steps: [11b-3, 11a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    [문제 2-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (2) $r=2$ 이고 $b=1$ 이라 하자. 세 번째 시행에서 꺼낸 공이 빨간 공이었을 때, 두 번째 시행에서 꺼낸 공이 빨간 공이었을 확률을 구하여라.
  points: 7
  depends_on: []
  answer: {kind: value, value: '3/4', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 세 번째가 빨강인 네 경로의 확률을 구해 조건부확률을 계산한다.
    steps:
    - id: 12a
      content: |
        $\frac{24+6}{24+6+6+4}=\frac34$
      criteria: ['1-2.B1', '1-2.A1']
    hint_ladder:
    - 첫째·둘째 공의 색 조합 4가지를 나열하자.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.29
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        세 번째 시행에서 꺼낸 공이 빨간 공일 경우는 모두 4가지이다. 빨간 공을 꺼내는 시행을 R, 파란 공을 꺼내는 시행을 B이라 하고 각 경우의 확률을 구하면 아래와 같다.
        R-R-R : $\dfrac23\times\dfrac34\times\dfrac45=\dfrac{24}{60}$ $\cdots$ ①
      criteria: ['1-2.B1']
    - id: 12b-2
      content: |
        B-R-R : $\dfrac13\times\dfrac24\times\dfrac35=\dfrac{6}{60}$ $\cdots$ ②
      criteria: ['1-2.B2']
    - id: 12b-3
      content: |
        R-B-R : $\dfrac23\times\dfrac14\times\dfrac35=\dfrac{6}{60}$ $\cdots$ ③
      criteria: ['1-2.B3']
    - id: 12b-4
      content: |
        B-B-R : $\dfrac13\times\dfrac24\times\dfrac25=\dfrac{4}{60}$ $\cdots$ ④
      criteria: ['1-2.B4']
    - id: 12b-5
      content: |
        따라서 조건부확률은 $\dfrac{①+②}{①+②+③+④}=\dfrac{24+6}{24+6+6+4}=\dfrac34$이다.
      criteria: ['1-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.B1
      mark_type: B
      points: 1
      evidence: |
        R-R-R : $\dfrac{24}{60}$
      depends_on: []
      steps: [12b-1, 12a]
    - id: 1-2.B2
      mark_type: B
      points: 1
      evidence: |
        B-R-R : $\dfrac{6}{60}$
      depends_on: []
      steps: [12b-2]
    - id: 1-2.B3
      mark_type: B
      points: 1
      evidence: |
        R-B-R : $\dfrac{6}{60}$
      depends_on: []
      steps: [12b-3]
    - id: 1-2.B4
      mark_type: B
      points: 1
      evidence: |
        B-B-R : $\dfrac{4}{60}$
      depends_on: []
      steps: [12b-4]
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        조건부확률 $\dfrac{①+②}{①+②+③+④}=\dfrac34$을 얻었다.
      depends_on: []
      implied_ok: true
      steps: [12b-5, 12a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    [문제 2-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (3) $r=2$ 이고 $b=1$ 인 경우, $2021$회 시행을 마친 직후 주머니의 빨간 공과 파란 공의 개수가 같을 확률을 구하여라.
  points: 8
  depends_on: []
  answer: {kind: value, value: '1/2023', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 빨강 1010번·파랑 1011번 꺼내는 모든 경로의 확률이 같으므로 ${}_{2021}\mathrm{C}_{1010}\times$(한 경로 확률).
    steps:
    - id: 13a
      content: |
        ${}_{2021}\mathrm{C}_{1010}\cdot\frac{(2\cdots1011)(1\cdots1011)}{3\cdots2023}=\frac{1}{2023}$
      criteria: ['1-3.M1', '1-3.M2', '1-3.A1']
    hint_ladder:
    - 공 2024개에서 빨강·파랑이 같으려면 각 몇 개인가?
    - 한 경로의 확률은 꺼내는 순서에 따라 달라지는가?
  - id: S13-B
    audience: B
    source_flow: 모범답안 p.29
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        2021회 시행 직후 공의 수는 2024개이고 빨간 공과 파란 공의 개수가 1012개로 같아야 하므로 빨간 공은 1010번, 파란 공은 1011번 꺼내져야 한다.
      criteria: ['1-3.M1']
    - id: 13b-2
      content: |
        이렇게 공을 꺼내는 각 경우의 확률이 모두 $\dfrac{(2\times3\times4\times\cdots\times1011)\times(1\times2\times\cdots\times1011)}{3\times4\times\cdots\times2023}$와 같으므로 2021회 시행을 마친 직후 주머니의 빨간 공과 파란 공의 개수가 같을 확률은
        $${}_{2021}\mathrm{C}_{1010}\frac{(2\times3\times4\times\cdots\times1011)\times(1\times2\times\cdots\times1011)}{3\times4\times\cdots\times2023}$$
      criteria: ['1-3.M2']
    - id: 13b-3
      content: |
        $$=\frac{2021!}{1010!\times1011!}\cdot\frac{2\times(1011!)^2}{2023!}=\frac{2\times1011}{2022\times2023}=\frac{1}{2023}$$
        가 된다.
      criteria: ['1-3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 2
      evidence: |
        빨간 공 1010번, 파란 공 1011번 꺼내야 함을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [13b-1, 13a]
    - id: 1-3.M2
      mark_type: M
      points: 3
      evidence: |
        각 경로 확률이 같음을 이용해 ${}_{2021}\mathrm{C}_{1010}\times$(한 경로 확률) 식을 세웠다.
      depends_on: [1-3.M1]
      implied_ok: false
      steps: [13b-2, 13a]
    - id: 1-3.A1
      mark_type: A
      points: 3
      evidence: |
        $\dfrac{1}{2023}$을 얻었다.
      depends_on: [1-3.M2]
      steps: [13b-3, 13a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 2-2] 제시문 (나)를 읽고 다음 물음에 답하여라.
    (1) 수열 $\{a_n\}$이 $a_n=n$ 이고, $r=b=1$, $w=2$ 라 하자. 2회 시행을 마친 직후 주머니의 흰 공의 개수를 확률변수 $X$라 할 때, 기댓값 $\mathrm{E}(X)$와 분산 $\mathrm{V}(X)$를 구하여라.
  points: 9
  depends_on: []
  answer: {kind: expression, value: 'E=7/2; V=29/20', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: 흰 공(W)인지 아닌지(C)로만 나눠 4경우의 확률과 $X$를 표로 만든다.
    steps:
    - id: 21a
