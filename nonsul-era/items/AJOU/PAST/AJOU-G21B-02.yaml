- id: '2-3'
  stem: |
    [문제 2-2] 제시문 (나)를 읽고 다음 물음에 답하여라.
    (3) 수열 $\{a_n\}$은 모든 양의 정수 $n$에 대하여 $a_n<a_{n+1}$을 만족하는 음이 아닌 정수로 이루어진 수열이고, $r=b=w=1$ 이라 하자. $100$회 시행을 마친 직후 주머니의 빨간 공, 파란 공, 흰 공의 개수는 각각 $2$, $12$, $4940$이다. 파란 공을 꺼낸 횟수를 $m$이라 할 때, 가능한 $m$의 값을 모두 구하고 $\displaystyle\sum_{n=1}^{99}\frac{1}{\sqrt{a_n}+\sqrt{a_{n+1}}}$의 값을 구하여라.
  points: 11
  depends_on: []
  answer: {kind: expression, value: 'm=[1, 2, 3, 4]; sum=5 + 7*sqrt(2)/2', equivalents: ['sum=5+sqrt(98)/2'], tolerance: null}
  solutions:
  - id: S23-A
    audience: A
    method_no: 1
    key_idea: $a_n\ge n-1$이고 총합이 하한보다 1 크므로 $a_n=n-1$ ($n\le99$), $a_{100}=100$. 파란 공 증가분 $11$을 $\{0,2,3,\ldots\}$의 서로 다른 수의 합으로 만드는 개수를 본다.
    steps:
    - id: 23a
      content: |
        합 $=\sqrt{98}+\frac{10-\sqrt{98}}{2}=5+\frac{\sqrt{98}}{2}$, $m\in\{1,2,3,4\}$
      criteria: ['2-3.R1', '2-3.A1', '2-3.A2', '2-3.R2']
    hint_ladder:
    - 순증가하는 음이 아닌 정수열의 $a_n$은 최소 얼마인가?
    - 빨간 공이 1개만 늘었다면 $a_n=1$인 시행은 무엇을 꺼냈는가?
  - id: S23-B
    audience: B
    source_flow: 모범답안 p.30
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        수열 $\{a_n\}$이 모든 $n$에 대해 $a_n\ge0$, $a_{n+1}>a_n$이므로 $a_n\ge n-1$이다. $2+12+4940=4954=3+a_1+a_2+\cdots+a_{100}\ge3+0+1+\cdots+99=4953$ 이므로, $a_n\ge n-1$에 대하여 하나의 $n$을 제외하고 등호가 성립해야 한다. $n<100$일 때 $a_n\ge n$이면, $a_{n+1}\ge a_n+1=n+1$가 되어 전체 공의 개수는 4955 이상이라 모순이다. 따라서 $a_{100}=100$이고, $n\le99$ 이면 $a_n=n-1$이다.
      criteria: ['2-3.R1']
    - id: 23b-2
      content: |
        따라서,
        $$\sum_{n=1}^{99}\frac{1}{\sqrt{a_n}+\sqrt{a_{n+1}}}=\left(\sum_{n=1}^{98}\frac{1}{\sqrt{n-1}+\sqrt n}\right)+\frac{1}{\sqrt{100}+\sqrt{98}}=\sum_{n=1}^{98}(\sqrt n-\sqrt{n-1})+\frac{1}{\sqrt{100}+\sqrt{98}}=\sqrt{98}+\frac{10-\sqrt{98}}{2}=5+\frac{\sqrt{98}}{2}$$
        이다.
      criteria: ['2-3.A1']
    - id: 23b-3
      content: |
        한편 빨간 공의 개수가 $2=1+1$개이므로 두 번째 시행에서 반드시 빨간 공을 꺼내야 한다. 즉, 파란 공을 11개를 꺼내는 방법은 1을 사용하지 않아야 하므로, 11을 뽑는 방법은 아래와 같다.
        - 12번째 시행에서 파란 공을 꺼냄 (11개)
        - 1번째 시행과 12번째 시행에서 파란 공을 꺼냄 ($0+11=11$개)
        - 1번째, 3번째, 10번째 시행에서 파란 공을 꺼냄 ($0+2+9=11$개)
        - 1번째, 3번째, 4번째, 7번째 시행에서 파란 공을 꺼냄 ($0+2+3+6=11$개)
        - 1번째, 3번째, 5번째, 6번째 시행에서 파란 공을 꺼냄 ($0+2+4+5=11$개)
        따라서, $m=1,2,3,4$가 가능하다.
      criteria: ['2-3.A2']
    - id: 23b-4
      content: |
        공을 다섯 번 꺼내면 파란 공은 최소한 $1+(0+2+3+4+5)=15$개 이상이므로, $m\ge5$에서는 성립하지 않는다.
      criteria: ['2-3.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-3.R1
      mark_type: R
      points: 5
      evidence: |
        $a_n\ge n-1$과 총합 4954로 $a_{100}=100$, $n\le99$에서 $a_n=n-1$임을 논증했다.
      depends_on: []
      steps: [23b-1, 23a]
    - id: 2-3.A1
      mark_type: A
      points: 2
      evidence: |
        합 $5+\dfrac{\sqrt{98}}{2}$을 구했다.
      depends_on: [2-3.R1]
      steps: [23b-2, 23a]
    - id: 2-3.A2
      mark_type: A
      points: 2
      evidence: |
        $m=1,2,3,4$가 각각 가능함을 예로 보였다.
      depends_on: [2-3.R1]
      steps: [23b-3, 23a]
    - id: 2-3.R2
      mark_type: R
      points: 2
      evidence: |
        $m\ge5$이면 파란 공이 15개 이상이 되어 불가능함을 보였다.
      depends_on: [2-3.R1]
      steps: [23b-4, 23a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

