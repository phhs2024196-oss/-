- id: '2-2'
  stem: |
    [문제 2-2] 제시문 (나)를 읽고 다음 물음에 답하여라.
    (2) 수열 $\{a_n\}$은 양의 정수로 이루어진 수열이고, $r=b=w=1$ 이라 하자. $10$ 이하의 모든 양의 정수 $n$에 대하여 $n$회 시행을 마친 직후에는 주머니의 공의 개수가 $3^n+2$이고, $10$회 시행을 마친 직후 주머니의 흰 공의 개수는 $547$이다. $4$번째 시행을 마친 직후 주머니의 흰 공의 개수를 구하여라.
  points: 9
  depends_on: []
  answer: {kind: value, value: '61', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: $a_n=2\cdot3^{n-1}$이고 $546=2(3+3^3+3^5)$의 표현이 유일하므로 흰 공은 2, 4, 6번째에 뽑혔다.
    steps:
    - id: 22a
      content: |
        $1+2\cdot3+2\cdot3^3=61$
      criteria: ['2-2.M1', '2-2.R1', '2-2.A1']
    hint_ladder:
    - 공의 총수 조건에서 $a_n$을 먼저 구하자.
    - $546$을 $2\cdot3^k$들의 합으로 써 보자.
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.30
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $3+a_1+\cdots+a_n=3^n+2$이므로 $a_n=3^n-3^{n-1}=2\cdot3^{n-1}$이다.
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        $2\cdot3^6>546$이므로 $547-1=546$은 $2\cdot3^0,2\cdot3^1,\ldots,2\cdot3^5$의 조합만으로 이루어져야 한다. 한편, 그러한 조합은 $547=1+2(3+3^3+3^5)$으로 유일함을 알 수 있다. 즉, 흰 공은 2, 4, 6번째 뽑혔다.
      criteria: ['2-2.R1']
    - id: 22b-3
      content: |
        따라서 4번째 시행 직후 흰 공의 개수는 $1+6+54=61$ 개이다.
      criteria: ['2-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 2
      evidence: |
        $a_n=2\cdot3^{n-1}$을 구했다.
      depends_on: []
      implied_ok: false
