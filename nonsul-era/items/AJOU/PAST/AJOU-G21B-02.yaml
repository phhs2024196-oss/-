    - id: 2-2.R1
      mark_type: R
      points: 4
      evidence: |
        $546=2(3+3^3+3^5)$ 표현의 유일성으로 흰 공이 2, 4, 6번째에 뽑혔음을 밝혔다.
      depends_on: [2-2.M1]
      steps: [22b-2, 22a]
    - id: 2-2.A1
      mark_type: A
      points: 3
      evidence: |
        4번째 시행 직후 흰 공 $61$개를 얻었다.
      depends_on: [2-2.R1]
