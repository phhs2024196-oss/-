- id: '2-2'
  stem: |
    [문제 1-2] 제시문 (나)를 읽고 다음 물음에 답하여라.
    (2) $x>0$ 에서 정의된 함수 $f(x)=\ln3x$ 와 음이 아닌 정수 $n$에 대하여 $S_n$의 모든 원소의 곱을 $p_n$이라 할 때, $\displaystyle\sum_{n=0}^{\infty}p_n$을 구하여라.
  points: 9
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: $S_n=S_{n-2}\cup\left\{\frac{e^n}{3},\frac{e^{-n}}{3}\right\}$이므로 $p_n=\frac19p_{n-2}$, 곧 $p_n=\left(\frac13\right)^{n+1}$.
    steps:
    - id: 22a
      content: |
        $\sum_{n=0}^{\infty}\left(\frac13\right)^{n+1}=\frac12$
      criteria: ['2-2.M1', '2-2.A1', '2-2.A2']
    hint_ladder:
    - $\ln3x=\pm n$의 해 두 개를 곱하면?
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.44
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        먼저 $S_0=\left\{\dfrac13\right\}$이고, $\ln3x=\pm1$으로부터 $S_1=\left\{\dfrac e3,\dfrac{e^{-1}}{3}\right\}$이다. 따라서 $p_0=\dfrac13$이고 $p_1=\dfrac19$이다. $n\ge2$일 때 그래프의 개형으로부터 $S_n=S_{n-2}\cup\{x\mid\ln3x=\pm n\}=S_{n-2}\cup\left\{\dfrac{e^n}{3},\dfrac{e^{-n}}{3}\right\}$가 되므로 $p_n=p_{n-2}\times\dfrac19$이다.
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        따라서 $p_n=\dfrac13p_{n-1}$이 되고, 구하고자 하는 값은 첫째항이 $\dfrac13$이고 공비가 $\dfrac13$인 등비급수와 같으므로
      criteria: ['2-2.A1']
    - id: 22b-3
      content: |
        값은 $\dfrac{\frac13}{1-\frac13}=\dfrac12$ 이다.
      criteria: ['2-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 4
      evidence: |
        $p_0=\frac13$, $p_1=\frac19$과 $S_n=S_{n-2}\cup\left\{\frac{e^n}{3},\frac{e^{-n}}{3}\right\}$, $p_n=\frac19p_{n-2}$를 구했다.
