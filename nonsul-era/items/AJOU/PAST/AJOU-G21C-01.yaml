- id: '1-4'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (4) 양의 실수 $a$에 대하여, 함수 $f(x)$는 $y=a\tan^3\left(\dfrac{\pi x}{4}\right)$를 $y=0$에서 접어 올린 함수이다. $\displaystyle\int_{-1}^{1}f(x)\,dx=\frac4\pi$일 때 $a$의 값을 구하여라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1/(1 - log(2))', equivalents: [], tolerance: null}
  solutions:
  - id: S14-A
    audience: A
    method_no: 1
    key_idea: $f=\lvert a\tan^3\rvert$는 우함수이므로 $2a\int_0^1\tan^3\frac{\pi x}{4}dx=\frac4\pi$.
    steps:
    - id: 14a
      content: |
        $\int_0^1\tan^3\frac{\pi x}{4}dx=\frac2\pi(1-\ln2)$, $a=\frac{1}{1-\ln2}$
      criteria: ['1-4.M1', '1-4.A1']
    hint_ladder:
    - $\tan^3\theta=(\sec^2\theta-1)\tan\theta$
  - id: S14-B
    audience: B
    source_flow: 모범답안 p.43
    method_no: 1
    steps:
    - id: 14b-1
      content: |
        $y=a\tan^3\left(\dfrac{\pi x}{4}\right)$는 원점 대칭인 함수이므로 $y=f(x)$는 $y$축에 대하여 대칭인 함수이다. 즉, $\displaystyle\int_{-1}^{1}f(x)\,dx=2\int_0^1f(x)\,dx$이고, 구간 $[0,1]$에서 $\tan^3\left(\dfrac{\pi x}{4}\right)\ge0$이므로, $\displaystyle\int_0^1f(x)dx=\int_0^1a\tan^3\left(\frac{\pi x}{4}\right)dx$이다. 한편,
        $$\int_0^1\tan^3\left(\frac{\pi x}{4}\right)dx=\int_0^1\left(\sec^2\left(\frac{\pi x}{4}\right)-1\right)\tan\left(\frac{\pi x}{4}\right)dx=\frac2\pi\left[\tan^2\left(\frac{\pi x}{4}\right)\right]_0^1+\frac4\pi\left[\ln\left(\cos\left(\frac{\pi x}{4}\right)\right)\right]_0^1=\frac2\pi(1-\ln2)$$
      criteria: ['1-4.M1']
    - id: 14b-2
      content: |
        이므로, $\displaystyle\int_{-1}^1f(x)dx=2a\cdot\frac2\pi(1-\ln2)=\frac4\pi$ 이고, $a=\dfrac{1}{1-\ln2}$이다.
      criteria: ['1-4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-4.M1
      mark_type: M
      points: 5
      evidence: |
        대칭성으로 $2\int_0^1$로 바꾸고 $\int_0^1\tan^3\left(\frac{\pi x}{4}\right)dx=\frac2\pi(1-\ln2)$를 계산했다.
      depends_on: []
      implied_ok: false
      steps: [14b-1, 14a]
    - id: 1-4.A1
      mark_type: A
      points: 5
      evidence: |
        $a=\dfrac{1}{1-\ln2}$를 얻었다.
      depends_on: [1-4.M1]
      steps: [14b-2, 14a]
    deductions: []
