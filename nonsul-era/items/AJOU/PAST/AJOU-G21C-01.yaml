- id: '2-1'
  stem: |
    [문제 1-2] 제시문 (나)를 읽고 다음 물음에 답하여라.
    (1) 이차함수 $f(x)=(x-7)^2$에 대하여 집합 $S_{10}$의 원소의 개수를 $a$라 하고 $S_{10}$의 모든 원소의 합을 $b$라 하자. $a$와 $b$의 값을 각각 구하여라.
  points: 6
  depends_on: []
  answer: {kind: expression, value: 'a=11; b=77', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $S_k=S_{k-2}\cup\{x\mid\lvert f(x)\rvert=k\}$이고 $x=7$ 대칭이므로 원소 $k+1$개, 합 $7(k+1)$.
    steps:
    - id: 21a
      content: |
        $a=1+2\cdot5=11$, $b=7a=77$
      criteria: ['2-1.A1', '2-1.A2']
    hint_ladder:
    - $S_0$, $S_1$, $S_2$를 직접 구해 규칙을 찾자.
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.44
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        먼저, $S_0$, $S_1$의 원소의 개수가 각각 1, 2이다. 또한 $k\ge2$에 대하여 $S_k$는 $S_{k-2}$와 $\{x\mid\lvert f(x)\rvert=k\}$의 합집합이고 그래프의 개형으로부터 $S_k$의 원소의 개수는 $k+1$임을 알 수 있다. 따라서 $a=1+2\cdot5=11$
      criteria: ['2-1.A1']
    - id: 21b-2
      content: |
        $S_k$의 원소 $s$에 대하여 $14-s$도 $S_k$의 원소이므로 원소의 합은 $7k$[판독확인: 원문 그대로. 원소 $k+1$개이므로 합은 $7(k+1)$이 맞고, 최종 $b=7a=77$과도 일치]이다. 따라서 $b=7a=77$이다.
      criteria: ['2-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.A1
      mark_type: B
      points: 3
      evidence: |
        $S_k=S_{k-2}\cup\{x\mid\lvert f(x)\rvert=k\}$ 구조로 $a=11$을 얻었다.
      depends_on: []
      steps: [21b-1, 21a]
    - id: 2-1.A2
      mark_type: B
      points: 3
      evidence: |
        $x=7$ 대칭($s$와 $14-s$)으로 $b=77$을 얻었다.
      depends_on: []
      steps: [21b-2, 21a]
    deductions: []
