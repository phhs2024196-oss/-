intent: |
  $y=b$에서 '접어 올린 함수' $\lvert f(x)-b\rvert+b$의 그래프를 해석해 교점 개수·극값·미분가능 조건을 판단하고, 대칭성을 이용한 정적분과 반복해서 접어 올린 그래프의 교점 집합이 만드는 등비급수를 구하는 능력을 본다.
key_idea: |
  접어 올린 함수는 $f(x)<b$인 부분을 $y=b$에 대해 뒤집은 것이다. 미분가능하려면 $f(a)=b$인 점에서 $f^{\prime}(a)=0$, 반복 접기에서는 $S_n=S_{n-2}\cup\{x\mid\lvert f(x)\rvert=n\}$ 꼴의 구조를 찾는다.
stuck: |
  (1)에서 접하는 경우의 접점 범위 $1\le a\le3$, (3)에서 미분가능 조건으로 $f(x)=(x-a)^3+1$을 결정, 1-2에서 $S_n$의 점화 구조를 그래프 개형으로 찾는 것
