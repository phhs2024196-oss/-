stimuli:
- label: 가
  body: |
    함수 $f(x)$에 대하여 $y=\lvert f(x)\rvert$의 그래프는 $y=f(x)$의 그래프에서 $x$축 아래에 있는 부분을 $x$축에 대하여 대칭이동하여 그릴 수 있다. 이것은 $y=0$에서 $y=f(x)$의 그래프를 접어 올려 그린 것으로 볼 수 있다. 일반적으로, 실수 $b$에 대하여, $y=\lvert f(x)-b\rvert+b$ 의 그래프는 $y=f(x)$를 $y$축의 방향으로 $-b$만큼 평행이동하여 $x$축 아래에 있는 부분을 $x$축에 대하여 대칭이동하고 다시 $y$축의 방향으로 $b$만큼 평행이동하여 그릴 수 있는데, 이 또한 $y=b$에서 함수 $y=f(x)$의 그래프를 접어 올려 그린 것으로 볼 수 있다. 이러한 이유로, 함수 $y=\lvert f(x)-b\rvert+b$ 를 $y=b$에서 $y=f(x)$를 ‘접어 올린 함수’라 하자. [그림 1-1]은 $y=2$에서 $y=x^2$을 접어 올린 함수의 그래프이다.
    [그림 1-1: $y=\lvert x^2-2\rvert+2$의 그래프 — 점선 $y=2$, 꺾인 점 $(\pm\sqrt2,2)$, 가운데 위로 볼록한 부분의 꼭짓점 $(0,4)$]
- label: 나
  body: |
    함수 $y=f(x)$의 그래프를 음이 아닌 정수 $n$에 대하여 $y=0,\ldots,y=n$에서 차례로 연이어 접어 올린 함수의 그래프와 직선 $y=n$이 만나는 점의 $x$ 좌표의 집합을 $S_n$이라 하자. 예를 들어, $f(x)=x$이면, $y=0$, $y=1$, $y=2$에서 순서대로 접어 올린 함수의 그래프는 [그림 1-2]와 같으므로 $S_0=\{0\}$, $S_1=\{-1,1\}$, $S_2=\{-2,0,2\}$이다.
    [그림 1-2: 세 그래프. 왼쪽 $y=\lvert x\rvert$(꼭짓점 원점), 가운데 $y=0,1$에서 접은 그래프(점 $(\pm1,1)$에서 꺾이고 $(0,2)$가 봉우리, 점선 $y=1$), 오른쪽 $y=0,1,2$에서 접은 그래프($(\pm2,2)$, $(0,2)$에서 $y=2$에 닿는 W자 꼴, 점선 $y=2$)]

stem: |
  다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (1) 함수 $f(x)$는 이차함수 $y=(x-2)^2$을 $y=1$에서 접어 올린 함수이다. 곡선 $y=f(x)$와 직선 $y=kx$가 정확히 세 점에서 만나도록 하는 실수 $k$의 값을 모두 구하여라.
  points: 8
  depends_on: []
  answer: {kind: set, value: '[1, 4 - 2*sqrt(2)]', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 직선이 꺾인 점 $(1,1)$을 지나거나, $1\le x\le3$의 뒤집힌 부분 $2-(x-2)^2$에 접해야 한다.
    steps:
    - id: 11a
      content: |
        $k=1$; 접점 $a=\sqrt2$에서 $k=4-2\sqrt2$
      criteria: ['1-1.M1', '1-1.B1', '1-1.A1']
    hint_ladder:
    - 원점을 지나는 직선을 기울기를 바꿔 가며 돌려 보자.
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.42
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $y=f(x)$와 $y=kx$가 세 점에서 만나려면 아래 그림과 같이, $y=kx$가 $(1,1)$을 지나거나 $y=kx$가 $y=f(x)$와 접해야 한다.
        [그림: $y=f(x)$(꺾인 점 $(1,1)$, $(3,1)$, 가운데 봉우리 $(2,2)$, 점선 $y=1$)와 원점을 지나는 두 직선]
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        $y=kx$가 $(1,1)$을 지나는 경우 $k=1$이다.
      criteria: ['1-1.B1']
    - id: 11b-3
      content: |
        $y=kx$와 $y=f(x)$가 $x=a$에서 접하는 경우를 생각하면, $1\le a\le3$가 되고, $f(x)=2-(x-2)^2$가 되므로 $f^{\prime}(a)=-2(a-2)$이다. 따라서 $k=-2(a-2)$가 되어 접점의 $y$좌표는 $-2a(a-2)$이다. 한편 접점의 $y$좌표는 $f(a)$이므로, $-2a(a-2)=2-(a-2)^2$가 성립한다. 이를 정리하면, $a^2=2$이고 $1\le a\le3$이므로 $a=\sqrt2$이다. 따라서 $k=-2(\sqrt2-2)=4-2\sqrt2$이다. 따라서 가능한 $k$는 $k=1,4-2\sqrt2$이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        세 점에서 만나려면 $(1,1)$을 지나거나 접해야 함을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [11b-1, 11a]
    - id: 1-1.B1
      mark_type: A
      points: 1
      evidence: |
        $(1,1)$을 지나는 경우 $k=1$
      depends_on: [1-1.M1]
      steps: [11b-2, 11a]
    - id: 1-1.A1
      mark_type: A
      points: 4
      evidence: |
        접하는 경우 $a=\sqrt2$, $k=4-2\sqrt2$를 구했다.
      depends_on: [1-1.M1]
      steps: [11b-3, 11a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (2) 삼차함수 $f(x)=x^3-3x^2+2x-4$의 그래프의 변곡점 $(a,b)$를 생각하자. 함수 $g(x)$는 $y=f(x)$를 $y=b$에서 접어 올린 함수이다. 함수 $g(x)$가 $x=p$에서 극대가 되고 $x=q$에서 극소가 되도록 하는 모든 $p$와 $q$의 값을 구하여라.
  points: 7
  depends_on: []
  answer: {kind: expression, value: 'p=[1 - sqrt(3)/3, 1 + sqrt(3)/3]; q=[0, 1, 2]', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 변곡점 $(1,-4)$, $g=\lvert f+4\rvert-4$는 $f=-4$인 점에서 극소, $f^{\prime}=0$인 점에서 극대.
    steps:
    - id: 12a
      content: |
        $q=0,1,2$, $p=1\pm\frac{\sqrt3}{3}$
      criteria: ['1-2.M1', '1-2.A1', '1-2.A2']
    hint_ladder:
    - $f(x)+4$를 인수분해하자.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.42
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $f^{\prime}(x)=3x^2-6x+2$이고 $f^{\prime\prime}(x)=6x-6$이므로, 변곡점의 좌표는 $(1,-4)$이다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        따라서 $g(x)$는 $x^3-3x^2+2x-4=-4$의 세 근 $x=0,1,2$에서 극솟값을 가진다.
      criteria: ['1-2.A1']
    - id: 12b-3
      content: |
        또한, $f^{\prime}(x)=3x^2-6x+2=0$의 두 근 $x=\dfrac{3\pm\sqrt3}{3}$에서 극댓값을 가지므로, $p=1\pm\dfrac{\sqrt3}{3}$, $q=0,1,2$ 이다.
        [그림: $y=g(x)$ — $x=0,1,2$에서 $y=-4$에 닿고 그 사이 두 봉우리]
      criteria: ['1-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: |
        변곡점 $(1,-4)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [12b-1, 12a]
    - id: 1-2.A1
      mark_type: A
      points: 2
      evidence: |
        $f(x)=-4$의 근 $x=0,1,2$에서 극소임을 밝혔다.
      depends_on: [1-2.M1]
      steps: [12b-2, 12a]
    - id: 1-2.A2
      mark_type: A
      points: 3
      evidence: |
        $f^{\prime}(x)=0$의 근 $\dfrac{3\pm\sqrt3}{3}$에서 극대, $p=1\pm\dfrac{\sqrt3}{3}$을 답했다.
      depends_on: [1-2.M1]
      steps: [12b-3, 12a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (3) 함수 $g(x)$는 최고차항의 계수가 $1$인 삼차함수 $y=f(x)$를 $y=1$에서 접어 올린 함수이고, 함수 $h(x)$는 $y=f^{\prime}(x)$를 $y=1$에서 접어 올린 함수이다. $g(x)$가 실수 전체에서 미분가능 할 때, 두 곡선 $y=g(x)$와 $y=h(x)$의 교점의 개수를 구하여라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 미분가능하려면 $f(a)=1$인 점이 삼중근(변곡점)이어야 해서 $f(x)=(x-a)^3+1$; 평행이동하면 $g=\lvert x\rvert^3+1$, $h=\lvert3x^2-1\rvert+1$로 우함수.
    steps:
    - id: 13a
      content: |
        $x>0$에서 교점 3개(구간 $(0,\frac1{\sqrt3})$, $(\frac1{\sqrt3},1)$, $(1,3)$), 대칭으로 총 6개
      criteria: ['1-3.M1', '1-3.A1', '1-3.A2', '1-3.A3']
    hint_ladder:
    - 접어 올린 곳에서 꺾이지 않으려면 그 점에서 기울기가 어때야 하는가?
  - id: S13-B
    audience: B
    source_flow: 모범답안 p.43
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        최고차항의 계수가 1인 삼차함수 $y=f(x)$를 $y=1$에서 접어 올렸더니 미분가능한 함수의 그래프가 되었으므로, $f(a)=1$인 모든 $a$에 대하여, $f^{\prime}(a)=0$이어야 한다. 그런데 $x=a$에서 함수가 극댓값을 가지거나 극솟값을 가지면, 삼차함수 그래프의 개형으로부터 $g(x)$가 미분 불가능한 점이 항상 존재한다. 따라서 $x=a$에서 함수 $f(x)$는 변곡점을 가지므로 $f(x)=(x-a)^3+1$이다.
      criteria: ['1-3.M1']
    - id: 13b-2
      content: |
        교점을 구하기 위해서 $x$축 방향으로 $-a$만큼 평행이동 시켜 생각하면 $a=0$일 때만 구하면 충분하다. $g(x)=\lvert x\rvert^3+1$과 $h(x)=\lvert3x^2-1\rvert+1$은 둘 다 $y$축 대칭이므로, $x>0$일 때의 교점의 개수를 구하면 된다.
        ① $x<\dfrac{1}{\sqrt3}$일 때: $g(x)$는 증가하고 $h(x)$는 감소한다. $g(0)-h(0)<0$이고 $g\left(\dfrac1{\sqrt3}\right)-h\left(\dfrac1{\sqrt3}\right)>0$이므로 $g(x)-h(x)=0$이 되는 점이 하나 존재하므로, $g(x)$와 $h(x)$는 한 점에서 만난다.
      criteria: ['1-3.A1']
    - id: 13b-3
      content: |
        ② $x>\dfrac{1}{\sqrt3}$일 때: $g\left(\dfrac1{\sqrt3}\right)-h\left(\dfrac1{\sqrt3}\right)>0$, $g(1)-h(1)<0$, $g(3)-h(3)>0$ 이므로, 사잇값 정리에 의해 한 근은 구간 $\left(\dfrac1{\sqrt3},1\right)$에, 다른 근은 구간 $(1,3)$에 존재한다. 두 근 모두 $x>\dfrac1{\sqrt3}$이므로, 두 점에서 만난다. 그래프 $g(x)$와 $h(x)$의 개형으로부터, $x>0$인 근은 두 개 뿐이다.
        [그림: $y=g(x)$와 $y=h(x)$의 그래프]
