    method_no: 1
    steps:
    - id: 22b-1
      content: |
        검은 바둑돌은 원점 혹은 $x=1$위에 있어야 하고 최대 3개까지 있을 수 있다. 원점의 검은 바둑돌의 개수를 $a$, $x=1$위의 검은 바둑돌의 개수를 $b$라고 하면 가능한 $(a,b)$는 $a+b\le3$이 되는 음이 아닌 정수의 순서쌍이 되므로, $(0,0)$, $(1,0)$, $(0,1)$, $(2,0)$, $(1,1)$, $(0,2)$, $(3,0)$, $(2,1)$, $(1,2)$, $(0,3)$으로 모두 10개이다.
      criteria: ['2-2.B1']
    - id: 22b-2
      content: |
        또한 흰 바둑돌 배치의 경우의 수는 $n+1$이다.
      criteria: ['2-2.B2']
    - id: 22b-3
      content: |
        한편 검은 바둑돌이 규칙 ㉠을 따라 움직이는 사건을 $A$라 하고 흰 바둑돌이 규칙 Ⓐ를 따라 움직이는 사건을 $B$라 하면, $\mathrm{P}(A)=\dfrac13$, $\mathrm{P}(B)=\dfrac12$, $\mathrm{P}(A\cap B)=\dfrac16$이므로 두 사건은 독립이다.
        비슷하게 하면, 검은 바둑돌의 규칙 중 ㉠, ㉡, ㉢ 하나가 일어나는 사건과 흰 바둑돌의 규칙 중 Ⓐ와 Ⓑ가 일어나는 사건은 독립이다. 따라서 검은 바둑돌과 흰 바둑돌의 움직임은 서로 독립적이므로 전체 경우의 수는 $10(n+1)$가지이다.
      criteria: ['2-2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
