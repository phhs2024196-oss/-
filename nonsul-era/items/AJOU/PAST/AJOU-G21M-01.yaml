- id: '2-1'
  stem: |
    [문제 1-2] 제시문 (나)를 읽고 다음 물음에 답하여라.
    (1) 수직선의 원점에 흰 바둑돌 1개가 놓여 있다. 홀수인 양의 정수 $n$에 대하여 $n$회 시행 직후 흰 바둑돌이 $x=k$의 위치에 있을 확률을 $p_k$라 할 때 $\displaystyle\sum_{k=1}^{n}(k^2+1)(p_k+p_{-k})$의 값을 $n$에 대한 식으로 나타내어라.
  points: 8
  depends_on: []
  answer: {kind: expression, value: 'n + 1', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: |
      위치 $=n-2X$($X\sim\mathrm{B}(n,\frac12)$)이므로 $\sum k^2(p_k+p_{-k})=\mathrm{E}((n-2X)^2)=n$, $n$이 홀수라 원점 확률 0이므로 $\sum(p_k+p_{-k})=1$.
    steps:
    - id: 21a
      content: |
        $n+1$
      criteria: ['2-1.M1', '2-1.A1', '2-1.B1']
    hint_ladder:
    - $(k^2+1)$을 $k^2$과 $1$로 나누어 계산하자.
    - $n$이 홀수이면 흰 바둑돌이 원점에 있을 수 있는가?
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        홀수가 $m$번 (단, $2m\le n$) 나온다고 하면 흰 바둑돌의 위치는 $k=n-2m$ 이며, 홀수가 $n-m$ 번 나오면 흰 바둑돌의 위치는 $-k$이다.
      criteria: ['2-1.M1']
    - id: 21b-2
      content: |
        $\displaystyle\sum_{k=1}^{n}k^2(p_k+p_{-k})=\sum_{k=1}^{n}k^2p_k+\sum_{k=1}^{n}(-k)^2p_{-k}$ 이므로 $\displaystyle\sum_{k=1}^{n}k^2(p_k+p_{-k})=\sum_{m=0}^{n}(n-2m)^2\frac{{}_n\mathrm{C}_m}{2^n}$ 이다.
      criteria: ['2-1.M2']
    - id: 21b-3
      content: |
        한편, $n$번의 시행에서 주사위의 눈의 수가 홀수가 나오는 횟수를 확률변수 $X$라 하면, $X$는 이항분포 $\mathrm{B}\left(n,\dfrac12\right)$를 따르므로 이항분포의 평균과 분산으로부터 $\mathrm{E}(X)$와 $\mathrm{V}(X)$를 구하면 다음과 같다.
        $$\mathrm{E}(X)=\frac n2=0\times{}_n\mathrm{C}_0\left(\frac12\right)^n+1\times{}_n\mathrm{C}_1\left(\frac12\right)^n+\cdots+n\times{}_n\mathrm{C}_n\left(\frac12\right)^n$$
        $$\mathrm{V}(X)=\frac n4=\mathrm{E}(X^2)-\{\mathrm{E}(X)\}^2=0^2\times{}_n\mathrm{C}_0\left(\frac12\right)^n+1^2\times{}_n\mathrm{C}_1\left(\frac12\right)^n+\cdots+n^2\times{}_n\mathrm{C}_n\left(\frac12\right)^n-\left(\frac n2\right)^2$$
        이로부터 $\mathrm{E}(X^2)=\dfrac{n^2+n}{4}$임을 확인 할 수 있다.
      criteria: ['2-1.M3']
    - id: 21b-4
      content: |
        (준식)$=n^2-4n\mathrm{E}(X)+4\mathrm{E}(X^2)=n^2-2n^2+n+n^2=n$ 이다.
      criteria: ['2-1.A1']
    - id: 21b-5
      content: |
        또한 $n$이 홀수 이므로 원점의 위치에 흰 바둑돌이 위치할 수 없고, $\displaystyle\sum_{k=1}^{n}(p_k+p_{-k})$는 모든 확률의 합이므로 $1$이다. 따라서 답은 $n+1$이다.
      criteria: ['2-1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 2
      evidence: |
        홀수 $m$번이면 위치 $n-2m$, $n-m$번이면 $-k$임을 밝혔다.
