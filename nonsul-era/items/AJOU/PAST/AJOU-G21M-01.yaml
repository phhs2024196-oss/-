    - id: 23b-1
      content: |
        먼저 흰 바둑돌의 위치는 주사위의 눈의 순서에 상관없이 그 횟수에 의해서만 결정되므로 조건 ①에 의해 12회 시행 직후에 흰 바둑돌은 원점에 있고 조건 ②에 의해 $x_{13}$은 2, 4, 6중에 하나가 되어야 한다.
      criteria: ['2-3.M1']
    - id: 23b-2
      content: |
        조건 ①로부터 12회 시행을 하는 동안 규칙 ㉠, ㉡, ㉢의 경우가 각각 네 번씩 일어났다는 것을 알 수 있고, 13회 시행까지 검은 바둑돌이 버려지지 않고 모두 남아 있으므로 규칙 ㉢의 경우가 되는 시행의 직전에 원점에 검은 바둑돌이 있으면 안된다. 따라서 ㉢이 시행되기 전에 검은 바둑돌 4개를 $x=1$의 위치로 옮기는 시행 (㉠)이 모두 일어나야 한다. 12회 시행을 하는 동안 규칙 ㉡이 ㉢과 ㉠ 사이에 일어나게 되면 검은 바둑돌을 버리게 되므로, 12회까지 가능한 경우는 아래 두 가지 중 하나이다.
        (i) ㉡-㉡-㉡-㉠-㉠-㉠-㉠-㉢-㉢-㉢-㉢-㉡
        검은 바둑돌 1개가 12회 시행 직후에 원점의 위치에 있으므로, ㉠의 경우가 일어나는 $x_{13}=4$ 이다.
      criteria: ['2-3.A1']
    - id: 23b-3
      content: |
        (ii) ㉡-㉡-㉡-㉡-㉠-㉠-㉠-㉠-㉢-㉢-㉢-㉢
        검은 바둑돌이 모두 $x=1$의 위치에 있으므로, ㉢의 경우가 일어나는 $x_{13}=6$이다.[판독확인: 의학과 모범답안 원문 그대로. 같은 시험 채점기준 p.20과 자연(저녁) 모범답안은 「㉠, ㉢의 경우가 일어나는 $x_{13}=4$ 또는 $x_{13}=6$」 — $x_{13}=4$ 누락으로 보임. 최종답 $3\cdot6^3$은 두 값을 모두 센 것]
      criteria: ['2-3.A2']
    - id: 23b-4
      content: |
        즉 ㉠의 자리에는 1,1,4,4, ㉡ 의 자리에는 2, 2, 5, 5, ㉢의 자리에는 3, 3, 6, 6이 있어야 한다. $a$, $a$, $b$, $b$를 일렬로 나열하는 순열의 개수는 6이므로, 각 경우 $6^3$가지이고,
      criteria: ['2-3.M2']
    - id: 23b-5
      content: |
        구하고자 하는 답은 $3\cdot6^3=648$ 이다.
      criteria: ['2-3.A3']
