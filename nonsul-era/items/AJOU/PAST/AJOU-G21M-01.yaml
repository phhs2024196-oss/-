stimuli:
- label: 가
  body: |
    수직선의 원점에 검은 바둑돌 $b$개가 놓여 있다. 한 개의 주사위를 한 번 던져 나온 눈의 수를 확인하고 <검은 바둑돌의 규칙>에 따라 검은 바둑돌을 이동시키거나 버리는 것을 1회의 시행이라 하자.
    <검은 바둑돌의 규칙>
    ㉠ 눈의 수가 1 또는 4이면, 원점에 있는 검은 바둑돌 1개를 $x=1$의 위치로 이동시킨다. 원점에 검은 바둑돌이 없다면 아무 일도 하지 않는다.
    ㉡ 눈의 수가 2 또는 5이면, $x=1$의 위치에 있는 검은 바둑돌 1개를 원점으로 이동시킨다. $x=1$의 위치에 검은 바둑돌이 없다면 아무 일도 하지 않는다.
    ㉢ 눈의 수가 3 또는 6이면, 원점에 있는 검은 바둑돌 1개를 버린다. 원점에 검은 바둑돌이 없다면 아무 일도 하지 않는다.
    (규칙 안의 「원점에 있는」, 「$x=1$의 위치에 있는」에 밑줄)
    예를 들어, 검은 바둑돌 2개가 원점에 놓여 있고 4회 시행을 하는 동안 주사위 눈의 수가 순서대로 1, 6, 4, 2가 나왔다면, 순서대로 시행한 규칙은 ㉠-㉢-㉠-㉡ 이 되어 검은 바둑돌의 배치는 [그림 2-1]과 같이 변한다.
    [그림 2-1: 수직선 다섯 개를 화살표로 이음 — 원점에 2개 → 원점 1개·$x=1$에 1개 → $x=1$에 1개 → $x=1$에 1개 → 원점에 1개]
- label: 나
  body: |
    수직선의 원점에 검은 바둑돌 $b$개와 흰 바둑돌 1개가 놓여 있다. 한 개의 주사위를 한 번 던져 나온 눈의 수를 확인하고 검은 바둑돌을 제시문 (가)의 <검은 바둑돌의 규칙>에 따라 이동시키거나 버리고, 흰 바둑돌을 <흰 바둑돌의 규칙>에 따라 이동시키는 것을 1회의 시행이라 하자.
    <흰 바둑돌의 규칙>
    Ⓐ 눈의 수가 짝수이면 흰 바둑돌을 양의 방향으로 1 만큼 이동시킨다.
    Ⓑ 눈의 수가 홀수이면 흰 바둑돌을 음의 방향으로 1 만큼 이동시킨다.
    예를 들어 검은 바둑돌 2개, 흰 바둑돌 1개가 원점에 놓여 있고 4회 시행을 하는 동안 주사위 눈의 수가 순서대로 1, 6, 4, 2가 나왔다면, 검은 바둑돌 1개가 원점에 있고 흰 바둑돌은 $x=2$의 위치에 있다.

stem: |
  다음 제시문을 읽고 논제에 답하라.


subparts:
- id: '1-1'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (1) 수직선의 원점에 검은 바둑돌 1개가 놓여 있다. 5회 시행 직후 검은 바둑돌이 수직선 위에 남아 있지 않을 확률을 $p$라 할 때, $\log p$의 값을 구하여라. (단, $\log2=0.30$, $\log3=0.47$, $\log7=0.84$, $\log11=1.04$로 계산한다.)
  points: 7
  depends_on: []
  answer: {kind: value, value: '-0.17', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 버려지는 시점 $k=1,\ldots,5$별 경로 수 $1,1,2,5,13$에 $\left(\frac13\right)^k$을 곱해 더한다.
    steps:
    - id: 11a
      content: |
        $p=\frac{154}{243}$, $\log p=\log2+\log7+\log11-5\log3=-0.17$
      criteria: ['1-1.M1', '1-1.A2']
    hint_ladder:
    - 원점에 있을 때만 버려진다. $k$번째에 처음 버려지려면 직전까지 어떤 규칙 순서가 가능한가?
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        검은 바둑돌이 $k$번째 시행에서 규칙 ㉢에 의해 버려질 확률을 구하자.
        $k=1$: 처음 시행에서 규칙 ㉢의 경우가 나와야 하므로 구하는 확률은 $\dfrac13$이다.
        $k=2$: 처음 시행 후 검은 바둑돌이 원점에 있어야 하므로 첫 시행에서 반드시 규칙 ㉡의 경우가 나와야 하므로 2번째 시행 직후 버려질 확률은 $\dfrac13\times\dfrac13=\dfrac19$이다.
        $k=3$: 두 번의 시행 이후 검은 바둑돌이 원점에 있어야 하므로 차례대로 규칙 ㉡, ㉡의 경우가 되거나 혹은 차례로 규칙 ㉠-㉡의 경우가 되어야 한다. 3번째 시행 직후 버려질 확률은 $2\times\dfrac13\times\dfrac13\times\dfrac13=\dfrac{2}{27}$이다.
        $k=4$: 세 번의 시행 이후 검은 바둑돌이 원점에 있어야 하므로, 차례로 나온 규칙은 아래의 나열된 5가지의 경우 중 하나이다.
        ㉡-㉡-㉡, ㉡-㉠-㉡, ㉠-㉡-㉡, ㉠-㉠-㉡, ㉠-㉢-㉡
        즉 4번째 시행 직후 버려질 확률은 $5\times\dfrac13\times\dfrac13\times\dfrac13\times\dfrac13=\dfrac{5}{81}$이다.
        $k=5$: 네 번의 시행 이후 검은 바둑돌이 원점에 있어야 하므로, 차례로 나온 규칙은 아래의 나열된 13가지의 경우 중 하나이다.
        ㉡-㉡-㉡-㉡, ㉡-㉡-㉠-㉡, ㉡-㉠-$*$-㉡, ㉠-㉡-㉡-㉡, ㉠-㉡-㉠-㉡, ㉠-㉠-$*$-㉡, ㉠-㉢-$*$-㉡
        즉 5번째 시행 직후 버려질 확률은 $13\times\dfrac13\times\dfrac13\times\dfrac13\times\dfrac13\times\dfrac13=\dfrac{13}{243}$이다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        따라서 검은 바둑돌이 4회[판독확인: 원문 그대로. 발문은 5회 시행이므로 「5회」의 오기로 보임] 시행 직후 수직선에 남아 있지 않을 확률은 $p=\dfrac13+\dfrac19+\dfrac{2}{27}+\dfrac{5}{81}+\dfrac{13}{243}=\dfrac{154}{243}$이고,
      criteria: ['1-1.A1']
    - id: 11b-3
      content: |
        $\log p=\log\dfrac{154}{243}=\log2+\log7+\log11-5\log3=0.3+0.84+1.04-2.35=-0.17$ 이다.
      criteria: ['1-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 4
      evidence: |
        $k=1,\ldots,5$번째에 버려질 확률 $\frac13$, $\frac19$, $\frac{2}{27}$, $\frac{5}{81}$, $\frac{13}{243}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [11b-1, 11a]
    - id: 1-1.A1
      mark_type: A
      points: 1
      evidence: |
        $p=\dfrac{154}{243}$
      depends_on: [1-1.M1]
      steps: [11b-2]
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: |
        $\log p=-0.17$
      depends_on: [1-1.M1]
      steps: [11b-3, 11a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 다음 물음에 답하여라.
    (2) 수직선의 원점에 검은 바둑돌 1개가 놓여 있다. 12회 시행을 하였을 때, 2, 4, 6, 8, 10, 12번째 시행 직후마다 검은 바둑돌이 원점에 있지 않는 사건을 $\mathrm{A}$라 하고, 12번째 시행 직후 수직선 위에 검은 바둑돌이 남아 있는 사건을 $\mathrm{B}$라 하자. 이때 $\mathrm{P}(\mathrm{B}\mid\mathrm{A})<\dfrac{3}{92}$임을 증명하여라. (단, $\left(\dfrac59\right)^5<\dfrac{19}{359}$를 증명 없이 이용할 수 있다.)
  points: 9
  depends_on: []
  answer: {kind: proof, value: 'P(B|A)=12*alpha/(9*alpha+19), alpha=(5/9)**5', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $A\cap B$는 짝수 번째마다 $x=1$에 있는 사건($\frac39\cdot\left(\frac59\right)^5$), $A\cap B^c$는 버려지는 시점으로 나눠 등비수열 합.
    steps:
    - id: 12a
      content: |
        $\mathrm{P}(\mathrm{B}\mid\mathrm{A})=\frac{12\alpha}{9\alpha+19}<\frac{12\alpha}{9\alpha+359\alpha}=\frac{3}{92}$
      criteria: ['1-2.M1', '1-2.M2', '1-2.R1']
    hint_ladder:
    - 사건 A에서 바둑돌은 짝수 번째 직후 $x=1$에 있거나 이미 버려졌다.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.8–9
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $\mathrm{P}(\mathrm{B}\mid\mathrm{A})=\dfrac{\mathrm{P}(\mathrm{A}\cap\mathrm{B})}{\mathrm{P}(\mathrm{A})}$이므로 $\mathrm{P}(\mathrm{A})$와 $\mathrm{P}(\mathrm{A}\cap\mathrm{B})$를 각각 구하자.
        $\mathrm{P}(\mathrm{A}\cap\mathrm{B})$를 먼저 계산하자. 사건 $\mathrm{A}\cap\mathrm{B}$은 12회 시행하는 동안 $2k$번째 시행 직후 ($k=1,2,\ldots,6$) 검은 바둑돌은 $x=1$의 위치에 있어야 한다. 처음 검은 바둑돌의 위치는 원점이므로 두 번째 시행 직후에 검은 바둑돌이 $x=1$의 위치에 있기 위해서는 시행된 규칙은 ㉠-㉠의 경우, ㉠-㉢의 경우, ㉡-㉠의 경우로 총 3가지 경우가 있다. 이제 두 번의 시행을 더 했을 때 여전히 $x=1$의 위치에 있으려면 차례로 시행된 규칙은 아래의 5가지 중 하나이다.
        ㉠-㉠, ㉠-㉢, ㉡-㉠, ㉢-㉠, ㉢-㉢
        따라서 12회의 시행을 마치기까지 이렇게 두 번씩 5번을 시행해야 하므로, $\mathrm{P}(\mathrm{A}\cap\mathrm{B})=\dfrac39\times\left(\dfrac59\right)^5$이다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        이제 $\mathrm{P}(\mathrm{A})$를 구하자. $\mathrm{P}(\mathrm{A})=\mathrm{P}(\mathrm{A}\cap\mathrm{B}^C)+\mathrm{P}(\mathrm{A}\cap\mathrm{B})$이므로, $\mathrm{P}(\mathrm{A}\cap\mathrm{B}^C)$을 구하면 된다. 바둑돌이 $2k+1$ 번째 혹은 $2k+2$ 번째에서 버려지는 확률을 먼저 구하자.
        $k=0$일 때: 첫 번째 혹은 두 번째 시행에서 버려져야 하므로, 첫 시행에서 규칙 ㉢의 경우이거나 두 번째 시행까지 차례로 ㉡-㉢의 경우가 된다. 따라서 확률은 $\dfrac13+\dfrac19=\dfrac49$이다.
        $k>0$일 때: $2k$번째 까지는 검은 바둑돌이 남아 있어야 하므로 $\mathrm{P}(\mathrm{A}\cap\mathrm{B})$를 구하는 같이[판독확인: 원문 그대로(「구하는 것과 같이」의 뜻)] 구할 수 있으므로 확률은 $\dfrac13\times\left(\dfrac59\right)^{k-1}$이고, $2k+1$ 혹은 $2k+2$번째에서 버려지는 경우는 규칙 ㉡-㉢이 차례대로 나오는 경우 밖에 없으므로 구하고자 하는 확률은 $\dfrac13\times\left(\dfrac59\right)^{k-1}\times\dfrac19=\dfrac{1}{27}\left(\dfrac59\right)^{k-1}$이다.
        즉, $\mathrm{P}(\mathrm{A}\cap\mathrm{B}^C)=\dfrac49+\dfrac{1}{27}\displaystyle\sum_{k=1}^{5}\left(\frac59\right)^{k-1}=\frac49+\frac{1}{12}\left(1-\frac{5^5}{9^5}\right)$이다.
      criteria: ['1-2.M2']
    - id: 12b-3
      content: |
        이제 $\dfrac{5^5}{9^5}=\alpha$라하고, 조건부 확률을 구하면
        $$\frac{\mathrm{P}(\mathrm{A}\cap\mathrm{B})}{\mathrm{P}(\mathrm{A})}=\frac{\mathrm{P}(\mathrm{A}\cap\mathrm{B})}{\mathrm{P}(\mathrm{A}\cap\mathrm{B})+\mathrm{P}(\mathrm{A}\cap\mathrm{B}^C)}=\frac{\frac\alpha3}{\frac\alpha3+\frac49+\frac{1}{12}(1-\alpha)}=\frac{12\alpha}{9\alpha+19}$$
        이다.
      criteria: ['1-2.A1']
    - id: 12b-4
      content: |
        한편, $359\alpha<19$ 이므로, $\mathrm{P}(\mathrm{B}\mid\mathrm{A})=\dfrac{12\alpha}{9\alpha+19}<\dfrac{12\alpha}{9\alpha+359\alpha}=\dfrac{3}{92}$이다.
      criteria: ['1-2.R1']
