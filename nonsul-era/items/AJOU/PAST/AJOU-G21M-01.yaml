      implied_ok: false
      steps: [21b-1, 21a]
    - id: 2-1.M2
      mark_type: M
      points: 2
      evidence: |
        $\sum k^2(p_k+p_{-k})=\sum_{m=0}^{n}(n-2m)^2\dfrac{{}_n\mathrm{C}_m}{2^n}$으로 바꿨다.
      depends_on: [2-1.M1]
      implied_ok: false
      steps: [21b-2]
    - id: 2-1.M3
      mark_type: M
      points: 1
      evidence: |
        $X\sim\mathrm{B}\left(n,\frac12\right)$의 평균·분산으로 $\mathrm{E}(X^2)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [21b-3]
    - id: 2-1.A1
      mark_type: A
      points: 2
      evidence: |
        $\sum k^2(p_k+p_{-k})=n$을 얻었다.
      depends_on: [2-1.M2, 2-1.M3]
      steps: [21b-4, 21a]
    - id: 2-1.B1
      mark_type: R
      points: 1
      evidence: |
        $n$이 홀수라 원점에 올 수 없으므로 $\sum(p_k+p_{-k})=1$, 답 $n+1$.
      depends_on: []
      steps: [21b-5, 21a]
    deductions: []
