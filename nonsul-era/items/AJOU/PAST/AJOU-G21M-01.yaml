        $X=0$인 경우 : 아래의 나열된 $9+3+3+6=21$ 가지의 경우이다.
        ㉢-㉢-$*$-$*$, ㉢-㉡-㉢-$*$, ㉡-㉢-㉢-$*$,
        ㉡-㉡-㉢-㉢, ㉠-㉡-㉢-㉢, ㉡-㉢-㉡-㉢,
        ㉢-㉠-㉡-㉢, ㉢-㉡-㉡-㉢, ㉠-㉢-㉡-㉢
