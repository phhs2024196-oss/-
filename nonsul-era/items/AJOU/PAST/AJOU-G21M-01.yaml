      content: |
        $X=0$: 21, $X=2$: 21, $X=1$: 39가지 $\Rightarrow$ $\mathrm{E}(X)=1$, $\sigma(X)=\frac{\sqrt{42}}{9}$
      criteria: ['1-3.B1', '1-3.B2', '1-3.A1', '1-3.A2']
    hint_ladder:
