stimuli:
- label: 제시문
  body: |
    직진하던 빛이 물체에 부딪칠 때 진행 방향이 바뀌어 나아가는 현상을 **빛의 반사**라고 한다. 빛이 원에서 반사될 때, [그림 1-1]에서와 같이 입사각과 반사각의 크기가 같다.

    중심이 원점 $\mathrm{O}$이고 반지름이 $1$인 원 $x^2+y^2=1$을 단위원이라 한다. 점 $\mathrm{I}(1,0)$에서 빛이 $x$축과 각 $\theta$ (단, $0<\theta<\dfrac{\pi}{2}$)를 이루며 단위원 내부로 발사되고 계속해서 원에서 반사된다고 하자. 이때, 각 $\theta$를 **발사각**이라 한다. 반사가 일어나는 원 위의 점을 **반사지점**이라 하고, $n$번째 반사가 일어나는 반사지점을 **$n$번째 반사지점**이라 한다. [그림 1-2]는 점 $\mathrm{I}(1,0)$에서 발사된 빛이 원 위에 $2$번 반사된 후, $x$축 위의 점 $\mathrm{P}$를 통과하는 예를 보여준다. 모든 각의 단위는 라디안(radian)이다.

    [그림 1-1: 단위원과 원 위의 한 점에서 반사되는 빛. 그 점과 원점을 잇는 점선(법선)을 사이에 두고 「입사각」과 「반사각」이 같게 표시됨]
    [그림 1-2: 점 $\mathrm{I}(1,0)$에서 $x$축과 각 $\theta$를 이루며 발사된 빛이 제1사분면 위쪽의 원 위 점(1번째 반사지점), 제2사분면의 원 위 점(2번째 반사지점)에서 차례로 반사된 뒤 $x$축 음의 부분 위의 점 $\mathrm{P}$를 지나 제3사분면 쪽 원으로 향하는 궤적]

stem: |
  [문항 1] (50점) 다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (25점) [그림 1-2]와 같이 단위원 위의 점 $\mathrm{I}$에서 빛이 발사각 $\theta$를 이루며 발사되어 제2사분면에서 원 위의 2번째 반사지점을 지나 제3사분면에서 원 위의 3번째 반사지점을 갖게 된다고 하자.
    (1) 발사각 $\theta$의 범위를 구하고, 빛이 통과하는 $x$축 위의 점 $\mathrm{P}$의 $x$좌표를 $\theta$를 이용하여 나타내라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'lo=pi/4; hi=pi/3; xP=sin(theta)/sin(5*theta)', equivalents: ['xP=-sin(theta)/sin(2*pi-5*theta)'], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: 1번째 반사지점의 동경 각은 $\alpha=\pi-2\theta$이고 $k$번째는 $k\alpha$이므로 $2\alpha<\pi<3\alpha$; P는 삼각형 O·P·2번째 반사지점에 사인법칙.
    steps:
    - {id: 1-1a, content: '$\alpha=\pi-2\theta$, $2\alpha<\pi<3\alpha\Rightarrow\tfrac{\pi}{4}<\theta<\tfrac{\pi}{3}$, $x=\tfrac{\sin\theta}{\sin5\theta}$', criteria: ['1-1.M1', '1-1.M2', '1-1.A1']}
    hint_ladder:
    - 원점과 첫 번째 반사지점, 점 I가 이루는 삼각형은 어떤 삼각형인가?
    - 반사가 한 번 일어날 때마다 동경은 얼마나 회전하는가?
  - id: S1-1-B
    audience: B
    source_flow: 모범답안 p.7 (채점기준 p.12)
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        빛의 입사각과 반사각이 같으므로 첫 번째 반사지점을 지나는 동경과 시초선($x$축의 양의 방향 반직선)이 이루는 각을 $\alpha$라고 두면, $\alpha=\pi-2\theta$이고 $0<\theta<\dfrac{\pi}{2}$이므로 $0<\alpha<\pi$이다. 또한 2번째, 3번째 반사지점을 지나는 동경과 시초선이 이루는 각은 각각 $2\alpha$, $3\alpha$가 된다. 문제의 가정에 의해 $2\alpha<\pi<3\alpha$이므로 $\alpha=\pi-2\theta$로부터 부등식 $\dfrac{\pi}{4}<\theta<\dfrac{\pi}{3}$을 얻는다.
      criteria: ['1-1.M1']
    - id: 1-1b-2
      content: |
        이때, 점 $\mathrm{P}(x,0)$에 대하여 선분 $\mathrm{OP}$의 길이는 $-x$이므로, 두 번째 반사지점과 점 $\mathrm{P}$, 원점 $\mathrm{O}$를 꼭짓점으로 하는 삼각형과 사인법칙에 의해
        $$\frac{-x}{\sin\theta}=\frac{1}{\sin(2\pi-5\theta)}$$
        이다. (보충: 이 삼각형에서 2번째 반사지점에서의 각은 반사각 $\theta$이고, $\mathrm{P}$에서의 각은 $\pi-\theta-(\pi-2\alpha)=2\alpha-\theta=2\pi-5\theta$이다.)
      criteria: ['1-1.M2']
    - id: 1-1b-3
      content: |
        따라서 $\sin(2\pi-5\theta)=-\sin5\theta$에 의해서 $x=\dfrac{\sin\theta}{\sin5\theta}$이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 4
      evidence: |
        $\alpha=\pi-2\theta$, $k$번째 반사지점의 동경 각 $k\alpha$와 $2\alpha<\pi<3\alpha$에서 $\dfrac{\pi}{4}<\theta<\dfrac{\pi}{3}$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.M2
      mark_type: M
      points: 4
      evidence: |
        삼각형(O, P, 2번째 반사지점)에 사인법칙을 적용한 식 $\dfrac{-x}{\sin\theta}=\dfrac{1}{\sin(2\pi-5\theta)}$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-2]
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        $x=\dfrac{\sin\theta}{\sin5\theta}$를 얻었다.
      depends_on: [1-1.M2]
      steps: [1-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) $\theta=\dfrac{7\pi}{24}$이고 $a=\cos\dfrac{\pi}{24}$라 할 때, 2번째 반사지점에서 점 $\mathrm{P}$까지 빛이 이동한 거리를 $a$에 대한 식으로 나타내라.
  points: 15
  depends_on: ['1-1']
  answer: {kind: expression, value: '1/(2*a)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: '$\tfrac{7\pi}{24}=\tfrac{\pi}{3}-\tfrac{\pi}{24}$, $\tfrac{35\pi}{24}=\tfrac{3\pi}{2}-\tfrac{\pi}{24}$로 덧셈정리를 쓰면 P의 좌표가 $a$로 표현되고, 2번째 반사지점은 $\left(-\tfrac{\sqrt3}{2},\tfrac12\right)$이다.'
    steps:
    - {id: 1-2a, content: '$x_{\mathrm{P}}=-\tfrac{\sqrt3}{2}+\tfrac{\sqrt{1-a^2}}{2a}$, 거리 $=\tfrac{1}{2a}$', criteria: ['1-2.M1', '1-2.A1']}
    hint_ladder:
    - $\dfrac{7\pi}{24}$를 $\dfrac{\pi}{24}$와 특수각의 합·차로 써 보자.
  - id: S1-2-B
    audience: B
    source_flow: 모범답안 p.7~8 (채점기준 p.12~13)
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        $\theta=\dfrac{7\pi}{24}$이므로 덧셈정리를 이용하여
        $$\sin\theta=\sin\frac{7\pi}{24}=\sin\left(\frac{\pi}{3}-\frac{\pi}{24}\right)=\sin\frac{\pi}{3}\cos\frac{\pi}{24}-\cos\frac{\pi}{3}\sin\frac{\pi}{24}=\frac12\left\{a\sqrt3-\sqrt{1-a^2}\right\}$$
        을 얻고
        $$\sin5\theta=\sin\frac{35\pi}{24}=\sin\left(\frac{3\pi}{2}-\frac{\pi}{24}\right)=\sin\frac{3\pi}{2}\cos\frac{\pi}{24}-\cos\frac{3\pi}{2}\sin\frac{\pi}{24}=-a$$
        이므로, 점 $\mathrm{P}$의 $x$좌표는 $\dfrac{\sin\theta}{\sin5\theta}=-\dfrac{\sqrt3}{2}+\dfrac{\sqrt{1-a^2}}{2a}$이다.
      criteria: ['1-2.M1']
    - id: 1-2b-2
      content: |
        한편 $2\alpha=2\pi-4\theta=\dfrac{5\pi}{6}$이므로 2번째 반사지점의 좌표는 $(\cos2\alpha,\sin2\alpha)=\left(-\dfrac{\sqrt3}{2},\dfrac12\right)$이다. 따라서 2번째 반사지점에서 점 $\mathrm{P}$까지 빛의 이동거리는
        $$\sqrt{(x-\cos2\alpha)^2+(\sin2\alpha)^2}=\sqrt{\left(\frac{\sqrt{1-a^2}}{2a}\right)^2+\frac14}=\frac{1}{2a}$$
        이다. (보충: $\dfrac{1-a^2}{4a^2}+\dfrac14=\dfrac{1}{4a^2}$, $a>0$)
      criteria: ['1-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 8
      evidence: |
        덧셈정리로 $\sin\theta$, $\sin5\theta$를 $a$로 나타내어 $x_{\mathrm{P}}=-\dfrac{\sqrt3}{2}+\dfrac{\sqrt{1-a^2}}{2a}$를 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: ['1-1.A1'], max_points: 8}
      steps: [1-2b-1]
    - id: 1-2.A1
      mark_type: A
      points: 7
      evidence: |
        2번째 반사지점 $\left(-\dfrac{\sqrt3}{2},\dfrac12\right)$을 구하고 거리 $\dfrac{1}{2a}$를 얻었다.
      depends_on: [1-2.M1]
      steps: [1-2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 1-2] (15점) [그림 1-3]에서 $\angle\mathrm{IOA}=\dfrac{18\pi}{64}$이고 $\angle\mathrm{IOB}=\dfrac{21\pi}{64}$이다. 호 $\mathrm{AB}$를 $H$라 하자. 발사각이 $\theta=\dfrac{59\pi}{128}$일 때, 점 $\mathrm{I}$에서 발사된 빛이 $n$번째 반사지점에서 $H$와 2번째로 만난다고 하자. $n$을 구하라.

    [그림 1-3: 단위원과 $\mathrm{I}(1,0)$. 제1사분면 위쪽에 원 위의 두 점 $\mathrm{A}$, $\mathrm{B}$($\mathrm{B}$가 $\mathrm{A}$보다 반시계 방향으로 조금 더 돌아간 위치)와 원점에서 그은 두 선분 $\mathrm{OA}$, $\mathrm{OB}$, 두 점 사이의 짧은 호에 $H$라는 표시]
  points: 15
  depends_on: []
  answer: {kind: value, value: '55', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$n$번째 반사지점의 동경 각 $\tfrac{5n\pi}{64}$가 $2p\pi+\left[\tfrac{18\pi}{64},\tfrac{21\pi}{64}\right]$에 들어가는 $n$을 $p=0,1,2$ 순으로 찾는다.'
    steps:
    - {id: 2a, content: '$128p+18\le5n\le128p+21$: $p=0\to n=4$, $p=1$ 해 없음, $p=2\to n=55$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 발사각이 주어지면 $\alpha=\pi-2\theta$는 얼마인가?
    - 호 위에 있다는 조건을 $2p\pi$를 더해 부등식으로 써 보자.
  - id: S2-B
    audience: B
    source_flow: 모범답안 p.8 (채점기준 p.13)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        첫 번째 반사지점을 지나는 동경이 시초선과 이루는 각은 $\alpha=\pi-2\theta=\dfrac{5\pi}{64}$이다. 두 번째 이상의 각 반사지점의 동경과 시초선이 이루는 각은 직전 반사지점을 지나는 동경과 시초선이 이루는 각에 $\alpha=\dfrac{5\pi}{64}$을 더한 것이므로, $n$번째 반사지점의 동경과 시초선이 이루는 각은 $n\alpha=\dfrac{5n\pi}{64}$가 된다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 문제에서 주어진 호 $H$에 $n$번째 반사지점이 있다는 것은 어떤 $p=0,1,2,\cdots$에 대하여
        $$2p\pi+\frac{18\pi}{64}\le\frac{5n\pi}{64}\le2p\pi+\frac{21\pi}{64}$$
        를 만족한다는 의미가 된다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        빛이 2번째로 호 $H$와 만나게 되는 순간의 $n$을 $p$의 값을 키워가며 찾아간다.
        - $p=0$일 때, $18\le5n\le21$, 즉 $n=4$이다. 따라서 빛은 4번째 반사지점에서 처음 호 $H$와 만난다.
        - $p=1$일 때, $146\le5n\le149$인데, 이 부등식을 만족하는 자연수 $n$은 없다.
        - $p=2$일 때, $274\le5n\le277$이고, $n=55$이다.

        따라서 빛이 2번째로 호 $H$와 만나는 반사지점은 55번째 반사지점이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $\alpha=\dfrac{5\pi}{64}$와 $n$번째 반사지점의 동경 각 $\dfrac{5n\pi}{64}$를 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        $2p\pi+\dfrac{18\pi}{64}\le\dfrac{5n\pi}{64}\le2p\pi+\dfrac{21\pi}{64}$ 꼴의 조건을 세웠다.
      depends_on: [2.M1]
