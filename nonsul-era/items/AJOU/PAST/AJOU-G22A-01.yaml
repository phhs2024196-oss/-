  - id: S3-B
    audience: B
    source_flow: 모범답안 p.8 (채점기준 p.13~14)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        점 $\mathrm{I}(1,0)$이 발사된 빛의 반사지점 중 하나가 된다고 가정하자. 그러면 적당한 자연수 $n$과 $p$에 대해
        $$n\left(\pi-\frac{2\pi}{\sqrt6}\right)=2p\pi\quad\text{또는}\quad\sqrt6=\frac{n}{n-2p}$$
        을 만족해야 한다. [판독확인: 원 해설 표기 그대로 옮김. 첫 식을 정리하면 $n-2p=\dfrac{2n}{\sqrt6}$, 즉 $\sqrt6=\dfrac{2n}{n-2p}$이므로 둘째 식은 $\sqrt6=\dfrac{2n}{n-2p}$의 오식으로 보임. 우변이 유리수라는 논증에는 영향 없음]
        (보충: $n-2p=\dfrac{2n}{\sqrt6}>0$이므로 분모가 0이 아니고, $\sqrt6=\dfrac{2n}{n-2p}$는 두 정수의 비, 즉 유리수이다.)
      criteria: ['3.M1']
