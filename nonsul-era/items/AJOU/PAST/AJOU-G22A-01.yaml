intent: |
  단위원 안에서 반사하는 빛의 반사지점이 동경 각 $n(\pi-2\theta)$로 놓인다는 규칙을 찾고, 사인법칙·덧셈정리로 좌표와 거리를 구하며, 무리수 성질과 귀류법으로 귀환 불가능성을 증명하는 능력을 본다.
key_idea: |
  입사각=반사각이면 매 반사마다 동경이 $\alpha=\pi-2\theta$씩 돌아가므로 $n$번째 반사지점의 동경 각은 $n\alpha$이다.
