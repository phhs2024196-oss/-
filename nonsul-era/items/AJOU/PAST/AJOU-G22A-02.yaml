stimuli:
- label: 제시문
  body: |
    양수 $a$에 대해, 중심이 점 $(a,0)$인 원이 아래 그림과 같이 $x\ge0$에서 정의된 두 곡선 $y=x^2$, $y=-x^2$과 각각 한 점에서만 만난다. 이때 원의 반지름을 $r$이라고 하고 원과 곡선 $y=x^2$이 만나는 점을 $(s,t)$라고 하자.

    [그림: 원점에서 시작하는 두 곡선 $y=x^2$(위), $y=-x^2$(아래)와 $x$축 위의 점 $a$를 중심으로 하는 원. 원은 $y=x^2$과 점 $(s,t)$에서, $y=-x^2$과 대칭인 점에서 각각 한 점에서 만나고, 중심에서 원 위의 한 점까지 반지름 $r$ 표시]

    점 $(a,0)$이 $x$축을 따라 원점으로 다가갈수록 원의 반지름 $r$은 작아지고, $s$와 $t$도 작아진다. 즉, 세 양수 $r$, $s$, $t$는 $a$에 의존하여 변한다. 특히, 점 $(s,t)$는 다음의 식을 만족함이 알려져 있다.
    $$t=\frac{a-s}{2s}\qquad\text{또는}\qquad 2st+s-a=0\quad\text{--- ㉠}$$
    식 ㉠과 $t=s^2$를 이용하면
    $$2s^3+s=a$$
    를 얻는다. $s$는 양수이므로 $0<s<a$이어야 한다. 그러므로 $\displaystyle\lim_{a\to0+}s=0$이 된다.

stem: |
  [문항 2] (50점) 다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1'
  stem: |
    [문제 2-1] (10점) 원의 중심 $(a,0)$과 점 $(s,t)$를 잇는 선분을 $\ell_1$이라 하고 $\ell_1$과 $x$축이 이루는 예각을 $\theta$(라디안)이라고 하자. $a$가 $0$에 한없이 가까워질 때, $\theta$가 $\dfrac{\pi}{2}$에 한없이 가까워짐을 보여라.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\sin\theta=\tfrac{t}{r}=\tfrac{1}{\sqrt{4s^2+1}}\to1$이고 사인함수의 연속성으로 $\theta\to\tfrac{\pi}{2}$.'
    steps:
    - {id: 1a, content: '$\sin\theta=\tfrac{t}{\sqrt{(2st)^2+t^2}}=\tfrac{1}{\sqrt{4s^2+1}}\to1$', criteria: ['1.M1', '1.R1']}
    hint_ladder:
    - $\ell_1$을 빗변으로 하는 직각삼각형에서 $\sin\theta$를 써 보자.
  - id: S1-B
    audience: B
    source_flow: 모범답안 p.9 (채점기준 p.14)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        식 ㉠을 이용하면
        $$\sin\theta=\frac{t}{r}=\frac{t}{\sqrt{(a-s)^2+t^2}}=\frac{t}{\sqrt{(2st)^2+t^2}}=\frac{1}{\sqrt{4s^2+1}}$$
        이고 $\displaystyle\lim_{a\to0+}\sin\theta=\lim_{s\to0+}\frac{1}{\sqrt{4s^2+1}}=1$이 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $0<\theta<\dfrac{\pi}{2}$이고 $1=\sin\dfrac{\pi}{2}$이므로 사인함수의 연속성에 의하여 $\displaystyle\lim_{a\to0+}\theta=\frac{\pi}{2}$이다.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        $\sin\theta=\dfrac{1}{\sqrt{4s^2+1}}$을 얻고 $\displaystyle\lim_{a\to0+}\sin\theta=1$을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        $0<\theta<\dfrac{\pi}{2}$와 사인함수의 연속성을 근거로 $\theta\to\dfrac{\pi}{2}$를 결론지었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 2-2] (20점) $n=0,1,2,\cdots$에 대하여 다음의 물음에 답하라.
    (1) $\dfrac{a^n}{r}$을 $a$, $r$, $t$를 포함하지 않는 $s$만의 식으로 나타내라.
  points: 5
  depends_on: []
  answer: {kind: expression, value: '(2*s**3+s)**n/(s**2*sqrt(4*s**2+1))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: '$r=t\sqrt{4s^2+1}=s^2\sqrt{4s^2+1}$, $a=2s^3+s$.'
    steps:
    - {id: 2-1a, content: '$\tfrac{a^n}{r}=\tfrac{(2s^3+s)^n}{s^2\sqrt{4s^2+1}}$', criteria: ['2-1.M1', '2-1.A1']}
    hint_ladder:
    - $r$은 $(a,0)$과 $(s,t)$ 사이의 거리이다.
  - id: S2-1-B
    audience: B
    source_flow: 모범답안 p.9 (채점기준 p.14)
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        점 $(s,t)$와 점 $(a,0)$ 사이의 거리가 원의 반지름 $r$이다. 이와 함께 식 ㉠과 점 $(s,t)$가 포물선 위에 있다는 것을 이용하면 식
        $$r=t\sqrt{4s^2+1}=s^2\sqrt{4s^2+1}$$
        을 얻는다.
      criteria: ['2-1.M1']
    - id: 2-1b-2
      content: |
        위 식과 식 $2s^3+s=a$를 이용하면
        $$\frac{a^n}{r}=\frac{(2s^3+s)^n}{s^2\sqrt{4s^2+1}}$$
        의 식을 얻게 된다.
      criteria: ['2-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 2
      evidence: |
        $r=s^2\sqrt{4s^2+1}$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2-1b-1]
    - id: 2-1.A1
      mark_type: A
      points: 3
      evidence: |
        $\dfrac{a^n}{r}=\dfrac{(2s^3+s)^n}{s^2\sqrt{4s^2+1}}$을 얻었다.
      depends_on: [2-1.M1]
      steps: [2-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    (2) $\displaystyle\lim_{a\to0+}\frac{a^n}{r}$이 정수가 되는 $n$을 모두 구하라.
  points: 15
  depends_on: ['2-1']
  answer: {kind: set, value: 'Range(2, oo)', equivalents: ['n>=2 인 모든 정수'], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: '$\tfrac{a^n}{r}=\tfrac{(2s^2+1)^ns^{n-2}}{\sqrt{4s^2+1}}$이므로 $n=0,1$은 발산, $n=2$는 1, $n\ge3$은 0.'
    steps:
    - {id: 2-2a, content: '$n=0,1$: $\infty$, $n=2$: $1$, $n\ge3$: $0$ → 답 $n\ge2$', criteria: ['2-2.B1', '2-2.B2', '2-2.B3', '2-2.B4']}
    hint_ladder:
    - $s^n$을 묶어 내면 분모의 $s^2$과 비교할 수 있다.
  - id: S2-2-B
    audience: B
    source_flow: 모범답안 p.9 (채점기준 p.14~15)
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        $n$에 따라 다음의 극한을 관찰할 수 있다.
        $n=0$: $\displaystyle\lim_{a\to0+}\frac{a^0}{r}=\lim_{s\to0+}\frac{1}{s^2\sqrt{4s^2+1}}=\infty$.
      criteria: ['2-2.B1']
    - id: 2-2b-2
      content: |
        $n=1$: $\displaystyle\lim_{a\to0+}\frac{a}{r}=\lim_{s\to0+}\frac{2s^3+s}{s^2\sqrt{4s^2+1}}=\lim_{s\to0+}\frac{2s^2+1}{s\sqrt{4s^2+1}}=\infty$.
      criteria: ['2-2.B2']
    - id: 2-2b-3
      content: |
        $n=2$: $\displaystyle\lim_{a\to0+}\frac{a^2}{r}=\lim_{s\to0+}\frac{(2s^3+s)^2}{s^2\sqrt{4s^2+1}}=\lim_{s\to0+}\frac{(2s^2+1)^2}{\sqrt{4s^2+1}}=1$.
      criteria: ['2-2.B3']
    - id: 2-2b-4
      content: |
        $n\ge3$: $\displaystyle\lim_{a\to0+}\frac{a^n}{r}=\lim_{s\to0+}\frac{(2s^3+s)^n}{s^2\sqrt{4s^2+1}}=\lim_{s\to0+}\frac{(2s^2+1)^ns^{n-2}}{\sqrt{4s^2+1}}=0$.
        따라서 문제에서 구하는 답은 $2$ 이상의 정수가 된다.
      criteria: ['2-2.B4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.B1
      mark_type: B
      points: 2
      evidence: |
        $n=0$일 때 극한이 $\infty$(발산)임을 보였다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: ['2-1.A1'], max_points: 2}
      steps: [2-2b-1]
    - id: 2-2.B2
      mark_type: B
      points: 4
      evidence: |
        $n=1$일 때 극한이 $\infty$(발산)임을 보였다.
      depends_on: []
      steps: [2-2b-2]
    - id: 2-2.B3
      mark_type: B
      points: 5
      evidence: |
        $n=2$일 때 극한값 $1$을 구했다.
      depends_on: []
      steps: [2-2b-3]
    - id: 2-2.B4
      mark_type: B
      points: 4
      evidence: |
        $n\ge3$일 때 극한값 $0$을 구하고 답 「$2$ 이상의 정수」를 적었다.
      depends_on: []
      steps: [2-2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3-1'
  stem: |
    [문제 2-3] (20점) 제시문과 [문제 2-1]을 참고하여 다음의 물음에 답하라.
    (1) $x$축에 대하여 선분 $\ell_1$과 대칭인 선분을 $\ell_2$라 하자. $x\ge0$에서 정의된 두 곡선 $y=x^2$, $y=-x^2$과 두 선분 $\ell_1$, $\ell_2$로 둘러싸인 영역의 넓이를 $S$라 하자. $S$를 $a$, $r$, $t$를 포함하지 않는 $s$만의 식으로 나타내라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '2*s**5+2*s**3/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-1-A
    audience: A
    method_no: 1
    key_idea: '영역 = 포물선 아래 두 조각 + 두 직각삼각형: $S=(a-s)t+2\int_0^sx^2dx$.'
    steps:
    - {id: 3-1a, content: '$S=(2st)t+\tfrac23s^3=2s^5+\tfrac23s^3$', criteria: ['3-1.M1', '3-1.A1']}
    hint_ladder:
    - $x=s$에서 영역을 둘로 나눠 보자.
  - id: S3-1-B
    audience: B
    source_flow: 모범답안 p.9~10 (채점기준 p.15)
    method_no: 1
    steps:
    - id: 3-1b-1
      content: |
        관찰을 통해 $S=(a-s)t+2\displaystyle\int_0^sx^2dx$임을 알 수 있다. (보충: $0\le x\le s$에서는 두 포물선 사이, $s\le x\le a$에서는 밑변 $a-s$, 높이 $t$인 직각삼각형 두 개)
      criteria: ['3-1.M1']
    - id: 3-1b-2
      content: |
        따라서, 식 ㉠과 점 $(s,t)$가 포물선 위에 있다는 것에 의하여 식
        $$S=(2st)t+\frac23s^3=2s^5+\frac23s^3$$
        을 얻는다.
      criteria: ['3-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 5
      evidence: |
        $S=(a-s)t+2\displaystyle\int_0^sx^2dx$ 또는 동치인 넓이 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [3-1b-1]
    - id: 3-1.A1
      mark_type: A
      points: 5
      evidence: |
        $S=2s^5+\dfrac23s^3$을 얻었다.
      depends_on: [3-1.M1]
      steps: [3-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3-2'
  stem: |
    (2) (1)에서 서술한 영역 중 원 내부에 포함된 부분의 넓이를 $T$라 할 때, $\displaystyle\lim_{a\to0+}\frac{T}{S}$을 구하라.
  points: 10
  depends_on: ['1', '2-1', '3-1']
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S3-2-A
    audience: A
    method_no: 1
    key_idea: '원 내부 부분은 중심각 $2\theta$인 부채꼴이므로 $T=r^2\theta=s^4(4s^2+1)\theta$, $T/S$는 $s\to0$에서 0.'
    steps:
    - {id: 3-2a, content: '$\tfrac{T}{S}=\tfrac{s(4s^2+1)}{2s^2+\tfrac23}\theta\to0\cdot\tfrac{\pi}{2}=0$', criteria: ['3-2.M1', '3-2.A1']}
    hint_ladder:
    - 원 내부에 들어가는 부분은 어떤 도형인가?
  - id: S3-2-B
    audience: B
    source_flow: 모범답안 p.10 (채점기준 p.15)
    method_no: 1
    steps:
    - id: 3-2b-1
      content: |
        부채꼴의 넓이의 공식을 이용하면 $T=r^2\theta=s^4(4s^2+1)\theta$이다. (보충: 중심각 $2\theta$, 반지름 $r$인 부채꼴이므로 $T=\tfrac12r^2\cdot2\theta$)
      criteria: ['3-2.M1']
    - id: 3-2b-2
