stimuli:
- label: 가
  body: |
    짧은 신호(S)와 긴 신호(L)만으로 구성된 전신부호를 **모스부호**라 한다. 모스부호에 들어 있는 신호의 총 개수를 그 모스부호의 **길이**라 한다. 예를 들어, SSL은 길이가 3인 모스부호이고, LSLLS는 길이가 5인 모스부호이다. 길이가 $n$인 모든 모스부호의 개수가 $2^n$인 것은 자명하다. 아래 조건 ㉠을 만족하며 길이가 $n$인 모스부호의 개수를 $a_n$이라 하자.

    > ㉠ 긴 신호(L)가 2개 이상 연속해서 나타나지 않는다.

    조건 ㉠을 만족하는 모스부호 중에서 길이가 1인 것은 S, L이므로 $a_1=2$, 길이가 2인 것은 SS, SL, LS이므로 $a_2=3$, 길이가 3인 것은 SSS, SSL, SLS, LSS, LSL이므로 $a_3=5$이다. 따라서, $a_3=a_2+a_1$이다. 일반적으로 모든 자연수 $n$에 대하여
    $$a_{n+2}=a_{n+1}+a_n$$
    이 성립한다. 그리고 수열 $\left\{\dfrac{a_{n+1}}{a_n}\right\}$이 수렴한다는 것이 알려져 있다.
- label: 나
  body: |
    위에서 주어진 조건을 바꾸면 모스부호들의 개수가 달라진다. 아래의 조건 ㉡을 만족하며 길이가 $n$인 모스부호의 개수를 $b_n$이라 하자.

    > ㉡ 긴 신호(L)가 3개 이상 연속해서 나타나지 않는다.

    조건 ㉡을 만족하는 모스부호 중에서 길이가 1인 것은 S, L이므로 $b_1=2$, 길이가 2인 것은 SS, SL, LS, LL이므로 $b_2=4$이고, 길이가 3인 것은 SSS, SSL, SLS, SLL, LSS, LSL, LLS이므로 $b_3=7$이다. 한편, 수열 $\left\{\dfrac{b_{n+1}}{b_n}\right\}$이 수렴한다는 것이 알려져 있다.

stem: |
  [문항 1] (50점) 다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (20점) 제시문 (가)를 읽고 다음 질문에 답하라.
    (1) 모든 자연수 $n$에 대하여 다음 부등식이 성립함을 수학적 귀납법을 이용하여 증명하라.
    $$\left(\frac32\right)^n\le a_n\le2^n$$
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: '$a_n\le2a_{n-1}$($n\ge2$)에서 위쪽은 바로, 아래쪽은 $3a_k\le2a_{k+1}$로 $a_{k+1}\ge\tfrac32a_k$.'
    steps:
    - {id: 1-1a, content: '$n=1,2$ 확인 → $a_{k+1}\le2a_k\le2^{k+1}$, $a_{k+1}\ge\tfrac32a_k\ge(\tfrac32)^{k+1}$', criteria: ['1-1.B1', '1-1.B2', '1-1.M1', '1-1.R1']}
    hint_ladder:
    - 수열이 증가하므로 $a_n=a_{n-1}+a_{n-2}\le2a_{n-1}$이다.
    - $3a_k=2a_k+a_k$에서 $a_k\le2a_{k-1}$을 써 보자.
  - id: S1-1-B
    audience: B
    source_flow: 모범답안 p.5 (채점기준 p.10)
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        $a_2\le2a_1$이고, $n\ge3$이면 $a_n=a_{n-1}+a_{n-2}\le2a_{n-1}$이다. 그러므로
        $$a_n\le2a_{n-1},\quad(n\ge2)\quad\text{.....㉠}$$
        이 성립한다. (원문 기호 ㉠은 제시문의 조건 ㉠과 별개로 이 부등식을 가리킴)
        $n=1$일 때, $a_1=2$이므로 $\dfrac32\le a_1\le2$가 성립한다.
      criteria: ['1-1.B1']
    - id: 1-1b-2
      content: |
        $n=2$일 때, $a_2=3$이므로 $\left(\dfrac32\right)^2\le a_2\le2^2$이 성립한다.
      criteria: ['1-1.B2']
    - id: 1-1b-3
      content: |
        $k\ge2$라 하자. 주어진 부등식이 $n=k$일 때 성립한다고 가정하고 $n=k+1$일 때 성립함을 증명한다. ㉠를 이용하면 다음이 성립함을 알 수 있다.
        $$a_{k+1}\le2a_k\le2\times2^k=2^{k+1}$$
      criteria: ['1-1.M1']
    - id: 1-1b-4
      content: |
        한편 ㉠를 이용하면, $3a_k=2a_k+a_k\le2a_k+2a_{k-1}=2(a_k+a_{k-1})=2a_{k+1}$이다. 즉, $a_{k+1}\ge\dfrac32a_k$이다. 따라서
        $$a_{k+1}\ge\frac32a_k\ge\frac32\left(\frac32\right)^k\ge\left(\frac32\right)^{k+1}$$
        이 성립한다.
      criteria: ['1-1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.B1
      mark_type: B
      points: 1
      evidence: |
        $n=1$일 때 $\dfrac32\le a_1=2\le2$를 확인했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.B2
      mark_type: B
      points: 2
      evidence: |
        $n=2$일 때 $\left(\dfrac32\right)^2\le a_2=3\le2^2$을 확인했다.
      depends_on: []
      steps: [1-1b-2]
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        귀납 가정과 $a_n\le2a_{n-1}$로 $a_{k+1}\le2^{k+1}$을 보였다.
      depends_on: []
      steps: [1-1b-3]
    - id: 1-1.R1
      mark_type: R
      points: 4
      evidence: |
        $3a_k\le2a_{k+1}$(즉 $a_{k+1}\ge\dfrac32a_k$)을 이끌고 $a_{k+1}\ge\left(\dfrac32\right)^{k+1}$을 보였다.
      depends_on: []
      steps: [1-1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) $A=\displaystyle\lim_{n\to\infty}\frac{a_{n+1}}{a_n}$라 하자. $A$의 값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '(1+sqrt(5))/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: '점화식을 $a_{n+1}$로 나누고 극한을 취하면 $A=1+\tfrac1A$, $A\ge1$.'
    steps:
    - {id: 1-2a, content: '$A^2-A-1=0$, $A=\tfrac{1+\sqrt5}{2}$', criteria: ['1-2.M1', '1-2.A1']}
    hint_ladder:
    - $\dfrac{a_n}{a_{n+1}}$의 극한은 $A$로 어떻게 쓰이는가?
  - id: S1-2-B
    audience: B
    source_flow: 모범답안 p.5 (채점기준 p.10)
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        모든 자연수 $n$에 대하여 $a_{n+1}\ge a_n$이므로 $A\ge1$이다. 관계식 $a_{n+2}=a_{n+1}+a_n$의 양변을 $a_{n+1}$로 나누면
        $$\frac{a_{n+2}}{a_{n+1}}=1+\frac{a_n}{a_{n+1}}$$
        을 얻는다. $\displaystyle\lim_{n\to\infty}\frac{a_{n+2}}{a_{n+1}}=A$이고 $\displaystyle\lim_{n\to\infty}\frac{a_n}{a_{n+1}}=\frac1A$이므로 위의 식의 양변에서 $n$을 무한대로 보내면 $A=1+\dfrac1A$이 된다. 즉 $A^2-A-1=0$. 그러므로 $A$는 $x^2-x-1=0$의 근이다.
      criteria: ['1-2.M1']
    - id: 1-2b-2
      content: |
        이 방정식의 두 근은 $\dfrac{1\pm\sqrt5}{2}$인데, $A\ge1$이므로 $A=\dfrac{1+\sqrt5}{2}$이다.
      criteria: ['1-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 7
      evidence: |
        점화식을 $a_{n+1}$로 나누고 극한을 취해 $A=1+\dfrac1A$(즉 $A^2-A-1=0$)를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-1]
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        $A\ge1$을 근거로 $A=\dfrac{1+\sqrt5}{2}$를 골랐다.
      depends_on: [1-2.M1]
      steps: [1-2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 1-2] (30점) 제시문 (나)를 읽고 다음 질문에 답하라.
    (1) 모든 자연수 $n$에 대하여 성립하는 $b_n$, $b_{n+1}$, $b_{n+2}$, $b_{n+3}$의 관계식을 구하라.
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'Eq(b(n+3), b(n+2)+b(n+1)+b(n))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: '길이 $n+3$인 부호를 S / LS / LLS로 시작하는 경우로 나누면 각각 $b_{n+2}$, $b_{n+1}$, $b_n$개.'
    steps:
    - {id: 2-1a, content: '$b_{n+3}=b_{n+2}+b_{n+1}+b_n$', criteria: ['2-1.M1', '2-1.M2', '2-1.M3', '2-1.A1']}
    hint_ladder:
    - 첫 신호가 S인 경우와 L인 경우로 나누어 보자.
    - LL로 시작하면 셋째 신호는 무엇이어야 하는가?
  - id: S2-1-B
    audience: B
    source_flow: 모범답안 p.5~6 (채점기준 p.10~11)
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        길이가 $(n+3)$이며 조건 ㉡을 만족하는 모스부호의 첫 번째와 두 번째 신호에 따라 경우를 나누어 생각한다.
        (a) 첫 번째 신호가 S인 경우: 2번째부터 $(n+3)$번째까지 신호로 이루어진 모스부호는 길이가 $(n+2)$이며 조건 ㉡을 만족하므로 이 경우의 모스부호 개수는 $b_{n+2}$이다.
      criteria: ['2-1.M1']
    - id: 2-1b-2
      content: |
        (b) 첫 번째 신호는 L이고, 두 번째 신호는 S인 경우: 3번째부터 $(n+3)$번째까지 신호로 이루어진 모스부호는 길이가 $(n+1)$이며 조건 ㉡을 만족하므로 이 경우의 모스부호 개수는 $b_{n+1}$이다.
      criteria: ['2-1.M2']
    - id: 2-1b-3
      content: |
        (c) 첫 번째 신호와 두 번째 신호가 모두 L인 경우: 3번째 신호는 자동적으로 S이다. 그리고 4번째부터 $(n+3)$번째까지 신호로 이루어진 모스부호는 길이가 $n$이며 조건 ㉡을 만족하므로 이 경우의 모스부호 개수는 $b_n$이다.
      criteria: ['2-1.M3']
    - id: 2-1b-4
      content: |
        세 가지 경우의 개수를 모두 합하여 관계식
        $$b_{n+3}=b_{n+2}+b_{n+1}+b_n$$
        을 얻는다.
      criteria: ['2-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 3
      evidence: |
        첫 신호가 S인 경우의 개수가 $b_{n+2}$임을 근거와 함께 적었다.
      depends_on: []
      implied_ok: false
      steps: [2-1b-1]
    - id: 2-1.M2
      mark_type: M
      points: 3
      evidence: |
        LS로 시작하는 경우의 개수가 $b_{n+1}$임을 근거와 함께 적었다.
      depends_on: []
      steps: [2-1b-2]
    - id: 2-1.M3
      mark_type: M
      points: 3
      evidence: |
        LL로 시작하면 셋째 신호가 S로 정해지고 개수가 $b_n$임을 적었다.
      depends_on: []
      steps: [2-1b-3]
    - id: 2-1.A1
      mark_type: A
      points: 6
      evidence: |
        $b_{n+3}=b_{n+2}+b_{n+1}+b_n$을 얻었다.
      depends_on: [2-1.M1, 2-1.M2, 2-1.M3]
      steps: [2-1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    (2) $B=\displaystyle\lim_{n\to\infty}\frac{b_{n+1}}{b_n}$라 하자. 부등식 $\dfrac32<B<2$이 성립함을 증명하라.
  points: 15
  depends_on: ['2-1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: '$B$는 $f(x)=x^3-x^2-x-1=0$의 근이고, $f$는 실근이 하나뿐이며 $f(\tfrac32)<0<f(2)$.'
    steps:
    - {id: 2-2a, content: '$B^3=B^2+B+1$, 극값 $f(-\tfrac13)=-\tfrac{22}{27}$, $f(1)=-2$, $f(\tfrac32)=-\tfrac{11}{8}$, $f(2)=1$', criteria: ['2-2.M1', '2-2.R1', '2-2.R2']}
    hint_ladder:
    - $\dfrac{b_{n+3}}{b_n}$의 극한은 $B$로 어떻게 쓰이는가?
    - 근이 하나뿐임을 보이면 사잇값 정리로 위치를 잡을 수 있다.
  - id: S2-2-B
    audience: B
    source_flow: 모범답안 p.6 (채점기준 p.11)
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        문제 (1)에서 얻은 관계식의 양변을 $b_n$으로 나누면 $\dfrac{b_{n+3}}{b_n}=\dfrac{b_{n+2}}{b_n}+\dfrac{b_{n+1}}{b_n}+1$이 된다. 그런데
        $$\lim_{n\to\infty}\frac{b_{n+3}}{b_n}=\lim_{n\to\infty}\frac{b_{n+3}}{b_{n+2}}\frac{b_{n+2}}{b_{n+1}}\frac{b_{n+1}}{b_n}=B^3,\quad\lim_{n\to\infty}\frac{b_{n+2}}{b_n}=\lim_{n\to\infty}\frac{b_{n+2}}{b_{n+1}}\frac{b_{n+1}}{b_n}=B^2$$
        이다. 따라서 위의 관계식에서 $n$을 무한대로 보내어 $B^3=B^2+B+1$을 얻는다. 이제 $f(x)=x^3-x^2-x-1$라 놓으면 $B$는 방정식 $f(x)=0$의 근이다.
      criteria: ['2-2.M1']
    - id: 2-2b-2
      content: |
        $f(x)$의 증감을 조사하면 $y=f(x)$의 그래프는 $x$축과 한 번 만난다는 사실을 알 수 있다.

        | $x$ | $\cdots$ | $-\frac13$ | $\cdots$ | $1$ | $\cdots$ |
        |---|---|---|---|---|---|
        | $f'(x)$ | $+$ | $0$ | $-$ | $0$ | $+$ |
        | $f(x)$ | 증가 | $-\frac{22}{27}$ | 감소 | $-2$ | 증가 |

        [그림: $y=x^3-x^2-x-1$의 그래프. $x=-\tfrac13$에서 극대(음수), $x=1$에서 극소($-2$), 그 오른쪽에서 $x$축과 한 번 만남]
      criteria: ['2-2.R1']
    - id: 2-2b-3
      content: |
        그런데 $f\left(\dfrac32\right)=-\dfrac{11}{8}<0$이고 $f(2)=1>0$이므로 사잇값 정리에 의하여 $\dfrac32<B<2$이 증명된다.
      criteria: ['2-2.R2']
