    key_idea: '$y=n\alpha$로 두면 $\tfrac{\sin(n\alpha)}{\alpha(\pi-n\alpha)}=\tfrac{n\sin y}{y(\pi-y)}$이고 (3)에 의해 $y=\tfrac{\pi}{2}$에서 최대.'
    steps:
