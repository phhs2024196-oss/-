stimuli:
- label: 가
  body: |
    자연수 $n$에 대하여 함수 $f(x)=\dfrac{1}{n+1}\sin(nx)$의 정의역을 $0\le x\le\dfrac{\pi}{n}$이라 하자. 예를 들어 $n=2$일 때 함수 $f(x)$의 그래프는 다음과 같다.

    [그림: $n=2$일 때 $y=f(x)$의 그래프. 원점에서 출발해 위로 볼록하게 올라갔다가 $x=\tfrac{\pi}{2}$에서 $x$축과 만나는 곡선]

    함수 $f(x)$의 그래프와 $x$축으로 둘러싸인 부분의 넓이 $S_n$을 정적분을 이용하여 구할 수 있다.
- label: 나
  body: |
    함수 $f(x)$의 그래프가 위로 볼록하므로 위로 볼록한 그래프를 가지는 이차함수를 이용하여 $S_n$에 대한 어림값을 구할 수 있다. 자연수 $n$에 대하여 $f(x)$의 그래프 위의 한 점 $\mathrm{P}(\alpha,f(\alpha))$ (단, $0<\alpha<\dfrac{\pi}{n}$)를 잡고, 세 점 $\mathrm{O}(0,0)$, $\mathrm{P}(\alpha,f(\alpha))$, $\mathrm{Q}\left(\dfrac{\pi}{n},0\right)$을 지나는 이차함수의 그래프와 $x$축으로 둘러싸인 부분의 넓이를 $T_n$이라 하면 $T_n$은 $S_n$에 대한 어림값이다. 점 $\mathrm{P}$의 위치가 변하면 $T_n$도 변한다.
- label: 다
  body: |
    두 함수 $g(x)$, $h(x)$가 공통의 정의역에서 함숫값이 $0$보다 크고 $K$는 상수라 하자. 다음 부등식 ㉠이 참이면 부등식 ㉡도 참이다.
    $$Kh(x)-g(x)\ge0\ \text{---㉠}\qquad\qquad\frac{g(x)}{h(x)}\le K\ \text{---㉡}$$

stem: |
  [문항 2] (50점) 다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 2-1] (15점) 제시문 (가)를 읽고 다음 물음에 답하라.
    (1) 각 자연수 $n$에 대하여 제시문 (가)에서 서술한 $S_n$을 구하라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '2/(n*(n+1))', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: '$S_n=\int_0^{\pi/n}\tfrac{1}{n+1}\sin(nx)dx$.'
    steps:
    - {id: 1-1a, content: '$S_n=\tfrac{2}{n(n+1)}$', criteria: ['1-1.M1', '1-1.A1']}
    hint_ladder:
    - $\sin(nx)$의 부정적분은 $-\dfrac1n\cos(nx)$이다.
  - id: S1-1-B
    audience: B
    source_flow: 모범답안 p.7 (채점기준 p.12)
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        각 자연수 $n$에 대하여 $S_n=\displaystyle\int_0^{\pi/n}f(x)dx$.
      criteria: ['1-1.M1']
    - id: 1-1b-2
      content: |
        계산하면
        $$S_n=\int_0^{\pi/n}\frac{1}{n+1}\sin(nx)dx=\left[-\frac{1}{n(n+1)}\cos(nx)\right]_0^{\pi/n}=-\frac{1}{n(n+1)}(-1-1)=\frac{2}{n(n+1)}$$
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        $S_n=\displaystyle\int_0^{\pi/n}f(x)dx$를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.A1
      mark_type: A
      points: 7
      evidence: |
        $S_n=\dfrac{2}{n(n+1)}$을 계산했다.
      depends_on: [1-1.M1]
      steps: [1-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) 급수 $\displaystyle\sum_{n=1}^{\infty}S_n$의 값을 구하라.
  points: 5
  depends_on: ['1-1']
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: 부분분수로 망원합.
    steps:
    - {id: 1-2a, content: '$\sum\tfrac{2}{n(n+1)}=2\sum\left(\tfrac1n-\tfrac{1}{n+1}\right)=2$', criteria: ['1-2.B1']}
    hint_ladder:
    - $\dfrac{1}{n(n+1)}$을 두 분수의 차로 써 보자.
  - id: S1-2-B
    audience: B
    source_flow: 모범답안 p.7 (채점기준 p.12)
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        $$\sum_{n=1}^{\infty}S_n=\sum_{n=1}^{\infty}\frac{2}{n(n+1)}=2\sum_{n=1}^{\infty}\left(\frac1n-\frac{1}{n+1}\right)=2.$$
      criteria: ['1-2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.B1
      mark_type: B
      points: 5
      evidence: |
        부분분수 분해로 급수의 합 $2$를 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: ['1-1.A1'], max_points: 5}
      steps: [1-2b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 2-2] (35점) 제시문을 이용하여 다음 물음에 답하라.
    (1) 각 자연수 $n$에 대하여 제시문 (나)에서 서술한 $T_n$을 $n$과 $\alpha$에 대한 식으로 나타내라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'pi**3*sin(n*alpha)/(6*n**2*(n+1)*alpha*(pi-n*alpha))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: '$g(x)=cx\left(x-\tfrac{\pi}{n}\right)$, $g(\alpha)=f(\alpha)$로 $c$를 정하고 $\int_0^{\pi/n}x\left(x-\tfrac{\pi}{n}\right)dx=-\tfrac16\left(\tfrac{\pi}{n}\right)^3$.'
    steps:
    - {id: 2-1a, content: '$T_n=\tfrac{\pi^3}{6n^2(n+1)}\cdot\tfrac{\sin(n\alpha)}{\alpha(\pi-n\alpha)}$', criteria: ['2-1.M1', '2-1.A1']}
    hint_ladder:
    - 두 $x$절편을 아는 이차함수는 어떤 꼴로 둘 수 있는가?
  - id: S2-1-B
    audience: B
    source_flow: 모범답안 p.7 (채점기준 p.12)
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        세 점 $\mathrm{O}(0,0)$, $\mathrm{P}(\alpha,f(\alpha))$, $\mathrm{Q}(\pi/n,0)$을 지나는 이차함수는 $g(x)=cx\left(x-\dfrac{\pi}{n}\right)$의 형태로 표현할 수 있고, 점 $\mathrm{P}(\alpha,f(\alpha))$를 지나야 하므로 $c=\dfrac{1}{n+1}\dfrac{\sin(n\alpha)}{\alpha\left(\alpha-\frac{\pi}{n}\right)}$가 된다. 즉,
        $$g(x)=\frac{1}{n+1}\frac{\sin(n\alpha)}{\alpha\left(\alpha-\frac{\pi}{n}\right)}x\left(x-\frac{\pi}{n}\right).$$
      criteria: ['2-1.M1']
    - id: 2-1b-2
      content: |
        따라서, $T_n$은
        $$T_n=\frac{1}{n+1}\frac{\sin(n\alpha)}{\alpha\left(\alpha-\frac{\pi}{n}\right)}\int_0^{\pi/n}\left(x^2-\frac{\pi}{n}x\right)dx=\frac{1}{n+1}\frac{\sin(n\alpha)}{\alpha\left(\alpha-\frac{\pi}{n}\right)}\left[\frac13x^3-\frac{\pi}{n}\frac12x^2\right]_0^{\frac{\pi}{n}}=\frac{1}{n+1}\frac{\sin(n\alpha)}{\alpha\left(\alpha-\frac{\pi}{n}\right)}\left(-\frac16\right)\left(\frac{\pi}{n}\right)^3$$
        이다. 이것을 정리하면
        $$T_n=\frac{\pi^3}{6n^2(n+1)}\frac{\sin(n\alpha)}{\alpha(\pi-n\alpha)}$$
      criteria: ['2-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 5
      evidence: |
        세 점을 지나는 이차함수 $g(x)=\dfrac{1}{n+1}\dfrac{\sin(n\alpha)}{\alpha\left(\alpha-\frac{\pi}{n}\right)}x\left(x-\dfrac{\pi}{n}\right)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2-1b-1]
    - id: 2-1.A1
      mark_type: A
      points: 5
      evidence: |
        정적분으로 $T_n=\dfrac{\pi^3}{6n^2(n+1)}\dfrac{\sin(n\alpha)}{\alpha(\pi-n\alpha)}$를 얻었다.
      depends_on: [2-1.M1]
      steps: [2-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    (2) $\displaystyle\lim_{\alpha\to0+}T_n$을 구하라.
  points: 5
  depends_on: ['2-1']
  answer: {kind: expression, value: 'pi**2/(6*n*(n+1))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: '$\tfrac{\sin(n\alpha)}{n\alpha}\to1$.'
    steps:
    - {id: 2-2a, content: '$\lim T_n=\tfrac{\pi^2}{6n(n+1)}$', criteria: ['2-2.B1']}
    hint_ladder:
    - $\sin(n\alpha)$와 짝을 이룰 $n\alpha$를 만들어 보자.
  - id: S2-2-B
    audience: B
    source_flow: 모범답안 p.7 (채점기준 p.12)
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        $T_n=\dfrac{\pi^3}{6n(n+1)}\dfrac{1}{(\pi-n\alpha)}\dfrac{\sin(n\alpha)}{n\alpha}$이므로, $\displaystyle\lim_{\alpha\to0+}\frac{\sin(n\alpha)}{n\alpha}=1$을 이용하여 다음을 얻는다.
        $$\lim_{\alpha\to0+}T_n=\frac{\pi^2}{6n(n+1)}$$
      criteria: ['2-2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.B1
      mark_type: B
      points: 5
      evidence: |
        $\dfrac{\sin(n\alpha)}{n\alpha}\to1$을 이용해 $\displaystyle\lim_{\alpha\to0+}T_n=\dfrac{\pi^2}{6n(n+1)}$을 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: ['2-1.A1'], max_points: 5}
      steps: [2-2b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-3'
  stem: |
    (3) $n=1$이라 하자. (1)과 제시문 (다)를 이용하여 $\alpha=\dfrac{\pi}{2}$일 때 $T_1$이 최댓값을 가짐을 증명하라.
  points: 15
  depends_on: ['2-1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-3-A
    audience: A
    method_no: 1
    key_idea: '$h(x)=\tfrac{\sin x}{x(\pi-x)}$는 $x=\tfrac{\pi}{2}$에 대칭이므로 $\left(0,\tfrac{\pi}{2}\right]$에서 $k(x)=\tfrac{4}{\pi^2}x(\pi-x)-\sin x\ge0$을 보이면 된다; $k''=0$의 근이 하나뿐이라는 사실과 롤의 정리로 귀류.'
    steps:
    - {id: 2-3a, content: '$k(0+)=k(\tfrac{\pi}{2})=0$, $k''(0+)>0$, $k''(\tfrac{\pi}{2})=0$, $k''''=0$의 근 1개 ⇒ $k\ge0$', criteria: ['2-3.M1', '2-3.M2', '2-3.R1']}
    hint_ladder:
    - $T_1$을 최대로 하는 것은 $\dfrac{\sin\alpha}{\alpha(\pi-\alpha)}$를 최대로 하는 것이다.
    - 제시문 (다)로 분수 부등식을 $k(x)\ge0$으로 바꿔 보자.
    - $k(x)<0$인 점이 있다면 $k'$의 근은 몇 개 생기는가?
  - id: S2-3-B
    audience: B
    source_flow: 모범답안 p.8 (채점기준 p.13)
    method_no: 1
    steps:
    - id: 2-3b-1
      content: |
        (1)에서 구한 $T_1=\dfrac{\pi^3}{12}\dfrac{\sin\alpha}{\alpha(\pi-\alpha)}$가 $\alpha=\dfrac{\pi}{2}$에서 최댓값 $\dfrac{\pi}{3}$를 갖는 것을 증명하기 위해서 구간 $0<x<\pi$에서 정의된 함수 $h(x)=\dfrac{\sin x}{x(\pi-x)}$가 $x=\dfrac{\pi}{2}$에서 최댓값 $h\left(\dfrac{\pi}{2}\right)=\dfrac{4}{\pi^2}$을 갖는 것을 증명하면 된다. 그런데 함수 $h(x)$의 그래프는 $x=\dfrac{\pi}{2}$를 중심으로 대칭이므로 $0<x\le\dfrac{\pi}{2}$일 때 $h(x)=\dfrac{\sin x}{x(\pi-x)}\le\dfrac{4}{\pi^2}$이 성립함을 보이면 된다. $k(x)=\dfrac{4}{\pi^2}x(\pi-x)-\sin x$라 놓으면, 제시문 (다)에 의하여 $0<x\le\dfrac{\pi}{2}$일 때 $k(x)\ge0$을 보이면 된다.
      criteria: ['2-3.M1']
    - id: 2-3b-2
      content: |
        $k(x)$와 $k'(x)=\dfrac{4}{\pi^2}(\pi-2x)-\cos x$ 그리고 $k''(x)=-\dfrac{8}{\pi^2}+\sin x$에 대한 다음과 같은 사실을 확인할 수 있다.
        ① $\displaystyle\lim_{x\to0+}k(x)=0$, $k\left(\dfrac{\pi}{2}\right)=0$
        ② $\displaystyle\lim_{x\to0+}k'(x)=\dfrac{4}{\pi}-1>0$, $k'\left(\dfrac{\pi}{2}\right)=0$.
      criteria: ['2-3.M2']
    - id: 2-3b-3
      content: |
        ③ $k''(x)=0$을 만족하는 $x$는 구간 $\left(0,\dfrac{\pi}{2}\right)$에 오직 한 개 존재한다. (보충: $\sin x$는 이 구간에서 증가하고 $0<\dfrac{8}{\pi^2}<1$)
        이제 $k(x)<0$이 되는 $x$가 구간 $\left(0,\dfrac{\pi}{2}\right)$에 존재한다고 가정하자. 그러면 함수 $k(x)$는 0부터 $\dfrac{\pi}{2}$ 사이에서 차례로 증가, 감소, 증가하는 구간을 가지므로 $k'(x)=0$을 만족하는 $x$가 구간 $\left(0,\dfrac{\pi}{2}\right)$에 2개 이상 존재한다. $k'\left(\dfrac{\pi}{2}\right)=0$이므로 롤의 정리에 의해 $k''(x)=0$을 만족하는 $x$가 구간 $\left(0,\dfrac{\pi}{2}\right)$에 2개 이상 존재하고, 이것은 ③에 모순이다. 그러므로 $k(x)\ge0$이 성립한다.
      criteria: ['2-3.R1']
