- id: '2-2'
  stem: |
    (2) $L\ge e-e^{-1}$을 만족하는 순서쌍 $(n,l)$을 모두 구하라.
  points: 10
  depends_on: ['2-1']
  answer: {kind: set, value: '2*n >= l', equivalents: ['n/l >= 1/2 인 모든 (n,l) (n,l은 1~6)'], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: '$L$은 $\tfrac{n}{l}$에 대해 증가하고 $\tfrac{n}{l}=\tfrac12$일 때 A→B→A로 정확히 $e-e^{-1}$.'
    steps:
    - {id: 2-2a, content: '답: $2n\ge l$', criteria: ['2-2.R1', '2-2.B1', '2-2.A1']}
    hint_ladder:
    - $\dfrac{n}{l}$이 클수록 이동량은 어떻게 되는가?
  - id: S2-2-B
    audience: B
    source_flow: 모범답안 p.9 (채점기준 p.17)
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        $\dfrac{n}{l}$이 클수록 점 Q의 이동량과 $L$이 증가한다. (보충: $L=\displaystyle\int_0^{2\pi}f(g(t))\lvert g'(t)\rvert dt$에서 $u=\tfrac{n}{l}t$로 치환하면 $L=\displaystyle\int_0^{2\pi n/l}\cosh(\sin u)\lvert\cos u\rvert du$이고 피적분함수가 $0$ 이상이므로 위끝 $\tfrac{2\pi n}{l}$에 대해 증가)
      criteria: ['2-2.R1']
    - id: 2-2b-2
      content: |
        $\dfrac{n}{l}=\dfrac12$일 때 점 Q는 점 $\mathrm{A}(0,1)$에서 출발하여 점 $\mathrm{B}(1,f(1))$를 거쳐 점 $\mathrm{A}(0,1)$로 되돌아 오면서 이동을 끝낸다. 이때 $L=e-e^{-1}$이다.
      criteria: ['2-2.B1']
    - id: 2-2b-3
      content: |
        따라서, $L\ge e-e^{-1}$을 만족하는 순서쌍 $(n,l)$은 $2n\ge l$을 만족하는 모든 순서쌍 $(n,l)$이다.
      criteria: ['2-2.A1']
