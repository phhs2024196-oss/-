intent: |
  주사위 눈으로 정해지는 $\dfrac{n}{l}$에 대해 삼각함수 제곱의 정적분과 현수선 위 점의 이동거리(곡선의 길이)를 구하고, $\dfrac{n}{l}$의 범위에 따라 경우를 나누어 부등식을 만족하는 순서쌍을 찾는 능력을 본다.
