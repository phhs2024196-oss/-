stimuli:
- label: 가
  body: |
    자연수 $n\,(n\ge3)$에 대하여, 각 가로줄과 세로줄이 $n$개의 칸으로 이루어진 정사각형 모양의 표가 있다. [그림 1]은 $n=3$인 경우와 $n=4$인 경우를 표현한 것이다.

    [그림 1: 왼쪽은 $3\times3$ 빈 표(「$n=3$인 경우」), 오른쪽은 $4\times4$ 빈 표(「$n=4$인 경우」)]

    이 표의 각 칸에 실수를 하나씩 적어, 위에서부터 $k$번째 가로줄에 적힌 $n$개의 수를 왼쪽에서 오른쪽으로 읽어 얻는 수열을 **$k$번째 가로수열**, 왼쪽에서부터 $k$번째 세로줄에 적힌 $n$개의 수를 위에서 아래로 읽어 얻는 수열을 **$k$번째 세로수열**이라 한다. 각 가로수열과 세로수열이 등차수열 또는 등비수열인 표를 **$n$-등차등비표**라 하자.
    [그림 2]의 표는 각 가로수열과 세로수열이 등차수열 또는 등비수열이므로 모두 3-등차등비표이다.

    [그림 2: 두 개의 $3\times3$ 표. 왼쪽 표의 가로줄은 위에서부터 (1, 2, 3), (4, 5, 6), (7, 8, 9). 오른쪽 표의 가로줄은 위에서부터 (4, 6, 9), (2, 5, 8), (1, 4, 7)]
- label: 나
  body: |
    함수 $f(x)$에 대하여, $n$-등차등비표의 각 칸마다 그 칸에 적힌 수 $x$ 대신 $f(x)$를 적어 만든 표를 **$f(x)$에 의해 변환한 표**라 하자. 예를 들어 [그림 2]의 두 3-등차등비표를 $f(x)=2x$에 의해 변환한 표는 [그림 3]과 같다.

    [그림 3: 두 개의 $3\times3$ 표. 왼쪽 표의 가로줄은 위에서부터 (2, 4, 6), (8, 10, 12), (14, 16, 18). 오른쪽 표의 가로줄은 위에서부터 (8, 12, 18), (4, 10, 16), (2, 8, 14)]

stem: |
  [문항 1] (50점) 다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 물음에 답하라.
    (1) 아래의 3-등차등비표에서 두 번째 가로수열과 두 번째 세로수열은 등차수열이며, 그 외 가로수열과 세로수열은 모두 등비수열일 때, $a+b+c+d+e$의 값을 구하라.

    [표: $3\times3$ 표의 가로줄은 위에서부터 $(10,\ a,\ b)$, $(c,\ 10,\ d)$, $(40,\ e,\ 10)$]
  points: 10
  depends_on: []
  answer: {kind: value, value: '200', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 등차인 둘째 행·열에서 $a+e=c+d=20$, 첫째 세로수열에서 $c=\pm20$이고 $c=20$이면 $d=0$이라 셋째 가로수열이 등비가 될 수 없다.
    steps:
    - {id: 11a, content: '$a+e=c+d=20$, $c=-20$, $d=40$, $b=160$ → $a+b+c+d+e=200$', criteria: ['1-1.M1', '1-1.A1', '1-1.A2']}
    hint_ladder:
    - 등차수열인 둘째 행과 둘째 열에서 바로 얻는 식은?
    - 첫째 세로수열 $10,c,40$이 등비이면 $c$는? 두 값 중 하나는 모순이 생긴다.
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        두 번째 가로수열과 두 번째 세로수열이 등차수열이므로 $a+e=c+d=20$이다. 이로부터 $a+c+d+e=40$을 얻는다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        첫 번째 세로수열 $10,c,40$은 등비수열이므로 $c^2=400$이고 $c=\pm20$이다. 만약 $c=20$이면 $d=0$이 되어 세 번째 세로수열 $b,d,10$이 등비수열을 이룬다는 조건에 모순이다. 따라서 $c=-20$이고 $d=40$이다.
      criteria: ['1-1.A1']
    - id: 11b-3
      content: |
        세 번째 세로수열이 등비수열이라는 조건 $d^2=10b$에서 $b=160$이다. 처음 얻은 식과 종합하면 $a+b+c+d+e=40+160=200$이다. (완성된 표의 가로줄: $(10,40,160)$, $(-20,10,40)$, $(40,-20,10)$)
      criteria: ['1-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        $a+e=c+d=20$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [11b-1]
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        $c=-20$, $d=40$을 구했다($c=20$ 배제 근거 포함).
      depends_on: [1-1.M1]
      steps: [11b-2]
    - id: 1-1.A2
      mark_type: A
      points: 4
      evidence: |
        $b=160$을 구하여 답 $200$을 얻었다.
      depends_on: [1-1.M1]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    [문제 1-1] (2) 다음 <조건>을 만족하는 3-등차등비표의 개수를 구하라.

    < 조 건 >
    ① 각 칸에 적힌 수는 9 이하의 자연수이다.
    ② 첫 번째 가로수열은 첫째항만 홀수이고 나머지 항은 짝수이다.
    ③ 첫 번째 세로수열은 둘째항만 짝수이고 나머지 항은 홀수이다.

    [표: 홀짝 배치 예시 — 첫째 가로줄 (홀, 짝, 짝), 첫째 세로줄 (홀, 짝, 홀), 나머지 네 칸은 빈칸]
  points: 10
  depends_on: []
  answer: {kind: value, value: '8', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 홀짝 때문에 첫 행은 등비($1,2,4$ 또는 $9,6,4$), 첫 열은 등차($d=\pm1,\pm3$)로 4가지; $z$가 홀수여야 해서 셋째 열은 $4,2,1$ 또는 $4,6,9$, 나머지는 유일하다.
    steps:
    - {id: 12a, content: '4가지 테두리 × 셋째 세로수열 2가지 = 8', criteria: ['1-2.M1', '1-2.A1', '1-2.A2']}
    hint_ladder:
    - 홀, 짝, 짝은 등차수열이 될 수 있는가?
    - 오른쪽 아래 칸 $z$가 짝수이면 셋째 가로수열은 어떻게 되는가?
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        ②에 의하여 첫 번째 가로수열은 등차수열이 될 수 없으므로 공비가 1이 아닌 등비수열이다. 첫째항을 $a$, 공비를 $r$이라 하면 $a$는 홀수, $ar$과 $ar^2$은 짝수이고, ①에서 $ar^2\le9$이므로 $a=1,\ r=2$이거나 $a=9,\ r=\dfrac32$이다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        ③에 의하여 첫 번째 세로수열은 등비수열이 될 수 없으므로 공차가 0이 아닌 등차수열이다. 공차를 $d$라 하면 $d$는 홀수이고 $a+2d\le9$이므로 $a=1$일 때 $d=1$ 또는 $3$, $a=9$일 때 $d=-1$ 또는 $-3$이다. 총 4가지 경우이며 나머지 칸을 $\begin{smallmatrix}x&w\\y&z\end{smallmatrix}$처럼 $x,w,y,z$라 둔다(가운데 행 $x,w$, 아래 행 $y,z$).
      criteria: ['1-2.M1']
    - id: 12b-3
      content: |
        만약 $z$가 짝수이면 세 번째 가로수열($3,y,z$ 또는 $7,y,z$)은 홀수로 시작하여 짝수로 끝나므로 등차수열일 수 없고, $z$가 9 이하의 짝수라는 조건 때문에 등비수열도 될 수 없어 모순이다. 따라서 $z$는 홀수이고, 세 번째 세로수열 $4,w,z$는 등차수열이 될 수 없으므로 등비수열 $4,2,1$ 또는 $4,6,9$이다.
      criteria: ['1-2.A1']
    - id: 12b-4
      content: |
        각 경우마다 $x$와 $y$를 결정하는 방법이 유일하므로 총 $4\times2=8$개이다. (완성 표의 가로줄: $(1,2,4),(2,2,2),(3,2,1)$ / $(1,2,4),(2,4,6),(3,6,9)$ / $(1,2,4),(4,3,2),(7,4,1)$ / $(1,2,4),(4,5,6),(7,8,9)$ / $(9,6,4),(8,5,2),(7,4,1)$ / $(9,6,4),(8,7,6),(7,8,9)$ / $(9,6,4),(6,4,2),(3,2,1)$ / $(9,6,4),(6,6,6),(3,6,9)$)
      criteria: ['1-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 4
      evidence: |
        첫 번째 가로수열이 $1,2,4$임을 찾고 3-등차등비표를 2개 이상 4개 이하 찾았다.
      depends_on: []
      implied_ok: false
      steps: [12b-1, 12b-2]
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        3-등차등비표를 5개 이상 7개 이하 찾았다.
      depends_on: [1-2.M1]
      steps: [12b-3]
    - id: 1-2.A2
      mark_type: A
      points: 3
      evidence: |
        모든 경우를 다 찾아서 답 8을 얻었다.
      depends_on: [1-2.M1]
      steps: [12b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    [문제 1-1] (3) 자연수 $n\,(n\ge3)$에 대하여, $n$-등차등비표에 적힌 모든 수의 합이 20이고 각 가로수열이 등차수열이라 하자. 이 $n$-등차등비표의 첫 번째 세로수열의 합을 $\alpha$라 하고 $n$번째 세로수열의 합을 $\beta$라 하자. $\alpha$와 $\beta$가 이차방정식 $x^2-5x+p=0$의 서로 다른 두 실근일 때, $n$의 값을 구하고 실수 $p$의 범위를 구하라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'n = 8; p < 25/4', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 각 행의 합 $\tfrac{n(a_k+b_k)}{2}$를 모두 더하면 $\tfrac{n(\alpha+\beta)}{2}=20$이고 $\alpha+\beta=5$이다.
    steps:
    - {id: 13a, content: '$n(\alpha+\beta)=40$, $\alpha+\beta=5\Rightarrow n=8$; 판별식 $25-4p>0$', criteria: ['1-3.M1', '1-3.A1', '1-3.A2']}
    hint_ladder:
    - 등차수열인 가로수열 하나의 합을 첫째항과 끝항으로 쓰면?
  - id: S13-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $k$번째 가로수열의 첫째항을 $a_k$, 제$n$항을 $b_k$라 하자. 모든 칸에 적힌 수의 총합이 20이라는 조건으로부터 $\displaystyle\sum_{k=1}^{n}\dfrac{n(a_k+b_k)}{2}=20$을 얻는다. 또한 $\alpha=\displaystyle\sum_{k=1}^{n}a_k$이고 $\beta=\displaystyle\sum_{k=1}^{n}b_k$이기 때문에 $n(\alpha+\beta)=40$이 된다.
      criteria: ['1-3.M1']
    - id: 13b-2
      content: |
