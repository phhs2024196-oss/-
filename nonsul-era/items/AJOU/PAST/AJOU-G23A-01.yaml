- id: '2-1'
  stem: |
    [문제 1-2] 제시문 (가)와 (나)를 읽고 물음에 답하라.
    (1) 10-등차등비표를 $f(x)=\log_2x$에 의해 변환한 표의 첫 번째 가로수열은 등차수열이며, 이 가로수열의 첫째항이 4이고 제10항이 40이라 하자. 변환하기 이전의 표에서 첫 번째 가로수열의 합을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '16*(2**40 - 1)/15', equivalents: ['2**4*(2**40 - 1)/(2**4 - 1)'], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $\log_2$ 값이 공차 4인 등차수열이면 원래 수는 첫째항 $2^4$, 공비 $2^4$인 등비수열이다.
    steps:
    - {id: 21a, content: '$2^4\cdot\dfrac{2^{40}-1}{2^4-1}=\dfrac{16}{15}(2^{40}-1)$', criteria: ['2-1.M1', '2-1.A1', '2-1.A2']}
    hint_ladder:
    - $\log_2x_{k+1}-\log_2x_k$가 일정하면 $\dfrac{x_{k+1}}{x_k}$는?
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        첫째항이 4이고 제10항이 40인 등차수열의 공차는 4이다. 이 등차수열은 함수 $f(x)=\log_2x$에 의하여 변환된 수열이므로, 변환하기 이전의 표에서는 첫째항이 $2^4$, 공비가 $2^4$인 등비수열이 된다.
      criteria: ['2-1.M1', '2-1.A1']
    - id: 21b-2
      content: |
        이 등비수열의 합은 $2^4\times\dfrac{2^{40}-1}{2^4-1}=\dfrac{16}{15}(2^{40}-1)$이다.
      criteria: ['2-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
