      evidence: |
        변환 이전의 첫 번째 가로수열이 등비수열임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [21b-1]
    - id: 2-1.A1
      mark_type: A
      points: 2
      evidence: |
        공비가 $2^4$임을 얻었다.
      depends_on: [2-1.M1]
