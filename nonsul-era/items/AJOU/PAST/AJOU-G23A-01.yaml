- id: '2-2'
  stem: |
    [문제 1-2] (2) 두 함수 $f(x)=\sin\dfrac{\pi}{2}x$와 $g(x)=x^3+ax^2+b$에 대하여 아래 3-등차등비표를 합성함수 $(g\circ f)(x)$에 의해 변환한 표가 3-등차등비표일 때, $y=f(x)$와 $y=g(x)$의 그래프의 교점의 개수를 구하라. (단, $\sqrt3>1.7$)

    [표: $3\times3$ 표의 가로줄은 위에서부터 $(1,2,3)$, $(4,5,6)$, $(7,8,9)$]
  points: 10
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: $f(1),\dots,f(9)=1,0,-1,0,1,0,-1,0,1$이라 변환표는 $a+b+1$, $b$, $a+b-1$ 세 값만 가진다. 둘째 행 조건과 첫째 행 등차 조건으로 $g(x)=x^3-\tfrac12$를 얻는다.
    steps:
    - {id: 22a, content: '$a=0$, $b=-\tfrac12$; $x>0$에서 1개, $x\le0$에서 $h(-1)<0<h(-\tfrac23)$, $h(0)<0$으로 2개 → 3', criteria: ['2-2.M1', '2-2.A1', '2-2.A2']}
    hint_ladder:
    - $f(1),f(2),\dots,f(9)$의 값을 먼저 적어 보자.
    - $x\le0$에서는 $h(x)=g(x)-f(x)$의 부호를 몇 점에서 확인하면 되는가?
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        함숫값 $f(1),f(2),\dots,f(9)$는 각각 $1,0,-1,0,1,0,-1,0,1$이므로 합성함수 $(g\circ f)(x)$에 의해 변환된 표의 가로줄은 위에서부터 $(a+b+1,\ b,\ a+b-1)$, $(b,\ a+b+1,\ b)$, $(a+b-1,\ b,\ a+b+1)$이다.
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        두 번째 가로수열이 등차수열이거나 등비수열이므로 $a=-1$ 또는 $(a+b+1)^2=b^2$이 성립한다. $a=-1$인 경우는 첫 번째 가로수열이 $b,b,b-2$가 되어 모순이다. 따라서 $a+b+1=-b$이고 $a=-2b-1$이다.
      criteria: ['2-2.M1']
    - id: 22b-3
      content: |
        이를 대입하면 첫 번째 가로수열이 $-b,\ b,\ -b-2$이다. 항상 $-b\ne-b-2$이므로 등비수열이 될 수 없다. 첫 번째 가로수열이 등차수열인 조건을 사용하면 $b=-\dfrac12$이고 $a=0$이므로 $g(x)=x^3-\dfrac12$이다. (변환표의 가로줄: $(\tfrac12,-\tfrac12,-\tfrac32)$, $(-\tfrac12,\tfrac12,-\tfrac12)$, $(-\tfrac32,-\tfrac12,\tfrac12)$)
      criteria: ['2-2.A1']
    - id: 22b-4
      content: |
        이제 구간을 나누어서 교점의 개수를 구하자. [그림: $y=\sin\dfrac{\pi}{2}x$와 $y=x^3-\dfrac12$의 그래프] $x>0$일 때, $g(0)<f(0)$이고 $f(2)<g(2)$이므로 그래프 개형에 의하면 한 개의 교점을 가진다.
      criteria: ['2-2.A2']
    - id: 22b-5
      content: |
        $x\le0$일 때, 그래프 개형을 생각하면 교점은 많아야 두 개를 가짐을 알 수 있다. 교점의 개수는 $h(x)=g(x)-f(x)=x^3-\dfrac12-\sin\dfrac{\pi}{2}x=0$의 실근의 개수와 같다. 한편 $h(0)=h(-1)=-\dfrac12<0$이고 $\sqrt3>1.7$이므로
        $$h\left(-\dfrac23\right)=-\dfrac{8}{27}-\dfrac12-\sin\left(-\dfrac{\pi}{3}\right)=-\dfrac{43}{54}+\dfrac{\sqrt3}{2}>0$$
        이므로 사잇값 정리로부터 $h(x)=0$은 열린구간 $\left(-1,-\dfrac23\right)$과 $\left(-\dfrac23,0\right)$에 실근을 가진다. 즉 이 경우 교점의 개수는 2이다. 따라서 전체 교점의 개수는 3이다.
      criteria: ['2-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 2
      evidence: |
        $a\ne-1$임을 적었다(변환표의 두 번째 가로수열 조건에서 $a=-1$ 배제).
      depends_on: []
      implied_ok: false
      steps: [22b-1, 22b-2]
    - id: 2-2.A1
      mark_type: A
      points: 3
      evidence: |
        등차등비표의 성질을 이용하여 $g(x)=x^3-\dfrac12$를 찾았다.
      depends_on: [2-2.M1]
      steps: [22b-3]
    - id: 2-2.A2
      mark_type: B
      points: 5
      evidence: |
        그래프의 개형과 $x<0$인 영역에서 사잇값 정리를 활용해 교점의 개수가 3임을 구했다.
      depends_on: []
      steps: [22b-4, 22b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

