      mark_type: A
      points: 5
      evidence: |
        등비수열의 합 $2^4\times\dfrac{2^{40}-1}{2^4-1}=\dfrac{16}{15}(2^{40}-1)$을 얻었다.
      depends_on: [2-1.M1]
