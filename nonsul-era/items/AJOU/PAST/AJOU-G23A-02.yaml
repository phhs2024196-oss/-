      depends_on: []
      implied_ok: false
      steps: [11b-1]
    - id: 1-1.A1
      mark_type: R
      points: 5
      evidence: |
        $(1+r_1)+\dfrac{2}{1+r_1}-2\ge2\sqrt2-2>0.8$임을 보였다.
      depends_on: [1-1.M1]
      steps: [11b-2]
