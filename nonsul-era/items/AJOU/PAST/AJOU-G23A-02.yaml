- id: '2-2'
  stem: |
    [문제 2-2] (2) 함수 $f(x)=\dfrac{\lvert\cos x\rvert}{3+\cos^2x}$에 대하여 $\displaystyle\int_0^{\pi}xf(x)\,dx$의 값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'pi*log(3)/4', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: $f(\pi-x)=f(x)$이므로 $\int_0^\pi xf=\dfrac{\pi}{2}\int_0^\pi f=\pi\int_0^{\pi/2}f$, 이후 $\sin x=t$ 치환.
    steps:
    - {id: 22a, content: '$\pi\int_0^1\dfrac{dt}{4-t^2}=\dfrac{\pi}{4}\ln3$', criteria: ['2-2.M1', '2-2.M2', '2-2.A1']}
    hint_ladder:
    - 제시문 (나)에서 $p$는 얼마로 잡으면 되는가?
    - $3+\cos^2x$를 $\sin x$로 나타내 보자.
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.9–10
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $\cos(\pi-x)=-\cos x$이므로 $f(\pi-x)=f(x)$이고, $y=f(x)$의 그래프는 직선 $x=\dfrac{\pi}{2}$에 대칭이다. 제시문 (나)에 의해 $\displaystyle\int_0^\pi xf(x)\,dx=\int_0^\pi(\pi-x)f(x)\,dx$이므로 $2\displaystyle\int_0^\pi xf(x)\,dx=\pi\int_0^\pi f(x)\,dx$이다.
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        그래프의 대칭성으로부터
        $$\int_0^\pi xf(x)\,dx=\dfrac{\pi}{2}\int_0^\pi f(x)\,dx=\pi\int_0^{\frac{\pi}{2}}f(x)\,dx=\pi\int_0^{\frac{\pi}{2}}\dfrac{\cos x}{3+\cos^2x}\,dx$$
        이다. 여기서 $\sin x=t$로 치환하면 $\pi\displaystyle\int_0^{\frac{\pi}{2}}\dfrac{\cos x}{3+\cos^2x}\,dx=\pi\int_0^1\dfrac{1}{4-t^2}\,dt$이다.
      criteria: ['2-2.M2']
    - id: 22b-3
      content: |
        $$\pi\int_0^1\dfrac{1}{4-t^2}\,dt=\dfrac{\pi}{4}\int_0^1\left(\dfrac{1}{2-t}+\dfrac{1}{2+t}\right)dt=\dfrac{\pi}{4}\Big[-\ln(2-t)+\ln(2+t)\Big]_0^1=\dfrac{\pi}{4}\ln3$$
      criteria: ['2-2.A1']
  rubric:
