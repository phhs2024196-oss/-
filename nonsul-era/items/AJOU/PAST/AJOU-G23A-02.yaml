      content: |
        방정식 $f(x)=0$의 서로 다른 실근 중 2보다 큰 것의 개수를 $m$이라 하자. 그러한 $m$개의 실근을 $2+\alpha_1,\dots,2+\alpha_m\ (\alpha_i>0)$이라 하면 $2-\alpha_1,\dots,2-\alpha_m$도 방정식 $f(x)=0$의 근이 된다. 따라서 방정식 $f(x)=0$의 2가 아닌 서로 다른 실근을 모두 더한 값은 $4m$이 된다.
