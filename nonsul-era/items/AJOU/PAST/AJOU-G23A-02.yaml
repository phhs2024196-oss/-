stimuli:
- label: 가
  body: |
    자연수 $n$에 대하여, $0<p_1<\cdots<p_n$을 만족하는 $n$개의 실수 $p_1,\dots,p_n$이 있다. $x$축과 직선 $y=p_1x$에 동시에 접하면서 점 $(1,0)$을 지나며 중심이 제1사분면에 있는 원을 $\mathrm{C}_1$이라 하자. $y$축과 직선 $y=p_nx$에 동시에 접하면서 점 $(0,1)$을 지나며 중심이 제1사분면에 있는 원을 $\mathrm{C}_{n+1}$이라 하자. $n\ge2$일 때, $2\le k\le n$인 자연수 $k$에 대하여, 두 직선 $y=p_{k-1}x$, $y=p_kx$와 원 $\mathrm{C}_{k-1}$에 동시에 접하고 중심이 제1사분면에 있는 원을 $\mathrm{C}_k$라 하자. $x$축과 직선 $y=p_1x$가 이루는 예각을 $\theta_1$, 직선 $y=p_nx$와 $y$축이 이루는 예각을 $\theta_{n+1}$이라 하자. $n\ge2$일 때, $2\le k\le n$인 자연수 $k$에 대하여 두 직선 $y=p_{k-1}x$와 $y=p_kx$가 이루는 예각을 $\theta_k$라 하자. $n+1$이하인 자연수 $k$에 대하여, 원 $\mathrm{C}_k$의 반지름을 $r_k$라 하자.
    [그림 4]는 $n=1$인 경우와 $n=2$인 경우를 표현한 것이다.

    [그림 4: 왼쪽($n=1$) — 원점에서 나가는 직선 $y=p_1x$, 점 $(1,0)$에서 $x$축에 접하고 직선에 접하는 큰 원 $\mathrm{C}_1$(반지름 $r_1$), 점 $(0,1)$에서 $y$축에 접하고 직선에 접하는 작은 원 $\mathrm{C}_2$(반지름 $r_2$), 두 원은 직선 위 한 점에서 서로 접함; 각 $\theta_1$은 $x$축과 직선 사이, $\theta_2$는 직선과 $y$축 사이. 오른쪽($n=2$) — 직선 $y=p_1x$, $y=p_2x$, 원 $\mathrm{C}_1$(점 $(1,0)$에서 접함), $\mathrm{C}_2$(두 직선 사이), $\mathrm{C}_3$(점 $(0,1)$에서 $y$축에 접함)이 차례로 접하고, 각 $\theta_1,\theta_2,\theta_3$ 표시]

    한편 $n=1$인 경우, $r_1=\tan\dfrac{\theta_1}{2}$이고 $r_2=\tan\left(\dfrac{\pi}{4}-\dfrac{\theta_1}{2}\right)$이므로, 삼각함수의 덧셈정리에 의해 $r_2=\dfrac{1-\tan\dfrac{\theta_1}{2}}{1+\tan\dfrac{\theta_1}{2}}=\dfrac{1-r_1}{1+r_1}$이다.
- label: 나
  body: |
    모든 실수 $x$에 대하여 $f(x)=f(2p-x)$를 만족하는 실수 $p$가 존재하는 함수 $f(x)$를 생각하자. 함수 $y=f(x)$의 그래프는 직선 $x=p$에 대하여 대칭이다. 따라서 $f(\alpha)=0$이면 $x=2p-\alpha$가 방정식 $f(x)=0$의 실근이 된다. 한편 $\displaystyle\int_0^{2p}xf(x)\,dx$를 계산할 때, $x=2p-t$로 치환하면 다음을 얻는다.
    $$\int_0^{2p}xf(x)\,dx=\int_0^{2p}(2p-t)f(2p-t)\,dt=\int_0^{2p}(2p-x)f(x)\,dx$$

