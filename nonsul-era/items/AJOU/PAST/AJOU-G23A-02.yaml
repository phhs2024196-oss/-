- id: '1-2'
  stem: |
    [문제 2-1] (2) $n$이하인 자연수 $k$에 대하여 $p_k=\tan\dfrac{k\pi}{2(n+1)}$일 때, $\displaystyle\lim_{n\to\infty}\dfrac1n\sum_{k=1}^{n+1}(k-1)r_k$를 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'pi/8', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 모든 $\theta_k=\dfrac{\pi}{2(n+1)}$이고 원점~접점 거리가 1이라 $r_k=\tan\dfrac{\pi}{4(n+1)}$로 일정하다.
    steps:
    - {id: 12a, content: '$\dfrac{n(n+1)}{2n}\tan\dfrac{\pi}{4(n+1)}\to\dfrac{\pi}{8}$', criteria: ['1-2.M1', '1-2.A1', '1-2.A2']}
    hint_ladder:
    - 원점에서 각 원과 직선의 접점까지의 거리는 얼마인가?
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.9
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        직선의 기울기와 탄젠트함수의 정의로부터 $\theta_1=\cdots=\theta_n=\dfrac{\pi}{2(n+1)}$이다. 또한 $\displaystyle\sum_{i=1}^{n+1}\theta_i=\dfrac{\pi}{2}$이므로 $\theta_{n+1}=\dfrac{\pi}{2(n+1)}$이다. $n+1$이하인 자연수 $k$에 대하여 원점과 원 $\mathrm{C}_k$가 접하는 접점 사이의 거리가 1이므로 $r_k=\tan\dfrac{\theta_k}{2}=\tan\dfrac{\pi}{4(n+1)}$이다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        $\displaystyle\sum_{k=1}^{n+1}(k-1)r_k=\tan\dfrac{\pi}{4(n+1)}\sum_{k=1}^{n+1}(k-1)=\dfrac{n(n+1)}{2}\cdot\tan\dfrac{\pi}{4(n+1)}$이다.
      criteria: ['1-2.A1']
    - id: 12b-3
      content: |
        이제 $\displaystyle\lim_{x\to0}\dfrac{\tan x}{x}=1$을 사용하여
        $$\lim_{n\to\infty}\dfrac1n\sum_{k=1}^{n+1}(k-1)r_k=\lim_{n\to\infty}\dfrac{n(n+1)}{2n}\tan\dfrac{\pi}{4(n+1)}=\lim_{n\to\infty}\dfrac{\pi}{8}\cdot\dfrac{\tan\dfrac{\pi}{4(n+1)}}{\dfrac{\pi}{4(n+1)}}=\dfrac{\pi}{8}$$
        을 얻는다.
      criteria: ['1-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 3
      evidence: |
        $r_k=\tan\dfrac{\pi}{4(n+1)}$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [12b-1]
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        $\displaystyle\sum_{k=1}^{n+1}(k-1)r_k=\dfrac{n(n+1)}{2}\cdot\tan\dfrac{\pi}{4(n+1)}$임을 보였다.
      depends_on: [1-2.M1]
      steps: [12b-2]
    - id: 1-2.A2
      mark_type: A
      points: 4
      evidence: |
        $\displaystyle\lim_{n\to\infty}\dfrac{n(n+1)}{2n}\tan\dfrac{\pi}{4(n+1)}=\dfrac{\pi}{8}$임을 보였다.
      depends_on: [1-2.M1]
      steps: [12b-3]
    deductions: []
