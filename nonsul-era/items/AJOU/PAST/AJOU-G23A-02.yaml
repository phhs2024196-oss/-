  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    [문제 2-1] (3) $n$이하인 자연수 $k$에 대하여 $p_k=k$이고 $\displaystyle\sum_{k=1}^{n+1}\dfrac{1}{\tan\theta_k}=82$일 때, $n$의 값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 양 끝은 $\tan\theta_1=1$, $\tan\theta_{n+1}=\dfrac1n$이고 중간은 덧셈정리로 $\tan\theta_k=\dfrac{1}{1+k^2-k}$.
    steps:
    - {id: 13a, content: '$1+\sum_{k=2}^{n}(k^2-k+1)+n=\dfrac{n(n^2+5)}{3}=82\Rightarrow n=6$', criteria: ['1-3.B1', '1-3.B2', '1-3.M1', '1-3.A1']}
    hint_ladder:
    - $\theta_k$는 두 직선의 기울기각의 차이다.
  - id: S13-B
    audience: B
    source_flow: 모범답안 p.9
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $k=1$인 경우는 $\tan\theta_1=p_1=1$이고, $k=n+1$인 경우는 $\tan\theta_{n+1}=\dfrac{1}{p_n}=\dfrac1n$이다.
      criteria: ['1-3.B1', '1-3.B2']
    - id: 13b-2
      content: |
        $2\le k\le n$인 경우, $p_k=\tan\left(\displaystyle\sum_{i=1}^{k}\theta_i\right)$이므로
        $$\tan\theta_k=\tan\left(\sum_{i=1}^{k}\theta_i-\sum_{i=1}^{k-1}\theta_i\right)=\dfrac{p_k-p_{k-1}}{1+p_kp_{k-1}}=\dfrac{1}{1+k^2-k}$$
        이다.
      criteria: ['1-3.M1']
    - id: 13b-3
      content: |
        따라서
        $$\sum_{k=1}^{n+1}\dfrac{1}{\tan\theta_k}=1+\sum_{k=2}^{n}(k^2-k+1)+n=\sum_{k=1}^{n}(k^2-k+1)+n=\dfrac{n(n+1)(2n+1)}{6}-\dfrac{n(n+1)}{2}+2n=\dfrac{n(n^2+5)}{3}=82$$
        이를 정리하면 $n^3+5n-246=(n-6)(n^2+6n+41)=0$이므로 $n=6$이다.
      criteria: ['1-3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.B1
      mark_type: B
      points: 1
      evidence: |
        $k=1$일 때 $\tan\theta_1=p_1=1$임을 보였다.
      depends_on: []
      steps: [13b-1]
    - id: 1-3.B2
      mark_type: B
      points: 2
      evidence: |
        $k=n+1$일 때 $\tan\theta_{n+1}=\dfrac{1}{p_n}=\dfrac1n$임을 보였다.
      depends_on: []
      steps: [13b-1]
    - id: 1-3.M1
      mark_type: M
      points: 4
      evidence: |
        $2\le k\le n$일 때 $\tan\theta_k=\dfrac{1}{1+k^2-k}$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [13b-2]
    - id: 1-3.A1
      mark_type: A
      points: 3
      evidence: |
        $n=6$임을 보였다.
      depends_on: [1-3.M1]
      steps: [13b-3]
    deductions: []
