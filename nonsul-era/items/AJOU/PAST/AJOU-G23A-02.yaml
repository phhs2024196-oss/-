- id: '2-1'
  stem: |
    [문제 2-2] 제시문 (나)를 읽고 물음에 답하라.
    (1) 모든 실수 $x$에 대하여 $f(2+x)=f(2-x)$를 만족하는 함수 $f(x)$를 생각하자. 방정식 $f(x)=0$의 서로 다른 실근을 모두 더하면 34일 때, 방정식 $f(x)=0$의 서로 다른 실근의 개수를 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '17', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: 2가 아닌 근은 $2\pm\alpha$ 쌍으로 합이 4씩; 34가 4의 배수가 아니므로 2도 근이다.
    steps:
    - {id: 21a, content: '$4m+2=34\Rightarrow m=8$, 근의 개수 $2\cdot8+1=17$', criteria: ['2-1.M1', '2-1.R1', '2-1.A1']}
    hint_ladder:
    - 근 $2+\alpha$가 있으면 어떤 수도 근인가?
  - id: S21-B
