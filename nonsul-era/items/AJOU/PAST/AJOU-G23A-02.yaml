  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $r_1+r_2=(1+r_1)+\dfrac{2}{1+r_1}-2$로 바꿔 산술·기하평균 부등식을 쓴다.
    steps:
    - {id: 11a, content: '$r_1+r_2\ge2\sqrt2-2>0.8$', criteria: ['1-1.M1', '1-1.A1']}
    hint_ladder:
    - $r_2=\dfrac{1-r_1}{1+r_1}$을 $1+r_1$에 관한 식으로 바꿔 보자.
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.9
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        제시문 (가)에서 $r_2=\dfrac{1-r_1}{1+r_1}$이므로 $r_1+r_2=r_1+\dfrac{1-r_1}{1+r_1}=(1+r_1)+\dfrac{2}{1+r_1}-2$이다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        $r_1+1$이 양수이므로 산술평균과 기하평균의 관계에 의해
        $$r_1+r_2=(1+r_1)+\dfrac{2}{1+r_1}-2\ge2\sqrt2-2>0.8$$
        이다($\sqrt2>1.4$). 즉 $5(r_1+r_2)>4$가 성립한다. ■
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
