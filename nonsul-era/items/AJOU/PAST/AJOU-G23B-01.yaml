stimuli:
- label: 가
  body: |
    함수 $f(x)$가 미분가능한 함수이고 $f(0)=f(1)=0$을 만족하면 **좋은함수**라 하자. 특히 좋은함수 $f(x)$가 $f'(0)=a$, $f'(1)=b$이면 $f(x)$를 **$\ll a,b\gg$-좋은함수**라 하자. 두 함수 $f(x)$, $g(x)$가 좋은함수라면 $f(x)+g(x)$, $f(x)g(x)$, $(f\circ g)(x)$도 좋은함수이다.
    한편 $f(x)$가 좋은함수이면 평균값 정리에 의하여 양의 실수 $p$에 대하여
    $$\dfrac{f(p)-f(0)}{p-0}=\dfrac{f(p)}{p}=f'(c)$$
    인 $c$가 열린구간 $(0,p)$에 존재한다.
- label: 나
  body: |
    함수 $g(x)=\cos^3\left(\dfrac{\pi x}{2}\right)\sin\left(\dfrac{\pi x}{2}\right)$, $h(x)=xe^{x^2-1}-x$에 대하여 함수 $s(x)$를 다음과 같이 정의하자.
    $$s(x)=\begin{cases}g(x)&(x\le1)\\h(x-1)&(x>1)\end{cases}$$
    이때 $s(x)$는 연속함수이고 $s(0)=s(1)=0$이지만 $g'(1)\ne h'(0)$이므로 $x=1$에서 미분가능하지 않다. 따라서 $s(x)$는 좋은함수가 아니다.

    [그림: $y=s(x)$의 그래프 — 원점 왼쪽에서 아래로 내려갔다 올라와 원점을 지나고, $0<x<1$에서 볼록하게 솟았다가 $x=1$ 근처에서 평평하게 $x$축에 닿은 뒤, $1<x<2$에서 아래로 내려갔다가 $x=2$를 지나 가파르게 증가]

stem: |
  [문항 1] (50점) 다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (25점) 제시문 (가)를 읽고 물음에 답하라.
    (1) $\ll0,0\gg$-좋은함수인 사차함수 $f(x)$의 극댓값이 $2^{10}$이고 $A=\log2$, $B=\log3$일 때, $\log f(6)$의 값을 $A$와 $B$로 나타내라.
  points: 12
  depends_on: []
  answer: {kind: expression, value: '2 + 14*A + 2*B', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $x=0,1$이 모두 중근이므로 $f(x)=ax^2(x-1)^2$이고 극댓값은 $f\left(\tfrac12\right)$이다.
    steps:
    - {id: 11a, content: '$a=2^{14}$, $f(6)=2^{16}3^25^2$, $\log f(6)=2+14A+2B$', criteria: ['1-1.M1', '1-1.M2', '1-1.A1', '1-1.A2']}
    hint_ladder:
    - $f(0)=f'(0)=0$이면 $x=0$은 어떤 근인가?
    - $\log5$를 $A$로 나타내 보자.
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $f(x)=ax^2(x-1)^2$ (단, $a$는 0이 아닌 실수)라 둘 수 있다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        따라서 $x=\dfrac12$에서 $f(x)$가 극댓값을 가지고 $f\left(\dfrac12\right)=\dfrac{a}{2^4}=2^{10}$이므로 $a=2^{14}$이다.
      criteria: ['1-1.M2', '1-1.A1']
    - id: 11b-3
      content: |
        따라서 $f(x)=2^{14}x^2(x-1)^2$이므로 다음이 성립한다.
        $$\log f(6)=\log(2^{16}3^25^2)=2+14A+2B$$
        ($\log5=1-\log2=1-A$ 사용)
      criteria: ['1-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        $f(x)$가 $ax^2(x-1)^2$의 형태를 가지는 것을 적었다.
      depends_on: []
      implied_ok: false
      steps: [11b-1]
    - id: 1-1.M2
      mark_type: M
      points: 2
      evidence: |
        $x=\dfrac12$에서 $f(x)$가 극댓값을 가지는 것을 적었다.
      depends_on: [1-1.M1]
      implied_ok: false
      steps: [11b-2]
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        $a=2^{14}$를 계산했다.
      depends_on: [1-1.M2]
      steps: [11b-2]
    - id: 1-1.A2
      mark_type: A
      points: 5
      evidence: |
        $\log f(6)=2+14A+2B$를 계산했다.
      depends_on: [1-1.M1]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    [문제 1-1] (2) 좋은함수 $f(x)$가 모든 실수에서 연속인 이계도함수 $f''(x)$를 갖고, $0<p<1$인 실수 $p$에 대하여 $f(x)$가 $x=p$에서 최댓값 2023을 가진다. 이때 $\displaystyle\int_a^bf''(x)\,dx=\dfrac{2023}{p(p-1)}$을 만족하는 두 실수 $a$, $b$가 열린구간 $(0,1)$에 존재함을 증명하라.
  points: 13
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $[0,p]$와 $[p,1]$에서 각각 평균값 정리를 쓰고 $\int_a^bf''=f'(b)-f'(a)$로 연결한다.
    steps:
    - {id: 12a, content: '$f''(a)=\dfrac{2023}{p}$, $f''(b)=\dfrac{2023}{p-1}$ → 차가 $\dfrac{2023}{p(p-1)}$', criteria: ['1-2.M1', '1-2.R1', '1-2.R2', '1-2.A1']}
    hint_ladder:
    - $\int_a^bf''(x)\,dx$를 $f'$으로 나타내 보자.
    - 제시문 (가)의 평균값 정리를 구간 $[p,1]$에도 써 보자.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        닫힌구간 $[0,p]$에서 평균값 정리에 의하면, $f'(a)=\dfrac{f(p)-f(0)}{p-0}=\dfrac{2023}{p}$인 $a$가 열린구간 $(0,p)$에 존재한다.
      criteria: ['1-2.R1']
    - id: 12b-2
      content: |
        닫힌구간 $[p,1]$에서 평균값 정리에 의하면, $f'(b)=\dfrac{f(1)-f(p)}{1-p}=\dfrac{2023}{p-1}$인 $b$가 열린구간 $(p,1)$에 존재한다.
      criteria: ['1-2.R2']
    - id: 12b-3
      content: |
        이때 $\displaystyle\int_a^bf''(x)\,dx=f'(b)-f'(a)$이므로
        $$\int_a^bf''(x)\,dx=\dfrac{2023}{p-1}-\dfrac{2023}{p}=\dfrac{2023}{p(p-1)}$$
        인 두 실수 $a$, $b$가 열린구간 $(0,1)$에 존재한다. ■
      criteria: ['1-2.M1', '1-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 3
      evidence: |
        $\displaystyle\int_a^bf''(x)\,dx=f'(b)-f'(a)$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [12b-3]
    - id: 1-2.R1
      mark_type: R
      points: 3
      evidence: |
        $f'(a)=\dfrac{f(p)}{p}=\dfrac{2023}{p}$인 $a$가 $(0,p)$에 존재함을 보였다.
      depends_on: []
      steps: [12b-1]
    - id: 1-2.R2
      mark_type: R
      points: 4
      evidence: |
        평균값 정리를 사용하여 $f'(b)=\dfrac{f(p)}{p-1}=\dfrac{2023}{p-1}$인 $b$가 열린구간 $(p,1)$에 존재함을 보였다.
      depends_on: []
      steps: [12b-2]
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        위 세 가지 결과와 $\dfrac{2023}{p-1}-\dfrac{2023}{p}=\dfrac{2023}{(p-1)p}$를 이용하여 결론을 적었다.
      depends_on: [1-2.M1, 1-2.R1, 1-2.R2]
      steps: [12b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 1-2] (25점) 제시문 (가)와 (나)를 읽고 물음에 답하라.
    (1) 제시문 (나)의 함수 $s(x)$에 대하여 $\displaystyle\int_0^2s(x)\,dx$의 값을 구하라.
  points: 12
  depends_on: []
  answer: {kind: value, value: '1/(2*pi) - 1/(2*E)', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $\int_1^2h(x-1)\,dx=\int_0^1h(t)\,dt$로 바꾸고, 두 피적분함수는 각각 $\cos\dfrac{\pi x}{2}$, $x^2-1$ 치환으로 바로 적분된다.
    steps:
    - {id: 21a, content: '$\dfrac{1}{2\pi}-\dfrac{1}{2e}$', criteria: ['2-1.M1', '2-1.A1', '2-1.A2']}
    hint_ladder:
    - $\cos^3\left(\dfrac{\pi x}{2}\right)\sin\left(\dfrac{\pi x}{2}\right)$는 어떤 함수의 도함수 꼴인가?
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        치환적분을 이용하면 아래가 성립한다.
        $$\int_0^2s(x)\,dx=\int_0^1g(x)\,dx+\int_1^2h(x-1)\,dx=\int_0^1g(x)\,dx+\int_0^1h(t)\,dt\quad(t=x-1\text{로 치환})$$
        $$=\int_0^1\cos^3\left(\dfrac{\pi x}{2}\right)\sin\left(\dfrac{\pi x}{2}\right)dx+\int_0^1\left(xe^{x^2-1}-x\right)dx$$
      criteria: ['2-1.M1']
    - id: 21b-2
      content: |
        각 정적분을 계산하면 $\displaystyle\int_0^1\cos^3\left(\dfrac{\pi x}{2}\right)\sin\left(\dfrac{\pi x}{2}\right)dx=\left[-\dfrac{1}{2\pi}\cos^4\left(\dfrac{\pi x}{2}\right)\right]_0^1=\dfrac{1}{2\pi}$
      criteria: ['2-1.A1']
    - id: 21b-3
      content: |
        $\displaystyle\int_0^1\left(xe^{x^2-1}-x\right)dx=\left[\dfrac12e^{x^2-1}-\dfrac{x^2}{2}\right]_0^1=-\dfrac{1}{2e}$
        따라서 구하고자 하는 정적분값은 $\dfrac{1}{2\pi}-\dfrac{1}{2e}$이다.
      criteria: ['2-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 4
      evidence: |
        $\displaystyle\int_0^2s(x)\,dx=\int_0^1g(x)\,dx+\int_0^1h(x)\,dx$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [21b-1]
    - id: 2-1.A1
      mark_type: A
      points: 4
      evidence: |
        $\displaystyle\int_0^1g(x)\,dx=\dfrac{1}{2\pi}$임을 계산했다.
      depends_on: [2-1.M1]
      steps: [21b-2]
    - id: 2-1.A2
      mark_type: A
      points: 4
      evidence: |
        $\displaystyle\int_0^1h(x)\,dx=-\dfrac{1}{2e}$임을 계산했다.
      depends_on: [2-1.M1]
      steps: [21b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    [문제 1-2] (2) 9 이하의 자연수 $a$, $b$, $c$, $d$, $e$, $f$에 대하여 $p(x)$는 $\ll a,b\gg$-좋은함수, $q(x)$는 $\ll c,d\gg$-좋은함수, $r(x)$는 $\ll e,f\gg$-좋은함수이다. 두 함수 $G(x)=p(q(x))+p(x)q(x)$와 $H(x)=q(r(x))+2r(x)$에 대하여 함수 $S(x)$를 아래와 같이 정의하자.
    $$S(x)=\begin{cases}G(x)&(x\le1)\\H(x-1)&(x>1)\end{cases}$$
    $S(x)$가 $\ll n,24\gg$-좋은함수이고 자연수 $n$이 24의 약수가 되는 순서쌍 $(a,b,c,d,e,f)$의 개수를 구하라.
  points: 13
  depends_on: []
  answer: {kind: value, value: '810', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: $G'(0)=ac$, $G'(1)=ad$, $H'(0)=(c+2)e$이므로 $ac=n$, $ad=(c+2)e=24$.
    steps:
    - {id: 22a, content: '$(a,c)$ 10가지 × $b,f$ 각 9가지 = 810', criteria: ['2-2.M1', '2-2.M2', '2-2.A1', '2-2.A2', '2-2.A3']}
    hint_ladder:
    - $q(0)=q(1)=0$을 써서 $G'(0)$, $G'(1)$을 계산해 보자.
    - $S(x)$가 $x=1$에서 미분가능하려면?
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        합성함수의 미분법과 곱의 미분법에 의해서 $G'(x)=p'(q(x))q'(x)+p'(x)q(x)+p(x)q'(x)$이고 $H'(x)=q'(r(x))r'(x)+2r'(x)$이다. 따라서
        $G'(0)=p'(0)q'(0)+p'(0)q(0)+p(0)q'(0)=ac$,
        $G'(1)=p'(0)q'(1)+p'(1)q(1)+p(1)q'(1)=ad$,
        $H'(0)=q'(0)r'(0)+2r'(0)=ce+2e$,
        $H'(1)=q'(0)r'(1)+2r'(1)=cf+2f$
        이므로 $G(x)$는 $\ll ac,ad\gg$-좋은함수이고 $H(x)$는 $\ll ce+2e,cf+2f\gg$-좋은함수이다.
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        따라서 $S(x)$가 $\ll n,24\gg$-좋은함수이므로 $ac=n$, $ad=24=(c+2)e$를 만족해야 한다.
      criteria: ['2-2.M2']
    - id: 22b-3
      content: |
        $a$는 24의 약수이고 $a$, $d$가 모두 9 이하의 자연수이므로 $a$로 가능한 수는 $3,4,6,8$이며 각 $a$마다 대응되는 $d$가 유일하게 결정된다. 같은 방식으로 $c+2$ 역시 $3,4,6,8$만 가능하고 마찬가지로 $c+2$에 대응되는 $e$가 유일하게 결정된다. $ac$가 24의 약수가 되어야 하므로 가능한 순서쌍 $(a,c)$는 $(3,1)$, $(3,2)$, $(3,4)$, $(4,1)$, $(4,2)$, $(4,6)$, $(6,1)$, $(6,2)$, $(6,4)$, $(8,1)$로 10가지이다.
      criteria: ['2-2.A1']
    - id: 22b-4
      content: |
        한편, $b$와 $f$는 9 이하의 모든 자연수가 가능하므로 구하는 경우의 수는 $10\times9\times9=810$이다.
      criteria: ['2-2.A2', '2-2.A3']
