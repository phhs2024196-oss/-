- id: '2-3'
  stem: |
    [문제 2-2] (3) 함수 $G(x)=x^4-4x^3+9x-\dfrac{11}{2}$에 대하여, 다음 <조건>을 만족하는 일차함수 $L(x)$를 구하라.

    < 조 건 >
    ① $F(x)=x^4+ax^2+b$ (단, $a$, $b$는 상수)
    ② $G(x)=F(x-m)+L(x)$ (단, $m$은 상수)
    ③ 방정식 $G(x)-L(x)=0$이 서로 다른 네 실근을 가지고, 가장 큰 실근 $t$에 대하여
    $$\int_m^t(G(x)-L(x))\,dx=0$$
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'x - 11/2', equivalents: [], tolerance: null}
  solutions:
  - id: S23-A
    audience: A
    method_no: 1
    key_idea: 계수 비교로 $m=1$, $a=-6$, $L$의 기울기 1을 얻고, $F(x)=x^4-6x^2+b$의 가장 큰 근 $s=t-1$에서 $F(s)=0$, $\int_0^sF=0$을 연립한다.
    steps:
    - {id: 23a, content: '$m=1$, $a=-6$, $t=1+\sqrt5$, $b=5$, $L(x)=x-\tfrac{11}{2}$', criteria: ['2-3.A1', '2-3.A2', '2-3.M1', '2-3.A3']}
    hint_ladder:
    - $x^4-4x^3$에서 $(x-m)^4$의 $m$은?
    - $L(x)$의 상수항은 $b$에 따라 달라진다. 조건 ③으로 $b$를 정하자.
  - id: S23-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        $L(x)=c(x-m)+d$라 두면 $G(x)=x^4-4x^3+9x-\dfrac{11}{2}=(x-m)^4+a(x-m)^2+b+c(x-m)+d$이다. 양변의 계수를 비교하면 $m=1$, $a=-6$, $c=1$이고 $b+d=\dfrac12$이다. 따라서
        $$G(x)=(x-1)^4-6(x-1)^2+(x-1)+\dfrac12=F(x-1)+L(x)$$
      criteria: ['2-3.A1', '2-3.A2']
    - id: 23b-2
      content: |
        이므로 구하는 $F(x)$와 $L(x)$는 모든 실수 $b$에 대하여 $F(x)=x^4-6x^2+b$, $L(x)=(x-1)+\dfrac12-b=x-\dfrac12-b$이다.
      criteria: ['2-3.M1']
    - id: 23b-3
      content: |
        한편, 방정식 $G(x)-L(x)=0$이 서로 다른 네 실근을 가지면 방정식 $F(x)=0$도 서로 다른 네 실근을 갖는다. 조건으로부터 방정식 $F(x)=0$의 가장 큰 실근은 $t-m=t-1>0$이다. ③으로부터
        $$0=\int_1^tF(x-1)\,dx=\int_0^{t-1}F(x)\,dx=\int_0^{t-1}(x^4-6x^2+b)\,dx=\dfrac{(t-1)^5}{5}-2(t-1)^3+b(t-1)$$
        이고 $0=F(t-1)=(t-1)^4-6(t-1)^2+b$이다.
      criteria: ['2-3.M1']
    - id: 23b-4
      content: |
        이 두 방정식을 연립하여 풀면 $t=1+\sqrt5$이고 $b=5$이므로 구하는 일차함수는 $L(x)=x-\dfrac{11}{2}$이다.
      criteria: ['2-3.A3']
