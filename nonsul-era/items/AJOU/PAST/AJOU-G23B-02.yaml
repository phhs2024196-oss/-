intent: |
  극값과 양 끝 함숫값의 비교로 삼차함수의 근의 개수와 절댓값의 최댓값을 판정하고, 복이차식을 $t=x^2$ 치환과 근과 계수의 관계, 대칭 정적분으로 다루는 능력을 본다.
key_idea: |
  $x^3-3ax+b$는 $x=\pm\sqrt a$의 극값과 $x=\pm2$의 끝값만 비교하면 되고, 사차식 $x^4+ax^2+b$는 $t=x^2$로 이차식이 되어 근 $\pm r,\pm s$의 대칭을 쓴다.
stuck: |
  (1-2)에서 $a$의 범위에 따라 나누어 $a=1$일 때만 최댓값 4가 되는 것을 보이는 분류, (2-3)에서 $G(x)$를 $(x-m)^4+a(x-m)^2+b+L(x)$로 맞추는 계수 비교
