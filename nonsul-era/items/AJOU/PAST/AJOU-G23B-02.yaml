      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        한편 $0=\displaystyle\int_{-s}^{s}(x^4-x^2+c)\,dx=2\left(\dfrac15s^5-\dfrac13s^3+cs\right)$이다.
      criteria: ['2-2.M2']
    - id: 22b-3
      content: |
        이므로 $c=s^2(1-s^2)$를 대입하여 풀면 $s^2=\dfrac56$이므로 $c=\dfrac{5}{36}$이다.
      criteria: ['2-2.A1', '2-2.A2']
