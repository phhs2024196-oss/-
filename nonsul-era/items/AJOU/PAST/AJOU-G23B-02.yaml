stimuli:
- label: 가
  body: |
    닫힌구간에서 연속인 함수 $f(x)$의 최댓값 또는 최솟값을 구하거나 방정식 $f(x)=0$의 실근의 개수를 구할 때, 극값이나 양 끝 값 등 특정 함숫값을 비교하는 것으로 충분할 수 있다. 가령 삼차함수 $f(x)=x^3-3ax+b$에 대하여 닫힌구간 $[-2,2]$에서 $\lvert f(x)\rvert$의 최댓값을 구하는 문제를 생각해 보자. $0<a<4$인 경우 $f(x)$는 $x=\pm\sqrt a$에서 극값을 가지므로 $\lvert f(-2)\rvert$, $\lvert f(-\sqrt a)\rvert$, $\lvert f(\sqrt a)\rvert$, $\lvert f(2)\rvert$를 비교해서 $\lvert f(x)\rvert$의 최댓값을 구할 수 있고, 그렇지 않으면 $\lvert f(-2)\rvert$와 $\lvert f(2)\rvert$를 비교해서 $\lvert f(x)\rvert$의 최댓값을 구할 수 있다.
- label: 나
  body: |
    실수 $a$, $b$에 대하여 함수 $F(x)=x^4+ax^2+b$에서 $t=x^2$으로 치환하여 얻은 이차함수 $f(t)=t^2+at+b$를 생각하자. 실수 $\alpha$에 대하여 $F(\alpha)=0$이면 $f(\alpha^2)=0$을 만족한다. 따라서 방정식 $f(t)=0$이 서로 다른 두 양의 실근을 가지는 것은 방정식 $F(x)=0$이 서로 다른 네 실근을 가지기 위한 필요충분조건이다.

stem: |
  [문항 2] (50점) 다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 2-1] (20점) 제시문 (가)를 읽고 물음에 답하라.
    (1) 함수 $f(x)=x^3-3ax+a$에 대하여 방정식 $f(x)=0$이 닫힌구간 $[-2,2]$에서 서로 다른 세 실근을 가지도록 하는 실수 $a$의 값의 범위를 구하라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '1/4 < a <= 8/7', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 극값 두 개가 $[-2,2]$ 안에 있고 부호가 반대여야 하며, 왼쪽 끝 $f(-2)\le0$이어야 한다.
    steps:
    - {id: 11a, content: '$0<a<4$, $a(1-2\sqrt a)<0\Rightarrow a>\tfrac14$, $f(-2)=-8+7a\le0\Rightarrow a\le\tfrac87$', criteria: ['1-1.M1', '1-1.A1', '1-1.A2', '1-1.A3']}
    hint_ladder:
    - 세 실근이 구간 안에 있으려면 극값은 어디에 있어야 하는가?
    - 극솟값·극댓값의 부호 말고 양 끝점에서 확인할 것은?
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        문제의 조건에 의해, 닫힌구간 $[-2,2]$에서 $y=f(x)$의 그래프가 $x$축과 서로 다른 세 점에서 만나야 하므로 함수 $f(x)$는 이 구간에서 극댓값과 극솟값을 모두 갖는다. 따라서 $f'(x)=3(x^2-a)=0$이 $[-2,2]$에서 두 실근을 가지므로 $0<a<4$이다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        또 $f(-\sqrt a)f(\sqrt a)<0$이어야 한다. 이때 $f(-\sqrt a)=a(1+2\sqrt a)>0$이므로 $f(\sqrt a)=a(1-2\sqrt a)<0$이다. 따라서 $a>\dfrac14$이다.
      criteria: ['1-1.A1']
    - id: 11b-3
      content: |
        또한 $f(-2)=-8+7a\le0$이므로 $a\le\dfrac87$이다. 따라서 실수 $a$의 값의 범위는 $\dfrac14<a\le\dfrac87$이다.
      criteria: ['1-1.A2', '1-1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        $0<a<4$임을 구했다.
      depends_on: []
      implied_ok: false
      steps: [11b-1]
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        $a>\dfrac14$임을 구했다.
      depends_on: [1-1.M1]
      steps: [11b-2]
    - id: 1-1.A2
      mark_type: A
      points: 3
      evidence: |
        $a\le\dfrac87$임을 구했다.
      depends_on: [1-1.M1]
      steps: [11b-3]
    - id: 1-1.A3
      mark_type: A
      points: 2
      evidence: |
        $\dfrac14<a\le\dfrac87$임을 구했다.
      depends_on: [1-1.M1]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    [문제 2-1] (2) 함수 $f(x)=x^3-3ax+2$에 대하여 닫힌구간 $[-2,2]$에서 $\lvert f(x)\rvert$의 최댓값이 가장 작아지도록 하는 실수 $a$의 값과 그때의 $\lvert f(x)\rvert$의 최댓값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'a = 1; max = 4', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $a=1$이면 네 값이 $0,4,0,4$로 최댓값 4이고, 다른 $a$에서는 어느 한 값이 4를 넘는다.
    steps:
    - {id: 12a, content: '$a\le0$·$a\ge4$·$0<a<1$·$1<a<4$ 분류 → $a=1$, 최댓값 4', criteria: ['1-2.M1', '1-2.A1', '1-2.A2', '1-2.A3', '1-2.A4', '1-2.A5']}
    hint_ladder:
    - $a=1$일 때 $f(-2)$, $f(\pm1)$, $f(2)$를 계산해 보자.
    - $a<1$이면 $f(2)$, $a>1$이면 $f(-\sqrt a)$를 보자.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $a=1$일 때 $f(-2)=f(\sqrt a)=0$, $f(-\sqrt a)=f(2)=4$이므로 $\lvert f(x)\rvert$의 최댓값은 4이다.
      criteria: ['1-2.M1', '1-2.A1']
    - id: 12b-2
      content: |
        $a<1$이면 $f(2)=10-6a>4$, $a\ge4$이면 $f(-2)=6a-6>4$이므로 $\lvert f(x)\rvert$의 최댓값은 4보다 크다.
      criteria: ['1-2.A2']
    - id: 12b-3
      content: |
        $1<a<4$이면 $f(-\sqrt a)=2(a\sqrt a+1)>4$이다. 따라서 $a\ne1$일 때 $\lvert f(x)\rvert$의 최댓값은 4보다 크다.
      criteria: ['1-2.A3']
    - id: 12b-4
      content: |
        따라서 $a=1$일 때 $\lvert f(x)\rvert$의 최댓값이 가장 작고, 그때의 $\lvert f(x)\rvert$의 최댓값은 4이다.
      criteria: ['1-2.A4', '1-2.A5']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 1
      evidence: |
        $a$값의 범위에 따라 구간을 나누었다.
      depends_on: []
      implied_ok: true
      steps: [12b-1]
    - id: 1-2.A1
      mark_type: A
      points: 1
      evidence: |
        $\lvert f(-2)\rvert$, $\lvert f(-\sqrt a)\rvert$, $\lvert f(\sqrt a)\rvert$, $\lvert f(2)\rvert$를 정확하게 계산했다.
      depends_on: [1-2.M1]
      steps: [12b-1]
    - id: 1-2.A2
      mark_type: A
      points: 2
      evidence: |
        $a<0$이거나 $a\ge4$일 때 $\lvert f(x)\rvert$의 값이 4보다 크다는 것을 적었다.
      depends_on: [1-2.M1]
      steps: [12b-2]
    - id: 1-2.A3
      mark_type: A
      points: 3
      evidence: |
        $0<a<4$이고 $a\ne1$일 때 $\lvert f(x)\rvert$의 값이 4보다 크다는 것을 적었다.
      depends_on: [1-2.M1]
      steps: [12b-3]
    - id: 1-2.A4
      mark_type: A
      points: 2
      evidence: |
        $a=1$일 때 $\lvert f(x)\rvert$의 최댓값이 가장 작음을 적었다.
      depends_on: [1-2.M1]
      steps: [12b-4]
    - id: 1-2.A5
      mark_type: A
      points: 1
      evidence: |
        $a=1$일 때 $\lvert f(x)\rvert$의 최댓값이 4임을 적었다.
      depends_on: [1-2.M1]
      steps: [12b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 2-2] (30점) 제시문 (나)를 읽고 물음에 답하라.
    (1) 함수 $F(x)=x^4+ax^2+b$에 대하여 방정식 $F(x)=0$은 서로 다른 네 실근을 가지고 모든 실근의 절댓값이 양수 $A$보다 크다고 하자. 방정식 $F'(x)=0$의 0이 아닌 실근의 절댓값이 $A$보다 크다는 것을 증명하라. (단, $a$, $b$는 상수)
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $f(t)=t^2+at+b=0$의 두 근이 모두 $A^2$보다 크므로 $-a>2A^2$이고, $F'(x)=0$의 0 아닌 근의 절댓값은 $\sqrt{-\tfrac a2}$이다.
    steps:
    - {id: 21a, content: '$-a=t_1+t_2>2A^2\Rightarrow\sqrt{-\tfrac a2}>A$', criteria: ['2-1.M1', '2-1.A1', '2-1.R1']}
    hint_ladder:
    - $F(x)=0$의 근의 제곱은 $f(t)=0$의 무엇인가?
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        문제의 조건으로부터, 이차방정식 $f(t)=t^2+at+b=0$의 두 실근은 모두 양수이고 $A^2$보다 크다.
      criteria: ['2-1.M1']
    - id: 21b-2
      content: |
        이때, 이차방정식의 근과 계수와의 관계로부터 $-a>2A^2$이다.
      criteria: ['2-1.A1']
    - id: 21b-3
      content: |
        $F'(x)=2x(2x^2+a)$이므로 방정식 $F'(x)=0$의 실근은 $x=0$ 또는 $\pm\sqrt{-\dfrac a2}$이다. 즉 0이 아닌 실근의 절댓값은 $\sqrt{-\dfrac a2}$이고 이 값은 $A$보다 크다. ■
      criteria: ['2-1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 2
      evidence: |
        이차방정식 $f(t)=t^2+at+b=0$의 두 근이 $A^2$보다 크다는 것을 적었다.
      depends_on: []
      implied_ok: false
      steps: [21b-1]
    - id: 2-1.A1
      mark_type: A
      points: 3
      evidence: |
        $-a>2A^2$임을 적었다.
      depends_on: [2-1.M1]
      steps: [21b-2]
    - id: 2-1.R1
      mark_type: R
      points: 5
      evidence: |
        $F'(x)=0$의 0이 아닌 실근의 절댓값이 $\sqrt{-\dfrac a2}$이고 $A$보다 크다는 것을 적었다.
      depends_on: [2-1.A1]
      steps: [21b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    [문제 2-2] (2) 함수 $F(x)=x^4-x^2+c$에 대하여, 방정식 $F(x)=0$이 서로 다른 네 실근 $p$, $q$, $r$, $s$ $(p<q<r<s)$를 가지고 $\displaystyle\int_p^sF(x)\,dx=0$을 만족할 때, 상수 $c$를 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '5/36', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: 근은 $\pm r,\pm s$이고 $r^2+s^2=1$, $r^2s^2=c$; 우함수 적분 $2\left(\tfrac15s^5-\tfrac13s^3+cs\right)=0$.
    steps:
    - {id: 22a, content: '$c=s^2(1-s^2)$ 대입 → $s^2=\tfrac56$, $c=\tfrac{5}{36}$', criteria: ['2-2.M1', '2-2.M2', '2-2.A1', '2-2.A2']}
    hint_ladder:
    - $F$는 우함수이다. 네 근 사이의 관계는?
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 22b-1
      content: |
