- id: '2-1'
  stem: |
    [문제 1-2] (20점) 제시문 (나)를 읽고 물음에 답하라.
    (1) 최고차항의 계수가 $\dfrac{2}{25}$이고 $f(0)=0$, $f(5)=1$, $f'(0)=f'(7)$인 삼차함수 $f(x)$에 대하여 다음 <조건>을 만족하는 모든 양수 $r$의 합을 구하라.

    < 조 건 >
    서로 다른 세 점 $\mathrm{P}(2,f(2))$, $\mathrm{Q}\left(0,-\dfrac{2}{25}\right)$, $\mathrm{R}(r,f(r))$에 대하여 선분 $\mathrm{PQ}$의 중점과 선분 $\mathrm{QR}$의 중점을 지나는 직선과 $y=\lvert f(x)\rvert$의 그래프의 교점의 개수가 3이다. (단, $r\ne2$, $r>0$)
  points: 10
  depends_on: []
  answer: {kind: value, value: '15', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $f(x)=\tfrac{2}{25}x^3-\tfrac{21}{25}x^2+\tfrac{12}{5}x$, $\mathrm{M}(1,1)$; 직선 $\ell\parallel\mathrm{PR}$이 $(1,1)$을 지나며 $x>0$에서 $y=f(x)$에 접하거나($y=1$) 원점을 지나는(기울기 1) 경우만 교점이 3개.
    steps:
    - {id: 21a, content: '$r_1=\tfrac{13}{2}$; $2r^2-17r+1=0$의 두 근 합 $\tfrac{17}{2}$ → $15$', criteria: ['2-1.A1', '2-1.M1', '2-1.A2', '2-1.A3']}
    hint_ladder:
    - 두 중점을 지나는 직선은 어느 선분과 평행한가?
    - $(1,1)$을 지나는 직선이 $y=\lvert f(x)\rvert$와 세 점에서 만나는 경우를 그래프로 생각하자.
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.11
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $f'(x)=\dfrac{6}{25}(x^2+ax+b)$라 하자. $f'(0)=f'(7)$이므로 $a=-7$이고, 이를 적분하고 $f(0)=0$으로부터 $f(x)=\dfrac{2}{25}x^3-\dfrac{21}{25}x^2+\dfrac{6b}{25}x$이다. $f(5)=1$이므로 $b=10$이고, 따라서 $f(x)=\dfrac{2}{25}x^3-\dfrac{21}{25}x^2+\dfrac{12}{5}x$이다. 한편 $f'(x)=\dfrac{6}{25}(x-2)(x-5)$이므로 $x=2$, $x=5$에서 극값을 가진다.
      criteria: ['2-1.A1']
    - id: 21b-2
      content: |
        선분 $\mathrm{PQ}$의 중점 $\mathrm{M}$에 대하여 $f(2)=\dfrac{52}{25}$이므로 $\mathrm{M}$의 좌표는 $(1,1)$이다. 선분 $\mathrm{QR}$의 중점을 $\mathrm{N}$이라 하자. 점 $\mathrm{M}$과 $\mathrm{N}$을 지나는 직선 $\ell$이 $y=\lvert f(x)\rvert$의 그래프와 세 점에서 만나야 하므로 $\ell$은 $(1,1)$을 지나고, $x>0$ 범위에서 $y=f(x)$와 접하거나 원점을 지나야 한다.
      criteria: ['2-1.M1']
    - id: 21b-3
      content: |
        한편 $f'(5)=0$이고 $f(5)=1$이므로 $y=f(x)$와 접할 때는 $\ell$의 방정식은 $y=1$이다. 이 경우, $f(r)=f(2)=\dfrac{52}{25}$이다. $f(r)-\dfrac{52}{25}=\dfrac{1}{25}(r-2)^2(2r-13)=0$이고 $r\ne2$이므로 이 방정식의 근을 $r_1$이라 하면 $r_1=\dfrac{13}{2}$이다.
      criteria: ['2-1.A2']
    - id: 21b-4
      content: |
        이제 $\ell$이 $(0,0)$을 지나는 경우를 생각하자. $\ell$은 선분 $\mathrm{PR}$과 평행하므로 $\mathrm{R}$은 $\mathrm{P}$를 지나면서 기울기가 1인 직선과 $y=f(x)$의 그래프의 교점이라 할 수 있다. 즉, $f(r)-f(2)=r-2$가 성립하므로
        $$f(r)-f(2)-r+2=\dfrac{1}{25}(r-2)(2r^2-17r+1)=0$$
        이고, $r\ne2$이므로 $2r^2-17r+1=0$이다. 이차방정식의 근과 계수의 관계에 의하여 이 식을 만족하는 근을 $r_2$, $r_3$라 하면 $r_2+r_3=\dfrac{17}{2}$이다.
        따라서 <조건>을 만족하는 모든 $r$의 합은 $\dfrac{13}{2}+\dfrac{17}{2}=15$이다.
        [그림: $y=\lvert f(x)\rvert$의 그래프와 점 $\mathrm{Q}$, $\mathrm{P}$, $\mathrm{M}$, 수평선 $y=1$, 원점을 지나는 기울기 1인 직선과 그에 평행한 점선, $x$축 위 $r_1$, $r_2$, $r_3$ 표시]
      criteria: ['2-1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.A1
      mark_type: B
      points: 3
      evidence: |
        $f(x)=\dfrac{2}{25}x^3-\dfrac{21}{25}x^2+\dfrac{12}{5}x$를 정확히 구했다.
      depends_on: []
      steps: [21b-1]
    - id: 2-1.M1
      mark_type: M
      points: 2
      evidence: |
        조건의 직선 $\ell$이 $(1,1)$을 지남을 적고, $\ell$이 원점을 지나거나 $x>0$ 범위에서 $y=f(x)$와 접함을 논의했다.
      depends_on: []
      implied_ok: false
      steps: [21b-2]
    - id: 2-1.A2
      mark_type: A
      points: 2
      evidence: |
        $r=\dfrac{13}{2}$이 접하는 경우임을 구했다.
      depends_on: [2-1.M1]
      steps: [21b-3]
    - id: 2-1.A3
      mark_type: A
      points: 3
      evidence: |
        원점을 지나는 경우 가능한 $r$의 합이 $\dfrac{17}{2}$임을 구했다.
      depends_on: [2-1.M1]
      steps: [21b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    [문제 1-2] (2) 함수 $y=-\dfrac{\lvert x\rvert}{\sqrt e}+k$와 $y=e^{-\lvert x\rvert}$의 그래프의 교점의 개수가 2이고 그때의 교점을 $\mathrm{P}$, $\mathrm{R}$이라 하자. 점 $\mathrm{Q}(0,1)$에 대해서 선분 $\mathrm{PQ}$의 중점과 선분 $\mathrm{QR}$의 중점을 지나는 직선과 $y=e^{-\lvert x\rvert}$의 그래프의 두 교점의 $x$좌표를 각각 $\alpha$, $\beta$라 할 때, $\displaystyle\int_\alpha^\beta e^{-\lvert x\rvert}\,dx$의 최솟값을 구하라. (단, $k$는 실수, $\alpha<\beta$)
  points: 10
  depends_on: []
  answer: {kind: value, value: '1 - exp(-1/2)', equivalents: ['1 - 1/sqrt(E)'], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: 대칭으로 교점은 $(\pm p,e^{-p})$이고 중점 직선은 $y=\dfrac{1+e^{-p}}{2}$; 적분값은 $p$에 대해 증가하므로 접할 때($p=\tfrac12$) 최소.
    steps:
    - {id: 22a, content: '$e^{-\beta}=\tfrac12+\tfrac{1}{2\sqrt e}$, $\int_\alpha^\beta=2(1-e^{-\beta})=1-\tfrac{1}{\sqrt e}$', criteria: ['2-2.M1', '2-2.A1', '2-2.A2']}
    hint_ladder:
    - 두 그래프가 모두 $y$축 대칭이면 두 교점의 좌표는?
    - $p$가 가장 작아지는 것은 어떤 위치 관계일 때인가?
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.11–12
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $x>0$일 때, $y=-\dfrac{x}{\sqrt e}+k$와 $y=e^{-x}$의 그래프의 교점의 좌표를 $(p,e^{-p})$이라 하자. 주어진 함수의 그래프는 모두 $y$축에 대칭이므로, 또 다른 교점은 $(-p,e^{-p})$이 된다. 선분 $\mathrm{PQ}$의 중점과 선분 $\mathrm{QR}$의 중점을 지나는 직선의 방정식은 $y=\dfrac{1+e^{-p}}{2}$이다.
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        $x>0$일 때, $p$가 클수록 구하고자 하는 정적분 값이 커지기 때문에, $y=-\dfrac{x}{\sqrt e}+k$와 $y=e^{-x}$의 그래프가 한 점에서 만나면서 $p$가 가장 작을 때, 즉 접하는 경우를 생각해야 한다. $y=e^{-x}$의 $x=p$에서의 접선의 기울기를 생각하면 $-e^{-p}=\dfrac{-1}{\sqrt e}$이므로 $p=\dfrac12$이다.
      criteria: ['2-2.M1', '2-2.A1']
    - id: 22b-3
      content: |
        직선 $y=\dfrac{1+e^{-\frac12}}{2}=\dfrac12+\dfrac{1}{2\sqrt e}$와 $y=e^{-x}$의 교점의 $x$좌표가 $\beta$이므로, $e^{-\beta}=\dfrac12+\dfrac{1}{2\sqrt e}$이다. 즉,
        $$\dfrac12\int_\alpha^\beta e^{-\lvert x\rvert}\,dx=\int_0^\beta e^{-x}\,dx=-e^{-\beta}+1=\dfrac12-\dfrac{1}{2\sqrt e}$$
        이므로, $\displaystyle\int_\alpha^\beta e^{-\lvert x\rvert}\,dx$의 최솟값은 $1-\dfrac{1}{\sqrt e}$이다.
      criteria: ['2-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 3
      evidence: |
        도형이 안쪽에서 접할 때 최소가 된다는 것을 논의했다.
      depends_on: []
      implied_ok: false
      steps: [22b-1, 22b-2]
    - id: 2-2.A1
      mark_type: A
      points: 2
      evidence: |
        $x=\dfrac12$에서 접함을 구했다.
      depends_on: [2-2.M1]
      steps: [22b-2]
    - id: 2-2.A2
      mark_type: A
      points: 5
      evidence: |
        최솟값 $1-\dfrac{1}{\sqrt e}$을 구했다.
      depends_on: [2-2.M1]
      steps: [22b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

