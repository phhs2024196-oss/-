intent: |
  꺾은선 도형을 반복해서 깎는 시행을 중점연결정리와 등비·등차수열의 점화 관계로 정리하고, 두 중점을 지나는 직선과 절댓값 함수의 그래프의 교점 조건을 접선·대칭으로 해석하는 능력을 본다.
key_idea: |
  두 선분의 중점을 이은 선분은 나머지 변에 평행하고 길이가 절반이므로, 깎인 삼각형 넓이는 $\tfrac14$배씩 줄고 새 선분의 기울기는 $-1$씩 변한다. (1-2)에서는 두 중점을 지나는 직선이 $\mathrm{PR}$(또는 $x$축)과 평행함을 쓴다.
stuck: |
  (1-3)에서 $n+1$번째 새 선분이 밑변 $a$, 높이 $a+b$인 직각삼각형의 빗변임을 보고 $p_{n+1}=p_n-1$을 세우는 것, (2-1)에서 직선 $\ell$이 접하거나 원점을 지나는 두 경우만 교점 3개임을 판정하는 것
