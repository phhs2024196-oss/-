stimuli:
- label: 가
  body: |
    한 직선 위에 있지 않은 서로 다른 세 점 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$에 대하여, 두 선분 $\mathrm{PQ}$와 $\mathrm{QR}$은 점 $\mathrm{Q}$에서 인접하다고 하며 점 $\mathrm{Q}$를 두 선분의 교점이라 하자. 두 개 이상의 선분으로 이루어진 도형의 인접한 선분들의 교점을 **도형의 교점**이라 하자. 도형의 교점 $\mathrm{Q}$에서 인접한 두 선분 $\mathrm{PQ}$와 $\mathrm{QR}$의 중점을 각각 $\mathrm{M}$과 $\mathrm{N}$이라 할 때, 원래 도형에서 선분 $\mathrm{PQ}$와 $\mathrm{QR}$을 세 선분 $\mathrm{PM}$, $\mathrm{MN}$, $\mathrm{NR}$로 대체하여 만든 도형을 **교점 $\mathrm{Q}$에서 깎아 만든 도형**이라 하고 선분 $\mathrm{MN}$을 **새로 생긴 선분**이라 하자.
    점 $(0,1)$과 원점을 이은 선분, 그리고 원점과 점 $(1,0)$을 이은 선분으로 이루어진 도형을 시작도형이라 하자. 시작도형으로부터 $y$축 위에 있는 도형의 교점에서 깎아 만든 도형을 얻는 시행을 $n$회 반복하여 얻은 도형을 생각하자. [그림 1]은 이런 시행을 2회 반복하여 도형을 얻는 과정을 표현한 것으로 이전 도형에 포함되었으나 새로운 도형에서 빠진 부분은 점선으로 표시하였다.

    [그림 1: 왼쪽 「시작도형」 — 점 $(0,1)$, $(0,0)$, $(1,0)$을 잇는 꺾은선. 가운데 「1회 시행」 — $(0,1)$에서 $\left(0,\tfrac12\right)$까지 $y$축 선분, $\left(0,\tfrac12\right)$에서 $\left(\tfrac12,0\right)$까지 새 선분, $\left(\tfrac12,0\right)$에서 $(1,0)$까지 $x$축 선분; 빠진 원점 모서리는 점선. 오른쪽 「2회 시행」 — $(0,1)$에서 $\left(0,\tfrac34\right)$, $\left(0,\tfrac34\right)$에서 $\left(\tfrac14,\tfrac14\right)$, 이어서 $\left(\tfrac12,0\right)$, $(1,0)$; 빠진 부분은 점선]

    각 시행 후 새로 생긴 선분의 양 끝점 중 $y$축 위에 있는 점의 $y$좌표를 $1-a$라 하면 다른 끝점의 $x$좌표는 $a$이다.
- label: 나
  body: |
    함수 $y=f(x)$에 대하여 $y=\lvert f(x)\rvert$와 $y=f(\lvert x\rvert)$의 그래프는 $y=f(x)$의 그래프의 일부를 대칭시켜 얻을 수 있다. 예를 들어 $y=e^{-\lvert x\rvert}$의 그래프는 $x>0$에서의 $y=e^{-x}$의 그래프를 $y$축에 대칭시켜 얻을 수 있다.

stem: |
  [문항 1] (50점) 다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (30점) 제시문 (가)를 읽고 물음에 답하라.
    (1) 한 직선 위에 있지 않은 서로 다른 세 점 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$에 대하여 두 선분 $\mathrm{PQ}$, $\mathrm{QR}$의 중점을 각각 $\mathrm{M}$, $\mathrm{N}$이라 하자. $\overline{\mathrm{PM}}^2+\overline{\mathrm{MN}}^2+\overline{\mathrm{NR}}^2$과 $\overline{\mathrm{PQ}}^2+\overline{\mathrm{QR}}^2$의 값의 크기를 비교하라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'PQ**2 + QR**2 > PM**2 + MN**2 + NR**2', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $a=\overline{\mathrm{PM}}$, $b=\overline{\mathrm{MN}}$, $c=\overline{\mathrm{NR}}$이면 $\overline{\mathrm{PR}}=2b<2(a+c)$이고 차는 $3a^2+3c^2-b^2>0$.
    steps:
    - {id: 11a, content: '$(4a^2+4c^2)-(a^2+b^2+c^2)=3a^2+3c^2-b^2>a^2+c^2\ge0$', criteria: ['1-1.M1', '1-1.R1']}
    hint_ladder:
    - 중점연결정리로 $\overline{\mathrm{MN}}$을 $\overline{\mathrm{PR}}$로 나타내 보자.
    - 삼각형 $\mathrm{PQR}$에서 $\overline{\mathrm{PR}}<\overline{\mathrm{PQ}}+\overline{\mathrm{QR}}$.
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $a=\overline{\mathrm{PM}}$, $b=\overline{\mathrm{MN}}$, $c=\overline{\mathrm{NR}}$이라 하자. $\overline{\mathrm{PQ}}=2a$, $\overline{\mathrm{QR}}=2c$이고, 삼각형 중점연결정리에 의해 $\overline{\mathrm{PR}}=2b$이다. 한편 $b<a+c$이므로 $2(a^2+c^2)-b^2>2(a^2+c^2)-(a+c)^2=(a-c)^2$이다. 따라서 $2(a^2+c^2)>b^2$이다.
      criteria: ['1-1.R1']
    - id: 11b-2
      content: |
        $$(\overline{\mathrm{PQ}}^2+\overline{\mathrm{QR}}^2)-(\overline{\mathrm{PM}}^2+\overline{\mathrm{MN}}^2+\overline{\mathrm{NR}}^2)=(4a^2+4c^2)-(a^2+b^2+c^2)=3a^2+3c^2-b^2>a^2+c^2\ge0$$
        이다. 그러므로 $\overline{\mathrm{PQ}}^2+\overline{\mathrm{QR}}^2>\overline{\mathrm{PM}}^2+\overline{\mathrm{MN}}^2+\overline{\mathrm{NR}}^2$이다.
      criteria: ['1-1.M1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: |
        차가 양수임을 이용하여 결론 $\overline{\mathrm{PQ}}^2+\overline{\mathrm{QR}}^2>\overline{\mathrm{PM}}^2+\overline{\mathrm{MN}}^2+\overline{\mathrm{NR}}^2$을 도출했다.
      depends_on: []
      implied_ok: false
      steps: [11b-2]
    - id: 1-1.R1
      mark_type: R
      points: 5
      evidence: |
        삼각형 $\mathrm{PQR}$의 성질(중점연결정리, $b<a+c$)과 절대부등식을 활용하여 증명했다.
      depends_on: []
      steps: [11b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    [문제 1-1] (2) [그림 1]과 같이 시작도형으로부터 $y$축 위에 있는 도형의 교점에서 깎아 만든 도형을 얻는 시행을 10회 반복하여 얻은 도형과 직선 $y=-x+1$로 둘러싸인 영역의 넓이를 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '(2**21 + 1)/(3*2**21)', equivalents: ['1/2 - (2**20 - 1)/(3*2**21)'], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $n$번째 시행에서 깎여 나가는 삼각형 넓이 $t_n$은 $t_1=\tfrac18$, $t_n=\tfrac14t_{n-1}$이고, 구하는 넓이는 $\tfrac12-\sum_{n=1}^{10}t_n$.
    steps:
    - {id: 12a, content: '$\tfrac12-\dfrac{2^{20}-1}{3\cdot2^{21}}=\dfrac{2^{21}+1}{3\cdot2^{21}}$', criteria: ['1-2.M1', '1-2.A1', '1-2.A2']}
    hint_ladder:
    - 1회, 2회 시행에서 사라지는 삼각형의 넓이를 직접 구해 비교해 보자.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        10 이하의 자연수 $n$에 대하여 $n-1$번째 시행에서 새로 생긴 선분(단, $n=1$이면 $x$축)과 $n$번째 시행에서 새로 생긴 선분, $y$축으로 둘러싸인 삼각형을 $\mathrm{T}_n$이라 하고, $\mathrm{T}_n$의 넓이를 $t_n$이라 하자. 삼각형 $\mathrm{T}_1$의 세 점은 $\mathrm{P}_1\left(0,\tfrac12\right)$, $\mathrm{O}$, $\mathrm{R}_1\left(\tfrac12,0\right)$이므로 $t_1=\dfrac18$이다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        $n\ge2$일 때, $n$번째 새로 생긴 선분의 양 끝점 중 $y$축 위에 있는 것을 $\mathrm{P}_n$, 다른 점을 $\mathrm{R}_n$이라 두면, $t_n=\dfrac12\times\overline{\mathrm{P}_n\mathrm{P}_{n-1}}\times(\mathrm{R}_n\text{의 }x\text{좌표})$이다. 점 $\mathrm{P}_n$은 $\mathrm{P}_{n-1}$과 점 $(0,1)$의 중점이고 $\mathrm{R}_n$은 $\mathrm{P}_{n-1}$과 $\mathrm{R}_{n-1}$의 중점이므로 밑변과 높이는 절반씩 줄어든다. 따라서 $t_n=\dfrac14t_{n-1}$이므로 $\{t_n\}$은 첫째항이 $\dfrac18$이고 공비가 $\dfrac14$인 등비수열이다.
      criteria: ['1-2.M1']
    - id: 12b-3
      content: |
        이 등비수열의 합은
        $$\sum_{n=1}^{10}t_n=\dfrac{\dfrac18\left(1-\dfrac{1}{4^{10}}\right)}{1-\dfrac14}=\dfrac{2^{20}-1}{3\cdot2^{21}}$$
      criteria: ['1-2.A1']
    - id: 12b-4
      content: |
        이므로 구하고자 하는 영역의 넓이는 $\dfrac12-\dfrac{2^{20}-1}{3\cdot2^{21}}=\dfrac{2^{21}+1}{3\cdot2^{21}}$이다.
      criteria: ['1-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 4
      evidence: |
        각 시행 시 새로 생긴 선분에 의해 사라지는 영역에 해당하는 삼각형의 넓이가 첫째항이 $\dfrac18$이고 공비가 $\dfrac14$인 등비수열을 이루는 것을 적었다.
      depends_on: []
      implied_ok: false
      steps: [12b-1, 12b-2]
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        삼각형의 넓이의 합 $\dfrac{\frac18\left(1-\frac{1}{4^{10}}\right)}{1-\frac14}=\dfrac{2^{20}-1}{3\cdot2^{21}}$을 계산했다.
      depends_on: [1-2.M1]
      steps: [12b-3]
    - id: 1-2.A2
      mark_type: A
      points: 3
      evidence: |
        구하고자 하는 영역의 넓이 $\dfrac12-\dfrac{2^{20}-1}{3\cdot2^{21}}=\dfrac{2^{21}+1}{3\cdot2^{21}}$을 계산했다.
      depends_on: [1-2.M1]
      steps: [12b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    [문제 1-1] (3) [그림 1]과 같이 시작도형으로부터 $y$축 위에 있는 도형의 교점에서 깎아 만든 도형을 얻는 시행을 반복할 때 $n$번째 시행에서 새로 생긴 선분을 포함하는 직선의 기울기가 $-n$임을 증명하라.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: $n$번째 새 선분을 빗변으로 하는 직각삼각형(밑변 $a$, 높이 $b$)에서 다음 새 선분은 밑변 $a$, 높이 $a+b$인 직각삼각형의 빗변이다.
    steps:
    - {id: 13a, content: '$p_1=-1$, $p_{n+1}=-\dfrac{a+b}{a}=-1+p_n$ → $p_n=-n$', criteria: ['1-3.B1', '1-3.M1', '1-3.A1']}
    hint_ladder:
    - 1회, 2회 시행의 새 선분 기울기를 직접 구해 보자.
    - $p_n=-\dfrac ba$로 두면 $p_{n+1}$은?
  - id: S13-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $n$회 반복하여 얻은 도형에서 $n$번째 시행에서 새로 생긴 선분의 기울기를 $p_n$이라 하자. $n=1$일 때 새로 생긴 직선의 기울기는 선분의 좌표로부터 $p_1=-1$이다.
      criteria: ['1-3.B1']
    - id: 13b-2
      content: |
        도형의 일부를 그린 아래의 그림과 같이 $n$번째 시행에서 새로 생긴 선분을 빗변으로 직각삼각형의 밑변의 길이를 $a$, 높이를 $b$라 하면, $p_n=-\dfrac ba$이다. 따라서 $p_{n+1}$에 대하여 다음이 성립한다.
        $$p_{n+1}=-\dfrac{a+b}{a}=-1-\dfrac ba=-1+p_n$$
        [그림: 「$n$회 시행」 — 점 $(0,1)$에서 $y$축을 따라 길이 $a$만큼 내려온 점에서 새 선분이 오른쪽 아래로 뻗고, 그 선분을 빗변으로 하는 직각삼각형의 높이 $b$, 밑변 $a$. 「$n+1$회 시행」 — 다음 새 선분은 $y$축 위에서 높이 $a+b$만큼, 오른쪽으로 $a$만큼 이동하는 빗변]
      criteria: ['1-3.M1']
    - id: 13b-3
      content: |
        즉 $p_n$은 첫째항이 $-1$, 공차가 $-1$인 등차수열이므로 $p_n=-n$이다. ■
      criteria: ['1-3.A1']
  rubric:
