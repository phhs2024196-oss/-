stimuli:
- label: 가
  body: |
    두 함수 $f(x)$와 $g(x)$에 대하여 함수 $h(x)$의 값을 $f(x)$의 값과 $g(x)$의 값 중 작지 않은 값으로 정의하자. 예를 들어 $f(x)=\sin x$, $g(x)=\cos x$이면 $y=h(x)$의 그래프는 [그림 1]과 같다.
    [그림 1: $-2\pi\le x\le2\pi$에서 $y=\sin x$(점선), $y=\cos x$(점선)과 두 그래프 중 위쪽을 따라가는 $y=h(x)$(굵은 실선)의 그래프. $x$축에 $-2\pi,-\pi,\mathrm{O},\pi,2\pi$ 표시]
- label: 나
  body: |
    $0\le t\le1$인 실수 $t$에 대하여 직선 $y=t$와 원 $C:x^2+y^2=1$이 만나는 점을 $x$좌표가 크지 않은 순서대로 $\mathrm{P}$와 $\mathrm{Q}$라 하고 각 $\mathrm{POQ}$의 크기를 $\theta\,(0\le\theta\le\pi)$라 하자. 이때 $t=1$이면 점 $\mathrm{P}$와 점 $\mathrm{Q}$는 같은 점이며 $\theta=0$이다. [그림 2]의 색칠된 도형과 같이 원 $C$가 선분 $\mathrm{PQ}$에 의하여 나뉘는 두 부분 중 윗부분의 도형을 생각하자. 이 도형의 넓이를 $A(\theta)$라 하고 둘레의 길이를 $B(\theta)$라 하자. (단, 각의 크기의 단위는 라디안이다.)
    [그림 2: 단위원 $C$와 직선 $y=t$의 교점 $\mathrm{P}$(왼쪽), $\mathrm{Q}$(오른쪽), 원점 $\mathrm{O}$에서 $\mathrm{P}$, $\mathrm{Q}$로 그은 선분과 그 사이의 각 $\theta$. 현 $\mathrm{PQ}$ 위쪽의 활꼴이 색칠되어 있음. 축에 $-1,1$과 $y$축 위 $t,1,-1$ 표시]

stem: |
  다음 제시문을 읽고 문제에 답하시오.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 물음에 답하시오.
    (1) $f(x)=\dfrac{x^2}{2}-2$이고 $g(x)=\log_2x$일 때, 닫힌구간 $[2,3]$에서 $h(x)$의 최댓값과 최솟값을 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: 'max = 5/2; min = 1', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 두 그래프는 $[2,3]$ 안에서 한 번 교차하고, 왼쪽 끝에서는 $g$가, 오른쪽 끝에서는 $f$가 위에 있다.
    steps:
    - {id: 11a, content: '$h(3)=f(3)=\tfrac52$(최대), $h(2)=g(2)=1$(최소)', criteria: ['1-1.A1', '1-1.A2']}
    hint_ladder:
    - 두 그래프를 함께 그려 $x=2$, $x=3$에서 어느 쪽이 위인지 보자.
    - $f$, $g$가 모두 증가함수라면 $h$도 증가한다.
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.1 (PDF p.7)
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        두 함수 $y=f(x)$와 $y=g(x)$의 그래프를 그리면, $f(x)=\dfrac{x^2}{2}-2$와 $g(x)=\log_2x$는 $[2,3]$에서 모두 증가하고 두 그래프는 $2$와 $3$ 사이에서 한 번 만난다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        $g(3)<2<f(3)$이므로 닫힌구간 $[2,3]$에서 함수 $h(x)$의 최댓값은 $h(3)=f(3)=\dfrac52$이다.
      criteria: ['1-1.A1']
    - id: 11b-3
      content: |
        $f(2)=0<g(2)=1$이므로 닫힌구간 $[2,3]$에서 함수 $h(x)$의 최솟값은 $h(2)=g(2)=1$이다.
      criteria: ['1-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 공식 채점기준 [1-1](1): 그래프 관찰로 최댓값 4점 / 최솟값 4점 (관찰 마크를 각 4점에 포함해 분할)
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        두 함수 $y=f(x)$, $y=g(x)$의 그래프(또는 증가성·대소)를 관찰해 $h$의 값을 정했다.
      depends_on: []
      implied_ok: true
      steps: [11b-1]
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        $g(3)<f(3)$을 보이고 최댓값 $h(3)=\dfrac52$를 구했다.
      depends_on: [1-1.M1]
      steps: [11b-2]
    - id: 1-1.A2
      mark_type: A
      points: 3
      evidence: |
        $f(2)<g(2)$를 보이고 최솟값 $h(2)=1$을 구했다.
      depends_on: [1-1.M1]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) $f(x)=\sin2x$이고 $g(x)=\dfrac34\cos x$일 때, 열린구간 $(-\pi,\pi)$에서 함수 $h(x)$가 극솟값을 갖는 $x$의 값 중 가장 큰 값을 $\alpha$라 하자. $\tan\alpha$의 값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '-3*sqrt(55)/55', equivalents: ['-3/sqrt(55)'], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $h$의 극소는 두 곡선의 교점(꺾인 점)에서 생기고, 가장 큰 교점은 $\sin\alpha=\tfrac38$, $\tfrac{\pi}{2}<\alpha<\pi$이다.
    steps:
    - {id: 12a, content: '$2\sin\alpha\cos\alpha=\tfrac34\cos\alpha$, $\cos\alpha\ne0\Rightarrow\sin\alpha=\tfrac38$, $\tan\alpha=-\tfrac{3}{\sqrt{55}}$', criteria: ['1-2.M1', '1-2.A1', '1-2.A2']}
    hint_ladder:
    - 두 그래프를 함께 그리고, $h$의 그래프가 꺾이며 아래로 뾰족한 곳을 찾자.
    - 교점 방정식에 배각 공식을 쓰자.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.1 (PDF p.7)
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        두 함수 $y=\sin2x$와 $y=\dfrac34\cos x$의 그래프를 그리면, 열린구간 $(-\pi,\pi)$에서 $h(x)$가 극솟값을 갖는 $x$ 중 가장 큰 값 $\alpha$는 두 곡선 $y=f(x)$와 $y=g(x)$의 교점 중 $x$좌표가 가장 큰 값이고 $\sin2\alpha=\dfrac34\cos\alpha$이다.
        (보충: 교점의 $x$좌표는 $\cos x=0$ 또는 $\sin x=\dfrac38$인 $x$, 즉 $\pm\dfrac{\pi}{2}$, $\arcsin\dfrac38$, $\pi-\arcsin\dfrac38$이고, $x=\alpha$의 왼쪽에서는 $h=\dfrac34\cos x$가 감소, 오른쪽에서는 $h=\sin2x$가 증가한다.)
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        삼각함수의 덧셈정리에 의하여 $\sin2\alpha=\sin\alpha\cos\alpha+\cos\alpha\sin\alpha=2\sin\alpha\cos\alpha$이므로 $2\sin\alpha\cos\alpha=\dfrac34\cos\alpha$이다. $\cos\alpha\ne0$이므로 $\sin\alpha=\dfrac38$이다.
      criteria: ['1-2.A1']
    - id: 12b-3
      content: |
        $\dfrac{\pi}{2}<\alpha<\pi$이므로 $\cos\alpha=-\dfrac{\sqrt{55}}{8}$, $\tan\alpha=-\dfrac{3\sqrt{55}}{55}$이다.
      criteria: ['1-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 4
      evidence: |
        $x=\alpha$가 두 곡선의 교점($x$좌표가 가장 큰 교점)임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [12b-1]
    - id: 1-2.A1
      mark_type: A
      points: 4
      evidence: |
        $\sin\alpha=\dfrac38$ 또는 $\cos\alpha=-\dfrac{\sqrt{55}}{8}$을 구했다.
      depends_on: [1-2.M1]
      steps: [12b-2]
    - id: 1-2.A2
      mark_type: A
      points: 4
      evidence: |
        $\dfrac{\pi}{2}<\alpha<\pi$임을 밝히고 $\tan\alpha=-\dfrac{3\sqrt{55}}{55}$를 구했다.
      depends_on: [1-2.M1, 1-2.A1]
      steps: [12b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 1-2] 제시문 (나)를 읽고 물음에 답하시오.
    (1) $t=\dfrac13$일 때, $\sin\theta$의 값을 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '4*sqrt(2)/9', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: 삼각형 $\mathrm{OPQ}$의 넓이를 $\tfrac12\overline{\mathrm{PQ}}\cdot t$와 $\tfrac12\sin\theta$ 두 가지로 쓴다.
    steps:
    - {id: 21a, content: '$\overline{\mathrm{PQ}}=\tfrac{4\sqrt2}{3}$, 넓이 $=\tfrac{2\sqrt2}{9}=\tfrac12\sin\theta$', criteria: ['2-1.M1', '2-1.A1']}
    hint_ladder:
    - 삼각형 $\mathrm{OPQ}$의 넓이를 두 가지 방법으로 나타내 보자.
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.1 (PDF p.7)
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        점 $\mathrm{P}$와 점 $\mathrm{Q}$는 원 $C$ 위의 점이므로 $x^2+\dfrac19=1$에서 두 점의 $x$좌표는 $-\dfrac{2\sqrt2}{3}$와 $\dfrac{2\sqrt2}{3}$이다. 즉 $\overline{\mathrm{PQ}}=\dfrac{4\sqrt2}{3}$이고 삼각형 $\mathrm{OPQ}$의 넓이는 $\dfrac12\overline{\mathrm{PQ}}\cdot\dfrac13=\dfrac{2\sqrt2}{9}$이다.
      criteria: ['2-1.M1']
    - id: 21b-2
      content: |
        한편 삼각형 $\mathrm{OPQ}$는 두 변의 길이가 $1$이고 그 끼인각의 크기가 $\theta$인 삼각형이므로 넓이는 $\dfrac12\sin\theta$이다. 따라서 $\sin\theta=\dfrac{4\sqrt2}{9}$이다.
      criteria: ['2-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 4
      evidence: |
        삼각형 $\mathrm{OPQ}$의 넓이 $\dfrac{2\sqrt2}{9}$ 또는 $\overline{\mathrm{PQ}}=\dfrac{4\sqrt2}{3}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [21b-1]
    - id: 2-1.A1
      mark_type: A
      points: 4
      evidence: |
        삼각함수의 정의(또는 넓이 $\dfrac12\sin\theta$)를 이용해 $\sin\theta=\dfrac{4\sqrt2}{9}$를 구했다.
      depends_on: [2-1.M1]
      steps: [21b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    (2) $\displaystyle\int_0^{\pi}A(\theta)\,d\theta$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'pi**2/4 - 1', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: 활꼴의 넓이 $=$ 부채꼴 $-$ 삼각형 $=\tfrac{\theta-\sin\theta}{2}$.
    steps:
    - {id: 22a, content: '$\int_0^{\pi}\tfrac{\theta-\sin\theta}{2}d\theta=\tfrac{\pi^2}{4}-1$', criteria: ['2-2.M1', '2-2.A1']}
    hint_ladder:
    - 색칠된 도형에 삼각형 $\mathrm{OPQ}$를 붙이면 무엇이 되는가?
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.2 (PDF p.8)
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $0<\theta<\pi$일 때, 반지름이 $1$이고 중심각의 크기가 $\theta$인 부채꼴의 넓이는 $\dfrac{\theta}{2}$이고, 길이가 $1$인 두 변의 끼인각의 크기가 $\theta$인 삼각형 $\mathrm{POQ}$의 넓이는 $\dfrac{\sin\theta}{2}$이므로 $A(\theta)=\dfrac{\theta}{2}-\dfrac{\sin\theta}{2}$이다. $\theta=0$일 때 $A(0)=0$이고, $\theta=\pi$일 때 $A(\pi)=\dfrac{\pi}{2}$이다. 따라서 닫힌구간 $[0,\pi]$에서 $A(\theta)=\dfrac{\theta}{2}-\dfrac{\sin\theta}{2}$이다.
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        그러므로
        $$\int_0^{\pi}A(\theta)\,d\theta=\int_0^{\pi}\frac12(\theta-\sin\theta)\,d\theta=\left[\frac{\theta^2}{4}+\frac{\cos\theta}{2}\right]_0^{\pi}=\left(\frac{\pi^2}{4}-\frac12\right)-\frac12=\frac{\pi^2}{4}-1$$
        이다.
      criteria: ['2-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 6
      evidence: |
