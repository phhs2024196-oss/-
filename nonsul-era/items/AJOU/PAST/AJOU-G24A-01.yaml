- id: '2-3'
  stem: |
    (3) $\displaystyle\lim_{\theta\to0+}\frac{B(\theta)}{\sin\theta}$의 값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S23-A
    audience: A
    method_no: 1
    key_idea: $B(\theta)=\theta+2\sin\tfrac{\theta}{2}$이고 두 항이 각각 $\sin\theta$와 같은 차수로 $0$에 간다.
    steps:
    - {id: 23a, content: '$\lim\tfrac{\theta}{\sin\theta}+\lim\tfrac{2\sin(\theta/2)}{\sin\theta}=1+1=2$', criteria: ['2-3.M1', '2-3.M2', '2-3.A1']}
    hint_ladder:
    - 둘레는 호와 현으로 이루어진다.
    - 현 $\mathrm{PQ}$의 중점을 잡아 직각삼각형을 만들자.
  - id: S23-B
    audience: B
    source_flow: 모범답안 p.2 (PDF p.8)
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        선분 $\mathrm{PQ}$의 중점을 점 $\mathrm{R}$이라 하면 각 $\mathrm{ROQ}$의 크기는 $\dfrac{\theta}{2}$이고 삼각형 $\mathrm{ROQ}$의 빗변의 길이가 $1$이므로 $\overline{\mathrm{RQ}}=\sin\dfrac{\theta}{2}$이다. 따라서 $\overline{\mathrm{PQ}}=2\sin\dfrac{\theta}{2}$이다.
      criteria: ['2-3.M1']
    - id: 23b-2
      content: |
        호 $\mathrm{PQ}$의 길이는 $\theta$이므로 $B(\theta)=\theta+2\sin\dfrac{\theta}{2}$이며
        $$\lim_{\theta\to0+}\frac{B(\theta)}{\sin\theta}=\lim_{\theta\to0+}\frac{\theta+\overline{\mathrm{PQ}}}{\sin\theta}=\lim_{\theta\to0+}\frac{\theta}{\sin\theta}+\lim_{\theta\to0+}\frac{2\sin\frac{\theta}{2}}{\sin\theta}$$
      criteria: ['2-3.M2']
    - id: 23b-3
      content: |
        $\displaystyle\lim_{\theta\to0+}\frac{\theta}{\sin\theta}=1$이고 $\dfrac{2\sin\frac{\theta}{2}}{\sin\theta}=\dfrac{1}{\cos\frac{\theta}{2}}\to1$이므로(보충: $\sin\theta=2\sin\frac{\theta}{2}\cos\frac{\theta}{2}$) 구하는 값은 $1+1=2$이다.
      criteria: ['2-3.A1']
  - id: S23-ALT
    audience: ALT
    source_flow: 모범답안 p.2 (PDF p.8) 별해
    method_no: 2
    key_idea: 원 해설 별해 — 코사인법칙으로 $\overline{\mathrm{PQ}}=\sqrt{2-2\cos\theta}$를 구하고 분자 유리화로 극한을 계산한다.
    steps:
    - id: 23c-1
      content: |
        반지름이 $1$이고 중심각이 $\theta$인 부채꼴의 호의 길이는 $\theta$이므로 $B(\theta)=\theta+\overline{\mathrm{PQ}}$이다. 삼각형 $\mathrm{OPQ}$에 코사인법칙을 적용하면 $\overline{\mathrm{PQ}}=\sqrt{2-2\cos\theta}$이다.
      criteria: ['2-3.M1', '2-3.M2']
    - id: 23c-2
      content: |
        $$\lim_{\theta\to0+}\frac{\overline{\mathrm{PQ}}}{\sin\theta}=\lim_{\theta\to0+}\frac{\sqrt{2(1-\cos\theta)}}{\sin\theta}=\lim_{\theta\to0+}\frac{\sqrt2\sqrt{1-\cos^2\theta}}{\sin\theta\sqrt{1+\cos\theta}}=\lim_{\theta\to0+}\frac{\sqrt2}{\sqrt{1+\cos\theta}}=1$$
        이므로 $\displaystyle\lim_{\theta\to0+}\frac{B(\theta)}{\sin\theta}=1+1=2$이다.
      criteria: ['2-3.A1']
