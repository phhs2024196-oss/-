intent: |
  두 함수 중 작지 않은 값을 택한 함수의 최대·최소·극소를 그래프 관찰과 삼각함수 덧셈정리로 구하고, 원과 현이 만드는 활꼴의 넓이·둘레를 중심각 $\theta$의 함수로 나타내 정적분과 삼각함수의 극한을 계산하는 능력을 본다.
key_idea: |
  $h=\max(f,g)$의 극소는 두 곡선의 교점에서 생기고, 활꼴의 넓이는 (부채꼴) $-$ (삼각형) $=\dfrac{\theta-\sin\theta}{2}$, 둘레는 $\theta+2\sin\dfrac{\theta}{2}$이다.
stuck: |
  $h(x)$가 극솟값을 갖는 점이 두 곡선의 교점이라는 관찰, 그리고 $\overline{\mathrm{PQ}}=2\sin\dfrac{\theta}{2}$를 이끄는 중점 보조선
