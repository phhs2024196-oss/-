  합성을 반복한 함수가 상수함수가 되는 'n-상수함수'의 정의를 해석하고, 함숫값의 단조성·고정점·치역의 크기로 경우를 나누어 조건을 만족하는 함수를 찾거나 세는 능력을 본다.
