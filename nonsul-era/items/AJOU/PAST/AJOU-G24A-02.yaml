stimuli:
- label: 가   # 원문에는 (가) 표기 없음(제시문 1개)
  body: |
    공집합이 아닌 집합 $X$에 대하여 정의역과 공역이 같은 함수 $f:X\to X$가 있다. 이때 $f$가 상수함수이면 $f$를 '1-상수함수', $f\circ f$가 상수함수이면 $f$를 '2-상수함수', $f\circ f\circ f$가 상수함수이면 $f$를 '3-상수함수'라 하자. 이와 같은 방법으로 자연수 $n$에 대하여 '$n$-상수함수'를 정의하자.
    예를 들어 $X=\{1,2,3\}$일 때 [그림 3]과 같은 대응으로 정의된 세 함수 $f,g,h$를 생각하자. 함수 $f$는 상수함수이므로 모든 자연수 $n$에 대하여 $n$-상수함수이다. 함수 $g$는 항등함수이므로 모든 자연수 $n$에 대하여 $n$-상수함수가 아니고, 함수 $h\circ h$는 함숫값이 $3$인 상수함수이므로 $h$는 2-상수함수이다.
    [그림 3: 세 대응도. $f$: $1\to2$, $2\to2$, $3\to2$ / $g$: $1\to1$, $2\to2$, $3\to3$ / $h$: $1\to2$, $2\to3$, $3\to3$]

stem: |
  다음 제시문을 읽고 문제에 답하시오.

subparts:
- id: '1-1'
  stem: |
    [문제 2-1] $X=\{n\mid n\text{은 자연수}\}$일 때 물음에 답하시오.
    (1) 함수 $f:X\to X$는 $f(3)=3$인 2-상수함수이다. 자연수 $n$에 대하여 $a_n=(f\circ f\circ f)(n)$이라 할 때, $\displaystyle\sum_{n=1}^{2024}a_n$의 값을 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '6072', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $(f\circ f)(3)=3$이므로 상수함수 $f\circ f$의 값은 $3$이고, $a_n=f(3)=3$.
    steps:
    - {id: 11a, content: '$a_n=3$이므로 합 $=3\times2024=6072$', criteria: ['1-1.M1', '1-1.A1', '1-1.A2']}
    hint_ladder:
    - $f\circ f$가 상수함수라면 그 상수는 무엇인가? $n=3$을 넣어 보자.
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.2 (PDF p.8)
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $f(3)=3$이므로 $(f\circ f)(3)=f(f(3))=f(3)=3$이다. $f$가 2-상수함수이므로 모든 $n\in X$에 대하여 $(f\circ f)(n)=3$이다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        따라서 모든 $n\in X$에 대하여 $a_n=(f\circ f\circ f)(n)=f((f\circ f)(n))=f(3)=3$이다.
      criteria: ['1-1.A1']
    - id: 11b-3
      content: |
        그러므로 $\displaystyle\sum_{n=1}^{2024}a_n=3\times2024=6072$이다.
      criteria: ['1-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        모든 $n$에 대하여 $(f\circ f)(n)=3$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [11b-1]
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        모든 $n$에 대하여 $a_n=3$임을 적었다.
      depends_on: [1-1.M1]
      steps: [11b-2]
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: |
        합의 기호를 계산해 $6072$를 얻었다.
      depends_on: [1-1.M1, 1-1.A1]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) 자연수 $k$에 대하여 함수 $f:X\to X$는 $f(n)=\begin{cases}n+3&(n<k)\\k+3&(n\ge k)\end{cases}$라 하자. $f$가 2-상수함수는 아니면서 3-상수함수가 되도록 하는 $k$를 모두 구하시오. (단, $k>1$)
  points: 12
  depends_on: []
  answer: {kind: set, value: '[5, 6, 7]', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $f$는 증가(감소하지 않는)함수이므로 합성함수도 $n=1$에서 최솟값을 갖고, 상수함수인지는 $n=1$의 값이 $k+3$인지로 판정된다.
    steps:
    - {id: 12a, content: '$f(1)=4$, $(f\circ f)(1)=7$이므로 $f\circ f$ 상수 $\iff k\le4$, $f\circ f\circ f$ 상수 $\iff k\le7$', criteria: ['1-2.M1', '1-2.A1', '1-2.A2']}
    hint_ladder:
    - $f$의 최댓값은 $k+3$이다. 합성함수가 상수함수라면 그 상수는 무엇이어야 할까?
    - $n=1$에서의 함숫값을 따라가 보자.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.2 (PDF p.8)
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        자연수 $m,n$에 대하여 $m>n$이면 $f(m)\ge f(n)$이다. 그러므로 함수 $f(n)$은 $n=1$에서 최솟값을 갖는다. 같은 방법으로 합성함수 $(f\circ f)(n)$은 $n=1$에서 최솟값을 갖고, $(f\circ f\circ f)(n)$은 $n=1$에서 최솟값을 갖는다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        함수 $f$는 상수함수가 아니어야 하므로 $f(1)=4$이다($k>1$). $f$는 2-상수함수가 아니므로 $k>4$이고 $(f\circ f)(1)=7$이다.
        (보충: $(f\circ f)(n)$의 최댓값은 $k+3$이므로 $f\circ f$가 상수 $\iff(f\circ f)(1)=f(4)=k+3\iff k\le4$.)
      criteria: ['1-2.A1']
    - id: 12b-3
      content: |
        함수 $f$는 3-상수함수이므로 $(f\circ f\circ f)(1)=f(7)=k+3$, 즉 $k\le7$이어야 한다. 그러므로 가능한 $k$의 값은 $5,6,7$이다.
      criteria: ['1-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 4
      evidence: |
        자연수 $m>n$이면 $f(m)\ge f(n)$임(단조성)을 적었다.
      depends_on: []
      implied_ok: false
      steps: [12b-1]
    - id: 1-2.A1
      mark_type: A
      points: 4
      evidence: |
        2-상수함수가 아니라는 조건에서 $k>4$를 이끌었다.
      depends_on: [1-2.M1]
      steps: [12b-2]
    - id: 1-2.A2
      mark_type: A
      points: 4
      evidence: |
        3-상수함수 조건에서 $k\le7$을 이끌고 답 $k=5,6,7$을 적었다.
      depends_on: [1-2.M1, 1-2.A1]
      steps: [12b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 2-2] 집합 $X=\{1,2,3,4\}$일 때, 다음 <조건>을 만족시키는 4-상수함수 $f:X\to X$를 모두 구하시오.
    <조건>
    ① $(f\circ f\circ f\circ f)(1)=4$
    ② $f(1)\le f(2)\le f(3)\le f(4)$
  points: 15
  depends_on: []
  answer: {kind: set, value: '[(2,3,4,4), (2,4,4,4), (3,3,4,4), (3,4,4,4), (4,4,4,4)]', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f^4\equiv4$이므로 $f(4)=4$이고 다른 고정점은 없다. 단조성과 합치면 $x<f(x)$이므로 $f(3)=4$, 나머지는 $f(1)\le f(2)$의 경우 나눔.
    steps:
    - {id: 2a, content: '$(f(1),f(2),f(3),f(4))=(2,3,4,4),(2,4,4,4),(3,3,4,4),(3,4,4,4),(4,4,4,4)$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $f\circ f\circ f\circ f$가 상수 $4$라면 $f(4)$는 무엇인가?
    - $f(x)=x$인 $x\ne4$가 있으면 어떻게 되는가?
  - id: S2-B
    audience: B
    source_flow: 모범답안 p.3 (PDF p.9)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        함수 $f:X\to X$는 4-상수함수이고 $(f\circ f\circ f\circ f)(1)=4$이므로 <조건>의 ①에 의하여 $f(4)=4$이다. (보충: $f\circ f\circ f\circ f$는 값이 $4$인 상수함수이므로 $f(4)=f(f^4(4))=f^4(f(4))=4$.)
        만약 $f(x)=x$를 만족하는 $x\in\{1,2,3\}$가 존재하면 $f\circ f\circ f\circ f$의 치역에는 $x$와 $4$가 모두 포함되어 상수함수가 아니다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $x=1,2,3$일 때 $f(x)\ne x$이며, <조건>의 ②에 의하여 $x=1,2,3$일 때 $x<f(x)$이다. 즉, $f(3)=4$가 된다.
        (보충: $f(1)<1$은 불가능하므로 $f(1)\ge2$, 단조성으로 $f(2)\ge2$이고 $f(2)\ne2$이므로 $f(2)\ge3$, 같은 방법으로 $f(3)=4$.)
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        따라서 $f(1)$과 $f(2)$로 가능한 값은 다음과 같다.
        • $f(1)=2$이면 $f(2)$는 $3$ 또는 $4$이다.
        • $f(1)=3$이면 $f(2)$는 $3$ 또는 $4$이다.
        • $f(1)=4$이면 $f(2)=4$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        이를 종합하면, 주어진 조건을 만족하는 함수는 $(f(1),f(2),f(3),f(4))$가
        (1) $(2,3,4,4)$ (2) $(2,4,4,4)$ (3) $(3,3,4,4)$ (4) $(3,4,4,4)$ (5) $(4,4,4,4)$
        인 다섯 경우가 있다. (1)은 3-상수함수이고 (2)~(4)는 2-상수함수이며 (5)는 1-상수함수이다. 따라서 이들은 모두 4-상수함수이다.
        [원 해설은 다섯 함수를 대응도 그림으로 제시]
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $f(4)=4$, $f(3)=4$를 조건으로부터 이끌었다(고정점 배제와 단조성 근거 포함).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.M2
      mark_type: M
      points: 8
      evidence: |
        $f(1)$과 $f(2)$로 가능한 값을 경우별로 바르게 정리했다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        조건을 만족하는 다섯 함수를 모두 바르게 적었다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 2-3] 집합 $X=\{1,2,3\}$일 때, 명제 '어떤 자연수 $n$에 대하여 함수 $g:X\to X$는 $n$-상수함수이다.'가 참이 되도록 하는 함수 $g:X\to X$의 개수를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '9', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 일대일대응은 제외하고 치역의 크기로 나눈다. 치역 크기 1은 3개, 크기 2는 치역 밖 원소가 '가지'가 되는 경우만(각 치역당 2개).
    steps:
    - {id: 3a, content: '$3+3\times2=9$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - 일대일대응을 여러 번 합성하면 어떤 함수가 되는가?
    - 치역이 $\{a,b\}$일 때 $g(a)$, $g(b)$의 관계로 나누어 보자.
  - id: S3-B
    audience: B
    source_flow: 모범답안 p.3 (PDF p.9)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        어떤 함수가 일대일대응이면 그 함수를 여러 번 합성한 함수도 일대일대응이므로 상수함수가 될 수 없다. 따라서 일대일대응이 아닌 함수만 살펴보아도 충분하다. 일대일대응인 경우는 치역의 원소의 개수가 $3$이므로 치역의 원소의 개수가 $1$과 $2$인 경우를 확인해 보자.
        (i) 치역의 원소의 개수가 $1$인 경우는 1-상수함수이므로 이러한 함수 $g$에 대하여 주어진 명제는 참이며, 이러한 함수의 개수는 $3$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (ii) 치역의 원소의 개수가 $2$인 경우 치역을 $\{a,b\}$라 하고 치역에 속하지 않는 $X$의 원소를 $c$라 하자.
        • 함수 $g$에 대하여 $g(a)\ne g(b)$라 하자. $g(a)=a$, $g(b)=b$ 또는 $g(a)=b$, $g(b)=a$이면 함수 $g$는 여러 번 합성해도 함숫값으로 $a$와 $b$를 가지므로 이러한 함수 $g$에 대하여 주어진 명제는 참이 아니다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        • 함수 $g$에 대하여 $g(a)=g(b)$라 하자. 치역이 $\{a,b\}$이므로 $g(a)=g(b)=a$, $g(c)=b$이거나 $g(a)=b$, $g(b)=b$, $g(c)=a$이다. 두 함수 모두 2-상수함수로 이 함수들에 대하여 주어진 명제는 참이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        치역의 원소의 개수가 $2$인 경우는 $3$가지이므로 이러한 함수의 개수는 $6$이다. 따라서 총 $3+6=9$개의 함수가 주어진 명제를 참이 되도록 한다.
      criteria: ['3.A1']
