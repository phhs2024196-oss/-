stimuli:
- label: 가
  body: |
    곡선 $C:y=x^2-1$과 $C$ 위의 $x$좌표가 양수인 점 $\mathrm{P}(t,t^2-1)$이 있다. [그림 1]과 같이 곡선 $C$ 위의 점 $\mathrm{P}$에서의 접선에 수직이며 점 $\mathrm{P}$를 지나는 직선을 $L_{\mathrm{P}}$라 하고, 곡선 $C$와 직선 $L_{\mathrm{P}}$의 교점 중 $\mathrm{P}$가 아닌 점을 $\mathrm{Q}$라 하자.
    [그림 1: 포물선 $y=x^2-1$, 제1사분면의 점 $\mathrm{P}$에서의 접선과 그에 수직인 직선 $L_{\mathrm{P}}$(직각 표시). $L_{\mathrm{P}}$는 왼쪽 위로 올라가 제2사분면에서 포물선과 점 $\mathrm{Q}$에서 만남]
    곡선 $C$와 직선 $L_{\mathrm{P}}$로 둘러싸인 도형의 $x\ge0$인 부분의 넓이를 $S(t)$라 하자. 직선 $L_{\mathrm{P}}$와 $x$축이 이루는 예각의 크기를 $\theta$(라디안)라 하면 $t=\dfrac{1}{2\tan\theta}$이다. 따라서 $S(t)$를 $\theta$에 대한 함수로 나타낼 수 있다.
- label: 나
  body: |
    선분 $\mathrm{PQ}$ 위의 점 중에서 점 $\mathrm{P}(t,t^2-1)$과의 거리가 $1$인 점을 $\mathrm{R}$이라 하고, 점 $\mathrm{R}$의 $x$좌표와 $y$좌표를 매개변수 $t$로 나타낸 함수를 각각 $x(t)$, $y(t)$라 하자.

stem: |
  다음 제시문을 읽고 문제에 답하시오.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 물음에 답하시오.
    (1) $S(t)$를 $t$에 대한 다항식으로 나타내시오.
  points: 6
  depends_on: []
  answer: {kind: expression, value: '2*t**3/3 + t/4', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 법선 $y=-\tfrac{x}{2t}+t^2-\tfrac12$와 포물선 사이를 $0$부터 $t$까지 적분한다.
    steps:
    - {id: 11a, content: '$S(t)=\int_0^t\left(-\tfrac{x}{2t}+t^2-\tfrac12-x^2+1\right)dx=\tfrac23t^3+\tfrac t4$', criteria: ['1-1.M1', '1-1.M2', '1-1.A1']}
    hint_ladder:
    - 접선의 기울기가 $2t$이면 법선의 기울기는?
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.1 (PDF p.7)
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        점 $\mathrm{P}$에서의 접선의 기울기는 $2t$이므로 직선 $L_{\mathrm{P}}$의 방정식은 $y=-\dfrac{x}{2t}+t^2-\dfrac12$이다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        $0\le x\le t$에서 직선이 곡선보다 위에 있으므로 구하는 영역의 넓이는
        $$S(t)=\int_0^t\left(-\frac{x}{2t}+t^2-\frac12-x^2+1\right)dx$$
      criteria: ['1-1.M2']
    - id: 11b-3
      content: |
        $$S(t)=\left[-\frac{x^2}{4t}+\left(t^2+\frac12\right)x-\frac{x^3}{3}\right]_0^t=\frac23t^3+\frac t4$$
        이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        직선 $L_{\mathrm{P}}$의 방정식 $y=-\dfrac{x}{2t}+t^2-\dfrac12$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [11b-1]
    - id: 1-1.M2
      mark_type: M
      points: 2
      evidence: |
        $S(t)$를 $0$부터 $t$까지의 정적분 식으로 적었다.
      depends_on: [1-1.M1]
      steps: [11b-2]
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        정적분을 계산해 $S(t)=\dfrac23t^3+\dfrac t4$를 얻었다.
      depends_on: [1-1.M2]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) $t=1$일 때, $\theta$에 대한 $S(t)$의 순간변화율을 구하시오.
  points: 8
  depends_on: ['1-1']
  answer: {kind: value, value: '-45/8', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{dS}{d\theta}=S'(t)\dfrac{dt}{d\theta}$, $t=\dfrac{\cot\theta}{2}$.
    steps:
    - {id: 12a, content: '$\left(2+\tfrac14\right)\left(-\tfrac{5}{2}\right)=-\tfrac{45}{8}$', criteria: ['1-2.M1', '1-2.A1', '1-2.A2']}
    hint_ladder:
    - $S$를 $t$로, $t$를 $\theta$로 미분해 곱하자.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.1 (PDF p.7)
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $t=\dfrac{1}{2\tan\theta}=\dfrac{\cot\theta}{2}$이므로 합성함수의 미분법에 의하여
        $$S'(t)\times\frac{dt}{d\theta}=\left(2t^2+\frac14\right)\times\left(-\frac{\csc^2\theta}{2}\right)$$
        이다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        $t=1$일 때 $\tan\theta=\dfrac12$이고 $\theta$가 예각이므로 $\csc\theta=\sqrt5$이다.
      criteria: ['1-2.A1']
    - id: 12b-3
      content: |
        따라서 구하는 값은 $\dfrac94\times\left(-\dfrac52\right)=-\dfrac{45}{8}$이다.
      criteria: ['1-2.A2']
  - id: S12-ALT
    audience: ALT
    source_flow: 모범답안 p.1 (PDF p.7) 별해
    method_no: 2
    key_idea: 원 해설 별해 — $S$를 $\theta$의 함수 $f(\theta)=\tfrac{1}{12}\cot^3\theta+\tfrac18\cot\theta$로 직접 쓰고 미분한다.
    steps:
    - id: 12c-1
      content: |
        $t=\dfrac{1}{2\tan\theta}$이므로 $\theta$에 대한 함수로 나타낸 $S(t)$를 $f(\theta)$라 하면
        $$S(t)=f(\theta)=\frac23\left(\frac{1}{2\tan\theta}\right)^3+\frac{1}{8\tan\theta}=\frac{1}{12}\cot^3\theta+\frac18\cot\theta$$
        이므로 $f'(\theta)=-\dfrac18\csc^2\theta\left(2\cot^2\theta+1\right)$이다.
      criteria: ['1-2.M1']
    - id: 12c-2
      content: |
        $t=1$일 때 $\tan\theta=\dfrac12$이고 $\cot\theta=2$, $\csc\theta=\sqrt5$이므로 구하는 값은 $-\dfrac18\cdot5\cdot9=-\dfrac{45}{8}$이다.
      criteria: ['1-2.A1', '1-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 3
      evidence: |
        합성함수의 미분법으로 $\dfrac{dS}{d\theta}$(도함수)를 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1-1.A1], max_points: 3}
      steps: [12b-1, 12c-1]
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        $\theta$가 예각임을 이용해 $t=1$일 때 $\tan\theta=\dfrac12$, $\csc\theta=\sqrt5$(또는 필요한 삼각함수 값)를 구했다.
      depends_on: [1-2.M1]
      steps: [12b-2, 12c-2]
    - id: 1-2.A2
      mark_type: A
      points: 2
      evidence: |
        $-\dfrac{45}{8}$을 얻었다.
      depends_on: [1-2.M1, 1-2.A1]
      steps: [12b-3, 12c-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    (3) $\overline{\mathrm{PQ}}$의 최솟값을 구하시오.
  points: 13
  depends_on: []
  answer: {kind: value, value: '3*sqrt(3)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: $x$좌표 차 $c=2t+\tfrac{1}{2t}=\tfrac{1}{\tan\theta}+\tan\theta$를 $\cos\theta$로 나누면 $\overline{\mathrm{PQ}}=\tfrac{1}{\sin\theta\cos^2\theta}$.
    steps:
    - {id: 13a, content: '$a=\sin\theta$, $a(1-a^2)$ 최대 $\tfrac{2}{3\sqrt3}$ ($a=\tfrac{1}{\sqrt3}$) → 최솟값 $\tfrac{3\sqrt3}{2}$', criteria: ['1-3.M1', '1-3.M2', '1-3.A1']}
    hint_ladder:
    - $\mathrm{P}$, $\mathrm{Q}$의 $x$좌표 차와 $\overline{\mathrm{PQ}}$는 $\cos\theta$로 이어진다.
    - $\sin\theta$를 하나의 문자로 두자.
  - id: S13-B
    audience: B
    source_flow: 모범답안 p.1 (PDF p.7)
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        직선 $L_{\mathrm{P}}$와 곡선 $C$의 교점의 $x$좌표를 구하면 $-t-\dfrac{1}{2t}$, $t$이다. 따라서 점 $\mathrm{Q}$의 $x$좌표는 $-t-\dfrac{1}{2t}$이다. 점 $\mathrm{P}$의 $x$좌표와 점 $\mathrm{Q}$의 $x$좌표의 차를 $c$라 하면 $c=2t+\dfrac{1}{2t}=\dfrac{1}{\tan\theta}+\tan\theta$이다.
      criteria: ['1-3.M1']
    - id: 13b-2
      content: |
        $\cos\theta=\dfrac{c}{\overline{\mathrm{PQ}}}$이므로
        $$\overline{\mathrm{PQ}}=\frac{c}{\cos\theta}=\left(\frac{1}{\tan\theta}+\tan\theta\right)\frac{1}{\cos\theta}=\frac{1}{\sin\theta\cos^2\theta}$$
        이다.
      criteria: ['1-3.M2']
    - id: 13b-3
      content: |
        $a=\sin\theta$라 하면 $\theta$는 예각이므로 $0<a<1$이다. 따라서 $\overline{\mathrm{PQ}}=\dfrac{1}{a(1-a^2)}$이고 $0<a<1$에서 $a(1-a^2)$이 최댓값을 가질 때 $\overline{\mathrm{PQ}}$는 최솟값을 가진다. (보충: $\dfrac{d}{da}a(1-a^2)=1-3a^2$.) $a=\dfrac{1}{\sqrt3}$에서 $a(1-a^2)$는 최댓값 $\dfrac{2}{3\sqrt3}$를 갖는다. 그러므로 $\overline{\mathrm{PQ}}$의 최솟값은 $\dfrac{3\sqrt3}{2}$이다.
      criteria: ['1-3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 4
      evidence: |
        $\mathrm{Q}$의 $x$좌표 $-t-\dfrac{1}{2t}$ 혹은 $\mathrm{P}$, $\mathrm{Q}$의 $x$좌표의 차를 바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [13b-1]
    - id: 1-3.M2
      mark_type: M
      points: 4
      evidence: |
        $\overline{\mathrm{PQ}}=\dfrac{1}{\sin\theta\cos^2\theta}$ 등 $\theta$에 관한 식으로 표현했다.
      depends_on: [1-3.M1]
      steps: [13b-2]
    - id: 1-3.A1
      mark_type: A
      points: 5
      evidence: |
        최솟값 $\dfrac{3\sqrt3}{2}$를 구했다.
      depends_on: [1-3.M2]
      steps: [13b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 1-2] 제시문 (가)와 (나)를 읽고 물음에 답하시오.
    (1) 함수 $x(t)$와 $y(t)$를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'x = t - 2*t/sqrt(4*t**2 + 1); y = t**2 - 1 + 1/sqrt(4*t**2 + 1)', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{R}=\mathrm{P}+(a,b)$, 기울기 조건 $\tfrac ba=-\tfrac{1}{2t}$, 거리 조건 $a^2+b^2=1$, $a<0$.
    steps:
    - {id: 21a, content: '$a=-\tfrac{2t}{\sqrt{4t^2+1}}$, $b=\tfrac{1}{\sqrt{4t^2+1}}$', criteria: ['2-1.M1', '2-1.A1']}
    hint_ladder:
    - $\mathrm{R}$은 $\mathrm{P}$에서 직선 $L_{\mathrm{P}}$를 따라 왼쪽으로 1만큼 간 점이다.
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.1 (PDF p.7)
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        점 $\mathrm{R}$을 $(t+a,t^2-1+b)$라 두자. 두 점 $\mathrm{P}$, $\mathrm{R}$은 직선 $L_{\mathrm{P}}$ 위에 있으므로 $L_{\mathrm{P}}$의 기울기는 $\dfrac ba=-\dfrac{1}{2t}$이다. 또한 점 $\mathrm{P}$와 점 $\mathrm{R}$의 거리가 $1$이므로 $1=a^2+b^2=a^2\left(1+\dfrac{1}{4t^2}\right)$이다.
      criteria: ['2-1.M1']
    - id: 21b-2
      content: |
        이때 $t$는 양수이고 점 $\mathrm{R}$의 $x$좌표는 $t$보다 작아야 하므로 $a=-\dfrac{2t}{\sqrt{4t^2+1}}$, $b=\dfrac{1}{\sqrt{4t^2+1}}$이다. 따라서 점 $\mathrm{R}$의 $x$좌표와 $y$좌표를 매개변수 $t$로 나타낸 함수는
        $$x(t)=t-\frac{2t}{\sqrt{4t^2+1}},\quad y(t)=t^2-1+\frac{1}{\sqrt{4t^2+1}}$$
        이다.
      criteria: ['2-1.A1']
