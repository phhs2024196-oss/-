- id: '2-2'
  stem: |
    (2) 시각 $t$에서 점 $\mathrm{R}$의 위치를 $(x(t),y(t))$라 하자. 시각 $t=1$에서 $t=s$까지 점 $\mathrm{R}$이 움직인 거리를 $l(s)$라 할 때, $\displaystyle\lim_{s\to2}\frac{l(s)-l(2)}{s^2-4}$의 값을 구하시오. (단, $s>1$)
  points: 13
  depends_on: ['2-1']
  answer: {kind: value, value: 'sqrt(17)/4 - 1/34', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: 속력 $\sqrt{x'^2+y'^2}=\sqrt{1+4t^2}-\tfrac{2}{4t^2+1}$이고 극한은 $\tfrac14l'(2)$.
    steps:
    - {id: 22a, content: '$\tfrac14\left(\sqrt{17}-\tfrac{2}{17}\right)=\tfrac{\sqrt{17}}{4}-\tfrac{1}{34}$', criteria: ['2-2.M1', '2-2.M2', '2-2.A1', '2-2.A2']}
    hint_ladder:
    - 움직인 거리는 속력의 정적분이다.
    - $s^2-4=(s-2)(s+2)$로 나누어 미분계수를 만들자.
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.1–2 (PDF p.7–8)
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $x'(t)=1-\dfrac{2}{(\sqrt{4t^2+1})^3}$이고 $y'(t)=2t-\dfrac{4t}{(\sqrt{4t^2+1})^3}=2t\left(1-\dfrac{2}{(\sqrt{4t^2+1})^3}\right)$이다.
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        따라서 (보충: $t\ge1$에서 $1-\dfrac{2}{(\sqrt{4t^2+1})^3}>0$)
        $$l(s)=\int_1^s\sqrt{(x'(t))^2+(y'(t))^2}\,dt=\int_1^s\left(\sqrt{1+4t^2}-\frac{2}{4t^2+1}\right)dt$$
        이다.
      criteria: ['2-2.M2']
    - id: 22b-3
      content: |
        정적분과 미분의 관계에 의하여
        $$l'(s)=\frac{d}{ds}\int_1^s\left(\sqrt{1+4t^2}-\frac{2}{4t^2+1}\right)dt=\sqrt{1+4s^2}-\frac{2}{4s^2+1}$$
        이므로 $l'(2)=\sqrt{17}-\dfrac{2}{17}$이다.
      criteria: ['2-2.A1']
    - id: 22b-4
      content: |
        따라서
        $$\lim_{s\to2}\frac{l(s)-l(2)}{s^2-4}=\lim_{s\to2}\left(\frac{1}{s+2}\right)\left(\frac{l(s)-l(2)}{s-2}\right)=\frac14l'(2)=\frac{\sqrt{17}}{4}-\frac{1}{34}$$
        이다.
      criteria: ['2-2.A2']
