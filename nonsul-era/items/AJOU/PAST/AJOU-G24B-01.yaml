intent: |
  포물선의 법선과 포물선이 둘러싼 넓이를 $t$의 다항식으로 나타내 매개변수 $\theta$에 대한 변화율을 합성함수의 미분으로 구하고, 현의 길이를 삼각함수로 나타내 최솟값을 구하며, 법선 위의 점의 자취를 매개변수로 나타내 움직인 거리와 정적분으로 정의된 함수의 미분을 활용하는 능력을 본다.
key_idea: |
  $\overline{\mathrm{PQ}}=\dfrac{1}{\sin\theta\cos^2\theta}$이므로 $a=\sin\theta$로 두고 $a(1-a^2)$의 최댓값을 구한다. 움직인 거리 $l(s)$는 정적분으로 정의된 함수이므로 $l'(2)$로 극한을 계산한다.
stuck: |
  $\overline{\mathrm{PQ}}$를 $\theta$만의 식으로 바꾸는 것($x$좌표 차 $=\tfrac{1}{\tan\theta}+\tan\theta$, $\cos\theta$로 나눔)
