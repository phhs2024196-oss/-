  misconceptions: []

- id: '2-2'
  stem: |
    (2) $g(1)=2$이고 $g$-카드배열이 존재하도록 하는 함수 $g:\{1,2,3\}\to\{1,2,3\}$을 모두 구하시오.
  points: 12
  depends_on: []
  answer: {kind: set, value: '(2,3,1); (2,3,2); (2,3,3)', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: $g(2)\ne3$이면 1번·2번 카드가 서로를 이겨야 해 모순, $g(2)=3$이면 (가위/바위/보)가 항상 $g$-카드배열.
    steps:
    - {id: 22a, content: '$g(1)=2$, $g(2)=3$, $g(3)\in\{1,2,3\}$', criteria: ['2-2.M1', '2-2.M2', '2-2.A1']}
    hint_ladder:
    - $g(2)\le2$이면 2번 자리 카드를 이기는 카드는 어디에 있어야 하는가?
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.2 (PDF p.8)
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $g(2)\ne3$일 때 $g$-카드배열 $(A/B/C)$가 존재한다고 하자. $g(2)\ne3$이므로 $B$를 이기는 카드는 $A$이다. $g(1)=2$이므로 $A$를 이기는 카드는 $B$가 되어 모순이다. 따라서 $g(2)\ne3$일 때 $g$-카드배열은 존재하지 않는다.
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        $g(2)=3$이면 $g(3)$의 값에 관계없이 (가위/바위/보)는 $g$-카드배열이다. (보충: 1번 가위를 이기는 바위는 2번($\le2$), 2번 바위를 이기는 보는 3번($\le3$), 3번 보를 이기는 가위는 1번($\le g(3)$).)
      criteria: ['2-2.M2']
    - id: 22b-3
      content: |
        따라서 답은
        • $g(1)=2$, $g(2)=3$, $g(3)=1$
        • $g(1)=2$, $g(2)=3$, $g(3)=2$
        • $g(1)=2$, $g(2)=3$, $g(3)=3$
        이다.
      criteria: ['2-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: R
      points: 4
      evidence: |
        $g(2)\ne3$이면 $g$-카드배열이 존재하지 않음을 근거와 함께 적었다.
      depends_on: []
      implied_ok: false
      steps: [22b-1]
    - id: 2-2.M2
      mark_type: R
      points: 4
      evidence: |
        $g(2)=3$이면 (가위/바위/보) 등 $g$-카드배열이 존재함을 보였다.
      depends_on: []
      implied_ok: false
      steps: [22b-2]
    - id: 2-2.A1
      mark_type: A
      points: 4
      evidence: |
        세 함수를 모두 적었다.
      depends_on: [2-2.M1, 2-2.M2]
      steps: [22b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-3'
  stem: |
    (3) 명제 '모든 카드배열이 $h$-카드배열이다.'가 참이 되도록 하는 함수 $h:\{1,2,3\}\to\{1,2,3\}$을 모두 구하시오. (단, $n=3$)
  points: 13
  depends_on: []
  answer: {kind: set, value: '(3,3,2); (3,3,3)', equivalents: [], tolerance: null}
  solutions:
  - id: S23-A
    audience: A
    method_no: 1
    key_idea: 반례 배열로 $h(1)=3$, $h(2)=3$, $h(3)\ne1$을 강제하고, 남은 두 함수는 모든 배열에서 규칙을 만족함을 확인.
    steps:
    - {id: 23a, content: '$(h(1),h(2),h(3))=(3,3,2),(3,3,3)$', criteria: ['2-3.R1', '2-3.R2', '2-3.A1']}
    hint_ladder:
    - 1번 자리 카드를 이기는 카드가 3번 자리에 있는 배열을 생각하자.
  - id: S23-B
    audience: B
    source_flow: 모범답안 p.2–3 (PDF p.8–9)
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        $h(1)\ne3$이면 (가위/보/바위)가 $h$-카드배열이 아니다. 그러므로 $h(1)=3$이다.
      criteria: ['2-3.R1']
    - id: 23b-2
      content: |
        $h(2)\ne3$이면 (보/가위/바위)가 $h$-카드배열이 아니다. 그러므로 $h(2)=3$이다. $h(3)=1$이면 (보/바위/가위)가 $h$-카드배열이 아니다. 따라서 $h(1)=3$, $h(2)=3$이고 $h(3)=2$ 또는 $h(3)=3$이다.
      criteria: ['2-3.R2']
    - id: 23b-3
      content: |
        (i) $h(1)=3$, $h(2)=3$, $h(3)=2$이면 임의의 카드배열을 생각하자. $h(1)=3$, $h(2)=3$이므로 규칙 ①, ②를 따른다. 3번 자리의 이기는 카드는 이미 1번 또는 2번 자리에 있고 $h(3)=2$이므로 규칙 ③도 따른다. 따라서 모든 카드배열이 $h$-카드배열이다.
        (ii) $h(1)=3$, $h(2)=3$, $h(3)=3$은 어떤 제약 조건도 없으므로 모든 카드배열이 $h$-카드배열이다.
        따라서 답은 $h(1)=3$, $h(2)=3$, $h(3)=3$과 $h(1)=3$, $h(2)=3$, $h(3)=2$이다.
      criteria: ['2-3.A1']
