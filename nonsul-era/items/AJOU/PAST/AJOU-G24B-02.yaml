stimuli:
- label: 가
  body: |
    서로 다른 세 장의 카드 '가위카드', '바위카드', '보카드'와 1번에서 $n$번$(n\ge3)$까지 차례대로 번호가 적혀있는 $n$개의 자리가 있다. 이 카드 세 장을 서로 다른 자리에 한 장씩 놓는 것을 '카드배열'이라 하고 어떤 두 카드의 자리 번호의 차가 $1$이면 두 카드는 '이웃한다'고 하자. 예를 들어 $n=4$일 때, [그림 2]와 [그림 3]의 카드배열은 서로 다른 배열이다. [그림 2]의 카드배열에서 보카드와 바위카드는 이웃하고 가위카드와 보카드는 이웃하지 않는다.
    [그림 2: 자리 1 가위, 자리 2 빈자리, 자리 3 보, 자리 4 바위]  [그림 3: 자리 1 빈자리, 자리 2 가위, 자리 3 보, 자리 4 바위]
- label: 나
  body: |
    $n=3$일 때, 카드의 이름을 차례로 써서 카드배열을 나타내자. 예를 들어 [그림 4]의 카드배열은 (가위/바위/보)로 나타낸다.
    [그림 4: 자리 1 가위, 자리 2 바위, 자리 3 보]
    $n=3$이고 정의역과 공역이 모두 $\{1,2,3\}$인 함수 $f$가 주어졌을 때, 다음 <규칙>을 따르는 카드배열을 '$f$-카드배열'이라 하자. 가위카드는 보카드를 이기고 보카드는 바위카드를 이기며 바위카드는 가위카드를 이긴다.
    <규칙>
    ① 1번 자리에 놓인 카드를 이기는 카드는 자리 번호가 $f(1)$ 이하이다.
    ② 2번 자리에 놓인 카드를 이기는 카드는 자리 번호가 $f(2)$ 이하이다.
    ③ 3번 자리에 놓인 카드를 이기는 카드는 자리 번호가 $f(3)$ 이하이다.
    예를 들어 함수 $f:\{1,2,3\}\to\{1,2,3\}$에 대하여 $f(1)=2$, $f(2)=3$, $f(3)=2$이면 (바위/보/가위)는 $f$-카드배열이다. (가위/보/바위)는 가위카드가 놓인 자리 번호가 $1$이므로 바위카드의 자리 번호는 $f(1)=2$ 이하이어야 하는데 그렇지 않으므로 $f$-카드배열이 아니다.

