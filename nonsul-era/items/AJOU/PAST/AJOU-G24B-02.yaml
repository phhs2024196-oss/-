- id: '2-1'
  stem: |
    [문제 2-2] 제시문 (가)와 (나)를 읽고 물음에 답하시오.
    (1) 함수 $f:\{1,2,3\}\to\{1,2,3\}$에 대하여 $f(1)=2$, $f(2)=3$, $f(3)=3$일 때, $f$-카드배열을 모두 구하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '가위/바위/보; 바위/보/가위; 보/가위/바위', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: ①에서 1번 카드를 이기는 카드가 2번 자리, 그러면 ②③은 자동으로 만족한다.
    steps:
    - {id: 21a, content: '(가위/바위/보), (바위/보/가위), (보/가위/바위)', criteria: ['2-1.M1', '2-1.A1']}
    hint_ladder:
    - 1번 자리 카드를 이기는 카드는 어디에 있어야 하는가?
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.2 (PDF p.8)
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        1번 자리에 임의의 카드 한 장을 놓으면 그 카드를 이기는 카드는 반드시 2번 자리에 놓아야 하고($f(1)=2$, 1번 자리에는 이미 다른 카드), $f(2)=3$이므로 2번 자리의 카드를 이기는 카드는 남은 3번 자리에 놓으면 $f(3)=3$이므로 $f$-카드배열이다.
      criteria: ['2-1.M1']
    - id: 21b-2
      content: |
        따라서 (가위/바위/보), (바위/보/가위), (보/가위/바위) 이렇게 $3$개의 $f$-카드배열이 있다.
      criteria: ['2-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 6
      evidence: |
        정의를 이용하여 1번 자리 카드를 이기는 카드가 2번 자리에 있어야 한다는 등 $f$-카드배열이 되는 조건을 적었다.
      depends_on: []
      implied_ok: false
      steps: [21b-1]
    - id: 2-1.A1
      mark_type: A
      points: 4
      evidence: |
        세 배열 (가위/바위/보), (바위/보/가위), (보/가위/바위)를 모두 적었다.
      depends_on: [2-1.M1]
      steps: [21b-2]
    deductions: []
  outcome_codes:
