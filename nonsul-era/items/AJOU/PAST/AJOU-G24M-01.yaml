  points: 12
  depends_on: []
  answer: {kind: set, value: '[4046, 4048, 4049, 4050]', equivalents: [], tolerance: null}
  solutions:
  - id: S23-A
    audience: A
    method_no: 1
    key_idea: 직선이 $-1<ax\le1$ 범위에 있는 각 주기 구간에서 교점이 하나씩 생기고, 직선이 높이 $1$ 근처를 지나는 $-2024<x<-2023$ 구간에서만 교점 수가 0·1·2로 갈린다.
    steps:
    - {id: 23a, content: '$a=-\tfrac{1}{2024}$: $2025+2024=4049$ / 그 밖: $4046,4048,4050$', criteria: ['2-3.A1', '2-3.A2', '2-3.A3', '2-3.A4']}
    hint_ladder:
    - $y=g(x)$의 그래프를 그리고 직선 $y=ax$가 $y=1$, $y=-1$과 만나는 $x$를 보자.
    - $x=-2024$ 근처에서 직선과 곡선의 위치 관계는 어떻게 되는가?
  - id: S23-B
    audience: B
    source_flow: 모범답안 p.2 (PDF p.9)
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        함수 $y=g(x)$의 그래프는 각 구간 $[k,k+1)$($k$는 정수)에서 점 $(k,1)$(포함)에서 $(k+1,-1)$(제외) 직전까지 감소하는 $\cos$ 곡선이 반복되는 모양이다. [원 해설 그림: $-5\le x\le5$에서 $y=g(x)$의 그래프]
        함수 $y=g(x)$의 그래프와 직선 $y=ax$의 교점의 개수를 $p$라 하자.
        (i) $a=-\dfrac{1}{2024}$인 경우: 제2사분면에 $2025$개의 교점이 있고, 제4사분면에 $2024$개의 교점이 있다. 즉, $p=4049$이다.
      criteria: ['2-3.A1']
    - id: 23b-2
      content: |
        (ii) $-\dfrac{1}{2023}<a<-\dfrac{1}{2024}$인 경우:
        • $-2024<x<-2023$에서 함수 $y=g(x)$의 그래프와 직선 $y=ax$가 만나지 않는 경우 제2사분면에 $2023$개의 교점이 있고 제4사분면에 $2023$개의 교점이 있다. 즉, $p=4046$이다.
      criteria: ['2-3.A2']
    - id: 23b-3
      content: |
        • $-2024<x<-2023$인 한 점에서 함수 $y=g(x)$의 그래프와 직선 $y=ax$가 접하는 경우 제2사분면에 $2024$개의 교점이 있고 제4사분면에 $2024$개의 교점이 있다. 즉, $p=4048$이다.
      criteria: ['2-3.A3']
    - id: 23b-4
      content: |
        • $-2024<x<-2023$에서 함수 $y=g(x)$의 그래프와 직선 $y=ax$가 두 점에서 만나는 경우 제2사분면에 $2025$개의 교점이 있고 제4사분면에 $2025$개의 교점이 있다. 즉, $p=4050$이다.
        (i)~(ii)에 의하여 구하는 교점의 개수로 가능한 수는 $4046$, $4048$, $4049$, $4050$이다.
        (보충: 정수가 아닌 $x$에서 $g(-x)=-g(x)$이고 직선도 원점 대칭이므로, 정수점에서 만나지 않는 (ii)에서는 제4사분면의 교점 수가 제2사분면과 같다.)
      criteria: ['2-3.A4']
