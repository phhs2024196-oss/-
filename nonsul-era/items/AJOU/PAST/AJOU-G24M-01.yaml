intent: |
  두 포물선으로 둘러싸인 도형의 넓이와 그 안의 정수점 개수를 경우를 나누어 세고, 구간 $[0,1)$의 함수를 주기 $1$로 반복한 '반복함수'의 정수점·미분가능성·직선과의 교점 개수를 분석하는 능력을 본다.
key_idea: |
  정수점은 $y=0,1,2$ 위에만 있고 $y=1$ 위의 개수는 $x^2\le n$으로 정해진다. 반복함수의 미분가능성은 $f(0)=f(1)$, $f'(0)=f'(1)$이며, $y=ax$와의 교점은 각 주기 구간에서 1개씩이고 경계 구간에서만 0·1·2개로 갈린다.
stuck: |
  [문제 1-1](2)에서 $\sqrt{2n}$이 정수인지에 따라 $(p,2)$꼴 정수점 유무가 갈린다는 것, [문제 1-2](3)에서 $-2024<x<-2023$ 구간의 접함·두 점 교차 경우를 찾는 것
