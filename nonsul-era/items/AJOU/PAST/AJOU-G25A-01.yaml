      content: |
        (1)에서 구한 두 점 $\mathrm{P}$, $\mathrm{Q}$의 좌표로부터 직선 $\mathrm{PQ}$의 방정식을 구하면
        $y=\dfrac{\frac{2cr}{1+r^2}-\sqrt r}{\frac{2c}{1+r^2}}x+\sqrt r=\dfrac{2cr-\sqrt r(1+r^2)}{2c}x+\sqrt r$이다.
        이 직선이 점 $\mathrm{S}(h(r),0)$을 지나므로 $h(r)=\dfrac{-2c\sqrt r}{2cr-\sqrt r(1+r^2)}=\dfrac{2c}{1+r^2-2c\sqrt r}$이다.
      criteria: [2-2.M1]
