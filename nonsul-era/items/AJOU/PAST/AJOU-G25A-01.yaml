stimuli:
- label: 가
  body: |
    (가) 함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고, 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때 도함수 $g'(t)$가 $\alpha,\beta$를 포함하는 구간에서 연속이면 다음이 성립한다.
    $$\int_a^b f(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
- label: 나
  body: |
    (나) $C$는 중심이 $(c,0)$이고 반지름의 길이가 $c$인 원이며, 점 $\mathrm{P}$의 좌표는 $(0,\sqrt r)$이다. 원점을 지나는 두 직선 $y=rx$와 $y=-rx$를 생각하자. 【그림 1】과 같이 직선 $y=rx$와 원 $C$의 교점 중 원점이 아닌 점을 $\mathrm{Q}$, 직선 $y=-rx$와 원 $C$의 교점 중 원점이 아닌 점을 $\mathrm{R}$, 직선 $\mathrm{PQ}$와 $x$축의 교점을 $\mathrm{S}$라 하자.
    (단, $0<c<1$이고 $0<r<\dfrac14$)

    [그림 1: 원점을 지나는 원 $C$(중심이 양의 $x$축 위)와 두 직선 $y=rx$(제1사분면 방향), $y=-rx$(제4사분면 방향). $y=rx$와 원의 교점 $\mathrm{Q}$는 제1사분면, $y=-rx$와 원의 교점 $\mathrm{R}$는 제4사분면에 있다. $y$축 위의 점 $\mathrm{P}$에서 $\mathrm{Q}$를 지나 오른쪽 아래로 내려가는 직선이 $x$축과 점 $\mathrm{S}$에서 만난다.]

stem: |
  [문항 1]【제시문】을 읽고 물음에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (30점) 제시문 (가)를 읽고 다음 물음에 답하라.
    (1) (10점) $\displaystyle\int_0^{\frac{\pi}{4}}\frac{1+\sin x-\sin^3x-\sin^4x}{\cos^4x}\,dx$의 값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1+sqrt(2)-pi/4', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 분자를 $\cos^2x(1+\sin x+\sin^2x)$로 인수분해하면 $2\sec^2x-1+\dfrac{\sin x}{\cos^2x}$가 되고, 마지막 항은 $t=\cos x$로 치환한다.
    steps:
    - {id: 11a, content: '$\int_0^{\pi/4}(2\sec^2x-1)dx+\int_0^{\pi/4}\frac{\sin x}{\cos^2x}dx=\left(2-\frac{\pi}{4}\right)+(\sqrt2-1)$', criteria: [1-1.M1, 1-1.M2, 1-1.A1]}
    hint_ladder:
    - 분자에서 $1-\sin^4x$와 $\sin x-\sin^3x$를 따로 묶어 보자.
    - $\cos^2x$로 약분한 뒤 $\sin^2x=1-\cos^2x$를 쓰면 어떤 꼴이 되는가?
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $1+\sin x-\sin^3x-\sin^4x=(1+\sin^2x)(1-\sin^2x)+\sin x(1-\sin^2x)=\cos^2x(1+\sin x+\sin^2x)$이므로
        $\dfrac{1+\sin x-\sin^3x-\sin^4x}{\cos^4x}=\dfrac{1+\sin x+\sin^2x}{\cos^2x}=(2\sec^2x-1)+\dfrac{\sin x}{\cos^2x}$이다.
      criteria: [1-1.M1]
    - id: 11b-2
      content: |
        $\cos x=t$라 하면 $\dfrac{dt}{dx}=-\sin x$이고, 치환적분법에 의하여 주어진 적분은
        $\displaystyle\int_0^{\frac{\pi}{4}}(2\sec^2x-1)\,dx+\int_0^{\frac{\pi}{4}}\frac{\sin x}{\cos^2x}\,dx=\Big[2\tan x-x\Big]_0^{\frac{\pi}{4}}-\int_1^{\frac{\sqrt2}{2}}\frac1{t^2}\,dt$
      criteria: [1-1.M2]
    - id: 11b-3
      content: |
        $=\left(2-\dfrac{\pi}{4}\right)+\Big[\dfrac1t\Big]_1^{\frac{\sqrt2}{2}}=1+\sqrt2-\dfrac{\pi}{4}$
      criteria: [1-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        주어진 적분을 $\displaystyle\int_0^{\frac{\pi}{4}}\frac{1+\sin x+\sin^2x}{\cos^2x}\,dx$ 정도로 간단히 정리했다.
      depends_on: []
      implied_ok: false
      steps: [11b-1]
    - id: 1-1.M2
      mark_type: M
      points: 3
      evidence: |
        각각의 부정적분($2\tan x-x$, $\dfrac1{\cos x}$ 또는 치환 후 $-\dfrac1t$)을 올바르게 구했다.
      depends_on: [1-1.M1]
      implied_ok: true
      steps: [11b-2]
    - id: 1-1.A1
      mark_type: A
      points: 4
      evidence: |
        답 $1+\sqrt2-\dfrac{\pi}{4}$를 올바르게 구했다.
      depends_on: [1-1.M2]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) (10점) $\displaystyle\int_0^{\frac{\pi}{6}}(1+2\sin x)^{10}\sin x\cos x\,dx$의 값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '6827/176', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $t=1+2\sin x$로 치환하면 $\sin x=\dfrac{t-1}{2}$, $\cos x\,dx=\dfrac{dt}{2}$이다.
    steps:
    - {id: 12a, content: '$\frac14\int_1^2t^{10}(t-1)dt=\frac{6827}{176}$', criteria: [1-2.M1, 1-2.A1]}
    hint_ladder:
    - 거듭제곱 안의 식을 통째로 새 변수로 두자.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $1+2\sin x=t$라 하면 $\dfrac{dt}{dx}=2\cos x$이므로 치환적분법을 적용하면
        $\displaystyle\int_0^{\frac{\pi}{6}}(1+2\sin x)^{10}\sin x\cos x\,dx=\frac14\int_1^2t^{10}(t-1)\,dt$이다.
      criteria: [1-2.M1]
    - id: 12b-2
      content: |
        $\displaystyle=\frac14\Big[\frac1{12}t^{12}-\frac1{11}t^{11}\Big]_1^2=\frac1{48}(2^{12}-1)-\frac1{44}(2^{11}-1)=\frac{6827}{176}$
      criteria: [1-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 5
      evidence: |
        치환적분법을 활용하여 주어진 적분식을 $\dfrac14\displaystyle\int_1^2t^{10}(t-1)\,dt$ 등으로 올바르게 변형했다.
      depends_on: []
      implied_ok: false
      steps: [12b-1]
    - id: 1-2.A1
      mark_type: A
      points: 5
      evidence: |
        답 $\dfrac{6827}{176}$을 올바르게 구했다.
      depends_on: [1-2.M1]
      steps: [12b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    (3) (10점) $\displaystyle\int_1^2\frac{x^2e^x-1}{x^2e^x+x}\,dx$의 값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'log((2*E**2+1)/(2*E+2))', equivalents: ['log(E**2+1/2)-log(E+1)'], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 분자·분모를 $x^2$으로 나누면 $\dfrac{e^x-\frac1{x^2}}{e^x+\frac1x}$이고 분자가 분모의 도함수이다.
    steps:
    - {id: 13a, content: '$\int_{e+1}^{e^2+\frac12}\frac1tdt=\ln\frac{2e^2+1}{2e+2}$', criteria: [1-3.M1, 1-3.A1]}
    hint_ladder:
    - 분자·분모를 같은 식으로 나누어 분자가 분모의 도함수가 되게 하자.
  - id: S13-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $\dfrac{x^2e^x-1}{x^2e^x+x}=\dfrac{e^x-\frac1{x^2}}{e^x+\frac1x}$이다. $e^x+\dfrac1x=t$라 하면 $\dfrac{dt}{dx}=e^x-\dfrac1{x^2}$이므로 치환적분법을 적용하면
        $\displaystyle\int_1^2\frac{x^2e^x-1}{x^2e^x+x}\,dx=\int_1^2\frac{e^x-\frac1{x^2}}{e^x+\frac1x}\,dx=\int_{e+1}^{e^2+\frac12}\frac1t\,dt$
      criteria: [1-3.M1]
    - id: 13b-2
      content: |
        $\displaystyle=\Big[\ln t\Big]_{e+1}^{e^2+\frac12}=\ln\frac{2e^2+1}{2e+2}$
      criteria: [1-3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 5
      evidence: |
        치환적분법($t=e^x+\dfrac1x$ 등)을 활용하여 주어진 적분식을 $\displaystyle\int_{e+1}^{e^2+\frac12}\frac1t\,dt$ 꼴로 올바르게 변형했다.
      depends_on: []
      implied_ok: false
      steps: [13b-1]
    - id: 1-3.A1
      mark_type: A
      points: 5
      evidence: |
        답 $\ln\dfrac{2e^2+1}{2e+2}$를 올바르게 구했다.
      depends_on: [1-3.M1]
      steps: [13b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 1-2] (20점) 제시문 (나)를 읽고 다음 물음에 답하라.
    (1) (10점) $\displaystyle\lim_{r\to0+}\frac{\overline{\mathrm{QR}}}{r}=3$일 때 $c$의 값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3/4', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $x^2-2cx+r^2x^2=0$에서 $\mathrm{Q}$, $\mathrm{R}$의 $x$좌표가 $\dfrac{2c}{1+r^2}$이므로 $\overline{\mathrm{QR}}=\dfrac{4cr}{1+r^2}$이다.
    steps:
    - {id: 21a, content: '$\lim_{r\to0+}\frac{4c}{1+r^2}=4c=3$이므로 $c=\frac34$', criteria: [2-1.M1, 2-1.M2, 2-1.A1]}
    hint_ladder:
    - 원의 방정식에 $y=rx$를 대입하자.
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        원 $C$의 방정식은 $x^2-2cx+y^2=0$이고 점 $\mathrm{Q}$의 $x$좌표를 구하기 위해 $x^2-2cx+r^2x^2=0$을 풀면 $x=\dfrac{2c}{1+r^2}$이므로 $\mathrm{Q}\left(\dfrac{2c}{1+r^2},\dfrac{2cr}{1+r^2}\right)$이다. 같은 방법으로 $\mathrm{R}\left(\dfrac{2c}{1+r^2},-\dfrac{2cr}{1+r^2}\right)$이다.
      criteria: [2-1.M1]
    - id: 21b-2
      content: |
        이때 $\overline{\mathrm{QR}}=\dfrac{4cr}{1+r^2}$이므로 $\displaystyle\lim_{r\to0+}\frac{\overline{\mathrm{QR}}}{r}=\lim_{r\to0+}\frac{4cr}{r(1+r^2)}=\lim_{r\to0+}\frac{4c}{1+r^2}=4c$이다.
      criteria: [2-1.M2]
    - id: 21b-3
      content: |
        $\displaystyle\lim_{r\to0+}\frac{\overline{\mathrm{QR}}}{r}=3$으로부터 $c=\dfrac34$이다.
      criteria: [2-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 3
      evidence: |
        점 $\mathrm{Q}$와 점 $\mathrm{R}$의 좌표를 구하기 위한 방정식($x^2-2cx+r^2x^2=0$ 등)을 올바르게 세웠다.
      depends_on: []
      implied_ok: false
      steps: [21b-1]
    - id: 2-1.M2
      mark_type: M
      points: 3
      evidence: |
        $\overline{\mathrm{QR}}=\dfrac{4cr}{1+r^2}$임을 적었다.
      depends_on: [2-1.M1]
      implied_ok: true
      steps: [21b-2]
    - id: 2-1.A1
      mark_type: A
      points: 4
      evidence: |
        답 $c=\dfrac34$를 올바르게 구했다.
      depends_on: [2-1.M2]
      steps: [21b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
