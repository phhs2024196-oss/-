      content: |
        $\displaystyle\lim_{r\to0+}h(r)=2c$이다.
      criteria: [2-2.M2]
    - id: 22b-3
      content: |
        $c=\left(\dfrac12\right)^n$이므로 $2c=\left(\dfrac12\right)^{n-1}=\dfrac1{2048}$이다. 따라서 $n=12$이다.
      criteria: [2-2.A1]
