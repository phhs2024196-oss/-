    key_idea: 직선 $\mathrm{PQ}$의 $x$절편 $h(r)=\dfrac{2c}{1+r^2-2c\sqrt r}\to2c$이다.
    steps:
    - {id: 22a, content: '$2c=\left(\frac12\right)^{n-1}=\frac1{2048}$이므로 $n=12$', criteria: [2-2.M1, 2-2.M2, 2-2.A1]}
    hint_ladder:
    - (1)에서 구한 $\mathrm{Q}$와 $\mathrm{P}(0,\sqrt r)$을 지나는 직선의 $x$절편을 구하자.
