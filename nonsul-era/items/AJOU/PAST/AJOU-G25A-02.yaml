- id: '3'
  stem: |
    [문제 2-3] (10점) $f(t_1)=f(t_2)$인 서로 다른 실수 $t_1$과 $t_2$가 존재하는 모든 $p$의 값의 범위를 구하라.
    (단, $1<t_1<t_2$)
  points: 10
  depends_on: ['1-2']
  answer: {kind: set, value: 'Interval.open(1/4, 3/8)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f'(t)=2t(2t^2-6t+4p+3)$의 두 양의 근 $\alpha<\beta$가 있으면($p<\dfrac38$) $\beta>1$이라 $t>1$에서 감소 구간이 생기고, $p\ge\dfrac38$이면 $t>1$에서 증가한다.
    steps:
    - {id: 3a, content: '$\frac14<p<\frac38$', criteria: [3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - $t>1$에서 $f$가 단조이면 같은 값을 두 번 가질 수 없다.
    - $f'(t)$의 이차식 부분의 판별식을 보자.
  - id: S3-B
    audience: B
    source_flow: 모범답안 p.8–9
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(t)=t^2(t^2-4t+4p+3)$이고 $f'(t)=2t(2t^2-6t+4p+3)$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $p<\dfrac38$이면 $f'(t)=4t\left(t-\dfrac{3-\sqrt{3-8p}}{2}\right)\left(t-\dfrac{3+\sqrt{3-8p}}{2}\right)$이다. $\alpha=\dfrac{3-\sqrt{3-8p}}{2}$, $\beta=\dfrac{3+\sqrt{3-8p}}{2}$라 하면 함수 $f(t)$의 증가와 감소를 나타낸 표는 다음과 같다.
        $t<0$: $f'<0$ 감소, $t=0$: $f'=0$, $0<t<\alpha$: $f'>0$ 증가, $t=\alpha$: $f'=0$, $\alpha<t<\beta$: $f'<0$ 감소, $t=\beta$: $f'=0$, $t>\beta$: $f'>0$ 증가.
        $\beta>1$이므로 사차함수의 그래프의 개형에 의해 $f(t_1)=f(t_2)$인 서로 다른 실수 $t_1$과 $t_2$가 존재한다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        $p\ge\dfrac38$이면 $t>1$에서 $f'(t)>0$이므로 사차함수의 그래프의 개형에 의해 $f(t_1)=f(t_2)$인 서로 다른 실수 $t_1$과 $t_2$가 존재하지 않는다. 따라서 $\dfrac14<p<\dfrac38$이다.
      criteria: [3.A1]
    - id: 3b-4
      content: |
        (보충) $\dfrac14<p<\dfrac38$이면 $0<3-8p<1$이므로 $1<\alpha<\dfrac32<\beta<2$이다. 따라서 $1<t<\infty$에서 $f$는 증가 → 감소($\alpha<t<\beta$) → 증가하므로 $f(\alpha)$보다 약간 작은 값을 $(1,\alpha)$와 $(\alpha,\beta)$에서 한 번씩 갖는다.
      criteria: [3.M2]
