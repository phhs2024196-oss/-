stimuli:
- label: 가
  body: |
    점 $\mathrm{P}(0,p)$를 중심으로 하고 반지름의 길이가 1인 원을 $C$라 하고, 원 $C$가 곡선 $y=x^2-1$과 만나지 않는다고 하자. (단, $p>\dfrac14$)
    원 $C$ 위의 점 $\mathrm{X}(a,b)$에 대하여 $a>0$이고 $p-1<b<p$이다. 원 $C$ 위의 점 $\mathrm{X}$에서의 접선과 곡선 $y=x^2-1$의 서로 다른 두 교점을 각각 $\mathrm{A}$, $\mathrm{B}$라 하고, 직선 $\mathrm{AB}$가 $y$축과 이루는 예각의 크기를 $\theta$라 하자. 이때 $t=\dfrac1{\sin\theta}$이라 두고 $\overline{\mathrm{AB}}^2$을 $t$에 대한 식으로 나타낸 것을 $f(t)$라 하자. 【그림 2】는 $p=1$일 때 원 $C$와 선분 $\mathrm{AB}$를 나타낸 예이다.

    [그림 2: $p=1$일 때. 중심 $(0,1)$, 반지름 1인 원 $C$(점선, 원점을 지남)와 포물선 $y=x^2-1$. 원의 오른쪽 아래 사분원 위의 점 $\mathrm{X}$(제1사분면)에서 그은 접선이 포물선과 왼쪽 아래 점 $\mathrm{A}$(제3사분면, 꼭짓점 근처)와 오른쪽 위 점 $\mathrm{B}$에서 만난다. 직선 $\mathrm{AB}$와 $y$축이 이루는 예각 $\theta$가 $y$축 아래쪽에 표시되어 있다. 원 위의 원점과 점 $(1,1)$은 빈 점으로 표시.]
    [판독확인: 문제지에는 제시문 라벨 (가)가 없음 — DB 구조상 '가'로 둠]

stem: |
  [문항 2]【제시문】을 읽고 물음에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 2-1] (20점) 다음 물음에 답하라.
    (1) (8점) 점 $\mathrm{X}$의 좌표를 $\theta$와 $p$에 관한 식으로 나타내라.
  points: 8
  depends_on: []
  answer: {kind: expression, value: '(cos(theta), p - sin(theta))', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 직선 $\mathrm{AB}$와 $y$축의 교점 $\mathrm{T}$에 대해 $\angle\mathrm{TPX}=\dfrac{\pi}{2}-\theta$이다.
    steps:
    - {id: 11a, content: '$a=\cos\theta$, $b=p-\sin\theta$', criteria: [1-1.B1, 1-1.B2]}
    hint_ladder:
    - 반지름 $\mathrm{PX}$는 접선 $\mathrm{AB}$와 수직이다. $\mathrm{PX}$와 $y$축이 이루는 각은?
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        직선 $\mathrm{AB}$와 $y$축의 교점을 점 $\mathrm{T}$라 하고, 점 $\mathrm{X}$에서 $y$축에 내린 수선의 발을 $\mathrm{H}$라 하면 $\angle\mathrm{TPX}=\dfrac{\pi}{2}-\theta$이므로 $\overline{\mathrm{HX}}=\sin\left(\dfrac{\pi}{2}-\theta\right)=\cos\theta$, $\overline{\mathrm{HP}}=\cos\left(\dfrac{\pi}{2}-\theta\right)=\sin\theta$이다.
      criteria: [1-1.B1]
    - id: 11b-2
      content: |
        $a=\overline{\mathrm{HX}}$, $b=\overline{\mathrm{OP}}-\overline{\mathrm{HP}}$이므로 $a=\cos\theta$, $b=p-\sin\theta$이다.
      criteria: [1-1.B1, 1-1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.B1
      mark_type: B
      points: 4
      evidence: |
        $a=\cos\theta$를 올바르게 구했다.
      depends_on: []
      steps: [11b-1, 11b-2]
    - id: 1-1.B2
      mark_type: B
      points: 4
      evidence: |
        $b=p-\sin\theta$를 올바르게 구했다.
      depends_on: []
      steps: [11b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) (12점) $f(t)$를 구하라.
  points: 12
  depends_on: ['1-1']
  answer: {kind: expression, value: 't**2*(t**2 - 4*t + 4*p + 3)', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 접선과 포물선의 교점 $x$좌표 $\alpha,\beta$에 대해 $(\alpha+\beta)^2=t^2-1$, $\alpha\beta=t-1-p$를 쓰고 $\overline{\mathrm{AB}}^2=(\alpha-\beta)^2\{1+(\alpha+\beta)^2\}$.
    steps:
    - {id: 12a, content: '$f(t)=(t^2-4t+4p+3)\cdot t^2$', criteria: [1-2.M1, 1-2.M2, 1-2.A1]}
    hint_ladder:
    - 접선의 기울기는 $\dfrac{\cos\theta}{\sin\theta}$이다.
    - 두 교점의 $y$좌표 차는 $\alpha^2-\beta^2$이다.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $0<\theta<\dfrac{\pi}{2}$이므로 $t=\dfrac1{\sin\theta}>1$이다. 점 $\mathrm{P}(0,p)$, 점 $\mathrm{X}(\cos\theta,p-\sin\theta)$에 대하여 점 $\mathrm{X}$에서 원 $C$에 접하는 접선의 방정식은 $y=\dfrac{\cos\theta}{\sin\theta}x-\dfrac1{\sin\theta}+p$이다.
      criteria: [1-2.M1]
    - id: 12b-2
      content: |
        이 접선이 곡선 $y=x^2-1$과 서로 다른 두 점에서 만나므로 방정식 $(\sin\theta)x^2-(\cos\theta)x-(1+p)\sin\theta+1=0$은 서로 다른 두 실근 $\alpha$, $\beta$를 갖는다. 근과 계수의 관계를 이용하면
        $(\alpha+\beta)^2=\dfrac{\cos^2\theta}{\sin^2\theta}=\dfrac{1-\sin^2\theta}{\sin^2\theta}=t^2-1$, $\alpha\beta=\dfrac1{\sin\theta}-(1+p)=t-1-p$이다.
      criteria: [1-2.M2]
    - id: 12b-3
      content: |
        $(\alpha-\beta)^2=(\alpha+\beta)^2-4\alpha\beta=t^2-1-4(t-1-p)=t^2-4t+4p+3$이므로
        $f(t)=\overline{\mathrm{AB}}^2=(\alpha-\beta)^2+(\alpha^2-\beta^2)^2=(\alpha-\beta)^2\{1+(\alpha+\beta)^2\}=t^2(t^2-4t+4p+3)$이다.
      criteria: [1-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 4
      evidence: |
        점 $\mathrm{X}$에서 원 $C$에 접하는 접선의 방정식 $y=\dfrac{\cos\theta}{\sin\theta}x-\dfrac1{\sin\theta}+p$를 올바르게 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1-1.B1, 1-1.B2], max_points: 4}
      steps: [12b-1]
    - id: 1-2.M2
      mark_type: M
      points: 4
      evidence: |
        $(\alpha+\beta)^2=\dfrac{\cos^2\theta}{\sin^2\theta}=t^2-1$, $\alpha\beta=\dfrac1{\sin\theta}-(1+p)=t-1-p$임을 적었다.
      depends_on: [1-2.M1]
      implied_ok: false
      steps: [12b-2]
    - id: 1-2.A1
      mark_type: A
      points: 4
      evidence: |
        $f(t)=t^2(t^2-4t+4p+3)$을 올바르게 구했다.
      depends_on: [1-2.M2]
      steps: [12b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 2-2] (20점) $f(t)=12$일 때, 다음 물음에 답하라.
    (1) (10점) $p=1$일 때, 점 $\mathrm{X}$의 좌표를 구하라.
  points: 10
  depends_on: ['1-1', '1-2']
  answer: {kind: expression, value: '(sqrt(3)/2, 1/2)', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $t^4-4t^3+7t^2-12=(t-2)(t+1)(t^2+3t+3)$이고 $t>1$이므로 $t=2$, $\theta=\dfrac{\pi}{6}$.
    steps:
    - {id: 21a, content: '$t=2\Rightarrow\theta=\frac{\pi}{6}\Rightarrow\mathrm{X}\left(\frac{\sqrt3}{2},\frac12\right)$', criteria: [2-1.M1, 2-1.A1, 2-1.A2]}
    hint_ladder:
    - $t>1$인 근만 찾으면 된다. 정수근부터 시험해 보자.
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $p=1$, $f(t)=12$에 의해 $f(t)=t^2(t^2-4t+7)=12$이고, 이를 정리하면 $t^4-4t^3+7t^2-12=0$, 즉 $(t-2)(t+1)(t^2+3t+3)=0$이다.
      criteria: [2-1.M1]
    - id: 21b-2
      content: |
        $t>1$, $t^2+3t+3=\left(t+\dfrac32\right)^2+\dfrac34>0$이므로 $t=2$이다. $t=\dfrac1{\sin\theta}=2$에서 $\sin\theta=\dfrac12$이고 $\theta=\dfrac{\pi}{6}$이다.
      criteria: [2-1.A1]
    - id: 21b-3
      content: |
        [문제 2-1] (1)에 의하여 점 $\mathrm{X}$의 좌표는 $\left(\dfrac{\sqrt3}{2},\dfrac12\right)$이다.
      criteria: [2-1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 2
      evidence: |
        풀어야 하는 방정식이 $t^4-4t^3+7t^2-12=0$임을 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1-2.A1], max_points: 2}
      steps: [21b-1]
    - id: 2-1.A1
      mark_type: A
      points: 4
      evidence: |
        $\theta=\dfrac{\pi}{6}$ 또는 $t=2$를 구했다.
      depends_on: [2-1.M1]
      steps: [21b-2]
    - id: 2-1.A2
      mark_type: A
      points: 4
      evidence: |
        점 $\mathrm{X}$의 좌표 $\left(\dfrac{\sqrt3}{2},\dfrac12\right)$를 올바르게 구했다.
      depends_on: [2-1.M1, 2-1.A1]
      steps: [21b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    (2) (10점) 곡선 $y=x^2-1$ 위의 점 $\mathrm{Q}\left(\dfrac12,-\dfrac34\right)$에서의 접선과 직선 $\mathrm{AB}$가 평행할 때 $p$의 값을 구하라.
  points: 10
  depends_on: ['1-2']
  answer: {kind: value, value: '1/4 + sqrt(2)', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: 기울기 $\dfrac{\cos\theta}{\sin\theta}=1$이므로 $\theta=\dfrac{\pi}{4}$, $t=\sqrt2$를 $f(t)=12$에 대입한다.
    steps:
    - {id: 22a, content: '$2(2-4\sqrt2+3+4p)=12\Rightarrow p=\frac14+\sqrt2$', criteria: [2-2.M1, 2-2.A1, 2-2.A2]}
    hint_ladder:
    - 직선 $\mathrm{AB}$의 기울기를 $\theta$로 나타내 보자.
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        점 $\mathrm{Q}\left(\dfrac12,-\dfrac34\right)$에서의 $y=x^2-1$에 대한 접선의 기울기가 $1$이다.
      criteria: [2-2.M1]
    - id: 22b-2
      content: |
        직선 $\mathrm{AB}$의 기울기는 $\dfrac{\cos\theta}{\sin\theta}$이고, 점 $\mathrm{Q}$에서의 접선과 직선 $\mathrm{AB}$가 평행하므로 $\dfrac{\cos\theta}{\sin\theta}=1$, $\theta=\dfrac{\pi}{4}$이다. $\theta=\dfrac{\pi}{4}$일 때 $t=\sqrt2$이다.
      criteria: [2-2.A1]
    - id: 22b-3
      content: |
        $f(\sqrt2)=2(2-4\sqrt2+3+4p)=12$에서 $p=\dfrac14+\sqrt2$이다.
      criteria: [2-2.A2]
