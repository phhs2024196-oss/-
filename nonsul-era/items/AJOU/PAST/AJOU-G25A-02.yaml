intent: |
  [문제 2-1] 삼각함수의 정의를 이용하여 좌표평면 위의 점과 점 사이의 거리에 대한 문제를 해결할 수 있는지를 평가하는 문제이다. [문제 2-2] 다항함수의 미분을 이용하여 두 직선 사이의 위치관계에 대한 문제를 해결할 수 있는지를 평가하는 문제이다. [문제 2-3] 함수의 그래프의 개형에 대한 문제를 해결할 수 있는지를 평가하는 문제이다. (보고서 문항카드 원문은 [문제 1-1]~[1-3]으로 표기되어 있고 「이용하에」 오타가 있음)
key_idea: |
  $\mathrm{X}(\cos\theta,p-\sin\theta)$에서의 접선 $y=\dfrac{\cos\theta}{\sin\theta}x-\dfrac1{\sin\theta}+p$와 포물선의 교점 $x$좌표 $\alpha,\beta$에 근과 계수의 관계를 쓰면 $\overline{\mathrm{AB}}^2=(\alpha-\beta)^2\{1+(\alpha+\beta)^2\}=t^2(t^2-4t+4p+3)$이다.
stuck: |
  $\theta$를 접선의 기울기로 바꾸는 것($\angle\mathrm{TPX}=\dfrac{\pi}{2}-\theta$)과 $\overline{\mathrm{AB}}^2$을 근과 계수의 관계로 $t$만의 식으로 정리하는 것, (2-3)에서 사차함수 $f$의 개형을 $t>1$에 제한해 판단하는 것
