- id: '2-2'
  stem: |
    (2) (10점) 함수 $h(x)=x^3$일 때 모든 양의 실수 $a$에 대하여 $S$의 넓이와 $T$의 넓이가 같다. 실수 $k$의 값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '5*4**(1/3)/12', equivalents: ['5/(6*2**(1/3))'], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: 직사각형 $[0,a]\times[0,2a^3]$에서 $3w_1+w_2=2a^4$이고, $w_2$를 $\beta=ak\sqrt[3]2$로 다시 계산해 비교한다.
    steps:
    - {id: 22a, content: '$\frac54a^4+\frac12a^4k\sqrt[3]2=2a^4k\sqrt[3]2\Rightarrow k=\frac{5\sqrt[3]4}{12}$', criteria: [2-2.B1, 2-2.M1, 2-2.A1]}
    hint_ladder:
    - $y=x^3$, $y=2x^3$, $y=\dfrac1{k^3}x^3$ 아래·왼쪽 넓이를 직사각형으로 묶어 보자.
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        곡선 $y=x^3$, 직선 $x=a$, $x$축으로 둘러싸인 도형을 $W_1$, 곡선 $y=\dfrac1{k^3}x^3$, 직선 $y=2a^3$, $y$축으로 둘러싸인 도형을 $W_2$라 하자. 도형 $W_1$과 $W_2$의 넓이를 각각 $w_1$, $w_2$라 쓰자.
        도형 $S$의 넓이는 $\displaystyle\int_0^a(2x^3-x^3)\,dx=\int_0^ax^3\,dx=w_1$이 되어 $w_1=\dfrac{a^4}{4}$이다.
      criteria: [2-2.M1]
    - id: 22b-2
      content: |
        도형 $S$의 넓이와 $T$의 넓이가 같으므로 네 직선 $x=a$, $y=2a^3$, $x=0$, $y=0$으로 둘러싸인 직사각형의 넓이를 생각하면 $3w_1+w_2=2a^4$이다. 따라서 $w_2=\dfrac54a^4$이다.
      criteria: [2-2.M1]
    - id: 22b-3
      content: |
        곡선 $y=\dfrac1{k^3}x^3$과 직선 $y=2a^3$의 교점의 $x$좌표를 $\beta$라 하면, $\displaystyle w_2+\int_0^{\beta}\frac1{k^3}x^3\,dx=2a^3\beta$가 성립한다. 한편 $\beta=ak\sqrt[3]2$이다.
      criteria: [2-2.B1]
    - id: 22b-4
      content: |
        $w_2=\dfrac54a^4$으로부터 $\dfrac54a^4+\dfrac{\beta^4}{4k^3}=2a^3\beta$이고 $\dfrac54a^4+\dfrac12a^4k\sqrt[3]2=2a^4k\sqrt[3]2$이다. $a>0$이므로 양변에 $a^4$을 나누어 $k$를 구하면 $k=\dfrac5{6\sqrt[3]2}=\dfrac{5\sqrt[3]4}{12}$이다.
      criteria: [2-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
