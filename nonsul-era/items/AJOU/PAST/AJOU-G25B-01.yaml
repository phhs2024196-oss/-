stimuli:
- label: 가
  body: |
    (가) 함수 $F(x)$는 【그림 1】과 같이 $-1\le x<1$일 때 $F(x)=\lvert x\rvert$이고 모든 실수 $x$에 대하여 $F(x+2)=F(x)$이다.

    [그림 1: $y=F(x)$의 그래프. 원점, $x=\pm2$ 등 짝수에서 $0$, 홀수에서 $1$인 톱니(삼각파) 모양. $x$축에 $-2$, $\mathrm{O}$, $2$가 표시됨.]
- label: 나
  body: |
    (나) <조건>을 만족하는 두 연속함수 $f(x)$, $g(x)$를 생각하자.
    < 조건 >
    ① $f(0)=g(0)=0$이다.
    ② 방정식 $f(x)=g(x)$의 서로 다른 두 양의 실근 $\alpha$, $\beta$가 존재하고, 열린구간 $(0,\alpha)$에서 $f(x)>g(x)$이고 열린구간 $(\alpha,\beta)$에서 $f(x)<g(x)$이다. (단, $\alpha<\beta$)

    두 함수 $y=f(x)$, $y=g(x)$의 그래프와 두 직선 $x=0$, $x=\alpha$로 둘러싸인 도형을 $R_1$, 두 함수 $y=f(x)$, $y=g(x)$의 그래프와 두 직선 $x=\alpha$, $x=\beta$로 둘러싸인 도형을 $R_2$라 하고, 도형 $R_1$과 $R_2$의 넓이를 각각 $r_1$, $r_2$라 하자. 【그림 2】는 $f(x)=(x-1)^3+1$, $g(x)=x$일 때 도형 $R_1$과 $R_2$를 나타낸다.

    [그림 2: $y=f(x)=(x-1)^3+1$과 $y=g(x)=x$의 그래프가 원점, $(1,1)$, $(2,2)$에서 만나고, $0<x<1$에서 곡선이 직선 위에 있어 생기는 영역 $R_1$, $1<x<2$에서 곡선이 직선 아래에 있어 생기는 영역 $R_2$가 색칠되어 있다.]
- label: 다
  body: |
    (다) 연속함수 $h(x)$가 $h(0)=0$이고 구간 $[0,\infty)$에서 증가한다고 하자. 양의 실수 $a$에 대하여 두 함수 $y=h(x)$, $y=2h(x)$의 그래프와 직선 $x=a$로 둘러싸인 도형을 $S$라 하고, $0<k<\dfrac{\sqrt[3]{4}}{2}$인 실수 $k$에 대하여 두 함수 $y=\dfrac1{k^3}h(x)$, $y=2h(x)$의 그래프와 직선 $y=2h(a)$로 둘러싸인 도형을 $T$라 하자. 【그림 3】은 $h(x)=x^2$, $k=\dfrac12$, $a=1$일 때 도형 $S$와 $T$를 나타낸다.

    [그림 3: $y=x^2$, $y=2x^2$, $y=8x^2$의 그래프. $y=x^2$과 $y=2x^2$ 사이, $0\le x\le1$ 부분이 $S$(옅은 색), $y=8x^2$과 $y=2x^2$ 사이, $0\le y\le2$ 부분이 $T$(진한 색). $y=2$의 수평 점선과 $x=1$의 수직 점선이 그려져 있다.]

stem: |
  [문항 1]【제시문】을 읽고 물음에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (30점) 제시문 (가)와 (나)를 읽고 다음 물음에 답하라.
    (1) (10점) 함수 $y=(F(x))^2$의 그래프와 직선 $y=x-c$의 교점의 개수가 2인 상수 $c$의 값을 모두 구하라. (단, $0\le c<2$)
  points: 10
  depends_on: []
  answer: {kind: set, value: 'FiniteSet(0, 1/4)', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $c=0$이면 $(0,0)$, $(1,1)$에서 만나고, $0<c<2$에서는 $(0,1)$에서 $y=x^2$에 접할 때($c=\dfrac14$)만 2개다.
    steps:
    - {id: 11a, content: '$c=0$, $c=\frac14$', criteria: [1-1.B1, 1-1.M1, 1-1.R1]}
    hint_ladder:
    - $-1\le x\le1$에서 $(F(x))^2=x^2$이고 주기가 2이다. 직선은 기울기 1로 고정되어 있다.
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $-1\le x\le1$일 때 $(F(x))^2=x^2$이다. 따라서 $c=0$일 때, 함수 $y=(F(x))^2$의 그래프와 직선 $y=x-c$는 두 점에서 만난다.
      criteria: [1-1.B1]
    - id: 11b-2
      content: |
        $0<c<2$라 하자. 교점의 개수가 2가 되려면, 열린구간 $(0,1)$에서 함수 $y=x^2$의 그래프와 직선 $y=x-c$가 접해야 한다. 그 접점을 $(a,a^2)$이라 두면 접선의 방정식은 $y=2a(x-a)+a^2$이므로 $a=\dfrac12$이고, 접선의 방정식은 $y=x-\dfrac14$이다. 따라서 $c=\dfrac14$이다.
      criteria: [1-1.M1]
    - id: 11b-3
      content: |
        $0<c<\dfrac14$일 때 함수 $y=(F(x))^2$의 그래프와 직선 $y=x-c$는 세 점에서 만나고, $\dfrac14<c<2$일 때 한 점에서 만난다. 따라서 답은 $0$, $\dfrac14$이다.
      criteria: [1-1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.B1
      mark_type: B
      points: 3
      evidence: |
        $c=0$일 때 함수의 그래프(교점 2개)를 관찰했다.
      depends_on: []
      steps: [11b-1]
    - id: 1-1.M1
      mark_type: M
      points: 4
      evidence: |
        $c=\dfrac14$일 때 함수의 그래프(접함)를 관찰했다.
      depends_on: []
      implied_ok: false
      steps: [11b-2]
    - id: 1-1.R1
      mark_type: R
      points: 3
      evidence: |
        $\dfrac14<c<2$인 경우와 $0<c<\dfrac14$인 경우의 교점 개수를 관찰했다.
      depends_on: []
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) (10점) <조건>을 만족하는 함수 $y=F(x)$와 일차함수 $y=bx$에 대하여 극한 $\displaystyle\lim_{b\to0+}\frac{b^mr_1}{r_2}$이 0이 아닌 실수가 되는 자연수 $m$의 값과 그때의 극한값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'm = 2; limit = 1/4', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 교점 $\alpha=\dfrac2{1+b}$, $\beta=\dfrac2{1-b}$이고 $r_1=\dfrac{1-b}{1+b}$, $r_2=\dfrac{4b^2}{1-b^2}$이므로 $\dfrac{r_1}{r_2}\sim\dfrac1{4b^2}$.
    steps:
    - {id: 12a, content: '$\frac{b^mr_1}{r_2}=\frac{b^{m-2}(1-b)^2}{4}\Rightarrow m=2$, 극한 $\frac14$', criteria: [1-2.M1, 1-2.A1, 1-2.A2]}
    hint_ladder:
    - <조건>이 성립하려면 $b$의 범위는? 교점은 $[0,3]$ 안에 있다.
    - 넓이는 삼각형들의 넓이로 계산할 수 있다.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        함수 $y=F(x)$와 $y=bx$가 <조건>을 만족하므로, $0<b<\dfrac13$이다. 함수 $y=F(x)$의 그래프와 직선 $y=bx$의 원점이 아닌 교점 중 $x$좌표가 가장 작은 두 점의 좌표는 $\left(\dfrac2{1+b},\dfrac{2b}{1+b}\right)$와 $\left(\dfrac2{1-b},\dfrac{2b}{1-b}\right)$이다.
      criteria: [1-2.M1]
    - id: 12b-2
      content: |
        닫힌구간 $[0,3]$에서 $y=F(x)$의 그래프와 직선 $y=bx$, $x$축에 의하여 생기는 여러 삼각형의 넓이로부터 $r_1=\dfrac{1-b}{1+b}$, $r_2=\dfrac{4b^2}{1-b^2}$임을 알 수 있다.
      criteria: [1-2.M1]
    - id: 12b-3
      content: |
        따라서 $\displaystyle\lim_{b\to0+}\frac{b^mr_1}{r_2}=\lim_{b\to0+}\frac{b^m(1-b)^2}{4b^2}=\lim_{b\to0+}\frac{b^{m-2}(1-b)^2}{4}$이므로 이 극한이 0이 아닌 실수를 극한값으로 가지려면, $m=2$이다.
      criteria: [1-2.A1]
    - id: 12b-4
      content: |
        이 때, $\displaystyle\lim_{b\to0+}\frac{b^2r_1}{r_2}=\frac14$이다.
      criteria: [1-2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 4
      evidence: |
        $r_1=\dfrac{1-b}{1+b}$, $r_2=\dfrac{4b^2}{1-b^2}$를 올바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [12b-1, 12b-2]
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        $m=2$임을 밝혔다.
      depends_on: [1-2.M1]
      steps: [12b-3]
    - id: 1-2.A2
      mark_type: A
      points: 3
      evidence: |
        극한값의 결과가 $\dfrac14$임을 밝혔다.
      depends_on: [1-2.M1, 1-2.A1]
      steps: [12b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    (3) (10점) <조건>을 만족하는 두 함수 $y=x\left(x-\dfrac12\right)^2$과 $y=p^2x$에 대하여 $r_1=r_2$인 $p$의 값을 구하라.
    (단, $0<p<\dfrac14$)
  points: 10
  depends_on: []
  answer: {kind: value, value: '1/6', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 교점 $x=\dfrac12\pm p$이고 $r_1=r_2\iff\displaystyle\int_0^{\frac12+p}\left(x\left(x-\tfrac12\right)^2-p^2x\right)dx=0$.
    steps:
    - {id: 13a, content: '$\frac1{12}\left(\frac12+p\right)^3\left(3\left(\frac12+p\right)-4+6\left(\frac12-p\right)\right)=0\Rightarrow p=\frac16$', criteria: [1-3.B1, 1-3.M1, 1-3.A1]}
    hint_ladder:
    - 두 넓이가 같으면 부호 있는 적분은 어떻게 되는가?
  - id: S13-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        두 곡선 $y=x\left(x-\dfrac12\right)^2$, $y=p^2x$의 원점이 아닌 두 교점의 $x$좌표는 방정식 $x\left(x-\dfrac12\right)^2-p^2x=0$의 서로 다른 두 양의 실근이다. 따라서 두 교점의 $x$좌표는 $\dfrac12-p$, $\dfrac12+p$이다.
      criteria: [1-3.B1]
    - id: 13b-2
      content: |
        $r_1=r_2$이므로 $\displaystyle\int_0^{\frac12-p}\left(x\left(x-\tfrac12\right)^2-p^2x\right)dx=\int_{\frac12-p}^{\frac12+p}\left(p^2x-x\left(x-\tfrac12\right)^2\right)dx$이고 이를 정리하면 $\displaystyle\int_0^{\frac12+p}\left(x\left(x-\tfrac12\right)^2-p^2x\right)dx=0$이다.
      criteria: [1-3.M1]
    - id: 13b-3
      content: |
        즉, $\displaystyle\int_0^{\frac12+p}\left(x\left(x-\tfrac12\right)^2-p^2x\right)dx=\frac14\left(\frac12+p\right)^4-\frac13\left(\frac12+p\right)^3+\frac12\left(\frac14-p^2\right)\left(\frac12+p\right)^2$
        $=\dfrac1{12}\left(\dfrac12+p\right)^3\left(3\left(\dfrac12+p\right)-4+6\left(\dfrac12-p\right)\right)=0$이다.
        $0<p<\dfrac14$이므로 $3\left(\dfrac12+p\right)-4+6\left(\dfrac12-p\right)=0$이고 이를 풀면 $p=\dfrac16$이다.
      criteria: [1-3.A1]
