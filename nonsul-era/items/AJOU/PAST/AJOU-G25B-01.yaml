intent: |
  [문제 1-1] 이차함수의 그래프와 직선의 위치관계를 이해하고 곡선과 곡선으로 둘러싸인 도형의 넓이를 구할 수 있는지, 함수의 극한에 대한 성질을 이해하고, 함수의 극한값을 구할 수 있는지를 평가하는 문제이다. [문제 1-2] 치환적분법과 부분적분법을 활용하여 곡선과 곡선으로 둘러싸인 도형의 넓이를 구할 수 있는지를 평가하는 문제이다. (보고서 문항카드 원문)
key_idea: |
  (1-1)(1) $y=x-c$가 $y=x^2$에 접하는 $c=\dfrac14$와 원점을 지나는 $c=0$에서만 교점이 2개. (1-1)(3) $r_1=r_2\iff\displaystyle\int_0^{\beta}(f-g)\,dx=0$. (1-2)(2) 넓이를 $y$축 방향으로 보아 $3w_1+w_2=2a^4$.
