stimuli:
- label: 가
  body: |
    (가) 밑면의 반지름의 길이가 $r=10$이고 높이가 $h=30$인 원기둥의 옆면을 【그림 4】와 같이 자르면 밑변의 길이가 $20\pi$, 높이가 $30$인 평행사변형을 얻는다. 이때 평행사변형의 내각 중 크지 않은 각의 크기를 $\theta$라 하자. 이 평행사변형과 반지름의 길이가 $r$인 두 밑면을 【그림 5】와 같이 가로의 길이가 $L$이고 세로의 길이가 $30$인 직사각형 $R$에 서로 포개지는 부분이 없도록 그려 넣었다고 하자. 각 원은 옆면을 잘라 얻은 평행사변형의 한 변과 접하고 직사각형 $R$의 두 변과 접하도록 한다.

    [그림 4: 반지름 $r$, 높이 $h$인 원기둥의 옆면에 비스듬한 절단선이 그려져 있다.]
    [그림 5: 가로 $L$, 세로 $h$인 직사각형 안에 왼쪽 아래 구석에 반지름 $r$인 원(왼쪽 변·아랫변에 접함), 그 오른쪽에 오른쪽 아래로 기운 평행사변형(왼쪽 빗변이 원에 접함), 오른쪽 위 구석에 원(오른쪽 변·윗변에 접하고 평행사변형의 오른쪽 빗변에 접함). 평행사변형 오른쪽 아래 꼭짓점에 각 $\theta$ 표시.]

    【그림 5】를 【그림 6】과 같이 좌표평면 위에 나타내고, 직사각형 $R$의 네 꼭짓점을 각각 $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$, $\mathrm{D}$라 하고 평행사변형의 네 꼭짓점을 각각 $\mathrm{E}$, $\mathrm{F}$, $\mathrm{G}$, $\mathrm{H}$라 하자.

    [그림 6: 직사각형의 왼쪽 위 $\mathrm{A}$, 왼쪽 아래 $\mathrm{B}$, 오른쪽 아래 $\mathrm{C}$, 오른쪽 위 $\mathrm{D}$. 평행사변형은 윗변 위의 $\mathrm{E}$(A 바로 오른쪽)·$\mathrm{H}$, 아랫변 위의 $\mathrm{F}$·$\mathrm{G}$(C 바로 왼쪽)를 꼭짓점으로 하고 빗변 $\mathrm{EF}$, $\mathrm{HG}$는 오른쪽 아래로 기운다. 왼쪽 원의 중심이 원점 $\mathrm{O}$이며 원은 $\mathrm{AB}$, $\mathrm{BC}$, $\mathrm{EF}$에 접한다. 오른쪽 원은 $\mathrm{AD}$, $\mathrm{CD}$, $\mathrm{HG}$에 접한다.]
- label: 나
  body: |
    (나) 두 자연수 $m$과 $n$에 대하여 한 변의 길이가 $\dfrac{2\sqrt3}{3}$인 정육각형을 【그림 7】과 같이 가로 방향으로 $n$개씩 $(2m-1)$개의 층이 있도록 빈틈없이 '벌집 모양'으로 그린 그림이 있다. 이 그림을 모든 정육각형의 각 꼭짓점의 $x$좌표와 $y$좌표가 각각 음이 아닌 실수가 되도록 좌표평면 위에 나타냈다. 이때 1층 맨 왼쪽에 있는 정육각형의 한 꼭짓점의 좌표가 $(1,0)$이고 한 변은 $y$축 위에 있도록 한다. 【그림 8】은 $n=6$이고 $m=2$일 때의 '벌집 모양' 그림을 좌표평면 위에 나타낸 예이다.

    [그림 7: 위아래로 뾰족한 정육각형들이 한 층에 $n$개씩 가로로 붙어 있고, 위층은 반 칸씩 엇갈려 쌓여 1층, 2층, …, $(2m-2)$층, $(2m-1)$층을 이룬다.]
    [그림 8: $n=6$, $m=2$인 3개 층. 1층은 $x\in[0,12]$에 6개(맨 왼쪽 정육각형의 아래 꼭짓점 $(1,0)$, 왼쪽 변은 $y$축 위), 2층은 오른쪽으로 1만큼 엇갈려 $x\in[1,13]$에 6개, 3층은 1층과 같은 위치. 직선 $x=8$과 $y=5$가 그려져 있고, 그 안에 완전히 들어가는 1층 4개, 2층 3개가 색칠되어 있다.]

    두 자연수 $k$와 $\ell$에 대하여 모든 꼭짓점의 $x$좌표가 닫힌구간 $[0,k]$에 속하고 $y$좌표가 닫힌구간 $[0,\ell]$에 속하는 정육각형의 개수를 $X$라 하고, 이러한 정육각형의 층의 개수를 $M$이라 하자. 예를 들어 【그림 8】에서 $k=8$이고 $\ell=5$일 때 $X=7$이고 $M=2$이다.

stem: |
  [문항 2]【제시문】을 읽고 물음에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 2-1] (20점) 제시문 (가)를 읽고 다음 물음에 답하라.
    (1) (10점) $\theta=\dfrac{\pi}{4}$일 때, $L$의 값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '10 + 20*sqrt(2) + 20*pi', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $\theta=\dfrac{\pi}{4}$이면 $\triangle\mathrm{BFP}$가 직각이등변삼각형이고 $\overline{\mathrm{FP}}=b$, $\overline{\mathrm{BF}}=b+10=b\sqrt2$.
    steps:
    - {id: 11a, content: '$b=10+10\sqrt2$, $L=(b+10)+(b-20)+20\pi=10+20\sqrt2+20\pi$', criteria: [1-1.M1, 1-1.A1, 1-1.A2]}
    hint_ladder:
    - 원 밖의 한 점에서 그은 두 접선의 길이는 같다.
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        【그림 6】에서 왼쪽 원과 선분 $\mathrm{EF}$와의 접점을 $\mathrm{P}$라 하자. $\theta=\dfrac{\pi}{4}$이므로 $\mathrm{P}$와 원의 중심을 연결한 직선은 점 $\mathrm{B}$를 지나고 삼각형 $\mathrm{BFP}$는 직각이등변삼각형이다.
      criteria: [1-1.M1]
    - id: 11b-2
      content: |
        $\overline{\mathrm{FP}}=b$라 하자. 원과 접선의 성질에 의하여 $\overline{\mathrm{BF}}=b+10$이다. 직각이등변삼각형의 삼각비에 의하여 $b+10=b\sqrt2$이고 $b=10+10\sqrt2$이다.
      criteria: [1-1.A1]
    - id: 11b-3
      content: |
        따라서 $L=\overline{\mathrm{BF}}+\overline{\mathrm{AE}}+\overline{\mathrm{FG}}=(b+10)+(b-20)+20\pi=10+20\sqrt2+20\pi$이다.
      criteria: [1-1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        $\theta=\dfrac{\pi}{4}$로부터 접선의 방정식을 올바르게 구하거나 직각이등변삼각형의 성질을 올바르게 이용했다.
      depends_on: []
      implied_ok: false
      steps: [11b-1]
    - id: 1-1.A1
      mark_type: A
      points: 4
      evidence: |
        $\overline{\mathrm{BF}}$, $\overline{\mathrm{AE}}$를 올바르게 구했다.
      depends_on: [1-1.M1]
      steps: [11b-2]
    - id: 1-1.A2
      mark_type: A
      points: 3
      evidence: |
        답 $10+20\sqrt2+20\pi$를 올바르게 구했다.
      depends_on: [1-1.M1, 1-1.A1]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) (10점) $L$의 최솟값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '10*sqrt(3) + 20*pi + 20', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $L(\theta)=\dfrac{20-10\cos\theta}{\sin\theta}+20+20\pi$, $L'(\theta)=0\iff\cos\theta=\dfrac12$.
    steps:
    - {id: 12a, content: '$L\left(\frac{\pi}{3}\right)=10\sqrt3+20\pi+20$', criteria: [1-2.M1, 1-2.A1, 1-2.A2]}
    hint_ladder:
    - 원의 중심을 원점에 두고 접점을 $\theta$로 나타내자.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.8–9
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        【그림 6】에서 왼쪽 원의 중심이 원점에 있다고 하고 이 원과 선분 $\mathrm{EF}$와의 접점을 $\mathrm{P}$라 하자. 점 $\mathrm{P}$의 좌표는 $(10\sin\theta,10\cos\theta)$이고 이 점에서 접선의 방정식은 $y=-\dfrac{\sin\theta}{\cos\theta}x+\dfrac{10}{\cos\theta}$이다. 점 $\mathrm{E}$의 좌표는 $(c,20)$이고 점 $\mathrm{F}$의 좌표를 $(b,-10)$이라 두자. 이때 두 점 $\mathrm{E}$와 $\mathrm{F}$는 이 직선 위에 있으므로 $b=\dfrac{10(1+\cos\theta)}{\sin\theta}$, $c=\dfrac{10-20\cos\theta}{\sin\theta}$를 만족한다.
      criteria: [1-2.M1]
    - id: 12b-2
      content: |
        이때 $\overline{\mathrm{BF}}=b+10$이고 $\overline{\mathrm{AE}}=10+c$이고
        $L=\overline{\mathrm{BF}}+\overline{\mathrm{AE}}+\overline{\mathrm{FG}}=b+c+20+20\pi=\dfrac{20-10\cos\theta}{\sin\theta}+20+20\pi$이다.
      criteria: [1-2.M1]
    - id: 12b-3
      content: |
        $L$의 최솟값을 구하기 위해 몫의 미분법을 이용하면
        $\dfrac{dL}{d\theta}=\dfrac{10(\sin\theta)^2-(20-10\cos\theta)\cos\theta}{(\sin\theta)^2}=\dfrac{10-20\cos\theta}{(\sin\theta)^2}$이고 $\dfrac{dL}{d\theta}=0$을 만족하면 $\cos\theta=\dfrac12$이므로 이때 $\sin\theta=\dfrac{\sqrt3}{2}$이다.
      criteria: [1-2.A1]
    - id: 12b-4
      content: |
        ($\cos\theta>\dfrac12$이면 $\dfrac{dL}{d\theta}<0$, $\cos\theta<\dfrac12$이면 $\dfrac{dL}{d\theta}>0$이므로 극소이자 최소) 따라서 구하는 $L$의 최솟값은 $10\sqrt3+20\pi+20$이다.
      criteria: [1-2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 5
      evidence: |
        $L$을 $\theta$에 대한 식 $\dfrac{20-10\cos\theta}{\sin\theta}+20+20\pi$로 올바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [12b-1, 12b-2]
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        $\theta=\dfrac{\pi}{3}$ 또는 $\cos\theta=\dfrac12$임을 밝혔다.
      depends_on: [1-2.M1]
      steps: [12b-3]
    - id: 1-2.A2
      mark_type: A
      points: 2
      evidence: |
        답 $10\sqrt3+20\pi+20$을 올바르게 구했다.
      depends_on: [1-2.M1, 1-2.A1]
      steps: [12b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 2-2] (30점) $m=n=50$일 때, 제시문 (나)를 읽고 다음 물음에 답하라. (단, $1.73<\sqrt3<1.74$)
    (1) (5점) $k=10$, $\ell=6$일 때 $X$의 값을 구하라.
  points: 5
  depends_on: []
  answer: {kind: value, value: '14', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: 층의 최고점이 $\dfrac{4\sqrt3}{3}$, $\dfrac{7\sqrt3}{3}$, $\dfrac{10\sqrt3}{3}(<6)$이므로 1~3층, 개수 $5,4,5$.
    steps:
    - {id: 21a, content: '$X=5+4+5=14$', criteria: [2-1.M1, 2-1.A1]}
    hint_ladder:
    - 홀수층과 짝수층의 가로 위치가 1만큼 엇갈려 있다.
  - id: S21-B
