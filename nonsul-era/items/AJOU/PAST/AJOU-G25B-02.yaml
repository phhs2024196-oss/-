  [문제 2-1] 삼각함수의 정의 및 삼각함수의 미분을 이용하여 함수의 그래프의 개형에 대한 문제를 해결할 수 있는지를 평가하는 문제이다. [문제 2-2] 등차수열의 성질을 이용하여 문제를 해결할 수 있는지를 평가하는 문제이다. (보고서 문항카드 원문)
key_idea: |
  (2-1) 왼쪽 원의 중심을 원점에 두고 접점 $(10\sin\theta,10\cos\theta)$에서의 접선으로 $\mathrm{E}$, $\mathrm{F}$를 구하면 $L=\dfrac{20-10\cos\theta}{\sin\theta}+20+20\pi$. (2-2) $j$층 최고점 $y$좌표 $a_j=\dfrac{4\sqrt3}{3}+(j-1)\sqrt3$은 등차수열이고, 홀수층 $\dfrac k2$개·짝수층 $\dfrac k2-1$개.
