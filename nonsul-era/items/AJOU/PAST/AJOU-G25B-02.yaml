  answer: {kind: value, value: '18', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: $a_M=M\sqrt3+\dfrac{\sqrt3}{3}\le\ell$에 $M=\dfrac{\ell}{2}+1$을 넣으면 $\ell\ge\dfrac{16\sqrt3+24}{3}\in(17,18)$.
    steps:
    - {id: 22a, content: '$\ell=18$', criteria: [2-2.M1, 2-2.M2, 2-2.A1, 2-2.A2]}
    hint_ladder:
    - 각 층의 가장 높은 꼭짓점의 $y$좌표는 어떤 수열인가?
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.9
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $j$층의 정육각형의 꼭짓점 중 $y$좌표가 가장 큰 꼭짓점의 $y$좌표를 $a_j$라고 하면 $a_{j+1}=a_j+\sqrt3$ $(j\le98)$이다. $a_1=\dfrac{4\sqrt3}{3}$이므로 $a_j=\dfrac{4\sqrt3}{3}+(j-1)\sqrt3$이다. $a_M=M\sqrt3+\dfrac{\sqrt3}{3}$이므로
      criteria: [2-2.M1]
    - id: 22b-2
      content: |
        $M\sqrt3+\dfrac{\sqrt3}{3}\le\ell$이어야 한다. $M=\dfrac{\ell}{2}+1$이므로 $\left(\dfrac{\ell}{2}+1\right)\sqrt3+\dfrac{\sqrt3}{3}\le\ell$을 풀면 $\dfrac{16\sqrt3+24}{3}\le\ell$이다.
      criteria: [2-2.M2]
    - id: 22b-3
      content: |
        $1.73<\sqrt3<1.74$로부터, $17<\dfrac{16\sqrt3+24}{3}<18$이다.
      criteria: [2-2.A1]
    - id: 22b-4
      content: |
        따라서 가장 작은 짝수 $\ell$의 값은 $18$이다. (보충: $\ell=18$이면 $a_{10}=\dfrac{31\sqrt3}{3}<18<a_{11}=\dfrac{34\sqrt3}{3}$이므로 실제로 $M=10=\dfrac{\ell}{2}+1$이다.)
      criteria: [2-2.A2]
  rubric:
