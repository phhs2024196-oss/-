stimuli:
- label: 가
  body: |
    (가) 함수 $f(t)$는 음이 아닌 모든 실수 $t$에 대하여 $f(t+2)=f(t)$를 만족하고, $0\le t<2$일 때 다음과 같이 정의된다. (단, $a>0$)
    $$f(t)=\begin{cases}a(\log_2(2-2t)-1) & \left(0\le t<\dfrac12\right)\\ (a+2)\left(t-\dfrac32\right)+2 & \left(\dfrac12\le t<\dfrac32\right)\\ -4t+8 & \left(\dfrac32\le t<2\right)\end{cases}$$
    【그림 1】은 $a=2$일 때 함수 $y=f(t)$의 그래프를 나타낸다.

    [그림 1: $a=2$일 때 $y=f(t)$의 그래프, $0\le t\le7$ 부근. $t=0$에서 $0$, $t=\dfrac12$에서 최솟값 $-2$(로그 곡선으로 아래로 볼록하게 내려감), 직선으로 올라가 $t=1$에서 $0$, $t=\dfrac32$에서 최댓값 $2$, 직선으로 내려가 $t=2$에서 $0$. 이 모양이 주기 2로 반복되며 $t$축에 $1,2,3,4,5,6$이 표시됨.]
- label: 나
  body: |
    (나) 수직선 위를 움직이는 점 $\mathrm{P}$는 $x=\dfrac12$에서 출발하여 시각 $t$에서의 위치 $x$가 $x=g(t)$이고, 시각 $t$에서의 속도 $v(t)$는 (가)에서 $a=2$일 때의 $f(t)$이다. 수직선 위를 움직이는 점 $\mathrm{Q}$는 $x=\dfrac12$에서 출발하여 시각 $t$일 때 위치가 $h(t)=mt+\dfrac12$이다. (단, $m$은 양의 상수이다.)

stem: |
  [문항 1]【제시문】을 읽고 물음에 답하라.

subparts:
- id: '1'
  stem: |
    [문제 1-1] (10점) 제시문 (가)에서 음이 아닌 모든 실수 $\beta$, $\gamma$에 대하여 $\left\lvert\displaystyle\int_\beta^\gamma f(t)\,dt\right\rvert\le2025$인 $a$의 값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3*log(2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 한 주기 적분 $\displaystyle\int_0^2f=\frac a2\left(1-\frac1{\ln2}\right)-\frac12a+1+\frac12=0$.
    steps:
    - {id: 1a, content: '$\frac{a}{2\ln2}=\frac32\Rightarrow a=3\ln2$', criteria: [1.M1, 1.B1, 1.B2, 1.B3, 1.A1]}
    hint_ladder:
    - 한 주기 적분이 0이 아니면 $\gamma$를 크게 할 때 적분은 어떻게 되는가?
  - id: S1-B
    audience: B
    source_flow: 모범답안 p.9
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x+2)=f(x)$이므로 음이 아닌 모든 실수 $\beta$, $\gamma$에 대하여 $\left\lvert\displaystyle\int_\beta^\gamma f(t)\,dt\right\rvert\le2025$이려면 $\displaystyle\int_0^2f(t)\,dt=0$이어야 한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        각 구간별로 적분을 계산해보면
        $\displaystyle a\int_0^{\frac12}(\log_2(2-2t)-1)\,dt=\frac a{\ln2}\int_0^{\frac12}\ln(1-t)\,dt=\frac a{\ln2}\int_{\frac12}^1\ln u\,du=\frac a{\ln2}\Big[u\ln u-u\Big]_{\frac12}^1=\frac a2\left(1-\frac1{\ln2}\right)$
        ($1-t=u$라 하면 $\dfrac{du}{dt}=-1$이므로)
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $\displaystyle\int_{\frac12}^{\frac32}\left((a+2)\left(t-\frac32\right)+2\right)dt=-\frac12a+1$
      criteria: [1.B2]
    - id: 1b-4
      content: |
        $\displaystyle\int_{\frac32}^2(-4t+8)\,dt=\frac12$
      criteria: [1.B3]
    - id: 1b-5
      content: |
        이므로 $\displaystyle\int_0^2f(t)\,dt=\frac a2\left(1-\frac1{\ln2}\right)+\left(-\frac12a+1\right)+\frac12$ …… ①
        이다. $\displaystyle\int_0^2f(t)\,dt=0$이므로 $\dfrac a2\left(1-\dfrac1{\ln2}\right)+\left(-\dfrac12a+1\right)+\dfrac12=0$이고 $a=3\ln2$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $\displaystyle\int_0^2f(t)\,dt=0$임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: |
        $\left[0,\dfrac12\right]$ 구간의 정적분 $\dfrac a2\left(1-\dfrac1{\ln2}\right)$을 올바르게 계산했다. (공식 채점기준 「세 구간의 정적분을 올바르게 계산 — 각 1점」)
      depends_on: []
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 1
      evidence: |
        $\left[\dfrac12,\dfrac32\right]$ 구간의 정적분 $-\dfrac12a+1$을 올바르게 계산했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 1
      evidence: |
        $\left[\dfrac32,2\right]$ 구간의 정적분 $\dfrac12$을 올바르게 계산했다.
      depends_on: []
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        각 구간에서의 적분값과 $\displaystyle\int_0^2f(t)\,dt=0$을 이용하여 정답 $a=3\ln2$를 구했다.
      depends_on: [1.M1, 1.B1, 1.B2, 1.B3]
      steps: [1b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 1-2] (20점) 제시문 (나)를 읽고 다음 물음에 답하라. (단, $2<e<e^2<8$)
    (1) (10점) $g(4)$의 값을 구하라.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '7/2 - 2/log(2)', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: ①에 $a=2$를 넣으면 $\displaystyle\int_0^2v=\frac32-\frac1{\ln2}$이고 $g(4)=\dfrac12+2\int_0^2v$.
    steps:
    - {id: 21a, content: '$g(4)=\frac72-\frac2{\ln2}$', criteria: [2-1.B1, 2-1.M1, 2-1.A1]}
    hint_ladder:
    - 위치 = 처음 위치 + 속도의 정적분.
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.9
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $v(t)$는 $a=2$일 때의 $f(t)$이므로 [문제 1-1]의 ①에 $a=2$를 대입하면 $\displaystyle\int_0^2v(t)\,dt=\frac32-\frac1{\ln2}$이다.
      criteria: [2-1.B1]
    - id: 21b-2
      content: |
        음이 아닌 모든 실수 $t$에 대하여 $v(t+2)=v(t)$가 성립하므로
        $\displaystyle g(4)=\frac12+\int_0^4v(t)\,dt=\frac12+2\int_0^2v(t)\,dt=\frac72-\frac2{\ln2}$이다.
      criteria: [2-1.M1, 2-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.B1
      mark_type: B
      points: 3
      evidence: |
        $\displaystyle\int_0^2v(t)\,dt=\frac32-\frac1{\ln2}$의 값을 올바르게 계산했다.
      depends_on: []
      ft: {allowed: true, from: [1.B1, 1.B2, 1.B3], max_points: 3}
      steps: [21b-1]
    - id: 2-1.M1
      mark_type: M
      points: 4
      evidence: |
        $g(4)=\dfrac12+\displaystyle\int_0^4v(t)\,dt$ 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [21b-2]
    - id: 2-1.A1
      mark_type: A
      points: 3
      evidence: |
        $v(t+2)=v(t)$를 이용하여 정답 $\dfrac72-\dfrac2{\ln2}$를 구했다.
      depends_on: [2-1.M1, 2-1.B1]
      steps: [21b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    (2) (10점) 방정식 $g(t)=\dfrac12$의 가장 작은 양의 실근을 $t_1$이라 할 때, $t_1^2-4t_1$의 값을 구하라.
  points: 10
  depends_on: ['2-1']
  answer: {kind: value, value: '-13/4 - 1/(2*log(2))', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: 증감표에서 $g\left(\dfrac32\right)<0<\dfrac12<g(2)$이므로 $\dfrac32<t_1<2$이고 그 구간에서 $g(t)=-2t^2+8t-6-\dfrac1{\ln2}$.
    steps:
    - {id: 22a, content: '$-2(t_1^2-4t_1)-6-\frac1{\ln2}=\frac12\Rightarrow t_1^2-4t_1=-\frac{13}4-\frac1{2\ln2}$', criteria: [2-2.R1, 2-2.M1, 2-2.A1]}
    hint_ladder:
    - $[0,2]$에서 $g$의 증감표를 그리고, $\dfrac1{\ln2}$의 범위를 이용해 각 값의 부호를 보자.
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.9–10
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        닫힌구간 $[0,2]$에서 함수 $g(t)$의 증가와 감소를 나타낸 표는 다음과 같다.
        $t=0$: $g=\dfrac12$ / $0<t<1$: $v<0$, 감소($t=\dfrac12$에서 $g=\dfrac32-\dfrac1{\ln2}$) / $t=1$: $v=0$, $g=1-\dfrac1{\ln2}$ / $1<t<2$: $v>0$, 증가($t=\dfrac32$에서 $g=\dfrac32-\dfrac1{\ln2}$) / $t=2$: $v=0$, $g=2-\dfrac1{\ln2}$
      criteria: [2-2.R1]
    - id: 22b-2
      content: |
        $2<e$에 의해 $\dfrac1{\ln2}>1$이고 $e^2<8$에 의해 $\dfrac1{\ln2}<\dfrac32$이므로 $0<g\left(\dfrac12\right)<\dfrac12$, $-\dfrac12<g\left(\dfrac32\right)<0$, $\dfrac12<g(2)<1$이다. 사잇값 정리에 의하여 $g(t_1)=\dfrac12$이 되는 $t_1$은 $\dfrac32<t_1<2$임을 알 수 있다.
      criteria: [2-2.R1]
    - id: 22b-3
      content: |
        닫힌구간 $\left[\dfrac32,2\right]$에서 $\displaystyle\int_{\frac32}^{t_1}v(s)\,ds=\int_{\frac32}^{t_1}(-4s+8)\,ds=-2t_1^2+8t_1-\frac{15}2$이므로
        $\displaystyle g(t_1)=g\left(\frac32\right)+\int_{\frac32}^{t_1}v(s)\,ds=\left(\frac32-\frac1{\ln2}\right)+\left(-2t_1^2+8t_1-\frac{15}2\right)=-2t_1^2+8t_1-6-\frac1{\ln2}$이다.
      criteria: [2-2.M1]
    - id: 22b-4
      content: |
        방정식 $g(t_1)=\dfrac12$를 이용하면 $t_1^2-4t_1=-\dfrac{13}4-\dfrac1{2\ln2}$이다.
      criteria: [2-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.R1
      mark_type: R
      points: 4
      evidence: |
        $g(t_1)=\dfrac12$인 $t_1$이 $\dfrac32<t_1<2$임을 (증감표·사잇값 정리로) 밝혔다.
      depends_on: []
      steps: [22b-1, 22b-2]
    - id: 2-2.M1
      mark_type: M
      points: 3
      evidence: |
        $\dfrac32<t_1<2$일 때 $g(t_1)=-2t_1^2+8t_1-6-\dfrac1{\ln2}$을 올바르게 계산했다.
