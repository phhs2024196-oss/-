  solutions:
  - id: S31-A
    audience: A
    method_no: 1
    key_idea: $g(2n)=\dfrac12+0.057n$이고 $[2n,2n+2]$의 최솟값은 $g(2n)-0.943$이므로 $g(2n)<0.943$인 $n=0,\dots,7$에서 2번씩.
    steps:
    - {id: 31a, content: '$8\times2=16$', criteria: [3-1.R1, 3-1.M1, 3-1.A1]}
    hint_ladder:
    - 매 2초 동안 위치는 얼마만큼 변하고, 그 사이 가장 낮은 위치는 어디인가?
  - id: S31-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        [문제 1-2]의 함수 $g(t)$의 증가와 감소를 나타낸 표에서 $g(t)$의 값을 $\dfrac1{\ln2}=1.443$으로 계산하면, $g(1)-g(0)=\left(1-\dfrac1{\ln2}\right)-\dfrac12=-0.943$이고 $g(2)-g(0)=\dfrac32-\dfrac1{\ln2}=0.057$이다. 함수 $v(t)$가 주기가 2인 함수이므로 음이 아닌 정수 $n$에 대하여 $g(2n+1)-g(2n)=-0.943$이고, $g(2n+2)-g(2n)=0.057$이다.
      criteria: [3-1.R1]
    - id: 31b-2
      content: |
        따라서 $g(2n)=\dfrac12+0.057n$이고, $0<g(2n)<0.943$이면 점 $\mathrm{P}$는 $2n<t<2n+2$에서 원점을 두 번 지나고, $g(2n)=0.943$이면 점 $\mathrm{P}$는 $2n<t<2n+2$에서 원점을 한 번 지나고, $g(2n)>0.943$이면 $t>2n$에서 점 $\mathrm{P}$는 원점을 지나지 않는다.
      criteria: [3-1.M1]
    - id: 31b-3
      content: |
        $n=7$일 때 $g(2n)=g(14)=0.899<0.943$이고, $n=8$일 때 $g(2n)=g(16)=0.956>0.943$이므로 점 $\mathrm{P}$는 원점을 16번 지난다.
      criteria: [3-1.A1]
