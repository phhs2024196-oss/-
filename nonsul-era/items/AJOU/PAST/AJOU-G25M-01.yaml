        $\displaystyle g(\alpha)=\frac12+\int_0^\alpha v(t)\,dt=\frac12+\int_0^4v(t)\,dt-\int_\alpha^4v(t)\,dt=g(4)-\int_\alpha^4v(t)\,dt=\left(\frac72-\frac2{\ln2}\right)-2\alpha^2+16\alpha-32$
      criteria: [3-2.M2]
