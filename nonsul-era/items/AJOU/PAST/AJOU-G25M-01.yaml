  solutions:
  - id: S32-A
    audience: A
    method_no: 1
    key_idea: $\left(\dfrac32,2\right)$에서 두 번 만나고 $\left(\dfrac72,4\right)$에서 접해야 하므로 $v(\alpha)=-4\alpha+16=m$, $g(\alpha)=m\alpha+\dfrac12$.
    steps:
    - {id: 32a, content: '$\left(\frac72-\frac2{\ln2}\right)-2\alpha^2+16\alpha-32=-4\alpha^2+16\alpha+\frac12\Rightarrow\alpha^2=\frac1{\ln2}+\frac{29}2$', criteria: [3-2.R1, 3-2.M1, 3-2.M2, 3-2.A1]}
    hint_ladder:
    - $y=h(t)$는 $\left(0,\dfrac12\right)$을 지나는 직선이다. 세 번 만나려면 어디에서 접해야 하는가?
  - id: S32-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        함수 $y=g(t)$의 그래프와 함수 $y=h(t)$의 그래프가 제1사분면에서 3번 만나야 한다. [문제 1-2]의 함수 $g(t)$의 증가와 감소를 나타낸 표를 이용하면 함수 $y=g(t)$의 그래프와 함수 $y=h(t)$의 그래프는 열린구간 $\left(\dfrac32,2\right)$에서 두 번 만나고, 열린구간 $\left(\dfrac72,4\right)$에서 접해야 한다.
      criteria: [3-2.R1]
    - id: 32b-2
      content: |
        두 함수의 그래프가 접할 때 접점의 $t$좌표가 $\alpha$이므로 $\dfrac72<\alpha<4$이고 접점의 좌표를 $\left(\alpha,m\alpha+\dfrac12\right)$이라 하면 $v(\alpha)=m$, $g(\alpha)=m\alpha+\dfrac12$이다. $\dfrac72<\alpha<4$이므로 $v(\alpha)=v(\alpha-2)=-4\alpha+16$이고 $v(\alpha)=m$을 이용하여 정리하면 $m=-4\alpha+16$이다.
      criteria: [3-2.M1]
    - id: 32b-3
      content: |
