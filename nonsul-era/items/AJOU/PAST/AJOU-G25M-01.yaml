intent: |
  [문제 1-1] 여러 가지 함수의 정적분을 구할 수 있는지를 평가하는 문제이다. [문제 1-2] 연속함수의 성질 및 여러 가지 함수의 정적분을 이용하여 속도와 거리에 대한 문제를 해결할 수 있는지를 평가하는 문제이다. [문제 1-3] 함수의 증가와 감소 및 여러 가지 함수의 정적분을 이용하여 속도와 거리에 대한 문제를 해결할 수 있는지를 평가하는 문제이다. (보고서 문항카드 원문)
key_idea: |
  주기 2인 $f$의 적분이 유계이려면 한 주기 적분이 0이어야 한다($a=3\ln2$). 위치 $g(t)=\dfrac12+\displaystyle\int_0^tv$는 매 2초마다 $\dfrac32-\dfrac1{\ln2}$만큼 증가하고, 한 주기 안에서 감소 후 증가한다.
stuck: |
  (1-1) 「모든 $\beta,\gamma$에 대해 유계」를 「한 주기 적분 $=0$」으로 바꾸는 것, (1-3)(1) $g(2n)$의 등차적 증가와 주기 내 최솟값 $g(2n)-0.943$을 비교하는 것, (1-3)(2) 3번 만나려면 $\left(\dfrac72,4\right)$에서 접해야 함을 보는 것
idea_tags: [IDEA-PERIODIC-INTEGRAL-BOUNDED-ZERO, IDEA-POSITION-PERIODIC-DRIFT-COUNT, IDEA-TANGENCY-COUNT-THREE]
tags: [주기함수, 정적분, 속도와 위치, 사잇값 정리, 접선]
