stimuli:
- label: 가
  body: |
    (가) 양의 실수 $a$에 대하여 두 함수 $f_1(x)=ax^2$, $f_2(x)=\begin{cases}ax+a^2+4 & (x<0)\\ -ax+a^2+4 & (x\ge0)\end{cases}$이 있다. 두 함수 $y=f_1(x)$와 $y=f_2(x)$의 그래프로 둘러싸인 도형을 $S$라 하자. 두 함수의 그래프의 교점 중 제1사분면 위의 점을 $\mathrm{P}$라 하고, 점 $\mathrm{P}$의 $x$좌표를 $p$라 하자. 【그림 1】은 $a=1$일 때 두 함수의 그래프를 나타낸다.

    [그림 1: $a=1$일 때 포물선 $y=x^2$과 꼭짓점이 $(0,5)$인 꺾은선 $y=-\lvert x\rvert+5$. 두 그래프가 좌우 대칭인 두 점에서 만난다. $y$축에 $5$ 표시.]
- label: 나
  body: |
    (나) 함수 $g(x)$는 다음과 같이 정의된다.
    $$g(x)=\begin{cases}-2x-3 & \left(x<-\dfrac32\right)\\ 2x+3 & \left(-\dfrac32\le x<0\right)\\ -2x+3 & \left(0\le x<\dfrac32\right)\\ 2x-3 & \left(x\ge\dfrac32\right)\end{cases}$$
    【그림 2】는 함수 $y=g(x)$의 그래프이다.

    [그림 2: $W$ 모양 꺾은선. $x=-1.5$와 $x=1.5$에서 $0$(아래 꼭짓점), $x=0$에서 $3$(위 꼭짓점). $x$축에 $-1.5$, $\mathrm{O}$, $1.5$, $y$축에 $3$ 표시.]

stem: |
  [문항 1]【제시문】을 읽고 물음에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (30점) 제시문 (가)를 읽고 다음 물음에 답하라.
    (1) (10점) $p$의 최솟값과 그때의 $a$의 값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'p_min = (-1 + sqrt(17))/2; a = 2', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $ap^2=-ap+a^2+4$에서 $p=-\dfrac12+\sqrt{\dfrac14+\left(a+\dfrac4a\right)}$, $a+\dfrac4a\ge4$.
    steps:
    - {id: 11a, content: '$p\ge\frac{-1+\sqrt{17}}{2}$ (등호 $a=2$)', criteria: [1-1.M1, 1-1.M2, 1-1.A1, 1-1.A2]}
    hint_ladder:
    - $p$를 $a$에 대한 식으로 나타내면 $a+\dfrac4a$가 보인다.
  - id: S11-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        점 $\mathrm{P}$는 제1사분면 위의 교점이므로 $p>0$이다. 방정식 $ap^2=-ap+a^2+4$를 풀면 다음과 같다.
        $p=\dfrac{-a+\sqrt{a^2+4a(a^2+4)}}{2a}=-\dfrac12+\sqrt{\dfrac14+\left(a+\dfrac4a\right)}$
      criteria: [1-1.M1]
    - id: 11b-2
      content: |
        $a>0$이므로 산술평균과 기하평균의 대소관계에 의하여, $a+\dfrac4a\ge4$이며 등호는 $a=2$일 때 성립한다. 즉,
        $p=-\dfrac12+\sqrt{\dfrac14+\left(a+\dfrac4a\right)}\ge-\dfrac12+\sqrt{\dfrac14+4}=\dfrac{-1+\sqrt{17}}{2}$이다.
      criteria: [1-1.M2]
    - id: 11b-3
      content: |
        그러므로 $p$의 최솟값은 $a=2$일 때 $\dfrac{-1+\sqrt{17}}{2}$이다.
      criteria: [1-1.A1, 1-1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        $ap^2=-ap+a^2+4$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [11b-1]
    - id: 1-1.M2
      mark_type: M
      points: 3
      evidence: |
        산술기하평균($a+\dfrac4a\ge4$)을 활용했다.
      depends_on: [1-1.M1]
      implied_ok: false
      steps: [11b-2]
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        $a=2$를 구했다. (공식 「$a$와 $p$의 값을 구함 — 각 2점」)
      depends_on: [1-1.M2]
      steps: [11b-3]
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: |
        $p$의 최솟값 $\dfrac{-1+\sqrt{17}}{2}$을 구했다.
      depends_on: [1-1.M2]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) (10점) 도형 $S$의 넓이를 $a$와 $p$에 대한 식으로 나타내라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '4*a*p**3/3 + a*p**2', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 직선 $y=ap^2$로 나누면 윗부분은 밑변 $2p$, 높이 $(a^2+4)-ap^2$인 삼각형, 아랫부분은 포물선 조각.
    steps:
    - {id: 12a, content: '$p(-ap^2+a^2+4)+\frac43ap^3=ap^2+\frac43ap^3$', criteria: [1-2.M1, 1-2.A1]}
    hint_ladder:
    - 두 교점을 잇는 수평선으로 도형을 나누어 보자.
  - id: S12-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        점 $\mathrm{P}$는 두 함수의 교점이므로 $ap^2=-ap+a^2+4$가 성립한다. 직선 $y=ap^2$에 의하여 도형 $S$가 나뉘는 부분 중 윗부분과 아랫부분의 넓이를 각각 구하자. $f_1(p)=f_1(-p)=ap^2$이므로 $y=ap^2$은 두 함수의 교점을 지나고 $x$축에 평행한 직선이고, 도형 $S$가 나뉘는 부분 중 윗부분은 밑변의 길이가 $2p$이고 높이가 $((a^2+4)-ap^2)$인 삼각형이다. 따라서 그 넓이는 $p(-ap^2+a^2+4)=ap^2$이다.
      criteria: [1-2.M1]
    - id: 12b-2
      content: |
        직선 $y=ap^2$에 의하여 도형 $S$가 나뉘는 부분 중 아랫부분은 곡선 $y=ax^2$과 직선 $y=ap^2$, $x=-p$, $x=p$로 둘러싸인 도형이므로 정적분을 이용하여 그 넓이를 구하면 $\displaystyle\int_{-p}^{p}(ap^2-ax^2)\,dx=\frac43ap^3$이다. 따라서 $S$의 넓이는 $\dfrac43ap^3+ap^2$이다.
      criteria: [1-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 5
      evidence: |
        도형 $S$의 넓이를 정적분으로 표현하거나 이를 구하기 위한 전략(직선 $y=ap^2$로 분할 등)을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [12b-1]
    - id: 1-2.A1
      mark_type: A
      points: 5
      evidence: |
        넓이 $\dfrac43ap^3+ap^2$를 바르게 구했다.
      depends_on: [1-2.M1]
      steps: [12b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    (3) (10점) 직선 $y=4a$에 의하여 도형 $S$가 넓이가 같은 두 도형으로 나뉠 때, $4p^3+3p^2$의 값을 구하라.
  points: 10
  depends_on: ['1-1', '1-2']
  answer: {kind: value, value: '64', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: $p>1$이라 아랫부분이 더 크므로 $y=4a$는 $y=ap^2$ 아래; $\displaystyle\int_{-2}^2(4a-ax^2)dx=\frac{32}3a=\frac12S$.
    steps:
    - {id: 13a, content: '$\frac{32}3a=\frac23ap^3+\frac{ap^2}2\Rightarrow4p^3+3p^2=64$', criteria: [1-3.M1, 1-3.M2, 1-3.A1]}
    hint_ladder:
    - 직선 $y=4a$는 직선 $y=ap^2$보다 위인가 아래인가?
  - id: S13-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        [문제 1-1] (1)과 (2)로부터 $p>1$이므로 $\dfrac43ap^3>ap^2$이다. 따라서 직선 $y=ap^2$에 의하여 도형 $S$가 나뉘는 부분 중 아랫부분의 넓이가 윗부분의 넓이보다 크므로, $S$의 넓이를 반으로 나누려면 직선 $y=4a$가 직선 $y=ap^2$보다 더 아래에 있어야 한다.
      criteria: [1-3.M2]
    - id: 13b-2
      content: |
        직선 $y=4a$와 곡선 $y=ax^2$으로 둘러싸인 부분의 넓이는 도형 $S$의 넓이의 반이고 직선 $y=4a$와 곡선 $y=ax^2$의 교점의 $x$좌표는 $\pm2$이므로,
        $\displaystyle\int_{-2}^2(4a-ax^2)\,dx=\frac{32}3a=\frac23ap^3+\frac{ap^2}2$
      criteria: [1-3.M1, 1-3.M2]
    - id: 13b-3
      content: |
        이다. 따라서 이를 정리하면 $4p^3+3p^2=64$이다.
      criteria: [1-3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 4
      evidence: |
        직선 $y=4a$와 $y=ax^2$으로 둘러싸인 부분의 넓이를 계산하거나 $\displaystyle\int_{-2}^2(4a-ax^2)\,dx=\frac{32}3a$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [13b-2]
    - id: 1-3.M2
      mark_type: M
      points: 2
      evidence: |
        (2)에서 구한 $S$의 넓이의 반이 된다는 사실로부터 식 $\dfrac{32}3a=\dfrac23ap^3+\dfrac{ap^2}2$를 세웠다.
      depends_on: [1-3.M1]
      implied_ok: false
      ft: {allowed: true, from: [1-2.A1], max_points: 2}
      steps: [13b-1, 13b-2]
    - id: 1-3.A1
      mark_type: A
      points: 4
      evidence: |
        답 $64$를 바르게 구했다.
      depends_on: [1-3.M2]
      steps: [13b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 1-2] (20점) 제시문 (나)를 읽고 다음 물음에 답하라.
    (1) (10점) 함수 $y=g(x)$의 그래프와 함수 $y=e^{x+k}$의 그래프의 교점의 개수가 3인 모든 실수 $k$의 값의 범위를 구하라.
  points: 10
  depends_on: []
  answer: {kind: set, value: 'Interval.open(log(2) - 5/2, log(2) + 1/2)', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: 기울기 2인 조각 $\left(-\dfrac32,0\right)$, $\left(\dfrac32,\infty\right)$에 접할 때 $e^{t+k}=2$; 접하는 두 $k$ 사이에서 교점 3개.
    steps:
    - {id: 21a, content: '$t=-\frac12$: $k=\ln2+\frac12$, $t=\frac52$: $k=\ln2-\frac52$', criteria: [2-1.B1, 2-1.B2, 2-1.R1]}
    hint_ladder:
    - $y=e^{x+k}$는 아래로 볼록이고 기울기가 계속 커진다. 꺾은선의 어느 조각에 접할 수 있는가?
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        곡선 $y=e^{x+k}$이 $-\dfrac32<x<0$, $x>\dfrac32$에서 각각 함수 $y=g(x)$의 그래프와 접하는 경우의 점을 $(t,e^{t+k})$라 두면, $-\dfrac32<t<0$이거나 $t>\dfrac32$이다.
        $-\dfrac32<t<0$이면, $e^{t+k}=2$이고 $e^{t+k}=2t+3$이므로 $t=-\dfrac12$, $k=\ln2+\dfrac12$이다.
      criteria: [2-1.B1]
    - id: 21b-2
      content: |
        $t>\dfrac32$이면 $e^{t+k}=2$, $e^{t+k}=2t-3$이므로 $t=\dfrac52$, $k=\ln2-\dfrac52$이다.
      criteria: [2-1.B2]
    - id: 21b-3
      content: |
