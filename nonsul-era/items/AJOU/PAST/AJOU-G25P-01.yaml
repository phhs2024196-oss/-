    key_idea: 원이 $\left(-\dfrac32,0\right)$, $\left(0,\dfrac32\right)$의 조각에 접하는 경우(판별식 $0$)와 원이 꺾인 점 $(0,3)$, $\left(\pm\dfrac32,0\right)$을 지나는 경우.
    steps:
    - {id: 22a, content: '$c=-\frac34-\frac34\sqrt5,\ -\frac32,\ 0,\ \frac34+\frac34\sqrt5,\ \frac32$', criteria: [2-2.B1, 2-2.B2, 2-2.B3, 2-2.B4, 2-2.B5]}
    hint_ladder:
    - 중심 $\left(c,\dfrac32\right)$, 반지름 $\dfrac32$인 원은 항상 $x$축에 접한다. $c$를 왼쪽에서 오른쪽으로 움직여 보자.
  - id: S22-B
