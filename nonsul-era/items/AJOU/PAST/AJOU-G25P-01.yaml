    steps:
    - id: 22b-1
      content: |
        원 $(x-c)^2+\left(y-\dfrac32\right)^2=\dfrac94$가 열린구간 $\left(-\dfrac32,0\right)$, $\left(0,\dfrac32\right)$에서 각각 함수 $y=g(x)$의 그래프가 접하는 경우를 조사해 보자.
        먼저 열린구간 $\left(-\dfrac32,0\right)$에서 접하면 $g(x)=2x+3$이므로 이차방정식 $(x-c)^2+\left(2x+3-\dfrac32\right)^2=\dfrac94$이 중근을 갖는다. 즉, $5x^2+(6-2c)x+c^2=0$이고 판별식 $D=(6-2c)^2-20c^2=0$에서 $c=-\dfrac34\pm\dfrac{3\sqrt5}{4}$이다. 이 중 실근의 개수가 3인 것은 $c=-\dfrac34-\dfrac34\sqrt5$이다.
      criteria: [2-2.B1]
    - id: 22b-2
      content: |
        열린구간 $\left(0,\dfrac32\right)$에서 접하면 $g(x)=-2x+3$이므로 이차방정식 $(x-c)^2+\left(-2x+3-\dfrac32\right)^2=\dfrac94$이 중근을 갖는다. 즉, $5x^2-(2c+6)x+c^2=0$이고 판별식 $D=(-2c-6)^2-20c^2=0$에서 $c=\dfrac34\pm\dfrac{3\sqrt5}{4}$이다. 이 중 실근의 개수가 3인 것은 $c=\dfrac34+\dfrac{3\sqrt5}{4}$이다.
      criteria: [2-2.B2]
    - id: 22b-3
      content: |
        원 $(x-c)^2+\left(y-\dfrac32\right)^2=\dfrac94$가 세 점 $(0,3)$, $\left(-\dfrac32,0\right)$, $\left(\dfrac32,0\right)$ 중 하나를 지나는 경우도 두 곡선의 교점이 3개다. 이때 $c$의 값은 각각 $0$, $-\dfrac32$, $\dfrac32$이다.
      criteria: [2-2.B3, 2-2.B4, 2-2.B5]
    - id: 22b-4
      content: |
        따라서 $c$의 값은 $-\dfrac34-\dfrac{3\sqrt5}{4}$, $-\dfrac32$, $0$, $\dfrac34+\dfrac{3\sqrt5}{4}$, $\dfrac32$이다.
      criteria: [2-2.B1, 2-2.B2]
