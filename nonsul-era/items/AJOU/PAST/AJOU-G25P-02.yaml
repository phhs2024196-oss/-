stimuli:
- label: 가
  body: |
    양의 실수 $a$와 실수 $p$에 대하여 점 $\mathrm{P}(p,-1)$에서 함수 $f(x)=\dfrac a2x^2$의 그래프에 서로 다른 두 접선을 그을 수 있다. 이때 두 접점을 $x$좌표가 작은 것부터 차례로 $\mathrm{A}$, $\mathrm{B}$라 하고 $\theta=\angle\mathrm{APB}$라 하자. 점 $\mathrm{A}$를 접점으로 하는 접선을 $l_1$, 점 $\mathrm{B}$를 접점으로 하는 접선을 $l_2$라 하자. 점 $\mathrm{A}$를 지나고 $l_1$에 수직인 직선을 $m_1$, 점 $\mathrm{B}$를 지나고 $l_2$에 수직인 직선을 $m_2$라 하고, $m_1$과 $m_2$의 교점을 $\mathrm{Q}$라 하자. (단, $0<\theta<\pi$)
    【그림 3】은 점 $\mathrm{Q}$의 $x$좌표가 점 $\mathrm{A}$의 $x$좌표보다 크고 점 $\mathrm{B}$의 $x$좌표보다 작은 경우를 나타내고, 【그림 4】는 점 $\mathrm{Q}$의 $x$좌표가 점 $\mathrm{B}$의 $x$좌표보다 큰 경우를 나타낸다.

    [그림 3: 포물선 $y=\dfrac a2x^2$, 직선 $y=-1$(점선) 위의 점 $\mathrm{P}$(원점 바로 아래)에서 그은 두 접선 $l_1$(왼쪽 위로), $l_2$(오른쪽 위로). 접점 $\mathrm{A}$(제2사분면), $\mathrm{B}$(제1사분면)에 직각 표시. $\mathrm{A}$, $\mathrm{B}$를 지나는 수직선 $m_1$, $m_2$(점선)가 $\mathrm{A}$와 $\mathrm{B}$ 사이 위쪽 점 $\mathrm{Q}$에서 만난다.]
    [그림 4: $\mathrm{P}$가 $y$축 오른쪽 아래($y=-1$ 위)에 있고, 접점 $\mathrm{A}$는 원점 왼쪽 가까이, $\mathrm{B}$는 오른쪽 위 멀리. $m_1$, $m_2$의 교점 $\mathrm{Q}$는 $\mathrm{B}$보다 오른쪽에 있다.]
    [판독확인: 문제지에는 제시문 라벨 (가)가 없음 — DB 구조상 '가'로 둠]

stem: |
  [문항 2]【제시문】을 읽고 물음에 답하라.

subparts:
- id: '1'
  stem: |
    [문제 2-1] (12점) 점 $\mathrm{Q}$의 $x$좌표와 $y$좌표를 각각 $a$와 $p$에 대한 식으로 나타내라.
  points: 12
  depends_on: []
  answer: {kind: expression, value: '(2*a*p, 2*a*p**2 + 1/a + 1)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $m_1$, $m_2$를 빼면 $x=2ap$, 근과 계수의 관계로 $y$좌표 정리.
    steps:
    - {id: 1a, content: '$\mathrm{Q}\left(2ap,\ 2ap^2+\frac1a+1\right)$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - 접점의 $x$좌표가 만족하는 이차방정식을 세우자.
  - id: S1-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=\dfrac a2x^2$ 위의 한 접점의 좌표를 $\left(t,\dfrac a2t^2\right)$이라 하면 $f'(t)=at$이므로 접선의 방정식은 $y=at(x-t)+\dfrac a2t^2$이다. 이때 이 접선이 점 $\mathrm{P}(p,-1)$을 지나므로 $\dfrac a2t^2-apt-1=0$이다. 점 $\mathrm{A}$와 점 $\mathrm{B}$의 $x$좌표를 각각 $\beta$, $\gamma$ $(\beta<\gamma)$라 하면, $\beta$와 $\gamma$는 위 이차방정식의 서로 다른 두 실근이다. 이차방정식의 근과 계수의 관계에 의하여
        $\beta+\gamma=2p$, $\beta\gamma=-\dfrac2a$ …… ①
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이다. 한편 두 직선 $m_1$과 $m_2$의 방정식은 각각
        $m_1:y=-\dfrac1{a\beta}(x-\beta)+\dfrac{a\beta^2}2$, $m_2:y=-\dfrac1{a\gamma}(x-\gamma)+\dfrac{a\gamma^2}2$
        이므로 $-\dfrac xa\left(\dfrac1\beta-\dfrac1\gamma\right)+\dfrac a2(\beta^2-\gamma^2)=0$에서 $x=2ap$이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        ①을 이용하면 점 $\mathrm{Q}$의 $y$좌표는 다음과 같다.
        $y=-\dfrac{2ap}{a\beta}+\dfrac1a+\dfrac{a\beta^2}2=-\dfrac{\beta+\gamma}{\beta}+\dfrac1a-\dfrac{\beta^2}{\beta\gamma}=2ap^2+\dfrac1a+1$
        그러므로 점 $\mathrm{Q}$의 $x$좌표는 $x=2ap$이고 $y$좌표는 $y=2ap^2+\dfrac1a+1$이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        두 점 $\mathrm{A}$, $\mathrm{B}$의 $x$좌표가 $\dfrac a2t^2-apt-1=0$을 만족한다는 것을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        점 $\mathrm{Q}$의 $x$좌표 $2ap$를 올바르게 나타냈다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        점 $\mathrm{Q}$의 $y$좌표 $2ap^2+\dfrac1a+1$을 올바르게 나타냈다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 2-2] (16점) $a=3$이고 점 $\mathrm{Q}$는 곡선 $y=f(x)$ 위의 점이라 하자. 다음 물음에 답하라. (단, 점 $\mathrm{Q}$는 제2사분면 위의 점이다.)
    (1) (6점) $p$의 값을 구하라.
  points: 6
  depends_on: ['1']
  answer: {kind: value, value: '-1/6', equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{Q}\left(6p,6p^2+\dfrac43\right)$이 $y=\dfrac32x^2$ 위에 있다.
    steps:
    - {id: 21a, content: '$p^2=\frac1{36}$, 제2사분면이므로 $p=-\frac16$', criteria: [2-1.M1, 2-1.A1]}
    hint_ladder:
    - (2-1)의 결과에 $a=3$을 대입하자.
  - id: S21-B
    audience: B
    source_flow: 모범답안 p.8–9
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        [문제 2-1]에서 구한 점 $\mathrm{Q}$의 좌표에 $a=3$을 대입하면 점 $\mathrm{Q}$의 좌표는 $\left(6p,6p^2+\dfrac43\right)$이다. 점 $\mathrm{Q}$가 곡선 $y=f(x)=\dfrac a2x^2$ 위의 점이므로 $6p^2+\dfrac43=\dfrac32(6p)^2$이다.
      criteria: [2-1.M1]
    - id: 21b-2
      content: |
        따라서 $p^2=\dfrac1{36}$이고 $p=\pm\dfrac16$이다. 점 $\mathrm{Q}$가 제2사분면 위의 점이므로 $p=-\dfrac16$이다.
      criteria: [2-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 3
      evidence: |
        $6p^2+\dfrac43=\dfrac32(6p)^2$임을 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 1.A2], max_points: 3}
      steps: [21b-1]
    - id: 2-1.A1
      mark_type: A
      points: 3
      evidence: |
        점 $\mathrm{Q}$가 제2사분면의 위의 점이라는 것으로부터 답 $p=-\dfrac16$을 구했다.
      depends_on: [2-1.M1]
      steps: [21b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    (2) (10점) $\sin\theta$의 값을 구하라.
  points: 10
  depends_on: ['1', '2-1']
  answer: {kind: value, value: 'sqrt(2)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{Q}$가 곡선 위·제2사분면이면 $\mathrm{Q}=\mathrm{A}$이므로 $\triangle\mathrm{APB}$는 $\angle\mathrm{B}=90^\circ$인 직각삼각형.
    steps:
    - {id: 22a, content: '$\mathrm{A}\left(-1,\frac32\right)$, $\mathrm{B}\left(\frac23,\frac23\right)$, $\sin\theta=\frac{\overline{\mathrm{AB}}}{\overline{\mathrm{AP}}}=\frac{\sqrt2}{2}$', criteria: [2-2.M1, 2-2.M2, 2-2.A1]}
    hint_ladder:
    - $m_1$은 곡선과 $\mathrm{A}$에서 만난다. $\mathrm{Q}$가 곡선 위에 있으면 어디인가?
  - id: S22-B
    audience: B
    source_flow: 모범답안 p.9
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        점 $\mathrm{Q}$가 곡선 $y=f(x)$ 위의 점이고 제2사분면 위에 있으므로 점 $\mathrm{Q}$와 점 $\mathrm{A}$는 일치한다. 따라서 삼각형 $\mathrm{APB}$는 선분 $\mathrm{AP}$가 빗변인 직각삼각형이다. $a=3$이고 [문제 2-2] (1)에 의해 $p=-\dfrac16$이므로 [문제 2-1]의 ①에 대입하여 점 $\mathrm{A}$와 점 $\mathrm{B}$의 $x$좌표 $\beta$, $\gamma$ $(\beta<\gamma)$를 계산하면 $\beta=-1$이고 $\gamma=\dfrac23$이다. 따라서 점 $\mathrm{A}$의 좌표는 $\left(-1,\dfrac32\right)$이고
      criteria: [2-2.M1]
    - id: 22b-2
      content: |
        점 $\mathrm{B}$의 좌표는 $\left(\dfrac23,\dfrac23\right)$이다.
      criteria: [2-2.M2]
    - id: 22b-3
      content: |
        [문제 2-2] (1)에 의해 점 $\mathrm{P}$의 좌표는 $\left(-\dfrac16,-1\right)$이므로 $\overline{\mathrm{AB}}=\dfrac{5\sqrt5}{6}$, $\overline{\mathrm{AP}}=\dfrac{5\sqrt{10}}{6}$이다. 그러므로 $\sin\theta=\dfrac{\overline{\mathrm{AB}}}{\overline{\mathrm{AP}}}=\dfrac{\sqrt2}{2}$이다.
      criteria: [2-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 3
      evidence: |
        점 $\mathrm{A}$의 좌표 $\left(-1,\dfrac32\right)$를 올바르게 구했다. (공식 「점 A와 점 B의 좌표 — 각 3점」)
      depends_on: []
      ft: {allowed: true, from: [2-1.A1], max_points: 3}
      steps: [22b-1]
    - id: 2-2.M2
      mark_type: M
      points: 3
      evidence: |
        점 $\mathrm{B}$의 좌표 $\left(\dfrac23,\dfrac23\right)$를 올바르게 구했다.
      depends_on: []
      ft: {allowed: true, from: [2-1.A1], max_points: 3}
      steps: [22b-2]
    - id: 2-2.A1
      mark_type: A
      points: 4
      evidence: |
        답 $\sin\theta=\dfrac{\sqrt2}{2}$를 올바르게 구했다.
      depends_on: [2-2.M1, 2-2.M2]
      steps: [22b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3-1'
  stem: |
    [문제 2-3] (22점) 점 $\mathrm{Q}$의 $x$좌표가 점 $\mathrm{B}$의 $x$좌표보다 크고 $\overline{\mathrm{AB}}=\dfrac{12\sqrt5}{5}$, $\cos\theta=\dfrac{2\sqrt{13}}{13}$이라 하자. 다음 물음에 답하라.
    (1) (8점) $\overline{\mathrm{PQ}}$를 구하라.
  points: 8
  depends_on: []
  answer: {kind: value, value: '4*sqrt(65)/5', equivalents: [], tolerance: null}
  solutions:
  - id: S31-A
    audience: A
    method_no: 1
    key_idea: $\angle\mathrm{PAQ}=\angle\mathrm{PBQ}=90^\circ$이므로 $\overline{\mathrm{PQ}}$는 $\triangle\mathrm{APB}$ 외접원의 지름, $\overline{\mathrm{PQ}}=\dfrac{\overline{\mathrm{AB}}}{\sin\theta}$.
    steps:
    - {id: 31a, content: '$\sin\theta=\frac{3\sqrt{13}}{13}$, $\overline{\mathrm{PQ}}=\frac{12\sqrt5}{5}\cdot\frac{13}{3\sqrt{13}}=\frac{4\sqrt{65}}{5}$', criteria: [3-1.M1, 3-1.A1]}
    hint_ladder:
    - $\angle\mathrm{PAQ}$와 $\angle\mathrm{PBQ}$의 크기는?
  - id: S31-B
    audience: B
    source_flow: 모범답안 p.9
    method_no: 1
    steps:
    - id: 31b-1
      content: |
