intent: |
  [문제 2-1] 접선의 방정식을 이용하여 두 직선의 교점의 좌표를 구할 수 있는지를 평가하는 문제이다. [문제 2-2] 주어진 조건을 이용하여 삼각함수에 대한 문제를 해결할 수 있는지를 평가하는 문제이다. [문제 2-3] 사인법칙과 코사인법칙을 이용하여 삼각형의 선분의 길이 및 삼각형의 넓이에 대한 문제를 해결할 수 있는지를 평가하는 문제이다. (보고서 문항카드 원문)
key_idea: |
  접점 $x$좌표 $\beta,\gamma$는 $\dfrac a2t^2-apt-1=0$의 두 근($\beta+\gamma=2p$, $\beta\gamma=-\dfrac2a$)이고 $\mathrm{Q}(2ap,\,2ap^2+\frac1a+1)$. $\angle\mathrm{PAQ}=\angle\mathrm{PBQ}=90^\circ$이므로 $\mathrm{P},\mathrm{A},\mathrm{Q},\mathrm{B}$는 $\mathrm{PQ}$를 지름으로 하는 원 위에 있다.
stuck: |
  (2-2)(2) $\mathrm{Q}$가 곡선 위에 있으면 $\mathrm{Q}=\mathrm{A}$가 됨을 보는 것, (2-3) 네 점이 한 원 위에 있어 $\mathrm{PQ}=\dfrac{\mathrm{AB}}{\sin\theta}$이고 $\angle\mathrm{AQB}=\theta$를 이용해 닮음을 세우는 것
