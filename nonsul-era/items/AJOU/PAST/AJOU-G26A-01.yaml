  points: 10
  depends_on: []
  answer: {kind: value, value: '18', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: 교점 3개 이상 ⇔ 기울기 $-1$ 이상 $9$ 이하. 이때 정수 $x$로 $4\le x<6$ 또는 $6<x\le24$인 20개의 점과 P를 잇는 직선이 후보이고, 정수점 3개인 두 직선이 두 번씩 세어진다.
    steps:
    - id: 2-2a
      content: |
        $20-2=18$.
      criteria: ['2-2.M1', '2-2.R1', '2-2.A1']
    hint_ladder:
    - $\mathrm{P}$와 $(5,0)$, $\mathrm{P}$와 $(15,0)$을 잇는 직선의 기울기는?
    - 정수 $x$에서 $g(x)$는 항상 정수이다.
  - id: S2-2-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        점 $\mathrm{P}(6,9)$와 점 $(5,0)$을 지나는 직선의 방정식은 $y=9x-45$이고, 점 $\mathrm{P}(6,9)$와 점 $(15,0)$을 지나는 직선의 방정식은 $y=-x+15$이다. 이를 통해 점 $\mathrm{P}(6,9)$를 지나는 직선 중 기울기가 $9$보다 크거나 $-1$보다 작은 직선과 곡선 $y=g(x)$의 교점의 개수는 $2$인 것을 알 수 있다. 따라서 점 $\mathrm{P}(6,9)$를 지나는 직선 중 직선의 기울기가 $-1$ 이상 $9$ 이하인 직선과 곡선 $y=g(x)$의 교점의 개수는 $3$ 이상이다.
      criteria: ['2-2.M1']
    - id: 2-2b-2
      content: |
        직선 $y=9x-45$와 곡선 $y=g(x)$의 교점은 $(5,0)$, $(6,9)$, $(24,171)$이고, 직선 $y=-x+15$와 곡선 $y=g(x)$의 교점은 $(4,11)$, $(6,9)$, $(15,0)$이다. $x$좌표와 $y$좌표가 모두 정수인 교점을 고려하므로 정수 $x$를 생각하자. $x<4$일 때 점 $\mathrm{P}(6,9)$와 점 $(x,g(x))$를 지나는 직선의 기울기는 $-1$보다 작고, $x>24$일 때 기울기는 $9$보다 크다. 따라서 $4\le x<6$ 또는 $6<x\le24$인 경우 교점의 개수가 $3$ 이상이면서 $x$좌표와 $y$좌표가 모두 정수인 교점의 개수가 $2$ 이상이다. 이를 만족하는 $x$는 $20$개다.
      criteria: ['2-2.R1']
    - id: 2-2b-3
      content: |
        $x$좌표와 $y$좌표가 모두 정수인 교점의 개수가 $3$인 직선은 세 점 $(5,0)$, $(6,9)$, $(24,171)$을 지나는 직선 $y=9x-45$와 세 점 $(4,11)$, $(6,9)$, $(15,0)$을 지나는 직선 $y=-x+15$뿐이다. 따라서 중복된 두 직선을 고려하면, <조건>을 만족시키는 직선의 개수는 $18$이다.
      criteria: ['2-2.A1']
