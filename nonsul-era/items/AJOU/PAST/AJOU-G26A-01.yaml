- id: '3'
  stem: |
    [문제 1-3] (12점) 양수 $m$에 대하여 함수 $y=m\lvert x\rvert$의 그래프와 제시문 (다)의 함수 $y=h(x)$의 그래프로 둘러싸인 도형의 넓이를 $A(m)$이라 하자. $A(m)$이 최소일 때, $m$의 값을 구하시오. (단, $0<m<5$)
  points: 12
  depends_on: []
  answer: {kind: value, value: '(-90+70*sqrt(2))/17', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $y$축 대칭으로 $x\ge0$ 부분 $T(m)=4+\dfrac{10m}{5-m}-\dfrac{8m}{m+2}$만 최소화한다.
    steps:
    - id: 3a
      content: |
        $T^{\prime}(m)=\dfrac{2(17m^2+180m-100)}{(5-m)^2(m+2)^2}=0\Rightarrow m=\dfrac{-90+70\sqrt2}{17}$.
      criteria: ['3.B1', '3.M1', '3.A1', '3.A2']
    hint_ladder:
    - 두 그래프는 모두 $y$축에 대하여 대칭이다.
    - $x\ge0$ 부분을 원점·$y$절편·$x$절편과 두 교점을 꼭짓점으로 하는 삼각형들로 나누어 보자.
  - id: S3-B
    audience: B
    source_flow: 모범답안 p.8~9
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        함수 $y=m\lvert x\rvert$의 그래프와 함수 $y=h(x)$의 그래프는 $y$축에 대하여 대칭이다. 두 그래프로 둘러싸인 도형에서 $x\ge0$인 부분의 넓이를 $T(m)$이라 하면 $A(m)=2T(m)$이므로 $T(m)$이 최소일 때 $A(m)$도 최소이다.
        $y=h(x)$의 그래프와 $y$축의 교점을 $\mathrm{C}$, $x$축의 교점을 $\mathrm{D}$, $0\le x<2$에서 직선 $y=mx$와 $y=4-2x$의 교점을 $\mathrm{P}$, $x\ge2$에서 직선 $y=mx$와 $y=5x-10$의 교점을 $\mathrm{Q}$라 하자. 점 $\mathrm{P}$의 좌표는 $\left(\dfrac{4}{m+2},\dfrac{4m}{m+2}\right)$이고 점 $\mathrm{Q}$의 좌표는 $\left(\dfrac{10}{5-m},\dfrac{10m}{5-m}\right)$이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        $T(m)$은 삼각형 $\mathrm{COD}$의 넓이와 삼각형 $\mathrm{ODQ}$의 넓이의 합에서 삼각형 $\mathrm{ODP}$의 넓이의 $2$배를 뺀 것과 같으므로
        $$T(m)=4+\frac{10m}{5-m}-\frac{8m}{m+2}$$
        이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        $$T^{\prime}(m)=\frac{50}{(5-m)^2}-\frac{16}{(m+2)^2}=\frac{2(17m^2+180m-100)}{(5-m)^2(m+2)^2}$$
        이고 $T^{\prime}(m)$의 분모는 $0<m<5$에서 양수이므로,
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        $T(m)$은 $17m^2+180m-100=0$을 만족하는 $m$에서 최솟값을 갖는다(그 양근의 좌우에서 $T^{\prime}$의 부호가 $-$에서 $+$로 바뀜). 따라서 $m=\dfrac{-90+70\sqrt2}{17}$이다.
      criteria: ['3.A2']
