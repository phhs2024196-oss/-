stimuli:
- label: 가
  body: |
    함수 $y=f(x)$를 다음과 같이 정의하자.
    $$f(x)=\begin{cases}x^2(x+1) & (x\ge-1)\\ -x^2(x+1) & (x<-1)\end{cases}$$
    양의 실수 $t\,(t\ne1)$에 대하여 곡선 $y=f(x)$ 위의 점 $(-1-t,f(-1-t))$에서의 접선을 $\ell_1$, 곡선 $y=f(x)$ 위의 점 $(-1+t,f(-1+t))$에서의 접선을 $\ell_2$, 곡선 $y=f(x)$ 위의 점 $(-t,f(-t))$에서의 접선을 $\ell_3$, 곡선 $y=f(x)$ 위의 점 $(t,f(t))$에서의 접선을 $\ell_4$라 하자. 직선 $\ell_1$과 $\ell_2$의 교점의 $x$좌표를 $a(t)$라 하고 직선 $\ell_3$과 $\ell_4$의 교점을 $\mathrm{Q}$라 하자. 직선 $\ell_3$과 $x$축이 만나는 점을 $\mathrm{R}$, 직선 $\ell_4$와 $x$축이 만나는 점을 $\mathrm{V}$라 하고 삼각형 $\mathrm{QVR}$의 넓이를 $S(t)$라 하자. [그림 1]과 [그림 2]는 $t=\dfrac14$일 때를 나타낸다.

    [그림 1: 곡선 $y=f(x)$(점 $(-1,0)$에서 꺾여 $x<-1$에서 위로 솟고, $-1<x<0$에서 작은 봉우리, 원점에서 $x$축에 접한 뒤 증가)와 $x=-1$ 왼쪽 점에서의 접선 $\ell_1$(급한 음의 기울기), 오른쪽 점에서의 접선 $\ell_2$(완만한 양의 기울기)]
    [그림 2: 같은 곡선과 원점 부근의 두 접선 $\ell_3$(음의 기울기), $\ell_4$(양의 기울기)]
- label: 나
  body: |
    음이 아닌 정수 $p$와 $q$에 대하여 함수 $y=g(x)$를 다음과 같이 정의하자.
    $$g(x)=\begin{cases}q^2-(x-p)^2 & (p-q<x<p+q)\\ (x-p)^2-q^2 & (x\le p-q\ \text{또는}\ x\ge p+q)\end{cases}$$
    [그림 3]은 $p=10$, $q=5$인 경우를 나타낸다.

    [그림 3: $p=10$, $q=5$일 때 $y=g(x)$. $x=5$, $x=15$에서 $x$축에 닿아 꺾이고 그 사이에서 $x=10$일 때 높이 $25$인 위로 볼록한 포물선, 바깥쪽은 위로 증가. 세로 눈금 $5\sim40$, 가로 눈금 $5,10,15,20$]
- label: 다
  body: |
    함수 $y=h(x)$를 다음과 같이 정의하자.
    $$h(x)=\begin{cases}-5x-10 & (x<-2)\\ 2x+4 & (-2\le x<0)\\ -2x+4 & (0\le x<2)\\ 5x-10 & (x\ge2)\end{cases}$$

stem: |
  [문항 1] 【제시문】을 읽고 물음에 답하시오.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (20점) 제시문 (가)에 대한 다음 물음에 답하시오.

    (1) (10점) $\displaystyle\lim_{t\to\infty}a(t)$를 조사하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-5/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: $x>-1$과 $x<-1$에서 도함수가 다르므로 두 접선을 각각 쓰고 연립해 $a(t)=-\dfrac{5t^2+1}{3t^2+1}$을 얻는다.
    steps:
    - id: 1-1a
      content: |
        $\ell_1$, $\ell_2$를 연립하면 $a(t)=-\dfrac{5t^2+1}{3t^2+1}\to-\dfrac53$.
      criteria: ['1-1.M1', '1-1.A1', '1-1.A2']
    hint_ladder:
    - 점 $(-1-t,\cdot)$과 $(-1+t,\cdot)$은 각각 어느 식의 그래프 위에 있는가?
  - id: S1-1-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        $x>-1$에서 $f^{\prime}(x)=3x^2+2x$이고 $x<-1$에서 $f^{\prime}(x)=-3x^2-2x$이므로 양수 $t$에 대하여
        $\ell_1:\ y=-(3(t+1)^2-2(t+1))(x+(t+1))+(t+1)^3-(t+1)^2$,
        $\ell_2:\ y=(3(t-1)^2+2(t-1))(x-(t-1))+(t-1)^3+(t-1)^2$이다.
      criteria: ['1-1.M1']
    - id: 1-1b-2
      content: |
        두 직선의 교점의 $x$좌표를 구하면 $x=a(t)=-\dfrac{5t^2+1}{3t^2+1}$이다.
      criteria: ['1-1.A1']
    - id: 1-1b-3
      content: |
        따라서 $\displaystyle\lim_{t\to\infty}a(t)=-\dfrac53$이다.
      criteria: ['1-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 4
      evidence: |
        직선 $\ell_1$과 $\ell_2$의 방정식을 올바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.A1
      mark_type: A
      points: 4
      evidence: |
        교점의 $x$좌표 $a(t)=-\dfrac{5t^2+1}{3t^2+1}$을 올바르게 구했다.
      depends_on: [1-1.M1]
      steps: [1-1b-2]
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: |
        극한값 $-\dfrac53$을 올바르게 구했다.
      depends_on: [1-1.M1, 1-1.A1]
      steps: [1-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) (10점) $\displaystyle\lim_{t\to0+}\dfrac{S(t)}{t^k}$의 값이 $0$이 아닌 실수이기 위한 실수 $k$의 값과 그 극한값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'k=3; limit=1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: 작은 $t$에서 네 점 모두 $x>-1$쪽이므로 $f=x^3+x^2$의 접선 두 개로 $\mathrm{Q}$, $x$절편을 구하면 $S(t)=\dfrac{2t^3(3t^2-1)^2}{4-9t^2}$.
    steps:
    - id: 1-2a
      content: |
        $S(t)=\dfrac{2t^3(3t^2-1)^2}{4-9t^2}\sim\dfrac12t^3$이므로 $k=3$, 극한값 $\dfrac12$.
      criteria: ['1-2.M1', '1-2.A1', '1-2.A2']
    hint_ladder:
    - 삼각형의 밑변은 $x$축 위의 두 절편 사이, 높이는 $\mathrm{Q}$의 $y$좌표의 절댓값이다.
  - id: S1-2-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        충분히 작은 양수 $t$에 대하여
        $\ell_3:\ y=(3t^2-2t)(x+t)-t^3+t^2$, $\ell_4:\ y=(3t^2+2t)(x-t)+t^3+t^2$이다.
        직선 $\ell_3$과 $x$축의 교점은 $\mathrm{R}\left(-\dfrac{2t^2-t}{3t-2},0\right)$, 직선 $\ell_4$와 $x$축의 교점은 $\mathrm{V}\left(\dfrac{2t^2+t}{3t+2},0\right)$이다(모범답안은 이 점을 $\mathrm{T}$로 표기).
      criteria: ['1-2.M1']
    - id: 1-2b-2
      content: |
        직선 $\ell_3$과 $\ell_4$의 교점은 $\mathrm{Q}(t^2,3t^4-t^2)$이다. 따라서
        $$S(t)=\left\lvert\frac12\left(\frac{2t^2+t}{3t+2}+\frac{2t^2-t}{3t-2}\right)(3t^4-t^2)\right\rvert=\frac{2t^3(3t^2-1)^2}{4-9t^2}.$$
      criteria: ['1-2.A1']
    - id: 1-2b-3
      content: |
        $\displaystyle\lim_{t\to0+}\frac{S(t)}{t^k}=\lim_{t\to0+}\frac{2t^3(3t^2-1)^2}{t^k(4-9t^2)}$이므로 이 극한값이 $0$이 아닌 실숫값으로 존재하기 위한 $k$의 값은 $3$이고 $\displaystyle\lim_{t\to0+}\frac{S(t)}{t^k}=\frac12$이다.
      criteria: ['1-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 4
      evidence: |
        점 $\mathrm{R}$과 점 $\mathrm{V}$(모범답안의 $\mathrm{T}$)의 좌표를 올바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-1]
    - id: 1-2.A1
      mark_type: A
      points: 2
      evidence: |
        삼각형의 넓이 $S(t)=\dfrac{2t^3(3t^2-1)^2}{4-9t^2}$을 올바르게 구했다.
      depends_on: [1-2.M1]
      steps: [1-2b-2]
    - id: 1-2.A2
      mark_type: A
      points: 4
      evidence: |
        $k=3$과 극한값 $\dfrac12$을 올바르게 구했다.
      depends_on: [1-2.M1, 1-2.A1]
      steps: [1-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 1-2] (18점) 제시문 (나)에 대한 다음 물음에 답하시오.

    (1) (8점) $p=3$, $q=4$일 때, 곡선 $y=g(x)$와 직선 $y=20$으로 둘러싸인 도형의 넓이를 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '352/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: 교점 $x=-3,9$를 구하고 $[-3,-1]$, $[-1,7]$, $[7,9]$에서 각각 적분한다.
    steps:
    - id: 2-1a
      content: |
        $B=\displaystyle\int_{-3}^{9}(20-g(x))\,dx=\frac{352}{3}$.
      criteria: ['2-1.B1', '2-1.M1', '2-1.A1']
    hint_ladder:
    - $y=20$은 $g$의 어느 식과 만나는가?
  - id: S2-1-B
    audience: B
    source_flow: 모범답안 p.7~8
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        $p=3$, $q=4$이므로 곡선 $y=g(x)$와 직선 $y=20$은 $x\le-1$ 또는 $x\ge7$에서 만난다. 이 구간에서 $g(x)=(x-3)^2-16$이므로
        $(x-3)^2-16=20\Rightarrow(x-3)^2=36\Rightarrow x=-3$ 또는 $x=9$이다.
      criteria: ['2-1.B1']
    - id: 2-1b-2
      content: |
        곡선 $y=g(x)$와 직선 $y=20$으로 둘러싸인 도형의 넓이를 $B$라 하면
        $$B=\int_{-3}^{-1}(20-((x-3)^2-16))dx+\int_{-1}^{7}(20-(16-(x-3)^2))dx+\int_{7}^{9}(20-((x-3)^2-16))dx$$
      criteria: ['2-1.M1']
    - id: 2-1b-3
      content: |
        $$=\left[-\tfrac13x^3+3x^2+27x\right]_{-3}^{-1}+\left[\tfrac13x^3-3x^2+13x\right]_{-1}^{7}+\left[-\tfrac13x^3+3x^2+27x\right]_{7}^{9}=\frac{352}{3}$$
        이다.
      criteria: ['2-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.B1
      mark_type: B
      points: 2
      evidence: |
        $y=20$과 $y=g(x)$의 교점 $x=-3$, $x=9$를 올바르게 구했다.
      depends_on: []
      steps: [2-1b-1]
    - id: 2-1.M1
      mark_type: M
      points: 3
