- id: '2-2'
  stem: |
    (2) (12점) $\displaystyle\lim_{m\to\infty}\frac{S(m)}{m^{\alpha}}$의 값이 $0$이 아닌 실수이기 위한 실수 $\alpha$의 값과 그 극한값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: expression, value: 'alpha=1; limit=25/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{Q}\left(\dfrac{10m}{1+m^2},\dfrac{5(m^2-1)}{1+m^2}\right)$에서의 접선의 절편으로 $S(m)=\dfrac{25(m^2+1)^2}{4m(m^2-1)}\sim\dfrac{25}{4}m$.
    steps:
    - id: 2-2a
      content: |
        $\alpha=1$, 극한값 $\dfrac{25}{4}$.
      criteria: ['2-2.M1', '2-2.A1', '2-2.A2']
    hint_ladder:
    - 원 $x^2+y^2=r^2$ 위의 점 $(x_1,y_1)$에서의 접선은 $x_1x+y_1y=r^2$이다.
  - id: S2-2-B
    audience: B
    source_flow: 모범답안 p.12
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        점 $(0,-5)$를 지나고 기울기 $m$인 직선의 방정식은 $y=mx-5$이므로 점 $\mathrm{Q}$의 좌표는 $\left(\dfrac{10m}{1+m^2},\dfrac{5(m^2-1)}{1+m^2}\right)$이다. 원 $C$ 위의 점 $\mathrm{Q}$에서의 접선의 방정식은
        $$\frac{10m}{1+m^2}x+\frac{5(m^2-1)}{1+m^2}y=25$$
        이고,
      criteria: ['2-2.M1']
    - id: 2-2b-2
      content: |
        $$S(m)=\frac12\times\frac{5(1+m^2)}{2m}\times\frac{5(1+m^2)}{m^2-1}=\frac{25(m^2+1)^2}{4m(m^2-1)}$$
        이다($m\to\infty$를 보므로 $m>1$로 생각).
      criteria: ['2-2.A1']
    - id: 2-2b-3
      content: |
        따라서 $\displaystyle\lim_{m\to\infty}\frac{S(m)}{m^{\alpha}}$이 $0$이 아닌 실수로 존재하기 위한 $\alpha$의 값은 $1$이고 이때의 극한값은 $\dfrac{25}{4}$이다.
      criteria: ['2-2.A2']
