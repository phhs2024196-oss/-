stimuli:
- label: 가
  body: |
    양의 실수 $c$에 대하여 점 $\mathrm{B}$의 좌표를 $(c,0)$이라 하고, $0\le t\le4$인 실수 $t$에 대하여 다음과 같이 정의된 두 함수 $f(t)$, $g(t)$를 생각하자.
    $$f(t)=\begin{cases}-\dfrac14t-2 & (0\le t\le2)\\ -\dfrac52+\sin2\pi t & (2<t\le4)\end{cases}\qquad g(t)=\begin{cases}4 & (0\le t\le3)\\ 4+\sin2\pi t & (3<t\le4)\end{cases}$$
    점 $\mathrm{B}$를 지나고 기울기가 $f(t)$, $g(t)$인 직선을 각각 $\ell_1$, $\ell_2$라 하자. 점 $\mathrm{A}$는 직선 $\ell_1$과 $y$축의 교점이고, 제1사분면 위의 점 $\mathrm{P}$는 직선 $\ell_2$ 위에 있다. 삼각형 $\mathrm{ABP}$의 외접원의 반지름의 길이를 $R$이라 하자.
    [그림 4]는 $c=\sqrt5$, $t=0$, 점 $\mathrm{P}$의 $x$좌표가 $3$일 때를 나타낸다.

    [그림 4: $y$축 위의 점 $\mathrm{A}$에서 $x$축 위의 점 $\mathrm{B}$로 내려가는 직선 $\ell_1$과, $\mathrm{B}$에서 오른쪽 위로 가파르게 올라가는 직선 $\ell_2$ 위의 점 $\mathrm{P}$]
- label: 나
  body: |
    원점을 중심으로 하고 반지름의 길이가 $5$인 원 $C$를 생각하자. 양수 $m\,(m\ne1)$에 대하여 점 $(0,-5)$를 지나고 기울기가 $m$인 직선이 원 $C$와 만나는 점 중 $x$좌표가 $0$이 아닌 것을 $\mathrm{Q}$라 하자. 원 $C$ 위의 점 $\mathrm{Q}$에서의 접선과 $x$축, $y$축으로 둘러싸인 삼각형의 넓이를 $S(m)$이라 하자. [그림 5]는 $m=3$일 때 원 $C$ 위의 점 $\mathrm{Q}$에서의 접선 및 그 접선이 좌표축과 만나는 점들을 나타낸다.

    [그림 5: 원 $C$(눈금 $5$, $-5$), 점 $(0,-5)$에서 오른쪽 위로 올라가 제1사분면의 점 $\mathrm{Q}$에서 원과 만나는 직선, $\mathrm{Q}$에서의 접선이 $y$축 양의 부분과 $x$축 양의 부분($x>5$)과 만남]

stem: |
  [문항 2] 【제시문】을 읽고 물음에 답하시오.

subparts:
- id: '1-1'
  stem: |
    [문제 2-1] (30점) 제시문 (가)에 대한 다음 물음에 답하시오. (단, $0\le t\le4$)

    (1) (8점) $c=\dfrac{\sqrt{10}}{2}$일 때, $\overline{\mathrm{AB}}=5$가 되는 $t$의 값을 모두 구하시오.
  points: 8
  depends_on: []
  answer: {kind: set, value: '{31/12, 35/12, 43/12, 47/12}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{AB}}=c\sqrt{1+f(t)^2}=5\iff f(t)=-3$이고, $[0,2]$에서는 $f>-3$이므로 $\sin2\pi t=-\dfrac12$를 $(2,4]$에서 푼다.
    steps:
    - id: 1-1a
      content: |
        $t=\dfrac{31}{12},\dfrac{35}{12},\dfrac{43}{12},\dfrac{47}{12}$.
      criteria: ['1-1.M1', '1-1.A1']
    hint_ladder:
    - $\overline{\mathrm{OA}}=c\lvert f(t)\rvert$이다.
  - id: S1-1-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        점 $\mathrm{B}$의 좌표가 $\left(\dfrac{\sqrt{10}}{2},0\right)$이고 점 $\mathrm{A}$는 직선 $\ell_1$과 $y$축의 교점이므로 직선 $\ell_1$의 기울기 $f(t)$가 $-3$일 때 $\overline{\mathrm{AB}}=5$임을 알 수 있다($\overline{\mathrm{AB}}^2=c^2(1+f(t)^2)=\tfrac{10}{4}\cdot10$). $0\le t\le2$인 실수 $t$에서 $-\dfrac14t-2>-3$이므로 $-\dfrac52+\sin2\pi t=-3$을 만족시키는 $t$의 값을 $2<t\le4$ 범위에서 모두 구하면 된다.
      criteria: ['1-1.M1']
    - id: 1-1b-2
      content: |
        $\sin2\pi t=-\dfrac12$, $4\pi<2\pi t\le8\pi$이므로 따라서 $t=\dfrac{31}{12}$, $t=\dfrac{35}{12}$, $t=\dfrac{43}{12}$, $t=\dfrac{47}{12}$이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 4
      evidence: |
        기울기 $f(t)$가 $-3$임을 관찰하여 $-\dfrac52+\sin2\pi t=-3$을 썼다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.A1
      mark_type: A
      points: 4
      evidence: |
        이를 이용하여 $t=\dfrac{31}{12},\dfrac{35}{12},\dfrac{43}{12},\dfrac{47}{12}$을 구했다.
      depends_on: [1-1.M1]
      steps: [1-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) (10점) $\overline{\mathrm{BP}}=s$라 하자. $c=\sqrt5$, $t=0$일 때, $\displaystyle\lim_{s\to0+}R$을 조사하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '5*sqrt(85)/12', equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: 각 $\mathrm{ABP}$는 $s$와 무관하게 $\tan\beta=\dfrac67$이고, $s\to0+$이면 $\overline{\mathrm{AP}}\to\overline{\mathrm{AB}}=5$이므로 $R\to\dfrac{5}{2\sin\beta}$.
    steps:
    - id: 1-2a
      content: |
        $\sin\beta=\dfrac{6}{\sqrt{85}}$, $R\to\dfrac{5\sqrt{85}}{12}$.
      criteria: ['1-2.B1', '1-2.M1', '1-2.A1']
    hint_ladder:
    - 세 점 중 두 점이 가까워질 때 사인법칙에서 변하지 않는 것은?
  - id: S1-2-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        각 $\mathrm{ABP}$의 크기를 $\beta$라 하자. $t=0$일 때, 점 $\mathrm{A}$, $\mathrm{B}$, $\mathrm{P}$의 좌표는 각각 $(0,2\sqrt5)$, $(\sqrt5,0)$, $\left(\sqrt5+\dfrac{s}{\sqrt{17}},\dfrac{4s}{\sqrt{17}}\right)$이다.
      criteria: ['1-2.B1']
    - id: 1-2b-2
      content: |
        $$\tan\beta=\frac{(-2)-4}{1+(-2)\times4}=\frac67,\quad\sin\beta=\frac{6}{\sqrt{85}},\quad\overline{\mathrm{AP}}=\sqrt{\left(\sqrt5+\frac{s}{\sqrt{17}}\right)^2+\left(2\sqrt5-\frac{4s}{\sqrt{17}}\right)^2}$$
        임을 알 수 있다.
      criteria: ['1-2.M1']
    - id: 1-2b-3
      content: |
        사인법칙에 의해
        $$R=\frac{\overline{\mathrm{AP}}}{2\sin\beta}=\frac{\sqrt{85}}{12}\sqrt{\left(\sqrt5+\frac{s}{\sqrt{17}}\right)^2+\left(2\sqrt5-\frac{4s}{\sqrt{17}}\right)^2}$$
        이다. 따라서 $\displaystyle\lim_{s\to0+}R=\frac{\sqrt{85}}{12}\lim_{s\to0+}\sqrt{\left(\sqrt5+\frac{s}{\sqrt{17}}\right)^2+\left(2\sqrt5-\frac{4s}{\sqrt{17}}\right)^2}=\frac{5\sqrt{85}}{12}$이다.
      criteria: ['1-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.B1
      mark_type: B
      points: 2
      evidence: |
        점 $\mathrm{A}$와 $\mathrm{P}$의 좌표를 구했다.
      depends_on: []
      steps: [1-2b-1]
    - id: 1-2.M1
      mark_type: M
      points: 4
      evidence: |
        $\tan\beta=\dfrac67$을 구하고 $\sin\beta=\dfrac{6}{\sqrt{85}}$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-2]
    - id: 1-2.A1
      mark_type: A
      points: 4
      evidence: |
        $R$을 구하고 극한값 $\dfrac{5\sqrt{85}}{12}$를 올바르게 구했다.
      depends_on: [1-2.M1]
      steps: [1-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    (3) (12점) 두 직선 $\ell_1$과 $\ell_2$가 이루는 예각의 크기의 최솟값을 $\theta$라 할 때, $\tan\theta$의 값을 구하시오.
  points: 12
  depends_on: ['1-2']
  answer: {kind: value, value: '15/26', equivalents: [], tolerance: null}
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: 세 구간에서 $\tan\beta$의 최솟값 $\dfrac{13}{18}$, $\dfrac{15}{26}$, $\dfrac{104}{153}$을 비교한다.
    steps:
    - id: 1-3a
      content: |
        $\min\left\{\dfrac{13}{18},\dfrac{15}{26},\dfrac{104}{153}\right\}=\dfrac{15}{26}$.
      criteria: ['1-3.B1', '1-3.B2', '1-3.B3', '1-3.B4']
    hint_ladder:
    - 예각이 작을수록 탄젠트 값도 작다.
    - $3<t\le4$에서는 분모를 $\sin2\pi t$에 대한 이차식으로 보자.
  - id: S1-3-B
    audience: B
    source_flow: 모범답안 p.10~11
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        (2)에서 정의된 $\beta$에 대해 $\tan\beta=\dfrac{f(t)-g(t)}{1+f(t)g(t)}\ (0\le t\le4)$이다.
        ① $0\le t\le2$인 경우
        $$\tan\beta=\frac{\left(-\frac14t-2\right)-4}{1+\left(-\frac14t-2\right)\times4}=\frac14\left(1+\frac{17}{t+7}\right)$$
        이다. 닫힌구간 $[0,2]$에서 $\dfrac14\left(1+\dfrac{17}{t+7}\right)\ge\dfrac14\left(1+\dfrac{17}{2+7}\right)=\dfrac{13}{18}$이므로 $\tan\beta\ge\dfrac{13}{18}$이다.
      criteria: ['1-3.B1']
    - id: 1-3b-2
      content: |
        ② $2<t\le3$인 경우
        $$\tan\beta=\frac{\left(-\frac52+\sin2\pi t\right)-4}{1+\left(-\frac52+\sin2\pi t\right)\times4}=\frac14\left(1+\frac{17}{9-4\sin2\pi t}\right)$$
        이고 $4\sin2\pi t\ge4\sin\left(2\pi\times\dfrac{11}{4}\right)=-4$이므로 $\tan\beta\ge\dfrac{15}{26}$이다.
      criteria: ['1-3.B2']
    - id: 1-3b-3
      content: |
        ③ $3<t\le4$인 경우
        $$\tan\beta=\frac{\left(-\frac52\right)-4}{1+\left(-\frac52+\sin2\pi t\right)\times(4+\sin2\pi t)}=\frac{\frac{13}{2}}{-\sin^22\pi t-\frac32\sin2\pi t+9}$$
        이고 $-\sin^22\pi t-\dfrac32\sin2\pi t+9=-\left(\sin2\pi t+\dfrac34\right)^2+\dfrac{153}{16}\le\dfrac{153}{16}$이므로 $\tan\beta\ge\dfrac{104}{153}$이다.
      criteria: ['1-3.B3']
    - id: 1-3b-4
      content: |
        ①, ②, ③으로부터 $\tan\beta>0$이므로 $\beta$는 예각임을 알 수 있다. 각 $\mathrm{ABP}$의 크기 $\beta$의 최솟값이 $\theta$이므로 $\tan\theta=\dfrac{15}{26}$이다.
      criteria: ['1-3.B4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.B1
      mark_type: B
      points: 3
      evidence: |
        $0\le t\le2$인 경우 $\tan\beta$의 최솟값 $\dfrac{13}{18}$을 올바르게 구했다.
      depends_on: []
      steps: [1-3b-1]
    - id: 1-3.B2
      mark_type: B
      points: 3
      evidence: |
        $2<t\le3$인 경우 $\tan\beta$의 최솟값 $\dfrac{15}{26}$을 올바르게 구했다.
      depends_on: []
      steps: [1-3b-2]
    - id: 1-3.B3
      mark_type: B
      points: 4
      evidence: |
