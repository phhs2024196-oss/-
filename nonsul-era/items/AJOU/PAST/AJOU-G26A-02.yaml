intent: |
  [문제 2-1] 삼각함수가 포함된 방정식의 해를 구할 수 있는지를 평가하는 문제이다. 그리고 삼각함수를 활용하여 함수의 극한 및 두 직선이 이루는 각의 크기를 구할 수 있는지를 평가하는 문제이다. [문제 2-2] 삼각함수를 활용하여 두 직선이 이루는 각의 크기를 구할 수 있는지를 평가하는 문제이다. 그리고 원 위의 점에서의 접선의 방정식을 구하고 함수의 극한을 구할 수 있는지를 평가하는 문제이다. (선행학습영향평가 보고서 문항카드 원문)
key_idea: |
  기울기가 $f(t)$, $g(t)$인 두 직선이 이루는 각은 탄젠트의 덧셈정리 $\tan\beta=\dfrac{f-g}{1+fg}$로 다루고, 외접원 반지름은 사인법칙 $R=\dfrac{\overline{\mathrm{AP}}}{2\sin\beta}$로 구한다. 원 위 두 점이 만드는 호는 원주각의 2배인 중심각으로 구한다.
stuck: |
  [문제 2-1](3)에서 $t$의 세 구간마다 $\tan\beta$를 정리하고, $3<t\le4$에서는 $\sin2\pi t$에 대한 이차식의 최댓값으로 하한을 구하는 단계
