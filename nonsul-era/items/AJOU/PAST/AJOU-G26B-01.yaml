- id: '2-1'
  stem: |
    [문제 1-2] (25점) 제시문 (나)에 대한 다음 물음에 답하시오.

    (1) (10점) $n=16$일 때, 직선 $m_8$과 직선 $m_j\,(j=1,\cdots,7,9,\cdots,15)$의 교점의 $x$좌표를 각각 $p_j$라 하자. $\displaystyle\sum_{j=1}^{7}p_j+\sum_{j=9}^{15}p_j$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '7/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: $m_{8-k}$와 $m_{8+k}$는 $y=x$에 대해 대칭이고 $m_8:\ x+y=\tfrac12$ 위의 두 교점은 서로 뒤바뀐 좌표이므로 $p_{8-k}+p_{8+k}=\tfrac12$.
    steps:
    - id: 2-1a
      content: |
        $7\times\dfrac12=\dfrac72$.
      criteria: ['2-1.B1', '2-1.B2', '2-1.A1']
    hint_ladder:
    - $m_{8-k}$와 $m_{8+k}$의 절편을 비교해 보자.
  - id: S2-1-B
    audience: B
    source_flow: 모범답안 p.8
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        직선 $m_8$과 $m_j$의 교점의 $x$좌표를 $p_j$라 하자. 직선 $m_8$의 방정식은 $x+y=\dfrac12$, $1\le k\le7$인 자연수 $k$에 대해 직선 $m_{8-k}$의 방정식은 $\dfrac{1}{8-k}x+\dfrac{1}{8+k}y=\dfrac1{16}$이므로 $p_{8-k}=\dfrac{8-k}{32}$이다.
      criteria: ['2-1.B1']
    - id: 2-1b-2
      content: |
        직선 $m_{8+k}$의 방정식은 $\dfrac{1}{8+k}x+\dfrac{1}{8-k}y=\dfrac{1}{16}$이므로 $p_{8+k}=\dfrac{8+k}{32}$이다.
      criteria: ['2-1.B2']
    - id: 2-1b-3
      content: |
        따라서 $p_{8-k}+p_{8+k}=\dfrac12$이므로 모든 교점의 $x$좌표의 합은
        $$(p_1+\cdots+p_7)+(p_9+\cdots+p_{15})=(p_1+p_{15})+(p_2+p_{14})+\cdots+(p_7+p_9)=\frac72$$
        이다.
      criteria: ['2-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.B1
      mark_type: B
      points: 4
      evidence: |
        $1\le j\le7$일 때 $p_j$($p_{8-k}=\dfrac{8-k}{32}$)를 구했다.
      depends_on: []
      steps: [2-1b-1]
    - id: 2-1.B2
      mark_type: B
      points: 4
      evidence: |
        $9\le j\le15$일 때 $p_j$($p_{8+k}=\dfrac{8+k}{32}$)를 구했다.
      depends_on: []
      steps: [2-1b-2]
    - id: 2-1.A1
      mark_type: B
      points: 2
      evidence: |
        답 $\dfrac72$를 올바르게 계산했다.
      depends_on: []
      steps: [2-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    (2) (15점) $3$ 이상의 자연수 $n$에 대하여 $T_n=\displaystyle\sum_{j=1}^{n-1}s_j$라 할 때, $\displaystyle\lim_{n\to\infty}T_n$을 조사하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '1/6', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $s_i$는 밑변 $\dfrac1n$, 높이가 이웃 두 직선 교점의 $y$좌표 $\dfrac{(n-i+1)(n-i)}{n^2}$인 삼각형.
    steps:
    - id: 2-2a
      content: |
        $T_n=\dfrac{n-1}{2n^2}+\dfrac{n(n-1)(n-2)}{6n^3}\to\dfrac16$.
      criteria: ['2-2.B1', '2-2.M1', '2-2.A1', '2-2.A2']
    hint_ladder:
    - $s_i$를 이루는 삼각형의 밑변은 $x$축 위의 $\left[\tfrac{i-1}{n},\tfrac in\right]$이다.
  - id: S2-2-B
    audience: B
    source_flow: 모범답안 p.8~9
    method_no: 1
    steps:
    - id: 2-2b-0
      content: |
        $s_1$은 밑변 $\dfrac1n$, 높이 $\dfrac{n-1}{n}$인 직각삼각형의 넓이이므로 $s_1=\dfrac{1}{2n}\cdot\dfrac{n-1}{n}$이다.
      criteria: ['2-2.B1']
    - id: 2-2b-1
      content: |
        직선 $m_i$와 $m_{i-1}$의 교점은 연립방정식
        $$\begin{cases}\dfrac1ix+\dfrac{1}{n-i}y=\dfrac1n\\ \dfrac{1}{i-1}x+\dfrac{1}{n-i+1}y=\dfrac1n\end{cases}$$
        의 해이므로 교점의 $y$좌표는 $\dfrac{(n-i+1)(n-i)}{n^2}$이다.
      criteria: ['2-2.M1']
    - id: 2-2b-2
      content: |
        구하는 도형의 넓이는
        $$T_n=\frac{1}{2n}\cdot\frac{n-1}{n}+\sum_{i=2}^{n-1}\frac{1}{2n}\cdot\frac{(n-i+1)(n-i)}{n^2}=\frac{n-1}{2n^2}+\frac{1}{2n^3}\left(\sum_{i=1}^{n-1}(n^2-2ni+i^2+n-i)-(n^2-n)\right)=\frac{n-1}{2n^2}+\frac{n(n-1)(n-2)}{6n^3}$$
        이다.
      criteria: ['2-2.A1']
    - id: 2-2b-3
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}T_n=\frac16$이다.
      criteria: ['2-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.B1
      mark_type: B
      points: 2
      evidence: |
        $s_1=\dfrac{n-1}{2n^2}$을 올바르게 계산했다.
      depends_on: []
      steps: [2-2b-0]
    - id: 2-2.M1
      mark_type: M
      points: 4
      evidence: |
        교점의 $y$좌표 $\dfrac{(n-i+1)(n-i)}{n^2}$을 올바르게 계산했다.
      depends_on: []
      implied_ok: false
      steps: [2-2b-1]
    - id: 2-2.A1
      mark_type: A
      points: 6
      evidence: |
        $T_n=\dfrac{n-1}{2n^2}+\dfrac{n(n-1)(n-2)}{6n^3}$을 올바르게 구했다.
      depends_on: [2-2.M1]
      steps: [2-2b-2]
    - id: 2-2.A2
      mark_type: A
      points: 3
      evidence: |
        극한 $\dfrac16$을 올바르게 계산했다.
      depends_on: [2-2.M1, 2-2.A1]
      steps: [2-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
