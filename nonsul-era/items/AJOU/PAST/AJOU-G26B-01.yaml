intent: |
  [문제 1-1] 원의 성질을 이용하여 원의 방정식을 작성하고, 이를 이용하여 등비급수를 올바르게 계산할 수 있는지, 삼각함수의 덧셈정리를 이용하여 주어진 사각형의 넓이를 삼각형 넓이의 합으로 구할 수 있는지를 평가하는 문제이다. [문제 1-2] 직선의 방정식을 활용하여 직선의 교점을 계산하고 교점의 좌표의 합을 계산할 수 있는지, 교점을 활용하여 삼각형의 넓이를 계산하고 급수에 대한 정의를 이해하고 급수의 합을 구할 수 있는지를 평가하는 문제이다. (선행학습영향평가 보고서 문항카드 원문)
key_idea: |
  한 점에서 같은 점을 지나는 여러 직선에 내린 수선의 발은 그 점과 공통점을 지름의 양 끝으로 하는 원 위에 있다(직각 → 지름). 대칭인 두 직선 $m_{8-k}$, $m_{8+k}$의 교점 $x$좌표 합은 일정하다. 이웃한 두 직선의 교점으로 작은 삼각형 넓이를 구해 합을 정리한다.
stuck: |
  [문제 1-1](1)(2)에서 수선의 발이 지름 $\overline{\mathrm{OP_1}}$(또는 $\overline{\mathrm{QP_1}}$)인 원 위에 있음을 관찰하는 발상, [문제 1-1](3)에서 원점·$\mathrm{A}$·$\mathrm{P_3}$이 한 직선 위에 있음을 이용해 사각형을 두 삼각형 넓이의 차로 쪼개는 단계
