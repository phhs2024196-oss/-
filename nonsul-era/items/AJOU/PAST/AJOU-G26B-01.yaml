# 아주대 2026학년도 논술고사 자연계열(오후) 문항 1 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 공식 모범답안 p.2(PDF p.8) [문제 1-1](3) 채점기준 아래에 편집 메모로 보이는 「**사인법칙 이용한 풀이?**」와
#   sin(5π/12) 를 쓰는 두 번째 채점기준(배점 동일 4·2·6)이 그대로 인쇄되어 있다. 별해 본문은 없음 — 채점기준만 원문대로 1벌 채택.
#   [판독확인: 모범답안 편집 잔여물(사인법칙 별해 채점기준만 있고 풀이 없음)]
