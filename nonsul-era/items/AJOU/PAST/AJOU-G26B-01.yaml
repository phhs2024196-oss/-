stimuli:
- label: 가
  body: |
    $8$ 이상의 자연수 $n$에 대하여 중심이 원점이고 반지름의 길이가 $1$인 원 $C$ 위의 점 $\mathrm{P}_1,\mathrm{P}_2,\cdots,\mathrm{P}_n$을 생각하자. 이때 점 $\mathrm{P}_1$의 좌표는 $(0,1)$이고 점 $\mathrm{P}_1,\mathrm{P}_2,\cdots,\mathrm{P}_n,\mathrm{P}_1$을 차례로 이어서 만든 도형은 정$n$각형을 이룬다. 점 $\mathrm{P}_1$과 $\mathrm{P}_2$를 지나는 직선을 $L_1$, 점 $\mathrm{P}_1$과 $\mathrm{P}_3$을 지나는 직선을 $L_2$, 점 $\mathrm{P}_1$과 $\mathrm{P}_4$를 지나는 직선을 $L_3$이라 하자. 이때 원점에서 직선 $L_1$, $L_2$, $L_3$에 내린 수선의 발을 각각 $\mathrm{H}_1$, $\mathrm{H}_2$, $\mathrm{H}_3$이라 하자.
    점 $\mathrm{P}_1$과 $\mathrm{P}_4$를 지나는 직선을 $\ell_1$, 점 $\mathrm{P}_2$와 $\mathrm{P}_5$를 지나는 직선을 $\ell_2$, 점 $\mathrm{P}_3$과 $\mathrm{P}_6$을 지나는 직선을 $\ell_3$이라 하자. 직선 $\ell_1$과 $\ell_2$의 교점을 $\mathrm{A}$, 직선 $\ell_1$과 $\ell_3$의 교점을 $\mathrm{B}$라 하자.
    [그림 1]과 [그림 2]는 $n=8$일 때를 나타낸다.

    [그림 1: $n=8$. 단위원 위에 $\mathrm{P}_1(0,1)$부터 시계 방향으로 $\mathrm{P}_2,\cdots,\mathrm{P}_8$($\mathrm{P}_3=(1,0)$, $\mathrm{P}_5=(0,-1)$, $\mathrm{P}_7=(-1,0)$). $\mathrm{P}_1$에서 나가는 직선 $L_1,L_2,L_3$과 원점에서 그은 수선의 발 $\mathrm{H}_1,\mathrm{H}_2,\mathrm{H}_3$(점선, 직각 표시)]
    [그림 2: $n=8$. 직선 $\ell_1=\mathrm{P_1P_4}$, $\ell_2=\mathrm{P_2P_5}$, $\ell_3=\mathrm{P_3P_6}$과 교점 $\mathrm{A}$($x$축 부근 제1사분면), $\mathrm{B}$(제4사분면)]
- label: 나
  body: |
    $3$ 이상의 자연수 $n$에 대하여 점 $\left(\dfrac{j}{n},0\right)$과 점 $\left(0,\dfrac{n-j}{n}\right)$를 지나는 직선을 $m_j$라 하자. (단, $j$는 $n$보다 작은 자연수이다.) 직선 $m_1$과 $x$축 및 $y$축으로 둘러싸인 도형의 넓이를 $s_1$, 직선 $m_{i-1}$과 $m_i$ 및 $x$축으로 둘러싸인 도형의 넓이를 $s_i$라 하자. (단, $i=2,\cdots,n-1$)
    [그림 3]은 $n=8$일 때를 나타낸다.

    [그림 3: $n=8$. 제1사분면에서 $x$절편과 $y$절편의 합이 $1$인 직선 $m_1,\cdots,m_7$이 원점 쪽으로 오목한 곡선 모양(포락선)을 이루며 겹쳐 그려짐. 축 눈금 $1$]

stem: |
  [문항 1] 【제시문】을 읽고 물음에 답하시오.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (25점) 제시문 (가)에 대한 다음 물음에 답하시오.

    (1) (5점) $n=8$일 때, 세 점 $\mathrm{H}_1$, $\mathrm{H}_2$, $\mathrm{H}_3$을 지나는 원의 방정식을 구하시오.
  points: 5
  depends_on: []
  answer: {kind: expression, value: 'x**2+(y-1/2)**2-1/4', equivalents: ['x**2+y**2-y'], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: $\angle\mathrm{OH}_i\mathrm{P}_1=90^\circ$이므로 세 점은 지름이 $\overline{\mathrm{OP}_1}$인 원 위에 있다.
    steps:
    - id: 1-1a
      content: |
        $x^2+\left(y-\dfrac12\right)^2=\dfrac14$.
      criteria: ['1-1.R1', '1-1.A1']
    hint_ladder:
    - 세 삼각형 $\mathrm{OH}_i\mathrm{P}_1$의 공통점은?
  - id: S1-1-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        삼각형 $\mathrm{OH_1P_1}$, $\mathrm{OH_2P_1}$, $\mathrm{OH_3P_1}$은 모두 빗변이 $\mathrm{OP_1}$인 직각삼각형이므로, 점 $\mathrm{H}_1$, $\mathrm{H}_2$, $\mathrm{H}_3$은 지름이 $\overline{\mathrm{OP_1}}$인 원 위에 있다.
      criteria: ['1-1.R1']
    - id: 1-1b-2
      content: |
        따라서 구하는 원의 방정식은 $x^2+\left(y-\dfrac12\right)^2=\dfrac14$이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.R1
      mark_type: R
      points: 3
      evidence: |
        점 $\mathrm{H}_1$, $\mathrm{H}_2$, $\mathrm{H}_3$은 지름이 $\overline{\mathrm{OP_1}}$인 원 위에 있음을 관찰했다.
      depends_on: []
      steps: [1-1b-1]
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        원의 방정식 $x^2+\left(y-\dfrac12\right)^2=\dfrac14$를 올바르게 구했다.
      depends_on: [1-1.R1]
      steps: [1-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) (8점) $n=10$일 때, 자연수 $k$에 대하여 점 $\left(0,1-3\left(\dfrac29\right)^k\right)$에서 세 직선 $L_1$, $L_2$, $L_3$에 내린 수선의 발을 모두 지나는 원의 넓이를 $S_k$라 할 때 $\displaystyle\sum_{k=1}^{\infty}S_k$를 조사하시오.
  points: 8
  depends_on: ['1-1']
  answer: {kind: value, value: '9*pi/77', equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: (1)과 같은 이유로 지름이 $\overline{\mathrm{QP_1}}=3\left(\tfrac29\right)^k$인 원이므로 $S_k=\dfrac94\left(\dfrac4{81}\right)^k\pi$.
    steps:
    - id: 1-2a
      content: |
        $\displaystyle\sum_{k=1}^{\infty}S_k=\frac{\frac19\pi}{1-\frac4{81}}=\frac{9}{77}\pi$.
      criteria: ['1-2.R1', '1-2.A1', '1-2.A2']
    hint_ladder:
    - 원점 대신 $y$축 위의 다른 점에서 수선을 내려도 같은 관찰이 성립한다.
  - id: S1-2-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        점 $\mathrm{Q}$의 좌표를 $\left(0,1-3\left(\dfrac29\right)^k\right)$라 하자. [문제 1-1]의 (1)과 같은 방법으로 점 $\mathrm{Q}$에서 직선 $L_1$, $L_2$, $L_3$에 내린 수선의 발을 지나는 원은 지름이 $\overline{\mathrm{QP_1}}$인 원이다.
      criteria: ['1-2.R1']
    - id: 1-2b-2
      content: |
        따라서 $S_k=\pi\left(\dfrac12\times3\left(\dfrac29\right)^k\right)^2=\dfrac94\left(\dfrac4{81}\right)^k\pi$이므로
      criteria: ['1-2.A1']
    - id: 1-2b-3
      content: |
        등비급수의 합의 공식에 의해 $\displaystyle\sum_{k=1}^{\infty}S_k=\frac{\frac19\pi}{1-\frac{4}{81}}=\frac{9}{77}\pi$이다.
      criteria: ['1-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.R1
      mark_type: R
      points: 2
      evidence: |
        원의 지름이 $\overline{\mathrm{QP_1}}$임을 관찰했다.
      depends_on: []
      steps: [1-2b-1]
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        $S_k=\dfrac94\left(\dfrac4{81}\right)^k\pi$를 올바르게 구했다.
      depends_on: [1-2.R1]
      steps: [1-2b-2]
    - id: 1-2.A2
      mark_type: A
      points: 3
      evidence: |
        등비급수의 합 $\dfrac{9}{77}\pi$를 올바르게 구했다.
      depends_on: [1-2.R1, 1-2.A1]
      steps: [1-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    (3) (12점) $n=12$일 때, 사각형 $\mathrm{P_2ABP_3}$의 넓이를 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '(15-8*sqrt(3))/12', equivalents: [], tolerance: null}
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{O}$, $\mathrm{A}$, $\mathrm{P}_3$이 한 직선 위에 있으므로 사각형 넓이 $=(\triangle\mathrm{OP_3P_2}-\triangle\mathrm{OAP_2})+(\triangle\mathrm{OBP_3}-\triangle\mathrm{OBA})$.
    steps:
    - id: 1-3a
      content: |
        $T_1=\dfrac14(2-\sqrt3)$, $T_2=\dfrac{9-5\sqrt3}{12}$, 합 $\dfrac{15-8\sqrt3}{12}$.
      criteria: ['1-3.B1', '1-3.M1', '1-3.A1', '1-3.A2']
    hint_ladder:
    - 점 $\mathrm{A}$의 좌표를 구하면 어떤 세 점이 한 직선 위에 있는가?
  - id: S1-3-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        점 $\mathrm{A}$의 좌표는 $\left(\dfrac{3-\sqrt3}{2},\dfrac{\sqrt3-1}{2}\right)$이므로 원점, 점 $\mathrm{A}$, 점 $\mathrm{P}_3$은 한 직선 위에 있다. $\overline{\mathrm{OA}}=\sqrt3-1$이다. 점 $\mathrm{B}$의 좌표는 $\left(\dfrac{3+\sqrt3}{6},\dfrac{3-\sqrt3}{6}\right)$이므로 $\overline{\mathrm{OB}}=\dfrac{\sqrt6}{3}$이다.
      criteria: ['1-3.B1']
    - id: 1-3b-2
      content: |
        삼각형 $\mathrm{P_2AP_3}$의 넓이 $T_1$은 삼각형 $\mathrm{OP_3P_2}$의 넓이에서 삼각형 $\mathrm{OAP_2}$의 넓이를 뺀 것과 같다.
        $$T_1=\frac12\sin\frac{\pi}{6}-\frac12(\sqrt3-1)\sin\frac{\pi}{6}=\frac14(2-\sqrt3)$$
        이다.
      criteria: ['1-3.A1']
    - id: 1-3b-3
      content: |
        삼각함수의 덧셈정리에 의하여 $\sin\dfrac{\pi}{12}=\sin\left(\dfrac{\pi}{3}-\dfrac{\pi}{4}\right)=\dfrac{\sqrt6-\sqrt2}{4}$이다.
      criteria: ['1-3.M1']
    - id: 1-3b-4
      content: |
        삼각형 $\mathrm{ABP_3}$의 넓이 $T_2$는 삼각형 $\mathrm{OBP_3}$의 넓이에서 삼각형 $\mathrm{OBA}$의 넓이를 뺀 것과 같으므로
        $$T_2=\frac12\cdot\frac{\sqrt6}{3}\sin\frac{\pi}{12}-\frac12\cdot\frac{\sqrt6}{3}(\sqrt3-1)\sin\frac{\pi}{12}=\frac{\sqrt6}{6}\cdot\frac{\sqrt6-\sqrt2}{4}(2-\sqrt3)=\frac{9-5\sqrt3}{12}$$
        이다. 사각형 $\mathrm{P_2ABP_3}$의 넓이는 $T_1$과 $T_2$의 합이므로 $\dfrac{15-8\sqrt3}{12}$이다.
      criteria: ['1-3.A2']
  rubric:
