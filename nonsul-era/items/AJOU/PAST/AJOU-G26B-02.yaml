intent: |
  [문제 2-1] 주어진 점과 원점 사이의 거리를 구하고, 삼각함수의 성질을 이용하여 거리의 최솟값을 계산할 수 있는지, 그 최솟값을 갖는 점의 개수를 주어진 범위에서 찾을 수 있는지를 평가하는 문제이다. [문제 2-2] 두 점 사이의 거리를 계산하고 정리하여 문제에 주어진 조건에 적용하여 지나는 점의 좌표를 추론하고 삼각함수의 성질을 이용하여 값을 정리할 수 있는지, 두 점 사이의 관계를 이용하여 삼각형과 부채꼴의 넓이를 계산할 수 있는지를 평가하는 문제이다. [문제 2-3] 주어진 함수의 도함수를 구하고 이를 이용하여 삼각함수의 그래프와 이차부등식의 이해를 바탕으로 주어진 구간에서 함수가 증가할 때 미정계수의 값을 구할 수 있는지, 매개변수로 나타낸 함수를 올바르게 미분하고 잘 정의될 수 있도록 미정계수의 값을 구할 수 있는지를 평가하는 문제이다. (선행학습영향평가 보고서 문항카드 원문)
key_idea: |
  $\overline{\mathrm{OA}}^2$, $\overline{\mathrm{OB}}^2$, $\overline{\mathrm{AB}}^2$를 덧셈정리로 정리하면 각각 $\sin6t$, $\cos4t$, $\sin10t$ 하나의 함수가 된다. $\overline{\mathrm{AB}}$가 지름일 때 $\mathrm{P}$가 직선 $\mathrm{AB}$ 위에 있다. $h^{\prime}(t)$의 분자는 $\cos4t$의 일차식, $\dfrac{dy}{dx}$의 정의 조건은 $\dfrac{dx}{dt}\ne0$.
stuck: |
