- id: '3-2'
  stem: |
    (2) (15점) 좌표평면 위를 움직이는 점 $\mathrm{B}$의 좌표 $(x,y)$에 대하여 $\dfrac{dy}{dx}$가 $0<t<\dfrac{\pi}{2}$인 모든 $t$에 대하여 정의되도록 하는 $10$보다 큰 자연수 $k$의 최솟값을 구하시오.

    ※ 대소 비교에 다음 표를 활용하여도 무방함.

    [표: $t=\dfrac{16}{80}\pi,\dfrac{17}{80}\pi,\cdots,\dfrac{24}{80}\pi$에 대한 값
    $\sin t$: $0.5878,\ 0.6191,\ 0.6494,\ 0.6788,\ 0.7071,\ 0.7343,\ 0.7604,\ 0.7853,\ 0.8090$
    $\sin5t$: $0,\ -0.1951,\ -0.3827,\ -0.5556,\ -0.7071,\ -0.8315,\ -0.9239,\ -0.9808,\ -1$
    $\cos t$: $0.8090,\ 0.7853,\ 0.7604,\ 0.7343,\ 0.7071,\ 0.6788,\ 0.6494,\ 0.6191,\ 0.5878$
    $\cos5t$: $-1,\ -0.9808,\ -0.9239,\ -0.8315,\ -0.7071,\ -0.5556,\ -0.3827,\ -0.1951,\ 0$]
  points: 15
  depends_on: []
  answer: {kind: value, value: '13', equivalents: [], tolerance: null}
  solutions:
  - id: S3-2-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{dy}{dx}$가 정의될 필요충분조건은 $g(t)=\dfrac k2\sin t+5\sin5t\ne0$, 즉 $(0,\tfrac{\pi}{2})$에서 $g>0$. $k\le12$이면 $t=\tfrac{3}{10}\pi$에서 $g<0$, $k=13$이면 표로 구간별 비교.
    steps:
    - id: 3-2a
      content: |
        $k=13$.
      criteria: ['3-2.M1', '3-2.R1', '3-2.R2', '3-2.R3']
    hint_ladder:
    - $\dfrac{dx}{dt}=0$인 $t$가 있으면 $\dfrac{dy}{dx}$가 정의되지 않는다.
    - $\sin5t$가 $-1$이 되는 $t=\tfrac{3}{10}\pi$ 부근을 살펴보자.
  - id: S3-2-B
    audience: B
    source_flow: 모범답안 p.11~12
    method_no: 1
    steps:
    - id: 3-2b-1
      content: |
        매개변수로 나타낸 함수의 미분법에 따르면
        $$\frac{dy}{dx}=\frac{\frac{dy}{dt}}{\frac{dx}{dt}}=\frac{\frac k2\cos t+5\cos5t}{-\frac k2\sin t-5\sin5t}$$
        이다.
      criteria: ['3-2.M1']
    - id: 3-2b-2
      content: |
        $g(t)=\dfrac k2\sin t+5\sin5t$라 하자. $k$가 $10$보다 큰 자연수이고 문제에 주어진 표를 이용하면 $g\left(\dfrac{\pi}{5}\right)>0$임을 알 수 있으므로 $\dfrac{dy}{dx}$가 $0<t<\dfrac{\pi}{2}$에서 정의되기 위한 필요충분조건은 $g(t)>0$이다. 따라서 $0<t<\dfrac{\pi}{2}$에서 $g(t)>0$ 또는 $\dfrac k2\sin t>-5\sin5t$임을 보이면 된다.
      criteria: ['3-2.R1']
    - id: 3-2b-3
      content: |
        $10<k\le12$인 경우 $\dfrac k2\sin\dfrac{3}{10}\pi\le6\sin\dfrac{3}{10}\pi<-5\sin\left(5\times\dfrac{3}{10}\pi\right)$이므로 $g\left(\dfrac{3}{10}\pi\right)<0$이다.
      criteria: ['3-2.R2']
    - id: 3-2b-4
      content: |
        $k=13$이라 하자. $0<t\le\dfrac{\pi}{5}$이면 $\dfrac{13}{2}\sin t>0\ge-5\sin5t$이다. 닫힌구간 $\left[\dfrac{\pi}{5},\dfrac{3}{10}\pi\right]$에서 $\dfrac{13}{2}\sin t$와 $-5\sin5t$는 증가한다.
        $$-5\sin\left(5\times\frac{\pi}{4}\right)<\frac{13}{2}\sin\frac{\pi}{5},\quad-5\sin\left(5\times\frac{21}{80}\pi\right)<\frac{13}{2}\sin\frac{\pi}{4},\quad-5\sin\left(5\times\frac{11}{40}\pi\right)<\frac{13}{2}\sin\frac{21}{80}\pi,$$
        $$-5\sin\left(5\times\frac{23}{80}\pi\right)<\frac{13}{2}\sin\frac{11}{40}\pi,\quad-5\sin\left(5\times\frac{3}{10}\pi\right)<\frac{13}{2}\sin\frac{23}{80}\pi$$
        이므로, 닫힌구간 $\left[\dfrac{\pi}{5},\dfrac{\pi}{4}\right]$, $\left[\dfrac{\pi}{4},\dfrac{21}{80}\pi\right]$, $\left[\dfrac{21}{80}\pi,\dfrac{11}{40}\pi\right]$, $\left[\dfrac{11}{40}\pi,\dfrac{23}{80}\pi\right]$, $\left[\dfrac{23}{80}\pi,\dfrac{3}{10}\pi\right]$에서 모두 $\dfrac k2\sin t>-5\sin5t$이다(제시문 (나)).
        $\dfrac k2\sin\dfrac{3}{10}\pi>-5\sin\left(5\times\dfrac{3}{10}\pi\right)$이고 열린구간 $\left(\dfrac{3}{10}\pi,\dfrac{\pi}{2}\right)$에서 $\dfrac{13}{2}\sin t$는 증가하고 $-5\sin5t$는 감소하므로 $\dfrac k2\sin t>-5\sin5t$이다. 그러므로 <조건>을 만족하는 $k$의 최솟값은 $13$이다.
      criteria: ['3-2.R3']
