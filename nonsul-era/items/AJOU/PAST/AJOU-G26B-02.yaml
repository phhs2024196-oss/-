- id: '3-1'
  stem: |
    [문제 2-3] (25점) 다음 물음에 답하시오.

    (1) (10점) 직선 $\mathrm{OB}$의 기울기를 $h(t)$라 하자. 함수 $h(t)$가 열린구간 $\left(0,\dfrac{\pi}{2}\right)$에서 증가하도록 하는 $3$보다 큰 자연수 $k$의 최솟값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '10', equivalents: [], tolerance: null}
  solutions:
  - id: S3-1-A
    audience: A
    method_no: 1
    key_idea: $h^{\prime}(t)$의 분자 $\dfrac{k^2}{4}+5+3k\cos4t$의 최솟값 $\dfrac{k^2}{4}+5-3k\ge0\iff k\le2$ 또는 $k\ge10$.
    steps:
    - id: 3-1a
      content: |
        $k=10$.
      criteria: ['3-1.M1', '3-1.A1', '3-1.A2']
    hint_ladder:
    - 몫의 미분 후 분자를 덧셈정리로 정리하면 $\cos4t$만 남는다.
  - id: S3-1-B
    audience: B
    source_flow: 모범답안 p.11
    method_no: 1
    steps:
    - id: 3-1b-1
      content: |
        $\mathrm{B}\left(\dfrac k2\cos t+\cos5t,\dfrac k2\sin t+\sin5t\right)$를 이용하면 $h(t)=\dfrac{\frac k2\sin t+\sin5t}{\frac k2\cos t+\cos5t}$이다. 몫의 미분법과 삼각함수의 덧셈정리에 의하여
        $$h^{\prime}(t)=\frac{\left(\frac k2\cos t+5\cos5t\right)\left(\frac k2\cos t+\cos5t\right)-\left(\frac k2\sin t+\sin5t\right)\left(-\frac k2\sin t-5\sin5t\right)}{\left(\frac k2\cos t+\cos5t\right)^2}=\frac{\frac{k^2}{4}+5+3k\cos4t}{\left(\frac k2\cos t+\cos5t\right)^2}$$
        이다.
      criteria: ['3-1.M1']
    - id: 3-1b-2
      content: |
        열린구간 $\left(0,\dfrac{\pi}{2}\right)$에서 $\dfrac{k^2}{4}+5+3k\cos4t$는 $t=\dfrac{\pi}{4}$에서 최솟값 $\dfrac{k^2}{4}+5-3k$를 갖는다. $k\le2$ 또는 $k\ge10$에서 $\dfrac{k^2}{4}+5-3k\ge0$이며, 이때 함수 $h(t)$는 증가한다.
      criteria: ['3-1.A1']
    - id: 3-1b-3
      content: |
        따라서 $3$보다 큰 가장 작은 자연수 $k$는 $10$이다.
      criteria: ['3-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
