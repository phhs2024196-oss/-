      mark_type: M
      points: 4
      evidence: |
        $h^{\prime}(t)=\dfrac{\frac{k^2}{4}+5+3k\cos4t}{\left(\frac k2\cos t+\cos5t\right)^2}$를 올바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [3-1b-1]
    - id: 3-1.A1
      mark_type: A
      points: 4
      evidence: |
        이차부등식 $\dfrac{k^2}{4}+5-3k\ge0$을 풀어서 $h^{\prime}(t)\ge0$인 조건($k\le2$ 또는 $k\ge10$)을 올바르게 구했다.
      depends_on: [3-1.M1]
      steps: [3-1b-2]
    - id: 3-1.A2
      mark_type: A
      points: 2
