stimuli:
- label: 가
  body: |
    $3$보다 큰 자연수 $k$에 대하여, 중심이 원점이고 반지름의 길이가 $\dfrac k2$인 원 $C$를 생각하자. 양의 실수 $t$에 대하여 점 $\mathrm{P}\left(\dfrac k2\cos t,\dfrac k2\sin t\right)$는 원 $C$ 위의 점이고, 점 $\mathrm{P}$를 중심으로 하고 반지름의 길이가 $1$인 원 위의 두 점 $\mathrm{A}\left(\dfrac k2\cos t+\sin5t,\dfrac k2\sin t+\cos5t\right)$, $\mathrm{B}\left(\dfrac k2\cos t+\cos5t,\dfrac k2\sin t+\sin5t\right)$를 생각하자. $\overline{\mathrm{AB}}$의 길이가 최대가 되도록 하는 가장 작은 양의 실수 $t$의 값을 $t_1$이라 하자.
    [그림 1]은 $k=10$, $t=\dfrac{\pi}{10}$일 때 원 $C$와 점 $\mathrm{A},\mathrm{B},\mathrm{P}$를 나타낸다.

    [그림 1: 원점 중심, 반지름 $5$인 점선 원 $C$(눈금 $\pm5$). 제1사분면 원 위의 점 $\mathrm{P}$를 중심으로 하는 작은 점선 원과 그 위의 점 $\mathrm{A}$(P의 오른쪽), $\mathrm{B}$(P의 위쪽)]
- label: 나
  body: |
    일반적으로 $a<x<b$이고 $c<y<d$이면 $a-d<x-y<b-c$가 성립한다. 따라서 닫힌구간 $[\alpha,\beta]$에서 함수 $f(x)$와 $g(x)$가 모두 증가하고 $f(\beta)<g(\alpha)$이면 이 구간의 모든 $x$에 대해 $f(x)<g(x)$이다.

stem: |
  [문항 2] 【제시문】을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 2-1] (7점) $k=7$일 때, 점 $\mathrm{A}$와 원점 사이의 거리의 최솟값을 $r$이라 하자. $\overline{\mathrm{OA}}=r$을 만족시키는 $t$의 개수를 $m$, $\overline{\mathrm{OB}}=r$을 만족시키는 $t$의 개수를 $n$이라 할 때, $mn$의 값을 구하시오. (단, $0\le t\le2\pi$)
  points: 7
  depends_on: []
  answer: {kind: value, value: '24', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{OA}}^2=\tfrac{49}{4}+1+7\sin6t$, $\overline{\mathrm{OB}}^2=\tfrac{49}{4}+1+7\cos4t$이고 $r=\tfrac52$.
    steps:
    - id: 1a
      content: |
        $\sin6t=-1$의 해 6개, $\cos4t=-1$의 해 4개, $mn=24$.
      criteria: ['1.M1', '1.A1']
    hint_ladder:
    - $\cos t\sin5t+\sin t\cos5t$를 하나의 삼각함수로 묶어 보자.
  - id: S1-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각함수의 덧셈정리를 이용하면
        $$\overline{\mathrm{OA}}^2=\left(\frac72\cos t+\sin5t\right)^2+\left(\frac72\sin t+\cos5t\right)^2=\frac{49}{4}(\cos^2t+\sin^2t)+(\sin^25t+\cos^25t)+7(\cos t\sin5t+\sin t\cos5t)=\frac{49}{4}+1+7\sin6t$$
        이다. 같은 방식으로 계산하면 $\overline{\mathrm{OB}}^2=\dfrac{49}{4}+1+7\cos4t$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        점 $\mathrm{A}$와 원점 사이의 거리의 최솟값은 $\sin6t=-1$일 때 $r=\sqrt{\dfrac{49}{4}+1-7}=\dfrac52$이다. 따라서 $t=\dfrac{\pi}{4},\dfrac{\pi}{4}+\dfrac{\pi}{3},\cdots,\dfrac{\pi}{4}+\dfrac53\pi$일 때 $\overline{\mathrm{OA}}=r$이므로 $m=6$이다.
        $\cos4t=-1$이 되는 $t=\dfrac{\pi}{4},\dfrac{\pi}{4}+\dfrac{\pi}{2},\dfrac{\pi}{4}+\pi,\dfrac{\pi}{4}+\dfrac32\pi$일 때 $\overline{\mathrm{OB}}=r$이고 $n=4$이다. 그러므로 $mn=24$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\overline{\mathrm{OA}}^2$과 $\overline{\mathrm{OB}}^2$를 올바르게 계산했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $m=6$, $n=4$를 올바르게 구했다(각 2점).
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 2-2] (18점) $k=10$, $t=t_1$일 때, 직선 $\mathrm{AB}$가 원 $C$와 만나는 두 점을 $\mathrm{Q}$, $\mathrm{T}$라 하자. 다음 물음에 답하시오.

    (1) (8점) $\overline{\mathrm{QT}}^2=a\left(b-\sin\dfrac3c\pi\right)$일 때, $a+b+c$의 값을 구하시오. (단, $a$, $b$, $c$는 자연수이다.)
  points: 8
  depends_on: []
  answer: {kind: value, value: '61', equivalents: [], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{AB}}$ 최대이면 지름이라 $\mathrm{P}$가 직선 $\mathrm{AB}$ 위에 있고, $\mathrm{Q}=\mathrm{P}$, 기울기 $-1$이라 $\mathrm{T}$는 $y=x$ 대칭점.
    steps:
    - id: 2-1a
      content: |
        $\overline{\mathrm{QT}}^2=50\left(1-\cos\dfrac{\pi}{5}\right)=50\left(1-\sin\dfrac{3}{10}\pi\right)$, $a+b+c=61$.
      criteria: ['2-1.B1', '2-1.B2', '2-1.A1']
    hint_ladder:
    - $\overline{\mathrm{AB}}^2$을 $t$에 대한 하나의 삼각함수로 나타내 보자.
  - id: S2-1-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        실수 $t$에 대하여 $(\sin5t-\cos5t)^2=1-(\sin5t\cos5t+\cos5t\sin5t)=1-\sin(5t+5t)=1-\sin10t$이므로 $\overline{\mathrm{AB}}^2=2(\sin5t-\cos5t)^2=2(1-\sin10t)$이다. $\overline{\mathrm{AB}}$의 길이가 최대가 되려면 $\sin10t=-1$이어야 한다. 따라서 $t_1=\dfrac{3}{20}\pi$이다.
      criteria: ['2-1.B1']
    - id: 2-1b-2
      content: |
        이때 $\overline{\mathrm{AB}}$는 지름이므로 점 $\mathrm{P}(5\cos t_1,5\sin t_1)$은 직선 $\mathrm{AB}$ 위에 있다. 점 $\mathrm{P}$는 원 $C$ 위의 점이므로 두 교점 중 한 점의 좌표는 $(5\cos t_1,5\sin t_1)$이며, 이 점을 $\mathrm{Q}$라 하자.
        $$\text{직선 AB의 기울기}=\frac{(5\sin t_1+\sin5t_1)-(5\sin t_1+\cos5t_1)}{(5\cos t_1+\cos5t_1)-(5\cos t_1+\sin5t_1)}=-1$$
        이므로 $\mathrm{T}\left(5\cos\left(\dfrac{\pi}{2}-t_1\right),5\sin\left(\dfrac{\pi}{2}-t_1\right)\right)$이다. 따라서 $\angle\mathrm{TOQ}=\dfrac{\pi}{5}$이다.
      criteria: ['2-1.B2']
    - id: 2-1b-3
      content: |
        삼각형 $\mathrm{OQT}$에 코사인법칙을 적용하면 $\overline{\mathrm{QT}}^2=5^2+5^2-2\times5\times5\times\cos\dfrac{\pi}{5}=50\left(1-\cos\dfrac{\pi}{5}\right)$이다. $\cos\dfrac{\pi}{5}=\sin\left(\dfrac{\pi}{2}-\dfrac{\pi}{5}\right)=\sin\dfrac{3}{10}\pi$이므로 $a=50$, $b=1$, $c=10$이다. 그러므로 $a+b+c=61$이다.
      criteria: ['2-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.B1
      mark_type: B
      points: 2
      evidence: |
        $t_1=\dfrac{3}{20}\pi$를 올바르게 구했다.
      depends_on: []
      steps: [2-1b-1]
    - id: 2-1.B2
      mark_type: B
      points: 2
      evidence: |
        $\angle\mathrm{TOQ}=\dfrac{\pi}{5}$를 올바르게 구했다.
      depends_on: []
      steps: [2-1b-2]
    - id: 2-1.A1
      mark_type: B
      points: 4
      evidence: |
        코사인법칙을 이용하여 $a+b+c=61$을 올바르게 구했다.
      depends_on: []
      steps: [2-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    (2) (10점) 삼각형 $\mathrm{OQT}$의 넓이를 $S_1$, 삼각형 $\mathrm{OQT}$를 포함하는 부채꼴 $\mathrm{OQT}$의 넓이를 $S_2$라 할 때, $S_2-S_1$의 값을 구하시오.
  points: 10
  depends_on: ['2-1']
  answer: {kind: value, value: '5*pi/2-25*sin(pi/5)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: 반지름 $5$, 중심각 $\dfrac{\pi}{5}$인 부채꼴과 삼각형의 넓이 차.
    steps:
    - id: 2-2a
      content: |
        $S_2-S_1=\dfrac52\pi-\dfrac{25}{2}\sin\dfrac{\pi}{5}$.
      criteria: ['2-2.B1', '2-2.B2']
    hint_ladder:
    - (1)에서 구한 $\angle\mathrm{TOQ}$를 쓰자.
  - id: S2-2-B
    audience: B
    source_flow: 모범답안 p.10
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        $\overline{\mathrm{OT}}=\overline{\mathrm{OQ}}=5$이고 $\angle\mathrm{TOQ}=\dfrac{\pi}{5}$이므로, $S_1=\dfrac12\times5\times5\times\sin\dfrac{\pi}{5}=\dfrac{25}{2}\sin\dfrac{\pi}{5}$,
      criteria: ['2-2.B1']
    - id: 2-2b-2
      content: |
        $S_2=\dfrac12\times5^2\times\dfrac{\pi}{5}=\dfrac52\pi$이다. 따라서 $S_2-S_1=\dfrac52\pi-\dfrac{25}{2}\sin\dfrac{\pi}{5}$이다.
      criteria: ['2-2.B2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.B1
      mark_type: B
      points: 5
      evidence: |
        $S_1=\dfrac{25}{2}\sin\dfrac{\pi}{5}$을 올바르게 구했다.
      depends_on: []
      ft: {allowed: true, from: [2-1.B2], max_points: 5}
      steps: [2-2b-1]
    - id: 2-2.B2
      mark_type: B
      points: 5
      evidence: |
        $S_2=\dfrac52\pi$를 올바르게 구했다.
