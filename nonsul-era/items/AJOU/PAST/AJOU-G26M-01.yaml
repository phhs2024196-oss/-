- id: '2'
  stem: |
    [문제 1-2] (10점) 실수 $a\,(-1\le a\le1)$에 대하여 직선 $y=ax$가 제시문 (가)의 곡선 $C$와 만나는 점의 개수를 $g(a)$라 하자. 다음 <조건>을 만족시키는 가장 낮은 차수의 다항함수 $p(a)$에 대하여 $p(0)$의 값을 구하시오.

    <조건>
    ① $h(a)=p(a)g(a)$로 정의된 함수 $h(a)$가 $-1\le a\le1$에서 연속이다.
    ② $p(a)$는 일차 이상의 다항함수이다.
    ③ $p(a)$의 최고차항의 계수는 $1$이다.
  points: 10
  depends_on: []
  answer: {kind: value, value: '(1-log(2)/8)**2/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g$의 불연속점 $\pm a_1$, $\pm\dfrac12$($a_1=1-\tfrac18\ln2$)에서 $p=0$이어야 하므로 $p(a)=\left(a^2-\tfrac14\right)(a^2-a_1^2)$.
    steps:
    - id: 2a
      content: |
        $p(0)=\dfrac14a_1^2=\dfrac14\left(1-\dfrac18\ln2\right)^2$.
      criteria: ['2.B1', '2.R1', '2.A1']
    hint_ladder:
    - 원점을 지나는 직선이 곡선의 꼭짓점을 지날 때 교점 수가 바뀐다.
  - id: S2-B
    audience: B
    source_flow: 모범답안 p.12
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        원점과 점 $\left(4,4-\dfrac12\ln2\right)$를 지나는 직선의 기울기는 $a_1=1-\dfrac18\ln2$이므로, 직선 $y=ax$와 곡선 $C$와의 교점의 개수는 $a_1<\lvert a\rvert\le1$일 때 $2$, $\lvert a\rvert=a_1$일 때 $3$, $\dfrac12<\lvert a\rvert<a_1$일 때 $4$, $\lvert a\rvert=\dfrac12$일 때 $3$, $\lvert a\rvert<\dfrac12$일 때 $2$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        따라서 $g(a)$는 $a=-a_1,-\dfrac12,\dfrac12,a_1$에서 불연속이다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        $h(a)=g(a)p(a)$가 닫힌구간 $[-1,1]$에서 연속함수이어야 하므로 다항함수 $p(a)$는 $\left(a^2-\dfrac14\right)(a^2-a_1^2)$을 인수로 갖는다. 따라서 <조건>을 만족하는 가장 낮은 차수의 다항함수는 $p(a)=\left(a^2-\dfrac14\right)(a^2-a_1^2)$이며, $p(0)=\dfrac14\left(1-\dfrac18\ln2\right)^2$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
