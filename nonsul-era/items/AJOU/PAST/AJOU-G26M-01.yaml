intent: |
  [문제 1-1] 주어진 곡선을 나타내는 함수를 미분하여 곡선의 길이를 계산하고 그 곡선들로 둘러싸인 곡선의 넓이를 계산할 수 있는지, 직선의 성질을 이용하여 주어진 곡선의 넓이를 이등분하는 직선을 추론할 수 있는지를 평가하는 문제이다. [문제 1-2] 기울기가 변화하는 직선과 주어진 곡선과의 위치 관계를 복합적으로 파악하여 교점을 찾아 새로운 함수를 정의할 수 있는지, 구한 함수가 주어진 범위에서 연속함수가 되도록 하는 다항함수를 추론할 수 있는지를 평가하는 문제이다. [문제 1-3] 기울기가 주어진 직선의 방정식을 찾고, 그 직선을 $x$축의 방향으로 평행이동 하면서 복합적으로 곡선과 직선의 위치 관계를 파악하여 주어진 곡선과의 교점을 추론할 수 있는지를 평가하는 문제이다. (선행학습영향평가 보고서 문항카드 원문)
key_idea: |
  곡선 $\dfrac{x^2}{4}-\dfrac12\ln\dfrac x2$는 $1+y^{\prime 2}$이 완전제곱이 되어 길이가 바로 적분된다. 좌우 넓이 차 $\dfrac43$을 기울기 $-10$인 직선이 잘라내는 두 삼각형 넓이 차로 맞춘다. 교점 개수 함수의 불연속점(꼭짓점 통과·접할 때)을 모두 찾아 연속이 되도록 그 점들을 근으로 갖는 다항식을 만든다.
stuck: |
  [문제 1-2]에서 $g(a)$의 불연속점이 $a=\pm a_1,\pm\dfrac12$임을 찾고 $h=pg$가 연속이려면 $p$가 그 점들에서 $0$이어야 한다는 연결, [문제 1-3]에서 직선이 꼭짓점을 지날 때와 $C_2$에 접할 때를 빠짐없이 나열하는 단계
