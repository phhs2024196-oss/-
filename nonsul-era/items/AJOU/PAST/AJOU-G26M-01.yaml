      points: 5
      evidence: |
        다항함수 $p(a)=\left(a^2-\dfrac14\right)(a^2-a_1^2)$을 올바르게 제시하고 $p(0)=\dfrac14\left(1-\dfrac18\ln2\right)^2$을 구했다.
