- id: '3'
  stem: |
    [문제 1-3] (14점) 제시문 (나)의 직선 $\ell$이 제시문 (가)의 곡선 $C$와 만나는 점의 개수를 $f(t)$라 할 때, 함수 $f(t)$가 불연속인 양의 실수 $t$의 값을 모두 구하시오.

    ※ 대소 비교에 다음 표를 활용하여도 무방함.

    [표: $\ln2=0.693$, $\ln3=1.099$, $\ln5=1.609$, $\ln7=1.946$]
  points: 14
  depends_on: []
  answer: {kind: set, value: '{1/3, 1, 1+3*log(2)/8, (21+6*log(3/2))/16, 5}', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 직선이 꼭짓점 $\left(-\tfrac23,-\tfrac43\right)$, $(-2,-4)$, $(2,1)$, $\left(4,4-\tfrac12\ln2\right)$, $(2,-4)$를 지날 때와 $C_2$에 접할 때(접점 $\left(3,\tfrac94-\tfrac12\ln\tfrac32\right)$)만 보면 된다.
    steps:
    - id: 3a
      content: |
        $t_1=\tfrac13,t_2=1,t_3=\tfrac54,t_4=1+\tfrac38\ln2,t_5=\tfrac{21+6\ln\frac32}{16},t_6=5$ 중 $t_3$에서만 연속.
      criteria: ['3.M1', '3.A1', '3.A2']
    hint_ladder:
    - 직선을 오른쪽으로 평행이동하며 교점 수가 바뀌는 순간을 찾자.
    - $C_2$ 위에서 기울기가 $\tfrac43$인 점은?
  - id: S3-B
    audience: B
    source_flow: 모범답안 p.12~13
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        양수 $t$에 대해 직선 $\ell$이 $\left(-\dfrac23,-\dfrac43\right)$, $(-2,-4)$, $(2,1)$, $\left(4,4-\dfrac12\ln2\right)$, $(2,-4)$를 지날 때와 $C_2$에 접하는 경우, 즉 접점 $\left(3,\dfrac94-\dfrac12\ln\dfrac32\right)$을 지나는 경우만 고려하면 충분하다. 이에 해당하는 $t$의 값들을 크기 순으로 나열하여 $t_1=\dfrac13$, $t_2=1$, $t_3=\dfrac54$, $t_4=1+\dfrac38\ln2$, $t_5=\dfrac{21+6\ln\frac32}{16}$, $t_6=5$라 하자.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        양의 실수 $t$에 대한 교점의 개수 $f(t)$를 살펴보면 다음 표와 같다.
        $0<t<t_1$: $2$ / $t=t_1$: $3$ ($\left(-\tfrac23,-\tfrac43\right)$을 지날 때) / $t_1<t<t_2$: $4$ / $t=t_2$: $3$ ($(-2,-4)$를 지날 때) / $t_2<t<t_3$: $2$ / $t=t_3$: $2$ ($(2,1)$을 지날 때, $\displaystyle\lim_{t\to t_3-}f(t)=\lim_{t\to t_3+}f(t)=f(t_3)$) / $t_3<t<t_4$: $2$ / $t=t_4$: $3$ ($\left(4,4-\tfrac12\ln2\right)$를 지날 때) / $t_4<t<t_5$: $4$ / $t=t_5$: $3$ ($C_2$에 접할 때) / $t_5<t<t_6$: $2$ / $t=t_6$: $1$ ($(2,-4)$를 지날 때) / $t>t_6$: $0$
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        따라서 불연속이 되는 $t$의 값들은 $\dfrac13$, $1$, $1+\dfrac38\ln2$, $\dfrac{21+6\ln\frac32}{16}$, $5$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        직선과 곡선이 접하는 경우를 관찰하고 접점 $\left(3,\dfrac94-\dfrac12\ln\dfrac32\right)$을 구했다.
