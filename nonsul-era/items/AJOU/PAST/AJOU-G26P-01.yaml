- id: '2-1'
  stem: |
    [문제 1-2] (22점) 점 $\mathrm{P}$가 곡선 $y=\dfrac12x^2$ 위에 있을 때, 제시문 (나)에 대한 다음 물음에 답하시오.

    (1) (10점) $a=1$일 때, 삼각형 $\mathrm{PAB}$의 외접원을 $C$라 하자. 원 $C$의 반지름의 길이와 원 $C$의 방정식을 구하시오.
  points: 10
  depends_on: ['1-3']
  answer: {kind: expression, value: 'radius: sqrt(130)/4; circle: (x+3/4)**2+(y-11/4)**2-65/8', equivalents: [], tolerance: null}
