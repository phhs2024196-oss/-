- id: '2-2'
  stem: |
    (2) (12점) $\displaystyle\lim_{a\to0+}\frac{S_2}{S_1}$를 조사하시오.
  points: 12
  depends_on: ['1-3']
  answer: {kind: value, value: '14', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $S_1=\dfrac1{24}\left(a+\dfrac2a\right)^3$, $S_2=\dfrac{14}{3a^3}-\dfrac7{12}a^3-a+\dfrac2a$이고 둘 다 $\dfrac1{a^3}$ 차수.
    steps:
    - id: 2-2a
      content: |
        $\displaystyle\lim_{a\to0+}\frac{S_2}{S_1}=\frac{14/3}{8/24}=14$.
      criteria: ['2-2.B1', '2-2.B2', '2-2.A1']
    hint_ladder:
    - $\mathrm{P}$의 $x$좌표는 $-\left(a+\dfrac2a\right)$이다.
  - id: S2-2-B
    audience: B
    source_flow: 모범답안 p.7~8
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        ① 넓이 $S_1$ 구하기. 점 $\mathrm{P}$에서의 접선의 방정식은 $y=-\left(a+\dfrac2a\right)x-\dfrac12\left(a+\dfrac2a\right)^2$이므로 점 $\mathrm{R}$의 $x$좌표는 $x=-\dfrac12\left(a+\dfrac2a\right)$이다. 따라서
        $$S_1=\int_{-\left(a+\frac2a\right)}^{-\frac12\left(a+\frac2a\right)}\left[\frac12x^2+\left(a+\frac2a\right)x+\frac12\left(a+\frac2a\right)^2\right]dx+\int_{-\frac12\left(a+\frac2a\right)}^{0}\frac12x^2dx=\frac{1}{24}\left(a+\frac2a\right)^3$$
        이다.
      criteria: ['2-2.B1']
    - id: 2-2b-2
      content: |
        ② 넓이 $S_2$ 구하기. 직선 $x=a$와 직선 $L_2$의 교점을 $\mathrm{E}$라 하면, 점 $\mathrm{E}$의 좌표는 $\left(a,-\dfrac{a^2}{2}+\dfrac2{a^2}+1\right)$이다.
        (삼각형 $\mathrm{PAE}$의 넓이) $=\dfrac12\times\left(-a^2+\dfrac2{a^2}+1\right)\times\left(a+a+\dfrac2a\right)=\dfrac3a+\dfrac2{a^3}-a^3$이고
        ($a\le x\le\dfrac2a$에서 직선 $L_2$와 곡선으로 둘러싸인 넓이) $=\displaystyle\int_a^{\frac2a}\left(\frac2{a^2}+1-\frac a2x-\frac12x^2\right)dx=\frac{8}{3a^3}+\frac5{12}a^3-a-\frac1a$이므로
        $$S_2=\left(\frac3a+\frac2{a^3}-a^3\right)+\left(\frac8{3a^3}+\frac5{12}a^3-a-\frac1a\right)=\frac{14}{3a^3}-\frac7{12}a^3-a+\frac2a$$
        이다.
      criteria: ['2-2.B2']
    - id: 2-2b-3
      content: |
        따라서
        $$\lim_{a\to0+}\frac{S_2}{S_1}=\lim_{a\to0+}\frac{\frac{14}{3a^3}-\frac7{12}a^3-a+\frac2a}{\frac1{24}\left(a+\frac2a\right)^3}=14$$
        이다.
      criteria: ['2-2.A1']
