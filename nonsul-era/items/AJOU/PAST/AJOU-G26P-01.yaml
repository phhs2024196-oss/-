intent: |
  [문제 1-1] 도함수를 활용하여 점과 직선 사이의 거리를 구할 있는지, 연립방정식과 이차부등식을 활용하여 주어진 조건을 만족시키는 값의 범위를 구할 수 있는지를 평가하는 문제이다. [문제 1-2] 직선의 방정식과 삼각함수를 활용하여 외접원의 반지름의 길이 및 방정식을 구할 수 있는지, 두 함수의 그래프로 둘러싸인 도형의 넓이를 구할 수 있는지를 평가하는 문제이다. (선행학습영향평가 보고서 문항카드 원문, 「구할 있는지」 원문 그대로)
key_idea: |
  포물선 $y=\tfrac12x^2$ 위 점 $\mathrm{A}$에서의 법선 $L_1$이 포물선과 다시 만나는 점의 $x$좌표는 $-a-\dfrac2a$이다. 두 법선의 교점이 포물선 위에 있으려면 두 법선이 포물선과 같은 점에서 다시 만나야 하므로 $a+\dfrac2a=b+\dfrac2b$, 즉 $ab=2$.
stuck: |
  [문제 1-1](3)에서 $\mathrm{P}$가 포물선 위에 있다는 조건을 「두 법선의 두 번째 교점이 같다」로 바꾸는 발상
