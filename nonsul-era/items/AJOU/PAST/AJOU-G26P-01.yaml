stimuli:
- label: 가
  body: |
    곡선 $y=\dfrac12x^2$ 위의 서로 다른 두 점 $\mathrm{A}\left(a,\dfrac12a^2\right)$, $\mathrm{B}\left(b,\dfrac12b^2\right)$을 생각하자. (단, $0<a<b$)
    곡선 $y=\dfrac12x^2$ 위의 점 $\mathrm{A}$에서의 접선을 $l_1$, 곡선 $y=\dfrac12x^2$ 위의 점 $\mathrm{B}$에서의 접선을 $l_2$라 하자. 직선 $l_1$에 수직이고 점 $\mathrm{A}$를 지나는 직선을 $L_1$, 직선 $l_2$에 수직이고 점 $\mathrm{B}$를 지나는 직선을 $L_2$라 하고, $L_1$과 $L_2$의 교점을 $\mathrm{P}$라 하자. 점 $\mathrm{A}$와 점 $\mathrm{B}$의 위치에 따라 점 $\mathrm{P}$의 위치는 [그림 1]과 같이 세 가지 경우로 나뉜다.

    [그림 1: (ㄱ) 점 $\mathrm{P}$가 포물선 바깥(왼쪽 위), (ㄴ) 점 $\mathrm{P}$가 포물선 위, (ㄷ) 점 $\mathrm{P}$가 포물선 안쪽. 각 그림에 접선 $l_1$, $l_2$(점선)와 법선 $L_1$, $L_2$(실선)]
- label: 나
  body: |
    [그림 1]의 (ㄴ)과 같이 점 $\mathrm{P}$가 곡선 $y=\dfrac12x^2$ 위의 점인 경우를 생각하자. 곡선 $y=\dfrac12x^2$ 위의 점 $\mathrm{P}$에서의 접선과 $x$축의 교점을 $\mathrm{R}$이라 하자. [그림 2]에서와 같이 점 $\mathrm{P}$와 점 $\mathrm{R}$을 지나는 직선과 $x$축 및 곡선 $y=\dfrac12x^2$으로 둘러싸인 도형의 넓이를 $S_1$이라 하고, 직선 $L_1$과 직선 $L_2$ 및 곡선 $y=\dfrac12x^2$으로 둘러싸인 도형의 넓이를 $S_2$라 하자.

    [그림 2: 포물선 위 왼쪽 점 $\mathrm{P}$, 오른쪽 점 $\mathrm{A}$, $\mathrm{B}$. $\mathrm{P}$에서의 접선과 $x$축의 교점 $\mathrm{R}$(음의 $x$축), 직선 $\mathrm{PR}$·$x$축·포물선으로 둘러싸인 작은 어두운 도형($S_1$)과 $\mathrm{P}$·$\mathrm{A}$·$\mathrm{B}$를 잇는 $L_1$, $L_2$와 포물선 호 $\mathrm{AB}$로 둘러싸인 밝은 도형($S_2$)]

stem: |
  [문항 1] 【제시문】을 읽고 물음에 답하시오.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (28점) 제시문 (가)에 대한 다음 물음에 답하시오.

    (1) (9점) $a=3$일 때, 점 $\mathrm{P}$의 $y$좌표가 가질 수 있는 모든 값의 범위는 $y>\gamma$이다. $\gamma$의 값을 구하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: '29/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}$의 $y$좌표 $=\dfrac{11+b^2+3b}{2}$는 $b>3$에서 증가하므로 $b\to3$일 때의 값이 하한.
    steps:
    - id: 1-1a
      content: |
        $\gamma=\dfrac{29}{2}$.
      criteria: ['1-1.M1', '1-1.A1', '1-1.A2']
    hint_ladder:
    - 법선 두 개를 연립해 $\mathrm{P}$의 좌표를 $b$로 나타내자.
  - id: S1-1-B
    audience: B
    source_flow: 모범답안 p.6
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        $y^{\prime}=x$이므로, $a=3$일 때 $l_1$의 기울기는 $3$이고 $l_2$의 기울기는 $b$이다. 따라서 $L_1$의 방정식은 $y=-\dfrac13x+\dfrac{11}{2}$이고 $L_2$의 방정식은 $y=-\dfrac1bx+\dfrac{b^2}{2}+1$이다. 직선 $L_1$과 $L_2$의 교점 $\mathrm{P}$의 $x$좌표는 $x=-\dfrac{3b}{2}(b+3)$이다.
      criteria: ['1-1.M1']
    - id: 1-1b-2
      content: |
        따라서
        $$y=\frac{11}{2}-\frac13x=\frac{11}{2}+\frac b2(b+3)=\frac{11+b^2+3b}{2}>\frac{29}{2}\quad(b>a=3)$$
        이다.
      criteria: ['1-1.A1']
    - id: 1-1b-3
      content: |
        그러므로, $\gamma=\dfrac{29}{2}$이다.
      criteria: ['1-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 4
      evidence: |
        $L_1$과 $L_2$의 방정식을 이용하여 교점 $\mathrm{P}$의 $x$좌표 $-\dfrac{3b}{2}(b+3)$을 올바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        점 $\mathrm{P}$의 $y$좌표에 관한 부등식 $\dfrac{11+b^2+3b}{2}>\dfrac{29}{2}$를 제시했다.
      depends_on: [1-1.M1]
      steps: [1-1b-2]
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: |
        정답 $\gamma=\dfrac{29}{2}$를 구했다.
      depends_on: [1-1.M1, 1-1.A1]
      steps: [1-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) (9점) 곡선 $y=\dfrac12x^2$과 직선 $L_1$의 교점 중 점 $\mathrm{A}$가 아닌 점을 $\mathrm{H}$라 하자. 곡선 $y=\dfrac12x^2$ 위의 점 $\mathrm{Q}$와 직선 $L_1$ 사이의 거리의 최댓값을 $a$에 관한 식으로 나타내시오. (단, 점 $\mathrm{Q}$의 $x$좌표는 점 $\mathrm{H}$의 $x$좌표보다 크고 $a$보다 작다.)
  points: 9
  depends_on: []
  answer: {kind: expression, value: '(a**2+1)*sqrt(a**2+1)/(2*a)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: 거리의 분자는 $q$에 대한 이차식 $-\dfrac a2(q-a)\left(q+a+\dfrac2a\right)$이고 두 근의 중점 $q=-\dfrac1a$에서 최대.
    steps:
    - id: 1-2a
      content: |
        $d_{\max}=\dfrac{(a^2+1)\sqrt{a^2+1}}{2a}$.
      criteria: ['1-2.B1', '1-2.M1', '1-2.A1']
    hint_ladder:
    - 점과 직선 사이 거리 공식의 분자를 인수분해해 보자.
  - id: S1-2-B
    audience: B
    source_flow: 모범답안 p.6
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        직선 $L_1$의 방정식은 $y=-\dfrac1ax+\dfrac12a^2+1$이다. 점 $\mathrm{H}$는 곡선 $y=\dfrac12x^2$과 직선 $L_1$의 교점 중 점 $\mathrm{A}$가 아닌 점이므로, 점 $\mathrm{H}$의 $x$좌표는 방정식 $\dfrac12x^2=-\dfrac1ax+\dfrac12a^2+1$의 해이다. $x\ne a$이므로 점 $\mathrm{H}$의 $x$좌표는 $x=-a-\dfrac2a\ \cdots㉠$ 이다.
      criteria: ['1-2.B1']
    - id: 1-2b-2
      content: |
        곡선 위의 점 $\mathrm{Q}\left(q,\dfrac12q^2\right)\ \left(-a-\dfrac2a<q<a\right)$에 대하여, 점 $\mathrm{Q}$와 직선 $L_1$ 사이의 거리는
        $$d=\frac{\left\lvert\frac qa+\frac12q^2-\frac12a^2-1\right\rvert}{\sqrt{\left(\frac1a\right)^2+1}}=\frac{\left\lvert\frac a2(q-a)\left(q+a+\frac2a\right)\right\rvert}{\sqrt{a^2+1}}=\frac{-\frac a2(q-a)\left(q+a+\frac2a\right)}{\sqrt{a^2+1}}$$
        이다. $f(q)=-\dfrac a2(q-a)\left(q+a+\dfrac2a\right)$라 하자. 그러면 각 양수 $a$에 대하여 $f(q)$가 최대일 때 거리 $d$가 최댓값을 가진다. $f^{\prime}(q)=-aq-1$이므로 $q=-\dfrac1a$에서 극댓값을 가진다.
      criteria: ['1-2.M1']
    - id: 1-2b-3
      content: |
        따라서 점 $\mathrm{Q}$와 직선 $L_1$ 사이의 거리는 $q=-\dfrac1a$일 때 최댓값
        $$d=\frac{\frac a2\left(a+\frac1a\right)^2}{\sqrt{a^2+1}}=\frac{(a^2+1)\sqrt{a^2+1}}{2a}$$
        을 가진다.
      criteria: ['1-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.B1
      mark_type: B
      points: 2
      evidence: |
        점 $\mathrm{H}$의 $x$좌표 $-a-\dfrac2a$를 올바르게 구했다.
      depends_on: []
      steps: [1-2b-1]
    - id: 1-2.M1
      mark_type: M
      points: 3
      evidence: |
        점 $\mathrm{Q}$와 직선 $L_1$ 사이의 거리가 최대가 되는 상황($q=-\dfrac1a$)을 관찰했다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-2]
    - id: 1-2.A1
      mark_type: A
      points: 4
      evidence: |
        정답 $\dfrac{(a^2+1)\sqrt{a^2+1}}{2a}$를 올바르게 구했다.
      depends_on: [1-2.M1]
      steps: [1-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    (3) (10점) 점 $\mathrm{P}$가 곡선 $y=\dfrac12x^2$ 위에 있도록 하는 $a$와 $b$ 사이의 관계식과 모든 $a$의 값의 범위를 구하시오.
  points: 10
  depends_on: ['1-2']
  answer: {kind: expression, value: 'relation: a*b=2; range: 0<a<sqrt(2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}$는 두 법선이 포물선과 다시 만나는 점이므로 $a+\tfrac2a=b+\tfrac2b$.
    steps:
    - id: 1-3a
      content: |
        $(b-a)(ab-2)=0$, $ab=2$, $a^2<ab=2$이므로 $0<a<\sqrt2$.
      criteria: ['1-3.M1', '1-3.A1', '1-3.A2']
    hint_ladder:
    - (2)의 ㉠을 점 $\mathrm{B}$에도 적용해 보자.
  - id: S1-3-B
    audience: B
    source_flow: 모범답안 p.7
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        점 $\mathrm{P}$의 $x$좌표를 $t\,(<0)$이라 하자. ㉠에 의해 점 $\mathrm{A}$에 대해 $t=-a-\dfrac2a$, 점 $\mathrm{B}$에 대해 $t=-b-\dfrac2b$를 얻는다.
      criteria: ['1-3.M1']
    - id: 1-3b-2
      content: |
        이로부터 $a+\dfrac2a=b+\dfrac2b$이고, 이를 통분하여 정리하면 $\dfrac{(b-a)(ab-2)}{ab}=0$이다. $0<a<b$이므로 $ab=2$, 즉 $b=\dfrac2a$이고,
      criteria: ['1-3.A1']
    - id: 1-3b-3
      content: |
        $a^2<ab=2$이므로 $0<a<\sqrt2$이다.
      criteria: ['1-3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 3
      evidence: |
