    steps:
    - id: 2-1a
      content: |
        중심 $\left(-\dfrac34,\dfrac{11}{4}\right)$, 반지름 $\dfrac{\sqrt{130}}{4}$, $\left(x+\dfrac34\right)^2+\left(y-\dfrac{11}{4}\right)^2=\dfrac{65}{8}$.
      criteria: ['2-1.M1', '2-1.A1', '2-1.A2']
    hint_ladder:
