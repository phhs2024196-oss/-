intent: |
  [문제 2-1] 함수의 그래프의 개형을 파악하여 함수의 그래프의 교점의 개수에 대한 문제를 해결할 수 있는지를 평가하는 문제이다. [문제 2-2] 함수의 증가와 감소를 파악하여 두 함수의 그래프의 교점의 개수에 대한 문제를 해결할 수 있는지를 평가하는 문제이다. [문제 2-3] 도함수를 방정식에 활용하여 두 함수의 그래프의 교점의 개수에 대한 문제를 해결할 수 있는지를 평가하는 문제이다. (선행학습영향평가 보고서 문항카드 원문)
key_idea: |
  주기 $\dfrac4m$인 톱니 함수 $g$를 더한 $f=ax^2+bg$는 각 조각에서 이차함수이므로 조각마다 꼭짓점 위치로 증감을 판정하면 바깥쪽은 단조, 가운데 몇 조각만 보면 된다. 원점을 지나는 직선 $y=cx$와의 교점은 $\dfrac{f(x)}{x}=c$로 바꿔 수평선과의 교점으로 센다.
stuck: |
  [문제 2-1](3)에서 $\sum(a_n-r)$이 수렴하려면 $a_n\to r$이어야 하므로 $r=2$이고 $n\ge11$이면 항이 $0$이라는 관찰, [문제 2-2]에서 「모든 $p>0$에 대해 교점 2개」를 「$x\le-1$에서 감소, $x\ge\tfrac13$에서 증가」로 바꾸는 단계
