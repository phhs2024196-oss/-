- id: '3'
  stem: |
    [문제 2-3] (10점) $a=1$, $b=1$, $m=2$일 때, 함수 $y=f(x)$의 그래프와 직선 $y=cx$의 교점의 개수가 최소가 되도록 하는 모든 실수 $c$의 값의 범위를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: 'Union(Interval.open(-oo,-13/6), Interval.open(-2,2*sqrt(2)-2), Interval.open(5/2,oo))', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 원점은 항상 교점이므로 $x\ne0$에서 $g(x)=\dfrac{f(x)}{x}=c$의 해의 개수를 증감표로 센다. 최소는 해 1개(전체 2개).
    steps:
    - id: 3a
      content: |
        $c<-\dfrac{13}{6}$, $-2<c<2\sqrt2-2$, $c>\dfrac52$.
      criteria: ['3.M1', '3.R1', '3.A1']
    hint_ladder:
    - $f(x)=cx$를 $x$로 나누면 어떤 그래프와 수평선의 교점 문제가 되는가?
  - id: S3-B
    audience: B
    source_flow: 모범답안 p.11~12
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(0)=0$이므로 곡선 $y=f(x)$와 직선 $y=cx$는 원점에서 만난다. $x\ne0$이면 방정식 $f(x)=cx$와 $\dfrac{f(x)}{x}=c$는 같은 해를 가지므로, 함수 $y=\dfrac{f(x)}{x}$의 그래프와 직선 $y=c$의 교점의 개수를 생각하면 된다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $$f(x)=\begin{cases}x^2+2(x-2k), & \frac{4k-1}{2}\le x<\frac{4k+1}{2}\\ x^2-2(x-2k)+2, & \frac{4k+1}{2}\le x<\frac{4k+3}{2}\end{cases}\quad\text{이므로}\quad\frac{f(x)}{x}=\begin{cases}x+2-\frac{4k}{x}\\ x-2+\frac{4k+2}{x}\end{cases}\ (x\ne0)$$
        이다. $(-\infty,0)\cup(0,\infty)$에서 $g(x)=\dfrac{f(x)}{x}$라 하면 $g^{\prime}(x)=1+\dfrac{4k}{x^2}$ 또는 $1-\dfrac{4k+2}{x^2}$이므로 함수 $g(x)$의 증가와 감소를 표로 나타내면 다음과 같다.
        $x$: $\cdots,-\tfrac52,\cdots,-2,\cdots,-\tfrac32,\cdots,-\tfrac12,\cdots,(0)$ / $g^{\prime}$: $+,\ ,+,0,-,\ ,+,\ ,+$ / $g$: $\nearrow,-\tfrac{21}{10},\nearrow,-2,\searrow,-\tfrac{13}{6},\nearrow,\tfrac32,\nearrow$
        $x$: $(0),\cdots,\tfrac12,\cdots,\sqrt2,\cdots,\tfrac32,\cdots$ / $g^{\prime}$: $+,\ ,-,0,+,\ ,+$ / $g$: $\nearrow,\tfrac52,\searrow,2\sqrt2-2,\nearrow,\tfrac56,\nearrow$
        [그림 다: 곡선 $y=g(x)$와 직선 $y=\tfrac52$, $y=2\sqrt2-2$, $y=-2$, $y=-\tfrac{13}{6}$]
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        따라서 $c<-\dfrac{13}{6}$, $-2<c<2\sqrt2-2$, $c>\dfrac52$에서 곡선 $y=g(x)$와 직선 $y=c$의 교점은 $1$개이다. 그러므로 곡선 $y=f(x)$와 직선 $y=cx$의 교점의 개수는 원점을 포함하여 $c<-\dfrac{13}{6}$, $-2<c<2\sqrt2-2$, $c>\dfrac52$에서 $2$개가 된다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $x\ne0$이면 방정식 $f(x)=cx$와 $\dfrac{f(x)}{x}=c$는 같은 해를 가짐을 관찰했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 5
      evidence: |
        $\dfrac{f(x)}{x}$의 증감을 이용하여 함수의 성질을 관찰했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        정답 $c<-\dfrac{13}{6}$, $-2<c<2\sqrt2-2$, $c>\dfrac52$를 올바르게 계산했다.
      depends_on: [3.M1, 3.R1]
      steps: [3b-3]
    deductions: []
