- id: '2-1'
  stem: |
    [문제 1-2] (30점) 제시문 (나)를 읽고 다음의 물음에 답하여라,

    (1) $f(x)=nx^2$ ($n$은 양의 정수)일 때 <조건>을 만족하는 점 $\mathrm{P}$에 대하여, $\triangle\mathrm{OAP}$의 넓이를 $t_n$라 하자. $\displaystyle\lim_{n\to\infty}(t_n+1)^{\frac1n}$의 값을 구하여라.
  points: 8
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: 동치 방정식 $3nx^2-2nx-n=0$에서 $\mathrm{P}\left(-\tfrac13,\tfrac n9\right)$, $t_n=\tfrac{2n}{9}$; $\ln$을 취해 샌드위치.
    steps:
    - {id: 2-1a, content: '$0\le\ln(t_n+1)^{\frac1n}\le\dfrac{\ln n}{n}\to0\Rightarrow$ 극한 $1$', criteria: ['2-1.M1', '2-1.A1', '2-1.A2']}
    hint_ladder:
    - 제시문 (나)의 방정식에 $f(x)=nx^2$을 대입하자.
    - $(t_n+1)^{\frac1n}$에 로그를 취하자.
  - id: S2-1-B
    audience: B
    source_flow: 자료집 풀이 p.21
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        $f(x)=nx^2$일 때 $f(1)=n$이고 $f^{\prime}(x)=2nx$이므로 제시문 (나)의 식은 $(1-x)2nx=nx^2-n$이다. 정리하면 $3nx^2-2nx-n=0$, 인수분해하면 $n(3x+1)(x-1)=0$이고 1이 아닌 실근 $x=-\dfrac13$을 가진다. 따라서 점 $\mathrm{P}$는 $\left(-\dfrac13,\dfrac n9\right)$으로 결정된다.
      criteria: ['2-1.M1']
    - id: 2-1b-2
      content: |
        점 $\mathrm{A}$와 점 $\mathrm{P}$를 $x$축에 내린 수선의 발을 각각 $\mathrm{B}$, $\mathrm{Q}$라 하면 $\triangle\mathrm{OAP}$의 넓이는 사다리꼴 $\mathrm{ABQP}$의 넓이에서 $\triangle\mathrm{OAB}$와 $\triangle\mathrm{OPQ}$의 넓이의 합을 빼서 구할 수 있다. 사다리꼴 $\mathrm{ABQP}$의 넓이는 $\left(n+\dfrac n9\right)\cdot\dfrac43\cdot\dfrac12=\dfrac{20n}{27}$, $\triangle\mathrm{OAB}$의 넓이는 $\dfrac n2$, $\triangle\mathrm{OPQ}$의 넓이는 $\dfrac{n}{54}$이므로 $t_n=\dfrac{n(40-27-1)}{54}=\dfrac{2n}{9}$이다.
      criteria: ['2-1.A1']
    - id: 2-1b-3
      content: |
        극한의 대소 관계에 의해
        $$0\le\lim_{n\to\infty}\ln(t_n+1)^{\frac1n}=\lim_{n\to\infty}\frac{\ln\left(\frac{2n}{9}+1\right)}{n}\le\lim_{n\to\infty}\frac{\ln n}{n}=0$$
        이 되어 $\displaystyle\lim_{n\to\infty}\ln(t_n+1)^{\frac1n}=0$이다. 따라서 $\displaystyle\lim_{n\to\infty}(t_n+1)^{\frac1n}=1$이다.
      criteria: ['2-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 채점기준 미공개 — 단계별 추정
    criteria:
