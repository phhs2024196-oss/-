stimuli:
- label: 가
  body: |
    [그림1]과 같이 이차함수의 그래프 $y=kx^2$ ($k>0$인 실수)와 점 $\mathrm{A}_0(1,k)$가 있다. 또한 곡선 $y=kx^2$을 따라 원점 $\mathrm{O}(0,0)$과 점 $\mathrm{A}_0$ 사이를 움직이는 점 $\mathrm{P}$가 있다.

    [그림1: 포물선 $y=kx^2$, 점 $\mathrm{A}_0(1,k)$와 $x$축·$y$축으로 내린 점선, 원점 O와 $\mathrm{A}_0$ 사이 곡선 위의 점 $\mathrm{P}$, 삼각형 $\mathrm{OA}_0\mathrm{P}$가 음영으로 표시됨. 축 눈금: $x$축 $1$, $y$축 $k$.]

    점 $\mathrm{P}$가 원점 $\mathrm{O}$와 점 $\mathrm{A}_0$ 사이를 움직이면서 $\triangle\mathrm{OA}_0\mathrm{P}$의 넓이가 최대가 될 때 점 $\mathrm{P}$의 위치를 $\mathrm{A}_1$이라고 하고, 그때의 $\triangle\mathrm{OA}_0\mathrm{A}_1$의 넓이를 $s_1$이라 하자. 이런 방법으로 음이 아닌 정수 $n$에 대하여, 원점 $\mathrm{O}$에서 점 $\mathrm{A}_n$까지 곡선 $y=kx^2$을 따라 점 $\mathrm{P}$가 움직일 때, $\triangle\mathrm{OA}_n\mathrm{P}$의 넓이가 최대가 되는 점 $\mathrm{P}$의 위치를 점 $\mathrm{A}_{n+1}$이라 하고 이때의 $\triangle\mathrm{OA}_n\mathrm{A}_{n+1}$의 넓이를 $s_{n+1}$이라 하자.

    점 $\mathrm{A}_n$을 $x$축에 내린 수선의 발을 점 $\mathrm{B}_n$이라 하면, $\triangle\mathrm{OA}_n\mathrm{P}$의 넓이는 $\triangle\mathrm{OA}_n\mathrm{B}_n$의 넓이에서 $\triangle\mathrm{OB}_n\mathrm{P}$의 넓이와 $\triangle\mathrm{A}_n\mathrm{B}_n\mathrm{P}$의 넓이의 합을 빼서 구할 수 있다.
- label: 나
  body: |
    미분가능한 함수 $y=f(x)$와 점 $\mathrm{A}(1,f(1))$이 있다. 아래의 <조건>을 만족하는 $y=f(x)$의 그래프 위의 점 $\mathrm{P}$가 존재하는지 판단하고자 한다.

    <조 건>
    (1) $\mathrm{P}\ne\mathrm{A}$이다.
    (2) 점 $\mathrm{P}$에서 $y=f(x)$에 대한 접선의 기울기는 선분 $\overline{\mathrm{AP}}$를 포함하는 직선의 기울기에 $-1$을 곱한 것과 같다.

    위의 <조건>을 만족하는 점 $\mathrm{P}(x,y)$가 존재한다고 가정하자. 그러면 점 $\mathrm{P}$에서 $y=f(x)$에 대한 접선의 기울기는 $f^{\prime}(x)$이고 선분 $\overline{\mathrm{AP}}$의 기울기는 $\dfrac{f(1)-f(x)}{1-x}$ (단, $x\ne1$)이므로, $f^{\prime}(x)=-\dfrac{f(1)-f(x)}{1-x}$가 된다. 따라서 <조건>을 만족하는 점 $\mathrm{P}$가 존재하는 것과 $x$에 대한 방정식 $(1-x)f^{\prime}(x)=f(x)-f(1)$의 $x\ne1$인 실근이 존재하는 것은 동치이다.

stem: |
  [문항 1] (50점) 다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (20점) 제시문 (가)를 읽고 다음의 물음에 답하여라.

    (1) 점 $\mathrm{A}_1$의 $x$좌표를 구하여라.
  points: 4
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: 넓이의 2배가 $kx-kx^2$이므로 $x=\tfrac12$에서 최대.
    steps:
    - {id: 1-1a, content: '$2\times\triangle\mathrm{OA}_0\mathrm{P}=-k\left(x-\tfrac12\right)^2+\tfrac k4$', criteria: ['1-1.M1', '1-1.A1']}
    hint_ladder:
    - 제시문의 넓이 뺄셈을 $n=0$에 적용하자.
  - id: S1-1-B
    audience: B
    source_flow: 자료집 풀이 p.20
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        $\triangle\mathrm{OA}_0\mathrm{P}$의 넓이는 $\triangle\mathrm{OA}_0\mathrm{B}_0$의 넓이에서 $\triangle\mathrm{OB}_0\mathrm{P}$의 넓이와 $\triangle\mathrm{A}_0\mathrm{B}_0\mathrm{P}$의 넓이의 합을 빼서 구할 수 있다. 점 $\mathrm{P}$의 좌표를 $(x,kx^2)$이라 두면 $\triangle\mathrm{OA}_0\mathrm{B}_0$의 넓이는 $\dfrac k2$, $\triangle\mathrm{OB}_0\mathrm{P}$의 넓이는 $\dfrac{kx^2}{2}$, $\triangle\mathrm{A}_0\mathrm{B}_0\mathrm{P}$의 넓이는 $\dfrac{(1-x)k}{2}$이다.
      criteria: ['1-1.M1']
    - id: 1-1b-2
      content: |
        $$2\times(\triangle\mathrm{OA}_0\mathrm{P}\text{의 넓이})=k-(kx^2+(1-x)k)=kx-kx^2=-k\left(x-\frac12\right)^2+\frac k4.$$
        따라서 $x=\dfrac12$일 때 $\triangle\mathrm{OA}_0\mathrm{P}$의 넓이는 최대이므로 $\mathrm{A}_1$의 $x$좌표는 $\dfrac12$이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 채점기준 미공개 — 단계별 추정
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        $\triangle\mathrm{OA}_0\mathrm{P}$의 넓이를 $\dfrac k2-\dfrac{kx^2}{2}-\dfrac{(1-x)k}{2}$처럼 $x$의 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        완전제곱식 등으로 최대가 되는 $x=\dfrac12$를 구했다.
      depends_on: [1-1.M1]
      steps: [1-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) $\displaystyle\sum_{n=1}^{\infty}s_n$의 값을 $k$에 대한 식으로 나타내어라.
  points: 8
  depends_on: ['1-1']
  answer: {kind: expression, value: 'k/7', equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: 같은 계산으로 $x_{n+1}=\tfrac{x_n}{2}$, $s_{n+1}=\tfrac{kx_n^3}{8}$; 공비 $\tfrac18$인 등비급수.
    steps:
    - {id: 1-2a, content: '$s_n=k\left(\tfrac18\right)^n\Rightarrow\sum s_n=\dfrac{k/8}{1-1/8}=\dfrac k7$', criteria: ['1-2.M1', '1-2.A1', '1-2.A2']}
    hint_ladder:
    - $\mathrm{A}_n$의 $x$좌표를 $x_n$으로 두고 (1)을 반복하자.
  - id: S1-2-B
    audience: B
    source_flow: 자료집 풀이 p.20
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        점 $\mathrm{A}_n$의 $x$좌표를 $x_n$, 점 $\mathrm{P}$의 좌표를 $(x,kx^2)$이라 두면 $\triangle\mathrm{OA}_n\mathrm{B}_n$의 넓이는 $\dfrac{kx_n^3}{2}$, $\triangle\mathrm{OB}_n\mathrm{P}$의 넓이는 $\dfrac{kx^2x_n}{2}$, $\triangle\mathrm{A}_n\mathrm{B}_n\mathrm{P}$의 넓이는 $\dfrac{(x_n-x)kx_n^2}{2}$이므로
        $$2\times(\triangle\mathrm{OA}_n\mathrm{P}\text{의 넓이})=kx_n^3-(kx^2x_n+(x_n-x)kx_n^2)=kx_n^2x-kx_nx^2=-kx_n\left(x-\frac{x_n}{2}\right)^2+\frac{kx_n^3}{4}.$$
        즉 $x=\dfrac{x_n}{2}$일 때 $\triangle\mathrm{OA}_n\mathrm{P}$의 넓이가 최대이다.
      criteria: ['1-2.M1']
    - id: 1-2b-2
      content: |
        따라서 $x_{n+1}=\dfrac{x_n}{2}$이며 $s_{n+1}=\dfrac{kx_n^3}{8}$이다. 수열 $\{x_n\}$은 초항이 $\dfrac12$이고 공비가 $\dfrac12$인 등비수열 $x_n=\left(\dfrac12\right)^n$이고, 이로부터 $s_{n+1}=\dfrac k8\left(\dfrac12\right)^{3n}=k\left(\dfrac18\right)^{n+1}$이 된다.
      criteria: ['1-2.A1']
    - id: 1-2b-3
      content: |
        $s_1=\dfrac k8$이므로 수열 $\{s_n\}$도 등비수열이 되어 $\displaystyle\sum_{n=1}^{\infty}s_n=\frac{\frac k8}{1-\frac18}=\frac k7$이다.
      criteria: ['1-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 채점기준 미공개 — 단계별 추정
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 3
      evidence: |
        $\triangle\mathrm{OA}_n\mathrm{P}$의 넓이를 $x_n$, $x$의 식으로 나타내 $x=\dfrac{x_n}{2}$에서 최대임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-1]
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        $x_n=\left(\dfrac12\right)^n$과 $s_n=k\left(\dfrac18\right)^n$ (또는 $s_{n+1}=\dfrac{kx_n^3}{8}$)을 구했다.
      depends_on: [1-2.M1]
      steps: [1-2b-2]
    - id: 1-2.A2
      mark_type: A
      points: 2
      evidence: |
        등비급수의 합 $\dfrac k7$을 구했다.
      depends_on: [1-2.M1, 1-2.A1]
      steps: [1-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    (3) 점 $\mathrm{P}$와 $y$축 대칭인 점을 $\mathrm{P}^{\prime}$라 하고 $\triangle\mathrm{A}_0\mathrm{PP}^{\prime}$의 넓이가 최대일 때 점 $\mathrm{P}$의 $x$좌표를 $p$라 하자. $\displaystyle\int_0^px(\sin\pi x^2-\cos\pi x^2)\,dx$의 값을 구하여라.
  points: 8
  depends_on: []
  answer: {kind: value, value: '(1-sqrt(3))/(4*pi)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: 넓이 $kx-kx^3$은 $x=\tfrac{\sqrt3}{3}$에서 최대, $p^2=\tfrac13$; $u=\pi x^2$ 치환.
    steps:
    - {id: 1-3a, content: '$\displaystyle\int_0^px(\sin\pi x^2-\cos\pi x^2)\,dx=-\frac1{2\pi}\left[\cos\pi x^2+\sin\pi x^2\right]_0^p=\frac{1-\sqrt3}{4\pi}$', criteria: ['1-3.M1', '1-3.A1', '1-3.M2', '1-3.A2']}
    hint_ladder:
    - 삼각형 $\mathrm{A}_0\mathrm{PP}^{\prime}$의 밑변과 높이를 $x$로 나타내자.
    - $\pi x^2$을 한 문자로 치환하자.
  - id: S1-3-B
    audience: B
    source_flow: 자료집 풀이 p.21
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        점 $\mathrm{P}$의 좌표를 $(x,y)$라 할 때, $\triangle\mathrm{A}_0\mathrm{P}^{\prime}\mathrm{P}$의 높이는 $k-y$, 밑변의 길이는 $2x$이므로 $\triangle\mathrm{A}_0\mathrm{PP}^{\prime}$의 넓이는 $x(k-y)=kx-kx^3$이다.
      criteria: ['1-3.M1']
    - id: 1-3b-2
      content: |
        이제 $0\le x\le1$일 때 $f(x)=kx-kx^3$이 최대가 되도록 하는 $x$의 값을 구하면 된다. $f^{\prime}(x)=k-3kx^2=k(1-3x^2)$이므로 $x=\dfrac{\sqrt3}{3}$에서 $f(x)$가 최댓값을 가진다. 따라서 $p=\dfrac{\sqrt3}{3}$이고 $p^2=\dfrac13$이다.
      criteria: ['1-3.A1']
    - id: 1-3b-3
      content: |
        주어진 정적분을 계산하면
        $$\int_0^px(\sin\pi x^2-\cos\pi x^2)\,dx=-\frac1{2\pi}\left[\cos\pi x^2+\sin\pi x^2\right]_0^p=-\frac1{2\pi}\left(\cos\frac\pi3+\sin\frac\pi3\right)+\frac1{2\pi}=\frac{1-\sqrt3}{4\pi}$$
        이다.
      criteria: ['1-3.M2', '1-3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 채점기준 미공개 — 단계별 추정
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 2
      evidence: |
        $\triangle\mathrm{A}_0\mathrm{PP}^{\prime}$의 넓이를 $kx-kx^3$ (또는 $x(k-kx^2)$)으로 나타냈다.
      depends_on: []
