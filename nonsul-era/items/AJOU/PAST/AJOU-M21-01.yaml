- id: '2-3'
  stem: |
    (3) $f(x)=kx^2+kx$ ($k\ne0$인 실수)일 때, <조건>을 만족하는 점 $\mathrm{P}$가 존재하도록 하는 $k$ 값의 범위를 구하여라.
  points: 10
  depends_on: []
  answer: {kind: set, value: 'Union(Interval.open(-oo, 0), Interval.open(0, oo))', equivalents: ['k≠0인 모든 실수'], tolerance: null}
  solutions:
  - id: S2-3-A
    audience: A
    method_no: 1
    key_idea: 동치 방정식이 $3kx=-3k$로 정리되어 $x=-1$이 항상 근.
    steps:
    - {id: 2-3a, content: '$(1-x)k(2x+1)=k(x+2)(x-1)\Rightarrow x=-1$ ($k\ne0$ 모두)', criteria: ['2-3.M1', '2-3.A1', '2-3.A2']}
    hint_ladder:
    - $f(x)-f(1)$을 인수분해하면 $(x-1)$이 나온다.
  - id: S2-3-B
    audience: B
    source_flow: 자료집 풀이 p.22
    method_no: 1
    steps:
    - id: 2-3b-1
      content: |
        제시문 (나)를 통해 <조건>을 만족하는 $\mathrm{P}(x,y)$의 존재는 방정식 $(1-x)f^{\prime}(x)=f(x)-f(1)$을 만족하는 1이 아닌 실근의 존재 여부와 같다. $f^{\prime}(x)=2kx+k=k(2x+1)$이고 $f(x)-f(1)=kx^2+kx-2k=k(x+2)(x-1)$이므로 $x$에 대한 방정식 $(1-x)k(2x+1)=k(x+2)(x-1)$의 1이 아닌 실근의 존재 여부를 판단하면 된다.
      criteria: ['2-3.M1']
    - id: 2-3b-2
      content: |
        $x\ne1$에서 양변을 $1-x$로 나누어 정리하면 $k(2x+1)=-k(x+2)$가 되어 $3kx=-3k$이다.
      criteria: ['2-3.A1']
    - id: 2-3b-3
      content: |
        이 방정식을 만족하는 1이 아닌 실근 $x=-1$이 항상 존재한다. 즉, $0$이 아닌 모든 실수 $k$에 대해 방정식을 만족하는 1이 아닌 실근이 존재한다.
      criteria: ['2-3.A2']
