- id: '2-2'
  stem: |
    (2) $f(x)=xe^x$일 때 <조건>을 만족하는 점 $\mathrm{P}$가 존재하지 않음을 증명하여라.
  points: 12
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $g(x)=(x^2+x-1)e^x-e$의 증감표에서 극댓값 $g(-3)<0$, $x>0$에서 증가하고 $g(1)=0$이므로 다른 근이 없다.
    steps:
    - {id: 2-2a, content: '$g^{\prime}(x)=x(x+3)e^x$; $g(-3)=\tfrac5{e^3}-e<0$, $g(0)=-e-1<0$, $g(1)=0$', criteria: ['2-2.M1', '2-2.M2', '2-2.R1']}
    hint_ladder:
    - 제시문 (나)의 방정식을 $g(x)=0$ 꼴로 정리하자.
    - $g$의 극값의 부호를 조사하자.
  - id: S2-2-B
    audience: B
    source_flow: 자료집 풀이 p.21~22
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        $f(1)=e$이고 $f^{\prime}(x)=(x+1)e^x$이다. 제시문 (나)의 식은 $(1-x)(x+1)e^x=xe^x-e$이다. 즉 $x$에 대한 방정식 $(x^2+x-1)e^x-e=0$의 $x\ne1$인 실근이 존재하지 않음을 보이면 충분하다.
      criteria: ['2-2.M1']
    - id: 2-2b-2
      content: |
        편의상 $g(x)=(x^2+x-1)e^x-e$라 두자. $g(1)=0$이므로 $x=1$은 방정식 $g(x)=0$의 근이다. $g^{\prime}(x)=(x^2+3x)e^x=x(x+3)e^x$이므로 $g(x)$는 $x<-3$에서 증가, $-3<x<0$에서 감소, $x>0$에서 증가하고, 극댓값 $g(-3)=\dfrac5{e^3}-e$, 극솟값 $g(0)=-e-1$이다.
      criteria: ['2-2.M2']
    - id: 2-2b-3
      content: |
        $y=g(x)$는 연속함수이고, $e>2$를 이용하면 극댓값 $g(-3)<0$, 극솟값 $g(0)<0$, $g(1)=0$, $g(2)=5e^2-e>0$이므로 $g(x)=0$은 $x=1$ 이외의 근을 가질 수 없다. (보충: $x\le0$에서 $g(x)\le g(-3)<0$이고, $x>0$에서 $g$는 증가하므로 근은 $x=1$ 하나뿐이다.) 따라서 <조건>을 만족하는 점 $\mathrm{P}$는 존재하지 않는다. ■
      criteria: ['2-2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
