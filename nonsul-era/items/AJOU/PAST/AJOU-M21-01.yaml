intent: |
  포물선 위 점과 두 점이 만드는 삼각형의 넓이를 이차식으로 나타내 최대를 찾고 그 반복으로 생기는 등비급수의 합을 구하는 능력, 그리고 '접선 기울기 = 할선 기울기의 $-1$배' 조건을 방정식의 실근 존재로 바꿔 증감표·사잇값으로 근의 존재를 판정하는 능력을 본다.
key_idea: |
  넓이를 큰 삼각형에서 작은 두 삼각형을 빼서 $x$의 이차식으로 만들면 최대점이 $x_{n+1}=\dfrac{x_n}{2}$. (나)의 조건은 방정식 $(1-x)f^{\prime}(x)=f(x)-f(1)$의 $x\ne1$인 실근 존재와 동치이다.
stuck: |
  $\triangle\mathrm{OA}_n\mathrm{P}$의 넓이를 뺄셈으로 표현하는 것, 그리고 $f(x)=xe^x$에서 보조함수 $g(x)=(x^2+x-1)e^x-e$의 증감표로 $x=1$ 외의 근이 없음을 보이는 단계
