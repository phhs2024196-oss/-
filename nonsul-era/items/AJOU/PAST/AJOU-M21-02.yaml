      depends_on: []
      implied_ok: false
      steps: [2-2b-1]
    - id: 2-2.A1
      mark_type: A
      points: 5
      evidence: |
        $F_k={}_n\mathrm{C}_k\times(2^{k-1}-1)\times3^{n-k}\times2$ ($k\ge2$)를 근거와 함께 구했다.
      depends_on: [2-2.M1]
      steps: [2-2b-2]
    - id: 2-2.M2
      mark_type: M
      points: 3
      evidence: |
        합의 범위를 $k=0$부터로 맞추어 이항정리를 적용할 수 있는 꼴로 정리했다.
      depends_on: []
      implied_ok: false
      steps: [2-2b-3]
    - id: 2-2.A2
      mark_type: A
      points: 3
      evidence: |
        $\displaystyle\sum_{k=0}^nF_k=5^n+3^n-2^{2n+1}$을 구했다.
      depends_on: [2-2.A1, 2-2.M2]
      steps: [2-2b-4]
    deductions: []
