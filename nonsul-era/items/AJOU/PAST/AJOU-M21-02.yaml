- id: '2-1'
  stem: |
    [문제 2-2] (25점) 제시문을 읽고 다음의 물음에 답하여라.

    (1) 한 개의 전구에 $10$장의 비닐커버를 겹쳐 씌울 때, 다음 <조건>을 만족하는 경우의 수를 $E_k$라 하자. (단, $k$는 $2\le k\le10$인 정수이다.)

    <조 건>
    첫 번째 비닐커버를 씌웠을 때 전구 색은 노란색이었고, $k$ 번째 비닐커버를 씌웠을 때 전구의 색은 처음으로 초록색이 되었다.

    $c=\log_{10}6$라 할 때, $\displaystyle\sum_{k=2}^{10}\log_{10}E_k$의 값을 $c$에 대한 식으로 나타내어라.
  points: 12
  depends_on: []
  answer: {kind: expression, value: '36*c', equivalents: [], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: 2~$(k-1)$번째는 노·흰 중 하나, $k$번째는 파랑, 이후 자유 → $E_k=2^{k-2}3^{10-k}$.
    steps:
    - {id: 2-1a, content: '$\sum\log_{10}E_k=36\log_{10}2+36\log_{10}3=36c$', criteria: ['2-1.M1', '2-1.A1', '2-1.A2']}
    hint_ladder:
    - $k$번째 전에 파란색이 나오면 안 되는 이유는?
    - $\log_{10}E_k$를 $\log_{10}2$, $\log_{10}3$으로 나누어 쓰자.
  - id: S2-1-B
    audience: B
    source_flow: 자료집 풀이 p.24
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        <조건>을 만족하기 위해서는 첫 번째 비닐커버의 색은 노란색이어야 하고, $k$번째 비닐커버를 씌우기 이전에는 노란색, 흰색 비닐커버만 씌워야 한다. 그리고 $k$번째는 반드시 파란색이 나와야 하고, 그 이후에는 어떤 것이 나와도 상관없다.
      criteria: ['2-1.M1']
    - id: 2-1b-2
      content: |
        따라서 <조건>을 만족하는 경우의 수는 $E_k=2^{k-2}\times3^{10-k}$이다.
      criteria: ['2-1.A1']
    - id: 2-1b-3
      content: |
        $a=\log_{10}2$, $b=\log_{10}3$이라 두면 $\log_{10}E_k=(k-2)a+(10-k)b$이므로
        $$\sum_{k=2}^{10}\log_{10}E_k=a\sum_{k=2}^{10}(k-2)+b\sum_{k=2}^{10}(10-k)=a(0+1+\cdots+7+8)+b(8+7+\cdots+1+0)=(a+b)\frac{8\times9}{2}$$
        이다. 한편 $c=a+b$이므로 원하는 답은 $36c$이다.
      criteria: ['2-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 채점기준 미공개 — 단계별 추정
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 4
      evidence: |
        첫 장은 노란색, $k$번째 전에는 노란색·흰색만, $k$번째는 파란색, 이후는 자유라는 조건을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2-1b-1]
    - id: 2-1.A1
      mark_type: A
      points: 4
      evidence: |
        $E_k=2^{k-2}\times3^{10-k}$을 구했다.
      depends_on: [2-1.M1]
      steps: [2-1b-2]
    - id: 2-1.A2
      mark_type: A
      points: 4
      evidence: |
        로그의 성질과 합 공식으로 $36c$를 구했다.
      depends_on: [2-1.M1, 2-1.A1]
      steps: [2-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    (2) 양의 정수 $n$에 대하여 $n$개의 전구가 한 줄로 정렬되어 차례대로 놓여 있고, 각 전구 마다 $n$장의 비닐커버를 겹쳐 씌운다. 전구를 이동하지 않으며 비닐커버를 씌운 뒤 색이 같더라도 전구는 놓인 위치에 따라 구별가능하다. 이때 다음 <조건>을 만족하는 경우의 수를 $F_k$라 하자. (단, $k$는 $0\le k\le n$인 정수이다.)

    <조 건>
    (가) 정확히 $k$개의 전구에는 동일한 색상 순서로 비닐 커버를 씌우고, $k$ 번째 비닐커버를 씌웠을 때 전구의 색은 처음으로 초록색이 된다.
    (나) 나머지 $n-k$개의 전구는 $n$장의 비닐커버를 씌운 후에도 흰색이다.

    이때, $\displaystyle\sum_{k=0}^{n}F_k$의 값을 $n$에 대한 식으로 나타내어라.
  points: 13
  depends_on: ['2-1']
  answer: {kind: expression, value: '5**n + 3**n - 2**(2*n + 1)', equivalents: ['5**n - 2*4**n + 3**n'], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $F_k={}_n\mathrm{C}_k(2^k-2)3^{n-k}$ ($k\ge2$), $k=0$ 항을 보정해 이항정리.
    steps:
    - {id: 2-2a, content: '$\sum F_k=(2+3)^n-2(1+3)^n+3^n=5^n+3^n-2^{2n+1}$', criteria: ['2-2.M1', '2-2.A1', '2-2.M2', '2-2.A2']}
    hint_ladder:
    - 먼저 색이 변하는 $k$개의 전구를 고르자.
    - 앞 $k-1$장에서 노란색이 적어도 한 번 나오는 경우의 수는?
    - $\sum{}_n\mathrm{C}_kx^k3^{n-k}=(x+3)^n$을 쓰려면 빠진 $k=0,1$ 항을 어떻게 처리할까?
  - id: S2-2-B
    audience: B
    source_flow: 자료집 풀이 p.24
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        먼저 $F_0=F_1=0$임을 확인하자. $k\ge2$일 때 $F_k$를 구하기 위해 먼저 색이 변하는 $k$개의 전구를 고른다(${}_n\mathrm{C}_k$가지의 경우).
      criteria: ['2-2.M1']
    - id: 2-2b-2
      content: |
        전구에 $k$번째 비닐커버를 씌우면서 노란색에서 초록색으로 변한다고 가정하자. 처음 $k-1$번째 비닐커버를 겹쳐 씌울 동안 노란색 비닐커버가 반드시 한 번은 나오도록 씌우는 경우의 수는 노란색과 흰색 비닐커버를 임의로 $k-1$개 고르는 경우의 수에서 흰색 비닐커버만 씌우는 경우를 제외하면 된다($2^{k-1}-1$). $k$번째 비닐커버는 반드시 파란색이어야 하며, 나머지 $n-k$개의 비닐커버의 경우는 제약이 없으므로 가능한 경우의 수는 $3^{n-k}$이다. 따라서 곱의 법칙에 의하여 가능한 경우의 수는 ${}_n\mathrm{C}_k\times(2^{k-1}-1)\times3^{n-k}$이다.
        전구에 $k$번째 비닐커버를 씌우면서 파란색에서 초록색으로 변하는 경우 역시 같은 방법으로 계산할 수 있으므로 $F_0=F_1=0$, $F_k={}_n\mathrm{C}_k\times(2^{k-1}-1)\times3^{n-k}\times2$ (단, $k\ge2$)이다.
      criteria: ['2-2.A1']
    - id: 2-2b-3
      content: |
        따라서 이항정리에 의해
        $$\sum_{k=0}^{n}F_k=\left(\sum_{k=2}^{n}{}_n\mathrm{C}_k2^k3^{n-k}-2\sum_{k=2}^{n}{}_n\mathrm{C}_k3^{n-k}\right)=\left(\sum_{k=0}^{n}{}_n\mathrm{C}_k2^k3^{n-k}-2\sum_{k=0}^{n}{}_n\mathrm{C}_k3^{n-k}\right)+3^n$$
      criteria: ['2-2.M2']
    - id: 2-2b-4
      content: |
        $$=(2+3)^n-2(1+3)^n+3^n=5^n+3^n-2^{2n+1}$$
        이다. (보충: $k=1$ 항은 $n(2-2)3^{n-1}=0$, $k=0$ 항은 $(1-2)3^n=-3^n$이므로 범위를 $k=0$부터로 늘리면 $3^n$을 더해 준다.)
      criteria: ['2-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
