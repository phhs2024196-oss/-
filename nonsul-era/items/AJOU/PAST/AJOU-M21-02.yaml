stimuli:
- label: 제시문
  body: |
    전구에 색이 있는 반투명 비닐커버를 씌운다고 하자. 비닐커버는 노란색, 파란색, 흰색 중 하나이며, 비닐커버를 임의로 골랐을 때 각 색을 가질 확률은 항상 $\dfrac13$로 서로 같다. 전구에 비닐커버 한 장을 씌우면 전구는 비닐커버와 같은 색으로 보인다.

    [그림: 노란색·파란색·흰색 비닐커버를 각각 한 장 씌우면 전구가 그 색으로 보이는 세 쌍의 그림]

    전구에는 여러 장의 비닐커버를 겹치도록 씌울 수 있다. 안쪽부터 바깥쪽까지 차례대로 씌우며, 벗길 때는 바깥쪽부터 안쪽 순서대로 벗긴다. 여러 장의 비닐커버를 동시에 겹쳐서 씌우면 다음 규칙에 따라 전구의 색이 노란색, 파란색, 흰색, 초록색 중 하나로 결정된다.

    <비닐커버 색에 따른 전구의 색 규칙>
    (1) 비닐커버의 순서는 전구의 색에 영향을 주지 않는다.
    (2) 특정 색의 비닐커버와 흰색 비닐커버를 겹쳐 씌우면 전구는 특정색으로 보인다.
    [그림: 흰색+노란색 커버 → 노란색 전구]
    (3) 노란색 비닐커버와 파란색 비닐커버를 겹쳐 씌우면 전구의 색은 초록색이다.
    [그림: 파란색+노란색 커버 → 초록색 전구]
    (4) 같은 색의 비닐커버를 여러 장 겹쳐 씌울 때, 전구의 색은 그 색이 한 장이 있는 것과 같다.
    [그림: 파란색 2장+노란색 커버 → 초록색 전구]

    예를 들어 노란색 비닐커버 2장, 파란색 비닐커버 2장, 흰색 비닐커버 1장을 겹쳐서 씌우면 씌우는 순서에 상관없이 전구의 색은 초록색이다.

stem: |
  [문항 2] (50점) 다음 제시문을 읽고 논제에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 2-1] (25점) 제시문을 읽고 다음의 물음에 답하여라.

    (1) 두 장의 비닐커버를 임의로 골라 하나의 전구에 씌웠을 때 전구의 색이 노란색일 확률을 구하여라.
  points: 7
  depends_on: []
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: (안쪽, 바깥쪽)이 (노,노), (노,흰), (흰,노)인 세 경우, 각 $\tfrac19$.
    steps:
    - {id: 1-1a, content: '$3\times\tfrac19=\tfrac13$', criteria: ['1-1.M1', '1-1.A1']}
    hint_ladder:
    - 노란색으로 보이려면 두 장의 색 구성이 어때야 하는가? 순서도 생각하자.
  - id: S1-1-B
    audience: B
    source_flow: 자료집 풀이 p.23
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        전구의 색이 노란색이기 위해서는 두 장의 비닐커버가 모두 노란색이거나 노란색+흰색이어야 한다. 이때 비닐커버를 씌우는 순서를 고려하면 세 가지 경우가 생긴다: 노란색+노란색 $=P_{yy}=\dfrac19$, 노란색+흰색 $=P_{yw}=\dfrac19$, 흰색+노란색 $=P_{wy}=\dfrac19$. (단, $c_1$색 + $c_2$색은 안쪽 비닐커버의 색이 $c_1$, 바깥쪽 비닐커버의 색이 $c_2$라는 의미)
      criteria: ['1-1.M1']
    - id: 1-1b-2
      content: |
        따라서 합의 법칙에 의해 전구의 색이 노란색일 확률은 $\dfrac13$이다. (참고: 파란색일 확률 역시 $\dfrac13$, 흰색일 확률은 $\dfrac19$, 초록색일 확률은 $\dfrac29$이다.)
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 채점기준 미공개 — 단계별 추정
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 4
      evidence: |
        순서를 고려한 세 경우(노+노, 노+흰, 흰+노)와 각 확률 $\dfrac19$을 제시했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        확률 $\dfrac13$을 구했다.
      depends_on: [1-1.M1]
      steps: [1-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) 두 장의 비닐커버를 임의로 골라 하나의 전구에 씌웠더니 이 전구의 색이 노란색이 되었다. 이 전구의 바깥쪽 비닐커버를 한 장 벗겼을 때 전구의 색이 여전히 노란색일 확률을 구하여라.
  points: 9
  depends_on: ['1-1']
  answer: {kind: value, value: '2/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: 벗긴 뒤 남는 것은 안쪽 커버; 노란색 세 경우 중 안쪽이 노란색인 것은 2개.
    steps:
    - {id: 1-2a, content: '$\dfrac{P_{yy}+P_{yw}}{P_{yy}+P_{yw}+P_{wy}}=\dfrac23$', criteria: ['1-2.M1', '1-2.A1']}
    hint_ladder:
    - 바깥쪽을 벗기면 어떤 커버가 남는가?
  - id: S1-2-B
    audience: B
    source_flow: 자료집 풀이 p.23
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        전구가 노란색일 때에는 (1)의 풀이와 같은 세 가지 경우($P_{yy}$, $P_{yw}$, $P_{wy}$) 중 하나이고, 이 중 바깥쪽 비닐커버를 벗겨내도 여전히 노란색이 되기 위해서는 안쪽 비닐커버가 노란색이 되어야 하므로 노란색+노란색 혹은 노란색+흰색의 경우($P_{yy}$, $P_{yw}$)가 된다.
      criteria: ['1-2.M1']
    - id: 1-2b-2
      content: |
        따라서 조건부확률을 계산하면 $\dfrac{P_{yy}+P_{yw}}{P_{yy}+P_{yw}+P_{wy}}=\dfrac23$이다.
      criteria: ['1-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 채점기준 미공개 — 단계별 추정
    criteria:
