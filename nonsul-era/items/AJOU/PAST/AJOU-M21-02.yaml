intent: |
  색 결정 규칙을 해석해 순서가 있는 비닐커버 배열을 경우로 나누어 확률·조건부확률을 구하고, '처음으로 초록이 되는 시점' 조건을 곱의 법칙으로 세어 로그 합과 이항정리로 정리하는 능력을 본다.
key_idea: |
  전구 색은 덮인 색의 집합으로만 정해진다(노·파가 모두 있으면 초록). 처음 초록이 되는 시점이 $k$번째이려면 앞 $k-1$장은 한 가지 유채색과 흰색만이고 그 유채색이 적어도 한 번 나오며, $k$번째는 다른 유채색이다. 합은 $\sum{}_n\mathrm{C}_k(2^k-2)3^{n-k}$를 이항정리로 묶는다.
stuck: |
  조건부확률에서 바깥쪽 커버를 벗기면 안쪽 커버의 색이 남는다는 것, 그리고 $F_k$에서 '노란색이 적어도 한 번'을 $2^{k-1}-1$로 세고 노→초록·파→초록 두 경우를 곱하는 것
