      mark_type: M
      points: 5
      evidence: |
        바깥쪽을 벗기면 안쪽 커버의 색이 남으므로 안쪽이 노란색인 경우($P_{yy}$, $P_{yw}$)를 골라냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1-1.M1], max_points: 5}
      steps: [1-2b-1]
    - id: 1-2.A1
      mark_type: A
      points: 4
      evidence: |
        조건부확률 $\dfrac23$을 구했다.
      depends_on: [1-2.M1]
      steps: [1-2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    (3) 두 개의 전구 A, B에 각각 임의로 고른 두 장의 비닐커버가 씌어져 있다. 전구 A의 색은 노란색이고 전구 B의 색은 파란색이다. 전구 A의 바깥쪽 비닐커버 한 장과 전구 B의 바깥쪽 비닐커버 한 장을 벗겨낸 다음, 벗겨낸 두 장의 비닐커버를 비닐커버가 한 장도 씌어져 있지 않던 전구 C에 겹쳐 씌운다. 이때 세 전구 A, B, C의 색이 모두 다를 확률을 구하여라.
  points: 9
  depends_on: ['1-1']
  answer: {kind: value, value: '2/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: A, B 각각 동등한 3경우 → 9칸 표; 같은 색이 생기는 경우 3개를 빼면 $1-\tfrac39$.
    steps:
    - {id: 1-3a, content: '$\dfrac69=\dfrac23$', criteria: ['1-3.M1', '1-3.M2', '1-3.A1']}
    hint_ladder:
    - A는 (노,노),(노,흰),(흰,노), B는 (파,파),(파,흰),(흰,파) 중 하나로 모두 같은 확률이다.
    - 벗긴 뒤 A, B에 남는 색과 C의 색을 표로 정리하자.
  - id: S1-3-B
    audience: B
    source_flow: 자료집 풀이 p.23
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        전구 A와 전구 B의 상태에 따라 전구 C의 색을 표로 나타내면 다음과 같다(행: 전구 B, 열: 전구 A; 전구 A·B는 바깥쪽 커버를 벗겼을 때의 색, 전구 C는 두 장의 커버를 씌웠을 때의 색).

        | B \ A | 노란색+노란색 (A: 노) | 노란색+흰색 (A: 노) | 흰색+노란색 (A: 흰) |
        |---|---|---|---|
        | 파란색+파란색 (B: 파) | C: 초록색 | C: 파란색 | C: 초록색 |
        | 파란색+흰색 (B: 파) | C: 노란색 | C: 흰색 | C: 노란색 |
        | 흰색+파란색 (B: 흰) | C: 초록색 | C: 파란색 | C: 초록색 |
      criteria: ['1-3.M1']
    - id: 1-3b-2
      content: |
        전구 C를 나타내는 모든 칸이 나타날 확률은 같으므로 각각 $\dfrac19$이다.
      criteria: ['1-3.M2']
    - id: 1-3b-3
      content: |
        이 중 전구 A, B, C의 색이 모두 다른 경우는 6가지이므로 전체 확률은 $\dfrac23$이다.
      criteria: ['1-3.A1']
  - id: S1-3-ALT
    audience: ALT
    source_flow: 자료집 풀이 p.24 별해
    method_no: 2
    key_idea: 원 해설 별해 — 9가지 경우 중 A, B, C 중 같은 색이 있는 경우의 수 3을 빼서 $1-\tfrac39$.
    steps:
    - id: 1-3c-1
      content: |
