stimuli:
- label: 제시문
  body: |
    $1$보다 큰 자연수 $n$개로 이루어진 수열 $a_1,a_2,\cdots,a_n$을 기본수열이라 하자. 주어진 기본수열에 대해, 다음과 같이 수열 $b_1,b_2,\cdots,b_n$을 귀납적으로 정의한다.

    > [수열 $b_1,b_2,\cdots,b_n$의 귀납적 정의]
    > (a) $b_1=a_1$
    > (b) $1<k\le n$인 자연수 $k$에 대해, $b_k=a_k-\dfrac{1}{b_{k-1}}$

    주어진 기본수열로부터 위와 같이 귀납적으로 정의된 수열 $b_1,b_2,\cdots,b_n$을 제1유도수열이라 하자. 제1유도수열의 각 항은 양의 유리수임을 알 수 있다. 제1유도수열의 각 항을 기약분수로 나타내고 그 분자를 순서대로 나열하면 자연수로 이루어진 새로운 수열 $c_1,c_2,\cdots,c_n$을 얻을 수 있고 이를 제2유도수열이라 하자.

    따라서 제1유도수열과 제2유도수열은 모두 $n$개의 항으로 이루어진 수열이고, 이때 제$n$항을 끝항이라 하자. 즉, 제1유도수열의 끝항은 $b_n$이고, 제2유도수열의 끝항은 $c_n$이다.

    예를 들어, 기본수열 $a_1=4$, $a_2=2$, $a_3=3$에 대해, 제1유도수열은
    $$b_1=4,\quad b_2=2-\frac14=\frac74,\quad b_3=3-\frac{1}{\frac74}=\frac{17}{7}$$
    이고, 끝항은 $b_3=\dfrac{17}{7}$이다. 이때 제2유도수열은
    $$c_1=4,\quad c_2=7,\quad c_3=17$$
    이고, 끝항은 $c_3=17$이다.

