subparts:
- id: '1'
  stem: |
    [문제 1-1] (10점) 기본수열 $a_1=3$, $a_2=2$, $a_3=2$, $\cdots$, $a_{n-1}=2$, $a_n=3$에 대해, 제2유도수열의 끝항은 짝수이고 끝항을 제외한 모든 항은 홀수임을 보여라. (단, $n\ge4$)
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$b_k=\tfrac{2k+1}{2k-1}$($k\le n-1$), $b_n=\tfrac{4n}{2n-1}$이고 모두 기약분수.'
    steps:
    - {id: 1a, content: '$c_k=2k+1$(홀수, $k\le n-1$), $c_n=4n$(짝수)', criteria: ['1.M1', '1.A1', '1.A2', '1.A3']}
    hint_ladder:
    - $b_1$, $b_2$, $b_3$을 직접 계산해 규칙을 찾아보자.
  - id: S1-B
    audience: B
    source_flow: 예시답안 [문제 1-1]
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        제1유도수열은 $b_1=3$, $b_2=\dfrac53$, $b_3=\dfrac75$, $\cdots$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $$b_{n-1}=\frac{2(n-1)+1}{2(n-1)-1}=\frac{2n-1}{2n-3}$$
        (보충: $b_{k}=2-\dfrac{2k-3}{2k-1}=\dfrac{2k+1}{2k-1}$이 $k=2,\dots,n-1$에서 차례로 성립)
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $$b_n=3-\frac{1}{\frac{2n-1}{2n-3}}=\frac{4n}{2n-1}$$
        이고 각 항이 기약분수이므로 (보충: 연속한 두 홀수 $2k+1$, $2k-1$은 서로소이고, $4n$과 홀수 $2n-1$도 $4n=2(2n-1)+2$에서 $\gcd(4n,2n-1)=\gcd(2,2n-1)=1$로 서로소)
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        제2유도수열은
        $$c_1=3,\ c_2=5,\ \cdots,\ c_{n-1}=2n-1,\ c_n=4n$$
        이다. 따라서 끝항 $c_n=4n$은 짝수이고 나머지 항 $2k+1$은 모두 홀수이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        제1유도수열의 처음 몇 항($3,\tfrac53,\tfrac75,\dots$)을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        제1유도수열의 제$(n-1)$항 $\dfrac{2n-1}{2n-3}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        끝항 $b_n=\dfrac{4n}{2n-1}$까지 제1유도수열을 모두 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        제2유도수열 $c_k=2k+1$($k\le n-1$), $c_n=4n$을 구했다.
      depends_on: [1.M1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 1-2] (15점) 기본수열 $a_1=2$, $a_2=2$, $\cdots$, $a_n=2$에 대해, 기약분수로 나타낸 제1유도수열의 제$k$항 $b_k$를 $k$에 대한 식으로 구하고, 이 식이 성립함을 수학적 귀납법으로 증명하라.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '(k+1)/k', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$b_k=\tfrac{k+1}{k}$이고 $2-\tfrac{k-1}{k}=\tfrac{k+1}{k}$.'
    steps:
    - {id: 2a, content: '$b_1=2$, $b_{k-1}=\tfrac{k}{k-1}\Rightarrow b_k=\tfrac{k+1}{k}$', criteria: ['2.B1', '2.B2', '2.R1']}
    hint_ladder:
    - $b_2$, $b_3$을 계산해 보자.
  - id: S2-B
    audience: B
    source_flow: 예시답안 [문제 1-2]
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        제1유도수열의 일반항은 $b_k=\dfrac{k+1}{k}$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        해당 식이 성립함을 수학적 귀납법으로 증명하자. 먼저, $k=1$이면, $b_1=2$이므로 해당 식이 성립한다.
      criteria: ['2.B2']
    - id: 2b-3
      content: |
        제1유도수열의 제$k-1$항이 $b_{k-1}=\dfrac{k}{k-1}$이라고 가정하자. 그러면, $b_k=2-\dfrac{1}{\frac{k}{k-1}}=\dfrac{k+1}{k}$이다. 따라서 수학적 귀납법에 의해 해당 식이 성립한다. (보충: $k+1$과 $k$는 서로소이므로 기약분수)
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 예시답안 머리글은 [문제 1-2] (10점)이나 문제지·채점기준 합(8+2+5)은 15점 — 문제지 배점을 따름
    criteria:
    - id: 2.B1
      mark_type: B
      points: 8
