        일반항 $b_k=\dfrac{k+1}{k}$을 명시했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 2
      evidence: |
        $k=1$인 경우($b_1=2$)를 확인했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: |
        $b_{k-1}=\dfrac{k}{k-1}$ 가정에서 $b_k=\dfrac{k+1}{k}$을 이끌어 귀납 논증을 완결했다.
      depends_on: []
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 1-3] (10점) 제1유도수열의 끝항이 $\dfrac{25}{4}$인 기본수열을 구하라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '(2, 2, 2, 7)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '끝항에서 거꾸로: $\tfrac{25}{4}=7-\tfrac{1}{4/3}$, $\tfrac43=2-\tfrac{1}{3/2}$, $\tfrac32=2-\tfrac12$.'
    steps:
    - {id: 3a, content: '$a_1=2,a_2=2,a_3=2,a_4=7$', criteria: ['3.B1', '3.B2', '3.B3', '3.B4']}
    hint_ladder:
    - 모든 $b_k$는 1보다 크므로 $\dfrac{1}{b_{k-1}}$은 0과 1 사이이다.
  - id: S3-B
    audience: B
    source_flow: 예시답안 [문제 1-3]
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\dfrac{25}{4}=7-\dfrac{1}{\frac43}$이고 $\dfrac43=2-\dfrac{1}{\frac32}$이며 $\dfrac32=2-\dfrac12$이다.
        따라서, $a_1=2$, $a_2=2$, $a_3=2$, $a_4=7$이다.
      criteria: ['3.B1', '3.B2', '3.B3', '3.B4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 예시답안 머리글은 [문제 1-3] (15점)이나 문제지·채점기준 합(5+2+1+2)은 10점 — 문제지 배점을 따름
    criteria:
    - id: 3.B1
      mark_type: B
      points: 5
      evidence: |
        $a_1=2$를 구했다.
      depends_on: []
