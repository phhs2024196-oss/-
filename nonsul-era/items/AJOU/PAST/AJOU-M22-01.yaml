- id: '4'
  stem: |
    [문제 1-4] (15점) $s$와 $t$가 서로 소인 두 자연수이고 $s>t$이다. 제1유도수열의 끝항이 $\dfrac{s}{t}$인 기본수열이 항상 존재한다는 것을 증명하라.
  points: 15
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: '$d_n$을 $\tfrac{s}{t}\le d_n<\tfrac{s}{t}+1$인 자연수로 두면 $b_{n-1}=\tfrac{t}{td_n-s}>1$이고 분자가 $s$보다 작아지므로 반복이 유한번에 끝난다.'
    steps:
    - {id: 4a, content: '$d_n$ 유일 존재 → $b_{n-1}=\tfrac{t}{td_n-s}$ → 분자 감소 → 정수가 되면 종료', criteria: ['4.M1', '4.M2', '4.R1', '4.R2']}
    hint_ladder:
    - $b_n=a_n-\dfrac{1}{b_{n-1}}$에서 $0<\dfrac{1}{b_{n-1}}<1$이면 $a_n$은 어떻게 정해지는가?
    - 거꾸로 구한 $b_{n-1}$의 분자는 $s$와 비교해 어떤가?
  - id: S4-B
    audience: B
    source_flow: 예시답안 [문제 1-4]
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        구하려는 기본수열의 제1유도수열의 끝항을 $b_n$이라 하면, $b_n=\dfrac{s}{t}>1$인 유리수이다. 이때, $1<b_n=\dfrac{s}{t}\le d_n<\dfrac{s}{t}+1$을 만족하는 1보다 큰 자연수 $d_n$이 유일하게 존재한다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        (1) 만약 $\dfrac{s}{t}$가 자연수라면, $n=1$이고 구하려는 기본수열은 $a_1=b_1$이다.
        (2) 만약 $\dfrac{s}{t}$가 자연수가 아닌 유리수라면,
        $$b_{n-1}=\frac{t}{td_n-s}$$
        라고 두었을 때,
        $$b_n=d_n-\frac{1}{b_{n-1}}$$
        이고 $b_{n-1}$은 1보다 큰 유리수이므로 기약분수 $b_{n-1}=\dfrac{s'}{t'}$로 나타낼 수 있고 $s'\le t<s$이다. (보충: $\tfrac{s}{t}<d_n<\tfrac{s}{t}+1$에서 $0<td_n-s<t$)
      criteria: ['4.M2', '4.R1']
    - id: 4b-3
      content: |
