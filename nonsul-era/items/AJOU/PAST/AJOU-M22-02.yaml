stimuli:
- label: 도입
  body: |
    자연수 $n$에 대하여, 모든 계수가 실수인 $n$차 다항식 $f(x)$를 생각하자. $f(\alpha)=0$을 만족하는 실수 $\alpha$를 $f(x)$의 실근이라 한다. $\alpha$가 $f(x)$의 실근이면, $h(\alpha)\ne0$인 다항식 $h(x)$와 자연수 $m$이 존재하여 $f(x)=(x-\alpha)^mh(x)$로 표현할 수 있다. 이때, 실근 $\alpha$를 $m$중근이라 하고, 특히 $m=1$인 실근 $\alpha$를 단근이라고 하자. $n$차 다항식 $f(x)$의 실근의 개수는 $n$ 이하라는 사실이 알려져 있다. 단, $f(x)$가 $m$중근을 갖는 경우 동일한 근을 $m$개 갖는 것으로 본다. 예를 들면, $f(x)=(x-1)^2(x+3)$의 실근 $1$은 $2$중근이고 $-3$은 단근으로 $f(x)$의 실근의 개수는 $3$이다.

    이제 다항식과 그 도함수의 실근들 사이의 관계를 살펴보자. $n$차 다항식 $f(x)$의 도함수 $f'(x)$는 $(n-1)$차 다항식이므로 $f'(x)$는 $(n-1)$개 이하의 실근을 가짐을 알 수 있다. 다항식 $f(x)$가 $\alpha$를 $m$중근으로 가지면, 도함수 $f'(x)$는
    $$f'(x)=(x-\alpha)^{m-1}\left\{mh(x)+(x-\alpha)h'(x)\right\}$$
    이므로 다음의 명제가 성립함을 알 수 있다.
- label: 가
  body: |
    실수 $\alpha$가 다항식 $f(x)$의 $m$중근이면 $\alpha$는 $f'(x)$의 $(m-1)$중근이다. (단, $m>1$)

    다음 사실은 롤의 정리의 특수한 경우이다.
- label: 나
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능할 때, $f(a)=f(b)=0$이면 $f'(\gamma)=0$인 $\gamma$가 $a$와 $b$ 사이에 적어도 하나 존재한다.

    위의 두 개의 사실 (가), (나)를 이용하면 우리는 다음의 명제가 사실임을 증명할 수 있다.
- label: 다
  body: |
    $n$차 다항식 $f(x)$가 $n$개의 실근을 가지면 도함수 $f'(x)$는 $(n-1)$개의 실근을 갖는다.

    예를 들면, 세 실수 $\alpha$, $\beta$, $\gamma$가 $\alpha<\beta<\gamma$를 만족하고 $4$차 다항식 $f(x)$가 $2$중근 $\alpha$, 단근 $\beta$, 단근 $\gamma$를 가질 때, $f'(x)$는 단근 $\alpha$, $\alpha$와 $\beta$ 사이에 하나의 단근, $\beta$와 $\gamma$ 사이에 또 하나의 단근을 갖게 되어 $f'(x)$의 실근의 개수는 3이다.

    비슷한 방법으로 (가), (나)를 이용하면 아래에 서술한 명제 (라)가 사실임을 보일 수 있다.
- label: 라
  body: |
    $0$이 아닌 고정된 실수 $a$와 $n$차 다항식 $f(x)$에 대하여 $g(x)=f'(x)-af(x)$라 하자. 이때, $f(x)$가 $n$개의 실근을 가지면 $g(x)$도 $n$개의 실근을 갖는다.

    아래의 [문제 2-1]에서는 특별히 $a=1$일 때, $f(x)$와 $g(x)$의 실근들의 관계를 다룬다.

stem: |
  [문항 2] (50점) 다음 제시문을 읽고 논제에 답하라.
  (제시문은 한 상자 안에 도입부와 명제 (가)~(라)로 이어져 있음 — 여기서는 도입·가·나·다·라로 나누어 옮김)

subparts:
- id: '1-1'
  stem: |
    [문제 2-1] (30점) $n$개의 실근을 갖는 $n$차 다항식 $f(x)$에 대하여 새로운 $n$차 다항식
    $$g(x)=f'(x)-f(x)$$
    을 생각하자. 다항식 $f(x)$의 서로 다른 두 실근 사이에 또 다른 실근이 더 이상 없는 경우, 두 실근이 이웃하고 있다고 한다. 다항식 $f(x)$의 이웃한 두 실근 $\alpha$, $\beta$에 대하여 다음을 증명하라. (단, $\alpha<\beta$) 아래에서 자연수 $m$은 항상 $1$보다 크다고 가정한다.
    (1) $\alpha$가 $f(x)$의 $m$중근이면, $\alpha$는 $g(x)$의 $(m-1)$중근이다.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: '$g=(x-\alpha)^{m-1}k(x)$, $k(\alpha)=mh(\alpha)\ne0$.'
    steps:
    - {id: 1-1a, content: '$k(x)=mh(x)+(x-\alpha)(h''(x)-h(x))$', criteria: ['1-1.M1', '1-1.M2', '1-1.R1']}
    hint_ladder:
    - $f'(x)$와 $f(x)$에서 공통으로 묶을 수 있는 인수는?
  - id: S1-1-B
    audience: B
    source_flow: 예시답안 [문제 2-1](1)
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        제시문에서 설명된 것처럼 $h(\alpha)\ne0$인 다항식 $h(x)$와 자연수 $m$이 존재하여 $f(x)=(x-\alpha)^mh(x)$로 표현되고
        $$f'(x)=(x-\alpha)^{m-1}(mh(x)+(x-\alpha)h'(x))$$
      criteria: ['1-1.M1']
    - id: 1-1b-2
      content: |
        이므로
        $$g(x)=f'(x)-f(x)=(x-\alpha)^{m-1}\left\{mh(x)+(x-\alpha)(h'(x)-h(x))\right\}$$
        을 얻는다.
      criteria: ['1-1.M2']
    - id: 1-1b-3
      content: |
        이제 $k(x)=mh(x)+(x-\alpha)(h'(x)-h(x))$라 하면 $g(x)=(x-\alpha)^{m-1}k(x)$이고 $k(\alpha)=mh(\alpha)\ne0$이므로 $g(x)$는 $\alpha$를 $(m-1)$중근으로 가진다.
      criteria: ['1-1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        $f'(x)=(x-\alpha)^{m-1}(mh(x)+(x-\alpha)h'(x))$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.M2
      mark_type: M
      points: 3
      evidence: |
        $g(x)=(x-\alpha)^{m-1}\{mh(x)+(x-\alpha)(h'(x)-h(x))\}$를 얻었다.
      depends_on: [1-1.M1]
      steps: [1-1b-2]
    - id: 1-1.R1
      mark_type: R
      points: 5
      evidence: |
        $k(\alpha)=mh(\alpha)\ne0$을 보이고 $\alpha$가 $g$의 $(m-1)$중근이라고 결론지었다.
      depends_on: [1-1.M2]
      steps: [1-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) $\alpha$, $\beta$가 모두 $f(x)$의 단근이면, $g(x)$의 실근이 $\alpha$와 $\beta$ 사이에 적어도 한 개 존재한다.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: '$(\alpha,\beta)$에서 $f$의 부호가 일정하므로 $g(\alpha)=f''(\alpha)$와 $g(\beta)=f''(\beta)$의 부호가 반대.'
    steps:
    - {id: 1-2a, content: '$f>0$이면 $g(\alpha)>0>g(\beta)$ → 사잇값 정리', criteria: ['1-2.R1', '1-2.R2', '1-2.R3', '1-2.R4']}
    hint_ladder:
    - 이웃한 두 근 사이에서 $f$의 부호는 어떤가?
  - id: S1-2-B
    audience: B
    source_flow: 예시답안 [문제 2-1](2)
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        $\alpha$와 $\beta$는 $f(x)$의 이웃한 두 실근이므로 구간 $(\alpha,\beta)$에 속하는 모든 $x$에 대하여 $f(x)>0$이거나 $f(x)<0$를 만족한다.
      criteria: ['1-2.R1']
    - id: 1-2b-2
      content: |
        모든 $x$에 대하여 $f(x)>0$이면, $f(x)$는 $x=\alpha$에서 증가하고 $x=\beta$에서 감소해야 한다.
      criteria: ['1-2.R2']
    - id: 1-2b-3
      content: |
        $\alpha$와 $\beta$는 모두 단근이므로 $g(\alpha)=f'(\alpha)>0$, $g(\beta)=f'(\beta)<0$이 되고 사잇값의 정리에 의해 $\alpha$와 $\beta$ 사이에 $g(x)$의 실근이 존재한다.
      criteria: ['1-2.R3']
    - id: 1-2b-4
      content: |
        모든 $x$에 대하여 $f(x)<0$이면, $g(\alpha)<0$, $g(\beta)>0$이 되어 이 경우 또한 $\alpha$와 $\beta$ 사이에 $g(x)$의 실근이 존재한다.
      criteria: ['1-2.R4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.R1
      mark_type: R
      points: 3
      evidence: |
        구간 $(\alpha,\beta)$에서 $f(x)>0$이든지 $f(x)<0$이 성립함을 언급했다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-1]
    - id: 1-2.R2
      mark_type: R
      points: 3
      evidence: |
        $f(x)$는 $x=\alpha$에서 증가, $x=\beta$에서 감소함을 언급했다.
      depends_on: []
      steps: [1-2b-2]
    - id: 1-2.R3
      mark_type: R
      points: 3
      evidence: |
        $g(\alpha)=f'(\alpha)$, $g(\beta)=f'(\beta)$의 부호가 반대임과 사잇값의 정리로 $g(x)$의 실근이 있음을 보였다.
      depends_on: []
      steps: [1-2b-3]
    - id: 1-2.R4
      mark_type: R
      points: 1
      evidence: |
        $(\alpha,\beta)$에서 $f(x)>0$인 경우와 $f(x)<0$인 경우를 구분하여 다루었다.
      depends_on: []
      steps: [1-2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    (3) $\alpha$가 $f(x)$의 단근이고 $\beta$는 $f(x)$의 $m$중근이면, $g(x)$의 실근이 $\alpha$와 $\beta$ 사이에 적어도 한 개 존재한다.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: '롤의 정리로 $f''(\gamma)=0$인 $\gamma\in(\alpha,\beta)$를 잡으면 $g(\gamma)=-f(\gamma)$와 $g(\alpha)=f''(\alpha)$의 부호가 반대.'
    steps:
    - {id: 1-3a, content: '$f>0$: $g(\alpha)>0$, $g(\gamma)=-f(\gamma)<0$ → $(\alpha,\gamma)$에 근', criteria: ['1-3.M1', '1-3.R1', '1-3.R2']}
    hint_ladder:
    - $\beta$가 중근이면 $g(\beta)$는 얼마인가? 끝점 대신 쓸 점이 필요하다.
    - $f(\alpha)=f(\beta)=0$에 롤의 정리를 적용해 보자.
  - id: S1-3-B
    audience: B
    source_flow: 예시답안 [문제 2-1](3)
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        $\alpha$와 $\beta$는 $f(x)$의 이웃한 두 실근이므로 구간 $(\alpha,\beta)$에 속하는 모든 $x$에 대하여 $f(x)>0$이거나 $f(x)<0$를 만족한다. [판독확인: HWP 변환본에서 이 문장의 문자들이 뒤섞여 있어(「$\beta$와 $\alpha$는 …구간 $f(x)$에 속하는 모든 $(\alpha,\beta)$…」) (2)의 같은 문장으로 복원]
        모든 $x$에 대하여 $f(x)>0$이면, $\alpha$는 단근이고 $f(x)$는 $x=\alpha$에서 증가하므로 $g(\alpha)=f'(\alpha)>0$이다. 한편 $f(\alpha)=f(\beta)=0$이므로 제시문의 사실 (나)(또는 롤의 정리)에 의하여 $f'(\gamma)=0$인 실수 $\gamma$가 $\alpha$와 $\beta$ 사이에 적어도 하나 존재한다.
      criteria: ['1-3.M1']
    - id: 1-3b-2
      content: |
        이 경우, $f(\gamma)$는 양수이어야 하므로 $g(\gamma)=-f(\gamma)<0$이고 사잇값의 정리에 의해 $\alpha$와 $\gamma$ 사이에 $g(x)$의 실근이 존재한다.
      criteria: ['1-3.R1']
    - id: 1-3b-3
      content: |
        모든 $x$에 대하여 $f(x)<0$이면, $\alpha$는 단근이고 $f(x)$는 $x=\alpha$에서 감소하므로 $g(\alpha)=f'(\alpha)<0$이다. 한편 $f(\alpha)=f(\beta)=0$와 제시문의 사실 (나)(또는 롤의 정리)에 의하여 $f'(\gamma)=0$인 실수 $\gamma$가 $\alpha$와 $\beta$ 사이에 적어도 하나 존재하고 $f(\gamma)$는 음수, $g(\gamma)=-f(\gamma)>0$이므로 다시 한번 사잇값의 정리에 의하여 $\alpha$와 $\gamma$ 사이에 $g(x)$의 실근이 존재한다.
      criteria: ['1-3.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 5
      evidence: |
