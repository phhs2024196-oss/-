    $$h(x)=f''(x)-(a+b)f'(x)+abf(x)$$
    도 $n$개의 실근을 가짐을 제시문의 사실 (라)를 이용하여 보여라.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
