    audience: A
    method_no: 1
    key_idea: '$f=x^2+1$, $c=d=1$이면 $h=x^2-4x+3=(x-1)(x-3)$.'
    steps:
    - {id: 3a, content: '$h(x)=2-4x+x^2+1=(x-1)(x-3)$', criteria: ['3.B1', '3.B2', '3.B3']}
