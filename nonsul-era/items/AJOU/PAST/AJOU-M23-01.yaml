- id: '2-2'
  stem: |
    [문제 1-2] (2) 삼차함수 $f(x)=ax^3+bx^2+cx+d$ $(a\ne0)$라 할 때, 곡선 $y=f(x)$ 위의 서로 다른 두 점에서의 접선은 일치할 수 없음을 보여라.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: 귀류법 — 두 접선이 일치하면 (다)와 평균값 정리로 $f'(p)=f'(c)=f'(q)$ ($p<c<q$)인데 이차함수 $f'$은 같은 값을 세 번 가질 수 없다.
    steps:
    - {id: 22a, content: '$f''(p)=f''(c)=f''(q)$, $p<c<q$ → 이차함수 모순', criteria: ['2-2.M1', '2-2.R1', '2-2.R2']}
    hint_ladder:
    - 두 접선이 일치한다고 가정하자. 제시문 (다)의 식에서 평균값 정리를 떠올려 보자.
  - id: S22-B
    audience: B
    source_flow: 예시답안 p.3–4
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        주어진 삼차함수 $f(x)$에 대하여, 제시문 (다)에서와 같이 곡선 $y=f(x)$ 위의 서로 다른 두 점 $(p,f(p))$와 $(q,f(q))$에서의 두 접선이 일치한다고 가정하자. 따라서 $f'(p)=f'(q)=\dfrac{f(q)-f(p)}{q-p}$를 만족한다. 이때, $p$와 $q$는 서로 다르므로 $p<q$라 하자.
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        삼차함수 $f(x)$는 닫힌구간 $[p,q]$에서 연속이고 열린구간 $(p,q)$에서 미분가능하므로, 평균값 정리에 의해 $\dfrac{f(q)-f(p)}{q-p}=f'(c)$이고 $p<c<q$인 $c$가 적어도 하나 존재한다. 따라서, 제시문 (다)와 평균값 정리에 의해 $p<c<q$인 어떤 $c$에 대하여 $f'(p)=f'(c)=f'(q)$가 성립한다.
      criteria: ['2-2.R1']
    - id: 22b-3
      content: |
        한편, $f'(x)$는 이차함수이고 $f'(p)=f'(c)=f'(q)$을 만족하는 서로 다른 세 실수 $p$, $c$, $q$가 존재할 수 없으므로, 삼차함수 $f(x)$에 대하여 곡선 $y=f(x)$위의 서로 다른 두 점에서의 접선이 일치한다는 가정에 모순이다. ■
      criteria: ['2-2.R2']
