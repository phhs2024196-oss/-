intent: |
  닫힌구간에서 최댓값·최솟값을 극값과 끝값 비교로 구하고, 접선의 방정식이 주어진 점을 지날 조건을 접점에 대한 방정식으로 바꾸어 접선의 개수·넓이를 다루며, 평균값 정리로 삼차함수의 접선 성질을 증명하는 능력을 본다.
key_idea: |
  외부 점을 지나는 접선의 개수는 접점 $t$에 대한 방정식 $y_0-f(t)=f'(t)(x_0-t)$의 실근의 개수와 같고, 삼차함수에서는 접선 하나가 접점 하나에만 대응한다(평균값 정리 + 이차함수 $f'$).
stuck: |
  (1-1)에서 꼭짓점이 구간 안·왼쪽·오른쪽인 세 경우 분류, (2-2)에서 $f'(p)=f'(c)=f'(q)$로 이차함수가 세 점에서 같은 값을 가질 수 없음을 끌어내는 것, (2-3)에서 $g(t)$가 서로 다른 부호의 극값을 가질 조건
