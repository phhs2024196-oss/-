- id: '2-3'
  stem: |
    [문제 1-2] (3) 곡선 $y=x^3-3x^2-2$에 대한 서로 다른 세 접선이 모두 점 $(x_0,y_0)$를 지난다. 자연수 $x_0$, $y_0$에 대하여, $x_0+y_0$의 최솟값을 구하여라.
  points: 10
  depends_on: ['2-2']
  answer: {kind: value, value: '5', equivalents: [], tolerance: null}
  solutions:
  - id: S23-A
    audience: A
    method_no: 1
    key_idea: (2)에 의해 접선 3개 ⇔ $g(t)=2t^3-(3+3x_0)t^2+6x_0t+(y_0+2)=0$의 서로 다른 세 실근 ⇔ $g(1)>0>g(x_0)$.
    steps:
    - {id: 23a, content: '$g(1)=3x_0+y_0+1>0$, $g(x_0)=-x_0^3+3x_0^2+2+y_0<0$ → $x_0\ge4$ → 최솟값 5', criteria: ['2-3.M1', '2-3.M2', '2-3.A1', '2-3.A2']}
    hint_ladder:
    - 앞 문항 (2)에 의해 접선의 개수는 접점의 개수와 같다.
    - $g'(t)=(6t-6)(t-x_0)$이다. 극값의 부호를 보자.
  - id: S23-B
    audience: B
    source_flow: 예시답안 p.4
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        곡선 $y=x^3-3x^2-2$에 대한 접선이 점 $(t,t^3-3t^2-2)$에서 접하며 점 $(x_0,y_0)$를 지난다고 하자. 제시문 (나)에 의해, $y_0-t^3+3t^2+2=(3t^2-6t)(x_0-t)$이므로 이를 $t$에 대해 정리하면 $2t^3-(3+3x_0)t^2+6x_0t+(y_0+2)=0$이다. $g(t)=2t^3-(3+3x_0)t^2+6x_0t+(y_0+2)$라 두자.
      criteria: ['2-3.M1']
    - id: 23b-2
      content: |
        앞의 문항 (2)의 결과로부터 삼차함수의 그래프에 대한 각 접선은 정확히 하나의 접점만을 가져야 하므로, $t$에 대한 방정식 $g(t)=0$이 서로 다른 세 실근을 갖도록 하는 자연수 $x_0$, $y_0$를 구하면 된다.
      criteria: ['2-3.M2']
    - id: 23b-3
      content: |
        $g'(t)=6t^2-(6+6x_0)t+6x_0=(6t-6)(t-x_0)$이므로 함수 $g(t)$는 $t=1,x_0$일 때 극값을 갖는다. 또한 $x_0$, $y_0$는 자연수이므로, $g(1)=3x_0+y_0+1>0$이다. 함수 $g(t)$는 서로 다른 부호의 극값을 가져야 하므로, $g(x_0)=2x_0^3-(3+3x_0)x_0^2+6x_0^2+(y_0+2)=-x_0^3+3x_0^2+2+y_0<0$이다.
      criteria: ['2-3.A1']
    - id: 23b-4
      content: |
        이때, $x_0=3$이면 $g(x_0)=-x_0^3+3x_0^2+2+y_0=2+y_0>0$이므로, $x_0\ge4$이다. 따라서, $x_0+y_0\ge5$이므로 구하고자 하는 답은 5이다.
        [보충(원 해설 생략분): $x_0=1$이면 $g'(t)=6(t-1)^2\ge0$이라 극값이 없고, $x_0=2$이면 $g(2)=6+y_0>0$이다. $x_0=4$, $y_0=1$이면 $g(4)=-13<0$이므로 등호가 성립한다.]
        [그림: $y=x^3-3x^2-2$의 그래프 — $x=0$에서 극댓값 $-2$, $x=2$에서 극솟값 $-6$, $x\approx3.2$에서 $x$축과 만남]
      criteria: ['2-3.A2']
