intent: |
  조건을 만족하는 함수의 개수 $g(n)$을 곱의 법칙과 인수정리로 다항식으로 나타내고, 합성함수의 경우의 수를 집합의 크기로 분류하며, 계수 수열의 부등식(로그 오목성)을 등차수열과 반례 판정에 쓰는 능력을 본다.
key_idea: |
  $g(n)$은 최고차항 계수 1인 $k$차 다항식이므로 몇 개의 함숫값($g(0)$, $g(1)$, …)으로 결정되고, 그 계수 절댓값 수열이 (*)를 만족하지 않으면 그런 $S$는 있을 수 없다.
stuck: |
  (1-2)에서 $n-2$가 두 번 인수로 나오려면 4가 두 원소와 짝지어져야 함을 보고 $S$를 구성하는 것, (1-3)에서 $A=\{x\mid f_1(x)=1\}$의 크기가 정확히 2임을 두 조건에서 끌어내는 것
