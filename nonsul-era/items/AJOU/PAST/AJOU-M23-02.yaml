    steps:
    - {id: 11a, content: '$300^2=90000$', criteria: ['1-1.M1', '1-1.A1']}
    hint_ladder:
    - $S$가 공집합이면 함수에 어떤 제한이 있는가?
  - id: S11-B
    audience: B
    source_flow: 예시답안 p.5
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $S$가 공집합이므로 $f(1)$, $f(2)$, $f(3)$은 각각 $n$가지씩 가능하여 $g(n)=n^3$이다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        $g(n)=n^3$이므로 $g(1)+\cdots+g(24)=\left(\dfrac{24\cdot25}{2}\right)^2=300^2=90000$
      criteria: ['1-1.A1']
  rubric:
