- id: '1-2'
  stem: |
    [문제 2-1] (2) $k=4$이고 $g(n)=n(n-1)(n-2)^2$이 되도록 하는 $S$를 하나 제시하고 그 이유를 설명하여라.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'S = {(1,2),(2,3),(1,3),(1,4),(2,4)}', equivalents: ['원소가 5개인 임의의 S'], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 인수 $n$, $n-1$, $n-2$ → 1, 2, 3이 서로 달라야 하고, $f(4)$의 선택지가 $n-2$개 → 4는 서로 다른 값을 갖는 두 원소와 짝지어진다.
    steps:
    - {id: 12a, content: '$S=\{(1,2),(2,3),(1,3),(1,4),(2,4)\}$', criteria: ['1-2.M1', '1-2.A1']}
    hint_ladder:
    - $f(1),f(2),f(3)$이 모두 달라야 $n(n-1)(n-2)$가 나온다.
    - $f(4)$가 될 수 있는 값이 $n-2$개이려면?
  - id: S12-B
    audience: B
    source_flow: 예시답안 p.5
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $g(n)$이 $n$, $n-1$, $n-2$를 인수로 가지므로 집합 $S$가 $(1,2)$, $(2,3)$, $(1,3)$을 원소로 갖고 있는 경우를 생각할 수 있다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        $f(4)$가 될 수 있는 값이 $n-2$개가 되어야 하므로 4를 포함하는 $S$의 순서쌍이 두 개 있어야 한다. 따라서 $S=\{(1,2),(2,3),(1,3),(1,4),(2,4)\}$가 하나의 예가 된다.
        *참고. $S$의 원소의 개수가 다섯 개면 정답.
      criteria: ['1-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
