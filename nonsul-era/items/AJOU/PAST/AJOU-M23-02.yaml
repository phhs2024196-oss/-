- id: '1-3'
  stem: |
    [문제 2-1] (3) 집합 $S$가 $\{(1,2),(2,3),(3,4)\}$일 때 <조건>을 만족하는 함수 $f_1:P_4\to P_4$와 집합 $S$가 $\{(1,2),(2,3),(3,4),(1,4)\}$일 때 <조건>을 만족하는 함수 $f_2:P_4\to P_4$가 있다. 합성함수 $F=f_1\circ f_2:P_4\to P_4$가 $F(1)=F(2)=F(3)=F(4)=1$을 만족하는 순서쌍 $(f_1,f_2)$의 개수를 구하여라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '48', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: $A=\{x\mid f_1(x)=1\}$이면 $f_2$의 치역 $\subset A$; $S_1$에서 $n(A)\le2$(이웃 불가), $S_2$에서 $n(A)>1$이므로 $n(A)=2$, $A\in\{\{1,3\},\{1,4\},\{2,4\}\}$.
    steps:
    - {id: 13a, content: '$18+12+18=48$', criteria: ['1-3.M1', '1-3.R1', '1-3.A1', '1-3.A2']}
    hint_ladder:
    - $F$의 값이 모두 1이면 $f_2$의 값은 어떤 집합 안에 있어야 하는가?
  - id: S13-B
    audience: B
    source_flow: 예시답안 p.5
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        합성함수 $F=f_1\circ f_2$의 모든 값이 1이 되어야 하므로, 집합 $A=\{x\mid f_1(x)=1\}$을 생각한다. $S_1=\{(1,2),(2,3),(3,4)\}$라 두고 $S_2=\{(1,2),(2,3),(3,4),(1,4)\}$라 두자.
      criteria: ['1-3.M1']
    - id: 13b-2
      content: |
        집합 $S_1$의 조건으로부터 이웃한 두 자연수의 $f_1$값이 동시에 1일 수 없으므로 $n(A)\le2$임을 알 수 있다. 한편, 함수 $f_2$의 값은 항상 $A$에 포함되어야 하므로 집합 $S_2$의 조건을 사용하면 $n(A)>1$을 얻는다. 따라서 $n(A)=2$이며 가능한 경우는 $A=\{1,3\},\{1,4\},\{2,4\}$의 세 경우뿐이다. 또한 집합 $S_2$의 조건을 사용하면 함수 $f_2$는 1에서의 값으로 완전히 결정됨을 알 수 있어, 가능한 $f_2$의 개수는 집합 $A$와는 관계없이 항상 2개가 된다.
      criteria: ['1-3.R1']
    - id: 13b-3
      content: |
        ① $A=\{1,3\}$인 경우, $f_1(2)$와 $f_1(4)$의 값이 $2,3,4$ 중 하나이므로 총 $3^2\cdot2=18$개의 순서쌍 $(f_1,f_2)$를 얻는다.
        ② $A=\{1,4\}$인 경우, $f_1(2)$와 $f_1(3)$의 값이 $2,3,4$ 중 하나이면서 서로 같지 않아야 하므로 총 $3\cdot2\cdot2=12$개의 순서쌍을 얻는다.
        ③ $A=\{2,4\}$인 경우, ①번 경우와 같은 이유로 18개의 순서쌍을 얻는다.
      criteria: ['1-3.A1']
    - id: 13b-4
      content: |
        모든 경우의 수를 더하면 $18+12+18=48$이다.
      criteria: ['1-3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
