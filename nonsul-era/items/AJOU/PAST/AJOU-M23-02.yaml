- id: '2-2'
  stem: |
    [문제 2-2] (2) 한 고등학생이 주어진 $S$와 $k=4$에 대하여 함수 $g(n)$을 구한 다음 $g(0)=g(1)=0$, $g(2)=24$, $g(3)=120$이라고 주장하였다. 이 이야기를 들은 고등학생 아주는 이 학생의 계산이 잘못되었다고 예상하였다. 아주는 어떻게 이런 결론을 내릴 수 있었을까?
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'g(n) = n**4 + 2*n**3 - n**2 - 2*n; c2**2 = 1 < c1*c3 = 4', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: 주장대로라면 $g(n)=n^4+2n^3-n^2-2n$이고 $c_2^2=1<c_1c_3=4$로 (*)에 어긋난다.
    steps:
    - {id: 22a, content: '$g(n)=n(n-1)(n^2+3n+2)$, $c_2^2<c_1c_3$', criteria: ['2-2.M1', '2-2.A1', '2-2.R1']}
    hint_ladder:
    - $g(0)=g(1)=0$과 최고차항 계수 1을 이용해 $g(n)$의 꼴을 정해 보자.
  - id: S22-B
    audience: B
    source_flow: 예시답안 p.5
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        제시문 (나)에 의하여 $g(n)$은 4차 함수이며, 제시된 조건 $g(0)=g(1)=0$으로부터 $g(n)=n(n-1)(n^2+an+b)$라 둘 수 있다.
        [판독확인: 원 예시답안은 「제시문 (나)에 의하여」라고 적었으나, $g(n)$이 최고차항 계수 1인 $k$차 다항식이라는 사실은 제시문 (가)에 있음 — 원문 유지]
      criteria: ['2-2.M1']
    - id: 22b-2
      content: |
        $g(2)=24$, $g(3)=120$이므로 이를 풀어보면 $a=3$, $b=2$를 얻는다. 따라서 $g(n)=n^4+2n^3-n^2-2n$이 된다.
      criteria: ['2-2.A1']
