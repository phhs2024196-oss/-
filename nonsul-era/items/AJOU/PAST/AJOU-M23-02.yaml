stimuli:
- label: 가
  body: |
    음이 아닌 정수 $n$에 대하여 $n$이하의 양의 정수의 집합을 $P_n$이라 하자. 어떤 양의 정수 $k$에 대하여 $P_k$의 원소로 이루어진 순서쌍 $(a,b)$ (단, $1\le a<b\le k$) 중 일부를 원소로 갖는 집합을 $S$라 할 때, 다음 <조건>을 만족하는 함수 $f:P_k\to P_n$의 개수를 $g(n)$이라 하자.

    < 조 건 >
    $(a,b)\in S$이면 $f(a)\ne f(b)$이다.

    예를 들어 $k=3$이고 $S=\{(1,2),(2,3)\}$이라면 $f(1)$이 될 수 있는 값은 $n$개, $f(2)$가 될 수 있는 값은 $f(1)\ne f(2)$이므로 $n-1$개, $f(3)$이 될 수 있는 값은 $f(2)\ne f(3)$이므로 $n-1$개이고, 따라서 $g(n)=n(n-1)^2$이다.
    일반적으로 $g(n)$은 $S$와 상관없이 $n$에 대한 $k$차 다항식이 되고 최고차항의 계수가 1이라는 사실이 알려져 있다. 이 정보는 $g(n)$을 구할 때 유용하게 쓸 수 있는데, 위의 예에서 $g(0)=g(1)=0$이고, $g(2)=2$이므로 이를 이용하여 $g(n)$을 구할 수 있다.
- label: 나
  body: |
    필즈메달은 국제수학연맹이 4년마다 개최하는 세계 수학자 대회에서 수여하는 상으로 수학계의 가장 권위 있는 상으로 여겨진다. 2022년 열린 세계 수학자 대회에서는 허준이 교수가 한국계 최초로 이 상을 수상하였다. 허 교수는 여러 분야를 아우르는 이론을 제시하였고, 특히 이산수학의 여러 미해결 난제를 해결하였다.
    허 교수의 주요 업적 중 하나는 위 제시문 (가)에서 얻어지는 $k$차 다항식 $g(n)$의 $m$차 항의 계수의 절댓값을 $c_m$ (단, $m\le k$)라고 할 때, 다음 부등식이 항상 성립하는 것을 증명한 것이다.
    $$\text{모든 }0<m<k\text{에 대하여 }c_{m-1}c_{m+1}\le c_m^2\qquad\cdots\ (*)$$

