  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $c_m^2-c_{m-1}c_{m+1}=d^2\ge0$.
    steps:
    - {id: 21a, content: '$c_m=a+(m-1)d$ 대입 → 차 $=d^2$', criteria: ['2-1.M1', '2-1.R1']}
    hint_ladder:
    - $c_{m-1}=c_m-d$, $c_{m+1}=c_m+d$로 써 보자.
  - id: S21-B
    audience: B
    source_flow: 예시답안 p.5
    method_no: 1
