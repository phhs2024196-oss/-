- id: '2-1'
  stem: |
    [문제 2-2] (20점) 제시문 (가)와 (나)를 읽고 물음에 답하여라.
    (1) 초항이 $a$이고 공차가 $d$인 등차수열 $\{c_n\}$은 부등식 (*)를 만족함을 증명하여라.
  points: 10
