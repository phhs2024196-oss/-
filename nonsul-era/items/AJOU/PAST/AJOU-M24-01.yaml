stimuli:
- label: 가
  body: |
    음이 아닌 정수의 집합을 $U$라고 할 때, $1$보다 큰 두 자연수 $a,b$에 대하여 $U$의 부분집합 $S(a,b)$를 다음과 같이 정의하자.
    $$S(a,b)=\{am+bn\mid m,n\text{은 }U\text{의 원소}\}$$
    두 자연수 $a,b$가 모두 $1$보다 크므로 $1$은 $S(a,b)$의 원소가 아니며 $ab$는 $S(a,b)$의 원소임을 알 수 있다. 예를 들어 $a=2$, $b=3$이라면 $S(2,3)$에는 모든 양의 $2$의 배수와 양의 $3$의 배수가 포함된다. 또, $1$보다 큰 모든 홀수 $c$에 대하여 $c=2k+1$($k$는 자연수)로 나타낼 수 있으므로 $c-3=2k-2=2(k-1)$이고 $c=2(k-1)+3$은 $S(2,3)$의 원소이다. 따라서
    $$S(2,3)=\{0,2,3,4,5,6,7,8,9,10,\cdots\}=U-\{1\}$$
    이다.
- label: 나
  body: |
    자연수 $n$에 대하여 $X_n$은 $n$이하의 자연수의 집합이다. 정의역과 공역이 모두 $X_n$인 함수 $f$에 대해 다음과 같은 <조건>을 생각하자.
    <조건>
    정의역의 모든 원소 $x$에 대하여 $(f\circ f)(x)=f(x)$이다.
    예를 들어 집합 $X_2=\{1,2\}$일 때, $f:X_2\to X_2$가 상수함수 또는 항등함수라면 <조건>을 만족하지만, 그렇지 않으면 <조건>을 만족하지 않는다.

stem: |
  다음 제시문을 읽고 주어진 질문에 답하시오.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] 제시문 (가)를 읽고 물음에 답하시오.
    (1) 집합 $A=\{x\mid x\in U\text{ 그리고 }x\le2024\}$일 때, $S(2,3)$에 대한 결과를 이용하여 $n(A\cap S(10,15))$를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '404', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $S(10,15)=5S(2,3)$이므로 $5$의 배수 중 $5$만 빠진다.
    steps:
    - {id: 11a, content: '$\{5k\mid k=0,\dots,404\}-\{5\}$, 개수 $404$', criteria: ['1-1.M1', '1-1.M2', '1-1.A1']}
    hint_ladder:
    - $10m+15n$을 $5$로 묶어 보자.
  - id: S11-B
    audience: B
    source_flow: 예시답안 p.1 (PDF p.2)
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $10=5\times2$, $15=5\times3$이므로 $x=2m+3n$($m,n$은 음이 아닌 정수)가 $S(2,3)$의 원소라면 $5x=10m+15n$는 $S(10,15)$의 원소이다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        $y=10m+15n$($m,n$은 음이 아닌 정수)가 $S(10,15)$의 원소라면 $y=5(2m+3n)=5x$이므로 $x=2m+3n$는 $S(2,3)$의 원소이다.
      criteria: ['1-1.M2']
    - id: 11b-3
      content: |
        위의 관찰에 의해 $S(10,15)=\{5x\mid x\text{는 }S(2,3)\text{의 원소}\}=\{0,10,15,20,25,30,35,\cdots\}$이므로 $S(10,15)\cap A=\{5k\mid k=0,1,\cdots,404\}-\{5\}$이다. 따라서 $n(A\cap S(10,15))=404$이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        $x\in S(2,3)$이면 $5x\in S(10,15)$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [11b-1]
    - id: 1-1.M2
      mark_type: R
      points: 4
      evidence: |
        $y\in S(10,15)$이면 $y=5x$ ($x\in S(2,3)$)임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [11b-2]
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        $n(A\cap S(10,15))=404$를 구했다.
      depends_on: [1-1.M1, 1-1.M2]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) 명제 '$a$ 이상의 모든 자연수 $x$에 대하여 $x\in S(3,4)$이다.'가 참이 되도록 하는 자연수 $a$의 최솟값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $5\notin S(3,4)$이고, $6,7,8$이 원소이면 $3$씩 더해 그 이상이 모두 원소.
    steps:
    - {id: 12a, content: '$S(3,4)=U-\{1,2,5\}$, $a=6$', criteria: ['1-2.R1', '1-2.M1', '1-2.R2']}
    hint_ladder:
    - $5$는 $3m+4n$으로 나타낼 수 있는가?
    - 연속한 세 수가 들어 있으면 그다음은?
  - id: S12-B
    audience: B
    source_flow: 예시답안 p.1 (PDF p.2)
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $3$보다 작은 두 자연수 $1$과 $2$는 $S(3,4)$의 원소가 아니고, $3$과 $4$는 당연히 $S(3,4)$의 원소이다. $5$는 $3$의 배수도 아니고 $4$의 배수도 아니므로, 만약 $5$가 $S(3,4)$의 원소라면, 어떤 자연수 $m,n$에 대하여 $5=3m+4n$을 만족한다. 하지만 $3m+4n$은 $7$이상의 자연수이므로 모순이 생긴다. 따라서 $5$는 $S(3,4)$의 원소가 아니고 $a\le5$이면 주어진 명제는 거짓이다.
      criteria: ['1-2.R1']
    - id: 12b-2
      content: |
        이제 $6$이상의 자연수 중 $S(3,4)$에 포함되는 원소를 모두 찾아보자. $6=3\times2+4\times0$, $7=3\times1+4\times1$, $8=3\times0+4\times2$이므로 $6,7,8$은 세 개의 연속된 $S(3,4)$의 원소이고
      criteria: ['1-2.M1']
    - id: 12b-3
      content: |
        $9=6+3$, $10=7+3$, $11=8+3$도 모두 $S(3,4)$의 원소이다. 이 과정을 계속하면 $6$이상의 모든 자연수가 $S(3,4)$의 원소임을 알 수 있다. 따라서 $S(3,4)=\{0,3,4,6,7,8,\cdots\}=U-\{1,2,5\}$이고 $a=6$이 주어진 명제가 참이 되는 자연수 $a$의 최솟값이다.
      criteria: ['1-2.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.R1
      mark_type: R
      points: 3
      evidence: |
        $a\le5$이면 주어진 명제가 거짓임($5\notin S(3,4)$)을 보였다.
      depends_on: []
      implied_ok: false
      steps: [12b-1]
    - id: 1-2.M1
      mark_type: M
      points: 3
      evidence: |
        $6,7,8$이 $S(3,4)$의 원소임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [12b-2]
    - id: 1-2.R2
      mark_type: R
      points: 4
      evidence: |
        $6$ 이상의 자연수가 모두 $S(3,4)$의 원소임을 보이고 $a=6$을 답했다.
      depends_on: [1-2.M1]
      steps: [12b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    (3) 명제 '어떤 양의 $7$의 배수는 $S(2,b)$의 원소가 아니다.'가 거짓이 되도록 하는 $2$보다 큰 자연수 $b$를 모두 구하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '[3, 5, 7]', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 부정은 '모든 양의 7의 배수가 $S(2,b)$의 원소'. 짝수 $b$는 탈락, $b\ge9$이면 $7\notin S(2,b)$.
    steps:
    - {id: 13a, content: '$b=3,5,7$', criteria: ['1-3.M1', '1-3.A1', '1-3.A2']}
    hint_ladder:
    - 주어진 명제가 거짓이라는 것은 그 부정이 참이라는 뜻이다.
    - $7\in S(2,b)$가 되려면 $b$는 어떤 수여야 하는가?
  - id: S13-B
    audience: B
    source_flow: 예시답안 p.1 (PDF p.2)
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        주어진 명제의 부정은 '모든 양의 $7$의 배수는 $S(2,b)$의 원소이다'이므로 모든 양의 $7$의 배수가 집합 $S(2,b)$에 포함되는 $2$보다 큰 자연수 $b$를 찾으면 된다.
      criteria: ['1-3.M1']
    - id: 13b-2
      content: |
        $b$가 짝수이면 $S(2,b)$의 모든 원소는 짝수이므로 $b$는 홀수이다.
      criteria: ['1-3.A1']
    - id: 13b-3
      content: |
        • 제시문 (가)에 의하여 모든 양의 $7$의 배수가 $S(2,3)$에 포함된다.
        • $2+5=7$이고 자연수 $x$에 대하여 $7x=2x+5x$이므로 모든 양의 $7$의 배수가 $S(2,5)$에 포함된다.
        • 모든 양의 $7$의 배수가 $S(2,7)$에 포함된다.
        • $b\ge9$이면 $7\notin S(2,b)$.
        따라서 답은 $b=3,5,7$이다.
      criteria: ['1-3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 4
      evidence: |
        주어진 명제의 부정을 바르게 기술하고 부정명제가 참이 되는 $b$를 찾으면 됨을 적었다.
      depends_on: []
      implied_ok: false
      steps: [13b-1]
    - id: 1-3.A1
      mark_type: A
      points: 3
      evidence: |
        $b$는 홀수이어야 함을 근거와 함께 적었다.
      depends_on: [1-3.M1]
      steps: [13b-2]
    - id: 1-3.A2
      mark_type: A
      points: 3
      evidence: |
        $b=3,5,7$을 답했다.
      depends_on: [1-3.M1, 1-3.A1]
      steps: [13b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 1-2] 제시문 (나)를 읽고 물음에 답하시오.
    (1) 함수 $f:X_n\to X_n$가 <조건>을 만족하면 $f$의 치역은 $\{x\in X_n\mid f(x)=x\}$임을 증명하시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: 치역의 원소 $b=f(a)$이면 $f(b)=f(f(a))=f(a)=b$, 역으로 고정점은 자기 자신의 상이다.
    steps:
    - {id: 21a, content: '치역 $\subset$ 고정점 집합, 고정점 집합 $\subset$ 치역 → 같다', criteria: ['2-1.R1', '2-1.R2', '2-1.R3']}
    hint_ladder:
    - 치역에 속한 원소 $b$는 어떤 $a$의 상이다. $f(b)$를 계산해 보자.
  - id: S21-B
    audience: B
    source_flow: 예시답안 p.2 (PDF p.3)
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $f$의 치역에 속하는 한 원소를 $b$라 하면, 정의역의 어떤 원소 $a$에 대하여 $f(a)=b$이다. $f$는 <조건>을 만족하므로 $(f\circ f)(a)=f(a)$이고 $f(b)=b$가 된다. 따라서 $f$의 치역은 $\{x\in X_n\mid f(x)=x\}$의 부분집합이다.
      criteria: ['2-1.R1']
    - id: 21b-2
      content: |
        한편, 집합 $\{x\in X_n\mid f(x)=x\}$가 $f$의 치역의 부분집합이 되는 것은 명백하므로(보충: $f(x)=x$이면 $x$는 $x$의 상)
      criteria: ['2-1.R2']
    - id: 21b-3
      content: |
        $f$의 치역은 $\{x\in X_n\mid f(x)=x\}$이다. ■
      criteria: ['2-1.R3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.R1
      mark_type: R
      points: 5
      evidence: |
        $f$의 치역의 원소는 $\{x\in X_n\mid f(x)=x\}$의 원소임을 <조건>을 써서 보였다.
      depends_on: []
      implied_ok: false
      steps: [21b-1]
