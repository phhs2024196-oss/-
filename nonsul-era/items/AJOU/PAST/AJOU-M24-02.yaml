- id: '2'
  stem: |
    [문제 2-2] 제시문 (가)와 (나)를 읽고 아래의 상용로그표를 이용하여 $50$번의 <동전 던지기 게임>에 대한 섀넌의 실제 게임당 평균 수익률을 구하시오. (단, $\log2=0.3010$, $\log3=0.4771$로 계산하며 게임당 평균 수익률의 소수점 이하 3번째 자리에서 버린다.)
    [상용로그표: 수 $1.0$ 행에서 둘째 자리 $0,1,2,\cdots,9$에 대한 값이 차례로 $0.0000$, $0.0043$, $0.0086$, $0.0128$, $0.0170$, $0.0212$, $0.0253$, $0.0294$, $0.0334$, $0.0374$]
  points: 10
  depends_on: []
  answer: {kind: value, value: '0.06', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $(1+r)^{50}=\left(\tfrac98\right)^{25}$이므로 $1+r=\sqrt{\tfrac98}$, $\log(1+r)=0.0256$.
    steps:
    - {id: 2a, content: '$\log1.06<0.0256<\log1.07\Rightarrow r\approx0.06$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - (나)의 식에서 $A$와 $a_n$은 각각 무엇인가?
  - id: S2-B
    audience: B
    source_flow: 예시답안 p.4 (PDF p.5)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        제시문 (나)와 [문제 2-1]의 (3)에 의해
        $$(1+r)^{50}=\frac{y_{50}}{Y}=\left(\frac98\right)^{25}$$
        이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        양변에 상용로그를 취하고 계산하면
        $$\log(1+r)=\frac12(2\log3-3\log2)=\frac12(0.9542-0.9030)=0.0256$$
        이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        상용로그표에 의해 $\log1.06<0.0256<\log1.07$이므로 $0.06<r<0.07$이다. 따라서 실제 게임당 평균 수익률 $r$은 약 $0.06$이다.
      criteria: ['2.A1']
