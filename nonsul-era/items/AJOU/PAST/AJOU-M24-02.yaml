stimuli:
- label: 가
  body: |
    다음과 같은 게임을 생각해보자.
    <동전 던지기 게임>
    ① 게임의 모든 참가자는 동전을 던지기 전에 자신이 가진 점수의 일부 또는 전부를 제시한다.
    ② 심판이 한 개의 동전을 던지고
    - 동전의 앞면이 나오면 각 참가자는 제시한 점수만큼 더 얻는다.
    - 동전의 뒷면이 나오면 각 참가자는 제시한 점수의 반을 잃는다.
    예를 들어 아주가 $100$점을 가지고 <동전 던지기 게임>에 참가하였다고 하자. 아주가 자신이 가진 점수 $100$점 중 $50$점을 제시했다면, 동전의 앞면이 나왔을 때는 $50$점$+50$점$\times2=150$점이 되고 동전의 뒷면이 나왔을 때에는 $50$점$+50$점$\div2=75$점이 된다.
    장투와 섀넌은 각각 $100$점을 가지고 연속한 $50$번의 <동전 던지기 게임>에 참가하였다. 매 게임마다 ①의 과정에서 장투는 자신이 가진 점수의 전부를 제시했고, 섀넌은 자신이 가진 점수의 반을 제시했다. $50$번의 게임에서 다음과 같이 홀수 번째 게임에서는 앞면, 짝수 번째 게임에서는 뒷면이 나왔다.
    [표: 게임 번호 1, 2, 3, 4, 5, …, 49, 50 / 결과 앞면, 뒷면, 앞면, 뒷면, 앞면, …, 앞면, 뒷면]
    $k$번$(1\le k\le50)$의 게임 후 장투의 점수를 $x_k$ 그리고 섀넌의 점수를 $y_k$라고 하자.
- label: 나
  body: |
    펀드나 포트폴리오의 광고를 보면 연평균 수익률로 몇 년간 수익률의 산술평균을 제시하는 경우가 있다. 그러나 산술평균으로 나타낸 수익률은 실제 수익률보다 높아서 예상한 만큼 수익을 얻을 수 없다. 예를 들어 S펀드 상품에 투자하여 2021년에는 $40\%$의 수익, 2022년에는 $20\%$의 손실이 발생했다고 가정해보자. 산술평균으로 수익률을 계산하면 연평균 수익률은 $10\%$가 되며 2년간 수익률은 연평균 수익률의 2배인 $20\%$가 된다. 그러나 실제로 S펀드 상품에 2021년 초에 100만원을 투자했다면 2022년 말에는 112만원이 되어 있을 것이다. 따라서 원금 대비 2년간 실제 수익률은 $12\%$로 산술평균으로 계산된 수익률인 $20\%$보다 낮다는 것을 알 수 있다.
    그렇다면 실제 연평균 수익률(밑줄)은 어떻게 계산할까? 투자 원금을 $A$, $n$년 후의 평가 금액을 $a_n$이라할 때, 실제 연평균 수익률은 다음 식을 만족하는 $r$의 값이다.
    $$A(1+r)^n=a_n$$

stem: |
  다음 제시문을 읽고 주어진 질문에 답하시오.

subparts:
- id: '1-1'
  stem: |
    [문제 2-1] 제시문 (가)를 읽고 다음에 답하시오.
    (1) $x_{50}$을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '100', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 전부 제시하면 앞면에 2배, 뒷면에 $\tfrac12$배이므로 두 판마다 원래 점수로 돌아온다.
    steps:
    - {id: 11a, content: '$x_{50}=X=100$', criteria: ['1-1.M1', '1-1.M2', '1-1.A1', '1-1.A2']}
    hint_ladder:
    - 전부 제시하고 앞면이 나오면 점수는 몇 배가 되는가?
  - id: S11-B
    audience: B
    source_flow: 예시답안 p.3 (PDF p.4)
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        홀수 번째 게임에서는 앞면이 나오므로, 이전 게임의 점수의 $2$배가 된다. 따라서 $x_{2n-1}=2x_{2n-2}$이다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        짝수 번째 게임에서는 뒷면이 나오므로 이전 게임의 점수의 반이 되며 $x_{2n}=\dfrac12x_{2n-1}$이 된다.
      criteria: ['1-1.M2']
    - id: 11b-3
      content: |
        장투가 처음 가진 점수를 $X$라 하면,
        $$x_1=2X,\ x_2=\frac12x_1=X,\ x_3=2x_2=2X,\ x_4=\frac12x_3=X,\ \cdots,\ x_{50}=X$$
      criteria: ['1-1.A1']
    - id: 11b-4
      content: |
        $X=100$이므로 $x_{50}=100$이다.
      criteria: ['1-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        $x_{2n-1}=2x_{2n-2}$(귀납적 정의)를 바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [11b-1]
    - id: 1-1.M2
      mark_type: M
      points: 3
      evidence: |
        $x_{2n}=\dfrac12x_{2n-1}$(귀납적 정의)를 바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [11b-2]
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        귀납적 정의를 이용하여 $x_k$($k=1,\cdots,50$)를 $X$로 표현했다.
      depends_on: [1-1.M1, 1-1.M2]
      steps: [11b-3]
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: |
        $x_{50}=100$을 계산했다.
      depends_on: [1-1.M1, 1-1.A1]
      steps: [11b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) 수열 $\{y_n\}$에 대하여 $\dfrac{y_{2n}}{y_{2n-1}}\,(1\le n\le25)$과 $\dfrac{y_{2n+1}}{y_{2n}}\,(1\le n\le24)$의 값을 각각 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'y2n/y2n_1 = 3/4; y2n1/y2n = 3/2', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 반을 제시하면 앞면에 $\tfrac32$배, 뒷면에 $\tfrac34$배.
    steps:
    - {id: 12a, content: '$\tfrac{y_{2n}}{y_{2n-1}}=\tfrac34$, $\tfrac{y_{2n+1}}{y_{2n}}=\tfrac32$', criteria: ['1-2.M1', '1-2.A1', '1-2.M2', '1-2.A2']}
    hint_ladder:
    - 제시하지 않은 반과 제시한 반을 나누어 계산하자.
  - id: S12-B
    audience: B
    source_flow: 예시답안 p.3 (PDF p.4)
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        섀넌은 $2n$ 번째 게임에서 가진 점수의 반인 $\dfrac12y_{2n-1}$을 제시하고 제시한 금액의 반을 잃으므로
        $$y_{2n}=\frac12y_{2n-1}+\frac12\left(\frac12y_{2n-1}\right)=\frac34y_{2n-1}$$
        이다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        따라서 $\dfrac{y_{2n}}{y_{2n-1}}=\dfrac34$이다.
      criteria: ['1-2.A1']
    - id: 12b-3
      content: |
        $2n+1$ 번째 게임에서는 가진 점수의 반인 $\dfrac12y_{2n}$을 제시하고 제시한 금액만큼 얻으므로
        $$y_{2n+1}=\frac12y_{2n}+2\left(\frac12y_{2n}\right)=\frac32y_{2n}$$
        이다.
      criteria: ['1-2.M2']
    - id: 12b-4
      content: |
        따라서 $\dfrac{y_{2n+1}}{y_{2n}}=\dfrac32$이다.
      criteria: ['1-2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 3
      evidence: |
        $y_{2n}$을 $y_{2n-1}$의 식으로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [12b-1]
    - id: 1-2.A1
      mark_type: A
      points: 2
      evidence: |
        $\dfrac{y_{2n}}{y_{2n-1}}=\dfrac34$을 구했다.
      depends_on: [1-2.M1]
      steps: [12b-2]
    - id: 1-2.M2
      mark_type: M
      points: 3
      evidence: |
        $y_{2n+1}$을 $y_{2n}$의 식으로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [12b-3]
    - id: 1-2.A2
      mark_type: A
      points: 2
      evidence: |
        $\dfrac{y_{2n+1}}{y_{2n}}=\dfrac32$를 구했다.
      depends_on: [1-2.M2]
      steps: [12b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    (3) $y_{50}$을 구하시오.
  points: 10
  depends_on: ['1-2']
  answer: {kind: value, value: '100*(9/8)**25', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 두 판마다 $\tfrac32\cdot\tfrac34=\tfrac98$배, 25번 반복.
    steps:
    - {id: 13a, content: '$y_{50}=\left(\tfrac98\right)^{25}\cdot100$', criteria: ['1-3.M1', '1-3.A1']}
    hint_ladder:
    - 두 게임을 한 묶음으로 보자.
  - id: S13-B
    audience: B
    source_flow: 예시답안 p.3 (PDF p.4)
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        섀넌이 처음에 가진 점수를 $Y$라 하면 (2)에 의해
        $$y_1=\frac32Y,\ y_2=\frac34y_1=\frac98Y,\ y_3=\frac32y_2=\frac{27}{16}Y,\ y_4=\frac34y_3=\left(\frac98\right)^2Y,\ \cdots,\ y_{50}=\left(\frac98\right)^{25}Y$$
        이다.
      criteria: ['1-3.M1']
    - id: 13b-2
      content: |
        $Y=100$이므로 $y_{50}=\left(\dfrac98\right)^{25}100$이다.
      criteria: ['1-3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 5
      evidence: |
        (2)의 귀납적 정의를 이용하여 $y_k$($k=1,\cdots,50$)를 $Y$로 표현했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1-2.A1, 1-2.A2], max_points: 5}
      steps: [13b-1]
    - id: 1-3.A1
      mark_type: A
      points: 5
      evidence: |
        $y_{50}=\left(\dfrac98\right)^{25}\times100$을 계산했다.
      depends_on: [1-3.M1]
      steps: [13b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-4'
  stem: |
    (4) 아주가 $100$점을 가지고 장투와 섀넌이 참가한 $50$번의 <동전 던지기 게임>에 참가하였고 매 게임마다 ①의 과정에서 자신이 가진 점수에 $\alpha\,(0\le\alpha\le1)$를 곱한 값을 제시한다고 할 때. $50$회의 게임 후 아주의 점수가 최대가 되는 $\alpha$를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S14-A
    audience: A
    method_no: 1
    key_idea: $z_{50}=\{(1+\alpha)(1-\tfrac12\alpha)\}^{25}Z$이므로 이차식 $(1+\alpha)(1-\tfrac12\alpha)$를 최대로.
    steps:
    - {id: 14a, content: '$f(\alpha)=1+\tfrac12\alpha-\tfrac12\alpha^2$, 최대 $\alpha=\tfrac12$', criteria: ['1-4.M1', '1-4.M2', '1-4.M3', '1-4.A1', '1-4.A2']}
    hint_ladder:
    - 앞면·뒷면일 때 점수는 각각 몇 배가 되는가?
  - id: S14-B
    audience: B
    source_flow: 예시답안 p.4 (PDF p.5)
    method_no: 1
    steps:
    - id: 14b-1
      content: |
        아주가 처음에 가진 점수를 $Z$라 하고, $k$번째 게임 후 아주가 가진 점수를 $z_k$라 하자. 각 게임에서 아주가 자신이 가진 점수의 $\alpha\,(0\le\alpha\le1)$를 곱한 만큼 제시하면 홀수 번째 게임에서는
        $$z_{2n-1}=(1-\alpha)z_{2n-2}+2(\alpha z_{2n-2})=(1+\alpha)z_{2n-2}$$
        이고,
      criteria: ['1-4.M1']
    - id: 14b-2
      content: |
        짝수 번째 게임에서는
        $$z_{2n}=(1-\alpha)z_{2n-1}+\frac12(\alpha z_{2n-1})=\left(1-\frac12\alpha\right)z_{2n-1}$$
        이다.
      criteria: ['1-4.M2']
    - id: 14b-3
      content: |
        [문제 2-1]의 (3)과 같은 방법으로 계산하면
        $$z_{50}=(1+\alpha)^{25}\left(1-\frac12\alpha\right)^{25}Z=\left\{(1+\alpha)\left(1-\frac12\alpha\right)\right\}^{25}Z$$
        이다.
      criteria: ['1-4.M3']
    - id: 14b-4
      content: |
