stimuli:
- label: 가
  body: |
    (가) 두 곡선 $y=x^3$, $y=x^2$을 생각하자. 【그림1】과 같이 직선 $y=ax$가 제1사분면에서 곡선 $y=x^2$과 만나는 점을 $\mathrm{P}$라 하고, 점 $\mathrm{P}$에서 $x$축에 내린 수선의 발을 $\mathrm{N}$이라 하자. (단, $0<a<1$)

    [그림 1: $y=x^3$, $y=x^2$, $y=ax$의 그래프와 원점 중심의 원. 직선 $y=ax$와 $y=x^2$의 교점 $\mathrm{P}$, $\mathrm{P}$에서 $x$축에 내린 수선의 발 $\mathrm{N}$(점선). 원점에서 $\mathrm{P}$까지는 $y=x^2$ 아래·$y=x^3$ 위, $\mathrm{P}$ 이후로는 $y=ax$ 아래·$y=x^3$ 위인 가는 영역이 색칠되어 있다. 원은 원점을 중심으로 $\mathrm{P}$를 지난다.]

    【그림1】의 색칠된 부분과 같이 두 곡선 $y=x^3$, $y=x^2$과 직선 $y=ax$로 둘러싸인 도형을 $A$라 하자. $A$의 넓이를 $S(a)$, 직선 $\mathrm{PN}$에 의해 나뉘는 $A$의 오른쪽 부분의 넓이를 $S_1(a)$라 한다.
- label: 나
  body: |
    (나) 원점을 중심으로 하고 점 $\mathrm{P}$를 지나는 원을 $C$라 하자. 점 $\mathrm{P}$에서 원 $C$에 그은 접선을 $\ell_1$이라 하고 점 $\mathrm{P}$에서 곡선 $y=x^2$에 그은 접선을 $\ell_2$라 하자. 도형 $A$ 중 원 $C$의 내부에 해당하는 부분의 넓이를 $T(a)$라 한다.

stem: |
  [문항 1]【제시문】을 읽고 물음에 답하라.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (20점) (가)에 대한 물음에 답하라.
    (1) (10점) 다음 극한을 조사하라.
    $$\lim_{a\to0+}\frac{S(a)}{S_1(a)}$$
  points: 10
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $S(a)=\dfrac{a^2}4-\dfrac{a^3}6$, $S_1(a)=\dfrac{a^2}4-\dfrac{a^3}2+\dfrac{a^4}4$이므로 최고차가 같은 $a^2$항.
    steps:
    - {id: 11a, content: '$\lim\frac{\frac14-\frac a6}{\frac14-\frac a2+\frac{a^2}4}=1$', criteria: [1-1.M1, 1-1.A1, 1-1.A2]}
    hint_ladder:
    - 직선 $\mathrm{PN}$의 왼쪽과 오른쪽에서 위쪽 경계가 무엇인지 보자.
  - id: S11-B
    audience: B
    source_flow: 채점기준 p.2
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        영역 $A$는 직선 $\mathrm{PN}$에 의해 두 부분으로 나뉘고, 각 영역의 넓이를 정적분으로 나타내어 보면,
        $\displaystyle\int_0^a(x^2-x^3)\,dx=\frac{a^3}3-\frac{a^4}4$, $\displaystyle\int_a^{\sqrt a}(ax-x^3)\,dx=\frac a2(a-a^2)-\frac{a^2}4+\frac{a^4}4=\frac{a^2}4-\frac{a^3}2+\frac{a^4}4$
        이다. 이로부터 $\displaystyle S(a)=\int_0^a(x^2-x^3)\,dx+\int_a^{\sqrt a}(ax-x^3)\,dx=\frac{a^2}4-\frac{a^3}6$이고,
      criteria: [1-1.M1]
    - id: 11b-2
      content: |
        $\displaystyle S_1(a)=\int_a^{\sqrt a}(ax-x^3)\,dx=\frac{a^2}4-\frac{a^3}2+\frac{a^4}4$이다.
      criteria: [1-1.A1]
    - id: 11b-3
      content: |
        따라서, $\displaystyle\lim_{a\to0+}\frac{S(a)}{S_1(a)}=\lim_{a\to0+}\frac{\frac{a^2}4-\frac{a^3}6}{\frac{a^2}4-\frac{a^3}2+\frac{a^4}4}=\lim_{a\to0+}\frac{\frac14-\frac a6}{\frac14-\frac a2+\frac{a^2}4}=1$이다.
      criteria: [1-1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: |
        $S(a)=\dfrac{a^2}4-\dfrac{a^3}6$를 정적분으로 구했다.
      depends_on: []
      implied_ok: false
      steps: [11b-1]
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        $S_1(a)=\dfrac{a^2}4-\dfrac{a^3}2+\dfrac{a^4}4$를 구했다.
      depends_on: [1-1.M1]
      steps: [11b-2]
    - id: 1-1.A2
      mark_type: A
      points: 3
      evidence: |
        극한값 $1$을 구했다.
      depends_on: [1-1.M1, 1-1.A1]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) (10점) $S(a)=\dfrac1{24}$일 때, $a$의 값을 구하라.
  points: 10
  depends_on: ['1-1']
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{a^2}4-\dfrac{a^3}6=\dfrac1{24}\iff4a^3-6a^2+1=0\iff(2a-1)(2a^2-2a-1)=0$.
    steps:
    - {id: 12a, content: '$0<a<1$이므로 $a=\frac12$', criteria: [1-2.M1, 1-2.A1]}
    hint_ladder:
    - (1)의 $S(a)$를 그대로 쓰자.
  - id: S12-B
    audience: B
    source_flow: 채점기준 p.2
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        풀이 (1)에서 구한 도형 $A$의 넓이는 $\displaystyle S(a)=\int_0^a(x^2-x^3)\,dx+\int_a^{\sqrt a}(ax-x^3)\,dx=\frac{a^2}4-\frac{a^3}6$이다. 그러므로 $S(a)=\dfrac{a^2}4-\dfrac{a^3}6=\dfrac1{24}$을 풀면
      criteria: [1-2.M1]
    - id: 12b-2
      content: |
        $a=\dfrac12$이다. (보충: $4a^3-6a^2+1=(2a-1)(2a^2-2a-1)=0$이고 $2a^2-2a-1=0$의 근 $\dfrac{1\pm\sqrt3}{2}$는 $0<a<1$을 만족하지 않는다.)
      criteria: [1-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 5
      evidence: |
        방정식 $\dfrac{a^2}4-\dfrac{a^3}6=\dfrac1{24}$을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1-1.M1], max_points: 5}
      steps: [12b-1]
    - id: 1-2.A1
      mark_type: A
      points: 5
      evidence: |
        $a=\dfrac12$을 구했다.
      depends_on: [1-2.M1]
      steps: [12b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 1-2] (30점) (가)와 (나)에 대한 물음에 답하라.
    (1) (10점) 두 직선 $\ell_1$과 $\ell_2$가 이루는 예각의 크기를 최소로 하는 $a$의 값을 구하라.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1/sqrt(2)', equivalents: ['sqrt(2)/2'], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $\ell_1$ 기울기 $-\dfrac1a$, $\ell_2$ 기울기 $2a$, $\tan(\alpha-\beta)=\dfrac1a+2a\ge2\sqrt2$.
    steps:
    - {id: 21a, content: '등호 $\frac1a=2a$, $a=\frac1{\sqrt2}$', criteria: [2-1.M1, 2-1.M2, 2-1.A1]}
    hint_ladder:
    - 원의 접선은 반지름 $\mathrm{OP}$에 수직이다.
  - id: S21-B
    audience: B
    source_flow: 채점기준 p.2
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $\ell_1$의 방정식은 $ax+a^2y=a^2+a^4$이며 그 기울기는 $-\dfrac1a$이고 $\ell_2$의 방정식은 $y-a^2=2a(x-a)$이며 그 기울기는 $2a$이다.
      criteria: [2-1.M1]
    - id: 21b-2
      content: |
        직선 $\ell_1$, $\ell_2$가 $x$축의 양의 방향과 이루는 각을 각각 $\alpha$, $\beta$라 하면 두 직선이 이루는 각은 $(\alpha-\beta)$이고 삼각함수의 덧셈정리와 산술평균과 기하평균의 대소 관계에 의하여 다음이 성립한다.
        $\tan(\alpha-\beta)=\dfrac{-\frac1a-2a}{1+\left(-\frac1a\right)\cdot2a}=\dfrac1a+2a\ge2\sqrt2$
      criteria: [2-1.M2]
    - id: 21b-3
      content: |
        등호는 $\dfrac1a=2a$일 때, 즉 $a=\dfrac1{\sqrt2}$일 때 성립하므로, 두 접선은 $a=\dfrac1{\sqrt2}$일 때 각의 크기가 최소이다.
      criteria: [2-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 4
      evidence: |
        $\ell_1$의 기울기 $-\dfrac1a$와 $\ell_2$의 기울기 $2a$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [21b-1]
    - id: 2-1.M2
      mark_type: M
      points: 4
      evidence: |
        덧셈정리와 산술·기하평균으로 $\tan(\alpha-\beta)=\dfrac1a+2a\ge2\sqrt2$를 보였다.
      depends_on: [2-1.M1]
      implied_ok: false
      steps: [21b-2]
    - id: 2-1.A1
      mark_type: A
      points: 2
      evidence: |
        $a=\dfrac1{\sqrt2}$을 구했다.
      depends_on: [2-1.M2]
      steps: [21b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    (2) (8점) 점 $\left(a+a^2,(a+a^2)^3\right)$은 원 $C$의 외부에 있음을 증명하라.
  points: 8
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: $C:x^2+y^2=a^2+a^4$이고 $(a+a^2)^2\ge a^2+a^4$.
    steps:
    - {id: 22a, content: '$(a+a^2)^2+((a+a^2)^3)^2>(a+a^2)^2\ge a^2+a^4$', criteria: [2-2.M1, 2-2.R1]}
    hint_ladder:
    - 원의 반지름의 제곱은 $\overline{\mathrm{OP}}^2$이다.
  - id: S22-B
    audience: B
    source_flow: 채점기준 p.3
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        제시문으로부터 $C:x^2+y^2=a^2+a^4$이다. 한편,
        $(a+a^2)^2+\left((a+a^2)^3\right)^2>(a+a^2)^2\ge a^2+a^4$
        ($(a+a^2)^2=a^2+2a^3+a^4$이고 $a>0$)
      criteria: [2-2.M1]
    - id: 22b-2
      content: |
        이므로 점 $\left(a+a^2,(a+a^2)^3\right)$은 원 $C$의 외부에 있음을 알 수 있다. ■
      criteria: [2-2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 4
      evidence: |
        원 $C:x^2+y^2=a^2+a^4$와 부등식 $(a+a^2)^2+\left((a+a^2)^3\right)^2>(a+a^2)^2\ge a^2+a^4$를 적었다.
      depends_on: []
      implied_ok: false
      steps: [22b-1]
    - id: 2-2.R1
      mark_type: R
      points: 4
      evidence: |
        원점까지 거리의 제곱이 반지름의 제곱보다 크므로 원의 외부에 있다고 결론지었다.
      depends_on: [2-2.M1]
      steps: [22b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-3'
  stem: |
    (3) (12점) 극한 $\displaystyle\lim_{a\to0+}\frac{T(a)}{a^m}$의 값이 0이 아닌 실수가 되도록 하는 자연수 $m$은 유일하다. 자연수 $m$과 극한값을 구하라.
  points: 12
  depends_on: ['2-2']
  answer: {kind: expression, value: 'm = 3; limit = 1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S23-A
    audience: A
    method_no: 1
    key_idea: (2)에 의해 원 $C$는 $x\le a+a^2$ 안쪽에서 $A$를 자르므로 $\displaystyle\int_0^a(x^2-x^3)dx\le T(a)\le\int_0^{a+a^2}(x^2-x^3)dx$.
    steps:
    - {id: 23a, content: '양변을 $a^3$으로 나누면 $\lim\frac{T(a)}{a^3}=\frac13$, $m=3$', criteria: [2-3.M1, 2-3.A1, 2-3.A2]}
    hint_ladder:
