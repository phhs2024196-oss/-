intent: |
  다항함수로 둘러싸인 도형의 넓이와 그 극한, 원과 포물선의 접선이 이루는 각의 최소, 점과 원의 위치 관계 증명, 넓이를 위아래에서 정적분으로 눌러 극한을 구하는 능력을 본다. (선행학습영향평가 문항카드 없음 — 모의논술, 작성자 요약)
key_idea: |
  $S(a)=\displaystyle\int_0^a(x^2-x^3)dx+\int_a^{\sqrt a}(ax-x^3)dx=\frac{a^2}4-\frac{a^3}6$. 두 접선의 기울기 $-\dfrac1a$, $2a$로 $\tan(\alpha-\beta)=\dfrac1a+2a\ge2\sqrt2$. $T(a)$를 $\displaystyle\int_0^a(x^2-x^3)dx\le T(a)\le\int_0^{a+a^2}(x^2-x^3)dx$로 끼운다.
stuck: |
  (1-2)(3) $T(a)$를 직접 계산하지 않고 (1-2)(2)의 결과(점이 원 밖)를 이용해 위아래 적분으로 끼우는 발상
