  새로 정의한 「반복쌍」 개념을 함수값의 나열로 해석하여 예를 구성(존재 증명)하고, 최소 길이를 논증하며, 귀류법으로 불가능성을 보이고, 조건을 만족하는 함수의 개수를 경우의 수로 세는 능력을 본다. (선행학습영향평가 문항카드 없음 — 모의논술, 작성자 요약)
