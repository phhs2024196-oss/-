  함수값 $f(1),f(2),\dots,f(m)$을 차례로 나열한 수열에서 $(s,t)$가 반복쌍 $\iff$ $s,t,s,t$가 부분수열로 나타남. 치역이 두 원소이고 반복쌍이 없으면 값이 바뀌는 횟수가 2 이하.
