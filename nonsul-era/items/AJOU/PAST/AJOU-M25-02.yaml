      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        $\dfrac{a_n}n>2025$을 풀어 최솟값 $17$을 구했다.
      depends_on: [3.M1]
      steps: [3b-2]
    deductions: []
