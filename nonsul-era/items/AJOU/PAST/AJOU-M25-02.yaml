- id: '3'
  stem: |
    [문제 2-3] (10점) 다음 조건을 만족하는 함수 $f:N_n\to N_n$의 개수를 $a_n$이라 할 때, $\dfrac{a_n}{n}>2025$를 만족하는 자연수 $n$의 최솟값을 구하라.
    < 조 건 >
    ① $f$의 반복쌍은 존재하지 않는다.
    ② $f$의 치역의 원소의 개수가 2 이하이다.
  points: 10
  depends_on: []
  answer: {kind: value, value: '17', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 치역 1개 $n$가지, 치역 2개는 첫 값·둘째 값 $n(n-1)$가지 × 값이 바뀌는 자리 ${}_{n-1}\mathrm{C}_1+{}_{n-1}\mathrm{C}_2$.
    steps:
    - {id: 3a, content: '$\frac{a_n}n=1+\frac{n(n-1)^2}2>2025\Rightarrow n\ge17$', criteria: [3.M1, 3.A1]}
    hint_ladder:
    - 두 값만 쓰면서 반복쌍이 없으려면 값이 몇 번까지 바뀔 수 있는가?
  - id: S3-B
    audience: B
    source_flow: 채점기준 p.5
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        치역의 원소의 개수가 1인 경우의 수는 $n$이다. 치역의 원소의 개수가 2인 경우를 생각하자. 조건을 만족하려면 함숫값 $f(1),f(2),\cdots,f(n)$을 차례로 나열했을 때 숫자가 두 번 이하로 바뀌어야 한다. 숫자가 한 번 바뀌는 경우는 첫 번째 자리를 제외한 $(n-1)$개의 자리 중 숫자가 바뀔 한 자리를 고르는 경우를 살펴야 하고, 숫자가 두 번 바뀌는 경우는 $(n-1)$개의 자리 중 숫자가 바뀔 두 자리를 고르는 경우가 된다. 따라서, 다음이 성립한다.
        $a_n=n+n(n-1)\times\left({}_{n-1}\mathrm{C}_1+{}_{n-1}\mathrm{C}_2\right)=n+n(n-1)\left(n-1+\dfrac{(n-1)(n-2)}2\right)=n+\dfrac{n^2(n-1)^2}2$
      criteria: [3.M1]
    - id: 3b-2
      content: |
        이로부터 $\dfrac{a_n}n=1+\dfrac{n(n-1)^2}2$이므로 $\dfrac{a_n}n>2025$을 계산하면, $n\ge17$이어야 한다. 따라서 구하는 $n$의 최솟값은 $17$이다. (보충: $n=16$이면 $1+\dfrac{16\cdot225}2=1801$, $n=17$이면 $1+\dfrac{17\cdot256}2=2177$)
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 6
      evidence: |
