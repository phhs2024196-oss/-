stimuli:
- label: 가
  body: |
    [그림 1]과 같이 길이가 $3$인 고정된 막대 $\mathrm{AB}$ 끝에 길이가 $2$인 막대 $\mathrm{BP}$가 연결되어 있다. 점 $\mathrm{P}$에서 막대 $\mathrm{AB}$ 또는 그 연장선에 내린 수선의 발을 $\mathrm{H}$라 하고, $\angle\mathrm{ABP}=\theta$라 두자. (단, $0<\theta<\pi$)

    [그림 1: 가로로 놓인 막대 $\mathrm{AB}$(길이 $3$), $\mathrm{B}$에서 오른쪽 위로 뻗은 막대 $\mathrm{BP}$(길이 $2$), $\mathrm{P}$에서 $\mathrm{AB}$의 연장선에 내린 수선의 발 $\mathrm{H}$($\mathrm{B}$의 오른쪽), 선분 $\mathrm{AP}$]

    이때, 삼각형 $\mathrm{ABP}$의 외접원의 반지름의 길이를 $R$, 삼각형 $\mathrm{ABP}$와 삼각형 $\mathrm{AHP}$의 넓이를 각각 $S_1$, $S_2$라 하자.
- label: 나
  body: |
    점 $\mathrm{B}$에 연결되어 있는 길이가 $3$인 막대 $\mathrm{AB}$와 길이가 $2$인 막대 $\mathrm{BP}$가 있다. 중심이 원점이고 반지름의 길이가 $1$인 원을 $C_1$, 중심이 $(4,0)$이고 반지름의 길이가 $2$인 원을 $C_2$라 하자. [그림 2]와 같이 시각 $t=0$일 때 점 $\mathrm{A}$, 점 $\mathrm{B}$, 점 $\mathrm{P}$는 각각 $(1,0)$, $(4,0)$, $(4,2)$에 위치하고, 시각 $t$에서 [그림 3]과 같이 점 $\mathrm{A}$, 점 $\mathrm{B}$, 점 $\mathrm{P}$는 각각 원 $C_1$, $x$축, 원 $C_2$ 위에 위치한다. 점 $\mathrm{A}$의 시각 $t$에서의 좌표는 $(\cos t,\sin t)$이다. 시각 $t$일 때 원점과 점 $\mathrm{P}$ 사이의 거리의 제곱을 $f(t)$라 하자. 한편, $t=t_0$일 때 직선 $\mathrm{AB}$가 처음으로 원 $C_1$에 접한다. (단, 두 막대의 길이는 변하지 않으며 점 $\mathrm{P}$는 제1사분면 위의 점이다.)

    [그림 2: $t=0$. 원 $C_1$(점선), 원 $C_2$(점선), $\mathrm{A}(1,0)$, $\mathrm{B}(4,0)$, $\mathrm{P}(4,2)$; 막대 $\mathrm{AB}$는 $x$축 위, $\mathrm{BP}$는 수직]
    [그림 3: 시각 $t$. $\mathrm{A}(\cos t,\sin t)$는 $C_1$ 위 제1사분면, $\mathrm{B}$는 $x$축 위 $4$보다 왼쪽, $\mathrm{P}$는 $C_2$ 위(위쪽)]

stem: |
  [문항 1] 【제시문】을 읽고 물음에 답하시오.

subparts:
- id: '1-1'
  stem: |
    [문제 1-1] (20점) 제시문 (가)에 관한 물음에 답하시오.

    (1) (8점) 다음 극한을 조사하시오.
    $$\lim_{\theta\to\pi-}\frac{S_1}{S_2}$$
  points: 8
  depends_on: []
  answer: {kind: value, value: '3/5', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: $S_1=3\sin\theta$, $S_2=(3-2\cos\theta)\sin\theta$이므로 비는 $\dfrac{3}{3-2\cos\theta}$.
    steps:
    - id: 1-1a
      content: |
        $\theta\to\pi-$이면 $\dfrac{3}{3+2}=\dfrac35$.
      criteria: ['1-1.M1', '1-1.A1']
    hint_ladder:
    - $\overline{\mathrm{AH}}$와 $\overline{\mathrm{PH}}$를 $\theta$로 나타내자.
  - id: S1-1-B
    audience: B
    source_flow: 채점기준 p.2
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        삼각형의 넓이 공식에 의하여 $S_1=\dfrac12\cdot3\cdot2\cdot\sin\theta=3\sin\theta$이다. 그리고 삼각비에 의하여 $S_2=\dfrac12\cdot(3+2\cos(\pi-\theta))\cdot(2\sin(\pi-\theta))=(3-2\cos\theta)\sin\theta$이다.
      criteria: ['1-1.M1']
    - id: 1-1b-2
      content: |
        따라서 $\displaystyle\lim_{\theta\to\pi-}\frac{S_1}{S_2}=\lim_{\theta\to\pi-}\frac{3}{3-2\cos\theta}=\frac35$이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: |
        $S_1=3\sin\theta$, $S_2=(3-2\cos\theta)\sin\theta$의 식을 올바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        극한값 $\dfrac35$를 올바르게 계산했다.
      depends_on: [1-1.M1]
      steps: [1-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    (2) (12점) $\dfrac{\pi}{6}\le\theta\le\dfrac{5\pi}{6}$인 $\theta$에 대하여 $R$이 최솟값을 가질 때 $\sin\theta$의 값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: 'sqrt(5)/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: $R=\dfrac{\sqrt{13-12\cos\theta}}{2\sin\theta}$, $\dfrac{dR}{d\theta}$의 부호는 $(2\cos\theta-3)(3\cos\theta-2)$.
    steps:
    - id: 1-2a
      content: |
        $\cos\theta=\dfrac23$에서 최소, $\sin\theta=\dfrac{\sqrt5}{3}$.
      criteria: ['1-2.B1', '1-2.M1', '1-2.A1']
    hint_ladder:
    - 코사인법칙으로 $\overline{\mathrm{AP}}$를 구하고 사인법칙으로 $R$을 쓰자.
  - id: S1-2-B
    audience: B
    source_flow: 채점기준 p.2
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        $b=\overline{\mathrm{AP}}$라 하자. 코사인 법칙에 의하여 $b^2=3^2+2^2-2\cdot3\cdot2\cdot\cos\theta=13-12\cos\theta$이고,
      criteria: ['1-2.B1']
    - id: 1-2b-2
      content: |
        사인 법칙에 의하여 $\dfrac{b}{\sin\theta}=2R$, 즉 $R=\dfrac{\sqrt{13-12\cos\theta}}{2\sin\theta}$이다.
      criteria: ['1-2.M1']
    - id: 1-2b-3
      content: |
        따라서
        $$\frac{dR}{d\theta}=\frac12\cdot\frac{\frac{12\sin\theta}{2\sqrt{13-12\cos\theta}}\sin\theta-\sqrt{13-12\cos\theta}\cos\theta}{\sin^2\theta}=\frac12\cdot\frac{6\sin^2\theta-(13-12\cos\theta)\cos\theta}{\sin^2\theta\sqrt{13-12\cos\theta}}=\frac{6\cos^2\theta-13\cos\theta+6}{2\sin^2\theta\sqrt{13-12\cos\theta}}=\frac{(2\cos\theta-3)(3\cos\theta-2)}{2\sin^2\theta\sqrt{13-12\cos\theta}}$$
        이다. 이로부터 $R$은 $\cos\theta=\dfrac23$일 때 최솟값을 가짐을 알 수 있다. 그러므로 $\sin\theta=\dfrac{\sqrt5}{3}$이다.
      criteria: ['1-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.B1
      mark_type: B
      points: 3
      evidence: |
        $b=\overline{\mathrm{AP}}$의 길이 $\sqrt{13-12\cos\theta}$를 올바르게 구했다.
      depends_on: []
      steps: [1-2b-1]
    - id: 1-2.M1
      mark_type: M
      points: 3
      evidence: |
        $R=\dfrac{\sqrt{13-12\cos\theta}}{2\sin\theta}$의 식을 올바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-2]
    - id: 1-2.A1
      mark_type: A
      points: 6
      evidence: |
        $R$이 최솟값을 가질 때의 $\sin\theta=\dfrac{\sqrt5}{3}$를 올바르게 구했다.
      depends_on: [1-2.M1]
      steps: [1-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-1'
  stem: |
    [문제 1-2] (30점) 제시문 (나)에 관한 물음에 답하시오.

    (1) (8점) $\cos t_0$의 값을 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '1/sqrt(10)', equivalents: ['sqrt(10)/10'], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: 접할 때 $\mathrm{OA}\perp\mathrm{AB}$이므로 직각삼각형 $\mathrm{OAB}$에서 $\overline{\mathrm{OB}}=\sqrt{10}$.
    steps:
    - id: 2-1a
      content: |
        $\cos t_0=\dfrac{1}{\sqrt{10}}$.
      criteria: ['2-1.R1', '2-1.B1', '2-1.A1']
    hint_ladder:
    - 원의 접선과 접점을 지나는 반지름의 관계는?
  - id: S2-1-B
    audience: B
    source_flow: 채점기준 p.3
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        직선 $\mathrm{AB}$가 원에 접할 때 두 직선 $\mathrm{OA}$와 $\mathrm{AB}$는 수직이다. 즉, 삼각형 $\mathrm{OAB}$는 직각삼각형이다.
      criteria: ['2-1.R1']
    - id: 2-1b-2
      content: |
        피타고라스 정리로부터 빗변 $\mathrm{OB}$의 길이는 $\sqrt{10}$이다.
      criteria: ['2-1.B1']
    - id: 2-1b-3
      content: |
        따라서 $\cos t_0=\dfrac{1}{\sqrt{10}}$임을 알 수 있다.
        [그림: 원점 $\mathrm{O}$, 단위원 위의 점 $\mathrm{A}$에서 직각, 빗변 $\mathrm{OB}$, 각 $t_0$]
      criteria: ['2-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.R1
      mark_type: R
      points: 3
      evidence: |
        삼각형 $\mathrm{OAB}$가 직각삼각형임을 관찰했다.
      depends_on: []
      steps: [2-1b-1]
    - id: 2-1.B1
      mark_type: B
      points: 2
      evidence: |
        $\mathrm{OB}$의 길이 $\sqrt{10}$을 올바르게 구했다.
      depends_on: []
      steps: [2-1b-2]
    - id: 2-1.A1
      mark_type: A
      points: 3
      evidence: |
        $\cos t_0=\dfrac{1}{\sqrt{10}}$을 올바르게 구했다.
      depends_on: [2-1.R1]
      steps: [2-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-2'
  stem: |
    (2) (12점) $f^{\prime}(t_0)$의 값을 구하시오.
  points: 12
  depends_on: ['2-1']
  answer: {kind: value, value: '-4*sqrt(10)/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}$는 반지름 $2$인 두 원의 교점이므로 $x=\dfrac{\alpha+4}{2}$이고 $f=8x-12=4\left(\cos t+\sqrt{9-\sin^2t}\right)$.
    steps:
    - id: 2-2a
      content: |
        $f^{\prime}(t_0)=-4\cdot\dfrac{3}{\sqrt{10}}\left(1+\dfrac19\right)=-\dfrac{4\sqrt{10}}{3}$.
      criteria: ['2-2.B1', '2-2.B2', '2-2.M1', '2-2.A1']
    hint_ladder:
    - 점 $\mathrm{B}$의 $x$좌표 $\alpha$를 $t$로 나타내자.
  - id: S2-2-B
    audience: B
    source_flow: 채점기준 p.3
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        시각 $t$일 때 점 $\mathrm{B}$의 $x$좌표는 $\alpha=\cos t+\sqrt{9-\sin^2t}$이고,
      criteria: ['2-2.B1']
    - id: 2-2b-2
      content: |
        점 $\mathrm{P}$는 원 $(x-4)^2+y^2=4$와 원 $(x-\alpha)^2+y^2=4$의 교점이다. 따라서 점 $\mathrm{P}$의 $x$좌표는 $\dfrac{\alpha+4}{2}$이다.
      criteria: ['2-2.B2']
    - id: 2-2b-3
      content: |
        점 $\mathrm{P}$는 원 $C_2$ 위의 점이므로 $f(t)=x^2+y^2=8x-12=4\alpha+4=4\left(\cos t+\sqrt{9-\sin^2t}\right)$이고
      criteria: ['2-2.M1']
    - id: 2-2b-4
      content: |
        $f^{\prime}(t)=-4\sin t-\dfrac{4\sin t\cos t}{\sqrt{9-\sin^2t}}$이다. [문제 1-2] (1)로부터 $\cos t_0=\dfrac{1}{\sqrt{10}}$, $\sin t_0=\dfrac{3}{\sqrt{10}}$이므로
        $$f^{\prime}(t_0)=-4\cdot\frac{3}{\sqrt{10}}\left(1+\frac19\right)=-\frac{4\sqrt{10}}{3}$$
        이다.
      criteria: ['2-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.B1
      mark_type: B
      points: 3
      evidence: |
        시각 $t$일 때 점 $\mathrm{B}$의 $x$좌표 $\cos t+\sqrt{9-\sin^2t}$를 올바르게 구했다.
      depends_on: []
      steps: [2-2b-1]
    - id: 2-2.B2
      mark_type: B
      points: 3
      evidence: |
