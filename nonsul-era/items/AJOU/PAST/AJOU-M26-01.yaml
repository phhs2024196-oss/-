intent: |
  삼각형의 넓이 공식과 삼각비, 코사인법칙·사인법칙으로 길이와 넓이를 각의 함수로 나타내 극한과 최솟값을 구하고, 원과 직선의 접함·두 원의 교점으로 움직이는 점의 좌표를 매개변수 $t$의 함수로 나타내 미분하고 자취의 길이를 구하는 능력을 본다.
key_idea: |
  $R=\dfrac{\sqrt{13-12\cos\theta}}{2\sin\theta}$를 $\theta$로 미분하면 분자가 $(2\cos\theta-3)(3\cos\theta-2)$로 인수분해된다. 점 $\mathrm{P}$는 반지름이 같은 두 원 $C_2$와 ($\mathrm{B}$ 중심) 원의 교점이라 $x$좌표가 두 중심의 중점 $\dfrac{\alpha+4}{2}$이다.
stuck: |
  [문제 1-2](2)에서 $\mathrm{P}$의 $x$좌표를 두 원의 교점(중점)으로 잡아 $f(t)=x^2+y^2=8x-12$로 바꾸는 단계
