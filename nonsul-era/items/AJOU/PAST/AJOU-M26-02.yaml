stimuli:
- label: 가
  body: |
    정적분의 치환적분법 $\displaystyle\int_a^bf(g(x))g^{\prime}(x)dx=\int_{g(a)}^{g(b)}f(u)du$은 정적분과 급수의 합 사이의 관계를 통해 이해할 수 있다. 닫힌구간 $[0,c]$에서 $y=f(g(x))g^{\prime}(x)>0$이라 하고, 도형의 넓이 $S=\displaystyle\int_0^cf(g(x))g^{\prime}(x)dx$를 급수의 합으로 구해 보자. 구간 $[0,c]$를 $n$ 등분한 후, 각 소구간의 길이 $\dfrac cn$를 밑변으로 하고 각 소구간의 오른쪽 끝점에서의 $y$의 값을 높이로 하는 직사각형의 넓이의 합을 $R_n$이라 하자. 그러면 $R_n=\dfrac cn\displaystyle\sum_{k=1}^{n}f\left(g\left(\frac{kc}{n}\right)\right)g^{\prime}\left(\frac{kc}{n}\right)$이다. 이때, $k$번째 소구간에서의 직사각형은 밑변의 길이가 $\dfrac cn$이고 높이가 $f\left(g\left(\dfrac{kc}{n}\right)\right)g^{\prime}\left(\dfrac{kc}{n}\right)$이다. 이 직사각형을 밑변의 길이가 $\dfrac cng^{\prime}\left(\dfrac{kc}{n}\right)$이고 높이가 $f\left(g\left(\dfrac{kc}{n}\right)\right)$인 직사각형으로 변환한 것을 '변환 직사각형'이라 하자. 각 소구간에 대한 '변환 직사각형'을 직선 $x=g(0)$의 오른쪽으로 밑변이 $x$축 위에 놓이도록 차례로 붙였을 때, 맨 마지막 직사각형의 오른쪽 변의 $x$좌표를 $a_n$이라 하자. 이때 첫 번째 '변환 직사각형'의 왼쪽 변은 $x=g(0)$에 놓인다. [그림 4]는 닫힌구간 $[0,2]$에서 $f(x)=\sin x$, $g(x)=\dfrac{x^2}{2}$일 때 $R_4$의 직사각형들을 나타내고, [그림 5]는 $R_4$의 각 직사각형에 대응하는 '변환 직사각형'과 $a_4(=2.5)$를 나타낸다.

    [그림 4: 곡선 $y=x\sin\dfrac{x^2}{2}$($0\le x\le2$, 높이 최대 약 $2$)와 오른쪽 끝점 높이의 직사각형 4개(밑변 $0.5$)]
    [그림 5: 곡선 $y=\sin x$와 변환 직사각형 4개(높이 $\le1$, 밑변이 점점 넓어짐), 마지막 오른쪽 변 $a_4=2.5$]
- label: 나
  body: |
    치환적분법을 이용하면 함수의 그래프가 원점에 대하여 대칭인 함수에 대한 간단한 적분 공식을 구할 수 있다. 함수 $f(x)$의 그래프가 원점에 대하여 대칭이라고 하자. 즉 $f(-x)=-f(x)$라고 하자. $x=-t$로 놓으면 치환적분법에 의하여 다음을 얻는다.
    $$\int_{-a}^0f(x)dx=\int_a^0f(-t)(-1)dt=\int_a^0f(t)dt=-\int_0^af(t)dt$$
    따라서
    $$\int_{-a}^af(x)dx=\int_{-a}^0f(x)dx+\int_0^af(x)dx=-\int_0^af(x)dx+\int_0^af(x)dx=0$$
    이다. 함수 $f(x)$의 그래프가 $y$축에 대하여 대칭일 때, 즉 $f(-x)=f(x)$이면 치환적분법을 이용하여
    $$\int_{-a}^af(x)dx=2\int_0^af(x)dx$$
    를 얻을 수 있다.
    한편, 모든 연속함수 $f(x)$에 대하여 $g(x)=f(x)-f(-x)$라 하면 $g(-x)=-g(x)$이므로 함수 $g(x)$의 그래프는 원점에 대하여 대칭이고, $h(x)=f(x)+f(-x)$라 하면 $h(-x)=h(x)$이므로 함수 $h(x)$의 그래프는 $y$축에 대하여 대칭이다. 이를 이용하면 함수 $f(x)$는 함수의 그래프가 원점에 대하여 대칭인 함수 $f_O$와 함수의 그래프가 $y$축에 대하여 대칭인 함수 $f_E$의 합으로 나타낼 수 있다. 즉, $f(x)=f_O(x)+f_E(x)$이며, $f_O$와 $f_E$는 유일하게 결정된다.

stem: |
  [문항 2] 【제시문】을 읽고 물음에 답하시오.

subparts:
- id: '1-1'
  stem: |
    [문제 2-1] (30점) 닫힌 구간 $[0,2]$에서 $f(x)=\sin x$, $g(x)=\dfrac{x^2}{2}$, 도형의 넓이 $S=\displaystyle\int_0^2x\sin\frac{x^2}{2}dx$에 대하여, 제시문 (가)에 관한 물음에 답하시오.

    (1) (10점) $a_7$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '16/7', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: 변환 직사각형의 밑변은 $\dfrac2n\cdot\dfrac{2k}{n}$이고 $g(0)=0$이므로 $a_n=\displaystyle\sum_{k=1}^n\frac{4k}{n^2}=\frac{2(n+1)}{n}$.
    steps:
    - id: 1-1a
      content: |
        $a_7=\dfrac{16}{7}$.
      criteria: ['1-1.B1', '1-1.M1', '1-1.A1']
    hint_ladder:
    - $g^{\prime}(x)=x$이다.
  - id: S1-1-B
    audience: B
    source_flow: 채점기준 p.4
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        닫힌구간 $[0,2]$를 $n$ 등분하면 각 소구간의 길이는 $\dfrac2n$이고 각 소구간의 오른쪽 끝점의 $y$의 값은 $\dfrac{2k}{n}\sin\dfrac{2k^2}{n^2}$이다.
      criteria: ['1-1.B1']
    - id: 1-1b-2
      content: |
        각 소구간의 직사각형에 대한 '변환 직사각형'의 밑변의 길이는 $\dfrac2n\cdot\dfrac{2k}{n}$이다. 따라서
        $$a_n=\sum_{k=1}^n\frac2n\cdot\frac{2k}{n}=\frac{4}{n^2}\sum_{k=1}^nk=\frac4{n^2}\cdot\frac{n(n+1)}{2}=\frac{2(n+1)}{n}$$
        이다.
      criteria: ['1-1.M1']
    - id: 1-1b-3
      content: |
        그러므로 $a_7=\dfrac{2(7+1)}{7}=\dfrac{16}{7}$이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
