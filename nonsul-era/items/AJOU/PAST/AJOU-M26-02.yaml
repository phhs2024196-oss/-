- id: '1-3'
  stem: |
    (3) (12점) $\displaystyle\sum_{n=2}^{2026}\frac{a_n}{n^2-1}$의 값을 구하시오.
  points: 12
  depends_on: ['1-1']
  answer: {kind: value, value: '2025/1013', equivalents: [], tolerance: null}   # 공식 채점기준 표기 2025/1023(=675/341)은 산술 오기 — 독립 에이전트 2곳 교차검증(2026-11-22) 후 정정
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{a_n}{n^2-1}=\dfrac{2}{n(n-1)}=2\left(\dfrac1{n-1}-\dfrac1n\right)$로 망원 합.
    steps:
    - id: 1-3a
      content: |
        $2\left(1-\dfrac1{2026}\right)$.
      criteria: ['1-3.M1', '1-3.M2', '1-3.A1']
    hint_ladder:
    - $n^2-1=(n-1)(n+1)$로 약분해 보자.
  - id: S1-3-B
    audience: B
    source_flow: 채점기준 p.4
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        [문제 2-1]의 (1)의 풀이에서 구한 $a_n$을 이용하면
        $$\sum_{n=2}^{2026}\frac{a_n}{n^2-1}=\sum_{n=2}^{2026}\frac{2(n+1)}{n(n^2-1)}=2\sum_{n=2}^{2026}\frac{1}{n(n-1)}\quad\cdots㉮$$
      criteria: ['1-3.M1']
    - id: 1-3b-2
      content: |
        $$=2\sum_{n=2}^{2026}\left(\frac1{n-1}-\frac1n\right)\quad\cdots㉯$$
      criteria: ['1-3.M2']
    - id: 1-3b-3
      content: |
        $$=2\left\{\left(1-\frac12\right)+\left(\frac12-\frac13\right)+\cdots+\left(\frac1{2025}-\frac1{2026}\right)\right\}=2\left(1-\frac1{2026}\right)$$
        공식 채점기준은 이 값을 $\dfrac{2025}{1023}=\dfrac{675}{341}$로 적었다. $2\left(1-\dfrac1{2026}\right)=\dfrac{2\cdot2025}{2026}=\dfrac{2025}{1013}$이므로 공식 답의 분모 $1023$은 $1013$의 오기로 보인다. [판독확인: 공식답 산술 오류 의심]
      criteria: ['1-3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 4
      evidence: |
        ㉮ $2\displaystyle\sum_{n=2}^{2026}\frac{1}{n(n-1)}$까지 올바르게 계산했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1-1.M1], max_points: 4}
      steps: [1-3b-1]
    - id: 1-3.M2
      mark_type: M
      points: 4
      evidence: |
        ㉯ 부분분수 $2\displaystyle\sum\left(\frac1{n-1}-\frac1n\right)$까지 올바르게 계산했다.
      depends_on: [1-3.M1]
      implied_ok: false
      steps: [1-3b-2]
    - id: 1-3.A1
      mark_type: A
      points: 4
      evidence: |
        답을 올바르게 구했다(공식 채점기준 답 $\dfrac{675}{341}$, 독립 계산 $\dfrac{2025}{1013}$ — 사람 확인 필요).
      depends_on: [1-3.M1, 1-3.M2]
      steps: [1-3b-3]
    deductions: []
