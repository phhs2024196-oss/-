- id: '2-1'
  stem: |
    [문제 2-2] (20점) 제시문 (나)에 관한 물음에 답하시오.

    (1) (12점) $f(x)=\dfrac{\cos x}{1+\sec x+\tan x}$일 때, $\displaystyle\int_{-\frac{\pi}{3}}^{\frac{\pi}{3}}f(x)dx$의 값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: 'sqrt(3)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: 기함수 부분은 적분이 $0$, 우함수 부분 $f_E=\dfrac{\cos x}{2}$.
    steps:
    - id: 2-1a
      content: |
        $\displaystyle2\int_0^{\frac{\pi}{3}}\frac{\cos x}{2}dx=\frac{\sqrt3}{2}$.
      criteria: ['2-1.R1', '2-1.M1', '2-1.A1']
    hint_ladder:
    - $f(x)+f(-x)$를 통분해 보자.
  - id: S2-1-B
    audience: B
    source_flow: 채점기준 p.5
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        $f_O(x)=\dfrac{f(x)-f(-x)}{2}$, $f_E(x)=\dfrac{f(x)+f(-x)}{2}$라 하면 $f_O(-x)=-f_O(x)$, $f_E(-x)=f_E(x)$이고 $f(x)=f_O(x)+f_E(x)$를 만족한다. 제시문 (나)의 대칭인 함수에 관한 적분 공식을 이용하면
        $$\int_{-\frac{\pi}{3}}^{\frac{\pi}{3}}f(x)dx=\int_{-\frac{\pi}{3}}^{\frac{\pi}{3}}f_O(x)dx+\int_{-\frac{\pi}{3}}^{\frac{\pi}{3}}f_E(x)dx=2\int_0^{\frac{\pi}{3}}f_E(x)dx$$
        이다.
      criteria: ['2-1.R1']
    - id: 2-1b-2
      content: |
        $$f_E(x)=\frac{f(x)+f(-x)}{2}=\frac12\left(\frac{\cos x}{1+\sec x+\tan x}+\frac{\cos x}{1+\sec x-\tan x}\right)=\frac12\cdot\frac{2\cos x(1+\sec x)}{(1+\sec x+\tan x)(1+\sec x-\tan x)}=\frac{\cos x(1+\sec x)}{1+2\sec x+\sec^2x-\tan^2x}=\frac{\cos x(1+\sec x)}{2(1+\sec x)}=\frac{\cos x}{2}$$
        이므로
      criteria: ['2-1.M1']
    - id: 2-1b-3
      content: |
        $$\int_{-\frac{\pi}{3}}^{\frac{\pi}{3}}f(x)dx=2\int_0^{\frac{\pi}{3}}f_E(x)dx=\int_0^{\frac{\pi}{3}}\cos x\,dx=[\sin x]_0^{\pi/3}=\frac{\sqrt3}{2}$$
        이다.
      criteria: ['2-1.A1']
