- id: '2-2'
  stem: |
    (2) (8점) $f(x)=\dfrac{\cos x}{1+\sec x+\tan x}$일 때, $1$ 이상의 실수 $t$에 대하여 $g(t)=\displaystyle\int_{-\frac{\pi}{3}}^{\frac{\pi}{3}}f\left(\frac{x}{3^{t-1}}\right)dx$라 하자. $\displaystyle\lim_{t\to\infty}g(t)$를 조사하시오.
  points: 8
  depends_on: ['2-1']
  answer: {kind: value, value: 'pi/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: (1)과 같이 우함수 부분만 남아 $g(t)=3^{t-1}\sin\dfrac{\pi}{3^t}$.
    steps:
    - id: 2-2a
      content: |
        $\displaystyle\lim_{t\to\infty}g(t)=\frac{\pi}{3}\lim_{a\to0}\frac{\sin a}{a}=\frac{\pi}{3}$.
      criteria: ['2-2.M1', '2-2.A1']
    hint_ladder:
    - $x\mapsto\dfrac{x}{3^{t-1}}$로 바꿔도 기함수·우함수 성질은 유지된다.
  - id: S2-2-B
    audience: B
    source_flow: 채점기준 p.5
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        [문제 2-2]의 (1)의 풀이를 이용하면
        $$g(t)=\int_{-\frac{\pi}{3}}^{\frac{\pi}{3}}f\left(\frac{x}{3^{t-1}}\right)dx=\int_{-\frac{\pi}{3}}^{\frac{\pi}{3}}f_O\left(\frac{x}{3^{t-1}}\right)dx+\int_{-\frac{\pi}{3}}^{\frac{\pi}{3}}f_E\left(\frac{x}{3^{t-1}}\right)dx=2\int_0^{\frac{\pi}{3}}f_E\left(\frac{x}{3^{t-1}}\right)dx=\int_0^{\frac{\pi}{3}}\cos\frac{x}{3^{t-1}}dx=3^{t-1}\sin\frac{\pi}{3^t}$$
        이다.
      criteria: ['2-2.M1']
    - id: 2-2b-2
      content: |
        따라서
        $$\lim_{t\to\infty}g(t)=\lim_{t\to\infty}3^{t-1}\sin\frac{\pi}{3^t}=\lim_{t\to\infty}\frac{\pi}{3}\cdot\frac{\sin\frac{\pi}{3^t}}{\frac{\pi}{3^t}}=\frac{\pi}{3}\lim_{a\to0}\frac{\sin a}{a}=\frac{\pi}{3}$$
        이다.
      criteria: ['2-2.A1']
