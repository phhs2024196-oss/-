intent: |
  지수함수가 곱해진 함수의 도함수·이계도함수로 변곡점과 최댓값을 찾고, 볼록성으로 곡선 아래 넓이를 다각형 넓이로 아래에서 어림해 수열의 발산을 판정하는 능력, 그리고 조합으로 센 경우의 수의 비를 1보다 작은 분수의 곱으로 정리해 부등식으로 묶고 $e$의 정의로 극한을 구하는 능력을 본다.
key_idea: |
  위로 볼록한 구간에서 할선(현)은 곡선 아래, 아래로 볼록한 구간에서 접선은 곡선 아래에 있으므로 넓이를 오각형·삼각형 넓이로 아래에서 누른다. $\dfrac{p_n}{q_n}$은 $2l$개의 분수의 곱이므로 가장 작은·큰 인수의 거듭제곱으로 샌드위치한다.
stuck: |
  $S_n\ge f(c_n)\sqrt n=\left(\dfrac ne\right)^n\sqrt n$처럼 한 항만 남겨 발산을 보이는 발상, 그리고 $\dfrac{p_n}{q_n}$을 $\dfrac{a+1-b}{a+1}\ge\dfrac{a-b}{a}$로 묶어 $\left(1\pm\dfrac1l\right)^{2l}$ 꼴로 만드는 단계
idea_tags: [IDEA-CONCAVE-CHORD-BELOW, IDEA-CONVEX-TANGENT-BELOW, IDEA-PRODUCT-SQUEEZE-E-LIMIT]
tags: [변곡점, 볼록성, 수열의 발산, 이항계수 비, e의 정의]
