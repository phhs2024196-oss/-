- id: '2-2'
  stem: |
    (2) (10점) [문제 2-2]의 (1)을 만족하는 정수 $p$의 최솟값에 대하여, $\ell=1$일 때 '$S$의 덮개'에 포함되는 한 변의 길이가 $\ell$인 정사각형의 개수를 구하시오.
  points: 10
  depends_on: ['2-1']
  answer: {kind: value, value: '295', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $p=3$, $h$를 구한 뒤 칸 $[i,i+1]$마다 $39-\min(h(i),h(i+1))$개를 더한다.
    steps:
    - {id: 2-2a, content: '$11\times39-(10+15+20+20+15+10+5+0+0+13+26)=295$', criteria: ['2-2.M1', '2-2.M2', '2-2.A1']}
    hint_ladder:
    - 먼저 $p=3$일 때 점 A, E의 좌표와 $h(x)$를 구하자.
    - 폭 1인 세로 띠 하나에 덮개 정사각형이 몇 개 있는가?
  - id: S2-2-B
    audience: B
    source_flow: 채점기준 p.7
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        [문제 2-2]의 (1)을 만족하는 정수 $p$의 최솟값은 $3$이므로
        $$g(x)=\begin{cases}-(x-3)^2+25 & (-2<x<8)\\ (x-3)^2-25 & (x\le-2\ \text{또는}\ x\ge8)\end{cases}$$
        이다. $g(x)=39$를 만족하는 $x$의 값은 $-5$와 $11$이므로 함수 $y=h(x)$는
        $$h(x)=\begin{cases}-13x-26 & (x<-2)\\ 5x+10 & (-2\le x<3)\\ -5x+40 & (3\le x<8)\\ 13x-104 & (x\ge8)\end{cases}$$
        이다.
      criteria: ['2-2.M1']
    - id: 2-2b-2
      content: |
        '$S$의 덮개'는 제1사분면에 있는 경우를 고려하므로 $0\le x\le11$인 경우를 생각하자. $\ell=1$이므로 각 닫힌구간 $[i,i+1]$ $(i=0,1,\cdots,10)$에서 '$S$의 덮개'에 포함되는 정사각형의 개수를 세면 된다. $0\le x\le11$에서 $h(x)\le39$이므로 닫힌구간 $[i,i+1]$에서 덮개에 포함되는 정사각형의 개수는 $39$에서 덮개에 포함되지 않는 정사각형의 개수를 빼는 것과 같다. 덮개에 포함되지 않는 정사각형의 개수는 $h(i)$와 $h(i+1)$ 중 더 작은 값과 같다. 즉, 함수 $y=g(x)$가 감소하는 구간에서는 구간의 오른쪽 끝에서의 함숫값, 증가하는 구간에서는 왼쪽 끝에서의 함숫값과 같다.
      criteria: ['2-2.M2']
    - id: 2-2b-3
      content: |
        그러므로 개수 $=(39-h(0))+(39-h(1))+(39-h(2))+(39-h(4))+(39-h(5))+(39-h(6))+(39-h(7))+(39-h(8))+(39-h(8))+(39-h(9))+(39-h(10))=295$이다.
        (참고: $h(0),h(1),h(2),h(4),h(5),h(6),h(7),h(8),h(8),h(9),h(10)=10,15,20,20,15,10,5,0,0,13,26$, 합 $134$, $429-134=295$.)
      criteria: ['2-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 3
      evidence: |
        함수 $h(x)$를 올바르게 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2-1.A1], max_points: 3}
      steps: [2-2b-1]
    - id: 2-2.M2
      mark_type: M
      points: 4
      evidence: |
        증가하는 구간과 감소하는 구간에 대해 '$S$의 덮개'에 포함되는 정사각형의 개수(칸마다 $39-\min(h(i),h(i+1))$)를 관찰했다.
      depends_on: []
      implied_ok: false
      steps: [2-2b-2]
    - id: 2-2.A1
      mark_type: A
      points: 3
      evidence: |
        '$S$의 덮개'에 포함되는 정사각형의 개수 $295$를 올바르게 계산했다.
      depends_on: [2-2.M1, 2-2.M2]
      steps: [2-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2-3'
  stem: |
    (3) (12점) [문제 2-2]의 (1)을 만족하는 정수 $p$의 최솟값에 대하여, $\ell=\dfrac1n$일 때 '$S$의 덮개'에 포함되는 한 변의 길이가 $\ell$인 정사각형의 개수를 $d_n$이라 하자. 극한 $\displaystyle\lim_{n\to\infty}\frac{d_n}{n^2}$을 조사하시오. (단, $n$은 자연수)
  points: 12
  depends_on: ['2-2']
  answer: {kind: value, value: '511/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-3-A
    audience: A
    method_no: 1
    key_idea: 칸 폭 $\frac1n$의 세로 띠별 개수를 $n^2$으로 나누면 리만 합 → $\int_0^{11}(39-h(x))\,dx$.
    steps:
    - {id: 2-3a, content: '$\displaystyle\lim_{n\to\infty}\frac{d_n}{n^2}=\int_0^{11}(39-h(x))\,dx=\frac{511}{2}$', criteria: ['2-3.M1', '2-3.M2', '2-3.A1']}
    hint_ladder:
    - 폭 $\frac1n$인 띠 하나에 들어가는 정사각형 개수를 $h$로 나타내 보자.
    - $\dfrac{d_n}{n^2}$은 어떤 정적분의 근사인가?
  - id: S2-3-B
    audience: B
    source_flow: 채점기준 p.7~8
    method_no: 1
    steps:
    - id: 2-3b-1
      content: |
        닫힌구간 $\left[\dfrac{i-1}{n},\dfrac in\right]$에서 '$S$의 덮개'에 포함되는 정사각형의 개수는 함수 $y=h(x)$가 증가할 때 $\left(39-h\left(\dfrac{i-1}{n}\right)\right)\times n$개이고, 감소할 때 $\left(39-h\left(\dfrac in\right)\right)\times n$개다.
      criteria: ['2-3.M1']
    - id: 2-3b-2
      content: |
        닫힌구간 $[0,1]$에서 함수 $y=h(x)$는 증가하므로, 이 구간에서 덮개에 포함되는 정사각형의 개수를 $d_n$이라 하면
        $$\frac{d_n}{n^2}=\frac1{n^2}\sum_{i=1}^{n}\left(39-h\left(\frac{i-1}{n}\right)\right)\times n=\sum_{i=1}^{n}\left(39-h\left(\frac{i-1}{n}\right)\right)\frac1n$$
        이다. 따라서 정적분과 급수와의 관계를 이용하면
        $$\lim_{n\to\infty}\sum_{i=1}^{n}\left(39-h\left(\frac{i-1}{n}\right)\right)\frac1n=\int_0^1(39-h(x))\,dx$$
        이다.
      criteria: ['2-3.M2']
    - id: 2-3b-3
      content: |
        같은 방식으로 닫힌구간 $[1,2]$, $[2,3]$, $\cdots$, $[10,11]$에서 정적분과 급수와의 관계를 이용하면
        $$\lim_{n\to\infty}\frac{d_n}{n^2}=\int_0^{11}(39-h(x))\,dx=\frac{511}{2}$$
        이다. (보충: $\int_0^3(29-5x)\,dx=\frac{129}{2}$, $\int_3^8(5x-1)\,dx=\frac{265}{2}$, $\int_8^{11}(143-13x)\,dx=\frac{117}{2}$, 합 $\frac{511}{2}$.)
      criteria: ['2-3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-3.M1
      mark_type: M
      points: 4
      evidence: |
        증가하는 구간과 감소하는 구간에 대해 '$S$의 덮개'에 포함되는 정사각형의 개수를 관찰했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2-2.M1], max_points: 4}
      steps: [2-3b-1]
    - id: 2-3.M2
      mark_type: M
      points: 4
      evidence: |
        각 구간에서 $\dfrac{d_n}{n^2}$을 리만 합 꼴로 올바르게 계산했다.
      depends_on: [2-3.M1]
      steps: [2-3b-2]
    - id: 2-3.A1
      mark_type: A
      points: 4
      evidence: |
        정적분과 급수와의 관계를 이용하여 극한 $\dfrac{511}{2}$을 올바르게 조사했다.
      depends_on: [2-3.M2]
      steps: [2-3b-3]
    deductions: []
