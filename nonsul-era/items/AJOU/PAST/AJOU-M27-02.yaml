intent: |
  절댓값 형태로 접힌 이차함수의 그래프를 해석해 격자점 개수를 구간별로 세고, 평행이동에 따른 개수 변화를 판단하며, 꺾은선 함수 아래 격자 정사각형 개수를 세어 그 극한을 정적분과 급수의 합의 관계로 구하는 능력을 본다.
key_idea: |
  $a_k$는 $k$가 $g(x)$의 값들 사이 어느 구간에 있는지로만 결정되므로 함숫값을 정렬해 구간별로 센다. 덮개 정사각형 개수는 각 칸 $[i,i+1]$에서 $39-\min h$이고, $\ell=\frac1n$으로 줄이면 리만 합이 되어 $\int(39-h)\,dx$로 수렴한다.
stuck: |
  $\sum a_k$가 최대가 되려면 $0\le x\le20$의 모든 정수점에서 $g(x)>30$이어야 함을 알아차리는 것, 그리고 칸마다 포함되는 정사각형 개수가 증가 구간은 왼쪽 끝, 감소 구간은 오른쪽 끝 함숫값으로 결정된다는 관찰
