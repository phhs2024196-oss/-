stimuli: []

stem: |
  다음과 같은 방식으로 주사위 두 개를 붙여서 새로운 주사위를 만든다.

  - 일반적인 정육면체 모양의 주사위는 서로 마주보고 있는 면의 눈의 수의 합이 항상 7이고 다음 그림과 같이 면이 구성되어 있다.
    [그림: 윗면 2, 앞면 3, 오른쪽 면 1이 보이는 주사위]
  - 위와 같은 모양의 주사위 두 개를 눈의 수가 6인 면끼리 붙여서 직육면체 모양의 주사위 하나를 만든다. 다음은 새롭게 만들 수 있는 주사위 중 한 가지 예시를 보여준다.
    [그림(예시): 윗면 2·앞면 4·오른쪽 면 6이 보이는 주사위 ＋ 윗면 2·앞면 3·오른쪽 면 1이 보이는 주사위 → 윗면에 2와 2, 앞면에 4와 3, 오른쪽 끝면에 1이 보이는 직육면체 주사위]
  - 새로운 주사위 한 면의 눈의 수는 그 면에 있는 모든 눈의 수의 합과 같고, 각 면이 나올 확률은 면적에 비례한다고 가정한다.

  위의 방식에 따라 새롭게 만들 수 있는 모든 종류의 주사위 중 하나를 임의로 선택하여 한 번 던져서 나오는 눈의 수가, 일반적인 정육면체 모양의 주사위를 한 번 던져서 나오는 눈의 수보다 작거나 같을 확률을 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    새롭게 만들 수 있는 모든 종류의 주사위 중 하나를 임의로 선택하여 한 번 던져서 나오는 눈의 수가, 일반적인 정육면체 모양의 주사위를 한 번 던져서 나오는 눈의 수보다 작거나 같을 확률을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac{17}{60}', equivalents: ['17/60', '0.2833', '0.28'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '종류 A~D 의 옆면 눈은 (4,7,10,7), (5,5,9,9), (7,6,7,8), (6,8,8,6), 끝면은 모두 1. 새 눈 1 은 항상 이하(확률 $\dfrac15$), 그 밖에 6 이하인 옆면만 따로 계산.'
    steps:
    - {id: 1a, content: '$\dfrac14\left(\dfrac1{10}+\dfrac15\right)+\dfrac14\left(\dfrac2{15}+\dfrac15\right)+\dfrac14\left(\dfrac1{30}+\dfrac15\right)+\dfrac14\left(\dfrac1{15}+\dfrac15\right)=\dfrac{17}{60}$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - 6과 마주보는 면은 1이다. 붙인 주사위의 두 끝면은 무엇인가?
    - 6을 아래로 두면 옆면은 2, 3, 5, 4 순서로 돈다. 두 번째 주사위를 돌려 붙이는 방법은 몇 가지인가?
    - 옆면 하나의 넓이는 끝면의 2배다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.68~69 예시답안
    steps:
    - id: 1b-1
      content: |
        새롭게 만들 수 있는 직육면체 모양의 주사위는 다음과 같이 4가지 형태 중 하나를 가지게 된다(원문은 주사위 A, B, C, D 그림).
      criteria: [1.B1]
    - id: 1b-2
      content: |
        새로운 주사위에서 눈이 나오는 경우와 확률은 다음과 같다. (단, $(a,b)$는 일반적인 주사위 두 개에서 나오는 각각의 눈의 수를 의미한다.)

        | 주사위 | 옆면 $(a,b)$ → 새로운 눈의 수 (각 확률 $\frac15$) | 끝면 (각 확률 $\frac1{10}$) |
        |---|---|---|
        | A | $(2,2)\to4$, $(4,3)\to7$, $(5,5)\to10$, $(3,4)\to7$ | 1, 1 |
        | B | $(3,2)\to5$, $(2,3)\to5$, $(4,5)\to9$, $(5,4)\to9$ | 1, 1 |
        | C | $(5,2)\to7$, $(3,3)\to6$, $(2,5)\to7$, $(4,4)\to8$ | 1, 1 |
        | D | $(4,2)\to6$, $(5,3)\to8$, $(3,5)\to8$, $(2,4)\to6$ | 1, 1 |
      criteria: [1.B2]
    - id: 1b-3
      content: |
        새로운 주사위 중 하나를 한 번 던져서 나오는 눈의 수가 정육면체 모양의 일반적인 주사위를 한 번 던져서 나오는 눈의 수보다 작거나 같은 경우는 다음과 같다.

        | 주사위 | 새 눈 | 일반 주사위 | 확률 |
        |---|---|---|---|
        | A | 4 | (4,5,6) | $\frac15\times\frac12=\frac1{10}$ |
        | A | 1 | 모든 눈 | $\frac15\times1=\frac15$ |
        | B | 5 | (5,6) | $\frac25\times\frac13=\frac2{15}$ |
        | B | 1 | 모든 눈 | $\frac15\times1=\frac15$ |
        | C | 6 | 6 | $\frac15\times\frac16=\frac1{30}$ |
        | C | 1 | 모든 눈 | $\frac15\times1=\frac15$ |
        | D | 6 | 6 | $\frac25\times\frac16=\frac1{15}$ |
        | D | 1 | 모든 눈 | $\frac15\times1=\frac15$ |
      criteria: [1.B3]
    - id: 1b-4
      content: |
        위의 표를 바탕으로 주어진 확률을 계산하면 다음과 같다.
        $$\frac14\left(\frac1{10}+\frac15\right)+\frac14\left(\frac2{15}+\frac15\right)+\frac14\left(\frac1{30}+\frac15\right)+\frac14\left(\frac1{15}+\frac15\right)=\frac14\left(\frac3{10}+\frac13+\frac7{30}+\frac4{15}\right)=\frac{17}{60}$$
        또는 0.2833(소수점 아래 둘째 자리에서 반올림 가능)
      criteria: [1.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
