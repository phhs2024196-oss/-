      evidence: 각 주사위의 눈이 나오는 경우의 수와 그에 해당하는 확률(옆면 $\dfrac15$, 끝면 $\dfrac1{10}$)을 올바르게 계산했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: 새로운 주사위에서 나오는 눈의 수가 일반적인 주사위에서 나오는 눈의 수보다 작거나 같은 경우를 올바르게 찾아냈다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B4
      mark_type: B
      points: 4
      evidence: 확률의 곱셈정리와 덧셈정리를 사용하여 확률 $\dfrac{17}{60}$ 을 올바르게 계산했다.
      depends_on: []
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 총점 20점 이내에서 ±1점(공식 채점기준 주석). 계산 실수로 틀렸어도 논리 전개 과정이 맞으면 해당 부분에 1~2점 부분 점수
      effect: minus
      value: 1
