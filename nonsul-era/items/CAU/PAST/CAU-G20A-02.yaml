intent: 로그적분을 포함한 치환적분을 이해하고 적분으로 나온 함수의 최댓값을 미분으로 구하는지(2-1), 함수의 극한을 이해하고 그로부터 나온 곡선 위에서 식의 최댓값·최솟값을 미분으로 구하는지(2-2) 평가한다(가이드북 출제 의도 요지).
key_idea: '(2-1) $-\int_1^x\frac{g''}{g}dt=-\ln g(x)+\ln g(1)$ 이므로 $f=\frac{g(1)}{g(x)}$, $h(x)=\frac13(f^2+1)^{3/2}-\frac13(f(1)^2+1)^{3/2}$ 는 $f$ 의 증가함수. (2-2) $a\neq2$ 이면 $b=\frac1{a-1}$, $a=2$ 이면 $0/0$ 꼴로 $b=5$.'
stuck: (2-1) $f f'\sqrt{f^2+1}$ 을 $\frac13(f^2+1)^{3/2}$ 의 도함수로 보는 단계 / (2-2) 분모가 0이 되는 $a=2$ 를 따로 조사하는 단계
idea_tags: [IDEA-LOG-DERIV-INTEGRAL, IDEA-MONOTONE-COMPOSITION-MAX, IDEA-SPECIAL-PARAM-ZERO-DENOM]
tags: [치환적분, 로그미분, 최댓값, 함수의 극한, 최솟값, 중앙대 실전]
elements:
  materials:
  - '$g(t)=e^{t^2}\left(t^2+3t+\frac52\right)$ 와 $f(x)=e^{-\int_1^x\frac{g''(t)}{g(t)}dt}$'
  - '$h(x)=\int_1^x f(t)f''(t)\sqrt{\{f(t)\}^2+1}\,dt$'
  - '극한식 $\lim_{x\to1}\frac{x^3+x^2-a}{(a-x)(x+1-a)}=b$, 범위 $\frac32\le a\le3$'
  concepts: [치환적분법, 로그함수의 미분, 정적분으로 정의된 함수, 최댓값·최솟값, 함수의 극한(0/0 꼴), 접선 조건]
  tools:
  - '$\frac{g''}{g}=(\ln g)''$ 로 적분해 $f=\frac{g(1)}{g(x)}$'
  - '$g(f(x))f''(x)$ 꼴 치환으로 $h$ 의 닫힌식'
  - $g'(x)=e^{x^2}(x+1)(2x^2+4x+3)$ 로 $g$ 의 최솟값
  - 분모가 0이 되는 $a$ 값 분류(0/0 꼴 인수분해)
  - '곡선 $b=\frac1{a-1}$ 과 등고선 $a+b^2=k$ 의 접점(또는 $f(b)=b^2+\frac1b+1$ 의 미분)'
  - 끝점 비교
  conditions:
  - '$g(t)>0$ (판별식 $9-10<0$) ⇒ $\ln g$ 정의, $f>0$'
  - '$h$ 는 $f$ 의 증가함수 ⇒ $h$ 의 최댓값은 $f$ 의 최댓값에서 ⇒ $g$ 의 최솟값에서'
  - '$\frac32\le a\le3$ ⇒ 분모 $(a-1)(2-a)$ 가 0 이 되는 것은 $a=2$ 뿐'
  - '$a\neq2$ ⇒ $\frac32\le a<2,\ 2<a\le3$, 즉 $\frac12\le b<1,\ 1<b\le2$ (양 끝점 포함)'
  stimuli_used: ['1', '2']
  subpart_links:
  - {from: '1', to: '2', relation: 독립(같은 제시문 공유, 결과 이월 없음)}

