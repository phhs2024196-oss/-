stimuli:
- label: '1'
  body: |
    $g(x)=t$로 놓을 때, $g(x)$가 미분 가능하면 $\displaystyle\int f(g(x))g'(x)\,dx=\int f(t)\,dt$이다.
- label: '2'
  body: |
    두 함수 $f(x),\ g(x)$에 대하여 $\displaystyle\lim_{x\to a}f(x)=L$, $\displaystyle\lim_{x\to a}g(x)=M$($L,\ M$은 상수)일 때, 다음이 성립한다.
    $$\lim_{x\to a}\frac{f(x)}{g(x)}=\frac{\lim\limits_{x\to a}f(x)}{\lim\limits_{x\to a}g(x)}=\frac LM\qquad(M\neq0)$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    $g(t)=e^{t^2}\left(t^2+3t+\dfrac52\right)$에 대하여 함수 $f(x)$를 다음과 같이 정의하자.
    $$f(x)=e^{-\int_1^x\frac{g'(t)}{g(t)}dt}$$
    이때 함수 $h(x)=\displaystyle\int_1^x f(t)f'(t)\sqrt{\{f(t)\}^2+1}\,dt$의 최댓값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{170^{\frac32}-2^{\frac32}}{3}', equivalents: ['(170\sqrt{170}-2\sqrt2)/3', '\dfrac{170\sqrt{170}-2\sqrt{2}}{3}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$f=\dfrac{g(1)}{g(x)}$ 이고 $h=\dfrac13(f^2+1)^{3/2}-\dfrac13(f(1)^2+1)^{3/2}$ 는 $f$ 가 클수록 크다. $g$ 는 $x=-1$ 에서 최소.'
    steps:
    - {id: 1a, content: '$f(-1)=\dfrac{g(1)}{g(-1)}=13$, $f(1)=1$ 이므로 최댓값 $h(-1)=\dfrac{170^{\frac32}-2^{\frac32}}{3}$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - $\dfrac{g'(t)}{g(t)}$ 는 어떤 함수의 도함수인가?
    - $f(t)f'(t)\sqrt{f(t)^2+1}$ 은 $\dfrac13(f^2+1)^{\frac32}$ 를 미분한 것이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.70 예시답안
    steps:
    - id: 1b-1
      content: |
        $-\displaystyle\int_1^x\frac{g'(t)}{g(t)}dt=-\int_1^x(\ln g(t))'dt=\ln\frac{g(1)}{g(x)}$이므로 $f(x)=\dfrac{g(1)}{g(x)}$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        그리고 $h(x)=\displaystyle\int_1^x f(t)f'(t)\sqrt{f^2(t)+1}\,dt=\int_1^x\left(\frac13\left(f^2(t)+1\right)^{\frac32}\right)'dt$이므로 $h(x)=\dfrac13\left(f^2(x)+1\right)^{\frac32}-\dfrac13\left(f^2(1)+1\right)^{\frac32}$이고 $h$의 최댓값은 $f$의 최댓값에서 나온다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        그리고 $f(x)$의 최댓값은 $g(x)$의 최솟값에서 얻어진다. 미분하여 정리하면 $g'(x)=e^{x^2}(2x^3+6x^2+7x+3)=e^{x^2}(x+1)(2x^2+4x+3)$이므로 $g(-1)$에서 최솟값을 갖는다. 따라서 $f(x)$의 최댓값은 $\dfrac{g(1)}{g(-1)}=13$이다. $h$의 최댓값은
        $$h(-1)=\frac13\left(f^2(-1)+1\right)^{\frac32}-\frac13\left(f^2(1)+1\right)^{\frac32}=\frac{170^{\frac32}-2^{\frac32}}{3}$$
        이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $f(x)=\dfrac{g(1)}{g(x)}$ 를 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: '$h(x)=\dfrac13\left(f^2(x)+1\right)^{\frac32}-\dfrac13\left(f^2(1)+1\right)^{\frac32}$ 를 얻었다.'
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: '$f(x)$ 의 최댓값 $\dfrac{g(1)}{g(-1)}=13$, $h$ 의 최댓값 $h(-1)=\dfrac{170^{\frac32}-2^{\frac32}}{3}$ 을 얻었다.'
      depends_on: []
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '10', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4109}
  misconceptions:
  - id: MC-CAL-4109
    outcome_code: '70'
    wrong_work: '$h''(x)=f f''\sqrt{f^2+1}=0$ 인 점만 찾아 그 점에서의 피적분함수 값이나 $f$ 의 값을 최댓값으로 답함, 또는 $f(1)=1$ 항을 빼지 않음'
    detect_cue: 답이 13, $\dfrac{170^{3/2}}{3}$, 또는 적분 하한 항이 없음
    feedback: $h$ 는 $\dfrac13(f^2+1)^{\frac32}$ 에서 $x=1$ 일 때의 값을 뺀 것입니다. 최댓값은 $f$ 가 최대인 $x=-1$ 에서의 $h$ 값입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    $\displaystyle\lim_{x\to1}\frac{x^3+x^2-a}{(a-x)(x+1-a)}=b$를 만족하는 실수 $a,\ b$에 대하여, $a+b^2$의 최댓값, 최솟값을 구하시오. (단, $\dfrac32\le a\le3$이다.) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\text{최댓값}\ 27,\ \text{최솟값}\ 1+2^{\frac13}+2^{-\frac23}', equivalents: ['27, 1+\dfrac{3}{2}\sqrt[3]{2}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$a\neq2$ 이면 $b=\dfrac1{a-1}$ 이고 $a+b^2=b^2+\dfrac1b+1$ 의 최솟값은 $b=2^{-\frac13}$ 에서. $a=2$ 이면 $b=5$ 로 $a+b^2=27$.'
    steps:
    - {id: 2a, content: '최솟값 $1+2^{\frac13}+2^{-\frac23}$, 끝점 $\dfrac{11}{2},\ \dfrac{13}{4}$ 와 $(2,5)$ 의 27 비교로 최댓값 27', criteria: [2.B1, 2.B2, 2.B3, 2.B4]}
    hint_ladder:
    - $x=1$ 에서 분모가 0이 되는 $a$ 는? 그때는 분자도 0이어야 한다.
    - $a\neq2$ 이면 그냥 $x=1$ 을 대입할 수 있다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.70 예시답안
    steps:
    - id: 2b-1
      content: |
        $a\neq2$이면 $x=1$에서 분모가 영이 안되므로 $\dfrac{2-a}{(a-1)(2-a)}=\dfrac1{a-1}=b$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $a=2$이면 $\displaystyle\lim_{x\to1}\frac{(x-1)(x^2+2x+2)}{(2-x)(x-1)}=5$이고 $(a,b)=(2,5)$이다.
      criteria: [2.B3]
    - id: 2b-3
      content: |
        $a+b^2=k$로 놓고 $b=\dfrac1{a-1}$ ($\dfrac32\le a<2,\ 2<a\le3$에서 정의된다)와 접점을 구해 보자. 접점에서 만나고 미분계수가 같은 것을 이용하면 $-\dfrac1{2b}=-b^2$이므로 $b=2^{-\frac13}$이다. $\dfrac12\le b<1,\ 1<b\le2$이므로 $b=2^{-\frac13}$는 주어진 곡선의 접점이다. 이때 $a=1+2^{\frac13}$이므로 $1+2^{\frac13}+2^{-\frac23}$이다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        곡선의 양 끝점 $\left(\dfrac32,2\right),\ \left(3,\dfrac12\right)$에서 각각 $a+b^2=\dfrac{11}2,\ \dfrac{13}4$이다. $(a,b)=(2,5)$에서 27이다. 따라서 최솟값은 $1+2^{\frac13}+2^{-\frac23}$이고 최댓값은 27이다.
      criteria: [2.B2, 2.B4]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 2021 논술가이드북(자연) p.70~71 별해
    key_idea: $a=\dfrac1b+1$ 을 대입해 $b$ 의 함수 $f(b)=b^2+\dfrac1b+1$ 을 미분한다.
    steps:
    - id: 2c-1
      content: |
        $a\neq2$이면 $x=1$에서 분모가 0이 아니므로 $\dfrac{2-a}{(a-1)(2-a)}=\dfrac1{a-1}=b$이다. $a=2$이면 $\displaystyle\lim_{x\to1}\frac{(x-1)(x^2+2x+2)}{(2-x)(x-1)}=5$이고 $(a,b)=(2,5)$이다.
      criteria: [2.B1, 2.B3]
    - id: 2c-2
      content: |
        $\dfrac12\le b<1,\ 1<b\le2$에서 $a=\dfrac1b+1$이므로 $f(b)=b^2+\dfrac1b+1$을 고려하자. $f'(b)=2b-\dfrac1{b^2}$이고 $b=2^{-\frac13}$에서 극점을 갖고 $1+2^{\frac13}+2^{-\frac23}$이다. 곡선의 양 끝점 $2,\ \dfrac12$에서 각각 $\dfrac{11}2,\ \dfrac{13}4$이다. $(a,b)=(2,5)$에서 27이다. 따라서 최솟값은 $1+2^{\frac13}+2^{-\frac23}$이고 최댓값은 27이다.
      criteria: [2.B2, 2.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: '$a\neq2$ 이면 $\dfrac{2-a}{(a-1)(2-a)}=\dfrac1{a-1}=b$ 임을 적었다.'
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 7
      evidence: 최솟값 $1+2^{\frac13}+2^{-\frac23}$ 을 구했다.
      depends_on: []
      steps: [2b-3, 2b-4]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: $a=2$ 이면 $(a,b)=(2,5)$ 임을 구했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B4
      mark_type: B
      points: 2
      evidence: 최댓값 27 을 구했다.
      depends_on: []
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '15', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4110}
  misconceptions:
  - id: MC-CAL-4110
    outcome_code: '70'
    wrong_work: '모든 $a$ 에 대해 $b=\dfrac1{a-1}$ 로 두고 $a=2$ 인 경우를 빠뜨려 최댓값을 $\dfrac{11}{2}$ 로 답함'
    detect_cue: 최댓값이 $\dfrac{11}2$, $(a,b)=(2,5)$ 가 없음
    feedback: '$a=2$ 이면 $x=1$ 에서 분모가 0 이 되지만 분자도 0 이라 극한이 존재합니다($b=5$). 이 점을 따로 조사해야 합니다.'
    remedy: [RL-2]

