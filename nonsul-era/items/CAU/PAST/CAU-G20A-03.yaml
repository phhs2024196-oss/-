elements:
  materials:
  - '$x\ge0$ 에서 두 곡선 $y=e^x$, $y=a\sin x$ ($a>0$) 와 $y$ 축'
  - '구 $S:(x-1)^2+(y-1)^2+(z-1)^2=1$'
  - '좌표축 위의 점 $\mathrm{P}(a,0,0),\ \mathrm{Q}(0,2a,0),\ \mathrm{R}(0,0,b)$ ($a>3,\ b>0$), 원점과 P, Q, R 을 꼭짓점으로 하는 삼각뿔'
  concepts: [두 곡선이 접할 조건, 두 곡선 사이의 넓이, 평면의 방정식, 점과 평면 사이의 거리, 삼각뿔의 부피, 도함수와 최솟값, 인수분해]
  tools:
  - 'e^x 가 증가함수라 교점의 $x$ 좌표가 $\frac\pi2$ 이하임을 그래프로 판단'
  - '$f(x)=e^x-a\sin x$ 에서 $f(\alpha)=f''(\alpha)=0$'
  - '$\int_0^{\pi/4}(e^x-\sqrt2e^{\pi/4}\sin x)\,dx$'
  - '평면 $\alpha x+\beta y+\gamma z=1$ 과 점과 평면 사이의 거리 공식'
  - '$V(a)=\frac13\cdot\frac{a\cdot2a}2\cdot b$ 를 $a$ 의 유리함수로'
  - '$V''(a)$ 의 분자 인수분해 $a^2(a-1)(4a^2-17a+9)$'
  conditions:
  - '두 곡선이 $x\ge0$ 에서 오직 한 점에서 만남 ⇒ $e^x\ge a\sin x$ 이고 한 점에서 접함 ⇒ $\cos\alpha=\sin\alpha$, $\alpha=\frac\pi4$'
  - '삼각형 PQR 이 구 $S$ 와 접함 ⇒ 평면 PQR 과 중심 $(1,1,1)$ 사이 거리 = 반지름 1'
  - '$a>3$ ⇒ $V''(a)=0$ 의 근 중 $a=\frac{17+\sqrt{145}}8$ 만 해당'
  stimuli_used: ['1', '2']
  subpart_links:
  - {from: '1', to: '2', relation: 독립(같은 제시문 공유, 결과 이월 없음)}

