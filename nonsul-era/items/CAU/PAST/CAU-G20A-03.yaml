intent: 좌표평면에서 두 곡선의 위치관계를 식으로 표현하고 도함수로 조건을 만족하는 값을 구해 두 곡선 사이의 넓이를 적분으로 구하는지(3-1), 좌표공간에서 식으로 주어진 정보로 구와 입체의 부피를 계산하고 부피가 최소가 되는 점을 도함수로 구하며 다항식 인수분해 능력을 갖추었는지(3-2) 평가한다(가이드북 출제 의도 요지).
key_idea: '(3-1) 한 점에서만 만남 ⇒ 접함: $e^\alpha=a\sin\alpha=a\cos\alpha$ ⇒ $\alpha=\frac\pi4$. (3-2) 절편형 평면 $\frac xa+\frac y{2a}+\gamma z=1$ 과 구 중심 $(1,1,1)$ 의 거리 1 ⇒ $\gamma$ 를 $a$ 로 표현, 부피 $V(a)$ 를 미분.'
stuck: (3-1) '오직 한 점에서 만남'을 접함(함숫값·미분계수 일치)으로 바꾸는 단계 / (3-2) 접함 조건을 점과 평면 사이 거리로 세워 $b$ 를 $a$ 로 나타내는 단계
