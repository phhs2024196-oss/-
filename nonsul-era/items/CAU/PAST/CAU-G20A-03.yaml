stimuli:
- label: '1'
  body: |
    구간 $[a,b]$에서 $f(x)\ge g(x)$일 때, 두 곡선 $y=f(x)$와 $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이는 다음과 같다.
    $$\int_a^b\{f(x)-g(x)\}\,dx$$
- label: '2'
  body: |
    좌표공간에서 $x,\ y,\ z$에 대한 방정식 $ax+by+cz+d=0$은 벡터 $\vec n=(a,\ b,\ c)$에 수직인 평면을 나타낸다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    어떤 양의 실수 $a$에 대하여, $x\ge0$에서 정의된 두 곡선 $y=e^x$과 $y=a\sin x$가 오직 한 점에서 만난다. 이때 두 곡선 $y=e^x$과 $y=a\sin x$ 및 $y$축으로 둘러싸인 도형의 넓이를 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '(2-\sqrt2)e^{\frac\pi4}-1', equivalents: ['(2-\sqrt{2})e^{\pi/4}-1'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 한 점에서만 만나면 그 점에서 접한다. $e^\alpha=a\sin\alpha=a\cos\alpha$ ⇒ $\alpha=\frac\pi4$, $a=\sqrt2e^{\frac\pi4}$.
    steps:
    - {id: 1a, content: '넓이 $\int_0^{\frac\pi4}(e^x-\sqrt2e^{\frac\pi4}\sin x)\,dx=(2-\sqrt2)e^{\frac\pi4}-1$', criteria: [1.B1, 1.B2]}
    hint_ladder:
    - 두 그래프가 만나기만 하고 교차하지 않는다면 그 점에서 어떤 관계인가?
    - $e^x$ 가 증가하므로 교점은 $\sin x$ 가 증가하는 구간에 있어야 한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.71 예시답안
    steps:
    - id: 1b-1
      content: |
        함수 $y=e^x$의 그래프와 $y=a\sin x$의 그래프를 통해 보면, 함수 $y=e^x$의 그래프가 $y=a\sin x$의 그래프보다 항상 위에 있어야 하고 $y=e^x$가 증가함수이므로 두 곡선이 만나는 점의 $x$좌표 $\alpha$가 $\dfrac\pi2$ 이하여야 함을 알 수 있다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        두 곡선이 한 점에서만 만나므로 그 점에서 함수 $f(x)=e^x-a\sin x$가 $f(\alpha)=e^\alpha-a\sin\alpha=0$, $f'(\alpha)=e^\alpha-a\cos\alpha=0$을 동시에 만족해야 한다. 따라서, 그 점에서 $\cos\alpha=\sin\alpha$이어야 하므로, $\alpha$의 범위로부터 $\alpha=\dfrac\pi4$를 얻고, 이를 대입하여 $a=\sqrt2e^{\frac\pi4}$를 얻는다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        이때 주어진 영역의 넓이는 $\displaystyle\int_0^{\frac\pi4}\left(e^x-\sqrt2e^{\frac\pi4}\sin x\right)dx$이고, 이를 계산하면 $(2-\sqrt2)e^{\frac\pi4}-1$을 얻는다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 6
      evidence: '두 곡선이 만나는 점의 $x$ 좌표 $\alpha$ 에 대해 $\cos\alpha=\sin\alpha$ 이 됨을 이용해, $\alpha$ 의 범위로부터 $\alpha=\dfrac\pi4$ 를 얻고 $a=\sqrt2e^{\frac\pi4}$ 를 얻었다.'
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: '넓이 $\int_0^{\frac\pi4}(e^x-\sqrt2e^{\frac\pi4}\sin x)\,dx$ 를 계산하여 $(2-\sqrt2)e^{\frac\pi4}-1$ 을 얻었다.'
      depends_on: []
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '10', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4111}
  misconceptions:
  - id: MC-CAL-4111
    outcome_code: '70'
    wrong_work: '$e^x=a\sin x$ 만 세우고 접선 기울기 조건을 빠뜨려 $a$ 를 정하지 못하거나, $\tan\alpha=1$ 의 다른 해($\frac{5\pi}4$ 등)를 택함'
    detect_cue: $a$ 의 값이 없거나 $\alpha\neq\frac\pi4$
    feedback: 한 점에서만 만나려면 그 점에서 두 곡선이 접해야 합니다. 함숫값과 미분계수가 모두 같다는 두 식을 세우세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표공간에 구 $S:(x-1)^2+(y-1)^2+(z-1)^2=1$이 있고, $x$축 위의 점 $\mathrm{P}(a,0,0)$, $y$축 위의 점 $\mathrm{Q}(0,2a,0)$, $z$축 위의 점 $\mathrm{R}(0,0,b)$가 있다. 삼각형 PQR가 구 $S$와 접할 때, 좌표공간의 원점과 P, Q, R를 꼭짓점으로 하는 삼각뿔의 부피가 최소가 되는 $a$의 값을 구하시오. (단, $a>3$이고 $b>0$이다.) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{17+\sqrt{145}}{8}', equivalents: ['(17+sqrt(145))/8', '\dfrac{17}{8}+\dfrac{\sqrt{145}}{8}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '평면 $\frac xa+\frac y{2a}+\gamma z=1$ 과 $(1,1,1)$ 의 거리가 1 ⇒ $\gamma=\frac{a^2-3a+1}{a(2a-3)}$, $V(a)=\frac{a^3(2a-3)}{3(a^2-3a+1)}$.'
    steps:
    - {id: 2a, content: '$V''(a)=\dfrac{a^2(a-1)(4a^2-17a+9)}{3(a^2-3a+1)^2}=0$, $a>3$ ⇒ $a=\dfrac{17+\sqrt{145}}8$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 세 절편을 아는 평면의 방정식을 써 보자.
    - 삼각형이 구와 접하면 평면과 구의 중심 사이의 거리는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.71~72 예시답안
    steps:
    - id: 2b-1
      content: |
        삼각형 PQR를 포함하는 평면의 방정식을 $\alpha x+\beta y+\gamma z=1$이라고 하면 구 $S$의 중심과의 거리가 1이므로 $\dfrac{\lvert\alpha+\beta+\gamma-1\rvert}{\sqrt{\alpha^2+\beta^2+\gamma^2}}=1$이고, 한편 점 $(a,0,0)$, $(0,2a,0)$, $(0,0,b)$를 지나므로, $\alpha=\dfrac1a$, $\beta=\dfrac1{2a}$, $\gamma=\dfrac1b$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        따라서 $\dfrac{\left\lvert\dfrac3{2a}+\gamma-1\right\rvert}{\sqrt{\dfrac5{4a^2}+\gamma^2}}=1$을 얻고, 제곱하여 정리하면 $\gamma=\dfrac{a^2-3a+1}{a(2a-3)}$임을 알 수 있다. 따라서 평면의 방정식은 $\dfrac xa+\dfrac y{2a}+\dfrac{a^2-3a+1}{a(2a-3)}z=1$이다.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        한편, 좌표공간의 원점과 P, Q, R를 꼭짓점으로 하는 삼각뿔의 부피 $V(a)$는 $\dfrac13\left(\dfrac{a\times2a}2\right)\times\dfrac{a(2a-3)}{a^2-3a+1}=\dfrac{a^3(2a-3)}{3(a^2-3a+1)}$이다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        $a$에 대해 미분하면 $V'(a)=\dfrac{a^2(a-1)(4a^2-17a+9)}{3(a^2-3a+1)^2}$이 되고, $V'(a)=0$과 $a>3$에서부터 $a=\dfrac{17}8+\dfrac{\sqrt{145}}8$에서 $V(a)$가 최소이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: '평면의 방정식 $\dfrac xa+\dfrac y{2a}+\dfrac{a^2-3a+1}{a(2a-3)}z=1$ 을 얻었다.'
      depends_on: []
      steps: [2b-1, 2b-2]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: '원점과 P, Q, R 을 꼭짓점으로 하는 삼각뿔의 부피 $V(a)=\dfrac{a^3(2a-3)}{3(a^2-3a+1)}$ 을 얻었다.'
      depends_on: []
      steps: [2b-3]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: '$V''(a)=0$ 과 $a>3$ 에서부터 $a=\dfrac{17}8+\dfrac{\sqrt{145}}8$ 을 얻었다.'
      depends_on: []
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '15', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4112}
  misconceptions:
  - id: MC-GEO-4112
    outcome_code: '70'
    wrong_work: '거리 공식에서 분모 $\sqrt{\alpha^2+\beta^2+\gamma^2}$ 를 빼먹거나, 평면을 $x+2y+z=\cdots$ 처럼 절편을 거꾸로 써서 $\gamma$ 식이 달라짐'
    detect_cue: $b$(또는 $\gamma$)의 식이 $\dfrac{a(2a-3)}{a^2-3a+1}$ 과 다름
    feedback: 절편이 $a,\ 2a,\ b$ 인 평면은 $\dfrac xa+\dfrac y{2a}+\dfrac zb=1$ 입니다. 점 $(1,1,1)$ 과의 거리는 계수 벡터의 크기로 나눠야 합니다.
    remedy: [RL-2]

