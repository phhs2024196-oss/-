stimuli: []

stem: |
  각기 다른 3개의 과제 A, B, C가 있다. 과제의 우선순위는 A가 B보다, B가 C보다 높아서 이를 고려하여 다음과 같은 방식으로 4명의 학생을 과제에 배정하려고 한다.

  과제명 A가 쓰여 있는 공 2개와 과제명이 쓰여 있지 않은 공 4개가 들어 있는 주머니를 준비한다. 다음과 같은 규칙에 따라 학생들은 모두 차례대로 한 명씩 주머니에 있는 공을 한 개 뽑아서 과제에 배정된다.

  - 과제명이 쓰여 있는 공을 뽑으면 그 과제에 배정되며, 이때 주머니에서 과제명이 쓰여 있지 않은 공 하나를 꺼내 배정된 과제명을 적은 후, 뽑은 공과 함께 다시 주머니에 집어넣는다. 따라서 주머니에 있는 공의 수는 6개로 유지된다.
  - 과제명이 쓰여 있지 않은 공을 뽑았을 때 아직 학생이 배정되지 않은 과제가 있으면, 그 중에서 우선순위가 더 높은 과제에 배정되며, 이때 뽑은 공에 배정된 과제명을 적은 후 다시 주머니에 집어넣는다. 따라서 주머니에 있는 공의 수는 6개로 유지된다.
  - 과제명이 쓰여 있지 않은 공을 뽑았을 때 이미 모든 과제에 학생이 배정되어 있으면, 세 과제 중 하나에 임의로 배정된다.

  위의 방식에 따라 4명의 학생이 과제에 배정될 때, 3개의 과제 A, B, C 모두에 학생이 배정될 확률을 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    4명의 학생이 과제에 배정될 때, 3개의 과제 A, B, C 모두에 학생이 배정될 확률을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac14', equivalents: ['1/4', '0.25', '18/72'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '첫 학생은 무조건 A. C 에 1명 이상 배정되는 경로 (A,A,B,C), (A,B,A,C), (A,B,B,C), (A,B,C) 의 확률 $\frac1{36},\ \frac1{24},\ \frac1{72},\ \frac16$.'
    steps:
    - {id: 1a, content: '$\dfrac1{36}+\dfrac1{24}+\dfrac1{72}+\dfrac16=\dfrac{18}{72}=\dfrac14$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - 첫 번째 학생이 빈 공을 뽑으면 어느 과제에 배정되는가?
    - 공을 뽑을 때마다 주머니 속 과제명 공의 개수가 어떻게 변하는지 적어 보자.
    - 세 과제 모두 배정되려면 C 에 누군가 배정되어야 한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.92~94 예시답안
    steps:
    - id: 1b-1
      content: |
        첫 번째 학생은 뽑는 공에 상관없이 무조건 과제 A에 배정된다. 두 번째 학생은 $\dfrac12$의 확률로 과제 A 또는 B에 배정되고, 세 번째, 네 번째 학생은 앞의 학생의 배정 결과에 따라 각기 다른 확률로 과제에 배정된다. 과제명이 쓰여 있지 않은 공을 뽑았을 때 아직 학생이 배정되지 않은 과제가 있으면, 과제의 우선순위 A>B>C를 고려한다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        학생이 배정되는 경우는 다음과 같이 나타낼 수 있다(원문은 수형도 그림).
        학생 1: A
        학생 2: A $\left(\dfrac12\right)$, B $\left(\dfrac12\right)$
        (A, A) 다음 학생 3: A $\left(\dfrac23\right)$, B $\left(\dfrac13\right)$ / (A, A, A) 다음 학생 4: A $\left(\dfrac56\right)$, B $\left(\dfrac16\right)$ / (A, A, B) 다음 학생 4: A $\left(\dfrac23\right)$, B $\left(\dfrac16\right)$, C $\left(\dfrac16\right)$
        (A, B) 다음 학생 3: A $\left(\dfrac12\right)$, B $\left(\dfrac16\right)$, C $\left(\dfrac13\right)$ / (A, B, A) 다음 학생 4: A $\left(\dfrac23\right)$, B $\left(\dfrac16\right)$, C $\left(\dfrac16\right)$ / (A, B, B) 다음 학생 4: A $\left(\dfrac12\right)$, B $\left(\dfrac13\right)$, C $\left(\dfrac16\right)$ / (A, B, C) 다음 학생 4: A 또는 B 또는 C
      criteria: [1.B2]
    - id: 1b-3
      content: |
        이때 3개의 과제 모두에 학생이 배정되려면 과제 C에 최소한 1명이 배정되어야 한다. 이를 만족하는 경우의 수는 다음과 같다.

        | | 학생 1 | 학생 2 | 학생 3 | 학생 4 |
        |---|---|---|---|---|
        | Case 1 | 과제 A | 과제 A | 과제 B | 과제 C |
        | Case 2 | 과제 A | 과제 B | 과제 A | 과제 C |
        | Case 3 | 과제 A | 과제 B | 과제 B | 과제 C |
        | Case 4 | 과제 A | 과제 B | 과제 C | – |

        Case 4의 경우 학생 4가 공을 뽑기 전에 이미 모든 과제에 최소한 한명의 학생이 배정이 되었기 때문에 학생 4의 과제 배정 여부는 고려할 필요가 없다.
        (원문의 이 표는 Case 2 를 '과제 A, 과제 A, 과제 A, 과제 C' 로 적었으나 바로 아래 확률표와 수형도에 따라 'A, B, A, C' 로 바로잡아 옮김)
      criteria: [1.B2]
    - id: 1b-4
      content: |
        네 가지 경우가 발생할 확률은 다음과 같이 계산된다.
        Case 1 (A, A, B, C): $\dfrac12\times\dfrac13\times\dfrac16=\dfrac1{36}$
        Case 2 (A, B, A, C): $\dfrac12\times\dfrac12\times\dfrac16=\dfrac1{24}$
        Case 3 (A, B, B, C): $\dfrac12\times\dfrac16\times\dfrac16=\dfrac1{72}$
        Case 4 (A, B, C, –): $\dfrac12\times\dfrac13=\dfrac16$
      criteria: [1.B3]
    - id: 1b-5
      content: |
        따라서 3개의 과제 모두에 학생이 배정될 확률은 다음과 같이 계산된다.
        $$\frac1{36}+\frac1{24}+\frac1{72}+\frac16=\frac{18}{72}=\frac14=0.25$$
      criteria: [1.B4]
