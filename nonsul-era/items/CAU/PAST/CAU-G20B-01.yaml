      evidence: '네 가지 경우에 대한 확률 $\dfrac1{36},\ \dfrac1{24},\ \dfrac1{72},\ \dfrac16$ 을 올바르게 계산했다.'
      depends_on: []
      steps: [1b-4]
    - id: 1.B4
      mark_type: B
      points: 2
      evidence: 확률의 곱셈정리와 덧셈정리를 사용하여 확률 $\dfrac14$ 을 올바르게 계산했다.
      depends_on: []
      steps: [1b-5]
    deductions:
