  - '삼차함수 $p(x)=ax^3+bx^2+cx+d$ 와 모든 자연수 $k$ 에 대한 조건 $\int_0^\pi(k^2p(x)+4)\sin kx\,dx=0$'
  concepts: [부분적분법, 음함수의 미분법, 삼차방정식의 인수분해, 항등식, 삼각함수의 미분·적분]
