key_idea: '(2-1) 부분적분으로 $\int_0^1tg''''dt=g''(1)-g(1)+g(0)$ 로 바꾸면 $g$ 를 몰라도 $t=0,1$ 에서의 근과 음함수 미분으로 충분하다. (2-2) 부분적분 두 번 후 $(-1)^k$ 가 남으므로 $k$ 의 홀짝으로 나누어 항등식을 세운다.'
stuck: (2-1) 근 $g(t)$ 를 직접 구하지 않고 부분적분으로 $t=0,\ 1$ 의 값만 필요하게 만드는 단계 / (2-2) $k$ 의 홀짝으로 나누어 계수 조건을 얻는 단계
