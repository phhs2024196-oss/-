stimuli:
- label: '1'
  body: |
    $x$의 함수 $y$가 음함수 $f(x,y)=0$의 꼴로 주어져 있을 때에는 $y$를 $x$의 함수로 보고 각 항을 $x$에 대하여 미분한 후에 $\dfrac{dy}{dx}$를 구한다.
- label: '2'
  body: |
    미분가능한 두 함수 $f(x),\ g(x)$에 대하여 다음이 성립한다.
    $$\int f(x)g'(x)\,dx=f(x)g(x)-\int f'(x)g(x)\,dx$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    $x$에 대한 방정식 $4x^3-6(t+1)x^2+7t^2+1=0$이 세 실근 $f(t),\ g(t),\ h(t)$를 가진다. $\displaystyle\int_0^1 tg''(t)\,dt$를 구하시오. (단, $-\dfrac18<t<\dfrac98$이고 $f(t)<g(t)<h(t)$이다.) [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac16', equivalents: ['1/6'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\int_0^1tg''''dt=g''(1)-g(1)+g(0)$. $g(0)=\frac12$, $g(1)=1$, 음함수 미분으로 $g''(1)=\frac23$.'
    steps:
    - {id: 1a, content: '$\dfrac23-1+\dfrac12=\dfrac16$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - $g$ 를 직접 구하기는 어렵다. 부분적분으로 $g''$ 를 없애 보자.
    - $t=0$, $t=1$ 에서 방정식을 인수분해해 가운데 근을 찾자.
    - '$g(t)$ 를 방정식에 넣은 식은 $t$ 에 대한 항등식이다. 양변을 $t$ 로 미분하자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.94 예시답안
    steps:
    - id: 1b-1
      content: |
        그래프를 그려보면 $f(t)<0<g(t)<t+1<h(t)$임을 알 수 있다. 부분 적분하여 아래 식을 구할 수 있다.
        $$\int_0^1tg''\,dt=[tg']_0^1-\int_0^1g'\,dt=g'(1)-g(1)+g(0).$$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $t=0$에서 $4x^3-6x^2+1=(2x-1)(2x^2-2x-1)=0$이므로 $g(0)=\dfrac12$이다.
        $t=1$에서 $4x^3-12x^2+8=4(x-1)(x^2-2x-2)=0$이므로 $g(1)=1$이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $g'(1)$을 구하자. $g(t)$는 $4g^3(t)-6(t+1)g^2(t)+7t^2+1=0$을 만족한다. 식을 음함수 미분하고 $t=1$ 대입하면
        $$6g^2(1)g'(1)-3g^2(1)-12g(1)g'(1)+7=0$$
        을 얻고, $g'(1)=\dfrac23$이다. 주어진 적분 값은 $\displaystyle\int_0^1tg''\,dt=\frac23-1+\frac12=\frac16$이다.
        (원문 식은 양변을 2로 나눈 꼴로 적혀 있다: $12g^2g'-6g^2-12(t+1)gg'+14t=0$ 에 $t=1$ 을 넣고 2로 나눈 것)
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: '$\int_0^1tg''''\,dt=[tg'']_0^1-\int_0^1g''\,dt=g''(1)-g(1)+g(0)$ 을 적었다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: '$g(0)=\dfrac12$, $g(1)=1$ 을 구했다(각 2점).'
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: '$g''(1)=\dfrac23$ 을 구했다(정답 $\dfrac23-1+\dfrac12=\dfrac16$ 은 공식 기준에 별도 배점 없음).'
      depends_on: []
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '10', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4114}
  misconceptions:
  - id: MC-CAL-4114
    outcome_code: '70'
    wrong_work: '$4g^3-6(t+1)g^2+7t^2+1=0$ 을 $t$ 로 미분할 때 $-6(t+1)g^2$ 의 곱의 미분에서 $-6g^2$ 항을 빠뜨리거나 $g''$ 를 붙이지 않음'
    detect_cue: $g'(1)$ 이 $\dfrac23$ 이 아님(예 $\dfrac76$), 최종값이 $\dfrac16$ 이 아님
    feedback: '$g$ 는 $t$ 의 함수이므로 $(g^3)''=3g^2g''$, $\{(t+1)g^2\}''=g^2+2(t+1)gg''$ 입니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    모든 자연수 $k$에 대하여 다음을 만족시키는 함수 $p(x)=ax^3+bx^2+cx+d$를 구하시오. (단, $a,\ b,\ c,\ d$는 실수이다.) [15점]
    $$\int_0^\pi(k^2p(x)+4)\sin kx\,dx=0$$
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'p(x)=2x^2-2\pi x', equivalents: ['2x^2-2\pi x'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 부분적분 두 번으로 $k$ 의 식을 얻고, $k$ 짝수·홀수일 때 각각 $k$ 에 대한 항등식으로 본다.
    steps:
    - {id: 2a, content: '짝수: $a=0,\ b\pi^2+c\pi=0$ / 홀수: $b=2,\ b\pi^2+c\pi+2d=0$ ⇒ $a=0,\ b=2,\ c=-2\pi,\ d=0$', criteria: [2.B1, 2.B2, 2.B3, 2.B4, 2.B5]}
    hint_ladder:
    - $\int_0^\pi p(x)\sin kx\,dx$ 를 부분적분하면 $\cos k\pi=(-1)^k$ 가 나온다.
    - 식에 $(-1)^k$ 가 있으므로 $k$ 의 홀짝을 나누어 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.95 예시답안
    steps:
    - id: 2b-1
      content: |
        $$\int_0^\pi k^2p(x)\sin kx\,dx=\left[-kp(x)\cos kx\right]_0^\pi+\int_0^\pi kp'(x)\cos kx\,dx=k(-1)^{k+1}p(\pi)+kp(0)+\int_0^\pi kp'(x)\cos kx\,dx$$
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $$\int_0^\pi kp'(x)\cos kx\,dx=\left[p'(x)\sin kx\right]_0^\pi-\int_0^\pi p''(x)\sin kx\,dx=-\int_0^\pi\sin kx\,(6ax+2b)\,dx$$
        이다. 또한 $\displaystyle\int_0^\pi\sin kx\,(6ax+2b)\,dx=\frac{(-1)^{k+1}}{k}(6a\pi+2b)+\frac{2b}{k}$이고 $\displaystyle4\int_0^\pi\sin kx\,dx=\frac4k(1-(-1)^k)$이므로 정리하면
      criteria: [2.B2]
    - id: 2b-3
      content: |
        $$k(-1)^kp(\pi)-kp(0)+\frac{(-1)^{k+1}}{k}(6a\pi+2b)+\frac{2b}{k}+\frac4k((-1)^k-1)=0$$
        이다.
        (원문은 원래 등식 전체에 $-1$ 을 곱한 꼴로 정리했다)
      criteria: [2.B3]
    - id: 2b-4
      content: |
        $k$ 짝수일 때 $k^2(p(\pi)-p(0))-6a\pi=0$이므로 $a=0$, $b\pi^2+c\pi=0$이 나온다.
      criteria: [2.B4]
    - id: 2b-5
      content: |
        $k$ 홀수일 때 $k^2(p(\pi)+p(0))-(4b-8)=0$이므로 $b=2$, $b\pi^2+c\pi+2d=0$이고 위에서 구한 것과 같이 생각해보면 $a=0$, $b=2$, $c=-2\pi$, $d=0$이다. 따라서 $p(x)=2x^2-2\pi x$이다.
      criteria: [2.B5]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: '$\int_0^\pi k^2p(x)\sin kx\,dx=k(-1)^{k+1}p(\pi)+kp(0)+\int_0^\pi kp''(x)\cos kx\,dx$ 를 얻었다.'
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: '$\int_0^\pi kp''(x)\cos kx\,dx=-\int_0^\pi\sin kx\,(6ax+2b)\,dx$ 이고 $\int_0^\pi\sin kx\,(6ax+2b)\,dx=\dfrac{(-1)^{k+1}}{k}(6a\pi+2b)+\dfrac{2b}{k}$ 임을 얻었다.'
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: '정리하여 $k(-1)^kp(\pi)-kp(0)+\dfrac{(-1)^{k+1}}{k}(6a\pi+2b)+\dfrac{2b}{k}+\dfrac4k((-1)^k-1)=0$ 을 얻었다.'
      depends_on: []
      steps: [2b-3]
    - id: 2.B4
      mark_type: B
      points: 3
      evidence: '$k$ 짝수일 때 $k^2(p(\pi)-p(0))-6a\pi=0$ 이므로 $a=0$, $b\pi^2+c\pi=0$ 을 얻었다.'
      depends_on: []
      steps: [2b-4]
    - id: 2.B5
      mark_type: B
      points: 3
      evidence: '$k$ 홀수일 때 $k^2(p(\pi)+p(0))-(4b-8)=0$ 이므로 $b=2$, $b\pi^2+c\pi+2d=0$ 을 얻었다(정답 $p(x)=2x^2-2\pi x$).'
      depends_on: []
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '15', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4115}
  misconceptions:
  - id: MC-CAL-4115
    outcome_code: '70'
    wrong_work: '$k=1$ 하나(또는 $k=1,2$)만 대입해 미지수 4개를 정하려 하거나, $(-1)^k$ 를 그대로 둔 채 계수비교를 시도'
    detect_cue: 식 개수가 부족해 $c,\ d$ 가 정해지지 않음, 또는 $\cos k\pi=1$ 로 처리
    feedback: '$\cos k\pi=(-1)^k$ 이므로 $k$ 가 짝수일 때와 홀수일 때 식이 다릅니다. 각각을 $k$ 에 대한 항등식으로 보면 $k^2$ 의 계수와 상수항이 모두 0 이어야 합니다.'
    remedy: [RL-2]

