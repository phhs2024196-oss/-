  - '모든 자연수 $k$ 에 대해 성립 ⇒ $k$ 짝수에서 $k^2(p(\pi)-p(0))-6a\pi=0$, $k$ 홀수에서 $k^2(p(\pi)+p(0))-(4b-8)=0$ 이 $k$ 에 대한 항등식'
  stimuli_used: ['1', '2']
  subpart_links:
