intent: 등차수열의 개념으로 다양한 관계로 주어진 두 수열을 거꾸로 찾고 항등식·합 공식·이차방정식을 자유롭게 쓰는지(3-1), 주어진 조건을 식으로 나타내 점의 좌표를 정확히 계산하고 매개변수로 나타낸 함수를 미분해 접선의 기울기를 구하는지(3-2) 평가한다(가이드북 출제 의도 요지).
key_idea: '(3-1) $a_n=cn+d,\ b_n=en+f$ 로 두고 (가)를 $n$ 에 대한 항등식으로 보면 $e=2c,\ f=d-3$, 따라서 $b_n-a_n=cn-3$. (3-2) R 은 초점 P, Q 인 타원 위에 있고 $\angle\mathrm{PRQ}=\frac\pi3$ 인 원 위에도 있으므로 두 곡선의 교점으로 $\mathrm{R}(x(t),y(t))$ 를 구해 $\frac{y''(t)}{x''(t)}$.'
stuck: (3-1) 일반항을 미지수로 두고 (가)를 항등식으로 처리하는 단계 / (3-2) 각 조건을 $\tan\frac\pi3$ 식으로 세워 원의 방정식으로 바꾸는 단계
idea_tags: [IDEA-ARITH-SEQ-GENERAL-TERM-IDENTITY, IDEA-ELLIPSE-FOCI-ANGLE-LOCUS, IDEA-PARAMETRIC-SLOPE]
tags: [등차수열, 합의 공식, 타원, 매개변수 미분, 접선의 기울기, 중앙대 실전]
elements:
  materials:
  - '등차수열 $\{a_n\},\ \{b_n\}$ 과 조건 (가) $a_{2n}-b_n=3$, (나) $b_1=756$, (다) $\sum_{n=1}^{11}a_{n^2}=\sum_{n=1}^{11}(b_n-a_n)^2$'
  - '원점 P, $x$ 축 위의 점 $\mathrm{Q}(2t,0)$, $\overline{\mathrm{PR}}+\overline{\mathrm{RQ}}=20$, $\angle\mathrm{PRQ}=\frac\pi3$'
  - '제1사분면 위의 점들 중 $x$ 좌표가 가장 큰 점 $\mathrm{R}(x(t),y(t))$, $t=2\sqrt7$'
  concepts: [등차수열, 항등식, 자연수 거듭제곱의 합, 이차방정식, 타원의 정의, 두 직선이 이루는 각, 매개변수로 나타낸 함수의 미분법]
  tools:
  - 일반항 $a_n=cn+d,\ b_n=en+f$ 설정과 계수비교
  - '$\sum k^2=\frac{n(n+1)(2n+1)}6$, $\sum k=\frac{n(n+1)}2$'
  - '이차방정식 $23c^2-40c-375=0$ 의 인수분해(근의 공식)'
  - '타원 $\frac{(x-t)^2}{10^2}+\frac{y^2}{10^2-t^2}=1$'
  - '$\tan\frac\pi3=\left\lvert\frac{2ty}{x(x-2t)+y^2}\right\rvert$ 로 원 $(x-t)^2+\left(y\mp\frac t{\sqrt3}\right)^2=\frac{4t^2}3$'
  - '$\frac{dy}{dx}=\frac{y''(t)}{x''(t)}$'
  conditions:
  - '$\{a_n\}$ 의 공차는 양수 ⇒ $c>0$ ⇒ $c=5$'
  - '(가)가 모든 자연수 $n$ 에 대해 성립 ⇒ 항등식 ⇒ $2c=e,\ d-3=f$'
  - '$\overline{\mathrm{PR}}+\overline{\mathrm{RQ}}=20$ ⇒ R 은 초점 $(0,0),\ (2t,0)$, 장축 길이 20 인 타원 위'
  - '$\angle\mathrm{PRQ}=\frac\pi3$ ⇒ R 은 두 원 중 하나 위'
  - '제1사분면($y>0$) 중 $x$ 좌표가 가장 큰 점 ⇒ $x=t+\frac{20}{\sqrt3}\frac{\sqrt{t^2-25}}t$ 인 점'
  stimuli_used: ['1', '2']
  subpart_links:
  - {from: '1', to: '2', relation: 독립(같은 제시문 공유, 결과 이월 없음)}

