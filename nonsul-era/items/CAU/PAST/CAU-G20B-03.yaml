stimuli:
- label: '1'
  body: |
    수열 $a_1,a_2,a_3,\cdots,a_n,\cdots$이 첫째항 $a_1$에서 시작하여 차례대로 일정한 수 $d$를 더하여 얻은 수열일 때, 이 수열을 등차수열이라고 하고, 그 일정한 수 $d$를 공차라고 한다.
- label: '2'
  body: |
    평면 위의 두 점 F, F′으로부터의 거리의 합이 일정한 점들의 집합을 타원이라고 하며, 두 점 F, F′을 타원의 초점이라고 한다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    등차수열 $\{a_n\}$, $\{b_n\}$이 다음 조건을 만족시킬 때, $a_{254}$의 값을 구하시오. (단, $\{a_n\}$의 공차는 양의 실수이다.) [10점]

    (가) $a_{2n}-b_n=3\ (n=1,\ 2,\ 3,\ \cdots)$
    (나) $b_1=756$
    (다) $\displaystyle\sum_{n=1}^{11}a_{n^2}=\sum_{n=1}^{11}(b_n-a_n)^2$
  points: 10
  depends_on: []
  answer: {kind: value, value: '2019', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '(가)에서 $e=2c,\ f=d-3$, 즉 $b_n-a_n=cn-3$. (다)와 (나)를 합 공식으로 정리하면 $23c^2-40c-375=0$.'
    steps:
    - {id: 1a, content: '$c=5,\ d=749$, $a_{254}=254\cdot5+749=2019$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - 두 등차수열의 일반항을 미지수로 두자.
    - (가)가 모든 $n$ 에 대해 성립한다는 것은 무엇을 뜻하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.96 예시답안
    steps:
    - id: 1b-1
      content: |
        $\{a_n\},\ \{b_n\}$이 등차수열이므로 $a_n=cn+d$, $b_n=en+f$ 꼴이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        조건 (가)에서 $2cn+d-3=en+f$가 모든 자연수 $n$에 대해 성립하므로 이는 항등식이고, 따라서 $2c=e$, $d-3=f$를 얻는다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        한편, 조건 (다)로부터 $\displaystyle\sum_{n=1}^{11}(cn^2+d)=\sum_{n=1}^{11}(cn-3)^2$을 얻고, $\displaystyle\sum_{k=1}^nk^2=\frac{n(n+1)(2n+1)}6$, $\displaystyle\sum_{k=1}^nk=\frac{n(n+1)}2$를 이용하면 $506c^2-902c+99-11d=11(46c^2-82c+9-d)=0$을 얻는다. 한편, 조건 (나)에서 $2c+d-3=756$을 얻고, 이를 대입하면 $46c^2-80c-750=2(23c^2-40c-375)=0$을 얻는다. 인수분해 혹은 근의 공식을 쓰면, $c=-\dfrac{75}{23},\ 5$를 얻고, $c>0$이므로 $c=5$이다.
      criteria: [1.B3]
    - id: 1b-4
      content: |
        따라서 $d=759-2c=749$이고, $a_{254}=254c+d=1270+749=2019$이다.
      criteria: [1.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: 두 수열이 $a_n=cn+d,\ b_n=en+f$ 꼴임을 제시했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: '$2cn+d-3=en+f$ 로부터 항등식의 성질을 이용해 $2c=e,\ d-3=f$ 를 얻었다.'
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: 수열의 합 공식들을 이용하고 이차방정식을 풀어 $c=5$ 를 얻었다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B4
      mark_type: B
      points: 2
      evidence: $a_{254}=2019$ 를 얻었다.
      depends_on: []
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '10', meaning: 만점}
  - {code: '70', misconception: MC-ALG-4116}
  misconceptions:
  - id: MC-ALG-4116
    outcome_code: '70'
    wrong_work: '$a_{n^2}$ 를 $(a_n)^2$ 으로 읽거나, $b_n-a_n$ 을 정리하지 않고 (다)를 전개하다 미지수가 남음'
    detect_cue: (다)의 좌변에 $c^2$ 항이 생김, 또는 $c$ 가 정수로 나오지 않음
    feedback: '$a_{n^2}$ 은 $n^2$ 번째 항, 즉 $cn^2+d$ 입니다. (가)에서 $e=2c,\ f=d-3$ 을 먼저 얻으면 $b_n-a_n=cn-3$ 으로 간단해집니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    점 P가 좌표평면의 원점에 있고 점 $\mathrm{Q}(2t,0)$가 $x$축 위에 있다. $\overline{\mathrm{PR}}+\overline{\mathrm{RQ}}=20$이고, 각 PRQ가 $\dfrac\pi3$가 되는 제1사분면 위의 점들 중 $x$좌표가 가장 큰 점을 $\mathrm{R}(x(t),y(t))$라 하자. $t=2\sqrt7$일 때, 점 R에서의 접선의 기울기를 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '-\dfrac{16\sqrt3}{73}', equivalents: ['-16\sqrt{3}/73'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 'R 은 타원 $\frac{(x-t)^2}{10^2}+\frac{y^2}{10^2-t^2}=1$ 과 원 $(x-t)^2+\left(y\mp\frac t{\sqrt3}\right)^2=\frac{4t^2}3$ 의 교점. $\mathrm{R}\left(t+\frac{20}{\sqrt3}\frac{\sqrt{t^2-25}}t,\ \frac1{\sqrt3}\left(\frac{100}t-t\right)\right)$.'
    steps:
    - {id: 2a, content: '$\dfrac{y''(2\sqrt7)}{x''(2\sqrt7)}=\dfrac{-\frac{32}{7\sqrt3}}{\frac{146}{21}}=-\dfrac{16\sqrt3}{73}$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - $\overline{\mathrm{PR}}+\overline{\mathrm{RQ}}=20$ 인 점들은 어떤 곡선을 이루는가? 초점은?
    - 각 PRQ 가 일정한 점들의 자취는 원이다. $\tan$ 로 식을 세워 보자.
    - 점 R 의 좌표가 $t$ 의 식으로 나오면 매개변수 미분을 쓰자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.96 예시답안
    steps:
    - id: 2b-1
      content: |
        점 R은 $\overline{\mathrm{PR}}+\overline{\mathrm{RQ}}=20$을 만족하는 점이고 $\mathrm{P}(0,0)$, $\mathrm{Q}(2t,0)$이므로, R은 곡선 $\dfrac{(x-t)^2}{10^2}+\dfrac{y^2}{10^2-t^2}=1$ 위의 점이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        한편, 각 PRQ가 $\dfrac\pi3$라는 조건에서 $\tan\dfrac\pi3=\left\lvert\dfrac{2ty}{x(x-2t)+y^2}\right\rvert$을 얻고, 이를 정리하면 점 R은 곡선 $(x-t)^2+\left(y-\dfrac t{\sqrt3}\right)^2=\dfrac{4t^2}3$ 또는 $(x-t)^2+\left(y+\dfrac t{\sqrt3}\right)^2=\dfrac{4t^2}3$ 위의 점임을 알 수 있다.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        이 두 관계를 연립하여 계산하는 과정에서 $y>0$을 이용하면 가능한 좌표는
        $$\left(t\pm\frac{20}{\sqrt3}\frac{\sqrt{t^2-25}}t,\ \frac1{\sqrt3}\left(\frac{100}t-t\right)\right)\ \text{또는}\ \left(t\pm\frac{20}{\sqrt3}\frac{\sqrt{t^2-25}}t,\ -\frac1{\sqrt3}\left(\frac{100}t-t\right)\right)$$
        임을 알 수 있고, 조건에 의하여 R의 좌표는 $\mathrm{R}\left(t+\dfrac{20}{\sqrt3}\dfrac{\sqrt{t^2-25}}t,\ \dfrac1{\sqrt3}\left(\dfrac{100}t-t\right)\right)$임을 알 수 있다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        미분하면 $x'(t)=1-\dfrac{20}{\sqrt3}\dfrac{\sqrt{t^2-25}}{t^2}+\dfrac{20}{\sqrt3}\dfrac1{\sqrt{t^2-25}}$, $y'(t)=-\dfrac1{\sqrt3}-\dfrac{100}{\sqrt3}\dfrac1{t^2}$에서
        $$\frac{y'(t)}{x'(t)}=-\frac{(t^2+100)\sqrt{t^2-25}}{\sqrt3t^2\sqrt{t^2-25}+500}$$
        이다. $t=2\sqrt7$를 대입하면 $\dfrac{y'(2\sqrt7)}{x'(2\sqrt7)}=\dfrac{-\dfrac{32}{7\sqrt3}}{\dfrac{146}{21}}=-\dfrac{16\sqrt3}{73}$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: '점 R 이 곡선 $\dfrac{(x-t)^2}{10^2}+\dfrac{y^2}{10^2-t^2}=1$ 위에 있고 곡선 $(x-t)^2+\left(y-\dfrac t{\sqrt3}\right)^2=\dfrac{4t^2}3$ 또는 $(x-t)^2+\left(y+\dfrac t{\sqrt3}\right)^2=\dfrac{4t^2}3$ 위의 점임을 제시했다.'
      depends_on: []
      steps: [2b-1, 2b-2]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: '계산하고 문제의 조건을 이용해 좌표 $\mathrm{R}\left(t+\dfrac{20}{\sqrt3}\dfrac{\sqrt{t^2-25}}t,\ \dfrac1{\sqrt3}\left(\dfrac{100}t-t\right)\right)$ 를 제시했다.'
      depends_on: []
      steps: [2b-3]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: '미분하여 $x''(t)$, $y''(t)$ 를 얻고 $t=2\sqrt7$ 을 대입하여 $-\dfrac{16\sqrt3}{73}$ 을 얻었다.'
      depends_on: []
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '15', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4117}
  misconceptions:
  - id: MC-GEO-4117
    outcome_code: '70'
    wrong_work: '$x$ 좌표가 가장 큰 점을 고르지 않고 $t-\frac{20}{\sqrt3}\frac{\sqrt{t^2-25}}t$ 쪽 점으로 계산하거나, $y''(t)$ 대신 $\frac{dy}{dx}$ 를 타원의 접선 기울기로 계산'
    detect_cue: 기울기가 $-\dfrac{16\sqrt3}{73}$ 과 다름(부호 반대 등), R 의 $x$ 좌표에 $-$ 부호
    feedback: '구하는 것은 $t$ 가 변할 때 점 R 이 그리는 곡선의 접선 기울기 $\frac{y''(t)}{x''(t)}$ 입니다. 고정된 타원의 접선이 아닙니다. 또 $x$ 좌표가 가장 큰 점을 골라야 합니다.'
    remedy: [RL-2]

