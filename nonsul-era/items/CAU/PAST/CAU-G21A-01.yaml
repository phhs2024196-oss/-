intent: 회사의 의사결정 상황을 확률과 연관 지어, 두 가지 상황에 대한 확률을 확률의 덧셈정리로 계산할 수 있는가를 평가한다. 이 과정에서 사건의 독립 및 종속의 개념이 사용되며, 확률의 덧셈정리 및 사건의 독립·종속에 대한 이해도를 평가한다(난이도 중·하, 가이드북 출제의도 요지).
key_idea: '(가)는 $(p\cap s)\cup(q\cap r)$, (나)는 $(p\cup q)\cap(r\cup s)$로 전류가 흐르는 사건을 쓰고 덧셈정리·독립으로 $x=\dfrac{7}{16}$, $y=\dfrac{9}{16}$.'
stuck: 중앙 전선이 추가된 (나)를 「앞쪽 $p$ 또는 $q$, 뒤쪽 $r$ 또는 $s$」의 곱 구조로 바꾸어 보는 단계와 「1% 증가」의 해석
