  materials: ['$y=x$에 대칭이고 각 $\theta$를 이루는 두 직선 $l_1$, $l_2$', '곡선 $y=\dfrac1x$', '닫힌구간 $[0,\pi^2+2\pi]$의 분수함수 $f(x)$']
  concepts: [정적분과 넓이, 삼각함수의 덧셈정리, 합성함수의 미분법, 극값과 도함수, 닫힌구간의 최대·최소]
  tools:
  - 대칭으로 절반 넓이 계산
  - '교점 $\left(\frac{1}{\sqrt{\tan\alpha}},\sqrt{\tan\alpha}\right)$'
  - 로그함수 적분
  - 탄젠트 덧셈정리(방법 2)
  - $t=\sqrt{x+1}-1$ 치환과 유리화
  - $g'(t)=1-2\sin t$ 부호 조사
  - 경계값 비교
  conditions:
  - '(1) $l_1$, $l_2$는 $y=x$에 대칭, 사잇각 $\theta$ ⇒ $l_1$의 경사각 $\alpha=\dfrac{\pi}{4}-\dfrac{\theta}{2}$'
  - '(1) $f''(\theta)=2$ ⇒ $\dfrac{1}{\cos\theta}=2$, 제1사분면 조건에서 $\theta=\dfrac{\pi}{3}$'
  - '(2) $x\in[0,\pi^2+2\pi]$ ⇒ $t=\sqrt{x+1}-1\in[0,\pi]$'
  - '(2) $f=\dfrac{1}{g(t)}$, $g>0$ ⇒ $f$ 최대 ⇔ $g$ 최소, 극소 $t=\dfrac{5\pi}{6}$와 경계 $t=0$ 비교'
  stimuli_used: ['1', '2', '3']
  subpart_links:
