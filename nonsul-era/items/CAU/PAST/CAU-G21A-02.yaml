intent: '(1) 정적분으로 함수의 그래프와 $x$축 사이의 넓이를 구하는 과정을 이해하는지, 합성함수의 미분법으로 복잡한 함수를 미분하는 방법을 이해하는지 평가한다. (2) 도함수로 극솟값·극댓값을 찾고 이를 이용해 닫힌구간에서 함수의 최댓값·최솟값을 구하는 과정을 이해하는지 평가한다(가이드북 출제의도 요지).'
key_idea: '(1) 대칭성으로 $f(\theta)=-\ln\tan\left(\dfrac{\pi}{4}-\dfrac{\theta}{2}\right)$, $f''(\theta)=\dfrac1{\cos\theta}$. (2) $t=\sqrt{x+1}-1$로 치환·유리화하면 $f=\dfrac1{t+2\cos t}$, $g(t)=t+2\cos t$의 $[0,\pi]$ 최솟값 문제.'
stuck: (1) $y=x$ 대칭을 이용해 넓이를 $\alpha=\dfrac{\pi}{4}-\dfrac{\theta}{2}$ 하나로 쓰는 단계 / (2) $\sqrt{x+1}+1=\dfrac{x}{\sqrt{x+1}-1}$ 유리화로 식을 단순화하고 극소와 경계값을 비교하는 단계
idea_tags: [IDEA-SYMMETRY-HALF-AREA, IDEA-RATIONALIZE-SUBST, IDEA-RECIPROCAL-MAXMIN]
tags: [넓이, 합성함수의 미분, 최댓값, 치환, 중앙대 실전]
