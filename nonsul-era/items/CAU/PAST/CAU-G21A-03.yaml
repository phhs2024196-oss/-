intent: '(1) 주어진 정적분의 형태를 파악한 후 부분적분을 두 번 사용하여 정적분 값을 구할 수 있는지, 삼각함수의 미분과 적분을 구할 수 있는지 평가한다. (2) 주어진 상황을 수식으로 표현한 후 음함수 미분과 합성함수 미분으로 속도를 구하고, Q에 대응하는 P를 구할 때 삼각함수가 들어간 방정식을 계산할 수 있는지 평가한다(가이드북 출제의도 요지).'
key_idea: '(1) $F''(x)=\sin^2x$이므로 $\left(e^{F(x)}\right)''=e^{F(x)}\sin^2x$, 부분적분 후 $2-2\cos2x=4\sin^2x$로 다시 $\left(e^{F}\right)''$ 꼴. (2) $(x-\cos t)^2+(y-\sin t)^2=8$을 $t$로 음함수 미분, $\dfrac{dy}{dt}=\dfrac{dy}{dx}\dfrac{dx}{dt}$.'
stuck: (1) $e^{F(x)}\sin^2x$가 $e^{F(x)}$의 도함수임을 알아채는 단계 / (2) 두 점의 거리 조건을 $t$에 대한 항등식으로 보고 미분하는 단계
idea_tags: [IDEA-PARTS-EXP-OF-INTEGRAL, IDEA-IMPLICIT-DIFF-IN-TIME]
tags: [부분적분, 적분으로 정의된 함수, 음함수 미분, 속도, 중앙대 실전]
