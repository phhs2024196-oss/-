  materials: ['$F(x)=\int_0^x\sin^2t\,dt$', '정적분 $\int_0^\pi(2x-\sin2x)e^{F(x)}\sin^2x\,dx$', '단위원 위의 점 $\mathrm{P}(\cos t,\sin t)$, $0\le t\le\frac{\pi}{4}$', '곡선 $y=(x+1)(x-1)^2$ 위의 점 Q', '거리 $2\sqrt2$ 유지']
  concepts: [부분적분법, 적분으로 정의된 함수의 미분, 반각(배각) 공식, 음함수의 미분, 합성함수의 미분, 속도]
  tools: [부분적분 두 번, $\sin^2x=\frac12-\frac12\cos2x$, $F(\pi)$ 계산, 거리 조건의 음함수 미분, 삼각방정식 풀이와 범위로 근 선택, 연쇄법칙]
  conditions:
  - '(1) $F(x)=\int_0^x\sin^2t\,dt$ ⇒ $F''(x)=\sin^2x$, $\left(e^{F(x)}\right)''=e^{F(x)}\sin^2x$'
  - '(2) Q는 곡선 위 ⇒ $y=(x+1)(x-1)^2$, $\dfrac{dy}{dx}=3x^2-2x-1$'
  - '(2) $\lvert\mathrm{PQ}\rvert=2\sqrt2$ 유지 ⇒ $(x-\cos t)^2+(y-\sin t)^2=8$이 모든 $t$에서 성립'
  - '(2) $0\le t\le\dfrac{\pi}{4}$ ⇒ $\sin t=\dfrac5{13}$, $1$ 중 $\sin t=\dfrac5{13}$만 유효'
  stimuli_used: ['1', '2', '3']
  subpart_links:
