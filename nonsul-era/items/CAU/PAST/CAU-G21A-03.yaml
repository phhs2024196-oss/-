stimuli:
- label: '1'
  body: |
    미분가능한 두 함수 $f(x)$, $g(x)$에 대하여 다음이 성립한다.
    $$\int f(x)g'(x)dx=f(x)g(x)-\int f'(x)g(x)dx$$
- label: '2'
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 각각 $u$, $x$에 대하여 미분가능하면, 합성함수 $y=f(g(x))$도 $x$에 대하여 미분가능하고, 그 도함수는 $\dfrac{dy}{dx}=\dfrac{dy}{du}\dfrac{du}{dx}$이다.
- label: '3'
  body: |
    $x$의 함수 $y$가 음함수 $f(x,y)=0$의 꼴로 주어졌을 때, $y$를 $x$의 함수로 보고 각 항을 $x$에 대하여 미분한 후 $\dfrac{dy}{dx}$를 구한다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 3-1] 함수 $F(x)=\displaystyle\int_0^x\sin^2t\,dt$에 대하여, 다음 정적분의 값을 구하시오. (단, 각 $\theta$에 대하여 $\sin^2\theta=\dfrac{1-\cos2\theta}{2}$가 성립한다.) [10점]
    $$\int_0^\pi(2x-\sin(2x))e^{F(x)}\sin^2x\,dx$$
  points: 10
  depends_on: []
  answer: {kind: value, value: '(2\pi-4)e^{\frac{\pi}{2}}+4', equivalents: ['(2pi-4)e^(pi/2)+4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$u=2x-\sin2x$, $v''=e^{F}\sin^2x$로 부분적분, 남는 $\int(2-2\cos2x)e^{F}dx=\int4\sin^2x\,e^{F}dx=4\left[e^{F}\right]$.'
    steps:
    - {id: 1a, content: '$2\pi e^{F(\pi)}-4e^{F(\pi)}+4$, $F(\pi)=\dfrac{\pi}{2}$', criteria: [1.M1, 1.B1, 1.B2]}
    hint_ladder:
    - '$F''(x)$는 무엇인가? $e^{F(x)}$를 미분해 보자.'
    - '$(2x-\sin2x)$를 미분하면 $2-2\cos2x$이다. 이것을 $\sin^2x$로 바꾸면?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 논술가이드북(자연) p.55 예시답안
    steps:
    - id: 1b-1
      content: |
        부분적분을 하고 $\sin^2xdx=\dfrac12-\dfrac12\cos2x$를 이용하면
        $$\Big[(2x-\sin2x)e^{F(x)}\Big]_0^\pi-\int_0^\pi(2-2\cos2x)e^{F(x)}dx$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $$=2\pi e^{F(\pi)}-\int_0^\pi e^{F(x)}4\sin^2x\,dx=2\pi e^{F(\pi)}-\Big[4e^{F(x)}\Big]_0^\pi=2\pi e^{F(\pi)}-4e^{F(\pi)}+4$$
        이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $F(x)=\displaystyle\int_0^x\sin^2t\,dt=\frac12x-\frac14\sin2x$이므로 $F(\pi)=\left[\dfrac12x-\dfrac14\sin2x\right]_0^\pi=\dfrac{\pi}{2}$이고 정리하면 $(2\pi-4)e^{\frac{\pi}{2}}+4$이다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: '$\Big[(2x-\sin2x)e^{F(x)}\Big]_0^\pi-\int_0^\pi(2-2\cos2x)e^{F(x)}dx$로 부분적분했다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: '$\sin^2x\,dx=\frac12-\frac12\cos2x$를 이용하여 $2\pi e^{F(x)}-4e^{F(x)}+4$를 구했다.'
      depends_on: []
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: '$\int_0^\pi\sin^2x\,dx=\frac{\pi}{2}$를 계산해서 정답 $(2\pi-4)e^{\frac{\pi}{2}}+4$를 구했다.'
      depends_on: []
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4211}
  misconceptions:
  - id: MC-CAL-4211
    outcome_code: '70'
    wrong_work: '$e^{F(x)}\sin^2x$를 적분할 때 $F''(x)=\sin^2x$를 쓰지 못하고 $e^{F(x)}$를 상수처럼 빼거나 $\int e^{F}dx=e^{F}$로 처리'
    detect_cue: '$\left(e^{F}\right)''=e^{F}\sin^2x$ 관계가 답안에 없음'
    feedback: '$F(x)=\int_0^x\sin^2t\,dt$이면 $F''(x)=\sin^2x$입니다. 그래서 $e^{F(x)}\sin^2x$는 $e^{F(x)}$의 도함수입니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    [문제 3-2] 좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 좌표는 $(\cos t,\sin t)$이다. 여기서 $t$의 범위는 $0\le t\le\dfrac{\pi}{4}$이다. 제1사분면에 속한 점 $\mathrm{Q}$는 곡선 $y=(x+1)(x-1)^2$ 위에 있고, 점 $\mathrm{P}$와 거리를 $2\sqrt2$로 유지하며 연속적으로 움직인다. 점 $\mathrm{Q}$가 $(2,3)$을 지날 때, 점 $\mathrm{Q}$의 속도 $\left(\dfrac{dx}{dt},\dfrac{dy}{dt}\right)$를 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\left(\dfrac{13}{126},\dfrac{13}{18}\right)', equivalents: ['(13/126, 13/18)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '거리식을 $t$로 미분해 $\dfrac{dx}{dt}$를 풀고, $\mathrm{Q}(2,3)$에 대응하는 $\mathrm{P}\left(\frac{12}{13},\frac{5}{13}\right)$, $\dfrac{dy}{dx}=7$을 대입.'
    steps:
    - {id: 2a, content: '$\dfrac{dx}{dt}=\dfrac{13}{126}$, $\dfrac{dy}{dt}=7\cdot\dfrac{13}{126}=\dfrac{13}{18}$', criteria: [2.M1, 2.B1, 2.B2]}
    hint_ladder:
    - 거리 조건 $(x-\cos t)^2+(y-\sin t)^2=8$은 모든 시각 $t$에서 성립한다.
    - '$y$는 $x$의 함수이고 $x$는 $t$의 함수다. $\frac{dy}{dt}=\frac{dy}{dx}\frac{dx}{dt}$.'
    - Q가 $(2,3)$일 때의 $t$를 먼저 구하자. $t$의 범위에 주의.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2022 논술가이드북(자연) p.56 예시답안
    steps:
    - id: 2b-1
      content: |
        $(x-\cos t)^2+(y-\sin t)^2=8$이다. $t$에 대하여 음함수, 합성함수 미분하면
        $$x\frac{dx}{dt}-\frac{dx}{dt}\cos t+x\sin t+y\frac{dy}{dx}\frac{dx}{dt}-\frac{dy}{dx}\frac{dx}{dt}\sin t-y\cos t=0\quad\cdots(1)$$
        을 얻는다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $\dfrac{dy}{dx}=(x-1)^2+2(x-1)(x+1)=3x^2-2x-1$이고, $x=2$일 때 $\dfrac{dy}{dx}=7$이다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        $\mathrm{Q}=(2,3)$에 대응되는 $\mathrm{P}$를 구하기 위하여
        $$(\cos t-2)^2+(\sin t-3)^2=8$$
        을 풀면 $2\cos t+3\sin t=3$이고 제곱하여 $4\cos^2t=9(1-\sin t)^2$의 근을 구하면 $\sin t=\dfrac5{13}$, $1$이다. $0\le t\le\dfrac{\pi}{4}$이므로 대응되는 $\mathrm{P}$는 $\left(\dfrac{12}{13},\dfrac5{13}\right)$이다.
      criteria: [2.B1]
    - id: 2b-4
      content: |
        식 (1)에 대입하면 $\dfrac{dx}{dt}=\dfrac{13}{126}$, $\dfrac{dy}{dt}=\dfrac{dy}{dx}\dfrac{dx}{dt}=\dfrac{91}{126}=\dfrac{13}{18}$이다.
      criteria: [2.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: '$x\frac{dx}{dt}-\frac{dx}{dt}\cos t+x\sin t+y\frac{dy}{dx}\frac{dx}{dt}-\frac{dy}{dx}\frac{dx}{dt}\sin t-y\cos t=0$을 구했다.'
      depends_on: []
      steps: [2b-1]
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: '$\mathrm{Q}=(2,3)$에 대응되는 $\mathrm{P}=\left(\frac{12}{13},\frac{5}{13}\right)$를 구했다.'
      depends_on: []
      steps: [2b-3]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: '$x=2$일 때 $\frac{dy}{dx}=7$ 등을 감안하여 $\frac{dx}{dt}=\frac{13}{126}$, $\frac{dy}{dt}=\frac{91}{126}=\frac{13}{18}$을 구했다.'
      depends_on: []
      steps: [2b-2, 2b-4]
    deductions:
    - code: D2-1
      condition: 공식 주석 — 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능, 채점자는 답안의 완성도에 따라 −0.5~+0.5점 부여 가능
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4212}
  misconceptions:
  - id: MC-CAL-4212
    outcome_code: '70'
    wrong_work: '$\sin t=1$($t=\frac{\pi}{2}$, $\mathrm{P}(0,1)$)을 택해 대입'
    detect_cue: '$\mathrm{P}=(0,1)$ 또는 $\cos t=0$을 대입한 계산'
    feedback: '$t$의 범위가 $0\le t\le\frac{\pi}{4}$입니다. 범위 밖 근 $\sin t=1$은 버려야 합니다(제곱하면서 생긴 근인지도 확인).'
    remedy: [RL-2]

