intent: 경우의 수를 계산하기 위하여 「같은 것이 있는 순열」의 개념을 사용할 수 있는지와 이를 이용하여 확률과 연관시킬 수 있는 능력을 평가한다. 확률의 개념의 이해도 및 경우의 수에 대한 이해도를 평가하며 난이도는 「중」 정도로 볼 수 있다(가이드북 출제의도 요지).
key_idea: 'Q(12,8)까지 경로는 앞면 10·뒷면 2의 배열 $_{12}C_2=66$가지로 모두 같은 확률. $x$축에 닿지 않으려면 처음 두 번은 앞면이고 셋째가 앞면(→(3,3)) 또는 뒷면 후 앞면(→(4,2))으로 나누어 $36+8=44$.'
stuck: 「Q에 도착했다」는 조건 아래 모든 경로가 같은 확률이므로 경로 수의 비로 바뀐다는 점과, 닿지 않는 경로를 초반 움직임으로 분류하는 단계
