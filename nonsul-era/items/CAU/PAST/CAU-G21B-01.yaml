stimuli: []

stem: |
  좌표평면 위의 점 P는 동전을 한 번 던져서 앞면이 나오면 오른쪽 대각선 방향의 위(↗)로 한 칸만큼, 뒷면이 나오면 오른쪽 대각선 방향의 아래(↘)로 한 칸만큼 이동한다. 동전을 반복적으로 던지는 실험의 결과, 아래의 그림과 같이 원점 O에서 출발한 점 P가 점 Q(12, 8)에 도착했다고 할 때, 원점을 출발한 이후 점 P가 $x$축에 닿지 않았을 확률을 구하시오. [20점]

  [그림] 원점 O에 놓인 점 P에서 ↗ 화살표는 점 $(1,1)$, $(2,2)$ 쪽으로, ↘ 화살표는 점 $(1,-1)$ 쪽으로 그려져 있고, 한 칸 이동은 $x$좌표 $+1$, $y$좌표 $\pm1$이다. 오른쪽 위에 점 Q(12, 8)이 표시되어 있다.

subparts:
- id: '1'
  stem: |
    점 P가 Q(12, 8)에 도착했을 때, 원점을 출발한 이후 $x$축에 닿지 않았을 확률을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac{2}{3}', equivalents: ['2/3', '44/66'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $n={}_{12}C_2=66$, 닿지 않는 경로 $m={}_9C_2+{}_8C_1=36+8=44$(여사건으로 $66-(11+10+1)$도 가능).
    steps:
    - {id: 1a, content: '$p=\dfrac{44}{66}=\dfrac23$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - Q에 도착한 경로들은 모두 같은 확률을 갖는다. 그렇다면 확률은 무엇의 비인가?
    - 앞면·뒷면이 각각 몇 번 나와야 Q에 도착하는가?
    - $x$축에 닿지 않으려면 처음 몇 번은 반드시 앞면이어야 하는가? 셋째 던짐으로 나누어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 논술가이드북(자연) p.74 예시답안
    steps:
    - id: 1b-1
      content: |
        $\mathrm{P}\to\mathrm{Q}$로 진행되는 모든 경로는 동일한 확률($=(1/2)^{12}$)을 가지므로, P가 $x$축에 닿지 않았을 확률 $p$는 다음과 같이 구할 수 있다.
        $$p=\frac{\mathrm{P}\to\mathrm{Q}\text{의 경로 중에서 }x\text{축에 닿지 않는 경우의 수}}{\mathrm{P}\to\mathrm{Q}\text{의 경우의 수}}\left(=\frac{m}{n}\right)$$
        ※ 참고: 조건부 확률 및 이항분포 형태를 고려하여 $p=\dfrac{m\times\left(\frac12\right)^{12}}{n\times\left(\frac12\right)^{12}}$과 같은 표현을 고려할 수도 있음.
      criteria: []
    - id: 1b-2
      content: |
        (1) $n$의 값: Q점에 도착하기 위한 동전의 앞면(H)이 나온 횟수를 $a$, 뒷면(T)의 횟수를 $b$라고 하면, 다음과 같은 관계식을 유도할 수 있다. $a+b=12$, $a-b=8$. 따라서, $a=10$, $b=2$이다. 즉, 10개의 H와 2개의 T를 일렬로 배열하는 경우의 수이다.
        $$n={}_{12}C_{10}={}_{12}C_2=\frac{12\times11}{2}=66.$$
      criteria: [1.B1]
    - id: 1b-3
      content: |
        (2) $m$의 값: $x$축에 닿지 않는 경로는 다음의 2가지 경우로 나눠 생각할 수 있다.
        (ⅰ) P가 $(0,0)\to(1,1)\to(2,2)\to(3,3)$으로 진행한 경우: 이 경우는, 7개의 H와 2개의 T를 일렬로 배열하는 경우의 수이다. $m_1={}_9C_7={}_9C_2=\dfrac{9\times8}{2}=36$
      criteria: [1.B2]
    - id: 1b-4
      content: |
        (ⅱ) P가 $(0,0)\to(1,1)\to(2,2)\to(3,1)\to(4,2)$로 진행한 경우: 이 경우는, 7개의 H와 1개의 T를 일렬로 배열하는 경우의 수이다. $m_2={}_8C_7={}_8C_1=8$
      criteria: [1.B3]
    - id: 1b-5
      content: |
        (3) 확률 $p$의 계산: 따라서, $m=m_1+m_2=44$이므로, $p=\dfrac{44}{66}=\dfrac23$.
      criteria: [1.B4]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2022 논술가이드북(자연) p.74 ※ 여사건 풀이
    steps:
    - id: 1c-1
      content: |
        $m$의 계산을 위하여, 다음과 같이 여사건을 이용할 수도 있다. 즉, $x$축에 닿고 Q점에 도달하는 경우는 다음과 같은 세 가지 경우이다.
        (ⅰ) P가 $(0,0)\to(1,-1)$로 진행한 경우: $m_1^*={}_{11}C_1=11$
        (ⅱ) P가 $(0,0)\to(1,1)\to(2,0)$으로 진행한 경우: $m_2^*={}_{10}C_1=10$
        (ⅲ) P가 $(0,0)\to(1,1)\to(2,2)\to(3,1)\to(4,0)$으로 진행한 경우: $m_3^*={}_8C_0=1$
      criteria: [1.B2]
    - id: 1c-2
      content: |
        따라서, 위의 세 가지 경우의 합(여사건의 경우의 수, $m^*$)을 이용하여,
        $$m=n-m^*=n-(m_1^*+m_2^*+m_3^*)=66-(11+10+1)=66-22=44.$$
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 7
      evidence: Q점에 도착하기 위한 모든 경로의 수 $n=66$을 바르게 계산했다. [$a$, $b$의 값만 구한 경우 +2]
      depends_on: []
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: $x$축에 닿지 않는 경로의 수 $m_1=36$을 바르게 계산했다. [여사건 풀이는 1.B2·1.B3 합쳐 10점 — 각 여사건 $m_1^*$, $m_2^*$, $m_3^*$에 대하여 3점씩, 총합 $m^*=22$ 계산 1점]
      depends_on: []
      steps: [1b-3, 1c-1]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: $x$축에 닿지 않는 경로의 수 $m_2=8$을 바르게 계산했다(여사건 풀이는 $m=n-m^*=44$까지).
      depends_on: []
      steps: [1b-4, 1c-2]
    - id: 1.B4
      mark_type: B
      points: 3
      evidence: $n$과 $m$을 이용하여 확률 $p=\dfrac23$을 바르게 계산했다.
      depends_on: []
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 공식 주석 — 계산 실수로 틀렸어도 논리 전개 과정이 맞으면 해당 부분에 1~2점의 부분 점수 부여, 각 부분을 바르게 작성한 경우에도 답안의 완성도에 따라 총점 20점 이내에서 ±1점 추가 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점(직접 분류)}
  - {code: '21', meaning: 만점(여사건)}
  - {code: '70', misconception: MC-PRB-4213}
  misconceptions:
  - id: MC-PRB-4213
    outcome_code: '70'
    wrong_work: '여사건에서 $(0,0)\to(1,1)\to(2,2)\to(3,1)\to(4,0)$ 경우(1가지)나 첫 이동이 ↘인 경우를 빠뜨려 $m^*=21$ 또는 $11$로 셈'
    detect_cue: '$m\ne44$, 확률이 $\frac{45}{66}$, $\frac{55}{66}$ 등'
    feedback: 축에 닿는 경로는 「처음 닿는 시점」으로 나누면 빠짐없이 셀 수 있습니다(1번째, 2번째, 4번째 이동에서 처음 닿음).
    remedy: [RL-1]

