intent: '(1) 복잡한 형태의 수열의 극한을 간단한 형태의 수열의 분수와 곱의 형태로 이해하여 극한을 구할 수 있는지, 급수와 정적분 사이의 관계를 이해하여 수열의 극한을 정적분 형태로 표현할 수 있는지 평가한다. (2) 함수의 기본적인 성질을 이용하여 함수에 대한 정보를 도출하는 과정과, 정적분을 치환적분과 정적분의 기하적 의미로 계산할 수 있는지 평가한다(가이드북 출제의도 요지).'
key_idea: '(1) 분자·분모에 $\dfrac1{n^5}$을 곱하면 분모 $\to\int_0^1(1+x)^4dx=\dfrac{31}{5}$, 분자 $\to\int_0^1x^4dx=\dfrac15$(나머지 항 $\to0$). (2) 제곱식과 $x\to20-x$ 대입식을 연립해 $3f(x)^2=100-(x-10)^2$, 원의 일부 넓이로 적분.'
stuck: (1) 분자에서 $\sqrt n$이 들어간 항들이 $n^5$보다 낮은 차수라 0으로 수렴함을 엄밀히 처리하는 단계 / (2) $x\to20-x$ 대입으로 $f(x)^2$, $f(20-x)^2$의 연립방정식을 만드는 단계
idea_tags: [IDEA-RIEMANN-SUM-RATIO, IDEA-FUNC-EQ-SYMMETRIC-SUBST, IDEA-INTEGRAL-AS-CIRCLE-AREA]
tags: [구분구적법, 수열의 극한, 함수방정식, 치환적분, 원의 넓이, 중앙대 실전]
elements:
  materials: ['분수형 수열 $\dfrac{\sum_{k=1}^{n}(\sqrt n+k)^4}{\sum_{k=1}^{n}(n+k)^4}$', '$[0,20]$에서 정의된 $f$와 $f(20-x)=\sqrt{-x^2+20x-2(f(x))^2}$', '정적분 $\int_0^{10}xf(x)dx$']
  concepts: [수열의 극한의 성질, 정적분과 급수의 합의 관계, 이항정리(4제곱 전개), 거듭제곱의 합, 함수방정식, 치환적분법, 원의 넓이]
  tools: [분자·분모에 1/n^5 곱하기, 구분구적법, 4제곱 전개와 거듭제곱 합 공식, 0으로 수렴하는 항 처리, 제곱 후 x→20−x 대입·연립, u=(x−10)/10 치환, 사분원 넓이·기함수 적분]
  conditions:
  - '(1) 분모 $(n+k)^4=n^4\left(1+\frac kn\right)^4$ ⇒ $\frac1{n^5}\sum\to\int_0^1(1+x)^4dx$'
  - '(1) 분자 $(k+\sqrt n)^4$의 $\sqrt n$ 포함 항은 $\frac1{n^5}$배 하면 0으로 수렴 ⇒ 분자 극한은 $\int_0^1x^4dx$'
  - '(2) 근호 값은 0 이상 ⇒ $f(20-x)\ge0$, 즉 $f\ge0$이라 $f=\frac{1}{\sqrt3}\sqrt{100-(x-10)^2}$'
  - '(2) 식은 $[0,20]$의 모든 $x$에서 성립 ⇒ $x$ 대신 $20-x$ 대입 가능'
  stimuli_used: ['1', '2', '3', '4']
