stimuli:
- label: '1'
  body: |
    실수 $a$, $b$에 대하여 $(a+b)^4=a^4+4a^3b+6a^2b^2+4ab^3+b^4$이 성립한다.
- label: '2'
  body: |
    수열 $\{a_n\}$, $\{b_n\}$이 수렴하고 $\displaystyle\lim_{n\to\infty}a_n=\alpha$, $\displaystyle\lim_{n\to\infty}b_n=\beta$일 때, 다음 식이 성립한다.
    $$\lim_{n\to\infty}a_nb_n=\left(\lim_{n\to\infty}a_n\right)\left(\lim_{n\to\infty}b_n\right)=\alpha\beta,\qquad\lim_{n\to\infty}\frac{a_n}{b_n}=\frac{\displaystyle\lim_{n\to\infty}a_n}{\displaystyle\lim_{n\to\infty}b_n}=\frac{\alpha}{\beta}\quad(\text{단, }\beta\neq0)$$
- label: '3'
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$의 한 부정적분을 $F(x)$라 할 때, 다음 식이 성립한다.
    $$\int_a^bf(x)dx=F(b)-F(a)$$
- label: '4'
  body: |
    미분가능한 함수 $g(t)$에 대하여 $x=g(t)$로 놓으면, 다음 식이 성립한다.
    $$\int f(x)dx=\int f(g(t))g'(t)dt$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 2-1] 다음 극한값을 구하시오. [10점]
    $$\lim_{n\to\infty}\frac{(\sqrt n+1)^4+(\sqrt n+2)^4+(\sqrt n+3)^4+(\sqrt n+4)^4+\cdots+(\sqrt n+n)^4}{(n+1)^4+(n+2)^4+(n+3)^4+(n+4)^4+\cdots+(2n)^4}$$
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{1}{31}', equivalents: ['1/31'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 분모 $\frac1{n^5}\sum(n+k)^4\to\frac{31}{5}$, 분자 $\frac1{n^5}\sum(k+\sqrt n)^4\to\frac15$.
    steps:
    - {id: 1a, content: '$\dfrac{1/5}{31/5}=\dfrac1{31}$', criteria: [1.M1, 1.B1]}
    hint_ladder:
    - 분자와 분모의 합은 각각 몇 차의 크기로 커지는가?
    - '분자·분모에 $\dfrac1{n^5}$을 곱해 정적분과 급수의 관계를 써 보자.'
    - '분자의 $(k+\sqrt n)^4$을 전개하면 $\sqrt n$이 붙은 항은 결국 0으로 간다.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 논술가이드북(자연) p.75 예시답안 [방법 1]
    steps:
    - id: 1b-1
      content: |
        우선 문제에 주어진 식을 다음과 같이 정리한다.
        $$\lim_{n\to\infty}\frac{\sum_{k=1}^n(k+\sqrt n)^4}{\sum_{k=1}^n(n+k)^4}=\frac{\lim_{n\to\infty}\frac1{n^5}\sum_{k=1}^n(k+\sqrt n)^4}{\lim_{n\to\infty}\frac1{n^5}\sum_{k=1}^n(n+k)^4}$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        분모는 정적분과 급수의 합과의 관계를 이용하여
        $$\lim_{n\to\infty}\frac1{n^5}\sum_{k=1}^n(n+k)^4=\lim_{n\to\infty}\frac1n\sum_{k=1}^n\left(1+\frac kn\right)^4=\int_0^1(1+x)^4dx=\frac{31}{5}$$
        를 얻는다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        분자는 다음과 같이 식을 정리한 후
        $$\sum_{k=1}^n(k+\sqrt n)^4=\sum_{k=1}^nk^4+4\sqrt n\sum_{k=1}^nk^3+6n\sum_{k=1}^nk^2+4n\sqrt n\sum_{k=1}^nk+n^2$$
        거듭제곱의 합 공식을 적용한다.
        $$\sum_{k=1}^n(k+\sqrt n)^4=\sum_{k=1}^nk^4+4\sqrt n\left(\frac{n(n+1)}{2}\right)^2+6n\frac{n(n+1)(2n+1)}{6}+4n\sqrt n\frac{n(n+1)}{2}+n^2$$
      criteria: [1.B1]
    - id: 1b-4
      content: |
        그리고 정적분과 급수의 합과의 관계를 이용하여 극한을 취한다.
        $$\lim_{n\to\infty}\frac1{n^5}\sum_{k=1}^n(k+\sqrt n)^4=\lim_{n\to\infty}\frac1n\sum_{k=1}^n\left(\frac kn\right)^4+0=\int_0^1x^4dx=\frac15$$
        마지막으로 분자의 극한을 분모의 극한으로 나누어 정답 $\dfrac1{31}$을 얻는다.
      criteria: [1.B1]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2022 논술가이드북(자연) p.75 예시답안 [방법 2]
    steps:
    - id: 1c-1
      content: |
        위 예시답안에서 분자의 극한을 취할 때, 식을 다음과 같이 정리한 후,
        $$\frac1{n^5}\sum_{k=1}^n(k+\sqrt n)^4=\frac1n\sum_{k=1}^n\left(\frac kn\right)^4+\frac4{\sqrt n}\frac1n\sum_{k=1}^n\left(\frac kn\right)^3+\frac6n\frac1n\sum_{k=1}^n\left(\frac kn\right)^2+\frac4{n\sqrt n}\frac1n\sum_{k=1}^n\left(\frac kn\right)+\frac1{n^2}$$
        정적분과 급수의 합과의 관계를 이용하여
        $$\lim_{n\to\infty}\frac1{n^5}\sum_{k=1}^n(k+\sqrt n)^4=\int_0^1x^4dx+0\cdot\int_0^1x^3dx+0\cdot\int_0^1x^2dx+0\cdot\int_0^1xdx+0=\frac15$$
        를 얻을 수도 있다. 나머지 과정은 동일하다.
      criteria: [1.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 분모와 분자에 $\dfrac1{n^5}$를 곱한 후, 정적분과 급수의 합과의 관계를 적용했다.
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.B1
      mark_type: B
      points: 6
      evidence: 정적분과 급수의 합과의 관계를 이용한 계산을 통해 정답 $\dfrac1{31}$을 얻었다.
      depends_on: []
      steps: [1b-3, 1b-4, 1c-1]
    deductions:
    - code: D1-1
      condition: 분자를 다룰 때 0으로 수렴하는 항들을 엄밀하게 처리하지 않았다면 최대 3점 감점(전혀 언급이 없으면 3점 감점, 과정이 미흡하면 1~2점 감점)
      effect: minus
      value: 3
  outcome_codes:
  - {code: '20', meaning: 만점(방법 1)}
  - {code: '21', meaning: 만점(방법 2)}
  - {code: '70', misconception: MC-CAL-4214}
  misconceptions:
  - id: MC-CAL-4214
    outcome_code: '70'
    wrong_work: '분자도 $n^4\left(\frac{1}{\sqrt n}+\frac kn\right)^4$처럼 보고 분모와 같은 차수로 처리하거나 $\sqrt n$을 $n$과 같은 크기로 보아 극한을 $1$ 등으로 답함'
    detect_cue: 극한값이 $\frac1{31}$이 아님, $\sqrt n$ 항의 차수 비교가 없음
    feedback: '$(k+\sqrt n)^4$에서 $k$는 최대 $n$, $\sqrt n$은 그보다 낮은 차수입니다. $\frac1{n^5}$을 곱하면 $\sqrt n$이 붙은 항은 0으로 갑니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    [문제 2-2] 닫힌구간 $[0,20]$에서 정의된 함수 $f(x)$가 다음 식을 만족한다.
    $$f(20-x)=\sqrt{-x^2+20x-2(f(x))^2}$$
    이때, 정적분 $\displaystyle\int_0^{10}xf(x)dx$의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{1000}{\sqrt3}\left(\dfrac{\pi}{4}-\dfrac13\right)', equivalents: ['1000/sqrt(3)*(pi/4-1/3)', '\frac{250\sqrt3\pi}{3}-\frac{1000\sqrt3}{9}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '제곱식과 $x\to20-x$ 대입식을 연립해 $f(x)=\frac1{\sqrt3}\sqrt{100-(x-10)^2}$, $u=\frac{x-10}{10}$으로 사분원 넓이와 기함수꼴 적분.'
    steps:
    - {id: 2a, content: '$\dfrac{1000}{\sqrt3}\left(\int_{-1}^0\sqrt{1-u^2}du+\int_{-1}^0u\sqrt{1-u^2}du\right)=\dfrac{1000}{\sqrt3}\left(\dfrac{\pi}{4}-\dfrac13\right)$', criteria: [2.B1, 2.B2, 2.M1, 2.B3]}
    hint_ladder:
    - 양변을 제곱하면 $f(x)^2$와 $f(20-x)^2$가 나온다.
    - '$x$ 대신 $20-x$를 넣은 식을 하나 더 만들어 연립하자.'
    - '$\sqrt{100-(x-10)^2}$는 반원의 식이다.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2022 논술가이드북(자연) p.76 예시답안
    steps:
    - id: 2b-1
      content: |
        주어진 식을 제곱하여 $2f(x)^2+f(20-x)^2=-x^2+20x$를 얻는다. 위 식의 양변에 2를 곱하여 $4f(x)^2+2f(20-x)^2=-2x^2+40x$를 얻는다. 그리고 첫 번째 식에 $x$대신 $20-x$를 대입하여
        $$2f(20-x)^2+f(x)^2=-(20-x)^2+20(20-x)=-x^2+20x$$
        를 얻는다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        위의 식에서 아래의 식을 빼면 $3f(x)^2=-x^2+20x=100-(x-10)^2$를 얻을 수 있는데, 따라서
        $$f(x)=\frac1{\sqrt3}\sqrt{100-(x-10)^2}$$
        이다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        적분에 이 식을 대입한 후 $u=\dfrac{x-10}{10}$으로 치환하여 적분을 계산한다.
        $$\int_0^{10}xf(x)dx=\frac1{\sqrt3}\int_0^{10}x\sqrt{100-(x-10)^2}dx=\frac{1000}{\sqrt3}\int_{-1}^0(u+1)\sqrt{1-u^2}du$$
      criteria: [2.M1]
    - id: 2b-4
      content: |
        $$=\frac{1000}{\sqrt3}\left(\int_{-1}^0\sqrt{1-u^2}du+\int_{-1}^0u\sqrt{1-u^2}du\right)=\frac{1000}{\sqrt3}\left(\frac{\pi}{4}-\frac13\right)$$
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: |
        $20-x$를 대입하여 새로운 식 $2f(20-x)^2+f(x)^2=-x^2+20x$를 얻었다. [보충: 주어진 식의 대칭성을 파악하면 바로 $3f(x)^2=100-(x-10)^2$을 얻을 수도 있으며 이 경우 감점하지 않음(2.B1·2.B2 합쳐 +6)]
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: $f(x)^2$과 $f(20-x)^2$에 대한 연립방정식을 풀어서 $f(x)=\dfrac1{\sqrt3}\sqrt{100-(x-10)^2}$을 얻었다.
      depends_on: []
      steps: [2b-2]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 적분을 계산하기 위해 치환 적분을 이용하거나 원의 면적을 이용했다.
      depends_on: []
      steps: [2b-3]
    - id: 2.B3
      mark_type: B
      points: 6
      evidence: 계산을 수행하여 정답 $\dfrac{1000}{\sqrt3}\left(\dfrac{\pi}{4}-\dfrac13\right)$을 얻었다.
      depends_on: []
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4204}
  - {code: '71', misconception: MC-CAL-4215}
  misconceptions:
  - id: MC-CAL-4204
    outcome_code: '70'
    wrong_work: '$f(20-x)=f(x)$라고 가정하고 $3f(x)^2=-x^2+20x$를 근거 없이 씀'
    detect_cue: '$x\to20-x$ 대입식이 없고 대칭을 가정만 함'
    feedback: 대칭을 가정하지 말고 $x$ 대신 $20-x$를 넣은 식을 만들어 두 식을 연립하세요.
    remedy: [RL-2]
  - id: MC-CAL-4215
    outcome_code: '71'
    wrong_work: '$\int_{-1}^0\sqrt{1-u^2}du$를 $\frac{\pi}{2}$(반원)로 계산'
    detect_cue: 답에 $\frac{\pi}{2}$가 들어감
    feedback: '$u$가 $-1$에서 $0$까지이므로 단위원의 사분원 넓이 $\frac{\pi}{4}$입니다.'
    remedy: [RL-3]

