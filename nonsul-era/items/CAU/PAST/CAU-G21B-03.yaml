key_idea: '(1) 속력 $\sqrt{1+4(t^2-2t+2)(t-1)^2}=2(t-1)^2+1$(완전제곱), 최소 시각 $t_0=1$. (2) 넓이 $=\frac12\dfrac{\tan\theta\sqrt{1+\tan^2\theta}}{\sqrt{(1-\tan^2\theta)^2+\tan^2\theta}}$, $s=\tan^2\theta$로 $f^2=\dfrac{s^2+s}{4(s^2-s+1)}$의 최대.'
stuck: (1) 근호 안을 $(2(t-1)^2+1)^2$로 정리하는 단계 / (2) 넓이를 $\tan\theta$만의 식으로 바꾸고 $\theta=\frac{\pi}{4}$, $\frac{\pi}{2}$(탄젠트 정의 안 됨)를 따로 처리하는 단계
