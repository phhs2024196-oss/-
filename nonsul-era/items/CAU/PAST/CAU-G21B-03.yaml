stimuli:
- label: '1'
  body: |
    좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 위치 $(x,y)$가 $x=f(t)$, $y=g(t)$일 때, 속력은 $\sqrt{(f'(t))^2+(g'(t))^2}$이다.
- label: '2'
  body: |
    직선 $y=mx+n$이 $x$축의 양의 방향과 이루는 각의 크기를 $\theta$라고 하면 $\tan\theta=m$이다.
- label: '3'
  body: |
    각 $\alpha$와 $\beta$에 대하여 다음 식이 성립한다.
    $$\tan(\alpha+\beta)=\frac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}\quad\left(\text{단, }\alpha\neq\frac{\pi}{2},\ \beta\neq\frac{\pi}{2},\ \tan\alpha\tan\beta\neq1\right)$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 3-1] 좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 위치 $(x,y)$가
    $$x=t,\qquad y=\frac23(t^2-2t+2)^{\frac32}$$
    이다. 점 $\mathrm{P}$의 속력이 최소가 되는 시각을 $t_0$이라 할 때, 시각 $t=0$에서 시각 $t=t_0$까지 점 $\mathrm{P}$가 움직인 거리를 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{5}{3}', equivalents: ['5/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\lvert v\rvert=2(t-1)^2+1$, $t_0=1$, $\int_0^1\{2(t-1)^2+1\}dt=\frac53$.'
    steps:
    - {id: 1a, content: '$\int_0^1\{2(t-1)^2+1\}dt=\dfrac23+1=\dfrac53$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - '$\dfrac{dy}{dt}$를 구할 때 합성함수 미분을 쓰자.'
    - '근호 안 $1+4(t^2-2t+2)(t-1)^2$를 $(t-1)^2$에 대한 식으로 보자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 논술가이드북(자연) p.76 예시답안
    steps:
    - id: 1b-1
      content: |
        우선 점 $\mathrm{P}$의 속력은 정의로부터 다음과 같다.
        $$\lvert v\rvert=\sqrt{1+4(t^2-2t+2)(t-1)^2}$$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        루트 내부의 식을 완전 제곱식으로 정리를 하면,
        $$\lvert v\rvert=\sqrt{1+4((t-1)^2+1)(t-1)^2}=\sqrt{4(t-1)^4+4(t-1)^2+1}=\sqrt{(2(t-1)^2+1)^2}=2(t-1)^2+1$$
        이다. 따라서 속력이 최소인 시각 $t_0$은 1이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        마지막으로 위에서 얻은 속력에 대한 식을 적분하여 점 $\mathrm{P}$의 이동거리를 구한다.
        $$\int_0^1\{2(t-1)^2+1\}dt=\left(\frac23(1-1)^3+1\right)-\left(\frac23(0-1)^3+0\right)=\frac53$$
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: '$\lvert v\rvert=\sqrt{1+4(t^2-2t+2)(t-1)^2}$를 계산했다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: '$\lvert v\rvert=2(t-1)^2+1$을 구했다.'
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: 적분하여 $\dfrac53$을 구했다.
      depends_on: []
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4208}
  misconceptions:
  - id: MC-CAL-4208
    outcome_code: '70'
    wrong_work: '$\dfrac{dy}{dt}=(t^2-2t+2)^{\frac12}$로 안쪽 함수의 도함수 $2t-2$를 곱하지 않음'
    detect_cue: 속력 식에 $(t-1)$ 인수가 없음
    feedback: '$y=\frac23u^{3/2}$, $u=t^2-2t+2$이므로 $\frac{dy}{dt}=u^{1/2}\cdot(2t-2)$입니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    [문제 3-2] 좌표평면 위에 원점 $\mathrm{O}$가 중심이고 반지름의 길이가 $1$인 원 위의 점 $\mathrm{A}(\cos\theta,\sin\theta)$가 있다. 그리고 원점을 지나며 $x$축의 양의 방향과 이루는 각의 크기가 $2\theta$인 직선과 곡선 $x^2+\dfrac{y^2}{4}=1$의 교점을 $\mathrm{B}$라 하고, 삼각형 $\mathrm{AOB}$의 넓이의 최댓값을 $M$이라 하자. 삼각형 $\mathrm{AOB}$의 넓이를 $\tan\theta$로만 표현된 함수로 나타내고, 이를 이용하여 $M^2$을 구하시오. (단, $0\le\theta\le\dfrac{\pi}{2}$) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{3+2\sqrt3}{12}', equivalents: ['(3+2\sqrt{3})/12', '\frac14+\frac{\sqrt3}{6}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$s=\tan^2\theta$이면 $f^2=\dfrac{s^2+s}{4(s^2-s+1)}$, $(f^2)''\propto-2s^2+2s+1$ ⇒ $s=\dfrac{1+\sqrt3}{2}$.'
    steps:
    - {id: 2a, content: '$M^2=\dfrac14+\dfrac{\sqrt3}{6}=\dfrac{3+2\sqrt3}{12}$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - '$\mathrm{OA}=1$이므로 넓이는 B에서 직선 OA까지 거리의 절반이다.'
    - '$\tan2\theta$를 $\tan\theta$로 바꾸어 정리하자. $\theta=\frac{\pi}{4}$, $\frac{\pi}{2}$는 따로 확인.'
    - '$s=\tan^2\theta$로 두고 넓이의 제곱을 최대화하자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2022 논술가이드북(자연) p.77 예시답안 [방법 1]
    steps:
    - id: 2b-1
      content: |
        교점 $\mathrm{B}(x_0,y_0)$는 $x^2+\dfrac{y^2}{4}=1$과 $y=(\tan2\theta)x$ $\left(\theta\neq\dfrac{\pi}{4}\right)$의 교점이다. 연립해서 풀면 $x_0^2=\dfrac{4}{4+\tan^2(2\theta)}$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $\mathrm{B}(x_0,y_0)$과 $y=(\tan\theta)x$ $\left(\theta\neq\dfrac{\pi}{2}\right)$와의 거리는 $\dfrac{\lvert x_0\tan\theta-y_0\rvert}{\sqrt{1+\tan^2\theta}}=\dfrac{\lvert x_0\tan\theta-x_0\tan(2\theta)\rvert}{\sqrt{1+\tan^2\theta}}$이다. 따라서, 삼각형 AOB의 넓이는
        $$\frac12\frac{\lvert\tan\theta-\tan(2\theta)\rvert}{\sqrt{1+\tan^2\theta}}\lvert x\rvert=\frac{\lvert\tan\theta-\tan(2\theta)\rvert}{\sqrt{1+\tan^2\theta}}\frac{1}{\sqrt{4+\tan^2(2\theta)}}$$
        이고 $\tan2\theta=\dfrac{2\tan\theta}{1-\tan^2\theta}$를 이용하여 정리하면 $\dfrac12\dfrac{\tan\theta\sqrt{1+\tan^2\theta}}{\sqrt{(1-\tan^2\theta)^2+\tan^2\theta}}$이다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        이 공식에 $\theta=\dfrac{\pi}{4}$를 대입하면 $\dfrac{\sqrt2}{2}$ 값을 갖고 이것은 직접 구한 삼각형의 넓이와 같다. 삼각형 AOB의 넓이를 나타내는 함수 $f(\theta)$는 아래와 같다.
        $$f(\theta)=\begin{cases}\dfrac12\dfrac{\tan\theta\sqrt{1+\tan^2\theta}}{\sqrt{(1-\tan^2\theta)^2+\tan^2\theta}} & \left(\theta\neq\dfrac{\pi}{2}\right)\\[2mm] \dfrac12 & \left(\theta=\dfrac{\pi}{2}\right)\end{cases}$$
      criteria: [2.B2]
    - id: 2b-4
      content: |
        $f^2$의 최댓값을 구하면 된다. $s=\tan^2\theta$ $(s\ge0)$로 쓰면 $f^2=\dfrac{s(1+s)}{4\{(1-s)^2+s\}}=\dfrac{s^2+s}{4(s^2-s+1)}$이고 미분하면 $\dfrac{-2s^2+2s+1}{4(s^2-s+1)^2}$이다. 따라서 $s=\dfrac{1+\sqrt3}{2}$에서 최댓값을 갖고 $M^2=\dfrac14+\dfrac{\sqrt3}{6}=\dfrac{3+2\sqrt3}{12}$이다.
      criteria: [2.B3]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 2022 논술가이드북(자연) p.77 예시답안 [방법 2]
    steps:
    - id: 2c-1
      content: |
        삼각형의 넓이를 구하는 다른 방법이다. $\mathrm{B}(x_0,y_0)$에서 $x_0^2=\dfrac{4}{4+\tan^2(2\theta)}$이고 $y_0^2=\dfrac{4\tan^2(2\theta)}{4+\tan^2(2\theta)}$이므로 선분 OB의 길이는 $\dfrac{2\sqrt{1+\tan^2(2\theta)}}{\sqrt{4+\tan^2(2\theta)}}$이다. 따라서 삼각형 AOB의 넓이는 $\dfrac12\cdot\dfrac{2\sqrt{1+\tan^2(2\theta)}}{\sqrt{4+\tan^2(2\theta)}}\sin\theta$이다.
      criteria: [2.B1]
    - id: 2c-2
      content: |
        $\sin\theta=\dfrac{\tan\theta}{\sqrt{\tan^2\theta+1}}$와 $\tan(2\theta)=\dfrac{2\tan\theta}{1-\tan^2\theta}$를 이용하여 정리하면 삼각형 AOB의 넓이는 $\dfrac{\tan\theta\sqrt{1+\tan^2\theta}}{2\sqrt{(1-\tan^2\theta)^2+\tan^2\theta}}$이다. 이 후 과정은 예시답안과 같다.
      criteria: [2.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: '교점 $\mathrm{B}(x_0,y_0)$: $x_0=\frac{2}{\sqrt{4+\tan^22\theta}}$, $y_0=\frac{2\tan2\theta}{\sqrt{4+\tan^22\theta}}$를 구했다.'
      depends_on: []
      steps: [2b-1, 2c-1]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: '삼각형의 넓이 $\frac12\frac{\tan\theta\sqrt{1+\tan^2\theta}}{\sqrt{(1-\tan^2\theta)^2+\tan^2\theta}}$를 구했다.'
      depends_on: []
      steps: [2b-2, 2b-3, 2c-2]
    - id: 2.B3
      mark_type: B
      points: 7
      evidence: '$\tan^2\theta=\frac{1+\sqrt3}{2}$에서 최댓값을 갖고 그 값이 $M^2=\frac14+\frac{\sqrt3}{6}=\frac{3+2\sqrt3}{12}$임을 구했다(공식 배점 5+2=7).'
      depends_on: []
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: '$\theta=\frac{\pi}{4}$, $\theta=\frac{\pi}{2}$인 경우에 대하여 언급이 없으면 각각 1점씩 감점(원문 표기 「$\theta=\theta/4$」)'
      effect: minus
      value: 1
    - code: D2-2
      condition: 공식 주석 — 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능, 채점자는 답안의 완성도에 따라 −0.5~+0.5점 부여 가능
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점(방법 1)}
  - {code: '21', meaning: 만점(방법 2)}
  - {code: '70', misconception: MC-GEO-4216}
  misconceptions:
  - id: MC-GEO-4216
    outcome_code: '70'
    wrong_work: '$\tan2\theta$, $\tan\theta$를 그대로 써서 $\theta=\frac{\pi}{4}$(직선이 $y$축), $\theta=\frac{\pi}{2}$에서 식이 정의되지 않는데도 따로 다루지 않음'
    detect_cue: '$\theta=\frac{\pi}{4}$, $\frac{\pi}{2}$ 언급 없음'
    feedback: 탄젠트가 정의되지 않는 각에서는 넓이를 직접 구해 공식과 일치하는지(또는 별도 값인지) 확인해야 합니다.
    remedy: [RL-2]

