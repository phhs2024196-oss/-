stimuli: []

stem: |
  주사위를 네 번 던지는 실험을 할 때, 처음으로 $6$의 눈이 나올 때까지 던졌던 횟수를 확률변수 $X$로 정의한다. 만약 네 번 던지는 동안 $6$의 눈이 나오지 않는 경우는, $X=5$로 정의한다. 예를 들어, 주사위의 눈이 순서대로 $4,1,6,2$로 나오면 $X=3$이 된다. 주사위를 두 번째 던졌을 때 처음으로 $5$의 눈이 나왔다고 하자. 이때 $X$의 기댓값을 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    주사위를 두 번째 던졌을 때 처음으로 $5$의 눈이 나왔을 때, $X$의 기댓값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac{172}{45}', equivalents: ['172/45'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$P(X=1)=\frac15$, $P(X=3)=\frac45\cdot\frac16$, $P(X=4)=\frac45\cdot\frac56\cdot\frac16$, $P(X=5)=\frac45\cdot\frac56\cdot\frac56$.'
    steps:
    - {id: 1a, content: '$E(X)=\dfrac15+3\cdot\dfrac2{15}+4\cdot\dfrac19+5\cdot\dfrac59=\dfrac{172}{45}$', criteria: [1.B1, 1.B2, 1.B3, 1.B4, 1.B5]}
    hint_ladder:
    - 첫 번째 던짐의 눈은 어떤 값들이 가능한가? 각각의 확률은?
    - '$X=2$가 될 수 있는가?'
    - 세 번째, 네 번째 던짐은 조건과 무관하다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 논술가이드북(자연) p.96 예시답안
    steps:
    - id: 1b-1
      content: |
        주사위를 두 번째 던졌을 때 처음으로 5의 눈이었을 때, $X$의 확률분포는 아래와 같다.

        | 확률변수 $X$ | $1$ | $3$ | $4$ | $5$ | 계 |
        |---|---|---|---|---|---|
        | 확률 | $\frac15$ | $\left(\frac45\right)\left(\frac16\right)$ | $\left(\frac45\right)\left(\frac56\right)\left(\frac16\right)$ | $\left(\frac45\right)\left(\frac56\right)\left(\frac56\right)$ | $1$ |
        | 보조계산1 | $\frac15$ | $\frac4{30}=\frac2{15}$ | $\frac{20}{180}=\frac19$ | $\frac{100}{180}=\frac59$ | $1$ |
        | 보조계산2 | $\frac{36}{180}$ | $\frac{24}{180}$ | $\frac{20}{180}$ | $\frac{100}{180}$ | $1$ |
      criteria: [1.B1, 1.B2, 1.B3, 1.B4]
    - id: 1b-2
      content: |
        따라서, $X$의 기댓값 $=1\left(\dfrac15\right)+3\left(\dfrac2{15}\right)+4\left(\dfrac19\right)+5\left(\dfrac59\right)=\dfrac15+\dfrac25+\dfrac49+\dfrac{25}9=\dfrac{9+18+20+125}{45}=\dfrac{172}{45}$
      criteria: [1.B5]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: '$P(X=1)=\frac15$을 바르게 계산했다(확률분포 16점 중 $X=1,3,4,5$ 각 확률값 4점씩).'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: '$P(X=3)=\frac2{15}$을 바르게 계산했다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: '$P(X=4)=\frac19$을 바르게 계산했다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B4
      mark_type: B
      points: 4
      evidence: '$P(X=5)=\frac59$을 바르게 계산했다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B5
      mark_type: B
      points: 4
      evidence: $X$의 기댓값을 $X$가 가지는 값과 확률을 곱하고 더하여 $\dfrac{172}{45}$로 바르게 계산했다. [계산 결과가 틀렸어도 기댓값의 구조를 정확하게 이해하고 있으면 +2]
      depends_on: []
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: 공식 주석 — 계산 실수로 틀렸어도 논리 전개 과정이 맞으면 해당 부분에 1~2점의 부분 점수 부여, 각 부분을 바르게 작성한 경우에도 답안의 완성도에 따라 총점 20점 이내에서 ±1점 추가 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-4217}
  misconceptions:
  - id: MC-PRB-4217
    outcome_code: '70'
    wrong_work: '조건을 무시하고 $P(X=1)=\frac16$, $P(X=3)=\frac56\cdot\frac16$처럼 무조건부 확률을 쓰거나 $X=2$에 양의 확률을 줌'
    detect_cue: '$P(X=1)=\frac16$, 확률 합이 1이 아님, $X=2$ 항이 있음'
    feedback: 「두 번째에 처음으로 5」라는 조건 아래 첫 번째 눈은 5를 뺀 다섯 가지 중 하나이고 두 번째 눈은 5로 고정됩니다.
    remedy: [RL-1]

