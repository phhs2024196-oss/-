intent: 주어진 상황에서 확률변수가 가지는 값을 이해하고 관련된 확률을 이끌어 내는 능력, 특히 반복된 실험에서 동일한 확률 구조를 가지지 않는 경우의 확률 계산 이해력을 요구한다. 이산확률변수 및 그 확률분포를 이용하여 기댓값을 계산하는 능력을 평가하며 난이도는 「중·하」 정도이다(가이드북 출제의도 요지).
key_idea: '조건(첫 번째는 5가 아니고 두 번째가 5) 아래 첫 번째 눈은 $\{1,2,3,4,6\}$에서 균등 ⇒ $P(X=1)=\frac15$, $X=2$는 불가능, 이후는 일반 주사위.'
stuck: 조건 때문에 첫 번째 던짐의 확률 구조가 달라지고($6$이 나올 확률 $\frac15$), $X=2$가 불가능함을 알아채는 단계
