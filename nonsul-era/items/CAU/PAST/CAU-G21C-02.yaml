stimuli:
- label: '1'
  body: |
    함수 $f(x)$가 $x=c$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(c,f(c))$에서의 접선의 방정식은 $y-f(c)=f'(c)(x-c)$이다.
- label: '2'
  body: |
    직선 $y=mx+n$이 $x$축의 양의 방향과 이루는 각의 크기를 $\theta$라고 하면 $\tan\theta=m$이다.
- label: '3'
  body: |
    각 $\alpha$와 $\beta$에 대하여 다음 식이 성립한다.
    $$\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$$
    $$\tan(\alpha-\beta)=\frac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$$
- label: '4'
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능하고 극값을 가지면 $f'(a)=0$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 2-1] 좌표평면 위의 원 $(x-1)^2+y^2=1$과 원 $x^2+y^2=t^2$의 교점 중 $y\ge0$인 점을 $\mathrm{P}(t)$라고 하자. 점 $\mathrm{P}(t)$에서 두 원의 접선이 이루는 각을 $\theta(t)$라고 할 때, 정적분 $\displaystyle\int_{\sqrt2}^{2}\{\tan\theta(t)\}^2dt$의 값을 구하시오. (단, $\sqrt2\le t\le2$이고 $0\le\theta(t)\le\dfrac{\pi}{2}$이다.) [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '3\sqrt2-4', equivalents: ['3\sqrt{2}-4', '3*sqrt(2)-4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\tan\theta(t)=\dfrac{\sqrt{4-t^2}}{t}$, $\int_{\sqrt2}^2\left(\frac4{t^2}-1\right)dt=3\sqrt2-4$.'
    steps:
    - {id: 1a, content: '$\left[-\dfrac4t-t\right]_{\sqrt2}^2=3\sqrt2-4$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 두 원의 방정식을 빼서 교점의 $x$좌표를 먼저 구하자.
    - 각 원의 접선 기울기를 음함수 미분으로 구하자.
    - 두 직선이 이루는 각의 탄젠트는 $\tan(\alpha-\beta)$ 공식으로. 예각이 되도록 부호를 확인하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 논술가이드북(자연) p.96~97 예시답안
    steps:
    - id: 1b-1
      content: |
        $1=(x-1)^2+y^2=x^2-2x+1+y^2$을 전개한 후, $x^2+y^2=t^2$을 대입하여 교점 $\mathrm{P}\left(\dfrac{t^2}{2},\dfrac t2\sqrt{4-t^2}\right)$을 구한다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $t=2$일 때는 두 원의 접선이 일치하므로 $\tan\theta(t)=0$이다. $\sqrt2\le t<2$이라고 하고, 원의 방정식 $x^2+y^2=t^2$에 음함수 미분을 적용하여 점 P에서의 접선의 기울기
        $$2x+2y\frac{dy}{dx}=0\ \Rightarrow\ m_1=-\frac xy=-\frac{t}{\sqrt{4-t^2}}$$
        를 구한다. 마찬가지로 원의 방정식 $(x-1)^2+y^2=1$에 음함수 미분을 적용하여 접선의 기울기
        $$2(x-1)+2y\frac{dy}{dx}=0\ \Rightarrow\ m_2=-\frac{x-1}{y}=-\frac{t^2-2}{t\sqrt{4-t^2}}$$
        를 구한다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        따라서 탄젠트 함수의 덧셈정리에 의해 두 접선이 이루는 각 $\theta(t)$는
        $$\tan\theta(t)=\frac{m_2-m_1}{1+m_2m_1}=\frac{\sqrt{4-t^2}}{t}$$
        으로 주어진다. (보충설명: 위 식은 $t=2$일 때도 성립하므로 $t=2$도 포함한다. 실제 그림을 그려보면 $\tan(\theta(2))=0$이다. 또한, 여기서 조건 $\sqrt2\le t\le2$에 의해 $\tan(\theta(t))$가 0과 1 사이이므로 $\theta(t)$는 예각임을 확인할 수 있다.)
      criteria: [1.B2]
    - id: 1b-4
      content: |
        마지막으로 위에서 얻은 식을 대입하여 적분을 계산하여 정답을 얻는다.
        $$\int_{\sqrt2}^2\tan^2\theta(t)dt=\int_{\sqrt2}^2\frac{4-t^2}{t^2}dt=\left[-\frac4t-t\right]_{\sqrt2}^2=3\sqrt2-4$$
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: '두 원의 교점을 찾아 두 접선의 기울기 $m_1=-\frac{t}{\sqrt{4-t^2}}$, $m_2=-\frac{t^2-2}{t\sqrt{4-t^2}}$를 얻었다.'
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: '탄젠트 함수의 덧셈정리를 이용하여 $\tan\theta(t)=\frac{\sqrt{4-t^2}}{t}$를 얻었다.'
      depends_on: []
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: 적분을 계산하여 정답 $3\sqrt2-4$를 얻었다.
      depends_on: []
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: '부호가 반대이면(즉, $-\frac{\sqrt{4-t^2}}{t}$) 그림을 잘못 파악한 것이므로 1점 감점'
      effect: minus
      value: 1
    - code: D1-2
      condition: $t=2$인 경우에 대한 언급이 없으면 1점 감점
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4218}
  misconceptions:
  - id: MC-GEO-4218
    outcome_code: '70'
    wrong_work: '$\tan\theta(t)=\dfrac{m_1-m_2}{1+m_1m_2}=-\dfrac{\sqrt{4-t^2}}{t}$로 둔각 쪽 부호를 그대로 사용'
    detect_cue: '$\tan\theta(t)$가 음수로 표기됨(제곱 후 적분값은 같음)'
    feedback: '조건 $0\le\theta(t)\le\frac{\pi}{2}$이므로 $\tan\theta(t)\ge0$이어야 합니다. 그림으로 두 접선이 이루는 예각을 확인하세요.'
    remedy: [RL-1]
- id: '2'
  stem: |
    [문제 2-2] 반지름의 길이가 $1$인 원에 내접하는 이등변 삼각형 $\mathrm{ABC}$가 있다. $\overline{\mathrm{BC}}=x$이고 $\overline{\mathrm{AB}}=\overline{\mathrm{AC}}=y$라 할 때, $x^3e^{-2y}$의 최댓값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '3\sqrt3e^{-2}', equivalents: ['3\sqrt{3}e^{-2}', '3*sqrt(3)/e^2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$x=y\sqrt{4-y^2}$, $h(y)=y^3(4-y^2)^{\frac32}e^{-2y}$, $h''(y)=2y^2\sqrt{4-y^2}e^{-2y}(y-1)(y^2-2y-6)$.'
    steps:
    - {id: 2a, content: '$y=1$에서 $h(1)=3^{\frac32}e^{-2}=3\sqrt3e^{-2}$, 경계 $h(0)=h(2)=0$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 외접원의 반지름이 1이다. 사인법칙을 쓰자.
    - 이등변삼각형의 꼭지각과 밑각 사이의 관계는?
    - '$x$를 $y$로 나타내면 한 변수 함수의 최댓값 문제가 된다. 구간 끝값도 확인하자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2022 논술가이드북(자연) p.97 예시답안 [방법 1]
    steps:
    - id: 2b-1
      content: |
        각 BAC를 $\alpha$, 각 ABC를 $\beta$라 하자. 사인법칙을 이용하면 $\sin\alpha=\dfrac x2$, $\sin\beta=\dfrac y2$임을 알 수 있다. 그런데 여기서 삼각형 ABC가 이등변 삼각형이므로 $\alpha+2\beta=\pi$를 만족하므로 $\sin(2\beta)=\dfrac x2$인데, 이 식에 사인함수의 덧셈공식을 적용하면
        $$x=2\sin(2\beta)=4\sin\beta\cos\beta=2y\sqrt{1-\frac{y^2}{4}}=y\sqrt{4-y^2}$$
        (또는 $y^4-4y^2+x^2=0$)임을 알 수 있다. 따라서
        $$x^3e^{-2y}=y^3(4-y^2)^{\frac32}e^{-2y}$$
        이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        위 식을 $y$에 대한 함수로 보고 미분을 하면,
        $$2y^2\sqrt{4-y^2}e^{-2y}(y-1)(y^2-2y-6)$$
        가 된다. $y$의 범위가 $0\le y\le2$이므로 구간 내에서 도함수가 0인 경우는 $y=1$일 때이다. (구간 내에서 $y^2-2y-6$은 0이 아니다.)
      criteria: [2.B2]
    - id: 2b-3
      content: |
        경계 $y=0$, $y=2$일 때 $y^3(4-y^2)^{\frac32}e^{-2y}$의 값을 체크해서 $y=1$일 때 최댓값 $3\sqrt3e^{-2}$를 얻는다는 결론을 내린다.
      criteria: [2.B3]
  - id: S2-ALT1
    audience: ALT
    method_no: 2
    source_flow: 2022 논술가이드북(자연) p.97 예시답안 [방법 2]
    steps:
    - id: 2c-1
      content: |
        각 BAC를 $\theta$로 두는 경우, 문제의 조건과 삼각함수의 성질로부터 $1\cdot\cos\left(\dfrac{\theta}{2}\right)=\dfrac y2$와 $y\cdot\cos\left(\dfrac{\pi-\theta}{2}\right)=\dfrac x2$를 얻고, $y=2\cos\left(\dfrac{\theta}{2}\right)$와 $x=2y\sin\left(\dfrac{\theta}{2}\right)=4\sin\left(\dfrac{\theta}{2}\right)\cos\left(\dfrac{\theta}{2}\right)$로 정리한 후 $x^3e^{-2y}$에 대입한다. 이렇게 얻은 함수를 $\theta$에 대한 함수로 보고 $f(\theta)$라 하자.
        $$f(\theta)=x^3e^{-2y}=64\sin^3\left(\frac{\theta}{2}\right)\cos^3\left(\frac{\theta}{2}\right)e^{-4\cos\left(\frac{\theta}{2}\right)}$$
      criteria: [2.B1]
    - id: 2c-2
      content: |
        $f(\theta)$의 최댓값을 찾기 위해 도함수
        $$f'(\theta)=32\sin^2\left(\frac{\theta}{2}\right)\cos^2\left(\frac{\theta}{2}\right)e^{-4\cos\left(\frac{\theta}{2}\right)}\left\{3\cos^2\left(\frac{\theta}{2}\right)-3\sin^2\left(\frac{\theta}{2}\right)+4\sin^2\left(\frac{\theta}{2}\right)\cos\left(\frac{\theta}{2}\right)\right\}$$
        를 구한 다음, 방정식 $3\cos^2\left(\frac{\theta}{2}\right)-3\sin^2\left(\frac{\theta}{2}\right)+4\sin^2\left(\frac{\theta}{2}\right)\cos\left(\frac{\theta}{2}\right)=0$을 풀어서 $\theta$에 대한 도함수가 0인 $\theta=\dfrac{2\pi}{3}$를 구한다.
      criteria: [2.B2]
    - id: 2c-3
      content: |
        $\theta$의 범위의 경계값 $\theta=0$, $\pi$에서 $f(0)=f(\pi)=0$이고 $f\left(\dfrac{2\pi}{3}\right)=3\sqrt3e^{-2}$이므로 최댓값은 $3\sqrt3e^{-2}$이다.
      criteria: [2.B3]
  - id: S2-ALT2
    audience: ALT
    method_no: 3
    source_flow: 2022 논술가이드북(자연) p.98 예시답안 [방법 3]
    steps:
    - id: 2d-1
      content: |
        각 ABC 또는 각 ACB를 $\theta$로 두는 경우, 문제의 조건과 삼각함수의 성질로부터 $y=2\sin\theta$와 $x=2y\cos\theta=4\sin\theta\cos\theta$를 얻고 $x^3e^{-2y}$에 대입하여 함수
        $$f(\theta)=x^3e^{-2y}=64(\sin^3\theta)(\cos^3\theta)e^{-4\sin\theta}$$
        를 얻는다.
      criteria: [2.B1]
    - id: 2d-2
      content: |
        별해1과 마찬가지로 도함수
        $$f'(\theta)=-64(\sin^2\theta)(\cos^2\theta)e^{-4\cos\theta}\{-3\cos^2\theta+3\sin^2\theta+4\sin\theta\cos^2\theta\}$$
        를 구한 다음, 방정식 $-3\cos^2\theta+3\sin^2\theta+4\sin\theta\cos^2\theta=0$을 풀어서 $\theta$에 대한 도함수가 0인 $\theta=\dfrac{\pi}{6}$를 구한다. [판독확인: 원문 도함수의 지수는 $e^{-4\cos\theta}$로 인쇄됨($f$의 지수 $e^{-4\sin\theta}$와 다름, 원문 그대로 옮김)]
      criteria: [2.B2]
    - id: 2d-3
      content: |
        $\theta$의 범위의 경계값 $\theta=0$, $\dfrac{\pi}{2}$에서 $f(0)=f\left(\dfrac{\pi}{2}\right)=0$이고 $f\left(\dfrac{\pi}{6}\right)=3\sqrt3e^{-2}$이므로 최댓값은 $3\sqrt3e^{-2}$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
