intent: '(1) 원의 방정식을 이용하여 그래프를 그릴 수 있는지, 미분을 활용하여 접선의 방정식을 구하는 과정, 탄젠트 함수의 덧셈정리로 직선이 이루는 각을 구할 수 있는지 평가한다. (2) 삼각형의 각도와 변 사이의 관계식을 삼각함수로 표현할 수 있는지, 미분을 활용해서 함수의 최댓값과 최솟값을 구할 수 있는지 평가한다(가이드북 출제의도 요지).'
key_idea: '(1) 교점 $\mathrm{P}\left(\frac{t^2}{2},\frac t2\sqrt{4-t^2}\right)$, 두 접선 기울기를 음함수 미분으로 구해 $\tan\theta(t)=\dfrac{m_2-m_1}{1+m_2m_1}=\dfrac{\sqrt{4-t^2}}{t}$. (2) 사인법칙과 $\alpha+2\beta=\pi$로 $x=y\sqrt{4-y^2}$, $y^3(4-y^2)^{\frac32}e^{-2y}$를 $0\le y\le2$에서 최대화.'
stuck: (1) 두 접선의 기울기를 $t$로 나타내고 덧셈정리의 부호(예각)를 확정하는 단계 / (2) 이등변 내접삼각형에서 $x$와 $y$의 관계식을 세우는 단계
