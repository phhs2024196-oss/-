intent: '(1) 좌표평면에서 두 곡선의 위치관계를 파악하고 교점을 구할 수 있는지, 두 곡선 사이의 넓이를 적분법을 활용하여 구할 수 있는지 평가한다. (2) 등차수열의 곱으로 표현된 급수를 잘 구할 수 있는지, 급수의 합을 통해 구해진 $n$에 대한 3차 방정식의 최솟값을 그래프의 개형, 특히 극솟값을 통해 구할 수 있는지 평가한다(가이드북 출제의도 요지).'
key_idea: '(1) $x^4(1+x^2)=2$에서 $x^2=t$로 교점 $x=\pm1$, 대칭으로 $2\int_0^1\left\{\frac{2}{1+x^2}-x^4\right\}dx=\pi-\frac25$. (2) $a_0=3$을 따로 떼어 $b_n=\frac16(n+1)(n^2-19n+54)$, 삼차함수 개형(극소 근처) 조사로 $b_{11}=-68$.'
stuck: (1) $\int\frac{2}{1+x^2}dx$를 $x=\tan\theta$ 치환으로 계산하는 단계 / (2) $a_0$만 일반항 $3-k$를 따르지 않는 점을 반영해 $b_n$을 닫힌 꼴로 정리하는 단계
idea_tags: [IDEA-SYMMETRIC-AREA-DOUBLE, IDEA-CONVOLUTION-SUM-CLOSED-FORM, IDEA-CUBIC-INTEGER-MIN]
tags: [두 곡선 사이의 넓이, 치환적분, 수열의 합, 삼차함수, 최솟값, 중앙대 실전]
