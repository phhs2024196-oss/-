  concepts: [두 곡선 사이의 넓이, 치환적분법(탄젠트 치환), 우함수의 적분, 합의 기호의 성질, 거듭제곱의 합, 삼차함수의 그래프와 극값]
  tools: [교점 방정식에서 x^2=t 치환, 대칭으로 2배, 2/(1+x^2) 적분(x=tanθ), a_0 항 분리 후 Σ 전개, 삼차식 인수분해, 근·극소 위치 근사, 정수 n 후보 대입]
  conditions:
  - '(1) 교점 $x^4=\frac{2}{1+x^2}$ ⇒ $x=\pm1$, 두 함수 모두 우함수 ⇒ $[0,1]$ 넓이의 2배'
  - '(2) $a_0=3$은 $3-k$의 $k=0$ 값과 같음 ⇒ $a_k=3-k$ ($k\ge0$)로 통일, $\sum_{k=0}^{n}c=c(n+1)$'
  - '(2) $n$은 음이 아닌 정수 ⇒ 연속 최소가 아니라 극소 근처 정수 $n=10,11$ 비교'
