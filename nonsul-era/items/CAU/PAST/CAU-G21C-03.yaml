stimuli:
- label: '1'
  body: |
    함수 $f(x)$가 구간 $[a,b]$에서 연속이고 $f(x)\ge0$이면, 정적분 $\displaystyle\int_a^bf(x)dx$는 곡선 $y=f(x)$, 직선 $x=a$, 직선 $x=b$와 $x$축으로 둘러싸인 도형의 넓이를 나타낸다.
- label: '2'
  body: |
    미분가능한 함수 $g(t)$에 대하여 $x=g(t)$로 놓으면, 다음 식이 성립한다.
    $$\int f(x)dx=\int f(g(t))g'(t)dt$$
- label: '3'
  body: |
    수열 $\{a_k\}$, $\{b_k\}$와 상수 $c$에 대하여, 다음 식이 성립한다.
    $$\sum_{k=0}^{n}(ca_k+b_k)=c\sum_{k=0}^{n}a_k+\sum_{k=0}^{n}b_k$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 3-1] 두 곡선 $y=x^4$과 $y=\dfrac{2}{1+x^2}$로 둘러싸인 도형의 넓이를 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\pi-\dfrac{2}{5}', equivalents: ['pi-2/5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '교점 $x=\pm1$, $2\left(\frac{\pi}{2}-\frac15\right)$.'
    steps:
    - {id: 1a, content: '$2\int_0^1\left\{\dfrac{2}{1+x^2}-x^4\right\}dx=2\left(\dfrac{\pi}{2}-\dfrac15\right)=\pi-\dfrac25$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 교점의 방정식에서 $x^2=t$로 두자.
    - 두 함수가 모두 우함수이다.
    - '$\int_0^1\frac{dx}{1+x^2}$는 $x=\tan\theta$로 치환한다.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 논술가이드북(자연) p.99 예시답안
    steps:
    - id: 1b-1
      content: |
        교점을 구하자. $x^4(1+x^2)=2$이고 $x^2=t$로 쓰면 $t^2(1+t)=2$이 되고 $t=1$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        주어진 영역의 넓이는 아래와 같다.
        $$\int_{-1}^{1}\left\{\frac{2}{1+x^2}-x^4\right\}dx=2\int_0^1\left\{\frac{2}{1+x^2}-x^4\right\}dx$$
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $\displaystyle\int_0^1\frac{2}{1+x^2}dx=\frac{\pi}{2}$이고 $\displaystyle\int_0^1x^4dx=\frac15$이므로 정답은 $\pi-\dfrac25$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: '교점을 구하여 적분 구간이 $[-1,1]$임을 밝혔다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: '적분식을 구성했다($[-1,1]$에서 적분하거나 대칭을 이용하여 $[0,1]$에서 적분한 것의 2배이거나).'
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: '$\int_0^1\frac{2}{1+x^2}dx=\frac{\pi}{2}$와 $\int_0^1x^4dx=\frac15$를 구해서 $\pi-\frac25$를 구했다.'
      depends_on: []
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4219}
  misconceptions:
  - id: MC-CAL-4219
    outcome_code: '70'
    wrong_work: '$\int_0^1\left\{\frac{2}{1+x^2}-x^4\right\}dx=\frac{\pi}{2}-\frac15$를 답으로 씀'
    detect_cue: 답이 $\frac{\pi}{2}-\frac15$
    feedback: 교점은 $x=-1$과 $x=1$ 두 개입니다. 대칭을 썼다면 2배를 해야 합니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    [문제 3-2] $a_0=3$이고 자연수 $k$에 대하여 $a_k=3-k$인 수열이 있다. 음이 아닌 정수 $n$에 대하여 $b_n=\displaystyle\sum_{k=0}^{n}a_{n-k}a_k$라 할 때, $b_n$의 최솟값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '-68', equivalents: ['-68'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$b_n=\sum_{k=0}^n(3-n+k)(3-k)=\frac16(n^3-18n^2+35n+54)$, $f''(x)=0$의 근 $6+\frac{\sqrt{219}}{3}\approx10.9$ ⇒ $b_{10}=-66$, $b_{11}=-68$.'
    steps:
    - {id: 2a, content: '$\min b_n=b_{11}=-68$', criteria: [2.B1, 2.M1, 2.B2]}
    hint_ladder:
    - '$a_0=3$도 $3-k$에 $k=0$을 넣은 값과 같다.'
    - '$a_{n-k}a_k=(3-n+k)(3-k)$를 $k$에 대해 전개해 합을 구하자. $k=0$부터 $n$까지 $n+1$개 항이다.'
    - '$b_n$은 $n$의 삼차식이다. 음수가 되는 구간과 극소 근처의 정수를 조사하자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2022 논술가이드북(자연) p.99 예시답안
    steps:
    - id: 2b-1
      content: |
        $b_n=\dfrac16(n^3-18n^2+35n+54)=\dfrac16(n+1)(n^2-19n+54)$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        삼차함수 $f(x)=\dfrac16(x+1)(x^2-19x+54)$의 그래프의 개형을 고려해 보자. 근이 $x=-1$, $\dfrac{19-\sqrt{145}}{2}\approx3.5$, $\dfrac{19+\sqrt{145}}{2}\approx15.5$이므로 $n=4,5,\cdots,15$일 때 $b_n$이 음수가 나온다. 그래프의 개형을 고려해서 $n=9,10,11,12$인 경우만 조사해 보면 된다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        최솟값의 위치를 찾는 다른 방법으로 $f(x)=\dfrac16(x+1)(x^2-19x+54)$를 미분하면 $f'(x)=0$의 근이 $6-\dfrac{\sqrt{219}}{3}$, $6+\dfrac{\sqrt{219}}{3}$이고 $10<6+\dfrac{\sqrt{219}}{3}<11$이므로 $n=10$, $11$만 체크해도 된다. (원문은 이 부등식을 $10<6+\frac{\sqrt{210}}{3}<11$로 표기 — $\sqrt{219}$의 오기로 판단)
      criteria: [2.M1]
    - id: 2b-4
      content: |
        $b_{10}=-66$이고 $b_{11}=-68$이므로 최솟값은 $-68$이다.
      criteria: [2.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: '$b_n=\frac16(n^3-18n^2+35n+54)$를 구했다.'
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 7
      evidence: 그래프의 개형을 고려해서 $n=9,10,11,12$를 조사했다. 아니면 미분 등을 이용하여 $n=10,11$을 조사했다.
      depends_on: []
      steps: [2b-2, 2b-3]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: $b_{11}=-68$을 구했다.
      depends_on: []
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: '$\sum_{k=0}^{n}c=c(n+1)$인데 $\sum_{k=0}^{n}c=cn$으로 잘못 계산하여 $b_n=\frac16(n^3-18n^2+53n)$이 나오고 이것을 이용하여 $b_{10}=-45$, $b_{11}=-44$ 계산하여 최솟값을 $-45$로 구한 경우는 10점만 준다.'
      effect: cap
      value: 10
    - code: D2-2
      condition: '$b_n$의 정확한 형태를 구하지 않고 $b_0,\cdots,b_{12}$ 등을 직접 계산하여 최솟값 $b_{11}=-68$을 구한 경우는 8점만 준다.'
      effect: cap
      value: 8
    - code: D2-3
      condition: 공식 주석 — 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능, 채점자는 답안의 완성도에 따라 −0.5~+0.5점 부여 가능
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-4220}
  misconceptions:
  - id: MC-ALG-4220
    outcome_code: '70'
    wrong_work: '$\sum_{k=0}^{n}c=cn$으로 계산해 $b_n=\frac16(n^3-18n^2+53n)$, 최솟값 $-45$'
    detect_cue: '답 $-45$, $b_n$ 식의 상수항이 0'
    feedback: '$k=0$부터 $n$까지는 $n+1$개 항입니다. $\sum_{k=0}^{n}c=c(n+1)$.'
    remedy: [RL-2]

