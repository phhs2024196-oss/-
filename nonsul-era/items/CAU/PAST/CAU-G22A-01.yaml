    outcome_code: '70'
    wrong_work: '모든 경우에서 등번호 4번의 선택지를 1가지로 보아 $8\times6=48$로 답함(4번 의자가 남는 경우를 놓침)'
    detect_cue: 답이 48, 또는 남은 자리 $\{0,1,2,3,4\}$ 경우를 8가지로 계산
    feedback: '등번호 5·6·7번이 4번 의자를 쓰지 않으면 등번호 4번 사람은 4번 의자에도 앉을 수 있습니다. 남은 자리 집합마다 선택지를 다시 세세요.'
    remedy: [RL-1]

