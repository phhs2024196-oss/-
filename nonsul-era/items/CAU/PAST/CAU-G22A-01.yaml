stem: |
  다음 상황에 기초하여 문제에 답하시오.

  아래와 같이 번호가 부여된 8개의 의자가 있다. 1번부터 7번까지의 서로 다른 등번호를 부여받은 7명의 사람들을 7개의 의자에 앉히려고 한다.

  (그림: 직사각형 탁자 위쪽에 의자 0, 1, 2, 3, 아래쪽에 의자 4, 5, 6, 7이 놓여 있다.)

  단, 자리를 배치할 때, 다음의 조건을 모두 만족하여야 한다.

  - 한 의자에 2명 이상 앉을 수 없다.
  - 모든 사람은 본인의 등번호보다 큰 번호의 의자에 앉을 수 없다.
  - 등번호가 5번인 사람은 4번, 5번 의자 중 하나에 앉아야 한다.
  - 등번호가 6번인 사람은 4번, 5번, 6번 의자 중 하나에 앉아야 한다.
  - 등번호가 7번인 사람은 6번, 7번 의자 중 하나에 앉아야 한다.

  자리를 배치하는 경우의 수를 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    자리를 배치하는 경우의 수를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '56', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '5·6·7번의 자리 6가지 중 4번 의자가 남는 경우는 $(5,6,7)\to(5,6,7)$ 하나뿐. 그때 $2^4=16$, 나머지 5가지는 $2^3\cdot1=8$씩 ⇒ $8\times5+16=56$.'
    steps:
    - {id: 1a, content: '등번호 $k\ (1\le k\le4)$번은 앞사람이 쓴 $k-1$개를 뺀 $\{0,\dots,k\}$ 중에서 고르므로 2가지씩(단 4번은 4번 의자가 남아 있을 때만 2가지)', criteria: [1.B1, 1.B2]}
    hint_ladder:
    - 선택지가 가장 적은 사람부터 자리를 정해 보자.
    - 등번호 1번, 2번, 3번 순서로 앉히면 각자 선택할 수 있는 의자는 몇 개인가?
    - 남은 자리에 4번 의자가 있는 경우와 없는 경우를 나누자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.62 예시답안
    steps:
    - id: 1b-1
      content: |
        먼저, 등번호가 5번, 6번, 7번인 사람의 자리를 고려하면 아래의 6가지 경우가 있다.
        (등번호 5, 6, 7의 자리번호 → 남은 자리)
        $(4,5,6)\to\{0,1,2,3,7\}$, $(4,5,7)\to\{0,1,2,3,6\}$, $(4,6,7)\to\{0,1,2,3,5\}$,
        $(5,4,6)\to\{0,1,2,3,7\}$, $(5,4,7)\to\{0,1,2,3,6\}$, $(5,6,7)\to\{0,1,2,3,4\}$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        나머지 사람인 등번호 1, 2, 3, 4번의 사람이 앉을 수 있는 경우를 고려해보자.
        예를 들어, 남은 자리가 $\{0,1,2,3,7\}$인 경우는 다음과 같이 계산된다.
        − 등번호 1번 사람이 선택할 수 있는 경우의 수 − 2가지 (0번 자리, 1번 자리)
        − 등번호 2번 사람이 선택할 수 있는 경우의 수 − 2가지 (0번, 1번, 2번 자리 중 등번호 1번이 선택하지 않은 자리)
        − 등번호 3번 사람이 선택할 수 있는 경우의 수 − 2가지 (0번, 1번, 2번, 3번 자리 중 등번호 1번, 2번이 선택하지 않은 자리)
        − 등번호 4번 사람이 선택할 수 있는 경우의 수 − 1가지 (0번, 1번, 2번, 3번 자리 중 등번호 1번, 2번, 3번이 선택하지 않은 자리)
        따라서, 모든 경우의 수는 $2\times2\times2\times1=8$이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        위의 계산과정을 모든 경우에 대하여 반복하면 아래와 같이 계산된다.
        $(4,5,6)$, 남은 자리 $\{0,1,2,3,7\}$: $2\times2\times2\times1=8$
        $(4,5,7)$, 남은 자리 $\{0,1,2,3,6\}$: $2\times2\times2\times1=8$
        $(4,6,7)$, 남은 자리 $\{0,1,2,3,5\}$: $2\times2\times2\times1=8$
        $(5,4,6)$, 남은 자리 $\{0,1,2,3,7\}$: $2\times2\times2\times1=8$
        $(5,4,7)$, 남은 자리 $\{0,1,2,3,6\}$: $2\times2\times2\times1=8$
        $(5,6,7)$, 남은 자리 $\{0,1,2,3,4\}$: $2\times2\times2\times2=16$
        따라서, 모든 경우의 수는 $8\times5+16=56$이다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 10
      evidence: 등번호 5번, 6번, 7번이 앉을 수 있는 경우 6개를 모두 찾았다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 10
      evidence: '6개 경우에 대한 경우의 수를 바르게 계산했다(남은 자리 $\{0,1,2,3,4\}$인 경우 16개를 못 찾으면 2점 감점, 그 외 5개 경우는 각 1점 감점).'
      depends_on: []
      steps: [1b-2, 1b-3]
    deductions:
    - code: D1-1
      condition: '1.B2 안에서 남은 자리 $\{0,1,2,3,4\}$인 경우의 16개를 못 찾음(공식 채점기준)'
      effect: minus
      value: 2
    - code: D1-2
      condition: 1.B2 안에서 그 외 5개 경우 중 하나의 경우의 수를 틀림(경우마다, 공식 채점기준)
      effect: minus
      value: 1
    - code: D1-3
      condition: 계산 실수로 틀렸어도 논리 전개 과정이 맞으면 해당 부분에 1~2점 부분 점수 / 완성도에 따라 총점 20점 이내에서 ±1점(공식 채점기준 주석)
      effect: minus
      value: 1
