intent: 주어진 상황에서 가능한 모든 경우의 수를 논리적으로 사고하여 정확하게 계산하는 문제로, 여러 조건 하에서 등번호와 의자번호를 매칭하는 경우의 수를 계산할 수 있는가를 평가한다. 경우의 수와 순열의 의미 및 순열의 수 계산능력을 평가하며 난이도는 '중, 하' 정도(가이드북 출제의도 요지).
