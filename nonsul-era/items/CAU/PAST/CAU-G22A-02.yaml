stimuli:
- label: '1'
  body: |
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는 $\{f(g(x))\}'=f'(g(x))g'(x)$이다.
- label: '2'
  body: |
    두 점 $\mathrm{A}(a_1,a_2)$, $\mathrm{B}(b_1,b_2)$에 대하여 벡터 $\overrightarrow{\mathrm{AB}}$는 $(b_1-a_1,\ b_2-a_2)$로 주어진다.
- label: '3'
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능하고 $x=a$에서 극값을 가지면 $f'(a)=0$이다. 미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고, $x=a$의 좌우에서 $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    좌표평면 위의 곡선 $9y^2=64(1-\sqrt x)^3$의 길이를 구하시오. (단, $x\ge\dfrac12$, $y\ge0$이다.) [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{7}{2}-2\sqrt{2}', equivalents: ['7/2-2*sqrt(2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\dfrac12\le x\le1$, $y^{\prime}=-\dfrac{2(1-\sqrt x)^{1/2}}{\sqrt x}$, $\sqrt{1+(y^{\prime})^2}=\dfrac{2}{\sqrt x}-1$.'
    steps:
    - {id: 1a, content: '$\displaystyle\int_{1/2}^1\left(\dfrac{2}{\sqrt x}-1\right)dx=\Big[4\sqrt x-x\Big]_{1/2}^1=3-\left(2\sqrt2-\dfrac12\right)=\dfrac72-2\sqrt2$', criteria: [1.B1, 1.B2, 1.M1, 1.A1]}
    hint_ladder:
    - '$y\ge0$이므로 $y$를 $x$에 대한 식으로 풀 수 있다. $x$의 범위는?'
    - '$1+\left(\dfrac{dy}{dx}\right)^2$을 정리하면 완전제곱식이 된다.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.62 예시답안
    steps:
    - id: 1b-1
      content: |
        주어진 식으로부터 $x$의 범위 $\dfrac12\le x\le1$을 얻는다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        그리고 합성함수 $y=\dfrac83(1-\sqrt x)^{\frac32}$를 미분하여 $\dfrac{dy}{dx}=-\dfrac{2(1-\sqrt x)^{\frac12}}{\sqrt x}$을 얻는다. (또는 음함수 미분법을 이용하여 동일한 결과를 얻을 수 있다.)
      criteria: [1.B2]
    - id: 1b-3
      content: |
        마지막으로 다음과 같이 적분을 계산하여 해당 곡선의 길이를 구한다.
        $$\int_{\frac12}^1\sqrt{1+\left(\dfrac{dy}{dx}\right)^2}\,dx=\int_{\frac12}^1\sqrt{1+\dfrac{4(1-\sqrt x)}{x}}\,dx=\int_{\frac12}^1\sqrt{\left(1-\dfrac{2}{\sqrt x}\right)^2}\,dx=\int_{\frac12}^1\left(\dfrac{2}{\sqrt x}-1\right)dx=\dfrac72-2\sqrt2$$
      criteria: [1.M1, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: '$x$의 범위 $\dfrac12\le x\le1$을 얻었다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: '미분을 계산하여 $\dfrac{dy}{dx}=-\dfrac{2(1-\sqrt x)^{\frac12}}{\sqrt x}$를 얻었다.'
      depends_on: []
      steps: [1b-2]
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: '곡선의 길이를 적분 $\displaystyle\int_{\frac12}^1\sqrt{1+\left(\dfrac{dy}{dx}\right)^2}dx$로 구할 수 있음을 식으로 적었다.'
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: '적분을 계산하여 정답 $\dfrac72-2\sqrt2$를 얻었다(근호를 벗길 때 부호 오류가 있으면 2점 감점).'
      depends_on: [1.M1]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: '$\sqrt{\left(1-\dfrac2{\sqrt x}\right)^2}$을 벗길 때 부호 오류(공식 채점기준: 1.A1 에서 2점 감점)'
      effect: minus
      value: 2
    - code: D1-2
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수 / 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4308}
  misconceptions:
  - id: MC-CAL-4308
    outcome_code: '70'
    wrong_work: '$\sqrt{\left(1-\dfrac{2}{\sqrt x}\right)^2}=1-\dfrac{2}{\sqrt x}$로 벗겨 음수 길이 $2\sqrt2-\dfrac72$를 얻음'
    detect_cue: 답이 음수이거나 $2\sqrt2-\dfrac72$
    feedback: '$\sqrt{A^2}=\lvert A\rvert$입니다. $\dfrac12\le x\le1$에서 $\dfrac{2}{\sqrt x}\ge2>1$이므로 $\dfrac{2}{\sqrt x}-1$로 벗겨야 합니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표평면 위의 점 $\mathrm{P}(x,y)$가 다음의 조건을 만족하면서 연속적으로 움직인다고 하자.

    (가) 점 $\mathrm{P}(x,y)$는 시각 $t=0$일 때, $(\sqrt2,0)$에서 출발하여 타원 $x^2+2y^2=2$를 따라 반시계방향으로 움직이기 시작한다.
    (나) 점 $\mathrm{P}(x,y)$는 시각 $t\ (t\ge0)$일 때, 타원 $x^2+2y^2=2$의 두 초점 A와 B에 대하여 $\overrightarrow{\mathrm{PA}}\cdot\overrightarrow{\mathrm{PB}}=\dfrac{2+t^2}{2(1+t+t^2)}$을 만족한다.

    삼각형 PAB의 넓이를 $S$라 할 때, $S^2$의 최댓값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{1}{\sqrt{3}}', equivalents: ['\dfrac{\sqrt3}{3}', '\dfrac{3+2\sqrt3}{6+3\sqrt3}', '1/sqrt(3)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '초점 $(\pm1,0)$, $S=\lvert y\rvert$. 내적 $=x^2+y^2-1=1-y^2$이므로 $y^2=\dfrac{2t+t^2}{2(1+t+t^2)}$, 도함수 분자 $2+2t-t^2=0$에서 $t=1+\sqrt3$.'
    steps:
    - {id: 2a, content: '$\{y(t)^2\}^{\prime}=\dfrac{2+2t-t^2}{2(1+t+t^2)^2}$, $t=1+\sqrt3$에서 극대이자 최대 $\dfrac{3+2\sqrt3}{6+3\sqrt3}=\dfrac1{\sqrt3}$', criteria: [2.B1, 2.B2, 2.B3, 2.B4]}
    hint_ladder:
    - 타원 $\dfrac{x^2}{2}+y^2=1$의 초점은 어디인가? 밑변 AB의 길이는?
    - 내적을 $x$, $y$로 쓰고 타원의 방정식으로 $x^2$을 지우자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.63 예시답안
    steps:
    - id: 2b-1
      content: |
        조건 (나)로부터
        $$\dfrac{2+t^2}{2(1+t+t^2)}=\overrightarrow{\mathrm{PA}}\cdot\overrightarrow{\mathrm{PB}}=(-1-x,\ -y)\cdot(1-x,\ -y)=-1+x^2+y^2$$
        을 얻은 후,
      criteria: [2.B1]
    - id: 2b-2
      content: |
        (가)의 타원 방정식을 대입하여
        $$\dfrac{2+t^2}{2(1+t+t^2)}=-1+(2-2y^2)+y^2=1-y^2\ \Rightarrow\ \{y(t)\}^2=\dfrac{2t+t^2}{2(1+t+t^2)}$$
        를 구한다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        이때 삼각형 PAB의 넓이는 $y(t)$이므로 $\{y(t)\}^2$의 최댓값을 구하면 된다. $\{y(t)\}^2$의 최댓값을 구하기 위하여 $\{y(t)\}^2$의 미분을 계산하면 $\{y(t)^2\}'=\dfrac{2+2t-t^2}{2(1+t+t^2)^2}$이므로,
      criteria: [2.B3]
    - id: 2b-4
      content: |
        $t=1+\sqrt3$일 때 $\{y(t)\}^2$의 최댓값 $\{y(1+\sqrt3)\}^2=\dfrac{3+2\sqrt3}{6+3\sqrt3}=\dfrac{1}{\sqrt3}$을 가진다는 것을 알 수 있다.
      criteria: [2.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: '내적의 정의와 조건 (나)를 이용하여 관계식 $\dfrac{2+t^2}{2(1+t+t^2)}=-1+x^2+y^2$을 얻었다.'
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: '조건 (가)를 이용하여 $\{y(t)\}^2=\dfrac{2t+t^2}{2(1+t+t^2)}$를 얻었다.'
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: '$\{y(t)\}^2$의 도함수 $\dfrac{2+2t-t^2}{2(1+t+t^2)^2}$을 얻었다.'
      depends_on: []
      steps: [2b-3]
    - id: 2.B4
      mark_type: B
      points: 6
      evidence: '극대·극소를 판정하여 최종적으로 정답 $\dfrac{3+2\sqrt3}{6+3\sqrt3}=\dfrac1{\sqrt3}$을 얻었다.'
      depends_on: []
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수 / 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4309}
  misconceptions:
  - id: MC-GEO-4309
    outcome_code: '70'
    wrong_work: '타원 $x^2+2y^2=2$의 초점을 $(\pm\sqrt2,0)$ 또는 $(\pm\sqrt3,0)$으로 잡아 내적·넓이를 계산함'
    detect_cue: '초점 좌표가 $(\pm1,0)$이 아니거나 $S=\sqrt2\lvert y\rvert$ 꼴'
    feedback: '타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1\ (a>b)$의 초점은 $(\pm\sqrt{a^2-b^2},0)$입니다. 여기서 $a^2=2$, $b^2=1$이므로 $(\pm1,0)$입니다.'
    remedy: [RL-2]

