key_idea: '[2-1] $y=\dfrac83(1-\sqrt x)^{\frac32}$, $1+\left(\dfrac{dy}{dx}\right)^2=\left(\dfrac{2}{\sqrt x}-1\right)^2$이 되어 근호가 벗겨진다. [2-2] 초점 $\mathrm{A}(-1,0)$, $\mathrm{B}(1,0)$이므로 $S=\lvert y\rvert$, 내적 조건과 타원 방정식에서 $\{y(t)\}^2=\dfrac{2t+t^2}{2(1+t+t^2)}$.'
stuck: '[2-1] $x\ge\dfrac12$와 $(1-\sqrt x)^3\ge0$에서 $\dfrac12\le x\le1$을 얻는 단계와 $1+\dfrac{4(1-\sqrt x)}{x}$가 완전제곱식임을 보는 단계 / [2-2] 넓이가 $\lvert y\rvert$뿐임을 보고 $y^2$만 최대화하면 된다는 점'
