intent: '[3-1] 닫힌 구간에서 정의된 연속함수가 최댓값, 최솟값을 가짐을 알고 미분과 이차방정식을 이용하여 최댓값·최솟값을 구할 수 있는지, [3-2] 주어진 $f(x)$에 대한 이차방정식을 완전제곱식으로 풀어서 $f(x)$를 구하고, 주어진 정적분을 치환, 부분적분 등을 이용하여 구할 수 있는지 평가한다(가이드북 출제의도 요지).'
key_idea: '[3-1] $a(b^2+1)=8$로 $X=2a+b^2=2a+\dfrac8a-1$의 범위 $[7,16]$을 구한 뒤 $20X-X^2$의 최대·최소. [3-2] (가)는 $f(x)\cos x$에 대한 이차식이고 $\cos x f(x)=(1+\sin x)^2$, 피적분식은 $(f(x)\cos x)^{\prime}e^{\sin x}$.'
stuck: '[3-1] 두 문자식을 $X=2a+b^2$ 하나로 묶고 $X$의 범위를 닫힌구간으로 확정하는 단계 / [3-2] $f^{\prime}(x)\cos x-f(x)\sin x=(f(x)\cos x)^{\prime}$을 알아보고, 조건 (나)로 $\pm$ 부호를 정하는 단계'
