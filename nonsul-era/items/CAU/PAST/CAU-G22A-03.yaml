stimuli:
- label: '1'
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이면 함수 $f(x)$는 이 닫힌구간에서 반드시 최댓값과 최솟값을 갖는다.
- label: '2'
  body: |
    닫힌구간 $[a,b]$에서 두 함수 $f(x)$, $g(x)$의 도함수가 연속일 때 다음 식이 성립한다.
    $$\int_a^bf(x)g'(x)\,dx=\big[f(x)g(x)\big]_a^b-\int_a^bf'(x)g(x)\,dx$$
- label: '3'
  body: |
    미분가능한 함수 $g(t)$에 대하여 $x=g(t)$로 놓으면 $\displaystyle\int f(x)\,dx=\int f(g(t))g'(t)\,dt$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    좌표평면 위의 두 점 $\mathrm{A}(a,0)$, $\mathrm{B}(b,b^2+1)$과 원점 O가 이루는 삼각형 OAB의 넓이가 4라고 하자. 이때 $20(2a+b^2)-(2a+b^2)^2$의 최댓값 $M$과 최솟값 $m$을 각각 구하시오. (단, $a\ge1$이다.) [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: 'M=100,\ m=64', equivalents: ['100, 64'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$X=2a+b^2=2a+\dfrac8a-1$ ($1\le a\le8$)의 범위는 $[7,16]$, $20X-X^2=100-(X-10)^2$에서 $M=100$ ($X=10$), $m=64$ ($X=16$).'
    steps:
    - {id: 1a, content: '$X=7$일 때 $91$, $X=16$일 때 $64$이므로 최솟값은 $64$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 넓이 조건을 $a$, $b$의 관계식으로 쓰자.
    - '$2a+b^2$을 한 문자로 놓고 그 범위를 먼저 구하자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.63 예시답안
    steps:
    - id: 1b-1
      content: |
        넓이 조건에서 $a(b^2+1)=8$이 나온다. $1+b^2\ge1$이므로 $a\le8$이고 범위 $1\le a\le8$을 얻을 수 있다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $a(b^2+1)=8$을 대입하면 $2a+b^2=2a+\dfrac8a-1=f(a)$이 되고 미분하여 $a=2$에서 최솟값 $f(2)=7$을 갖고 $f(1)=9$, $f(8)=16$이므로 $7\le2a+b^2\le16$이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        이 구간에 대하여 $20(2a+b^2)-(2a+b^2)^2$은 $2a+b^2=10$에서 최댓값 $M=100$을 가지고 $2a+b^2=16$에서 최솟값 $m=64$를 갖는다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: '$a(b^2+1)=8$과 $1\le a\le8$을 보였다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: '$7\le2a+b^2\le16$을 보였다.'
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: '$M=100$, $m=64$를 보였다.'
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수 / 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4310}
  misconceptions:
  - id: MC-CAL-4310
    outcome_code: '70'
    wrong_work: '$2a+b^2$의 범위를 확인하지 않고 $X=7$(극솟값 지점)에서 최솟값 $91$로 답하거나, $a$의 상한 $8$을 빠뜨림'
    detect_cue: '$m=91$ 또는 범위가 $X\ge7$로만 적힘'
    feedback: '$f(a)=2a+\dfrac8a-1$은 닫힌구간 $[1,8]$에서 최솟값 7과 최댓값 16(끝점)을 모두 확인해야 합니다. 이차식 $20X-X^2$의 최솟값은 꼭짓점에서 먼 끝점에서 나옵니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    $0\le x\le\dfrac{\pi}{3}$에서 정의된 연속함수 $f(x)$는 다음을 만족한다.

    (가) $(f(x))^2\cos^2x-2f(x)(1+\sin x)\cos x+(1+\sin x)^2\cos^2x=0$
    (나) $f\left(\dfrac{\pi}{6}\right)=\dfrac{3\sqrt3}{2}$

    이때 정적분 $\displaystyle\int_0^{\frac{\pi}{6}}\{f'(x)\cos x-f(x)\sin x\}e^{\sin x}\,dx$의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\sqrt{e}', equivalents: ['e^{1/2}', 'sqrt(e)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\cos x f(x)=(1+\sin x)^2$, 피적분식 $=\{(1+\sin x)^2\}^{\prime}e^{\sin x}=2(1+\sin x)\cos x\,e^{\sin x}$, $\sin x=t$로 $\displaystyle\int_0^{1/2}2(t+1)e^tdt=\Big[2te^t\Big]_0^{1/2}=\sqrt e$.'
    steps:
    - {id: 2a, content: '$\displaystyle\int2(t+1)e^tdt=2te^t+C$ (부분적분)', criteria: [2.B1, 2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - '(가)를 $f(x)\cos x$에 대한 이차방정식으로 보자.'
    - '$f^{\prime}(x)\cos x-f(x)\sin x$는 어떤 함수의 도함수인가?'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.64 예시답안 [방법 1]
    steps:
    - id: 2b-1
      content: |
        조건 (가)에서 주어진 식을 $(1+\sin x)^2$로 나누고 이차방정식을 풀어서 정리하면 $\dfrac{\cos x}{1+\sin x}f(x)=1\pm\sin x$이고 조건 (나)를 만족시키는 연속함수는 다음과 같다.
        $$\cos x f(x)=(1+\sin x)^2\qquad(*)$$
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $f'(x)\cos x-f(x)\sin x=(f(x)\cos x)'$을 고려하고 $(*)$을 쓰면 $(f(x)\cos x)'=((1+\sin x)^2)'=2(1+\sin x)\cos x$이므로
        $$\int_0^{\frac{\pi}{6}}(f'(x)\cos x-f(x)\sin x)e^{\sin x}dx=\int_0^{\frac{\pi}{6}}2(\sin x+1)\cos x\,e^{\sin x}dx$$
      criteria: []
    - id: 2b-3
      content: |
        이고 $\sin x=t$로 치환적분하면 $\displaystyle\int_0^{\frac12}2(t+1)e^t\,dt$이 되고 부분적분하면 $\sqrt e$가 된다.
      criteria: [2.M1, 2.M2, 2.A1]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 2023 논술가이드북(자연) p.64 예시답안 [방법 2]
    key_idea: (가)를 $f(x)$에 대한 이차방정식으로 직접 풀고, 원래 적분을 먼저 부분적분한 뒤 $1+\sin x=t$로 치환한다.
    steps:
    - id: 2c-1
      content: |
        조건 (가)에서 주어진 식을 $f(x)$에 대한 이차방정식으로 보고 풀어서 정리하면 $f(x)=\dfrac{(1+\sin x)(1\pm\sin x)}{\cos x}$이다. (또는 주어진 식을 $(1+\sin x)^2$로 나누고 이차방정식을 풀어서 정리하면 $\dfrac{\cos x}{1+\sin x}f(x)=1\pm\sin x$이다.) 조건 (나)를 만족시키는 연속함수는 다음과 같다.
        $$\cos x f(x)=(1+\sin x)^2\qquad(*)$$
      criteria: [2.B1]
    - id: 2c-2
      content: |
        $f'(x)\cos x-f(x)\sin x=(f(x)\cos x)'$을 고려하여 부분적분하면
        $$\int_0^{\frac{\pi}{6}}(f'(x)\cos x-f(x)\sin x)e^{\sin x}dx=\Big[f(x)\cos x\,e^{\sin x}\Big]_0^{\frac{\pi}{6}}-\int_0^{\frac{\pi}{6}}f(x)\cos x\,e^{\sin x}\cos x\,dx$$
        을 얻고 방정식 $(*)$를 이용하면
        $$\Big[(1+\sin x)^2e^{\sin x}\Big]_0^{\frac{\pi}{6}}-\int_0^{\frac{\pi}{6}}f(x)\cos x\,e^{\sin x}\cos x\,dx=\left(\dfrac94\sqrt e-1\right)-\int_0^{\frac{\pi}{6}}(1+\sin x)^2e^{\sin x}\cos x\,dx$$
        이다.
      criteria: [2.M2]
    - id: 2c-3
      content: |
        $1+\sin x=t$로 치환적분하면 $\displaystyle\int_0^{\frac{\pi}{6}}(1+\sin x)^2e^{\sin x}\cos x\,dx=\int_1^{\frac32}t^2e^{t-1}dt=\dfrac54e^{\frac12}-1$이다. 합산하면 답은 $\sqrt e$이다.
      criteria: [2.M1, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 8
      evidence: '$\cos x f(x)=(1+\sin x)^2$을 구했다.'
      depends_on: []
      steps: [2b-1, 2c-1]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: '치환적분($\sin x=t$ 또는 $1+\sin x=t$)을 적분 구간과 함께 바르게 수행했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-3, 2c-3]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: 부분적분을 바르게 수행했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3, 2c-2]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: '계산결과 $\sqrt e$를 얻었다.'
      depends_on: [2.M1, 2.M2]
      steps: [2b-3, 2c-3]
    deductions:
    - code: D2-1
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수 / 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4311}
  misconceptions:
  - id: MC-CAL-4311
    outcome_code: '70'
    wrong_work: '(가)의 두 근 중 $\cos x f(x)=1-\sin^2x=\cos^2x$, 즉 $f(x)=\cos x$를 택해 적분함(조건 (나) 미확인)'
    detect_cue: '$f(x)=\cos x$ 또는 답이 $e^{1/2}$이 아닌 값($\int_0^{\pi/6}(-2\sin x\cos x)e^{\sin x}dx$ 계산 결과 $\sqrt e-2$)'
    feedback: '이차방정식의 두 근 중 어느 것이 $f$인지는 조건 (나)로 정합니다. $x=\dfrac{\pi}{6}$에서 $\cos x f(x)=\dfrac94$인지 확인하세요.'
    remedy: [RL-2]

