stimuli: []

stem: |
  다음 상황에 기초하여 문제에 답하시오.

  그림과 같이 좌표평면 위에 좌표가 $(1,1),(1,2),\cdots,(m,n)$인 $m\times n$개의 점이 있다. 이 중 4개의 점을 택하여 만들 수 있는 직사각형 중 넓이가 1인 것을 제외한 개수를 $A(m,n)$이라고 정의한다. (단, $m,n$은 1보다 큰 자연수이다.)

  (그림: $x$좌표 $1,2,3,\cdots,m$, $y$좌표 $1,2,3,\cdots,n$인 격자점들이 찍혀 있다.)

  $A(3,100)-A(2,100)$을 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    $A(3,100)-A(2,100)$을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '9899', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$A(2,n)={}_n\mathrm{C}_2-(n-1)$, $A(3,n)=3\,{}_n\mathrm{C}_2+(n-2)-2(n-1)=3\,{}_n\mathrm{C}_2-n$이므로 차는 $2\,{}_n\mathrm{C}_2-1$, $n=100$에서 $9899$.'
    steps:
    - {id: 1a, content: '$A(2,100)=4851$, $A(3,100)=14750$, 차 $9899$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 축에 평행한 직사각형은 가로선 두 개와 세로선 두 개로 결정된다.
    - '$m=3$이면 변이 축에 평행하지 않은 직사각형도 생긴다. 어떤 모양인가?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.84 예시답안
    steps:
    - id: 1b-1
      content: |
        (1) $m=2$인 경우
        − $x$축과 평행한 $n$개의 선들 중에서 2개를 선택하여 만들 수 있는 직사각형의 개수를 구하면 ${}_2\mathrm{C}_2\times{}_n\mathrm{C}_2$이다.
        − 이때, 넓이가 1인 직사각형의 개수는 $n-1$이다.
        − 따라서, $A(2,n)={}_2\mathrm{C}_2\times{}_n\mathrm{C}_2-(n-1)={}_n\mathrm{C}_2-(n-1)$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (2) $m=3$인 경우
        − $x$축과 평행한 $n$개의 선들 중에서 2개를 선택하고 $y$축과 평행한 3개의 선들 중에서 2개를 선택하여 만들 수 있는 직사각형의 개수를 구하면 ${}_3\mathrm{C}_2\times{}_n\mathrm{C}_2$이다.
        − $x$축, $y$축과 평행하지 않은 선으로 만들 수 있는 직사각형은 $n-2$개 있다. (예시 그림: 꼭짓점이 $(2,1),(1,2),(2,3),(3,2)$인 정사각형과 $(2,2),(1,3),(2,4),(3,3)$인 정사각형)
        − 이때 넓이가 1인 직사각형의 개수는 $2(n-1)$이다.
        − 따라서, $A(3,n)={}_3\mathrm{C}_2\times{}_n\mathrm{C}_2+(n-2)-2(n-1)=3\,{}_n\mathrm{C}_2-n$
      criteria: [1.B2]
    - id: 1b-3
      content: |
        따라서, $A(3,n)-A(2,n)=3\,{}_n\mathrm{C}_2-n-{}_n\mathrm{C}_2+(n-1)=2\,{}_n\mathrm{C}_2-1$이므로, $A(3,100)-A(2,100)=2\,{}_{100}\mathrm{C}_2-1=9899$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 6
      evidence: '$A(2,n)={}_2\mathrm{C}_2\times{}_n\mathrm{C}_2-(n-1)={}_n\mathrm{C}_2-(n-1)$의 수식을 유도하거나, $A(2,100)={}_{100}\mathrm{C}_2-99=4851$을 바르게 계산했다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 12
      evidence: '$A(3,n)-A(2,n)=3\,{}_n\mathrm{C}_2-n-{}_n\mathrm{C}_2+(n-1)=2\,{}_n\mathrm{C}_2-1$의 수식을 유도하거나, $A(3,100)=3\,{}_{100}\mathrm{C}_2-100=14750$을 바르게 계산했다(대각선으로 만들어지는 직사각형의 개수 $n-2=98$개를 빠뜨린 경우는 8점만 부여).'
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: '$A(3,100)-A(2,100)=9899$를 바르게 계산했다.'
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: '1.B2 에서 대각선으로 만들어지는 직사각형 $n-2=98$개를 빠뜨림(공식 채점기준: 12점 중 8점만 부여)'
      effect: minus
      value: 4
    - code: D1-2
      condition: 계산 실수로 틀렸어도 논리 전개 과정이 맞으면 해당 부분에 1~2점 부분 점수 / 완성도에 따라 총점 20점 이내에서 ±1점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CNT-4312}
  misconceptions:
  - id: MC-CNT-4312
    outcome_code: '70'
    wrong_work: '축에 평행한 직사각형만 세어 $A(3,100)=14652$, 차를 $9801$로 답함'
    detect_cue: '답이 9801, 또는 $A(3,n)$ 식에 $n-2$ 항이 없음'
    feedback: 네 점으로 만든 직사각형의 변이 꼭 축에 평행할 필요는 없습니다. 세로 3줄이면 45° 기울어진 정사각형도 만들어집니다.
    remedy: [RL-1]

