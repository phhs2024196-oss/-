intent: 도형과 연관하여 경우의 수를 계산하는 능력을 평가하고자 하며, 이를 위하여 '조합'의 개념을 사용할 수 있는지를 평가한다. 경우의 수에 대한 계산능력 및 조합 개념의 이해도를 평가하며 난이도는 '중' 정도(가이드북 출제의도 요지).
key_idea: '축에 평행한 직사각형은 가로선 2개·세로선 2개를 고르는 조합 ${}_m\mathrm{C}_2\times{}_n\mathrm{C}_2$, $m=3$이면 축에 평행하지 않은(45° 기울어진) 정사각형 $n-2$개가 추가되고, 넓이 1인 것($m=2$: $n-1$개, $m=3$: $2(n-1)$개)을 뺀다.'
stuck: '$m=3$일 때 축에 평행하지 않은 직사각형(대각선 방향 정사각형) $n-2$개를 빠뜨리기 쉬움'
