intent: '[2-1] 도함수를 이용하여 3차 함수의 그래프의 개형을 파악하고, 함수의 그래프와 방정식의 해 사이를 이용해 방정식의 해의 개수를 알아낼 수 있는지, [2-2] 삼각함수의 덧셈정리를 상황에 맞게 적용하고 미분과 정적분의 관계를 이해하는지, 삼각함수의 합 공식을 이용해 연립방정식을 풀 수 있는지 평가한다(가이드북 출제의도 요지).'
key_idea: '[2-1] $f^{\prime}(x)=6x(x+k)$이므로 극값 $f(0)$, $f(-k)$가 같은 부호이면 실근 1개. [2-2] $\sin(x-t)$를 덧셈정리로 풀어 $\displaystyle\int_0^xf(t)\cos t\,dt$, $\displaystyle\int_0^xf(t)\sin t\,dt$에 대한 연립방정식을 만들고 미분해 $f(x)=\ln(1+x^2)+\left(\dfrac{2x}{1+x^2}\right)^{\prime}$을 얻는다.'
stuck: '[2-2] 적분변수 $t$와 무관한 $\sin x$, $\cos x$를 적분 밖으로 빼낸 뒤, 원식과 미분한 식을 연립해 한 적분을 분리하는 단계'
