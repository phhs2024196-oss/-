stimuli:
- label: '1'
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능하고 $x=a$에서 극값을 가지면 $f'(a)=0$이다.
- label: '2'
  body: |
    다항식 $P(x)$에 대하여 $P(\alpha)=0$일 때, $P(x)$를 $x-\alpha$로 나눈 몫을 $Q(x)$라 하면 $P(x)=(x-\alpha)Q(x)$이다.
- label: '3'
  body: |
    각 $\alpha$와 $\beta$에 대하여 다음 식이 성립한다.
    $$\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta,\qquad \sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$$
    $$\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta,\qquad \cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$$
- label: '4'
  body: |
    함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때 다음 식이 성립한다.
    $$\dfrac{d}{dx}\int_a^xf(t)\,dt=f(x)\quad(\text{단, }a<x<b)$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    $x$에 대한 방정식 $2x^3+3kx^2-(2k^2+k-2)=0$이 단 하나의 실근을 가지게 하는 실수 $k$의 범위를 구하시오. (단, $k\ge0$이다.) [10점]
  points: 10
  depends_on: []
  answer: {kind: set, value: '0\le k<\dfrac{-1+\sqrt{17}}{4}\ \text{또는}\ 1<k<2', equivalents: ['[0,(-1+sqrt(17))/4) ∪ (1,2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$f(0)=-(2k^2+k-2)$, $f(-k)=(k+1)(k-1)(k-2)$. $f(0)>0\iff k<\dfrac{-1+\sqrt{17}}4$, $f(-k)<0\iff 1<k<2$ ($k>0$).'
    steps:
    - {id: 1a, content: '두 조건의 합집합과 $k=0$을 합쳐 $0\le k<\dfrac{-1+\sqrt{17}}{4}$ 또는 $1<k<2$', criteria: [1.M1, 1.A1, 1.R1, 1.A2]}
    hint_ladder:
    - 삼차함수의 극댓값과 극솟값이 어떤 부호일 때 실근이 하나뿐인가?
    - '$f(-k)$를 $k$에 대한 다항식으로 인수분해해 보자($k=1$을 대입해 보라).'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.84~85 예시답안
    steps:
    - id: 1b-1
      content: |
        $f(x)=2x^3+3kx^2-(2k^2+k-2)$라 하자. 우선 $k=0$인 경우 해가 하나인 것을 확인한 후, $k>0$이라 가정한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이때 $f'(x)=6x(x+k)$이므로 $f(x)$는 $x=-k$에서 극대, $x=0$에서 극소이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        따라서 단 하나의 해를 가지기 위해서는
        $$f(0)=-(2k^2+k-2)>0\ \text{또는}\ f(-k)=k^3-2k^2-k+2=(k+1)(k-1)(k-2)<0\ \Rightarrow\ (k-1)(k-2)<0$$
        이다.
      criteria: [1.R1]
    - id: 1b-4
      content: |
        위 부등식을 풀어 $k$의 범위 $0\le k<\dfrac{-1+\sqrt{17}}{4}$ 또는 $1<k<2$를 얻는다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: '$f(x)=2x^3+3kx^2-(2k^2+k-2)$라 하고 미분을 이용하여 문제를 푸는 것을 시도했다.'
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: '$f(x)$의 극댓값과 극솟값($f(-k)$, $f(0)$)을 구했다.'
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: '$f(0)>0$ 또는 $f(-k)<0$일 때 해가 하나라는 것을 명시했다.'
      depends_on: []
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: '최종적으로 정답 $0\le k<\dfrac{-1+\sqrt{17}}{4}$ 또는 $1<k<2$를 얻었다.'
      depends_on: [1.R1]
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수 / 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4313}
  misconceptions:
  - id: MC-CAL-4313
    outcome_code: '70'
    wrong_work: '실근이 하나일 조건을 (극댓값)×(극솟값)$<0$으로 잡거나, $f(0)>0$과 $f(-k)<0$을 동시에(그리고) 요구함'
    detect_cue: '답이 $\dfrac{-1+\sqrt{17}}{4}<k<1$ 또는 $k>2$ 꼴, 또는 공집합'
    feedback: '삼차방정식의 실근이 하나이려면 극댓값과 극솟값이 같은 부호(곱이 양수)여야 합니다. 극소 $f(0)>0$이거나 극대 $f(-k)<0$이면 됩니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    연속함수 $f(x)$가 모든 실수 $x$에 대하여
    $$\int_0^xf(t)\sin(x-t)\,dt=\ln(1+x^2)$$
    을 만족한다. 이때 정적분 $\displaystyle\int_0^2xf(x)\,dx$의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{3}{2}\ln5-\dfrac{2}{5}', equivalents: ['3/2*ln(5)-2/5'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$F=\displaystyle\int_0^xf\cos t\,dt$, $G=\displaystyle\int_0^xf\sin t\,dt$이면 $F\sin x-G\cos x=\ln(1+x^2)$, 미분하면 $F\cos x+G\sin x=\dfrac{2x}{1+x^2}$. $F$를 풀어 미분하면 $f=\ln(1+x^2)+\left(\dfrac{2x}{1+x^2}\right)^{\prime}$.'
    steps:
    - {id: 2a, content: '$\displaystyle\int_0^2x\ln(1+x^2)dx=-2+\dfrac52\ln5$, $\displaystyle\int_0^2x\left(\dfrac{2x}{1+x^2}\right)^{\prime}dx=\dfrac85-\ln5$', criteria: [2.B1, 2.B2, 2.B3, 2.B4]}
    hint_ladder:
    - '$\sin(x-t)$를 덧셈정리로 풀면 $x$만의 함수를 적분 밖으로 뺄 수 있다.'
    - 양변을 미분한 식과 원래 식을 연립하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.85 예시답안
    steps:
    - id: 2b-1
      content: |
        우선 사인함수의 덧셈정리를 적용하여 식을 다음과 같이 정리한다.
        $$\ln(1+x^2)=\int_0^xf(t)\sin(x-t)\,dt=\int_0^xf(t)(\sin x\cos t-\cos x\sin t)\,dt=\sin x\left\{\int_0^xf(t)\cos t\,dt\right\}-\cos x\left\{\int_0^xf(t)\sin t\,dt\right\}$$
      criteria: [2.B1]
    - id: 2b-2
      content: |
        위의 식을 미분하면
        $$\dfrac{2x}{1+x^2}=\cos x\left\{\int_0^xf(t)\cos t\,dt\right\}+\sin x\left\{\int_0^xf(t)\sin t\,dt\right\}$$
        이므로, 위 두 식에 각각 $\sin x$, $\cos x$를 곱하여 더해
        $$\int_0^xf(t)\cos t\,dt=\ln(1+x^2)\sin x+\dfrac{2x}{1+x^2}\cos x$$
        를 얻는다. (또는 비슷한 방법으로 $\displaystyle\int_0^xf(t)\sin t\,dt=\dfrac{2x}{1+x^2}\sin x-\ln(1+x^2)\cos x$를 얻을 수 있다.)
      criteria: [2.B2]
    - id: 2b-3
      content: |
        위 식을 미분하면
        $$f(x)\cos x=\ln(1+x^2)\cos x+\left(\dfrac{2x}{1+x^2}\right)'\cos x$$
        (또는 $f(x)\sin x=\left(\dfrac{2x}{1+x^2}\right)'\sin x+\ln(1+x^2)\sin x$)이므로 $f(x)=\ln(1+x^2)+\left(\dfrac{2x}{1+x^2}\right)'$이다.
      criteria: [2.B3]
    - id: 2b-4
      content: |
        따라서
        $$\int_0^2xf(x)\,dx=\int_0^2x\ln(1+x^2)\,dx+\int_0^2x\left(\dfrac{2x}{1+x^2}\right)'dx$$
        이다. 첫 번째 적분은 치환적분과 부분적분을 이용하여 계산하고
        $$\int_0^2x\ln(1+x^2)\,dx=\dfrac12\int_1^5\ln u\,du=\dfrac12\Big[u\ln u-u\Big]_1^5=-2+\dfrac52\ln5$$
        두 번째 적분은 부분적분을 하여 값을 구한다.
        $$\int_0^2x\left(\dfrac{2x}{1+x^2}\right)'dx=\left[\dfrac{2x^2}{1+x^2}\right]_0^2-\int_0^2\dfrac{2x}{1+x^2}\,du=\dfrac85-\Big[\ln(1+x^2)\Big]_0^2=\dfrac85-\ln5$$
        마지막으로 위의 적분 값을 더하여 정답 $\dfrac32\ln5-\dfrac25$를 얻는다.
      criteria: [2.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: '삼각함수 정리를 이용하여 $\ln(1+x^2)=g(x)\sin x-h(x)\cos x$ 형태로 식을 정리했다.'
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: '미분하여 $\dfrac{2x}{1+x^2}=g(x)\cos x+h(x)\sin x$를 얻고, 연립방정식을 풀어 $g(x)=\ln(1+x^2)\sin x+\dfrac{2x}{1+x^2}\cos x$ 또는 $h(x)=\dfrac{2x}{1+x^2}\sin x-\ln(1+x^2)\cos x$를 얻었다.'
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: '미분하여 $f(x)=\ln(1+x^2)+\left(\dfrac{2x}{1+x^2}\right)^{\prime}$를 얻었다.'
      depends_on: []
      steps: [2b-3]
    - id: 2.B4
      mark_type: B
      points: 6
      evidence: '최종적으로 적분을 계산하여 정답 $\dfrac32\ln5-\dfrac25$를 얻었다.'
      depends_on: []
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수 / 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4314}
  misconceptions:
  - id: MC-CAL-4314
    outcome_code: '70'
    wrong_work: '$\dfrac{d}{dx}\displaystyle\int_0^xf(t)\sin(x-t)\,dt=f(x)\sin(x-x)=0$처럼 피적분함수에 $x$가 있는데 제시문의 공식을 그대로 적용함'
    detect_cue: '첫 미분 결과가 $0$ 또는 $f(x)\sin0$, 덧셈정리로 $x$를 분리하는 과정이 없음'
    feedback: '$\dfrac{d}{dx}\displaystyle\int_a^xf(t)\,dt=f(x)$는 피적분함수에 $x$가 없을 때만 씁니다. 먼저 덧셈정리로 $\sin x$, $\cos x$를 적분 밖으로 빼세요.'
    remedy: [RL-2]

