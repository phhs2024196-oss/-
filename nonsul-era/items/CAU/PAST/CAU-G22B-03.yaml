stimuli:
- label: '1'
  body: |
    닫힌구간 $[a,b]$에서 두 함수 $f(x)$, $g(x)$의 도함수가 연속일 때 다음 식이 성립한다.
    $$\int_a^bf(x)g'(x)\,dx=\big[f(x)g(x)\big]_a^b-\int_a^bf'(x)g(x)\,dx$$
- label: '2'
  body: |
    점 $(a,b)$와 점 $(b,a)$는 직선 $y=x$에 대하여 대칭이다.
- label: '3'
  body: |
    두 평면벡터 $\vec a$, $\vec b$가 이루는 각의 크기가 $\theta$일 때, $\vec a$와 $\vec b$의 내적은 $\vec a\cdot\vec b=\lvert\vec a\rvert\lvert\vec b\rvert\cos\theta$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    실수 $\theta$에 대하여 영역 $A=\{(x,y)\mid(x-1)^2+y^2\le1,\ y\ge(\tan\theta)x\}$의 넓이를 $g(\theta)$라 하자. 정적분 $\displaystyle\int_0^{\frac{\pi}{4}}\dfrac{g(\theta)}{\cos^2\theta}\,d\theta$의 값을 구하시오. (단, $0\le\theta\le\dfrac{\pi}{4}$이다.) [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{\pi}{4}', equivalents: ['pi/4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$g=\dfrac{\pi}{2}-\theta-\sin\theta\cos\theta$, $\dfrac{g}{\cos^2\theta}=\dfrac{\pi}{2}\sec^2\theta-\theta\sec^2\theta-\tan\theta$이고 $\displaystyle\int\theta\sec^2\theta\,d\theta=\theta\tan\theta-\int\tan\theta\,d\theta$로 $\tan\theta$ 항이 상쇄.'
    steps:
    - {id: 1a, content: '$\displaystyle\int_0^{\pi/4}\left(\dfrac{\pi}{2}\sec^2\theta\right)d\theta-\dfrac{\pi}{4}=\dfrac{\pi}{2}-\dfrac{\pi}{4}=\dfrac{\pi}{4}$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 원점은 원 위의 점이다. 직선과 원의 다른 교점까지의 현에 대한 중심각은?
    - '$\dfrac{\theta}{\cos^2\theta}$는 부분적분으로 처리하자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.86 예시답안
    steps:
    - id: 1b-1
      content: |
        직선 $y=(\tan\theta)x$는 $x$축의 양의 방향과 $\theta$의 각을 이루는 직선이므로 원의 성질을 이용하면
        $$g(\theta)=\dfrac12(\pi-2\theta)-\sin\theta\cos\theta=\dfrac{\pi}{2}-\theta-\sin\theta\cos\theta$$
        을 얻는다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $$\int_0^{\frac{\pi}{4}}\dfrac{\frac{\pi}{2}-\theta-\sin\theta\cos\theta}{\cos^2\theta}d\theta=\int_0^{\frac{\pi}{4}}\left(\dfrac{\pi}{2}\sec^2\theta-\theta\sec^2\theta-\tan\theta\right)d\theta$$
        이고 부분적분을 하면
        $$\int_0^{\frac{\pi}{4}}-\theta\sec^2\theta\,d\theta=\Big[-\theta\tan\theta\Big]_0^{\frac{\pi}{4}}+\int_0^{\frac{\pi}{4}}\tan\theta\,d\theta=\int_0^{\frac{\pi}{4}}\tan\theta\,d\theta-\dfrac{\pi}{4}$$
        이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        정리하면 주어진 정적분은 $\displaystyle\int_0^{\frac{\pi}{4}}\dfrac{\pi}{2}\sec^2\theta\,d\theta-\dfrac{\pi}{4}=\dfrac{\pi}{2}\Big[\tan\theta\Big]_0^{\frac{\pi}{4}}-\dfrac{\pi}{4}=\dfrac{\pi}{4}$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: '$g(\theta)=\dfrac{\pi}{2}-\theta-\sin\theta\cos\theta$를 보였다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: '부분적분 $\displaystyle\int_0^{\frac{\pi}{4}}-\theta\sec^2\theta\,d\theta=\int_0^{\frac{\pi}{4}}\tan\theta\,d\theta-\dfrac{\pi}{4}$를 보였다.'
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: '나머지 적분을 구하고 합하여 $\dfrac{\pi}{4}$를 구했다.'
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수 / 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4315}
  misconceptions:
  - id: MC-GEO-4315
    outcome_code: '70'
    wrong_work: '현의 중심각을 $2\theta$(또는 $\pi-\theta$)로 잡아 $g(\theta)$를 틀리게 구함'
    detect_cue: '$g(0)\ne\dfrac{\pi}{2}$ 이거나 $g\left(\dfrac{\pi}{4}\right)\ne\dfrac{\pi}{4}-\dfrac12$'
    feedback: '원점이 원 위에 있으므로 현과 접선($y$축)이 이루는 각은 $\dfrac{\pi}{2}-\theta$, 중심각은 그 두 배인 $\pi-2\theta$입니다. 특수한 $\theta=0$에서 반원 넓이 $\dfrac{\pi}{2}$가 나오는지 확인하세요.'
    remedy: [RL-1]
- id: '2'
  stem: |
    $x\ge1$에서 정의된 함수 $f(x)=\dfrac{1}{14+8\sqrt3}\ln x(\ln x-1)^2$에 대하여, 원점이 O인 좌표평면 위의 점 $\mathrm{A}(t,f(t))$가 있다. 점 A를 직선 $y=x$에 대하여 대칭시킨 점을 B라 할 때, 두 벡터 $\dfrac{\overrightarrow{\mathrm{OA}}}{\lvert\overrightarrow{\mathrm{OA}}\rvert}$와 $\dfrac{\overrightarrow{\mathrm{OB}}}{\lvert\overrightarrow{\mathrm{OB}}\rvert}$의 내적의 최댓값을 구하시오. (단, $x\ge1$에서 $f(x)\le\sqrt x$이다.) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{2e^{2+\sqrt3}}{1+e^{4+2\sqrt3}}', equivalents: ['2*exp(2+sqrt(3))/(1+exp(4+2*sqrt(3)))'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '내적 $=\cos\angle\mathrm{AOB}=\dfrac{2m}{1+m^2}$ ($m=\dfrac{f(t)}{t}\le1$)는 $m$에 대해 증가. 원점을 지나는 접선의 접점 $\ln a=2\pm\sqrt3$ 중 기울기가 큰 것은 $a=e^{2+\sqrt3}$ (기울기 $e^{-(2+\sqrt3)}$).'
    steps:
    - {id: 2a, content: '$m=e^{-(2+\sqrt3)}$일 때 $\dfrac{2m}{1+m^2}=\dfrac{2e^{2+\sqrt3}}{1+e^{4+2\sqrt3}}$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 단위벡터 두 개의 내적은 무엇과 같은가?
    - 직선 OA의 기울기가 클수록 $\angle\mathrm{AOB}$는 어떻게 되는가?
    - 원점에서 곡선에 그은 접선의 접점을 구하자. $\ln a$에 대한 방정식이 나온다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.86 예시답안
    steps:
    - id: 2b-1
      content: |
        $\angle\mathrm{AOB}=\theta$라 하자. 내적 정의를 고려하면 주어진 값은 $\cos\theta$임을 알 수 있다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        곡선 $y=\dfrac{1}{14+8\sqrt3}\ln x(\ln x-1)^2$은 $x=1$, $x=e$(중근)에서 근을 가지고 $x\ge e$에서 증가하면서 $f(x)\le\sqrt x$이다. 원점에서 곡선 $y=f(x)$에 그은 접선 중 기울기가 최대인 경우에 $\cos\theta$가 최댓값을 갖는다. $(a,f(a))$에서의 접선이 원점을 지나면 $f(a)=af'(a)$을 만족한다.
        계산하면 $\ln a(\ln a-1)^2=(\ln a-1)^2+2\ln a(\ln a-1)$이고 $(\ln a-1)$이 공통 인수이므로 나머지를 정리하면 $(\ln a)^2-4(\ln a)+1=0$이고 $\ln a=2\pm\sqrt3$을 얻을 수 있다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        $\ln a=2-\sqrt3$에 대응하는 접점은 $\left(e^{2-\sqrt3},\ \dfrac{7-4\sqrt3}{7+4\sqrt3}\right)$이고 $\ln a=2+\sqrt3$에 대응하는 접점은 $(e^{2+\sqrt3},\ 1)$이다.
        두 접점의 기울기를 비교해보자. $e<3$, $\sqrt3<2$를 고려하면 $e^{2\sqrt3}<3^4=81$이고 이를 이용하면 다음을 보일 수 있다.
        $$\dfrac{7-4\sqrt3}{(7+4\sqrt3)e^{2-\sqrt3}}<\dfrac{1}{e^{2+\sqrt3}}\iff e^{2\sqrt3}<\dfrac{7+4\sqrt3}{7-4\sqrt3}=(7+4\sqrt3)^2=97+56\sqrt3$$
        따라서 $\mathrm{A}(e^{2+\sqrt3},1)$, $\mathrm{B}(1,e^{2+\sqrt3})$일 때 최댓값 $\dfrac{2e^{2+\sqrt3}}{1+e^{4+2\sqrt3}}$을 갖는다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: '주어진 식이 $\cos\theta$($\theta=\angle\mathrm{AOB}$)임을 보였다.'
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 7
      evidence: '원점을 지나는 접선의 방정식을 구하고 $\ln a=2\pm\sqrt3$을 보였다.'
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: '기울기를 비교하여 $\mathrm{A}(e^{2+\sqrt3},1)$일 때 최댓값 $\dfrac{2e^{2+\sqrt3}}{1+e^{4+2\sqrt3}}$을 구했다.'
      depends_on: []
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수 / 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4316}
  misconceptions:
  - id: MC-CAL-4316
    outcome_code: '70'
    wrong_work: '원점을 지나는 두 접선 중 접점 $x$좌표가 작은 $e^{2-\sqrt3}$ 쪽(또는 비교 없이 하나)을 택해 최댓값을 구함'
    detect_cue: '접점 $e^{2-\sqrt3}$에서 계산한 값을 답으로 제시하거나 두 기울기를 비교하는 식이 없음'
    feedback: '원점을 지나는 접선이 두 개이면 두 기울기를 직접 비교해야 합니다. $e^{2\sqrt3}$과 $(7+4\sqrt3)^2$의 대소를 확인하세요.'
    remedy: [RL-2]

