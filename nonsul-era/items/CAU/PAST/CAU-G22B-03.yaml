intent: '[3-1] 주어진 영역을 알아내고 원과 삼각형의 성질을 이용하여 넓이를 계산하고, 주어진 정적분을 구할 수 있는지, [3-2] 벡터의 내적을 잘 이해하고 있는지 확인하고, 곡선의 접선 중 원점을 지나는 접선을 구하고 그 중 기울기가 큰 것을 선별할 수 있는지 평가한다(가이드북 출제의도 요지).'
key_idea: '[3-1] 현이 원점에서 각 $\theta$로 출발하므로 중심각 $\pi-2\theta$, $g(\theta)=\dfrac{\pi}{2}-\theta-\sin\theta\cos\theta$, $\dfrac{g}{\cos^2\theta}$는 $\sec^2\theta$ 항의 부분적분. [3-2] 두 단위벡터의 내적은 $\cos\angle\mathrm{AOB}$이고, $f(x)\le\sqrt x$에서 기울기 $\dfrac{f(t)}{t}\le1$이므로 원점에서 그은 접선 중 기울기가 최대인 경우에 최대.'
stuck: '[3-2] 내적의 최대를 직선 OA의 기울기 최대 문제로 바꾸고, 원점을 지나는 접선 조건 $f(a)=af^{\prime}(a)$를 $\ln a$의 이차방정식으로 정리하는 단계, 두 접점의 기울기 비교'
idea_tags: [IDEA-CHORD-SEGMENT-AREA-CENTRAL-ANGLE, IDEA-INTEGRATION-BY-PARTS-SEC-SQUARED, IDEA-MAX-SLOPE-TANGENT-FROM-ORIGIN, IDEA-REFLECTION-DOT-COS]
tags: [활꼴의 넓이, 부분적분, 직선 y=x 대칭, 벡터의 내적, 원점을 지나는 접선, 중앙대 실전]
elements:
  materials: ['영역 $A=\{(x,y)\mid(x-1)^2+y^2\le1,\ y\ge(\tan\theta)x\}$의 넓이 $g(\theta)$', '정적분 $\displaystyle\int_0^{\pi/4}\dfrac{g(\theta)}{\cos^2\theta}d\theta$', '$f(x)=\dfrac{1}{14+8\sqrt3}\ln x(\ln x-1)^2$ ($x\ge1$)', '점 $\mathrm{A}(t,f(t))$와 $y=x$ 대칭점 B', '$\dfrac{\overrightarrow{\mathrm{OA}}}{\lvert\overrightarrow{\mathrm{OA}}\rvert}\cdot\dfrac{\overrightarrow{\mathrm{OB}}}{\lvert\overrightarrow{\mathrm{OB}}\rvert}$']
  concepts: [원의 성질(중심각과 원주각), 부채꼴·삼각형의 넓이, 부분적분법, 벡터의 내적, 직선 $y=x$에 대한 대칭, 접선의 방정식, 로그함수의 미분]
  tools: ['직선과 $x$축의 각 $\theta$ ⇒ 중심각 $\pi-2\theta$', '$\dfrac{\pi}{2}\sec^2\theta-\theta\sec^2\theta-\tan\theta$로 분해', '$\theta\sec^2\theta$ 부분적분', '내적 = $\cos\angle\mathrm{AOB}$', '원점을 지나는 접선 조건 $f(a)=af^{\prime}(a)$', '$\ln a(\ln a-1)$ 공통인수로 $(\ln a)^2-4\ln a+1=0$', '두 접점 기울기 비교($e<3$, $\sqrt3<2$)']
  conditions:
  - '$0\le\theta\le\dfrac{\pi}{4}$ ⇒ 직선 $y=(\tan\theta)x$는 원과 원점·다른 한 점에서 만나고 $A$는 직선 위쪽 활꼴'
  - '$x\ge1$에서 $f(x)\le\sqrt x$ ⇒ 직선 OA의 기울기 $\dfrac{f(t)}{t}\le\dfrac{1}{\sqrt t}\le1$ ⇒ $\angle\mathrm{AOB}=\dfrac{\pi}{2}-2\angle(\mathrm{OA},x\text{축})\ge0$, 기울기가 클수록 $\cos$가 큼'
  - '$f(1)=f(e)=0$(중근 $x=e$), $x\ge e$에서 증가'
  stimuli_used: ['1', '2', '3']
  subpart_links:
  - from: '1'
    to: '2'
    relation: 독립(같은 제시문을 각각 사용)

