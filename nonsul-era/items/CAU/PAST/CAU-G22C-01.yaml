stimuli: []

stem: |
  다음 상황에 기초하여 문제에 답하시오.

  다음은 함수 $f(x)=2^{x-1}+2$와 원의 방정식 $(x-3)^2+y^2=9$의 일부이다.

  (그림: 곡선 $f(x)=2^{x-1}+2$와 반원 $(x-3)^2+y^2=9\ (y\ge0)$. $y$축 위의 점 $\mathrm{A}$는 곡선의 $y$절편, 점 $\mathrm{B}$는 원점 O에 표시되어 있다.)

  $y$축 위의 점 A와 B는 다음의 규칙에 따라 이동한다.

  - 1부터 4까지의 자연수가 각각 하나씩 적혀있는 4장의 카드가 있다. 이 중에서 임의로 1장의 카드를 택하여 그 카드에 적혀있는 숫자를 $a$라고 하면, 점 A는 $(a,f(a))$로 이동한다.
  - 주사위를 한 번 던져서 나오는 눈의 수를 $b$라고 하면, 점 B는 $x=b$와 $(x-3)^2+y^2=9\ (y\ge0)$과의 교점으로 이동한다.

  위의 규칙에 따라 이동한 두 점 A와 B에서 원점까지의 거리를 각각 구하였다. 이때 각 거리 제곱의 차이가 최소가 되는 순서쌍 $(a,b)$를 모두 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    각 거리 제곱의 차이가 최소가 되는 순서쌍 $(a,b)$를 모두 구하시오.
  points: 20
  depends_on: []
  answer: {kind: set, value: '(1,2),\ (2,3)', equivalents: ['{(1,2),(2,3)}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\overline{\mathrm{OA}}^2\in\{10,20,45,116\}$, $\overline{\mathrm{OB}}^2=6b\in\{6,12,\dots,36\}$. 차의 최솟값 2는 $(10,12)$, $(20,18)$에서.'
    steps:
    - {id: 1a, content: '$\lvert10-12\rvert=\lvert20-18\rvert=2$, 그 밖의 차는 모두 $4$ 이상', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 점 B는 반원 위에 있다. $x=b$일 때 $y$좌표는?
    - '$\overline{\mathrm{OB}}^2$을 $b$에 대한 식으로 간단히 해 보자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.105 예시답안
    steps:
    - id: 1b-1
      content: |
        아래와 같이 원점에서의 거리의 제곱을 구할 수 있다.
        A: $(1,3)\to10$, $(2,4)\to20$, $(3,6)\to45$, $(4,10)\to116$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        B: $(1,\sqrt5)\to6$, $(2,\sqrt8)\to12$, $(3,3)\to18$, $(4,\sqrt8)\to24$, $(5,\sqrt5)\to30$, $(6,0)\to36$
      criteria: [1.B2]
    - id: 1b-3
      content: |
        각 거리 제곱의 차이가 최소가 되는 경우는 아래와 같다.
        − $\mathrm{A}=(1,3)$과 $\mathrm{B}=(2,\sqrt8)$일 때, 거리의 제곱의 차이는 $\lvert10-12\rvert=2$
        − $\mathrm{A}=(2,4)$와 $\mathrm{B}=(3,3)$일 때, 거리의 제곱의 차이는 $\lvert20-18\rvert=2$
        이때의 순서쌍 $(a,b)$는 $(1,2)$, $(2,3)$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 8
      evidence: '원점에서 점 A까지의 거리(제곱 $10,20,45,116$)를 바르게 계산했다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 10
      evidence: '원점에서 점 B까지의 거리(제곱 $6,12,18,24,30,36$)를 바르게 계산했다.'
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: '거리 제곱 차이가 최소가 되는 경우 $(1,2)$, $(2,3)$을 바르게 찾았다.'
      depends_on: []
      steps: [1b-3]
    deductions:
