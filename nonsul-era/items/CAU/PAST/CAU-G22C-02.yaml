intent: '[2-1] 미분의 정의를 잘 이해하고 있는지, 주어진 조건으로부터 함수의 값과 미분을 얻고 이를 이용하여 수열을 찾아내고 수열의 합을 계산할 수 있는지, [2-2] 정적분에서 적분 구간의 의미를 이해하고 적분 함수의 성질(삼각함수의 주기)을 이용하여 정적분을 계산하기 쉽게 적절히 나누는 방법과, 수열의 극한의 기본 성질을 이용해 극한값을 구할 수 있는지 평가한다(가이드북 출제의도 요지).'
key_idea: '[2-1] 극한이 존재하려면 $f(k)=k$, 따라서 $f^{\prime}(k)=k^{\frac32}$, $g^{\prime}(n)=f^{\prime}(f(n))f^{\prime}(n)=n^3$. [2-2] 구간을 길이 $\pi$씩 나누고 $u=x-k\pi$로 옮기면 $\lvert\sin x\rvert\cos^2x$ 부분은 매번 $\dfrac23$, $\sin^5(2x)\cos x$ 부분은 $(-1)^k$배로 번갈아 나타나 $\dfrac1n\sum(-1)^k\to0$.'
stuck: '[2-2] 주기 $\pi$를 이용해 구간을 쪼갠 뒤 $\cos(u+k\pi)=(-1)^k\cos u$로 부호만 바뀜을 보고, $\dfrac1n\sum_{k=0}^{n-1}(-1)^k$을 샌드위치로 처리하는 단계'
idea_tags: [IDEA-LIMIT-EXISTS-NUMERATOR-ZERO, IDEA-SPLIT-INTEGRAL-BY-PERIOD, IDEA-SQUEEZE-AVERAGE-ALTERNATING]
tags: [미분계수의 정의, 합성함수의 미분, 거듭제곱의 합, 주기함수의 정적분, 수열의 극한, 중앙대 실전]
elements:
  materials: ['$\displaystyle\lim_{x\to k}\dfrac{f(x)-k}{x-k}=f(k)\sqrt{f(k)}$ (모든 자연수 $k$, $f(x)\ge0$)', '$g(x)=f(f(x))$, $\displaystyle\sum_{n=1}^{20}g^{\prime}(n)$', '$I_n=\displaystyle\int_0^{n\pi}\{\lvert\sin x\rvert\cos^2x+\sin^5(2x)\cos x\}dx$', '$\displaystyle\lim_{n\to\infty}\dfrac{I_n}{n}$']
  concepts: [미분계수의 정의, 합성함수의 미분법, 자연수의 거듭제곱의 합, 정적분의 성질(구간 나누기), 삼각함수의 주기성, 치환적분법, 수열의 극한(샌드위치 정리)]
  tools: ['분모 $\to0$이므로 분자 $\to0$ ⇒ $f(k)=k$', '미분계수 정의로 $f^{\prime}(k)$', '$\sum n^3=\left(\dfrac{n(n+1)}{2}\right)^2$', '$\displaystyle\int_0^{n\pi}=\sum_{k=0}^{n-1}\int_{k\pi}^{(k+1)\pi}$', '$u=x-k\pi$ 치환', '$t=\cos u$ 치환으로 $\displaystyle\int_0^\pi\sin u\cos^2u\,du=\dfrac23$', '$0\le\dfrac1n\sum(-1)^k\le\dfrac1n$']
  conditions:
  - '극한값이 존재하고 분모 $x-k\to0$ ⇒ $f(k)-k=0$'
  - '$f(x)\ge0$ ⇒ $\sqrt{f(k)}$ 정의, $f^{\prime}(k)=k\sqrt k$'
  - '$g^{\prime}(n)=f^{\prime}(f(n))f^{\prime}(n)$에서 $f(n)=n$ ⇒ $g^{\prime}(n)=(f^{\prime}(n))^2=n^3$'
  - '$\sum_{k=0}^{n-1}(-1)^k\in\{0,1\}$ ⇒ $\dfrac1n\sum(-1)^k\to0$'
  stimuli_used: ['1', '2', '3', '4']
  subpart_links:
  - from: '1'
    to: '2'
    relation: 독립(같은 제시문을 각각 사용)

