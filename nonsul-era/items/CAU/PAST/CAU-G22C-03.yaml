stimuli:
- label: '1'
  body: |
    함수 $y=f(x)$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프는 직선 $y=x$에 대하여 대칭이다.
- label: '2'
  body: |
    점 $(x_1,y_1)$과 직선 $px+qy+r=0$ 사이의 거리는 $\dfrac{\lvert px_1+qy_1+r\rvert}{\sqrt{p^2+q^2}}$이다.
- label: '3'
  body: |
    두 벡터 $\overrightarrow{\mathrm{OA}}$와 $\overrightarrow{\mathrm{OB}}$의 내적을 $\overrightarrow{\mathrm{OA}}\cdot\overrightarrow{\mathrm{OB}}$로 나타낸다.
- label: '4'
  body: |
    이차방정식 $ax^2+bx+c=0\ (a\ne0)$의 두 근을 $\alpha$, $\beta$라 하면 $\alpha+\beta=-\dfrac{b}{a}$, $\alpha\beta=\dfrac{c}{a}$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    함수 $f(x)=x+\dfrac{1}{2(x+1)^2}\ (x\ge0)$과 그 역함수 $f^{-1}(x)$가 있다. 좌표평면 위에서 $y=f(x)$의 그래프 위의 점 A를 지나고 기울기가 $-1$인 직선을 $\ell$이라 할 때, 직선 $\ell$과 역함수 $y=f^{-1}(x)$의 교점을 B라 하자. 두 점 A, B와 원점 O가 이루는 삼각형 OAB의 넓이가 최대가 되게 하는 점 A의 좌표를 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\left(\dfrac{\sqrt5-1}{2},\ \dfrac{\sqrt5+1}{4}\right)', equivalents: ['((sqrt(5)-1)/2, (sqrt(5)+1)/4)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$h(t)=\dfrac14\left(2t+\dfrac1{2(t+1)^2}\right)\dfrac1{(t+1)^2}$, $h^{\prime}(t)$의 분자 $-t(t^2+t-1)$에서 $t=\dfrac{\sqrt5-1}2$.'
    steps:
    - {id: 1a, content: '$t+1=\dfrac{\sqrt5+1}{2}$, $(t+1)^2=\dfrac{3+\sqrt5}{2}$이므로 $y=t+\dfrac{1}{3+\sqrt5}=\dfrac{\sqrt5+1}{4}$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 기울기 $-1$인 직선은 직선 $y=x$와 어떤 관계인가? B는 A와 어떤 관계인가?
    - 원점과 직선 $\ell$ 사이 거리가 높이, $\overline{\mathrm{AB}}$가 밑변이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.106 예시답안
    steps:
    - id: 1b-1
      content: |
        $\mathrm{A}\left(t,\ t+\dfrac{1}{2(t+1)^2}\right)$일 때, 역함수의 성질에 의하여 $\mathrm{B}\left(t+\dfrac{1}{2(t+1)^2},\ t\right)$이다. 점 A를 지나고 기울기가 $-1$인 직선의 방정식은 $x-t+y-\left(t+\dfrac{1}{2(t+1)^2}\right)=0$이므로 원점에서 거리는 $\dfrac{1}{\sqrt2}\left(2t+\dfrac{1}{2(t+1)^2}\right)$이고 선분 AB의 길이는 $\dfrac{1}{\sqrt2(t+1)^2}$이다. 삼각형 OAB의 넓이를 $h(t)$라 하면 $h(t)=\dfrac14\left(2t+\dfrac{1}{2(t+1)^2}\right)\dfrac{1}{(t+1)^2}$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $t$에 대하여 미분하면 $h'(t)=\dfrac{1}{2(t+1)^5}(-t^3-t^2+t)$을 얻고 $t=\dfrac{\sqrt5-1}{2}$에서 최댓값을 갖는다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        이때, 점 A의 좌표는 $\left(\dfrac{\sqrt5-1}{2},\ \dfrac{\sqrt5+1}{4}\right)$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: '$h(t)=\dfrac14\left(2t+\dfrac{1}{2(t+1)^2}\right)\dfrac{1}{(t+1)^2}$을 구했다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: '미분하여 $t=\dfrac{\sqrt5-1}{2}$를 구했다.'
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: '$\left(\dfrac{\sqrt5-1}{2},\ \dfrac{\sqrt5+1}{4}\right)$를 구했다.'
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수 / 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-4320}
  misconceptions:
  - id: MC-ALG-4320
    outcome_code: '70'
    wrong_work: '역함수 $f^{-1}(x)$의 식을 직접 구하려다 막히거나, B를 A의 $y=x$ 대칭점이 아닌 다른 점(예: $\ell$과 $y=x$의 교점)으로 잡음'
    detect_cue: '$\overline{\mathrm{AB}}$를 $\dfrac{1}{2\sqrt2(t+1)^2}$(절반)로 계산하거나 역함수를 풀려는 시도만 있음'
    feedback: '기울기 $-1$인 직선은 $y=x$에 수직이므로, 이 직선 위에서 A의 $y=x$ 대칭점이 바로 역함수 그래프 위의 점 B입니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표평면 위에 세 점 $\mathrm{A}(1,0)$, $\mathrm{B}(3,0)$, $\mathrm{C}(0,2)$가 있고, 점 P가 다음을 만족한다.

    (가) $\overrightarrow{\mathrm{PA}}\cdot\overrightarrow{\mathrm{PB}}=0$
    (나) 두 실수 $x$, $y$에 대하여 $\overrightarrow{\mathrm{PC}}=x\overrightarrow{\mathrm{PA}}+y\overrightarrow{\mathrm{PB}}$이다.

    $\dfrac{x+y}{x+3y}$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $mM^2+Mm^2$의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{1}{3}', equivalents: ['1/3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$k=\dfrac{2-b}{2a}$이면 P는 직선 $b=-2ka+2$와 원 $(a-2)^2+b^2=1$의 공통점. 접할 조건 $12k^2-16k+3=0$의 두 근이 $M$, $m$이므로 $mM(m+M)=\dfrac14\cdot\dfrac43=\dfrac13$.'
    steps:
    - {id: 2a, content: '$\dfrac{\lvert4k-2\rvert}{\sqrt{4k^2+1}}=1\iff12k^2-16k+3=0$, $M+m=\dfrac43$, $Mm=\dfrac14$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 'P를 $(a,b)$로 놓고 (가)를 정리하면 어떤 도형인가?'
    - '(나)를 성분별로 비교해 $x+y$, $x+3y$를 $a$, $b$로 나타내자.'
    - '$\dfrac{2-b}{2a}=k$는 원 위의 점과 어떤 고정점을 잇는 직선의 기울기와 관련 있는가?'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북(자연) p.107 예시답안 [방법 1]
    steps:
    - id: 2b-1
      content: |
        $\mathrm{P}(a,b)$라 하자. 조건 (가)에서 $(a-2)^2+b^2=1$이 나온다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        조건 (나)에서 $x+y=\dfrac{b-2}{b}$와 $a(x+y)-x-3y=a$가 나오고 정리하면 $x+y=\dfrac{b-2}{b}$와 $x+3y=-\dfrac{2a}{b}$이다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        따라서 $\dfrac{x+y}{x+3y}=\dfrac{2-b}{2a}$이다. $\dfrac{2-b}{2a}=k$로 놓으면 $b=-2ka+2$이고 이것은 $(0,2)$를 지나고 기울기 $-2k$인 직선의 방정식이다. $k$가 최대, 최소가 되는 것은 원 $(a-2)^2+b^2=1$에 접할 때이다. $(2,0)$에서 직선에 이르는 거리는 $\dfrac{\lvert4k-2\rvert}{\sqrt{4k^2+1}}=1$이고 정리하면 $12k^2-16k+3=0$이다.
        $M=\dfrac{4+\sqrt7}{6}$, $m=\dfrac{4-\sqrt7}{6}$ 근과 계수의 관계에 의하여 $mM^2+Mm^2=mM(m+M)=\dfrac{3}{12}\times\dfrac{16}{12}=\dfrac13$이다.
        (참고로 $M=\dfrac{4+\sqrt7}{6}$, $m=\dfrac{4-\sqrt7}{6}$이다.)
      criteria: [2.B3]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 2023 논술가이드북(자연) p.107 예시답안 [방법 2]
    key_idea: 원을 $a=2+\cos\theta$, $b=\sin\theta$로 매개화하고 $\theta$에 대해 미분하여 극대·극소를 구한다.
    steps:
    - id: 2c-1
      content: |
        $\dfrac{x+y}{x+3y}=\dfrac{2-b}{2a}$에서 $(a-2)^2+b^2=1$을 고려하여 $a=2+\cos\theta$, $b=\sin\theta$를 대입한다.
      criteria: [2.B1, 2.B2]
    - id: 2c-2
      content: |
        $\dfrac{x+y}{x+3y}=\dfrac{2-\sin\theta}{4+2\cos\theta}$이 되고 우변을 $\theta$에 대하여 미분하여 극대, 극소를 구하면 $M=\dfrac{4+\sqrt7}{6}$, $m=\dfrac{4-\sqrt7}{6}$이고 $mM(m+M)=\dfrac13$이 된다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: '원 $(a-2)^2+b^2=1$임을 보였다.'
      depends_on: []
      steps: [2b-1, 2c-1]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: '$x+y=\dfrac{b-2}{b}$와 $x+3y=-\dfrac{2a}{b}$를 보였다.'
      depends_on: []
      steps: [2b-2, 2c-1]
    - id: 2.B3
      mark_type: B
      points: 7
      evidence: '$mM(m+M)=\dfrac13$을 구했다.'
      depends_on: []
      steps: [2b-3, 2c-2]
    deductions:
    - code: D2-1
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수 / 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4321}
  misconceptions:
  - id: MC-GEO-4321
    outcome_code: '70'
    wrong_work: '(나)의 성분 비교에서 $\overrightarrow{\mathrm{PC}}=\mathrm{C}-\mathrm{P}$ 대신 $\mathrm{P}-\mathrm{C}$로 쓰는 등 벡터 방향을 뒤집어 $x+y$, $x+3y$의 부호가 틀림'
    detect_cue: '$x+y=\dfrac{2-b}{b}$ 또는 $x+3y=\dfrac{2a}{b}$처럼 한쪽 부호만 바뀜'
    feedback: '$\overrightarrow{\mathrm{PA}}=(1-a,\ -b)$처럼 (끝점)−(시작점)으로 성분을 쓰세요.'
    remedy: [RL-2]

