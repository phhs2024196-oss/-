  materials: ['$f(x)=x+\dfrac{1}{2(x+1)^2}\ (x\ge0)$와 역함수 $f^{-1}(x)$', '점 A(그래프 위), 기울기 $-1$인 직선 $\ell$, B($\ell$과 $y=f^{-1}(x)$의 교점), 삼각형 OAB', '$\mathrm{A}(1,0)$, $\mathrm{B}(3,0)$, $\mathrm{C}(0,2)$, 점 P', '$\dfrac{x+y}{x+3y}$의 최댓값 $M$, 최솟값 $m$, $mM^2+Mm^2$']
  concepts: [역함수의 그래프(직선 $y=x$ 대칭), 점과 직선 사이의 거리, 도함수를 이용한 최대·최소, 벡터의 성분과 내적, 원의 방정식, 원과 직선의 위치 관계(접선), 이차방정식의 근과 계수의 관계]
  tools: ['A$\left(t,t+\dfrac1{2(t+1)^2}\right)$, B$\left(t+\dfrac1{2(t+1)^2},t\right)$', '점과 직선 사이 거리로 높이', '$h^{\prime}(t)=\dfrac{-t^3-t^2+t}{2(t+1)^5}$ 부호', '$\mathrm{P}(a,b)$로 놓고 $\overrightarrow{\mathrm{PA}}\cdot\overrightarrow{\mathrm{PB}}=0$ ⇒ 원', '성분 비교로 $x+y=\dfrac{b-2}{b}$, $x+3y=-\dfrac{2a}{b}$', '중심 $(2,0)$과 직선 거리 $=1$ ⇒ $12k^2-16k+3=0$', '$mM^2+Mm^2=mM(m+M)$']
