intent: '[3-1] 역함수의 성질을 이용하여 삼각형의 넓이를 함수로 표현하고 미분을 이용하여 극댓값을 구한 후 최댓값을 구할 수 있는지, [3-2] 벡터의 내적과 성분을 잘 이해하고 있는지 확인하고, 이로부터 나온 함수의 최댓값·최솟값을 원의 성질을 이용하거나 미분을 통하여 구할 수 있는지 평가한다(가이드북 출제의도 요지).'
key_idea: '[3-1] 기울기 $-1$인 직선은 $y=x$에 수직이므로 B는 A의 $y=x$ 대칭점. 높이는 원점과 직선 사이 거리, 밑변 $\overline{\mathrm{AB}}=\sqrt2\lvert x_A-y_A\rvert$로 $h(t)$를 세운다. [3-2] (가)는 원 $(a-2)^2+b^2=1$, (나)에서 $x+y$, $x+3y$를 $a$, $b$로 나타내면 $\dfrac{x+y}{x+3y}=\dfrac{2-b}{2a}=k$이고, 직선 $b=-2ka+2$가 원에 접할 때 최대·최소.'
stuck: '[3-1] 직선 $\ell$과 역함수 그래프의 교점이 A의 $y=x$ 대칭점임을 보는 단계 / [3-2] 비 $\dfrac{x+y}{x+3y}$를 원 위의 점과 고정점 $(0,2)$를 잇는 직선의 기울기 꼴로 바꾸는 발상'
idea_tags: [IDEA-INVERSE-REFLECTION-PERPENDICULAR, IDEA-RATIO-AS-SLOPE-TANGENT-CIRCLE, IDEA-VIETA-SYMMETRIC-EXPRESSION]
tags: [역함수, 직선 y=x 대칭, 삼각형 넓이의 최대, 벡터의 내적, 원의 접선, 근과 계수의 관계, 중앙대 실전]
