stimuli: []

stem: |
  세 사람 A, B, C의 이름이 각각 적힌 서로 다른 3장의 이름표가 들어 있는 상자가 있다. 다음과 같은 규칙의 게임을 고려하자.

  - 1라운드 : A, B, C가 상자에서 임의로 각각 한 장씩 이름표를 뽑은 다음, 자신의 이름표를 뽑은 사람을 제외하고 다른 사람의 이름표를 뽑은 사람만 이름표를 상자에 다시 넣는다.
  - $n$라운드$(n\ge2)$ : 아직 자신의 이름표를 뽑지 못한 사람만 $(n-1)$라운드 직후의 상자에서 임의로 각각 한 장씩 이름표를 뽑는다. 이때 자신의 이름표를 뽑은 사람을 제외하고 다른 사람의 이름표를 뽑은 사람만 이름표를 상자에 다시 넣는다.
  - 각 라운드 직후 상자에 남은 이름표가 없으면 게임은 종료된다.

  위와 같은 규칙으로 게임이 종료되지 않고 6라운드까지 진행된다고 할 때, 오직 한 사람만 자신의 이름표를 뽑는 경우의 수를 구하시오. (단, 각 라운드에서 이름표를 뽑는 순서는 고려하지 않는다.) [20점]

subparts:
- id: '1'
  stem: |
    게임이 종료되지 않고 6라운드까지 진행된다고 할 때, 오직 한 사람만 자신의 이름표를 뽑는 경우의 수를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '189', equivalents: ['189가지'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $M_n=2^{n-1}\times3\times1^{6-n}$, $\displaystyle\sum_{n=1}^6M_n=3(2^6-1)=189$.
    steps:
    - {id: 1a, content: '$M_1=3,\ M_2=6,\ M_3=12,\ \dots,\ M_6=96$, 합 $189$', criteria: [1.B1, 1.B2, 1.B3, 1.B4, 1.B5, 1.B6, 1.B7]}
    hint_ladder:
    - 자신의 이름표를 뽑는 사람이 몇 라운드에 뽑는지로 나누어 보자.
    - 세 사람 모두 남의 이름표를 뽑는 방법은 몇 가지인가?
    - 한 명이 빠진 뒤 남은 두 사람은 게임이 끝나지 않으려면 어떻게 뽑아야 하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 논술가이드북(자연) p.50 예시답안
    steps:
    - id: 1b-1
      content: |
        우선, $n$라운드에서만 1명이 자신의 이름표를 뽑을 조건을 고려하자. 이를 위해서는,
        ① 이전 라운드까지는 모든 사람이 다른 사람의 이름표를 뽑아야 하고
        ② $n$라운드에서 세 사람 중 한 명이 자신의 이름표를 뽑고
        ③ $(n+1)$라운드부터는 나머지 사람이 모두 다른 사람의 이름표를 계속 뽑아야 한다.
        단, $n=1$인 경우는 이전 라운드가 없기 때문에 ①의 과정이 없고, $n=6$인 경우는 6라운드까지 고려하므로 ③의 과정이 없다.
      criteria: []
    - id: 1b-2
      content: |
        편의상, 세 사람 A, B, C의 이름표를 각각 a, b, c라고 하자. ①의 경우는 A, B, C가 (b, c, a) 또는 (c, a, b)를 고르는 경우이므로 2가지가 있다. ②의 경우는 A, B, C 중 한 사람이 자신의 이름표를 뽑고 나머지 두 사람은 이름표를 엇갈리게 뽑는 경우이다. 따라서, 자신의 이름표를 뽑는 사람이 세 사람 중 한 명이므로 3가지가 있다. ③의 경우는 두 사람이 서로 이름표를 엇갈리게 뽑는 경우이므로 1가지 경우이다.
      criteria: []
    - id: 1b-3
      content: |
        따라서, 6라운드까지 진행에서 $n$라운드에서만 1명이 자신의 이름표를 뽑는 경우의 수를 $M_n$이라고 하면 다음과 같이 계산할 수 있다.
        - $M_1=3\times1\times1\times1\times1\times1=3$; 예: A만 이름표를 뽑는 경우 (a, c, b) → ( · , c, b) → ⋯ → ( · , c, b)
        - $M_2=2\times3\times1\times1\times1\times1=3\times2^1$; 예: A만 이름표를 뽑는 경우 (b, c, a) or (c, a, b) → (a, c, b) → ( · , c, b) → ⋯ → ( · , c, b)
        - $M_3=2\times2\times3\times1\times1\times1=3\times2^2$; 예: A만 이름표를 뽑는 경우 (b, c, a) or (c, a, b) → (b, c, a) or (c, a, b) → (a, c, b) → ( · , c, b) → ⋯ → ( · , c, b)
        - ⋯
        - $M_6=2\times2\times2\times2\times2\times3=3\times2^5$; 예: A만 이름표를 뽑는 경우 (b, c, a) or (c, a, b) → ⋯ → (b, c, a) or (c, a, b) → (a, c, b)
      criteria: [1.B1, 1.B2, 1.B3, 1.B4, 1.B5, 1.B6]
    - id: 1b-4
      content: |
        위의 계산에 의하여, 문제에서 요구하는 경우의 수는 다음과 같다.
        $$\sum_{n=1}^{6}M_n=3\times\left(\frac{2^6-1}{2-1}\right)=3\times63=189$$
      criteria: [1.B7]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
