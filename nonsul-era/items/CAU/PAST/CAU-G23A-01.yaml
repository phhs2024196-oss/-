    wrong_work: '한 사람이 자기 이름표를 뽑은 뒤 남은 두 사람의 각 라운드를 $2!=2$가지로 세어 $M_n=3\times2^{n-1}\times2^{6-n}=3\times2^5$, 합 $576$ 등으로 계산'
