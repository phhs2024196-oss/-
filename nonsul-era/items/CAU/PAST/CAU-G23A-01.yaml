key_idea: '$n$라운드에서만 1명이 자기 이름표를 뽑는 경우의 수를 $M_n$이라 하면, 이전 라운드는 완전순열 2가지씩, $n$라운드는 3가지, 이후 라운드는 두 사람이 엇갈려 뽑는 1가지씩이므로 $M_n=3\times2^{n-1}$.'
