intent: '[2-1] 거듭제곱근이 곱해진 함수를 곱의 미분법·합성함수의 미분법(또는 로그미분)으로 미분하고 부분분수로 합을 정리해 접선의 방정식을 구하는지, [2-2] 함수방정식을 반복 적용하고 주기를 이용해 $f(x)$를 주어진 함수로 나타낸 뒤, 구간 분할과 치환적분으로 정적분을 계산하는지를 본다(공식 출제 의도 미공개 — 예시답안 구조로부터 자체 요약).'
key_idea: '[2-1] $y''(0)=\dfrac\alpha3\left(\dfrac1{2\cdot3}+\dfrac1{3\cdot4}+\dfrac1{4\cdot5}\right)=\dfrac\alpha{10}$이므로 접선 $y=\dfrac\alpha{10}x+\alpha^2$. [2-2] $f(x)=g(x)-2f\left(x+\dfrac\pi2\right)$를 네 번 반복하면 $16f(x+2\pi)=16f(x)$가 나타나 $f=-\dfrac1{15}\left\{g(x)-2g\left(x+\dfrac\pi2\right)+4g(x+\pi)-8g\left(x+\dfrac{3\pi}2\right)\right\}$.'
stuck: '[2-1] 세 인수의 곱의 미분(또는 로그미분)에서 $x=0$을 대입해 $\dfrac1{k(k+1)}$ 꼴의 합으로 정리하는 단계 / [2-2] 함수방정식을 반복 대입해 주기 $2\pi$로 되돌아오게 하는 발상'
