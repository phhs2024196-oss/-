stimuli:
- label: '1'
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능할 때 $\{f(x)g(x)\}'=f'(x)g(x)+f(x)g'(x)$이다.
- label: '2'
  body: |
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는 $\{f(g(x))\}'=f'(g(x))g'(x)$이다.
- label: '3'
  body: |
    함수 $f(x)$가 임의의 세 실수 $a,b,c$를 포함하는 열린구간에서 연속일 때 다음 식이 성립한다.
    $$\int_a^c f(x)\,dx+\int_c^b f(x)\,dx=\int_a^b f(x)\,dx$$
- label: '4'
  body: |
    미분가능한 함수 $g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속이고, $g(a)=\alpha$, $g(b)=\beta$에 대하여 함수 $f(x)$가 $\alpha$와 $\beta$를 양끝으로 하는 닫힌구간에서 연속일 때 다음 식이 성립한다.
    $$\int_a^b f(g(x))g'(x)\,dx=\int_\alpha^\beta f(t)\,dt$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    양의 실수 $\alpha$에 대하여, 곡선
    $$y=\sqrt[3]{\alpha+\frac{x}{1\cdot2\cdot3}}\cdot\sqrt[3]{\left(\alpha+\frac{x}{2\cdot3\cdot4}\right)^2}\cdot\left(\alpha+\frac{x}{3\cdot4\cdot5}\right)$$
    위의 점 $(0,\alpha^2)$에서의 접선이 점 $(5,1)$을 지난다고 할 때, $\alpha$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{-1+\sqrt{17}}{4}', equivalents: ['(-1+√17)/4', '(\sqrt{17}-1)/4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 로그미분하면 $\dfrac{y'(0)}{y(0)}=\dfrac1{3\alpha}\displaystyle\sum_{k=1}^3\dfrac1{(k+1)(k+2)}=\dfrac1{10\alpha}$, $y'(0)=\dfrac\alpha{10}$.
    steps:
    - {id: 1a, content: '접선 $y=\dfrac\alpha{10}x+\alpha^2$가 $(5,1)$을 지남 ⇒ $\alpha^2+\dfrac\alpha2-1=0$ ⇒ $\alpha=\dfrac{-1+\sqrt{17}}4$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 세 인수의 곱이므로 로그를 취해 미분하면 편하다.
    - $x=0$을 대입하면 각 항은 $\dfrac{1}{k(k+1)(k+2)}\cdot\dfrac{k}{3\alpha}$ 꼴이 된다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 논술가이드북(자연) p.51 예시답안
    steps:
    - id: 1b-1
      content: |
        주어진 함수를 미분하면,
        $$\begin{aligned}y'=&\ \frac13\cdot\frac1{1\cdot2\cdot3}\left(\alpha+\frac{x}{1\cdot2\cdot3}\right)^{-\frac23}\left(\alpha+\frac{x}{2\cdot3\cdot4}\right)^{\frac23}\left(\alpha+\frac{x}{3\cdot4\cdot5}\right)\\&+\left(\alpha+\frac{x}{1\cdot2\cdot3}\right)^{\frac13}\cdot\frac23\cdot\frac1{2\cdot3\cdot4}\left(\alpha+\frac{x}{2\cdot3\cdot4}\right)^{-\frac13}\left(\alpha+\frac{x}{3\cdot4\cdot5}\right)\\&+\left(\alpha+\frac{x}{1\cdot2\cdot3}\right)^{\frac13}\left(\alpha+\frac{x}{2\cdot3\cdot4}\right)^{\frac23}\frac1{3\cdot4\cdot5}\end{aligned}$$
        이므로
        $$y'(0)=\frac\alpha3\left(\frac1{2\cdot3}+\frac1{3\cdot4}+\frac1{4\cdot5}\right)=\frac\alpha3\left(\frac12-\frac13+\frac13-\frac14+\frac14-\frac15\right)=\frac\alpha{10}$$
        이다. (채점용: 주어진 함수에 로그를 취하여 $\ln y=\displaystyle\sum_{k=1}^{3}\frac k3\ln\left(\alpha+\frac{x}{k(k+1)(k+2)}\right)$를 미분하면
        $$\frac{y'}{y}=\sum_{k=1}^{3}\frac k3\cdot\frac1{k(k+1)(k+2)}\cdot\frac1{\alpha+\dfrac{x}{k(k+1)(k+2)}}$$
        이므로 $y'(0)=\dfrac{y(0)}{3\alpha}\displaystyle\sum_{k=1}^{3}\frac1{(k+1)(k+2)}=\cdots=\frac\alpha{10}$를 얻을 수 있다.)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 $(0,\alpha^2)$에서의 접선은 $y=\dfrac\alpha{10}x+\alpha^2$이다. 이 직선이 $(5,1)$을 지나기 위해서는 $\alpha^2+\dfrac\alpha2-1=0$을 만족해야 하므로 $\alpha=\dfrac{-1+\sqrt{17}}4$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: 미분하여 $y'(0)=\dfrac\alpha{10}$을 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $\alpha$에 대한 방정식 $\alpha^2+\dfrac\alpha2-1=0$을 풀어 답 $\alpha=\dfrac{-1+\sqrt{17}}4$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4407}
  misconceptions:
  - id: MC-CAL-4407
    outcome_code: '70'
    wrong_work: '곱의 미분에서 세 번째 인수 $\left(\alpha+\dfrac{x}{60}\right)$의 미분 항(또는 거듭제곱근 인수의 미분 항)을 빠뜨려 $y''(0)=\dfrac\alpha3\left(\dfrac16+\dfrac1{12}\right)$ 등으로 계산'
    detect_cue: $y'(0)\neq\dfrac\alpha{10}$, 최종 이차방정식이 $\alpha^2+\dfrac\alpha2-1=0$이 아님
    feedback: 세 인수의 곱은 한 인수씩 미분한 세 항의 합입니다. 로그를 취하면 $\dfrac{y'}{y}$가 세 항의 합으로 바로 정리됩니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    주기가 $2\pi$인 함수 $f(x)$가 모든 실수 $x$에 대하여
    $$f(x)+2f\left(x+\frac\pi2\right)=15\cdot\frac{\lvert\sin x\rvert}{2+\cos x}$$
    을 만족할 때, 정적분 $\displaystyle\int_0^\pi f(x)\,dx$의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '11\ln3-12\ln2', equivalents: ['\ln\dfrac{3^{11}}{2^{12}}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f=-\dfrac1{15}\displaystyle\sum_{k=0}^{3}(-2)^kg\left(x+\dfrac{k\pi}2\right)$, $\displaystyle\int_0^\pi g\left(x+\dfrac{k\pi}2\right)dx$는 차례로 $15\ln3,\ 30\ln2,\ 15\ln3,\ 30(\ln3-\ln2)$.
    steps:
    - {id: 2a, content: '$\displaystyle\int_0^\pi f=-\dfrac1{15}\{15\ln3-60\ln2+60\ln3-240(\ln3-\ln2)\}=11\ln3-12\ln2$', criteria: [2.M1, 2.B1, 2.A1]}
    hint_ladder:
    - 주어진 식의 $x$에 $x+\dfrac\pi2$를 넣은 식을 다시 대입해 보자.
    - 네 번 반복하면 $f(x+2\pi)=f(x)$가 나타난다.
    - $\lvert\sin(x+k\pi/2)\rvert$의 부호가 바뀌는 점에서 구간을 나누어 치환하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2024 논술가이드북(자연) p.51~52 예시답안
    steps:
    - id: 2b-1
      content: |
        편의상 $g(x)=15\cdot\dfrac{\lvert\sin x\rvert}{2+\cos x}$라 하자. 주어진 식 $f(x)=g(x)-2f\left(x+\dfrac\pi2\right)$를 반복해서 적용하면
        $$\begin{aligned}f(x)&=g(x)-2f\left(x+\frac\pi2\right)=g(x)-2g\left(x+\frac\pi2\right)+4f(x+\pi)\\&=g(x)-2g\left(x+\frac\pi2\right)+4g(x+\pi)-8f\left(x+\frac{3\pi}2\right)\\&=g(x)-2g\left(x+\frac\pi2\right)+4g(x+\pi)-8g\left(x+\frac{3\pi}2\right)+16f(x+2\pi)\end{aligned}$$
        를 얻는다. 그런데 $f(x)$의 주기가 $2\pi$이므로,
        $$f(x)=-\frac1{15}\left\{g(x)-2g\left(x+\frac\pi2\right)+4g(x+\pi)-8g\left(x+\frac{3\pi}2\right)\right\}$$
        이다. 따라서
        $$\int_0^\pi f(x)\,dx=-\frac1{15}\left\{\int_0^\pi g(x)\,dx-2\int_0^\pi g\left(x+\frac\pi2\right)dx+4\int_0^\pi g(x+\pi)\,dx-8\int_0^\pi g\left(x+\frac{3\pi}2\right)dx\right\}$$
        이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        우변의 첫 번째 적분은 $u=2+\cos x$로 치환하여 값을 구하고
        $$\int_0^\pi g(x)\,dx=15\int_0^\pi\frac{\sin x}{2+\cos x}\,dx=-15\int_3^1\frac1u\,du=15\ln3$$
        을 얻고, 두 번째 적분은 구간을 나눈 다음 $u=2+\cos\left(x+\dfrac\pi2\right)$로 치환하여 값을 구한다.
        $$\begin{aligned}\int_0^\pi g\left(x+\frac\pi2\right)dx&=15\int_0^{\frac\pi2}\frac{\sin\left(x+\frac\pi2\right)}{2+\cos\left(x+\frac\pi2\right)}dx-15\int_{\frac\pi2}^{\pi}\frac{\sin\left(x+\frac\pi2\right)}{2+\cos\left(x+\frac\pi2\right)}dx\\&=-15\int_2^1\frac1u\,du+15\int_1^2\frac1u\,du=30\ln2\end{aligned}$$
        같은 방식으로 세 번째, 네 번째 적분도 값을 구할 수 있다.
        $$\int_0^\pi g(x+\pi)\,dx=-15\int_0^\pi\frac{\sin(x+\pi)}{2+\cos(x+\pi)}\,dx=15\int_1^3\frac1u\,du=15\ln3,$$
        $$\begin{aligned}\int_0^\pi g\left(x+\frac{3\pi}2\right)dx&=-15\int_0^{\frac\pi2}\frac{\sin\left(x+\frac{3\pi}2\right)}{2+\cos\left(x+\frac{3\pi}2\right)}dx+15\int_{\frac\pi2}^{\pi}\frac{\sin\left(x+\frac{3\pi}2\right)}{2+\cos\left(x+\frac{3\pi}2\right)}dx\\&=-15\int_2^3\frac1u\,du+15\int_3^2\frac1u\,du=30(\ln3-\ln2)\end{aligned}$$
        [원문 오기] 원문 마지막 줄은 $-15\int_2^3+15\int_3^2$로 인쇄되어 그대로 옮기면 음수가 되므로 부호·구간 표기에 오기가 있다(결과 $30(\ln3-\ln2)$는 맞음).
      criteria: [2.B1]
    - id: 2b-3
      content: |
        따라서
        $$\int_0^\pi f(x)\,dx=-\ln3+4\ln2-4\ln3+16(\ln3-\ln2)=11\ln3-12\ln2$$
        이다.
      criteria: [2.A1]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 2024 논술가이드북(자연) p.52 별해
    key_idea: 함수 자체가 아니라 정적분 $\displaystyle\int_0^\pi f(x)\,dx$에 주어진 식을 반복 적용한다.
    steps:
    - id: 2c-1
      content: |
        편의상 $g(x)=15\cdot\dfrac{\lvert\sin x\rvert}{2+\cos x}$라 하자. 정적분 $\displaystyle\int_0^\pi f(x)\,dx$에 주어진 식 $f(x)=g(x)-2f\left(x+\dfrac\pi2\right)$를 반복해서 적용하면,
        $$\begin{aligned}\int_0^\pi f(x)\,dx&=-2\int_0^\pi f\left(x+\frac\pi2\right)dx+\int_0^\pi g(x)\,dx\\&=4\int_0^\pi f(x+\pi)\,dx-2\int_0^\pi g\left(x+\frac\pi2\right)dx+\int_0^\pi g(x)\,dx\\&=-8\int_0^\pi f\left(x+\frac{3\pi}2\right)dx+4\int_0^\pi g(x+\pi)\,dx-2\int_0^\pi g\left(x+\frac\pi2\right)dx+\int_0^\pi g(x)\,dx\\&=16\int_0^\pi f(x+2\pi)\,dx-8\int_0^\pi g\left(x+\frac{3\pi}2\right)dx+4\int_0^\pi g(x+\pi)\,dx-2\int_0^\pi g\left(x+\frac\pi2\right)dx+\int_0^\pi g(x)\,dx\end{aligned}$$
        그런데 $f(x)$의 주기가 $2\pi$이므로,
        $$\int_0^\pi f(x)\,dx=-\frac1{15}\left\{\int_0^\pi g(x)\,dx-2\int_0^\pi g\left(x+\frac\pi2\right)dx+4\int_0^\pi g(x+\pi)\,dx-8\int_0^\pi g\left(x+\frac{3\pi}2\right)dx\right\}$$
        를 얻을 수 있다. 이후 과정은 이전 예시답안과 같다.
      criteria: [2.M1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
