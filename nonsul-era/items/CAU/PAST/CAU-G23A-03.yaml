  tools: ['접점 $(t,\sin(\ln t))$의 접선에 원점 대입', '$\ln t\ge0$에서 $\tan(\ln t)=1$의 해 나열', '$\dfrac1{(n-\frac34)(n+\frac14)}=\dfrac1{n-\frac34}-\dfrac1{n+\frac14}$', '$\dfrac{dy}{dx}=6e^{2x}(e^x-\alpha)$의 부호', '극솟값 $=0$ 조건 $2\alpha^3-3\alpha^3+8=0$']
