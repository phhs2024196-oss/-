stimuli:
- label: '1'
  body: |
    곡선 $y=f(x)$ 위의 점 $(\alpha,f(\alpha))$에서 접하는 접선의 방정식은 $y-f(\alpha)=f'(\alpha)(x-\alpha)$이다.
- label: '2'
  body: |
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는 $\{f(g(x))\}'=f'(g(x))g'(x)$이다.
- label: '3'
  body: |
    미분가능한 함수 $g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속이고, $g(a)=\alpha$, $g(b)=\beta$에 대하여 함수 $f(x)$가 $\alpha$와 $\beta$를 양끝으로 하는 닫힌구간에서 연속일 때 다음 식이 성립한다.
    $$\int_a^b f(g(x))g'(x)\,dx=\int_\alpha^\beta f(t)\,dt$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    $x\ge1$에서 정의된, 좌표평면 위의 곡선 $y=\sin(\ln x)$가 있다. 좌표평면의 원점에서 곡선 $y=\sin(\ln x)$에 그은 가능한 모든 접선의 접점들을 $(a_n,\sin(\ln a_n))$으로 나타내자. 이때, $x$좌표가 가장 작은 접점의 $x$좌표가 $a_1$이고, 모든 자연수 $n$에 대하여 $a_n<a_{n+1}$이 성립한다. $\displaystyle\sum_{n=1}^{10}\frac1{(\ln a_n)(\ln a_{n+1})}$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{160}{41\pi^2}', equivalents: ['160/(41π^2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\ln a_n=\pi\left(n-\dfrac34\right)$이므로 이웃한 두 항의 차가 $\pi$로 일정 ⇒ 부분분수로 소거.
    steps:
    - {id: 1a, content: '$\dfrac1{\pi^2}\displaystyle\sum_{n=1}^{10}\left(\dfrac1{n-\frac34}-\dfrac1{n+\frac14}\right)=\dfrac1{\pi^2}\left(4-\dfrac4{41}\right)=\dfrac{160}{41\pi^2}$', criteria: [1.M1, 1.B1, 1.A1]}
    hint_ladder:
    - 접점을 $(t,\sin(\ln t))$로 두고 접선이 원점을 지나는 조건을 세우자.
    - $x\ge1$이면 $\ln t\ge0$이다. $\tan(\ln t)=1$의 해를 작은 것부터 나열하자.
    - $\ln a_{n+1}-\ln a_n$은 일정하다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 논술가이드북(자연) p.53 예시답안
    steps:
    - id: 1b-1
      content: |
        곡선 위의 점 $(t,\sin(\ln t))$에서 접선의 방정식은 $y-\sin(\ln t)=\dfrac{\cos(\ln t)}t(x-t)$이다. 원점을 지나므로 $(x,y)=(0,0)$을 대입하면 $\sin(\ln t)=\cos(\ln t)$가 된다. (원문은 접점을 $(t,\cos(\ln t))$로 인쇄 — 곡선이 $y=\sin(\ln x)$이므로 $(t,\sin(\ln t))$의 오기)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $t\ge1$이므로 $\ln t\ge0$이고 $\ln t=\dfrac\pi4,\ \pi+\dfrac\pi4,\ 2\pi+\dfrac\pi4,\ \cdots$이다. 따라서 $a_n=e^{\pi(n-1)+\frac\pi4}$이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        등식 $\dfrac1{\left(n-\frac34\right)\left(n+\frac14\right)}=\dfrac1{n-\frac34}-\dfrac1{n+\frac14}$을 이용하면 구하는 값은 아래와 같다.
        $$\sum_{n=1}^{10}\frac1{(\ln a_n)(\ln a_{n+1})}=\frac1{\pi^2}\sum_{n=1}^{10}\left(\frac1{n-\frac34}-\frac1{n+\frac14}\right)=\frac1{\pi^2}\left(4-\frac4{41}\right)=\frac{160}{41\pi^2}$$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 접선의 방정식 $y-\sin(\ln t)=\dfrac{\cos(\ln t)}t(x-t)$를 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $a_n=e^{\pi(n-1)+\frac\pi4}$을 얻었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 계산하여 $\dfrac{160}{41\pi^2}$을 얻었다.
      depends_on: [1.M1]
      implied_ok: true
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4409}
  misconceptions:
  - id: MC-CAL-4409
    outcome_code: '70'
    wrong_work: '$\tan(\ln t)=1$의 해를 $\ln t=\dfrac\pi4+\dfrac{n\pi}2$ 또는 $\ln t=-\dfrac{3\pi}4+n\pi$ 등으로 잘못 나열해 $a_1$을 틀림'
    detect_cue: $\ln a_1\neq\dfrac\pi4$, 합이 $\dfrac{160}{41\pi^2}$이 아님
    feedback: 정의역 $x\ge1$이므로 $\ln t\ge0$이고, $\tan$의 주기는 $\pi$이므로 해는 $\dfrac\pi4+(n-1)\pi$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    함수 $y=2e^{3x}-3\alpha e^{2x}+8$의 그래프가 $x$축과 한 점에서 만나게 하는 실수 $\alpha$의 값을 $\alpha_0$이라 하고, 이때 $x$축과의 교점을 $(x_0,0)$이라 하자. 다음 정적분의 값을 구하시오. [15점]
    $$\int_0^{x_0}\left(2e^{3x}-3\alpha_0e^{2x}+8\right)dx$$
  points: 15
  depends_on: []
  answer: {kind: value, value: '8\ln2-\dfrac{13}{3}', equivalents: ['8ln2-13/3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 극솟값 $y(\ln\alpha)=8-\alpha^3=0$ ⇒ $\alpha_0=2$, $x_0=\ln2$.
    steps:
    - {id: 2a, content: '$\left[\dfrac23e^{3x}-3e^{2x}+8x\right]_0^{\ln2}=8\ln2-\dfrac{13}3$', criteria: [2.M1, 2.B1, 2.A1]}
    hint_ladder:
    - $\alpha\le0$이면 그래프는 $x$축과 만날 수 있는가?
    - $\dfrac{dy}{dx}=6e^{2x}(e^x-\alpha)$의 부호를 조사하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2024 논술가이드북(자연) p.53 예시답안
    steps:
    - id: 2b-1
      content: |
        $\alpha\le0$일 때, $2e^{3x}-3\alpha e^{2x}+8\ge8$이므로 $x$축과 만나지 않는다. $\dfrac{dy}{dx}=6e^{2x}(e^x-\alpha)$이므로 $\alpha>0$인 경우에 $e^x=\alpha$에서 극솟값을 갖는다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $x$축과 한점에서 만나기 위하여 $e^x=\alpha$를 함수에 대입하면 $2\alpha^3-3\alpha^3+8=0$이 되어야 한다. 따라서, $\alpha_0=2$일 때 $x$축과 한점에서 만나고 $x_0=\ln\alpha_0=\ln2$이다.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        주어진 정적분의 값은 아래와 같다.
        $$\int_0^{x_0}\left(2e^{3x}-3\alpha_0e^{2x}+8\right)dx=\left[\frac23e^{3x}-\frac{3\alpha_0}2e^{2x}+8x\right]_0^{x_0}=8\ln2-\frac{13}3$$
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 함수의 그래프를 이해하고 $e^x=\alpha$에서 극솟값을 가진다는 것을 확인했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: $\alpha_0=2$, $x_0=\ln\alpha_0=\ln2$를 확인했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: 적분하여 $8\ln2-\dfrac{13}3$을 구했다.
      depends_on: [2.M1]
      implied_ok: true
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4410}
  misconceptions:
  - id: MC-CAL-4410
    outcome_code: '70'
    wrong_work: '$e^x=t$로 치환한 삼차식 $2t^3-3\alpha t^2+8$의 판별 조건을 이차방정식처럼 세우거나, $x=0$에서의 값이 0이 되도록 $\alpha=\dfrac{10}3$으로 놓음'
    detect_cue: $\alpha_0\neq2$ 또는 $x_0\neq\ln2$
    feedback: $\alpha>0$이면 $e^x=\alpha$에서 최소가 되므로, 그래프가 $x$축과 한 점에서 만나려면 그 극솟값(최솟값)이 0이어야 합니다.
    remedy: [RL-2]

