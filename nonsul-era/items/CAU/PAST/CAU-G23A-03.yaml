intent: '[3-1] 원점에서 곡선에 그은 접선의 접점 조건을 합성함수의 미분으로 세워 접점들의 수열을 구하고, 부분분수로 유한합을 계산하는지, [3-2] 도함수로 극값을 조사해 그래프가 $x$축과 한 점에서 만나는 조건을 찾고 정적분을 계산하는지를 본다(공식 출제 의도 미공개 — 예시답안 구조로부터 자체 요약).'
key_idea: '[3-1] 원점을 지나는 접선 조건 $\sin(\ln t)=\cos(\ln t)$, $t\ge1$ ⇒ $\ln a_n=\pi(n-1)+\dfrac\pi4$, 합은 $\dfrac1{\pi^2}\sum\left(\dfrac1{n-\frac34}-\dfrac1{n+\frac14}\right)$. [3-2] $y''=6e^{2x}(e^x-\alpha)$ ⇒ $\alpha>0$일 때 $e^x=\alpha$에서 극솟값, 극솟값 $=0$ ⇒ $\alpha_0=2$, $x_0=\ln2$.'
stuck: '[3-1] $\tan(\ln t)=1$의 해를 $t\ge1$에서 크기순으로 나열해 $a_n$의 일반항을 쓰는 단계 / [3-2] $\alpha\le0$이면 만나지 않음을 확인하고 “한 점에서 만남”을 극솟값 $=0$으로 바꾸는 단계'
