stimuli: []

stem: |
  다음의 그림과 같은 도로망이 있다. $(i,j)$좌표에서 $(i+1,j)$ 또는 $(i,j+1)$좌표로의 이동 비용은 1000원이고 소요 시간은 1시간이다. $(i,i)$좌표에서 $(i+1,i+1)$좌표로의 이동 비용은 2400원이며 소요 시간은 30분이다. 원점 O 지점에서 출발하여 $\mathrm A(4,4)$ 지점까지 도로를 따라갈 때, 9000원 이하의 비용으로 7시간 이내에 도착하기 위한 모든 경로의 수를 구하시오. (단, 왼쪽(←) 또는 아래(↓) 방향과 왼쪽 아래로의 대각선(↙) 방향으로 이동할 수 없다.) [20점]

  [그림] 좌표평면에서 $0\le x\le4$, $0\le y\le4$인 정사각형 영역에 직선 $x=0,1,2,3,4$와 $y=0,1,2,3,4$로 이루어진 격자 도로망이 있고, 원점 O$(0,0)$에서 $\mathrm A(4,4)$까지 직선 $y=x$를 따라 대각선 도로가 그어져 있다(대각선 도로는 이 선분 하나뿐이며, 각 $(i,i)$와 $(i+1,i+1)$ 사이 구간으로 나뉜다). 점 A$(4,4)$가 표시되어 있다.

subparts:
- id: '1'
  stem: |
    원점 O에서 $\mathrm A(4,4)$까지 9000원 이하의 비용으로 7시간 이내에 도착하기 위한 모든 경로의 수를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '94', equivalents: ['94가지'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 조건을 만족하는 조합은 대각선 2개(30가지)와 1개(64가지)뿐.
    steps:
    - {id: 1a, content: 'Ⅲ: 남는 블록이 $2\times2$ 하나 $3\times6=18$, $1\times1$ 두 개 $3\times4=12$ / Ⅳ: 끝 대각선 $2\times20=40$, 가운데 대각선 $2\times12=24$ ⇒ $94$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - 가로, 세로, 대각선 이동 횟수 사이의 관계식을 세우자.
    - 비용과 시간 조건을 모두 만족하는 대각선 개수는?
    - 대각선 칸을 정하면 나머지 경로는 몇 개의 정사각형 블록 안에서 움직이는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 논술가이드북(자연) p.57 예시답안
    steps:
    - id: 1b-1
      content: |
        한 단위의 가로, 세로, 대각선 방향으로 이동 횟수를 각각 $x,\ y,\ z$라고 하자. 원점 O에서 A로 이동하기 위해서 다음의 관계식이 만족되어야 한다.
        $$x=y,\quad x+y+2z=8$$
        왜냐하면, 한 단위 가로 또는 세로 방향으로만 갈 때는 총 8번의 이동이 필요하지만, 한 단위 대각선 방향으로 갈 때는 가로와 세로 방향을 한 번만에 간 효과가 있기 때문이다.
      criteria: []
    - id: 1b-2
      content: |
        위의 관계식을 만족시키는 $(x,y,z)$의 조합 및 그에 따른 경로의 비용 및 소요 시간은 다음 표와 같다.

        | 조합 | $x=y$ | $z$ | 비용(원) | 소요 시간(시간) |
        |---|---|---|---|---|
        | Ⅰ | 0 | 4 | $4\times2400=9600$ | $4\times0.5=2$ |
        | Ⅱ | 1 | 3 | $(2\times1000)+(3\times2400)=9200$ | $(2\times1)+(3\times0.5)=3.5$ |
        | Ⅲ | 2 | 2 | $(4\times1000)+(2\times2400)=8800$ | $(4\times1)+(2\times0.5)=5$ |
        | Ⅳ | 3 | 1 | $(6\times1000)+(1\times2400)=8400$ | $(6\times1)+(1\times0.5)=6.5$ |
        | Ⅴ | 4 | 0 | $8\times1000=8000$ | $8\times1=8$ |

        따라서, 9000원 이하 비용과 7시간 이내 소요 시간 조건을 만족시키는 조합은 Ⅲ과 Ⅳ이다.
      criteria: []
    - id: 1b-3
      content: |
        조합 Ⅲ에 따른 경로는 아래와 같은 $6\ (={}_4\mathrm C_2)$가지 종류가 있을 수 있다. 따라서, 총 $30\ (=18+12)$가지 경로가 있다.
        - 나머지 이동이 $2\times2$ 블록 하나인 경우(대각선 구간을 아래에서부터 1~4번이라 할 때 (1,2), (1,4), (3,4)번 사용): $\dfrac{4!}{2!\,2!}\times3=6\times3=18$
        - 나머지 이동이 $1\times1$ 블록 두 개인 경우((1,3), (2,3), (2,4)번 사용): $(2\times2)\times3=4\times3=12$

        (원문은 각 경우를 격자 그림 6개로 제시)
      criteria: [1.B1, 1.B2]
    - id: 1b-4
      content: |
        조합 Ⅳ에 따른 경로는 아래와 같은 $4\ (={}_4\mathrm C_1)$가지 종류가 있을 수 있다. 따라서, 총 $64\ (=40+24)$가지 경로가 있다.
        - 첫째 또는 넷째 대각선을 사용하는 경우(나머지는 $3\times3$ 블록 하나): $\dfrac{6!}{3!\,3!}\times2=20\times2=40$
        - 둘째 또는 셋째 대각선을 사용하는 경우(나머지는 $1\times1$ 블록과 $2\times2$ 블록): $\left(2\times\dfrac{4!}{2!\,2!}\right)\times2=12\times2=24$

        (원문은 각 경우를 격자 그림 4개로 제시)
      criteria: [1.B3, 1.B4]
    - id: 1b-5
      content: |
        따라서, 총 $94\ (=30+64)$가지의 경로가 있다.
      criteria: []
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 6
      evidence: 조합 Ⅲ 중 나머지 이동이 $2\times2$ 블록 하나인 3가지 경로 조합 각각에 대해 비용·소요 시간(8800원, 5시간)과 경로의 수 6을 바르게 계산했다(경로 조합당 2점 = 비용·시간 1점(각 0.5점) + 경로 수 1점).
      depends_on: []
      steps: [1b-3]
    - id: 1.B2
      mark_type: B
      points: 6
      evidence: 조합 Ⅲ 중 나머지 이동이 $1\times1$ 블록 두 개인 3가지 경로 조합 각각에 대해 비용·소요 시간과 경로의 수 4를 바르게 계산했다(경로 조합당 2점).
      depends_on: []
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: 조합 Ⅳ 중 첫째·넷째 대각선을 쓰는 2가지 경로 조합 각각에 대해 비용·소요 시간(8400원, 6.5시간)과 경로의 수 20을 바르게 계산했다(경로 조합당 2점).
      depends_on: []
      steps: [1b-4]
    - id: 1.B4
      mark_type: B
      points: 4
      evidence: 조합 Ⅳ 중 둘째·셋째 대각선을 쓰는 2가지 경로 조합 각각에 대해 비용·소요 시간과 경로의 수 12를 바르게 계산했다(경로 조합당 2점).
      depends_on: []
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 모든 경로 조합에 대하여 비용과 소요 시간 및 경로의 수를 바르게 계산하였으나 총 경우의 수 94를 계산하지 못한 경우(공식 채점기준)
      effect: minus
      value: 2
    - code: D1-2
      condition: 채점자 재량 — 답안의 완성도에 따라 총점 20점 이내에서 ±1점, 총점에 소수점 점수가 나오면 ±0.5점(공식 채점기준 주석). 계산 실수로 틀렸어도 논리 전개 과정이 맞으면 해당 부분에 1~2점의 부분 점수 부여
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CNT-4411}
  misconceptions:
  - id: MC-CNT-4411
    outcome_code: '70'
    wrong_work: '대각선이 아무 칸에나 있다고 보고 조합 Ⅲ을 $\dfrac{6!}{2!\,2!\,2!}=90$, 조합 Ⅳ를 $\dfrac{7!}{3!\,3!\,1!}=140$으로 세어 230'
    detect_cue: 경로 수에 $\dfrac{n!}{\cdots}$ 하나만 있고 대각선 위치별 분류가 없음, 답이 94보다 훨씬 큼
    feedback: 대각선 도로는 $(i,i)\to(i+1,i+1)$ 구간에만 있습니다. 어느 대각선 구간을 쓰는지 먼저 정하면, 나머지 이동은 그 사이의 정사각형 블록 안에서만 가능합니다.
    remedy: [RL-1]

