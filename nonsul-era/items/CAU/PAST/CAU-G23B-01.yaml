intent: 이동 방향별 비용·시간이 다른 도로망에서 이동 횟수의 관계식으로 가능한 조합을 모두 나열해 비용·시간 조건을 판정하고, 대각선 위치에 따라 경우를 나누어 같은 것이 있는 순열로 경로의 수를 세는 능력을 본다(공식 출제 의도 미공개 — 예시답안 구조로부터 자체 요약).
key_idea: '가로·세로·대각선 이동 횟수를 $x,y,z$라 하면 $x=y,\ x+y+2z=8$. 비용·시간 조건을 만족하는 것은 $z=2$(8800원, 5시간)와 $z=1$(8400원, 6.5시간)뿐이고, 대각선이 놓인 칸의 위치에 따라 남은 직사각형 구역의 경로 수를 곱한다.'
stuck: '대각선 도로가 $(i,i)\to(i+1,i+1)$에만 있으므로 어느 대각선을 쓰는지에 따라 경로가 지나는 정사각형 블록이 정해진다는 점을 파악하는 단계'
