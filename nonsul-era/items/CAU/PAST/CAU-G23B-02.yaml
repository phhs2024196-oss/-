stimuli:
- label: '1'
  body: |
    함수 $f(x)$가 임의의 세 실수 $a,b,c$를 포함하는 열린구간에서 연속일 때 다음 식이 성립한다.
    $$\int_a^c f(x)\,dx+\int_c^b f(x)\,dx=\int_a^b f(x)\,dx$$
- label: '2'
  body: |
    모든 실수 $x$에 대하여 $\sin^2x+\cos^2x=1$이 성립한다.
- label: '3'
  body: |
    미분가능한 두 함수 $f(x)$, $g(x)$에 대하여 $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때 다음 식이 성립한다.
    $$\int_a^b f(x)g'(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^b f'(x)g(x)\,dx$$
- label: '4'
  body: |
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는 $\{f(g(x))\}'=f'(g(x))g'(x)$이다.
- label: '5'
  body: |
    미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면 $f'(a)=0$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    다음 정적분의 값을 구하시오. [10점]
    $$\int_{-\frac\pi4}^{\frac\pi4}\frac{\lvert x\rvert}{1-\sin x}\,dx$$
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac\pi2-\ln2', equivalents: ['π/2-ln2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 음수 구간을 $u=-x$로 접으면 $\displaystyle\int_0^{\frac\pi4}2x\sec^2x\,dx$, 부분적분으로 $\dfrac\pi2-2\cdot\dfrac{\ln2}2$.
    steps:
    - {id: 1a, content: '$2\Big[x\tan x\Big]_0^{\frac\pi4}-2\displaystyle\int_0^{\frac\pi4}\tan x\,dx=\dfrac\pi2-\ln2$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $\lvert x\rvert$ 때문에 구간을 0에서 나누자.
    - 음수 구간은 $u=-x$로 치환하면 분모가 $1+\sin u$가 된다.
    - $\dfrac1{1+\sin x}+\dfrac1{1-\sin x}$을 통분해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 논술가이드북(자연) p.58 예시답안
    steps:
    - id: 1b-1
      content: |
        다음과 같이 정적분의 적분 구간 나눈 후, 첫 번째 적분에 대하여 $u=-x$로 치환하여 식을 정리한다.
        $$\begin{aligned}\int_{-\frac\pi4}^{\frac\pi4}\frac{\lvert x\rvert}{1-\sin x}dx&=\int_{-\frac\pi4}^{0}\frac{-x}{1-\sin x}dx+\int_0^{\frac\pi4}\frac{x}{1-\sin x}dx\\&=-\int_{\frac\pi4}^{0}\frac{u}{1+\sin u}du+\int_0^{\frac\pi4}\frac{x}{1-\sin x}dx\\&=\int_0^{\frac\pi4}\left(\frac{x}{1+\sin x}+\frac{x}{1-\sin x}\right)dx=\int_0^{\frac\pi4}\frac{2x}{1-\sin^2x}dx\end{aligned}$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        그리고 삼각함수의 관계식 $\sin^2x+\cos^2x=1$, $\sec x=\dfrac1{\cos x}$, $(\tan x)'=\sec^2x$과 부분적분을 적용하여
        $$\int_{-\frac\pi4}^{\frac\pi4}\frac{\lvert x\rvert}{1-\sin x}dx=2\int_0^{\frac\pi4}x\sec^2x\,dx=\frac\pi2\tan\frac\pi4-2\int_0^{\frac\pi4}\tan x\,dx$$
        를 얻는다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        마지막으로 치환적분($u=\cos x$)으로 정적분
        $$\int_0^{\frac\pi4}\tan x\,dx=\int_0^{\frac\pi4}\frac{\sin x}{\cos x}dx=\int_{\frac1{\sqrt2}}^{1}\frac1u\,du=\ln1-\ln\left(\frac1{\sqrt2}\right)=\frac{\ln2}2$$
        를 계산하여 답 $\dfrac\pi2-\ln2$를 구한다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 정적분을 정리하여 $\displaystyle\int_0^{\frac\pi4}\frac{2x}{1-\sin^2x}dx$를 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $2\displaystyle\int_0^{\frac\pi4}x\sec^2x\,dx$로 적은 후, 부분적분을 적용하여 계산을 시도했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: 정답 $\dfrac\pi2-\ln2$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4412}
  misconceptions:
  - id: MC-CAL-4412
    outcome_code: '70'
    wrong_work: '$\lvert x\rvert$를 우함수로 보고 $2\displaystyle\int_0^{\frac\pi4}\frac{x}{1-\sin x}dx$로 바꿈(분모 $1-\sin x$는 우함수가 아님)'
    detect_cue: 음수 구간을 치환한 흔적 없이 적분 앞에 2를 곱함
    feedback: 대칭을 쓰려면 피적분함수 전체가 우함수여야 합니다. $\dfrac{\lvert x\rvert}{1-\sin x}$는 우함수가 아니므로 $u=-x$로 치환해 $\dfrac{x}{1+\sin x}$를 만들어 더하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표평면 위의 곡선 $y=4\cdot\sqrt{\left(1+\dfrac{x^2}{36}\right)^3}$에서 점 $\mathrm P(0,109)$에 이르는 거리가 최소인 두 점을 $\mathrm A(x_1,y_1)$, $\mathrm B(x_2,y_2)$라 하자. 이때, $x=x_1$에서 $x=x_2$까지의 곡선 $y=4\cdot\sqrt{\left(1+\dfrac{x^2}{36}\right)^3}$의 길이를 구하시오. (단, $x_1<x_2$이다.) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '152\sqrt2', equivalents: ['152√2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=\dfrac{2x}3(t-3)(4t^3+12t^2+36t-1)$ ⇒ 최소점 $x=\pm12\sqrt2$, 길이 $\displaystyle\int_{-12\sqrt2}^{12\sqrt2}\left(1+\frac{x^2}{18}\right)dx=152\sqrt2$.
    steps:
    - {id: 2a, content: '$24\sqrt2+\dfrac{2(12\sqrt2)^3}{54}=24\sqrt2+128\sqrt2=152\sqrt2$', criteria: [2.M1, 2.R1, 2.B1, 2.A1]}
    hint_ladder:
    - 거리 대신 거리의 제곱을 미분하자.
    - $t=\sqrt{1+\dfrac{x^2}{36}}$로 두면 도함수가 $t$의 다항식이 된다.
    - $1+(y')^2$을 계산하면 완전제곱식이 된다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2024 논술가이드북(자연) p.59 예시답안
    steps:
    - id: 2b-1
      content: |
        점 P와 주어진 곡선 위의 점 사이 거리의 제곱의 함수를 $f(x)=x^2+\left\{4\left(1+\dfrac{x^2}{36}\right)^{\frac32}-109\right\}^2$라 하자. $f(x)$의 미분
        $$f'(x)=\frac{2x}3\left\{4\left(1+\frac{x^2}{36}\right)^2-109\sqrt{1+\frac{x^2}{36}}+3\right\}$$
        를 계산한 다음, $t=\sqrt{1+\dfrac{x^2}{36}}$로 치환하여 인수분해 하면
        $$f'(x)=\frac{2x}3(t-3)(4t^3+12t^2+36t-1)$$
        을 얻는다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        이때, $g(t)=4t^3+12t^2+36t-1$이라 하면 $g(1)=51>0$이고 $g'(t)=12(t+1)^2+24>0$이므로, $t\ge1$일 때 $g(t)>0$라는 것을 알 수 있다.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        따라서 함수 $f(x)$는 $x=0$, $t=3$(즉, $x=\pm12\sqrt2$)에서 극값을 가진다. 여기서 $f(\pm12\sqrt2)=(12\sqrt2)^2+1<105^2=f(0)$이므로 $x_1=-12\sqrt2$, $x_2=12\sqrt2$임을 알 수 있다.
      criteria: [2.B1]
    - id: 2b-4
      content: |
        곡선의 길이를 구하기 위해 적분 $\displaystyle\int_{-12\sqrt2}^{12\sqrt2}\sqrt{1+\left(\frac{dy}{dx}\right)^2}dx$를 계산해야 하는데, 적분 함수를
        $$\sqrt{1+\left(\frac{dy}{dx}\right)^2}=\sqrt{1+\left(6\sqrt{1+\frac{x^2}{36}}\cdot\frac{x}{18}\right)^2}=1+\frac{x^2}{18}$$
        로 정리한 후 계산하면 정답 $152\sqrt2$를 얻을 수 있다.
      criteria: [2.A1]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 2024 논술가이드북(자연) p.60 별해
    key_idea: 거리가 최소인 점 Q에서 접선과 선분 PQ가 수직 ⇒ Q에서의 법선이 P를 지남.
    steps:
    - id: 2c-1
      content: |
        점 $\mathrm P(0,109)$와 $\mathrm Q\left(\alpha,4\left(1+\dfrac{\alpha^2}{36}\right)^{\frac32}\right)$와의 거리가 최소이기 위해서는 주어진 곡선 위의 점 Q에서 접선
        $$y=\sqrt{1+\frac{\alpha^2}{36}}\cdot\frac\alpha3(x-\alpha)+4\left(1+\frac{\alpha^2}{36}\right)^{\frac32}$$
        과 선분 PQ가 수직이어야 한다. (원문은 접선의 기울기 앞에 $-$ 부호가 인쇄되어 있으나 $y'=\dfrac\alpha3\sqrt{1+\dfrac{\alpha^2}{36}}$이므로 오기로 보고 바로잡음)
      criteria: []
    - id: 2c-2
      content: |
        따라서, 직선
        $$y=-\frac1{\sqrt{1+\dfrac{\alpha^2}{36}}\cdot\dfrac\alpha3}(x-\alpha)+4\left(1+\frac{\alpha^2}{36}\right)^{\frac32}$$
        이 점 P를 지나야 한다. 이때, $t=\sqrt{1+\dfrac{\alpha^2}{36}}$라 하면
        $$109=-\frac1{\sqrt{1+\dfrac{\alpha^2}{36}}\cdot\dfrac\alpha3}(-\alpha)+4\left(1+\frac{\alpha^2}{36}\right)^{\frac32}=\frac3t+4t^3$$
        이므로 $4t^4-109t+3=0$을 만족해야 한다.
      criteria: [2.M1]
    - id: 2c-3
      content: |
        이후 과정은 앞의 예시답안과 같은 방식으로 인수분해하여 $t=3$(즉, $x=\pm12\sqrt2$)를 구한 후, 곡선의 길이 $152\sqrt2$를 구하면 된다.
      criteria: [2.R1, 2.B1, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: 거리의 제곱 함수를 미분한 후 인수분해하여 $f'(x)=\dfrac{2x}3(t-3)(4t^3+12t^2+36t-1)$을 얻었다(별해 — 점 Q에서의 접선과 수직이고 Q를 지나는 직선이 P도 지난다는 것을 이용하여 $4t^4-109t+3=0$을 얻었다).
      depends_on: []
      steps: [2b-1, 2c-2]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: $4t^3+12t^2+36t-1$이 주어진 조건($t\ge1$)에서 항상 양수라는 것을 확인했다.
      depends_on: []
      steps: [2b-2, 2c-3]
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: 극소점 $x=\pm12\sqrt2$(즉 $x_1=-12\sqrt2$, $x_2=12\sqrt2$)를 구했다.
      depends_on: []
      steps: [2b-3, 2c-3]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: 곡선의 길이를 구하여 정답 $152\sqrt2$를 얻었다.
      depends_on: [2.M1]
      implied_ok: true
      steps: [2b-4, 2c-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4413}
  misconceptions:
