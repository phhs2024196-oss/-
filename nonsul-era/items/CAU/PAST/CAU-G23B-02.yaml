key_idea: '[2-1] $x<0$ 부분을 $u=-x$로 치환하면 $\displaystyle\int_0^{\frac\pi4}\left(\frac{x}{1+\sin x}+\frac{x}{1-\sin x}\right)dx=\int_0^{\frac\pi4}2x\sec^2x\,dx$. [2-2] 거리 제곱의 도함수가 $t=\sqrt{1+\dfrac{x^2}{36}}$로 $\dfrac{2x}3(t-3)(4t^3+12t^2+36t-1)$로 인수분해되고, $1+(y'')^2=\left(1+\dfrac{x^2}{18}\right)^2$이 완전제곱.'
stuck: '[2-1] 두 분수를 합쳐 $\dfrac{2x}{1-\sin^2x}=2x\sec^2x$로 만드는 단계 / [2-2] 거리 제곱의 도함수를 $t$로 치환해 인수분해하고 $t\ge1$에서 삼차식이 양수임을 보이는 단계'
