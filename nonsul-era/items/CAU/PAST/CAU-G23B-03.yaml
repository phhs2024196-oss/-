intent: '[3-1] 포물선과 원이 서로 다른 두 점에서 만나는 조건을 문자 소거와 판별식으로 나타내 $b=f(a)$를 구하고 미분(또는 산술·기하평균)으로 최댓값을 구하는지, [3-2] 거리 조건으로 주어진 음함수를 미분하여 변화율을 구하고, 극값 조건과 삼각함수의 관계로 최댓값을 구한 뒤 양 끝점과 비교하는지를 본다(공식 출제 의도 미공개 — 예시답안 구조로부터 자체 요약).'
key_idea: '[3-1] $x^2$을 소거하면 $y$에 대한 이차방정식 $(a+1)^2y^2-(2b(a+1)^2+1)y+\left(a+\frac32\right)^2=0$. 두 점(좌우 대칭)에서 만나려면 이 식이 중근 ⇒ $b=f(a)=\dfrac{2a^2+5a+2}{2a^2+4a+2}$. [3-2] $(x-\cos t)^2+(\sqrt x-\sin t)^2=1$을 $t$로 음함수 미분, 최대에서 $x''=0$ ⇒ $\sqrt x=\dfrac{\cos\alpha}{\sin\alpha}$.'
stuck: '[3-1] 원과 포물선이 “서로 다른 두 점”에서 만남을 $y$에 대한 중근(대칭인 두 교점)으로 번역하는 단계 / [3-2] $x''(\alpha)=0$에서 얻은 $\sqrt x=\cot\alpha$를 원래 식에 대입해 $\cos\alpha$의 이차방정식으로 줄이는 단계'
idea_tags: [IDEA-ELIMINATE-X2-DOUBLE-ROOT, IDEA-AM-GM-RATIONAL-MAX, IDEA-IMPLICIT-DIFF-PARAM, IDEA-COMPARE-ENDPOINTS]
