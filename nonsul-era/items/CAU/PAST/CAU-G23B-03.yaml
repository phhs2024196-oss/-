stimuli:
- label: '1'
  body: |
    미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면 $f'(a)=0$이다.
- label: '2'
  body: |
    모든 실수 $x$에 대하여 $\sin^2x+\cos^2x=1$이 성립한다.
- label: '3'
  body: |
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는 $\{f(g(x))\}'=f'(g(x))g'(x)$이다.
- label: '4'
  body: |
    $x$의 함수 $y$가 음함수의 꼴 $f(x,y)=0$으로 주어질 때, $f(x,y)=0$의 양변을 $x$에 대하여 미분하여 $\dfrac{dy}{dx}$를 구한다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    조건 $a\ge0$, $0<2b<\left(a+\dfrac32\right)^2$을 만족하는 실수 $a$, $b$가 있다. 주어진 $a$에 대하여 곡선 $y=\left(a+\dfrac32\right)^2-(a+1)^2x^2$과 원 $x^2+(y-b)^2=b^2$이 서로 다른 두 점에서 만나게 하는 $b$의 값을 $f(a)$라 할 때, $f(a)$의 최댓값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac98', equivalents: ['9/8', '1.125'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x^2$을 소거한 $y$의 이차식이 중근 ⇒ $2b(a+1)^2+1=2(a+1)\left(a+\frac32\right)$ ⇒ $b=1+\dfrac1{2\left(a+\frac1a+2\right)}\le\dfrac98$.
    steps:
    - {id: 1a, content: '$f(a)=\dfrac{2a^2+5a+2}{2a^2+4a+2}$, $a=1$에서 최댓값 $\dfrac98$', criteria: [1.M1, 1.B1, 1.A1]}
    hint_ladder:
    - 두 식에서 $x^2$을 소거해 $y$만의 식을 만들자.
    - 포물선과 원 모두 $y$축에 대칭이다. 교점이 두 개라면 $y$좌표는 몇 개인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 논술가이드북(자연) p.61 예시답안
    steps:
    - id: 1b-1
      content: |
        $(a+1)^2x^2=\left(a+\dfrac32\right)^2-y$를 $x^2+(y-b)^2=b^2$에 대입하여 정리하면 아래와 같다.
        $$(a+1)^2y^2-(2b(a+1)^2+1)y+\left(a+\frac32\right)^2=0$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이차함수와 원이 두 점에서 만나려면 $y$가 중근이여야 하고 판별식을 쓰면 다음을 얻는다.
        $$(2b(a+1)^2+1)^2=4(a+1)^2\left(a+\frac32\right)^2$$
        정리하면 $2b(a+1)^2+1=2(a+1)\left(a+\dfrac32\right)$이고 $b=f(a)=\dfrac{2a^2+5a+2}{2a^2+4a+2}$이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $a\ge0$이고 $f'(a)=\dfrac{1-a}{2(a+1)^3}$이므로 $a=1$에서 최댓값 $f(1)=\dfrac98$를 갖는다.
      criteria: [1.A1]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2024 논술가이드북(자연) p.61 별해
    key_idea: $f(a)$를 $1+\dfrac1{2\left(a+\frac1a+2\right)}$로 바꿔 산술·기하평균 부등식 $a+\dfrac1a\ge2$를 쓴다.
    steps:
    - id: 1c-1
      content: |
        $b$를 구하는 과정은 예시답안과 같다.
        $$b=\frac{2a^2+5a+2}{2a^2+4a+2}=1+\frac{a}{2(a^2+2a+1)}=1+\frac1{2\left(a+\frac1a+2\right)}$$
        이다. $a+\dfrac1a\ge2$이므로 $b\le\dfrac98$이다. 실제로 $a=1$에서 $a+\dfrac1a=2$이고 $b$의 최댓값은 $\dfrac98$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $(a+1)^2y^2-(2b(a+1)^2+1)y+\left(a+\dfrac32\right)^2=0$을 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: $b=f(a)=\dfrac{2a^2+5a+2}{2a^2+4a+2}$를 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 미분을 하여(별해는 $a+\dfrac1a\ge2$를 이용하여) 최댓값 $f(1)=\dfrac98$을 구했다.
      depends_on: [1.M1]
      implied_ok: true
      steps: [1b-3, 1c-1]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4414}
  misconceptions:
  - id: MC-GEO-4414
    outcome_code: '70'
    wrong_work: '$y$에 대한 이차방정식의 판별식 $>0$(서로 다른 두 실근)을 조건으로 세워 $b$의 범위만 얻고 $f(a)$를 정하지 못함'
    detect_cue: 판별식에 부등호를 씀, $b$가 하나의 값으로 정해지지 않음
    feedback: 포물선과 원은 모두 $y$축에 대칭이므로 $y$좌표 하나가 교점 두 개($\pm x$)를 줍니다. 교점이 정확히 두 개이려면 $y$에 대한 이차방정식이 중근이어야 합니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표평면 위를 움직이는 점 $\mathrm A(\cos t,\sin t)$와 곡선 $y=\sqrt x$ 위의 점 $\mathrm B(x,y)$가 거리 1을 유지하며 연속적으로 움직인다. $t=0$일 때, 점 $\mathrm B(x,y)$는 제1사분면의 한 점에서 출발한다. $t=\dfrac\pi2$일 때, $\dfrac{dx}{dt}$의 값을 구하시오. 또한, 점 $\mathrm B(x,y)$의 $x$좌표의 최댓값을 구하시오. (단, $0\le t\le\pi$이다.) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{dx}{dt}=-1,\ x_{\max}=\dfrac{\sqrt{17}-1}{2}', equivalents: ['-1, (√17-1)/2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $(x-\cos t)^2+(\sqrt x-\sin t)^2=1$을 $t$로 미분. 최대에서 $x'=0$ ⇒ $\sqrt x=\cot\alpha$, 대입하면 $2\cos^2\alpha+\cos\alpha-2=0$.
    steps:
    - {id: 2a, content: '$t=\dfrac\pi2$: B$(1,1)$, $x\prime=-1$ / $\cos\alpha=\dfrac{-1+\sqrt{17}}4$, $x=\cot^2\alpha=\dfrac{\sqrt{17}-1}2$ ($>1$이므로 끝점보다 큼)', criteria: [2.M1, 2.M2, 2.B1, 2.R1]}
    hint_ladder:
    - 거리 1 조건을 식으로 쓰고 양변을 $t$로 미분하자.
    - $x$가 최대인 $t=\alpha$에서는 $x'(\alpha)=0$이다.
    - 구간의 양 끝 $t=0,\pi$에서의 $x$와 비교하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2024 논술가이드북(자연) p.62 예시답안
    steps:
    - id: 2b-1
      content: |
        문제의 조건에서 다음을 얻을 수 있다.
        $$(x-\cos t)^2+(\sqrt x-\sin t)^2=1\qquad(*)$$
        음함수 미분하여 다음을 얻는다.
        $$(x-\cos t)(x'+\sin t)+(\sqrt x-\sin t)\left(\frac{x'}{2\sqrt x}-\cos t\right)=0$$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        1) $t=\dfrac\pi2$일 때, 대응하는 점은 $\mathrm B(1,1)$이다. $t=\dfrac\pi2$, $x=1$ 대입하면 $\dfrac{dx}{dt}=-1$이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        2) $x$가 $t=\alpha$에서 최댓값을 가질 때 $x'(\alpha)=0$임을 고려하면, $\sqrt x=\dfrac{\cos\alpha}{\sin\alpha}$이다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        식 $(*)$을 정리하면 $x^2-2x\cos t+x-2\sqrt x\sin t=0$이다. $\sqrt x=\dfrac{\cos\alpha}{\sin\alpha}$를 대입하면
        $$\cos\alpha-2\sin^2\alpha\cos^2\alpha=2\sin^4\alpha$$
        이 된다. $\sin^2t=1-\cos^2t$를 이용하여 정리하면 $2\cos^2\alpha+\cos\alpha-2=0$이 되고 $\cos\alpha=\dfrac{-1+\sqrt{17}}4$이다. $x$값을 구하면 $x=\dfrac{\cos^2\alpha}{\sin^2\alpha}=\dfrac{9-\sqrt{17}}{\sqrt{17}-1}=\dfrac{\sqrt{17}-1}2$이다.
      criteria: [2.B1]
    - id: 2b-5
      content: |
        구간 $0\le t\le\pi$의 양 끝점에서 함수 값을 확인하자. $t=0$일 때, 대응하는 B는 $(1,1)$이고, $t=\pi$일 때, 대응하는 B는 $(0,0)$이다. $1<\dfrac{\sqrt{17}-1}2$이므로 최댓값은 $x=\dfrac{\sqrt{17}-1}2$이다.
      criteria: [2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 음함수 미분을 통하여 $t=\dfrac\pi2$에서 $\dfrac{dx}{dt}=-1$을 구했다.
      depends_on: []
      steps: [2b-1, 2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: $\sqrt x=\dfrac{\cos\alpha}{\sin\alpha}$를 유도했다.
      depends_on: []
      steps: [2b-3]
    - id: 2.B1
      mark_type: B
      points: 4
      evidence: $2\cos^2\alpha+\cos\alpha-2=0$을 얻어 $\cos\alpha=\dfrac{-1+\sqrt{17}}4$를 얻었다.
      depends_on: []
      steps: [2b-4]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: $x=\dfrac{\sqrt{17}-1}2$를 얻고 양 끝점($t=0$에서 $x=1$, $t=\pi$에서 $x=0$)에서의 값과 비교하여 최댓값임을 보였다.
      depends_on: []
      steps: [2b-5]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4415}
  misconceptions:
  - id: MC-CAL-4415
    outcome_code: '70'
    wrong_work: '$t=\dfrac\pi2$에서 B를 $(0,0)$으로 택해 $\dfrac{dx}{dt}$를 구하려 하거나, $x''(\alpha)=0$의 해만 구하고 끝점 $t=0,\pi$의 $x$값과 비교하지 않음'
    detect_cue: $t=\dfrac\pi2$에서 B의 좌표 근거(연속성) 없음, 끝점 비교 없음
    feedback: '$t=\dfrac\pi2$에서 거리 1인 점은 $(0,0)$과 $(1,1)$ 두 개이지만, B는 $t=0$의 $(1,1)$에서 연속적으로 움직이므로 $(1,1)$입니다. 닫힌구간에서의 최댓값은 극값과 끝값을 함께 비교해야 합니다.'
    remedy: [RL-2]

