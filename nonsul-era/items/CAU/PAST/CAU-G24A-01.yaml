intent: 주사위 결과에 따라 두 주머니에서 공을 꺼내는 시행의 표본공간과 확률을 정확히 정리하고, 원뿔에 내접하는 원기둥의 높이를 닮음으로 구해 확률변수(부피)의 기댓값을 계산하는 능력을 본다(공식 해설 흐름에서 정리 — 공식 출제 의도 문서 없음).
