stimuli: []

stem: |
  다음 규칙에 따라 점수를 얻는 시행을 한다.

  - 밑면의 반지름의 길이가 5이고 높이가 10인 원뿔이 있다.
  - 주머니 A에는 $1,2,3$의 숫자가 하나씩 적혀 있는 3개의 공이 들어 있고, 주머니 B에는 $1,2$의 숫자가 하나씩 적혀 있는 2개의 공이 들어 있다.
  - 한 개의 주사위를 한 번 던져서 나온 눈의 수가 3의 배수이면 주머니 A에서 임의로 2개의 공을 동시에 꺼내고, 주머니 B에서 임의로 1개의 공을 꺼낸다. 3의 배수가 아니면 주머니 A에서 임의로 1개의 공을 꺼내고, 주머니 B에서 임의로 2개의 공을 동시에 꺼낸다.
  - 주머니 A와 B에서 꺼낸 공에 적힌 숫자들의 합을 $k$라 하자. 이때 반지름의 길이가 $k-3$이고 원뿔에 내접하는 원기둥의 부피를 점수로 한다.
  - 다음은 원뿔에 내접하고, 밑면의 반지름의 길이가 $r$이고 높이가 $h$인 원기둥을 나타낸 것이다.

    [그림: 원뿔 안에 밑면이 원뿔의 밑면과 같은 평면에 있고 윗면 둘레가 원뿔의 옆면에 닿는 원기둥. 밑면 중심 O, 원기둥 반지름 $r$, 높이 $h$]

  시행의 결과로 얻은 점수의 기댓값을 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    시행의 결과로 얻은 점수의 기댓값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '24\pi', equivalents: ['24*pi', '432/18*pi'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $P(k=4,5,6,7)=\frac{5}{18},\frac{6}{18},\frac{6}{18},\frac{1}{18}$, 부피 $(k-3)^2(16-2k)\pi=8\pi,24\pi,36\pi,32\pi$.
    steps:
    - {id: 1a, content: '기댓값 $=\dfrac{\pi}{18}(5\cdot8+6\cdot24+6\cdot36+1\cdot32)=24\pi$', criteria: [1.B1, 1.B2, 1.B3, 1.B4, 1.B5]}
    hint_ladder:
    - 주사위가 3의 배수인 경우와 아닌 경우의 표본공간을 각각 표로 정리하자.
    - 원뿔의 축을 지나는 단면에서 원기둥의 높이를 닮음으로 구하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.48~49 [문제 1] 예시답안
    steps:
    - id: 1b-1
      content: |
        (1) 한 개의 주사위를 한 번 던져서 나온 눈의 수가 3의 배수일 확률은 $\dfrac13$이다. 이때 주머니 A에서 임의로 2개의 공을 동시에 꺼낼 때 적힌 숫자들의 표본공간은 $\{(1,2),(1,3),(2,3)\}$이고, 각 경우가 발생할 확률은 $\dfrac13$이다. 주머니 B에서 임의로 1개의 공을 꺼낼 때 적힌 숫자들의 표본공간은 $(1,2)$이고, 각 경우의 확률은 $\dfrac12$이다. 예를 들어, 주머니 A에서 꺼낸 공이 $(1,2)$이고, 주머니 B에서 꺼낸 공이 1일 때 확률은 $\dfrac13\times\dfrac13\times\dfrac12=\dfrac{1}{18}$이고, 공에 적힌 숫자들의 합 $k$는 4이다.
      criteria: []
    - id: 1b-2
      content: |
        (2) 주사위의 눈의 수가 3의 배수가 아닐 확률은 $\dfrac23$이다. 이때 주머니 A에서 임의로 1개의 공을 꺼낼 때 적힌 숫자들의 표본공간은 $\{1,2,3\}$이고 각 경우의 확률은 $\dfrac13$이고, 주머니 B에서 2개의 공을 동시에 꺼낼 때 적힌 숫자들의 표본공간은 $\{(1,2)\}$이고 그때의 확률은 1이다. 예를 들어, 주머니 A에서 꺼낸 공이 1이고, 주머니 B에서 꺼낸 공이 $(1,2)$일 때 확률은 $\dfrac23\times\dfrac13\times1=\dfrac29$이고, 공에 적힌 숫자들의 합 $k$는 4이다.
      criteria: []
    - id: 1b-3
      content: |
        (3) 위와 같은 방식으로 얻은 시행의 결과는 다음과 같다.

        | 주사위의 눈의 수 | 주머니 A에서 꺼낸 공 | 주머니 B에서 꺼낸 공 | $k$ | 확률 |
        |---|---|---|---|---|
        | 3의 배수인 경우 | (1,2) | 1 | 4 | $\frac13\times\frac13\times\frac12=\frac{1}{18}$ |
        | | (1,2) | 2 | 5 | $\frac{1}{18}$ |
        | | (1,3) | 1 | 5 | $\frac{1}{18}$ |
        | | (1,3) | 2 | 6 | $\frac{1}{18}$ |
        | | (2,3) | 1 | 6 | $\frac{1}{18}$ |
        | | (2,3) | 2 | 7 | $\frac{1}{18}$ |
        | 3의 배수가 아닌 경우 | 1 | (1,2) | 4 | $\frac23\times\frac13\times1=\frac29$ |
        | | 2 | (1,2) | 5 | $\frac29$ |
        | | 3 | (1,2) | 6 | $\frac29$ |
      criteria: []
    - id: 1b-4
      content: |
        (4) 반지름의 길이가 $k-3$인 원기둥의 높이는 그림 1에서 도형의 닮음을 이용하면 $(16-2k)$로 계산할 수 있고, 원기둥의 부피는 $(k-3)^2(16-2k)\pi$이다. [그림 1: 원뿔의 축 단면 중 직각삼각형(밑변 5, 높이 10)과 반지름 1~4에 대응하는 높이 8, 6, 4, 2를 점선으로 표시]
      criteria: []
    - id: 1b-5
      content: |
        (5) $k=4$일 때의 확률은 $\dfrac{1}{18}+\dfrac29=\dfrac{5}{18}$이고, 이때 원기둥의 반지름의 길이는 1, 높이는 8, 부피는 $8\pi$이다.
      criteria: [1.B1]
    - id: 1b-6
      content: |
        (6) $k=5$일 때의 확률은 $\dfrac{1}{18}+\dfrac{1}{18}+\dfrac29=\dfrac{6}{18}$이고, 이때 반지름의 길이는 2, 높이는 6, 부피는 $24\pi$이다.
      criteria: [1.B2]
    - id: 1b-7
      content: |
        (7) $k=6$일 때의 확률은 $\dfrac{1}{18}+\dfrac{1}{18}+\dfrac29=\dfrac{6}{18}$이고, 이때 반지름의 길이는 3, 높이는 4, 부피는 $36\pi$이다.
      criteria: [1.B3]
    - id: 1b-8
      content: |
        (8) $k=7$일 때의 확률은 $\dfrac{1}{18}$이고, 이때 반지름의 길이는 4, 높이는 2, 부피는 $32\pi$이다.
      criteria: [1.B4]
    - id: 1b-9
      content: |
        (9) 시행의 결과는 다음과 같고, 이를 이용하여 점수의 기댓값을 계산할 수 있다.

        | $k$ | 확률 | 원기둥의 밑면의 반지름 | 원기둥의 높이 | 원기둥의 부피 |
        |---|---|---|---|---|
        | 4 | $\frac{5}{18}$ | 1 | 8 | $8\pi$ |
        | 5 | $\frac{6}{18}$ | 2 | 6 | $24\pi$ |
        | 6 | $\frac{6}{18}$ | 3 | 4 | $36\pi$ |
        | 7 | $\frac{1}{18}$ | 4 | 2 | $32\pi$ |

        $$\text{기댓값}=\left(\frac{5}{18}\times8\pi\right)+\left(\frac{6}{18}\times24\pi\right)+\left(\frac{6}{18}\times36\pi\right)+\left(\frac{1}{18}\times32\pi\right)$$
        $$=\frac{\pi}{18}\{(5\times8)+(6\times24)+(6\times36)+(1\times32)\}=\frac{432}{18}\pi=\frac{216}{9}\pi=24\pi$$
      criteria: [1.B5]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: '$k=4$의 값, 그때의 확률 $\frac{5}{18}$(+2), 원기둥의 높이 8(+1), 부피 $8\pi$(+1)를 정확히 계산했다.'
      depends_on: []
      steps: [1b-5]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: '$k=5$의 값, 그때의 확률 $\frac{6}{18}$(+2), 원기둥의 높이 6(+1), 부피 $24\pi$(+1)를 정확히 계산했다.'
      depends_on: []
      steps: [1b-6]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: '$k=6$의 값, 그때의 확률 $\frac{6}{18}$(+2), 원기둥의 높이 4(+1), 부피 $36\pi$(+1)를 정확히 계산했다.'
      depends_on: []
      steps: [1b-7]
    - id: 1.B4
      mark_type: B
      points: 4
      evidence: '$k=7$의 값, 그때의 확률 $\frac{1}{18}$(+2), 원기둥의 높이 2(+1), 부피 $32\pi$(+1)를 정확히 계산했다.'
      depends_on: []
      steps: [1b-8]
    - id: 1.B5
      mark_type: B
      points: 4
      evidence: 원기둥의 부피의 기댓값 $24\pi$를 정확히 계산했다.
      depends_on: []
      steps: [1b-9]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-4509}
  misconceptions:
  - id: MC-PRB-4509
    outcome_code: '70'
    wrong_work: '주머니 A에서 동시에 꺼내는 2개를 순서쌍 6가지로 세면서 확률을 $\frac16$이 아닌 $\frac13$로 두어 합이 1을 넘거나, 주사위 확률 $\frac13,\ \frac23$을 곱하지 않음'
    detect_cue: $k$별 확률의 합이 1이 아님(예 $\frac{5}{18}$ 대신 $\frac{2}{6}$)
    feedback: 동시에 꺼내는 경우의 표본공간은 순서 없는 쌍 $\{(1,2),(1,3),(2,3)\}$입니다. 주사위 결과의 확률도 곱해 각 경우를 모두 더하면 1이 되는지 확인하세요.
    remedy: [RL-1]

