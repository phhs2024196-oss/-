intent: 로그의 성질로 지수에 로그가 있는 식을 정리하고 합의 공식을 적용하는 능력(2-1), 움직이는 두 점의 각 조건에서 함수를 구하고 정적분과 급수의 합의 관계·탄젠트 덧셈정리·치환적분으로 극한값을 구하는 능력(2-2)을 본다(공식 해설 흐름에서 정리 — 공식 출제 의도 문서 없음).
key_idea: |
  (2-1) $k^{\frac{k\ln2}{\ln k}}=k^{\log_k2^k}=2^k$, $2^{\frac{2\ln k}{\ln2}}=2^{\log_2k^2}=k^2$. (2-2) $\angle\mathrm{OBA}=\frac{\pi}{3}-t$ 에서 $f(t)=1+\tan t\tan\left(t+\frac{\pi}{6}\right)=\dfrac{\tan\left(t+\frac{\pi}{6}\right)-\tan t}{\tan\frac{\pi}{6}}$로 바꿔 적분한다.
stuck: (2-1) 밑변환으로 지수를 $\log_k2^k$ 꼴로 보는 발상 / (2-2) 점 B의 위치 $f(t)$를 각 조건에서 구하고, $1+\tan x\tan\left(x+\frac{\pi}{6}\right)$을 두 탄젠트의 차로 바꾸는 단계
idea_tags: [IDEA-LOG-EXPONENT-SWAP, IDEA-RIEMANN-SUM-TO-INTEGRAL, IDEA-TAN-PRODUCT-TO-DIFFERENCE]
tags: [로그의 성질, 시그마, 정적분과 급수, 탄젠트 덧셈정리, 중앙대 실전]
elements:
  materials:
  - '$\displaystyle\sum_{k=2}^{9}\left(k^{\frac{k\ln2}{\ln k}}-2^{\frac{2\ln k}{\ln2}}\right)$'
  - '직선 $x=1$ 위의 점 $\mathrm{A}(1,g(t))$, $x$축 위의 점 $\mathrm{B}(f(t),0)$, 원점 O'
  - '$0<t\le\frac{\pi}{4}$에서 $\angle\mathrm{AOB}=t$, $\angle\mathrm{OAB}=\frac{2\pi}{3}$'
  - '$\displaystyle\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}f\left(\frac{\pi k}{6n}\right)$'
  concepts: [로그의 정의와 성질, 로그의 밑변환, 등비수열의 합, 자연수의 거듭제곱의 합, 정적분과 급수의 합의 관계, 탄젠트 덧셈정리, 치환적분]
  tools:
  - '$a^{\log_a N}=N$ 꼴로 정리'
  - '$\sum_{k=2}^9 2^k$, $\sum_{k=1}^9k^2$ 공식(시작 항 보정)'
  - '삼각형 OAB의 각에서 $f(t)=1+\tan t\tan\left(t+\frac{\pi}{6}\right)$'
  - '$\frac1n\sum f\left(\frac{\pi k}{6n}\right)\to\frac{6}{\pi}\int_0^{\pi/6}f(x)\,dx$'
  - '$\int\tan x\,dx=-\ln(\cos x)+C$'
  conditions:
  - '$k\ge2$ ⇒ $\ln k>0$, $k\ne1$ 이므로 밑이 $k$인 로그 사용 가능'
  - '$\angle\mathrm{AOB}=t$ ⇒ $g(t)=\tan t$, $\angle\mathrm{OBA}=\pi-t-\frac{2\pi}{3}=\frac{\pi}{3}-t$'
  - '$x_k=\frac{\pi k}{6n}$ ⇒ 구간 $\left[0,\frac{\pi}{6}\right]$, $\Delta x=\frac{\pi}{6n}$ ⇒ $\frac1n=\frac{6}{\pi}\Delta x$'
  - '$x_1\ge1$, $y_1\ge0$ 조건 ⇒ B는 $x=1$ 오른쪽, A는 제1사분면'
  stimuli_used: ['1', '2', '3', '4']
  subpart_links: 2-1·2-2 는 독립. 2-1 은 제시문 1·2(로그), 2-2 는 제시문 3(정적분과 급수)·4(탄젠트 뺄셈정리)를 쓴다.

