stimuli:
- label: '1'
  body: |
    $a>0,\ a\ne1,\ N>0$일 때, $a^x=N\iff x=\log_aN$이다. 그리고 $\log_aN^k=k\log_aN$이다. (단, $k$는 실수)
- label: '2'
  body: |
    $a>0,\ a\ne1,\ b>0,\ c>0,\ c\ne1$일 때, $\log_ab=\dfrac{\log_cb}{\log_ca}$이다.
- label: '3'
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 다음 식이 성립한다.
    $$\int_a^bf(x)\,dx=\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x\qquad\left(\text{단, }\Delta x=\frac{b-a}{n},\ x_k=a+k\Delta x\right)$$
- label: '4'
  body: |
    $$\tan(\alpha-\beta)=\frac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}\qquad(\text{단, }\tan\alpha\tan\beta\ne-1)$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    다음 식의 값을 구하시오. [10점]
    $$\sum_{k=2}^{9}\left(k^{\frac{k\ln2}{\ln k}}-2^{\frac{2\ln k}{\ln2}}\right)$$
  points: 10
  depends_on: []
  answer: {kind: value, value: '736', equivalents: ['736'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 각 항이 $2^k-k^2$이 된다.
    steps:
    - {id: 1a, content: '$\sum_{k=2}^9(2^k-k^2)=1020-284=736$', criteria: [1.B1, 1.B2]}
    hint_ladder:
    - $\dfrac{\ln 2^k}{\ln k}$는 어떤 로그로 쓸 수 있는가?
    - $a^{\log_aN}=N$을 이용하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.50 [문제 2-1] 예시답안
    steps:
    - id: 1b-1
      content: |
        로그함수의 성질을 이용하여
        $$k^{\frac{k\ln2}{\ln k}}=k^{\frac{\ln2^k}{\ln k}}=k^{\log_k2^k}=2^k,\qquad2^{\frac{2\ln k}{\ln2}}=2^{\frac{\ln k^2}{\ln2}}=2^{\log_2k^2}=k^2\ \text{로 정리한 후,}$$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        아래와 같이 등비수열의 합과 자연수의 거듭제곱의 합에 대한 식을 이용하여 답을 구한다.
        $$\sum_{k=2}^{9}2^k-\sum_{k=2}^{9}k^2=\sum_{k=2}^{9}2^k-\left(\sum_{k=1}^{9}k^2\right)+1=\frac{4(2^8-1)}{2-1}-\frac{9\cdot10\cdot19}{6}+1=1020-285+1=736$$
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 6
      evidence: 로그함수의 성질을 이용하여 $k^{\frac{k\ln2}{\ln k}}=2^k$, $2^{\frac{2\ln k}{\ln2}}=k^2$을 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: 수열의 합공식을 이용하여 정답 736을 얻었다.
      depends_on: []
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-4510}
  - {code: '71', misconception: MC-ALG-4511}
  misconceptions:
  - id: MC-ALG-4510
    outcome_code: '70'
    wrong_work: '$k^{\frac{k\ln2}{\ln k}}$을 $k^{k\ln2}$나 $2^{\ln k}$처럼 잘못 변형하거나, $2^{\frac{2\ln k}{\ln2}}=2k$로 계산'
    detect_cue: 각 항이 $2^k-k^2$ 꼴로 정리되지 않음
    feedback: $\dfrac{\ln N}{\ln a}=\log_aN$이고 $a^{\log_aN}=N$입니다. 지수를 먼저 하나의 로그로 묶어 보세요.
    remedy: [RL-1]
  - id: MC-ALG-4511
    outcome_code: '71'
    wrong_work: '$\sum_{k=2}^9k^2$를 $\frac{9\cdot10\cdot19}{6}=285$ 그대로 쓰거나 $\sum_{k=2}^92^k$를 $2^{10}-2$로 계산(시작 항 보정 누락)'
    detect_cue: 답이 735, 737, 738 등 736 근처의 값
    feedback: 합공식은 $k=1$부터의 합입니다. $k=2$부터이면 $k=1$ 항을 빼 주세요.
    remedy: [RL-2]
- id: '2'
  stem: |
    좌표평면에서 직선 $x=1$ 위를 움직이는 점 $\mathrm{A}(1,y_1)$과 $x$축 위를 움직이는 점 $\mathrm{B}(x_1,0)$의 시각 $t$에서의 위치는 두 함수 $x_1=f(t)$, $y_1=g(t)$로 나타내어질 수 있다. 두 점 $\mathrm{A}(1,g(t))$, $\mathrm{B}(f(t),0)$은 시각 $t=0$일 때 $(1,0)$에서 출발한 후, $0<t\le\dfrac{\pi}{4}$일 때 원점 O에 대하여 $\angle\mathrm{AOB}=t$이고 $\angle\mathrm{OAB}=\dfrac{2\pi}{3}$를 만족하며 움직인다고 하자. 이때, 극한값 $\displaystyle\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}f\left(\frac{\pi k}{6n}\right)$를 구하시오. (단, $x_1\ge1$, $y_1\ge0$이다.) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{6\sqrt{3}}{\pi}\ln\dfrac{3}{2}', equivalents: ['6*sqrt(3)/pi*log(3/2)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(t)=1+\tan t\tan\left(t+\frac{\pi}{6}\right)=\sqrt3\left\{\tan\left(t+\frac{\pi}{6}\right)-\tan t\right\}$.
    steps:
    - {id: 2a, content: '극한 $=\dfrac{6\sqrt3}{\pi}\displaystyle\int_0^{\pi/6}\left\{\tan\left(x+\tfrac{\pi}{6}\right)-\tan x\right\}dx=\dfrac{6\sqrt3}{\pi}\ln\dfrac32$', criteria: [2.B1, 2.M1, 2.B2, 2.B3]}
    hint_ladder:
    - 점 A의 $y$좌표는 $\tan t$이다. 삼각형 OAB의 나머지 각은?
    - 점 B에서 $x=1$까지의 거리를 $\tan\left(t+\frac{\pi}{6}\right)$로 나타내 보자.
    - $1+\tan\alpha\tan\beta$는 탄젠트 뺄셈정리의 분모이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.50 [문제 2-2] 예시답안
    steps:
    - id: 2b-1
      content: |
        우선 주어진 문제의 조건으로부터 $f(t)=1+(\tan t)\left\{\tan\left(t+\dfrac{\pi}{6}\right)\right\}$를 구한 후,
      criteria: [2.B1]
    - id: 2b-2
      content: |
        정적분과 급수의 합 사이의 관계를 이용하여 극한값을 $\dfrac{6}{\pi}\displaystyle\int_0^{\frac{\pi}{6}}\left[1+(\tan x)\left\{\tan\left(x+\frac{\pi}{6}\right)\right\}\right]dx$로 표현한다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        그리고 제시문에 주어진 탄젠트 함수의 덧셈정리를 이용하여
        $$\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}f\left(\frac{\pi k}{6n}\right)=\frac{6}{\pi}\int_0^{\frac{\pi}{6}}\frac{\tan\left(x+\frac{\pi}{6}\right)-\tan x}{\tan\frac{\pi}{6}}dx=\frac{6\sqrt3}{\pi}\int_0^{\frac{\pi}{6}}\left\{\tan\left(x+\frac{\pi}{6}\right)-\tan x\right\}dx$$
        를 얻는다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        치환적분을 하면 $\tan x$의 부정적분이 $-\ln(\cos x)+C$임을 알 수 있는데, 이를 이용하여 다음의 답을 얻는다.
        $$\frac{6\sqrt3}{\pi}\left\{-\ln\left(\cos\frac{\pi}{3}\right)+\ln\left(\cos\frac{\pi}{6}\right)+\ln\left(\cos\frac{\pi}{6}\right)-\ln(\cos0)\right\}=\frac{6\sqrt3}{\pi}\ln\frac32$$
      criteria: [2.B3]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 2025 논술가이드북(자연) p.51~52 [문제 2-2] 별해·별해 채점기준
    key_idea: '$\tan\left(x+\frac{\pi}{6}\right)$를 덧셈정리로 전개한 뒤 $u=\tan x$로 치환해 부분분수 적분한다. (별해 채점기준: $f(t)$ +3, 정적분 표현 +4, 전개식 +1, 치환 후 $\int_0^{1/\sqrt3}\left(-\frac{1}{1+u^2}+\frac{\sqrt3}{\sqrt3-u}\right)du$ +5, 정답 +2)'
    steps:
    - id: 2c-1
      content: |
        우선 주어진 문제의 조건으로부터 $f(t)=1+(\tan t)\left\{\tan\left(t+\dfrac{\pi}{6}\right)\right\}$를 구한 후, 정적분과 급수의 합 사이의 관계를 이용하여 극한값을 $\dfrac{6}{\pi}\displaystyle\int_0^{\frac{\pi}{6}}\left[1+(\tan x)\left\{\tan\left(x+\frac{\pi}{6}\right)\right\}\right]dx$로 표현한다.
      criteria: [2.B1, 2.M1]
    - id: 2c-2
      content: |
        그리고 탄젠트 함수의 덧셈정리 $\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$를 이용하여
        $$\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}f\left(\frac{\pi k}{6n}\right)=\frac{6}{\pi}\int_0^{\frac{\pi}{6}}\left[1+(\tan x)\left\{\frac{\tan x+\tan\left(\frac{\pi}{6}\right)}{1-\tan x\tan\left(\frac{\pi}{6}\right)}\right\}\right]dx=1+\frac{6}{\pi}\int_0^{\frac{\pi}{6}}(\tan x)\left(\frac{1+\sqrt3\tan x}{\sqrt3-\tan x}\right)dx$$
        를 얻는다.
      criteria: [2.B2]
    - id: 2c-3
      content: |
        남은 정적분의 값을 구하기 위해 $u=\tan x$로 치환을 한 후, 아래와 같이 식을 정리한다.
        $$\int_0^{\frac{\pi}{6}}(\tan x)\left(\frac{1+\sqrt3\tan x}{\sqrt3-\tan x}\right)dx=\int_0^{\frac{1}{\sqrt3}}\frac{u(1+\sqrt3u)}{(\sqrt3-u)(1+u^2)}du=-\int_0^{\frac{1}{\sqrt3}}\frac{1}{1+u^2}du+\sqrt3\int_0^{\frac{1}{\sqrt3}}\frac{1}{\sqrt3-u}du$$
        그리고 첫 번째 적분에 대해서 다시 $u=\tan t$로 치환하여 계산한다.
        $$\int_0^{\frac{\pi}{6}}(\tan x)\left(\frac{1+\sqrt3\tan x}{\sqrt3-\tan x}\right)dx=-\frac{\pi}{6}+\sqrt3\ln\frac32$$
      criteria: [2.B3]
    - id: 2c-4
      content: |
        따라서, 정답은 $1+\dfrac{6}{\pi}\left(-\dfrac{\pi}{6}+\sqrt3\ln\dfrac32\right)=\dfrac{6\sqrt3}{\pi}\ln\dfrac32$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: 주어진 정보로부터 $f(t)=1+(\tan t)\left\{\tan\left(t+\frac{\pi}{6}\right)\right\}$을 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: 정적분과 급수의 합 사이의 관계를 이용하여 $\frac{6}{\pi}\int_0^{\pi/6}\left[1+(\tan x)\left\{\tan\left(x+\frac{\pi}{6}\right)\right\}\right]dx$를 얻었다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B2
      mark_type: B
      points: 4
      evidence: 탄젠트 함수의 덧셈정리를 이용하여 $1+(\tan x)\left\{\tan\left(x+\frac{\pi}{6}\right)\right\}=\dfrac{\tan\left(x+\frac{\pi}{6}\right)-\tan x}{\tan\frac{\pi}{6}}$를 얻었다.
      depends_on: []
      steps: [2b-3]
    - id: 2.B3
      mark_type: B
      points: 4
      evidence: 정적분을 계산하여 정답 $\frac{6\sqrt3}{\pi}\ln\frac32$를 얻었다.
      depends_on: []
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석). 별해는 별해 채점기준(3·4·1·5·2점)으로 채점
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4512}
  misconceptions:
  - id: MC-CAL-4512
    outcome_code: '70'
    wrong_work: '$\frac1n\sum f\left(\frac{\pi k}{6n}\right)$를 $\int_0^1f(x)\,dx$ 또는 $\int_0^{\pi/6}f(x)\,dx$로 바꿔 계수 $\frac{6}{\pi}$를 빠뜨림'
    detect_cue: 답에 $\frac{6}{\pi}$ 인자가 없음(예 $\sqrt3\ln\frac32$), 또는 적분 구간이 $[0,1]$
    feedback: $x_k=\frac{\pi k}{6n}$이면 $\Delta x=\frac{\pi}{6n}$이므로 $\frac1n=\frac{6}{\pi}\Delta x$입니다. 구간과 계수를 함께 맞추세요.
    remedy: [RL-3]

