stimuli:
- label: '1'
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이는 $S=\displaystyle\int_a^b\lvert f(x)\rvert dx$이다.
- label: '2'
  body: |
    미분가능한 함수 $g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속이고, $g(a)=\alpha$, $g(b)=\beta$에 대하여 함수 $f(x)$가 $\alpha$와 $\beta$를 양끝으로 하는 닫힌구간에서 연속일 때 다음 식이 성립한다.
    $$\int_a^bf(g(x))g'(x)\,dx=\int_\alpha^\beta f(t)\,dt$$
- label: '3'
  body: |
    미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면 $f'(a)=0$이다.
- label: '4'
  body: |
    $$\tan(\alpha+\beta)=\frac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}\qquad(\text{단, }\tan\alpha\tan\beta\ne1)$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    $x\ge0$에서 정의된 곡선 $y=\dfrac{x}{x^2+1}\left(\{\ln(x^2+1)\}^2-6\ln(x^2+1)+5\right)$와 $x$축으로 둘러싸인 도형의 넓이를 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{13}{2}', equivalents: ['13/2', '6.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t=\ln(x^2+1)$ 치환으로 $\frac12\int_0^1(t^2-6t+5)dt-\frac12\int_1^5(t^2-6t+5)dt$.
    steps:
    - {id: 1a, content: '$\dfrac76+\dfrac{16}{3}=\dfrac{13}{2}$', criteria: [1.B1, 1.M1, 1.B2]}
    hint_ladder:
    - 괄호 안은 $\ln(x^2+1)$에 대한 이차식이다. 인수분해해 $x$절편을 찾자.
    - $\ln(x^2+1)$을 미분하면 $\frac{2x}{x^2+1}$이다.
    - $x$축 아래 부분은 빼야 넓이가 된다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.52 [문제 3-1] 예시답안
    steps:
    - id: 1b-1
      content: |
        $f(x)=\dfrac{x}{x^2+1}\left(\ln(x^2+1)-1\right)\left(\ln(x^2+1)-5\right)$라 하자. $x=0,\ \sqrt{e-1},\ \sqrt{e^5-1}$에서 $f(x)=0$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $0\le x\le\sqrt{e-1}$에서 $f(x)\ge0$이고 $\sqrt{e-1}\le x\le\sqrt{e^5-1}$에서 $f(x)\le0$이므로 구하는 넓이는 $\displaystyle\int_0^{\sqrt{e-1}}f(x)\,dx-\int_{\sqrt{e-1}}^{\sqrt{e^5-1}}f(x)\,dx$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $t=\ln(x^2+1)$로 치환하여 적분하면
        $$\frac12\int_0^1(t^2-6t+5)\,dt-\frac12\int_1^5(t^2-6t+5)\,dt=\frac76+\frac{16}{3}=\frac{13}{2}\ \text{이다.}$$
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: 교점 $x=0,\ \sqrt{e-1},\ \sqrt{e^5-1}$을 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 그래프의 개형을 이해하고 $\int_0^{\sqrt{e-1}}f(x)\,dx-\int_{\sqrt{e-1}}^{\sqrt{e^5-1}}f(x)\,dx$를 세웠다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: 치환 적분을 하여 $\frac{13}{2}$을 구했다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4513}
  misconceptions:
  - id: MC-CAL-4513
    outcome_code: '70'
    wrong_work: '$\int_0^{\sqrt{e^5-1}}f(x)\,dx=\frac76-\frac{16}{3}=-\frac{25}{6}$을 그대로(또는 절댓값만 취해 $\frac{25}{6}$) 넓이로 씀'
    detect_cue: 답이 $\frac{25}{6}$ 또는 음수
    feedback: $\sqrt{e-1}\le x\le\sqrt{e^5-1}$에서는 곡선이 $x$축 아래에 있습니다. 넓이는 $\int\lvert f(x)\rvert dx$이므로 그 구간의 적분은 빼야 합니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표평면 위에 점 $\mathrm{A}(-1,0)$, $\mathrm{B}(1,0)$이 있다. 구간 $-1\le x\le1$에서 정의된 곡선 $y=\sqrt{x+2}$ 위의 점 P에 대하여 $\theta=\angle\mathrm{APB}$라 할 때, $\tan^2\theta$의 최댓값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{11+5\sqrt{5}}{2}', equivalents: ['(11+5*sqrt(5))/2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\tan\theta=-\tan(\alpha+\beta)=\dfrac{2\sqrt{t+2}}{t^2+t+1}$, 임계점 $t=\frac{-3+\sqrt5}{2}$.
    steps:
    - {id: 2a, content: '$\tan^2\theta$ 최댓값 $=\left\{f\left(\frac{-3+\sqrt5}{2}\right)\right\}^2=\dfrac{11+5\sqrt5}{2}$', criteria: [2.B1, 2.R1, 2.B2]}
    hint_ladder:
    - 삼각형 APB의 밑변 양 끝 각을 $\alpha,\ \beta$라 하면 $\theta=\pi-\alpha-\beta$이다.
    - $\tan\alpha$, $\tan\beta$를 P의 $x$좌표 $t$로 나타내자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.53 [문제 3-2] 예시답안
    steps:
    - id: 2b-1
      content: |
        점 P의 좌표는 $(t,\sqrt{t+2})$라 하자. $\angle\mathrm{PAB}=\alpha$, $\angle\mathrm{PBA}=\beta$라 하면 $\tan\alpha=\dfrac{\sqrt{t+2}}{1+t}$, $\tan\beta=\dfrac{\sqrt{t+2}}{1-t}$이다.
        $\theta=\pi-\alpha-\beta$이므로 $\tan(\theta)=f(t)$라 하면 $f(t)=\dfrac{2\sqrt{t+2}}{t^2+t+1}$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        미분하면 $f'(t)=-\dfrac{3(t^2+3t+1)}{(t^2+t+1)^2\sqrt{t+2}}$이다. $t=\dfrac{-3\pm\sqrt5}{2}$에서 극값을 갖고 $\dfrac{-3-\sqrt5}{2}<-1<\dfrac{-3+\sqrt5}{2}<1$이므로 $t=\dfrac{-3+\sqrt5}{2}$에서 최댓값을 갖는다.
      criteria: [2.B1, 2.R1]
    - id: 2b-3
      content: |
        $\tan^2\theta$의 최댓값은 $\left\{f\left(\dfrac{-3+\sqrt5}{2}\right)\right\}^2=\dfrac{11+5\sqrt5}{2}$이다.
      criteria: [2.B2]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 2025 논술가이드북(자연) p.53 [문제 3-2] 별해 채점기준(별해 서술)
    key_idea: 코사인법칙으로 $\cos^2\theta$를 $t$의 식으로 쓰고 그 최솟값을 구한 뒤 $1+\tan^2\theta=\sec^2\theta$로 바꾼다.
    steps:
    - id: 2c-1
      content: |
        코사인 법칙을 이용하면 $t^2+t+1=\sqrt{t^2+3t+3}\sqrt{t^2-t+3}\cos\theta$이 된다. $\tan^2\theta$의 최댓값에서 $\cos^2\theta$는 최솟값을 갖는다. $\cos^2\theta=\dfrac{(t^2+t+1)^2}{(t^2+3t+3)(t^2-t+3)}$이고 미분하면 $t=\dfrac{-3\pm\sqrt5}{2}$에서 극값을 갖는다.
      criteria: [2.B1, 2.R1]
    - id: 2c-2
      content: |
        $\cos^2\theta$의 최솟값은 $\dfrac{2}{13+5\sqrt5}$이고 $1+\tan^2\theta=\sec^2\theta$을 이용하면 $\tan^2\theta$의 최댓값은 $\dfrac{11+5\sqrt5}{2}$이다.
      criteria: [2.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 8
      evidence: $f(t)=\dfrac{2\sqrt{t+2}}{t^2+t+1}$와 $f'(t)=-\dfrac{3(t^2+3t+1)}{(t^2+t+1)^2\sqrt{t+2}}$을 구했다.
      depends_on: []
      steps: [2b-1, 2b-2]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: $t=\frac{-3\pm\sqrt5}{2}$를 구하고 $t=\frac{-3+\sqrt5}{2}$에서 최댓값을 갖는다는 것을 보였다(구간 $[-1,1]$과 비교).
      depends_on: []
      steps: [2b-2]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: 최댓값 $\frac{11+5\sqrt5}{2}$을 구했다.
      depends_on: []
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4504}
  - {code: '71', misconception: MC-CAL-4503}
  misconceptions:
  - id: MC-CAL-4504
    outcome_code: '70'
    wrong_work: '$\theta=\alpha+\beta$로 두어 $\tan\theta=-\dfrac{2\sqrt{t+2}}{t^2+t+1}$의 부호가 반대가 되거나, $\tan\beta=\frac{\sqrt{t+2}}{t-1}$로 부호를 잘못 씀'
    detect_cue: $\tan\theta$가 음수로 나오거나 분모가 $t^2+t+1$이 아님
    feedback: 삼각형의 세 각의 합은 $\pi$이므로 $\theta=\pi-\alpha-\beta$, $\tan\theta=-\tan(\alpha+\beta)$입니다.
    remedy: [RL-2]
  - id: MC-CAL-4503
    outcome_code: '71'
    wrong_work: '두 임계점 $t=\frac{-3\pm\sqrt5}{2}$를 모두 후보로 두거나, 구간 $[-1,1]$ 밖의 점을 걸러내지 않음'
    detect_cue: $\frac{-3-\sqrt5}{2}$를 대입한 값 사용, 또는 끝점 $t=\pm1$ 검토 없음
    feedback: 정의역 $-1\le x\le1$ 안에 있는 임계점만 후보이고, 증감표로 최대임을 보이세요.
    remedy: [RL-3]

