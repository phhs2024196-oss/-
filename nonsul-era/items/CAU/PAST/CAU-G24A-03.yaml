intent: 곡선과 $x$축의 교점과 부호를 파악해 넓이를 정적분으로 세우고 치환적분으로 계산하는 능력(3-1), 곡선 위의 점이 두 정점과 이루는 각의 탄젠트를 함수로 세우고 미분으로 최댓값을 구하는 능력(3-2)을 본다(공식 해설 흐름에서 정리 — 공식 출제 의도 문서 없음).
key_idea: |
  (3-1) $t=\ln(x^2+1)$로 치환하면 $\dfrac{x}{x^2+1}dx=\dfrac12dt$, 피적분함수가 $(t-1)(t-5)$가 되어 교점 $t=1,5$에서 부호가 바뀐다. (3-2) $\mathrm{P}(t,\sqrt{t+2})$에서 $\theta=\pi-\alpha-\beta$로 두면 $\tan\theta=\dfrac{2\sqrt{t+2}}{t^2+t+1}$.
stuck: (3-1) 피적분함수를 $\ln(x^2+1)$의 이차식으로 보고 $x$축 아래 부분(1≤t≤5)을 빼는 것 / (3-2) 각 APB를 밑변 양 끝 각 $\alpha,\ \beta$로 나타내는 발상
idea_tags: [IDEA-SUBST-LOG-QUADRATIC, IDEA-ANGLE-SPLIT-TAN-ADD]
tags: [넓이, 치환적분, 탄젠트 덧셈정리, 최대·최소, 중앙대 실전]
elements:
  materials:
  - '$x\ge0$에서 정의된 곡선 $y=\dfrac{x}{x^2+1}\left(\{\ln(x^2+1)\}^2-6\ln(x^2+1)+5\right)$와 $x$축으로 둘러싸인 도형'
  - '점 $\mathrm{A}(-1,0)$, $\mathrm{B}(1,0)$, 곡선 $y=\sqrt{x+2}$ ($-1\le x\le1$) 위의 점 P'
  - '$\theta=\angle\mathrm{APB}$, $\tan^2\theta$의 최댓값'
  concepts: [절댓값의 정적분과 넓이, 치환적분법, 로그함수의 미분, 탄젠트 덧셈정리, 극값과 최댓값]
  tools:
  - '$(\ln(x^2+1)-1)(\ln(x^2+1)-5)$로 인수분해해 교점 $x=0,\sqrt{e-1},\sqrt{e^5-1}$'
  - '$t=\ln(x^2+1)$ 치환으로 $\frac12\int(t^2-6t+5)\,dt$'
  - '$\tan\alpha=\dfrac{\sqrt{t+2}}{1+t}$, $\tan\beta=\dfrac{\sqrt{t+2}}{1-t}$, $\tan\theta=-\tan(\alpha+\beta)$'
  - '$f''(t)=-\dfrac{3(t^2+3t+1)}{(t^2+t+1)^2\sqrt{t+2}}$의 부호'
  conditions:
  - '$x\ge0$ ⇒ $\frac{x}{x^2+1}\ge0$, 부호는 $(t-1)(t-5)$가 결정 ⇒ $0\le t\le1$에서 $y\ge0$, $1\le t\le5$에서 $y\le0$'
  - '닫힌 도형은 $0\le x\le\sqrt{e^5-1}$ 부분'
  - '$-1\le x\le1$ ⇒ 임계점 $t=\frac{-3+\sqrt5}{2}$만 구간 안($\frac{-3-\sqrt5}{2}<-1$)'
  stimuli_used: ['1', '2', '3', '4']
  subpart_links: 3-1·3-2 는 독립. 3-1 은 제시문 1(넓이)·2(치환적분), 3-2 는 제시문 3(극값)·4(탄젠트 덧셈정리)를 쓴다.

