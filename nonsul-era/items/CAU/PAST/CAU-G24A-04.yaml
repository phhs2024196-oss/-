stimuli:
- label: '1'
  body: |
    삼각형 ABC의 외접원의 반지름의 길이를 $R$라 하면 $\dfrac{a}{\sin A}=\dfrac{b}{\sin B}=\dfrac{c}{\sin C}=2R$이다.
- label: '2'
  body: |
    삼각형 ABC에서 $a^2=b^2+c^2-2bc\cos A$이다.
- label: '3'
  body: |
    평면 위의 한 점 F와 이 점을 지나지 않는 직선 $l$이 주어질 때, 점 F와 직선 $l$에 이르는 거리가 같은 점들의 집합을 포물선이라 한다.
- label: '4'
  body: |
    이차방정식 $ax^2+bx+c=0$의 두 근을 $\alpha,\ \beta$라 하면 $\alpha+\beta=-\dfrac ba$이고 $\alpha\beta=\dfrac ca$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    오른쪽 그림과 같이 모든 모서리의 길이가 2인 정삼각기둥에서 두 선분 AC, BE의 중점을 각각 M, N이라 하고, 두 선분 MN, CN의 중점을 각각 P, Q라 하자. 삼각형 PFQ의 외접원의 반지름의 길이를 구하시오. [15점]

    [그림: 윗면 삼각형 ABC, 아랫면 삼각형 DEF인 정삼각기둥(A 아래 D, B 아래 E, C 아래 F; 앞쪽 옆면 BCFE가 정사각형으로 보임). AC의 중점 M, BE의 중점 N, 선분 MN·CN과 그 중점 P·Q, 점 F에서 P·Q로 그은 선분과 색칠된 삼각형 PFQ]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{\sqrt{39}}{6}', equivalents: ['sqrt(39)/6', 'sqrt(13)/(2*sqrt(3))'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{PQ}}=\frac12$, $\overline{\mathrm{PF}}=2$, $\overline{\mathrm{QF}}=\frac{\sqrt{13}}{2}$에서 $\cos\angle\mathrm{QPF}=\frac12$.
    steps:
    - {id: 1a, content: '$2R=\dfrac{\sqrt{13}/2}{\sqrt3/2}$ ⇒ $R=\dfrac{\sqrt{39}}{6}$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 삼각형 CMN에서 중점 P, Q를 이으면 $\overline{\mathrm{PQ}}=\frac12\overline{\mathrm{MC}}$이다.
    - $\overline{\mathrm{MF}}$와 $\overline{\mathrm{NF}}$를 비교해 보자.
    - 세 변을 알면 코사인법칙으로 한 각, 사인법칙으로 외접원의 반지름.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.54 [문제 4-1] 예시답안
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{PQ}}=\dfrac12\overline{\mathrm{MC}}=\dfrac12$
        직각삼각형 MBN에서 $\overline{\mathrm{MN}}=\sqrt{\overline{\mathrm{MB}}^2+\overline{\mathrm{BN}}^2}=\sqrt{3+1}=2$이다. 직각삼각형 FCM과 NEF에서 $\overline{\mathrm{MF}}=\sqrt{\overline{\mathrm{MC}}^2+\overline{\mathrm{FC}}^2}=\sqrt5$와 $\overline{\mathrm{NF}}=\sqrt{\overline{\mathrm{NE}}^2+\overline{\mathrm{EF}}^2}=\sqrt5$이므로 삼각형 FMN은 이등변삼각형이고 삼각형 MPF는 직각삼각형이다. 직각삼각형 MPF에서 $\overline{\mathrm{PF}}=\sqrt{\overline{\mathrm{MF}}^2-\overline{\mathrm{MP}}^2}=2$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        점 Q에서 선분 EF에 내린 수선의 발을 R이라 할 때, $\overline{\mathrm{QR}}=\dfrac32$이고 삼각형 QRF는 직각삼각형이므로 $\overline{\mathrm{QF}}=\sqrt{\overline{\mathrm{QR}}^2+\overline{\mathrm{RF}}^2}=\dfrac{\sqrt{13}}{2}$
        [그림: 정삼각기둥에서 Q로부터 모서리 EF에 내린 수선의 발 R 표시]
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $\theta=\angle\mathrm{QPF}$라 하면 삼각형 QPF에서 코사인법칙에 의하여
        $$\cos\theta=\frac{\frac14+4-\frac{13}{4}}{2\times\frac12\times2}=\frac12\ \text{이므로}\ \sin\theta=\frac{\sqrt3}{2}\ \text{이다.}$$
        외접원의 반지름의 길이를 $R$라 하면 사인법칙에 의하여
        $$2R=\frac{\frac{\sqrt{13}}{2}}{\frac{\sqrt3}{2}}=\frac{\sqrt{13}}{\sqrt3}\ \text{이므로}\ R=\frac{\sqrt{13}}{2\sqrt3}=\frac{\sqrt{39}}{6}$$
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: $\overline{\mathrm{PF}}=2$를 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: $\overline{\mathrm{QF}}=\frac{\sqrt{13}}{2}$을 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: $R=\frac{\sqrt{39}}{6}$를 구했다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4514}
  misconceptions:
  - id: MC-GEO-4514
    outcome_code: '70'
    wrong_work: '$\overline{\mathrm{QF}}$를 옆면 위 거리처럼 $\sqrt{1^2+\left(\frac12\right)^2}$로 계산하거나, $\overline{\mathrm{PF}}$를 직각 여부 확인 없이 구함'
    detect_cue: $\overline{\mathrm{QF}}\ne\frac{\sqrt{13}}{2}$ 또는 $\overline{\mathrm{PF}}\ne2$
    feedback: 공간의 선분은 수직인 두 선분(예 QR ⊥ RF)을 찾아 직각삼각형으로 계산하세요. Q는 CN의 중점이므로 높이 $\overline{\mathrm{QR}}=\frac32$, $\overline{\mathrm{RF}}=1$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    아래의 그림과 같이 포물선 $y^2=4x$의 초점 $\mathrm{F}(1,0)$을 지나고 $m>0$인 직선 $y=m(x-1)$이 서로 다른 두 점 P, Q에서 포물선과 만난다. 두 점 P, Q에서 준선 $x=-1$에 내린 수선의 발을 각각 P′, Q′이라 하자. 사각형 PP′Q′Q의 둘레의 길이가 40일 때, 이 사각형의 넓이를 구하시오. [15점]

    [그림: 포물선 $y^2=4x$와 직선 $y=m(x-1)$이 제1사분면의 P, 제4사분면의 Q에서 만나고, 준선 $x=-1$ 위의 수선의 발 P′, Q′이 직각 표시와 함께 그려짐]
  points: 15
  depends_on: []
  answer: {kind: value, value: '64', equivalents: ['64'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{PQ}}=\frac{4(m^2+1)}{m^2}$, $\overline{\mathrm{P'Q'}}=4\sqrt{\frac{m^2+1}{m^2}}$, 둘레 $=2\overline{\mathrm{PQ}}+\overline{\mathrm{P'Q'}}$.
    steps:
    - {id: 2a, content: '$8r^2+4r=40$ ⇒ $r=2$, $m^2=\frac13$ ⇒ $S=\frac12\cdot8\cdot16=64$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - $\overline{\mathrm{PP'}}+\overline{\mathrm{QQ'}}$은 포물선의 정의로 무엇과 같은가?
    - 두 교점의 $x$좌표의 합은 근과 계수의 관계로 구할 수 있다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.55 [문제 4-2] 예시답안
    steps:
    - id: 2b-1
      content: |
        $y^2=4x$에 $y=m(x-1)$을 대입하고 정리해 얻은 이차방정식 $m^2x^2-2(m^2+2)x+m^2=0$의 두 근을 $\alpha,\ \beta$라 하면 $\alpha+\beta=\dfrac{2(m^2+2)}{m^2}$이다. 그리고
        $$\overline{\mathrm{PQ}}=\overline{\mathrm{PF}}+\overline{\mathrm{FQ}}=\overline{\mathrm{PP'}}+\overline{\mathrm{QQ'}}=(\alpha+1)+(\beta+1)=\frac{4(m^2+1)}{m^2}\ \text{이다.}$$
      criteria: [2.B1]
    - id: 2b-2
      content: |
        점 P에서 직선 QQ′에 내린 수선의 발을 R이라 하고 각 PQR을 $\theta$라 하면,
        $$\overline{\mathrm{P'Q'}}=\overline{\mathrm{PR}}=\tan\theta\,\overline{\mathrm{QR}}=m\sqrt{\overline{\mathrm{PQ}}^2-\overline{\mathrm{PR}}^2}=m\sqrt{\overline{\mathrm{PQ}}^2-\overline{\mathrm{P'Q'}}^2}\ \text{이므로}$$
        $$\overline{\mathrm{P'Q'}}=\sqrt{\frac{m^2}{m^2+1}}\,\overline{\mathrm{PQ}}=4\sqrt{\frac{m^2+1}{m^2}}$$
      criteria: [2.B2]
    - id: 2b-3
      content: |
        사각형 PP′Q′Q의 둘레의 길이 $l$은
        $$l=\overline{\mathrm{PQ}}+\overline{\mathrm{PP'}}+\overline{\mathrm{QQ'}}+\overline{\mathrm{P'Q'}}=2\overline{\mathrm{PQ}}+\overline{\mathrm{P'Q'}}=\frac{8(m^2+1)}{m^2}+4\sqrt{\frac{m^2+1}{m^2}}=40$$
      criteria: [2.B2]
    - id: 2b-4
      content: |
        $r=\sqrt{\dfrac{m^2+1}{m^2}}$라 놓아 얻은 이차방정식 $8r^2+4r=40$에서 $r>0$이므로 $r=\sqrt{\dfrac{m^2+1}{m^2}}=2$
        따라서 $m^2=\dfrac13$이고 사각형 PP′Q′Q의 넓이 $S$는
        $$S=\frac12\overline{\mathrm{P'Q'}}\cdot(\overline{\mathrm{PP'}}+\overline{\mathrm{QQ'}})=\frac12\overline{\mathrm{P'Q'}}\cdot\overline{\mathrm{PQ}}=\frac12\cdot8\cdot16=64$$
        [그림: 문제 그림에 P에서 직선 QQ′에 내린 수선의 발 R을 추가]
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: $\overline{\mathrm{PQ}}=\dfrac{4(m^2+1)}{m^2}$을 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: 방정식 $\dfrac{8(m^2+1)}{m^2}+4\sqrt{\dfrac{m^2+1}{m^2}}=40$을 찾았다.
      depends_on: []
      steps: [2b-2, 2b-3]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: 사각형 PP′Q′Q의 넓이 64를 구했다.
      depends_on: []
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 사각형 PP′Q′Q의 넓이를 64 이외의 것을 더 찾음(공식 채점기준)
      effect: minus
      value: 2
    - code: D2-2
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4515}
  misconceptions:
  - id: MC-GEO-4515
    outcome_code: '70'
    wrong_work: '$\overline{\mathrm{PP''}}=\alpha$, $\overline{\mathrm{QQ''}}=\beta$로 두어 $\overline{\mathrm{PQ}}=\alpha+\beta$(준선까지 거리 $+1$ 누락)'
    detect_cue: $\overline{\mathrm{PQ}}=\frac{2(m^2+2)}{m^2}$ 사용
    feedback: P에서 준선 $x=-1$까지의 거리는 $\alpha-(-1)=\alpha+1$입니다. 포물선의 정의로 $\overline{\mathrm{PF}}=\overline{\mathrm{PP'}}$를 쓰세요.
    remedy: [RL-2]

