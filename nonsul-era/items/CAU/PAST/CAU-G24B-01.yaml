stimuli: []

stem: |
  좌표평면의 원점 O에 있는 점 A는 다음과 같은 규칙에 따라 이동한다.

  - 주머니에 숫자 2가 적힌 공 1개와 숫자 3이 적힌 공 1개가 들어 있다.
  - 주머니에서 임의로 1개의 공을 꺼낸 후 그 공에 적힌 숫자를 $m$이라 하자. 점 A는 $\dfrac1m$의 확률로 원점 O와 점 $\mathrm{P}(12,0)$을 이은 선분 OP를 $m:1$로 내분하는 점으로 이동하거나, $1-\dfrac1m$의 확률로 선분 OP를 $1:m$으로 외분하는 점으로 이동한다. 이때 이동한 점을 $\mathrm{A}_1(x_1,0)$이라 하고, 꺼낸 공은 다시 집어넣지 않는다.
  - 주머니에 남아 있는 공에 적힌 숫자를 $n$이라 하자. 점 $\mathrm{A}_1$은 $\dfrac2n$의 확률로 점 $\mathrm{A}_1$과 점 $\mathrm{Q}(x_1,8)$을 이은 선분 $\mathrm{A_1Q}$를 $1:n$으로 내분하는 점으로 이동하거나, $1-\dfrac2n$의 확률로 선분 $\mathrm{A_1Q}$를 $n:1$로 외분하는 점으로 이동한다. 이때 이동한 점을 $\mathrm{A}_2(x_1,y_1)$이라 한다.

  두 점 $\mathrm{A}_2(x_1,y_1)$, $\mathrm{P}(12,0)$ 사이의 거리가 $\lvert x_1\rvert$보다 작을 확률을 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    두 점 $\mathrm{A}_2(x_1,y_1)$, $\mathrm{P}(12,0)$ 사이의 거리가 $\lvert x_1\rvert$보다 작을 확률을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac{1}{3}', equivalents: ['1/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 도착점과 확률은 $(8,2)\frac16$, $(8,12)\frac{1}{12}$, $(-12,2)\frac16$, $(-12,12)\frac{1}{12}$, $\left(9,\frac83\right)\frac16$, $\left(-6,\frac83\right)\frac13$.
    steps:
    - {id: 1a, content: '조건을 만족하는 것은 $\mathrm{A}_2(8,2)$, $\mathrm{A}_2\left(9,\frac83\right)$ ⇒ $\dfrac16+\dfrac16=\dfrac13$', criteria: [1.B1, 1.B2, 1.B3, 1.B4, 1.B5, 1.B6, 1.B7]}
    hint_ladder:
    - 먼저 꺼낸 공이 2인 경우와 3인 경우로 나누자.
    - $n=2$이면 외분할 확률 $1-\frac2n$은 얼마인가?
    - 도착점마다 P까지의 거리와 $\lvert x_1\rvert$를 비교하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.60~61 [문제 1] 예시답안
    steps:
    - id: 1b-1
      content: |
        (1) 선분의 내분점과 외분점은 다음과 같이 정의된다.
        - 좌표평면 위의 두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$를 이은 선분 AB를 $m:n$으로 내분하는 점의 좌표는 $\left(\dfrac{mx_2+nx_1}{m+n},\ \dfrac{my_2+ny_1}{m+n}\right)$이다. $(m>0,\ n>0)$
        - 선분 AB를 $m:n$으로 외분하는 점의 좌표는 $\left(\dfrac{mx_2-nx_1}{m-n},\ \dfrac{my_2-ny_1}{m-n}\right)$이다. $(m>0,\ n>0,\ m\ne n)$
      criteria: []
    - id: 1b-2
      content: |
        (2) 일반적으로 $(m,n)$인 경우 $\mathrm{A}_1(x_1,0)$과 $\mathrm{A}_2(x_1,y_1)$은 다음과 같이 계산할 수 있다.

        | 선분 OP | $\mathrm{A}_1(x_1,0)$ | 확률 | 선분 $\mathrm{A_1Q}$ | $\mathrm{A}_2(x_1,y_1)$ | 확률 |
        |---|---|---|---|---|---|
        | $m:1$로 내분 | $\left(\frac{12m}{m+1},0\right)$ | $\frac1m$ | $1:n$으로 내분 | $\left(x_1,\frac{8}{1+n}\right)$ | $\frac2n$ |
        | $1:m$로 외분 | $\left(\frac{12}{1-m},0\right)$ | $1-\frac1m$ | $n:1$로 외분 | $\left(x_1,\frac{8n}{n-1}\right)$ | $1-\frac2n$ |
      criteria: []
    - id: 1b-3
      content: |
        (3) $m=2,\ n=3$인 경우
        - 선분 OP를 $2:1$로 내분한 점은 $(8,0)$이고, $1:2$로 외분한 점은 $(-12,0)$이다. 즉, 점 A는 $\frac12$의 확률로 $\mathrm{A}_1(8,0)$으로 이동하거나, $\frac12$의 확률로 $\mathrm{A}_1(-12,0)$으로 이동한다.
        - 점 $\mathrm{A}_1(8,0)$일 때, 선분 $\mathrm{A_1Q}$를 $1:3$으로 내분한 점은 $(8,2)$이고, $3:1$로 외분한 점은 $(8,12)$이다. 즉, 점 $\mathrm{A}_1$은 $\frac23$의 확률로 $\mathrm{A}_2(8,2)$로 이동하거나, $\frac13$의 확률로 $\mathrm{A}_2(8,12)$로 이동한다.
        - 점 $\mathrm{A}_1(-12,0)$일 때, 점 $\mathrm{A}_1$은 $\frac23$의 확률로 $\mathrm{A}_2(-12,2)$로 이동하거나, $\frac13$의 확률로 $\mathrm{A}_2(-12,12)$로 이동한다.
      criteria: [1.B1, 1.B2]
    - id: 1b-4
      content: |
        (4) $m=3,\ n=2$인 경우
        - 선분 OP를 $3:1$로 내분한 점은 $(9,0)$이고, $1:3$으로 외분한 점은 $(-6,0)$이다. 즉, 점 A는 $\frac13$의 확률로 $\mathrm{A}_1(9,0)$으로 이동하거나, $\frac23$의 확률로 $\mathrm{A}_1(-6,0)$으로 이동한다.
        - 점 $\mathrm{A}_1(9,0)$일 때, 선분 $\mathrm{A_1Q}$를 $1:2$로 내분한 점은 $\left(9,\frac83\right)$이고, $2:1$로 외분한 점은 $(9,16)$이다. 즉, 점 $\mathrm{A}_1$은 1의 확률로 $\mathrm{A}_2\left(9,\frac83\right)$로 이동한다.
        - 점 $\mathrm{A}_1(-6,0)$일 때, 점 $\mathrm{A}_1$은 1의 확률로 $\mathrm{A}_2\left(-6,\frac83\right)$로 이동한다.
      criteria: [1.B4, 1.B5]
    - id: 1b-5
      content: |
        (5) 모든 경우를 고려하여 계산한 확률은 다음과 같이 나타낼 수 있다.

        | $m,n$ | 확률 | $\mathrm{A}_1(x_1,0)$ | 확률 | $\mathrm{A}_2(x_1,y_1)$ | 확률 | $\mathrm{A}\to\mathrm{A}_1\to\mathrm{A}_2$일 확률 |
        |---|---|---|---|---|---|---|
        | $m=2,\ n=3$ | $\frac12$ | $\mathrm{A}_1(8,0)$ | $\frac12$ | $\mathrm{A}_2(8,2)$ | $\frac23$ | $\frac12\times\frac12\times\frac23=\frac16$ |
        | | | | | $\mathrm{A}_2(8,12)$ | $\frac13$ | $\frac12\times\frac12\times\frac13=\frac{1}{12}$ |
        | | | $\mathrm{A}_1(-12,0)$ | $\frac12$ | $\mathrm{A}_2(-12,2)$ | $\frac23$ | $\frac12\times\frac12\times\frac23=\frac16$ |
        | | | | | $\mathrm{A}_2(-12,12)$ | $\frac13$ | $\frac12\times\frac12\times\frac13=\frac{1}{12}$ |
        | $m=3,\ n=2$ | $\frac12$ | $\mathrm{A}_1(9,0)$ | $\frac13$ | $\mathrm{A}_2\left(9,\frac83\right)$ | 1 | $\frac12\times\frac13=\frac16$ |
        | | | | | $\mathrm{A}_2(9,16)$ | 0 | 0 |
        | | | $\mathrm{A}_1(-6,0)$ | $\frac23$ | $\mathrm{A}_2\left(-6,\frac83\right)$ | 1 | $\frac12\times\frac23=\frac13$ |
        | | | | | $\mathrm{A}_2(-6,16)$ | 0 | 0 |
      criteria: [1.B3, 1.B6]
    - id: 1b-6
      content: |
        (6) 두 점 $\mathrm{A}_2$와 점 P 사이의 거리는 거리 공식을 통해서 다음과 같이 계산할 수 있고, $\lvert x_1\rvert$보다 작은 경우는 $\mathrm{A}_2(8,2)$와 $\mathrm{A}_2\left(9,\frac83\right)$이며 그때의 확률은 $\frac16+\frac16=\frac13$이다.

        | $\mathrm{A}_2(x_1,y_1)$ | 확률 | $\lvert x_1\rvert$ | 점 $\mathrm{A}_2$와 점 P 사이의 거리 | $\lvert x_1\rvert>$ 거리 |
        |---|---|---|---|---|
        | $\mathrm{A}_2(8,2)$ | $\frac16$ | 8 | $\sqrt{4^2+2^2}=\sqrt{20}$ | O |
        | $\mathrm{A}_2(8,12)$ | $\frac{1}{12}$ | 8 | $\sqrt{4^2+12^2}=\sqrt{160}$ | X |
        | $\mathrm{A}_2(-12,2)$ | $\frac16$ | 12 | $\sqrt{24^2+2^2}=\sqrt{580}$ | X |
        | $\mathrm{A}_2(-12,12)$ | $\frac{1}{12}$ | 12 | $\sqrt{24^2+12^2}=\sqrt{720}$ | X |
        | $\mathrm{A}_2\left(9,\frac83\right)$ | $\frac16$ | 9 | $\sqrt{3^2+\left(\frac83\right)^2}=\sqrt{\frac{145}{9}}$ | O |
        | $\mathrm{A}_2\left(-6,\frac83\right)$ | $\frac13$ | 6 | $\sqrt{18^2+\left(\frac83\right)^2}=\sqrt{324+\frac{64}{9}}$ | X |

        ※ 확률이 0인 $\mathrm{A}_2(9,16)$과 $\mathrm{A}_2(-6,16)$의 경우는 거리 계산에서 제외하였다.
      criteria: [1.B7]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $m=2,\ n=3$인 경우 점 $\mathrm{A}_1$의 좌표 $(8,0)$, $(-12,0)$을 정확히 계산했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: $m=2,\ n=3$인 경우 점 $\mathrm{A}_2$의 좌표 $(8,2)$, $(8,12)$, $(-12,2)$, $(-12,12)$를 정확히 계산했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: $m=2,\ n=3$인 경우 $\mathrm{A}_1$과 $\mathrm{A}_2$가 일어날 확률과 $\mathrm{A}\to\mathrm{A}_1\to\mathrm{A}_2$일 확률($\frac16,\frac{1}{12},\frac16,\frac{1}{12}$)을 정확히 계산했다.
      depends_on: []
      steps: [1b-5]
    - id: 1.B4
      mark_type: B
      points: 3
      evidence: $m=3,\ n=2$인 경우 점 $\mathrm{A}_1$의 좌표 $(9,0)$, $(-6,0)$을 정확히 계산했다.
      depends_on: []
      steps: [1b-4]
    - id: 1.B5
      mark_type: B
      points: 3
      evidence: $m=3,\ n=2$인 경우 점 $\mathrm{A}_2$의 좌표 $\left(9,\frac83\right)$, $\left(-6,\frac83\right)$(및 확률 0인 외분점)을 정확히 계산했다.
      depends_on: []
      steps: [1b-4]
    - id: 1.B6
      mark_type: B
      points: 2
      evidence: $m=3,\ n=2$인 경우 $\mathrm{A}_1$과 $\mathrm{A}_2$가 일어날 확률과 $\mathrm{A}\to\mathrm{A}_1\to\mathrm{A}_2$일 확률($\frac16$, 0, $\frac13$, 0)을 정확히 계산했다.
      depends_on: []
      steps: [1b-5]
    - id: 1.B7
      mark_type: B
      points: 4
      evidence: 두 점 사이의 거리를 정확히 계산하고 $\lvert x_1\rvert$와 정확히 비교해서 정답 $\frac13$을 찾아냈다.
      depends_on: []
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
