  misconceptions:
  - id: MC-GEO-4516
    outcome_code: '70'
    wrong_work: '선분 OP를 $1:2$로 외분한 점을 $(12,0)$이나 $(24,0)$으로, $\mathrm{A_1Q}$를 $3:1$로 외분한 점을 $(8,-4)$ 등으로 계산'
    detect_cue: $\mathrm{A}_1$ 외분점이 $(-12,0)$, $(-6,0)$이 아님
    feedback: $m:n$ 외분점은 $\frac{mx_2-nx_1}{m-n}$입니다. $1:2$ 외분이면 $\frac{1\cdot12-2\cdot0}{1-2}=-12$처럼 분모 부호에 주의하세요.
    remedy: [RL-1]
  - id: MC-PRB-4523
    outcome_code: '71'
    wrong_work: '$n=2$일 때도 외분 이동을 확률 $\frac12$ 등으로 넣거나, 첫 이동의 확률 $\frac1m$과 $1-\frac1m$을 내분·외분에 뒤바꿔 배정'
    detect_cue: $\mathrm{A}_2(9,16)$ 또는 $(-6,16)$에 양의 확률, 또는 경로 확률의 합이 1이 아님
    feedback: $n=2$이면 $\frac2n=1$이므로 반드시 내분점으로 갑니다. 경로 확률을 모두 더해 1이 되는지 확인하세요.
    remedy: [RL-2]

