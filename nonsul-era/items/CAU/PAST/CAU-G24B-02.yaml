intent: 정적분으로 정의된 함수를 미분해 극값 후보를 찾고 증감과 기함수의 대칭성으로 최댓값을 구하는 능력(2-1), 매개변수로 나타낸 점의 속력을 정리하고 치환적분으로 움직인 거리를 구하는 능력(2-2)을 본다(공식 해설 흐름에서 정리 — 공식 출제 의도 문서 없음).
key_idea: |
  (2-1) $f'(x)=(x^2+5)\left\{1-2\sin\frac{\pi x}{x^2+5}\right\}$에서 $\left\lvert\frac{\pi x}{x^2+5}\right\rvert<\frac{\pi}{4}$이므로 $\frac{\pi x}{x^2+5}=\frac{\pi}{6}$, 즉 $x=1,5$만 후보이고, $(x^2+5)\sin\frac{\pi x}{x^2+5}$가 기함수라 $f(1)=\int_{-1}^1(t^2+5)\,dt$. (2-2) 속력 $=\dfrac{\sin t(10-\sin^2t)}{\sqrt3(8+\sin^2t)}$, $u=\cos t$로 $\frac{2}{\sqrt3}\int_0^1\frac{9+u^2}{9-u^2}du$.
stuck: (2-1) 산술·기하평균으로 $\left\lvert\frac{\pi x}{x^2+5}\right\rvert\le\frac{\pi}{2\sqrt5}<\frac{\pi}{4}$를 보여 $\frac{5\pi}{6}$ 쪽 해를 배제하는 것과 기함수 적분 0 / (2-2) 근호 안 $(8+\sin^2t)^2+36\cos^2t=(10-\sin^2t)^2$ 정리
idea_tags: [IDEA-FTC-SIGN-ANALYSIS, IDEA-ODD-FUNCTION-INTEGRAL, IDEA-SPEED-PERFECT-SQUARE]
tags: [정적분으로 정의된 함수, 최댓값, 기함수, 속력과 거리, 치환적분, 중앙대 실전]
elements:
  materials:
  - '$[-1,5]$에서 $f(x)=\displaystyle\int_{-1}^x(t^2+5)\left\{1-2\sin\left(\frac{\pi t}{t^2+5}\right)\right\}dt$'
  - '점 P의 위치 $x=\frac{1}{\sqrt3}\cos t$, $y=\sqrt3\ln\left(1+\frac{\sin^2t}{8}\right)$, $0\le t\le\pi$'
  concepts: [정적분으로 정의된 함수의 미분, 극값과 증감, 기함수의 정적분, 매개변수로 나타낸 곡선의 속력, 움직인 거리, 치환적분, 부분분수]
  tools:
  - '$\frac{\pi x}{x^2+5}=\frac{\pi}{6}+2n\pi,\ \frac{5\pi}{6}+2n\pi$ 후보 정리'
  - '$\lvert x\rvert+\frac{5}{\lvert x\rvert}\ge2\sqrt5$로 범위 제한'
  - '$g(x)=1-2\sin\frac{\pi x}{x^2+5}$의 증감으로 $f''$ 부호 판정'
  - '$(x^2+5)\sin\frac{\pi x}{x^2+5}$의 기함수 성질'
  - '$u=\cos t$ 치환, $\frac{9+u^2}{9-u^2}=-1+\frac{3}{3-u}+\frac{3}{3+u}$'
  conditions:
  - '$x\ne0$ ⇒ $\left\lvert\frac{\pi x}{x^2+5}\right\rvert\le\frac{\pi}{2\sqrt5}<\frac{\pi}{4}$ ⇒ $\sin\frac{\pi x}{x^2+5}=\frac12$ 은 $\frac{\pi x}{x^2+5}=\frac{\pi}{6}$ 만'
  - '$g(1)=g(5)=0$, $g$는 $(-1,\sqrt5)$에서 감소·$(\sqrt5,5)$에서 증가 ⇒ $(-1,1)$에서 $f$ 증가, $(1,5)$에서 감소'
  - '$0\le t\le\pi$ ⇒ $\sin t\ge0$ 이므로 근호를 벗길 때 부호 그대로'
  stimuli_used: ['1', '2', '3', '4', '5']
  subpart_links: 2-1·2-2 는 독립. 2-1 은 제시문 1~3, 2-2 는 제시문 4(움직인 거리)·5(치환적분)를 쓴다.

