stimuli:
- label: '1'
  body: |
    함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때 다음 식이 성립한다.
    $$\frac{d}{dx}\int_a^xf(t)\,dt=f(x)\qquad(\text{단, }a<x<b)$$
- label: '2'
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능하고 $x=a$에서 극값을 가지면 $f'(a)=0$이다.
- label: '3'
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능할 때, 그 구간에 속하는 모든 $x$에 대하여 $f'(x)>0$이면 $f(x)$는 그 구간에서 증가하고, $f'(x)<0$이면 $f(x)$는 그 구간에서 감소한다.
- label: '4'
  body: |
    좌표평면 위를 움직이는 점 $\mathrm{P}(x,y)$의 시각 $t$에서의 위치가 함수 $x=f(t)$, $y=g(t)$로 나타내어질 때, $t=a$에서 $t=b$까지 점 P가 움직인 거리는 $s=\displaystyle\int_a^b\sqrt{\{f'(t)\}^2+\{g'(t)\}^2}\,dt$이다.
- label: '5'
  body: |
    미분가능한 함수 $g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속이고, $g(a)=\alpha$, $g(b)=\beta$에 대하여 함수 $f(x)$가 $\alpha$와 $\beta$를 양끝으로 하는 닫힌구간에서 연속일 때 다음 식이 성립한다.
    $$\int_a^bf(g(x))g'(x)\,dx=\int_\alpha^\beta f(t)\,dt$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    닫힌구간 $[-1,5]$에서 함수
    $$f(x)=\int_{-1}^{x}(t^2+5)\left\{1-2\sin\left(\frac{\pi t}{t^2+5}\right)\right\}dt$$
    의 최댓값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{32}{3}', equivalents: ['32/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=0$은 $x=1,5$뿐이고 $x=1$에서 최대. 사인 항은 기함수라 $[-1,1]$에서 적분이 0.
    steps:
    - {id: 1a, content: '$f(1)=\int_{-1}^1(t^2+5)\,dt=\dfrac{32}{3}$', criteria: [1.B1, 1.R1, 1.B2]}
    hint_ladder:
    - $f'(x)$는 피적분함수에 $x$를 넣은 것이다. $\sin(\cdot)=\frac12$이 되는 $x$를 찾자.
    - $\frac{\pi x}{x^2+5}$가 가질 수 있는 값의 범위를 산술·기하평균으로 제한하자.
    - $(t^2+5)\sin\frac{\pi t}{t^2+5}$는 기함수이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.62 [문제 2-1] 예시답안
    steps:
    - id: 1b-1
      content: |
        $f'(x)=(x^2+5)\left\{1-2\sin\left(\dfrac{\pi x}{x^2+5}\right)\right\}$이므로 $f(x)$는 $\dfrac{\pi x}{x^2+5}=\dfrac{\pi}{6}+2n\pi$, $\dfrac{\pi x}{x^2+5}=\dfrac{5\pi}{6}+2n\pi$일 때, 극값을 가질 수 있다. 하지만 $f'(0)\ne0$이고, $x\ne0$일 때
        $$\left\lvert\frac{\pi x}{x^2+5}\right\rvert=\frac{\pi}{\lvert x\rvert+\frac{5}{\lvert x\rvert}}\le\frac{\pi}{2\sqrt5}<\frac{\pi}{4}\ \text{이므로,}$$
        $\dfrac{\pi x}{5+x^2}=\dfrac{\pi}{6}$인 경우, 즉 $x=1,5$일 때, 극값을 가진다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        도함수 $f'(x)$의 부호를 조사하기 위해, $g(x)=1-2\sin\left(\dfrac{\pi x}{x^2+5}\right)$라 정의하고 이 함수의 도함수 $g'(x)=2\cos\left(\dfrac{\pi x}{x^2+5}\right)\dfrac{\pi(x^2-5)}{(x^2+5)^2}$를 구한다. 이로부터 $g(x)$가 구간 $(-1,\sqrt5)$에서 감소하고, 구간 $(\sqrt5,5)$에서는 증가한다는 것을 알 수 있다. 그런데 $g(1)=g(5)=0$이므로, 구간 $(-1,1)$에서 $g(x)>0$이고 $f(x)$는 증가하며, 구간 $(1,5)$에서는 $g(x)<0$이고 $f(x)$는 감소한다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        따라서 $x=1$일 때 $f(x)$는 최댓값을 가진다. 마지막으로 $(x^2+5)\sin\left(\dfrac{\pi x}{x^2+5}\right)$의 그래프의 형태를 생각해보면 정적분 $\displaystyle\int_{-1}^{1}(x^2+5)\sin\left(\frac{\pi x}{x^2+5}\right)dx=0$이라는 것을 알 수 있다.
        따라서, 최댓값은 $f(1)=\displaystyle\int_{-1}^{1}(t^2+5)\,dt=\frac{32}{3}$이다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $x=1,\ 5$일 때 $f'(x)=0$인 것을 확인했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: $f(x)$의 증가, 감소 구간을 조사하여 $f(1)$이 최대라는 것을 보였다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: $f(1)=\frac{32}{3}$를 구했다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4517}
  misconceptions:
  - id: MC-CAL-4517
    outcome_code: '70'
    wrong_work: '$f(1)$을 구하려고 $\int_{-1}^1(t^2+5)\sin\frac{\pi t}{t^2+5}dt$를 직접 적분하려다 막히거나 근삿값으로 처리'
    detect_cue: 최댓점 $x=1$은 맞으나 값이 $\frac{32}{3}$이 아님, 또는 적분을 남겨 둔 채 끝냄
    feedback: $h(t)=(t^2+5)\sin\frac{\pi t}{t^2+5}$는 $h(-t)=-h(t)$인 기함수이므로 $[-1,1]$에서의 정적분은 0입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표평면 위를 움직이는 점 P의 시각 $t$에서의 좌표 $(x,y)$가
    $$x=\frac{1}{\sqrt3}\cos t,\qquad y=\sqrt3\ln\left(1+\frac{\sin^2t}{8}\right)$$
    일 때, 시각 $t=0$에서 $t=\pi$까지 점 P가 움직인 거리를 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{2}{\sqrt{3}}(-1+3\ln2)', equivalents: ['-2/sqrt(3)+2*sqrt(3)*log(2)', '2*(3*log(2)-1)/sqrt(3)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $(8+\sin^2t)^2+36\cos^2t=(10-\sin^2t)^2$이므로 속력이 깔끔해지고, $u=\cos t$로 유리함수 적분.
    steps:
    - {id: 2a, content: '$\dfrac{2}{\sqrt3}\displaystyle\int_0^1\left(-1+\frac{3}{3-u}+\frac{3}{3+u}\right)du=\dfrac{2}{\sqrt3}(-1+3\ln2)$', criteria: [2.B1, 2.M1, 2.B2]}
    hint_ladder:
    - $\left(\frac{dy}{dt}\right)^2$을 통분해 근호 안을 하나의 분수로 만들자.
    - $\cos^2t=1-\sin^2t$로 바꾸면 근호 안이 완전제곱식이 된다.
    - $\sin t\,dt$가 보이면 $u=\cos t$로 치환하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.63 [문제 2-2] 예시답안
    steps:
    - id: 2b-1
      content: |
        $x$와 $y$를 $t$에 대해 미분하여
        $$\sqrt{\left(\frac{dx}{dt}\right)^2+\left(\frac{dy}{dt}\right)^2}=\sqrt{\left(-\frac{\sin t}{\sqrt3}\right)^2+\left(\frac{2\sqrt3\sin t\cos t}{8+\sin^2t}\right)^2}$$
        $$=\frac{\sin t}{\sqrt3(8+\sin^2t)}\sqrt{(8+\sin^2t)^2+36\cos^2t}=\frac{\sin t(10-\sin^2t)}{\sqrt3(8+\sin^2t)}$$
        를 구한다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        따라서 $u=\cos t$로 치환하여,
        $$\int_0^\pi\sqrt{\left(\frac{dx}{dt}\right)^2+\left(\frac{dy}{dt}\right)^2}dt=\int_0^\pi\frac{\sin t(9+\cos^2t)}{\sqrt3(9-\cos^2t)}dt=\int_{-1}^{1}\frac{9+u^2}{\sqrt3(9-u^2)}du=\frac{2}{\sqrt3}\int_0^1\frac{9+u^2}{9-u^2}du$$
      criteria: [2.M1]
    - id: 2b-3
      content: |
        $$=\frac{2}{\sqrt3}\int_0^1\left(-1+\frac{3}{3-u}+\frac{3}{3+u}\right)du=\frac{2}{\sqrt3}(-1+3\ln2)=-\frac{2}{\sqrt3}+2\sqrt3\ln2$$
        를 구한다.
      criteria: [2.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: $\sqrt{\left(\frac{dx}{dt}\right)^2+\left(\frac{dy}{dt}\right)^2}=\dfrac{\sin t(10-\sin^2t)}{\sqrt3(8+\sin^2t)}$를 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $u=\cos t$로 치환하여 $\int_{-1}^{1}\dfrac{9+u^2}{\sqrt3(9-u^2)}du$를 구했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: 정적분을 $\frac{2}{\sqrt3}\int_0^1\left(-1+\frac{3}{3-u}+\frac{3}{3+u}\right)du$ 형태로 정리한 후 계산하여 정답 $\frac{2}{\sqrt3}(-1+3\ln2)$를 얻었다.
      depends_on: []
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4518}
  - {code: '71', misconception: MC-CAL-4505}
  misconceptions:
  - id: MC-CAL-4518
    outcome_code: '70'
    wrong_work: '근호 안 $(8+\sin^2t)^2+36\cos^2t$를 정리하지 못해 적분을 진행하지 못하거나, $\sqrt{\sin^2t}=\lvert\sin t\rvert$의 부호 확인 없이 구간을 나눔'
    detect_cue: 속력이 $\frac{\sin t(10-\sin^2t)}{\sqrt3(8+\sin^2t)}$ 꼴로 정리되지 않음
    feedback: $\cos^2t=1-\sin^2t$를 넣으면 $(8+s)^2+36(1-s)=(10-s)^2$ ($s=\sin^2t$)입니다. $0\le t\le\pi$에서 $\sin t\ge0$입니다.
    remedy: [RL-2]
  - id: MC-CAL-4505
    outcome_code: '71'
    wrong_work: '$u=\cos t$로 치환할 때 적분 구간을 $[1,-1]$로 바꾸면서 부호를 놓치거나 $\sin t\,dt=-du$를 빠뜨려 음수 거리를 얻음'
    detect_cue: 답이 음수
    feedback: $t:0\to\pi$이면 $u:1\to-1$, $\sin t\,dt=-du$이므로 두 부호가 상쇄되어 $\int_{-1}^1$이 됩니다.
    remedy: [RL-3]

