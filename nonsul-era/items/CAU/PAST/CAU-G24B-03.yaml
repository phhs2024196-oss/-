  - '후보 $\theta=0,\alpha,\frac{\pi}{4},\beta,\frac{\pi}{2}$에서 $\{f(\theta)\}^2$ 비교'
  conditions:
  - '닫힌구간 $\left[0,\frac{\pi}{2}\right]$에서 연속 ⇒ 최솟값 존재, 후보는 임계점과 끝점'
  - '$0\le\theta\le\frac{\pi}{2}$ ⇒ $\sin\theta\cos\theta\ge0$ ⇒ $X=\frac{12}{25}$ 만 채택'
