stimuli:
- label: '1'
  body: |
    좌표평면에서 두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$ 사이의 거리는 $\overline{\mathrm{AB}}=\sqrt{(x_1-x_2)^2+(y_1-y_2)^2}$이다.
- label: '2'
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이면 함수 $f(x)$는 이 구간에서 최댓값과 최솟값을 갖는다.
- label: '3'
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능하고 $x=a$에서 극값을 가지면 $f'(a)=0$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    수열 $\{a_n\}$의 일반항이 $a_n=\displaystyle\int_0^{\ln(n+1)}(2e^{2x}-e^x)\,dx$일 때, 다음 식의 값을 구하시오. [10점]
    $$\sum_{k=1}^{99}\left(\frac1k+\frac{1}{k+1}+1\right)\frac{1}{a_k}$$
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{19899}{10000}', equivalents: ['19899/10000', '1.9899'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_n=n(n+1)$, 각 항 $=\frac{1}{k^2}-\frac{1}{(k+1)^2}+\frac1k-\frac{1}{k+1}$.
    steps:
    - {id: 1a, content: '$\left(1-\frac{1}{100^2}\right)+\left(1-\frac{1}{100}\right)=\dfrac{9999}{10000}+\dfrac{99}{100}=\dfrac{19899}{10000}$', criteria: [1.B1, 1.B2]}
    hint_ladder:
    - $a_n$을 먼저 계산하자. $e^{\ln(n+1)}=n+1$이다.
    - $\frac{1}{a_k}=\frac1k-\frac{1}{k+1}$에 $\frac1k+\frac{1}{k+1}$을 곱하면?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.64 [문제 3-1] 예시답안
    steps:
    - id: 1b-1
      content: |
        정적분하면 $a_n=\displaystyle\int_0^{\ln(n+1)}(2e^{2x}-e^x)\,dx=\left[e^{2x}-e^x\right]_0^{\ln(n+1)}=n(n+1)$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $\dfrac{1}{a_k}=\dfrac{1}{k(k+1)}=\left(\dfrac1k-\dfrac{1}{k+1}\right)$이므로 주어진 식의 값은
        $$\sum_{k=1}^{99}\left(\frac1k+\frac{1}{k+1}+1\right)\frac{1}{a_k}=\sum_{k=1}^{99}\left(\frac{1}{k^2}-\frac{1}{(k+1)^2}\right)+\sum_{k=1}^{99}\left(\frac1k-\frac{1}{k+1}\right)=\frac{9999}{10000}+\frac{99}{100}=\frac{19899}{10000}$$
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: $a_n=n(n+1)$을 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: $\frac{1}{a_k}=\left(\frac1k-\frac{1}{k+1}\right)$을 이용하여 식의 값 $\frac{19899}{10000}$을 구했다.
      depends_on: []
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-4519}
  misconceptions:
  - id: MC-ALG-4519
    outcome_code: '70'
    wrong_work: '망원합에서 끝 항을 $\frac{1}{99}$ 또는 $\frac{1}{99^2}$로 남기거나, 첫 항 $\frac{1}{1^2}$을 빠뜨림'
    detect_cue: 분모가 10000·100이 아닌 값(예 $\frac{9800}{9801}$)
    feedback: $k=1$부터 99까지 더하면 $\frac{1}{1}$과 $\frac{1}{100}$(또는 $\frac{1}{100^2}$)만 남습니다. 처음 몇 항과 마지막 항을 써서 확인하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표평면 위의 세 점 $\mathrm{A}(5,0)$, $\mathrm{B}(0,5)$, $\mathrm{P}(7\cos\theta,7\sin\theta)$에 대하여 $\overline{\mathrm{AP}}+\overline{\mathrm{BP}}$의 최솟값을 $m$이라 할 때, $m^2$의 값을 구하시오. (단, $0\le\theta\le\dfrac{\pi}{2}$이다.) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '98', equivalents: ['98'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 임계점은 $\theta=\frac{\pi}{4}$와 $\sin\theta\cos\theta=\frac{12}{25}$인 $\alpha,\ \beta$. $\{f(\alpha)\}^2=98<296-140\sqrt2=\left\{f\left(\frac{\pi}{4}\right)\right\}^2$.
    steps:
    - {id: 2a, content: '$\{f(0)\}^2=78+4\sqrt{74}$, $\{f(\alpha)\}^2=98$, $\left\{f\left(\frac{\pi}{4}\right)\right\}^2=296-140\sqrt2$ ⇒ $m^2=98$', criteria: [2.M1, 2.B1, 2.B2]}
    hint_ladder:
    - $\overline{\mathrm{AP}}^2=74-70\cos\theta$이다.
    - $f'(\theta)=0$을 정리하면 $\sin\theta-\cos\theta$가 인수로 나온다.
    - 남은 인수는 $\sin\theta+\cos\theta$와 $\sin\theta\cos\theta$의 관계식이다. 제곱해 $X=\sin\theta\cos\theta$로 쓰자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.64 [문제 3-2] 예시답안
    steps:
    - id: 2b-1
      content: |
        함수 $f(\theta)$를 $\overline{\mathrm{AP}}+\overline{\mathrm{BP}}=f(\theta)=\sqrt{74-70\cos\theta}+\sqrt{74-70\sin\theta}$라 하자.
        $$f'(\theta)=\frac{35\sin\theta}{\sqrt{74-70\cos\theta}}-\frac{35\cos\theta}{\sqrt{74-70\sin\theta}}\ \text{이므로}\ f'(\theta)=0\ \text{을 정리하면}$$
        $37(\sin^2\theta-\cos^2\theta)-35(\sin^3\theta-\cos^3\theta)=0$이다.
        정리하면 $(\sin\theta-\cos\theta)[37(\sin\theta+\cos\theta)-35(1+\sin\theta\cos\theta)]=0$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $\sin\theta-\cos\theta=0$일 때, $\theta=\dfrac{\pi}{4}$이고 $\sin\theta=\cos\theta=\dfrac{\sqrt2}{2}$이다.
        $37(\sin\theta+\cos\theta)=35(1+\sin\theta\cos\theta)$일 때, 제곱하고 $X=\sin\theta\cos\theta$로 써서 정리하면
        $(25\times49)X^2-288X-144=(25X-12)(49X+12)=0$이다. 범위가 $0\le\theta\le\dfrac{\pi}{2}$이므로 $\sin\theta\cos\theta=\dfrac{12}{25}$이다.
        $\sin\theta+\cos\theta=\dfrac75$와 연립하여 근을 구하면 $\sin\alpha=\dfrac35$, $\cos\alpha=\dfrac45$를 만족하는 $\alpha$와 $\sin\beta=\dfrac45$, $\cos\beta=\dfrac35$을 만족하는 $\beta$가 있다.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        $\theta=0,\ \alpha,\ \dfrac{\pi}{4},\ \beta,\ \dfrac{\pi}{2}$에서 $\{f(\theta)\}^2$ 값을 계산하자.
        $\{f(0)\}^2=\left\{f\left(\dfrac{\pi}{2}\right)\right\}^2=78+4\sqrt{74}$, $\{f(\alpha)\}^2=\{f(\beta)\}^2=98$, $\left\{f\left(\dfrac{\pi}{4}\right)\right\}^2=296-140\sqrt2$이다.
        최솟값은 98이다.
      criteria: [2.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 7
      evidence: $f(\theta)$를 미분하여 $\sin\theta-\cos\theta=0$, $37(\sin\theta+\cos\theta)=35(1+\sin\theta\cos\theta)$를 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B1
      mark_type: B
      points: 6
      evidence: $\sin\theta=\cos\theta=\frac{\sqrt2}{2}$와 $\sin\alpha=\frac35$, $\cos\alpha=\frac45$를 구했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B2
      mark_type: B
      points: 2
      evidence: 함수값을 비교하여 최솟값(원문 표기 $7\sqrt2$, 즉 $m^2=98$)을 구했다.
      depends_on: []
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4520}
  misconceptions:
  - id: MC-CAL-4520
    outcome_code: '70'
    wrong_work: '$\sin\theta=\cos\theta$인 $\theta=\frac{\pi}{4}$만 임계점으로 보고 $m^2=296-140\sqrt2$로 답함'
    detect_cue: 답이 $296-140\sqrt2\ (\approx98.01)$ 또는 $\theta=\frac{\pi}{4}$에서 최소라고 씀
    feedback: $f'(\theta)=0$을 인수분해하면 인수가 둘입니다. 두 번째 인수에서 나오는 $\sin\theta=\frac35,\ \frac45$도 후보이며, 그 값 98이 더 작습니다.
    remedy: [RL-2]

