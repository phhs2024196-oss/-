intent: 정적분으로 정의된 일반항을 구하고 부분분수 분해로 망원합을 계산하는 능력(3-1), 원 위의 점과 두 정점 사이 거리의 합을 각의 함수로 세워 미분하고 임계점·끝값을 비교해 최솟값을 구하는 능력(3-2)을 본다(공식 해설 흐름에서 정리 — 공식 출제 의도 문서 없음).
key_idea: |
  (3-1) $a_n=n(n+1)$, $\left(\frac1k+\frac{1}{k+1}+1\right)\frac{1}{a_k}=\left(\frac1k-\frac{1}{k+1}\right)\left(\frac1k+\frac{1}{k+1}\right)+\left(\frac1k-\frac{1}{k+1}\right)=\frac{1}{k^2}-\frac{1}{(k+1)^2}+\frac1k-\frac{1}{k+1}$. (3-2) $f'(\theta)=0$을 $(\sin\theta-\cos\theta)\{37(\sin\theta+\cos\theta)-35(1+\sin\theta\cos\theta)\}=0$으로 인수분해하고, 둘째 인수는 $X=\sin\theta\cos\theta$의 이차방정식으로 푼다.
stuck: (3-1) $\frac1k+\frac{1}{k+1}$을 곱하면 제곱의 차 망원합이 되는 관찰 / (3-2) 둘째 인수에서 나오는 임계점 $\sin\alpha=\frac35$ 를 찾고 $\theta=\frac{\pi}{4}$와 비교하는 단계
