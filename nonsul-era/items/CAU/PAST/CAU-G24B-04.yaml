stimuli:
- label: '1'
  body: |
    타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$에 접하고 기울기가 $m$인 접선의 방정식은 $y=mx\pm\sqrt{a^2m^2+b^2}$이다.
- label: '2'
  body: |
    이차방정식 $ax^2+bx+c=0$의 두 근을 $\alpha,\ \beta$라 하면 $\alpha+\beta=-\dfrac ba$이고 $\alpha\beta=\dfrac ca$이다.
- label: '3'
  body: |
    평면 $\beta$ 위에 있는 도형의 넓이를 $S$, 이 도형의 평면 $\alpha$ 위로의 정사영의 넓이를 $S'$이라 할 때, 두 평면 $\alpha,\ \beta$가 이루는 각의 크기를 $\theta\ (0^\circ\le\theta\le90^\circ)$라 하면 $S'=S\cos\theta$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    직선 $y=\sqrt3$ 위의 점 $\mathrm{P}(k,\sqrt3)$에서 타원 $x^2+\dfrac{y^2}{2}=1$에 그은 두 접선이 이루는 예각이 $45^\circ$일 때, $k^2$의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '4+2\sqrt{5}', equivalents: ['4+2*sqrt(5)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 접선의 기울기는 $(k^2-1)m^2-2\sqrt3km+1=0$의 두 근.
    steps:
    - {id: 1a, content: '$\tan^2(\alpha-\beta)=1$ ⇒ $(k^2)^2-8k^2-4=0$ ⇒ $k^2=4+2\sqrt5$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 기울기가 $m$인 접선을 $y=mx\pm\sqrt{m^2+2}$로 두고 점 P를 대입하자.
    - 얻은 $m$에 대한 이차방정식의 두 근이 두 접선의 기울기이다.
    - 두 접선이 $x$축과 이루는 각의 차가 $45^\circ$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.65 [문제 4-1] 예시답안
    steps:
    - id: 1b-1
      content: |
        $k=\pm1$인 경우, 두 접선이 이루는 각이 $45^\circ$가 아님을 쉽게 알 수 있다. 따라서 $k\ne\pm1$이라 가정할 수 있다.
        접선을 $y=mx\pm\sqrt{m^2+2}$라 놓자. 접선이 점 $\mathrm{P}(k,\sqrt3)$을 지나므로 대입하여 정리하여 $m$에 대한 이차방정식 $(k^2-1)m^2-2\sqrt3km+1=0$을 얻는다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        아래 그림과 같이 두 접선이 $x$축과 이루는 각을 $\alpha,\ \beta\ (\alpha>\beta)$라 하면 $\tan\alpha$, $\tan\beta$는 이 이차방정식의 두 근이고, 근과 계수의 관계에 의하여
        $\tan\alpha+\tan\beta=\dfrac{2\sqrt3k}{k^2-1}$과 $\tan\alpha\tan\beta=\dfrac{1}{k^2-1}$이다. $\alpha-\beta=45^\circ$이므로
        [그림: 타원 $x^2+\frac{y^2}{2}=1$과 직선 $y=\sqrt3$ 위의 점 P에서 그은 두 접선. 두 접선이 $x$축과 이루는 각 $\alpha$, $\beta$와 P에서의 $45^\circ$ 표시]
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $$1=\tan^2(\alpha-\beta)=\left(\frac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}\right)^2=\frac{(\tan\alpha+\tan\beta)^2-4\tan\alpha\tan\beta}{(1+\tan\alpha\tan\beta)^2}=\frac{\left(\frac{2\sqrt3k}{k^2-1}\right)^2-\frac{4}{k^2-1}}{\left(1+\frac{1}{k^2-1}\right)^2}$$
        정리하여 방정식 $(k^2)^2-8k^2-4=0$을 얻는다. $k^2>0$이므로 $k^2=4+2\sqrt5$
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: 접선을 $y=mx\pm\sqrt{m^2+2}$라 놓고 $(k^2-1)m^2-2\sqrt3km+1=0$을 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: 두 접선이 $x$축과 이루는 각을 $\alpha,\ \beta$라 놓고 $\tan\alpha+\tan\beta=\frac{2\sqrt3k}{k^2-1}$과 $\tan\alpha\tan\beta=\frac{1}{k^2-1}$을 얻었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: $k^2=4+2\sqrt5$를 구했다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4521}
  misconceptions:
  - id: MC-GEO-4521
    outcome_code: '70'
    wrong_work: '접선을 $y=mx\pm\sqrt{2m^2+1}$로 두어 ($a^2=1$, $b^2=2$ 자리 혼동) 이차방정식 계수가 어긋남'
    detect_cue: $m$에 대한 이차방정식이 $(k^2-2)m^2-2\sqrt3km+2=0$ 꼴
    feedback: $x^2+\frac{y^2}{2}=1$은 $a^2=1$, $b^2=2$이므로 접선은 $y=mx\pm\sqrt{1\cdot m^2+2}$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    넓이가 $6\sqrt3$이고 $\overline{\mathrm{AC}}=4\sqrt3$인 삼각형 ABC가 평면 $\alpha$와 만나지 않게 놓여 있다. 평면 $\alpha$에 수직으로 입사하는 빛에 의한 삼각형 ABC의 그림자가 평면 $\alpha$ 위에서 그림과 같이 정삼각형 A′B′C′을 이룬다. $\overline{\mathrm{AA'}}+\overline{\mathrm{CC'}}=2\overline{\mathrm{BB'}}=10$일 때, 삼각형 ABC의 내접원의 그림자의 넓이를 구하시오. [15점]

    [그림: 평면 $\alpha$ 위쪽에 놓인 삼각형 ABC($\overline{\mathrm{AC}}=4\sqrt3$ 표시)와 위에서 수직으로 내리쬐는 빛(화살표 3개), 평면 위의 그림자 정삼각형 A′B′C′과 수직선분 AA′, BB′, CC′]
  points: 15
  depends_on: []
  answer: {kind: value, value: '2(11-4\sqrt{7})\pi', equivalents: ['2*(11-4*sqrt(7))*pi', '18*pi/(11+4*sqrt(7))'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{AB}}=\overline{\mathrm{BC}}=\sqrt{a^2+d^2}=\sqrt{21}$, $a=2\sqrt3$, $\cos\theta=\frac12$, $r=2(\sqrt7-2)$.
    steps:
    - {id: 2a, content: '그림자 넓이 $=\pi r^2\cos\theta=\frac12\pi r^2=2(11-4\sqrt7)\pi$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 세 높이를 $5-d,\ 5,\ 5+d$로 두자.
    - 각 변은 (그림자 변, 높이 차)를 두 변으로 하는 직각삼각형의 빗변이다.
    - 넓이의 비가 $\cos\theta$이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 논술가이드북(자연) p.66 [문제 4-2] 예시답안
    steps:
    - id: 2b-1
      content: |
        $\overline{\mathrm{AA'}}=5-d$, $\overline{\mathrm{BB'}}=5$, $\overline{\mathrm{CC'}}=5+d$라 하고, 정삼각형 A′B′C′의 한 변의 길이를 $a$라 하자.
        아래 그림과 같이 점 $\mathrm{B_1},\mathrm{C_1},\mathrm{C_2}$를 선분 BB′ 또는 CC′ 위에서 잡자.
        [그림: 사다리꼴 AA′B′B에서 A와 같은 높이의 점 $\mathrm{B_1}$($\overline{\mathrm{B_1B}}=d$), 사다리꼴 BB′C′C에서 $\mathrm{C_1}$($\overline{\mathrm{C_1C}}=d$), 사다리꼴 AA′C′C에서 $\mathrm{C_2}$($\overline{\mathrm{C_2C}}=2d$), 이등변삼각형 ABC에서 B에서 AC에 내린 높이 $h$와 $\overline{\mathrm{AC}}$의 절반 $2\sqrt3$]
      criteria: []
    - id: 2b-2
      content: |
        직각삼각형 $\mathrm{AB_1B}$, $\mathrm{BC_1C}$에서 $\overline{\mathrm{AB}}=\overline{\mathrm{BC}}=\sqrt{a^2+d^2}$이므로 삼각형 ABC는 이등변삼각형이다.
        위 그림과 같이 점 B와 선분 AC사이의 거리를 $h$라 하면 삼각형 ABC의 넓이가 $6\sqrt3$이므로 $h=3$이고 $\overline{\mathrm{AB}}=\overline{\mathrm{BC}}=\sqrt{21}$이다.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        직각삼각형 $\mathrm{AB_1B}$와 $\mathrm{AC_2C}$에서 $a^2+d^2=21$, $a^2+4d^2=48$이므로 $a=2\sqrt3\ (d=\pm3)$을 얻는다.
        따라서 삼각형 A′B′C′의 넓이는 $3\sqrt3$이고, 평면 ABC와 평면 $\alpha$가 이루는 각을 $\theta$라 하면 $\cos\theta=\dfrac12$이다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        삼각형 ABC의 내접원의 반지름의 길이를 $r$라 하고 삼각형 ABC의 넓이를 $S$라 하면
        $\dfrac12(4\sqrt3+2\sqrt{21})r=S=6\sqrt3$이므로 $r=2(\sqrt7-2)$을 얻는다.
        삼각형 ABC의 내접원의 그림자의 넓이는 $\pi r^2\cos\theta=\dfrac12\pi r^2=2(11-4\sqrt7)\pi$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: $\overline{\mathrm{AB}}=\overline{\mathrm{BC}}=\sqrt{21}$을 구했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: 삼각형 A′B′C′의 넓이 $3\sqrt3$을 구했다.
      depends_on: []
      steps: [2b-3]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: 그림자의 넓이 $2(11-4\sqrt7)\pi$를 구했다(그림자의 넓이를 $\frac{18\pi}{11+4\sqrt7}$로 구해도 +5점).
      depends_on: []
      accept: ['\dfrac{18\pi}{11+4\sqrt{7}}']
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점. 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4522}
  misconceptions:
  - id: MC-GEO-4522
    outcome_code: '70'
    wrong_work: '그림자 넓이를 $\pi r^2=4(11-4\sqrt7)\pi$로 답하거나(cosθ 누락), 정삼각형 A′B′C′의 내접원 넓이 $\pi\cdot1^2=\pi$로 답함'
    detect_cue: 답에 $\frac12$ 인자가 빠졌거나 답이 $\pi$
    feedback: 내접원의 그림자는 원이 아니라 타원이며 넓이는 $\pi r^2\cos\theta$입니다. 그림자 삼각형의 내접원과는 다릅니다.
    remedy: [RL-2]

