intent: 타원 밖의 점에서 그은 두 접선의 기울기를 근과 계수의 관계로 다루고 두 접선이 이루는 각 조건을 식으로 바꾸는 능력(4-1), 그림자 삼각형과 원래 삼각형의 길이 관계를 직각삼각형으로 세워 정사영의 넓이 관계로 내접원 그림자의 넓이를 구하는 능력(4-2)을 본다(공식 해설 흐름에서 정리 — 공식 출제 의도 문서 없음).
key_idea: |
  (4-1) 접선 $y=mx\pm\sqrt{m^2+2}$가 $\mathrm{P}(k,\sqrt3)$을 지나면 $(k^2-1)m^2-2\sqrt3km+1=0$, 두 근 $\tan\alpha,\ \tan\beta$로 $\tan^2(\alpha-\beta)=1$. (4-2) $\overline{\mathrm{AA'}}=5-d$, $\overline{\mathrm{BB'}}=5$, $\overline{\mathrm{CC'}}=5+d$로 두면 $\overline{\mathrm{AB}}=\overline{\mathrm{BC}}=\sqrt{a^2+d^2}$(이등변), 높이 3에서 $a=2\sqrt3$, $\cos\theta=\frac{3\sqrt3}{6\sqrt3}=\frac12$.
stuck: (4-1) 두 접선의 기울기를 이차방정식의 두 근으로 보는 발상 / (4-2) 높이 조건 $\overline{\mathrm{AA'}}+\overline{\mathrm{CC'}}=2\overline{\mathrm{BB'}}$를 등차($5-d,5,5+d$)로 두고 삼각형 ABC가 이등변임을 찾는 것
idea_tags: [IDEA-TANGENT-SLOPES-AS-ROOTS, IDEA-PROJECTION-AREA-RATIO]
tags: [타원의 접선, 근과 계수의 관계, 정사영, 내접원, 중앙대 실전]
elements:
  materials:
  - '직선 $y=\sqrt3$ 위의 점 $\mathrm{P}(k,\sqrt3)$, 타원 $x^2+\frac{y^2}{2}=1$'
  - '두 접선이 이루는 예각 $45^\circ$'
  - '넓이 $6\sqrt3$, $\overline{\mathrm{AC}}=4\sqrt3$인 삼각형 ABC와 평면 $\alpha$'
  - '수직 입사 빛에 의한 그림자 정삼각형 A′B′C′, $\overline{\mathrm{AA''}}+\overline{\mathrm{CC''}}=2\overline{\mathrm{BB''}}=10$'
  concepts: [타원의 접선의 방정식, 이차방정식의 근과 계수의 관계, 탄젠트 뺄셈정리, 정사영의 넓이, 삼각형의 내접원, 피타고라스 정리]
  tools:
  - '$k=\pm1$ 경우 따로 처리'
  - '$\tan\alpha+\tan\beta=\frac{2\sqrt3k}{k^2-1}$, $\tan\alpha\tan\beta=\frac{1}{k^2-1}$'
  - '$\tan^2(\alpha-\beta)=\dfrac{(\tan\alpha+\tan\beta)^2-4\tan\alpha\tan\beta}{(1+\tan\alpha\tan\beta)^2}=1$'
  - '점 $\mathrm{B_1},\mathrm{C_1},\mathrm{C_2}$를 잡아 직각삼각형 $\mathrm{AB_1B}$, $\mathrm{BC_1C}$, $\mathrm{AC_2C}$'
  - '$\frac12(\text{둘레})r=S$, 그림자 넓이 $=\pi r^2\cos\theta$'
  conditions:
  - '예각 $45^\circ$ ⇒ $\tan^2(\alpha-\beta)=1$ (두 접선의 기울기 순서 무관)'
  - '$k^2>0$ ⇒ $(k^2)^2-8k^2-4=0$의 양근 $k^2=4+2\sqrt5$'
  - '빛이 평면 $\alpha$에 수직 ⇒ $\overline{\mathrm{AA''}},\overline{\mathrm{BB''}},\overline{\mathrm{CC''}}$은 모두 $\alpha$에 수직, 그림자는 정사영'
  - '$\overline{\mathrm{AA''}}+\overline{\mathrm{CC''}}=2\overline{\mathrm{BB''}}=10$ ⇒ $\overline{\mathrm{BB''}}=5$, $\overline{\mathrm{AA''}}=5-d$, $\overline{\mathrm{CC''}}=5+d$'
  stimuli_used: ['1', '2', '3']
  subpart_links: 4-1·4-2 는 독립. 4-1 은 제시문 1(타원 접선)·2(근과 계수), 4-2 는 제시문 3(정사영)을 쓴다.

