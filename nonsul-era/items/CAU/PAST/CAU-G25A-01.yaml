stimuli: []

stem: |
  다음 규칙에 따라 점수를 얻는 시행을 한다. 풀이와 함께 물음에 답하시오.

  - 주머니에 빨간색 공 4개, 파란색 공 3개, 초록색 공 3개가 들어 있다.
  - 서로 다른 2개의 주사위를 동시에 던져 나온 눈의 수의 합이 4 이하이면, 주머니에서 임의로 공 2개를 동시에 꺼낸다. 만일 눈의 수의 합이 5 이상이면, 주머니에서 임의로 공 1개를 꺼낸다.
  - 꺼낸 공 중에서 빨간색 공의 개수를 점수로 얻는다.
  - 꺼낸 공을 모두 주머니에 다시 넣는다.

  위 시행을 2회 반복할 때, 얻은 점수의 합이 2 이상일 확률을 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    위 시행을 2회 반복할 때, 얻은 점수의 합이 2 이상일 확률을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac{2}{9}', equivalents: ['2/9', '450/2025'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $P(C)=\dfrac16\cdot\dfrac13+\dfrac56\cdot\dfrac35=\dfrac59$, $P(D)=\dfrac16\cdot\dfrac8{15}+\dfrac56\cdot\dfrac25=\dfrac{19}{45}$, 답 $1-\dfrac{25}{81}-\dfrac{38}{81}=\dfrac29$.
    steps:
    - {id: 1a, content: '$1-\{P(C)\}^2-2P(C)P(D)=\dfrac{18}{81}=\dfrac29$', criteria: [1.B1, 1.B2, 1.B3, 1.B4, 1.B5, 1.B6, 1.B7, 1.B8]}
    hint_ladder:
    - 1회 시행의 점수가 0, 1, 2일 확률을 먼저 구하자.
    - 눈의 합이 4 이하인 사건으로 나누어 조건부확률을 구하자.
    - 합이 2 이상인 사건의 여사건은 무엇인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.49~50 예시답안
    steps:
    - id: 1b-1
      content: |
        (1) 2개의 주사위를 동시에 던져 나온 수의 눈의 합이 4 이하인 사건을 $A$라고 하자. 2개의 주사위를 동시에 던져 나온 수의 눈의 합이 4 이하인 경우의 수는 $(1,1),(1,2),(2,1),(1,3),(2,2),(3,1)$의 6가지이므로, 사건 $A$가 일어날 확률은 $P(A)=\dfrac{6}{36}=\dfrac16$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (2) 시행을 2회 반복할 때 얻은 점수의 합이 0인 사건과 점수의 합이 1인 사건은 서로 배반사건이므로, 점수의 합이 2 미만일 확률은 점수의 합이 0인 확률과 점수의 합이 1인 확률의 합과 같다. 또한, 점수의 합이 2 이상인 사건은 점수의 합이 2 미만인 사건의 여사건이다. 따라서,
        $$P(\text{점수의 합}\ge2)=1-P(\text{점수의 합}\le1)=1-P(\text{점수의 합}=0)-P(\text{점수의 합}=1)$$
        으로 구할 수 있다.
      criteria: []
    - id: 1b-3
      content: |
        (3) 문제의 시행을 1회 했을 때 얻은 점수를 $X$라 하고, $X=0$인 사건을 $C$, $X=1$인 사건을 $D$라 하자. 각 시행은 독립시행이므로 $P(\text{점수의 합}=0)=\{P(C)\}^2$이며, 점수의 합이 1이려면 첫 번째 시행에서 0점, 두 번째 시행에서 1점을 얻거나 첫 번째 시행에서 1점, 두 번째 시행에서 0점을 얻으면 되므로
        $$P(\text{점수의 합}=1)=P(C)\times P(D)+P(D)\times P(C)=2\times P(C)\times P(D)$$
        이다.
      criteria: []
    - id: 1b-4
      content: |
        (4) 확률의 곱셈정리와 덧셈정리를 이용하면 $P(C)$, $P(D)$는 다음과 같이 구할 수 있다.
        $$P(C)=P(C\cap A)+P(C\cap A^c)=P(A)P(C\mid A)+P(A^c)P(C\mid A^c)$$
        $$P(D)=P(D\cap A)+P(D\cap A^c)=P(A)P(D\mid A)+P(A^c)P(D\mid A^c)$$
      criteria: []
    - id: 1b-5
      content: |
        (5) $P(C\mid A)$와 $P(D\mid A)$, $P(C\mid A^c)$와 $P(D\mid A^c)$는 다음과 같이 구할 수 있다.
        $P(C\mid A)=\dfrac{{}_6C_2}{{}_{10}C_2}=\dfrac{15}{45}=\dfrac13$ (나머지 색깔 중에서만 2개를 꺼낼 확률)
        $P(D\mid A)=\dfrac{{}_6C_1\times{}_4C_1}{{}_{10}C_2}=\dfrac{24}{45}=\dfrac{8}{15}$ (빨간색 공 1개, 나머지 색깔 중 1개를 꺼낼 확률)
        $P(C\mid A^c)=\dfrac{{}_6C_1}{{}_{10}C_1}=\dfrac{6}{10}=\dfrac35$ (나머지 색깔 중에서만 1개를 꺼낼 확률)
        $P(D\mid A^c)=\dfrac{{}_4C_1}{{}_{10}C_1}=\dfrac{4}{10}=\dfrac25$ (빨간색 공 1개를 꺼낼 확률)
      criteria: [1.B2, 1.B3, 1.B4, 1.B5]
    - id: 1b-6
      content: |
        (6) (4), (5)를 종합하면 $P(C)$, $P(D)$는 다음과 같다.
        $$P(C)=\left(\dfrac16\times\dfrac13\right)+\left(\dfrac56\times\dfrac35\right)=\dfrac{10}{18}=\dfrac59,\qquad P(D)=\left(\dfrac16\times\dfrac{8}{15}\right)+\left(\dfrac56\times\dfrac25\right)=\dfrac{19}{45}$$
      criteria: [1.B6, 1.B7]
    - id: 1b-7
      content: |
        (7) 최종적으로, 구하는 확률은 다음과 같다.
        $$1-\{P(C)\}^2-2\times P(C)\times P(D)=1-\left(\dfrac59\right)^2-\left(2\times\dfrac59\times\dfrac{19}{45}\right)=1-\dfrac{25}{81}-\dfrac{38}{81}=\dfrac{18}{81}=\dfrac29$$
      criteria: [1.B8]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2026 논술가이드북(자연) p.50 별해
    key_idea: 여사건을 쓰지 않고 $X=2$인 사건 $E$까지 구해 합이 2, 3, 4인 확률을 직접 더한다.
    steps:
    - id: 1c-1
      content: |
        (1) 여사건을 활용하지 않고 직접 답을 구할 수 있다. $X=2$인 사건을 $E$라 하면
        $$P(E)=\left(\dfrac16\times\dfrac{{}_4C_2}{{}_{10}C_2}\right)+\left(\dfrac56\times0\right)=\dfrac{1}{45}$$
        이며, 이때
        점수의 합이 2일 확률 $=2\times P(C)\times P(E)+\{P(D)\}^2=\dfrac{2}{81}+\dfrac{361}{45^2}=\dfrac{411}{45^2}$
        점수의 합이 3일 확률 $=2\times P(D)\times P(E)=\dfrac{38}{45^2}$
        점수의 합이 4일 확률 $=\{P(E)\}^2=\dfrac{1}{45^2}$
        이므로 모두 더하면 $\dfrac{411+38+1}{45^2}=\dfrac{450}{45^2}=\dfrac29$이다.
      criteria: [1.B8]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: 사건 $A$(눈의 합 4 이하)의 확률 $\dfrac16$을 정확히 계산했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: $P(C\mid A)=\dfrac13$을 정확히 계산했다.
      depends_on: []
      steps: [1b-5]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: $P(D\mid A)=\dfrac{8}{15}$을 정확히 계산했다.
      depends_on: []
      steps: [1b-5]
    - id: 1.B4
      mark_type: B
      points: 2
      evidence: $P(C\mid A^c)=\dfrac35$을 정확히 계산했다.
      depends_on: []
      steps: [1b-5]
    - id: 1.B5
      mark_type: B
      points: 2
      evidence: $P(D\mid A^c)=\dfrac25$을 정확히 계산했다.
      depends_on: []
      steps: [1b-5]
    - id: 1.B6
      mark_type: B
      points: 4
      evidence: $P(C)=\dfrac59$를 정확히 계산했다.
      depends_on: []
      steps: [1b-6]
    - id: 1.B7
      mark_type: B
      points: 4
      evidence: $P(D)=\dfrac{19}{45}$를 정확히 계산했다.
      depends_on: []
      steps: [1b-6]
    - id: 1.B8
      mark_type: B
      points: 2
      evidence: 최종 확률 $\dfrac29$를 정확히 계산했다.
      depends_on: []
      steps: [1b-7, 1c-1]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D1-2
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석)
      effect: minus
      value: 1
