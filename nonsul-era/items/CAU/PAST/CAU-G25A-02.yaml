stimuli:
- label: '1'
  body: |
    수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라고 하면 일반항과 수열의 합의 관계는 다음과 같다.
    $$a_1=S_1,\quad a_n=S_n-S_{n-1}\ (n\ge2)$$
- label: '2'
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능할 때, 다음 식이 성립한다.
    $$\int f(x)g'(x)\,dx=f(x)g(x)-\int f'(x)g(x)\,dx$$

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합 $S_n$이 다음을 만족시킬 때, $a_1$을 구하시오. [10점]

    (가) $S_n=\begin{cases}\dfrac12a_n-2 & (n\text{이 짝수인 경우})\\ 2a_n+3 & (n\text{이 3 이상인 홀수인 경우})\end{cases}$
    (나) $S_8=2025$
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{499}{2}', equivalents: ['499/2', '249.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S_{2m+2}=-2S_{2m}-1$을 세 번 써서 $S_8=-8S_2-3$, $S_2=-S_1-4$.
    steps:
    - {id: 1a, content: '$-8S_2-3=2025\Rightarrow S_2=-\dfrac{507}2\Rightarrow a_1=S_1=-S_2-4=\dfrac{499}2$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - $a_n=S_n-S_{n-1}$을 (가)에 대입해 $S_n$만의 식으로 만들자.
    - 짝수 번째 합끼리의 관계식을 만들어 $S_8$에서 $S_2$로 거슬러 가자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.51 예시답안
    steps:
    - id: 1b-1
      content: |
        제시문에서 주어진 식 $a_n=S_n-S_{n-1}\ (n\ge2)$를 이용하면
        $n=2m+2\ (m\ge0)$인 경우, $S_{2m+2}=\dfrac12(S_{2m+2}-S_{2m+1})-2$, 즉, $S_{2m+2}=-S_{2m+1}-4$를 얻는다.
        $n=2m+1\ (m\ge1)$인 경우, $S_{2m+1}=2(S_{2m+1}-S_{2m})+3$, 즉, $S_{2m+1}=2S_{2m}-3$을 얻는다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        그러므로, $S_{2m+2}=-(2S_{2m}-3)-4=-2S_{2m}-1$이고, 반복하여 대입하면
        $S_8=-2S_6-1=4S_4+1=-8S_2-3$을 얻는다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        따라서, $S_2=-\dfrac{507}{2}$이고, $S_2=-S_1-4$를 이용하면, $S_1=a_1=\dfrac{499}{2}$이다.
      criteria: [1.B3]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2026 논술가이드북(자연) p.51 별해
    key_idea: $a_1$을 미지수로 두고 $a_2,\ S_2,\ a_3,\ S_3,\dots$을 차례로 구한다.
    steps:
    - id: 1c-1
      content: |
        주어진 제시문을 이용하여 $S_2-S_1=\dfrac12a_2-2-a_1=a_2$이므로, $a_2=-2a_1-4$, $S_2=-a_1-4$를 얻는다.
      criteria: [1.B1]
    - id: 1c-2
      content: |
        $S_3-S_2=2a_3+3-(-a_1-4)=a_3$이므로, $a_3=-a_1-7$, $S_3=-2a_1-11$을 얻고,
        동일한 방법으로 $a_4=4a_1+18$, $S_4=2a_1+7$, $a_5=2a_1+4$, $S_5=4a_1+11$,
        $a_6=-8a_1-26$, $S_6=-4a_1-15$, $a_7=-4a_1-18$, $S_7=-8a_1-33$,
        $a_8=16a_1+62$, $S_8=8a_1+29$를 얻는다.
      criteria: [1.B2]
    - id: 1c-3
      content: |
        따라서, $a_1=\dfrac{499}{2}$를 얻는다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: $S_{2m+2}=-S_{2m+1}-4$ 혹은 $S_{2m+1}=2S_{2m}-3$을 얻었다(별해 기준 — 대입하여 $S_2=-a_1-4$를 얻음).
      depends_on: []
      steps: [1b-1, 1c-1]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: $S_{2m+2}=-2S_{2m}-1$을 얻었다(별해 기준 — 순차적으로 바르게 대입함).
      depends_on: []
      steps: [1b-2, 1c-2]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: 모든 계산을 정확히 하여 $a_1=\dfrac{499}{2}$를 얻었다.
      depends_on: []
      steps: [1b-3, 1c-3]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D1-2
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-4609}
  misconceptions:
  - id: MC-ALG-4609
    outcome_code: '70'
    wrong_work: '(가)의 홀수 식을 $n=1$에도 적용해 $S_1=2a_1+3$에서 $a_1=-3$으로 두는 등 적용 범위를 벗어남'
    detect_cue: $a_1=-3$이 등장하거나 (나)를 쓰지 않고 $a_1$을 정함
    feedback: (가)의 홀수 식은 $n\ge3$에서만 성립합니다. $n=1$은 $S_1=a_1$이고, $a_1$은 (나)로 결정됩니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    실수 전체의 집합에서 정의된 함수 $f(x)$가 닫힌구간 $[-1,1]$에서
    $$f(x)=\begin{cases}-x^2\cos(\pi x) & (-1\le x<0)\\ x^2\cos(\pi x) & (0\le x\le1)\end{cases}$$
    이고, 모든 실수 $x$에 대하여 $f(x)=\dfrac12f(x-2)-\dfrac32$을 만족시킨다. 이때, 정적분 $\displaystyle\int_{-4}^{-1}f(x)\,dx$의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '15-\dfrac{8}{\pi^2}', equivalents: ['-8/pi^2+15'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$f(x)=2f(x+2)+3=4f(x+4)+9$로 세 구간의 식을 쓰면 적분이 $4\displaystyle\int_0^1x^2\cos\pi x\,dx+15$로 모인다.'
    steps:
    - {id: 2a, content: '$\displaystyle\int_0^1x^2\cos\pi x\,dx=-\dfrac{2}{\pi^2}$이므로 답 $-\dfrac8{\pi^2}+15$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 주어진 식을 $f(x-2)=2f(x)+3$으로 바꾸고 $x$ 대신 $x+2$를 넣어 보자.
    - $[-3,-2)$에서는 $x+2$가 $[-1,0)$에 있다. 그 구간의 식 부호에 주의하자.
    - '$x^2\cos\pi x$는 부분적분을 두 번 하면 된다.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.52 예시답안
    steps:
    - id: 2b-1
      content: |
        $f(x)=\dfrac12f(x-2)-\dfrac32$이므로 $f(x-2)=2f(x)+3$
        즉, $f(x)=2f(x+2)+3=4f(x+4)+9$이다.
        따라서, $-4\le x<-3$일 때, $f(x)=4(x+4)^2\cos(\pi(x+4))+9$이고,
        $-3\le x<-2$일 때, $f(x)=-2(x+2)^2\cos(\pi(x+2))+3$,
        $-2\le x<-1$일 때, $f(x)=2(x+2)^2\cos(\pi(x+2))+3$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        구하는 정적분을
        $$\int_{-4}^{-1}f(x)\,dx=4\int_{-4}^{-3}(x+4)^2\cos\pi(x+4)\,dx-2\int_{-3}^{-2}(x+2)^2\cos\pi(x+2)\,dx+2\int_{-2}^{-1}(x+2)^2\cos\pi(x+2)\,dx+15$$
        $$=4\int_0^1x^2\cos(\pi x)\,dx-2\int_0^1x^2\cos(\pi x)\,dx+2\int_0^1x^2\cos(\pi x)\,dx+15=4\int_0^1x^2\cos\pi x\,dx+15\quad\cdots(*)$$
        로 정리할 수 있다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        주어진 제시문의 부분적분에 의해
        $$\int x^2\cos\pi x\,dx=\dfrac1\pi x^2\sin\pi x-\dfrac2\pi\int x\sin\pi x\,dx=\dfrac1\pi x^2\sin\pi x+\dfrac{2}{\pi^2}x\cos\pi x-\dfrac{2}{\pi^2}\int\cos\pi x\,dx$$
        $$=\dfrac1\pi x^2\sin\pi x+\dfrac{2}{\pi^2}x\cos\pi x-\dfrac{2}{\pi^3}\sin\pi x+C$$
        이다.
      criteria: [2.B3]
    - id: 2b-4
      content: |
        따라서, $(*)=4\left[\dfrac1\pi x^2\sin\pi x+\dfrac{2}{\pi^2}x\cos\pi x-\dfrac{2}{\pi^3}\sin\pi x\right]_0^1+15=-\dfrac{8}{\pi^2}+15$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: 각 구간($[-4,-3)$, $[-3,-2)$, $[-2,-1)$)에서 함수의 형태를 바르게 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: 적분식을 계산하여 $(*)=4\displaystyle\int_0^1x^2\cos\pi x\,dx+15$를 바르게 얻었다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: '부정적분 $\displaystyle\int x^2\cos\pi x\,dx=\dfrac1\pi x^2\sin\pi x+\dfrac{2}{\pi^2}x\cos\pi x-\dfrac{2}{\pi^3}\sin\pi x+C$를 바르게 계산하여 정답 $-\dfrac{8}{\pi^2}+15$를 얻었다.'
      depends_on: []
      steps: [2b-3, 2b-4]
    deductions:
    - code: D2-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D2-2
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4610}
  misconceptions:
  - id: MC-CAL-4610
    outcome_code: '70'
    wrong_work: '$f(x)=\dfrac12f(x-2)-\dfrac32$를 그대로 써서 $[-4,-1]$의 값을 $[-6,-3]$의 값으로 표현하려 하거나 $f(x)=\dfrac12f(x+2)-\dfrac32$로 잘못 옮김'
    detect_cue: 구간별 식의 계수가 $2,4$가 아니라 $\dfrac12,\dfrac14$, 상수항이 $3,9$가 아님
    feedback: 알고 있는 구간은 $[-1,1]$이므로 $f(x)$를 오른쪽 값 $f(x+2)$로 나타내야 합니다. $f(x-2)=2f(x)+3$에서 $x$에 $x+2$를 대입하세요.
    remedy: [RL-2]

