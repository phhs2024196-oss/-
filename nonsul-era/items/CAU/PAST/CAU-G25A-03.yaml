  - '곡선 $y=e^x$는 직선 $2x-y-6=0$의 한쪽에만 있음 ⇒ 넓이 최소는 기울기 2인 접점 $(\ln2,2)$에서'
  - '$\angle\mathrm{BAD}=x$, $\angle\mathrm{DAC}=2x$ ⇒ $\dfrac12\cdot2\cdot1\cdot\sin3x=\dfrac12\cdot2f(x)\sin x+\dfrac12\cdot1\cdot f(x)\sin2x$'
