stimuli:
- label: '1'
  body: |
    점 $(x_1,y_1)$과 직선 $ax+by+c=0$ 사이의 거리는 다음과 같다.
    $$\dfrac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$$
- label: '2'
  body: |
    모든 실수 $\alpha$, $\beta$에 대하여 다음 식이 성립한다.
    $$\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$$
    $$\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$$
- label: '3'
  body: |
    미분가능한 함수 $g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속이고, $g(a)=\alpha$, $g(b)=\beta$에 대하여 함수 $f(x)$가 $\alpha$와 $\beta$를 양끝으로 하는 닫힌구간에서 연속일 때 다음 식이 성립한다.
    $$\int_a^b f(g(x))g'(x)\,dx=\int_\alpha^\beta f(t)\,dt$$

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    좌표평면 위에 점 $\mathrm A(3,0)$, $\mathrm B(4,2)$가 있다. 방정식 $y^3-3e^{2x}y+2e^{3x}=0$을 만족시키는 점 $\mathrm P(x,y)$에 대하여 삼각형 PAB의 넓이의 최솟값을 구하시오. (단, $y\ge0$이다.) [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '4-\ln2', equivalents: ['4-ln2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: P는 $y=e^x$ 위, 직선 AB $2x-y-6=0$과 평행한 접선의 접점 $(\ln2,2)$에서 거리 최소.
    steps:
    - {id: 1a, content: '거리 $\dfrac{8-2\ln2}{\sqrt5}$, 넓이 $\dfrac12\cdot\sqrt5\cdot\dfrac{8-2\ln2}{\sqrt5}=4-\ln2$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 방정식을 $y$에 대한 삼차식으로 보고 $y=e^x$를 대입해 보자.
    - 밑변 AB가 고정되어 있으니 높이(점과 직선 사이 거리)를 최소로 하자.
    - 곡선 위에서 직선 AB와 가장 가까운 점의 접선 기울기는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.53 예시답안
    steps:
    - id: 1b-1
      content: |
        $0=y^3-3e^{2x}y+2e^{3x}=(y-e^x)^2(y+2e^x)$이므로 $\mathrm P(x,y)$는 $y=e^x$ 또는 $y=-2e^x$ 위에 있다. $y\ge0$이므로 $y=e^x$ 위에 있다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        두 점 A, B를 지나는 직선의 방정식은 $2x-y-6=0$이다. $y=e^x$에서 기울기가 2인 점은 $(\ln2,\ 2)$이고,
      criteria: [1.B2]
    - id: 1b-3
      content: |
        이 점에서 직선 $2x-y-6=0$까지의 거리는 $\dfrac{8-2\ln2}{\sqrt5}$이다. $\overline{\mathrm{AB}}=\sqrt5$이므로 삼각형의 넓이의 최솟값은 $4-\ln2$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: 인수분해를 하여 $y=e^x$를 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: 점 $(\ln2,\ 2)$를 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: 거리 $\dfrac{8-2\ln2}{\sqrt5}$를 구하고 삼각형의 넓이 $4-\ln2$를 구했다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D1-2
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-4611}
  misconceptions:
  - id: MC-ALG-4611
    outcome_code: '70'
    wrong_work: '$y=-2e^x$ 분지까지 후보로 두거나, 인수분해 없이 음함수 미분으로 접점을 찾다가 분지를 판별하지 못함'
    detect_cue: $y=-2e^x$ 위의 점에서의 거리 계산이 답에 섞임, $y\ge0$ 조건 언급 없음
    feedback: 삼차식은 $(y-e^x)^2(y+2e^x)$로 인수분해됩니다. $y\ge0$이면 $y=-2e^x$ 분지는 제외됩니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $\overline{\mathrm{AB}}=2$, $\overline{\mathrm{AC}}=1$이고 $\angle\mathrm{BAC}=3x$인 삼각형 ABC가 있다. 선분 BC 위의 점 D를 $\angle\mathrm{BAD}=x$가 되도록 잡자. 선분 AD의 길이를 $f(x)$라 할 때, 정적분 $\displaystyle\int_{\frac\pi6}^{\frac\pi4}f(x)\sin^3x\,dx$의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{\sqrt2}{6}-\dfrac{3}{16}', equivalents: ['sqrt(2)/6-3/16'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 넓이 분할로 $f(x)=\dfrac{4\cos^2x-1}{1+\cos x}$, $\sin^3x\,dx$를 $\cos x=y$로 치환하면 $(4y^2-1)(1-y)$의 다항식 적분.
    steps:
    - {id: 2a, content: '$\displaystyle\int_{\sqrt2/2}^{\sqrt3/2}(4y^2-1)(1-y)\,dy=\dfrac{\sqrt2}{6}-\dfrac{3}{16}$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 삼각형 ABC를 AD로 나눈 두 삼각형의 넓이 합을 식으로 쓰자.
    - $\sin3x=\sin(x+2x)$로 전개하면 $\sin x$가 공통인수로 나온다.
    - $\sin^3x=\sin x(1-\cos^2x)$로 보고 $\cos x$를 치환하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.53 예시답안
    steps:
    - id: 2b-1
      content: |
        두 삼각형의 넓이의 합이 전체 삼각형의 넓이와 같다는 것을 이용하면
        $$2\sin3x=2f(x)\sin x+f(x)\sin2x$$
      criteria: [2.B1]
    - id: 2b-2
      content: |
        이고 $\sin3x=\sin(x+2x)=\sin x\cos2x+\cos x\sin2x$를 이용하여 정리하면
        $$f(x)=\dfrac{4\cos^2x-1}{1+\cos x}$$
        이다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        $\cos x=y$로 치환하여 적분하면 아래와 같다.
        $$\int_{\frac\pi6}^{\frac\pi4}\dfrac{4\cos^2x-1}{1+\cos x}\sin^3x\,dx=\int_{\frac{\sqrt2}2}^{\frac{\sqrt3}2}\dfrac{4y^2-1}{y+1}(1-y^2)\,dy=\int_{\frac{\sqrt2}2}^{\frac{\sqrt3}2}(4y^2-1)(1-y)\,dy=\dfrac{\sqrt2}{6}-\dfrac{3}{16}$$
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 4
      evidence: $2\sin3x=2f(x)\sin x+f(x)\sin2x$를 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 4
      evidence: $f(x)=\dfrac{4\cos^2x-1}{1+\cos x}$를 구했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 7
      evidence: 정적분 값 $\dfrac{\sqrt2}{6}-\dfrac{3}{16}$을 구했다.
      depends_on: []
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D2-2
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4612}
  misconceptions:
  - id: MC-CAL-4612
    outcome_code: '70'
    wrong_work: '넓이 등식은 세웠으나 $\sin3x$를 전개하지 못해 $f(x)=\dfrac{2\sin3x}{2\sin x+\sin2x}$에서 멈추고 적분을 시도하지 못함'
    detect_cue: $f(x)$가 $\cos x$만의 식으로 정리되지 않음
    feedback: '$\sin3x=\sin x\cos2x+\cos x\sin2x=\sin x(4\cos^2x-1)$, $2\sin x+\sin2x=2\sin x(1+\cos x)$로 전개하면 $\sin x$가 약분됩니다.'
    remedy: [RL-2]

