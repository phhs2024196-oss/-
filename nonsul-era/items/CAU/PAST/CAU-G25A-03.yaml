intent: '함수의 미분과 적분을 문제에 맞게 구사하는지, 점과 직선 사이의 거리와 삼각함수의 기본 연산을 이해하는지 본다. [3-1] 주어진 방정식의 그래프를 이해하고 미분으로 직선에 가장 가까운 점을 찾아 삼각형 넓이의 최솟값을 구하는지, [3-2] 상황에 맞는 함수를 구성하고 정적분할 수 있는지를 평가한다(문항카드 출제 의도 요지).'
key_idea: '[3-1] $y^3-3e^{2x}y+2e^{3x}=(y-e^x)^2(y+2e^x)$이므로 $y\ge0$에서 P는 $y=e^x$ 위. 넓이 최소 ⇔ 직선 AB까지 거리 최소 ⇔ 기울기 2인 접점. [3-2] △ABC=△ABD+△ADC 에서 $f(x)=\dfrac{4\cos^2x-1}{1+\cos x}$, 이후 $\cos x=y$ 치환.'
stuck: '[3-1] $y$에 대한 삼차식을 인수분해하는 단계 / [3-2] 넓이 분할 등식을 세우고 $\sin3x$를 덧셈정리로 전개해 $\sin x$로 나누는 단계'
