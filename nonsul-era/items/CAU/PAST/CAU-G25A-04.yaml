stimuli:
- label: '1'
  body: |
    평면 $\alpha$ 위에 있지 않은 점 P, 평면 $\alpha$ 위의 점 O, 점 O를 지나지 않는 $\alpha$ 위의 직선 $l$, 직선 $l$ 위의 점 H에 대하여 $\overline{\mathrm{PO}}\perp\alpha$, $\overline{\mathrm{OH}}\perp l$이면 $\overline{\mathrm{PH}}\perp l$이다.
- label: '2'
  body: |
    쌍곡선 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$의 점근선의 방정식은 $y=\dfrac bax$, $y=-\dfrac bax$이다.
- label: '3'
  body: |
    쌍곡선 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$ 위의 점 $\mathrm P(x_1,y_1)$에서의 접선의 방정식은 $\dfrac{x_1x}{a^2}-\dfrac{y_1y}{b^2}=1$이다.

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    그림과 같이 한 모서리의 길이가 2인 정육면체 ABCD−EFGH의 선분 AB, AD 위에 점 P, Q가 각각 놓여 있다. 삼각형 PEG, QEG의 넓이가 각각 $\sqrt{10}$과 3일 때, 삼각형 EPQ의 넓이를 구하시오. [15점]

    (그림: 윗면 ABCD, 아랫면 EFGH인 정육면체에서 A 아래에 E, B 아래에 F, C 아래에 G, D 아래에 H가 있고, 점 P는 모서리 AB 위, 점 Q는 모서리 AD 위에 있으며 삼각형 PEG, QEG, EPQ가 그려져 있다.)
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{\sqrt{14}}{2}', equivalents: ['sqrt(14)/2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 삼수선의 정리로 P, Q에서 EG까지의 거리 $\sqrt5$, $\dfrac{3}{\sqrt2}$ → $\overline{\mathrm{AP}}=\sqrt2$, $\overline{\mathrm{AQ}}=1$ → $\overline{\mathrm{AR}}=\dfrac{\sqrt2}{\sqrt3}$, $\overline{\mathrm{ER}}=\dfrac{\sqrt{14}}{\sqrt3}$.
    steps:
    - {id: 1a, content: '△EPQ $=\dfrac12\times\overline{\mathrm{PQ}}\times\overline{\mathrm{ER}}=\dfrac12\times\sqrt3\times\dfrac{\sqrt{14}}{\sqrt3}=\dfrac{\sqrt{14}}{2}$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - P에서 아랫면에 내린 수선의 발은 모서리 EF 위에 있다. 그 점에서 EG에 수선을 내려 보자.
    - △PEG의 넓이로 P와 직선 EG 사이의 거리를 구할 수 있다.
    - △EPQ의 높이는 E에서 PQ까지의 거리다. A에서 PQ에 내린 수선의 발을 이용하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.54 예시답안
    steps:
    - id: 1b-1
      content: |
        그림 (가), (나)와 같이 점 P, Q에서 선분 EF, EH에 내린 수선의 발을 각각 K, M이라고 하고 점 K, M에서 선분 EG에 내린 수선의 발을 각각 L, N이라고 하자. 삼수선의 정리에 의하여 $\overline{\mathrm{PL}}\perp\overline{\mathrm{EG}}$이고 $\overline{\mathrm{QN}}\perp\overline{\mathrm{EG}}$이다.
      criteria: []
    - id: 1b-2
      content: |
        직각이등변삼각형 EFG에서 $\overline{\mathrm{EG}}=2\sqrt2$이므로 $\sqrt{10}=\triangle\mathrm{PEG}=\dfrac{\overline{\mathrm{EG}}\times\overline{\mathrm{PL}}}{2}$에서 $\overline{\mathrm{PL}}=\sqrt5$이고
        $3=\triangle\mathrm{QEG}=\dfrac{\overline{\mathrm{EG}}\times\overline{\mathrm{QN}}}{2}$에서 $\overline{\mathrm{QN}}=\dfrac{3}{\sqrt2}$이다.
      criteria: []
    - id: 1b-3
      content: |
        직각삼각형 PKL, QMN에서 $\overline{\mathrm{KL}}=\sqrt{\overline{\mathrm{PL}}^2-\overline{\mathrm{PK}}^2}=1$이고 $\overline{\mathrm{MN}}=\sqrt{\overline{\mathrm{QN}}^2-\overline{\mathrm{QM}}^2}=\dfrac{1}{\sqrt2}$이다.
      criteria: []
    - id: 1b-4
      content: |
        직각이등변삼각형 KLE, ENM에서 $\overline{\mathrm{AP}}=\overline{\mathrm{EK}}=\sqrt{\overline{\mathrm{EL}}^2+\overline{\mathrm{KL}}^2}=\sqrt{\overline{\mathrm{KL}}^2+\overline{\mathrm{KL}}^2}=\sqrt2$와
      criteria: [1.B1]
    - id: 1b-5
      content: |
        $\overline{\mathrm{AQ}}=\overline{\mathrm{EM}}=\sqrt{\overline{\mathrm{EN}}^2+\overline{\mathrm{MN}}^2}=\sqrt{\overline{\mathrm{MN}}^2+\overline{\mathrm{MN}}^2}=1$을 얻는다.
      criteria: [1.B2]
    - id: 1b-6
      content: |
        그림 (다)와 같이 점 A에서 선분 PQ에 내린 수선의 발을 R라 하면 $\overline{\mathrm{PQ}}\perp\overline{\mathrm{ER}}$이다.
        직각삼각형 QAP에서 $\overline{\mathrm{PQ}}=\sqrt{\overline{\mathrm{AP}}^2+\overline{\mathrm{AQ}}^2}=\sqrt3$이므로 $\dfrac{\sqrt2}{2}=\dfrac{\overline{\mathrm{AP}}\times\overline{\mathrm{AQ}}}{2}=\triangle\mathrm{APQ}=\dfrac{\overline{\mathrm{PQ}}\times\overline{\mathrm{AR}}}{2}$에서 $\overline{\mathrm{AR}}=\dfrac{\sqrt2}{\sqrt3}$이다.
        직각삼각형 RAE에서 $\overline{\mathrm{ER}}=\sqrt{\overline{\mathrm{AR}}^2+\overline{\mathrm{AE}}^2}=\dfrac{\sqrt{14}}{\sqrt3}$이므로
        $$\triangle\mathrm{EPQ}=\dfrac12\times\overline{\mathrm{PQ}}\times\overline{\mathrm{ER}}=\dfrac{\sqrt{14}}{2}$$
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: $\overline{\mathrm{AP}}=\sqrt2$를 구했다.
      depends_on: []
      steps: [1b-4]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: $\overline{\mathrm{AQ}}=1$을 구했다.
      depends_on: []
      steps: [1b-5]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: △EPQ $=\dfrac{\sqrt{14}}{2}$를 구했다.
      depends_on: []
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D1-2
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4613}
  misconceptions:
  - id: MC-GEO-4613
    outcome_code: '70'
    wrong_work: '△PEG의 높이를 P에서 아랫면까지의 거리 2로 보거나, △EPQ의 높이를 $\overline{\mathrm{AE}}=2$로 두어 넓이를 $\overline{\mathrm{PQ}}$로만 계산'
    detect_cue: '$\dfrac{2\sqrt2\times2}{2}=2\sqrt2\neq\sqrt{10}$ 같은 모순을 무시, △EPQ $=\sqrt3$'
    feedback: 삼각형의 높이는 꼭짓점에서 밑변을 포함한 직선까지의 거리입니다. 수선의 발을 밑면에 내린 뒤 다시 직선에 수선을 내려 삼수선의 정리로 수직임을 확인하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    두 초점이 $\mathrm F(c,0)$, $\mathrm F^\prime(-c,0)\ (c>0)$인 쌍곡선 $x^2-3y^2=1$ 위의 점 $\mathrm P(a,b)\ (a>0,\ b>0)$에서의 접선이 $y$축과 만나는 점을 Q, 쌍곡선의 점근선 중 기울기가 양수인 직선과 만나는 점을 R라 하자. 삼각형 OQR의 넓이를 $x$축이 이등분할 때, 점 F와 직선 F′P 사이의 거리를 구하시오. (단, O는 원점이다.) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{4\sqrt3}{21}', equivalents: ['4/(7*sqrt(3))', '4*sqrt(3)/21'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '접선 $ax-3by=1$의 $x$절편 S$\left(\dfrac1a,0\right)$, R의 $x$좌표 $\dfrac{1}{a-\sqrt3b}$. △OQR=2△OQS ⇒ $a=2\sqrt3b$ ⇒ P$\left(\dfrac{2\sqrt3}3,\dfrac13\right)$, $x$좌표가 $c$와 같아 FP ⊥ FF′.'
    steps:
    - {id: 2a, content: '$\overline{\mathrm{FP}}=\dfrac13$, $\overline{\mathrm{F^\prime P}}=\dfrac73$, $\overline{\mathrm{F^\prime F}}=\dfrac{4\sqrt3}3$ ⇒ 거리 $=\dfrac{\overline{\mathrm{F^\prime F}}\times\overline{\mathrm{FP}}}{\overline{\mathrm{F^\prime P}}}=\dfrac{4\sqrt3}{21}$', criteria: [2.B1, 2.B2, 2.B3, 2.B4]}
    hint_ladder:
    - Q는 $y$축 위에 있으니 두 삼각형 OQR, OQS의 공통 밑변을 OQ로 보자.
    - 넓이가 이등분되면 R의 $x$좌표와 S의 $x$좌표는 어떤 관계인가?
    - 쌍곡선의 정의 $\lvert\overline{\mathrm{PF^\prime}}-\overline{\mathrm{PF}}\rvert=2$를 이용하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.55 예시답안
    steps:
    - id: 2b-1
      content: |
        $c=\sqrt{1+\dfrac13}=\dfrac{2\sqrt3}{3}$에서 두 초점 F, F′의 좌표는 각각 $\left(\dfrac{2\sqrt3}{3},0\right)$, $\left(-\dfrac{2\sqrt3}{3},0\right)$이므로 $\overline{\mathrm{F^\prime F}}=\dfrac{4\sqrt3}{3}$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        점 P에서의 접선의 방정식 $ax-3by=1$과 점근선의 방정식 $y=\dfrac{1}{\sqrt3}x$를 연립하여 점 R의 $x$좌표가 $\dfrac{1}{a-\sqrt3b}$임을 알 수 있다. 접선 $ax-3by=1$이 $x$축과 만나는 점을 S라 할 때, 점 S의 $x$좌표는 $\dfrac1a$이다.
        $$\dfrac12\times\overline{\mathrm{OQ}}\times(\text{점 R의 }x\text{좌표})=\triangle\mathrm{OQR}=2\triangle\mathrm{OQS}=2\times\dfrac12\times\overline{\mathrm{OQ}}\times(\text{점 S의 }x\text{좌표})$$
        에서 $a=2\sqrt3b$를 얻는다.
      criteria: []
    - id: 2b-3
      content: |
        점 $\mathrm P(a,b)$가 쌍곡선 위의 점이므로 $a^2-3b^2=1$이므로 $a=2\sqrt3b$를 대입하여 $a=\dfrac{2\sqrt3}{3}$, $b=\dfrac13$이다.
      criteria: [2.B2, 2.B3]
    - id: 2b-4
      content: |
        따라서 $\overline{\mathrm{FP}}=\dfrac13$, $\overline{\mathrm{F^\prime P}}=2+\overline{\mathrm{FP}}=2+\dfrac13=\dfrac73$이고 삼각형 F′FP은 직각삼각형이다.
        점 F에서 직선 F′P에 내린 수선의 발을 H라 하면 $\overline{\mathrm{FH}}\times\overline{\mathrm{F^\prime P}}=2\times\triangle\mathrm{F^\prime FP}=\overline{\mathrm{F^\prime F}}\times\overline{\mathrm{FP}}$에서 $\overline{\mathrm{FH}}=\dfrac{4\sqrt3}{21}$을 얻는다.
        따라서 점 F와 직선 F′P 사이의 거리는 $\dfrac{4\sqrt3}{21}$이다.
      criteria: [2.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: $c=\dfrac{2\sqrt3}{3}$을 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: $a=\dfrac{2\sqrt3}{3}$을 구했다.
      depends_on: []
      steps: [2b-3]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: $b=\dfrac13$을 구했다.
      depends_on: []
      steps: [2b-3]
    - id: 2.B4
      mark_type: B
      points: 6
      evidence: 점 F와 직선 F′P 사이의 거리 $\dfrac{4\sqrt3}{21}\left(=\dfrac{4}{7\sqrt3}\right)$를 구했다.
      depends_on: []
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D2-2
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4614}
  misconceptions:
  - id: MC-GEO-4614
    outcome_code: '70'
    wrong_work: '타원처럼 $c^2=1-\dfrac13$으로 두어 $c=\dfrac{\sqrt6}{3}$을 쓰거나, $\overline{\mathrm{F^\prime P}}+\overline{\mathrm{FP}}=2$로 계산'
    detect_cue: $c=\dfrac{\sqrt6}3$, 또는 $\overline{\mathrm{F^\prime P}}=\dfrac53$
    feedback: 쌍곡선 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$의 초점은 $c^2=a^2+b^2$이고, 정의는 두 초점까지 거리의 차가 $2a$입니다.
    remedy: [RL-2]

