stimuli: []

stem: |
  다음 규칙에 따라 상금을 받는 시행을 한다. 풀이와 함께 물음에 답하시오.

  (가) 주머니 A에는 빨간색 공 1개가 들어 있고, 주머니 B에는 파란색 공 5개가 들어 있다. 두 주머니의 공을 주머니 C에 합친 후 임의로 1개를 꺼내서 그 공이 빨간색 공일 때 100만 원의 상금을 받는다. 만일 파란색 공을 꺼낸 경우 상금은 0원이다.
  (나) 주머니 C에 합치기 전에, 회당 2만 원의 비용을 지불하면 주머니 A 또는 B를 선택한 후 선택한 주머니에서 임의로 1개의 공을 택하여 제거한다.
  (다) (나)는 최대 2회 가능하며, $k\ (k=1\text{ 또는 }2)$번째에서 주머니를 선택하는 규칙은 다음과 같다.
    − 주머니 A를 선택할 확률은 $\dfrac ak$이고, 주머니 B를 선택할 확률은 $1-\dfrac ak$이다.
    − 주머니 A에 공이 없는 경우 주머니 B에서 공을 택한다.
  (라) 공을 제거할 때 지불하는 비용은 상금에서 차감된다. 따라서 상금의 값은 음수가 될 수 있다.

  위 시행에서 공을 2회 제거할 때의 상금의 기댓값이 공을 1회 제거할 때의 상금의 기댓값보다 크거나 같도록 하는 $a$의 최댓값을 구하시오. (단, $0<a<1$이다.) [20점]

subparts:
- id: '1'
  stem: |
    공을 2회 제거할 때의 상금의 기댓값이 공을 1회 제거할 때의 상금의 기댓값보다 크거나 같도록 하는 $a$의 최댓값을 구하시오. (단, $0<a<1$이다.)
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac15', equivalents: ['1/5', '0.2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$E(X)=100P(\text{빨강 남음, 그리고 뽑힘})-2=-20a+18$, $E(Y)=\dfrac{25}{2}a^2-\dfrac{75}{2}a+21$.'
    steps:
    - {id: 1a, content: '$E(Y)\ge E(X)\iff(5a-1)(5a-6)\ge0$, $0<a<1$에서 $a\le\dfrac15$, 최댓값 $\dfrac15$', criteria: [1.B1, 1.B2, 1.B3, 1.B4, 1.B5, 1.B6]}
    hint_ladder:
    - 상금은 빨간 공이 제거되었는지에 따라 달라진다. 이 사건으로 나누어 보자.
    - 2회 제거 후 빨간 공이 남아 있을 확률은?
    - 기댓값을 비교한 식은 $a$에 대한 이차부등식이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.60~61 예시답안
    steps:
    - id: 1b-1
      content: |
        (1) 공을 1회 제거할 때의 상금을 $X$(단위: 만 원)라고 하자. $X$가 가질 수 있는 값은 $-2$ 또는 98이므로, 각각에 대한 확률을 구한다. $X=-2$인 사건을 $A$, $X=98$인 사건을 $B$라 하자.
      criteria: []
    - id: 1b-2
      content: |
        (2) $P(A)$는 파란색 공을 꺼낼 확률과 같다. 파란색 공을 꺼내는 사건은 1) 빨간색 공이 제거되어 선택하지 못하는 사건과 2) 빨간색 공이 남아 있지만 꺼내지 못하는 사건으로 나눌 수 있다. 따라서 빨간색 공이 제거된 사건을 $E$라고 하면, 확률의 덧셈정리와 곱셈정리에 의해 $P(A)$는 다음과 같이 구할 수 있다.
        $$P(A)=P(E)P(A\mid E)+P(E^c)P(A\mid E^c)$$
      criteria: []
    - id: 1b-3
      content: |
        (3) 문제의 조건에 의해 $P(E)=a$이다. 빨간색 공이 제거되었다면 조건에 의해 선택할 수 없으므로 $P(A\mid E)=1$이다. 빨간색 공이 제거되지 않았다면 남아 있는 5개의 공 중에 파란색 공이 4개이므로 $P(A\mid E^c)=\dfrac45$이다. 따라서
        $$P(A)=(a\times1)+\left\{(1-a)\times\dfrac45\right\}=\dfrac15a+\dfrac45$$
        이다.
      criteria: [1.B1]
    - id: 1b-4
      content: |
        (4) 빨간색 공이 제거되었다면 조건에 의해 선택할 수 없으므로 $P(B\mid E)=0$이다. 빨간색 공이 제거되지 않았다면 남아 있는 5개의 공 중에 빨간색 공이 1개이므로 $P(B\mid E^c)=\dfrac15$이다. 따라서 $P(B)=(a\times0)+\left\{(1-a)\times\dfrac15\right\}=-\dfrac15a+\dfrac15$이다. 혹은, $X=-2$인 사건과 $X=98$인 사건은 여사건이므로, $P(B)=1-P(A)=-\dfrac15a+\dfrac15$임을 간단하게 구할 수 있다.
      criteria: [1.B1]
    - id: 1b-5
      content: |
        (5) 따라서, 1개의 공을 제거할 때의 상금의 기댓값은 다음과 같다.
        $$E(X)=\{(-2)\times P(A)\}+\{98\times P(B)\}=\left\{(-2)\times\left(\dfrac15a+\dfrac45\right)\right\}+\left\{98\times\left(-\dfrac15a+\dfrac15\right)\right\}=(-100)\times\dfrac15a+\dfrac{90}{5}=-20a+18$$
      criteria: [1.B3]
    - id: 1b-6
      content: |
        (6) 공을 2회 제거할 때의 상금을 $Y$(단위: 만 원)라고 하자. $Y$가 가질 수 있는 값은 $-4$ 또는 96이다. $Y=-4$인 사건을 $C$, $Y=96$인 사건을 $D$라 하자.
        (7) $P(C)$는 파란색 공을 꺼낼 확률과 같으므로, 빨간색 공이 제거된 사건을 $F$라고 하면 $P(C)$는 다음과 같이 구할 수 있다.
        $$P(C)=P(F)P(C\mid F)+P(F^c)P(C\mid F^c)$$
      criteria: []
    - id: 1b-7
      content: |
        (8) 빨간색 공이 제거되지 않을 확률은 $P(F^c)=(1-a)\left(1-\dfrac a2\right)=\dfrac12a^2-\dfrac32a+1$이다. 따라서 $P(F)=1-P(F^c)=-\dfrac12a^2+\dfrac32a$이다.
        (9) 빨간색 공이 제거되었다면 조건에 의해 선택할 수 없으므로 $P(C\mid F)=1$이다. 빨간색 공이 제거되지 않았다면 남아 있는 4개의 공 중에 파란색 공이 3개이므로 $P(C\mid F^c)=\dfrac34$이다. 따라서
        $$P(C)=\left\{\left(-\dfrac12a^2+\dfrac32a\right)\times1\right\}+\left\{\left(\dfrac12a^2-\dfrac32a+1\right)\times\dfrac34\right\}=-\dfrac18a^2+\dfrac38a+\dfrac34$$
        이다.
      criteria: [1.B2]
    - id: 1b-8
      content: |
        (10) 빨간색 공이 제거되었다면 조건에 의해 선택할 수 없으므로 $P(D\mid F)=0$이다. 빨간색 공이 제거되지 않았다면 남아 있는 4개의 공 중에 빨간색 공이 1개이므로 $P(D\mid F^c)=\dfrac14$이다. 따라서
        $$P(D)=\left\{\left(-\dfrac12a^2+\dfrac32a\right)\times0\right\}+\left\{\left(\dfrac12a^2-\dfrac32a+1\right)\times\dfrac14\right\}=\dfrac18a^2-\dfrac38a+\dfrac14$$
        이다. 혹은, (4)와 마찬가지로 $P(D)=1-P(C)=\dfrac18a^2-\dfrac38a+\dfrac14$임을 간단하게 구할 수도 있다.
      criteria: [1.B2]
    - id: 1b-9
      content: |
        (11) 따라서, 공을 2회 제거할 때의 상금의 기댓값은 다음과 같다.
        $$E(Y)=\{(-4)\times P(C)\}+\{96\times P(D)\}=\left\{(-4)\times\left(-\dfrac18a^2+\dfrac38a+\dfrac34\right)\right\}+\left\{96\times\left(\dfrac18a^2-\dfrac38a+\dfrac14\right)\right\}$$
        $$=(100)\times\left(\dfrac18a^2-\dfrac38a\right)+\dfrac{84}{4}=\dfrac{25}{2}a^2-\dfrac{75}{2}a+21$$
      criteria: [1.B4]
    - id: 1b-10
      content: |
        (12) 조건을 만족하는 $a$의 최댓값을 구하기 위해서 다음의 2차 부등식을 풀면 된다.
        $$E(Y)\ge E(X)\iff\dfrac{25}{2}a^2-\dfrac{75}{2}a+21\ge-20a+18\iff25a^2-35a+6\ge0\iff(5a-1)(5a-6)\ge0$$
      criteria: [1.B5]
    - id: 1b-11
      content: |
        따라서, $0<a<1$을 만족하는 $a$의 최댓값은 $\dfrac15$이다.
      criteria: [1.B6]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2026 논술가이드북(자연) p.62 별해
    key_idea: 비용은 확률 1로 발생하므로 기댓값에서 그대로 빼면 된다.
    steps:
    - id: 1c-1
      content: |
        (1) 제거를 1회 할 때, 2만 원의 비용은 1의 확률로 발생한다. 따라서
        $$E(X)=100\times P(B)-2=100\times\left(-\dfrac15a+\dfrac15\right)-2=-20a+18$$
        이다.
      criteria: [1.B3]
    - id: 1c-2
      content: |
        (2) 제거를 2회 할 때, 4만 원의 비용은 1의 확률로 발생한다. 따라서
        $$E(Y)=100\times P(D)-4=100\times\left(\dfrac18a^2-\dfrac38a+\dfrac14\right)-4=\dfrac{25}{2}a^2-\dfrac{75}{2}a+21$$
        이다.
      criteria: [1.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: $P(A)=\dfrac15a+\dfrac45$ 또는 $P(B)=-\dfrac15a+\dfrac15$를 정확히 계산했다.
      depends_on: []
      steps: [1b-3, 1b-4]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: $P(C)=-\dfrac18a^2+\dfrac38a+\dfrac34$ 또는 $P(D)=\dfrac18a^2-\dfrac38a+\dfrac14$를 정확히 계산했다.
      depends_on: []
      steps: [1b-7, 1b-8]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: $X$의 기댓값 $-20a+18$을 정확히 계산했다.
      depends_on: []
      steps: [1b-5, 1c-1]
    - id: 1.B4
      mark_type: B
