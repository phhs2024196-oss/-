  - {code: '70', misconception: MC-PRB-4615}
  - {code: '71', misconception: MC-ALG-4616}
  misconceptions:
  - id: MC-PRB-4615
    outcome_code: '70'
    wrong_work: '2회째에도 A를 택할 확률을 $\dfrac a2$로 두고 빨간 공 제거 확률을 $a+\dfrac a2$로 더함(1회째에 이미 제거된 경우를 구분하지 않음)'
    detect_cue: $P(F)=\dfrac32a$, 또는 $P(F^c)$에 $(1-a)\left(1-\dfrac a2\right)$가 없음
