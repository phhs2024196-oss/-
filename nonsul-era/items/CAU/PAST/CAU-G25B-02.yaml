stimuli:
- label: '1'
  body: |
    함수 $y=f(x)$의 $x=a$에서의 미분계수는 다음과 같다.
    $$f^\prime(a)=\lim_{x\to a}\dfrac{f(x)-f(a)}{x-a}$$
- label: '2'
  body: |
    함수 $f(x)$가 어떤 구간에서 $f^{\prime\prime}(x)>0$이면 곡선 $y=f(x)$는 이 구간에서 아래로 볼록하다.
- label: '3'
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 방정식은 다음과 같다.
    $$y-f(a)=f^\prime(a)(x-a)$$
- label: '4'
  body: |
    두 수 $\alpha$, $\beta$를 근으로 하고 $x^2$의 계수가 1인 이차방정식은 다음과 같다.
    $$x^2-(\alpha+\beta)x+\alpha\beta=0$$
- label: '5'
  body: |
    미분가능한 함수 $g(t)$에 대하여 $x=g(t)$로 놓으면 $\displaystyle\int f(x)\,dx=\int f(g(t))g^\prime(t)\,dt$이다.

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    최고차항의 계수가 1인 삼차함수 $f(x)$가 다음 조건을 만족시킬 때, $f^\prime\left(\dfrac13\right)$의 값을 구하시오. [10점]

    (가) $\displaystyle\lim_{x\to1}\dfrac{e^{f(x)}-e}{x-1}=0$이다.
    (나) $f^{\prime\prime}(-1)>0$이다.
    (다) 닫힌구간 $[-1,0]$에서 곡선 $y=f(x)$ 위의 점 $(-1,f(-1))$에서의 접선과 곡선 $y=f(x)$ 및 $y$축으로 둘러싸인 도형의 넓이는 $\dfrac{53}{12}$이다.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-\dfrac{70}{3}', equivalents: ['-70/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)-1=(x-1)^2(x-b)$, 접선 $y=4(b+2)x+5$, 넓이 $-\left(\dfrac{17}{12}+\dfrac b3\right)=\dfrac{53}{12}$에서 $b=-\dfrac{35}2$.
    steps:
    - {id: 1a, content: '$f^\prime(x)=(x-1)(3x+34)$이므로 $f^\prime\left(\dfrac13\right)=-\dfrac{70}{3}$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - 분자가 0으로 가야 하므로 $f(1)$은?
    - $g(x)=e^{f(x)}$로 두면 (가)는 $g^\prime(1)$에 관한 식이다.
    - 아래로 볼록인 곡선과 접선 중 어느 쪽이 위에 있는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.63 예시답안
    steps:
    - id: 1b-1
      content: |
        극한 $\displaystyle\lim_{x\to1}\dfrac{e^{f(x)}-e}{x-1}$이 존재하므로, $f(1)=1$이다.
        $g(x)=e^{f(x)}$라 놓으면, $g^\prime(x)=f^\prime(x)e^{f(x)}$이고, 주어진 조건으로부터
        $g^\prime(1)=\displaystyle\lim_{x\to1}\dfrac{g(x)-g(1)}{x-1}=0$이므로, $f^\prime(1)=0$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        따라서, $x=1$이 $f(x)-1=0$의 중근임을 알 수 있다. 최고차항의 계수가 1인 삼차함수는 $f(x)-1=(x-1)^2(x-b)$로 놓을 수 있다.
        $f^\prime(x)=(x-1)(3x-2b-1)$이므로, $f^\prime(-1)=4(b+2)$이고, $f(-1)=-4b-3$이다.
        그러므로, 점 $(-1,f(-1))$에서 접선의 방정식은 $y=4(b+2)x+5$이다.
        제시문에 의해 $x=-1$을 포함하는 어떤 구간에서 $y=f(x)$가 아래로 볼록이므로 접선의 방정식이 $y=f(x)$의 그래프보다 아래에 있고,
      criteria: [1.B2]
    - id: 1b-3
      content: |
        둘러싸인 도형의 넓이는
        $$\int_{-1}^0\{(x-1)^2(x-b)-4(b+2)x-4\}\,dx=\left[\dfrac{x^4}{4}-\dfrac{b+2}{3}x^3-\dfrac{2b+7}{2}x^2-(b+4)x\right]_{x=-1}^{0}=-\left(\dfrac{17}{12}+\dfrac b3\right)$$
        이다. 따라서, $b=-\dfrac{35}{2}$이다.
      criteria: [1.B3]
    - id: 1b-4
      content: |
        이를 대입하면 $f^\prime(x)=(x-1)(3x+34)$이므로, $f^\prime\left(\dfrac13\right)=-\dfrac{70}{3}$이다.
      criteria: [1.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: $f^\prime(1)=0$을 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: 접선의 방정식을 얻고 $f^{\prime\prime}(-1)>0$을 이용하여 접선이 $y=f(x)$ 아래에 있음을 얻었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: 도형의 넓이를 바르게 계산하여 $b=-\dfrac{35}{2}$를 얻었다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B4
      mark_type: B
      points: 2
      evidence: $f^\prime\left(\dfrac13\right)=-\dfrac{70}{3}$을 구했다.
      depends_on: []
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D1-2
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4617}
  misconceptions:
  - id: MC-CAL-4617
    outcome_code: '70'
    wrong_work: '(가)에서 $f(1)=1$만 얻고 $f^\prime(1)=0$을 쓰지 않아 미지수가 남아 $f$를 결정하지 못함'
    detect_cue: $f(x)=x^3+px^2+qx+r$에서 조건식이 2개뿐, 중근 인수분해가 없음
    feedback: '$\dfrac{e^{f(x)}-e}{x-1}$은 $g(x)=e^{f(x)}$의 평균변화율입니다. 그 극한이 0이면 $g^\prime(1)=f^\prime(1)e=0$이므로 $f^\prime(1)=0$입니다.'
    remedy: [RL-1]

- id: '2'
  stem: |
    좌표평면 위의 곡선 $y=x^2$과 직선 $y=\dfrac{1}{t+1}x+e^{\frac{t^2-2}{t+1}}$ (단, $t>-1$)가 만나는 서로 다른 두 점을 각각 P, Q라 할 때, 선분 PQ를 한 변으로 하는 정삼각형의 넓이를 $S(t)$라 하자. 정적분 $\displaystyle\int_0^1S(t)\,dt$의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{19\sqrt3}{96}+\sqrt3\left(e^{-\frac12}-e^{-2}\right)', equivalents: ['19*sqrt(3)/96+sqrt(3)*(exp(-1/2)-exp(-2))', '\dfrac{\sqrt3}{4}\left(\dfrac{19}{24}+4e^{-\frac12}-4e^{-2}\right)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{PQ}}^2=\left(\dfrac1{(t+1)^2}+1\right)\left(\dfrac1{(t+1)^2}+4e^{\frac{t^2-2}{t+1}}\right)$, 지수의 도함수가 $1+\dfrac1{(t+1)^2}$이라 바로 적분된다.
    steps:
    - {id: 2a, content: '$\dfrac{\sqrt3}{4}\left[-\dfrac{1}{3(t+1)^3}-\dfrac1{t+1}+4e^{t-1-\frac1{t+1}}\right]_0^1=\dfrac{19}{96}\sqrt3+\sqrt3\left(e^{-\frac12}-e^{-2}\right)$', criteria: [2.B1, 2.B2, 2.B3, 2.B4]}
    hint_ladder:
    - 두 교점의 $x$좌표를 $\alpha,\beta$로 두고 근과 계수의 관계를 쓰자.
    - P, Q가 $y=x^2$ 위에 있으니 $\overline{\mathrm{PQ}}^2$을 $\alpha-\beta$와 $\alpha+\beta$로 나타내자.
    - '$\dfrac{t^2-2}{t+1}$을 $t-1-\dfrac{1}{t+1}$로 나누고 미분해 보자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.64 예시답안
    steps:
    - id: 2b-1
      content: |
        곡선 $y=x^2$과 직선 $y=\dfrac1{t+1}x+e^{\frac{t^2-2}{t+1}}$가 만나는 점의 $x$좌표는 $x^2-\dfrac1{t+1}x-e^{\frac{t^2-2}{t+1}}=0$을 만족하므로, 두 점의 좌표를 $(\alpha,\alpha^2)$, $(\beta,\beta^2)$이라 놓을 수 있다.
        따라서, 근과 계수의 관계에 의해 두 근의 합과 곱은 각각 $\alpha+\beta=\dfrac1{t+1}$, $\alpha\beta=-e^{\frac{t^2-2}{t+1}}$를 만족한다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        정삼각형의 넓이가 $S(t)=\dfrac{\sqrt3}{4}\overline{\mathrm{PQ}}^2$이고, 여기서, 두 점 사이의 거리를 이용하면
        $$\overline{\mathrm{PQ}}^2=\left(\sqrt{(\beta-\alpha)^2+(\beta^2-\alpha^2)^2}\right)^2=(\beta-\alpha)^2\left(1+(\beta+\alpha)^2\right)$$
        이다. $(\alpha-\beta)^2=(\alpha+\beta)^2-4\alpha\beta=\dfrac1{(t+1)^2}+4e^{\frac{t^2-2}{t+1}}$이다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        따라서, 구하는 정적분은
        $$\int_0^1S(t)\,dt=\dfrac{\sqrt3}{4}\int_0^1\left(\dfrac1{(t+1)^2}+1\right)\left(\dfrac1{(t+1)^2}+4e^{\frac{t^2-2}{t+1}}\right)dt=\dfrac{\sqrt3}{4}\left\{\int_0^1\left(\dfrac1{(t+1)^2}+\dfrac1{(t+1)^4}\right)dt+4\int_0^1e^{t-1-\frac1{t+1}}\left(1+\dfrac1{(t+1)^2}\right)dt\right\}$$
        이다.
        $\left(t-1-\dfrac1{t+1}\right)^\prime=1+\dfrac1{(t+1)^2}$이므로, $\displaystyle\int e^{t-1-\frac1{t+1}}\left(1+\dfrac1{(t+1)^2}\right)dt=e^{t-1-\frac1{t+1}}+C$이다.
      criteria: [2.B3]
    - id: 2b-4
      content: |
        따라서, 주어진 정적분을 계산하면
        $$\dfrac{\sqrt3}{4}\left[-\dfrac1{3(t+1)^3}-\dfrac1{t+1}+4e^{t-1-\frac1{t+1}}\right]_{t=0}^{1}=\dfrac{\sqrt3}{4}\left(\dfrac{19}{24}+4e^{-\frac12}-4e^{-2}\right)$$
        이다. 정리하면 $\dfrac{19}{96}\sqrt3+\sqrt3\left(e^{-\frac12}-e^{-2}\right)$이다.
      criteria: [2.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: 근과 계수의 관계로 $\alpha+\beta=\dfrac1{t+1}$, $\alpha\beta=-e^{\frac{t^2-2}{t+1}}$를 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: $\overline{\mathrm{PQ}}^2=\left(\dfrac1{(t+1)^2}+1\right)\left(\dfrac1{(t+1)^2}+4e^{\frac{t^2-2}{t+1}}\right)$을 얻었다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: '부정적분 $\dfrac{\sqrt3}{4}\left(-\dfrac1{3(t+1)^3}-\dfrac1{t+1}+4e^{t-1-\frac1{t+1}}\right)$을 얻었다.'
      depends_on: []
      steps: [2b-3]
    - id: 2.B4
      mark_type: B
      points: 4
      evidence: 정적분을 계산하여 정답 $\sqrt3\left(\dfrac{19}{96}+e^{-\frac12}-e^{-2}\right)$을 얻었다.
      depends_on: []
      steps: [2b-4]
