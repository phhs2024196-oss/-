  materials: ['최고차항의 계수가 1인 삼차함수 $f(x)$와 조건 (가) $\displaystyle\lim_{x\to1}\dfrac{e^{f(x)}-e}{x-1}=0$, (나) $f^{\prime\prime}(-1)>0$, (다) 넓이 $\dfrac{53}{12}$', '곡선 $y=x^2$과 직선 $y=\dfrac1{t+1}x+e^{\frac{t^2-2}{t+1}}$의 두 교점 P, Q', '선분 PQ를 한 변으로 하는 정삼각형의 넓이 $S(t)$']
  concepts: [미분계수의 정의, 합성함수의 미분, 이계도함수와 볼록성, 접선의 방정식, 정적분과 넓이, 이차방정식의 근과 계수의 관계, 두 점 사이의 거리, 치환적분법]
