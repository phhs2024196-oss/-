  conditions:
  - '(가) 극한이 존재 ⇒ $f(1)=1$; $g(x)=e^{f(x)}$이면 $g^\prime(1)=f^\prime(1)e^{f(1)}=0$ ⇒ $f^\prime(1)=0$ ⇒ $x=1$은 $f(x)-1=0$의 중근'
  - '(나) $f^{\prime\prime}(-1)>0$ ⇒ $x=-1$ 근방에서 아래로 볼록 ⇒ 접선 $y=4(b+2)x+5$가 곡선 아래'
