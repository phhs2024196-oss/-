intent: '미분과 적분의 의미를 이해하고 구체적인 문제를 해결하는지 본다. [2-1] 미분계수를 이용해 삼차함수의 그래프 개형을 유추하는지, [2-2] 근과 계수의 관계로 두 근의 차의 제곱을 계수로 표현하고, 넓이를 함수로 나타내 치환적분으로 적분하는지를 평가한다(문항카드 출제 의도 요지).'
key_idea: '[2-1] 극한 조건에서 $f(1)=1$, $f^\prime(1)=0$ ⇒ $f(x)-1=(x-1)^2(x-b)$; 아래로 볼록이라 접선이 곡선 아래에 있으므로 넓이 $=\displaystyle\int_{-1}^0\{f(x)-(\text{접선})\}dx$. [2-2] $\overline{\mathrm{PQ}}^2=(\alpha-\beta)^2\{1+(\alpha+\beta)^2\}$, 지수 $\dfrac{t^2-2}{t+1}=t-1-\dfrac1{t+1}$.'
stuck: '[2-1] $\lim\dfrac{e^{f(x)}-e}{x-1}=0$을 $g(x)=e^{f(x)}$의 미분계수 $g^\prime(1)=0$으로 읽는 단계 / [2-2] $e^{t-1-\frac1{t+1}}\left(1+\dfrac{1}{(t+1)^2}\right)$이 $(\text{지수})^\prime e^{(\text{지수})}$ 꼴임을 알아보는 단계'
