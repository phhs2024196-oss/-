intent: '정적분으로 수열을 구하고 수열의 합을 구하며, 문제를 이해해 함수를 구성하고 그래프의 개형을 고려해 최솟값을 구한 뒤 정적분하는 능력을 본다. [3-1] 수열을 구하고 그 합을 구할 수 있는지, [3-2] 함수를 구해 그래프 개형으로 최솟값을 구하고 주어진 정적분 값을 구할 수 있는지를 평가한다(문항카드 출제 의도 요지).'
key_idea: '[3-1] 부분적분으로 $a_{n+1}+(n+1)a_n=e$를 얻으면 합의 각 항이 $e\left(\dfrac{1}{\ln\frac{n}{15}}-\dfrac{1}{\ln\frac{n+1}{15}}\right)$로 망원된다. [3-2] $\overline{\mathrm{PA}}^2\,\overline{\mathrm{PB}}^2=(x^2+t^2-1)^2+4t^2$이므로 $0<t<1$이면 $x=\pm\sqrt{1-t^2}$, $t\ge1$이면 $x=0$에서 최소.'
stuck: '[3-1] $\ln(n+1)-\ln n=\ln\dfrac{n+1}{15}-\ln\dfrac{n}{15}$으로 고쳐 써서 부분분수 꼴을 만드는 단계 / [3-2] 곱을 $(x^2+t^2-1)^2+4t^2$으로 정리하고 $t$의 범위로 나누는 단계'
idea_tags: [IDEA-PARTS-RECURRENCE, IDEA-TELESCOPING-PARTIAL-FRACTION, IDEA-COMPLETE-SQUARE-PRODUCT, IDEA-CASE-BY-PARAMETER]
tags: [부분적분, 정적분의 점화식, 망원 합, 최솟값, 매개변수, 중앙대 실전]
elements:
  materials: ['세 직선 $y=0$, $x=1$, $x=e$와 곡선 $y=(\ln x)^n$으로 둘러싸인 넓이 $a_n$', '합 $\displaystyle\sum_{n=1}^{13}\{a_{n+1}+(n+1)a_n\}\dfrac{\ln(n+1)-\ln n}{\ln\left(\frac{n}{15}\right)\ln\left(\frac{n+1}{15}\right)}$', 'A(1,t), B(−1,t), P(x,0)와 $f(x)=\ln\overline{\mathrm{PA}}+\ln\overline{\mathrm{PB}}$의 최솟값 $g(t)$', '정적분 $\displaystyle\int_{1/2}^{2}2t\,g(t)\,dt$']
  concepts: [정적분과 넓이, 부분적분법, 수열의 합(망원), 로그의 성질, 두 점 사이의 거리, 함수의 최솟값과 그래프의 개형]
  tools: ['부분적분으로 $a_{n+1}$과 $a_n$의 관계식', 로그 차를 분수로 바꿔 망원 합, 거리 곱의 완전제곱 정리, t의 범위별 최소점, 부분적분과 치환으로 2t ln 적분]
  conditions:
  - '$1\le x\le e$에서 $(\ln x)^n\ge0$ ⇒ $a_n=\displaystyle\int_1^e(\ln x)^n\,dx$'
  - '$a_{n+1}+(n+1)a_n=e$ ⇒ 합의 일반항 $=e\cdot\dfrac{\ln\frac{n+1}{15}-\ln\frac{n}{15}}{\ln\frac{n}{15}\ln\frac{n+1}{15}}$ ($n\le13$이라 $\ln\frac{n}{15}$, $\ln\frac{n+1}{15}\neq0$)'
  - '$\ln\overline{\mathrm{PA}}+\ln\overline{\mathrm{PB}}=\dfrac12\ln(\overline{\mathrm{PA}}^2\,\overline{\mathrm{PB}}^2)$, $\ln$은 증가 ⇒ 곱의 최소를 찾으면 됨'
  - '$(x^2+t^2-1)^2+4t^2$: $0<t<1$이면 $x^2=1-t^2$에서 최소 $4t^2$, $t\ge1$이면 $x=0$에서 최소 $(t^2+1)^2$'
  - '적분 구간 $\left[\dfrac12,2\right]$를 $t=1$에서 나눔'
