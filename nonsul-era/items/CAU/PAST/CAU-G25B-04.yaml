intent: '타원의 접선의 방정식과 벡터의 내적을 활용할 수 있는지 본다. [4-1] 두 점 사이의 거리와 삼각형의 넓이를 계산하기 위해 타원의 접선 방정식을 활용하는지, [4-2] 평면벡터의 덧셈을 활용해 두 평면벡터의 내적을 구할 수 있는지를 평가한다(문항카드 출제 의도 요지).'
key_idea: '[4-1] 기울기 $m<0$인 접선 $y=mx+\sqrt{16m^2+4}$의 절편으로 $\overline{\mathrm{QR}}^2=20+16m^2+\dfrac4{m^2}\ge36$(산술·기하), 등호에서 $m=-\dfrac1{\sqrt2}$. [4-2] $\overrightarrow{\mathrm{OQ}}=\overrightarrow{\mathrm{OZ}}+\overrightarrow{\mathrm{ZQ}}$(Z는 원의 중심)로 쪼개 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OQ}}\le\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OZ}}+\lvert\overrightarrow{\mathrm{OP}}\rvert$.'
stuck: '[4-1] QR 길이를 기울기 $m$ 하나의 함수로 쓰고 산술·기하평균을 적용하는 단계 / [4-2] 원 위의 점 Q를 중심 Z와 단위벡터로 분해하고, 정수점 P 중 최대가 되는 점을 증가·감소로 고르는 단계'
