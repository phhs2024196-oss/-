stimuli:
- label: '1'
  body: |
    타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$에 접하고 기울기가 $m$인 접선의 방정식은 $y=mx\pm\sqrt{a^2m^2+b^2}$이다.
- label: '2'
  body: |
    타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ 위의 점 $(x_1,y_1)$에서의 접선의 방정식은 $\dfrac{x_1x}{a^2}+\dfrac{y_1y}{b^2}=1$이다.
- label: '3'
  body: |
    두 평면벡터 $\vec a$, $\vec b$가 이루는 각의 크기가 $\theta\ (0^\circ\le\theta\le180^\circ)$일 때, $\vec a\cdot\vec b=\lvert\vec a\rvert\lvert\vec b\rvert\cos\theta$이다.

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    그림과 같이 두 초점이 $\mathrm F(c,0)$, $\mathrm F^\prime(-c,0)\ (c>0)$인 타원 $\dfrac{x^2}{16}+\dfrac{y^2}{4}=1$ 위의 점 P에서의 접선이 $x$축, $y$축과 만나는 점을 각각 Q, R라 하자. 선분 QR의 길이가 최소일 때, 삼각형 PRF′의 넓이를 구하시오. (단, 점 P는 제1사분면 위의 점이다.) [15점]

    (그림: 타원 위 제1사분면의 점 P에서 그은 접선이 $y$축 양의 부분과 R, $x$축 양의 부분과 Q에서 만나고, 삼각형 PRF′이 색칠되어 있다.)
  points: 15
  depends_on: []
  answer: {kind: value, value: '4(\sqrt2+1)', equivalents: ['4*sqrt(2)+4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{QR}}^2=20+16m^2+\dfrac4{m^2}\ge36$, $m=-\dfrac1{\sqrt2}$, Q$(2\sqrt6,0)$, R$(0,2\sqrt3)$, P의 $y$좌표 $\dfrac2{\sqrt3}$.
    steps:
    - {id: 1a, content: '△PRF′ $=$△QRF′$-$△QPF′ $=\dfrac12\overline{\mathrm{F^\prime Q}}\left(\overline{\mathrm{RO}}-\overline{\mathrm{PH}}\right)=4(\sqrt2+1)$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - 기울기 $m$인 접선의 방정식으로 Q, R의 좌표를 $m$으로 나타내자.
    - '$16m^2+\dfrac4{m^2}$의 최솟값은 산술·기하평균으로 구할 수 있다.'
    - 삼각형 PRF′은 두 삼각형 QRF′, QPF′의 차이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.67 예시답안
    steps:
    - id: 1b-1
      content: |
        $c=\sqrt{16-4}=2\sqrt3$이므로 두 초점 F, F′의 좌표는 각각 $(2\sqrt3,0)$, $(-2\sqrt3,0)$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        접선의 기울기를 $m\ (m<0)$이라 하면 그 방정식은 $y=mx+\sqrt{16m^2+4}$로 주어진다.
        접선의 $x$절편과 $y$절편을 구하여 점 Q, R의 좌표가 각각 $\left(\sqrt{16+\dfrac{4}{m^2}},0\right)$, $\left(0,\sqrt{16m^2+4}\right)$임을 알 수 있다.
        $\overline{\mathrm{QR}}^2$의 값이 최소일 때, $\overline{\mathrm{QR}}$의 값이 최소이다.
        $$\overline{\mathrm{QR}}^2=\overline{\mathrm{OQ}}^2+\overline{\mathrm{OR}}^2=16+\dfrac4{m^2}+16m^2+4=20+16m^2+\dfrac4{m^2}\ge20+2\sqrt{16m^2\times\dfrac4{m^2}}=36$$
      criteria: [1.B2]
    - id: 1b-3
      content: |
        위 부등식에서 등호는 $16m^2=\dfrac4{m^2}$일 때 성립한다. 즉, $m=-\dfrac1{\sqrt2}$일 때이다. 따라서 점 Q, R는 각각 $(2\sqrt6,0)$과 $(0,2\sqrt3)$이다. 또, $\overline{\mathrm{F^\prime Q}}=2\sqrt3(\sqrt2+1)$, $\overline{\mathrm{RO}}=2\sqrt3$이다(O는 원점).
      criteria: [1.B2]
    - id: 1b-4
      content: |
        점 P의 좌표를 $(a,b)$라 하면, 접선의 방정식은 $\dfrac{ax}{16}+\dfrac{by}{4}=1$로 주어지고 그 기울기는 $-\dfrac{a}{4b}=-\dfrac1{\sqrt2}$이다.
        $\dfrac{a^2}{16}+\dfrac{b^2}{4}=1$과 연립하여 $b=\dfrac{2}{\sqrt3}\ (\because b>0)$이다. 점 P에서 $x$축에 내린 수선의 발을 H라 하면 $\overline{\mathrm{PH}}=\dfrac2{\sqrt3}$이므로
      criteria: [1.B3]
    - id: 1b-5
      content: |
        $$\triangle\mathrm{PRF^\prime}=\triangle\mathrm{QRF^\prime}-\triangle\mathrm{QPF^\prime}=\dfrac12\times\overline{\mathrm{F^\prime Q}}\times\overline{\mathrm{RO}}-\dfrac12\times\overline{\mathrm{F^\prime Q}}\times\overline{\mathrm{PH}}=4(\sqrt2+1)$$
      criteria: [1.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: $c=2\sqrt3$을 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: 점 P에서의 접선의 기울기 $m=-\dfrac1{\sqrt2}$를 구했다.
      depends_on: []
      steps: [1b-2, 1b-3]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: 점 P의 좌표($y$좌표 $\dfrac2{\sqrt3}$)를 구했다.
      depends_on: []
      steps: [1b-4]
    - id: 1.B4
      mark_type: B
      points: 5
      evidence: 삼각형 PRF′의 넓이 $4(\sqrt2+1)$을 구했다.
      depends_on: []
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D1-2
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4621}
  misconceptions:
  - id: MC-GEO-4621
    outcome_code: '70'
    wrong_work: '산술·기하평균 등호 조건 $16m^2=\dfrac{4}{m^2}$에서 $m=\dfrac1{\sqrt2}$(양수)를 택하거나, 등호 성립 여부를 확인하지 않고 최솟값 36만 씀'
    detect_cue: P가 제1사분면이 아닌 점으로 계산됨, $m>0$
    feedback: P가 제1사분면이면 접선은 $x$축·$y$축 양의 부분과 만나므로 기울기는 음수입니다. 등호 조건과 부호 조건을 함께 써서 $m=-\dfrac1{\sqrt2}$를 고르세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $(m-5)^2+(n-4)^2<9$를 만족시키는 두 정수 $m$, $n$에 의하여 정의된 좌표평면 위의 점 $\mathrm P(m,n)$과 원 $(x+1)^2+(y-8)^2=1$ 위를 움직이는 점 Q에 대하여 내적 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OQ}}$의 최댓값을 구하시오. (단, O는 원점이다.) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '45+3\sqrt5', equivalents: ['45+sqrt(45)', '45+3*sqrt(5)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OQ}}$의 최댓값 $=\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OZ}}+\lvert\overrightarrow{\mathrm{OP}}\rvert=-m+8n+\sqrt{m^2+n^2}$, $n=6$이고 $m$이 작을수록 큼.
    steps:
    - {id: 2a, content: 'P$(3,6)$에서 $-3+48+\sqrt{45}=45+3\sqrt5$', criteria: [2.B1, 2.B2, 2.B3, 2.B4]}
    hint_ladder:
    - '$\overrightarrow{\mathrm{OQ}}$를 원의 중심 Z를 거쳐 둘로 나누어 보자.'
    - 크기가 1인 벡터와 $\overrightarrow{\mathrm{OP}}$의 내적은 언제 최대인가?
    - $m$을 고정하고 $n$을 늘리면 어떻게 되는가? 그다음 $m$에 대한 함수를 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.68 예시답안
    steps:
    - id: 2b-1
      content: |
        $(m-5)^2+(n-4)^2<9$이므로 두 정수 $m-5$, $n-4$은 모두 $-2,-1,0,1,2$ 중 하나이다.
        즉, 점 P의 좌표의 집합은 $S=\{(m,n)\mid m,n\text{은 }3\le m\le7,\ 2\le n\le6\text{인 정수}\}$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        원 $(x+1)^2+(y-8)^2=1$의 중심 $\mathrm Z(-1,8)$과 좌표가 집합 $S$에 속하는 각각의 점 $\mathrm P(m,n)$에 대하여 $\overrightarrow{\mathrm{OP}}$, $\overrightarrow{\mathrm{OZ}}$가 이루는 각은 예각이다. 두 벡터 $\overrightarrow{\mathrm{OP}}$와 $\overrightarrow{\mathrm{ZQ}}$가 이루는 각을 $\theta$라 하면
        $$\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OQ}}=\overrightarrow{\mathrm{OP}}\cdot(\overrightarrow{\mathrm{OZ}}+\overrightarrow{\mathrm{ZQ}})=\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OZ}}+\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{ZQ}}=\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OZ}}+\lvert\overrightarrow{\mathrm{OP}}\rvert\lvert\overrightarrow{\mathrm{ZQ}}\rvert\cos\theta=\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OZ}}+\lvert\overrightarrow{\mathrm{OP}}\rvert\cos\theta$$
        이므로 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OQ}}$는 $\theta=0$일 때 최댓값 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OZ}}+\lvert\overrightarrow{\mathrm{OP}}\rvert$를 갖는다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        $m$을 고정하였을 때, $n$이 클수록 두 벡터 $\overrightarrow{\mathrm{OP}}$, $\overrightarrow{\mathrm{OZ}}$가 이루는 각이 작아지고 $\lvert\overrightarrow{\mathrm{OP}}\rvert$는 커지므로 $n=6$일 때 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OZ}}+\lvert\overrightarrow{\mathrm{OP}}\rvert$가 최대로 커진다. 따라서 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OZ}}+\lvert\overrightarrow{\mathrm{OP}}\rvert$의 최댓값을 찾기 위하여 점 P의 좌표가 $(3,6),(4,6),(5,6),(6,6),(7,6)$인 경우를 고려하면 된다.
        실수에서 정의된 함수 $f(x)=(x,6)\cdot(-1,8)+\sqrt{x^2+36}=-x+48+\sqrt{x^2+36}$의 도함수 $f^\prime(x)$는 $f^\prime(x)=-1+\dfrac{x}{\sqrt{x^2+36}}<0$을 만족시키므로 $f(x)$는 감소함수이다.
        따라서 점 P의 좌표가 $(3,6)$일 때 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OZ}}+\lvert\overrightarrow{\mathrm{OP}}\rvert$가 최댓값을 갖고
      criteria: [2.B3]
    - id: 2b-4
      content: |
        이때 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OZ}}+\lvert\overrightarrow{\mathrm{OP}}\rvert=45+\sqrt{45}$이다.
        그러므로 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OQ}}$의 최댓값은 $45+\sqrt{45}=45+3\sqrt5$이다.
      criteria: [2.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: $(m-5)^2+(n-4)^2<9$를 만족시키는 점 $\mathrm P(m,n)$을 모두 찾았다($3\le m\le7$, $2\le n\le6$인 정수).
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: 내적 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OQ}}$를 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OZ}}+\lvert\overrightarrow{\mathrm{OP}}\rvert\cos\theta$로 표현했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 4
      evidence: $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OQ}}$가 최댓값을 갖는 점 $\mathrm P(3,6)$을 찾았다.
      depends_on: []
      steps: [2b-3]
    - id: 2.B4
      mark_type: B
      points: 5
      evidence: 내적 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OQ}}$의 최댓값 $45+\sqrt{45}=45+3\sqrt5$를 구했다.
