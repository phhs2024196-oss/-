key_idea: '(2-1) $\dfrac1\alpha+\dfrac1\beta=-\dfrac{2m}{n}$을 판별식 $m^2-3n>0$과 $m+n\le9$ 아래에서 경우를 나눠 최대화; (2-2) $x=0$에서 좌·우 미분계수를 같게 놓아 $a=-3$을 얻고, 증감표로 그린 그래프와 수평선 $y=k$의 교점 수 변화를 본다.'
stuck: '(2-1) 식이 음수이므로 “최대” = $\dfrac{2m}{n}$이 가장 작은 경우라는 해석 / (2-2) $g(k)$가 극값뿐 아니라 끝값 $f(\pm\pi)=0$, $f(0)=0$ 높이에서도 바뀐다는 점'
