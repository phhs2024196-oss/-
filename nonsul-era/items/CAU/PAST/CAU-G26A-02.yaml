stimuli:
- label: '1'
  body: |
    이차방정식 $ax^2+bx+c=0$의 두 근을 $\alpha$, $\beta$라고 하면 다음 식이 성립한다.
    $$\alpha+\beta=-\dfrac ba,\quad \alpha\beta=\dfrac ca$$
- label: '2'
  body: |
    함수 $f(x)$와 실수 $a$에 대하여 함수 $f(x)$가 $x=a$에서 정의되어 있고 $\displaystyle\lim_{x\to a}f(x)$가 존재하며 $\displaystyle\lim_{x\to a}f(x)=f(a)$일 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다. 한편, 함수 $f(x)$가 $x=a$에서 연속이 아닐 때, 함수 $f(x)$는 $x=a$에서 불연속이라고 한다.

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    모든 계수가 자연수인 삼차함수 $f(x)=x^3+mx^2+nx+k$가 다음 조건을 만족시킨다.

    (가) 방정식 $f'(x)=0$은 서로 다른 두 실근 $\alpha$와 $\beta$를 갖는다.
    (나) $f(1)=11$

    $\dfrac1\alpha+\dfrac1\beta$이 최대가 되는 자연수 $m$, $n$, $k$를 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: 'm=4,\ n=5,\ k=1', equivalents: ['(4,5,1)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\dfrac1\alpha+\dfrac1\beta=-\dfrac{2m}{n}$, 조건 $m^2>3n$, $m+n\le9$에서 $\dfrac mn$이 최소인 $(m,n)=(4,5)$.
    steps:
    - {id: 1a, content: '$(4,5)$에서 $-\dfrac85$가 최대, $k=10-9=1$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 근과 계수의 관계로 $\dfrac1\alpha+\dfrac1\beta$를 $m$, $n$으로 나타내자.
    - $f(1)=11$과 자연수 조건에서 $m+n$의 범위는?
    - 판별식 조건 아래에서 $\dfrac{m}{n}$을 가장 작게 하는 쌍을 찾자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.61 예시답안
    steps:
    - id: 1b-1
      content: |
        주어진 $f(x)$를 미분하면 $f'(x)=3x^2+2mx+n$이다. $f'(x)=0$이 서로 다른 두 실근을 갖기 위한 조건은 $D/4=m^2-3n>0$이고, 근과 계수의 관계에서 $\alpha+\beta=-\dfrac{2m}{3}$, $\alpha\beta=\dfrac n3$이다.
        $f(1)=11$이므로, $m+n+k=10$이며, $m$, $n$, $k$는 자연수이므로, $1\le m,n,k\le8$이고, $m+n\le9$이다.
      criteria: []
    - id: 1b-2
      content: |
        $\dfrac1\alpha+\dfrac1\beta=\dfrac{\alpha+\beta}{\alpha\beta}=-\dfrac{2m}{n}$이 최대가 되기 위해서는 $n$은 크고 $m$은 작아야 한다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $m^2-3n>0$, $m+n\le9$를 만족하는 $m$, $n$은
        (1) $m=1$일 때, $n$은 없다. (2) $m=2$일 때, $n=1$ (3) $m=3$일 때, $n=1,2$
        (4) $m=4$일 때, $n=1,2,\dots,5$ (5) $m=5$일 때, $n=1,\dots,4$
        (6) $m=6$일 때, $n=1,2,3$ (7) $m=7$일 때, $n=1,2$ (8) $m=8$일 때, $n=1$
      criteria: [1.B2]
    - id: 1b-4
      content: |
        이 중 $m=4$, $n=5$일 때, $-\dfrac{2m}{n}=-\dfrac85$이 최대이다. 이때, $k=1$이다. 따라서, $f(x)=x^3+4x^2+5x+1$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: $\dfrac1\alpha+\dfrac1\beta=\dfrac{\alpha+\beta}{\alpha\beta}=-\dfrac{2m}{n}$을 얻었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: $m$, $n$을 판별식 등을 이용하여 (1)~(8)처럼 경우를 나누거나, 조건을 정확히 이용하여 경우를 줄였다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: 모든 계산을 정확히 하여 $m=4$, $n=5$, $k=1$을 얻었다.
      depends_on: []
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 부분 점수 가능(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-4659}
  misconceptions:
  - id: MC-ALG-4659
    outcome_code: '70'
    wrong_work: '$-\dfrac{2m}{n}$의 부호를 놓치고 $\dfrac{2m}{n}$이 가장 큰 $(m,n)=(8,1)$을 답함'
    detect_cue: 답이 $m=8$, $n=1$, $k=1$이거나 비교 대상이 $\dfrac{2m}{n}$의 최대
    feedback: $\dfrac1\alpha+\dfrac1\beta=-\dfrac{2m}{n}$은 음수입니다. 음수가 최대가 되려면 절댓값 $\dfrac{2m}{n}$이 가장 작아야 합니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    모든 실수 $x$에서 미분가능한 함수
    $$f(x)=\begin{cases}4\sin^3x-3\sin x & (x\ge0)\\ \dfrac{3}{\pi^2}x^3+ax & (x<0)\end{cases}\quad(\text{단, }a\text{는 실수})$$
    에 대하여 함수 $g(k)$는 $-\pi\le x\le\pi$에서 $f(x)=k$(단, $k$는 실수)의 서로 다른 실근의 개수라 정의하자. 실수 $a$의 값을 구하고, 함수 $g(k)$가 불연속인 실수 $k$의 값을 모두 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: set, value: 'a=-3;\ k=-1,\ 0,\ 1,\ \dfrac{2}{\sqrt3}\pi', equivalents: ['a=-3; k=-1,0,1,2pi/sqrt(3)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 우미분계수 $f'(0^+)=3\cos0(4\sin^20-1)=-3$과 좌미분계수 $a$가 같아 $a=-3$. 극값 $\dfrac{2\pi}{\sqrt3}$, $-1$, $1$, $-1$과 끝값·$f(0)=0$ 높이에서 교점 수가 바뀐다.
    steps:
    - {id: 2a, content: '$a=-3$, 불연속 $k=-1,\ 0,\ 1,\ \dfrac{2}{\sqrt3}\pi$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - $x=0$에서 미분가능하려면 양쪽 도함수의 값이 같아야 한다.
    - $x\ge0$ 부분의 도함수 $3\cos x(4\sin^2x-1)$의 부호를 조사하자.
    - 그래프를 그리고 수평선 $y=k$를 위아래로 움직이며 교점의 개수가 바뀌는 높이를 찾자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.62~63 예시답안
    steps:
    - id: 2b-1
      content: |
        $x>0$일 때, $f'(x)=3\cos x(4\sin^2x-1)$, $x<0$일 때, $f'(x)=\dfrac{9}{\pi^2}x^2+a$.
        $f(x)$가 $x=0$에서 미분가능하므로, $\displaystyle\lim_{h\to0+}\dfrac{f(h)-f(0)}{h}=\lim_{h\to0-}\dfrac{f(h)-f(0)}{h}$이다. 따라서, $a=-3$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        (i) $-\pi\le x<0$에서 $f(x)=\dfrac{3}{\pi^2}x(x^2-\pi^2)$이므로 $f(-\pi)=0$.
        $f'(x)=\dfrac{9}{\pi^2}x^2-3$이므로 $f'\left(-\dfrac{\pi}{\sqrt3}\right)=0$이고 부호변화를 고려하면 극댓값 $f\left(-\dfrac{\pi}{\sqrt3}\right)=\dfrac{2\pi}{\sqrt3}$
        (ii) $0\le x\le\pi$에서 $f(x)=\sin x(4\sin^2x-3)$이므로, $f(0)=f\left(\dfrac\pi3\right)=f\left(\dfrac{2\pi}{3}\right)=f(\pi)=0$
        $f'(x)=3\cos x(4\sin^2x-1)$이므로, $f'\left(\dfrac\pi6\right)=f'\left(\dfrac\pi2\right)=f'\left(\dfrac{5\pi}{6}\right)=0$
      criteria: [2.B2]
    - id: 2b-3
      content: |
        이를 이용한 증가와 감소를 나타낸 표는 다음과 같다.

        | $x$ | $-\pi$ | $\cdots$ | $-\dfrac{\pi}{\sqrt3}$ | $\cdots$ | $0$ | $\cdots$ | $\dfrac\pi6$ | $\cdots$ | $\dfrac\pi3$ | $\cdots$ | $\dfrac\pi2$ | $\cdots$ | $\dfrac{2\pi}{3}$ | $\cdots$ | $\dfrac{5\pi}{6}$ | $\cdots$ | $\pi$ |
        |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|
        | $f'(x)$ |  | $+$ | $0$ | $-$ |  | $-$ | $0$ | $+$ |  | $+$ | $0$ | $-$ |  | $-$ | $0$ | $+$ |  |
        | $f(x)$ | $0$ | ↗ | $\dfrac{2}{\sqrt3}\pi$ | ↘ | $0$ | ↘ | $-1$ | ↗ | $0$ | ↗ | $1$ | ↘ | $0$ | ↘ | $-1$ | ↗ | $0$ |

        부호 변화를 고려한 극솟값은 $f\left(\dfrac\pi6\right)=f\left(\dfrac{5\pi}{6}\right)=-1$, 극댓값은 $f\left(\dfrac\pi2\right)=1$이다. (가이드북에는 이를 바탕으로 그린 그래프가 실려 있음)
      criteria: [2.B2]
    - id: 2b-4
      content: |
        위 그래프의 개형으로부터 불연속인 $k$는 다음과 같다.
        $\displaystyle\lim_{k\to-1-0}g(k)=0$, $\displaystyle\lim_{k\to-1+0}g(k)=4$, $g(-1)=2$이므로 $k=-1$에서 불연속
        $\displaystyle\lim_{k\to0-}g(k)=\lim_{k\to0+}g(k)=4$, $g(0)=5$이므로, $k=0$에서 불연속
        $\displaystyle\lim_{k\to1-0}g(k)=4$, $\displaystyle\lim_{k\to1+0}g(k)=2$, $g(1)=3$이므로, $k=1$에서 불연속
        $\displaystyle\lim_{k\to\frac{2\pi}{\sqrt3}-0}g(k)=2$, $\displaystyle\lim_{k\to\frac{2\pi}{\sqrt3}+0}g(k)=0$, $g\left(\dfrac{2\pi}{\sqrt3}\right)=1$이므로, $k=\dfrac{2}{\sqrt3}\pi$에서 불연속
        그러므로, 불연속인 $k$는 $-1,\ 0,\ 1,\ \dfrac{2}{\sqrt3}\pi$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: $a=-3$을 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 7
      evidence: 증가와 감소 표 혹은 그래프 개형 혹은 극점과 극값을 바르게 구했다.
      depends_on: []
      steps: [2b-2, 2b-3]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: 불연속인 $k=-1,\ 0,\ 1,\ \dfrac{2}{\sqrt3}\pi$를 바르게 구했다.
      depends_on: []
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 부분 점수 가능(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4660}
