elements:
  materials:
  - '모든 계수가 자연수인 삼차함수 $f(x)=x^3+mx^2+nx+k$, $f(1)=11$'
  - '$x\ge0$에서 $4\sin^3x-3\sin x$, $x<0$에서 $\dfrac{3}{\pi^2}x^3+ax$인 구간별 함수'
  - '$-\pi\le x\le\pi$에서 $f(x)=k$의 서로 다른 실근의 개수 $g(k)$'
  concepts: [이차방정식의 근과 계수의 관계, 판별식, 도함수, 미분계수(좌·우극한), 함수의 연속, 증가·감소와 극값, 그래프의 개형]
  tools:
  - 자연수 조건 $m+n+k=10$으로 범위 제한
  - 판별식 $m^2-3n>0$을 만족하는 $(m,n)$ 나열
  - 좌·우 미분계수 비교
  - 사인함수의 도함수와 $4\sin^2x-1$의 부호
  - 증감표와 그래프
  - 수평선 $y=k$를 움직이며 교점 수 세기
  conditions:
  - '(가) $f''(x)=3x^2+2mx+n=0$이 서로 다른 두 실근 ⇒ $D/4=m^2-3n>0$'
  - '(나) $f(1)=11$ ⇒ $m+n+k=10$, $m,n,k$ 자연수 ⇒ $m+n\le9$'
  - '$\dfrac1\alpha+\dfrac1\beta=\dfrac{\alpha+\beta}{\alpha\beta}=-\dfrac{2m}{n}<0$ ⇒ 최대 ⇔ $n$은 크고 $m$은 작게'
  - '모든 실수에서 미분가능 ⇒ $x=0$에서 좌·우 미분계수가 같음 ⇒ $a=-3$'
  - '$g(k)$가 불연속 ⇔ 수평선 $y=k$가 극값 또는 경계값 높이를 지날 때 교점 수가 바뀜 ⇒ $k=-1,0,1,\dfrac{2}{\sqrt3}\pi$'
  stimuli_used: ['1', '2']
  subpart_links: 2-1과 2-2는 제시문만 공유하고 결과는 서로 독립이다(2-1은 제시문 1, 2-2는 제시문 2 사용).

