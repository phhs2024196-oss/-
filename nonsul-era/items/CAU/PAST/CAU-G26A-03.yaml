stimuli:
- label: '1'
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속일 때 다음 식이 성립한다.
    $$\lim_{n\to\infty}\sum_{k=1}^nf(x_k)\Delta x=\int_a^bf(x)\,dx\quad\left(\text{단, }\Delta x=\dfrac{b-a}{n},\ x_k=a+k\Delta x\right)$$
- label: '2'
  body: |
    미분가능한 함수 $f(x)$에서 $f'(a)=0$이고 $x=a$의 좌우에서 $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고 극솟값은 $f(a)$이다.
- label: '3'
  body: |
    미분가능한 함수 $g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속이고, $g(a)=\alpha$, $g(b)=\beta$에 대하여 함수 $f(x)$가 $\alpha$와 $\beta$를 양끝으로 하는 닫힌구간에서 연속일 때 다음 식이 성립한다.
    $$\int_a^bf(g(x))g'(x)\,dx=\int_\alpha^\beta f(t)\,dt$$
- label: '4'
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능할 때, 다음 식이 성립한다.
    $$\int f(x)g'(x)\,dx=f(x)g(x)-\int f'(x)g(x)\,dx$$

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    극한값
    $$\lim_{n\to\infty}\sum_{k=1}^n\dfrac1n\,\dfrac{\left(3+\dfrac kn\right)\ln(3n+k)-\left(2+\dfrac kn\right)\ln(2n+k)-\ln n}{\left(2+\dfrac kn\right)\left(3+\dfrac kn\right)\ln\left(2+\dfrac kn\right)\ln\left(3+\dfrac kn\right)}$$
    을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '2\ln(\ln3)-\ln(\ln2)-\ln(\ln4)', equivalents: ['2ln(ln3)-2ln(ln2)-ln2', 'ln((ln3)^2/(2(ln2)^2))'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 분자 $=\left(3+\frac kn\right)\ln\left(3+\frac kn\right)-\left(2+\frac kn\right)\ln\left(2+\frac kn\right)$ ($\ln n$ 상쇄) ⇒ $\int_0^1\dfrac{dx}{(2+x)\ln(2+x)}-\int_0^1\dfrac{dx}{(3+x)\ln(3+x)}$.
    steps:
    - {id: 1a, content: '$[\ln\ln(2+x)]_0^1-[\ln\ln(3+x)]_0^1=2\ln(\ln3)-\ln(\ln2)-\ln(\ln4)$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - $\ln(3n+k)$를 $\ln n$과 $\dfrac kn$만의 식으로 나누어 보자.
    - 분자의 $\ln n$ 항들은 어떻게 되는가?
    - 분수를 두 개로 쪼개면 각각 $\dfrac{1}{u\ln u}$ 꼴이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.64 예시답안
    steps:
    - id: 1b-1
      content: |
        $$\left(3+\dfrac kn\right)\ln(3n+k)-\left(2+\dfrac kn\right)\ln(2n+k)-\ln n=\left(3+\dfrac kn\right)\ln n\left(3+\dfrac kn\right)-\left(2+\dfrac kn\right)\ln n\left(2+\dfrac kn\right)-\ln n$$
        $$=\left(3+\dfrac kn\right)\ln\left(3+\dfrac kn\right)-\left(2+\dfrac kn\right)\ln\left(2+\dfrac kn\right)+\left(3+\dfrac kn\right)\ln n-\left(2+\dfrac kn\right)\ln n-\ln n$$
        $$=\left(3+\dfrac kn\right)\ln\left(3+\dfrac kn\right)-\left(2+\dfrac kn\right)\ln\left(2+\dfrac kn\right)$$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        이므로 주어진 극한값을 다음 정적분이다.
        $$\lim_{n\to\infty}\sum_{k=1}^n\dfrac1n\,\dfrac{\left(3+\frac kn\right)\ln\left(3+\frac kn\right)-\left(2+\frac kn\right)\ln\left(2+\frac kn\right)}{\left(2+\frac kn\right)\left(3+\frac kn\right)\ln\left(2+\frac kn\right)\ln\left(3+\frac kn\right)}=\int_0^1\dfrac{(3+x)\ln(3+x)-(2+x)\ln(2+x)}{(2+x)(3+x)\ln(2+x)\ln(3+x)}dx$$
        $$=\int_0^1\dfrac{1}{(2+x)\ln(2+x)}dx-\int_0^1\dfrac{1}{(3+x)\ln(3+x)}dx$$
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $y=\ln(2+x)$, $y=\ln(3+x)$로 치환적분하여 정리하면 다음과 같다.
        $2\ln(\ln3)-\ln(\ln2)-\ln(\ln4)$ 또는 $2\ln(\ln3)-2\ln(\ln2)-\ln2$ 또는 $\ln\left(\dfrac{(\ln3)^2}{2(\ln2)^2}\right)$
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: 정적분을 쓸 수 있도록 분자를 변형했다($\ln n$ 항 소거).
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: 맞는 정적분 형태로 썼다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: $2\ln(\ln3)-\ln(\ln2)-\ln(\ln4)$(또는 동치식)를 구했다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 부분 점수 가능(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4662}
  misconceptions:
  - id: MC-CAL-4662
    outcome_code: '70'
    wrong_work: '$\ln(3n+k)$를 그대로 $\ln(3+x)$로 바꾸거나 $\ln n$ 항을 무시하고 정적분으로 옮김'
    detect_cue: 분자 변형 과정 없이 바로 정적분, 또는 $-\ln n$의 처리 흔적 없음
    feedback: 구분구적법은 $\dfrac kn$만의 함수일 때 쓸 수 있습니다. $\ln(3n+k)=\ln n+\ln\left(3+\dfrac kn\right)$로 나누어 $\ln n$이 사라지는지 먼저 확인하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표평면 위의 점 $\mathrm{O}(0,0)$, $\mathrm{P}(x,0)$, $\mathrm{A}(t,\sqrt{3t})$, $\mathrm{B}(t,-\sqrt{3t})$에 대하여 함수 $f(x)$는 다음과 같다.
    $$f(x)=\overline{\mathrm{PO}}+\overline{\mathrm{PA}}+\overline{\mathrm{PB}}$$
    $f(x)$의 최솟값을 $m(t)$라 할 때, $\displaystyle\int_{\frac12}^4\ln(m(t))\,dt=a\ln2+b\ln5+c\ln7+d$이다. 유리수 $a$, $b$, $c$, $d$를 구하시오. (단, $t>0$이다.) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: 'a=\dfrac{53}{2},\ b=-5,\ c=-\dfrac74,\ d=-\dfrac12', equivalents: ['a=53/2, b=-5, c=-7/4, d=-1/2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $m(t)=2\sqrt{t^2+3t}$ ($0<t\le1$), $m(t)=t+3\sqrt t$ ($t\ge1$); $\int_{1/2}^1\ln(2\sqrt{t^2+3t})dt=\dfrac{13}{2}\ln2-\dfrac74\ln7-\dfrac12$, $\int_1^4\ln(t+3\sqrt t)dt=20\ln2-5\ln5$.
    steps:
    - {id: 2a, content: '합 $\dfrac{53}{2}\ln2-5\ln5-\dfrac74\ln7-\dfrac12$', criteria: [2.B1, 2.B2, 2.B3, 2.B4, 2.B5]}
    hint_ladder:
    - $\overline{PA}$와 $\overline{PB}$는 같다. $f(x)$를 식으로 쓰자.
    - $x<0$이나 $x>t$에서는 최솟값이 나올 수 없음을 확인하고 $[0,t]$에서 미분하자.
    - 임계점 $t-\sqrt t$가 $0$보다 작으면 최소는 어디에서 생기는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.65 예시답안
    steps:
    - id: 2b-1
      content: |
        $f(x)=\lvert x\rvert+2\sqrt{(x-t)^2+3t}$이고 최솟값을 구하는 문제이므로 $x\ge0$만 고려해도 충분하다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $f'(x)=1+\dfrac{2(x-t)}{\sqrt{(x-t)^2+3t}}$이고 $x\ge t$이면 $f'(x)\ge0$이므로 구간 $0\le x\le t$에서 생각해도 충분하다. $f'(x)=0$에서 $x=t-\sqrt t$이 나온다.
      criteria: []
    - id: 2b-3
      content: |
        $0\le t\le1$이면 $t-\sqrt t\le0$이므로 $x=0$에서 최솟값을 갖고 $m(t)=2\sqrt{t^2+3t}$이다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        $t\ge1$이면 $0\le t-\sqrt t\le t$이므로 $x=t-\sqrt t$에서 최솟값을 갖고 $m(t)=t+3\sqrt t$이다.
      criteria: [2.B3]
    - id: 2b-5
      content: |
        구하는 적분은 다음과 같다.
        $$\int_{\frac12}^4\ln(m(t))\,dt=\int_{\frac12}^1\ln\left(2\sqrt{t^2+3t}\right)dt+\int_1^4\ln\left(t+3\sqrt t\right)dt$$
        $$\int_{\frac12}^1\ln\left(2\sqrt{t^2+3t}\right)dt=\dfrac12\ln2+\int_{\frac12}^1\dfrac12\ln(t^2+3t)\,dt=\dfrac12\ln2+\dfrac12\int_{\frac12}^1\left(\ln t+\ln(t+3)\right)dt=\dfrac{13}{2}\ln2-\dfrac74\ln7-\dfrac12$$
        이고
      criteria: [2.B4]
    - id: 2b-6
      content: |
        $$\int_1^4\ln\left(t+3\sqrt t\right)dt=\left[t\ln\left(t+3\sqrt t\right)\right]_1^4-\int_1^4t\,\dfrac{1+\frac32t^{-\frac12}}{t+3\sqrt t}dt=\left[t\ln\left(t+3\sqrt t\right)\right]_1^4-\int_1^4\dfrac{\sqrt t+\frac32}{\sqrt t+3}dt=20\ln2-5\ln5$$
        이다.
      criteria: [2.B5]
    - id: 2b-7
      content: |
        두 값을 더하면 $\dfrac{53}{2}\ln2-5\ln5-\dfrac74\ln7-\dfrac12$이고 $a=\dfrac{53}{2}$, $b=-5$, $c=-\dfrac74$, $d=-\dfrac12$이다.
      criteria: []
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: $f(x)=\lvert x\rvert+2\sqrt{(x-t)^2+3t}$를 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: $0\le t\le1$에서 $m(t)=2\sqrt{t^2+3t}$를 구했다.
      depends_on: []
      steps: [2b-3]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: $t\ge1$에서 $m(t)=t+3\sqrt t$를 구했다.
      depends_on: []
      steps: [2b-4]
    - id: 2.B4
      mark_type: B
      points: 3
      evidence: $\dfrac{13}{2}\ln2-\dfrac74\ln7-\dfrac12$를 구했다.
      depends_on: []
      steps: [2b-5]
    - id: 2.B5
      mark_type: B
      points: 3
      evidence: $20\ln2-5\ln5$를 구했다.
      depends_on: []
      steps: [2b-6]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 부분 점수 가능(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4663}
  misconceptions:
  - id: MC-CAL-4663
    outcome_code: '70'
    wrong_work: '모든 $t$에서 $m(t)=t+3\sqrt t$로 두고 $\int_{\frac12}^4\ln(t+3\sqrt t)dt$를 한 번에 계산함'
    detect_cue: $t\le1$과 $t\ge1$의 경우 분류가 없음, $\ln7$ 항이 답에 없음
    feedback: 임계점 $x=t-\sqrt t$는 $t<1$이면 음수라 $x\ge0$ 범위 밖입니다. 이때 최소는 $x=0$에서 생깁니다.
    remedy: [RL-2]

