intent: '정적분과 급수의 관계를 알고, 바로 정적분으로 바꿀 수 없는 급수를 적절히 변형해 정적분을 구할 수 있는지(3-1), 주어진 상황을 함수로 표현하고 미분해 그래프의 개형을 파악하여 최솟값을 구하고 그 정적분을 계산할 수 있는지(3-2) 평가한다(문항카드 9 출제 의도 요지).'
key_idea: '(3-1) $\ln(3n+k)=\ln n+\ln\left(3+\dfrac kn\right)$로 분리하면 $\ln n$ 항이 상쇄되어 $\int_0^1\left(\dfrac{1}{(2+x)\ln(2+x)}-\dfrac{1}{(3+x)\ln(3+x)}\right)dx$가 된다; (3-2) 대칭으로 $f(x)=\lvert x\rvert+2\sqrt{(x-t)^2+3t}$, 임계점 $x=t-\sqrt t$가 $0$ 이상인지로 $t\lessgtr1$을 나눈다.'
stuck: '(3-1) 분자의 $\ln n$을 떼어 내 $\dfrac kn$만의 식으로 만드는 단계 / (3-2) 최소점 $t-\sqrt t$의 부호에 따라 $m(t)$가 두 식으로 갈리는 단계'
idea_tags: [IDEA-RIEMANN-SPLIT-LOG-N, IDEA-MIN-POINT-CASE-BY-PARAM]
tags: [정적분과 급수, 치환적분, 부분적분, 거리의 합 최소, 중앙대 실전]
elements:
  materials:
  - '로그가 들어간 급수의 극한 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^n\dfrac1n\cdot\dfrac{(3+\frac kn)\ln(3n+k)-(2+\frac kn)\ln(2n+k)-\ln n}{(2+\frac kn)(3+\frac kn)\ln(2+\frac kn)\ln(3+\frac kn)}$'
  - '점 $\mathrm{O}(0,0)$, $\mathrm{P}(x,0)$, $\mathrm{A}(t,\sqrt{3t})$, $\mathrm{B}(t,-\sqrt{3t})$와 거리의 합 $f(x)=\overline{PO}+\overline{PA}+\overline{PB}$'
  - '$\displaystyle\int_{\frac12}^4\ln(m(t))\,dt=a\ln2+b\ln5+c\ln7+d$'
  concepts: [정적분과 급수의 합의 관계, 로그의 성질, 치환적분법, 부분적분법, 두 점 사이의 거리, 도함수와 최솟값]
  tools:
  - 로그 분리로 $\ln n$ 상쇄
  - '분수 분해 $\dfrac{(3+x)\ln(3+x)-(2+x)\ln(2+x)}{(2+x)(3+x)\ln(2+x)\ln(3+x)}$'
  - '치환 $y=\ln(2+x)$, $y=\ln(3+x)$'
  - $x\ge0$만 보아도 됨(대칭·절댓값)
  - '$x\ge t$에서 $f''\ge0$이므로 $[0,t]$로 제한'
  - 임계점 위치에 따른 경우 분류
  - 로그의 성질과 부분적분
  conditions:
  - '$x_k=\dfrac kn$, $\Delta x=\dfrac1n$, 구간 $[0,1]$ ⇒ 급수 = 정적분(제시문 1)'
  - 'A, B가 $x$축에 대칭 ⇒ $\overline{PA}=\overline{PB}=\sqrt{(x-t)^2+3t}$'
  - '최솟값 문제, $x<0$이면 $f(-x)\le f(x)$ ⇒ $x\ge0$만 고려'
  - '$f''(x)=0$ ⇒ $x=t-\sqrt t$; $0\le t\le1$이면 $t-\sqrt t\le0$ ⇒ $x=0$에서 최소, $t\ge1$이면 $0\le t-\sqrt t\le t$ ⇒ 그 점에서 최소'
  - '$a$, $b$, $c$, $d$는 유리수 ⇒ $\ln2$, $\ln5$, $\ln7$과 상수항의 계수 비교'
  stimuli_used: ['1', '2', '3', '4']
  subpart_links: 3-1과 3-2는 제시문만 공유하고 결과는 서로 독립이다(3-1은 제시문 1·3, 3-2는 제시문 2·4 사용).

