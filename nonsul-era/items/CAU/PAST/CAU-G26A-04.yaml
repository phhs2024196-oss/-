intent: '위치벡터의 뜻을 이해하고 활용할 수 있는지(4-1), 공간좌표의 개념과 성질로 공간도형 문제를 해결할 수 있는지(4-2) 평가한다(문항카드 10 출제 의도 요지).'
key_idea: '(4-1) $\overrightarrow{PS}+\overrightarrow{RQ}=\overrightarrow{RS}+\overrightarrow{PQ}$로 재배열하면 $\overrightarrow{RS}$의 끝점은 삼각형 6개로 된 육각형, $\overrightarrow{PQ}$는 반지름 2인 원판이 되어 영역은 육각형을 두께 2로 둘러싼 도형; (4-2) 접점 P는 $\overline{OP}\perp\overline{PT}$이므로 OT에 수직인 평면 위 원(중심 D, 반지름 $2\sqrt5$) 위에 있고, $z\le0$ 부분은 중심각 $\dfrac\pi2$인 호.'
stuck: '(4-1) 네 점이 모두 움직이는 벡터 합을 두 벡터 $\overrightarrow{RS}$, $\overrightarrow{PQ}$로 재배열하는 단계 / (4-2) 접점의 자취가 원이고 $xy$평면에서 잘린 호의 중심각을 구하는 단계'
idea_tags: [IDEA-VECTOR-REARRANGE-DIFF-SET, IDEA-TANGENT-CIRCLE-OF-CONTACT]
tags: [위치벡터, 벡터의 영역, 코사인법칙, 구의 접선, 호의 길이, 중앙대 실전]
elements:
  materials:
  - '점 O, 반지름 1인 원 $C$, $\overline{AB}=5$, $\overline{BC}=6$, $\overline{CA}=7$인 삼각형 ABC(한 평면 위)'
  - '원 $C$ 위의 점 P, Q, 삼각형 ABC의 변 위의 점 R, S, $\overrightarrow{OX}=\overrightarrow{PS}+\overrightarrow{RQ}$인 점 X'
  - '구 $S:x^2+y^2+z^2=100$, 점 $\mathrm{T}\left(\dfrac{2\sqrt5}{3},\dfrac{14\sqrt5}{3},\dfrac{5\sqrt5}{3}\right)$, $z\le0$인 접점 P'
  concepts: [벡터의 상등, 위치벡터, 벡터의 덧셈·뺄셈, 코사인법칙, 삼각형의 넓이, 구의 방정식, 두 점 사이의 거리, 호도법과 호의 길이]
  tools:
  - 벡터 재배열 $\overrightarrow{PS}+\overrightarrow{RQ}=\overrightarrow{RS}+\overrightarrow{PQ}$
  - 삼각형 6개를 맞물려 붙인 육각형 작도
  - 육각형 둘레에 직사각형 6개와 부채꼴 6개를 붙여 넓이 계산
  - '코사인법칙으로 $\sin\angle ABC$와 삼각형 넓이'
  - '피타고라스 정리 $\overline{PT}=\sqrt{\overline{OT}^2-\overline{OP}^2}$'
  - 넓이 두 가지 표현으로 높이 $\overline{DP}$ 구하기
  - 닮음과 내분점 좌표
  - 직각삼각형에서 코사인으로 중심각 구하기
  conditions:
  - '$\overrightarrow{OY}=\overrightarrow{RS}$ ⇔ Y가 삼각형 6개로 만든 육각형 $\mathrm{I_1I_2I_3I_4I_5I_6}$의 변 또는 내부'
  - '$\overrightarrow{YZ}=\overrightarrow{PQ}$ ⇔ Z가 Y 중심 반지름 2인 원 $C''$과 그 내부'
  - '$\overrightarrow{OX}=\overrightarrow{OY}+\overrightarrow{YZ}$ ⇒ 영역 = 육각형 + 직사각형 6개(폭 2) + 부채꼴 6개(중심각 합 $2\pi$)'
  - '직선 PT가 P에서 구에 접함 ⇒ $\overline{OP}\perp\overline{PT}$, $\overline{OP}=10$ ⇒ P는 중심 D, 반지름 $2\sqrt5$인 원 위'
  - '$z$좌표가 0 이하 ⇒ 원 중 $xy$평면 아래 부분 ⇒ 부채꼴 ADB의 호 AB'
  stimuli_used: ['1', '2', '3']
  subpart_links: 4-1과 4-2는 제시문만 공유하고 결과는 서로 독립이다(4-1은 제시문 1·2, 4-2는 제시문 3 사용).

