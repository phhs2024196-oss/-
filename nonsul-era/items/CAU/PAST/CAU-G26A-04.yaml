stimuli:
- label: '1'
  body: |
    두 벡터 $\vec u$, $\vec v$의 크기와 방향이 같을 때, 두 벡터 $\vec u$, $\vec v$는 서로 같다고 하고 기호로 $\vec u=\vec v$와 같이 나타낸다.
- label: '2'
  body: |
    두 벡터 $\vec p$, $\vec q$에 대하여 $\vec p=\overrightarrow{OP}$, $\vec q=\overrightarrow{OQ}$라고 하면 $\vec p-\vec q=\overrightarrow{OP}-\overrightarrow{OQ}=\overrightarrow{QP}$이다.
- label: '3'
  body: |
    중심이 $\mathrm{C}(a,b,c)$이고 반지름의 길이가 $r$인 구의 방정식은 $(x-a)^2+(y-b)^2+(z-c)^2=r^2$이다.

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    그림과 같이 한 점 O와 반지름의 길이가 $1$인 원 $C$와 $\overline{AB}=5$, $\overline{BC}=6$, $\overline{CA}=7$인 삼각형 ABC가 한 평면 위에 있다. 두 점 P, Q가 원 $C$ 위를 움직이고 두 점 R, S가 삼각형 ABC의 변 위를 움직인다. 같은 평면 위의 점 X가 $\overrightarrow{OX}=\overrightarrow{PS}+\overrightarrow{RQ}$를 만족시킬 때, 점 X가 존재하는 영역의 넓이를 구하시오. [15점]

    [그림] 왼쪽 위에 원 $C$(그 위에 점 P, Q), 오른쪽에 삼각형 ABC(C 왼쪽 아래, A 오른쪽 아래, B 위)가 있고, 점 R은 변 CB 위, 점 S는 변 BA 위에 있다. 화살표 $\overrightarrow{PS}$, $\overrightarrow{RQ}$가 그려져 있고, 점 O는 두 도형 아래쪽에 떨어져 있다.
  points: 15
  depends_on: []
  answer: {kind: value, value: '72+36\sqrt6+4\pi', equivalents: ['72+36*sqrt(6)+4*pi'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{OX}=\overrightarrow{RS}+\overrightarrow{PQ}$. $\overrightarrow{RS}$ 끝점 영역은 넓이 $6\times6\sqrt6$인 육각형(둘레 $2(5+6+7)$), 여기에 반지름 2 원판을 더하면 넓이 $36\sqrt6+2\cdot36+4\pi$.
    steps:
    - {id: 1a, content: '$72+36\sqrt6+4\pi$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - 벡터의 합을 $\overrightarrow{RS}+\overrightarrow{PQ}$로 바꿔 쓸 수 있는가?
    - R, S가 삼각형의 변 위를 움직일 때 $\overrightarrow{RS}$를 시점 O로 옮기면 끝점은 어떤 영역을 채우는가?
    - P, Q가 반지름 1인 원 위를 움직이면 $\overrightarrow{PQ}$의 끝점은 반지름 몇인 원판을 채우는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.66 예시답안
    steps:
    - id: 1b-1
      content: |
        $$\overrightarrow{PS}+\overrightarrow{RQ}=\overrightarrow{OS}-\overrightarrow{OP}+\overrightarrow{OQ}-\overrightarrow{OR}=\overrightarrow{OQ}-\overrightarrow{OP}+\overrightarrow{OS}-\overrightarrow{OR}=\overrightarrow{PQ}+\overrightarrow{RS}=\overrightarrow{RS}+\overrightarrow{PQ}$$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        점 O를 한 꼭짓점으로 갖고 삼각형 ABC와 합동인 삼각형 6개를 그림과 같이 맞물리게 이어 붙여, 두 직선 AB와 $\mathrm{I_6I_1}$이 평행하도록, 육각형 $\mathrm{I_1I_2I_3I_4I_5I_6}$을 만들자. $\overrightarrow{OY}=\overrightarrow{RS}$가 되도록 이 육각형의 변 또는 그 내부에서 점 Y를 잡을 수 있고, 역으로 이 육각형의 변 또는 그 내부의 임의의 점 Y에 대하여 $\overrightarrow{OY}=\overrightarrow{RS}$를 만족시키도록 두 점 R, S를 삼각형 ABC의 변 위에서 잡을 수 있다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        육각형 $\mathrm{I_1I_2I_3I_4I_5I_6}$의 변 또는 그 내부의 점 Y를 중심으로 하고 반지름의 길이가 2인 원 $C'$을 생각하자. $\overrightarrow{YZ}=\overrightarrow{PQ}$가 되도록 원 $C'$과 그 내부에서 점 Z를 잡을 수 있고, 역으로 원 $C'$과 그 내부의 임의의 점 Z에 대하여 $\overrightarrow{YZ}=\overrightarrow{PQ}$를 만족시키도록 두 점 P, Q를 원 $C$ 위에서 잡을 수 있다.
      criteria: [1.B3]
    - id: 1b-4
      content: |
        $\overrightarrow{OX}=\overrightarrow{PS}+\overrightarrow{RQ}=\overrightarrow{RS}+\overrightarrow{PQ}=\overrightarrow{OY}+\overrightarrow{YZ}=\overrightarrow{OZ}$이므로 점 X가 존재하는 영역은, 6개의 직사각형 $\mathrm{I}_i\mathrm{K}_i\mathrm{J}_{i+1}\mathrm{I}_{i+1}\ (i=1,2,\cdots,6)$과 6개의 부채꼴 $\mathrm{I}_i\mathrm{J}_i\mathrm{K}_i$를 육각형 $\mathrm{I_1I_2I_3I_4I_5I_6}$의 둘레에 그림과 같이 이어 붙여 얻은 영역이다. 여기서 $\mathrm{I_7}=\mathrm{I_1}$, $\mathrm{J_7}=\mathrm{J_1}$로 간주하고 $\overline{\mathrm{I}_i\mathrm{J}_i}=2$이다.
      criteria: [1.B4]
    - id: 1b-5
      content: |
        6개의 직사각형의 넓이의 합은 $2\times2\times(5+6+7)=72$이다. 삼각형 ABC에서 코사인법칙에 의해 $\cos\angle ABC=\dfrac15$이어서 $\sin\angle ABC=\dfrac{2\sqrt6}{5}$이고 $\triangle ABC=6\sqrt6$이다. 따라서 육각형 $\mathrm{I_1I_2I_3I_4I_5I_6}$의 넓이는 $36\sqrt6$이다. 6개의 부채꼴의 중심각의 합은 $2\pi$이므로 그 넓이의 합은 $4\pi$이다. 따라서 점 X가 존재하는 영역의 넓이는 $72+36\sqrt6+4\pi$이다.
      criteria: [1.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: $\overrightarrow{PS}+\overrightarrow{RQ}=\overrightarrow{RS}+\overrightarrow{PQ}$를 찾았다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: $\overrightarrow{OY}=\overrightarrow{RS}$를 만족시키는 점 Y가 육각형 $\mathrm{I_1I_2I_3I_4I_5I_6}$의 변 또는 그 내부의 임의의 점인 것을 진술했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: $\overrightarrow{YZ}=\overrightarrow{PQ}$를 만족시키는 점 Z가 원 $C'$과 그 내부의 임의의 점인 것을 진술했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B4
      mark_type: B
      points: 5
      evidence: 점 X가 존재하는 영역의 넓이 $72+36\sqrt6+4\pi$를 구했다.
      depends_on: []
      steps: [1b-4, 1b-5]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 부분 점수 가능(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4664}
  misconceptions:
  - id: MC-GEO-4664
    outcome_code: '70'
    wrong_work: '점 X의 영역을 (삼각형 넓이)+(원 넓이) 또는 (육각형 넓이)+(반지름 2인 원 넓이)로 단순히 더함'
    detect_cue: 답에 직사각형 넓이 72(둘레 × 2)가 없음, 예 $36\sqrt6+4\pi$ 또는 $6\sqrt6+\pi$
    feedback: 육각형의 모든 점을 중심으로 반지름 2인 원판을 그리면, 육각형 둘레를 따라 폭 2인 띠(직사각형)와 꼭짓점의 부채꼴이 생깁니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표공간에 구 $S:x^2+y^2+z^2=100$과 점 $\mathrm{T}\left(\dfrac{2\sqrt5}{3},\dfrac{14\sqrt5}{3},\dfrac{5\sqrt5}{3}\right)$가 있다. 점 T를 지나는 직선이 $z$좌표가 $0$ 이하인 점 P에서 구 $S$에 접한다. 점 P가 나타내는 도형의 길이를 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\sqrt5\pi', equivalents: ['sqrt(5)*pi'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overline{OT}=5\sqrt5$, $\overline{PT}=5$, $\overline{DP}=2\sqrt5$, $\overline{OD}=4\sqrt5$, D의 높이 $\overline{DH}=\dfrac{4\sqrt5}{3}$, D에서 $xy$평면 위 현 AB까지 거리 $\overline{ID}=\sqrt{10}$, $\overline{AD}=2\sqrt5$에서 $\cos\angle ADI=\dfrac{1}{\sqrt2}$ ⇒ $\angle ADB=\dfrac\pi2$.
    steps:
    - {id: 2a, content: '호의 길이 $2\sqrt5\times\dfrac\pi2=\sqrt5\pi$', criteria: [2.B1, 2.B2, 2.B3, 2.B4]}
    hint_ladder:
    - 접점 P에서 $\overline{OP}\perp\overline{PT}$이다. P와 직선 OT 사이의 거리는 일정한가?
    - P는 직선 OT에 수직인 평면 위의 원 위에 있다. 그 원의 중심 D와 반지름을 구하자.
    - 원 중 $z\le0$인 부분이 만드는 호의 중심각을 구하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.67 예시답안
    steps:
    - id: 2b-1
      content: |
        구 $S$의 중심을 O라 하면 $\overline{OT}=5\sqrt5$이고 $\overline{PT}=\sqrt{\overline{OT}^2-\overline{OP}^2}=5$이다. (그림과 같이 구 $S$는 평면 OPT와 원에서 만나고 직선 PT는 점 P에서 이 원에 접한다.) 점 P에서 직선 OT에 내린 수선의 발을 D라 하면 $50=2\times\triangle\mathrm{OPT}=\overline{OT}\times\overline{DP}$에서 $\overline{DP}=2\sqrt5$를 얻는다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        따라서 점 P는, 직선 OT에 수직이고 중심이 점 D이고 반지름이 $2\sqrt5$인 원 $C$ 위에 있다. 원 $C$가 $xy$평면과 만나는 두 점을 A, B라 하면, 점 P가 나타내는 도형은, 선분 AB를 포함하는 부채꼴 ADB의 호 AB이다.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        두 삼각형 OPT와 ODP는 닮았으므로 $\overline{OP}:\overline{PT}=\overline{OD}:\overline{DP}$에서 $\overline{OD}=4\sqrt5$를 얻는다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        점 D는 선분 OT를 $4:1$로 내분하므로 그 좌표는 $\left(\dfrac{8\sqrt5}{15},\dfrac{56\sqrt5}{15},\dfrac{4\sqrt5}{3}\right)$이다. 점 D에서 $xy$평면에 내린 수선의 발을 H라 하면, $\overline{DH}=\dfrac{4\sqrt5}{3}$이므로 $\overline{OH}=\sqrt{\overline{OD}^2-\overline{DH}^2}=\dfrac{8\sqrt{10}}{3}$이다.
      criteria: [2.B3]
    - id: 2b-5
      content: |
        선분 AB의 중점을 I라 하면, 닮은 두 직각삼각형 ODH와 OID에서 $\overline{OH}:\overline{DH}=\overline{OD}:\overline{ID}$이므로 $\overline{ID}=\sqrt{10}$이고, 두 직각삼각형 AID와 BID에서 $\cos\angle ADI=\cos\angle BDI=\dfrac{1}{\sqrt2}$이다. 따라서 $\angle ADB=\angle ADI+\angle BDI=\dfrac\pi2$이고 호 AB의 길이 $l$은 $l=\overline{AD}\times\dfrac\pi2=\sqrt5\pi$이다.
      criteria: [2.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 4
