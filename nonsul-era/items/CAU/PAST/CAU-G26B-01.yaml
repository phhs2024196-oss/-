stimuli: []

stem: |
  다음 규칙에 따라 시행을 한다. 풀이와 함께 물음에 답하시오.

  - 남학생 2명과 여학생 2명이 두 번의 테스트로 구성된 프로그램에 참여한다.
  - 각 테스트가 시작할 때, 남학생 1명과 여학생 1명을 임의로 짝지어 두 개의 팀을 구성하여 테스트에 각각 참여한다.
  - 팀은 테스트마다 다시 구성한다.
  - 어떤 두 학생이 처음으로 팀이 되었을 때, 그 팀이 테스트를 통과할 확률은 $\dfrac12$이다.
  - 어떤 두 학생이 두 번 연속으로 같은 팀이 되었을 때, 첫 번째 테스트를 통과했다면 두 번째 테스트를 통과할 확률은 $\dfrac34$이다. 그러나 첫 번째 테스트를 통과하지 못했다면 두 번째 테스트를 통과할 확률은 $\dfrac14$이다.
  - 두 번의 테스트 동안 어떤 학생이 속한 팀이 한 번 이상 테스트를 통과하면 그 학생은 프로그램에 합격한 것으로 한다.

  위 시행에서 4명의 학생 모두 프로그램에 합격할 확률을 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    위 시행에서 4명의 학생 모두 프로그램에 합격할 확률을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac{53}{128}', equivalents: ['53/128'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 팀 유지($A$)이면 각 팀이 한 번 이상 통과할 확률 $\dfrac12+\dfrac12\cdot\dfrac14=\dfrac58$이 독립이라 $\left(\dfrac58\right)^2$; 팀 교체이면 네 번의 독립 통과(각 $\dfrac12$) 중 전원 합격 경우를 센다.
    steps:
    - {id: 1a, content: '$P(B)=\dfrac12\cdot\dfrac{25}{64}+\dfrac12\cdot\dfrac{7}{16}=\dfrac{53}{128}$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - 두 테스트의 팀 구성은 몇 가지 경우로 나뉘는가?
    - 팀이 그대로일 때와 바뀔 때, 각각 전원이 합격하려면 어떤 일이 일어나야 하는가?
    - 첫 번째 테스트 결과로 경우를 나누어 조건부확률을 구하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.72~73 예시답안
    steps:
    - id: 1b-1
      content: |
        (1) 두 테스트에서 팀이 바뀌지 않는 사건을 $A$라 하고, 4명의 학생 모두 프로그램에 합격하는 사건을 $B$라 하자. 남학생을 각각 ㄱ, ㄴ, 여학생을 각각 $a$, $b$라 하자.
      criteria: []
    - id: 1b-2
      content: |
        (2) 팀이 고정되는 경우는
        (ㄱ$-a$, ㄴ$-b$)→(ㄱ$-a$, ㄴ$-b$), (ㄱ$-b$, ㄴ$-a$)→(ㄱ$-b$, ㄴ$-a$)
        의 두 가지이고, 팀이 바뀌는 경우는
        (ㄱ$-a$, ㄴ$-b$)→(ㄱ$-b$, ㄴ$-a$), (ㄱ$-b$, ㄴ$-a$)→(ㄱ$-a$, ㄴ$-b$)
        의 두 가지이다. 따라서 $P(A)=P(A^c)=\dfrac12$이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        (3) $A$의 경우 $B$의 조건부확률 $P(B\mid A)$는 다음과 같이 구한다.
        - 첫 번째 테스트에서 두 팀이 모두 통과할 확률은 $\left(\dfrac12\right)^2=\dfrac14$이다. 이 경우 두 번째 테스트의 통과 여부와 관계없이 항상 4명 모두 합격이므로, 합격 확률 역시 $\dfrac14$이다.
        - 첫 번째 테스트에서 두 팀 중 한 팀만 통과할 확률은 $2\times\left(\dfrac12\right)^2=\dfrac12$이다. 이 경우 첫 번째 테스트를 통과한 팀은 항상 합격이며, 첫 번째 테스트를 실패한 팀이 합격할 확률은 $\dfrac14$이다. 따라서 모두 합격할 확률은 $\dfrac12\times\dfrac14=\dfrac18$이다.
        - 첫 번째 테스트에서 두 팀 모두 실패할 확률은 $\left(\dfrac12\right)^2=\dfrac14$이다. 이 경우 두 팀 모두 두 번째 테스트를 통과할 확률은 $\left(\dfrac14\right)^2=\dfrac1{16}$이다. 따라서 모두 합격할 확률은 $\dfrac14\times\dfrac1{16}=\dfrac1{64}$이다.
        - 종합하면, $P(B\mid A)=\dfrac14+\dfrac18+\dfrac1{64}=\dfrac{25}{64}$이다.
      criteria: [1.B2]
    - id: 1b-4
      content: |
        (4) $A^c$의 경우 $B$의 조건부확률 $P(B\mid A^c)$는 다음과 같이 구한다.
        - 첫 번째 테스트에서 두 팀이 모두 통과했을 경우, 두 번째 테스트의 통과 여부와 관계없이 항상 4명이 모두 합격이므로 합격 확률은 $\dfrac14$이다.
        - 첫 번째 테스트에서 두 팀 중 한 팀만 통과했을 경우, 두 팀 모두 두 번째 테스트를 통과해야 한다. 예를 들어 첫 번째 테스트에서 ㄱ$-a$ 팀이 통과하고 ㄴ$-b$ 팀이 실패했다고 하자. 두 번째 테스트에서 ㄱ$-b$ 팀만 통과한다면 ㄴ은 탈락이며, ㄴ$-a$ 팀만 통과한다면 $b$는 탈락이다. 두 팀 모두 두 번째 테스트를 통과할 확률은 $\dfrac12\times\dfrac12=\dfrac14$이므로, 모두 합격할 확률은 $2\times\dfrac14\times\dfrac14=\dfrac18$이다.
        - 첫 번째 테스트에서 모두 실패했을 경우, 두 팀 모두 두 번째 테스트를 통과해야 한다. 이 확률은 $\dfrac14$이므로, 모두 합격할 확률은 $\dfrac14\times\dfrac14=\dfrac1{16}$이다.
        - 종합하면, $P(B\mid A^c)=\dfrac14+\dfrac18+\dfrac1{16}=\dfrac7{16}$이다.
      criteria: [1.B3]
    - id: 1b-5
      content: |
        (5) 최종적으로, 구하는 확률은
        $$P(B)=P(A)P(B\mid A)+P(A^c)P(B\mid A^c)=\dfrac12\times\dfrac{25}{64}+\dfrac12\times\dfrac7{16}=\dfrac{53}{128}$$
        이다.
      criteria: [1.B4]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2027 논술가이드북(자연) p.73 별해
    key_idea: 팀 고정이면 각 팀이 한 번 이상 통과할 확률 $\dfrac58$의 곱, 팀 교체이면 네 테스트(각 $\dfrac12$, 독립) 중 통과한 개수로 나눈다.
    steps:
    - id: 1c-1
      content: |
        (1) 팀이 고정되었을 경우 두 팀이 각각 한 번 이상 통과하면 전원 합격이다.
        - 각 팀이 한 번 이상 통과할 확률은 첫 번째 테스트를 통과하거나 첫 번째 테스트는 실패하고 두 번째 테스트를 통과할 확률과 같으므로 $\dfrac12+\dfrac12\times\dfrac14=\dfrac58$이다.
        - 각 팀의 통과 여부는 서로 독립이므로, $P(B\mid A)=\left(\dfrac58\right)^2=\dfrac{25}{64}$이다.
      criteria: [1.B2]
    - id: 1c-2
      content: |
        (2) 팀이 바뀌었을 경우 4개 테스트의 통과 확률은 각각 $\dfrac12$이고 통과 여부는 모두 독립이다.
        - 4개의 테스트를 모두 통과했다면 전원 합격이다. 이때 확률은 $\left(\dfrac12\right)^4=\dfrac1{16}$이다.
        - 3개의 테스트를 통과하고 1개는 실패했을 때 역시 어떤 테스트를 통과했는지에 관계없이 전원 합격이다. 이때 확률은 ${}_4\mathrm{C}_3\times\left(\dfrac12\right)^4=\dfrac14$이다.
        - 2개의 테스트를 통과하고 2개는 실패했을 때, 첫 번째 테스트를 2개 통과하거나 두 번째 테스트를 2개 통과해야 한다. 첫 번째 테스트를 1개, 두 번째 테스트를 1개 통과했을 경우 항상 한 명의 탈락자가 발생한다. 이때 확률은 $2\times\left(\dfrac12\right)^4=\dfrac18$이다.
        - 1개 이하의 테스트를 통과했을 때는 전원이 합격할 수 없다.
        - 종합하면, $P(B\mid A^c)=\dfrac1{16}+\dfrac14+\dfrac18=\dfrac7{16}$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: $P(A)=\dfrac12$(팀이 유지될 확률)을 정확히 계산했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 6
      evidence: $P(B\mid A)=\dfrac{25}{64}$를 정확히 계산했다(예시 답안대로 풀었으면 각 경우의 확률 $\dfrac14$, $\dfrac18$, $\dfrac1{64}$를 정확히 계산할 때마다 +2).
      depends_on: []
      steps: [1b-3, 1c-1]
    - id: 1.B3
      mark_type: B
      points: 6
      evidence: $P(B\mid A^c)=\dfrac7{16}$을 정확히 계산했다(예시 답안대로 풀었으면 각 경우의 확률 $\dfrac14$, $\dfrac18$, $\dfrac1{16}$을 정확히 계산할 때마다 +2).
      depends_on: []
      steps: [1b-4, 1c-2]
    - id: 1.B4
      mark_type: B
      points: 4
      evidence: $P(B)=\dfrac{53}{128}$을 정확히 계산했다.
      depends_on: []
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 부분 점수 가능(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-4666}
  misconceptions:
  - id: MC-PRB-4666
    outcome_code: '70'
    wrong_work: '팀 유지 여부를 구분하지 않고 두 번째 테스트 통과 확률을 항상 $\dfrac12$(또는 항상 $\dfrac34$·$\dfrac14$)로 두어 계산함'
    detect_cue: 사건 $A$, $A^c$ 분할이 없음, 답이 $\dfrac7{16}$ 또는 $\dfrac{25}{64}$ 하나로만 나옴
