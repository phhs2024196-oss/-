key_idea: '(2-1) 집합 원소가 유한(5개)이므로 어느 항부터 반복되어야 하고, 3의 배수가 아닌 항 $3k+1$·$3k+2$에서 출발하면 $9(k+1)\to3(k+1)\to k+1$이 되어 순환은 $1\to9\to3\to1$뿐이다; (2-2) $x-u=t$로 치환해 $\int_0^x(x-t)f''(t)dt=\int_0^xf(t)dt-xf(0)$을 얻고 미분한다.'
stuck: '(2-1) 반복되는 서로 다른 수가 1, 3, 9뿐임을 경우 분류로 보이는 단계 / (2-2) 적분 속 $u f''(x-u)$를 치환과 부분적분으로 $f$의 적분으로 바꾸는 단계'
