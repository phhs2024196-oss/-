stuck: '(3-1) 피적분함수를 부분분수로 나누고 $\dfrac{e^{-x}}{1+e^{-x}}$ 꼴로 바꾸는 단계 / (3-2) $\overline{AB}^2$를 $x$로 나타내는 단계와 도함수 방정식 $(16t-15)\{(16t)^2-16t-15\}=0$의 인수분해'
