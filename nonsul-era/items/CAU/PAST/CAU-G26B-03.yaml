stimuli:
- label: '1'
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때 $\alpha$, $\beta$를 포함하는 구간에서 연속이면 다음 식이 성립한다.
    $$\int_a^bf(x)dx=\int_\alpha^\beta f(g(t))g'(t)dt$$
- label: '2'
  body: |
    미분가능한 함수 $f(x)$에서 $f'(a)=0$이고 $x=a$의 좌우에서 $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고 극댓값은 $f(a)$이다.

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    두 곡선 $y=\dfrac{3e^{2x}-6}{e^{2x}+3e^x+2}$과 $y=e^x-\dfrac32$으로 둘러싸인 도형의 넓이를 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac32\ln2-1', equivalents: ['3/2*ln2-1'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 교점 $x=0$, $\ln2$; 구간에서 분수식이 위. $\int_0^{\ln2}\left(3-\dfrac{3}{e^x+1}-\dfrac{6}{e^x+2}-e^x+\dfrac32\right)dx$.
    steps:
    - {id: 1a, content: '$=3\ln2+\left[3\ln(1+e^{-x})\right]_0^{\ln2}+\left[3\ln(1+2e^{-x})\right]_0^{\ln2}+\dfrac32\ln2-1=\dfrac32\ln2-1$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - $e^x=w$로 놓고 두 식을 같게 놓아 교점을 구하자.
    - 분모를 인수분해하면 분수식을 두 개의 간단한 분수로 나눌 수 있다.
    - $\dfrac{3}{e^x+1}=\dfrac{3e^{-x}}{1+e^{-x}}$로 바꾸면 적분이 쉬워진다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.77 예시답안
    steps:
    - id: 1b-1
      content: |
        $\dfrac{3e^{2x}-6}{e^{2x}+3e^x+2}=e^x-\dfrac32$를 풀면 $(e^x-1)(e^x-2)(2e^x+3)=0$이다. 두 곡선이 만나는 $x$좌표는 $0$, $\ln2$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $$\dfrac{3e^{2x}-6}{e^{2x}+3e^x+2}=3-\dfrac{9e^x+12}{(e^x+1)(e^x+2)}=3-\dfrac{3}{(e^x+1)}-\dfrac{6}{(e^x+2)}$$
        이므로 구하는 넓이는 아래와 같다.
        $$\int_0^{\ln2}\left(\dfrac{3(e^{2x}-2)}{e^{2x}+3e^x+2}-e^x+\dfrac32\right)dx=\int_0^{\ln2}\left(3-\dfrac{3}{(e^x+1)}-\dfrac{6}{(e^x+2)}-e^x+\dfrac32\right)dx$$
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $$=\int_0^{\ln2}\left(3-\dfrac{3e^{-x}}{(1+e^{-x})}-\dfrac{6e^{-x}}{(1+2e^{-x})}-e^x+\dfrac32\right)dx$$
        $$=3\ln2+\Big[3\ln(1+e^{-x})\Big]_0^{\ln2}+\Big[3\ln(1+2e^{-x})\Big]_0^{\ln2}+\dfrac32\ln2-1=\dfrac32\ln2-1$$
      criteria: [1.B3]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2027 논술가이드북(자연) p.77 별해
    key_idea: 분자·분모를 $e^x$로 나누면 피적분함수가 $\dfrac{3(e^x-2e^{-x})}{e^x+3+2e^{-x}}$, 즉 $3\dfrac{h'}{h}$ 꼴($h=e^x+3+2e^{-x}$).
    steps:
    - id: 1c-1
      content: |
        $\dfrac{3e^{2x}-6}{e^{2x}+3e^x+2}=e^x-\dfrac32$를 풀면 $(e^x-1)(e^x-2)(2e^x+3)=0$이다. 두 곡선이 만나는 $x$좌표는 $0$, $\ln2$이고 구하는 넓이는 아래와 같다.
        $$\int_0^{\ln2}\left(\dfrac{3(e^{2x}-2)}{e^{2x}+3e^x+2}-e^x+\dfrac32\right)dx=\int_0^{\ln2}\left(\dfrac{3(e^x-2e^{-x})}{e^x+3+2e^{-x}}-e^x+\dfrac32\right)dx$$
      criteria: [1.B1, 1.B2]
    - id: 1c-2
      content: |
        $$=\Big[3\ln(e^x+3+2e^{-x})\Big]_0^{\ln2}-\Big[e^x\Big]_0^{\ln2}+\dfrac32\ln2=\dfrac32\ln2-1$$
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: 교점의 $x$좌표 $0$, $\ln2$를 구했다.
      depends_on: []
      steps: [1b-1, 1c-1]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: 넓이를 구하는 정적분을 바르게 썼다.
      depends_on: []
      steps: [1b-2, 1c-1]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: 적분을 계산하여 $\dfrac32\ln2-1$을 구했다.
      depends_on: []
      steps: [1b-3, 1c-2]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 부분 점수 가능(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4669}
  misconceptions:
  - id: MC-CAL-4669
    outcome_code: '70'
    wrong_work: '$\int_0^{\ln2}\left(e^x-\dfrac32-\dfrac{3e^{2x}-6}{e^{2x}+3e^x+2}\right)dx$로 위아래를 바꿔 적분해 음수 $1-\dfrac32\ln2$를 얻음'
    detect_cue: 답이 음수이거나 위아래 비교(예 $x=\dfrac12\ln2$ 대입) 흔적이 없음
    feedback: 두 곡선 사이 넓이는 (위의 곡선)−(아래 곡선)을 적분합니다. 구간 안의 한 점에서 두 함숫값을 비교해 위아래를 확인하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    $\overline{AB}=\overline{AC}$이고 $\angle BAC\le\dfrac\pi2$인 삼각형 ABC가 반지름의 길이가 $1$인 원에 내접한다. $\overline{BC}=2x$라 할 때 함수 $f(x)$를 $f(x)=\overline{BC}^4+\dfrac{15}{4}\left(\overline{AB}^2+\overline{AC}^2\right)$으로 정의하자. $f(x)$의 최댓값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{525}{16}', equivalents: ['525/16', '32.8125'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f=16x^4+15(1+\sqrt{1-x^2})$, $t=x^2$로 $16t^2+15(1+\sqrt{1-t})$의 도함수 영점 $t=\dfrac{15}{16}$에서 극대.
    steps:
    - {id: 2a, content: '$f\left(\dfrac{15}{16}\right)=\dfrac{525}{16}>f(1)=31>f(0)=30$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 꼭지각이 직각 이하이면 원의 중심은 삼각형의 어디에 있는가?
    - 원의 중심에서 BC까지의 거리를 $x$로 나타내 $\overline{AB}^2$를 구하자.
    - $t=x^2$로 놓고 미분해 극대를 찾고, 양 끝값과 비교하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.78 예시답안
    steps:
    - id: 2b-1
      content: |
        $\angle BAC\le\dfrac\pi2$이므로 원의 중심이 삼각형 내부나 선분 BC 위에 있다. $\overline{BC}=2x$ $(0\le x\le1)$라 하면 $\overline{BC}^2=4x^2$이고 $\overline{AB}^2=\overline{AC}^2=2+2\sqrt{1-x^2}$이다. 따라서
        $$\overline{BC}^4+\dfrac{15}{4}\left(\overline{AB}^2+\overline{AC}^2\right)=16x^4+15\left(1+\sqrt{1-x^2}\right)$$
      criteria: [2.B1]
    - id: 2b-2
      content: |
        이고 $x^2=t$ $(0\le t\le1)$로 놓고 함수 $f(t)=16t^2+15(1+\sqrt{1-t})$의 최댓값을 구하면 된다. 미분하면 $f'(t)=32t-\dfrac{15}{2}\dfrac{1}{\sqrt{1-t}}$이고 $f'(0)=-\dfrac{15}{2}$이다. $f'(t)=0$을 정리하면 다음과 같다.
        $$(64)^2t^3-(64)^2t^2+(15)^2=(16t)^3-16(16t)^2+(15)^2=(16t-15)\left((16t)^2-16t-15\right)$$
      criteria: [2.B2]
    - id: 2b-3
      content: |
        $g(t)=(16)^2t^2-16t-15$는 중심축이 $\dfrac1{32}$이고 $g(0)<0$, $g\left(\dfrac12\right)>0$이므로 음근과 양근 $\alpha\left(\dfrac1{32}<\alpha<\dfrac12\right)$를 갖는다. $f'(t)$의 부호를 고려하여 곡선의 증가, 감소를 보면 $t=\alpha$에서 극소, $t=\dfrac{15}{16}$에서 극대이다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        $f(0)=30$이고 $f(1)=31$이다. $f\left(\dfrac{15}{16}\right)=\dfrac{525}{16}\ (>32)$이므로 구하는 최댓값은 $\dfrac{525}{16}$이다.
      criteria: [2.B3]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 2027 논술가이드북(자연) p.79 별해
    key_idea: $x=\sin t$, $\cos t=s$로 놓으면 $g(s)=16(1-s^2)^2+15(1+s)$, $g'(s)=(4s-1)(16s^2+4s-15)$.
    steps:
    - id: 2c-1
      content: |
        $\angle BAC\le\dfrac\pi2$이므로 원의 중심이 삼각형 내부나 선분 BC 위에 있다. $\overline{BC}=2x$ $(0\le x\le1)$라 하면 $\overline{BC}^2=4x^2$이고 $\overline{AB}^2=\overline{AC}^2=2+2\sqrt{1-x^2}$이다. 따라서
        $\overline{BC}^4+\dfrac{15}{4}\left(\overline{AB}^2+\overline{AC}^2\right)=4\left(4x^4+\dfrac{15}{4}\left(1+\sqrt{1-x^2}\right)\right)$
        이고 $x=\sin t$ $\left(0\le t\le\dfrac\pi2\right)$로 놓으면 $f(t)=16\sin^4t+15(1+\cos t)=16(1-\cos^2t)^2+15(1+\cos t)$의 최댓값을 구하면 된다. 여기서 다시 $\cos t=s$로 놓고 $g(s)=16(1-s^2)^2+15(1+s)$의 최댓값을 구하면 된다.
      criteria: [2.B1]
    - id: 2c-2
      content: |
        미분하면 $g'(s)=(4s)^3-16(4s)+15=(4s-1)(16s^2+4s-15)$이다. $g'(s)$의 부호를 고려하며 $s=\dfrac14$에서 극대이다.
      criteria: [2.B2]
    - id: 2c-3
      content: |
        $g(0)=31$이고 $g(1)=30$이다. $g\left(\dfrac14\right)=\dfrac{525}{16}\ (>32)$이므로 구하는 최댓값은 $\dfrac{525}{16}$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 4
      evidence: 식 $f(x)=16x^4+15(1+\sqrt{1-x^2})$을 세웠다.
      depends_on: []
      steps: [2b-1, 2c-1]
    - id: 2.B2
      mark_type: B
      points: 8
      evidence: $f'$의 부호를 살피고 $x^2=\dfrac{15}{16}$(별해는 $s=\dfrac14$)에서 극대임을 구했다.
      depends_on: []
      steps: [2b-2, 2b-3, 2c-2]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: 양 끝점 $x=0$, $x=1$에서의 값과 비교하여 최댓값 $\dfrac{525}{16}$을 구했다.
      depends_on: []
      steps: [2b-4, 2c-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 부분 점수 가능(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4670}
  - {code: '71', misconception: MC-CAL-4656}
  misconceptions:
  - id: MC-GEO-4670
    outcome_code: '70'
    wrong_work: '원의 중심이 삼각형 밖에 있는 경우의 식 $\overline{AB}^2=2-2\sqrt{1-x^2}$를 쓰거나 $x$의 범위를 정하지 않음'
    detect_cue: $\angle BAC\le\dfrac\pi2$ 조건 사용 흔적 없음, $\overline{AB}^2$ 식의 부호가 반대
