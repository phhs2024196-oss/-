  - '$\overline{MB''}^2+\overline{GB''}^2=\overline{MG}^2$ ⇒ $\angle MB''G=90^\circ$ ⇒ 평면 DMB ⊥ 평면 BGD'
  - '두 평면 DMB, DMG가 이루는 예각 α ⇒ B에서 평면 DMG에 내린 수선의 발 I, 직선 MD에 내린 수선의 발 J ⇒ $\sin\alpha=\dfrac{\overline{BI}}{\overline{BJ}}$'
