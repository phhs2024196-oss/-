  - 부피를 두 가지로 표현해 거리 구하기
  - 삼수선의 정리로 이면각의 평면각 잡기(별해는 정사영 넓이비)
  conditions:
  - '접선 $l_1:\dfrac{x_1x}{6}-\dfrac{y_1y}{6}=1$ ⇒ $\overline{OA}\cdot\overline{OB}$가 $x_1^2-y_1^2=6$에 의해 일정 ⇒ $\triangle OAB=\triangle OCD=6$'
  - '$\overline{OA}:\overline{OD}=2:3$ ⇒ $\overline{OA}=2t$, $\overline{OD}=3t$, $\overline{OB}=\dfrac6t$, $\overline{OC}=\dfrac4t$'
  - '$\overline{OA}:\overline{OD}=\overline{OC}:\overline{OB}$ ⇒ $\triangle ODA\sim\triangle OBC$ ⇒ $\mathrm{AD}\parallel\mathrm{BC}$ ⇒ $\triangle ADE\sim\triangle BCE$, 넓이비 $t^2:\dfrac{4}{t^2}$'
