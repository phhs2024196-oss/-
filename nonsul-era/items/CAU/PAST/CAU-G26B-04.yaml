stimuli:
- label: '1'
  body: |
    쌍곡선 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$ 위의 점 $\mathrm{P}(x_1,y_1)$에서의 접선의 방정식은 $\dfrac{x_1x}{a^2}-\dfrac{y_1y}{b^2}=1$이다.
- label: '2'
  body: |
    오른쪽 그림과 같이 직선 $l$을 공유하는 두 반평면 $\alpha$, $\beta$로 이루어진 도형을 이면각이라고 한다. 직선 $l$ 위의 한 점 O를 지나고 $l$에 수직인 두 반직선 OA, OB를 각각 반평면 $\alpha$, $\beta$ 위에 그을 때, $\angle AOB$의 크기는 점 O의 위치에 관계없이 일정하다. 이때 이 각의 크기를 이면각의 크기라고 한다.

    [그림] 직선 $l$을 공유하는 두 반평면 $\alpha$(아래), $\beta$(위)와, $l$ 위의 점 O에서 $l$에 수직으로 $\alpha$ 위에 그은 반직선 OA, $\beta$ 위에 그은 반직선 OB가 그려져 있다.

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    오른쪽 그림과 같이 쌍곡선 $\dfrac{x^2}{6}-\dfrac{y^2}{6}=1$ 위의 제1사분면에 있는 점 $\mathrm{P_1}$에서의 접선 $l_1$이 두 직선 $y=-x$, $y=x$와 만나는 점을 각각 A, B라 하고, 쌍곡선 위의 제2사분면에 있는 점 $\mathrm{P_2}$에서의 접선 $l_2$가 두 직선 $y=-x$, $y=x$와 만나는 점을 각각 C, D라 하고, 두 접선 $l_1$과 $l_2$의 교점을 E라 하자. $\overline{OA}:\overline{OD}=2:3$이고 삼각형 ADE의 넓이가 $4$일 때, 사각형 ABCD의 넓이를 구하시오. (단, O는 원점이다.) [15점]

    [그림] 쌍곡선의 오른쪽 가지 위 제1사분면에 $\mathrm{P_1}$, 왼쪽 가지 위 제2사분면에 $\mathrm{P_2}$가 있다. 접선 $l_1$은 $y=-x$와 제4사분면의 점 A에서, $y=x$와 제1사분면의 점 B에서 만나고, 접선 $l_2$는 $y=-x$와 제2사분면의 점 C에서, $y=x$와 제3사분면의 점 D에서 만난다. 두 접선은 원점 아래쪽의 점 E에서 만난다.
  points: 15
  depends_on: []
  answer: {kind: value, value: '32', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\triangle OAB=\triangle OCD=6$, $\overline{OA}=2t$, $\overline{OD}=3t$ ⇒ $S=3t^2+12+\dfrac{12}{t^2}$; $\triangle ADE:\triangle BCE=t^2:\dfrac4{t^2}=4:(S+4)$.
    steps:
    - {id: 1a, content: '$x=t^2=\dfrac23$ ⇒ $S=3x+12+\dfrac{12}{x}=32$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - 접선과 두 점근선이 만드는 삼각형 OAB의 넓이를 접점 좌표로 계산해 보자. 접점과 관계가 있는가?
    - $\overline{OA}=2t$, $\overline{OD}=3t$로 두고 사각형 ABCD를 원점 주위의 네 직각삼각형으로 나누자.
    - 두 삼각형 ADE와 BCE는 닮음이다. 넓이비를 써서 방정식을 세우자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.80 예시답안
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P_1}$의 좌표를 $(x_1,y_1)$이라고 하자. 접선 $l_1$의 방정식 $\dfrac{x_1x}{6}-\dfrac{y_1y}{6}=1$과 두 직선의 방정식 $y=-x$, $y=x$를 연립하여 계산한 두 점 A, B의 $x$좌표의 값에 $\sqrt2$를 곱해를 얻는다. $\overline{OA}=\dfrac{\sqrt2}{\frac{x_1}{6}+\frac{y_1}{6}}$, $\overline{OB}=\dfrac{\sqrt2}{\frac{x_1}{6}-\frac{y_1}{6}}$ 따라서 $\triangle OAB=\dfrac12\times\dfrac{\sqrt2}{\frac{x_1}{6}+\frac{y_1}{6}}\times\dfrac{\sqrt2}{\frac{x_1}{6}-\frac{y_1}{6}}=6$이다. 비슷한 방법으로 $\triangle OCD=6$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $\overline{OA}=2t$, $\overline{OD}=3t$ $(t>0)$라 놓으면, $\triangle ODA=3t^2$이고, $\triangle OAB=\triangle OCD=6$이므로 $\overline{OB}=\dfrac6t$, $\overline{OC}=\dfrac4t$이다. 따라서 $\triangle OBC=\dfrac{12}{t^2}$이고, 사각형 ABCD의 넓이를 $S$라 하면
        $$S=\triangle ODA+\triangle OAB+\triangle OCD+\triangle OBC=3t^2+12+\dfrac{12}{t^2}$$
        이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $\overline{OA}:\overline{OD}=\overline{OC}:\overline{OB}$이므로 두 직각삼각형 ODA와 OBC는 닮은꼴이고 $\angle ODA=\angle OBC$이다. 따라서 두 선분 AD와 BC는 평행하고 두 삼각형 ADE와 BCE도 닮았다. 삼각형 ODA에서 $\overline{AD}^2=\overline{OA}^2+\overline{OD}^2=13t^2$이고 삼각형 OBC에서 $\overline{BC}^2=\overline{OB}^2+\overline{OC}^2=\dfrac{52}{t^2}$이므로 두 삼각형 ADE와 BCE의 넓이의 비는 $t^2:\dfrac4{t^2}$이다.
      criteria: [1.B3]
    - id: 1b-4
      content: |
        $x=t^2$ $(x>0)$이라 놓으면, $\triangle BCE=S+4=3x+16+\dfrac{12}{x}$이므로
        $x:\dfrac4x=\triangle ADE:\triangle BCE=4:3x+16+\dfrac{12}{x}$에서
        $0=3x^3+16x^2+12x-16=(x+2)(x+4)(3x-2)$를 얻는다. $x>0$이므로 $x=\dfrac23$이고
        $S=3x+12+\dfrac{12}{x}=32$이다.
      criteria: [1.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: $\triangle OAB=\triangle OCD=6$을 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: 사각형 ABCD의 넓이 $S$를 $S=3t^2+12+\dfrac{12}{t^2}$로 표현했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: 두 삼각형 ADE와 BCE의 넓이의 비 $t^2:\dfrac4{t^2}$를 구했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B4
      mark_type: B
      points: 4
      evidence: 사각형 ABCD의 넓이 $S=32$를 구했다.
      depends_on: []
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 ±1점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 부분 점수 가능(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4671}
  misconceptions:
  - id: MC-GEO-4671
    outcome_code: '70'
    wrong_work: '닮은 삼각형 ADE, BCE의 넓이비를 길이비 $\overline{AD}:\overline{BC}=t:\dfrac2t$ 그대로 써서 $\dfrac{t}{2/t}=\dfrac{4}{S+4}$로 방정식을 세움'
    detect_cue: 넓이비에 제곱이 없음, $S\neq32$
    feedback: 닮은 도형의 넓이비는 닮음비(길이비)의 제곱입니다. $\overline{AD}^2:\overline{BC}^2=13t^2:\dfrac{52}{t^2}$을 쓰세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    오른쪽 그림과 같이 모든 모서리의 길이가 $2$인 정육면체 ABCD−EFGH에서 변 AE의 중점을 M이라 하자. 삼각형 BMG의 넓이를 $S$, 사면체 BDMG의 부피를 $V$, 두 평면 DMB와 DMG가 이루는 예각을 $\alpha$라 할 때, $SV\sin\alpha$를 구하시오. [15점]

    [그림] 윗면 ABCD, 아랫면 EFGH이고 A–E, B–F, C–G, D–H가 세로 모서리인 정육면체(D가 맨 위, H는 가려진 꼭짓점으로 점선)에서, 모서리 AE의 중점 M과 꼭짓점 D, B, G를 잇는 선분들(사면체 BDMG의 모서리)이 그려져 있다.
  points: 15
  depends_on: []
  answer: {kind: value, value: '\sqrt{30}', equivalents: ['sqrt(30)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $S=3$(코사인법칙), 평면 DMB ⊥ 평면 BGD에서 $V=\dfrac13\cdot2\sqrt3\cdot\sqrt3=2$, $\overline{BI}=2$, $\overline{BJ}=\dfrac{2\sqrt6}{\sqrt5}$ ⇒ $\sin\alpha=\dfrac{\sqrt{30}}{6}$.
    steps:
    - {id: 2a, content: '$SV\sin\alpha=3\times2\times\dfrac{\sqrt{30}}{6}=\sqrt{30}$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 정육면체 안의 각 선분 길이를 피타고라스 정리로 모두 구해 두자.
    - 선분 BD의 중점 B′에 대해 MB′과 GB′이 모두 BD에 수직이다. 두 평면 DMB와 BGD는 어떤 관계인가?
    - 점 B에서 평면 DMG에 내린 수선의 발과 직선 MD에 내린 수선의 발을 잡으면 삼수선의 정리를 쓸 수 있다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.81 예시답안
    steps:
    - id: 2b-1
      content: |
        피타고라스의 정리에 의해 $\overline{BG}=\overline{GD}=\overline{DB}=2\sqrt2$, $\overline{MB}=\overline{MD}=\sqrt5$, $\overline{MG}=3$임을 알 수 있다. 이로부터 이등변삼각형 DMB와 정삼각형 BGD의 넓이는 각각 $\sqrt6$, $2\sqrt3$임을 쉽게 알 수 있다. $\theta=\angle MBG$라 하면 삼각형 BMG에서 $\cos\theta=\dfrac{5+8-9}{2\times\sqrt5\times2\sqrt2}=\dfrac{1}{\sqrt{10}}$이므로 $\sin\theta=\dfrac{3}{\sqrt{10}}$이다. 따라서 삼각형 BMG의 넓이 $S$는 $S=\dfrac12\times\sqrt5\times2\sqrt2\times\dfrac{3}{\sqrt{10}}=3$이다. 비슷한 방법으로 삼각형 DMG의 넓이도 3이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        직선 AC와 직선 BD의 교점을 B′이라 하면, 삼각형 MBB′과 삼각형 MDB′이 합동이므로 선분 MB′과 선분 BD는 서로 수직이다. 그리고 삼각형 GBB′과 삼각형 GDB′이 합동이므로 선분 GB′과 선분 BD는 서로 수직이다. $\overline{BB'}=\sqrt2$이므로 직각삼각형 MBB′에서 $\overline{MB'}=\sqrt{\overline{MB}^2-\overline{BB'}^2}=\sqrt3$이고 직각삼각형 GBB′에서 $\overline{GB'}=\sqrt{\overline{BG}^2-\overline{BB'}^2}=\sqrt6$이다. 따라서 $\overline{MG}^2=\overline{MB'}^2+\overline{GB'}^2$이고 $\angle MB'G=90^\circ$이다. 즉, 두 평면 DMB와 BGD는 수직으로 만난다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        두 평면 DMB와 BGD가 수직으로 만나므로 점 M에서 평면 BGD에 내린 수선의 발은 점 B′이다. 따라서 사면체 BDMG의 부피 $V$는
        $$V=\dfrac13\times\triangle BGD\times\overline{MB'}=\dfrac13\times2\sqrt3\times\sqrt3=2$$
      criteria: [2.B2]
    - id: 2b-4
      content: |
        점 B에서 평면 DMG에 내린 수선의 발을 I라고 하면, $V=\dfrac13\times\triangle DMG\times\overline{BI}$에서 $\overline{BI}=2$이다. 점 B에서 직선 MD에 내린 수선의 발을 J라고 하면, $\overline{BJ}=\dfrac{2\sqrt6}{\sqrt5}$임을 $\triangle DMB=\dfrac12\times\overline{MD}\times\overline{BJ}$에서 알 수 있다. 삼수선의 정리에 의해 두 직선 MD와 IJ는 수직으로 만난다. 따라서 $\alpha=\angle BJI$이고 $\sin\alpha=\dfrac{\overline{BI}}{\overline{BJ}}=\dfrac{\sqrt{30}}{6}$이고 $SV\sin\alpha=\sqrt{30}$이다.
      criteria: [2.B3]
