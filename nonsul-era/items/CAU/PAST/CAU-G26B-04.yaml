elements:
  materials:
  - '쌍곡선 $\dfrac{x^2}{6}-\dfrac{y^2}{6}=1$, 점근선 $y=\pm x$, 제1·제2사분면의 접점 $\mathrm{P_1}$, $\mathrm{P_2}$와 접선 $l_1$, $l_2$'
  - '$\overline{OA}:\overline{OD}=2:3$, $\triangle ADE=4$'
  - '모서리 길이 2인 정육면체 ABCD−EFGH, 모서리 AE의 중점 M, 삼각형 BMG, 사면체 BDMG, 평면 DMB와 DMG'
  concepts: [쌍곡선의 접선의 방정식, 점근선, 삼각형의 넓이, 닮음, 피타고라스 정리, 코사인법칙, 사면체의 부피, 이면각, 삼수선의 정리, 정사영]
  tools:
  - 접선과 $y=\pm x$의 교점으로 $\overline{OA}$, $\overline{OB}$ 계산
  - '$\overline{OA}=2t$, $\overline{OD}=3t$로 매개화'
  - 두 직각삼각형 ODA, OBC의 닮음으로 평행 판정
  - '닮은 삼각형의 넓이비 = (길이비)$^2$'
  - '$x=t^2$로 놓고 삼차방정식 인수분해'
  - 코사인법칙으로 $\sin\theta$와 삼각형 넓이
