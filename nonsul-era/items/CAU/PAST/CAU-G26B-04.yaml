intent: '쌍곡선의 접선과 점근선 사이의 위치 관계를 이용해 삼각형·사각형의 넓이를 계산할 수 있는지(4-1), 이면각의 개념으로 사면체의 부피와 이면각의 크기를 구할 수 있는지(4-2) 평가한다(문항카드 14 출제 의도 요지).'
key_idea: '(4-1) 접선과 두 점근선이 만드는 삼각형 넓이는 접점과 무관하게 $\triangle OAB=\triangle OCD=6$; $\overline{OA}=2t$, $\overline{OD}=3t$로 두면 $\overline{OB}=\dfrac6t$, $\overline{OC}=\dfrac4t$이고 $\mathrm{AD}\parallel\mathrm{BC}$라 $\triangle ADE\sim\triangle BCE$; (4-2) 두 평면 DMB와 BGD가 수직이어서 $V=\dfrac13\triangle BGD\times\overline{MB''}$, 이면각은 삼수선 정리(또는 정사영 넓이비)로 $\sin\alpha=\dfrac{\sqrt{30}}{6}$.'
stuck: '(4-1) 삼각형 OAB의 넓이가 항상 6임을 접선의 방정식으로 확인하는 단계와 닮음비를 넓이비로 옮기는 단계 / (4-2) 점 B에서 평면 DMG까지의 거리와 직선 MD까지의 거리로 이면각의 사인을 얻는 단계'
idea_tags: [IDEA-HYPERBOLA-ASYMPTOTE-TRIANGLE-CONST, IDEA-SIMILAR-TRIANGLES-AREA-RATIO, IDEA-DIHEDRAL-THREE-PERP]
