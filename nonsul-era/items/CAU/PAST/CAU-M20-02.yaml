stimuli:
- label: '1'
  body: |
    두 함수 $f:X\to Y$, $g:Y\to Z$에 대하여 $X$의 각 원소 $x$에 $Z$의 원소 $g(f(x))$를 대응시켜 $X$를 정의역, $Z$를 공역으로 하는 새로운 함수를 정의할 수 있다. 이 새로운 함수를 $f$와 $g$의 합성함수라 하고, 기호로 $g\circ f:X\to Z$와 같이 나타낸다.
- label: '2'
  body: |
    $a>0,\ a\neq1,\ N>0$일 때 다음이 성립한다.
    $$a^x=N\iff x=\log_a N$$
- label: '3'
  body: |
    미분가능한 두 함수 $f(x),\ g(x)$에 대하여 다음이 성립한다.
    $$\int f(x)g'(x)\,dx=f(x)g(x)-\int f'(x)g(x)\,dx$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    함수 $f(x)=\dfrac{cx+1}{dx+1}$에 대하여 $(f\circ f\circ f)(x)=x$을 만족하는 실수 $x$가 무한히 많이 있다. 이때 $d$의 최댓값을 구하시오. (단, $c,\ d$는 실수이다.) [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '-\dfrac{3}{4}', equivalents: ['-3/4', '-0.75'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $(f\circ f\circ f)(x)$ 를 일차분수식으로 정리한 뒤, $=x$ 가 무한히 많은 $x$에서 성립하면 분모를 곱한 다항식 등식은 항등식이다.
    steps:
    - {id: 1a, content: '계수비교로 $d=-c^2-c-1=-\left(c+\frac12\right)^2-\frac34$, 최댓값 $-\dfrac34$ ($c=-\frac12$)', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - $(f\circ f)(x)$ 를 먼저 하나의 분수식으로 정리하자.
    - 해가 무한히 많은 이차 이하 다항방정식은 어떤 식인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2020 모의논술 채점자 매뉴얼(자연) p.13 예시답안
    steps:
    - id: 1b-1
      content: |
        합성함수의 정의를 적용하여
        $$(f\circ f)(x)=f(f(x))=\frac{c\left(\dfrac{cx+1}{dx+1}\right)+1}{d\left(\dfrac{cx+1}{dx+1}\right)+1}=\frac{(c^2+d)x+(c+1)}{d(c+1)x+(d+1)}$$
        이 됨을 알 수 있고 이로부터
        $$(f\circ f\circ f)(x)=(f\circ f)(f(x))=\frac{(c^3+2cd+d)x+(c^2+c+d+1)}{d(c^2+c+d+1)x+(cd+2d+1)}$$
        를 얻는다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $(f\circ f\circ f)(x)=x$가 무한히 많은 실수 $x$에 대하여 성립하므로
        $$d(c^2+c+d+1)x^2+(cd+2d+1)x=(c^3+2cd+d)x+(c^2+c+d+1)$$
        가 항등식이라는 것을 알 수 있고, 따라서 $d(c^2+c+d+1)=0$, $cd+2d+1=c^3+2cd+d$, $c^2+c+d+1=0$을 얻는다. 이를 정리하면 $d=-c^2-c-1$의 조건을 얻고, 이를 대입하면 다른 조건들도 만족됨을 알 수 있다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        따라서 $d=-c^2-c-1=-\left(c+\dfrac12\right)^2-\dfrac34$로부터, 가능한 $d$의 최댓값은 $c=-\dfrac12$일 때 $-\dfrac34$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: '합성함수의 정의를 이용하여 $(f\circ f\circ f)(x)=\dfrac{(c^3+2cd+d)x+(c^2+c+d+1)}{d(c^2+c+d+1)x+(cd+2d+1)}$ 를 얻었다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: 항등식의 성질을 이용하고 연립방정식을 풀어 조건 $d=-c^2-c-1$ 을 얻었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: $d$ 의 최댓값 $-\dfrac34$ 을 얻었다.
      depends_on: []
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '10', meaning: 만점}
  - {code: '70', misconception: MC-ALG-4103}
  misconceptions:
  - id: MC-ALG-4103
    outcome_code: '70'
    wrong_work: '$(f\circ f\circ f)(x)=x$ 를 특정한 $x$(예 $x=0$)에서만 대입하거나, 이차방정식의 판별식 조건으로 처리함'
    detect_cue: 계수 세 개를 모두 0으로 두는 식이 없음, $d$ 가 $c$ 의 식으로 정리되지 않음
    feedback: 이차 이하 다항방정식의 해가 무한히 많으려면 모든 계수가 0이어야 합니다(항등식).
    remedy: [RL-1]
- id: '2'
  stem: |
    $0<x<1$에서 정의된 함수 $g(x)=\displaystyle\int_1^x\sin(\ln t)\,dt$에 대하여, $g(x)$가 극값을 가지는 점들의 집합을 $A$라고 하자. $A$의 원소들을 큰 순서대로 모두 나열한 수열을 $\{a_n\}$이라고 할 때, $\displaystyle\sum_{n=1}^{\infty}\left(g(a_n)-\frac12\right)$의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{1}{2(e^{\pi}+1)}', equivalents: ['1/(2(e^pi+1))', '\dfrac{e^{-\pi}}{2(1+e^{-\pi})}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$g(x)=\dfrac x2(\sin(\ln x)-\cos(\ln x))+\dfrac12$ 이고 극값점은 $a_n=e^{-n\pi}$. $g(a_n)-\dfrac12=-\dfrac12(-e^{-\pi})^n$ 은 등비수열.'
    steps:
    - {id: 2a, content: '$\sum_{n=1}^{\infty}\left(-\frac12\right)(-e^{-\pi})^n=-\dfrac12\cdot\dfrac{-e^{-\pi}}{1+e^{-\pi}}=\dfrac{1}{2(e^\pi+1)}$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - $s=\ln t$ 로 치환해 보자.
    - $\int e^s\sin s\,ds$ 는 부분적분을 두 번 하면 자기 자신이 다시 나온다.
    - $g'(x)=\sin(\ln x)$ 의 부호가 바뀌는 점은? $0<x<1$ 에 주의.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2020 모의논술 채점자 매뉴얼(자연) p.14 예시답안
    steps:
    - id: 2b-1
      content: |
        $s=\ln t$로 치환하면 $g(x)=\displaystyle\int_1^x\sin(\ln t)\,dt=\int_0^{\ln x}\sin s\cdot e^s\,ds$가 되고, 부분적분법을 이용하면
        $$\int_0^{\ln x}e^s\sin s\,ds=\left[-e^s\cos s\right]_0^{\ln x}-\int_0^{\ln x}(-e^s\cos s)\,ds=\left[-e^s\cos s\right]_0^{\ln x}+\int_0^{\ln x}e^s\cos s\,ds$$
        가 되며, 부분적분법을 한번 더 이용하면
        $$\int_0^{\ln x}e^s\sin s\,ds=\left[-e^s\cos s\right]_0^{\ln x}+\left[e^s\sin s\right]_0^{\ln x}-\int_0^{\ln x}e^s\sin s\,ds$$
        가 되어
        $$\int_0^{\ln x}e^s\sin s\,ds=\frac12\left[e^s\sin s-e^s\cos s\right]_0^{\ln x}=\frac x2(\sin(\ln x)-\cos(\ln x))+\frac12$$
        임을 알 수 있다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        한편, $g(x)$가 극값을 가지는 점들은 $g'(x)=\sin(\ln x)=0$인 점들이므로 $\ln x=n\pi$ (단, $n$은 정수)이고, 문제의 조건 $0<x<1$으로부터 $g(x)$는 $x=e^{-n\pi}$ (단, $n$은 자연수)에서 극값을 가짐을 알 수 있다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        이때, $g(e^{-n\pi})=\dfrac{e^{-n\pi}}{2}(\sin(-n\pi)-\cos(-n\pi))+\dfrac12=-\dfrac{e^{-n\pi}}{2}\cdot(-1)^n+\dfrac12$이므로,
        $$\sum_{n=1}^{\infty}\left(g(a_n)-\frac12\right)=-\frac12\sum_{n=1}^{\infty}(-e^{-\pi})^n=-\frac12\cdot\frac{-e^{-\pi}}{1+e^{-\pi}}=\frac{1}{2(e^\pi+1)}$$
        이다.
        (원문은 가운데 식을 $-e^{-n\pi}\cdot(-1)^n+\dfrac12$ 로 적어 계수 $\dfrac12$ 이 빠져 있고 합의 첨자를 $k=1$ 로 적었으나, 다음 식에서 $-\dfrac12$ 을 곱해 최종값은 같다. 오식만 바로잡아 옮김)
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 6
      evidence: '부분적분법을 두 번 이용하여 $\int_1^x\sin(\ln t)\,dt=\dfrac x2(\sin(\ln x)-\cos(\ln x))+\dfrac12$ 을 얻었다.'
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 4
      evidence: '$g(x)$ 가 $x=e^{-n\pi}$ (단, $n$ 은 자연수)에서 극값을 가짐을 보였다.'
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: '등비급수의 합을 이용해 $\sum_{n=1}^{\infty}\left(g(a_n)-\frac12\right)=\dfrac{1}{2(e^\pi+1)}$ 을 얻었다.'
      depends_on: []
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '15', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4104}
  - {code: '71', misconception: MC-CAL-4105}
  misconceptions:
  - id: MC-CAL-4104
    outcome_code: '70'
    wrong_work: 부분적분을 한 번만 하고 멈추거나, 두 번째 부분적분의 부호를 틀려 $\int e^s\sin s\,ds$ 가 소거됨(0=… 꼴)
    detect_cue: 닫힌식이 $\dfrac x2(\sin(\ln x)-\cos(\ln x))+\dfrac12$ 와 다름, 또는 계수 $\dfrac12$ 누락
    feedback: 두 번 부분적분하면 우변에 $-\int e^s\sin s\,ds$ 가 다시 나옵니다. 이를 좌변으로 옮겨 2로 나누세요.
    remedy: [RL-2]
  - id: MC-CAL-4105
    outcome_code: '71'
    wrong_work: '$0<x<1$ 을 무시하고 $x=e^{n\pi}$ ($n$ 자연수)로 두거나 $n=0$($x=1$)을 포함함'
    detect_cue: 첫째항이 $e^{\pi}$ 또는 공비가 $-e^{\pi}$ 로 발산, 또는 첫째항에 $x=1$ 포함
    feedback: '$0<x<1$ 이면 $\ln x<0$ 이므로 $\ln x=-n\pi$ ($n=1,2,\cdots$)입니다. 큰 순서로 나열하면 $a_n=e^{-n\pi}$.'
    remedy: [RL-3]

