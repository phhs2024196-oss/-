key_idea: '(3-1) $y$에 관한 이차방정식의 중근 조건으로 $b=a+\dfrac1{4a}+1$, 넓이 $h(a)=\dfrac a6\left(2+\dfrac1a\right)^3$ 를 미분. (3-2) 직선 AC, AB 의 경사각 차가 $60^\circ$ 또는 $120^\circ$ ⇒ $\pm\sqrt3=\tan(\alpha-\beta)$.'
stuck: (3-1) 접함 조건을 $x$ 가 아닌 $y$ 에 관한 이차방정식의 중근으로 세우는 단계 / (3-2) 두 직선이 이루는 각이 예각·둔각 두 경우임을 보는 단계
