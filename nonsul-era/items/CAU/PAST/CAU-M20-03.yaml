stimuli:
- label: '1'
  body: |
    직선 $y=mx+n\ (m\neq0)$이 양의 방향의 $x$축과 이루는 각의 크기를 $\theta$라고 하면 $\tan\theta=m$이다.
- label: '2'
  body: |
    두 직선 $y=m_1x+n_1$, $y=m_2x+n_2$가 서로 수직이면 $m_1m_2=-1$이다.
- label: '3'
  body: |
    0과 $\pi$ 사이의 각 $\alpha$와 $\beta$에 대하여 다음 식이 성립한다.
    $$\tan(\alpha-\beta)=\frac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$$
    (단, $\alpha\neq\dfrac{\pi}{2},\ \beta\neq\dfrac{\pi}{2},\ \tan\alpha\tan\beta\neq-1$)
- label: '4'
  body: |
    함수 $f(x)$가 $x=c$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(c,f(c))$에서의 접선의 방정식은 $y-f(c)=f'(c)(x-c)$이다.
- label: '5'
  body: |
    함수 $g(x)$가 구간 $[u,v]$에서 연속이고 $g(x)\ge0$이면 정적분 $\displaystyle\int_u^v g(x)\,dx$는 곡선 $y=g(x)$와 두 직선 $x=u,\ x=v$ 및 $x$축으로 둘러싸인 도형의 넓이를 나타낸다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    포물선 $y=b-ax^2\,(b>2)$가 원 $x^2+y^2-2y=0$에 외접하도록 두 실수 $a,b$를 정할 때, 이 포물선과 $x$축으로 둘러싸인 영역의 넓이를 $a$로 표현하고 그 넓이의 최솟값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'h(a)=\dfrac{a}{6}\left(2+\dfrac{1}{a}\right)^3,\ \text{최솟값}\ \dfrac{9}{2}', equivalents: ['9/2', '\dfrac{4b}{3}\sqrt{\dfrac{b}{a}}\ (b=a+\frac{1}{4a}+1)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x^2$ 을 소거한 $y$ 의 이차방정식이 중근을 가질 조건에서 $b=a+\dfrac1{4a}+1$.
    steps:
    - {id: 1a, content: '$h(a)=\dfrac{4b}{3}\sqrt{\dfrac ba}=\dfrac a6\left(2+\dfrac1a\right)^3$, $h''(a)=0\Rightarrow a=1$, $h(1)=\dfrac92$', criteria: [1.B1, 1.B2]}
    hint_ladder:
    - 원의 방정식에 $x^2=\dfrac{b-y}{a}$ 를 대입하면 $y$ 에 관한 이차방정식이 된다.
    - 외접하면 두 곡선이 좌우 대칭인 두 점에서 접한다. 교점의 $y$ 좌표는 하나뿐이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2020 모의논술 채점자 매뉴얼(자연) p.15 예시답안
    steps:
    - id: 1b-1
      content: |
        두 식 $y=b-ax^2$와 $x^2+y^2-2y=0$을 연립하여 $y$에 관한 이차방정식 $y^2-\left(2+\dfrac1a\right)y+\dfrac ba=0$을 얻는다. 포물선이 원에 외접하므로 이 이차방정식은 중근을 갖는다. 따라서 $D=\left(2+\dfrac1a\right)^2-4\cdot\dfrac ba=0$에서
        $$b=\frac a4\left(2+\frac1a\right)^2=a+\frac1{4a}+1$$
        을 얻는다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $b=a+\dfrac1{4a}+1>2$이므로 $a>0$이다. 포물선과 $x$축으로 둘러싸인 영역의 넓이를 $h(a)$라 하면,
        $$h(a)=\int_{-\sqrt{\frac ba}}^{\sqrt{\frac ba}}(b-ax^2)\,dx=2\int_0^{\sqrt{\frac ba}}(b-ax^2)\,dx=\frac{4b}{3}\sqrt{\frac ba}=\frac a6\left(2+\frac1a\right)^3$$
        이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $a>0$이어서 $h'(a)=\dfrac13\left(2+\dfrac1a\right)^2\left(1-\dfrac1a\right)=0$에서 $a=1$을 얻는다. $h(1)=\dfrac92$이므로 넓이의 최솟값은 $\dfrac92$이다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: '포물선과 $x$ 축으로 둘러싸인 영역의 넓이를 $a$ 로 표현했다($h(a)=\dfrac a6\left(2+\dfrac1a\right)^3$ 또는 동치식).'
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: 넓이의 최솟값 $\dfrac92$ 를 구했다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석). 또한 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '10', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4106}
  misconceptions:
  - id: MC-GEO-4106
    outcome_code: '70'
    wrong_work: '원과 포물선이 꼭짓점 $(0,2)$ 에서 접한다고 보고 $b=2$ 로 두거나, $x$ 에 관한 사차방정식의 판별식을 세움'
    detect_cue: $b=2$ 를 사용(조건 $b>2$ 위반), 또는 $b$ 와 $a$ 의 관계식이 $b=a+\dfrac1{4a}+1$ 과 다름
    feedback: $x^2$ 을 소거하면 $y$ 에 관한 이차방정식이 됩니다. 좌우 대칭인 두 접점의 $y$ 좌표가 같으므로 이 방정식이 중근을 가져야 합니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    포물선 $y=3-x^2$ 위의 점 A는, 점 A에서 그은 접선 위의 한 점 B와 점 $\mathrm{C}(-\sqrt3,0)$과 함께 정삼각형 ABC를 이룬다. 두 점 A, B의 쌍을 모두 찾아 좌표를 제시하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: set, value: '\left\{\left(\mathrm{A}(0,3),\ \mathrm{B}(-2\sqrt3,3)\right),\ \left(\mathrm{A}\left(\dfrac{7\sqrt3}{6},-\dfrac{13}{12}\right),\ \mathrm{B}\left(\dfrac{5\sqrt3}{8},\dfrac{65}{24}\right)\right)\right\}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 'A$(a,3-a^2)$ 에서 직선 AC 기울기 $\sqrt3-a$, 접선 기울기 $-2a$. 두 직선이 이루는 각 $60^\circ$ ⇒ $\tan(\alpha-\beta)=\pm\sqrt3$ ⇒ $a=0$ 또는 $a=\dfrac{7\sqrt3}{6}$.'
    steps:
    - {id: 2a, content: '$a=0$: A$(0,3)$, B$(-2\sqrt3,3)$. $a=\dfrac{7\sqrt3}{6}$: A$\left(\dfrac{7\sqrt3}{6},-\dfrac{13}{12}\right)$, B 는 접선과 AC 의 수직이등분선의 교점 $\left(\dfrac{5\sqrt3}{8},\dfrac{65}{24}\right)$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 두 직선 AC, AB 의 경사각을 $\alpha,\ \beta$ 라 두자. $\lvert\alpha-\beta\rvert$ 는 어떤 값일 수 있는가?
    - 정삼각형의 꼭짓점 B 는 변 AC 의 수직이등분선 위에 있다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2020 모의논술 채점자 매뉴얼(자연) p.16 예시답안
    steps:
    - id: 2b-1
      content: |
        두 직선 AC, AB가 $x$축의 양의 방향과 이루는 각을 각각 $\alpha,\ \beta$라 하자. 이 두 직선의 교점을 지나고 $x$축과 평행한 직선이, 두 직선 AC, AB가 이루는 둔각 또는 예각을 통과함에 따라 $\lvert\alpha-\beta\rvert=60^\circ$ 또는 $\lvert\alpha-\beta\rvert=120^\circ$이다.
      criteria: []
    - id: 2b-2
      content: |
        점 A를 $(a,3-a^2)$으로 놓으면 두 직선 AC, AB의 기울기는 각각 $\tan\alpha=\dfrac{(3-a^2)-0}{a-(-\sqrt3)}=\sqrt3-a$, $\tan\beta=-2a$이므로
        $$\pm\sqrt3=\tan(\alpha-\beta)=\frac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}=\frac{(\sqrt3-a)-(-2a)}{1+(\sqrt3-a)(-2a)}$$
        에서 $a=0$ 또는 $a=\dfrac{7\sqrt3}{6}$을 얻는다.
      criteria: [2.B1, 2.B2]
    - id: 2b-3
      content: |
        $a=0$이면 $\mathrm{A}=(0,3)$, $\mathrm{B}=(-2\sqrt3,3)$이다.
      criteria: [2.B1]
    - id: 2b-4
      content: |
        $a=\dfrac{7\sqrt3}{6}$이면 $\mathrm{A}=\left(\dfrac{7\sqrt3}{6},-\dfrac{13}{12}\right)$이고 직선 AB의 방정식은 $y=-2a(x-a)+3-a^2=-\dfrac{7\sqrt3}{3}x+\dfrac{85}{12}$이다.
      criteria: [2.B2]
    - id: 2b-5
      content: |
        선분 AC의 중점을 D라 하면 $\mathrm{D}=\left(\dfrac{\sqrt3}{12},-\dfrac{13}{24}\right)$이다. 점 B를 $\left(b,-\dfrac{7\sqrt3}{3}b+\dfrac{85}{12}\right)$라 하면 직선 AC의 기울기는 $-\dfrac{\sqrt3}{6}$이고 직선 BD는 직선 AC와 수직이므로
        $$\frac{\left(-\dfrac{7\sqrt3}{3}b+\dfrac{85}{12}\right)-\left(-\dfrac{13}{24}\right)}{b-\dfrac{\sqrt3}{12}}=\frac{6}{\sqrt3}$$
        에서 $b=\dfrac{5\sqrt3}{8}$을 얻는다. 따라서 점 B는 $\left(\dfrac{5\sqrt3}{8},\dfrac{65}{24}\right)$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: '점 A 가 포물선의 꼭짓점일 때, $\mathrm{A}=(0,3)$, $\mathrm{B}=(-2\sqrt3,3)$ 임을 제시했다.'
      depends_on: []
      steps: [2b-2, 2b-3]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: '점 A 가 포물선의 꼭짓점이 아닐 때, $\mathrm{A}=\left(\dfrac{7\sqrt3}{6},-\dfrac{13}{12}\right)$ 임을 제시했다.'
      depends_on: []
      steps: [2b-2, 2b-4]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: '점 A 가 포물선의 꼭짓점이 아닐 때, $\mathrm{B}=\left(\dfrac{5\sqrt3}{8},\dfrac{65}{24}\right)$ 임을 제시했다.'
      depends_on: []
      steps: [2b-5]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석). 또한 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '15', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4107}
  misconceptions:
  - id: MC-GEO-4107
    outcome_code: '70'
    wrong_work: '$\tan(\alpha-\beta)=\sqrt3$ 한 경우만 풀어 한 쌍만 제시(예: A$(0,3)$ 만)'
    detect_cue: 쌍이 하나뿐, $-\sqrt3$ 경우의 식이 없음
    feedback: 두 직선이 이루는 각이 $60^\circ$ 여도 경사각의 차는 $60^\circ$ 또는 $120^\circ$ 일 수 있습니다. $\tan(\alpha-\beta)=\pm\sqrt3$ 을 모두 보세요.
    remedy: [RL-2]

