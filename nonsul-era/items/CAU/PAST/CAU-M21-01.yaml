      depends_on: []
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: 임의의 사람이 특수그룹에 속하게 될 확률 $P(G)=\dfrac{16}{81}$을 올바르게 계산했다.
      depends_on: []
      steps: [1b-4]
    - id: 1.B4
      mark_type: B
      points: 5
      evidence: 위 세 결과로부터 최종 결과 $P(B\mid G)=\dfrac12$를 올바르게 유도했다.
      depends_on: []
      steps: [1b-5]
