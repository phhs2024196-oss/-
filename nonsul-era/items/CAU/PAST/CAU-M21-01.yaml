stimuli: []

stem: |
  다음을 읽고 문제에 답하시오.

  - 보물섬에 가는 사람들은 $\dfrac19$의 확률로 보물을 발견하여 보물을 가지고 돌아오고, $\dfrac89$의 확률로 보물을 발견하지 못하고 그냥 돌아온다.
  - 보물섬에 다녀온 사람들이 세관의 검색대를 통과하면, 검색대가 $0$과 $4$사이의 $x$값을 출력한다. (단, $x$는 실수)
  - 보물을 가진 사람들을 검색대에서 측정한 값의 분포는 확률밀도함수 $g(x)$를 따르고, 보물을 가지고 있지 않은 사람들을 측정한 값의 분포는 확률밀도함수 $f(x)$를 따른다.
  - 세관에서는 이 검색대에서 측정한 값이 $2$보다 크거나 같은 사람들을 특수그룹으로 분류하여, 잠재적인 보물 소유 그룹으로 판단한다.
  - 확률밀도함수 $f(x)$와 $g(x)$는 아래의 그래프와 같다.

  [그래프] 좌표평면에서 $y=f(x)$는 점 $\left(0,\dfrac23\right)$과 점 $(3,0)$을 잇는 선분이고, $y=g(x)$는 점 $(1,0)$과 점 $\left(4,\dfrac23\right)$을 잇는 선분이다. (가로축 눈금 $1,2,3,4$, 세로축 눈금 $\dfrac23$)

  보물섬에 다녀온 철수가 세관으로부터 특수그룹으로 분류되었을 때, 철수가 실제로 보물을 가지고 돌아왔을 확률을 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    철수가 특수그룹으로 분류되었을 때, 실제로 보물을 가지고 돌아왔을 확률을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac{1}{2}', equivalents: ['1/2', '0.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 넓이로 $P(G\mid B)=\dfrac89$, $P(G\mid B^{C})=\dfrac19$, 전확률 $P(G)=\dfrac{16}{81}$, 따라서 $P(B\mid G)=\dfrac{8/81}{16/81}=\dfrac12$.
    steps:
    - {id: 1a, content: '$P(B\mid G)=\dfrac{\frac89\cdot\frac19}{\frac89\cdot\frac19+\frac19\cdot\frac89}=\dfrac12$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - 구하는 것은 「특수그룹일 때 보물을 가질」 확률이다. 어느 사건이 조건인가?
    - 보물을 가진 사람이 특수그룹으로 분류될 확률은 $g$의 그래프에서 어느 부분의 넓이인가?
    - 특수그룹에 속할 확률 $P(G)$는 보물을 가진 경우와 가지지 않은 경우로 나누어 더한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.45 예시답안
    steps:
    - id: 1b-1
      content: |
        보물을 가지고 있을 사건을 $B$라고 표기하고, 특수그룹으로 분류되는 사건을 $G$라고 표기하면, 구하고자 하는 확률은 특수그룹으로 분류되었을 때 실제로 보물을 가지고 있을 확률인 $P(B\mid G)$가 된다. 이는 $P(G\mid B)$, $P(G\mid B^{C})$, $P(B)$ 등을 계산한 후, 해당 확률들로부터 유도될 수 있다.
      criteria: []
    - id: 1b-2
      content: |
        보물을 갖고 있는 사람이 특수그룹으로 분류될 확률 $P(G\mid B)$: 확률변수 $X$가 보물을 갖고 있는 사람이 검색대를 통과했을 때, 검색대로부터 측정한 값이라고 할 때, $P(G\mid B)$는 해당 확률변수의 확률밀도함수인 $g(x)$의 그래프로부터 $P(2\le X\le4)$로 계산될 수 있다. 이 확률은 그래프에서 $2\le x\le4$ 부분의 사다리꼴의 넓이가 되기 때문에, $1-1\times\dfrac29\times\dfrac12=\dfrac89$로 계산된다. 이는 $g(x)=\dfrac29x-\dfrac29$, $1\le x\le4$이고, $g(2)=\dfrac29$로부터 계산할 수 있다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        보물을 갖고 있지 않은 사람이 특수그룹으로 분류될 확률 $P(G\mid B^{C})$: 확률변수 $Y$가 보물을 갖고 있지 않은 사람이 검색대를 통과했을 때, 검색대가 측정한 값이라고 할 때, $P(G\mid B^{C})$는 해당 확률변수의 확률밀도함수인 $f(x)$의 그래프로부터 $P(2\le Y\le4)$로 계산될 수 있다. 이 확률은 그래프에서 $2\le x\le3$ 부분의 삼각형의 넓이가 되기 때문에, $1\times\dfrac29\times\dfrac12=\dfrac19$로 계산된다.
      criteria: [1.B2]
    - id: 1b-4
      content: |
        임의의 사람이 특수그룹에 속하게 될 확률인 $P(G)$는
        $$P(G)=P(G\cap B)+P(G\cap B^{C})=P(G\mid B)P(B)+P(G\mid B^{C})P(B^{C})$$
        로 구할 수 있고, 이는 $\dfrac89\times\dfrac19+\dfrac19\times\dfrac89=\dfrac{16}{81}$이 된다.
      criteria: [1.B3]
    - id: 1b-5
      content: |
        따라서 특수그룹에 속한 사람이 실제로 보물을 갖고 있을 확률은 다음과 같다.
        $$P(B\mid G)=\dfrac{P(G\cap B)}{P(G)}=\dfrac{P(G\mid B)P(B)}{P(G)}=\dfrac{8/81}{16/81}=\dfrac12$$
      criteria: [1.B4]
