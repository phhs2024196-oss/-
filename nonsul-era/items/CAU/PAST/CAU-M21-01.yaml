intent: 보물섬에 다녀온 사람이 특수그룹으로 분류되었을 때 실제로 보물을 가지고 있을 확률을 계산하는 과정을 통해 확률분포(확률밀도함수) 및 조건부확률에 대한 전반적인 이해도를 평가한다(채점자 매뉴얼 출제 의도 요지).
key_idea: '확률밀도함수 그래프 아래 넓이로 $P(G\mid B)=\dfrac89$, $P(G\mid B^{C})=\dfrac19$를 구하고 전확률로 $P(G)$를 만든 뒤 $P(B\mid G)=\dfrac{P(G\mid B)P(B)}{P(G)}$.'
stuck: 구하는 확률이 $P(G\mid B)$가 아니라 $P(B\mid G)$임을 알아채고, 사전확률 $\dfrac19$, $\dfrac89$로 가중하는 단계
