    outcome_code: '70'
    wrong_work: 답을 $P(G\mid B)=\dfrac89$로 씀
    detect_cue: 최종 답이 $\dfrac89$이고 $P(G)$ 계산이 없다
    feedback: 조건은 「특수그룹으로 분류되었을 때」입니다. 구하는 것은 $P(B\mid G)$이고, $P(G\mid B)$는 그 계산 재료일 뿐입니다.
    remedy: [RL-1]
  - id: MC-PRB-4202
    outcome_code: '71'
    wrong_work: '$\dfrac{P(G\mid B)}{P(G\mid B)+P(G\mid B^{C})}=\dfrac{8/9}{8/9+1/9}=\dfrac89$처럼 사전확률을 곱하지 않음'
    detect_cue: 분모·분자에 $\dfrac19$, $\dfrac89$가 곱해져 있지 않다
