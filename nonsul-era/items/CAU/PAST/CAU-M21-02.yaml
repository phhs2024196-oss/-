stimuli:
- label: 가
  body: |
    미분가능한 함수 $f(x)$에 대하여
    $$\int\frac{f'(x)}{f(x)}dx=\ln|f(x)|+C\quad(\text{단, }C\text{는 적분상수})$$
- label: 나
  body: |
    함수 $f(x)$가 $a$, $b$를 포함하는 열린구간에서 연속이고, $f(x)$의 한 부정적분이 $F(x)$일 때
    $$\int_a^b f(x)dx=F(b)-F(a)$$
- label: 다
  body: |
    모든 실수 $\theta$에 대하여 $\sin^2\theta+\cos^2\theta=1$
- label: 라
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$

stem: |
  다음 제시문 (가) - (라)를 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 2-1] 다음 적분을 계산하시오. [10점]
    $$\int_{-1}^{1}\frac{1+2e^{-x}}{1+e^x+e^{-x}}dx$$
  points: 10
  depends_on: []
  answer: {kind: value, value: '2', equivalents: ['2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 피적분함수 $=1-\dfrac{(1+e^x+e^{-x})'}{1+e^x+e^{-x}}$, 둘째 항은 기함수라 적분 0.
    steps:
    - {id: 1a, content: '$\Big[x-\ln(1+e^x+e^{-x})\Big]_{-1}^{1}=2$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 분모를 미분하면 무엇이 나오는가?
    - 분자 $1+2e^{-x}$를 분모와 분모의 도함수로 나타내 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.46 예시답안
    steps:
    - id: 1b-1
      content: |
        적분함수를 $\dfrac{1+2e^{-x}}{1+e^x+e^{-x}}=1-\dfrac{e^x-e^{-x}}{1+e^x+e^{-x}}$로 분해한다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        제시문 (가)를 이용하여 적분하여 $x-\ln\left(1+e^x+e^{-x}\right)+C$를 얻는다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        제시문 (나)를 이용하여 정적분을 계산하여 정답 $2$를 얻는다.
        $$\Big[x-\ln(1+e^x+e^{-x})\Big]_{-1}^{1}=2-\big\{\ln(1+e+e^{-1})-\ln(1+e^{-1}+e)\big\}=2$$
      criteria: [1.B3]
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    source_flow: 2021 논술가이드북(자연) p.46 별해1
    key_idea: 둘째 항이 기함수임을 이용
    steps:
    - id: 1c-1
      content: |
        적분을 $\dfrac{1+2e^{-x}}{1+e^x+e^{-x}}=1-\dfrac{e^x-e^{-x}}{1+e^x+e^{-x}}$로 분해한 후, 두 번째 함수가 좌함수(기함수)임을 이용하여 $\displaystyle\int_{-1}^{1}\frac{e^x-e^{-x}}{1+e^x+e^{-x}}dx=0$을 얻는다. $1$을 적분하여 정답 $2$를 얻는다.
      criteria: [1.B1, 1.B2, 1.B3]
  - id: S1-ALT2
    audience: ALT
    method_no: 3
    source_flow: 2021 논술가이드북(자연) p.46~47 별해2
    steps:
    - id: 1d-1
      content: |
        $u=e^{-x}$로 치환하여 $\displaystyle\int_{e^{-1}}^{e}\frac{2u+1}{u^2+u+1}du$를 얻고, 다시 $v=u^2+u+1$로 치환하여
        $$\int_{e^{-2}+e^{-1}+1}^{e^2+e+1}\frac1v\,dv=\ln\left(\frac{e^2+e+1}{e^{-2}+e^{-1}+1}\right)=\ln(e^2)=2$$
        를 구한다.
      criteria: [1.B1, 1.B2, 1.B3]
  - id: S1-ALT3
    audience: ALT
    method_no: 4
    source_flow: 2021 논술가이드북(자연) p.47 별해3
    steps:
    - id: 1e-1
      content: |
        $u=e^x$로 치환하여 $\displaystyle\int_{e^{-1}}^{e}\frac{u+2}{u(u^2+u+1)}du$를 얻는다. 적분함수를 $\dfrac2u-\dfrac{2u+1}{u^2+u+1}$로 분해한 후 적분하여,
        $$\Big(2\ln u-\ln(u^2+u+1)\Big)\Big|_{e^{-1}}^{e}=2$$
        를 구한다.
      criteria: [1.B1, 1.B2, 1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: |
        $1-\dfrac{e^x-e^{-x}}{1+e^x+e^{-x}}$로 분해했다. [별해2: $u=e^{-x}$로 치환해 $\int_{e^{-1}}^{e}\frac{2u+1}{u^2+u+1}du$를 얻음(치환 시도만 +2) / 별해3: $\frac2u-\frac{2u+1}{u^2+u+1}$로 분해]
      depends_on: []
      steps: [1b-1, 1c-1, 1d-1, 1e-1]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: |
        정적분을 계산하여 $x-\ln(1+e^x+e^{-x})+C$를 얻었다. [별해2: $v$ 치환으로 $\int\frac1v dv$를 얻음 / 별해3: $u=e^x$ 치환으로 $\int_{e^{-1}}^{e}\frac{u+2}{u(u^2+u+1)}du$를 얻음(치환 시도만 +2) / 별해1: 이 마크와 1.B3을 합쳐 「둘째 함수가 기함수임을 이용해 정답」 +5]
      depends_on: []
      steps: [1b-2, 1c-1, 1d-1, 1e-1]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: 정답 $2$를 얻었다.
      depends_on: []
      steps: [1b-3, 1c-1, 1d-1, 1e-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점(예시답안)}
  - {code: '21', meaning: 만점(별해)}
  - {code: '70', misconception: MC-CAL-4203}
  misconceptions:
  - id: MC-CAL-4203
    outcome_code: '70'
    wrong_work: '분자 $1+2e^{-x}$를 그대로 두고 $\ln(1+e^x+e^{-x})$를 적분 결과로 씀'
    detect_cue: 결과가 $0$ 또는 $\ln$ 항만 있음
    feedback: (가)는 분자가 분모의 도함수일 때만 쓸 수 있습니다. 분모의 도함수 $e^x-e^{-x}$가 분자에 나타나도록 먼저 분해하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    [문제 2-2] 닫힌구간 $[0,1]$에서 정의된 함수 $f(x)$가 다음 식을 만족한다.
    $$2f(\cos x)+f(\sin x)=3\sin x\cos x$$
    곡선 $y=f(x)$에 접하고 기울기가 $-1$인 접선의 방정식을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'y=-x+\dfrac{3\sqrt3}{4}', equivalents: ['y=-x+3\sqrt{3}/4', 'x+y-\frac{3\sqrt3}{4}=0'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x\to\dfrac{\pi}{2}-x$로 $f(\cos x)+2f(\sin x)=3\sin x\cos x$를 얻어 연립 ⇒ $f(x)=x\sqrt{1-x^2}$, $f'(x)=-1$에서 접점 $\left(\dfrac{\sqrt3}{2},\dfrac{\sqrt3}{4}\right)$.
    steps:
    - {id: 2a, content: '$f(\cos x)=\sin x\cos x\Rightarrow f(x)=x\sqrt{1-x^2}$, $\dfrac{1-2x^2}{\sqrt{1-x^2}}=-1\Rightarrow x=\dfrac{\sqrt3}{2}$, $y=-x+\dfrac{3\sqrt3}{4}$', criteria: [2.B1, 2.B2, 2.B3, 2.B4]}
    hint_ladder:
    - 식이 하나뿐이라 $f(\cos x)$와 $f(\sin x)$를 분리할 수 없다. $\sin$과 $\cos$를 맞바꾸는 대입은?
    - $x$ 대신 $\dfrac{\pi}{2}-x$를 넣어 보자.
    - '$t=\cos x$로 두면 $\sin x$는 $t$로 어떻게 쓰이는가? (구간 $[0,1]$ 주의)'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.47 예시답안
    steps:
    - id: 2b-1
      content: |
        주어진 식에 $x$ 대신 $\left(\dfrac{\pi}{2}-x\right)$를 대입하여 $f(\cos x)+2f(\sin x)=3\sin x\cos x$를 얻는다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $A=f(\cos x)$, $B=f(\sin x)$로 두고 $A$와 $B$에 대한 연립방정식을 풀어, $A=f(\cos x)=\sin x\cos x$를 얻는다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        구간 $[0,1]$에서 $\sin x=\sqrt{1-\cos^2x}$이므로 $t=\cos x$로 두면, $f(t)=t\sqrt{1-t^2}$, 즉 $f(x)=x\sqrt{1-x^2}$이다.
      criteria: [2.B3]
    - id: 2b-4
      content: |
        미분을 하여 식 $f'(x)=\dfrac{1-2x^2}{\sqrt{1-x^2}}=-1$을 풀어 접선의 접점의 좌표 $\left(\dfrac{\sqrt3}{2},\dfrac{\sqrt3}{4}\right)$를 구하고, 접선의 방정식 $y=-x+\dfrac{3\sqrt3}{4}$를 얻는다.
      criteria: [2.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 6
      evidence: 삼각함수의 성질(원문 「삼각부등식의 성질」)을 이용하여 $f(\cos x)+2f(\sin x)=3\sin x\cos x$를 얻었다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: 연립방정식을 풀어 $f(\cos x)=\sin x\cos x$ 또는 $f(\sin x)=\sin x\cos x$를 얻었다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: $f(x)=x\sqrt{1-x^2}$를 얻었다.
      depends_on: []
      steps: [2b-3]
    - id: 2.B4
      mark_type: B
      points: 3
      evidence: 미분을 하여 접선 $y=-x+\dfrac{3\sqrt3}{4}$를 구했다.
      depends_on: []
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 공식 주석 — 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능, 채점자는 답안의 완성도에 따라 −0.5~+0.5점 부여 가능
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4204}
  misconceptions:
  - id: MC-CAL-4204
    outcome_code: '70'
    wrong_work: '$f(\cos x)$와 $f(\sin x)$가 같다고 가정하거나 한 식만으로 $3f=3\sin x\cos x$로 처리'
    detect_cue: 두 번째 식($x\to\frac{\pi}{2}-x$) 없이 $f$를 결정함
    feedback: 한 식에 미지의 값이 두 개($f(\cos x)$, $f(\sin x)$)입니다. $x$ 대신 $\frac{\pi}{2}-x$를 넣어 두 번째 식을 만든 뒤 연립하세요.
    remedy: [RL-2]

