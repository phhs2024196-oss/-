intent: '(1) 치환적분법으로 적분을 계산하고 부정적분과 정적분의 관계로 정적분을 계산할 수 있는지, 어떤 치환이 적절한지 추측해 함수를 변형할 수 있는지 평가한다. (2) 삼각함수의 성질로 새 항등식을 유도해 연립방정식을 풀어 함수를 구하고, 도함수로 접선의 방정식을 구할 수 있는지 평가한다(가이드북 출제 의도 요지).'
key_idea: '(1) $\dfrac{1+2e^{-x}}{1+e^x+e^{-x}}=1-\dfrac{e^x-e^{-x}}{1+e^x+e^{-x}}$로 분해하면 둘째 항은 $\dfrac{f''}{f}$ 꼴. (2) $x$ 대신 $\dfrac{\pi}{2}-x$를 넣어 두 식을 연립하면 $f(\cos x)=\sin x\cos x$, 즉 $f(x)=x\sqrt{1-x^2}$.'
stuck: (1) 분자를 분모의 도함수가 드러나게 분해하는 발상 / (2) $x\to\dfrac{\pi}{2}-x$ 대입으로 두 번째 식을 만드는 발상
idea_tags: [IDEA-SPLIT-FPRIME-OVER-F, IDEA-FUNC-EQ-SYMMETRIC-SUBST]
tags: [치환적분, 함수방정식, 접선, 중앙대 모의]
elements:
  materials: ['지수함수 분수식 $\dfrac{1+2e^{-x}}{1+e^x+e^{-x}}$의 $[-1,1]$ 정적분', '$[0,1]$에서 정의된 $f$와 함수방정식 $2f(\cos x)+f(\sin x)=3\sin x\cos x$', 기울기 $-1$인 접선]
  concepts: [치환적분법, 부정적분과 정적분의 관계, 삼각함수의 성질, 접선의 방정식, 몫·합성함수의 미분]
  tools:
  - 분자 분해로 $f'/f$ 꼴 만들기
  - 기함수 적분 0(별해)
  - 지수 치환(별해)
  - '$x\to\frac{\pi}{2}-x$ 대입'
  - 연립방정식
  - $t=\cos x$ 치환으로 $f$ 결정
  - $f'(x)=-1$ 풀기
  conditions:
  - '(1) 분모 $1+e^x+e^{-x}$의 도함수가 $e^x-e^{-x}$ ⇒ 분자를 $1\cdot(\text{분모})-(e^x-e^{-x})$로 분해'
  - '(2) 등식이 모든 $x$에서 성립 ⇒ $x$ 대신 $\dfrac{\pi}{2}-x$를 넣어도 성립'
  - '(2) 정의역 $[0,1]$ ⇒ $\sin x=\sqrt{1-\cos^2x}$로 두고 $t=\cos x\in[0,1]$'
  - '(2) 기울기 $-1$ ⇒ $f''(x)=\dfrac{1-2x^2}{\sqrt{1-x^2}}=-1$, $0\le x<1$에서 해 $x=\dfrac{\sqrt3}{2}$'
  stimuli_used: [가, 나, 다, 라]
