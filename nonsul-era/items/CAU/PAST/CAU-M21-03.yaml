intent: '(1) 직선과 원의 특성을 이해하고 점과 직선 사이의 거리 공식을 깊이 있게 활용할 수 있는지 평가한다. (2) 직선과 원의 특성에 대한 이해와 미분으로 극값·최솟값을 구하는 능력, 극한값의 계산을 종합적으로 평가한다(가이드북 출제 의도 요지).'
key_idea: '(1) 두 원의 중심은 두 직선의 각의 이등분선 중 점 $(-2,3)$이 속한 영역 쪽인 $3x+3y-1=0$ 위에 있고, $(-2,3)$에서 그 직선까지의 거리가 공통현의 절반. (2) 접선 조건으로 $a=\dfrac{\sqrt2b}{\sqrt{(b-t)^2-2}}$, 넓이 $ab$를 $b$로 미분해 $b(t)=\dfrac{3t+\sqrt{t^2+16}}{2}$, $\dfrac{b(t)}{t}\to2$, $a(t)\to2\sqrt2$.'
stuck: (1) 두 원의 중심이 같은 이등분선 위에 있고 공통현이 중심선에 수직이라 $(-2,3)$과 중심선의 거리가 반현이 된다는 관찰 / (2) 넓이를 $b$ 하나의 함수로 쓰고 극한에서 $t$로 나누는 처리
