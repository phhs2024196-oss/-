  - '(2) $b>t+\sqrt2$ ⇒ $(b-t)^2-2>0$, $f''(b)=0$의 해 중 $b=\dfrac{3t+\sqrt{t^2+16}}{2}$만 유효'
  - '(2) 삼각형 넓이 $=\dfrac12\cdot2a\cdot b=ab$'
