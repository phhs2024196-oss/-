stimuli:
- label: 가
  body: |
    점 $(x_1,y_1)$과 직선 $ax+by+c=0$ 사이의 거리는 $\dfrac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$이다.
- label: 나
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 이 구간에 속하는 모든 $x$에 대하여 $f'(x)>0$이면 $f(x)$는 이 구간에서 증가하고 $f'(x)<0$이면 감소한다.
- label: 다
  body: |
    함수 $g(x)$가 $x=p$에서 미분가능하고 $x=p$에서 극값을 가지면 $g'(p)=0$이다.
- label: 라
  body: |
    두 함수 $u(x)$, $v(x)$에 대하여 $\displaystyle\lim_{x\to\infty}u(x)=\alpha$, $\displaystyle\lim_{x\to\infty}v(x)=\beta$ ($\alpha$, $\beta$는 실수)일 때, 다음의 식이 성립한다.

    - $\displaystyle\lim_{x\to\infty}\{u(x)\pm v(x)\}=\alpha\pm\beta$
    - $\displaystyle\lim_{x\to\infty}ku(x)=k\alpha$ (단, $k$는 상수)
    - $\displaystyle\lim_{x\to\infty}u(x)v(x)=\alpha\beta$
    - $\displaystyle\lim_{x\to\infty}\frac{u(x)}{v(x)}=\frac{\alpha}{\beta}$ (단, $\beta\neq0$)

stem: |
  다음 제시문 (가) - (라)를 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 3-1] 직선 $x+2y+1=0$과 직선 $2x+y-2=0$에 동시에 접하고 점 $(-2,3)$을 통과하는 원은 두 개 있다. 이 두 원의 교점을 연결한 선분의 길이를 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{2\sqrt2}{3}', equivalents: ['2\sqrt{2}/3', '2*sqrt(2)/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 중심은 이등분선 $3x+3y-1=0$ 위, 공통현은 중심선에 수직이고 $(-2,3)$이 한 끝점 ⇒ 반현 $=\dfrac{\sqrt2}{3}$.
    steps:
    - {id: 1a, content: '$\dfrac{\lvert-6+9-1\rvert}{\sqrt{18}}=\dfrac{\sqrt2}{3}$, 공통현 $\dfrac{2\sqrt2}{3}$', criteria: [1.B1, 1.R1, 1.B2]}
    hint_ladder:
    - 두 직선에 동시에 접하는 원의 중심은 어떤 도형 위에 있는가?
    - 이등분선은 두 개다. 점 $(-2,3)$이 있는 영역과 만나는 것은 어느 쪽인가?
    - 두 원의 공통현과 두 중심을 잇는 직선은 어떤 관계인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.48 예시답안
    steps:
    - id: 1b-1
      content: |
        두 직선 $x+2y+1=0$, $2x+y-2=0$으로부터 같은 거리에 있는 점 $\mathrm{P}(x,y)$가 나타내는 도형은 이 두 직선의 각의 이등분선이다. 점 $\mathrm{P}(x,y)$가 나타내는 도형의 방정식은
        $$\frac{\lvert x+2y+1\rvert}{\sqrt{1^2+2^2}}=\frac{\lvert2x+y-2\rvert}{\sqrt{2^2+1^2}}$$
        에서 직선 $x-y-3=0$ 또는 직선 $3x+3y-1=0$임을 알 수 있다. 따라서 문제에서 주어진 두 원의 중심은 모두 직선 $x-y-3=0$ 위에 있거나 직선 $3x+3y-1=0$ 위에 있다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        한편, 두 직선 $x+2y+1=0$, $2x+y-2=0$은 좌표평면을 네 개의 영역으로 분할하고, 점 $(-2,3)$은 두 부등식 $x+2y+1>0$, $2x+y-2<0$을 동시에 만족하는 영역에 속한다. 직선 $3x+3y-1=0$ 위의 한 점 $\left(\dfrac13,0\right)$이 이 두 부등식을 만족하므로 두 원의 중심은 모두 직선 $3x+3y-1=0$ 위에 있다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        점 $(-2,3)$과 직선 $3x+3y-1=0$ 사이의 거리는 $\dfrac{\lvert-6+9-1\rvert}{\sqrt{3^2+3^2}}=\dfrac{\sqrt2}{3}$이고 두 원의 공통현의 길이의 반이다. 따라서 공통현의 길이는 $\dfrac{2\sqrt2}{3}$이다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: 직선 $x-y-3=0$과 $3x+3y-1=0$을 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: 두 원의 중심이 모두 직선 $3x+3y-1=0$ 위에 있음을 보였다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: 공통현의 길이 $\dfrac{2\sqrt2}{3}$를 구했다.
      depends_on: []
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4205}
  misconceptions:
  - id: MC-GEO-4205
    outcome_code: '70'
    wrong_work: '중심을 $x-y-3=0$ 위로 잡아 $(-2,3)$과 그 직선 사이 거리 $\dfrac{8}{\sqrt2}$로 공통현을 계산'
    detect_cue: 공통현 길이가 $8\sqrt2$ 등 $\dfrac{2\sqrt2}{3}$가 아님, 이등분선 선택 근거 없음
    feedback: 원은 점 $(-2,3)$을 지나므로 두 직선이 나눈 네 영역 중 그 점이 있는 영역 안에 있습니다. 그 영역을 지나는 이등분선을 고르세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    [문제 3-2] 원 $x^2+(y-t)^2=2$ $(t\ge\sqrt2)$는 그림과 같이 $\dfrac{\lvert x\rvert}{a}+\dfrac{y}{b}=1$ $(a>0,\ b>t+\sqrt2)$의 그래프와 두 점에서 접한다. $a$를 $b$와 $t$로 표현하시오. 이를 이용하여 $\dfrac{\lvert x\rvert}{a}+\dfrac{y}{b}=1$의 그래프와 $x$축으로 둘러싸인 삼각형의 넓이가 최소가 되도록 하는 $b$에 의해 결정되는 삼각형의 넓이를 $A(t)$라 할 때, 극한 $\displaystyle\lim_{t\to\infty}\frac{A(t)}{t}$의 값을 구하시오. [15점]

    [그림] $y$축 위의 점 $(0,b)$를 꼭짓점으로 하고 $x$축 위의 두 점 $(-a,0)$, $(a,0)$을 지나는 두 직선($\dfrac{\lvert x\rvert}{a}+\dfrac{y}{b}=1$의 그래프) 안쪽에, 중심이 $(0,t)$인 원 $x^2+(y-t)^2=2$가 두 직선에 각각 접해 있다.
  points: 15
  depends_on: []
  answer: {kind: value, value: '4\sqrt2', equivalents: ['4\sqrt{2}', '4*sqrt(2)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$a=\dfrac{\sqrt2b}{\sqrt{(b-t)^2-2}}$, $f(b)=ab$의 임계점 $b(t)=\dfrac{3t+\sqrt{t^2+16}}{2}$, $\dfrac{b(t)}{t}\to2$, $a(t)\to2\sqrt2$이므로 $\dfrac{A(t)}{t}\to4\sqrt2$.'
    steps:
    - {id: 2a, content: '$\displaystyle\lim_{t\to\infty}\frac{A(t)}{t}=\lim a(t)\cdot\lim\frac{b(t)}{t}=2\sqrt2\cdot2=4\sqrt2$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 원이 직선 $\dfrac{x}{a}+\dfrac{y}{b}=1$에 접한다는 것을 중심과 직선 사이의 거리로 써 보자.
    - 삼각형의 넓이는 $ab$이다. $a$를 대입해 $b$만의 함수로 보자.
    - '$t\to\infty$일 때 $b(t)$는 대략 $t$의 몇 배인가?'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2021 논술가이드북(자연) p.48~49 예시답안
    steps:
    - id: 2b-1
      content: |
        $x^2+(y-t)^2=2$이 직선 $\dfrac{x}{a}+\dfrac{y}{b}-1=0$에 접하므로
        $$\sqrt2=\frac{\left\lvert\frac{t}{b}-1\right\rvert}{\sqrt{\frac{1}{a^2}+\frac{1}{b^2}}}$$
        에서 $a=\dfrac{\sqrt2b}{\sqrt{(b-t)^2-2}}$를 얻는다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        삼각형의 넓이는 $ab=\dfrac{\sqrt2b^2}{\sqrt{(b-t)^2-2}}$으로 $b$에 관한 함수 $f(b)$로 표현할 수 있다.
        $$f'(b)=\frac{\sqrt2b(b^2-3tb+2t^2-4)}{\sqrt{((b-t)^2-2)^3}}$$
        이고 $b>t+\sqrt2>0$이므로 $f'(b)=0$을 풀면 $b=\dfrac{3t+\sqrt{t^2+16}}{2}$이다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        삼각형의 넓이를 최소로 하는 $a$, $b$의 값을 각각 $a(t)$, $b(t)$라 하면, $A(t)=a(t)b(t)$이고, $f(b)$의 증가와 감소를 조사하여 $b(t)=\dfrac{3t+\sqrt{t^2+16}}{2}$임을 알 수 있다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        $\displaystyle\lim_{t\to\infty}\frac{b(t)}{t}=\lim_{t\to\infty}\frac{3t+\sqrt{t^2+16}}{2t}=2$이므로
        $$\lim_{t\to\infty}a(t)=\lim_{t\to\infty}\frac{\sqrt2b(t)}{\sqrt{(b(t)-t)^2-2}}=\lim_{t\to\infty}\frac{\sqrt2\,\frac{b(t)}{t}}{\sqrt{\left(\frac{b(t)}{t}-1\right)^2-\frac{2}{t^2}}}=2\sqrt2$$
        이어서 $\displaystyle\lim_{t\to\infty}\frac{A(t)}{t}=\lim_{t\to\infty}\left(a(t)\cdot\frac{b(t)}{t}\right)=4\sqrt2$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: 관계식 $a=\dfrac{\sqrt2b}{\sqrt{(b-t)^2-2}}$를 찾았다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: $b(t)=\dfrac{3t+\sqrt{t^2+16}}{2}$를 찾았다.
      depends_on: []
      steps: [2b-2, 2b-3]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: $\displaystyle\lim_{t\to\infty}\frac{A(t)}{t}=4\sqrt2$를 찾았다.
      depends_on: []
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 공식 주석 — 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능, 채점자는 답안의 완성도에 따라 −0.5~+0.5점 부여 가능
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4206}
  misconceptions:
  - id: MC-CAL-4206
    outcome_code: '70'
    wrong_work: '$\lim a(t)$를 구할 때 $\dfrac{\sqrt2b(t)}{\sqrt{(b(t)-t)^2-2}}$에 $b(t)\approx2t$만 넣고 $-2$ 항 처리 없이 $\infty/\infty$로 두거나, $b(t)/t\to3$ 등으로 잘못 계산'
    detect_cue: 극한값이 $4\sqrt2$가 아니거나 발산으로 답함, 분자·분모를 $t$로 나눈 식이 없음
    feedback: '$\infty/\infty$ 꼴은 분자·분모를 $t$로 나누어 (라)의 극한 성질을 쓸 수 있게 만드세요. $\sqrt{t^2+16}/t\to1$입니다.'
    remedy: [RL-2]

