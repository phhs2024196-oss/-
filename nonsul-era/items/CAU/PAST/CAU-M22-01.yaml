intent: 두 가지 새로운 주사위에서 나올 수 있는 다양한 상황을 이해하고, 원과 직선의 위치 관계에 대한 성질을 이용하여 구하고자 하는 경우의 순서쌍을 정확하게 찾아낼 수 있는지를 평가한다(채점 매뉴얼 출제 의도 요지).
key_idea: '$a$의 값(원의 반지름)마다 직선 $y=\lvert b-4\rvert$가 원과 두 점에서 만나는 $\lvert b-4\rvert<a$를 나열하고, 현의 길이 $l=2\sqrt{a^2-\lvert b-4\rvert^2}$를 계산한다.'
stuck: '$\lvert b-4\rvert$의 값 하나에 $b$가 두 개($b=4\pm k$) 대응한다는 점을 놓치기 쉬움'
