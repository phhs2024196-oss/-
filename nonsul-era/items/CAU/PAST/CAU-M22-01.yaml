stimuli: []

stem: |
  다음 상황에 기초하여 문제에 답하시오.

  - 다음과 같이 두 종류의 정다면체 주사위를 고려한다. 즉, 정사면체 주사위는 각 면에 1부터 4까지의 자연수가 중복되지 않게 한 번씩 적혀있고, 정팔면체 주사위는 각 면에 1부터 8까지의 자연수가 같은 방식으로 적혀있다. 이때 각 주사위를 던졌을 때 밑면에 적혀있는 수를 그 주사위의 눈의 수라고 정의한다. (그림: 정사면체 주사위, 정팔면체 주사위)
  - 두 가지 정다면체 주사위를 각각 한 번씩 던지는 실험을 시행할 때, 정사면체 주사위를 던져서 나오는 눈의 수를 $a$라고 하고 정팔면체 주사위를 던져서 나오는 눈의 수를 $b$라고 한다.
  - 이때 원 $x^2+y^2=a^2$과 직선 $y=\lvert b-4\rvert$가 서로 다른 두 점에서 만날 때, 두 점 사이의 선분의 길이를 $l$이라고 한다.

  $\sqrt{15}\le l\le\sqrt{20}$을 만족시키는 순서쌍 $(a,b)$를 모두 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    $\sqrt{15}\le l\le\sqrt{20}$을 만족시키는 순서쌍 $(a,b)$를 모두 구하시오.
  points: 20
  depends_on: []
  answer: {kind: set, value: '(2,4),\ (3,2),\ (3,6)', equivalents: ['{(2,4),(3,2),(3,6)}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$l^2=4(a^2-k^2)$, $k=\lvert b-4\rvert<a$. $15\le l^2\le20$이면 $a^2-k^2\in\{4,5\}$이므로 $(a,k)=(2,0),(3,2)$. $k=2$에서 $b=2,6$.'
    steps:
    - {id: 1a, content: '$a^2-k^2=4$: $(a,k)=(2,0)$ / $a^2-k^2=5$: $(a,k)=(3,2)$ ⇒ $(a,b)=(2,4),(3,2),(3,6)$', criteria: [1.B1, 1.B2, 1.B3, 1.B4, 1.B5]}
    hint_ladder:
    - 원의 중심에서 직선 $y=k$까지의 거리는 얼마인가?
    - 현의 길이를 반지름과 거리로 나타내 보자.
    - '$\lvert b-4\rvert=2$인 $b$는 몇 개인가?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 모의논술 채점자 매뉴얼(자연) p.25~26 예시답안
    steps:
    - id: 1b-1
      content: |
        $a$가 가능한 값은 $1,2,3,4$이고, $b$가 가능한 값은 $1,2,3,4,5,6,7,8$이다. 이때, $\lvert b-4\rvert$가 가능한 값은 $0,1,2,3,4$이다.
      criteria: []
    - id: 1b-2
      content: |
        $a=1$일 때, 원 $x^2+y^2=1$과 직선 $y=\lvert b-4\rvert$가 서로 다른 두 점에서 만나는 경우는 $\lvert b-4\rvert=0$일 때이다. 즉, 원 $x^2+y^2=1$과 직선 $y=0$이 만나는 두 점 사이의 선분의 길이는 $l=2$이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $a=2$일 때, 원 $x^2+y^2=4$와 직선 $y=\lvert b-4\rvert$가 서로 다른 두 점에서 만나는 경우는 $\lvert b-4\rvert=0$ 또는 $\lvert b-4\rvert=1$일 때이다(즉, $y=0$ 또는 $y=1$이다). 이때 원과 직선이 만나는 두 점 사이의 선분의 길이는 직각삼각형에서 피타고라스 정리를 사용하면 $l=4$ 또는 $l=2\sqrt3$임을 알 수 있다.
      criteria: [1.B2]
    - id: 1b-4
      content: |
        $a=3$일 때, 원 $x^2+y^2=9$와 직선 $y=\lvert b-4\rvert$가 서로 다른 두 점에서 만나는 경우는 $\lvert b-4\rvert=0,\ \lvert b-4\rvert=1$ 또는 $\lvert b-4\rvert=2$일 때이다(즉, $y=0,\ y=1$ 또는 $y=2$이다). 이때 원과 직선이 만나는 두 점 사이의 선분의 길이는 직각삼각형에서 피타고라스 정리를 사용하면 $l=6,\ l=4\sqrt2$ 또는 $l=2\sqrt5$임을 알 수 있다.
      criteria: [1.B3]
    - id: 1b-5
      content: |
        $a=4$일 때, 원 $x^2+y^2=16$과 직선 $y=\lvert b-4\rvert$가 서로 다른 두 점에서 만나는 경우는 $\lvert b-4\rvert=0,\ \lvert b-4\rvert=1,\ \lvert b-4\rvert=2$ 또는 $\lvert b-4\rvert=3$일 때이다(즉, $y=0,\ y=1,\ y=2$ 또는 $y=3$이다). 이때 원과 직선이 만나는 두 점 사이의 선분의 길이는 직각삼각형에서 피타고라스 정리를 사용하면 $l=8,\ l=2\sqrt{15},\ l=4\sqrt3$ 또는 $l=2\sqrt7$임을 알 수 있다.
      criteria: [1.B4]
    - id: 1b-6
      content: |
        이때 $\sqrt{15}\le l\le\sqrt{20}$을 만족하는 경우는 다음과 같다.
        $l=4=\sqrt{16}$: $a=2$, $\lvert b-4\rvert=0$, $b=4$
        $l=2\sqrt5=\sqrt{20}$: $a=3$, $\lvert b-4\rvert=2$, $b=2$
        $l=2\sqrt5=\sqrt{20}$: $a=3$, $\lvert b-4\rvert=2$, $b=6$
        따라서 조건을 만족시키는 순서쌍 $(a,b)$는 $(2,4),\ (3,2),\ (3,6)$이다.
      criteria: [1.B5]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: '$a=1$일 때 원과 직선이 서로 다른 두 점에서 만나는 경우($\lvert b-4\rvert=0$)를 모두 찾고 선분의 길이 $l=2$를 올바르게 계산했다.'
      depends_on: []
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: '$a=2$일 때 만나는 경우($\lvert b-4\rvert=0,1$)를 모두 찾고 $l=4,\ 2\sqrt3$을 올바르게 계산했다.'
      depends_on: []
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: '$a=3$일 때 만나는 경우($\lvert b-4\rvert=0,1,2$)를 모두 찾고 $l=6,\ 4\sqrt2,\ 2\sqrt5$를 올바르게 계산했다.'
      depends_on: []
      steps: [1b-4]
    - id: 1.B4
      mark_type: B
      points: 4
      evidence: '$a=4$일 때 만나는 경우($\lvert b-4\rvert=0,1,2,3$)를 모두 찾고 $l=8,\ 2\sqrt{15},\ 4\sqrt3,\ 2\sqrt7$을 올바르게 계산했다.'
      depends_on: []
      steps: [1b-5]
    - id: 1.B5
      mark_type: B
      points: 4
      evidence: '선분의 길이 $l$에 대한 조건을 만족하는 경우와 그때의 순서쌍 $(2,4),(3,2),(3,6)$을 올바르게 찾았다.'
      depends_on: []
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 계산 실수로 틀렸어도 논리 전개 과정이 맞으면 해당 부분에 1~2점 부분 점수(공식 채점기준 주석)
      effect: minus
      value: 2
    - code: D1-2
      condition: 채점자 재량 — 답안의 완성도에 따라 총점 20점 이내에서 ±1점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CNT-4301}
  - {code: '71', misconception: MC-GEO-4302}
  misconceptions:
  - id: MC-CNT-4301
    outcome_code: '70'
    wrong_work: '$\lvert b-4\rvert=2$에서 $b=6$만(또는 $b=2$만) 택해 순서쌍을 $(2,4),(3,6)$ 두 개로 답함'
    detect_cue: 답의 순서쌍이 3개보다 적고 $(3,2)$ 또는 $(3,6)$이 빠짐
    feedback: '절댓값 $\lvert b-4\rvert=k\ (k>0)$를 만족하는 $b$는 $4+k$, $4-k$ 두 개입니다. 범위 $1\le b\le8$ 안에 둘 다 있는지 확인하세요.'
    remedy: [RL-1]
  - id: MC-GEO-4302
    outcome_code: '71'
    wrong_work: '접하는 경우($\lvert b-4\rvert=a$)까지 포함하거나 현의 길이를 $\sqrt{a^2-k^2}$(절반)로 계산함'
    detect_cue: '$l$ 값 목록에 $0$이 있거나 $l$ 값이 모두 예시답안의 절반'
    feedback: '서로 다른 두 점에서 만나려면 중심과 직선 사이 거리가 반지름보다 작아야 하고, 현의 길이는 $2\sqrt{a^2-k^2}$입니다.'
    remedy: [RL-2]

