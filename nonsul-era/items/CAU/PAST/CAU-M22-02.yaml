stimuli:
- label: '1'
  body: |
    각 $\theta$에 대하여 식 $\sin^2\theta+\cos^2\theta=1$이 성립한다.
- label: '2'
  body: |
    미분가능한 함수 $g(x)$에 대하여 $g(x)=t$로 놓으면, 다음 식이 성립한다.
    $$\int f(g(x))g'(x)\,dx=\int f(t)\,dt$$
- label: '3'
  body: |
    각 $\alpha$와 $\beta$에 대하여 다음 식이 성립한다.
    $$\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$$
- label: '4'
  body: |
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는 $\{f(g(x))\}'=f'(g(x))g'(x)$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    다음 정적분의 값을 구하시오. [10점]
    $$\int_0^{\frac{\pi}{6}}\dfrac{(1-\sin x)^2}{\cos^3x}\,dx$$
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{1}{3}', equivalents: ['1/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\dfrac{(1-\sin x)^2}{\cos^3x}=\dfrac{\cos x}{(1+\sin x)^2}$, $u=\sin x$로 $\displaystyle\int_0^{1/2}\dfrac{du}{(1+u)^2}=\dfrac13$.'
    steps:
    - {id: 1a, content: '$\displaystyle\int_0^{1/2}\dfrac{du}{(1+u)^2}=\left[-\dfrac1{1+u}\right]_0^{1/2}=1-\dfrac23=\dfrac13$', criteria: [1.B1, 1.M1, 1.B2]}
    hint_ladder:
    - '$1-\sin^2x=\cos^2x$를 쓰려면 분자에 무엇을 곱해야 하는가?'
    - 정리한 피적분함수의 분자 $\cos x$는 어떤 함수의 도함수인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 모의논술 채점자 매뉴얼(자연) p.28 예시답안
    steps:
    - id: 1b-1
      content: |
        적분을 하는 함수의 분모와 분자에 $(1+\sin x)^2$를 곱한 후, 제시문의 삼각함수 공식을 적용하여 다음과 같이 식을 정리한다.
        $$\dfrac{(1-\sin x)^2(1+\sin x)^2}{\cos^3x(1+\sin x)^2}=\dfrac{(1-\sin^2x)^2}{\cos^3x(1+\sin x)^2}=\dfrac{\cos x}{(1+\sin x)^2}$$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        그리고 $u=\sin x$로 치환하여 적분을 계산한다.
        $$\int_0^{\frac{\pi}{6}}\dfrac{(1-\sin x)^2}{\cos^3x}dx=\int_0^{\frac{\pi}{6}}\dfrac{\cos x}{(1+\sin x)^2}dx=\int_0^{\frac12}\dfrac{du}{(1+u)^2}=-\dfrac23-(-1)=\dfrac13$$
      criteria: [1.M1, 1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: '적분하는 함수를 정리하여 $\dfrac{\cos x}{(1+\sin x)^2}$를 얻었다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: '$u=\sin x$로 치환하고 적분 구간을 $0\sim\dfrac12$로 바꾼 식이 있다.'
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: '정답 $\dfrac13$을 얻었다.'
      depends_on: []
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수(공식 채점기준 주석)
      effect: minus
      value: 2
    - code: D1-2
      condition: 채점자 재량 — 답안 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4303}
  misconceptions:
  - id: MC-CAL-4303
    outcome_code: '70'
    wrong_work: '치환 $u=\sin x$ 후에도 적분 구간을 $0\sim\dfrac{\pi}{6}$로 그대로 둠'
    detect_cue: '$\left[-\dfrac1{1+u}\right]_0^{\pi/6}$ 꼴, 답에 $\pi$가 들어감'
    feedback: 치환적분에서는 적분 구간도 새 변수의 값으로 바꿔야 합니다($x=\dfrac{\pi}{6}$이면 $u=\dfrac12$).
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표평면 위에서 점 P는 시각 $t\ (\ge0)$에 따라 다음의 조건을 만족하며 움직인다고 하자.

    (가) 시각 $t=0$일 때 점 P의 위치는 원점 O이다.
    (나) 점 P는 시간이 증가함에 따라 $x$축 방향으로 움직이며, 시각 $t$일 때 좌표를 $(s(t),0)$으로 표현할 수 있다.
    (다) 시각 $t$일 때 점 P의 속력은 $v(t)=\dfrac{\ln(t+1)}{t+1}$이다.

    점 P를 중심으로 점 $\mathrm{A}(-2,2)$와 점 $\mathrm{B}(-1,1)$이 이루는 각 $\angle\mathrm{APB}$를 $\theta(t)$라 할 때, $\theta(t)$가 최댓값을 가지는 시각 $t_0$에 대하여 $\theta''(t_0)$을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '-\dfrac{2}{25e^4}', equivalents: ['-2/(25e^4)', '-2e^{-4}/25'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$s=\dfrac{(\ln(t+1))^2}{2}$, $\tan\theta=\dfrac{s}{s^2+3s+4}$, $\theta^{\prime}=\dfrac{v(4-s^2)}{(s^2+3s+4)^2+s^2}$. $s(t_0)=2$, $t_0=e^2-1$, $\theta^{\prime\prime}(t_0)=-\dfrac{v(t_0)^2}{50}=-\dfrac2{25e^4}$.'
    steps:
    - {id: 2a, content: '$v(t_0)=\dfrac{2}{e^2}$, $s^2+3s+4=14$이므로 $\theta^{\prime\prime}(t_0)=\dfrac{v\cdot(-2s\,v)}{14^2+4}=-\dfrac{4v^2}{200}=-\dfrac{2}{25e^4}$', criteria: [2.B1, 2.B2, 2.B3, 2.B4]}
    hint_ladder:
    - 이동 거리 $s(t)$를 먼저 적분으로 구하자. $\ln(t+1)$을 치환해 보라.
    - '$\angle\mathrm{APB}=\angle\mathrm{APO}-\angle\mathrm{BPO}$로 보고 탄젠트 뺄셈정리를 쓰자.'
    - '$\theta^{\prime\prime}$를 곱의 미분으로 쓰면 $t_0$에서 0이 되는 인수가 있다.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2022 모의논술 채점자 매뉴얼(자연) p.29 예시답안
    steps:
    - id: 2b-1
      content: |
        우선 $z=\ln(t+1)$로 치환하여 $s(t)$를 구한다.
        $$s(t)=\int_0^t\dfrac{\ln(u+1)}{u+1}du=\int_0^{\ln(t+1)}z\,dz=\dfrac{(\ln(t+1))^2}{2}.$$
      criteria: [2.B1]
    - id: 2b-2
      content: |
        각 $\angle\mathrm{BPO}$를 $\alpha$라고 하고, 탄젠트 함수의 공식을 이용하여
        $$\tan\theta=\dfrac{\tan(\theta+\alpha)-\tan\alpha}{1+\tan(\theta+\alpha)\tan\alpha}=\dfrac{\dfrac{2}{s+2}-\dfrac{1}{s+1}}{1+\dfrac{2}{s+2}\cdot\dfrac{1}{s+1}}=\dfrac{s}{s^2+3s+4}$$
        를 얻는다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        이때, 양변을 $t$에 대해 미분하여,
        $$\sec^2\theta\dfrac{d\theta}{dt}=\dfrac{\dfrac{ds}{dt}(s^2+3s+4)-s\left(2s\dfrac{ds}{dt}+3\dfrac{ds}{dt}\right)}{(s^2+3s+4)^2}=\dfrac{v(4-s^2)}{(s^2+3s+4)^2}$$
        을 구하고, 앞에서 얻은 $\tan\theta$를 삼각함수 공식 $1+\tan^2\theta=\sec^2\theta$에 적용하여,
        $$\dfrac{d\theta}{dt}=\dfrac{v(4-s^2)}{(s^2+3s+4)^2}\left(1+\left(\dfrac{s}{s^2+3s+4}\right)^2\right)^{-1}=\dfrac{v(4-s^2)}{(s^2+3s+4)^2+s^2}$$
        을 얻는다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        따라서 $\theta$가 최대가 되게 하는 $t_0$는 $s(t_0)=2$를 만족하고 $t_0=e^2-1$이다.
      criteria: [2.B3]
    - id: 2b-5
      content: |
        이제 시각 $t_0$에서 $\theta$의 이계도함수를 구하기 위해, 앞에서 얻은 $\dfrac{d\theta}{dt}$를 $t$에 대해 미분을 하면
        $$\theta''(t)=\left(\dfrac{v}{(s^2+3s+4)^2+s^2}\right)'(4-s^2)+\dfrac{v}{(s^2+3s+4)^2+s^2}(4-s^2)'$$
        인데, 여기서 $s(t_0)=2$ (따라서 $4-s(t_0)^2=0$)을 이용하면 첫 번째 항은 분수함수의 미분 값과 관계없이 0임을 알 수 있다. 마지막으로 $s(t_0)=2$와 $t_0=e^2-1$을 대입하여 정답을 얻는다.
        $$\theta''(t_0)=\dfrac{v(t_0)(-2s(t_0)s'(t_0))}{(s(t_0)^2+3s(t_0)+4)^2+s(t_0)^2}=-\dfrac{v(t_0)^2}{50}=-\dfrac{(\ln(t_0+1))^2}{50(t_0+1)^2}=-\dfrac{2}{25e^4}$$
      criteria: [2.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: '$v(t)$를 적분하여 $s(t)=\dfrac{(\ln(t+1))^2}{2}$를 얻었다.'
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 6
      evidence: '탄젠트 함수 공식으로 $\tan\theta=\dfrac{s}{s^2+3s+4}$를 얻은 후 $t$에 대해 미분하여 $\dfrac{d\theta}{dt}=\dfrac{v(4-s^2)}{(s^2+3s+4)^2+s^2}$를 얻었다.'
      depends_on: []
      steps: [2b-2, 2b-3]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: '$\theta$가 최대가 되게 하는 $t_0=e^2-1$을 얻었다.'
      depends_on: []
      steps: [2b-4]
    - id: 2.B4
      mark_type: B
      points: 3
      evidence: '$\dfrac{d\theta}{dt}$를 미분하여 정답 $-\dfrac{2}{25e^4}$를 얻었다.'
      depends_on: []
      steps: [2b-5]
    deductions:
    - code: D2-1
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수(공식 채점기준 주석)
      effect: minus
      value: 2
    - code: D2-2
      condition: 채점자 재량 — 답안 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4304}
  misconceptions:
  - id: MC-CAL-4304
    outcome_code: '70'
    wrong_work: '$\theta^{\prime\prime}(t_0)$ 계산에서 $\dfrac{ds}{dt}=v$를 빠뜨리고 $s$에 대한 미분값($-\dfrac{4}{200}\cdot v$ 등)으로 답함'
    detect_cue: '답이 $-\dfrac{1}{25e^2}$ 꼴(인수 $v(t_0)$ 하나 누락)'
    feedback: '$\theta$는 $s$를 거쳐 $t$의 함수입니다. $(4-s^2)^{\prime}=-2s\dfrac{ds}{dt}=-2sv$처럼 합성함수 미분을 끝까지 적용하세요.'
    remedy: [RL-2]

