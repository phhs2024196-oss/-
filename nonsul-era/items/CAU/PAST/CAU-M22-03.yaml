intent: '[3-1] 역함수의 개념을 정확히 이해하고 미분과 이차함수의 판별식을 활용하여 문제를 해결할 수 있는지, [3-2] 접선의 방정식 및 두 곡선 사이의 넓이를 이차방정식의 근과 계수의 관계를 활용하여 계산할 수 있는 종합적인 사고 능력을 평가한다(채점 매뉴얼 출제 의도 요지).'
key_idea: '[3-1] 역함수 존재 ⇔ $f^{\prime}\ge0$, $g^{\prime}\ge0$ 항상 성립. $g^{\prime}$은 $t=x^2\ge0$ 치환으로 이차함수 $5t^2-3bt+a\ge0\ (t\ge0)$ 조건, 대칭축 위치로 경우 분할. [3-2] 두 접점의 $x$좌표 $\alpha,\beta$는 $p^2-2tp-3t^2+4t-1=0$의 두 근, $\alpha-\beta=4t-2$이고 $A(t)=\dfrac{(\alpha-\beta)^3}{12}$.'
stuck: '[3-1] $g^{\prime}(x)\ge0$을 $t=x^2\ge0$에서의 이차부등식으로 바꾸고 대칭축 $t=\dfrac{3b}{10}$의 부호($b\le0$, $b>0$)로 나누는 단계 / [3-2] 넓이를 삼각형 넓이와 포물선-현 사이 넓이의 차로 보는 발상'
