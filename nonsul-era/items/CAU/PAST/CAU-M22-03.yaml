stimuli:
- label: '1'
  body: |
    함수 $h(x)$가 어떤 구간에서 미분가능하고 이 구간의 모든 $x$에서 $h'(x)>0$이면 $h(x)$는 이 구간에서 증가한다.
- label: '2'
  body: |
    두 함수 $u(x)$, $v(x)$가 닫힌구간 $[c,d]$에서 연속일 때, 두 곡선 $y=u(x)$, $y=v(x)$ 및 두 직선 $x=c$, $x=d$로 둘러싸인 도형의 넓이는 $\displaystyle\int_c^d\lvert u(x)-v(x)\rvert\,dx$이다.
- label: '3'
  body: |
    이차방정식 $\ell x^2+mx+n=0$의 두 근을 $\alpha$, $\beta$라 하면 $\alpha+\beta=-\dfrac{m}{\ell}$, $\alpha\beta=\dfrac{n}{\ell}$이다.
- label: '4'
  body: |
    점 $(x_1,y_1)$과 직선 $px+qy+r=0$ 사이의 거리는 $\dfrac{\lvert px_1+qy_1+r\rvert}{\sqrt{p^2+q^2}}$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    좌표평면 위의 영역 $R$는 다음의 조건 (가)가 조건 (나)의 필요충분조건이 되도록 정의되어 있다.

    (가) 점 $(a,b)$는 $R$의 원소이다.
    (나) 두 함수 $f(x)=x^3+ax^2+bx+1$과 $g(x)=x^5-bx^3+ax+1$이 모두 실수 전체의 집합에서 역함수를 갖는다.

    영역 $R$의 넓이를 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{20}{9}', equivalents: ['20/9'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$R$은 $\dfrac{a^2}{3}\le b\le\dfrac{\sqrt{20a}}{3}$ $(0\le a\le\sqrt[3]{20})$이고 넓이는 $\displaystyle\int_0^{\sqrt[3]{20}}\left(\dfrac{\sqrt{20}}{3}\sqrt a-\dfrac{a^2}{3}\right)da=\dfrac{20}{9}$.'
    steps:
    - {id: 1a, content: '$R_1:\ b\ge\dfrac{a^2}{3}$, $R_2\cup R_3:\ a\ge0$이고 ($b\le0$ 또는 $9b^2\le20a$) ⇒ 경계 교점 $a^3=20$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 최고차계수가 양수인 다항함수가 역함수를 가지려면 도함수에 어떤 조건이 필요한가?
    - '$g^{\prime}(x)$는 $x^2$에 대한 이차식이다. $t=x^2\ge0$으로 놓아 보자.'
    - '$t\ge0$에서 이차함수가 항상 $0$ 이상이려면 대칭축의 위치에 따라 무엇을 확인해야 하는가?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 모의논술 채점자 매뉴얼(자연) p.31 예시답안
    steps:
    - id: 1b-1
      content: |
        $f(x)$는 최고차계수가 양수이므로 역함수를 가지려면, $f'(x)=3x^2+2ax+b\ge0$이 모든 실수 $x$에 대하여 성립하여야 한다. 따라서 $D/4=a^2-3b\le0$이고, 영역 $R_1$을 $R_1=\{(a,b)\mid a^2-3b\le0\}$이라 하자.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        마찬가지로 $g(x)$가 역함수를 가지려면, $g'(x)=5x^4-3bx^2+a\ge0$이 모든 실수 $x$에 대하여 성립하여야 한다. $t=x^2$으로 치환하면, $t\ge0$인 임의의 실수 $t$가 $5t^2-3bt+a\ge0$을 만족하는 것으로 조건을 변경할 수 있다. 이차함수 $h(t)=5t^2-3bt+a$의 대칭축의 위치에 따라 다음의 두 경우를 생각하자.
        i. $b\le0$일 때, $h(0)=a\ge0$이다. $R_2=\{(a,b)\mid a\ge0,\ b\le0\}$이라 하자.
        ii. $b>0$일 때, $D=9b^2-20a\le0$이다. $R_3=\{(a,b)\mid 9b^2-20a\le0\}$이라 하자.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        이때, 영역 $R$은 $R=R_1\cap(R_2\cup R_3)$로 주어지며 그 넓이는
        $$\int_0^{\sqrt[3]{20}}\left(\dfrac{\sqrt{20}}{3}\sqrt a-\dfrac{a^2}{3}\right)da=\left[\dfrac{\sqrt{20}}{3}\cdot\dfrac23a^{\frac32}-\dfrac{a^3}{9}\right]_0^{\sqrt[3]{20}}=\dfrac{20}{9}$$
        이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: '$f^{\prime}(x)\ge0$ 조건에서 $a^2-3b\le0$을 보였다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: '$g^{\prime}(x)\ge0$ 조건에서 $b\le0$일 때 $a\ge0$이고, $b>0$일 때 $9b^2-20a\le0$을 보였다.'
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: '$R$의 넓이 $\dfrac{20}{9}$를 구했다.'
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수(공식 채점기준 주석)
      effect: minus
      value: 2
    - code: D1-2
      condition: 채점자 재량 — 답안 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-4305}
  misconceptions:
  - id: MC-ALG-4305
    outcome_code: '70'
    wrong_work: '$5t^2-3bt+a\ge0$을 모든 실수 $t$에 대한 조건으로 보고 판별식 $9b^2-20a\le0$만 사용함($t\ge0$ 제한 무시)'
    detect_cue: '$b\le0,\ a\ge0$ 경우가 빠지고 $R=\{a^2\le3b,\ 9b^2\le20a\}$로 넓이를 계산(값은 같아도 근거 누락)'
    feedback: '$t=x^2$은 $0$ 이상의 값만 가집니다. 대칭축이 $t\le0$ 쪽이면 판별식 대신 $h(0)\ge0$만 확인하면 됩니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    $t>\dfrac12$인 임의의 실수 $t$에 대하여 점 $(t,-3t^2+4t-1)$에서 포물선 $y=x^2$에 그은 두 접선과 이 포물선이 둘러싸는 영역의 넓이를 $A(t)$라 할 때, $18<A(t)<486$을 만족하는 $t$의 범위를 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: set, value: '2<t<5', equivalents: ['(2,5)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '접점 $x$좌표 $\alpha,\beta$는 $p^2-2tp-3t^2+4t-1=0$의 두 근, $\alpha-\beta=4t-2$. $A(t)=\dfrac{(\alpha-\beta)^3}{4}-\dfrac{(\alpha-\beta)^3}{6}=\dfrac{2(2t-1)^3}{3}$, $27<(2t-1)^3<729$.'
    steps:
    - {id: 2a, content: '$18<\dfrac{2(2t-1)^3}{3}<486\iff 3<2t-1<9\iff 2<t<5$', criteria: [2.B1, 2.B2, 2.B3, 2.B4]}
    hint_ladder:
    - 접점을 $(p,p^2)$으로 놓고 접선이 주어진 점을 지날 조건을 $p$의 이차방정식으로 쓰자.
    - 두 근의 차를 근과 계수의 관계로 구하자.
    - 구하는 넓이는 (삼각형 넓이) − (현과 포물선 사이 넓이)이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2022 모의논술 채점자 매뉴얼(자연) p.32 예시답안
    steps:
    - id: 2b-1
      content: |
        접점을 $(p,p^2)$으로 놓으면, 접선의 방정식은 $y=2px-p^2$이다. 접선이 점 $\mathrm{Q}(t,-3t^2+4t-1)$를 지나므로 $-3t^2+4t-1=2pt-p^2$이고 이를 정리하면 $p^2-2tp-3t^2+4t-1=0$이다. 이 이차방정식의 두 근을 $\alpha,\beta\ (\alpha>\beta)$라 하면 $\alpha+\beta=2t$, $\alpha\beta=-3t^2+4t-1$이므로
        $$\alpha-\beta=\sqrt{(\alpha+\beta)^2-4\alpha\beta}=\sqrt{4t^2-(-3t^2+4t-1)}=4t-2$$
        이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        두 점 $\mathrm{A}(\alpha,\alpha^2)$와 $\mathrm{B}(\beta,\beta^2)$ 사이의 거리는 $\overline{\mathrm{AB}}=(\alpha-\beta)\sqrt{1+(\alpha+\beta)^2}$이다. 직선 AB의 방정식은 $(\alpha+\beta)x-y-\alpha\beta=0$이므로 점 $\mathrm{Q}(t,-3t^2+4t-1)=\mathrm{Q}\left(\dfrac{\alpha+\beta}{2},\alpha\beta\right)$와의 거리 $d$는
        $$d=\dfrac{(\alpha-\beta)^2}{2\sqrt{(\alpha+\beta)^2+1}},\qquad \triangle\mathrm{QAB}=\dfrac12\cdot\overline{\mathrm{AB}}\cdot d=\dfrac{(\alpha-\beta)^3}{4}$$
        이고, 직선 AB와 곡선 $y=x^2$ 사이의 넓이는
        $$\int_\beta^\alpha\left((\alpha+\beta)x-\alpha\beta-x^2\right)dx=\dfrac{(\alpha-\beta)^3}{6}$$
        이므로
      criteria: [2.B2]
    - id: 2b-3
      content: |
        $$A(t)=\dfrac{(\alpha-\beta)^3}{4}-\dfrac{(\alpha-\beta)^3}{6}=\dfrac{(\alpha-\beta)^3}{12}=\dfrac{2(2t-1)^3}{3}$$
        이다.
      criteria: [2.B3]
    - id: 2b-4
      content: |
        $18<\dfrac{2(2t-1)^3}{3}<486$을 풀어 $2<t<5$를 얻는다.
      criteria: [2.B4]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 2022 모의논술 채점자 매뉴얼(자연) p.33 별해
    key_idea: '두 근 $p=1-t$, $p=3t-1$을 직접 구하고 접선 아래 넓이를 구간별로 빼서 $A(t)$를 계산한다. (별해 채점기준: 두 근 +3, 두 접선 +2, $A(t)$ +7, $t$의 범위 +3)'
    steps:
    - id: 2c-1
      content: |
        접점을 $(p,p^2)$으로 놓으면, 접선의 방정식은 $y=2px-p^2$이다. 점 $\mathrm{Q}(t,-3t^2+4t-1)$를 접선이 지나므로 $-3t^2+4t-1=2pt-p^2$이고 이를 정리하면 $p^2-2tp-3t^2+4t-1=0$이다. 이 이차방정식을 풀어 두 근 $p=1-t$와 $p=3t-1$을 얻을 수 있고 $t>\dfrac12$이므로 $1-t<t<3t-1$임을 안다.
      criteria: [2.B1]
    - id: 2c-2
      content: |
        구간 $[1-t,t]$에서 접선의 방정식은 $y=2(1-t)x-(1-t)^2$이고 구간 $[t,3t-1]$에서 접선의 방정식은 $y=2(3t-1)x-(3t-1)^2$이다. 따라서
        $$\begin{aligned}A(t)&=\int_{1-t}^{3t-1}x^2dx-\int_{1-t}^{t}\left\{2(1-t)x-(1-t)^2\right\}dx-\int_t^{3t-1}\left\{2(3t-1)x-(3t-1)^2\right\}dx\\&=\dfrac13\left((3t-1)^3-(1-t)^3\right)-(1-t)\left(t^2-(1-t)^2\right)+(1-t)^2t-(1-t)^3\\&\quad-(3t-1)\left((3t-1)^2-t^2\right)+(3t-1)^3-(3t-1)^2t\\&=\dfrac23(2t-1)^3\end{aligned}$$
        이다.
      criteria: [2.B2, 2.B3]
    - id: 2c-3
      content: |
        $18<\dfrac{2(2t-1)^3}{3}<486$을 풀어 $2<t<5$를 얻는다.
      criteria: [2.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
