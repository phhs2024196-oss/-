stimuli: []

stem: |
  다음 상황에 기초하여 문제에 답하시오.

  - 주머니 A에는 2부터 4까지의 자연수가 각각 하나씩 적힌 3개의 공이 들어 있고, 주머니 B에는 4부터 32까지의 자연수가 각각 하나씩 적힌 29개의 공이 들어 있다.
  - 주머니 A에서 임의로 한 개의 공을 꺼낼 때 적힌 수를 $a$라 하고, 주머니 B에서 임의로 한 개의 공을 꺼낼 때 적힌 수를 $b$라 하자.

  이때 $-48+44\log_a(ab)-12\{\log_a(ab)\}^2+\{\log_a(ab)\}^3>0$을 만족하는 순서쌍 $(a,b)$의 개수를 모두 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    $-48+44\log_a(ab)-12\{\log_a(ab)\}^2+\{\log_a(ab)\}^3>0$을 만족하는 순서쌍 $(a,b)$의 개수를 모두 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '55', equivalents: ['55개'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $X=\log_a b$로 두면 $(X-1)(X-3)(X-5)>0$. $1\le X\le5$이므로 $1<X<3\iff a<b<a^3$. $a=2,3,4$에서 각각 4, 23, 28개.
    steps:
    - {id: 1a, content: '$(X-1)(X-3)(X-5)>0$, $1\le X\le5$ ⇒ $a<b<a^3$ ⇒ $4+23+28=55$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - $\log_a(ab)$를 $\log_a b$로 나타내 보자.
    - 정리한 삼차식은 $X=1$을 대입하면 0이 된다.
    - $a$와 $b$의 범위에서 $\log_a b$가 가질 수 있는 값의 범위는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 모의논술 채점자 매뉴얼 p.13 예시 답안
    steps:
    - id: 1b-1
      content: |
        $\log_a b=X$라고 두면
        $$\begin{aligned}&-48+44\log_a(ab)-12(\log_a(ab))^2+(\log_a(ab))^3\\&=-48+44(1+\log_a b)-12(1+\log_a b)^2+(1+\log_a b)^3\\&=X^3-9X^2+23X-15\\&=(X-1)(X-3)(X-5)\end{aligned}$$
        로 정리되어, $(X-1)(X-3)(X-5)>0$을 만족하는 경우는 $1<X<3$ 또는 $X>5$이다.
      criteria: [1.B1, 1.B2]
    - id: 1b-2
      content: |
        $1\le\log_a b\le5$이므로, $X>5$는 불가능하며, $1<X<3$의 경우는 아래와 같이 정리된다.
        $1<X<3\iff1<\log_a b<3\iff\log_a a<\log_a b<\log_a a^3\iff a<b<a^3$이며,
        - $a=2$인 경우는, $4\le b<8$이므로, 4개
        - $a=3$인 경우는, $3<b<27$이므로, 23개
        - $a=4$인 경우는, $4<b\le32$이므로, 28개
      criteria: [1.B2, 1.B3]
    - id: 1b-3
      content: |
        따라서, 가능한 순서쌍 $(a,b)$의 개수는 $4+23+28=55$개이다.
      criteria: [1.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: 치환($X=\log_a b$)을 통해 주어진 식을 삼차방정식의 형태 $X^3-9X^2+23X-15$(또는 $(X-1)(X-3)(X-5)$)로 올바르게 표현했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: 부등호를 풀어 로그값의 범위($1<X<3$, $X>5$는 불가능)를 올바르게 계산했다.
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: $a=2,3,4$ 세 값에 대해 $b$의 범위($4\le b<8$, $3<b<27$, $4<b\le32$)를 올바르게 계산했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B4
      mark_type: B
      points: 5
      evidence: 전체 가능한 순서쌍의 개수 55를 정확히 계산했다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 총점 20점 이내에서 ±1점(공식 채점기준 주석). 계산 실수로 틀렸어도 논리 전개 과정이 맞으면 해당 부분에 1~2점의 부분 점수 부여
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-4401}
  misconceptions:
  - id: MC-ALG-4401
    outcome_code: '70'
    wrong_work: '$(X-1)(X-3)(X-5)>0$의 해를 $1<X<5$ 또는 $X>5$만으로 잡거나, $a=2$에서 $b=4$($X=2$)를 빼거나 $a=3$에서 $b=27$을 포함함'
    detect_cue: 개수가 55가 아님(예 56, 54), 부호표·경계 확인 없음
    feedback: 세 근 1, 3, 5로 나뉜 구간마다 부호를 확인하고, $X=1,3$은 부등식이 등호가 되므로 제외됩니다. $a<b<a^3$의 양 끝 포함 여부를 $a$마다 확인하세요.
    remedy: [RL-1]

