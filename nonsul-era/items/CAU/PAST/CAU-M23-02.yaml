stimuli:
- label: '1'
  body: |
    양수 $M,N$에 대하여 $\ln(MN)=\ln M+\ln N$이 성립한다.
- label: '2'
  body: |
    첫째항이 $a$이고 공차가 $d$인 등차수열의 첫째항부터 제$n$항까지의 합은 $\dfrac{n\{2a+(n-1)d\}}{2}$이다.
- label: '3'
  body: |
    등비급수 $\displaystyle\sum_{n=1}^{\infty}ar^{n-1}\ (a\neq0)$은 $\lvert r\rvert<1$일 때 수렴하고 그 합은 $\dfrac{a}{1-r}$이다.
- label: '4'
  body: |
    미분가능한 함수 $g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속이고, $g(a)=\alpha$, $g(b)=\beta$에 대하여 함수 $f(x)$가 $\alpha$와 $\beta$를 양끝으로 하는 닫힌구간에서 연속일 때 다음 식이 성립한다.
    $$\int_a^b f(g(x))g'(x)\,dx=\int_\alpha^\beta f(t)\,dt$$
- label: '5'
  body: |
    모든 실수 $x$에 대하여 다음 식이 성립한다.
    $$\sin\left(\frac\pi2-x\right)=\cos x,\qquad\sin^2x+\cos^2x=1$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    첫째항부터 제5항까지의 합이 45, 첫째항부터 제10항까지의 합이 140인 등차수열 $\{a_n\}$에 대하여 다음 급수의 합을 구하시오. [10점]
    $$\sum_{n=1}^{\infty}\frac1{2^n}\ln\left\{\frac{3(a_n)^2}{a_n+2}\right\}$$
  points: 10
  depends_on: []
  answer: {kind: value, value: '\ln15', equivalents: ['ln 15', '\ln3+\ln5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_n=2n+3$, $a_n+2=a_{n+1}$. 일반항 $=\dfrac{\ln3}{2^n}+\left\{\dfrac{\ln a_n}{2^{n-1}}-\dfrac{\ln a_{n+1}}{2^n}\right\}$.
    steps:
    - {id: 1a, content: '등비급수 $\ln3$, 망원 급수 $\ln a_1=\ln5$ ⇒ $\ln15$', criteria: [1.B1, 1.M1, 1.A1]}
    hint_ladder:
    - 합 공식 두 개로 첫째항과 공차를 구하자.
    - $a_n+2$는 수열의 어느 항인가?
    - $\dfrac{2\ln a_n}{2^n}$을 $\dfrac{\ln a_n}{2^{n-1}}$로 쓰면 무엇이 소거되는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 모의논술 채점자 매뉴얼 p.14 예시 답안
    steps:
    - id: 1b-1
      content: |
        등차수열의 합에 대한 공식과 문제에 주어진 조건으로부터 등차수열의 일반항 $a_n=2n+3$을 구한다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        이를 급수에 대입하고 로그함수의 성질을 이용하여 식을 다음과 같이 정리한다.
        $$\sum_{n=1}^{\infty}\frac1{2^n}\ln\left\{\frac{3(2n+3)^2}{2n+5}\right\}=\sum_{n=1}^{\infty}\frac{\ln3}{2^n}+\sum_{n=1}^{\infty}\left\{\frac{\ln(2n+3)}{2^{n-1}}-\frac{\ln(2n+5)}{2^n}\right\}$$
      criteria: [1.M1]
    - id: 1b-3
      content: |
        첫 번째 급수에 대해서는 등비급수의 합 공식을 이용하여 $\displaystyle\sum_{n=1}^{\infty}\frac{\ln3}{2^n}=\ln3$을 얻고, 두 번째 급수에 대해서는 제$N$항까지의 합을 구한 후
        $$\begin{aligned}\sum_{n=1}^{N}\left\{\frac{\ln(2n+3)}{2^{n-1}}-\frac{\ln(2n+5)}{2^n}\right\}&=\left\{\ln5-\frac{\ln7}{2}\right\}+\left\{\frac{\ln7}{2}-\frac{\ln9}{2^2}\right\}+\cdots+\left\{\frac{\ln(2N+3)}{2^{N-1}}-\frac{\ln(2N+5)}{2^N}\right\}\\&=\ln5-\frac{\ln(2N+5)}{2^N}\end{aligned}$$
        극한 $N\to\infty$를 취하여 $\displaystyle\sum_{n=1}^{\infty}\left\{\frac{\ln(2n+3)}{2^{n-1}}-\frac{\ln(2n+5)}{2^n}\right\}=\ln5$를 얻는다(원문의 합 기호 아래첨자 $n=2$는 $n=1$의 오기로 보임). 최종적으로 두 급수의 합을 더하여 정답 $\ln3+\ln5=\ln(15)$를 얻는다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: 등차수열의 일반항 $a_n=2n+3$을 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 로그함수의 성질을 이용하여 급수를 등비급수 $\sum\dfrac{\ln3}{2^n}$와 소거되는 급수 $\sum\left\{\dfrac{\ln(2n+3)}{2^{n-1}}-\dfrac{\ln(2n+5)}{2^n}\right\}$로 적절히 분해했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 첫 번째 등비급수의 합 $\ln3$(+1)과 두 번째 급수의 합 $\ln5$(+3)를 구한 후 정답 $\ln15$(+1)를 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4402}
  misconceptions:
  - id: MC-CAL-4402
    outcome_code: '70'
    wrong_work: '$\sum\dfrac{\ln(2n+3)}{2^{n-1}}-\sum\dfrac{\ln(2n+5)}{2^n}$을 두 무한급수로 따로 놓고 소거해 0 또는 $\ln5$ 이외의 값을 얻음, 또는 남는 첫 항 $\ln5$를 빠뜨려 답 $\ln3$'
    detect_cue: 부분합 $S_N$ 없이 무한합끼리 빼거나 답이 $\ln3$
    feedback: 소거는 부분합에서 해야 합니다. 제$N$항까지 더하면 $\ln5-\dfrac{\ln(2N+5)}{2^N}$이 남고, 그 극한이 $\ln5$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    다음 정적분의 값을 구하시오. [15점]
    $$\int_0^{\frac\pi2}(2x^2-\pi x+\pi^2)\sin^2x\,dx$$
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{11\pi^3}{48}', equivalents: ['11π^3/48'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $t=\dfrac\pi2-x$로 치환하면 같은 다항식에 $\cos^2x$가 곱해진 적분이 되므로 원래 적분은 $\dfrac12\displaystyle\int_0^{\frac\pi2}(2x^2-\pi x+\pi^2)dx$.
    steps:
    - {id: 2a, content: '$I=\dfrac12\displaystyle\int_0^{\frac\pi2}(2x^2-\pi x+\pi^2)dx=\dfrac12\left(\dfrac{\pi^3}{12}-\dfrac{\pi^3}{8}+\dfrac{\pi^3}{2}\right)=\dfrac{11\pi^3}{48}$', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - 적분 구간 $\left[0,\dfrac\pi2\right]$을 뒤집는 치환을 생각해 보자.
    - $2x^2-\pi x+\pi^2$에 $\dfrac\pi2-x$를 넣으면?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 모의논술 채점자 매뉴얼 p.14~15 예시 답안
    steps:
    - id: 2b-1
      content: |
        $t=\dfrac\pi2-x$로 치환하여 정적분을 다음과 같이 정리한다.
        $$\int_0^{\frac\pi2}(2x^2-\pi x+\pi^2)\sin^2x\,dx=\int_0^{\frac\pi2}\left\{2\left(\frac\pi2-x\right)^2-\pi\left(\frac\pi2-x\right)+\pi^2\right\}\sin^2\left(\frac\pi2-x\right)dx$$
        여기서 삼각함수의 성질에 의해 $\sin\left(\dfrac\pi2-x\right)=\cos x$이고 다항식을 전개하면
        $$2\left(\frac\pi2-x\right)^2-\pi\left(\frac\pi2-x\right)+\pi^2=2x^2-\pi x+\pi^2$$
        이므로
        $$\int_0^{\frac\pi2}(2x^2-\pi x+\pi^2)\sin^2x\,dx=\int_0^{\frac\pi2}(2x^2-\pi x+\pi^2)\cos^2x\,dx$$
        이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 제시문에 주어진 삼각함수의 성질에 의해
        $$\begin{aligned}\int_0^{\frac\pi2}(2x^2-\pi x+\pi^2)\sin^2x\,dx&=\frac12\int_0^{\frac\pi2}(2x^2-\pi x+\pi^2)(\cos^2x+\sin^2x)\,dx\\&=\frac12\int_0^{\frac\pi2}(2x^2-\pi x+\pi^2)\,dx\end{aligned}$$
        가 성립한다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        마지막으로 적분을 계산하여 정답 $\dfrac{11\pi^3}{48}$을 얻는다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: $t=\dfrac\pi2-x$로 치환하여 정적분을 $\displaystyle\int_0^{\frac\pi2}(2x^2-\pi x+\pi^2)\cos^2x\,dx$로 표현했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 6
      evidence: 삼각함수의 성질을 이용하여 $\dfrac12\displaystyle\int_0^{\frac\pi2}(2x^2-\pi x+\pi^2)\,dx$를 얻었다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 최종적으로 정적분을 계산하여 정답 $\dfrac{11\pi^3}{48}$을 얻었다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4403}
  misconceptions:
  - id: MC-CAL-4403
    outcome_code: '70'
    wrong_work: '치환 후 $dx=-dt$의 부호와 구간 $\left[\dfrac\pi2,0\right]$의 뒤바뀜 중 하나만 처리해 $I=-\displaystyle\int(\cdots)\cos^2x\,dx$로 놓고 $2I=\int(\cdots)(\sin^2-\cos^2)$ 꼴로 진행'
    detect_cue: 답이 0이거나 음수, 또는 $\cos2x$ 적분으로 넘어가 계산이 길어짐
    feedback: '$t=\dfrac\pi2-x$이면 $dx=-dt$이고 구간도 $\dfrac\pi2\to0$으로 바뀌어 두 부호가 상쇄됩니다. 결국 $\sin^2$ 적분과 $\cos^2$ 적분은 같습니다.'
    remedy: [RL-2]

