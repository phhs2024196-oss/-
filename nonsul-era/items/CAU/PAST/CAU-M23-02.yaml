stuck: '[2-1] $\dfrac{2\ln(2n+3)}{2^n}=\dfrac{\ln(2n+3)}{2^{n-1}}$로 써서 이웃 항이 소거되는 꼴을 만드는 단계 / [2-2] $2x^2-\pi x+\pi^2$가 $x\to\dfrac\pi2-x$에 대해 불변임을 알아채는 단계'
