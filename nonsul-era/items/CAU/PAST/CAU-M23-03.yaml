  tools: ['접점 $(b,f(b))$의 접선에 $\mathrm A$ 대입', '$(x\ln x-x)\cdot(\ln x-1)$ 꼴 부분적분', '넓이 = 연(사각형) 넓이 − 부채꼴 넓이', '$\tan\theta=\sqrt{L^2-1}$ 양변 미분', '삼차방정식 $t+12(t-2)^3=0$']
