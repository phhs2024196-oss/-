intent: >-
  [3-1] 접선의 방정식을 구하고 주어진 점을 대입하여 두 접점을 구한 뒤, 구간 $[\alpha,\beta]$에서 $\ln x$ 적분과 부분적분을 이용하여 적절한 계산을 수행하는지 평가한다. [3-2] 원 밖의 점에서 원에 그은 두 접선과 원으로 둘러싸인 부분의 넓이를 구하고, 넓이가 원의 중심과의 거리에 의해 결정됨을 알아내며, 합성함수의 미분법으로 $S'(t)$를 구하고 3차 방정식을 풀어 $S'(d)=0$인 $d$를 구하는지 평가한다(채점자 매뉴얼 출제 의도 요지).
key_idea: >-
  [3-1] 접점 $(b,f(b))$의 접선이 $(0,1)$을 지나는 조건이 $(\ln b)^2-3\ln b=0$, $(x\ln x-x)'=\ln x$로 부분적분. [3-2] $L=\mathrm{OP}$라 하면 $S=\sqrt{L^2-1}-\theta$, $\tan\theta=\sqrt{L^2-1}$이고 $S'=\dfrac{\sqrt{L^2-1}}{L}L'$이므로 $S'=0\iff L'=0$.
stuck: '[3-1] 곡선 밖의 점에서 그은 접선 — 접점을 미지수로 두는 단계 / [3-2] 넓이를 거리 $L$ 하나의 함수로 쓰고 $\theta$의 미분을 $\tan\theta=\sqrt{L^2-1}$의 양변 미분으로 처리하는 단계'
idea_tags: [IDEA-TANGENT-FROM-EXTERNAL-POINT, IDEA-PARTS-WITH-ANTIDERIV-OF-LN, IDEA-AREA-AS-FUNCTION-OF-DISTANCE]
tags: [접선, 부분적분, 원의 접선, 넓이의 미분, 합성함수의 미분, 중앙대 모의]
