stimuli:
- label: '1'
  body: |
    곡선 $y=f(x)$ 위의 점 $(\alpha,f(\alpha))$에서 접하는 접선의 방정식은 $y-f(\alpha)=f'(\alpha)(x-\alpha)$이다.
- label: '2'
  body: |
    미분가능한 두 함수 $f(x)$, $g(x)$에 대하여 $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때 다음 식이 성립한다.
    $$\int_a^b f(x)g'(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^b f'(x)g(x)\,dx$$
- label: '3'
  body: |
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는 $\{f(g(x))\}'=f'(g(x))g'(x)$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    좌표평면 위의 점 $\mathrm A(0,1)$에서 곡선 $y=f(x)=(\ln x)^2-\ln x$에 그은 두 접선의 접점을 $(\alpha,f(\alpha))$, $(\beta,f(\beta))$라 할 때, $\displaystyle\int_\alpha^\beta\{(\ln x)^2-\ln x\}\,dx$를 구하시오. (단, $\alpha<\beta$이다.) [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '3e^3-3', equivalents: ['3(e^3-1)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선 조건에서 $\ln b(\ln b-3)=0$, 즉 $\alpha=1,\ \beta=e^3$. 피적분함수 $=\ln x(\ln x-1)$에서 $\ln x=(x\ln x-x)'$로 부분적분.
    steps:
    - {id: 1a, content: '$\displaystyle\int_1^{e^3}\ln x(\ln x-1)dx=\Big[(x\ln x-x)(\ln x-1)\Big]_1^{e^3}-\int_1^{e^3}(\ln x-1)dx=3e^3-3$', criteria: [1.M1, 1.B1, 1.A1]}
    hint_ladder:
    - 접점을 $(b,f(b))$로 두고 접선이 $\mathrm A$를 지나는 조건을 세우자.
    - $\ln x$의 부정적분 $x\ln x-x$를 이용해 부분적분하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 모의논술 채점자 매뉴얼 p.16 예시 답안
    steps:
    - id: 1b-1
      content: |
        $(b,f(b))$에서의 접선의 방정식은 $y-\ln b(\ln b-1)=\dfrac1b(2\ln b-1)(x-b)$이고 $\mathrm A(0,1)$을 지나므로 대입하여 정리하면 $(\ln b)^2-3\ln b=0$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 $\alpha=1,\ \beta=e^3$이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $(x\ln x-x)'=\ln x$를 이용하여 부분적분을 하면
        $$\int_1^{e^3}\ln x(\ln x-1)\,dx=\Big[(x\ln x-x)(\ln x-1)\Big]_1^{e^3}-\int_1^{e^3}(\ln x-1)\,dx=3e^3-3$$
        이 된다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 접선의 방정식 $y-\ln b(\ln b-1)=\dfrac1b(2\ln b-1)(x-b)$를 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $\alpha=1,\ \beta=e^3$을 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 적분하여 $3e^3-3$을 얻었다.
      depends_on: [1.M1]
      implied_ok: true
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4404}
  misconceptions:
  - id: MC-CAL-4404
    outcome_code: '70'
    wrong_work: '$\mathrm A(0,1)$을 접점처럼 보고 $f''(0)$을 구하려 하거나, 접선의 기울기를 $\dfrac{f(b)-1}{b}$로만 놓고 $f''(b)$와 연결하지 않음'
    detect_cue: 접점 $x$좌표를 구하지 못하거나 $\alpha,\beta$가 $1,e^3$이 아님
    feedback: $\mathrm A$는 곡선 위의 점이 아닙니다. 접점을 $(b,f(b))$로 두고, 그 점의 접선이 $\mathrm A$를 지난다는 식을 세우세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표평면 위를 움직이는 점 P의 시각 $t$에서의 위치 $(x,y)$가
    $$x=t,\quad y=\sqrt6(t-2)^2$$
    이다. 점 P에서 원 $x^2+y^2=1$에 그은 두 접선과 원 $x^2+y^2=1$로 둘러싸인 부분의 넓이를 $S(t)$라 할 때, $S'(d)=0$을 만족시키는 $d$를 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac32', equivalents: ['3/2', '1.5'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $L=\mathrm{OP}$이면 $S=\sqrt{L^2-1}-\theta$, $\tan\theta=\sqrt{L^2-1}$ ⇒ $S'=\dfrac{\sqrt{L^2-1}}{L}L'$. $L^2=t^2+6(t-2)^4$의 도함수가 0인 $t=\dfrac32$.
    steps:
    - {id: 2a, content: '$S\prime=0\iff L\prime=0\iff t+12(t-2)^3=0\iff t=\dfrac32$', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - 두 접선과 원으로 둘러싸인 넓이는 사각형 넓이에서 부채꼴 넓이를 뺀 것이다.
    - 넓이는 원점과 P 사이 거리 $L$만의 함수이다.
    - $L>1$이므로 $S'=0$은 어떤 조건과 같은가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 모의논술 채점자 매뉴얼 p.16 예시 답안
    steps:
    - id: 2b-1
      content: |
        원점을 O라 하고, 점 P에서 원 $x^2+y^2=1$에 그은 한 접선의 접점을 B라 하자. 또한 세 점이 이루는 각 $\angle\mathrm{POB}$를 $\theta$라 하자. 이때, 원점과 점 $\mathrm P(t,\sqrt6(t-2)^2)$ 사이의 거리가 $L=\sqrt{t^2+6(t-2)^4}$이므로 원 $x^2+y^2=1$과 두 접선으로 둘러싸인 영역의 넓이를 다음과 같이 표현할 수 있다.
        $$S(t)=\sqrt{L^2-1}-\theta(t),\qquad\tan\theta(t)=\sqrt{L^2-1}$$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $S(t)$를 미분하면
        $$S'(t)=\frac{LL'}{\sqrt{L^2-1}}-\theta',\qquad(\sec^2\theta)\theta'=\frac{LL'}{\sqrt{L^2-1}}$$
        이므로 정리하여 $S'(t)=\dfrac{\sqrt{L^2-1}}{L}L'$를 얻을 수 있다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $L>1$이므로 $S'(d)=0$이 되는 $d$를 찾는 것은 $L'(d)=0$을 만족하는 $d$를 찾는 것이 된다. $2LL'=2t+24(t-2)^3$이고 $t+12(t-2)^3=0$의 근은 $t=\dfrac32$이다. 따라서 $d=\dfrac32$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $S(t)=\sqrt{L^2-1}-\theta(t)$, $\tan\theta(t)=\sqrt{L^2-1}$를 얻었다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: $S'(t)=\dfrac{\sqrt{L^2-1}}{L}L'$를 얻었다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: $t+12(t-2)^3=0$의 근 $t=\dfrac32$를 구했다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4405}
  misconceptions:
  - id: MC-GEO-4405
    outcome_code: '70'
    wrong_work: '넓이를 $\dfrac12\sqrt{L^2-1}-\dfrac\theta2$(삼각형 하나와 그에 대응하는 부채꼴만) 또는 $\sqrt{L^2-1}-\dfrac\theta2$로 세움'
    detect_cue: $S(t)$ 식의 계수가 예시답안과 다름(답 $\dfrac32$는 우연히 맞을 수 있으니 식 확인)
    feedback: 두 접선과 원으로 둘러싸인 부분은 직각삼각형 두 개(연 모양 사각형)에서 중심각 $2\theta$인 부채꼴을 뺀 것입니다. 넓이는 $\sqrt{L^2-1}-\theta$입니다.
    remedy: [RL-2]

