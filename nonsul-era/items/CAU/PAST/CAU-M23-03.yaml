  - '$\alpha<\beta$ ⇒ 적분 구간 $[1,e^3]$'
  - '원 밖의 점에서 그은 두 접선 ⇒ 넓이 $=2\cdot\dfrac12\cdot1\cdot\sqrt{L^2-1}-\dfrac12\cdot1^2\cdot2\theta$'
