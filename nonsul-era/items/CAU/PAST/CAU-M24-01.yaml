intent: 수열의 귀납적 정의로 확률변수를 정의하고, 이항분포를 이용해 확률과 기댓값을 정확히 찾는지 본다. 독립시행에서 일어날 수 있는 경우와 첫째항·이웃하는 두 항 사이의 관계로 점의 최종 위치를 찾아야 한다(채점자 매뉴얼 출제 의도 요지).
key_idea: '$x$좌표는 검은 공에서만, $y$좌표는 흰 공에서만 바뀌므로 최종 위치는 꺼낸 순서와 무관하게 검은 공 횟수 $m$만으로 정해진다: $(2^{m+1}-2,\ -\tfrac{3^{n+1}-3}{2})$.'
stuck: 공을 꺼내는 순서가 달라도 최종 좌표가 같다는 점(두 좌표가 따로 변함)을 알아채고, 각 좌표를 점화식으로 정리하는 단계
