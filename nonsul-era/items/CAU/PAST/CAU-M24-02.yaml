intent: 도함수를 이용해 함수의 최댓값·최솟값을 찾는 과정과 삼각함수의 성질로 식을 정리해 방정식을 푸는 능력(2-1), 고정된 두 점과 직선 위의 점이 이루는 각을 탄젠트 덧셈정리로 함수화하고 미분으로 최댓값을 구하는 능력(2-2)을 본다(채점자 매뉴얼 출제 의도 요지).
key_idea: '(2-1) $f''(x)=(\cos x-1)(4\cos x+1)$로 인수분해해 극값 후보와 끝값을 비교한다. (2-2) $\angle\mathrm{APB}$를 두 직선 $x=0,\ x=2$와 이루는 두 각의 합으로 나눠 $\tan\theta=\dfrac{2t+2}{2t^2+1}$로 만든다.'
stuck: (2-1) $f(x_2)$와 끝값 $f(2\pi)$의 대소 비교 / (2-2) 각 APB를 탄젠트 덧셈정리를 쓸 수 있는 두 각의 합으로 쪼개는 발상
idea_tags: [IDEA-TRIG-DERIV-FACTOR, IDEA-ANGLE-SPLIT-TAN-ADD]
tags: [삼각함수의 미분, 탄젠트 덧셈정리, 최대·최소, 중앙대 모의]
elements:
  materials:
  - '닫힌구간 $[0,2\pi]$에서 정의된 $f(x)=x-3\sin x+\sin(2x)$'
  - '점 $\mathrm{A}(0,1)$, $\mathrm{B}(2,1)$, 직선 $x+y=0$ 위의 점 P ($0\le x\le2$)'
  - '$\angle\mathrm{APB}=\theta$'
  concepts: [삼각함수의 도함수, 사인함수의 덧셈정리(배각), 탄젠트 덧셈정리, 닫힌구간에서의 최대·최소, 몫의 미분법]
  tools:
  - '$f''(x)=4\cos^2x-3\cos x-1=(\cos x-1)(4\cos x+1)$로 인수분해'
  - '임계점 $x_1<x_2$($\cos x=-\tfrac14$)와 끝값 $f(0),f(2\pi)$ 비교'
  - '$\mathrm{P}(t,-t)$로 두고 $\tan\alpha=\dfrac{t}{t+1}$, $\tan\beta=\dfrac{2-t}{t+1}$'
  - '$\tan\theta=\tan(\alpha+\beta)$를 $t$에 대해 미분'
  conditions:
  - '닫힌구간 $[0,2\pi]$ ⇒ 최댓값은 극값과 끝값 $f(0),f(2\pi)$ 중 가장 큰 값'
  - '$x_2>\dfrac{5\pi}{4}$ ⇒ $f(x_2)=x_2+\dfrac78\sqrt{15}>2\pi$ 이므로 $a=x_2$, $\sin a<0$'
  - '$0\le x\le2$ ⇒ $\mathrm{P}(t,-t)$, $0\le t\le2$ 에서 $\theta=\alpha+\beta$로 분할 가능'
  stimuli_used: ['1', '2', '3']
  subpart_links: 2-1·2-2 는 독립(공통 제시문만 공유). 2-1 은 제시문 1·2, 2-2 는 제시문 3(탄젠트 덧셈정리)과 제시문 1을 쓴다.

