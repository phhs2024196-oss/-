stimuli:
- label: '1'
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능하고 $x=a$에서 극값을 가지면 $f'(a)=0$이다.
- label: '2'
  body: |
    모든 실수 $\alpha,\ \beta$에 대하여 $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$가 성립한다.
- label: '3'
  body: |
    탄젠트 함수의 덧셈정리는 다음과 같다.
    $$\tan(\alpha+\beta)=\frac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}\qquad\tan(\alpha-\beta)=\frac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    닫힌구간 $[0,2\pi]$에서 정의된 함수 $f(x)=x-3\sin x+\sin(2x)$가 $x=a$에서 최댓값을 가질 때, $\sin a$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '-\dfrac{\sqrt{15}}{4}', equivalents: ['-sqrt(15)/4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=(\cos x-1)(4\cos x+1)$. 후보는 $f(0)=0$, $f(x_1)$, $f(x_2)$, $f(2\pi)=2\pi$이고, $x_2>\frac{5\pi}{4}$이므로 $f(x_2)>2\pi$.
    steps:
    - {id: 1a, content: '$a=x_2$ ($\cos a=-\tfrac14$, $\pi<a<2\pi$) ⇒ $\sin a=-\dfrac{\sqrt{15}}{4}$', criteria: [1.M1, 1.B1, 1.B2]}
    hint_ladder:
    - $\sin(2x)$의 도함수를 $\cos x$만의 식으로 바꿔 보자.
    - $f'(x)$를 $\cos x$에 대한 이차식으로 보고 인수분해하자.
    - 닫힌구간에서는 끝값도 최댓값 후보이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 모의논술 채점자 매뉴얼(자연) p.10 [문제 2-1] 예시 답안
    steps:
    - id: 1b-1
      content: |
        삼각함수의 덧셈정리를 이용하여 함수 $f(x)$를 미분한 후, 식을 다음과 같이 정리한다.
        $$f'(x)=1-3\cos x+(2\sin x\cos x)'=1-3\cos x+2(\cos^2x-\sin^2x)$$
        $$=4\cos^2x-3\cos x-1=(\cos x-1)(4\cos x+1)$$
      criteria: [1.M1, 1.B1]
    - id: 1b-2
      content: |
        여기서 $x=0,\ x_1,\ x_2,\ 2\pi$일 때, $f'(x)=0$을 만족하므로 ($\cos x_1=\cos x_2=-\dfrac14$이고 $x_1<x_2$라 한다.) $f(x)$의 최댓값은 $f(0)=0$, $f(x_1)=x_1-\dfrac78\sqrt{15}$, $f(x_2)=x_2+\dfrac78\sqrt{15}$, $f(2\pi)=2\pi$ 중 가장 큰 수이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $\cos x$ 함수의 그래프로부터 적어도 $x_2>\dfrac{5\pi}{4}$를 만족함을 알 수 있는데, 이를 이용하여 $f(x_2)$와 $f(2\pi)$를 비교하면 $a=x_2$임을 알 수 있다. 따라서 정답은 $\sin a=-\dfrac{\sqrt{15}}{4}$이다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $f'(x)=1-3\cos x+2\cos(2x)$를 구하고, 이를 이용하여 극값을 구하는 시도를 했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: 삼각함수의 성질로 $f'(x)$를 정리한 후 $\cos x=1,\ -\frac14$일 때 $f(x)$가 극값을 가진다는 것을 보였다.
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: $f(x_2)$와 $f(2\pi)$를 비교하여 정답 $\sin a=-\frac{\sqrt{15}}{4}$를 구했다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점. 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4503}
  misconceptions:
  - id: MC-CAL-4503
    outcome_code: '70'
    wrong_work: '극댓값 $f(x_2)$만 보고 끝값 $f(2\pi)=2\pi$와 비교하지 않거나, $\cos a=-\frac14$에서 $\sin a=+\frac{\sqrt{15}}{4}$로 부호를 정함'
    detect_cue: $f(2\pi)$ 언급 없음, 또는 $a$가 제3·4사분면인지 판단 없이 $\sin a>0$
    feedback: 닫힌구간의 최댓값은 극값과 양 끝값을 모두 비교해야 합니다. 또 $x_2>\pi$이므로 $\sin x_2<0$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    좌표평면 위의 점 $\mathrm{A}(0,1)$, $\mathrm{B}(2,1)$과 직선 $x+y=0$ 위의 점 P에 대하여 $\angle\mathrm{APB}=\theta$라 할 때, $\tan\theta$의 최댓값을 구하시오. (단, $0\le x\le2$이다.) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{2+\sqrt{6}}{2}', equivalents: ['1+sqrt(6)/2', '(2+sqrt(6))/2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}(t,-t)$에서 직선 $x=0$, $x=2$와 이루는 각 $\alpha,\ \beta$로 $\theta=\alpha+\beta$.
    steps:
    - {id: 2a, content: '$\tan\theta=\dfrac{2t+2}{2t^2+1}$, $t=\dfrac{\sqrt6}{2}-1$에서 최대 $\dfrac{2+\sqrt6}{2}$', criteria: [2.B1, 2.R1, 2.B2]}
    hint_ladder:
    - 점 P에서 수직선 $x=0$, $x=2$를 생각하면 각 APB가 두 각으로 나뉜다.
    - 두 각의 탄젠트를 $t$로 나타내고 덧셈정리를 쓰자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2024 모의논술 채점자 매뉴얼(자연) p.10~11 [문제 2-2] 예시 답안
    steps:
    - id: 2b-1
      content: |
        $\mathrm{P}(t,-t)\ (0\le t\le2)$라 하자. AP와 직선 $x=0$ 사이의 각을 $\alpha$, BP와 직선 $x=2$ 사이의 각을 $\beta$라 하면 $\tan\alpha=\dfrac{t}{t+1}$, $\tan\beta=\dfrac{2-t}{t+1}$이다. 덧셈 정리를 이용하여
        $$\tan\theta=\tan(\alpha+\beta)=\frac{2t+2}{2t^2+1}$$
        을 얻고,
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $t$에 대하여 미분하면 $\dfrac{2(1-4t-2t^2)}{(2t^2+1)^2}$을 구한다. $\tan\theta=\dfrac{2t+2}{2t^2+1}$는 $t=\dfrac{\sqrt6}{2}-1$ $\left(0<\dfrac{\sqrt6}{2}-1<2\right)$에서 극대이고 최댓값을 갖는다.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        $t=\dfrac{\sqrt6}{2}-1$을 $\tan\theta=\dfrac{2t+2}{2t^2+1}$에 대입하여 최댓값 $\dfrac{\sqrt6}{6-2\sqrt6}=\dfrac{2+\sqrt6}{2}$을 구한다.
      criteria: [2.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 7
      evidence: $\tan\theta=\dfrac{2t+2}{2t^2+1}$를 얻었다.
      depends_on: []
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: 미분하여 $t=\frac{\sqrt6}{2}-1$에서 최댓값을 갖는다는 것을 보였다(증감 근거 포함).
      depends_on: []
      steps: [2b-2]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: 최댓값 $\dfrac{2+\sqrt6}{2}$를 구했다.
      depends_on: []
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점. 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4504}
  misconceptions:
  - id: MC-CAL-4504
    outcome_code: '70'
    wrong_work: '$\theta=\alpha-\beta$로 두거나, $\tan\beta=\dfrac{2-t}{t+1}$ 대신 $\dfrac{t+1}{2-t}$(다른 축 기준 각)를 써서 덧셈정리 식이 어긋남'
    detect_cue: $\tan\theta$의 식이 $\frac{2t+2}{2t^2+1}$이 아니고, $t=1$에서 값이 $\frac43$이 아님
    feedback: 두 각을 같은 기준(수직선 $x=0$, $x=2$)으로 재고, 그 합이 $\theta$가 되는지 그림으로 확인하세요.
    remedy: [RL-2]

