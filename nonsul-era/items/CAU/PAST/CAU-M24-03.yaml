stimuli:
- label: '1'
  body: |
    미분가능한 함수 $g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속이고, $g(a)=\alpha$, $g(b)=\beta$에 대하여 함수 $f(x)$가 $\alpha$와 $\beta$를 양끝으로 하는 닫힌구간에서 연속일 때 다음 식이 성립한다.
    $$\int_a^b f(g(x))g'(x)\,dx=\int_\alpha^\beta f(t)\,dt$$
- label: '2'
  body: |
    양의 실수 $x,\ y$에 대하여 $\ln(xy)=\ln x+\ln y$가 성립한다.
- label: '3'
  body: |
    모든 자연수 $n$에 대하여 다음 식이 성립한다.
    $$\text{(1)}\ \sum_{k=1}^{n}k=\frac{n(n+1)}{2}\qquad\text{(2)}\ \sum_{k=1}^{n}k^2=\frac{n(n+1)(2n+1)}{6}$$
- label: '4'
  body: |
    $a$에 가까운 모든 실수 $x$에 대하여 $f(x)\le h(x)\le g(x)$이고 $\lim_{x\to a}f(x)=\lim_{x\to a}g(x)=L$이면 $\lim_{x\to a}h(x)=L$이다. (단, $L$은 실수이다.)

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    일반항이 $a_n=\dfrac{2^n}{n^2}$인 수열 $\{a_n\}$에 대하여 정적분 $I_n=\displaystyle\int_{\frac{1}{a_n}}^{a_n}\dfrac{1}{nx(1+x^n)}dx$의 극한값 $\displaystyle\lim_{n\to\infty}I_n$을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\ln 2', equivalents: ['ln2', 'log(2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 부정적분 $\ln\lvert x\rvert-\frac1n\ln\lvert1+x^n\rvert$을 구하면 $I_n=\frac{\ln a_n}{n}$.
    steps:
    - {id: 1a, content: '$I_n=\dfrac{\ln a_n}{n}=\ln2-\dfrac{2\ln n}{n}\to\ln2$', criteria: [1.M1, 1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 피적분함수의 분모에 $x^n$이 있다. $u=x^n$으로 바꾸어 보자.
    - $\dfrac{1}{u(u+1)}$을 부분분수로 나누자.
    - 위끝·아래끝이 $a_n$, $\frac{1}{a_n}$이므로 로그 값이 깔끔하게 정리된다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 모의논술 채점자 매뉴얼(자연) p.12 [문제 3-1] 예시 답안
    steps:
    - id: 1b-1
      content: |
        $u=x^n$ (즉, $x=u^{1/n}$)으로 치환을 하면
        $$\int\frac{dx}{x(1+x^n)}=\int\frac{1}{u^{1/n}(1+u)}\cdot\frac1n u^{\frac1n-1}du=\frac1n\int\frac{1}{u(u+1)}du$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이므로, 적분함수를 다음과 같이 정리하여 적분을 구할 수 있다.
        $$\frac1n\int\frac{du}{u(u+1)}=\frac1n\int\left(\frac1u-\frac{1}{u+1}\right)du=\frac1n\left(\ln\lvert u\rvert-\ln\lvert u+1\rvert\right)=\ln\lvert x\rvert-\frac1n\ln\lvert1+x^n\rvert$$
      criteria: [1.B1]
    - id: 1b-3
      content: |
        따라서,
        $$I_n=\int_{\frac{1}{a_n}}^{a_n}\frac{dx}{nx(1+x^n)}=\frac1n\left(\ln\frac{a_n}{1/a_n}-\frac1n\ln\left\lvert\frac{1+(a_n)^n}{1+(1/a_n)^n}\right\rvert\right)$$
        $$=\frac1n\left(\ln(a_n)^2-\frac1n\ln(a_n)^n\right)=\frac{\ln a_n}{n}=\ln2-\frac{2\ln n}{n}$$
      criteria: [1.B2]
    - id: 1b-4
      content: |
        이므로 $\displaystyle\lim_{n\to\infty}I_n=\ln2$이다.
      criteria: [1.B3]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2024 모의논술 채점자 매뉴얼(자연) p.12~13 [문제 3-1] 별해
    key_idea: 피적분함수를 $\dfrac1x-\dfrac{x^{n-1}}{1+x^n}$으로 분해하고 둘째 적분만 $u=1+x^n$으로 치환한다. (별해 채점기준 원문 — 분해 후 적분 시도 +4, $I_n=\frac{\ln a_n}{n}$ +3, 극한 +2)
    steps:
    - id: 1c-1
      content: |
        우선 적분을 다음과 같이 정리한 후
        $$\int\frac{dx}{x(1+x^n)}=\int\frac{dx}{x}-\int\frac{x^{n-1}}{1+x^n}dx,$$
        두 번째 적분에 대하여 $u=1+x^n$로 치환하면,
        $$\int\frac{dx}{x(1+x^n)}=\ln\lvert x\rvert-\frac1n\ln\lvert1+x^n\rvert$$
        를 얻을 수 있다.
      criteria: [1.M1, 1.B1]
    - id: 1c-2
      content: |
        따라서 $I_n=\dfrac1n\left(\ln(a_n)^2-\dfrac1n\ln(a_n)^n\right)=\dfrac{\ln a_n}{n}=\ln2-\dfrac{2\ln n}{n}$이므로 $\displaystyle\lim_{n\to\infty}I_n=\ln2$이다.
      criteria: [1.B2, 1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 치환하여 계산을 시도했다($u=x^n$ 등).
      depends_on: []
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: 치환적분을 계산하여 $\ln\lvert x\rvert-\frac1n\ln\lvert1+x^n\rvert$를 얻었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: 정적분의 값을 계산하여 $I_n=\dfrac{\ln a_n}{n}$을 구했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: $I_n$의 극한 $\ln2$를 구했다.
      depends_on: []
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점. 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4505}
  misconceptions:
  - id: MC-CAL-4505
    outcome_code: '70'
    wrong_work: '$u=x^n$으로 치환하면서 $dx=\frac1n u^{\frac1n-1}du$를 빠뜨리거나, 적분 구간을 $u$의 구간($a_n^{\,n}$, $a_n^{-n}$)으로 바꾸지 않고 $x$ 구간을 그대로 씀'
    detect_cue: 부정적분에 $\frac1n$ 계수가 없음, 또는 $I_n$이 $\ln a_n$·$n\ln a_n$ 꼴로 남아 극한이 발산
    feedback: 치환하면 $dx$도 $du$로 바꾸고, 정적분이면 끝값도 함께 바꿔야 합니다(또는 $x$로 되돌린 뒤 대입).
    remedy: [RL-1]
- id: '2'
  stem: |
    함수 $f(x)$가 다음 조건을 만족한다.

    (가) 모든 실수 $x,\ y$에 대하여 $f(x+y)=f(x)+f(y)+xy(x+y+1)+1$이다.

    (나) 0에 가까운 모든 실수 $x$에 대하여 $\lvert f(x)+1\rvert\le x^2$이다.

    $\displaystyle\sum_{k=1}^{10}f'(k)$를 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '440', equivalents: ['440'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (나)로 $\lim_{x\to0}\frac{f(x)+1}{x}=0$, (가)로 $f'(k)=k^2+k$.
    steps:
    - {id: 2a, content: '$f''(k)=k^2+k$ ⇒ $\sum_{k=1}^{10}(k^2+k)=385+55=440$', criteria: [2.R1, 2.B1, 2.B2]}
    hint_ladder:
    - (나)의 양변을 $\lvert x\rvert$로 나누어 보자.
    - 미분계수의 정의 $\lim_{h\to0}\frac{f(k+h)-f(k)}{h}$에 (가)를 쓰자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2024 모의논술 채점자 매뉴얼(자연) p.13 [문제 3-2] 예시 답안
    steps:
    - id: 2b-1
      content: |
        0에 가까운 모든 실수 $x$에 대하여, $\lvert f(x)+1\rvert\le x^2$이므로 $\lvert f(x)+1\rvert\le\lvert x\rvert^2$이고 $\left\lvert\dfrac{f(x)+1}{x}\right\rvert\le\lvert x\rvert$을 만족한다. 따라서 $-\lvert x\rvert\le\dfrac{f(x)+1}{x}\le\lvert x\rvert$이고
        $$\lim_{x\to0}(-\lvert x\rvert)=\lim_{x\to0}\lvert x\rvert=0\ \text{이므로}\ \lim_{x\to0}\frac{f(x)+1}{x}=0\ \text{이다.}$$
      criteria: [2.R1]
    - id: 2b-2
      content: |
        자연수 $k$에 대해서
        $$\frac{f(k+h)-f(k)}{h}=\frac{f(k)+f(h)+kh(k+h+1)+1-f(k)}{h}=\frac{f(h)+1}{h}+k^2+kh+k\ \text{이므로}$$
        $$\lim_{h\to0}\frac{f(k+h)-f(k)}{h}=\lim_{h\to0}\frac{f(h)+1}{h}+k^2+kh+k=k^2+k=f'(k)$$
      criteria: [2.B1]
    - id: 2b-3
      content: |
        $$\sum_{k=1}^{10}f'(k)=\sum_{k=1}^{10}k^2+\sum_{k=1}^{10}k=\frac{10\cdot11\cdot21}{6}+\left(\frac{10\cdot11}{2}\right)=440$$
      criteria: [2.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: $-\lvert x\rvert\le\dfrac{f(x)+1}{x}\le\lvert x\rvert$를 이용하여 $\lim_{x\to0}\dfrac{f(x)+1}{x}=0$을 올바르게 계산했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: $f'(k)=k^2+k$를 올바르게 계산했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: $\sum_{k=1}^{10}f'(k)=440$을 올바르게 계산했다.
      depends_on: []
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 총점 15점 이내에서 ±1점. 계산 실수로 틀렸어도 논리 전개 과정이 맞으면 해당 부분에 1~2점의 부분 점수 부여(공식 채점기준 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4506}
  misconceptions:
  - id: MC-CAL-4506
    outcome_code: '70'
    wrong_work: '(나)에 $x=0$만 대입해 $f(0)=-1$을 얻고 멈추거나, $\lim_{h\to0}\frac{f(h)+1}{h}$를 근거 없이 0 또는 $f''(0)$으로 두고 넘어감'
    detect_cue: 샌드위치(대소 관계) 언급 없이 $f'(k)=k^2+k$를 씀, 또는 $f'(k)=k^2+k+c$ 꼴로 상수 미정
    feedback: (나)를 $\lvert x\rvert$로 나누면 $\frac{f(x)+1}{x}$가 $-\lvert x\rvert$와 $\lvert x\rvert$ 사이에 끼므로 극한이 0입니다.
    remedy: [RL-2]

