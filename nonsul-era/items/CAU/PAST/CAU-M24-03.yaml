intent: 적분하는 함수를 적절한 형태로 변형한 뒤 치환적분을 계산하고 그 값으로 수열의 극한을 구하는 능력(3-1), 함수의 특성과 극한의 대소 관계를 활용해 미분계수를 정확히 찾는 능력(3-2)을 본다(채점자 매뉴얼 출제 의도 요지).
key_idea: |
  (3-1) $u=x^n$으로 치환해 $\dfrac{1}{u(u+1)}$의 부분분수로 만들면 $I_n=\dfrac{\ln a_n}{n}=\ln2-\dfrac{2\ln n}{n}$. (3-2) 조건 (나)에서 $\lim_{x\to0}\dfrac{f(x)+1}{x}=0$을 얻고, (가)로 $\dfrac{f(k+h)-f(k)}{h}=\dfrac{f(h)+1}{h}+k^2+kh+k$를 만들어 $f'(k)=k^2+k$.
stuck: (3-1) 적분 구간의 대칭($\frac{1}{a_n}\sim a_n$)을 이용한 로그 정리 / (3-2) 부등식 조건을 $\frac{f(x)+1}{x}$의 극한으로 바꾸고, 함수방정식에서 $f(k+h)-f(k)$에 그 식이 나타나게 만드는 단계
idea_tags: [IDEA-SUBST-XPOWN-PARTIAL-FRACTION, IDEA-FUNC-EQ-DERIV-DEFINITION, IDEA-SQUEEZE-LIMIT]
tags: [치환적분, 수열의 극한, 함수방정식, 미분계수의 정의, 중앙대 모의]
elements:
  materials:
  - '$a_n=\dfrac{2^n}{n^2}$, $I_n=\displaystyle\int_{1/a_n}^{a_n}\dfrac{1}{nx(1+x^n)}dx$'
  - '함수방정식 $f(x+y)=f(x)+f(y)+xy(x+y+1)+1$'
  - '0 근방 부등식 $\lvert f(x)+1\rvert\le x^2$'
  - '$\displaystyle\sum_{k=1}^{10}f''(k)$'
  concepts: [치환적분법, 로그의 성질, 수열의 극한, 함수의 극한의 대소 관계, 미분계수의 정의, 자연수의 거듭제곱의 합]
  tools:
  - '$u=x^n$ 치환 후 $\dfrac{1}{u(u+1)}=\dfrac1u-\dfrac{1}{u+1}$'
  - '$\ln\dfrac{a_n}{1/a_n}=2\ln a_n$, $\ln\dfrac{1+a_n^n}{1+a_n^{-n}}=n\ln a_n$ 정리'
  - '$-\lvert x\rvert\le\dfrac{f(x)+1}{x}\le\lvert x\rvert$ 와 샌드위치'
  - '$f(k+h)-f(k)$를 (가)로 전개해 미분계수 정의에 대입'
  - 'Σ 공식 (1)(2)'
  conditions:
  - '$a_n>1$ ($n\ge5$ 이후, 극한에서는 $a_n\to\infty$) ⇒ 적분 구간 $[1/a_n,a_n]$ 위에서 피적분함수 양수, 절댓값 기호 정리 가능'
  - '0 근방에서 $\lvert f(x)+1\rvert\le x^2$ ⇒ $f(0)=-1$ 이고 $\lim_{x\to0}\dfrac{f(x)+1}{x}=0$'
  - '(가)에 $x=k,\ y=h$ ⇒ $f(k+h)-f(k)=f(h)+1+kh(k+h+1)$'
  stimuli_used: ['1', '2', '3', '4']
  subpart_links: 3-1·3-2 는 독립. 3-1 은 제시문 1(치환적분)·2(로그 성질), 3-2 는 제시문 3(Σ 공식)·4(대소 관계)를 쓴다.

