elements:
  materials:
  - '구 $S:\ x^2+y^2+(z-1)^2=1$에 외접하는 원뿔(밑면 넓이 $A$, 꼭짓점은 양의 $z$축 위)'
  - '평면 $z=2$로 자른 원뿔대(부피 = 구 부피의 3배), 잘린 단면 넓이 $B$'
  - '정팔각형 ABCDEFGH, $\lvert\overrightarrow{\mathrm{CA}}-\overrightarrow{\mathrm{BE}}\rvert=2$'
  concepts: [구의 방정식, 원뿔·원뿔대의 부피, 삼각형의 닮음, 피타고라스 정리, 벡터의 크기와 내적, 벡터의 수직 조건]
  tools:
  - '$yz$평면 단면에서 점 P,Q,R,S,T,U,V 설정, $a=\overline{\mathrm{ST}}$, $b=\overline{\mathrm{QV}}$'
  - '닮음비로 $\overline{\mathrm{PT}}=ak$, $\overline{\mathrm{PV}}=bk$, $ak=bk+2$'
  - '원뿔대 부피 $V=\frac13\pi(a^3-b^3)k$'
  - '정팔각형을 품는 정사각형 PQRS로 넓이 $2(1+\sqrt2)d^2$'
  - '$\lvert\vec u\rvert^2=\vec u\cdot\vec u$, $\vec a\cdot\vec b=0$'
  conditions:
  - '구의 중심 $(0,0,1)$·반지름 1, 평면 $z=2$는 구의 꼭대기에 접함 ⇒ 원뿔대 높이 2, 구는 원뿔대에 내접'
  - '원뿔대 부피 = $3\times\dfrac{4\pi}{3}=4\pi$ ⇒ $k^2=\dfrac43$'
  - '정팔각형 ⇒ 이웃 변 사이 각 $135^\circ$, $\overrightarrow{\mathrm{DE}}\perp\overrightarrow{\mathrm{CB}}$, 대각 방향 성분 $\frac{\sqrt2}{2}d$'
  stimuli_used: ['1', '2', '3']
  subpart_links: 4-1·4-2 는 독립. 4-1 은 제시문 1, 4-2 는 제시문 2·3을 쓴다.

