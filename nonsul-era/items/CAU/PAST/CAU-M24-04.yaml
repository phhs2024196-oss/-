stimuli:
- label: '1'
  body: |
    중심이 점 $(a,b,c)$이고 반지름이 $r$인 구의 방정식은 $(x-a)^2+(y-b)^2+(z-c)^2=r^2$이고 그 부피는 $\dfrac43\pi r^3$이다. 밑면의 반지름이 $s$이고 높이가 $h$인 원뿔의 부피는 $\dfrac13\pi s^2h$이다.
- label: '2'
  body: |
    벡터 $\vec a$의 크기는 $\lvert\vec a\rvert$로 나타내고 $\lvert\vec a\rvert^2=\vec a\cdot\vec a$를 만족한다.
- label: '3'
  body: |
    영벡터가 아닌 두 벡터 $\vec b,\ \vec c$가 수직일 조건은 $\vec b\cdot\vec c=0$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    다음 그림과 같이 $xy$평면에 넓이가 $A$인 밑면을 가지고 양의 $z$축에 꼭짓점을 가지는 원뿔이 방정식 $x^2+y^2+(z-1)^2=1$로 정의된 구 $S$에 외접한다. 점 $(0,0,2)$를 지나고 $xy$평면에 평행한 평면으로 이 원뿔을 잘라 얻은 원뿔대의 부피가 구 $S$의 부피의 3배이고 잘린 단면의 넓이를 $B$라 할 때, $\dfrac{A}{B}$를 구하시오. [15점]

    [그림: 좌표공간에서 밑면이 $xy$평면 위에 있고 꼭짓점이 양의 $z$축 위에 있는 원뿔과, 그 안에 접하는 구 $S$. 높이 $z=2$에서 원뿔을 자른 단면(작은 원)이 구의 꼭대기에 닿아 있다.]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{23+5\sqrt{21}}{2}', equivalents: ['(5+sqrt(21))/(5-sqrt(21))', '(23+5*sqrt(21))/2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 단면의 닮음으로 $a,\ b$를 $k$로 나타내면 $ab=1$, $a+b=\frac{2\sqrt{1+k^2}}{k}$이고 $V=\frac{2\pi}{3}\{(a+b)^2-ab\}$.
    steps:
    - {id: 1a, content: '$V=\dfrac{2\pi}{3}\left(\dfrac{4(1+k^2)}{k^2}-1\right)=4\pi$ ⇒ $k^2=\dfrac43$ ⇒ $\dfrac AB=\dfrac{a^2}{b^2}=\dfrac{23+5\sqrt{21}}{2}$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 축을 지나는 평면($yz$평면)으로 잘라 이등변삼각형과 내접원으로 바꾸자.
    - 밑면 반지름 $a$, 윗면 반지름 $b$를 모선의 기울기 하나로 나타낼 수 있다.
    - 원뿔대 부피는 큰 원뿔에서 작은 원뿔을 뺀 것이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 모의논술 채점자 매뉴얼(자연) p.15 [문제 4-1] 예시 답안
    steps:
    - id: 1b-1
      content: |
        아래의 그림과 같이 원뿔과 구를 $yz$-평면으로 잘라 얻은 단면에 7개의 점 P, Q, R, S, T, U, V를 잡고 $a=\overline{\mathrm{ST}}$, $b=\overline{\mathrm{QV}}$라 하자. [그림: 꼭짓점 P, 밑변 위 S·T(T는 밑면 중심), 윗면 단면의 끝 Q와 중심 V, 구와 모선의 접점 R, 구의 중심 U. 직각삼각형 PQV(밑변 $b$, 높이 $bk$, 빗변 $b\sqrt{1+k^2}$)와 PUR(밑변 $\overline{\mathrm{UR}}=1$, 빗변 $\overline{\mathrm{PU}}=bk+1$)]
      criteria: []
    - id: 1b-2
      content: |
        두 직각삼각형 PST와 PQV의 닮음비가 $a:b$이므로 $\overline{\mathrm{PT}}=ak$, $\overline{\mathrm{PV}}=bk$라고 놓을 수 있다. 원의 반지름이 1이므로 $ak=bk+2$이다. 두 직각삼각형 PQV와 PUR이 닮은 것을 이용하여 비례식 $b\sqrt{1+k^2}:b=bk+1:1$으로부터 $b=\dfrac{\sqrt{1+k^2}-1}{k}$를 얻는다. $ak=bk+2$이므로 $a=\dfrac{\sqrt{1+k^2}+1}{k}$이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $a+b=\dfrac{2\sqrt{1+k^2}}{k}$, $ab=1$이므로 원뿔대의 부피 $V$는
        $$V=\frac13\pi(a^3-b^3)k=\frac13\pi(ak-bk)\left((a+b)^2-ab\right)=\frac{2\pi}{3}\left((a+b)^2-ab\right)=\frac{2\pi}{3}\left(\frac{4(1+k^2)}{k^2}-1\right)$$
      criteria: [1.B2]
    - id: 1b-4
      content: |
        $V$가 구의 부피 $\dfrac{4\pi}{3}$의 3배이므로 $V=\dfrac{2\pi}{3}\left(\dfrac{4(1+k^2)}{k^2}-1\right)=4\pi$에서 $k^2=\dfrac43$를 얻는다.
        $$\therefore\ \frac AB=\frac{\pi a^2}{\pi b^2}=\frac{a^2}{b^2}=\left(\frac{\sqrt{1+k^2}+1}{\sqrt{1+k^2}-1}\right)^2=\frac{5+\sqrt{21}}{5-\sqrt{21}}=\frac{23+5\sqrt{21}}{2}$$
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: 닮음 상수 $k$를 이용하여 $a=\overline{\mathrm{ST}}$, $b=\overline{\mathrm{QV}}$를 표현했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: 닮음 상수 $k$를 이용하여 원뿔대의 부피를 표현했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: $\dfrac AB$의 값 $\dfrac{5+\sqrt{21}}{5-\sqrt{21}}=\dfrac{23+5\sqrt{21}}{2}$을 얻었다.
      depends_on: []
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점. 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4507}
  misconceptions:
  - id: MC-GEO-4507
    outcome_code: '70'
    wrong_work: '원뿔대 부피를 $\frac13\pi a^2\cdot2$ 또는 $\frac13\pi\frac{(a+b)^2}{4}\cdot2$처럼 원뿔 공식 하나로 계산'
    detect_cue: 부피 식에 $a^3-b^3$ 또는 $a^2+ab+b^2$ 꼴이 없음
    feedback: 원뿔대 = 큰 원뿔 − 작은 원뿔입니다. 높이 2인 원뿔대의 부피는 $\frac{2\pi}{3}(a^2+ab+b^2)$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    정팔각형 ABCDEFGH에서 $\lvert\overrightarrow{\mathrm{CA}}-\overrightarrow{\mathrm{BE}}\rvert=2$일 때, 이 정팔각형의 넓이를 구하시오. [15점]

    [그림: 위쪽 변 AH, 왼쪽 변 BC, 아래쪽 변 DE, 오른쪽 변 GF인 정팔각형(꼭짓점은 A→B→C→D→E→F→G→H 순서로 반시계 방향). 벡터 $\overrightarrow{\mathrm{CA}}$와 $\overrightarrow{\mathrm{BE}}$가 화살표로 표시됨]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{8(3\sqrt{2}-1)}{17}', equivalents: ['8*(3*sqrt(2)-1)/17', '(24*sqrt(2)-8)/17'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 서로 수직인 $\vec a=\overrightarrow{\mathrm{DE}}$, $\vec b=\overrightarrow{\mathrm{CB}}$로 분해하면 $\lvert\overrightarrow{\mathrm{CA}}-\overrightarrow{\mathrm{BE}}\rvert^2=(7+4\sqrt2)d^2$.
    steps:
    - {id: 2a, content: '넓이 $2(1+\sqrt2)d^2=2(1+\sqrt2)\cdot\dfrac{4}{7+4\sqrt2}=\dfrac{8(3\sqrt2-1)}{17}$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 정팔각형을 품는 정사각형을 그려 넓이를 한 변 $d$로 나타내자.
    - 가로 방향 변 $\overrightarrow{\mathrm{DE}}$와 세로 방향 변 $\overrightarrow{\mathrm{CB}}$는 수직이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2024 모의논술 채점자 매뉴얼(자연) p.16 [문제 4-2] 예시 답안
    steps:
    - id: 2b-1
      content: |
        정팔각형의 한 변의 길이를 $d$라 하고 정팔각형을 포함하는 정사각형 PQRS를 아래의 그림과 같이 잡으면, 정팔각형의 넓이는 정사각형의 넓이에서 네 개의 직각이등변삼각형의 넓이를 빼면 되므로 $2(1+\sqrt2)d^2$이다. [그림: 정팔각형을 둘러싼 정사각형 PQRS. P는 A·B 쪽 모서리, Q는 C·D 쪽, R은 E·F 쪽, S는 H·G 쪽 모서리]
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $\vec a=\overrightarrow{\mathrm{DE}}$, $\vec b=\overrightarrow{\mathrm{CB}}$라 하면,
        $\overrightarrow{\mathrm{CA}}=\dfrac{\sqrt2}{2}\vec a+\left(1+\dfrac{\sqrt2}{2}\right)\vec b$이고 $\overrightarrow{\mathrm{BE}}=\left(1+\dfrac{\sqrt2}{2}\right)\vec a-\left(1+\dfrac{\sqrt2}{2}\right)\vec b$이다. $\vec a\cdot\vec b=0$이므로
        $$4=\lvert\overrightarrow{\mathrm{CA}}-\overrightarrow{\mathrm{BE}}\rvert^2=\lvert-\vec a+(2+\sqrt2)\vec b\rvert^2=\lvert\vec a\rvert^2+(2+\sqrt2)^2\lvert\vec b\rvert^2=(7+4\sqrt2)d^2$$
      criteria: [2.B2]
    - id: 2b-3
      content: |
        따라서 정팔각형의 넓이 $A$는
        $$A=2(1+\sqrt2)\cdot\frac{4}{7+4\sqrt2}=\frac{8(3\sqrt2-1)}{17}$$
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: 정팔각형 ABCDEFGH의 넓이를 한 변의 길이 $d$로 $2(1+\sqrt2)d^2$과 같이 표현했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: $4=(7+4\sqrt2)d^2$를 얻었다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: 정팔각형 ABCDEFGH의 넓이 $\dfrac{8(3\sqrt2-1)}{17}$을 구했다.
      depends_on: []
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점. 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여 가능(공식 채점기준 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4508}
  misconceptions:
  - id: MC-GEO-4508
    outcome_code: '70'
    wrong_work: '정사각형 한 변을 $3d$로 보고 넓이를 $9d^2-2d^2=7d^2$로 계산(모서리 삼각형의 다리를 $d$로 잡음)'
    detect_cue: 넓이 식에 $\sqrt2$가 없음, 또는 정사각형 한 변이 $(1+\sqrt2)d$가 아님
    feedback: 정팔각형의 대각 방향 변은 빗변이 $d$인 직각이등변삼각형을 만들므로 다리 길이는 $\frac{d}{\sqrt2}$입니다.
    remedy: [RL-2]

