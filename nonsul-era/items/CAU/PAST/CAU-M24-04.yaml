key_idea: |
  (4-1) 단면에서 모선 기울기를 닮음 상수 $k$로 두면 $a=\dfrac{\sqrt{1+k^2}+1}{k}$, $b=\dfrac{\sqrt{1+k^2}-1}{k}$, $ab=1$이고 부피 조건에서 $k^2=\dfrac43$. (4-2) $\vec a=\overrightarrow{\mathrm{DE}}$, $\vec b=\overrightarrow{\mathrm{CB}}$($\vec a\perp\vec b$)로 분해하면 $\overrightarrow{\mathrm{CA}}-\overrightarrow{\mathrm{BE}}=-\vec a+(2+\sqrt2)\vec b$.
stuck: (4-1) 아래·위 반지름 $a,\ b$를 한 문자 $k$로 묶는 닮음 설정과 $ab=1$ 발견 / (4-2) 서로 수직인 두 기본 벡터로 대각선 벡터를 분해하는 단계
