stimuli: []

stem: |
  주머니 A에는 1부터 3까지의 자연수가 각각 하나씩 적힌 3장의 카드가 들어 있고, 주머니 B에는 2부터 8까지의 자연수가 각각 하나씩 적힌 7장의 카드가 들어 있다. 이때 다음과 같은 시행을 한다.

  - 한 개의 주사위를 던져서 나온 눈의 수가 3의 배수이면 주머니 A를 선택하고, 아니면 주머니 B를 선택한다.
  - 선택한 주머니에서 두 장의 카드를 동시에 꺼낸다.
  - 두 장의 카드에 적힌 수 중 작은 수를 $a$, 큰 수를 $b$라고 할 때, $a$와 $b$가 $b^3-6ab^2+11a^2b-6a^3=0$을 만족하면 $\dfrac{b}{a}$점의 점수를 획득하고, 그렇지 않으면 $b-a$점의 점수를 획득한다.

  위의 시행을 한 번 할 때, 획득하는 점수의 기댓값을 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    위의 시행을 한 번 할 때, 획득하는 점수의 기댓값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac{146}{63}', equivalents: ['146/63'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 조건식을 인수분해해 점수 규칙을 단순화하고, 주머니 A(3쌍)·B(21쌍)의 분포를 각각 만든 뒤 $\dfrac13,\ \dfrac23$을 곱해 합친다.
    steps:
    - {id: 1a, content: '$(b-a)(b-2a)(b-3a)=0$. A: $X=1,2,3$ 각 $\dfrac13$. B: $X=1,\dots,6$ 의 경우의 수 $6,7,4,1,2,1$. $E(X)=\dfrac{146}{63}$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - 조건식은 $a,\ b$에 대한 동차 삼차식이다. $b=a$를 대입해 보자.
    - 주머니 B에서 $b=4a$인 쌍은 조건식을 만족하는가?
    - 주머니마다 확률분포표를 따로 만든 다음 선택 확률을 곱해 더하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 모의논술 채점자 매뉴얼 p.8~9 예시 답안
    steps:
    - id: 1b-1
      content: |
        주머니 A를 선택하는 사건을 $A$, 주머니 B를 선택하는 사건을 $B$라 하면 $P(A)=\dfrac26=\dfrac13$, $P(B)=\dfrac46=\dfrac23$이다.
      criteria: []
    - id: 1b-2
      content: |
        조건식 $b^3-6ab^2+11a^2b-6a^3=0$의 좌변을 인수분해 하면 $(b-a)(b-2a)(b-3a)=0$이다. 따라서 문제의 조건을 ‘$b=a$ 또는 $b=2a$ 또는 $b=3a$이면 $\dfrac ba$, 그렇지 않으면 $b-a$를 반환한다’로 바꿀 수 있다. 단, 두 장의 카드에 적힌 수가 같을 수 없으므로 $b=a$인 경우는 고려할 필요가 없다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        문제의 시행으로부터 반환되는 값을 $X$라 하자. 주머니 A를 선택한 경우, $a$와 $b$ 쌍이 가질 수 있는 값의 경우의 수는 ${}_3C_2=3$이다. $a$와 $b$의 값에 따른 $X$의 값은 $(a,b)=(1,2)$일 때 $\dfrac ba=2$, $(1,3)$일 때 $\dfrac ba=3$, $(2,3)$일 때 $b-a=1$이다.
      criteria: [1.B2]
    - id: 1b-4
      content: |
        따라서 주머니 A를 선택한 경우 $X$의 확률분포는 $P(X=1)=P(X=2)=P(X=3)=\dfrac13$이다. $P(X=x)$는 $X=x$인 경우의 수를 전체 경우의 수인 3으로 나누어 구한다.
      criteria: [1.B2]
    - id: 1b-5
      content: |
        주머니 B를 선택한 경우, $a$와 $b$ 쌍이 가질 수 있는 값의 경우의 수는 ${}_7C_2=21$이다. ($a=2,\ b=8$일 때 $b=4a$이므로 몫이 아닌 차를 구해야 함을 유의) $a$와 $b$의 값에 따른 $X$의 값은 다음과 같다.
        $(2,3)\to1$, $(2,4)\to\dfrac ba=2$, $(2,5)\to3$, $(2,6)\to\dfrac ba=3$, $(2,7)\to5$, $(2,8)\to6$, $(3,4)\to1$, $(3,5)\to2$, $(3,6)\to\dfrac ba=2$, $(3,7)\to4$, $(3,8)\to5$,
        $(4,5)\to1$, $(4,6)\to2$, $(4,7)\to3$, $(4,8)\to\dfrac ba=2$, $(5,6)\to1$, $(5,7)\to2$, $(5,8)\to3$, $(6,7)\to1$, $(6,8)\to2$, $(7,8)\to1$
      criteria: [1.B3]
    - id: 1b-6
      content: |
        따라서 주머니 B를 선택한 경우 $X$의 확률분포는 $X=1,2,3,4,5,6$에 대하여 각각 $\dfrac{6}{21},\ \dfrac{7}{21},\ \dfrac{4}{21},\ \dfrac{1}{21},\ \dfrac{2}{21},\ \dfrac{1}{21}$이다. $P(X=x)$는 $X=x$인 경우의 수를 전체 경우의 수인 21로 나누어 구한다.
      criteria: [1.B3]
    - id: 1b-7
      content: |
        $A$와 $B$는 배반사건이므로, 확률의 덧셈정리와 곱셈정리를 이용하여 $X$의 확률분포를 다음과 같이 구할 수 있다.
        $P(X=1)=\dfrac13\times\dfrac13+\dfrac23\times\dfrac{6}{21}=\dfrac{19}{63}$, $P(X=2)=\dfrac13\times\dfrac13+\dfrac23\times\dfrac{7}{21}=\dfrac{21}{63}$, $P(X=3)=\dfrac13\times\dfrac13+\dfrac23\times\dfrac{4}{21}=\dfrac{15}{63}$,
        $P(X=4)=\dfrac23\times\dfrac{1}{21}=\dfrac{2}{63}$, $P(X=5)=\dfrac23\times\dfrac{2}{21}=\dfrac{4}{63}$, $P(X=6)=\dfrac23\times\dfrac{1}{21}=\dfrac{2}{63}$
      criteria: [1.B4]
    - id: 1b-8
      content: |
        따라서, $X$의 기댓값은 다음과 같이 구할 수 있다.
        $$E(X)=1\times\dfrac{19}{63}+2\times\dfrac{21}{63}+3\times\dfrac{15}{63}+4\times\dfrac{2}{63}+5\times\dfrac{4}{63}+6\times\dfrac{2}{63}=\dfrac{146}{63}$$
      criteria: [1.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
