      depends_on: []
      steps: [1b-3, 1b-4]
    - id: 1.B3
      mark_type: B
      points: 8
      evidence: 주머니 B를 선택한 경우의 $X$의 경우의 수($6,7,4,1,2,1$) 또는 확률분포표를 정확히 구했다.
      depends_on: []
      steps: [1b-5, 1b-6]
    - id: 1.B4
      mark_type: B
      points: 5
      evidence: $X$의 기댓값 $\dfrac{146}{63}$을 정확히 구했다.
      depends_on: []
      steps: [1b-7, 1b-8]
