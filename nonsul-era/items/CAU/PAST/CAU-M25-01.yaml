  misconceptions:
  - id: MC-ALG-4601
    outcome_code: '70'
    wrong_work: '주머니 B의 $(2,8)$에서 $b=4a$인데도 $\dfrac ba=4$점으로 처리'
    detect_cue: 주머니 B 분포에서 $X=4$의 경우의 수가 2, $X=6$이 0
    feedback: 조건식의 해는 $b=a,\ 2a,\ 3a$ 뿐입니다. $b=4a$는 조건식을 만족하지 않으므로 $b-a=6$점입니다.
    remedy: [RL-1]
  - id: MC-PRB-4600
    outcome_code: '71'
    wrong_work: '두 주머니의 기댓값 $2$와 $\dfrac{52}{21}$을 단순 평균하거나, 경우의 수 $3+21=24$가지를 같은 확률로 취급'
    detect_cue: 주머니 선택 확률 $\dfrac13,\ \dfrac23$이 계산에 없음
    feedback: 주머니 선택은 같은 확률이 아닙니다. 각 주머니의 조건부 분포에 선택 확률을 곱해 더하세요.
    remedy: [RL-2]

