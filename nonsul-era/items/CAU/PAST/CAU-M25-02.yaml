stimuli:
- label: '1'
  body: |
    수열을 처음 몇 개의 항과 이웃하는 여러 항 사이의 관계식으로 정의하는 것을 수열의 귀납적 정의라고 한다.
- label: '2'
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 방정식은 $y-f(a)=f'(a)(x-a)$이다.
- label: '3'
  body: |
    탄젠트함수의 덧셈정리는 다음과 같다.
    $$\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}\qquad\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$$

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    수열 $\{a_n\}$은 $a_1=2$이고 모든 자연수 $n$에 대하여
    $$a_{n+1}=\begin{cases}a_n-4 & (a_n>0)\\ a_n & (a_n=0)\\ a_n+d & (a_n<0)\end{cases}\qquad(\text{단, }d\text{는 자연수})$$
    이다. 다음 성질을 만족하는 자연수 $d$를 모두 구하시오. [10점]

    > $a_m=0$을 만족하는 $m$의 최솟값은 7이다.
  points: 10
  depends_on: []
  answer: {kind: set, value: '\{7,\ 18\}', equivalents: ['7, 18', 'd=7 또는 d=18'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_2=-2,\ a_3=-2+d$에서 출발해 $d$의 크기로 $a_4,a_5,a_6$의 식을 나누고 $a_6=4$ 또는 $a_6=-d$를 푼다.
    steps:
    - {id: 1a, content: '$d=7$: $a_6=-10+2d=4$. $d\ge11$: $a_6=-14+d=4$에서 $d=18$. 나머지 범위는 중간에 0이 되거나 $a_6$ 조건 불만족', criteria: [1.M1, 1.B1, 1.B2]}
    hint_ladder:
    - $a_7=0$이 되려면 $a_6$은 어떤 값이어야 하는가?
    - $a_3=d-2$의 부호에 따라 $d$를 작은 것부터 나누어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 모의논술 채점자 매뉴얼 p.11 예시 답안
    steps:
    - id: 1b-1
      content: |
        수열 $\{a_n\}$의 정의로부터 $a_7=0,\ a_6\neq0$인 $d$를 찾으면 된다는 것을 알 수 있다. 또한, $a_1=2,\ a_2=-2,\ a_3=-2+d$가 성립하고, $a_6=4$ 혹은 $-d$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        - $d=1,2$이면 $a_4=0\ (d=1)$, $a_3=0\ (d=2)$이 되어 성립하지 않는다.
        - $d=3$이면 $a_5=-6+2d$가 되어 성립하지 않는다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $d>3$이므로, $a_4=-6+d$이고 $d\neq6$이다.
        - $d=4,5$이면 $a_6=2\ (d=4)$, $a_6=0\ (d=5)$가 되어 성립하지 않는다.
        - $d=7,8,9$이면 $a_6=-10+2d$가 되어 $d=7$일 때 성립한다.
      criteria: [1.B1]
    - id: 1b-4
      content: |
        - $d=10$이면, $a_5=0$이 되어 성립하지 않는다.
        - $d\ge11$이면, $a_6=-14+d$가 되어 $d=18$일 때 성립한다.

        그러므로, 주어진 조건을 만족하는 자연수 $d$는 7 또는 18이다.
      criteria: [1.B2]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2025 모의논술 채점자 매뉴얼 p.11 별해
    key_idea: $a_4,\ a_5,\ a_6$을 $d$의 범위별 식으로 나타내 0이 되는 $d$를 제외한다.
    steps:
    - id: 1c-1
      content: |
        수열 $\{a_n\}$의 정의로부터 $a_7=0,\ a_6\neq0$인 $d$를 찾으면 된다는 것을 알 수 있다. 또한, $a_1=2,\ a_2=-2,\ a_3=-2+d$이므로 $d\neq1,2$이다.
      criteria: [1.M1]
    - id: 1c-2
      content: |
        $a_4=-6+d$이므로 $d\neq3,6$이고
        $$a_5=\begin{cases}-6+2d & (d=4,5)\\ -10+d & (d>6)\end{cases},\qquad a_6=\begin{cases}-10+2d & (d=4,5,7,8,9)\\ -14+d & (d>10)\end{cases}$$
        이고, $d\neq5,10,14$이다.
      criteria: [1.B1]
    - id: 1c-3
      content: |
        $a_6=4$ 혹은 $-d$이므로 경우의 수를 고려하면 $d$는 7 또는 18이다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $d$의 값(범위)에 따라 경우를 나누어 항을 구하는 시도가 있다.
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: 7 혹은 18 중 하나를 구했다(별해 기준 — $a_6$ 혹은 $a_7$을 경우를 나누어 맞게 구함).
      depends_on: []
      steps: [1b-3]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: 7과 18을 둘 다 구했다(모든 경우를 확인해 $d=7$ 또는 $18$).
      depends_on: []
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D1-2
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-4602}
  misconceptions:
  - id: MC-ALG-4602
    outcome_code: '70'
    wrong_work: '$a_6=4$ 또는 $-d$의 식만 풀어 $d=5$(또는 $d=10,14$)처럼 중간 항이 이미 0이 되는 값까지 답에 넣음'
    detect_cue: 답에 7, 18 외의 값이 있음, $a_3\sim a_6$ 중 0인 항 확인이 없음
    feedback: '$m$의 최솟값이 7이므로 $a_1,\dots,a_6$은 모두 0이 아니어야 합니다. 한 번 0이 되면 그 뒤로 계속 0입니다.'
    remedy: [RL-1]

- id: '2'
  stem: |
    $n$이 자연수일 때, $y$축 위의 점 $(0,\ n)$에서 곡선 $y=\ln x$에 그은 접선을 $l_n$이라 하고, $l_n$이 $x$축의 양의 방향과 이루는 각도를 $\theta_n$이라 하자. $x$축과 $l_n$, $l_{n+1}$로 둘러싸인 삼각형의 넓이를 $S_n$이라 할 때, $\displaystyle\lim_{n\to\infty}\dfrac{S_n\tan(\theta_n-\theta_{n+1})}{n^2}$을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{(e-1)^2}{2e}', equivalents: ['(e-1)^2/(2e)', '\dfrac{e}{2}-1+\dfrac{1}{2e}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 접점 $a=e^{n+1}$, $\tan\theta_n=e^{-(n+1)}$, 교점의 $y$좌표 $\dfrac{e}{e-1}+n$, 두 $x$절편의 차로 $S_n$을 만든다.
    steps:
    - {id: 2a, content: '$S_n=\dfrac12\{(n+1)e^{n+2}-ne^{n+1}\}\left(\dfrac{e}{e-1}+n\right)$, $\tan(\theta_n-\theta_{n+1})=\dfrac{e^{n+2}-e^{n+1}}{e^{2n+3}+1}$, 극한 $\dfrac{(e-1)^2}{2e}$', criteria: [2.B1, 2.B2, 2.B3, 2.B4]}
    hint_ladder:
    - 접점을 $(a,\ln a)$로 두고 접선이 $(0,n)$을 지나게 하자.
    - $\theta_n$의 탄젠트는 무엇인가?
    - 삼각형의 밑변은 두 $x$절편 사이, 높이는 교점의 $y$좌표이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 모의논술 채점자 매뉴얼 p.12 예시 답안
    steps:
    - id: 2b-1
      content: |
        점 $(0,\ n)$에서 $y=\ln x$에 그은 접선의 접점을 $(a,\ \ln a)$라 하면, 접선의 방정식은 $y=\dfrac1a(x-a)+\ln a$이다. 이 접선이 $(0,\ n)$을 지나므로, $n=-1+\ln a$, 즉, $a=e^{n+1}$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        접선 $l_n$과 $l_{n+1}$의 방정식은 각각
        $l_n:\ y=e^{-n-1}x+n$, $l_{n+1}:\ y=e^{-(n+2)}x+(n+1)$이다.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        $\tan\theta_n=e^{-(n+1)}$, $\tan\theta_{n+1}=e^{-(n+2)}$이므로, 탄젠트 덧셈정리에 의하여
        $$\tan(\theta_n-\theta_{n+1})=\dfrac{e^{n+2}-e^{n+1}}{e^{2n+3}+1}$$
        이다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        한편, $l_n$과 $l_{n+1}$의 교점은 $x=\dfrac{1}{e^{-n-1}-e^{-n-2}}$, $y=\dfrac{e}{e-1}+n$이다.
      criteria: [2.B3]
    - id: 2b-5
      content: |
        또한, $l_n$과 $l_{n+1}$의 $x$절편은 각각 $-ne^{n+1}$, $-(n+1)e^{n+2}$이다. 따라서, 삼각형의 넓이
        $$S_n=\dfrac12\left((n+1)e^{n+2}-ne^{n+1}\right)\left(\dfrac{e}{e-1}+n\right)$$
        이고 주어진 극한
        $$\lim_{n\to\infty}\dfrac{S_n\tan(\theta_n-\theta_{n+1})}{n^2}=\lim_{n\to\infty}\dfrac{1}{2n^2}\left((n+1)e^{n+2}-ne^{n+1}\right)\left(\dfrac{e}{e-1}+n\right)\dfrac{e^{n+2}-e^{n+1}}{e^{2n+3}+1}$$
        $$=\lim_{n\to\infty}\dfrac{1}{2n^2}\cdot\dfrac{e^3-e^2}{e^3+e^{-2n}}\left((e-1)n+e\right)\left(n+\dfrac{e}{e-1}\right)=\dfrac{(e-1)^2}{2e}$$
      criteria: [2.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: '$l_n:\ y=e^{-n-1}x+n$, $l_{n+1}:\ y=e^{-(n+2)}x+(n+1)$을 얻었다.'
      depends_on: []
      steps: [2b-1, 2b-2]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: $\tan(\theta_n-\theta_{n+1})=\dfrac{e^{n+2}-e^{n+1}}{e^{2n+3}+1}$을 얻었다.
      depends_on: []
      steps: [2b-3]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: $l_n$과 $l_{n+1}$의 교점을 구했다.
      depends_on: []
      steps: [2b-4]
    - id: 2.B4
      mark_type: B
      points: 4
      evidence: 극한값 $\dfrac{(e-1)^2}{2e}$을 구했다.
      depends_on: []
      steps: [2b-5]
    deductions:
    - code: D2-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D2-2
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4603}
  misconceptions:
  - id: MC-CAL-4603
    outcome_code: '70'
    wrong_work: '$(0,n)$을 접점처럼 보고 기울기를 구하려 하거나, 접점을 $(e^n,\ n)$으로 잡음'
    detect_cue: 접점의 $x$좌표가 $e^{n+1}$이 아님, $\tan\theta_n=e^{-n}$
    feedback: '$(0,n)$은 곡선 위의 점이 아닙니다. 접점을 $(a,\ln a)$로 두고 그 접선이 $(0,n)$을 지나는 조건으로 $a$를 구하세요.'
    remedy: [RL-2]

