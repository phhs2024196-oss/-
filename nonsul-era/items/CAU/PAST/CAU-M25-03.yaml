intent: '[3-1] 적분하는 함수를 적절한 형태로 치환해 정적분을 계산하고, 그 값으로 이루어진 수열의 합을 구할 수 있는지, [3-2] 식의 인수분해를 수행하고 인수분해로 얻은 식에서 요구하는 값의 최솟값을 미분으로 구할 수 있는지를 본다(채점매뉴얼 출제 의도 요지).'
key_idea: '[3-1] $(x\ln x-x)''=\ln x$이므로 $y=x\ln x-x$로 치환하면 $a_n=\displaystyle\int_{-1}^{0}y^n\,dy$. [3-2] 곡선 식을 $y$에 대해 인수분해하면 $(y-x^2)(y-x-1)=0$.'
stuck: '[3-1] 피적분함수 안의 $\ln x$가 괄호 안 식의 도함수임을 알아보는 단계 / [3-2] $y$에 대한 이차식으로 보고 인수분해하는 단계'
idea_tags: [IDEA-SUBST-INNER-DERIVATIVE, IDEA-TELESCOPING-PARTIAL-FRACTION, IDEA-FACTOR-CURVE-INTO-BRANCHES]
tags: [치환적분, 부분분수 합, 인수분해, 최솟값, 중앙대 모의]
elements:
  materials: ['$a_n=\displaystyle\int_1^e(x\ln x-x)^n\ln x\,dx$와 $\displaystyle\sum_{k=1}^{2024}a_ka_{k+1}$', '곡선 $y^2-(x^2+x+1)y+x^3+x^2=0$ 위의 점 P와 A(1,0), B(5,0)', '$\overline{PA}^2+\overline{PB}^2$']
  concepts: [치환적분법, 수열의 합(부분분수), 다항식의 인수분해, 두 점 사이의 거리, 미분을 이용한 최솟값]
  tools: [y=x ln x − x 치환과 구간 변환, 부분분수 분해로 망원 합, y에 대한 이차식 인수분해, 분지별 거리 제곱 함수의 최솟값(미분)]
  conditions:
  - '$(x\ln x-x)''=\ln x$ ⇒ $y=x\ln x-x$로 치환, $x:1\to e$일 때 $y:-1\to0$'
  - '$a_n=\dfrac{(-1)^n}{n+1}$ ⇒ $a_ka_{k+1}=\dfrac{-1}{(k+1)(k+2)}$(부호가 번갈아 곱이 음수)'
  - '$y^2-(x^2+x+1)y+x^3+x^2=0$ ⇒ $(y-x^2)(y-x-1)=0$ ⇒ P는 $y=x^2$ 또는 $y=x+1$ 위'
  stimuli_used: ['1', '2', '3']
  subpart_links:
  - {from: '1', to: '2', relation: 독립(서로 다른 소재)}

