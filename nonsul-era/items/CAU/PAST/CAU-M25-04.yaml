stimuli:
- label: '1'
  body: |
    중심이 $(a,b,c)$이고 반지름의 길이가 $r$인 구의 방정식은 $(x-a)^2+(y-b)^2+(z-c)^2=r^2$이다.
- label: '2'
  body: |
    두 초점 $\mathrm F(c,0)$, $\mathrm F^\prime(-c,0)$으로부터의 거리의 합이 $2a$인 타원의 방정식은 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$이다. (단, $a>c>0$, $b^2=a^2-c^2$)
- label: '3'
  body: |
    타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$에 접하고 기울기가 $m$인 직선의 방정식은 $y=mx\pm\sqrt{a^2m^2+b^2}$이다.

stem: |
  다음을 읽고 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    구 $(x-3)^2+(y-4)^2+(z-5)^2=1$을 $S$라 하자. 중심이 구 $S$ 위에 놓여있고 반지름의 길이가 7인 구가 $xy$평면, $yz$평면, $zx$평면과 만나서 이루는 세 원을 각각 $C_1$, $C_2$, $C_3$라 하자. $C_1$, $C_2$, $C_3$의 넓이의 합을 $A$라 할 때, $\dfrac{A}{\pi}$의 최솟값과 최댓값의 합을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '192', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\dfrac A\pi=147-(a^2+b^2+c^2)$, $\sqrt{a^2+b^2+c^2}\in[\sqrt{50}-1,\ \sqrt{50}+1]$.
    steps:
    - {id: 1a, content: '최솟값 $96-2\sqrt{50}$, 최댓값 $96+2\sqrt{50}$, 합 $192$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - $xy$평면($z=0$)으로 자른 단면 원의 반지름을 구해 보자.
    - 세 넓이의 합은 중심의 어떤 양으로 표현되는가?
    - 구 위의 점 중 원점에서 가장 가까운 점과 가장 먼 점은 어디에 있는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 모의논술 채점자 매뉴얼 p.14 예시 답안
    steps:
    - id: 1b-1
      content: |
        구 $S$ 위의 점 $(a,b,c)$를 중심으로 하고 반지름의 길이가 7인 구 $(x-a)^2+(y-b)^2+(z-c)^2=7^2$가 $xy$평면과 만나는 원 $C_1$의 방정식은 $z=0$을 대입하여 얻은 $(x-a)^2+(y-b)^2=7^2-c^2$이다. 따라서 그 넓이는 $(7^2-c^2)\pi$이다. 마찬가지로 $C_2$, $C_3$의 넓이는 각각 $(7^2-a^2)\pi$, $(7^2-b^2)\pi$이므로 $\dfrac A\pi=147-(a^2+b^2+c^2)$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        원점 O와 구 $S$의 중심 $\mathrm C(3,4,5)$를 통과하는 직선은 구 $S$와 두 점에서 만나는데, 이 중 한 점은 구 $S$ 위의 점 중에서 원점과 가장 가까운 점이고 다른 한 점은 가장 먼 점이다. 이 두 점을 P, Q라 하고 $\overline{\mathrm{OP}}<\overline{\mathrm{OQ}}$라 가정할 수 있다. 그러면 $\overline{\mathrm{OC}}=\sqrt{3^2+4^2+5^2}=\sqrt{50}$이므로 $\overline{\mathrm{OP}}=\sqrt{50}-1$, $\overline{\mathrm{OQ}}=\sqrt{50}+1$이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $\sqrt{50}-1\le\sqrt{a^2+b^2+c^2}\le\sqrt{50}+1$이므로
        $$51-2\sqrt{50}\le a^2+b^2+c^2\le51+2\sqrt{50}$$
        $$96-2\sqrt{50}\le147-(a^2+b^2+c^2)\le96+2\sqrt{50}$$
        에서 $\dfrac A\pi$의 최솟값과 최댓값은 각각 $96-2\sqrt{50}$, $96+2\sqrt{50}$이고 그 합은 192이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: $C_1$, $C_2$, $C_3$의 넓이 $(7^2-c^2)\pi$, $(7^2-a^2)\pi$, $(7^2-b^2)\pi$를 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: $\overline{\mathrm{OP}}=\sqrt{50}-1$, $\overline{\mathrm{OQ}}=\sqrt{50}+1$을 얻었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: $\dfrac A\pi$의 최댓값과 최솟값의 합 192를 얻었다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D1-2
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4606}
  misconceptions:
  - id: MC-GEO-4606
    outcome_code: '70'
    wrong_work: '$2\le a\le4$, $3\le b\le5$, $4\le c\le6$을 각각 따로 써서 $a^2+b^2+c^2$의 범위를 $[29,77]$로 잡음'
    detect_cue: 최솟값·최댓값이 $70$, $118$ 등 근호 없는 값, 합이 192가 아님
    feedback: 세 좌표가 동시에 끝값을 가질 수는 없습니다. $a^2+b^2+c^2$은 원점까지 거리의 제곱이므로 원점과 구의 중심을 잇는 직선 위에서 최대·최소가 됩니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    두 초점이 $\mathrm F(c,0)$, $\mathrm F^\prime(-c,0)$인 타원 $E$가 다음의 두 조건을 만족한다.

    (가) 타원 $E$ 위의 두 점과 점 F를 꼭짓점으로 하는 삼각형의 둘레의 최댓값이 $4\sqrt{10}$이다.
    (나) 기울기가 $\sqrt3$이고 타원 $E$에 접하는 두 직선 사이의 거리가 6이다.

    직선 $y=x+c$가 타원 $E$와 점 P, Q에서 만날 때, 삼각형 PQF의 넓이를 구하시오. (단, $c>0$) [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '3\sqrt5', equivalents: ['3*sqrt(5)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 둘레의 최댓값은 $4a$(F′을 지나는 현에서 달성) ⇒ $a=\sqrt{10}$. 접선 거리 $\sqrt{30+b^2}=6$ ⇒ $b^2=6$, $c=2$. 직선이 F′을 지나므로 넓이 $=\dfrac12\lvert\alpha-\beta\rvert\cdot4$.
    steps:
    - {id: 2a, content: '$4y^2-6y-9=0$의 두 근 차 $\dfrac{3\sqrt5}{2}$, 넓이 $\dfrac12\cdot\dfrac{3\sqrt5}2\cdot4=3\sqrt5$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 삼각형 ABF의 둘레를 타원의 정의 $\overline{\mathrm{AF}}+\overline{\mathrm{AF^\prime}}=2a$와 비교해 보자.
    - 기울기가 같은 두 접선 사이의 거리는 $y$절편 차가 아니다.
    - 직선 $y=x+c$는 어느 초점을 지나는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 모의논술 채점자 매뉴얼 p.14~15 예시 답안
    steps:
    - id: 2b-1
      content: |
        타원 $E$를 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$이라 하고 그 위의 두 점 A, B를 잡자. 삼각형 ABF의 둘레가 $4a$ 이하임을 다음의 두 가지 경우로 나누어 관찰한다.
        (a) 점 A, B 중에서 한 점, 가령 점 B가 $x$축에 있거나 점 A, B가 $x$축 반대편에 있는 경우(그림 Ⅰ, Ⅱ 참고):
        $$\overline{\mathrm{AB}}+\overline{\mathrm{BF}}+\overline{\mathrm{FA}}\le\overline{\mathrm{AF^\prime}}+\overline{\mathrm{F^\prime B}}+\overline{\mathrm{BF}}+\overline{\mathrm{FA}}=(\overline{\mathrm{FA}}+\overline{\mathrm{AF^\prime}})+(\overline{\mathrm{F^\prime B}}+\overline{\mathrm{BF}})=2a+2a=4a$$
      criteria: [2.B1]
    - id: 2b-2
      content: |
        (b) 점 A, B가 $x$축 한편에 있는 경우(그림 Ⅲ 참고): 점 A, B 중에서 $x$축에 더 가깝지 않은 점, 가령 점 A를 $x$축에 대하여 대칭 이동한 점을 $\mathrm A^\prime$이라 하고, 점 B에서 직선 $\mathrm{AA^\prime}$에 내린 수선의 발을 H라 하면 $\overline{\mathrm{AH}}<\overline{\mathrm{A^\prime H}}$이고 $\overline{\mathrm{FA}}=\overline{\mathrm{FA^\prime}}$이므로
        $$\overline{\mathrm{AB}}+\overline{\mathrm{BF}}+\overline{\mathrm{FA}}=\sqrt{\overline{\mathrm{AH}}^2+\overline{\mathrm{HB}}^2}+\overline{\mathrm{BF}}+\overline{\mathrm{FA^\prime}}<\sqrt{\overline{\mathrm{A^\prime H}}^2+\overline{\mathrm{HB}}^2}+\overline{\mathrm{BF}}+\overline{\mathrm{FA^\prime}}=\overline{\mathrm{A^\prime B}}+\overline{\mathrm{BF}}+\overline{\mathrm{FA^\prime}}$$
        여기서, $\overline{\mathrm{A^\prime B}}+\overline{\mathrm{BF}}+\overline{\mathrm{FA^\prime}}$는 (a)의 관찰에 의해 $4a$ 이하이다.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        초점 F′을 지나고 $y$축과 평행한 직선과 타원의 두 교점을 점 A, B로 잡으면 삼각형 ABF의 둘레가 $4a$가 되므로 위 관찰 (a), (b)에 의해 삼각형 ABF의 둘레의 최댓값은 $4a=4\sqrt{10}$이어서 $a=\sqrt{10}$
      criteria: [2.B1]
    - id: 2b-4
      content: |
        기울기가 $\sqrt3$인 두 접선 $y=\sqrt3x\pm\sqrt{30+b^2}$ 사이의 거리는 그림 Ⅳ에서 $2\sqrt{30+b^2}\sin30^\circ=6$이므로 $b^2=6$, $c=\sqrt{a^2-b^2}=2$
      criteria: [2.B2]
    - id: 2b-5
      content: |
        직선 $y=x+2$와 타원 $\dfrac{x^2}{10}+\dfrac{y^2}{6}=1$을 연립하여 얻은 이차방정식 $4y^2-6y-9=0$의 두 근은 $\alpha=\dfrac{3+3\sqrt5}{4}$, $\beta=\dfrac{3-3\sqrt5}{4}$이므로 $\triangle\mathrm{PQF}=\dfrac12\cdot\lvert\alpha-\beta\rvert\cdot\overline{\mathrm{FF^\prime}}=3\sqrt5$ (그림 Ⅴ 참고)
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: $a=\sqrt{10}$을 구했다(둘레의 최댓값이 $4a$임을 근거로).
      depends_on: []
      steps: [2b-1, 2b-2, 2b-3]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: $c=2$를 구했다.
      depends_on: []
      steps: [2b-4]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: $\triangle\mathrm{PQF}=3\sqrt5$를 구했다.
      depends_on: []
      steps: [2b-5]
    deductions:
    - code: D2-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점 부분 점수 가능(공식 채점기준 주석)
      effect: minus
      value: 1
    - code: D2-2
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 채점기준 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4607}
  misconceptions:
  - id: MC-GEO-4607
    outcome_code: '70'
    wrong_work: '두 접선 사이 거리를 $y$절편의 차 $2\sqrt{30+b^2}=6$으로 놓아 $b^2<0$ 같은 모순에 빠지거나 다른 $c$를 얻음'
    detect_cue: $2\sqrt{30+b^2}=6$ 식, 기울기 보정($\sqrt{1+m^2}$ 또는 $\sin30^\circ$)이 없음
    feedback: 평행한 두 직선 사이의 거리는 $y$절편 차를 $\sqrt{1+m^2}$으로 나눈 값입니다(기울기 $\sqrt3$이면 2로 나눔).
    remedy: [RL-2]

