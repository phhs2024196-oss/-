stimuli: []

stem: |
  다음 규칙에 따라 시행을 한다. 풀이와 함께 물음에 답하시오.

  - 남학생 3명과 여학생 3명이 일렬로 놓인 6개의 의자에 앉는다. 이때, 같은 성별의 학생은 서로 구별하지 않는다.
  - 각 학생은 손을 들거나 들지 않을 수 있다.
  - 손을 든 두 학생 사이에 손을 든 다른 학생이 없으면, 그 두 학생은 이웃하여 손을 든 것으로 간주한다.
  - 같은 성별의 두 학생은 이웃하여 손을 들 수 없다.

  위 시행에서 2명 이상의 남학생이 손을 들 확률을 구하시오. [20점]

subparts:
- id: '1'
  stem: |
    위 시행에서 2명 이상의 남학생이 손을 들 확률을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac{67}{257}', equivalents: ['67/257', '134/514'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 손 든 학생 수 $k$별로 (손 든 배열 2가지)×(칸 $k+1$개에 나머지 $6-k$명 중복조합)×(나머지 성별 배열)을 더하면 전체 514, 그중 ● 2개 이상은 $60+12+2+60=134$.
    steps:
    - {id: 1a, content: '전체 $20+120+180+120+60+12+2=514$, 남학생 2명 이상 손 든 경우 $134$, 확률 $\dfrac{134}{514}=\dfrac{67}{257}$', criteria: [1.B1, 1.B8, 1.B9, 1.B10]}
    hint_ladder:
    - 손을 든 학생만 골라 차례로 적어 보자. 어떤 모양이어야 하는가?
    - 손 든 학생이 $k$명이면 손 들지 않은 학생이 들어갈 칸은 몇 개인가?
    - 남학생이 2명 이상 손을 든 경우는 손 든 학생의 배열이 어떤 것일 때인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.36~37 예시답안
    steps:
    - id: 1b-1
      content: |
        편의를 위해 손을 들지 않은 남학생과 여학생을 각각 ○와 △, 손을 든 남학생과 여학생을 각각 ●와 ▲로 표시한다. 같은 성별의 두 학생이 이웃하여 손을 들 수 없다는 조건에 의해 ●와 ▲의 배치가 매우 제한됨을 이용하여 문제를 해결한다.
      criteria: []
    - id: 1b-2
      content: |
        아무도 손을 들지 않는 경우의 수는 ○ 3개, △ 3개를 일렬로 나열하는 경우의 수와 같으므로 $\dfrac{6!}{3!3!}=20$가지이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        손을 든 학생의 수가 1명이면, ● 또는 ▲의 2가지 경우가 있다. 이때 손을 든 학생을 경계로 ∨●∨ 또는 ∨▲∨와 같이 2개의 공간이 생긴다. 2개의 공간에 나머지 5명을 구분 없이 배치하는 방법은 ${}_2\mathrm{H}_5=6$가지이다. 5명은 ○ 2명, △ 3명 또는 ○ 3명, △ 2명이므로 이들을 일렬로 나열하는 경우의 수는 $\dfrac{5!}{2!3!}=10$가지이다. 따라서 손을 든 학생의 수가 1명인 경우의 수는 $2\times6\times10=120$가지이다.
      criteria: [1.B2]
    - id: 1b-4
      content: |
        손을 든 학생의 수가 2명이면, ●▲ 또는 ▲●의 2가지 경우가 있다. 이때 손을 든 학생을 경계로 ∨●∨▲∨ 또는 ∨▲∨●∨와 같이 3개의 공간이 생긴다. 3개의 공간에 나머지 4명을 구분 없이 배치하는 방법은 ${}_3\mathrm{H}_4=15$가지이다. 4명은 ○ 2명, △ 2명이므로 이들을 일렬로 나열하는 경우의 수는 $\dfrac{4!}{2!2!}=6$가지이다. 따라서 손을 든 학생의 수가 2명인 경우의 수는 $2\times15\times6=180$가지이다.
      criteria: [1.B3]
    - id: 1b-5
      content: |
        손을 든 학생의 수가 3명이면, ●▲● 또는 ▲●▲의 2가지 경우가 있다. 이때 손을 든 학생을 경계로 4개의 공간이 생기며, 여기에 나머지 3명을 구분 없이 배치하는 방법은 ${}_4\mathrm{H}_3=20$가지이다. 3명은 ○ 1명, △ 2명 또는 ○ 2명, △ 1명이므로 이들을 일렬로 나열하는 경우의 수는 $\dfrac{3!}{1!2!}=3$가지이다. 따라서 손을 든 학생의 수가 3명인 경우의 수는 $2\times20\times3=120$가지이다.
      criteria: [1.B4]
    - id: 1b-6
      content: |
        손을 든 학생의 수가 4명이면, ●▲●▲ 또는 ▲●▲●의 2가지 경우가 있다. 이때 손을 든 학생을 경계로 5개의 공간이 생기며, 여기에 나머지 2명을 구분 없이 배치하는 방법은 ${}_5\mathrm{H}_2=15$가지이다. 2명은 ○ 1명, △ 1명이므로 이들을 일렬로 나열하는 경우의 수는 $\dfrac{2!}{1!1!}=2$가지이다. 따라서 손을 든 학생의 수가 4명인 경우의 수는 $2\times15\times2=60$가지이다. [원문 오기: 이 문장의 '4명'이 가이드북에는 '2명'으로 인쇄됨]
      criteria: [1.B5]
    - id: 1b-7
      content: |
        손을 든 학생의 수가 5명이면, ●▲●▲● 또는 ▲●▲●▲의 2가지 경우가 있다. 이때 손을 든 학생을 경계로 6개의 공간이 생기며, 여기에 나머지 1명을 배치하는 방법은 6가지이다. 따라서 손을 든 학생의 수가 5명인 경우의 수는 $2\times6=12$가지이다.
      criteria: [1.B6]
    - id: 1b-8
      content: |
        모두 손을 드는 경우의 수는 ●▲●▲●▲ 또는 ▲●▲●▲●의 2가지이다. 따라서 전체 경우의 수는 $20+120+180+120+60+12+2=514$가지이다.
      criteria: [1.B7, 1.B8]
    - id: 1b-9
      content: |
        2명 이상의 남학생이 손을 든 사건은 ●가 두 개 이상인 사건과 같다. 위의 과정에 의해 이 사건은 4명 이상의 학생이 손을 들거나 2명의 남학생과 1명의 여학생이 손을 든 사건(●▲●)과 같으며, 그 경우의 수는 $60+12+2+60=134$가지이다.
      criteria: [1.B9]
    - id: 1b-10
      content: |
        따라서 구하는 확률은 $\dfrac{134}{514}=\dfrac{67}{257}$이다.
      criteria: [1.B10]
