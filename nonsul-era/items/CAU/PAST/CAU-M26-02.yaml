stimuli:
- label: '1'
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능하고 $x=a$에서 극값을 가지면 $f'(a)=0$이다.
- label: '2'
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b\lvert f(x)-g(x)\rvert dx$$

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    정수 $a$, $b$에 대하여 $f(x)=\dfrac13x^3+ax^2+4bx$로 정의된 삼차함수 $f(x)$가 다음 조건을 만족할 때, $f(1)$의 가능한 값을 모두 구하시오. [10점]

    (가) $-3\le a\le3$, $0\le b\le3$이다.
    (나) $f(x)$의 극댓값과 극솟값의 합은 $12$이다.
  points: 10
  depends_on: []
  answer: {kind: set, value: '\dfrac{22}{3},\ \dfrac{16}{3}', equivalents: ['22/3, 16/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(\alpha)+f(\beta)=\dfrac13(\alpha^3+\beta^3)+a(\alpha^2+\beta^2)+4b(\alpha+\beta)$에 $\alpha+\beta=-2a$, $\alpha\beta=4b$를 넣으면 $a^3-6ab-9=0$.
    steps:
    - {id: 1a, content: '$b=1\Rightarrow a=3$, $b=2\Rightarrow a=-3$, $b=0$·$b=3$은 불가 ⇒ $f(1)=\dfrac{22}{3},\ \dfrac{16}{3}$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 극값을 주는 두 근을 $\alpha$, $\beta$라 하고 근과 계수의 관계를 써 보자.
    - $f(\alpha)+f(\beta)$를 $\alpha+\beta$와 $\alpha\beta$로만 나타내 보자.
    - $b$가 $0,1,2,3$일 때 정수 $a$가 있는지 하나씩 확인하자. 극값이 존재하는지도 확인하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.38 예시답안
    steps:
    - id: 1b-1
      content: |
        $f(x)$를 미분하면 $f'(x)=x^2+2ax+4b$를 얻는다. $f'(x)=x^2+2ax+4b=0$의 두 근을 $\alpha$, $\beta$라 하면($\alpha<\beta$), $x=\alpha$에서 극대, $x=\beta$에서 극소를 갖는다. 근과 계수의 관계에서 $\alpha+\beta=-2a$, $\alpha\beta=4b$를 얻는다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        극댓값 $f(\alpha)=\dfrac13\alpha^3+a\alpha^2+4b\alpha$, 극솟값 $f(\beta)=\dfrac13\beta^3+a\beta^2+4b\beta$이므로,
        $f(\alpha)+f(\beta)=\dfrac13(\alpha^3+\beta^3)+a(\alpha^2+\beta^2)+4b(\alpha+\beta)=12$를 얻는다.
        $\alpha^3+\beta^3=(\alpha+\beta)^3-3\alpha\beta(\alpha+\beta)$, $\alpha^2+\beta^2=(\alpha+\beta)^2-2\alpha\beta$이므로 위의 식을 정리하면 $a^3-6ab-9=0$을 얻는다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $b=0$일 때, $a^3=9$이므로 가능한 정수 $a$는 없다.
        $b=1$일 때, $a^3-6a-9=(a-3)(a^2+3a+3)=0$이므로, $a=3$,
        $b=2$일 때, $a^3-12a-9=(a+3)(a^2-3a-3)=0$이므로, $a=-3$이다.
        $b=3$일 때, $f'(x)=x^2+2ax+4b=0$에서 주어진 $a$, $b$에 대하여 $D/4=a^2-4b\le0$이므로 극대와 극소가 존재하지 않는다.
      criteria: [1.B3]
    - id: 1b-4
      content: |
        따라서, $f(x)=\dfrac13x^3+3x^2+4x$ 또는 $\dfrac13x^3-3x^2+8x$이고, $f(1)=\dfrac{22}{3}$ 또는 $\dfrac{16}{3}$이다.
      criteria: [1.B3]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2026 논술가이드북(자연) p.38~39 별해
    key_idea: 극점 $x=-a\pm\sqrt{a^2-4b}$를 직접 대입해 $f(-a-\sqrt{a^2-4b})+f(-a+\sqrt{a^2-4b})=\dfrac43a^3-8ab$를 얻는다.
    steps:
    - id: 1c-1
      content: |
        $f(x)$를 미분하면 $f'(x)=x^2+2ax+4b$를 얻는다. 극대와 극소가 존재하므로 $D/4=a^2-4b>0$이다. 따라서, $b=0$일 때, $a=0,\ \pm1,\ \pm2,\ \pm3$, $b=1$일 때, $a=\pm3$, $b=2$일 때, $a=\pm3$, $b=3$일 때, 가능한 $a$는 없다. [원문 그대로 — $a=0$은 $D/4=0$이므로 엄밀히는 제외되어야 함]
        $f'(x)=x^2+2ax+4b=0$인 $x=-a\pm\sqrt{a^2-4b}$이므로 극댓값과 극솟값은 각각
        $f(-a-\sqrt{a^2-4b})=-\dfrac13(a+\sqrt{a^2-4b})^3+a(a+\sqrt{a^2-4b})^2-4b(a+\sqrt{a^2-4b})$,
        $f(-a+\sqrt{a^2-4b})=-\dfrac13(a-\sqrt{a^2-4b})^3+a(a-\sqrt{a^2-4b})^2-4b(a-\sqrt{a^2-4b})$이다.
      criteria: [1.B1]
    - id: 1c-2
      content: |
        $f(-a-\sqrt{a^2-4b})+f(-a+\sqrt{a^2-4b})=-\dfrac13(2a^3+6a(a^2-4b))+a(2a^2+2(a^2-4b))-8ab=\dfrac43a^3-8ab=12$이다.
      criteria: [1.B2]
    - id: 1c-3
      content: |
        $b=0$일 때, $a^3=9$이므로 가능한 정수 $a$는 없다. $b=1$일 때, $a^3-6a-9=(a-3)(a^2+3a+3)=0$이므로, $a=3$, $b=2$일 때, $a^3-12a-9=(a+3)(a^2-3a-3)=0$이므로, $a=-3$이다. 따라서, $f(x)=\dfrac13x^3+3x^2+4x$ 또는 $\dfrac13x^3-3x^2+8x$이고, $f(1)=\dfrac{22}{3}$ 또는 $\dfrac{16}{3}$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: 근과 계수의 관계 $\alpha+\beta=-2a$, $\alpha\beta=4b$를 구했다(별해는 극점 $x=-a\pm\sqrt{a^2-4b}$를 구했다).
      depends_on: []
      steps: [1b-1, 1c-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: $a^3-6ab-9=0$을 구했다(별해는 $f(\cdot)+f(\cdot)=\dfrac43a^3-8ab$를 구했다).
      depends_on: []
      steps: [1b-2, 1c-2]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: $f(1)=\dfrac{22}{3}$ 또는 $\dfrac{16}{3}$을 구했다.
      depends_on: []
      steps: [1b-3, 1b-4, 1c-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4652}
  misconceptions:
  - id: MC-CAL-4652
    outcome_code: '70'
    wrong_work: '$b=3$일 때 $a^3-18a-9=0$의 정수해만 따지거나, 극값이 없는 $(a,b)$에도 근과 계수 관계식을 그대로 적용함'
    detect_cue: $D/4=a^2-4b>0$ 확인이 답안에 없음
    feedback: 극댓값과 극솟값이 존재하려면 $f'(x)=0$이 서로 다른 두 실근을 가져야 합니다. 판별식을 먼저 확인하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    실수 전체의 집합에서 정의된 함수 $f(x)$가 닫힌구간 $[0,2]$에서
    $$f(x)=x\sin(\pi x)$$
    이고, 모든 실수 $x$에 대하여 $f(x)=2f(x-2)$를 만족한다. 이때, 곡선 $y=f(x)$와 직선 $y=2^{1012}(x-2026)$ 및 두 직선 $x=2026$, $x=2027$로 둘러싸인 도형의 넓이는 유리수 $p$, $q$, $r$에 대하여 $2^{1012}\left(p+\dfrac{q}{\pi}+\dfrac{r\sqrt3}{\pi}\right)$이다. 유리수 $p$, $q$, $r$을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: 'p=-\dfrac16,\ q=-2,\ r=2', equivalents: ['p=-1/6, q=-2, r=2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $S=2^{1012}\int_0^1\lvert x-2x\sin\pi x\rvert dx$, 부호 변화점 $\dfrac16$, $\dfrac56$, 그리고 $x\to1-x$ 대칭으로 $\left[\dfrac56,1\right]$ 구간을 $\left[0,\dfrac16\right]$로 옮긴다.
    steps:
    - {id: 2a, content: '$S=2^{1012}\left(-\dfrac16-\dfrac2\pi+\dfrac{2\sqrt3}{\pi}\right)$ ⇒ $p=-\dfrac16$, $q=-2$, $r=2$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - $f(x)=2f(x-2)$를 여러 번 쓰면 $[2026,2028]$에서 $f(x)$는 어떤 식인가?
    - $x-2026$을 새 변수로 두면 적분 구간은 $[0,1]$이 된다. 절댓값 안의 부호는 어디서 바뀌는가?
    - $\int x\sin\pi x\,dx$는 부분적분으로 구한다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.39~40 예시답안
    steps:
    - id: 2b-1
      content: |
        주어진 식에 의하여 구간 $[2026,\ 2028]$에서 $f(x)=2^{1013}(x-2026)\sin\pi(x-2026)$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        따라서, 구하는 넓이 $S$는
        $$S=\int_{2026}^{2027}\lvert 2^{1012}(x-2026)-2^{1013}(x-2026)\sin\pi(x-2026)\rvert dx=\int_0^1\lvert 2^{1012}x-2^{1013}x\sin\pi x\rvert dx$$
        이다. 절댓값 함수의 부호가 바뀌는 점은 $\sin\pi x=\dfrac12$이므로, $x=\dfrac16,\ \dfrac56$이다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        따라서,
        $$S=2^{1012}\left(\int_0^{\frac16}(x-2x\sin\pi x)dx+\int_{\frac56}^1(x-2x\sin\pi x)dx+\int_{\frac16}^{\frac56}(2x\sin\pi x-x)dx\right)\quad\cdots(*)$$
      criteria: [2.B2]
    - id: 2b-4
      content: |
        부정적분 $\int x\sin\pi x\,dx=-\dfrac1\pi x\cos\pi x+\dfrac{1}{\pi^2}\sin\pi x+C$이고, 치환적분에 의해
        $\int_{\frac56}^1(x-2x\sin\pi x)dx=\int_0^{\frac16}\{(1-x)-2(1-x)\sin\pi x\}dx$이므로,
        $$S=2^{1012}\left(\int_0^{\frac16}(1-2\sin\pi x)dx+\int_{\frac16}^{\frac56}(2x\sin\pi x-x)dx\right)$$
        $$=2^{1012}\left\{\left[x+\dfrac2\pi\cos\pi x\right]_0^{\frac16}+\left[-\dfrac2\pi x\cos\pi x+\dfrac{2}{\pi^2}\sin\pi x-\dfrac{x^2}{2}\right]_{\frac16}^{\frac56}\right\}$$
        $$=2^{1012}\left(\dfrac16+\dfrac{\sqrt3}{\pi}-\dfrac2\pi+\dfrac{\sqrt3}{\pi}-\dfrac13\right)=2^{1012}\left(-\dfrac16-\dfrac2\pi+\dfrac{2\sqrt3}{\pi}\right)$$
        이다. 따라서, $p=-\dfrac16$, $q=-2$, $r=2$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: 구간 $[2026,2028]$에서 $f(x)=2^{1013}(x-2026)\sin\pi(x-2026)$을 얻었다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: 부호가 바뀌는 점 $x=\dfrac16$, $\dfrac56$을 얻고 구간을 나누어 $S$를 (*)와 같이 세웠다.
      depends_on: []
      steps: [2b-2, 2b-3]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: 적분 계산을 정확히 하여 $p=-\dfrac16$, $q=-2$, $r=2$를 얻었다.
      depends_on: []
      steps: [2b-4]
