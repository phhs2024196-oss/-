stimuli:
- label: '1'
  body: |
    음함수 표현 $f(x,y)=0$에서 $y$를 $x$의 함수로 보고 양변을 $x$에 대하여 미분하여 $\dfrac{dy}{dx}$를 구한다.
- label: '2'
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고 $x=a$의 좌우에서 $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    음함수 표현 $\ln x+\ln y+\ln(5-x-y)=0$에 대하여 $x=a$에서 $\dfrac{dy}{dx}=-1$이 된다. $a$의 가능한 값을 모두 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: set, value: '\dfrac12,\ 1+\sqrt2', equivalents: ['1/2, 1+sqrt(2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $xy(5-x-y)=1$을 미분해 $\dfrac{dy}{dx}=\dfrac{y(2x+y-5)}{x(5-x-2y)}=-1$ ⇒ $(y-x)(x+y-5)=0$ ⇒ $y=x$ ⇒ $2x^3-5x^2+1=0$.
    steps:
    - {id: 1a, content: '$(2x-1)(x^2-2x-1)=0$, 정의역에서 $a=\dfrac12,\ 1+\sqrt2$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 로그 세 개의 합을 한 로그로 묶어 보자. 정의역도 적어 두자.
    - $\dfrac{dy}{dx}=-1$을 정리하면 인수분해가 된다.
    - 정의역 조건 $5-x-y>0$으로 버릴 인수는 무엇인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.41 예시답안
    steps:
    - id: 1b-1
      content: |
        로그함수가 정의되기 위하여 $x>0$, $y>0$, $5-x-y>0$이다. 또한 로그함수의 성질에 의하여 $xy(5-x-y)=1$이다. 음함수 미분을 하고 조건을 고려하면
        $$\dfrac{dy}{dx}=\dfrac{y(2x+y-5)}{x(5-x-2y)}=-1$$
        이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        정리하면 $(y-x)(x+y-5)=0$이고 $y-x=0$이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $xy(5-x-y)=1$에 대입하면 $2x^3-5x^2+1=(2x-1)(x^2-2x-1)=0$이다. 가능한 값은 $a=\dfrac12,\ 1+\sqrt2$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: $\dfrac{dy}{dx}=\dfrac{y(2x+y-5)}{x(5-x-2y)}$를 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: $y-x=0$을 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: $a=\dfrac12,\ 1+\sqrt2$를 얻었다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4655}
  misconceptions:
  - id: MC-CAL-4655
    outcome_code: '70'
    wrong_work: '$x^2-2x-1=0$의 두 근을 모두 답으로 써서 $a=1-\sqrt2$를 포함하거나, $x+y=5$인 경우를 남겨 둠'
    detect_cue: 답에 $1-\sqrt2$가 있거나 정의역 $x>0$, $5-x-y>0$ 언급이 없음
    feedback: 로그의 진수는 모두 양수여야 합니다. $x>0$, $y>0$, $5-x-y>0$으로 해를 걸러내세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    닫힌구간 $\left[-\dfrac\pi2,\dfrac\pi2\right]$에서 함수 $f(x)=\sin x(\sin x+2\cos x)$의 최댓값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{1+\sqrt5}{2}', equivalents: ['(1+sqrt(5))/2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=2\cos^2x(-\tan^2x+\tan x+1)$, $\tan x=\dfrac{1+\sqrt5}{2}$에서 극대이고 그 값 $\dfrac{1+\sqrt5}{2}$가 끝값 1보다 크다.
    steps:
    - {id: 2a, content: '극댓값 $\dfrac{1+\sqrt5}{2}>1=f\left(\pm\dfrac\pi2\right)$ ⇒ 최댓값 $\dfrac{1+\sqrt5}{2}$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 구간 내부에서 $\cos x>0$이다. 도함수를 $\cos^2x$로 묶어 보자.
    - $\tan x=u$로 두면 도함수의 부호는 $u$의 이차식으로 정해진다.
    - 극댓값과 끝값을 비교하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.41 예시답안
    steps:
    - id: 2b-1
      content: |
        $f\left(-\dfrac\pi2\right)=f\left(\dfrac\pi2\right)=1$이고, 구간 $-\dfrac\pi2<x<\dfrac\pi2$에서 $\cos x>0$이다. 미분하면
        $$f'(x)=2\sin x\cos x+2\cos^2x-2\sin^2x=2\cos^2x(-\tan^2x+\tan x+1)$$
        이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $f(x)$는 $\tan x=\dfrac{1-\sqrt5}{2}$에서 극소, $\tan x=\dfrac{1+\sqrt5}{2}$에서 극대이다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        $\tan x=\dfrac{1+\sqrt5}{2}$에서 최댓값 $\dfrac{1+\sqrt5}{2}$를 갖는다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 8
      evidence: $f'(x)=2\cos^2x(-\tan^2x+\tan x+1)$를 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: $\tan x=\dfrac{1+\sqrt5}{2}$에서 극대임을 구했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 4
      evidence: 최댓값 $\dfrac{1+\sqrt5}{2}$를 구했다.
      depends_on: []
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4656}
  misconceptions:
  - id: MC-CAL-4656
    outcome_code: '70'
    wrong_work: 극댓값을 구한 뒤 끝값 $f\left(\pm\dfrac\pi2\right)=1$과 비교하지 않고 바로 최댓값이라 함(또는 극값을 찾지 않고 끝값 1을 최댓값으로 답함)
    detect_cue: 끝값 언급 없음, 또는 답이 1
    feedback: 닫힌구간의 최댓값은 극댓값들과 양 끝값을 모두 비교해 정합니다.
    remedy: [RL-2]

