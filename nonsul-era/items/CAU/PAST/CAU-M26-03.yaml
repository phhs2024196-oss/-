intent: '(3-1) 음함수 미분법을 적절히 계산하고 얻은 정보로 삼차방정식의 근을 구할 수 있는지, (3-2) 삼각함수의 미분으로 주어진 구간에서 함수의 최댓값을 구할 수 있는지 본다(가이드북 출제 의도 요지).'
key_idea: '(3-1) 로그 조건을 $xy(5-x-y)=1$로 바꾸고 $\dfrac{dy}{dx}=-1$에서 $(y-x)(x+y-5)=0$을 얻어 $y=x$로 좁힌다; (3-2) $f''(x)=2\cos^2x(-\tan^2x+\tan x+1)$로 정리해 $\tan x$의 이차식 부호를 본다.'
stuck: '(3-1) $\dfrac{dy}{dx}=-1$ 조건을 인수분해해 $x+y-5=0$을 정의역 조건으로 버리는 단계 / (3-2) 도함수를 $\cos^2x$로 묶어 $\tan x$의 식으로 바꾸는 단계'
idea_tags: [IDEA-IMPLICIT-DIFF-FACTOR, IDEA-TAN-QUADRATIC-SIGN]
tags: [음함수 미분, 로그함수, 삼각함수 최대, 중앙대 모의]
