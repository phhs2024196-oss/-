  - '조건 $\dfrac{dy}{dx}=-1$'
  - '$f(x)=\sin x(\sin x+2\cos x)$, 닫힌구간 $\left[-\dfrac\pi2,\dfrac\pi2\right]$'
  concepts: [음함수의 미분법, 로그함수의 정의역, 삼차방정식의 인수분해, 삼각함수의 도함수, 극대·극소, 최댓값]
  tools:
  - 로그의 성질로 곱의 꼴로 정리
  - 음함수 미분 후 인수분해
  - 정의역 조건으로 해 걸러내기
  - 도함수를 $2\cos^2x$로 묶어 $\tan x$의 이차식으로 바꾸기
  - 끝값과 극값 비교
  conditions:
  - '로그가 정의됨 ⇒ $x>0$, $y>0$, $5-x-y>0$ ⇒ $x+y-5=0$인 경우와 $1-\sqrt2$는 제외'
  - '$\dfrac{dy}{dx}=-1$ ⇒ $(y-x)(x+y-5)=0$ ⇒ $y=x$'
  - '$-\dfrac\pi2<x<\dfrac\pi2$에서 $\cos x>0$ ⇒ $f''(x)$의 부호는 $-\tan^2x+\tan x+1$의 부호'
  - '닫힌구간 ⇒ 끝값 $f\left(\pm\dfrac\pi2\right)=1$과 극댓값 비교'
  stimuli_used: ['1', '2']
  subpart_links: 3-1과 3-2는 제시문만 공유하고 결과는 서로 독립이다(3-1은 제시문 1, 3-2는 제시문 2 사용).

