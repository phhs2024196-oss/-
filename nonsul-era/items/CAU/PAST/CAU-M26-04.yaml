stimuli:
- label: '1'
  body: |
    두 벡터 $\vec a$, $\vec b$의 크기와 방향이 각각 같을 때, 두 벡터 $\vec a$, $\vec b$는 서로 같다고 하며, 이것을 기호로 $\vec a=\vec b$와 같이 나타낸다.
- label: '2'
  body: |
    두 벡터 $\vec a$, $\vec b$에 대하여 $\vec a=\overrightarrow{AB}$, $\vec b=\overrightarrow{BC}$일 때, $\vec a+\vec b=\overrightarrow{AB}+\overrightarrow{BC}=\overrightarrow{AC}$이다.
- label: '3'
  body: |
    포물선 $x^2=4py$ 위의 점 $\mathrm{P}(x_1,y_1)$에서의 접선의 방정식은 $x_1x=2p(y+y_1)$이다.

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    그림과 같이 한 변의 길이가 $2$인 정육각형 ABCDEF에서 변 EF의 중점을 M이라 하자. 선분 AM 위를 움직이는 점 P와 변 BC 위를 움직이는 점 Q에 대하여 $\lvert\overrightarrow{AP}+\overrightarrow{EQ}\rvert$의 최솟값과 최댓값의 합을 구하시오. [15점]

    [그림] 정육각형의 꼭짓점이 A(왼쪽), B·C(아래 변, 왼쪽부터), D(오른쪽), E·F(위 변, 오른쪽부터) 순서로 놓여 있고, 위 변 FE의 중점이 M이다. 선분 AM 위에 점 P, 변 BC 위에 점 Q가 있고, 화살표 $\overrightarrow{AP}$와 $\overrightarrow{EQ}$가 그려져 있다.
  points: 15
  depends_on: []
  answer: {kind: value, value: '4+\sqrt3', equivalents: ['4+sqrt(3)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{AP}+\overrightarrow{EQ}=\overrightarrow{P'Q'}$ (P를 A에 대해 대칭, $\overrightarrow{EQ}$를 시점 A로 평행이동)로 바꾸고 좌표로 $\lvert\overrightarrow{P'Q'}\rvert=\sqrt{4(s-t)^2+3(1+s)^2}$.
    steps:
    - {id: 1a, content: '최솟값 $\sqrt3$($s=t=0$), 최댓값 $4$($s=1$, $t=0$), 합 $4+\sqrt3$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - $\overrightarrow{EQ}$를 시점이 A가 되도록 평행이동해 보자.
    - $\overrightarrow{AP}$를 A에 대하여 뒤집은 벡터를 생각하면 두 벡터의 합이 한 벡터가 된다.
    - 좌표를 잡고 두 움직이는 점을 내분 비율로 나타내자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.42 예시답안
    steps:
    - id: 1b-1
      content: |
        그림과 같이 점 P, M을 점 A에 대하여 대칭 이동한 점을 각각 P′, M′이라고 하자. 벡터 $\overrightarrow{EQ}$를 평행이동하여 시점이 점 A에 놓이도록 하였을 때, 종점을 Q′이라고 하자. $\overrightarrow{AP'}=-\overrightarrow{AP}$이므로
        $$\overrightarrow{AP}+\overrightarrow{EQ}=\overrightarrow{AP}+\overrightarrow{AQ'}=\overrightarrow{AP}+\overrightarrow{AP'}+\overrightarrow{P'Q'}=\overrightarrow{P'Q'}$$
        따라서 $\lvert\overrightarrow{AP}+\overrightarrow{EQ}\rvert=\lvert\overrightarrow{P'Q'}\rvert$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $\overline{B'C'}=2$, $\overline{M'B'}=\sqrt3$, $\overline{AC'}=2\sqrt3$이므로 좌표평면에 네 점 B′, C′, A, M′을 점 $(0,0)$, $(2,0)$, $(2,2\sqrt3)$, $(0,\sqrt3)$이 되도록 놓을 수 있다. 이때, 점 P′과 점 Q′이 선분 M′A와 선분 B′C′을 각각 $s:1-s\ (0\le s\le1)$과 $t:1-t\ (0\le t\le1)$로 내분한다고 하면, 점 P′과 점 Q′의 좌표는 각각 $(2s,\ \sqrt3(1+s))$와 $(2t,\ 0)$이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $\lvert\overrightarrow{P'Q'}\rvert=\sqrt{4(s-t)^2+3(1+s)^2}$에서 $0\le s\le1$, $0\le t\le1$이므로 $\lvert\overrightarrow{P'Q'}\rvert$의 최솟값은 $s=t=0$일 때 $\sqrt3$이고,
      criteria: [1.B2]
    - id: 1b-4
      content: |
        최댓값은 $s=1$, $t=0$일 때 $4$이다. 따라서 $\lvert\overrightarrow{AP}+\overrightarrow{EQ}\rvert$의 최솟값과 최댓값의 합은 $4+\sqrt3$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: $\lvert\overrightarrow{AP}+\overrightarrow{EQ}\rvert=\lvert\overrightarrow{P'Q'}\rvert$(또는 같은 뜻의 한 벡터 표현)를 얻었다.
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: $\lvert\overrightarrow{AP}+\overrightarrow{EQ}\rvert$의 최솟값 $\sqrt3$을 얻었다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: $\lvert\overrightarrow{AP}+\overrightarrow{EQ}\rvert$의 최댓값 $4$를 얻었다(공식 채점기준에는 '최솟값 4'로 인쇄 — 최댓값의 오기).
      depends_on: []
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4657}
  misconceptions:
  - id: MC-GEO-4657
    outcome_code: '70'
    wrong_work: '$\lvert\overrightarrow{AP}+\overrightarrow{EQ}\rvert=\lvert\overrightarrow{AP}\rvert+\lvert\overrightarrow{EQ}\rvert$로 놓고 각 크기의 최솟값·최댓값을 더함'
    detect_cue: 두 크기를 따로 최소·최대로 구한 흔적, 방향 고려 없음
    feedback: 벡터의 합의 크기는 두 벡터의 방향에 따라 달라집니다. 평행이동으로 두 벡터를 이어 붙여 한 벡터로 만든 뒤 크기를 구하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    그림과 같이 중심이 $y$축에 놓인 원 $C_1$과 $x$축에 접하는 원 $C_2$가 점 $\mathrm{P}(t,t^2)$에서 포물선 $y=x^2$에 접한다. 원 $C_1$의 반지름의 길이가 원 $C_2$의 반지름의 길이의 두 배일 때, 두 원 $C_1$, $C_2$와 $x$축, $y$축으로 둘러싸인 영역의 넓이를 구하시오. (단, $t>0$이다.) [15점]

    [그림] 원 $C_1$은 포물선 $y=x^2$의 안쪽(위쪽)에서 점 P에 접하고, 원 $C_2$는 포물선의 바깥쪽(오른쪽 아래)에서 점 P에 접하며 $x$축에 접한다. 두 원, $x$축, $y$축으로 둘러싸인 영역(원점 O 근처)이 색칠되어 있다.
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{21}{32}\sqrt3-\dfrac\pi4', equivalents: ['21*sqrt(3)/32 - pi/4'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 법선 $y=-\dfrac{1}{2t}(x-t)+t^2$ 위에 $\mathrm{O_1}\left(0,t^2+\dfrac12\right)$, 반지름 비로 $\mathrm{O_2}\left(\dfrac{3t}{2},t^2-\dfrac14\right)$, $x$축 접함에서 $t=\dfrac{\sqrt3}{2}$; (사다리꼴 $\mathrm{OQO_2O_1}$) − (부채꼴 2개).
    steps:
    - {id: 2a, content: '$\dfrac{21}{32}\sqrt3-\dfrac\pi6-\dfrac\pi{12}=\dfrac{21}{32}\sqrt3-\dfrac\pi4$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 원이 곡선에 접하면 원의 중심은 접점에서의 법선 위에 있다.
    - 두 원의 중심과 P가 한 직선 위에 있고 반지름 비가 $2:1$이다. 닮음을 이용해 $\mathrm{O_2}$의 좌표를 $t$로 나타내자.
    - 구하는 영역을 사다리꼴에서 두 부채꼴을 뺀 것으로 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 논술가이드북(자연) p.42~43 예시답안
    steps:
    - id: 2b-1
      content: |
        좌표평면의 원점을 O, 원 $C_i\ (i=1,2)$의 중심을 $\mathrm{O}_i$, 점 $\mathrm{O_2}$에서 $x$축에 내린 수선의 발을 Q, 점 P에서의 포물선 $y=x^2$의 접선 $y=2tx-t^2$이 $y$축, $x$축과 만나는 점을 각각 R, S, 선분 $\mathrm{OO_1}$이 원 $C_1$과 만나는 점을 T, 점 P에서 직선 $\mathrm{O_2Q}$와 $y$축에 내린 수선의 발을 각각 U, V라고 하고, $\theta=\angle\mathrm{PSQ}$라고 하자.
      criteria: []
    - id: 2b-2
      content: |
        직선 $\mathrm{O_1O_2}$의 방정식 $y=-\dfrac{1}{2t}(x-t)+t^2$에서 $y$절편을 구하여 $\mathrm{O_1}$의 좌표 $\left(0,\ t^2+\dfrac12\right)$를 얻는다.
        $\overline{PU}=\dfrac12\times\overline{VP}=\dfrac t2$, $\overline{O_2U}=\dfrac12\times\overline{O_1V}=\dfrac12\times\left(\overline{O_1O}-\overline{VO}\right)=\dfrac14$에서 $\mathrm{O_2}$의 좌표는 $\left(\dfrac{3t}{2},\ t^2-\dfrac14\right)$임을 알 수 있다.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        $t^2-\dfrac14=\overline{O_2Q}=\overline{O_2P}=\sqrt{\left(\dfrac{3t}{2}-t\right)^2+\left(t^2-\dfrac14-t^2\right)^2}$에서 $t=\dfrac{\sqrt3}{2}$이고, $\tan\theta=2t$이므로 $\theta=\dfrac\pi3$이다.
      criteria: [2.B1]
    - id: 2b-4
      content: |
        $\angle\mathrm{PO_2Q}=\pi-\theta=\dfrac{2\pi}{3}$이고 $\overline{O_2Q}=\dfrac12$이어서 부채꼴 $\mathrm{O_2PQ}$의 넓이는 $\dfrac{\pi}{12}$이고,
        $\angle\mathrm{RO_1P}=\angle\mathrm{RSO}=\theta=\dfrac\pi3$이고 $\overline{O_1P}=2\overline{O_2Q}=1$이어서 부채꼴 $\mathrm{O_1TP}$의 넓이는 $\dfrac\pi6$이다.
      criteria: [2.B2]
    - id: 2b-5
      content: |
        사다리꼴 $\mathrm{OQO_2O_1}$의 넓이는 $\dfrac12\times\left(\overline{OO_1}+\overline{O_2Q}\right)\times\overline{OQ}=\dfrac12\times\left(\dfrac54+\dfrac12\right)\times\dfrac{3\sqrt3}{4}=\dfrac{21}{32}\sqrt3$이므로
        두 원 $C_1$, $C_2$와 $x$축, $y$축으로 둘러싸인 영역의 넓이는 $\dfrac{21}{32}\sqrt3-\dfrac\pi6-\dfrac\pi{12}=\dfrac{21}{32}\sqrt3-\dfrac\pi4$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: $t=\dfrac{\sqrt3}{2}$를 구했다.
      depends_on: []
      steps: [2b-2, 2b-3]
    - id: 2.B2
      mark_type: B
      points: 6
      evidence: 부채꼴 $\mathrm{O_2PQ}$의 넓이 $\dfrac{\pi}{12}$와 부채꼴 $\mathrm{O_1TP}$의 넓이 $\dfrac\pi6$을 구했다.
      depends_on: []
      steps: [2b-4]
    - id: 2.B3
      mark_type: B
      points: 4
      evidence: 영역의 넓이 $\dfrac{21}{32}\sqrt3-\dfrac\pi4$를 구했다.
      depends_on: []
      steps: [2b-5]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀려도 1~2점 부분 점수(공식 주석)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4658}
  misconceptions:
  - id: MC-GEO-4658
