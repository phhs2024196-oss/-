intent: '(4-1) 벡터가 크기와 방향을 함께 가지는 양임을 이해하고 두 벡터의 합을 활용해 문제를 해결할 수 있는지, (4-2) 포물선의 접선 방정식을 활용하는 능력을 본다(가이드북 출제 의도 요지).'
key_idea: '(4-1) $\overrightarrow{AP}$를 점 A에 대해 대칭이동한 $\overrightarrow{AP''}=-\overrightarrow{AP}$와 평행이동한 $\overrightarrow{AQ''}=\overrightarrow{EQ}$로 $\overrightarrow{AP}+\overrightarrow{EQ}=\overrightarrow{P''Q''}$를 만든다; (4-2) 접점 P에서의 법선 위에 두 원의 중심이 있고, 반지름 비 $2:1$로 $\mathrm{O_2}$의 좌표를 정해 $t$를 구한 뒤 사다리꼴에서 두 부채꼴을 뺀다.'
stuck: '(4-1) 두 벡터의 합을 한 벡터 $\overrightarrow{P''Q''}$로 바꾸는 작도 / (4-2) 두 원의 중심과 접점 P가 한 직선(법선) 위에 있음을 쓰는 단계'
idea_tags: [IDEA-VECTOR-REFLECT-TRANSLATE, IDEA-COMMON-NORMAL-TANGENT-CIRCLES]
tags: [벡터의 덧셈, 정육각형, 포물선의 접선, 부채꼴, 중앙대 모의]
elements:
  materials:
  - 한 변의 길이가 2인 정육각형 ABCDEF, 변 EF의 중점 M
  - 선분 AM 위의 점 P, 변 BC 위의 점 Q
  - '포물선 $y=x^2$, 중심이 $y$축 위의 원 $C_1$, $x$축에 접하는 원 $C_2$, 접점 $\mathrm{P}(t,t^2)$'
  concepts: [벡터의 상등, 벡터의 덧셈, 벡터의 크기, 포물선의 접선, 원의 접선과 법선, 부채꼴의 넓이]
  tools:
  - 점에 대한 대칭이동과 평행이동으로 벡터 합을 한 벡터로 바꾸기
  - 좌표 도입과 내분점 매개화
  - 거리의 제곱식을 $s$, $t$의 범위에서 최소·최대
  - 포물선의 접선 $y=2tx-t^2$과 법선
  - 닮음비(반지름 $2:1$)로 중심 좌표 구하기
  - 사다리꼴 넓이에서 부채꼴 넓이 빼기
  conditions:
  - '$\vec a=\vec b$ ⇔ 크기·방향이 같음 ⇒ 평행이동한 벡터는 같은 벡터'
  - '$\overrightarrow{AP''}=-\overrightarrow{AP}$ ⇒ $\overrightarrow{AP}+\overrightarrow{EQ}=\overrightarrow{AP}+\overrightarrow{AP''}+\overrightarrow{P''Q''}=\overrightarrow{P''Q''}$'
  - '$0\le s\le1$, $0\le t\le1$ ⇒ $\lvert\overrightarrow{P''Q''}\rvert=\sqrt{4(s-t)^2+3(1+s)^2}$의 최솟값 $\sqrt3$(s=t=0), 최댓값 4(s=1, t=0)'
  - '$C_1$, $C_2$가 P에서 포물선에 접함 ⇒ 두 중심 $\mathrm{O_1}$, $\mathrm{O_2}$가 P에서의 법선 위'
  - '$C_1$의 반지름이 $C_2$의 두 배 ⇒ $\overline{PU}=\dfrac12\overline{VP}$, $\overline{O_2U}=\dfrac12\overline{O_1V}$'
  - '$C_2$가 $x$축에 접함 ⇒ $\mathrm{O_2}$의 $y$좌표 = 반지름 ⇒ $t=\dfrac{\sqrt3}{2}$'
  stimuli_used: ['1', '2', '3']
  subpart_links: 4-1과 4-2는 제시문만 공유하고 결과는 서로 독립이다(4-1은 제시문 1·2, 4-2는 제시문 3 사용).

