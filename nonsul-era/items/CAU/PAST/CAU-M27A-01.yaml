  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-4701}
  - {code: '71', misconception: MC-PRB-4702}
  misconceptions:
  - id: MC-PRB-4701
    outcome_code: '70'
    wrong_work: 무승부 후 재시행을 고려하지 않고 '갑이 이길 확률 = 1/2' 같은 식을 세우거나, 무승부 확률을 한쪽에만 나눠 붙임
    detect_cue: 식이 $p=\dfrac12$ 또는 $p+r=q$ 꼴, 답이 $(11,6),(12,1)$이 아님
    feedback: 무승부면 같은 게임이 반복되므로 최종 승리 확률은 $\dfrac{p}{1-r}$, $\dfrac{q}{1-r}$입니다. 두 값이 같을 조건은 $p=q$입니다.
    remedy: [RL-1]
  - id: MC-PRB-4702
    outcome_code: '71'
    wrong_work: 을이 이기는 경우의 수를 셀 때 제거된 카드 $k$의 몫 $k-1$을 빼지 않아 $55$로 셈
    detect_cue: 을의 승리 확률이 $\dfrac{55}{10n}$ 꼴로 $k$가 없음
    feedback: 을은 $k$가 적힌 카드를 꺼낼 수 없으므로 $y=k$일 때의 $k-1$가지를 빼야 합니다.
    remedy: [RL-2]

