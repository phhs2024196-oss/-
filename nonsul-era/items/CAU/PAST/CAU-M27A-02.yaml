key_idea: '$\overline{\mathrm{PA}}\times\overline{\mathrm{PB}}=1$을 제곱해 $y^2$에 대한 이차식으로 보고 $y^2=\sqrt{4x^2+1}-x^2-1$로 정리한 뒤 미분·적분한다.'
