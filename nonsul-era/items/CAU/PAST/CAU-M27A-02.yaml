  - '음함수 미분'
  - '$4x^2+1=t$ 치환'
  conditions:
  - '$\overline{\mathrm{PA}}\times\overline{\mathrm{PB}}=1$ ⇒ $((x-1)^2+y^2)((x+1)^2+y^2)=1$ ⇒ $(y^2+x^2+1)^2=4x^2+1$'
  - '$x>0$, $y>0$ ⇒ $y^2=\sqrt{4x^2+1}-x^2-1$ (양의 제곱근), $y=\sqrt{y^2}$'
  - '$\dfrac{dy}{dx}=0$ ⇒ $\dfrac{2a}{\sqrt{4a^2+1}}=a$ ⇒ $a=\dfrac{\sqrt3}{2}$, $b=\dfrac12$'
  - '[문제 2-2]의 적분 하한 $a$는 [문제 2-1]의 값 ⇒ $\int_{\sqrt3/2}^{1}xy^2\,dx$'
