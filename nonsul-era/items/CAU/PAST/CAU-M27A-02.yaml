stimuli:
- label: '1'
  body: |
    음함수 표현 $f(x,y)=0$에서 $y$를 $x$에 대한 함수로 보고 각 항을 $x$에 대하여 미분하여 $\dfrac{dy}{dx}$를 구한다.
- label: '2'
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가, $a=g(\alpha)$, $b=g(\beta)$일 때 $\alpha$, $\beta$를 포함하는 구간에서 연속이면 다음 식이 성립한다.
    $$\int_a^b f(x)dx=\int_\alpha^\beta f(g(t))g'(t)dt$$

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

  좌표평면 위의 두 점 $\mathrm{A}(-1,0)$, $\mathrm{B}(1,0)$에 대하여 점 $\mathrm{P}(x,y)$가 음함수 표현 $\overline{\mathrm{PA}}\times\overline{\mathrm{PB}}=1$을 만족시킨다. (단, $x>0$이고 $y>0$이다.) 이를 바탕으로 [문제 2-1], [문제 2-2]를 풀이하시오.

subparts:
- id: '1'
  stem: |
    [문제 2-1] (12점) $\dfrac{dy}{dx}$를 구하고, $(x,y)=(a,b)$에서 $\dfrac{dy}{dx}=0$이 되게 하는 $a$, $b$를 구하시오.
  points: 12
  depends_on: []
  answer: {kind: expression, value: '\dfrac{dy}{dx}=\dfrac1y\left(\dfrac{2x}{\sqrt{4x^2+1}}-x\right),\ a=\dfrac{\sqrt3}{2},\ b=\dfrac12', equivalents: ['a=sqrt(3)/2, b=1/2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 제곱하면 $(y^2+x^2+1)^2=4x^2+1$, 따라서 $y^2=\sqrt{4x^2+1}-x^2-1$. 미분하면 $2yy'=\dfrac{4x}{\sqrt{4x^2+1}}-2x$.
    steps:
    - {id: 1a, content: '$\dfrac{dy}{dx}=0\iff \sqrt{4a^2+1}=2\iff a=\dfrac{\sqrt3}{2}$, $b^2=2-\dfrac34-1=\dfrac14$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 거리의 곱 조건을 제곱해 다항식으로 써 보자.
    - 그 식을 $y^2$에 대한 이차식으로 보고 완전제곱식을 만들어 보자.
    - $y^2$를 $x$의 식으로 쓴 뒤 양변을 $x$에 대해 미분하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.35 예시답안
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{PA}}\times\overline{\mathrm{PB}}=1$을 제곱하여 식으로 쓰면 $\left((x-1)^2+y^2\right)\left((x+1)^2+y^2\right)=1$이다.
        $y^4+2(x^2+1)y^2+(x^2-1)^2-1=0$이고 $(y^2+x^2+1)^2=4x^2+1$로 쓸 수 있고 $y^2=\sqrt{4x^2+1}-x^2-1$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        음함수 미분하면 $\dfrac{dy}{dx}=\dfrac1y\left(\dfrac{2x}{\sqrt{4x^2+1}}-x\right)$이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        조건 $\dfrac{dy}{dx}=0$에서 $\dfrac{2a}{\sqrt{4a^2+1}}-a=0$이고 $b^2=\sqrt{4a^2+1}-a^2-1$이므로 계산하면 $a=\dfrac{\sqrt3}{2}$이고 $b=\dfrac12$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: $y^2=\sqrt{4x^2+1}-x^2-1$을 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: $\dfrac{dy}{dx}=\dfrac1y\left(\dfrac{2x}{\sqrt{4x^2+1}}-x\right)$(또는 동치식)를 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: $a=\dfrac{\sqrt3}{2}$, $b=\dfrac12$을 구했다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여(공식 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4701}
  misconceptions:
  - id: MC-CAL-4701
    outcome_code: '70'
    wrong_work: '$y^2$에 대한 이차방정식의 근을 $y^2=-\sqrt{4x^2+1}-x^2-1$(음의 근)까지 남기거나 근호를 빠뜨려 $y^2=2x-x^2-1$처럼 정리'
    detect_cue: $y^2$ 식에 $\pm$가 남아 있거나 $\sqrt{4x^2+1}$이 없음
    feedback: $y^2>0$이어야 하므로 $y^2+x^2+1=\sqrt{4x^2+1}$(양의 제곱근)만 가능합니다. $(y^2+x^2+1)^2=4x^2+1$로 정리해 보세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    [문제 2-2] (8점) 정적분 $\displaystyle\int_a^1 xy^2\,dx$의 값을 구하시오. (단, $a$는 [문제 2-1]에서 구한 값이다.)
  points: 8
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{5\sqrt5}{12}-\dfrac{173}{192}', equivalents: ['5*sqrt(5)/12-173/192', '(80*sqrt(5)-173)/192'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $xy^2=x\sqrt{4x^2+1}-x^3-x$. 앞 항은 $4x^2+1=t$로 치환($t:4\to5$).
    steps:
    - {id: 2a, content: '$\dfrac1{12}(5\sqrt5-8)-\dfrac{15}{64}=\dfrac{5\sqrt5}{12}-\dfrac{173}{192}$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 2-1에서 구한 $y^2$를 대입하자.
    - 근호 안의 식을 새 변수로 치환하면 $x\,dx$가 어떻게 바뀌는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.35 예시답안
    steps:
    - id: 2b-1
      content: |
        $$\int_{\frac{\sqrt3}{2}}^{1}xy^2\,dx=\int_{\frac{\sqrt3}{2}}^{1}x\left(\sqrt{4x^2+1}-x^2-1\right)dx$$
        이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $4x^2+1=t$로 치환하면
        $$\int_{\frac{\sqrt3}{2}}^{1}x\sqrt{4x^2+1}\,dx=\int_4^5\dfrac18\sqrt t\,dt=\dfrac1{12}(5\sqrt5-8)$$
        이고
      criteria: [2.B2]
    - id: 2b-3
      content: |
        $$-\int_{\frac{\sqrt3}{2}}^{1}x^3+x\,dx=-\dfrac{15}{64}$$
        이므로 구하는 값은 $\dfrac{5\sqrt5}{12}-\dfrac{173}{192}$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: $\int_{\sqrt3/2}^{1}xy^2\,dx=\int_{\sqrt3/2}^{1}x\left(\sqrt{4x^2+1}-x^2-1\right)dx$로 나타냈다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 4
      evidence: 치환으로 $\int_{\sqrt3/2}^{1}x\sqrt{4x^2+1}\,dx=\int_4^5\dfrac18\sqrt t\,dt=\dfrac1{12}(5\sqrt5-8)$을 구했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 2
      evidence: $-\int_{\sqrt3/2}^{1}(x^3+x)\,dx=-\dfrac{15}{64}$을 구했다(최종값 $\dfrac{5\sqrt5}{12}-\dfrac{173}{192}$).
      depends_on: []
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여(공식 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4702}
  misconceptions:
  - id: MC-CAL-4702
    outcome_code: '70'
    wrong_work: '$4x^2+1=t$로 치환하면서 적분 구간을 $\dfrac{\sqrt3}{2}\to1$ 그대로 두거나 $dx=\dfrac{dt}{8x}$의 계수 $\dfrac18$을 빠뜨림'
    detect_cue: $\int_{\sqrt3/2}^{1}\sqrt t\,dt$ 꼴, 또는 $\dfrac23(5\sqrt5-8)$ 같은 8배 값
    feedback: 치환하면 적분 구간도 $t=4$부터 $t=5$로 바뀌고, $x\,dx=\dfrac18dt$입니다(제시문 두 번째 ⚫).
    remedy: [RL-2]

