stimuli:
- label: '1'
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가, $a=g(\alpha)$, $b=g(\beta)$일 때 $\alpha$, $\beta$를 포함하는 구간에서 연속이면 다음 식이 성립한다.
    $$\int_a^b f(x)dx=\int_\alpha^\beta f(g(t))g'(t)dt$$
- label: '2'
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 방정식은 다음과 같다.
    $$y-f(a)=f'(a)(x-a)$$
- label: '3'
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능하고, $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때 다음 식이 성립한다.
    $$\int_a^b f(x)g'(x)dx=\left[f(x)g(x)\right]_a^b-\int_a^b f'(x)g(x)dx$$
- label: '4'
  body: |
    $n$이 실수일 때, $y=x^n$이면 $y'=nx^{n-1}$이다.

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 4-1] (15점) 좌표평면에서 점 $(t,0)$을 지나고 곡선 $y=e^{x^2}$과 접하는 직선이 두 개 있다. 두 접선의 기울기를 각각 $m_1(t)$, $m_2(t)$라 할 때, 다음 정적분의 값을 구하시오.
    $$\int_0^2t^3m_1(t)\,m_2(t)\,dt$$
  points: 15
  depends_on: []
  answer: {kind: value, value: '-(3e^5+e)', equivalents: ['-3e^5-e'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접점 $x$좌표는 $2x^2-2tx-1=0$의 두 근, $m_1m_2=-2e^{t^2+1}$.
    steps:
    - {id: 1a, content: '$-2e\int_0^2t^3e^{t^2}dt=-e\int_0^4se^sds=-(3e^5+e)$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 접점을 $(x,e^{x^2})$로 두고 접선이 $(t,0)$을 지날 조건을 쓰자.
    - 두 접점의 $x$좌표는 어떤 이차방정식의 두 근인가?
    - $m_1m_2$를 근과 계수의 관계로 $t$만의 식으로 바꾸자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.37 예시답안
    steps:
    - id: 1b-1
      content: |
        $y=e^{x^2}$을 미분하면 $y'=2xe^{x^2}$이다. 접점 $(x,e^{x^2})$과 $(t,0)$의 기울기를 고려하면 $\dfrac{e^{x^2}}{x-t}=2xe^{x^2}$이고 식을 정리하면 $2x^2-2tx-1=0$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $x$의 두 근을 $\alpha$, $\beta$라 하면 $\alpha+\beta=t$, $\alpha\beta=-\dfrac12$이다. 접선의 기울기의 곱은 다음과 같다.
        $$m_1(t)m_2(t)=4\alpha\beta e^{\alpha^2}e^{\beta^2}=-2e^{t^2+1}$$
      criteria: [1.B2]
    - id: 1b-3
      content: |
        구하는 정적분은 $-2e\displaystyle\int_0^2t^3e^{t^2}dt$이고 $t^2=s$로 치환하고 부분적분하면 다음을 얻는다.
        $$-2e\int_0^2t^3e^{t^2}dt=-e\int_0^4se^sds=-(3e^5+e)$$
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: $2x^2-2tx-1=0$을 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: $m_1(t)m_2(t)=4\alpha\beta e^{\alpha^2}e^{\beta^2}=-2e^{t^2+1}$을 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: 정적분의 값 $-(3e^5+e)$를 구했다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여(공식 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4703}
  misconceptions:
  - id: MC-CAL-4703
    outcome_code: '70'
    wrong_work: '$e^{\alpha^2}e^{\beta^2}=e^{\alpha^2+\beta^2}$에서 $\alpha^2+\beta^2=(\alpha+\beta)^2-2\alpha\beta=t^2+1$ 대신 $t^2-1$ 등으로 계산'
    detect_cue: $m_1m_2=-2e^{t^2-1}$ 꼴, 최종값이 $-(3e^3+e^{-1})$ 등
    feedback: $\alpha\beta=-\dfrac12$이므로 $\alpha^2+\beta^2=t^2-2\cdot\left(-\dfrac12\right)=t^2+1$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    [문제 4-2] (15점) 자연수 $n$에 대하여 함수 $f(x)=\lvert x-1\rvert^{\frac{n}{13}}+\lvert x+1\rvert^{\frac{n}{13}}$의 최솟값을 $a_n$이라 하자. 급수 $\displaystyle\sum_{n=1}^{27}a_n$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{2-2^{\frac{1}{13}}}{2^{\frac{1}{13}}-1}+30', equivalents: ['(2-2**(1/13))/(2**(1/13)-1)+30'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 우함수이고 $[0,1]$만 보면 된다. 지수 $<1$이면 $x=1$에서 최소 $2^{n/13}$, 지수 $\ge1$이면 $x=0$에서 최소 $2$.
    steps:
    - {id: 2a, content: '$\sum_{n=1}^{12}2^{\frac{n}{13}}+15\times2=\dfrac{2-2^{\frac1{13}}}{2^{\frac1{13}}-1}+30$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - $f(-x)$와 $f(x)$를 비교해 보자.
    - $0\le x\le1$에서 $f'(x)$의 부호는 지수 $\dfrac{n}{13}$이 1보다 작을 때와 클 때 어떻게 다른가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.38 예시답안
    steps:
    - id: 2b-1
      content: |
        $f(x)=f(-x)$이므로 $x\ge0$인 경우만 생각하자. 또한 $x\ge1$에서 $f(x)$는 증가함수이므로 $0\le x\le1$ 경우만 생각하면 된다. $0\le x\le1$에서 주어진 함수는
        $$f(x)=(1-x)^{\frac{n}{13}}+(x+1)^{\frac{n}{13}}$$
        이다.
      criteria: []
    - id: 2b-2
      content: |
        (1) $1\le n\le12$일 때, $0\le x<1$에서
        $$f'(x)=\dfrac{n}{13}\dfrac{1}{(x+1)^{1-\frac{n}{13}}}-\dfrac{n}{13}\dfrac{1}{(1-x)^{1-\frac{n}{13}}}\le0$$
        이므로 $x=1$에서 최솟값을 가지고 $a_n=2^{\frac{n}{13}}$이다.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        (2) $n\ge13$이면
        $$f'(x)=\dfrac{n}{13}(x+1)^{\frac{n}{13}-1}-\dfrac{n}{13}(1-x)^{\frac{n}{13}-1}\ge0$$
        이므로 $x=0$에서 최솟값을 갖고 $a_n=2$이다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        따라서
        $$\sum_{n=1}^{27}a_n=\sum_{n=1}^{12}2^{\frac{n}{13}}+\sum_{n=13}^{27}2=\dfrac{2-2^{\frac1{13}}}{2^{\frac1{13}}-1}+30$$
        이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: $1\le n\le12$일 때 $a_n=2^{\frac{n}{13}}$을 구했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: $n\ge13$일 때 $a_n=2$를 구했다.
      depends_on: []
      steps: [2b-3]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: $\sum_{n=1}^{27}a_n=\sum_{n=1}^{12}2^{\frac{n}{13}}+\sum_{n=13}^{27}2=\dfrac{2-2^{\frac1{13}}}{2^{\frac1{13}}-1}+30$을 구했다.
      depends_on: []
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여(공식 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4704}
  misconceptions:
  - id: MC-CAL-4704
    outcome_code: '70'
    wrong_work: 모든 $n$에서 대칭 중심 $x=0$에서 최소($a_n=2$)라고 보거나, 모든 $n$에서 $x=\pm1$에서 최소($a_n=2^{n/13}$)라고 봄
    detect_cue: 합이 $54$, 또는 $\sum_{n=1}^{27}2^{n/13}$ 하나의 등비수열 합
    feedback: 지수 $\dfrac{n}{13}<1$이면 $y=x^{n/13}$은 위로 볼록해 끝점 $x=\pm1$에서 최소가 되고, $\dfrac{n}{13}\ge1$이면 $x=0$에서 최소가 됩니다. $f'(x)$의 부호로 확인하세요.
    remedy: [RL-2]

