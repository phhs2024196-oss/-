intent: 곡선 밖의 점에서 그은 접선의 기울기를 근과 계수의 관계로 다루고 치환·부분적분으로 정적분을 계산하는 능력, 무리함수(실수 지수)의 미분으로 최솟값을 구하되 지수 크기에 따라 최솟값을 갖는 점이 바뀜을 알고 등비급수의 합을 구하는 능력을 본다(가이드북 출제 의도 요지).
key_idea: '접점의 $x$좌표 $\alpha$, $\beta$는 $2x^2-2tx-1=0$의 두 근이므로 $m_1m_2=4\alpha\beta e^{\alpha^2+\beta^2}=-2e^{t^2+1}$; $f(x)=(1-x)^{n/13}+(1+x)^{n/13}$은 $n\le12$이면 감소, $n\ge13$이면 증가.'
stuck: 기울기의 곱을 개별 접점 없이 근과 계수의 관계로 $t$의 식으로 만드는 단계, 지수 $\dfrac{n}{13}$이 1보다 작은지 큰지에 따라 경우를 나누는 단계
idea_tags: [IDEA-TANGENT-FROM-EXTERNAL-POINT-VIETA, IDEA-EXPONENT-THRESHOLD-CASE-SPLIT]
tags: [접선, 근과 계수의 관계, 부분적분, 실수 지수의 미분, 등비급수, 중앙대 모의]
elements:
  materials:
  - '곡선 $y=e^{x^2}$과 $x$축 위의 점 $(t,0)$에서 그은 두 접선'
  - '$\displaystyle\int_0^2t^3m_1(t)m_2(t)\,dt$'
  - '$f(x)=\lvert x-1\rvert^{\frac{n}{13}}+\lvert x+1\rvert^{\frac{n}{13}}$의 최솟값 $a_n$, $\displaystyle\sum_{n=1}^{27}a_n$'
  concepts: [접선의 방정식, 이차방정식의 근과 계수의 관계, 치환적분법, 부분적분법, 실수 지수 함수의 미분, 함수의 증가·감소와 최솟값, 등비수열의 합]
  tools:
  - '접점에서의 기울기와 두 점의 기울기 비교'
  - '근과 계수의 관계'
  - '$t^2=s$ 치환 후 부분적분'
  - '우함수 대칭으로 $x\ge0$만 고려'
  - '도함수 부호 판정'
  - '등비수열 합 공식'
  conditions:
  - '접선이 $(t,0)$을 지남 ⇒ $\dfrac{e^{x^2}}{x-t}=2xe^{x^2}$ ⇒ $2x^2-2tx-1=0$ ⇒ $\alpha+\beta=t$, $\alpha\beta=-\dfrac12$'
  - '$f(x)=f(-x)$, $x\ge1$에서 증가 ⇒ $0\le x\le1$만 조사'
  - '지수 $\dfrac{n}{13}\le\dfrac{12}{13}<1$ ⇒ $f''(x)\le0$ ⇒ $x=1$에서 최소 $a_n=2^{\frac{n}{13}}$'
  - '$\dfrac{n}{13}\ge1$ ⇒ $f''(x)\ge0$ ⇒ $x=0$에서 최소 $a_n=2$'
  stimuli_used: ['1', '2', '3', '4']
  subpart_links: null

