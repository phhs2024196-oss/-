stimuli:
- label: '1'
  body: |
    초점이 $\mathrm{F}(p,0)$, 준선이 $x=-p$인 포물선의 방정식은 $y^2=4px$(단, $p\ne0$)이다.
- label: '2'
  body: |
    두 직선 $l$, $m$이 꼬인 위치에 있을 때, 직선 $m$ 위의 임의의 점 O를 지나고 직선 $l$에 평행한 직선 $l'$을 그으면 두 직선 $l'$, $m$은 점 O에서 만나므로 한 평면을 결정한다. 이때 두 직선 $l'$과 $m$이 이루는 각을 두 직선 $l$, $m$이 이루는 각이라 한다. 여기서 두 직선 $l'$과 $m$이 이루는 각의 크기는 점 O의 위치에 관계없이 항상 일정하다.
    [그림: 평면 위에서 점 O에서 만나는 두 직선 $l'$, $m$과, 평면 밖에서 $l'$과 평행한 직선 $l$]

stem: |
  다음을 읽고 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    [문제 5-1] (15점) 초점이 F인 포물선 $y^2=4x$ 위에 있는 제1사분면 위의 점 P에서의 접선이 $y$축과 만나는 점을 Q라 하자. $\angle\mathrm{PFQ}=30^\circ$일 때, 사각형 OFPQ의 넓이를 구하시오. (단, O는 원점이다.)
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{7\sqrt3}{18}', equivalents: ['7*sqrt(3)/18'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{Q}\left(0,\dfrac{y_1}{2}\right)$이고 $\overline{\mathrm{PQ}}^2+\overline{\mathrm{FQ}}^2=\overline{\mathrm{FP}}^2$이므로 $\angle\mathrm{PQF}=90^\circ$.
    steps:
    - {id: 1a, content: '$\dfrac13=\dfrac{x_1^2+x_1}{1+x_1}=x_1$, $y_1=\dfrac2{\sqrt3}$, $S=\dfrac1{\sqrt3}+\dfrac1{6\sqrt3}=\dfrac{7\sqrt3}{18}$', criteria: [1.B1, 1.B2, 1.B3, 1.B4]}
    hint_ladder:
    - 점 $\mathrm{P}(x_1,y_1)$에서의 접선의 방정식과 $y$절편을 구하자.
    - $\overline{\mathrm{FP}}$를 포물선의 정의로 나타내고 세 변의 길이를 비교해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.39 예시답안
    steps:
    - id: 1b-1
      content: |
        포물선의 초점은 $\mathrm{F}(1,0)$이고 점 $\mathrm{P}(x_1,y_1)$에서의 접선의 방정식은 $y_1y=2(x+x_1)$이다. 이 직선의 $y$절편은 $\dfrac{2x_1}{y_1}=\dfrac{4x_1}{2y_1}=\dfrac{y_1^2}{2y_1}=\dfrac{y_1}{2}$이므로 점 Q의 좌표는 $\left(0,\dfrac{y_1}{2}\right)$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        따라서 $\overline{\mathrm{PQ}}^2=x_1^2+\dfrac{y_1^2}{4}$이고 $\overline{\mathrm{FQ}}^2=1+\dfrac{y_1^2}{4}$이다. 점 P는 포물선 위의 점이므로 $\overline{\mathrm{FP}}$는 점 P와 포물선의 준선 $x=-1$ 사이의 거리와 같다. 즉, $\overline{\mathrm{FP}}=x_1+1$이다.
        $$\overline{\mathrm{PQ}}^2+\overline{\mathrm{FQ}}^2=\left(x_1^2+\dfrac{y_1^2}{4}\right)+\left(1+\dfrac{y_1^2}{4}\right)=x_1^2+\dfrac{y_1^2}{2}+1=x_1^2+2x_1+1=\overline{\mathrm{FP}}^2$$
        이므로 삼각형 PQF는 $\angle\mathrm{PQF}=90^\circ$인 직각삼각형이다.
      criteria: []
    - id: 1b-3
      content: |
        $$\dfrac13=\tan^230^\circ=\dfrac{\overline{\mathrm{PQ}}^2}{\overline{\mathrm{FQ}}^2}=\dfrac{x_1^2+\frac{y_1^2}{4}}{1+\frac{y_1^2}{4}}=\dfrac{x_1^2+x_1}{1+x_1}$$
        이므로 $x_1=\dfrac13$이다.
      criteria: [1.B2]
    - id: 1b-4
      content: |
        $y_1^2=4x_1$에서 $y_1=\dfrac{2}{\sqrt3}$이다.
      criteria: [1.B3]
    - id: 1b-5
      content: |
        사각형 OFPQ의 넓이 $S$는
        $$S=\triangle\mathrm{OFP}+\triangle\mathrm{OPQ}=\dfrac12\times\overline{\mathrm{OF}}\times y_1+\dfrac12\times\overline{\mathrm{OQ}}\times x_1=\dfrac1{\sqrt3}+\dfrac1{6\sqrt3}=\dfrac{7\sqrt3}{18}$$
      criteria: [1.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: 점 Q의 좌표 $\left(0,\dfrac{y_1}{2}\right)$을 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: $x_1=\dfrac13$을 얻었다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 4
      evidence: $y_1=\dfrac{2}{\sqrt3}$을 얻었다.
      depends_on: []
      steps: [1b-4]
    - id: 1.B4
      mark_type: B
      points: 4
      evidence: 사각형 OFPQ의 넓이 $\dfrac{7\sqrt3}{18}$을 얻었다.
      depends_on: []
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여(공식 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4701}
  misconceptions:
  - id: MC-GEO-4701
    outcome_code: '70'
    wrong_work: '$\angle\mathrm{PFQ}=30^\circ$를 접선의 기울기 각이나 $\angle\mathrm{FPQ}$로 착각해 $\tan30^\circ$를 다른 변의 비에 적용'
    detect_cue: $\dfrac{\overline{\mathrm{FQ}}}{\overline{\mathrm{PQ}}}=\dfrac1{\sqrt3}$ 꼴, $x_1=3$ 등
    feedback: 직각은 Q에 있으므로 $\angle\mathrm{PFQ}$의 대변은 PQ, 이웃변은 FQ입니다. $\tan30^\circ=\dfrac{\overline{\mathrm{PQ}}}{\overline{\mathrm{FQ}}}$.
    remedy: [RL-1]
- id: '2'
  stem: |
    [문제 5-2] (15점) 그림과 같이 정사면체 ABCD에 대하여 모서리 BC를 $1:2$로 내분하는 점을 P, 모서리 AD를 $2:1$로 내분하는 점을 Q라 하자. 두 직선 PQ, CD가 이루는 예각의 크기를 $\theta$라 할 때, $\cos\theta$의 값을 구하시오.
    [그림: 정사면체 ABCD, 모서리 BC 위의 점 P(B에 가까움), 모서리 AD 위의 점 Q(D에 가까움), 선분 PQ]
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{3\sqrt5}{10}', equivalents: ['3/(2*sqrt(5))', '3*sqrt(5)/10'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: AC의 $2:1$ 내분점 R을 잡으면 QR ∥ CD이므로 $\theta=\angle\mathrm{PQR}$. 모서리 $3a$로 두고 코사인법칙.
    steps:
    - {id: 2a, content: '$\overline{\mathrm{PQ}}=\sqrt5a$, $\overline{\mathrm{QR}}=2a$, $\overline{\mathrm{PR}}=\sqrt3a$ ⇒ $\cos\theta=\dfrac{5+4-3}{2\cdot2\sqrt5}=\dfrac{3\sqrt5}{10}$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 꼬인 위치의 두 직선이 이루는 각은 한 직선을 평행이동해 구한다(제시문 ⚫2).
    - Q를 지나고 CD와 평행한 직선은 어느 모서리와 만나는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.40 예시답안
    steps:
    - id: 2b-1
      content: |
        정사면체 ABCD의 한 모서리의 길이를 $3a\ (a>0)$라 하면 삼각형 CDQ에서 코사인법칙에 의하여
        $$\overline{\mathrm{CQ}}^2=\overline{\mathrm{CD}}^2+\overline{\mathrm{QD}}^2-2\times\overline{\mathrm{CD}}\times\overline{\mathrm{QD}}\times\cos(\angle\mathrm{CDQ})=9a^2+a^2-2\times3a\times a\times\dfrac12=7a^2$$
        따라서 $\overline{\mathrm{CQ}}=\sqrt7a$이다. 마찬가지 방법으로 $\overline{\mathrm{BQ}}=\sqrt7a$임을 알 수 있다.
      criteria: []
    - id: 2b-2
      content: |
        삼각형 BCQ에서 코사인법칙에 의하여
        $$\cos(\angle\mathrm{BCQ})=\dfrac{\overline{\mathrm{BC}}^2+\overline{\mathrm{CQ}}^2-\overline{\mathrm{BQ}}^2}{2\times\overline{\mathrm{BC}}\times\overline{\mathrm{CQ}}}=\dfrac{9a^2+7a^2-7a^2}{2\times3a\times\sqrt7a}=\dfrac{3}{2\sqrt7}$$
      criteria: [2.B1]
    - id: 2b-3
      content: |
        삼각형 PCQ에서 코사인법칙에 의하여
        $$\overline{\mathrm{PQ}}^2=\overline{\mathrm{PC}}^2+\overline{\mathrm{CQ}}^2-2\times\overline{\mathrm{PC}}\times\overline{\mathrm{CQ}}\times\cos(\angle\mathrm{BCQ})=4a^2+7a^2-2\times2a\times\sqrt7a\times\dfrac{3}{2\sqrt7}=5a^2$$
      criteria: [2.B2]
    - id: 2b-4
      content: |
        모서리 AC를 $2:1$로 내분하는 점을 R이라 하면 $\overline{\mathrm{QR}}=2a$이고 삼각형 PCR에서 코사인법칙에 의하여
        $$\overline{\mathrm{PR}}^2=\overline{\mathrm{PC}}^2+\overline{\mathrm{CR}}^2-2\times\overline{\mathrm{PC}}\times\overline{\mathrm{CR}}\times\cos(\angle\mathrm{PCR})=4a^2+a^2-2\times2a\times a\times\dfrac12=3a^2$$
      criteria: []
    - id: 2b-5
      content: |
        직선 RQ는 직선 CD와 평행하므로 두 직선 PQ, CD가 이루는 예각의 크기 $\theta$는 $\theta=\angle\mathrm{PQR}$이다. 삼각형 PQR에서 코사인법칙에 의하여
        $$\cos\theta=\dfrac{\overline{\mathrm{PQ}}^2+\overline{\mathrm{QR}}^2-\overline{\mathrm{PR}}^2}{2\times\overline{\mathrm{PQ}}\times\overline{\mathrm{QR}}}=\dfrac{5a^2+4a^2-3a^2}{2\times\sqrt5a\times2a}=\dfrac{3}{2\sqrt5}=\dfrac{3\sqrt5}{10}$$
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: $\cos(\angle\mathrm{BCQ})=\dfrac{3}{2\sqrt7}=\dfrac{3\sqrt7}{14}$을 구했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: $\overline{\mathrm{PQ}}=\sqrt5a$(모서리 $3a$ 기준)를 구했다.
      depends_on: []
      steps: [2b-3]
    - id: 2.B3
      mark_type: B
      points: 5
      evidence: $\cos\theta=\dfrac{3}{2\sqrt5}=\dfrac{3\sqrt5}{10}$을 구했다.
      depends_on: []
      steps: [2b-5]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여(공식 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-4702}
  misconceptions:
  - id: MC-GEO-4702
    outcome_code: '70'
    wrong_work: 꼬인 두 직선 PQ, CD가 이루는 각을 삼각형 PQC나 PQD의 한 각($\angle\mathrm{PQC}$ 등)으로 바로 잡음
    detect_cue: 평행이동한 보조선 없이 $\cos\angle\mathrm{PQC}$ 등을 답으로 제시
    feedback: 꼬인 위치의 두 직선이 이루는 각은 한 직선을 다른 직선 위의 점으로 평행이동해 만든 각입니다. Q를 지나 CD에 평행한 QR을 그어 보세요.
    remedy: [RL-2]

