stem: |
  곡선 $y=x^3-x$ 위의 점 $(1,0)$에서의 접선을 $l$이라 하자. [15점]

subparts:
- id: '1'
  stem: |
    [1-1] 곡선 $y=x^3-x$와 직선 $l$의 교점을 구하시오. (단, 접점 $(1,0)$은 제외한다.) [5점]
  points: 5
  depends_on: []
  answer: {kind: value, value: '(-2,\ -6)', equivalents: ['(-2,-6)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$l:y=2x-2$, $x^3-3x+2=(x-1)^2(x+2)=0$.'
    steps:
    - {id: 1a, content: '교점 $(-2,-6)$', criteria: [1.B1, 1.B2]}
    hint_ladder:
    - 접점은 방정식 $x^3-x=2x-2$의 중근이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.46 예시답안
    steps:
    - id: 1b-1
      content: |
        $y=x^3-x$를 미분하여 $\dfrac{dy}{dx}=3x^2-1$을 구하고 $(1,0)$에서의 접선의 기울기 2를 구한다. 접선이 $(1,0)$을 지나므로, 접선의 방정식은 $y=2x-2$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        방정식 $x^3-x=2x-2$를 풀어 교점 $(-2,-6)$을 구한다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: 접선의 방정식 $y=2x-2$를 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: 교점 $(-2,-6)$을 구했다.
      depends_on: []
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석, 문제 1 전체). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여(공식 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4705}
  misconceptions:
  - id: MC-CAL-4705
    outcome_code: '70'
    wrong_work: '$x^3-3x+2=0$을 인수분해할 때 접점의 중근을 이용하지 못해 다른 근을 잘못 구함(예: $x=2$)'
    detect_cue: 교점이 $(-2,-6)$이 아님
    feedback: 접점의 $x$좌표 1은 중근이므로 $x^3-3x+2=(x-1)^2(x+2)$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    [1-2] 닫힌구간 $\left[-2-\dfrac1n,\ -2+\dfrac1n\right]$에서 곡선 $y=x^3-x$와 직선 $l$ 사이의 넓이를 $A_n$이라 할 때, $\displaystyle\lim_{n\to\infty}\left(n^2A_n\right)$의 값을 구하시오. [10점]
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '9', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $(x-1)^2(x+2)$의 부호가 $x=-2$에서 바뀐다. $x=-2\mp u$로 치환하면 $A_n=\int_0^{1/n}(2u^3+18u)\,du$.
    steps:
    - {id: 2a, content: '$A_n=\dfrac1{2n^4}+\dfrac9{n^2}$, $n^2A_n\to9$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 구간 안에서 곡선과 직선 중 어느 쪽이 위에 있는지 $x=-2$ 좌우로 나눠 보자.
    - 구간 중심이 $-2$이므로 $x=-2\mp u$로 바꾸면 적분 구간이 $[0,\tfrac1n]$이 된다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.46 예시답안
    steps:
    - id: 2b-1
      content: |
        구간 $\left[-2-\dfrac1n,-2\right]$에서는 직선 $l$이 곡선 $y=x^3-x$ 위에 있고, 구간 $\left[-2,-2+\dfrac1n\right]$에서는 곡선 $y=x^3-x$가 직선 $l$ 위에 있다. 따라서, 구하고자 하는 넓이는 다음과 같이 주어진다.
        $$A_n=\int_{-2-\frac1n}^{-2+\frac1n}\left\lvert(x^3-x)-(2x-2)\right\rvert dx=\int_{-2-\frac1n}^{-2}(-x^3+3x-2)\,dx+\int_{-2}^{-2+\frac1n}(x^3-3x+2)\,dx$$
      criteria: [2.B1]
    - id: 2b-2
      content: |
        위 적분은 직접 계산해도 되지만 치환을 하면 계산이 간단해지므로, 각각 $x=-2-u$, $x=-2+u$로 치환하여,
        $$A_n=\int_0^{\frac1n}(u^3+6u^2+9u)\,du+\int_0^{\frac1n}(u^3-6u^2+9u)\,du=\int_0^{\frac1n}(2u^3+18u)\,du=\dfrac1{2n^4}+\dfrac9{n^2}$$
      criteria: [2.B2]
    - id: 2b-3
      content: |
        를 구한 후, $\displaystyle\lim_{n\to\infty}n^2A_n=\lim_{n\to\infty}\left(\dfrac1{2n^2}+9\right)=9$를 구한다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: 곡선의 개형을 파악하여 $A_n=\int_{-2-\frac1n}^{-2}(-x^3+3x-2)\,dx+\int_{-2}^{-2+\frac1n}(x^3-3x+2)\,dx$를 세웠다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 2
      evidence: 정적분을 계산하여 $A_n=\dfrac1{2n^4}+\dfrac9{n^2}$을 구했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: 극한 $\lim_{n\to\infty}n^2A_n=9$를 구했다.
      depends_on: []
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여(공식 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4706}
  misconceptions:
  - id: MC-CAL-4706
    outcome_code: '70'
    wrong_work: 절댓값 없이 $\int_{-2-\frac1n}^{-2+\frac1n}(x^3-3x+2)\,dx$를 한 번에 계산해 부호가 상쇄된 값을 넓이로 씀
    detect_cue: $A_n=-\dfrac{4}{n^3}$ 꼴(부호 있는 적분값)이고 극한이 0
    feedback: 넓이는 (위 함수)−(아래 함수)를 적분합니다. $x=-2$ 좌우로 위아래가 바뀌므로 구간을 나누세요.
    remedy: [RL-2]

