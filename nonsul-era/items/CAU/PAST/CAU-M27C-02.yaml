stimuli: []

stem: |
  음함수 표현 $x^4+7x^2y^2+y^4=45$에 대하여 $x=a$에서 $\dfrac{dy}{dx}=-1$이다. $a$의 값을 모두 구하시오. (단, $x>0$이고 $y>0$이다.) [15점]

subparts:
- id: '1'
  stem: |
    $x=a$에서 $\dfrac{dy}{dx}=-1$일 때, $a$의 값을 모두 구하시오.
  points: 15
  depends_on: []
  answer: {kind: set, value: 'a=5^{\frac14},\ 1,\ 2', equivalents: ['5**(1/4), 1, 2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 미분 후 $\dfrac{dy}{dx}=-1$을 넣으면 $x$, $y$의 삼차 동차식이 되어 $(y-x)(2x-y)(x-2y)=0$.
    steps:
    - {id: 1a, content: '$y=x\Rightarrow9x^4=45$, $y=2x\Rightarrow45x^4=45$, $y=\tfrac12x\Rightarrow\tfrac{45}{16}x^4=45$ ⇒ $a=5^{\frac14},1,2$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 양변을 $x$에 대해 미분하고 $\dfrac{dy}{dx}=-1$을 대입하자.
    - 얻은 식은 모든 항의 차수가 같다. $y=x$를 넣어 보면 인수 하나가 보인다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.47 예시답안
    steps:
    - id: 1b-1
      content: |
        음함수 미분을 하면 $4x^3+14xy^2+14x^2y\dfrac{dy}{dx}+4y^3\dfrac{dy}{dx}=0$이다. $\dfrac{dy}{dx}=-1$을 대입하고 정리하면
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $(y-x)(2x^2-5xy+2y^2)=0$이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        (1) $y=x$이면 $x^4=5$이다.
        (2) $2x^2-5xy+2y^2=(2x-y)(x-2y)=0$이므로 $y=2x$, $y=\dfrac12x$이다.
        $y=2x$이면 $x=1$이고 $y=\dfrac12x$이면 $x=2$이다. 따라서 $a=5^{\frac14}$, $1$, $2$이다.
      criteria: [1.B2, 1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: $4x^3+14xy^2+14x^2y\dfrac{dy}{dx}+4y^3\dfrac{dy}{dx}=0$을 구하고 $\dfrac{dy}{dx}=-1$을 대입했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: 인수분해하여 $(y-x)(2x-y)(x-2y)=0$을 구했다.
      depends_on: []
      steps: [1b-2, 1b-3]
    - id: 1.B3
      mark_type: B
      points: 6
      evidence: $a=5^{\frac14}$, $1$, $2$를 구했다(각 2점씩 합하여 6점).
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여(공식 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4707}
  misconceptions:
  - id: MC-CAL-4707
    outcome_code: '70'
    wrong_work: '$y^2$, $x^2y^2$ 항을 미분할 때 $\dfrac{dy}{dx}$를 곱하지 않거나 곱의 미분에서 한 항을 빠뜨림'
    detect_cue: 미분식에 $14xy^2$ 또는 $14x^2y\dfrac{dy}{dx}$ 중 하나가 없음
    feedback: $y$는 $x$의 함수이므로 $\dfrac{d}{dx}(x^2y^2)=2xy^2+2x^2y\dfrac{dy}{dx}$입니다.
    remedy: [RL-1]

