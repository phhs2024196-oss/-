intent: 미적분학의 기본원리를 이해하면 정적분 형태로 주어진 함수의 도함수를 쉽게 구할 수 있다. 치환적분으로 정적분을 계산할 수 있는지 평가한다(가이드북 출제 의도).
key_idea: '$g$가 증가함수이므로 $u=g^{-1}(x)$로 치환하면 $\int_0^{g(1)}g^{-1}(x)\,dx=\int_0^1u\,g''(u)\,du$가 되어 $e^{-t^2}$을 직접 적분할 필요가 없다.'
stuck: 역함수의 정적분을 $u=g^{-1}(x)$ 치환으로 $\int_0^1ug'(u)\,du$로 바꾸는 발상($g(0)=0$ 확인 포함)
