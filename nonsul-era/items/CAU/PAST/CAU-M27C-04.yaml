stimuli: []

stem: |
  좌표평면에서 곡선 $y=\sqrt x$ 위의 점 $\mathrm{P}_n(a_n^2,a_n)$과 $x$축 위의 점 $\mathrm{Q}_n(b_n,0)$을 다음과 같이 정의한다. [15점]

  (i) 점 $\mathrm{P}_1$의 좌표는 $(1,1)$이다. (즉, $a_1=1$이다.)

  (ii) $\mathrm{P}_n(a_n^2,a_n)$을 지나고 기울기 $-1$인 직선이 $x$축과 만나는 점을 $\mathrm{Q}_n(b_n,0)$이라 한다.

  (iii) $\mathrm{Q}_n(b_n,0)$을 지나고 기울기 $1$인 직선이 곡선 $y=\sqrt x$와 만나는 점을 $\mathrm{P}_{n+1}(a_{n+1}^2,a_{n+1})$이라 한다.

  삼각형 $\mathrm{P}_n\mathrm{Q}_n\mathrm{P}_{n+1}$의 넓이를 $S_n$이라 할 때, 급수 $\displaystyle\sum_{n=1}^{10}S_n$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    급수 $\displaystyle\sum_{n=1}^{10}S_n$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '440', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_n=n$, $\overline{\mathrm{P}_n\mathrm{Q}_n}=\sqrt2n$, $\overline{\mathrm{Q}_n\mathrm{P}_{n+1}}=\sqrt2(n+1)$, 직각.
    steps:
    - {id: 1a, content: '$S_n=n^2+n$, $\sum_{n=1}^{10}(n^2+n)=385+55=440$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - $\mathrm{P}_1$에서 시작해 $\mathrm{Q}_1$, $\mathrm{P}_2$, $\mathrm{Q}_2$를 직접 구해 패턴을 찾자.
    - 두 직선의 기울기 곱은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.49 예시답안
    steps:
    - id: 1b-1
      content: |
        $\mathrm{P}_n(a_n^2,a_n)$에 대하여 $b_n=a_n^2+a_n$이고 $\mathrm{P}_{n+1}\left((a_n+1)^2,a_n+1\right)$이다. $a_1=1$이므로 $\mathrm{P}_n(n^2,n)$, $\mathrm{Q}_n(n^2+n,0)$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        직선의 기울기가 $1$, $-1$이므로 $\angle\mathrm{P}_n\mathrm{Q}_n\mathrm{P}_{n+1}=\dfrac\pi2$이다. 삼각형 $\mathrm{P}_n\mathrm{Q}_n\mathrm{P}_{n+1}$의 넓이는
        $$S_n=\dfrac12\overline{\mathrm{P}_n\mathrm{Q}_n}\cdot\overline{\mathrm{Q}_n\mathrm{P}_{n+1}}=\dfrac12\sqrt{2n^2}\sqrt{2(n+1)^2}=n^2+n$$
        이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        급수의 값은 $\displaystyle\sum_{n=1}^{10}(n^2+n)=440$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 8
      evidence: $\mathrm{P}_n(n^2,n)$, $\mathrm{Q}_n(n^2+n,0)$을 구했다(각 4점씩 합하여 8점).
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: $S_n=n^2+n$을 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: $\sum_{n=1}^{10}(n^2+n)=440$을 구했다.
      depends_on: []
      steps: [1b-3]
    deductions:
