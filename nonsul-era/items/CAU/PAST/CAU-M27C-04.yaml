intent: 직선과 곡선이 만나는 점을 구하고 그 점들의 패턴을 파악할 수 있는지 평가한다. 그리고 점들로 이루어진 삼각형의 넓이를 구하고 요구하는 급수 계산을 수행할 수 있는지 평가한다(가이드북 출제 의도).
key_idea: '$b_n=a_n^2+a_n$이고 $\mathrm{P}_{n+1}$의 $y$좌표는 $a_n+1$이므로 $a_n=n$; 기울기 $-1$, $1$인 두 직선은 수직이라 $S_n=\dfrac12\overline{\mathrm{P}_n\mathrm{Q}_n}\cdot\overline{\mathrm{Q}_n\mathrm{P}_{n+1}}$.'
stuck: $y=\sqrt x$와 직선의 교점 계산에서 $\sqrt{1+4b_n}=2a_n+1$로 깔끔히 정리되어 $a_{n+1}=a_n+1$임을 보는 단계
