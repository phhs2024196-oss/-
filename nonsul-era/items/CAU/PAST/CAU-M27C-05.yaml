  - '$f\left(\dfrac\pi6\right)=f''\left(\dfrac\pi6\right)=e^{\frac\pi2}$'
  - '닫힌구간 $[0,\pi]$에서의 최댓값'
  concepts: [곱의 미분법, 지수함수·삼각함수의 도함수, 삼각함수의 덧셈정리, 닫힌구간에서의 최대·최소, 연립일차방정식]
  tools: [조건 대입으로 연립방정식, 합 공식으로 한 사인으로 합성, 도함수 영점 탐색, 극값·끝점 비교, 지수 대소 비교]
  conditions:
  - '$f\left(\dfrac\pi6\right)=e^{\frac\pi2}$ ⇒ $a+\sqrt3b=2$'
  - '$f''\left(\dfrac\pi6\right)=e^{\frac\pi2}$ ⇒ $\dfrac{\sqrt3a}{2}-\dfrac b2=0$ ⇒ $b=\sqrt3a$'
  - '$0\le x\le\pi$ ⇒ $\dfrac\pi3\le x+\dfrac\pi3\le\dfrac{4\pi}{3}$ ⇒ $\tan\left(x+\dfrac\pi3\right)=-1$의 해는 $x+\dfrac\pi3=\dfrac{3\pi}4$ 하나'
