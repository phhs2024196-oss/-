intent: 삼각함수의 성질(미분, 합 공식)을 이해하고 있는지를 평가한다. 미분을 이용하여 닫힌구간에 주어진 함수의 최댓값을 구할 수 있는지 평가한다(가이드북 출제 의도).
key_idea: '$a=\cos\dfrac\pi3$, $b=\sin\dfrac\pi3$이므로 $f(x)=e^{x+\frac\pi3}\sin\left(x+\dfrac\pi3\right)$로 합쳐지고, $f''(x)=0\iff\tan\left(x+\dfrac\pi3\right)=-1$.'
stuck: 구한 $a$, $b$를 $\cos\dfrac\pi3$, $\sin\dfrac\pi3$으로 보고 합 공식으로 $f$를 한 개의 사인으로 정리하는 단계, 극값과 끝점 값의 대소 비교
