stimuli: []

stem: |
  실수 $a$, $b$에 대하여 함수 $f(x)=e^{x+\frac\pi3}(a\sin x+b\cos x)$가 다음을 만족시킨다. [20점]
  $$f\left(\dfrac\pi6\right)=f'\left(\dfrac\pi6\right)=e^{\frac\pi2}$$

subparts:
- id: '1'
  stem: |
    [5-1] 실수 $a$, $b$를 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: 'a=\dfrac12,\ b=\dfrac{\sqrt3}{2}', equivalents: ['a=1/2, b=sqrt(3)/2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=e^{x+\frac\pi3}\{(a-b)\sin x+(a+b)\cos x\}$, 두 조건에서 $a+\sqrt3b=2$, $b=\sqrt3a$.
    steps:
    - {id: 1a, content: '$a=\dfrac12$, $b=\dfrac{\sqrt3}{2}$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 곱의 미분법으로 $f'(x)$를 구하자.
    - $f'\left(\tfrac\pi6\right)$ 안에 $f\left(\tfrac\pi6\right)$와 같은 부분이 들어 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.49 예시답안
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=e^{x+\frac\pi3}(a\sin x+b\cos x)$를 미분하여,
        $$f'(x)=e^{x+\frac\pi3}(a\sin x+b\cos x)+e^{x+\frac\pi3}(a\cos x-b\sin x)$$
        를 얻는다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        주어진 조건에 의해
        $$f\left(\dfrac\pi6\right)=e^{\frac\pi2}\left(\dfrac a2+\dfrac{\sqrt3b}{2}\right)=e^{\frac\pi2}\ \Rightarrow\ a+\sqrt3b=2$$
        이고
        $$f'\left(\dfrac\pi6\right)=e^{\frac\pi2}\left(\dfrac a2+\dfrac{\sqrt3b}{2}\right)+e^{\frac\pi2}\left(\dfrac{\sqrt3a}{2}-\dfrac b2\right)=e^{\frac\pi2}+e^{\frac\pi2}\left(\dfrac{\sqrt3a}{2}-\dfrac b2\right)=e^{\frac\pi2}\ \Rightarrow\ b=\sqrt3a$$
      criteria: [1.B2]
    - id: 1b-3
      content: |
        이므로, 연립방정식을 풀어 $a=\dfrac12$, $b=\dfrac{\sqrt3}{2}$을 얻는다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $f'(x)=e^{x+\frac\pi3}(a\sin x+b\cos x)+e^{x+\frac\pi3}(a\cos x-b\sin x)$를 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: 연립방정식 $a+\sqrt3b=2$, $b=\sqrt3a$를 얻었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: $a=\dfrac12$, $b=\dfrac{\sqrt3}{2}$을 얻었다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여, 채점자 재량 −0.5~+0.5점(공식 주석은 [5-2] 아래에 표기, 문제 5 전체 적용으로 봄)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4710}
  misconceptions:
  - id: MC-CAL-4710
    outcome_code: '70'
    wrong_work: '$(a\sin x+b\cos x)''$를 $a\cos x+b\sin x$로 계산(코사인의 도함수 부호 오류)'
    detect_cue: $f'(x)$에 $a\cos x+b\sin x$가 있고 연립식이 $\sqrt3a+b=0$ 꼴
    feedback: $(\cos x)'=-\sin x$입니다. $(a\sin x+b\cos x)'=a\cos x-b\sin x$.
    remedy: [RL-1]
- id: '2'
  stem: |
    [5-2] 닫힌구간 $[0,\pi]$에서 $f(x)$의 최댓값을 구하시오. [10점]
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{1}{\sqrt2}e^{\frac{3\pi}{4}}', equivalents: ['exp(3*pi/4)/sqrt(2)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=e^{x+\frac\pi3}\sin\left(x+\frac\pi3\right)$, 극값은 $x=\frac{5\pi}{12}$ 하나. 끝점 $f(0)=\frac{\sqrt3}2e^{\frac\pi3}$, $f(\pi)<0$과 비교.
    steps:
    - {id: 2a, content: '$f\left(\dfrac{5\pi}{12}\right)=\dfrac1{\sqrt2}e^{\frac{3\pi}4}>\dfrac{\sqrt3}2e^{\frac\pi3}$ ⇒ 최댓값 $\dfrac1{\sqrt2}e^{\frac{3\pi}4}$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - $\dfrac12=\cos\dfrac\pi3$, $\dfrac{\sqrt3}2=\sin\dfrac\pi3$이다.
    - 닫힌구간의 최댓값 후보는 극값과 양 끝값이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.50 예시답안
    steps:
    - id: 2b-1
      content: |
        $a=\cos\dfrac\pi3$, $b=\sin\dfrac\pi3$이므로 삼각함수의 합 공식을 이용하여 식을 정리하면,
        $$f(x)=e^{x+\frac\pi3}\left\{\sin x\cos\left(\dfrac\pi3\right)+\sin\left(\dfrac\pi3\right)\cos x\right\}=e^{x+\frac\pi3}\sin\left(x+\dfrac\pi3\right)$$
        를 얻을 수 있다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        함수를 미분하여
        $$f'(x)=e^{x+\frac\pi3}\left\{\sin\left(x+\dfrac\pi3\right)+\cos\left(x+\dfrac\pi3\right)\right\}=0\ \Rightarrow\ \tan\left(x+\dfrac\pi3\right)=-1$$
        를 풀면, 구간 $[0,\pi]$에서는 $x+\dfrac\pi3=\dfrac{3\pi}4$일 때만 극값을 가진다는 것을 알 수 있다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        따라서 $f(x)$의 최댓값은
        $$f(0)=e^{\frac\pi3}\sin\left(\dfrac\pi3\right)=\dfrac{\sqrt3}{2}e^{\frac\pi3},\quad f\left(\dfrac{5\pi}{12}\right)=e^{\frac{3\pi}4}\sin\left(\dfrac{3\pi}4\right)=\dfrac1{\sqrt2}e^{\frac{3\pi}4},\quad f(\pi)=e^{\frac{4\pi}3}\sin\left(\dfrac{4\pi}3\right)=-\dfrac{\sqrt3}{2}e^{\frac{4\pi}3}$$
        중 하나이다. 마지막 값은 음수이므로 제외하고, 앞의 두 값을 비교하여 $f\left(\dfrac{5\pi}{12}\right)=\dfrac1{\sqrt2}e^{\frac{3\pi}4}$가 최댓값이라는 결론을 내린다.
        $$\dfrac{\sqrt3}{2}e^{\frac\pi3}<\dfrac1{\sqrt2}e^{\frac{3\pi}4}\iff\sqrt{\dfrac32}<e^{\frac{5\pi}{12}}\iff\dfrac32<2^{\frac52}<e^{\frac{5\pi}6}=(2.718\ldots)^{\frac56\times3.14\ldots}$$
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 4
      evidence: $f(x)=e^{x+\frac\pi3}\sin\left(x+\dfrac\pi3\right)$를 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: $x=\dfrac{5\pi}{12}$일 때 극값을 가진다는 것을 얻었다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: 극값과 구간의 끝점을 비교하여 최댓값 $f\left(\dfrac{5\pi}{12}\right)=\dfrac1{\sqrt2}e^{\frac{3\pi}4}$를 얻었다.
      depends_on: []
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여(공식 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4711}
  misconceptions:
  - id: MC-CAL-4711
    outcome_code: '70'
    wrong_work: 극값이 하나뿐이므로 끝값과 비교하지 않고 바로 최댓값으로 결론짓거나, 끝값 $f(0)$을 최댓값으로 잡음
    detect_cue: $f(0)$과 $f\left(\tfrac{5\pi}{12}\right)$의 대소 비교가 없음, 또는 답이 $\dfrac{\sqrt3}2e^{\frac\pi3}$
    feedback: 닫힌구간의 최댓값은 극값과 양 끝값 중 가장 큰 값입니다. 끝값도 계산해 비교하세요.
    remedy: [RL-2]

