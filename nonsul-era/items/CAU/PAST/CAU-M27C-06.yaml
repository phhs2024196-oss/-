stimuli: []

stem: |
  좌표평면에서 점 $\mathrm{P}(t,0)$을 지나는 직선 중 곡선 $y=e^{\lvert x\rvert}$과 한 점에서 만나는 직선이 세 개 있다. 세 직선이 곡선 $y=e^{\lvert x\rvert}$과 만나는 점을 각각 $\mathrm{A}(a_1,a_2)$, $\mathrm{B}(b_1,b_2)$, $\mathrm{C}(c_1,c_2)$라 하고, 삼각형 ABC의 넓이를 $S(t)$라 하자. [20점]

subparts:
- id: '1'
  stem: |
    [6-1] 점 A, B, C의 좌표를 $t$의 함수로 표현하시오. (단, $2\le t\le3$이고 $a_1<b_1<c_1$이다.) [10점]
  points: 10
  depends_on: []
  answer: {kind: expression, value: '\mathrm{A}(0,1),\ \mathrm{B}(t,e^t),\ \mathrm{C}(t+1,e^{t+1})', equivalents: ['A(0,1), B(t,e^t), C(t+1,e^(t+1))'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 꺾인 점을 지나는 직선, 수직선, 접선의 세 종류.
    steps:
    - {id: 1a, content: '$\mathrm{A}(0,1)$, $\mathrm{B}(t,e^t)$, 접선 조건 $\dfrac{e^x}{x-t}=e^x$에서 $\mathrm{C}(t+1,e^{t+1})$', criteria: [1.B1, 1.B2]}
    hint_ladder:
    - 곡선의 개형을 그려 보자. 매끄럽지 않은 점이 있다.
    - 기울기가 없는 직선도 직선이다.
    - 오른쪽 가지에 $(t,0)$에서 그은 접선의 접점은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.51 예시답안
    steps:
    - id: 1b-1
      content: |
        $2\le t\le3$일 때 한 점에서 만나는 점이 $\mathrm{A}(0,1)$과 $\mathrm{B}(t,e^t)$가 있다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        세 번째는 곡선 $y=e^{\lvert x\rvert}$과 접하는 점이다. 접점 $(x,e^x)$와 $(t,0)$의 기울기를 고려하면 $\dfrac{e^x}{x-t}=e^x$를 만족하고 식을 정리하면 $x=t+1$이다. 따라서 $\mathrm{C}(t+1,e^{t+1})$이다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 6
      evidence: $\mathrm{A}(0,1)$, $\mathrm{B}(t,e^t)$를 구했다(각 3점씩 합하여 6점).
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: $\mathrm{C}(t+1,e^{t+1})$을 구했다.
      depends_on: []
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여, 채점자 재량 −0.5~+0.5점(공식 주석은 [6-2] 아래에 표기, 문제 6 전체 적용으로 봄)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4712}
  misconceptions:
  - id: MC-CAL-4712
    outcome_code: '70'
    wrong_work: 한 점에서 만나는 직선을 접선으로만 생각해 첨점 A(0,1)을 지나는 직선이나 수직선 $x=t$를 빠뜨림
    detect_cue: 세 점 중 A 또는 B가 없고 접점만 여러 개 찾으려 함
    feedback: 곡선과 한 점에서 만나는 직선에는 접선 말고도 꺾인 점을 지나는 직선, $y$축에 평행한 직선이 있습니다. 그래프 개형을 그려 확인하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    [6-2] 정적분 $\displaystyle\int_2^3S(t)\,dt$를 구하시오. [10점]
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac12(2e^4-4e^3+2e^2+1)', equivalents: ['e^4-2e^3+e^2+1/2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $S(t)=\dfrac12\left((e-1)te^t-e^t+1\right)$, $\int te^t\,dt=(t-1)e^t$.
    steps:
    - {id: 2a, content: '$\dfrac12\int_2^3\left((e-1)te^t-e^t+1\right)dt=\dfrac12(2e^4-4e^3+2e^2+1)$', criteria: [2.B1, 2.B2]}
    hint_ladder:
    - 세 꼭짓점 좌표로 넓이를 구하자(밑변 BC와 높이 또는 신발끈 공식).
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.51 예시답안
    steps:
    - id: 2b-1
      content: |
        점 B, C를 지나는 직선의 방정식은 $(e^{t+1}-e^t)x-y+e^t-t(e^{t+1}-e^t)=0$이다. $\mathrm{A}(0,1)$에서 직선까지 거리는 $\dfrac{\left\lvert-1+e^t-t(e^{t+1}-e^t)\right\rvert}{\sqrt{(e^{t+1}-e^t)^2+1}}$이고 $\overline{\mathrm{BC}}=\sqrt{(e^{t+1}-e^t)^2+1}$이다. 따라서
        $$S(t)=\dfrac12\left((e-1)te^t-e^t+1\right)$$
      criteria: [2.B1]
    - id: 2b-2
      content: |
        이고 구하는 정적분 값은 다음과 같다.
        $$\dfrac12\int_2^3\left((e-1)te^t-e^t+1\right)dt=\dfrac12\left(2e^4-4e^3+2e^2+1\right)$$
      criteria: [2.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: $S(t)=\dfrac12\left((e-1)te^t-e^t+1\right)$을 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: 정적분하여 $\dfrac12\left(2e^4-4e^3+2e^2+1\right)$을 구했다.
      depends_on: []
      steps: [2b-2]
    deductions:
    - code: D2-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여(공식 주석)
      effect: minus
      value: 0.5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-4713}
  misconceptions:
  - id: MC-CAL-4713
    outcome_code: '70'
    wrong_work: '$\int te^t\,dt$를 $\dfrac{t^2}{2}e^t$ 등으로 계산(부분적분 미적용)'
    detect_cue: 결과에 $\dfrac92e^3$, $2e^2$ 같은 $t^2$ 계수가 섞인 값
    feedback: 다항식×지수함수는 부분적분으로 $\int te^t\,dt=te^t-\int e^t\,dt=(t-1)e^t+C$입니다.
    remedy: [RL-2]

