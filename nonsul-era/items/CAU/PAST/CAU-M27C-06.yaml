intent: 그래프의 개형을 이해하고 직선과 한 점에서 만나는 점을 구할 수 있는지 평가한다. 구한 점들로 이루어진 삼각형의 넓이를 구하고 정적분을 수행할 수 있는지 평가한다(가이드북 출제 의도).
key_idea: '점 $(t,0)$을 지나 $y=e^{\lvert x\rvert}$와 한 점에서 만나는 직선은 꺾인 점 $\mathrm{A}(0,1)$을 지나는 직선, 수직선 $x=t$, 오른쪽 가지에 접하는 직선(접점 $x=t+1$)의 세 개다.'
stuck: 곡선과 한 점에서 만나는 직선을 접선만이 아니라 첨점을 지나는 직선과 $y$축에 평행한 직선까지 빠짐없이 찾는 분류
