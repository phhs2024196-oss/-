      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: $1=\tan^2(\theta_1-\theta_2)=\left(\dfrac{m_1-m_2}{1+m_1m_2}\right)^2=\dfrac{(m_1+m_2)^2-4m_1m_2}{(1+m_1m_2)^2}$을 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: $t^2=6+6\sqrt5$를 구했다.
      depends_on: []
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 채점자 재량 — 답안의 완성도에 따라 −0.5~+0.5점(공식 주석). 논리 전개 과정이 맞으면 답이 틀리더라도 1~2점의 부분 점수 부여(공식 주석)
      effect: minus
      value: 0.5
