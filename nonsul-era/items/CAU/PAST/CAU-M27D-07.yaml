stimuli: []

stem: |
  점 $\mathrm{P}(t,3)$에서 타원 $\dfrac{x^2}{6}+\dfrac{y^2}{3}=1$에 그은 두 접선이 이루는 예각이 $45^\circ$일 때, $t^2$의 값을 구하시오. [15점]
  [그림: 타원 $\dfrac{x^2}{6}+\dfrac{y^2}{3}=1$과 제1사분면 쪽의 점 P에서 타원에 그은 두 접선, 두 접선 사이의 각 $45^\circ$ 표시]

subparts:
- id: '1'
  stem: |
    두 접선이 이루는 예각이 $45^\circ$일 때, $t^2$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '6+6\sqrt5', equivalents: ['6+6*sqrt(5)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $m_1+m_2=\dfrac{6t}{t^2-6}$, $m_1m_2=\dfrac{6}{t^2-6}$, $(1+m_1m_2)^2=(m_1+m_2)^2-4m_1m_2$.
    steps:
    - {id: 1a, content: '$t^4=12t^2+144$ ⇒ $t^2=6+6\sqrt5$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 기울기가 $m$인 타원의 접선의 방정식을 쓰자.
    - 두 접선의 기울기는 $m$에 대한 어떤 이차방정식의 두 근인가?
    - 두 직선이 이루는 각의 탄젠트를 기울기로 나타내자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 논술가이드북(자연) p.52 예시답안
    steps:
    - id: 1b-1
      content: |
        타원의 접선 $y=mx\pm\sqrt{6m^2+3}$가 점 $\mathrm{P}(t,3)$을 지나면 $3-mt=\pm\sqrt{6m^2+3}$이다. 양변을 제곱하여 정리해서 $m$에 관한 이차방정식 $(t^2-6)m^2-6tm+6=0$을 얻는다. 이 이차방정식의 두 근을 $m_1=\tan\theta_1$, $m_2=\tan\theta_2\ (m_1>m_2)$라 하면, 근과 계수의 관계에 의하여 $m_1+m_2=\dfrac{6t}{t^2-6}$과 $m_1m_2=\dfrac{6}{t^2-6}$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        점 P를 지나는 두 접선이 이루는 예각이 $\theta_1-\theta_2=45^\circ$이므로
        $$1=\tan^2(\theta_1-\theta_2)=\left(\dfrac{m_1-m_2}{1+m_1m_2}\right)^2=\dfrac{(m_1+m_2)^2-4m_1m_2}{(1+m_1m_2)^2}$$
        이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $$\dfrac{t^4}{(t^2-6)^2}=(1+m_1m_2)^2=(m_1+m_2)^2-4m_1m_2=\dfrac{12t^2+144}{(t^2-6)^2}$$
        에서 $t^4-12t^2-144=0$이다. $t^2\ge0$이므로 $t^2=6+6\sqrt5$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
