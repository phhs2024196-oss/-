  - id: MC-GEO-4703
    outcome_code: '70'
    wrong_work: '타원의 접선을 $y=mx\pm\sqrt{6m^2-3}$ 또는 $y=mx\pm\sqrt{3m^2+6}$처럼 $a^2$, $b^2$를 바꾸어 씀'
    detect_cue: 기울기에 대한 이차방정식의 계수가 $(t^2-6)m^2-6tm+6$과 다름, 답이 $6+6\sqrt5$가 아님
    feedback: '타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$에서 기울기 $m$인 접선은 $y=mx\pm\sqrt{a^2m^2+b^2}$입니다. 여기서 $a^2=6$, $b^2=3$.'
    remedy: [RL-1]

