stimuli:
- label: ㄱ
  body: |
    실수 $a,b,c$에 대하여 좌표평면 위의 방정식 $y=ax^2+bx+2$가 나타내는 도형을 원점에 대하여 대칭이동한 후, $x$축의 방향으로 $1$만큼, $y$축의 방향으로 $-6$만큼 평행이동한 도형의 방정식은 $y=-x^2+4x+c$이다.
- label: ㄴ
  body: |
    좌표평면 위의 직선 $l_1$과 $l_2$는 다음 조건을 만족한다.

    (1) $l_1$의 기울기는 음수이고 $l_2$의 기울기는 양수이다.

    (2) $l_1$과 $l_2$는 모두 제시문 (ㄱ)의 곡선 $y=ax^2+bx+2$에 접한다.

    (3) $l_1$과 $l_2$는 모두 제시문 (ㄱ)의 곡선 $y=-x^2+4x+c$에 접한다.
- label: ㄷ
  body: |
    제시문 (ㄱ)의 곡선 $y=ax^2+bx+2$ 및 제시문 (ㄴ)의 두 직선 $l_1$, $l_2$로 둘러싸인 도형의 넓이를 $S$라고 하자.
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
subparts:
- id: '1'
  stem: (10점) 제시문 (ㄱ)의 $a$, $b$, $c$의 값을 구하고 그 근거를 논술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=1; b=2; c=-11
    equivalents:
    - (a,b,c)=(1,2,-11)
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 방정식 $y=ax^2+bx+2$를 원점 대칭이동하면 $y=-ax^2+bx-2$, 평행이동하면 $y=-ax^2+(b+2a)x-a-b-8$이므로 계수를 비교한다.
    steps:
    - id: 1a-1
      content: $a=1$, $b=2$, $c=-11$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 방정식 $y=ax^2+bx+2$가 나타내는 도형을 원점에 대하여 대칭이동한 도형의 방정식은 $-y=a(-x)^2+b(-x)+2$, 즉 $y=-ax^2+bx-2$이다.
      source_flow: 16381_ad45.pdf p.37 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 이 방정식이 나타내는 도형을 $x$축의 방향으로 $1$만큼, $y$축의 방향으로 $-6$만큼 평행이동한 도형의 방정식은 $y=-a(x-1)^2+b(x-1)-2-6=-ax^2+(b+2a)x-a-b-8$이고, 방정식 $y=-x^2+4x+c$와 같으므로 $a=1$, $b=2$, $c=-11$이다.
      source_flow: 16381_ad45.pdf p.37 예시답안 [논제 1]
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 원점 대칭이동한 도형의 방정식 $y=-ax^2+bx-2$를 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 평행이동한 방정식 $y=-ax^2+(b+2a)x-a-b-8$과 $y=-x^2+4x+c$의 계수를 비교해 $a=1$, $b=2$, $c=-11$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: (20점) 제시문 (ㄷ)의 $S$의 값을 구하고 그 근거를 논술하시오.
  points: 20
  depends_on:
  - '1'
  answer:
    kind: value
    value: 125/12
    equivalents:
    - S=\frac{125}{12}
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=x^2+2x+2$의 접선이 $y=-x^2+4x-11$에도 접할 조건으로 접점 $t=-2,3$을 구해 $l_1$, $l_2$를 얻고, 교점의 $x$좌표 $\frac12$를 경계로 정적분한다.
    steps:
    - id: 2a-1
      content: $l_1:y=-2x-2$, $l_2:y=8x-7$, $S=\frac{125}{12}$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
      - 2.A3
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $f(x)=x^2+2x+2$라 하면 $f'(x)=2x+2$이다. 곡선 $y=x^2+2x+2$ 위의 점 $(t,f(t))$에서 접선의 방정식은 $y=2(t+1)(x-t)+t^2+2t+2=2(t+1)x+2-t^2$이다.
      source_flow: 16381_ad45.pdf p.37 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: '또한 이 직선이 곡선 $y=-x^2+4x-11$에 접하면 방정식 $2(t+1)x+2-t^2=-x^2+4x-11$, 즉 $x^2-2(t-1)x-t^2+13=0$은 중근을 가지고, $\frac D4=(t-1)^2-t^2-13=0$, 즉 $2t^2-2t-12=0$이다. [판독확인: 공식 해설 원문 그대로. 이차방정식은 $x^2+2(t-1)x-t^2+13=0$, $\frac D4=(t-1)^2+t^2-13$이어야 $2t^2-2t-12$가 나오므로 부호 오기로 보임 — 고치지 않음]'
      source_flow: 16381_ad45.pdf p.37 예시답안 [논제 2]
      criteria:
      - 2.A1
    - id: 2b-3
      content: $(t-3)(t+2)=0$에서 $t=-2$ 또는 $t=3$이므로 $l_1$의 방정식은 $y=-2x-2$, $l_2$의 방정식은 $y=8x-7$이다.
      source_flow: 16381_ad45.pdf p.38 예시답안 [논제 2]
      criteria:
      - 2.A2
    - id: 2b-4
      content: $l_1$과 $l_2$의 교점의 $x$좌표가 $\frac12$이므로 $$S=\int_{-2}^{\frac12}(x^2+2x+2-(-2x-2))dx+\int_{\frac12}^{3}(x^2+2x+2-(8x-7))dx=\int_{-2}^{\frac12}(x^2+4x+4)dx+\int_{\frac12}^{3}(x^2-6x+9)dx=\left[\frac{x^3}{3}+2x^2+4x\right]_{-2}^{\frac12}+\left[\frac{x^3}{3}-3x^2+9x\right]_{\frac12}^{3}=\frac{125}{12}$$
      source_flow: 16381_ad45.pdf p.38 예시답안 [논제 2]
      criteria:
      - 2.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $f(x)=x^2+2x+2$의 점 $(t,f(t))$에서의 접선 $y=2(t+1)x+2-t^2$을 구했다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: 접선이 $y=-x^2+4x-11$에 접할 조건으로 이차방정식의 판별식 $=0$을 세워 $2t^2-2t-12=0$을 얻었다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: $t=-2$ 또는 $t=3$을 구하고 $l_1:y=-2x-2$, $l_2:y=8x-7$을 정했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-3
    - id: 2.A3
      mark_type: A
      points: 5
      evidence: $l_1$, $l_2$의 교점의 $x$좌표 $\frac12$에서 구간을 나눠 정적분하여 $S=\frac{125}{12}$를 구했다.
      depends_on:
      - 2.M1
      - 2.A2
      steps:
      - 2b-4
