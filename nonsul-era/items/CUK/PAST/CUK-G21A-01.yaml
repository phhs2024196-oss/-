intent: 도형의 이동, 미분 및 적분의 개념을 이해하고 이를 활용할 수 있는지, 이차함수에 접하는 접선과 도형으로 둘러싸인 부분의 넓이를 구하는 방법을 이해하고 활용할 수 있으며 이를 논술할 수 있는지 평가한다.
key_idea: 원점 대칭 후 평행이동으로 $a,b,c$를 정한 뒤, 접점의 $x$좌표 $t$에서의 접선이 다른 포물선에도 접할 조건(판별식 $=0$)으로 $t=-2,3$을 구해 $l_1$, $l_2$를 얻고, 교점의 $x$좌표 $\frac12$에서 구간을 나눠 정적분으로 $S$를 구한다.
stuck: 접선이 두 포물선에 동시에 접한다는 조건을 접점 $t$ 하나로 세우는 단계, 둘러싸인 도형의 넓이를 두 직선의 교점에서 구간을 나눠 적분하는 단계
