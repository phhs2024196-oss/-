      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 8
      evidence: $g=h\circ f$, $h(t)=t+\frac{36}{t}$가 $[\frac{25}{4},\frac{27}{4}]$에서 증가함을 보이고 $M=\frac{145}{12}$, $m=\frac{1201}{100}$을 구했다.
      depends_on:
      - 2.M1
