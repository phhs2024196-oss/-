  answer:
    kind: value
    value: M=145/12; m=1201/100
    equivalents:
    - M=\frac{145}{12}, m=\frac{1201}{100}
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=0$으로 $[1,2]$에서의 증감을 조사해 $\frac{25}{4}\le f(x)\le\frac{27}{4}$를 얻고, $h(t)=t+\frac{36}{t}$가 이 구간에서 증가함을 이용해 $M=h(\frac{27}{4})$, $m=h(\frac{25}{4})$를 구한다.
    steps:
    - id: 2a-1
      content: $f$의 치역 $[\frac{25}{4},\frac{27}{4}]$, $M=\frac{145}{12}$, $m=\frac{1201}{100}$
      criteria:
      - 2.M1
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |-
        $f(x)=x^3-6x^2+\frac{45}{4}x$이면 $f'(x)=3x^2-12x+\frac{45}{4}=3\left(x-\frac32\right)\left(x-\frac52\right)$이다. 이때 $f'(x)=0$을 만족시키는 $x$의 값은 $x=\frac32$ 또는 $x=\frac52$이다. 닫힌구간 $[1,2]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.

        [표: $x=1$일 때 $f(x)=\frac{25}{4}$, $1<x<\frac32$에서 $f'(x)>0$이고 증가, $x=\frac32$일 때 $f'(x)=0$, $f(x)=\frac{27}{4}$, $\frac32<x<2$에서 $f'(x)<0$이고 감소, $x=2$일 때 $f(x)=\frac{26}{4}$]

        따라서 $1\le x\le2$일 때, 함수 $f(x)$는 다음의 범위를 갖는다. $$\frac{25}{4}\le f(x)\le\frac{27}{4}$$
      source_flow: 16381_ad45.pdf p.41 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 함수 $h(t)=t+\frac{36}{t}$라 하면 $g(x)=h(f(x))$이다. 따라서 제시문 (ㄴ)의 최댓값 $M$은 닫힌구간 $\left[\frac{25}{4},\frac{27}{4}\right]$에서 함수 $h(t)$의 최댓값과 같고 최솟값 $m$은 닫힌구간 $\left[\frac{25}{4},\frac{27}{4}\right]$에서 함수 $h(t)$의 최솟값과 같다. $\frac{25}{4}\le t\le\frac{27}{4}$일 때, $h'(t)=1-\frac{36}{t^2}>0$이므로 함수 $h(t)$는 닫힌구간 $\left[\frac{25}{4},\frac{27}{4}\right]$에서 증가한다. 따라서 함수 $g(x)$의 최댓값 $M$과 최솟값 $m$은 다음과 같다. $$M=h\left(\frac{27}{4}\right)=\frac{27}{4}+\frac{16}{3}=\frac{145}{12},\quad m=h\left(\frac{25}{4}\right)=\frac{25}{4}+\frac{144}{25}=\frac{1201}{100}$$
      source_flow: 16381_ad45.pdf p.41 예시답안 [논제 2]
      criteria:
      - 2.A1
