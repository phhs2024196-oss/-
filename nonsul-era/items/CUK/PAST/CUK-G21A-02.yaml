stimuli:
- label: ㄱ
  body: |
    계수가 실수인 삼차함수 $f(x)$는 다음을 만족한다.

    (1) $f\left(\frac12\right)=\frac{17}{4}$

    (2) 실수 $a$에 대하여 $f(a)=0$이고 $f''(a)=-12$이다. (단, $f''(x)$는 $f(x)$의 이계도함수이다.)

    (3) 복소수 $z$에 대하여 $2z+9$, $-z-\frac34i$는 방정식 $f(x)=0$의 서로 다른 두 허근이다. (단, $i=\sqrt{-1}$)
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$에 대하여 정의역이 $\{x\mid1\le x\le2\}$인 다음 함수 $g(x)$의 최댓값은 $M$, 최솟값은 $m$이다.

    $$g(x)=f(x)+\frac{36}{f(x)}$$
stem: 제시문 (ㄱ)~(ㄴ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
subparts:
- id: '1'
  stem: (15점) 제시문 (ㄱ)의 함수 $f(x)$를 구하고 그 근거를 논술하시오.
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: x**3-6*x**2+45*x/4
    equivalents:
    - f(x)=x^3-6x^2+\frac{45}{4}x
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $z=\alpha+\beta i$로 두고 두 허근이 서로 켤레임을 이용해 $\alpha=-3$, $\beta=\frac34$를 구한 뒤, $f(x)=b(x-a)(x^2-6x+\frac{45}{4})$에 조건 (1), (2)를 넣어 $a=0$, $b=1$을 구한다.
    steps:
    - id: 1a-1
      content: 두 허근 $3\pm\frac32i$, $a=0$, $b=1$, $f(x)=x^3-6x^2+\frac{45}{4}x$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $z=\alpha+\beta i$($\alpha$, $\beta$는 실수)라 하자. $2z+9$, $-z-\frac34i$가 방정식 $f(x)=0$의 서로 다른 두 허근이므로 다음을 만족한다. $$\overline{2z+9}=2\alpha+9-2\beta i=-\alpha-\left(\beta+\frac34\right)i=-z-\frac34i$$ 따라서 $\alpha=-3$, $\beta=\frac34$이고, 방정식 $f(x)=0$의 두 허근은 $3+\frac32i$, $3-\frac32i$이다.
      source_flow: 16381_ad45.pdf p.40 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 방정식 $f(x)=0$의 실근을 $a$라고 하면 함수 $f(x)$는 다음과 같이 나타낼 수 있다. $$f(x)=b(x-a)\left(x^2-6x+\frac{45}{4}\right)\ (\text{단, }b\ne0)$$ 제시문 (ㄱ)의 조건 (1)로부터 $f\left(\frac12\right)=\frac{17}{2}b\left(\frac12-a\right)=\frac{17}{4}$이므로 $b=\frac{1}{1-2a}$이다. 이것과 제시문 (ㄱ)의 조건 (2)로부터 $f''(a)=2b(2a-6)=-12$이므로 $a-3=-3(1-2a)$이다. 따라서 $a=0$, $b=1$이고, 제시문 (ㄱ)의 함수 $f(x)$는 다음과 같다. $$f(x)=x\left(x^2-6x+\frac{45}{4}\right)=x^3-6x^2+\frac{45}{4}x$$
      source_flow: 16381_ad45.pdf p.40 예시답안 [논제 1]
      criteria:
      - 1.A1
