key_idea: 명제 $p$는 $a_n$, $a_{n+1}$의 홀짝에 따라 $a_{n+2}$의 홀짝이 정해지는 점을 이용해 $a_{k+2}$, $a_{k+1}$이 홀수이면 앞 항으로 계속 홀수임을 거꾸로 보여 참임을 증명한다. 이를 $a_3=19$에 적용하면 $a_5$가 홀수일 때만 가능하고, $a_5$가 짝수인 경우는 $a_4$의 홀짝으로 나눠 모순임을 보여 $A=\{11\}$을 얻는다.
stuck: $a_{k+2}$, $a_k$가 홀수일 때 $a_{k+1}$이 짝수이면 모순임을 보이는 단계, $a_5$와 $a_4$의 홀짝에 따른 경우 분류
