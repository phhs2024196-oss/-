  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $a_k$와 $a_{k+2}$가 모두 홀수라고 하자. $a_n$이 홀수이고 $a_{n+1}$이 짝수이면 $a_n+a_{n+1}$이 홀수이므로 $a_{n+2}=3(a_n+a_{n+1})+1$은 짝수이다. 그런데 $a_k$와 $a_{k+2}$가 모두 홀수이므로 $a_{k+1}$은 홀수이다.
      source_flow: 16381_ad45.pdf p.43 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 또한, $a_n$이 짝수이고 $a_{n+1}$이 홀수이면 $a_n+a_{n+1}$이 홀수이므로 $a_{n+2}=3(a_n+a_{n+1})+1$은 짝수이다. 그런데 $a_k$와 $a_{k+1}$이 모두 홀수이므로 $k-1$이 자연수일 때 $a_{k-1}$도 홀수이다.
      source_flow: 16381_ad45.pdf p.43 예시답안 [논제 1]
      criteria:
      - 1.R1
    - id: 1b-3
      content: 그러면 $k-2$가 자연수일 때 $a_{k-1}$과 $a_k$가 모두 홀수이므로 $a_{k-2}$도 홀수이다. 이와 같이 계속하면 $a_{k-3},\cdots,a_1$이 모두 홀수임을 얻는다.
      source_flow: 16381_ad45.pdf p.43 예시답안 [논제 1]
      criteria:
      - 1.R2
    - id: 1b-4
      content: 따라서 $n\le k+2$인 모든 자연수 $n$에 대하여 $a_n$은 홀수이다. 그러므로 명제 $p$는 참이다.
      source_flow: 16381_ad45.pdf p.43 예시답안 [논제 1]
      criteria:
      - 1.R3
