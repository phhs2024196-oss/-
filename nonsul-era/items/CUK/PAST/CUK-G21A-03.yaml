stimuli:
- label: ㄱ
  body: |
    수열 $\{a_n\}$의 각 항은 양의 정수이고 모든 자연수 $n$에 대하여 다음이 성립한다.

    $$a_{n+2}=\begin{cases}3(a_n+a_{n+1})+1 & (a_n+a_{n+1}\text{이 홀수인 경우})\\[4pt] \dfrac{a_n+a_{n+1}}{2} & (a_n+a_{n+1}\text{이 짝수인 경우})\end{cases}$$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 수열 $\{a_n\}$과 자연수 $k$에 대하여 명제 $p$는 다음과 같다.

    $p$: $a_k$와 $a_{k+2}$가 모두 홀수이면 $n\le k+2$인 모든 자연수 $n$에 대하여 $a_n$은 홀수이다.
- label: ㄷ
  body: |
    제시문 (ㄱ)의 수열 $\{a_n\}$에 대하여 $a_3=19$이고 $a_6=22$일 때, 가능한 모든 $a_1$을 원소로 갖는 집합을 $A$라고 하자.
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (40점)
