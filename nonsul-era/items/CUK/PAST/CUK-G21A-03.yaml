  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a_5$가 홀수이면 명제 $p$($k=3$)로 $a_1,\cdots,a_5$가 모두 홀수이고 거꾸로 계산해 $a_1=11$을 얻는다. $a_5$가 짝수이면 $a_4$의 홀짝으로 나눠 모두 모순이다.
    steps:
    - id: 2a-1
      content: '$a_5$ 홀수: 수열 $11,27,19,23,21,22$, $a_5$ 짝수: 조건을 만족하는 $a_1$ 없음, $A=\{11\}$'
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: '$a_5$가 홀수인 경우와 짝수인 경우로 나누어 생각하자. i) $a_5$가 홀수인 경우: 명제 $p$가 참이고 $a_3=19$이므로 명제 $p$에 의해 $a_1,a_2,\cdots,a_5$는 모두 홀수이다. 따라서 $\frac{a_4+a_5}{2}=a_6=22$이고 $a_5=\frac{a_3+a_4}{2}=\frac{19+a_4}{2}$이다. 그러므로 $a_4+a_5=44$이고 $2a_5=19+a_4$이다. 따라서 $a_5=21$이고 $a_4=23$이다. 그런데 $a_2+a_3=2a_4$이므로 $a_2=2a_4-a_3=46-19=27$이고, $a_1+a_2=2a_3$이므로 $a_1=2a_3-a_2=38-27=11$이다. 따라서 수열 $11,27,19,23,21,22,\cdots$이 주어진 조건을 만족하고 $a_1=11$이다.'
      source_flow: 16381_ad45.pdf p.44 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 'ii) $a_5$가 짝수인 경우: 이 경우 $a_4$가 홀수인 경우와 짝수인 경우로 나누어 살펴보자. 1) $a_4$가 홀수인 경우: $a_5=\frac{a_3+a_4}{2}$이고 $a_6=3(a_4+a_5)+1$이 성립한다. 따라서 $2a_5=19+a_4$, $a_4+a_5=7$이다. 그러므로 $3a_5=26$이다. 이를 만족하는 양의 정수 $a_5$는 없으므로 주어진 조건을 만족하는 양의 정수 $a_1$은 없다. 2) $a_4$가 짝수인 경우: $a_5=3(a_3+a_4)+1$이고 $a_6=\frac{a_4+a_5}{2}$을 만족한다. 따라서 $a_5=3a_4+58$, $a_4+a_5=44$이다. 그러므로 $4a_4+14=0$이다. 이를 만족하는 양의 정수 $a_4$는 없으므로 주어진 조건을 만족하는 양의 정수 $a_1$은 없다.'
      source_flow: 16381_ad45.pdf p.44 예시답안 [논제 2]
      criteria:
      - 2.A1
    - id: 2b-3
      content: 따라서 $A=\{11\}$이다.
      source_flow: 16381_ad45.pdf p.44 예시답안 [논제 2]
      criteria:
      - 2.A2
