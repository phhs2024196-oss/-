intent: 확률, 조건부확률 및 수열과 급수의 개념을 이해하고 이를 활용할 수 있는지, 확률의 합의 법칙과 무한급수를 이해하고 활용할 수 있는지, 조건부확률을 구하는 방법을 이해하고 활용하며 이를 논술할 수 있는지 평가한다.
key_idea: 시합이 짝수번째 게임에서 끝나는 경우와 홀수번째 게임에서 끝나는 경우로 나눠 수아 승리 확률을 $\frac{9}{25}\left(\frac{2}{15}\right)^{n-1}$, $\frac35\left(\frac{2}{15}\right)^n$으로 구하고 무한등비급수로 $p=\frac{33}{65}$를 얻는다. $2020$번째 게임에서 끝나는 경우 수아와 은우의 승리 확률을 구해 조건부확률 $q=\frac{27}{47}$을 얻는다.
stuck: 이전 게임의 승자에 따라 다음 게임 승률이 달라지므로 승리 경로가 ○×○×…○○ 꼴로 정해지는 것을 파악하는 단계, 조건부확률의 분모를 $2020$번째 게임에서 끝날 확률로 잡는 단계
