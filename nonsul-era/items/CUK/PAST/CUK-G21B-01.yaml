    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 짝수번째 종료 $\frac{9}{25}(\frac{2}{15})^{n-1}$과 홀수번째 종료 $\frac35(\frac{2}{15})^n$을 합쳐 $p=\frac{33}{65}$, $2020$번째 종료 확률로 조건부확률 $q=\frac{27}{47}$을 구한다.
    steps:
    - id: 1a-1
      content: $p=\frac{33}{65}$, $q=\frac{27}{47}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
      - 1.A4
      - 1.A5
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 시합이 짝수번의 게임에서 끝날 경우와 홀수번의 경우에서 끝날 때로 나누어 생각한다. (1) $2n$번에 게임에서 수아가 승리할 경우는 (○는 수아 승리, ×는 은우 승리) ○×○×○…×○○ (×○가 $n-1$번)이므로 그 확률은 $$\frac35\left(\frac25\times\frac13\right)^{n-1}\frac35=\frac{9}{25}\left(\frac{2}{15}\right)^{n-1}\ (n\ge1)$$
      source_flow: 16381_ad45.pdf p.46 예시답안 [논제]
      criteria:
      - 1.M1
    - id: 1b-2
      content: (2) $2n+1$번에 게임에서 수아가 승리할 경우는 ×○×○…×○○ (×○가 $n$번)이므로 그 확률은 $$\left(\frac25\times\frac13\right)^n\frac35=\frac35\left(\frac{2}{15}\right)^n\ (n\ge1)$$
      source_flow: 16381_ad45.pdf p.46 예시답안 [논제]
      criteria:
      - 1.A1
    - id: 1b-3
      content: 따라서 구하는 확률 $p$는 $$p=\sum_{n=1}^{\infty}\frac{9}{25}\left(\frac{2}{15}\right)^{n-1}+\sum_{n=1}^{\infty}\frac35\left(\frac{2}{15}\right)^n=\frac{9}{25}\cdot\frac{1}{1-\frac{2}{15}}+\frac35\cdot\frac{\frac{2}{15}}{1-\frac{2}{15}}=\frac{33}{65}$$
      source_flow: 16381_ad45.pdf p.46 예시답안 [논제]
      criteria:
      - 1.A2
    - id: 1b-4
      content: 또 $2020$번의 게임에서 시합이 끝났을 때 수아가 승리할 확률은 위 (1)에서 $\frac{9}{25}\left(\frac{2}{15}\right)^{1009}$이고,
      source_flow: 16381_ad45.pdf p.46 예시답안 [논제]
      criteria:
      - 1.A3
    - id: 1b-5
      content: 은우가 승리할 경우는 ×○×○…×○×× (×○가 $1009$번)이므로 그 확률은 $$\left(\frac25\times\frac13\right)^{1009}\frac25\cdot\frac23=\frac{4}{15}\left(\frac{2}{15}\right)^{1009}$$
      source_flow: 16381_ad45.pdf p.47 예시답안 [논제]
      criteria:
      - 1.A4
    - id: 1b-6
      content: 따라서 구하는 조건부확률 $q$는 $$q=\frac{\frac{9}{25}\left(\frac{2}{15}\right)^{1009}}{\frac{9}{25}\left(\frac{2}{15}\right)^{1009}+\frac{4}{15}\left(\frac{2}{15}\right)^{1009}}=\frac{27}{47}$$이다.
      source_flow: 16381_ad45.pdf p.47 예시답안 [논제]
      criteria:
      - 1.A5
