stimuli:
- label: ㄱ
  body: |
    수아와 은우는 게임을 연속으로 $2$번 먼저 이기는 사람이 승자가 되는 시합을 한다.
- label: ㄴ
  body: |
    제시문 (ㄱ)의 시합에서 게임을 이길 확률은 각각 다음과 같다.

    | | 첫 번째 게임 | 수아가 이긴 다음 게임 | 은우가 이긴 다음 게임 |
    |---|---|---|---|
    | 수아가 이길 확률 | $\frac35$ | $\frac35$ | $\frac13$ |
    | 은우가 이길 확률 | $\frac25$ | $\frac25$ | $\frac23$ |
- label: ㄷ
  body: |
    제시문 (ㄱ)의 시합에 대하여 확률 $p$와 $q$는 다음과 같다.

    $p$: 수아가 승자가 될 확률

    $q$: $2020$번째 게임에서 시합이 끝났을 때, 수아가 승자가 될 확률
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 논제에 답하시오. (170점)
