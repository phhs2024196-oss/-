intent: 수열의 극한을 이해하고 극한으로 정의된 함수를 이해하는지, 함수의 연속을 이해하고 이를 활용할 수 있는지, 접선의 개념을 이해하고 활용할 수 있는지 확인한다. 함수의 연속성을 이해하고, 이를 활용해 접선의 개념을 활용할 수 있는지를 평가한다.
key_idea: $|x|<1$, $|x|>1$, $x=1$로 나눠 $f(x)=x+5,\ 3x^2,\ 6$을 구하고, $y=\sqrt{a(x+b)}+3$이 $y=x+5$에 $-1<x\le1$에서 접할 조건으로 $a=8-4b$($1<b<\frac32$, $2<a<4$)를 얻는다. 이 관계를 이용해 $y=\sqrt{2b(x+a)}+\frac52$의 $x=-1,1$에서의 값의 범위를 평가하여 교점의 개수 $m=3$을 구한다.
stuck: $f$가 $x=\pm1$ 근처에서 불연속인 조각 함수임을 파악하는 단계, 접점이 $-1<x\le1$ 위에 있어야 한다는 조건에서 $a$, $b$의 관계를 얻는 단계, $x=\pm1$에서의 함숫값 평가로 교점 개수를 확정하는 단계
