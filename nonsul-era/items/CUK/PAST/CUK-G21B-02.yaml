stimuli:
- label: ㄱ
  body: |
    함수 $f(x)$는 다음과 같다.

    $$f(x)=\lim_{n\to\infty}\frac{3x^{3n+2}+3x^{2n}+x+5}{x^{3n}+1}\qquad(x\ne-1)$$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$에 대하여 두 곡선 $y=f(x)$, $y=\sqrt{a(x+b)}+3$은 한 점에서 공통인 접선을 가진다. (단, $a>0$, $b>1$)
- label: ㄷ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$와 제시문 (ㄴ)을 만족하는 $a$, $b$에 대하여 두 곡선 $y=f(x)$, $y=\sqrt{2b(x+a)}+\frac52$의 교점의 개수를 $m$이라 하자.
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 논제에 답하시오. (170점)
