      depends_on:
      - 1.M1
      steps:
      - 1b-2
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 60
      evidence: $x=-1,1$에서 $y=\sqrt{2b(x+a)}+\frac52$의 값을 $a=8-4b$로 평가해 $4<\cdot<5$, $5<\cdot<6$임을 보이고 $m=3$을 구했다.
      depends_on:
      - 1.M1
      - 1.A1
      steps:
      - 1b-4
