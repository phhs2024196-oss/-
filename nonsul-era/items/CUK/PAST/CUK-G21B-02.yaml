  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 극한으로 정의된 $f$를 구간별로 구하고, 접점 조건으로 $a=8-4b$($1<b<\frac32$)를 얻은 뒤 $x=-1,1$에서 $y=\sqrt{2b(x+a)}+\frac52$의 값을 평가해 교점 $3$개를 확정한다.
    steps:
    - id: 1a-1
      content: $f(x)=x+5$($\lvert x\rvert<1$), $3x^2$($\lvert x\rvert>1$), $f(1)=6$, $a=8-4b$, $m=3$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: '극한으로 정의된 함수 $f(x)$는 $\lvert x\rvert<1$, $\lvert x\rvert>1$, $x=1$에서 각각 다음과 같다. ① $\lvert x\rvert<1$: $f(x)=\lim_{n\to\infty}\frac{3x^{3n+2}+3x^{2n}+x+5}{x^{3n}+1}=x+5$ ② $\lvert x\rvert>1$: $f(x)=\lim_{n\to\infty}\frac{3x^{3n+2}+3x^{2n}+x+5}{x^{3n}+1}=\lim_{n\to\infty}\frac{3x^2+\frac{3}{x^n}+\frac{1}{x^{3n-1}}+\frac{5}{x^{3n}}}{1+\frac{1}{x^{3n}}}=3x^2$ ③ $x=1$: $f(1)=\lim_{n\to\infty}\frac{3(1)^{3n+1}+3(1)^{2n}+1+5}{(1)^{3n}+1}=6$'
      source_flow: 16381_ad45.pdf p.49 예시답안 [논제]
      criteria:
      - 1.M1
    - id: 1b-2
      content: '한편, 양수 $a$와 $1$보다 큰 실수 $b$에 대하여 제시문 (ㄴ)을 만족하기 위해서는 곡선 $y=\sqrt{a(x+b)}+3$과 곡선 $y=f(x)$가 아래의 그림과 같이 $-1<x\le1$에서 접해야 한다. [그림: 곡선 $y=\sqrt{a(x+b)}+3$이 $-1<x\le1$에서 직선 $y=x+5$에 접하고, $x<-1$, $x>1$에서는 $y=3x^2$ 곡선, $x=1$에서 점 $(1,6)$이 표시됨] 즉, 접점을 $(t,t+5)$라 하면 실수 $t$는 다음을 만족한다. $$\frac{a}{2\sqrt{a(t+b)}}=1,\quad t+5=\sqrt{a(t+b)}+3$$'
      source_flow: 16381_ad45.pdf p.49 예시답안 [논제]
      criteria:
      - 1.A1
    - id: 1b-3
      content: 이를 $t$에 관해서 풀면, $a=8-4b$임을 알고, $-1<t\le1$과 $a>0$, $b>1$에 의해 제시문 (ㄴ)을 만족하는 $a$, $b$의 관계식은 다음과 같다. $$a=8-4b\ \left(1<b<\frac32\right)$$
      source_flow: 16381_ad45.pdf p.50 예시답안 [논제]
      criteria:
      - 1.A1
    - id: 1b-4
      content: '제시문 (ㄷ)의 $m$ 값을 구하기 위해 $x=-1,1$에서의 $y=\sqrt{2b(x+a)}+\frac52$의 함숫값을 살펴보자. 앞서 구한 $a$와 $b$의 관계식 $a=8-4b\ \left(1<b<\frac32\right)$를 이용하면 $x=-1,1$에서의 $y=\sqrt{2b(x+a)}+\frac52$의 함숫값인 $\sqrt{2b(-1+a)}+\frac52$, $\sqrt{2b(1+a)}+\frac52$에 대해 다음의 부등식을 얻는다. $$4<\frac52+\sqrt3<\sqrt{2b(-1+a)}+\frac52=\sqrt{2b(7-4b)}+\frac52<\frac52+\sqrt6<5$$ $$5<\frac52+3<\sqrt{2b(1+a)}+\frac52=\sqrt{2b(9-4b)}+\frac52<\frac52+\frac{9}{2\sqrt2}<6$$ 함수 $y=\sqrt{2b(x+a)}+\frac52$는 $x\ge-a$에서 연속이고 $2<a<4$이므로 위 두 부등식에 의해 $m=3$이다. (아래 그림 참고) [그림: $y=x+5$, $y=3x^2$, $y=\sqrt{2b(x+a)}+\frac52$의 그래프. 무리함수 곡선이 $x=-1$, $x=1$ 근방에서 $f$의 두 조각 및 선분 $y=x+5$와 만나는 모양]'
      source_flow: 16381_ad45.pdf p.50 예시답안 [논제]
      criteria:
      - 1.A2
