intent: 다항식과 지수로 구성된 식의 사칙연산을 이해하고 이를 활용할 수 있는지 평가하고자 한다. 식을 곱셈과 나눗셈을 통하여 원하는 형태로 나타낼 수 있는지 평가하는 문제이다.
key_idea: $2^n+61$에서 $\left(1+\frac{63}{2^n-2}\right)=\left(1+\frac{A}{m_1}\right)\left(1+\frac{1}{2^n+k_1}\right)$로 변형해 $k_1=60$일 때 $\frac{A}{m_1}=\frac{31}{2^{n-1}-1}$이 되게 하고, 같은 방식으로 $k_2=1$일 때 $\frac{B}{m_2}=\frac{15}{2^{n-2}}$, $k_3=14$일 때 $\frac{C}{m_3}=\frac{7}{2^{n-3}}$이 되어 조건을 만족시키는 $(k_1,k_2,k_3)=(60,1,14)$를 구한다.
stuck: 양변에 $2^n+k_1$을 곱해 식을 정리하면 $k_1$이 약분되어 $\frac{A}{m_1}$이 $n$에 대한 간단한 분수가 되도록 $k_1$을 정하는 발상, 같은 과정을 $k_2$, $k_3$에 반복하는 단계
