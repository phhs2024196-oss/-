stimuli:
- label: ㄱ
  body: |
    $20$보다 큰 자연수 $n$에 대하여 $2^n+61$는 다음을 만족한다. (단, $A$, $m_1$, $k_1$은 자연수)

    $$2^n+61=(2^n-2)\left(1+\frac{A}{m_1}\right)\left(1+\frac{1}{2^n+k_1}\right)$$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 $1+\frac{A}{m_1}$은 다음을 만족한다. (단, $B$, $m_2$, $k_2$은 자연수)

    $$1+\frac{A}{m_1}=\left(1+\frac{B}{m_2}\right)\left(1+\frac{1}{2^{n-1}-k_2}\right)$$
- label: ㄷ
  body: |
    제시문 (ㄴ)의 $1+\frac{B}{m_2}$은 다음을 만족한다. (단, $C$, $m_3$, $k_3$은 자연수)

    $$1+\frac{B}{m_2}=\left(1+\frac{C}{m_3}\right)\left(1+\frac{1}{2^{n-2}+k_3}\right)$$
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 논제에 답하시오. (180점)
subparts:
- id: '1'
  stem: 제시문 (ㄱ), (ㄴ), (ㄷ)을 모두 만족시키는 순서쌍 $(k_1,k_2,k_3)$을 $1$개 구하고 그 근거를 논술하시오. (단, $0<k_2<10<k_3<50<k_1<100$) (180점)
  points: 180
  depends_on: []
  answer:
    kind: value
    value: k1=60; k2=1; k3=14
    equivalents:
    - (k_1,k_2,k_3)=(60,1,14)
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $2^n+61$을 $(2^n-2)$로 나눈 식에 $2^n+k_1$을 곱해 $k_1=60$이면 $\frac{A}{m_1}=\frac{31}{2^{n-1}-1}$이 됨을 보이고, 같은 방법으로 $k_2=1$, $k_3=14$를 구한다.
    steps:
    - id: 1a-1
      content: $k_1=60$, $k_2=1$, $k_3=14$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
      - 1.A4
      - 1.A5
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $2^n+61=(2^n-2)\left(1+\frac{A}{m_1}\right)\left(1+\frac{1}{2^n+k_1}\right)$에서 $1+\frac{63}{2^n-2}=\left(1+\frac{A}{m_1}\right)\left(1+\frac{1}{2^n+k_1}\right)$ 양변에 $2^n+k_1$을 곱하면 $$(2^n+k_1)\left(1+\frac{63}{2^n-2}\right)=\left(1+\frac{A}{m_1}\right)(2^n+k_1+1)$$
      source_flow: 16381_ad45.pdf p.52 예시답안 [논제]
      criteria:
      - 1.M1
    - id: 1b-2
      content: (좌변) $=\frac{2^n+k_1}{2^n-2}(2^n+61)=\left(1+\frac{k_1+2}{2^n-2}\right)(2^n+61)$이 되고 $k_1=60$이면 $\frac{A}{m_1}=\frac{31}{2^{n-1}-1}$이 되어 우변과 같아지고 주어진 조건을 만족한다.
      source_flow: 16381_ad45.pdf p.52 예시답안 [논제]
      criteria:
      - 1.A1
    - id: 1b-3
      content: 또한, $1+\frac{A}{m_1}=1+\frac{31}{2^{n-1}-1}=\left(1+\frac{B}{m_2}\right)\left(1+\frac{1}{2^{n-1}-k_2}\right)$에서 양변에 $2^{n-1}-k_2$를 곱하면 $$(2^{n-1}-k_2)\left(1+\frac{31}{2^{n-1}-1}\right)=\left(1+\frac{B}{m_2}\right)(2^{n-1}-k_2+1)$$이 되고
      source_flow: 16381_ad45.pdf p.52 예시답안 [논제]
      criteria:
      - 1.A2
    - id: 1b-4
      content: 이 식을 전개하여 정리하면 $(2^{n-1}-k_2)\frac{31}{2^{n-1}-1}=1+\frac{B(2^{n-1}-k_2+1)}{m_2}$이 된다. 따라서 $\frac{B}{m_2}=\frac{1}{2^{n-1}-k_2+1}\left(\frac{31(2^{n-1}-k_2)}{2^{n-1}-1}-1\right)$를 만족하고, $k_2=1$이면 $\frac{B}{m_2}=\frac{30}{2^{n-1}}=\frac{15}{2^{n-2}}$가 되어 주어진 조건을 만족한다.
      source_flow: 16381_ad45.pdf p.52 예시답안 [논제]
      criteria:
      - 1.A3
    - id: 1b-5
      content: $1+\frac{B}{m_2}=1+\frac{15}{2^{n-2}}=\left(1+\frac{C}{m_3}\right)\left(1+\frac{1}{2^{n-2}+k_3}\right)$에서 양변에 $2^{n-2}+k_3$을 곱하면 $$(2^{n-2}+k_3)\left(1+\frac{15}{2^{n-2}}\right)=\left(1+\frac{C}{m_3}\right)(2^{n-2}+k_3+1)$$이 되고
      source_flow: 16381_ad45.pdf p.53 예시답안 [논제]
      criteria:
      - 1.A4
    - id: 1b-6
      content: (좌변) $=\frac{2^{n-2}+k_3}{2^{n-2}}(2^{n-2}+15)=\left(1+\frac{k_3}{2^{n-2}}\right)(2^{n-2}+15)$이므로 $k_3=14$이면 $\frac{C}{m_3}=\frac{14}{2^{n-2}}=\frac{7}{2^{n-3}}$이 되어 주어진 조건을 만족한다. 따라서 $k_1=60$, $k_2=1$, $k_3=14$이다.
      source_flow: 16381_ad45.pdf p.53 예시답안 [논제]
      criteria:
      - 1.A5
