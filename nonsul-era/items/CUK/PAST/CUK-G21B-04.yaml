stimuli:
- label: ㄱ
  body: |
    닫힌구간 $\left[0,\frac\pi4\right]$에서 정의된 함수 $f(x)$는 다음과 같다.

    $$f(x)=2\int_0^x\tan\theta\sec^2\theta\,d\theta+1$$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$에 대하여 수열 $\{a_n\}$의 일반항은 다음과 같다.

    $$a_n=\frac{1}{4^n}f\left(\frac{\pi}{2^{n+2}}\right)$$
- label: ㄷ
  body: |
    제시문 (ㄴ)의 수열 $\{a_n\}$에 대하여 $S$는 다음과 같다.

    $$S=\sum_{n=1}^{\infty}a_n$$
- label: ㄹ
  body: |
    [사인함수의 덧셈정리]

    1) $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$

    2) $\alpha=\beta$일 때, $\sin2\alpha=2\sin\alpha\cos\alpha$
stem: 제시문 (ㄱ)~(ㄹ)을 읽고 논제에 답하시오. (180점)
subparts:
- id: '1'
  stem: 제시문 (ㄷ)의 $S$의 값을 구하고 그 근거를 논술하시오. (180점)
  points: 180
  depends_on: []
  answer:
    kind: expression
    value: 2-16/pi**2
    equivalents:
    - S=2-\frac{16}{\pi^2}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 치환적분으로 $f(x)=\frac{1}{\cos^2x}$를 구하고, 배각 공식으로 $a_n=\frac{1}{4^{n-1}\sin^2(\pi/2^{n+1})}-\frac{1}{4^n\sin^2(\pi/2^{n+2})}$ 꼴의 차로 쓴 뒤 부분합을 소거하고 극한을 취한다.
    steps:
    - id: 1a-1
      content: $f(x)=\frac{1}{\cos^2x}$, $\sum_{k=1}^na_k=2-\frac{1}{4^n\sin^2\frac{\pi}{2^{n+2}}}$, $S=2-\frac{16}{\pi^2}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
      - 1.A4
      - 1.A5
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 치환적분법에 의해서 제시문 (ㄱ)의 함수 $f(x)$는 다음과 같다. $$f(x)=2\int_0^x\tan\theta(\tan\theta)'d\theta+1=\left[\tan^2\theta\right]_0^x+1=\tan^2x+1=\frac{1}{\cos^2x}$$
      source_flow: 16381_ad45.pdf p.55 예시답안 [논제]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 제시문 (ㄴ)의 수열 $\{a_n\}$의 일반항은 다음과 같다. $$a_n=\frac{1}{4^n\cos^2\left(\frac{\pi}{2^{n+2}}\right)}$$
      source_flow: 16381_ad45.pdf p.55 예시답안 [논제]
      criteria:
      - 1.A1
    - id: 1b-3
      content: 사인함수의 덧셈정리에 의해서 $$\frac{1}{\sin^2\left(\frac{\pi}{2^2}\right)}=\frac{1}{4\sin^2\left(\frac{\pi}{2^{1+2}}\right)\times\cos^2\left(\frac{\pi}{2^{1+2}}\right)}=\frac{1}{4\sin^2\left(\frac{\pi}{2^{1+2}}\right)}+\frac{1}{4\cos^2\left(\frac{\pi}{2^{1+2}}\right)}=\frac{1}{4\sin^2\left(\frac{\pi}{2^{1+2}}\right)}+a_1$$ $$\frac{1}{4\sin^2\left(\frac{\pi}{2^{1+2}}\right)}=\frac{1}{4^2\sin^2\left(\frac{\pi}{2^{2+2}}\right)}+\frac{1}{4^2\cos^2\left(\frac{\pi}{2^{2+2}}\right)}=\frac{1}{4^2\sin^2\left(\frac{\pi}{2^{2+2}}\right)}+a_2$$ $$\vdots$$ $$\frac{1}{4^{n-2}\sin^2\left(\frac{\pi}{2^{n-2+2}}\right)}=\frac{1}{4^{n-1}\sin^2\left(\frac{\pi}{2^{n-1+2}}\right)}+\frac{1}{4^{n-1}\cos^2\left(\frac{\pi}{2^{n-1+2}}\right)}=\frac{1}{4^{n-1}\sin^2\left(\frac{\pi}{2^{n-1+2}}\right)}+a_{n-1}$$ $$\frac{1}{4^{n-1}\sin^2\left(\frac{\pi}{2^{n-1+2}}\right)}=\frac{1}{4^n\sin^2\left(\frac{\pi}{2^{n+2}}\right)}+\frac{1}{4^n\cos^2\left(\frac{\pi}{2^{n+2}}\right)}=\frac{1}{4^n\sin^2\left(\frac{\pi}{2^{n+2}}\right)}+a_n$$
      source_flow: 16381_ad45.pdf p.56 예시답안 [논제]
      criteria:
      - 1.A2
    - id: 1b-4
      content: 모두 더하면 $$\sum_{k=1}^{n}a_k=\frac{1}{\sin^2\left(\frac{\pi}{2^2}\right)}-\frac{1}{4^n\sin^2\left(\frac{\pi}{2^{n+2}}\right)}$$
      source_flow: 16381_ad45.pdf p.56 예시답안 [논제]
      criteria:
      - 1.A3
    - id: 1b-5
      content: 한편, $\lim_{x\to0}\frac{\sin x}{x}=1$이므로 $$\lim_{n\to\infty}\frac{1}{4^n\sin^2\left(\frac{\pi}{2^{n+2}}\right)}=\frac{16}{\pi^2}\lim_{n\to\infty}\left(\frac{\frac{\pi}{2^{n+2}}}{\sin\left(\frac{\pi}{2^{n+2}}\right)}\right)^2=\frac{16}{\pi^2}$$
      source_flow: 16381_ad45.pdf p.56 예시답안 [논제]
      criteria:
      - 1.A4
    - id: 1b-6
      content: 따라서 제시문 (ㄷ)의 $S$ 값은 다음과 같다. $$S=\lim_{n\to\infty}\left(\sum_{k=1}^{n}a_k\right)=\frac{1}{\sin^2\left(\frac{\pi}{2^2}\right)}-\lim_{n\to\infty}\frac{1}{4^n\sin^2\left(\frac{\pi}{2^{n+2}}\right)}=2-\frac{16}{\pi^2}$$
      source_flow: 16381_ad45.pdf p.56 예시답안 [논제]
      criteria:
      - 1.A5
