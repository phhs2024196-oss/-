intent: 정적분의 치환적분법을 활용할 수 있는지, 삼각함수의 덧셈정리를 이용하여 식을 분리할 수 있는지, 삼각함수의 극한을 활용하여 급수의 합을 구할 수 있는지 확인한다.
key_idea: 치환적분으로 $f(x)=\tan^2x+1=\frac{1}{\cos^2x}$을 구해 $a_n=\frac{1}{4^n\cos^2\frac{\pi}{2^{n+2}}}$을 얻고, 사인함수의 배각 공식으로 $\frac{1}{4^{n-1}\sin^2\frac{\pi}{2^{n+1}}}=\frac{1}{4^n\sin^2\frac{\pi}{2^{n+2}}}+a_n$을 이용해 부분합 $\sum_{k=1}^{n}a_k=\frac{1}{\sin^2\frac{\pi}{4}}-\frac{1}{4^n\sin^2\frac{\pi}{2^{n+2}}}$을 구한 뒤 $\lim_{x\to0}\frac{\sin x}{x}=1$로 $S=2-\frac{16}{\pi^2}$을 구한다.
stuck: $\tan\theta\sec^2\theta$를 $\tan\theta(\tan\theta)'$로 보고 치환하는 단계, $\frac{1}{4^n\cos^2}$ 꼴 항이 $\frac{1}{4^{n-1}\sin^2}$의 차로 소거(망원)되도록 배각 공식을 쓰는 단계
