  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=4x^3+4x^2$, $g(x)=x^4+x$를 인수분해해 $x+1$을 약분하고 극한을 구한다.
    steps:
    - id: 2a-1
      content: $L=\lim_{x\to-1}\frac{x^2-x+1}{4x}=-\frac34$
      criteria:
      - 2.M1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: '$f(x)=4x^3+4x^2$이고 $g(x)=x^4+x$이므로 $$L=\lim_{x\to-1}\frac{g(x)}{f(x)}=\lim_{x\to-1}\frac{x^4+x}{4(x^3+x^2)}=\lim_{x\to-1}\frac{x^3+1}{4x(x+1)}=\lim_{x\to-1}\frac{x^2-x+1}{4x}=-\frac34$$이다. [보충: $x^3+1=(x+1)(x^2-x+1)$]'
      source_flow: 17901_ab58.pdf p.42 예시답안 [논제 2]
      criteria:
      - 2.M1
