stimuli:
- label: ㄱ
  body: |
    자연수 $m$, $n$, $l$과 상수 $a$, $b$, $c$에 대하여 두 함수 $f(x)=ax^{m+1}+bx^m$, $g(x)=x^n+cx^l$은 다음 조건을 만족시킨다. (단, $a\neq0$, $b\neq0$, $n>l$)

    (가) $f(1)=8$, $g(1)=2$

    (나) $\lim_{x\to\infty}\frac{g'(x)}{f(x)}=1$, $\lim_{x\to0}\frac{xg(x)}{f(x)}=\frac14$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$와 $g(x)$에 대한 극한값 $L$은 다음과 같다.

    $$L=\lim_{x\to-1}\frac{g(x)}{f(x)}$$
stem: 제시문 (ㄱ)~(ㄴ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
subparts:
- id: '1'
  stem: (20점) 제시문 (ㄱ)의 $a$, $b$, $c$의 값을 각각 구하고 그 근거를 논술하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: a=4; b=4; c=1
    equivalents:
    - a=4, b=4, c=1
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(1)=2$로 $c=1$, 두 극한 조건으로 $n=m+2$, $a=m+2$, $l=m-1$, $b=4$를 얻고 $f(1)=8$로 $m=2$를 정한다.
    steps:
    - id: 1a-1
      content: $c=1$, $n=m+2$, $a=m+2$ / $l=m-1$, $b=4$ / $m=2$, $a=4$, $b=4$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $g(1)=2$에서 $c=1$이다.
      source_flow: 17901_ab58.pdf p.42 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\lim_{x\to\infty}\frac{g'(x)}{f(x)}=\lim_{x\to\infty}\frac{nx^{n-1}+lx^{l-1}}{ax^{m+1}+bx^m}=1$에서 $n=m+2$, $a=m+2$이다.
      source_flow: 17901_ab58.pdf p.42 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-3
      content: $\lim_{x\to0}\frac{xg(x)}{f(x)}=\lim_{x\to0}\frac{x^{n+1}+x^{l+1}}{ax^{m+1}+bx^m}=\frac14$에서 $l=m-1$, $b=4$이다.
      source_flow: 17901_ab58.pdf p.42 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-4
      content: '$f(1)=8$에서 $m=2$이고 $a=4$, $b=4$이다. [보충: $f(1)=a+b=(m+2)+4=8$]'
      source_flow: 17901_ab58.pdf p.42 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-5
      content: 따라서 $a=4$, $b=4$, $c=1$이다.
      source_flow: 17901_ab58.pdf p.42 예시답안 [논제 1]
      criteria:
      - 1.A1
