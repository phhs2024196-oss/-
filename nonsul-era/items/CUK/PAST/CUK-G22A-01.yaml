intent: 가) 다양한 형태의 함수의 극한을 계산할 수 있는지 확인한다. 나) 다항함수의 도함수를 구할 수 있는지 확인한다. 다) 다항식의 인수분해를 하고 이를 활용할 수 있는지 확인한다.
key_idea: $g(1)=2$로 $c=1$, $x\to\infty$에서 최고차항 비교로 $n=m+2$, $a=m+2$, $x\to0$에서 최저차항 비교로 $l=m-1$, $b=4$를 얻고 $f(1)=8$로 $m=2$를 정해 $f(x)=4x^3+4x^2$, $g(x)=x^4+x$에서 $L=-\frac34$를 구한다.
stuck: $x\to0$ 극한에서는 최고차항이 아니라 최저차항을 비교해야 한다는 점, $x\to-1$ 극한의 $\frac00$ 꼴을 인수분해로 해소하는 단계
