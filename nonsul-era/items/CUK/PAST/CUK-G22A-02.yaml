stimuli:
- label: ㄱ
  body: |
    한 변의 길이가 1인 정사각형 ABCD의 점 A에 바둑돌이 놓여있다. 동전을 던져 앞면이 나오면 3, 뒷면이 나오면 2만큼 정사각형의 둘레를 따라 시계방향으로 바둑돌을 옮기는 시행을 한다. 8회 시행 후 바둑돌이 점 A로 돌아오게 되는 경우의 수를 $a$라고 하자.
- label: ㄴ
  body: |
    한 변의 길이가 1인 정팔각형 ABCDEFGH의 점 A에 바둑돌이 놓여있다. 빨간 구슬, 노란 구슬, 파란 구슬이 한 개씩 들어있는 주머니에서 구슬을 한 개 꺼내 빨간 구슬이면 3, 노란 구슬이면 2, 파란 구슬이면 1 만큼씩 정팔각형의 둘레를 따라 시계방향으로 바둑돌을 옮기는 시행을 한다. 8회 시행 후 바둑돌이 점 A로 돌아오게 되는 경우의 수를 $b$라고 하자. [판독확인: 원문 조판이 '수를 라고 b하자'로 어긋나 있어 '$b$라고 하자'로 옮김] (단, 꺼낸 구슬은 다시 주머니에 넣는다.)
