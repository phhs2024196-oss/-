stimuli:
- label: ㄱ
  body: |
    최고차항의 계수가 1인 삼차함수 $f(x)$는 다음 조건을 만족시킨다.

    (가) $f(0)=1$

    (나) 함수 $f(x)$의 극값 중 하나는 $3$이다.

    (다) 도함수 $f'(x)$는 $x=0$에서 극값을 가진다.
- label: ㄴ
  body: |
    실수 $a$, $b$에 대하여 제시문 (ㄱ)의 함수 $f(x)$는 다음 조건을 만족시킨다.

    실수 $k$에 대하여 방정식 $f(x)=k$의 실근의 개수를 $n$이라 할 때,

    (가) $a\le k\le b$이면 $n\ge2$

    (나) $k<a$ 또는 $k>b$이면 $n=1$
- label: ㄷ
  body: |
    제시문 (ㄱ)의 삼차함수 $f(x)$와 제시문 (ㄴ)의 실수 $a$, $b$에 대하여 실수 $k$가 $a\le k\le b$일 때 방정식 $f(x)=k$의 실근 중에서 가장 작은 근을 $\alpha$, 가장 큰 근을 $\beta$라고 하자. 또한, 닫힌구간 $[a,b]$에 속하는 모든 $k$에 대한 $\beta-\alpha$의 최솟값을 $m$, 최댓값을 $M$이라고 하자.
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (40점)
subparts:
- id: '1'
  stem: (20점) 제시문 (ㄴ)의 $a$, $b$의 값을 구하고 그 근거를 논술하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: a=-1; b=3
    equivalents:
    - a=-1, b=3
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(0)=1$, $f'$이 $x=0$에서 극값을 가짐으로 $f(x)=x^3+qx+1$, 극댓값 $3$으로 $f(x)=x^3-3x+1$, $a$는 극솟값, $b$는 극댓값이다.
    steps:
    - id: 1a-1
      content: $f(x)=x^3-3x+1$, 극댓값 $3$(x=-1), 극솟값 $-1$(x=1) / $a=-1$, $b=3$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)$가 최고차항의 계수가 1인 삼차함수이고 $f(0)=1$이므로 $f(x)=x^3+px^2+qx+1$이다.
      source_flow: 17901_ab58.pdf p.47 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f(x)$의 도함수를 $g(x)$라 하면 $g(x)=f'(x)=3x^2+2px+q$이고, 도함수 $g(x)$가 $x=0$에서 극값을 가지므로 $g'(0)=2p=0$이다. 따라서 $f(x)=x^3+qx+1$이고 $f'(x)=3x^2+q$이다.
      source_flow: 17901_ab58.pdf p.47 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-3
      content: $f(x)$가 극값을 가지므로 $q<0$이고, $c=\sqrt{-q}/\sqrt3$라 하면 $q=-3c^2$이므로 $f(x)=x^3-3c^2x+1$이다.
      source_flow: 17901_ab58.pdf p.47 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-4
      content: $f'(\pm c)=0$이고 $c>0$이므로 $x=-c$에서 극댓값 $f(-c)=2c^3+1>1$을 가지고, $x=c$에서 극솟값 $f(c)=-2c^3+1<1$을 가진다. 그러므로 $2c^3+1=3$이고 $c=1$이다. 따라서 $f(x)=x^3-3x+1$이다.
      source_flow: 17901_ab58.pdf p.47 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-5
      content: $f(x)$는 $x=-1$에서 극댓값 $3$, $x=1$에서 극솟값 $-1$을 가진다. 제시문 (ㄴ)의 $a$는 $f(x)$의 극솟값이고 $b$는 $f(x)$의 극댓값이므로 $a=-1$, $b=3$이다.
      source_flow: 17901_ab58.pdf p.47 예시답안 [논제 1]
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: $f(x)=x^3+px^2+qx+1$에서 $p=0$, 극값 조건으로 $c=1$을 구해 $f(x)=x^3-3x+1$을 얻었다.
      steps:
      - 1b-1
      - 1b-2
      - 1b-3
      - 1b-4
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: $f$의 극댓값 $3$, 극솟값 $-1$로부터 $a=-1$, $b=3$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-5
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: (20점) 제시문 (ㄷ)의 $m$, $M$에 대하여 $\frac Mm$의 값을 구하고 그 근거를 논술하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 2*sqrt(3)/3
    equivalents:
    - \frac{2\sqrt3}{3}
    - M=2\sqrt3, m=3
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)-k=(x-\alpha)(x-t)(x-\beta)$에서 $\alpha$, $\beta$가 $x^2+tx+t^2-3=0$의 두 근이므로 $(\beta-\alpha)^2=-3t^2+12$이다.
    steps:
    - id: 2a-1
      content: $-1\le t\le1$에서 $M=2\sqrt3$, $m=3$ / $\frac Mm=\frac{2\sqrt3}{3}$
      criteria:
      - 2.M1
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $-1\le k\le3$에 대하여 $f(t)=k$이고 $-1\le t\le1$인 $t$는 유일하게 존재하고 $\alpha\le t\le\beta$, $f(\alpha)=f(t)=f(\beta)=k$, $f(x)-k=(x-\alpha)(x-t)(x-\beta)$이다.
      source_flow: 17901_ab58.pdf p.47~48 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: $f(x)-k=f(x)-f(t)=x^3-3x-(t^3-3t)=(x-t)(x^2+tx+t^2-3)$이므로 $\alpha$, $\beta$는 방정식 $x^2+tx+t^2-3=0$의 두 근이다.
      source_flow: 17901_ab58.pdf p.47~48 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-3
      content: 따라서 $(\beta-\alpha)^2=(\beta+\alpha)^2-4\alpha\beta=t^2-4(t^2-3)=-3t^2+12$이다.
      source_flow: 17901_ab58.pdf p.47~48 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-4
      content: '$-1\le t\le1$이므로 $M=2\sqrt3$이고 $m=3$이다. 따라서 $\frac Mm=\frac{2\sqrt3}{3}$이다. [보충: $-1\le t\le1$에서 $9\le(\beta-\alpha)^2\le12$]'
      source_flow: 17901_ab58.pdf p.47~48 예시답안 [논제 2]
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: $f(x)-k=(x-\alpha)(x-t)(x-\beta)$로 $\alpha$, $\beta$가 $x^2+tx+t^2-3=0$의 두 근임을 보이고 $(\beta-\alpha)^2=-3t^2+12$를 얻었다.
      steps:
      - 2b-1
      - 2b-2
      - 2b-3
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: $-1\le t\le1$에서 $M=2\sqrt3$, $m=3$으로 $\frac Mm=\frac{2\sqrt3}{3}$을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-4
