intent: 가) 함수의 극대, 극소의 의미를 활용할 수 있는지 확인한다. 나) 도함수를 활용하여 함수의 그래프를 파악할 수 있는지 확인한다. 다) 이차방정식의 근과 계수의 관계를 활용할 수 있는지 확인한다.
key_idea: $f(0)=1$과 $f'$의 극값 조건으로 $f(x)=x^3+qx+1$, 극댓값 $3$으로 $f(x)=x^3-3x+1$을 정하고 극솟값 $-1$, 극댓값 $3$이 $a$, $b$이다. $f(x)=k$의 세 근 $\alpha$, $t$, $\beta$에서 $\alpha$, $\beta$가 $x^2+tx+t^2-3=0$의 두 근이므로 $(\beta-\alpha)^2=-3t^2+12$의 최대·최소로 $\frac Mm$을 구한다.
stuck: 삼차함수의 극값 중 하나가 $3$일 때 극댓값($2c^3+1$)이 3임을 가려내는 단계, 가장 작은 근과 가장 큰 근 사이 차를 한 근 $t$로 나타내 근과 계수의 관계로 처리하는 단계
