key_idea: 주사위 눈의 최대·최소 차가 2 또는 4인 경우의 수 $48+48$로 상자 A의 선택 확률 $\frac49$를 구하고, 상자 A, B의 비복원 추출을 경우 분류해 $p=\frac{19}{45}$, 첫 번째 흰 공·두 번째 검은 공의 확률 $\frac{73}{270}$을 구한 뒤 $q=\frac{73/270}{26/45}$로 조건부확률을 계산한다.
stuck: 주사위 눈의 최대·최소 차 경우의 수를 중복 없이 세는 단계, 첫 번째 시행에서 상자를 달리 고른 경우(A→B, B→A)에는 두 번째 상자가 비어 있지 않다는 점과 같은 상자에서 비복원일 때 공의 수가 줄어든다는 점을 반영하는 단계
