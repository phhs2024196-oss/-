stimuli:
- label: ㄱ
  body: |
    상자 A에는 검은 공 1개와 흰 공 4개가 들어 있고 상자 B에는 검은 공 3개와 흰 공 2개가 들어 있다. 서로 다른 주사위 3개를 동시에 던져 나온 눈의 수 중 가장 큰 수와 가장 작은 수의 차이가 2 또는 4이면 상자 A에서, 아니면 상자 B에서 공을 하나 뽑는 시행을 두 번 반복한다. (단, 뽑힌 공은 상자에 다시 넣지 않는다.)
- label: ㄴ
  body: |
    제시문 (ㄱ)의 시행에 대하여 첫 번째 시행에서 검은 공이 나올 확률을 $p$, 첫 번째 시행에서 흰 공이 나왔을 때 두 번째 시행에서 검은 공이 나올 확률을 $q$라고 하자.
stem: 제시문 (ㄱ)~(ㄴ)을 읽고 논제에 답하시오. (170점)
