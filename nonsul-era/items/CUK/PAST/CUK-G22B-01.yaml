  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 주사위 눈의 최대·최소 차가 2 또는 4일 확률 $\frac49$로 상자를 정하고 전확률로 $p$를, 첫 번째 흰 공·두 번째 검은 공의 4가지 경우의 합과 $1-p$의 비로 $q$를 구한다.
    steps:
    - id: 1a-1
      content: $P(A)=\frac49$, $p=\frac{19}{45}$ / $q=\frac{73/270}{26/45}=\frac{73}{156}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
      - 1.A4
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 주사위 3개를 던져 가장 큰 수와 가장 작은 수가 각각 3과 1로 차이가 2인 경우는 $(1,1,3)$, $(1,2,3)$, $(1,3,3)$이고 경우의 수는 $3+6+3=12$이다. 또, $4$와 $2$, $5$와 $3$, $6$과 $4$로 차이가 나는 경우의 수도 각각 $12$이므로 차이가 2인 경우의 수는 $12\times4=48$이다. 같은 방법으로 $5$와 $1$로 차이가 4인 경우는 $(1,1,5)$, $(1,2,5)$, $(1,3,5)$, $(1,4,5)$, $(1,5,5)$이고 경우의 수는 $3+6+6+6+3=24$이고 $6$과 $2$로 차이가 4인 경우의 수도 $24$이므로 차이가 4인 경우의 수는 $48$이다.
      source_flow: 17901_ab58.pdf p.51 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 즉, 주사위 3개를 던져 상자 A가 선택될 확률은 $$\frac{48+48}{6^3}=\frac49$$이다. 따라서 구하는 첫 번째 시행에서 검은 공이 나올 확률은 $$p=\frac49\times\frac15+\frac59\times\frac35=\frac{19}{45}$$이다.
      source_flow: 17901_ab58.pdf p.51 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-3
      content: 첫 번째 시행에서 흰 공이 나오고 두 번째 시행에서 검은 공이 나오는 경우는 다음 표의 4가지이고 각각 확률은 표와 같다. (첫 번째 흰 공을 뽑은 상자, 두 번째 검은 공을 뽑은 상자, 확률) $$(\text{A},\text{A}):\ \frac49\times\frac45\times\frac49\times\frac14,\quad(\text{A},\text{B}):\ \frac49\times\frac45\times\frac59\times\frac35$$ $$(\text{B},\text{A}):\ \frac59\times\frac25\times\frac49\times\frac15,\quad(\text{B},\text{B}):\ \frac59\times\frac25\times\frac59\times\frac34$$
      source_flow: 17901_ab58.pdf p.51 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-4
      content: 그러므로 첫 번째 시행에서 흰 공이 나오고 두 번째 시행에서 검은 공이 나올 확률은 $$\frac49\times\frac45\times\frac49\times\frac14+\frac49\times\frac45\times\frac59\times\frac35+\frac59\times\frac25\times\frac49\times\frac15+\frac59\times\frac25\times\frac59\times\frac34=\frac{73}{3\times5\times9\times2}$$이다.
      source_flow: 17901_ab58.pdf p.51 예시답안 [논제 1]
      criteria:
      - 1.A3
    - id: 1b-5
      content: '따라서 구하는 조건부확률 $q$는 $$q=\frac{\dfrac{73}{3\times5\times9\times2}}{\dfrac{26}{45}}=\frac{73}{156}$$이다. [보충: 첫 번째 시행에서 흰 공이 나올 확률 $1-p=\frac{26}{45}$]'
      source_flow: 17901_ab58.pdf p.51 예시답안 [논제 1]
      criteria:
      - 1.A4
