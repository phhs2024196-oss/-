      depends_on:
      - 1.M1
      steps:
      - 1b-2
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 50
      evidence: $c_k+c_{p+2-k}$가 정수임을 보여 $c_k+c_{p+2-k}=1$, $\sum c_k=\frac{p-3}{2}$를 얻었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-4
    - id: 1.A3
      mark_type: A
      points: 40
      evidence: $L=\frac2p\sum k(k-1)(k-2)+\frac{p-3}{2}$를 계산하여 $L=\frac{(p-3)(p^2-3p+3)}{2}$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-5
