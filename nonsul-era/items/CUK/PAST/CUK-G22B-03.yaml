stimuli:
- label: ㄱ
  body: |
    학생 $A$와 $B$를 포함하는 $k+2$명으로 구성된 동아리에 대하여 아래 경우의 수를 $a_k$라고 하자. (단, $k$는 $3$이상인 자연수이다.)

    학생 $A$, $B$를 포함하여 동아리 학생 5명을 뽑아 원탁에 앉을 때 $A$와 $B$가 서로 이웃하여 앉는 경우의 수
- label: ㄴ
  body: |
    제시문 (ㄱ)의 $a_k$와 $3$보다 큰 소수 $p$에 대하여 다음 집합 $S$의 가장 작은 원소를 $b_k$라고 하자.

    $$S=\left\{m\mid m\text{는 }m\ge\frac{a_k}{p}\text{인 자연수}\right\}$$
- label: ㄷ
  body: |
    제시문 (ㄴ)의 $p$와 $b_k$에 대하여 $L$은 다음과 같다.

    $$L=\sum_{k=3}^{p-1}b_k$$
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 논제에 답하시오. (180점)
subparts:
- id: '1'
  stem: (180점) 제시문 (ㄷ)의 합 $L$을 구하고 그 근거를 논술하시오.
  points: 180
  depends_on: []
  answer:
    kind: expression
    value: (p-3)*(p**2-3*p+3)/2
    equivalents:
    - L=\frac{(p-3)(p^2-3p+3)}{2}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_k=2k(k-1)(k-2)$, $b_k=\frac{a_k}{p}+c_k$로 두고 $0<c_k<1$, $c_k+c_{p+2-k}=1$로 $\sum c_k=\frac{p-3}{2}$를 얻어 $L$을 계산한다.
    steps:
    - id: 1a-1
      content: $a_k=2k(k-1)(k-2)$ / $\sum c_k=\frac{p-3}{2}$ / $L=\frac{(p-3)(p^2-3p+3)}{2}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 동아리에서 학생 3명을 선택하는 경우의 수는 ${}_k\mathrm C_3=\frac{k(k-1)(k-2)}{3!}$, 이웃하는 두 학생 $A$, $B$를 한 사람으로 생각하여 4명이 원탁에 앉는 경우의 수는 $(4-1)!=3!$, 이웃하는 두 학생 $A$, $B$가 자리를 서로 바꾸는 경우의 수는 2이다. 따라서 제시문 (ㄴ)의 $a_k$는 다음과 같다. $$a_k=\frac{k(k-1)(k-2)}{3!}\times3!\times2=2k(k-1)(k-2)$$
      source_flow: 17901_ab58.pdf p.54 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 제시문 (ㄷ)의 $L$을 구하기 위해 $$b_k-\frac{a_k}{p}=c_k\quad(k=3,4,\cdots,p-1)$$라고 하자. 그러면 $0\le c_k<1$이다.
      source_flow: 17901_ab58.pdf p.54 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-3
      content: 한편, $2\le l\le p-1$인 자연수 $l$에 대하여 $l<p$이므로 $3\le k\le p-1$인 자연수 $k$에 대하여 $a_k$는 $3$보다 큰 소수 $p$를 약수로 갖지 않는다. 만약 $3\le k\le p-1$인 자연수 $k$에 대하여 $\frac{a_k}{p}$이 자연수 $q$이라면 $a_k=qp$가 되어 자연수를 소인수분해한 결과는 곱하는 순서를 생각하지 않으면 오직 한 가지뿐이라는 것에 모순이다. 따라서 $\frac{a_k}{p}$는 자연수가 아니다. 즉, $3\le k\le p-1$인 자연수 $k$에 대하여 $$0<c_k<1\text{이고 }0<c_k+c_{p+2-k}<2$$
      source_flow: 17901_ab58.pdf p.54~55 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-4
      content: 한편, $3\le k\le p-1$인 자연수 $k$에 대하여 $$c_k+c_{p+2-k}=b_k+b_{p+2-k}-\left(\frac{a_k}{p}+\frac{a_{p+2-k}}{p}\right)=b_k+b_{p+2-k}-2\left(p^2-3(k-1)p+3k^2-6k+2\right)$$이고 이 값이 정수이므로 $$c_k+c_{p+2-k}=1\quad(k=3,4,\cdots,p-1)$$ 따라서 $$\sum_{k=3}^{p-1}c_k=\sum_{k=3}^{p-1}c_{p+2-k}=\frac{p-3}{2}$$
      source_flow: 17901_ab58.pdf p.54~55 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-5
      content: 그러므로 제시문 (ㄷ)의 $L$은 다음과 같다. $$L=\sum_{k=3}^{p-1}b_k=\sum_{k=3}^{p-1}\frac{a_k}{p}+\sum_{k=3}^{p-1}c_k=\frac2p\sum_{k=3}^{p-1}k(k-1)(k-2)+\frac{p-3}{2}$$ $$=\frac2p\sum_{k=1}^{p-2}(k^3-k)+\frac{p-3}{2}=\frac{(p-1)(p-2)(p-3)}{2}+\frac{p-3}{2}=\frac{(p-3)(p^2-3p+3)}{2}$$
      source_flow: 17901_ab58.pdf p.54~55 예시답안 [논제 1]
      criteria:
      - 1.A3
