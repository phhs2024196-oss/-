intent: 가) 순열과 조합, 원순열을 이해하고 활용할 수 있는지를 확인한다. 나) 집합의 개념과 표현방법을 이해하고 활용할 수 있는지를 확인한다. 다) 소수, 소인수분해, 정수와 유리수의 뜻을 알고 활용할 수 있는지를 확인한다. 라) 합의 기호의 뜻을 알고, 그 성질을 이해하고, 이를 활용할 수 있는지를 확인한다.
key_idea: $a_k=2k(k-1)(k-2)$이고 $b_k=\frac{a_k}{p}+c_k$ ($0<c_k<1$)에서, $c_k+c_{p+2-k}$가 정수임을 이용해 $c_k+c_{p+2-k}=1$로 짝지어 $\sum c_k=\frac{p-3}{2}$를 얻고 $\sum\frac{a_k}{p}=\frac2p\sum(k^3-k)$를 계산한다.
stuck: $a_k$가 소수 $p$로 나누어떨어지지 않아 $c_k$가 열린구간 $(0,1)$에 있음을 보이는 단계, $k$와 $p+2-k$를 짝지어 $c_k+c_{p+2-k}$가 정수임을 알아채는 단계
