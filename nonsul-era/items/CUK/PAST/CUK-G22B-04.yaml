stimuli:
- label: ㄱ
  body: |
    상수 $n$에 대하여 명제 $p$는 다음과 같다.

    최고차항의 계수가 양수인 삼차함수 $f(x)$가 $x=\alpha$에서 극댓값을 가지고 $x=\beta$에서 극솟값 $0$을 가지면 방정식 $f(x-f(x))=f(x)$는 열린구간 $(\alpha,\beta)$에서 $n$개의 실근을 갖는다.
- label: ㄴ
  body: |
    최고차항의 계수 $k$가 양수인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.

    (가) 방정식 $f(x-f(x))=f(x)$의 모든 실근은 $a$, $b$, $c$, $d$, $e$이고 $f(b)=f(d)$이다. (단, $a<b<c<d<e$)

    (나) 함수 $f(x)$의 극솟값은 $0$이다.

    이 함수 $f(x)$와 실수 $k$, $a$, $b$, $c$에 대하여 $m=k(b-a)f(2b-c)$라고 하자.
stem: 제시문 (ㄱ)~(ㄴ)을 읽고 논제에 답하시오. (180점)
subparts:
- id: '1'
  stem: (180점) 제시문 (ㄱ)의 명제 $p$가 참이 되도록 하는 $n$의 값이 있는지 판별하고, 있는 경우 $n$의 값을 구하시오. 또한 제시문 (ㄴ)의 $m$의 값을 구하시오. 이 모든 과정의 근거를 논술하시오.
  points: 180
  depends_on: []
  answer:
    kind: value
    value: n=1; m=6
    equivalents:
    - n=1, m=6
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=k(x-\frac{3\alpha-\beta}{2})(x-\beta)^2$에서 $h(t)=t-f(t)-g(t)$가 증가하는 연속함수이고 사잇값 정리로 $n=1$을 얻는다. (ㄴ)에서는 $a=\frac{3\alpha-\beta}{2}$, $c=\beta$, $d-b=f(b)=q$로 $f$를 $b$, $q$로 나타내 $m$을 구한다.
    steps:
    - id: 1a-1
      content: $n=1$ / $f(x)=k((x-b)^3-q^2(x-b))+q$, $k=\frac{3\sqrt3}{2q^2}$, $m=6$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
      - 1.A4
      - 1.A5
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 삼차함수 $f(x)$가 $x=\alpha$에서 극댓값을 가지고 $x=\beta$에서 극솟값 $0$을 가진다고 하고 $f(x)$의 최고차항의 계수 $k$가 양수라고 하자. $f(x)$가 $x=\alpha$에서 극댓값을 가지고 $x=\beta$에서 극솟값 $0$을 가지므로 $f'(x)=3k(x-\alpha)(x-\beta)$이고 $f(\beta)=0$, $\alpha<\beta$이다. 따라서 $$f(x)=\int_\beta^xf'(t)dt+f(\beta)=k(x-\beta)^3+\frac{3(\beta-\alpha)k}{2}(x-\beta)^2=k\left(x-\frac{3\alpha-\beta}{2}\right)(x-\beta)^2$$이다.
      source_flow: 17901_ab58.pdf p.60 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\alpha\le t\le\beta$인 실수 $t$에 대하여 $x$에 관한 방정식 $f(x)=f(t)$의 실근 중 가장 작은 근 $x$를 $g(t)$라고 하고 $h(t)=t-f(t)-g(t)$라고 하자. $\alpha<t<\beta$인 $t$에 대해서 $f(t)>0$이므로 $t-f(t)<t$이고 방정식 $f(x)=f(t)$의 실근 $x$ 중 $t$보다 작은 근은 $g(t)$가 유일하므로 $\alpha<t<\beta$일 때 $f(t-f(t))=f(t)$일 필요충분조건은 $t-f(t)=g(t)$, 즉, $h(t)=0$인 것이다. 따라서 열린구간 $(\alpha,\beta)$에서 방정식 $f(x-f(x))=f(x)$의 실근의 개수는 열린구간 $(\alpha,\beta)$에서 방정식 $h(x)=0$의 실근의 개수와 같다.
      source_flow: 17901_ab58.pdf p.60 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-3
      content: $f(x)=k\left(x^3-\frac32(\alpha+\beta)x^2+3\alpha\beta x-\frac12\beta^2(3\alpha-\beta)\right)$이고 $f(x)-f(t)=k(x-t)\left(x^2+\frac12(2t-3\alpha-3\beta)x+3\alpha\beta+t^2-\frac32(\alpha+\beta)t\right)$이므로 $g(t)$는 이차방정식 $x^2+\frac12(2t-3\alpha-3\beta)x+3\alpha\beta+t^2-\frac32(\alpha+\beta)t=0$의 두 근 중 더 작은 근이다. 그러므로 근의 공식에 의해 $$g(t)=\left(3(\alpha+\beta)-2t-\sqrt{3(3\beta-\alpha-2t)(\beta-3\alpha+2t)}\right)/4$$이고, $\alpha\le t\le\beta$에서 $g(t)$는 연속이다. 따라서 $h(t)=t-g(t)-f(t)$도 구간 $[\alpha,\beta]$에서 연속이다. $h(\alpha)=\alpha-\alpha-f(\alpha)<0$이고 $h(\beta)=\beta-g(\beta)-f(\beta)=\beta-g(\beta)=\frac32(\beta-\alpha)>0$이므로 사잇값 정리에 의해 열린구간 $(\alpha,\beta)$에서 $h(t)=0$인 실수 $t$가 적어도 하나 존재한다.
      source_flow: 17901_ab58.pdf p.61 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-4
      content: '$\alpha\le t_1<t_2\le\beta$에 대해서 $g(t_1)\le\alpha$, $g(t_2)\le\alpha$이고, 닫힌구간 $[\alpha,\beta]$에서 $f(x)$는 감소하므로 $f(g(t_1))=f(t_1)>f(t_2)=f(g(t_1))$이고 [판독확인: 공식 채점기준(p.58)·예시답안(p.61) 모두 마지막 항이 $f(g(t_1))$로 인쇄되어 있음. 문맥상 $f(g(t_2))$로 보이나 원문 그대로 둠], 구간 $(-\infty,\alpha]$에서 $f(x)$는 증가하므로 $g(t_1)>g(t_2)$이다. 즉, 닫힌구간 $[\alpha,\beta]$에서 $g(t)$는 감소한다. 닫힌구간 $[\alpha,\beta]$에서 $f(t)$, $g(t)$는 감소하므로 $h(t)=t-g(t)-f(t)$는 증가하는 연속함수이다. 따라서 열린구간 $(\alpha,\beta)$에서 $h(t)=0$인 실수 $t$의 개수는 1이다. 따라서 $n=1$일 때 명제 $p$가 참이다. 즉, 명제 $p$가 참이 되도록 하는 $n$의 값은 있으며, 그 값은 1이다.'
      source_flow: 17901_ab58.pdf p.61 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-5
      content: 제시문 (ㄴ)의 함수를 $f(x)$라고 하면 위의 논의로부터 $f(x)=k\left(x-\frac{3\alpha-\beta}{2}\right)(x-\beta)^2$이다. 따라서 극댓값을 $M=f(\alpha)$라고 하면 $f(x)-M=k(x-\alpha)^2\left(x-\frac{3\beta-\alpha}{2}\right)$이다. $\gamma=\frac{3\beta-\alpha}{2}$라고 하자.
      source_flow: 17901_ab58.pdf p.61 예시답안 [논제 1]
      criteria:
      - 1.A3
    - id: 1b-6
      content: '방정식 $$f(x-f(x))=f(x)\qquad\cdots\cdots(\ast)$$의 근 $x$를 다음의 경우로 나누어 생각하자. i) $x-f(x)=x$인 경우: $f(x)=0$을 만족하는 $x$는 $x=\frac{3\alpha-\beta}{2}$ 또는 $x=\beta$이고 이 경우는 위 방정식 $(\ast)$의 근이 된다. ii) $x-f(x)\neq x$인 경우: $x-f(x)\neq x$이고 $f(x-f(x))=f(x)$라고 하자. $f(x)\neq0$이고 서로 다른 $x-f(x)$와 $x$에서의 $f$의 함숫값이 같으므로 $0<f(x)\le M$이다. 따라서 $x-f(x)<x$이고 $f(x-f(x))=f(x)$이므로 $\alpha<x\le\gamma$이다. (단, $x\neq\beta$)'
      source_flow: 17901_ab58.pdf p.61 예시답안 [논제 1]
      criteria:
      - 1.A3
    - id: 1b-7
      content: 방정식 $(\ast)$의 i)에서의 두 근이 $\frac{3\alpha-\beta}{2}$, $\beta$이고 $\frac{3\alpha-\beta}{2}<\alpha<\beta$이므로 방정식 $(\ast)$의 근 중 가장 작은 값은 $\frac{3\alpha-\beta}{2}$이고 나머지 근은 모두 $\alpha$보다 크다. 즉, $a=\frac{3\alpha-\beta}{2}$이고 $\alpha<b$이다. 위의 논의로부터 방정식 $(\ast)$는 열린구간 $(\alpha,\beta)$에서 유일한 근을 가지므로 $b$가 열린구간 $(\alpha,\beta)$에서의 방정식 $(\ast)$의 유일한 근임을 알 수 있다. 즉, $b<\beta$이다. 그런데 $x=\beta$도 방정식 $f(x-f(x))=f(x)$의 근이고 $b<\beta$이므로 $c=\beta$이다. 따라서 $b<\beta=c<d$이고 $f(d)=f(b)>0$임을 알 수 있다.
      source_flow: 17901_ab58.pdf p.62 예시답안 [논제 1]
      criteria:
      - 1.A3
    - id: 1b-8
      content: '$f(b-f(b))=f(b)=f(d)=f(d-f(d))$이고 $b-f(b)<b<d$이므로 $b-f(b)$, $b$, $d-f(d)$, $d$는 모두 방정식 $f(x)=f(b)$의 근이고, $b-f(b)$, $b$, $d$는 서로 다르다. 그런데 $b-f(b)<d-f(d)<f(d)$이므로 [판독확인: 공식 채점기준(p.59)·예시답안(p.62) 모두 ''$<f(d)$''로 인쇄되어 있음. 문맥상 ''$<d$''로 보이나 원문 그대로 둠] $d-f(d)=b$이다. 그러므로 $d-b=f(d)=f(b)$이다. $d-b=q>0$라고 하면 $q=f(d)=f(b)$이고 방정식 $f(x)=f(b)$의 서로 다른 세 실근은 $b-q$, $b$, $b+q$이다. 따라서 $$f(x)=k(x-b+q)(x-b)(x-b-q)+f(b)=k\left((x-b)^3-q^2(x-b)\right)+q$$이다.'
      source_flow: 17901_ab58.pdf p.62 예시답안 [논제 1]
      criteria:
      - 1.A4
    - id: 1b-9
      content: $f'(x)=k\left(3(x-b)^2-q^2\right)=3k\left(x-b-\frac{q}{\sqrt3}\right)\left(x-b+\frac{q}{\sqrt3}\right)$이므로 $b+\frac{q}{\sqrt3}=\beta=c$, $b-\frac{q}{\sqrt3}=\alpha$이고 $a=\frac{3\alpha-\beta}{2}=b-\frac{2}{\sqrt3}q$이다.
      source_flow: 17901_ab58.pdf p.62 예시답안 [논제 1]
      criteria:
      - 1.A5
    - id: 1b-10
      content: $0=f(\beta)=f\left(b+\frac{q}{\sqrt3}\right)=-\frac{2}{3\sqrt3}kq^3+q$이므로 $k=\frac{3\sqrt3}{2q^2}$이다.
      source_flow: 17901_ab58.pdf p.62 예시답안 [논제 1]
      criteria:
      - 1.A5
    - id: 1b-11
      content: $f(2b-c)=f\left(b-\frac{q}{\sqrt3}\right)=\frac{3\sqrt3}{2q^2}\left(\frac{2}{3\sqrt3}q^3\right)+q=2q$이므로 $$m=k(b-a)f(2b-c)=\frac{3\sqrt3}{2q^2}\times\frac{2q}{\sqrt3}\times2q=6$$이다.
      source_flow: 17901_ab58.pdf p.62 예시답안 [논제 1]
      criteria:
      - 1.A5
