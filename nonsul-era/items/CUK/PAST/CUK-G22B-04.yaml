key_idea: 극댓값·극솟값 $0$ 조건으로 $f(x)=k(x-\frac{3\alpha-\beta}{2})(x-\beta)^2$을 정하고, $f(x-f(x))=f(x)$의 $(\alpha,\beta)$ 근의 개수를 $h(t)=t-f(t)-g(t)$의 영점 개수로 바꾸어 사잇값 정리(존재)와 단조성(유일성)으로 $n=1$을 얻는다. (ㄴ)에서는 근의 배치 $a=\frac{3\alpha-\beta}{2}$, $c=\beta$, $d-f(d)=b$로 $f$를 $b$, $q$, $k$로 표현해 $m=6$을 구한다.
stuck: $f(x-f(x))=f(x)$를 $x-f(x)=g(x)$(작은 쪽 근)로 환원하는 단계, $h$의 증가·연속으로 근의 개수를 1로 정하는 단계, (ㄴ)에서 다섯 근 $a<b<c<d<e$를 $f(x)=f(b)$의 세 근과 연결하여 $d-b=f(b)$를 얻는 단계
