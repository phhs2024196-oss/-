- id: '2'
  stem: |
    (15점) 제시문 (ㄴ)의 집합 $S$를 구하고 그 근거를 논술하시오.
  points: 15
  depends_on:
  - '1'
  answer:
    kind: value
    value: S={3}
    equivalents:
    - S=\{3\}
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=6(x-2)^2+2>0$이므로 주어진 절댓값 부등식은 두 이차부등식 $(3-a)x^2-2(3-a)x+2\ge0$, $(a+3)x^2-2(a+9)x+24\ge0$과 같다. $a=3$, $a=-3$, 그 외로 나누어 $S=\{3\}$을 구한다.
    steps:
    - id: 2a-1
      content: $f'(x)=6(x-2)^2+2>0$이므로 주어진 절댓값 부등식은 두 이차부등식 $(3-a)x^2-2(3-a)x+2\ge0$, $(a+3)x^2-2(a+9)x+24\ge0$과 같다. $a=3$, $a=-3$, 그 외로 나누어 $S=\{3\}$을 구한다.
      criteria:
      - 2.M1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)=2x^3-12x^2+26x-20$이므로 $f'(x)=6x^2-24x+26=6(x-2)^2+2>0$이다. 따라서 모든 실수 $x$에 대하여 $$-3x^2+12x-13\le ax^2-2(a+3)x+11\le 3x^2-12x+13$$ 즉, $$\begin{cases}(3-a)x^2-2(3-a)x+2\ge0\\(a+3)x^2-2(a+9)x+24\ge0\end{cases}$$을 만족시키는 모든 실수 $a$의 값의 집합이 $S$이다.
      source_flow: 30916_fb49.pdf p.37 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        1) $a=3$인 경우: 모든 실수 $x$에 대하여 $(3-a)x^2-2(3-a)x+2=2\ge0$이고 $(a+3)x^2-2(a+9)x+24=6(x-2)^2\ge0$이다. 따라서 $a=3$은 집합 $S$의 원소이다.

        2) $a=-3$인 경우: $x=3$일 때, $(a+3)x^2-2(a+9)x+24=-12(x-2)=-12<0$이다. 따라서 $a=-3$은 집합 $S$의 원소가 아니다.
      source_flow: 30916_fb49.pdf p.37 예시답안 [논제 2]
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        3) $a\ne3$, $a\ne-3$인 경우: 모든 실수 $x$에 대하여 위의 두 이차부등식이 성립하기 위한 조건은 $$3-a>0,\quad (3-a)^2-2(3-a)=(a-1)(a-3)\le0$$이고 $$a+3>0,\quad (a+9)^2-24(a+3)=(a-3)^2\le0$$이다. 따라서 $a\ne3$, $a\ne-3$인 실수 $a$는 집합 $S$의 원소가 아니다.
      source_flow: 30916_fb49.pdf p.37 예시답안 [논제 2]
      criteria:
      - 2.A2
    - id: 2b-4
      content: |
        1), 2), 3)에 의해서 $S=\{3\}$.
      source_flow: 30916_fb49.pdf p.37 예시답안 [논제 2]
      criteria:
      - 2.A3
