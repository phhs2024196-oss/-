stimuli:
- label: ㄱ
  body: |
    함수 $f(x)$와 실수 $k$, 복소수 $z$는 다음 조건을 만족시킨다. (단, $i=\sqrt{-1}$)

    (가) $f(x)=2x^3-2(k+2)x^2+(k^2+4k-6)x-2k^2+12$

    (나) $3z-1$은 방정식 $f(x)=0$의 한 허근이다.

    (다) $3z-1$은 $2z-\dfrac53 i$의 켤레복소수이다.
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$에 대하여 다음 조건을 만족시키는 모든 실수 $a$의 값의 집합을 $S$라 하자.

    모든 실수 $x$에 대하여 $\left|ax^2-2(a+3)x+11\right|\le\dfrac{\left|f'(x)\right|}{2}$ 이다.
stem: |
  제시문 (ㄱ)~(ㄴ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
subparts:
- id: '1'
  stem: |
    (15점) 제시문 (ㄱ)의 $k$의 값을 구하고 그 근거를 논술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: k=4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=(x-2)(2x^2-2kx+k^2-6)$으로 인수분해하고, $z=\alpha+\beta i$로 놓은 켤레복소수 조건에서 $3z-1=2+i$를 구한 뒤 $f(2+i)=0$으로 $k$를 구한다.
    steps:
    - id: 1a-1
      content: $f(x)=(x-2)(2x^2-2kx+k^2-6)$으로 인수분해하고, $z=\alpha+\beta i$로 놓은 켤레복소수 조건에서 $3z-1=2+i$를 구한 뒤 $f(2+i)=0$으로 $k$를 구한다.
      criteria:
      - 1.M1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        제시문 (ㄱ)의 (가)에 의해서 $f(x)=(x-2)\left(2x^2-2kx+k^2-6\right)$이다. 실수 $\alpha$, $\beta$에 대하여 $z=\alpha+\beta i$라 하자. 제시문 (ㄱ)의 (다)에 의해서 $$3\alpha-1-3\beta i=\overline{3z-1}=2z-\frac53 i=2\alpha+\left(2\beta-\frac53\right)i$$이 되고 $\alpha=1$, $\beta=\dfrac13$이다. 따라서 방정식 $f(x)=0$의 한 허근은 $3z-1=2+i$이다.
      source_flow: 30916_fb49.pdf p.37 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(2+i)=i\left(2(3+4i)-2k(2+i)+k^2-6\right)=(k-4)(2+ki)=0$이므로 $k=4$이다.
      source_flow: 30916_fb49.pdf p.37 예시답안 [논제 1]
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: $f(x)$를 인수분해하고 켤레복소수 조건에서 $\alpha=1$, $\beta=\frac13$, 즉 허근 $3z-1=2+i$를 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $f(2+i)=(k-4)(2+ki)=0$에서 $k=4$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
