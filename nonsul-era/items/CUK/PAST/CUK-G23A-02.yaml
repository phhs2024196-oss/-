stimuli:
- label: ㄱ
  body: |
    최고차항의 계수가 $1$인 사차함수 $f(x)$는 다음 조건을 만족시킨다.

    (가) $f(0)=0$

    (나) 임의의 실수 $t$에 대하여 $\displaystyle\int_0^t f(5+x)\,dx=\int_0^t f(5-x)\,dx$이다.

    (다) $f(x)$는 $x=10$에서 극값을 가진다.
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$에 대하여 실수 $M$은 다음 조건을 만족시킨다.

    실수 $k$에 대하여 방정식 $f(x)=k$의 서로 다른 양의 실근의 개수를 $n$이라 할 때,

    (가) $0<k<M$이면 $n=3$

    (나) $k>M$이면 $n=1$
- label: ㄷ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$에 대하여 실수 $a$, $b$, $c$는 다음 조건을 만족시킨다.

    (가) $0<a<b<c$

    (나) $f(a)=f(b)=f(c)$

    (다) $c-a=\sqrt{70}$
stem: |
  제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
subparts:
- id: '1'
  stem: |
    (15점) 제시문 (ㄴ)의 $M$의 값을 구하고 그 근거를 논술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: M=625
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 적분 등식을 미분해 $f(5+t)=f(5-t)$를 얻고 $g(x)=f(x+5)$를 우함수로 놓아 $f(x)=x^2(x-10)^2$을 구한 뒤, 극댓값 $f(5)=625$에서 $M$을 정한다.
    steps:
    - id: 1a-1
      content: 적분 등식을 미분해 $f(5+t)=f(5-t)$를 얻고 $g(x)=f(x+5)$를 우함수로 놓아 $f(x)=x^2(x-10)^2$을 구한 뒤, 극댓값 $f(5)=625$에서 $M$을 정한다.
      criteria:
      - 1.M1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\int_0^t f(5+x)dx=\int_0^t f(5-x)dx$의 양변을 $t$에 대하여 미분하면 $f(5+t)=f(5-t)$이다. $g(x)=f(x+5)$라 하면 $g(x)$는 최고차항의 계수가 $1$인 사차함수이므로 $g(x)=x^4+c_3x^3+c_2x^2+c_1x+c_0$이다. 그런데, 임의의 실수 $t$에 대하여 $g(t)=f(t+5)=f(5-t)=g(-t)$, 즉 $t(c_3t^2+c_1)=0$이다. $t=1$일 때 $c_3+c_1=0$이고, $t=2$일 때 $4c_3+c_1=0$이므로 $c_3=c_1=0$이다. 따라서 $g(x)=x^4+c_2x^2+c_0$이다.
      source_flow: 30916_fb49.pdf p.41~42 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $y=g(x)$의 그래프는 $y=f(x)$의 그래프를 $x$축의 방향으로 $-5$만큼 평행이동한 그래프이므로 제시문 (ㄱ)의 (가)와 (다)에 의해 $g(-5)=0$이고 $g(x)$는 $x=5$에서 극값을 가진다. 그러므로 $g(-5)=625+25c_2+c_0=0$, $g'(5)=500+10c_2=0$, 즉 $c_2=-50$, $c_0=625$이다. 따라서 $g(x)=x^4-50x^2+625=(x^2-25)^2=(x-5)^2(x+5)^2$, $f(x)=g(x-5)=x^2(x-10)^2$이다.
      source_flow: 30916_fb49.pdf p.41~42 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        함수 $f(x)$는 $x=0,\ 10$에서 극솟값 $f(0)=f(10)=0$을 가지고, $x=5$에서 극댓값 $f(5)=625$를 갖는다. 따라서 방정식 $x^2(x-10)^2=k$의 서로 다른 양의 실근의 개수는 $0<k<625$일 때 $3$이고, $k>625$일 때 $1$이다. 그러므로 $M=625$이다.
      source_flow: 30916_fb49.pdf p.41~42 예시답안 [논제 1]
      criteria:
      - 1.A1
