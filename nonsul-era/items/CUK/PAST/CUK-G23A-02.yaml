key_idea: 적분 등식을 미분하여 $y=f(x)$의 그래프가 $x=5$에 대칭임을 알아 $g(x)=f(x+5)$를 우함수 사차식으로 놓고 $f(x)=x^2(x-10)^2$을 구한다. 이어서 $f(x)=k$의 세 양의 근을 $g(x)=k$의 네 근 $\pm\alpha,\pm\beta$와 연결하여 근과 계수의 관계로 $f(a)$를 구한다.
