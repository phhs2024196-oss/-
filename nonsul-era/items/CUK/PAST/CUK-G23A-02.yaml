- id: '2'
  stem: |
    (15점) 제시문 (ㄱ)의 함수 $f(x)$와 제시문 (ㄷ)의 $a$에 대하여 $f(a)$의 값을 구하고 그 근거를 논술하시오.
  points: 15
  depends_on:
  - '1'
  answer:
    kind: value
    value: f(a)=525
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=k$의 세 양의 근이므로 $0<k<625$이다. $g(x)=f(x+5)$에서 $g(x)=k$의 네 근을 $\pm\alpha,\pm\beta$로 놓고 근과 계수의 관계와 $a=5-\alpha$, $c=5+\beta$로 $\alpha\beta=10$을 얻어 $k=525$를 구한다.
    steps:
    - id: 2a-1
      content: $f(x)=k$의 세 양의 근이므로 $0<k<625$이다. $g(x)=f(x+5)$에서 $g(x)=k$의 네 근을 $\pm\alpha,\pm\beta$로 놓고 근과 계수의 관계와 $a=5-\alpha$, $c=5+\beta$로 $\alpha\beta=10$을 얻어 $k=525$를 구한다.
      criteria:
      - 2.M1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(a)=f(b)=f(c)=k$라 하자. $a,b,c$가 방정식 $f(x)=k$, 즉 $x^2(x-10)^2=k$의 서로 다른 세 양의 실근이므로 $0<k<625$이다. $g(x)=f(x+5)=(x^2-25)^2=x^4-50x^2+625$라 하면, 함수 $y=g(x)$는 $x=-5$, $x=5$에서 극솟값 $g(-5)=g(5)=0$을 가지고 $x=0$에서 극댓값 $g(0)=625$를 가진다. 그러므로 방정식 $g(x)=k$는 서로 다른 네 실근 $-\beta,\ -\alpha,\ \alpha,\ \beta$(단, $0<\alpha<5<\beta$)를 갖는다. 따라서 $g(x)-k=(x-\alpha)(x+\alpha)(x-\beta)(x+\beta)=x^4-(\alpha^2+\beta^2)x^2+\alpha^2\beta^2$이다. 또한 $g(x)-k=x^4-50x^2+625-k$이므로 $\alpha^2+\beta^2=50$, $\alpha^2\beta^2=625-k$이다.
      source_flow: 30916_fb49.pdf p.41~42 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $f(5-\beta)=g(-\beta)=k$, $f(5-\alpha)=g(-\alpha)=k$, $f(5+\alpha)=g(\alpha)=k$, $f(5+\beta)=g(\beta)=k$이므로 방정식 $f(x)=k$의 서로 다른 네 실근은 $5-\beta,\ 5-\alpha,\ 5+\alpha,\ 5+\beta$이다. $0<\alpha<5<\beta$이므로 $5-\beta<0<5-\alpha<5+\alpha<5+\beta$가 되어 $a=5-\alpha$, $b=5+\alpha$, $c=5+\beta$이다.
      source_flow: 30916_fb49.pdf p.41~42 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        제시문 (ㄷ)의 (다)에 의해 $c-a=\sqrt{70}$이므로 $2\alpha\beta=(\alpha+\beta)^2-(\alpha^2+\beta^2)=(c-a)^2-50=20$, 즉 $\alpha\beta=10$이다. 따라서 $100=\alpha^2\beta^2=625-k$이고, $f(a)=k=525$이다.
      source_flow: 30916_fb49.pdf p.41~42 예시답안 [논제 2]
      criteria:
      - 2.A1
