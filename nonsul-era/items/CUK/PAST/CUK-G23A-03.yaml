  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $PQ$의 중점 $R(c,d)$가 $OR=3$을 만족하므로 직선 $PQ$는 $cx+dy=9$이다. $c=-\frac95$를 제외한 $-3\le c\le3$에서 넓이가 $|5c+9|$이므로 최댓값은 $c=3$일 때 $24$이다.
    steps:
    - id: 2a-1
      content: $PQ$의 중점 $R(c,d)$가 $OR=3$을 만족하므로 직선 $PQ$는 $cx+dy=9$이다. $c=-\frac95$를 제외한 $-3\le c\le3$에서 넓이가 $|5c+9|$이므로 최댓값은 $c=3$일 때 $24$이다.
      criteria:
      - 2.M1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 점 $\mathrm{P}$, $\mathrm{Q}$의 중점을 $\mathrm{R}(c,d)$라 하자. 원점 $\mathrm{O}$에 대해 삼각형 $\mathrm{OPQ}$는 $\overline{\mathrm{OP}}=\overline{\mathrm{OQ}}=3\sqrt2$인 이등변삼각형이므로 선분 $\mathrm{PQ}$와 선분 $\mathrm{OR}$은 수직이고 $\overline{\mathrm{OR}}^2+\overline{\mathrm{RP}}^2=18$, 즉 $\overline{\mathrm{OR}}=3$이다. 따라서 직선 $\mathrm{PQ}$는 원 $x^2+y^2=9$ 위의 점 $\mathrm{R}(c,d)$에서의 접선, $cx+dy=9$와 같다. 논제 1에서 $c=-\dfrac95$이면 점 $\mathrm{A}$, $\mathrm{P}$, $\mathrm{Q}$가 한 직선 위에 있으므로 $-3\le c\le3$, $c\ne-\dfrac95$이다.
      source_flow: 30916_fb49.pdf p.46 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        역으로 원 $x^2+y^2=9$ 위의 한 점 $\mathrm{R}(c,d)$ (단, $-3\le c\le3$, $c\ne-\dfrac95$)에서의 접선이 원 $x^2+y^2=18$과 만나는 두 점을 각각 $\mathrm{P}$, $\mathrm{Q}$라 하면 점 $\mathrm{P}$, $\mathrm{Q}$는 제시문 (ㄷ)의 조건을 모두 만족시킨다.
      source_flow: 30916_fb49.pdf p.46 예시답안 [논제 2]
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        삼각형 $\mathrm{APQ}$의 넓이는 $\dfrac12\times\overline{\mathrm{PQ}}\times\dfrac{|5c+9|}{\sqrt{c^2+d^2}}=|5c+9|$이므로 $-3\le c\le3$, $c\ne-\dfrac95$일 때 $|5c+9|$의 최댓값이 $M$이다. 따라서 $M=|5\times3+9|=24$이다.
      source_flow: 30916_fb49.pdf p.46 예시답안 [논제 2]
      criteria:
      - 2.A2
