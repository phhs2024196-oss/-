stimuli:
- label: ㄱ
  body: |
    좌표평면 위의 두 점 $\mathrm{A}(-5,\,0)$, $\mathrm{B}(-4,\,3)$에 대하여 두 점 $\mathrm{C}$, $\mathrm{D}$는 다음 조건을 만족시킨다.

    (가) 원 $x^2+y^2=9$ 위의 두 점 $\mathrm{C}$, $\mathrm{D}$에서의 접선은 모두 점 $\mathrm{A}$를 지난다.

    (나) $\overline{\mathrm{BC}}<\overline{\mathrm{BD}}$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 네 점 $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$, $\mathrm{D}$에 대하여 삼각형 $\mathrm{ABC}$와 삼각형 $\mathrm{ABD}$의 넓이 중 더 큰 값을 $S$라 하자.
- label: ㄷ
  body: |
    제시문 (ㄱ)의 점 $\mathrm{A}$와 다음 조건을 만족시키는 모든 점 $\mathrm{P}$, $\mathrm{Q}$에 대하여 삼각형 $\mathrm{APQ}$의 넓이의 최댓값을 $M$이라 하자.

    (가) 두 점 $\mathrm{P}$, $\mathrm{Q}$는 원 $x^2+y^2=18$ 위에 있다.

    (나) $\overline{\mathrm{PQ}}=6$

    (다) 세 점 $\mathrm{A}$, $\mathrm{P}$, $\mathrm{Q}$는 한 직선 위에 있지 않다.
