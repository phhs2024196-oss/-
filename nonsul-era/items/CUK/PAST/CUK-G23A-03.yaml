  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선 $ax+by=9$가 $A(-5,0)$을 지나는 조건으로 $C\left(-\frac95,\frac{12}5\right)$, $D\left(-\frac95,-\frac{12}5\right)$를 구하고, 직선 $AB$까지의 거리로 두 삼각형의 넓이를 비교해 $S=6$을 얻는다.
    steps:
    - id: 1a-1
      content: 접선 $ax+by=9$가 $A(-5,0)$을 지나는 조건으로 $C\left(-\frac95,\frac{12}5\right)$, $D\left(-\frac95,-\frac{12}5\right)$를 구하고, 직선 $AB$까지의 거리로 두 삼각형의 넓이를 비교해 $S=6$을 얻는다.
      criteria:
      - 1.M1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        원 $x^2+y^2=9$ 위의 한 점 $(a,b)$에서의 접선이 점 $\mathrm{A}$를 지난다고 하자. 접선의 방정식은 $ax+by=9$이고, 이 접선이 점 $\mathrm{A}(-5,0)$을 지나므로 $-5a=9$이다. 즉, $a=-\dfrac95$이다. 점 $(a,b)$는 원 위에 있으므로 $a^2+b^2=9$이고, $b=\pm\dfrac{12}5$이다. 제시문 (ㄱ)에 의하여 $\mathrm{C}\left(-\dfrac95,\dfrac{12}5\right)$이고 $\mathrm{D}\left(-\dfrac95,-\dfrac{12}5\right)$이다.
      source_flow: 30916_fb49.pdf p.46 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\overline{\mathrm{AB}}=\sqrt{10}$이고 직선 $\mathrm{AB}$의 방정식은 $3x-y+15=0$이므로 점 $\mathrm{C}$, $\mathrm{D}$에서 직선 $\mathrm{AB}$까지의 거리는 각각 $\dfrac{|-27-12+75|}{5\sqrt{10}}=\dfrac{36}{5\sqrt{10}}$, $\dfrac{|-27+12+75|}{5\sqrt{10}}=\dfrac{12}{\sqrt{10}}$이다. 따라서 $S=\dfrac12\times\sqrt{10}\times\dfrac{12}{\sqrt{10}}=6$이다.
      source_flow: 30916_fb49.pdf p.46 예시답안 [논제 1]
      criteria:
      - 1.A1
