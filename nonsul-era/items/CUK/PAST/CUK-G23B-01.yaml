stimuli:
- label: ㄱ
  body: |
    다음 조건을 만족시키는 모든 실수 $k$의 집합을 $A$라고 하자.

    모든 실수 $x$에 대하여 $\log_{\left(\frac12k-5\right)}\{-(k-11)x^2+(k-11)x+2\}$가 정의된다.
- label: ㄴ
  body: |
    제시문 (ㄱ)의 집합 $A$에 대하여 집합 $B$를 다음과 같이 정의한다.

    $B=\left\{(m,n)\;\middle\vert\;\dfrac13m^2+n\in A,\ n>1,\ m\text{과 }n\text{은 정수}\right\}$
- label: ㄷ
  body: |
    제시문 (ㄴ)의 집합 $B$에 대하여 집합 $C$를 다음과 같이 정의한다.

    $C=\{(m,n)\mid(m,n)\in B\text{이고, }x^n=m\text{을 만족하는 실수 }x\text{가 존재한다.}\}$
- label: ㄹ
  body: |
    [$a$의 $n$제곱근] $n$이 $2$ 이상의 정수일 때, $n$제곱하여 실수 $a$가 되는 수, 즉 $x^n=a$를 만족시키는 수 $x$를 $a$의 $n$제곱근이라고 한다.
stem: |
