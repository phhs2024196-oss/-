  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 로그의 정의 조건과 이차부등식으로 $A=\{k\mid10<k\le11\}$를 구하고, $B$의 정수 순서쌍을 $m$별로 나열한 뒤 $m$의 $n$제곱근 중 실수가 존재하는 것만 세어 $8$개를 얻는다.
    steps:
    - id: 1a-1
      content: 로그의 정의 조건과 이차부등식으로 $A=\{k\mid10<k\le11\}$를 구하고, $B$의 정수 순서쌍을 $m$별로 나열한 뒤 $m$의 $n$제곱근 중 실수가 존재하는 것만 세어 $8$개를 얻는다.
      criteria:
      - 1.M1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        모든 실수 $x$에 대해, $\log_{\left(\frac12k-5\right)}\left\{-(k-11)x^2+(k-11)x+2\right\}$가 정의되기 위한 실수 $k$는 ① $\dfrac12k-5>0,\ \dfrac12k-5\ne1$ ② 모든 실수 $x$에 대해, $-(k-11)x^2+(k-11)x+2>0$이 성립해야 한다. ① $\dfrac12k-5>0,\ \dfrac12k-5\ne1\Rightarrow k>10,\ k\ne12$ ② ㉠ $k\ne11$일 때 $-(k-11)>0$이고 $D=(k-11)^2-4\left(-2(k-11)\right)=(k-3)(k-11)<0$이므로 $3<k<11$이다.
      source_flow: 30916_fb49.pdf p.51 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ㉡ $k=11$일 때 $-(k-11)x^2+(k-11)x+2=2>0$이 성립한다. 따라서, ㉠, ㉡에 의해 이를 만족하는 실수 $k$의 범위는 $3<k\le11$이다. ①, ②에 의해, 집합 $A=\{k\mid10<k\le11\}$이다.
      source_flow: 30916_fb49.pdf p.51 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        제시문 (ㄴ)의 집합 $B$의 정의에 의해, $n>1$이면서 집합 $B$의 원소인 정수의 순서쌍 $(m,n)$은 $10<\dfrac13m^2+n\le11\Rightarrow10-\dfrac13m^2<n\le11-\dfrac13m^2$을 만족시키므로, 집합 $B$에 속하는 원소를 모두 나열해보면 다음과 같다. $m=0$: $10<n\le11\Rightarrow n=11$ / $m=\pm1$: $\dfrac{29}3<n\le\dfrac{32}3\Rightarrow n=10$ / $m=\pm2$: $\dfrac{26}3<n\le\dfrac{29}3\Rightarrow n=9$ / $m=\pm3$: $7<n\le8\Rightarrow n=8$ / $m=\pm4$: $\dfrac{14}3<n\le\dfrac{17}3\Rightarrow n=5$ / $m=\pm5$: $\dfrac53<n\le\dfrac83\Rightarrow n=2$. 한편, 제시문 (ㄷ)의 집합 $C$의 정의에 의해, 순서쌍 $(m,n)\in B$이 집합 $C$의 원소이기 위해서는, $m$의 $n$제곱근 중 실수가 존재해야 한다.
      source_flow: 30916_fb49.pdf p.51 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        ㉠ $m=0$인 경우: $0$의 $n$제곱근은 임의의 정수 $n$에 대해서 $0$이므로, $(0,11)$은 $C$의 원소이다. ㉡ $m\ne0$인 경우 ⓐ $n$이 짝수일 때: $n$이 짝수일 경우, $m$의 $n$제곱근 중 실수는 $m>0$일 때 존재한다. 따라서, 집합 $B$에 속하는 정수의 순서쌍 $(m,n)$중, $n$이 짝수이면서 $n>1$인 경우를 생각해보면 다음과 같다. $n=2$일 때, $m=5\Rightarrow(5,2)$ / $n=8$일 때, $m=3\Rightarrow(3,8)$ / $n=10$일 때, $m=1\Rightarrow(1,10)$ ⓑ $n$이 홀수일 때: $n$이 홀수일 경우, $m$의 $n$제곱근 중 실수는 유일하게 하나 존재한다. 따라서, 집합 $B$에 속하는 정수의 순서쌍 $(m,n)$중, $n$이 홀수인 경우를 생각해보면 다음과 같다. $n=5$일 때, $m=\pm4\Rightarrow(-4,5),\ (4,5)$ / $n=9$일 때, $m=\pm2\Rightarrow(-2,9),\ (2,9)$
      source_flow: 30916_fb49.pdf p.51 예시답안 [논제 1]
      criteria:
      - 1.A3
    - id: 1b-5
      content: |
        따라서, 집합 $C$의 원소의 개수는 $8$개이다.
      source_flow: 30916_fb49.pdf p.51 예시답안 [논제 1]
      criteria:
      - 1.A4
