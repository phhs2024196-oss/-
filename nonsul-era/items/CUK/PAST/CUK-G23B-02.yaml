  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '공통접선의 기울기를 구해 $l: y=2x-1$, $m: y=\frac12x-1$을 정하고, 사인법칙으로 $f(t)=2\sqrt{t-t^2}$, $g(t)=\frac{\sqrt{4t-t^2}}2$를 구해 $f(t)g(t)$의 증감표로 $M=\frac{15-\sqrt{97}}8$을 얻는다.'
    steps:
    - id: 1a-1
      content: '공통접선의 기울기를 구해 $l: y=2x-1$, $m: y=\frac12x-1$을 정하고, 사인법칙으로 $f(t)=2\sqrt{t-t^2}$, $g(t)=\frac{\sqrt{4t-t^2}}2$를 구해 $f(t)g(t)$의 증감표로 $M=\frac{15-\sqrt{97}}8$을 얻는다.'
      criteria:
      - 1.M1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 원에 동시에 접하는 직선을 $y=ax+b$라 표현하면, 원 $C_1:(x-1)^2+y^2=\dfrac15$과의 거리가 $\dfrac1{\sqrt5}$이고 원 $C_2:(x+2)^2+(y+3)^2=\dfrac45$와의 거리가 $\dfrac2{\sqrt5}$이므로 두 식 $\dfrac{|a+b|}{\sqrt{a^2+1}}=\dfrac1{\sqrt5}$, $\dfrac{|-2a+b+3|}{\sqrt{a^2+1}}=\dfrac2{\sqrt5}$를 만족시킨다. 즉, $2|a+b|=|-2a+b+3|$, $5(a+b)^2=(a^2+1)$을 만족하는 $a$, $b$의 쌍을 구하면 두 원에 접하는 접선을 모두 찾을 수 있다.
      source_flow: 30916_fb49.pdf p.55 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        i) $2(a+b)=(-2a+b+3)$인 경우, $b=-4a+3$이므로 이를 두 번째 식에 대입하면 $44a^2-90a+44=0$을 얻을 수 있고, $a=\dfrac{45\pm\sqrt{45^2-44^2}}{44}=\dfrac{45\pm\sqrt{89}}{44}$이다. ii) $2(a+b)=(2a-b-3)$인 경우, $b=-1$이므로 이를 대입하면 $a=2$ 혹은 $\dfrac12$이다. 따라서 $2>\dfrac{45+\sqrt{89}}{44}>\dfrac{45-\sqrt{89}}{44}>\dfrac12$이므로 직선 $l$은 $y=2x-1$, 직선 $m$은 $y=\dfrac12x-1$이다.
      source_flow: 30916_fb49.pdf p.55 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        이제 $f(t)=\sin(\angle\mathrm{P}_1\mathrm{A}_1\mathrm{Q}_1)$을 구해보자. 사인법칙에 의해 $\sin(\angle\mathrm{P}_1\mathrm{A}_1\mathrm{Q}_1)=\dfrac{\sqrt5}{2}\overline{\mathrm{P}_1\mathrm{Q}_1}$이고, $\mathrm{P}_1\mathrm{Q}_1$과 원 $C_1$의 중심 사이의 거리는 점과 직선의 거리에 의해 $\dfrac{\left|\frac12-1+t\right|}{\sqrt{\frac14+1}}=\dfrac{|2t-1|}{\sqrt5}$이므로 $\overline{\mathrm{P}_1\mathrm{Q}_1}=2\sqrt{\dfrac15-\dfrac{(2t-1)^2}{5}}=\dfrac{4\sqrt{t-t^2}}{\sqrt5}$이다. 즉, $f(t)=2\sqrt{t-t^2}$이다. $g(t)=\sin(\angle\mathrm{P}_2\mathrm{A}_2\mathrm{Q}_2)$의 경우 $\sin(\angle\mathrm{P}_2\mathrm{A}_2\mathrm{Q}_2)=\dfrac{\sqrt5}{4}\overline{\mathrm{P}_2\mathrm{Q}_2}$이고, $\overline{\mathrm{P}_2\mathrm{Q}_2}$와 원 $C_2$의 중심 사이의 거리는 $\dfrac{|-4-1+t+3|}{\sqrt{4+1}}=\dfrac{|t-2|}{\sqrt5}$이므로 $\overline{\mathrm{P}_2\mathrm{Q}_2}=2\sqrt{\dfrac45-\dfrac{(t-2)^2}{5}}=\dfrac{2\sqrt{4t-t^2}}{\sqrt5}$이고, $g(t)=\dfrac{\sqrt{4t-t^2}}2$이다.
      source_flow: 30916_fb49.pdf p.55 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        따라서 제시문 (ㄹ)의 함수는 $y=f(t)g(t)=\sqrt{(t-t^2)(4t-t^2)}$이다. 4차함수 $(t-t^2)(4t-t^2)$와 함수의 증감이 동일하므로 미분이 $0$이 되는 $t$를 찾으면 $8t-15t^2+4t^3=0$에서 $t=0,\ \dfrac{15\pm\sqrt{97}}8$이다. 즉, $y=f(t)g(t)$의 증감표는 정의역 $(0,1)$에서 $t$가 $\dfrac{15-\sqrt{97}}8$의 앞에서는 $f(t)g(t)$ 증가, $\dfrac{15-\sqrt{97}}8$에서 최댓값, 뒤에서는 감소이다. 따라서 $M=\dfrac{15-\sqrt{97}}8$이다.
      source_flow: 30916_fb49.pdf p.55 예시답안 [논제 1]
      criteria:
      - 1.A3
