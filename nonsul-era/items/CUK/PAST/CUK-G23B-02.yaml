stimuli:
- label: ㄱ
  body: |
    좌표평면 위의 원 $C_1$, $C_2$는 다음과 같다.

    $C_1:\ (x-1)^2+y^2=\dfrac15$

    $C_2:\ (x+2)^2+(y+3)^2=\dfrac45$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 원 $C_1$, $C_2$에 동시에 접하는 직선 중 기울기가 최대인 직선을 $l$, 최소인 직선을 $m$이라 하자.
- label: ㄷ
  body: |
    제시문 (ㄱ)의 원 $C_1$, $C_2$와 제시문 (ㄴ)의 직선 $l$, $m$에 대하여 정의역이 열린구간 $(0,1)$인 함수 $f(t)$, $g(t)$를 다음과 같이 정의한다.

    (가) 직선 $l$이 원 $C_1$에 접하는 점을 $\mathrm{A}_1$, 직선 $m$이 원 $C_2$에 접하는 점을 $\mathrm{A}_2$라 하자.

    (나) 직선 $m$을 $y$축의 방향으로 $t$만큼 평행이동한 직선과 원 $C_1$의 두 교점을 $\mathrm{P}_1$, $\mathrm{Q}_1$이라 할 때, $f(t)=\sin(\angle\mathrm{P}_1\mathrm{A}_1\mathrm{Q}_1)$이다. (단, $0<t<1$)

    (다) 직선 $l$을 $y$축의 방향으로 $t$만큼 평행이동한 직선과 원 $C_2$의 두 교점을 $\mathrm{P}_2$, $\mathrm{Q}_2$라 할 때, $g(t)=\sin(\angle\mathrm{P}_2\mathrm{A}_2\mathrm{Q}_2)$이다. (단, $0<t<1$)
- label: ㄹ
  body: |
    제시문 (ㄷ)의 함수 $f(t)$와 $g(t)$에 대하여 실수 $M$은 다음 조건을 만족시킨다.

    정의역이 열린구간 $(0,1)$인 함수 $y=f(t)g(t)$는 $t=M$에서 최댓값을 갖는다.
