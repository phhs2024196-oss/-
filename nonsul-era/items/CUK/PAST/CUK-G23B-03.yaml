    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 부분적분으로 $f(t)=\frac{t}{(1+t^4)^{1/4}}$을 구하고, $v(t)\ge0$이므로 $s=\int_0^1v(t)dt$를 $u=1+t^4$로 치환하여 $s=2^{3/4}$, $s^4=8$을 얻는다.
    steps:
    - id: 1a-1
      content: 부분적분으로 $f(t)=\frac{t}{(1+t^4)^{1/4}}$을 구하고, $v(t)\ge0$이므로 $s=\int_0^1v(t)dt$를 $u=1+t^4$로 치환하여 $s=2^{3/4}$, $s^4=8$을 얻는다.
      criteria:
      - 1.M1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $F(x)=x$, $G(x)=\dfrac1{(1+x^4)^{\frac14}}$라 하자. 부분적분법에 의하여 $$\int_0^t\frac1{(1+x^4)^{\frac14}}dx=\int_0^tF'(x)G(x)dx=\Big[F(x)G(x)\Big]_0^t-\int_0^tF(x)G'(x)dx=\left[\frac{x}{(1+x^4)^{\frac14}}\right]_0^t+\int_0^t\frac{x^4}{(1+x^4)^{\frac54}}dx$$
      source_flow: 30916_fb49.pdf p.59 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서, 제시문 (ㄱ)의 함수는 다음과 같다. $$f(t)=\int_0^t\frac1{(1+x^4)^{\frac14}}dx-\int_0^t\frac{x^4}{(1+x^4)^{\frac14}}dx=\left[\frac{x}{(1+x^4)^{\frac14}}\right]_0^t+\int_0^t\frac{x^4}{(1+x^4)^{\frac14}}dx-\int_0^t\frac{x^4}{(1+x^4)^{\frac14}}dx=\frac{t}{(1+t^4)^{\frac14}}$$ [판독확인: 원문 예시답안에서 둘째·셋째 적분의 분모 지수가 $\frac14$로 인쇄되어 있음(제시문 (ㄱ)의 $\frac54$의 오기로 보임), 원문대로 옮김]
      source_flow: 30916_fb49.pdf p.59 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $f(t)$가 $[0,1]$에서 $f(t)\ge0$이므로 제시문 (ㄷ)의 $s$는 $$s=\int_0^1|v(t)|dx=\int_0^1v(t)dx=\int_0^1\frac{3t^3}{(1+t^4)^{\frac14}}dt+\int_0^13t^2dt=\int_0^1\frac{3t^3}{(1+t^4)^{\frac14}}dt+1$$ 위의 적분에서 $u=1+t^4$로 치환하면 치환적분법에 의해서 $$\int_0^1\frac{3t^3}{(1+t^4)^{\frac14}}dt=\frac34\int_1^2u^{-\frac14}du=\left[u^{\frac34}\right]_1^2=2^{\frac34}-1$$이므로, $$s=\int_0^1\frac{3t^3}{(1+t^4)^{\frac14}}dt+1=2^{\frac34}$$
      source_flow: 30916_fb49.pdf p.59 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        따라서 $s^4=8$
      source_flow: 30916_fb49.pdf p.59 예시답안 [논제 1]
      criteria:
      - 1.A3
