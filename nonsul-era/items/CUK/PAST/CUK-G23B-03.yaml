key_idea: $\int\frac{1}{(1+x^4)^{1/4}}dx$를 부분적분하면 $f(t)$의 두 적분이 상쇄되어 $f(t)=\frac{t}{(1+t^4)^{1/4}}$이 된다. $f(t)\ge0$이므로 이동 거리 $s=\int_0^1v(t)dt$이고, $u=1+t^4$로 치환하여 $s=2^{3/4}$, $s^4=8$을 얻는다.
