stimuli:
- label: ㄱ
  body: |
    함수 $f(t)$를 다음과 같이 정의한다.

    $f(t)=\displaystyle\int_0^t\left\{\dfrac1{(1+x^4)^{\frac14}}-\dfrac{x^4}{(1+x^4)^{\frac54}}\right\}dx$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $f(t)$에 대하여 수직선 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 속도 $v(t)$는 다음과 같다.

    $v(t)=3t^2\{f(t)+1\}$
- label: ㄷ
  body: |
    제시문 (ㄴ)의 점 $\mathrm{P}$에 대하여 $s$는 $t=0$에서 $t=1$까지 점 $\mathrm{P}$가 움직인 거리이다.
stem: |
  제시문 (ㄱ)~(ㄹ)을 읽고 논제에 답하시오. (180점)
subparts:
- id: '1'
  stem: |
    (180점) 제시문 (ㄷ)의 $s$에 대하여 $s^4$의 값을 구하고 그 근거를 논술하시오.
  points: 180
  depends_on: []
  answer:
    kind: value
    value: s^4=8
    equivalents:
