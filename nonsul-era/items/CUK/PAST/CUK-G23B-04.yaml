stimuli:
- label: ㄱ
  body: |
    수열 $\{a_n\}$은 다음 조건을 만족시킨다.

    (가) $a_1=0$

    (나) 모든 자연수 $n$에 대하여 $a_n<a_{n+1}$이다.

    (다) 실수 $x$가 $a_n<x\le a_{n+1}$일 때, 집합 $\left\{\dfrac1k\ln\dfrac kx\;\middle\vert\;1\le k\le5n,\ k\text{는 자연수}\right\}$의 원소 중 최댓값은 $\dfrac1n\ln\dfrac nx$이다.
- label: ㄴ
  body: |
    제시문 (ㄱ)의 수열 $\{a_n\}$에 대하여 급수의 합 $S$를 다음과 같이 정의한다.

    $S=\displaystyle\sum_{n=1}^{\infty}\left\{\left(\dfrac{a_{n+1}}n\right)^{\frac1n}-\left(\dfrac{a_n}n\right)^{\frac1n}\right\}$
stem: |
  제시문 (ㄱ)~(ㄴ)을 읽고 논제에 답하시오. (190점)
subparts:
- id: '1'
  stem: |
    (190점) 제시문 (ㄴ)의 $S$의 값을 구하고 그 근거를 논술하시오.
  points: 190
  depends_on: []
  answer:
    kind: value
    value: S=1
    equivalents:
    - '1'
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (다)의 조건은 $\frac1k\ln\frac kx$가 $k=n$에서 최대가 되는 것이므로 $k$에 대해 증가 후 감소여야 한다. 인접 항의 차를 로그 하나로 묶어 $a_n=\frac{(n-1)^n}{n^{n-1}}$을 구하고 망원급수로 $S=1$을 얻는다.
    steps:
    - id: 1a-1
      content: (다)의 조건은 $\frac1k\ln\frac kx$가 $k=n$에서 최대가 되는 것이므로 $k$에 대해 증가 후 감소여야 한다. 인접 항의 차를 로그 하나로 묶어 $a_n=\frac{(n-1)^n}{n^{n-1}}$을 구하고 망원급수로 $S=1$을 얻는다.
      criteria:
      - 1.M1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        제시문 (ㄱ)의 (다)는 범위에 포함되는 $x$와 $1\le k\le5n$인 모든 자연수에 대하여 $\dfrac1k\ln\dfrac kx\le\dfrac1n\ln\dfrac nx$이 성립함을 말한다. 그런데, 자연수 $k$와 임의의 양의 실수 $x$에 대하여 $$\frac1k\ln\frac kx-\frac1{k+1}\ln\frac{k+1}x=\frac1{k(k+1)}\ln\frac{k^{k+1}}{(k+1)^kx}\quad\cdots\cdots(*)$$이므로, $x\le\dfrac{k^{k+1}}{(k+1)^k}$이면 $\dfrac1k\ln\dfrac kx\ge\dfrac1{k+1}\ln\dfrac{k+1}x$이고, $x>\dfrac{k^{k+1}}{(k+1)^k}$이면 $\dfrac1k\ln\dfrac kx<\dfrac1{k+1}\ln\dfrac{k+1}x$이다.
      source_flow: 30916_fb49.pdf p.62 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이 때, $$\frac{(k-1)^k}{k^{k-1}}\Big/\frac{k^{k+1}}{(k+1)^k}=\left(\frac{k^2-1}{k^2}\right)^k<1\quad\cdots\cdots(**)$$이므로 $\dfrac{(k-1)^k}{k^{k-1}}<\dfrac{k^{k+1}}{(k+1)^k}$이 성립하여, $k$가 증가함에 따라 $\dfrac1k\ln\dfrac kx$는 증가하다가 감소하는 형태가 된다.
      source_flow: 30916_fb49.pdf p.62 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        따라서, 제시문 (ㄱ)의 (다)가 성립하려면, $\dfrac1k\ln\dfrac kx$이 $1\le k\le n$에서 증가하고 $n\le k\le5n$에서는 감소해야 한다. 식 $(*)$에 $k=n$을 넣으면 $x\le\dfrac{n^{n+1}}{(n+1)^n}$인 경우, $$\frac1n\ln\frac nx\ge\frac1{n+1}\ln\frac{n+1}x\ge\frac1{n+2}\ln\frac{n+2}x\ge\cdots\ge\frac1{5n}\ln\frac{5n}x$$임을 알 수 있다. 식 $(*)$에 $k=n-1$을 넣으면 $\dfrac{(n-1)^n}{n^{n-1}}<x$인 경우, $$\frac1n\ln\frac nx>\frac1{n-1}\ln\frac{n-1}x>\frac1{n-2}\ln\frac{n-2}x>\cdots>\ln\frac1x$$가 된다.
      source_flow: 30916_fb49.pdf p.62 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        또한 $(**)$에 의하여 $\dfrac{(n-1)^n}{n^{n-1}}<\dfrac{n^{n+1}}{(n+1)^n}$ [제시문 (ㄱ)의 (나)]이므로, $a_n=\dfrac{(n-1)^n}{n^{n-1}}$이다.
      source_flow: 30916_fb49.pdf p.62 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-5
      content: |
        $\left(\dfrac{a_n}n\right)^{\frac1n}=\dfrac{n-1}n$, $\left(\dfrac{a_{n+1}}n\right)^{\frac1n}=\dfrac n{n+1}$이므로, $S=\displaystyle\sum_{n=1}^{\infty}\left\{\left(\dfrac{a_{n+1}}n\right)^{1/n}-\left(\dfrac{a_n}n\right)^{1/n}\right\}=\sum_{n=1}^{\infty}\left(\dfrac1n-\dfrac1{n+1}\right)=1$이다.
      source_flow: 30916_fb49.pdf p.62 예시답안 [논제 1]
      criteria:
      - 1.A3
