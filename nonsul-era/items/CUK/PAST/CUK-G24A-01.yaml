      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: 판별식 $\frac D4=(m+n)^2+4mn$이 제곱수인 순서쌍 $(2,3),(3,2)$와 $x=2$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: $a=6$, $a=8$을 구했다.
      depends_on:
