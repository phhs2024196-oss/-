stimuli:
- label: ㄱ
  body: |
    각 변의 길이가 자연수인 삼각형 $\mathrm{ABC}$는 다음을 만족시킨다.

    $$\sin C\cos(B+C)+\sin B=0$$
- label: ㄴ
  body: 제시문 (ㄱ)의 삼각형 $\mathrm{ABC}$에 대하여 내접원의 반지름을 $r$, 외접원의 반지름을 $R$, 선분 $\mathrm{AB}$의 길이를 $c$라고 하자.
- label: ㄷ
  body: |
    제시문 (ㄱ)의 삼각형 $\mathrm{ABC}$가 다음을 만족시킬 때, 선분 $\mathrm{BC}$의 길이를 $a$라고 하자.

    삼각형 $\mathrm{ABC}$의 내접원이 선분 $\mathrm{AB}$와 만나는 점을 $\mathrm{P}$라고 할 때, 점 $\mathrm{P}$는 선분 $\mathrm{AB}$를 $m:n$으로 내분한다. (단, $m$, $n$은 $3$ 이하의 자연수이다.)
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
subparts:
- id: '1'
  stem: (15점) 제시문 (ㄴ)의 $R$, $c$에 대하여 $\frac{c}{R}$의 값을 구하고 그 근거를 논술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents:
    - \frac{c}{R}=2
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 조건식을 사인·코사인법칙으로 바꾸면 $c^2=a^2+b^2$이므로 $C$가 직각이고 $\frac cR=2\sin C=2$이다.
    steps:
    - id: 1a-1
      content: $\cos(B+C)=-\cos A$, 사인·코사인법칙으로 $c^2=a^2+b^2$ → $C=\frac\pi2$ → $\frac cR=2\sin C=2$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 삼각형 $\mathrm{ABC}$의 세 각의 합은 $\pi$이므로 $\cos(B+C)=\cos(\pi-A)=-\cos A$이다.
      source_flow: 32980_b022.pdf p.33 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 한편, $\overline{BC}=a$, $\overline{AC}=b$라 하면, 사인법칙과 코사인법칙에 의해 $\sin B=\frac b{2R}$, $\sin C=\frac c{2R}$, $\cos A=\frac{b^2+c^2-a^2}{2bc}$이므로 $$\begin{aligned}\sin C\cos(B+C)+\sin B=0&\iff-\sin C\cos A+\sin B=0\\&\iff-\frac c{2R}\cdot\frac{b^2+c^2-a^2}{2bc}+\frac b{2R}=0\\&\iff c^2=a^2+b^2\end{aligned}$$를 얻는다.
      source_flow: 32980_b022.pdf p.33 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-3
      content: 따라서 주어진 삼각형은 $C$가 직각인 직각삼각형이고, 사인법칙을 이용하면 $\frac cR=2\sin C=2$이다.
      source_flow: 32980_b022.pdf p.33 예시답안 [논제 1]
      criteria:
      - 1.A2
