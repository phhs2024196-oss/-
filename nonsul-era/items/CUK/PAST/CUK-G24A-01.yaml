intent: 사인법칙과 코사인법칙을 활용할 수 있는지, 선분의 내분을 이해하고 활용할 수 있는지, 이차방정식에서 판별식의 의미를 이해하고 활용할 수 있는지 확인한다.
key_idea: $\cos(B+C)=-\cos A$와 사인·코사인법칙으로 $c^2=a^2+b^2$, 즉 $C=\frac\pi2$를 얻어 $\frac cR=2\sin C=2$를 구한다. 내접원의 접선 길이로 $a=nx+2$, $b=mx+2$, $c=(m+n)x$로 놓고 $c^2=a^2+b^2$에 대입한 이차방정식이 유리근을 가질 조건(판별식이 제곱수)으로 $(m,n)$을 가려낸다.
stuck: 조건식에서 직각삼각형임을 이끌어내는 단계, 자연수 변의 길이로부터 $x$가 유리수여야 함을 이용해 $\frac D4$가 제곱수인 $(m,n)$을 가려내는 단계
