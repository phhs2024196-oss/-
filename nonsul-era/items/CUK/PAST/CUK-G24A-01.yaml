- id: '2'
  stem: '(15점) 제시문 (ㄴ)의 $r$의 값이 $2$일 때, 제시문 (ㄷ)의 [판독확인: 원본에 기호가 빠져 있음, 문맥상 $a$] 의 값으로 가능한 것을 모두 구하고 그 근거를 논술하시오.'
  points: 15
  depends_on:
  - '1'
  answer:
    kind: value
    value: 6, 8
    equivalents:
    - a=6, 8
    - a\in\{6,8\}
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overline{AP}=mx$, $\overline{PB}=nx$로 놓으면 $a=nx+2$, $b=mx+2$, $c=(m+n)x$이고 $c^2=a^2+b^2$에서 얻은 이차방정식이 유리근을 가질 $(m,n)$을 판별식으로 찾는다.
    steps:
    - id: 2a-1
      content: $mnx^2-2(m+n)x-4=0$이 유리근을 가지려면 $(m+n)^2+4mn$이 제곱수 → $(m,n)=(2,3),(3,2)$, $x=2$ → $a=6,8$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $\overline{AP}=mx$, $\overline{PB}=nx$(단, $x>0$)라 하면, 내접원의 성질에 의해 $a=nx+2$, $b=mx+2$, $c=(m+n)x$이고, $a$, $b$, $c$는 자연수이므로 $x$는 유리수여야 한다. 이를 $c^2=a^2+b^2$에 대입하면 $$(m+n)^2x^2=(nx+2)^2+(mx+2)^2\iff mnx^2-2(m+n)x-4=0$$을 얻는다.
      source_flow: 32980_b022.pdf p.33 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 이차방정식 $mnx^2-2(m+n)x-4=0$의 판별식을 $D$라 하면 $\frac D4=(m+n)^2+4mn$은 어떤 자연수의 제곱이어야 한다. $m$, $n$이 $3$ 이하인 자연수이므로 가능한 모든 경우를 조사해보면 $(m,n)=(1,1)$이면 $8$, $(1,2),(2,1)$이면 $17$, $(1,3),(3,1)$이면 $28$, $(2,2)$이면 $32$, $(2,3),(3,2)$이면 $49$, $(3,3)$이면 $72$이다. 따라서 $x$가 유리수가 되는 순서쌍은 $(2,3),(3,2)$이다. 이때 $x=\frac{(m+n)\pm\sqrt{(m+n)^2+4mn}}{mn}=-\frac13,\ 2$이고, $x$는 양수이므로 $x=2$이다.
      source_flow: 32980_b022.pdf p.34 예시답안 [논제 2]
      criteria:
      - 2.A1
    - id: 2b-3
      content: 따라서 $m=3$, $n=2$이면 $a=nx+2=6$, $m=2$, $n=3$이면 $a=nx+2=8$을 얻고, $a$의 값으로 가능한 것은 $6$, $8$이다.
      source_flow: 32980_b022.pdf p.34 예시답안 [논제 2]
      criteria:
      - 2.A2
