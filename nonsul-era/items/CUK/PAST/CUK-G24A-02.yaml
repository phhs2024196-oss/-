elements:
  materials:
  - '삼차함수 $f(x)$: $f(x)+f(-x)=4$, $f''(0)>0$, $f''(1)-f''(0)=-3$'
  - 방정식 $f(x)=k$의 서로 다른 실근의 개수 $A(k)$
  - 조건 $A(0)\ge A(18)\ge A(20)$, $A(0)-A(18)=A(20)$, $I=\int_0^2f(x)dx$
  concepts:
  - 미분계수
  - 삼차함수의 극값
  - 방정식의 실근의 개수
  - 정적분
  tools:
  - $f(x)=ax^3+bx^2+cx+d$에서 $f(x)+f(-x)=2bx^2+2d=4$ → $b=0$, $d=2$
  - $f'(x)=-3x^2+c$, 극값 $f\left(\pm\sqrt{\frac c3}\right)=2\pm\frac{2c\sqrt c}{3\sqrt3}$
  - $A(k)\le3$이므로 $A(20)=3,2,1$을 나누어 검토
  - 극솟값 $0$이면 $c=3$, 극댓값 $18$이면 $c=12$
  conditions:
  - $f'(0)>0$이므로 $c>0$
  - 극솟값은 항상 $2$보다 작고 극댓값은 항상 $2$보다 크다
  - $A(k)$는 $3$ 이하의 자연수
