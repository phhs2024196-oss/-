intent: 미분계수의 뜻을 알고 미분계수를 구할 수 있는지, 도함수를 활용하여 삼차방정식의 근의 개수를 파악할 수 있는지, 미분과 이를 활용하여 함수의 극대·극소를 알아내고 삼차함수의 적분을 구할 수 있는지 확인한다.
key_idea: $f(x)+f(-x)=4$로 $b=0$, $d=2$, $f'(1)-f'(0)=-3$으로 $a=-1$을 얻는다. $A(k)\le3$이고 $A(0)\ge A(18)\ge A(20)$, $A(0)-A(18)=A(20)$에서 $A(20)=1$이고 $(A(0),A(18))=(2,1)$ 또는 $(3,2)$임을 경우를 나눠 찾고, 극솟값 $0$(극댓값 $4$) 또는 극댓값 $18$로 $c$를 정해 $I=6,24$를 구한다.
stuck: $A(k)$의 값 조합을 경우 분류하여 조건 (가), (나)를 만족하는 경우만 남기는 단계, 극솟값·극댓값이 $0$ 또는 $18$이 되는 $c$를 정하는 단계
