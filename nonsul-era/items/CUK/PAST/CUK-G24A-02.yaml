      - 2b-4
    - id: 2.A4
      mark_type: A
      points: 5
      evidence: $A(0)=3$, $A(18)=2$, $A(20)=1$인 경우 극댓값이 $18$이 되어야 함을 밝혀 $c=12$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-5
    - id: 2.A5
      mark_type: A
      points: 2
      evidence: $f(x)=-x^3+12x+2$로 $I=24$를 구했다.
      depends_on:
      - 2.M1
