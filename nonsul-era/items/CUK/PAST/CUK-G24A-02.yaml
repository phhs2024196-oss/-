stimuli:
- label: ㄱ
  body: |
    삼차함수 $f(x)$는 다음을 만족시킨다.

    (가) 모든 실수 $x$에 대하여 $f(x)+f(-x)=4$

    (나) $f'(0)>0$이고 $f'(1)-f'(0)=-3$
- label: ㄴ
  body: 실수 $k$와 제시문 (ㄱ)의 함수 $f(x)$에 대하여 방정식 $f(x)=k$의 서로 다른 실근의 개수를 $A(k)$라고 하자.
- label: ㄷ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$에 대하여 제시문 (ㄴ)의 $A(k)$가 다음을 만족시킬 때, $I=\int_0^2f(x)dx$라고 하자.

    (가) $A(0)\ge A(18)\ge A(20)$

    (나) $A(0)-A(18)=A(20)$
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (35점)
