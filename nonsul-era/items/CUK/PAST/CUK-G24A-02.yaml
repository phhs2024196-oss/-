      depends_on:
      - 2.M1
      steps:
      - 2b-3
    - id: 2.A3
      mark_type: A
      points: 2
      evidence: $f(x)=-x^3+3x+2$로 $I=6$을 구했다.
      depends_on:
      - 2.M1
