    - I\in\{6,24\}
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=-x^3+cx+2$($c>0$)의 극솟값은 $2$보다 작고 극댓값은 $2$보다 크다. $A(k)$의 값 조합으로 경우를 나누면 극솟값이 $0$($c=3$) 또는 극댓값이 $18$($c=12$)일 때만 성립한다.
    steps:
    - id: 2a-1
      content: $A(20)=1$, $(A(0),A(18))=(2,1)$이면 극솟값 $0$, $c=3$, $I=6$ / $(3,2)$이면 극댓값 $18$, $c=12$, $I=24$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
      - 2.A3
      - 2.A4
      - 2.A5
      - 2.A6
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $f'(0)>0$이므로 $c>0$이다. 따라서 $f'(x)=-3x^2+c=0$은 두 실근 $x=\pm\sqrt{\frac c3}$을 가지고, 함수 $f(x)$는 $x=-\sqrt{\frac c3}$에서 극솟값 $f\left(-\sqrt{\frac c3}\right)=-\frac{2c\sqrt c}{3\sqrt3}+2$, $x=\sqrt{\frac c3}$에서 극댓값 $f\left(\sqrt{\frac c3}\right)=\frac{2c\sqrt c}{3\sqrt3}+2$를 갖는다. $c$는 양수이므로 극솟값은 $2$보다 작고, 극댓값은 $2$보다 크다.
      source_flow: 32980_b022.pdf p.39 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 제시문 (ㄴ)에 의하여 $A(k)$는 $3$ 이하의 자연수이다. $A(20)=3$이면, 조건 (가)에 의하여 $A(0)=3$, $A(18)=3$이 되지만, 조건 (나)를 만족시키지 않는다. $A(20)=2$이면, 조건 (나)를 만족시키는 경우는 $A(0)=3$, $A(18)=1$인데, 조건 (가)를 만족시키지 않는다. $A(20)=1$이면, $A(0)=3$, $A(18)=2$ 또는 $A(0)=2$, $A(18)=1$인 경우 조건 (가), (나)를 모두 만족시킨다. (이와 같은 구체적인 설명이 없어도 그래프를 이용해서 충분히 나타냈으면 5점 만점 부여)
      source_flow: 32980_b022.pdf p.38, 40 예시답안 [논제 2]
      criteria:
      - 2.A1
    - id: 2b-3
      content: 'ⅰ) $A(0)=2$, $A(18)=1$, $A(20)=1$인 경우: 함수 $f(x)$의 극솟값이나 극댓값이 $0$이 되어야 하지만, 극댓값은 항상 $2$보다 크므로, 극솟값이 $0$이 되어야 한다. 이 경우 $-\frac{2c\sqrt c}{3\sqrt3}+2=0$에서 $c=3$이고 이때 극댓값은 $4$이다.'
      source_flow: 32980_b022.pdf p.38, 40 예시답안 [논제 2]
      criteria:
      - 2.A2
    - id: 2b-4
      content: 따라서 $A(18)=1$, $A(20)=1$이 성립하고 $f(x)=-x^3+3x+2$이므로, $I=\int_0^2f(x)dx=\left[-\frac14x^4+\frac32x^2+2x\right]_0^2=6$이다.
      source_flow: 32980_b022.pdf p.38, 40 예시답안 [논제 2]
      criteria:
      - 2.A3
    - id: 2b-5
      content: 'ⅱ) $A(0)=3$, $A(18)=2$, $A(20)=1$인 경우: 함수 $f(x)$의 극솟값이나 극댓값이 $18$이 되어야 하지만, 극솟값은 항상 $2$보다 작으므로, 극댓값이 $18$이 되어야 한다. 극댓값이 $18$이므로 $\frac{2c\sqrt c}{3\sqrt3}+2=18$에서 $c=12$이고 이때, 극솟값은 $-14$이다.'
      source_flow: 32980_b022.pdf p.39, 40 예시답안 [논제 2]
      criteria:
      - 2.A4
    - id: 2b-6
      content: 따라서 $A(0)=3$, $A(20)=1$이 성립하고 $f(x)=-x^3+12x+2$이므로, $I=\int_0^2f(x)dx=\left[-\frac14x^4+6x^2+2x\right]_0^2=24$이다. 따라서, $I$의 값으로 가능한 것은 $6$, $24$이다.
      source_flow: 32980_b022.pdf p.38, 40 예시답안 [논제 2]
      criteria:
      - 2.A5
      - 2.A6
