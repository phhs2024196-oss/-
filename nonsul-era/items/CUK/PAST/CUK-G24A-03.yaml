intent: 등차수열의 일반항을 활용할 수 있는지, $\Sigma$의 뜻을 알고 이를 활용하여 여러 가지 수열의 합을 계산할 수 있는지 확인한다.
key_idea: $a_k+a_m=0$에서 $b=-\frac{2a}{l}$($l=k+m-2$)이 되어야 하고 $k+m=l+2$인 순서쌍 $(k<m)$의 개수가 $1$ 또는 $2$인 가장 큰 $l=4$에서 $d=-\frac a2$를 얻는다. $b_n=\frac a2(3-n)$이므로 $\lvert b_k\rvert$를 $k\le3$, $k\ge3$로 나누고 분모를 유리화하는 텔레스코핑 합으로 $S=\frac{12}{\sqrt a}$를 구한다.
stuck: 순서쌍 $(k,m)$의 개수 조건으로 $l$의 최댓값 $4$를 찾는 단계, 절댓값 때문에 합을 $k\le3$과 $k\ge3$로 나누어 유리화하는 단계
