stimuli:
- label: ㄱ
  body: 첫째항이 양의 실수 $a$이고 공차가 $b$인 등차수열 $\{a_n\}$에 대하여, $a_k+a_m=0$을 만족시키는 순서쌍 $(k,m)$(단, $k<m$)의 개수가 한 개 또는 두 개가 되도록 하는 공차 $b$ 중 가장 큰 값을 $d$라고 하자.
- label: ㄴ
  body: |
    제시문 (ㄱ)의 $a$, $d$에 대하여 수열 $\{b_n\}$이 첫째항이 $a$이고 공차가 $d$인 등차수열일 때, $S$는 다음과 같다.

    $$S=\sum_{k=1}^{52}\frac1{\sqrt{\lvert b_k\rvert}+\sqrt{\lvert b_{k+1}\rvert}}$$
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (35점)
subparts:
- id: '1'
  stem: (20점) 제시문 (ㄱ)의 $a$, $d$에 대하여 $d$를 $a$에 대한 식으로 나타내고 그 근거를 논술하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: d=-a/2
    equivalents:
    - d=-\frac{a}{2}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_k+a_m=0$에서 $b=-\frac{2a}l$이고, $k+m=l+2$인 순서쌍의 개수가 $2$ 이하가 되는 가장 큰 $l=4$에서 $d=-\frac a2$이다.
    steps:
    - id: 1a-1
      content: $b=-\frac{2a}l$, $l=4$이면 $(1,5),(2,4)$ 두 개, $l>4$이면 세 개 이상 → $d=-\frac a2$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 수열 $\{a_n\}$의 일반항은 $a_n=a+b(n-1)$이다. $a_k+a_m=2a+b(k+m-2)=0$이므로, $b=-\frac{2a}l$(단, $l$은 자연수)의 형태가 되어야 순서쌍이 존재한다.
      source_flow: 32980_b022.pdf p.42 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 이제, $k+m=l+2$를 만족시키는 순서쌍 $(k,m)$의 개수를 확인하여 제시문 (ㄱ)의 조건을 만족시키는 가장 큰 $l$값을 구하면 충분하다. 그런데, $l>4$이면 순서쌍 $(k,m)$은 $(1,l+1)$, $(2,l)$, $(3,l-1)$의 최소 세 개가 존재하고, $l=4$이면, $(1,5)$, $(2,4)$의 두 개의 순서쌍만 존재하므로 제시문 (ㄱ)의 조건을 만족시키는 $b$의 최댓값은 $-\frac a2$이다. 즉, $d=-\frac a2$이다.
      source_flow: 32980_b022.pdf p.43 예시답안 [논제 1]
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $a_k+a_m=2a+b(k+m-2)=0$에서 $b=-\frac{2a}l$($l$은 자연수) 꼴이어야 함을 밝혔다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: $k+m=l+2$인 순서쌍의 개수를 조사하여 $l>4$이면 세 개 이상, $l=4$이면 두 개임을 밝히고 $d=-\frac a2$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: (15점) 제시문 (ㄴ)의 $a$, $S$에 대하여 $S=3$일 때, $a$의 값을 구하고 그 근거를 논술하시오.
  points: 15
  depends_on:
  - '1'
  answer:
    kind: value
    value: '16'
    equivalents:
    - a=16
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $b_n=\frac a2(3-n)$이므로 $\lvert b_k\rvert$를 $k\le3$, $k\ge3$로 나누고 분모를 유리화하여 $S=\frac{12}{\sqrt a}$를 얻는다.
    steps:
    - id: 2a-1
      content: $S=\sqrt{\frac2a}(\sqrt2+5\sqrt2)=\frac{12}{\sqrt a}=3$ → $a=16$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $d=-\frac a2$이므로 $b_n=a-\frac a2(n-1)=\frac a2(3-n)$이다. $k\le3$이면 $\lvert b_k\rvert=\frac a2(3-k)$이고, $k\ge3$이면 $\lvert b_k\rvert=\frac a2(k-3)$이므로 $$S=\sqrt{\frac2a}\left(\sum_{k=1}^{2}\frac1{\sqrt{3-k}+\sqrt{2-k}}+\sum_{k=3}^{50}\frac1{\sqrt{k-3}+\sqrt{k-2}}\right)$$라고 쓸 수 있다.
      source_flow: 32980_b022.pdf p.43 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: $\sum_{k=1}^{2}\frac1{\sqrt{3-k}+\sqrt{2-k}}=\frac1{\sqrt2+1}+1=\sqrt2$이고, $\sum_{k=3}^{52}\frac1{\sqrt{k-3}+\sqrt{k-2}}=\sum_{k=3}^{52}(\sqrt{k-2}-\sqrt{k-3})=5\sqrt2$이므로, $S=\frac{12}{\sqrt a}$이다.
      source_flow: 32980_b022.pdf p.43 예시답안 [논제 2]
      criteria:
      - 2.A1
    - id: 2b-3
      content: $S=3$이므로 $a=16$이다.
      source_flow: 32980_b022.pdf p.43 예시답안 [논제 2]
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: $b_n=\frac a2(3-n)$을 구하고 $\lvert b_k\rvert$를 $k\le3$, $k\ge3$로 나누어 $S$를 합의 꼴로 나타냈다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: 분모의 유리화로 합을 $\sqrt2$, $5\sqrt2$로 계산하여 $S=\frac{12}{\sqrt a}$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: $S=3$에서 $a=16$을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-3
