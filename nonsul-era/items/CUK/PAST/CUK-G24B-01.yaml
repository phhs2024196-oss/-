intent: 여러 가지 함수의 미분을 이해하고 활용할 수 있는지, 속도와 이동 거리를 이해하고 정적분을 활용하여 속도에서 거리를 구할 수 있는지, 부분적분법을 이해하고 이를 활용해 정적분을 구할 수 있는지 확인한다.
key_idea: $\frac{dx}{dt}=(2t-\pi)\sin t$, $\frac{dy}{dt}=(2t-\pi)\cos t$로 속력 $\lvert2t-\pi\rvert$를 구해 $a=2\pi$, $s=\int_0^{2\pi}\lvert2t-\pi\rvert dt$를 얻는다. 직선 운동에서 속도의 부호가 바뀌는 시각이 운동 방향을 바꾸는 시각이므로 $b=\pi$, $c=\frac52\pi$이고, 절댓값을 구간별로 풀어 부분적분으로 $d$, $l$을 계산한다.
stuck: $\mathrm Q$, $\mathrm R$의 속도의 부호가 바뀌는 시각을 찾아 두 번째로 방향을 바꾸는 $b$, $c$를 정하는 단계(이중근 $t=\frac\pi2$에서는 방향이 바뀌지 않음), 절댓값 적분의 구간 분할
