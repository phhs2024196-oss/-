stimuli:
- label: ㄱ
  body: |
    좌표평면 위를 움직이는 점 $\mathrm{P}(x,y)$의 시각 $t$($t\ge0$)에서의 위치는 다음과 같다.

    $$x=2\sin t-(2t-\pi)\cos t$$

    $$y=2\cos t+(2t-\pi)\sin t$$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 점 $\mathrm{P}$에서 $x$축과 $y$축에 내린 수선의 발을 각각 $\mathrm{Q}$와 $\mathrm{R}$이라고 하면,
    점 $\mathrm{P}$가 움직일 때 점 $\mathrm{Q}$는 $x$축 위에서 직선 운동을 하고 점 $\mathrm{R}$은 $y$축 위에서 직선 운동을 한다.
- label: ㄷ
  body: |
    양수 $a$에 대하여 제시문 (ㄱ)의 점 $\mathrm{P}$의 시각 $t=a$에서의 속력은 시각 $t=0$에서의 속력의 $3$배이다. 이때 실수 $s$는 다음과 같다.

    $s$는 $t=0$에서 $t=a$까지 점 $\mathrm{P}$가 움직인 거리이다.
- label: ㄹ
  body: |
    양수 $b$에 대하여 제시문 (ㄴ)의 점 $\mathrm{Q}$는 시각 $t=0$일 때 출발하여 시각 $t=b$에서 $\mathrm{Q}$의 운동 방향을 두 번째로 바꾼다. 이때 실수 $d$는 다음과 같다.

    $d$는 $t=0$에서 $t=b$까지 점 $\mathrm{Q}$가 움직인 거리이다.
- label: ㅁ
  body: |
    양수 $c$에 대하여 제시문 (ㄴ)의 점 $\mathrm{R}$은 시각 $t=0$일 때 출발하여 시각 $t=c$에서 $\mathrm{R}$의 운동 방향을 두 번째로 바꾼다. 이때 실수 $l$은 다음과 같다.

    $l$은 $t=0$에서 $t=c$까지 점 $\mathrm{R}$이 움직인 거리이다.
stem: 제시문 (ㄱ)~(ㅁ)을 읽고 논제에 답하시오. (170점)
subparts:
- id: '1'
  stem: (170점) 제시문 (ㄷ)~(ㅁ)의 $s$, $d$, $l$의 값을 각각 구하고 그 근거를 논술하시오.
  points: 170
  depends_on: []
  answer:
    kind: value
    value: s=5*pi**2/2; d=2*pi-4; l=8*pi+2
    equivalents:
    - s=\frac52\pi^2, d=2\pi-4, l=8\pi+2
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 속력 $\lvert2t-\pi\rvert$로 $a=2\pi$, $s$를 구하고, $\mathrm Q$, $\mathrm R$의 속도 부호 변화 시각에서 $b=\pi$, $c=\frac52\pi$를 정해 부분적분으로 $d$, $l$을 계산한다.
    steps:
    - id: 1a-1
      content: $a=2\pi$, $s=\frac52\pi^2$ / $b=\pi$, $c=\frac52\pi$ / $d=2\pi-4$, $l=8\pi+2$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 점 $\mathrm P(x,y)$에 대하여 $\frac{dx}{dt}=(2t-\pi)\sin t$, $\frac{dy}{dt}=(2t-\pi)\cos t$이므로, 시간 $t$에서 점 $\mathrm P$의 속력은 $\sqrt{\left(\frac{dx}{dt}\right)^2+\left(\frac{dy}{dt}\right)^2}=\sqrt{\{(2t-\pi)\sin t\}^2+\{(2t-\pi)\cos t\}^2}=\sqrt{(2t-\pi)^2}=\lvert2t-\pi\rvert$이다. 점 $\mathrm P$의 $t=0$에서 속력은 $\lvert2t-\pi\rvert=\pi$이고, $t=a$에서의 속력은 $\lvert2a-\pi\rvert=3\pi$이므로 $a=2\pi$이다.
      source_flow: 32980_b022.pdf p.47, 49 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 $s$는 다음과 같다. $$s=\int_0^{2\pi}\lvert2t-\pi\rvert dt=\int_0^{\frac\pi2}(\pi-2t)dt+\int_{\frac\pi2}^{2\pi}(2t-\pi)dt=\left[\pi t-t^2\right]_0^{\frac\pi2}+\left[t^2-\pi t\right]_{\frac\pi2}^{2\pi}=\frac52\pi^2$$
      source_flow: 32980_b022.pdf p.47, 49 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-3
      content: 시간 $t$에서 점 $\mathrm Q$의 속도는 $v(t)=(2t-\pi)\sin t$이고, 점 $\mathrm R$의 속도는 $u(t)=(2t-\pi)\cos t$이다. 수직선을 따라 움직이는 점의 운동에서 속도의 부호는 점의 운동 방향을 나타내므로 두 점의 속도의 부호가 바뀌는 시각, 즉 운동 방향을 바꾸는 시각은 점 $\mathrm Q$에 대하여 $\frac\pi2,\pi,2\pi,\cdots$이고, 점 $\mathrm R$에 대하여 $\frac32\pi,\frac52\pi,\frac72\pi\cdots$이다. 따라서 $b=\pi$, $c=\frac52\pi$이다.
      source_flow: 32980_b022.pdf p.47, 49 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-4
      content: 그러므로 $d$는 $$d=\int_0^{\pi}\lvert(2t-\pi)\sin t\rvert dt=\int_0^{\frac\pi2}(\pi-2t)\sin t\,dt+\int_{\frac\pi2}^{\pi}(2t-\pi)\sin t\,dt=-2\left\{\int_0^{\frac\pi2}t\sin t\,dt-\int_{\frac\pi2}^{\pi}t\sin t\,dt\right\}$$이고, 부분적분법을 이용하면 $\int t\sin t\,dt=t(-\cos t)-\int(-\cos t)dt=-t\cos t+\sin t$이므로, $$d=-2\left\{\left[-t\cos t+\sin t\right]_0^{\frac\pi2}+\left[t\cos t-\sin t\right]_{\frac\pi2}^{\pi}\right\}=2\pi-4$$이다.
      source_flow: 32980_b022.pdf p.48, 49 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-5
      content: 또한 $l$은 $$l=\int_0^{\frac52\pi}\lvert(2t-\pi)\cos t\rvert dt=\int_0^{\frac32\pi}(\pi-2t)\cos t\,dt+\int_{\frac32\pi}^{\frac52\pi}(2t-\pi)\cos t\,dt=-3\pi-2\left\{\int_0^{\frac32\pi}t\cos t\,dt-\int_{\frac32\pi}^{\frac52\pi}t\cos t\,dt\right\}$$이고, 부분적분법을 이용하면 $\int t\cos t\,dt=t\sin t-\int\sin t\,dt=t\sin t+\cos t$이므로, $$l=-3\pi-2\left\{\left[t\sin t+\cos t\right]_0^{\frac32\pi}-\left[t\sin t+\cos t\right]_{\frac32\pi}^{\frac52\pi}\right\}=8\pi+2$$이다.
      source_flow: 32980_b022.pdf p.48, 49 예시답안 [논제 1]
      criteria:
      - 1.A3
