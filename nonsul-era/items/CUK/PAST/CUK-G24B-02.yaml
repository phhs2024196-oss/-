stimuli:
- label: ㄱ
  body: 실수 $t$에 대하여 곡선 $y=e^{2x}$ 위의 점 $(t,e^{2t})$에서의 접선의 방정식을 $y=f(x)$라고 하자.
- label: ㄴ
  body: |
    제시문 (ㄱ)의 실수 $t$와 함수 $f(x)$에 대하여 함수 $g(x)=\lvert f(x)+k-2\ln x\rvert$가 구간 $(0,\infty)$에서 미분가능하도록 하는 실수 $k$의 최솟값을 $m(t)$라 하자. 이때 함수 $h(t)$는 다음과 같다.

    $$h(t)=e^{-t}(m(t)+2t+1)$$
- label: ㄷ
  body: |
    두 실수 $a$, $b$($a<b$)와 제시문 (ㄴ)의 함수 $h(t)$에 대하여 실수 $s$는 다음과 같다.

    $$s=\int_a^b(t-1)^2h(t)\,dt$$
- label: ㄹ
  body: 두 실수 $\alpha$, $\beta$($\alpha<\beta$)와 제시문 (ㄷ)의 실수 $a$, $b$, $s$에 대하여 $a=\alpha$, $b=\beta$일 때, $s$의 값이 최소가 된다.
