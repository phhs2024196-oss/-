  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g_1=f+k-2\ln x$의 극솟값 $\ge0$으로 $m(t)$, $h(t)$를 구하고, $h$가 우함수이며 $h(\pm q)=0$이므로 $(t-1)^2h(t)<0$인 구간이 $(-q,q)$임을 이용한다.
    steps:
    - id: 1a-1
      content: $h(t)=e^t(2t-1)-e^{-t}(2t+1)$, $h(-t)=h(t)$, $h(\pm q)=0$ → $\alpha=-q$, $\beta=q$ → $\alpha+\beta=0$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 곡선 $y=e^{2x}$ 위의 점 $(t,e^{2t})$에서의 접선의 방정식은 $y=2e^{2t}(x-t)+e^{2t}$이므로 $f(x)=2e^{2t}(x-t)+e^{2t}$이다.
      source_flow: 32980_b022.pdf p.53 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 제시문 (ㄴ)의 함수 $g(x)=\lvert f(x)+k-2\ln x\rvert$에 대하여, $g_1(x)=f(x)+k-2\ln x$라고 하면 $g_1'(x)=f'(x)-\frac2x=2e^{2t}-\frac2x$이므로 함수 $g_1(x)$는 $g_1'(x)=0$을 만족하는 $x=e^{-2t}$에서 극솟값 $g_1(e^{-2t})=(1-2t)e^{2t}+k+4t+2$를 갖는다. 따라서, $x>0$인 모든 실수에 대해 함수 $g(x)=\lvert f(x)+k-2\ln x\rvert$가 미분가능하기 위해서는 $g_1(e^{-2t})=(1-2t)e^{2t}+k+4t+2\ge0$, 즉 $k\ge(2t-1)e^{2t}-4t-2$를 만족해야 하므로, $m(t)=(2t-1)e^{2t}-4t-2$이고, $h(t)=e^{-t}(m(t)+2t+1)=e^t(2t-1)-e^{-t}(2t+1)$이다.
      source_flow: 32980_b022.pdf p.52, 53 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-3
      content: 한편, $h'(t)=e^t(2t-1)+2e^t+e^{-t}(2t+1)-2e^{-t}=(1+2t)e^t-(1-2t)e^{-t}$이다. $h'(0)=0$이고, 임의의 양수 $t$에 대해 $1+2t>1-2t$, $e^t>e^{-t}$에 의해 $h'(t)>0$이므로 $t\ge0$에서 함수 $h(t)$는 증가함수이다. $h(0)=-2$, $h(1)=e-3e^{-1}>0$이므로 $0$과 $1$ 사이의 어떤 실수 $q$에서 $h(q)=0$을 만족하고 $h(-t)=h(t)$이므로 $h(-q)=0$이다.
      source_flow: 32980_b022.pdf p.52, 53 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-4
      content: 모든 실수 $t$에 대하여 $(t-1)^2\ge0$이므로 $(t-1)^2h(t)$는 $-q<t<q$일 때만 음의 값을 가진다. 따라서, $\alpha=-q$, $\beta=q$일 때 $s$가 최소가 된다. 따라서, $\alpha+\beta=0$이다.
      source_flow: 32980_b022.pdf p.52, 53 예시답안 [논제 1]
      criteria:
      - 1.A3
