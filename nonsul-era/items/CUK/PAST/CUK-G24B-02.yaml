key_idea: 접선 $f(x)=2e^{2t}(x-t)+e^{2t}$에서 $g_1(x)=f(x)+k-2\ln x$의 극솟값이 $0$ 이상이어야 $g=\lvert g_1\rvert$가 미분가능하므로 $m(t)=(2t-1)e^{2t}-4t-2$, $h(t)=e^t(2t-1)-e^{-t}(2t+1)$를 얻는다. $h$는 우함수이고 $t\ge0$에서 증가, $h(0)<0<h(1)$이므로 $h(\pm q)=0$이고, $(t-1)^2h(t)$가 $-q<t<q$에서만 음이므로 $\alpha=-q$, $\beta=q$이다.
stuck: 미분가능 조건을 $g_1$의 극솟값 $\ge0$으로 바꾸는 단계, $h$의 우함수성과 단조성으로 $h$의 영점이 $\pm q$뿐임을 보이고 적분이 최소가 되는 구간을 정하는 단계
