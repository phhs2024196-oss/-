      evidence: $h'(t)>0$($t\ge0$)으로 $h$가 증가하고 $h(0)<0<h(1)$, $h(-t)=h(t)$에서 $h(\pm q)=0$인 $q$가 존재함을 밝혔다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
    - id: 1.A3
      mark_type: A
      points: 40
      evidence: $(t-1)^2h(t)$가 $-q<t<q$일 때만 음이므로 $\alpha=-q$, $\beta=q$, $\alpha+\beta=0$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-4
