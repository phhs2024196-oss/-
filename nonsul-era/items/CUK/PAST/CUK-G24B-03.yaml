stimuli:
- label: ㄱ
  body: |
    자연수 $n$($1\le n\le500$)에 대하여 실수 $a$는 다음과 같다.

    $$a=\sin\left(\frac{n+1}{100}\right)+\sin\left(\frac{n+2}{100}\right)+\sin\left(\frac{n+3}{100}\right)+\cdots+\sin\left(\frac{n+100}{100}\right)$$
- label: ㄴ
  body: 제시문 (ㄱ)의 $n$과 $a$에 대하여 $a$의 값이 최대가 되도록 하는 $n$의 값을 $m$이라고 하자.
- label: ㄷ
  body: |
    제시문 (ㄴ)의 자연수 $m$에 대하여 실수 $b$는 다음과 같다.

    $$b=\cos\left(\frac{m+1}{100}\right)+\cos\left(\frac{m+2}{100}\right)+\cos\left(\frac{m+3}{100}\right)+\cdots+\cos\left(\frac{m+100}{100}\right)$$
- label: ㄹ
  body: |
    제시문 (ㄷ)의 실수 $b$에 대하여 집합 $A$는 다음과 같다.

    $$A=\{k\mid2b-k>0,\ k\text{는 정수}\}$$
- label: ㅁ
  body: |
    [삼각함수의 성질과 원주율]

    (가) $\sin\left(\frac\pi2+x\right)=\sin\left(\frac\pi2-x\right)$, $\cos\left(\frac\pi2+x\right)=-\cos\left(\frac\pi2-x\right)$

    (나) 원주율 $\pi$의 값은 $\pi=3.141592\cdots$임이 알려져 있고, $1.570<\frac\pi2<1.571$이다.
stem: 제시문 (ㄱ)~(ㅁ)을 읽고 논제에 답하시오. (180점)
subparts:
- id: '1'
  stem: (180점) 제시문 (ㄹ)의 집합 $A$의 원소 중 가장 큰 값을 구하고 그 근거를 논술하시오.
  points: 180
  depends_on: []
  answer:
    kind: value
    value: '-1'
    equivalents:
    - \max A=-1
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a$의 증감을 $\sin$의 대칭성으로 판정해 $m=107$을 구하고, $b=\cos(1.08)+\cdots+\cos(2.07)$를 쌍으로 묶어 $-\frac12<b<0$을 보이면 $A$는 모든 음의 정수의 집합이다.
    steps:
    - id: 1a-1
      content: $m=107$, $-\frac12<b<0$ → $-1<2b<0$ → $\max A=-1$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $1\le n\le500$이므로, $\frac{n+100}{100}$의 최댓값은 $n=500$일 때 $\frac{500+100}{100}=6$이고, 제시문 (ㅁ)에 의해 $6<2\pi$이다. $n\ge314$이면 $\sin\left(\frac{n+1}{100}\right),\sin\left(\frac{n+2}{100}\right),\cdots,\sin\left(\frac{n+100}{100}\right)$은 모두 음수이므로 $a$가 음수가 되어 최댓값이 될 수 없다. 어떤 자연수 $k$($1\le k\le313$)에 대하여 $n=k$일 때의 $a$의 값을 $p$, $n=k+1$일 때의 $a$의 값을 $q$라 하면 $q-p=\sin\left(\frac{k+101}{100}\right)-\sin\left(\frac{k+1}{100}\right)$이다.
      source_flow: 32980_b022.pdf p.56, 58 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: $q-p$는 $\left\lvert\frac{k+101}{100}-\frac\pi2\right\rvert<\left\lvert\frac{k+1}{100}-\frac\pi2\right\rvert$이면 양수이고 $\left\lvert\frac{k+101}{100}-\frac\pi2\right\rvert>\left\lvert\frac{k+1}{100}-\frac\pi2\right\rvert$이면 음수가 되므로, $1\le k\le106$이면 양수이고 $107\le k\le313$이면 음수이다. 따라서 $k=107$일 때 최초로 $q-p$가 음수가 되고 $a$의 값이 최대가 되며 $m=107$이다.
      source_flow: 32980_b022.pdf p.56, 58 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-3
      content: $m=107$이므로 제시문 (ㄷ)의 $b$는 $b=\cos(1.08)+\cos(1.09)+\cdots+\cos(2.07)$이고, $1.570\le\frac\pi2\le1.571$이므로 $\cos(1.08),\cos(1.09),\cdots,\cos(1.57)$은 양수, $\cos(1.58),\cos(1.59),\cdots,\cos(2.07)$은 음수이다. (1) 삼각함수의 성질에 의하여 $\left\lvert1.57-\frac\pi2\right\rvert<\left\lvert1.58-\frac\pi2\right\rvert\Rightarrow\cos(1.57)+\cos(1.58)<0$, $\left\lvert1.56-\frac\pi2\right\rvert<\left\lvert1.59-\frac\pi2\right\rvert\Rightarrow\cos(1.56)+\cos(1.59)<0$, $\cdots$, $\left\lvert1.08-\frac\pi2\right\rvert<\left\lvert2.07-\frac\pi2\right\rvert\Rightarrow\cos(1.08)+\cos(2.07)<0$이 성립한다. 따라서, $b=(\cos(1.57)+\cos(1.58))+\cdots+(\cos(1.08)+\cos(2.07))<0$이다.
      source_flow: 32980_b022.pdf p.57, 58 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-4
      content: (2) 비슷한 방법으로 $1.56$과 $1.58$부터 비교하면, $\left\lvert1.56-\frac\pi2\right\rvert>\left\lvert1.58-\frac\pi2\right\rvert\Rightarrow\cos(1.56)+\cos(1.58)>0$, $\left\lvert1.55-\frac\pi2\right\rvert>\left\lvert1.59-\frac\pi2\right\rvert\Rightarrow\cos(1.55)+\cos(1.59)>0$, $\cdots$, $\left\lvert1.08-\frac\pi2\right\rvert>\left\lvert2.06-\frac\pi2\right\rvert\Rightarrow\cos(1.08)+\cos(2.06)>0$이고, $2.07=\frac{207}{100}=\frac{621}{300}<\frac23\pi$이므로 $\cos(2.07)>\cos\left(\frac23\pi\right)=-0.5$이고, 따라서 $b=\cos(1.57)+(\cos(1.56)+\cos(1.58))+\cdots+(\cos(1.08)+\cos(2.06))+\cos(2.07)>-0.5$이다.
      source_flow: 32980_b022.pdf p.57, 58 예시답안 [논제 1]
      criteria:
      - 1.A3
    - id: 1b-5
      content: 따라서, (1)과 (2)에 의하여 $2b$는 $-1<2b<0$을 만족하며, $k\le-1$이면 $2b-k>0$이고 $k\ge0$이면 $2b-k<0$이므로 집합 $A$는 모든 음의 정수의 집합이고 $A$의 가장 큰 원소는 $-1$이다.
      source_flow: 32980_b022.pdf p.57, 58 예시답안 [논제 1]
      criteria:
      - 1.A3
