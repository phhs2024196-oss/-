elements:
  materials:
  - $a=\sum_{j=1}^{100}\sin\frac{n+j}{100}$, $a$가 최대가 되는 $n=m$
  - $b=\sum_{j=1}^{100}\cos\frac{m+j}{100}$
  - 집합 $A=\{k\mid2b-k>0,\ k\text{는 정수}\}$
  - $\sin\left(\frac\pi2+x\right)=\sin\left(\frac\pi2-x\right)$, $\cos\left(\frac\pi2+x\right)=-\cos\left(\frac\pi2-x\right)$, $1.570<\frac\pi2<1.571$
  concepts:
  - 호도법
  - 사인함수·코사인함수의 그래프와 대칭성
  - 증가·감소 판정
  tools:
  - $n\ge314$이면 모든 항이 음수($6<2\pi$)
  - $q-p=\sin\frac{k+101}{100}-\sin\frac{k+1}{100}$의 부호를 $\lvert x-\frac\pi2\rvert$의 대소로 판정 → $1\le k\le106$이면 양수, $107\le k\le313$이면 음수 → $m=107$
  - $b=\cos1.08+\cdots+\cos2.07$를 $\cos x+\cos y$ 쌍으로 묶어 $b<0$, $b>-0.5$
  - $2.07<\frac23\pi$이므로 $\cos2.07>\cos\frac23\pi=-0.5$
  conditions:
  - $1\le n\le500$
  - $m=107$일 때 $b=\cos(1.08)+\cdots+\cos(2.07)$
  - $\cos(1.57)$ 이하는 양수, $\cos(1.58)$ 이상은 음수
