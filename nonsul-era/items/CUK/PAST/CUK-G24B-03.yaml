intent: 삼각함수의 함수값을 호도법을 이용하여 이해할 수 있는지, 삼각함수의 그래프의 성질을 활용할 수 있는지, 삼각함수의 대칭성을 이용하여 두 값을 비교할 수 있는지 확인한다.
key_idea: $a(k+1)-a(k)=\sin\frac{k+101}{100}-\sin\frac{k+1}{100}$의 부호를 $\left\lvert\frac{k+101}{100}-\frac\pi2\right\rvert$와 $\left\lvert\frac{k+1}{100}-\frac\pi2\right\rvert$의 대소로 판정해 $m=107$을 얻는다. $b=\cos(1.08)+\cdots+\cos(2.07)$를 $\cos x+\cos y$의 부호(대칭성)와 $\cos(2.07)>\cos\frac23\pi$로 평가하여 $-\frac12<b<0$, 즉 $-1<2b<0$에서 $A$의 최댓값 $-1$을 얻는다.
stuck: $n$을 늘릴 때 합의 증감을 $\sin$의 대칭성으로 판정하는 단계, $b$의 상한·하한을 쌍으로 묶어 $0$과 $-\frac12$로 평가하는 단계
