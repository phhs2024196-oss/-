  tools:
  - $x<0$에서 $f(x)=-(a+4)^2x+4a+2a^2$이므로 최댓값 $f(-k)$
  - $x\ge0$에서 $f$는 $a=0$이면 증가, $a\ne0$이면 감소 후 증가 → $[0,k]$의 최댓값은 $f(0)$, $f(k)$ 중 하나
  - $g_1(a)=f(-k)=(2+k)a^2+(8k+4)a+16k$, $g_2(a)=f(k)=(2-k)a^2+(4-k^2)a+k^3$, $g=\max(g_1,g_2)$
  - $g_1-g_2=2ka^2+(k^2+8k)a+16k-k^3$ (이차항 계수 양수)
  - $k=2$이면 $g_2\equiv8$, $g_2$ 위로 볼록이면 $g_1'(v)=g_2'(v)=0$
  conditions:
  - $k>0$
  - $f$는 $x=0$에서 연속
  - $g(a)=m$을 만족하는 $a$는 단 하나
