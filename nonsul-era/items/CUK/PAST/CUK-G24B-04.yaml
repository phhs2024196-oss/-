stimuli:
- label: ㄱ
  body: |
    실수 $a$에 대하여 함수 $f(x)$는 다음과 같다.

    $$f(x)=\begin{cases}x^3-ax^2-a^2x+4a+2a^2&(x\ge0)\\-(a+4)^2x+4a+2a^2&(x<0)\end{cases}$$
- label: ㄴ
  body: 양수 $k$와 제시문 (ㄱ)의 실수 $a$, 함수 $f(x)$에 대하여 닫힌구간 $[-k,k]$에서 $f(x)$의 최댓값을 $g(a)$라고 하자.
- label: ㄷ
  body: |
    제시문 (ㄴ)의 양수 $k$와 함수 $g(a)$에 대하여 구간 $(-\infty,\infty)$에서 $g(a)$의 최솟값을 $m$이라고 할 때, 다음 조건을 만족시키는 $k$ 값의 전체의 집합을 $A$라고 하자.

    $g(a)=m$을 만족하는 $a$의 값은 단 하나만 존재한다.
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 논제에 답하시오. (180점)
subparts:
- id: '1'
  stem: (180점) 제시문 (ㄷ)의 집합 $A$의 원소가 아닌 양수 $k$의 값을 모두 구하고 그 근거를 논술하시오.
  points: 180
  depends_on: []
  answer:
    kind: value
    value: 2, 4
    equivalents:
    - k=2, 4
    - k\in\{2,4\}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(a)=\max(f(-k),f(k))$의 두 이차식 $g_1,g_2$를 세우고 $g_1-g_2=0$의 근의 개수와 $g_2$의 볼록 방향으로 $g(a)=m$인 $a$의 개수를 분류하면 $A$에 속하지 않는 $k$는 $2$, $4$이다.
    steps:
    - id: 1a-1
      content: $g_1-g_2$가 근이 없거나 중근이면 $k\in A$ / 두 근이면 $g_2$가 일차($k=2$)이거나 위로 볼록이면서 $k=4$일 때만 $k\notin A$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
      - 1.A4
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)$는 $x=0$에서 연속이다. $f(x)$는 $x<0$에서 기울기가 $-(a+4)^2$인 직선이므로 닫힌구간 $[-k,0]$에서 $f(-k)$가 최대이다. 한편, 함수 $y=x^3-ax^2-a^2x+4a+2a^2$은 $x^3$의 계수가 양수이고, $x=a$ 및 $x=-\frac a3$에서 극값을 가진다. 그러므로 $x\ge0$에서 $f(x)$의 함숫값은 $a=0$인 경우에는 증가하고 $a\ne0$인 경우에는 감소하다가 증가한다. 즉, 닫힌구간 $[0,k]$에서 $f(x)$의 최댓값은 $f(0)$과 $f(k)$ 중 하나이다. 따라서 닫힌구간 $[-k,k]$에서 $f(x)$의 최댓값은 $f(-k)$와 $f(k)$ 중 하나이다. 이때 $f(-k)=(2+k)a^2+(8k+4)a+16k$를 $g_1(a)$, $f(k)=(2-k)a^2+(4-k^2)a+k^3$을 $g_2(a)$라고 하면, $g(a)=\begin{cases}g_1(a)&(g_1(a)\ge g_2(a))\\g_2(a)&(g_1(a)<g_2(a))\end{cases}$이다.
      source_flow: 32980_b022.pdf p.61, 62 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 함수 $g_1(a)$는 아래로 볼록한 이차함수이므로 꼭짓점 $(v,g_1(v))$에서 최솟값 $g_1(v)$를 갖는다. 한편 $g_1(a)-g_2(a)=2ka^2+(k^2+8k)a+16k-k^3$은 $a^2$의 계수가 양수인 이차함수이다. (1) $g_1(a)-g_2(a)=0$인 $a$가 없거나 중근을 가질 경우의 $k$에 대하여 모든 실수 $a$에서 $g_1(a)-g_2(a)\ge0$이므로 $g(a)=g_1(a)$가 되어 $g_1(v)=m$이고, 이러한 $a$는 $v$뿐이다. 따라서 $k\in A$이다.
      source_flow: 32980_b022.pdf p.61, 62 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-3
      content: (2) 이차방정식 $g_1(a)-g_2(a)=0$이 서로 다른 두 근 $\alpha,\beta$($\alpha<\beta$)를 가지게 하는 $k$에 대하여 $g(a)=\begin{cases}g_1(a)&(a<\alpha,\ a>\beta)\\g_2(a)&(\alpha\le a\le\beta)\end{cases}$이다. $g(a)\ge g_1(a)$이므로, $v<\alpha$ 또는 $v>\beta$인 경우에는 $g(a)$가 $v$에서 유일한 최솟값을 가지게 되어 $k\in A$이다. 따라서 $\alpha<v<\beta$인 경우만 확인하면 되고, 이때 함수 $g(a)$는 $a<\alpha$에서 감소하고 $a>\beta$에서 증가하므로 $g(a)=m$을 만족하는 $a$는 구간 $[\alpha,\beta]$ 안에서만 존재한다. 함수 $g_2(a)$가 아래로 볼록일 경우 최솟값을 갖는 $a$의 값은 두 개 이상 존재할 수 없다. 따라서 $g_2(a)$는 위로 볼록이거나 일차함수이어야 한다.
      source_flow: 32980_b022.pdf p.61, 62 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-4
      content: '(ⅰ) $g_2(a)$가 일차함수이면 $k=2$이고 $g_2(a)=8$이다. 이때 $\alpha=-3$, $\alpha=-3$[판독확인: 원문 그대로, 둘째는 $\beta=-2$의 오기로 보임]이므로 $-3\le a\le2$[판독확인: 원문 그대로, 계산상 $-3\le a\le-2$의 오기로 보임]인 모든 $a$에 대하여 최솟값 $g_2(a)=8$을 가진다. $2$는 $A$에 속하지 않는다.'
      source_flow: 32980_b022.pdf p.61, 62 예시답안 [논제 1]
      criteria:
      - 1.A3
    - id: 1b-5
      content: '(ⅱ) $g_2(a)$가 위로 볼록인 경우 $g_2(\alpha)=g_2(\beta)$일 때만 $g(a)=m$인 $a$의 값을 $\alpha,\beta$로 두 개 이상 가질 수 있고, 이때 $g_1(\alpha)=g_1(\beta)$이기도 하므로 두 함수 $g_1(a)$와 $g_2(a)$는 $v$에서 극값을 갖는다. $g_2''(a)=2(2-k)a+4-k^2$에서 $g_2''(v)=0$이므로 $v=-\frac{2+k}2$이고, $g_1''(v)=2(2+k)v+(8k+4)$에서 $-(2+k)^2+(8k+4)=0$, 즉 $k(k-4)=0$이고 $k=4$이다. 이때 $\alpha=-6$, $\alpha=-6$[판독확인: 원문 그대로, 둘째는 $\beta=0$의 오기로 보임]에서 최솟값 $64$를 가지므로 $4$는 $A$에 속하지 않는다. 따라서 (1), (2)(ⅰ), (2)(ⅱ)에 의해 $A$에 속하지 않는 양수 $k$는 $2$와 $4$이다.'
      source_flow: 32980_b022.pdf p.61, 62 예시답안 [논제 1]
      criteria:
      - 1.A4
