intent: 함수의 증가와 감소를 이해하고 이를 활용할 수 있는지, 닫힌구간에서 함수의 최댓값과 최솟값을 구하는 방법을 이해하고 이를 활용할 수 있는지, 이차함수의 최솟값을 구하고 이를 활용할 수 있는지 확인한다.
key_idea: $x<0$에서 $f$는 기울기가 음이 아닌 직선꼴이므로 $[-k,k]$에서 최댓값은 $f(-k)$ 또는 $f(k)$이고 $g=\max(g_1,g_2)$($g_1=f(-k)$, $g_2=f(k)$는 $a$의 이차식)이다. $g_1-g_2=0$이 서로 다른 두 근 $\alpha<\beta$를 갖는 경우 $g_2$가 아래로 볼록이면 최솟값을 갖는 $a$가 둘 이상이므로 $g_2$가 위로 볼록이거나 일차($k=2$)여야 하고, 위로 볼록일 때 $g_1$, $g_2$가 같은 $v$에서 극값을 가질 조건으로 $k=4$를 얻는다.
stuck: $g(a)=\max(g_1(a),g_2(a))$의 구조를 세우고 $g_1-g_2$의 근의 개수와 $g_2$의 볼록 방향으로 $m$을 주는 $a$의 개수를 분류하는 단계
