    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: $[-k,k]$에서의 최댓값이 $f(-k)$ 또는 $f(k)$임을 밝히고 $g_1(a)=f(-k)$, $g_2(a)=f(k)$로 $g(a)$를 $\max(g_1,g_2)$ 꼴로 나타냈다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: $g_1-g_2$가 근이 없거나 중근인 경우 $g=g_1$이므로 $a=v$ 하나뿐이어서 $k\in A$임을 밝혔다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 50
      evidence: 서로 다른 두 근 $\alpha<\beta$인 경우를 나누어 $v\notin(\alpha,\beta)$이면 $k\in A$이고 $g_2$가 아래로 볼록이면 안 되므로 위로 볼록이거나 일차함수여야 함을 보였다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
    - id: 1.A3
      mark_type: A
      points: 30
      evidence: $g_2$가 일차함수인 경우 $k=2$, $g_2=8$이므로 구간 $[\alpha,\beta]$의 모든 $a$에서 최솟값을 가져 $2\notin A$임을 보였다.
      depends_on:
      - 1.M1
      steps:
      - 1b-4
    - id: 1.A4
      mark_type: A
      points: 50
      evidence: $g_2$가 위로 볼록인 경우 $v=-\frac{2+k}2$와 $g_1'(v)=0$에서 $k=4$를 구하고 $A$에 속하지 않는 $k$가 $2$, $4$임을 결론지었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-5
