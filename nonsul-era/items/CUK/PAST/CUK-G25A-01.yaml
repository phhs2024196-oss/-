  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a_1$, $a_N$을 뺀 평균의 부등식으로 $N$의 범위를 구하고 정수 조건으로 $N=28$, 그 뒤 $p$를 합에서 구한다.
    steps:
    - id: 2a
      content: $N=28$, $p=\sum_{k=1}^{28}a_k-27\left(97+\frac19\right)=108$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
      - 2.A3
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 집합 $B$의 원소 중 하나를 제외한 나머지 원소들의 평균은 가장 작은 수인 $a_1$을 제외한 경우 가장 크며 가장 큰 수인 $a_N$을 제외한 경우 가장 작다. 그러므로 $$\frac{1}{N-1}\sum_{k=1}^{N-1}(3+7(k-1))=-4+\frac{7N}{2}\le97+\frac19$$이고 $$\frac{1}{N-1}\sum_{k=2}^{N}(3+7(k-1))=3+\frac{7N}{2}\ge97+\frac19$$이다.
      source_flow: 36212_0acb.pdf p.26 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서 $$26+\frac{56}{63}\le N\le28+\frac{56}{63}$$이고 가능한 $N$의 값은 $27$ 또는 $28$이다.
      source_flow: 36212_0acb.pdf p.26 예시답안 [논제 2]
      criteria:
      - 2.A1
    - id: 2b-3
      content: 한편, $\left(97+\dfrac19\right)(N-1)$이 정수이므로 $N=28$이다.
      source_flow: 36212_0acb.pdf p.26 예시답안 [논제 2]
      criteria:
      - 2.A2
    - id: 2b-4
      content: 집합 $B$의 원소 $p$를 제외한 원소 $27$개의 평균이 $97+\dfrac19$이므로 원소 $p$는 $$\begin{aligned}p&=\sum_{k=1}^{28}(3+7(k-1))-27\left(97+\frac19\right)\\&=3\times28+7\times14\times27-97\times27-3\\&=4\times27=108\end{aligned}$$이다.
      source_flow: 36212_0acb.pdf p.26 예시답안 [논제 2]
      criteria:
      - 2.A3
