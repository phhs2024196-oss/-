key_idea: 나머지 원소의 평균은 가장 작은 수를 뺄 때 가장 크고 가장 큰 수를 뺄 때 가장 작다. 이 부등식으로 $N$의 범위를 잡고 $(97+\frac19)(N-1)$이 정수라는 조건으로 $N=28$을 정한 뒤 합에서 $27$개의 합을 뺀다.
