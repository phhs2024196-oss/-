stimuli:
- label: ㄱ
  body: |
    첫째항이 $3$, 공차가 $7$인 등차수열 $\{a_n\}$과 자연수 $N$에 대하여 집합 $A$, $B$는 다음과 같다.

    $$A=\left\{a_k\mid k\text{는 }1\le k\le100\text{인 자연수}\right\}$$

    $$B=\left\{a_k\mid k\text{는 }1\le k\le N\text{인 자연수}\right\}$$
- label: ㄴ
  body: 제시문 (ㄱ)의 집합 $A$에 대하여 $A$의 원소 중 하나를 제외한 나머지 원소들의 평균으로 가능한 가장 작은 값을 $m$, 가장 큰 값을 $M$이라고 하자.
- label: ㄷ
  body: |
    제시문 (ㄱ)의 집합 $B$에 대하여 $B$의 원소 $p$는 다음 조건을 만족시킨다.

    집합 $B$의 원소 중 $p$를 제외한 나머지 원소들의 평균은 $97+\dfrac19$이다.
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
