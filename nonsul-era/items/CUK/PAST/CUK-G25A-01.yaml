    method_no: 1
    key_idea: 평균은 최솟값 $a_1$을 뺄 때 최대, 최댓값 $a_{100}$을 뺄 때 최소이다.
    steps:
    - id: 1a
      content: $m=\frac1{99}\sum_{k=1}^{99}a_k=346$, $M=\frac1{99}\sum_{k=2}^{100}a_k=353$
      criteria:
      - 1.B1
      - 1.B2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 집합 $A$의 원소 중 하나를 제외한 나머지 원소들의 평균은 가장 작은 수인 $a_1$을 제외한 경우 가장 크며 가장 큰 수인 $a_{100}$을 제외한 경우 가장 작다. 따라서 $$m=\frac{1}{99}\sum_{k=1}^{99}(3+7(k-1))=\frac{99\left(3+\frac12\times7\times98\right)}{99}=346$$이고
      source_flow: 36212_0acb.pdf p.26 예시답안 [논제 1]
      criteria:
      - 1.B1
    - id: 1b-2
      content: $$M=\frac{1}{99}\sum_{k=2}^{100}(3+7(k-1))=\frac{99\left(3+\frac12\times7\times100\right)}{99}=353$$이다.
      source_flow: 36212_0acb.pdf p.26 예시답안 [논제 1]
      criteria:
      - 1.B2
