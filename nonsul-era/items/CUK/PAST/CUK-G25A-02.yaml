  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: (15점) 제시문 (ㄷ)의 $c$의 값을 구하고 그 근거를 논술하시오.
  points: 15
  depends_on:
  - '1'
  answer:
    kind: value
    value: c=12
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $h=f-x^2-cx-c$는 $-\frac12$을 최고차항으로 갖고 $t$, $2$ 중 하나가 중근이다. 두 경우의 계수 비교 후 $k>0$으로 하나를 고른다.
    steps:
    - id: 2a
      content: $t=-2$일 때 $k=-\frac72<0$이므로 제외, $t=-6$, $c=12$, $k=\frac{41}{2}$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
      - 2.A3
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 삼차함수 $h(x)=f(x)-x^2-cx-c$에 대하여 곡선 $y=h(x)$와 직선 $y=0$은 두 점에서 만나고 만나는 점의 $x$좌표가 각각 $t$, $2$이므로 $h(x)=-\dfrac12(x-t)^2(x-2)$ 또는 $h(x)=-\dfrac12(x-t)(x-2)^2$이다.
      source_flow: 36212_0acb.pdf p.30 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: '$f(x)-x^2-cx-c=-\dfrac12x^3-x^2+\left(k-c+\dfrac32\right)x-c$이므로 각 경우 다음과 같다. 1) $h(x)=-\dfrac12(x-t)^2(x-2)$ : $-\dfrac12(x-t)^2(x-2)=-\dfrac12\left(x^3-2(t+1)x^2+(t^2+4t)x-2t^2\right)$이므로 $t+1=-1$, $t^2=-c$, $k-c+\dfrac32=-\dfrac12(t^2+4t)$이다. 즉, $t=-2$, $c=-4$, $k=-\dfrac72$이다.'
      source_flow: 36212_0acb.pdf p.30 예시답안 [논제 2]
      criteria:
      - 2.A1
    - id: 2b-3
      content: '2) $h(x)=-\dfrac12(x-t)(x-2)^2$ : $-\dfrac12(x-t)(x-2)^2=-\dfrac12\left(x^3-(t+4)x^2+4(t+1)x-4t\right)$이므로 $\dfrac{t+4}{2}=-1$, $c=-2t$, $k-c+\dfrac32=-2(t+1)$이다. 즉, $t=-6$, $c=12$, $k=\dfrac{41}{2}$이다.'
      source_flow: 36212_0acb.pdf p.30 예시답안 [논제 2]
      criteria:
      - 2.A2
    - id: 2b-4
      content: $k>0$이므로 $c=12$이다.
      source_flow: 36212_0acb.pdf p.30 예시답안 [논제 2]
      criteria:
      - 2.A3
