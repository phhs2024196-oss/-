stimuli:
- label: ㄱ
  body: |
    양의 실수 $k$에 대하여 삼차함수 $f(x)$는 다음 조건을 만족시킨다.

    (가) 곡선 $y=f(x)$와 직선 $y=kx+1$은 두 점에서 만나고, 만나는 두 점의 $x$좌표는 각각 $\alpha$, $1$이다. (단, $\alpha<-1$)

    (나) 곡선 $y=f(x)$와 직선 $y=kx-1$은 두 점에서 만나고, 만나는 두 점의 $x$좌표는 각각 $-1$, $\beta$이다. (단, $\beta>1$)
- label: ㄴ
  body: |
    제시문 (ㄱ)의 실수 $k$와 함수 $f(x)$에 대하여 함수 $g(x)$는 다음과 같다.

    $$g(x)=f(x)-kx$$
- label: ㄷ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$에 대하여 실수 $c$는 다음 조건을 만족시킨다.

    곡선 $y=f(x)$와 곡선 $y=x^2+cx+c$는 두 점에서 만나고, 만나는 두 점의 $x$좌표는 각각 $t$, $2$이다. (단, $t<2$)
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
subparts:
- id: '1'
  stem: (15점) 제시문 (ㄴ)의 함수 $g(x)$를 구하고 그 근거를 논술하시오.
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: g(x)=-(x**3-3*x)/2
    equivalents:
    - g(x)=-\frac12(x^3-3x)
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $y=g(x)$가 $y=\pm1$에 접하므로 극값이 $\pm1$이고 $g'(x)=3a(x^2-1)$로 둘 수 있다.
    steps:
    - id: 1a
      content: $g(x)=a(x^3-3x)+b$, $g(-1)=-1$, $g(1)=1$에서 $a=-\frac12$, $b=0$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 곡선 $y=g(x)$는 직선 $y=1$, $y=-1$과 각각 접하므로 삼차함수 $g(x)$의 극값은 $1$과 $-1$이다.
      source_flow: 36212_0acb.pdf p.30 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: $g(x)$의 최고차항의 계수 $a$가 양수라고 하면 $1$이 극댓값이고 $g(\alpha)=g(1)=1$, $\alpha<1$이므로 $g'(\alpha)=0$이다. $-1$이 극솟값이고 $g(-1)=g(\beta)=-1$, $-1<\beta$이므로 $g'(\beta)=0$이다. 닫힌구간 $[\alpha,\beta]$에서 $g(x)$는 감소하고 $g(-1)=g(\beta)=-1$, $-1<\beta$이므로 $-1<\alpha$이다. 이는 문제의 조건에 위배 되므로 $a<0$이다.
      source_flow: 36212_0acb.pdf p.30 예시답안 [논제 1]
      criteria:
      - 1.M2
    - id: 1b-3
      content: 그러므로 $g(\alpha)=g(1)=1$, $g'(1)=0$, $g(-1)=g(\beta)=-1$, $g'(-1)=0$이다.
      source_flow: 36212_0acb.pdf p.30 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-4
      content: 따라서 $g'(x)=3a(x^2-1)$, 즉 $g(x)=a(x^3-3x)+b$이고, $g(-1)=-1$, $g(1)=1$이므로 $2a+b=-1$, $-2a+b=1$이다. 따라서 $a=-\dfrac12$, $b=0$이고 $g(x)=-\dfrac12(x^3-3x)$이다.
      source_flow: 36212_0acb.pdf p.30 예시답안 [논제 1]
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $g(x)$의 극값이 $1$과 $-1$임을 밝혔다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 최고차항의 계수가 양수이면 $-1<\alpha$가 되어 조건 $\alpha<-1$에 모순이므로 $a<0$임을 보였다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $g(1)=1$, $g'(1)=0$, $g(-1)=-1$, $g'(-1)=0$을 구했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: $g'(x)=3a(x^2-1)$, $a=-\frac12$, $b=0$, $g(x)=-\frac12(x^3-3x)$를 구했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-4
