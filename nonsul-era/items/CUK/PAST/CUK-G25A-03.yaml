  tools:
  - $r=\frac{t}{e^t}$로 두면 급수의 합은 $\frac{r}{1-r}$, $F(t)=\frac{t}{e^t}$의 증감표로 $-1<r\le\frac1e$
  - $F$가 $(-\infty,1]$에서 증가하므로 $F(\cos\alpha)\le F(\sin\alpha)\iff\cos\alpha\le\sin\alpha$
  - $u=\cos x$, $u=\sin x$ 치환으로 $Q(x)=-e^{\cos x}-e^{\sin x}$
  - $q=g-h$의 부호에 따라 $[0,\frac\pi4]$, $[\frac\pi4,\frac{5\pi}{4}]$, $[\frac{5\pi}{4},2\pi]$로 분할
  conditions:
