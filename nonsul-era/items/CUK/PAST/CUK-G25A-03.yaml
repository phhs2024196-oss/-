intent: 등비급수의 합을 구할 수 있는지, 도함수를 이용하여 함수의 증가·감소를 조사할 수 있는지, 치환적분을 활용하여 함수의 부정적분을 구할 수 있는지, 정적분을 활용하여 두 곡선으로 둘러싸인 도형의 넓이를 구할 수 있는지 확인한다.
key_idea: $F(t)=\frac{t}{e^t}$는 $(-\infty,1]$에서 증가, $[1,\infty)$에서 감소하며 $t=1$에서 최댓값 $\frac1e$이다. 등비급수의 합 $\frac{r}{1-r}$의 최댓값이 $M$이다. 논제 2에서는 $F$의 증가성으로 부등식을 $\cos\alpha\le\sin\alpha$로 바꾸고, 부호가 바뀌는 구간별로 치환적분으로 넓이를 구한다.
stuck: 논제 1에서 $a<0$, $F(a)=-1$임을 찾아 $r$의 범위를 $-1<r\le\frac1e$로 정하는 단계, 논제 2의 부호 구간 분할
