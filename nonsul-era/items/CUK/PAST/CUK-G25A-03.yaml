stimuli:
- label: ㄱ
  body: |
    실수 $a$, $M$과 함수 $f(x)$는 다음 조건을 만족시킨다.

    (가) 실수 $t$에 대하여 급수 $\displaystyle\sum_{n=1}^{\infty}\dfrac{t^n}{e^{tn}}$은 $t\le a$이면 발산하고 $t>a$이면 수렴한다.

    (나) $t>a$인 모든 실수 $t$에 대하여 함수 $f(x)$의 $x=t$에서의 함숫값은 급수 $\displaystyle\sum_{n=1}^{\infty}\dfrac{t^n}{e^{tn}}$의 합과 같다.

    (다) 구간 $(a,\infty)$에서 함수 $f(x)$의 최댓값은 $M$이다.
- label: ㄴ
  body: |
    닫힌구간 $[0,2\pi]$에 속하고 다음 조건을 만족시키는 모든 실수 $\alpha$의 집합을 $A$라고 하자.

    $$\frac{\cos\alpha}{e^{\cos\alpha}}\le\frac{\sin\alpha}{e^{\sin\alpha}}$$
- label: ㄷ
  body: |
    두 함수 $g(x)$와 $h(x)$가 다음과 같을 때, 두 곡선 $y=g(x)$, $y=h(x)$와 두 직선 $x=0$, $x=2\pi$로 둘러싸인 도형의 넓이를 $S$라고 하자.

    $$g(x)=e^{\cos x}\sin x,\quad h(x)=e^{\sin x}\cos x$$
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (40점)
subparts:
- id: '1'
  stem: (10점) 제시문 (ㄱ)의 $M$의 값을 구하고 그 근거를 논술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: M=1/(E-1)
    equivalents:
    - M=\frac{1}{e-1}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 공비 $r=\frac{t}{e^t}$의 범위가 $-1<r\le\frac1e$이므로 합 $\frac{r}{1-r}$는 $r=\frac1e$일 때 최대이다.
    steps:
    - id: 1a
      content: $M=\frac{1/e}{1-1/e}=\frac1{e-1}$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 급수 $\displaystyle\sum_{n=1}^{\infty}\dfrac{t^n}{e^{tn}}$은 첫째항과 공비가 $\dfrac{t}{e^t}$인 등비급수이다. 함수 $F(t)=\dfrac{t}{e^t}$에 대하여 $F'(t)=\dfrac{1-t}{e^t}$이므로 $F(t)=\dfrac{t}{e^t}$는 구간 $(-\infty,1]$에서 증가, 구간 $[1,\infty)$에서 감소하는 함수이고 $t=1$에서 최댓값 $\dfrac1e$을 가진다.
      source_flow: 36212_0acb.pdf p.35 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 또한 $\displaystyle\lim_{t\to\infty}F(t)=0$, $\displaystyle\lim_{t\to-\infty}F(t)=-\infty$, $F(0)=0$이므로 조건 (가)로부터 $a<0$이고 $F(a)=-1$이다.
      source_flow: 36212_0acb.pdf p.35 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-3
      content: 따라서 $t>a$인 실수 $t$에 대하여 $r=\dfrac{t}{e^t}$라고 하면 $-1<r\le\dfrac1e$이고 급수 $\displaystyle\sum_{n=1}^{\infty}\dfrac{t^n}{e^{tn}}$의 합은 $\dfrac{r}{1-r}$이다. 그러므로 급수 $\displaystyle\sum_{n=1}^{\infty}\dfrac{t^n}{e^{tn}}$의 합은 $r=\dfrac1e$, 즉 $t=1$일 때 최대이며 그 합은 $\displaystyle\sum_{n=1}^{\infty}\dfrac{1}{e^n}=\dfrac{1}{e-1}$이다. $t>a$인 모든 실수 $t$에 대하여 함수 $f(x)$의 $x=t$에서의 함숫값은 급수 $\displaystyle\sum_{n=1}^{\infty}\dfrac{t^n}{e^{tn}}$의 합과 같으므로 $M=\dfrac{1}{e-1}$이다.
      source_flow: 36212_0acb.pdf p.35 예시답안 [논제 1]
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $F(t)=\frac{t}{e^t}$의 증가·감소를 조사하고, $a<0$, $F(a)=-1$로부터 공비 $r$의 범위 $-1<r\le\frac1e$를 구했다.
      steps:
      - 1b-1
      - 1b-2
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 합 $\frac{r}{1-r}$가 $r=\frac1e$($t=1$)일 때 최대임을 보이고 $M=\frac{1}{e-1}$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: (30점) 제시문 (ㄴ)의 집합 $A$와 제시문 (ㄷ)의 $S$의 값을 구하고 그 근거를 논술하시오.
  points: 30
  depends_on:
  - '1'
  answer:
    kind: value
    value: A=[pi/4,5*pi/4]; S=4*(exp(sqrt(2)/2)-exp(-sqrt(2)/2))
    equivalents:
    - A=\left[\frac\pi4,\frac{5\pi}{4}\right]
    - S=4\left(e^{\frac{\sqrt2}{2}}-e^{-\frac{\sqrt2}{2}}\right)
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $F$의 증가성으로 $\cos\alpha\le\sin\alpha$, 즉 $A=\left[\frac\pi4,\frac{5\pi}4\right]$. $q=g-h$의 부호가 $A$에서 정해지므로 세 구간으로 나눠 $Q=-e^{\cos x}-e^{\sin x}$로 적분한다.
    steps:
    - id: 2a
      content: $S=2\left(Q\left(\frac{5\pi}4\right)-Q\left(\frac\pi4\right)\right)=4\left(e^{\frac{\sqrt2}2}-e^{-\frac{\sqrt2}2}\right)$
      criteria:
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.M3
      - 2.A2
      - 2.A3
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 함수 $F(t)=\dfrac{t}{e^t}$가 구간 $(-\infty,1]$에서 증가하고, $\lvert\cos\alpha\rvert\le1$, $\lvert\sin\alpha\rvert\le1$이므로, $F(\cos\alpha)=\dfrac{\cos\alpha}{e^{\cos\alpha}}\le\dfrac{\sin\alpha}{e^{\sin\alpha}}=F(\sin\alpha)$일 필요충분조건은 $\cos\alpha\le\sin\alpha$이다.
      source_flow: 36212_0acb.pdf p.35 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: $0\le\alpha\le2\pi$이므로 $\cos\alpha\le\sin\alpha$일 필요충분조건은 $\dfrac\pi4\le\alpha\le\dfrac{5\pi}{4}$이다. 따라서 $A=\left[\dfrac\pi4,\dfrac{5\pi}{4}\right]$이다.
      source_flow: 36212_0acb.pdf p.35 예시답안 [논제 2]
      criteria:
      - 2.A1
    - id: 2b-3
      content: $q(x)=g(x)-h(x)=e^{\cos x}\sin x-e^{\sin x}\cos x$라고 하면 구하고자 하는 도형의 넓이는 $S=\displaystyle\int_0^{2\pi}\lvert q(x)\rvert\,dx$이다.
      source_flow: 36212_0acb.pdf p.35 예시답안 [논제 2]
      criteria:
      - 2.M2
    - id: 2b-4
      content: $e^{\cos x}>0$, $e^{\sin x}>0$이므로 $q(x)\ge0$일 필요충분조건은 $\dfrac{\cos x}{e^{\cos x}}\le\dfrac{\sin x}{e^{\sin x}}$이므로 $$S=\int_0^{2\pi}\lvert q(x)\rvert\,dx=-\int_0^{\frac\pi4}q(x)\,dx+\int_{\frac\pi4}^{\frac{5\pi}{4}}q(x)\,dx-\int_{\frac{5\pi}{4}}^{2\pi}q(x)\,dx$$이다.
      source_flow: 36212_0acb.pdf p.35 예시답안 [논제 2]
      criteria:
      - 2.M3
    - id: 2b-5
      content: $u=\cos x$로 놓으면 $\dfrac{du}{dx}=-\sin x$이므로 $\displaystyle\int g(x)\,dx=\int e^{\cos x}\sin x\,dx=-\int e^u\,du=-e^u+C=-e^{\cos x}+C$이고 $u=\sin x$로 놓으면 $\dfrac{du}{dx}=\cos x$이므로 $\displaystyle\int h(x)\,dx=\int e^{\sin x}\cos x\,dx=\int e^u\,du=e^u+C=e^{\sin x}+C$이다. 따라서 $Q(x)=-e^{\cos x}-e^{\sin x}$는 $q(x)$의 한 부정적분이다.
      source_flow: 36212_0acb.pdf p.35 예시답안 [논제 2]
      criteria:
      - 2.A2
    - id: 2b-6
      content: 그러므로 $$\begin{aligned}S&=\int_0^{2\pi}\lvert q(x)\rvert\,dx=-\int_0^{\frac\pi4}q(x)\,dx+\int_{\frac\pi4}^{\frac{5\pi}{4}}q(x)\,dx-\int_{\frac{5\pi}{4}}^{2\pi}q(x)\,dx\\&=-\left(Q\left(\frac\pi4\right)-Q(0)\right)+\left(Q\left(\frac{5\pi}{4}\right)-Q\left(\frac\pi4\right)\right)-\left(Q(2\pi)-Q\left(\frac{5\pi}{4}\right)\right)\\&=2\left(Q\left(\frac{5\pi}{4}\right)-Q\left(\frac\pi4\right)\right)=4\left(e^{\frac{\sqrt2}{2}}-e^{-\frac{\sqrt2}{2}}\right)\end{aligned}$$이다.
      source_flow: 36212_0acb.pdf p.35 예시답안 [논제 2]
      criteria:
      - 2.A3
