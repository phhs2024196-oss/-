elements:
  materials:
  - 급수 $\sum_{n=1}^{\infty}\frac{t^n}{e^{tn}}$의 수렴·발산 조건 $t\le a$ / $t>a$
  - $f(t)$=급수의 합, 구간 $(a,\infty)$에서의 최댓값 $M$
  - $\frac{\cos\alpha}{e^{\cos\alpha}}\le\frac{\sin\alpha}{e^{\sin\alpha}}$을 만족하는 $\alpha\in[0,2\pi]$의 집합 $A$
  - $g(x)=e^{\cos x}\sin x$, $h(x)=e^{\sin x}\cos x$와 $x=0$, $x=2\pi$로 둘러싸인 넓이 $S$
