      evidence: $F(t)=\frac{t}{e^t}$가 $(-\infty,1]$에서 증가함과 $\lvert\cos\alpha\rvert\le1$, $\lvert\sin\alpha\rvert\le1$을 이용해 조건이 $\cos\alpha\le\sin\alpha$와 필요충분조건임을 보였다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: $A=\left[\frac\pi4,\frac{5\pi}{4}\right]$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: $q(x)=g(x)-h(x)$로 놓고 $S=\int_0^{2\pi}\lvert q(x)\rvert\,dx$로 세웠다.
      steps:
      - 2b-3
    - id: 2.M3
      mark_type: M
      points: 5
      evidence: $q(x)\ge0$일 조건을 이용해 $S=-\int_0^{\frac\pi4}q\,dx+\int_{\frac\pi4}^{\frac{5\pi}{4}}q\,dx-\int_{\frac{5\pi}{4}}^{2\pi}q\,dx$로 구간을 나누었다.
      depends_on:
      - 2.M1
      - 2.M2
      steps:
      - 2b-4
    - id: 2.A2
      mark_type: A
      points: 8
      evidence: 치환적분으로 $Q(x)=-e^{\cos x}-e^{\sin x}$가 $q(x)$의 한 부정적분임을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-5
    - id: 2.A3
      mark_type: A
      points: 5
      evidence: $S=2\left(Q\left(\frac{5\pi}{4}\right)-Q\left(\frac\pi4\right)\right)=4\left(e^{\frac{\sqrt2}{2}}-e^{-\frac{\sqrt2}{2}}\right)$을 구했다.
      depends_on:
      - 2.M3
      steps:
      - 2b-6
