key_idea: 고려할 흰 공·검은 공 개수의 순서쌍이 $(3,1)$, $(3,3)$, $(3,6)$뿐임을 찾고, 사건 $W$, $B$, $A$의 순서 조합별 확률을 곱셈정리로 모아 $X=3,4,5$일 확률을 구한다. $X\le5$에서 사건 $U$는 개수에 영향이 없으므로 제외하고 센 뒤 $U$가 먼저 나오는 경우를 곱한다.
stuck: 검은 공의 개수 $b_k$가 정지 조건을 만족하는 순서쌍을 찾고, 사건 조합(순서)을 빠짐없이 세는 단계
