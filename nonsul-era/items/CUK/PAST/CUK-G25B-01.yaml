      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 60
      evidence: (1) $\frac1{20}$, (2) $\frac{13}{252}$, (3) $\frac1{12}$의 조합 확률을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
      - 1b-3
      - 1b-4
    - id: 1.A2
      mark_type: A
      points: 30
      evidence: $p=\frac13\times\frac1{20}+\frac{13}{252}+\frac1{12}=\frac{191}{1260}$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-5
    - id: 1.A3
      mark_type: A
      points: 60
      evidence: $X=5$인 세 가지 경우를 나누어 $P(X\le5)=\frac{13}{180}+\frac{13}{189}+\frac19$를 구하고 $q=\frac{189}{953}$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-6
