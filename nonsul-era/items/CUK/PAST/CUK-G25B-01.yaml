stimuli:
- label: ㄱ
  body: |
    하나의 상자에 다음 시행을 반복하여 공을 넣거나 꺼내려고 한다.

    한 개의 주사위를 던져서 나온 눈의 수가 $1$이면 흰 공 $3$개를, $2$ 이상 $4$ 이하이면 검은 공 $2$개를 상자에 넣고, $5$ 이상이면 상자에서 임의로 공 $1$개를 꺼낸다.

    (단, 상자가 비어있을 때 나온 눈의 수가 $5$ 이상이면 공을 넣지도 않고 꺼내지도 않는다.)
- label: ㄴ
  body: |
    제시문 (ㄱ)의 상자가 비어있는 상태에서 시작하여 제시문 (ㄱ)의 시행을 $k$번 반복한 후 상자에 들어 있는 흰 공의 개수를 $a_k$, 검은 공의 개수를 $b_k$라고 하자. 이때 $a_k$와 $b_k$가 다음 조건을 모두 만족시키거나 $k=10$이면 더 이상 시행을 반복하지 않고 멈추기로 한다.

    (가) $a_k=3$

    (나) $b_k>0$

    (다) $b_k$는 $3$의 배수 또는 $3$의 약수이다.
- label: ㄷ
  body: 제시문 (ㄴ)의 방법으로 시행을 반복할 때, 시작 후 멈출 때까지의 총 시행 횟수를 확률변수 $X$라고 하자.
- label: ㄹ
  body: 제시문 (ㄷ)의 확률변수 $X$에 대하여 $X=4$일 확률을 $p$, $X\le5$일 때 $X=3$일 확률을 $q$라고 하자.
stem: 제시문 (ㄱ)~(ㄹ)을 읽고 논제에 답하시오. (200점)
subparts:
- id: '1'
  stem: (200점) 제시문 (ㄹ)의 $p$와 $q$의 값을 구하고 그 근거를 논술하시오.
  points: 200
  depends_on: []
  answer:
    kind: value
    value: p=191/1260; q=189/953
    equivalents:
    - p=\frac{191}{1260}, q=\frac{189}{953}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 고려할 $(a,b)$ 순서쌍은 $(3,1)$, $(3,3)$, $(3,6)$이고 각 사건 조합의 확률을 곱셈정리로 구해 $p$, $q$를 계산한다.
    steps:
    - id: 1a
      content: $P(X=3)=\frac1{20}$, $p=\frac13\cdot\frac1{20}+\frac{13}{252}+\frac1{12}=\frac{191}{1260}$, $q=\frac{1/20}{13/180+13/189+1/9}=\frac{189}{953}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 매 시행에서 흰 공을 $3$개 넣는 사건을 $W$, 검은 공을 $2$개 넣는 사건을 $B$라고 하자. 공을 꺼내지 않는 사건을 $U$, 흰 공을 하나 꺼내는 사건을 $V$, 검은 공 하나를 꺼내는 사건을 $A$라고 하자. 제시문 (ㄴ)의 조건에서 $b_k$는 $3$의 배수 또는 약수이므로, 최대 시행회수가 $10$번까지임을 고려할 때, 검은 공의 개수 $b_k$로 가능한 값은 $1,3,6,9,12,15,18$이다. 이 중 제시문 (ㄹ)의 확률 $p$는 $X=4$인 경우를, $q$는 $X\le5$인 경우를 고려하므로, 고려해야 할 흰 공과 검은 공 개수의 순서쌍 조합은 $(3,1)$, $(3,3)$, $(3,6)$이다. $X\le5$이고 사건 $U$는 공의 개수에 영향을 미치지 않으므로 사건 $U$를 제외하고 생각했을 때, 각 순서쌍이 나올 수 있는 사건의 조합은 다음과 같다. 이때, 사건 $A$는 이전 시행에서 사건 $B$가 일어난 후에만 가능하다. (1) $WBA$, (2) $WBBA$, (3) $WBBB$
      source_flow: 36212_0acb.pdf p.42 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: '(1) 사건 $W$, $B$, $A$가 각각 한 번씩 일어나는 경우: 사건의 순서가 $WBA$, $BWA$인 경우 $\dfrac16\times\dfrac12\times\dfrac13\times\dfrac25$의 확률을 가지며, $BAW$인 경우 확률이 $\dfrac12\times\dfrac13\times\dfrac22\times\dfrac16$이다. 따라서 (1)의 확률은 $$\left[2\times\left(\frac16\times\frac12\times\frac13\times\frac25\right)+\left(\frac12\times\frac13\times\frac22\times\frac16\right)\right]=\frac1{20}$$이다.'
      source_flow: 36212_0acb.pdf p.42 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-3
      content: '(2) 사건 $W$와 사건 $A$가 한 번씩, 사건 $B$가 두 번 일어나는 경우: $4$가지의 경우($BAWB$, $BABW/BWAB$, $WBAB/BBAW/WBBA$, $BWBA$, $BBWA$)로 나누어 생각할 수 있으며, 이 중에서 세 가지 조합 $BAWB$, $BWAB$, $WBAB$ 경우는 제시문 (ㄴ)의 조건에 의해 세 번째 시행 후 중단되므로 제외한다. 나머지 경우로 생각할 수 있는 모든 조합에 대한 확률은 다음과 같다. $$\left[\left(\frac12\times\left(\frac13\times\frac22\right)\times\frac12\times\frac16\right)+\left(\frac12\times\frac12\times\left(\frac13\times\frac44\right)\times\frac16\right)+\left(3\times\frac16\times\frac12\times\frac12\times\left(\frac13\times\frac47\right)\right)\right]=\frac{13}{252}$$'
      source_flow: 36212_0acb.pdf p.42 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-4
      content: '(3) 사건 $W$가 한 번, 사건 $B$가 세 번 일어나는 경우: 한 번의 사건 $W$와 세 번의 사건 $B$로 고려할 수 있는 모든 조합을 고려한 확률의 총합은 다음과 같다. $$4\times\left(\frac16\times\frac12\times\frac12\times\frac12\right)=\frac1{12}$$'
      source_flow: 36212_0acb.pdf p.42 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-5
      content: '확률 $p$의 계산: 확률 $p$는 $X=4$일 확률이므로, 첫 사건으로 먼저 $U$가 일어난 후 (1)의 경우가 일어나거나 ($UWBA$, $UBWA$, $UBAW$), (2), (3)이 일어나는 경우이다. 따라서, 제시문 (ㄹ)의 확률 $p$는 위에서 계산한 세 개의 확률의 합이다. $$\frac13\times\frac1{20}+\frac{13}{252}+\frac1{12}=\frac{191}{1260}$$'
      source_flow: 36212_0acb.pdf p.42 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-6
      content: '확률 $q$ 계산: 제시문 (ㄹ)에 제시된 총 시행 횟수의 조건 $X\le5$를 고려할 때, $X=3$일 확률은 (1)에서 구한 $\dfrac1{20}$이다. $X=5$일 확률은 크게 세 가지로 나누어서 생각할 수 있다. ① 첫 사건으로 먼저 $U$가 두 번 일어난 후 (1)에서 고려한 사건의 조합이 일어나는 경우 ($UUWBA$, $UUBWA$, $UUBAW$) ② 첫 사건으로 먼저 $U$가 한 번 일어난 후 (2)에서 고려한 사건의 조합이 일어나는 경우 ($UBABW$, $UBBAW$, $UWBBA$, $UBWBA$, $UBBWA$) ③ 첫 사건으로 먼저 $U$가 한 번 일어난 후 (3)에서 고려한 사건의 조합이 일어나는 경우 ($UWBBB$, $UBWBB$, $UBBWB$, $UBBBW$) 따라서 $X\le5$일 확률은 다음과 같다. $$\frac1{20}\times\left(1+\frac13+\frac13\times\frac13\right)+\frac{13}{252}\times\left(1+\frac13\right)+\frac1{12}\times\left(1+\frac13\right)=\frac{13}{180}+\frac{13}{189}+\frac19$$ 따라서 조건부 확률 $q$는 다음과 같이 계산된다. $$\frac{\frac1{20}}{\frac{13}{180}+\frac{13}{189}+\frac19}=\frac{189}{953}$$'
      source_flow: 36212_0acb.pdf p.42 예시답안 [논제 1]
      criteria:
      - 1.A3
