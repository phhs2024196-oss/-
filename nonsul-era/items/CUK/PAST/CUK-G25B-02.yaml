intent: 함수의 합성을 이해하고 이를 활용할 수 있는지, 주어진 구간에서 다항함수의 정적분을 구할 수 있는지, 함수의 정적분을 치환적분법을 활용하여 구할 수 있는지 평가한다.
key_idea: $A(\alpha,f(\alpha))$, $B(f(\alpha),\alpha)$는 직선 $y=x$에 대칭이므로 $\overline{AB}$의 중점이 $(p,p)$이다. $g(x)=f(x+p)-p$로 두면 $g(0)=4$, $g(\pm2)$가 정해져 $g$가 결정되고, $\int_p^{f(\alpha)}f(x)\,dx=\int_0^{\pm2}g(x)\,dx+(\text{직사각형 넓이})$로 $\alpha$를 구한다. $f(\alpha)=\alpha\pm4$의 두 경우를 나눈다.
stuck: $g(x)=f(x+p)-p$로 평행이동해 $g(-2)$, $g(2)$를 $f(f(\alpha))=\alpha$로 이끌어내는 단계
