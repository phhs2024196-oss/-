stimuli:
- label: ㄱ
  body: |
    최고차항의 계수가 $3$인 삼차함수 $f(x)$는 어떤 실수 $\alpha$에 대하여 $f(f(\alpha))=\alpha$이고 다음 조건을 만족시킨다.

    (단, $p=\dfrac{\alpha+f(\alpha)}{2}$)

    (가) $\lvert\alpha-f(\alpha)\rvert=4$

    (나) $f(p)-p=4$

    (다) $\displaystyle\int_p^{f(\alpha)}f(x)\,dx=12$
stem: 제시문 (ㄱ)을 읽고 논제에 답하시오. (200점)
subparts:
- id: '1'
  stem: (200점) 제시문 (ㄱ)의 $\alpha$로 가능한 값을 모두 구하고 그 근거를 논술하시오.
  points: 200
  depends_on: []
  answer:
    kind: set
    value: alpha=25/3, -41/3
    equivalents:
    - \alpha=\frac{25}{3},-\frac{41}{3}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(x)=f(x+p)-p$로 놓으면 $g(0)=4$, $g(\pm2)$가 정해져 $g(x)=3x^3-x^2-13x+4$. $\alpha<f(\alpha)$, $\alpha>f(\alpha)$ 두 경우의 적분 조건에서 $\alpha$를 구한다.
    steps:
    - id: 1a
      content: $\alpha=\frac{25}{3}$ ($f(\alpha)=\alpha+4$), $\alpha=-\frac{41}{3}$ ($f(\alpha)=\alpha-4$)
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.M3
      - 1.A2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 제시문 (ㄱ)의 (가)에 의해 $\alpha\ne f(\alpha)$이고 점 $A(\alpha,f(\alpha))$, $B(f(\alpha),\alpha)$에 대하여 $\overline{AB}$의 중점은 $(p,p)$로 직선 $y=x$ 위에 있다. $g(x)=f(x+p)-p$라 하고 이를 $g(x)=3x^3+ax^2+bx+c$로 나타내자. $f(p)-p=4$이므로 $g(0)=c=4$이다.
      source_flow: 36212_0acb.pdf p.46 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: (1) $\alpha<f(\alpha)$일 때, $f(\alpha)=\alpha+4$이므로 점 $A$, $B$는 각각 $A(\alpha,\alpha+4)$, $B(\alpha+4,\alpha)$이고 $p=\alpha+2$이다. $g(-2)=f(p-2)-p=f(\alpha)-\alpha-2=2$, $g(2)=f(p+2)-p=f(f(\alpha))-\alpha-2=\alpha-\alpha-2=-2$이므로 $g(-2)=4a-2b-20=2$ $\cdots$ ①, $g(2)=4a+2b+28=-2$ $\cdots$ ②이고, ①+②에서 $a=-1$, ②$-$①에서 $b=-13$, 즉 $g(x)=3x^3-x^2-13x+4$이다.
      source_flow: 36212_0acb.pdf p.46 예시답안 [논제 1]
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\displaystyle\int_0^2g(x)\,dx=\int_0^2(3x^3-x^2-13x+4)\,dx=-\dfrac{26}{3}$이므로 $$\begin{aligned}\int_p^{f(\alpha)}f(x)\,dx&=\int_{\alpha+2}^{\alpha+4}f(x)\,dx=\int_{\alpha+2}^{\alpha+4}\left(g(x-\alpha-2)+\alpha+2\right)dx\\&=\int_0^2g(x)\,dx+2(\alpha+2)=-\frac{26}{3}+2\alpha+4=12\end{aligned}$$을 만족한다. 따라서 $\alpha=\dfrac{25}{3}$이다.
      source_flow: 36212_0acb.pdf p.46 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-4
      content: (2) $\alpha>f(\alpha)$일 때, $f(\alpha)=\alpha-4$이므로 점 $A$, $B$는 각각 $A(\alpha,\alpha-4)$, $B(\alpha-4,\alpha)$이고 $p=\alpha-2$이다. $g(-2)=f(p-2)-p=f(f(\alpha))-\alpha+2=2$, $g(2)=f(p+2)-p=f(\alpha)-\alpha+2=-2$이므로 $g(-2)=4a-2b-20=2$, $g(2)=4a+2b+28=-2$이므로 (1)에서와 마찬가지로 $g(x)=3x^3-x^2-13x+4$임을 알 수 있다.
      source_flow: 36212_0acb.pdf p.46 예시답안 [논제 1]
      criteria:
      - 1.M3
    - id: 1b-5
      content: $\displaystyle\int_0^{-2}g(x)\,dx=\int_0^{-2}(3x^3-x^2-13x+4)\,dx=-\dfrac{58}{3}$이므로 $$\begin{aligned}\int_p^{f(\alpha)}f(x)\,dx&=\int_{\alpha-2}^{\alpha-4}f(x)\,dx=\int_{\alpha-2}^{\alpha-4}\left(g(x-\alpha+2)+\alpha-2\right)dx\\&=\int_0^{-2}g(x)\,dx-2(\alpha-2)=-\frac{58}{3}-2\alpha+4=12\end{aligned}$$이다. 따라서 $\alpha=-\dfrac{41}{3}$이다. 모든 경우를 고려하였으므로 가능한 $\alpha$의 값은 $-\dfrac{41}{3}$, $\dfrac{25}{3}$이다.
      source_flow: 36212_0acb.pdf p.46 예시답안 [논제 1]
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: $\overline{AB}$의 중점이 $(p,p)$임을 밝히고 $g(x)=f(x+p)-p=3x^3+ax^2+bx+c$로 놓아 $c=g(0)=4$를 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 40
      evidence: $\alpha<f(\alpha)$일 때 $p=\alpha+2$, $g(-2)=2$, $g(2)=-2$로 $g(x)=3x^3-x^2-13x+4$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 50
      evidence: $\int_{\alpha+2}^{\alpha+4}f\,dx=\int_0^2g\,dx+2(\alpha+2)=12$에서 $\alpha=\frac{25}{3}$을 구했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.M3
      mark_type: M
      points: 40
      evidence: $\alpha>f(\alpha)$일 때 $p=\alpha-2$, $g(-2)=2$, $g(2)=-2$로 같은 $g(x)$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-4
    - id: 1.A2
      mark_type: A
      points: 50
      evidence: $\int_{\alpha-2}^{\alpha-4}f\,dx=\int_0^{-2}g\,dx-2(\alpha-2)=12$에서 $\alpha=-\frac{41}{3}$을 구하고 가능한 $\alpha$를 정리했다.
      depends_on:
      - 1.M3
      steps:
      - 1b-5
