stimuli:
- label: ㄱ
  body: |
    실수 $a$, $b$, $c$에 대하여 함수 $f(x)$는 다음과 같다. (단, $n$은 자연수이고 $e$는 자연로그의 밑이다.)

    $$f(x)=\begin{cases}ax^2+b&(x<-1)\\\displaystyle\lim_{n\to\infty}\left(\dfrac{3ae^{x+1}x^{2n}}{3x^{2n}+1}+\dfrac{2\left(x^{2n-1}+x^{2n-2}+\cdots+x+1\right)}{2x^{2n}+1}\right)&(-1\le x<1\text{ 또는 }x>1)\\c&(x=1)\end{cases}$$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$는 다음 조건을 만족시킨다.

    (가) 함수 $f(x)$는 $x=-1$에서 연속이다.

    (나) 함수 $f(x)$에서 $x$의 값이 $-1$에서 $1$까지 변할 때의 평균변화율은 $\dfrac12$이다.
- label: ㄷ
  body: |
    제시문 (ㄴ)의 함수 $f(x)$에 대하여 다음 조건을 만족시키는 실수 $p$의 집합을 $A$라고 하자. (단, $p\ne1$)

    $1$과 $p$ 사이에 있는 임의의 실수 $r$에 대하여 $\displaystyle\lim_{x\to r+}\dfrac{f(x)-f(r)}{x-r}\ne\dfrac{f(p)-f(1)}{p-1}$이다.
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 논제에 답하시오. (200점)
subparts:
- id: '1'
  stem: (200점) 제시문 (ㄷ)의 집합 $A$를 구하고 그 근거를 논술하시오.
  points: 200
  depends_on: []
  answer:
    kind: set
    value: A=-1-sqrt(19)/2<=p<1,1<p<=2
    equivalents:
    - A=\left\{p\mid-1-\frac{\sqrt{19}}{2}\le p<1,\ 1<p\le2\right\}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 극한으로 $f$를 확정($a=\frac43$, $b=-\frac13$, $c=2$)한 뒤, $p>1$, $-1\le p<1$, $p<-1$로 나누어 평균값 정리·사잇값의 정리로 $r$의 존재 여부를 판정한다.
    steps:
    - id: 1a
      content: $A=\left\{p\mid-1-\frac{\sqrt{19}}{2}\le p<1,\ 1<p\le2\right\}$
      criteria:
      - 1.B1
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.M4
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 각 범위에 맞는 $x$에 대하여 함수 $f(x)$의 값은 극한을 이용하여 다음과 같이 계산한다. (ⅰ) $x>1$이면, $$f(x)=\lim_{n\to\infty}\left(\frac{3ae^{x+1}x^{2n}}{3x^{2n}+1}+\frac{2(x^{2n-1}+x^{2n-2}+\cdots+x+1)}{2x^{2n}+1}\right)=\lim_{n\to\infty}\left(\frac{ae^{x+1}}{1+\frac{1}{3x^{2n}}}+\frac{\frac1x+\frac1{x^2}+\cdots+\frac1{x^{2n}}}{1+\frac{1}{2x^{2n}}}\right)=ae^{x+1}+\lim_{n\to\infty}\sum_{k=1}^{2n}\frac1{x^k}=ae^{x+1}+\frac1{x-1}$$ 즉, $f(x)=ae^{x+1}+\dfrac1{x-1}$ $(x>1)$이다. (ⅱ) $\lvert x\rvert<1$이면, $$f(x)=\lim_{n\to\infty}\left(\frac{3ae^{x+1}x^{2n}}{3x^{2n}+1}+\frac{2(x^{2n-1}+x^{2n-2}+\cdots+x+1)}{2x^{2n}+1}\right)=\lim_{n\to\infty}\frac{2(x^{2n}-1)}{(2x^{2n}+1)(x-1)}=\frac{2}{1-x}$$ (ⅲ) $x=-1$일 경우에는 $f(-1)=\dfrac34a$이다. (ⅰ), (ⅱ), (ⅲ)을 종합하면, 제시문 (ㄴ)의 (가) 조건에서 함수 $f(x)$가 $x=-1$에서 연속이므로 $\displaystyle\lim_{x\to-1+}f(x)=1$, $\displaystyle\lim_{x\to-1-}f(x)=a+b$, $f(-1)=\dfrac34a$의 값이 일치하고, $a=\dfrac43$, $b=-\dfrac13$이다. (나) 조건에서는 $x$가 $-1$부터 $1$까지 변할 때 $f(x)$의 평균변화율이 $\dfrac12$이므로 $c=2$이다.
      source_flow: 36212_0acb.pdf p.52 예시답안 [논제 1]
      criteria:
      - 1.B1
    - id: 1b-2
      content: (1) $p>1$일 때, $1$과 $p$ 사이의 $x$에 대하여 $f(x)=\dfrac43e^{x+1}+\dfrac1{x-1}$이다. 점 $(1,f(1))$에서 함수 $y=f(x)$에 그은 접선의 접점을 $(t,f(t))$라 하면 접선의 방정식은 $$y=\left(\frac43e^{t+1}-\frac1{(t-1)^2}\right)(x-t)+\frac43e^{t+1}+\frac1{t-1}$$이고 $2=\dfrac43(2-t)e^{t+1}+\dfrac2{t-1}$이므로 정리하면 $\left(\dfrac43e^{t+1}+\dfrac2{t-1}\right)(2-t)=0$, 즉 $t=2$이다. 이때, $f''(x)=\dfrac43e^{x+1}+\dfrac2{(x-1)^3}>0$이므로 $f'(x)$는 증가함수이다.
      source_flow: 36212_0acb.pdf p.52 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-3
      content: 이제 점 $(1,f(1))$부터 $(p,f(p))$까지 선분을 그려보면 그래프의 개형으로부터 $p\le2$인 경우 함수 $y=f(x)$의 그래프와 두 끝점에서만 만나고, $p>2$인 경우 교점이 하나 더 존재하게 되므로 $1$과 $2$ 사이의 값 $q$에 대해 $(q,f(q))$에서도 만난다. 즉, $p>2$이면 평균값정리에 의해 $q$와 $p$ 사이에 $\dfrac{f(p)-f(1)}{p-1}=\dfrac{f(p)-f(q)}{p-q}=f'(r)$을 만족하는 $r$이 있으므로 $p>2$이면 집합 $A$에 속할 수 없다. 반대로 두 끝점에서만 만날 경우 $f'(x)$가 증가하므로 $f'(r)$은 선분의 기울기보다 항상 작게 되고, $1<p\le2$이면 집합 $A$에 속한다.
      source_flow: 36212_0acb.pdf p.52 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-4
      content: (2) $-1\le p<1$일 때, 함수 $y=\dfrac2{1-x}$는 $x=-1$에서의 미분계수가 $\dfrac12$이고 증가함수이다. 따라서 두 점 $(-1,1)$과 $(1,2)$를 지나는 직선은 함수 $y=\dfrac2{1-x}$와 $x=-1$에서 접한다. 즉, $x$가 $p$부터 $1$까지 변할 때 함수 $f(x)$의 평균변화율은 $\dfrac12$ 이하이다. $p$와 $1$ 사이의 $r$은 $f'(r)>\dfrac12$이므로 평균변화율과 $f'(r)$이 일치할 수 없다. 즉, $-1\le p<1$이면 $A$에 속한다.
      source_flow: 36212_0acb.pdf p.52 예시답안 [논제 1]
      criteria:
      - 1.M2
    - id: 1b-5
      content: (3) $p<-1$일 때, $p$와 $1$ 사이의 $r$에 대하여 가능한 모든 $\displaystyle\lim_{x\to r+}\frac{f(x)-f(r)}{x-r}$의 값을 생각해보면 $\displaystyle\lim_{x\to-\infty}f'(x)=-\infty$, $\displaystyle\lim_{x\to-1-}f'(x)=-\dfrac83$, $\displaystyle\lim_{x\to-1+}f'(x)=\dfrac12$, $\displaystyle\lim_{x\to1-}f'(x)=\infty$이고 $\displaystyle\lim_{x\to r+}\frac{f(x)-f(r)}{x-r}$은 $r$이 커짐에 따라 항상 증가하므로 $-\dfrac83$ 이상 $\dfrac12$ 미만의 평균변화율은 $\displaystyle\lim_{x\to r+}\frac{f(x)-f(r)}{x-r}$과 일치할 수 없다. 먼저, $f(p)>1$이므로 평균변화율은 모두 $\dfrac12$ 미만이다. 점 $(1,f(1))$에서 기울기 $-\dfrac83$에 해당하는 직선 $y=-\dfrac83(x-1)+2$와 함수 $y=f(x)$의 교점을 $(s,f(s))$라 하면 $\dfrac43s^2-\dfrac13=-\dfrac83(s-1)+2$이므로 $4s^2+8s-15=0$이고, $s<-1$인 범위에서는 $s=-1-\dfrac{\sqrt{19}}2$이다. 따라서 $-1-\dfrac{\sqrt{19}}2\le p<-1$인 경우에는 $A$에 속한다.
      source_flow: 36212_0acb.pdf p.52 예시답안 [논제 1]
      criteria:
      - 1.M3
    - id: 1b-6
      content: $p<-1-\dfrac{\sqrt{19}}2$이면 $\dfrac{f(1)-f(p)}{1-p}<-\dfrac83$이고, 그래프의 개형에 따르면 $f'(p)<\dfrac{f(1)-f(p)}{1-p}$이다. 이때, 함수 $g(x)=\dfrac43x^2-\dfrac13$에 대하여 $g'(p)=f'(p)$이고, $g'(-1)=-\dfrac83$, $g'(x)$는 연속이므로 사잇값의 정리에 따르면 $p$와 $-1$ 사이에 $f'(r)=g'(r)=\dfrac{f(1)-f(p)}{1-p}$인 $r$이 존재하며, 따라서 $p$는 $A$에 속하지 않는다.
      source_flow: 36212_0acb.pdf p.52 예시답안 [논제 1]
      criteria:
      - 1.M4
    - id: 1b-7
      content: (1), (2)를 종합하면 $A=\left\{p\,\middle|\,-1-\dfrac{\sqrt{19}}2\le p<1,\ 1<p\le2\right\}$이다.
      source_flow: 36212_0acb.pdf p.52 예시답안 [논제 1]
      criteria:
      - 1.A1
