stimuli:
- label: ㄱ
  body: |
    최고차항의 계수가 양수인 삼차함수 $f(x)$와 정의역과 공역이 모두 실수 전체의 집합이고 실수 전체의 집합에서 연속인 함수 $g(x)$는 다음 조건을 만족시킨다.

    (가) $10\le\lvert f(2)-f(1)\rvert\le20$

    (나) 실수 $t$가 $0\le t\le4$일 때 $f(g(t))=f(t)$, $t<0$일 때 $g(t)=g(0)$, $t>4$일 때 $g(t)=g(4)$이다.

    (다) $\displaystyle\lim_{x\to0+}\dfrac{g(x)-g(0)}{\sqrt x}=\sqrt3$
- label: ㄴ
  body: 제시문 (ㄱ)의 함수 $g(x)$로 가능한 모든 함수의 개수를 $n$이라고 하자.
- label: ㄷ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$와 $g(x)$로 가능한 모든 함수에 대하여 다음 $S$의 값 중 가장 큰 값을 $M$, 가장 작은 값을 $m$이라고 하자.

    $S$는 곡선 $y=f'(x)g(x)$와 $x$축 및 두 직선 $x=1$, $x=4$로 둘러싸인 도형의 넓이이다.
stem: 제시문 (ㄱ)~(ㄷ)을 읽고 논제에 답하시오. (200점)
subparts:
- id: '1'
  stem: (200점) 제시문 (ㄱ)의 함수 $g(x)$로 가능한 함수를 모두 구하시오. 또한 제시문 (ㄴ)의 $n$, 제시문 (ㄷ)의 $M$과 $m$의 값을 구하시오. 이 모든 과정의 근거를 논술하시오.
  points: 200
  depends_on: []
  answer:
    kind: value
    value: n=2; M=295; m=455/4
    equivalents:
    - g_1(x)=\begin{cases}3&(x<0)\\\frac{-(x-2)+\sqrt{3x(4-x)}}{2}+2&(0\le x\le3)\\x&(3<x\le4)\\4&(4<x)\end{cases}
    - g_2(x)=\begin{cases}3&(x<0)\\\frac{-(x-2)+\sqrt{3x(4-x)}}{2}+2&(0\le x\le4)\\1&(4<x)\end{cases}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(t)\in\{t,\alpha(t),\beta(t)\}$, (다)로 $a=2$, $b=3$, 구간별 연속 선택으로 $g_1$, $g_2$ ($n=2$). $S$는 $u=f(x)$ 치환으로 $\frac{59}{2}k$ 또는 $\frac{91}{4}k$, $5\le k\le10$.
    steps:
    - id: 1a
      content: $n=2$, $M=\frac{59}{2}\times10=295$, $m=\frac{91}{4}\times5=\frac{455}{4}$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
      - 1.A2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)$의 최고차항의 계수를 $k$라고 하면 실수 $a,b,c$에 대하여 $f'(x)=k(3(x-a)^2-b)$, $f(x)=k((x-a)^3-b(x-a))+c$로 쓸 수 있다. $b\le0$이면 $f(x)$는 일대일함수이므로 조건 (나)에 의해 실수 $t$가 $0\le t\le4$일 때 $g(t)=t$이고, 이는 조건 (다)를 만족하지 않는다. 그러므로 $b>0$이다.
      source_flow: 36212_0acb.pdf p.60 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 실수 $t$가 $0\le t\le4$일 때 $x=t$에서의 함숫값 $g(t)=s$는 조건 (나)에서 $f(s)=f(t)$이므로 $k((s-a)^3-b(s-a))+c=k((t-a)^3-b(t-a))+c$이고 $(s-t)\left((s-a)^2+(s-a)(t-a)+(t-a)^2-b\right)=0$이다. 따라서 $\lvert t-a\rvert>2\sqrt{b/3}$일 때는 $s=t$이고, $\lvert t-a\rvert\le2\sqrt{b/3}$일 때는 $s=t$ 또는 $s=\dfrac{-(t-a)\pm\sqrt{4b-3(t-a)^2}}{2}+a$이다.
      source_flow: 36212_0acb.pdf p.60 예시답안 [논제 1]
      criteria:
      - 1.M2
    - id: 1b-3
      content: 정의역이 $[a-2\sqrt{b/3},\,a+2\sqrt{b/3}]$인 두 함수 $\alpha(x)$, $\beta(x)$를 $\alpha(x)=\dfrac{-(x-a)-\sqrt{4b-3(x-a)^2}}{2}+a$, $\beta(x)=\dfrac{-(x-a)+\sqrt{4b-3(x-a)^2}}{2}+a$, 정의역이 실수 전체의 집합인 함수 $I(x)$를 $I(x)=x$라고 하면 위 결과로부터 $0\le t\le4$이고 $\lvert t-a\rvert>2\sqrt{b/3}$일 때 $g(t)=I(t)$이고, $\cdots$ (*) $0\le t\le4$이고 $\lvert t-a\rvert\le2\sqrt{b/3}$일 때 $(g(t)-I(t))(g(t)-\alpha(t))(g(t)-\beta(t))=0$이다. $\cdots$ (**)
      source_flow: 36212_0acb.pdf p.60 예시답안 [논제 1]
      criteria:
      - 1.M3
    - id: 1b-4
      content: '1) $0<a-2\sqrt{b/3}$ 또는 $a+2\sqrt{b/3}\le0$인 경우: (*)에 의해 $g(x)$는 어떤 구간 $(0,p_1]$에서 함수 $I(x)$와 일치한다. (단, $p_1>0$) 따라서 $g(0)=\displaystyle\lim_{t\to0+}g(t)=\lim_{t\to0+}t=0$이고, $\displaystyle\lim_{t\to0+}\frac{g(t)-g(0)}{\sqrt t}=\lim_{t\to0+}\frac{t-0}{\sqrt t}=0$이다. 따라서 (다) 조건을 만족하지 않는다.'
      source_flow: 36212_0acb.pdf p.60 예시답안 [논제 1]
      criteria:
      - 1.M3
    - id: 1b-5
      content: '2) $a-2\sqrt{b/3}\le0<a+2\sqrt{b/3}$인 경우: (**)에 의해 $g(x)$는 어떤 닫힌구간 $[0,p_2]$에서 세 함수 $I(x)$, $\alpha(x)$, $\beta(x)$ 중 하나와 일치하게 된다. (단, $p_2>0$) 조건 (다)에서 $\displaystyle\lim_{x\to0+}\frac{g(x)-g(0)}{x}=\lim_{x\to0+}\frac1{\sqrt x}\frac{g(x)-g(0)}{\sqrt x}=\infty$이므로 이 구간에서 $g(x)$와 일치하는 함수는 $x=0$에서 미분가능하지 않다. 따라서 이 구간에서 $g(x)$는 두 함수 $\alpha(x)$, $\beta(x)$ 중 하나와 일치하고 $a-2\sqrt{b/3}=0$, 즉 $4b=3a^2$이다. 그런데 $\displaystyle\lim_{x\to0+}\frac{g(x)-g(0)}{\sqrt x}=\sqrt3$, $\displaystyle\lim_{x\to0+}\frac{\alpha(x)-\alpha(0)}{\sqrt x}=-\frac{\sqrt{6a}}{2}$, $\displaystyle\lim_{x\to0+}\frac{\beta(x)-\beta(0)}{\sqrt x}=\frac{\sqrt{6a}}{2}$이므로 닫힌구간 $[0,p_2]$에서 $g(x)$는 $\beta(x)$와 일치하고, $a=2$, $b=3$이다. 따라서 $f(x)=k((x-2)^3-3(x-2))+c$이고, 함수 $f(x)$는 $x=1$에서 극댓값 $f(1)=2k+c$, $x=3$에서 극솟값 $f(3)=-2k+c$를 가진다. 그리고, 두 함수 $\alpha(x)$, $\beta(x)$의 정의역은 $[0,4]$이고, $\alpha(x)=\dfrac{-(x-2)-\sqrt{3x(4-x)}}{2}+2$, $\beta(x)=\dfrac{-(x-2)+\sqrt{3x(4-x)}}{2}+2$이다.'
      source_flow: 36212_0acb.pdf p.60 예시답안 [논제 1]
      criteria:
      - 1.M3
    - id: 1b-6
      content: 세 곡선 $y=I(x)$, $y=\alpha(x)$, $y=\beta(x)$는 열린구간 $(0,1)$, $(1,3)$, $(3,4)$에서는 교점을 가지지 않으므로 (**)에 의해 각 닫힌구간 $[0,1]$, $[1,3]$, $[3,4]$에서는 $g(x)$는 세 함수 $I(x)$, $\alpha(x)$, $\beta(x)$ 중 하나와 일치하게 된다. 그런데 닫힌구간 $[0,p_2]$에서 $g(x)$가 $\beta(x)$와 일치하므로 닫힌구간 $[0,1]$에서 $g(x)$는 $\beta(x)$와 일치하고, $g(1)=\beta(1)=4\ne1=\alpha(1)=I(1)$이므로 닫힌구간 $[1,3]$에서도 $g(x)$는 $\beta(x)$와 일치한다. 닫힌구간 $[3,4]$에서는 $g(3)=\beta(3)=I(3)=3\ne0=\alpha(3)$이므로 닫힌구간 $[3,4]$에서는 $g(x)$는 $I(x)$ 또는 $\beta(x)$와 일치한다. 따라서 제시문 (ㄱ)의 함수 $g(x)$로 가능한 모든 함수는 다음 두 함수 $g_1(x)$, $g_2(x)$이고 제시문 (ㄴ)의 $n$의 값은 $2$이다. $$g_1(x)=\begin{cases}3&(x<0)\\\dfrac{-(x-2)+\sqrt{3x(4-x)}}{2}+2&(0\le x\le3)\\x&(3<x\le4)\\4&(4<x)\end{cases}\qquad g_2(x)=\begin{cases}3&(x<0)\\\dfrac{-(x-2)+\sqrt{3x(4-x)}}{2}+2&(0\le x\le4)\\1&(4<x)\end{cases}$$
      source_flow: 36212_0acb.pdf p.60 예시답안 [논제 1]
      criteria:
      - 1.A1
    - id: 1b-7
      content: 함수 $f_1(x)$는 정의역이 $[3,4]$, 공역이 $[-2k+c,2k+c]$이며 $3\le t\le4$인 모든 $t$에 대하여 $f_1(t)=f(t)$을 만족하는 함수이고, 함수 $f_2(x)$는 정의역이 $[1,3]$, 공역이 $[-2k+c,2k+c]$이며 $1\le t\le3$인 모든 $t$에 대하여 $f_2(t)=f(t)$을 만족하는 함수라고 하자. 삼차함수 $f(x)$가 $x=1$에서 극댓값 $f(1)=2k+c$, $x=3$에서 극솟값 $f(3)=-2k+c$를 가지고 $f(4)=2k+c$이므로 두 함수 $f_1(x)$, $f_2(x)$는 일대일대응이고 역함수를 가진다. $h_1(x)$를 $f_1(x)$의 역함수, $h_2(x)$를 $f_2(x)$의 역함수라고 하자. $1\le t\le3$인 모든 실수 $t$에 대하여 $f(h_1(f(t)))=f(t)$이고, $\alpha(t)\le I(t)\le h_1(f(t))$, $\alpha(t)\le I(t)\le\beta(t)$이므로 $h_1(f(t))=\beta(t)=g_1(t)=g_2(t)$이고, $3\le t\le4$인 모든 실수 $t$에 대하여 $f(h_1(f(t)))=f(t)$, $f(h_2(f(t)))=f(t)$이고, $\alpha(t)<\beta(t)<I(t)$, $\alpha(t)<h_2(f(t))<h_1(f(t))$이므로 $g_1(t)=h_1(f(t))$, $g_2(t)=h_2(f(t))$이다.
      source_flow: 36212_0acb.pdf p.60 예시답안 [논제 1]
      criteria:
      - 1.A2
    - id: 1b-8
      content: '$1\le t\le4$인 실수 $t$에 대하여 $g(t)\ge0$이고, $1\le t\le3$인 실수 $t$에 대하여 $f''(t)\le0$, $3\le t\le4$인 실수 $t$에 대하여 $f''(t)\ge0$이므로 제시문 (ㄷ)의 $S$는 다음과 같다. $$S=-\int_1^3f''(x)g(x)\,dx+\int_3^4f''(x)g(x)\,dx=-\int_1^3h_1(f(x))f''(x)\,dx+\int_3^4f''(x)g(x)\,dx$$ 1) $$-\int_1^3h_1(f(x))f''(x)\,dx=-\int_{2k+c}^{-2k+c}h_1(x)\,dx=\int_{-2k+c}^{2k+c}h_1(x)\,dx=4k\times h_1(2k+c)-\int_3^4\{f(x)-(-2k+c)\}\,dx=16k-\frac54k=\frac{59}{4}k$$ 2) $g(x)=g_1(x)$인 경우: $\displaystyle\int_3^4f''(x)g(x)\,dx=\int_3^4h_1(f(x))f''(x)\,dx=\int_{-2k+c}^{2k+c}h_1(x)\,dx=\frac{59}{4}k$ $g(x)=g_2(x)$인 경우: $\displaystyle\int_3^4f''(x)g(x)\,dx=\int_3^4h_2(f(x))f''(x)\,dx=\int_{-2k+c}^{2k+c}h_2(x)\,dx=8k$'
