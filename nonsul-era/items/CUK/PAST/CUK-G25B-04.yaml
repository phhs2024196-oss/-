elements:
  materials:
  - 최고차항의 계수가 양수인 삼차함수 $f(x)$, 연속함수 $g:\mathbb{R}\to\mathbb{R}$
  - (가) $10\le\lvert f(2)-f(1)\rvert\le20$, (나) $0\le t\le4$에서 $f(g(t))=f(t)$, $t<0$에서 $g(t)=g(0)$, $t>4$에서 $g(t)=g(4)$, (다) $\lim_{x\to0+}\frac{g(x)-g(0)}{\sqrt x}=\sqrt3$
  - '$S$: 곡선 $y=f''(x)g(x)$와 $x$축, $x=1$, $x=4$로 둘러싸인 넓이'
  concepts:
  - 일대일함수와 역함수
  - 인수분해와 판별식
  - 극한과 연속
  - 도함수와 증감
  - 치환적분과 넓이
  tools:
  - $f(x)=k((x-a)^3-b(x-a))+c$, $f(s)=f(t)\iff(s-t)\left((s-a)^2+(s-a)(t-a)+(t-a)^2-b\right)=0$
  - $\alpha(x)$, $\beta(x)=\dfrac{-(x-a)\mp\sqrt{4b-3(x-a)^2}}{2}+a$, $I(x)=x$ (세 곡선의 교점으로 구간 분할)
  - 조건 (다)의 $\sqrt x$ 극한으로 $g$와 일치하는 함수가 $\beta$임을 판별하여 $a=2$, $b=3$
  - $g$는 $[0,1]$, $[1,3]$에서 $\beta$, $[3,4]$에서 $I$ 또는 $\beta$이므로 $g_1$, $g_2$
  - $S=-\int_1^3h_1(f(x))f'(x)\,dx+\int_3^4f'g\,dx$를 $u=f(x)$ 치환으로 계산
  conditions:
  - $k>0$, $b>0$
  - $\lvert f(2)-f(1)\rvert=2k$이므로 $5\le k\le10$
  - $\alpha$, $\beta$의 정의역 $[0,4]$
