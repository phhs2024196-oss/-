intent: 일대일함수의 특성을 이해하고 이를 활용할 수 있는지, 간단한 다항식의 인수분해를 이해하고 이를 활용할 수 있는지, 이차방정식에서 판별식의 의미를 이해하고 이를 활용할 수 있는지, 함수의 극한 및 연속의 뜻을 알고 극한에 대한 성질 및 연속함수의 성질을 이해하고 활용할 수 있는지, 도함수를 활용하여 함수의 증가·감소 및 그래프의 개형을 파악하고 활용할 수 있는지, 치환적분을 이해하고 이를 활용하여 곡선으로 둘러싸인 도형의 넓이를 구할 수 있는지 평가한다.
key_idea: $f(x)=k((x-a)^3-b(x-a))+c$에서 $f(s)=f(t)$를 인수분해하면 $s=t$ 또는 $s=\alpha(t)$, $\beta(t)$이다. 조건 (다)로 $g$가 $x=0$에서 $\beta$와 일치함을 보여 $a=2$, $b=3$을 구하고, 연속 조건으로 가능한 $g$를 $g_1$, $g_2$ 둘로 정한다. $S$는 역함수 $h_1$, $h_2$에 대한 치환적분으로 계산해 $S=\frac{59}{2}k$ 또는 $\frac{91}{4}k$이다.
stuck: $g(t)\in\{I(t),\alpha(t),\beta(t)\}$임을 이끌어낸 뒤 (다)로 $a$, $b$를 정하고 구간별 연속 선택을 세는 단계
