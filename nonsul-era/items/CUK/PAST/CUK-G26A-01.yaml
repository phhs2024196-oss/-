stimuli:
- label: ㄱ
  body: |
    실수에서 정의된 함수 $f(x)$와 $g(x)$는 다음과 같다.

    $f(x)=x^3-6x^2$

    $g(x)=\dfrac32x-\dfrac{11}{2}$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$와 $g(x)$에 대하여 상수 $L$은 다음과 같다.

    방정식 $f(x)-g(x)=0$의 유리수가 아닌 두 근을 $\alpha$, $\beta$라 할 때,

    $L=\alpha^3+\beta^3$
- label: ㄷ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$에 대하여 상수 $m$은 다음 조건을 만족시킨다.

    방정식 $f(x)-mx+m+4=0$의 서로 다른 실근의 개수는 두 개이다.
stem: |
  다음 제시문을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    [논제 1] (10점) 제시문의 상수 $L$의 값을 구하고 그 근거를 논술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '455/2', equivalents: ['L=455/2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(-1)=g(-1)$이므로 $x+1$이 $f(x)-g(x)$의 인수이다. 나머지 이차식의 근과 계수의 관계로 $\alpha^3+\beta^3$을 구한다.
    steps:
    - {id: 1a, content: '$f(x)-g(x)=(x+1)\left(x^2-7x+\frac{11}{2}\right)$, $\alpha+\beta=7$, $\alpha\beta=\frac{11}{2}$ $\Rightarrow L=\frac{455}{2}$', criteria: [1.M1, 1.M2]}
  - id: S1-B
    audience: B
    source_flow: 37609_ffd2.pdf p.30 예시답안 [논제 1]
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$와 $g(x)$에 대하여 $f(-1)=-7=g(-1)$이다. 즉, $f(x)-g(x)$는 $x+1$을 하나의 인수로 갖는다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        조립제법을 이용하여
        $$f(x)-g(x)=(x+1)\left(x^2-7x+\frac{11}{2}\right)=(x+1)\left(x-\frac72-\frac{3\sqrt3}{2}\right)\left(x-\frac72+\frac{3\sqrt3}{2}\right)$$
        을 얻는다. 그러므로 $\alpha=\dfrac72+\dfrac{3\sqrt3}{2}$, $\beta=\dfrac72-\dfrac{3\sqrt3}{2}$ 또는 $\alpha=\dfrac72-\dfrac{3\sqrt3}{2}$, $\beta=\dfrac72+\dfrac{3\sqrt3}{2}$이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서
        $$L=\alpha^3+\beta^3=(\alpha+\beta)(\alpha^2-\alpha\beta+\beta^2)=(\alpha+\beta)\left((\alpha+\beta)^2-3\alpha\beta\right)=7\left(49-\frac{33}{2}\right)=\frac{455}{2}$$
        이다.
      criteria: [1.M2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $f(-1)=-7=g(-1)$이므로 $f(x)-g(x)$가 $x+1$을 하나의 인수로 가짐을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        조립제법으로 $f(x)-g(x)=(x+1)\left(x^2-7x+\frac{11}{2}\right)$로 인수분해하고 $\alpha=\frac72\pm\frac{3\sqrt3}{2}$, $\beta=\frac72\mp\frac{3\sqrt3}{2}$를 구해 $L=\alpha^3+\beta^3=\frac{455}{2}$를 계산했다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2, 1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [논제 2] (20점) 제시문의 상수 $m$의 값을 구하고 그 근거를 논술하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '-21/4', equivalents: ['m=-21/4'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=m(x-1)-4$의 서로 다른 실근이 2개이면 직선이 곡선에 접한다. 접점의 $x$좌표 $p$에서의 접선이 $(1,-4)$를 지난다.
    steps:
    - {id: 2a, content: '$2p^3-9p^2+12p-4=0$, $p=2$(삼중근, 제외) 또는 $p=\frac12$ $\Rightarrow m=-\frac{21}{4}$', criteria: [2.M1, 2.M2, 2.M3, 2.A1]}
  - id: S2-B
    audience: B
    source_flow: 37609_ffd2.pdf p.30 예시답안 [논제 2]
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        상수 $m$에 대하여 $h(x)=m(x-1)-4$라 하자. 그러면 $f(x)-mx+m+4=f(x)-h(x)$이다. 서로 다른 실근의 개수가 2이므로 곡선 $y=f(x)$와 직선 $y=h(x)$는 두 점에서 만나고 그 중 한점에서는 직선 $y=h(x)$가 곡선 $y=f(x)$의 접선이 된다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        접점의 $x$좌표를 $p$라 하자. 그러면 $(p,f(p))$에서의 곡선 $y=f(x)$의 접선은 $y=3(p^2-4p)(x-p)+p^3-6p^2=h(x)$이다. 한편, $h(1)=-4$이므로 $-4=3(p^2-4p)(1-p)+p^3-6p^2=-2p^3+9p^2-12p$를 얻는다. 즉, $2p^3-9p^2+12p-4=0$이다. $2p^3-9p^2+12p-4=2(p-2)^2\left(p-\frac12\right)$이므로 $p=2$ 또는 $p=\frac12$이다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        i) $p=2$인 경우, $m=-12$이고 $f(x)-h(x)=(x-2)^3$이다. 따라서 방정식 $f(x)-h(x)=0$은 단 하나의 실근만을 갖게 되어 조건에 모순이다.
      criteria: [2.M3]
    - id: 2b-4
      content: |
        ii) $p=\dfrac12$인 경우, $m=-\dfrac{21}{4}$이고 $f(x)-h(x)=x^3-6x^2+\dfrac{21}{4}x-\dfrac54=\left(x-\dfrac12\right)^2(x-5)$이다. 즉, 방정식 $f(x)-h(x)=0$은 서로 다른 실근 $x=\dfrac12,5$를 갖는다. 따라서 $m=-\dfrac{21}{4}$
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $h(x)=m(x-1)-4$로 놓고 $f(x)-mx+m+4=f(x)-h(x)$임을 이용해, 서로 다른 실근이 2개이면 곡선 $y=f(x)$와 직선 $y=h(x)$가 두 점에서 만나고 그 중 한 점에서 접함을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: |
        접점의 $x$좌표 $p$에서의 접선 $y=3(p^2-4p)(x-p)+p^3-6p^2=h(x)$와 $h(1)=-4$로 $2p^3-9p^2+12p-4=0$을 세우고 $p=2$ 또는 $p=\frac12$을 구했다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.M3
      mark_type: M
      points: 5
      evidence: |
        $p=2$인 경우 $m=-12$이고 $f(x)-h(x)=(x-2)^3$이므로 실근이 하나뿐이라 조건에 모순임을 보였다.
      depends_on: [2.M2]
      implied_ok: false
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $p=\frac12$인 경우 $m=-\frac{21}{4}$이고 $f(x)-h(x)=\left(x-\frac12\right)^2(x-5)$로 서로 다른 실근 $\frac12$, $5$를 가짐을 확인하여 $m=-\frac{21}{4}$를 구했다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
