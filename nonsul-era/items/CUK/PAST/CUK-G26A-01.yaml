intent: |
  나머지정리와 인수분해의 의미를 이해하고 이를 활용하여 방정식의 해를 구할 수 있는지, 삼차방정식의 근을 판별하고 방정식에 대한 문제를 해결할 수 있는지, 함수의 그래프 위의 점에서의 접선의 방정식을 구할 수 있는지 확인한다.
key_idea: |
  $f(-1)=g(-1)=-7$이므로 $f(x)-g(x)$가 $x+1$을 인수로 갖고, 나머지 이차식의 두 근의 합·곱으로 $\alpha^3+\beta^3$을 구한다. 논제 2는 서로 다른 실근이 2개이면 직선 $y=m(x-1)-4$가 곡선에 접하므로 접점의 $x$좌표 $p$에서 접선이 $(1,-4)$를 지난다는 식으로 $p$를 구하고, 삼중근이 되는 경우를 제외한다.
stuck: |
  논제 2에서 '서로 다른 실근 2개'를 '직선이 곡선과 한 점에서 접하고 다른 한 점에서 만남'으로 바꾸는 단계, 그리고 $p=2$(삼중근)를 버리는 단계
