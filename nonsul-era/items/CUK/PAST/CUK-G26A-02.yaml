- id: '2'
  stem: '[논제 2] (20점) 제시문의 다항함수 $f(x)$에 대하여 적분값 $\displaystyle\int_0^3xf(x)\,dx$를 구하고 그 근거를 논술하시오.'
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents:
    - \int_0^3 x f(x) dx = 2
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\int_{-5}^5h$를 네 구간으로 나눠 계산하고, 치환적분 $\int_{-3}^0 3xf(x+3)dx=\int_0^3 3(t-3)f(t)dt$로 $\int_0^3 6xf(x)dx=12$를 얻는다.
    steps:
    - id: 2a
      content: $\int_{-5}^5h$를 네 구간으로 나눠 계산하고, 치환적분 $\int_{-3}^0 3xf(x+3)dx=\int_0^3 3(t-3)f(t)dt$로 $\int_0^3 6xf(x)dx=12$를 얻는다.
      criteria:
      - 2.M1
      - 2.M2
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        함수 $h(x)$에 대한 적분값 $\displaystyle\int_{-5}^5h(x)\,dx$는
        $$\begin{aligned}\int_{-5}^5h(x)\,dx&=\int_{-5}^{-3}3x(3(x+3))\,dx+\int_{-3}^03xf(x+3)\,dx\\&\quad+\int_0^3f(x)(3(x+3))\,dx+\int_3^53x(3(x+3))\,dx\\&=78+\int_{-3}^03xf(x+3)\,dx+\int_0^3f(x)(3(x+3))\,dx+510=600\end{aligned}$$
        이므로 $\displaystyle\int_{-3}^03xf(x+3)\,dx+\int_0^3f(x)(3(x+3))\,dx=12$이다.
      source_flow: 37609_ffd2.pdf p.34 예시답안
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        한편, 치환적분법에 의해
        $$\int_{-3}^03xf(x+3)\,dx=\int_0^33(t-3)f(t)\,dt$$
        이므로
        $$\int_{-3}^03xf(x+3)\,dx+\int_0^3f(x)(3(x+3))\,dx=\int_0^36xf(x)\,dx=12$$
        이다. 따라서,
        $$\int_0^3xf(x)\,dx=2$$
        이다.
      source_flow: 37609_ffd2.pdf p.34 예시답안
      criteria:
      - 2.M2
