stimuli:
- label: ㄱ
  body: |
    다항함수 $f(x)$에 대하여 함수 $g(x)$는 다음과 같다.

    $g(x)=\begin{cases}3x & x<0,\ x>3\\ f(x) & 0\le x\le3\end{cases}$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $g(x)$에 대하여 함수 $h(x)$는 다음과 같다.

    $h(x)=\displaystyle\lim_{t\to0+}g(x+t)\cdot\lim_{t\to3+}g(x+t)$
- label: ㄷ
  body: |
    제시문 (ㄴ)의 함수 $h(x)$는 모든 실수 $x$에서 연속이고 다음 조건을 만족시킨다.

    $\displaystyle\int_{-5}^{5}h(x)\,dx=600$
stem: |
  다음 제시문을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
subparts:
- id: '1'
  stem: '[논제 1] (10점) 제시문의 다항함수 $f(x)$에 대하여 $f(0)+f(3)$의 값을 구하고 그 근거를 논술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '9'
    equivalents:
    - f(0)+f(3)=9
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $X=x+t$로 두어 $h(x)$를 구간별로 구하고, 연속 조건으로 $f(0)=0$, $f(3)=9$를 얻는다.
    steps:
    - id: 1a
      content: $X=x+t$로 두어 $h(x)$를 구간별로 구하고, 연속 조건으로 $f(0)=0$, $f(3)=9$를 얻는다.
      criteria:
      - 1.M1
      - 1.M2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $X=x+t$로 두면 $\displaystyle\lim_{t\to0+}g(x+t)=\lim_{X\to x+}g(X)$, $\displaystyle\lim_{t\to3+}g(x+t)=\lim_{X\to(3+t)+}g(X)$이다. 따라서, 구하고자 하는 함수 $h(x)$는 다음과 같다.
        $$h(x)=\begin{cases}3x(3(x+3)) & x\ge3\\ f(x)(3(x+3)) & 0\le x<3\\ 3xf(x+3) & -3\le x<0\\ 3x(3(x+3)) & x<-3\end{cases}$$
      source_flow: 37609_ffd2.pdf p.34 예시답안
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        한편, 주어진 함수 $h(x)$는 모든 실수에 대해 연속이므로
        $$\lim_{x\to3+}h(x)=\lim_{x\to3-}h(x)\Rightarrow 9\cdot18=f(3)\cdot18$$
        $$\lim_{x\to0+}h(x)=\lim_{x\to0-}h(x)\Rightarrow f(0)\cdot9=0$$
        $$\lim_{x\to-3+}h(x)=\lim_{x\to-3-}h(x)\Rightarrow -9f(0)=0$$
        이어야 하므로, $f(0)=0$, $f(3)=9$이다. 따라서, $f(0)+f(3)=9$이다.
      source_flow: 37609_ffd2.pdf p.34 예시답안
      criteria:
      - 1.M2
