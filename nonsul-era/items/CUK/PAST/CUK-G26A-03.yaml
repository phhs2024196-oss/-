stimuli:
- label: ㄱ
  body: |
    삼각형 $ABC$는 다음 조건을 만족시킨다.

    (가) 세 변의 길이 중 가장 짧은 변의 길이는 3이다.

    (나) $\sin2B=\sin2C$ 또는 $\cos2B=\cos2C$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 삼각형 $ABC$에 대하여 집합 $M$은 다음과 같다.

    집합 $M$은 $\cos B=\dfrac13$일 때 $\overline{BC}$가 가질 수 있는 모든 값의 모임이다.
- label: ㄷ
  body: |
    제시문 (ㄱ)의 삼각형 $ABC$에 대하여 상수 $p,q,r$은 다음과 같다.

    (가) 선분 $AB$의 중점을 $P$라 할 때, 삼각형 $APC$의 외접원의 넓이를 $S_1$, 삼각형 $BPC$의 외접원의 넓이를 $S_2$라 하자.

    (나) $\dfrac{S_1}{S_2}$의 값이 $\dfrac18$일 때 $\overline{BC}$의 최솟값을 $p$, $\dfrac{S_1}{S_2}$의 값이 $\dfrac38$일 때 $\overline{BC}$의 최솟값을 $q$,

    $\dfrac{S_1}{S_2}$의 값이 $\dfrac58$일 때 $\overline{BC}$의 최솟값을 $r$이라 하자.
stem: |
  다음 제시문을 읽고 문제(논제 1, 논제 2)에 답하시오. (40점)
subparts:
- id: '1'
  stem: '[논제 1] (15점) 제시문의 집합 $M$을 구하고 그 근거를 논술하시오.'
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '{3, 9}'
    equivalents:
    - M={3,9}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\sin2B=\sin2C$ 또는 $\cos2B=\cos2C$에서 $A=\frac\pi2$인 직각삼각형 또는 $B=C$인 이등변삼각형이 되고, 각각에서 가장 짧은 변이 3임을 이용해 $\overline{BC}$를 구한다.
    steps:
    - id: 1a
      content: $\sin2B=\sin2C$ 또는 $\cos2B=\cos2C$에서 $A=\frac\pi2$인 직각삼각형 또는 $B=C$인 이등변삼각형이 되고, 각각에서 가장 짧은 변이 3임을 이용해 $\overline{BC}$를 구한다.
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        제시문 (ㄱ)의 (나)에 의하면 $\sin2B=\sin2C$이거나 $\cos2B=\cos2C$이다. 삼각형의 각은 0보다 크고 $\pi$보다 작으므로 $\sin2B=\sin2C$이면 $2B=2C$이거나 $2B=\pi-2C$이고, $\cos2B=\cos2C$이면 $2B=2C$이거나 $2B=2\pi-2C$이다. 한편 $A+B+C=\pi$를 만족하려면 $2B=2\pi-2C$는 성립할 수 없다.

        따라서 가능한 경우는 $A=B+C=\dfrac\pi2$인 직각삼각형과 $B=C$인 이등변삼각형 두 가지가 있다. 집합 $M$을 구하기 위해 $\cos B=\dfrac13$이라고 하자.
      source_flow: 37609_ffd2.pdf p.38~39 예시답안
      criteria:
      - 1.M1
    - id: 1b-2
      content: (1) 직각삼각형일 경우, $A=\dfrac\pi2$이고 $B$는 $\dfrac\pi4$이상이므로 $B>C$이고, $\overline{AB}$가 가장 짧은 변이 되어 길이가 3이다. 따라서 $\overline{BC}=\dfrac{\overline{AB}}{\cos B}=3\times3=9$이다.
      source_flow: 37609_ffd2.pdf p.38~39 예시답안
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        (2) 이등변삼각형일 경우, $B$는 $\dfrac\pi3$이상이므로 $A<B=C$이고, $\overline{BC}$가 가장 짧은 변이 되어 길이가 3이다.

        따라서 (1), (2)에 의해 $M=\{3,\ 9\}$이다.
      source_flow: 37609_ffd2.pdf p.38~39 예시답안
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 조건 (나)에서 $2B=2C$ 또는 $2B=\pi-2C$만 가능함을 보여, 삼각형이 $A=B+C=\frac\pi2$인 직각삼각형이거나 $B=C$인 이등변삼각형임을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 직각삼각형인 경우 $B>C$이므로 $\overline{AB}=3$이 가장 짧은 변이고 $\overline{BC}=\frac{\overline{AB}}{\cos B}=9$임을 구했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 이등변삼각형인 경우 $A<B=C$이므로 $\overline{BC}=3$임을 구하고 $M=\{3,9\}$를 얻었다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-3
