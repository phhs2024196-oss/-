    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: 사인법칙으로 $\frac{S_1}{S_2}=\frac{\sin^2B}{\sin^2A}=\frac{\overline{AC}^2}{\overline{BC}^2}$을 보이고, 직각삼각형이면 $\overline{AB}^2+\overline{AC}^2=\overline{BC}^2$, 이등변삼각형이면 $\frac{S_1}{S_2}=\frac{1}{4\cos^2B}$임을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: $\frac{S_1}{S_2}=\frac18$인 경우 직각삼각형에서 $\overline{BC}=6\sqrt2$, 이등변삼각형은 존재하지 않음을 보여 $p=6\sqrt2$를 구했다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: $\frac{S_1}{S_2}=\frac38$인 경우 직각삼각형과 이등변삼각형 모두에서 $\overline{BC}=2\sqrt6$임을 보여 $q=2\sqrt6$을 구했다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-3
    - id: 2.A3
      mark_type: A
      points: 5
      evidence: $\frac{S_1}{S_2}=\frac58$인 경우 직각삼각형에서 $2\sqrt6$, 이등변삼각형에서 $\frac{6\sqrt{10}}{5}$를 구하고 최솟값 $r=\frac{6\sqrt{10}}{5}$를 택했다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-4
