- id: '2'
  stem: '[논제 2] (25점) 제시문의 상수 $p,q,r$의 값을 구하고 그 근거를 논술하시오.'
  points: 25
  depends_on: []
  answer:
    kind: value
    value: p=6*sqrt(2); q=2*sqrt(6); r=6*sqrt(10)/5
    equivalents:
    - p=6\sqrt2, q=2\sqrt6, r=6\sqrt{10}/5
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 사인법칙으로 $\frac{S_1}{S_2}=\frac{\overline{AC}^2}{\overline{BC}^2}$을 얻고, 직각삼각형과 이등변삼각형 각각에서 변의 비로 $\overline{BC}$를 구해 최솟값을 택한다.
    steps:
    - id: 2a
      content: 사인법칙으로 $\frac{S_1}{S_2}=\frac{\overline{AC}^2}{\overline{BC}^2}$을 얻고, 직각삼각형과 이등변삼각형 각각에서 변의 비로 $\overline{BC}$를 구해 최솟값을 택한다.
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
      - 2.A3
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        삼각형 $APC$의 외접원의 반지름을 $R_1$, 삼각형 $BPC$의 외접원의 반지름을 $R_2$라고 하자. $\overline{PC}$를 기준으로 사인법칙을 적용하면 $2R_1=\dfrac{\overline{PC}}{\sin A}$이고, $2R_2=\dfrac{\overline{PC}}{\sin B}$가 된다. 따라서 $\dfrac{S_1}{S_2}=\dfrac{R_1^2}{R_2^2}=\dfrac{\sin^2B}{\sin^2A}$이다.

        이 때 삼각형 $ABC$의 외접원의 반지름을 $R$이라 하면 사인법칙에 의해 $2R=\dfrac{\overline{BC}}{\sin A}=\dfrac{\overline{AC}}{\sin B}$에서 $\dfrac{S_1}{S_2}=\dfrac{\sin^2B}{\sin^2A}=\dfrac{\overline{AC}^2}{\overline{BC}^2}$이다. 삼각형 $ABC$가 직각삼각형일 경우 $\overline{AB}^2+\overline{AC}^2=\overline{BC}^2$이고 이등변삼각형이면 $\cos B=\dfrac{\overline{BC}}{2\overline{AC}}$이므로 $\dfrac{S_1}{S_2}=\dfrac{\overline{AC}^2}{\overline{BC}^2}=\dfrac{1}{4\cos^2B}$이다.
      source_flow: 37609_ffd2.pdf p.38~39 예시답안
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        (1) $\dfrac{S_1}{S_2}=\dfrac18$인 경우:

        직각삼각형이면 $\overline{AC}^2:\overline{AB}^2:\overline{BC}^2=1:7:8$이다. $\overline{AC}<\overline{AB}<\overline{BC}$이므로 $\overline{AC}=3$이고 $\overline{BC}=3\times2\sqrt2=6\sqrt2$이다. 이등변삼각형일 때에는 $\dfrac{S_1}{S_2}=\dfrac{1}{4\cos^2B}$가 $\dfrac14$ 미만일 수 없으므로 그러한 삼각형은 존재하지 않는다. 따라서 $p=6\sqrt2$이다.
      source_flow: 37609_ffd2.pdf p.38~39 예시답안
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        (2) $\dfrac{S_1}{S_2}=\dfrac38$인 경우:

        직각삼각형이면 $\overline{AC}^2:\overline{AB}^2:\overline{BC}^2=3:5:8$이다. 마찬가지로 $\overline{AC}=3$이고 $\overline{BC}=3\times\dfrac{2\sqrt6}{3}=2\sqrt6$이다. 이등변삼각형일 때에는 $\dfrac{S_1}{S_2}=\dfrac{\sin^2B}{\sin^2A}=\dfrac38<1$이므로 $B<A$에서 $\overline{AB}=3$이고, $\dfrac{S_1}{S_2}=\dfrac{1}{4\cos^2B}=\dfrac38$이므로 $\cos B=\dfrac{\sqrt6}{3}$이 되어 $\overline{BC}=6\cos B=2\sqrt6$이다. 따라서 $\overline{BC}$의 최솟값은 $q=2\sqrt6$이다.
      source_flow: 37609_ffd2.pdf p.38~39 예시답안
      criteria:
      - 2.A2
    - id: 2b-4
      content: |
        (3) $\dfrac{S_1}{S_2}=\dfrac58$인 경우:

        직각삼각형이면 $\overline{AC}^2:\overline{AB}^2:\overline{BC}^2=5:3:8$이다. $\overline{AC}>\overline{AB}$이므로 $\overline{AB}=3$이고 $\overline{BC}=3\times\dfrac{2\sqrt6}{3}=2\sqrt6$이다. 이등변삼각형일 때에는 $\dfrac{S_1}{S_2}=\dfrac{\sin^2B}{\sin^2A}=\dfrac58<1$이므로 $B<A$에서 $\overline{AB}=3$이고, $\dfrac{S_1}{S_2}=\dfrac{1}{4\cos^2B}=\dfrac58$이므로 $\cos B=\dfrac{\sqrt{10}}{5}$이 되어 $\overline{BC}=6\cos B=\dfrac{6\sqrt{10}}{5}$이다. $2\sqrt6$보다 작으므로, $\overline{BC}$의 최솟값은 $r=\dfrac{6\sqrt{10}}{5}$이다. 따라서 (1), (2), (3)을 종합하면 $p=6\sqrt2,\ q=2\sqrt6,\ r=\dfrac{6\sqrt{10}}{5}$이다.
      source_flow: 37609_ffd2.pdf p.38~39 예시답안
      criteria:
      - 2.A3
