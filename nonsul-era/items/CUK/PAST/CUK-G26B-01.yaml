stimuli:
- label: ㄱ
  body: |
    정수의 값을 갖는 등차수열 $\{a_n\}$, $\{b_n\}$, $\{c_n\}$과 수열 $\{x_n\}$은 자연수 $K$에 대하여 다음 조건을 만족시킨다.

    (가) 등차수열 $\{a_n\}$, $\{b_n\}$, $\{c_n\}$의 공차는 각각 0이 아닌 정수 $d_1$, $d_2$, $d_3$이고 $a_K=b_K$, $b_{K+15}=c_{K+15}$이다.

    (나) $n\le K$인 자연수 $n$에 대하여 $x_n=a_n$이다.

    (다) $K\le n\le K+15$인 자연수 $n$에 대하여 $x_n=b_n$이다.

    (라) $n\ge K+15$인 자연수 $n$에 대하여 $x_n=c_n$이다.
- label: ㄴ
  body: |
    제시문 (ㄱ)의 수열 $\{x_n\}$에 대하여 $\{x_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라고 할 때, $\{x_n\}$과 $S_n$은 다음 조건을 만족시킨다.

    (가) $x_1=35$

    (나) $x_{46}x_{47}<0$

    (다) $S_7=S_8$

    (라) $S_{19}S_{17}-S_{19}S_{18}+S_{18}^2-S_{18}S_{17}-25=0$
stem: |
  제시문 (ㄱ)~(ㄴ)을 읽고 논제에 답하시오. (200점)
subparts:
- id: '1'
  stem: '[논제] (200점) 제시문의 $d_1$, $d_2$, $d_3$, $K$, $S_{46}$의 값을 구하고 그 근거를 논술하시오.'
  points: 200
  depends_on: []
  answer:
    kind: value
    value: d1=-5; d2=10; d3=-7; K=15; S46=1563
    equivalents:
    - d_1=-5, d_2=10, d_3=-7, K=15, S_{46}=1563
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 조건 (라)를 $(S_{18}-S_{17})(S_{19}-S_{18})=-25$로 정리해 $x_{18}x_{19}=-25$를 얻고, 부호 변화와 $x_8=0$으로 $d_1=-5$, $d_2>0$, $K$의 범위를 정한 뒤 경우를 나누어 $K=15$, $d_2=10$, $d_3=-7$을 구한다.
    steps:
    - id: 1a
      content: 조건 (라)를 $(S_{18}-S_{17})(S_{19}-S_{18})=-25$로 정리해 $x_{18}x_{19}=-25$를 얻고, 부호 변화와 $x_8=0$으로 $d_1=-5$, $d_2>0$, $K$의 범위를 정한 뒤 경우를 나누어 $K=15$, $d_2=10$, $d_3=-7$을 구한다.
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
      - 1.A2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 제시문에서 $S_{19}S_{17}-S_{19}S_{18}+S_{18}^2-S_{18}S_{17}-25=0$이므로 $(S_{18}-S_{17})(S_{19}-S_{18})=-25$, 즉 $x_{18}x_{19}=-25$이고 $x_{18}$과 $x_{19}$는 서로 부호가 다름을 알 수 있다. 또한 $x_{46}x_{47}<0$이므로 $x_{46}$과 $x_{47}$도 서로 부호가 다르다.
      source_flow: 37609_ffd2.pdf p.43 예시답안
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        한편 $S_7=S_8$이므로 $x_8=S_8-S_7=0$이고, 만일 $K\le8$이면, $k>8$일 때

        1) $d_2>0$, $d_3>0$인 경우 $x_k$는 증가

        2) $d_2>0$, $d_3<0$인 경우 $x_k$는 증가 후 감소

        3) $d_2<0$, $d_3<0$인 경우 $x_k$는 감소

        4) $d_2<0$, $d_3>0$인 경우 $x_k$는 감소 후 증가

        의 경우밖에 없는데 어떤 경우라도 $x_{18}$과 $x_{19}$ 및 $x_{46}$과 $x_{47}$에서 부호가 바뀐다는 사실에 대하여 모순이다. 따라서 $K>8$이다.

        $x_8=0$이므로 $35+(8-1)d_1=0$, 즉 $d_1=-5$임을 알 수 있다.
      source_flow: 37609_ffd2.pdf p.43 예시답안
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $d_1<0$이므로, 만일 $d_2<0$이라면 $x_k$는 모든 $k$에 대하여 감소하거나 감소하다가 증가하는 경우밖에 없으므로 역시 $x_8=0$이고 $x_{18}$과 $x_{19}$ 및 $x_{46}$과 $x_{47}$에서 부호가 바뀔 수 없다. 따라서 $d_2>0$이고 $K\le18$임을 알 수 있다. 이때 $K>8$에서 $K+15>23$이므로 $x_{18}=b_{18}$, $x_{19}=b_{19}$이다. 즉 $x_{19}-x_{18}=d_2>0$이고, $x_{18}x_{19}=-25$에서 $x_{18}=-1$, $x_{19}=25$, 또는 $x_{18}=-25$, $x_{19}=1$, 또는 $x_{18}=-5$, $x_{19}=5$이다.

        1) $x_{18}=-1$, $x_{19}=25$라면 $d_2=26$이고 $a_K=b_K$이어야 하지만 $a_K=35+(K-1)(-5)=-1+(18-K)(-26)=b_K$를 만족시키는 정수 $K$는 존재하지 않는다.

        2) $x_{18}=-25$, $x_{19}=1$이라면 $d_2=26$이고 $a_K=35+(K-1)(-5)=-25+(18-K)(-26)=b_K$를 만족시키는 정수 $K$는 존재하지 않는다.

        3) $x_{18}=-5$, $x_{19}=5$라면 $d_2=10$이고 $a_K=35+(K-1)(-5)=-5+(18-K)(-10)=b_K$를 만족시키는 자연수 $K=15$가 존재한다. 따라서 $K=15$이고, $x_{30}=-35+(30-15)(10)=115$이다.
      source_flow: 37609_ffd2.pdf p.43 예시답안
      criteria:
      - 1.M3
    - id: 1b-4
      content: 한편 $d_3<0$이므로, $x_{46}>0$이고 $x_{47}<0$이다. $x_{46}=115+(46-30)d_3>0$에서 $d_3>-\dfrac{115}{16}>-8$이고 $x_{47}=115+(47-30)d_3<0$에서 $d_3<-\dfrac{115}{17}<-6$이므로 $d_3=-7$이고, $x_{46}=115+(46-30)(-7)=3$이다.
      source_flow: 37609_ffd2.pdf p.43 예시답안
      criteria:
      - 1.A1
    - id: 1b-5
      content: |
        따라서
        $$\begin{aligned}S_{46}&=S_{15}+(S_{30}-S_{15})+(S_{46}-S_{30})\\&=\frac{15(35-35)}{2}+\frac{15(-25+115)}{2}+\frac{16(108+3)}{2}\\&=1563\end{aligned}$$
      source_flow: 37609_ffd2.pdf p.43 예시답안
      criteria:
      - 1.A2
