key_idea: $f(x)\le f(c)$로 $a=c^2$. 구간 최댓값 함수 $g(t)$의 그래프를 $b\ge0$, $b<0$로 나누어 그리면 꺾이는 점이 $t=-c$ 또는 $t=-\alpha$에 생긴다. $t=-\frac12$에서 꺾이는 조건과 직선 $y=\frac1{25}t+\frac1c$가 $(0,\frac1c)$, $(-\frac12,g(-\frac12))$를 지난다는 조건으로 $b$, $c$를 구한다.
stuck: $g(t)$의 구간별 식과 꺾이는 점의 위치를 $b$의 부호에 따라 구하는 단계, (ㄷ)의 교점 개수 조건을 두 점을 잇는 기울기 조건으로 바꾸는 단계
