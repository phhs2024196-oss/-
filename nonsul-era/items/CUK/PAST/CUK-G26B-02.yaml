      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 50
      evidence: $b\ge0$인 경우 $g(t)$를 구간별로 구하고 $t=-\frac12$에서 미분불가능하려면 $c=\frac12$이어야 하며, 이때 (ㄷ)을 만족하지 않음을 보였다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 50
      evidence: $b<0$인 경우 $f(-\alpha)=f(c-\alpha)$인 $\alpha\in(0,c)$로 $g(t)$를 구하고 $\alpha=\frac12<c$에서 $b=\frac{-4(c-\frac12)}{(c-\frac12)^2+c^2}$를 구했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.M4
      mark_type: M
      points: 20
      evidence: (ㄷ)의 (나), (다)에서 $\left(0,\frac1c\right)$와 $\left(-\frac12,-\frac12b\right)$를 잇는 직선의 기울기가 $\frac1{25}$여야 함을 이용해 $b=\frac1{25}-\frac2c$를 구했다.
      depends_on:
      - 1.M3
      implied_ok: false
      steps:
      - 1b-4
    - id: 1.A1
      mark_type: A
      points: 50
      evidence: 두 식을 연립하여 $8c^3-4c^2+c-50=(c-2)(8c^2+12c+25)=0$에서 $c=2$를 구하고 $a=4$, $b=-\frac{24}{25}$, $c=2$를 얻었다.
      depends_on:
      - 1.M3
      - 1.M4
      implied_ok: false
      steps:
      - 1b-5
