stimuli:
- label: ㄱ
  body: |
    양수 $a$와 상수 $b$에 대하여 함수 $f(x)$는 다음과 같다.

    $f(x)=\begin{cases}\dfrac{2x}{x^2+a} & (x\ge0)\\ bx & (x<0)\end{cases}$
- label: ㄴ
  body: |
    실수 $t$와 제시문 (ㄱ)의 함수 $f(x)$에 대하여 닫힌구간 $[t,\ t+c]$에서의 $f(x)$의 최댓값을 $g(t)$라고 할 때, 함수 $f(x)$와 $g(t)$는 다음 조건을 만족시킨다. (단, $c$는 양수이다.)

    (가) $x\ge0$인 모든 실수 $x$에 대하여 $f(x)\le f(c)$이다.

    (나) 함수 $g(t)$는 $t=-\dfrac12$에서 미분가능하지 않다.
- label: ㄷ
  body: |
    제시문 (ㄴ)의 $c$와 함수 $g(t)$에 대하여 기울기가 $m$인 직선 $l$은 다음 조건을 만족시킨다.

    (가) 직선 $l$의 방정식은 $y=mt+\dfrac1c$이다.

    (나) $m=\dfrac1{25}$일 때, 직선 $l$은 곡선 $y=g(t)$와 서로 다른 두 점에서 만난다.

    (다) $0<m<\dfrac1{25}$일 때, 직선 $l$은 곡선 $y=g(t)$와 서로 다른 세 점에서 만난다.
stem: |
  제시문 (ㄱ)~(ㄷ)을 읽고 문제에 답하시오. (200점)
subparts:
- id: '1'
  stem: '[논제] (200점) 제시문의 $a,b,c$의 값을 구하고 그 근거를 논술하시오.'
  points: 200
  depends_on: []
  answer:
    kind: value
    value: a=4; b=-24/25; c=2
    equivalents:
    - a=4, b=-24/25, c=2
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (ㄴ)(가)로 $a=c^2$, $f(c)=\frac1c$. $b\ge0$이면 $c=\frac12$이지만 (ㄷ)을 만족하지 않아 $b<0$. $b<0$에서 $t=-\frac12$가 꺾이는 점이 되도록 $-\frac b2=f\left(c-\frac12\right)$, (ㄷ)에서 기울기 $\frac1{25}$로 $b=\frac1{25}-\frac2c$, 연립하여 $c=2$.
    steps:
    - id: 1a
      content: (ㄴ)(가)로 $a=c^2$, $f(c)=\frac1c$. $b\ge0$이면 $c=\frac12$이지만 (ㄷ)을 만족하지 않아 $b<0$. $b<0$에서 $t=-\frac12$가 꺾이는 점이 되도록 $-\frac b2=f\left(c-\frac12\right)$, (ㄷ)에서 기울기 $\frac1{25}$로 $b=\frac1{25}-\frac2c$, 연립하여 $c=2$.
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.M4
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        제시문 (ㄴ)의 (가)에 의해,
        $$f'(c)=\frac{2a-2c^2}{(c^2+a)^2}=0\Rightarrow a=c^2$$
        이므로 $f(c)=\dfrac1c$이다.
      source_flow: 37609_ffd2.pdf p.48~49 예시답안
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ① $b\ge0$인 경우, 함수 $g(t)$는
        $$g(t)=\begin{cases}b(t+c) & (t\le-c)\\ \dfrac{2(t+c)}{(t+c)^2+a} & (-c<t\le0)\\ \dfrac1c & (0<t\le c)\\ \dfrac{2t}{t^2+a} & (c\le t)\end{cases}$$
        이고, $g(t)$가 $t=-\dfrac12$에서 미분가능하지 않기 위해서는 $c=\dfrac12$이어야 한다.

        [그림: $b\ge0$, $y=f(x)$는 $x<0$에서 원점을 지나는 기울기 $b$의 직선, $x\ge0$에서 증가 후 감소 $\Rightarrow$ $y=g(t)$는 $t\le-c$에서 직선, 증가하다가 $0<t\le c$에서 수평, 이후 감소]

        한편, $c=\dfrac12$일 때, $g(0)=2$이므로 $(0,2)$를 지나고 기울기가 $m$인 직선과 $g(t)$의 교점은

        ⓐ $b\ge\dfrac1{25}$: $0<m\le\dfrac1{25}$일 때 2개

        ⓑ $b<\dfrac1{25}$: $m=\dfrac1{25}$일 때 3개

        이므로 제시문 (ㄷ)을 만족하지 않는다.
      source_flow: 37609_ffd2.pdf p.48~49 예시답안
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        ② $b<0$인 경우, $f(-\alpha)=f(c-\alpha)$를 만족시키는 $\alpha$가 구간 $(0,c)$에 존재하므로, 함수 $g(t)$는
        $$g(t)=\begin{cases}bt & (t\le-\alpha)\\ \dfrac{2(t+c)}{(t+c)^2+a} & (-\alpha<t\le0)\\ \dfrac1c & (0<t\le c)\\ \dfrac{2t}{t^2+a} & (c\le t)\end{cases}$$
        $g(t)$가 $t=-\dfrac12$에서 미분가능하지 않기 위해서는 $\alpha=\dfrac12<c$이어야 한다. $g(0)=\dfrac1c$이므로 그래프는 다음과 같다.

        [그림: $b<0$, $y=f(x)$는 $x<0$에서 기울기 $b$인 직선(양수값), $x\ge0$에서 증가 후 감소 $\Rightarrow$ $y=g(t)$는 $t=-\alpha$에서 꺾이고 $0<t\le c$에서 수평]

        따라서,
        $$-\frac12b=\frac{2\left(c-\frac12\right)}{\left(c-\frac12\right)^2+a}\Rightarrow b=\frac{-4\left(c-\frac12\right)}{\left(c-\frac12\right)^2+c^2}$$
      source_flow: 37609_ffd2.pdf p.48~49 예시답안
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        제시문 (ㄷ)의 (나), (다)를 만족하기 위해서는 $\left(0,\dfrac1c\right)$와 $\left(-\dfrac12,-\dfrac12b\right)$를 잇는 직선의 기울기가 $\dfrac1{25}$이어야 한다. 즉,
        $$\frac{\frac1c-\left(-\frac12b\right)}{0-\left(-\frac12\right)}=\frac1{25}\Rightarrow b=\frac1{25}-\frac2c$$
      source_flow: 37609_ffd2.pdf p.48~49 예시답안
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        따라서,
        $$b=\frac{-4\left(c-\frac12\right)}{\left(c-\frac12\right)^2+c^2}=\frac1{25}-\frac2c\Rightarrow8c^3-4c^2+c-50=0$$
        이고
        $$8c^3-4c^2+c-50=0\Leftrightarrow(c-2)(8c^2+12c+25)=0$$
        에 의해 $c=2$이다.

        따라서, $a=4$, $b=-\dfrac{24}{25}$, $c=2$이다.
      source_flow: 37609_ffd2.pdf p.48~49 예시답안
      criteria:
      - 1.A1
