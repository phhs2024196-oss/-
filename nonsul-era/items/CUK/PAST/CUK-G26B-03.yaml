    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선과 $x=4\pi$의 교점 $g(t)=k(4\pi-t)\cos kt+\sin kt$의 증감표로 $[x,4\pi]$에서의 최댓값·최솟값을 구해 $h(x)$를 구간별로 얻고, 부분적분으로 $\int_a^bh$를 계산한다.
    steps:
    - id: 1a
      content: 접선과 $x=4\pi$의 교점 $g(t)=k(4\pi-t)\cos kt+\sin kt$의 증감표로 $[x,4\pi]$에서의 최댓값·최솟값을 구해 $h(x)$를 구간별로 얻고, 부분적분으로 $\int_a^bh$를 계산한다.
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.M4
      - 1.M5
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)=\sin kx$ 함수의 $(t,f(t))$에서의 접선은 $y=f'(t)(x-t)+f(t)=k(x-t)\cos kt+\sin kt$이고, $g(t)=k(4\pi-t)\cos kt+\sin kt$가 된다.
      source_flow: 37609_ffd2.pdf p.53~54 예시답안
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        제시문의 적분 계산을 위해서는 구간 $[a,b]$, 즉 $\left[4\pi-\dfrac{5\pi}{2k},\ 4\pi-\dfrac{3\pi}{2k}\right]$에서 $h(x)$의 함수값이 필요하고, $h(x)$는 $x\le t\le4\pi$에서 $g(t)$의 최댓값과 최솟값을 통해 계산할 수 있다.

        $g'(t)=-k^2(4\pi-t)\sin kt$이므로 $\sin kt=0$이거나 $t=4\pi$일 때 $g'(t)=0$이다. $k$는 자연수이므로 $t=4\pi$이면 $g(t)=g(4\pi)=\sin4\pi k=0$이고 구간 $\left[4\pi-\dfrac\pi k,\ 4\pi\right]$에서 함수 $g(t)$는 증가하며 $t=4\pi-\dfrac\pi k$일 때 극솟값을 갖는다. 마찬가지로, 자연수 $n$에 대하여 함수 $g(t)$는 $t=4\pi-\dfrac{(2n-1)\pi}{k}$에서는 극소, $t=4\pi-\dfrac{2n\pi}{k}$에서는 극대이다.

        따라서 $4\pi-\dfrac{5\pi}{2k}\le t\le4\pi$인 $t$에 대하여 함수 $g(t)$의 극값은 $g\left(4\pi-\dfrac{2\pi}{k}\right)=2\pi$, $g\left(4\pi-\dfrac\pi k\right)=-\pi$, $g(4\pi)=0$이다.

        [표: $t=4\pi-\frac{5\pi}{2k}$에서 $g(t)=-1$, 증가하여 $t=4\pi-\frac{2\pi}{k}$에서 $2\pi$, 감소하여 $t=4\pi-\frac{3\pi}{2k}$에서 $1$, 계속 감소하여 $t=4\pi-\frac\pi k$에서 $-\pi$, 증가하여 $t=4\pi$에서 $0$]
      source_flow: 37609_ffd2.pdf p.53~54 예시답안
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        이제 $4\pi-\dfrac{5\pi}{2k}\le x\le4\pi-\dfrac{3\pi}{2k}$인 실수 $x$에 대하여 구간 $[x,4\pi]$에서 $g(t)$의 최댓값과 최솟값을 구하자.

        $g\left(4\pi-\dfrac{5\pi}{2k}\right)=-1>-\pi=g\left(4\pi-\dfrac\pi k\right)$이므로 구간 $[x,4\pi]$에서 $g(t)$의 최솟값은 항상 $-\pi$임을 확인할 수 있다.
      source_flow: 37609_ffd2.pdf p.53~54 예시답안
      criteria:
      - 1.M3
    - id: 1b-4
      content: 최댓값의 경우, $g\left(4\pi-\dfrac{3\pi}{2k}\right)=1>0=g(4\pi)$이므로 $4\pi-\dfrac{2\pi}{k}\le x\le4\pi-\dfrac{3\pi}{2k}$인 경우에는 구간 $[x,4\pi]$에서 $g(t)$의 최댓값이 $g(x)$가 되고, $4\pi-\dfrac{5\pi}{2k}\le t\le4\pi-\dfrac{2\pi}{k}$인 경우에는 $g\left(4\pi-\dfrac{2\pi}{k}\right)=2\pi$가 최댓값이다.
      source_flow: 37609_ffd2.pdf p.53~54 예시답안
      criteria:
      - 1.M4
    - id: 1b-5
      content: 따라서 위 내용을 정리하면 $h(x)=\begin{cases}3\pi & \left(4\pi-\dfrac{5\pi}{2k}\le x\le4\pi-\dfrac{2\pi}{k}\right)\\ g(x)+\pi & \left(4\pi-\dfrac{2\pi}{k}\le x\le4\pi-\dfrac{3\pi}{2k}\right)\end{cases}$이다.
      source_flow: 37609_ffd2.pdf p.53~54 예시답안
      criteria:
      - 1.M5
    - id: 1b-6
      content: |
        주어진 적분 $\displaystyle\int_a^bh(x)\,dx$를 계산하면
        $$\begin{aligned}\int_{4\pi-\frac{5\pi}{2k}}^{4\pi-\frac{3\pi}{2k}}h(x)\,dx&=3\pi\times\left(\frac{\pi}{2k}\right)+\pi\times\left(\frac{\pi}{2k}\right)+\int_{4\pi-\frac{2\pi}{k}}^{4\pi-\frac{3\pi}{2k}}g(x)\,dx\\&=\frac{2\pi^2}{k}+\int_{4\pi-\frac{2\pi}{k}}^{4\pi-\frac{3\pi}{2k}}\left(k(4\pi-x)\cos kx+\sin kx\right)dx\end{aligned}$$
        이고, 부분적분을 통해 계산하면
        $$\begin{aligned}\int\left(k(4\pi-x)\cos kx+\sin kx\right)dx&=\left[(4\pi-x)\sin kx-\frac1k\cos kx\right]-\int(-\sin kx)\,dx\\&=(4\pi-x)\sin kx-\frac2k\cos kx\end{aligned}$$
        이므로
        $$\begin{aligned}\int_{4\pi-\frac{5\pi}{2k}}^{4\pi-\frac{3\pi}{2k}}h(x)\,dx&=\frac{2\pi^2}{k}+\left[(4\pi-x)\sin kx-\frac2k\cos kx\right]_{x=4\pi-\frac{2\pi}{k}}^{x=4\pi-\frac{3\pi}{2k}}\\&=\frac{2\pi^2}{k}+\left[\left(\frac{3\pi}{2k}\right)-\left(-\frac2k\right)\right]\\&=\frac{4\pi^2+3\pi+4}{2k}\end{aligned}$$
        따라서 $\displaystyle\int_{4\pi-\frac{5\pi}{2k}}^{4\pi-\frac{3\pi}{2k}}h(x)\,dx=\dfrac{4\pi^2+3\pi+4}{2k}$이다. 즉, $2kC=4\pi^2+3\pi+4$이다.
      source_flow: 37609_ffd2.pdf p.53~54 예시답안
      criteria:
      - 1.A1
