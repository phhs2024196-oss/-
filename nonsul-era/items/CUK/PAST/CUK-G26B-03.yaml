stimuli:
- label: ㄱ
  body: |
    자연수 $k$에 대하여 함수 $f(x)$는 다음과 같다.

    $f(x)=\sin kx$
- label: ㄴ
  body: |
    실수 $t$와 제시문 (ㄱ)의 함수 $f(x)$에 대하여 직선 $x=4\pi$와 곡선 $y=f(x)$ 위의 점 $(t,\ f(t))$에서의 접선이 만나는 점의 $y$좌표를 $g(t)$라고 하자.
- label: ㄷ
  body: |
    $x<4\pi$인 실수 $x$와 제시문 (ㄴ)의 함수 $g(t)$에 대하여 닫힌구간 $[x,\ 4\pi]$에서의 함수 $g(t)$의 최댓값과 최솟값의 차를 $h(x)$라고 하자.
- label: ㄹ
  body: |
    제시문 (ㄱ)의 자연수 $k$와 제시문 (ㄷ)의 함수 $h(x)$에 대하여 $a=4\pi-\dfrac{5\pi}{2k}$, $b=4\pi-\dfrac{3\pi}{2k}$, $C=\displaystyle\int_a^bh(x)\,dx$라고 하자.
stem: |
  제시문 (ㄱ)~(ㄹ)을 읽고 논제에 답하시오. (200점)
subparts:
- id: '1'
  stem: '[논제] (200점) 제시문의 $k$와 $C$에 대하여 $2kC$를 구하고 그 근거를 논술하시오.'
  points: 200
  depends_on: []
  answer:
    kind: value
    value: 4*pi**2+3*pi+4
    equivalents:
