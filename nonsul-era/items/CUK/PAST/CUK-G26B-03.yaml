key_idea: 접선과 $x=4\pi$의 교점 $g(t)=k(4\pi-t)\cos kt+\sin kt$의 극값 $2\pi$, $-\pi$, $0$과 $g(4\pi-\frac{5\pi}{2k})=-1$, $g(4\pi-\frac{3\pi}{2k})=1$을 비교하여 구간 $[x,4\pi]$의 최대·최소를 $x$의 범위별로 정하면 $h(x)=3\pi$ 또는 $g(x)+\pi$이고, 부분적분으로 $2kC$를 구한다.
stuck: $[x,4\pi]$에서 $g(t)$의 최댓값이 $x$에 따라 $2\pi$ 또는 $g(x)$로 바뀌는 지점을 극값 비교로 찾는 단계, $k$가 남아 있는 구간 끝점에서의 삼각함수 값 계산
