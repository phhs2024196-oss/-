stimuli:
- label: ㄱ
  body: |
    주머니에 1부터 $n$까지의 자연수가 각각 적혀있는 공 $n$개가 들어있다. 이 주머니에서 임의로 2개의 공을 꺼낼 때, 꺼낸 공에 적힌 자연수 중 작은 수를 $i$, 큰 수를 $j$라고 하자. (단, $n\ge3$)
- label: ㄴ
  body: |
    제시문 (ㄱ)의 자연수 $i$, $j$에 대하여 $i,\ j-i,\ n-j+1$ 중 가장 작은 수를 확률변수 $X$라고 하자.
stem: |
  제시문 (ㄱ)~(ㄴ)을 읽고 논제에 답하시오. (200점)
subparts:
- id: '1'
  stem: '[논제] (200점) 제시문의 $n$과 확률변수 $X$, $1\le k\le n$인 자연수 $k$에 대하여 확률 $P(X=k)$와 $n=29,30$일 때의 $X$의 기댓값을 각각 구하고 그 근거를 논술하시오.'
  points: 200
  depends_on: []
  answer:
    kind: value
    value: E29=1495/406; E30=110/29
    equivalents:
    - 'n=3m, 3m+1, 3m+2일 때 P(X=k)는 풀이 참조; E(X): n=29이면 1495/406, n=30이면 110/29'
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $i,\ j-i,\ n-j+1$의 합이 $n+1$이므로 $X\le q=\left\lfloor\frac{n+1}{3}\right\rfloor$이다. $X=k<q$인 경우의 수는 $3(n-3k+1)$, $X=q$인 경우의 수는 $n+1$을 3으로 나눈 나머지에 따라 1, 3, 6이므로 $P(X=k)$를 구하고 $n=29,30$에서 $E(X)$를 계산한다.
    steps:
    - id: 1a
      content: $i,\ j-i,\ n-j+1$의 합이 $n+1$이므로 $X\le q=\left\lfloor\frac{n+1}{3}\right\rfloor$이다. $X=k<q$인 경우의 수는 $3(n-3k+1)$, $X=q$인 경우의 수는 $n+1$을 3으로 나눈 나머지에 따라 1, 3, 6이므로 $P(X=k)$를 구하고 $n=29,30$에서 $E(X)$를 계산한다.
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.M4
      - 1.A1
      - 1.A2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 제시문 (ㄴ)의 $i,\ j-i,\ n-j+1$의 총 합은 항상 $n+1$이고, $X$는 세 값 중 가장 작은 수이다. $\dfrac{n+1}{3}$을 넘지 않는 제일 큰 자연수를 $q$라 할 때, 확률변수 $X$가 가질 수 있는 값 $k$의 최댓값은 $q$이며 $X$가 $q<k\le n$인 $k$값을 가질 확률은 0이다.
      source_flow: 37609_ffd2.pdf p.58~60 예시답안
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        (1) $k<q$인 경우

        ① $i$가 최소인 경우 ($i=k$), $j$가 가질 수 있는 모든 가능한 값들의 집합은 $\{2k,\ 2k+1,\ \cdots,\ n-k+1\}$으로 총 $n-3k+2$개다.

        ② $n-j+1$이 최소인 경우 ($j=n-k+1$), $i$가 가질 수 있는 모든 가능한 값들 중 $i$가 최솟값이 되는 경우를 제외한 값들의 집합은 $\{k+1,\ k+2,\ \cdots,\ n-2k+1\}$으로 총 $n-3k+1$개이다.

        ③ $j-i$가 최소인 경우 ($i>k$, $j<n-k+1$), $j-i$의 값이 $k$이 되는 모든 가능한 순서쌍 중에서 $i$, $n-k+1$이 $k$가 되는 경우를 제외한 집합은 $\{(k+1,\ 2k+1),\ \cdots,\ (n-2k,\ n-k)\}$로 $n-3k$개다.

        따라서 $k<q$일 때 $X=k$인 경우의 수의 총 합은 $3(n-3k+1)$이다.
      source_flow: 37609_ffd2.pdf p.58~60 예시답안
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        (2) $k=q$인 경우

        ① $n+1=3q$일 때, $i,\ j-i,\ n-j+1$이 모두 동일하게 $q$인 경우이며, 이때 총 가능한 경우의 수는 1이다.

        ② $n+1=3q+1$일 때, $i,\ j-i,\ n-j+1$ 중 두 값이 동일하게 $q$가 되고, 나머지 하나의 값이 $q+1$이 되는 경우이며, 이때 총 가능한 경우의 수는 3이다.

        ③ $n+1=3q+2$일 때, $i,\ j-i,\ n-j+1$ 중 두 값이 동일하게 $q$가 되고 나머지 하나의 값이 $q+2$가 되는 경우와 두 값이 동일하게 $q+1$이 되고 나머지 하나의 값이 $q$가 되는 경우로, 이때 총 가능한 경우의 수는 6이다.
      source_flow: 37609_ffd2.pdf p.58~60 예시답안
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        제시문 (ㄱ)에 따라 뽑힌 두 자연수 $i$와 $j$의 모든 가능한 순서쌍의 개수는 $\dfrac{n(n-1)}{2}$이므로 1 이상인 자연수 $m$에 대하여 $P(X=k)$는 다음과 같다.

        1) $n=3m$일 때
        $$P(X=k)=\begin{cases}\dfrac{6(n-3k+1)}{n(n-1)} & \left(1\le k\le \frac n3-1\right)\\ \dfrac{6}{n(n-1)} & \left(k=\frac n3\right)\\ 0 & \left(\frac n3<k\le n\right)\end{cases}$$
        2) $n=3m+1$일 때
        $$P(X=k)=\begin{cases}\dfrac{6(n-3k+1)}{n(n-1)} & \left(1\le k\le \frac{n-1}{3}-1\right)\\ \dfrac{12}{n(n-1)} & \left(k=\frac{n-1}{3}\right)\\ 0 & \left(\frac{n-1}{3}<k\le n\right)\end{cases}$$
        3) $n=3m+2$일 때
        $$P(X=k)=\begin{cases}\dfrac{6(n-3k+1)}{n(n-1)} & \left(1\le k\le \frac{n+1}{3}-1\right)\\ \dfrac{2}{n(n-1)} & \left(k=\frac{n+1}{3}\right)\\ 0 & \left(\frac{n+1}{3}<k\le n\right)\end{cases}$$
      source_flow: 37609_ffd2.pdf p.58~60 예시답안
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        $n$이 29일 때의 $X$의 기댓값은,
        $$\begin{aligned}a=E(X)&=\sum_{k=1}^{9}\frac{6(29-3k+1)}{29\times28}\cdot k+10\times\frac{2}{29\times28}\\&=\frac1{29\times28}\left[180\sum_{k=1}^9k-18\sum_{k=1}^9k^2+20\right]=\frac{1495}{406}\end{aligned}$$
      source_flow: 37609_ffd2.pdf p.58~60 예시답안
      criteria:
      - 1.A1
    - id: 1b-6
      content: |
        $n$이 30일 때의 $X$의 기댓값은
        $$\begin{aligned}b=E(X)&=\sum_{k=1}^{9}\frac{6(30+1-3k)}{30\times29}\cdot k+10\times\frac{6}{30\times29}\\&=\frac1{30\times29}\left[186\sum_{k=1}^9k-18\sum_{k=1}^9k^2+60\right]=\frac{110}{29}\end{aligned}$$
      source_flow: 37609_ffd2.pdf p.58~60 예시답안
      criteria:
      - 1.A2
