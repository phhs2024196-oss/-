intent: 사인법칙과 코사인법칙을 이해하고 이를 활용할 수 있는지를 평가하였다. 또한, 삼각함수를 이용한 삼각형의 넓이를 구할 수 있는지를 평가할 수 있도록 하였다.
key_idea: 사인법칙으로 $\sin A=\dfrac a{2R}$, $\sin B=\dfrac b{2R}$, 코사인법칙으로 $\cos C=\dfrac{a^2+b^2-c^2}{2ab}$를 조건 $2\sin A\cos C=\sin B$에 대입하면 $a^2=c^2$, 즉 $a=c$인 이등변삼각형. 이때 $\dfrac{S}{\overline{AB}^2}=\dfrac12\sin B\le\dfrac12$이므로 $M=\dfrac12$ ($B=\dfrac\pi2$).
stuck: 조건식의 $\sin A$, $\sin B$, $\cos C$를 변의 길이로 바꾸는 단계 / $\overline{AB}=\overline{BC}$를 이용해 $\dfrac{S}{\overline{AB}^2}=\dfrac12\sin B$로 줄이는 단계
