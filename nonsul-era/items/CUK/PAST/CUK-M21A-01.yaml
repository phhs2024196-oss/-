stimuli:
- label: ㄱ
  body: |
    [사인법칙] 삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이를 $R$라고 할 때 다음이 성립한다.

    $$\dfrac{a}{\sin A}=\dfrac{b}{\sin B}=\dfrac{c}{\sin C}=2R$$
- label: ㄴ
  body: |
    [코사인법칙] 삼각형 $\mathrm{ABC}$에서 다음이 성립한다.

    $$a^2=b^2+c^2-2bc\cos A$$
    $$b^2=c^2+a^2-2ca\cos B$$
    $$c^2=a^2+b^2-2ab\cos C$$
- label: ㄷ
  body: |
    다음 조건을 만족하는 삼각형 $\mathrm{ABC}$의 넓이 $S$에 대하여 $\dfrac{S}{\overline{\mathrm{AB}}^2}$의 최댓값을 $M$이라 하자.

    $$2\sin A\cos C=\sin B$$
stem: |
  [문항 1] 제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)

  삼각형 $\mathrm{ABC}$에서 세 각 $\angle\mathrm{A}$, $\angle\mathrm{B}$, $\angle\mathrm{C}$의 크기를 각각 $A$, $B$, $C$라 하고 이들의 대변의 길이를 각각 $a$, $b$, $c$라 하자.
subparts:
- id: '1'
  stem: '[논제 1] (20점) 제시문 (ㄷ)의 조건을 만족하는 삼각형 $\mathrm{ABC}$는 어떤 삼각형인지 논술하시오.'
  points: 20
  depends_on: []
  answer:
    kind: value
    value: a = c
    equivalents:
    - a=c\ (A=C\text{인 이등변삼각형})
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\sin A$, $\sin B$를 사인법칙으로, $\cos C$를 코사인법칙으로 바꾸어 조건에 넣으면 $a^2=c^2$, 즉 $a=c$.
    steps:
    - id: 1a
      content: 조건 $\iff a^2=c^2$ → $a=c$인 ($A=C$) 이등변삼각형
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 제시문 (ㄱ)에 의해 $\sin A=\dfrac{a}{2R}$, $\sin B=\dfrac{b}{2R}$이고, 제시문 (ㄴ)에 의해 $\cos C=\dfrac{a^2+b^2-c^2}{2ab}$이다. 따라서, 제시문 (ㄷ)의 조건은 $2\sin A\cos C=\sin B\iff2\cdot\dfrac{a}{2R}\cdot\dfrac{a^2+b^2-c^2}{2ab}=\dfrac{b}{2R}$이므로 $a^2=c^2$이다.
      source_flow: 15739_574a.pdf p.36 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: $a$, $b$, $c$는 삼각형 $\mathrm{ABC}$의 세 변의 길이이므로 $a=c$이고 따라서 삼각형 $\mathrm{ABC}$는 $A=C$인 이등변삼각형이다.
      source_flow: 15739_574a.pdf p.36 예시답안 [논제 1]
      criteria:
      - 1.A1
