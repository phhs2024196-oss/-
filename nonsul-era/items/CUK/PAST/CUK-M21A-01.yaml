    key_idea: $\overline{AB}=\overline{BC}=a$이므로 $\dfrac{S}{\overline{AB}^2}=\dfrac12\sin B\le\dfrac12$, $B=\dfrac\pi2$에서 등호.
    steps:
    - id: 2a
      content: $\dfrac{S}{\overline{AB}^2}=\dfrac12\sin B$ → $M=\dfrac12$
      criteria:
      - 2.M1
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 논제 1에 의해 $\overline{AB}=\overline{BC}=a$이므로 삼각형 $\mathrm{ABC}$의 넓이 $S$는 $S=\dfrac12a^2\sin B$이고 $\dfrac{S}{\overline{AB}^2}=\dfrac12\sin B$이다. (원문은 "$S=\dfrac12a^2\sin B$ 이 $\dfrac{S}{\overline{AB}^2}=\dfrac12\sin B$이다"로 인쇄)
      source_flow: 15739_574a.pdf p.36 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: '한편, $0<A<\pi$이므로 $\dfrac12\sin B$는 $B=\dfrac\pi2$에서 최댓값 $\dfrac12$을 갖는다. 따라서 구하고자 하는 $\dfrac{S}{\overline{AB}^2}$의 최댓값 $M$은 $\dfrac12$이다. (보충: 원문은 "$0<A<\pi$"로 인쇄되어 있으나 $0<B<\pi$의 뜻이며, $B=\dfrac\pi2$이면 $A=C=\dfrac\pi4$로 삼각형이 존재한다.)'
      source_flow: 15739_574a.pdf p.36 예시답안 [논제 2]
      criteria:
      - 2.A1
