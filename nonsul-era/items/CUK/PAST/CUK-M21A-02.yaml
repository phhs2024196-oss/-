stimuli:
- label: ㄱ
  body: |
    [확률의 덧셈정리] 표본공간 $S$의 두 사건 $A$, $B$에 대하여 사건 $A$ 또는 사건 $B$가 일어날 확률은

    $$\mathrm{P}(A\cup B)=\mathrm{P}(A)+\mathrm{P}(B)-\mathrm{P}(A\cap B)$$

    이다. 특히, 두 사건 $A$와 $B$가 서로 배반사건이면 $\mathrm{P}(A\cup B)$는 다음과 같다.

    $$\mathrm{P}(A\cup B)=\mathrm{P}(A)+\mathrm{P}(B)$$
- label: ㄴ
  body: |
    [이산확률변수의 기댓값] 이산확률변수 $X$의 확률질량함수가

    $$\mathrm{P}(X=x_i)=p_i\ (i=1,\ 2,\ \cdots,\ n)$$

    일 때, $X$의 기댓값(평균) $\mathrm{E}(X)$는 다음과 같다.

    $$\mathrm{E}(X)=x_1p_1+x_2p_2+\cdots+x_np_n$$
- label: ㄷ
  body: |
    어떤 주머니에 1 또는 2가 하나씩 적힌 붉은 공과 파란 공이 여러 개 들어 있다. 이 주머니에서 임의로 하나의 공을 꺼내는 시행에서 꺼낸 공이 붉은 공인 사건을 $A$, 꺼낸 공에 적힌 수가 1인 사건을 $B$라고 하고, 꺼낸 공에 적힌 수를 확률변수 $X$라고 하자. 이때 사건 $A$와 $B$, 확률변수 $X$는 다음 조건을 만족시킨다.

    i) 두 사건 $A$, $B$는 서로 독립이다.
    ii) $\mathrm{P}(A)=\dfrac35$
    iii) $\mathrm{E}(X)=\dfrac74$
stem: |
  제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
