intent: 확률의 개념을 알고 이를 구할 수 있는지를 평가할 수 있도록 하였다. 또한 확률의 덧셈정리, 사건의 독립성, 확률변수의 기댓값 등의 개념을 알고 이를 적용할 수 있는지를 평가할 수 있도록 하였다.
key_idea: $X$가 $1,2$를 취하므로 $\mathrm P(X=1)=p$로 두고 $\mathrm E(X)=2-p=\dfrac74$에서 $p=\dfrac14$, 분포는 $\mathrm P(X=1)=\dfrac14$, $\mathrm P(X=2)=\dfrac34$. $\mathrm P(A)=\mathrm P(A\cap B)+\mathrm P(A\cap B^c)$와 독립($\mathrm P(A\cap B)=\mathrm P(A)\mathrm P(B)$)으로 $\mathrm P(A\cap B^c)=\dfrac35\times\dfrac34=\dfrac9{20}$.
