- id: '2'
  stem: '[논제 2] (20점) 제시문 (ㄹ)의 수열 $\{a_n\}$에 대하여 극한값 $\displaystyle\lim_{n\to\infty}a_n$을 구하고 그 근거를 논술하시오.'
