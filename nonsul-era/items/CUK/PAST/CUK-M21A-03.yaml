    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f\left(\left(1+\dfrac1n\right)^n\right)<0<f(e)$와 사잇값 정리, $x\ge e$에서 $f>0$으로 $\left(1+\dfrac1n\right)^n<a_n<e$이고 조임 정리로 $e$.
    steps:
    - id: 2a
      content: $\left(1+\dfrac1n\right)^n<a_n<e$, $\lim\left(1+\dfrac1n\right)^n=e$ → $\lim a_n=e$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $f(x)=x^3-\left(1+\dfrac1n\right)^nx^2+x-e$이라고 하자. (a) 논제 1로부터, $f\left(\left(1+\dfrac1n\right)^n\right)=\left(1+\dfrac1n\right)^{3n}-\left(1+\dfrac1n\right)^{3n}+\left(1+\dfrac1n\right)^n-e<0$이고 $f(e)=e^3-\left(1+\dfrac1n\right)^ne^2+e-e=e^2\left(e-\left(1+\dfrac1n\right)^n\right)>0$. 따라서 사잇값 정리에 의해 방정식 $f(x)=0$은 열린구간 $\left(\left(1+\dfrac1n\right)^n,e\right)$에서 적어도 하나의 실근을 갖는다.
      source_flow: 15739_574a.pdf p.38 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: (b) $x>e$인 모든 실수 $x$에 대하여 $f'(x)=3x^2-2\left(1+\dfrac1n\right)^nx+1=x\left(3x-2\left(1+\dfrac1n\right)^n\right)+1>0$이므로 함수 $f(x)$는 구간 $(e,\infty)$에서 증가한다. 따라서 $x\ge e$인 모든 실수 $x$에 대하여 $f(x)\ge f(e)>0$. 그러므로 방정식 $f(x)=0$은 구간 $(e,\infty)$에서 해를 갖지 않는다.
      source_flow: 15739_574a.pdf p.38 예시답안 [논제 2]
      criteria:
      - 2.M2
    - id: 2b-3
      content: 논제 1과 (a), (b)에 의해서 제시문 (ㄹ)의 수 $a_n$은 다음을 만족한다. $\left(1+\dfrac1n\right)^n<a_n<e$. 한편, $\lim_{n\to\infty}\left(1+\dfrac1n\right)^n=e$이므로 $\lim_{n\to\infty}a_n=e$.
      source_flow: 15739_574a.pdf p.38 예시답안 [논제 2]
      criteria:
      - 2.A1
