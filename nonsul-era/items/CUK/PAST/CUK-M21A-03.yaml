intent: 정적분의 개념을 이용하여 수열의 일반항이 가지는 범위와 극한값을 구할 수 있는지를 평가할 수 있도록 하였다. 또한 함수의 증가, 감소와 사잇값 정리를 이용하여 주어진 방정식의 해의 존재성을 설명할 수 있는지를 평가할 수 있도록 하였다.
key_idea: $g(t)=\dfrac1t$가 감소함수임을 이용해 $\dfrac1{n+1}<\int_1^{1+\frac1n}\dfrac1tdt=\ln\left(1+\dfrac1n\right)<\dfrac1n$을 얻고 $\sqrt e<\left(1+\dfrac1n\right)^n<e$ (명제 $A$는 참). $f(x)=x^3-\left(1+\dfrac1n\right)^nx^2+x-e$는 $f\left(\left(1+\dfrac1n\right)^n\right)<0<f(e)$이므로 구간 $\left(\left(1+\dfrac1n\right)^n,e\right)$에 실근이 있고 $x\ge e$에서는 $f(x)\ge f(e)>0$이므로 $\left(1+\dfrac1n\right)^n<a_n<e$. 따라서 $\lim a_n=e$.
stuck: 감소함수의 직사각형 넓이 비교로 $\ln\left(1+\dfrac1n\right)$의 상하계를 얻는 단계 / $f\left(\left(1+\dfrac1n\right)^n\right)<0$과 $f(e)>0$을 보이고 사잇값 정리를 쓰는 단계 / $x>e$에서 실근이 없음을 증가 함수로 보이는 단계 / 조임 정리
