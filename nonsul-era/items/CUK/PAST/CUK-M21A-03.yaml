    key_idea: $\dfrac1t$의 감소성으로 $\dfrac1{n+1}<\ln\left(1+\dfrac1n\right)<\dfrac1n$을 보이면 $\sqrt e<\left(1+\dfrac1n\right)^n<e$.
    steps:
    - id: 1a
      content: $\dfrac1{n+1}<\ln\left(1+\dfrac1n\right)<\dfrac1n$ → $\dfrac12\le\dfrac n{n+1}<\ln\left(1+\dfrac1n\right)^n<1$, 명제 $A$는 참
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 함수 $g(t)=\dfrac1t$이라고 하면 함수 $g(t)$는 구간 $(0,\infty)$에서 $g(t)>0$이고 감소하므로, 제시문 (ㄱ)과 (ㄴ)에 의해서 $\dfrac1{n+1}=\left(\dfrac1{1+\frac1n}\right)\left(1+\dfrac1n-1\right)<\int_1^{1+\frac1n}\dfrac1t\,dt=\ln\left(1+\dfrac1n\right)<1\times\left(1+\dfrac1n-1\right)=\dfrac1n$
      source_flow: 15739_574a.pdf p.38 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 $\dfrac12\le\dfrac n{n+1}<\ln\left(1+\dfrac1n\right)^n<1\Rightarrow\sqrt e<\left(1+\dfrac1n\right)^n<e$. 그러므로 제시문 (ㄷ)의 명제 $A$는 참이다.
      source_flow: 15739_574a.pdf p.38 예시답안 [논제 1]
      criteria:
