stimuli:
- label: ㄱ
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(x)\ge0$일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.

    $$S=\int_a^bf(x)\,dx$$
- label: ㄴ
  body: |
    양의 실수 $x$에 대하여 다음이 성립한다.

    $$\int_1^x\dfrac1t\,dt=\ln x$$
- label: ㄷ
  body: |
    명제 $A$는 다음과 같다.

    모든 자연수 $n$에 대하여 $\sqrt e<\left(1+\dfrac1n\right)^n<e$이다.
- label: ㄹ
  body: |
    자연수 $n$에 대하여 다음 집합 $B$의 원소 중 가장 큰 수를 $a_n$이라고 하자.

    $$B=\left\{\alpha\mid\alpha\text{는 방정식 }x^3-\left(1+\dfrac1n\right)^nx^2+x-e=0\text{의 실근}\right\}\cup\{\sqrt e\}$$
stem: |
  제시문 (ㄱ)~(ㄹ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (40점)
