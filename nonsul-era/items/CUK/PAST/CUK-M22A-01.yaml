stimuli:
- label: ㄱ
  body: |
    다음 조건을 모두 만족시키는 양수 $a$, $b$, $c$에 대하여 $\dfrac{2\pi}{a}+\dfrac{b}{2\pi}$의 최솟값을 $m$이라 하고, $\dfrac{2\pi}{a}+\dfrac{b}{2\pi}=m$인 $a$, $b$의 값을 각각 $\alpha$, $\beta$라 하자.

    (i) 함수 $y=c\sin(ax)+b$의 최댓값이 $9$이다.
    (ii) 함수 $y=a\cos(bx)+c$의 최댓값이 $8$이다.
- label: ㄴ
  body: |
    제시문 (ㄱ)의 $\alpha$, $\beta$에 대하여 함수 $f(x)$는 다음과 같다.

    $$f(x)=\tan(\alpha x-\beta)$$
- label: ㄷ
  body: |
    제시문 (ㄴ)의 함수 $f(x)$에 대하여 상수 $p$는 다음 조건을 만족시킨다.

    (i) 직선 $x=p$는 함수 $y=f(x)$의 그래프의 한 점근선이다.
    (ii) 함수 $y=f(x)$의 그래프의 임의의 점근선 $x=q$에 대하여 $|p|\le|q|$이다.
stem: |
  제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
subparts:
- id: '1'
  stem: '[논제 1] (15점) 제시문 (ㄱ)의 $m$의 값을 구하고 그 근거를 논술하시오.'
  points: 15
  depends_on: []
  answer:
    kind: value
    value: m = 2 + 1/(2*pi); alpha = 2*pi; beta = 2*pi + 1
    equivalents:
    - m=2+\frac{1}{2\pi},\ \alpha=2\pi,\ \beta=2\pi+1
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $b=a+1$로 줄여 $\dfrac{2\pi}{a}+\dfrac{a}{2\pi}+\dfrac1{2\pi}$에 절대부등식을 적용하면 $m=2+\dfrac1{2\pi}$ (등호 $a=2\pi$).
    steps:
    - id: 1a
      content: $c+b=9$, $a+c=8$ → $b=a+1$, 절대부등식으로 $m=2+\dfrac1{2\pi}$, $\alpha=2\pi$, $\beta=2\pi+1$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 양수 $a$, $b$, $c$에 대해 $y=c\sin(ax)+b$와 $y=a\cos(bx)+c$의 최댓값이 각각 $9$, $8$이므로 $c+b=9$, $a+c=8$이다. 두 식을 연립하면 $b=a+1$이고, $\dfrac{2\pi}{a}+\dfrac{b}{2\pi}=\dfrac{2\pi}{a}+\dfrac{a+1}{2\pi}=\dfrac{2\pi}{a}+\dfrac{a}{2\pi}+\dfrac1{2\pi}$이다.
      source_flow: 16381_0ec6.pdf p.33 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 한편, $a>0$이므로 절대부등식에 의해 $\dfrac{2\pi}{a}+\dfrac{b}{2\pi}=\dfrac{2\pi}{a}+\dfrac{a}{2\pi}+\dfrac1{2\pi}\ge2\sqrt{\dfrac{2\pi}{a}\cdot\dfrac{a}{2\pi}}+\dfrac1{2\pi}=2+\dfrac1{2\pi}$이고, 등호가 성립할 조건은 $\dfrac{2\pi}{a}=\dfrac{a}{2\pi}$이다. 이를 만족하는 $a=2\pi$이고, 이 때의 $b=2\pi+1>0$, $c=8-a=8-2\pi>0$이므로 $m=2+\dfrac1{2\pi}$, $\alpha=2\pi$, $\beta=2\pi+1$이다.
      source_flow: 16381_0ec6.pdf p.33 예시답안 [논제 1]
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 최댓값 조건에서 $c+b=9$, $a+c=8$, $b=a+1$을 얻고 식을 $\dfrac{2\pi}{a}+\dfrac{a}{2\pi}+\dfrac1{2\pi}$로 정리하였다.
      steps:
