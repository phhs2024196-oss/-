      evidence: 절대부등식과 등호조건 $a=2\pi$ (및 $b,c>0$ 확인)로 $m=2+\dfrac1{2\pi}$, $\alpha=2\pi$, $\beta=2\pi+1$을 구하였다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
