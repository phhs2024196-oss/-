- id: '2'
  stem: '[논제 2] (15점) 제시문 (ㄷ)의 $p$의 값을 구하고 그 근거를 논술하시오.'
  points: 15
  depends_on:
  - '1'
  answer:
    kind: value
    value: -1/4 + 1/(2*pi)
    equivalents:
    - p=-\frac14+\frac{1}{2\pi}
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $y=\tan(2\pi x-2\pi-1)$의 점근선 $x=\dfrac n2+\dfrac14+\dfrac1{2\pi}$ 중 절댓값이 최소인 것은 $n=-1$.
    steps:
    - id: 2a
      content: 점근선 $x=\dfrac n2+\dfrac14+\dfrac1{2\pi}$, $\left|\dfrac14+\dfrac1{2\pi}\right|>\left|-\dfrac14+\dfrac1{2\pi}\right|$ → $p=-\dfrac14+\dfrac1{2\pi}$
      criteria:
      - 2.M1
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 논제 1에 의해 $\alpha=2\pi$, $\beta=2\pi+1$이므로 $y=\tan(\alpha x-\beta)=\tan(2\pi x-2\pi-1)$의 점근선은 $x=\dfrac12n+\dfrac14+\dfrac1{2\pi}$ ($n$은 정수)이다.
      source_flow: 16381_0ec6.pdf p.33 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 한편, $n\ge0$일 때 $\dfrac12n+\dfrac14+\dfrac1{2\pi}\ge\dfrac14+\dfrac1{2\pi}>0$이고, $n\le-1$일 때 $\dfrac12n+\dfrac14+\dfrac1{2\pi}\le-\dfrac14+\dfrac1{2\pi}<0$이고, $\left|\dfrac14+\dfrac1{2\pi}\right|>\left|-\dfrac14+\dfrac1{2\pi}\right|$이므로 $p=-\dfrac14+\dfrac1{2\pi}$이다.
      source_flow: 16381_0ec6.pdf p.33 예시답안 [논제 2]
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $\alpha=2\pi$, $\beta=2\pi+1$로 $y=\tan(2\pi x-2\pi-1)$의 점근선 $x=\dfrac12n+\dfrac14+\dfrac1{2\pi}$를 구하였다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: $n\ge0$, $n\le-1$로 나누어 절댓값이 가장 작은 점근선을 찾아 $p=-\dfrac14+\dfrac1{2\pi}$를 구하였다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
