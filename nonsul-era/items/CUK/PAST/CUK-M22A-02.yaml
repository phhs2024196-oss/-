    key_idea: $g'(0)=0$이므로 $g(x)=x^3+\dfrac a2x^2+g(0)$, $x=3$에서 극솟값 $6$이므로 $g'(3)=0$, $g(3)=6$에서 $a=-9$, $g(0)=\dfrac{39}{2}$.
    steps:
    - id: 2a
      content: $g(x)=x^3-\dfrac92x^2+\dfrac{39}{2}$, $g(1)=16$
      criteria:
