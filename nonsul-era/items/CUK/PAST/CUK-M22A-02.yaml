  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 함수 $y=g(|x|)$가 $x=0$에서 미분가능하므로 극한값 $\lim_{x\to0}\dfrac{g(|x|)-g(0)}{x}$가 존재한다. 따라서, 논제 1에 의해 $g'(0)=0$이다. 그런데, $g(x)$는 최고차항의 계수가 $1$인 삼차함수이므로 $g'(x)=3x^2+ax$이다. 즉, $g(x)=x^3+\dfrac a2x^2+g(0)$이다.
      source_flow: 16381_0ec6.pdf p.35 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 함수 $y=g(|x|)$가 $x=3$에서 극솟값을 가지고 $x>0$일 때 $g(|x|)=g(x)$이므로 함수 $y=g(x)$도 $x=3$에서 극솟값을 가진다. 따라서 $g'(3)=0$이고 $g(3)=6$이다. $g'(3)=0$이므로 $a=-9$이다. 따라서 $g(x)=x^3-\dfrac92x^2+g(0)$이고, $g(3)=27\left(1-\dfrac32\right)+g(0)=-\dfrac{27}2+g(0)=6$이므로 $g(0)=\dfrac{39}2$이다.
      source_flow: 16381_0ec6.pdf p.35 예시답안 [논제 2]
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 $g(1)=1-\dfrac92+\dfrac{39}2=16$이다.
      source_flow: 16381_0ec6.pdf p.35 예시답안 [논제 2]
      criteria:
      - 2.A1
