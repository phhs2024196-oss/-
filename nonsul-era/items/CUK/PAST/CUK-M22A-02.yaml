stimuli:
- label: ㄱ
  body: |
    [함수의 극한, 좌극한, 우극한] 함수 $f(x)$의 $x=a$에서의 극한값이 $L$이면, 함수의 극한의 정의에 의하여 $x=a$에서의 좌극한과 우극한이 각각 존재하면서 그 값이 모두 $L$과 같다. 또, 그 역도 성립한다. 즉, 다음이 성립한다.

    $$\lim_{x\to a}f(x)=L\Leftrightarrow\lim_{x\to a+}f(x)=\lim_{x\to a-}f(x)=L$$
- label: ㄴ
  body: |
    [미분계수] 함수 $y=f(x)$에서 $x$의 값이 $a$에서 $a+\Delta x$까지 변할 때의 평균변화율은

    $$\dfrac{\Delta y}{\Delta x}=\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$$

    이다. 여기서 $\Delta x\to0$일 때 이 평균변화율의 극한값

    $$\lim_{\Delta x\to0}\dfrac{\Delta y}{\Delta x}=\lim_{\Delta x\to0}\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$$

    가 존재하면 함수 $y=f(x)$는 $x=a$에서 미분가능하다고 한다. 이 때 이 극한값을 함수 $y=f(x)$의 $x=a$에서의 순간변화율 또는 미분계수라고 하며 이것을 기호 $f'(a)$로 나타낸다.
- label: ㄷ
  body: |
    다항함수 $f(x)$가 다음 조건을 만족시킨다.

    극한값 $\displaystyle\lim_{x\to0}\dfrac{f(|x|)-f(0)}{x}$이 존재한다.
- label: ㄹ
  body: |
    최고차항의 계수가 $1$인 삼차함수 $g(x)$가 다음 조건을 만족시킨다.

    (i) 함수 $y=g(|x|)$는 모든 실수 $x$의 값에서 미분가능하다.
    (ii) 함수 $y=g(|x|)$는 $x=3$에서 극솟값 $6$을 가진다.
