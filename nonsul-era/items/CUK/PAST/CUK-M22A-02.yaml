    method_no: 1
    key_idea: 좌극한은 $-f'(0)$, 우극한은 $f'(0)$이고 둘이 같아야 하므로 $f'(0)=0$.
    steps:
    - id: 1a
      content: 좌극한 $=-f'(0)$, 우극한 $=f'(0)$ → $f'(0)=0$
      criteria:
      - 1.M1
      - 1.M2
