  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 극한값 $\lim_{x\to0}\dfrac{f(|x|)-f(0)}{x}$이 존재하므로 제시문 (ㄱ)에 의해 좌극한 $\lim_{x\to0-}\dfrac{f(|x|)-f(0)}{x}$과 우극한 $\lim_{x\to0+}\dfrac{f(|x|)-f(0)}{x}$이 모두 존재하고, 같은 값을 가진다. 이 때 좌극한은 $\lim_{x\to0-}\dfrac{f(|x|)-f(0)}{x}=\lim_{x\to0-}\dfrac{f(-x)-f(0)}{x}=-\lim_{x\to0-}\dfrac{f(-x)-f(0)}{-x}$이고, 우극한은 $\lim_{x\to0+}\dfrac{f(|x|)-f(0)}{x}=\lim_{x\to0+}\dfrac{f(x)-f(0)}{x}$이다.
      source_flow: 16381_0ec6.pdf p.34 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 그런데 $f(x)$가 다항함수이므로 극한값 $\lim_{x\to0}\dfrac{f(x)-f(0)}{x}$가 존재하고 $f'(0)=\lim_{x\to0}\dfrac{f(x)-f(0)}{x}$이다. 따라서 좌극한은 $\lim_{x\to0-}\dfrac{f(|x|)-f(0)}{x}=\lim_{x\to0-}\dfrac{f(-x)-f(0)}{x}=-\lim_{x\to0-}\dfrac{f(-x)-f(0)}{-x}=-f'(0)$이고, 우극한은 $\lim_{x\to0+}\dfrac{f(|x|)-f(0)}{x}=\lim_{x\to0+}\dfrac{f(x)-f(0)}{x}=f'(0)$이다.
      source_flow: 16381_0ec6.pdf p.34 예시답안 [논제 1]
      criteria:
      - 1.M2
    - id: 1b-3
      content: 그러므로 $-f'(0)=f'(0)$이다. 즉, $f'(0)=0$이다.
      source_flow: 16381_0ec6.pdf p.34 예시답안 [논제 1]
      criteria:
      - 1.A1
