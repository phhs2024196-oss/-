key_idea: $\lim_{x\to0}\dfrac{f(|x|)-f(0)}{x}$가 존재하면 좌극한 $-f'(0)$과 우극한 $f'(0)$이 같으므로 $f'(0)=0$. $y=g(|x|)$가 $x=0$에서 미분가능하므로 $g'(0)=0$, $g(x)=x^3+\dfrac a2x^2+g(0)$이고 $x=3$에서 극솟값 $6$이므로 $g'(3)=0$, $g(3)=6$에서 $a=-9$, $g(0)=\dfrac{39}{2}$, $g(1)=16$.
stuck: 좌극한에서 $f(|x|)=f(-x)$로 바꾸고 $-\dfrac{f(-x)-f(0)}{-x}$ 꼴로 변형하는 단계 / $y=g(|x|)$의 $x=3$ 극값을 $y=g(x)$의 극값으로 옮기는 단계($x>0$에서 $g(|x|)=g(x)$)
