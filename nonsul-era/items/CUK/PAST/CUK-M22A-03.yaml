intent: 정적분의 개념과 수학적 귀납법을 사용할 수 있는지 평가할 수 있도록 하였다.
key_idea: $\int_0^1x^m(1-x)^ndx=\dfrac{m!\,n!}{(m+n+1)!}$를 $n=1$에서 확인하고 $\int_0^1x^m(1-x)^{k+1}dx=\int_0^1x^m(1-x)^kdx-\int_0^1x^{m+1}(1-x)^kdx$로 귀납 단계를 증명한다. 이를 이용해 $\int_0^1x^n(1-x)^n(\cdots)dx=\dfrac{n!\,n!}{(2n+1)!(2n+3)}\left(2n+3+(2n+3)\sqrt3c+\dfrac{27}{20}(n+2)c^2\right)$이고 모든 $c$에서 양수이려면 판별식 $\dfrac{2n+3}{5}(3n-9)<0$, 즉 $n<3$이므로 $A=\{1,2\}$.
stuck: $(1-x)^{k+1}=(1-x)^k(1-x)$로 전개해 귀납가정이 쓰이는 두 적분으로 나누는 단계 / 제시문 (ㄴ)을 세 번($m=n,n+1,n+2$) 적용해 이차식으로 정리하는 단계 / 모든 $c$에 대해 양수일 조건을 판별식으로 바꾸는 단계
