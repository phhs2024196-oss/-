stimuli:
- label: ㄱ
  body: |
    [수학적 귀납법] 자연수 $n$에 대한 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.

    (i) $n=1$일 때 명제 $p(n)$이 성립한다.
    (ii) $n=k$일 때 명제 $p(n)$이 성립한다고 가정하면 $n=k+1$일 때도 명제 $p(n)$이 성립한다.
- label: ㄴ
  body: |
    자연수 $n$에 대한 명제 $p(n)$은 다음과 같다.

    모든 자연수 $m$에 대하여 $\displaystyle\int_0^1x^m(1-x)^n\,dx=\dfrac{m!\,n!}{(m+n+1)!}$이다.
- label: ㄷ
  body: |
    모든 실수 $c$에 대하여 다음의 부등식을 만족시키는 자연수 $n$의 집합을 $A$라고 하자.

    $$\int_0^1x^n(1-x)^n\left(1+2\sqrt3\,cx+\dfrac{27}{10}c^2x^2\right)dx>0$$
stem: |
  제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (40점)
subparts:
- id: '1'
  stem: '[논제 1] (20점) 제시문 (ㄴ)의 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 수학적 귀납법으로 증명하시오.'
  points: 20
  depends_on: []
  answer:
    kind: proof
    value: 명제 p(n)이 모든 자연수 n에 대하여 성립함(수학적 귀납법으로 증명)
    equivalents:
    - \int_0^1x^m(1-x)^ndx=\frac{m!\,n!}{(m+n+1)!}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $n=1$에서 직접 계산하고, $n=k+1$에서 $(1-x)^{k+1}=(1-x)^k(1-x)$로 나누어 귀납가정을 두 번 적용한다.
    steps:
    - id: 1a
      content: (i) $n=1$ 성립, (ii) $\int x^m(1-x)^{k+1}=\int x^m(1-x)^k-\int x^{m+1}(1-x)^k$로 $n=k+1$ 성립
      criteria:
      - 1.M1
      - 1.M2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: (i) $n=1$일 때, $\int_0^1x^m(1-x)dx=\int_0^1x^mdx-\int_0^1x^{m+1}dx=\dfrac1{m+1}-\dfrac1{m+2}=\dfrac1{(m+1)(m+2)}=\dfrac{m!\,1!}{(m+2)!}$이므로 $p(n)$은 성립한다.
      source_flow: 16381_0ec6.pdf p.36 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: (ii) $n=k$일 때 $p(n)$이 성립한다고 가정하면 $\int_0^1x^m(1-x)^{k+1}dx=\int_0^1x^m(1-x)^k(1-x)dx=\int_0^1x^m(1-x)^kdx-\int_0^1x^{m+1}(1-x)^kdx=\dfrac{m!\,k!}{(m+k+1)!}-\dfrac{(m+1)!\,k!}{(m+k+2)!}=\dfrac{m!\,k!}{(m+k+2)!}(m+k+2-m-1)=\dfrac{m!\,(k+1)!}{(m+k+2)!}$이므로 $n=k+1$일 때도 성립한다. 따라서, 모든 자연수 $n$에 대하여 $p(n)$은 성립한다.
      source_flow: 16381_0ec6.pdf p.36 예시답안 [논제 1]
      criteria:
      - 1.M2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: $n=1$일 때 $p(n)$이 성립함을 보였다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 14
      evidence: $n=k$일 때의 가정을 이용해 $n=k+1$일 때 성립함을 보이고 결론을 서술하였다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: '[논제 2] (20점) 제시문 (ㄷ)의 집합 $A$를 구하고 그 과정을 논술하시오.'
  points: 20
  depends_on:
  - '1'
  answer:
    kind: set
    value: A = {1, 2}
    equivalents:
    - A=\{1,2\}
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (ㄴ)의 공식으로 적분을 $c$에 대한 이차식으로 정리하고 모든 $c$에서 양수이려면 판별식 $<0$, 즉 $n<3$.
    steps:
    - id: 2a
      content: $c$에 대한 이차식의 판별식 $\dfrac{2n+3}{5}(3n-9)<0$ → $n<3$, $A=\{1,2\}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 제시문 (ㄴ)의 적분식을 이용하여 제시문 (ㄷ)의 적분을 계산하면, $\int_0^1x^n(1-x)^n\left(1+2\sqrt3\,cx+\dfrac{27}{10}c^2x^2\right)dx=\int_0^1x^n(1-x)^ndx+2\sqrt3\,c\int_0^1x^{n+1}(1-x)^ndx+\dfrac{27}{10}c^2\int_0^1x^{n+2}(1-x)^ndx=\dfrac{n!\,n!}{(2n+1)!}+2\sqrt3\dfrac{(n+1)!\,n!}{(2n+2)!}c+\dfrac{27}{10}\dfrac{(n+2)!\,n!}{(2n+3)!}c^2=\dfrac{n!\,n!}{(2n+1)!(2n+3)}\left(2n+3+(2n+3)\sqrt3\,c+\dfrac{27}{20}(n+2)c^2\right)$을 얻는다.
      source_flow: 16381_0ec6.pdf p.37 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서 제시문 (ㄷ)의 부등식은 위 괄호안의 $c$에 대한 이차식이 양수이어야 한다는 것과 동치이다. $c^2$항의 계수가 양수이므로, 판별식이 음수가 되어야 한다. 판별식은 $3(2n+3)^2-\dfrac{27}5(2n+3)(n+2)=\dfrac{2n+3}5(15(2n+3)-27(n+2))=\dfrac{2n+3}5(3n-9)$이므로, $n<3$이 되어야 조건을 만족시킨다.
      source_flow: 16381_0ec6.pdf p.37 예시답안 [논제 2]
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 제시문 (ㄷ)의 집합 $A$는 $\{1,2\}$이다.
      source_flow: 16381_0ec6.pdf p.37 예시답안 [논제 2]
      criteria:
      - 2.A1
