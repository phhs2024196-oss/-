key_idea: 두 대칭축 $y=x-3$, $y=-x+5$의 교점 $(4,1)$이 점근선의 교점이므로 $f(x)=\dfrac{k}{x-4}+1$, $(13,2)$에서 $k=9$, 즉 $a=-4$, $b=1$, $c=5$. $\overline{PQ}+\overline{PR}=|x-4|+\dfrac{9}{|x-4|}\ge6$ (등호 $|x-4|=3$)이므로 최솟값 $6$.
stuck: 유리함수 그래프의 대칭축 두 개의 교점이 점근선의 교점임을 알아보는 단계 / 두 수선의 길이 합을 $|x-4|+\dfrac{9}{|x-4|}$로 바꾸어 산술·기하평균을 쓰는 단계 / 등호 성립점이 곡선 위에 있음을 확인하는 단계
