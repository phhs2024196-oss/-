    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overline{PQ}+\overline{PR}=|x-4|+\dfrac{9}{|x-4|}$에 절대부등식을 적용하면 최솟값 $6$.
    steps:
    - id: 2a
      content: $|x-4|+\dfrac{9}{|x-4|}\ge6$, 등호 $|x-4|=|y-1|=3$ → 최솟값 $6$
      criteria:
      - 2.M1
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: '곡선 $y=f(x)$ 위의 한 점 $\mathrm P(x,y)$에서 점근선 $y=1$에 내린 수선의 발은 $\mathrm Q$, 점근선 $x=4$에 내린 수선의 발은 $\mathrm R$이다. $\overline{PQ}=|x-4|$, $\overline{PR}=|y-1|$이고, $\mathrm P(x,y)$는 곡선 $y=f(x)$ 위의 점이므로 논제 1에 의해 다음을 만족시킨다. $y-1=\dfrac{9}{x-4}$ (보충: 정의상 $\overline{PQ}=|y-1|$, $\overline{PR}=|x-4|$이나 두 길이의 합은 같다. 원문 표기 그대로 옮김)'
      source_flow: 17901_89a0.pdf p.30 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: $\overline{PQ}$와 $\overline{PR}$는 양수이므로, 절대부등식에 의해 $\overline{PQ}+\overline{PR}=|x-4|+|y-1|=|x-4|+\dfrac{9}{|x-4|}\ge2\sqrt{|x-4|\cdot\dfrac{9}{|x-4|}}=6$이고, 등호조건 $|x-4|=|y-1|=3$을 만족하는 점 $\mathrm P(x,y)$가 곡선 $y=f(x)$ 위에 있으므로 $\overline{PQ}+\overline{PR}$의 최솟값은 $6$이다.
      source_flow: 17901_89a0.pdf p.30 예시답안 [논제 2]
      criteria:
      - 2.A1
