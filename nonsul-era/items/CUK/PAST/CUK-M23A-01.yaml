  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 대칭축의 교점 $(4,1)$이 점근선의 교점이므로 $f(x)=\dfrac{k}{x-4}+1$, $f(13)=2$에서 $k=9$.
    steps:
    - id: 1a
      content: 점근선 $x=4$, $y=1$, $k=9$, $f(x)=\dfrac{x+5}{x-4}$ → $a=-4$, $b=1$, $c=5$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 제시문 (ㄱ)의 조건 (2), (3)에 의해 직선 $y=x-3$과 직선 $y=-x+5$의 교점인 $(4,1)$이 두 점근선의 교점이므로, 점근선은 $x=4$, $y=1$이다.
      source_flow: 17901_89a0.pdf p.30 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서, 어떤 상수 $k$에 대하여 $f(x)=\dfrac{k}{x-4}+1$로 쓸 수 있고, 제시문 (ㄱ)의 조건 (1)에 의해 $2=f(13)=\dfrac{k}{13-4}+1$을 만족하므로 $k=9$임을 알 수 있다. 따라서, $f(x)=\dfrac{9}{x-4}+1=\dfrac{x+5}{x-4}$이고, $a=-4$, $b=1$, $c=5$이다.
      source_flow: 17901_89a0.pdf p.30 예시답안 [논제 1]
      criteria:
      - 1.A1
