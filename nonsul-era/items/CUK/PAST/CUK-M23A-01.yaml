- id: '2'
  stem: '[논제 2] (20점) 제시문 (ㄷ)의 점 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$에 대하여 $\overline{\mathrm{PQ}}+\overline{\mathrm{PR}}$의 최솟값을 구하고 그 근거를 논술하시오.'
