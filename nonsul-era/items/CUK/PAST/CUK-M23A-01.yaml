stimuli:
- label: ㄱ
  body: |
    상수 $a$, $b$, $c$에 대하여 함수 $f(x)=\dfrac{bx+c}{x+a}$는 다음을 만족한다.

    (1) 함수 $y=f(x)$의 그래프는 점 $(13,2)$를 지난다.
    (2) 함수 $y=f(x)$의 그래프는 직선 $y=x-3$에 대하여 대칭이다.
    (3) 함수 $y=f(x)$의 그래프는 직선 $y=-x+5$에 대하여 대칭이다.
- label: ㄴ
  body: |
    함수 $y=f(x)$의 그래프에 대하여 $x$축에 평행한 점근선을 $l$, $y$축에 평행한 점근선을 $m$이라고 하자.
- label: ㄷ
  body: |
    함수 $y=f(x)$의 그래프 위의 점 $\mathrm{P}$에서 직선 $l$에 내린 수선의 발을 $\mathrm{Q}$, 직선 $m$에 내린 수선의 발을 $\mathrm{R}$이라고 하자.
stem: |
  제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
