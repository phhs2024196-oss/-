    - id: 2b-2
      content: $S$는 다음과 같이 계산할 수 있다. $S=\sum_{n=1}^{10}(1-2(-1)^nn^2)=10+2\sum_{k=1}^{5}\left((2k-1)^2-(2k)^2\right)=10+2\sum_{k=1}^{5}(-4k+1)=20-8\times\dfrac{5\times6}{2}=-100$
      source_flow: 17901_89a0.pdf p.31 예시답안 [논제 2]
