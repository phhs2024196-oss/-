  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=3(-1)^n(x-(1-2n^2))(x-(1+2n^2))$이고 $n$의 홀짝에 따라 최고차항의 부호가 달라지므로 $a_n=1-2(-1)^nn^2$.
    steps:
    - id: 1a
      content: $n$ 홀수 $a_n=1+2n^2$, $n$ 짝수 $a_n=1-2n^2$ → $a_n=1-2(-1)^nn^2$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 제시문 (ㄱ)에서 주어진 함수 $f(x)$의 도함수는 $f'(x)=(-1)^n(3x^2-6x+3-12n^4)$이고 인수분해하면 $f'(x)=3(-1)^n(x-(1-2n^2))(x-(1+2n^2))$이다.
      source_flow: 17901_89a0.pdf p.31 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 이 때 $1-2n^2<1+2n^2$이므로, $n$이 홀수이면 최고차항이 음수가 되어 $f(x)$는 $x=1+2n^2$에서 극대이고, $n$이 짝수이면 최고차항이 양수가 되어 $f(x)$는 $x=1-2n^2$에서 극대이다. 그러므로 일반항은 $a_n=1-2(-1)^nn^2$이다.
      source_flow: 17901_89a0.pdf p.31 예시답안 [논제 1]
      criteria:
      - 1.A1
