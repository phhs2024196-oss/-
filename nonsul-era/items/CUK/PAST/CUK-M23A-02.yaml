stimuli:
- label: ㄱ
  body: |
    수열 $\{a_n\}$의 일반항 $a_n$은 다음을 만족한다. (단, $n$은 자연수)

    함수 $f(x)=(-1)^n(x^3-3x^2+3x-12n^4x+2)$는 $x=a_n$에서 극대이다.
- label: ㄴ
  body: |
    수열 $\{a_n\}$의 첫째항부터 제10항까지의 합을 $S$라고 하자.

    $$S=\sum_{n=1}^{10}a_n$$
stem: |
