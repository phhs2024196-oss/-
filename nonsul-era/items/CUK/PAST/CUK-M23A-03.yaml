stimuli:
- label: ㄱ
  body: |
    다항함수 $f$, $g$는 다음과 같이 정의된다.

    $$f(x)=x^3+x^2+5x-7$$
    $$g(x)=2x^2-x-1$$
- label: ㄴ
  body: |
    실수 $a$에 대하여 다항함수 $h$는 다음과 같이 정의된다.

    $$h(x)=f(x)-a\,g(x)$$
- label: ㄷ
  body: |
    방정식 $h(x)=0$이 서로 다른 세 실근을 가지도록 하는 모든 실수 $a$의 집합을 $A$라고 하자.
- label: ㄹ
  body: |
    실수 $a$의 값이 정해졌을 때, 방정식 $h(x)=0$의 가장 작은 실근을 $\alpha$, 가장 큰 실근을 $\beta$라고 하자.
stem: |
  제시문 (ㄱ)~(ㄹ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (40점)
subparts:
- id: '1'
  stem: '[논제 1] (20점) 제시문 (ㄷ)의 집합 $A$를 구하고 그 근거를 논술하시오.'
  points: 20
  depends_on: []
  answer:
    kind: set
    value: A = {a | a<-2 or 3<a<10/3 or a>10/3}
    equivalents:
    - A=\left\{a\mid a<-2\text{ or }3<a<\frac{10}{3}\text{ or }\frac{10}{3}<a\right\}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $h(x)=(x-1)(x^2+2(1-a)x+7-a)$에서 $k(1)\ne0$, 판별식 $>0$을 모두 만족하는 $a$를 구한다.
    steps:
    - id: 1a
      content: $a\ne\dfrac{10}{3}$, $(a+2)(a-3)>0$ → $A=\{a\mid a<-2,\ 3<a<\dfrac{10}{3},\ a>\dfrac{10}{3}\}$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(1)=g(1)=0$이므로 실수 $a$의 값에 관계없이 $h(x)$는 $(x-1)$을 인수로 갖는다. $h(x)=(x-1)(x^2+2x+7-a(2x+1))=(x-1)(x^2+2(1-a)x+7-a)$로 인수분해하고, 편의상 $k(x)=x^2+2(1-a)x+7-a$라고 하자. 이제 이차방정식 $k(x)=0$이 $1$을 근으로 갖지 않으면서 서로 다른 두 실근을 갖도록 하는 모든 실수 $a$를 구하면 된다.
      source_flow: 17901_89a0.pdf p.32 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: $k(1)=10-3a\ne0$이므로 $a\ne\dfrac{10}{3}$이다. 판별식 $(1-a)^2-7+a=a^2-a-6=(a+2)(a-3)$이 양수이므로 $a<-2$ or $a>3$이다. 따라서, $A=\left\{a\mid a<-2\text{ or }3<a<\dfrac{10}{3}\text{ or }\dfrac{10}{3}<a\right\}$이다.
      source_flow: 17901_89a0.pdf p.32 예시답안 [논제 1]
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: $h(x)=(x-1)k(x)$로 인수분해하고 $k(x)=0$이 $1$을 근으로 갖지 않으면서 서로 다른 두 실근을 갖는 조건으로 바꾸었다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: $k(1)\ne0$과 판별식 $>0$을 모두 풀어 $A$를 구하였다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: '[논제 2] (20점) 방정식 $h(x)=0$이 중근을 가지도록 하는 모든 실수 $a$에 대하여 $\int_{\alpha}^{\beta}|g(x)|\,dx$의 최솟값을 구하고 그 근거를 논술하시오.'
  points: 20
  depends_on:
  - '1'
  answer:
    kind: value
    value: 13/6
    equivalents:
    - \frac{13}{6}
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 중근이 되는 $a=-2,3,\dfrac{10}{3}$의 $[\alpha,\beta]$를 구하고 $|g|$의 적분을 비교하면 $a=3$, $[1,2]$에서 $\dfrac{13}{6}$.
    steps:
    - id: 2a
      content: $[1,2]\subset[1,\tfrac{11}{3}]$, $\int_{-3}^{1}|g|>\int_{1}^{2}|g|$ → 최솟값 $\int_1^2(2x^2-x-1)dx=\dfrac{13}{6}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 논제 1에 의해 방정식 $h(x)=0$이 중근을 갖도록 하는 실수 $a$는 $-2$, $3$, $\dfrac{10}{3}$ 이렇게 세 개가 있다. $a=-2$이면 $\alpha=-3$, $\beta=1$이고, $a=3$이면 $\alpha=1$, $\beta=2$이고, $a=\dfrac{10}{3}$이면 $\alpha=1$, $\beta=\dfrac{11}{3}$이다.
      source_flow: 17901_89a0.pdf p.33 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 우선 $\int_1^2|g(x)|dx<\int_1^{\frac{11}{3}}|g(x)|dx$임은 당연하다. $g(x)=(x-1)(2x+1)$이므로 $x>1$ 혹은 $x<-\dfrac12$이면 $|g(x)|=g(x)$이다.
      source_flow: 17901_89a0.pdf p.33 예시답안 [논제 2]
      criteria:
      - 2.M2
    - id: 2b-3
      content: 또한, 이차함수가 축에 대하여 대칭이라는 사실과 $-\dfrac12-(-3)>2-1$이라는 사실로부터 $\int_{-3}^{1}|g(x)|dx>\int_{-3}^{-\frac12}|g(x)|dx>\int_1^2|g(x)|dx$임을 알 수 있다. 따라서 최솟값은 $\int_1^2|g(x)|dx=\int_1^2(2x^2-x-1)dx=\dfrac23\times(8-1)-\dfrac12\times(4-1)-1=\dfrac{13}{6}$이다.
      source_flow: 17901_89a0.pdf p.33 예시답안 [논제 2]
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: 중근을 갖는 $a=-2,3,\dfrac{10}{3}$과 각각의 $\alpha$, $\beta$를 구하였다.
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: $g(x)=(x-1)(2x+1)$의 부호로 $a=3$이 $a=\dfrac{10}{3}$보다 작음을 보였다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: 이차함수의 대칭성으로 $a=-2$인 경우보다 작음을 보이고 최솟값 $\dfrac{13}{6}$을 계산하였다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
