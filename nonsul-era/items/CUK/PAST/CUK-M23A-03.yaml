intent: 인수분해를 이용해 함수의 근을 찾고 이를 활용할 수 있는지를 평가할 수 있도록 하였다. 또한 함수를 적분하고 이를 활용할 수 있는지를 평가할 수 있도록 하였다.
key_idea: $f(1)=g(1)=0$이므로 $h(x)=(x-1)k(x)$, $k(x)=x^2+2(1-a)x+7-a$. $k$가 $1$을 근으로 갖지 않고 서로 다른 두 실근을 가지려면 $a\ne\dfrac{10}{3}$, $(a+2)(a-3)>0$이므로 $A$는 $a<-2$ 또는 $3<a<\dfrac{10}{3}$ 또는 $a>\dfrac{10}{3}$. 중근을 갖는 $a=-2,3,\dfrac{10}{3}$에서 $\int_\alpha^\beta|g|dx$를 비교하면 최솟값은 $a=3$일 때 $\dfrac{13}{6}$.
stuck: 공통인수 $(x-1)$을 찾아 이차식 $k(x)$의 근 조건으로 바꾸는 단계 / $k(1)=0$이 되는 $a=\dfrac{10}{3}$을 제외하는 단계 / 세 경우의 적분값을 직접 계산하지 않고 대칭성으로 비교하는 단계
