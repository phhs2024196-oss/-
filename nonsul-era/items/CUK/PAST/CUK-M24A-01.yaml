stimuli:
- label: ㄱ
  body: |
    중심이 $\mathrm{O}$이고 반지름이 $2$인 원에 내접하는 삼각형 $\mathrm{ABC}$는 다음을 만족시킨다.

    $$4\sin B\sin(A+C)=3$$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 삼각형 $\mathrm{ABC}$에 대하여 점 $\mathrm{D}$가 다음을 만족시킬 때, 삼각형 $\mathrm{ACD}$의 둘레의 길이를 $L$이라고 하자.

    (가) 점 $\mathrm{D}$는 제시문 (ㄱ)의 원 위의 점이다.
    (나) 삼각형 $\mathrm{ACD}$의 넓이는 삼각형 $\mathrm{AOC}$의 넓이의 $3$배이다.
stem: |
  제시문 (ㄱ)~(ㄴ)을 읽고 문제(논제 1)에 답하시오. (30점)
subparts:
- id: '1'
  stem: '[논제 1] (30점) 제시문 (ㄴ)의 $L$[판독확인: 원문에는 기호 $L$이 인쇄되지 않고 "제시문 (ㄴ)의 의 값을"로 보임]의 값을 구하고 그 근거를 논술하시오.'
  points: 30
  depends_on: []
  answer:
    kind: value
    value: 6*sqrt(3)
    equivalents:
    - L=6\sqrt{3}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\sin B=\dfrac{\sqrt3}{2}$, $\overline{AC}=2\sqrt3$, $\overline{OH}=1$로부터 $\triangle ACD$는 한 변이 $2\sqrt3$인 정삼각형이 되어 $L=6\sqrt3$.
    steps:
    - id: 1a
      content: $\sin B=\dfrac{\sqrt3}{2}$, $\overline{AC}=2\sqrt3$, $\overline{OH}=1$, 높이 $3$인 정삼각형 $\triangle ACD$, $L=6\sqrt3$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $\sin(A+C)=\sin(\pi-B)=\sin B$이므로 $4\sin B\sin(A+C)=3\iff4\sin B\sin B=3\Rightarrow\sin B=\dfrac{\sqrt3}{2}$ ($\because B<\pi$)이고, 주어진 원의 반지름이 $R=2$이므로 사인법칙에 의해 $\dfrac{\overline{AC}}{\sin B}=2R=4\iff\overline{AC}=4\sin B=2\sqrt3$이다.
      source_flow: 30916_97a9.pdf p.32 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 원의 중심 $\mathrm O$에서 삼각형 $\mathrm{AOC}$의 밑변 $\overline{AC}$에 내린 수선의 발을 $\mathrm H$라 할 때, 삼각형 $\mathrm{AOC}$의 높이 $\overline{OH}$는 피타고라스 정리에 의해 $\overline{OH}^2=\overline{AO}^2-\overline{AH}^2=1\iff\overline{OH}=1$이다. 제시문 (ㄴ)에 의해 삼각형 $\mathrm{ADC}$의 넓이는 삼각형 $\mathrm{AOC}$의 넓이의 $3$배이므로 삼각형 $\mathrm{ADC}$의 높이는 삼각형 $\mathrm{AOC}$의 높이의 $3$배인 $3$이어야 하고 원의 반지름이 $2$이므로 점 $\mathrm D$는 $\overline{AC}$의 수직 이등분선이 원과 만나는 점이어야 한다.
      source_flow: 30916_97a9.pdf p.32 예시답안 [논제 1]
      criteria:
      - 1.M2
    - id: 1b-3
      content: '따라서, 삼각형 $\mathrm{ADC}$는 높이가 $3$인 정삼각형이므로 구하고자 하는 삼각형 $\mathrm{ADC}$의 둘레의 길이는 $6\sqrt3$이다. (보충: 밑변 $2\sqrt3$, 높이 $3$이므로 $\overline{AD}=\overline{CD}=\sqrt{3+9}=2\sqrt3$)'
      source_flow: 30916_97a9.pdf p.32 예시답안 [논제 1]
      criteria:
      - 1.A1
