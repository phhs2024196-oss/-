stuck: 넓이 조건을 높이 조건($\triangle ACD$의 높이 $=3\times\triangle AOC$의 높이)으로 바꾸는 단계 / 높이 $3$인 점 $\mathrm D$가 원 위에서 유일함(수직이등분선과 원의 교점)을 판단하는 단계
