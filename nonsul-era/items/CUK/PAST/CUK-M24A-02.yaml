subparts:
- id: '1'
  stem: '[논제 1] (15점) 제시문 (ㄱ)의 함수 $f(x)$를 구하고 그 근거를 논술하시오.'
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: x**3-6*x**2+10*x
    equivalents:
    - f(x)=x^3-6x^2+10x
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $h=f-x$를 $x^2(x-\alpha)$, $x(x-\alpha)^2$로 나누어 $f'(1)=1$과 극값 조건을 확인하면 $f(x)=x^3-6x^2+10x$.
    steps:
    - id: 1a
      content: $h(x)=x^2(x-\alpha)$는 $\alpha=\dfrac32$로 극값 없음, $h(x)=x(x-\alpha)^2$는 $\alpha=3$만 극값 가짐 → $f(x)=x^3-6x^2+10x$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $h(x)=f(x)-x$라 하자. $h(0)=f(0)-0=0$이고 방정식 $h(x)=f(x)-x=0$의 서로 다른 실근의 개수는 $2$이므로 $h(x)=x^2(x-\alpha)$ 또는 $h(x)=x(x-\alpha)^2$이다. (단, $\alpha\ne0$)
      source_flow: 30916_97a9.pdf p.33 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: '1) $h(x)=x^2(x-\alpha)$인 경우: $f(x)=x^2(x-\alpha)+x$이고 $f''(x)=3x^2-2\alpha x+1$이다. 따라서 $1=f''(1)=4-2\alpha$, 즉 $\alpha=\dfrac32$이다. $f''(x)=3x^2-3x+1$에서 $D/4=9-12<0$이므로 모든 실수 $x$에 대하여 $f''(x)>0$이다. 즉 $f(x)$는 극값을 갖지 않는다. (보충: 원문 표기 그대로이며 판별식은 $D=9-12=-3<0$)'
      source_flow: 30916_97a9.pdf p.33 예시답안 [논제 1]
      criteria:
      - 1.M2
    - id: 1b-3
      content: '2) $h(x)=x(x-\alpha)^2$인 경우: $f(x)=x(x-\alpha)^2+x$이고 $f''(x)=3x^2-4\alpha x+\alpha^2+1$이다. 따라서 $1=f''(1)=\alpha^2-4\alpha+4$, 즉 $(\alpha-1)(\alpha-3)=0$이다. (i) $\alpha=1$인 경우: $f''(x)=3x^2-4x+2$에서 $D/4=4-6<0$이므로 $f(x)$는 극값을 갖지 않는다. (ii) $\alpha=3$인 경우: $f''(x)=3x^2-12x+10$에서 $D/4=36-30>0$이므로 $f(x)$는 극값을 가진다. 따라서 $f(x)=x^3-6x^2+10x$이다.'
      source_flow: 30916_97a9.pdf p.33 예시답안 [논제 1]
      criteria:
      - 1.A1
