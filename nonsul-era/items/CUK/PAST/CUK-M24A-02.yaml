stimuli:
- label: ㄱ
  body: |
    최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.

    (가) $f(0)=0$, $f'(1)=1$
    (나) 방정식 $f(x)-x=0$의 서로 다른 실근의 개수는 $2$이다.
    (다) 함수 $f(x)$는 극값을 가진다.
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$와 양의 실수 $a$, $b$에 대하여 함수 $g(x)$는 다음 조건을 만족시킨다.

    (가) $x\le a$일 때 $g(x)=f(x)$이고
    $x>a$일 때 $g(x)=f(x+b)$이다.
    (나) 함수 $g(x)$는 실수 전체의 집합에서 미분가능하다.
stem: |
