- id: '2'
  stem: '[논제 2] (15점) 제시문 (ㄴ)의 $a$, $b$의 값을 구하고 그 근거를 논술하시오.'
  points: 15
  depends_on:
  - '1'
  answer:
    kind: value
    value: a = 2 - sqrt(2); b = 2*sqrt(2)
    equivalents:
    - a=2-\sqrt2,\ b=2\sqrt2
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g$가 $x=a$에서 연속·미분가능이면 $f(a)=f(a+b)$, $f'(a)=f'(a+b)$이고 $2a+b=4$, $a<2$, 방정식 $a^2-4a+2=0$으로 $a=2-\sqrt2$, $b=2\sqrt2$.
    steps:
    - id: 2a
      content: $f'(a)=f'(a+b)\Rightarrow 2a+b=4$, $f(a)=f(a+b)\Rightarrow a^2-4a+2=0$, $a<2$ → $a=2-\sqrt2$, $b=2\sqrt2$
      criteria:
      - 2.M1
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 제시문 (ㄴ)의 함수 $g(x)$가 $x=a$에서 미분가능하므로 $\lim_{x\to a-}g(x)=\lim_{x\to a+}g(x)$이고 $\lim_{x\to a-}\dfrac{g(x)-g(a)}{x-a}=\lim_{x\to a+}\dfrac{g(x)-g(a)}{x-a}$이다. $\lim_{x\to a-}g(x)=f(a)$, $\lim_{x\to a+}g(x)=f(a+b)$이므로 $f(a)=f(a+b)$이고, $\lim_{x\to a-}\dfrac{g(x)-g(a)}{x-a}=f'(a)$, $\lim_{x\to a+}\dfrac{g(x)-g(a)}{x-a}=\lim_{x\to a+}\dfrac{f(x+b)-f(a+b)}{(x+b)-(a+b)}=f'(a+b)$이므로 $f'(a)=f'(a+b)$이다.
      source_flow: 30916_97a9.pdf p.34 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 이차방정식 $f'(x)=f'(a)$의 서로 다른 두 실근이 $a$, $a+b$이고 $f'(x)=3x^2-12x+10$이므로 근과 계수의 관계로부터 두 근 $a$, $a+b$의 합은 $2a+b=4$, 즉 $a+b=4-a$이다. 그런데 $b$가 양수이므로 $a<a+b=4-a$, 즉 $a<2$이다. $f(x)-f(a)=(x-a)(x^2+(a-6)x+a^2-6a+10)$이고 $a+b=4-a$가 방정식 $f(x)-f(a)=0$의 한 근이므로 $(4-a)^2+(a-6)(4-a)+a^2-6a+10=0$이다. 즉, $a^2-4a+2=0$이므로 $a=2\pm\sqrt2$이다. $a<2$이므로 $a=2-\sqrt2$이고 $b=4-2a=2\sqrt2$이다. 따라서 $a=2-\sqrt2$, $b=2\sqrt2$이다.
      source_flow: 30916_97a9.pdf p.34 예시답안 [논제 2]
      criteria:
      - 2.A1
