    - id: 1.A1
      mark_type: A
      points: 8
      evidence: $h(x)=x(x-\alpha)^2$인 경우를 $\alpha=1,3$으로 나누어 판단하고 $f(x)=x^3-6x^2+10x$를 구하였다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
