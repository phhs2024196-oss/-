  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $c_n=-24+10K-6n$ ($n\ge K$)과 $c_{19}\ge0\ge c_{20}$으로 $K=14$, $S_{19}=S_{13}+(S_{19}-S_{13})=154$.
    steps:
    - id: 2a
      content: $K=14$, $S_{19}=52+102=154$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 논제 1로부터 $c_1,\cdots,c_K$는 공차가 $4$인 등차수열을 이루고, $c_K,c_{K+1},\cdots$은 공차가 $-6$인 등차수열을 이루므로 $n\ge K$를 만족하는 $n$에 대하여 $c_n=c_K+(n-K)d_2=-20+4(K-1)-6(n-K)=-24+10K-6n$이다.
      source_flow: 30916_97a9.pdf p.35 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: $c_{19}\ge0$, $c_{20}\le0$이므로 $K\ge13.8$, $K\le14.4$ 따라서 $K=14$이다.
      source_flow: 30916_97a9.pdf p.35 예시답안 [논제 2]
      criteria:
      - 2.M2
    - id: 2b-3
      content: 이때 $S_{19}=S_{13}+(S_{19}-S_{13})=\dfrac{13\times(-40+4\times12)}{2}+\dfrac{6\times(64+5\times(-6))}{2}=52+102=154$
      source_flow: 30916_97a9.pdf p.35 예시답안 [논제 2]
      criteria:
      - 2.A1
