stimuli:
- label: ㄱ
  body: |
    수열 $\{a_n\}$, $\{b_n\}$, $\{c_n\}$은 자연수 $K$에 대하여 다음 조건을 만족시킨다.

    (가) 수열 $\{a_n\}$, $\{b_n\}$은 모두 등차수열이고 $a_K=b_K$이다.
    (나) $k\le K$인 $k$에 대하여 $c_k=a_k$이다.
    (다) $k\ge K$인 $k$에 대하여 $c_k=b_k$이다.
- label: ㄴ
  body: |
    제시문 (ㄱ)의 수열 $\{c_n\}$에 대하여 $S_n=\sum_{k=1}^{n}c_k$라고 할 때, $S_n$과 수열 $\{c_n\}$은 다음 조건을 만족시킨다.

    (가) $c_1=-20$, $c_{12}>c_{11}$, $c_{16}=c_{17}+6$
    (나) $S_{11}=0$
    (다) $S_n$의 최댓값은 $S_{19}$이다.
stem: |
  제시문 (ㄱ)~(ㄴ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (40점)
subparts:
- id: '1'
  stem: '[논제 1] (20점) 제시문 (ㄴ)의 수열 $\{c_n\}$에 대하여 $c_7$의 값을 구하고 그 근거를 논술하시오.'
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents:
    - c_7=4
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S_n$이 $n=19$에서 최대이므로 $d_2=-6$, $K\le16$, $K>11$, $S_{11}=0$에서 $d_1=4$, $c_7=4$.
    steps:
    - id: 1a
      content: $d_2=-6$, $11<K\le16$, $d_1=4$, $c_7=-20+6d_1=4$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 수열 $\{a_n\}$의 공차를 $d_1$, 수열 $\{b_n\}$의 공차를 $d_2$라고 하면, $S_n$이 $n=19$일 때 최댓값을 가지므로 $d_2$는 양수가 아님을 알 수 있다. 또한 $c_1$이 음수이므로, $d_1$이 양수가 아니면 모든 $c_n$이 음수이므로 $S_n$은 $n=1$일 때 최댓값을 가지게 되어 모순이 된다. 따라서 $d_1>0$, $d_2\le0$이고 $c_{16}=c_{17}+6$에서 $d_2=-6$, $K\le16$임을 알 수 있다.
      source_flow: 30916_97a9.pdf p.35 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 또한 $S_n$이 $n=19$일 때 최댓값을 가지므로 $c_{19}\ge0$, $c_{20}\le0$을 만족한다. 만일 $K\le11$이라고 하면, $0\le c_{19}=c_{11}+(19-11)d_2$에서 $c_K\ge c_{11}\ge48$을 만족하고 $c_1=-20$이므로 $S_K=\dfrac{K(-20+c_K)}{2}\ge\dfrac{K(-20+48)}{2}>0$이고, $K\le k\le11$일 때 $c_k\ge c_{11}$이므로 $S_{11}\ge S_K>0$이 되어 모순이다. 따라서 $K>11$이고 $S_{11}=\dfrac{11(-40+10d_1)}{2}=0$으로부터 $d_1=4$임을 알 수 있다. 따라서 $c_7=-20+6d_1=4$이다.
      source_flow: 30916_97a9.pdf p.35 예시답안 [논제 1]
      criteria:
      - 1.A1
