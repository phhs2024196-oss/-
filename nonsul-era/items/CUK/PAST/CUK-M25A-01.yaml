intent: 함수가 극값을 가지는 조건을 이해하고 이를 활용할 수 있는지 평가한다. 또한 함수의 미분가능성(연속·미분계수의 일치)을 이해하는지 평가한다.
key_idea: $x=b$에서 연속이면 $a=2$. 미분가능이면 $f'(b)=3b^2+12b+3=k$. $x>b$에서는 기울기 $k$인 직선이므로 $f'(x)=0$이 오직 하나의 $x$를 가지려면 $k<0$이고 $x\le b$ 구간의 삼차함수 부분에서 근이 하나여야 한다. $k=3(b+2)^2-9$에서 $k=-1,\dots,-8$은 $b$가 2개, $k=-9$는 1개이므로 $2\times8+1=17$.
stuck: 미분가능 조건 $f'(b)=k$에서 $k=3(b+2)^2-9$로 가능한 $k$와 $b$의 대응(2개/1개)을 세는 단계
