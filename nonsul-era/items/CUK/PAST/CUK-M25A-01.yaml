    audience: A
    method_no: 1
    key_idea: $f'(b)=k$에서 $k=3(b+2)^2-9$, $k<0$이어야 하므로 $k=-1,\dots,-9$. $k=-1,\dots,-8$은 $b$가 2개, $k=-9$는 1개이므로 $16+1=17$.
    steps:
    - id: 2a
      content: $k=-1,-2,\dots,-8,-9$, $b$의 개수 $2\times8+1$, 함수의 개수 17
      criteria:
      - 2.M1
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 마찬가지로, 함수의 미분가능 조건에 의해 $f'(b)=3b^2+12b+3=k$이어야 하고, $k=3(b+2)^2-9$임을 확인할 수 있다. 함수 $f(x)$는 $x\le b$에서 최고차항이 1인 삼차함수이고, $x>b$에서 기울기가 $k$인 직선이다. 이 때 삼차함수의 개형에 따르면 기울기 $k$가 음수이어야 $f'(x)=0$을 만족시키는 $x$가 오직 하나이다.
      source_flow: 32980_e321.pdf p.32 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서 $k=3(b+2)^2-9$이고 $b$가 실수이므로 $k=-1,-2,\cdots,-8,-9$가 가능한 $k$의 범위이다. 이를 만족하는 $b$값은 $k=-1,-2,\cdots,-8$일 때 두 개, $k=-9$일 때 한 개 존재하므로 가능한 함수의 개수는 17이다.
      source_flow: 32980_e321.pdf p.32 예시답안 [논제 2]
      criteria:
      - 2.A1
