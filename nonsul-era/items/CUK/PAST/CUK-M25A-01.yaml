stimuli:
- label: ㄱ
  body: |
    실수 $a$, $b$와 0이 아닌 정수 $k$에 대하여 함수 $f(x)$는 다음과 같다.

    $$f(x)=\begin{cases}x^3+6x^2+3x+a&(x\le b)\\kx+b^3+6b^2+(3-k)b+2&(x>b)\end{cases}$$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$는 다음을 만족시킨다.

    (가) 함수 $f(x)$는 $x=b$에서 미분가능하다.

    (나) $f'(x)=0$을 만족시키는 실수 $x$의 값은 한 개뿐이다.
stem: |
  다음 제시문을 읽고 문제(논제1, 논제2)에 답하시오. (30점)
