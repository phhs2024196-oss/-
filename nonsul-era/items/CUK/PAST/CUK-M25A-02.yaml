- label: ㄱ
  body: |
    도형 A와 B는 다음과 같다. (단, $a$는 3보다 큰 상수)

    (가) A는 곡선 $y=x\sqrt x$와 $y$축 및 직선 $y=\dfrac{16}5$으로 둘러싸인 도형이다.

    (나) B는 곡선 $y=x\sqrt x$와 두 직선 $x=a$, $y=\dfrac{16}5$으로 둘러싸인 도형이다.
- label: ㄴ
  body: |
