    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a>3$이 교점의 $x$좌표보다 크므로 넓이가 같으면 $\int_0^a(x\sqrt x-\frac{16}5)dx=0$, $a=4$. 둘레의 합 $l=\int_0^4\sqrt{1+\frac94x}dx+4+4\sqrt4$.
    steps:
    - id: 1a
      content: $m=4$, $l=\dfrac{80}{27}\sqrt{10}+\dfrac{316}{27}$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: '곡선 $y=x\sqrt x$와 직선 $y=\dfrac{16}5$가 만나는 점의 $x$좌표를 구해보면 $x\sqrt x=\dfrac{16}5\Leftrightarrow x=\left(\dfrac{16}5\right)^{\frac23}=\sqrt[3]{\dfrac{256}{25}}<3$이므로 상수 $a$는 $y=x\sqrt x$와 직선 $y=\dfrac{16}5$가 만나는 점의 $x$좌표보다 오른쪽에 위치한다. 따라서, 도형 A와 B는 다음의 그림과 같다. [그림 1: 곡선 $y=x\sqrt x$, 직선 $y=\frac{16}5$, 교점의 $x$좌표(3보다 작음)와 $x=a$($a>3$)가 표시되고, 교점 왼쪽 직선 아래·$y$축 오른쪽의 도형이 A, 교점 오른쪽 곡선 위·직선 아래의 도형이 B로 빗금 표시됨]'
      source_flow: 32980_e321.pdf p.33 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 한편, 도형 A와 B의 넓이가 서로 같으려면 $\displaystyle\int_0^a\left(x\sqrt x-\dfrac{16}5\right)dx=0$이어야 하므로 $\displaystyle\int_0^a\left(x\sqrt x-\dfrac{16}5\right)dx=\dfrac25a(a^{3/2}-8)=0\Leftrightarrow a=4$ ($a>3$이므로) $m=4$이다.
      source_flow: 32980_e321.pdf p.33 예시답안 [논제 1]
      criteria:
      - 1.M2
    - id: 1b-3
      content: 이때의 두 도형 A, B의 둘레의 길이의 합 $l$은 $l=$(0에서 $m$까지의 곡선 $y=x\sqrt x$의 길이)$+m+m\sqrt m$이므로, $l=\displaystyle\int_0^4\sqrt{1+\dfrac94x}\,dx+4+4\sqrt4=\dfrac{80}{27}\sqrt{10}+\dfrac{316}{27}$이다.
      source_flow: 32980_e321.pdf p.33 예시답안 [논제 1]
      criteria:
      - 1.A1
