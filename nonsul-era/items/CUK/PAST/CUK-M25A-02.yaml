intent: 적분을 이해하고 이를 활용해 도형의 넓이를 구할 수 있는지 평가한다. 또한 적분을 활용하여 곡선의 길이를 구할 수 있는지 평가한다.
key_idea: $y=x\sqrt x$와 $y=\frac{16}5$의 교점의 $x$좌표 $\sqrt[3]{256/25}<3<a$이므로 A와 B의 넓이가 같으려면 $\int_0^a(x\sqrt x-\frac{16}5)dx=0$, $a=4=m$. 둘레의 합은 곡선 $y=x\sqrt x$의 $0\le x\le4$ 길이와 $m+m\sqrt m$이므로 $l=\int_0^4\sqrt{1+\frac94x}\,dx+4+4\sqrt4=\frac{80}{27}\sqrt{10}+\frac{316}{27}$.
stuck: A와 B의 넓이가 같다는 조건을 $\int_0^a(x\sqrt x-\frac{16}5)dx=0$ 하나로 바꾸는 단계 / 두 도형의 둘레 합에서 겹치는 선분이 상쇄되어 $m+m\sqrt m$만 남음을 파악하는 단계
