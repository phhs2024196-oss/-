- id: '2'
  stem: |
    [논제 2] (25점) 제시문에서 $P_1,P_2,\cdots,P_{10}$ 중 6개의 서로 다른 원을 선택할 때, $M$의 값이 $a$가 되도록 하는 모든 경우의 수를 구하고 그 근거를 논술하시오.
  points: 25
  depends_on: []
  answer:
    kind: value
    value: '50'
    equivalents:
    - 50가지
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $M=a$는 연속쌍이 4번, 즉 연속된 번호 그룹이 2개. 크기 조합 5가지 $\times$ 위치 $\binom52=10$ $=50$.
    steps:
    - id: 2a
      content: 그룹 크기 조합 5가지, 위치 $\binom52=10$가지, 경우의 수 $5\times10=50$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: '$M=a$가 되기 위해서는 여섯 개의 원 중 단 한 번만 연속적이지 않은 자연수가 나타나야 한다. 연속된 자연수를 갖는 원들을 그룹이라 하면 여섯 개의 원은 총 두 그룹 A와 B로 분류되며, 각 그룹의 원소의 개수의 조합은 $(1,5),(2,4),(3,3),(4,2),(5,1)$로 5총 가지이다. [판독확인: 원문 예시답안에 「5총 가지」로 인쇄됨]'
      source_flow: 32980_e321.pdf p.34 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 예를 들어, $P_1,P_3,P_4,P_5,P_6,P_7$인 경우는 A가 $P_1$, B가 $P_3,P_4,P_5,P_6,P_7$가 되어 $(1,5)$인 경우이다. $(1,5)$인 경우는 이 외에 B가 $P_4$부터 $P_8$까지 선택할 수도 있으므로, 각 그룹은 서로 연속이 되지 않는 한 오른쪽의 원을 대신 선택할 수 있다. 이 때, A그룹의 맨 왼쪽 원의 번호를 $n$이라 하고 B그룹의 맨 왼쪽 원 번호를 $m$이라 하면 $(n,m-1)$은 $n<m-1$이고 1부터 5까지의 번호 중 임의의 순서쌍이 된다. 따라서 두 그룹을 위치시키는 경우의 수는 ${}_5\mathrm{C}_2$로 10가지가 된다.
      source_flow: 32980_e321.pdf p.34 예시답안 [논제 2]
      criteria:
      - 2.M2
    - id: 2b-3
      content: 이는 원소의 개수의 조합마다 모두 동일하므로, 넓이가 $a$가 되는 모든 경우의 수는 $5\times10=50$가지이다.
      source_flow: 32980_e321.pdf p.34 예시답안 [논제 2]
      criteria:
      - 2.A1
