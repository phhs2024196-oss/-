stimuli:
- label: ㄱ
  body: |
    자연수 $n$에 대하여 반지름이 1이고 중심의 좌표가 $(n,0)$인 원을 $P_n$이라고 하자.
- label: ㄴ
  body: |
    제시문 (ㄱ)의 원 $P_n$에 대하여 $P_1,P_2,\cdots,P_{10}$ 중 6개의 서로 다른 원을 선택한 후 선택한 모든 원의 내부를 색칠할 때, 색칠된 부분의 넓이를 $M$이라고 하자.
- label: ㄷ
  body: |
    제시문 (ㄴ)의 $M$이 가질 수 있는 모든 값 중에서 네 번째로 큰 수를 $a$라고 하자.
stem: |
  다음 제시문을 읽고 문제(논제1, 논제2)에 답하시오. (40점)
subparts:
- id: '1'
  stem: |
    [논제 1] (15점) 제시문의 $a$의 값을 구하고 그 근거를 논술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 10*pi/3 + 2*sqrt(3)
    equivalents:
    - a=10π/3+2√3
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 이웃한 원끼리만 겹치고 겹친 넓이가 $b=2(\frac\pi3-\frac{\sqrt3}4)$, 연속쌍 $k=1,\dots,5$이므로 $M=6\pi-kb$, $a=6\pi-4b$.
    steps:
    - id: 1a
      content: $M=6\pi-b,\dots,6\pi-5b$, $a=6\pi-4b=\dfrac{10}3\pi+2\sqrt3$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 원 $P_1,\cdots,P_{10}$의 반지름은 모두 1로 동일한 형태의 원이다. 따라서 서로 다른 두 원 $P_n$과 $P_m$의 내부를 색칠하여 넓이가 줄어들기 위해서는 $n$, $m$이 연속된 두 자연수이어야 한다. 각 원의 넓이는 $\pi$이고, $P_1$과 $P_2$의 내부가 겹친 부분의 넓이를 $b$라고 하자. 이 때, 제시문 (ㄴ)의 선택에서 연속된 두 자연수 쌍의 조합이 $k$번 나올 경우, 총 넓이 $M$은 $6\pi-kb$가 된다. 열 개의 원 중 여섯 개를 택하는 문제이므로, 최대 다섯 번, 최소 한 번 연속된 자연수 쌍이 나온다. 따라서 $M=6\pi-b,6\pi-2b,6\pi-3b,6\pi-4b,6\pi-5b$이고, $a=6\pi-4b$가 된다.
      source_flow: 32980_e321.pdf p.34 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: $b$의 값을 구하자. $P_1$의 중심은 $O(1,0)$이고, $P_2$의 중심은 $Q(2,0)$, 그리고 $P_1$과 $P_2$의 교점을 $A\left(\dfrac32,\dfrac{\sqrt3}2\right)$, $B\left(\dfrac32,-\dfrac{\sqrt3}2\right)$이라 하면, 삼각형 $OAB$의 넓이는 $\dfrac{\sqrt3}4$이고 부채꼴 $OAB$의 넓이는 $\dfrac\pi3$이므로 $b=2\left(\dfrac\pi3-\dfrac{\sqrt3}4\right)$이다. 따라서 $a=6\pi-4b=6\pi-8\left(\dfrac\pi3-\dfrac{\sqrt3}4\right)=\dfrac{10}3\pi+2\sqrt3$이다.
      source_flow: 32980_e321.pdf p.34 예시답안 [논제 1]
      criteria:
      - 1.A1
