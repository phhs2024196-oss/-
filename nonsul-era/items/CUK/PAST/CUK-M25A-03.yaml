intent: 여러 가지 경우의 수를 이해하고 이를 활용할 수 있는지 평가한다. 반지름이 같은 원 10개 중 6개를 택할 때 색칠된 부분의 넓이가 겹침의 개수로 결정됨을 이해하고, 그 넓이의 네 번째 큰 값을 구한 뒤 그 값이 되는 선택의 수를 조합으로 계산할 수 있는지 평가한다.
key_idea: '서로 이웃한 두 원(연속된 자연수 쌍)만 겹치고 겹친 넓이는 $b=2(\frac\pi3-\frac{\sqrt3}4)$. 이웃쌍이 $k$번이면 $M=6\pi-kb$이고 $1\le k\le5$이므로 네 번째로 큰 값은 $a=6\pi-4b=\frac{10}3\pi+2\sqrt3$. $M=a$는 6개를 연속 구간 2개 그룹으로 나누는 경우: 크기 조합 5가지 $\times$ 위치 $\binom52=10$가지 $=50$.'
stuck: $M=6\pi-kb$에서 $k$의 범위(최소 1, 최대 5)를 파악하는 단계 / 그룹 위치를 $n<m-1$인 순서쌍으로 바꿔 $\binom52$로 세는 단계
