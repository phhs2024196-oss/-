intent: 고교 교과서 「미적분」에 나오는 개념을 이해하는지 평가한다. 지수함수와 로그함수의 관계(역함수 대칭)를 이해하고 이를 활용하여 함수의 적분(두 곡선으로 둘러싸인 도형의 넓이)을 계산할 수 있는지 평가한다.
key_idea: 점 $\mathrm{A}(a,b)$가 $y=f(x)$ 위이면 $\mathrm{B}(b,a)$는 역함수 $y=4e^x-3$ 위의 점이고 동시에 $y=e^{2x}$ 위의 점이므로 $e^{2x}=4e^x-3$을 $t=e^x$로 풀어 $D=\{(0,1),(\ln3,9)\}$. 두 점을 지나는 직선과 $y=e^{2x}$ 사이 넓이를 정적분하여 $S=5\ln3-4$.
stuck: 점 B의 조건을 $f$의 역함수 위의 점으로 읽어 $e^{2x}=4e^x-3$을 세우는 단계 / 직선과 곡선의 위아래 관계를 확인해 정적분의 피적분함수를 정하는 단계
