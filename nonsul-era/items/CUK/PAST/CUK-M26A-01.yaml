stimuli:
- label: ㄱ
  body: |
    함수 $f(x)$, $g(x)$는 다음과 같다.

    (가) $f(x)=\ln\left(\dfrac{x+3}4\right)$

    (나) $g(x)=e^{2x}$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$, $g(x)$에 대하여 실수 $a$, $b$는 다음 조건을 만족시킨다.

    (가) 점 $\mathrm{A}(a,b)$는 곡선 $y=f(x)$ 위의 점이다.

    (나) 점 $\mathrm{B}(b,a)$는 곡선 $y=g(x)$ 위의 점이다.
- label: ㄷ
  body: |
    제시문 (ㄴ)을 만족하는 점 $\mathrm{B}(b,a)$의 집합을 $D$라 하고, $D$의 원소인 두 점을 지나는 직선을 $y=h(x)$라고 하자.
- label: ㄹ
  body: |
    제시문 (ㄱ)의 함수 $g(x)$와 제시문 (ㄷ)의 함수 $h(x)$에 대하여 곡선 $y=g(x)$와 직선 $y=h(x)$로 둘러싸인 도형의 넓이를 $S$라고 하자.
stem: |
  제시문 (ㄱ)~(ㄹ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
subparts:
- id: '1'
  stem: |
    [논제 1] (15점) 제시문 (ㄷ)의 집합 $D$를 구하고 그 근거를 논술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '{(0, 1), (log(3), 9)}'
    equivalents:
    - D={(0,1),(ln3,9)}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{B}(b,a)$는 $y=f^{-1}(x)=4e^x-3$ 위이면서 $y=e^{2x}$ 위이므로 $e^{2x}-4e^x+3=0$, $e^x=1,3$에서 $D=\{(0,1),(\ln3,9)\}$.
    steps:
    - id: 1a
      content: $D=\{(0,1),(\ln3,9)\}$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 점 $\mathrm{A}(a,b)$가 곡선 $y=f(x)$위의 점이므로 점 $\mathrm{B}(b,a)$는 곡선 $y=f^{-1}(x)$위의 점이다. 한편, $y=f(x)$의 역함수가 $y=4e^x-3$이므로 점 $\mathrm{B}(b,a)$는 곡선 $y=4e^x-3$위의 점이다. 점 $\mathrm{B}(b,a)$는 또한 곡선 $y=g(x)=e^{2x}$ 위의 점이므로, 실수 $b$는 방정식 $e^{2x}=4e^x-3$, 즉 $e^{2x}-4e^x+3=0$의 해이다.
      source_flow: 36212_0aa7.pdf p.27 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: $t=e^x$라고 하면 이 방정식은 $t^2-4t+3=0$으로 나타낼 수 있고 $(t-1)(t-3)=0$에서 $t=1,t=3$ 즉 $x=0$, $x=\ln3$임을 알 수 있다. $y=e^{2x}$에서 $x=0$일 때 $y=1$, $x=\ln3$일 때 $y=9$이므로 $D=\{(0,1)(\ln3,9)\}$이다.
      source_flow: 36212_0aa7.pdf p.27 예시답안 [논제 1]
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: 점 B가 $y=f^{-1}(x)=4e^x-3$ 위이고 $y=g(x)$ 위의 점임을 이용해 방정식 $e^{2x}-4e^x+3=0$을 세웠다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $t=e^x$로 치환해 풀고 $D=\{(0,1),(\ln3,9)\}$를 구하였다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] (15점) 제시문 (ㄹ)의 집합 $S$를 구하고 그 근거를 논술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 5*log(3) - 4
    equivalents:
    - S=5ln3-4
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $h(x)=\frac8{\ln3}x+1$이고 $[0,\ln3]$에서 $h(x)\ge g(x)$이므로 $S=\int_0^{\ln3}(h-g)dx=5\ln3-4$.
    steps:
    - id: 2a
      content: $S=\displaystyle\int_0^{\ln3}\left(\dfrac8{\ln3}x+1-e^{2x}\right)dx=5\ln3-4$
      criteria:
      - 2.M1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $D$의 두 원소를 지나는 직선의 식은 $y=\dfrac{9-1}{\ln3-0}x+1=\dfrac8{\ln3}x+1$이므로 $h(x)=\dfrac8{\ln3}x+1$이고 곡선 $y=g(x)$와 $(0,1)$, $(\ln3,9)$에서 만난다. 또한 구간 $[0,\ln3]$에서 $h(x)\ge g(x)$이므로 $S=\displaystyle\int_0^{\ln3}\left(\dfrac8{\ln3}x+1-e^{2x}\right)dx=\left[\dfrac4{\ln3}x^2+x-\dfrac12e^{2x}\right]_0^{\ln3}=5\ln3-4$
      source_flow: 36212_0aa7.pdf p.27 예시답안 [논제 2]
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: $h(x)$를 구하고 $[0,\ln3]$에서 $h(x)\ge g(x)$임을 확인한 뒤 정적분으로 $S=5\ln3-4$를 구하였다.
      steps:
      - 2b-1
