intent: 수능형 문제를 통해 수학능력을 확인한다. 삼차함수와 접선의 방정식을 이해하고 이를 활용할 수 있는지 평가한다. 극값·접선 조건으로 삼차함수를 결정하고, 한 점에서 그은 접선의 개수를 삼차방정식의 실근 개수로 바꾸어 판단할 수 있는지 평가한다.
key_idea: $f(x)-x$가 $x=4$에서 극솟값, $x=2$에서 극댓값을 가지므로 $f(x)-x=m(x-k)(x-4)^2$, 조건 (가)(다)로 $f(x)=(x-1)(x-4)^2+x$. 점 $(0,a)$에서 접점 $(p,f(p))$로 그은 접선 조건은 $2p^3-9p^2+16+a=0$이고 실근이 1개일 조건은 극댓값 $<0$ 또는 극솟값 $>0$이므로 $L=\{a\mid a>11\text{ 또는 }a<-16\}$. $a=0$이면 $2t^3-9t^2+16=0$의 모든 실근의 합 $S=\frac92$.
stuck: 접선이 점 $(0,a)$를 지날 조건을 접점 $p$에 대한 삼차방정식으로 바꾸는 단계 / 실근이 하나일 조건을 극값의 부호로 바꾸는 단계
