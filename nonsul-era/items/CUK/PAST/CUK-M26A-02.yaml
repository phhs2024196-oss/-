    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=(x-1)(x-4)^2+x$. 접선이 $(0,a)$를 지나는 조건 $2p^3-9p^2+16+a=0$의 실근이 1개이려면 극댓값 $16+a<0$ 또는 극솟값 $-11+a>0$.
    steps:
    - id: 1a
      content: $f(x)=x^3-9x^2+25x-16$, $L=\{a\mid a>11\text{ 또는 }a<-16\}$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 제시문 (ㄱ)에 따르면 함수 $f(x)-x$는 $x=4$에서 극솟값을 가지고 $x=2$에서 극댓값을 가지므로, $f(x)-x=m(x-k)(x-4)^2$형태를 갖고 있음을 알 수 있다. 이를 미분하면 $f'(x)-1=m[(x-4)^2+2(x-k)(x-4)]$를 얻는다. 이 때 (가)에서는 $f(4)=4$이고 $f(2)=6$임을 알 수 있고, (다)에서는 $f'(2)=1$임을 알 수 있으므로, 위 식에 $x=2$를 대입하면 $4=4m(2-k)$이고 $0=m(4-4(2-k))$이다. 따라서 $k=1$이고, $m=1$이다. 즉, $f(x)=(x-1)(x-4)^2+x=x^3-9x^2+25x-16$을 얻는다.
      source_flow: 36212_0aa7.pdf p.28 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 점 $(0,a)$에서 곡선 $y=f(x)$에 내린 접선의 접점을 $(p,f(p))$라고 하면, 점 $(0,a)$까지의 평균변화율과 접점에서의 미분계수가 같으므로 $\dfrac{f(p)-a}p=f'(p)$이고, $pf'(p)-f(p)+a=2p^3-9p^2+16+a=0$이 성립한다. 따라서 $g(x)=2x^3-9x^2+16+a$라고 하면 $g(x)=0$의 해의 개수가 하나가 되는 실수 $a$의 조건을 찾으면 된다.
      source_flow: 36212_0aa7.pdf p.28 예시답안 [논제 1]
      criteria:
      - 1.M2
    - id: 1b-3
      content: $g'(x)=6x^2-18x=6x(x-3)$이므로 $g'(x)=0$의 근이 $x=0,3$ 두 개 존재하고, 따라서 $g(x)$의 극댓값은 $g(0)=16+a$, 극솟값은 $g(3)=-11+a$이다. 삼차함수 $g(x)$는 극댓값이 0보다 작거나 극솟값이 0보다 클 경우에만 해가 하나뿐이므로, 원하는 $a$의 조건은 $16+a<0$ 또는 $-11+a>0$이 된다. 따라서 집합 $L$은 $\{a\mid a>11\text{ 또는 }a<-16\}$이다.
      source_flow: 36212_0aa7.pdf p.28 예시답안 [논제 1]
      criteria:
      - 1.A1
