stimuli:
- label: ㄱ
  body: |
    최고차항의 계수가 양수인 삼차함수 $f(x)$는 다음 조건을 만족시킨다.

    (가) $f(2)-f(4)=2$

    (나) 직선 $y=x$는 점 $(4,f(4))$에서 곡선 $y=f(x)$에 접한다.

    (다) 함수 $g(x)=f(x)-x$는 $x=2$에서 극댓값을 갖는다.
- label: ㄴ
  body: |
    실수 $a$와 제시문 (ㄱ)의 함수 $f(x)$에 대하여 다음 조건을 만족시키는 실수 $b$를 모두 모아놓은 집합을 $K$라고 하자.

    곡선 $y=f(x)$ 위의 점 $(b,f(b))$에서의 접선은 점 $(0,a)$를 지난다.
- label: ㄷ
  body: |
    제시문 (ㄴ)에서 집합 $K$의 원소의 개수가 1이 되는 $a$를 모두 모아놓은 집합을 $L$이라고 하자.
- label: ㄹ
  body: |
    제시문 (ㄴ)에서 $a=0$일 때 집합 $K$의 모든 원소의 합을 $S$라고 하자.
