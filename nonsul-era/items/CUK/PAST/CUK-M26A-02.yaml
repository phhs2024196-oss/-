  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 원점에서의 접점 $t$는 $2t^3-9t^2+16=0$, $(t-4)(2t^2-t-4)=0$의 세 실근이고 합 $\frac12+4=\frac92$.
    steps:
    - id: 2a
      content: $(t-4)(2t^2-t-4)=0$, 모든 접점의 $x$좌표의 합 $S=\dfrac92$
      criteria:
      - 2.M1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: '원점에서 곡선 $y=f(x)$에 내린 접선의 접점을 $(t,f(t))$라고 하면, 마찬가지로 $tf''(t)-f(t)=2t^3-9t^2+16=0$이 성립한다. 제시문 (ㄱ)의 (가)에 의하면 $y=x$가 이 중 하나의 접선이므로 $t=4$가 하나의 해이다. 따라서 인수분해하면 $(t-4)(2t^2-t-4)=0$이고 이차방정식의 풀이에 의해 $t=47,\dfrac{1+\sqrt{33}}4$가 모든 접점의 $x$좌표이다. 모든 접점의 $x$좌표의 합 $S$는 $\dfrac92$이다. [판독확인: 원문 예시답안 인쇄가 $t=47$로 되어 있음(오기로 보임: $t=4$, $\frac{1\pm\sqrt{33}}4$). 합 $\frac92$는 $t=4$와 두 근 $\frac{1\pm\sqrt{33}}4$의 합으로 일치]'
      source_flow: 36212_0aa7.pdf p.28 예시답안 [논제 2]
      criteria:
      - 2.M1
