intent: 수학적인 사고를 확인하기 위한 문제이다. 수열의 부분 합과 일반항, 다항식의 계산을 이해하고 이를 활용할 수 있는지 평가한다. 팩토리얼 합 $a_n$으로 이루어진 점화 관계가 모든 $n\ge3$에서 성립하도록 하는 계수를 찾고, 이를 이용해 부분분수 꼴 합을 계산할 수 있는지 평가한다.
key_idea: $a_{n+1}=n!(n+1)!+a_n$, $a_{n+2}=n!(n+1)!(1+(n+1)(n+2))+a_n$을 점화식에 대입해 정리하면 $(3-a)n!(n+1)!=(a+b)a_n$이 모든 $n\ge3$에서 성립해야 한다. $a\ne3$이면 $\frac{a+b}{3-a}=\frac{n!(n+1)!}{a_n}>n+1$이 되어 $n$이 충분히 클 때 모순이므로 $a=3$, $b=-3$. 그러면 $\frac{f(n)+g(n)}{g(n)}=-\frac1{(n+1)(n+2)}$로 망원급수 $A=-\frac{23}{108}$.
stuck: 점화식에 $a_{n+1},a_{n+2}$를 $a_n$으로 나타내 대입하는 단계 / $a\ne3$일 때 $a_n<n!\,n!$로 항등식이 불가능함을 보이는 부등식 단계
