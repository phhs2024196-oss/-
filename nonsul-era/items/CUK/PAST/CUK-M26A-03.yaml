    key_idea: $\frac{f(n)+g(n)}{g(n)}=-\frac1{(n+1)(n+2)}=\frac1{n+2}-\frac1{n+1}$이므로 $A=\frac1{27}-\frac14=-\frac{23}{108}$.
    steps:
    - id: 2a
      content: $A=\displaystyle\sum_{n=3}^{25}\left(\dfrac1{n+2}-\dfrac1{n+1}\right)=\dfrac1{27}-\dfrac14=-\dfrac{23}{108}$
      criteria:
      - 2.M1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 논제 1에 의해서 $f(n)=n^2+3n+3$, $g(n)=-n^2-3n-2$이다. 따라서 제시문 (ㄹ)의 $A$는 다음과 같다. $A=\displaystyle\sum_{n=3}^{25}\dfrac{f(n)+g(n)}{g(n)}=\sum_{n=3}^{25}\dfrac{-1}{(n+1)(n+2)}=\sum_{n=3}^{25}\left(\dfrac1{n+2}-\dfrac1{n+1}\right)=\dfrac1{27}-\dfrac14=-\dfrac{23}{108}$
