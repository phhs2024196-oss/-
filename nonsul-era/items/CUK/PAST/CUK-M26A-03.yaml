stimuli:
- label: ㄱ
  body: |
    실수 $a$, $b$에 대하여 함수 $f(x)$, $g(x)$는 다음과 같다.

    $$f(x)=x^2+ax+3,\ g(x)=-x^2+bx-2$$
- label: ㄴ
  body: |
    3보다 크거나 같은 자연수 $n$에 대하여 $a_n$은 다음과 같다.

    $$a_n=\sum_{k=2}^{n}(k-1)!k!=1!2!+2!3!+\cdots+(n-1)!n!$$
- label: ㄷ
  body: |
    제시문 (ㄱ)의 함수 $f(x)$, $g(x)$와 제시문 (ㄴ)의 $a_n$은 다음을 만족시킨다.

    $$a_{n+2}=f(n)a_{n+1}+g(n)a_n\quad(n\ge3)$$
- label: ㄹ
  body: |
    제시문 (ㄷ)의 함수 $f(x)$, $g(x)$에 대하여 $A$는 다음과 같다.

    $$A=\sum_{n=3}^{25}\dfrac{f(n)+g(n)}{g(n)}$$
stem: |
  제시문 (ㄱ)~(ㄹ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (40점)
subparts:
- id: '1'
  stem: |
    [논제 1] (30점) 제시문 (ㄷ)의 함수 $f(x)$, $g(x)$를 구하고 그 근거를 논술하시오.
  points: 30
  depends_on: []
  answer:
    kind: value
    value: f(x) = x**2 + 3*x + 3; g(x) = -x**2 - 3*x - 2
    equivalents:
    - a=3, b=-3
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_{n+1},a_{n+2}$를 $a_n$으로 나타내 점화식에 대입하면 $(3-a)n!(n+1)!=(a+b)a_n$. $a\ne3$이면 $\frac{a+b}{3-a}>n+1$이 되어 모순, $a=3$이면 $b=-3$.
    steps:
    - id: 1a
      content: $a=3$, $b=-3$, $f(x)=x^2+3x+3$, $g(x)=-x^2-3x-2$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: '제시문 (ㄴ)의 조건으로부터 $a_{n+1}=n!(n+1)!+a_n$, $a_{n+2}=n!(n+1)!(1+(n+1)(n+2))+a_n$이다. 따라서 제시문 (ㄷ)의 식은 다음과 같다. $a_n+(n^2+3n+3)n!(n+1)!=(n^2+an+3)(n!(n+1)!+a_n)+(-n^2+bn-2)a_n=(n^2+an+3)n!(n+1)!+a_n((a+b)n+1)$ 즉, 3보다 크거나 같은 자연수 $n$에 대하여 $(3-a)n!(n+1)!=(a+b)a_n$이 항상 성립하는 실수 $a$, $b$를 찾아야 한다. [판독확인: 원문 예시답안에는 첫 줄의 $bn$이 $b_n$ (아래첨자)으로 인쇄되어 있음; 이어지는 식에서 $bn$으로 쓰임]'
      source_flow: 36212_0aa7.pdf p.29 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 1) $a\ne3$인 경우 3보다 크거나 같은 자연수 $n$에 대하여 $\dfrac{a+b}{3-a}=\dfrac{n!(n+1)!}{a_n}$이다. 한편, $a_n=1!2!+2!3!+\cdots+(n-1)!n!<(n-1)!n!+\cdots+(n-1)!n!=(n-1)(n-1)!n!<n!n!$이므로 $\dfrac{a+b}{3-a}=\dfrac{n!(n+1)!}{a_n}>n+1$이다. 이 때, $n\ge3$인 자연수 $n$ 중에 $\dfrac{a+b}{3-a}$보다 큰 $n$을 생각하면 부등식 $\dfrac{a+b}{3-a}>n+1$이 성립하지 않는다. 따라서 $a\ne3$ 경우, $\dfrac{a+b}{3-a}=\dfrac{n!(n+1)!}{a_n}$이 항상 성립할 수는 없다.
      source_flow: 36212_0aa7.pdf p.29 예시답안 [논제 1]
      criteria:
      - 1.M2
    - id: 1b-3
      content: '2) $a=3$인 경우 $b=-3$일 때만 $n\ge3$인 자연수 $n$에 대하여 $(3-a)n!(n+1)!=(a+b)a_n$이 성립한다. 따라서 $a=3$, $b=-3$이고 제시문 (ㄷ)의 $f(x)$, $g(x)$는 다음과 같다. $f(n)=x^2+3x+3$, $g(x)=-x^2-3x-2$ [판독확인: 원문에 $f(n)=x^2+3x+3$으로 인쇄됨(변수 표기 오기로 보임)]'
      source_flow: 36212_0aa7.pdf p.29 예시답안 [논제 1]
      criteria:
      - 1.A1
