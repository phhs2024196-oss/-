  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=-\dfrac{x(x^2-2x-6)}{e^x}$로 극댓값을 주는 $x=\alpha,\beta$를 찾고 $\alpha+\beta=2$, $\alpha\beta=-6$으로 $A=\dfrac{36}{e^2}$를 얻는다.
    steps:
    - id: 1a
      content: $f'(x)=-\dfrac{x(x^2-2x-6)}{e^x}$, $x=0$ 극솟값, $x=\alpha,\beta$ 극댓값, $A=f(\alpha)f(\beta)=\dfrac{36}{e^2}$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 함수 $f(x)=\dfrac{(x+1)(x^2-4)}{e^x}$의 도함수는 $f'(x)=-\dfrac{x(x^2-2x-6)}{e^x}$이므로 방정식 $x^2-2x-6=0$의 두 근을 $\alpha=1-\sqrt7$, $\beta=1+\sqrt7$라 할 때, 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다. 표에서 $f'(x)$의 부호는 $x<\alpha$에서 $+$, $\alpha<x<0$에서 $-$, $0<x<\beta$에서 $+$, $x>\beta$에서 $-$이다. 따라서 $f(x)$는 $x=0$에서 극솟값 $f(0)=-4$, $x=\alpha,\beta$에서 극댓값을 가진다.
      source_flow: 37609_4a86.pdf p.32 채점기준·p.35 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 그러므로 $A=f(\alpha)f(\beta)=\dfrac{(\alpha+1)(\alpha^2-4)(\beta+1)(\beta^2-4)}{e^{\alpha+\beta}}$이다. $\alpha+\beta=2$, $\alpha\beta=-6$이므로 $A=\dfrac{(\alpha\beta+\alpha+\beta+1)(\alpha\beta-2(\alpha+\beta)+4)(\alpha\beta+2(\alpha+\beta)+4)}{e^2}=\dfrac{(-3)\times(-6)\times2}{e^2}=\dfrac{36}{e^2}$이다.
      source_flow: 37609_4a86.pdf p.32 채점기준·p.35 예시답안 [논제 1]
      criteria:
      - 1.A1
