intent: 고교 교과서 「미적분」에 나오는 개념을 이해하는지 평가한다. 지수함수가 포함된 유리식 꼴 함수의 도함수로 증가·감소를 표로 정리해 극값을 구하고, 근과 계수의 관계로 두 극댓값의 곱을 계산하며, 닫힌구간에서 극값과 끝값을 비교해 최솟값·최댓값을 구할 수 있는지 평가한다. (출제 의도 원문에는 「지수함수와 로그함수의 관계를 이해하고 이를 활용하여 함수의 적분을 계산」이라는 문장이 있으나 실제 논제는 도함수·극값 문제이다.)
key_idea: $f'(x)=-\dfrac{x(x^2-2x-6)}{e^x}$에서 극솟값은 $x=0$, 극댓값은 $x=\alpha,\beta$($\alpha+\beta=2$, $\alpha\beta=-6$)이고, $f(\alpha)f(\beta)$를 대칭식으로 바꿔 $A=\dfrac{36}{e^2}$를 얻는다. $[1,2026]$에서는 $x=\beta$만 극값이고 $f(1)<0<f(2026)<f(\beta)$이므로 $m=f(1)$, $M=f(\beta)$.
stuck: $f(\alpha)f(\beta)$를 $\alpha,\beta$를 직접 대입하지 않고 $\alpha+\beta$, $\alpha\beta$의 식으로 바꾸는 단계 / $[1,2026]$에서 $f(2026)$과 $f(\beta)$의 대소를 보이는 단계
