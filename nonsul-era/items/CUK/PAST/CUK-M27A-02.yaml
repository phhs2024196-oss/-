- id: '2'
  stem: |
    [논제 2] (20점) 제시문 (ㄴ)의 이차함수 $g(x)$를 구하고 그 근거를 논술하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 2*x**2 - 6*x + 2
    equivalents:
    - g(x)=2x^2-6x+2
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(g(x))=4$의 네 실근의 합 $4k=6$에서 $k=\frac32$, $g(2)=-2$로 $b=-2-\frac a4$. $g(t)=2$의 두 근 중 하나만 양수여야 하므로 $a=2$.
    steps:
    - id: 2a
      content: $g(x)=2x^2-6x+2$
      criteria:
      - 2.M1
      - 2.M2
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 이차함수 $y=g(x)$의 그래프의 대칭축을 $x=k$라고 하면 꼭짓점의 $x$좌표는 $k$이고, 실수 $c$에 대하여 방정식 $g(x)=c$가 서로 다른 두 실근을 가지면 두 실근의 합은 $2k$이다. 논제 1과 마찬가지로 $g(x)=t$라고 하면 $g(t)=4$는 서로 다른 두 근 $t=t_1,t_2$를 가져야 하고, $g(x)=t_1$과 $g(x)=t_2$ 또한 서로 다른 실근을 두 개씩 가져야 하며, 이 네 실근은 모두 $g(g(x))=4$을 만족시킨다. 이때 두 실근의 합이 각각 $2k$이므로 네 실근의 합은 $4k$가 된다. $4k=6$에서 $k=\dfrac32$이다.
      source_flow: 37609_4a86.pdf p.33 채점기준·p.36 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서 $g(x)=a\left(x-\dfrac32\right)^2+b$로 나타낼 수 있고, $g(2)=-2$이므로 $b=-2-\dfrac a4$이다. 임의의 실수 $x$에 대해 $h(x)=2^x>0$이므로, $g(h(x))=2$가 하나의 근만 갖기 위해서는 두 근 중 하나는 양수이고 다른 하나는 0 이하여야 한다. 방정식 $g(x)-2=a\left(x-\dfrac32\right)^2-4-\dfrac a4=0$의 근은 $x=\dfrac32\pm\sqrt{\dfrac4a+\dfrac14}$이고, $a=2$일 때는 하나의 양의 실근, $a$가 3 이상인 자연수일 때는 서로 다른 두 개의 양의 실근을 갖는다. 따라서 $a=2$이고 $g(x)=2x^2-6x+2$이다.
      source_flow: 37609_4a86.pdf p.33 채점기준·p.36 예시답안 [논제 2]
      criteria:
      - 2.M2
