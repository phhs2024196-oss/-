intent: 수능형 문제를 통해 수학능력을 확인한다. 이차함수의 그래프의 대칭성과 합성함수 $f(f(x))=4$의 근의 개수·합 조건을 해석해 꼭짓점의 위치를 찾고, 같은 논리를 $g(g(x))=4$에 적용한 뒤 $g(g(h(x)))$ 꼴 방정식의 근의 개수 조건으로 이차함수를 결정할 수 있는지 평가한다.
key_idea: $f(x)=t$ 꼴로 치환하면 두 근 $t_1<t_2$ 중 $f(x)=t_1$은 근이 없고 $f(x)=t_2$가 서로 다른 두 실근을 가지며, 두 근의 합이 $2h$이므로 $2h=6$, 꼭짓점의 $x$좌표 $h=3$. $g$는 네 근의 합이 $4k=6$이므로 $k=\frac32$, $g(2)=-2$로 $b=-2-\frac a4$이고 $g(2^x)=2$의 근이 1개이려면 $g(t)=2$의 두 근 중 하나만 양수여야 하므로 $a=2$.
stuck: 합성함수 $f(f(x))=4$를 $f(x)=t$로 치환해 근의 개수와 합 조건으로 바꾸는 단계 / $g(2^x)=2$의 근이 1개일 조건을 $g(t)=2$의 두 근의 부호로 바꾸는 단계
