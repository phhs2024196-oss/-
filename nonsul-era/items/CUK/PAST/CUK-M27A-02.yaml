stimuli:
- label: ㄱ
  body: |
    최고차항의 계수가 1보다 큰 자연수인 이차함수 $f(x)$와 $g(x)$는 다음 조건을 만족시킨다.

    (가) $f(f(x))=4$를 만족시키는 서로 다른 실수 $x$는 2개이고 그 합은 6이다.

    (나) $g(g(x))=4$를 만족시키는 서로 다른 실수 $x$는 4개이고 그 합은 6이다.

    (다) $g(2)=-2$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 함수 $g(x)$와 함수 $h(x)=2^x$에 대하여 $g(h(x))=2$를 만족시키는 서로 다른 실수 $x$는 1개이다.
stem: |
  제시문 (ㄱ)~(ㄷ)을 읽고 문제(논제 1, 논제 2)에 답하시오. (30점)
subparts:
- id: '1'
  stem: |
    [논제 1] (10점) 제시문 (ㄱ)의 이차함수 $f(x)$의 그래프의 꼭짓점의 $x$좌표를 구하고 그 근거를 논술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents:
    - x=3
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(f(x))=4$를 $f(x)=t$로 치환하면 $f(t)=4$의 두 근 중 $f(x)=t_2$만 두 실근을 가지며 그 합이 $2h=6$이므로 꼭짓점의 $x$좌표는 3. 중근인 경우는 불가능.
    steps:
    - id: 1a
      content: 꼭짓점의 $x$좌표는 $h=3$
      criteria:
      - 1.M1
      - 1.M2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 이차함수 $y=f(x)$의 그래프의 대칭축을 $x=h$라고 하면 꼭짓점의 $x$좌표는 $h$이다. 이때, 실수 $c$에 대하여 방정식 $f(x)=c$가 서로 다른 두 실근을 가지면 두 실근의 합은 $2h$이다. $f(x)=t$라고 할 때, 1) 만일 $f(t)=4$가 서로 다른 두 근 $t=t_1,t_2$($t_1<t_2$)를 갖는다면, $f(f(x))=4$를 만족하는 서로 다른 실수 $x$가 2개이고 이차항의 계수가 양수이므로, $f(x)=t_1$은 근이 없고 $f(x)=t_2$는 두 개의 서로 다른 실근을 가져야 한다. 이 두 실근은 $f(f(x))=4$를 만족시키고 두 근의 합은 $2h$이다. $2h=6$에서 $h=3$이다.
      source_flow: 37609_4a86.pdf p.33 채점기준·p.36 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 2) $f(t)=4$가 중근 $t_0$를 갖는 경우, $f(x)=t_0$를 만족시키는 두 실근의 합이 $2h$이므로 $h=3$이다. 이때, 꼭짓점의 좌표는 $(3,4)$이고 $f(x)$의 최솟값은 4이므로 $t_0=3$이다. 이차항의 계수가 양수이므로 $f(x)=t_0$은 실근을 갖지 않고, 이 경우는 불가능하다. 따라서 $h=3$이고, 구하고자 하는 이차함수 $f(x)$의 그래프의 꼭짓점의 $x$좌표는 3이다.
      source_flow: 37609_4a86.pdf p.33 채점기준·p.36 예시답안 [논제 1]
      criteria:
      - 1.M2
