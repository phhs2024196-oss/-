  - '조건 (나) $g(g(x))=4$: 서로 다른 실수 해 4개, 합 6'
  - 조건 (다) $g(2)=-2$
  - $h(x)=2^x$에 대하여 $g(h(x))=2$를 만족시키는 서로 다른 실수 $x$는 1개
  concepts:
  - 이차함수의 그래프의 대칭축과 꼭짓점
  - 합성함수와 방정식의 실근 개수
  - $f(x)=c$의 두 실근의 합은 $2h$
  - 지수함수의 치역 $2^x>0$
  tools:
  - $f(x)=t$로 치환 후 $f(t)=4$의 두 근 $t_1<t_2$로 경우 분류(서로 다른 두 근 / 중근)
  - 네 실근의 합 $=2k+2k=4k$
  - $g(x)=a(x-\frac32)^2+b$, $b=-2-\frac a4$
