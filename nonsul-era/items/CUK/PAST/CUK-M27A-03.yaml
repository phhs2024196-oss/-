intent: 창의적인 사고를 확인하기 위한 문제이다. 삼각형과 외접원의 성질을 이해하고 이를 활용할 수 있는지 평가한다. 사인법칙·코사인법칙으로 이등변삼각형임을 보이고, 네 점이 한 원 위에 있고 두 직선이 수직인 조건에서 $\angle\mathrm{ACD}$와 선분 CD의 길이를 구할 수 있는지 평가한다.
key_idea: 사인법칙·코사인법칙으로 $\sin A=2\sin B\cos C$에서 $b=c$. $A$가 BC의 수직이등분선 위에 있으므로 AD는 외접원의 지름, $\angle\mathrm{ACD}=\frac\pi2$이므로 $\cos\theta=0$. $C$에서 AD에 내린 수선의 발이 M이므로 $\mathrm{CM}^2=\mathrm{AM}\cdot\mathrm{MD}$로 $\mathrm{DM}=x$는 $x^2-25x+144=0$, $x=9,16$, $l=\sqrt{x^2+144}=15,20$.
stuck: $b=c$에서 AD가 외접원의 지름임을 이끌어내는 단계 / $\mathrm{DM}$이 두 값을 갖는 경우를 빠뜨리지 않는 단계
