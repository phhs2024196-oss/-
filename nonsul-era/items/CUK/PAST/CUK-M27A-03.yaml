stimuli:
- label: ㄱ
  body: |
    삼각형 ABC는 다음 조건을 만족시킨다.

    (가) 외접원의 지름의 길이는 25이다.

    (나) $\sin A=2\sin B\cos C$
- label: ㄴ
  body: |
    제시문 (ㄱ)의 삼각형 ABC와 점 D가 다음 조건을 만족시킬 때, 각 $\angle\mathrm{ACD}$의 크기를 $\theta$라 하고, 선분 CD의 길이를 $l$이라고 하자.

    (가) 점 A, B, C, D는 한 원 위에 있는 서로 다른 네 점이다.

    (나) 두 직선 AD와 BC는 서로 수직이다.

    (다) 두 직선 AD와 BC가 만나는 점을 M이라고 할 때, 선분 BM의 길이는 12이다.
stem: |
