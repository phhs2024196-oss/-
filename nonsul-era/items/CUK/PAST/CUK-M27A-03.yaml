    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{DM}=x$라 하면 $\mathrm{CM}^2=\mathrm{AM}\cdot\mathrm{DM}$에서 $x(25-x)=144$, $x=9,16$이고 $l=\sqrt{x^2+144}=15,20$.
    steps:
    - id: 2a
      content: $x^2-25x+144=0$, $x=9$ 또는 $16$, $l=15$ 또는 $20$
      criteria:
      - 2.M1
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 직선 AD가 선분 BC의 수직이등분선이므로 교점 M은 선분 BC의 중점이고 $\overline{\mathrm{CM}}=\overline{\mathrm{BM}}=12$이다. 삼각형 ACD는 각 $\angle\mathrm{ACD}$가 직각인 삼각형이고, 점 C에서 선분 AD에 내린 수선의 발이 점 M이다. 따라서 $\overline{\mathrm{DM}}=x$라고 하면 직각삼각형의 성질에 의해 $x^2+12^2=l^2$이고 $25-x:12=12:x$를 얻는다.
      source_flow: 37609_4a86.pdf p.34 채점기준·p.37 예시답안 [논제 2]
      criteria:
      - 2.M1
    - id: 2b-2
      content: 이를 정리하면 $x^2-25x+144=0$이므로 $x$는 9 또는 16이다. 따라서 $l$의 값은 15 또는 20이다.
      source_flow: 37609_4a86.pdf p.34 채점기준·p.37 예시답안 [논제 2]
      criteria:
      - 2.A1
