  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\sin A=2\sin B\cos C$에 사인·코사인법칙을 쓰면 $b=c$. A가 BC의 수직이등분선 위이므로 AD는 지름, $\angle\mathrm{ACD}=\frac\pi2$, $\cos\theta=0$.
    steps:
    - id: 1a
      content: 삼각형 ABC가 이등변삼각형($b=c$), AD가 지름, $\theta=\dfrac\pi2$, $\cos\theta=0$
      criteria:
      - 1.M1
      - 1.M2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 삼각형 ABC의 외접원의 반지름의 길이를 $R$이라고 하면 $2R=25$이다. 사인법칙과 코사인법칙인 $\sin A=\dfrac a{2R}$, $\sin B=\dfrac b{2R}$, $c^2=a^2+b^2-2ab\cos C$를 적용하면 제시문 (ㄱ)의 (나) $\sin A=2\sin B\cos C$ 조건에 의해 $\dfrac a{2R}=\dfrac{2b}{2R}\cdot\dfrac{(a^2+b^2-c^2)}{2ab}$, 즉 $b=c$임을 알 수 있다. 따라서 삼각형 ABC는 이등변삼각형이다.
      source_flow: 37609_4a86.pdf p.34 채점기준·p.37 예시답안 [논제 1]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 네 점 A, B, C, D가 한 원 위에 있으므로 점 D는 삼각형 ABC의 외접원 위에 있다. 선분 BC의 수직이등분선이 점 A를 지나므로, 직선 AD가 선분 BC의 수직이등분선으로써 외접원의 중심을 지난다. 따라서 선분 AD가 외접원의 지름이고, 삼각형 ACD는 각 $\angle\mathrm{ACD}$가 직각인 삼각형이다. $\angle\mathrm{ACD}=\theta=\dfrac\pi2$이고, $\cos\theta=0$이다.
      source_flow: 37609_4a86.pdf p.34 채점기준·p.37 예시답안 [논제 1]
      criteria:
      - 1.M2
