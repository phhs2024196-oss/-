stimuli: []
stem: |
  다음 문항에 대해 문항별로 구체적인 풀이 과정과 답을 제시하시오.
subparts:
- id: '1'
  stem: |
    함수 $f(x)=\dfrac{\cos x}{2\sqrt{2}-2\sin x}$ $(0\le x\le2\pi)$의 최솟값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '-1/2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        몫의 미분법으로 $f'(x)=\dfrac{-\sin x(2\sqrt2-2\sin x)-\cos x(-2\cos x)}{(2\sqrt2-2\sin x)^2}=\dfrac{2-2\sqrt2\sin x}{(2\sqrt2-2\sin x)^2}$이다. (1)
      source_flow: 모범답안 p.22
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f'(x)=0$에서 $2-2\sqrt2\sin x=0$이므로 $x=\dfrac{\pi}{4}$ 또는 $x=\dfrac{3}{4}\pi$이다. (2)
      source_flow: 모범답안 p.22
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        증감표를 만들면 $f(x)$는 $0\le x\le\dfrac{\pi}{4}$에서 증가, $\dfrac{\pi}{4}\le x\le\dfrac{3}{4}\pi$에서 감소, $\dfrac{3}{4}\pi\le x\le2\pi$에서 증가하므로 $x=\dfrac{\pi}{4}$에서 극대, $x=\dfrac{3}{4}\pi$에서 극소이다. $\sin\dfrac{3}{4}\pi=\dfrac{1}{\sqrt2}$, $\cos\dfrac{3}{4}\pi=-\dfrac{1}{\sqrt2}$이므로 $f\left(\dfrac{3}{4}\pi\right)=\dfrac{-\frac{1}{\sqrt2}}{2\sqrt2-2\cdot\frac{1}{\sqrt2}}=\dfrac{-\frac{1}{\sqrt2}}{\sqrt2}=-\dfrac12$이다. (3) 따라서 $x=\dfrac{3}{4}\pi$에서 최소이고 최솟값은 $-\dfrac12$이다. (다른 풀이: 증감표 대신 $f(0)$, $f\left(\dfrac{\pi}{4}\right)$, $f\left(\dfrac{3}{4}\pi\right)$, $f(2\pi)$의 값을 비교해도 된다. $f(0)=f(2\pi)=\dfrac{1}{2\sqrt2}$, $f\left(\dfrac{\pi}{4}\right)=\dfrac12$)
      source_flow: 모범답안 p.22
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        몫의 미분법으로 도함수를 (1)과 같이 구한다. (미분은 정확하나 계산 오류로 잘못된 결과이면 3점)
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        도함수에서 극값을 갖는 조건을 (2)와 같이 $x=\dfrac{\pi}{4}$, $x=\dfrac{3}{4}\pi$ 두 값으로 구한다. (도함수를 정확히 구하고 조건을 1개만 구하면 도함수와 합해 12점)
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        증감표를 이용하거나 극값과 경계값을 비교하여 최솟값 $-\dfrac12$(3)을 구한다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    함수 $f(x)$가 다음과 같이 정의되어 있다.

    $$f(x)=\begin{cases}0 & (x<0)\\ \sin x & (0\le x\le\pi)\\ 0 & (x>\pi)\end{cases}$$

    이때, $\displaystyle\int_0^{2\pi}\left\{f(x)+f\left(x-\dfrac{\pi}{2}\right)\right\}^2dx$의 값을 구하시오. (50점)

    (필요시 $\cos2x=\cos^2x-\sin^2x=2\cos^2x-1=1-2\sin^2x$를 활용하시오.)
  points: 50
  depends_on: []
  answer:
    kind: value
    value: pi+1
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\sin\left(x-\dfrac{\pi}{2}\right)=-\cos x$이므로 $f\left(x-\dfrac{\pi}{2}\right)=\begin{cases}0 & \left(x<\dfrac{\pi}{2}\right)\\ -\cos x & \left(\dfrac{\pi}{2}\le x\le\dfrac32\pi\right)\\ 0 & \left(x>\dfrac32\pi\right)\end{cases}$이다. (4) 이때 $\displaystyle\int_0^{2\pi}\left\{f(x)+f\left(x-\dfrac{\pi}{2}\right)\right\}^2dx=\int_0^{2\pi}\{f(x)\}^2dx+2\int_0^{2\pi}f(x)f\left(x-\dfrac{\pi}{2}\right)dx+\int_0^{2\pi}\left\{f\left(x-\dfrac{\pi}{2}\right)\right\}^2dx$로 전개한다.
      source_flow: 모범답안 p.22
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\displaystyle\int_0^{2\pi}\{f(x)\}^2dx=\int_0^{\pi}\{f(x)\}^2dx+\int_{\pi}^{2\pi}\{f(x)\}^2dx=\int_0^{\pi}\sin^2x\,dx=\int_0^{\pi}\dfrac{1-\cos2x}{2}dx=\dfrac12\left[x-\dfrac12\sin2x\right]_0^{\pi}=\dfrac{\pi}{2}$이다. (5)
      source_flow: 모범답안 p.23
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $\displaystyle\int_0^{2\pi}\left\{f\left(x-\dfrac{\pi}{2}\right)\right\}^2dx=\int_{\frac{\pi}{2}}^{\frac32\pi}(-\cos x)^2dx=\int_{\frac{\pi}{2}}^{\frac32\pi}\dfrac{1+\cos2x}{2}dx=\dfrac12\left[x+\dfrac12\sin2x\right]_{\frac{\pi}{2}}^{\frac32\pi}=\dfrac{\pi}{2}$이다. (6)
      source_flow: 모범답안 p.23
      criteria:
      - 2.M3
    - id: 2b-4
      content: |
        $\displaystyle\int_0^{2\pi}f(x)f\left(x-\dfrac{\pi}{2}\right)dx$를 $\left[0,\dfrac{\pi}{2}\right]$, $\left[\dfrac{\pi}{2},\pi\right]$, $\left[\pi,\dfrac32\pi\right]$, $\left[\dfrac32\pi,2\pi\right]$로 나누면 첫째·셋째·넷째 구간에서는 두 인수 중 하나가 0이고, $\left[\dfrac{\pi}{2},\pi\right]$에서만 $\displaystyle\int_{\frac{\pi}{2}}^{\pi}\sin x(-\cos x)dx=-\left[\dfrac12\sin^2x\right]_{\frac{\pi}{2}}^{\pi}=\dfrac12$이다. (7)
      source_flow: 모범답안 p.23
      criteria:
      - 2.M4
    - id: 2b-5
      content: |
        따라서 구하는 값은 $\dfrac{\pi}{2}+2\times\dfrac12+\dfrac{\pi}{2}=\pi+1$이다. (8)
      source_flow: 모범답안 p.23
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $f\left(x-\dfrac{\pi}{2}\right)$를 (4)와 같이 구한다. (명시하지 않았어도 풀이 과정에 동등한 내용이 있으면 인정)
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 10
      evidence: |
        $\displaystyle\int_0^{2\pi}\{f(x)\}^2dx=\dfrac{\pi}{2}$ (5)를 구한다. (단순 계산 오류가 있으면 5점 감점 단위로 부분 인정)
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.M3
      mark_type: M
      points: 10
      evidence: |
        $\displaystyle\int_0^{2\pi}\left\{f\left(x-\dfrac{\pi}{2}\right)\right\}^2dx=\dfrac{\pi}{2}$ (6)을 구한다. (단순 계산 오류가 있으면 5점 감점 단위로 부분 인정)
      depends_on:
      - 2.M1
      steps:
      - 2b-3
    - id: 2.M4
      mark_type: M
      points: 15
      evidence: |
        곱의 정적분을 (7)과 같이 구간을 나누어 $\dfrac12$로 구한다. (공식 기준: (5), (6), (7) 중 둘을 정확히 구하고 나머지 하나에 단순 계산 오류가 있으면 합계 40점, 하나만 정확하고 나머지 둘에 각각 단순 계산 오류가 있으면 35점, 하나도 정확하지 않으나 과정이 맞고 각각 단순 계산 오류이면 30점)
      depends_on:
      - 2.M1
      steps:
      - 2b-4
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        (5), (6), (7)을 합하여 정적분 값 $\pi+1$ (8)을 구한다.
      depends_on:
      - 2.M2
      - 2.M3
      - 2.M4
      steps:
      - 2b-5
