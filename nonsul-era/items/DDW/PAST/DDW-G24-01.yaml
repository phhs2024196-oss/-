intent: 삼각함수의 몫의 미분으로 증감을 판정해 최솟값을 구하고, 삼각함수로 표현된 정적분을 구간을 나누어 계산하는 능력을 본다.
key_idea: |
  (1) 몫의 미분법으로 $f'(x)=\dfrac{2-2\sqrt2\sin x}{(2\sqrt2-2\sin x)^2}$를 얻고 증감표로 $x=\dfrac{3\pi}{4}$에서 최소임을 판정한다. (2) $f\left(x-\dfrac{\pi}{2}\right)$는 $\dfrac{\pi}{2}\le x\le\dfrac{3\pi}{2}$에서만 $-\cos x$이므로 제곱을 전개하고 각 항을 0이 아닌 구간으로 나누어 적분한다.
stuck: |
  (1) 분모의 부호·도함수 분자만 보고 극값 조건을 세우는 발상, 증감표에서 끝점값 $f(0)=f(2\pi)$까지 비교하는 일. (2) 이동한 함수 $f\left(x-\dfrac{\pi}{2}\right)$의 0이 아닌 구간을 찾아 $\int_0^{2\pi}$를 구간별로 쪼개는 일.
