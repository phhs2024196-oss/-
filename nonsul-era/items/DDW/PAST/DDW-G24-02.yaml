verify: verify/DDW-G24.py::p02
stimuli:
- label: 제시문
  body: |
    $x\ge0$에서 정의된 함수 $f(x)$는 다음과 같다.

    $$f(x)=\int_0^1|2t-x|\,dt$$
stem: |
  다음 제시문을 읽고 문항별로 구체적인 풀이 과정과 답을 제시하시오.
subparts:
- id: '1'
  stem: |
    $f(x)$를 구하시오. (45점)
  points: 45
  depends_on: []
  answer:
    kind: value
    value: Piecewise((x**2/2-x+1,x<=2),(x-1,x>2))
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $0\le x\le2$이면 $|2t-x|$는 $0\le t\le\dfrac{x}{2}$일 때 $x-2t$이고 $t>\dfrac{x}{2}$일 때 $2t-x$이다. (1) $x>2$일 때 적분 구간 $0\le t\le1$에서 $|2t-x|=x-2t$이다. (1)′
      source_flow: 모범답안 p.28
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $0\le x\le2$일 때 $f(x)=\displaystyle\int_0^{\frac{x}{2}}(x-2t)dt+\int_{\frac{x}{2}}^{1}(2t-x)dt=\Big[xt-t^2\Big]_0^{\frac{x}{2}}+\Big[t^2-xt\Big]_{\frac{x}{2}}^{1}$ (2)
      source_flow: 모범답안 p.28
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        위 식을 계산하면 $f(x)=\dfrac{x^2}{2}-x+1$이다. (3)
      source_flow: 모범답안 p.28
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $x>2$일 때 $f(x)=\displaystyle\int_0^1(x-2t)dt=\Big[xt-t^2\Big]_0^1$ (4) $=x-1$이다. (5)
      source_flow: 모범답안 p.28
      criteria:
      - 1.M2
      - 1.A2
    - id: 1b-5
      content: |
        즉 $f(x)=\begin{cases}\dfrac{x^2}{2}-x+1 & (0\le x\le2)\\ x-1 & (x>2)\end{cases}$이다. (6)
      source_flow: 모범답안 p.28
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $x$의 범위를 $0\le x\le2$와 $x>2$(또는 $0\le x<2$와 $x\ge2$)로 나누어 각 범위에서 $|2t-x|$의 부호를 (1), (1)′과 같이 정한다. (공식 기준: $x$의 범위를 나누고 $t$의 범위는 나누지 못하여 $\displaystyle\int_0^1(x-2t)dt$ 또는 $\displaystyle\int_0^1(2t-x)dt$ 등으로 구하면 합계 20점. $x$의 범위를 나누지 않고 $t$의 범위만 $\left[0,\dfrac{x}{2}\right]$, $\left[\dfrac{x}{2},1\right]$로 나누어 풀면 (3)까지 쓴 경우 35점, 계산 오류로 (3)을 못 구하면 30점. 범위를 나누지 않고 $\displaystyle\int_0^1(x-2t)dt=x-1$ 또는 $1-x$만 답이면 10점, 식만 제시하고 답이 없으면 5점)
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 10
      evidence: |
        각 범위에서 정적분 식 (2), (4)를 정확히 세운다. ($0\le x\le2$에서 $t$의 범위를 각각 0부터 $\dfrac{x}{2}$, $\dfrac{x}{2}$부터 1까지로 나눈 식 (2), $x>2$에서 식 (4). 두 식은 정확하나 계산 오류가 있으면 합계 30점)
      depends_on:
      - 1.M1
      steps:
      - 1b-2
      - 1b-4
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $0\le x\le2$에서 $f(x)=\dfrac{x^2}{2}-x+1$ (3)을 구한다. ((3), (5) 중 하나만 정확하면 합계 40점)
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: |
        $x>2$에서 $f(x)=x-1$ (5)를 구한다.
      depends_on:
      - 1.M2
      steps:
      - 1b-4
    - id: 1.A3
      mark_type: A
      points: 5
      evidence: |
        두 범위의 결과를 $f(x)$의 구간별 식 (6)으로 답안에 제시한다.
      depends_on:
      - 1.A1
      - 1.A2
      steps:
      - 1b-5
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $f(x)$가 최소가 되는 $x$를 구하고 $f(x)$의 최솟값을 구하시오. (15점)
  points: 15
  depends_on:
  - '1'
  answer:
    kind: value
    value: x=1; min=1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f'(x)=\begin{cases}x-1 & (0\le x\le2)\\ 1 & (x>2)\end{cases}$이다. (7) $f'(x)=0$을 만족시키는 $x$의 값은 $x=1$이다. (8)
      source_flow: 모범답안 p.28
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        증감표를 만들면 $0\le x\le1$에서 $f'(x)<0$이므로 $f(x)$는 감소하고($f(0)=1$), $x\ge1$에서 $f'(x)>0$이므로 증가한다($f(1)=\dfrac12$). 따라서 $f(x)$는 $x=1$에서 최소이고 최솟값은 $\dfrac12$이다. (9) (다른 풀이: 함수의 그래프의 개형을 그려 구해도 정답으로 처리한다.)
      source_flow: 모범답안 p.28
      criteria:
      - 2.R1
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 7
      evidence: |
        (1)에서 구한 $f(x)$를 미분하여 (7), (8)과 같이 $f'(x)=0$인 $x=1$을 구한다. ((1)에서 $f(x)=\dfrac{x^2}{2}-x+1$을 정확히 얻지 못했어도 자신의 결과에 맞추어 최소가 되는 $x$와 최솟값을 얻으려 최대한 노력하였고 논리 전개가 타당하며 계산 오류가 없으면 5점)
      depends_on:
      - 1.A3
      steps:
      - 2b-1
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        증감표 또는 그래프로 $f(x)$가 $x=1$에서 최소가 됨을 보인다. (보이지 않았으나 답이 맞으면 15점 중 13점)
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: |
        최솟값 $\dfrac12$(와 $x=1$)을 정확히 답한다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
