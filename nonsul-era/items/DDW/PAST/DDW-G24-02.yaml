intent: 절댓값 속의 식의 부호가 바뀌는 점을 기준으로 적분 구간을 나누어 정적분 값을 구하고, 그 결과를 미분하여 증감으로 최솟값을 구하는 능력을 본다.
key_idea: |
  $|2t-x|$의 부호는 $t=\dfrac{x}{2}$에서 바뀌므로 $\dfrac{x}{2}$가 적분 구간 $[0,1]$ 안에 있는지($0\le x\le2$ 또는 $x>2$)로 나누어 $f(x)$를 구하고, 그 도함수의 부호로 최솟값을 찾는다.
stuck: |
  $x$의 값에 따라 $\dfrac{x}{2}$가 $[0,1]$ 안에 있는지 밖에 있는지로 경우를 나누는 일, 그리고 $t$의 범위를 $0\le t\le\dfrac{x}{2}$와 $\dfrac{x}{2}\le t\le1$로 나누어 절댓값을 푸는 일.
