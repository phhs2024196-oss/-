key_idea: |
  (1) $\mathrm{P}(A\cap B^c)=\mathrm{P}(A)-\mathrm{P}(A\cap B)$와 $\mathrm{P}(A\cup B)$로 조건부 확률 $\mathrm{P}(A\cap B^c\mid A\cup B)$를 구한다. (2) 주어진 두 확률로 $\sigma$와 $m$을 정하고 표본평균 $\overline{X}$가 $\mathrm{N}\left(m,\dfrac{\sigma^2}{25}\right)$을 따름을 이용해 총합 조건을 $\overline{X}\ge21$로 바꾼다.
stuck: |
  (1) "리스트에 기록됨"을 $A\cup B$, "A만"을 $A\cap B^c$로 번역하는 일. (2) 표본 25개의 총 횟수를 표본평균 $\overline{X}$로 바꾸고 표본평균의 표준편차 $\dfrac{\sigma}{\sqrt{25}}$를 쓰는 일.
