stimuli:
- label: 가
  body: |
    어느 병원에서 환자들의 질문에 답변을 제공하는 생성형 인공지능을 도입하려고 한다. 동일한 데이터를 다른 방법으로 학습한 인공지능 A와 B를 평가하기 위해 의료 전문가를 고용하여 인공지능의 답변을 정답 혹은 오답으로 분류하도록 하였다. 적어도 한 인공지능이 오답을 생성하면 그 질문은 재평가를 위해 리스트에 기록된다. 인공지능 A는 질문에 오답을 생성할 확률이 $0.01$이고, 인공지능 B는 질문에 오답을 생성할 확률이 $0.005$이며, 두 인공지능 A와 B가 동시에 오답을 생성할 확률은 $0.0002$이다.
- label: 나
  body: |
    이 병원에서 인공지능 B를 도입하기로 하고 인공지능 B가 생성한 답변 문서들을 분석하였다. 인공지능 B가 생성한 한 개의 답변 문서에서 "통증"이라는 단어의 사용 빈도수를 $X$회라 할 때, 확률변수 $X$는 정규분포 $\mathrm{N}(m,\sigma^2)$을 따른다고 한다. 이때, $\mathrm{P}(|X-m|\le10)=0.9544$, $\mathrm{P}(X\le25)=0.8413$을 만족시킨다.
stem: |
  다음 제시문을 읽고 문항별로 구체적인 풀이 과정과 답을 제시하시오.
subparts:
- id: '1'
  stem: |
    (가) 제시문을 읽고 물음에 답하시오. 어떤 질문이 리스트에 기록되었을 때, 인공지능 A만 오답을 생성했을 확률을 $\dfrac{b}{a}$라 하자. $a+b$의 값을 구하시오. (단, $a$, $b$는 서로소인 자연수이다.) (40점)
  points: 40
  depends_on: []
  answer:
    kind: value
    value: '123'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        인공지능 A가 오답을 생성하는 사건을 $A$, 인공지능 B가 오답을 생성하는 사건을 $B$라 하면 $\mathrm{P}(A)=0.01$, $\mathrm{P}(B)=0.005$, $\mathrm{P}(A\cap B)=0.0002$이다. 적어도 한 인공지능이 오답을 생성할 확률은 $\mathrm{P}(A\cup B)=\mathrm{P}(A)+\mathrm{P}(B)-\mathrm{P}(A\cap B)=0.01+0.005-0.0002=0.0148$이다. (1)
      source_flow: 모범답안 p.32
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        인공지능 A만 오답을 생성할 확률은 $\mathrm{P}(A\cap B^c)=\mathrm{P}(A)-\mathrm{P}(A\cap B)=0.01-0.0002=0.0098$이다. (2) (다른 풀이: $\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}=\dfrac{0.0002}{0.01}=0.02$ (2)-1, $\mathrm{P}(B^c\mid A)=1-0.02=0.98$ (2)-2, $\mathrm{P}(A\cap B^c)=\mathrm{P}(A)\mathrm{P}(B^c\mid A)=0.01\times0.98=0.0098$ (2)-3)
      source_flow: 모범답안 p.32
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        적어도 한 인공지능이 오답을 생성했을 때 인공지능 A만 오답을 생성했을 확률은 $\mathrm{P}(A\cap B^c\mid A\cup B)=\dfrac{\mathrm{P}(A\cap B^c)}{\mathrm{P}(A\cup B)}=\dfrac{0.0098}{0.0148}=\dfrac{98}{148}=\dfrac{49}{74}$이다. (3) 따라서 $a=74$, $b=49$이므로 $a+b=123$이다.
      source_flow: 모범답안 p.32
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        덧셈정리로 적어도 한 인공지능이 오답을 생성할 확률 $\mathrm{P}(A\cup B)=0.0148$ (1)을 구한다. (서술했으나 답을 구하지 못하면 5점)
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 25
      evidence: |
        인공지능 A만 오답을 생성할 확률 $0.0098$을 (2) 또는 (2)-1, (2)-2, (2)-3과 같이 구한다. (벤다이어그램으로 설명하여 구해도 25점, 여사건의 개념을 적용하지 않았거나 생략하고 답만 구하면 20점)
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        조건부 확률 $\dfrac{49}{74}$ (3)과 $a+b=123$을 구한다. (전 과정을 옳게 서술하였으나 최종 계산에서 오류가 있으면 합계 35점, (1)과 (2) 과정을 구체적으로 서술하지 않았으나 답을 구하면 합계 30점)
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (나) 제시문을 읽고 물음에 답하시오. 인공지능 B가 생성한 답변 문서 중 임의추출한 $25$개의 표본에서 "통증"이라는 단어가 등장한 총 횟수가 $525$회 이상일 확률을 $p$라 한다. 주어진 표준정규분포표를 이용하여 $p$를 구하시오. (30점)

    | $z$ | $\mathrm{P}(0\le Z\le z)$ |
    |---|---|
    | $1.0$ | $0.3413$ |
    | $1.5$ | $0.4332$ |
    | $2.0$ | $0.4772$ |
    | $2.5$ | $0.4938$ |
  points: 30
  depends_on: []
  answer:
    kind: value
    value: '0.1587'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $Z=\dfrac{X-m}{\sigma}$은 표준정규분포 $\mathrm{N}(0,1^2)$을 따르므로 $\mathrm{P}(|X-m|\le10)=\mathrm{P}\left(|Z|\le\dfrac{10}{\sigma}\right)=2\mathrm{P}\left(0\le Z\le\dfrac{10}{\sigma}\right)=0.9544$에서 $\mathrm{P}\left(0\le Z\le\dfrac{10}{\sigma}\right)=0.4772$이다. 표에서 $\mathrm{P}(0\le Z\le2)=0.4772$이므로 $\dfrac{10}{\sigma}=2$, $\sigma=5$이다. (1)
      source_flow: 모범답안 p.33
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\mathrm{P}(X\le25)=\mathrm{P}\left(Z\le\dfrac{25-m}{5}\right)=0.5+\mathrm{P}\left(0\le Z\le\dfrac{25-m}{5}\right)=0.8413$에서 $\mathrm{P}\left(0\le Z\le\dfrac{25-m}{5}\right)=0.3413$이다. 표에서 $\mathrm{P}(0\le Z\le1)=0.3413$이므로 $\dfrac{25-m}{5}=1$, $m=20$이다. (2)
      source_flow: 모범답안 p.33
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $X$는 정규분포 $\mathrm{N}(20,5^2)$을 따르므로 크기가 25인 표본의 표본평균 $\overline{X}$는 정규분포 $\mathrm{N}\left(20,\dfrac{5^2}{25}\right)$, 곧 $\mathrm{N}(20,1^2)$을 따른다. (3)
      source_flow: 모범답안 p.33
      criteria:
      - 2.M3
    - id: 2b-4
      content: |
        $Z=\dfrac{\overline{X}-20}{1}$이라 하면 $Z$는 표준정규분포를 따르므로 $p=\mathrm{P}(25\overline{X}\ge525)=\mathrm{P}(\overline{X}\ge21)=\mathrm{P}\left(Z\ge\dfrac{21-20}{1}\right)=\mathrm{P}(Z\ge1)=0.5-\mathrm{P}(0\le Z\le1)=0.5-0.3413=0.1587$이다. (4)
      source_flow: 모범답안 p.33
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $\mathrm{P}(|X-m|\le10)=0.9544$를 표준화하여 표에서 $\sigma=5$ (1)를 구한다. (서술하고 $\sigma$는 구했으나 평균을 못 구하면 5점, $m$만 구하고 $\sigma$를 못 구해도 5점)
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: |
        $\mathrm{P}(X\le25)=0.8413$을 표준화하여 표에서 $m=20$ (2)를 구한다. ((1)과 (2)를 옳게 서술하여 답을 구하면 정규분포의 평균·표준편차 부분 합계 10점)
      steps:
      - 2b-2
    - id: 2.M3
      mark_type: M
      points: 15
      evidence: |
        표본평균의 분포 $\mathrm{N}\left(20,\dfrac{5^2}{25}\right)$ (3)을 옳게 구한다. ((1), (2), (3)을 옳게 서술하고 답을 구하면 표본평균의 표준편차 부분 15점)
      depends_on:
      - 2.M1
      - 2.M2
      steps:
      - 2b-3
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        총 횟수 525회를 $\overline{X}\ge21$로 바꾸어 표준정규분포표로 $p=0.1587$ (4)를 구한다. ((4)까지 옳게 서술하였으나 표준정규분포표를 이용하여 답을 구하지 못하면 합계 20점, 최종 계산에서 오류가 있으면 합계 25점, (1), (2) 단계를 생략하였으나 답을 구하면 합계 20점)
      depends_on:
      - 2.M3
      steps:
      - 2b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
