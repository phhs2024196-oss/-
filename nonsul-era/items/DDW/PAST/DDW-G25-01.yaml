key_idea: $x^2=\dfrac{a}{x+3a}$를 $f(x)=x^3+3ax^2-a=0$로 바꾸면 서로 다른 두 실근을 가질 조건은 극댓값 $f(-2a)=0$이다. $a=\dfrac12$이면 $f(x)=(x+1)^2\left(x-\dfrac12\right)$이므로 교점은 $x=-1,\dfrac12$이고, $\displaystyle\int_{-1}^{\frac12}\left(\dfrac{a}{x+3a}-x^2\right)dx$로 넓이를 구한다.
stuck: 서로 다른 두 점에서 만난다는 조건을 삼차방정식이 중근을 갖는다(극값 중 하나가 0)는 조건으로 바꾸지 못한다. 극솟값 $f(0)=-a<0$이므로 극댓값 $f(-2a)=0$이어야 함을 놓친다.
