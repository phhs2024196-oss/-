stimuli:
- label: 가
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 $S=\displaystyle\int_a^b\lvert f(x)-g(x)\rvert dx$이다.
- label: 나
  body: |
    양수 $a$에 대하여 두 곡선 $y=x^2$, $y=\dfrac{a}{x+3a}$가 서로 다른 두 점에서 만난다.
stem: |
  다음 제시문을 읽고 문항별로 구체적인 풀이과정과 답을 제시하시오. [70점]
subparts:
- id: 1-1
  stem: |
    제시문(나)에서 $a$의 값을 구하시오. (25점)
  points: 25
  depends_on: []
  answer:
    kind: value
    value: 1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $y=x^2$와 $y=\dfrac{a}{x+3a}$가 서로 다른 두 점에서 만나므로 방정식 $x^2=\dfrac{a}{x+3a}$는 서로 다른 두 실근을 가진다. (1)
      source_flow: 모범답안 p.33 [문제 1-1]
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $x^2(x+3a)-a$를 $f(x)$라 하면 $f'(x)=3x^2+6ax=3x(x+2a)=0$이 되는 $x$ 좌표는 $0$과 $-2a$이다. (2)
      source_flow: 모범답안 p.33 [문제 1-1]
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        $f(x)=0$이 서로 다른 두 근을 가지므로 $f(x)$의 극댓값 혹은 극솟값이 $0$이어야 한다. 극솟값이 $0$인 경우 $f(0)=-a$이며 $a$는 양의 실수이므로 이 경우는 극값이 $0$이 될 수 없다. 극댓값이 $0$인 경우 $f(-2a)=0$이어야 한다. (3)
      source_flow: 모범답안 p.33 [문제 1-1]
      criteria:
      - 1-1.M3
    - id: 11b-4
      content: |
        $f(-2a)=(-2a)^2(-2a+3a)-a=4a^3-a=0$이다. 따라서 양의 실수 $a$는 $\dfrac12$이다. (4)
      source_flow: 모범답안 p.33 [문제 1-1]
      criteria:
      - 1-1.A1
  rubric:
    rules: &id001
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: (1)과 같이 두 곡선이 서로 다른 두 점에서 만난다는 조건을 방정식 $x^2=\dfrac{a}{x+3a}$(또는 $f(x)=0$)이 서로 다른 두 실근을 갖는다는 식으로 세운다. (공식 20% → 5점)
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 5
      evidence: (2)와 같이 $f(x)=x^3+3ax^2-a$의 도함수를 구하고 극값을 갖는 $x$ 좌표 $0$, $-2a$를 구한다. ((1)~(2) 정확 시 공식 40% → 누적 10점)
      steps:
      - 11b-2
    - id: 1-1.M3
      mark_type: M
      points: 10
      evidence: (3)과 같이 서로 다른 두 실근이면 극댓값 또는 극솟값이 $0$임을 쓰고, $f(0)=-a<0$이므로 극솟값은 $0$이 될 수 없어 극댓값 $f(-2a)=0$이어야 함을 보인다. ((1)~(4) 전개했으나 답이 틀린 경우 공식 80% → 누적 20점)
      steps:
      - 11b-3
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: (4)와 같이 $4a^3-a=0$에서 $a=\dfrac12$를 구한다. (전 과정 옳고 답을 구하면 공식 100% → 누적 25점)
      steps:
      - 11b-4
      depends_on:
      - 1-1.M3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    이때, 두 곡선 $y=x^2$, $y=\dfrac{a}{x+3a}$로 둘러싸인 도형의 넓이를 구하시오. (45점)
  points: 45
  depends_on:
  - 1-1
  answer:
    kind: value
    value: log(2) - 3/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        문제 [1-1]에서 구한 $a$를 $f(x)$에 대입하면 $f(x)=x^3+\dfrac32x^2-\dfrac12=(x^2+2x+1)\left(x-\dfrac12\right)$이다. 두 곡선의 교점의 $x$ 좌표는 각각 $-1$과 $\dfrac12$이다. (1)
      source_flow: 모범답안 p.33 [문제 1-2]
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $-1\le x\le\dfrac12$의 구간에서 두 곡선으로 둘러싸인 도형의 넓이는 $\displaystyle\int_{-1}^{\frac12}\dfrac{a}{x+3a}dx-\int_{-1}^{\frac12}x^2dx$이다. (2)
      source_flow: 모범답안 p.33 [문제 1-2]
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        $\displaystyle\int_{-1}^{\frac12}\dfrac{a}{x+3a}dx-\int_{-1}^{\frac12}x^2dx=\left[a\ln(x+3a)-\dfrac13x^3\right]_{-1}^{\frac12}=\left[\dfrac12\ln\left(x+\dfrac32\right)-\dfrac13x^3\right]_{-1}^{\frac12}$ (3)
      source_flow: 모범답안 p.33 [문제 1-2]
      criteria:
      - 1-2.M3
    - id: 12b-4
      content: |
        따라서 도형의 넓이는 $\ln2-\dfrac38$이다. (4)
      source_flow: 모범답안 p.33 [문제 1-2]
      criteria:
      - 1-2.A1
  rubric:
    rules: *id001
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 9
      evidence: (1)과 같이 $a=\dfrac12$를 대입해 인수분해하고 교점의 $x$ 좌표 $-1$, $\dfrac12$를 구한다. (공식 20% → 9점)
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 13
      evidence: (2)와 같이 위·아래 곡선의 차를 $[-1,\frac12]$에서 적분하는 식으로 넓이를 세운다. (공식 50% = 22.5점 → 정수로 누적 22점)
      steps:
      - 12b-2
    - id: 1-2.M3
      mark_type: M
      points: 18
      evidence: (3)과 같이 로그·다항 부정적분을 구해 정적분 식을 정리한다. ((1)~(3)을 전개했으나 답이 틀린 경우 공식 90% = 40.5점 → 정수로 누적 40점)
      steps:
      - 12b-3
    - id: 1-2.A1
      mark_type: A
      points: 5
      evidence: (4)와 같이 넓이 $\ln2-\dfrac38$을 구한다. (전 과정 옳고 답을 구하면 공식 100% → 누적 45점)
      steps:
      - 12b-4
      depends_on:
      - 1-2.M3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
