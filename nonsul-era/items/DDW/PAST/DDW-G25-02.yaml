stimuli:
- label: 가
  body: |
    첫째항이 $a$, 공차가 $d$인 등차수열의 일반항 $a_n$은 $a_n=a+(n-1)d$ ($n=1,2,3,\cdots$)이다.
    첫째항이 $a$, 공차가 $d$인 등차수열의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 할 때,
    $S_n=\dfrac{n\{2a+(n-1)d\}}{2}$이다.
- label: 나
  body: |
    첫째항이 $3$인 등차수열 $\{a_n\}$에 대하여 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 할 때, $S_5=-15$이다. 등차수열 $\{b_n\}$은 $b_1=1$이고 $b_2+b_4=18$이다. 원 $C_k$ ($k=1,2,3,\cdots$)는 중심이 $\mathrm{O}_k(a_k,b_k)$이고 반지름의 길이가 $r_k=\dfrac12k+1$인 원이다. 원 $C_n$ 위의 점 $\mathrm{P}$와 점 $\mathrm{O}_n$, 점 $\mathrm{O}_{n+1}$을 세 꼭짓점으로 하는 삼각형 $\mathrm{PO}_n\mathrm{O}_{n+1}$의 넓이가 최대일 때, 그 삼각형의 넓이를 $T_n$이라 하자.
stem: |
  다음 제시문을 읽고 구체적인 풀이과정과 답을 제시하시오. [60점]
subparts:
- id: 2-1
  stem: |
    제시문(나)에서 $\displaystyle\sum_{k=1}^{n}T_k>65$를 만족하는 자연수 $n$의 최솟값을 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: '9'
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $\{a_n\}$의 공차를 $d_a$라 하면 $S_5=-15=\dfrac{5\{2\times3+(5-1)d_a\}}{2}$이므로 $d_a=-3$이고, $a_n=-3n+6$이다. (1)
      source_flow: 모범답안 p.37
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $\{b_n\}$의 공차를 $d_b$라 하면 $b_2+b_4=2b_1+4d_b=2+4d_b=18$이므로 $d_b=4$이고, $b_n=4n-3$이다. (2)
      source_flow: 모범답안 p.37
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        두 원 $C_n$과 $C_{n+1}$의 중심 사이의 거리는 $\sqrt{(d_a)^2+(d_b)^2}=\sqrt{(-3)^2+4^2}=5$로 일정하다. (3)
      source_flow: 모범답안 p.37
      criteria:
      - 2-1.M3
    - id: 21b-4
      content: |
        삼각형의 넓이가 최대가 되기 위해서는 삼각형의 높이가 원 $C_n$의 반지름 길이와 같아야 하므로 $T_n=\dfrac12\times5\times\left(\dfrac12n+1\right)=\dfrac54n+\dfrac52$임을 알 수 있다. (4)
      source_flow: 모범답안 p.37
      criteria:
      - 2-1.M4
    - id: 21b-5
      content: |
        $T_n$은 첫째항이 $\dfrac{15}{4}$이고 공차가 $\dfrac54$인 등차수열이므로 $\displaystyle\sum_{k=1}^{n}T_k=\dfrac{n\times\left(2\times\dfrac{15}{4}+(n-1)\times\dfrac54\right)}{2}=\dfrac n2\left(\dfrac{25}{4}+\dfrac54n\right)=\dfrac58n(n+5)$임을 알 수 있다. (5)
      source_flow: 모범답안 p.37
      criteria:
      - 2-1.M5
    - id: 21b-6
      content: |
        주어진 조건에 따라 $\dfrac58n(n+5)>65$를 정리하면 $(n+13)(n-8)>0$이다. (6)
      source_flow: 모범답안 p.37
      criteria:
      - 2-1.M6
    - id: 21b-7
      content: |
        따라서 이를 만족하는 자연수 $n$의 최솟값은 $9$이다. (7)
      source_flow: 모범답안 p.37
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 6
      evidence: (1)과 같이 $S_5=-15$에서 공차 $d_a=-3$과 $a_n=-3n+6$을 구한다. ((1) 또는 (2) 중 하나만 정확 시 공식 10% → 6점)
      steps:
      - 21b-1
    - id: 2-1.M2
      mark_type: M
      points: 6
      evidence: (2)와 같이 $b_2+b_4=18$에서 공차 $d_b=4$와 $b_n=4n-3$을 구한다. ((1)~(2) 정확, (3)에서 오류 시 공식 20% → 누적 12점)
      steps:
      - 21b-2
    - id: 2-1.M3
      mark_type: M
      points: 6
      evidence: (3)과 같이 이웃한 두 원의 중심 사이 거리 $5$를 구한다. ((1)~(3) 정확, (4)에서 오류 시 공식 30% → 누적 18점)
      steps:
      - 21b-3
    - id: 2-1.M4
      mark_type: M
      points: 12
      evidence: (4)와 같이 높이가 반지름과 같을 때 넓이가 최대임을 이용해 $T_n=\dfrac54n+\dfrac52$를 구한다. ((1)~(4) 정확, (5)에서 오류 시 공식 50% → 누적 30점)
      steps:
      - 21b-4
    - id: 2-1.M5
      mark_type: M
      points: 6
      evidence: (5)와 같이 $T_n$이 등차수열임을 이용해 $\displaystyle\sum_{k=1}^{n}T_k=\dfrac58n(n+5)$를 구한다. (M1~M5 누적 36점)
      steps:
      - 21b-5
    - id: 2-1.M6
      mark_type: M
      points: 6
      evidence: (6)과 같이 $\dfrac58n(n+5)>65$를 정리해 $(n+13)(n-8)>0$을 얻는 논리적 전개를 보인다. ((1)~(6) 정확, 최솟값이 틀리거나 없으면 공식 70% → 누적 42점)
      steps:
      - 21b-6
    - id: 2-1.A1
      mark_type: A
      points: 18
      evidence: (7)과 같이 $n$의 최솟값 $9$를 구한다. (공식 100% → 누적 60점. (1)~(5)만 정확하고 (6)의 논리 전개 없이 답만 쓴 경우 공식 80% = 48점이므로, 이 경우 총점은 공식대로 48점을 넘지 않는다)
      steps:
      - 21b-7
      depends_on:
      - 2-1.M5
