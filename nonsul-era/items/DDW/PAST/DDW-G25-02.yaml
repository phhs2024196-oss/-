key_idea: 두 원의 중심 $\mathrm{O}_n(a_n,b_n)$, $\mathrm{O}_{n+1}$ 사이의 거리는 공차 $(-3,4)$로부터 $5$로 일정하다. 밑변이 일정하므로 높이가 최대, 곧 $\mathrm{O}_n\mathrm{P}\perp\mathrm{O}_n\mathrm{O}_{n+1}$일 때 높이 $=r_n$이어서 $T_n=\dfrac12\cdot5\cdot r_n=\dfrac54n+\dfrac52$ (등차수열)이다.
stuck: 삼각형 $\mathrm{PO}_n\mathrm{O}_{n+1}$의 넓이가 최대일 조건(밑변 $\mathrm{O}_n\mathrm{O}_{n+1}$이 일정하므로 높이 최대, 곧 $\mathrm{O}_n\mathrm{P}$가 밑변에 수직이라 높이 $=r_n$)을 세우지 못한다.
