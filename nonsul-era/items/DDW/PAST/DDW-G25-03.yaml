key_idea: $f(t)=e^{-t}-e^{-4}\ge0\iff t\le4$이므로 $g(f(t))=f(t)\,(t\le4)$, $0\,(t>4)$이다. 적분 구간 $[x,x+2]$가 $t=4$를 포함하는 위치에 따라 $x\le2$, $2<x\le4$, $x>4$로 나누어 $h(x)$를 구한다.
stuck: 합성함수 $g(f(t))$의 정의를 $f(t)$의 부호로 바꾸지 못하고, $f(t)=0$이 되는 $t=4$를 경계로 적분 구간을 나누어야 함을 놓친다.
