stimuli:
- label: 제시문
  body: |
    함수 $f(x)=e^{-x}-\dfrac{1}{e^4}$, $g(x)=\begin{cases}x & (x\ge0)\\0 & (x<0)\end{cases}$에 대하여 $h(x)=\displaystyle\int_x^{x+2}g(f(t))dt$이다.
    (단, $\displaystyle\lim_{x\to0}(1+x)^{\frac1x}=e$이다.)
stem: |
  다음 제시문을 읽고 구체적인 풀이과정과 답을 제시하시오. [70점]
subparts:
- id: 3-1
  stem: |
    제시문의 정적분을 구하여 $x$의 구간에 따라 $h(x)$를 제시한 후, $h(1)-h(3)-h(5)$를 구하시오.
  points: 70
  depends_on: []
  answer:
    kind: value
    value: H1=-exp(-x-2)+exp(-x)-2*exp(-4); H2=exp(-x)+(x-5)*exp(-4); H3=0; D=exp(-1)-2*exp(-3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $g(f(t))=\begin{cases}e^{-t}-\dfrac{1}{e^4} & (t\le4)\\0 & (t>4)\end{cases}$ (1)
      source_flow: 모범답안 p.41
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $x\le2$일 때 $h(x)=\displaystyle\int_x^{x+2}g\left(e^{-t}-\dfrac{1}{e^4}\right)dt=\int_x^{x+2}\left(e^{-t}-\dfrac{1}{e^4}\right)dt=\left[-e^{-t}-\dfrac{t}{e^4}\right]_x^{x+2}=-e^{-x-2}+e^{-x}-\dfrac{2}{e^4}$ (2)
      source_flow: 모범답안 p.41
      criteria:
      - 3-1.M1
    - id: 31b-3
      content: |
        $2<x\le4$일 때 $g\left(e^{-t}-\dfrac{1}{e^4}\right)$가 $t>4$일 때 $0$이므로 $h(x)=\displaystyle\int_x^{x+2}g\left(e^{-t}-\dfrac{1}{e^4}\right)dt=\int_x^4\left(e^{-t}-\dfrac{1}{e^4}\right)dt=\left[-e^{-t}-\dfrac{t}{e^4}\right]_x^4=e^{-x}+\dfrac{x-5}{e^4}$ (3)
      source_flow: 모범답안 p.41
      criteria:
      - 3-1.M2
    - id: 31b-4
      content: |
        $x>4$일 때 $g\left(e^{-t}-\dfrac{1}{e^4}\right)$가 모든 적분 구간에서 $0$이므로 $h(x)=0$ (4)
      source_flow: 모범답안 p.41
      criteria:
      - 3-1.M3
    - id: 31b-5
      content: |
        따라서 $h(x)=\begin{cases}-e^{-x-2}+e^{-x}-\dfrac{2}{e^4} & (x\le2)\\e^{-x}+\dfrac{x-5}{e^4} & (2<x\le4)\\0 & (x>4)\end{cases}$ (5)
      source_flow: 모범답안 p.41
      criteria:
      - 3-1.M1
      - 3-1.M2
      - 3-1.M3
    - id: 31b-6
      content: |
        $h(1)=-\dfrac{1}{e^3}+\dfrac1e-\dfrac{2}{e^4}$ (6)  [별해 (6ʹ): $h(1)=\displaystyle\int_1^3\left(e^{-t}-\dfrac{1}{e^4}\right)dt=\left[-e^{-t}-\dfrac{t}{e^4}\right]_1^3=\dfrac1e-\dfrac{1}{e^3}-\dfrac{2}{e^4}$]
      source_flow: 모범답안 p.41
      criteria:
      - 3-1.A1
    - id: 31b-7
      content: |
        $h(3)=\dfrac{1}{e^3}-\dfrac{2}{e^4}$ (7)  [별해 (7ʹ): $h(3)=\displaystyle\int_3^5g\left(e^{-t}-\dfrac{1}{e^4}\right)dt=\int_3^4\left(e^{-t}-\dfrac{1}{e^4}\right)dt+\int_4^50\,dt=\left[-e^{-t}-\dfrac{t}{e^4}\right]_3^4=\dfrac{1}{e^3}-\dfrac{2}{e^4}$]
      source_flow: 모범답안 p.41
      criteria:
      - 3-1.A1
    - id: 31b-8
      content: |
        $h(5)=0$ (8)  [별해 (8ʹ): $h(5)=\displaystyle\int_5^7g\left(e^{-t}-\dfrac{1}{e^4}\right)dt=\int_5^70\,dt=0$]
      source_flow: 모범답안 p.41
      criteria:
      - 3-1.A1
    - id: 31b-9
      content: |
        따라서 $h(1)-h(3)-h(5)=\dfrac1e-\dfrac{2}{e^3}$ (9)
      source_flow: 모범답안 p.41
      criteria:
      - 3-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 28
      evidence: (1)·(2)·(5)와 같이 $g(f(t))$를 구하고 $x\le2$ 구간의 $h(x)=-e^{-x-2}+e^{-x}-\dfrac{2}{e^4}$를 정확히 구한다. (5)의 3개 구간 중 어느 1개 구간만 정확하면 공식 40% = 28점, 구간은 순서 무관하게 1개째 28점)
      steps:
      - 31b-1
      - 31b-5
    - id: 3-1.M2
      mark_type: M
      points: 21
      evidence: (3)과 같이 $t>4$에서 $g(f(t))=0$임을 이용해 적분 상한을 $4$로 바꾸어 $2<x\le4$ 구간의 $h(x)=e^{-x}+\dfrac{x-5}{e^4}$를 구한다. (2개 구간 정확 시 공식 70% = 49점 → 누적 49점)
      steps:
      - 31b-3
      - 31b-5
    - id: 3-1.M3
      mark_type: M
      points: 10
      evidence: (4)와 같이 $x>4$에서 $h(x)=0$임을 구한다. (3개 구간 모두 정확하나 (9)가 틀린 경우 공식 85% = 59.5점 → 정수로 누적 59점)
      steps:
      - 31b-4
      - 31b-5
    - id: 3-1.A1
      mark_type: A
      points: 11
      evidence: '(9)와 같이 $h(1)-h(3)-h(5)=\dfrac1e-\dfrac{2}{e^3}$를 구한다. (전체 100% = 70점. 대안: $h(x)$를 제시하지 않고 (6ʹ)(7ʹ)(8ʹ)로 $h(1),h(3),h(5)$를 각각 구해 값을 내면 3개 모두 정확 시 공식 40% = 28점, 2개 정확 20% = 14점, 1개 정확 10% = 7점. 이 경로의 점수는 이 마크와 별개로 최대 28점을 넘지 않는다)'
      steps:
      - 31b-6
      - 31b-7
      - 31b-8
      - 31b-9
      depends_on:
      - 3-1.M3
