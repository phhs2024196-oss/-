  - 함수 $h(x)=(1+e^{x})(1+e^{2x})\cdots(1+e^{10x})$
  concepts:
  - 함수의 극한의 성질(분모 극한 0이면 분자 극한 0)
  - 미분계수의 정의
  - 자연로그 $\ln x$의 도함수
  - $\ln\lvert f(x)\rvert$의 도함수
  - 합성함수의 미분(지수함수)
  - 시그마의 뜻과 자연수의 합
  tools:
  - 분모·분자를 $x-e$로 나누어 곱의 극한으로 분리
  - $\ln e=1$, $f(e)=1$ 대입으로 $\ln x-1=\ln x-\ln e$, $f(x)-1=f(x)-f(e)$ 꼴 만들기
  - 로그 취하기와 로그의 합 성질
  - 극한의 곱의 성질
  conditions:
  - $f(x)$는 실수 전체의 집합에서 미분가능
  - $\displaystyle\lim_{x\to e}\dfrac{f(x)-1}{\ln x-1}=5$
  - '$h''(x)/h(x)$는 $x=0$에서 $h(0)=2^{10}\ne0$이라 극한이 정의됨'
