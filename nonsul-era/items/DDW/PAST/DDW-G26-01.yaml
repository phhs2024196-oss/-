stimuli:
- label: 가
  body: |
    두 함수 $f(x)$와 $g(x)$에서 $\displaystyle\lim_{x\to a}\dfrac{f(x)}{g(x)}=b$ ($g(x)\neq0$, $b$는 실수)이고 $\displaystyle\lim_{x\to a}g(x)=0$이면

    $\displaystyle\lim_{x\to a}f(x)=\lim_{x\to a}\left\{\dfrac{f(x)}{g(x)}\times g(x)\right\}=\lim_{x\to a}\dfrac{f(x)}{g(x)}\times\lim_{x\to a}g(x)=b\times0=0$이므로

    $\displaystyle\lim_{x\to a}f(x)=0$이다.
- label: 나
  body: |
    함수 $f(x)$의 $x=a$에서의 미분계수는 $f'(a)=\displaystyle\lim_{x\to a}\dfrac{f(x)-f(a)}{x-a}$이다.
- label: 다
  body: |
    무리수 $e$는 $e=\displaystyle\lim_{x\to\infty}\left(1+\dfrac{1}{x}\right)^{x}$로 정의하고, 무리수 $e$를 밑으로 하는 로그 $\log_e x$를 자연로그라 하고 간단히 $\ln x$로 나타낸다.
- label: 라
  body: |
    로그함수 $y=\ln\lvert x\rvert$의 도함수는 $y'=\dfrac{1}{x}$이고, 미분가능한 함수 $f(x)$에 대하여 함수 $y=\ln\lvert f(x)\rvert$의 도함수는 $y'=\dfrac{f'(x)}{f(x)}$이다. (단, $f(x)\neq0$)
stem: |
  다음 제시문을 읽고 문항별로 구체적인 풀이과정과 답을 제시하시오. [70점]
subparts:
- id: 1-1
  stem: |
    실수 전체의 집합에서 미분가능한 함수 $f(x)$가 $\displaystyle\lim_{x\to e}\dfrac{f(x)-1}{\ln x-1}=5$를 만족시킬 때, $f(e)$와 $f'(e)$의 값을 구하시오. (45점)
  points: 45
  depends_on: []
  answer:
    kind: value
    value: fe=1; fpe=5/E
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 분모의 극한이 0이므로 분자의 극한도 0이다. 분자·분모를 $x-e$로 나누어 미분계수의 정의와 $\ln$의 미분계수로 분리한다.
    steps:
    - id: 11a-1
      content: |
        $f(e)=1$을 먼저 구하고, 식을 $\dfrac{f(x)-f(e)}{x-e}\times\dfrac{x-e}{\ln x-\ln e}$ 꼴로 바꾼다.
      criteria:
      - 1-1.M1
      - 1-1.M3
    hint_ladder:
    - 분모가 0으로 가는데 극한이 존재하면 분자는 어떻게 되어야 하는가?
    - $f(e)=1$, $\ln e=1$을 이용해 분자·분모를 미분계수의 정의 꼴로 만들어 보자.
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $\displaystyle\lim_{x\to e}\dfrac{f(x)-1}{\ln x-1}=5$에서 $\displaystyle\lim_{x\to e}(\ln x-1)=0$이므로 $\displaystyle\lim_{x\to e}\{f(x)-1\}=0$이다. 즉 $f(e)=1$이다. (1)
      source_flow: 예시 답안 p.40 (1)
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        주어진 식의 분모, 분자를 $x-e$로 나누면 $\displaystyle\lim_{x\to e}\dfrac{f(x)-1}{\ln x-1}=\lim_{x\to e}\left\{\dfrac{f(x)-1}{x-e}\times\dfrac{x-e}{\ln x-1}\right\}$로 둘 수 있다. (2)
      source_flow: 예시 답안 p.40 (2)
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        $f(e)=1$, $\ln e=1$을 활용하면 $\displaystyle\lim_{x\to e}\dfrac{f(x)-1}{\ln x-1}=\lim_{x\to e}\left\{\dfrac{f(x)-f(e)}{x-e}\times\dfrac{x-e}{\ln x-\ln e}\right\}$로 둘 수 있다. (3)(4)
      source_flow: 예시 답안 p.40 (3)(4)
      criteria:
      - 1-1.M2
      - 1-1.M3
    - id: 11b-4
      content: |
        $g(x)=\ln x$라 두면 $\displaystyle\lim_{x\to e}\dfrac{x-e}{\ln x-\ln e}=\lim_{x\to e}\dfrac{1}{\dfrac{\ln x-\ln e}{x-e}}=\dfrac{1}{g'(e)}$이고 $g'(x)=\dfrac{1}{x}$이므로 $g'(e)=\dfrac1e$이다. 따라서 $\displaystyle\lim_{x\to e}\dfrac{x-e}{\ln x-\ln e}=e$이다. (5)~(8)
      source_flow: 예시 답안 p.40 (5)~(8)
      criteria:
      - 1-1.M4
    - id: 11b-5
      content: |
        $\displaystyle\lim_{x\to e}\dfrac{f(x)-1}{\ln x-1}=\lim_{x\to e}\dfrac{f(x)-f(e)}{x-e}\times\lim_{x\to e}\dfrac{x-e}{\ln x-\ln e}=f'(e)\times e=5$이므로 $f'(e)=\dfrac5e$이다. (9)(10)
      source_flow: 예시 답안 p.40 (9)(10)
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 7
      evidence: 극한값이 존재하고 $x\to e$일 때 $\ln x-1\to0$이므로 분자의 극한값도 0이 되어야 함을 명시하고 $f(e)=1$을 구했다. (공식 채점기준 (1) 7점)
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 3
      evidence: $f(e)=1$, $\ln e=1$을 활용함을 명시했다. (공식 채점기준 (2-3) 3점)
      steps:
      - 11b-2
      - 11b-3
    - id: 1-1.M3
      mark_type: M
      points: 15
      evidence: $\displaystyle\lim_{x\to e}\dfrac{f(x)-1}{\ln x-1}=\lim_{x\to e}\left\{\dfrac{f(x)-f(e)}{x-e}\times\dfrac{x-e}{\ln x-\ln e}\right\}$ 꼴로 정리했다. (공식 채점기준 (4) 15점)
      steps:
      - 11b-3
    - id: 1-1.M4
      mark_type: M
      points: 15
      evidence: $\displaystyle\lim_{x\to e}\dfrac{x-e}{\ln x-\ln e}=e$를 $\ln x$의 $x=e$에서의 미분계수 $\dfrac1e$의 역수로 구했다. (공식 채점기준 (6-8) 15점)
      steps:
      - 11b-4
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: $f'(e)=\dfrac5e$를 구했다. (공식 채점기준 (10) 5점)
      depends_on:
      - 1-1.M3
      - 1-1.M4
      steps:
      - 11b-5
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    함수 $h(x)=(1+e^{x})(1+e^{2x})(1+e^{3x})\cdots(1+e^{10x})$ 일 때, $\displaystyle\lim_{x\to0}\dfrac{h'(x)}{h(x)}$를 구하시오. (25점)
  points: 25
  depends_on: []
  answer:
    kind: value
    value: 55/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 양변에 로그를 취하면 곱이 합이 되고, $\dfrac{h'(x)}{h(x)}$는 $\ln\lvert h(x)\rvert$의 도함수이다.
    steps:
    - id: 12a-1
      content: |
        $\dfrac{h'(x)}{h(x)}=\displaystyle\sum_{k=1}^{10}\dfrac{ke^{kx}}{1+e^{kx}}$이고 $x\to0$에서 각 항은 $\dfrac{k}{2}$로 간다.
      criteria:
      - 1-2.M1
      - 1-2.M2
      - 1-2.A1
    hint_ladder:
    - 곱을 그대로 미분하기 전에, 로그를 취하면 어떻게 되는가?
    - $\dfrac{h'(x)}{h(x)}$는 어떤 함수의 도함수인가?
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $h(x)=(1+e^{x})(1+e^{2x})(1+e^{3x})\cdots(1+e^{10x})$의 양변에 로그를 취하면 $\ln\lvert h(x)\rvert=\ln\lvert(1+e^{x})(1+e^{2x})(1+e^{3x})\cdots(1+e^{10x})\rvert=\ln(1+e^{x})+\ln(1+e^{2x})+\ln(1+e^{3x})+\cdots+\ln(1+e^{10x})$이다. (1)
      source_flow: 예시 답안 p.40 (1)
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $\dfrac{h'(x)}{h(x)}$는 $\ln\lvert h(x)\rvert$의 도함수이므로 $\ln(1+e^{x})+\ln(1+e^{2x})+\ln(1+e^{3x})+\cdots+\ln(1+e^{10x})$의 도함수와 같다. (2)
      source_flow: 예시 답안 p.40 (2)
      criteria:
      - 1-2.M1
    - id: 12b-3
      content: |
        $\dfrac{h'(x)}{h(x)}=\dfrac{e^{x}}{1+e^{x}}+\dfrac{2\times e^{2x}}{1+e^{2x}}+\dfrac{3\times e^{3x}}{1+e^{3x}}+\cdots+\dfrac{10\times e^{10x}}{1+e^{10x}}$이다. (3)
      source_flow: 예시 답안 p.40 (3)
      criteria:
      - 1-2.M2
    - id: 12b-4
      content: |
        따라서 $\displaystyle\lim_{x\to0}\dfrac{h'(x)}{h(x)}=\lim_{x\to0}\left(\dfrac{e^{x}}{1+e^{x}}+\dfrac{2\times e^{2x}}{1+e^{2x}}+\cdots+\dfrac{10\times e^{10x}}{1+e^{10x}}\right)=\dfrac{1}{1+1}+\dfrac{2}{1+1}+\dfrac{3}{1+1}+\cdots+\dfrac{10}{1+1}=\dfrac12\sum_{k=1}^{10}k=\dfrac{55}{2}$이다. (4)
      source_flow: 예시 답안 p.40 (4)
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 12
      evidence: $\ln\lvert h(x)\rvert=\ln\lvert(1+e^{x})(1+e^{2x})\cdots(1+e^{10x})\rvert$ 혹은 $\ln(1+e^{x})+\ln(1+e^{2x})+\cdots+\ln(1+e^{10x})$로 정리했다. (공식 채점기준 (1) 12점)
      steps:
      - 12b-1
      - 12b-2
    - id: 1-2.M2
      mark_type: M
      points: 8
      evidence: $\ln(1+e^{x})+\ln(1+e^{2x})+\cdots+\ln(1+e^{10x})$의 도함수를 $\dfrac{e^{x}}{1+e^{x}}+\dfrac{2\times e^{2x}}{1+e^{2x}}+\cdots+\dfrac{10\times e^{10x}}{1+e^{10x}}$로 정확히 구했다. (공식 채점기준 (3) 8점)
      steps:
      - 12b-3
    - id: 1-2.A1
      mark_type: A
      points: 5
      evidence: 극한값을 $\dfrac{1}{1+1}+\dfrac{2}{1+1}+\cdots+\dfrac{10}{1+1}=\dfrac12\sum_{k=1}^{10}k=\dfrac{55}{2}$로 구했다. (공식 채점기준 (4) 5점)
      depends_on:
      - 1-2.M2
      steps:
      - 12b-4
