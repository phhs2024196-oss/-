intent: 극한값이 존재할 때 분모의 극한이 0이면 분자의 극한도 0이어야 함을 이용해 함숫값을 정하고, 미분계수의 정의와 로그함수의 도함수로 미분계수를 구하며, 로그미분(로그를 취한 뒤 도함수)으로 곱의 도함수를 합으로 바꾸어 극한값을 구하는 능력을 평가한다.
key_idea: '$\ln x-1\to0$이므로 $f(e)=1$이고, $\dfrac{f(x)-f(e)}{x-e}\times\dfrac{x-e}{\ln x-\ln e}$로 쪼개 $f''(e)\cdot e=5$를 얻는다. (2)는 $\ln\lvert h(x)\rvert$의 도함수가 $\dfrac{h''(x)}{h(x)}$임을 이용한다.'
stuck: '(1) $\dfrac{x-e}{\ln x-\ln e}$가 $\ln$의 $x=e$에서의 미분계수의 역수($e$)임을 알아보는 것. (2) 곱 형태 $h(x)$를 그대로 미분하지 않고 로그를 취해 합의 도함수로 바꾸는 발상.'
