stimuli:
- label: 가
  body: |
    $\triangle\mathrm{ABC}$에서 $a=\overline{\mathrm{BC}}$, $b=\overline{\mathrm{CA}}$, $c=\overline{\mathrm{AB}}$라 하고 외접원의 반지름의 길이를 $R$라고 하면

    $$\dfrac{a}{\sin A}=\dfrac{b}{\sin B}=\dfrac{c}{\sin C}=2R$$

    이다. 이것을 사인법칙이라고 한다.

    $$a^{2}=b^{2}+c^{2}-2bc\cos A$$

    $$b^{2}=c^{2}+a^{2}-2ca\cos B$$

    $$c^{2}=a^{2}+b^{2}-2ab\cos C$$

    이고 이것을 코사인법칙이라고 한다.
- label: 나
  body: |
    아래 그림과 같이 $\square\mathrm{ABCD}$는 중심이 $\mathrm{O}$이고 반지름의 길이가 $R$인 원에 내접한다. 이때, $\square\mathrm{ABCD}$의 넓이는 $S$이고 $\overline{\mathrm{AB}}=2$, $\overline{\mathrm{CD}}=4$, $\overline{\mathrm{AD}}+\overline{\mathrm{BC}}=8$을 만족한다. (단, $1<\overline{\mathrm{AD}}<7$)

    [그림: 중심이 O인 원에 사각형 ABCD가 내접한 그림. 꼭짓점은 반시계 방향으로 A(왼쪽), B(아래 왼쪽), C(아래 오른쪽), D(위)이고, 중심 O에서 오른쪽 원주까지 반지름 $R$이 점선 호와 함께 표시되어 있다.]
stem: |
  다음 제시문을 읽고 구체적인 풀이과정과 답을 제시하시오. [60점]
subparts:
- id: 2-1
  stem: |
    (나)에 제시된 $\square\mathrm{ABCD}$의 넓이 $S$가 최대가 될 때의 반지름 길이 $R$과 넓이 $S$를 활용하여 $(SR)^{2}$의 값을 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: 864
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{AD}}=x$로 두고 $\overline{\mathrm{BD}}$를 코사인법칙으로 두 번 써서 $\cos\theta$를 $x$로 나타내면 $S^2$이 $x$에 대한 이차식이 된다.
    steps:
    - id: 21a-1
      content: |
        $S^{2}=-15(x-1)(x-7)$이므로 $x=4$에서 $S^{2}=135$가 최대이고, 이때 $\overline{\mathrm{BD}}^{2}=24$, $\sin^{2}\theta=\dfrac{15}{16}$이므로 $R^{2}=\dfrac{32}{5}$이다.
      criteria:
      - 2-1.M1
      - 2-1.M2
      - 2-1.M3
      - 2-1.M4
      - 2-1.M5
      - 2-1.M6
      - 2-1.A1
    hint_ladder:
    - 마주 보는 두 각 $\angle\mathrm{BAD}$와 $\angle\mathrm{BCD}$의 합은 얼마인가?
    - 대각선 $\overline{\mathrm{BD}}$를 두 삼각형에서 각각 코사인법칙으로 나타내 보자.
    - $S$ 대신 $S^{2}$을 $x$로 나타내면 어떤 함수가 되는가?
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $\angle\mathrm{BAD}=\theta$, $\overline{\mathrm{AD}}=x$라 하면, 코사인법칙에 의하여 $\overline{\mathrm{BD}}$의 길이는 $\triangle\mathrm{ABD}$에 대해 $\overline{\mathrm{BD}}^{2}=2^{2}+x^{2}-2\times2\times x\times\cos\theta$이고, $\triangle\mathrm{BCD}$에 대해 $\overline{\mathrm{BD}}^{2}=4^{2}+(8-x)^{2}-2\times4\times(8-x)\times\cos(\pi-\theta)$이다. (1)
      source_flow: 예시 답안 p.43 (1)
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        따라서 $4+x^{2}-4x\cos\theta=16+(8-x)^{2}+8(8-x)\cos\theta$이다. $(64-4x)\cos\theta=16x-76$이고 $16-x\neq0$이므로 $\cos\theta=\dfrac{4x-19}{16-x}$이다. (2)
      source_flow: 예시 답안 p.43 (2)
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        $\square\mathrm{ABCD}$의 넓이를 $S$라 하면 $S=\dfrac12\times2x\times\sin\theta+\dfrac12\times4(8-x)\sin(\pi-\theta)=(16-x)\sin\theta$이다. (3)
      source_flow: 예시 답안 p.43 (3)
      criteria:
      - 2-1.M3
    - id: 21b-4
      content: |
        $S^{2}=(16-x)^{2}\sin^{2}\theta=(16-x)^{2}(1-\cos^{2}\theta)$이므로 $S^{2}=(16-x)^{2}\left\{1-\left(\dfrac{4x-19}{16-x}\right)^{2}\right\}=(16-x)^{2}-(4x-19)^{2}=(16-x+4x-19)(16-x-4x+19)=-15(x-1)(x-7)$이다. (4)
      source_flow: 예시 답안 p.43 (4)
      criteria:
      - 2-1.M4
    - id: 21b-5
      content: |
        따라서 $x=4$에서 $\square\mathrm{ABCD}$의 넓이는 최대가 되고, $S^{2}=135$이다. ($S=3\sqrt{15}$) (5)
      source_flow: 예시 답안 p.43 (5)
      criteria:
      - 2-1.M5
    - id: 21b-6
      content: |
        사인법칙에 의하여 $2R=\dfrac{\overline{\mathrm{BD}}}{\sin\theta}$이고 $R^{2}=\dfrac{\overline{\mathrm{BD}}^{2}}{4\sin^{2}\theta}$이다. $x=4$일 때 $\overline{\mathrm{BD}}^{2}=2^{2}+4^{2}-2\times2\times4\times\dfrac{4\times4-19}{16-4}=24$이고 $\sin^{2}\theta=1-\left(-\dfrac14\right)^{2}=\dfrac{15}{16}$이다. $R^{2}=\dfrac{24}{4\times\dfrac{15}{16}}=\dfrac{32}{5}$이다. ($R=\dfrac{4\sqrt{10}}{5}$) (6)
      source_flow: 예시 답안 p.43 (6)
      criteria:
      - 2-1.M6
    - id: 21b-7
      content: |
        따라서 $(SR)^{2}=135\times\dfrac{32}{5}=864$이다. (7)
      source_flow: 예시 답안 p.43 (7)
      criteria:
      - 2-1.A1
