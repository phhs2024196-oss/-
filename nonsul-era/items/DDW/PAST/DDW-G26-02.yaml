intent: 원에 내접하는 사각형에서 대각선 $\mathrm{BD}$를 두 삼각형에 코사인법칙으로 각각 적용해 $\cos\angle\mathrm{BAD}$를 $\overline{\mathrm{AD}}$로 나타내고, 넓이를 삼각함수로 표현해 $S^2$을 이차함수로 만들어 최댓값 조건을 구한 뒤 사인법칙으로 외접원의 반지름을 구하는 능력을 평가한다.
key_idea: '$\overline{\mathrm{AD}}=x$, $\angle\mathrm{BAD}=\theta$로 두면 $\angle\mathrm{BCD}=\pi-\theta$이고 $\overline{\mathrm{BD}}$를 두 삼각형에서 같게 놓아 $\cos\theta=\dfrac{4x-19}{16-x}$, $S=(16-x)\sin\theta$이므로 $S^2=-15(x-1)(x-7)$이며 $x=4$에서 최대 $135$, 이때 $R^2=\dfrac{\overline{\mathrm{BD}}^2}{4\sin^2\theta}=\dfrac{32}{5}$.'
stuck: 원에 내접하는 사각형의 마주 보는 두 각의 합이 $\pi$임을 써서 변수를 $\theta$와 $x$ 둘로만 줄이는 것, 그리고 $S$ 대신 $S^2=(16-x)^2(1-\cos^2\theta)$를 $x$에 대한 이차함수로 정리하는 것.
