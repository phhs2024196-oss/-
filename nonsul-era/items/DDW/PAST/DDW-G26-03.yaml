intent: 사차함수의 그래프 개형(우함수)을 파악해 극솟값 조건으로 미정계수를 결정하고, 함수방정식과 극한 조건에서 $g(0)$을 구한 뒤, 미분계수의 정의와 곱의 미분법으로 극한 조건을 해석해 $g'(0)$을 논리적으로 구하는 능력을 평가한다. 실생활 상황(추천 모델)을 수학적 개념으로 해석하는 능력도 본다.
key_idea: '$f(x)=f(-x)$이므로 $f(x)=x^4+ax^2+b$이고, $g(0)=1$과 극한 조건에서 $b=f(0)=3$, 극솟값 $f\left(\sqrt{-\dfrac a2}\right)=3-\dfrac{a^2}{4}=-13$에서 $a=-8$이다. $h(x)=f(x)g(x)$로 두면 극한 조건은 $h''(0)=0$이고 $h''(0)=f''(0)g(0)+f(0)g''(0)$, $f''(0)=0$이므로 $g''(0)=0$이다.'
stuck: '$f(x)=f(-x)$에서 홀수차항이 없음을 쓰는 것, 함수방정식에 $x=y=0$을 넣어 $g(0)$을 얻는 것, 그리고 $\displaystyle\lim_{x\to0}\dfrac{f(x)g(x)-3}{x}=0$이 $f(x)g(x)$의 $x=0$에서의 미분계수 $0$을 뜻함을 알아보는 것(분자 극한 0 → $f(0)g(0)=3$ 포함).'
