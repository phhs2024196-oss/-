stimuli: []
stem: |
  다음 제시문을 읽고 문항별로 구체적인 풀이과정과 답을 제시하시오. [70점]

  영상 플랫폼에서 사용자의 선호도를 분석하여 콘텐츠를 추천하는 단순한 수학적 추천 모델을 개발하고자 한다. 사용자 반응 함수를 $f(x)$, 기본 추천 함수를 $g(x)$라 할 때, 최종 추천 함수는 $f(x)g(x)$이고 다음의 (가), (나) 조건을 만족한다.

  (가) 사용자 반응 함수 $f(x)$는 최고차항의 계수가 $1$인 사차함수이다. 함수 $f(x)$는 모든 실수 $x$에 대하여 $f(x)=f(-x)$를 만족하며, $f(x)$의 극솟값은 $-13$이다.

  (나) 기본 추천 함수 $g(x)$는 모든 실수 $x,y$에 대하여 $g(x+y)=g(x)+g(y)+2xy-1$을 만족하고, $x=0$에서 미분가능하다. 함수 $g(x)$는 다음 조건을 만족해야 한다.

  $$\lim_{x\to0}\dfrac{f(x)g(x)-3}{x}=0$$
subparts:
- id: 3-1
  stem: |
    사용자 반응 함수 $f(x)$를 구하시오. (50점)
  points: 50
  depends_on: []
  answer:
    kind: expression
    value: x**4-8*x**2+3
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-A
    audience: A
    method_no: 1
    key_idea: 우함수이므로 $f(x)=x^4+ax^2+b$, 함수방정식과 극한 조건으로 $b=3$, 극솟값 조건으로 $a=-8$.
    steps:
    - id: 31a-1
      content: |
        $g(0)=1$이고 극한 조건에서 $f(0)=3$이므로 $f(x)=x^4+ax^2+3$이다. $x^2=-\dfrac a2$에서 극솟값 $3-\dfrac{a^2}{4}=-13$이므로 $a=-8$이다.
      criteria:
      - 3-1.M1
      - 3-1.M2
      - 3-1.M3
      - 3-1.M4
      - 3-1.M5
      - 3-1.A1
    hint_ladder:
    - $f(x)=f(-x)$이면 사차함수의 어떤 항이 없어지는가?
    - 함수방정식에 $x=0,\ y=0$을 대입하면 $g(0)$은?
    - 극한이 존재하는데 분모가 $0$으로 가면 분자의 극한은?
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        함수 $f(x)$는 최고차항의 계수가 $1$인 사차함수이고 $f(x)=f(-x)$를 만족하므로 $f(x)=x^4+ax^2+b$이다. (1)
      source_flow: 예시 답안 p.48 [문제 3] (1)
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        주어진 (나)의 $g(x+y)=g(x)+g(y)+2xy-1$에 $x=0$, $y=0$을 대입하면 $g(0)=1$이다. (2)
      source_flow: 예시 답안 p.48 [문제 3] (2)
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        제시문 (나)의 조건에서 $x\to0$일 때 $\displaystyle\lim_{x\to0}f(x)g(x)=3$이고 $g(0)=1$이므로 $f(0)=3$이다. 따라서 $f(x)=x^4+ax^2+3$이다. (3)
      source_flow: 예시 답안 p.48 [문제 3] (3)
      criteria:
      - 3-1.M3
    - id: 31b-4
      content: |
        함수 $f(x)$를 $x$에 대해서 미분하면 $f'(x)=4x^3+2ax=0$이고, $f'(x)=0$에서 $x(4x^2+2a)=0$이다. 만족하는 $x$를 구하면 $x=-\sqrt{-\dfrac a2}$, $x=0$, $x=\sqrt{-\dfrac a2}$이다. (4)
      source_flow: 예시 답안 p.48 [문제 3] (4)
      criteria:
      - 3-1.M4
    - id: 31b-5
      content: |
        $f(x)$는 $x=-\sqrt{-\dfrac a2}$, $x=\sqrt{-\dfrac a2}$에서 극솟값 $-13$을 갖는다. $f\left(\sqrt{-\dfrac a2}\right)=-13$에서 $a=-8$이다. ($-\dfrac a2>0$) (5)
      source_flow: 예시 답안 p.48 [문제 3] (5)
      criteria:
      - 3-1.M5
    - id: 31b-6
      content: |
        따라서 $f(x)=x^4-8x^2+3$이다. (6)
      source_flow: 예시 답안 p.48 [문제 3] (6)
      criteria:
      - 3-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
