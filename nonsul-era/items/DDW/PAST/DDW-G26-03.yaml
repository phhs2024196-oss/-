      depends_on:
      - 3-1.M2
      steps:
      - 31b-3
    - id: 3-1.M4
      mark_type: M
      points: 10
      evidence: $f'(x)=0$을 이용하여 $x$의 값을 구했다. (공식 채점기준 (4) 10점)
      steps:
      - 31b-4
    - id: 3-1.M5
      mark_type: M
      points: 10
      evidence: $f\left(\sqrt{-\dfrac a2}\right)=-13$을 이용하여 $a=-8$을 제시했다. (공식 채점기준 (5) 10점)
      depends_on:
      - 3-1.M4
      steps:
      - 31b-5
    - id: 3-1.A1
      mark_type: A
      points: 4
      evidence: 최종 함수식 $f(x)=x^4-8x^2+3$을 정확히 제시했다. (공식 채점기준 (6) 4점)
      depends_on:
      - 3-1.M3
      - 3-1.M5
      steps:
      - 31b-6
  outcome_codes:
