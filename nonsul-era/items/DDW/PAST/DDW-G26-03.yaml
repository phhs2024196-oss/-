- id: 3-2
  stem: |
    기본 추천 함수 $g(x)$의 $x=0$에서의 미분계수 $g'(0)$의 값을 구하시오. (20점)
  points: 20
  depends_on:
  - 3-1
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-A
    audience: A
    method_no: 1
    key_idea: 극한 조건은 $h(x)=f(x)g(x)$의 $x=0$에서의 미분계수가 $0$이라는 뜻이다.
    steps:
    - id: 32a-1
      content: |
        $h'(0)=f'(0)g(0)+f(0)g'(0)=0$이고 $f'(0)=0$, $f(0)=3$, $g(0)=1$이므로 $g'(0)=0$이다.
      criteria:
      - 3-2.M1
      - 3-2.M2
      - 3-2.A1
    hint_ladder:
    - 주어진 극한은 어떤 함수의 미분계수의 정의 꼴인가?
    - 곱의 미분법을 $x=0$에서 써 보자.
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $h(x)=f(x)g(x)$라 하자. 주어진 극한은 $\displaystyle\lim_{x\to0}\dfrac{h(x)-h(0)}{x}=0$이고 $h'(0)=0$이다. (1)
      source_flow: 예시 답안 p.48 [문제 3] (2)(1)
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        곱의 미분법을 사용하면 $h'(0)=f'(0)g(0)+f(0)g'(0)$이 된다. (2)
      source_flow: 예시 답안 p.48 [문제 3] (2)(2)
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        $f(x)=x^4-8x^2+3$이므로 $f(0)=3$, $f'(x)=4x^3-16x$이므로 $f'(0)=0$이다. $h'(0)=0\times1+3\times g'(0)=0$이고 따라서 $g'(0)=0$이다. (3)
      source_flow: 예시 답안 p.48 [문제 3] (2)(3)
      criteria:
      - 3-2.A1
  rubric:
