      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: $x$의 범위를 $0\le x\le t$와 $t<x\le\sqrt[3]{2}$로 적절히 나누어 식 (1)을 정확히 세운다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 20
      evidence: 식 (1)을 적분하여 $I(t)$를 (2)와 같이 정확히 얻는다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 20
      evidence: (3)과 같이 $I'(t)$를 정확히 구한다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: $f'(t)>0$이라는 조건으로부터 정의된 구간 내에서 $t=1$에서만 $I'(t)$가 0이 됨을 지적하고, 증가와 감소를 나타낸 표 등을 이용하여 $t=1$일 때 $I(t)$가 최소임을 보인다. ($f'(t)>0$ 조건을 간과하여 $t=1$에서만 0이 됨을 제대로 보이지 못하면 이 마크 0점)
      depends_on:
      - 1.M3
      steps:
      - 1b-4
    deductions:
    - code: D1-1
      condition: 식 (1)의 부호를 반대로 세워 $I(t)=\int_0^{t}x^2\{f(x)-f(t)\}dx+\int_t^{\sqrt[3]{2}}x^2\{f(t)-f(x)\}dx$로 놓음(공식 채점기준은 $I'(t)=\dfrac23(1-t)(t^2+t+1)f'(t)$를 얻고 $t=1$일 때 $I(t)$가 최소라고 답하면 25점, $t=0$ 또는 $t=\sqrt[3]{2}$에서 최소라고 답하면 45점)
      effect: cap
      value: 45
    - code: D1-2
      condition: 구간을 나누지 않고 $I(t)=\int_0^{\sqrt[3]{2}}x^2\{f(t)-f(x)\}dx$ 또는 $\int_0^{\sqrt[3]{2}}x^2\{f(x)-f(t)\}dx$로 적분함(공식 채점기준은 $t=0$ 또는 $t=\sqrt[3]{2}$을 답하면 15점)
      effect: cap
      value: 15
