stimuli: []
stem: |
  다음 문제를 읽고 구체적인 풀이과정과 답을 제시하시오. [70점]

  $I(t)$는 $0\le t\le\sqrt[3]{2}$에서 정의된 함수이며 $I(t)=\displaystyle\int_0^{\sqrt[3]{2}}x^2\lvert f(t)-f(x)\rvert\,dx$이다.

  단 $f(x)$는 다음 조건을 만족시키는 함수이다.

  - $0\le x\le\sqrt[3]{2}$에서 연속이다.
  - $0<x<\sqrt[3]{2}$에서 미분가능하다.
  - $f'(x)>0$
subparts:
- id: '1'
  stem: |
    $I(t)$가 최소가 되는 $t$를 구하시오.
  points: 70
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)>0$이므로 $f(x)$는 단순 증가 함수이다. $0\le x\le t$일 때 $\lvert f(t)-f(x)\rvert=f(t)-f(x)$이며, $t<x\le\sqrt[3]{2}$일 때 $\lvert f(t)-f(x)\rvert=f(x)-f(t)$이다. 따라서 $I(t)=\displaystyle\int_0^{t}x^2\{f(t)-f(x)\}dx+\int_t^{\sqrt[3]{2}}x^2\{f(x)-f(t)\}dx$이다. (1)
      source_flow: 예시 답안 p.39
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $I(t)=f(t)\displaystyle\int_0^{t}x^2dx-\int_0^{t}x^2f(x)dx+\int_t^{\sqrt[3]{2}}x^2f(x)dx-f(t)\int_t^{\sqrt[3]{2}}x^2dx=\dfrac{t^3}{3}f(t)-\left(\dfrac23-\dfrac{t^3}{3}\right)f(t)-\int_0^{t}x^2f(x)dx+\int_t^{\sqrt[3]{2}}x^2f(x)dx$이므로 $I(t)=\dfrac23(t^3-1)f(t)-\displaystyle\int_0^{t}x^2f(x)dx+\int_t^{\sqrt[3]{2}}x^2f(x)dx$이다. (2)
      source_flow: 예시 답안 p.39
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        함수 $I(t)$의 도함수는 $I'(t)=2t^2f(t)+\dfrac23(t^3-1)f'(t)-t^2f(t)-t^2f(t)=\dfrac23(t^3-1)f'(t)=\dfrac23(t-1)(t^2+t+1)f'(t)$이다. (3)
      source_flow: 예시 답안 p.40
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $t^2+t+1>0$이고 문제의 조건으로부터 $f'(t)>0$이므로 $I(t)$가 정의된 구간 내에서 $t=1$에서만 $I'(t)$가 0이 된다. (4) 증감표에서 $0<t<1$이면 $I'(t)<0$으로 감소, $t=1$에서 극소, $1<t<\sqrt[3]{2}$이면 $I'(t)>0$으로 증가하므로 $t=1$일 때 $I(t)$가 최소가 된다. (5)
      source_flow: 예시 답안 p.40
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
