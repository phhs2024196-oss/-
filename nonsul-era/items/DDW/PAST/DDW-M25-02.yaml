intent: 절댓값이 있는 함수의 정적분을 구간을 나누어 계산하고(부분적분법·정적분의 성질 활용), 정적분으로 정의된 함수를 미분하여 증가·감소를 판단해 최솟값을 갖는 $t$를 구하는 능력을 평가한다.
key_idea: $f'(x)>0$이므로 $f$는 증가함수이고 $|f(t)-f(x)|$는 $x=t$를 경계로 부호가 갈린다. 구간을 나누어 $I(t)$를 정리하면 $I'(t)=\dfrac23(t^3-1)f'(t)$이므로 $t=1$에서만 $I'(t)=0$이고 부호가 $-$에서 $+$로 바뀐다.
stuck: 절댓값 안의 부호가 $x=t$에서 바뀐다는 것을 이용해 적분 구간을 나누지 못하거나, $I(t)$를 미분할 때 적분 상한·하한의 $t$와 적분 안의 $f(t)$를 함께 미분하는 것을 놓친다.
