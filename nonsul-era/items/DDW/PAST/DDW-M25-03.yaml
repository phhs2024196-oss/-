stimuli: []
stem: |
  다음 문제를 읽고 문항별로 구체적인 풀이과정과 답을 제시하시오. [70점]

  실수 전체의 집합에서 미분가능한 함수 $f(x)$가 임의의 실수 $x$에 대해 $f(x)=x^2-\displaystyle\int_0^x(x-t)f'(t)\,dt$를 만족시킬 때, 다음의 물음에 답하시오.
subparts:
- id: 3-1
  stem: |
    (1) 함수 $f(x)$를 구하시오. (이 때, $e^xf(x)$의 미분을 이용하시오.) (45점)
  points: 45
  depends_on: []
  answer:
    kind: expression
    value: 2*x-2+2*exp(-x)
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $f(x)=x^2-\displaystyle\int_0^x(x-t)f'(t)dt=x^2-x\int_0^xf'(t)dt+\int_0^xtf'(t)dt$이다. (1)
      source_flow: 예시 답안 p.40
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        (1)의 양변을 $x$에 대하여 미분하면 $f'(x)=2x-\displaystyle\int_0^xf'(t)dt-xf'(x)+xf'(x)=2x-\int_0^xf'(t)dt=2x-\left[f(t)\right]_0^x=2x-f(x)+f(0)=2x-f(x)$이다. ((1)에 $x=0$을 대입하면 $f(0)=0$) (2)
      source_flow: 예시 답안 p.40
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        $(e^xf(x))'=e^xf(x)+e^xf'(x)=e^xf(x)+e^x\{2x-f(x)\}=2xe^x$이다. (3)
      source_flow: 예시 답안 p.40
      criteria:
      - 3-1.M3
    - id: 31b-4
      content: |
        $e^xf(x)=\displaystyle\int2xe^xdx=2xe^x-\int2e^xdx=2xe^x-2e^x+C$이다. (4)
      source_flow: 예시 답안 p.40
      criteria:
      - 3-1.M4
    - id: 31b-5
      content: |
        $f(x)=2x-2+Ce^{-x}$이고 $f(0)=0$이므로 $C=2$이다. 따라서 $f(x)=2x-2+2e^{-x}$이다. (5)
      source_flow: 예시 답안 p.40
      criteria:
      - 3-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 5
      evidence: 함수를 변형하여 관계식 (1)을 구한다. (공식 채점기준 — 관계식 (1)만 구한 경우 5점)
      steps:
      - 31b-1
    - id: 3-1.M2
      mark_type: M
      points: 10
      evidence: (1)을 미분하여 $f'(x)$와 $f(x)$의 관계식 (2)를 얻는다. (관계식 (1), (2)를 얻었으나 주어진 관계식을 미분하지 못하면 15점 구간)
      depends_on:
      - 3-1.M1
      steps:
      - 31b-2
    - id: 3-1.M3
      mark_type: M
      points: 10
      evidence: 주어진 관계식 (3) $(e^xf(x))'=2xe^x$를 미분하여 구한다. (부분적분을 구하지 못하면 25점 구간)
      depends_on:
      - 3-1.M2
      steps:
      - 31b-3
    - id: 3-1.M4
      mark_type: M
      points: 10
      evidence: 부분적분 (4)를 구한다. (상수만 구하지 못하면 35점 구간)
      depends_on:
      - 3-1.M3
      steps:
      - 31b-4
    - id: 3-1.A1
      mark_type: A
      points: 10
      evidence: $f(0)=0$으로 상수 $C=2$까지 결정하여 $f(x)=2x-2+2e^{-x}$ (5)를 구한다.
      depends_on:
      - 3-1.M4
      steps:
      - 31b-5
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    (2) 함수 $f(x)$에 대하여 $\displaystyle\int_{-1}^{1}2xf(x)dx$의 값을 구하시오. (25점)
  points: 25
  depends_on:
  - 3-1
  answer:
    kind: expression
    value: 8/3-8*exp(-1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $\displaystyle\int_{-1}^{1}2xf(x)dx=\int_{-1}^{1}(4xe^{-x}+4x^2-4x)dx=4\int_{-1}^{1}(xe^{-x}+x^2-x)dx$이다. (6)
      source_flow: 예시 답안 p.40
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        부분적분을 이용하면 $=4\left[-xe^{-x}-e^{-x}+\dfrac13x^3-\dfrac12x^2\right]_{-1}^{1}$이다. (7)
      source_flow: 예시 답안 p.40
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        $=4\left[\left(-e^{-1}-e^{-1}+\dfrac13-\dfrac12\right)-\left(e-e-\dfrac13-\dfrac12\right)\right]$이다. (8)
      source_flow: 예시 답안 p.40
      criteria:
      - 3-2.M3
    - id: 32b-4
      content: |
        $=4\left(\dfrac23-\dfrac2e\right)=\dfrac83-\dfrac8e$이다. (9)
      source_flow: 예시 답안 p.40
      criteria:
      - 3-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 5
      evidence: 주어진 함수식 (6)을 구한다. (공식 채점기준 — (6)만 구한 경우 5점)
      steps:
      - 32b-1
    - id: 3-2.M2
      mark_type: M
      points: 10
      evidence: 부분적분 (7)을 구한다. (부분적분을 구하였으나 과정 (8)과 결과 (9)가 모두 맞지 않으면 15점 구간)
      depends_on:
      - 3-2.M1
      steps:
      - 32b-2
    - id: 3-2.M3
      mark_type: M
      points: 5
      evidence: 정적분 값을 계산한 과정 (8)이 맞다. (과정 (8)은 맞지만 결과 (9)가 맞지 않으면 20점 구간)
      depends_on:
      - 3-2.M2
      steps:
      - 32b-3
    - id: 3-2.A1
      mark_type: A
      points: 5
      evidence: 결과 (9) $\dfrac83-\dfrac8e$를 정확히 구한다.
      depends_on:
      - 3-2.M3
      steps:
      - 32b-4
