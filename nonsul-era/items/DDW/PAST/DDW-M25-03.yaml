intent: 정적분으로 표시된 함수의 식을 변형·미분하여 $f(x)$와 $f'(x)$ 사이의 관계식을 얻고, $e^xf(x)$의 미분과 부분적분으로 $f(x)$를 구한 뒤 그 함수의 정적분 값을 구하는 능력을 평가한다.
key_idea: $f(x)=x^2-x\int_0^xf'(t)dt+\int_0^xtf'(t)dt$를 미분하면 $f'(x)=2x-f(x)$이고, 이는 $(e^xf(x))'=2xe^x$와 같다. 이를 적분하고 $f(0)=0$으로 상수를 정하면 $f(x)=2x-2+2e^{-x}$이다.
stuck: 적분 안의 $(x-t)$에서 $x$를 적분 밖으로 빼는 변형을 하지 못하거나, $f'(x)+f(x)=2x$에서 $e^xf(x)$를 미분하는 발상(힌트로 제시됨)을 적분 가능한 꼴로 이어가지 못한다.
