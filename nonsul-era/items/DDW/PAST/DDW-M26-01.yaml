stimuli:
- label: 가
  body: |
    사인법칙
    $\triangle\mathrm{ABC}$의 외접원의 반지름의 길이를 $R$라 하면
    $$\dfrac{a}{\sin A}=\dfrac{b}{\sin B}=\dfrac{c}{\sin C}=2R$$
- label: 나
  body: |
    코사인법칙
    $\triangle\mathrm{ABC}$에서
    $$a^2=b^2+c^2-2bc\cos A$$
    $$b^2=c^2+a^2-2ca\cos B$$
    $$c^2=a^2+b^2-2ab\cos C$$
- label: 다
  body: |
    그림과 같이 중심이 $\mathrm{O}$인 원에 내접하는 $\square\mathrm{ABCD}$에 대하여 $\cos A=\dfrac14$, $\overline{\mathrm{BD}}=2\sqrt3$이고, $\triangle\mathrm{BCD}$의 넓이는 $\triangle\mathrm{OBD}$ 넓이의 $\dfrac52$배이다.

    [그림 1: 중심이 $\mathrm{O}$인 원에 사각형 $\mathrm{ABCD}$가 내접하고, 대각선 $\mathrm{BD}$와 선분 $\mathrm{OB}$, $\mathrm{OD}$가 그려져 있다. $\mathrm{A}$는 원의 위쪽, $\mathrm{B}$는 왼쪽, $\mathrm{D}$는 오른쪽, $\mathrm{C}$는 아래쪽 호 위의 점이다.]
stem: |
  [판독확인: 원본 쪽(p.42)에 문제 번호·공통 발문·배점 표기가 없음 — 배점 60점은 채점 기준표 p.47에서 확인]
subparts:
- id: '1'
  stem: |
    ○ 제시문 (다)에서 $\triangle\mathrm{BCD}$의 세 변의 길이의 곱을 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: expression
    value: 8*sqrt(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\cos A=\dfrac14$이므로 $\sin A=\sqrt{1-\left(\dfrac14\right)^2}=\sqrt{\dfrac{15}{16}}=\dfrac{\sqrt{15}}{4}$이다. (1)
      source_flow: 예시 답안 p.48
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        원의 반지름을 $R$이라 하면 사인법칙에 따라 $\dfrac{2\sqrt3}{\sin A}=2R$이므로 $R=\dfrac12\times\dfrac{2\sqrt3}{\sin A}=\dfrac12\times2\sqrt3\times\dfrac{4}{\sqrt{15}}=\dfrac{4\sqrt5}{5}$이다. (2)
      source_flow: 예시 답안 p.48
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        코사인법칙에 따라 $\cos(\angle\mathrm{BOD})=\dfrac{R^2+R^2-(2\sqrt3)^2}{2\times R\times R}=\dfrac{\left(\frac{4\sqrt5}{5}\right)^2+\left(\frac{4\sqrt5}{5}\right)^2-(2\sqrt3)^2}{2\times\left(\frac{4\sqrt5}{5}\right)^2}=-\dfrac78$이다. (3)
      source_flow: 예시 답안 p.48
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $\triangle\mathrm{OBD}$의 넓이를 $S_1$이라 하면 $S_1=\dfrac12\times R^2\times\sin(\angle\mathrm{BOD})=\dfrac12\times\left(\dfrac{4\sqrt5}{5}\right)^2\times\sqrt{1-\left(-\dfrac78\right)^2}=\dfrac{\sqrt{15}}{5}$이다. (4)
      source_flow: 예시 답안 p.48
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        $\triangle\mathrm{BCD}$의 넓이를 $S_2$라 하면 $S_2=\dfrac52\times S_1=\dfrac52\times\dfrac{\sqrt{15}}{5}=\dfrac{\sqrt{15}}{2}$이다. (5)
      source_flow: 예시 답안 p.48
      criteria:
      - 1.M5
    - id: 1b-6
      content: |
        사인법칙을 활용하면 $S_2=\dfrac{\overline{\mathrm{BC}}\times\overline{\mathrm{CD}}\times\overline{\mathrm{BD}}}{4\times R}$이므로 $\overline{\mathrm{BC}}\times\overline{\mathrm{CD}}\times\overline{\mathrm{BD}}=4\times\dfrac{4\sqrt5}{5}\times\dfrac{\sqrt{15}}{2}=8\sqrt3$이다. 따라서 $\triangle\mathrm{BCD}$의 세 변의 길이의 곱은 $8\sqrt3$이다. (6) (별해 (6'): $S_2=\dfrac12\times\sin C\times\overline{\mathrm{BC}}\times\overline{\mathrm{CD}}=\dfrac12\times\sin(\pi-C)\times\overline{\mathrm{BC}}\times\overline{\mathrm{CD}}=\dfrac12\times\sin A\times\overline{\mathrm{BC}}\times\overline{\mathrm{CD}}=\dfrac{\sqrt{15}}{2}$이므로 $\overline{\mathrm{BC}}\times\overline{\mathrm{CD}}=2\times\dfrac{\sqrt{15}}{2}\times\dfrac{4}{\sqrt{15}}=4$이다. 따라서 $\triangle\mathrm{BCD}$의 세 변의 길이의 곱은 $8\sqrt3$이다.)
      source_flow: 예시 답안 p.48
      criteria:
      - 1.A1
