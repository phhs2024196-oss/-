key_idea: $\sin A=\dfrac{\sqrt{15}}{4}$와 사인법칙으로 $R=\dfrac{4\sqrt5}{5}$를 구하고, $\cos(\angle\mathrm{BOD})=-\dfrac78$로 $\triangle\mathrm{OBD}$의 넓이를 얻어 $\triangle\mathrm{BCD}=\dfrac52\triangle\mathrm{OBD}$를 구한 뒤, 사인법칙으로 얻은 $S=\dfrac{abc}{4R}$로 세 변의 곱을 구한다.
stuck: 중심각 $\angle\mathrm{BOD}$와 원주각 $A$의 관계를 이용해 $\triangle\mathrm{OBD}$의 넓이를 구하는 길을 찾지 못하거나, 삼각형 넓이와 외접원 반지름으로 세 변의 곱을 연결하지 못한다.
