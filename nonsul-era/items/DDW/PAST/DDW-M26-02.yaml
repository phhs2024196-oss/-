- id: 2-2
  stem: |
    (2) (1)에서 함수 $f(x)$를 $f(x)=\sin\left(\pi x\right)$라 할 때, $S$의 값을 구하시오. (45점)
  points: 45
  depends_on:
  - 2-1
  answer:
    kind: expression
    value: 1/pi-4/pi**3
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $\displaystyle\int_0^1x^2f(x)dx$에 $f(x)=\sin(\pi x)$를 대입한다. (1) $x^2\sin(\pi x)$가 미분가능하고 연속이기 때문에 $\displaystyle\int f(x)g'(x)dx=f(x)g(x)-\int f'(x)g(x)dx$의 부분적분법을 이용한다. $f(x)=x^2$, $f'(x)=2x$, $g'(x)=\sin(\pi x)$, $g(x)=-\dfrac1\pi\cos(\pi x)$이므로 $\displaystyle\int x^2\sin(\pi x)dx=-\dfrac{x^2}{\pi}\cos(\pi x)+\int\dfrac{2x}{\pi}\cos(\pi x)dx$로 나타낼 수 있다. (2)
      source_flow: 예시 답안 p.49
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        $\displaystyle\int\dfrac{2x}{\pi}\cos(\pi x)dx$도 부분적분법을 적용한다. $f(x)=\dfrac{2x}{\pi}$, $f'(x)=\dfrac2\pi$, $g'(x)=\cos(\pi x)$, $g(x)=\dfrac1\pi\sin(\pi x)$이므로 $\displaystyle\int\dfrac{2x}{\pi}\cos(\pi x)dx=\dfrac{2x}{\pi^2}\sin(\pi x)-\int\dfrac{2}{\pi^2}\sin(\pi x)dx=\dfrac{2x}{\pi^2}\sin(\pi x)+\dfrac{2}{\pi^3}\cos(\pi x)$이다. (3)
      source_flow: 예시 답안 p.49
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: |
        위의 결과를 결합하면 $\displaystyle\int x^2\sin(\pi x)dx=-\dfrac{x^2}{\pi}\cos(\pi x)+\dfrac{2x}{\pi^2}\sin(\pi x)+\dfrac2{\pi^3}\cos(\pi x)+C$이다. (4)
      source_flow: 예시 답안 p.49
      criteria:
      - 2-2.A1
    - id: 22b-4
      content: |
        이를 구하기 위해 $\cos(\pi)=-1$, $\sin(\pi)=0$, $\cos(0)=1$, $\sin(0)=0$ 값을 적용한다. $x=1$일 때 $-\dfrac1\pi(-1)+0+\dfrac2{\pi^3}(-1)=\dfrac1\pi-\dfrac2{\pi^3}$ (5), $x=0$일 때 $0+0+\dfrac2{\pi^3}(1)=\dfrac2{\pi^3}$ (6)이다.
      source_flow: 예시 답안 p.49
      criteria:
      - 2-2.M3
    - id: 22b-5
      content: |
        $\displaystyle\int_0^1x^2\sin(\pi x)dx=\left(\dfrac1\pi-\dfrac2{\pi^3}\right)-\dfrac2{\pi^3}=\dfrac1\pi-\dfrac4{\pi^3}$이다. (7)
      source_flow: 예시 답안 p.49
      criteria:
      - 2-2.A2
