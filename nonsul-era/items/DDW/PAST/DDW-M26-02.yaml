intent: 정적분과 급수의 합의 관계를 이해하여 주어진 극한을 정적분으로 나타내고, 복잡한 함수의 정적분을 부분적분법으로 계산하는 능력을 평가한다.
key_idea: $\dfrac{1}{n^3}\sum_{k=1}^{n}k^2f\left(\dfrac kn\right)=\sum_{k=1}^{n}\left(\dfrac kn\right)^2f\left(\dfrac kn\right)\dfrac1n$이므로 극한은 $\displaystyle\int_0^1x^2f(x)dx$이고, $f(x)=\sin(\pi x)$이면 부분적분을 두 번 적용하여 $\dfrac1\pi-\dfrac4{\pi^3}$을 얻는다.
stuck: 극한식의 $k^2$과 $\dfrac1{n^3}$을 $\left(\dfrac kn\right)^2\cdot\dfrac1n$로 나누는 것을 떠올리지 못하거나, $\int x^2\sin(\pi x)dx$에서 부분적분을 한 번 더 적용해야 함을 놓친다.
