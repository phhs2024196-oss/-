stimuli:
- label: 가
  body: |
    연속함수 $f(x)$에 대하여 구간 $[a,b]$를 $n$등분한 후, $\Delta x=\dfrac{b-a}{n}$, $x_k=a+k\Delta x$ 라고 하면 정적분과 급수의 합의 관계는 다음과 같다.
    $$\int_a^bf(x)dx=\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x$$
- label: 나
  body: |
    두 함수 $f(x)$와 $g(x)$가 미분 가능할 때, 다음의 관계가 성립한다.
    $$\int f(x)g'(x)dx=f(x)g(x)-\int f'(x)g(x)dx$$
- label: 다
  body: |
    $\displaystyle\lim_{n\to\infty}\dfrac1{n^3}\left[f\left(\dfrac1n\right)+2^2f\left(\dfrac2n\right)+3^2f\left(\dfrac3n\right)+\cdots+n^2f\left(\dfrac nn\right)\right]=S$ 라고 하자.
