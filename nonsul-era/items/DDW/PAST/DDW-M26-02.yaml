    value: Integral(x**2*f(x), (x, 0, 1))
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $\displaystyle\lim_{n\to\infty}\dfrac1{n^3}\left[f\left(\dfrac1n\right)+2^2f\left(\dfrac2n\right)+3^2f\left(\dfrac3n\right)+\cdots+n^2f\left(\dfrac nn\right)\right]=\lim_{n\to\infty}\dfrac1{n^3}\sum_{k=1}^{n}k^2f\left(\dfrac kn\right)$이다. (1)
      source_flow: 예시 답안 p.49
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        적분과 급수의 합과의 관계는 $\displaystyle\int_a^bf(x)dx=\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x$ (단, $\Delta x=\dfrac{b-a}{n}$, $x_k=a+k\Delta x$)이기 때문에 위의 급수의 합은 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac{k^2}{n^2}f\left(\dfrac kn\right)\dfrac1n=\lim_{n\to\infty}\sum_{k=1}^{n}x_k^2f(x_k)\Delta x$ $\left(\Delta x=\dfrac{1-0}{n},\ x_k=0+k\times\dfrac1n\right)$으로 볼 수 있다. (2)
      source_flow: 예시 답안 p.49
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        이로부터 정적분 $\displaystyle\int_0^1x^2f(x)dx$로 나타낼 수 있다. (3)
      source_flow: 예시 답안 p.49
      criteria:
      - 2-1.A1
