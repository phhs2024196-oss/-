- id: 3-2
  stem: |
    (2) 함수 $D(x)$의 극댓값과 극솟값을 증감표를 활용하여 구하시오. (25점)
  points: 25
  depends_on:
  - 3-1
  answer:
    kind: value
    value: max=4; min=0
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $j(x)=ax+b$라 하자. $h(2)=j(2)$, $h(2)=-12$, $j(2)=2a+b=-12$이다. 함수 $y=h(x)$의 그래프와 함수 $y=j(x)$의 그래프가 $x=2$에서 접하므로 $h'(2)=j'(2)$이다. $h'(x)=3x^2-6x-4$이므로 $h'(2)=-4$, $j'(2)=a$이다. $\therefore a=-4,\ b=-4$
      source_flow: 예시 답안 p.50
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        $j(x)=-4x-4$이다.
      source_flow: 예시 답안 p.50
      criteria:
      - 3-2.A1
    - id: 32b-3
      content: |
        $D(x)=x^3-3x^2-4x-(-4x-4)=x^3-3x^2+4$, $D'(x)=3x^2-6x=0$인 $x$값은 0과 2이다.
      source_flow: 예시 답안 p.50
      criteria:
      - 3-2.M2
    - id: 32b-4
      content: |
        증감표는 다음과 같다. $x<0$에서 $D'(x)>0$으로 증가, $x=0$에서 $D(x)=4$, $0<x<2$에서 $D'(x)<0$으로 감소, $x=2$에서 $D(x)=0$, $x>2$에서 $D'(x)>0$으로 증가이다.
      source_flow: 예시 답안 p.50
      criteria:
      - 3-2.M3
    - id: 32b-5
      content: |
        $x=0$에서 극댓값 4, $x=2$에서 극솟값 0이다.
      source_flow: 예시 답안 p.50
      criteria:
      - 3-2.A2
