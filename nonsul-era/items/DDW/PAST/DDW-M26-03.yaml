intent: 절댓값을 포함한 함수의 그래프 개형, 연속성과 미분가능성을 이해하여 최고차항의 계수가 주어진 삼차함수를 구하고, 접선의 방정식과 도함수·증감표로 극댓값과 극솟값을 구하는 능력을 평가한다.
key_idea: $g$가 $x=0$에서 연속이라는 조건에서 $2\lvert k^2-k-12\rvert=12$로부터 정수 $k=-2,3$을 얻고, $g(x)h(x)$가 미분가능하려면 $g$의 미분불가능한 점($x=0$ 포함)에서 $h(x)=0$이어야 한다. 각 $k$에 대해 $h$를 세워 $h'(4)=20$으로 $k=-2$를 가린다.
stuck: $g(x)h(x)$의 미분가능성을 $g$의 미분불가능한 점마다 $h(x)=0$이라는 조건으로 바꾸지 못하거나, $x<0$인 구간에서 $2f(x+k)$의 꺾이는 점만 정의역 안에서 골라야 함을 놓친다.
