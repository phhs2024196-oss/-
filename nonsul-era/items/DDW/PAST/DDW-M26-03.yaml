stimuli: []
stem: |
  어떤 유전자는 자극 조건 $x$에 따라 발현량이 변화한다. 이 유전자는 자극 이전($x<0$)에는 환경에 민감하게 반응하고, 자극 이후($x\ge0$)에는 일반적인 반응을 보인다.

  따라서 함수 $f(x)=\lvert x^2-x-12\rvert$에 대하여, 자극에 따른 유전자 발현량 함수 $g(x)$는 다음과 같다.

  $$g(x)=\begin{cases}2f(x+k)&(x<0)\\f(x)&(x\ge0)\end{cases}$$

  (단, $k$는 정수이며, $g(x)$는 $x=0$에서 연속이다.)

  또한, 이 유전자는 약물 투여에 의해서도 발현이 조절된다. 약물 투여에 따른 유전자 발현량 변화를 $h(x)$로 나타낼 때, 함수 $h(x)$는 최고차항의 계수가 1인 삼차함수이고, 다음 두 조건을 만족한다.

  (가) 최종 유전자 반응 결과는 $g(x)h(x)$로 정의되며 실수 전체의 집합에서 미분 가능하다.
  (나) 실험 결과, 특정 시점인 $x=4$에서 $h(x)$의 순간 변화율은 $h'(4)=20$이다.

  계획된 약물 투여에 의한 유전자 발현량 변화 함수 $j(x)$는 일차함수이고, 함수 $y=j(x)$의 그래프는 $x=2$에서 함수 $y=h(x)$의 그래프와 접한다. 실제 약물 투여에 의한 발현량 변화와 계획된 약물 투여에 의한 발현량 변화 차이를 함수 $D(x)$라 할 때, $D(x)=h(x)-j(x)$로 나타낸다.
subparts:
- id: 3-1
  stem: |
    (1) 함수 $h(x)$와 이에 대한 $h(k)$의 값을 구하시오. (45점)
  points: 45
  depends_on: []
  answer:
    kind: value
    value: h=x**3-3*x**2-4*x; hk=-12
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        주어진 조건에 의해 $g(x)$는 $x=0$에서 연속이므로 $\displaystyle\lim_{x\to0-}g(x)=\lim_{x\to0+}g(x)$, 곧 $2f(k)=f(0)$, $2\lvert k^2-k-12\rvert=12$, $\lvert k^2-k-12\rvert=6$이다. (1)
      source_flow: 예시 답안 p.50
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $k<-3$ 또는 $k>4$일 때 $k^2-k-18=0$을 만족시키는 정수 $k$값은 없다. $-3\le k\le4$일 때 $k^2-k-6=0$, $k=-2$ 또는 $k=3$이다. (2)
      source_flow: 예시 답안 p.50
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        $k=-2$인 경우, 함수 $g(x)$는 $x=-1$, $x=0$, $x=4$에서 미분가능하지 않다. $g(x)h(x)$가 실수 전체의 집합에서 미분 가능하므로 $h(x)=x(x+1)(x-4)=x^3-3x^2-4x$이다. (3)①
      source_flow: 예시 답안 p.50
      criteria:
      - 3-1.M3
    - id: 31b-4
      content: |
        $h'(x)=3x^2-6x-4$이고 $h'(4)=20$을 만족시킨다. (3)②
      source_flow: 예시 답안 p.50
      criteria:
      - 3-1.A1
    - id: 31b-5
      content: |
        $k=3$인 경우, 함수 $g(x)$는 $x=-6$, $x=0$, $x=4$에서 미분가능하지 않다. $g(x)h(x)$가 실수 전체의 집합에서 미분 가능하므로 $h(x)=x(x+6)(x-4)=x^3+2x^2-24x$이다. $h'(x)=3x^2+4x-24$이고 $h'(4)=20$을 만족시키지 않는다. (4)
      source_flow: 예시 답안 p.50
      criteria:
      - 3-1.M4
    - id: 31b-6
      content: |
        그러므로 $h(x)=x^3-3x^2-4x$이고, $h(k)=h(-2)=-12$이다. (5)
      source_flow: 예시 답안 p.50
      criteria:
      - 3-1.A2
