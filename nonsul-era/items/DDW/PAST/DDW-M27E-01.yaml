key_idea: |
  절댓값 안의 부호가 바뀌는 지점으로 구간을 나누면 $f$는 $x=\dfrac12$에서 꺾이는 산 모양 그래프이고, $g(x)=-\lvert 2f(x)-1\rvert+1$은 $f(x)=\dfrac12$인 $x=\dfrac14,\dfrac34$에서 다시 구간을 나누어 $[0,1]$에서 꼭짓점이 두 개인 W자 모양(M자 모양)이 된다. 수평선 $y=b$ $(0<b<1)$와 네 선분이 한 번씩 만나므로 근은 4개이고, 근을 직접 구해 더한다.
stuck: |
  $g$의 절댓값 안 $2f(x)-1$의 부호가 $f(x)=\dfrac12$, 곧 $x=\dfrac14,\dfrac34$에서 바뀐다는 것을 보지 못하고 $x=\dfrac12$에서만 나누어 구간을 2개로 잡는다.
