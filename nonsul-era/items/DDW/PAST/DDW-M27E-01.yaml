stimuli: []
stem: |
  두 함수 $f(x)$와 $g(x)$가 닫힌구간 $[0, 1]$에서 다음과 같이 정의될 때, 아래 물음에 답하시오.

  (가) $f(x)=-\lvert 2x-1\rvert+1$

  (나) $g(x)=-\lvert 2f(x)-1\rvert+1$
subparts:
- id: 1-1
  stem: |
    $x$축과 함수 $y=f(x)$의 그래프로 둘러싸인 부분의 넓이를 구하시오. (7점)
  points: 7
  depends_on: []
  answer:
    kind: value
    value: 1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        절댓값 기호 안의 값이 $x=\dfrac12$을 경계로 부호가 달라지므로 이를 기준으로 범위를 나눈다. $0\le x<\dfrac12$일 때 $f(x)=(2x-1)+1=2x$, $\dfrac12\le x\le1$일 때 $f(x)=-(2x-1)+1=-2x+2$이다.
      source_flow: 가이드북 p.43·49
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        그래프로 나타내면 $x$축과 $y=f(x)$의 그래프로 둘러싸인 부분은 세 점 $(0,0)$, $(1,0)$, $\left(\dfrac12,1\right)$을 꼭짓점으로 하는 이등변삼각형이고 그 넓이는 $\dfrac12\times1\times1=\dfrac12$이다.
      source_flow: 가이드북 p.43·49
      criteria:
      - 1-1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 7
      evidence: $x$의 범위에 따라 $f(x)$를 구하고(구간별 식 $2x$, $-2x+2$) 그래프와 $x$축으로 둘러싸인 도형의 넓이 $\dfrac12$을 구한다. (공식 채점기준 7점 단일 항목)
      steps:
      - 11b-1
      - 11b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    $0<b<1$일 때, 방정식 $g(x)=b$를 만족시키는 근의 개수를 구하는 과정을 서술하시오. (12점)
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $f(x)<\dfrac12$인 $x$의 범위와 $f(x)\ge\dfrac12$인 $x$의 범위로 나눈다. $0\le x<\dfrac14$일 때 $f(x)<\dfrac12$이므로 $g(x)=2f(x)=4x$, $\dfrac14\le x<\dfrac12$일 때 $f(x)\ge\dfrac12$이므로 $g(x)=-2f(x)+2=-4x+2$, $\dfrac12\le x<\dfrac34$일 때 $f(x)>\dfrac12$이므로 $g(x)=-2f(x)+2=4x-2$, $\dfrac34\le x\le1$일 때 $f(x)\le\dfrac12$이므로 $g(x)=2f(x)=-4x+4$이다.
      source_flow: 가이드북 p.43·49
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        이를 그래프로 나타내면 $y=g(x)$는 $x=0,\dfrac12,1$에서 $0$, $x=\dfrac14,\dfrac34$에서 $1$인 꺾은선이다. 따라서 $0<b<1$일 때 직선 $y=b$와 네 선분이 한 점씩 만나므로 $g(x)=b$의 근의 개수는 4개이다.
      source_flow: 가이드북 p.43·49
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 8
      evidence: $x$의 범위에 따른 $g(x)$를 모두 구한다. (구간 $\left[0,\dfrac14\right)$, $\left[\dfrac14,\dfrac12\right)$, $\left[\dfrac12,\dfrac34\right)$, $\left[\dfrac34,1\right]$에서 $4x$, $-4x+2$, $4x-2$, $-4x+4$)
      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 4
      evidence: 조건을 만족하는 $x$값의 개수 4를 구한다.
      steps:
      - 12b-2
      depends_on:
      - 1-2.M1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-3
  stem: |
    $0<b<1$일 때, 방정식 $g(x)=b$를 만족시키는 모든 근의 합을 구하시오. (6점)
  points: 6
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        구간별로 $g(x)=b$를 풀면 $0\le x<\dfrac14$에서 $4x=b$이므로 $x=\dfrac b4$, $\dfrac14\le x<\dfrac12$에서 $-4x+2=b$이므로 $x=-\dfrac{b-2}{4}$, $\dfrac12\le x<\dfrac34$에서 $4x-2=b$이므로 $x=\dfrac{b+2}{4}$, $\dfrac34\le x\le1$에서 $-4x+4=b$이므로 $x=-\dfrac{b-4}{4}$이다.
      source_flow: 가이드북 p.43·49
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        모든 근의 합은 $\dfrac b4-\dfrac{b-2}{4}+\dfrac{b+2}{4}-\dfrac{b-4}{4}=\dfrac84=2$이다. (대칭성: 그래프가 $x=\dfrac12$에 대해 대칭이므로 근이 $\dfrac12$에 대해 쌍으로 나타나 합은 $2\times\dfrac12\times2=2$로도 확인된다.)
      source_flow: 가이드북 p.43·49
      criteria:
      - 1-3.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 6
      evidence: 각 구간에서 근을 구하고 얻어진 근의 값의 합 2를 구한다. (공식 채점기준 6점 단일 항목)
      steps:
      - 13b-1
      - 13b-2
