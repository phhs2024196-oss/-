key_idea: |
  (가)는 진수 조건 $x>8$을 먼저 세운 뒤 $\log_3(x-8)(x-6)\le1$에서 $(x-8)(x-6)\le3$을 풀어 교집합 $8<x\le9$를 얻고, (나)는 $3^y=Y>0$으로 치환한 이차부등식 $(Y-9)(Y+1)\le0$에서 $y\le2$를 얻는다. 두 항이 각각 $x$, $y$에 대해 증가함수이므로 $x=9$, $y=2$에서 최댓값 7을 가진다.
stuck: |
  진수 조건 $x-8>0$, $x-6>0$을 빠뜨려 $5\le x\le9$로 답하거나, $Y=3^y>0$이므로 $Y+1>0$이라는 것을 쓰지 않고 이차부등식의 해 $-1\le Y\le9$를 그대로 쓴다.
