stimuli: []
stem: |
  두 실수 $x$, $y$가 다음 두 부등식을 만족할 때, 아래 물음에 답하시오.

  (가) $\log_3(x-8)+\log_3(x-6)\le1$

  (나) $9^y-8\times3^y-9\le0$
subparts:
- id: 1-1
  stem: |
    부등식 (가)를 만족하는 $x$의 값의 범위를 구하시오. (9점)
  points: 9
  depends_on: []
  answer:
    kind: set
    value: 8<x<=9
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        로그의 진수 조건에 따라 $x-8>0$, $x-6>0$이므로 $x>8$이다.
      source_flow: 가이드북 p.44·50
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $\log_3(x-8)(x-6)\le1$이므로 $(x-8)(x-6)\le3$이고, 정리하면 $x^2-14x+45\le0$이므로 $5\le x\le9$이다. $x>8$과 공통인 부분을 구하면 $8<x\le9$이다.
      source_flow: 가이드북 p.44·50
      criteria:
      - 1-1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 9
      evidence: 진수 조건 $x>8$을 쓰고 $x^2-14x+45\le0$에서 $5\le x\le9$를 구하여 공통 범위 $8<x\le9$를 구한다. (공식 채점기준 9점 단일 항목)
      steps:
      - 11b-1
      - 11b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    부등식 (나)를 만족하는 $y$의 값의 범위를 구하시오. (9점)
  points: 9
  depends_on: []
  answer:
    kind: set
    value: y<=2
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $3^y=Y$ $(Y>0)$이라 하면 $Y^2-8Y-9\le0$이고 $(Y-9)(Y+1)\le0$이다.
      source_flow: 가이드북 p.44·50
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $Y+1=3^y+1>0$이므로 $Y-9\le0$이고 $Y=3^y\le9$가 되어 $y\le2$이다.
      source_flow: 가이드북 p.44·50
      criteria:
      - 1-2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 9
      evidence: $3^y=Y$로 치환하여 $(Y-9)(Y+1)\le0$을 얻고, $Y+1>0$임을 이용해 $3^y\le9$, 곧 $y\le2$를 구한다. (공식 채점기준 9점 단일 항목)
      steps:
      - 12b-1
      - 12b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-3
  stem: |
    $\log_{\sqrt3}x+\sqrt{3^y}$의 최댓값을 구하시오. (7점)
  points: 7
  depends_on: []
  answer:
    kind: value
    value: '7'
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        (가)를 만족하는 범위는 $8<x\le9$, (나)를 만족하는 범위는 $y\le2$이므로 $\log_{\sqrt3}x+\sqrt{3^y}$의 최댓값은 $x=9$, $y=2$일 때 얻어진다.
      source_flow: 가이드북 p.44·50
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        그 값은 $\log_{\sqrt3}9+(\sqrt3)^2=\log_{\sqrt3}(\sqrt3)^4+3=4+3=7$이다.
      source_flow: 가이드북 p.44·50
      criteria:
      - 1-3.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 7
      evidence: $x=9$, $y=2$에서 최대임을 보이고 최댓값 7을 구한다. (공식 채점기준 7점 단일 항목)
      steps:
      - 13b-1
      - 13b-2
