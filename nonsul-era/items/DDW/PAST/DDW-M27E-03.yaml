stimuli: []
stem: |
  두 함수 $f(x)$와 $g(x)$가 다음과 같이 정의될 때, 아래 물음에 답하시오.

  (가) $f(x)=\begin{cases}(x+2)(x+4)&(x<0)\\(x-2)(x-6)&(x\ge0)\end{cases}$

  (나) $g(x)=f(x)f(x-a)$
subparts:
- id: 1-1
  stem: |
    함수 $g(x)$가 $x=0$에서 연속이 되도록 하는 양수 $a$의 값을 모두 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: set
    value: 2,4
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        함수 $f(x)$는 $\displaystyle\lim_{x\to0-}f(x)=8$, $\displaystyle\lim_{x\to0+}f(x)=12$로 $x=0$에서 불연속이다. 함수 $y=f(x-a)$의 그래프는 $y=f(x)$의 그래프를 $x$축의 방향으로 $a$만큼 평행이동한 것이므로 $f(x-a)$는 $x=a$에서 불연속이다.
      source_flow: 가이드북 p.45·51
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $g(x)$가 $x=0$에서 연속이 되기 위해서는 $g(0)=\displaystyle\lim_{x\to0-}g(x)=\lim_{x\to0+}g(x)$를 만족해야 한다. $g(0)=\displaystyle\lim_{x\to0-}g(x)=8f(-a)$, $g(0)=\displaystyle\lim_{x\to0+}g(x)=12f(-a)$이므로 $8f(-a)=12f(-a)$, 곧 $f(-a)=0$이어야 한다.
      source_flow: 가이드북 p.45·51
      criteria:
      - 1-1.M1
    - id: 11b-3
      content: |
        $f(-a)=(-a+2)(-a+4)=0$이므로 $a=2$ 또는 $a=4$이다.
      source_flow: 가이드북 p.45·51
      criteria:
      - 1-1.M1
