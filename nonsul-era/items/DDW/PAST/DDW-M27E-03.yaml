key_idea: |
  $f$는 $x=0$에서 좌극한 $8$, 우극한 $12$로 불연속이므로 $f(x-a)$는 $x=a$에서 불연속이다. $g=f(x)f(x-a)$가 불연속일 수 있는 곳은 $x=0$과 $x=a$뿐이고, $x=0$에서는 $8f(-a)=12f(-a)$, $x=a$에서는 $8f(a)=12f(a)$이므로 각각 $f(-a)=0$, $f(a)=0$이 연속의 필요충분조건이다.
stuck: |
  $f(x-a)$의 불연속점을 $x=-a$로 잘못 잡거나, $x=0$에서 $f(-a)$를 $x\ge0$인 식 $(x-2)(x-6)$으로 계산한다. (3)에서 (1)과 (2)의 두 조건을 동시에 만족해야 함을 놓친다.
