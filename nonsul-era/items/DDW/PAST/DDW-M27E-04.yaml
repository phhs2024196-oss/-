  answer:
    kind: value
    value: '8'
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $g'(x)=-3x^2+2bx+27-6b=-(x-3)(3x-2b+9)$이므로 $g'(x)=0$에서 $x=3$ 또는 $x=\dfrac{2b-9}{3}$이다.
      source_flow: 가이드북 p.46·52
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        함수 $g(x)$가 $x=3$에서 극대이기 위해서는 $\dfrac{2b-9}{3}<3$, 곧 $b<9$이다. 따라서 이를 만족하는 정수 $b$의 최댓값은 $8$이다.
      source_flow: 가이드북 p.46·52
      criteria:
      - 1-3.M1
