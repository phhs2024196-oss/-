key_idea: |
  (가)에서 $(a+9)a\le0$인 정수 $a$를 구하고, (나)에서 극대의 필요조건 $g'(3)=0$으로 $c=27-6b$를 얻은 뒤 $g'(x)=-(x-3)(3x-2b+9)$의 다른 근 $\dfrac{2b-9}{3}$이 $3$보다 작아야 $x=3$ 좌우에서 $g'$의 부호가 $+$에서 $-$로 바뀌므로 $b<9$, 정수 $b$의 최댓값은 8이다.
stuck: |
  극대 조건을 $g'(3)=0$만으로 처리하고 $x=3$ 좌우에서 도함수의 부호가 $+\to-$로 바뀌는 조건(다른 근이 3보다 작을 것)을 확인하지 않아 $b$의 범위를 구하지 못한다.
