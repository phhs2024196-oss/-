- id: 1-2
  stem: |
    $c$를 $b$에 대한 식으로 나타내시오. (7점)
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: 27-6*b
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $g(x)=-x^3+bx^2+cx$에서 $g'(x)=-3x^2+2bx+c$이다. 함수 $g(x)$가 $x=3$에서 극대이므로 $g'(3)=-27+6b+c=0$, 곧 $c=27-6b$이다.
      source_flow: 가이드북 p.46·52
      criteria:
      - 1-2.M1
