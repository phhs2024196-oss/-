stimuli: []
stem: |
  정수 $a$, $b$, $c$에 대하여 함수 $f(x)=(x-3)^2+a$와 $g(x)=-x^3+bx^2+cx$가 다음 조건을 만족한다.

  (가) $f(0)f(3)\le0$

  (나) 함수 $g(x)$는 $x=3$에서 극대이다.
subparts:
- id: 1-1
  stem: |
    $a$의 값을 모두 구하시오. (8점)
  points: 8
  depends_on: []
  answer:
    kind: set
    value: -9,-8,-7,-6,-5,-4,-3,-2,-1,0
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $f(0)=9+a$, $f(3)=a$이고 $f(0)f(3)\le0$, 곧 $(a+9)a\le0$이므로 이를 만족하는 정수 $a$는 $a=-9,-8,-7,-6,-5,-4,-3,-2,-1,0$이다.
      source_flow: 가이드북 p.46·52
      criteria:
      - 1-1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
