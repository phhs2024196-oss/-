stimuli: []
stem: |
  기업은 제품이 어떤 가격에서 어느 정도 판매될 것인지를 예상하여 제품을 생산한다. 그런데 기업이 예상한 만큼 판매가 이루어지지 않으면 예상보다 적은 이익을 얻거나, 손해를 볼 수 있다. 따라서 기업은 자신들이 제품을 최소한 어느 정도 판매해야 손해를 피할 수 있는지를 분석해야 한다. 이 과정에서 활용할 수 있는 것이 손익분기점이다.

  손익분기점은 기업의 수익과 비용이 일치하는 지점을 말한다. 손익분기점을 이해하기 위해서는 기업의 수익과 비용의 개념을 알아야 한다. 기업의 수익은 제품의 판매가격과 판매량의 곱이고, 비용은 고정비용과 변동비용을 합한 금액이다. 이때 수익에서 비용을 빼면 기업의 이익이 된다. 그러므로 손익분기점은 수익과 비용이 같아지는 지점의 판매량으로 나타낼 수 있고, 이 판매량을 손익분기점 판매량이라 한다. 손익분기점 판매량은 아래와 같이 ㉠산출한다.

  $$\text{손익분기점 판매량}=\dfrac{\text{고정비용}}{\text{판매가격}-\text{단위당 변동비용}}$$

  여기에서 고정비용은 생산량이나 판매량에 따라 변하지 않는 비용이다. 생산 설비에 대한 투자비용, 임대료, 연구 개발비 등이 대표적인 고정비용이다. 일반적으로 제품 생산에는 일정 수준의 고정비용이 ㉡발생한다. 반면에 변동비용은 생산량이나 판매량에 따라 변하는 비용이다. 제품 생산을 위한 원자재 비용, 포장비 등이 변동비용에 속한다. 변동비용은 제품 생산량이 늘어남에 따라 증가한다. 그리고 고정비용과 변동비용을 합한 비용을 생산량으로 나누면 해당 제품의 단위당 비용이 된다. 마찬가지로 고정비용과 변동비용을 각각 생산량으로 나누면 해당 제품의 단위당 고정비용, 단위당 변동비용이 된다. 이러한 개념들을 바탕으로 손익분기점 판매량을 산출해 보면, 고정비용이나 단위당 변동비용이 늘어날수록 손익분기점 판매량은 커지게 된다는 것을 알 수 있다.

  어떤 기업이 생산하는 제품의 고정비용은 20,000원, 단위당 변동비용은 100원, 제품의 가격은 500원이라고 ㉢가정하자. 이 제품의 손익분기점 판매량은 50단위이다. 즉 기업이 이 제품을 50단위 판매했을 때 수익과 비용이 같다. 그러므로 이 제품을 50단위보다 많이 판매한다면 기업은 이익을 얻을 수 있다.

  기업의 손익분기점 분석이 ㉣유효하기 위해서는 비용 구조를 정확하게 파악해야 한다. 비용이 달라진다면 손익분기점도 달라지기 때문이다. 또한 판매량을 정확하게 예측해야 한다. 예상과 달리 실제 판매량이 손익분기점 판매량보다 적다면 기업이 손해를 보기 때문이다. 기업은 손익분기점 분석을 통해서 제품의 판매 성과에 대한 평가, ㉤적정한 생산 방법의 결정 등 각종 의사 결정에 필요한 자료를 얻을 수 있다.
