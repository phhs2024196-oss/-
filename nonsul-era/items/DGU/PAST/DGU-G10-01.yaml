subparts:
- id: '1'
  stem: |
    수열을 수식으로 표현하는 두 가지 방법을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 일반항($n$의 함수식)과 점화식(초기값 + 이전 항과의 관계식). 일반항은 특정 항·합 계산에, 점화식은 생성 규칙·항 사이 관계 이해에 유리.
    steps:
    - {id: 1a, content: '$a_n=2n-1$ ⇔ $a_1=1,\ a_n=a_{n-1}+2$; 피보나치는 점화식이 생성 규칙을, 일반항(비네 공식)이 $b_n$ 직접 계산을 준다', criteria: [1.B1, 1.B2, 1.R1]}
    hint_ladder:
    - 제시문 [가]와 [나]가 각각 강조하는 표현 방식은?
    - '[가]의 수열을 점화식으로도 써 보자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.83 [문제 1]
    steps:
    - id: 1b-1
      content: |
        제시문 [가]의 수열 $a_n$이 일반항 $a_n=2n-1$ 또는 점화식 $a_n=a_{n-1}+2,\ a_1=1$로 표현될 수 있듯이, 수열은 일반항과 점화식의 두 가지 형태로 표현할 수 있다.
      criteria: [1.B1, 1.B2]
    - id: 1b-2
      content: |
        일반항은 수열의 $n$번째 항의 값을 $n$의 함수식으로 정의한 것이다. [가]처럼 $n$번째 항($a_{57}=113$)을 바로 구할 수 있다는 점과 수열의 합($\sum_{n=1}^{100}a_n=10000$) 같은 연산의 편의성에서 일반항의 유용성을 확인할 수 있다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        한편 점화식은 수열의 처음 값들의 정의와 $n$번째 항의 값을 $n$ 이전 항들의 함수식으로 나타낸 것이다. [나]의 피보나치 수열 예에서와 같이 일반항보다는 수열들 간의 관계(생성 방식)를 설명하고 이해하는 데 점화식이 더 유용하다(대신 $b_n$을 바로 구하기는 어렵다).
      criteria: [1.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
