stimuli:
- label: 가
  body: |
    수열은 어떤 규칙에 의해 순서가 정해진 채 나열되는 수들의 집합을 의미한다. 이러한 수들의 관계가 수식으로 정의될 수 있다면 해당 수열에 대한 여러 가지 연산을 손쉽게 할 수 있다. 예를 들면, $n$을 자연수라 할 때 수열의 일반항 $a_n$이 $a_n=2n-1$로 정의되면, 수열은 $a_1=1$, $a_2=3$, $a_3=5,\cdots$과 같은 홀수들을 나타내는 것임을 쉽게 알 수 있다. 수열에 관한 이러한 식은 수들 간의 관계를 탐구하고, 이를 간결하게 정리하는데 유용하다. 가령 57번째 수를 알고자 한다면 일반항으로부터 $a_{57}=2\times57-1=113$임을 신속히 확인할 수 있다. 또한, $a_1$부터 $a_{100}$까지의 합, 즉 $a_1+a_2+a_3+\cdots+a_{100}=\sum_{n=1}^{100}a_n$을 구하기 위해 $a_1,\cdots,a_{100}$의 값을 일일이 구해서 합할 필요 없이 1부터 $k$까지 자연수의 합이 $\sum_{n=1}^kn=\dfrac{k(k+1)}{2}$이라는 사실을 이용하여
    $$\sum_{n=1}^{100}a_n=\sum_{n=1}^{100}(2n-1)=2\sum_{n=1}^{100}n-100=100\times101-100=10000$$
    임을 쉽게 계산해 낼 수 있다.
- label: 나
  body: |
    수열들 중에는 재미있는 특성을 지닌 것도 있는데, 피보나치(Fibonacci) 수열은 그 생성규칙의 특이성과 성질로 인해 문화, 예술 등에 많은 영향을 주었다. 피보나치 수열은 다음과 같다.
    $$b_1=1,\ b_2=1,\ b_3=2,\ b_4=3,\ b_5=5,\ b_6=8,\ b_7=13,\ b_8=21,\ b_9=34,\ b_{10}=55,\cdots$$
    이 수열을 수열의 초기 값과 이웃하는 항들 사이의 관계식으로 구성되는 점화식으로 표현하면, 피보나치 수열이 어떻게 생성된 것인지를 이해하기가 매우 쉽다.
    $$b_1=1,\quad b_2=1,\quad b_n=b_{n-2}+b_{n-1},\quad n=3,\ 4,\ 5,\ 6,\ \cdots$$
    즉, $b_1$과 $b_2$는 1로 주어지고, $b_3$부터는 앞의 두 수의 합으로 정의된다는 것을 쉽게 확인할 수 있다. 하지만 위의 점화식으로는 $b_n$이 얼마인지 바로 확인하는 것은 매우 어렵다. 왜냐하면 $b_{n-1}$과 $b_{n-2}$를 알아야 하는데 이 값들 역시 $b_{n-3}$과 $b_{n-4}$의 계산 없이 구할 수 없기 때문이다. 물론 일반항을 이용한다면 쉽게 계산할 수 있다. 아래와 같은 피보나치 수열의 일반항은 다소 복잡해 보일 뿐만 아니라 점화식보다 피보나치 수열의 생성방식을 이해하는 데는 불편하다.
    $$b_n=\dfrac{1}{\sqrt5}\left[\left(\dfrac{1+\sqrt5}{2}\right)^n-\left(\dfrac{1-\sqrt5}{2}\right)^n\right],\quad n=1,\ 2,\ 3,\cdots$$
    피보나치 수열에서 $\lim_{n\to\infty}\dfrac{b_{n+1}}{b_n}=\dfrac{1+\sqrt5}{2}$은 흥미롭게도 고대 그리스인들 사이에서 가장 조화로운 비율로 믿어져왔던 황금비의 값(1.618...)과 일치한다. 이 황금비의 값은 지금까지도 미술, 음악, 역사, 건축, 생물학, 심리학 등의 다양한 영역에서 활용되고 있는데, 이 값은 피보나치 수열의 점화식의 변형 $\dfrac{b_n}{b_{n-1}}=\dfrac{b_{n-2}}{b_{n-1}}+1$과 수열의 극한 등을 이용하여 유도해 낼 수 있다.

