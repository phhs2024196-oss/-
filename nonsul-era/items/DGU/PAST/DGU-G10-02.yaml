- id: '1'
  stem: |
    피보나치 수열의 점화식을 이용하여 황금비의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac{1+\sqrt5}{2}', equivalents: ['1.618…'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 항의 비의 극한 $x$는 $x=\dfrac1x+1$의 양근.
    steps:
    - {id: 1a, content: '$x^2-x-1=0$, $x>0$ ⇒ $x=\dfrac{1+\sqrt5}{2}$', criteria: [1.A1, 1.R1]}
    hint_ladder:
    - 제시문 [나]의 변형된 점화식을 보자.
    - $\dfrac{b_{n-2}}{b_{n-1}}$은 $\dfrac{b_{n-1}}{b_{n-2}}$의 역수이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.83 [문제 2]
    steps:
    - id: 1b-1
      content: |
        피보나치 수열의 연속되는 두 항의 비의 극한이 존재하고 황금비와 일치함은 제시문 [나]에 기술되어 있다. 이를 사용하기 위해 피보나치 수열의 또 다른 형태의 점화식 $\dfrac{b_n}{b_{n-1}}=\dfrac{b_{n-2}}{b_{n-1}}+1$을 살펴본다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\dfrac{b_n}{b_{n-1}}$과 $\dfrac{b_{n-1}}{b_{n-2}}$의 극한은 동일하고 이를 $x$라 하면 점화식으로부터 방정식 $x=\dfrac1x+1$을 얻는다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        이 방정식은 이차방정식 $x^2-x-1=0$으로 볼 수 있으며 근의 공식으로 $x=\dfrac{1\pm\sqrt5}{2}$.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        피보나치 수열은 음수가 아니므로 $x$는 양수여야 한다. 따라서 두 값 중 양수인 $\dfrac{1+\sqrt5}{2}$가 황금비가 된다.
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
