      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $x^2-x-1=0$의 근 $\dfrac{1\pm\sqrt5}{2}$를 적었다.
      depends_on: [1.M2]
      steps: [1a, 1b-3]
    - id: 1.R1
      mark_type: R
      points: 5
