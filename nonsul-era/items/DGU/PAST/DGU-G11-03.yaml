stimuli:
- label: 본문
  body: |
    태평양 거대 쓰레기 지대(Great Pacific Garbage Patch)는 각각 하와이 북쪽 지역과 일본과 하와이 사이 지역을 떠다니는 두 개의 거대한 쓰레기 더미를 일컫는다. 이 쓰레기 더미들은 지금까지 인류가 만든 인공물 중 가장 큰 것들로, 하와이 북단의 덩어리 하나만 해도 한반도의 6배 크기다. 이처럼 쓰레기가 한 곳으로 모여 섬에 가까운 모습이 된 것은 원형 순환 해류와 바람 때문인 것으로 알려져 있다. 이러한 태평양 거대 쓰레기 지대 때문에 수많은 해양생물들이 피해를 보고 있으며, 특히 먹이로 잘못 알고 먹었다가 죽게 되는 사례도 있다.
- label: 가
  body: |
    $A$, $B$ 두 지역에 부유물이 모여 있다. $A$, $B$ 외의 다른 지역으로부터 부유물의 유입이 없고, 부유물이 새로 생성되거나 사라지지 않는다고 할 때, 매월 두 지역 $A$, $B$의 부유물의 양이 어떻게 변하는지 행렬로 표현해 보자.
    1월 초 두 지역 $A$, $B$의 부유물 양은 각각 10,000톤, 70,000톤이라 하자. 또 매월 지역 $A$의 부유물 $\dfrac13$이 지역 $B$로 이동하고 지역 $B$의 부유물 $\dfrac13$이 지역 $A$로 동시에 이동한다고 가정하자.
    $n$월 초 두 지역 $A$, $B$의 부유물 양을 각각 $a_n$, $b_n$으로 나타내면, 위의 가정에 의해 한 달 동안 지역 $A$의 부유물은 $\dfrac13a_n$이 지역 $B$로 이동하였으므로 $\dfrac23a_n$만큼 남아 있고, 지역 $B$의 부유물 $\dfrac13b_n$이 지역 $A$로 이동하였다. 따라서 $(n+1)$월 초 지역 $A$의 부유물은 $a_{n+1}=\dfrac23a_n+\dfrac13b_n$으로 표현할 수 있다. 같은 방법으로 지역 $B$의 부유물은 $b_{n+1}=\dfrac13a_n+\dfrac23b_n$으로 나타낼 수 있다. 이를 행렬로 표시하면 아래의 식 (1)과 같다.
    $$\begin{pmatrix}a_{n+1}\\b_{n+1}\end{pmatrix}=\begin{pmatrix}\dfrac23&\dfrac13\\\dfrac13&\dfrac23\end{pmatrix}\begin{pmatrix}a_n\\b_n\end{pmatrix}\quad\cdots\cdots\cdots\cdots\ (1)$$

stem: |
  제시문 [가]에 나타난 두 지역 $A$, $B$의 부유물 양은 시간이 지남에 따라 각각 $x$, $y$로 수렴한다. 즉 $x=\lim_{n\to\infty}a_n$, $y=\lim_{n\to\infty}b_n$이 성립한다. 이때 $x$, $y$를 구하는 과정을 기술하시오.
  <8 ~ 9줄 (250 ~ 300자)> [20점]

subparts:
- id: '1'
  stem: |
    $x$, $y$를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: 'x=40000,\ y=40000', equivalents: ['각 40,000톤'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 극한 방정식은 $x=y$ 하나뿐이므로 보존량 $a_n+b_n=80000$과 연립.
    steps:
    - {id: 1a, content: '$x=y$, $x+y=80000$ ⇒ $x=y=40000$', criteria: [1.A1]}
    hint_ladder:
    - 점화식 양변에 극한을 취해 보자. 식이 몇 개 나오는가?
    - 두 지역의 부유물 총량은 변하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.81 [문제 3] 답안1
    steps:
    - id: 1b-1
      content: |
        $x=\lim_{n\to\infty}a_n$, $y=\lim_{n\to\infty}b_n$이므로 제시문 [가]의 두 식 $a_{n+1}=\dfrac23a_n+\dfrac13b_n$, $b_{n+1}=\dfrac13a_n+\dfrac23b_n$의 양변에 극한을 취하면 $x=\dfrac23x+\dfrac13y$, $y=\dfrac13x+\dfrac23y$. 따라서 $x=y$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        또한 두 식을 더하면 $a_{n+1}+b_{n+1}=a_n+b_n\ (n=1,2,3,\cdots)$이므로 $a_1=10000$, $b_1=70000$으로부터 $a_n+b_n=a_{n-1}+b_{n-1}=\cdots=a_1+b_1=80000$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 $x+y=\lim_{n\to\infty}(a_n+b_n)=80000$.
      criteria: [1.R1]
    - id: 1b-4
      content: |
        $x=y$, $x+y=80000$으로부터 $x=40000$, $y=40000$이다.
      criteria: [1.A1]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 해설집 p.81 [문제 3] 답안2
    key_idea: $b_n=80000-a_n$을 대입하면 $a_{n+1}=\dfrac13a_n+\dfrac{80000}{3}$, 극한을 취해 $x=\dfrac13x+\dfrac{80000}{3}$.
    steps:
    - {id: 1alt-1, content: '$x=40000$, $y=80000-x=40000$', criteria: [1.M2, 1.R1, 1.A1]}
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 점화식 양변에 극한을 취해 $x=\dfrac23x+\dfrac13y$ 등을 쓰고 $x=y$를 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 두 식을 더해 $a_n+b_n=80000$(일정)을 보였다.
      depends_on: []
      steps: [1b-2, 1alt-1]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: 보존식에서 극한을 취해 $x+y=80000$(또는 $a_{n+1}=\dfrac13a_n+\dfrac{80000}3$의 극한 방정식)을 이끌었다.
      depends_on: [1.M2]
      steps: [1b-3, 1alt-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $x=40000$, $y=40000$을 적었다.
      depends_on: [1.R1]
      steps: [1a, 1b-4, 1alt-1]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
