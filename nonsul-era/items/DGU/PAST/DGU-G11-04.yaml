stimuli:
- label: 본문
  body: |
    태평양 거대 쓰레기 지대(Great Pacific Garbage Patch)는 각각 하와이 북쪽 지역과 일본과 하와이 사이 지역을 떠다니는 두 개의 거대한 쓰레기 더미를 일컫는다. 이 쓰레기 더미들은 지금까지 인류가 만든 인공물 중 가장 큰 것들로, 하와이 북단의 덩어리 하나만 해도 한반도의 6배 크기다. 이처럼 쓰레기가 한 곳으로 모여 섬에 가까운 모습이 된 것은 원형 순환 해류와 바람 때문인 것으로 알려져 있다. 이러한 태평양 거대 쓰레기 지대 때문에 수많은 해양생물들이 피해를 보고 있으며, 특히 먹이로 잘못 알고 먹었다가 죽게 되는 사례도 있다.
- label: 가
  body: |
    $A$, $B$ 두 지역에 부유물이 모여 있다. $A$, $B$ 외의 다른 지역으로부터 부유물의 유입이 없고, 부유물이 새로 생성되거나 사라지지 않는다고 할 때, 매월 두 지역 $A$, $B$의 부유물의 양이 어떻게 변하는지 행렬로 표현해 보자.
    1월 초 두 지역 $A$, $B$의 부유물 양은 각각 10,000톤, 70,000톤이라 하자. 또 매월 지역 $A$의 부유물 $\dfrac13$이 지역 $B$로 이동하고 지역 $B$의 부유물 $\dfrac13$이 지역 $A$로 동시에 이동한다고 가정하자.
    $n$월 초 두 지역 $A$, $B$의 부유물 양을 각각 $a_n$, $b_n$으로 나타내면, 위의 가정에 의해 한 달 동안 지역 $A$의 부유물은 $\dfrac13a_n$이 지역 $B$로 이동하였으므로 $\dfrac23a_n$만큼 남아 있고, 지역 $B$의 부유물 $\dfrac13b_n$이 지역 $A$로 이동하였다. 따라서 $(n+1)$월 초 지역 $A$의 부유물은 $a_{n+1}=\dfrac23a_n+\dfrac13b_n$으로 표현할 수 있다. 같은 방법으로 지역 $B$의 부유물은 $b_{n+1}=\dfrac13a_n+\dfrac23b_n$으로 나타낼 수 있다. 이를 행렬로 표시하면 아래의 식 (1)과 같다.
    $$\begin{pmatrix}a_{n+1}\\b_{n+1}\end{pmatrix}=\begin{pmatrix}\dfrac23&\dfrac13\\\dfrac13&\dfrac23\end{pmatrix}\begin{pmatrix}a_n\\b_n\end{pmatrix}\quad\cdots\cdots\cdots\cdots\ (1)$$

stem: |
  $n$월 초 지역 $C$, $D$의 부유물 양을 각각 $c_n$, $d_n$이라고 하자($n=1,2,3$). 또한, $C$와 $D$ 외의 다른 지역으로부터 부유물의 유입이 없고, 부유물이 새로 생성되거나 사라지지 않는다고 가정하자. 1월에는 지역 $C$의 부유물 1/5이 지역 $D$로 이동하고, 지역 $D$의 부유물 2/5가 지역 $C$로 동시에 이동하였다. 2월에는 지역 $C$의 부유물 3/5이 지역 $D$로 이동하고, 지역 $D$의 부유물 2/5가 지역 $C$로 동시에 이동하였다. 다음을 만족하는 행렬 $P$, $Q$, $R$을 구하는 과정을 제시문 [가]를 참조하여 기술하시오.
  (행렬식을 표시할 때는 답안지 두 줄을 사용하시오)
  <8 ~ 10줄> [15점]
  $$\begin{pmatrix}c_2\\d_2\end{pmatrix}=P\begin{pmatrix}c_1\\d_1\end{pmatrix},\quad\begin{pmatrix}c_3\\d_3\end{pmatrix}=Q\begin{pmatrix}c_2\\d_2\end{pmatrix},\quad\begin{pmatrix}c_3\\d_3\end{pmatrix}=R\begin{pmatrix}c_1\\d_1\end{pmatrix}$$

subparts:
- id: '1'
  stem: |
    행렬 $P$, $Q$, $R$을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 'P=\begin{pmatrix}\frac45&\frac25\\\frac15&\frac35\end{pmatrix},\ Q=R=\begin{pmatrix}\frac25&\frac25\\\frac35&\frac35\end{pmatrix}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 남는 비율이 대각, 넘어오는 비율이 비대각; $R=QP$.
    steps:
    - {id: 1a, content: '$QP=\begin{pmatrix}\frac25&\frac25\\\frac35&\frac35\end{pmatrix}$ (열의 합이 1인 $P$를 곱해도 $Q$의 각 행이 같은 값이라 그대로)', criteria: [1.M2, 1.A3]}
    hint_ladder:
    - 1월 동안 $C$에 남는 양과 $D$에서 넘어오는 양을 더해 $c_2$를 써 보자.
    - '$(c_3,d_3)$을 $(c_1,d_1)$로 나타내려면 어떤 변환을 먼저 적용하는가?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.82 [문제4] 답안2
    steps:
    - id: 1b-1
      content: |
        제시문 [가]의 방법을 적용하면 1월에는 $C$에 $\dfrac45c_1$이 남고 $D$에서 $\dfrac25d_1$이 들어오므로
        $c_2=\dfrac45c_1+\dfrac25d_1$, $d_2=\dfrac15c_1+\dfrac35d_1$, 즉 $P=\begin{pmatrix}\frac45&\frac25\\\frac15&\frac35\end{pmatrix}$.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        2월에는 $c_3=\dfrac25c_2+\dfrac25d_2$, $d_3=\dfrac35c_2+\dfrac35d_2$이므로 $Q=\begin{pmatrix}\frac25&\frac25\\\frac35&\frac35\end{pmatrix}$.
      criteria: [1.A2]
    - id: 1b-3
      content: |
        오른쪽 식에 $c_2$, $d_2$를 대입하여 계산하면(행렬로는 $R=QP$)
        $c_3=\dfrac25\left(\dfrac45c_1+\dfrac25d_1\right)+\dfrac25\left(\dfrac15c_1+\dfrac35d_1\right)=\dfrac25c_1+\dfrac25d_1$, $d_3=\dfrac35c_1+\dfrac35d_1$.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        따라서 $P=\begin{pmatrix}\frac45&\frac25\\\frac15&\frac35\end{pmatrix}$, $Q=\begin{pmatrix}\frac25&\frac25\\\frac35&\frac35\end{pmatrix}$, $R=\begin{pmatrix}\frac25&\frac25\\\frac35&\frac35\end{pmatrix}$.
      criteria: [1.A3]
