stimuli:
- label: 가
  body: |
    한 시행(trial)에서 특정 결과가 나올 가능성을 확률이라 한다. 통계학에서는 확률을 표본공간(sample space), 사건(event), 확률함수(probability function)를 이용하여 정의한다. 표본공간은 시행에서 나올 수 있는 모든 결과의 집합을 의미하고, 사건은 시행의 결과로서 특정 결과를 기술하는 조건으로 표현되는 표본공간의 부분집합이 된다. 확률함수는 표본공간에서 사건에 대응하는 결과가 차지하는 비율을 정의하는 함수다.
- label: 나
  body: |
    다음 사각형 영역의 상공에서 광고 전단지를 살포했다.
    [그림: 가로 0~2km, 세로 0~1km인 직사각형 안에 좌우 끝이 뾰족하고 위·아래 변에 닿는 렌즈(볼록 렌즈) 모양의 회색 영역. 가로 1.5km 위치에 세로 점선]
    전단지가 사각형 영역에 균일하게 뿌려진다고 가정할 경우, 회색 영역에 떨어질 확률을 구하고자 한다. 이 경우 시행은 전단지를 공중에서 살포하는 행위로 정의되고, 표본공간은 시행의 결과인 전단지 착지 위치의 집합, 즉 사각형 영역이 된다. 사건은 전단지가 회색 영역에 떨어지는 것이다. 확률함수는 이 시행에서 전단지가 사각형 영역에 균일하게 살포되기 때문에 사각형에서 사건에 해당하는 영역의 비율로 정의할 수 있다.
- label: 다
  body: |
    전단지 살포 시행을 컴퓨터를 이용한 모의 실험을 통해 특정 사건의 확률을 구할 수 있다. 전단지의 착지 위치 $(x,y)$는 표본공간의 어느 위치나 동일한 가능성을 갖는 것을 가정하므로, 난수(random number)를 발생하여 모의 좌표를 생성한다. 즉, $x$는 0에서 2 사이에, $y$는 0에서 1 사이에서 각각 동일한 가능성을 가정하여 추출된 난수로 모의 좌표 $(x,y)$를 만든다. 예를 들면, 백만 개의 모의 좌표를 생성하면 전단지를 모의 살포하여 착지 위치를 기록한 것으로 간주할 수 있다. 백만 개의 모의 좌표들 중에 회색 영역 조건을 만족하는 좌표의 개수 비율을 구하여 회색 영역에 전단지가 살포될 확률을 구할 수 있다. 다만, 모의 실험을 통한 확률을 추정할 때, 난수로 생성되는 모의 좌표의 개수가 충분히 많아야 추정된 확률이 실제 확률에 근사한다는 점에 주의해야 한다.

stem: |
  제시문을 이용하여 아래 회색 영역에 해당하는 $\int_0^\pi\sin x\ dx$를 추정하는 방법을 설명하시오.
  <7 ~ 8줄 (210 ~ 235자)> [15점]
  [그림: $x$축 위 $0$부터 $\pi$까지 곡선 $y=\sin x$와 $x$축 사이 영역이 회색으로 칠해짐]

subparts:
- id: '1'
  stem: |
    $\int_0^\pi\sin x\,dx$를 추정하는 방법을 설명하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '[0,\pi]\times[0,1]\text{에서 균일 난수 좌표를 생성해 }y\le\sin x\text{인 비율}\times\pi\ (\approx2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 표본공간 = 가로 $\pi$, 세로 1인 직사각형, 사건 = $y\le\sin x$, 추정값 = 비율 × $\pi$.
    steps:
    - {id: 1a, content: '$\int_0^\pi\sin x\,dx\approx\pi\times\dfrac{n(y\le\sin x)}{N}$', criteria: [1.A1]}
    hint_ladder:
    - 회색 영역을 완전히 포함하는 직사각형을 표본공간으로 잡자.
    - 비율은 넓이의 비이다. 넓이로 되돌리려면?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.80 [문제 1]
    steps:
    - id: 1b-1
      content: |
        적분 영역을 포함하는 표본공간으로 가로 $\pi$, 세로 1인 직사각형을 생각한다(제시문 [가], [나]). $x$는 0에서 $\pi$ 사이, $y$는 0에서 1 사이에서 동일한 가능성을 갖고 추출된 난수로 모의 좌표 $(x,y)$를 충분히 많이 생성한다(제시문 [다]).
      criteria: [1.M1]
    - id: 1b-2
      content: |
        생성된 모의 좌표들 중 $x$축과 $\sin x$ 사이의 영역에 해당하는(즉 $y\le\sin x$인) 좌표의 비율을 계산한다. 이 비율은 표본공간의 넓이 중 회색 영역의 넓이의 비율과 같다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 이 비율에 표본공간 전체 넓이 $\pi$를 곱하면 적분의 결과(추정값)가 된다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 표본공간을 $[0,\pi]\times[0,1]$ 직사각형으로 잡고 균일 난수로 모의 좌표를 생성한다고 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 사건 조건 $y\le\sin x$를 만족하는 좌표의 비율을 구한다고 적었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 비율에 표본공간 넓이 $\pi$를 곱해 적분값을 추정한다고 적었다.
      depends_on: [1.M1, 1.M2]
      steps: [1a, 1b-3]
    deductions:
    - code: D1-1
      condition: 글자 수(210~235자) 크게 벗어남
      effect: minus
      value: 1
