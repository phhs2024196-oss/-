    outcome_code: '70'
    wrong_work: '좌우 결과를 그대로 합쳐 전체 비율 $\dfrac{f_1+f_2}{2n}$에 표본공간 넓이 2를 곱함'
    detect_cue: 추정식에 $\dfrac{f_1+f_2}{2n}\times2$ 또는 $p_1$, $p_2$의 단순 평균
    feedback: 오른쪽은 왼쪽보다 3배 촘촘히 뿌려졌으므로 단순 합산은 오른쪽을 과대 반영합니다. 영역별로 따로 추정해 각 넓이를 곱해 더하세요.
    remedy: [RL-1]

