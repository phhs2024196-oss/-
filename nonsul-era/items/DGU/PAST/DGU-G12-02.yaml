stimuli:
- label: 가
  body: |
    한 시행(trial)에서 특정 결과가 나올 가능성을 확률이라 한다. 통계학에서는 확률을 표본공간(sample space), 사건(event), 확률함수(probability function)를 이용하여 정의한다. 표본공간은 시행에서 나올 수 있는 모든 결과의 집합을 의미하고, 사건은 시행의 결과로서 특정 결과를 기술하는 조건으로 표현되는 표본공간의 부분집합이 된다. 확률함수는 표본공간에서 사건에 대응하는 결과가 차지하는 비율을 정의하는 함수다.
- label: 나
  body: |
    다음 사각형 영역의 상공에서 광고 전단지를 살포했다.
    [그림: 가로 0~2km, 세로 0~1km인 직사각형 안에 좌우 끝이 뾰족하고 위·아래 변에 닿는 렌즈(볼록 렌즈) 모양의 회색 영역. 가로 1.5km 위치에 세로 점선]
    전단지가 사각형 영역에 균일하게 뿌려진다고 가정할 경우, 회색 영역에 떨어질 확률을 구하고자 한다. 이 경우 시행은 전단지를 공중에서 살포하는 행위로 정의되고, 표본공간은 시행의 결과인 전단지 착지 위치의 집합, 즉 사각형 영역이 된다. 사건은 전단지가 회색 영역에 떨어지는 것이다. 확률함수는 이 시행에서 전단지가 사각형 영역에 균일하게 살포되기 때문에 사각형에서 사건에 해당하는 영역의 비율로 정의할 수 있다.
- label: 다
  body: |
    전단지 살포 시행을 컴퓨터를 이용한 모의 실험을 통해 특정 사건의 확률을 구할 수 있다. 전단지의 착지 위치 $(x,y)$는 표본공간의 어느 위치나 동일한 가능성을 갖는 것을 가정하므로, 난수(random number)를 발생하여 모의 좌표를 생성한다. 즉, $x$는 0에서 2 사이에, $y$는 0에서 1 사이에서 각각 동일한 가능성을 가정하여 추출된 난수로 모의 좌표 $(x,y)$를 만든다. 예를 들면, 백만 개의 모의 좌표를 생성하면 전단지를 모의 살포하여 착지 위치를 기록한 것으로 간주할 수 있다. 백만 개의 모의 좌표들 중에 회색 영역 조건을 만족하는 좌표의 개수 비율을 구하여 회색 영역에 전단지가 살포될 확률을 구할 수 있다. 다만, 모의 실험을 통한 확률을 추정할 때, 난수로 생성되는 모의 좌표의 개수가 충분히 많아야 추정된 확률이 실제 확률에 근사한다는 점에 주의해야 한다.

stem: |
  제시문 [나]의 그림에서 점선 왼쪽과 오른쪽에 동일수량의 전단지를 살포했다고 가정한 경우 회색 영역의 면적을 추정하는 방법을 설명하시오.
  <10 ~ 11줄 (300 ~ 325자)> [20점]

subparts:
- id: '1'
  stem: |
    점선 좌우에 동일수량을 살포한 경우 회색 영역의 면적을 추정하는 방법을 설명하시오.
  points: 20
  depends_on: []
  answer: {kind: expression, value: '1.5p_1+0.5p_2\ (\text{km}^2)\ \text{또는}\ \dfrac{3f_1+f_2}{4n}\times2\ (\text{km}^2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 부분을 각각 균일한 표본공간으로 보고 넓이를 따로 추정해 더한다.
    steps:
    - {id: 1a, content: '회색 넓이 $\approx1.5p_1+0.5p_2$', criteria: [1.A1]}
    hint_ladder:
    - 같은 수의 전단지가 넓이 1.5와 0.5인 부분에 뿌려지면 밀도는 어떻게 다른가?
    - 각 부분 안에서는 균일하다고 볼 수 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.80 [문제 2] 예시답안1
    steps:
    - id: 1b-1
      content: |
        표본공간에서 점선 왼쪽과 오른쪽의 크기가 서로 다른데 같은 양의 전단지가 뿌려졌다면 상대적으로 오른쪽에 더 많이 뿌려진 것이다. 즉, 표본공간에 전단지가 균일하게 뿌려졌다는 가정(제시문 [나])에 위배된다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        따라서 왼쪽 부분과 오른쪽 부분을 각각 표본공간으로 보고 회색 영역의 넓이를 따로 구한 뒤 합산해야 한다. 왼쪽 부분에서 회색 영역에 떨어진 전단지 비율을 $p_1$, 오른쪽 부분의 비율을 $p_2$라 하면(제시문 [다]),
      criteria: [1.M1]
    - id: 1b-3
      content: |
        왼쪽과 오른쪽 표본공간의 넓이가 각각 $1.5\,(\text{km}^2)$, $0.5\,(\text{km}^2)$이므로 회색 영역의 넓이는 $1.5p_1+0.5p_2\,(\text{km}^2)$로 추정할 수 있다.
      criteria: [1.A1]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 해설집 p.80 [문제 2] 예시답안2
    key_idea: 오른쪽 전단지 1장을 왼쪽 3장에 해당하는 것으로 보면 전체가 같은 밀도로 살포된 것과 같다.
    steps:
    - {id: 1alt-1, content: '왼쪽·오른쪽 회색 영역에 떨어진 수를 $f_1$, $f_2$, 한쪽 살포 수를 $n$이라 하면 비율 $\dfrac{3f_1+f_2}{4n}$, 넓이 $\dfrac{3f_1+f_2}{4n}\times2\,(\text{km}^2)$', criteria: [1.R1, 1.M1, 1.A1]}
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 6
      evidence: 같은 수량이 넓이가 다른 두 부분에 뿌려져 균일 살포 가정이 깨진다는 점을 적었다.
      depends_on: []
      steps: [1b-1, 1alt-1]
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: 두 부분에서 회색 영역에 떨어진 비율(또는 개수)을 각각 구하는 방법을 적었다.
      depends_on: []
      steps: [1b-2, 1alt-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: 추정식 $1.5p_1+0.5p_2$(또는 $\dfrac{3f_1+f_2}{4n}\times2$)를 적었다.
      depends_on: [1.M1]
      steps: [1a, 1b-3, 1alt-1]
    deductions:
    - code: D1-1
      condition: 글자 수(300~325자) 크게 벗어남
      effect: minus
      value: 1
