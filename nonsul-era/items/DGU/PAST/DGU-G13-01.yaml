stimuli:
- label: 본문
  body: |
    자동차에 쓰이는 연료는 자동차를 움직이는 데 꼭 필요한 것이지만 그 배출 가스는 환경오염의 원인이 되고 있다. 따라서 환경오염을 줄이기 위해서는 연료를 될 수 있는 대로 적게 소모해야 한다. 연료를 절감하는 방법 중의 하나는 경제속도로 주행하는 것이다. 경제속도란 가장 적은 연료로 가장 먼 거리를 달릴 수 있는 속도를 뜻한다.
    아래의 [그림 1]은 어떤 자동차의 속도(km/h)에 따른 시간당 연료 소모량(L/h)을 나타낸 것이다. 자동차는 시동을 건 상태로 정지해 있는 경우에도 연료가 소모된다. 자동차가 움직이기 시작하면 시간당 연료 소모량은 감소하는데, [그림 1]에서 보는 것처럼 60km/h 정도에서 시간당 연료 소모량이 최소가 된다. 이 자동차의 연비(km/L)는 언뜻 보기에 이때가 가장 최대인 것처럼 보이지만 이때가 가장 효율적인 것은 아니다. 최대의 연비를 구하려면 원점과 곡선위의 점을 지나는 직선의 기울기가 최소인 점을 찾아야 한다. [그림 1]의 경우에는 원점을 지나는 직선이 곡선의 점 $Q$에서 접할 때 직선의 기울기가 최소가 된다는 것을 알 수 있다. 따라서 이 자동차의 경제속도는 70km/h이며, 이 속도를 유지하면서 정속 주행할 때 가장 효율적인 운전이 되는 것이다.
    [그림 1: 가로축 속도(km/h), 세로축 시간당 연료소모량(L/h). 곡선은 세로축 위 양수 값에서 시작해 감소하다가 60에서 최소(점 P)가 된 뒤 증가하고 오른쪽 끝에서 급격히 증가. 원점에서 P를 지나는 직선과, 원점에서 그어 70에서 곡선에 접하는 직선(접점 Q)이 그려져 있음]
    －『고등학교 미적분과 통계 기본』

stem: |
  시간조건이 $0\le t\le3$일 때 어떤 차량의 연료 소모량 $g(t)$가 아래와 같다고 가정하자.
  $$g(t)=\int_0^t(2x^3-15x^2+36x)dx$$
  주어진 시간조건에서 이 차량의 시간당 연료 소모량이 최대가 되는 $t$의 값과 풀이를 기술하시오. (단, 시간당 연료 소모량은 $g'(t)$이다.)
  <6 ~ 9줄> [15점]

subparts:
- id: '1'
  stem: |
    시간당 연료 소모량이 최대가 되는 $t$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 't=2', equivalents: ['2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g'(t)$는 $t=2$에서 극대, $t=3$에서 극소이고 $g'(2)=28>g'(3)=27>g'(0)=0$.
    steps:
    - {id: 1a, content: '$t=2$에서 최대(최댓값 28)', criteria: [1.R1, 1.A1]}
    hint_ladder:
    - 최대로 만들 함수는 $g'(t)$이다.
    - $g'(t)$를 한 번 더 미분해 극값 후보를 찾자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.79 [문제1]
    steps:
    - id: 1b-1
      content: |
        연료 소모량이 정적분으로 표현되어 있으므로 시간당 연료 소모량은 그 적분의 미분으로 구한다. $g(t)=\int_0^t(2x^3-15x^2+36x)dx$에서 $g'(t)=2t^3-15t^2+36t$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $0\le t\le3$에서 $g'(t)$의 최댓값을 구하자. $g''(t)=6t^2-30t+36=6(t^2-5t+6)=6(t-2)(t-3)=0$에서 $t=2,3$이고, $g'(t)$는 $t=2$에서 극대, $t=3$에서 극소이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        끝값과 비교하면 $g'(0)=0$, $g'(2)=28$, $g'(3)=27$이므로 주어진 시간조건에서 시간당 연료 소모량이 최대가 되는 $t$의 값은 $t=2$이다.
      criteria: [1.R1, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $g'(t)=2t^3-15t^2+36t$를 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $g''(t)=6(t-2)(t-3)$에서 극값 후보 $t=2,3$을 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: 극대·극소 판정과 끝값($g'(0)$, $g'(3)$) 비교로 최대임을 밝혔다.
      depends_on: [1.M2]
      steps: [1a, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $t=2$를 답으로 적었다.
      depends_on: [1.M1, 1.R1]
      steps: [1a, 1b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2608}
  misconceptions:
  - id: MC-CAL-2608
    outcome_code: '70'
    wrong_work: '$g(t)$ 자체를 최대화해 $g''(t)=0$인 $t$(구간 안에서는 $t=0$) 또는 끝점 $t=3$을 답함'
    detect_cue: 답이 $t=3$ 또는 $t=0$, 풀이에 $2t^3-15t^2+36t=0$을 푼 흔적
    feedback: 문제에서 최대로 할 것은 시간당 연료 소모량 $g'(t)$입니다. $g'(t)$의 도함수 $g''(t)$로 극값을 찾고 끝값과 비교하세요.
    remedy: [RL-1]

