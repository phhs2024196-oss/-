stimuli:
- label: 본문
  body: |
    자동차에 쓰이는 연료는 자동차를 움직이는 데 꼭 필요한 것이지만 그 배출 가스는 환경오염의 원인이 되고 있다. 따라서 환경오염을 줄이기 위해서는 연료를 될 수 있는 대로 적게 소모해야 한다. 연료를 절감하는 방법 중의 하나는 경제속도로 주행하는 것이다. 경제속도란 가장 적은 연료로 가장 먼 거리를 달릴 수 있는 속도를 뜻한다.
    아래의 [그림 1]은 어떤 자동차의 속도(km/h)에 따른 시간당 연료 소모량(L/h)을 나타낸 것이다. 자동차는 시동을 건 상태로 정지해 있는 경우에도 연료가 소모된다. 자동차가 움직이기 시작하면 시간당 연료 소모량은 감소하는데, [그림 1]에서 보는 것처럼 60km/h 정도에서 시간당 연료 소모량이 최소가 된다. 이 자동차의 연비(km/L)는 언뜻 보기에 이때가 가장 최대인 것처럼 보이지만 이때가 가장 효율적인 것은 아니다. 최대의 연비를 구하려면 원점과 곡선위의 점을 지나는 직선의 기울기가 최소인 점을 찾아야 한다. [그림 1]의 경우에는 원점을 지나는 직선이 곡선의 점 $Q$에서 접할 때 직선의 기울기가 최소가 된다는 것을 알 수 있다. 따라서 이 자동차의 경제속도는 70km/h이며, 이 속도를 유지하면서 정속 주행할 때 가장 효율적인 운전이 되는 것이다.
    [그림 1: 가로축 속도(km/h), 세로축 시간당 연료소모량(L/h). 곡선은 세로축 위 양수 값에서 시작해 감소하다가 60에서 최소(점 P)가 된 뒤 증가하고 오른쪽 끝에서 급격히 증가. 원점에서 P를 지나는 직선과, 원점에서 그어 70에서 곡선에 접하는 직선(접점 Q)이 그려져 있음]
    －『고등학교 미적분과 통계 기본』

stem: |
  어떤 차량의 속도와 시간당 연료 소모량의 그래프가 아래의 그림과 같다. $y=\dfrac13x^3-x^2+9,\ x\ge0$ 일 때, 이 차량의 시간당 연료 소모량이 최소가 되는 속도와 경제속도를 제시문의 내용을 바탕으로 각각 구하고 풀이를 기술하시오.
  [그림: 가로축 속도(km/h) $x$, 세로축 시간당 연료소모량(L/h) $y$. 곡선 $y=\dfrac13x^3-x^2+9$가 $y$절편 9에서 시작해 감소한 뒤 최솟점을 지나 증가]
  <8 ~ 11줄> [20점]

subparts:
- id: '1'
  stem: |
    시간당 연료 소모량이 최소가 되는 속도와 경제속도를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\text{최소 소모 속도 }2\text{ km/h},\ \text{경제속도 }3\text{ km/h}', equivalents: ['2, 3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $y'=x(x-2)$ → 최소 소모 속도 2; 원점 접선 조건 $\dfrac23t^3-t^2-9=0$ → $t=3$.
    steps:
    - {id: 1a, content: '$(t-3)(2t^2+3t+9)=0$, $2t^2+3t+9>0$ ⇒ 경제속도 3', criteria: [1.A2, 1.A3]}
    hint_ladder:
    - 시간당 연료 소모량 최소는 $y'=0$으로 구한다.
    - 제시문에서 경제속도는 원점을 지나는 직선이 곡선에 접하는 점이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.79 [문제2]
    steps:
    - id: 1b-1
      content: |
        (i) $y=\dfrac13x^3-x^2+9\ (x\ge0)$에서 $y'=x^2-2x=x(x-2)=0$. $x=0$에서 극대, $x=2$에서 극소이므로 $x\ge0$에서 시간당 연료 소모량이 최소가 되는 속도는 2(km/h)이다.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        (ii) 제시문에 따르면 경제속도는 원점을 지나는 직선이 곡선에 접할 때의 접점의 속도이다. 곡선 위의 점 $(t,f(t))$에서의 기울기는 $t^2-2t$이고 접선의 방정식은 $y=(t^2-2t)(x-t)+\dfrac13t^3-t^2+9$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        이 접선이 원점을 지날 때 $0=(t^2-2t)(0-t)+\dfrac13t^3-t^2+9$, 즉 $\dfrac23t^3-t^2-9=0$, $2t^3-3t^2-27=0$.
      criteria: [1.A2]
    - id: 1b-4
      content: |
        $(t-3)(2t^2+3t+9)=0$이고 $2t^2+3t+9>0$이므로 $t=3$. 따라서 경제속도는 3(km/h)이다.
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $y'=x(x-2)=0$에서 극값을 조사했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 시간당 연료 소모량이 최소가 되는 속도 2를 적었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 경제속도를 원점을 지나는 접선의 접점(또는 $\dfrac yx$ 최소)으로 보고 접선의 방정식을 세웠다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 원점 대입 조건 $2t^3-3t^2-27=0$을 적었다.
      depends_on: [1.M2]
      steps: [1a, 1b-3]
    - id: 1.A3
      mark_type: A
      points: 3
      evidence: $(t-3)(2t^2+3t+9)=0$에서 경제속도 3을 적었다.
      depends_on: [1.M2]
      steps: [1a, 1b-4]
    deductions:
    - code: D2-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
