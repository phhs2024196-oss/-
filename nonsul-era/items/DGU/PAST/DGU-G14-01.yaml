stimuli:
- label: 가
  body: |
    <표 1>은 남아메리카 국가연합에 소속된 12개국의 면적과 인구의 통계 자료이다. 여기에 나타나는 24개의 숫자자료 중 첫 번째 자리의 숫자가 1로 시작하는 항목은 모두 8개이고, 2로 시작하는 항목은 총 5개로 첫 번째 자리의 숫자가 8이나 9로 시작하는 항목보다 훨씬 자주 나타나고 있다.
    십진수로 표시된 수는 첫 번째 자리에 1부터 9까지의 9가지 숫자가 될 수 있다. 따라서 일반적인 통계자료에서 첫 번째 자리의 숫자가 1일 확률이 1/9로 나올 것으로 예상하기 쉽다. 하지만 <표 1>에서처럼 어떤 경우에는 자료의 값이 첫 번째 자리의 숫자가 1인 경우는 1/9보다 훨씬 많이 나타나고 반대로 9는 적게 나타난다. 이러한 현상은 하천의 길이나 호수의 넓이 등 여러 자연현상의 자료뿐만 아니라 개인의 소득, 기업의 회계자료 등 사회현상의 많은 자료에서도 공통적으로 나타난다.
    미국 TV 드라마 '넘버스'에는 주인공이 통계 자료의 수가 가지는 이러한 성질을 가지고 범죄를 해결하는 이야기가 나온다. 실제로 사람이 인위적으로 고른 숫자로 만들어진 가짜 자료는 이러한 특성을 따르기가 어렵기 때문에 회계부정이나 위조 자료를 통한 의료보험의 부정수급 등을 적발하는 데 사용한다고 한다.
    <표 1> 남아메리카 국가 연합 개요 (국가 / 면적(km²) / 인구(백만명))
    가이아나 214,969 0.7 · 베네수엘라 912,046 27.9 · 볼리비아 1,098,575 9.5 · 브라질 8,547,360 192.4 · 수리남 163,270 0.5 · 아르헨티나 2,780,388 39.8 · 에콰도르 283,560 13.9 · 우루과이 177,409 3.3 · 칠레 756,626 16.8 · 콜롬비아 1,138,906 48.2 · 파라과이 406,747 6.5 · 페루 1,285,214 29.1
    ( 자료출처: 『고등학교 세계 지리』 )
- label: 나
  body: |
    자료의 어떤 통계적 특성이 단위에 의존하지 않는다는 것은 다른 단위를 사용하더라도 그 통계적 특성이 바뀌지 않는다는 것을 의미한다. 예를 들어, 길이의 통계자료를 미터로 나타내거나 리(里) 또는 피트나 야드로 자료의 단위를 바꾸더라도 그 통계적 특성은 유지된다. 특히 경제적 가치는 각 나라의 화폐 단위로 표시되고 다른 화폐 단위로의 변경은 환율을 곱하여 이루어지는데, 환율은 거의 연속적으로 변하는 값이다.
- label: 다
  body: |
    임의의 양수 $N$은 $N=a\times10^n$ ($n$은 정수, $1\le a<10$)의 꼴로 나타낼 수 있다. 따라서 $N$의 상용로그의 값은
    $$\log N=\log(a\times10^n)=\log a+\log10^n=n+\log a$$
    이므로 $\log N$의 값을 구하려면 상용로그표에서 $\log a$의 값을 찾고, 이 값에 정수 $n$을 더하면 된다. 여기서 정수 $n$을 $\log N$의 지표, $\log a$를 $\log N$의 가수라 한다. 이때 $1\le a<10$이므로 $0\le\log a<1$이다.
    －『고등학교 수학』
- label: 라
  body: |
    연속확률변수 $X$의 확률밀도함수 $f(x)$에 대하여
    (1) $f(x)\ge0$
    (2) 함수 $f(x)$의 그래프와 $x$축 사이의 넓이는 1이다.
    (3) 확률 $P(a\le X\le b)$는 함수 $f(x)$의 그래프와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 부분의 넓이이다. 즉,
    $$P(a\le X\le b)=\int_a^bf(x)dx$$
    －『고등학교 수학』

stem: |
  현재 환율이 1달러에 1,000원이라고 하자. 달러의 가치가 원화에 대비하여 매년 2/3씩 하락한다면, 10년 후와 20년 후 각각의 1달러 대비 원화 금액의 첫 번째 자리 숫자가 무엇인지 제시문 【다】에서 설명한 상용로그 가수를 이용하여 계산하시오.
  (단, $\log2=0.3010$, $\log3=0.4771$을 사용하며, 풀이과정을 포함하여 기술하시오.)
  <7~13줄> [15점]

subparts:
- id: '1'
  stem: |
    10년 후와 20년 후 1달러 대비 원화 금액의 첫 번째 자리 숫자를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '10\text{년 후 }1,\ 20\text{년 후 }3', equivalents: ['1, 3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\log\left(1000(2/3)^n\right)=3+n(\log2-\log3)$의 가수를 $\log d$ 사이에 넣는다.
    steps:
    - {id: 1a, content: '$n=10$: $1.239$, 가수 $0.239<\log2$ → 1; $n=20$: $-0.522=-1+0.478$, $\log3<0.478<\log4$ → 3', criteria: [1.A1, 1.A2]}
    hint_ladder:
    - $n$년 후 금액은 $1000\cdot\left(\dfrac23\right)^n$원이다.
    - 음수 로그는 $-1+(\text{가수})$ 꼴로 바꾸자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.77 [문제 1]
    steps:
    - id: 1b-1
      content: |
        달러의 가치가 매년 $\dfrac23$배가 되므로 10년 후 1달러 대비 원화 금액은 $1000\times\left(\dfrac23\right)^{10}$, 20년 후는 $1000\times\left(\dfrac23\right)^{20}$이다. 상용로그값은
        $3+10(\log2-\log3)=3+10(0.3010-0.4771)=1.239=1+0.239$,
        $3+20(\log2-\log3)=3+20(0.3010-0.4771)=-0.522=-1+0.478$.
      criteria: [1.M1, 1.M2]
    - id: 1b-2
      content: |
        따라서 제시문 【다】에 의해 가수는 각각 $0.239$와 $0.478$이다. 양수 $N=a\times10^n$의 첫 번째 자리 숫자가 $d$라는 것은 $d\le a<d+1$, 즉 $\log d\le\log a<\log(d+1)$이라는 것이다.
      criteria: [1.A1, 1.R1]
    - id: 1b-3
      content: |
        $\log1=0<0.239<\log2$이고 $\log3<0.478<\log4=2\log2$이므로 첫 번째 자리 숫자는 10년 후 1, 20년 후 3이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $n$년 후 금액 $1000\left(\dfrac23\right)^n$의 상용로그를 $3+n(\log2-\log3)$로 계산했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 음수 로그 $-0.522$를 $-1+0.478$로 바꾸어 가수를 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 가수 $0.239$와 $0.478$을 적었다.
      depends_on: [1.M1, 1.M2]
      steps: [1a, 1b-2]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: 첫 자리 $d$ ⇔ $\log d\le(\text{가수})<\log(d+1)$을 근거로 썼다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: 10년 후 1, 20년 후 3을 적었다.
      depends_on: [1.M1, 1.R1]
      steps: [1a, 1b-3]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
