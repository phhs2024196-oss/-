stimuli:
- label: 본문
  body: |
    밑면으로부터 높이가 $x$인 지점을 지나고 밑면에 평행한 평면으로 반지름이 $r$인 반구를 잘랐을 때 생기는 넓이가 $S(x)=\pi(r^2-x^2)$일 때, 반지름이 $r$인 구의 부피는 정적분을 이용하여 다음과 같이 구할 수 있다.
    $$\text{반지름이 }r\text{인 구의 부피 }V=2\int_0^r\pi(r^2-x^2)dx$$
    철수와 영희는 정해진 컨테이너 박스 안에 반지름이 $r$인 공 모양의 구를 조밀하게 쌓기로 하였다.
    철수는 1층에 4개의 구를 사용하여 정사각형 모양(구의 중심을 연결한 모양)으로 평면을 채운 후, 각 정사각형 모양의 중앙에 1개의 구를 올려놓는 방식으로 2층을 쌓았다. 즉, 1층 4개의 구 사이의 골에 구를 1개 올려놓아 2층을 만들었다. 홀수(3, 5, 7,$\cdots$)층은 1층과 같은 모양으로 쌓고, 짝수(2, 4, 6,$\cdots$)층은 2층과 같은 모양으로 쌓는 방법으로 컨테이너 박스를 채웠다.
    영희는 1층에 정육각형 모양(구의 중심을 연결한 모양)으로 평면을 채운 후 골이 생기는 곳에 구를 1개씩 올려놓아 2층을 쌓았다. 즉, 1층 3개의 구 사이의 골에 1개의 구를 올려놓아 2층을 만들고, 3층은 2층 3개의 구 사이의 골에 1개의 구를 올려놓는 방법으로 컨테이너 박스를 채웠다.
    기본공간을 한 변의 길이가 $a$인 정육면체로 잡아서 기본공간의 부피를 구하고 기본공간 안에 구가 차지하는 부피를 구하여 구의 밀도 식을 계산하면 다음과 같다.
    $$\text{구의 밀도 식}=\dfrac{\text{기본공간 안에서 구가 차지하는 부피}}{\text{기본공간의 부피}}\times100(\%)$$
    영희가 쌓은 모양의 기본공간의 예시는 주어진 그림과 같다.
    [그림: 한 변의 길이가 $a$인 정육면체 안에 반지름 $r$인 구들이 꼭짓점과 각 면의 중앙에 놓여 있고, 한 면의 대각선 위에 구 3개가 접해 그 길이가 $4r$로 표시됨]
    일반적으로 구의 밀도 식 값이 큰 쪽이 작은 쪽보다 더 많은 구를 쌓을 수 있다고 한다.
    －『고등학교 미적분Ⅱ』

stem: |
  제시문에 주어진 적분을 이용하여 구의 부피를 구하고, 철수와 영희가 쌓은 모양에 대한 구의 밀도 식 값의 크기를 비교하여, 누가 정해진 컨테이너 박스 안에 더 많은 구를 쌓을 수 있는지 논술하시오.
  <15 ~ 17줄> [40점]

subparts:
- id: '1'
  stem: |
    구의 부피와 두 배열의 구의 밀도 식 값을 구해 비교하시오.
  points: 40
  depends_on: []
  answer: {kind: value, value: 'V=\dfrac43\pi r^3,\ \text{철수·영희 모두 }\dfrac{\sqrt2\pi}{6}\times100(\%)\text{로 같아 같은 수의 구를 쌓을 수 있다}', equivalents: ['약 74.05%로 같다'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 철수 배열은 2층 구가 아래 4개와 접해 층 간격 $\sqrt2r$ — 이는 한 변 $2\sqrt2r$인 정육면체에 면 중심·꼭짓점 구가 놓인 배열과 같고, 영희 배열도 같은 기본공간을 가진다.
    steps:
    - {id: 1a, content: '구 $4$개, $a=2\sqrt2r$ → $\dfrac{4\cdot\frac43\pi r^3}{16\sqrt2r^3}=\dfrac{\sqrt2\pi}{6}$ (두 배열 공통)', criteria: [1.A2, 1.A3, 1.R1]}
    hint_ladder:
    - 철수의 2층 구는 아래 4개의 구와 접한다. 중심 사이 거리는?
    - 기본공간 정육면체의 꼭짓점과 면에 구가 얼마씩 들어가는지 세어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.69 (풀이2)
    steps:
    - id: 1b-1
      content: |
        제시문의 적분으로 $V=2\int_0^r\pi(r^2-x^2)dx=2\pi\left[r^2x-\dfrac13x^3\right]_0^r=\dfrac43\pi r^3$.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        철수의 방법(정육면체 기본공간): 1층 구들의 중심이 한 변 $2r$인 정사각형을 이루고 2층 구가 그 중앙에서 아래 4개와 접한다. 이 배열은 한 변의 길이가 $a$인 정육면체의 각 꼭짓점에 $\dfrac18$구 8개, 각 면에 $\dfrac12$구 6개가 놓인 모양이며 면의 중심 구와 꼭짓점 구가 접하므로 $2\sqrt2r=a$. (확인: 1층 4개와 3층 4개의 중심을 꼭짓점으로 하는 직육면체는 가로·세로 $2r$, 높이 $h$이고 대각선이 $4r$이므로 $h^2+(2r)^2+(2r)^2=(4r)^2$, $h=2\sqrt2r$; 부피 $8\sqrt2r^3$ 안에 구 $1+8\cdot\dfrac18=2$개.)
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 철수의 밀도 식은 $\dfrac{(6\cdot\frac12+8\cdot\frac18)\cdot\frac43\pi r^3}{(2\sqrt2r)^3}\times100=\dfrac{16\pi r^3/3}{16\sqrt2r^3}\times100=\dfrac{\sqrt2\pi}{6}\times100$ (직육면체로 계산해도 $\dfrac{2\cdot\frac43\pi r^3}{8\sqrt2r^3}\times100$으로 같다).
      criteria: [1.A2]
    - id: 1b-4
      content: |
        영희의 방법: 그림의 기본공간(한 변 $a$인 정육면체)에는 꼭짓점에 $\dfrac18$구 8개, 각 면에 $\dfrac12$구 6개, 즉 $6\cdot\dfrac12+8\cdot\dfrac18=4$개의 구가 있다. 각 면의 대각선 위에서 3개의 구가 서로 접하므로 $\sqrt2a=4r$, $a=2\sqrt2r$.
      criteria: [1.M3]
    - id: 1b-5
      content: |
        영희의 밀도 식은 $\dfrac{4\cdot\frac43\pi r^3}{(2\sqrt2r)^3}\times100=\dfrac{\sqrt2\pi}{6}\times100$.
      criteria: [1.A3]
    - id: 1b-6
      content: |
        두 밀도 식 값이 $\dfrac{\sqrt2\pi}{6}\times100\,(\approx74\%)$로 같으므로, 영희와 철수는 정해진 컨테이너 박스 안에 같은 수의 구를 쌓을 수 있다.
      criteria: [1.R1]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 층 단위로 계산 — 철수는 구 1개당 바닥 넓이 $4r^2$, 층 간격 $\sqrt2r$; 영희는 구 1개당 $2\sqrt3r^2$, 층 간격 $\dfrac{2\sqrt6}{3}r$. 구 1개당 부피가 둘 다 $4\sqrt2r^3$.
    steps:
    - {id: 1alt-1, content: '철수 $4r^2\cdot\sqrt2r=4\sqrt2r^3$, 영희 $2\sqrt3r^2\cdot\dfrac{2\sqrt6}{3}r=4\sqrt2r^3$ → 밀도 $\dfrac{\frac43\pi r^3}{4\sqrt2r^3}=\dfrac{\sqrt2\pi}{6}$', criteria: [1.M2, 1.M3, 1.R1]}
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 제시문의 정적분 $2\int_0^r\pi(r^2-x^2)dx$를 계산하는 과정을 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 구의 부피 $\dfrac43\pi r^3$을 적었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: 철수 배열에서 구가 접하는 관계로 기본공간의 크기($a=2\sqrt2r$ 또는 층 간격 $\sqrt2r$, 직육면체 높이 $2\sqrt2r$)를 구하는 식을 적었다.
      depends_on: []
      steps: [1b-2, 1alt-1]
    - id: 1.A2
      mark_type: A
      points: 6
      evidence: 철수의 밀도 식 값 $\dfrac{\sqrt2\pi}{6}\times100$을 적었다.
      depends_on: [1.M2]
      steps: [1a, 1b-3]
    - id: 1.M3
      mark_type: M
      points: 6
      evidence: 영희의 기본공간에 들어 있는 구의 수 $6\cdot\dfrac12+8\cdot\dfrac18=4$와 $\sqrt2a=4r$를 적었다.
      depends_on: []
      steps: [1b-4, 1alt-1]
    - id: 1.A3
      mark_type: A
      points: 6
      evidence: 영희의 밀도 식 값 $\dfrac{\sqrt2\pi}{6}\times100$을 적었다.
      depends_on: [1.M3]
      steps: [1a, 1b-5]
    - id: 1.R1
      mark_type: R
      points: 6
      evidence: 두 밀도 식 값이 같으므로 같은 수의 구를 쌓을 수 있다고 제시문의 기준(밀도 식 값 비교)을 들어 결론지었다.
      depends_on: []
      steps: [1a, 1b-6, 1alt-1]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-2601}
  misconceptions:
  - id: MC-GEO-2601
    outcome_code: '70'
    wrong_work: '철수 배열을 체심입방(정육면체 꼭짓점 8개 + 중심 1개, 대각선 위 3개 접함 $\sqrt3a=4r$)으로 보고 밀도 $\dfrac{\sqrt3\pi}{8}\times100$을 얻어 영희가 더 많다고 결론'
    detect_cue: 답에 $\sqrt3a=4r$ 또는 $\dfrac{\sqrt3\pi}{8}$이 등장
    feedback: 철수의 1층 구들은 서로 접해 있고(중심 간격 $2r$), 2층 구는 아래 4개와 접합니다. 중심 좌표로 거리를 계산해 층 간격이 $\sqrt2r$임을 확인하세요.
    remedy: [RL-1]

