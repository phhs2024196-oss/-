  - {code: '70', misconception: MC-CAL-2601}
  misconceptions:
  - id: MC-CAL-2601
    outcome_code: '70'
    wrong_work: '$v$의 범위를 나누지 않고 모든 $v$에 대해 $x(v)=\dfrac{va}{\sqrt{1-v^2}}$로 답함'
    detect_cue: 답에 경우 분류가 없거나 $x(v)=b$인 경우가 빠짐
    feedback: 임계점이 정의역 $[0,b]$ 안에 있는지(그리고 $v<1$인지) 먼저 확인하세요. 밖이면 끝점에서 최소입니다(제시문 [나]).
    remedy: [RL-1]

