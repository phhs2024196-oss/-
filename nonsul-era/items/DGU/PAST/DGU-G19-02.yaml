stimuli:
- label: 가
  body: |
    확률을 설명할 때 빠지지 않고 등장하는 것이 주사위이다. 인류 역사에 언제 주사위가 처음 등장했는지는 확실하지 않지만 이집트에서는 이미 기원전 10세기 이전에 상아나 동물의 뼈로 된 주사위가 있었다고 전해진다. 우리나라 유물 중에도 다양한 주사위가 있다. 경주 안압지 연못 바닥에서 출토된 목제주령구는 6개의 정사각형 모양의 면과 8개의 육각형 면으로 이루어진 십사면체 모양이다. 십사면체 자체는 정다면체가 아니지만, 목제주령구를 던졌을 때, 각 면이 나올 확률은 거의 같다고 한다. 조선 시대 승경도 놀이에 사용된 윤목은 길이가 10~15cm인 오각기둥 모양으로 5개의 모서리에는 각각 1개부터 5개까지의 홈이 파여 있다. 윤목의 5개의 옆면이 바닥에 닿게 될 확률이 같으므로, 홈이 있는 5개의 모서리가 위를 향하게 될 확률도 같다.
    『고등학교 확률과 통계』
- label: 나
  body: |
    18세기 영국의 수학자 베이즈는 '베이즈 정리'라는 조건부확률 이론을 발표하였다. 이 이론의 핵심은 확률 값이 항상 고정불변한 것이 아니라 기존의 통계 자료를 이용하면 바뀐다는 것이다.
    예를 들어 어느 환자가 갑상선암을 진단하는 초음파 검사에서 양성 반응이 나오면 실제로 자신이 암에 걸렸을 확률이 초음파 검사 장비의 정확도인 0.95라고 생각하는 경향이 있다. 그러나 기존의 통계 자료에 의하면 우리나라 국민의 갑상선암 발생률이 0.01 정도밖에 안 되고 암에 걸리지 않았음에도 양성으로 잘못 판정할 확률이 0.01이라고 하면 비록 검사에서 양성 반응이 나왔다고 해도 실제로 암에 걸렸을 확률은 0.49에 불과하다.
    베이즈 정리의 장점은 기존의 통계 자료가 많을수록 확률 값이 정확해지고, 자료가 바뀌면 확률 값도 자동적으로 수정된다는 '자가 수정' 이론에 있다. 이 이론은 인터넷 검색 엔진에서 중요한 수학적 기반을 제공한다.
    『고등학교 확률과 통계』
- label: 다
  body: |
    사건 $A$의 확률 $P(A)$를 알고 있을 때, 그 여사건 $A^c$의 확률을 구할 수 있다. $A\cap A^c=\phi$이므로 두 사건 $A$와 $A^c$는 서로 배반사건이다. 따라서 확률의 덧셈정리에 의하여 다음이 성립한다.
    $$P(A^c)=P(A\cup A^c)-P(A).$$
    『고등학교 확률과 통계』
- label: 라
  body: |
    사건 $A$가 일어났을 때의 사건 $B$의 조건부확률은
    $$P(B\mid A)=\dfrac{P(A\cap B)}{P(A)}\quad(\text{단, }P(A)>0).$$
    『고등학교 확률과 통계』

stem: |
  아래와 같은 실험을 실시하였다.
  <실험>
  각 면에 1에서 14까지 적힌 목제주령구와 1에서 5까지 적힌 윤목 중에 하나를 임의로 선택하여 던지는 실험을 했다. 첫째 날은 100명이 실험에 참여했고, 이 중에서 30명이 윤목을, 70명이 목제주령구를 선택했다. 둘째 날은 10명이 동일한 실험에 참여했으며, 이 때는 윤목을 선택한 인원이 목제주령구보다 많았다.
  실험 참여자 중에서 임의로 뽑은 한 명의 주사위 값이 2가 나왔을 때, 이 참여자가 윤목을 선택하였을 확률을 관찰하고자 한다. 첫째 날 100명과 이틀 동안 누적된 110명의 실험결과에서의 확률변화를 제시문을 바탕으로 설명하시오.

subparts:
- id: '1'
  stem: |
    첫째 날 100명과 이틀 동안 누적된 110명의 실험결과에서의 확률변화를 설명하시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: '첫째 날 \dfrac{6}{11},\ 누적 110명에서 \dfrac{252}{437}\ \text{이상}\ \dfrac{8}{13}\ \text{이하로 증가}', equivalents: ['6/11 → 증가(자가 수정)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}(A\mid B)=\left(\dfrac9{14}+\dfrac5{14p}\right)^{-1}$은 $p$에 대해 증가, $p$는 $0.3\to\dfrac{36}{110}$ 이상.
    steps:
    - {id: 1a, content: '$p=0.3$: $\dfrac{6}{11}$; 누적 $p\ge\dfrac{36}{110}>0.3$ → 사후확률 증가', criteria: [1.A2, 1.R1]}
    hint_ladder:
    - 윤목을 고르는 사건 $A$, 값이 2인 사건 $B$로 두고 $P(B\mid A)$, $P(B\mid A^c)$를 적어 보자.
    - 전확률로 $P(B)$를 구하고 $P(A\mid B)$를 $p$의 식으로 정리하자.
    - 둘째 날 정보로 $p$가 어떻게 바뀌는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.61
    steps:
    - id: 1b-1
      content: |
        윤목을 선택하는 사건을 $A$, 던진 주사위의 값이 2인 사건을 $B$라 하자. 목제주령구는 1~14, 윤목은 1~5의 값이 각각 같은 확률로 나오므로 $P(B\mid A)=\dfrac15$, $P(B\mid A^c)=\dfrac1{14}$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        확률의 합의 공식과 조건부확률(【라】)에 의해
        $P(B)=P(A\cap B)+P(A^c\cap B)=P(B\mid A)P(A)+P(B\mid A^c)P(A^c)$. 윤목을 던질 확률을 $P(A)=p$라 하면 【다】에 의해 $P(A^c)=1-p$이므로
        $$P(A\mid B)=\dfrac{P(B\mid A)P(A)}{P(B)}=\dfrac{p/5}{p/5+(1-p)/14}=\left(\dfrac9{14}+\dfrac5{14p}\right)^{-1}.$$
      criteria: [1.M2, 1.A1]
    - id: 1b-3
      content: |
        첫째 날 100명에서 윤목을 던질 (통계적) 확률은 $p=\dfrac{30}{100}=0.3$이므로 $P(A\mid B)=\dfrac{42}{77}=\dfrac6{11}$.
      criteria: [1.A2]
    - id: 1b-4
      content: |
        둘째 날 10명 중 윤목을 선택한 인원이 더 많으므로 적어도 6명이 윤목을 선택했고, 110명에서 $p\ge\dfrac{30+6}{100+10}=\dfrac{36}{110}>0.3$이다.
      criteria: [1.M3]
    - id: 1b-5
      content: |
        $P(A\mid B)=\left(\dfrac9{14}+\dfrac5{14p}\right)^{-1}$은 $p$의 증가함수이므로 110명에서의 $P(A\mid B)$는 $\dfrac6{11}$보다 크다(윤목 6~10명이면 $\dfrac{252}{437}\sim\dfrac8{13}$). 즉 윤목을 더 선택하는 집단에서 추가된 10명의 결과에 의해 「값이 2인 사람이 윤목을 선택했을 확률」이 커지는 자가 수정(【나】)이 이루어졌다.
      criteria: [1.R1, 1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 사건을 정의하고 $P(B\mid A)=\dfrac15$, $P(B\mid A^c)=\dfrac1{14}$을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 전확률 $P(B)=P(B\mid A)P(A)+P(B\mid A^c)P(A^c)$로 $P(A\mid B)$를 세웠다(【다】【라】 인용).
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $P(A\mid B)$를 $p$의 식 $\dfrac{14p}{9p+5}$(또는 동치)로 정리했다.
      depends_on: [1.M2]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 첫째 날 $p=0.3$에서 $P(A\mid B)=\dfrac6{11}$을 적었다.
      depends_on: [1.M2]
      steps: [1a, 1b-3]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: 둘째 날 조건을 윤목 6명 이상으로 해석해 누적 $p\ge\dfrac{36}{110}$을 적었다.
      depends_on: []
      steps: [1b-4]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: $P(A\mid B)$가 $p$의 증가함수임을 근거로 누적 자료에서 확률이 커짐을 밝혔다.
      depends_on: []
      steps: [1a, 1b-5]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: 확률 변화(증가)를 【나】의 자가 수정과 연결해 결론지었다.
      depends_on: [1.R1]
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
