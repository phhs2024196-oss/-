stimuli:
- label: 가
  body: |
    주사위나 동전을 던지는 것과 같이 같은 조건에서 여러 번 반복할 수 있고, 그 결과가 우연에 의하여 좌우되는 실험이나 관찰을 시행이라고 한다. 그리고 어떤 시행에서 일어날 수 있는 모든 경우의 집합을 표본공간이라 하고, 그 부분집합을 사건이라 한다.
    『고등학교 확률과 통계』
- label: 나
  body: |
    한 개의 주사위를 던지면 1, 2, 3, 4, 5, 6의 눈 중에서 하나가 나오고, 이 6개의 눈 중에서 어떤 눈이 나올 것인가는 우연에 의하여 정해진다. 정육면체 모양의 주사위에서는 각각의 눈이 나올 가능성이 같다고 기대할 수 있으므로, 각 눈이 나올 확률은 $\dfrac16$이라고 할 수 있다.
    『고등학교 확률과 통계』
- label: 다
  body: |
    어떤 시행에서 일어날 수 있는 모든 경우의 집합 S의 부분집합인 두 사건 $A$, $B$에 대하여 $A$ 또는 $B$가 일어나는 사건은 $A\cup B$로 나타내고, $A$와 $B$가 동시에 일어나는 사건은 $A\cap B$로 나타낸다. 특히 두 사건 $A$, $B$가 동시에 일어나지 않을 때, 즉 $A\cap B=\phi$이면 이 두 사건은 서로 배반이라고 하고 $A\cup B$의 확률은 $\mathrm{P}(A\cup B)=\mathrm{P}(A)+\mathrm{P}(B)$이다. 또한, 두 사건 $A$, $B$에 대하여 한 사건이 일어나거나 일어나지 않는 것이 다른 사건이 일어날 확률에 영향을 주지 않을 때, 두 사건은 서로 독립이라고 하고 $A\cap B$의 확률은 $\mathrm{P}(A\cap B)=\mathrm{P}(A)\mathrm{P}(B)$이다.
    『고등학교 확률과 통계』

stem: |
  반지름이 각각 3cm, 4cm인 두 원반 A와 B가 그림과 같이 설치되어 있다. 원반 A와 원반 B는 서로 미끄러지지 않게 맞물려 있고 화살표 방향으로 원반 A를 회전하면 원반 B도 회전한다. 원반 B는 6등분되어 그림과 같이 회색과 흰색으로 색칠되어 있다. 주사위를 2번 던져서 나오는 눈의 합 횟수만큼 그림과 같이 원반 A를 반시계 방향으로 회전시킬 때, 원반 A의 화살표가 원반 B의 회색부분의 호에 맞닿을 확률을 $\mathrm{P}(Q)$라고 하자. 제시문을 참고하여 시행, 표본공간 $S$, 사건 $Q$, 확률 $\mathrm{P}(Q)$를 구하시오.
  [그림: 왼쪽 원반 A(중심 표시)와 오른쪽 원반 B가 한 점에서 외접. A의 오른쪽 끝(접점)에 B를 향한 화살표. B는 중심을 지나는 세 직선으로 6등분(각 60°)되고 회색·흰색이 번갈아 칠해짐. 접점 쪽(중심에서 왼쪽으로 그은 점선, 각 180° 방향)은 흰색 부채꼴 안에 있고, 점선과 그 아래쪽 경계선이 이루는 각 a=40°. 즉 B 중심 기준 각으로 회색 부채꼴은 100°~160°, 220°~280°, 340°~40°, 흰색은 160°~220°, 280°~340°, 40°~100°. A 아래쪽에 반시계 방향 회전 화살표, B 아래쪽에 회전 화살표. (∠a=40°)]

subparts:
- id: '1'
  stem: |
    시행, 표본공간 $S$, 사건 $Q$, 확률 $\mathrm{P}(Q)$를 구하시오.
  points: 40
  depends_on: []
  answer: {kind: value, value: '\mathrm{P}(Q)=\dfrac{19}{36}', equivalents: ['19/36', 'Q: 눈의 합이 2, 3, 6, 7, 10, 11'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: A가 $n$바퀴 돌면 B는 시계 방향으로 $\dfrac{3n}{4}$바퀴, 즉 $270n^\circ$ 돈다. $n\equiv2,3\pmod 4$일 때 회색.
    steps:
    - {id: 1a, content: '합 $n\in\{2,3,6,7,10,11\}$, 경우의 수 $1+2+5+6+3+2=19$ → $\dfrac{19}{36}$', criteria: [1.A2, 1.A3]}
    hint_ladder:
    - A가 한 바퀴 돌 때 접점이 움직인 호의 길이는 얼마인가?
    - 같은 호의 길이만큼 B는 몇 바퀴, 어느 방향으로 도는가?
    - 회전 수를 4로 나눈 나머지에 따라 접점의 색이 정해진다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.54~55
    steps:
    - id: 1b-1
      content: |
        【가】에 의해 시행은 「주사위를 2번 던지는 것」이다. 첫째 눈 $i$, 둘째 눈 $j$로 나타내면 표본공간은 $S=\{(i,j)\mid i,j\in\{1,2,\cdots,6\}\}$이고 $n(S)=36$. 【나】와 두 시행의 독립(【다】)에 의해 각 근원사건의 확률은 $\dfrac16\cdot\dfrac16=\dfrac1{36}$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        미끄러지지 않으므로 두 원반의 접점에서 움직인 호의 길이가 같다. A가 한 바퀴 돌면 호의 길이 $6\pi$만큼 움직이므로 B는 $\dfrac{6\pi}{8\pi}=\dfrac34$바퀴, 외접하여 맞물렸으므로 A와 반대 방향(시계 방향)으로 돈다. 따라서 A가 $n$바퀴 돌면 B는 시계 방향으로 $270n^\circ$ 돈다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        B의 중심에서 접점 방향을 $180^\circ$로 잡으면 회색 부채꼴은 $100^\circ\sim160^\circ$, $220^\circ\sim280^\circ$, $340^\circ\sim400^\circ$. B가 시계 방향으로 $\varphi$ 돌면 접점에 오는 B의 점은 처음 $180^\circ+\varphi$에 있던 점이다. $n\equiv1$: $90^\circ$(흰색), $n\equiv2$: $0^\circ$(회색), $n\equiv3$: $270^\circ$(회색), $n\equiv0\pmod4$: $180^\circ$(흰색). 따라서 눈의 합 $n$이 $2,3,6,7,10,11$일 때 회색이다.
      criteria: [1.A1, 1.R1]
    - id: 1b-4
      content: |
        $Q=\{(i,j)\in S\mid i+j\in\{2,3,6,7,10,11\}\}$. 합이 $2,3,6,7,10,11$인 경우의 수는 각각 $1,2,5,6,3,2$이고 이 사건들은 서로 배반이므로 【다】에 의해
        $$\mathrm{P}(Q)=\dfrac{1+2+5+6+3+2}{36}=\dfrac{19}{36}.$$
      criteria: [1.A2, 1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: 시행(주사위 2번 던지기)과 표본공간(36개 순서쌍 또는 동등한 표현과 각 원소의 확률)을 명시했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 8
      evidence: A 한 바퀴에 B가 $\dfrac34$바퀴 반대 방향으로 돈다는 것을 호의 길이 $6\pi=8\pi\cdot\dfrac34$로 밝혔다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 8
      evidence: 회색에 닿는 회전 수가 $n\equiv2,3\pmod4$, 즉 $2,3,6,7,10,11$임을 적었다.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: 그림의 각 $40^\circ$와 6등분 경계로 각 회전 후 접점이 놓이는 부채꼴(색)을 근거와 함께 판정했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 사건 $Q$를 집합으로 적었다(순서쌍 19개 또는 합의 집합 $\{2,3,6,7,10,11\}$과 각 확률).
      depends_on: [1.M1, 1.A1]
      steps: [1a, 1b-4]
    - id: 1.A3
      mark_type: A
      points: 7
      evidence: $\mathrm{P}(Q)=\dfrac{19}{36}$을 배반사건의 합으로 구해 적었다.
      depends_on: [1.M1, 1.A1]
      steps: [1a, 1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
