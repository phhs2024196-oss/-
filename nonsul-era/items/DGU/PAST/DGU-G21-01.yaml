stimuli:
- label: 가
  body: |
    어떤 비트코인이 초기가격 $A_0$에서 매년 일정하게 $a\%$ 비율로 올라가면 $n$년 후의 비트코인 가격 $A_n$은
    $$A_n=A_0\left(1+\dfrac{a}{100}\right)^n,\qquad(\text{단, }A_0>0)$$
    로 표현할 수 있다고 가정하자.
    『고등학교 수학 Ⅰ』
- label: 나
  body: |
    $a>0,\ a\neq1,\ x_1>0,\ x_2>0$일 때
    1) $\log_a x_1=b\iff x_1=a^b$
    2) $\log_a x_1=\log_a x_2\iff x_1=x_2$
    『고등학교 수학 Ⅰ』
- label: 다
  body: |
    $a>0,\ a\neq1$이고 $M>0,\ N>0$일 때
    1) $\log_a MN=\log_a M+\log_a N$
    2) $\log_a\dfrac{M}{N}=\log_a M-\log_a N$
    3) $\log_a M^k=k\log_a M$ ($k$는 실수)
    『고등학교 수학 Ⅰ』
- label: 라
  body: |
    10을 밑으로 하는 로그를 상용로그라 하며, 양수 $N$의 상용로그 $\log_{10}N$은 보통 밑 10을 생략하여 $\log N$으로 나타낸다.
    『고등학교 수학 Ⅰ』

stem: |
  어떤 비트코인이 초기 가격 $A_0$에서 매년 일정한 비율로 올라가 5년 후 초기 가격의 2배가 되었다고 가정했을 때, 그 비트코인 가격은 매년 몇 %씩 올라갔는지 논술하시오
  (단, $\log2=0.3$, $\log1.15=0.06$으로 계산하시오).

subparts:
- id: '1'
  stem: |
    위 논제에 답하시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: '15\%', equivalents: ['15', 'a=15'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\left(1+\dfrac a{100}\right)^5=2$에 상용로그를 취하고 $\log(100+a)=2+0.06$을 $\log115$로 본다.
    steps:
    - {id: 1a, content: '$5\{\log(100+a)-2\}=0.3$ ⇒ $\log(100+a)=2.06=\log115$ ⇒ $a=15$', criteria: [1.M2, 1.R1]}
    hint_ladder:
    - 5년 후 가격을 제시문 [가]의 식으로 쓰자.
    - 양변에 상용로그를 취하자.
    - $2.06=2+0.06$을 하나의 로그로 쓰면?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.45
    steps:
    - id: 1b-1
      content: |
        비트코인의 초기 가격을 $A_0$, 매년 $a\%$씩 오른다고 하면 제시문 [가]에 의해 5년 후의 가격은 $A_5=A_0\left(1+\dfrac{a}{100}\right)^5$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        5년 후 가격이 초기 가격의 2배이므로 $A_0\left(1+\dfrac{a}{100}\right)^5=2A_0$, 즉 $\left(1+\dfrac{a}{100}\right)^5=2$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        양변의 상용로그를 취하면(제시문 [나]-2), [라]) $\log\left(1+\dfrac{a}{100}\right)^5=\log2$이고, 제시문 [다]에 의해
        $5\{\log(100+a)-2\}=\log2$. 따라서 $5\log(100+a)=10+\log2=10.3$이므로 $\log(100+a)=2.06$.
      criteria: [1.M2, 1.A2]
    - id: 1b-4
      content: |
        $\log(100+a)=2.06=2+0.06=\log100+\log1.15=\log115$이므로 제시문 [나]-2)에 의해 $100+a=115$, $a=15$.
        따라서 비트코인 가격은 매년 $15\%$씩 올라갔다.
      criteria: [1.R1, 1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: 제시문 [가]의 식으로 5년 후 가격 $A_0\left(1+\dfrac a{100}\right)^5$을 썼다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $\left(1+\dfrac{a}{100}\right)^5=2$를 세웠다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 8
      evidence: 양변에 상용로그를 취하고 로그의 성질로 $5\{\log(100+a)-2\}=\log2$(또는 $5\log\left(1+\dfrac a{100}\right)=0.3$)로 정리했다.
      depends_on: []
      steps: [1a, 1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: $\log(100+a)=2.06$ 또는 $\log\left(1+\dfrac a{100}\right)=0.06$을 얻었다.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: $0.06=\log1.15$(또는 $2.06=\log115$)와 로그의 일대일 성질로 진수를 비교했다.
      depends_on: []
      steps: [1a, 1b-4]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: 매년 $15\%$씩 올랐다고 답했다.
      depends_on: [1.R1]
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-2402}
  misconceptions:
