stimuli:
- label: 가
  body: |
    일반적으로 한 번의 시행에서 어떤 사건 $A$가 일어날 확률이 $p$로 일정할 때, $n$번의 독립시행에서 사건 $A$가 일어나는 횟수를 확률변수 $X$로 하면 $X$가 가질 수 있는 값은 $0,1,2,\cdots,n$이고, $X$의 확률질량함수는
    $$\mathrm{P}(X=x)={}_n\mathrm{C}_x\,p^x(1-p)^{n-x},\quad(x=0,1,2,\cdots,n)$$
    이다. 이와 같은 확률변수 $X$의 확률분포를 이항분포라고 하며, 이것을 기호로 $\mathrm{B}(n,p)$와 같이 나타낸다. 확률변수 $X$가 이항분포 $\mathrm{B}(n,p)$를 따를 때 $X$의 평균, 분산, 표준편차는 각각
    $$\mathrm{E}(X)=np,\ \mathrm{V}(X)=np(1-p),\ \sigma(X)=\sqrt{np(1-p)}$$
    로 알려져 있다.
    『고등학교 확률과 통계』
- label: 나
  body: |
    일반적으로 실수 전체의 집합에서 정의된 연속확률변수 $X$의 확률밀도함수 $f(x)$가 두 상수 $m,\sigma\ (\sigma>0)$에 대하여
    $$f(x)=\dfrac{1}{\sqrt{2\pi}\,\sigma}e^{-\frac{(x-m)^2}{2\sigma^2}}$$
    일 때, $X$의 확률분포를 정규분포라고 한다. 이때 확률변수 $X$의 평균은 $m$, 표준편차는 $\sigma$임이 알려져 있다. 평균과 표준편차가 각각 $m$과 $\sigma$인 정규분포를 기호로 $\mathrm{N}(m,\sigma^2)$과 같이 나타내고, 확률변수 $X$는 정규분포 $\mathrm{N}(m,\sigma^2)$을 따른다고 한다.
    『고등학교 확률과 통계』
- label: 다
  body: |
    확률변수 $X$가 정규분포 $N(m,\sigma^2)$을 따를 때, 확률변수
    $$Z=\dfrac{X-m}{\sigma}$$
    은 표준정규분포 $\mathrm{N}(0,1)$을 따른다.
    『고등학교 확률과 통계』
- label: 라
  body: |
    확률변수 $X$가 이항분포 $\mathrm{B}(n,p)$를 따를 때, $n$이 충분히 크면 $X$는 근사적으로 정규분포 $\mathrm{N}(np,\ np(1-p))$를 따른다. $n$이 충분히 크다는 것은 일반적으로 $np\ge5,\ n(1-p)\ge5$일 때를 뜻한다.
    『고등학교 확률과 통계』
- label: 마
  body: |
    확률변수 $Z$가 표준정규분포를 따를 때 $\mathrm{P}(0\le Z\le z)$의 값을 소숫점 이하 세 자리에서 반올림한 값은 다음과 같다.
    [표] $z$ / $\mathrm{P}(0\le Z\le z)$ : $0.52$ / $0.20$, $0.84$ / $0.30$, $1.28$ / $0.40$, $2.00$ / $0.48$
    『고등학교 확률과 통계』

stem: |
  상품K는 무게에 따라 다음과 같이 구분된다.
  [표] 구분 / 무게 : A등급 / $68g$ 이상, B등급 / $50g$ 이상-$68g$ 미만, C등급 / $50g$ 미만
  어느 공장에서 생산되는 상품K 한 개의 무게는 평균이 $55.2g$이고 표준편차가 $10g$인 정규분포를 따른다고 한다(단, 단위는 생략할 수 있다).

subparts:
- id: '1'
  stem: |
    1) 이 공장에서 생산되는 상품K 중에서 임의의 한 개를 선택할 때, 이 상품K가 A등급일 확률을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '0.1', equivalents: ['1/10'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{68-55.2}{10}=1.28$이 표에 있다.
    steps:
    - {id: 1a, content: '$P(X\ge68)=P(Z\ge1.28)=0.5-0.40=0.1$', criteria: [1.M1, 1.M2]}
    hint_ladder:
    - A등급의 조건을 무게 $X$에 대한 부등식으로 쓰고 표준화하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.46
    steps:
    - id: 1b-1
      content: |
        상품K 한 개의 무게를 확률변수 $X$라 하면 $X$는 정규분포 $\mathrm{N}(55.2,\ 10^2)$을 따르므로 제시문 [다]에 의해 $Z=\dfrac{X-55.2}{10}$이고
        $\mathrm{P}(X\ge68)=\mathrm{P}(Z\ge1.28)$.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        제시문 [나]와 [마]를 이용하면 $\mathrm{P}(Z\ge1.28)=0.5-\mathrm{P}(0\le Z\le1.28)=0.5-0.40=0.1$.
      criteria: [1.M2, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $Z=\dfrac{X-55.2}{10}$로 표준화하여 $\mathrm{P}(X\ge68)$을 $Z$의 확률로 바꾸었다.
      depends_on: []
      implied_ok: false
      steps: [1a, 1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $\mathrm{P}(Z\ge1.28)$을 적었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $\mathrm{P}(Z\ge z)=0.5-\mathrm{P}(0\le Z\le z)$를 써서 표를 적용했다.
      depends_on: []
      steps: [1a, 1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: 확률 $0.1$을 적었다.
      depends_on: [1.M2]
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-2402}
  misconceptions:
  - id: MC-PRB-2402
    outcome_code: '70'
    wrong_work: '표의 $\mathrm{P}(0\le Z\le1.28)=0.40$을 그대로 $\mathrm{P}(Z\ge1.28)$로 답함'
    detect_cue: 답이 $0.4$ 또는 $0.9$
    feedback: 표는 $0$부터 $z$까지의 확률입니다. 오른쪽 꼬리 확률은 $0.5$에서 빼세요.
    remedy: [RL-1]
