    2) 1)을 이용하여 이 공장에서 생산되는 400개 상품K 중에서 A등급으로 구분되는 상품K 수의 평균과 표준편차를 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '\text{평균 }40,\ \text{표준편차 }6', equivalents: ['40, 6'], tolerance: null}
