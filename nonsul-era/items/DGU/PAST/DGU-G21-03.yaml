  misconceptions:
  - id: MC-CAL-2407
    outcome_code: '70'
    wrong_work: '$\sqrt{f(t)}=-\dfrac{t-3}{2}$도 해로 남겨 $f(x)=\dfrac{(x-3)^2}{4}$를 함께 답하거나 그것을 답으로 씀'
    detect_cue: 답에 $\dfrac{(x-3)^2}{4}$가 있다
    feedback: $\sqrt{f(t)}\ge0$이고 $t-3\ge0$입니다. $\sqrt{f(t)}=-\dfrac{t-3}{2}$는 $t=3$에서만 가능합니다.
    remedy: [RL-1]
  - id: MC-CAL-2408
    outcome_code: '71'
