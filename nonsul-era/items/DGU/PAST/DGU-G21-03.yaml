stimuli:
- label: 가
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 $S=\displaystyle\int_a^b\lvert f(x)\rvert\,dx$ 이다.
    『고등학교 수학Ⅱ』
- label: 나
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때 $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^b f(x)dx=\int_\alpha^\beta f(g(t))g'(t)dt$$
    이다.
    『고등학교 미적분』
- label: 다
  body: |
    함수 $y=x^r$ ($r$은 실수)의 부정적분은
    1) $r\neq-1$ 일 때, $\displaystyle\int x^r dx=\dfrac{1}{r+1}x^{r+1}+C$
    2) $r=-1$ 일 때, $\displaystyle\int x^{-1}dx=\ln\lvert x\rvert+C$
    『고등학교 미적분』
- label: 라
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때, $f(x)$의 한 부정적분 $F(x)$에 대하여 $f(x)$의 $a$에서 $b$까지의 정적분을
    $$\int_a^b f(x)\,dx=\Big[F(x)\Big]_a^b=F(b)-F(a)$$
    라고 한다.
    『고등학교 수학Ⅱ』
- label: 마
  body: |
    닫힌구간 $[a,b]$의 임의의 점 $x$에서 $x$축에 수직인 평면으로 자른 단면의 넓이가 $S(x)$인 입체도형의 부피 $V$는 $V=\displaystyle\int_a^b S(x)\,dx$ 이다(단, $S(x)$는 닫힌구간 $[a,b]$에서 연속).
    『고등학교 미적분』

stem: |
  함수$y=f(x)$가 정의역 $\{x\mid x\ge3\}$에서 $f(x)\ge0$이며 연속이고, 함수 $y=f(x)$의 그래프 위 임의의 점 $(t,\ f(t))$가
  $$\int_3^t(s-3)^2\,ds+\int_0^{f(t)}(\sqrt{s}+3)\,ds=tf(t)$$
  를 만족한다고 할 때, 함수 $y=f(x)$를 구하시오. 함수 $y=f(x)$의 그래프와 $x$축 및 $x=4$로 둘러싸인 도형 $R$의 넓이를 구하시오. $R$을 밑면으로 하는 입체 도형을 $x$축에 수직인 평면으로 자른 단면이 정사각형일 때, 이 입체 도형의 부피를 구하시오.

subparts:
- id: '1'
  stem: |
    위 논제의 함수 $y=f(x)$, 도형 $R$의 넓이, 입체 도형의 부피를 구하시오.
  points: 40
  depends_on: []
  answer: {kind: value, value: 'f(x)=(x-3)^2\ (x\ge3),\ \text{넓이 }\dfrac13,\ \text{부피 }\dfrac15', equivalents: ['(x-3)^2, 1/3, 1/5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 적분을 계산하면 $t-3$과 $\sqrt{f(t)}$에 대한 3차 동차식이 되어 인수분해된다.
    steps:
    - {id: 1a, content: '$\dfrac13A^3+\dfrac23B^3+3B^2=(A+3)B^2$ ⇒ $(A-B)^2(A+2B)=0$ ⇒ $B=A$', criteria: [1.M2, 1.R1]}
    hint_ladder:
    - 두 정적분을 직접 계산해 보자.
    - $t-3=A$, $\sqrt{f(t)}=B$로 두면 어떤 식이 되는가?
    - 단면이 정사각형이면 한 변의 길이는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.47
    steps:
    - id: 1b-1
      content: |
        [1] 함수 $y=f(x)$가 정의역 $\{x\mid x\ge3\}$에서 $f(x)\ge0$이므로 그래프 위 임의의 점 $(t,\ f(t))$는 $t\ge3$, $f(t)\ge0$을 만족한다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        [2] 제시문 [다], [라]에 의해
        $$tf(t)=\int_3^t(s-3)^2ds+\int_0^{f(t)}(\sqrt s+3)ds=\int_0^{t-3}x^2dx+\dfrac23f(t)^{\frac32}+3f(t)=\dfrac13(t-3)^3+\dfrac23f(t)^{\frac32}+3f(t).$$
      criteria: [1.M1, 1.A1]
    - id: 1b-3
      content: |
        $A=t-3$, $B=\sqrt{f(t)}$로 두면 $tf(t)=(A+3)B^2$이므로 정리하면 $A^3+2B^3-3AB^2=0$이고, 인수분해하면 $(A-B)^2(A+2B)=0$.
        따라서 $\sqrt{f(t)}=t-3$ 또는 $t-3+2\sqrt{f(t)}=0$.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        $t\ge3$, $f(t)\ge0$이므로 $t-3+2\sqrt{f(t)}=0$은 $t=3$, $f(3)=0$일 때만 가능하고 이 경우도 $\sqrt{f(t)}=t-3$을 만족한다. 따라서 구하는 연속함수는
        $$y=(x-3)^2\quad(\text{단, }x\ge3).$$
      criteria: [1.R1, 1.A2]
    - id: 1b-5
      content: |
        [3] 제시문 [가]에 의해 도형 $R$의 넓이는 $\displaystyle\int_3^4(x-3)^2dx=\int_0^1s^2ds=\dfrac13$.
      criteria: [1.M3, 1.A3]
    - id: 1b-6
      content: |
        단면은 한 변의 길이가 $f(x)=(x-3)^2$인 정사각형이므로 단면의 넓이는 $(x-3)^4$이고, 제시문 [마]에 의해 부피는 $\displaystyle\int_3^4(x-3)^4dx=\int_0^1s^4ds=\dfrac15$.
      criteria: [1.M4, 1.A4]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 해설집 별해 — $\int_3^t(x-3)^2dx$는 곡선 $y=(x-3)^2$ 아래 넓이, $\int_0^{f(t)}(\sqrt y+3)dy$는 곡선 $x=\sqrt y+3$ 왼쪽($y$축까지) 넓이이고, $x\ge3$, $y\ge0$에서 두 곡선은 같다. 두 넓이의 합이 직사각형 넓이 $tf(t)$와 같은 것은 점 $(t,f(t))$가 그 곡선 위에 있을 때이다.
    steps:
    - id: 1c-1
      content: |
        점 $(t,f(t))$가 곡선 $y=(x-3)^2$ 위에 있으면 두 영역이 겹치지 않고 직사각형 $[0,t]\times[0,f(t)]$를 채우므로 등식이 성립한다. 따라서 $f(x)=(x-3)^2\ (x\ge3)$.
      criteria: [1.M2, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: 두 정적분을 계산해 $\dfrac13(t-3)^3$, $\dfrac23f(t)^{\frac32}+3f(t)$를 얻는 과정이 있다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $tf(t)=\dfrac13(t-3)^3+\dfrac23f(t)^{\frac32}+3f(t)$를 정확히 적었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 8
      evidence: $t-3$과 $\sqrt{f(t)}$로 정리해 $(A-B)^2(A+2B)=0$ 꼴로 인수분해했다(또는 별해처럼 넓이 해석으로 곡선을 찾았다).
      depends_on: []
      steps: [1a, 1b-3, 1c-1]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: $t\ge3$, $f(t)\ge0$ 조건으로 $t-3+2\sqrt{f(t)}=0$인 경우를 배제(또는 $t=3$에서만 가능함)하는 근거를 적었다.
      depends_on: []
      steps: [1a, 1b-1, 1b-4]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $f(x)=(x-3)^2\ (x\ge3)$를 적었다.
      depends_on: [1.M2]
      steps: [1b-4, 1c-1]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: 넓이를 $\int_3^4(x-3)^2dx$로 세웠다.
      depends_on: []
      steps: [1b-5]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: 넓이 $\dfrac13$을 적었다.
      depends_on: [1.M3]
      steps: [1b-5]
    - id: 1.M4
      mark_type: M
      points: 4
      evidence: 단면 넓이를 $f(x)^2=(x-3)^4$으로 두고 $\int_3^4(x-3)^4dx$를 세웠다.
      depends_on: []
      steps: [1b-6]
    - id: 1.A4
      mark_type: A
      points: 2
      evidence: 부피 $\dfrac15$을 적었다.
      depends_on: [1.M4]
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
    - code: D1-2
      condition: 정의역 $x\ge3$ 누락
      effect: minus
      value: 2
