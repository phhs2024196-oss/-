  misconceptions:
  - id: MC-CAL-2401
    outcome_code: '70'
    wrong_work: '$f''(x)=f''(0)f''(x)$에서 양변을 $f''(x)$로 나누어 바로 $f''(0)=1$이라고 씀'
    detect_cue: $f'(x)\equiv0$인 경우를 배제하는 문장이 없다
    feedback: 양변을 $f'(x)$로 나누려면 $f'(x)\neq0$인 점이 있어야 합니다. $f'\equiv0$이면 $f(1)=0$이 되어 조건에 모순임을 먼저 밝히세요.
    remedy: [RL-1]
  - id: MC-CAL-2402
    outcome_code: '71'
    wrong_work: '$x=2t$ 치환에서 $dx=2dt$를 빠뜨려 $\int_0^2 f(x)dx=a^2$로 답함'
    detect_cue: 답이 $a^2$ 또는 $4a^2$
    feedback: 치환할 때는 $dx=g'(t)dt$와 적분 구간을 함께 바꾸어야 합니다.
    remedy: [RL-2]

