stimuli:
- label: 가
  body: |
    미분가능한 함수 $y=f(x)$의 도함수는
    $$f'(x)=\lim_{\Delta x\to0}\dfrac{f(x+\Delta x)-f(x)}{\Delta x}$$
    『고등학교 수학Ⅱ』
- label: 나
  body: |
    임의의 두 실수 $a,b$를 포함하는 구간에서 연속인 함수 $f(x)$에 대하여 $\displaystyle\int f(x)dx=F(x)+C$ ($C$는 적분상수)일 때
    $$\int_a^b f(x)dx=\Big[F(x)\Big]_a^b=F(b)-F(a)$$
    『고등학교 수학Ⅱ』
- label: 다
  body: |
    $y=f(x)$의 도함수 $f'(x)$가 미분가능할 때 함수 $f'(x)$의 도함수
    $$\lim_{h\to0}\dfrac{f'(x+h)-f'(x)}{h}$$
    를 함수 $y=f(x)$의 이계도함수라 하고, 이것을 기호로
    $$f''(x),\ y'',\ \dfrac{d^2y}{dx^2},\ \dfrac{d^2}{dx^2}f(x)$$
    와 같이 나타낸다.
    『고등학교 미적분』

stem: |
  실수 전체에서 도함수와 이계도함수가 존재하는 함수 $f$가 모든 실수 $x,y$에 대하여
  $f(x+y)-f(x-y)=2f(y)f'(x)$, $f(0)=0$, $f(1)=a\ (a>0)$ 를 만족한다고 하자.
  이 때, $f'(0)$, $f''(0)$, $\displaystyle\int_0^2 f(x)dx$를 각각 구하시오.

subparts:
- id: '1'
  stem: |
    위 논제의 $f'(0)$, $f''(0)$, $\displaystyle\int_0^2 f(x)dx$를 각각 구하시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: "f'(0)=1,\\ f''(0)=0,\\ \\int_0^2 f(x)dx=2a^2", equivalents: ['1, 0, 2a^2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 식을 $2y$로 나눠 $y\to0$이면 $f'(x)=f'(0)f'(x)$, $x=0$·$y=1$·$y=x$를 차례로 대입한다.
    steps:
    - {id: 1a, content: '$f''(x)=f''(0)f''(x)$, $f$ 기함수·$f''$ 우함수, $f''(1)-f''(-1)=2af''''(0)$, $f(2x)=2f(x)f''(x)$', criteria: [1.M1, 1.M2, 1.M3]}
    hint_ladder:
    - 좌변을 $2y$로 나누면 어떤 극한이 보이는가?
    - $x=0$, $y=1$을 각각 넣어 보자.
    - $y=x$를 넣으면 $f(2x)$가 나온다. $\int_0^2 f(x)dx$에서 $x=2t$로 치환해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.37
    steps:
    - id: 1b-1
      content: |
        $y\neq0$일 때 양변을 $2y$로 나누고 $f(0)=0$을 쓰면
        $\dfrac{f(x+y)-f(x-y)}{2y}=\dfrac{f(y)-f(0)}{y}\,f'(x)$.
        좌변은 $\dfrac12\left[\dfrac{f(x+y)-f(x)}{y}+\dfrac{f(x-y)-f(x)}{-y}\right]$이므로 제시문 【가】에 의해 $y\to0$일 때 $f'(x)$로, 우변은 $f'(0)f'(x)$로 수렴한다. 따라서 모든 $x$에 대하여 $f'(x)=f'(0)f'(x)$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        만약 $f'(0)\neq1$이면 모든 $x$에서 $f'(x)=0$이 되어 $f$는 상수함수이고 $f(1)=f(0)=0$이 되어 $f(1)=a>0$에 모순이다. 따라서 $f'(0)=1$.
      criteria: [1.R1, 1.A1]
    - id: 1b-3
      content: |
        주어진 식에 $x=0$을 넣으면 $f(y)-f(-y)=2f(y)f'(0)=2f(y)$, 즉 $f(-y)=-f(y)$. 양변을 $y$로 미분하면 $-f'(-y)=-f'(y)$이므로 $f'(-y)=f'(y)$.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        주어진 식에 $y=1$을 넣으면 $f(x+1)-f(x-1)=2af'(x)$. 양변을 $x$로 미분하면 (제시문 【다】) $f'(x+1)-f'(x-1)=2af''(x)$.
        $x=0$을 넣으면 $2af''(0)=f'(1)-f'(-1)=0$이고 $a>0$이므로 $f''(0)=0$.
      criteria: [1.M2, 1.A2]
    - id: 1b-5
      content: |
        주어진 식에 $y=x$를 넣으면 $f(2x)-f(0)=2f(x)f'(x)$, 즉 $f(2x)=2f(x)f'(x)$.
      criteria: [1.M3]
    - id: 1b-6
      content: |
        $x=2t$로 치환하면 $dx=2\,dt$이고 $x:0\to2$일 때 $t:0\to1$이므로
        $\displaystyle\int_0^2 f(x)dx=\int_0^1 2f(2t)\,dt=\int_0^1 4f(t)f'(t)\,dt=\Big[2\{f(t)\}^2\Big]_0^1=2a^2$ (제시문 【나】).
      criteria: [1.M3, 1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: 식을 $2y$(또는 $y$)로 나누고 $y\to0$ 극한을 취해 미분계수의 정의로 $f'(x)=f'(0)f'(x)$를 이끌어 냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: $f'\equiv0$이면 $f$가 상수가 되어 $f(1)=a>0$에 모순임을 적어 $f'(0)\neq1$인 경우를 배제했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $f'(0)=1$을 답으로 적었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: $f$가 기함수($f'$이 우함수)임을 보이고, $y=1$ 대입 후 $x$로 미분한 식에 $x=0$을 넣었다.
      depends_on: []
      steps: [1b-3, 1b-4]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $f''(0)=0$을 답으로 적었다.
      depends_on: [1.M2]
      steps: [1b-4]
    - id: 1.M3
      mark_type: M
      points: 6
      evidence: $y=x$를 대입해 $f(2x)=2f(x)f'(x)$를 얻고 $x=2t$ 치환으로 $\int_0^1 4f(t)f'(t)dt$ 꼴로 바꾸었다.
      depends_on: []
      steps: [1b-5, 1b-6]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: $\int_0^2 f(x)dx=2a^2$를 답으로 적었다.
      depends_on: [1.M3]
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
