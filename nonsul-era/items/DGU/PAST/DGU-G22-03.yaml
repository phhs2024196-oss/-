stimuli:
- label: 가
  body: |
    수직선 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 위치 $x$가 $x=f(t)$일 때, 점 $\mathrm{P}$의 시각 $t$에서의 속도 $v(t)$는
    $$v(t)=\dfrac{dx}{dt}=f'(t)$$
    『고등학교 수학Ⅱ』
- label: 나
  body: |
    수직선 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서 속도가 $v(t)$라고 할 때 시각 $t=a$에서 $t=b$까지 점 $\mathrm{P}$의 위치의 변화량은
    $$\int_a^b v(t)\,dt$$
    『고등학교 수학Ⅱ』
- label: 다
  body: |
    닫힌구간 $[a,b]$의 임의의 점 $x$에서 $x$축에 수직인 평면으로 자른 단면의 넓이가 $S(x)$인 입체도형의 부피 $V$는
    $$V=\int_a^b S(x)\,dx$$
    이다. 단, $S(x)$는 닫힌구간 $[a,b]$에서 연속인 함수이다.
    『고등학교 미적분』
- label: 라
  body: |
    함수 $f(x)$가 임의의 세 실수 $a,b,c$를 포함하는 닫힌구간에서 연속일 때
    $$\int_a^c f(x)\,dx+\int_c^b f(x)\,dx=\int_a^b f(x)\,dx$$
    『고등학교 수학Ⅱ』
- label: 마
  body: |
    함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때
    $$\dfrac{d}{dx}\int_a^x f(t)\,dt=f(x)$$
    이다. 단, $a<x<b$이다.
    『고등학교 수학Ⅱ』
- label: 바
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때 합성함수 $y=f(g(x))$의 도함수는
    $$\dfrac{dy}{dx}=\dfrac{dy}{du}\times\dfrac{du}{dx},\qquad y'=f'(g(x))g'(x)$$
    『고등학교 미적분』

stem: |
  밑면의 넓이가 $A\ (m^2)$인 원기둥 모양의 물통에 일정량의 물이 채워져 있다. 그리고 이 물통에 속이 꽉 들어찬 입체도형이 아래 그림과 같이 $v\ (m/s)$의 일정한 속력으로 하강하고 있다. 수면을 확장한 평면으로 입체도형을 자른 단면의 넓이가 $S\ (m^2)$인 순간, 수면의 상승 속도를 구하시오.
  (단, 입체도형이 완전히 잠길 만큼 물통에 물이 많으며 또한 입체도형이 완전히 잠겨도 물이 넘치지 않을 만큼 물통이 충분히 크고, 입체도형은 회전하지 않으며 수직으로 하강한다. 그리고 입체도형의 최하단에서 거리가 $z\ (m)$인 수면에 평행한 평면으로 자른 입체도형의 단면의 넓이 $S(z)\ (m^2)$는 $z$에 대해 연속이다.)
  [그림: 밑면 넓이 $A$인 원기둥 물통 속으로 불규칙한 모양의 입체도형이 아래쪽(화살표 $v$)으로 내려가며 일부가 잠겨 있다. 수면 위치의 단면에 빗금과 $S$, 최하단에서 높이 $z$인 단면에 빗금과 $S(z)$가 표시되어 있다.]

subparts:
- id: '1'
  stem: |
    위 논제의 수면의 상승 속도를 구하시오.
  points: 40
  depends_on: []
  answer: {kind: expression, value: '\dfrac{Sv}{A-S}\ (m/s)', equivalents: ['Sv/(A-S)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 잠긴 깊이 $z$는 물체 하강 $vt$와 수면 상승 $h-h_0$의 합이고, 잠긴 부피가 곧 수면 상승분의 부피이다.
    steps:
    - {id: 1a, content: '$\int_0^{z}(A-S(x))dx=Avt$, $z=vt+h-h_0$ → $(A-S)z''=Av$ → $h''=z''-v=\dfrac{Sv}{A-S}$', criteria: [1.M2, 1.M3, 1.M4]}
    hint_ladder:
    - 입체가 수면 아래로 잠긴 깊이 $z$는 어떤 두 양의 합인가?
    - 수면이 오른 만큼의 물기둥 부피와 잠긴 부분의 부피를 비교하자.
    - 그 식을 $t$로 미분하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.40
    steps:
    - id: 1b-1
      content: |
        입체도형이 수면에 들어가기 직전의 시각을 $t=0$, 그때 수면의 높이를 $h_0$, 시각 $t$의 수면 높이를 $h(t)$라 하자. 입체도형 최하단의 점 $\mathrm{P}$에서 수면까지의 높이를 $z(t)$, 수면을 확장한 평면 $\mathrm{N}$으로 자른 단면의 넓이를 $S(z(t))$, 높이 $h_0$인 평면을 $\mathrm{M}$이라 하자.
        입체도형은 속력 $v$로 하강하므로 $t$초 동안 하강한 길이는 $vt$이고(제시문 【나】), $z(t)=vt+h(t)-h_0$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        평면 $\mathrm{M}$ 아래에 있는 입체도형의 부피는 두 평면 $\mathrm{M}$과 $\mathrm{N}$ 사이에 있는 물의 부피와 같으므로 제시문 【다】에 의해
        $$\int_0^{vt}S(x)\,dx=\int_{vt}^{z(t)}\big(A-S(x)\big)\,dx.$$
        제시문 【라】로 적분 구간을 모두 $0$에서 시작하도록 정리하면
        $$\int_0^{z(t)}\big(A-S(x)\big)\,dx=Avt.$$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $S$가 연속이므로 양변을 $t$에 대해 미분하면 제시문 【마】, 【바】에 의해
        $$\big(A-S(z(t))\big)z'(t)=Av,\qquad z'(t)=\dfrac{Av}{A-S(z(t))}.$$
      criteria: [1.M3, 1.A1]
    - id: 1b-4
      content: |
        $z(t)=vt+h(t)-h_0$에서 $h'(t)=z'(t)-v=\dfrac{S(z(t))\,v}{A-S(z(t))}$.
        구하려는 순간의 시각을 $t_1$이라 하면 $S(z(t_1))=S$이므로 그 순간 수면의 상승 속도는
        $$h'(t_1)=\dfrac{Sv}{A-S}\ (m/s).$$
      criteria: [1.M4, 1.A2]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 해설집 두 번째 풀이 — 순간 변화율은 그 순간의 단면에만 의존하므로 단면이 $S$인 기둥으로 바꾸어 생각하면 $(A-S)\Delta h=Sv\Delta t$. 엄밀하게는 $[z_1,z_1+\Delta z]$에서 $S$의 최대·최소로 만든 두 기둥 사이에 끼워 $\Delta z\to0$.
    steps:
    - id: 1c-1
      content: |
        단면이 $S$인 기둥이 $\Delta t$ 동안 $v\Delta t$ 내려가면, 새로 잠기는 부피 $S(v\Delta t+\Delta h)$가 수면 상승분 $A\Delta h$와 같으므로 $(A-S)\Delta h=Sv\Delta t$, $\displaystyle\lim_{\Delta t\to0}\dfrac{\Delta h}{\Delta t}=\dfrac{Sv}{A-S}$. $S_{\min}\le S(z)\le S_{\max}$로 끼워 같은 극한을 얻는다.
      criteria: [1.M2, 1.M4, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: 최하단에서 수면까지의 높이가 물체의 하강 거리와 수면 상승 높이의 합($z=vt+h-h_0$ 또는 동등한 식)임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 8
      evidence: 평면 아래 잠긴 입체 부피와 두 평면 사이 물의 부피가 같다는 식 $\int_0^{z}(A-S(x))dx=Avt$(또는 동등식, 짧은 시간 $\Delta t$에 대한 $(A-S)\Delta h=Sv\Delta t$)을 세웠다.
      depends_on: []
      steps: [1b-2, 1c-1]
    - id: 1.M3
      mark_type: M
      points: 8
      evidence: 부피 관계식을 $t$에 대해 미분하여 $(A-S(z))z'=Av$(또는 동등식)를 얻었다(정적분으로 정의된 함수의 미분·합성함수 미분 적용).
      depends_on: []
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $z'(t)=\dfrac{Av}{A-S(z(t))}$를 적었다.
      depends_on: [1.M3]
      steps: [1b-3]
    - id: 1.M4
      mark_type: M
      points: 8
      evidence: $h'=z'-v$에 대입해 정리하고 $S(z(t_1))=S$를 넣는 식을 적었다.
      depends_on: [1.M1]
      steps: [1b-4, 1c-1]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 상승 속도 $\dfrac{Sv}{A-S}$ (단위 $m/s$)를 답으로 적었다.
      depends_on: [1.M3, 1.M4]
      steps: [1b-4, 1c-1]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
    - code: D1-2
      condition: 단위 누락
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2404}
  misconceptions:
  - id: MC-CAL-2404
    outcome_code: '70'
    wrong_work: '잠긴 깊이를 $vt$로만 보아(수면 상승 무시) $Ah''=Sv$, 즉 $h''=\dfrac{Sv}{A}$로 답함'
    detect_cue: 답의 분모가 $A$
    feedback: 수면이 오르면 그만큼 더 잠깁니다. 잠긴 깊이의 변화율은 $v+h'$입니다.
    remedy: [RL-1]

