stimuli:
- label: 가
  body: |
    평면 위의 한 점 F와 이 점을 지나지 않는 한 직선 $k$가 주어질 때, 점 F에 이르는 거리와 직선 $k$에 이르는 거리가 같은 점들의 집합을 **포물선**이라고 한다. 이때 점 F를 포물선의 **초점**, 직선 $k$를 포물선의 **준선**이라고 한다. 또, 포물선의 초점을 지나고 준선에 수직인 직선을 포물선의 **축**, 축과 포물선의 교점을 포물선의 **꼭지점**이라고 한다.
    -『고등학교 기하』
- label: 나
  body: |
    위성 방송 안테나는 포물선의 축에 평행하게 들어오는 전파가 포물선의 초점에 모이는 성질을 이용하여 약한 전파를 증폭하여 수신할 수 있게 한다. 또한, 자동차의 전조등이나 무대의 조명등은 포물선의 이런 성질을 거꾸로 적용한 것이다.
    이제 포물선이 갖는 이와 같은 성질을 다음과 같이 증명해 보자.
    (중략)
    전파가 곡선 위의 한 점에서 반사된다는 것은, 그 점을 지나는 곡선의 접선에 대하여 입사각과 반사각의 크기가 같게 된다는 뜻이다. 따라서 포물선의 축에 평행하게 들어온 전파는 포물선에 반사되어 초점에 모이게 됨을 알 수 있다.
    -『고등학교 기하』
- label: 다
  body: |
    쌍곡선 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$ 위의 점 $\mathrm{P}(x_1,\ y_1)$에서의 접선의 방정식은
    $$\dfrac{x_1x}{a^2}-\dfrac{y_1y}{b^2}=1$$
    이다.
    -『고등학교 기하』

stem: |
  그림과 같이 단면이 포물선 모양인 거울 $y^2=4x\ (0\le x\le4)$의 초점 $\mathrm{F}(1,\ 0)$에서 쏜 빛이 포물선 위의 점 $\mathrm{G}(2,\ 2\sqrt2)$에 반사되어 직진한다. 또한, 이 빛은 단면이 쌍곡선 모양인 거울 $\dfrac{x^2}{18}-\dfrac{y^2}{4}=1\ (3\sqrt2\le x\le9)$ 위의 점 P에 반사되어 직진한다. 이때, 직선 $l$은 단면이 쌍곡선 모양인 거울 $\dfrac{x^2}{18}-\dfrac{y^2}{4}=1$ 위의 점 P에서의 접선이고, 빛이 점 P에서 반사되기 전과 후 직선 $l$과 이루는 각의 크기 $\alpha$와 $\beta$는 같다. 다음 물음에 답하시오.
  [그림: 포물선 $y^2=4x$ 위에 F(1,0)에서 G(2,2√2)로 가는 선분, G에서 오른쪽으로 $x$축에 평행하게 P까지 가는 빛(중간 생략 표시). P는 쌍곡선 $\dfrac{x^2}{18}-\dfrac{y^2}{4}=1$의 오른쪽 가지 위의 점이며, P에서의 접선 $l$(점선, 오른쪽 위로 올라감)과 반사된 빛의 반직선 $m$(오른쪽 위). 들어오는 빛과 $l$ 사이의 각 $\alpha$, $m$과 $l$ 사이의 각 $\beta$, $l$이 $x$축과 이루는 예각 $\gamma$, $m$의 연장선이 $x$축과 이루는 예각 $\delta$가 표시되어 있다.]

subparts:
- id: '1'
  stem: |
    직선 $l$의 $x$절편을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\sqrt6', equivalents: ['√6'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 반사 후 빛은 $y=2\sqrt2$를 따라가므로 $P(3\sqrt6,2\sqrt2)$, 접선 $\dfrac{\sqrt6x}{6}-\dfrac{\sqrt2y}{2}=1$.
    steps:
    - {id: 1a, content: '$y=0$ 대입 → $x=\sqrt6$', criteria: [1.A2]}
    hint_ladder:
    - 초점에서 나온 빛이 포물선에 반사되면 어느 방향으로 가는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.29
    steps:
    - id: 1b-1
      content: |
        F(1,0)은 포물선 $y^2=4x$의 초점(제시문 【가】)이고, 제시문 【나】의 성질을 거꾸로 적용하면 초점에서 나와 G에서 반사된 빛은 축($x$축)과 평행하게, 즉 직선 $y=2\sqrt2$를 따라 진행한다.
        $\dfrac{x^2}{18}-\dfrac{8}{4}=1$에서 $x^2=54$, $3\sqrt2\le x\le9$이므로 $x=3\sqrt6$. 따라서 $\mathrm{P}(3\sqrt6,\ 2\sqrt2)$.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        제시문 【다】에 의해 P에서의 접선 $l$은 $\dfrac{3\sqrt6\,x}{18}-\dfrac{2\sqrt2\,y}{4}=1$이고, $y=0$을 대입하면 $x=\dfrac{18}{3\sqrt6}=\sqrt6$. 따라서 $l$의 $x$절편은 $\sqrt6$이다.
      criteria: [1.M2, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 제시문 【나】(포물선의 반사 성질)를 근거로 G에서 반사된 빛이 $x$축에 평행($y=2\sqrt2$)하다고 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $\mathrm{P}(3\sqrt6,\ 2\sqrt2)$를 적었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 제시문 【다】의 접선 공식에 P의 좌표를 넣은 식을 적었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $x$절편 $\sqrt6$을 적었다.
      depends_on: [1.M2]
      steps: [1a, 1b-2]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-2302}
  misconceptions:
  - id: MC-GEO-2302
    outcome_code: '70'
    wrong_work: '접선을 $\dfrac{x_1x}{18}+\dfrac{y_1y}{4}=1$로 써서 $x$절편은 같으나 기울기가 음수가 됨'
    detect_cue: 접선 식의 $y$항 부호가 $+$이거나 (2)에서 기울기가 음수
    feedback: 쌍곡선의 접선은 $\dfrac{x_1x}{a^2}-\dfrac{y_1y}{b^2}=1$로, 원래 식의 부호를 그대로 따릅니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    직선 $l$과 $x$축이 이루는 예각 $\gamma$의 크기를 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{\pi}{6}', equivalents: ['30°'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $l$의 기울기 $\dfrac{1}{\sqrt3}=\tan\gamma$.
    steps:
    - {id: 2a, content: '$\tan\gamma=\dfrac{1}{\sqrt3}$ → $\gamma=\dfrac{\pi}{6}$', criteria: [2.A1]}
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.29
    steps:
    - id: 2b-1
      content: |
        (1)의 접선을 정리하면 $\dfrac{\sqrt6}{6}x-\dfrac{\sqrt2}{2}y=1$, 즉 $y=\dfrac{1}{\sqrt3}x-\sqrt2$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        기울기가 양수이므로 $l$이 $x$축과 이루는 예각 $\gamma$에 대해 $\tan\gamma=\dfrac{1}{\sqrt3}$이고, $0<\gamma<\dfrac{\pi}{2}$이므로 $\gamma=\dfrac{\pi}{6}$이다.
      criteria: [2.R1, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: 접선 $l$을 $y=\dfrac{1}{\sqrt3}x-\sqrt2$(기울기 $\dfrac{1}{\sqrt3}$) 꼴로 적었다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: 기울기가 $\tan\gamma$와 같다는 근거(예각 범위 포함)를 적었다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $\gamma=\dfrac{\pi}{6}$을 적었다.
      depends_on: [2.M1, 2.R1]
      steps: [2a, 2b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-2303}
  misconceptions:
  - id: MC-GEO-2303
    outcome_code: '70'
    wrong_work: '$\tan\gamma=\sqrt3$으로 보아 $\gamma=\dfrac{\pi}{3}$이라 답함'
    detect_cue: (2)의 답이 $\dfrac{\pi}{3}$
    feedback: 직선 $y=mx+n$이 $x$축의 양의 방향과 이루는 각 $\theta$는 $\tan\theta=m$입니다. 역수는 $y$축과 이루는 각에 해당합니다.
    remedy: [RL-2]
- id: '3'
  stem: |
    반사된 후 빛이 지나가는 반직선의 연장선 $m$이 $x$축과 이루는 예각 $\delta$의 크기를 구하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '\dfrac{\pi}{3}', equivalents: ['60°'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 입사광이 $x$축에 평행하므로 $\alpha=\gamma$, $\beta=\alpha$, $\delta=\beta+\gamma$.
    steps:
    - {id: 3a, content: '$\delta=\dfrac{\pi}{6}+\dfrac{\pi}{6}=\dfrac{\pi}{3}$', criteria: [3.A1]}
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.29
    steps:
    - id: 3b-1
      content: |
        점 P에 반사되기 전 빛의 진행 방향은 $x$축과 평행하므로, 이 빛과 접선 $l$이 이루는 각 $\alpha$는 $l$이 $x$축과 이루는 각 $\gamma$와 엇각으로 같다. 즉 $\alpha=\gamma=\dfrac{\pi}{6}$.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        입사각과 반사각의 크기가 같으므로(제시문 【나】, 논제 조건) $\beta=\alpha=\dfrac{\pi}{6}$. 또 반사되기 전 빛과 $x$축이 평행하므로 $m$이 $x$축과 이루는 각 $\delta$는 $m$이 반사 전 빛의 방향과 이루는 각 $\beta+\gamma$와 동위각으로 같다.
      criteria: [3.R1]
    - id: 3b-3
      content: |
        따라서 $\delta=\beta+\gamma=\dfrac{\pi}{6}+\dfrac{\pi}{6}=\dfrac{\pi}{3}$.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: 반사 전 빛이 $x$축에 평행함을 근거로 $\alpha=\gamma$(엇각)를 적었다.
      depends_on: []
      ft: {allowed: true, from: [2.A1], max_points: 4}
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: $\beta=\alpha$(입사각=반사각)와 $\delta=\beta+\gamma$(동위각)의 근거를 적었다.
      depends_on: []
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: $\delta=\dfrac{\pi}{3}$을 적었다.
      depends_on: [3.M1, 3.R1]
      steps: [3a, 3b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-2304}
