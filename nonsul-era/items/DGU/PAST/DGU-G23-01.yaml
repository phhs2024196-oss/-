    wrong_work: '$\delta=\beta=\dfrac{\pi}{6}$으로 답하거나 $\delta=\beta-\gamma=0$으로 각을 잘못 더함'
    detect_cue: (3)의 답이 $\dfrac{\pi}{6}$ 또는 $0$
    feedback: $m$과 $x$축 사이의 각은 $m$과 접선 사이의 각 $\beta$에 접선과 $x$축(입사광과 평행) 사이의 각 $\gamma$를 더한 것입니다. 그림에서 각의 위치를 확인하세요.
    remedy: [RL-3]

