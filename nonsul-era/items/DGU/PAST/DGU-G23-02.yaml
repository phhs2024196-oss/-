stimuli:
- label: 가
  body: |
    이산확률변수 $X$의 확률질량함수가 $\mathrm{P}(X=x_i)=p_i\ (i=1,2,3,\cdots,n)$일 때, $X$의 기댓값(평균)과 분산은 다음과 같이 정의된다.
    ① 기댓값(평균) $\mathrm{E}(X)=x_1p_1+x_2p_2+\cdots+x_np_n$
    ② 분산 $\mathrm{V}(X)=\mathrm{E}((X-m)^2)=(x_1-m)^2p_1+(x_2-m)^2p_2+\cdots+(x_n-m)^2p_n$
    (단, $m=\mathrm{E}(X)$)
    위 분산은 다음과 같은 방법으로도 간단하게 구할 수 있다.
    $$\mathrm{V}(X)=\mathrm{E}(X^2)-\{\mathrm{E}(X)\}^2=(x_1^2p_1+x_2^2p_2+\cdots+x_n^2p_n)-m^2$$
    -『고등학교 확률과 통계』
- label: 나
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속일 때
    $$\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x=\int_a^bf(x)\,dx\ \left(\text{단, }\Delta x=\dfrac{b-a}{n},\ x_k=a+k\Delta x\right)$$
    -『고등학교 미적분』
- label: 다
  body: |
    두 수열 $\{a_n\}$, $\{b_n\}$이 $\displaystyle\lim_{n\to\infty}a_n=L$, $\displaystyle\lim_{n\to\infty}b_n=M$ ($L$, $M$은 실수)일 때
    ① $\displaystyle\lim_{n\to\infty}ca_n=cL$, (단, $c$는 상수)
    ② $\displaystyle\lim_{n\to\infty}(a_n+b_n)=L+M$
    ③ $\displaystyle\lim_{n\to\infty}(a_n-b_n)=L-M$
    ④ $\displaystyle\lim_{n\to\infty}(a_nb_n)=LM$
    ⑤ $\displaystyle\lim_{n\to\infty}\dfrac{a_n}{b_n}=\dfrac{L}{M}$ (단, $b_n\neq0$, $M\neq0$)
    -『고등학교 미적분』

stem: |
  이산확률변수 $X$의 확률질량함수 $\mathrm{P}(X)$가 다음과 같이 정의되었다고 가정할 때, $\displaystyle\lim_{n\to\infty}\mathrm{E}(X)$와 $\displaystyle\lim_{n\to\infty}\mathrm{V}(X)$를 구하시오.

  ① $\mathrm{P}(X=x_i)=\dfrac{g(x_i)}{\displaystyle\sum_{j=1}^{n}g(x_j)}\quad(i=1,2,3,\cdots,n)$
  ② $g(x)=e^{-ax}$ (단, $e=\displaystyle\lim_{x\to0}(1+x)^{\frac1x}$이다. $a$는 상수이고, $a>0$이다.)
  ③ $\Delta x=\dfrac1n$, $x_i=i\Delta x\quad(i=1,2,3,\cdots,n)$

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{n\to\infty}\mathrm{E}(X)$와 $\displaystyle\lim_{n\to\infty}\mathrm{V}(X)$를 구하시오.
  points: 30
  depends_on: []
  answer: {kind: expression, value: '\lim\mathrm{E}(X)=\dfrac1a-\dfrac{e^{-a}}{1-e^{-a}},\ \lim\mathrm{V}(X)=\dfrac{1}{a^2}-\dfrac{e^{-a}}{(1-e^{-a})^2}', equivalents: ['1/a − 1/(e^a − 1), 1/a^2 − e^a/(e^a − 1)^2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 극한은 밀도 $\dfrac{e^{-ax}}{\int_0^1e^{-ax}dx}$에 대한 $x$, $x^2$의 정적분 평균이다.
    steps:
    - {id: 1a, content: '$\lim\mathrm{E}(X)=\dfrac{\int_0^1xe^{-ax}dx}{\int_0^1e^{-ax}dx}=\dfrac1a-\dfrac{e^{-a}}{1-e^{-a}}$, $\lim\mathrm{V}(X)=\dfrac{1}{a^2}-\dfrac{e^{-a}}{(1-e^{-a})^2}$', criteria: [1.A1, 1.A3]}
    hint_ladder:
    - $\mathrm{E}(X)$의 분자와 분모에 같은 $\Delta x$를 곱해 보자.
    - $\int_0^1x^ke^{-ax}dx$는 부분적분으로 구한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.30~31
    steps:
    - id: 1b-1
      content: |
        제시문 【가】에 의해 $\mathrm{E}(X)=\displaystyle\sum_{i=1}^{n}x_i\mathrm{P}(X=x_i)=\dfrac{\sum_{i=1}^{n}x_ig(x_i)}{\sum_{j=1}^{n}g(x_j)}$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        연속함수 $h(x)=xg(x)$와 $g(x)$에 제시문 【나】를 적용하면 ($a=0$, $b=1$)
        $\displaystyle\lim_{n\to\infty}\sum_{i=1}^{n}h(x_i)\Delta x=\int_0^1xe^{-ax}dx$, $\displaystyle\lim_{n\to\infty}\sum_{j=1}^{n}g(x_j)\Delta x=\int_0^1e^{-ax}dx$.
        두 정적분은 $[0,1]$에서 $h(x)\ge0$, $g(x)>0$인 함수의 그래프와 $x$축, $x=0$, $x=1$로 둘러싸인 넓이이므로 모두 양수이다.
      criteria: [1.M2, 1.R1]
    - id: 1b-3
      content: |
        분자·분모에 $\Delta x$를 곱하고 제시문 【다】⑤를 쓰면
        $\displaystyle\lim_{n\to\infty}\mathrm{E}(X)=\dfrac{\int_0^1xe^{-ax}dx}{\int_0^1e^{-ax}dx}=\dfrac{\int_0^1axe^{-ax}dx}{1-e^{-a}}$.
        부분적분하면 $\displaystyle\int_0^1axe^{-ax}dx=\left[-xe^{-ax}\right]_0^1+\int_0^1e^{-ax}dx=-e^{-a}-\dfrac1a(e^{-a}-1)$이므로
        $\displaystyle\lim_{n\to\infty}\mathrm{E}(X)=\dfrac{1}{1-e^{-a}}\left\{-e^{-a}-\dfrac1a(e^{-a}-1)\right\}=\dfrac1a-\dfrac{e^{-a}}{1-e^{-a}}$.
      criteria: [1.M3, 1.A1]
    - id: 1b-4
      content: |
        제시문 【가】에 의해 $\mathrm{V}(X)=\mathrm{E}(X^2)-\{\mathrm{E}(X)\}^2$이고 $\mathrm{E}(X^2)=\dfrac{\sum x_i^2g(x_i)}{\sum g(x_j)}$. 같은 방법으로 $f(x)=x^2g(x)$에 【나】를 적용하면
        $\displaystyle\lim_{n\to\infty}\mathrm{E}(X^2)=\dfrac{\int_0^1ax^2e^{-ax}dx}{1-e^{-a}}$.
      criteria: [1.M4]
    - id: 1b-5
      content: |
        부분적분하면 $\displaystyle\int_0^1ax^2e^{-ax}dx=\left[-x^2e^{-ax}\right]_0^1+\int_0^12xe^{-ax}dx=-e^{-a}+\dfrac2a\left\{\dfrac1a-\dfrac{e^{-a}}{1-e^{-a}}\right\}(1-e^{-a})$ 이므로
        $\displaystyle\lim_{n\to\infty}\mathrm{E}(X^2)=-\dfrac{e^{-a}}{1-e^{-a}}+\dfrac2a\left\{\dfrac1a-\dfrac{e^{-a}}{1-e^{-a}}\right\}$.
      criteria: [1.A2]
    - id: 1b-6
      content: |
        제시문 【다】④로 $\displaystyle\lim\{\mathrm{E}(X)\}^2=\left\{\dfrac1a-\dfrac{e^{-a}}{1-e^{-a}}\right\}^2$이고, 【다】③에 의해
        $\displaystyle\lim_{n\to\infty}\mathrm{V}(X)=-\dfrac{e^{-a}}{1-e^{-a}}+\dfrac2a\left\{\dfrac1a-\dfrac{e^{-a}}{1-e^{-a}}\right\}-\left\{\dfrac1a-\dfrac{e^{-a}}{1-e^{-a}}\right\}^2=\dfrac{1}{a^2}-\dfrac{e^{-a}}{1-e^{-a}}\left\{1+\dfrac{e^{-a}}{1-e^{-a}}\right\}=\dfrac{1}{a^2}-\dfrac{e^{-a}}{(1-e^{-a})^2}$.
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 제시문 【가】로 $\mathrm{E}(X)$를 $\dfrac{\sum x_ig(x_i)}{\sum g(x_j)}$ 꼴로 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 분자·분모에 $\Delta x$를 곱해 【나】로 각각 $\int_0^1xe^{-ax}dx$, $\int_0^1e^{-ax}dx$에 수렴함을 적었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: 분모의 극한(정적분)이 양수(0이 아님)임을 밝히고 【다】⑤를 적용했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: $\int_0^1xe^{-ax}dx$를 부분적분하는 식이 있다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $\displaystyle\lim\mathrm{E}(X)=\dfrac1a-\dfrac{e^{-a}}{1-e^{-a}}$(또는 동치)를 적었다.
      depends_on: [1.M2, 1.M3]
      steps: [1a, 1b-3]
    - id: 1.M4
      mark_type: M
      points: 3
      evidence: $\mathrm{V}(X)=\mathrm{E}(X^2)-\{\mathrm{E}(X)\}^2$와 $\lim\mathrm{E}(X^2)=\dfrac{\int_0^1x^2e^{-ax}dx}{\int_0^1e^{-ax}dx}$를 적었다.
      depends_on: []
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: $\lim\mathrm{E}(X^2)=-\dfrac{e^{-a}}{1-e^{-a}}+\dfrac2a\left(\dfrac1a-\dfrac{e^{-a}}{1-e^{-a}}\right)$(또는 동치)를 적었다.
      depends_on: [1.M4]
      steps: [1b-5]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: $\displaystyle\lim\mathrm{V}(X)=\dfrac{1}{a^2}-\dfrac{e^{-a}}{(1-e^{-a})^2}$(또는 동치)를 적었다.
      depends_on: [1.M4]
      steps: [1a, 1b-6]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2202}
  misconceptions:
  - id: MC-CAL-2202
    outcome_code: '70'
    wrong_work: '분자 $\sum x_ig(x_i)$만 $\int_0^1xe^{-ax}dx$로 바꾸고 분모 $\sum g(x_j)$는 그대로 두거나, $\Delta x$ 없이 $\lim\sum f(x_i)=\int f$로 써서 $n$배 차이가 남'
    detect_cue: 극한값에 $n$이 남거나 0 또는 발산으로 답함
    feedback: 리만 합은 $\sum f(x_k)\Delta x$ 꼴이어야 정적분으로 바뀝니다. 분자와 분모에 같은 $\Delta x$를 곱하면 값은 그대로이면서 둘 다 리만 합이 됩니다.
    remedy: [RL-1]

