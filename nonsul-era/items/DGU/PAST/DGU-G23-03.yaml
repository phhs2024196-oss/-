stimuli:
- label: 가
  body: |
    급수 $\displaystyle\sum_{n=1}^{\infty}a_n$의 부분합으로 이루어진 수열 $\{S_n\}$이 일정한 값 $S$에 수렴할 때, 즉
    $$\lim_{n\to\infty}S_n=\lim_{n\to\infty}\sum_{k=1}^{n}a_k=S$$
    일 때, 이 급수는 $S$에 수렴한다고 하고 $\displaystyle\sum_{n=1}^{\infty}a_n=S$와 같이 나타낸다.
    -『고등학교 미적분』
- label: 나
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(x)\ge0$일 때, 정적분
    $$\int_a^bf(x)\,dx$$
    는 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이와 같다.
    -『고등학교 수학Ⅱ』
- label: 다
  body: |
    좌표평면 위를 움직이는 점 P의 시각 $t$에서의 위치가 $x=x(t)$, $y=y(t)$일 때, 점 P의 시각 $t$에서의 속도는 $(x'(t),\ y'(t))$이고 가속도는 $(x''(t),\ y''(t))$이다.
    -『고등학교 미적분』
- label: 라
  body: |
    닫힌구간 $[a,b]$의 임의의 점 $x$에서 $x$축에 수직인 평면으로 자른 단면의 넓이가 $S(x)$인 입체도형의 부피 $V$는
    $$V=\int_a^bS(x)\,dx$$
    이다. 단, $S(x)$는 닫힌구간 $[a,b]$에서 연속인 함수이다.
    -『고등학교 미적분』

stem: |
  시각 $t=0$일 때 좌표평면 상의 원점 O에서 $(a,\ b)$의 속도로 쏘아올린 물체 M은 다음과 같은 규칙에 따라 움직인다. (단, $a$와 $b$는 상수이고, $a>0$, $b>0$이다.)
  ■ M은 크기를 무시할 수 있을 만큼 아주 작으며, 시각 $t$에서 M의 위치가 함수 $x=x(t)$, $y=y(t)$로 나타내어질 때 항상 $x(t)\ge0$, $y(t)\ge0$이다.
  ■ $y(t)>0$인 시각 $t>0$에서는 항상 M의 가속도는 $(0,\ -g)$이다. (단, $g$는 상수이고, $g>0$이다.)
  ■ M이 $x$축에 충돌하는 시각을 순서대로 $t=t_1,\ t_2,\ \cdots$ $(0<t_1<t_2<\cdots)$라 할 때, 각각의 충돌 시각 $t=t_n$에 대해 충돌 전후 M의 속도의 $x$성분은 변화가 없고, 충돌 직후 M의 속도의 $y$성분은 충돌 직전 M의 속도의 $y$성분의 $-\dfrac12$배이다.

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{n\to\infty}t_n$의 값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '\dfrac{4b}{g}', equivalents: ['4b/g'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $k$번째 아치의 초기 $y$속도 $\dfrac{b}{2^{k-1}}$, 체공시간 $\dfrac{2b}{g}\left(\dfrac12\right)^{k-1}$.
    steps:
    - {id: 1a, content: '$\displaystyle\lim t_n=\dfrac{2b/g}{1-\frac12}=\dfrac{4b}{g}$', criteria: [1.A1]}
    hint_ladder:
    - 첫 충돌까지의 시간과 충돌 직전의 $y$속도를 구해 보자.
    - 다음 아치는 초기 $y$속도만 바뀐 같은 운동이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.32
    steps:
    - id: 1b-1
      content: |
        $t=0$에서 속도의 $x$성분은 $a$이고, $y(t)>0$인 $t>0$에서 $x''(t)=0$(제시문 【다】)이므로 $0\le t\le t_1$에서 $x'(t)=a$. 충돌 전후 $x$성분은 변하지 않으므로 $t_1\le t\le t_2$에서도 $x'(t)=a$이고, 이를 반복하면 모든 $t\ge0$에서 $x'(t)=a$, 즉 $x(t)=at$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $t=0$에서 $y$성분은 $b$이고 $y''(t)=-g$이므로 $0\le t\le t_1$에서 $y'(t)=b-gt$, $y(t)=bt-\dfrac12gt^2$. $y(t_1)=0$에서 $t_1=\dfrac{2b}{g}$이고, 충돌 직전 속도의 $y$성분은 $\displaystyle\lim_{t\to t_1-}y'(t)=-b$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        충돌 직후 $y$성분은 $-\dfrac12\times(-b)=\dfrac b2$이므로 같은 방법으로 $t_2-t_1=\dfrac{b}{g}$, 다음은 $t_3-t_2=\dfrac{b}{2g}$, $\cdots$. 귀납적으로 $t_1,\ t_2-t_1,\ t_3-t_2,\ \cdots$는 첫째항 $\dfrac{2b}{g}$, 공비 $\dfrac12$인 등비수열이다.
      criteria: [1.M3]
    - id: 1b-4
      content: |
        제시문 【가】에 의해 $\displaystyle\lim_{n\to\infty}t_n=\dfrac{2b}{g}+\dfrac{b}{g}+\dfrac{b}{2g}+\cdots=\dfrac{2b}{g}\cdot\dfrac{1}{1-\frac12}=\dfrac{4b}{g}$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $x$성분 속도가 항상 $a$임(충돌에서도 불변)을 근거와 함께 적어 $x(t)=at$를 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 첫 구간에서 $y(t)=bt-\dfrac12gt^2$, $t_1=\dfrac{2b}{g}$, 충돌 직전 $y$속도 $-b$를 적었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: 충돌 간격이 공비 $\dfrac12$인 등비수열임을 (귀납적으로) 밝혔다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $\displaystyle\lim_{n\to\infty}t_n=\dfrac{4b}{g}$를 적었다.
      depends_on: [1.M3]
      steps: [1a, 1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-2301}
  misconceptions:
  - id: MC-ALG-2301
    outcome_code: '70'
    wrong_work: '충돌이 무한 번 일어나므로 $\lim t_n=\infty$라고 답함'
    detect_cue: (1)의 답이 $\infty$ 또는 "발산"
    feedback: 간격이 공비 $\dfrac12$로 줄어드는 등비수열이면 무한히 더해도 유한한 값에 수렴합니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    M이 그리는 곡선과 $x$축으로 둘러싸인 도형의 넓이를 구하시오.
  points: 14
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{16ab^3}{21g^2}', equivalents: ['16ab^3/(21g^2)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 다음 아치는 폭 $\dfrac12$배, 높이 $\dfrac14$배인 닮은 포물선이므로 넓이 $\dfrac18$배.
    steps:
    - {id: 2a, content: '$A_1=\dfrac{2ab^3}{3g^2}$, 합 $=A_1\cdot\dfrac{1}{1-\frac18}=\dfrac{16ab^3}{21g^2}$', criteria: [2.A2]}
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.32
    steps:
    - id: 2b-1
      content: |
        (1)에서 $0\le t\le t_1$일 때 $x=at$, $y=bt-\dfrac12gt^2$. $t=\dfrac{x}{a}$를 대입하면 이 구간의 곡선은 $y=\dfrac bax-\dfrac{g}{2a^2}x^2\ \left(0\le x\le\dfrac{2ab}{g}\right)$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        제시문 【나】에 의해 첫 번째 도형의 넓이는
        $A_1=\displaystyle\int_0^{\frac{2ab}{g}}\left(\dfrac bax-\dfrac{g}{2a^2}x^2\right)dx=\left[\dfrac{b}{2a}x^2-\dfrac{g}{6a^2}x^3\right]_0^{\frac{2ab}{g}}=\dfrac{2ab^3}{3g^2}$.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        $t_1\le t\le t_2$에서는 초기 $y$속도 $b$ 대신 $\dfrac b2$인 같은 운동이므로, 위 계산에서 $b$를 $\dfrac b2$로 바꾸면 $A_2=\dfrac18\cdot\dfrac{2ab^3}{3g^2}$, 같은 방법으로 $A_3=\dfrac{1}{8^2}\cdot\dfrac{2ab^3}{3g^2}$, $\cdots$. 귀납적으로 $\{A_n\}$은 첫째항 $\dfrac{2ab^3}{3g^2}$, 공비 $\dfrac18$인 등비수열이다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        따라서 구하는 넓이는 $\displaystyle\sum_{n=1}^{\infty}A_n=\dfrac{2ab^3}{3g^2}\cdot\dfrac{1}{1-\frac18}=\dfrac{16ab^3}{21g^2}$.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: 첫 아치의 곡선 $y=\dfrac bax-\dfrac{g}{2a^2}x^2$와 범위 $0\le x\le\dfrac{2ab}{g}$를 적었다.
      depends_on: []
      ft: {allowed: true, from: [1.M2], max_points: 4}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $A_1=\dfrac{2ab^3}{3g^2}$을 정적분(【나】)으로 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: 이후 아치의 넓이가 공비 $\dfrac18$인 등비수열임을 근거($b\to\dfrac b2$ 대입 등)와 함께 적었다.
      depends_on: []
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: 넓이 $\dfrac{16ab^3}{21g^2}$을 적었다.
      depends_on: [2.M2]
      steps: [2a, 2b-4]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2302}
  misconceptions:
  - id: MC-CAL-2302
    outcome_code: '70'
    wrong_work: '넓이의 공비를 $\dfrac12$ 또는 $\dfrac14$로 보아 $\dfrac{4ab^3}{3g^2}$, $\dfrac{8ab^3}{9g^2}$ 등을 얻음'
    detect_cue: (2)의 답의 계수가 $\dfrac43$ 또는 $\dfrac89$
    feedback: 초기 $y$속도가 $\dfrac12$배이면 체공시간(가로 폭)은 $\dfrac12$배, 최고 높이는 $\dfrac14$배이므로 넓이는 $\dfrac18$배입니다.
    remedy: [RL-2]
- id: '3'
  stem: |
    위 (2)번에서 기술한 도형을 밑면으로 하고 $x$축에 수직인 평면으로 자른 단면이 모두 정사각형인 입체도형의 부피를 구하시오.
  points: 14
  depends_on: ['2']
  answer: {kind: value, value: '\dfrac{128ab^5}{465g^3}', equivalents: ['128ab^5/(465g^3)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 단면 넓이는 $y^2$이므로 폭 $\dfrac12$배·높이 $\dfrac14$배에서 부피는 $\dfrac12\cdot\dfrac1{16}=\dfrac1{32}$배.
    steps:
    - {id: 3a, content: '$V_1=\dfrac{4ab^5}{15g^3}$, 합 $=V_1\cdot\dfrac{32}{31}=\dfrac{128ab^5}{465g^3}$', criteria: [3.A2]}
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.33
    steps:
    - id: 3b-1
      content: |
        (2)에서 $0\le t\le t_1$인 동안의 곡선은 $y=\dfrac bax-\dfrac{g}{2a^2}x^2\ \left(0\le x\le\dfrac{2ab}{g}\right)$이다. 이 곡선과 $x$축으로 둘러싸인 도형을 밑면으로 하는 정사각형 단면 입체의 부피는 제시문 【라】에 의해
        $V_1=\displaystyle\int_0^{\frac{2ab}{g}}\left(\dfrac bax-\dfrac{g}{2a^2}x^2\right)^2dx$.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $V_1=\left[\dfrac{g^2}{20a^4}x^5-\dfrac{bg}{4a^3}x^4+\dfrac{b^2}{3a^2}x^3\right]_0^{\frac{2ab}{g}}=\dfrac{4ab^5}{15g^3}$.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        같은 방법으로($b\to\dfrac b2$) $V_2=\dfrac{1}{32}\cdot\dfrac{4ab^5}{15g^3}$, $V_3=\dfrac{1}{32^2}\cdot\dfrac{4ab^5}{15g^3}$, $\cdots$. 귀납적으로 $\{V_n\}$은 첫째항 $\dfrac{4ab^5}{15g^3}$, 공비 $\dfrac1{32}$인 등비수열이다.
      criteria: [3.M2]
    - id: 3b-4
      content: |
        따라서 부피는 $\displaystyle\sum_{n=1}^{\infty}V_n=\dfrac{4ab^5}{15g^3}\cdot\dfrac{1}{1-\frac1{32}}=\dfrac{128ab^5}{465g^3}$.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
