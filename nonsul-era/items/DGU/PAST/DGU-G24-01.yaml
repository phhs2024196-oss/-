stimuli:
- label: 가
  body: |
    두 초점 $\mathrm{F}(c,0)$, $\mathrm{F}'(-c,0)$으로부터의 거리의 합이 $2a$인 타원의 방정식은
    $$\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1\ (\text{단, }a>c>0,\ b^2=a^2-c^2)$$
    이다. 타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$을 $x$축의 방향으로 $m$만큼, $y$축의 방향으로 $n$만큼 평행이동하면 타원의 방정식은
    $$\dfrac{(x-m)^2}{a^2}+\dfrac{(y-n)^2}{b^2}=1$$
    이다. 이때 타원의 초점, 꼭짓점은 각각 다음과 같다.
    [표: 타원의 방정식 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ → ($x$축의 방향으로 $m$만큼, $y$축의 방향으로 $n$만큼 평행이동) → 타원의 방정식 $\dfrac{(x-m)^2}{a^2}+\dfrac{(y-n)^2}{b^2}=1$]
    초점의 좌표: $(c,0)$, $(-c,0)$ → $(c+m,n)$, $(-c+m,n)$
    꼭짓점의 좌표: $(a,0)$, $(-a,0)$, $(0,b)$, $(0,-b)$ → $(a+m,n)$, $(-a+m,n)$, $(m,b+n)$, $(m,-b+n)$
    『고등학교 기하』
- label: 나
  body: |
    초점이 $\mathrm{F}(p,0)$이고 준선이 $x=-p$인 포물선 $y^2=4px$를 $x$축의 방향으로 $m$만큼, $y$축의 방향으로 $n$만큼 평행이동한 포물선의 방정식은 다음과 같다.
    $$(y-n)^2=4p(x-m)$$
    이때 포물선의 초점의 좌표는 $(p+m,n)$, 준선의 방정식은 $x=-p+m$이다.
    『고등학교 기하』
- label: 다
  body: |
    두 초점 $\mathrm{F}(c,0)$, $\mathrm{F}'(-c,0)$으로부터의 거리의 차가 $2a$인 쌍곡선의 방정식은 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$ (단, $c>a>0$, $b^2=c^2-a^2$)이다. 쌍곡선 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$을 $x$축의 방향으로 $m$만큼, $y$축의 방향으로 $n$만큼 평행이동하면 쌍곡선의 방정식은
    $$\dfrac{(x-m)^2}{a^2}-\dfrac{(y-n)^2}{b^2}=1$$
    이다. 이때 중심, 꼭짓점, 초점, 점근선은 각각 다음과 같다.
    [표: 쌍곡선의 방정식 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$ → ($x$축의 방향으로 $m$만큼, $y$축의 방향으로 $n$만큼 평행이동) → 쌍곡선의 방정식 $\dfrac{(x-m)^2}{a^2}-\dfrac{(y-n)^2}{b^2}=1$]
    중심의 좌표: $(0,0)$ → $(m,n)$
    꼭짓점의 좌표: $(a,0)$, $(-a,0)$ → $(a+m,n)$, $(-a+m,n)$
    초점의 좌표: $(c,0)$, $(-c,0)$ → $(c+m,n)$, $(-c+m,n)$
    점근선의 방정식: $y=\pm\dfrac{b}{a}x$ → $y-n=\pm\dfrac{b}{a}(x-m)$
    『고등학교 기하』

stem: |
  다음 방정식에 대하여 물음에 답하시오. (단, $k$는 실수이다.)
  $$x^2+y^2=(kx+1)^2$$

subparts:
- id: '1'
  stem: |
    $k=0$이면 주어진 방정식은 원의 방정식이다. 이 원의 중심과 반지름을 각각 구하시오.
  points: 6
  depends_on: []
  answer: {kind: value, value: '중심 (0,0), 반지름 1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $k=0$이면 $x^2+y^2=1$.
    steps:
    - {id: 1a, content: '중심 $(0,0)$, 반지름 $1$', criteria: [1.A1]}
    hint_ladder:
    - $k=0$을 대입해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.23
    steps:
    - id: 1b-1
      content: |
        $k=0$이면 우변은 $(0\cdot x+1)^2=1$이므로 주어진 방정식은 $x^2+y^2=1$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 중심이 $(0,0)$이고 반지름이 $1$인 원이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $k=0$을 대입해 $x^2+y^2=1$을 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 중심 $(0,0)$, 반지름 $1$을 모두 적었다.
      depends_on: [1.M1]
      steps: [1a, 1b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-2207}
  misconceptions:
  - id: MC-GEO-2207
    outcome_code: '70'
    wrong_work: '우변의 $+1$을 평행이동으로 오해해 중심을 $(1,0)$ 또는 $(-1,0)$으로 씀'
    detect_cue: 중심이 원점이 아니다
    feedback: $k=0$을 넣으면 우변은 상수 1뿐입니다. $(x-m)^2+(y-n)^2=r^2$ 꼴과 비교해 중심을 읽으세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    $k=\dfrac12$이면 주어진 방정식은 타원의 방정식이다. 이 타원의 초점의 좌표와 꼭짓점의 좌표를 각각 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '초점 \left(\dfrac43,0\right),\ (0,0);\ 꼭짓점 (2,0),\ \left(-\dfrac23,0\right),\ \left(\dfrac23,\dfrac{2\sqrt3}{3}\right),\ \left(\dfrac23,-\dfrac{2\sqrt3}{3}\right)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\dfrac{\left(x-\dfrac23\right)^2}{\dfrac{16}{9}}+\dfrac{y^2}{\dfrac43}=1$, $a=\dfrac43$, $b=\dfrac{2\sqrt3}{3}$, $c=\dfrac23$, $m=\dfrac23$.'
    steps:
    - {id: 2a, content: '초점 $\left(\pm\dfrac23+\dfrac23,0\right)$, 꼭짓점 $\left(\pm\dfrac43+\dfrac23,0\right)$, $\left(\dfrac23,\pm\dfrac{2\sqrt3}{3}\right)$', criteria: [2.A2]}
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.23
    steps:
    - id: 2b-1
      content: |
        $k=\dfrac12$이면 $x^2+y^2=\left(\dfrac12x+1\right)^2$이므로 $\dfrac34x^2-x+y^2=1$, $\dfrac34\left(x-\dfrac23\right)^2+y^2=\dfrac43$, 즉
        $\dfrac{\left(x-\dfrac23\right)^2}{\dfrac{16}{9}}+\dfrac{y^2}{\dfrac43}=1$.
        따라서 타원 $\dfrac{x^2}{\frac{16}{9}}+\dfrac{y^2}{\frac43}=1$을 $x$축의 양의 방향으로 $\dfrac23$만큼 평행이동한 타원이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        제시문 【가】에서 $a=\dfrac43$, $b=\dfrac{2\sqrt3}{3}$, $c=\sqrt{a^2-b^2}=\dfrac23$.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        표의 평행이동 규칙($m=\dfrac23$, $n=0$)에 의해 초점의 좌표는 $\left(\dfrac43,0\right)$, $(0,0)$이고, 꼭짓점의 좌표는 $(2,0)$, $\left(-\dfrac23,0\right)$, $\left(\dfrac23,\dfrac{2\sqrt3}{3}\right)$, $\left(\dfrac23,-\dfrac{2\sqrt3}{3}\right)$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 완전제곱으로 $\dfrac{\left(x-\frac23\right)^2}{\frac{16}{9}}+\dfrac{y^2}{\frac43}=1$(또는 동치 표준형)을 얻었다.
      depends_on: []
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: $a=\dfrac43$, $b=\dfrac{2\sqrt3}{3}$, $c=\dfrac23$을 적었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: 초점 2개와 꼭짓점 4개의 좌표를 모두 적었다.
      depends_on: [2.M1]
      steps: [2a, 2b-3]
    deductions:
    - code: D2-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-2207}
  - {code: '71', misconception: MC-GEO-2208}
  misconceptions:
  - id: MC-GEO-2207
    outcome_code: '70'
    wrong_work: '$\left(x-\dfrac23\right)^2$을 $x$축의 음의 방향 이동으로 읽어 초점을 $(0,0)$, $\left(-\dfrac43,0\right)$으로 씀'
    detect_cue: 초점·꼭짓점의 $x$좌표가 부호만 반대
    feedback: '$(x-m)^2$ 꼴에서 이동량은 $+m$입니다. $\left(x-\dfrac23\right)^2$이면 오른쪽으로 $\dfrac23$ 이동입니다.'
    remedy: [RL-1]
  - id: MC-GEO-2208
    outcome_code: '71'
    wrong_work: '타원에서 $c=\sqrt{a^2+b^2}=\dfrac{2\sqrt7}{3}$으로 계산'
    detect_cue: 초점 좌표에 $\sqrt7$이 나온다
    feedback: 타원은 $c^2=a^2-b^2$, 쌍곡선은 $c^2=a^2+b^2$입니다(【가】【다】의 조건 비교).
    remedy: [RL-2]
- id: '3'
  stem: |
    $k=1$이면 주어진 방정식은 포물선의 방정식이다. 이 포물선의 초점의 좌표와 준선의 방정식을 각각 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '초점 (0,0),\ 준선 x=-1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$y^2=2\left(x+\dfrac12\right)$, $p=\dfrac12$, $m=-\dfrac12$.'
    steps:
    - {id: 3a, content: '초점 $\left(\dfrac12-\dfrac12,0\right)=(0,0)$, 준선 $x=-\dfrac12-\dfrac12=-1$', criteria: [3.A2]}
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.23
    steps:
    - id: 3b-1
      content: |
        $k=1$이면 $x^2+y^2=(x+1)^2$이므로 $y^2=2x+1=2\left(x+\dfrac12\right)$. 따라서 포물선 $y^2=2x$를 $x$축의 방향으로 $-\dfrac12$만큼 평행이동한 포물선이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        제시문 【나】에서 $4p=2$이므로 $p=\dfrac12$, $m=-\dfrac12$, $n=0$.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        초점의 좌표는 $(p+m,n)=(0,0)$이고 준선의 방정식은 $x=-p+m=-1$이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: $y^2=2\left(x+\dfrac12\right)$ 꼴로 정리했다.
      depends_on: []
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: $p=\dfrac12$, 평행이동량 $m=-\dfrac12$을 적었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 3
      evidence: 초점 $(0,0)$과 준선 $x=-1$을 모두 적었다.
      depends_on: [3.M1]
      steps: [3a, 3b-3]
    deductions:
    - code: D3-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-2209}
  misconceptions:
  - id: MC-GEO-2209
    outcome_code: '70'
    wrong_work: '$y^2=2(\cdots)$에서 $p=2$로 보아 초점을 $\left(\dfrac32,0\right)$, 준선을 $x=-\dfrac52$로 씀'
    detect_cue: 초점이 원점이 아니거나 준선이 $x=-1$이 아니다
    feedback: '$y^2=4px$와 비교하면 $4p=2$, 즉 $p=\dfrac12$입니다.'
    remedy: [RL-3]
- id: '4'
  stem: |
    $k=2$이면 주어진 방정식은 쌍곡선의 방정식이다. 이 쌍곡선의 초점의 좌표와 점근선의 방정식을 각각 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '초점 (0,0),\ \left(-\dfrac43,0\right);\ 점근선 y=\pm\sqrt3\left(x+\dfrac23\right)', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: '$\dfrac{\left(x+\frac23\right)^2}{\frac19}-\dfrac{y^2}{\frac13}=1$, $a=\dfrac13$, $b=\dfrac{\sqrt3}{3}$, $c=\dfrac23$, $m=-\dfrac23$.'
    steps:
    - {id: 4a, content: '초점 $\left(\pm\dfrac23-\dfrac23,0\right)$, 점근선 $y=\pm\dfrac ba\left(x+\dfrac23\right)$', criteria: [4.A2]}
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.23
    steps:
    - id: 4b-1
      content: |
        $k=2$이면 $x^2+y^2=(2x+1)^2$이므로 $3x^2+4x-y^2=-1$, $3\left(x+\dfrac23\right)^2-y^2=\dfrac13$, 즉
        $\dfrac{\left(x+\frac23\right)^2}{\frac19}-\dfrac{y^2}{\frac13}=1$.
        따라서 쌍곡선 $\dfrac{x^2}{\frac19}-\dfrac{y^2}{\frac13}=1$을 $x$축의 방향으로 $-\dfrac23$만큼 평행이동한 쌍곡선이다.
      criteria: [4.M1]
    - id: 4b-2
      content: |
