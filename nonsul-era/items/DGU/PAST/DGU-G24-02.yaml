key_idea: '두 접선의 기울기가 $f''(t)$, $\dfrac{1}{f''(t)}$이므로 $g(t)=\dfrac{(f''(t))^2-1}{2f''(t)}$이고, $x=f(t)$로 치환하면 $\displaystyle\int g(f^{-1}(x))dx=\int\dfrac{(f''(t))^2-1}{2}dt$.'
