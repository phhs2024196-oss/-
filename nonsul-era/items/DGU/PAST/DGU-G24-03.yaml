key_idea: '$\angle\mathrm{QOx}=s(t)$로 두면 $\dfrac{\sin s}{a-\cos s}=\dfrac{\sin t}{a-\cos t}$를 $t$로 미분해 Q가 $(0,1)$일 때 $\left\lvert\dfrac{ds}{dt}\right\rvert=\left\lvert1-a\dfrac{\cos t_0}{\sin t_0}\right\rvert$, 그리고 $\tan\alpha=a$, $t_0+\dfrac{\pi}{2}=2\alpha$로 $\dfrac{\cos t_0}{\sin t_0}=\dfrac{2a}{a^2-1}$.'
stuck: Q의 각 s(t)와 t의 관계식을 세우는 단계, $t_0$를 a로 나타내는 각 관계(이등변삼각형 OPQ)를 찾는 단계
