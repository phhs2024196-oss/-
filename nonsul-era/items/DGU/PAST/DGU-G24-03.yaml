  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2204}
  misconceptions:
  - id: MC-CAL-2204
    outcome_code: '70'
    wrong_work: '범위 $2\le a\le3$을 무시하고 $a\to1^+$에서 속력이 한없이 커진다고 하거나, 오른쪽 끝 $a=3$을 답함'
