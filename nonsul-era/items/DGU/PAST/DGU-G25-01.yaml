    wrong_work: '$k=\dfrac16$을 원래 이차함수에만 넣어 $x^2+\dfrac13\cdot0\cdot x+\dfrac16=0$ 등 $y=x$와 연립하지 않은 식을 풂'
    detect_cue: 교점의 $y$좌표가 $x$좌표와 다르거나 근이 허수
    feedback: 교점은 두 그래프의 공통점입니다. $y=x$와 연립한 식에 $k$를 넣어 푸세요.
    remedy: [RL-1]

