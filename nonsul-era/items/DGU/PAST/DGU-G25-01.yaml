key_idea: '두 교점을 $(\alpha,\alpha)$, $(\beta,\beta)$로 두면 $\overrightarrow{PQ_1}\cdot\overrightarrow{PQ_2}=2\alpha\beta-(\alpha+\beta)+1=\dfrac13$으로 상수가 되고, 크기의 곱은 $\alpha+\beta$, $\alpha\beta$의 대칭식이 되어 $\cos\theta=\dfrac{1}{\sqrt{(6k-1)^2+4}}$.'
stuck: 크기의 곱 $(2\alpha^2-2\alpha+1)(2\beta^2-2\beta+1)$을 $\alpha+\beta$, $\alpha\beta$로 정리하는 단계
