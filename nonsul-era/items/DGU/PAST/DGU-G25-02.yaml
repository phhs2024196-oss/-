key_idea: '$3p(1-p)^2=\dfrac{27}{64}$, $3q(1-q)^2=\dfrac{48}{125}$의 근 중 $p+q<\dfrac12$를 만족하는 쌍은 $\left(\dfrac14,\dfrac15\right)$뿐이고, 이로부터 $\dfrac{23-m}{\sigma}=0.13$, $\dfrac{25-m}{\sigma}=0.84$를 얻는다.'
