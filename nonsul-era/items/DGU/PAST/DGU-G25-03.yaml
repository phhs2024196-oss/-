intent: 대칭식 조건으로 두 곡선을 n의 식으로 결정하고, 교점으로 만든 삼각형의 넓이와 두 곡선 사이의 넓이를 구한 뒤, 급수를 정적분으로 바꾸어 극한을 구하는 능력을 본다.
key_idea: '$(\alpha-\beta)^2=(\alpha+\beta)^2-4\alpha\beta$에 $\alpha\beta=20n(\alpha-\beta)$를 넣으면 $\alpha-\beta=n$이 되어 두 곡선이 $y=x^2-9nx+20n^2$, $y=\dfrac{12n^3}{x}$로 정해지고 교점은 $x=n,2n,6n$.'
stuck: 조건식에서 $\alpha-\beta$에 대한 이차방정식을 만드는 단계, 넓이를 $x=2n$에서 나누어 적분하는 단계
idea_tags: [IDEA-ALG-SYMMETRIC-DIFF-SQUARE, IDEA-CAL-AREA-SPLIT-AT-CROSSING, IDEA-CAL-RIEMANN-SUM-LIMIT]
tags: [두 곡선 사이의 넓이, 구분구적법, 점과 직선 사이의 거리, 동국 실전]
