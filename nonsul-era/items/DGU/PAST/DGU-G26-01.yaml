intent: 정다면체의 이면각을 교선에 수직인 두 반직선(삼수선)으로 잡아 코사인 값을 구하고, 두 이면각의 합이 π임을 이용해 두 평면이 일치함을 논증하는 능력을 본다.
key_idea: '교선의 중점에서 두 면 위로 그은 수선이 이면각을 만든다. 정팔면체의 둔각 이면각 $\alpha$($\cos\alpha=-\frac13$)와 정사면체 이면각 $\gamma$($\cos\gamma=\frac13$)는 $\alpha+\gamma=\pi$.'
