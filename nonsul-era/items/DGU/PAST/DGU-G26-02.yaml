stimuli:
- label: 가
  body: |
    첫째항이 $a$, 공차가 $d$인 등차수열 $a_n$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하면
    $$a_n=a+(n-1)d,$$
    $$S_n=\dfrac{n\{2a+(n-1)d\}}{2}\ (\text{단, }n=1,2,3,\cdots)$$
    『고등학교 수학Ⅰ』
- label: 나
  body: |
    두 수열 $a_n$, $b_n$에 대하여
    ① $\displaystyle\sum_{k=1}^{n}(a_k+b_k)=\sum_{k=1}^{n}a_k+\sum_{k=1}^{n}b_k$　② $\displaystyle\sum_{k=1}^{n}(a_k-b_k)=\sum_{k=1}^{n}a_k-\sum_{k=1}^{n}b_k$
    ③ $\displaystyle\sum_{k=1}^{n}ca_k=c\sum_{k=1}^{n}a_k$ (단, c는 상수)　④ $\displaystyle\sum_{k=1}^{n}c=cn$ (단, c는 상수)
    『고등학교 수학Ⅰ』
- label: 다
  body: |
    두 수열 $a_n$, $b_n$이 $\displaystyle\lim_{n\to\infty}a_n=L$, $\displaystyle\lim_{n\to\infty}b_n=M$ ($L$, $M$은 실수)일 때
    ① $\displaystyle\lim_{n\to\infty}ca_n=cL$ (단, c는 상수)　② $\displaystyle\lim_{n\to\infty}(a_n+b_n)=L+M$
    ③ $\displaystyle\lim_{n\to\infty}(a_n-b_n)=L-M$　④ $\displaystyle\lim_{n\to\infty}a_nb_n=LM$
    ⑤ $\displaystyle\lim_{n\to\infty}\dfrac{a_n}{b_n}=\dfrac{L}{M}$ (단, $b_n\neq0$, $M\neq0$)
    『고등학교 미적분』

stem: |
  공차가 자연수인 두 등차수열 $a_n$, $b_n$이 다음 <조건>을 만족한다.
  <조건>
  ① $\displaystyle\lim_{n\to\infty}\dfrac{a_n-b_n}{n}=2$, $\displaystyle\sum_{n=1}^{10}(a_n-b_n)=180$
  ② $\displaystyle\sum_{k=1}^{n}(a_k+b_k)$는 $n=7$일 때만 최솟값을 갖는다.
  ③ $\displaystyle\sum_{n=1}^{4}\lvert b_n\rvert=88$

subparts:
- id: '1'
  stem: |
    수열 $a_n$과 $b_n$의 일반항을 각각 구하시오.
  points: 12
  depends_on: []
  answer: {kind: expression, value: 'a_n=4n-20,\ b_n=2n-27', equivalents: ['a_n=4n-20, b_n=2n-27'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '①에서 $p-q=2$, $a_1-b_1=9$. ②는 $a_7+b_7<0<a_8+b_8$이고 $a_n>b_n$이므로 $b_1,\cdots,b_4<0$, ③에서 $b_1=-\frac32q-22$. 부등식으로 $q=2$.'
    steps:
    - {id: 1a, content: '$9q-23<0<11q-21\Rightarrow q=2$, $p=4$, $b_1=-25$, $a_1=-16$', criteria: [1.A2]}
    hint_ladder:
    - 조건 ①의 극한은 두 공차의 차를 알려 준다.
    - 등차수열의 합이 $n=7$에서만 최소이면 몇째 항에서 부호가 바뀌는가?
    - $a_n>b_n$을 이용해 $b_1,\cdots,b_4$의 부호를 정하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.9
    steps:
    - id: 1b-1
      content: |
        두 수열의 공차를 각각 $p$, $q$라 하자. 조건 ①에서 제시문 【다】에 의해 $\displaystyle\lim_{n\to\infty}\dfrac{a_n-b_n}{n}=\lim_{n\to\infty}\dfrac{(a_1-b_1)+(n-1)(p-q)}{n}=p-q=2$이고, 【가】【나】에 의해 $\displaystyle\sum_{n=1}^{10}(a_n-b_n)=10(a_1-b_1)+45(p-q)=180$이므로 $a_1-b_1=9$.
        따라서 $a_n=b_1+9+(n-1)(q+2)=b_n+2n+7>b_n$ (모든 자연수 $n$).
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $a_n+b_n$은 공차 $p+q>0$인 등차수열이므로 조건 ②는 $a_n+b_n<0\ (n\le7)$, $a_n+b_n>0\ (n\ge8)$과 같다. 그러므로 $2b_n<a_n+b_n<0\ (n\le7)$, 즉 $b_n<0\ (n\le7)$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        조건 ③에서 $\displaystyle\sum_{n=1}^{4}\lvert b_n\rvert=-\sum_{n=1}^{4}b_n=-(4b_1+6q)=88$이므로 $b_1=-\dfrac32q-22$.
      criteria: [1.M3]
    - id: 1b-4
      content: |
        $a_1=b_1+9$, $p=q+2$를 써서
        $0>a_7+b_7=2b_1+9+6(2q+2)=9q-23$, $0<a_8+b_8=2b_1+9+7(2q+2)=11q-21$.
        따라서 $\dfrac{21}{11}<q<\dfrac{23}{9}$이고 $q$는 자연수이므로 $q=2$. 그러면 $p=4$, $b_1=-25$, $a_1=-16$이고
        $a_n=4n-20$, $b_n=2n-27$.
      criteria: [1.A1, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 조건 ①에서 $p-q=2$, $a_1-b_1=9$를 구하는 식을 적었다(【다】 또는 【가】【나】 인용).
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 조건 ②를 $a_7+b_7<0$, $a_8+b_8>0$(부등호 등호 없음)으로 바꾸었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: $b_n<0\ (n\le4)$의 근거를 적고 조건 ③을 $-(4b_1+6q)=88$로 바꾸었다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $\dfrac{21}{11}<q<\dfrac{23}{9}$에서 $q=2$를 얻었다.
      depends_on: [1.M2, 1.M3]
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $a_n=4n-20$, $b_n=2n-27$을 적었다.
      depends_on: [1.M1]
      steps: [1a, 1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-2102}
  misconceptions:
  - id: MC-ALG-2102
    outcome_code: '70'
    wrong_work: '조건 ②를 $a_7+b_7\le0\le a_8+b_8$로 두어 $q$의 범위를 등호 포함으로 잡거나 $a_7+b_7=0$을 풀려고 함'
    detect_cue: $9q-23\le0$ 또는 $a_7+b_7=0$이 등장
    feedback: '"$n=7$일 때만" 최소이므로 $S_6>S_7<S_8$, 즉 $a_7+b_7<0<a_8+b_8$으로 등호가 없습니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    수열 $c_n$이 $c_n=\lvert a_n\rvert-\lvert b_n\rvert$일 때, $c_n$의 최솟값을 구하시오.
  points: 8
  depends_on: ['1']
  answer: {kind: value, value: '-17', equivalents: ['c_5=-17'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$a_n$은 $n=5$, $b_n$은 $n=13.5$에서 부호가 바뀌므로 세 구간으로 나눈다.'
    steps:
    - {id: 2a, content: '$n\le5$에서 $c_n=-2n-7$이 감소, $n\ge6$에서 증가 → $c_5=-17$', criteria: [2.A1]}
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.9
    steps:
    - id: 2b-1
      content: |
        (1)의 결과에서 $4n-20\ge0\iff n\ge5$, $2n-27>0\iff n\ge14$이므로
        $c_n=\lvert4n-20\rvert-\lvert2n-27\rvert=\begin{cases}-2n-7 & (n\le5)\\ 6n-47 & (6\le n\le13)\\ 2n+7 & (n\ge14)\end{cases}$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $n\le5$에서는 감소, $n\ge6$에서는 증가하므로 $c_n$이 최소가 되는 항은 $n=5$이고 최솟값은 $c_5=-17$ ($c_6=-11$).
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $a_n$, $b_n$의 부호가 바뀌는 $n$을 찾아 $c_n$을 구간별 식으로 적었다.
      depends_on: []
      ft: {allowed: true, from: [1.A2], max_points: 5}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 증가·감소를 근거로 최솟값 $-17$($n=5$)을 적었다.
      depends_on: [2.M1]
      steps: [2a, 2b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-2103}
  misconceptions:
  - id: MC-ALG-2103
    outcome_code: '70'
    wrong_work: '$c_n=\lvert a_n-b_n\rvert=2n+7$로 보거나 한 구간의 식만 써서 최솟값을 $9$ 또는 $-9$로 답함'
    detect_cue: 답이 $9$, $-9$, $-11$ 중 하나이거나 구간 구분이 없음
    feedback: $\lvert a\rvert-\lvert b\rvert$는 $\lvert a-b\rvert$와 다릅니다. 각 수열의 부호가 바뀌는 지점에서 나누세요.
    remedy: [RL-2]
- id: '3'
  stem: |
    $S_n=\displaystyle\sum_{k=1}^{n}c_k$일 때, $\displaystyle\lim_{n\to\infty}\dfrac{S_n}{n^2}$을 구하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$n\ge14$에서 $S_n=(\text{상수})+\sum_{k=14}^{n}(2k+7)=n^2+8n+P$이므로 극한은 최고차항 계수 $1$.'
    steps:
    - {id: 3a, content: '$\displaystyle\lim_{n\to\infty}\dfrac{n^2+8n+P}{n^2}=1$', criteria: [3.A2]}
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.9~10
    steps:
    - id: 3b-1
      content: |
        (2)의 결과로부터 $n\ge14$에서
        $\displaystyle S_n=\sum_{k=1}^{13}c_k+\sum_{k=14}^{n}(2k+7)=\sum_{k=1}^{13}c_k+2\cdot\dfrac{n(n+1)}{2}+7n-\sum_{k=1}^{13}(2k+7)$ (제시문 【나】).
      criteria: [3.M1]
    - id: 3b-2
      content: |
        즉 $S_n=n^2+8n+P$ ($P$는 상수; 실제로 $\sum_{k=1}^{13}c_k=15$, $\sum_{k=1}^{13}(2k+7)=273$이므로 $P=-258$).
      criteria: [3.A1]
    - id: 3b-3
      content: |
        제시문 【다】에 의해 $\displaystyle\lim_{n\to\infty}\dfrac{S_n}{n^2}=\lim_{n\to\infty}\left(1+\dfrac8n+\dfrac{P}{n^2}\right)=1$.
      criteria: [3.M2, 3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: 충분히 큰 $n$($n\ge14$)에서 $S_n$을 앞 13항의 합(상수)과 $\sum(2k+7)$로 나누어 적었다.
      depends_on: []
      ft: {allowed: true, from: [2.M1], max_points: 3}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: $S_n=n^2+8n+(\text{상수})$ 꼴을 적었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 2
      evidence: 극한의 성질(【다】)로 $\dfrac{8}{n}$, $\dfrac{P}{n^2}\to0$을 적었다.
      depends_on: []
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: 답 $1$을 적었다.
      depends_on: [3.M2]
      steps: [3a, 3b-3]
    deductions:
    - code: D3-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2103}
  misconceptions:
  - id: MC-CAL-2103
    outcome_code: '70'
    wrong_work: '첫 구간 식 $c_n=-2n-7$이나 가운데 구간 식 $6n-47$을 모든 $n$에 적용해 극한을 $-1$ 또는 $3$으로 답함'
