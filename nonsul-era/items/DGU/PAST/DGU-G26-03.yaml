intent: 삼차함수를 변곡점이 원점이 되도록 평행이동해 표준형으로 바꾸고, 접선과 곡선의 두 번째 교점·접선의 수직 조건을 매개변수에 대한 이차방정식의 양의 근 존재 조건으로 바꾸어 변곡점 기울기의 최댓값을 구하는 능력을 본다.
key_idea: '$g(x)=ax^3+bx$에서 두 접선 기울기의 곱 $(3at^2+b)(12at^2+b)=-1$이 $u=at^2>0$인 해를 가질 조건 $b\le-\frac43$; 변곡점(원점) 기울기는 $b$.'
stuck: 평행이동으로 이차항·상수항을 없앤 꼴을 떠올리는 단계, 수직 조건을 $at^2$에 대한 이차방정식의 양의 근 조건(판별식 + 근의 부호)으로 바꾸는 단계
