stimuli:
- label: 가
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$위의 점 $(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
    이다.
    『고등학교 수학Ⅱ』
- label: 나
  body: |
    곡선 $y=f(x)$ 위의 점 $P(a,f(a))$에 대하여 $x=a$의 좌우에서 곡선의 모양이 아래로 볼록에서 위로 볼록으로 바뀌거나 위로 볼록에서 아래로 볼록으로 바뀔 때, 점 P를 곡선 $y=f(x)$의 변곡점이라고 한다.
    『고등학교 미적분』
- label: 다
  body: |
    이계도함수가 존재하는 함수 $f(x)$에 대하여 $f''(a)=0$이고 $x=a$의 좌우에서 $f''(x)$의 부호가 바뀌면, 점 $(a,f(a))$는 곡선 $y=f(x)$의 변곡점이다.
    『고등학교 미적분』

stem: |
  다음 <조건>을 만족하는 점 P가 존재하는 삼차함수 $f(x)$에 대하여 곡선 $y=f(x)$의 변곡점에서 접선의 기울기의 최댓값 M을 다음 순서에 따라 구하시오. (단, $f(x)$의 최고차항의 계수는 양수)
  <조건>
  곡선 $y=f(x)$ 위의 점 P에서의 접선 $l$이 점 P가 아닌 곡선 위의 점 Q에서 만나고, 점 Q에서의 접선 $m$이 직선 $l$과 수직이다.

subparts:
- id: '1'
  stem: |
    곡선 $y=f(x)$를 $x$축 및 $y$축의 방향으로 적절히 평행이동하여 항의 개수가 최소가 되는 곡선 $y=g(x)$를 구하시오.
  points: 8
  depends_on: []
  answer: {kind: expression, value: 'g(x)=ax^3+bx\ (a>0)', equivalents: ['ax^3+bx (a>0, b는 상수)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$x$축 방향 평행이동으로 이차항, $y$축 방향 평행이동으로 상수항을 없앤다(변곡점을 원점으로).'
    steps:
    - {id: 1a, content: '$g(x)=ax^3+bx\ (a>0)$', criteria: [1.A1]}
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.11
    steps:
    - id: 1b-1
      content: |
        $f(x)=ax^3+cx^2+dx+e\ (a>0)$를 $x$축의 방향으로 $\dfrac{c}{3a}$만큼 평행이동하면, 즉 $f\!\left(x-\dfrac{c}{3a}\right)$를 전개하면 이차항이 사라진다. 이어서 $y$축의 방향으로 적당히 평행이동하면 상수항을 없앨 수 있다(이는 변곡점 $x=-\dfrac{c}{3a}$를 원점으로 옮기는 것과 같다).
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 항의 개수가 최소가 되도록 평행이동한 곡선은 $g(x)=ax^3+bx\ (a>0)$ 꼴이다. (평행이동은 접선의 기울기와 수직 관계를 바꾸지 않으므로 $g$도 <조건>을 만족한다.)
      criteria: [1.A1]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: (해설집 예시답안 2) 극대 또는 극소인 점을 원점으로 옮겨 $g(x)=ax^3+bx^2$로 두고 같은 순서로 진행할 수도 있다. 이후 (2)~(4)의 식은 더 복잡해지지만 최종 답 $M=-\dfrac43$은 같다.
    steps:
    - {id: 1c, content: '$g(x)=ax^3+bx^2\ (a>0)$, 변곡점 $x=-\dfrac{b}{3a}$', criteria: [1.M1]}
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $x$축 방향 평행이동으로 이차항, $y$축 방향 평행이동으로 상수항을 없애는 방법(또는 변곡점을 원점으로 옮김)을 적었다.
      depends_on: []
      steps: [1b-1, 1c]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $g(x)=ax^3+bx\ (a>0)$를 적었다.
      depends_on: [1.M1]
      steps: [1a, 1b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2104}
  misconceptions:
  - id: MC-CAL-2104
    outcome_code: '70'
    wrong_work: '평행이동으로 일차항까지 없앨 수 있다고 보고 $g(x)=ax^3$이라고 답함'
    detect_cue: 답이 $ax^3$(한 항)
    feedback: 평행이동은 $x$, $y$ 두 방향뿐이라 없앨 수 있는 항은 둘입니다. 또 $ax^3$의 접선들은 서로 수직이 될 수 없어 <조건>도 깨집니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    곡선$y=g(x)$ 위의 점 $P_0(t,\ g(t))$에서의 접선의 방정식을 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'y=(3at^2+b)x-2at^3', equivalents: ['y-(at^3+bt)=(3at^2+b)(x-t)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 제시문 【가】에 $g'(t)=3at^2+b$를 넣는다.
    steps:
    - {id: 2a, content: '$y=(3at^2+b)x-2at^3$', criteria: [2.A1]}
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.11
    steps:
    - id: 2b-1
      content: |
        $g'(x)=3ax^2+b$이므로 제시문 【가】에 의해 점 $P_0(t,\ at^3+bt)$에서의 접선은
        $y-(at^3+bt)=(3at^2+b)(x-t)$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        정리하면 $y=(3at^2+b)x-3at^3-bt+at^3+bt=(3at^2+b)x-2at^3$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $g'(t)=3at^2+b$를 구하고 【가】의 접선 공식에 대입했다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 5}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: $y=(3at^2+b)x-2at^3$(또는 동치)을 적었다.
      depends_on: [2.M1]
      steps: [2a, 2b-2]
    deductions:
    - code: D2-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2105}
  misconceptions:
  - id: MC-CAL-2105
    outcome_code: '70'
    wrong_work: '상수항을 정리하다 $y=(3at^2+b)x+2at^3$ 또는 $-2at^3-bt$로 씀'
    detect_cue: 상수항이 $+2at^3$이거나 $bt$ 항이 남음
    feedback: 접선이 $(t,\ g(t))$를 지나는지 $x=t$를 넣어 확인하세요.
    remedy: [RL-2]
- id: '3'
  stem: |
    (2)에서 구한 접선과 곡선 $y=g(x)$가 만나는 점 $Q_0$ $(\neq P_0)$에서의 접선의 방정식을 구하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: expression, value: 'y=(12at^2+b)x+16at^3\ (t\neq0)', equivalents: ['Q_0(-2t,\ -8at^3-2bt)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$g(x)-(\text{접선})=a(x-t)^2(x+2t)$이므로 $Q_0$의 $x$좌표는 $-2t$ ($t\neq0$).'
    steps:
    - {id: 3a, content: '$g''(-2t)=12at^2+b$, 접선 $y=(12at^2+b)x+16at^3$', criteria: [3.A2]}
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.11
    steps:
    - id: 3b-1
      content: |
        교점의 $x$좌표는 $ax^3+bx=(3at^2+b)x-2at^3\iff ax^3-3at^2x+2at^3=0\iff a(x-t)^2(x+2t)=0$에서 $x=t$ 또는 $x=-2t$.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $Q_0\neq P_0$이므로 $t\neq0$이고 $Q_0(-2t,\ -8at^3-2bt)$.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        $g'(-2t)=12at^2+b$이므로 제시문 【가】에 의해 $Q_0$에서의 접선은 $y+8at^3+2bt=(12at^2+b)(x+2t)\iff y=(12at^2+b)x+16at^3$.
      criteria: [3.M2, 3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: 교점 방정식을 세우고 $(x-t)^2$을 인수로 하여 인수분해했다.
      depends_on: []
      ft: {allowed: true, from: [2.A1], max_points: 3}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: $Q_0$의 좌표 $(-2t,\ -8at^3-2bt)$와 $t\neq0$을 적었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 2
      evidence: $g'(-2t)=12at^2+b$를 구해 【가】에 대입했다.
      depends_on: []
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 3
      evidence: $y=(12at^2+b)x+16at^3$을 적었다.
      depends_on: [3.M2]
      steps: [3a, 3b-3]
    deductions:
    - code: D3-1
      condition: $t\neq0$ 조건 누락
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2106}
  misconceptions:
  - id: MC-CAL-2106
    outcome_code: '70'
    wrong_work: '삼차방정식을 직접 풀다 $x=t$가 중근임을 놓치거나 다른 교점을 $x=2t$로 씀'
    detect_cue: $Q_0$의 $x$좌표가 $2t$ 또는 $-t$
    feedback: 접점은 접선과 곡선의 교점 방정식의 중근입니다. $(x-t)^2$으로 나누고 근과 계수의 관계(세 근의 합 $0$)를 확인하세요.
    remedy: [RL-4]
- id: '4'
  stem: |
    M의 값을 구하시오.
  points: 12
  depends_on: ['2', '3']
  answer: {kind: value, value: '-\dfrac43', equivalents: ['-4/3'], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: '$36u^2+15bu+b^2+1=0$ ($u=at^2$)이 양의 근을 가질 조건은 $9b^2-16\ge0$, $b<0$, 즉 $b\le-\frac43$. 변곡점은 원점, 기울기 $g''(0)=b$.'
    steps:
    - {id: 4a, content: '$M=\max b=-\dfrac43$', criteria: [4.A2]}
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.11~12
    steps:
    - id: 4b-1
      content: |
        (2), (3)의 두 접선이 수직이므로 $(3at^2+b)(12at^2+b)=-1\iff36a^2t^4+15abt^2+b^2+1=0$이고, 이 식을 만족하는 $0$이 아닌 실수 $t$가 존재해야 한다.
      criteria: [4.M1]
    - id: 4b-2
      content: |
        $t^2$에 대한 이차방정식으로 풀면 $t^2=\dfrac{-15ab\pm\sqrt{81a^2b^2-144a^2}}{72a^2}=\dfrac{-5b\pm\sqrt{9b^2-16}}{24a}$이므로 양의 값이 존재할 조건은
        $9b^2-16\ge0$ 그리고 ($-5b+\sqrt{9b^2-16}>0$ 또는 $-5b-\sqrt{9b^2-16}>0$) $\iff9b^2-16\ge0$ 그리고 $b<0\iff b\le-\dfrac43$.
        ($b>0$이면 $-5b+\sqrt{9b^2-16}<-5b+3b<0$이라 양의 근이 없다.)
      criteria: [4.M2, 4.A1]
    - id: 4b-3
      content: |
        한편 $g''(x)=6ax=0\iff x=0$이고 $x=0$의 좌우에서 $g''(x)$의 부호가 바뀌므로 제시문 【다】에 의해 원점이 곡선 $y=g(x)$의 변곡점이다. 원점에서 접선의 기울기는 $g'(0)=b\le-\dfrac43$이고 $b=-\dfrac43$일 때 등호가 성립하므로(예: $a=1$이면 $t^2=\dfrac{5}{18}$) 최댓값 $M=-\dfrac43$. 평행이동해도 접선의 기울기는 변하지 않으므로 $f$에 대한 답도 같다.
