stimuli:
- label: 가
  body: |
    아래와 같이 두 연속함수 $f,g$의 그래프로 둘러싸인 영역의 넓이 $S$는 정적분 $\int_a^b(f(x)-g(x))dx$를 계산하여 구할 수 있다.
    [그림: 위로 볼록한 곡선 $y=f(x)$와 아래로 볼록한 곡선 $y=g(x)$가 $x=a$, $x=b$에서 만나고, 그 사이 $f$가 위에 있는 영역이 $S$로 색칠됨]
- label: 나
  body: |
    두 실수 $a<b$에 대하여 함수 $g$가 닫힌 구간 $[a,b]$에서 연속이라고 가정하자. 또한 미분 가능한 함수 $F$의 도함수 $f$가 $[a,b]$에서 연속이라고 가정하면 다음이 성립한다.
    1) $\dfrac{d}{dx}\int_a^xg(t)dt=g(x),\quad a\le x\le b.$
    2) $\int_a^bf(x)dx=F(b)-F(a).$
- label: 다
  body: |
    열린 구간 $(a,b)$에서 정의된 미분 가능한 함수 $f$의 도함수를 $f'$로 놓자. $(a,b)$의 모든 $x$에 대하여 $f'(x)>0$이면 함수 $f$는 증가한다. 반대로 $(a,b)$의 모든 $x$에 대하여 $f'(x)<0$이면 함수 $f$는 감소한다.

stem: |
  $s(x)=\int_0^x3^t(2^{2t}-19\cdot2^t+48)dt$일 때, 구간 $0\le x\le4$에서 $s(x)$의 값이 최대가 되는 $x$의 값을 구하는 과정을 풀이와 함께 제시하시오.

subparts:
- id: '1'
  stem: |
    $s(x)$가 최대가 되는 $x$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: 'x=\log_23=\dfrac{\log3}{\log2}', equivalents: ['≈1.585'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $s'(x)=3^x(2^x-3)(2^x-16)$, $2^x<16$인 $[0,4)$에서 부호는 $2^x-3$의 반대.
    steps:
    - {id: 1a, content: '$0<x<\log_23$: $s''>0$, $\log_23<x<4$: $s''<0$ ⇒ $x=\log_23$에서 최대', criteria: [1.R1, 1.A2]}
    hint_ladder:
    - 제시문 [나]의 1)로 $s'(x)$를 구하자.
    - $2^x=X$로 놓으면 $X^2-19X+48$이 인수분해된다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.78 [문제 1]
    steps:
    - id: 1b-1
      content: |
        제시문 [나]의 1)을 이용하면 $s'(x)=3^x(2^{2x}-19\cdot2^x+48)=3^x(2^x-3)(2^x-16)$.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        제시문 [다]를 활용해 증감을 보면 $3<2^x<16$인 구간에서만 $s'(x)<0$이다. 즉 $0<x<\log_23$일 때 $s'(x)>0$이므로 $s(x)$는 증가하고, $\log_23<x<4$에서 $s'(x)<0$이므로 $s(x)$는 감소한다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        따라서 $x=\log_23=\dfrac{\log3}{\log2}$일 때 $s(x)$가 최댓값을 갖는다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 제시문 [나] 1)로 $s'(x)=3^x(2^{2x}-19\cdot2^x+48)$을 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $s'(x)=3^x(2^x-3)(2^x-16)$으로 인수분해했다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: $[0,4]$에서 $x=\log_23$ 전후로 $s'$의 부호가 양→음임을 밝혀 증감을 판정했다.
      depends_on: []
      steps: [1a, 1b-2]
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: $x=\log_23$을 답으로 적었다.
      depends_on: [1.A1, 1.R1]
      steps: [1a, 1b-3]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2606}
  misconceptions:
  - id: MC-CAL-2606
    outcome_code: '70'
    wrong_work: '$s(x)$를 직접 미분하지 않고 피적분함수 $3^t(2^{2t}-19\cdot2^t+48)$가 최대인 $t$를 찾거나, $2^x=3,\,16$에서 $x=3$ 또는 $x=16$으로 답함'
    detect_cue: 답이 $x=4$, $x=3$ 또는 피적분함수의 극값을 조사
    feedback: 정적분으로 정의된 함수의 도함수는 피적분함수 자체입니다(제시문 [나] 1). $s'(x)=0$인 $2^x$ 값에서 $x=\log_2(\cdot)$로 되돌리세요.
    remedy: [RL-1]

