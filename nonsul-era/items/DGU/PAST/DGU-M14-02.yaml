stimuli:
- label: 가
  body: |
    아래와 같이 두 연속함수 $f,g$의 그래프로 둘러싸인 영역의 넓이 $S$는 정적분 $\int_a^b(f(x)-g(x))dx$를 계산하여 구할 수 있다.
    [그림: 위로 볼록한 곡선 $y=f(x)$와 아래로 볼록한 곡선 $y=g(x)$가 $x=a$, $x=b$에서 만나고, 그 사이 $f$가 위에 있는 영역이 $S$로 색칠됨]
- label: 나
  body: |
    두 실수 $a<b$에 대하여 함수 $g$가 닫힌 구간 $[a,b]$에서 연속이라고 가정하자. 또한 미분 가능한 함수 $F$의 도함수 $f$가 $[a,b]$에서 연속이라고 가정하면 다음이 성립한다.
    1) $\dfrac{d}{dx}\int_a^xg(t)dt=g(x),\quad a\le x\le b.$
    2) $\int_a^bf(x)dx=F(b)-F(a).$
- label: 다
  body: |
    열린 구간 $(a,b)$에서 정의된 미분 가능한 함수 $f$의 도함수를 $f'$로 놓자. $(a,b)$의 모든 $x$에 대하여 $f'(x)>0$이면 함수 $f$는 증가한다. 반대로 $(a,b)$의 모든 $x$에 대하여 $f'(x)<0$이면 함수 $f$는 감소한다.

stem: |
  행렬 $A=\begin{pmatrix}2&-1\\-4&2\end{pmatrix}$에 대하여 두 집합 $C,D$를 다음과 같이 정의하자.
  $$C=\left\{(x,y):A\begin{pmatrix}x^2\\y\end{pmatrix}=\begin{pmatrix}0\\0\end{pmatrix}\right\},\quad D=\left\{(x,y):A\begin{pmatrix}a\\a\end{pmatrix}=\begin{pmatrix}x\\y\end{pmatrix},\ a\text{는 실수}\right\}$$
  $C,D$로 둘러싸인 영역을 좌표평면에 나타내고 그 영역의 넓이를 구하는 과정을 풀이와 함께 제시하시오.

subparts:
- id: '1'
  stem: |
    $C$, $D$로 둘러싸인 영역을 나타내고 넓이를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac13', equivalents: ['1/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $C$는 포물선 $y=2x^2$, $D$는 직선 $y=-2x$이고 교점 $(-1,2)$, $(0,0)$.
    steps:
    - {id: 1a, content: '$S=\int_{-1}^0(-2x-2x^2)dx=\left[-x^2-\dfrac23x^3\right]_{-1}^0=\dfrac13$', criteria: [1.M3, 1.A2]}
    hint_ladder:
    - 행렬 곱을 성분별 식으로 풀어 쓰자.
    - $D$에서 $x=a$이므로 $y$를 $x$로 나타낼 수 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.78 [문제 2]
    steps:
    - id: 1b-1
      content: |
        $\begin{pmatrix}2&-1\\-4&2\end{pmatrix}\begin{pmatrix}x^2\\y\end{pmatrix}=\begin{pmatrix}0\\0\end{pmatrix}$이면 $2x^2-y=0$, $-4x^2+2y=0$이므로 집합 $C$는 $y=2x^2$의 그래프이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        실수 $a$에 대해 $\begin{pmatrix}2&-1\\-4&2\end{pmatrix}\begin{pmatrix}a\\a\end{pmatrix}=\begin{pmatrix}x\\y\end{pmatrix}$이면 $x=a$, $y=-2a$이므로 집합 $D$는 $y=-2x$의 그래프이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $2x^2=-2x$를 풀면 $x=-1,\ 0$이므로 두 그래프는 $(-1,2)$와 $(0,0)$에서 만난다. [그림: 포물선 $y=2x^2$와 직선 $y=-2x$, 두 교점 사이에서 직선이 위에 있는 영역을 색칠]
      criteria: [1.A1]
    - id: 1b-4
      content: |
        제시문 [가]처럼 두 그래프로 둘러싸인 영역의 넓이는 $S=\int_{-1}^0(-2x-2x^2)dx=\left[-x^2-\dfrac23x^3\right]_{x=-1}^0=\dfrac13$.
      criteria: [1.M3, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 행렬 곱을 풀어 $C$가 $y=2x^2$임을 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: $x=a$, $y=-2a$에서 $D$가 $y=-2x$임을 적었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 교점 $(-1,2)$, $(0,0)$을 구하고 영역을 그림(또는 위치 관계 서술)으로 나타냈다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: 넓이를 $\int_{-1}^0(-2x-2x^2)dx$(위 함수 − 아래 함수)로 세웠다.
      depends_on: []
      steps: [1a, 1b-4]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: 넓이 $\dfrac13$을 적었다.
      depends_on: [1.M3]
      steps: [1a, 1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
