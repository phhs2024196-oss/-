stimuli:
- label: 가
  body: |
    한국의 소득 계층별 소득분배자료를 보면, 2000년의 경우 하위 40%의 소득 계층은 전체 소득의 18.21%만 차지하고 있는 반면 상위 20%의 소득 계층은 전체 소득의 42.55%를 차지하고 있다. 10분위 분배율은 일반적으로 많이 사용하는 다음 공식으로 계산한 것이다. 이 값이 높을수록 소득분배는 평등하며, 낮을수록 불평등하다.
    $$10\text{분위 분배율}=\dfrac{\text{하위 }40\%\text{ 소득분배분}}{\text{상위 }20\%\text{ 소득분배분}}$$
    2000년 한국의 소득분배자료에서의 10분위 분배율은 0.428이다.
    － 이정우, 『불평등의 경제학』
- label: 나
  body: |
    미국의 통계학자 로렌츠(Lorentz, M. O.)는 한 나라 국민의 소득 분배 정도를 파악하기 위하여 로렌츠 곡선을 고안하였다. 로렌츠 곡선은 오른쪽 그림과 같이 가로축에 소득액 순으로 누적 인구(%)를, 세로축에 누적 소득(%)을 나타냄으로써 얻어지는 곡선이다. 소득분배가 완전히 균등하면 곡선은 대각선(균등분포선)과 일치한다. 그러나 소득 분배가 균등하지 않을 때 대각선과 곡선 사이의 넓이로 소득 분배의 불균등 정도를 알 수 있다.
    [그림: 가로축 '누적 인구 (%)' 0~100, 세로축 '누적 소득 %' 0~100. (0,0)과 (100,100)을 잇는 직선 '완전균등선'과, 그 아래에서 (0,0)에서 (100,100)으로 아래로 볼록하게 올라가는 '로렌츠곡선'(80% 부근 이후 급격히 상승)]
    －『고등학교 수학 교과서』

stem: |
  제시문 【나】에서 인구가 충분히 많다고 가정하고, 로렌츠 곡선을 2번 미분가능하다고 하자. 또 로렌츠 곡선이 직선인 구간이 없다고 가정한다면, 로렌츠 곡선은 그림처럼 언제나 아래로 볼록이다. 그 이유를 수학적으로 설명하시오.

subparts:
- id: '1'
  stem: |
    로렌츠 곡선이 언제나 아래로 볼록인 이유를 설명하시오.
  points: 30
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $L'(x)$는 '하위 $x$ 위치 사람의 소득 ÷ 평균소득'이고 소득 순 정렬이므로 증가 → $L''\ge0$, 직선 구간이 없으니 아래로 볼록.
    steps:
    - {id: 1a, content: '$L''(x)\approx\dfrac{\text{소득 하위 }x\text{인 사람의 소득}}{\text{평균소득}}$ 증가 ⇒ $L''''(x)>0$', criteria: [1.R1, 1.R2]}
    hint_ladder:
    - $L(x+\Delta x)-L(x)$는 어떤 사람들의 소득 비율인가?
    - 그 값을 $\Delta x$로 나눈 것은 그 사람들의 소득이 평균의 몇 배인지를 뜻한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.76
    steps:
    - id: 1b-1
      content: |
        로렌츠 곡선 $y=L(x)$는 소득이 하위 $x$에 해당하는 인구의 소득 합계가 전체 소득에서 차지하는 비율이다. 따라서 $L'(x)=\lim_{\Delta x\to0}\dfrac{L(x+\Delta x)-L(x)}{\Delta x}$는 소득이 하위 $x$와 $x+\Delta x$ 사이에 드는 인구의 소득 합의 비율을 $\Delta x$로 나눈 것의 극한이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        전체 인구를 $P$, 전체 소득을 $I$라 하면
        $L'(x)=\lim_{\Delta x\to0}\dfrac{(L(x+\Delta x)-L(x))\cdot I}{\Delta x\cdot P}\cdot\dfrac{P}{I}=\lim_{\Delta x\to0}\dfrac{\text{소득이 }x\text{와 }x+\Delta x\text{ 사이인 인구의 소득}}{\text{소득이 }x\text{와 }x+\Delta x\text{ 사이인 인구}}\cdot\dfrac{P}{I}$
        이고, 인구가 매우 많으므로 근사적으로 $L'(x)=\dfrac{\text{소득 하위 }x\text{인 사람의 소득}}{\text{평균소득}}$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        제시문 【나】에서 가로축은 소득액 순으로 누적한 인구이므로 $x$가 커질수록 그 위치 사람의 소득은 감소하지 않는다. 따라서 $L'(x)$는 단조증가한다.
      criteria: [1.R1]
    - id: 1b-4
      content: |
        $L$이 2번 미분가능하므로 $L''(x)\ge0$이고, 직선인 구간을 포함하지 않으므로 $L'$이 어떤 구간에서도 상수가 아니어서 $L''(x)>0$(곡선이 어느 구간에서도 직선이 되지 않음). 따라서 로렌츠 곡선은 아래로 볼록이다.
      criteria: [1.R2, 1.R3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: $L'(x)$를 미분계수의 정의 $\lim\dfrac{L(x+\Delta x)-L(x)}{\Delta x}$로 쓰고 분자가 '구간 인구의 소득 비율'임을 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 8
      evidence: $L'(x)$가 '그 위치 사람의 소득 ÷ 평균소득'(또는 $\cdot\dfrac{P}{I}$ 꼴)임을 식으로 보였다.
      depends_on: []
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 8
      evidence: 소득액 순 정렬이므로 $L'(x)$가 증가함을 근거와 함께 적었다.
      depends_on: [1.M2]
      steps: [1a, 1b-3]
    - id: 1.R2
      mark_type: R
      points: 4
      evidence: $L'$ 증가와 직선 구간 없음으로부터 $L''(x)>0$(또는 아래로 볼록 판정 조건)을 적었다.
      depends_on: [1.R1]
      steps: [1a, 1b-4]
    - id: 1.R3
      mark_type: R
      points: 3
      evidence: 로렌츠 곡선이 아래로 볼록이라는 결론을 적었다.
      depends_on: [1.R2]
      steps: [1b-4]
