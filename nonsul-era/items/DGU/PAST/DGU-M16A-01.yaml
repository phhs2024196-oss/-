stimuli:
- label: 가
  body: |
    지면으로부터 일정한 각도로 던진 물체는 포물선 운동을 한다. 이 때 수평 방향으로는 등속운동을 하고 연직방향으로는 등가속도 운동을 한다. 수직선 위를 움직이는 점 $P$의 위치 $x$가 시각 $t$의 함수 $x=f(t)$로 나타내어질 때 시각 $t$에서 점 $P$의 속도 $v$와 가속도 $a$는 각각 다음과 같이 정의한다.
    $$v=\dfrac{dx}{dt}=f'(t),\quad a=\dfrac{dv}{dt}=f''(t)$$
    －『고등학교 수학』
- label: 나
  body: |
    평면 위를 움직이는 물체의 속도와 가속도는 시각 $t$에서의 위치를 $x$축 방향과 $y$축 방향으로 나누어 구할 수 있다. 점 $P(x,y)$가 좌표평면 위를 움직일 때 $x$와 $y$는 각각 시각 $t$의 함수이므로 $x=f(t)$, $y=g(t)$와 같이 나타낼 수 있다.
    벡터 $\vec v=\left(\dfrac{dx}{dt},\dfrac{dy}{dt}\right)=(f'(t),g'(t))$를 시각 $t$에서 점 $P$의 속도라 하고, 벡터 $\vec v$의 크기 $\lvert\vec v\rvert=\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}=\sqrt{\{f'(t)\}^2+\{g'(t)\}^2}$을 점 $P$의 속력이라 한다.
    그리고 $\vec a=\left(\dfrac{d^2x}{dt^2},\dfrac{d^2y}{dt^2}\right)=(f''(t),g''(t))$을 시각 $t$에서 점 $P$의 가속도라 한다.
    －『고등학교 수학』
- label: 다
  body: |
    시각 $t$에서 좌표평면 위를 움직이는 점 $P(x,y)$의 $x$와 $y$가 $x=f(t)$, $y=g(t)$일 때 $t=a$에서 $t=b$까지 점 $P(x,y)$가 움직인 거리 $s$는 다음과 같다.
    $$s=\int_a^b\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}dt$$
    －『고등학교 수학』

stem: |
  시각 $t$에서 좌표평면 위를 움직이는 점 $P(x,y)$의 $x$와 $y$가 $x=e^{-t}\cos t$, $y=e^{-t}\sin t$일 때 시각 $t$에서 점 $P$의 속도와 가속도를 구하고 $t=2$에서 속력을 제시문 【나】를 이용하여 풀이 과정과 답을 서술하시오. 그리고 $t=0$에서 $t=\pi$까지 점 $P$가 움직인 거리를 제시문 【다】를 이용하여 풀이 과정과 답을 서술하시오.

subparts:
- id: '1'
  stem: |
    속도, 가속도, $t=2$에서의 속력, $t=0$에서 $t=\pi$까지 움직인 거리를 구하시오.
  points: 30
  depends_on: []
  answer: {kind: expression, value: '\vec v=\left(-e^{-t}(\cos t+\sin t),\ -e^{-t}(\sin t-\cos t)\right),\ \vec a=(2e^{-t}\sin t,\ -2e^{-t}\cos t),\ \text{속력 }\sqrt2e^{-2},\ \text{거리 }\sqrt2(1-e^{-\pi})', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 곱의 미분 후 $\lvert\vec v\rvert^2=e^{-2t}\{(\cos t+\sin t)^2+(\sin t-\cos t)^2\}=2e^{-2t}$.
    steps:
    - {id: 1a, content: '$s=\int_0^\pi\sqrt2e^{-t}dt=\sqrt2(1-e^{-\pi})$', criteria: [1.M3, 1.A4]}
    hint_ladder:
    - $e^{-t}$와 삼각함수의 곱이므로 곱의 미분법을 쓰자.
    - 속력의 제곱을 전개해 $\sin^2t+\cos^2t=1$을 이용하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.73
    steps:
    - id: 1b-1
      content: |
        제시문 【가】와 【나】에서 $\dfrac{dx}{dt}=-e^{-t}\cos t-e^{-t}\sin t=-e^{-t}(\cos t+\sin t)$, $\dfrac{dy}{dt}=-e^{-t}\sin t+e^{-t}\cos t=-e^{-t}(\sin t-\cos t)$이므로 속도는 $\vec v=\left(-e^{-t}(\cos t+\sin t),\ -e^{-t}(\sin t-\cos t)\right)$.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        【나】에서 $\dfrac{d^2x}{dt^2}=e^{-t}(\cos t+\sin t)-e^{-t}(\cos t-\sin t)=2e^{-t}\sin t$, $\dfrac{d^2y}{dt^2}=e^{-t}(\sin t-\cos t)-e^{-t}(\cos t+\sin t)=-2e^{-t}\cos t$이므로 가속도는 $\vec a=(2e^{-t}\sin t,\ -2e^{-t}\cos t)$.
      criteria: [1.A2]
    - id: 1b-3
      content: |
        【나】에서 속력은 $\lvert\vec v\rvert=\sqrt{\left(-e^{-t}(\cos t+\sin t)\right)^2+\left(-e^{-t}(\sin t-\cos t)\right)^2}=\sqrt2e^{-t}$이므로 $t=2$에서 속력은 $\sqrt2e^{-2}$.
      criteria: [1.M2, 1.A3]
    - id: 1b-4
      content: |
        【다】에서 $s=\int_0^\pi\lvert\vec v\rvert dt=\int_0^\pi\sqrt2e^{-t}dt=\sqrt2\left[-e^{-t}\right]_0^\pi=\sqrt2(1-e^{-\pi})$.
      criteria: [1.M3, 1.A4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 곱의 미분법으로 $\dfrac{dx}{dt}$, $\dfrac{dy}{dt}$를 구하는 식을 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 속도 $\left(-e^{-t}(\cos t+\sin t),\ -e^{-t}(\sin t-\cos t)\right)$를 적었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: 가속도 $(2e^{-t}\sin t,\ -2e^{-t}\cos t)$를 적었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 속력 식을 전개·정리해 $\sqrt2e^{-t}$를 얻었다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 3
      evidence: $t=2$에서의 속력 $\sqrt2e^{-2}$를 적었다.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: 움직인 거리를 $\int_0^\pi\sqrt2e^{-t}dt$(속력의 적분)로 세웠다.
      depends_on: []
      steps: [1a, 1b-4]
    - id: 1.A4
      mark_type: A
      points: 3
      evidence: 거리 $\sqrt2(1-e^{-\pi})$를 적었다.
      depends_on: [1.M3]
      steps: [1a, 1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
