stimuli:
- label: 가
  body: |
    $k$가 $0$이 아닌 실수일 때, 오른쪽 그림과 같이 좌표평면 위에서 점 $P(x,y)$를 점 $P(x',y')$으로 옮기는 변환
    $$f:(x,y)\to(kx,ky)$$
    를 원점을 중심으로 하고 닮음비가 $k$인 닮음변환이라고 한다.
    [그림: 원점 O에서 뻗은 점선 위에 작은 삼각형의 꼭짓점 $P(x,y)$와 큰 삼각형의 꼭짓점 $P'(x',y')$가 있고, 작은 삼각형이 큰 삼각형으로 확대된 모습]
    －『고등학교 수학』
- label: 나
  body: |
    함수 $f(x)$가 구간 $(a,b)$에서 미분가능하고 $f'(x)$가 연속일 때, 곡선 $y=f(x)$ $(a\le x\le b)$의 길이 $l$은
    $$l=\int_a^b\sqrt{1+\{f'(x)\}^2}dx=\int_a^b\sqrt{1+\left(\dfrac{dy}{dx}\right)^2}dx.$$
    －『고등학교 수학』
- label: 다
  body: |
    줄의 양 끝을 잡으면 팽팽히 잡아당겼다 하더라도 중력의 영향으로 늘어뜨려진 모양이 된다. 이러한 모양의 곡선을 현수선이라고 한다. 현수선 위의 임의의 점 $(x,f(x))$에서의 접선의 기울기가 $f'(x)=\dfrac{e^x-e^{-x}}{2}$이고 $f(0)=0$이라고 하면, $f(x)=\dfrac{e^x+e^{-x}}{2}-1$ 이다.
    －『고등학교 수학』

stem: |
  제시문 【다】에서 주어진 현수선 $y=f(x)$ 위의 두 점 $(-a,f(-a))$와 $(a,f(a))$ 사이의 현수선의 길이를 제시문 【나】를 이용하여 구하시오. 길이가 6m인 줄의 양끝을 같은 높이로 고정하였을 때 줄의 가운데가 양끝 고정점에 비하여 1m 아래로 늘어뜨려졌다고 가정하고, 이 줄의 모양이 제시문 【다】의 현수선 $y=f(x)$에 제시문 【가】에서 설명한 닮음변환에 의하여 얻어진 곡선과 같다고 할 때, 닮음비 $k$를 구하고 줄의 양끝 고정점 사이의 거리를 계산하시오.
  <8 ~ 15줄> [35점]

subparts:
- id: '1'
  stem: |
    현수선의 길이, 닮음비 $k$, 양끝 고정점 사이의 거리를 구하시오.
  points: 35
  depends_on: []
  answer: {kind: value, value: '\text{길이 }e^a-e^{-a},\ k=4,\ \text{거리 }8\ln2\,(\text{m})', equivalents: ['8ln2≈5.545'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $u=\dfrac{e^a+e^{-a}}{2}=1+\dfrac1k$, $w=\dfrac{e^a-e^{-a}}{2}=\dfrac3k$, $u^2-w^2=1$ → $k=4$.
    steps:
    - {id: 1a, content: '$\left(1+\dfrac1k\right)^2-\dfrac9{k^2}=1\Rightarrow k=4$, $e^a=2$, 거리 $2ka=8\ln2$', criteria: [1.A2, 1.A3]}
    hint_ladder:
    - $1+\left(\dfrac{e^x-e^{-x}}{2}\right)^2$은 완전제곱이다.
    - 닮음변환으로 길이와 높이 차는 모두 $k$배가 된다.
    - $\cosh^2-\sinh^2=1$에 해당하는 관계로 $a$를 지우자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.74
    steps:
    - id: 1b-1
      content: |
        제시문 【나】의 공식에 의해 현수선의 길이는
        $\int_{-a}^a\sqrt{1+\left(\dfrac{e^x-e^{-x}}{2}\right)^2}dx=2\int_0^a\sqrt{\left(\dfrac{e^x+e^{-x}}{2}\right)^2}dx=\int_0^a(e^x+e^{-x})dx=e^a-e^{-a}$.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        $y=f(x)$의 그래프는 좌우대칭이고 원점을 지나며, 원점은 두 점 $(-a,f(a))$, $(a,f(a))$보다 $f(a)$만큼 낮다. 이 곡선을 닮음비 $k$인 닮음변환(【가】)으로 옮기면 두 점 $(-ka,kf(a))$, $(ka,kf(a))$를 지나고 원점을 지나는 곡선이 되며 길이는 $k(e^a-e^{-a})$이다. 이것이 길이 6m, 가운데가 1m 늘어진 줄과 같으므로
        $k(e^a-e^{-a})=6$, $kf(a)=k\left(\dfrac{e^a+e^{-a}}{2}-1\right)=1$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        두 번째 식에 $k$를 더하고 제곱한 것에서 첫 번째 식의 반의 제곱을 빼면 $k^2\left\{\left(\dfrac{e^a+e^{-a}}{2}\right)^2-\left(\dfrac{e^a-e^{-a}}{2}\right)^2\right\}=k^2=(k+1)^2-9$. 따라서 $2k=8$, $k=4$. 이때 $e^a-e^{-a}=\dfrac32$에서 $e^a=2$, 즉 $a=\ln2$.
      criteria: [1.A2]
    - id: 1b-4
      content: |
        양끝 고정점 사이의 거리는 $2ka=8\ln2$(m)이다.
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: 【나】의 길이 공식에 $f'(x)$를 넣고 $1+\{f'(x)\}^2=\left(\dfrac{e^x+e^{-x}}{2}\right)^2$으로 정리했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: 길이 $e^a-e^{-a}$를 적었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 7
      evidence: 닮음변환 후 길이·높이 차가 $k$배임을 써서 $k(e^a-e^{-a})=6$, $kf(a)=1$의 두 식을 세웠다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 7
      evidence: $k=4$와 $a=\ln2$(또는 $e^a=2$)를 적었다.
      depends_on: [1.M2]
      steps: [1a, 1b-3]
    - id: 1.A3
      mark_type: A
      points: 7
      evidence: 양끝 고정점 사이 거리 $2ka=8\ln2$를 적었다.
      depends_on: [1.M2]
      steps: [1a, 1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
