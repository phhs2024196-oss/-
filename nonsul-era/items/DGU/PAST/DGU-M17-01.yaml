stimuli:
- label: 가
  body: |
    함수 $f(x)$가 실수 $a$에서 대하여
    (1) $x=a$에서 정의되어 있고
    (2) 극한값 $\lim_{x\to a}f(x)$가 존재하며
    (3) $\lim_{x\to a}f(x)=f(a)$
    일 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다.
    －『고등학교 수학 Ⅱ』
- label: 나
  body: |
    일반적으로 $\alpha\le x\le\beta$의 실수값을 가지는 연속확률변수 $X$에 대하여 다음을 만족하는 함수 $f(x)$를 확률변수 $X$의 확률밀도함수라고 한다.
    (1) $f(x)\ge0\quad(\alpha\le x\le\beta)$
    (2) $\alpha\le a\le b\le\beta$인 두 실수 $a,b$에 대하여 $P(a\le X\le b)=\int_a^bf(x)dx$이다.
    (3) $\int_\alpha^\beta f(x)dx=1$
    －『고등학교 적분과 통계』

stem: |
  제시문 [가], [나]를 참고하여 다음에 답하시오. 어떤 유행성 감기가 완치되는데 걸리는 시간을 나타내는 연속확률변수를 $X$라고 놓고 연속확률변수 $X$가 폐구간 $[0,20]$에서 값을 갖는다고 가정하자. 연속확률변수 $X$의 확률밀도함수가 $f(x)=\begin{cases}ax, & 0\le x\le10\\ c, & 10<x\le20\end{cases}$ 라고 한다. 함수 $f(x)$가 폐구간 $[0,20]$에서 연속일 때 $a$와 $c$를 구하고, 이 감기를 완치하는데 걸리는 평균시간 $E(X)$를 구하시오. (답안지에 풀이 과정과 답을 함께 기술하시오.)
  <10 ~ 15줄> [35점]

subparts:
- id: '1'
  stem: |
    $a$, $c$와 $E(X)$를 구하시오.
  points: 35
  depends_on: []
  answer: {kind: value, value: 'a=\dfrac{1}{150},\ c=\dfrac{1}{15},\ E(X)=\dfrac{110}{9}', equivalents: ['E(X)≈12.22'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $c=10a$, $50a+10c=1$ → $a=\dfrac1{150}$; $E(X)=\int_0^{10}\dfrac{x^2}{150}dx+\int_{10}^{20}\dfrac{x}{15}dx$.
    steps:
    - {id: 1a, content: '$E(X)=\dfrac{20}{9}+10=\dfrac{110}{9}$', criteria: [1.A2]}
    hint_ladder:
    - $x=10$에서의 연속 조건을 식으로 써 보자.
    - 확률밀도함수의 넓이는 얼마인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.70
    steps:
    - id: 1b-1
      content: |
        $f(x)$가 연속이므로 제시문 [가]에 의해 $x=10$에서 함숫값과 극한값이 같다: $10a=f(10)=\lim_{x\to10+}f(x)=c$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        제시문 [나](3)에 의해 $1=\int_0^{20}f(x)dx=\int_0^{10}ax\,dx+\int_{10}^{20}c\,dx=\left[\dfrac{ax^2}{2}\right]_0^{10}+[cx]_{10}^{20}=50a+10c$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $c=10a$, $50a+10c=1$에서 $150a=1$이므로 $a=\dfrac{1}{150}$, $c=\dfrac{1}{15}$.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        $E(X)=\int_0^{20}xf(x)dx=\int_0^{10}\dfrac{x^2}{150}dx+\int_{10}^{20}\dfrac{x}{15}dx=\left[\dfrac{x^3}{450}\right]_0^{10}+\left[\dfrac{x^2}{30}\right]_{10}^{20}=\dfrac{1000}{450}+\dfrac{400-100}{30}=\dfrac{20}{9}+10=\dfrac{110}{9}$.
      criteria: [1.M3, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: $x=10$에서의 연속 조건 $10a=c$를 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 7
      evidence: $\int_0^{20}f(x)dx=1$로부터 $50a+10c=1$을 적었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: $a=\dfrac1{150}$, $c=\dfrac1{15}$을 적었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 7
      evidence: $E(X)=\int_0^{20}xf(x)dx$를 두 구간으로 나누어 세웠다.
      depends_on: []
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 7
      evidence: $E(X)=\dfrac{110}{9}$을 적었다.
      depends_on: [1.M3]
      ft: {allowed: false}
      steps: [1a, 1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
