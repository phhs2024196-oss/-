stimuli:
- label: 가
  body: |
    원뿔 모양의 아이스크림 콘을 만드는 어느 공장에서 부피는 일정하지만 겉넓이를 가장 작게 하여 생산비를 줄이고자 한다.
    『고등학교 미적분 Ⅱ』
- label: 나
  body: |
    반지름의 길이가 $R$, 중심각의 크기가 $\theta$(라디안)인 부채꼴의 호의 길이를 $l$, 넓이를 $S$라 하면
    (i) $l=R\theta$
    (ii) $S=\dfrac12R^2\theta=\dfrac12Rl.$
    『고등학교 미적분 Ⅱ』
- label: 다
  body: |
    함수 $f(x)$가 어떤 열린 구간에서 미분가능할 때, 그 구간의 모든 $x$에 대해
    (i) $f'(x)>0$ 이면 $f(x)$는 그 구간에서 증가한다.
    (ii) $f'(x)<0$ 이면 $f(x)$는 그 구간에서 감소한다.
    『고등학교 미적분 Ⅰ』

stem: |
  제시문【가】의 공장에서 생산하는 아이스크림 콘의 부피가 $9\sqrt2\pi^4$로 일정할 때, 아이스크림 콘 옆면의 겉넓이를 최소로 하여 생산비를 최소로 하고자 한다. 생산비가 최소가 될 때 이 공장에서 생산하는 아이스크림 콘의 윗면의 반지름과 높이를 구하라.
  <10 ~ 13줄> [30점]

subparts:
- id: '1'
  stem: |
    위 논제의 반지름과 높이를 구하라.
  points: 30
  depends_on: []
  answer: {kind: value, value: '반지름 3\pi,\ 높이 3\sqrt2\pi', equivalents: ['r=3π, h=3√2π'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 옆넓이 $\pi r\sqrt{r^2+h^2}$에 $h=\dfrac{27\sqrt2\pi^3}{r^2}$을 넣고 $r$로 미분한다.
    steps:
    - {id: 1a, content: '$\dfrac{dS}{dr}=\dfrac{2\pi^2\{r^6-(3\pi)^6\}}{r^2\sqrt{\pi^2r^6+2\cdot3^6\pi^8}}$ → $r=3\pi$에서 최소, $h=3\sqrt2\pi$', criteria: [1.M3, 1.A3]}
    hint_ladder:
    - 원뿔 옆면을 펼치면 어떤 도형인가?
    - 부피 조건으로 $h$를 $r$로 나타내 보자.
    - 미분한 식의 부호를 결정하는 인수만 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.56
    steps:
    - id: 1b-1
      content: |
        밑면(윗면)의 반지름을 $r$, 높이를 $h$, 부피를 $V$, 옆면의 겉넓이를 $S$라 하면 $V=\dfrac13\pi r^2h$ ⋯ (1).
        옆면을 펼친 부채꼴의 반지름은 모선 $R=\sqrt{r^2+h^2}$, 호의 길이는 윗면 원의 둘레 $l=2\pi r$이므로 【나】에 의해
        $$S=\dfrac12Rl=\pi r\sqrt{r^2+h^2}.$$
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        $V=9\sqrt2\pi^4$이므로 (1)에서 $h=\dfrac{27\sqrt2\pi^3}{r^2}$ ⋯ (2). 따라서
        $$S=\pi r\sqrt{r^2+\dfrac{2\cdot3^6\pi^6}{r^4}}=\sqrt{\pi^2r^4+\dfrac{2\cdot3^6\pi^8}{r^2}}.$$
      criteria: [1.M2, 1.A2]
    - id: 1b-3
      content: |
        $r$에 대해 미분하면
        $$\dfrac{dS}{dr}=\dfrac{4\pi^2r^3-\dfrac{4\cdot3^6\pi^8}{r^3}}{2\sqrt{\pi^2r^4+\dfrac{2\cdot3^6\pi^8}{r^2}}}=\dfrac{2\pi^2\{r^6-(3\pi)^6\}}{r^2\sqrt{\pi^2r^6+2\cdot3^6\pi^8}}.$$
      criteria: [1.M3]
    - id: 1b-4
      content: |
        $\dfrac{dS}{dr}$은 $r>3\pi$이면 양수, $0<r<3\pi$이면 음수이므로 【다】에 의해 $S$는 $r<3\pi$에서 감소, $r>3\pi$에서 증가한다. 따라서 $S$는 $r=3\pi$일 때 최소이고, (2)에 의해 $h=\dfrac{27\sqrt2\pi^3}{9\pi^2}=3\sqrt2\pi$.
      criteria: [1.R1, 1.A3]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 해설집 유의사항(p.57) — $h$를 변수로 두어도 같다.
    steps:
    - id: 1c-1
      content: |
        (2)에서 $r^2=\dfrac{27\sqrt2\pi^3}{h}$, $S=\sqrt{\dfrac{2\cdot3^6\pi^8}{h^2}+27\sqrt2\pi^5h}$이고
        $\dfrac{dS}{dh}=\dfrac{27\sqrt2\pi^5\{h^3-(3\sqrt2\pi)^3\}}{2h^2\sqrt{27\sqrt2\pi^5h^3+2\cdot3^6\pi^8}}$의 부호로 $h=3\sqrt2\pi$에서 최소, $r=3\pi$.
      criteria: [1.M3, 1.R1, 1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 옆면을 부채꼴(반지름 $\sqrt{r^2+h^2}$, 호의 길이 $2\pi r$)로 보고 【나】를 적용한 식이 있다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $S=\pi r\sqrt{r^2+h^2}$를 적었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 부피 조건 $\dfrac13\pi r^2h=9\sqrt2\pi^4$로 한 변수를 소거했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: $S$를 $r$(또는 $h$)만의 식으로 정확히 적었다.
      depends_on: [1.M2]
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 5
      evidence: $S$(또는 $S^2$)를 미분해 부호를 결정하는 인수 $r^6-(3\pi)^6$(또는 $h^3-(3\sqrt2\pi)^3$)을 얻었다.
      depends_on: []
      steps: [1a, 1b-3, 1c-1]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: 【다】를 인용해 임계점 좌우의 증가·감소로 최소임을 밝혔다.
      depends_on: []
      steps: [1b-4, 1c-1]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: 반지름 $3\pi$, 높이 $3\sqrt2\pi$를 적었다.
      depends_on: [1.M3, 1.R1]
      steps: [1a, 1b-4, 1c-1]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2505}
  misconceptions:
  - id: MC-CAL-2505
    outcome_code: '70'
    wrong_work: '옆넓이를 $\pi rh$ 또는 $\pi r^2$ 꼴로 써서 부채꼴 반지름에 모선 $\sqrt{r^2+h^2}$ 대신 $h$나 $r$을 씀'
    detect_cue: 겉넓이 식에 $\sqrt{r^2+h^2}$가 없음
    feedback: 옆면을 펼친 부채꼴의 반지름은 꼭짓점에서 밑면 둘레까지의 길이, 즉 모선 $\sqrt{r^2+h^2}$입니다.
    remedy: [RL-1]

