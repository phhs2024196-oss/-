stimuli:
- label: 가
  body: |
    연속확률변수 $X$가 $a\le X\le b$인 범위 안의 임의의 값을 가질 수 있고, 이 범위에서 함수 $f(x)$가 다음 조건을 만족하면 $f(x)$를 $X$의 확률밀도함수라고 한다.
    (i) 모든 $x$에 대하여 $f(x)\ge0$
    (ii) 곡선 $y=f(x)$와 $x$축, 직선 $x=a$, $x=b$로 둘러싸인 부분의 넓이가 1
    (iii) $P(\alpha\le X\le\beta)$ $(a\le\alpha\le\beta\le b)$는 곡선 $y=f(x)$와 $x$축, 직선 $x=\alpha$, $x=\beta$로 둘러싸인 부분의 넓이
    『고등학교 확률과 통계』
- label: 나
  body: |
    함수 $f:X\to Y,\ y=f(x)$가 일대일 대응일 때, 집합 $Y$의 임의의 원소 $y$에 $f(x)=y$인 집합 $X$의 원소 $x$를 대응시키면 집합 $Y$를 정의역, 집합 $X$를 공역으로 하는 새로운 함수를 얻는다. 이 함수를 함수 $f:X\to Y$의 역함수라고 하며, 이것을 기호로
    $$f^{-1}$$
    와 같이 나타낸다. 즉,
    $$f^{-1}:Y\to X,\ x=f^{-1}(y)$$
    이다.
    『고등학교 수학 Ⅱ』
- label: 다
  body: |
    함수 $f(x)$가 어떤 열린 구간에서 미분가능하고, 이 구간의 모든 $x$에 대하여
    (i) $f'(x)>0$이면 $f(x)$는 이 구간에서 증가한다.
    (ii) $f'(x)<0$이면 $f(x)$는 이 구간에서 감소한다.
    『고등학교 미적분 Ⅰ』

stem: |
  확률밀도함수 $f(x)=be^{-bx}\ (x\ge0,\ b>0)$인 확률변수 $X$가 1보다 작을 확률은 $\dfrac13$보다 크지 않고, 2보다 작을 확률은 $\dfrac12$보다 작지 않을 때, 다음과 같이 정의된 $k$의 최솟값과 최댓값을 구하고 풀이과정을 서술하시오.
  $$k=\int_1^b f^{-1}(x)dx$$

subparts:
- id: '1'
  stem: |
    $k$의 최솟값과 최댓값을 구하시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: '최댓값 g(\ln\sqrt2)=1-\dfrac{1+\ln(\ln\sqrt2)}{\ln\sqrt2},\ 최솟값 g\left(\ln\dfrac32\right)=1-\dfrac{1+\ln\left(\ln\dfrac32\right)}{\ln\dfrac32}\ \left(g(b)=\dfrac1b\ln\dfrac1b-\dfrac1b+1\right)', equivalents: ['최댓값≈1.1721, 최솟값≈0.7601'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $k=g(b)$를 구하고 $g'(b)=\dfrac{\ln b}{b^2}$, 확률 조건에서 $\ln\sqrt2\le b\le\ln\dfrac32<1$.
    steps:
    - {id: 1a, content: '$g$는 $0<b<1$에서 감소 → 최댓값 $g(\ln\sqrt2)$, 최솟값 $g\left(\ln\dfrac32\right)$', criteria: [1.R1, 1.A4]}
    hint_ladder:
    - $y=be^{-bx}$를 $x$에 대해 풀어 역함수를 구해 보자.
    - $x=by$로 치환하면 $\int\ln y\,dy$ 꼴이 된다.
    - 두 확률 조건이 $b$의 범위를 어떻게 제한하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.58
    steps:
    - id: 1b-1
      content: |
        【나】에 의해 $y=be^{-bx}$를 $x$에 대해 풀면 $x=-\dfrac1b\ln\dfrac yb$이므로 $f^{-1}(x)=-\dfrac1b\ln\dfrac xb$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $x=by$로 치환하면 $dx=b\,dy$, $x=1\to y=\dfrac1b$, $x=b\to y=1$이므로
        $$k=\int_1^b\left(-\dfrac1b\ln\dfrac xb\right)dx=\int_{1/b}^1(-\ln y)\,dy=\Big[-y\ln y+y\Big]_{1/b}^{1}=\dfrac1b\ln\dfrac1b-\dfrac1b+1.$$
      criteria: [1.M1, 1.A1]
    - id: 1b-3
      content: |
        $k$를 $b$의 함수 $g(b)=\dfrac1b\ln\dfrac1b-\dfrac1b+1$로 보면 $g'(b)=\dfrac{\ln b}{b^2}$. $0<b<1$에서 $g'(b)<0$이므로 【다】에 의해 $g$는 감소함수이고, $b>1$에서는 증가함수이다.
      criteria: [1.M2, 1.A2]
    - id: 1b-4
      content: |
        【가】에 의해 $P(X<1)=\displaystyle\int_0^1be^{-bx}dx=1-e^{-b}\le\dfrac13$에서 $e^{-b}\ge\dfrac23$, $b\le\ln\dfrac32<\ln e=1$.
        $P(X<2)=\displaystyle\int_0^2be^{-bx}dx=1-e^{-2b}\ge\dfrac12$에서 $e^{-2b}\le\dfrac12$, $b\ge\ln\sqrt2$. 즉 $0<\ln\sqrt2\le b\le\ln\dfrac32<1$.
      criteria: [1.M3, 1.A3]
    - id: 1b-5
      content: |
        $b$의 범위가 1보다 작은 구간이고 $g$는 그 구간에서 감소하므로 $k$의 최댓값은 $b$의 하한 $\ln\sqrt2$에서 $g(\ln\sqrt2)$, 최솟값은 상한 $\ln\dfrac32$에서 $g\left(\ln\dfrac32\right)$이다.
      criteria: [1.R1, 1.A4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 역함수 $f^{-1}(x)=-\dfrac1b\ln\dfrac xb$를 구하고 치환(또는 부분적분)으로 $k$를 계산하는 식이 있다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $k=\dfrac1b\ln\dfrac1b-\dfrac1b+1$(또는 동치식)을 적었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $k$를 $b$에 대해 미분했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $g'(b)=\dfrac{\ln b}{b^2}$과 $0<b<1$에서 감소를 적었다.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: 【가】로 $P(X<1)=1-e^{-b}$, $P(X<2)=1-e^{-2b}$를 적분해 조건 부등식을 세웠다.
      depends_on: []
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: $\ln\sqrt2\le b\le\ln\dfrac32$를 적었다.
      depends_on: [1.M3]
      steps: [1b-4]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: 범위가 $b<1$ 안에 있어 감소함을 근거로 최대·최소 위치를 정했다.
      depends_on: []
      steps: [1a, 1b-5]
    - id: 1.A4
      mark_type: A
      points: 3
      evidence: 최댓값 $g(\ln\sqrt2)$, 최솟값 $g\left(\ln\dfrac32\right)$(식 또는 동치 표현)을 적었다.
      depends_on: [1.A2, 1.A3, 1.R1]
      steps: [1a, 1b-5]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
