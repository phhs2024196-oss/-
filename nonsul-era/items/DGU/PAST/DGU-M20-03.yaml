key_idea: '$\vec b-(\vec a\cdot\vec b)\vec a$는 $\vec a,\vec b$가 이루는 평면 위에서 $\vec a$에 수직이고, 서로 수직인 단위벡터에 대해 $\vec e=(\vec e\cdot\vec a)\vec a+(\vec e\cdot\vec c)\vec c+(\vec e\cdot\vec d)\vec d$.'
stuck: $\vec b$에서 $\vec a$ 방향 정사영 성분을 빼 수직 성분을 얻는 단계, 계수를 연립 대신 내적으로 한 번에 구하는 발상
