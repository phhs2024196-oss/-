stimuli:
- label: 가
  body: |
    벡터 $\vec a=(a_1,a_2,a_3)$ 에 대하여
    $$\lvert\vec a\rvert=\sqrt{a_1^2+b_1^2+c_1^2}.$$
    『고등학교 기하와 벡터』
- label: 나
  body: |
    두 벡터 $\vec a=(a_1,a_2,a_3),\ \vec b=(b_1,b_2,b_3)$에 대하여
    $$\vec a\cdot\vec b=a_1b_1+a_2b_2+a_3b_3.$$
    영벡터가 아닌 두 벡터 $\vec a,\vec b$ 가 이루는 각의 크기가 $\theta\,(0\le\theta\le\pi)$일 때
    $$\vec a\cdot\vec b=\lvert\vec a\rvert\lvert\vec b\rvert\cos\theta.$$
    『고등학교 기하와 벡터』
- label: 다
  body: |
    영벡터가 아닌 두 벡터 $\vec a,\vec b$에 대하여
    $$\vec a\perp\vec b=0\Leftrightarrow\vec a\cdot\vec b=0.$$
    『고등학교 기하와 벡터』
- label: 라
  body: |
    평면 $\alpha$와 한 점 $O$ 에서 만나는 직선 $l$ 이 평면 $\alpha$ 위의 점 $O$ 에서 만나는 서로 다른 두 직선 $a,b$와 수직이면 직선 $l$과 평면 $\alpha$는 수직이다.
    『고등학교 기하와 벡터』

stem: |
  두 벡터 $\vec a=\left(\dfrac1{\sqrt3},\dfrac1{\sqrt3},\dfrac1{\sqrt3}\right),\vec b=(1,1,0)$ 에 대해 벡터 $\vec a$ 와 벡터 $\vec b$ 가 이루는 평면에 있으면서 벡터 $\vec a$ 와 수직이고 $x$-좌표가 양수인 단위 벡터 $\vec c$ 를 구하라. 그리고, 벡터 $\vec a$ 와 벡터 $\vec c$ 로 이루어진 평면에 수직이고 $x$-좌표가 양수인 단위 벡터 $\vec d$ 를 구하라. 임의의 벡터 $\vec e=(x,y,z)$를 벡터 $\vec a$, 벡터 $\vec c$, 벡터 $\vec d$로 나타내라.

subparts:
- id: '1'
  stem: |
    단위 벡터 $\vec c$ 를 구하라.
  points: 13
  depends_on: []
  answer: {kind: value, value: '\vec c=\left(\dfrac1{\sqrt6},\dfrac1{\sqrt6},-\dfrac2{\sqrt6}\right)', equivalents: ['(1,1,-2)/√6'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\vec b$에서 $\vec a$ 방향 정사영 $(\vec a\cdot\vec b)\vec a$를 빼고 단위화한다.
    steps:
    - {id: 1a, content: '$\vec b-(\vec a\cdot\vec b)\vec a=\left(\dfrac13,\dfrac13,-\dfrac23\right)$ → $\vec c=\dfrac1{\sqrt6}(1,1,-2)$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $\vec b$를 $\vec a$에 평행한 성분과 수직인 성분으로 나누어 보자.
    - $\vec a$가 단위벡터이면 평행 성분은 $(\vec a\cdot\vec b)\vec a$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.59
    steps:
    - id: 1b-1
      content: |
        $\vec b$의 종점을 B, B에서 $\vec a$에 내린 수선의 발을 C라 하면 $\vec c$는 $\dfrac{\overrightarrow{CB}}{\lvert\overrightarrow{CB}\rvert}$, $-\dfrac{\overrightarrow{CB}}{\lvert\overrightarrow{CB}\rvert}$ 중 $x$좌표가 양수인 것이다. $\vec a$가 단위벡터이므로 【나】에 의해
        $$\overrightarrow{OC}=\lvert\vec b\rvert\cos(\angle BOC)\dfrac{\vec a}{\lvert\vec a\rvert}=(\vec a\cdot\vec b)\vec a.$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\vec a\cdot\vec b=\dfrac2{\sqrt3}$이므로 $\overrightarrow{CB}=\vec b-(\vec a\cdot\vec b)\vec a=(1,1,0)-\dfrac23(1,1,1)=\left(\dfrac13,\dfrac13,-\dfrac23\right)$, $\lvert\overrightarrow{CB}\rvert=\dfrac{\sqrt6}3$. 따라서 $\vec c=\left(\dfrac1{\sqrt6},\dfrac1{\sqrt6},-\dfrac2{\sqrt6}\right)$이고 $x$좌표는 양수이다.
      criteria: [1.A1, 1.B1]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 해설집 별해(p.60) — 평면 위 벡터를 $\sqrt3p\vec a+q\vec b$로 두고 조건을 연립.
    steps:
    - id: 1c-1
      content: |
        $\vec c=\sqrt3p\vec a+q\vec b=(p+q,\ p+q,\ p)$로 놓으면 $\vec a\cdot\vec c=0$, $\lvert\vec c\rvert=1$, $x$좌표 양수에서 $3p+2q=0$, $2(p+q)^2+p^2=1$, $p+q>0$이므로 $p=-\dfrac{\sqrt6}3$, $q=\dfrac{\sqrt6}2$, $\vec c=\left(\dfrac1{\sqrt6},\dfrac1{\sqrt6},\dfrac{-2}{\sqrt6}\right)$.
      criteria: [1.M1, 1.A1, 1.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: 정사영 $(\vec a\cdot\vec b)\vec a$를 빼거나 $p\vec a+q\vec b$로 두고 수직·크기 조건을 세운 식이 있다.
      depends_on: []
      implied_ok: false
      steps: [1a, 1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $\vec c=\left(\dfrac1{\sqrt6},\dfrac1{\sqrt6},-\dfrac2{\sqrt6}\right)$를 적었다.
      depends_on: [1.M1]
      steps: [1a, 1b-2, 1c-1]
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: 크기 1과 $x$좌표 양수 조건으로 두 후보 중 하나를 골랐음을 밝혔다.
      depends_on: []
      steps: [1b-2, 1c-1]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-2508}
  misconceptions:
  - id: MC-GEO-2508
    outcome_code: '70'
    wrong_work: '$\dfrac{\vec b}{\lvert\vec b\rvert}=\left(\dfrac1{\sqrt2},\dfrac1{\sqrt2},0\right)$을 답하거나 $\left(\dfrac13,\dfrac13,-\dfrac23\right)$을 단위화하지 않음'
    detect_cue: 답과 $\vec a$의 내적이 0이 아님, 또는 크기가 1이 아님
    feedback: 평면 위에서 $\vec a$에 수직인 성분은 $\vec b$에서 $\vec a$ 방향 성분을 뺀 것이고, 마지막에 크기로 나눠 단위벡터를 만드세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    벡터 $\vec a$ 와 벡터 $\vec c$ 로 이루어진 평면에 수직이고 $x$-좌표가 양수인 단위 벡터 $\vec d$ 를 구하라.
  points: 13
  depends_on: ['1']
  answer: {kind: value, value: '\vec d=\left(\dfrac1{\sqrt2},-\dfrac1{\sqrt2},0\right)', equivalents: ['(1,-1,0)/√2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 【라】에 의해 $\vec a$, $\vec c$ 모두에 수직이면 평면에 수직 → 내적 0 두 식 + 크기 1.
    steps:
    - {id: 2a, content: '$f+g+h=0$, $f+g-2h=0$ → $h=0$, $g=-f$ → $\vec d=\dfrac1{\sqrt2}(1,-1,0)$', criteria: [2.M1, 2.A1]}
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.59
    steps:
    - id: 2b-1
      content: |
        【라】에 의해 $\vec a$와 $\vec c$에 수직이면 두 벡터를 포함한 평면에 수직이다. $\vec d=(f,g,h)$라 하면 【다】【나】에 의해 $\vec a\cdot\vec d=0$, $\vec c\cdot\vec d=0$이고 크기 1, $x$좌표 양수이므로
        $$f+g+h=0,\quad f+g-2h=0,\quad f^2+g^2+h^2=1,\quad f>0.$$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        두 식을 빼면 $h=0$, $g=-f$이고 $2f^2=1$, $f>0$이므로 $\vec d=\left(\dfrac1{\sqrt2},-\dfrac1{\sqrt2},0\right)$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: 【라】를 근거로 $\vec a\cdot\vec d=0$, $\vec c\cdot\vec d=0$, $\lvert\vec d\rvert=1$, $f>0$을 세웠다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 6}
      steps: [2a, 2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: $\vec d=\left(\dfrac1{\sqrt2},-\dfrac1{\sqrt2},0\right)$을 적었다.
      depends_on: [2.M1]
      steps: [2a, 2b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-2508}
  misconceptions:
  - id: MC-GEO-2508
    outcome_code: '70'
    wrong_work: '$(1,-1,0)$을 단위화하지 않고 답함, 또는 $\vec a$에만 수직인 벡터를 답함'
    detect_cue: 답의 크기가 1이 아님, 또는 $\vec c\cdot\vec d\neq0$
    feedback: 평면에 수직이려면 평면 위 두 벡터 모두에 수직이어야 하고(【라】), 단위벡터 조건도 확인하세요.
    remedy: [RL-1]
- id: '3'
  stem: |
    임의의 벡터 $\vec e=(x,y,z)$를 벡터 $\vec a$, 벡터 $\vec c$, 벡터 $\vec d$로 나타내라.
  points: 14
  depends_on: ['1', '2']
  answer: {kind: expression, value: '\vec e=\dfrac{x+y+z}{\sqrt3}\vec a+\dfrac{x+y-2z}{\sqrt6}\vec c+\dfrac{x-y}{\sqrt2}\vec d', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\vec a,\vec c,\vec d$는 서로 수직인 단위벡터이므로 계수는 각각 $\vec e$와의 내적이다.
    steps:
    - {id: 3a, content: '$k=\vec a\cdot\vec e$, $l=\vec c\cdot\vec e$, $m=\vec d\cdot\vec e$', criteria: [3.M1, 3.A1]}
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.59
    steps:
    - id: 3b-1
      content: |
        $\vec a$, $\vec c$, $\vec d$는 서로 수직인 공간 단위벡터이므로 $\vec e=k\vec a+l\vec c+m\vec d$로 나타낼 수 있다. 양변을 $\vec a$로 내적하면 $\vec a\cdot\vec e=k\vec a\cdot\vec a+l\vec a\cdot\vec c+m\vec a\cdot\vec d=k$. 마찬가지로 $\vec c$, $\vec d$로 내적하면 $l=\vec c\cdot\vec e$, $m=\vec d\cdot\vec e$.
      criteria: [3.M1, 3.R1]
    - id: 3b-2
      content: |
        【나】에 의해 $k=\dfrac{x+y+z}{\sqrt3}$, $l=\dfrac{x+y-2z}{\sqrt6}$, $m=\dfrac{x-y}{\sqrt2}$이므로
        $$\vec e=\dfrac{x+y+z}{\sqrt3}\vec a+\dfrac{x+y-2z}{\sqrt6}\vec c+\dfrac{x-y}{\sqrt2}\vec d.$$
      criteria: [3.A1]
  - id: S3-ALT
    audience: ALT
    method_no: 2
    key_idea: 해설집 별해(p.60) — 성분 비교 연립.
    steps:
    - id: 3c-1
      content: |
        $x=\dfrac k{\sqrt3}+\dfrac l{\sqrt6}+\dfrac m{\sqrt2}$, $y=\dfrac k{\sqrt3}+\dfrac l{\sqrt6}-\dfrac m{\sqrt2}$, $z=\dfrac k{\sqrt3}-\dfrac{2l}{\sqrt6}$을 연립해 같은 $k,l,m$을 얻는다.
      criteria: [3.M1, 3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 6
      evidence: $\vec e=k\vec a+l\vec c+m\vec d$로 두고 내적(또는 성분 연립)으로 계수를 구하는 식이 있다.
      depends_on: []
      ft: {allowed: true, from: [1.A1, 2.A1], max_points: 4}
      steps: [3a, 3b-1, 3c-1]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: $\vec a\cdot\vec c=\vec a\cdot\vec d=\vec c\cdot\vec d=0$, 크기 1임을 근거로 계수가 내적임을 밝혔다.
      depends_on: []
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: $\vec e=\dfrac{x+y+z}{\sqrt3}\vec a+\dfrac{x+y-2z}{\sqrt6}\vec c+\dfrac{x-y}{\sqrt2}\vec d$를 적었다.
      depends_on: [3.M1]
      steps: [3a, 3b-2, 3c-1]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-2508}
  misconceptions:
  - id: MC-GEO-2508
    outcome_code: '70'
    wrong_work: '단위화하지 않은 $(1,1,-2)$, $(1,-1,0)$을 써서 계수를 $x+y-2z$, $x-y$로 적음'
    detect_cue: 계수에 $\sqrt6$, $\sqrt2$ 분모가 없음
    feedback: 계수 = 내적은 단위벡터일 때만 성립합니다. (1)(2)의 단위벡터를 그대로 쓰세요.
    remedy: [RL-1]

