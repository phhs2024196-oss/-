stimuli:
- label: 가
  body: |
    좌표평면 위의 두 점 $A(x_1,y_1)$, $B(x_2,y_2)$ 사이의 거리는
    $$\overline{AB}=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}.$$
    『고등학교 수학』
- label: 나
  body: |
    수직선 위를 움직이는 점 $P$의 시각 $t$에서의 위치 $x$가 $x=f(t)$일 때 시각 $t$에서 점 $P$의 속도는 $v=\displaystyle\lim_{\Delta t\to0}\dfrac{\Delta x}{\Delta t}=\dfrac{dx}{dt}$이다. 속도의 절댓값 $\lvert v\rvert$를 시각 $t$에서 점 $P$의 속력이라고 한다.
    『고등학교 수학 Ⅱ』
- label: 다
  body: |
    함수 $x=f(t)$, $y=g(t)$가 $t$에 대하여 미분가능하고 $f'(t)\neq0$이면
    $$\dfrac{dy}{dx}=\dfrac{\ \dfrac{dy}{dt}\ }{\ \dfrac{dx}{dt}\ }=\dfrac{g'(t)}{f'(t)}.$$
    『고등학교 미적분』
- label: 라
  body: |
    음함수 표현 $f(x,y)=0$에서 $y$를 $x$의 함수로 보고 양변을 $x$에 대하여 미분하여 $\dfrac{dy}{dx}$를 구한다.
    『고등학교 미적분』

stem: |
  $x$축 위의 점 $P(x,0)$과 $y$축 위의 점 $Q(0,y)$ 사이의 거리가 5로 일정하게 고정되어 $x,\ y>0$인 영역에서 0이 아닌 속력으로 움직인다고 하자. 점 $P$의 속력이 점 $Q$의 속력의 절반이 될 때의 점 $P$와 점 $Q$의 좌표를 구하고 풀이과정을 서술하시오. [30점]

subparts:
- id: '1'
  stem: |
    위 논제의 점 $P$와 점 $Q$의 좌표를 구하시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: 'P(2\sqrt5,\ 0),\ Q(0,\ \sqrt5)', equivalents: ['P(2√5,0), Q(0,√5)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 거리 조건을 시간에 대해 미분하면 $x\dfrac{dx}{dt}+y\dfrac{dy}{dt}=0$이므로 속력의 비는 좌표의 역비이다.
    steps:
    - {id: 1a, content: '$\dfrac{|dy/dt|}{|dx/dt|}=\dfrac xy=2$, $x^2+y^2=25$ ⇒ $x=2\sqrt5$, $y=\sqrt5$', criteria: [1.R1, 1.A1]}
    hint_ladder:
    - 거리가 5라는 조건을 $x$, $y$의 식으로 쓰자.
    - $\dfrac{dy}{dx}$를 두 점의 속도로 나타내 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.48
    steps:
    - id: 1b-1
      content: |
        점 $P(x,0)$과 점 $Q(0,y)$ 사이의 거리가 5로 고정되어 있으므로 제시문 【가】의 거리 공식에 따라 $\sqrt{(x-0)^2+(y-0)^2}=5$이고, 양변을 제곱하면
        $$x^2+y^2=25.\quad\cdots(1)$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        제시문 【라】의 음함수의 미분법으로 (1)을 미분하면
        $$2x+2y\dfrac{dy}{dx}=0.\quad\cdots(2)$$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $x$와 $y$를 시각 $t$의 함수로 보면 제시문 【다】와 식 (2)에 의하여
        $$\dfrac{\ \dfrac{dy}{dt}\ }{\ \dfrac{dx}{dt}\ }=\dfrac{dy}{dx}=-\dfrac{x}{y}.\quad\cdots(3)$$
      criteria: [1.M3]
    - id: 1b-4
      content: |
        문제의 조건에서 제시문 【나】에 의해 $\left|\dfrac{dx}{dt}\right|=\dfrac12\left|\dfrac{dy}{dt}\right|\neq0$이고 $x,y>0$이므로, 식 (3)의 절댓값을 취하면 $\dfrac xy=2$, 즉 $x=2y$.
      criteria: [1.R1]
    - id: 1b-5
      content: |
        이를 식 (1)에 대입하면 $5y^2=25$, $y>0$이므로 $y=\sqrt5$, $x=2\sqrt5$. 즉 $P$의 좌표는 $(2\sqrt5,\ 0)$, $Q$의 좌표는 $(0,\ \sqrt5)$이다.
      criteria: [1.A1, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: 거리 조건을 $x^2+y^2=25$로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: 음함수 미분으로 $2x+2y\dfrac{dy}{dx}=0$(또는 $t$로 미분한 $x\dfrac{dx}{dt}+y\dfrac{dy}{dt}=0$)을 얻었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 6
      evidence: $\dfrac{dy/dt}{dx/dt}=-\dfrac xy$로 두 점의 속도의 비를 좌표로 나타냈다.
      depends_on: []
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: 속력 조건과 $x,y>0$, 속력 $\neq0$을 근거로 $\dfrac xy=2$($x=2y$)를 이끌었다.
      depends_on: []
      steps: [1a, 1b-4]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $x=2\sqrt5$, $y=\sqrt5$를 구했다.
      depends_on: [1.M1, 1.R1]
      steps: [1a, 1b-5]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: $P(2\sqrt5,\ 0)$, $Q(0,\ \sqrt5)$로 좌표를 답했다.
      depends_on: [1.M1, 1.R1]
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
