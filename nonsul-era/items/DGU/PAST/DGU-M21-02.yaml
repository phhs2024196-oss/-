stimuli:
- label: 가
  body: |
    함수 $f:X\to Y$에서 정의역 $X$의 임의의 두 원소 $x_1$, $x_2$에 대하여
    $$x_1\neq x_2\text{ 이면 }f(x_1)\neq f(x_2)$$
    일 때, 함수 $f$를 일대일함수라고 한다.
    『고등학교 수학』
- label: 나
  body: |
    함수 $f(x)$가 어떤 구간에서 미분가능하고, 이 구간의 모든 $x$에 대하여
    (i) $f'(x)>0$이면 $f(x)$는 이 구간에서 증가한다.
    (ii) $f'(x)<0$이면 $f(x)$는 이 구간에서 감소한다.
    『고등학교 수학 Ⅱ』
- label: 다
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\neq f(b)$이면 $f(a)$와 $f(b)$ 사이의 임의의 실수 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
    『고등학교 수학 Ⅱ』
- label: 라
  body: |
    표본공간이 $S$인 어떤 시행에서 각 근원사건이 일어날 가능성이 모두 같은 정도로 기대될 때, 사건 $A$가 일어날 확률 $P(A)$를
    $$P(A)=\dfrac{n(A)}{n(S)}$$
    로 정의하고, 이것을 표본공간 $S$에서 사건 $A$가 일어날 수학적 확률이라고 한다.
    『고등학교 확률과통계』

stem: |
  주사위를 3번 던져서 나온 숫자를 순서대로 $a,b,c$라고 할 때, 삼차 함수 $f(x)=x^3+ax^2+bx+c$가 일대일 함수일 확률을 구하고 풀이과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    위 논제의 확률을 구하시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: '\dfrac49', equivalents: ['4/9', '96/216'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 일대일 $\iff$ $a^2\le3b$. $a=1,2,3,4$일 때 $b$는 각각 6, 5, 4, 1개.
    steps:
    - {id: 1a, content: '$6+5+4+1=16$, $\dfrac{16}{36}=\dfrac49$', criteria: [1.A1, 1.A2]}
    hint_ladder:
    - 삼차함수가 극댓값을 가지면 같은 함숫값을 두 번 가질 수 있는가?
    - $f'(x)\ge0$이 항상 성립할 조건을 판별식으로 쓰자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.49
    steps:
    - id: 1b-1
      content: |
        삼차함수 $f(x)$가 증가하다가 감소하거나 감소하다가 증가하면 극댓값 또는 극솟값을 갖는다. 만일 극댓값을 가지면 제시문 【다】에 의하여 극댓값보다 작은 어떤 값 $k$에 대하여 증가하는 구간에서 $f(c_1)=k$인 $c_1$이 존재하고, 감소하는 구간에서 $f(c_2)=k$인 $c_2$가 존재한다. 따라서 제시문 【가】에 의해 $f(x)$는 일대일함수가 아니다. 극소를 가져도 마찬가지이다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        따라서 $f(x)$가 일대일함수인 것은 $f(x)$가 실수 전체에서 증가(또는 감소)함수인 것이다. 즉 도함수 $f'(x)=3x^2+2ax+b$가 모든 $x$에 대하여 $f'(x)\ge0$(또는 $f'(x)\le0$)이고, 이는 이차방정식 $f'(x)=0$이 중근이나 허근을 갖는 것, 곧 판별식 $\dfrac D4=a^2-3b\le0$이다.
        (중근일 때도 $f'(x)=0$인 점이 하나뿐이고 그 밖에서 $f'(x)>0$이므로 제시문 【나】에 의해 $f$는 증가한다.)
      criteria: [1.M1, 1.R2]
    - id: 1b-3
      content: |
        $a^2-3b\le0$을 만족하는 $a,b$의 순서쌍의 개수는 $a=1$일 때 $b=1,\dots,6$, $a=2$일 때 $b=2,\dots,6$, $a=3$일 때 $b=3,\dots,6$, $a=4$일 때 $b=6$으로 모두 16가지이다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        상수항 $c$의 값은 $f(x)$가 일대일함수인지 아닌지에 관계가 없으므로 무시하면, 표본공간의 $a,b$의 순서쌍의 개수는 36개이고 제시문 【라】에 의해 구하는 확률은 $\dfrac{16}{36}=\dfrac49$이다.
      criteria: [1.M2, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 8
      evidence: 극값이 있으면 사잇값 정리로 같은 함숫값을 갖는 서로 다른 두 점이 존재해 일대일이 아님을 서술했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: 일대일 조건을 $f'(x)\ge0$, 즉 $a^2-3b\le0$으로 바꾸었다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.R2
      mark_type: R
      points: 3
      evidence: 판별식이 $0$인 경우(중근)도 증가함수라 일대일임을 밝혔다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 조건을 만족하는 $(a,b)$ 16쌍을 정확히 셌다.
      depends_on: [1.M1]
      steps: [1a, 1b-3]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $c$가 무관함을 밝히고 표본공간(36쌍 또는 216가지)으로 수학적 확률을 세웠다.
      depends_on: []
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 확률 $\dfrac49$를 적었다.
      depends_on: [1.M1, 1.M2]
      steps: [1a, 1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2411}
  misconceptions:
  - id: MC-CAL-2411
    outcome_code: '70'
    wrong_work: '판별식 $a^2-3b<0$만 세어 $(3,3)$을 빼고 $\dfrac{15}{36}=\dfrac5{12}$로 답함'
    detect_cue: 답이 $\dfrac5{12}$
    feedback: $f'(x)=0$이 중근이면 그 한 점에서만 $f'=0$이고 함수는 계속 증가합니다. 등호를 포함하세요.
    remedy: [RL-1]

