  - '$g''(x)=2+\cos x>0$, $g(x)\to\pm\infty$ ⇒ $g$의 치역은 실수 전체 ⇒ $f''''$의 치역 = $\dfrac{6+4\cos x}{2+\cos x}$의 치역'
