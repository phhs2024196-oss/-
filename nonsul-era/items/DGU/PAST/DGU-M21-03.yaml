stimuli:
- label: 가
  body: |
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는 $y'=f'(g(x))g'(x)$이다.
    『고등학교 미적분』
- label: 나
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때 $\alpha,\beta$를 포함하는 구간에서 연속이면
    $$\int_a^b f(x)dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
    이다.
    『고등학교 미적분』

stem: |
  함수 $f(x)$의 이계도함수 $f''(x)$가 실수 전체의 집합에서 존재하고,
  모든 실수 $x$에 대하여 $f'(2x+\sin x)=6x+4\sin x$가 성립한다. $f(0)=0$일 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    1) $f(4\pi)$의 값과 $\displaystyle\int_0^\pi f(2x+\sin x)\,dx$의 값을 구하고 풀이과정을 서술하시오. [20점]
  points: 20
  depends_on: []
  answer: {kind: value, value: 'f(4\pi)=24\pi^2,\ \int_0^\pi f(2x+\sin x)dx=2\pi^3+9\pi', equivalents: ['24π^2, π(2π^2+9)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(x)=2x+\sin x$라 하면 $g(0)=0$, $f(0)=0$이므로 $f(g(x))=\int_0^x f'(g(t))g'(t)dt$.
    steps:
    - {id: 1a, content: '$f(2x+\sin x)=6x^2+6x\sin x-2\cos^2x-2\cos x+4$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $f(4\pi)$는 $f(2x+\sin x)$에서 $x$가 얼마일 때인가?
    - 제시문 【나】로 $f(2x+\sin x)$를 적분으로 나타내자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.50
    steps:
    - id: 1b-1
      content: |
        $f(0)=0$이고 $2\cdot0+\sin0=0$이므로 제시문 【나】에 의해 모든 실수 $x$에 대하여
        $$f(2x+\sin x)=\int_0^x f'(2t+\sin t)(2+\cos t)\,dt$$
        가 성립한다. 위 식에 $f'(2x+\sin x)=6x+4\sin x$를 대입하면 $f(2x+\sin x)=\displaystyle\int_0^x(6t+4\sin t)(2+\cos t)\,dt$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이 적분을 계산하면
        $$f(2x+\sin x)=\Big[6t^2+6t\sin t-2\cos^2t-2\cos t\Big]_0^x=6x^2+6x\sin x-2\cos^2x-2\cos x+4.$$
      criteria: [1.M2, 1.A1]
    - id: 1b-3
      content: |
        $x=2\pi$를 대입하면 $2\cdot2\pi+\sin2\pi=4\pi$이므로 $f(4\pi)=24\pi^2$.
      criteria: [1.A2]
    - id: 1b-4
      content: |
        $$\int_0^\pi f(2x+\sin x)\,dx=\Big[2x^3+3x-6x\cos x+4\sin x-\sin x\cos x\Big]_0^\pi=2\pi^3+9\pi=\pi(2\pi^2+9).$$
        (동등한 표현 $6x^2+6x\sin x+2\sin^2x-2\cos x+2$ 등을 적분해도 같다.)
      criteria: [1.M3, 1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $f(0)=0$을 이용해 $f(2x+\sin x)=\int_0^x f'(2t+\sin t)(2+\cos t)dt$(치환적분)로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1a, 1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $(6t+4\sin t)(2+\cos t)$를 전개해 부분적분·삼각함수 적분으로 부정적분을 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $f(2x+\sin x)=6x^2+6x\sin x-2\cos^2x-2\cos x+4$(또는 동등식)를 적었다.
      depends_on: [1.M1, 1.M2]
      steps: [1a, 1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $x=2\pi$를 대입해 $f(4\pi)=24\pi^2$를 적었다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: 구한 식을 $0$부터 $\pi$까지 적분하는 과정(부정적분)을 적었다.
      depends_on: []
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: $\int_0^\pi f(2x+\sin x)dx=2\pi^3+9\pi$를 적었다.
      depends_on: [1.M3]
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2402}
  misconceptions:
  - id: MC-CAL-2402
    outcome_code: '70'
    wrong_work: '$f(2x+\sin x)=\int_0^x(6t+4\sin t)dt=3x^2-4\cos x+4$로 $g''(t)=2+\cos t$를 빠뜨림'
    detect_cue: $f(4\pi)=12\pi^2$
    feedback: $f(g(x))$를 적분으로 나타낼 때는 $f'(g(t))$에 $g'(t)$를 곱해야 합니다(제시문 【나】).
    remedy: [RL-1]
- id: '2'
  stem: |
    2) $f''(\pi+1)$의 값, 이계도함수 $f''(x)$의 최솟값 $m$과 최댓값 $M$을 구하고 풀이과정을 서술하시오. [20점]
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: 'f''''(\pi+1)=3,\ m=2,\ M=\dfrac{10}{3}', equivalents: ['3, 2, 10/3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f''(2x+\sin x)=\dfrac{6+4\cos x}{2+\cos x}=4-\dfrac2{2+\cos x}$이고 $2x+\sin x$가 실수 전체를 지나므로 $\cos x$의 범위 $[-1,1]$에서 최대·최소를 본다.
    steps:
    - {id: 2a, content: '$x=\dfrac\pi2$ ⇒ $f''''(\pi+1)=3$; $t=\cos x$ ⇒ $4-\dfrac2{2+t}\in\left[2,\dfrac{10}3\right]$', criteria: [2.A2, 2.A3]}
    hint_ladder:
    - 조건식의 양변을 $x$로 미분하자.
    - $2x+\sin x$의 치역은?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.51
    steps:
    - id: 2b-1
      content: |
        $f'(2x+\sin x)=6x+4\sin x$의 양변을 미분하면 제시문 【가】에 의해 $f''(2x+\sin x)(2+\cos x)=6+4\cos x$, 즉
        $$f''(2x+\sin x)=\dfrac{6+4\cos x}{2+\cos x}.$$
      criteria: [2.M1, 2.A1]
    - id: 2b-2
      content: |
        $x=\dfrac\pi2$를 대입하면 $2\cdot\dfrac\pi2+\sin\dfrac\pi2=\pi+1$이므로 $f''(\pi+1)=\dfrac{6}{2}=3$.
      criteria: [2.A2]
    - id: 2b-3
      content: |
        $h(x)=2x+\sin x$라 하면 $h'(x)=2+\cos x>0$이므로 $h(x)$는 증가하는 연속함수이고 $\displaystyle\lim_{x\to\infty}h(x)=\infty$, $\displaystyle\lim_{x\to-\infty}h(x)=-\infty$이므로 $h$의 치역은 실수 전체의 집합이다.
        그러므로 $f''(x)$의 최댓값과 최솟값은 $\dfrac{6+4\cos x}{2+\cos x}$의 최댓값과 최솟값과 각각 같다.
      criteria: [2.R1]
    - id: 2b-4
      content: |
        $t=\cos x\ (-1\le t\le1)$로 치환하면 $\dfrac{6+4t}{2+t}=4-\dfrac{2}{2+t}$이고 이는 $[-1,1]$에서 증가하는 함수이므로 $t=-1$일 때 최솟값 $2$, $t=1$일 때 최댓값 $\dfrac{10}{3}$을 갖는다. 따라서 $m=2$, $M=\dfrac{10}{3}$.
      criteria: [2.M2, 2.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 조건식의 양변을 미분하며 합성함수의 미분으로 $f''(2x+\sin x)(2+\cos x)$를 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $f''(2x+\sin x)=\dfrac{6+4\cos x}{2+\cos x}$를 적었다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: $x=\dfrac\pi2$를 대입해 $f''(\pi+1)=3$을 적었다.
      depends_on: [2.M1]
      steps: [2a, 2b-2]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: $2x+\sin x$가 증가하고 치역이 실수 전체임을 밝혀 $f''$의 최대·최소를 우변의 최대·최소로 바꿀 수 있는 근거를 적었다.
      depends_on: []
      steps: [2b-3]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: $t=\cos x$로 치환해 $4-\dfrac2{2+t}$의 증가성(또는 미분)으로 범위를 구했다.
      depends_on: []
      steps: [2b-4]
    - id: 2.A3
      mark_type: A
      points: 2
      evidence: $m=2$, $M=\dfrac{10}{3}$을 적었다.
      depends_on: [2.M2, 2.R1]
      steps: [2a, 2b-4]
    deductions:
    - code: D2-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2410}
  misconceptions:
  - id: MC-CAL-2410
    outcome_code: '70'
    wrong_work: '양변을 미분할 때 $g''(x)=2+\cos x$를 곱하지 않아 $f''''(2x+\sin x)=6+4\cos x$로 보고 $f''''(\pi+1)=6$, $m=2$, $M=10$으로 답함'
    detect_cue: $f''(\pi+1)=6$ 또는 $M=10$
    feedback: $\dfrac{d}{dx}f'(g(x))=f''(g(x))g'(x)$입니다. 안쪽 함수의 도함수를 곱하세요(제시문 【가】).
    remedy: [RL-2]

