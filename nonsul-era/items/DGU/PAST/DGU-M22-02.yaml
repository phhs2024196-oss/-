stimuli:
- label: 가
  body: |
    사건 $A,B$ 중 어느 한 사건이 일어나면 다른 사건은 일어나지 않을 때, 즉 $A\cap B=\phi$일 때, $A$와 $B$는 서로 배반이라고 하고 이 두 사건을 서로 배반사건이라고 한다.
    표본 공간 $S$의 사건 $A,B$에 대하여
    1) $\mathrm{P}(A\cup B)=\mathrm{P}(A)+\mathrm{P}(B)-\mathrm{P}(A\cap B)$
    2) $A,B$가 서로 배반 사건이면 $\mathrm{P}(A\cup B)=\mathrm{P}(A)+\mathrm{P}(B)$
    『고등학교 확률과 통계』
- label: 나
  body: |
    일반적으로 확률이 0이 아닌 사건 $A$가 일어났다고 가정할 때 사건 $B$가 일어날 확률을 사건 $A$가 일어났을 때 사건 $B$의 조건부확률이라 하고, 이것을 기호로
    $$\mathrm{P}(B\mid A)$$
    와 같이 나타낸다. 사건 $A$가 일어났을 때 사건 $B$의 조건부확률은
    $$\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}\qquad(\text{단, }\mathrm{P}(A)\neq0)$$
    이다.
    『고등학교 확률과 통계』
- label: 다
  body: |
    사건 $A$가 일어났을 때의 사건 $B$의 조건부 확률은
    $$\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}\qquad(\mathrm{P}(A)>0)$$
    이고, 이 식의 양변에 $\mathrm{P}(A)$를 곱하면
    $$\mathrm{P}(A\cap B)=\mathrm{P}(A)\mathrm{P}(B\mid A)$$
    이다. 같은 방법으로
    $$\mathrm{P}(A\cap B)=\mathrm{P}(B)\mathrm{P}(A\mid B)\qquad(\mathrm{P}(B)>0)$$
    이다.
    『고등학교 확률과 통계』

stem: |
  어느 지역에서 어떤 병에 걸린 사람의 비율은 1%라고 가정하자. 이 병을 진단하는 키트 C, D 두 가지가 새로이 개발되었다. 두 키트로 이 병을 진단할 때, 진단확률은 아래와 같다.
  [표]
  - 병에 걸린 사람을 병에 걸렸다고 정확하게 진단할 확률 — C 키트: 98%, D 키트: 99%
  - 병에 걸리지 않은 사람을 병에 걸렸다고 잘못 진단할 확률 — C 키트: 1%, D 키트: 2%
  이 지역에서 임의로 한 명을 선택하여 검사를 한 결과 병에 걸렸다고 진단하였을 때, 그 사람이 실제로 병에 걸렸을 확률은 C, D 두 키트 중 어느 키트가 높은지 제시문을 이용하여 설명하시오.

subparts:
- id: '1'
  stem: |
    위 논제에 답하시오.
  points: 30
  depends_on: []
  answer: {kind: choice, value: 'C\ \text{키트}\ \left(\dfrac{98}{197}>\dfrac{99}{297}=\dfrac13\right)', equivalents: ['C (98/197 > 1/3)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 양성 판정 확률 $\mathrm{P}(B)$를 참 양성과 거짓 양성으로 나눠 구한 뒤 $\mathrm{P}(A\mid B)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(B)}$를 비교한다.
    steps:
    - {id: 1a, content: 'C: $\dfrac{0.0098}{0.0197}=\dfrac{98}{197}$, D: $\dfrac{0.0099}{0.0297}=\dfrac13$', criteria: [1.M3, 1.A2]}
    hint_ladder:
    - 표의 98%는 어떤 조건부확률인가?
    - 병에 걸렸다고 진단되는 경우를 실제 환자와 비환자로 나누자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.43
    steps:
    - id: 1b-1
      content: |
        사건 $A$를 이 지역에서 임의로 선택된 사람이 병에 걸린 사건, 사건 $B$를 그 사람이 병에 걸렸다고 진단(양성)되는 사건이라 하자. 구하는 확률은 제시문 [나]에 의해 조건부확률 $\mathrm{P}(A\mid B)$이다. $\mathrm{P}(A)=0.01$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $A\cap B$와 $A^c\cap B$는 서로 배반이므로 제시문 [가]의 덧셈정리와 제시문 [다]의 곱셈정리에 의해
        $$\mathrm{P}(B)=\mathrm{P}(A\cap B)+\mathrm{P}(A^c\cap B)=\mathrm{P}(A)\mathrm{P}(B\mid A)+\mathrm{P}(A^c)\mathrm{P}(B\mid A^c).$$
        C 키트: $\mathrm{P}(B)=0.01\times0.98+0.99\times0.01=0.0197$,
        D 키트: $\mathrm{P}(B)=0.01\times0.99+0.99\times0.02=0.0297$.
      criteria: [1.M2, 1.A1]
    - id: 1b-3
      content: |
        조건부확률의 정의와 곱셈정리에 의해 $\mathrm{P}(A\mid B)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(B)}=\dfrac{\mathrm{P}(A)\mathrm{P}(B\mid A)}{\mathrm{P}(B)}$이므로
        C 키트: $\mathrm{P}(A\mid B)=\dfrac{0.0098}{0.0197}=\dfrac{98}{197}$, D 키트: $\mathrm{P}(A\mid B)=\dfrac{0.0099}{0.0297}=\dfrac{99}{297}=\dfrac13$.
      criteria: [1.M3, 1.A2]
    - id: 1b-4
      content: |
        $\dfrac{98}{197}>\dfrac{98}{294}=\dfrac13$이므로, 병에 걸렸다고 진단했을 때 실제로 병에 걸렸을 확률은 C 키트가 D 키트보다 높다.
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
