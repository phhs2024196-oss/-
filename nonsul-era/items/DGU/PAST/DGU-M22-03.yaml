key_idea: '$t=3h+\sin h$에서 $h''(t)=\dfrac1{3+\cos h}$, $f(t)=\int_0^{h}(t-3x-\sin x)dx+\int_h^{2\pi}(3x+\sin x-t)dx$를 미분하면 $f''(t)=2(h(t)-\pi)$.'
stuck: (2)에서 $f(t)$를 미분할 때 $h'(t)$가 곱해진 항이 $t=3h+\sin h$로 사라지는 것을 보는 단계
