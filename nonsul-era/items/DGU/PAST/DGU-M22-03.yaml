stimuli:
- label: 가
  body: |
    $x$의 함수 $y$가 음함수의 꼴 $f(x,y)=0$로 주어질 때, $f(x,y)=0$의 양변을 $x$에 대하여 미분하여 $\dfrac{dy}{dx}$를 구한다.
    『고등학교 미적분』
- label: 나
  body: |
    미분가능한 함수 $f(x)$의 역함수 $f^{-1}(x)$가 존재하고 미분가능할 때, 역함수 $y=f^{-1}(x)$의 도함수는
    $$(f^{-1})'(x)=\dfrac{1}{f'(f^{-1}(x))}$$
    이다.
    『고등학교 미적분』

stem: |
  제시문을 바탕으로 아래 두 문제의 답과 풀이과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    1) 양수 $t$에 대하여 직선 $y=t$와 곡선 $y=3x+\sin x$이 만나는 점의 $x$좌표를 $h(t)$라고 하자. $h'(t)$가 $t=a$에서 최솟값을 가질 때, 양수 $a$의 최솟값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '6\pi', equivalents: ['6π'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $h'(t)=\dfrac1{3+\cos h(t)}$의 최솟값 $\dfrac14$은 $\cos h=1$일 때이고 그때 $t=3h$.
    steps:
    - {id: 1a, content: '$\cos h(a)=1$ ⇒ $h(a)=2k\pi$, $a=6k\pi$ ⇒ 최소 양수 $6\pi$', criteria: [1.R1, 1.M2]}
    hint_ladder:
    - 교점 조건을 $t$와 $h(t)$의 관계식으로 쓰자.
    - 양변을 $t$로 미분하면 $h'(t)$가 나온다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.44
    steps:
    - id: 1b-1
      content: |
        주어진 조건에 의해 $t=3h(t)+\sin h(t)$를 만족한다. 제시문 [가]의 음함수 미분법(또는 [나]의 역함수 미분법)에 의해 $1=(3+\cos h(t))h'(t)$이므로
        $$h'(t)=\dfrac{1}{3+\cos h(t)}.$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $3+\cos h(t)\le4$이므로 $h'(t)\ge\dfrac14$이고, $t=a$에서 $h'(t)$가 최솟값을 가지므로 $\cos h(a)=1$이다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        그러므로 $a=3h(a)+\sin h(a)$이고 $\sin^2h(a)=1-\cos^2h(a)=0$이므로 $a=3h(a)$를 만족한다.
        따라서 $\cos h(a)=\cos\dfrac a3=1$을 만족하는 가장 작은 양수 $a$는 $6\pi$이다.
      criteria: [1.M2, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $t=3h(t)+\sin h(t)$를 미분하여 $h'(t)=\dfrac1{3+\cos h(t)}$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: $h'(t)$가 최소일 조건이 $\cos h(a)=1$임을 근거(분모 최대)와 함께 적었다.
      depends_on: []
      steps: [1a, 1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $\sin h(a)=0$을 써서 $a=3h(a)$, $\cos\dfrac a3=1$로 바꾸었다.
      depends_on: []
      steps: [1a, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 양수 $a$의 최솟값 $6\pi$를 적었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2405}
  misconceptions:
  - id: MC-CAL-2405
    outcome_code: '70'
    wrong_work: '$h''(t)$가 최소인 조건을 $\cos h=-1$로 잡아 $h=\pi$, $a=3\pi$로 답함'
    detect_cue: 답이 $3\pi$
    feedback: $h'(t)=\dfrac1{3+\cos h}$는 분모가 클수록 작아집니다. 분모가 최대인 $\cos h=1$을 찾으세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    2) $0\le t\le6\pi$인 실수 $t$에 대하여 함수 $f(t)$를 $f(t)=\displaystyle\int_0^{2\pi}\lvert 3x+\sin x-t\rvert\,dx$라고 하자. 함수 $f(t)$가 $t=a$에서 최솟값을 가질 때, $a$의 값을 구하시오. (단, $0\le a\le6\pi$이다.) [25점]
  points: 25
  depends_on: ['1']
  answer: {kind: value, value: '3\pi', equivalents: ['3π'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 교점 $h(t)$에서 적분을 나누면 $f'(t)=2(h(t)-\pi)$이므로 $h(t)=\pi$, 즉 $t=3\pi$에서 최소.
    steps:
    - {id: 2a, content: '$f(t)=2\left(th-\dfrac{3h^2}{2}+\cos h\right)-2\pi t-2+6\pi^2$, $f''(t)=2(h-\pi)$', criteria: [2.A1, 2.M3]}
    hint_ladder:
    - $3x+\sin x-t$의 부호가 바뀌는 점은 1)의 $h(t)$이다.
    - $f(t)$를 $h(t)$와 $t$로 나타낸 뒤 미분하자. $t=3h+\sin h$를 쓰면 정리된다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.44
    steps:
    - id: 2b-1
      content: |
        함수 $y=3x+\sin x$에서 $y'=3+\cos x>0$이므로 $y=3x+\sin x$는 치역이 실수 전체의 집합인 증가함수이다. 그리고 $0\le x\le2\pi$에서 $0\le y\le6\pi$의 범위를 갖는다.
        따라서 $0\le t\le6\pi$를 만족하는 실수 $t$에 대하여 $t=3h(t)+\sin h(t)$를 만족하는 $h(t)\ (0\le h(t)\le2\pi)$가 존재한다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $x<h(t)$이면 $3x+\sin x<t$, $x>h(t)$이면 $3x+\sin x>t$이므로
        $$f(t)=\int_0^{h(t)}\{t-(3x+\sin x)\}\,dx+\int_{h(t)}^{2\pi}(3x+\sin x-t)\,dx.$$
        적분하면
        $$f(t)=2\left(th(t)-\dfrac{3h(t)^2}{2}+\cos h(t)\right)-2\pi t-2+6\pi^2.$$
      criteria: [2.M2, 2.A1]
    - id: 2b-3
      content: |
        $0<t<6\pi$에서 미분하면
        $f'(t)=2h'(t)\big(t-3h(t)-\sin h(t)\big)+2\big(h(t)-\pi\big)$이고 $t=3h(t)+\sin h(t)$이므로 $f'(t)=2\big(h(t)-\pi\big)$.
      criteria: [2.M3]
    - id: 2b-4
      content: |
        $0<t<6\pi$에서 $h(t)$는 $0<h(t)<2\pi$이고 증가하는 연속함수이므로 $f'(t)$는 $h(t)=\pi$인 $t$의 좌우에서 음에서 양으로 바뀐다. 따라서 $h(t)=\pi$인 $t$에서 $f(t)$는 최솟값을 갖는다.
        $t=3h(t)+\sin h(t)$에서 $h(t)=\pi$이면 $t=3\pi$이다. 따라서 $a=3\pi$.
      criteria: [2.R1, 2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $y=3x+\sin x$가 증가함수이고 $0\le t\le6\pi$이면 $0\le h(t)\le2\pi$인 교점이 존재함을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 6
      evidence: 절댓값 적분을 $x=h(t)$에서 나누어 부호를 정한 두 적분의 합으로 썼다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $f(t)=2\left(th-\dfrac{3h^2}{2}+\cos h\right)-2\pi t-2+6\pi^2$(또는 동등식)을 적었다.
      depends_on: [2.M2]
      steps: [2a, 2b-2]
    - id: 2.M3
      mark_type: M
      points: 5
      evidence: $f(t)$를 $t$로 미분하고 $t=3h+\sin h$를 이용해 $f'(t)=2(h(t)-\pi)$로 정리했다.
      depends_on: []
      steps: [2a, 2b-3]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: $h(t)$가 증가함을 근거로 $f'(t)$의 부호 변화(음→양)를 밝혀 최소임을 판정했다.
      depends_on: []
      steps: [2b-4]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: $a=3\pi$를 적었다.
      depends_on: [2.M3, 2.R1]
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2406}
  misconceptions:
  - id: MC-CAL-2406
    outcome_code: '70'
    wrong_work: '절댓값을 그대로 벗겨 $f(t)=\int_0^{2\pi}(3x+\sin x-t)dx=6\pi^2-2\pi t$로 보고 $a=6\pi$로 답함'
    detect_cue: 답이 $6\pi$이거나 $f(t)$가 $t$의 일차식
    feedback: 피적분함수의 부호가 $x=h(t)$에서 바뀝니다. 그 점에서 적분 구간을 나누세요.
    remedy: [RL-2]

