  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2305}
  - {code: '71', misconception: MC-CAL-2306}
  misconceptions:
  - id: MC-CAL-2305
    outcome_code: '70'
    wrong_work: '$D''(t)=0$의 첫 극대점 $t=\dfrac{\pi}{2}$($D=\dfrac12$)를 처음 최대 시각으로 답하고 Q의 가속도를 $2$로 씀'
    detect_cue: 시각의 답이 $\dfrac{\pi}{2}$
    feedback: 극대가 곧 최대는 아닙니다. 극댓값들을 모두 비교해 가장 큰 값이 처음 나오는 시각을 찾으세요.
    remedy: [RL-1]
  - id: MC-CAL-2306
    outcome_code: '71'
    wrong_work: '속도 조건 $-4\cos t\sin t=-c\cos t$의 양변을 $\cos t$로 나누어 경우를 빠뜨리거나, $c=2$와 $c=8$을 모두 답함'
    detect_cue: '$c=8$이 답에 남아 있거나 $\cos t=0$ 경우에 대한 언급이 없음'
    feedback: 식을 $\cos t$로 나누기 전에 $\cos t=0$인 경우를 따로 확인하고, $\sin t=\dfrac c4$의 범위로 $c$를 거르세요.
    remedy: [RL-2]

