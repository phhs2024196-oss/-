stimuli:
- label: 가
  body: |
    $a$를 포함하는 어떤 열린구간에서 미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면 $f'(a)=0$이다.
    -『고등학교 수학Ⅱ』
- label: 나
  body: |
    수직선 위를 움직이는 점 P의 시각 $t$에서의 위치 $x$가 $x=f(t)$일 때, 시각 $t$에서의 점 P의 속도를 $v(t)$, 가속도를 $a(t)$라고 하면 다음이 성립함을 알고 있다.
    $$v(t)=\dfrac{dx}{dt}=f'(t),\qquad a(t)=\dfrac{dv}{dt}=\dfrac{d^2x}{dt^2}=f''(t)$$
    -『고등학교 미적분』

stem: |
  수직선 위를 움직이는 두 점 P, Q의 시각 $t\ge0$에서의 위치를 각각 $x$, $y$라고 하면 $x=2\cos^2t$, $y=\dfrac54c-c\sin t\ (c>0)$이다. 두 점 P, Q는 1회 이상 만나고, 만날 때마다 두 점의 속도가 일치한다고 하자. 양수 $c$값을 정하고 두 점 P와 Q 사이 거리가 시각 $t=0$이후 처음으로 최대가 되는 시각 $t$와 이때 점 Q의 속도 및 가속도를 각각 구하여라.

subparts:
- id: '1'
  stem: |
    위 논제의 $c$, 시각 $t$, 그때 점 Q의 속도와 가속도를 구하시오.
  points: 40
  depends_on: []
  answer: {kind: value, value: 'c=2,\ t=\dfrac{3\pi}{2},\ Q의 속도 0,\ 가속도 -2', equivalents: ['c=2, t=3π/2, v=0, a=-2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\cos t(4\sin t-c)=0$에서 $\sin t=\dfrac c4$, 위치 조건에서 $(c-2)(c-8)=0$ → $c=2$; $D=2(\sin t-\tfrac12)^2$은 $\sin t=-1$에서 최대.'
    steps:
    - {id: 1a, content: '$c=2$, $t=\dfrac{3\pi}{2}$, $y''=-2\cos t=0$, $y''''=2\sin t=-2$', criteria: [1.A3]}
    hint_ladder:
    - 만나는 시각에서 위치와 속도가 모두 같다는 두 식을 세워 보자.
    - 속도 조건의 식을 인수분해하면 경우가 나뉜다.
    - 두 점 사이 거리를 $\sin t$만의 식으로 정리해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.36
    steps:
    - id: 1b-1
      content: |
        [1단계] 두 점이 1회 이상 만나고 만날 때마다 속도가 같으므로, 제시문 【나】에 의해 두 방정식
        $2\cos^2t=\dfrac54c-c\sin t$ (위치), $-4\cos t\sin t=-c\cos t$ (속도)
        를 동시에 만족하는 $t\ge0$이 하나 이상 있어야 한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        [2단계] 속도 조건을 정리하면 $\cos t(4\sin t-c)=0$. $\cos t=0$이면 위치 조건에서 $0=c\left(\dfrac54-\sin t\right)$인데 $c>0$, $\dfrac54-\sin t\ge\dfrac14>0$이므로 두 방정식을 동시에 만족할 수 없다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        $4\sin t-c=0$이면 $\sin t=\dfrac c4$를 위치 조건에 넣어 $2\left(1-\dfrac{c^2}{16}\right)=\dfrac54c-\dfrac{c^2}{4}$, 정리하면 $c^2-10c+16=(c-2)(c-8)=0$.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        $\dfrac c4=\sin t\le1$이므로 $c=2$. 이때 $\sin t=\dfrac12$인 모든 $t\ge0$에서 두 점이 만나고(만나는 시각은 이때뿐), 그때 속도도 같다.
      criteria: [1.A1]
    - id: 1b-5
      content: |
        [3단계] 두 점 사이 거리는 $D(t)=\left\lvert\dfrac52-2\sin t-2\cos^2t\right\rvert=\left\lvert2\sin^2t-2\sin t+\dfrac12\right\rvert=2\left(\sin t-\dfrac12\right)^2$.
      criteria: [1.M3]
    - id: 1b-6
      content: |
        $D'(t)=4\left(\sin t-\dfrac12\right)\cos t$이므로 제시문 【가】에 의해 극값은 $\sin t=\dfrac12$ 또는 $\cos t=0$일 때 나온다. $\sin t=\dfrac12$이면 두 점이 만나므로($D=0$) 극소이다. $\cos t=0$, 즉 $t=\left(n-\dfrac12\right)\pi$ $(n=1,2,3,\cdots)$이면
        $D\left(\dfrac{\pi}{2}\right)=\dfrac12$, $D\left(\dfrac{3\pi}{2}\right)=\dfrac92$, $D\left(\dfrac{5\pi}{2}\right)=\dfrac12$, $D\left(\dfrac{7\pi}{2}\right)=\dfrac92$, $\cdots$가 반복되므로 최댓값은 $\dfrac92$이고, 처음으로 최댓값을 갖는 시각은 $t=\dfrac{3\pi}{2}$이다.
      criteria: [1.R2, 1.A2]
    - id: 1b-7
      content: |
        [4단계] $y'=-2\cos t$, $y''=2\sin t$이므로 $t=\dfrac{3\pi}{2}$에서 점 Q의 속도는 $-2\cos\dfrac{3\pi}{2}=0$, 가속도는 $2\sin\dfrac{3\pi}{2}=-2$이다.
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: 만나는 시각에서 위치가 같다는 식과 속도(【나】로 미분)가 같다는 식을 함께 세웠다.
      depends_on: []
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 6
      evidence: 속도 조건을 $\cos t(4\sin t-c)=0$으로 인수분해하고 $\cos t=0$인 경우가 위치 조건과 모순임을 보였다.
      depends_on: []
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: $\sin t=\dfrac c4$를 위치 조건에 대입해 $c$에 대한 이차방정식 $(c-2)(c-8)=0$을 얻었다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: $\sin t\le1$로 $c=8$을 제외하고 $c=2$를 적었다.
      depends_on: [1.M2]
      steps: [1b-4]
    - id: 1.M3
      mark_type: M
      points: 6
      evidence: 거리를 $D(t)=2\left(\sin t-\dfrac12\right)^2$(또는 동치인 $\sin t$의 식)로 정리했다.
      depends_on: []
      steps: [1b-5]
    - id: 1.R2
      mark_type: R
      points: 4
      evidence: 임계점($\sin t=\dfrac12$, $\cos t=0$)에서의 값을 비교해 최댓값 $\dfrac92$와 처음 시각을 판정한 근거를 적었다.
      depends_on: []
      steps: [1b-6]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: 처음으로 최대가 되는 시각 $t=\dfrac{3\pi}{2}$를 적었다.
      depends_on: [1.M3, 1.R2]
      steps: [1b-6]
    - id: 1.A3
      mark_type: A
      points: 3
      evidence: 그때 Q의 속도 $0$, 가속도 $-2$를 적었다.
      depends_on: [1.M3]
      steps: [1a, 1b-7]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
