intent: '"만날 때마다 속도가 일치한다"는 조건을 위치·속도의 연립방정식으로 바꾸고 인수에 따라 경우를 나눠 상수를 결정한 뒤, 두 점 사이 거리 함수의 극값을 비교해 처음으로 최대가 되는 시각과 그때의 속도·가속도를 구하는 능력을 본다.'
key_idea: '속도 조건 $-4\cos t\sin t=-c\cos t\iff\cos t(4\sin t-c)=0$에서 $\cos t=0$은 불가능, $\sin t=\dfrac c4$를 위치 조건에 넣어 $c=2$. 거리 $D(t)=2\left(\sin t-\dfrac12\right)^2$.'
stuck: 속도 조건을 인수분해해 $\cos t=0$인 경우를 배제하고, $c$에 대한 이차방정식에서 $\sin t\le1$로 $c=8$을 버리는 단계
