    - id: 1.R1
      mark_type: R
      points: 6
      evidence: 제시문 【다】(또는 【나】)를 근거로 시행 횟수가 충분히 커서 통계적 확률을 수학적 확률 $p$로 쓸 수 있다고 적었다.
      depends_on: []
      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: 둥근 면의 넓이 $10(2\pi-\theta)$(호의 길이 $2\pi-\theta$, 【가】)와 평평한 면의 넓이 $10d$를 적었다.
      depends_on: []
      steps: [1b-4]
    - id: 1.M3
      mark_type: M
      points: 6
      evidence: 규칙 ②에 맞게 (배의 확률):(등의 확률)=(둥근 면):(평평한 면)의 비례식을 세웠다.
      depends_on: []
      steps: [1b-5]
    - id: 1.A2
      mark_type: A
