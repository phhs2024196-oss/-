stimuli:
- label: 가
  body: |
    반지름의 길이가 $r$, 중심각의 크기가 $\theta$인 부채꼴의 호의 길이를 $l$, 넓이를 $S$라고 하면 $l=r\theta$, $S=\dfrac12r^2\theta=\dfrac12rl$
    『고등학교 수학Ⅰ』
- label: 나
  body: |
    어떤 시행에서 사건 $A$가 일어날 수학적 확률이 $p$이고, $n$회의 독립시행에서 사건 $A$가 일어나는 횟수를 $X$라고 하면 임의의 작은 양수 $h$에 대하여 확률 $\mathrm{P}\left(\left\lvert\dfrac{X}{n}-p\right\rvert<h\right)$는 $n$이 한없이 커짐에 따라 1에 한없이 가까워진다.
    『고등학교 수학Ⅰ』
- label: 다
  body: |
    일반적으로 동일한 시행을 $n$번 반복해서 사건 $A$가 $r_n$번 일어난다고 하자.
    시행 횟수 $n$이 한없이 커짐에 따라 상대도수 $\dfrac{r_n}{n}$이 일정한 값에 가까워지면 이 일정한 값을 사건 $A$가 일어날 통계적 확률이라고 한다. 현실적으로 시행 횟수 $n$을 한없이 크게 할 수 없으므로 $n$이 충분히 클 때의 상대도수 $\dfrac{r_n}{n}$을 통계적 확률로 사용한다.
    한편, 어떤 시행에서 사건 $A$가 일어날 수학적 확률이 $p$일 때, 그 시행 횟수 $n$을 충분히 크게 하면 사건 $A$가 일어나는 상대도수 $\dfrac{r_n}{n}$은 수학적 확률 $p$에 가까워진다는 것이 알려져 있다.
    따라서 통계적 확률과 수학적 확률은 같다는 것을 알 수 있다.
    『고등학교 수학Ⅰ』

stem: |
  윷놀이의 한 시행은 총 4개의 윷가락(혹은 윷짝)들을 동시에 던지는 것이고, 각 윷가락은 아래 그림의 (ㄱ)과 같이 높이 10cm, 반지름이 1cm인 원통의 윗 단면인 그림 (ㄴ)의 원 O에서 현 AB를 따라 원통을 수직으로 절단해서 4개의 윷가락들을 만들었다고 가정하자.
  [그림: (ㄱ) 높이 10cm, 반지름 1cm인 원통의 윗면에 중심 O와 원 위의 두 점 A, B가 표시되고, 현 AB를 따라 수직으로 자른 단면이 그려져 있다. (ㄴ) 원 O의 윗면 그림 — 현 AB와 반지름 OA, OB, ∠AOB=θ가 표시되어 있고, 잘려 나가는 쪽(θ 쪽)의 호는 점선, 남는 쪽의 호는 실선이다.]
  이렇게 제작된 4개의 윷가락들로 총 1000번의 시행으로 나타날 수 있는 결과는 다음과 같다.

  | 결과 | 정의 | 빈도 |
  |---|---|---|
  | 도 | 4개의 윷가락 중 1개는 배, 3개는 등 | 110 |
  | 개 | 4개의 윷가락 중 2개는 배, 2개는 등 | 311 |
  | 걸 | 4개의 윷가락 중 3개는 배, 1개만 등 | 384 |
  | 윷 | 4개의 윷가락 중 4개 모두 배 | 179 |
  | 모 | 4개의 윷가락 중 4개 모두 등 | 16 |

  다음 규칙에 따라 현 AB의 길이 $d$를 $\angle AOB=\theta$의 식으로 표현하라.

  ① 윷가락을 던졌을 때 반드시 등 또는 배가 위로 나타난다. 즉, 윗 단면이나 아랫 단면이 위로 나오는 결과의 확률은 0이다.
  ② 윷가락의 배와 등이 나타나는 확률은 각각 둥근 면과 평평한 면의 겉면적에 비례한다.
  ③ 각 윷가락은 확률 $p$로 현 AB의 수직 절단 면인 배(평평한 면)가 위로 나타나거나, 확률 $1-p$로 등(둥근 면)이 위로 나타나며, 서로 독립적으로 결과가 나타난다. 즉, 어느 하나의 윷가락의 결과가 다른 윷가락의 결과에 영향을 미치지 않는다.
  ④ $\angle AOB<\pi$이다.

subparts:
- id: '1'
  stem: |
    위 논제의 $d$를 $\theta$의 식으로 나타내시오.
  points: 40
  depends_on: []
  answer: {kind: expression, value: 'd=\dfrac{7}{13}(2\pi-\theta)', equivalents: ['d=7(2π−θ)/13 (cm)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 배의 총 횟수 2600/4000으로 $p=0.65$, 규칙 ②에서 $\dfrac{p}{1-p}=\dfrac{10(2\pi-\theta)}{10d}$.
    steps:
    - {id: 1a, content: '$\dfrac{0.65}{0.35}=\dfrac{2\pi-\theta}{d}$ → $d=\dfrac{7}{13}(2\pi-\theta)$', criteria: [1.A2]}
    hint_ladder:
    - 결과 1000번은 윷가락 하나로 치면 몇 번의 시행인가?
    - 윷가락의 둥근 면은 원통 옆면 중 어느 호에 해당하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.28
    steps:
    - id: 1b-1
      content: |
        4개의 윷가락을 던져 나온 배(평평한 면)의 수를 $X$라 하면 도·개·걸·윷·모에서 $X=1,2,3,4,0$이다. 1000번의 시행에서 평평한 면이 나온 횟수는
        $110\times1+311\times2+384\times3+179\times4+16\times0=110+622+1152+716+0=2600$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        윷가락 하나를 던지는 시행은 모두 $4\times1000=4000$번이므로 한 윷가락의 평평한 면(사건 $A$)이 나타날 통계적 확률은 $p'=\dfrac{2600}{4000}=0.65$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        제시문 【다】(및 【나】)에 의해 시행 횟수 $n=4\times1000$이 충분히 크므로 통계적 확률 $p'$과 수학적 확률 $p$는 같다고 본다. 즉 $p=0.65$, $1-p=0.35$.
      criteria: [1.R1]
    - id: 1b-4
      content: |
        규칙 ④에서 $\theta<\pi$이므로 윷가락의 단면은 중심각 $2\pi-\theta$인 큰 호와 현 AB로 둘러싸인 부분이다. 제시문 【가】에 의해 호의 길이는 $1\cdot(2\pi-\theta)$이므로 둥근 면의 넓이는 $10(2\pi-\theta)$, 평평한 면(현 AB의 수직 단면)의 넓이는 $10d$이다.
      criteria: [1.M2]
    - id: 1b-5
      content: |
        규칙 ②, ③에 의해 배가 위로 나타날 확률은 둥근 면의 넓이에, 등이 위로 나타날 확률은 평평한 면의 넓이에 비례하므로
        $0.35:0.65=10d:10(2\pi-\theta)$.
      criteria: [1.M3]
    - id: 1b-6
      content: |
        $0.65\times10d=0.35\times10(2\pi-\theta)$에서 $d=\dfrac{7}{13}(2\pi-\theta)$. 따라서 현 AB의 길이는 $d=\dfrac{7}{13}(2\pi-\theta)$ cm이다.
      criteria: [1.A2]
