stimuli:
- label: 가
  body: |
    미분가능한 함수 $f(x)$의 역함수 $f^{-1}(x)$가 존재하고 미분가능할 때,
    $y=f^{-1}(x)$의 도함수는 $(f^{-1})'(x)=\dfrac{1}{f'(f^{-1}(x))}$
    『고등학교 미적분』
- label: 나
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이면 최대·최소 정리에 의하여 $f(x)$는 닫힌구간 $[a,b]$에서 반드시 최댓값과 최솟값을 갖는다. 이때 이 구간에서 극댓값, 극솟값 $f(a)$, $f(b)$의 값 중 가장 큰 값이 최댓값, 가장 작은 값이 최솟값이 된다.
    『고등학교 미적분』
- label: 다
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때 $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^b f(x)\,dx=\int_{\alpha}^{\beta}f(g(t))g'(t)\,dt$$
    『고등학교 미적분』

stem: |
  함수 $f(x)=\sin^2x+4x+3$의 역함수 $f^{-1}(x)$가 존재하고 미분가능하다. 실수 $t$에 대하여 곡선 $y=f(x)$ 위의 점 $(t,f(t))$에서의 접선과 곡선 $y=f^{-1}(x)$ 위의 점 $(f(t),t)$에서의 접선의 교점의 $x$좌표를 $g(t)$라고 하자.

subparts:
- id: '1'
  stem: |
    $g\left(\dfrac{\pi}{2}\right)$의 값을 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '-\dfrac43', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 접선의 기울기는 $f'(t)$, $\dfrac{1}{f'(t)}$이고 연립하면 $g(t)=\dfrac{tf'(t)-f(t)}{f'(t)-1}$.
    steps:
    - {id: 1a, content: '$g(t)=\dfrac{t\sin2t-\sin^2t-3}{\sin2t+3}$, $g\left(\dfrac{\pi}{2}\right)=-\dfrac43$', criteria: [1.A1, 1.A2]}
    hint_ladder:
    - 역함수 위의 점 $(f(t),t)$에서의 기울기는 【가】로 구한다.
    - 두 접선의 방정식을 같다고 놓고 $x$에 대해 풀자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.20
    steps:
    - id: 1b-1
      content: |
        $f'(t)=2\sin t\cos t+4=\sin2t+4$이므로 곡선 $y=f(x)$ 위의 점 $(t,f(t))$에서의 접선은 $y=f'(t)(x-t)+f(t)$.
        제시문 【가】의 역함수 미분법에 의해 곡선 $y=f^{-1}(x)$ 위의 점 $(f(t),t)$에서의 접선의 기울기는 $\dfrac{1}{f'(t)}$이므로 접선은 $y=\dfrac{1}{f'(t)}(x-f(t))+t$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        교점의 $x$좌표가 $g(t)$이므로 $f'(t)(g(t)-t)+f(t)=\dfrac{1}{f'(t)}(g(t)-f(t))+t$. 정리하면
        $g(t)=\dfrac{tf'(t)-f(t)}{f'(t)-1}=\dfrac{t\sin2t-\sin^2t-3}{\sin2t+3}$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        따라서 $g\left(\dfrac{\pi}{2}\right)=\dfrac{0-1-3}{0+3}=-\dfrac43$.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 【가】를 인용해 역함수 위 점 $(f(t),t)$에서의 기울기를 $\dfrac{1}{f'(t)}$로 두고 두 접선의 방정식을 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $g(t)=\dfrac{tf'(t)-f(t)}{f'(t)-1}$ 또는 $\dfrac{t\sin2t-\sin^2t-3}{\sin2t+3}$을 적었다.
      depends_on: [1.M1]
      steps: [1a, 1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $g\left(\dfrac{\pi}{2}\right)=-\dfrac43$을 적었다.
      depends_on: [1.M1]
      steps: [1a, 1b-3]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2203}
  misconceptions:
  - id: MC-CAL-2203
    outcome_code: '70'
    wrong_work: '역함수 위 점 $(f(t),t)$에서의 기울기를 $\dfrac{1}{f''(f(t))}$ 또는 $-\dfrac{1}{f''(t)}$로 둠'
    detect_cue: 접선 기울기에 $f'(f(t))$나 음의 역수가 나온다
    feedback: '점 $(f(t),t)$에서 $f^{-1}(f(t))=t$이므로 【가】에 의해 기울기는 $\dfrac{1}{f''(t)}$입니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    닫힌구간 $[0,\pi]$에서 $g(t)$의 최솟값과 최댓값을 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '최솟값 -\dfrac{3\pi+14}{8},\ 최댓값 \dfrac{\pi-14}{16}', equivalents: ['min=g(3π/4), max=g(π/4)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$g''(t)=\dfrac{f''''(t)(f(t)-t)}{(f''(t)-1)^2}$에서 $f(t)-t>0$이므로 부호는 $\cos2t$가 결정.'
    steps:
    - {id: 2a, content: '후보 $g(0)=g(\pi)=-1$, $g\left(\dfrac{\pi}{4}\right)=\dfrac{\pi-14}{16}$, $g\left(\dfrac{3\pi}{4}\right)=-\dfrac{3\pi+14}{8}$', criteria: [2.A1]}
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.20
    steps:
    - id: 2b-1
      content: |
        $g(t)=\dfrac{tf'(t)-f(t)}{f'(t)-1}$을 미분하면
        $g'(t)=\dfrac{f''(t)(f(t)-t)}{(f'(t)-1)^2}=\dfrac{2\cos2t\,(\sin^2t+3t+3)}{(\sin2t+3)^2}$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $h(t)=\sin^2t+3t+3$이라 하면 $h'(t)=\sin2t+3\ge2>0$이므로 $h$는 $[0,\pi]$에서 증가하고 $h(t)\ge h(0)=3>0$. 따라서 $g'(t)=0$이면 $\cos2t=0$, 즉 $t=\dfrac{\pi}{4}$, $\dfrac{3\pi}{4}$.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        $g(0)=-1$, $g\left(\dfrac{\pi}{4}\right)=\dfrac{\pi-14}{16}$, $g\left(\dfrac{3\pi}{4}\right)=-\dfrac{3\pi+14}{8}$, $g(\pi)=-1$이므로 제시문 【나】에 의해 최솟값은 $g\left(\dfrac{3\pi}{4}\right)=-\dfrac{3\pi+14}{8}$, 최댓값은 $g\left(\dfrac{\pi}{4}\right)=\dfrac{\pi-14}{16}$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: $g'(t)$를 몫의 미분으로 구해 $\dfrac{2\cos2t(\sin^2t+3t+3)}{(\sin2t+3)^2}$(또는 동치) 꼴로 적었다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: $\sin^2t+3t+3>0$인 근거를 적고 임계점을 $t=\dfrac{\pi}{4},\dfrac{3\pi}{4}$로 좁혔다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: 끝점 $g(0)=g(\pi)=-1$과 임계점 값을 비교해 최솟값 $-\dfrac{3\pi+14}{8}$, 최댓값 $\dfrac{\pi-14}{16}$을 적었다.
      depends_on: [2.M1, 2.R1]
      steps: [2a, 2b-3]
    deductions:
    - code: D2-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2204}
  misconceptions:
  - id: MC-CAL-2204
    outcome_code: '70'
    wrong_work: '극댓값·극솟값만 비교하고 끝점 $g(0)=g(\pi)=-1$을 확인하지 않음'
    detect_cue: 답안에 $g(0)$, $g(\pi)$의 계산이 없다
    feedback: 【나】처럼 닫힌구간의 최대·최소는 극값과 양 끝값을 모두 비교해야 확정됩니다.
    remedy: [RL-2]
- id: '3'
  stem: |
    $\displaystyle\int_{f(0)}^{f(\pi)}g(f^{-1}(x))\,dx-\int_0^{\pi}g(t)\,dt$의 값을 구하시오.
  points: 12
  depends_on: ['1']
  answer: {kind: value, value: '-4\pi', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$x=f(t)$로 치환해 두 적분을 합치면 $\displaystyle\int_0^{\pi}g(t)(f''(t)-1)dt=\int_0^{\pi}(tf''(t)-f(t))dt$.'
    steps:
    - {id: 3a, content: '$\displaystyle\int_0^{\pi}(t\sin2t-\sin^2t-3)dt=-\dfrac{\pi}{2}-\dfrac{\pi}{2}-3\pi=-4\pi$', criteria: [3.A2]}
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.20
    steps:
    - id: 3b-1
      content: |
        $x=f(t)\ (0\le t\le\pi)$로 놓으면 제시문 【다】의 치환적분에 의해 $\displaystyle\int_{f(0)}^{f(\pi)}g(f^{-1}(x))\,dx=\int_0^{\pi}g(t)f'(t)\,dt$.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        따라서 $\displaystyle\int_{f(0)}^{f(\pi)}g(f^{-1}(x))\,dx-\int_0^{\pi}g(t)\,dt=\int_0^{\pi}g(t)(f'(t)-1)\,dt=\int_0^{\pi}(tf'(t)-f(t))\,dt=\int_0^{\pi}(t\sin2t-\sin^2t-3)\,dt$.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        $\displaystyle\int_0^{\pi}t\sin2t\,dt=\left[-\dfrac t2\cos2t\right]_0^{\pi}+\int_0^{\pi}\dfrac12\cos2t\,dt=-\dfrac{\pi}{2}$, $\displaystyle\int_0^{\pi}\sin^2t\,dt=\int_0^{\pi}\dfrac{1-\cos2t}{2}\,dt=\dfrac{\pi}{2}$.
      criteria: [3.A1]
    - id: 3b-4
      content: |
        그러므로 구하는 값은 $-\dfrac{\pi}{2}-\dfrac{\pi}{2}-3\pi=-4\pi$.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: 【다】를 인용해 $x=f(t)$로 치환하고 적분 구간을 $0$에서 $\pi$로 바꾼 식 $\displaystyle\int_0^{\pi}g(t)f'(t)dt$를 적었다.
      depends_on: []
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: 두 적분을 합쳐 $\displaystyle\int_0^{\pi}(tf'(t)-f(t))dt$(또는 $\displaystyle\int_0^{\pi}(t\sin2t-\sin^2t-3)dt$)로 정리했다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: 부분적분으로 $\displaystyle\int_0^{\pi}t\sin2t\,dt=-\dfrac{\pi}{2}$, 반각으로 $\displaystyle\int_0^{\pi}\sin^2t\,dt=\dfrac{\pi}{2}$를 구했다.
      depends_on: [3.M2]
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 3
      evidence: $-4\pi$를 답으로 적었다.
      depends_on: [3.M1, 3.M2]
      steps: [3a, 3b-4]
    deductions:
    - code: D3-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2205}
  misconceptions:
  - id: MC-CAL-2205
    outcome_code: '70'
    wrong_work: '$\displaystyle\int_{f(0)}^{f(\pi)}g(f^{-1}(x))dx=\int_0^{\pi}g(t)dt$로 보고(즉 $dx=f''(t)dt$ 누락) 차를 0으로 답함'
    detect_cue: 답이 0 또는 적분 구간을 $f(0)$, $f(\pi)$ 그대로 둔 채 $t$로 적분
    feedback: $x=f(t)$이면 $dx=f'(t)\,dt$이고 구간도 $t=0$에서 $t=\pi$로 바뀝니다.
    remedy: [RL-3]

