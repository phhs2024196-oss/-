intent: 역함수의 미분법으로 역함수 그래프의 접선을 세워 두 접선의 교점을 t의 함수로 나타내고, 닫힌구간에서 최대·최소를 판정하며, 치환적분으로 역함수가 들어간 적분을 바꾸는 능력을 본다.
key_idea: '두 접선의 교점은 $g(t)=\dfrac{tf''(t)-f(t)}{f''(t)-1}$이고, $x=f(t)$로 치환하면 $\displaystyle\int g(f^{-1}(x))dx=\int g(t)f''(t)dt$라 (3)의 차는 $\displaystyle\int_0^{\pi}(tf''(t)-f(t))dt$가 된다.'
stuck: '$g''(t)=\dfrac{f''''(t)(f(t)-t)}{(f''(t)-1)^2}$에서 $f(t)-t>0$을 보여 부호를 $\cos2t$로 좁히는 단계, (3)에서 두 적분을 하나로 합치는 단계'
