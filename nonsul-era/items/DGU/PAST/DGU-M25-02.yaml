stimuli:
- label: 가
  body: |
    (공간에서) 한 점에서 만나는 서로 다른 두 직선은 한 평면을 결정하므로 그 평면 위에서 두 직선이 이루는 각을 정할 수 있다.
    『고등학교 기하』
- label: 나
  body: |
    꼬인 위치에 있는 두 직선은 한 평면위에 있지 않으므로 두 직선이 이루는 각은 다음과 같이 정한다.
    두 직선 $l$과 $m$이 꼬인 위치에 있을 때, 직선 $m$위의 임의의 점 O를 지나고 직선 $l$에 평행한 직선을 $l'$이라고 하면 두 직선 $l'$, $m$은 한 평면을 결정한다. 이 때 두 직선 $l'$, $m$이 이루는 각 중 크기가 크지 않은 쪽의 각을 두 직선 $l$, $m$이 이루는 각이라고 한다.
    『고등학교 기하』
- label: 다
  body: |
    직선 $l$이 평면 $\alpha$와 한 점 O에서 만나고 점 O를 지나는 평면 $\alpha$위의 모든 직선과 수직일 때 직선 $l$과 평면 $\alpha$는 서로 수직이라고 하고, 이것을 기호로 $l\perp\alpha$와 같이 나타낸다. 이때 직선 $l$을 평면 $\alpha$의 수선이라고 하며, 직선 $l$과 평면 $\alpha$가 만나는 점 O를 수선의 발이라고 한다.
    직선 $l$이 평면 $\alpha$ 위의 평행하지 않은 두 직선과 각각 수직이면 $l\perp\alpha$.
    『고등학교 기하』
- label: 라
  body: |
    평면 $\alpha$ 위에 있지 않은 점 P, 평면 $\alpha$위의 점 O, 점 O를 지나지 않고 평면 $\alpha$ 위에 있는 한 직선 $l$, 직선 $l$위의 점 H에 대하여
    (1) $\overline{\mathrm{PO}}\perp\alpha$, $\overline{\mathrm{OH}}\perp l$ 이면 $\overline{\mathrm{PH}}\perp l$
    (2) $\overline{\mathrm{PO}}\perp\alpha$, $\overline{\mathrm{PH}}\perp l$ 이면 $\overline{\mathrm{OH}}\perp l$
    (3) $\mathrm{PH}\perp l$, $\mathrm{OH}\perp l$, $\mathrm{PO}\perp\mathrm{OH}$ 이면 $\overline{\mathrm{PO}}\perp\alpha$
    『고등학교 기하』

stem: |
  다음 전개도로 만든 정육면체에서 다음 두 직선들이 이루는 각의 크기를 구하고 위 제시문 중 어느 것을 사용하였는지 서술하시오.
  (1) $\overline{\mathrm{AB}}$ 와 $\overline{\mathrm{BC}}$　　(2) $\overline{\mathrm{BC}}$ 와 $\overline{\mathrm{EF}}$　　(3) $\overline{\mathrm{CD}}$ 와 $\overline{\mathrm{DH}}$
  그리고, 선분EF의 중점을 G라고 할 때, 이 전개도로 만든 정육면체에서
  (4) $\overline{\mathrm{CG}}$와 $\overline{\mathrm{EF}}$
  가 이루는 각을 제시문 【라】의 삼수선의 정리를 이용하여 구하시오.
  [그림: 전개도 — 정사각형 4개가 가로로 한 줄(왼쪽부터 1~4번 칸)이고 2번 칸의 위와 아래에 정사각형이 하나씩 붙은 십자형. A = 1번 칸의 왼쪽 위 꼭짓점, B = 1·2번 칸 공통 변의 아래 끝, C = 2·3번 칸 공통 변의 위 끝, D = 3·4번 칸 공통 변의 위 끝, E = 같은 변의 아래 끝, F = 4번 칸의 오른쪽 위 꼭짓점, H = 4번 칸의 오른쪽 아래 꼭짓점, G = 4번 칸의 두 대각선 DH, EF의 교점. 빨간 점선: AB(1번 칸의 대각선), BC(2번 칸의 대각선), CD(3번 칸의 윗변), DH와 EF(4번 칸의 두 대각선). 그림 아래 '[전개도]']

