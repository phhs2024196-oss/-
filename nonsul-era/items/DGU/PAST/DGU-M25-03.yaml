stimuli:
- label: 가
  body: |
    좌표평면 위를 움직이는 점 P의 시각 $t$에서의 위치 $(x,y)$가 $x=f(t)$, $y=g(t)$일 때, 점 P의 시각 $t$에서의 속도는 $\left(\dfrac{dx}{dt},\dfrac{dy}{dt}\right)$, 즉 $(f'(t),g'(t))$이고, 속도의 크기 또는 속력은 $\sqrt{\{f'(t)\}^2+\{g'(t)\}^2}$이다.
    『고등학교 미적분』
- label: 나
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이면 함수 $f(x)$는 이 구간에서 반드시 최댓값과 최솟값을 가진다.
    『고등학교 수학 Ⅱ』
- label: 다
  body: |
    $t$의 함수 $s$가 방정식 $f(t,s)=0$의 꼴로 주어졌을 때, 이를 $s$의 $t$에 대한 음함수 표현이라고 한다. 음함수 표현 $f(t,s)=0$에서 $s$를 $t$의 함수로 보고, 양변의 각 항을 $t$에 대하여 미분하여 $\dfrac{ds}{dt}$를 구할 수 있다.
    『고등학교 미적분』

stem: |
  그림과 같이 좌표평면 위에 중심이 원점 O이고 반지름의 길이가 1인 원과 원 위의 점 $\mathrm{P}(\cos\theta,\sin\theta)$가 주어져 있다. (단, $0\le\theta\le\dfrac{\pi}{3}$) 점 Q는 P에서 출발하여 원 위를 반시계방향으로, 시각 $t$일 때 $\angle\mathrm{QOP}=t$를 만족하도록 움직인다. $0<t<\pi-2\theta$일 때, 점 Q와 P를 잇는 직선이 $x$축과 만나는 점을 A라 하면, Q가 위와 같이 움직임에 따라 A또한 $x$축 위에서 움직인다. 점 Q가 $(0,1)$을 지날 때, 점 A의 속력을 $\lvert v_{\mathrm{A}}\rvert$라 하자.
  [그림: 원점 O 중심의 단위원. 제1사분면의 원 위에 $\mathrm{P}(\cos\theta,\sin\theta)$, 그보다 반시계방향으로 각 $t$만큼 더 간 원 위의 점 Q($\angle\mathrm{QOP}=t$, Q에 반시계 방향 화살표). 직선 QP가 $x$축의 $x>1$ 부분과 만나는 점이 A이며 A에 오른쪽 화살표. $x$축과 OP가 이루는 각 $\theta$ 표시]

subparts:
- id: '1'
  stem: |
    $\lvert v_{\mathrm{A}}\rvert$를 $\theta$를 이용하여 나타내시오.
  points: 14
  depends_on: []
  answer: {kind: expression, value: '\lvert v_{\mathrm{A}}\rvert=\dfrac{\sin\theta}{1-\sin\theta}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: Q, P에서 x축에 내린 두 직각삼각형의 탄젠트가 같다는 식을 t로 음함수 미분하고 $t+\theta=\dfrac{\pi}{2}$를 대입한다.
    steps:
    - {id: 1a, content: '$\dfrac{da}{dt}-\sin\theta\left(\dfrac{da}{dt}+1\right)=0$ → $\dfrac{da}{dt}=\dfrac{\sin\theta}{1-\sin\theta}$', criteria: [1.A1]}
    hint_ladder:
    - A의 좌표를 $(a,0)$으로 두고 a와 t의 관계식을 세우자.
    - Q, P에서 x축에 수선을 내리면 A를 공유하는 닮은 직각삼각형이 생긴다.
    - Q가 $(0,1)$에 있을 때 $t+\theta$의 값은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.22
    steps:
    - id: 1b-1
      content: |
        A의 좌표를 $(a,0)$이라 하자. Q는 원 위를 움직이므로 시각 $t$일 때 $\mathrm{Q}(\cos(t+\theta),\sin(t+\theta))$. Q, P에서 $x$축에 내린 수선의 발을 $\mathrm{h_Q}$, $\mathrm{h_P}$라 하면 $\angle\mathrm{QAh_Q}=\angle\mathrm{PAh_P}$이므로 $\tan(\angle\mathrm{QAh_Q})=\tan(\angle\mathrm{PAh_P})$, 즉
        $\dfrac{\sin(t+\theta)}{a-\cos(t+\theta)}=\dfrac{\sin\theta}{a-\cos\theta}$.
        정리하면 $(a-\cos\theta)\sin(t+\theta)-\sin\theta(a-\cos(t+\theta))=0$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        제시문 【다】의 음함수 미분법으로 $a$를 $t$의 함수로 보고 $t$에 대해 미분하면
        $\dfrac{da}{dt}\sin(t+\theta)+(a-\cos\theta)\cos(t+\theta)-\sin\theta\left(\dfrac{da}{dt}+\sin(t+\theta)\right)=0$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        점 Q가 $(0,1)$을 지날 때 $t+\theta=\dfrac{\pi}{2}$이므로 $\sin(t+\theta)=1$, $\cos(t+\theta)=0$. 대입하면 $\dfrac{da}{dt}(1-\sin\theta)=\sin\theta$.
      criteria: [1.R1]
    - id: 1b-4
      content: |
        A는 $x$축 위를 움직이므로 제시문 【가】에 의해 속력은 $\left\lvert\dfrac{da}{dt}\right\rvert$이고, $0\le\theta\le\dfrac{\pi}{3}$에서 $1-\sin\theta>0$이므로
        $\lvert v_{\mathrm{A}}\rvert=\left\lvert\dfrac{da}{dt}\right\rvert=\dfrac{\sin\theta}{1-\sin\theta}$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: Q의 좌표 $(\cos(t+\theta),\sin(t+\theta))$를 쓰고 A의 $x$좌표 $a$와 $t$의 관계식(탄젠트 비, 직선의 방정식 등)을 세웠다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 【다】를 인용해 관계식을 $t$로 미분한 식(또는 $a(t)$를 구해 미분한 식)이 있다.
      depends_on: []
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: Q가 $(0,1)$일 때 $t+\theta=\dfrac{\pi}{2}$임을 적고 대입했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 【가】의 속력 정의와 $1-\sin\theta>0$을 근거로 $\lvert v_{\mathrm{A}}\rvert=\dfrac{\sin\theta}{1-\sin\theta}$를 적었다.
      depends_on: [1.M1, 1.M2]
      steps: [1a, 1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2206}
  misconceptions:
  - id: MC-CAL-2206
    outcome_code: '70'
    wrong_work: '$a$를 상수로 보고 미분해 $\dfrac{da}{dt}$ 항이 빠지거나, Q의 좌표를 $(\cos t,\sin t)$로 두어 θ가 사라짐'
    detect_cue: '미분식에 $\dfrac{da}{dt}$가 한 번만 나오거나 답이 θ와 무관'
    feedback: 음함수 미분에서는 $a$도 $t$의 함수입니다. 또 $\angle\mathrm{QOP}=t$이므로 Q의 각은 $t+\theta$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    $\lvert v_{\mathrm{A}}\rvert$가 최대가 되도록 하는 $\theta$의 값과, 그 때 $\lvert v_{\mathrm{A}}\rvert$의 값을 구하시오.
  points: 12
  depends_on: ['1']
  answer: {kind: value, value: '\theta=\dfrac{\pi}{3},\ \lvert v_{\mathrm{A}}\rvert=3+2\sqrt3', equivalents: ['θ=60°'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{\sin\theta}{1-\sin\theta}$는 $\sin\theta$에 대해 증가하므로 오른쪽 끝 $\theta=\dfrac{\pi}{3}$에서 최대.
    steps:
    - {id: 2a, content: '$\dfrac{\sqrt3/2}{1-\sqrt3/2}=3+2\sqrt3$', criteria: [2.A1]}
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.22
    steps:
    - id: 2b-1
      content: |
        $\lvert v_{\mathrm{A}}\rvert(\theta)=\dfrac{\sin\theta}{1-\sin\theta}$를 $0\le\theta\le\dfrac{\pi}{3}$에서 $\theta$에 대해 미분하면
        $\dfrac{\cos\theta(1-\sin\theta)+\sin\theta\cos\theta}{(1-\sin\theta)^2}=\dfrac{\cos\theta}{(1-\sin\theta)^2}>0$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 $\lvert v_{\mathrm{A}}\rvert(\theta)$는 주어진 닫힌구간에서 증가하는 연속함수이다. 제시문 【나】에 의해 최댓값이 존재하며, 증가함수이므로 그 값은 오른쪽 끝 $\theta=\dfrac{\pi}{3}$에서 얻어진다.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        이때 $\sin\theta=\dfrac{\sqrt3}{2}$이므로 최댓값은 $\dfrac{\sqrt3/2}{1-\sqrt3/2}=\dfrac{\sqrt3}{2-\sqrt3}=3+2\sqrt3$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $\theta$에 대한 도함수 $\dfrac{\cos\theta}{(1-\sin\theta)^2}$를 구하고(또는 $\sin\theta$에 대한 증가성을 보이고) 부호가 양임을 적었다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 5}
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: 증가함수이므로 닫힌구간의 오른쪽 끝 $\theta=\dfrac{\pi}{3}$에서 최대라는 근거를 적었다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $\theta=\dfrac{\pi}{3}$, 최댓값 $3+2\sqrt3$을 적었다.
      depends_on: [2.M1, 2.R1]
      steps: [2a, 2b-3]
    deductions:
    - code: D2-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2204}
  misconceptions:
  - id: MC-CAL-2204
    outcome_code: '70'
    wrong_work: '도함수가 0이 되는 점이 없으므로 최댓값이 없다고 하거나, $\theta\to\dfrac{\pi}{2}$에서 발산한다고 답함'
    detect_cue: 답에 '최댓값 없음' 또는 $\theta=\dfrac{\pi}{2}$
    feedback: 정의역 $0\le\theta\le\dfrac{\pi}{3}$은 닫힌구간입니다. 증가함수의 최댓값은 오른쪽 끝값입니다.
    remedy: [RL-2]
- id: '3'
  stem: |
    점 Q가 $(0,1)$을 지날 때, 점 Q와 점 A 사이의 거리를 $d_{\mathrm{A}}$라 하자. $d_{\mathrm{A}}^2=4\lvert v_{\mathrm{A}}\rvert$가 되도록 하는 $\theta$를 구하시오.
  points: 14
  depends_on: ['1']
  answer: {kind: value, value: '\theta=\dfrac{\pi}{6}', equivalents: ['30°'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$\angle\mathrm{OQA}=\alpha$이면 $d_{\mathrm{A}}^2=\dfrac{1}{\cos^2\alpha}$, 이등변삼각형 OPQ에서 $2\alpha=\theta+\dfrac{\pi}{2}$.'
    steps:
    - {id: 3a, content: '$d_{\mathrm{A}}^2=\dfrac{2}{1-\sin\theta}$, $\dfrac{d_{\mathrm{A}}^2}{\lvert v_{\mathrm{A}}\rvert}=\dfrac{2}{\sin\theta}=4$', criteria: [3.A2]}
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.22
    steps:
    - id: 3b-1
      content: |
        Q가 $(0,1)$에 있을 때 $\angle\mathrm{OQA}=\alpha$라 하면 직각삼각형 QOA에서 $\overline{\mathrm{OQ}}=1$이므로 $d_{\mathrm{A}}=\dfrac{1}{\cos\alpha}$, 즉 $d_{\mathrm{A}}^2=\dfrac{1}{\cos^2\alpha}$.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $\overline{\mathrm{OQ}}=\overline{\mathrm{OP}}$이므로 $\angle\mathrm{OPQ}=\alpha$이고, $\angle\mathrm{QOP}=\dfrac{\pi}{2}-\theta$이므로 $2\alpha+\dfrac{\pi}{2}-\theta=\pi$, 즉 $2\alpha=\theta+\dfrac{\pi}{2}$.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        따라서 $d_{\mathrm{A}}^2=\dfrac{1}{\cos^2\alpha}=\dfrac{2}{1+\cos2\alpha}=\dfrac{2}{1+\cos\left(\theta+\dfrac{\pi}{2}\right)}=\dfrac{2}{1-\sin\theta}$.
      criteria: [3.A1]
    - id: 3b-4
      content: |
        (1)에서 $\lvert v_{\mathrm{A}}\rvert=\dfrac{\sin\theta}{1-\sin\theta}$이므로 $\dfrac{d_{\mathrm{A}}^2}{\lvert v_{\mathrm{A}}\rvert}=\dfrac{2}{\sin\theta}=4$, $\sin\theta=\dfrac12$. $0\le\theta\le\dfrac{\pi}{3}$이므로 $\theta=\dfrac{\pi}{6}$.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: '$d_{\mathrm{A}}^2$를 각 $\alpha$(또는 A의 좌표 $a$)로 나타낸 식($\dfrac{1}{\cos^2\alpha}$ 또는 $a^2+1$)을 적었다.'
      depends_on: []
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: 이등변삼각형 OPQ에서 $2\alpha=\theta+\dfrac{\pi}{2}$(또는 $a=\dfrac{\cos\theta}{1-\sin\theta}$)를 얻었다.
      depends_on: []
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: $d_{\mathrm{A}}^2=\dfrac{2}{1-\sin\theta}$를 적었다.
      depends_on: [3.M1, 3.M2]
      steps: [3b-3]
    - id: 3.A2
