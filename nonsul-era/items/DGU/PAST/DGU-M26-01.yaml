stimuli:
- label: 가
  body: |
    두 초점 $\mathrm{F}(c,0)$, $\mathrm{F}'(-c,0)$에서의 거리의 합이 $2a\,(a>c>0)$인 타원의 방정식은
    $$\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1\quad(\text{단, }b^2=a^2-c^2)$$
    -『고등학교 기하』
- label: 나
  body: |
    점 $\mathrm{P}(x,y)$를 $x$축에 대하여 대칭이동한 점 $\mathrm{P}_1$의 좌표는 $(x,-y)$, $y$축에 대하여 대칭이동한 점 $\mathrm{P}_2$의 좌표는 $(-x,y)$, 원점에 대하여 대칭이동한 점 $\mathrm{P}_3$의 좌표는 $(-x,-y)$이다.
    -『고등학교 수학』
- label: 다
  body: |
    미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면 $f'(a)=0$이다.
    -『고등학교 수학 Ⅱ』
- label: 라
  body: |
    두 함수 $y=f(u)$, $u=f(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는
    $$\dfrac{dy}{dx}=\dfrac{dy}{du}\times\dfrac{du}{dx}\ \text{ 또는 }\ \{f(g(x))\}'=f'(g(x))g'(x)$$
    -『고등학교 미적분』
- label: 마
  body: |
    $n$이 실수일 때, $y=x^n\ (x>0)$ 이면
    $$y'=nx^{n-1}$$
    -『고등학교 미적분』

stem: |
  장축의 길이가 $2$이고 단축의 길이가 $1$인 타원이 주어졌다. 타원에서 한 점 $\mathrm{P}$을 잡고 그 점을 장축에 의하여 대칭한 점 $\mathrm{Q}$를 잡자. 타원에서 또다른 점 $\mathrm{R}$을 잡아서 만든 삼각형 $\mathrm{PQR}$의 넓이의 최댓값을 구하시오.

subparts:
- id: '1'
  stem: |
    위 논제의 삼각형 $\mathrm{PQR}$의 넓이의 최댓값을 구하시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: '\dfrac{3\sqrt3}{8}', equivalents: ['3√3/8', '0.6495'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$x^2+4y^2=1$, $P(\alpha,\beta)$에서 넓이 $\lvert\beta\rvert(1+\lvert\alpha\rvert)$, $\beta>0$에서 $S=\beta(1+\sqrt{1-4\beta^2})$의 임계점 $\beta=\frac{\sqrt3}{4}$.'
    steps:
    - {id: 1a, content: '$S\!\left(\dfrac{\sqrt3}{4}\right)=\dfrac{\sqrt3}{4}\cdot\dfrac32=\dfrac{3\sqrt3}{8}$', criteria: [1.A3]}
    hint_ladder:
    - P와 Q를 고정하면 R은 어디에 있어야 넓이가 가장 클까?
    - 넓이를 $P$의 $y$좌표 하나만의 함수로 나타내 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.14
    steps:
    - id: 1b-1
      content: |
        장축이 $x$축이 되도록 타원을 잡으면 $a=1$, $b=\dfrac12$이므로 제시문 【가】에 의해 타원의 방정식은 $x^2+4y^2=1$. 점 P의 좌표를 $(\alpha,\beta)$라 하면 제시문 【나】에 의해 Q의 좌표는 $(\alpha,-\beta)$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        각 P에 대해 넓이가 최대가 되는 R은 직선 PQ, 즉 직선 $x=\alpha$까지 거리가 가장 먼 점 $(1,0)$ 또는 $(-1,0)$이다. $\alpha\ge0$이면 $\mathrm{R}(-1,0)$, $\alpha<0$이면 $\mathrm{R}(1,0)$이고 이때 넓이는
        $S=\dfrac12\cdot2\lvert\beta\rvert(1+\lvert\alpha\rvert)=\lvert\beta\rvert\left(1+\sqrt{1-4\beta^2}\right)$.
      criteria: [1.M2, 1.A1]
    - id: 1b-3
      content: |
        대칭에 의해 $0<\beta<\dfrac12$인 경우만 생각하면 $S=\beta\left(1+\sqrt{1-4\beta^2}\right)$. 제시문 【라】【마】에 의해
        $\dfrac{dS}{d\beta}=1+\sqrt{1-4\beta^2}-\dfrac{4\beta^2}{\sqrt{1-4\beta^2}}=\dfrac{\sqrt{1-4\beta^2}+1-8\beta^2}{\sqrt{1-4\beta^2}}$.
      criteria: [1.M3]
    - id: 1b-4
      content: |
        제시문 【다】에 의해 극값을 찾기 위해 $\dfrac{dS}{d\beta}=0$으로 놓으면 $\sqrt{1-4\beta^2}=8\beta^2-1$. 제곱하여 정리하면 $\beta^2(16\beta^2-3)=0$이고 $8\beta^2-1\ge0$인 해는 $\beta=\dfrac{\sqrt3}{4}$. 이 점의 좌우에서 $\dfrac{dS}{d\beta}$의 부호가 양에서 음으로 바뀌고 $\beta\to0^+$에서 $S\to0$, $\beta=\dfrac12$에서 $S=\dfrac12$이므로 최댓값이다.
        따라서 $\alpha=\dfrac12$, $\beta=\dfrac{\sqrt3}{4}$일 때 삼각형 PQR의 최대 넓이는 $\dfrac{\sqrt3}{4}\left(1+\dfrac12\right)=\dfrac{3\sqrt3}{8}$.
      criteria: [1.R1, 1.A2, 1.A3]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: '$P\left(\cos\theta,\ \frac12\sin\theta\right)$ $(0<\theta<\pi)$로 두면 $S=\frac12\sin\theta(1+\cos\theta)$, $S''=\frac12(2\cos\theta-1)(\cos\theta+1)=0$에서 $\theta=\frac{\pi}{3}$.'
    steps:
    - {id: 1c, content: '$S\!\left(\dfrac{\pi}{3}\right)=\dfrac12\cdot\dfrac{\sqrt3}{2}\cdot\dfrac32=\dfrac{3\sqrt3}{8}$', criteria: [1.M3, 1.A3]}
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 타원 $x^2+4y^2=1$과 $\mathrm{P}(\alpha,\beta)$, $\mathrm{Q}(\alpha,-\beta)$를 적었다(【가】【나】 인용).
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: P를 고정했을 때 넓이를 최대로 하는 R이 직선 $x=\alpha$에서 가장 먼 장축 끝점임을 근거와 함께 적었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 넓이를 $\lvert\beta\rvert(1+\sqrt{1-4\beta^2})$(또는 동치인 한 변수 식)로 적었다.
      depends_on: [1.M2]
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 5
      evidence: 합성함수의 미분(【라】【마】)으로 $\dfrac{dS}{d\beta}$(또는 $\dfrac{dS}{d\theta}$)를 정확히 구하는 식이 있다.
      depends_on: []
      steps: [1b-3, 1c]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: 임계점에서 최대임을 부호 변화 또는 양 끝값 비교로 밝혔다.
      depends_on: []
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 임계점 $\beta=\dfrac{\sqrt3}{4}$(또는 $\theta=\dfrac{\pi}{3}$, $\alpha=\dfrac12$)를 구했다.
      depends_on: [1.M3]
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: 최댓값 $\dfrac{3\sqrt3}{8}$을 적었다.
      depends_on: [1.M3, 1.R1]
      steps: [1a, 1b-4, 1c]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-2104}
  misconceptions:
  - id: MC-GEO-2104
    outcome_code: '70'
    wrong_work: '높이를 원점까지의 거리 $\lvert\alpha\rvert$나 단축 꼭짓점 기준으로 잡아 넓이를 $\lvert\alpha\beta\rvert$ 등으로 두고 최댓값을 $\dfrac14$로 답함'
    detect_cue: 답이 $\dfrac14$ 또는 $\dfrac12$
    feedback: 밑변 PQ를 고정하면 높이는 R에서 직선 $x=\alpha$까지의 거리이고, 타원 위에서 그 최댓값은 반대쪽 장축 끝점에서 $1+\lvert\alpha\rvert$입니다.
    remedy: [RL-1]

