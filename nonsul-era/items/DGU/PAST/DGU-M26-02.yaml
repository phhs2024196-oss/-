stimuli:
- label: 가
  body: |
    표본공간 $S$의 사건 $A,B$에 대하여
    $$P(A\cup B)=P(A)+P(B)-P(A\cap B)$$
    사건 $A,B$가 서로 배반사건이면
    $$P(A\cup B)=P(A)+P(B)$$
    -『고등학교 확률과 통계』
- label: 나
  body: |
    두 사건 $A,B$에 대하여
    $$P(A\cap B)=P(A)P(B\mid A)\quad(\text{단, }P(A)\neq0)$$
    $$P(A\cap B)=P(B)P(A\mid B)\quad(\text{단, }P(B)\neq0)$$
    -『고등학교 확률과 통계』
- label: 다
  body: |
    두 사건 $A,B$가 서로 독립이기 위한 필요충분조건은
    $$P(A\cap B)=P(A)P(B)\quad(\text{단, }P(A)\neq0,\ P(B)\neq0)$$
    -『고등학교 확률과 통계』

stem: |
  철수는 한 변의 길이가 $550$mm인 정사각형의 표적지에 사격을 한다. 표적지에는 표적지 중심을 기준으로 반지름이 $25$mm부터 $25$mm씩 증가하는 동심원이 $10$개 그려져 있다. 탄착점의 중심을 포함하는 원의 개수를 점수로 하되, 탄착점의 중심이 원의 경계를 맞힌 경우도 그 원에 포함된 것으로 한다. 표적지를 맞췄을 때, 얻게 될 점수의 확률은 표적지 전체 면적 대비 해당 점수가 나오는 영역의 면적 비율로 한다. 과거 사격 기록에 의하면 철수는 표적지를 못 맞추는 비율이 $19$%였다. 철수가 $3$발을 사격 했을 때, 총점이 $29$점 이상일 확률을 각각 제시문을 이용하여 설명하고 구하시오. 단, 각각의 사격은 모두 독립이다.

subparts:
- id: '1'
  stem: |
    위 논제의 확률(총점이 $29$점 이상일 확률)을 제시문을 이용하여 설명하고 구하시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: '10\pi^3\left(\dfrac{9}{220}\right)^6', equivalents: ['0.81^3·(π/22^2)^2·(10π/22^2)', '약 1.453×10^{-6}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$q_{10}=0.81\cdot\frac{\pi}{22^2}$, $q_9=0.81\cdot\frac{3\pi}{22^2}$이고 구하는 확률은 $q_{10}^3+3q_{10}^2q_9=0.81^3p_1^2(p_1+3p_2)$.'
    steps:
    - {id: 1a, content: '$0.81^3\left(\dfrac{\pi}{22^2}\right)^2\dfrac{10\pi}{22^2}=10\pi^3\left(\dfrac{9}{220}\right)^6$', criteria: [1.A3]}
    hint_ladder:
    - 세 발 점수의 합이 29 이상이 되는 점수 배열을 모두 적어 보자.
    - 면적 비는 표적지를 맞혔다는 조건에서의 확률이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.15
    steps:
    - id: 1b-1
      content: |
        한 발의 점수는 최대 10점이므로 3발의 총점이 29점 이상인 경우를 사격 순서대로 나열하면 $(10,10,10)$, $(10,10,9)$, $(10,9,10)$, $(9,10,10)$의 4가지이고 이 사건들은 서로 배반이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        '철수가 표적지를 맞추는 사건' $A$, '1발의 사격에서 10점을 받을 사건' $B_1$, '9점을 받을 사건' $B_2$라 하면, 1발에서 10점과 9점을 받는 사건은 각각 $A\cap B_1$, $A\cap B_2$이다. 10점은 반지름 $25$ 이내, 9점은 반지름 $25$와 $50$ 사이 영역이므로
        $P(B_1\mid A)=p_1=\dfrac{25^2\pi}{550^2}=\dfrac{\pi}{22^2}$, $P(B_2\mid A)=p_2=\dfrac{50^2\pi-25^2\pi}{550^2}=\dfrac{3\pi}{22^2}$.
      criteria: [1.M2, 1.A1]
    - id: 1b-3
      content: |
        $P(A)=1-0.19=0.81$이므로 제시문 【나】에 의해 $P(A\cap B_1)=P(A)P(B_1\mid A)=0.81p_1$, $P(A\cap B_2)=0.81p_2$.
      criteria: [1.M3, 1.A2]
    - id: 1b-4
      content: |
        3발의 사격은 독립이므로 제시문 【다】에 의해 네 경우의 확률은 각각 $(0.81p_1)^3$, $(0.81p_1)^2(0.81p_2)$, $(0.81p_1)^2(0.81p_2)$, $(0.81p_1)^2(0.81p_2)$. 제시문 【가】에 의해 구하는 확률은 이들의 합
        $(0.81p_1)^3+3(0.81p_1)^2(0.81p_2)=0.81^3p_1^2(p_1+3p_2)=0.81^3\left(\dfrac{\pi}{22^2}\right)^2\left(\dfrac{10\pi}{22^2}\right)=10\pi^3\left(\dfrac{9}{220}\right)^6$.
      criteria: [1.R1, 1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 총점 29점 이상인 네 가지 점수 배열을 모두 적고 서로 배반임을 밝혔다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 10점·9점 영역을 반지름 $25$ 이내, $25$~$50$ 고리로 정하고 표적지 넓이 $550^2$에 대한 비로 확률을 세웠다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $p_1=\dfrac{\pi}{22^2}$, $p_2=\dfrac{3\pi}{22^2}$을 적었다.
      depends_on: [1.M2]
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: 【나】로 면적 비가 조건부확률임을 밝히고 명중 확률 $0.81$을 곱했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: 한 발에서 10점, 9점일 확률 $0.81p_1$, $0.81p_2$를 적었다.
      depends_on: [1.M3]
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: 【다】(독립)로 곱하고 【가】(배반)로 더하는 근거를 적었다.
      depends_on: []
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 5
      evidence: 답 $10\pi^3\left(\dfrac{9}{220}\right)^6$(또는 동치인 식)을 적었다.
      depends_on: [1.M1, 1.R1]
      steps: [1a, 1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
