stimuli:
- label: 가
  body: |
    중심이 원점 $(0,0)$인 원의 방정식 $x^2+y^2=r^2$를 매개변수 $t$로 나타내면 다음과 같다.
    $$x=r\cos t,\quad y=r\sin t\ \ (0\le t<2\pi)$$
    -『고등학교 미적분』
- label: 나
  body: |
    좌표평면 위를 움직이는 점 $P$의 시각 $t$에서의 위치 $(x,y)$가 두 함수 $x=f(t)$, $y=g(t)$로 나타내어질 때, 시각 $t$에서 점 $P$의 속력은 $\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}$이다.
    -『고등학교 미적분』
- label: 다
  body: |
    사인함수와 코사인함수의 덧셈과 뺄셈 정리는 각각 다음과 같다.
    $\sin(\alpha\pm\beta)=\sin\alpha\cos\beta\pm\cos\alpha\sin\beta$　　$\cos(\alpha\pm\beta)=\cos\alpha\cos\beta\mp\sin\alpha\sin\beta$
    -『고등학교 미적분』
- label: 라
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이면 함수 $f(x)$는 이 구간에서 반드시 최댓값과 최솟값을 가진다.
    -『고등학교 수학 Ⅱ』

stem: |
  중심이 $(1,0)$이고 반지름이 $1$인 원 위를 움직이는 점 $\mathrm{P}_1(1+\cos t,\ \sin t)$과 중심이 원점 $\mathrm{O}(0,0)$이고 반지름이 $2$인 원 위를 움직이는 점 $\mathrm{P}_2(2\cos\theta(t),\ 2\sin\theta(t))$가 있다. 두 원 위의 교점 $(2,0)$에서 두 원 위를 시계 반대 방향을 따라 움직이는 두 점 $\mathrm{P}_1$, $\mathrm{P}_2$의 속도의 비가 $1:4$라고 할 때, 다음 물음에 답하시오. (단, $0\le t<2\pi$)

subparts:
- id: '1'
  stem: |
    $t=t_0$에서 두 점 사이의 거리가 최대일 때, $\cos(t_0)$와 거리를 구하시오.
  points: 24
  depends_on: []
  answer: {kind: value, value: '\cos(t_0)=-\dfrac18,\ \text{최대 거리 }\dfrac{9\sqrt2}{4}', equivalents: ['cos t0=-1/8, d=9√2/4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\theta=2t$, $d^2=10-2\cos t-8\cos^2t$는 $\cos t=-\frac18$에서 $\frac{81}{8}$.'
    steps:
    - {id: 1a, content: '$d_{\max}=\sqrt{\dfrac{81}{8}}=\dfrac{9\sqrt2}{4}$', criteria: [1.A3]}
    hint_ladder:
    - P2의 속력을 $\theta'(t)$로 나타내 보자.
    - 거리의 제곱을 덧셈정리로 $\cos t$만의 식으로 바꾸어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.16
    steps:
    - id: 1b-1
      content: |
        제시문 【나】에 의해 점 $\mathrm{P}_1(1+\cos t,\sin t)$의 속력은 $\sqrt{\sin^2t+\cos^2t}=1$이다. 속력의 비가 $1:4$이므로 점 $\mathrm{P}_2(2\cos\theta(t),2\sin\theta(t))$의 속력은
        $2\sqrt{(\sin^2\theta(t)+\cos^2\theta(t))\left(\dfrac{d\theta}{dt}\right)^2}=2\left\lvert\dfrac{d\theta}{dt}\right\rvert=4$이어야 한다. 즉 $\left\lvert\dfrac{d\theta}{dt}\right\rvert=2$이고, $(2,0)$에서 시계 반대 방향으로 출발하므로 $\theta(t)=2t$, $\mathrm{P}_2(2\cos2t,2\sin2t)$.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        두 점 사이의 거리를 $d$라 두면
        $f(t)=d^2=(1+\cos t-2\cos2t)^2+(\sin t-2\sin2t)^2=6+2\cos t-4\cos2t-4\cos2t\cos t-4\sin2t\sin t$.
        제시문 【다】의 $\cos(t-2t)=\cos2t\cos t+\sin2t\sin t=\cos(-t)=\cos t$를 이용하면 $f(t)=6-2\cos t-4\cos2t$. $\cos2t=2\cos^2t-1$을 대입하면 $f(t)=10-2\cos t-8\cos^2t$.
      criteria: [1.M2, 1.A2]
    - id: 1b-3
      content: |
        $f'(t)=2\sin t+16\sin t\cos t=2\sin t(1+8\cos t)$이므로 $\sin t=0$ 또는 $\cos t=-\dfrac18$일 때 극점을 갖는다. $\sin t=0$일 때 $\cos t=1$ 또는 $-1$이며 $f(t)=0$ 또는 $4$, $\cos t=-\dfrac18$일 때 $f(t)=10+\dfrac14-\dfrac18=\dfrac{81}{8}$. $f$는 $[0,2\pi]$에서 연속이므로 【라】에 의해 최댓값을 가지며 그 값은 후보 중 가장 큰 $\dfrac{81}{8}$이다.
        그러므로 $\cos(t_0)=-\dfrac18$, 최대 거리는 $d=\sqrt{\dfrac{81}{8}}=\dfrac{9\sqrt2}{4}$.
      criteria: [1.R1, 1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 【나】로 두 점의 속력을 각각 $1$, $2\lvert\theta'(t)\rvert$로 구해 비의 식을 세웠다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 방향(시계 반대)·출발점을 근거로 $\theta(t)=2t$를 적었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 거리의 제곱을 전개하고 【다】의 덧셈정리로 $\cos2t\cos t+\sin2t\sin t=\cos t$를 써서 정리했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $d^2=10-2\cos t-8\cos^2t$(또는 $6-2\cos t-4\cos2t$)를 적었다.
      depends_on: [1.M2]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: 미분(또는 $\cos t$에 대한 이차함수의 꼭짓점)으로 후보를 구하고 값 비교·【라】로 최댓값임을 밝혔다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 3
      evidence: $\cos(t_0)=-\dfrac18$, 최대 거리 $\dfrac{9\sqrt2}{4}$를 적었다.
      depends_on: [1.R1]
      steps: [1a, 1b-3]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2107}
  misconceptions:
  - id: MC-CAL-2107
    outcome_code: '70'
    wrong_work: '속력의 비를 각속도의 비로 보아 $\theta(t)=4t$로 두고 계산'
    detect_cue: $\mathrm{P}_2(2\cos4t,\ 2\sin4t)$가 등장
    feedback: 반지름 $2$인 원 위의 점의 속력은 $2\lvert\theta'(t)\rvert$입니다. 【나】로 속력을 직접 계산하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    $t=t_0$에서 두 점의 위치를 모두 구하시오.
  points: 16
  depends_on: ['1']
  answer: {kind: set, value: '\left(\mathrm{P}_1\left(\dfrac78,\dfrac{\sqrt{63}}{8}\right),\ \mathrm{P}_2\left(-\dfrac{31}{16},-\dfrac{\sqrt{63}}{16}\right)\right)\ \text{또는}\ \left(\mathrm{P}_1\left(\dfrac78,-\dfrac{\sqrt{63}}{8}\right),\ \mathrm{P}_2\left(-\dfrac{31}{16},\dfrac{\sqrt{63}}{16}\right)\right)', equivalents: ['√63=3√7'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\sin t_0=\pm\frac{\sqrt{63}}{8}$, $\sin2t_0=\mp\frac{\sqrt{63}}{32}$, $\cos2t_0=-\frac{31}{32}$ (복부호 동순).'
    steps:
    - {id: 2a, content: '$\mathrm{P}_1\left(\dfrac78,\pm\dfrac{\sqrt{63}}{8}\right)$, $\mathrm{P}_2\left(-\dfrac{31}{16},\mp\dfrac{\sqrt{63}}{16}\right)$', criteria: [2.A2]}
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.16
    steps:
    - id: 2b-1
      content: |
        $\cos t_0=-\dfrac18$이므로 $\sin t_0=\pm\sqrt{1-\cos^2t_0}=\pm\dfrac{\sqrt{63}}{8}$, $\sin2t_0=2\sin t_0\cos t_0=\mp\dfrac{\sqrt{63}}{32}$, $\cos2t_0=2\cos^2t_0-1=-\dfrac{31}{32}$ (복부호 동순).
      criteria: [2.M1, 2.A1]
    - id: 2b-2
      content: |
        그러므로 $t=t_0$일 때 점의 위치는 $\mathrm{P}_1\left(\dfrac78,\dfrac{\sqrt{63}}{8}\right)$, $\mathrm{P}_2\left(-\dfrac{31}{16},-\dfrac{\sqrt{63}}{16}\right)$ 또는 $\mathrm{P}_1\left(\dfrac78,-\dfrac{\sqrt{63}}{8}\right)$, $\mathrm{P}_2\left(-\dfrac{31}{16},\dfrac{\sqrt{63}}{16}\right)$.
      criteria: [2.R1, 2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: $\cos t_0=-\dfrac18$에서 $\sin t_0$, 배각으로 $\sin2t_0$, $\cos2t_0$를 구하는 식이 있다.
      depends_on: []
      ft: {allowed: true, from: [1.A3], max_points: 4}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $\sin t_0=\pm\dfrac{\sqrt{63}}{8}$, $\sin2t_0=\mp\dfrac{\sqrt{63}}{32}$, $\cos2t_0=-\dfrac{31}{32}$을 적었다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: $\sin t_0$의 부호 두 경우를 모두 고려하고 $\mathrm{P}_1$과 $\mathrm{P}_2$의 $y$좌표 부호 대응(복부호 동순)을 밝혔다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: 두 경우의 위치 쌍을 모두 정확히 적었다.
      depends_on: [2.M1, 2.R1]
      steps: [2a, 2b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2108}
  misconceptions:
  - id: MC-CAL-2108
    outcome_code: '70'
    wrong_work: '$\sin t_0>0$인 경우 하나만 답하거나, $\mathrm{P}_1$과 $\mathrm{P}_2$의 $y$좌표 부호를 같게 짝지음'
    detect_cue: 위치 쌍이 하나뿐이거나 $\mathrm{P}_2\left(-\dfrac{31}{16},\dfrac{\sqrt{63}}{16}\right)$가 $\mathrm{P}_1\left(\dfrac78,\dfrac{\sqrt{63}}{8}\right)$과 짝지어짐
    feedback: '$0\le t<2\pi$에서 $\cos t=-\frac18$인 $t$는 둘입니다. $\sin2t=2\sin t\cos t$이고 $\cos t<0$이므로 부호가 반대입니다.'
    remedy: [RL-2]

