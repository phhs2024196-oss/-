stimuli:
- label: 가
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고 $x=a$의 좌우에서
    ① $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.
    ② $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.
    『고등학교 수학Ⅱ』
- label: 나
  body: |
    좌표평면 위를 움직이는 점 $P$의 시각 $t$에서의 위치가 $x=x(t)$, $y=y(t)$일 때, 점 $P$의 시각 $t$에서의 속도는 $(x'(t),\ y'(t))$이고 가속도는 $(x''(t),\ y''(t))$이다. 또한, $\sqrt{x'(t)^2+y'(t)^2}$을 속도의 크기 또는 속력이라고 한다.
    『고등학교 미적분』
- label: 다
  body: |
    사인함수와 코사인함수의 덧셈정리는 다음과 같다.
    $$\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$$
    $$\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$$
    『고등학교 미적분』

stem: |
  좌표평면 위를 움직이는 점 P가 시각 $t=0$일 때 위치는 원점이며 속력은 $v$이고 속도가 $x$축의 양의 방향과 이루는 각이 $\theta\ (0<\theta\le\dfrac{\pi}{2})$이다. 점 P의 가속도가 항상 $(a,\ -a)$일 때, 점 P의 자취가 이루는 곡선이 $x$축과 만나는 점(원점 제외)의 $x$좌표가 최대가 되도록 하는 $\theta$의 값을 구하시오. (단, $v$와 $a$는 양의 상수)
  <15줄 이내>

subparts:
- id: '1'
  stem: |
    위 논제의 $\theta$의 값을 구하시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: '\dfrac{3\pi}{8}', equivalents: ['3\pi/8', '67.5°'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 위치를 복원하면 $y(t)=0$의 양의 근이 $\dfrac{2v\sin\theta}{a}$이고, 그때 $x=\dfrac{2v^2}{a}(\sin^2\theta+\sin\theta\cos\theta)$를 배각으로 바꿔 최대화한다.
    steps:
    - {id: 1a, content: '$g(\theta)=\sin^2\theta+\sin\theta\cos\theta=\dfrac12+\dfrac{\sin2\theta-\cos2\theta}{2}$, $g$ 최대 $\iff 2\theta=\dfrac{3\pi}{4}$', criteria: [1.M2, 1.A2]}
    hint_ladder:
    - 가속도를 두 번 적분하면 위치를 알 수 있다.
    - 다시 $x$축에 닿는 시각을 θ로 나타내 보자.
    - 얻은 식을 $2\theta$에 대한 식으로 바꾸어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.4
    steps:
    - id: 1b-1
      content: |
        제시문 【나】에 의해 $x''(t)=a$, $y''(t)=-a$, 초기 속도 $(x'(0),y'(0))=(v\cos\theta,\ v\sin\theta)$, 초기 위치 $(0,0)$이므로
        $x'(t)=at+v\cos\theta$, $x(t)=\dfrac12at^2+vt\cos\theta$, $y'(t)=-at+v\sin\theta$, $y(t)=-\dfrac12at^2+vt\sin\theta$.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        $y(t)=t\left(v\sin\theta-\dfrac12at\right)=0$에서 $t\neq0$인 근은 $t_1=\dfrac{2v\sin\theta}{a}>0$이고, 이때
        $x(t_1)=\dfrac{2v^2}{a}\sin^2\theta+\dfrac{2v^2}{a}\sin\theta\cos\theta=\dfrac{2v^2}{a}\left(\sin^2\theta+\sin\theta\cos\theta\right)$.
      criteria: [1.M2, 1.A2]
    - id: 1b-3
      content: |
        $g(\theta)=\sin^2\theta+\sin\theta\cos\theta$ $(0<\theta\le\dfrac{\pi}{2})$라 하면
        $g'(\theta)=2\sin\theta\cos\theta+\cos^2\theta-\sin^2\theta=\sin2\theta+\cos2\theta=\sqrt2\sin\left(2\theta+\dfrac{\pi}{4}\right)$ (제시문 【다】).
      criteria: [1.M3]
    - id: 1b-4
      content: |
        $0<\theta\le\dfrac{\pi}{2}$에서 $\dfrac{\pi}{4}<2\theta+\dfrac{\pi}{4}\le\dfrac{5\pi}{4}$이므로 $g'(\theta)=0\iff\theta=\dfrac{3\pi}{8}$이고, 그 좌우에서 $g'$의 부호가 양에서 음으로 바뀐다. 제시문 【가】에 의해 $g$는 $\theta=\dfrac{3\pi}{8}$에서 극대이자 최대이다. 따라서 $\theta=\dfrac{3\pi}{8}$.
      criteria: [1.R1, 1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 가속도를 초기 조건과 함께 적분해 $x(t)$, $y(t)$를 구하는 과정이 있다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $x(t)=\dfrac12at^2+vt\cos\theta$, $y(t)=-\dfrac12at^2+vt\sin\theta$를 정확히 적었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $y(t)=0$에서 $t\neq0$인 시각을 구해 $x(t)$에 대입했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 교점의 $x$좌표 $\dfrac{2v^2}{a}(\sin^2\theta+\sin\theta\cos\theta)$를 적었다.
      depends_on: [1.M2]
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: $\sin^2\theta+\sin\theta\cos\theta$를 θ로 미분해 $\sin2\theta+\cos2\theta$ 꼴로 정리했다(또는 배각·합성으로 최댓값을 판단하는 식).
      depends_on: []
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: 주어진 범위에서 도함수의 부호 변화(또는 합성한 사인의 최대 조건)를 근거로 최대임을 밝혔다.
      depends_on: []
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: $\theta=\dfrac{3\pi}{8}$을 답으로 적었다.
      depends_on: [1.M3, 1.R1]
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
    - code: D1-2
      condition: 극대 판정 근거 없이 $g'(\theta)=0$인 값을 답으로 함
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-2001}
  - {code: '71', misconception: MC-CAL-2002}
  misconceptions:
  - id: MC-CAL-2001
    outcome_code: '70'
    wrong_work: '$y$방향 가속도를 $+a$로 두거나 적분상수(초기 속도)를 빠뜨려 $y(t)=-\dfrac12at^2$로 씀'
    detect_cue: 위치식에 $vt\sin\theta$ 또는 $vt\cos\theta$ 항이 없다
    feedback: 가속도를 적분할 때마다 초기 속도·초기 위치로 적분상수를 정하세요.
    remedy: [RL-1]
  - id: MC-CAL-2002
    outcome_code: '71'
    wrong_work: '$g(\theta)=\sin^2\theta+\sin\theta\cos\theta$를 $\sin\theta(\sin\theta+\cos\theta)$로 보고 $\theta=\dfrac{\pi}{4}$에서 최대라고 판단'
    detect_cue: 답이 $\dfrac{\pi}{4}$ 또는 $\dfrac{\pi}{2}$
    feedback: 곱의 각 인수가 최대인 점이 곱의 최대점은 아닙니다. 배각 공식으로 한 삼각함수로 정리해 미분하세요.
    remedy: [RL-2]

