stimuli:
- label: 가
  body: |
    어떤 시행에서 표본공간 $S$의 각 근원사건이 일어날 가능성이 모두 같은 정도로 기대될 때, 사건 A가 일어날 확률 $\mathrm{P}(A)$를
    $$\mathrm{P}(A)=\dfrac{n(A)}{n(S)}$$
    로 정의하고, 이를 사건 A가 일어날 수학적 확률이라고 한다.
    『고등학교 확률과통계』
- label: 나
  body: |
    사건 A가 일어났을 때 사건 B의 조건부확률은
    $$\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}\ (\text{단, }\mathrm{P}(A)\neq0)$$
    『고등학교 확률과통계』
- label: 다
  body: |
    서로 다른 $n$개에서 $r$개를 택하는 중복순열의 수는
    $${}_{n}\Pi_{r}=n^{r}$$
    『고등학교 확률과통계』
- label: 라
  body: |
    $n$개 중에 같은 것이 각각 $p$개, $q$개, $\cdots$, $r$개씩 있을 때, $n$개를 일렬로 나열하는 경우의 수는
    $$\dfrac{n!}{p!\,q!\cdots r!}\ (\text{단, }p+q+\cdots+r=n)$$
    『고등학교 확률과통계』
- label: 마
  body: |
    이산확률변수 $X$의 확률질량함수가
    $$P(X=x_i)=p_i\ (i=1,2,\cdots,n)$$
    일 때, $X$의 기댓값, 분산, 표준편차 $E(X)$, $V(X)$, $\sigma(X)$는
    $$E(X)=x_1p_1+x_2p_2+\cdots+x_np_n=m,\quad V(X)=E((X-m)^2),\quad \sigma(X)=\sqrt{V(X)}$$
    『고등학교 확률과통계』
- label: 바
  body: |
    이산확률변수 $X$와 상수 $a\,(a\neq0)$, $b$에 대하여
    $$E(aX+b)=aE(X)+b,\quad V(aX+b)=a^2V(X),\quad \sigma(aX+b)=\lvert a\rvert\sigma(X)$$
    『고등학교 확률과통계』
- label: 사
  body: |
    모평균이 $m$이고 모표준편차가 $\sigma$인 모집단에서 크기가 $n$인 표본을 임의추출할 때 표본평균 $\overline{X}$에 대하여
    $$E(\overline{X})=m,\quad V(\overline{X})=\dfrac{\sigma^2}{n},\quad \sigma(\overline{X})=\dfrac{\sigma}{\sqrt n}$$
    『고등학교 확률과통계』

stem: |
  어떤 식당에 A, B, C, D 네 가지 메뉴가 있다고 하고 각각의 가격이 A는 9,000원, B와 C는 10,000원, D는 15,000원이라고 하자. 5일 동안 하루에 한번 이 식당을 방문하여 무작위로 하나의 음식을 주문한다고 할 때, 다음의 질문에 답하시오.
  <15줄 이내>

subparts:
- id: '1'
  stem: |
    5일간의 총 가격에 대한 기댓값과 표준편차를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '기댓값 55000원, 표준편차 500\sqrt{110}원', equivalents: ['E=55000, σ=500√110≈5244'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 하루 가격 $X$의 평균·표준편차를 구한 뒤 총액 $=5\overline{X}$로 보고 【사】【바】를 적용한다.
    steps:
    - {id: 1a, content: '$E(X)=11000$, $\sigma(X)=500\sqrt{22}$ → 총액 평균 $55000$, 표준편차 $5\cdot\dfrac{500\sqrt{22}}{\sqrt5}=500\sqrt{110}$', criteria: [1.M1, 1.A2]}
    hint_ladder:
    - 하루 주문 가격을 확률변수로 놓아 보자.
    - 5일간의 총액은 표본평균의 몇 배인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.5
    steps:
    - id: 1b-1
      content: |
        하루 주문 가격을 $X$라 하면 $P(X=9000)=\dfrac14$, $P(X=10000)=\dfrac24$, $P(X=15000)=\dfrac14$. 제시문 【마】에 의해
        $E(X)=9000\cdot\dfrac14+10000\cdot\dfrac24+15000\cdot\dfrac14=11000$,
        $V(X)=2000^2\cdot\dfrac14+1000^2\cdot\dfrac24+4000^2\cdot\dfrac14=5500000$, $\sigma(X)=500\sqrt{22}$.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        5일간의 가격을 크기 5인 표본으로 보면 총액은 $5\overline{X}$. 【사】에 의해 $E(\overline{X})=11000$, $\sigma(\overline{X})=\dfrac{500\sqrt{22}}{\sqrt5}=100\sqrt{110}$이고, 【바】에 의해
        $E(5\overline{X})=55000$(원), $\sigma(5\overline{X})=500\sqrt{110}$(원).
      criteria: [1.M2, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 하루 가격의 확률분포(9000·10000·15000원, 확률 1/4·2/4·1/4)를 세우고 기댓값·분산 식을 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $E(X)=11000$, $\sigma(X)=500\sqrt{22}$(또는 $V(X)=5500000$)를 적었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 총액을 $5\overline{X}$(또는 독립인 5개의 합)로 보고 분산이 5배가 됨을 쓴 식이 있다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: 기댓값 $55000$원, 표준편차 $500\sqrt{110}$원을 적었다.
      depends_on: [1.M2]
      steps: [1b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-2001}
  misconceptions:
  - id: MC-PRB-2001
    outcome_code: '70'
    wrong_work: '총액 표준편차를 $5\sigma(X)=2500\sqrt{22}$로 계산'
    detect_cue: 답에 $2500\sqrt{22}$ 또는 $\sqrt{22}$ 꼴이 남음
    feedback: 독립인 확률변수 $n$개의 합은 분산이 $n$배, 표준편차는 $\sqrt n$배입니다. $\sigma(5\overline{X})=5\cdot\dfrac{\sigma}{\sqrt5}$를 확인하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    5일간의 총 가격이 59,000원이 나올 확률을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{15}{128}', equivalents: ['120/1024'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: A·(B 또는 C)·D 횟수 $(x,y,z)$가 $9x+10y+15z=59$, $x+y+z=5$의 유일한 해 $(1,2,2)$이고, 경우의 수 $\dfrac{5!}{1!2!2!}\cdot2^2=120$.
    steps:
    - {id: 2a, content: '$\dfrac{120}{4^5}=\dfrac{15}{128}$', criteria: [2.A2]}
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.5
    steps:
    - id: 2b-1
      content: |
        A, B 또는 C, D를 주문한 횟수를 각각 $x$, $y$, $z$(음이 아닌 정수)라 하면 $x+y+z=5$, $9x+10y+15z=59$. 첫 식의 9배를 빼면 $y+6z=14$이고 $y\le5$이므로 $z=2$, $y=2$, $x=1$로 유일하다.
      criteria: [2.M1, 2.A1]
    - id: 2b-2
      content: |
        A 1회, (B 또는 C) 2회, D 2회의 순서는 【라】에 의해 $\dfrac{5!}{1!\,2!\,2!}=30$가지, 각 (B 또는 C)에서 메뉴를 고르는 방법 $2^2$가지이므로 $120$가지. 전체는 【다】에 의해 $4^5=1024$가지이고 【가】에 의해 확률은 $\dfrac{120}{1024}=\dfrac{15}{128}$.
      criteria: [2.M2, 2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 주문 횟수에 대한 연립 조건 $x+y+z=5$, $9x+10y+15z=59$(또는 동치)를 세웠다.
      depends_on: []
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: 해가 $(x,y,z)=(1,2,2)$뿐임을 근거와 함께 적었다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: 같은 것이 있는 순열에 B·C 선택 $2^2$을 곱해 경우의 수를 세는 식이 있다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: 확률 $\dfrac{15}{128}$을 적었다.
      depends_on: [2.M2]
      steps: [2a, 2b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CNT-2001}
  misconceptions:
  - id: MC-CNT-2001
    outcome_code: '70'
    wrong_work: 'B와 C를 같은 메뉴로 보고 $\dfrac{30}{4^5}$ 또는 표본공간을 $3^5$으로 잡음'
    detect_cue: 답이 $\dfrac{15}{512}$ 또는 분모가 $3^5$
    feedback: 가격이 같아도 B와 C는 서로 다른 근원사건입니다. 같은 가격 묶음 안에서 고르는 방법 수를 곱하세요.
    remedy: [RL-2]
- id: '3'
  stem: |
    5일간의 총 가격이 59,000원이 나왔을 때, 마지막 날에 음식 C를 선택했을 확률을 구하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '\dfrac15', equivalents: ['0.2'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 마지막 날 C로 고정하면 앞 4일은 A 1·(B 또는 C) 1·D 2회, $\dfrac{4!}{1!1!2!}\cdot2=24$가지 → $\dfrac{24}{120}$.
    steps:
    - {id: 3a, content: '$\dfrac{24}{120}=\dfrac15$', criteria: [3.A1]}
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설집 p.5
    steps:
    - id: 3b-1
      content: |
        사건 $E$: 총액 59,000원, 사건 $F$: 마지막 날 C. (2)에 의해 $n(E)=120$. $E\cap F$는 처음 4일 동안 A 1회, (B 또는 C) 1회, D 2회이므로 $\dfrac{4!}{1!\,1!\,2!}\cdot2=24$가지.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        【나】에 의해 $\mathrm{P}(F\mid E)=\dfrac{\mathrm{P}(E\cap F)}{\mathrm{P}(E)}=\dfrac{24/4^5}{120/4^5}=\dfrac15$.
      criteria: [3.R1, 3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: 마지막 날 C로 고정했을 때 앞 4일의 구성(A 1, B·C 1, D 2)과 경우의 수 24를 적었다.
      depends_on: []
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: 조건부확률 정의 【나】를 인용해 $\dfrac{\mathrm{P}(E\cap F)}{\mathrm{P}(E)}$ 꼴로 썼다.
      depends_on: []
      ft: {allowed: true, from: [2.A2], max_points: 3}
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: 답 $\dfrac15$을 적었다.
      depends_on: [3.M1, 3.R1]
      steps: [3a, 3b-2]
    deductions:
    - code: D3-1
      condition: 제시문 인용 없음(동국 규정)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-2002}
  misconceptions:
  - id: MC-PRB-2002
    outcome_code: '70'
    wrong_work: '조건을 무시하고 $P(\text{마지막 날 C})=\dfrac14$, 또는 $\mathrm{P}(E\cap F)=\dfrac{24}{4^5}$만 답함'
    detect_cue: 답이 $\dfrac14$ 또는 $\dfrac{3}{128}$
    feedback: 조건부확률은 주어진 사건 안에서의 비율입니다. 분모를 $\mathrm{P}(E)$로 나누었는지 확인하세요.
    remedy: [RL-3]

