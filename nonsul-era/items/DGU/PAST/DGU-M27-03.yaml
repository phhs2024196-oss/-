  - id: MC-CAL-2102
    outcome_code: '70'
    wrong_work: '$x=f(t)$로 치환한 뒤 적분 구간을 $4\to28$ 그대로 둠'
    detect_cue: $\displaystyle\int_4^{28}\dfrac{4t^3+6t}{\sqrt{t^2+3}}dt$ 꼴이 보임
    feedback: 치환하면 구간도 새 변수의 값으로 바뀝니다. $f(t)=4$, $f(t)=28$인 $t$를 구하세요.
