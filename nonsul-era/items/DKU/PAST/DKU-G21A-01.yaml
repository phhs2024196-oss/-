stimuli:
- label: 가
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: 나
  body: |
    미분가능한 함수 $f(x)$가 $f'(a)=0$이고 $x=a$의 좌우에서
    (1) $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고, 극댓값은 $f(a)$
    (2) $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고, 극솟값은 $f(a)$
- label: 다
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능하고 $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)g'(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf'(x)g(x)\,dx$$
stem: |
  [문제 1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  함수 $f(x)$는
  $$f(x)=\begin{cases}\dfrac{1}{2e}(x+3)&(-3\le x<-1)\\[4pt](2x^2-1)e^{-x^2}&(-1\le x<1)\\[4pt]-\dfrac{1}{2e}(x-3)&(1\le x\le3)\end{cases}$$
  [그림: 곡선 $y=f(x)$. $x=-3$에서 $x$축과 만나 직선으로 증가하여 $x=-1$에서 꺾이는 꼭짓점, $-1<x<1$에서는 아래로 내려가 $x=0$에서 최솟값을 갖는 곡선, $x=1$에서 다시 꺾이는 꼭짓점, 이후 직선으로 감소하여 $x=3$에서 $x$축과 만난다.]

  $-3\le a\le3$에 대하여, 함수 $F(x)$는
  $$F(x)=\int_a^xf(t)\,dt\qquad(-3\le x\le3)$$
subparts:
- id: '1'
  stem: |
    [논제 1] $\displaystyle\int_0^1f(t)\,dt$의 값을 구하시오. (15점)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: -exp(-1)
    equivalents:
    - -1/E
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\int_0^1(2t^2-1)e^{-t^2}dt=\left[-te^{-t^2}\right]_0^1=-\frac1e$.
    steps:
    - id: 1a
      content: $2t^2e^{-t^2}=(-t)(-2te^{-t^2})$로 부분적분하면 $-\int e^{-t^2}$과 상쇄되어 $-\frac1e$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - 적분할 수 없는 $e^{-t^2}$이 두 항에 모두 나온다. 어떻게 상쇄할 수 있을까?
    - $(-te^{-t^2})'$을 계산해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 선행학습 영향평가 보고서 R21.pdf p.82 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        $[0,1]$에서 $f(t)=(2t^2-1)e^{-t^2}$이므로 $\displaystyle\int_0^1f(t)\,dt=\int_0^12t^2e^{-t^2}dt-\int_0^1e^{-t^2}dt$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        앞의 적분을 $2t^2e^{-t^2}=(-t)\cdot(-2te^{-t^2})$로 보고 부분적분법(제시문 (다))을 쓰면
        $\displaystyle\int_0^12t^2e^{-t^2}dt=\int_0^1(-t)\cdot(-2te^{-t^2})\,dt=\Big[-te^{-t^2}\Big]_0^1+\int_0^1e^{-t^2}dt$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        따라서 $\displaystyle\int_0^1f(t)\,dt=\Big[-te^{-t^2}\Big]_0^1+\int_0^1e^{-t^2}dt-\int_0^1e^{-t^2}dt=-\frac1e$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        적분함수(원시함수) $-te^{-t^2}$가 나오도록 부분적분법을 적용한 식을 적었다(공식 채점기준 15점 중 10점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
      - 1a
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $e^{-t^2}$ 적분이 상쇄됨을 보이고 $-\frac1e$를 구했다(공식 5점).
      depends_on:
      - 1.M1
      steps:
      - 1b-3
      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] $-3\le x\le3$에서 곡선 $y=F(x)$와 $x$축이 한 점에서 만나도록 하는 $a$의 값을 모두 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: set
    value: '{-sqrt(2)/2, sqrt(2)/2}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $F=F_0(x)-F_0(a)$, $F_0$의 극댓값 $\frac1{\sqrt2}e^{-1/2}$($x=-\frac1{\sqrt2}$), 극솟값 $-\frac1{\sqrt2}e^{-1/2}$($x=\frac1{\sqrt2}$)이므로 $a=\pm\frac{\sqrt2}2$.
    steps:
    - id: 2a
      content: $F(x)=0\iff F_0(x)=F_0(a)$ → 수평선이 극값에서만 곡선과 한 점에서 만난다
      criteria:
      - 2.M1
      - 2.A1
    hint_ladder:
    - $F(x)=0$을 $F_0$로 바꿔 쓰면?
    - $F_0$의 증감을 조사해 수평선 $y=c$와 한 점에서만 만나는 $c$를 찾아 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2021 선행학습 영향평가 보고서 R21.pdf p.82~83 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        $F(x)=\displaystyle\int_a^xf(t)\,dt=\int_0^xf(t)\,dt-\int_0^af(t)\,dt$이므로 $F_0(x)=\displaystyle\int_0^xf(t)\,dt$라 하면 $F(x)=F_0(x)-F_0(a)$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $F_0(x)$를 구간별로 구하면
        (i) $-3\le x<-1$: $F_0(x)=\displaystyle\int_0^{-1}(2t^2-1)e^{-t^2}dt+\int_{-1}^{x}\frac1{2e}(t+3)\,dt=\frac1{2e}\left(\frac12x^2+3x\right)+\frac9{4e}$
        (ii) $-1\le x<1$: $F_0(x)=\displaystyle\int_0^xf(t)\,dt=-xe^{-x^2}$
        (iii) $1\le x\le3$: $F_0(x)=\displaystyle\int_0^1(2t^2-1)e^{-t^2}dt+\int_1^x\left(-\frac1{2e}\right)(t-3)\,dt=-\frac1{2e}\left(\frac12x^2-3x\right)-\frac9{4e}$
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        $F_0'(x)=f(x)$이므로 $f(x)=0$인 $x=\pm\dfrac1{\sqrt2}$ 전후의 증감을 조사하면 다음과 같다.

        | $x$ | $-3$ | $\cdots$ | $-\frac1{\sqrt2}$ | $\cdots$ | $\frac1{\sqrt2}$ | $\cdots$ | $3$ |
        |---|---|---|---|---|---|---|---|
        | $F_0'(x)$ | | $+$ | $0$ | $-$ | $0$ | $+$ | |
        | $F_0(x)$ | $0$ | ↗ | $\frac1{\sqrt2}e^{-\frac12}$ | ↘ | $-\frac1{\sqrt2}e^{-\frac12}$ | ↗ | $0$ |

        따라서 $y=F_0(x)$의 그래프는 $x=-3$에서 $0$으로 시작해 $x=-\frac1{\sqrt2}$에서 극대, $x=\frac1{\sqrt2}$에서 극소, $x=3$에서 $0$으로 끝나는 개형이다.
      criteria:
      - 2.M1
    - id: 2b-4
      content: |
        곡선 $y=F(x)$와 $x$축이 한 점에서 만나는 경우는 곡선 $y=F_0(x)$와 직선 $y=F_0(a)$가 한 점에서 만나는 경우와 같다. 위 그래프에서 직선이 곡선과 한 점에서만 만나는 것은 $F_0(a)$가 극댓값 또는 극솟값일 때이므로 $a=-\dfrac{\sqrt2}{2}$ 또는 $a=\dfrac{\sqrt2}{2}$이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 12
      evidence: |
        $F(x)=F_0(x)-F_0(a)$로 쓰고 $F_0(x)$를 구간별로 구해 증감과 그래프의 개형을 제시했다(공식 채점기준 20점 중 12점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2b-2
      - 2b-3
      - 2a
    - id: 2.A1
      mark_type: A
      points: 8
      evidence: |
        수평선 $y=F_0(a)$가 극값에서만 한 점에서 만남을 이용해 $a=\pm\frac{\sqrt2}2$를 구했다(공식 8점).
      depends_on:
      - 2.M1
      steps:
      - 2b-4
      - 2a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [논제 3] $g(x)=x-x^2+\lvert x-x^2\rvert$에 대하여
    $$h(x)=16g\left(\frac x4\right)+8g\left(\frac x2-2\right)$$
    라 할 때, 다음 조건을 만족시키는 실수 $t$의 값을 모두 구하시오. (20점)

    [조건] 각 $t$에 대하여, $x$에 대한 방정식 $t\,h(x)=x\,h(t)$의 서로 다른 실근의 개수는 $3$이다.
  points: 20
  depends_on: []
  answer:
    kind: set
    value: '{8*sqrt(6) - 16, 2*sqrt(6)}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $h(x)=-2x(x-4)\ (0\le x\le4)$, $-4(x-4)(x-6)\ (4\le x\le6)$, 그 밖에 $0$. $y=\frac{h(t)}{t}x$가 둘째 아치에 접할 때 세 점: 접점 $x=2\sqrt6$, 기울기 $40-16\sqrt6$, 첫 아치와의 교점 $x=8\sqrt6-16$.
    steps:
    - id: 3a
      content: 접선의 기울기 $40-16\sqrt6$를 주는 $t$는 접점 $2\sqrt6$과 첫 아치 위의 $8\sqrt6-16$ 두 개
      criteria:
      - 3.M1
      - 3.A1
    hint_ladder:
    - $g$는 어떤 구간에서 $0$이고 어떤 구간에서 $2(x-x^2)$인가?
    - $t\,h(x)=x\,h(t)$는 원점을 지나는 직선과 $y=h(x)$의 교점으로 볼 수 있다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2021 선행학습 영향평가 보고서 R21.pdf p.83~84 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: |
        $x-x^2\ge0$이면 $g(x)=2(x-x^2)$이고 $x-x^2<0$이면 $g(x)=0$이므로
        $g(x)=\begin{cases}0&(x<0)\\-2x(x-1)&(0\le x\le1)\\0&(x>1)\end{cases}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        이 식으로부터
        $16g\left(\dfrac x4\right)=\begin{cases}0&(x<0)\\-2x(x-4)&(0\le x\le4)\\0&(x>4)\end{cases}\ \cdots(1)$,
        $8g\left(\dfrac x2-2\right)=\begin{cases}0&(x<4)\\-4(x-4)(x-6)&(4\le x\le6)\\0&(x>6)\end{cases}\ \cdots(2)$
        이고, (1)과 (2)에 의하여 $h(x)=\begin{cases}0&(x<0)\\-2x(x-4)&(0\le x<4)\\-4(x-4)(x-6)&(4\le x\le6)\\0&(x>6)\end{cases}$이다.
      criteria:
      - 3.M1
    - id: 3b-3
      content: |
        실수 $t$에 대하여 방정식 $t\,h(x)=x\,h(t)\ \cdots(3)$을 푼다.
        (i) $t=0$이면 모든 실수 $x$가 방정식 (3)을 만족한다.
        (ii) $t\ne0$이면 (3)은 $h(x)=\dfrac{h(t)}{t}x$이므로 실근의 개수는 곡선 $y=h(x)$와 직선 $y=\dfrac{h(t)}{t}x$의 교점의 개수와 같다.
      criteria:
      - 3.M1
    - id: 3b-4
      content: |
        $y=h(x)$의 그래프(원점에서 시작해 $x=4$에서 $x$축에 닿는 아치와 $4\le x\le6$의 작은 아치)로부터 직선 $y=\dfrac{h(t)}{t}x$와 곡선이 세 점에서 만나는 경우는 구간 $4\le x\le6$에서 직선이 곡선 $y=h(x)$에 접하는 경우이다. 원점을 지나는 직선이 곡선 $y=-4(x-4)(x-6)$에 접하는 접점의 $x$좌표는 $x=2\sqrt6$이므로 접선의 방정식은 $y=(40-16\sqrt6)x$이다. 또한 구간 $0\le x\le4$에서 직선 $y=(40-16\sqrt6)x$와 곡선 $y=h(x)$가 만나는 점의 $x$좌표는 $x=0$과 $x=8\sqrt6-16$이다. 결국 구하고자 하는 $t$의 값은 $t=8\sqrt6-16$과 $t=2\sqrt6$이다.
