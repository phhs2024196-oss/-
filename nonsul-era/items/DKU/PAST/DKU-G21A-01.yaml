intent: |
  적분법(부분적분), 극값의 개념과 함수의 그래프 개형, 함수의 개념과 접선의 성질을 이해하고 활용할 수 있는지 본다. 논제 1은 부분적분법으로 정적분 $\int_0^1f(t)\,dt$를 구하고, 논제 2는 $F(x)=F_0(x)-F_0(a)$로 쓴 뒤 $F_0$의 증감과 개형으로 $y=F(x)$가 $x$축과 한 점에서 만나는 $a$를 찾으며, 논제 3은 $h(x)$의 그래프와 원점을 지나는 직선이 세 점에서 만나는 조건(접선)을 찾는다.
key_idea: |
  1은 $2t^2e^{-t^2}=(-t)(-2te^{-t^2})$로 부분적분. 2는 $F=F_0(x)-F_0(a)$이고 $F_0$의 극댓값·극솟값이 $a=\mp\frac1{\sqrt2}$에서 생기므로 수평선 $y=F_0(a)$가 극값에서만 한 점. 3은 $h(x)$가 두 포물선 아치이므로 원점을 지나는 직선이 둘째 아치에 접하는 경우.
stuck: 2에서 $x$축과의 교점을 $F_0(x)=F_0(a)$로 바꾸는 것, 3에서 같은 직선을 주는 $t$가 두 개(접점 $x=2\sqrt6$ 자신과 첫째 아치와의 교점 $x=8\sqrt6-16$)임을 놓치지 않는 것
