stimuli:
- label: 가
  body: |
    $n$개 중에서 같은 것이 각각 $a$개, $b$개씩 있을 때, $n$개를 일렬로 나열하는 경우의 수는
    $$\frac{n!}{a!\,b!}\qquad(\text{단, }n=a+b)$$
- label: 나
  body: |
    두 사건 $A$와 $B$가 서로 독립이기 위한 필요충분조건은
    $$\mathrm{P}(A\cap B)=\mathrm{P}(A)\mathrm{P}(B)\qquad(\text{단, }\mathrm{P}(A)>0,\ \mathrm{P}(B)>0)$$
- label: 다
  body: |
    확률 $\mathrm{P}(X=x)$의 증감을 파악하기 위하여 확률의 비 또는 차를 이용할 수 있다.
stem: |
  [문제 2] 다음 제시문을 읽고 질문에 답하시오. (45점)

  [그림 1]과 같이 $k$번째 행에는 $k$개의 분기점이 있는 삼각형 모양의 배열이 있다. ($k=1,2,\cdots,101$)
  [그림 1: 1행에 분기점 1개, 2행에 2개, 3행에 3개, 4행에 4개, … 가 삼각형 모양으로 놓여 있고, 각 분기점에서 바로 아래 행의 왼쪽 분기점으로 가는 화살표에 $p$, 오른쪽 분기점으로 가는 화살표에 $q$가 적혀 있다.]
  [그림 2: $k$행의 한 분기점(회색)에서 $k+1$행의 가장 가까운 두 분기점으로 화살표가 나가며 왼쪽 화살표에 $p$, 오른쪽 화살표에 $q$가 적혀 있다.]

  공은 다음 규칙에 따라 아래로 이동한다.
  (1) 공은 $k$번째 행에서 화살표 방향을 따라 바로 아래의 $k+1$번째 행의 가장 가까운 두 분기점 중 한 곳으로 이동한다.([그림 2])
  (2) 각 분기점에서 공이 바로 아래 행의 왼쪽 분기점으로 이동할 확률 $p=\dfrac15$이고, 바로 아래 행의 오른쪽 분기점으로 이동할 확률 $q=\dfrac45$이다.
  (3) 한 분기점에서 공의 이동 방향은 이전 분기점에서의 이동 방향에 영향을 받지 않는다.

  공이 마지막으로 $101$번째 행에 도착하였을 때, $101$번째 행의 분기점들에 왼쪽부터 차례로 $0,1,2,\cdots,100$의 순번을 부여하였다. 공이 도착한 분기점의 번호를 확률변수 $X$라 하고, 공이 $1$행에서 출발하여 위의 규칙을 통하여 $101$번째 행의 $x$번 분기점에 도착할 확률을 $\mathrm{P}(X=x)$라 하자.
subparts:
- id: '1'
  stem: |
    [논제 1] $\dfrac{\mathrm{P}(X=87)}{\mathrm{P}(X=88)}$을 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 22/13
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      오른쪽 $87$번·왼쪽 $13$번이므로 $\mathrm{P}(X=87)={}_{100}\mathrm C_{87}\left(\frac15\right)^{13}\left(\frac45\right)^{87}$, $\mathrm{P}(X=88)={}_{100}\mathrm C_{88}\left(\frac15\right)^{12}\left(\frac45\right)^{88}$, 비는 $\frac{88}{13}\cdot\frac14=\frac{22}{13}$.
    steps:
    - id: 1a
      content: '독립시행: 경로 수 $\frac{100!}{13!87!}$, 비 $=\frac{22}{13}$'
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - $87$번 분기점에 도착하려면 오른쪽·왼쪽으로 각각 몇 번 이동해야 하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 선행학습 영향평가 보고서 R21.pdf p.88 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        공이 $87$번 분기점에 도착하는 사건이 발생하려면 $100$번 중 $87$번은 오른쪽으로, $13$번은 왼쪽으로 이동하여야 한다. 공의 이동은 규칙 (3)에 의해 독립시행이므로
        $\mathrm{P}(X=87)={}_{100}\mathrm C_{87}\left(\dfrac15\right)^{13}\left(\dfrac45\right)^{87}=\dfrac{100!}{13!\,87!}\left(\dfrac15\right)^{13}\left(\dfrac45\right)^{87}$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        같은 방법으로 $\mathrm{P}(X=88)={}_{100}\mathrm C_{88}\left(\dfrac15\right)^{12}\left(\dfrac45\right)^{88}=\dfrac{100!}{12!\,88!}\left(\dfrac15\right)^{12}\left(\dfrac45\right)^{88}$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        따라서 $\dfrac{\mathrm{P}(X=87)}{\mathrm{P}(X=88)}=\dfrac{12!\,88!}{13!\,87!}\cdot\dfrac{\frac15}{\frac45}=\dfrac{88}{13}\cdot\dfrac14=\dfrac{22}{13}$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        공이 $87$번과 $88$번 분기점에 도착할 확률을 독립시행의 확률로 각각 제시했다(공식 채점기준 20점 중 15점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
      - 1a
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        두 확률의 비를 계산해 $\frac{22}{13}$를 구했다(공식 5점).
      depends_on:
      - 1.M1
      steps:
      - 1b-3
      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] $\mathrm{P}(X=x)$가 $x=a$에서 최댓값을 가질 때 $a$의 값을 구하시오. (25점)
  points: 25
  depends_on: []
  answer:
    kind: value
    value: '80'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $\frac{\mathrm{P}(X=x+1)}{\mathrm{P}(X=x)}=\frac{4(100-x)}{x+1}>1\iff x\le79$. $x\le79$에서 증가, $x\ge80$에서 감소하므로 $a=80$.
    steps:
    - id: 2a
      content: 인접 확률의 비 $\frac{4(100-x)}{x+1}$와 $1$의 대소로 증감 판정 → $a=80$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $\mathrm{P}(X=x)$를 $x$의 식으로 쓰고 $\mathrm{P}(X=x+1)$과 비교해 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2021 선행학습 영향평가 보고서 R21.pdf p.88 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        공이 $101$번째 행의 $x$번 분기점에 도착할 확률은 $\mathrm{P}(X=x)=\dfrac{100!}{x!\,(100-x)!}\left(\dfrac15\right)^{100-x}\left(\dfrac45\right)^{x}$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\dfrac{\mathrm{P}(X=x+1)}{\mathrm{P}(X=x)}=\dfrac{\dfrac{100!}{(x+1)!(100-x-1)!}\left(\frac15\right)^{100-x-1}\left(\frac45\right)^{x+1}}{\dfrac{100!}{x!(100-x)!}\left(\frac15\right)^{100-x}\left(\frac45\right)^{x}}=\dfrac{4(100-x)}{x+1}\quad\cdots(\star)$
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        $(\star)$이 $1$보다 클 필요충분조건은 $4(100-x)>x+1$, 즉 $399>5x$이다. 따라서 $x\le79$일 때 $\mathrm{P}(X=x+1)>\mathrm{P}(X=x)$이고 $x\ge80$일 때 $\mathrm{P}(X=x+1)<\mathrm{P}(X=x)$이다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        즉 $x\le80$일 때 $\mathrm{P}(X=x)$는 증가하고 $x\ge80$일 때 $\mathrm{P}(X=x)$는 감소한다. 그러므로 구하고자 하는 $a$의 값은 $80$이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
