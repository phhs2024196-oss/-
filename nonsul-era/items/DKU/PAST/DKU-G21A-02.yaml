      points: 7
      evidence: |
        $\mathrm{P}(X=x)$와 $\mathrm{P}(X=x+1)$의 비 $\frac{4(100-x)}{x+1}$를 제시했다(공식 채점기준 25점 중 7점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2b-2
      - 2a
    - id: 2.M2
      mark_type: M
      points: 8
      evidence: |
        부등식 $\frac{4(100-x)}{x+1}>1$의 풀이 과정($399>5x$)을 제시했다(공식 8점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-3
      - 2a
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        증가·감소 구간을 결론짓고 $a=80$을 구했다(공식 10점).
      depends_on:
      - 2.M1
      - 2.M2
      steps:
      - 2b-4
      - 2a
    deductions: []
