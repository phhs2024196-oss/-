intent: |
  독립시행과 이항분포의 개념을 이해하고 활용할 수 있는지 본다. 논제 1은 100번의 이동 중 오른쪽·왼쪽 이동 횟수로 $\mathrm{P}(X=87)$, $\mathrm{P}(X=88)$을 독립시행의 확률로 쓰고 비를 구하며, 논제 2는 연속한 두 확률의 비 $\frac{\mathrm{P}(X=x+1)}{\mathrm{P}(X=x)}$가 $1$보다 큰지 판정해 최댓값의 위치를 찾는다.
key_idea: |
  $\mathrm{P}(X=x)={}_{100}\mathrm C_x\left(\frac15\right)^{100-x}\left(\frac45\right)^x$. 1은 두 식의 비, 2는 $\frac{\mathrm{P}(X=x+1)}{\mathrm{P}(X=x)}=\frac{4(100-x)}{x+1}>1\iff x\le79$로 증감 판정.
stuck: 2에서 확률 자체가 아니라 인접 확률의 비(또는 차)로 증감을 따지는 발상, 부등식 $399>5x$의 경계($x=79$ 이하에서 증가)를 정확히 읽는 것
