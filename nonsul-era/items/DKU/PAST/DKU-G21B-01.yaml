stimuli:
- label: 가
  body: |
    두 사건 $A$와 $B$가 서로 독립이기 위한 필요충분조건은
    $$\mathrm{P}(A\cap B)=\mathrm{P}(A)\mathrm{P}(B)\qquad(\text{단, }\mathrm{P}(A)>0,\ \mathrm{P}(B)>0)$$
- label: 나
  body: |
    사건 $B$가 일어났을 때 사건 $A$의 조건부확률은
    $$\mathrm{P}(A\mid B)=\frac{\mathrm{P}(A\cap B)}{\mathrm{P}(B)}\qquad(\text{단, }\mathrm{P}(B)>0)$$
- label: 다
  body: |
    두 사건 $A$와 $B$에 대하여
    $$\mathrm{P}(A)=\mathrm{P}(A\cap B)+\mathrm{P}(A\cap B^c)$$
stem: |
  [문제 1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  그림과 같은 회로에서 독립적으로 작동하는 스위치 $S_A$, $S_B$, $S_C$, $S_D$, $S_E$가 닫힐 확률이 순서대로 $\dfrac25,\dfrac25,\dfrac35,\dfrac35,p$ 이다.
  [그림: 건전지와 전구가 연결된 회로. 왼쪽 도선과 오른쪽 도선 사이에 위쪽 가로선에는 $S_A$(왼쪽), $S_B$(오른쪽)가 직렬로, 아래쪽 가로선에는 $S_C$(왼쪽), $S_D$(오른쪽)가 직렬로 놓여 있고, $S_A$와 $S_B$ 사이의 점과 $S_C$와 $S_D$ 사이의 점을 $S_E$가 세로로 잇는다.]
subparts:
- id: '1'
  stem: |
    [논제 1] $p=1$일 때, 전구가 켜질 확률을 구하시오. (15점)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 361/625
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $S_E$가 닫혀 있으므로 전구가 켜질 사건은 $(A\cup C)\cap(B\cup D)$, $\mathrm{P}=\left(1-\frac35\cdot\frac25\right)^2=\frac{361}{625}$.
    steps:
    - id: 1a
      content: $\mathrm{P}(S)=[1-\mathrm{P}(A^c)\mathrm{P}(C^c)][1-\mathrm{P}(B^c)\mathrm{P}(D^c)]=\frac{361}{625}$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - $S_E$가 닫혀 있으면 $S_A,S_C$는 어떻게 연결되는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 선행학습 영향평가 보고서 R21.pdf p.92 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        스위치 $S_A,S_B,S_C,S_D,S_E$가 닫힐 사건을 순서대로 $A,B,C,D,E$라 하고 전구에 불이 켜질 사건을 $S$라 하자. 각 사건의 확률을 $\mathrm{P}(A),\mathrm{P}(B),\mathrm{P}(C),\mathrm{P}(D),\mathrm{P}(E),\mathrm{P}(S)$라 하자.
        $p=1$이므로 $\mathrm{P}(S\mid E)=\mathrm{P}(S)$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $S_E$가 닫혀 있으면 $(S_A,S_C)$가 병렬, $(S_B,S_D)$가 병렬로 직렬 연결되므로
        $\mathrm{P}(S)=\left[1-\mathrm{P}(A^c)\mathrm{P}(C^c)\right]\left[1-\mathrm{P}(B^c)\mathrm{P}(D^c)\right]=\left[1-\dfrac35\cdot\dfrac25\right]\left[1-\dfrac35\cdot\dfrac25\right]=\dfrac{19^2}{5^4}=\dfrac{361}{625}$이다.
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-3
      content: |
        (별해) $\mathrm{P}(S)=\mathrm{P}((A\cup C)\cap(B\cup D))=\left[\mathrm{P}(A)+\mathrm{P}(C)-\mathrm{P}(A\cap C)\right]\left[\mathrm{P}(B)+\mathrm{P}(D)-\mathrm{P}(B\cap D)\right]=\left[\dfrac25+\dfrac35-\dfrac6{25}\right]^2=\dfrac{361}{625}$.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        정답의 분모 $625=5^4$가 나오도록 사건을 $(A\cup C)\cap(B\cup D)$ 구조로 세워 확률 식을 제시했다(공식 채점기준 15점 중 5점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
      - 1a
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        전구가 켜질 확률 $\frac{361}{625}$를 구했다(공식 10점).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
      - 1b-3
      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] $0\le p<1$일 때, 전구가 켜질 확률이 $\dfrac{a}{625}p+\dfrac{b}{625}$이다. 자연수 $a$와 $b$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: a=72, b=289
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $\mathrm{P}(S\mid E^c)=\mathrm{P}((A\cap B)\cup(C\cap D))=\frac{289}{625}$, $\mathrm{P}(S)=\frac{361}{625}p+\frac{289}{625}(1-p)=\frac{72}{625}p+\frac{289}{625}$.
    steps:
    - id: 2a
      content: $S_E$ 열림 확률 $\frac{289}{625}$, 닫힘 확률 $\frac{361}{625}$를 전확률로 합쳐 $a=72,\ b=289$
      criteria:
      - 2.M1
      - 2.A1
    hint_ladder:
    - $S_E$가 열려 있으면 회로는 어떻게 되는가?
    - $\mathrm{P}(S)=\mathrm{P}(S\cap E)+\mathrm{P}(S\cap E^c)$를 이용해 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2021 선행학습 영향평가 보고서 R21.pdf p.92 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        $S_E$가 열려 있을 때($E^c$) 전구가 켜질 확률은
        $\mathrm{P}(S\mid E^c)=1-[1-\mathrm{P}(A\cap B)][1-\mathrm{P}(C\cap D)]=1-\left[1-\dfrac25\cdot\dfrac25\right]\left[1-\dfrac35\cdot\dfrac35\right]=1-\dfrac{21}{25}\cdot\dfrac{16}{25}=\dfrac{289}{625}$이다. (원 예시답안은 첫 곱사건을 $\mathrm{P}(A|B)$로 표기하였으나 독립이므로 $\mathrm{P}(A\cap B)=\frac25\cdot\frac25$이다.)
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        이고, [논제 1]에서 $\mathrm{P}(S\mid E)=\dfrac{361}{625}$이므로
        $\mathrm{P}(S)=\mathrm{P}(S\cap E)+\mathrm{P}(S\cap E^c)=\mathrm{P}(S\mid E)\mathrm{P}(E)+\mathrm{P}(S\mid E^c)\mathrm{P}(E^c)=\dfrac{361}{625}p+\dfrac{289}{625}(1-p)=\dfrac{72}{625}p+\dfrac{289}{625}$이다.
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        결국 $a=72$, $b=289$이다.
        (별해) $\mathrm{P}(S\mid E^c)=\mathrm{P}((A\cap B)\cup(C\cap D))=\mathrm{P}(A\cap B)+\mathrm{P}(C\cap D)-\mathrm{P}(A\cap B\cap C\cap D)=\left(\dfrac25\right)^2+\left(\dfrac35\right)^2-\left(\dfrac25\right)^2\left(\dfrac35\right)^2=\dfrac{289}{625}$.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        스위치 $S_E$가 열렸을 때의 조건부확률 $\mathrm{P}(S\mid E^c)=\frac{289}{625}$를 제시했다(공식 채점기준 20점 중 10점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2a
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        전확률 분해로 $\frac{72}{625}p+\frac{289}{625}$를 얻어 $a=72$, $b=289$를 구했다(공식 10점).
      depends_on:
      - 2.M1
      steps:
      - 2b-2
      - 2b-3
      - 2a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [논제 3] 다음 조건을 만족시키는 $p$의 최솟값과 최댓값을 구하시오. (20점)

    [조건] 전구가 켜졌을 때, $S_E$가 닫혀있을 확률은 $\dfrac12$ 이상이고
    전구가 켜졌을 때, $S_E$가 닫혀있지 않을 확률은 $\dfrac13$ 이상이다.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: min=289/650, max=578/939
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $\frac12\le\mathrm{P}(E\mid S)$, $\frac13\le\mathrm{P}(E^c\mid S)=1-\mathrm{P}(E\mid S)$ → $\frac12\le\mathrm{P}(E\mid S)\le\frac23$, $\mathrm{P}(E\mid S)=\frac{361p}{361p+289(1-p)}$로 풀어 $\frac{289}{650}\le p\le\frac{578}{939}$.
    steps:
    - id: 3a
      content: $\mathrm{P}(E\mid S)$의 범위 $[\frac12,\frac23]$를 $p$에 대한 부등식으로 → 최솟값 $\frac{289}{650}$, 최댓값 $\frac{578}{939}$
      criteria:
      - 3.M1
      - 3.A1
    hint_ladder:
    - 두 조건을 $\mathrm{P}(E\mid S)$ 하나의 부등식으로 합쳐 보자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2021 선행학습 영향평가 보고서 R21.pdf p.92 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: |
        주어진 조건으로부터 $\dfrac12\le\mathrm{P}(E\mid S)$, $\dfrac13\le\mathrm{P}(E^c\mid S)$이고 $\mathrm{P}(E\mid S)+\mathrm{P}(E^c\mid S)=1$이므로 $\dfrac12\le\mathrm{P}(E\mid S)\le\dfrac23$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\dfrac12\le\mathrm{P}(E\mid S)=\dfrac{\mathrm{P}(S\cap E)}{\mathrm{P}(S)}=\dfrac{\frac{361}{625}\cdot p}{\frac{361}{625}p+\frac{289}{625}(1-p)}\le\dfrac23$이므로 $\dfrac{289}{650}\le p\le\dfrac{578}{939}$이다.
      criteria:
      - 3.A1
    - id: 3b-3
      content: |
        따라서 $p$의 최솟값은 $\dfrac{289}{650}$, 최댓값은 $\dfrac{578}{939}$이다.
        (별해) $\dfrac13\le\mathrm{P}(E^c\mid S)\le\dfrac12$을 이용하여 $\dfrac{289}{650}\le p\le\dfrac{578}{939}$임을 유도할 수 있다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
