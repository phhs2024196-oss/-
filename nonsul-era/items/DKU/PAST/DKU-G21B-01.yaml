      points: 10
      evidence: |
        조건부확률의 범위 $\frac12\le\mathrm{P}(E\mid S)\le\frac23$를 제시했다(공식 채점기준 20점 중 10점).
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
      - 3a
    - id: 3.A1
      mark_type: A
      points: 10
      evidence: |
        $p$의 부등식을 풀어 최솟값 $\frac{289}{650}$, 최댓값 $\frac{578}{939}$를 구했다(공식 10점).
      depends_on:
      - 3.M1
      steps:
      - 3b-2
      - 3b-3
      - 3a
