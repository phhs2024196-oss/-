intent: |
  확률의 기본개념과 곱셈정리, 조건부확률의 개념을 이해하고 활용할 수 있는지 본다. 스위치 회로에서 전구가 켜질 사건을 $S_E$가 닫힌 경우와 열린 경우로 나누어 확률을 구하고($p=1$이면 $(A\cup C)\cap(B\cup D)$, 열려 있으면 $(A\cap B)\cup(C\cap D)$), 전체확률 $\mathrm{P}(S)=\mathrm{P}(S\mid E)\mathrm{P}(E)+\mathrm{P}(S\mid E^c)\mathrm{P}(E^c)$로 $p$의 일차식을 얻은 뒤, 조건부확률 $\mathrm{P}(E\mid S)$의 범위로 $p$의 범위를 구한다.
key_idea: |
  $E$가 닫히면 $\mathrm{P}(S\mid E)=\frac{361}{625}$, 열리면 $\mathrm{P}(S\mid E^c)=\frac{289}{625}$. $\mathrm{P}(S)=\frac{72}{625}p+\frac{289}{625}$. 조건부확률 $\mathrm{P}(E\mid S)$와 $\mathrm{P}(E^c\mid S)$가 모두 $\frac12$, $\frac13$ 이상이면 $\frac12\le\mathrm{P}(E\mid S)\le\frac23$.
stuck: 회로를 사건식으로 바꿀 때 $S_E$가 닫힌 경우의 병렬·직렬 구조, 3에서 두 조건($\frac12$ 이상, $\frac13$ 이상)을 합쳐 $\mathrm{P}(E\mid S)$의 양쪽 범위로 쓰는 것
