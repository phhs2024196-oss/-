intent: |
  부분적분법과 치환적분을 활용해 도형의 넓이를 구하고, 극대·극소의 개념과 그래프의 개형을 이해하고 있는지 본다. 논제 1은 두 곡선과 직선으로 둘러싸인 영역의 넓이 $A(t)$를 $\int_0^tf-\int_0^{f(t)}g+\frac12(f(t)^2-t^2)$로 나타내고 역함수의 정적분 관계로 값을 구하며, 논제 2는 삼차함수 $h$를 극값 조건으로 결정하고 $f(2)=3$에서 $g$의 치역 $[0,2]$를 얻어 방정식 $h(t)=\frac12$의 해의 개수를 센다.
key_idea: |
  $A(t)=2\int_0^tf-tf(t)+\frac12f(t)^2-\frac12t^2$ ($\int_0^{f(t)}g=tf(t)-\int_0^tf$). 1은 $\int_0^1f=1$, $f(1)=2$로 $\frac32$. 2는 $h(x)=2x^3-9x^2+12x-4$, $f(2)=3$이므로 $g([0,3])=[0,2]$, $h(t)=\frac12$의 해 2개.
stuck: $A(t)$를 두 적분으로 쪼개 $\ell(x)$까지 쓰는 설정, 역함수의 정적분(치환 $u=g(s)$ 후 부분적분), $f(2)=1$을 $f(x)>x$로 버리는 것
