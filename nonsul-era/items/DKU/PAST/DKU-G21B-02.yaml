stimuli:
- label: 가
  body: |
    미분가능한 함수 $f(x)$가 $f'(a)=0$이고 $x=a$의 좌우에서
    $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대,
    $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.
- label: 나
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가 닫힌구간 $[\alpha,\beta]$에서 연속이고, $a=g(\alpha)$, $b=g(\beta)$이면
    $$\int_a^bf(x)dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
- label: 다
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능하고 $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)g'(x)dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf'(x)g(x)dx$$
stem: |
  [문제 2] 다음 제시문을 읽고 질문에 답하시오. (45점)

  • 음이 아닌 실수 전체의 집합에서 연속인 함수 $f(x)$는 다음 (1), (2)를 만족시킨다.
   (1) $f(0)=0$
   (2) $x>0$에서 $f'(x)>1$
  • 함수 $g(x)$는 $f(x)$의 역함수이다.
  • 함수 $h(x)$는 다음 (3), (4), (5)를 만족시킨다.
   (3) 최고차항의 계수가 양수인 삼차함수
   (4) $x=1,2$에서 극값을 갖고 $h(1)h(2)=0$
   (5) $\displaystyle\int_0^3h(x)dx=\frac32$

  $t>0$에 대하여, 곡선 $y=f(x)$, 곡선 $y=g(x)$ 그리고 두 점 $\mathrm P(t,f(t))$와 $\mathrm Q(f(t),t)$를 잇는 직선으로 둘러싸인 영역의 넓이를 $A(t)$라 하자.
  [그림: 원점 $\mathrm O$에서 출발하는 두 곡선 $y=f(x)$(위쪽)와 $y=g(x)$(아래쪽)가 있고, 점 $\mathrm P(t,f(t))$는 $y=f(x)$ 위에, 점 $\mathrm Q(f(t),t)$는 $y=g(x)$ 위에 있으며 두 점을 잇는 선분과 두 곡선으로 둘러싸인 영역이 $A(t)$이다. $y$축 위에 $f(t)$, $x$축 위에 $t$가 표시되어 있다.]
subparts:
- id: '1'
  stem: |
    [논제 1] $f(1)=2$이고 $\displaystyle\int_0^2xg'(x)\,dx=1$일 때, $A(1)$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 3/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $A(t)=\int_0^tf-\int_0^{f(t)}g+\frac12(f(t)^2-t^2)$, $\int_0^2g=1$, $\int_0^1f=1$ → $A(1)=1-1+\frac32=\frac32$.
    steps:
    - id: 1a
      content: $g(2)=1$과 부분적분으로 $\int_0^2g=1$, 치환으로 $\int_0^1f=1$을 얻어 $A(1)=\frac32$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - 영역을 $y=f,\ y=g$ 아래 넓이와 직선 $\mathrm{PQ}$ 아래 넓이로 나누어 $A(t)$를 적분으로 써 보자.
    - $f(1)=2$이면 $g(2)$는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 선행학습 영향평가 보고서 R21.pdf p.96~97 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        직선 $\mathrm{PQ}$의 방정식은 $\ell(x)=-x+t+f(t)$이므로 영역의 넓이는
        $A(t)=\displaystyle\int_0^t(f(s)-g(s))ds+\int_t^{f(t)}(\ell(s)-g(s))ds=\int_0^tf(s)ds-\int_0^{f(t)}g(s)ds+\frac12\left((f(t))^2-t^2\right)\ \cdots(\ast\ast)$이다.
        (조건 (2)에서 $k(x)=x-f(x)$는 $k'(x)=1-f'(x)<0$인 감소함수이고 $k(0)=0$이므로 $x>0$에서 $x<f(x)\ \cdots(\star)$이다.)
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $(\ast\ast)$로부터 $A(1)=\displaystyle\int_0^1f(s)ds-\int_0^{f(1)}g(s)ds+\frac12\left((f(1))^2-1\right)=\int_0^1f(s)ds-\int_0^{f(1)}g(s)ds+\frac32\ \cdots(1.1)$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $g(2)=1$이므로 부분적분에 의하여 $1=\displaystyle\int_0^2sg'(s)ds=2g(2)-\int_0^2g(s)ds=2-\int_0^2g(s)ds$, 즉 $\displaystyle\int_0^{f(1)}g(s)ds=\int_0^2g(s)ds=1\ \cdots(1.2)$이다.
      criteria:
      - 1.M1
    - id: 1b-4
      content: |
        또한 $u=g(s)$로 치환하면 $ds=f'(u)du$이고 부분적분에 의하여 $\displaystyle\int_0^{f(t)}g(s)ds=\int_0^tuf'(u)du=tf(t)-\int_0^tf(u)du\ \cdots(\ast\ast\ast)$이므로 $1=\displaystyle\int_0^{f(1)}g(s)ds=f(1)-\int_0^1f(u)du$이고 $f(1)=2$이므로 $\displaystyle\int_0^1f(u)du=1\ \cdots(1.3)$이다.
      criteria:
      - 1.M1
    - id: 1b-5
      content: |
        $(1.2)$와 $(1.3)$을 $(1.1)$에 대입하면 $A(1)=1-1+\dfrac32=\dfrac32$이다.
        (별해) $\int_0^2g(s)ds=1$이고 $f$와 $g$의 그래프는 직선 $y=x$에 대칭이므로 $A(1)=(\text{사각형의 넓이})-2\displaystyle\int_0^2g(s)ds-(\text{삼각형의 넓이})=4-2-\frac12=\frac32$.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        $A(t)$를 적분으로 나타내고 $\int_0^2g(s)ds=1$ 또는 $\int_0^1f(s)ds=1$임을 제시했다(공식 채점기준 20점 중 10점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
      - 1b-3
      - 1b-4
      - 1a
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $A(1)=\frac32$를 구했다(공식 10점).
      depends_on:
      - 1.M1
      steps:
      - 1b-5
      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] $A(2)=2\displaystyle\int_0^2f(x)dx-\frac72$일 때, $0\le x\le3$에서 곡선 $y=h(g(x))$와 직선 $y=\dfrac12$의 교점의 개수를 구하시오. (25점)
  points: 25
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $h'(x)=3a(x-1)(x-2)$, $\int_0^3h=\frac32$로 $a=2$, $h=2x^3-9x^2+12x-4$. $A(2)$ 조건으로 $f(2)^2-4f(2)+3=0$, $f(2)>2$이므로 $f(2)=3$, $g(3)=2$. $g([0,3])=[0,2]$이고 $h(t)=\frac12$의 해는 $[0,2]$에서 2개.
    steps:
    - id: 2a
      content: $h$ 결정 → $f(2)=3$ → $g(3)=2$ → $t\in[0,2]$에서 $h(t)=\frac12$의 해 2개
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - 삼차함수 $h$의 도함수를 극값의 위치로 쓰고 조건 (4)(5)로 상수를 정하자.
    - $A(2)$ 식에서 $f(2)$가 만족하는 이차방정식을 구해 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2021 선행학습 영향평가 보고서 R21.pdf p.98 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        $h(x)$의 최고차항의 계수를 $a$라 하자. 삼차함수 $h(x)$가 $x=1,2$에서 극값을 가지므로 $h'(x)=3a(x-1)(x-2)=3a(x^2-3x+2)$이다. 양변을 적분하면 $h(x)=3a\left(\dfrac13x^3-\dfrac32x^2+2x\right)+C$ ($C$는 적분상수)이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        조건 (4)에서 $h(x)$의 두 개의 극값 중 하나는 $0$이므로 $h(1)=\dfrac52a+C=0$ 또는 $h(2)=2a+C=0\ \cdots(2.1)$이다. 조건 (5)로부터 $\dfrac32=\displaystyle\int_0^3h(x)dx=\int_0^3\left(ax^3-\dfrac92ax^2+6ax+C\right)dx=\dfrac{27}4a+3C$이고 $(2.1)$에 대입하면 $a=2,-2$이다. $a>0$이므로 $a=2$이다. 따라서 $h(x)=2x^3-9x^2+12x-4$이다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        문제의 조건 $A(2)=2\displaystyle\int_0^2f(s)ds-\dfrac72$과 $(\ast\ast)$로부터 $\displaystyle\int_0^2f(s)ds-\int_0^{f(2)}g(s)ds+\dfrac12\left((f(2))^2-4\right)=2\int_0^2f(s)ds-\dfrac72$이다. 여기서 $(\ast\ast\ast)$로부터 $\displaystyle\int_0^{f(2)}g(s)ds=2f(2)-\int_0^2f(s)ds$이므로 $2\displaystyle\int_0^2f(s)ds-2f(2)+\dfrac12\left((f(2))^2-4\right)=2\int_0^2f(s)ds-\dfrac72$에서 $f(2)=1,3$을 얻는다. 그런데 $(\star)$에 의해 $f(2)>2$이므로 $f(2)=3$이고, 즉 $g(3)=2$이다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        그러므로 $g$는 $[0,3]$에서 $[0,2]$로의 증가하는 연속함수(일대일대응)이고 $\{g(x)\mid0\le x\le3\}=[0,2]$이다. $0\le t\le2$에서 $h(t)$는 $h(0)=-4$, $t=1$에서 극댓값 $1$, $t=2$에서 극솟값 $0$이므로 방정식 $h(t)=\dfrac12$의 해는 $2$개이다. 따라서 $0\le x\le3$에서 곡선 $y=h(g(x))$와 직선 $y=\dfrac12$의 교점의 개수는 $2$이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $h(x)=2x^3-9x^2+12x-4$를 구했다(공식 채점기준 25점 중 10점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2b-2
      - 2a
    - id: 2.M2
      mark_type: M
      points: 10
      evidence: |
        $A(2)$ 조건과 $(\ast\ast)$,$(\ast\ast\ast)$로 $f(2)=3$, 즉 $g(3)=2$를 구했다(공식 10점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-3
      - 2a
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $\{g(x)\}=[0,2]$에서 $h(t)=\frac12$의 해를 세어 교점의 개수 $2$를 구했다(공식 5점).
      depends_on:
      - 2.M1
      - 2.M2
      steps:
      - 2b-4
      - 2a
    deductions: []
