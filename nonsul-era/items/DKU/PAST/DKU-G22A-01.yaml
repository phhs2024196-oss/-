intent: |
  도함수의 개념을 이해하고 활용할 수 있는지(논제 1), 치환적분법을 이해하고 활용할 수 있는지(논제 2), 정적분의 개념을 이해하고 활용할 수 있는지(논제 3)를 본다. 논제 1은 합성함수의 미분 $g'(x)=f'(f(x))f'(x)$와 $f$의 극값으로 $g'(x)=0$의 서로 다른 실근의 개수를 센다. 논제 2는 $h(3^n)$의 점화와 $\int_{3^{n}}^{3^{n+1}}h$의 치환적분으로 합을 구하고, 논제 3은 치환 $u=S(x)$로 $\int_{S(a)}^{S(b)}\frac{ue^u}{(u+1)^2}du$를 계산해 $S(a)$를 결정한다.
key_idea: |
  1은 $g'(x)=f'(f(x))f'(x)=0$에서 $f'(x)=0$($x=0,2$)과 $f(x)=0,2$를 나누어 $f$의 극댓값 $4ne^{-2}$와 $2$를 비교($n\le3$). 2는 $\int_1^{81}h'=4$와 $\int_{3^k}^{3^{k+1}}h=3\int_{3^{k-1}}^{3^k}h+(3^{k+1}-3^k)$. 3은 $S(b)=4S(a)+3$, $u=S(x)$ 치환 후 $(e^{3(S(a)+1)}-4)(e^{3(S(a)+1)}-64)=0$.
stuck: 1에서 $f(x)=2$의 해의 개수를 $f$의 극댓값과 $2$의 대소로 가르는 것, 2에서 구간 $[3^n,3^{n+1})$의 적분을 한 단계 앞 구간의 적분으로 치환하는 것, 3에서 $\frac{ue^u}{(u+1)^2}$의 원시함수 $\frac{e^u}{u+1}$를 알아보는 것
