stimuli:
- label: 가
  body: |
    미분가능한 두 함수 $y=f(u)$와 $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는
    $$\{f(g(x))\}'=f'(g(x))g'(x)$$
- label: 나
  body: |
    미분가능한 함수 $f(x)$가 $f'(a)=0$이고 $x=a$의 좌우에서
    (1) $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고, 극댓값은 $f(a)$
    (2) $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고, 극솟값은 $f(a)$
- label: 다
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때 도함수 $g'(t)$가 $\alpha,\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
stem: |
  [문제 1] 다음 제시문을 읽고 질문에 답하시오. (55점)
subparts:
- id: '1'
  stem: |
    [논제 1] 자연수 $n$에 대하여 두 함수 $f(x)$와 $g(x)$를 다음과 같이 정의하자.
    $$f(x)=nx^2e^{-x},\qquad g(x)=(f\circ f)(x)$$
    $x$에 대한 방정식 $g'(x)=0$이 서로 다른 $3$개의 실근을 갖도록 하는 $n$을 모두 구하시오.
    (단, $e$는 $2.7$로 계산) (15점)
  points: 15
  depends_on: []
  answer:
    kind: set
    value: '{1, 2, 3}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $g'(x)=f'(f(x))f'(x)=0$에서 $f'(x)=0$은 $x=0,2$, $f'(f(x))=0$은 $f(x)=0$($x=0$) 또는 $f(x)=2$. $f$의 극댓값 $4ne^{-2}<2\iff n\le3$일 때만 $f(x)=2$가 음의 해 하나. $n=1,2,3$.
    steps:
    - id: 1a
      content: $f'(x)=0$과 $f(x)=0,\,2$의 해를 세고 극댓값 $4ne^{-2}$와 $2$를 비교 → $n=1,2,3$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - $g'(x)$를 합성함수의 미분법으로 쓰면?
    - $f(x)=2$의 해의 개수는 $f$의 극댓값과 $2$의 대소에 달려 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 선행학습 영향평가 보고서 R22.pdf p.90 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        주어진 자연수 $n$에 대하여 $f'(x)=2nxe^{-x}-nx^2e^{-x}=nx(2-x)e^{-x}$이므로 다음과 같은 증가와 감소를 나타내는 표를 얻는다.

        | $x$ | $\cdots$ | $0$ | $\cdots$ | $2$ | $\cdots$ |
        |---|---|---|---|---|---|
        | $f'(x)$ | $-$ | $0$ | $+$ | $0$ | $-$ |
        | $f(x)$ | ↘ | $0$ | ↗ | $4ne^{-2}$ | ↘ |

        즉, 극솟값은 $f(0)=0$이고 극댓값은 $f(2)=4ne^{-2}$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        한편, 합성함수 미분법에 따라 $g'(x)=f'(f(x))f'(x)$이므로 방정식 $g'(x)=0$의 해는 $f'(f(x))=0$의 해 또는 $f'(x)=0$의 해이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        (i) $f'(x)=0$인 경우 : 위 표로부터 $x=0$ 또는 $x=2$이다.
      criteria:
      - 1.M1
    - id: 1b-4
      content: |
        (ii) $f'(f(x))=0$인 경우 : $f(x)=0$ 또는 $f(x)=2$이다.
         (a) $f(x)=0$인 경우 : 함수 $f(x)$는 $0$이 아닌 모든 실수 $x$에 대하여 양수이므로 방정식 $f(x)=0$의 해는 $x=0$ 뿐이다.
         (b) $f(x)=2$인 경우 : $4ne^{-2}<2\iff n<\dfrac{e^2}{2}=3.645$ ($e$를 $2.7$로 계산)이므로 $n\le3$일 때만 방정식 $f(x)=2$가 음의 해 하나만 가짐을 알 수 있다.
      criteria:
      - 1.M2
      - 1.A1
    - id: 1b-5
      content: |
        (i)와 (ii)에 의하여 $n=1,2,3$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $f'(x)=0$인 $x$의 값($x=0,2$)을 제시했다(공식 채점기준 15점 중 5점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-3
      - 1a
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        $g'(x)=f'(f(x))f'(x)$로 놓고 $f'(f(x))=0$인 $x$의 조건($f(x)=0$ 또는 $2$)을 제시했다(공식 5점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-2
      - 1b-4
      - 1a
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        극댓값 $4ne^{-2}$와 $2$를 비교해 $n=1,2,3$을 구했다(공식 5점).
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-4
      - 1b-5
      - 1a
    deductions: []
