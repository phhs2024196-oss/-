    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] 실수 전체의 집합에서 연속인 도함수를 갖는 함수 $h(x)$가 다음 조건을 만족시킨다.

    (1) $\displaystyle\int_1^3h(x)dx=9$
    (2) 모든 자연수 $n$에 대하여 구간 $[3^n,3^{n+1})$에서 $h(x)=h\left(\dfrac x3\right)+1$

    $\displaystyle\int_1^{81}\left(h(x)+h'(x)\right)dx$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '568'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $\int_1^{81}h'=h(81)-h(1)=4$, $\int_{3^k}^{3^{k+1}}h=3\int_{3^{k-1}}^{3^k}h+(3^{k+1}-3^k)$이므로 $9+33+117+405+4=568$.
    steps:
    - id: 2a
      content: $\int h'=4$, 구간별 적분 $33,117,405$ → $568$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $h(81)-h(1)$은 조건 (2)로 몇이 되는가?
    - $\int_3^9h(x)dx$를 $x=3t$로 치환해 $\int_1^3h$로 바꿔 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2022 선행학습 영향평가 보고서 R22.pdf p.90~91 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        조건 (2)로부터 $h(3^4)=h(3^3)+1=h(3^2)+2=h(3)+3=h(1)+4$이므로
        $\displaystyle\int_1^{81}h'(x)dx=h(81)-h(1)=h(3^4)-h(1)=4$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        조건 (1)에서 $\displaystyle\int_1^3h(x)dx=9$이므로
        $\displaystyle\int_3^{3^2}h(x)dx=\int_3^{3^2}\left\{h\left(\frac x3\right)+1\right\}dx=3\int_1^3h(t)dt+(3^2-3)=33$,
        $\displaystyle\int_{3^2}^{3^3}h(x)dx=\int_{3^2}^{3^3}\left\{h\left(\frac x3\right)+1\right\}dx=3\int_3^{3^2}h(t)dt+(3^3-3^2)=117$,
        $\displaystyle\int_{3^3}^{3^4}h(x)dx=\int_{3^3}^{3^4}\left\{h\left(\frac x3\right)+1\right\}dx=3\int_{3^2}^{3^3}h(t)dt+(3^4-3^3)=405$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        따라서 $\displaystyle\int_1^{81}(h(x)+h'(x))dx=\int_1^{3^4}h(x)dx+\int_1^{3^4}h'(x)dx=\int_1^3h+\int_3^{3^2}h+\int_{3^2}^{3^3}h+\int_{3^3}^{3^4}h+\int_1^{3^4}h'=9+33+117+405+4=568$이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: |
        $\int_1^{81}h'(x)dx=h(81)-h(1)=4$의 값을 제시했다(공식 채점기준 20점 중 6점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2a
    - id: 2.M2
      mark_type: M
      points: 10
      evidence: |
        치환적분으로 $\int_3^9h=33$, $\int_9^{27}h=117$, $\int_{27}^{81}h=405$를 제시했다(공식 10점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-2
      - 2a
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        합산해 $568$을 구했다(공식 4점).
      depends_on:
      - 2.M1
      - 2.M2
      steps:
      - 2b-3
      - 2a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [논제 3] 모든 실수 $x$에 대하여 $k(x)>0$인 연속함수 $k(x)$와 함수
    $$S(x)=\int_0^xk(t)dt$$
    가 두 양수 $a,b$에 대하여 다음 조건을 만족시킨다.

    (1) $\displaystyle\int_a^bk(x)dx=3S(a)+3$
    (2) $\displaystyle\int_a^b\frac{S(x)e^{S(x)}}{(S(x)+1)^2}k(x)dx=\frac{e^{S(a)}}{S(b)+1}\left(e^{6(S(a)+1)}-67e^{3(S(a)+1)}+252\right)$

    $S(b)$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 8*log(2) - 1
    equivalents:
    - log(256) - 1
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $S(b)=4S(a)+3$, $u=S(x)$ 치환으로 좌변 $=\frac{e^{S(a)}}{4(S(a)+1)}\left(e^{3(S(a)+1)}-4\right)$. 정리하면 $(E-4)(E-64)=0$($E=e^{3(S(a)+1)}$), $E=64$, $S(a)=2\ln2-1$, $S(b)=8\ln2-1$.
    steps:
    - id: 3a
      content: $S(b)=4S(a)+3$과 치환적분으로 방정식을 세워 $e^{3(S(a)+1)}=64$ → $S(b)=8\ln2-1$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
    hint_ladder:
    - 조건 (1)에서 $S(b)$와 $S(a)$의 관계는?
    - $\frac{ue^u}{(u+1)^2}$의 부정적분은 $\frac{e^u}{u+1}$이다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2022 선행학습 영향평가 보고서 R22.pdf p.91 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: |
        조건 (1)에 의하여 $S(b)-S(a)=\displaystyle\int_a^bk(x)dx=3S(a)+3$이므로 $S(b)=4S(a)+3\ \cdots(\star)$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $S(x)=\displaystyle\int_0^xk(t)dt$에서 $S'(x)=k(x)$이므로
        $\displaystyle\int_a^b\frac{S(x)e^{S(x)}}{(S(x)+1)^2}k(x)dx=\int_{S(a)}^{S(b)}\frac{ue^u}{(u+1)^2}du=\left[\frac{e^u}{u+1}\right]_{S(a)}^{S(b)}=\frac{e^{S(b)}}{S(b)+1}-\frac{e^{S(a)}}{S(a)+1}$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $(\star)$을 이용하면 $\displaystyle\frac{e^{4S(a)+3}}{4S(a)+4}-\frac{e^{S(a)}}{S(a)+1}=\frac{e^{4S(a)+3}-4e^{S(a)}}{4(S(a)+1)}=\frac{e^{S(a)}}{4(S(a)+1)}\left(e^{3(S(a)+1)}-4\right)$이다.
      criteria:
      - 3.M2
    - id: 3b-4
      content: |
        $(\star)$과 조건 (2)를 이용하여 다음 방정식을 얻는다.
        $\dfrac{e^{S(a)}}{4(S(a)+1)}\left(e^{3(S(a)+1)}-4\right)=\dfrac{e^{S(a)}}{4(S(a)+1)}\left(e^{6(S(a)+1)}-67e^{3(S(a)+1)}+252\right)$
      criteria:
      - 3.M2
    - id: 3b-5
      content: |
        이로부터 $\left(e^{3(S(a)+1)}-4\right)\left(e^{3(S(a)+1)}-64\right)=0$이다. 여기에서 $e^{3(S(a)+1)}-4>e^3-4>0$이므로 $e^{3(S(a)+1)}=64$이고 $S(a)=2\ln2-1$이다.
      criteria:
      - 3.A1
    - id: 3b-6
      content: |
        따라서 $S(b)=4S(a)+3=8\ln2-1$이다.
      criteria:
      - 3.A1
