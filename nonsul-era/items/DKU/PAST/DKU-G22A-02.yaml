intent: |
  미분을 활용해 방정식의 실근의 개수를 구할 수 있는지(논제 1), 접선의 개념과 함수의 개념을 활용해 함수의 미분가능성을 판단할 수 있는지(논제 2)를 본다. 논제 1은 $h(x)=e^x-\lvert x^2-ex\rvert$를 $x\le0$, $0<x<e$, $x\ge e$로 나누어 증감과 부호를 따져 실근이 하나임을 보인다. 논제 2는 접선 조건으로 $\ell:\ y=x+1$을 구하고 $f(x)=2x^3-3x^2+x+1$을 결정한 뒤, $\lvert f(x)-x\rvert$가 미분가능하지 않은 점(단순근)을 찾는다.
key_idea: |
  1은 $x\le0$에서 증가($h(0)=1$, $-\infty$로 발산), $x\ge e$에서 증가($h(e)>0$), $0<x<e$에서 $e^x-ex\ge0$이므로 $h>0$. 2는 $u=t+1$, $t=-1$, 접선 $y=x+1$, $f(0)=1$, $f'(0)=1$, $b=-\frac32a$, 치환 $z=e^x$로 접할 조건에서 $a=2$, $g=\lvert(x-1)^2(2x+1)\rvert$는 단순근 $x=-\frac12$에서만 미분 불가.
stuck: 1에서 절댓값 안 부호를 $x\le0,\ 0<x<e,\ x\ge e$로 나누고 각 구간의 증감·부호를 보이는 것, 2에서 조건 (3)을 $z=e^x$ 치환으로 삼차함수와 $x$축의 접함으로 바꾸는 것
