stimuli:
- label: 가
  body: |
    미분가능한 함수 $f(x)$의 최솟값을 구하기 위하여 도함수 $f'(x)$를 활용할 수 있다.
- label: 나
  body: |
    극한값 $\displaystyle\lim_{\Delta x\to0}\frac{f(a+\Delta x)-f(a)}{\Delta x}$가 존재하면 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다.
- label: 다
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
stem: |
  [문제 2] 다음 제시문을 읽고 질문에 답하시오. (45점)
subparts:
- id: '1'
  stem: |
    [논제 1] 방정식 $e^x-\lvert x^2-ex\rvert=0$의 실근의 개수를 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $h(x)=e^x-\lvert x(x-e)\rvert$를 $x\le0$, $0<x<e$, $x\ge e$로 나누면 $x\le0$: 증가, $h(0)=1$, $-\infty$로 발산 → 근 1개. $x\ge e$: 증가, $h(e)=e^e>0$ → 근 없음. $0<x<e$: $h=(e^x-ex)+x^2>0$ → 근 없음. 따라서 1개.
    steps:
    - id: 1a
      content: 구간을 셋으로 나누어 $x\le0$에서만 실근 1개 → 정답 $1$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
    hint_ladder:
    - 절댓값 안의 $x^2-ex$의 부호는 어느 구간에서 바뀌는가?
    - $e^x-ex$는 $x=1$에서 최솟값 $0$을 가진다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 선행학습 영향평가 보고서 R22.pdf p.97 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        $h(x)=e^x-\lvert x^2-ex\rvert=e^x-\lvert x(x-e)\rvert$라 하자.
        (i) $x\le0$일 때 : $h(x)=e^x-x^2+ex$이고 $h'(x)=e^x-2x+e>0$이므로 $h(x)$는 증가함수이고 $\displaystyle\lim_{x\to-\infty}h(x)=-\infty$, $h(0)=1$이므로 방정식 $h(x)=0$은 구간 $(-\infty,0]$에서 하나의 실근을 갖는다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        (ii) $x\ge e$일 때 : $h(x)=e^x-x^2+ex$이고 $h'(x)=e^x-2x+e$이다. $h''(x)=e^x-2$에서 $x\ge e$일 때 $h''(x)>0$이므로 $h'(x)$가 증가한다. $h'(e)=e^e-e>0$이므로 $x\ge e$일 때 $h'(x)>0$, 즉 $h(x)$가 증가한다. $h(e)=e^e>0$이고 $h(x)$가 증가함수이므로 방정식 $h(x)=0$은 구간 $[e,\infty)$에서 실근을 갖지 않는다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        (iii) $0<x<e$일 때 : $h(x)=(e^x-ex)+x^2$이다. $e^x-ex$는 $x=1$에서 최솟값 $0$을 가지므로 $e^x-ex\ge0$이고, $x^2>0$이므로 $h(x)>0$이다. 따라서 방정식 $h(x)=0$은 구간 $(0,e)$에서 실근을 갖지 않는다.
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        (i)~(iii)에서 방정식 $h(x)=0$의 실근의 개수는 하나이다.
      criteria:
      - 1.M3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $x\le0$인 경우 $h'>0$, 극한과 $h(0)=1$로 실근이 $1$개인 이유를 제시했다(공식 채점기준 20점 중 5점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1a
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        $x\ge e$인 경우 $h''>0$, $h'(e)>0$, $h(e)>0$으로 실근이 $0$개인 이유를 제시했다(공식 5점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-2
      - 1a
    - id: 1.M3
      mark_type: M
      points: 10
      evidence: |
        $0<x<e$인 경우 $e^x-ex\ge0$을 이용해 실근이 $0$개인 이유를 제시하고 전체 실근이 $1$개임을 결론지었다(공식 10점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-3
      - 1b-4
      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] 최고차항의 계수가 양수인 삼차함수 $f(x)$는 다음 조건을 만족시킨다.

    (1) 점 $(t,0)$을 지나는 직선 $\ell$이 곡선 $y=e^x$에 접할 때 접점의 $x$좌표를 $u(t)$라 하자.
    $\displaystyle\int_t^{u(t)}e^x\,dx=1-\frac1e$일 때 직선 $\ell$은 점 $(0,f(0))$에서 곡선 $y=f(x)$와 접한다.
    (2) $f\left(\dfrac32\right)=\dfrac52$
    (3) 곡선 $y=f(e^x)$는 곡선 $y=e^x$와 한 점에서만 만난다.

    함수 $g(x)=\lvert f(x)-x\rvert$가 $x=p$에서 미분가능하지 않을 때, 실수 $p$의 값을 구하시오. (25점)
  points: 25
  depends_on: []
  answer:
    kind: value
    value: -1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $u=t+1$, $e^t(e-1)=1-\frac1e$에서 $t=-1$, 접선 $y=x+1$. $f=ax^3+bx^2+x+1$, $b=-\frac32a$. $z=e^x$로 $az^3-\frac32az^2+1$이 $z>0$에서 접하려면 $a=2$. $g=\lvert(x-1)^2(2x+1)\rvert$는 $x=-\frac12$에서만 미분 불가.
    steps:
    - id: 2a
      content: 접선 $y=x+1$ → $f=2x^3-3x^2+x+1$ → $g$의 미분불가점 $p=-\frac12$
      criteria:
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.A2
    hint_ladder:
    - 접선의 방정식을 $(t,0)$ 통과 조건과 접점 조건으로 세워 $u=t+1$을 얻자.
    - $z=e^x$로 놓으면 조건 (3)은 $z>0$에서 삼차함수와 직선의 교점 문제이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2022 선행학습 영향평가 보고서 R22.pdf p.97~98 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        $y=e^x$ 위의 점 $(u(t),e^{u(t)})$에서 그은 접선의 방정식은 $y=e^{u(t)}(x-u(t))+e^{u(t)}$이고 이 직선이 $x$축 위의 점 $(t,0)$을 지나므로 $u(t)=t+1$이다. 조건 (1)에서 $\displaystyle\int_t^{u(t)}e^x\,dx=\int_t^{t+1}e^xdx=e^t(e-1)=1-\frac1e$이므로 $t=-1$, $u(t)=0$이고 접선 $\ell$의 방정식은 $y=x+1$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $f(x)=ax^3+bx^2+cx+d$ ($a>0$)라 할 때 곡선 $y=f(x)$와 직선 $y=x+1$이 점 $(0,1)$에서 접하므로 $f(0)=d=1$이고 $f'(0)=c=1$이다. 따라서 $f(x)=ax^3+bx^2+x+1$이다. 한편, 조건 (2)로부터 $b=-\dfrac32a$이므로 $f(x)=ax^3-\dfrac32ax^2+x+1$이다.
      criteria:
      - 2.A1
      - 2.M2
    - id: 2b-3
      content: |
        $e^x=z$라 하면 $z>0$이고, 조건 (3)에서 $y=az^3-\dfrac32az^2+z+1$과 $y=z$가 구간 $(0,\infty)$에서 오직 한 점에서만 만나야 한다. 즉, $y=az^3-\dfrac32az^2+1$과 $y=0$이 구간 $(0,\infty)$에서 오직 한 점에서 만나야 한다. $\displaystyle\lim_{z\to0+}\left(az^3-\frac32az^2+1\right)=1$, $\displaystyle\lim_{z\to\infty}\left(az^3-\frac32az^2+1\right)=\infty$이므로 곡선 $y=az^3-\dfrac32az^2+1$과 직선 $y=0$이 점 $(z_0,0)$에서 접하는 $z_0>0$가 존재한다. 따라서 $3az_0^2-3az_0=0$, $az_0^3-\dfrac32az_0^2+1=0$이어야 하므로 $z_0=1$이고 $a=2$이다. 그러므로 $f(x)=2x^3-3x^2+x+1$이다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        함수 $g(x)=\lvert f(x)-x\rvert=\lvert2x^3-3x^2+1\rvert=\lvert(x-1)^2(2x+1)\rvert$, 즉 $g(x)=\begin{cases}(x-1)^2(2x+1)&\left(x\ge-\frac12\right)\\-(x-1)^2(2x+1)&\left(x<-\frac12\right)\end{cases}$이다. 따라서 $x\ne-\dfrac12$일 때는 함수 $g(x)$가 미분가능하다. 그러나 $\displaystyle\lim_{\Delta x\to0-}\frac{g\left(-\frac12+\Delta x\right)-g\left(-\frac12\right)}{\Delta x}=-\frac92$, $\displaystyle\lim_{\Delta x\to0+}\frac{g\left(-\frac12+\Delta x\right)-g\left(-\frac12\right)}{\Delta x}=\frac92$이므로 함수 $g(x)$는 $x=-\dfrac12$에서만 미분가능하지 않다. 따라서 $p=-\dfrac12$이다.
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        접선 $\ell$의 방정식 $y=x+1$을 제시했다(공식 채점기준 25점 중 5점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2a
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $f(0)=1$, $f'(0)=1$로 일차항의 계수와 상수항을 제시했다(공식 5점).
      depends_on:
      - 2.M1
      steps:
      - 2b-2
      - 2a
    - id: 2.M2
      mark_type: M
      points: 10
      evidence: |
        조건 (2),(3)으로 $f(x)=2x^3-3x^2+x+1$(삼차항·이차항의 계수)을 제시했다(공식 10점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-2
      - 2b-3
      - 2a
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: |
        $g(x)=\lvert(x-1)^2(2x+1)\rvert$가 미분가능하지 않은 점 $p=-\frac12$을 제시했다(공식 5점).
      depends_on:
      - 2.M2
      - 2.A1
      steps:
      - 2b-4
      - 2a
    deductions: []
