stimuli:
- label: 가
  body: |
    미분가능한 함수 $f(x)$의 역함수 $f^{-1}(x)$가 존재하고 이 역함수가 미분가능할 때,
    $$(f^{-1})'(x)=\frac{1}{f'(f^{-1}(x))}$$
- label: 나
  body: |
    함수 $f(x)$에서 $x$의 값이 $a$가 아니면서 $a$에 한없이 가까워질 때, $f(x)$의 값이 일정한 값 $L$에 한없이 가까워지면 함수 $f(x)$는 $L$에 수렴한다고 한다. 이때 $L$을 $x=a$에서의 함수 $f(x)$의 극한값 또는 극한이라 하고, 이것을 기호로
    $$\lim_{x\to a}f(x)=L\qquad\text{또는}\qquad x\to a\text{일 때 }f(x)\to L$$
    과 같이 나타낸다.
- label: 다
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때 도함수 $g'(t)$가 $\alpha,\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
stem: |
  [문제 1] 다음 제시문을 읽고 질문에 답하시오. (55점)
subparts:
- id: '1'
  stem: |
    [논제 1] 양의 실수 전체의 집합에서 정의된 함수 $f(x)=\ln x+2x^2+ax+b$가 역함수를 갖고,
    $0$이 아닌 실수 $L$에 대하여
    $$\lim_{x\to1}\left((f^{-1})'(x)\times\left\{\ln\frac{f^{-1}(x)}{f^{-1}(1)}\right\}^2\right)=L$$
    일 때, $a+b+L$의 값을 구하시오. (단, $a,b$는 상수) (15점)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: -1 + log(2)
    equivalents:
    - log(2) - 1
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f^{-1}(1)=p$라 하면 $f'(p)=0$, $f'$의 최솟값이므로 $f''(p)=0$에서 $p=\frac12$, $a=-4$, $b=\frac52+\ln2$, $L=\lim\frac{(\ln y-\ln\frac12)^2}{4(y-\frac12)^2/y}=\frac12$. 합 $-1+\ln2$.
    steps:
    - id: 1a
      content: 수렴 조건 $f'(p)=0$ → $p=\frac12$, $a=-4$, $b=\frac52+\ln2$, $L=\frac12$ → $-1+\ln2$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - 극한이 $0$이 아닌 값이 되려면 $\frac1{f'(y)}$는 어떻게 되어야 하는가?
    - 역함수가 존재하면 $f'$의 부호는 일정하다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 선행학습 영향평가 보고서 R22.pdf p.104 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        $f^{-1}(x)=y$라 하면 $f(p)=1$인 양의 실수 $p$가 존재하여
        $\displaystyle\lim_{x\to1}\left((f^{-1})'(x)\times\left\{\ln\frac{f^{-1}(x)}{f^{-1}(1)}\right\}^2\right)=\lim_{y\to p}\left\{\frac1{f'(y)}\times\left(\ln\frac yp\right)^2\right\}=L\ne0$
        을 만족시킨다. $\displaystyle\lim_{y\to p}\ln\frac yp=0$이므로 주어진 극한이 $0$이 아닌 값으로 수렴하기 위해서는 $\displaystyle\lim_{y\to p}f'(y)=f'(p)=0$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        함수 $f(x)$가 역함수를 가지려면 모든 양수 $x$에서 $f'(x)\ge0$이거나 모든 양수 $x$에서 $f'(x)\le0$이어야 한다. 그런데 $f'(x)=\dfrac1x+4x+a$에서 $\displaystyle\lim_{x\to\infty}f'(x)=\infty$이므로 모든 양수 $x$에서 $f'(x)\ge0$이어야 한다. $f'(p)=0$이므로 $f'(p)$는 $f'(x)$의 최솟값이다. 따라서 $f''(p)=-\dfrac1{p^2}+4=0$이므로 $p=\dfrac12$이다. $f'\left(\dfrac12\right)=2+2+a=0$이므로 $a=-4$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        또한 $f\left(\dfrac12\right)=\ln\dfrac12+\dfrac12-2+b=1$이므로 $b=\dfrac52+\ln2$이다.
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $L=\displaystyle\lim_{y\to\frac12}\left\{\frac1{f'(y)}\times\left(\ln\frac yp\right)^2\right\}=\lim_{y\to\frac12}\frac{\left(\ln y-\ln\frac12\right)^2}{\frac1y+4y-4}=\lim_{y\to\frac12}\left\{\left(\frac{\ln y-\ln\frac12}{y-\frac12}\right)^2\times\frac y4\right\}=\frac12$
      criteria:
      - 1.A2
    - id: 1b-5
      content: |
        이므로 $a+b+L=-1+\ln2$이다.
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        수렴 조건 $f'(p)=0$, $f''(p)=0$, $p=\frac12$로 $a=-4$를 제시했다(공식 채점기준 15점 중 5점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
      - 1a
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $f\left(\frac12\right)=1$로 $b=\frac52+\ln2$를 제시했다(공식 5점).
      depends_on:
      - 1.M1
      steps:
      - 1b-3
      - 1a
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: |
        $L=\frac12$을 구해 $a+b+L=-1+\ln2$를 제시했다(공식 5점).
      depends_on:
      - 1.M1
      - 1.A1
      steps:
      - 1b-4
      - 1b-5
      - 1a
    deductions: []
  outcome_codes:
