    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] 최고차항의 계수가 $1$인 삼차함수 $g(x)$에 대하여 함수 $h(x)=\dfrac{(x-2)g'(x)}{g(x)}$와
    $0$이 아닌 실수 $c$가 다음 조건을 만족시킨다.

    (1) $\displaystyle\lim_{x\to2}h(x)=2$
    (2) $\displaystyle\lim_{x\to c}h(\lvert x\rvert)$가 존재하지 않는다.
    (3) $g(c)=18c$

    $g(2c)$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '-48'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      (1)에서 $g(2)=0$이고 $\lim(x-2)\frac{g'}{g}$가 $2$이므로 $g=(x-2)^2(x+r)$. $h(\lvert x\rvert)=\frac{3\lvert x\rvert+2r-2}{\lvert x\rvert+r}$의 분모가 $0$이어야 하므로 $c=\pm r$($r<0$). $c=-r$이면 $g(c)=0$이라 모순, $c=r$이고 $g(r)=18r$에서 $r=-1$. $g(-2)=-48$.
    steps:
    - id: 2a
      content: $g=(x-2)^2(x+r)$ → $c=r=-1$ → $g(2c)=g(-2)=-48$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
    hint_ladder:
    - $g(x)=(x-2)^kp(x)$로 놓고 $\lim(x-2)\frac{g'}{g}$를 계산하면?
    - $\lim h(\lvert x\rvert)$가 존재하지 않는 경우는 분모가 $0$이 되는 점이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2022 선행학습 영향평가 보고서 R22.pdf p.104~105 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        조건 (1)에서 $\displaystyle\lim_{x\to2}(x-2)\frac{g'(x)}{g(x)}=2$이므로 $g(2)=0$이다. 따라서 $1\le k\le3$인 자연수 $k$와 $p(2)\ne0$인 $(3-k)$차 다항식 $p(x)$에 대하여 $g(x)=(x-2)^kp(x)$이고 $g'(x)=k(x-2)^{k-1}p(x)+(x-2)^kp'(x)$로부터
        $\displaystyle\lim_{x\to2}\left\{(x-2)\frac{g'(x)}{g(x)}\right\}=\lim_{x\to2}\frac{kp(x)+(x-2)p'(x)}{p(x)}=k$이고 $k=2$이다. 따라서 상수 $r$ ($r\ne-2$)에 대하여 $g(x)=(x-2)^2(x+r)\ \cdots(\star)$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        그러므로 $h(\lvert x\rvert)=\dfrac{3\lvert x\rvert+2r-2}{\lvert x\rvert+r}=\begin{cases}\dfrac{3x+2r-2}{x+r}&(x\ge0)\\[4pt]\dfrac{-3x+2r-2}{-x+r}&(x<0)\end{cases}$이고 조건 (2)에 의하여 $c=r\ (c<0)$ 또는 $c=-r\ (c>0)$이어야 한다. 따라서 $r<0$이어야 한다.
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        그런데 $c=-r$이면 $g(c)=0$이 되므로 조건 (3)에 모순이다. 따라서 $c=r$ ($r<0,\ r\ne-2$)이다. $g(c)=g(r)=(r-2)^2(2r)=18r$로부터 $c=r=-1$이고 $g(x)=(x-2)^2(x-1)$이다.
      criteria:
      - 2.A1
    - id: 2b-4
      content: |
        그러므로 $g(2c)=g(-2)=-48$이다.
      criteria:
      - 2.A2
  rubric:
