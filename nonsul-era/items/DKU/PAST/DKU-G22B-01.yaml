intent: |
  함수의 극한 개념과 역함수의 미분법을 활용할 수 있는지(논제 1), 함수의 성질과 극한 개념을 활용할 수 있는지(논제 2), 역함수의 미분법과 치환적분으로 극값을 판정하고 정적분을 구할 수 있는지(논제 3)를 본다. 논제 1은 $x\to1$을 $y=f^{-1}(x)\to p$로 바꾸어 수렴 조건 $f'(p)=0$과 역함수 존재 조건 $f'\ge0$으로 $a,b,L$을 구하고, 논제 2는 $(x-2)\frac{g'}{g}\to2$로 $g$의 인수를 정하며, 논제 3은 $F'(t)=\pi\cos(k^{-1}(\pi t))$로 극값의 위치를 찾고 치환 $y=k(x)$로 $F(\beta)-F(\alpha)$를 계산한다.
key_idea: |
  1은 $f'(p)=0$이고 $f'$의 최솟값이므로 $f''(p)=0$, $p=\frac12$, $a=-4$, $b=\frac52+\ln2$, $L=\frac12$. 2는 $g=(x-2)^2(x+r)$, $h(\lvert x\rvert)$의 분모가 $0$이 되는 $c=r<0$, $g(r)=18r$에서 $r=-1$. 3은 $k^{-1}(\pi t)=\frac\pi2,\frac{3\pi}2,\dots,\frac{15\pi}2$에서 극값, $\alpha=\frac{13}2+\frac1\pi$, $\beta=\frac{15}2-\frac1\pi$, $y=x+\sin x$ 치환.
stuck: 1에서 극한이 $0$이 아닌 값으로 수렴하려면 $f'(p)=0$이어야 하고 그때 $f'$가 최솟값이라는 연결, 2에서 $(x-2)g'/g$의 극한이 인수의 중복도를 준다는 것, 3에서 $F'$의 부호 변화를 $k^{-1}(\pi t)$의 값으로 읽고 치환 $y=k(x)$로 적분 구간을 바꾸는 것
