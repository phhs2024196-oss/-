      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $g(x)=(x-2)^2(x+r)$를 제시했다(공식 채점기준 20점 중 5점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2a
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        조건 (2),(3)으로 $c=r=-1$을 제시했다(공식 10점).
      depends_on:
      - 2.M1
      steps:
      - 2b-2
      - 2b-3
      - 2a
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: |
        $g(2c)=g(-2)=-48$을 구했다(공식 5점).
      depends_on:
      - 2.M1
      - 2.A1
      steps:
      - 2b-4
      - 2a
    deductions: []
