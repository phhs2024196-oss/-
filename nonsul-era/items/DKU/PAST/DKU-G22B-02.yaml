- id: '2'
  stem: |
    [논제 2] $\displaystyle\int_{\frac\pi2}^{\frac{3\pi}2}A(t)(f(t))^2dt-10\int_0^{\pi}(f(t))^2dt$의 값을 구하시오. (25점)
  points: 25
  depends_on: []
  answer:
    kind: value
    value: 16/9 + 16*pi/9 - 26*pi**2/9 - 25*pi**3/36
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $f(t)=\frac{x_{\mathrm Q}}3$: $\frac\pi2\ (0\le t\le\frac\pi2)$, $-\frac t3+\frac{2\pi}3\ (\frac\pi2\le t\le\pi)$, $\frac\pi3\ (\pi\le t\le\frac{3\pi}2)$. 구간을 나누고 $(A-10)f^2=\frac89(t-2\pi)^2\cos t$를 부분적분하면 $\frac{16}9+\frac{16}9\pi-\frac{26}9\pi^2-\frac{25}{36}\pi^3$.
    steps:
    - id: 2a
      content: $\mathrm Q$의 좌표 → $f(t)$ 구간별 → 부분적분 → $\frac{16}9+\frac{16\pi}9-\frac{26\pi^2}9-\frac{25\pi^3}{36}$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
    hint_ladder:
    - $\mathrm P_1,\mathrm P_3$의 $x$좌표 합은?
    - $\int_{\pi/2}^{3\pi/2}$를 $[\frac\pi2,\pi]$와 $[\pi,\frac{3\pi}2]$로 나누자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2022 선행학습 영향평가 보고서 R22.pdf p.112~113 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        모든 $0\le t\le\dfrac32\pi$에 대하여 점 $\mathrm Q$의 좌표는
        $\mathrm Q\!\left(\dfrac{3\pi}2,\,-t\right)\ \left(0\le t\le\dfrac\pi2\right)$, $\mathrm Q\!\left(2\pi-t,\,-\dfrac\pi2\right)\ \left(\dfrac\pi2\le t\le\pi\right)$, $\mathrm Q\!\left(\pi,\,t-\dfrac{3\pi}2\right)\ \left(\pi\le t\le\dfrac{3\pi}2\right)\ \cdots(\star\star)$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        그러므로 $(\star)$과 $(\star\star)$을 이용하면 함수 $f(t)$는
        $f(t)=\begin{cases}\dfrac\pi2&\left(0\le t\le\dfrac\pi2\right)\\[4pt]-\dfrac13t+\dfrac{2\pi}3&\left(\dfrac\pi2\le t\le\pi\right)\\[4pt]\dfrac\pi3&\left(\pi\le t\le\dfrac{3\pi}2\right)\end{cases}$이다.
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        따라서 $\displaystyle\int_{\frac\pi2}^{\frac{3\pi}2}A(t)(f(t))^2dt-10\int_0^\pi(f(t))^2dt=\int_{\frac\pi2}^\pi A(t)(f(t))^2dt-10\int_{\frac\pi2}^\pi(f(t))^2dt+\frac{\pi^2}9\int_\pi^{\frac{3\pi}2}(10+8\cos t)\,dt-\frac54\pi^3$이다. 먼저
        $\displaystyle\int_{\frac\pi2}^\pi A(t)(f(t))^2dt-10\int_{\frac\pi2}^\pi(f(t))^2dt=\frac89\int_{\frac\pi2}^\pi(t-2\pi)^2\cos t\,dt=\frac89\int_{\frac\pi2}^\pi(t^2-4\pi t+4\pi^2)\cos t\,dt$이다.
      criteria:
      - 2.A2
    - id: 2b-4
      content: |
        여기서 $\displaystyle\int t^2\cos t\,dt=t^2\sin t+2t\cos t-2\sin t+c_1$, $\displaystyle\int t\cos t\,dt=t\sin t+\cos t+c_2$이므로
        $\displaystyle\int_{\frac\pi2}^\pi A(t)(f(t))^2dt-10\int_{\frac\pi2}^\pi(f(t))^2dt=\frac89\left[t^2\sin t+2t\cos t-2\sin t\right]_{\frac\pi2}^\pi-\frac{32\pi}9\left[t\sin t+\cos t\right]_{\frac\pi2}^\pi+\frac{32\pi^2}9\left[\sin t\right]_{\frac\pi2}^\pi=\frac{16}9+\frac{16}9\pi-2\pi^2$이다. 또한 $\dfrac{\pi^2}9\displaystyle\int_\pi^{\frac{3\pi}2}(10+8\cos t)\,dt=\dfrac{\pi^2}9\left(5\pi+8\left[\sin t\right]_\pi^{\frac{3\pi}2}\right)=\dfrac59\pi^3-\dfrac89\pi^2$이다.
      criteria:
      - 2.A2
    - id: 2b-5
      content: |
        그러므로 $\displaystyle\int_{\frac\pi2}^{\frac{3\pi}2}A(t)(f(t))^2dt-10\int_0^\pi(f(t))^2dt=\frac{16}9+\frac{16}9\pi-2\pi^2+\frac59\pi^3-\frac89\pi^2-\frac54\pi^3=\frac{16}9+\frac{16}9\pi-\frac{26}9\pi^2-\frac{25}{36}\pi^3$이다.
      criteria:
