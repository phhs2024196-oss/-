intent: |
  매개변수와 적분법을 활용해 극값 판정 문제를 해결할 수 있는지(논제 1), 매개변수·정적분의 성질·부분적분법을 활용해 정적분의 값을 구할 수 있는지(논제 2)를 본다. 네 원 위를 움직이는 점 $\mathrm P_1\sim\mathrm P_4$의 좌표를 매개변수로 나타내 $\ell(t)^2=20+16\cos t$, $A(t)=10+8\cos t$를 얻고 $a=64\pi$ 안의 극값을 센다. 정사각형 위를 움직이는 점 $\mathrm Q$로 $f(t)$를 구간별로 구한 뒤 부분적분으로 정적분을 계산한다.
key_idea: |
  1은 $\mathrm P_1(-\sin t,2+\cos t)$ 등으로 $\ell^2=20+16\cos t$, $a=\int_0^{\pi/2}(\ell^2-20)^2dt=64\pi$, $A(t)=10+8\cos t$($\mathrm P_1\mathrm P_2\mathrm P_3\mathrm P_4$는 정사각형), $A'=-8\sin t=0$에서 $t=\pi,\dots,63\pi$, 극값 합 $18\cdot31+2\cdot32=622$. 2는 $f(t)=\frac{x_{\mathrm Q}}3$를 세 구간으로 나누고 $(A-10)f^2=\frac89(t-2\pi)^2\cos t$를 부분적분.
stuck: $\mathrm P_i$의 좌표를 회전각으로 쓰는 것, 사각형이 정사각형임을 보이는 것, $\mathrm P_1\mathrm P_3\mathrm Q$의 무게중심 $x$좌표에서 $\mathrm P_1,\mathrm P_3$의 $x$좌표가 서로 상쇄됨을 알아차리는 것, 구간별 적분의 분해
