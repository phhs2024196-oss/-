stimuli:
- label: 가
  body: |
    두 변수 $x,y$의 관계를 새로운 변수 $t$를 이용하여
    $$x=f(t),\quad y=g(t)$$
    와 같이 나타낼 때, $t$를 매개변수라 한다.
- label: 나
  body: |
    미분가능한 함수 $f(x)$가 $f'(a)=0$이고 $x=a$의 좌우에서 $f'(x)$의 부호가 양에서 음으로 바뀌거나 음에서 양으로 바뀌면 $f(a)$는 극값이다.
- label: 다
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능하고 $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)g'(x)dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf'(x)g(x)dx$$
stem: |
  [문제 2] 다음 제시문을 읽고 질문에 답하시오. (45점)

  아래 그림과 같이 좌표평면 위에 중심이 각각 $(0,2)$, $(-2,0)$, $(0,-2)$, $(2,0)$이고 반지름의 길이가 $1$인 $4$개의 원 $C_1,C_2,C_3,C_4$와 꼭짓점이 $\left(\dfrac32\pi,0\right),\left(\dfrac32\pi,-\dfrac\pi2\right),\left(\pi,-\dfrac\pi2\right),(\pi,0)$인 정사각형 $S$가 있다.
  실수 $t$ ($t\ge0$)에 대하여 좌표평면 위를 이동하는 $5$개의 점 $\mathrm P_1,\mathrm P_2,\mathrm P_3,\mathrm P_4,\mathrm Q$는 다음과 같은 규칙을 따른다.
  [그림: 좌표평면에 네 원 $C_1$(위), $C_2$(왼쪽), $C_3$(아래), $C_4$(오른쪽)와 $x>0$ 쪽 $x$축 위의 정사각형 $S$가 있고, 각 원의 시작점 $\mathrm R_i$ 근처에 점 $\mathrm P_i$가 호를 따라 이동한 모습이 표시되어 있다. [판독확인: 그림 속 정사각형 꼭짓점의 좌표 표기가 흐려 읽히지 않아 위 문제 본문의 좌표를 따름]]
  • 좌표평면 위의 네 점 $\mathrm R_1(0,3)$, $\mathrm R_2(-3,0)$, $\mathrm R_3(0,-3)$, $\mathrm R_4(3,0)$에 대하여 점 $\mathrm P_i$는 $t=0$일 때 점 $\mathrm R_i$를 출발하여 $t$ ($t>0$)초 동안 원 $C_i$ 위를 시계 반대 방향으로 $t$만큼 이동한다. (단, $i=1,2,3,4$)
  • 점 $\mathrm Q$는 $t=0$일 때 점 $\left(\dfrac32\pi,0\right)$을 출발하여 $t$ ($t>0$)초 동안 정사각형 $S$ 위를 시계 방향으로 $t$만큼 이동한다.

  출발 후 $t$초가 경과했을 때,
  • 두 점 $\mathrm P_1$과 $\mathrm P_3$ 사이의 거리를 $\ell(t)$
  • 사각형 $\mathrm P_1\mathrm P_2\mathrm P_3\mathrm P_4$의 넓이를 $A(t)$
  • 삼각형 $\mathrm P_1\mathrm P_3\mathrm Q$의 무게중심의 $x$좌표를 $f(t)$
  라 하자.
subparts:
- id: '1'
  stem: |
    [논제 1] $a=\displaystyle\int_0^{\frac\pi2}(\ell(t))^4dt-40\int_0^{\frac\pi2}(\ell(t))^2dt+200\pi$라 하자.
    $0<t<a$에서 함수 $A(t)$의 모든 극값의 합을 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '622'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\ell^2=20+16\cos t$, $a=\int_0^{\pi/2}(\ell^2-20)^2dt=64\pi$, $A(t)=10+8\cos t$, $A'=0$에서 $t=\pi,\dots,63\pi$ 극값: $18$이 $31$개, $2$가 $32$개 → $622$.
    steps:
    - id: 1a
      content: $\ell^2=20+16\cos t$ → $a=64\pi$ → $A=10+8\cos t$ → 극값합 $18\cdot31+2\cdot32=622$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - 호의 길이가 $t$이면 중심각은?
    - $\mathrm P_1\mathrm P_2\mathrm P_3\mathrm P_4$의 변과 대각선의 길이를 비교해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 선행학습 영향평가 보고서 R22.pdf p.112 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        반지름이 $1$이므로 호의 길이가 $t$이면 중심각은 $t$이다. 실수 $t\ge0$에 대하여 점 $\mathrm P_1,\mathrm P_2,\mathrm P_3,\mathrm P_4$의 좌표는
        $\mathrm P_1(-\sin t,\,2+\cos t)$, $\mathrm P_2(-2-\cos t,\,-\sin t)$, $\mathrm P_3(\sin t,\,-2-\cos t)$, $\mathrm P_4(2+\cos t,\,\sin t)\ \cdots(\star)$이므로 $(\ell(t))^2=(-2\sin t)^2+(4+2\cos t)^2=20+16\cos t$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        그러므로 $a=\displaystyle\int_0^{\frac\pi2}\left((\ell(t))^2-20\right)^2dt=256\int_0^{\frac\pi2}\cos^2t\,dt=128\int_0^{\frac\pi2}(1+\cos2t)\,dt=64\pi$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        한편 $\overline{\mathrm P_1\mathrm P_2}=\overline{\mathrm P_2\mathrm P_3}=\overline{\mathrm P_3\mathrm P_4}=\overline{\mathrm P_1\mathrm P_4}=\sqrt{(-\sin t+2+\cos t)^2+(2+\cos t+\sin t)^2}=\sqrt{10+8\cos t}$이므로 사각형 $\mathrm P_1\mathrm P_2\mathrm P_3\mathrm P_4$는 모든 변의 길이가 $\sqrt{10+8\cos t}$이고 두 대각선은 서로를 수직 이등분한다. 또한 마찬가지 방법으로 두 대각선의 길이는 $\overline{\mathrm P_1\mathrm P_3}=\overline{\mathrm P_2\mathrm P_4}=\sqrt{20+16\cos t}$로 같으므로 사각형 $\mathrm P_1\mathrm P_2\mathrm P_3\mathrm P_4$는 정사각형이다. 따라서 $A(t)=10+8\cos t$이고 $A(t)$는 미분가능한 함수이다.
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $A'(t)=-8\sin t=0$에서 $t=\pi,2\pi,\cdots,63\pi$이다. 각 점의 좌우에서 $A'(t)$의 부호가 바뀌므로 $A(t)$의 극값은 $A(t)=\begin{cases}18&(t=2\pi,4\pi,\cdots,62\pi)\\2&(t=\pi,3\pi,\cdots,63\pi)\end{cases}$이다. 그러므로 구간 $0<t<64\pi$에서의 함수 $A(t)$의 모든 극값의 합은 $18\times31+2\times32=622$이다.
      criteria:
      - 1.A2
