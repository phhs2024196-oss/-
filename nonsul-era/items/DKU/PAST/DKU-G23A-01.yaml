      points: 10
      evidence: |
        $f(-2a)+f\left(-\frac a2\right)+f(2a)=21\sqrt7$을 구했다(공식 10점).
      depends_on:
      - 2.M1
      - 2.A1
      steps:
      - 2b-5
      - 2a
