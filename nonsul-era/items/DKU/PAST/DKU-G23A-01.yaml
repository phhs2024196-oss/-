  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $x=t^4$로 치환하면 $a_n=\frac1\pi\int_\pi^{n\pi}x\sin x\,dx=-n(-1)^n-1$. $a_{2n-1}=2n-2$, $a_{2n}=-2n-1$이므로 $\sum2^{-4n+1}=\frac{1/8}{1-1/16}=\frac2{15}$.
    steps:
    - id: 3a
      content: $x=t^4$ 치환 + 부분적분 → $a_n=-n(-1)^n-1$ → 등비급수 $\frac2{15}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
    hint_ladder:
    - $\sqrt[4]x=t$로 치환하면 피적분함수는?
    - $a_n$의 홀·짝 항을 따로 써 보자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 R23.pdf p.84 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: |
        $x=t^4$이라고 하면 $\sin\sqrt[4]x=\sin t$, $\sqrt x=t^2$, $dx=4t^3dt$이다. 치환적분을 이용하면 $\displaystyle\int\frac{\sin\sqrt[4]x}{4\sqrt x}\,dx=\int t\sin t\,dt$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        한편 부분적분을 이용하면 $\displaystyle\int x\sin x\,dx=-x\cos x+\sin x+C$ ($C$는 적분상수)이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        이므로 $a_n=\dfrac1{4\pi}\displaystyle\int_{\pi^4}^{n^4\pi^4}\frac{\sin\sqrt[4]u}{\sqrt u}\,du=\dfrac1\pi\int_\pi^{n\pi}x\sin x\,dx=\dfrac1\pi\Big[-x\cos x+\sin x\Big]_\pi^{n\pi}=-n(-1)^n-1$이다.
      criteria:
      - 3.M2
    - id: 3b-4
      content: |
        따라서 $a_{2n-1}=2n-2$이고 $a_{2n}=-2n-1$이므로 $\dfrac{2^{a_{2n}}}{2^{a_{2n-1}}}=2^{-4n+1}$이다.
      criteria:
      - 3.A1
    - id: 3b-5
      content: |
        $\displaystyle\sum_{n=1}^{\infty}\frac{2^{a_{2n}}}{2^{a_{2n-1}}}=\sum_{n=1}^{\infty}2^{-4n+1}=\sum_{n=1}^\infty\frac18\left(\frac1{16}\right)^{n-1}=\dfrac{\frac18}{1-\frac1{16}}=\dfrac2{15}$이다.
      criteria:
      - 3.A1
