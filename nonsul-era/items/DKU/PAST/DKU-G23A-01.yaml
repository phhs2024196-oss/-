intent: |
  구간별로 다르게 정의된 연속함수의 상황을 이해하고 그래프를 활용해 최댓값·최솟값을 판정할 수 있는지(논제 1), 조건을 해석해 그래프의 모양을 파악할 수 있는지(논제 2), 치환적분·부분적분과 급수의 합을 이해하고 있는지(논제 3)를 본다. 연속함수 $f$가 세 식 $3,\ -3,\ \frac12x(x-a)(x+a)$ 중 하나의 값을 가진다는 조건에서 출발해 $f$의 그래프의 가능한 형태를 정하고 양 끝의 극한, 접점, 미분가능성을 따진다.
key_idea: |
  $f(x)\in\{3,-3,f_0(x)\}$ ($f_0=\frac12x(x-a)(x+a)$). 1은 $f_0$의 극댓값 $\frac{\sqrt3}9a^3$가 최댓값, 최솟값 $-3$이므로 $\frac{\sqrt3}9a^3-3=24$. 2는 $g(k)$의 양 끝 극한 분류로 $\lim_{x\to-\infty}f=-3$, (4)로 $f_0(-3)=-3\Rightarrow a=\sqrt7$, $f(-2a)+f(-\frac a2)+f(2a)=-3+3+21\sqrt7$. 3은 $x=t^4$ 치환과 부분적분으로 $a_n=-n(-1)^n-1$, 등비급수 $\frac2{15}$.
stuck: 1에서 세 식 중 연속이 되도록 고르는 경우의 수를 줄이는 것(실근 1개 + 최대·최소의 합이 양수), 2에서 $g(k)$의 두 극한을 $f$의 양 끝 극한으로 분류하는 것, 3에서 $x=t^4$ 치환 후 $\int t\sin t\,dt$
