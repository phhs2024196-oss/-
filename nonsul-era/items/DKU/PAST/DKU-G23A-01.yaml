stimuli:
- label: 가
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고, $x=a$의 좌우에서
    • $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대
    • $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소
- label: 나
  body: |
    등비급수 $\displaystyle\sum_{n=1}^{\infty}ar^{n-1}=a+ar+ar^2+\cdots+ar^{n-1}+\cdots\ (a\ne0)$은
    $\lvert r\rvert<1$일 때 수렴하고, 그 합은 $\dfrac{a}{1-r}$
- label: 다
  body: |
    미분가능한 함수 $t=g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$에서 연속이고,
    $g(a)=\alpha$, $g(b)=\beta$에 대하여 함수 $f(t)$가 $\alpha$와 $\beta$를 양 끝으로 하는 닫힌구간에서 연속일 때
    $$\int_a^bf(g(x))g'(x)\,dx=\int_\alpha^\beta f(t)\,dt$$
- label: 라
  body: |
    미분가능한 두 함수 $f(x)$, $g(x)$에 대하여
    $$\int f(x)g'(x)\,dx=f(x)g(x)-\int f'(x)g(x)\,dx$$
stem: |
  [문제1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  [논제 1]과 [논제 2]에서 함수 $f(x)$는 실수 전체의 집합에서 연속이고 다음 조건을 만족시킨다.

  모든 실수 $x$에 대하여 $(f(x)-3)(f(x)+3)(2f(x)-x^3+a^2x)=0$ (단, $a>0$는 상수)
subparts:
- id: '1'
  stem: |
    [논제 1] 방정식 $f(x)=0$의 실근이 $1$개이고 함수 $f(x)$의 최댓값과 최솟값의 합이 $24$일 때, $a$의 값을 구하시오. (15점)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 3*sqrt(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)\in\{3,-3,f_0(x)\}$, $f_0=\frac12x(x-a)(x+a)$의 극댓값 $\frac{\sqrt3}9a^3$. 실근 1개, 최대+최소$>0$이면 최댓값은 $f_0$의 극댓값, 최솟값 $-3$: $\frac{\sqrt3}9a^3-3=24$, $a=3\sqrt3$.
    steps:
    - id: 1a
      content: 최댓값 $=\frac{\sqrt3}9a^3$, 최솟값 $=-3$ → $a=3\sqrt3$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - 각 $x$에서 $f(x)$가 될 수 있는 세 값을 식으로 써 보자.
    - $f_0$의 극댓값은 어디에서 생기는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 R23.pdf p.83 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        조건 $(f(x)-3)(f(x)+3)(2f(x)-x^3+a^2x)=0$에서 각각의 실수 $x$에 대하여 $f(x)=3$ 또는 $f(x)=-3$ 또는 $f(x)=\dfrac12x(x-a)(x+a)$이다. $f_0(x)=\dfrac12x(x-a)(x+a)$라 하자.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        함수 $f(x)$의 그래프가 $x$축과 만나는 점이 $1$개이고 함수 $f(x)$의 최댓값과 최솟값의 합이 양수이므로
        1) $\displaystyle\lim_{x\to-\infty}f(x)=-3$, $\displaystyle\lim_{x\to\infty}f(x)=3$이고 $f_0(x)$의 극댓값이 $3$보다 크거나
        2) $\displaystyle\lim_{x\to-\infty}f(x)=3$, $\displaystyle\lim_{x\to\infty}f(x)=-3$이고 $f_0(x)$의 극댓값이 $3$보다 커야 한다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $f_0(x)$는 극댓값 $f_0\!\left(-\dfrac a{\sqrt3}\right)=\dfrac{\sqrt3}9a^3$을 갖고 위의 1)과 2)에 의하여 함수 $f(x)$의 최댓값은 $f_0(x)$의 극댓값인 $\dfrac{\sqrt3}9a^3$이다. 이때 함수 $f(x)$의 최솟값은 $-3$이므로 $\dfrac{\sqrt3}9a^3+(-3)=24$이고, $a=3\sqrt3$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: |
        $f(x)\in\{3,-3,f_0(x)\}$로 $f(x)$의 그래프(식)의 가능한 형태를 제시했다(공식 채점기준 15점 중 8점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
      - 1a
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: |
        최댓값 $\frac{\sqrt3}9a^3$, 최솟값 $-3$으로 $a=3\sqrt3$을 구했다(공식 7점).
      depends_on:
      - 1.M1
      steps:
      - 1b-3
      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] 실수 $k$에 대하여 직선 $y=a^2(x-k)$와 함수 $f(x)$의 그래프가 만나는 서로 다른 점의 개수를 $g(k)$라 하자. 함수 $f(x)$가 다음 조건을 만족시킬 때,
    $f(-2a)+f\left(-\dfrac a2\right)+f(2a)$의 값을 구하시오. (20점)

    (1) $\displaystyle\lim_{k\to-\infty}g(k)-\lim_{k\to\infty}g(k)=2$
    (2) $g(-a)=3$
    (3) $f(t)+f(-t)<0$인 실수 $t$가 열린구간 $(0,a)$에 존재한다.
    (4) $f(x)$가 미분가능하지 않은 모든 점의 $x$좌표 중 가장 작은 값은 $-3$
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 21*sqrt(7)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $g(k)$의 양 끝 극한과 조건 (1),(2)로 $\lim_{x\to-\infty}f=-3$, $\lim_{x\to\infty}f=\infty$. (4): $f_0(-3)=-3\Rightarrow a=\sqrt7$. $f(-2a)=-3$, $f\left(-\frac a2\right)=3$, $f(2a)=21\sqrt7$, 합 $21\sqrt7$.
    steps:
    - id: 2a
      content: $f$의 좌우 극한 분류 → $a=\sqrt7$ → $f(x)$ 구간별 → $21\sqrt7$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
    hint_ladder:
    - $f$의 양 끝 극한이 $\pm3$인지 $\pm\infty$인지에 따라 $\lim g(k)$를 따져 보자.
    - $f$가 미분가능하지 않은 점은 상수 구간과 $f_0$가 만나는 곳이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 R23.pdf p.83~84 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        함수 $f(x)$에 따른 $g(k)$의 값을 살펴보면,
        1) $\displaystyle\lim_{x\to-\infty}f(x)=-\infty$, $\displaystyle\lim_{x\to\infty}f(x)=\infty$일 때 : $\displaystyle\lim_{k\to-\infty}g(k)=\lim_{k\to\infty}g(k)=1$
        2) $\displaystyle\lim_{x\to-\infty}f(x)=-\infty$, $\displaystyle\lim_{x\to\infty}f(x)=\pm3$일 때 : $\displaystyle\lim_{k\to-\infty}g(k)=0$, $\displaystyle\lim_{k\to\infty}g(k)=2$
        3) $\displaystyle\lim_{x\to-\infty}f(x)=\pm3$, $\displaystyle\lim_{x\to\infty}f(x)=\pm3$일 때 : $\displaystyle\lim_{k\to-\infty}g(k)=\lim_{k\to\infty}g(k)=1$
        4) $\displaystyle\lim_{x\to-\infty}f(x)=\pm3$, $\displaystyle\lim_{x\to\infty}f(x)=\infty$일 때 : $\displaystyle\lim_{k\to-\infty}g(k)=2$, $\displaystyle\lim_{k\to\infty}g(k)=0$
        조건 (1)에 의해 가능한 경우는 위의 4)뿐이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\displaystyle\lim_{x\to-\infty}f(x)=3$인 경우 $g(-a)=2$, $\displaystyle\lim_{x\to-\infty}f(x)=-3$인 경우 $g(-a)=3$이므로 조건 (2)에 의해 $\displaystyle\lim_{x\to-\infty}f(x)=-3$이다. 위의 사실과 조건 (3)에 의해 함수 $f(x)$의 그래프는 $x\to-\infty$에서 직선 $y=-3$을 따르다가 $y=\dfrac12x(x-a)(x+a)$ 곡선으로 이어지고, 중간에 $y=3$인 구간을 거친 뒤 다시 곡선을 따라 증가하는 모양이다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        조건 (4)로부터 점 $(-3,-3)$은 직선 $y=-3$과 곡선 $y=\dfrac12x(x-a)(x+a)$의 교점이다. $-3=\dfrac12(-3)(-3-a)(-3+a)$로부터 $a=\sqrt7$이다.
      criteria:
      - 2.A1
    - id: 2b-4
      content: |
        따라서 $f(x)=\begin{cases}-3&(x<-3)\\\dfrac12x(x-\sqrt7)(x+\sqrt7)&(-3\le x<-2)\\3&(-2\le x<-1)\\\dfrac12x(x-\sqrt7)(x+\sqrt7)&(x\ge-1)\end{cases}$이다.
      criteria:
      - 2.M1
    - id: 2b-5
      content: |
        이므로 $f(-2a)+f\!\left(-\dfrac a2\right)+f(2a)=21\sqrt7$이다.
      criteria:
      - 2.A2
