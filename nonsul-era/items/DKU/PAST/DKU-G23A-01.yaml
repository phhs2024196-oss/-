  - 직선 $y=a^2(x-k)$와 $y=f(x)$의 교점의 개수 $g(k)$
  - $a_n=\frac1{4\pi}\int_{\pi^4}^{n^4\pi^4}\frac{\sin\sqrt[4]x}{\sqrt x}dx$, $\sum\frac{2^{a_{2n}}}{2^{a_{2n-1}}}$
