stimuli:
- label: 가
  body: |
    함수 $f(x)$가 어떤 구간에서 미분가능하고, 이 구간의 모든 $x$에 대하여
    • $f'(x)>0$이면 $f(x)$는 증가
    • $f'(x)<0$이면 $f(x)$는 감소
- label: 나
  body: |
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는
    $$y'=f'(g(x))g'(x)$$
- label: 다
  body: |
    미분가능한 두 함수 $f(x)$, $g(x)$에 대하여 $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)g'(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf'(x)g(x)\,dx$$
stem: |
  [문제2] 다음 제시문을 읽고 질문에 답하시오. (45점)

  실수 전체의 집합에서 이계도함수를 갖는 함수 $f(x)$는 다음 조건을 만족시킨다.

  (1) $f(x)$는 열린구간 $(-1,0)$에서 증가하고 열린구간 $(0,1)$에서 감소한다.
  (2) $f(-1)+f(1)=0$
  (3) $-1<x<1$인 모든 $x$에 대하여 $f''(x)<0$
  (4) 닫힌구간 $[-1,1]$에서 곡선 $y=f(x)$와 두 점 $(-1,f(-1))$, $(1,f(1))$을 지나는 직선으로 둘러싸인 도형의 넓이는 $3$
subparts:
- id: '1'
  stem: |
    [논제 1] 함수 $g(x)$를 $g(x)=\sin2x$라 할 때, 자연수 $n$에 대하여 열린구간 $(0,n\pi)$에서
    $\{f(g(x))\}'>0$을 만족시키는 모든 $x$의 집합을
    $$\{x\mid t_1<x<t_2\}\cup\{x\mid t_3<x<t_4\}\cup\cdots\cup\{x\mid t_{2p-1}<x<t_{2p}\}$$
    라 하자. (단, $t_1<t_2<t_3<\cdots<t_{2p}$)
    $$\sum_{j=1}^{p}(t_{2j}-t_{2j-1})=\frac{5\pi}{2}$$
    일 때, $n$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $k(x)=f(\sin2x)$, $k'=2f'(\sin2x)\cos2x$. $(0,\pi)$에서 $k'>0$인 구간은 $\left(\frac\pi4,\frac\pi2\right)$, $\left(\frac{3\pi}4,\pi\right)$로 길이 합 $\frac\pi2$. 주기 $\pi$이므로 $\frac{n\pi}2=\frac{5\pi}2$, $n=5$.
    steps:
    - id: 1a
      content: $k'$의 부호 분석, 한 주기 $\pi$에서 길이 $\frac\pi2$ → $n=5$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - $f(g(x))$를 미분하면 어떤 두 인수의 곱인가?
    - $\sin2x,\cos2x$의 주기는 $\pi$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 R23.pdf p.89 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        $k(x)=f(g(x))$라 하자. 그러면 함수 $k(x)$는 미분가능하고 $k'(x)=2f'(\sin2x)\cos2x$이다. $\sin2x$와 $\cos2x$의 주기는 $\pi$이므로 열린구간 $(0,\pi)$에서 조건 (1)에 의하여,
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        1) $f'(\sin2x)>0$, $\cos2x>0$인 경우 : $f'(\sin2x)>0$이려면 $-1\le\sin2x<0$이어야 하므로 $\dfrac\pi2<x<\pi$이고 $\cos2x>0$이려면 $0<x<\dfrac\pi4,\ \dfrac{3\pi}4<x<\pi$이어야 한다. 따라서 $\dfrac{3\pi}4<x<\pi$
        2) $f'(\sin2x)<0$, $\cos2x<0$인 경우 : $f'(\sin2x)<0$이려면 $0<\sin2x\le1$이어야 하므로 $0<x<\dfrac\pi2$이고 $\cos2x<0$이려면 $\dfrac\pi4<x<\dfrac{3\pi}4$이어야 한다. 따라서 $\dfrac\pi4<x<\dfrac\pi2$
        (참고) 조건 (1)에서 $f'(0)=0$이고, 조건 (3)으로부터 닫힌구간 $[-1,1]$에서 연속함수 $f'$는 감소한다. 따라서 $f'(-1)>0$이고 $f'(1)<0$
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        1), 2)로부터 열린구간 $(0,\pi)$에서 $\{f(g(x))\}'>0$인 구간은 $\dfrac\pi4<x<\dfrac\pi2$와 $\dfrac{3\pi}4<x<\pi$이므로 $t_1=\dfrac\pi4$, $t_2=\dfrac\pi2$, $t_3=\dfrac{3\pi}4$, $t_4=\pi$이다. 따라서 $(t_2-t_1)+(t_4-t_3)=\dfrac\pi2$. 함수 $k(x)$는 주기가 $\pi$인 주기함수이므로 열린구간 $(0,n\pi)$에서 $\displaystyle\sum_{j=1}^p(t_{2j}-t_{2j-1})=\frac{5\pi}2$이려면 $n=5$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        합성함수의 도함수 $k'(x)=2f'(\sin2x)\cos2x$를 제시했다(공식 채점기준 20점 중 5점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1a
    - id: 1.M2
      mark_type: M
      points: 7
      evidence: |
        $\{f(g(x))\}'>0$이 되는 구간 $\left(\frac\pi4,\frac\pi2\right)$, $\left(\frac{3\pi}4,\pi\right)$를 제시했다(공식 7점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-2
      - 1a
    - id: 1.A1
      mark_type: A
      points: 8
      evidence: |
        주기성으로 $\frac{n\pi}2=\frac{5\pi}2$를 풀어 $n=5$를 구했다(공식 8점).
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-3
      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] 함수 $h(x)$를 $h(x)=\displaystyle\int_{-1}^xf(t)\,dt$라 할 때, 정적분
    $$\int_{-1}^{1}\Big\{f(x)\cos x+h(x)\sin x\ln\cos x-f(x)\cos x\ln\cos x\Big\}dx$$
    의 값을 구하시오. (25점)
  points: 25
  depends_on: []
  answer:
    kind: value
    value: 3*cos(1)*(1 - log(cos(1)))
    equivalents:
    - 3*cos(1)*log(E/cos(1))
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $f(-1)=-f(1)$이므로 현의 방정식 $y=f(1)x$, 넓이 조건 $\int_{-1}^1f=3$이므로 $h(1)=3$. 부분적분으로 피적분함수의 원시함수 $h\cos x-h\cos x\ln\cos x$를 구하면 $3\cos1(1-\ln\cos1)$.
    steps:
    - id: 2a
      content: $h(1)=3$, 원시함수 $h\cos x(1-\ln\cos x)$ → $3\cos1-3\cos1\ln\cos1$
      criteria:
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.A2
    hint_ladder:
    - 넓이 조건에서 $h(1)$의 값을 구해 보자.
    - $\int h\sin x\,dx$를 서로 다른 두 방식으로 부분적분해 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 R23.pdf p.89~90 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        조건 (2)로부터 $f(-1)=-f(1)$이므로 두 점 $(-1,f(-1))$과 $(1,f(1))$을 지나는 직선의 방정식을 $y=\ell(x)$라 하면 $\ell(x)=f(1)x$이다. 한편 조건 (3)과 (4)에 의하여 곡선 $y=f(x)$는 열린구간 $(-1,1)$에서는 위로 볼록하다. 따라서 직선 $y=\ell(x)$와 곡선 $y=f(x)$는 오직 두 점 $(-1,f(-1))$, $(1,f(1))$에서만 만나고 닫힌구간 $[-1,1]$에서 $\ell(x)\le f(x)$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        조건 (4)에 의하여 $3=\displaystyle\int_{-1}^1\{f(x)-\ell(x)\}dx=\int_{-1}^1\{f(x)-f(1)x\}dx=\int_{-1}^1f(x)dx$이므로 $h(1)=3\ \cdots(\star)$이다.
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        부분적분법에 의하여 $\displaystyle\int h(x)\sin x\,dx=\int h(x)\cos x\frac{\sin x}{\cos x}dx=-h(x)\cos x\ln\cos x+\int\{f(x)\cos x-h(x)\sin x\}\ln\cos x\,dx\ \cdots(\star\star)$이고 $\displaystyle\int h(x)\sin x\,dx=-h(x)\cos x+\int f(x)\cos x\,dx\ \cdots(\star\star\star)$이다. 그러므로 식 $(\star\star)$와 $(\star\star\star)$에 의하여
        $\displaystyle\int\Big\{f(x)\cos x+h(x)\sin x\ln\cos x-f(x)\cos x\ln\cos x\Big\}dx=h(x)\cos x-h(x)\cos x\ln\cos x+C$ ($C$는 적분상수)이다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        이므로 식 $(\star)$와 $h(-1)=0$에 의하여 $\displaystyle\int_{-1}^1\Big\{f(x)\cos x+h(x)\sin x\ln\cos x-f(x)\cos x\ln\cos x\Big\}dx=3\cos1-3\cos1\ln\cos1=3\cos1(1-\ln\cos1)=3\cos1\ln\dfrac e{\cos1}$이다.
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        두 점을 지나는 직선의 방정식 $y=f(1)x$를 제시했다(공식 채점기준 25점 중 3점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2a
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $h(1)=3$을 제시했다(공식 5점).
      depends_on:
      - 2.M1
      steps:
      - 2b-2
      - 2a
    - id: 2.M2
      mark_type: M
      points: 12
      evidence: |
        부분적분법으로 피적분함수의 부정적분 $h\cos x-h\cos x\ln\cos x$를 제시했다(공식 12점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-3
      - 2a
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: |
        $3\cos1(1-\ln\cos1)$를 구했다(공식 5점).
      depends_on:
      - 2.A1
      - 2.M2
      steps:
      - 2b-4
      - 2a
