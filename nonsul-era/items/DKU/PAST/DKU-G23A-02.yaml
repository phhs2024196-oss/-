intent: |
  미분을 활용해 함수의 증가와 감소를 판단할 수 있는지(논제 1), 부분적분법을 이해하고 활용할 수 있는지(논제 2)를 본다. 논제 1은 합성함수의 미분 $2f'(\sin2x)\cos2x$의 부호를 $f'$의 부호와 $\cos2x$의 부호로 나누어 한 주기 $(0,\pi)$에서 $k'>0$인 구간의 길이를 구하고 주기성으로 $n$을 정한다. 논제 2는 $f$의 그래프 개형에서 직선과 곡선으로 둘러싸인 넓이로 $h(1)=3$을 얻고, 부분적분으로 피적분함수의 원시함수를 찾는다.
key_idea: |
  1은 $k(x)=f(\sin2x)$, $k'=2f'(\sin2x)\cos2x$, $(0,\pi)$에서 $k'>0$인 구간 $\left(\frac\pi4,\frac\pi2\right)\cup\left(\frac{3\pi}4,\pi\right)$, 길이 합 $\frac\pi2$이고 주기 $\pi$이므로 $\frac{n\pi}2=\frac{5\pi}2$. 2는 $h(1)=3$, $\int\{f\cos x+h\sin x\ln\cos x-f\cos x\ln\cos x\}dx=h\cos x-h\cos x\ln\cos x$.
stuck: 1에서 $f'(\sin2x)$의 부호를 $\sin2x\in(-1,0)$ 또는 $(0,1]$로 번역하는 것, 2에서 피적분함수를 $h$와의 곱의 미분 꼴로 보고 $h\cos x(1-\ln\cos x)$를 원시함수로 찾는 것
