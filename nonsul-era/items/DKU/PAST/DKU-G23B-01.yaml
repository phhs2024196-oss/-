      mark_type: M
      points: 8
      evidence: |
        선분 $\mathrm{AB}_2$의 기울기와 $\mathrm B_3$에서의 접선의 기울기가 일치할 때 $\mathrm B_3$이 가장 멀리 있음을 제시했다(공식 채점기준 15점 중 8점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1a
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $a_2=-\frac19$을 제시했다(공식 3점).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
      - 1a
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $a_1=\frac29$를 구했다(공식 4점).
      depends_on:
      - 1.M1
      - 1.A1
      steps:
      - 1b-3
      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] 수열 $\{a_n\}$이 등비수열임을 참고하여 $\mathrm{A}$가 꼭짓점이고 $R$에 포함되는 삼각형의 넓이의 최댓값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 4/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $a_{n+1}=-\frac12a_n$이므로 $\mathrm B_n\to(0,\pm2)$, 넓이가 점점 커져 세 꼭짓점 $\mathrm A,(0,g(0)),(0,f(0))$일 때 최대: $\frac12\cdot\frac23\cdot\{2-(-2)\}=\frac43$.
    steps:
    - id: 2a
      content: $a_{n+1}=-\frac12a_n$ → 넓이 단조증가의 극한 → 최대 넓이 $\frac43$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $\mathrm{AB}_n$의 기울기와 $g'(a_{n+1})$ 사이의 관계식을 세워 $a_{n+1}$을 $a_n$으로 나타내 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 R23.pdf p.97 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        $R$에 내접하는($S$에 내접하는) 임의의 삼각형 $\triangle\mathrm{ABC}$가 있다. 당연히 $\triangle\mathrm{ABC}$의 넓이보다 점 $\mathrm A,\mathrm B$가 꼭짓점이고 넓이가 최대인 삼각형 $\triangle\mathrm{ABB}_1$의 넓이가 크거나 같고, 다시 삼각형 $\triangle\mathrm{ABB}_1$의 넓이보다 삼각형 $\triangle\mathrm{AB}_1\mathrm B_2$의 넓이가 더 크거나 같다. 이 과정을 반복해서 얻은 삼각형 $\triangle\mathrm{AB}_n\mathrm B_{n+1}$의 넓이는 삼각형 $\triangle\mathrm{AB}_{n-1}\mathrm B_n$의 넓이보다 같거나 크다.
      criteria:
      - 2.M2
    - id: 2b-2
      content: |
        한편 수열 $\{a_n\}$을 살펴보기 위해서 [논제 1]과 같이 접선의 기울기와 선분의 기울기의 관계를 이용하자. 점 $\mathrm B_n$이 $\mathrm B_n(a_n,f(a_n))$과 $\mathrm B_n(a_n,g(a_n))$인 두 가지 경우가 있으므로 각 경우를 나누어 생각하자. 먼저 $\mathrm B_n(a_n,f(a_n))$이라면 $\triangle\mathrm{AB}_n\mathrm B_{n+1}$이 두 점 $\mathrm A,\mathrm B_n$을 꼭짓점으로 하는 삼각형 중 넓이가 최대가 되기 위해서는 선분 $\overline{\mathrm{AB}_n}$의 기울기는 $y=g(x)$의 $x=a_{n+1}$에서의 접선의 기울기와 같아야 한다. 선분 $\overline{\mathrm{AB}_n}$의 기울기는 $\dfrac{3\left(a_n+\frac23\right)(1-3a_n)}{a_n+\frac23}$이고 곡선 $y=g(x)$의 $x=a_{n+1}$에서의 접선의 기울기는 $g'(a_{n+1})=18a_{n+1}+3$이므로 $a_{n+1}=-\dfrac12a_n$을 얻는다. 마찬가지로 $\mathrm B_n(a_n,g(a_n))$인 경우에는 선분 $\overline{\mathrm{AB}_n}$의 기울기가 $3(3a_n-1)$이고 이것이 $f'(a_{n+1})=-18a_{n+1}-3$과 같아야 하므로 역시 $a_{n+1}=-\dfrac12a_n$을 얻는다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        따라서 수열 $\{a_n\}$은 공비가 $-\dfrac12$인 등비수열이고, $a_1\ne0$이라면 삼각형 $\triangle\mathrm{AB}_n\mathrm B_{n+1}$의 넓이는 $n$이 증가할 때 점점 커지기 때문에 세 꼭짓점이 $\mathrm A$, $(0,g(0))$, $(0,f(0))$일 때 삼각형의 넓이가 가장 크다(※ $\displaystyle\lim_{n\to\infty}a_n=0$).
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        그러므로 구하는 삼각형의 넓이의 최댓값은 $\dfrac12\cdot\dfrac23\{2-(-2)\}=\dfrac43$이다.
      criteria:
      - 2.A1
