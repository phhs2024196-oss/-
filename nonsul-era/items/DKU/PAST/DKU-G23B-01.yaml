intent: |
  극값의 개념(접선의 기울기와 선분의 기울기)을 이해하는지(논제 1), 최대·최소의 개념을 확장해 적용할 수 있는지(논제 2), 정적분과 급수의 합 사이의 관계를 이해하는지(논제 3)를 본다. 두 곡선 $y=\pm3(x+\frac23)(1-3x)$로 둘러싸인 도형에서 밑변 $\mathrm{AB}_n$이 같을 때 높이가 가장 큰 점이 접선의 기울기가 선분의 기울기와 같은 점임을 이용해 $a_{n+1}=-\frac12a_n$을 얻고, $b_n$을 구분구적법으로 정적분으로 바꾼다.
key_idea: |
  $\triangle\mathrm{AB}_n\mathrm B_{n+1}$의 넓이가 최대이면 $\mathrm B_{n+1}$은 현 $\mathrm{AB}_n$에서 가장 먼 점이므로 접선의 기울기 $=$ 현의 기울기: $3(1-3a_n)=18a_{n+1}+3$, $a_{n+1}=-\frac12a_n$. 1은 $a_2=-\frac19$, $a_1=\frac29$. 2는 극한의 세 꼭짓점 $\mathrm A,(0,g(0)),(0,f(0))$, 넓이 $\frac43$. 3은 $b_n=-\frac1{\ln2}\sum_{k=n}^{2n-1}\frac1{k+1}\to-\frac1{\ln2}\int_0^1\frac{dx}{x+1}=-1$.
stuck: 1에서 "넓이 최대 삼각형의 꼭짓점은 밑변에서 가장 먼 점 = 접선의 기울기가 밑변의 기울기와 같은 점"이라는 번역, 3에서 $\sum_{k=n}^{2n-1}\frac1{k+1}$를 $\frac1n\sum\frac1{1+k/n}$ 꼴로 바꾸는 것
