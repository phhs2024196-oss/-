      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 7
      evidence: |
        접선의 기울기와 선분의 기울기가 같다는 관계식 $3(3a_n-1)=f'(a_{n+1})$(및 대칭 경우)를 제시했다(공식 채점기준 20점 중 7점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-2
      - 2a
    - id: 2.M2
      mark_type: M
      points: 7
      evidence: |
        넓이가 단조증가하므로 세 꼭짓점이 $\mathrm A$, $(0,g(0))$, $(0,f(0))$일 때 넓이가 가장 큼을 제시했다(공식 7점).
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-1
      - 2b-3
      - 2a
    - id: 2.A1
      mark_type: A
