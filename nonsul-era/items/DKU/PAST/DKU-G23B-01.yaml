stimuli:
- label: 가
  body: |
    함수 $f(x)$가 $x=c$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(c,f(c))$에서의 접선의 방정식은 $y-f(c)=f'(c)(x-c)$
- label: 나
  body: |
    열린구간 $(a,b)$에서 미분가능한 함수 $f(x)$가 $x=c$에서 최댓값을 가질 때 $f'(c)=0$ (단, $a<c<b$)
- label: 다
  body: |
    첫째항부터 차례대로 일정한 수를 곱하여 만든 수열을 등비수열이라 하고, 곱하는 일정한 수를 공비라고 한다. 즉, 공비 $r$인 등비수열 $\{a_n\}$에 대하여
    $$a_{n+1}=ra_n\quad(\text{단, }n=1,2,3,\cdots)$$
    또한 첫째항이 $a$, 공비가 $r\ (r\ne0)$인 등비수열 $\{a_n\}$의 일반항은 $a_n=ar^{n-1}$
- label: 라
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)dx=\lim_{n\to\infty}\sum_{k=1}^nf(x_k)\Delta x\qquad\left(\text{단, }\Delta x=\frac{b-a}{n},\ x_k=a+k\Delta x\right)$$
stem: |
  [문제1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  함수 $f(x)=3\left(x+\dfrac23\right)(1-3x)$의 그래프와 $g(x)=-f(x)$의 그래프로 둘러싸인 도형을 $R$이라 하고 $R$의 둘레를 $S$라 하자.
  $-\dfrac23<a<\dfrac13$에 대하여 $S$ 위의 두 점 $\mathrm{A}\left(-\dfrac23,0\right)$과 $\mathrm{B}(a,g(a))$를 꼭짓점으로 하고 $R$에 포함되는 삼각형 중에서 넓이가 최대인 삼각형의 꼭짓점을 $\mathrm{A},\mathrm{B},\mathrm{B}_1$이라 하고, 다시 두 점 $\mathrm{A}$와 $\mathrm{B}_1$을 꼭짓점으로 하고 $R$에 포함되는 삼각형 중에서 넓이가 최대인 삼각형의 꼭짓점을 $\mathrm{A},\mathrm{B}_1,\mathrm{B}_2$라 하자. 이 과정을 계속 반복하여 자연수 $n$에 대하여 두 점 $\mathrm{A}$와 $\mathrm{B}_n$을 꼭짓점으로 하고 $R$에 포함되는 삼각형 중에서 넓이가 최대인 삼각형의 꼭짓점을 $\mathrm{A},\mathrm{B}_n,\mathrm{B}_{n+1}$이라 하자. 또한 점 $\mathrm{B}_n$의 $x$좌표를 $a_n$이라 하자.
  [그림: 위로 볼록한 곡선 $y=f(x)$와 아래로 볼록한 곡선 $y=g(x)$가 두 점 $\mathrm A\left(-\frac23,0\right)$, $\left(\frac13,0\right)$에서 만나 둘러싸는 도형 $R$. $\mathrm A$에서 $\mathrm B_{n-1},\mathrm B_n,\mathrm B_{n+1}$로 선분이 그어져 있고 $\mathrm B_n$의 $x$좌표 $a_n$이 표시되어 있다.]
subparts:
- id: '1'
  stem: |
    [논제 1] $\mathrm{B}_3\left(\dfrac1{18},f\left(\dfrac1{18}\right)\right)$일 때 $a_1$의 값을 구하시오. (15점)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 2/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\mathrm B_3$은 $y=f$ 위에서 현 $\mathrm{AB}_2$에서 가장 먼 점이므로 $\mathrm{AB}_2$의 기울기 $3(3a_2-1)=f'\left(\frac1{18}\right)=-4$, $a_2=-\frac19$. 같은 방법으로 $\mathrm{AB}_1$의 기울기 $3(1-3a_1)=g'\left(-\frac19\right)=1$, $a_1=\frac29$.
    steps:
    - id: 1a
      content: '현의 기울기 $=$ 접선의 기울기: $a_2=-\frac19$, $a_1=\frac29$'
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - 넓이가 최대인 삼각형의 세 번째 꼭짓점은 밑변에서 어떤 위치인가?
    - 그 점에서 접선의 기울기와 밑변의 기울기는 어떤 관계인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 R23.pdf p.97 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        삼각형 $\triangle\mathrm{AB}_2\mathrm B_3$은 두 점 $\mathrm A$와 $\mathrm B_2$가 꼭짓점이고 $R$에 포함되는 삼각형 중에서 넓이가 최대인 삼각형이므로 점 $\mathrm B_3$은 곡선 $y=f(x)$ 위의 점 중에서 선분 $\overline{\mathrm{AB}_2}$에서 가장 멀리 있는 점이다. 그런데 제시문 (나)에 의해서 선분 $\overline{\mathrm{AB}_2}$와 $\mathrm B_3$이 가장 멀리 있을 때에는 선분 $\overline{\mathrm{AB}_2}$의 기울기와 $\mathrm B_3$에서의 접선의 기울기가 같으므로, 선분 $\overline{\mathrm{AB}_2}$의 기울기는
        $\dfrac{3\left(a_2+\frac23\right)(3a_2-1)}{a_2+\frac23}$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이고 $f'\left(\dfrac1{18}\right)=-4$이므로 $a_2=-\dfrac19$을 얻는다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        마찬가지로 선분 $\overline{\mathrm{AB}_1}$의 기울기는 $3(1-3a_1)$이고 $g'\left(-\dfrac19\right)=1$이므로 $a_1=\dfrac29$
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
