      steps:
      - 1b-2
      - 1a
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: |
        원점대칭으로 $\int_0^1f(x)dx=\frac58$을 제시했다(공식 4점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-3
      - 1b-4
      - 1a
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $\int_{-1}^4f=\frac{59}8$을 구해 $\int_{-1}^4f^{-1}=\frac{61}8$을 얻었다(공식 5점).
      depends_on:
      - 1.M1
      - 1.M2
      - 1.M3
      steps:
      - 1b-5
      - 1a
    deductions: []
