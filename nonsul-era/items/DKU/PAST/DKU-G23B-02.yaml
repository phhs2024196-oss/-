- id: '2'
  stem: |
    [논제 2] $g(t)\ne0$인 각각의 실수 $t$마다 다음 조건을 만족시키는 점 $\mathrm{P}$가 단 하나씩 존재할 때 실수 $b$의 최솟값을 구하시오. (25점)

    [조건] 곡선 $y=g(x)$와 중심이 $(t,0)$인 어떤 원 $O$가 점 $\mathrm{P}$에서 만나고
    점 $\mathrm{P}$에서 곡선 $y=g(x)$와 원 $O$는 동시에 접하는 접선을 갖는다.

    [그림: 지수함수 모양의 곡선 $y=g(x)$와 중심 $(t,0)$인 원 $O$가 점 $\mathrm P$에서 접하며, $\mathrm P$에서의 공통 접선(빨간 직선)이 그려져 있다.]
  points: 25
  depends_on: []
  answer:
    kind: value
    value: -2*sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $\mathrm P(u,g(u))$에서 법선이 $(t,0)$을 지나므로 $t=u+g(u)g'(u)=u+ae^u(ae^u+b)=:h(u)$. $t$마다 $u$가 하나이려면 $h$가 일대일대응이어야 하므로 $h'(u)=1+2a^2e^{2u}+abe^u\ge0$. $b<0$이면 $h'=1+2\left(ae^u+\frac b4\right)^2-\frac{b^2}8\ge0\iff b\ge-2\sqrt2$.
    steps:
    - id: 2a
      content: $t=h(u)$, $h'\ge0$ → $b\ge-2\sqrt2$, 최솟값 $-2\sqrt2$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - 공통접선에 수직인 직선(법선)은 원의 중심을 지난다.
    - $t$마다 $u$가 하나라는 것은 $h$가 일대일대응이라는 뜻이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 R23.pdf p.103~104 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm P(u,g(u))$에서 원 $O$의 접선이 점 $\mathrm P(u,g(u))$에서 곡선 $y=g(x)$의 접선과 일치하므로 접선의 방정식은 $y-g(u)=g'(u)(x-u)$이다. 또한 점 $\mathrm P$를 지나고 접선에 수직인 직선이 원 $O$의 중심 $(t,0)$을 지나므로 $0=-\dfrac1{g'(u)}(t-u)+g(u)$이고, $g(x)=ae^x+b$이므로 이를 정리하면 $u+ae^u(ae^u+b)=t$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        문제에서 요구하는 $b$의 최솟값을 구하기 위하여 $h(u)=u+ae^u(ae^u+b)$가 실수 전체의 집합에서 실수 전체의 집합으로 가는 일대일대응이 되도록 하는 $b$를 모두 찾으면 충분하다. 먼저 $\displaystyle\lim_{u\to\infty}h(u)=\infty$, $\displaystyle\lim_{u\to-\infty}h(u)=-\infty$이고 $h(u)$는 연속함수이므로 $g(t)\ne0$인 각각의 $t$에 대하여 방정식 $h(u)=t$가 하나 이상의 해를 가진다. 또한, $h(u)$는 상수인 구간이 없으므로 $h(u)$가 일대일함수이기 위한 필요충분조건은 $h'(u)\ge0$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $h'(u)=1+2a^2e^{2u}+abe^u$이므로 $h'(u)\ge0$이기 위해서는
        1) $b\ge0$일 때는 모든 실수 $u$에 대하여 $h'(u)\ge0$,
        2) $b<0$일 때는 $h'(u)=1+2\left(ae^u+\dfrac b4\right)^2-\dfrac{b^2}8$에서 $b\ge-2\sqrt2$는 $h'(u)\ge0$이기 위한 필요충분조건이다.
        그러므로 $b$의 최솟값은 $-2\sqrt2$이다.
      criteria:
      - 2.A1
