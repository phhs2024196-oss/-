      mark_type: M
      points: 10
      evidence: |
        점 $\mathrm P$의 $x$좌표 $u$와 $t$의 관계식 $u+ae^u(ae^u+b)=t$를 제시했다(공식 채점기준 25점 중 10점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2a
    - id: 2.M2
      mark_type: M
      points: 10
      evidence: |
        $h(u)$가 일대일대응이기 위한 조건 $h'(u)\ge0$을 제시했다(공식 10점).
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
      - 2a
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $h'(u)\ge0$을 풀어 $b$의 최솟값 $-2\sqrt2$를 구했다(공식 5점).
      depends_on:
      - 2.M2
      steps:
      - 2b-3
      - 2a
    deductions: []
