intent: |
  역함수의 정적분과 함수의 정적분의 관계를 이해하고 주어진 함수의 성질로 정적분을 구하는지(논제 1), 미분을 활용해 접선의 방정식을 구하고 그로부터 유도된 방정식이 실근을 단 하나만 갖는 조건을 찾는지(논제 2)를 본다. 논제 1은 $f(k)=k$, 원점대칭성 $f(x)+f(-x)=0$ 등으로 $\int_{-1}^4f$를 구한 뒤 $\int f+\int f^{-1}=$ 직사각형 관계를 쓴다. 논제 2는 $\mathrm P(u,g(u))$의 법선이 $(t,0)$을 지난다는 조건으로 $t=u+g(u)g'(u)$를 얻고 $h(u)$가 일대일 대응이 되기 위한 $h'(u)\ge0$ 조건을 푼다.
key_idea: |
  1은 $f(k)=k$, $\int_{-1}^4f+\int_{-1}^4f^{-1}=16-1=15$, $\int_{-1}^4f=-\frac58+2\left(\frac58+\frac{11}8\right)+4=\frac{59}8$. 2는 $t=u+ae^u(ae^u+b)=:h(u)$가 일대일대응 $\iff h'(u)=1+2a^2e^{2u}+abe^u\ge0$이므로 $b\ge-2\sqrt2$.
stuck: 1에서 조건 (1),(2)로 $f$가 원점대칭($f(x)+f(-x)=0$)이고 $f(k)=k$임을 끌어내는 것, 2에서 "원 $O$와 곡선이 $\mathrm P$에서 공통접선" $\Rightarrow$ 법선이 중심을 지남, $t$에 대한 $\mathrm P$의 유일성을 $h$의 일대일대응으로 바꾸는 것
