stimuli:
- label: 가
  body: |
    함수 $f(x)$가 임의의 세 실수 $a,b,c$를 포함하는 닫힌구간에서 연속일 때,
    $$\int_a^cf(x)dx+\int_c^bf(x)dx=\int_a^bf(x)dx$$
- label: 나
  body: |
    미분가능한 함수 $g(t)$에 대하여 $x=g(t)$로 놓으면
    $$\int f(x)\,dx=\int f(g(t))g'(t)\,dt$$
- label: 다
  body: |
    함수 $f(x)$가 어떤 구간에서 미분가능하고, 이 구간의 모든 $x$에 대하여
    • $f'(x)>0$이면 $f(x)$는 증가
    • $f'(x)<0$이면 $f(x)$는 감소
stem: |
  [문제2] 다음 제시문을 읽고 질문에 답하시오. (45점)

  실수 전체의 집합에서 연속이고 증가하는 함수 $f(x)$는 다음 조건을 만족시킨다.

  (1) 모든 실수 $x$에 대하여 $f(x+2)=f(x)+2$
  (2) $0\le x\le2$인 모든 $x$에 대하여 $f(x)+f(2-x)=2$
  (3) $\displaystyle\int_0^1f(x)dx-\int_{-1}^0f(x)dx=\frac54$

  함수 $g(x)$를 $g(x)=ae^x+b$라 하자. (단, $a,b$는 상수이고 $a>0$)
subparts:
- id: '1'
  stem: |
    [논제 1] 정적분 $\displaystyle\int_{-1}^4f^{-1}(x)\,dx$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 61/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(k)=k$이므로 $\int_{-1}^4f+\int_{-1}^4f^{-1}=16-1=15$. $\int_{-1}^4f=\int_{-1}^0f+2\int_0^2f+4$, 원점대칭으로 $\int_0^1f=\frac58$, $\int_1^2f=\frac{11}8$, $\int_{-1}^4f=\frac{59}8$. 따라서 $15-\frac{59}8=\frac{61}8$.
    steps:
    - id: 1a
      content: $f(k)=k$ → 직사각형 관계 $15$ → $\int_{-1}^4f=\frac{59}8$ → $\frac{61}8$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
    hint_ladder:
    - 조건 (1),(2)에 $x=0,1$을 대입해 $f(0),f(1),f(2)$를 구해 보자.
    - $f$와 $f^{-1}$의 정적분의 합은 어떤 도형의 넓이인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 R23.pdf p.103 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        $x=0$일 때 조건 (1)에서 $f(2)=f(0)+2$이고 조건 (2)에서 $f(0)+f(2)=2$이므로 $f(0)=0$, $f(2)=2$이다. 또, $x=1$일 때 조건 (2)에서 $f(1)=1$이다. 따라서 조건 (1)에서 모든 정수 $k$에 대하여 $f(k)=k$이다. $f(x)$가 역함수를 가지므로 $f^{-1}(-1)=-1$이고 $f^{-1}(4)=4$이다. 따라서 $\displaystyle\int_{-1}^4f(x)dx+\int_{-1}^4f^{-1}(x)dx=16-1=15$이므로 $\displaystyle\int_{-1}^4f^{-1}(x)dx=15-\int_{-1}^4f(x)dx$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        그러므로 $\displaystyle\int_{-1}^4f(x)dx$의 값을 구하면 된다. 조건 (1)에서 $\displaystyle\int_2^4f(x)dx=\int_0^2f(x+2)dx=\int_0^2\{f(x)+2\}dx=\int_0^2f(x)dx+4$이므로
        $\displaystyle\int_{-1}^4f(x)dx=\int_{-1}^0f(x)dx+2\int_0^2f(x)dx+4\ \cdots(\star)$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        한편, 조건 (1)에서 $f(2-x)=f(-x)+2$이고 조건 (2)에서 $0\le x\le2$일 때 $f(2-x)=2-f(x)$이므로 $-2\le x\le2$일 때 $f(x)+f(-x)=0$, 즉 원점에 대칭이다. 따라서 $\displaystyle\int_{-1}^1f(x)dx=0$이고 조건 (3)에서 $\displaystyle\int_0^1f(x)dx=-\int_{-1}^0f(x)dx=\dfrac58\ \cdots(\star\star)$이다.
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        또한, 조건 (1)에서 $\displaystyle\int_1^2f(x)dx=\int_{-1}^0f(x+2)dx=\int_{-1}^0\{f(x)+2\}dx=-\dfrac58+2=\dfrac{11}8$이다.
      criteria:
      - 1.M3
    - id: 1b-5
      content: |
        그러므로 $(\star)$과 $(\star\star)$에서 $\displaystyle\int_{-1}^4f(x)dx=-\dfrac58+2\left(\dfrac58+\dfrac{11}8\right)+4=\dfrac{59}8$이다. 따라서 $\displaystyle\int_{-1}^4f^{-1}(x)dx=15-\dfrac{59}8=\dfrac{61}8$이다.
      criteria:
      - 1.A1
