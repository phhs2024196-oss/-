- id: '3'
  stem: |-
    [논제 3] 구간 $\left(-\dfrac\pi2,\dfrac\pi2\right)$에서 다음 조건을 만족시키는 상수 $a$의 개수를 구하시오.

    함수 $h(x)$는 $x=a$에서 극값을 갖는다.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\tan x+p(x)$가 증가함수이고 $x=0$에서 $0$이므로 $h=\lvert\tan x+p(x)\rvert$는 $x=0$에서만 극값을 갖는다.
    steps:
    - id: 3a
      content: $(\tan x+p(x))'=\tan^2x+\frac{48}{\pi^2}x^2\ge0$ ⇒ 증가, $h(0)=0$ ⇒ $x<0$ 감소, $x>0$ 증가 ⇒ 개수 $1$
      criteria:
      - 3.M1
      - 3.A1
    hint_ladder:
    - $\tan x+p(x)$의 도함수의 부호는?
    - $\tan x+p(x)=0$인 $x$는?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: R24.pdf p.82 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: $\tan x+p(x)$는 미분가능하고, $\tan x+p(x)$의 도함수는 $$\sec^2x+p'(x)=\sec^2x+\frac{48}{\pi^2}x^2-1=\tan^2x+\frac{48}{\pi^2}x^2\ge0$$ 이므로 구간 $\left(-\frac\pi2,\frac\pi2\right)$에서 함수 $\tan x+p(x)$는 증가한다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 또한 $h(0)=0$이므로 함수 $h(x)=\left\lvert\tan x+\dfrac{16}{\pi^2}x^3-x\right\rvert$는 $x<0$일 때 감소하고 $x>0$일 때 증가한다.
      criteria:
      - 3.A1
    - id: 3b-3
      content: 따라서 극값을 갖는 $x$의 개수는 $1$개이다.
      criteria:
      - 3.A1
