- id: '2'
  stem: '[논제 2] 삼차함수 $p(x)$를 구하시오.'
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: 16*x**3/pi**2 - x
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g=fp$가 $f$의 미분불가점 $0,\pm\frac\pi4$에서 미분가능하려면 $p$가 그 점에서 $0$. $h$가 $x=0$에서 미분가능하려면 $\tan x+p(x)$의 $x=0$에서의 미분계수가 $0$.
    steps:
    - id: 2a
      content: $p(x)=a\left(x^3-\frac{\pi^2}{16}x\right)$, $1+p'(0)=1-\frac{\pi^2}{16}a=0\Rightarrow a=\frac{16}{\pi^2}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $f$가 미분가능하지 않은 점은?
    - $h(x)\ge0$이고 $h(0)=0$이면 $h'(0)$은?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: R24.pdf p.81~82 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: $g(x)=f(x)p(x)$는 $x\ne\frac\pi4,0,-\frac\pi4$일 때 미분가능하고 $g'(x)=f'(x)p(x)+f(x)p'(x)$이다. 한편 $f(x)$는 $x=\frac\pi4,0,-\frac\pi4$에서 미분가능하지 않다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: '따라서 조건 (1)로부터 $p\left(\frac\pi4\right)=p(0)=p\left(-\frac\pi4\right)=0$이어야 한다. (보충: 좌·우미분계수 $f''(a\pm)$가 서로 다르므로 $g''(a\pm)$가 같으려면 $p(a)=0$이다.)'
      criteria:
      - 2.M1
    - id: 2b-3
      content: 그러므로 적당한 상수 $a$ $(a\ne0)$에 대하여 $$p(x)=ax\left(x-\frac\pi4\right)\left(x+\frac\pi4\right)=a\left(x^3-\frac{\pi^2}{16}x\right)\qquad\cdots\cdots\ ①$$ 이다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: $h(0)=0$, $h(x)\ge0$으로부터 $\displaystyle\lim_{t\to0+}\frac{h(t)}t\ge0$, $\displaystyle\lim_{t\to0-}\frac{h(t)}t=-\lim_{t\to0+}\frac{h(t)}t\le0$이므로 $h(x)$가 $x=0$에서 미분가능하려면 $\displaystyle\lim_{t\to0+}\frac{h(t)}t=\lim_{t\to0-}\frac{h(t)}t=0$이다.
      criteria:
      - 2.M2
    - id: 2b-5
      content: '또한 $-h(t)\le\tan t+p(t)\le h(t)$이므로 $$0=-\lim_{t\to0+}\frac{h(t)}t\le\lim_{t\to0}\frac{\tan t+p(t)}t\le\lim_{t\to0+}\frac{h(t)}t=0$$ 이다. 따라서 $a=\dfrac{16}{\pi^2}$, $p(x)=\dfrac{16}{\pi^2}x^3-x$이다. (보충: $\lim_{t\to0}\frac{\tan t+p(t)}t=1+p''(0)=1-\frac{\pi^2}{16}a$)'
      criteria:
      - 2.A1
  # 채점기준 공식 공개 — R24.pdf p.80, 원 배점 분할 그대로
