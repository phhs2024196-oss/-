stimuli:
- label: 가
  body: |-
    함수 $y=f(x)$에서 평균변화율의 극한값
    $$\lim_{\Delta x\to0}\frac{f(a+\Delta x)-f(a)}{\Delta x}$$
    가 존재하면 $y=f(x)$는 $x=a$에서 미분가능하다고 한다.
- label: 나
  body: |-
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속, $f(x)\ge0$이고, $f(a)=f(b)=0$일 때, 곡선 $y=f(x)$와 $x$축으로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^bf(x)\,dx$$
- label: 다
  body: 함수 $f(x)$에서 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\le f(a)$이면 함수 $f(x)$는 $x=a$에서 극대, 그 때의 함숫값 $f(a)$를 극댓값이라고 하고, $f(x)\ge f(a)$이면 함수 $f(x)$는 $x=a$에서 극소, 그 때의 함숫값 $f(a)$를 극솟값이라고 하며, 극댓값과 극솟값을 통틀어 극값이라고 한다.
stem: |-
  [문제 1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  $-\frac{\pi}{2}<x<\frac{\pi}{2}$일 때 함수 $f(x)$를
  $$f(x)=\lvert\lvert\tan x\rvert-1\rvert$$
  이라 하고, 삼차함수 $p(x)$는 다음 조건을 만족시킨다.

  (1) 함수 $g(x)=f(x)p(x)$는 구간 $\left(-\frac{\pi}{2},\frac{\pi}{2}\right)$에서 미분가능하다.
  (2) 함수 $h(x)=\lvert\tan x+p(x)\rvert$는 $x=0$에서 미분가능하다.
subparts:
- id: '1'
  stem: '[논제 1] 곡선 $y=f(x)$와 $x$축으로 둘러싸인 영역의 넓이를 구하시오.'
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: pi/2 - log(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f$의 영점 $\pm\frac\pi4$ 사이에서 $f=1-\lvert\tan x\rvert$를 적분한다.
    steps:
    - id: 1a
      content: $S=\int_{-\pi/4}^{\pi/4}f\,dx=\frac\pi2-2\int_0^{\pi/4}\tan x\,dx=\frac\pi2-\ln2$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - $f=0$이 되는 $x$는?
    - $y$축 대칭을 이용하면 $\tan x$의 적분은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: R24.pdf p.81 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |-
        $f(x)=\lvert\lvert\tan x\rvert-1\rvert$를 구간별로 쓰면
        $$f(x)=\begin{cases}\tan x-1&\left(\frac\pi4\le x<\frac\pi2\right)\\-\tan x+1&\left(0\le x<\frac\pi4\right)\\\tan x+1&\left(-\frac\pi4\le x<0\right)\\-\tan x-1&\left(-\frac\pi2<x<-\frac\pi4\right)\end{cases}$$
        이고 $f\left(\frac\pi4\right)=f\left(-\frac\pi4\right)=0$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 구하는 넓이 $S$는 $S=\displaystyle\int_{-\frac\pi4}^{\frac\pi4}f(x)\,dx$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: '$f$가 $y$축에 대하여 대칭이고 $0\le x\le\frac\pi4$에서 $f(x)=1-\tan x$이므로 $$S=\frac\pi2-2\int_0^{\frac\pi4}\tan x\,dx$$ 이다. (보충: $\displaystyle\int_0^{\frac\pi4}\tan x\,dx=\Big[-\ln\cos x\Big]_0^{\frac\pi4}=\frac12\ln2$)'
      criteria:
      - 1.M2
    - id: 1b-4
      content: $S=\dfrac\pi2-\ln2$
      criteria:
      - 1.A1
  # 채점기준 공식 공개 — R24.pdf p.80, 원 배점 분할 그대로
