intent: 정적분으로 도형의 넓이를 구할 수 있는지, 미분의 개념(미분가능성)을 이해하는지, 극값의 개념을 이해하는지를 본다. $f(x)=\lvert\lvert\tan x\rvert-1\rvert$의 영점 $\pm\frac\pi4$ 사이의 넓이, 꺾이는 점 $x=0,\pm\frac\pi4$에서 $g=fp$가 미분가능하도록 하는 삼차함수 $p$, 그리고 $\lvert\tan x+p(x)\rvert$의 극값 개수를 구한다.
key_idea: $f$의 미분불가점 $x=0,\pm\frac\pi4$에서 $g=fp$가 미분가능하려면 $p$가 그 세 점에서 $0$이어야 하므로 $p(x)=ax\left(x^2-\frac{\pi^2}{16}\right)$. $h$가 $x=0$에서 미분가능하려면 $\lim_{t\to0}\frac{h(t)}t=0$이고 $\lvert\tan t+p(t)\rvert\le h(t)$로부터 $1+p'(0)=0$.
stuck: $g=fp$의 미분가능성에서 $p(\pm\frac\pi4)=p(0)=0$을 끌어내는 것, 절댓값 함수 $h$의 $x=0$에서의 미분가능성을 $\tan x+p(x)$의 $x=0$ 기울기 $0$ 조건으로 바꾸는 것
