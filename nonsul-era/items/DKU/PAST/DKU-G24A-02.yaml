intent: 도함수의 성질을 활용해 함수의 그래프 개형을 그려 직선과의 교점 개수를 파악할 수 있는지, 치환적분법을 이해하고 활용할 수 있는지를 본다. $f(x)=\frac{e^x}{e^x+1}$의 증가·볼록성으로 삼각형 변과의 교점 조건을 구하고, $u=\sqrt{f(t)}$ 치환으로 $\alpha,\beta$를 연결해 $(\beta^{-1}\circ\alpha)(\ln2)$를 구한다.
key_idea: '[논제 1] $f$는 증가, $x<0$에서 아래로 볼록, $x>0$에서 위로 볼록이므로 변 $AC$가 곡선과 세 점에서 만나려면 직선 $y=\frac1{2k}x+\frac12$의 기울기가 $f''(0)=\frac14$보다 작아야 한다. [논제 2] $g=\beta^{-1}\circ\alpha$이면 $\alpha=\beta\circ g$이므로 제시문 (라)를 쓰고, $u=\sqrt{f(t)}$로 치환해 $\frac{du}{dt}=\frac{u(1-u^2)}2$를 얻어 $\int_0^x\sqrt f\,dt=\int_c^{g(x)}\frac2{1-u^2}du$이므로 $g(x)=\sqrt{f(x)}$.'
stuck: 변 $AC$와의 교점 3개 조건을 접선 기울기 $f'(0)$ 비교로 바꾸는 것, $\alpha=\beta\circ g$에서 $g$를 $\sqrt{f}$로 추측해 치환 $u=\sqrt{f(t)}$를 떠올리는 것
