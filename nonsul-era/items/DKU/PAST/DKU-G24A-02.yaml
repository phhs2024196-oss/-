stimuli:
- label: 가
  body: |-
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능할 때,
    • $(a,b)$에서 $f'(x)>0$이면 함수 $f(x)$는 $[a,b]$에서 증가,
    • $(a,b)$에서 $f'(x)<0$이면 함수 $f(x)$는 $[a,b]$에서 감소
    한다.
- label: 나
  body: |-
    함수 $f(x)$가 어떤 구간에서
    • $f''(x)>0$이면 곡선 $y=f(x)$는 그 구간에서 아래로 볼록
    • $f''(x)<0$이면 곡선 $y=f(x)$는 그 구간에서 위로 볼록
    하다.
- label: 다
  body: 두 함수 $f(x)$, $g(x)$의 합성함수 $h(x)=(f\circ g)(x)=f(g(x))$에 대해서 함수 $f(x)$의 역함수 $f^{-1}(x)$가 존재할 때 $g(x)=(f^{-1}\circ h)(x)$이다.
- label: 라
  body: |-
    미분가능한 함수 $g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속이고, 함수 $f(x)$가 $g(a)$와 $g(b)$를 양 끝으로 하는 열린구간에서 연속일 때
    $$\int_a^b(f\circ g)(x)\,g'(x)\,dx=\int_{g(a)}^{g(b)}f(t)\,dt\qquad\cdots\cdots(\star)$$
    $\alpha(x)=\int_a^x(f\circ g)(t)\,g'(t)\,dt$, $\beta(x)=\int_{g(a)}^xf(t)\,dt$라 할 때, 식 $(\star)$은
    $$\alpha(b)=(\beta\circ g)(b)$$
    와 같다.
stem: |-
  [문제 2] 다음 제시문을 읽고 질문에 답하시오. (45점)

  실수 전체의 집합에서 정의된 함수 $f(x)=\dfrac{e^x}{e^x+1}$에 대하여
  $$\alpha(x)=\int_0^x\sqrt{f(t)}\,dt$$
  이고, $-1<x<1$일 때
  $$\beta(x)=\int_c^x\frac{2}{1-t^2}\,dt,\quad c=\sqrt{f(0)}=\sqrt{\frac12}$$
  이다.
subparts:
- id: '1'
  stem: '[논제 1] 좌표평면 위의 세 점 $\mathrm{A}(-k,0)$, $\mathrm{B}(k,0)$, $\mathrm{C}(k,1)$을 꼭짓점으로 하는 삼각형 $\mathrm{ABC}$의 세 변과 곡선 $y=f(x)$가 서로 다른 네 점에서 만나도록 하는 상수 $k$의 범위를 구하시오. (단, $k>0$)'
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: k > 2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f$의 증가·볼록성으로 변 $AB$와는 만나지 않고 변 $BC$와는 한 점이므로, 변 $AC$와 세 점에서 만나야 한다. 직선 $AC$의 기울기 $\frac1{2k}$가 $f'(0)=\frac14$보다 작아야 한다.
    steps:
    - id: 1a
      content: $\frac1{2k}<\frac14\Rightarrow k>2$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.M4
      - 1.A1
    hint_ladder:
    - $f$의 증가·감소와 볼록성은?
    - 직선 $AC$가 $(0,\frac12)$을 지나는 것을 이용하면?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: R24.pdf p.87~88 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: $f(x)=\dfrac{e^x}{e^x+1}$은 연속이고 미분가능하며 $f'(x)=\dfrac{e^x}{(e^x+1)^2}$, $f''(x)=\dfrac{e^x(1-e^x)}{(e^x+1)^3}$이므로 $f(x)$는 증가함수이고, 구간 $[-k,k]$에서 최솟값 $f(-k)=\dfrac1{e^k+1}$, 최댓값 $f(k)=1-\dfrac1{e^k+1}$을 갖고 $f(0)=\dfrac12$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |-
        또한 $x<0$일 때 $f'(x)$가 증가하고 $x>0$일 때 $f'(x)$가 감소한다. 제시문 (나)에 의해 $f(x)$의 증가와 감소에 관한 표와 그래프는 다음과 같다.

        | $x$ | $-k$ | $\cdots$ | $0$ | $\cdots$ | $k$ |
        | --- | --- | --- | --- | --- | --- |
        | $f'(x)$ | | $+$ | $\frac14$ | $+$ | |
        | $f''(x)$ | | $+$ | $0$ | $-$ | |
        | $f(x)$ | $\frac1{e^k+1}$ | 증가(아래로 볼록) | $\frac12$ | 증가(위로 볼록) | $1-\frac1{e^k+1}$ |

        [그림: $y=f(x)$는 $0<y<1$에서 증가하는 S자형 곡선으로 $x\to-\infty$일 때 $0$에, $x\to\infty$일 때 $1$에 가까워지고 $(0,\frac12)$에서 변곡한다.]
      criteria:
      - 1.M2
    - id: 1b-3
      content: 변 $AB$와 곡선 $y=f(x)$는 만나지 않고($f>0$), 변 $BC$와 곡선 $y=f(x)$는 한 점에서 만나므로 변 $AC$와 곡선 $y=f(x)$는 세 점에서 만나야 한다.
      criteria:
      - 1.M3
      - 1.M4
    - id: 1b-4
      content: 즉 점 $\mathrm{A}(-k,0)$과 점 $\mathrm{C}(k,1)$을 지나는 직선의 방정식 $y=\dfrac1{2k}x+\dfrac12$과 곡선 $y=\dfrac{e^x}{e^x+1}$이 $-k\le x\le k$의 범위에서 서로 다른 세 점에서 만나야 한다. 직선 $y=\dfrac1{2k}x+\dfrac12$이 곡선 $y=f(x)$와 점 $\left(0,\dfrac12\right)$에서 접할 때 (직선의 기울기)$=\dfrac1{2k}=f'(0)=\dfrac14$이다.
      criteria:
      - 1.A1
    - id: 1b-5
      content: 따라서 $f(x)$의 그래프의 개형에 의해 곡선 $y=f(x)$가 직선 $y=\dfrac1{2k}x+\dfrac12$과 서로 다른 세 점에서 만나려면 (직선의 기울기)$=\dfrac1{2k}<\dfrac14$, 즉 $k>2$이어야 한다. 또한 $f(-k)=\dfrac1{e^k+1}>0$, $f(k)=1-\dfrac1{e^k+1}<1$이므로 세 교점의 $x$좌표는 모두 $-k\le x\le k$의 범위에 있다. 결국 구하는 $k$의 범위는 $k>2$이다.
      criteria:
      - 1.A1
