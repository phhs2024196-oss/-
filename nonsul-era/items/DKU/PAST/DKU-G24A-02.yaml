- id: '2'
  stem: '[논제 2] 제시문 (라)를 참조하여, $(\beta^{-1}\circ\alpha)(\ln2)$의 값을 구하시오.'
  points: 25
  depends_on: []
  answer:
    kind: expression
    value: sqrt(2/3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g=\beta^{-1}\circ\alpha$이면 $\alpha=\beta\circ g$이므로 (라)를 쓰고, $u=\sqrt{f(t)}$로 치환하면 $\frac{du}{dt}=\frac{u(1-u^2)}2$이므로 $g(x)=\sqrt{f(x)}$.
    steps:
    - id: 2a
      content: $g(\ln2)=\sqrt{f(\ln2)}=\sqrt{\frac23}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
    hint_ladder:
    - $\alpha=\beta\circ g$이면 $g(0)$은?
    - $\frac{2}{1-u^2}$ 꼴이 나오게 하는 치환은?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: R24.pdf p.88 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: $g(x)=(\beta^{-1}\circ\alpha)(x)$라 하면 $\alpha(x)=(\beta\circ g)(x)$이므로 제시문 (라)에 의해서 $$\int_0^{\ln2}\sqrt{f(t)}\,dt=\int_{g(0)}^{g(\ln2)}\frac{2}{1-t^2}\,dt,\qquad g(0)=\sqrt{f(0)}=\sqrt{\frac12}\quad\cdots\cdots\ ①$$ 을 만족시키는 치환 $u=g(t)$를 구하면 된다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: ①을 만족시키기 위해서 $u=\sqrt{f(t)}$로 치환해 보자. $u^2=f(t)$이므로 $$2u\frac{du}{dt}=f'(t)=\frac{e^t}{(1+e^t)^2}=\left(\frac{e^{2t}}{(1+e^t)^2}\frac1{e^t}\right)=u^4\left(\frac1{u^2}-1\right)=u^2(1-u^2)$$ 이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 $\dfrac{du}{dt}=\dfrac{u(1-u^2)}2$이고, $\dfrac{dt}{du}\cdot u=\dfrac2{1-u^2}$에서 $$\int_0^x\sqrt{f(t)}\,dt=\int_c^{g(x)}\frac{2}{1-u^2}\,du$$ 가 성립한다.
      criteria:
      - 2.M3
    - id: 2b-4
      content: 그러므로 $(\beta^{-1}\circ\alpha)(\ln2)=\sqrt{f(\ln2)}=\sqrt{\dfrac23}$이다.
      criteria:
      - 2.A1
