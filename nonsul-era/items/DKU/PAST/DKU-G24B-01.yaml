stimuli:
- label: 가
  body: |-
    미분가능한 함수 $f(x)$에 대하여
    $$\int\frac{f'(x)}{f(x)}\,dx=\ln\lvert f(x)\rvert+C,\quad C\text{는 적분상수}$$
- label: 나
  body: |-
    미분가능한 함수 $f(x)$가 $f'(a)=0$이고 $x=a$의 좌우에서
    • $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극댓값
    • $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극솟값
    을 갖는다.
- label: 다
  body: |-
    미분가능한 함수 $g(x)$에 대하여 $g(x)=t$로 놓으면
    $$\int f(g(x))g'(x)\,dx=\int f(t)\,dt$$
- label: 라
  body: |-
    두 함수 $f(x)$, $g(x)$가 미분가능할 때
    $$\int f(x)g'(x)\,dx=f(x)g(x)-\int f'(x)g(x)\,dx$$
stem: |-
  [문제 1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  두 함수 $f(x)$와 $g(x)$를
  $$f(x)=\int_1^x\frac{2t}{t^2+3}\,dt,\quad g(x)=ax+\frac{8}{x^2+3}$$
  라 하자. (단, $a$는 상수)
subparts:
- id: '1'
  stem: '[논제 1] 곡선 $y=f(x)$가 $x$축과 만나는 두 점과 곡선 $y=f(x)$ 위의 점 $(t,f(t))$를 세 꼭짓점으로 하는 삼각형의 넓이가 $\ln\dfrac43$가 되는 상수 $t$의 값을 모두 구하시오.'
  points: 15
  depends_on: []
  answer:
    kind: set
    value: '{0, sqrt(21)/3, -sqrt(21)/3}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=\ln\frac{x^2+3}4$의 $x$절편은 $\pm1$이므로 밑변 $2$, 높이 $\lvert f(t)\rvert$.
    steps:
    - id: 1a
      content: $\left\lvert\ln\frac{t^2+3}4\right\rvert=\ln\frac43\Rightarrow t=0,\pm\frac{\sqrt{21}}3$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - $f(x)$를 먼저 구하자.
    - $x$축과 만나는 두 점은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: R24.pdf p.92~93 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: 먼저 $f(x)=\displaystyle\int_1^x\frac{2t}{t^2+3}\,dt=\ln(x^2+3)-\ln4=\ln\frac{x^2+3}4$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 곡선 $y=f(x)$가 $x$축과 만나는 점의 $x$좌표가 $-1,1$이므로 삼각형 밑변의 길이는 $2$이고 높이는 $\left\lvert\ln\dfrac{t^2+3}4\right\rvert$이다. 따라서 $$(\text{삼각형 넓이})=\left\lvert\ln\frac{t^2+3}4\right\rvert=\ln\frac43$$
      criteria:
      - 1.A1
    - id: 1b-3
      content: 에서 $\dfrac{t^2+3}4=\dfrac43$ 또는 $\dfrac34$이므로 $t=0,\ \dfrac{\sqrt{21}}3,\ -\dfrac{\sqrt{21}}3$이다.
      criteria:
      - 1.A1
