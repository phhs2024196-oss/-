- id: '2'
  stem: |-
    [논제 2] 다음 조건을 만족시키는 실수 $a$의 범위를 구하시오.

    함수 $g(x)=ax+\dfrac{8}{x^2+3}$은 $x=\alpha,\beta$ $(\alpha<\beta)$에서만 극값을 갖고, $g(\alpha)>g(\beta)$이다.
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: 0 < a < 1
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(\alpha)>g(\beta)$는 $\alpha$에서 극대, $\beta$에서 극소와 필요충분. $g'$의 개형(극댓값 $a+1$, 극솟값 $a-1$, $g'(0)=a$)에서 $x$축이 $y=a-1$과 $y=a$ 사이에 놓여야 한다.
    steps:
    - id: 2a
      content: $a-1<0<a\Rightarrow0<a<1$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $g'(x)=a-\frac{16x}{(x^2+3)^2}$의 개형은?
    - $y=g'(x)$와 $x$축이 두 번 만나되 어떤 순서로?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: R24.pdf p.93~94 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: 먼저 $g(x)$의 극값이 두 개이므로 $\alpha<\beta$일 때 “$g(\alpha)>g(\beta)$”는 “함수 $g(x)$가 $x=\alpha$에서 극댓값을 갖고, $x=\beta$에서 극솟값을 갖는다”와 필요충분조건이다. 함수 $g'(x)=a-\dfrac{16x}{(x^2+3)^2}$의 그래프의 개형을 그리자.
      criteria:
      - 2.M1
    - id: 2b-2
      content: $g''(x)=-\dfrac{16(x^2+3)^2-64x^2(x^2+3)}{(x^2+3)^4}=\dfrac{48(x^2-1)}{(x^2+3)^3}$이므로 $g'(x)$는 $x=-1$에서 극댓값 $a+1$, $x=1$에서 극솟값 $a-1$을 갖는다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |-
        한편 $g'(0)=a$이고 $x>0$이면 $g'(x)<a$, $x<0$이면 $g'(x)>a$, $\displaystyle\lim_{x\to\pm\infty}g'(x)=a$이므로 $y=g'(x)$의 그래프의 개형은 다음과 같다.

        [그림: $y=g'(x)$는 $(0,a)$를 지나는 감소 구간 $(-1,1)$ 사이에서 $x=-1$에서 극대(값 $a+1$), $x=1$에서 극소(값 $a-1$)이고, $x\to\pm\infty$일 때 직선 $y=a$에 가까워진다.]
      criteria:
      - 2.M2
    - id: 2b-4
      content: 그러므로 함수 $g(x)$가 $x=\alpha$에서 극대이고 $x=\beta$ $(\alpha<\beta)$에서 극소를 갖기 위해서는 제시문 (나)에 의해서 $x$축이 직선 $y=a-1$과 $y=a$ 사이에 놓여 있어야 한다. 따라서 $a-1<0<a$, 즉 $0<a<1$이다.
      criteria:
      - 2.A1
  # 채점기준 공식 공개 — R24.pdf p.92, 원 배점 분할 그대로
