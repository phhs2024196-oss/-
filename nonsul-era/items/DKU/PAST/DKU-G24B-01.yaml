- id: '3'
  stem: |-
    [논제 3] 실수 전체의 집합에서 미분가능한 함수 $h(x)$는 다음 조건을 만족시킨다.

    (1) $h(0)+g''(0)=f(-1)$
    (2) $h(1)+g(1)=g'(-1)$
    (3) $\displaystyle\int_0^1\frac{h'(x)}{x^2+3}\,dx=-1$

    정적분 $\displaystyle\int_0^{\frac\pi2}\frac{\sin2x\,h(\cos x)}{(3+\cos^2x)^2}\,dx$의 값을 구하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: -17/108
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 조건 (1)(2)에서 $h(0)=\frac{16}9$, $h(1)=-1$. $\cos x=u$로 치환한 뒤 $k(u)=\frac1{u^2+3}$로 부분적분한다.
    steps:
    - id: 3a
      content: $\int_0^1\frac{2uh(u)}{(u^2+3)^2}du=-\frac14h(1)+\frac13h(0)+\int_0^1\frac{h'(u)}{u^2+3}du=-\frac{17}{108}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
    hint_ladder:
    - $f(-1)$, $g(1)$, $g'(-1)$, $g''(0)$을 계산하자.
    - $\frac{2u}{(u^2+3)^2}$는 무엇의 도함수인가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: R24.pdf p.94~95 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: $g'(x)=a-\dfrac{16x}{(x^2+3)^2}$이고 $g''(x)=-\dfrac{16}{(x^2+3)^2}+\dfrac{64x^2}{(x^2+3)^3}$이므로 $f(-1)=0$, $g(1)=a+2$, $g'(-1)=a+1$, $g''(0)=-\dfrac{16}9$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 조건 (1)과 (2)에 의하여 $h(0)=\dfrac{16}9$, $h(1)=g'(-1)-g(1)=-1$이다.
      criteria:
      - 3.M1
    - id: 3b-3
      content: $\sin2x=2\sin x\cos x$이므로 $\cos x=u$라 하면 $$\int_0^{\frac\pi2}\frac{\sin2x\,h(\cos x)}{(3+\cos^2x)^2}\,dx=\int_0^{\frac\pi2}\frac{2\sin x\cos x\,h(\cos x)}{(3+\cos^2x)^2}\,dx=\int_0^1\frac{2u\,h(u)}{(u^2+3)^2}\,du$$ 이다.
      criteria:
      - 3.M2
    - id: 3b-4
      content: '여기서 $k(u)=\dfrac1{u^2+3}$이라고 하면 $k''(u)=-\dfrac{2u}{(u^2+3)^2}$이므로 부분적분을 이용하면 $$\int_0^1\frac{2u\,h(u)}{(u^2+3)^2}\,du=-\int_0^1k''(u)h(u)\,du=-\Big[k(u)h(u)\Big]_0^1+\int_0^1k(u)h''(u)\,du$$ $$=-k(1)h(1)+k(0)h(0)+\int_0^1\frac{h''(u)}{u^2+3}\,du=-\frac14h(1)+\frac13h(0)+\int_0^1\frac{h''(u)}{u^2+3}\,du=-\frac{17}{108}$$ 이다. (보충: $\frac14+\frac{16}{27}-1=-\frac{17}{108}$)'
      criteria:
      - 3.A1
