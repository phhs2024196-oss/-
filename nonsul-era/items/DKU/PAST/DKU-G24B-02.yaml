stimuli:
- label: 가
  body: 연속인 이계도함수를 갖는 함수 $f(x)$에 대하여 $f''(a)=0$이고, $x=a$의 좌우에서 $f''(x)$의 부호가 바뀌면 점 $(a,f(a))$는 곡선 $y=f(x)$의 변곡점이다.
- label: 나
  body: |-
    극한값 $\displaystyle\lim_{\Delta x\to0}\frac{f(a+\Delta x)-f(a)}{\Delta x}$가 존재하면 함수 $f(x)$는 $x=a$에서 미분가능하다고 하고 $x=a$에서의 미분계수 $f'(a)$는
    $$f'(a)=\lim_{\Delta x\to0}\frac{f(a+\Delta x)-f(a)}{\Delta x}=\lim_{x\to a}\frac{f(x)-f(a)}{x-a}$$
- label: 다
  body: |-
    미분가능한 함수 $f(x)$가 $f'(a)=0$이고 $x=a$의 좌우에서
    • $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고, 극댓값은 $f(a)$
    • $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고, 극솟값은 $f(a)$
    이다.
- label: 라
  body: |-
    두 함수 $y=f(u)$와 $u=g(x)$가 미분가능할 때 합성함수 $y=f(g(x))$의 도함수는
    $$y'=\{f(g(x))\}'=f'(g(x))g'(x)$$
- label: 마
  body: |-
    함수 $f(x)$가 $x=a$에서 극값을 갖고 $a$를 포함하는 어떤 열린구간에서 미분가능하면
    $$f'(a)=0$$
stem: '[문제 2] 다음 제시문을 읽고 질문에 답하시오. (45점)'
subparts:
- id: '1'
  stem: |-
    [논제 1] 최고차항의 계수가 음수인 이차함수 $f(x)$에 대하여 함수 $g(x)$를
    $$g(x)=f(x)e^x$$
    라 하자. 다음 조건을 만족시키는 $f(1)$의 최댓값을 구하시오.

    (1) 곡선 $y=g(x)$는 두 개의 변곡점 $(-5,g(-5))$, $(1,g(1))$을 갖는다.
    (2) 모든 $x>0$에 대하여 $g'(x)\le2$이다.
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: 3/E
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g''$의 두 근 $-5,1$에서 $f=a(x^2-7)$ ($a<0$). $g'\le2$를 $x>0$에서 $(x^2+2x-7)e^x\ge\frac2a$로 바꿔 최솟값 $-4e$를 쓴다.
    steps:
    - id: 1a
      content: $\frac2a\le-4e\Rightarrow-\frac1{2e}\le a<0$, $f(1)=-6a\le\frac3e$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - $g''(x)$의 형태는?
    - $m(x)=(x^2+2x-7)e^x$의 최솟값은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: R24.pdf p.99 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: $f(x)=ax^2+bx+c$ $(a<0)$라 하면 $g''(x)=\{ax^2+(4a+b)x+2a+2b+c\}e^x$이다. 조건 (1)에서 $g''(1)=g''(-5)=0$이므로 근과 계수의 관계로부터 $$\frac{4a+b}a=4,\qquad\frac{2a+2b+c}a=-5$$ 이므로 $b=0$이고 $c=-7a$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 $f(x)=a(x^2-7)$, $g(x)=a(x^2-7)e^x$이다. 또한 $x=-5,1$의 좌우에서 $g''(x)$의 부호가 바뀌므로 조건 (1)을 만족시킨다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: 조건 (2)에서 $x>0$일 때 $g'(x)\le2$이므로 $g'(x)=a(x^2+2x-7)e^x\le2$이다. 따라서 $x>0$일 때 $(x^2+2x-7)e^x\ge\dfrac2a$이다.
      criteria:
      - 1.M2
    - id: 1b-4
      content: 한편 $m(x)=(x^2+2x-7)e^x$라 하자. $m'(x)=(x+5)(x-1)e^x$에서 방정식 $m'(x)=0$의 해는 $x=1$ 또는 $x=-5$이다. $x>0$일 때 $m'(x)$는 $0<x<1$에서 음, $x>1$에서 양이므로 $m(x)$는 $x=1$에서 최솟값 $m(1)=-4e$를 가진다.
      criteria:
      - 1.M2
    - id: 1b-5
      content: 따라서 $\dfrac2a\le-4e$이고 $a$는 음수이므로 $-\dfrac1{2e}\le a<0$이다. $f(1)=-6a$이므로 $f(1)=-6a\le\dfrac3e$이다. 따라서 $f(1)$의 최댓값은 $a=-\dfrac1{2e}$일 때 $\dfrac3e$이다.
      criteria:
      - 1.A1
  # 채점기준 공식 공개 — R24.pdf p.99, 원 배점 분할 그대로
