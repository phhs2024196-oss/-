    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |-
    [논제 2] 최고차항의 계수가 양수 $a$인 삼차함수 $h(x)$에 대하여 함수 $k(x)$를
    $$k(x)=h(x)e^{h(x)}-2\int_0^xe^{h(t)}h'(t)\,dt$$
    라 하자. $h(x)$와 $k(x)$가 다음 조건을 만족시킬 때, $a$의 값을 구하시오.

    (1) 함수 $k(x)$는 $x=r,0,2$에서만 극값을 갖는다. (단, $r\ne0,2$)
    (2) $h(r)=3$
    (3) $h(2)\le1$
  points: 25
  depends_on: []
  answer:
    kind: value
    value: 27/16
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $k'(x)=h'(x)\{h(x)-1\}e^{h(x)}$. $h'=0$은 서로 다른 두 근을 가지며 이들이 $2$와 $r$이고 $h(0)=1$, $h-1=ax(x-2)^2$.
    steps:
    - id: 2a
      content: $h(x)=ax(x-2)^2+1$, $h'(x)=a(x-2)(3x-2)$ ⇒ $r=\frac23$, $h\left(\frac23\right)=3\Rightarrow a=\frac{27}{16}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.M4
      - 2.A1
    hint_ladder:
    - $k'(x)$를 구하면?
    - 극값점 $r,0,2$는 $h'=0$의 근과 $h=1$의 근 중 어느 것인가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: R24.pdf p.100~101 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: $k'(x)=h'(x)\{h(x)-1\}e^{h(x)}$이고 $k'(x)=0$에서 $h'(x)=0$ 이거나 $h(x)=1$이다. $h'(x)=0$이 중근을 갖거나 근을 갖지 않는 경우, $h(x)=1$은 하나의 근을 갖는다. 이것은 조건 (1)에 모순이다. 따라서 방정식 $h'(x)=0$은 서로 다른 두 근을 갖는다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: '방정식 $h''(x)=0$의 두 근이 $0,2$인 경우, $0,r$인 경우, $2,r$인 경우로 나누어 생각하자. (i) 두 근이 $0,2$인 경우: $h(r)=1$이므로 조건 (2)에 모순이다. (ii) 두 근이 $0,r$인 경우: $r<0$일 때 조건 (1)에 의하여 $h(0)=1$이므로 조건 (3)에 모순이고, $r>0$일 때 조건 (3)에 모순이다.'
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 두 근은 $2$와 $r$이다. (이때 $h(0)=1$) 이 경우도 $0,r,2$의 크기 비교를 위해 $r<0$인 경우와 $0<r<2$, $r>2$인 경우로 나누어 생각하자. $2<r$일 때 $1\ge h(2)>h(r)=3$이므로 모순이다. $r<0$일 때 $h(0)=1$이고 $h(2)$는 극솟값이고 $h(x)=1$의 해가 $3$개이므로 조건 (1)에 모순이다. 그러므로 $0<r<2$이다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: $h(x)-1=0$의 근은 $x=0$, $2$(중근)이므로 $$h(x)-1=ax(x-2)^2\qquad\cdots\cdots\ ③$$ 이다.
      criteria:
      - 2.M3
    - id: 2b-5
      content: $h'(x)=a(x-2)(3x-2)$이므로 $r=\dfrac23$이다.
      criteria:
      - 2.M4
    - id: 2b-6
      content: $h\left(\dfrac23\right)=3$이므로 ③으로부터 $a=\dfrac{27}{16}$이다.
      criteria:
      - 2.A1
