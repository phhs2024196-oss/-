intent: 곡선의 변곡점을 이해하고 활용할 수 있는지, 함수의 극대·극소를 활용해 그래프의 개형을 이해하는지를 본다. $g=f(x)e^x$의 이계도함수 영점으로 이차함수를 정하고 $g'\le2$ 조건에서 $f(1)$의 최댓값을, $k'(x)=h'(x)\{h(x)-1\}e^{h(x)}$의 부호 변화로 삼차함수 $h$를 구한다.
key_idea: '[논제 1] $g''''=\{ax^2+(4a+b)x+2a+2b+c\}e^x$의 두 근 $-5,1$에서 $f=a(x^2-7)$, $g''\le2$를 $x>0$에서 $m(x)=(x^2+2x-7)e^x\ge\frac2a$로 바꿔 $m$의 최솟값 $-4e$를 쓴다. [논제 2] $k''=h''(h-1)e^h$이므로 $h''=0$의 두 근과 $h=1$의 근으로 극값점 $r,0,2$를 가르고 경우를 나눈다.'
stuck: '[논제 1]에서 $g''''$의 두 근과 근과 계수의 관계로 $b=0$, $c=-7a$를 구하는 것, [논제 2]에서 $k''(x)=h''(x)\{h(x)-1\}e^{h(x)}$를 얻고 조건 (1)~(3)으로 $r,0,2$의 배치를 경우 분류하는 것'
