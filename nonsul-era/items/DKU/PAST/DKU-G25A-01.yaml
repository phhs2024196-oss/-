intent: 대칭성을 가진 함수의 정적분을 구할 수 있는지, 접선의 방정식과 두 직선의 수직 조건을 이해하는지, 삼차함수의 그래프에 접하는 직선의 성질을 이해하는지를 본다. $g=\int_1^xf$가 $x=-2,0,2$에서 극값을 가져 $f(x)=ax(x^2-4)$이고, 이 $f$에 대해 $g(-2)$, 수직인 두 접선, 한 점에서 그은 두 접선의 수직 조건을 푼다.
key_idea: $g'=f$의 부호가 $x=-2,0,2$에서 바뀌므로 $f(x)=ax(x^2-4)$. [논제 1] $f$가 기함수이므로 $\int_0^2f=\int_0^{-2}f$. [논제 2] $f'(1)=-a$, $m$의 기울기 $\frac1a$. [논제 3] 변곡점 $(0,0)$의 접선이 $x$축 위의 점 $(2,0)$을 지나 $P(2,0)$이고 다른 접점 $x=-1$.
stuck: '[논제 1]에서 기함수의 대칭성으로 $\int_0^2f=\int_0^{-2}f$를 쓰는 것, [논제 3]에서 점 $P$를 지나는 접선이 두 개뿐이라는 조건을 ''접선 하나는 $P$에서 접한다''로 해석해 $P(2,0)$을 구하는 것'
