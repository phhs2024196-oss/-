stimuli:
- label: 가
  body: |-
    임의의 세 실수 $a,b,c$를 포함하는 구간에서 함수 $f(x)$가 연속일 때
    $$\int_a^cf(x)\,dx+\int_c^bf(x)\,dx=\int_a^bf(x)\,dx$$
- label: 나
  body: 두 직선 $y=mx+n$, $y=m'x+n'$에 대하여 두 직선이 서로 수직이면 $mm'=-1$이다.
- label: 다
  body: |-
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
stem: |-
  [문제 1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  최고차항의 계수가 양수 $a$인 삼차함수 $f(x)$에 대하여 $g(x)=\displaystyle\int_1^xf(t)\,dt$는 $x=-2,0,2$에서 극값을 갖는다.
subparts:
- id: '1'
  stem: '[논제 1] $\displaystyle\int_0^2f(t)\,dt=-2-g(0)$일 때, $g(-2)$의 값을 구하시오.'
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '-2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f$는 원점대칭이므로 $\int_0^2f=\int_0^{-2}f$.
    steps:
    - id: 1a
      content: $-2-g(0)=\int_0^{-2}f=g(-2)-g(0)\Rightarrow g(-2)=-2$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - $g'(x)=f(x)$의 영점은?
    - $f$가 기함수이면 $\int_0^2f$와 $\int_0^{-2}f$의 관계는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: R25.pdf p.80 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: '삼차함수 $f(x)=ax(x^2-4)$가 원점에 대칭이므로 $$-2-g(0)=\int_0^2f(t)\,dt=\int_0^{-2}f(t)\,dt$$ 이다. (보충: $g''(x)=f(x)$가 $x=-2,0,2$에서 부호가 바뀌므로 $f(x)=ax(x+2)(x-2)$)'
      criteria:
      - 1.M1
    - id: 1b-2
      content: $$\int_0^{-2}f(t)\,dt=\int_1^{-2}f(t)\,dt-\int_1^0f(t)\,dt=g(-2)-g(0)$$ 이므로 $-2-g(0)=g(-2)-g(0)$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 따라서 $g(-2)=-2$이다.
      criteria:
      - 1.A1
  # 채점기준 공식 공개 — R25.pdf p.79, 원 배점 분할 그대로
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $\int_0^2f(t)\,dt=\int_0^{-2}f(t)\,dt$임을 제시했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1a
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: $\int_0^{-2}f(t)\,dt=\int_1^{-2}f(t)\,dt-\int_1^0f(t)\,dt$임을 제시했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
      - 1a
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $g(-2)=-2$를 제시했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |-
    [논제 2] 두 직선 $\ell$과 $m$이 다음 조건을 만족시킨다.

    (1) 직선 $\ell$은 곡선 $y=f(x)$ 위의 점 $\mathrm{A}(1,f(1))$에서의 접선이다.
    (2) 직선 $\ell$과 $m$은 점 $\mathrm{A}(1,f(1))$에서 만나고 서로 수직이다.

    직선 $m$의 $x$절편이 $13$일 때, $a$의 값을 구하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(1)=-a$이므로 $m$의 기울기는 $\frac1a$.
    steps:
    - id: 2a
      content: $m:\ y=\frac1a(x-1)-3a$가 $(13,0)$을 지나므로 $a=2$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $f'(1)$은?
    - $\ell\perp m$이면 $m$의 기울기는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: R25.pdf p.80 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: $f(x)=ax(x^2-4)=ax^3-4ax$이므로 $f'(x)=3ax^2-4a$이고 $f'(1)=-a$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서 직선 $m$은 점 $\mathrm{A}$를 지나고 직선 $\ell$에 수직이므로 직선 $m$의 방정식은 $y=\dfrac1a(x-1)-3a$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 직선 $m$이 점 $(13,0)$을 지나고 $a$가 양수이므로 $0=\dfrac{12}a-3a$에서 $a=2$이다.
      criteria:
      - 2.A1
  # 채점기준 공식 공개 — R25.pdf p.79, 원 배점 분할 그대로
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $f'(1)=-a$를 제시했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2a
    - id: 2.M2
      mark_type: M
      points: 10
      evidence: $m$의 방정식 $y=\frac1a(x-1)-3a$를 제시했다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
      - 2a
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: $a=2$를 제시했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
      - 2a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |-
    [논제 3] 좌표평면 위의 점 $\mathrm{P}$가 다음 조건을 만족시킨다.

    (1) 점 $\mathrm{P}$는 $x$축 위에 있다. (단, 점 $\mathrm{P}$의 $x$좌표는 양수)
    (2) 곡선 $y=f(x)$의 접선 중 점 $\mathrm{P}$를 지나는 접선은 두 직선 $\ell'$, $m'$뿐이다.

    직선 $\ell'$과 $m'$이 서로 수직일 때, $a$의 값을 구하시오.
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: sqrt(2)/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 변곡점이 $x$축 위에 있으므로 조건 (2)를 만족하는 $\mathrm P$는 $(2,0)$뿐이고 한 접선은 $\mathrm P$에서의 접선. 다른 접점의 $x$좌표는 $-1$.
    steps:
    - id: 3a
      content: $f'(-1)f'(2)=(-a)(8a)=-1\Rightarrow a=\frac{\sqrt2}4$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
    hint_ladder:
    - $\mathrm P(2,0)$을 지나는 다른 접선의 접점 $b$는 어떤 방정식을 만족하는가?
    - 두 접선의 기울기의 곱은?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: R25.pdf p.80 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: 곡선 $y=f(x)$ 위의 각 점에서 접선을 그어서 $x$절편을 살펴보면, 곡선 $y=f(x)$의 변곡점이 $x$축 위에 있으므로 주어진 조건 (2)를 만족시키는 점 $\mathrm P$는 오로지 $\mathrm P(2,0)$뿐이고 이 경우 두 접선 중 하나는 점 $\mathrm P$에서 곡선 $y=f(x)$에 접한다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 곡선 $y=f(x)$와 점 $\mathrm P$에서 접하는 직선을 $\ell'$이라 하고, 점 $\mathrm P$를 지나고 곡선 $y=f(x)$와 점 $\mathrm P$가 아닌 점 $\mathrm{B}(b,f(b))$에서 접하는 직선을 $m'$이라 하자. 직선 $m'$의 방정식은 $$y=f'(b)(x-b)+f(b)=(3ab^2-4a)(x-b)+ab^3-4ab$$ 이고, 직선 $m'$은 점 $\mathrm P(2,0)$을 지나므로 $6ab^2-2ab^3-8a=0$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: $(b+1)(b-2)^2=0$에서 $b=-1$, $b=2$이고 $b\ne2$이므로 $b=-1$이다. 즉 점 $\mathrm B(-1,f(-1))$에서 직선 $m'$과 곡선 $y=f(x)$는 접한다.
      criteria:
      - 3.M2
    - id: 3b-4
      content: 두 접선 $\ell',m'$은 서로 수직이므로 $-1=f'(-1)f'(2)=(3a-4a)(12a-4a)$이고 $a$가 양수이므로 $a=\dfrac{\sqrt2}4$이다.
      criteria:
      - 3.A1
