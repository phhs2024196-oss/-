intent: 치환적분법으로 정적분 값을 구할 수 있는지, 함수의 그래프 개형을 그려 곡선과 직선의 위치 관계를 판단할 수 있는지를 본다. $f(x)=\frac{\cos x}{2+\sin x}$에 대해 $\frac{2\sin x+1}{2\cos x+\sin x\cos x}=-\frac{f'(x)}{f(x)}$로 $f(a)$를 구하고, $\lvert3f(x)-k\rvert=1$의 근의 개수 조건에서 $k$의 범위를 구한다.
key_idea: '[논제 1] 피적분함수가 $-\frac{f''(x)}{f(x)}$이므로 $\ln\frac{\lvert f(0)\rvert}{\lvert f(a)\rvert}=1$. [논제 2] $f''(x)=-\frac{2\sin x+1}{(2+\sin x)^2}$로 $\left[\frac\pi2,2\pi\right]$에서 개형을 그리고, $\lvert3f(x)-k\rvert=1$을 $f(x)=\frac{k-1}3$, $f(x)=\frac{k+1}3$의 근의 개수 합 $2$로 바꾼다.'
stuck: '[논제 1]에서 피적분함수가 $-\frac{f''(x)}{f(x)}$임을 알아보는 것, [논제 2]에서 두 수평선 $y=\frac{k\mp1}3$을 동시에 움직이며 교점 개수의 합을 분류하는 것(간격 $\frac23$)'
