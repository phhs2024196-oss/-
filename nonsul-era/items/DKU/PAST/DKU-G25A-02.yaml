- id: '2'
  stem: |-
    [논제 2] 다음 조건을 만족시키는 실수 $k$의 값과 범위를 모두 구하시오.

    $\dfrac\pi2\le x\le2\pi$에서 곡선 $y=\lvert3f(x)-k\rvert$와 직선 $y=1$이 만나는 점의 개수는 $2$이다.
  points: 25
  depends_on: []
  answer:
    kind: expression
    value: -1 - sqrt(3) < k <= -1 or k == 1 - sqrt(3) or -1 + sqrt(3) < k <= 1 or 5/2 <= k < 1 + sqrt(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\left[\frac\pi2,2\pi\right]$에서 $f$는 $x=\frac76\pi$에서 극솟값 $-\frac{\sqrt3}3$, $x=\frac{11}6\pi$에서 극댓값 $\frac{\sqrt3}3$. $\lvert3f-k\rvert=1\iff f=\frac{k-1}3$ 또는 $\frac{k+1}3$이므로 두 수평선과의 교점 개수 합이 $2$인 경우를 분류한다.
    steps:
    - id: 2a
      content: $-1-\sqrt3<k\le-1$, $k=1-\sqrt3$, $-1+\sqrt3<k\le1$, $\frac52\le k<1+\sqrt3$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $f'(x)=0$인 $x$는?
    - 두 직선 $y=\frac{k-1}3$, $y=\frac{k+1}3$ 사이의 거리는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: R25.pdf p.84~85 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: 구간 $\left[\frac\pi2,2\pi\right]$에서 $y=f(x)$의 그래프의 개형을 구하자. $f'(x)=\dfrac{-(2+\sin x)\sin x-\cos^2x}{(2+\sin x)^2}=-\dfrac{2\sin x+1}{(2+\sin x)^2}=0$으로부터 $x=\dfrac76\pi$일 때 극솟값 $-\dfrac{\sqrt3}3$을 갖고, $x=\dfrac{11}6\pi$일 때 극댓값 $\dfrac{\sqrt3}3$을 갖는다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |-
        또한 $f'(x)>0$인 경우 $2\sin x+1<0$, 즉 $\dfrac76\pi<x<\dfrac{11}6\pi$에서 $f(x)$는 증가, $f'(x)<0$인 경우 $2\sin x+1>0$, 즉 $\dfrac\pi2\le x<\dfrac76\pi$ 또는 $\dfrac{11}6\pi<x\le2\pi$에서 $f(x)$는 감소한다.

        [그림: $y=f(x)$는 $(\frac\pi2,0)$에서 출발해 $x=\frac76\pi$에서 최솟값 $-\frac{\sqrt3}3$, $x=\frac{11}6\pi$에서 최댓값 $\frac{\sqrt3}3$을 거쳐 $(2\pi,\frac12)$에서 끝난다.]
      criteria:
      - 2.M2
    - id: 2b-3
      content: $\lvert3f(x)-k\rvert=1$은 $f(x)=\dfrac{k-1}3$, $f(x)=\dfrac{k+1}3$이므로 곡선 $y=\lvert3f(x)-k\rvert$와 직선 $y=1$의 교점의 개수가 $2$인 경우는 곡선 $y=f(x)$와 직선 $y=\dfrac{k-1}3$의 교점과 곡선 $y=f(x)$와 직선 $y=\dfrac{k+1}3$의 교점의 합이 $2$인 경우와 같다.
      criteria:
      - 2.A1
    - id: 2b-4
      content: '두 직선 $y=\dfrac{k-1}3$와 $y=\dfrac{k+1}3$의 거리 $d$가 $\dfrac23$이고 $d=\dfrac23>\dfrac{\sqrt3}3$, $d=\dfrac23>\dfrac12$임에 주목하여 두 직선을 동시에 움직이면서 교점의 개수의 합이 $2$인 경우를 살펴보면 구하는 $k$의 값의 범위는 (ⅰ) $-\dfrac{\sqrt3}3<\dfrac{k+1}3\le0$인 경우: $-1-\sqrt3<k\le-1$, (ⅱ) $\dfrac{k-1}3=-\dfrac{\sqrt3}3$인 경우: $k=1-\sqrt3$, (ⅲ) $\dfrac{\sqrt3}3-\dfrac23<\dfrac{k-1}3\le0$인 경우: $-1+\sqrt3<k\le1$, (ⅳ) $\dfrac12\le\dfrac{k-1}3<\dfrac{\sqrt3}3$인 경우: $\dfrac52\le k<1+\sqrt3$이다.'
      criteria:
      - 2.A1
    - id: 2b-5
      content: 요약하면 $-1-\sqrt3<k\le-1,\ \ 1-\sqrt3,\ \ -1+\sqrt3<k\le1,\ \ \dfrac52\le k<1+\sqrt3$이다.
      criteria:
      - 2.A1
