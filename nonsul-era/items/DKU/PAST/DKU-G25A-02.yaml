stimuli:
- label: 가
  body: $\displaystyle\int\frac1x\,dx=\ln\lvert x\rvert+C$ (단, $C$는 적분상수)
- label: 나
  body: |-
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때 도함수 $g'(t)$가 $\alpha,\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
- label: 다
  body: |-
    미분가능한 함수 $f(x)$가 $f'(a)=0$이고 $x=a$의 좌우에서
    • $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고, 극댓값은 $f(a)$
    • $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고, 극솟값은 $f(a)$
stem: |-
  [문제 2] 다음 제시문을 읽고 질문에 답하시오. (45점)

  $f(x)=\dfrac{\cos x}{2+\sin x}$라 하자.
subparts:
- id: '1'
  stem: |-
    [논제 1] $0<a<\dfrac\pi2$에 대하여
    $$\int_0^a\frac{2\sin x+1}{2\cos x+\sin x\cos x}\,dx=1$$
    일 때, $f(a)$의 값을 구하시오. (단, $a$는 상수)
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: exp(-1)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 피적분함수는 $\frac{2\sin x+1}{(2+\sin x)^2}\times\frac{2+\sin x}{\cos x}=-\frac{f'(x)}{f(x)}$.
    steps:
    - id: 1a
      content: $1=\Big[-\ln\lvert f(x)\rvert\Big]_0^a=\ln\frac{\lvert f(0)\rvert}{\lvert f(a)\rvert}=\ln\frac1{2f(a)}\Rightarrow f(a)=\frac1{2e}$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 분모를 $\cos x(2+\sin x)$로 묶어 보자.
    - $f'(x)$를 구하면?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: R25.pdf p.83 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: '치환적분법에 의하여 $$1=\int_0^a\frac{2\sin x+1}{2\cos x+\sin x\cos x}dx=\int_0^a\frac{2\sin x+1}{(2+\sin x)^2}\times\frac{2+\sin x}{\cos x}dx=-\int_0^a\frac{f''(x)}{f(x)}dx=\Big[-\ln\lvert f(x)\rvert\Big]_0^a=\ln\frac{\lvert f(0)\rvert}{\lvert f(a)\rvert}$$ 이다. (보충: $f''(x)=\dfrac{-(2+\sin x)\sin x-\cos^2x}{(2+\sin x)^2}=-\dfrac{2\sin x+1}{(2+\sin x)^2}$)'
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f(0)=\dfrac12$이므로 $\ln\dfrac1{2f(a)}=1$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 따라서 $f(a)=\dfrac1{2e}$이다.
      criteria:
      - 1.A1
