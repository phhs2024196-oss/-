- id: '3'
  stem: '[논제 3] 실수 $k$에 대하여, $x$축에 평행한 직선 $y=k$와 곡선 $y=h(x)$의 교점의 개수를 $n(k)$라 하자. 함수 $n(k)$가 $k=0$과 $k=1$에서만 불연속일 때, $h(4)$의 값을 구하시오.'
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '9'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h$가 $x=x_0$에서 극값을 가지면 $n(k)$는 $k=h(x_0)$에서 불연속. 극값이 $3$개(극솟값 $0$ 두 개, 극댓값 $1$)이므로 $h=(x-1)^2(x-s)^2$.
    steps:
    - id: 3a
      content: 극댓값 $h\left(\frac{s+1}2\right)=\left(\frac{s-1}2\right)^4=1\Rightarrow s=3,-1$, $h(-1)\ne0$이므로 $s=3$, $h(4)=9$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
    hint_ladder:
    - $n(k)$가 불연속인 $k$는 $h$의 무엇에 대응하는가?
    - $k=0$에서 불연속이고 최고차항 계수가 $1$이면 $h$의 꼴은?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: R25.pdf p.90 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: |-
        함수 $h(x)$가 $x=x_0$에서 극값을 가지면 함수 $n(k)$는 $k=h(x_0)$에서 불연속이다. 사차함수의 그래프의 개형과 주어진 조건에 의하여 $h(x)$의 극값은 $3$개이고, 세 극값 중 극솟값이 동일하다.

        [그림: $y=h(x)$는 $x=1$과 $x=s$에서 극솟값 $0$, 그 사이에서 극댓값 $1$을 갖는 W자형 사차함수 그래프이다.]
      criteria:
      - 3.M1
    - id: 3b-2
      content: $n(k)$가 특히 $k=0$에서 불연속이고 $h(x)$의 최고차항의 계수가 $1$이므로 $h(x)=(x-1)^2(x-s)^2$의 꼴이고 ($s$는 상수), $h(x)$는 $x=\dfrac{s+1}2$에서 극댓값을 갖는다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: 또한 $n(k)$가 $k=1$에서 불연속이므로 $h(x)$는 $x=\dfrac{s+1}2$에서 극댓값 $1$을 갖는다. 따라서 $$h\left(\frac{s+1}2\right)=\left(\frac{s-1}2\right)^4=1$$ 에서 $s=3$ 또는 $s=-1$이다.
      criteria:
      - 3.M3
    - id: 3b-4
      content: $h(-1)\ne g(0)=0$이므로 $h(x)=(x-1)^2(x-3)^2$이고 $h(4)=9$이다.
      criteria:
      - 3.A1
