- id: '2'
  stem: '[논제 2] $\displaystyle\int_{-1}^1\left[\ln\left(\lvert g''(t)\rvert+1\right)\right]^2dt$의 값을 구하시오.'
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: 3*log(2)**2 - 4*log(2) + 2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $t\ge\frac12$, $t\le-\frac12$에서의 $g$를 구해 $g'$를 구간별로 쓰고, 원점대칭을 이용해 $2\int_0^{1/2}\{\ln(2t+1)\}^2dt+2\int_{1/2}^1(\ln2)^2dt$를 계산한다.
    steps:
    - id: 2a
      content: $2\int_0^{1/2}\{\ln(2t+1)\}^2dt=\int_1^2(\ln u)^2du=2(\ln2)^2-4\ln2+2$, 합은 $3(\ln2)^2-4\ln2+2$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $t\ge\frac12$일 때 $g(t)$는?
    - $\int(\ln u)^2du$는 부분적분 몇 번?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: R25.pdf p.89~90 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: '[논제 1]과 마찬가지 방법으로 $t\ge\dfrac12$일 때, $x\ge t$이면 $f(x)=x^2+x-t=\left(x+\dfrac12\right)^2-\dfrac14-t$의 최솟값은 $f(t)=t^2$이고, $x\le t$이면 $f(x)=x^2-x+t=\left(x-\dfrac12\right)^2-\dfrac14+t$의 최솟값은 $f\left(\dfrac12\right)=t-\dfrac14$이다. $t^2\ge t-\dfrac14$이므로 $f(x)$의 최솟값은 $t-\dfrac14$이다. 따라서 $g(t)=t-\dfrac14$이다.'
      criteria:
      - 2.M1
    - id: 2b-2
      content: $t\le-\dfrac12$일 때, $-t\ge\dfrac12$이므로 $f(x)$의 최솟값은 $-t-\dfrac14$이다. 따라서 $g(t)=-t-\dfrac14$이다. 정리하면 $$g(t)=\begin{cases}-t-\frac14&\left(t\le-\frac12\right)\\t^2&\left(-\frac12<t<\frac12\right)\\t-\frac14&\left(t\ge\frac12\right)\end{cases}\quad\text{이고}\quad g'(t)=\begin{cases}-1&\left(t\le-\frac12\right)\\2t&\left(-\frac12<t<\frac12\right)\\1&\left(t\ge\frac12\right)\end{cases}$$ 이다.
      criteria:
      - 2.M1
      - 2.M2
    - id: 2b-3
      content: 함수 $g'(t)$는 원점에 대칭이므로 $$\int_{-1}^1\{\ln(\lvert g'(t)\rvert+1)\}^2dt=2\int_0^{\frac12}\{\ln(2t+1)\}^2dt+2\int_{\frac12}^1(\ln2)^2dt$$ 이다.
      criteria:
      - 2.A1
    - id: 2b-4
      content: '치환적분법과 부분적분법(2회)을 활용하면 $$2\int_0^{\frac12}\{\ln(2t+1)\}^2dt=\int_1^2(\ln u)^2du=2(\ln2)^2-4\ln2+2$$ 이므로 $$\int_{-1}^1\{\ln(\lvert g''(t)\rvert+1)\}^2dt=3(\ln2)^2-4\ln2+2$$ 이다. (보충: $2\int_{\frac12}^1(\ln2)^2dt=(\ln2)^2$)'
      criteria:
      - 2.A1
