intent: 절댓값이 포함된 함수의 최솟값을 구할 수 있는지, 치환적분법과 부분적분법을 활용할 수 있는지, 사차함수의 그래프에서 극값의 위치를 파악할 수 있는지를 본다. $f(x)=x^2+\lvert x-t\rvert$의 최솟값 $g(t)$를 구간별로 구하고, $\int_{-1}^1\{\ln(\lvert g'(t)\rvert+1)\}^2dt$를 치환·부분적분으로 구하며, $n(k)$의 불연속점 조건으로 $h(x)=(x-1)^2(x-s)^2$를 결정한다.
key_idea: '[논제 1] $f(x)$는 $x\ge t$, $x\le t$로 나눠 각 구간의 최솟값이 $f(t)=t^2$. [논제 2] $t\ge\frac12$이면 $g=t-\frac14$, $t\le-\frac12$이면 $g=-t-\frac14$, $\lvert t\rvert<\frac12$이면 $g=t^2$. $\ln(2t+1)$ 제곱의 적분은 $u=2t+1$ 치환 후 부분적분 두 번. [논제 3] 불연속점 $0,1$은 극솟값 $0$(2개)과 극댓값 $1$이므로 $h=(x-1)^2(x-s)^2$.'
stuck: '[논제 1]에서 $x\ge t$, $x\le t$로 나누어 이차함수의 최솟값을 구하는 것, [논제 2]에서 $g''$의 구간별 값과 대칭성, [논제 3]에서 $n(k)$의 불연속점이 $h$의 극값과 일치함을 알아보는 것'
