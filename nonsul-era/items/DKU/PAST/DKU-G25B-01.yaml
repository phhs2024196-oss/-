stimuli:
- label: 가
  body: |-
    함수 $f(x)$가 임의의 세 실수 $a,b,c$를 포함하는 닫힌구간에서 연속일 때,
    $$\int_a^cf(x)\,dx+\int_c^bf(x)\,dx=\int_a^bf(x)\,dx$$
- label: 나
  body: |-
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때 도함수 $g'(t)$가 $\alpha,\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
- label: 다
  body: |-
    두 함수 $f(x)$, $g(x)$가 미분가능하고 $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)g'(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf'(x)g(x)\,dx$$
- label: 라
  body: |-
    함수 $f(x)$가 실수 $a$에 대하여 다음 조건을 모두 만족시킬 때, $f(x)$는 $x=a$에서 연속이라고 한다.
    (ⅰ) 함수 $f(x)$는 $x=a$에서 정의되어 있다.
    (ⅱ) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재한다.
    (ⅲ) $\displaystyle\lim_{x\to a}f(x)=f(a)$
    함수 $f(x)$가 $x=a$에서 연속이 아닐 때, $f(x)$는 $x=a$에서 불연속이라고 한다.
stem: |-
  [문제 1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  실수 $t$에 대하여 실수 전체의 집합에서 정의된 함수 $f(x)=x^2+\lvert x-t\rvert$의 최솟값을 $g(t)$라 하자.
  사차함수 $h(x)$는 최고차항의 계수가 $1$이고, $h(1)=0$, $h(-1)\ne g(0)$이다.
subparts:
- id: '1'
  stem: '[논제 1] $-\dfrac12<t<\dfrac12$일 때, $g(t)$를 구하시오.'
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: t**2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x\ge t$, $x\le t$로 나누어 각각 이차함수의 최솟값을 구한다.
    steps:
    - id: 1a
      content: 두 경우 모두 $x=t$에서 최솟값 $f(t)=t^2$이므로 $g(t)=t^2$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 절댓값을 $x$와 $t$의 대소로 풀면?
    - 각 구간의 꼭짓점이 구간 안에 있는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: R25.pdf p.89 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: $-\dfrac12<t<\dfrac12$이므로 $x\ge t$이면 $f(x)=x^2+x-t=\left(x+\dfrac12\right)^2-\dfrac14-t$는 $x=t$에서 최솟값 $f(t)=t^2$을 갖는다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $x\le t$이면 $f(x)=x^2-x+t=\left(x-\dfrac12\right)^2-\dfrac14+t$는 $x=t$에서 최솟값 $f(t)=t^2$을 갖는다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 그러므로 두 경우 모두 $f(x)$의 최솟값은 $f(t)=t^2$이다. 따라서 $g(t)=t^2$이다.
      criteria:
      - 1.A1
