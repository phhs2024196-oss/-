stimuli:
- label: 가
  body: |-
    함수 $y=f(x)$의 정의역에 속하는 모든 $x$에 대하여
    $$f(x+p)=f(x)$$
    를 만족시키는 $0$이 아닌 상수 $p$가 존재할 때, 함수 $y=f(x)$를 주기함수라 하고 상수 $p$ 중에서 최소인 양수를 그 함수의 주기라고 한다.
- label: 나
  body: |-
    함수 $f(x)$가 $a,b$를 포함하는 열린구간에서 연속이고, $f(x)$의 한 부정적분을 $F(x)$라 하면 $f(x)$의 $a$에서 $b$까지의 정적분은
    $$\int_a^bf(x)\,dx=\Big[F(x)\Big]_a^b=F(b)-F(a)$$
stem: |-
  [문제 2] 다음 제시문을 읽고 질문에 답하시오. (45점)

  자연수 $n$에 대하여 $2(n-1)\le x<2n$일 때
  $$f(x)=\sin(n\pi x)$$
  라 하자.
subparts:
- id: '1'
  stem: '[논제 1] $\displaystyle\int_0^tf(x)\,dx=\dfrac1{6\pi}$을 만족시키는 실수 $t$의 최댓값을 구하시오. (단, $0\le t\le6$)'
  points: 20
  depends_on: []
  answer:
    kind: value
    value: 53/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\int_0^4f=0$이므로 $[4,6]$에서 $\int_4^t\sin3\pi x\,dx=\frac1{6\pi}$을 풀면 $\cos3\pi t=\frac12$.
    steps:
    - id: 1a
      content: $[4,6]$에서 $t=\frac{37}9,\frac{41}9,\frac{43}9,\frac{47}9,\frac{49}9,\frac{53}9$ 중 최대 $\frac{53}9$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 어느 구간에서 보면 되는가?
    - $\cos3\pi t=\frac12$의 해는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: R25.pdf p.94 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: 먼저 닫힌구간 $[4,6]$에서 주어진 조건을 만족하는 $t$를 찾아보자. $\displaystyle\int_0^4f(x)\,dx=0$이므로 $$\frac1{6\pi}=\int_0^tf(x)\,dx=\int_4^t\sin(3\pi x)\,dx=\Big[-\frac1{3\pi}\cos(3\pi x)\Big]_4^t$$ 이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 즉 닫힌구간 $[4,6]$에서 $\cos3\pi t=\dfrac12$을 만족시키는 $t$의 값은 $\dfrac{37}9,\ \dfrac{41}9,\ \dfrac{43}9,\ \dfrac{47}9,\ \dfrac{49}9,\ \dfrac{53}9$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 그러므로 닫힌구간 $[0,6]$에서 주어진 조건을 만족시키는 $t$의 최댓값은 $\dfrac{53}9$이다.
      criteria:
      - 1.A1
