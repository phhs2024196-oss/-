intent: 삼각함수가 포함된 방정식의 해를 정적분을 이용해 구할 수 있는지, 정적분의 개념을 이해하여 삼각함수 문제에 활용할 수 있는지를 본다. $2(n-1)\le x<2n$에서 $f(x)=\sin(n\pi x)$인 구간별 정의 함수의 정적분 $\int_0^tf$가 특정 값이 되는 $t$의 최댓값과 $\int_0^kf=0$인 $k$의 개수가 $18$이 되는 $m$의 범위를 구한다.
key_idea: 각 구간 $[2(n-1),2n)$에서 정적분 $\int_{2(n-1)}^{2n}\sin(n\pi x)dx=0$이므로 $\int_0^kf$는 그 구간에서 $\frac{1-\cos(n\pi k)}{n\pi}$로 쓰인다. [논제 1] $[4,6]$에서 $\cos3\pi t=\frac12$의 최대근. [논제 2] $0\le k<10$에서 근이 $1+2+3+4+5=15$개이므로 $10\le k\le m$에서 $3$개가 되어야 한다.
stuck: '[논제 1]에서 $\int_0^4f=0$을 쓰고 $[4,6]$에서만 보면 되는 것, [논제 2]에서 구간 $[2(n-1),2n)$마다 근의 개수가 $n$임을 세고 $n=6$ 구간($10\le k<12$)의 근을 나열하는 것'
