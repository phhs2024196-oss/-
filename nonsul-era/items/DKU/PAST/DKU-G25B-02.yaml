- id: '2'
  stem: |-
    [논제 2] 다음 조건을 만족시키는 실수 $m$의 값의 범위를 구하시오.

    $0\le k\le m$이고 $\displaystyle\int_0^kf(x)\,dx=0$인 실수 $k$의 개수가 $18$이다.
  points: 25
  depends_on: []
  answer:
    kind: expression
    value: 32/3 <= m < 11
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $0\le k<10$에서 근은 $1+2+3+4+5=15$개이므로 $10\le k\le m$에서 $\int_{10}^k\sin6\pi x\,dx=0$인 $k$가 $3$개이어야 한다.
    steps:
    - id: 2a
      content: $10\le k<12$의 근 $10,10+\frac13,10+\frac23,11,\dots$에서 $3$개이려면 $\frac{32}3\le m<11$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - 각 구간 $[2(n-1),2n)$의 근의 개수는?
    - $n=6$ 구간의 근은?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: R25.pdf p.94 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: $0\le k<2$이고 $\int_0^kf(x)dx=\int_0^k\sin(\pi x)dx=0$인 $k$의 개수는 $1$, $2\le k<4$이고 $\int_0^kf(x)dx=\int_2^k\sin(2\pi x)dx=0$인 $k$의 개수는 $2$, $4\le k<6$일 때 $\int_4^k\sin(3\pi x)dx=0$인 $k$의 개수는 $3$, $6\le k<8$일 때 $4$, $8\le k<10$일 때 $\int_8^k\sin(5\pi x)dx=0$인 $k$의 개수는 $5$이므로 구간 $0\le k<10$에서 $\int_0^kf(x)dx=0$인 실수 $k$의 개수는 $15$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서 $10\le k\le m$일 때 $\displaystyle\int_0^kf(x)\,dx=\int_{10}^kf(x)\,dx=0$을 만족시키는 $k$의 개수가 $3$이어야 한다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: $0=\displaystyle\int_{10}^kf(x)\,dx=\int_{10}^k\sin6\pi x\,dx=-\frac1{6\pi}\Big[\cos6\pi x\Big]_{10}^k$이므로 $10\le k<12$일 때 $\cos6\pi k=1$을 만족시키는 $k$의 값을 모두 구하면 $10,\ 10+\dfrac13,\ 10+\dfrac23,\ 11,\ 11+\dfrac13,\ 11+\dfrac23$이다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: 따라서 구간 $10\le k\le m$인 $k$가 $3$개뿐이기 위한 $m$의 값의 범위는 $\dfrac{32}3\le m<11$이다.
      criteria:
      - 2.A1
