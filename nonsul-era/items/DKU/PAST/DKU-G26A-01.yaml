intent: 함수의 극솟값을 구할 수 있는지, 치환적분법과 부분적분법을 활용할 수 있는지, 삼각형의 무게중심과 도함수의 성질을 이해하는지를 본다. $f(x)=\int_0^x(t-a)e^tdt$의 극솟값으로 $a$를 정하고, 역함수 $h$에 대한 $\int_0^mF'(h(x))dx$를 $x=g(u)$ 치환으로 구하며, 정삼각형의 무게중심 조건으로 $k(x)$와 최댓값을 구한다.
key_idea: '[논제 1] $f''(x)=e^x(x-a)$이므로 $x=a$에서 극솟값 $f(a)=1+a-e^a=g(a)$, 조건에서 $a=2$. [논제 2] $x=g(u)$로 치환하면 $h(x)=u$, $dx=g''(u)du$이므로 $\int_0^2ue^u(1-e^u)du$. [논제 3] 정삼각형의 높이 $3$, 무게중심에서 꼭짓점까지 $2$이므로 위 꼭짓점의 $y$좌표 $c=k+2$, 윗부분 넓이 $\frac{c^2}{\sqrt3}$.'
stuck: '[논제 2]에서 $x=g(u)$로 치환해 적분구간 $[0,2]$와 $F''(u)g''(u)=ue^u(1-e^u)$를 얻는 것, [논제 3]에서 무게중심이 높이를 $2:1$로 나눔을 이용해 윗부분 정삼각형의 높이를 $k(x)+2$로 쓰는 것'
