- id: '3'
  stem: |-
    [논제 3] $-1\le x\le1$일 때, 다음 조건을 만족시키는 함수 $k(x)$와 $k(x)$의 최댓값을 구하시오.

    한 변의 길이가 $2\sqrt3$인 정삼각형 $T$의 무게중심이 $(x,k(x))$일 때, 정삼각형 $T$의 $x$축 위쪽에 위치하는 부분의 넓이가 $\dfrac{\sqrt3}3(1+g(x))$이다. (단, 정삼각형 $T$의 한 변은 $x$축에 평행하고, $x$축 위쪽에 위치하는 꼭짓점은 하나이다.)

    [그림: 한 변이 $x$축에 평행한 정삼각형 $T$의 위쪽 꼭짓점이 $x$축 위에 있고, $x$축 위쪽의 작은 삼각형 부분에 빗금이 있다. 무게중심 $(x,k(x))$가 표시되고 점선 곡선 $y=k(x)$가 삼각형 아래쪽에 그려져 있다.]
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: k(x) = -2 + sqrt(2 + x - exp(x)); 최댓값 -1
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 높이 $3$, 무게중심~꼭짓점 거리 $2$이므로 위 꼭짓점의 $y$좌표는 $c=k+2$이고 윗부분 넓이는 $\frac{c^2}{\sqrt3}$.
    steps:
    - id: 3a
      content: $\frac{(k+2)^2}{\sqrt3}=\frac{\sqrt3}3(2+x-e^x)\Rightarrow k=-2+\sqrt{2+x-e^x}$, $x=0$에서 최댓값 $-1$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
    hint_ladder:
    - 정삼각형 $T$의 높이는?
    - 윗부분 정삼각형의 넓이는 높이 $c$로 어떻게 쓰는가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: book27.pdf p.103 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: 정삼각형 $T$의 높이는 $3$이고, 무게중심에서 꼭짓점까지의 거리는 $2$이다. 따라서 정삼각형 $T$의 위쪽 꼭짓점의 좌표를 $(x,c(x))$라 하면 $c(x)=k(x)+2$이다. 정삼각형 $T$의 $x$축 위쪽에 위치하는 부분의 넓이 $A(x)$는 높이가 $c(x)$인 정삼각형의 넓이이므로 $$A(x)=\frac{c(x)^2}{\sqrt3}=\frac{\{k(x)+2\}^2}{\sqrt3}$$ 이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 한편 $A(x)=\dfrac{\sqrt3}3(1+g(x))=\dfrac{\sqrt3}3(2+x-e^x)$이므로 $\dfrac{\{k(x)+2\}^2}{\sqrt3}=\dfrac{\sqrt3}3(2+x-e^x)$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: 정삼각형 $T$의 위쪽 꼭짓점이 $x$축 위에 있으므로 $c(x)=k(x)+2\ge0$이다. $k(x)+2=\sqrt{2+x-e^x}$, $k(x)=-2+\sqrt{2+x-e^x}$ $(-1\le x\le1)$
      criteria:
      - 3.M2
    - id: 3b-4
      content: $k'(x)=\dfrac{1-e^x}{2\sqrt{2+x-e^x}}=0$으로부터 $k(x)$의 최댓값은 $x=0$에서 $-1$이다.
      criteria:
      - 3.A1
