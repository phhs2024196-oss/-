- id: '2'
  stem: |-
    [논제 2] $F(x)=\displaystyle\int_0^xte^t\,dt$에 대하여, $\displaystyle\int_0^mF'(h(x))\,dx$의 값을 구하시오.
    (단, $m$은 [논제 1]에서 구한 $a$값을 대입한 $m$이다.)
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: 3/4 + exp(2) - 3*exp(4)/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x=g(u)$로 치환하면 $h(x)=u$, $dx=g'(u)du$, 구간 $[0,2]$.
    steps:
    - id: 2a
      content: $\int_0^2ue^u(1-e^u)du=\frac34+e^2-\frac34e^4$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $g(x)$를 구하면?
    - $x=0$, $x=m$에 대응하는 $u$는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: book27.pdf p.103 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: $F'(x)=xe^x$이고 [논제 1]에 의하여 $g(x)=1+x-e^x$, $g(2)=3-e^2=m$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 정적분 $\int_0^mF'(h(x))dx$의 값을 구하기 위해서 $x=g(u)$로 치환하면 $h(x)=u$이고 $\dfrac{dx}{du}=g'(u)=(1-e^u)$이다. 또한 $x=0$일 때 $u=h(0)=0$이고 $x=m$일 때 $u=h(m)=2$이므로 $$\int_0^mF'(h(x))dx=\int_0^2F'(u)g'(u)du=\int_0^2ue^u(1-e^u)du$$
      criteria:
      - 2.M1
      - 2.M2
    - id: 2b-3
      content: $$=\Big[u\Big(e^u-\frac12e^{2u}\Big)\Big]_0^2-\int_0^2\Big(e^u-\frac12e^{2u}\Big)du=\frac34+e^2-\frac34e^4$$ (부분적분)
      criteria:
      - 2.A1
  # 채점기준 공식 공개 — R26.pdf p.69, 원 배점 분할 그대로
