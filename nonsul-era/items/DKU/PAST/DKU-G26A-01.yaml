stimuli:
- label: 가
  body: 두 집합 $X$, $Y$에서 함수 $f:X\to Y$가 일대일대응이면, $Y$의 각 원소 $y$에 대응하는 $X$의 원소 $x$는 오직 하나 존재한다. 이때 $Y$의 각 원소 $y$에 $y=f(x)$인 $X$의 원소 $x$를 대응시키면 $Y$를 정의역, $X$를 공역으로 하는 새로운 함수를 정의할 수 있다. 이 함수를 $f$의 역함수라고 한다.
- label: 나
  body: |-
    미분가능한 함수 $g(t)$에 대하여 $x=g(t)$로 놓으면
    $$\int f(x)\,dx=\int f(g(t))g'(t)\,dt$$
- label: 다
  body: |-
    두 함수 $f(x)$, $g(x)$가 미분가능하고, $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)g'(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf'(x)g(x)\,dx$$
- label: 라
  body: 삼각형의 한 꼭짓점과 그 대변의 중점을 이은 선분을 중선이라 하고, 세 중선의 교점을 삼각형의 무게중심이라고 한다. 삼각형의 무게중심은 세 중선을 꼭짓점으로부터 각각 $2:1$로 내분한다.
stem: |-
  [문제 1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  실수 $a$에 대하여 함수
  $$f(x)=\int_0^x(t-a)e^t\,dt$$
  의 극솟값을 $g(a)$라 하자. 구간 $x\ge0$에서 함수 $g(x)$의 역함수를 $h(x)$라 하자.
subparts:
- id: '1'
  stem: '[논제 1] $f(x)$가 극솟값 $m=3-e^a$을 가질 때, 상수 $a$의 값을 구하시오.'
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=e^x(x-a)$이므로 $x=a$에서 극솟값 $f(a)=1+a-e^a$.
    steps:
    - id: 1a
      content: $1+a-e^a=3-e^a\Rightarrow a=2$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - $f'(x)$는?
    - 극솟값을 갖는 $x$는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: book27.pdf p.102~103 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: '$f''(x)=e^x(x-a)$이므로 $f(x)$는 $x=a$에서 극솟값을 갖는다. 따라서 $$f(x)=\int_0^xte^tdt-a\int_0^xe^tdt=(x-1-a)e^x+1+a$$ 이다. (보충: $\int_0^xte^tdt=(x-1)e^x+1$)'
      criteria:
      - 1.M1
    - id: 1b-2
      content: 에서 $f(a)=1+a-e^a=g(a)$이고, 극솟값 $1+a-e^a=3-e^a$이므로 $a=2$이다.
      criteria:
      - 1.M1
      - 1.A1
  # 채점기준 공식 공개 — R26.pdf p.69, 원 배점 분할 그대로
