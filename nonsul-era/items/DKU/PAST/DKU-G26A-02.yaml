- id: '2'
  stem: |-
    [논제 2] 함수 $A(x)=\displaystyle\int_0^1\lvert f(t)-x\rvert\,dt$에 대하여 다음 조건을 만족시키는 실수 $c$와 양수 $k$의 값을 구하시오.

    (1) $A(x)$는 $x=c$에서 극값을 갖는다.
    (2) $A(k)=\ln2$
  points: 25
  depends_on: []
  answer:
    kind: expression
    value: c = 4/5, k = 2*log(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x<0$, $0\le x<1$, $x\ge1$로 나눠 $A(x)$를 구한다. $0\le x<1$에서 $A'(x)=2g(x)-1$ ($g$는 $f$의 $[0,1]$에서의 역함수).
    steps:
    - id: 2a
      content: $A'(x)=0\Rightarrow g(x)=\frac12$, $x=f(\frac12)=\frac45=c$. $A(x)=x-\ln2=\ln2$에서 $k=2\ln2$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
    hint_ladder:
    - $0\le x<1$일 때 $f(t)-x$의 부호가 바뀌는 $t$는?
    - $A'(x)$를 구하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: book27.pdf p.106~107 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: '(i) $A(x)$ 구하기: 실수 $x$의 구간을 $x<0$, $0\le x<1$, $x\ge1$인 경우로 나누어 각각의 경우에서 조건을 만족시키는 $A(x)$를 구한다. (경우 1) $x<0$: $0\le f(t)\le1$이므로 $$A(x)=\int_0^1\lvert f(t)-x\rvert dt=\int_0^1(f(t)-x)dt=\int_0^1\frac{2t}{1+t^2}dt-x=\ln2-x$$'
      criteria:
      - 2.M1
    - id: 2b-2
      content: '(경우 2) $0\le x<1$: 닫힌구간 $[0,1]$에서 $f(t)$는 일대일함수이므로 역함수 $g(t)$가 존재한다. $$A(x)=\int_0^{g(x)}(x-f(t))dt+\int_{g(x)}^1(f(t)-x)dt=\ln2-2\ln(1+[g(x)]^2)-x+2xg(x)$$ (경우 3) $x\ge1$: (경우 1)과 동일한 방법으로 $A(x)=x-\ln2$. 그러므로 $$A(x)=\begin{cases}\ln2-x&(x<0)\\\ln2-2\ln(1+[g(x)]^2)-x+2xg(x)&(0\le x<1)\\x-\ln2&(x\ge1)\end{cases}$$'
      criteria:
      - 2.M1
    - id: 2b-3
      content: '(ii) $c$ 구하기: $x<0$일 때 $A''(x)=-1$이고, $x\ge1$일 때 $A''(x)=1$이다. $0\le x<1$일 때, $\dfrac{2g(x)}{1+[g(x)]^2}=f(g(x))=x$이므로 $$A''(x)=-2\frac{2g(x)}{1+[g(x)]^2}[g(x)]''-1+2g(x)+2x[g(x)]''=2g(x)-1$$ $A''(x)=0$에서 $g(x)=\dfrac12$이므로 $x=f\left(\dfrac12\right)=\dfrac45$이다. $f''(x)>0$이므로 $g''(x)>0$이고, $A''''(x)=2g''(x)>0$이므로 $A(x)$는 $x=\dfrac45$에서 극값을 갖는다. 따라서 $c=\dfrac45$이다.'
      criteria:
      - 2.A1
    - id: 2b-4
      content: '(iii) $A(k)=\ln2$인 $k$ 구하기 $(k>0)$: $A(x)$는 아래로 볼록하고 $A(0)=\ln2$, $A(1)=1-\ln2$이다. $0<x\le1$에서 $A(x)=\ln2$를 만족하는 $x$는 존재하지 않는다. $x>1$에서 $A(x)=x-\ln2=\ln2$인 $x=2\ln2$이다. 따라서 $k=2\ln2$이다.'
      criteria:
      - 2.A2
