intent: 함수의 그래프 개형과 일대일함수의 개념을 이해하는지, 함수의 극값을 찾고 방정식의 해를 구하는 데 응용할 수 있는지를 본다. $f(x)=\frac{2x}{1+x^2}$가 $[-1,1]$에서만 일대일임을 이용해 $a$의 범위를 구하고, $A(x)=\int_0^1\lvert f(t)-x\rvert dt$를 구간별로 구해 극값점 $c$와 $A(k)=\ln2$인 $k$를 구한다.
key_idea: '[논제 1] $f''(x)=\frac{2(1-x^2)}{(1+x^2)^2}$로 $[-1,1]$에서 증가, 그 바깥에서 감소이므로 $b<0<c$인 닫힌구간에서 일대일이려면 $[b,c]\subset[-1,1]$이어야 하고 $b<a<c$에서 $a\in(-1,1)$. [논제 2] $x<0$, $0\le x<1$, $x\ge1$로 나눠 $A(x)$를 구하고 $0\le x<1$에서는 역함수 $g$로 $A''(x)=2g(x)-1$.'
stuck: '[논제 1]에서 일대일이 되는 구간을 세 경우로 나누고 $b<0<c$ 조건으로 두 경우를 배제하는 것, [논제 2]에서 $0\le x<1$일 때 $\lvert f(t)-x\rvert$의 부호가 바뀌는 $t=g(x)$(역함수)를 적분 한계로 쓰는 것'
