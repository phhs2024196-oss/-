stimuli:
- label: 가
  body: |-
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 이 구간의 모든 $x$에 대하여
    • $f'(x)>0$이면 $f(x)$는 이 구간에서 증가한다.
    • $f'(x)<0$이면 $f(x)$는 이 구간에서 감소한다.
- label: 나
  body: |-
    함수 $f:X\to Y$에서 정의역 $X$의 임의의 두 원소 $x_1$, $x_2$에 대하여
    $$x_1\ne x_2\text{이면 }f(x_1)\ne f(x_2)$$
    가 성립할 때, 이 함수 $f$를 일대일함수라고 한다.
- label: 다
  body: 함수 $f(x)$에서 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\le f(a)$이면 함수 $f(x)$는 $x=a$에서 극대, 그 때의 함숫값 $f(a)$를 극댓값이라고 하고, $f(x)\ge f(a)$이면 함수 $f(x)$는 $x=a$에서 극소, 그 때의 함숫값 $f(a)$를 극솟값이라고 하며, 극댓값과 극솟값을 통틀어 극값이라고 한다.
stem: |-
  [문제 2] 다음 제시문을 읽고 질문에 답하시오. (45점)

  함수 $f(x)=\dfrac{2x}{1+x^2}$에 대하여 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |-
    [논제 1] 다음 조건을 만족시키는 실수 $a$의 값의 범위를 구하시오.

    $b<a<c$인 어떤 음수 $b$와 어떤 양수 $c$에 대하여 닫힌구간 $[b,c]$에서 함수 $f(x)$는 일대일함수이다.
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: -1 < a < 1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f$는 $(-1,1)$에서 증가, $(-\infty,-1)$, $(1,\infty)$에서 감소. $[b,c]$가 일대일이려면 $[-\infty,-1]$, $[1,\infty)$, $[-1,1]$ 중 하나에 포함.
    steps:
    - id: 1a
      content: $b<0<c$이므로 $[b,c]\subset[-1,1]$이고 $b<a<c$에서 $a\in(-1,1)$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - $f'(x)$의 부호는?
    - $b<0<c$로 배제되는 경우는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: book27.pdf p.105~106 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |-
        함수 $f(x)$는 구간 $(-1,1)$에서 $f'(x)=\dfrac{2(1-x^2)}{(1+x^2)^2}>0$이므로 증가하고, 또한 구간 $(-\infty,-1)$와 $(1,\infty)$에서 $f'(x)<0$이므로 감소한다. 함수 $f(x)$의 그래프의 개형을 그린다.

        [그림: $y=f(x)$는 원점대칭이며 $x=-1$에서 극솟값 $-1$, $x=1$에서 극댓값 $1$을 갖고 $x\to\pm\infty$에서 $0$에 가까워진다.]
      criteria:
      - 1.M1
    - id: 1b-2
      content: 닫힌구간 $[b,c]$에서 함수 $f(x)$가 일대일함수이기 위해서는 구간 $[b,c]$가 다음의 세 가지 경우 중 하나를 만족하여야 한다. (경우 1) $[b,c]\subset(-\infty,-1]$ (경우 2) $[b,c]\subset[1,\infty)$ (경우 3) $[b,c]\subset[-1,1]$
      criteria:
      - 1.M1
    - id: 1b-3
      content: (경우 1)은 $c\le-1$이므로 $c$가 양의 실수임에 위배된다. (경우 2)에서 $b\ge1$이므로 $b$가 음의 실수임에 위배된다. (경우 3)에서 $a\in(-1,1)$이면, 조건을 만족하는 음의 실수 $b$와 양의 실수 $c$가 존재한다. 만일 $a=-1$이면 $b<-1$이어야 하므로 $a\ne-1$이다. 마찬가지 이유로 $a\ne1$이다.
      criteria:
      - 1.A1
    - id: 1b-4
      content: 따라서 $a$의 범위는 $(-1,1)$이다.
      criteria:
      - 1.A1
