- id: '2'
  stem: |-
    [논제 2] 닫힌구간 $[0,10\pi]$에서 정의된 두 함수 $g(x)=f(x)e^{-x}$와 $h(x)=be^{-x}$는 다음 조건을 만족시킨다. (단, $b$는 양수)

    두 곡선 $y=g(x)$와 $y=h(x)$가 만나고, 만나는 모든 점에서 곡선 $y=g(x)$에 접하는 직선과 곡선 $y=h(x)$에 접하는 직선이 일치한다.

    두 곡선 $y=g(x)$와 $y=h(x)$가 만나는 점의 $x$좌표를 작은 수부터 크기순으로 나열할 때 두 번째 수를 $p_2$라 하자. $b+p_2$의 값을 구하시오.
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: sqrt(2) + 15*pi/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '만나는 점 $p$에서 $g(p)=h(p)$, $g''(p)=h''(p)$: $\cos p-\sin p=b$, $2\cos p=b$.'
    steps:
    - id: 2a
      content: $\tan p=-1$, $b>0\Rightarrow p=\frac{7\pi}4+2j\pi$, $b=\sqrt2$, $p_2=\frac{15\pi}4$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
    hint_ladder:
    - $g'(x)$와 $h'(x)$를 구하자.
    - 두 식에서 $\tan p$는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: book27.pdf p.111 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: 교점의 $x$좌표를 $p$라 하면, $g(p)=h(p)$로부터 $$\cos p-\sin p=b\ \cdots\cdots\ (1)$$
      criteria:
      - 2.M1
    - id: 2b-2
      content: 또한 $g'(x)=e^{-x}(f'(x)-f(x))$, $h'(x)=-be^{-x}$이고, $g'(p)=h'(p)$이므로 $$2\cos p=b\ \cdots\cdots\ (2)$$
      criteria:
      - 2.M2
    - id: 2b-3
      content: (1)과 (2)에 의해 $\cos p=-\sin p$에서 $\tan p=-1$이다. $b$는 양의 실수이므로 $p_2=\dfrac{15\pi}4$이다.
      criteria:
      - 2.A1
    - id: 2b-4
      content: (2)에 의해 $b=\sqrt2$이므로 $b+p_2=\sqrt2+\dfrac{15\pi}4$
      criteria:
      - 2.M3
      - 2.A1
