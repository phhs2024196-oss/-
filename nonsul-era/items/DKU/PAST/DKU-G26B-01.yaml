- id: '3'
  stem: '[논제 3] 방정식 $g(x)=0$을 만족시키는 양수 $x$를 작은 수부터 크기순으로 나열할 때 $k$번째 수를 $x_k$라 하자. $x_k\le x\le x_{k+1}$에서 곡선 $y=g(x)$와 $x$축으로 둘러싸인 도형의 넓이를 $A_k$라 하자. $A_1+\dfrac{A_6}{A_3}$의 값을 구하시오.'
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: sqrt(2)/2*(exp(-5*pi/4) + exp(-pi/4)) + exp(-3*pi)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 영점은 $\frac\pi4+(k-1)\pi$. $A_1$을 부분적분으로 구하고 $x\to x+2\pi$ 이동으로 $A_3=A_1e^{-2\pi}$, $A_6=A_1e^{-5\pi}$.
    steps:
    - id: 3a
      content: $A_1+\frac{A_6}{A_3}=A_1+e^{-3\pi}=\frac{\sqrt2}2(e^{-5\pi/4}+e^{-\pi/4})+e^{-3\pi}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
    hint_ladder:
    - $g(x)=0$의 해는?
    - $A_3$과 $A_1$의 관계는?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: book27.pdf p.111 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: '방정식 $g(x)=0$을 만족시키는 양수 $x$를 작은 수부터 $7$개 구하면 $x=\dfrac\pi4,\ \dfrac\pi4+\pi,\ \dfrac\pi4+2\pi,\ \dfrac\pi4+3\pi,\ \dfrac\pi4+4\pi,\ \dfrac\pi4+5\pi,\ \dfrac\pi4+6\pi$이다. 도형의 넓이 $A_1$은 $\dfrac\pi4\le x\le\dfrac{5\pi}4$에서 $g(x)\le0$이므로 부분적분법에 의하여 $$A_1=-\int_{\frac\pi4}^{\frac{5\pi}4}(\cos x-\sin x)e^{-x}dx=-\Big[e^{-x}\sin x\Big]_{\frac\pi4}^{\frac{5\pi}4}=\frac{\sqrt2}2\left(e^{-\frac{5\pi}4}+e^{-\frac\pi4}\right)$$ 이다. (보충: $\frac{d}{dx}\left(e^{-x}\sin x\right)=(\cos x-\sin x)e^{-x}$)'
      criteria:
      - 3.M1
    - id: 3b-2
      content: 또한 $$A_3=-\int_{\frac\pi4+2\pi}^{\frac{5\pi}4+2\pi}(\cos x-\sin x)e^{-x}dx=-\int_{\frac\pi4}^{\frac{5\pi}4}(\cos(x+2\pi)-\sin(x+2\pi))e^{-(x+2\pi)}dx=A_1e^{-2\pi}$$ 이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: 도형의 넓이 $A_6$은 $\dfrac{21\pi}4\le x\le\dfrac{25\pi}4$에서 $g(x)\ge0$이므로 $$A_6=\int_{\frac\pi4+5\pi}^{\frac{5\pi}4+5\pi}(\cos x-\sin x)e^{-x}dx=\int_{\frac\pi4}^{\frac{5\pi}4}(\cos(x+5\pi)-\sin(x+5\pi))e^{-(x+5\pi)}dx=-e^{-5\pi}\int_{\frac\pi4}^{\frac{5\pi}4}(\cos x-\sin x)e^{-x}dx=A_1e^{-5\pi}$$ 이다.
      criteria:
      - 3.M3
    - id: 3b-4
      content: 따라서 $A_1+\dfrac{A_6}{A_3}=\dfrac{\sqrt2}2\left(e^{-\frac{5\pi}4}+e^{-\frac\pi4}\right)+e^{-3\pi}$이다.
      criteria:
      - 3.A1
  # 채점기준 공식 공개 — R26.pdf p.77, 원 배점 분할 그대로
