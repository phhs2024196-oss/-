stimuli:
- label: 가
  body: |-
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: 나
  body: |-
    두 함수 $f(x)$, $g(x)$가 미분가능하고 $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)g'(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf'(x)g(x)\,dx$$
- label: 다
  body: |-
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b\lvert f(x)\rvert\,dx$$
stem: |-
  [문제 1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  닫힌구간 $[0,10\pi]$에서 정의된 함수 $f(x)=\cos x-\sin x$에 대하여 $g(x)=f(x)e^{-x}$라 하자.
subparts:
- id: '1'
  stem: '[논제 1] $\displaystyle\lim_{x\to0}\frac1x\int_1^{x+1}e^{-(at)^2}f(at)\,dt=0$을 만족시키는 양수 $a$의 최솟값을 구하시오.'
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: pi/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $k(t)=e^{-(at)^2}f(at)$, $K(x)=\int_1^xk$로 두면 극한은 $K'(1)=k(1)$.
    steps:
    - id: 1a
      content: $e^{-a^2}f(a)=0\Rightarrow\cos a=\sin a$, 최소 양수 $a=\frac\pi4$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 극한을 미분계수의 정의로 읽으면?
    - $f(a)=0$인 최소 양수는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: book27.pdf p.110 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: $k(t)=e^{-(at)^2}f(at)$, $K(x)=\displaystyle\int_1^xk(t)dt$라 하자. $$\lim_{x\to0}\frac1x\int_1^{x+1}e^{-(at)^2}f(at)dt=\lim_{x\to0}\frac{K(x+1)-K(1)}x=K'(1)=k(1)=e^{-a^2}f(a)=0$$
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 $f(a)=0$에서 $\cos a=\sin a$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 이로부터 $a$의 최솟값은 $\dfrac\pi4$이다.
      criteria:
      - 1.A1
  # 채점기준 공식 공개 — R26.pdf p.77, 원 배점 분할 그대로
