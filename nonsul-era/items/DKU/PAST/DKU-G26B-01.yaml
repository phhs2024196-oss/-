intent: 미분계수의 개념(정적분의 평균변화율의 극한), 접선의 개념, 곡선으로 둘러싸인 도형의 넓이를 구할 수 있는지를 본다. $f(x)=\cos x-\sin x$, $g=fe^{-x}$에 대하여 $K'(1)$으로 극한 조건에서 $a$, 두 곡선이 접하는 조건에서 $b+p_2$, 연속한 영점 사이의 넓이 $A_k$의 비를 구한다.
key_idea: '[논제 1] $K(x)=\int_1^xk(t)dt$로 두면 극한은 $K''(1)=k(1)=e^{-a^2}f(a)$. [논제 2] $g(p)=h(p)$, $g''(p)=h''(p)$에서 $\cos p-\sin p=b$, $2\cos p=b$. [논제 3] $g$의 영점은 $\frac\pi4+k\pi$이고 $A_{k+2}=A_ke^{-2\pi}$ 꼴의 등비 관계.'
stuck: '[논제 1]에서 $\frac1x\int_1^{x+1}$을 $K''(1)$로 읽는 것, [논제 2]에서 ''만나는 모든 점에서 접선 일치''를 $g=h$, $g''=h''$ 두 식으로 쓰는 것, [논제 3]에서 $x\to x+2\pi$ 이동으로 $A_k$ 사이의 관계를 얻는 것'
