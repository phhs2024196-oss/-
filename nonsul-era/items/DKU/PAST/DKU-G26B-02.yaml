stimuli:
- label: 가
  body: |-
    함수 $f(x)$가 실수 $a$에 대하여 다음 조건을 모두 만족시킬 때, $f(x)$는 $x=a$에서 연속이라고 한다.
    (ⅰ) 함수 $f(x)$가 $x=a$에서 정의되어 있다.
    (ⅱ) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재한다.
    (ⅲ) $\displaystyle\lim_{x\to a}f(x)=f(a)$
- label: 나
  body: |-
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는
    $$\{f(g(x))\}'=f'(g(x))g'(x)$$
- label: 다
  body: 다항함수 $f(x)$에 대하여 함수 $g(t)$가 $f(g(t))=t$를 만족시키면, $g(t)$는 곡선 $y=f(x)$와 직선 $y=t$의 교점의 $x$좌표 중 하나이다. 만일 $\displaystyle\lim_{t\to t_0+}g(t)$, $\displaystyle\lim_{t\to t_0-}g(t)$, $\displaystyle\lim_{t\to t_0}g(t)$가 존재하면 이 값도 곡선 $y=f(x)$와 직선 $y=t_0$의 교점의 $x$좌표 중 하나이다.
stem: |-
  [문제 2] 다음 제시문을 읽고 질문에 답하시오. (45점)

  최고차항의 계수가 $1$인 삼차함수 $f(x)$에 대하여 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |-
    [논제 1] 실수 전체의 집합에서 정의된 함수 $g(t)$가 모든 실수 $t$에 대하여
    $$f(g(t))=t$$
    이고 다음 조건을 만족시킨다.

    (1) $f(3)=0$, $g(0)=-2$, $g(6)=1$
    (2) 함수 $g(t)$는 $t=6$에서만 불연속이다.

    $\displaystyle\lim_{t\to6-}g(t)$와 $\displaystyle\lim_{t\to6+}g(t)$의 값을 구하시오.
  points: 20
  depends_on: []
  answer:
    kind: expression
    value: (1 - sqrt(7), 1 + sqrt(7))
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=(x+2)(x-3)(x-a)$, $f(1)=6$에서 $a=2$. $t<6$에서 연속인 $g$의 좌극한은 $f(x)=6$의 가장 작은 근, $t>6$에서의 우극한은 가장 큰 근.
    steps:
    - id: 1a
      content: $f(x)=6\Rightarrow(x-1)(x^2-2x-6)=0$, $x=1-\sqrt7,1,1+\sqrt7$ ⇒ (좌극한, 우극한)$=(1-\sqrt7,1+\sqrt7)$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - $g(0)=-2$에서 $f(-2)$는?
    - $g$가 $t=6$ 밖에서 연속이면 그래프의 어느 가지인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: book27.pdf p.113~114 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: $g(0)=-2$이므로 $f(-2)=0$이다. 또한 $f(3)=0$이므로 $f(x)=(x+2)(x-3)(x-a)$이다. $g(6)=1$에 의해 $f(1)=6$이므로 $a=2$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 조건 (2)에 의하여 $g(t)$는 $t<6$에서 연속이고, 삼차함수 $f(x)$의 그래프의 개형과 〈제시문〉(다)에 의하여 $\displaystyle\lim_{t\to6-}g(t)$은 $f(x)=6$을 만족시키는 $x$의 값 중 가장 작은 값이다. 또한 $g(t)$는 $t>6$에서 연속이므로 $\displaystyle\lim_{t\to6+}g(t)$은 $f(x)=6$을 만족시키는 $x$의 값 중 가장 큰 값이다.
      criteria:
      - 1.M2
      - 1.A1
    - id: 1b-3
      content: 방정식 $f(x)=(x+2)(x-3)(x-2)=6$에서 $(x-1)(x^2-2x-6)=0$, $x=1-\sqrt7,\ 1,\ 1+\sqrt7$이므로 $\displaystyle\lim_{t\to6-}g(t)=1-\sqrt7$, $\displaystyle\lim_{t\to6+}g(t)=1+\sqrt7$이다.
      criteria:
      - 1.M2
      - 1.A1
      - 1.A2
  # 채점기준 공식 공개 — R26.pdf p.81, 원 배점 분할 그대로
  rubric:
    rules:
      ft_scope: cross_subpart_only
