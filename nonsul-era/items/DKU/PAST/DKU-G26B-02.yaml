intent: 함수의 극한(좌극한·우극한)의 개념을 이해하는지, 연속함수의 성질과 합성함수의 미분을 활용할 수 있는지를 본다. $f(g(t))=t$를 만족시키는 $g$의 $t=6$에서의 좌·우극한을 삼차함수 $f$의 그래프 개형으로 구하고, $f(h(t))=t+n$인 연속함수 $h$가 존재하고 $f(k(t))=t+n-1$인 연속함수 $k$는 존재하지 않는 조건으로 $f$, $n$, $h'(n)$을 구한다.
key_idea: '[논제 1] $f(-2)=f(3)=0$, $f(1)=6$으로 $f(x)=(x+2)(x-3)(x-2)$. $t<6$에서 연속인 $g$의 좌극한은 $f=6$의 가장 작은 근, $t>6$에서 연속이므로 우극한은 가장 큰 근. [논제 2] $f(x)=x^3-3x^2+c$, 극솟값 $m=c-4$에 대해 $n-1<m\le n$, $c=2n+2$로 $n=2$, $c=6$. $h''(2)=\frac1{f''(h(2))}$.'
stuck: '[논제 1]에서 불연속점이 $t=6$ 하나뿐이라는 조건을 ''왼쪽은 가장 작은 근, 오른쪽은 가장 큰 근''으로 번역하는 것, [논제 2]에서 연속인 $h$, $k$의 존재 여부를 극솟값 $m$과 $n$, $n-1$의 대소로 바꾸는 것'
