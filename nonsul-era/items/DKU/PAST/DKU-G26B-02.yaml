      - 1a
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: $f(x)=6$의 해가 $1-\sqrt7$, $1$, $1+\sqrt7$임을 제시했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
      - 1b-3
      - 1a
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $\lim_{t\to6-}g(t)=1-\sqrt7$, $\lim_{t\to6+}g(t)=1+\sqrt7$ 중 하나를 제시했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-2
      - 1b-3
      - 1a
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: $\lim_{t\to6-}g(t)=1-\sqrt7$, $\lim_{t\to6+}g(t)=1+\sqrt7$을 모두 제시했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |-
    [논제 2] $f(x)$가 $x=0$, $x=2$에서 극값을 가질 때, 함수 $f(x)$와 실수 전체 집합에서 연속인 함수 $h(t)$는 다음 조건을 만족시킨다. (단, $n$은 자연수)

    (1) 모든 $t\ge0$에 대하여 $f(h(t))=t+n$
    (2) 실수 전체 집합에서 정의되고 다음을 만족시키는 함수 $k(t)$는 연속이 아니다.
    “모든 $t\ge0$에 대하여 $f(k(t))=t+n-1$”
    (3) $f(1)=f(h(n))$

    $h'(n)$의 값을 구하시오.
  points: 25
  depends_on: []
  answer:
    kind: value
    value: 1/6
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=x^3-3x^2+c$, 극솟값 $m=f(2)=c-4$. $h$가 연속이려면 $m\le n$, $k$가 연속이 아니려면 $m>n-1$. (3)에서 $c=2n+2$이므로 $n=2$, $c=6$.
    steps:
    - id: 2a
      content: $h(2)=1+\sqrt3$, $h'(2)=\frac1{f'(h(2))}=\frac1{3(1+\sqrt3)(-1+\sqrt3)}=\frac16$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
    hint_ladder:
    - $f'(x)=3x^2-6x$로 $f$의 꼴은?
    - $f(h(n))=2n$과 $f(1)=c-2$로 $c$는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: book27.pdf p.114 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: $f'(x)=3x^2-6x$이므로 $f(x)$는 $x=2$에서 극솟값 $m$을 갖는다고 하자. $t=0$일 때, $h(0)$은 〈제시문〉(다)에 의하여 $y=f(x)$와 직선 $y=n$의 교점의 $x$좌표 중 하나이다. $h(t)$가 $t\ge0$에서 연속이기 위해서는 $h(0)$가 $x\ge2$인 구간에 위치해야 하고, $h(t)$는 곡선 $y=f(x)$와 직선 $y=t+n$이 만나는 점의 $x$좌표 중 가장 큰 값이다. 그러므로 $f(x)$의 극솟값을 $m$이라 하면 $m\le n$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 한편, $m\le n-1$이면 같은 이유로 모든 $t\ge0$에 대하여 $f(k(t))=t+n-1$을 만족하는 연속함수 $k(t)$가 존재하므로 $m>n-1$이다. 따라서 $n-1<m\le n$이다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: $f'(x)=3x^2-6x$이므로 $f(x)=x^3-3x^2+c$이다. 따라서 $m=f(2)=c-4$이고 $n-1<c-4\le n$이다. $f(h(n))=2n=f(1)=c-2$로부터 $c=2n+2$에서 $n+3<2n+2\le n+4$, 즉 $1<n\le2$이다. 따라서 $n=2$이고 $c=6$이다.
      criteria:
      - 2.M2
      - 2.M3
    - id: 2b-4
      content: $f(h(t))=t+2$로부터 $[f(h(t))]'=f'(h(t))h'(t)=1$이므로 $h'(2)=\dfrac1{f'(h(2))}\ \cdots\cdots\ (\bigstar)$ 이다.
      criteria:
      - 2.A1
    - id: 2b-5
      content: 또한 $h(2)$는 $f(x)=4$를 만족시키는 $x$ 중 가장 큰 값이므로 $4=f(x)=x^3-3x^2+6$에서 $h(2)=1+\sqrt3$이다. 따라서 $(\bigstar)$로부터 $h'(2)=\dfrac1{f'(1+\sqrt3)}=\dfrac1{3(1+\sqrt3)(-1+\sqrt3)}=\dfrac16$이다.
      criteria:
      - 2.A1
