- id: '3'
  stem: |
    [논제 3] $\alpha<t<\beta$인 실수 $t$에 대하여 직선 $x=-t$와 곡선 $y=h(x)$의 교점을 $\mathrm{P}$라 하고, 직선 $x=t$와 곡선 $y=k(x)$의 교점을 $\mathrm{Q}$라 할 때, 사각형 $\mathrm{AQBP}$의 넓이를 $S(t)$라 하자. 두 함수 $h(x)$와 $k(x)$는 다음 조건을 만족시킨다.

    > (1) $\displaystyle\int_{\frac{\alpha}{2}}^{\frac{\beta}{2}}S(t)\,dt=22a^2\alpha\beta+33(b+c)$
    >
    > (2) $h(4)>k(4)$

    $\displaystyle\sum_{n=3}^{11}h(n)-\sum_{n=1}^{9}k(n)$의 값을 구하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '-354'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $M=b+c$로 두면 $S(t)=\sqrt{\frac M{2a}}\,(M-2at^2)$, 조건 (1)은 $M=24a(3-a)$, 조건 (2)로 $a=1$, $b+c=48$. 합은 $b+c$만의 식이다.
    steps:
    - id: 3a
      content: $S(t)=\sqrt{\frac M{2a}}(M-2at^2)$, $\int=\frac{11M^2}{24a}=11(3-a)M\Rightarrow M=24a(3-a)$, $a=1,\ b+c=48$, 답 $-354$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
    hint_ladder:
    - $h(x)=k(x)$에서 $\alpha,\beta$를 $a,b+c$로 나타내 보자.
    - 사각형을 두 삼각형으로 나누면 넓이는?
    - 자연수 조건으로 $a$를 제한해 보자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: M24_S.pdf p.3~4 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: $b+c=M$이라 하면 $-ax^2+b=ax^2-c$에서 $\alpha=-\sqrt{\dfrac{M}{2a}}$, $\beta=\sqrt{\dfrac{M}{2a}}$이므로 $\mathrm{A}\!\left(-\sqrt{\dfrac{M}{2a}},\dfrac{b-c}{2}\right)$, $\mathrm{B}\!\left(\sqrt{\dfrac{M}{2a}},\dfrac{b-c}{2}\right)$이다. $\alpha<t<\beta$인 실수 $t$에 대하여 $\mathrm{P}(-t,-at^2+b)$, $\mathrm{Q}(t,at^2-c)$이고 $\beta-\alpha=2\sqrt{\dfrac{M}{2a}}$, $\alpha\beta=-\dfrac{M}{2a}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        선분 $\mathrm{AB}$(높이 $\frac{b-c}2$)로 사각형을 두 삼각형으로 나누면
        $$S(t)=\frac12(\beta-\alpha)\left\{h(-t)-\frac{b-c}{2}\right\}+\frac12(\beta-\alpha)\left\{\frac{b-c}{2}-k(t)\right\}=\sqrt{\frac{M}{2a}}\,(-2at^2+M)$$
      criteria:
      - 3.M1
    - id: 3b-3
      content: |
        따라서
        $$\int_{\frac\alpha2}^{\frac\beta2}S(t)\,dt=\sqrt{\frac M{2a}}\,(\beta-\alpha)\left\{-\frac1{12}a(\beta^2+\alpha^2+\alpha\beta)+\frac M2\right\}$$
        이고 $\beta^2+\alpha^2+\alpha\beta=(\beta-\alpha)^2+3\alpha\beta=\dfrac{M}{2a}$이므로 $\displaystyle\int_{\frac\alpha2}^{\frac\beta2}S(t)\,dt=\frac{11M^2}{24a}$이다.
      criteria:
      - 3.M2
    - id: 3b-4
      content: 한편 $22a^2\alpha\beta+33(b+c)=11(3-a)(b+c)$이므로 $\dfrac{11M^2}{24a}=11(3-a)M$, 즉 $M=24a(3-a)$이다. $M$은 자연수이므로 $a=1,\ 2$이고 $b+c=48$이다.
      criteria:
      - 3.M2
    - id: 3b-5
      content: $0<h(4)-k(4)=-32a+b+c$이므로 $a=1$이고 $h(x)=-x^2+b$, $k(x)=x^2-c$이다.
      criteria:
      - 3.M2
    - id: 3b-6
      content: |
        따라서
        $$\sum_{n=3}^{11}h(n)-\sum_{n=1}^{9}k(n)=\sum_{n=1}^{11}\{h(n)-k(n)\}-h(1)-h(2)+k(10)+k(11)=\sum_{n=1}^{11}(-2n^2+b+c)-2(b+c)+226=-354$$
        이다. ($\sum_{n=1}^{11}(-2n^2+48)=-484$, $-2\times48+226=130$)
      criteria:
      - 3.A1
