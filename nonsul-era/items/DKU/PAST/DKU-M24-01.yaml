stimuli:
- label: 가
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고, $x=a$의 좌우에서
    (ⅰ) $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대
    (ⅱ) $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소
- label: 나
  body: 미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면 $f'(a)=0$
- label: 다
  body: |
    함수 $f(x)$가 $a$, $b$를 포함하는 열린구간에서 연속이고, $f(x)$의 한 부정적분을 $F(x)$라 하면 $f(x)$의 $a$에서 $b$까지의 정적분은
    $$\int_a^bf(x)\,dx=\Big[F(x)\Big]_a^b=F(b)-F(a)$$
stem: |
  [문제 1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  • 최고차항의 계수가 $1$인 두 이차함수 $f(x)$와 $g(x)$는 $f(3)=0$이고 모든 실수 $x$에 대하여 $f(x)g(x)\ge0$을 만족시킨다. 함수 $F(x)$와 $G(x)$를 $F(x)=f(x)g(x)$, $G(x)=e^{F(x)}$라 하자.

  • 두 이차함수 $h(x)=-ax^2+b$와 $k(x)=ax^2-c$의 그래프의 교점을 $\mathrm{A}(\alpha,h(\alpha))$, $\mathrm{B}(\beta,h(\beta))$라 하자. (단, $a$, $b$, $c$는 자연수이고 $\alpha<\beta$)
subparts:
- id: '1'
  stem: '[논제 1] 자연수 $\ell$에 대하여 $g(0)=\ell$, $g''(0)=\dfrac{2}{3}\ell$일 때, 함수 $F(x)$의 극값이 모두 정수가 되도록 하는 $\ell$의 개수를 구하시오.'
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(x)=x^2+\frac23\ell x+\ell$. 판별식으로 $1\le\ell\le9$, $F\ge0$이고 $F(3)=0$이므로 $f=(x-3)^2$. 극값 $0,\ 0\text{ 아닌 }9\ell,\ F\!\left(\frac{3-\ell}{2}\right)$ 중 정수 조건에서 $\ell=3,9$.
    steps:
    - id: 1a
      content: $D=\frac{4\ell(\ell-9)}{9}$, $f=(x-3)^2$, $F'=2x(x-3)(2x-3+\ell)$, $F\!\left(\frac{3-\ell}2\right)=-\frac1{48}(\ell-9)(\ell+3)^3$ $\Rightarrow$ 2개
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - $g(x)=0$이 서로 다른 두 실근을 가지면 $F(x)=0$의 서로 다른 실근은 몇 개인가?
    - $F\ge0$이고 $F(3)=0$이면 $x=3$에서 $F$는 어떤 값을 갖는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: M24_S.pdf p.2~3 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: $g(0)=\ell$, $g'(0)=\frac23\ell$이므로 $g(x)=x^2+\left(\frac23\ell\right)x+\ell$이다. 판별식은 $D=\dfrac{4\ell(\ell-9)}{9}$이다. $\ell\ge10$이면 $g(x)=0$이 서로 다른 두 실근을 가지고 $g(3)=9+3\ell\ne0$이므로 $F(x)=0$은 서로 다른 실근을 3개 이상 가진다. 이때 $F(x)<0$이 되는 $x$가 존재하므로 $1\le\ell\le9$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 한편 $F(3)=0$이고 모든 실수 $x$에 대하여 $F(x)\ge0$이므로 $F(x)$는 $x=3$에서 극솟값 $0$을 갖는다. 따라서 $F'(3)=f'(3)g(3)+f(3)g'(3)=f'(3)g(3)=0$이고 $g(3)=9+3\ell>0$이므로 $f'(3)=0$, 즉 $f(x)=(x-3)^2$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $F'(x)=2(x-3)g(x)+(x-3)^2g'(x)=2x(x-3)(2x-3+\ell)$이다.
        (ⅰ) $\ell\ne3$인 경우: $F(x)$는 $x=0,\ x=3,\ x=\dfrac{3-\ell}{2}$에서 극값을 갖는다. $F(0)=9\ell$과 $F(3)=0$은 정수이고, 극값 $F\!\left(\dfrac{3-\ell}{2}\right)=-\dfrac1{48}(\ell-9)(\ell+3)^3$은 $1\le\ell\le9$에서 $\ell=9$일 때만 정수가 된다.
        (ⅱ) $\ell=3$인 경우: $F'(x)=4x^2(x-3)$이므로 $F(x)$는 $x=3$에서만 극값을 갖고 $F(3)=0$이므로 정수이다.
        (ⅰ), (ⅱ)에 의해 자연수 $\ell$의 개수는 $2$이다($\ell=3,\ 9$).
      criteria:
      - 1.A1
