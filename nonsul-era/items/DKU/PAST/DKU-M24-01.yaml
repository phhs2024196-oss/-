- id: '2'
  stem: |
    [논제 2] $3$보다 큰 상수 $s$에 대하여 두 곡선 $y=f(x)$와 $y=g(x)$는 다음 조건을 만족시킨다.

    > 두 곡선 $y=f(x)$와 $y=g(x)$가 점 $(s,f(s))$에서 만나고 이 점에서의 접선이 서로 수직이다.

    함수 $G(x)$가 $x=s$에서 극댓값을 가질 때, $G(s)$의 값을 구하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: exp(1/16)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $G'=F'e^F$이므로 $G$와 $F$의 극값 위치가 같다. $F'(3)=0$에서 $f'(3)=0$ 또는 $g(3)=0$. $g(3)=0$이면 조건 불가, $f=(x-3)^2$에서 $s=\frac72$, $g=(x-4)^2$, $G(s)=e^{1/16}$.
    steps:
    - id: 2a
      content: $f=(x-3)^2$, $f'(s)=1\Rightarrow s=\frac72$, $g=(x-4)^2$, $F\!\left(\frac72\right)=\frac1{16}$, $G=e^{1/16}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $G'(x)$를 $F'(x)$로 나타내면?
    - $F(3)=0$이고 $F\ge0$이면 $F'(3)$은?
    - 접선이 수직이면 $f'(s)g'(s)$는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: M24_S.pdf p.3 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: $G'(x)=F'(x)e^{F(x)}$이고 $e^{F(x)}>0$이므로 두 함수 $G(x)$와 $F(x)$가 극값을 갖는 $x$의 값은 서로 같다. $F(3)=0$이고 모든 실수 $x$에 대하여 $F(x)\ge0$이므로 $F(x)$는 $x=3$에서 극솟값을 갖는다. 따라서 $F'(3)=f'(3)g(3)+f(3)g'(3)=0$에서 $f'(3)g(3)=0$이므로 $f'(3)=0$ 또는 $g(3)=0$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: '(ⅰ) $g(3)=0$인 경우: $f(x)=(x-3)(x-\alpha)$, $g(x)=(x-3)(x-\beta)$라 하자. $\alpha=3$ 또는 $\beta=3$이면 $F(x)$가 $x=3$에서 극솟값을 갖지 않는다. 따라서 $\alpha\ne3$, $\beta\ne3$이다. 또한 $F(x)=0$은 서로 다른 실근을 3개 이상 갖지 않으므로 $\alpha=\beta$이다. 그러나 이 경우 $f(x)=g(x)$이므로 조건을 만족하는 교점이 존재하지 않는다.'
      criteria:
      - 2.M1
    - id: 2b-3
      content: '(ⅱ) $f''(3)=0$인 경우: $f(x)=(x-3)^2$이다. 조건에 의해 $f''(s)g''(s)=-1$이고 $f(s)=g(s)$이므로 $F''(s)=f''(s)g(s)+f(s)g''(s)=f(s)\{f''(s)+g''(s)\}=0$이다. $s>3$에서 $f(s)>0$이므로 $f''(s)+g''(s)=0$이다. 두 식 $f''(s)g''(s)=-1$, $f''(s)+g''(s)=0$이고 $f''(s)>0$이므로 $f''(s)=2(s-3)=1$에서 $s=\dfrac72$이다.'
      criteria:
      - 2.M1
    - id: 2b-4
      content: $g\!\left(\dfrac72\right)=f\!\left(\dfrac72\right)$, $g'\!\left(\dfrac72\right)=-1$에서 $g(x)=x^2-8x+16=(x-4)^2$이므로 $F(x)=(x-3)^2(x-4)^2$이다.
      criteria:
      - 2.M2
    - id: 2b-5
      content: $F\!\left(\dfrac72\right)=\left(\dfrac72-3\right)^2\left(\dfrac72-4\right)^2=\dfrac1{16}$이다. 그러므로 $G\!\left(\dfrac72\right)=e^{\frac1{16}}$이다.
      criteria:
      - 2.A1
