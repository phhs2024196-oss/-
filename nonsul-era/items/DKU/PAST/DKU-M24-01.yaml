intent: 이차함수의 곱 $f(x)g(x)\ge0$ 조건에서 함수를 결정하고, 도함수로 극대·극소를 판별할 수 있는지, 좌표평면에서 그래프로 둘러싸인 도형의 넓이를 정적분으로 구해 조건을 해결할 수 있는지를 본다. [논제 1]은 도함수를 활용하여 함수의 극대·극소를 판별하고, [논제 2]는 함수의 그래프(극값)를 활용하여 극값을 구하며, [논제 3]은 근과 계수의 관계를 활용하여 적분을 해결할 수 있는지를 평가한다.
key_idea: $F=fg\ge0$, $F(3)=0$에서 $F'(3)=0$이므로 $f=(x-3)^2$. 극값의 위치는 $G=e^F$와 $F$가 같다. 넓이는 $S(t)=\sqrt{\frac M{2a}}(M-2at^2)$로 적분하고 $M=b+c$에 대한 방정식으로 자연수 조건을 이용.
stuck: '[논제 1]에서 판별식으로 $\ell\ge10$을 배제하는 것과 $\ell=3$일 때 극값의 개수가 달라지는 것, [논제 2]에서 $g(3)=0$인 경우를 배제하고 $s$를 구하는 것, [논제 3]에서 $\sqrt{\frac M{2a}}$로 정리해 $M=24a(3-a)$를 얻는 것'
