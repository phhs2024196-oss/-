      points: 5
      evidence: 극값 조건으로 $\frac54<m<3$을 구해 $m=2$를 제시했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2a
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: $\int_0^2h(x)\,dx=-12$를 제시했다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
      - 2a
    - id: 2.M3
      mark_type: M
      points: 9
      evidence: 우함수성과 주기성으로 $\int_0^4h(x)\,dx=-24$를 제시했다.
      depends_on:
      - 2.M2
      implied_ok: false
      steps:
      - 2b-3
      - 2a
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: $\int_0^{33}h(x)\,dx=-\frac{379}2$를 제시했다.
      depends_on:
      - 2.M3
