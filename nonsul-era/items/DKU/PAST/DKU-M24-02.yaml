intent: 함수의 연속 개념을 이해하고 문제를 해결할 수 있는지, 함수의 극값을 이해하고 정적분의 성질(우함수·주기성)을 활용하여 문제를 해결할 수 있는지를 본다. 한쪽 극한으로 $g(x)g(x+k)$의 연속 조건을 $g(k)=g(-k)=0$으로 바꾸어 $k$를 구하고, 극값 위치 조건으로 $m=2$를 정한 뒤 주기 $4$인 우함수의 적분을 구한다.
key_idea: $g(x)g(x+k)$의 불연속 후보는 $x=0$, $x=-k$뿐이고 $g(0^-)=-5$, $g(0)=5$이므로 $g(k)=g(-k)=0$. 극값 조건으로 $m=2$, 적분은 우함수·주기 $4$로 $\int_0^{33}h=8\int_0^4h+\int_0^1h$.
stuck: '[논제 1]에서 $k=0$인 경우를 따로 보는 것과 $x=-k$에서의 조건 $g(-k)=0$을 빠뜨리지 않는 것, [논제 2]에서 $33=4\times8+1$로 구간을 나누고 $\int_2^4h=\int_0^2h$를 보이는 것'
