stimuli:
- label: 가
  body: |
    좌표평면 위의 두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$ 사이의 거리는
    $$\overline{\mathrm{AB}}=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$$
    점 $\mathrm{P}(x_1,y_1)$과 점 $\mathrm{P}$를 지나지 않는 직선 $ax+by+c=0$ ($a\ne0$ 또는 $b\ne0$) 사이의 거리는
    $$\frac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$$
- label: 나
  body: 실수 $L$에 대하여 $\displaystyle\lim_{x\to a}f(x)=L\iff\lim_{x\to a+}f(x)=\lim_{x\to a-}f(x)=L$
- label: 다
  body: |
    함수 $f(x)$가 미분가능할 때, $f(x)$의 $x=a$에서의 미분계수는
    $$f'(a)=\lim_{h\to0}\frac{f(a+h)-f(a)}{h}=\lim_{x\to a}\frac{f(x)-f(a)}{x-a}$$
- label: 라
  body: 두 함수 $f(x)$, $g(x)$가 $x=a$에서 미분가능하면 $f(x)+g(x)$도 $x=a$에서 미분가능하다.
stem: |
  [문제2] 다음 제시문을 읽고 질문에 답하시오. (45점)
subparts:
- id: '1'
  stem: |
    [논제 1] 좌표평면에 네 점 $\mathrm{A}(-2,0)$, $\mathrm{B}(-1,1)$, $\mathrm{C}(1,1)$, $\mathrm{D}(2,0)$을 꼭짓점으로 하는 사다리꼴 $\mathrm{ABCD}$가 있다. 선분 $\mathrm{AD}$ 위의 점 $\mathrm{P}(x,0)$으로부터 선분 $\mathrm{AB}$, 선분 $\mathrm{BC}$, 선분 $\mathrm{CD}$ 까지의 거리 중 가장 작은 값을 $m(x)$라 하자.

    다음 조건을 만족시키는 실수 $a$의 값을 모두 구하시오.

    > (1) $-2<a<2$
    >
    > (2) 함수 $m(x)$는 $x=a$에서 미분가능하지 않다.
  points: 20
  depends_on: []
  answer:
    kind: set
    value: '{sqrt(2) - 2, 2 - sqrt(2)}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $m(x)=\min\{\frac{x+2}{\sqrt2},\,1,\,\frac{2-x}{\sqrt2}\}$(구간별). 꼭 이어지는 점 $x=\pm(2-\sqrt2)$에서 좌우 미분계수가 다르다.
    steps:
    - id: 1a
      content: $m(x)=\frac{x+2}{\sqrt2},\ 1,\ \frac{2-x}{\sqrt2}$, 전환점 $\sqrt2-2,\ 2-\sqrt2$에서 좌우미분계수 $(1/\sqrt2,0)$, $(0,-1/\sqrt2)$로 다름
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - '점 $\mathrm{P}$에서 각 선분(직선 $\mathrm{AB}$: $x-y+2=0$ 등)까지 거리는?'
    - 세 거리의 최솟값이 바뀌는 $x$는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: M25_S.pdf p.3 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P}(x,0)$으로부터 선분 $\mathrm{AB}$, 선분 $\mathrm{BC}$, 선분 $\mathrm{CD}$까지의 거리를 생각한다. 직선 $\mathrm{AB}$는 $x-y+2=0$이므로 점 $\mathrm{P}$와의 거리는 $\dfrac{x+2}{\sqrt2}$, 직선 $\mathrm{BC}$는 $y=1$이므로 거리는 $1$, 직선 $\mathrm{CD}$는 $x+y-2=0$이므로 거리는 $\dfrac{2-x}{\sqrt2}$이다(선분까지의 거리는 이 값들 중 가장 작은 값이 되는 구간에서 이들과 일치한다). $\dfrac{x+2}{\sqrt2}=1$에서 $x=\sqrt2-2$이므로
        $$m(x)=\begin{cases}\dfrac{x+2}{\sqrt2}&(-2\le x<\sqrt2-2)\\[2mm]1&(\sqrt2-2\le x<2-\sqrt2)\\[2mm]\dfrac{2-x}{\sqrt2}&(2-\sqrt2\le x\le2)\end{cases}$$
        를 얻는다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서
        $$\lim_{x\to\sqrt2-2+}\frac{m(x)-m(\sqrt2-2)}{x-(\sqrt2-2)}=0,\qquad \lim_{x\to\sqrt2-2-}\frac{m(x)-m(\sqrt2-2)}{x-(\sqrt2-2)}=\frac1{\sqrt2}$$
        이고
        $$\lim_{x\to2-\sqrt2+}\frac{m(x)-m(2-\sqrt2)}{x-(2-\sqrt2)}=-\frac1{\sqrt2},\qquad \lim_{x\to2-\sqrt2-}\frac{m(x)-m(2-\sqrt2)}{x-(2-\sqrt2)}=0$$
        이다. 그러므로 구하려는 답은 $\sqrt2-2$와 $2-\sqrt2$이다.
      criteria:
      - 1.A1
  # 채점기준: M25_S.pdf 평가기준 배점 그대로
  rubric:
    rules: &id001
      ft_scope: cross_subpart_only
      ft_requires_working: true
