      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 12
      evidence: 세 선분까지의 거리로 $m(x)$를 구간별로 제시했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1a
    - id: 1.A1
      mark_type: A
      points: 8
      evidence: 전환점 $x=\sqrt2-2$, $2-\sqrt2$에서 좌우 미분계수가 달라 미분가능하지 않음을 보이고 정답을 제시했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] 상수항이 $0$이 아닌 일차함수 $f(x)$,
    $$g(x)=\lvert x\rvert e^{x},$$
    $$h(x)=\begin{cases}a&(x<k)\\ 9e^2&(x\ge k)\end{cases}\quad(\text{단, }a,\ k\text{는 상수이고 }a\ne9e^2)$$
    에 대하여 함수
    $$F(x)=f(x+2)g(x)+g(f(x))h(x)$$
    는 실수 전체의 집합에서 미분가능하다. $F'(k)=17e^2$일 때 $f(a+k)$의 값을 모두 구하시오.
  points: 25
  depends_on: []
  answer:
    kind: set
    value: '{-9*exp(2), 153*exp(2)}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$f(x)=mx+n$으로 두고 $F$의 연속·미분가능 조건: $k=-\frac nm$, $2m+n=0$ ($k=2$), $a=-9e^2$. $F''(2)=8me^2+9e^2\lvert m\rvert=17e^2$에서 $m=1$ 또는 $-17$.'
    steps:
    - id: 2a
      content: $k=-\frac nm$, $2m+n=0\Rightarrow k=2$, $a=-9e^2$, $m=1,-17$ $\Rightarrow f(a+k)=-9e^2,\ 153e^2$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
    hint_ladder:
    - $g(f(x))h(x)$에서 $h$의 불연속을 없애려면?
    - $x=0$에서 $g$의 꺾임을 없애려면 $f(x+2)$는 어떤 값이어야 하는가?
    - $x=k$에서 $|f|$의 꺾임을 $h$의 점프가 상쇄하려면?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: M25_S.pdf p.4 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: $f(x)=mx+n$이라 하면 $F(x)=(mx+2m+n)\lvert x\rvert e^x+\lvert mx+n\rvert e^{mx+n}h(x)$이다. $G(x)=(mx+2m+n)\lvert x\rvert e^x$, $H(x)=\lvert mx+n\rvert e^{mx+n}h(x)$라 하자. $F(x)$와 $G(x)$는 실수 전체의 집합에서 연속이므로 $H(x)$도 실수 전체의 집합에서 연속이다. 그런데 $k\ne-\dfrac nm$이면 $H(x)$가 $x=k$에서 불연속이 되므로 $k=-\dfrac nm$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $F(x)$와 $H(x)$가 $x=0$에서 미분가능하므로 $G(x)$는 $x=0$에서 미분가능하다(상수항 $n\ne0$이고 $k=-\frac nm\ne0$이므로 $H(x)$는 $x=0$ 근방에서 매끄럽다).
        $$\lim_{x\to0+}\frac{G(x)-G(0)}{x}=\lim_{x\to0+}(mx+2m+n)e^x=2m+n,\qquad\lim_{x\to0-}\frac{G(x)-G(0)}{x}=-\lim_{x\to0-}(mx+2m+n)e^x=-(2m+n)$$
        이므로 $2m+n=-(2m+n)$으로부터 $2m+n=0$이다. 따라서 $k=-\dfrac nm=2$이다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        $F(x)$와 $G(x)$가 $x=-\dfrac nm=2$에서 미분가능하므로 $H(x)=\lvert mx-2m\rvert e^{mx-2m}h(x)$는 $x=2$에서 미분가능하다. $k=-\dfrac nm=2$이므로
        $$\lim_{x\to2+}\frac{H(x)-H(2)}{x-2}=\lim_{x\to2+}\lvert m\rvert e^{mx-2m}\,9e^2=9e^2\lvert m\rvert,\qquad \lim_{x\to2-}\frac{H(x)-H(2)}{x-2}=-\lim_{x\to2-}\lvert m\rvert e^{mx-2m}a=-a\lvert m\rvert$$
        이고, $9e^2\lvert m\rvert=-a\lvert m\rvert$으로부터 $a=-9e^2$이다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: $F'(2)=G'(2)+H'(2)=8e^2m+9e^2\lvert m\rvert=17e^2$으로부터 $m=1$ 또는 $m=-17$이다. ($x>0$에서 $G(x)=mx^2e^x$이므로 $G'(2)=m(2x+x^2)e^x\big|_{x=2}=8me^2$)
      criteria:
      - 2.M3
    - id: 2b-5
      content: |
        (ⅰ) $m=1$인 경우: $f(x)=x-2$이고 $f(a+k)=f(-9e^2+2)=-9e^2$이다.
        (ⅱ) $m=-17$인 경우: $f(x)=-17x+34$이고 $f(a+k)=f(-9e^2+2)=153e^2$이다.
        (ⅰ)과 (ⅱ)로부터 구하려는 답은 $-9e^2$과 $153e^2$이다.
      criteria:
      - 2.A1
  # 채점기준: M25_S.pdf 평가기준 배점 그대로
  rubric:
    rules: *id001
    criteria:
    - id: 2.M1
      mark_type: M
      points: 7
      evidence: 연속 조건으로 $k=-\frac nm$, $x=0$에서의 미분가능 조건으로 $2m+n=0$을 구해 $k=2$를 제시했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2b-2
      - 2a
    - id: 2.M2
      mark_type: M
      points: 8
      evidence: $x=2$에서의 미분가능 조건으로 $a=-9e^2$을 제시했다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-3
      - 2a
    - id: 2.M3
      mark_type: M
      points: 5
      evidence: $F'(2)=8me^2+9e^2\lvert m\rvert=17e^2$에서 $f(x)$의 일차항의 계수가 양수인 경우 $m=1$, 음수인 경우 $m=-17$을 제시했다.
      depends_on:
      - 2.M2
      implied_ok: false
      steps:
      - 2b-4
      - 2a
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: $f(a+k)=-9e^2$, $153e^2$을 제시했다.
      depends_on:
      - 2.M3
      steps:
      - 2b-5
      - 2a
    deductions: []
