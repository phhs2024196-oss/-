stimuli:
- label: 가
  body: |
    함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때
    $$\frac{d}{dx}\int_a^xf(t)\,dt=f(x)\quad(\text{단, }a<x<b)$$
- label: 나
  body: 처음 몇 개의 항과 이웃하는 여러 항 사이의 관계식으로 수열을 정의하는 것을 수열의 귀납적 정의라고 한다. 예를 들어, 수열 $\{a_n\}$에 대하여 첫째항 $a_1$의 값, 이웃하는 두 항 $a_n$, $a_{n+1}$ ($n=1,2,3,\cdots$) 사이의 관계식을 알면 관계식에 $n=1,2,3,\cdots$을 차례로 대입하여 수열 $\{a_n\}$의 모든 항을 구할 수 있다.
- label: 다
  body: |
    미분가능한 함수 $g(t)$에 대하여 $x=g(t)$로 놓으면
    $$\int f(x)\,dx=\int f(g(t))g'(t)\,dt$$
stem: |
  [문제1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  삼각함수 $f(x)=\alpha\sin(kx)$와 실수 전체의 집합에서 연속인 함수 $g(t)$는 모든 실수 $x$에 대하여
  $$\int_{x-\alpha}^{x}t\,g(t)\,dt=f(x)$$
  를 만족시키고, 또한 $g(x)=-g(-x)$이다. (단, $\alpha$와 $k$는 양의 실수)
subparts:
- id: '1'
  stem: '[논제 1] $0<\alpha<2$이고 $g(\alpha)=-3\pi$인 실수 $\alpha$의 값을 모두 구하시오.'
  points: 15
  depends_on: []
  answer:
    kind: set
    value: '{1/3, 1, 5/3}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 양변을 미분한 식 ①에 $x=0$을 대입하면 $g(-\alpha)=k$, 기함수이므로 $k=3\pi$. $x=\alpha$를 대입하면 $\cos(3\pi\alpha)=-1$.
    steps:
    - id: 1a
      content: ① $xg(x)-(x-\alpha)g(x-\alpha)=\alpha k\cos kx$; $x=0\Rightarrow k=3\pi$, $x=\alpha\Rightarrow\cos3\pi\alpha=-1\Rightarrow\alpha=\frac13,1,\frac53$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 적분 방정식의 양변을 미분해 보자.
    - $x=0$, $x=\alpha$를 대입하면 무엇을 알 수 있는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: M26_S.pdf p.3 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\int_{x-\alpha}^{x}t\,g(t)\,dt=f(x)$의 양변을 $x$로 미분하면
        $$xg(x)-(x-\alpha)g(x-\alpha)=f'(x)=\alpha k\cos(kx)\qquad\cdots\cdots\ ①$$
      criteria:
      - 1.M1
    - id: 1b-2
      content: 식 ①에 $x=0$을 대입하면 $\alpha g(-\alpha)=\alpha k$이고 $g(-\alpha)=-g(\alpha)=3\pi$이므로 $k=3\pi$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: 식 ①에 $x=\alpha$를 대입하면 $\alpha g(\alpha)=3\pi\alpha\cos(3\pi\alpha)$이고 $g(\alpha)=-3\pi$이므로 $\cos(3\pi\alpha)=-1$이다.
      criteria:
      - 1.M2
    - id: 1b-4
      content: $3\pi\alpha=(2j+1)\pi$ ($j$는 정수)에서 $\alpha=\dfrac{2j+1}{3}$이고 $0<\alpha<2$이므로 $\alpha=\dfrac13,\ 1,\ \dfrac53$이다.
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules: &id001
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: 적분 방정식을 미분한 식 ①을 얻고 $x=0$ 대입으로 $k=3\pi$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
      - 1a
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $x=\alpha$를 대입해 $\cos(3\pi\alpha)=-1$을 얻었다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-3
      - 1a
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $0<\alpha<2$에서 $\alpha=\frac13,\ 1,\ \frac53$을 제시했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-4
      - 1a
    deductions: []
  outcome_codes:
