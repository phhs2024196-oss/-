    meaning: 만점
  misconceptions: []
- id: '2'
  stem: '[논제 2] 자연수 $n$에 대하여 $a_n=\left(\dfrac{2\pi}{k}+n\alpha\right)g\!\left(\dfrac{2\pi}{k}+n\alpha\right)$라 하고 $\alpha k=\pi$일 때, $a_{11}-a_2$의 값을 구하시오.'
  points: 20
  depends_on: []
  answer:
    kind: value
    value: -pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x_n=\frac{2\pi}k+n\alpha$로 두면 $x_n-\alpha=x_{n-1}$이므로 ①에서 $a_n-a_{n-1}=\alpha k\cos(kx_n)=(-1)^n\pi$. 따라서 $a_{11}-a_2=\sum_{n=3}^{11}(-1)^n\pi=-\pi$.
    steps:
    - id: 2a
      content: $a_n-a_{n-1}=\alpha k\cos(kx_n)=(-1)^n\pi$, $a_2=a_1+\pi,\ a_3=a_1,\ \dots,\ a_{11}=a_1\Rightarrow a_{11}-a_2=-\pi$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $x_n-\alpha$는 $x_{n-1}$과 어떤 관계인가?
    - ①에 $x=x_n$을 대입해 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: M26_S.pdf p.3 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        $x_n=\dfrac{2\pi}{k}+n\alpha$ ($n=1,2,3,\cdots$)라 하면 $x_n-\alpha=\dfrac{2\pi}{k}+(n-1)\alpha=x_{n-1}$이므로 식 ①은
        $$a_n-a_{n-1}=x_ng(x_n)-x_{n-1}g(x_{n-1})=\alpha k\cos(kx_n)$$
        이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 조건 $\alpha k=\pi$로부터 $a_n-a_{n-1}=\alpha k\cos(2\pi+n\alpha k)=\pi\cos(2\pi+n\pi)=(-1)^n\pi$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 $a_2=a_1+\pi$, $a_3=a_1$, $a_4=a_1+\pi$, $a_5=a_1$, $\cdots$, $a_{10}=a_1+\pi$, $a_{11}=a_1$에서 $a_{11}-a_2=-\pi$이다.
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules: *id001
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: $x_n-\alpha=x_{n-1}$임을 이용해 식 ①을 $a_n-a_{n-1}=\alpha k\cos(kx_n)$로 나타냈다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2a
    - id: 2.M2
      mark_type: M
      points: 6
      evidence: $\alpha k=\pi$를 대입해 $a_n-a_{n-1}=(-1)^n\pi$를 얻었다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
      - 2a
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: $a_{11}-a_2=-\pi$를 제시했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
      - 2a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: '[논제 3] 함수 $h(x)=-f(x)+\displaystyle\int_0^x(t+x)\,g(x-t)\,dt$가 $x=2\alpha$에서 극값을 갖고 $g(\alpha)=-\dfrac{\pi}{\alpha}$일 때, $\displaystyle\int_0^{2\alpha}g(t)\,dt$의 값을 구하시오.'
  points: 20
  depends_on: []
  answer:
    kind: value
    value: pi/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $x-t=s$로 치환해 $h(x)=-f(x)+2x\int_0^xg-\int_0^xsg(s)\,ds$이므로 $h'(x)=-\alpha k\cos kx+2\int_0^xg+xg(x)$. ①로 $2\alpha g(2\alpha)=-\pi+\alpha k\cos(2\alpha k)$, $h'(2\alpha)=0$에서 $\int_0^{2\alpha}g=\frac\pi2$.
    steps:
    - id: 3a
      content: $h'(x)=-\alpha k\cos kx+2\int_0^xg+xg(x)$, $2\alpha g(2\alpha)=-\pi+\alpha k\cos2\alpha k$, $0=h'(2\alpha)=2\int_0^{2\alpha}g-\pi$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
    hint_ladder:
    - $x-t=s$로 치환하면 $h(x)$는?
    - 극값 조건 $h'(2\alpha)=0$을 쓰자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: M26_S.pdf p.3 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: |
        $x-t=s$로 치환하면
        $$h(x)=-f(x)+\int_0^x(2x-s)g(s)\,ds=-f(x)+2x\int_0^xg(s)\,ds-\int_0^xsg(s)\,ds$$
        이므로 $h'(x)=-\alpha k\cos(kx)+2\displaystyle\int_0^xg(s)\,ds+xg(x)$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 조건 $g(\alpha)=-\dfrac{\pi}{\alpha}$와 식 ①($x=2\alpha$)로부터 $2\alpha g(2\alpha)=\alpha g(\alpha)+\alpha k\cos(2\alpha k)=-\pi+\alpha k\cos(2\alpha k)$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $h(x)$가 $x=2\alpha$에서 극값을 가지므로
        $$0=h'(2\alpha)=-\alpha k\cos(2\alpha k)+2\int_0^{2\alpha}g(s)\,ds+2\alpha g(2\alpha)=2\int_0^{2\alpha}g(s)\,ds-\pi$$
        그러므로 $\displaystyle\int_0^{2\alpha}g(t)\,dt=\dfrac{\pi}{2}$이다.
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules: *id001
    criteria:
    - id: 3.M1
      mark_type: M
      points: 8
      evidence: 치환 $x-t=s$로 $h'(x)=-\alpha k\cos kx+2\int_0^xg+xg(x)$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
      - 3a
    - id: 3.M2
      mark_type: M
      points: 6
      evidence: 식 ①과 $g(\alpha)=-\frac\pi\alpha$로 $2\alpha g(2\alpha)$를 구했다.
      depends_on:
      - 3.M1
      implied_ok: false
      steps:
      - 3b-2
      - 3a
    - id: 3.A1
      mark_type: A
      points: 6
      evidence: $h'(2\alpha)=0$에서 $\int_0^{2\alpha}g(t)\,dt=\frac\pi2$를 제시했다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
      - 3a
    deductions: []
