intent: 적분과 미분의 관계를 이해하고 이를 활용할 수 있는지, 수열의 귀납적 정의를 활용할 수 있는지, 함수의 극값의 특성을 이해하고 있는지를 본다. $\int_{x-\alpha}^xtg(t)dt=f(x)$를 미분해 $G(x)-G(x-\alpha)=\alpha k\cos kx$ ($G=tg$)로 바꾸고, 특정한 $x$ 값을 대입해 $k$, $\alpha$, 점화식 형태의 차 $a_n-a_{n-1}$, 극값 조건에서의 정적분 값을 구한다.
key_idea: $\int_{x-\alpha}^xtg\,dt=f(x)$를 미분하면 $xg(x)-(x-\alpha)g(x-\alpha)=\alpha k\cos kx$ (식 ①). $x=0$, $x=\alpha$, $x=x_n$, $x=2\alpha$를 대입해 세 논제를 푼다.
stuck: 적분 방정식을 그대로 두지 않고 양변을 미분해 식 ①을 얻는 것, [논제 2]에서 $x_n-\alpha=x_{n-1}$로 이웃한 항의 차 $a_n-a_{n-1}$을 만드는 것, [논제 3]에서 $x-t=s$ 치환 후 $h'(2\alpha)=0$을 쓰는 것
