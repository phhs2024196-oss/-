intent: 함수의 미분가능성을 이해하고 있는지, 함수의 연속성을 이해하고 그래프의 개형을 그릴 수 있는지를 본다. 정의역을 구간별로 나누어 각 구간의 최솟값을 구해 $g(t)$를 얻고 꺾임점에서 미분가능성을 판단하며, $g$의 그래프를 이용해 극한으로 정의된 $h$의 불연속점의 개수를 세어 $k$의 범위를 구한다.
key_idea: $t$의 구간으로 나누어 $g(t)=\min$ 을 구하면 $x<\alpha$에서 $e^x-\frac e2$, $x\ge\alpha$에서 $1-e^x$ ($\alpha=\ln\frac{2+e}4$). $h$의 불연속점은 $g=k\pm1$인 점이므로 그래프와 두 직선의 교점 개수로 $k$의 범위를 구한다.
stuck: 절댓값을 포함한 $f$를 $x$와 $t/2$의 대소로 나누는 것, 두 후보 최솟값의 대소 비교로 $\alpha$를 구하는 것, [논제 2]에서 $\lvert g-k\rvert=1$인 점이 모두 불연속점이고 교점 개수를 직선 높이별로 세는 것
