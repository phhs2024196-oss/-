      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1a
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: $f(-x)f(\alpha x)$가 $6$차식임을 이용해 $\beta=6$을 구했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
      - 1a
    - id: 1.A1
      mark_type: A
