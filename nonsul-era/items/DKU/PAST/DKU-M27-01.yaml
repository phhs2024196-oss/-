      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(-3,f(-3))$에서의 접선과 곡선 $y=f(x)$로 둘러싸인 도형의 넓이를 $S$라 할 때,
    $$S=\int_{-3}^{3}\{f(x)-p\}\,dx$$
    를 만족한다. 상수 $p$의 값을 구하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: '-27'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(-3)=-9$, 접선 $y=-9x-27$, 교점 $x=-3,3$이고 $[-3,3]$에서 $f-\ell=-(x+3)^2(x-3)\ge0$이므로 $S=\int(f-\ell)$. $\int_{-3}^3(-p)dx=\int_{-3}^3(9x+27)dx$에서 $p=-27$.
    steps:
    - id: 2a
      content: 접선 $y=-9x-27$, $f-\ell=-(x+3)^2(x-3)\ge0$, $\int_{-3}^3(-p)\,dx=\int_{-3}^3 27\,dx\Rightarrow p=-27$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - 접선의 방정식은?
    - $[-3,3]$에서 $f(x)-\ell(x)$의 부호는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: M27_S.pdf p.3 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: $f'(-3)=-9$이므로 곡선 $y=f(x)$ 위의 점 $\mathrm{P}$에서의 접선 $y=\ell(x)$는 $y=-9(x+3)+f(-3)=-9x-27$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        직선 $y=\ell(x)$와 곡선 $y=f(x)$의 교점의 $x$좌표는 $-x^3-3x^2=-9x-27$에서 $x=-3,\ x=3$이다. 모든 $x\in[-3,3]$에 대하여 $f(x)-\ell(x)=-x^3-3x^2+9x+27=-(x+3)^2(x-3)\ge0$이므로
        $$S=\int_{-3}^3\{f(x)-\ell(x)\}\,dx=\int_{-3}^3\{f(x)-p\}\,dx$$
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 $\displaystyle\int_{-3}^3(-p)\,dx=\int_{-3}^3(9x+27)\,dx=\int_{-3}^3 27\,dx$에서 $p=-27$이다.
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules: *id001
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $f'(-3)=-9$로 접선 $y=-9x-27$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2a
    - id: 2.M2
      mark_type: M
      points: 8
      evidence: 교점 $x=-3,\ 3$과 $[-3,3]$에서 $f-\ell\ge0$임을 보여 $S=\int(f-\ell)dx$로 나타냈다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
      - 2a
    - id: 2.A1
      mark_type: A
      points: 7
      evidence: $\int_{-3}^3(-p)dx=\int_{-3}^3(9x+27)dx$를 풀어 $p=-27$을 제시했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
      - 2a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [논제 3] 다음을 만족시키는 양의 실수 $a$의 값을 구하시오.

    > 점 $\mathrm{Q}(a,f(a))$를 지나고 기울기가 $m$ ($m>0$)인 직선이 $x$축, $y$축과 만나는 점을 각각 $\mathrm{A},\mathrm{B}$라 하고 $\overline{\mathrm{AB}}=g(m)$이라 하면,
    >
    > $g(m)$은 $m=2$에서 최솟값을 갖는다.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: (-3 + sqrt(41))/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\{g(m)\}^2=\left(a-\frac{f(a)}m\right)^2+(f(a)-am)^2$이 $m=2$에서 최소이므로 $h'(2)=0$. $h'(2)=\frac{a^2}4(2+a^2+3a)(-a^2-3a+8)$이고 $a>0$이므로 $a=\frac{-3+\sqrt{41}}2$.
    steps:
    - id: 3a
      content: $h(m)=\{g(m)\}^2$, $h'(m)=2\{am-f(a)\}\left\{\frac{f(a)}{m^3}+a\right\}$, $h'(2)=0\Rightarrow-a^2-3a+8=0\Rightarrow a=\frac{-3+\sqrt{41}}2$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
    hint_ladder:
    - 직선과 두 좌표축의 교점 $\mathrm{A},\mathrm{B}$의 좌표를 $a,m$으로 나타내 보자.
    - $g(m)$ 대신 $\{g(m)\}^2$을 미분하면 편하다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: M27_S.pdf p.3 예시답안 [논제 3]
    steps:
    - id: 3b-1
      content: |
        점 $\mathrm{Q}(a,f(a))$를 지나고 기울기가 $m$인 직선의 방정식은 $y-f(a)=m(x-a)$이고, 이 직선이 $x$축, $y$축과 만나는 점은 각각 $\mathrm{A}\!\left(a-\dfrac{f(a)}m,\,0\right)$, $\mathrm{B}(0,\,f(a)-am)$이다. 따라서
        $$\{g(m)\}^2=\left\{a-\frac{f(a)}m\right\}^2+\{f(a)-am\}^2$$
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $h(m)=\{g(m)\}^2$은 $m=2$에서 최소이므로 제시문 (다)에 의하여 $h'(2)=0$이다.
        $$h'(m)=2\left\{a-\frac{f(a)}m\right\}\frac{f(a)}{m^2}-2a\{f(a)-am\}=2\{am-f(a)\}\left\{\frac{f(a)}{m^3}+a\right\}\ \cdots\cdots(*)$$
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        이므로
        $$0=h'(2)=\frac14\{2a-f(a)\}\{f(a)+8a\}=\frac{a^2}4(2+a^2+3a)(-a^2-3a+8)$$
        $a>0$이므로 $a=\dfrac{-3+\sqrt{41}}2$이다.
      criteria:
      - 3.A1
    - id: 3b-4
      content: ※ $(*)$로부터 방정식 $h'(m)=0$을 만족시키는 양수 $m$은 $\sqrt[3]{\dfrac{f(a)}{-a}}$뿐이고 $\displaystyle\lim_{m\to0+}g(m)=\infty=\lim_{m\to\infty}g(m)$이므로 $g(2)$는 $g(m)$의 최솟값이다.
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules: *id001
    criteria:
    - id: 3.M1
      mark_type: M
      points: 6
      evidence: $\mathrm{A}$, $\mathrm{B}$의 좌표를 구하고 $\{g(m)\}^2$을 $a,m$으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
      - 3a
    - id: 3.M2
      mark_type: M
      points: 7
      evidence: $h(m)=\{g(m)\}^2$을 미분해 $h'(m)$을 구하고 $h'(2)=0$ 조건을 세웠다.
      depends_on:
      - 3.M1
      implied_ok: false
      steps:
      - 3b-2
      - 3a
    - id: 3.A1
      mark_type: A
      points: 7
      evidence: $h'(2)=0$에서 $a=\frac{-3+\sqrt{41}}2$를 구하고 $m=2$에서 최솟값임을 확인했다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
      - 3b-4
      - 3a
    deductions: []
