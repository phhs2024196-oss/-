stimuli:
- label: 가
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: 나
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b\lvert f(x)-g(x)\rvert\,dx$$
- label: 다
  body: 미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면 $f'(a)=0$이다.
stem: |
  [문제 1] 다음 제시문을 읽고 질문에 답하시오. (55점)

  삼차함수 $f(x)=-x^3-3x^2$에 대하여 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    [논제 1] 다음을 만족시키는 $0$이 아닌 실수 $\alpha$, $\beta$, $\gamma$의 값을 구하시오.
    $$\lim_{x\to\infty}\frac{f(\beta x)}{(2x)^{\alpha}}=\lim_{x\to\infty}\frac{f(-x)f(\alpha x)}{x^{\beta}}=\gamma$$
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '[3, 6, -27]'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 분자가 $3$차식이고 극한이 $0$이 아니므로 분모도 $3$차, $\alpha=3$. $f(-x)f(3x)$는 $6$차이므로 $\beta=6$, $\gamma=\lim\frac{f(6x)}{(2x)^3}=-27$.
    steps:
    - id: 1a
      content: $\alpha=3$ (분자 $3$차), $\beta=6$ ($f(-x)f(\alpha x)$가 $6$차), $\gamma=\frac{-216}{8}=-27$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 극한값이 $0$이 아닌 유한값이면 분자·분모의 차수는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: M27_S.pdf p.3 예시답안 [논제 1]
    steps:
    - id: 1b-1
      content: $\displaystyle\lim_{x\to\infty}\frac{f(\beta x)}{(2x)^\alpha}=\gamma\ne0$에서 분자가 $3$차식이므로 분모도 $3$차식이다. 따라서 $\alpha=3$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 마찬가지로 $\displaystyle\lim_{x\to\infty}\frac{f(-x)f(\alpha x)}{x^\beta}=\gamma\ne0$에서 분자 $f(-x)f(3x)$가 $6$차식이므로 $\beta=6$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\gamma=\displaystyle\lim_{x\to\infty}\frac{f(6x)}{(2x)^3}=\lim_{x\to\infty}\frac{-216x^3-108x^2}{8x^3}=-27$이다.
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules: &id001
      ft_scope: cross_subpart_only
      ft_requires_working: true
