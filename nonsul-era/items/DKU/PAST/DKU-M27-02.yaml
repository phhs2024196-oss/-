    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: 교환 논증으로 합이 최대이려면 $a_1<a_2<\dots<a_6$이어야 함을 보였다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1a
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: $k<-1$, $-1<k<0$ 두 경우에서 크기 순서에 따라 $f(n)$을 제시했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
      - 1a
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [논제 2] $a_n=2^{f(n)}$일 때, 꼭짓점이
    $\mathrm{A}(n,n)$, $\mathrm{B}(a_n,n+1)$, $\mathrm{C}(n+1,n+2)$
    인 삼각형의 무게중심을 $\mathrm{G}_n$이라 하자. ($n=1,2,3,4,5,6$)

    다음 조건을 만족시키는 일대일대응인 함수 $f(n)$을 모두 구하시오.

    > 점 $\mathrm{G}_n$ 중 한 점을 제외한 모든 점과 직선 $3x+4y=0$ 사이의 거리의 값이 자연수이다.
  points: 25
  depends_on: []
  answer:
    kind: set
    value: (2,3,1,4,5,6), (2,3,5,4,1,6), (6,3,1,4,5,2), (6,3,5,4,1,2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{G}_n\!\left(\frac{2n+1+2^{f(n)}}3,\,n+1\right)$, 거리 $d=\frac{n+2^{f(n)}}5+n+1$. $d$가 자연수 ⇔ $n+2^{f(n)}$이 $5$의 배수. $n=5$는 불가능하므로 $\mathrm{G}_5$가 제외되는 점이고 나머지에서 $f$를 정한다.
    steps:
    - id: 2a
      content: $d=\frac{n+2^{f(n)}}5+n+1$; $f(1)\in\{2,6\}$, $f(2)=3$, $f(3)\in\{1,5\}$, $f(4)=4$, $f(5)$ 없음, $f(6)\in\{2,6\}$ ⇒ 4개
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - 무게중심의 좌표는?
    - $d$가 자연수일 조건을 $n+2^{f(n)}$의 배수 조건으로 바꿔 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: M27_S.pdf p.4 예시답안 [논제 2]
    steps:
    - id: 2b-1
      content: |
        제시문 (다)에 의하여 무게중심은 $\mathrm{G}_n\!\left(\dfrac{2n+1+2^{f(n)}}{3},\ n+1\right)$이고, $\mathrm{G}_n$과 직선 $3x+4y=0$ 사이의 거리 $d$는
        $$d=\frac{\lvert2n+1+2^{f(n)}+4n+4\rvert}{5}=\frac{n+2^{f(n)}}{5}+n+1$$
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서 $d$가 자연수이려면 $n+2^{f(n)}$이 $5$의 배수이어야 한다. $2^1=2,\ 2^2=4,\ 2^3=8,\ 2^4=16,\ 2^5=32,\ 2^6=64$이므로 각 $n=1,2,3,4,5,6$에 대하여 $n+2^{f(n)}$이 $5$의 배수인 $f(n)$은 다음과 같다.

        $n=1$: $f(1)=2,\ 6$ / $n=2$: $f(2)=3$ / $n=3$: $f(3)=1,\ 5$ / $n=4$: $f(4)=4$ / $n=5$: 없음 / $n=6$: $f(6)=2,\ 6$
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $n=5$에서는 어떤 $f(5)$에 대해서도 조건을 만족시킬 수 없으므로 $\mathrm{G}_5$가 제외되는 한 점이고, $f(1),f(6)$은 $\{2,6\}$을 하나씩, $f(3)$은 $1$ 또는 $5$이며 남은 값이 $f(5)$이다. 따라서 구하는 함수 $f(n)$은
        ① $f(1)=2,\ f(2)=3,\ f(3)=1,\ f(4)=4,\ f(5)=5,\ f(6)=6$
        ② $f(1)=2,\ f(2)=3,\ f(3)=5,\ f(4)=4,\ f(5)=1,\ f(6)=6$
        ③ $f(1)=6,\ f(2)=3,\ f(3)=1,\ f(4)=4,\ f(5)=5,\ f(6)=2$
        ④ $f(1)=6,\ f(2)=3,\ f(3)=5,\ f(4)=4,\ f(5)=1,\ f(6)=2$
      criteria:
      - 2.A1
