intent: 함수의 개념을 이해하고 있는지, 일대일대응의 개념을 이해하고 있는지를 본다. 합이 최대가 되도록 배열하는 문제에서 교환 논증으로 $a_1<\dots<a_6$을 얻어 $k$의 범위별로 $f$를 구하고, 무게중심과 점과 직선 사이의 거리 조건을 정수 조건(배수 조건)으로 바꾸어 일대일대응을 모두 찾는다.
key_idea: 1은 $i<j$, $a_i>a_j$이면 교환해 합이 $(a_i-a_j)(b_j-b_i)>0$만큼 커지므로 $a$가 증가 순서일 때 최대. 2는 $d=\frac{n+2^{f(n)}}5+n+1$이 자연수 ⇔ $5\mid n+2^{f(n)}$으로 각 $n$의 후보를 표로 만든다.
