      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
      - 2a
    - id: 2.A1
      mark_type: A
      points: 8
      evidence: $n=5$가 제외 점임을 파악하고 일대일대응을 만족하는 함수 $4$개를 제시했다.
      depends_on:
      - 2.M2
