key_idea: 접점의 $x$좌표 $t$에 대한 삼차방정식 $l(t)=0$이 서로 다른 세 실근을 가질 조건은 두 극값의 곱이 음수라는 것이고, 이 조건에서 $m$의 허용 범위와 최댓값 $L(k)$가 나온다. 평균값 정리로 $k$를 정하고 극값이 없을 조건은 $h'(x)\ge0$(판별식 $\le0$)이며, 절댓값 적분은 $t$를 $x$ 기준으로 둘로 나눈다.
stuck: 접선의 접점 $t$에 관한 삼차방정식을 세우고 그 실근의 개수를 극값의 부호로 바꾸는 단계, 그리고 $\int_{-1}^{1}|x-t|t^2dt$에서 적분변수 $t$와 매개변수 $x$를 구분해 구간을 나누는 단계.
