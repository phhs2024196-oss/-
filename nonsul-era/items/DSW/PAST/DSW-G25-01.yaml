- id: 1-3
  stem: |-
    [문제 1-3]
    함수 $f(x)$에 대하여 닫힌구간 $[-3,3]$에서 평균값 정리를 만족시키는 상수 $c$의 값이 1일 때, 이차함수 $g(x)=x^2+px+q$ ($p$, $q$는 실수)와 함수 $h(x)=f(x)-g(x)$는 다음 조건을 만족시킨다. 이때, $p$의 최댓값과 $q$의 값을 구하시오.

    (가) 함수 $h(x)$가 극값을 갖지 않는다.

    (나) $-1\le x\le1$일 때, $\displaystyle\int_{-1}^{1}|x-t|qt^2dt$의 최고차항의 계수가 1이다.

    [40점]
  points: 40
  depends_on: []
  answer:
    kind: value
    value: p_max=-4/3; q=6
    equivalents:
    - $p$의 최댓값 $-\dfrac43$, $q=6$
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: 구간 $[-3,3]$에서 평균값 정리를 만족시키는 $c=1$이므로 $\dfrac{f(3)-f(-3)}{3-(-3)}=\dfrac{27+27k-(-27+27k)}{6}=f'(1)$이다. (12)
      source_flow: 문항카드 문항해설·예시 답안 PDF 62~71쪽
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: $f'(1)=3+6k$이므로 $\dfrac{54}{6}=3+6k$, $6k+3=9$, $k=1$이다. 그러므로 $f(x)=x^3+3x^2$이고 $h(x)=f(x)-g(x)=x^3+2x^2-px-q$이다. (13)
