      content: $-1\le x\le1$일 때, $-1\le t\le1$에서 $t\le x$이면 $|x-t|=x-t$, $t>x$이면 $|x-t|=t-x$이다. 즉 $|x-t|=\begin{cases}x-t&(-1\le t\le x)\\t-x&(x<t\le1)\end{cases}$ (17)
