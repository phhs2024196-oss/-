stimuli: []
stem: |-
  점 A$(1,m)$에서 곡선 $f(x)=x^3+3kx^2$에 서로 다른 세 접선을 그을 수 없다고 하자. 아래 그림의 빗금친 부분은 선분 OA와 곡선 $y=f(x)$ 및 $x=1$로 둘러싸여 있다. (단, O는 원점이고, $k$는 양수이고, $m$은 음수이다.)

  [그림 1: $xy$평면에 곡선 $y=f(x)$가 왼쪽 아래에서 올라와 $x<0$에서 극대를 갖고 내려와 원점 O를 지난 뒤 다시 올라가는 삼차곡선이다. 직선 $x=1$이 그려져 있고 그 위 $x$축 아래에 점 A가 있다. 선분 OA와 곡선 $y=f(x)$ 및 직선 $x=1$로 둘러싸인 부분(원점에서 $x=1$까지)에 빗금이 있다.]

  <평균값 정리>

  함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능할 때,

  $$\dfrac{f(b)-f(a)}{b-a}=f'(c)$$

  인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
subparts:
- id: 1-1
  stem: |-
    [문제 1-1]
    곡선 $y=f(x)$에 서로 다른 세 접선을 그을 수 있는 점을 $(1,d)$라 할 때, $d$의 범위를 구하시오.

    [30점]
  points: 30
  depends_on: []
  answer:
    kind: expression
    value: -k**3-3*k**2<d<1+3*k
    equivalents:
    - $-k^3-3k^2<d<1+3k$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: 접점을 $(t,f(t))$라 하면 $f'(x)=3x^2+6kx$이므로 접선의 방정식은 $y=(3t^2+6kt)(x-t)+t^3+3kt^2=(3t^2+6kt)x-2t^3-3kt^2$이다. (1)
      source_flow: 문항카드 문항해설·예시 답안 PDF 62~71쪽
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: 접선이 점 $(1,d)$를 지나므로 $d=(3t^2+6kt)-2t^3-3kt^2$, 즉 $l(t)=2t^3+3(k-1)t^2-6kt+d=0$이다. (2)
      source_flow: 문항카드 문항해설·예시 답안 PDF 62~71쪽
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: $l'(t)=6t^2+6(k-1)t-6k=6(t-1)(t+k)=0$이므로 $t=1,\,-k$에서 극값을 가진다. (3)
      source_flow: 문항카드 문항해설·예시 답안 PDF 62~71쪽
      criteria:
      - 1-1.M3
    - id: 11b-4
      content: '서로 다른 세 접선을 그을 수 있으려면 $l(t)=0$이 서로 다른 세 실근을 가져야 하므로 두 극값의 곱이 음수여야 한다. $l(1)l(-k)<0$ (4) (별해: 최고차항 계수가 $2>0$이고 $k>0$이므로 $t=-k$에서 극대, $t=1$에서 극소이고, $l(t)=-d$ 꼴로 보면 $l(1)<-d<l(-k)$ (4-1).)'
      source_flow: 문항카드 문항해설·예시 답안 PDF 62~71쪽
      criteria:
      - 1-1.M4
    - id: 11b-5
      content: '$l(1)=-1-3k+d$, $l(-k)=k^3+3k^2+d$이므로 $(-1-3k+d)(k^3+3k^2+d)<0$이다. (5) (별해 (5-1): $l(1)=-1-3k$, $l(-k)=k^3+3k^2$.)'
      source_flow: 문항카드 문항해설·예시 답안 PDF 62~71쪽
      criteria:
      - 1-1.M5
    - id: 11b-6
      content: $k>0$이므로 $1+3k>-k^3-3k^2$이다. 따라서 $-k^3-3k^2<d<1+3k$이다. (6)
      source_flow: 문항카드 문항해설·예시 답안 PDF 62~71쪽
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 6
      evidence: '접점을 $(t,f(t))$로 놓고 접선의 방정식 $y=(3t^2+6kt)x-2t^3-3kt^2$을 구했다. # 공식 배점: E 0 문제 의미 모름 / C 3 (1)을 정확히 구하지 못함 / A 6'
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 4
      evidence: '접선이 $(1,d)$를 지난다는 조건으로 $2t^3+3(k-1)t^2-6kt+d=0$(또는 (2-1))을 세웠다. # 공식 배점: E 0 / A 4'
      depends_on:
      - 1-1.M1
      steps:
      - 11b-2
    - id: 1-1.M3
      mark_type: M
      points: 3
      evidence: '$t=1$, $t=-k$를 구했다. # 공식 배점: E 0 / A 3'
      depends_on:
      - 1-1.M2
      steps:
      - 11b-3
    - id: 1-1.M4
      mark_type: M
      points: 7
      evidence: '서로 다른 세 실근 조건을 극값의 곱이 음수($l(1)l(-k)<0$) 또는 $l(1)<-d<l(-k)$로 서술했다. # 공식 배점: E 0 / A 7'
      depends_on:
      - 1-1.M3
      steps:
      - 11b-4
    - id: 1-1.M5
      mark_type: M
      points: 5
      evidence: '세 실근 조건을 $(-1-3k+d)(k^3+3k^2+d)<0$ 등 $d$의 부등식으로 나타냈다. # 공식 배점: E 0 / A 5'
      depends_on:
      - 1-1.M4
      steps:
      - 11b-5
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: '$-k^3-3k^2<d<1+3k$를 구했다. # 공식 배점: E 0 / C 2 $k$가 양수임을 모르고 정확히 구하지 못함 / A 5'
      depends_on:
      - 1-1.M5
      steps:
      - 11b-6
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |-
    [문제 1-2]
    $m$의 최댓값을 $L(k)$라 하자. $m$이 $L(k)$일 때, 그림의 빗금친 부분의 넓이를 $S(k)$라 하자. $S(k)$와 $\displaystyle\lim_{k\to\infty}\dfrac{S(k)}{L(k)}$를 구하시오.

    [30점]
  points: 30
  depends_on: []
  answer:
    kind: value
    value: S=k**3/2+3*k**2/2+k+1/4; L=-k**3-3*k**2; lim=-1/2
    equivalents:
    - $S(k)=\dfrac12k^3+\dfrac32k^2+k+\dfrac14$, $\displaystyle\lim_{k\to\infty}\dfrac{S(k)}{L(k)}=-\dfrac12$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: 식 (6)은 서로 다른 세 접선을 그을 수 있는 범위이므로, 그을 수 없는 범위는 $m\le-k^3-3k^2$ 또는 $m\ge1+3k$이다. (7)
      source_flow: 문항카드 문항해설·예시 답안 PDF 62~71쪽
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: $m<0$, $k>0$이므로 $m\le-k^3-3k^2$이고, $m$의 최댓값은 $L(k)=-k^3-3k^2$이다. (8)
      source_flow: 문항카드 문항해설·예시 답안 PDF 62~71쪽
      criteria:
      - 1-2.A1
    - id: 12b-3
      content: '원점 O와 $\mathrm{A}(1,-k^3-3k^2)$를 지나는 일차함수는 $r(x)=(-k^3-3k^2)x$이다. (9) (별해 (9-1): 삼각형의 넓이 $\dfrac12(k^3+3k^2)$를 이용.)'
      source_flow: 문항카드 문항해설·예시 답안 PDF 62~71쪽
      criteria:
      - 1-2.M2
    - id: 12b-4
      content: '$S(k)=\displaystyle\int_0^1\{f(x)-r(x)\}dx=\int_0^1\{x^3+3kx^2+(k^3+3k^2)x\}dx=\dfrac14+k+\dfrac{k^3+3k^2}{2}=\dfrac12k^3+\dfrac32k^2+k+\dfrac14$이다. (10) (별해 (10-1): $\displaystyle\int_0^1f(x)dx+\dfrac12(k^3+3k^2)$.)'
      source_flow: 문항카드 문항해설·예시 답안 PDF 62~71쪽
      criteria:
      - 1-2.A2
    - id: 12b-5
      content: $\displaystyle\lim_{k\to\infty}\dfrac{S(k)}{L(k)}=\lim_{k\to\infty}\dfrac{\frac12k^3+\frac32k^2+k+\frac14}{-k^3-3k^2}=-\dfrac12$이다. (11)
      source_flow: 문항카드 문항해설·예시 답안 PDF 62~71쪽
      criteria:
      - 1-2.A3
