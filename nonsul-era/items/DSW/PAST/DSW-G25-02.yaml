    - id: 23b-5
      content: $n=2$일 때 $\dfrac{16}{25}\approx0.64$, $n=3$일 때 $\left(\dfrac{16}{25}\right)^2\approx0.40$, $n=4$일 때 $\left(\dfrac{16}{25}\right)^3\approx0.26$, $n=5$일 때 $\left(\dfrac{16}{25}\right)^4\approx0.16<0.18<\dfrac2{11}$이다. 그러므로 $n=5$이다. (24)
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
