      evidence: '직선 P$_2$Q$_2$의 식 $y=-2x+\dfrac{16}5$을 세워 OP와의 교점 P$_2=\left(\dfrac{32}{25},\dfrac{16}{25}\right)$을 구했다. # 공식 배점: E 0 / D 2 직선 P$_2$Q$_2$의 식 / C 4 교점 구하는 식 / B 6 풀이 미완 / A 9 교점 완성'
      steps:
