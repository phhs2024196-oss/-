    - id: 23b-4
      content: 이것이 $\dfrac5{11}$보다 크므로 $1-\left(\dfrac{16}{25}\right)^{n-1}>\dfrac4{11}\times\dfrac94=\dfrac9{11}$, 즉 $\left(\dfrac{16}{25}\right)^{n-1}<\dfrac2{11}\approx0.18$이다. (22), (23)
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
