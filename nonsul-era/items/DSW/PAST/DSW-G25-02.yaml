stimuli: []
stem: |-
  세 꼭짓점이 O$(0,0)$, P$(2,1)$, Q$\left(\dfrac{24}{11},0\right)$인 삼각형 POQ가 있다. 점 P에서 선분 OQ에 내린 수선의 발을 Q$_1$, 점 Q$_1$에서 선분 OP에 내린 수선의 발을 P$_1$이라 하자. 아래 그림과 같이 이 과정을 반복하여 선분 OP 위의 점 P$_1$, P$_2$, P$_3$, $\cdots$와 선분 OQ 위의 점 Q$_1$, Q$_2$, Q$_3$, $\cdots$를 잡자. 이때 삼각형 PQ$_1$Q의 넓이를 $A_1$, 삼각형 P$_1$Q$_2$Q$_1$의 넓이를 $A_2$, 삼각형 P$_2$Q$_3$Q$_2$의 넓이를 $A_3$, $\cdots$라고 하자.

  [그림 1: 원점 O에서 오른쪽 위로 뻗은 선분 OP와 $x$축 위의 선분 OQ가 있다. $x$축 위에 오른쪽부터 Q, Q$_1$, Q$_2$, Q$_3$, Q$_4$, Q$_5$, $\cdots$가 있고 각 Q$_n$에서 선분 OP까지 수직선을 그어 P$_n$을 잡았다. 또 각 P$_n$에서 Q$_{n+1}$로 선분을 이어 직각삼각형들이 이어져 있으며, 삼각형 PQ$_1$Q, P$_1$Q$_2$Q$_1$, P$_2$Q$_3$Q$_2$, P$_3$Q$_4$Q$_3$, P$_4$Q$_5$Q$_4$, $\cdots$에 각각 $A_1,A_2,A_3,A_4,A_5,\cdots$가 표시되어 있다.]
subparts:
- id: 2-1
  stem: |-
    [문제 2-1]
    두 점 P$_1$과 Q$_1$을 지나는 직선의 방정식을 구하고, 삼각형 P$_1$Q$_2$Q$_1$의 넓이 $A_2$를 구하시오.

    [20점]
  points: 20
  depends_on: []
  answer:
    kind: value
    value: line=-2*x+4; A2=4/25
    equivalents:
    - 직선 $y=-2x+4$, $A_2=\dfrac4{25}$
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: P$=(2,1)$이므로 Q$_1=(2,0)$이다. 직선 OP의 기울기가 $\dfrac12$이므로 직선 P$_1$Q$_1$은 기울기가 $-2$이고 $(2,0)$을 지난다. 따라서 $y=-2(x-2)$, 즉 $y=-2x+4$이다. (1)
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: 직선 OP의 식은 $y=\dfrac12x$이다. 이 두 직선의 교점은 $-2x+4=\dfrac12x$에서 $x=\dfrac85$, $y=\dfrac45$이다. (2) 즉 P$_1=\left(\dfrac85,\dfrac45\right)$이고, Q$_2=\left(\dfrac85,0\right)$이다.
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
      criteria:
      - 2-1.A1
    - id: 21b-3
      content: 삼각형 P$_1$Q$_2$Q$_1$의 넓이는 $A_2=\dfrac12\times\overline{\mathrm{P_1Q_2}}\times\overline{\mathrm{Q_2Q_1}}=\dfrac12\times\dfrac45\times\left(2-\dfrac85\right)=\dfrac4{25}$이다. (3)
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
      criteria:
      - 2-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 6
      evidence: '직선 P$_1$Q$_1$의 식 $y=-2x+4$를 구했다(수선의 기울기 $-2$와 지나는 점 $(2,0)$). # 공식 배점: E 0 / D 1 직선 OP의 기울기 / C 3 기울기나 지나는 점 / B 5 기울기와 지나는 점 / A 6 식 완성'
      steps:
      - 21b-1
    - id: 2-1.A1
      mark_type: A
      points: 8
      evidence: '직선 OP와 P$_1$Q$_1$의 교점 P$_1=\left(\dfrac85,\dfrac45\right)$을 구했다. # 공식 배점: E 0 / D 2 직선 OP의 식 / C 4 교점 구하는 식 / B 6 풀이 미완 / A 8'
      depends_on:
      - 2-1.M1
      steps:
      - 21b-2
    - id: 2-1.A2
      mark_type: A
      points: 6
      evidence: '삼각형의 넓이 $A_2=\dfrac4{25}$를 구했다. # 공식 배점: E 0 / D 1 밑변이나 높이 / C 3 밑변과 높이 / B 4 미완 / A 6'
      depends_on:
      - 2-1.M1
      steps:
      - 21b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |-
    [문제 2-2]
    모든 자연수 $n$에 대하여 점 P$_n$의 좌표를 $(x_n,y_n)$이라 할 때, $x_n$을 구하고, 구한 식을 수학적 귀납법을 이용하여 증명하시오.

    [50점]
  points: 50
  depends_on: []
  answer:
    kind: expression
    value: 8/5*(4/5)**(n-1)
    equivalents:
    - $x_n=\dfrac85\left(\dfrac45\right)^{n-1}$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: 직선 OP에 수직인 직선 P$_2$Q$_2$, P$_3$Q$_3$, P$_4$Q$_4$, $\cdots$의 기울기도 $-2$이다. Q$_2=\left(\dfrac85,0\right)$이므로 직선 P$_2$Q$_2$의 식은 $y=-2\left(x-\dfrac85\right)$, 즉 $y=-2x+\dfrac{16}5$이다. (4)
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: 이 직선이 직선 OP와 만나는 점은 $-2x+\dfrac{16}5=\dfrac12x$에서 $x=\dfrac{32}{25}$, $y=\dfrac{16}{25}$이다. 즉 P$_2=\left(\dfrac{32}{25},\dfrac{16}{25}\right)$, Q$_3=\left(\dfrac{32}{25},0\right)$이다. (5)
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
      criteria:
      - 2-2.M1
    - id: 22b-3
      content: '$x_1=\dfrac85$, $x_2=\dfrac{32}{25}$이므로 $x_k$는 공비가 $\dfrac45$인 등비수열임을 유추할 수 있다. 즉 $n\ge1$일 때 $x_n=\dfrac85\times\left(\dfrac45\right)^{n-1}$이다. (6) (별해: 닮은 삼각형으로 $x_1=2\left(\dfrac2{\sqrt5}\right)^2$, $x_2=2\left(\dfrac2{\sqrt5}\right)^4$, 공비 $\left(\dfrac2{\sqrt5}\right)^2=\dfrac45$; 또는 $\cos\theta=\dfrac2{\sqrt5}$, $\sin\theta=\dfrac1{\sqrt5}$를 이용해 $x_1=2\cos^2\theta$, 매 단계 $\cos^2\theta$배.)'
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
      criteria:
      - 2-2.M2
      - 2-2.A1
    - id: 22b-4
      content: 수학적 귀납법으로 증명한다. (i) $k=1$일 때 $x_1=\dfrac85$임을 (1)에서 보였다.
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
      criteria:
      - 2-2.R1
    - id: 22b-5
      content: (ii) $k\ge2$일 때 $x_k=\dfrac85\times\left(\dfrac45\right)^{k-1}$이라고 하고 $x_{k+1}=\dfrac85\times\left(\dfrac45\right)^k$임을 보이자. Q$_{k+1}=\left(\dfrac85\times\left(\dfrac45\right)^{k-1},0\right)$이므로 P$_{k+1}$Q$_{k+1}$을 지나는 직선은 기울기가 $-2$이므로 $y=-2\left\{x-\dfrac85\times\left(\dfrac45\right)^{k-1}\right\}$, 즉 $y=-2x+2\times\dfrac85\times\left(\dfrac45\right)^{k-1}$이다. (7) 이 직선과 $y=\dfrac12x$가 만나는 점은 $\dfrac52x=2\times\dfrac85\times\left(\dfrac45\right)^{k-1}$이므로 $x=\dfrac85\times\dfrac45\times\left(\dfrac45\right)^{k-1}=\dfrac85\times\left(\dfrac45\right)^k$이다. (8) 즉 $x_{k+1}=\dfrac85\times\left(\dfrac45\right)^k$이다. (9)
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
      criteria:
      - 2-2.R2
    - id: 22b-6
      content: 그러므로 (i), (ii)에 의해 모든 자연수 $n$에 대하여 $x_n=\dfrac85\times\left(\dfrac45\right)^{n-1}$이 성립한다.
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
      criteria:
      - 2-2.R2
