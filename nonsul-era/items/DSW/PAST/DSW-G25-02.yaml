key_idea: 수선의 발을 잡는 과정을 한 번 해 보면 $P_1$의 $x$좌표가 $\dfrac85$이고 $\overline{OQ_{n+1}}=\dfrac45\overline{OQ_n}$ 꼴(공비 $\dfrac45$)이므로 $x_n=\dfrac85\left(\dfrac45\right)^{n-1}$이며, 넓이는 닮음비 $\dfrac45$의 제곱 $\dfrac{16}{25}$배씩 줄어드는 등비수열이다.
stuck: $x_n$의 일반항을 유추하는 단계(처음 두 점을 직접 구해 공비를 찾기), 수학적 귀납법의 귀납 단계에서 $P_{k+1}Q_{k+1}$의 식을 세우는 단계, $\left(\dfrac{16}{25}\right)^{n-1}<\dfrac{2}{11}$을 만족하는 최소의 $n$을 대입으로 찾는 단계.
