      evidence: '$x_1$, $x_2$를 이용해 공비 $\dfrac45$인 등비수열임을 유추했다. # 공식 배점: E 0 / B 4 $x_1,x_2$로 공비를 구하려 노력 / A 6 공비 $\dfrac45$ 유추'
      depends_on:
      - 2-2.M1
      steps:
      - 22b-3
    - id: 2-2.A1
      mark_type: A
      points: 4
      evidence: '일반항 $x_n=\dfrac85\times\left(\dfrac45\right)^{n-1}$을 구했다. # 공식 배점: E 0 / B 2 일반항을 구하려 노력 / A 4'
      depends_on:
      - 2-2.M2
      steps:
      - 22b-3
    - id: 2-2.R1
      mark_type: R
      points: 11
      evidence: '귀납법 (i): $n=1$일 때 $x_1=\dfrac85$임을 보였다. # 공식 배점: E 0 / B 7 귀납법 사용 시작 / A 11 초기 조건 (i) 완전'
      steps:
      - 22b-4
    - id: 2-2.R2
      mark_type: R
      points: 20
      evidence: '귀납법 (ii): $x_k$가 성립한다고 가정하고 P$_{k+1}$Q$_{k+1}$의 직선 $y=-2x+2\times\dfrac85\left(\dfrac45\right)^{k-1}$과 OP의 교점으로 $x_{k+1}$을 구해 결론지었다. # 공식 배점: E 0 / D 6 (ii)에서 보일 것을 앎 / C 11 P$_{k+1}$Q$_{k+1}$의 직선 / B 16 그 직선과 OP의 교점 / A 20 (ii) 완전'
      steps:
      - 22b-5
      - 22b-6
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-3
  stem: |-
    [문제 2-3]
    $k\ge2$인 자연수 $k$에 대하여 삼각형 P$_{k-1}$Q$_k$Q$_{k-1}$의 넓이 $A_k$를 구하고, $A_1+\displaystyle\sum_{i=2}^{n}A_i>\dfrac5{11}$를 만족시키는 자연수 $n$의 최솟값을 구하시오.

    [30점]
  points: 30
  depends_on: []
  answer:
    kind: value
    value: A1=1/11; A_k=2**(4*k-6)/5**(2*k-2); n=5
    equivalents:
    - $A_k=\dfrac{2^{4k-6}}{5^{2k-2}}$ ($k\ge2$), $n$의 최솟값 5
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: 삼각형 PQ$_1$Q의 넓이는 $A_1=\dfrac12\times\dfrac2{11}\times1=\dfrac1{11}$이다. (18)
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
      criteria:
      - 2-3.B1
    - id: 23b-2
      content: $k\ge1$일 때 P$_k=\left(\dfrac85\left(\dfrac45\right)^{k-1},\dfrac45\left(\dfrac45\right)^{k-1}\right)$, Q$_{k+1}=\left(\dfrac85\left(\dfrac45\right)^{k-1},0\right)$이다. (19) $k\ge2$일 때 $A_k=\dfrac12\times\overline{\mathrm{P_{k-1}Q_k}}\times\overline{\mathrm{Q_kQ_{k-1}}}=\dfrac12\times\dfrac45\left(\dfrac45\right)^{k-2}\times\left\{\dfrac85\left(\dfrac45\right)^{k-3}-\dfrac85\left(\dfrac45\right)^{k-2}\right\}=\dfrac12\times\dfrac45\left(\dfrac45\right)^{k-2}\times\dfrac85\left(\dfrac45\right)^{k-3}\times\left(1-\dfrac45\right)=\dfrac{2^{4k-6}}{5^{2k-2}}$이다. (20)
      source_flow: 문항카드 문항해설·예시 답안 PDF 72~83쪽
      criteria:
      - 2-3.B2
    - id: 23b-3
      content: $A_k$는 첫째항 $A_2=\dfrac4{25}$, 공비 $\dfrac{16}{25}$인 등비수열이므로 $\displaystyle\sum_{k=1}^{n}A_k=A_1+\sum_{k=2}^{n}A_k=\dfrac1{11}+\dfrac4{25}\times\dfrac{1-\left(\frac{16}{25}\right)^{n-1}}{1-\frac{16}{25}}=\dfrac1{11}+\dfrac49\left\{1-\left(\dfrac{16}{25}\right)^{n-1}\right\}$이다. (21)
