stem: |
  반지름의 길이가 1인 원에 아래의 조건을 만족하는 도형을 그린다. 수열 $\{a_n\}$의 일반항은 $a_n=3n+3$ ($n=1, 2, 3, \cdots$)이다.

  (가) 첫 번째 시행에서는, 반지름의 길이가 $r_1$인 $a_n$개의 원을 서로 외접하면서 반지름의 길이가 1인 원에 내접하게 그린다.

  (나) 두 번째 시행에서는, 첫 번째 시행된 결과에 추가로 반지름의 길이가 $r_2$(단, $r_1>r_2$)인 $a_n$개의 원들을 서로 외접하며, 첫 번째 시행의 결과에 모두 외접하게 [그림 1]과 같이 그린다.

  (다) 이와 같은 방법으로 $k$번 시행을 반복할 때, 시행 별로 그려진 원의 반지름 길이는 $r_k$이고, 원들은 [그림 1], [그림 2]와 같이 그린다.

  (라) [그림 1], [그림 2]와 같이 $k$번째 시행에서 그려진 원의 둘레의 길이의 총합을 $C_k$라 하고, 원의 넓이의 총합을 $S_k$라 한다.

  [그림 1: $n=2$, $k=2$일 때, $C_2$는 두 번째 시행에서 그려진 9개 원의 둘레의 길이의 총합]
  [그림 2: $n=1$, $k=3$일 때, $S_3$은 세 번째 시행에서 그려진 6개 원의 넓이의 총합]
subparts:
- id: 1-1
  stem: |
    $n=1$, $k=2$일 때, $S_2$와 $C_2$의 값을 각각 구하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: value
    value: S2=2*pi/27; C2=4*pi/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $n=1$이므로 $a_1=6$이다. 반지름 1인 원의 중심을 O, 첫 시행의 원 하나의 중심을 $\mathrm{O}_1$, 이웃한 원과의 접점을 T라 하면 $\angle\mathrm{AOB}=\dfrac{\pi}{3}$이므로 $\angle\mathrm{AOC}=\dfrac{\pi}{6}$이고, $\triangle\mathrm{OO_1T}$에서 $(1-r_1)\sin\dfrac{\pi}{6}=r_1$, $1-r_1=2r_1$이므로 $r_1=\dfrac13$이다. (1)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 82~90쪽
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        두 번째 시행의 원 중심 $\mathrm{O}_2$에서 선분 $\mathrm{O_1T}$에 내린 수선의 발을 H라 하면 $\triangle\mathrm{O_2O_1H}$에서 $(r_1+r_2)\sin\dfrac{\pi}{6}=r_1-r_2$이므로 $r_2=\dfrac19$이다. (2) (별해: 닮음 $1:\dfrac13=\dfrac13:r_2$ 로도 $r_2=\dfrac19$)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 82~90쪽
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        $S_2=6\times\pi\times\dfrac{1}{81}$, $C_2=6\times2\times\pi\times\dfrac19$이므로 $S_2=\dfrac{2}{27}\pi$, $C_2=\dfrac{4}{3}\pi$이다. (3)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 82~90쪽
      criteria:
      - 1-1.M3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: 삼각함수로 $r_1$에 관한 식 (1) 또는 (4)를 세우고 $r_1=\dfrac13$을 구한다. (식만 세우면 2점, 식과 $r_1$을 정확히 구하면 3점)
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 4
      evidence: $r_1$과 $r_2$의 관계 (2) 또는 (5) 또는 (6)을 세우고 $r_2=\dfrac19$를 구한다. (식만 세우면 3점, $r_2$까지 정확히 구하면 4점)
      steps:
      - 11b-2
    - id: 1-1.M3
      mark_type: M
      points: 2
      evidence: (3)과 같이 원의 넓이·둘레 공식으로 $S_2$, $C_2$를 구한다. (하나만 정확하면 1점, 둘 다 정확하면 2점)
      steps:
      - 11b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    $n=1$, $k=10$일 때, $\displaystyle\sum_{k=1}^{10}S_k$와 $\displaystyle\sum_{k=1}^{10}C_k$의 값을 각각 구하시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: value
    value: SS=3*pi/4*(1-(1/9)**10); CC=6*pi*(1-(1/3)**10)
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        1-1과 같으므로 $(r_k+r_{k+1})\sin\dfrac{\pi}{6}=r_k-r_{k+1}$, 곧 $r_{k+1}=\dfrac13 r_k$이다. (7) $r_1=\dfrac13$이므로 $r_k=\dfrac13\times\left(\dfrac13\right)^{k-1}=\left(\dfrac13\right)^k$이다.
      source_flow: 문항카드 문항 해설·예시 답안 PDF 82~90쪽
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $\displaystyle\sum_{k=1}^{10}S_k=a_1\sum_{k=1}^{10}\pi r_k^2=6\pi\left\{\left(\dfrac13\right)^2+\left(\dfrac13\right)^4+\cdots+\left(\dfrac13\right)^{20}\right\}$ (8), $\displaystyle\sum_{k=1}^{10}C_k=a_1\sum_{k=1}^{10}2\pi r_k=4\pi\left\{1+\dfrac13+\left(\dfrac13\right)^2+\cdots+\left(\dfrac13\right)^9\right\}$ (10)이다.
      source_flow: 문항카드 문항 해설·예시 답안 PDF 82~90쪽
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        등비수열의 합 공식으로 $\displaystyle\sum_{k=1}^{10}S_k=6\pi\times\left(\dfrac13\right)^2\times\dfrac{1-\left(\frac19\right)^{10}}{1-\frac19}=\dfrac34\pi\left\{1-\left(\dfrac19\right)^{10}\right\}=\dfrac34\pi\left\{1-\left(\dfrac13\right)^{20}\right\}$ (9), $\displaystyle\sum_{k=1}^{10}C_k=4\pi\times\dfrac{1-\left(\frac13\right)^{10}}{1-\frac13}=6\pi\left\{1-\left(\dfrac13\right)^{10}\right\}$ (11)이다.
      source_flow: 문항카드 문항 해설·예시 답안 PDF 82~90쪽
      criteria:
      - 1-2.M2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 6
      evidence: (7)과 같이 $r_k$와 $r_{k+1}$의 관계를 구하고 $r_k$의 일반항 $\left(\dfrac13\right)^k$를 구한다. ($r_1$, $r_2$만 구해 일반항을 구하면 3점, 관계 (7)만 구하면 5점, 관계와 일반항까지 6점)
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 6
      evidence: (8), (9), (10), (11)로 $\sum S_k$, $\sum C_k$를 구한다. (넓이 합·둘레 합 중 하나만 식으로 나타내면 1점, 둘 다 식으로 나타내면 2점, 둘 다 식으로 나타내고 하나만 구하면 4점, 둘 다 구하면 6점)
      steps:
      - 12b-2
      - 12b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-3
  stem: |
    $n=N$일 때, $k$번째 시행에서 그려진 원의 반지름의 길이의 일반항 $r_k$를 구하시오. [19점]
  points: 19
  depends_on: []
  answer:
    kind: value
    value: (sin(pi/(3*N+3))/(1+sin(pi/(3*N+3))))*((1-sin(pi/(3*N+3)))/(1+sin(pi/(3*N+3))))**(k-1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $a_N=3N+3$개의 원이 반지름 1인 원을 균등하게 나누므로 $\angle\mathrm{AOB}=\dfrac{2\pi}{3N+3}=\dfrac{2\pi}{a_N}$, $\angle\mathrm{AOC}=\dfrac{\pi}{3N+3}=\dfrac{\pi}{a_N}$이다. (12) $\alpha=\sin\dfrac{\pi}{3N+3}=\sin\dfrac{\pi}{a_N}$로 정의한다. (13)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 82~90쪽
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        $\triangle\mathrm{OO_1T}$에서 $(1-r_1)\alpha=r_1$이므로 첫째항 $r_1=\dfrac{\alpha}{1+\alpha}$이다. (14) 일반의 $k$번째와 $(k+1)$번째 원에 대해 $\triangle\mathrm{O_{k+1}O_kH}$에서 $\alpha=\sin\dfrac{\pi}{a_N}=\dfrac{r_k-r_{k+1}}{r_k+r_{k+1}}$ (15), 이를 $r_k$에 대해 정리하면 $r_{k+1}=\dfrac{1-\alpha}{1+\alpha}\times r_k$ (16)이므로 공비는 $\dfrac{1-\alpha}{1+\alpha}$이다.
      source_flow: 문항카드 문항 해설·예시 답안 PDF 82~90쪽
      criteria:
      - 1-3.M2
    - id: 13b-3
      content: |
        따라서 $r_k=\left(\dfrac{\alpha}{1+\alpha}\right)\times\left(\dfrac{1-\alpha}{1+\alpha}\right)^{k-1}$ (단, $\alpha=\sin\dfrac{\pi}{a_N}=\sin\dfrac{\pi}{3N+3}$)이다. (17)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 82~90쪽
      criteria:
      - 1-3.M3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 5
      evidence: (12), (13)과 같이 $a_N$으로 영역을 균등하게 분할하는 사잇각과 $\sin\dfrac{\pi}{a_N}=\alpha$(혹은 적당한 변수)를 표현한다. ($\angle\mathrm{AOB}$와 $\angle\mathrm{AOC}$를 $\dfrac{2\pi}{3N+3}$ 또는 $\dfrac{\pi}{a_N}$으로 표현하면 3점, $\alpha$로 표현까지 5점)
      steps:
      - 13b-1
    - id: 1-3.M2
      mark_type: M
      points: 8
      evidence: (14), (15), (16)과 같이 첫째항과 $\alpha$를 구하고 귀납적 정의로 공비를 구한다. (첫째항 $r_1$을 $\alpha$로 표현하면 3점, $\alpha$를 $r_k$와 $r_{k+1}$로 표현하면 5점, (16)까지 정확히 구하면 8점)
      steps:
      - 13b-2
    - id: 1-3.M3
      mark_type: M
      points: 6
      evidence: (17)과 같이 $r_k$를 $\alpha$와 $k$에 대한 등비수열의 일반항으로 구하고 $\alpha$의 정의를 명시한다. (일반항만 구하면 4점, $\alpha$의 정의까지 명시하면 6점)
      steps:
      - 13b-3
