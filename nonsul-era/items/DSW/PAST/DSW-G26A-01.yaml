key_idea: |
  반직선 위에 중심이 놓인 인접 두 원이 외접하고 같은 반직선·인접 반직선에 접하므로 $\sin\dfrac{\pi}{a_N}=\alpha$로 두면 $\alpha=\dfrac{r_k-r_{k+1}}{r_k+r_{k+1}}$, 곧 $r_{k+1}=\dfrac{1-\alpha}{1+\alpha}r_k$인 등비수열이 된다.
stuck: |
  시행마다 원이 $a_n$개씩 늘어난다고 보고 반지름의 관계를 세우지 못하거나, 각 $\dfrac{2\pi}{a_N}$를 이등분한 각 $\dfrac{\pi}{a_N}$를 쓰지 못한다.
