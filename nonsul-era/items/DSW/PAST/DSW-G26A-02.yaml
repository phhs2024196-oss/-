stimuli: []
stem: |
  양수 $a$ ($0<a<1$)에 대하여 실수 전체에서 정의된 함수

  $f(x)=\begin{cases}ax^2 & (x<0)\\ -ax^2 & (x\ge0)\end{cases}$

  가 있다. 0이 아닌 실수 $t$에 대하여 곡선 $y=-(x-t)^2+f(t)$는 함수 $y=f(x)$의 그래프와 서로 다른 두 점 A, B에서 만나고, 두 점 A, B의 $x$좌표를 각각 $x_1$, $x_2$라 하면 곡선 $y=-(x-t)^2+f(t)$와 $x$축 및 두 직선 $x=x_1$, $x=x_2$로 둘러싸인 부분의 넓이는 $S(t)$이다.
subparts:
- id: 2-1
  stem: |
    $a=\dfrac12$일 때, $S(-2)$와 $S(2)$의 값을 각각 구하시오. [14점]
  points: 14
  depends_on: []
  answer:
    kind: value
    value: S(-2)=152/81; S(2)=88/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $a=\dfrac12$이면 $f(x)=\begin{cases}\dfrac12x^2&(x<0)\\-\dfrac12x^2&(x\ge0)\end{cases}$이다. $t=-2$일 때 곡선 $y=-(x+2)^2+2$와 $y=f(x)$가 만나는 점의 $x$좌표는 $-(x+2)^2+2=\dfrac12x^2$을 정리한 $\dfrac32x^2+4x+2=0$에서 $x=-2$ 또는 $x=-\dfrac23$이다. (1) (일반으로는 $t<0$일 때 $\dfrac32x^2-2tx+\dfrac12t^2=0$에서 $x=t$ 또는 $x=\dfrac t3$)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 91~100쪽
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $S(-2)=\displaystyle\int_{-2}^{-\frac23}\left|-(x+2)^2+2\right|dx$ (3) $=\left[-\dfrac13x^3-2x^2-2x\right]_{-2}^{-\frac23}=\dfrac{152}{81}$이다. (4)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 91~100쪽
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        $t=2$일 때 곡선 $y=-(x-2)^2-2$와 $y=f(x)$가 만나는 점의 $x$좌표는 $-(x-2)^2-2=-\dfrac12x^2$을 정리한 $\dfrac12x^2-4x+6=0$에서 $x=2$ 또는 $x=6$이다. (2) (일반으로는 $t>0$일 때 $\dfrac12x^2-2tx+\dfrac32t^2=0$에서 $x=t$ 또는 $x=3t$)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 91~100쪽
      criteria:
      - 2-1.M3
    - id: 21b-4
      content: |
        $S(2)=\displaystyle\int_2^6\left|-(x-2)^2-2\right|dx$ (5) $=\left[\dfrac13x^3-2x^2+6x\right]_2^6=\dfrac{88}{3}$이다. (6)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 91~100쪽
      criteria:
      - 2-1.M4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 3
      evidence: $t=-2$일 때 두 교점의 $x$좌표 $-2$, $-\dfrac23$을 구한다. (방정식 $\dfrac12x^2=-(x+2)^2+2$만 쓰면 1점, 두 $x$좌표까지 구하면 3점)
      steps:
      - 21b-1
    - id: 2-1.M2
      mark_type: M
      points: 4
      evidence: $t=-2$일 때 넓이 (4)를 구한다. (적분식 (3)만 쓰면 1점, 적분값까지 구하면 4점)
      steps:
      - 21b-2
    - id: 2-1.M3
      mark_type: M
      points: 3
      evidence: $t=2$일 때 두 교점의 $x$좌표 $2$, $6$을 구한다. (방정식 $-\dfrac12x^2=-(x-t)^2-2$만 쓰면 1점, 두 $x$좌표까지 구하면 3점)
      steps:
      - 21b-3
    - id: 2-1.M4
      mark_type: M
      points: 4
      evidence: $t=2$일 때 넓이 (6)을 구한다. (적분식 (5)만 쓰면 1점, 적분값까지 구하면 4점)
      steps:
      - 21b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    $t<0$이면 $\dfrac{S(t)}{t^3}=-g(a)$이다. $g(a)=\dfrac{6a^4+pa^3+qa^2+ra+s}{3(1+a)^3}$일 때, 네 정수 $p$, $q$, $r$, $s$의 값을 각각 구하시오. [21점]
  points: 21
  depends_on: []
  answer:
    kind: value
    value: p=4; q=6; r=0; s=0
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $t<0$이면 곡선 $y=-(x-t)^2+at^2$과 $y=f(x)$의 교점의 $x$좌표는 $-(x-t)^2+at^2=ax^2$, 곧 $(a+1)x^2-2tx+t^2-at^2=0$에서 $x=t$ 또는 $x=\dfrac{1-a}{1+a}t$이다. (7)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 91~100쪽
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        $t<0$, $0<a<1$이므로 $t<\dfrac{1-a}{1+a}t$이다. (8) 따라서 $S(t)=\displaystyle\int_t^{\frac{1-a}{1+a}t}\left|-(x-t)^2+at^2\right|dx=\int_t^{\frac{1-a}{1+a}t}\left\{-(x-t)^2+at^2\right\}dx$ (9)이다.
      source_flow: 문항카드 문항 해설·예시 답안 PDF 91~100쪽
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: |
        $S(t)=\left[-\dfrac13x^3+tx^2+(at^2-t^2)x\right]_t^{\frac{1-a}{1+a}t}$ (10)를 계산하면 $S(t)=-\dfrac{t^3}{3}\times\dfrac{6a^4+4a^3+6a^2}{(1+a)^3}$이다. (11)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 91~100쪽
      criteria:
      - 2-2.M2
    - id: 22b-4
      content: |
        $\dfrac{S(t)}{t^3}=-g(a)=-\dfrac{6a^4+4a^3+6a^2}{3(1+a)^3}$ (12)이므로 $g(a)=\dfrac{6a^4+4a^3+6a^2}{3(1+a)^3}$ (13)이고 $p=4$, $q=6$, $r=0$, $s=0$이다. (14)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 91~100쪽
      criteria:
      - 2-2.M3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 5
      evidence: $t<0$에서 두 교점의 $x$좌표 (7)을 구한다. (방정식 $ax^2=-(x-t)^2+at^2$만 쓰면 1점, 두 $x$좌표까지 구하면 5점)
      steps:
      - 22b-1
    - id: 2-2.M2
      mark_type: M
      points: 8
      evidence: $S(t)$를 구한다. (부등식 (8)을 고려해 적분식 (9)를 표현하면 4점, 적분값을 구해 넓이 (11)을 표현하면 8점)
      steps:
      - 22b-2
      - 22b-3
    - id: 2-2.M3
      mark_type: M
      points: 8
      evidence: $S(t)$로부터 $g(a)$를 계산해 $p$, $q$, $r$, $s$를 구한다. (한 개 구하면 2점, 두 개 4점, 세 개 6점, 네 개 모두 구하면 8점)
      steps:
      - 22b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-3
  stem: |
    $\dfrac{S(t)}{t^3}=\begin{cases}-g(a)&(t<0)\\h(a)&(t>0)\end{cases}$일 때, $\displaystyle\lim_{a\to0+}\dfrac{g(a)}{h(a)}$와 $\displaystyle\lim_{a\to1-}\dfrac{g(a)}{(1-a)^3h(a)}$의 값을 각각 구하시오. [25점]
  points: 25
  depends_on: []
  answer:
    kind: value
    value: L1=1; L2=1/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        $t>0$이면 $-(x-t)^2-at^2=-ax^2$, 곧 $(a-1)x^2+2tx-t^2-at^2=0$에서 $x=t$ 또는 $x=\dfrac{1+a}{1-a}t$이다. (15) $t>0$, $0<a<1$이므로 $t<\dfrac{1+a}{1-a}t$이다. (16)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 91~100쪽
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: |
        $S(t)=\displaystyle\int_t^{\frac{1+a}{1-a}t}\left|-(x-t)^2-at^2\right|dx=\int_t^{\frac{1+a}{1-a}t}\left\{(x-t)^2+at^2\right\}dx$ (17) $=\left[\dfrac13x^3-tx^2+(at^2+t^2)x\right]_t^{\frac{1+a}{1-a}t}$ (18) $=\dfrac{t^3}{3}\times\dfrac{6a^4-4a^3+6a^2}{(1-a)^3}$ (19)이므로 $h(a)=\dfrac{S(t)}{t^3}=\dfrac{6a^4-4a^3+6a^2}{3(1-a)^3}$이다. (20)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 91~100쪽
      criteria:
      - 2-3.M1
    - id: 23b-3
      content: |
        $\displaystyle\lim_{a\to0+}\dfrac{g(a)}{h(a)}=\lim_{a\to0+}\dfrac{(6a^4+4a^3+6a^2)(1-a)^3}{(6a^4-4a^3+6a^2)(1+a)^3}=\lim_{a\to0+}\dfrac{(6a^2+4a+6)(1-a)^3}{(6a^2-4a+6)(1+a)^3}=\dfrac{6\times1}{6\times1}=1$이다. (21)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 91~100쪽
      criteria:
      - 2-3.M2
    - id: 23b-4
      content: |
        $\displaystyle\lim_{a\to1-}\dfrac{g(a)}{(1-a)^3h(a)}=\lim_{a\to1-}\dfrac{6a^4+4a^3+6a^2}{(6a^4-4a^3+6a^2)(1+a)^3}=\dfrac{16}{8\times8}=\dfrac14$이다. (22)
      source_flow: 문항카드 문항 해설·예시 답안 PDF 91~100쪽
      criteria:
      - 2-3.M3
