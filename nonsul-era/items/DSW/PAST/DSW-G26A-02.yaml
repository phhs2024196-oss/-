key_idea: |
  접점 조건을 이차방정식으로 정리하면 $x=t$는 항상 한 근이고 다른 근은 $\dfrac{1\mp a}{1\pm a}t$ 꼴이다. 따라서 $S(t)$는 $t^3$에 비례하고, $\dfrac{S(t)}{t^3}$이 $t$의 부호에 따라 $-g(a)$ 또는 $h(a)$가 된다.
stuck: |
  $t$의 부호에 따라 $f(t)$와 두 교점의 위치(어느 가지에서 만나는지)와 적분 구간 순서가 바뀌는 것을 정리하지 못한다.
