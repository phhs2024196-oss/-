intent: |
  삼각함수를 이용하여 한 변의 길이를 구할 수 있는지 알아본다. 원의 총 넓이와 원의 총 둘레의 길이를 구할 수 있는지 알아본다. 등비수열의 일반항을 이용해 등비수열의 합을 구할 수 있는지 알아본다. 수열의 귀납적 정의를 이해하고 활용할 수 있는지 알아본다.
key_idea: |
  접하는 두 원의 중심과 접점으로 만든 직각삼각형에서 $\sin\dfrac{\pi}{a_n}=\dfrac{r_k-r_{k+1}}{r_k+r_{k+1}}$를 얻어 $r_{k+1}=\dfrac{1-\alpha}{1+\alpha}r_k$(등비수열)로 만들고, 이를 이용해 넓이·둘레의 총합과 일반항을 구한다.
stuck: |
  $r_1$과 $r_2$의 관계를 세울 직각삼각형(중심 $\mathrm{O}_2$에서 선분 $\mathrm{O}_1\mathrm{T}$에 내린 수선)을 찾지 못한다. 시행마다 원이 $a_n$개씩 있음을 합에 곱하지 않는다.
