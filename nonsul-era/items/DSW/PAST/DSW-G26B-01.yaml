stem: |
  [문제1] [25점]

  반지름의 길이가 1인 원에 아래의 조건을 만족하는 도형을 그린다.
  수열 $\{a_n\}$의 일반항은 $a_n=3n+3$ ($n=1,2,3,\cdots$)이다.

  (가) 첫 번째 시행에서는, 반지름의 길이가 $r_1$인 $a_n$개의 원을 서로 외접하면서 반지름의 길이가 1인 원에 내접하게 그린다.

  (나) 두 번째 시행에서는, 첫 번째 시행된 결과에 추가로 반지름의 길이가 $r_2$(단, $r_1>r_2$)인 $a_n$개의 원들을 서로 외접하며, 첫 번째 시행의 결과에 모두 외접하게 [그림 1]과 같이 그린다.

  (다) 이와 같은 방법으로 $k$번 시행을 반복할 때, 시행 별로 그려진 원의 반지름 길이는 $r_k$이고, 원들은 [그림 1], [그림 2]와 같이 그린다.

  (라) [그림 1], [그림 2]와 같이 $k$번째 시행에서 그려진 원의 둘레의 길이의 총합을 $C_k$라 하고, 원의 넓이의 총합을 $S_k$라 한다.

  [그림 1: 반지름 1인 원 안에 큰 원 9개가 내접하고 그 안쪽에 둘레가 굵게 표시된 작은 원 9개가 놓인 도형, C_2 표시] $n=2$, $k=2$일 때, $C_2$는 두 번째 시행에서 그려진 9개 원의 둘레의 길이의 총합

  [그림 2: 반지름 1인 원 안에 큰 원 6개, 그 안쪽에 작은 원 6개, 가운데에 더 작은 원 6개가 놓인 도형, S_3 표시] $n=1$, $k=3$일 때, $S_3$은 세 번째 시행에서 그려진 6개 원의 넓이의 총합
subparts:
- id: 1-1
  stem: |
    [문제 1-1] $n=1$, $k=2$일 때, $S_2$와 $C_2$의 값을 각각 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: S_2=2*pi/27; C_2=4*pi/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $n=1$이므로 $a_1=6$이고, 시행마다 원이 6개이다. 그림에서 $\angle\mathrm{AOB}=\dfrac{\pi}{3}$, $\angle\mathrm{AOC}=\dfrac{\pi}{6}$이므로 $\triangle\mathrm{OO}_1\mathrm{T}$에서 $(1-r_1)\sin\dfrac{\pi}{6}=r_1$이다. 즉 $1-r_1=2r_1$이므로 $r_1=\dfrac13$이다.
      source_flow: 문항카드 문항해설 PDF 101~109쪽
      criteria:
      - 1-1.M1
      - 1-1.A1
    - id: 11b-2
      content: |
        $\mathrm{O}_2$에서 선분 $\mathrm{O}_1\mathrm{T}$에 내린 수선의 발을 $\mathrm{H}$라 하면 $\triangle\mathrm{O}_2\mathrm{O}_1\mathrm{H}$에서 $(r_1+r_2)\sin\dfrac{\pi}{6}=r_1-r_2$이다. 정리하면 $r_2=\dfrac13r_1=\dfrac19$이다. (별해: 닮음비 $1:\dfrac13=\dfrac13:r_2$)
      source_flow: 문항카드 문항해설 PDF 101~109쪽
      criteria:
      - 1-1.M2
      - 1-1.A2
    - id: 11b-3
      content: |
        $S_2=6\times\pi\times\dfrac{1}{81}=\dfrac{2}{27}\pi$, $C_2=6\times2\pi\times\dfrac19=\dfrac43\pi$이다.
      source_flow: 문항카드 문항해설 PDF 101~109쪽
      criteria:
      - 1-1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 1
      evidence: 삼각함수로 $r_1$에 관한 식 $(1-r_1)\sin\frac\pi6=r_1$(또는 $\frac{r_1}{1-r_1}=\sin\frac\pi6$)을 세웠다. [B 1점]
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 1
      evidence: $r_1=\frac13$을 정확히 구했다. [A 2점 = M1+A1]
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 1
      evidence: $r_1$과 $r_2$의 관계식 $(r_1+r_2)\sin\frac\pi6=r_1-r_2$ (또는 닮음비 $1:\frac13=\frac13:r_2$, $\frac{r_2}{\frac13-r_2}=\sin\frac\pi6$)을 세웠다. [B 1점]
      steps:
      - 11b-2
    - id: 1-1.A2
      mark_type: A
      points: 1
      evidence: $r_2=\frac19$를 정확히 구했다. [A 2점 = M2+A2]
      steps:
      - 11b-2
    - id: 1-1.A3
      mark_type: A
      points: 1
      evidence: $S_2=\frac{2}{27}\pi$와 $C_2=\frac43\pi$를 둘 다 정확히 구했다(원의 넓이·둘레 공식에 원 6개를 곱함). 둘 중 하나만 맞으면 0점.
      steps:
      - 11b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    [문제 1-2] $n=1$, $k=10$일 때, $\displaystyle\sum_{k=1}^{10}S_k$와 $\displaystyle\sum_{k=1}^{10}C_k$의 값을 각각 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: sum_S=3*pi/4*(1-(1/9)**10); sum_C=6*pi*(1-(1/3)**10)
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        1-1과 같은 도형이므로 $(r_k+r_{k+1})\sin\dfrac{\pi}{6}=r_k-r_{k+1}$, 즉 $r_{k+1}=\dfrac13r_k$이다. $r_1=\dfrac13$이므로 일반항은 $r_k=\dfrac13\times\left(\dfrac13\right)^{k-1}=\left(\dfrac13\right)^k$이다.
      source_flow: 문항카드 문항해설 PDF 101~109쪽
      criteria:
      - 1-2.M1
      - 1-2.A1
    - id: 12b-2
      content: |
        $\displaystyle\sum_{k=1}^{10}S_k=a_1\sum_{k=1}^{10}\pi r_k^2=6\pi\times\left\{\left(\dfrac13\right)^2+\left(\dfrac13\right)^4+\cdots+\left(\dfrac13\right)^{20}\right\}$, $\displaystyle\sum_{k=1}^{10}C_k=a_1\sum_{k=1}^{10}2\pi r_k=4\pi\times\left\{1+\dfrac13+\left(\dfrac13\right)^2+\cdots+\left(\dfrac13\right)^9\right\}$로 둔다.
      source_flow: 문항카드 문항해설 PDF 101~109쪽
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        등비수열의 합 공식으로 $\displaystyle\sum_{k=1}^{10}S_k=6\pi\times\left(\dfrac13\right)^2\times\dfrac{1-\left(\frac19\right)^{10}}{1-\frac19}=\dfrac34\pi\left\{1-\left(\dfrac19\right)^{10}\right\}=\dfrac34\pi\left\{1-\left(\dfrac13\right)^{20}\right\}$이고, $\displaystyle\sum_{k=1}^{10}C_k=4\pi\times\dfrac{1-\left(\frac13\right)^{10}}{1-\frac13}=6\pi\left\{1-\left(\dfrac13\right)^{10}\right\}$이다.
      source_flow: 문항카드 문항해설 PDF 101~109쪽
      criteria:
      - 1-2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 3
      evidence: $r_k$와 $r_{k+1}$의 관계 $(r_k+r_{k+1})\sin\frac\pi6=r_k-r_{k+1}$, $r_{k+1}=\frac13r_k$를 구했다. [B 3점; $r_1,r_2$만 구해 일반항을 구하면 C 2점]
      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 1
      evidence: 일반항 $r_k=(\frac13)^k$를 구했다. [A 4점 = M1+A1]
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 2
      evidence: 원 넓이의 합과 원 둘레의 합을 등비수열의 합 꼴(원 6개 포함)로 나타냈다. [둘 중 하나만 식으로 나타내면 1점, 둘 다면 2점]
      steps:
      - 12b-2
    - id: 1-2.A2
      mark_type: A
      points: 1
      evidence: 등비수열의 합 공식으로 $\sum S_k$와 $\sum C_k$를 모두 정확히 구했다. [둘 중 하나만 정확하면 M2까지 2점, 둘 다 정확하면 3점]
      steps:
      - 12b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-3
  stem: |
    [문제 1-3] $n=N$일 때, $k$번째 시행에서 그려진 원의 반지름의 길이의 일반항 $r_k$를 구하시오. [13점]
  points: 13
  depends_on: []
  answer:
    kind: value
    value: r_k=alpha/(1+alpha)*((1-alpha)/(1+alpha))**(k-1); alpha=sin(pi/(3*N+3))
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $a_N=3N+3$개의 원을 쓰므로 $\angle\mathrm{AOB}=\dfrac{2\pi}{3N+3}=\dfrac{2\pi}{a_N}$, $\angle\mathrm{AOC}=\dfrac{\pi}{3N+3}=\dfrac{\pi}{a_N}$이다.
      source_flow: 문항카드 문항해설 PDF 101~109쪽
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        $\alpha=\sin\dfrac{\pi}{3N+3}=\sin\dfrac{\pi}{a_N}$로 놓는다.
      source_flow: 문항카드 문항해설 PDF 101~109쪽
      criteria:
      - 1-3.M2
    - id: 13b-3
      content: |
        $\triangle\mathrm{OO}_1\mathrm{T}$에서 $(1-r_1)\times\alpha=r_1$이므로 첫째항 $r_1=\dfrac{\alpha}{1+\alpha}$이다.
      source_flow: 문항카드 문항해설 PDF 101~109쪽
      criteria:
      - 1-3.M3
    - id: 13b-4
      content: |
        같은 방법으로 $\triangle\mathrm{O}_{k+1}\mathrm{O}_k\mathrm{H}$에서 $\alpha=\sin\dfrac{\pi}{a_N}=\dfrac{r_k-r_{k+1}}{r_k+r_{k+1}}$이다.
      source_flow: 문항카드 문항해설 PDF 101~109쪽
      criteria:
      - 1-3.M4
    - id: 13b-5
      content: |
        $r_{k+1}$에 대해 정리하면 $r_{k+1}=\left(\dfrac{1-\alpha}{1+\alpha}\right)\times r_k$이다.
      source_flow: 문항카드 문항해설 PDF 101~109쪽
      criteria:
      - 1-3.A1
    - id: 13b-6
      content: |
        따라서 $r_k=\left(\dfrac{\alpha}{1+\alpha}\right)\times\left(\dfrac{1-\alpha}{1+\alpha}\right)^{k-1}$ (단 $\alpha=\sin\dfrac{\pi}{a_N}$, $a_N=3N+3$)이다.
      source_flow: 문항카드 문항해설 PDF 101~109쪽
      criteria:
      - 1-3.A2
      - 1-3.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 2
      evidence: $\angle\mathrm{AOB}=\frac{2\pi}{3N+3}=\frac{2\pi}{a_N}$ 또는 $\angle\mathrm{AOC}=\frac{\pi}{3N+3}=\frac\pi{a_N}$으로 정확히 표현했다. [B 2점]
      steps:
      - 13b-1
    - id: 1-3.M2
      mark_type: M
      points: 2
      evidence: 사잇각 $\frac\pi{a_N}$에 대한 $\sin\frac\pi{a_N}$를 $\alpha$(혹은 적당한 변수)로 정의·표현했다. [A 4점 = M1+M2]
      steps:
      - 13b-2
    - id: 1-3.M3
      mark_type: M
      points: 2
      evidence: '첫째항을 $\alpha$로 나타냈다: $(1-r_1)\alpha=r_1$, $r_1=\frac\alpha{1+\alpha}$. [C 2점]'
      steps:
      - 13b-3
    - id: 1-3.M4
      mark_type: M
      points: 2
      evidence: '$\alpha$를 $r_k$와 $r_{k+1}$로 표현했다: $\alpha=\frac{r_k-r_{k+1}}{r_k+r_{k+1}}$. [B 4점 = M3+M4]'
      steps:
      - 13b-4
    - id: 1-3.A1
      mark_type: A
      points: 2
      evidence: '귀납적 정의로 공비를 정확히 구했다: $r_{k+1}=\frac{1-\alpha}{1+\alpha}r_k$. [A 6점 = M3+M4+A1]'
      steps:
      - 13b-5
    - id: 1-3.A2
      mark_type: A
      points: 2
      evidence: $r_k$를 $\alpha$와 $k$에 대한 등비수열의 일반항으로 구했다. [B 2점]
      steps:
      - 13b-6
    - id: 1-3.A3
      mark_type: A
      points: 1
      evidence: $\alpha=\sin\frac\pi{a_N}$(또는 $\sin\frac\pi{3N+3}$)의 정의를 명시했다. [A 3점 = A2+A3]
      steps:
      - 13b-6
