stimuli: []
stem: |
  [문제2] [35점]

  양수 $a$ ($0<a<1$)에 대하여 실수 전체에서 정의된 함수

  $f(x)=\begin{cases}ax^2&(x<0)\\-ax^2&(x\ge0)\end{cases}$

  가 있다. 0이 아닌 실수 $t$에 대하여 곡선 $y=-(x-t)^2+f(t)$는 함수 $y=f(x)$의 그래프와 서로 다른 두 점 A, B에서 만나고, 두 점 A, B의 $x$좌표를 각각 $x_1$, $x_2$라 하면 곡선 $y=-(x-t)^2+f(t)$와 $x$축 및 두 직선 $x=x_1$, $x=x_2$로 둘러싸인 부분의 넓이는 $S(t)$이다.
subparts:
- id: 2-1
  stem: |
    [문제 2-1] $a=\dfrac12$일 때, $S(-2)$와 $S(2)$의 값을 각각 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: S(-2)=152/81; S(2)=88/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $a=\dfrac12$이면 $f(x)=\begin{cases}\dfrac12x^2&(x<0)\\-\dfrac12x^2&(x\ge0)\end{cases}$이다. $t<0$일 때 교점의 $x$좌표는 이차방정식 $-(x-t)^2+\dfrac12t^2=\dfrac12x^2$의 두 실근이고, 정리하면 $\dfrac32x^2-2tx+\dfrac12t^2=0$에서 $x=t$ 또는 $x=\dfrac t3$이다. $t=-2$이면 $x=-2$ 또는 $x=-\dfrac23$이다.
      source_flow: 문항카드 문항해설 PDF 110~119쪽
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $S(-2)=\displaystyle\int_{-2}^{-\frac23}\left|-(x+2)^2+2\right|dx=\left[-\dfrac13x^3-2x^2-2x\right]_{-2}^{-\frac23}=\dfrac{152}{81}$이다.
      source_flow: 문항카드 문항해설 PDF 110~119쪽
      criteria:
      - 2-1.A1
    - id: 21b-3
      content: |
        $t>0$일 때 교점의 $x$좌표는 $-(x-t)^2-\dfrac12t^2=-\dfrac12x^2$의 두 실근이고, 정리하면 $\dfrac12x^2-2tx+\dfrac32t^2=0$에서 $x=t$ 또는 $x=3t$이다. $t=2$이면 $x=2$ 또는 $x=6$이다.
      source_flow: 문항카드 문항해설 PDF 110~119쪽
      criteria:
      - 2-1.M2
    - id: 21b-4
      content: |
        $S(2)=\displaystyle\int_2^6\left|-(x-2)^2-2\right|dx=\left[\dfrac13x^3-2x^2+6x\right]_2^6=\dfrac{88}{3}$이다.
      source_flow: 문항카드 문항해설 PDF 110~119쪽
      criteria:
      - 2-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 2
      evidence: $t=-2$일 때 방정식으로부터 두 교점의 $x$좌표 $-2$, $-\frac23$을 구했다. [B 2점]
      steps:
      - 21b-1
    - id: 2-1.A1
      mark_type: A
      points: 2
      evidence: 적분식 $S(-2)=\int_{-2}^{-2/3}|-(x+2)^2+2|dx$를 세우고 값 $\frac{152}{81}$을 구했다. [A 4점 = M1+A1]
      steps:
      - 21b-2
    - id: 2-1.M2
      mark_type: M
      points: 2
      evidence: $t=2$일 때 방정식으로부터 두 교점의 $x$좌표 $2$, $6$을 구했다. [B 2점]
      steps:
      - 21b-3
    - id: 2-1.A2
      mark_type: A
      points: 2
      evidence: 적분식 $S(2)=\int_2^6|-(x-2)^2-2|dx$를 세우고 값 $\frac{88}{3}$을 구했다. [A 4점 = M2+A2]
      steps:
      - 21b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    [문제 2-2] $t<0$이면 $\dfrac{S(t)}{t^3}=-g(a)$이다. $g(a)=\dfrac{6a^4+pa^3+qa^2+ra+s}{3(1+a)^3}$일 때, 네 정수 $p$, $q$, $r$, $s$의 값을 각각 구하시오. [13점]
  points: 13
  depends_on: []
  answer:
    kind: value
    value: p=4; q=6; r=0; s=0
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $t<0$이면 곡선 $y=-(x-t)^2+f(t)$와 $y=f(x)$의 교점의 $x$좌표는 $-(x-t)^2+at^2=ax^2$의 두 실근이다. $(a+1)x^2-2tx+t^2-at^2=0$에서 $x=t$ 또는 $x=\dfrac{1-a}{1+a}t$이다.
      source_flow: 문항카드 문항해설 PDF 110~119쪽
      criteria:
      - 2-2.M1
      - 2-2.A1
    - id: 22b-2
      content: |
        $t<0$, $0<a<1$이므로 $t<\dfrac{1-a}{1+a}t$이다. 따라서 $S(t)=\displaystyle\int_t^{\frac{1-a}{1+a}t}\left|-(x-t)^2+at^2\right|dx=\int_t^{\frac{1-a}{1+a}t}\left\{-(x-t)^2+at^2\right\}dx$이다.
      source_flow: 문항카드 문항해설 PDF 110~119쪽
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: |
        $S(t)=\left[-\dfrac13x^3+tx^2+(at^2-t^2)x\right]_t^{\frac{1-a}{1+a}t}=-\dfrac{t^3}{3}\times\dfrac{6a^4+4a^3+6a^2}{(1+a)^3}$이다.
      source_flow: 문항카드 문항해설 PDF 110~119쪽
      criteria:
      - 2-2.A2
    - id: 22b-4
      content: |
        $\dfrac{S(t)}{t^3}=-g(a)$이므로 $g(a)=\dfrac{6a^4+4a^3+6a^2}{3(1+a)^3}$이다. 따라서 $p=4$, $q=6$, $r=0$, $s=0$이다.
      source_flow: 문항카드 문항해설 PDF 110~119쪽
      criteria:
      - 2-2.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 1
      evidence: 두 교점을 구하기 위한 방정식 $ax^2=-(x-t)^2+at^2$을 작성했다. [B 1점]
      steps:
      - 22b-1
    - id: 2-2.A1
      mark_type: A
      points: 3
      evidence: 방정식으로부터 두 교점의 $x$좌표 $x=t$, $x=\frac{1-a}{1+a}t$를 구했다. [A 4점 = M1+A1]
      steps:
      - 22b-1
    - id: 2-2.M2
      mark_type: M
      points: 2
      evidence: 두 교점의 $x$좌표의 대소 부등식 $t<\frac{1-a}{1+a}t$를 고려하여 적분식(부호를 벗긴 $\int_t^{\frac{1-a}{1+a}t}\{-(x-t)^2+at^2\}dx$)을 표현했다. [B 2점]
      steps:
      - 22b-2
    - id: 2-2.A2
      mark_type: A
      points: 3
      evidence: 적분값을 구하여 넓이를 $S(t)=-\frac{t^3}{3}\times\frac{6a^4+4a^3+6a^2}{(1+a)^3}$로 표현했다. [A 5점 = M2+A2]
      steps:
      - 22b-3
    - id: 2-2.A3
      mark_type: A
      points: 4
      evidence: $S(t)$로부터 $g(a)$를 계산하여 $p,q,r,s$ 중 맞게 구한 개수만큼 1점씩(4개 모두 $p=4,q=6,r=0,s=0$이면 4점). [D 1점·C 2점·B 3점·A 4점]
      steps:
      - 22b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-3
  stem: |
    [문제 2-3] $\dfrac{S(t)}{t^3}=\begin{cases}-g(a)&(t<0)\\h(a)&(t>0)\end{cases}$일 때, $\displaystyle\lim_{a\to0+}\dfrac{g(a)}{h(a)}$와 $\displaystyle\lim_{a\to1-}\dfrac{g(a)}{(1-a)^3h(a)}$의 값을 각각 구하시오. [14점]
  points: 14
  depends_on: []
  answer:
    kind: value
    value: L1=1; L2=1/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        $g(a)=\dfrac{6a^4+4a^3+6a^2}{3(1+a)^3}$이다(2-2).
      source_flow: 문항카드 문항해설 PDF 110~119쪽
      criteria:
      - 2-3.B1
    - id: 23b-2
      content: |
        $t>0$이면 두 교점의 $x$좌표는 $-(x-t)^2-at^2=-ax^2$의 두 실근이고 $(a-1)x^2+2tx-t^2-at^2=0$에서 $x=t$ 또는 $x=\dfrac{1+a}{1-a}t$이다. $t>0$, $0<a<1$이므로 $t<\dfrac{1+a}{1-a}t$이고 $S(t)=\displaystyle\int_t^{\frac{1+a}{1-a}t}\left\{(x-t)^2+at^2\right\}dx=\dfrac{t^3}{3}\times\dfrac{6a^4-4a^3+6a^2}{(1-a)^3}$이다. 따라서 $h(a)=\dfrac{6a^4-4a^3+6a^2}{3(1-a)^3}$이다.
      source_flow: 문항카드 문항해설 PDF 110~119쪽
      criteria:
      - 2-3.B2
    - id: 23b-3
      content: |
        $\displaystyle\lim_{a\to0+}\dfrac{g(a)}{h(a)}=\lim_{a\to0+}\dfrac{(6a^4+4a^3+6a^2)(1-a)^3}{(6a^4-4a^3+6a^2)(1+a)^3}=\lim_{a\to0+}\dfrac{(6a^2+4a+6)(1-a)^3}{(6a^2-4a+6)(1+a)^3}=\dfrac{6\times1}{6\times1}=1$이다.
      source_flow: 문항카드 문항해설 PDF 110~119쪽
      criteria:
      - 2-3.B3
    - id: 23b-4
      content: |
        $\displaystyle\lim_{a\to1-}\dfrac{g(a)}{(1-a)^3h(a)}=\lim_{a\to1-}\dfrac{6a^4+4a^3+6a^2}{(6a^4-4a^3+6a^2)(1+a)^3}=\dfrac{16}{8\times8}=\dfrac14$이다.
      source_flow: 문항카드 문항해설 PDF 110~119쪽
      criteria:
      - 2-3.B4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-3.B1
      mark_type: B
      points: 2
      evidence: $t<0$일 때 $g(a)=\frac{6a^4+4a^3+6a^2}{3(1+a)^3}$를 구했다. [$g(a)$와 $h(a)$ 중 하나만 구하면 B 2점]
      steps:
      - 23b-1
    - id: 2-3.B2
      mark_type: B
      points: 2
      evidence: $t>0$일 때 $h(a)=\frac{6a^4-4a^3+6a^2}{3(1-a)^3}$을 구했다. [둘 다 구하면 A 4점 = B1+B2]
      steps:
      - 23b-2
    - id: 2-3.B3
      mark_type: B
      points: 5
      evidence: $\lim_{a\to0+}\frac{g(a)}{h(a)}=1$을 정확히 구했다. [(21), (22) 중 하나만 구하면 B 5점]
      steps:
      - 23b-3
    - id: 2-3.B4
      mark_type: B
      points: 5
      evidence: $\lim_{a\to1-}\frac{g(a)}{(1-a)^3h(a)}=\frac14$을 정확히 구했다. [둘 다 구하면 A 10점 = B3+B4]
      steps:
      - 23b-4
