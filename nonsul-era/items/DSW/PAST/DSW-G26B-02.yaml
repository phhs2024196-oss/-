intent: |
  이차방정식을 이용하여 주어진 두 이차함수의 그래프의 교점을 구할 수 있는지, 주어진 조건을 만족시키는 도형의 넓이를 해석·이해할 수 있는지, 다항함수의 정적분으로 곡선과 직선으로 둘러싸인 부분의 넓이를 계산할 수 있는지 알아본다. 주어진 식을 한 문자로 정리하고 항등식의 성질로 미정계수를 구할 수 있는지, 함수의 극한의 성질로 주어진 극한값을 구할 수 있는지 알아본다.
key_idea: |
  교점의 $x$좌표는 $x=t$ (접점 아닌 한 점)와 $x=\dfrac{1\mp a}{1\pm a}t$이고, 넓이 $S(t)$가 $t^3$에 비례하므로 $\dfrac{S(t)}{t^3}$가 $a$만의 함수 $-g(a)$, $h(a)$가 된다. 구한 유리함수의 극한은 약분 또는 직접 대입으로 구한다.
stuck: |
  $t<0$일 때와 $t>0$일 때 두 교점의 대소($t$와 $\dfrac{1-a}{1+a}t$, $t$와 $\dfrac{1+a}{1-a}t$)를 구분하지 못해 적분 구간과 부호를 틀린다. $|\,\cdot\,|$를 벗기는 부호를 잘못 잡는다.
