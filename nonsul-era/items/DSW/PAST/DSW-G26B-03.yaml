      steps:
      - 31b-1
    - id: 3-1.A1
      mark_type: A
      points: 1
      evidence: $d_0(l_0,\mathrm P)=2\sqrt2$를 정확히 구했다. [A 2점 = M1+A1]
      steps:
      - 31b-1
    - id: 3-1.A2
      mark_type: A
