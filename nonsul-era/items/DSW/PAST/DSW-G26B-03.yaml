stimuli: []
stem: |
  [문제3] [40점]

  (가) <함수의 극한의 대소 관계>

  함수 $f(x)$, $g(x)$에서 $\displaystyle\lim_{x\to a}f(x)=L$, $\displaystyle\lim_{x\to a}g(x)=M$ ($L$, $M$은 실수)일 때,

  $a$에 가까운 모든 실수 $x$에서

  ① $f(x)\le g(x)$이면 $L\le M$

  ② 함수 $h(x)$가 $f(x)\le h(x)\le g(x)$이고 $L=M$이면 $\displaystyle\lim_{x\to a}h(x)=L$

  ※ 함수의 극한의 대소 관계는 $x\to a+$, $x\to a-$, $x\to\infty$, $x\to-\infty$일 때에도 성립한다.

  (나) 좌표평면 위에 5개의 선분 $l_0$, $l_1$, $l_2$, $l_3$, $l_4$와 이 선분들 위에 있지 않은 점 P가 존재한다. 선분 $l_k$를 포함하는 직선과 점 P 사이의 거리를 $d_k(l_k,\mathrm P)$, 선분 $l_k$ 위의 한 점 $(x,y)$와 점 P 사이의 거리의 제곱을 $w_k(l_k,\mathrm P)$라고 할 때, $f_k(l_k,\mathrm P)$와 $F_k(l_k,\mathrm P)$를 다음과 같이 정의한다. (단, $k=0,1,2,3,4$)

  $f_k(l_k,\mathrm P)=\dfrac{d_k(l_k,\mathrm P)}{w_k(l_k,\mathrm P)}$, $F_k(l_k,\mathrm P)=\dfrac{1}{w_k(l_k,\mathrm P)}$
subparts:
- id: 3-1
  stem: |
    [문제 3-1] 선분 $l_0$의 양 끝 점은 $(-5,5)$, $(-1,1)$이다. 점 P의 좌표가 $(-1,5)$일 때, 다음 정적분의 값을 구하시오.

    $\displaystyle\int_{-5}^{-1}f_0(l_0,\mathrm P)\,dx$ [12점]
  points: 12
  depends_on: []
  answer:
    kind: value
    value: pi*sqrt(2)/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        선분 $l_0$를 포함하는 직선은 $y-1=\dfrac{5-1}{-5-(-1)}\{x-(-1)\}$, 즉 $y=-x$이다. 점 P$(-1,5)$와 이 직선 사이의 거리는 $d_0(l_0,\mathrm P)=\dfrac{|-1+5|}{\sqrt{1^2+1^2}}=2\sqrt2$이다. (별해: $l_0$가 $x$축의 양의 방향과 $135^\circ$를 이루므로 두 꼭짓점의 각이 $45^\circ$인 직각이등변삼각형에서 $2\sqrt2$)
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-1.M1
      - 3-1.A1
    - id: 31b-2
      content: |
        $w_0(l_0,\mathrm P)=\left(\sqrt{(x+1)^2+(y-5)^2}\right)^2=(x+1)^2+(-x-5)^2=2x^2+12x+26$이므로 $f_0(l_0,\mathrm P)=\dfrac{2\sqrt2}{2x^2+12x+26}=\dfrac{\sqrt2}{x^2+6x+13}$이다.
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-1.A2
    - id: 31b-3
      content: |
        $\displaystyle\int_{-5}^{-1}f_0\,dx=\int_{-5}^{-1}\dfrac{\sqrt2}{(x+3)^2+4}dx=\dfrac{\sqrt2}{4}\int_{-5}^{-1}\dfrac{1}{\left(\frac{x+3}{2}\right)^2+1}dx$로 정리하고 $\tan\theta=\dfrac{x+3}{2}$로 치환하면 $\sec^2\theta\,d\theta=\dfrac12dx$이고 $\left(-\dfrac\pi2<\theta<\dfrac\pi2\right)$이다.
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-1.M2
      - 3-1.M3
      - 3-1.M4
    - id: 31b-4
      content: |
        $\tan\gamma_2=\dfrac{-1+3}{2}=1$, $\tan\gamma_1=\dfrac{-5+3}{2}=-1$에서 $-\dfrac\pi2<\gamma_1,\gamma_2<\dfrac\pi2$이므로 $\gamma_2=\dfrac\pi4$, $\gamma_1=-\dfrac\pi4$이다.
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-1.A3
    - id: 31b-5
      content: |
        $\dfrac{\sqrt2}{4}\displaystyle\int_{\gamma_1}^{\gamma_2}\dfrac{1}{\tan^2\theta+1}2\sec^2\theta\,d\theta=\dfrac{\sqrt2}{2}\int_{-\frac\pi4}^{\frac\pi4}1\,d\theta=\dfrac{\sqrt2}{2}\left\{\dfrac\pi4-\left(-\dfrac\pi4\right)\right\}=\dfrac{\sqrt2}{4}\pi$이다. 따라서 $\displaystyle\int_{-5}^{-1}f_0(l_0,\mathrm P)dx=\dfrac{\sqrt2}{4}\pi$이다.
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-1.A4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
