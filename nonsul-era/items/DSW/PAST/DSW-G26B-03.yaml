    - id: 3-1.M3
      mark_type: M
      points: 1
      evidence: $\frac{d\theta}{dx}$ ($\sec^2\theta\,d\theta=\frac12dx$)를 정확히 구했다. [B 2점 = M2+M3]
      steps:
      - 31b-3
    - id: 3-1.M4
      mark_type: M
      points: 1
      evidence: $\theta$의 범위 $-\frac\pi2<\theta<\frac\pi2$를 정확히 구했다. [A 3점 = M2+M3+M4]
      steps:
      - 31b-3
    - id: 3-1.A3
      mark_type: A
      points: 3
      evidence: $\gamma_1=-\frac\pi4$, $\gamma_2=\frac\pi4$를 정확히 계산했다. [(7)]
      steps:
      - 31b-4
    - id: 3-1.A4
      mark_type: A
      points: 3
      evidence: 정적분 값 $\int_{-5}^{-1}f_0(l_0,\mathrm P)dx=\frac{\pi\sqrt2}{4}$를 정확히 구했다. [전개만 맞고 답이 틀리면 B 1점]
      steps:
      - 31b-5
