- id: 3-2
  stem: |
    [문제 3-2] 그림과 같이 네 개의 선분 $l_1$, $l_2$, $l_3$, $l_4$로 이루어진 직사각형 OABC가 있다.

    [그림: 좌표평면에서 O$(0,0)$, A$(\alpha,0)$, B$(\alpha,\beta)$, C$(0,\beta)$인 직사각형 OABC, 변 OA는 $l_1$, 변 AB는 $l_2$, 변 BC는 $l_3$, 변 CO는 $l_4$, 내부의 점 P$(u,v)$]

    이 직사각형 내부의 한 점 P의 좌표가 $(u,v)$이고 다음과 같이 $a_k$를 정의할 때, $\displaystyle\sum_{k=1}^{4}a_k$의 값을 구하시오. (단, $0<u<\alpha$, $0<v<\beta$)

    $a_k=\begin{cases}\displaystyle\int_0^\alpha f_k(l_k,\mathrm P)\,dx&(k=1,3)\\[2mm]\displaystyle\int_0^\beta f_k(l_k,\mathrm P)\,dy&(k=2,4)\end{cases}$ [13점]
  points: 13
  depends_on: []
  answer:
    kind: value
    value: 2*pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $l_1$에 대하여 $a_1=\displaystyle\int_0^\alpha\dfrac{v}{(x-u)^2+v^2}dx=\int_0^\alpha\dfrac{v}{v^2\left\{\left(\frac{x-u}{v}\right)^2+1\right\}}dx$로 정리한다.
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        $\tan\theta=\dfrac{x-u}{v}\ \left(-\dfrac\pi2<\theta<\dfrac\pi2\right)$로 치환하면 $\sec^2\theta\,d\theta=\dfrac1vdx$이다.
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        $x=0$, $x=\alpha$에 대응하는 $\xi_1$, $\xi_2$는 $\tan\xi_2=\dfrac{\alpha-u}{v}$, $\tan\xi_1=-\dfrac uv$이고 $a_1=\displaystyle\int_{\xi_1}^{\xi_2}\dfrac{v}{v^2(\tan^2\theta+1)}\times v\sec^2\theta\,d\theta=\int_{\xi_1}^{\xi_2}1\,d\theta=\xi_2-\xi_1$이다.
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-2.A1
    - id: 32b-4
      content: |
        그림에서 선분 OA와 점 P를 이은 직각삼각형들의 탄젠트의 정의에 의해 $\xi_2=\theta_2$, $\xi_1=-\theta_1$이므로 $a_1=\theta_2+\theta_1$이고, 이는 $\angle\mathrm{APO}$의 크기와 같다.
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-2.A2
    - id: 32b-5
      content: |
        선분 $l_2$, $l_3$, $l_4$에 대해서도 같은 방법으로 $a_2=\theta_3+\theta_4=\angle\mathrm{BPA}$, $a_3=\theta_5+\theta_6=\angle\mathrm{CPB}$, $a_4=\theta_7+\theta_8=\angle\mathrm{OPC}$이다. 점 P가 직사각형 내부에 있으므로 $\displaystyle\sum_{k=1}^4a_k=2\pi$이다.
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-2.A3
