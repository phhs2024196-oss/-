intent: |
  두 점을 지나는 직선의 방정식과 두 점 사이의 거리를 구하고, $\tan^2\theta+1=\sec^2\theta$를 활용한 치환적분을 할 수 있는지 알아본다. 더 일반적이고 복잡한 상황에서 치환적분의 적분 변수 범위를 올바로 적용하고 그 의미(각의 크기)를 해석할 수 있는지, 복잡해 보이는 문제 상황을 단순한 문제로 해석할 수 있는지 알아본다. 적분 계산에 영향을 미치지 않는 독립적인 요소를 파악하고, 제시문의 극한의 대소 관계를 이용해 극한값을 계산할 수 있는지 알아본다.
key_idea: |
  $\displaystyle\int\dfrac{c}{(x-u)^2+c^2}dx$는 $\tan\theta=\dfrac{x-u}{c}$로 치환하면 점 P에서 선분을 바라보는 각 $\theta_2+\theta_1$이 되므로, 네 변에 대한 합 $\sum a_k$는 P 둘레의 각 $2\pi$이다. $a_k=d_k\times A_k$이므로 $C=\dfrac{2\pi}{\sum(\text{각}/d_k)}$이고, 제시문 (가)의 대소 관계로 $u\to\alpha-$에서 $0$으로 수렴한다.
stuck: |
  치환 후 적분 구간(상한·하한의 $\arctan$ 값)을 놓치거나 음수 각을 처리하지 못한다. 거리 $d_k$가 적분 변수와 무관한 상수임을 보지 못해 $a_k$와 $A_k$의 관계를 찾지 못한다. $u\to\alpha-$에서 $C$의 분모가 발산함을 대소 관계(제시문 (가))로 설명하지 못한다.
