    - id: 33b-1
      content: |
        선분 $l_k$를 포함하는 직선과 점 P 사이의 거리 $d_k(l_k,\mathrm P)$는 적분 변수 $x$, $y$와 독립적인 값이므로 $k=1,3$일 때 $a_k=\displaystyle\int_0^\alpha\dfrac{d_k}{w_k}dx=d_k\int_0^\alpha\dfrac1{w_k}dx=d_k(l_k,\mathrm P)\times A_k$이고, $k=2,4$일 때도 $a_k=\displaystyle\int_0^\beta\dfrac{d_k}{w_k}dy=d_k\times A_k$이다. 따라서 $k=1,2,3,4$에 대해 $a_k=d_k(l_k,\mathrm P)\times A_k$이다.
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-3.M1
      - 3-3.A1
    - id: 33b-2
      content: |
        $C=\dfrac{\sum a_k}{\sum A_k}=\dfrac{\sum a_k}{\sum\frac{a_k}{d_k(l_k,\mathrm P)}}=\dfrac{2\pi}{\dfrac{\theta_1+\theta_2}{v}+\dfrac{\theta_3+\theta_4}{\alpha-u}+\dfrac{\theta_5+\theta_6}{\beta-v}+\dfrac{\theta_7+\theta_8}{u}}$이다. (각 선분까지의 거리는 $v$, $\alpha-u$, $\beta-v$, $u$)
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-3.M2
      - 3-3.A2
      - 3-3.A3
    - id: 33b-3
      content: |
        점 P의 $y$좌표가 일정할 때 $x$좌표의 값이 감소하면 $\angle\mathrm{BPA}$의 크기도 감소한다. 또한 네 점 A, B, C, O를 지나는 원에서 호 AB에 대한 원주각의 크기를 $\theta_0=\angle\mathrm{BOA}$라 하면 $\theta_0$은 $\angle\mathrm{BPA}$의 크기보다 항상 작다. 따라서 $\theta_0<\theta_3+\theta_4$이다.
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-3.M3
      - 3-3.A4
    - id: 33b-4
      content: |
        $\dfrac{\theta_1+\theta_2}{v}$, $\dfrac{\theta_3+\theta_4}{\alpha-u}$, $\dfrac{\theta_5+\theta_6}{\beta-v}$, $\dfrac{\theta_7+\theta_8}{u}$은 모두 양수이므로 $0\le C<\dfrac{2\pi}{\frac{\theta_3+\theta_4}{\alpha-u}}=\dfrac{2\pi(\alpha-u)}{\theta_3+\theta_4}<\dfrac{2\pi(\alpha-u)}{\theta_0}$이다. (별해: $0<\dfrac{\theta_0}{\alpha-u}<\dfrac{\theta_3+\theta_4}{\alpha-u}$이고 $C$의 분모가 모두 양수이므로 $C>0$.)
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-3.M4
      - 3-3.M5
    - id: 33b-5
      content: |
        $\displaystyle\lim_{u\to\alpha-}\dfrac{2\pi(\alpha-u)}{\theta_0}=0$이므로 제시문 (가) ②에 의해 $\displaystyle\lim_{u\to\alpha-}C=0$이다. (별해: $\displaystyle\lim_{u\to\alpha-}\dfrac{\theta_0}{\alpha-u}=\infty$이므로 제시문 (가)에 의해 $\displaystyle\lim_{u\to\alpha-}\dfrac{\theta_3+\theta_4}{\alpha-u}=\infty$이고 $\displaystyle\lim_{u\to\alpha-}C=0$이다.)
      source_flow: 문항카드 문항해설 PDF 120~133쪽
      criteria:
      - 3-3.A5
      - 3-3.R1
