stem: |
  함수 $f(x)=\dfrac{\sqrt{x^2-3x+16}-4}{x-3}$에 대하여 $\displaystyle\lim_{x\to\infty}f(x)=a,\ \lim_{x\to3}f(x)=b$일 때, $f(a+8b)$의 값을 계산하는 과정을 아래의 단계에 따라 서술하시오. (단, $a,\ b$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $a$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a=\displaystyle\lim_{x\to\infty}\dfrac{\sqrt{x^2-3x+16}-4}{x-3}=\dfrac{\sqrt1}{1}=1$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.31
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 주어진 함수의 조건에서 극한값 $a$를 구함.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $b$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: 3/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\displaystyle\lim_{x\to3}\dfrac{(\sqrt{x^2-3x+16}-4)(\sqrt{x^2-3x+16}+4)}{(x-3)(\sqrt{x^2-3x+16}+4)}=\lim_{x\to3}\dfrac{x(x-3)}{(x-3)(\sqrt{x^2-3x+16}+4)}$
        $=\dfrac{3}{\sqrt{9-9+16}+4}=\dfrac38=b$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.31
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 주어진 함수의 조건에서 극한값 $b$를 구함.
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    $f(a+8b)$의 값을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: sqrt(20)-4
    equivalents:
    - 2*sqrt(5)-4
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $a+8b=1+8\times\dfrac38=4$
        $f(a+8b)=f(4)=\dfrac{\sqrt{4^2-3\times4+16}-4}{4-3}=\sqrt{20}-4$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.31
      criteria:
      - 3.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: $a$와 $b$ 값을 이용하여 $8(a+b)$를 구함. [공식 채점표 원문 그대로. 문제는 $f(a+8b)$이며 해설 답은 $\sqrt{20}-4$로 표기 불일치, 미수정]
      steps:
