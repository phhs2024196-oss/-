stimuli: []
stem: |
  수열 $\{a_n\}$이 모든 자연수 $n$에 대하여 $2a_{n+1}=a_n+a_{n+2}$를 만족시킨다. $a_3+a_8=63,\ a_3-a_8=15$일 때, $a_n=0$을 만족시키는 자연수 $n$의 값을 구하는 과정을 아래의 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    수열 $\{a_n\}$의 첫째항 $a_1$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '45'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\{a_n\}$은 등차수열이므로 공차를 $d$라 하면 $a_3-a_8=-5d=15$이므로 $d=-3$
        $a_3+a_8=2a_1+9d=2a_1-27=63,\ a_1=45$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.34
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 공차 $d=-3$을 구하고, 연립 방정식을 이용하여 첫째 항 $a_1=45$를 구함. [공식 채점표는 (1) 공차 $d$ 3점, (2) 첫째항 $a_1$ 3점, (3) $n$ 4점으로 문제지 소문항 순서(첫째항, 일반항, $n$)와 어긋나 있어 앞의 두 3점을 (1)에 합산·일반항을 (2)에 배정]
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
