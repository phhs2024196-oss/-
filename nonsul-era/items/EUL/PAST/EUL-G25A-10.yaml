stimuli: []
stem: |
  곡선 $y=x^3-6x+5$ 위의 점 $A(1,0)$에서의 접선과 곡선 $y=-x^2-5x+2$가 점 $B$에서 접할 때, 두 점 $A,B$사이의 거리 구하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    곡선 $y=x^3-6x+5$ 위의 점 $A$에서의 접선의 방정식을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: expression
    value: y=-3*x+3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y'=3x^2-6$이므로 점 $A(1,0)$에서의 접선의 기울기는 $y'(1)=-3$
        따라서 접선의 방정식은 $y-0=-3(x-1),\ y=-3x+3$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.37
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 주어진 함수 위의 점 $A$에서 접선의 방정식 $y=-3x+3$을 구함.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    점 $B$의 좌표를 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: (-1, 6)
    equivalents:
    - (-1,6)
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $y'=-2x-5$이고 점 $B$의 좌표를 $(t,\ -t^2-5t+2)$라 하면 점 $B$에서의 접선이 직선 $y=-3x+3$이므로
        $-2t-5=-3$에서 $t=-1$
        $y(-1)=-(-1)^2-5\times(-1)+2=6$이므로 점 $B$의 좌표는 $(-1,6)$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.37
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 접선의 방정식에서 기울기를 이용하여 점 $B$의 좌표를 구함. [공식 채점표 원문은 $B(4,7)$로 적혀 있으나 해설의 $(-1,6)$과 불일치. 해설 기준, 미수정]
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    선분 $AB$의 길이를 구하시오
  points: 4
  depends_on: []
  answer:
    kind: value
    value: 2*sqrt(10)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $A(1,0),\ B(-1,6)$이므로 $\overline{AB}=\sqrt{(1-(-1))^2+(6-0)^2}=\sqrt{40}=2\sqrt{10}$
