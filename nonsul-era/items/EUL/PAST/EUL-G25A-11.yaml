stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $\displaystyle\int_0^x xf(t)dt=\dfrac13x^3-8x-\dfrac{32}{3}+2\int_a^x f(t)dt+\int_a^x tf(t)dt$를 만족시킨다.
  $f(a)$의 값을 구하는 과정을 아래의 단계에 따라 서술하시오. (단, $a$는 $0$이 아닌 상수이다.)
subparts:
- id: '1'
  stem: |
    $f(0)$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        양변을 미분하면 $xf(x)+\displaystyle\int_0^x f(t)dt=x^2-8+2f(x)+xf(x)$
        $\displaystyle\int_0^x f(t)dt=x^2-8+2f(x)\cdots$ ㉠
        양변에 $x=0$을 대입하면 $2f(0)=8$이므로 $f(0)=4$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.41
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 주어진 다항함수의 양변을 미분하고, 양변에 $x=0$을 대입하여 $f(0)=4$를 구함.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $\displaystyle\int_0^a f(x)dx=0$인 $a$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '-4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        ㉠의 식의 양변을 한번 더 미분하면 $f(x)=2x+2f'(x)$. $f'(x)$는 $f(x)$보다 차수가 작으므로 $f(x)$는 1차식이고 $f'(x)$는 상수이다.
        $f(0)=4$이므로 $2f'(0)=4$, $f'(x)=2,\ f(x)=2x+4$
        $\displaystyle\int_0^a f(x)dx=0$이고 $\left[x^2+4x\right]_0^a=a^2+4a=0$이다.
        $a(a+4)=0$이므로 $a=0,\ a=-4$이고 $a\ne0$이므로 $a=-4$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.41
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
