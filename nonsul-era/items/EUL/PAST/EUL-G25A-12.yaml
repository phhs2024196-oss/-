      content: |
        $a_{2n}=-4n+3,\ a_{2n+1}=5n-1$
        $n=1$일 때 $a_2=-1,\ a_3=4$
        $n=2$일 때 $a_4=-5,\ a_5=9$
        $S_5=-1+(-1)+4+(-5)+9=6$
