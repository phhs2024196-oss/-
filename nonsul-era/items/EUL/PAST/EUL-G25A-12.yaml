stem: |
  $a_1=a_2$인 수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라 하자. 모든 자연수 $n$에 대하여 $S_{2n+1}-S_{2n}=5n-1,\ S_{2n}-S_{2n-1}=-4n+3$이 성립할 때, $S_k<0$을 만족시키는 모든 자연수 $k$중에서 가장 큰 값을 구하는 과정을 아래의 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    $a_1+a_3$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $S_{2n}-S_{2n-1}=a_{2n}=-4n+3$이므로 $n=1$을 대입하면 $a_2=-1$이다.
        $a_1=a_2$이므로 $a_1=-1$
        $S_{2n+1}-S_{2n}=a_{2n+1}=5n-1$이므로 $n=1$을 대입하면 $a_3=4$이다.
        $a_1+a_3=3$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.44
      criteria:
      - 1.M1
  rubric:
    rules:
