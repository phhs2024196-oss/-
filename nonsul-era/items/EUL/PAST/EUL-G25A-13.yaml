stimuli: []
stem: |
  $0\le x<2\pi$에서 함수 $f(x)=\sin^2x-\cos^2x-\sin x$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M-m$의 값을 구하는 과정을 아래의 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    $\sin x=t$라 할 때, $f(x)$를 $t$에 관한 식으로 나타내시오.
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: 2*t**2-t-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\sin^2x-(1-\sin^2x)-\sin x=2\sin^2x-\sin x-1$
        $\sin x=t\ (-1\le t\le1)$라 하면 $f(x)=2t^2-t-1$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.47
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $\sin^2x+\cos^2x=1$을 이용하여, $\sin x$를 $t$로 대입한 후, 주어진 식을 $t$에 관한 식으로 바꿈.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $M-m$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 25/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        최댓값 $M$은 $t=-1$일 때이고 $M=2$
        최솟값 $m$은 $t=\dfrac14$일 때이고 $m=-\dfrac98$
        $M-m=2-\left(-\dfrac98\right)=\dfrac{25}{8}$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.47
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 주어진 함수의 그래프 형태를 파악한 후, 최댓값과 최솟값을 구한 후, $M-m=\dfrac{25}{8}$을 구함.
      steps:
      - 2b-1
