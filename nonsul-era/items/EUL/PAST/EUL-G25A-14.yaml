stimuli: []
stem: |
  함수 $f(x)=8^x$의 그래프를 $x$축의 방향으로 $p$만큼, $y$축의 방향으로 $q$만큼 평행 이동하였더니 함수 $g(x)=\dfrac18\times2^{3x}-2$의 그래프가 되었다. 함수 $g(x)$의 그래프가 $x$축과 만나는 점을 $A$, $y$축과 만나는 점을 $B$라 할 때, 원점 $O$에 대하여 삼각형 $OAB$의 넓이 구하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    상수 $p,\ q$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: p=1; q=-2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g(x)=\dfrac18\times2^{3x}-2=2^{-3}\times2^{3x}-2=2^{3(x-1)}-2=8^{(x-1)}-2$이므로
        $p=1,\ q=-2$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.50
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 주어진 지수 그래프에서 평행 이동 성질과 지수법칙을 적용하여, 상수 $p$, $q$의 값을 모두 구함.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    삼각형 $OAB$의 넓이를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 5/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(x)=2^{3(x-1)}-2=0$, $2^{3(x-1)}=2^1,\ 3(x-1)=1$
        $x=\dfrac43$이므로 $A\left(\dfrac43,0\right)$
        $g(0)=\dfrac18-2=-\dfrac{15}{8}$이므로 $B\left(0,-\dfrac{15}{8}\right)$
        $O(0,0),\ A\left(\dfrac43,0\right),\ B\left(0,-\dfrac{15}{8}\right)$이므로 삼각형 $OAB$의 넓이는 $\dfrac12\times\dfrac43\times\dfrac{15}{8}=\dfrac54$
      source_flow: 문항카드(수학) 1교시 G25_1_C.pdf p.50
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
