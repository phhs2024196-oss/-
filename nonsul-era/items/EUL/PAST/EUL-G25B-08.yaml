stimuli: []
stem: |
  함수 $f(x)=\begin{cases}\dfrac{x^2-a}{x-3}&(x\ne3)\\ b&(x=3)\end{cases}$가 $x=3$에서 연속일 때, $f(b)$의 값을 계산하는 과정을 아래의 단계에 따라 서술하시오. (단, $a,\ b$는 상수)
subparts:
- id: '1'
  stem: |
    $a$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '9'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$가 $x=3$에서 연속이므로 $\displaystyle\lim_{x\to3}f(x)=f(3)$
        $\displaystyle\lim_{x\to3}\dfrac{x^2-a}{x-3}=b,\ \lim_{x\to3}(x-3)=0$이므로 $\displaystyle\lim_{x\to3}(x^2-a)=0$
        따라서 $a=9$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.31
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 함수 $f(x)$가 $x=3$에서 연속이므로, $\displaystyle\lim_{x\to3}\dfrac{x^2-a}{x-3}=b$를 만족함. 따라서 $a=9$임.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $b$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\displaystyle\lim_{x\to3}\dfrac{x^2-9}{x-3}=b$이므로 $\displaystyle\lim_{x\to3}\dfrac{x^2-9}{x-3}=\lim_{x\to3}\dfrac{(x-3)(x+3)}{x-3}=6$
        즉 $b=6$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.31
      criteria:
