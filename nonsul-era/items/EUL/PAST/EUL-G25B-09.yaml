stimuli: []
stem: |
  공차가 $0$이 아닌 등차수열 $\{a_n\}$에 대하여
  $a_1=27,\lvert a_7\rvert=\lvert a_{13}\rvert$ 일 때,
  $a_{20}$의 값을 구하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    수열 $\{a_n\}$의 공차 $d$를 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '-3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        등차수열 $\{a_n\}$의 공차를 $d\ (d\ne0)$이라 하자.
        $d>0$이면 $\lvert a_7\rvert<\lvert a_{13}\rvert$이므로 조건을 만족시킬 수 없다. 즉, $d<0$이다.
        따라서 $a_1=27>a_7>a_{13}$이고, $\lvert a_7\rvert=\lvert a_{13}\rvert$이므로 $a_{13}=-a_7$
        $27+12d=-(27+6d)$
        $18d=-54$이므로 $d=-3$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.34
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
