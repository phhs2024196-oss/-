    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    수열 $\{a_n\}$의 일반항 $a_n$을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: expression
    value: -3*n+30
    equivalents: []
    tolerance: null
  solutions:
