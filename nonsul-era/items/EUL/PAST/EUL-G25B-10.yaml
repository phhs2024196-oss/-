stimuli: []
stem: |
  곡선 $y=x^4-2x^3+x+1$ 위의 점 $A(1,1)$에서의 접선 $l$과 곡선 $y=x^2-7x+11$이 점 $B$에서 접할 때, $\overline{AB}=k$이다. $k$의 값을 구하는 과정을 아래의 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    접선 $l$의 방정식을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: expression
    value: y=-x+2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=x^4-2x^3+x+1,\ y'=4x^3-6x^2+1$
        점 $A(1,1)$에서의 접선의 기울기는 $y'(1)=4-6+1=-1$이므로
        $A(1,1)$을 지나는 접선의 방정식은 $y-1=-1(x-1)$
        $y=-x+2$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.38
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 주어진 함수 위의 점 $A$에서 접선의 방정식 $y=-x+2$를 구함.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    점 $B$의 좌표를 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: (3, -1)
    equivalents:
    - (3,-1)
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $y=x^2-7x+11$에서 $y'=2x-7$
        점 $B$의 좌표를 $B(t,t^2-7t+11)$이라 하면 점 $B$에서의 접선이 직선 $y=-x+2$이므로 접선의 기울기는 $-1$
        $2t-7=-1,\ t=3$
        따라서 $y(3)=3^2-7\times3+11=-1$이므로 점 $B$의 좌표는 $(3,-1)$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.38
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 접선의 방정식에서 기울기를 이용하여 점 $B$의 좌표를 구함. [공식 채점표 원문은 $(1,-1)$로 적혀 있으나 해설의 $(3,-1)$과 불일치($(1,-1)$은 직선 $y=-x+2$ 위의 점이 아님). 해설 기준, 미수정]
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    $k$의 값을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: 2*sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $A(1,1),\ B(3,-1)$이므로 $\overline{AB}=\sqrt{(3-1)^2+(-1-1)^2}=2\sqrt2=k$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.38
      criteria:
      - 3.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: 두 점 $A,B$사이의 거리 $k$를 구함. [공식 채점표 원문은 $k=2$로 적혀 있으나 해설의 $2\sqrt2$와 불일치. 해설 기준, 미수정]
      steps:
      - 3b-1
