stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $2f(x)-xf(x)=x^3-\dfrac{15}{2}x^2+18x-\displaystyle\int_1^x f(t)dt$를 만족시킬 때,
  $f(2)$의 값을 구하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    $f'(x)$를 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: expression
    value: -3*x+9
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        양변을 $x$에 대하여 미분하면
        $2f'(x)-f(x)-xf'(x)=3x^2-15x+18-f(x)$
        $(2-x)f'(x)=3(x^2-5x+6)=3(x-2)(x-3)$
        $f(x)$가 다항함수이므로 $f'(x)=-3x+9$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.41
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 주어진 다항함수의 양변을 미분하고, $f'(x)=-3x+9$를 구함.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    함수 $f(x)$를 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: expression
    value: -3*x**2/2+9*x+4
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)=\displaystyle\int(-3x+9)dx=-\dfrac32x^2+9x+C$ (단, $C$는 적분상수)
        주어진 식의 양변에 $x=1$을 대입하면 $f(1)=1-\dfrac{15}{2}+18$에서 $f(1)=\dfrac{23}{2}$
        $f(1)=-\dfrac32+9+C=\dfrac{23}{2},\ C=4$
        따라서 $f(x)=-\dfrac32x^2+9x+4$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.41
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 주어진 함수 $f'(x)$를 적분하고, 주어진 식의 양변에 $x=1$을 대입하여 $f(x)=-\dfrac32x^2+9x+4$를 구함.
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    $f(2)$의 값을 구하시오.
  points: 4
  depends_on: []
  answer:
