stimuli: []
stem: |
  $a_3=20$인 수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하자.
  $b_n=S_n+5$라 할 때, 수열 $\{b_n\}$은 공비가 $2$인 등비수열이다.
  $S_5$의 값을 구하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    첫째항 $a_1$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        수열 $\{b_n\}$은 첫째항이 $S_1+5$이고 공비가 $2$인 등비수열이므로
        $b_n=S_n+5=(a_1+5)\times2^{n-1}$
        $S_n=(a_1+5)\times2^{n-1}-5$
        $n\ge2$일 때, $a_n=S_n-S_{n-1}=\{(a_1+5)\times2^{n-1}-5\}-\{(a_1+5)\times2^{n-2}-5\}=(a_1+5)\times2^{n-2}$
        $a_3=20$에서 $2(a_1+5)=20,\ a_1=5$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.45
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 수열의 합과 일반항 사이의 관계와 $a_3=20$을 이용하여 $a_1=5$을 계산함.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    일반항 $a_n$을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: expression
    value: 5*2**(n-1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a_1=5$이고 $n\ge2$일 때, $a_n=S_n-S_{n-1}=(a_1+5)\times2^{n-2}=10\times2^{n-2}=5\times2^{n-1}$이므로
        따라서 $a_n=5\times2^{n-1}$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.45
      criteria:
