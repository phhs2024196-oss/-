stimuli: []
stem: |
  함수 $f(x)=-\sin^2x-4\cos x+1$에 대하여 $f(x)=k$가 실근을 갖도록 하는 $k$값의 범위를 $\alpha\le k\le\beta$라 할 때, $\alpha+\beta$의 값을 구하는 과정을 아래의 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    $\cos x=t$라 할 때, $f(x)$를 $t$에 관한 식으로 나타내시오.
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: t**2-4*t
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sin^2x=1-\cos^2x$이므로 $f(x)=-\sin^2x-4\cos x+1=-(1-\cos^2x)-4\cos x+1$
        $f(x)=\cos^2x-4\cos x=t^2-4t\ (-1\le t\le1)$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.49
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $\sin^2x+\cos^2x=1$을 이용하여, $\cos x$를 $t$로 대입한 후, 주어진 식을 $t$에 관한 식으로 바꿈.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $\alpha+\beta$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(t)=t^2-4t+4-4=(t-2)^2-4\ (-1\le t\le1)$이라 하면 $t=1$일 때 최솟값을 갖고, $t=-1$일 때 최댓값을 가지므로 $f(-1)=5,\ f(1)=-3$이다.
        $f(x)=k$가 실근을 갖기 위해서는 $-3\le k\le5$이므로 $\alpha=-3,\ \beta=5$이다.
        $\alpha+\beta=2$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.49
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 주어진 함수의 최댓값과 최솟값을 이용하여, $f(x)=k$가 실근을 갖는 $\alpha$와 $\beta$를 각각 구함. 주어진 값을 이용하여 $\alpha+\beta$를 구함.
      steps:
      - 2b-1
