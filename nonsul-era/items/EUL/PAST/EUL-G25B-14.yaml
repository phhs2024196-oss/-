stem: |
  두 점 $A(0,a)\ (a>0),\ B(8,0)$에 대하여 선분 $AB$가 함수 $y=\log_3(x+1)$의 그래프와 만나는 점을 $C$라 하자. $\overline{AC}:\overline{CB}=1:3$일 때, 점 $C$의 좌표의 값을 계산하는 과정을 아래의 단계에 따라 서술하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: |
    점 $C$의 $y$좌표를 $ka$라 할 때, 상수 $k$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 3/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $C$는 선분 $AB$의 $1:3$내분점이므로
        $A(0,a),\ B(8,0)$에 대하여 선분 $AB$의 $1:3$내분점을 구하면
        $x=\dfrac{8+0}{4},\ y=\dfrac{0+3a}{4}$이고, $C\left(2,\dfrac34a\right)$이므로 $k=\dfrac34$
      source_flow: 문항카드(수학) 2교시 G25_2_C.pdf p.52
      criteria:
      - 1.M1
  rubric:
