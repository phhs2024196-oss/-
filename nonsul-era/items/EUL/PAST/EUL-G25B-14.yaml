    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $C\left(2,\dfrac34a\right)$는 함수 $y=\log_3(x+1)$ 위의 점이므로 대입하면
        $\dfrac34a=\log_33,\ \dfrac34a=1,\ a=\dfrac43$
        따라서 $a=\dfrac43$를 대입하면 $C(2,1)$
