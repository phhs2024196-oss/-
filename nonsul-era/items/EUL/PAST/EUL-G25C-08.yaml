stimuli: []
stem: |
  8. 다항함수 $f(x)$가 $\displaystyle\lim_{x\to\infty}\frac{f(x)}{4x^2-1}=1$, $\displaystyle\lim_{x\to\frac12}\frac{f(x)}{4x^2-1}=2$ 를 만족시킬 때, $f\left(\dfrac32\right)$의 값을 계산하는 과정을 아래의 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    (1) 다항함수 $f(x)$의 최고차항의 계수를 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        극한값 $1$이 0이 아니고 분모 $4x^2-1$이 이차이므로 $f(x)$도 이차함수이다. $f(x)=ax^2+bx+c$로 두면 $\displaystyle\lim_{x\to\infty}\frac{f(x)}{4x^2-1}=\frac a4=1$이므로 $a=4$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.30
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $f(x)$를 2차 함수로 설정하고, 조건을 이용하여 최고차항 계수 $a=4$를 구한 식이 적혀 있다.
      steps:
      - 1b-1
  outcome_codes:
