      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: $f(x)$를 $4\left(x-\frac12\right)(x+k)$로 재설정하고 극한 조건으로 $k=\frac32$를 구해 $f\left(\frac32\right)=12$를 얻은 과정이 적혀 있다.
      steps:
