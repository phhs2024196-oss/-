    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) $f\left(\dfrac12\right)$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\displaystyle\lim_{x\to\frac12}\frac{f(x)}{4x^2-1}=2$에서 $x\to\frac12$일 때 (분모)$\to0$이고 극한값이 존재하므로 (분자)$\to0$. 따라서 $\displaystyle\lim_{x\to\frac12}f(x)=f\left(\dfrac12\right)=0$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.30
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
