  misconceptions: []
- id: '3'
  stem: |
    (3) $f\left(\dfrac32\right)$의 값을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '12'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(x)=4\left(x-\dfrac12\right)(x+k)$로 놓으면 $\displaystyle\lim_{x\to\frac12}\frac{f(x)}{4x^2-1}=\lim_{x\to\frac12}\frac{4\left(x-\frac12\right)(x+k)}{4\left(x-\frac12\right)\left(x+\frac12\right)}=\lim_{x\to\frac12}\frac{x+k}{x+\frac12}=\frac12+k$. $\dfrac12+k=2$이므로 $k=\dfrac32$. 따라서 $f(x)=4\left(x-\dfrac12\right)\left(x+\dfrac32\right)$이므로 $f\left(\dfrac32\right)=12$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.30
      criteria:
      - 3.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
