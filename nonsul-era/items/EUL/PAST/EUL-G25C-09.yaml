stimuli: []
stem: |
  9. 등차수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라 하자. 모든 자연수 $n$에 대하여 $S_{n+2}-S_n=56-8n$ 이 성립할 때, $S_6$의 값을 계산하는 과정을 아래의 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    (1) 수열 $\{a_n\}$의 공차 $d$를 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '-4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        공차를 $d$라 하면 $S_{n+2}-S_n=a_{n+1}+a_{n+2}=[a_1+nd]+[a_1+(n+1)d]$이므로 $(2a_1+d)+2dn=56-8n$. 모든 자연수 $n$에 대하여 성립하려면 $2nd=-8n$이므로 $d=-4$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.35
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $S_{n+2}-S_n$을 $a_{n+1}+a_{n+2}$로 변형하여 $2nd=-8n$의 식을 도출하고 $d=-4$를 구한 과정이 적혀 있다.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) 수열 $\{a_n\}$의 첫째항 $a_1$을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '30'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $2a_1+d=56$이므로 $d=-4$를 대입하면 $a_1=30$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.35
      criteria:
      - 2.M1
  rubric:
    rules:
