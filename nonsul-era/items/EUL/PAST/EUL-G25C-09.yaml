      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: $2a_1+d=56$에 $d=-4$를 대입하여 $a_1=30$을 구한 식이 적혀 있다.
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (3) $S_6$을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '120'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $S_n=\dfrac{n\{2a_1+(n-1)d\}}{2}$이므로 $S_6=\dfrac{6\{2\times30+5\times(-4)\}}{2}=120$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.35
