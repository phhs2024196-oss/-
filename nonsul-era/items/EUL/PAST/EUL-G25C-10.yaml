stimuli: []
stem: |
  10. 곡선 $y=x^3-2x^2+x+2$ 위의 점 $A(1,2)$에서의 접선이 이 곡선과 만나는 점 중 $A$가 아닌 점을 $B$라 하자. 이 곡선 위의 점 $B$에서의 접선과 $x$축이 만나는 점을 $C$라 할 때, 사각형 $OABC$의 넓이를 계산하는 과정을 아래의 단계에 따라 서술하시오. (단, $O$는 원점이다.)
subparts:
- id: '1'
  stem: |
    (1) 점 $B$의 좌표를 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: (0, 2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^3-2x^2+x+2$라 하면 $f'(x)=3x^2-4x+1$이므로 $f'(1)=0$. 접선의 방정식은 $y-2=0\cdot(x-1)$, 즉 $y=2$. 접선과 곡선이 만나는 점은 $x^3-2x^2+x+2=2$, $x(x-1)^2=0$에서 $x=0,1$. 따라서 $B$의 $x$좌표는 $0$이고 $f(0)=2$이므로 $B(0,2)$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.39
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $A$에서의 접선 $y=2$를 구하고 곡선과의 교점을 계산하여 $B(0,2)$를 구한 과정이 적혀 있다.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) 점 $C$의 좌표를 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: (-2, 0)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $B(0,2)$에서의 접선의 기울기는 $f'(0)=1$이므로 접선의 방정식은 $y=x+2$. $x$축과 만나는 점은 $0=x+2$에서 $x=-2$이므로 $C(-2,0)$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.39
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: $B$에서의 접선 $y=x+2$와 $x$축의 교점을 계산하여 $C(-2,0)$을 구한 과정이 적혀 있다.
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (3) $OABC$의 넓이를 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        사각형 $OABC$는 $AB\parallel OC$인 사다리꼴이고 $\overline{AB}=1$, $\overline{OC}=2$, 높이는 $2$이므로 넓이는 $\dfrac12(1+2)\cdot2=3$.
