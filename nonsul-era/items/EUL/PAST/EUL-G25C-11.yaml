- id: '2'
  stem: |
    (2) $f(x)$를 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: 6*x+6
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        [공식 해설 그대로 기록] ㉡에서 $\int_{-3}^{x}f(t)dt=3x^2+9x$이고 양변을 $x$에 대하여 미분하면 $f(x)=6x+9$. (문항 원문의 하한 $-2$, 계수 $\frac a2+2$ 그대로 풀면 $\int_{-2}^{x}f(t)dt=3x^2+6x$이므로 $f(x)=6x+6$이어서 공식 답과 다르다.)
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.43 (공식 해설은 하한 -3·계수 2a+1/2 전제로 풀어 f(x)=6x+9, f(a)=21 — 문항 원문과 불일치. 독립 교차검증 2회 일치로 DB 정답은 원문 기준 f(x)=6x+6, f(a)=18 로 정정, 2026-11-23)
