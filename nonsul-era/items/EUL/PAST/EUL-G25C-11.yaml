stimuli: []
stem: |
  11. 다항함수 $f(x)$가 모든 실수 $x$에 대하여 $$\int_{-2}^{x}xf(t)dt-\int_{-2}^{x}tf(t)dt=x^3+\left(\frac a2+2\right)x^2-2a$$ 를 만족시킬 때, $f(a)$의 값을 구하는 과정을 아래의 단계에 따라 서술하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: |
    (1) $a$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        [공식 해설 그대로 기록] $x\int f(t)dt-\int tf(t)dt$ 꼴로 정리하고 양변을 $x$에 대하여 미분하면 $\int f(t)dt+xf(x)-xf(x)$에서 $\int_{-3}^{x}f(t)dt=3x^2+2\left(2a+\frac12\right)x$ ……㉡. ㉡의 양변에 $x=-3$을 대입하면 $0=27-6\left(2a+\frac12\right)$, $a=2$. (공식 해설은 하한 $-3$, 계수 $2a+\frac12$로 전개되어 문항 원문의 하한 $-2$, 계수 $\frac a2+2$와 다르다. 어느 쪽이든 $a=2$.)
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.43 (공식 해설은 하한 -3·계수 2a+1/2 전제로 풀어 f(x)=6x+9, f(a)=21 — 문항 원문과 불일치. 독립 교차검증 2회 일치로 DB 정답은 원문 기준 f(x)=6x+6, f(a)=18 로 정정, 2026-11-23)
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
