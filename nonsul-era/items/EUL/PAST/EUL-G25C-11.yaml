      mark_type: M
      points: 3
      evidence: 양변을 $x$에 대하여 미분하여 $f(x)$에 대한 새로운 방정식을 도출하고, 특정 값을 대입하여 $a=2$를 구한 과정이 적혀 있다.
      steps:
      - 1b-1
  outcome_codes:
