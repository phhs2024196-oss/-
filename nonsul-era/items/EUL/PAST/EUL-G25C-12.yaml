stimuli: []
stem: |
  12. 공비가 $1$보다 큰 등비수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하자. $$\frac{a_1}{a_2}+\frac{a_3}{a_2}+\frac{a_3}{a_4}+\frac{a_5}{a_4}+\frac{a_5}{a_6}+\frac{a_7}{a_6}=10$$ 이고 $a_4=6$일 때, $S_n>3^{12}$을 만족시키는 자연수 $n$의 최솟값을 구하는 과정을 아래의 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    (1) 등비수열 $\{a_n\}$의 공비를 $r\ (r>1)$이라 할 때, $r$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\dfrac{a_1}{a_2}+\dfrac{a_3}{a_2}+\dfrac{a_3}{a_4}+\dfrac{a_5}{a_4}+\dfrac{a_5}{a_6}+\dfrac{a_7}{a_6}=10$에서 $\dfrac1r+r+\dfrac1r+r+\dfrac1r+r=10$. $3r^2-10r+3=0$, $(3r-1)(r-3)=0$이고 $r>1$이므로 $r=3$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.47
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 주어진 비율 식을 $r$로 나타내 $3r^2-10r+3=0$을 세우고 $r>1$에서 $r=3$을 구한 과정이 적혀 있다.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) 등비수열 $\{a_n\}$의 첫째항 $a_1$을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: 2/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a_4=a_1\times3^3=6$이므로 $a_1=\dfrac29$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.47
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 등비수열의 일반항을 적용하여 $a_1\times3^3=6$에서 $a_1=\frac29$를 구한 식이 적혀 있다.
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (3) $S_n>3^{12}$을 만족시키는 자연수 $n$의 최솟값을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '15'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $S_n=\dfrac{\frac29(3^n-1)}{3-1}=\dfrac19(3^n-1)>3^{12}$에서 $3^n-1>3^{14}$. 따라서 $n\ge15$이므로 조건을 만족시키는 자연수 $n$의 최솟값은 $15$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.47
      criteria:
      - 3.M1
