stimuli: []
stem: |
  13. 함수 $f(x)=a\sin b(x+\pi)+c$가 다음 조건을 만족시키도록 하는 세 자연수 $a$, $b$, $c$에 대하여 $a+b+c$의 최솟값을 구하는 과정을 아래의 단계에 따라 서술하시오.

  (가) 함수 $f(x)$의 최댓값과 최솟값은 각각 $15$, $-3$이다.

  (나) $f\left(\dfrac{\pi}{6}\right)=6$
subparts:
- id: '1'
  stem: |
    (1) $a\times c$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '54'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $-1\le\sin b(x+\pi)\le1$이고 $a$, $c$가 자연수이므로 $f(x)$의 최댓값과 최솟값은 각각 $a+c$, $-a+c$. 조건 (가)에 의하여 $a+c=15$ ……㉠, $-a+c=-3$ ……㉡. ㉠$-$㉡에서 $a=9$, $a=9$를 ㉠에 대입하면 $c=6$. 따라서 $a\times c=54$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.50
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 최댓값 $a+c=15$, 최솟값 $-a+c=-3$의 연립방정식을 세워 $a=9$, $c=6$을 구하고 $a\times c=54$를 적었다.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) $a+b+c$의 최솟값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '21'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)=9\sin b(x+\pi)+6$에서 조건 (나)에 의하여 $f\left(\dfrac\pi6\right)=9\sin\dfrac{7b}{6}\pi+6=6$, 즉 $\sin\dfrac{7b}{6}\pi=0$ ……㉢. 이때 $\dfrac{7b}{6}=1,2,3,4,\cdots$이고 ㉢을 만족시키는 자연수 $b$의 값은 $b=6,12,18,\cdots$. 그러므로 $b$의 최솟값은 $6$이고 $a+b+c$의 최솟값은 $a=9$, $b=6$, $c=6$일 때 $9+6+6=21$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.50
      criteria:
      - 2.M1
