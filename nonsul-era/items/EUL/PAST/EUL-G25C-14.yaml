stimuli: []
stem: |
  14. 기울기가 $-\dfrac12$인 직선이 두 함수 $f(x)=\log_2x$, $g(x)=\log_2(x-4)-2$의 그래프와 만나는 점을 각각 $A$, $B$라 하자. 선분 $AB$의 중점의 좌표가 $(6,\ a)$일 때, 두 점 $A$, $B$를 지나는 직선의 방정식 구하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    (1) 점 $A$와 점 $B$의 좌표를 각각 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: A=(4, 2); B=(8, 0)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $y=\log_2(x-4)-2$는 $y=\log_2x$의 그래프를 $x$축의 방향으로 $4$만큼, $y$축의 방향으로 $-2$만큼 평행이동한 그래프이다. $y=\log_2x$ 위의 점을 $(p,q)$라 하면 평행이동에 의해 $(p+4,q-2)$로 옮겨지고 이 점은 $y=\log_2(x-4)-2$ 그래프 위의 점이다. 두 점 $(p,q)$, $(p+4,q-2)$를 지나는 직선의 기울기가 $-\dfrac12$이므로 $A(p,q)$, $B(p+4,q-2)$라 하면 선분 $AB$의 중점의 좌표는 $\left(\dfrac{p+(p+4)}{2},\dfrac{q+(q-2)}{2}\right)=(p+2,q-1)$. 이 중점의 $x$좌표가 $6$이므로 $p+2=6$, $p=4$, $q=\log_24=2$. 따라서 $A(4,2)$이고 $B(p+4,q-2)$이므로 $B(8,0)$.
      source_flow: 문항카드(수학) 3교시 G25_3_C.pdf p.53
