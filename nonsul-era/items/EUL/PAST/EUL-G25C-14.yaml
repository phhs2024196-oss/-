  stem: |
    (2) 점 $A$와 점 $B$를 지나는 직선의 방정식을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: -x/2+4
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        기울기가 $-\dfrac12$이고 $A(4,2)$를 지나는 직선의 방정식은 $y=-\dfrac12(x-4)+2$. 따라서 $y=-\dfrac12x+4$.
