stimuli: []
stem: |
  8. 두 상수 $a$, $b$에 대하여 $f(x)=\log_5(ax+b)$의 그래프가 $x$축, $y$축과 만나는 점을 각각 A, B라 하고, 점 A에서 함수 $y=f(x)$ 그래프의 점근선에 내린 수선의 발을 H라 하자. 점 A는 선분 OH의 중점이고 $\overline{\mathrm{OA}}=\overline{\mathrm{OB}}$일 때, $b^a$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오. (단, O는 원점이고, $a>1$, $b>1$이다.)
subparts:
- id: '1'
  stem: |
    (1) $b$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=\log_5(ax+b)$에 $y=0$을 대입하면 $ax+b=1$, $x=\dfrac{1-b}{a}$이므로 $A\left(\dfrac{1-b}{a},0\right)$. $x=0$을 대입하면 $y=\log_5b$이므로 $B(0,\log_5b)$. 점근선은 $x=-\dfrac ba$이므로 $H\left(-\dfrac ba,0\right)$. 점 A는 선분 OH의 중점이므로 $\dfrac{0+\left(-\frac ba\right)}{2}=\dfrac{1-b}{a}$, $-\dfrac b2=1-b$에서 $b=2$.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.2
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: A, B의 좌표와 점근선 $x=-\frac ba$로 H의 좌표를 구하고 중점 조건에서 $b=2$를 구한 과정이 적혀 있다.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) $b^a$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\overline{OA}=\overline{OB}$이므로 $\dfrac{b-1}{a}=\log_5b$에서 $\dfrac1a=\log_52$. $a=\dfrac1{\log_52}=\log_25$. 따라서 $b^a=2^{\log_25}=5^{\log_22}=5$.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.2
      criteria:
      - 2.M1
  rubric:
    rules:
