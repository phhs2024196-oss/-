stimuli: []
stem: |
  9. 방정식 $3x^2-10x+3=0$의 한 근이 $\dfrac{\cos\theta}{1-\sin\theta}$일 때, $\tan\theta$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오. (단, $\dfrac{3\pi}{2}<\theta<2\pi$)
subparts:
- id: '1'
  stem: |
    (1) $\cos\theta$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 3/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        방정식 $3x^2-10x+3=0$의 한 근이 $\dfrac{\cos\theta}{1-\sin\theta}$이므로 다른 한 근을 $\beta$라 하면 근과 계수의 관계에 의하여 $\dfrac{\cos\theta}{1-\sin\theta}+\beta=\dfrac{10}3$, $\dfrac{\cos\theta}{1-\sin\theta}\times\beta=1$. 이때 $\beta=\dfrac{1-\sin\theta}{\cos\theta}$이므로 $\dfrac{\cos\theta}{1-\sin\theta}+\dfrac{1-\sin\theta}{\cos\theta}=\dfrac{\cos^2\theta+(1-\sin\theta)^2}{\cos\theta(1-\sin\theta)}=\dfrac{(\cos^2\theta+\sin^2\theta)-2\sin\theta+1}{\cos\theta(1-\sin\theta)}=\dfrac{2(1-\sin\theta)}{\cos\theta(1-\sin\theta)}=\dfrac2{\cos\theta}$. 즉 $\dfrac2{\cos\theta}=\dfrac{10}3$이므로 $\cos\theta=\dfrac35$.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.5
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
