      mark_type: M
      points: 5
      evidence: 근과 계수의 관계와 삼각함수 사이의 관계를 이용하여 $\frac2{\cos\theta}=\frac{10}3$을 얻고 $\cos\theta=\frac35$를 구한 과정이 적혀 있다.
      steps:
      - 1b-1
