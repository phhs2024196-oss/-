- id: '2'
  stem: |
    (2) $\tan\theta$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: -4/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\dfrac{3\pi}2<\theta<2\pi$에서 $\sin\theta<0$이므로 $\sin\theta=-\sqrt{1-\cos^2\theta}=-\sqrt{1-\left(\dfrac35\right)^2}=-\dfrac45$. 따라서 $\tan\theta=\dfrac{\sin\theta}{\cos\theta}=\dfrac{-\frac45}{\frac35}=-\dfrac43$.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.5
      criteria:
      - 2.M1
