    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) 수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 할 때, $S_{12}$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '114'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a_1=3-10=-7$, $a_{12}=36-10=26$이므로 수열 $\{a_n\}$의 첫째항부터 제 $12$항까지의 합 $S_{12}$는 $S_{12}=\dfrac{12(a_1+a_{12})}{2}=6(-7+26)=114$.
