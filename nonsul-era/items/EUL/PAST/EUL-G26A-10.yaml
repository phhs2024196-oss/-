stimuli: []
stem: |
  10. 등차수열 $\{a_n\}$에 대하여 수열 $\{a_n+a_{n+2}\}$는 첫째항이 $-8$, 공차가 $6$인 등차수열이다. 수열 $\{a_n\}$의 첫째항부터 제 $12$항까지의 합을 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    (1) 수열 $\{a_n\}$의 일반항을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 3*n-10
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        첫째항이 $-8$, 공차가 $6$인 등차수열 $\{a_n+a_{n+2}\}$의 일반항은 $-8+(n-1)\times6=6n-14$ ……㉠. 수열 $\{a_n\}$은 등차수열이므로 등차중항의 성질에 의하여 $a_n+a_{n+2}=2a_{n+1}$ ……㉡. ㉠, ㉡에서 $2a_{n+1}=6n-14$, 즉 $a_{n+1}=3n-7$. 이때 수열 $\{a_{n+1}\}$은 공차가 $3$인 등차수열이므로 등차수열 $\{a_n\}$의 공차도 $3$이다. 그러므로 $a_n=a_{n+1}-3=3n-10$.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.8
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 등차중항의 성질 $a_n+a_{n+2}=2a_{n+1}$을 이용하여 일반항 $a_n=3n-10$을 구한 과정이 적혀 있다.
      steps:
      - 1b-1
  outcome_codes:
