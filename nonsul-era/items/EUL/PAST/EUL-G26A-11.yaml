stimuli: []
stem: |
  11. 닫힌구간 $[0,\ 6]$에서 $$f(x)=\begin{cases}-x+5 & (0\le x\le3)\\ a(x-2)^2+b & (3<x\le6)\end{cases}$$ 로 정의되고, 모든 실수 $x$에 대하여 $f(x)=f(x+6)$를 만족하는 함수 $f(x)$가 실수 전체의 집합에서 연속이다. 이때, $f(23)$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오. (단, $a$, $b$는 상수이다.)
subparts:
- id: '1'
  stem: |
    (1) $a$, $b$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: a=1/5; b=9/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$가 실수 전체의 집합에서 연속이므로 $x=3$에서도 연속이다. $f(3)=\displaystyle\lim_{x\to3-}f(x)=\lim_{x\to3+}f(x)$이므로 $\displaystyle\lim_{x\to3+}\{a(x-2)^2+b\}=2$, $a+b=2$ ……㉠. $f(x)=f(x+6)$에 $x=0$을 대입하면 $f(0)=f(6)$이므로 $5=a(6-2)^2+b$, $16a+b=5$ ……㉡. ㉠, ㉡을 연립하여 풀면 $a=\dfrac15$, $b=\dfrac95$.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.11
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $x=3$에서의 연속 조건과 $f(0)=f(6)$으로 연립방정식 $a+b=2$, $16a+b=5$를 세워 $a=\frac15$, $b=\frac95$를 구한 과정이 적혀 있다.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) $f(23)$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 18/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)=f(x+6)$이므로 $f(23)=f(17)=\cdots=f(5)=\dfrac15(5-2)^2+\dfrac95=\dfrac{18}5$.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.11
      criteria:
      - 2.M1
