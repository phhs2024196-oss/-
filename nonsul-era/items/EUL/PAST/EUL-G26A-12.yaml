stimuli: []
stem: |
  12. 두 다항함수 $f(x)$, $g(x)$가 다음 조건을 만족시킨다.

  (가) $\displaystyle\lim_{x\to0+}x^2f\left(\dfrac1x\right)=3$

  (나) $\displaystyle\lim_{x\to\infty}\frac{f(x)-3g(x)}{x}=5$

  $f(1)=2$, $f(2)=16$, $g(0)=-3$일 때, $g(3)$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    (1) 함수 $f(x)$를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 3*x**2+5*x-6
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 $\dfrac1x=t$로 놓으면 $x^2=\dfrac1{t^2}$이고 $x\to0+$일 때 $t\to\infty$이므로 $\displaystyle\lim_{x\to0+}x^2f\left(\dfrac1x\right)=\lim_{t\to\infty}\dfrac{f(t)}{t^2}$. $\displaystyle\lim_{t\to\infty}\dfrac{f(t)}{t^2}=3$이므로 $f(x)=3x^2+ax+b$ ($a$, $b$는 상수)로 놓을 수 있다. $f(1)=2$이므로 $3+a+b=2$, $f(2)=16$이므로 $12+2a+b=16$. 두 식을 연립하면 $a=5$, $b=-6$. 그러므로 $f(x)=3x^2+5x-6$.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.15
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 극한 조건 (가)에서 $f(x)$를 최고차항 계수가 $3$인 이차함수로 놓고, $f(1)=2$, $f(2)=16$으로 $f(x)=3x^2+5x-6$을 구한 과정이 적혀 있다.
      steps:
      - 1b-1
  outcome_codes:
