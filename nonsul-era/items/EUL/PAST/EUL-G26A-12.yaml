  misconceptions: []
- id: '2'
  stem: |
    (2) $g(3)$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        조건 (나)에서 $\displaystyle\lim_{x\to\infty}\dfrac{f(x)-3g(x)}{x}=5$이므로 $f(x)-3g(x)=5x+c$ ($c$는 상수)로 놓을 수 있다. 이 식에 $x=0$을 대입하면 $f(0)-3g(0)=c$에서 $c=-6-3\times(-3)=3$. $f(x)-3g(x)=5x+3$이고 $f(x)=3x^2+5x-6$이므로 $3g(x)=f(x)-5x-3=3x^2+5x-6-5x-3=3x^2-9$. 그러므로 $g(x)=x^2-3$, 따라서 $g(3)=6$.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.15
      criteria:
      - 2.M1
