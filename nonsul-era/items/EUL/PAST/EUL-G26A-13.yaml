  misconceptions: []
- id: '2'
  stem: |
    (2) 선분 AB의 길이를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 3*sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)=x^3-2x+3$이므로 $x^3-2x+3=x+5$, $x^3-3x-2=0$, $(x+1)^2(x-2)=0$에서 $x=-1$ 또는 $x=2$. 따라서 점 B의 좌표는 $(2,7)$이다. 따라서 $\overline{\mathrm{AB}}=\sqrt{\{2-(-1)\}^2+(7-4)^2}=3\sqrt2$.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.18
      criteria:
      - 2.M1
