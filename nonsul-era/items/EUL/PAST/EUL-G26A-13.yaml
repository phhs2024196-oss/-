stimuli: []
stem: |
  13. 상수 $k$에 대하여 함수 $f(x)=x^3+kx+k+5$라 하자. 곡선 $y=f(x)$ 위의 점 A$(-1,\ 4)$에서의 접선이 곡선 $y=f(x)$와 만나는 점 중 A가 아닌 점을 B라 하고, 점 B를 지나고 기울기가 $-1$인 직선이 $y$축과 만나는 점을 C라 하자. 점 B가 선분 AC를 지름으로 하는 원 위의 점일 때, 선분 AB의 길이를 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    (1) 직선 AB의 방정식을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: x+5
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^3+kx+k+5$에서 $f'(x)=3x^2+k$, $f'(-1)=3+k$. 곡선 $y=f(x)$ 위의 점 A$(-1,4)$에서의 접선의 방정식은 $y-4=(3+k)(x+1)$, 즉 $y=(3+k)x+k+7$ ……㉠. 점 B가 선분 AC를 지름으로 하는 원 위의 점이므로 $\angle\mathrm{ABC}=\dfrac\pi2$, 즉 두 직선 AB와 BC는 서로 수직이다. 이때 직선 BC의 기울기가 $-1$이므로 직선 AB의 기울기는 $1$이다. ㉠에서 $3+k=1$이므로 $k=-2$이고, 직선 AB의 방정식은 $y=x+5$.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.18
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 지름에 대한 원주각이 직각임을 이용해 직선 AB의 기울기가 $1$임을 구하고 $k=-2$, $y=x+5$를 구한 과정이 적혀 있다.
      steps:
      - 1b-1
  outcome_codes:
