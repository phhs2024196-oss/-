- id: '2'
  stem: |
    (2) $g(0)$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(x)=\displaystyle\int g'(x)dx=\int(x+1)dx=\dfrac12x^2+x+C_2$ ($C_2$는 적분상수) ……⑤. 식 ②와 ④에서 $f(x)=xg'(x)=x(x+1)$, $f(1)=1\times2=2$. 식 ⑤에서 $g(1)=\dfrac12+1+C_2=\dfrac32+C_2$. $f(1)=g(1)$이므로 $2=\dfrac32+C_2$, $C_2=\dfrac12$. $g(x)=\dfrac12x^2+x+\dfrac12$이므로 $g(0)=\dfrac12$.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.22
      criteria:
      - 2.M1
