stimuli: []
stem: |
  14. 두 다항함수 $f(x)$, $g(x)$가 모든 실수 $x$에 대하여 다음 조건을 만족시킨다.

  (가) $\displaystyle\int f'(x)dx=g'(x)+\int2x\,dx$

  (나) $\displaystyle\int f(x)dx=xg(x)-\int g(x)dx$

  (다) $f(1)=g(1)$

  $g(0)$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    (1) $g'(x)$를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: x+1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 $g'(x)=\displaystyle\int f'(x)dx-\int2x\,dx=f(x)-x^2+C_1$ ($C_1$은 적분상수) ……①. 조건 (나)에서 양변을 $x$로 미분하면 $f(x)=g(x)+xg'(x)-g(x)$, $f(x)=xg'(x)$ ……②. 식 ②를 식 ①에 대입하면 $g'(x)=xg'(x)-x^2+C_1$, $(x-1)g'(x)=x^2-C_1$ ……③. 식 ③의 양변에 $x=1$을 대입하면 $0=1-C_1$, $C_1=1$. 이를 식 ③에 대입하면 $(x-1)g'(x)=(x+1)(x-1)$, $g'(x)=x+1$ ……④.
      source_flow: 문항카드(수학) 1교시 G26_1_MATH.pdf p.22
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 조건 (가)(나)의 정의를 이용하여 $f(x)=xg'(x)$와 $(x-1)g'(x)=x^2-C_1$을 도출하고 $C_1=1$, $g'(x)=x+1$을 구한 과정이 적혀 있다.
