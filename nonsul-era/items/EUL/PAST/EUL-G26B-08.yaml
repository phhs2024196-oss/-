stimuli: []
stem: |
  곡선 $y=3^{x}-\dfrac{1}{3}$이 $x$축과 만나는 점을 A, 곡선 $y=\left(\dfrac{1}{3}\right)^{x}$과 만나는 점을 B라 할 때, 삼각형 AOB의 넓이를 계산하는 과정을 아래 단계에 따라 서술하시오. (단, O는 원점이다.)
subparts:
- id: '1'
  stem: |
    점 B의 $y$좌표 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '(sqrt(37)-1)/6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $3^x-\dfrac{1}{3}=\left(\dfrac{1}{3}\right)^x$에서 $3^x-\dfrac{1}{3}-\dfrac{1}{3^x}=0$이다.
      source_flow: 문항카드(수학) 2교시 p.2
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $3^x=X$라 하면 $X>0$이고 $X-\dfrac{1}{3}-\dfrac{1}{X}=0$에서 $3X^2-X-3=0$이다.
      source_flow: 문항카드(수학) 2교시 p.2
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $X>0$이므로 $X=\dfrac{1+\sqrt{37}}{6}$, 즉 $3^x=\dfrac{1+\sqrt{37}}{6}$이므로 점 B의 $y$좌표는 $3^x-\dfrac{1}{3}=\dfrac{1+\sqrt{37}}{6}-\dfrac{1}{3}=\dfrac{\sqrt{37}-1}{6}$이다.
      source_flow: 문항카드(수학) 2교시 p.2
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        지수방정식 $3^x-\dfrac{1}{3}=\left(\dfrac{1}{3}\right)^x$을 세워 풀어 점 B의 $y$좌표 $\dfrac{\sqrt{37}-1}{6}$을 구한 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    삼각형 AOB의 넓이를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '(sqrt(37)-1)/12'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 B에서 $x$축에 내린 수선의 발을 H라 하면 $\overline{\mathrm{BH}}=\dfrac{\sqrt{37}-1}{6}$이다. (A는 $x$축과의 교점으로 $\overline{\mathrm{OA}}=1$이다.)
      source_flow: 문항카드(수학) 2교시 p.2
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서 삼각형 AOB의 넓이는 $\dfrac{1}{2}\times\overline{\mathrm{OA}}\times\overline{\mathrm{BH}}=\dfrac{1}{2}\times1\times\dfrac{\sqrt{37}-1}{6}=\dfrac{\sqrt{37}-1}{12}$이다.
      source_flow: 문항카드(수학) 2교시 p.2
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        삼각형 AOB의 넓이를 밑변 $\overline{\mathrm{OA}}=1$과 높이 $\overline{\mathrm{BH}}$로 계산해 $\dfrac{\sqrt{37}-1}{12}$을 구한 과정이 적혀 있다.
      steps:
      - 2b-1
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
