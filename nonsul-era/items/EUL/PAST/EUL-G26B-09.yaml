stimuli: []
stem: |
  두 양수 $a,\ b$에 대하여 곡선 $y=\sin ax$의 그래프를 $x$축의 방향으로 $\dfrac{\pi}{6}$만큼, $y$축의 방향으로 $b$만큼 평행이동 한 그래프를 나타내는 함수를 $f(x)$라 하자. 함수 $f(x)$의 주기가 $3\pi$이고 $f\left(\dfrac{2}{3}\pi\right)=\sqrt{3}$일 때, $f\left(-\dfrac{\pi}{12}\right)$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    $a\times b$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 'sqrt(3)/3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        평행이동한 그래프를 나타내는 함수는 $y=\sin a\left(x-\dfrac{\pi}{6}\right)+b$, 즉 $f(x)=\sin a\left(x-\dfrac{\pi}{6}\right)+b$이다.
      source_flow: 문항카드(수학) 2교시 p.5
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a>0$이므로 $f(x)$의 주기는 $\dfrac{2\pi}{a}$이고 $\dfrac{2\pi}{a}=3\pi$에서 $a=\dfrac{2}{3}$이다.
      source_flow: 문항카드(수학) 2교시 p.5
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $f\left(\dfrac{2}{3}\pi\right)=\sqrt{3}$이므로 $\sin\dfrac{2}{3}\left(\dfrac{2}{3}\pi-\dfrac{\pi}{6}\right)+b=\sqrt{3}$, 그러므로 $b=\sqrt{3}-\sin\dfrac{\pi}{3}=\dfrac{\sqrt{3}}{2}$이다.
      source_flow: 문항카드(수학) 2교시 p.5
      criteria:
      - 1.M1
    - id: 1b-4
      content: |
        따라서 $a\times b=\dfrac{2}{3}\times\dfrac{\sqrt{3}}{2}=\dfrac{1}{\sqrt{3}}$이다.
      source_flow: 문항카드(수학) 2교시 p.5
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        평행이동한 함수식과 주기 조건으로 $a=\dfrac{2}{3}$, $f\left(\dfrac{2}{3}\pi\right)=\sqrt{3}$으로 $b=\dfrac{\sqrt{3}}{2}$를 구하고 $a\times b=\dfrac{1}{\sqrt{3}}$을 낸 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
      - 1b-3
      - 1b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $f\left(-\dfrac{\pi}{12}\right)$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '(sqrt(3)-1)/2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)=\sin\dfrac{2}{3}\left(x-\dfrac{\pi}{6}\right)+\dfrac{\sqrt{3}}{2}$이므로
      source_flow: 문항카드(수학) 2교시 p.5
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $f\left(-\dfrac{\pi}{12}\right)=\sin\dfrac{2}{3}\left(-\dfrac{\pi}{12}-\dfrac{\pi}{6}\right)+\dfrac{\sqrt{3}}{2}=\sin\left(-\dfrac{\pi}{6}\right)+\dfrac{\sqrt{3}}{2}=-\dfrac{1}{2}+\dfrac{\sqrt{3}}{2}$이다.
      source_flow: 문항카드(수학) 2교시 p.5
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $f(x)$에 $x=-\dfrac{\pi}{12}$를 대입하고 $\sin\left(-\dfrac{\pi}{6}\right)=-\dfrac{1}{2}$를 이용해 $-\dfrac{1}{2}+\dfrac{\sqrt{3}}{2}$을 구한 과정이 적혀 있다.
      steps:
      - 2b-1
      - 2b-2
