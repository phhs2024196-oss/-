stem: |
  등차수열 $\{a_n\}$에 대하여 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하자. $a_3=11,\ a_5+S_8=155$ 일 때, $S_n>100$을 만족하는 자연수 $n$을 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    $a_1$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        공차를 $d$라 하면 $a_3=11$에서 $a_1+2d=11$ ...... ①
      source_flow: 문항카드(수학) 2교시 p.8
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a_5+S_8=155$에서 $a_1+4d+\dfrac{8(2a_1+7d)}{2}=155$, 즉 $9a_1+32d=155$ ...... ②
      source_flow: 문항카드(수학) 2교시 p.8
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        ①, ②에서 $a_1=3$이다.
      source_flow: 문항카드(수학) 2교시 p.8
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $a_3=11$, $a_5+S_8=155$를 등차수열의 일반항과 합의 공식으로 $a_1$, $d$의 연립방정식으로 세워 $a_1=3$을 구한 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $S_n>100$을 만족하는 $n$의 최솟값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '7'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a_1=3,\ d=4$이므로 $S_n=\dfrac{n\{2a_1+(n-1)d\}}{2}=\dfrac{n\{6+(n-1)4\}}{2}=n\{3+(n-1)2\}=n(2n+1)$이다.
      source_flow: 문항카드(수학) 2교시 p.8
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $2n^2+n>100$에서 $n=6$일 경우 $78>100$이 아니고, $n=7$일 경우 $105>100$이므로 $n$의 최솟값은 7이다.
      source_flow: 문항카드(수학) 2교시 p.8
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $a_1$, $d$를 대입해 $S_n=n(2n+1)$을 구하고 $S_n>100$을 만족하는 $n$의 최솟값 7을 찾은 과정이 적혀 있다.
      steps:
      - 2b-1
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
