stimuli: []
stem: |
  삼차함수 $f(x)$가 다음 조건을 만족시킬 때, $f(3)$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오.

  (가) 모든 실수 $a$에 대하여 $\displaystyle\lim_{x\to a}\dfrac{f(x)+f(-x)}{x-a}$의 값이 존재한다.

  (나) $\displaystyle\lim_{x\to1}\dfrac{f(x)+2}{x-1}=4$
subparts:
- id: '1'
  stem: |
    $f(x)=px^3+qx^2+kx+l$ 이라고 할 때, $\dfrac{q}{p}$의 값을 구하시오. (단, $p,\ q,\ k,\ l$은 상수이고, $p\neq0$이다.)
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 모든 실수 $a$에 대하여 $\displaystyle\lim_{x\to a}\dfrac{f(x)+f(-x)}{x-a}$의 값이 존재하고, $x\to a$일 때 (분모)$\to0$이므로 (분자)$\to0$이어야 한다.
      source_flow: 문항카드(수학) 2교시 p.12
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        즉 $\displaystyle\lim_{x\to a}\{f(x)+f(-x)\}=f(a)+f(-a)=0$이므로 삼차함수 $f(x)$는 모든 실수 $a$에 대하여 $f(-a)=-f(a)$를 만족시킨다.
      source_flow: 문항카드(수학) 2교시 p.12
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        따라서 $y=f(x)$의 그래프는 원점에 대하여 대칭이므로 $f(x)=px^3+kx\ (p,\ k$는 상수, $p\neq0)$이 된다. 따라서 $\dfrac{q}{p}=0$이다.
      source_flow: 문항카드(수학) 2교시 p.12
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        조건 (가)에서 $f(a)+f(-a)=0$임을 끌어내 $f(x)$가 원점대칭($q=0$)임을 보이고 $\dfrac{q}{p}=0$을 구한 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $f(3)$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '66'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        조건 (나)의 $\displaystyle\lim_{x\to1}\dfrac{f(x)+2}{x-1}=4$ ...... ①에서 $x\to1$일 때 (분모)$\to0$이고 극한값이 존재하므로 (분자)$\to0$이어야 한다.
      source_flow: 문항카드(수학) 2교시 p.12
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        즉 $\displaystyle\lim_{x\to1}\{f(x)+2\}=f(1)+2=p+k+2=0$에서 $q=-(k+2)$ ...... ②
      source_flow: 문항카드(수학) 2교시 p.12
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        이때 ①에서 $\displaystyle\lim_{x\to1}\dfrac{f(x)+2}{x-1}=\lim_{x\to1}\dfrac{px^3+kx+2}{x-1}=\lim_{x\to1}\dfrac{px^3-(p+2)x+2}{x-1}=\lim_{x\to1}\dfrac{(x-1)(px^2+px-2)}{x-1}=\lim_{x\to1}(px^2+px-2)=2p-2=4$이다.
      source_flow: 문항카드(수학) 2교시 p.12
      criteria:
      - 2.M1
    - id: 2b-4
      content: |
        이므로 $p=3$이고, ②에서 $k=-5$이다. 따라서 $f(x)=3x^3-5x$이므로 $f(3)=3\times27-15=66$이다.
      source_flow: 문항카드(수학) 2교시 p.12
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        조건 (나)에서 $f(1)=-2$를 얻고 극한을 계산해 $p=3$, $k=-5$를 구하여 $f(x)=3x^3-5x$, $f(3)=66$을 낸 과정이 적혀 있다.
      steps:
      - 2b-1
      - 2b-2
      - 2b-3
      - 2b-4
