stimuli: []
stem: |
  함수 $f(x)=\begin{cases}x^2+ax & (x<2)\\ \dfrac{1}{2}x-a & (x\ge2)\end{cases}$

  가 모든 실수 $x$에서 연속이다. 닫힌구간 $[0,3]$에서 함수 $f(x)$의 최댓값을 $M$, 최솟값을 $m$이라고 할 때, $M+m$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $a$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '-1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수가 $x=2$에서 연속이므로 $\displaystyle\lim_{x\to2-}f(x)=\lim_{x\to2+}f(x)=f(2)$이다.
      source_flow: 문항카드(수학) 2교시 p.15
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to2-}f(x)=\lim_{x\to2-}(x^2+ax)=4+2a$ ...... ①, $\displaystyle\lim_{x\to2+}f(x)=\lim_{x\to2+}\left(\dfrac{1}{2}x-a\right)=1-a$ ...... ②
      source_flow: 문항카드(수학) 2교시 p.15
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        ①=②이므로 $4+2a=1-a$, 따라서 $a=-1$이다.
      source_flow: 문항카드(수학) 2교시 p.15
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $x=2$에서의 좌극한과 우극한이 같다는 연속 조건으로 방정식 $4+2a=1-a$를 세워 $a=-1$을 구한 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $M+m$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '9/4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a=-1$이므로 $f(x)=x^2-x\ (x<2)$, $f(x)=\dfrac{1}{2}x+1\ (x\ge2)$이다. $[0,3]$에서 $M=f(3)=\dfrac{3}{2}+1=\dfrac{5}{2}$이다.
      source_flow: 문항카드(수학) 2교시 p.15
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $m=f\left(\dfrac{1}{2}\right)=\dfrac{1}{4}-\dfrac{1}{2}=-\dfrac{1}{4}$이므로 $M+m=\dfrac{5}{2}+\left(-\dfrac{1}{4}\right)=\dfrac{9}{4}$이다.
      source_flow: 문항카드(수학) 2교시 p.15
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        최댓값 $M=\dfrac{5}{2}$와 최솟값 $m=-\dfrac{1}{4}$를 구하여 $M+m=\dfrac{9}{4}$를 낸 과정이 적혀 있다.
      steps:
      - 2b-1
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
