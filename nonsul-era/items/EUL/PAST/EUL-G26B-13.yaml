stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여 $\displaystyle\lim_{h\to0}\dfrac{f(x+h)-f(x-h)}{h}=-4x^3+2x^2+2$를 만족한다. 함수 $g(x)=\displaystyle\lim_{h\to0}\dfrac{f(x+4h)-f(x-2h)}{2h}$라 할 때, $g(0)+g(1)$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    $f^{\prime}(x)$를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: '-2*x**3+x**2+1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{h\to0}\dfrac{f(x+h)-f(x-h)}{h}=\lim_{h\to0}\dfrac{\{f(x+h)-f(x)\}-\{f(x-h)-f(x)\}}{h}=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}+\lim_{h\to0}\dfrac{f(x-h)-f(x)}{-h}$
      source_flow: 문항카드(수학) 2교시 p.19
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $=f^{\prime}(x)+f^{\prime}(x)=2f^{\prime}(x)=-4x^3+2x^2+2$이므로 $f^{\prime}(x)=-2x^3+x^2+1$이다.
      source_flow: 문항카드(수학) 2교시 p.19
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        주어진 극한을 미분계수의 정의로 $2f^{\prime}(x)$로 바꾸어 $f^{\prime}(x)=-2x^3+x^2+1$을 구한 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $g(0)+g(1)$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(x)=\displaystyle\lim_{h\to0}\dfrac{\{f(x+4h)-f(x)\}-\{f(x-2h)-f(x)\}}{2h}=2\lim_{h\to0}\dfrac{f(x+4h)-f(x)}{4h}+\lim_{h\to0}\dfrac{f(x-2h)-f(x)}{-2h}$
      source_flow: 문항카드(수학) 2교시 p.19
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $=2f^{\prime}(x)+f^{\prime}(x)=3f^{\prime}(x)=3(-2x^3+x^2+1)$이다.
      source_flow: 문항카드(수학) 2교시 p.19
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        $g(0)=3\cdot1=3$, $g(1)=3(-2+1+1)=0$이므로 $g(0)+g(1)=3+0=3$이다.
      source_flow: 문항카드(수학) 2교시 p.19
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $g(x)=3f^{\prime}(x)$임을 보이고 $g(0)=3$, $g(1)=0$을 구하여 $g(0)+g(1)=3$을 낸 과정이 적혀 있다.
      steps:
      - 2b-1
      - 2b-2
      - 2b-3
