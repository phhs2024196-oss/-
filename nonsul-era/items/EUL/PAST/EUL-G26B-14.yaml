stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여 $\displaystyle\int_{x-1}^{x+1}(f(t)+2t)dt=ax^2+4$를 만족시킨다.

  $\displaystyle\int_0^3f(t)dt=\int_0^1f(t)dt+20$일 때, 상수 $a$값을 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    $a$를 이용하여 $\displaystyle\int_{x-1}^{x+1}f(t)dt$를 $x$에 관한 식으로 나타내시오.
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: 'a*x**2-4*x+4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\int_{x-1}^{x+1}(f(t)+2t)dt=\int_{x-1}^{x+1}f(t)dt+\int_{x-1}^{x+1}2t\,dt=\int_{x-1}^{x+1}f(t)dt+\Big[t^2\Big]_{x-1}^{x+1}$
      source_flow: 문항카드(수학) 2교시 p.22
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $=\displaystyle\int_{x-1}^{x+1}f(t)dt+\{(x+1)^2-(x-1)^2\}=\int_{x-1}^{x+1}f(t)dt+4x=ax^2+4$이므로 $\displaystyle\int_{x-1}^{x+1}f(t)dt=ax^2-4x+4$ ...... ①
      source_flow: 문항카드(수학) 2교시 p.22
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $\displaystyle\int_{x-1}^{x+1}2t\,dt=4x$를 계산해 $\displaystyle\int_{x-1}^{x+1}f(t)dt=ax^2-4x+4$를 구한 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $a$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\displaystyle\int_0^3f(t)dt=\int_0^1f(t)dt+20$에서 $\displaystyle\int_0^1f(t)dt+\int_1^3f(t)dt=\int_0^1f(t)dt+20$이므로 $\displaystyle\int_1^3f(t)dt=20$이다.
      source_flow: 문항카드(수학) 2교시 p.22
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        ①의 양변에 $x=2$를 대입하면 $\displaystyle\int_1^3f(t)dt=a\times2^2-4\times2+4=4a-4=20$, 즉 $a=6$이다.
      source_flow: 문항카드(수학) 2교시 p.22
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        정적분의 성질로 $\displaystyle\int_1^3f(t)dt=20$을 얻고 ①에 $x=2$를 대입해 $a=6$을 구한 과정이 적혀 있다.
      steps:
      - 2b-1
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
