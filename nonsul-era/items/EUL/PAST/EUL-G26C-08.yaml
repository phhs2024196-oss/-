stimuli: []
stem: |
  함수 $f(x)=\log_{\frac{1}{3}}(2x^2-10x+a)$의 최댓값이 1일 때, 상수 $a$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오. (단, $a>\dfrac{25}{2}$)
subparts:
- id: '1'
  stem: |
    함수 $f(x)$가 최댓값을 갖는 $x$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '5/2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=\log_{\frac{1}{3}}(2x^2-10x+a)$의 밑이 $\dfrac{1}{3}$이므로 $f(x)$는 진수인 $2x^2-10x+a$의 값이 최소일 때 최댓값을 가진다.
      source_flow: 문항카드(수학) 3교시 p.2
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $2x^2-10x+a=2(x^2-5x)+a=2\left(x-\dfrac{5}{2}\right)^2-\dfrac{25}{2}+a$이므로 진수인 $2x^2-10x+a$는 $x=\dfrac{5}{2}$일 때 최솟값 $-\dfrac{25}{2}+a$를 갖는다.
      source_flow: 문항카드(수학) 3교시 p.2
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        밑 $\dfrac{1}{3}$로 $f$가 진수의 최소에서 최대가 됨을 쓰고 진수를 완전제곱식으로 고쳐 $x=\dfrac{5}{2}$를 구한 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $a$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '77/6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        함수 $f(x)$는 $x=\dfrac{5}{2}$일 때 최댓값 $\log_{\frac{1}{3}}\left(-\dfrac{25}{2}+a\right)$를 갖는다.
      source_flow: 문항카드(수학) 3교시 p.2
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        이때 $\log_{\frac{1}{3}}\left(-\dfrac{25}{2}+a\right)=1$이므로 $-\dfrac{25}{2}+a=\dfrac{1}{3}$, 따라서 $a=\dfrac{77}{6}$이다.
      source_flow: 문항카드(수학) 3교시 p.2
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
