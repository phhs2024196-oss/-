      mark_type: M
      points: 5
      evidence: |
        최댓값 조건 $\log_{\frac{1}{3}}\left(-\dfrac{25}{2}+a\right)=1$을 세워 $a=\dfrac{77}{6}$을 구한 과정이 적혀 있다.
      steps:
      - 2b-1
      - 2b-2
