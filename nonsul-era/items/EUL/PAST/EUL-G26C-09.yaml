stimuli: []
stem: |
  함수 $f(x)=\sin^2x+\cos x-1$의 최댓값과 최솟값을 각각 $M,\ m$이라 할 때, $M-m$값을 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    최댓값 $M$을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '1/4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\sin^2x+\cos x-1=(1-\cos^2x)+\cos x-1=-\cos^2x+\cos x$에서 $\cos x=t$라 하면 $-1\le t\le1$이고
      source_flow: 문항카드(수학) 3교시 p.5
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $g(t)=-t^2+t=-\left(t-\dfrac{1}{2}\right)^2+\dfrac{1}{4}\ (-1\le t\le1)$이라 하면 함수 $g(t)$는 $t=\dfrac{1}{2}$일 때 최댓값 $\dfrac{1}{4}$을 갖는다.
      source_flow: 문항카드(수학) 3교시 p.5
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $\cos x=t$로 치환해 $g(t)=-t^2+t\ (-1\le t\le1)$을 얻고 최댓값 $M=\dfrac{1}{4}$을 구한 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $M-m$을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '9/4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        또한 $g(t)=-\left(t-\dfrac{1}{2}\right)^2+\dfrac{1}{4}\ (-1\le t\le1)$에서 $t=-1$일 때 최솟값 $-2$를 갖는다.
      source_flow: 문항카드(수학) 3교시 p.5
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서 $M=\dfrac{1}{4},\ m=-2$이므로 $M-m=\dfrac{1}{4}-(-2)=\dfrac{9}{4}$이다.
      source_flow: 문항카드(수학) 3교시 p.5
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $t=-1$에서 최솟값 $m=-2$를 구하고 $M-m=\dfrac{9}{4}$를 낸 과정이 적혀 있다.
      steps:
      - 2b-1
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
