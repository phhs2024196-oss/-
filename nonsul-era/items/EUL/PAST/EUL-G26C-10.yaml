stimuli: []
stem: |
  공비 $r$이 양수이고, 모든 항이 실수인 등비수열 $\{a_n\}$에 대하여 $a_2a_4=100,\ a_6=80$ 일 때, $a_{10}$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    $r$의 값을 구하시오.
  points: 7
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        모든 항이 실수인 등비수열 $\{a_n\}$의 공비를 $r$이라 하면 $a_2a_4=a_1r\times a_1r^3=a_1^2r^4=100$이다.
      source_flow: 문항카드(수학) 3교시 p.8
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a_6=a_1r^5=80$에서 $a_1=\dfrac{80}{r^5}$을 위 식에 대입하면 $\left(\dfrac{80}{r^5}\right)^2\times r^4=100\ \Rightarrow\ \dfrac{6400}{r^6}=100\ \Rightarrow\ r^6=64\ \Rightarrow\ r^6=2^6\ \Rightarrow\ r=2$이다.
      source_flow: 문항카드(수학) 3교시 p.8
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: |
        $a_2a_4$, $a_6$을 $a_1$, $r$로 나타내 $a_1$을 소거하고 $r^6=64$에서 $r=2$를 구한 과정이 적혀 있다.(공식 채점기준 7점)
      steps:
      - 1b-1
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $a_{10}$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '1280'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
