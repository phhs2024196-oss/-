      content: |
        $a_1=\dfrac{80}{r^5}$에 $r=2$를 대입하면 $a_1=\dfrac{5}{2}$이다.
      source_flow: 문항카드(수학) 3교시 p.8
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $a_{10}=a_1r^9=\dfrac{5}{2}\times2^9=1280$이다.
      source_flow: 문항카드(수학) 3교시 p.8
      criteria:
