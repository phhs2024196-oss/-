stimuli: []
stem: |
  함수 $f(x)=2x^3+ax^2+bx+c$가 $x=1$에서 극솟값을 가지고, $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x}=-8$를 만족시킨다. 함수 $f(x)$를 계산하는 과정을 아래 단계에 따라 서술하시오. (단, $a,\ b,\ c$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $b$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '-8'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x}=-8$에서 분모의 극한값이 0이므로 분자의 극한값도 0이다. $\displaystyle\lim_{x\to0}f(x)=\lim_{x\to0}(2x^3+ax^2+bx+c)=c=0$이므로 $c=0$이다.
      source_flow: 문항카드(수학) 3교시 p.11
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(x)=2x^3+ax^2+bx$이고, $x=0$에서의 도함수 $f^{\prime}(0)$은 $\displaystyle\lim_{x\to0}\dfrac{f(x)-f(0)}{x-0}=\lim_{x\to0}\dfrac{2x^3+ax^2+bx-0}{x-0}=\lim_{x\to0}(2x^2+ax+b)=b=-8$이다.
      source_flow: 문항카드(수학) 3교시 p.11
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        분자의 극한값이 0임을 이용해 $c=0$을 구하고, 극한을 계산해 $b=-8$을 구한 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    함수 $f(x)$를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: '2*x**3+x**2-8*x'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        주어진 조건으로 함수 $f(x)$가 $x=1$에서 극값을 가지므로 $f^{\prime}(1)=0$이다.
      source_flow: 문항카드(수학) 3교시 p.11
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $f^{\prime}(x)=6x^2+2ax-8$, $f^{\prime}(1)=6+2a-8=0$에서 $a=1$이다. 따라서 $f(x)=2x^3+x^2-8x$이다.
      source_flow: 문항카드(수학) 3교시 p.11
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        극값 조건 $f^{\prime}(1)=0$으로 $a=1$을 구하여 $f(x)=2x^3+x^2-8x$를 낸 과정이 적혀 있다.
      steps:
      - 2b-1
      - 2b-2
