intent: |
  함수의 연속을 위한 극한 조건을 이용하고 적용하여, 주어진 함수의 계수를 구하고, 이를 바탕으로 함수 값을 계산할 수 있다.
key_idea: |
  $x=3$에서 연속이려면 $\displaystyle\lim_{x\to3}f(x)=f(3)=k$이므로 $x\neq3$에서 약분한 $x+3$의 극한 6이 $k$이다.
stuck: |
  $x\neq3$에서 인수분해해 약분한 뒤 극한값을 $f(3)=k$와 같게 놓는 부분
