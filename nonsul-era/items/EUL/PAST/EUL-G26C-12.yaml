stimuli: []
stem: |
  함수 $f(x)=\begin{cases}\dfrac{x^2-9}{x-3} & (x\neq3)\\ k & (x=3)\end{cases}$

  가 $x=3$에서 연속일 때, $f(k)$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오.
  (단, $k$는 상수이다.)
subparts:
- id: '1'
  stem: |
    함수 $f(x)$가 $x=3$에서 연속이 되기 위한 $k$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x\neq3$일 때 $f(x)=\dfrac{x^2-9}{x-3}=\dfrac{(x-3)(x+3)}{x-3}=x+3$이다.
      source_flow: 문항카드(수학) 3교시 p.14
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to3}f(x)=\lim_{x\to3}(x+3)=3+3=6$이고 $f(3)=\lim_{x\to3}f(x)=6$이므로 $f(3)=k=6$이다.
      source_flow: 문항카드(수학) 3교시 p.14
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $x\neq3$에서 약분해 극한값 6을 구하고 연속 조건 $f(3)=\lim_{x\to3}f(x)$로 $k=6$을 구한 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $f(k)$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '9'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $k=6$이므로 $f(k)=f(6)=\dfrac{6^2-9}{6-3}=\dfrac{36-9}{3}=\dfrac{27}{3}=9$이다.
      source_flow: 문항카드(수학) 3교시 p.14
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
