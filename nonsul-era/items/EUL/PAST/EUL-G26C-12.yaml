      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $f(6)=\dfrac{6^2-9}{6-3}$을 계산해 $f(k)=9$를 구한 과정이 적혀 있다.
      steps:
      - 2b-1
