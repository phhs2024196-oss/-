stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여

  $\displaystyle\int_1^x(t-1)f(t)dt=ax^4+2bx^2+1$

  을 만족시킬 때, 함수 $f(x)$의 최솟값을 계산하는 과정을 아래 단계에 따라 서술하시오.
  (단, $a,\ b$는 상수이고, $a\neq0$이다.)
subparts:
- id: '1'
  stem: |
    $a,\ b$의 값을 각각 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 'a = 1; b = -1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $\displaystyle\int_1^x(t-1)f(t)dt=ax^4+2bx^2+1$의 양변에 $x=1$을 대입하면 $\displaystyle\int_1^1(t-1)f(t)dt=a+2b+1$이고, $0=a+2b+1$이 된다. 따라서 $a+2b=-1$ ...... ①
      source_flow: 문항카드(수학) 3교시 p.17
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        양변을 $x$로 미분하면 $\dfrac{d}{dx}\left[\displaystyle\int_1^x(t-1)f(t)dt\right]=\dfrac{d}{dx}[ax^4+2bx^2+1]$, 즉 $(x-1)f(x)=4ax^3+4bx$ ...... ②
      source_flow: 문항카드(수학) 3교시 p.17
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        양변에 $x=1$을 대입하면 $0=4a+4b$가 된다. 따라서 $a+b=0$ ...... ③
      source_flow: 문항카드(수학) 3교시 p.17
      criteria:
      - 1.M1
    - id: 1b-4
      content: |
        식 ①과 ③을 연립하여 풀면 $a+(-2a)=-1$이므로 $a=1,\ b=-1$이다.
      source_flow: 문항카드(수학) 3교시 p.17
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $x=1$ 대입과 양변의 미분으로 $a+2b=-1$, $a+b=0$을 세워 $a=1$, $b=-1$을 구한 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
      - 1b-3
      - 1b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    함수 $f(x)$의 최솟값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '-1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a,\ b$를 식 ②에 대입하면 $(x-1)f(x)=4x^3-4x=4x(x^2-1)=4x(x-1)(x+1)$이다.
      source_flow: 문항카드(수학) 3교시 p.17
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $f(x)=4x(x+1)=4x^2+4x=(2x+1)^2-1$이므로 $f(x)$의 최솟값은 $-1$이다.
      source_flow: 문항카드(수학) 3교시 p.17
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $a$, $b$를 대입해 $f(x)=4x^2+4x$를 구하고 완전제곱식으로 최솟값 $-1$을 낸 과정이 적혀 있다.
      steps:
      - 2b-1
      - 2b-2
