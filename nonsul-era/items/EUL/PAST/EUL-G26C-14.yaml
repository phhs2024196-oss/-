stimuli: []
stem: |
  곡선 $y=x^2$과 점 $(0,\ -2)$에서 이 곡선에 그은 두 접선으로 둘러싸인 도형의 넓이를 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    접점의 좌표를 모두 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: set
    value: '(-sqrt(2), 2), (sqrt(2), 2)'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $(0,-2)$는 곡선 $y=x^2$ 위의 점이 아니므로 접점의 $x$좌표를 $t$라 하면 접점은 $(t,\ t^2)$이다.
      source_flow: 문항카드(수학) 3교시 p.20
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        접선의 기울기는 $m=y^{\prime}\Big]_{x=t}=2t$이므로 접선의 방정식은 $y-t^2=2t(x-t)$, 즉 $y=2tx-t^2$ ...... ①
      source_flow: 문항카드(수학) 3교시 p.20
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        점 $(0,-2)$는 접선 위의 점이므로 $-2=0-t^2$, $t^2=2$, $(t-\sqrt{2})(t+\sqrt{2})=0$에서 $t=-\sqrt{2}$ 또는 $t=\sqrt{2}$이다. 따라서 접점은 $(-\sqrt{2},\ 2),\ (\sqrt{2},\ 2)$이다.
      source_flow: 문항카드(수학) 3교시 p.20
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        접점을 $(t,t^2)$으로 놓고 접선이 $(0,-2)$를 지나는 조건에서 $t=\pm\sqrt{2}$를 구해 접점 $(-\sqrt{2},2)$, $(\sqrt{2},2)$를 구한 과정이 적혀 있다.
      steps:
      - 1b-1
      - 1b-2
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    곡선 $y=x^2$과 두 접선으로 둘러싸인 도형의 넓이를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '4*sqrt(2)/3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        식 ①에서 접점이 $(-\sqrt{2},\ 2)$일 때 $y=-2\sqrt{2}x-2$, 접점이 $(\sqrt{2},\ 2)$일 때 $y=2\sqrt{2}x-2$이다.
      source_flow: 문항카드(수학) 3교시 p.20
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        곡선으로 싸인 도형은 $y$축에 대칭이므로 $A=2\displaystyle\int_0^{\sqrt{2}}\{x^2-(2\sqrt{2}x-2)\}dx=2\left[\dfrac{1}{3}x^3-\sqrt{2}x^2+2x\right]_0^{\sqrt{2}}=2\left(\dfrac{1}{3}\cdot2\sqrt{2}-2\sqrt{2}+2\sqrt{2}\right)=\dfrac{4}{3}\sqrt{2}$이다.
      source_flow: 문항카드(수학) 3교시 p.20
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        두 접선의 방정식을 구하고 $y$축 대칭을 이용한 정적분으로 넓이 $\dfrac{4}{3}\sqrt{2}$를 구한 과정이 적혀 있다.
      steps:
      - 2b-1
      - 2b-2
