      mark_type: M
      points: 2
      evidence: 접선의 $x$절편과 $y$절편을 구하고 삼각형의 넓이 식을 세웠다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: 넓이 $\dfrac9{16}$을 구했다. (소문항 배점 3/3/4 및 M/A 분할은 문제지·해설지에 표기가 없어 추정)
