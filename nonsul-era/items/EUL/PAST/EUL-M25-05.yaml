stimuli: []
stem: |
  함수 $f(x)=2x^3+(4a+7)x^2+(4a+5)x+a+2$의 그래프가 $a$의 값에 관계없이 항상 지나는 점을 P라 하자. 곡선 $y=f(x)$ 위의 점 P에서의 접선과 $x$축, $y$축으로 둘러싸인 부분의 넓이를 구하는 과정을 아래의 단계에 따라 서술하시오. (단, $a$는 실수이다.)
subparts:
- id: '1'
  stem: 점 P의 좌표를 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: (-1/2, 1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)=(4x^2+4x+1)a+2x^3+7x^2+5x+2$에서 $a$의 값에 관계없이 지나려면 $4x^2+4x+1=(2x+1)^2=0$, 즉 $x=-\dfrac12$이다. 이때 $y=2\left(-\dfrac12\right)^3+7\left(-\dfrac12\right)^2+5\left(-\dfrac12\right)+2=1$이므로
        $\mathrm{P}\left(-\dfrac12,\ 1\right)$이다.
      source_flow: 모범답안(M25_S.pdf) p.7
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $f(x)$를 $a$에 대하여 정리하여 $a$의 계수 $4x^2+4x+1$ 또는 $(2x+1)^2=0$을 세웠다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: $x=-\dfrac12$, $y=1$, 즉 P의 좌표를 구했다. (소문항 배점 3/3/4 및 M/A 분할은 문제지·해설지에 표기가 없어 추정)
      depends_on:
      - 1.M1
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: 점 P에서의 접선의 방정식을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: expression
    value: y = -x/2 + 3/4
    equivalents:
    - y = -1/2*x + 3/4
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $f'(x)=6x^2+2(4a+7)x+4a+5$이므로 $f'\left(-\dfrac12\right)=\dfrac64-(4a+7)+4a+5=-\dfrac12$이다. 따라서 접선은 $y-1=-\dfrac12\left(x+\dfrac12\right)$,
        즉 $y=-\dfrac12x+\dfrac34$이다.
      source_flow: 모범답안(M25_S.pdf) p.7
      criteria:
      - 2.M1
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: $f'(x)$를 구하고 $x=-\dfrac12$를 대입하여 기울기를 계산하는 식이 있다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: 기울기 $-\dfrac12$와 접선의 방정식 $y=-\dfrac12x+\dfrac34$를 구했다. (소문항 배점 3/3/4 및 M/A 분할은 문제지·해설지에 표기가 없어 추정)
      depends_on:
      - 2.M1
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: 곡선 $y=f(x)$ 위의 점 P에서의 접선과 $x$축, $y$축으로 둘러싸인 부분의 넓이를 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: 9/16
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: 접선 $y=-\dfrac12x+\dfrac34$의 $x$절편은 $\dfrac32$, $y$절편은 $\dfrac34$이므로 구하는 넓이는 $\dfrac12\times\dfrac32\times\dfrac34=\dfrac9{16}$이다.
      source_flow: 모범답안(M25_S.pdf) p.7
      criteria:
      - 3.M1
      - 3.A1
  rubric:
