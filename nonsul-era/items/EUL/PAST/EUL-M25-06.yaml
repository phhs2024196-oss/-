      points: 2
      evidence: 평행이동한 식 $f(x)=a\sin b\left(x-\dfrac\pi6\right)+3$을 세우고 최솟값 $-a+3$을 이용했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: $a=4$를 구했다. (소문항 배점 3/3/4 및 M/A 분할은 문제지·해설지에 표기가 없어 추정)
