stem: |
  함수 $y=a\sin bx$의 그래프를 $x$축의 방향으로 $\dfrac\pi6$만큼, $y$축의 방향으로 $3$만큼 평행이동한 그래프를 나타내는 함수를 $y=f(x)$라 하자. 함수 $f(x)$의 주기가 $10\pi$이고 최솟값이 $-1$일때, $f\left(\dfrac{11}6\pi\right)$의 값을 구하는 과정을 아래의 단계에 따라 서술하시오. (단, $a$, $b$는 양의 상수이다.)
subparts:
- id: '1'
  stem: $a$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 평행이동하면 $f(x)=a\sin b\left(x-\dfrac\pi6\right)+3$이다. 최솟값은 $-a+3$이므로 $-a+3=-1$에서 $a=4$이다.
      source_flow: 모범답안(M25_S.pdf) p.8
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
