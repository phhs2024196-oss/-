- id: '1'
  stem: $a_1$을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '-54'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $a_3=a_1+2\times3$, $a_7=a_1+6\times3$, $a_{10}=a_1+9\times3$이다. 세 항이 순서대로 등비수열을 이루므로 등비중항에 의하여 $a_7^2=a_3a_{10}$,
        즉 $(a_1+18)^2=(a_1+6)(a_1+27)$이다. 정리하면 $3a_1=-162$이므로 $a_1=-54$이다.
      source_flow: 모범답안(M25_S.pdf) p.9
      criteria:
      - 1.M1
      - 1.A1
