stem: |
  공차가 $3$인 등차수열 $\{a_n\}$에 대하여 세 항 $a_3$, $a_7$, $a_{10}$이 순서대로 등비수열을 이룰 때, $a_{20}$의 값을 구하는 과정을 서술하시오.
