- id: '2'
  stem: $g'(2)$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: 1/6
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $\displaystyle\lim_{x\to2}\dfrac{x-2}{g(x)}$의 극한이 존재하므로 $g(2)=0$이다. $\displaystyle\lim_{x\to2}\dfrac{x-2}{g(x)}=\dfrac1{g'(2)}=6$에서
        $g'(2)=\dfrac16$이다.
      source_flow: 모범답안(M25_S.pdf) p.10
      criteria:
      - 2.M1
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: $g(2)=0$을 밝히고 $\dfrac{x-2}{g(x)-g(2)}$ 꼴로 보아 $\dfrac1{g'(2)}=6$을 세웠다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: $g'(2)=\dfrac16$을 구했다. (소문항 배점 3/3/4 및 M/A 분할은 문제지·해설지에 표기가 없어 추정)
      depends_on:
