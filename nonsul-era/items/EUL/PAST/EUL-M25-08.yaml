stimuli: []
stem: |
  두 다항함수 $f(x)$, $g(x)$가 $\displaystyle\lim_{x\to2}\dfrac{f(x)-3}{x^2-4}=2$, $\displaystyle\lim_{x\to2}\dfrac{x-2}{g(x)}=6$ 을 만족한다.
  함수 $h(x)=f(x)g(x)$라 할 때, $h'(2)$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: $f'(2)$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '8'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $x\to2$일 때 (분모)$\to0$이고 극한이 존재하므로 $f(2)=3$이다. 따라서 $\displaystyle\lim_{x\to2}\dfrac{f(x)-3}{x^2-4}=\lim_{x\to2}\dfrac{f(x)-3}{x-2}\times\dfrac1{x+2}=2$에서
        $f'(2)\times\dfrac14=2$, 즉 $f'(2)=8$이다.
      source_flow: 모범답안(M25_S.pdf) p.10
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 극한이 존재하므로 $f(2)=3$임을 밝히고 미분계수의 정의 꼴로 바꾸었다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: $f'(2)=8$을 구했다. (소문항 배점 3/3/4 및 M/A 분할은 문제지·해설지에 표기가 없어 추정)
      depends_on:
      - 1.M1
      steps:
      - 1b-1
  outcome_codes:
