stem: |
  수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
  $$a_{n+1}=a_n+5$$
  를 만족시킨다. $\displaystyle\sum_{n=1}^{15}a_n=600$일 때, $a_{20}$의 값을 구하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: 수열 $\{a_n\}$의 첫째항 $a_1$을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $a_{n+1}-a_n=5$이므로 $\{a_n\}$은 공차 5인 등차수열이다. $\displaystyle\sum_{n=1}^{15}a_n=\dfrac{15\{2a_1+14\times5\}}2=600$에서
        $2a_1+70=80$, 즉 $a_1=5$이다.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.20) 기준 작성
      criteria:
      - 1.M1
      - 1.A1
