      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: 두 점의 속도 $v_p$, $v_q$를 구하고 (1)의 각 시각에서 부호를 비교했다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: $t=1$을 구했다. (소문항 배점 3/3/4 및 M/A 분할은 문제지에 표기가 없어 추정, 채점기준 미공개)
      depends_on:
