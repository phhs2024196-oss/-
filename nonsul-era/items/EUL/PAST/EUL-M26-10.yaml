stimuli: []
stem: |
  수직선 위를 움직이는 두 점 $P$, $Q$의 시각 $t$ ($t\ge0$)에서의 위치를 각각 $x_p$, $x_q$라 하면
  $$x_p(t)=t^3-2t^2,\ x_q(t)=t-2$$
  이다. 특정 순간의 점 $P$의 가속도를 구하는 과정을 아래의 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: 두 점 $P$, $Q$가 만나는 순간의 시각 $t$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: set
    value: '{1, 2}'
    equivalents:
    - t=1 또는 t=2
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $x_p(t)=x_q(t)$에서 $t^3-2t^2-t+2=0$이다. 인수분해하면 $(t-2)(t-1)(t+1)=0$이고 $t\ge0$이므로 $t=1$ 또는 $t=2$이다.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.20) 기준 작성
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $x_p(t)=x_q(t)$로 방정식을 세우고 인수분해했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: $t\ge0$을 고려하여 $t=1$, $t=2$를 모두 구했다. (소문항 배점 3/3/4 및 M/A 분할은 문제지에 표기가 없어 추정, 채점기준 미공개)
      depends_on:
      - 1.M1
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: 두 점 $P$, $Q$가 만나는 순간 서로 반대 방향으로 움직이고 있는 시각 $t$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $v_p(t)=3t^2-4t$, $v_q(t)=1$이다. $t=1$에서 $v_p(1)=-1<0$, $v_q(1)=1>0$이므로 서로 반대 방향이고, $t=2$에서 $v_p(2)=4>0$, $v_q(2)=1>0$이므로
        같은 방향이다. 따라서 $t=1$이다.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.20) 기준 작성
      criteria:
      - 2.M1
      - 2.A1
  rubric:
