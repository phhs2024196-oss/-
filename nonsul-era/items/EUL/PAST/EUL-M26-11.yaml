- id: '3'
  stem: $f(1)$의 값을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: -5/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $f(x)=x^2-2x-\dfrac23$이므로 $f(1)=1-2-\dfrac23=-\dfrac53$이다.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.20) 기준 작성
