stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여 $f(x)=x^2+x\displaystyle\int_0^3f(t)dt+\displaystyle\int_{-1}^1f(t)dt$를 만족시킬 때, $f(1)$의 값을 구하는 과정을 아래의 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: $\displaystyle\int_{-1}^1f(t)dt$ 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: -2/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $A=\displaystyle\int_{-1}^1f(t)dt$, $B=\displaystyle\int_0^3f(t)dt$라 하면 $f(x)=x^2+Bx+A$이다. $A=\displaystyle\int_{-1}^1(t^2+Bt+A)dt=\dfrac23+2A$이므로
        $A=-\dfrac23$이다.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.20) 기준 작성
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 두 정적분을 상수 $A$, $B$로 놓아 $f(x)=x^2+Bx+A$로 정리하고 $\displaystyle\int_{-1}^1$을 계산하는 식을 세웠다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: $A=-\dfrac23$을 구했다. (소문항 배점 3/3/4 및 M/A 분할은 문제지에 표기가 없어 추정, 채점기준 미공개)
      depends_on:
      - 1.M1
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: $\displaystyle\int_0^3f(t)dt$ 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '-2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $B=\displaystyle\int_0^3(t^2+Bt+A)dt=9+\dfrac92B+3A$이고 $A=-\dfrac23$이므로 $B=7+\dfrac92B$, 즉 $-\dfrac72B=7$에서
        $B=-2$이다.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.20) 기준 작성
      criteria:
      - 2.M1
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: $\displaystyle\int_0^3(t^2+Bt+A)dt$를 계산하여 $B$에 대한 식을 세웠다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: $B=-2$를 구했다. (소문항 배점 3/3/4 및 M/A 분할은 문제지에 표기가 없어 추정, 채점기준 미공개)
      depends_on:
      - 2.M1
      steps:
      - 2b-1
  outcome_codes:
