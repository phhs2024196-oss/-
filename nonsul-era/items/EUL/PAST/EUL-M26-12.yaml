stimuli: []
stem: |
  공비가 $r$인 등비수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하자.
  $$\dfrac{S_{10}-S_8}{S_7-S_5}=3,\ \ (S_2-S_1)^3=192$$
  일 때, $a_2\times a_6$의 값을 구하는 과정을 아래의 단계에 따라 서술하시오.
  (단, $a_1\ne0$, $r\ne0$, $r^2\ne1$이다.)
subparts:
- id: '1'
  stem: $r^3$의 값을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $S_{10}-S_8=a_9+a_{10}=r^3(a_6+a_7)$이고 $S_7-S_5=a_6+a_7$이다. $a_6+a_7=a_1r^5(1+r)\ne0$이므로 $\dfrac{S_{10}-S_8}{S_7-S_5}=r^3=3$이다.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.20) 기준 작성
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $S_{10}-S_8=a_9+a_{10}$, $S_7-S_5=a_6+a_7$로 바꾸어 비를 $r^3$으로 나타냈다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: $r^3=3$을 구했다. (소문항 배점 3/3/4 및 M/A 분할은 문제지에 표기가 없어 추정, 채점기준 미공개)
      depends_on:
      - 1.M1
      steps:
      - 1b-1
  outcome_codes:
