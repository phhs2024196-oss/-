    meaning: 만점
  misconceptions: []
- id: '2'
  stem: 등비수열 $\{a_n\}$의 첫째항 $a_1$을 구하시오.
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $S_2-S_1=a_2=a_1r$이므로 $(a_1r)^3=a_1^3r^3=3a_1^3=192$에서 $a_1^3=64$, 즉 $a_1=4$이다.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.20) 기준 작성
      criteria:
