  misconceptions: []
- id: '2'
  stem: $\sin^3\theta+\cos^3\theta$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: sqrt(2)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $\sin^3\theta+\cos^3\theta=(\sin\theta+\cos\theta)(\sin^2\theta-\sin\theta\cos\theta+\cos^2\theta)=\sqrt2\left(1-\dfrac12\right)=\dfrac{\sqrt2}2$이다.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.20) 기준 작성
      criteria:
      - 2.M1
      - 2.A1
