stem: |
  $\sin(\pi-\theta)\cos(\pi+\theta)=-\dfrac12$이고, $\cos\left(\dfrac\pi2+\theta\right)<0$일 때, $\sin^3\theta+\cos^3\theta$의 값을 구하는 과정을 아래의 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: $\sin\theta+\cos\theta$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $\sin(\pi-\theta)=\sin\theta$, $\cos(\pi+\theta)=-\cos\theta$이므로 $-\sin\theta\cos\theta=-\dfrac12$, 즉 $\sin\theta\cos\theta=\dfrac12$이다.
        $(\sin\theta+\cos\theta)^2=1+2\sin\theta\cos\theta=2$이다. $\cos\left(\dfrac\pi2+\theta\right)=-\sin\theta<0$이므로 $\sin\theta>0$이고,
        $\sin\theta\cos\theta>0$이므로 $\cos\theta>0$이다. 따라서 $\sin\theta+\cos\theta=\sqrt2$이다.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.20) 기준 작성
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 변환 공식으로 $\sin\theta\cos\theta=\dfrac12$을 구하고 $(\sin\theta+\cos\theta)^2=2$를 세웠다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: 부호 조건을 근거로 $\sin\theta+\cos\theta=\sqrt2$를 구했다. (소문항 배점 5/5 및 M/A 분할은 문제지에 표기가 없어 추정, 채점기준 미공개)
      depends_on:
      - 1.M1
      steps:
      - 1b-1
