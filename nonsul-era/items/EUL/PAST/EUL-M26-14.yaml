      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $f$의 역함수 $\log_4(x-a)+3$을 구해 $g(x)$와 비교했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $a=5$, $b=3$으로부터 $a+b=8$을 구했다. (소문항 배점 5/5 및 M/A 분할은 문제지에 표기가 없어 추정, 채점기준 미공개)
