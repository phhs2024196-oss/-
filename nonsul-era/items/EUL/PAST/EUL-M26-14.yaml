stem: |
  함수 $f(x)=4^{x-3}+a$의 역함수가 $g(x)=\log_4(x-5)+b$일 때, $f(3)+g(9)$을 계산하는 과정을 아래의 단계에 따라 서술하시오. (단, $a$, $b$는 상수)
subparts:
- id: '1'
  stem: $a+b$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '8'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $y=4^{x-3}+a$에서 $x$, $y$를 바꾸면 $x=4^{y-3}+a$이므로 $y=\log_4(x-a)+3$이다. 이것이 $g(x)=\log_4(x-5)+b$와 같으므로 $a=5$, $b=3$이고
        $a+b=8$이다.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.20) 기준 작성
      criteria:
      - 1.M1
      - 1.A1
  rubric:
