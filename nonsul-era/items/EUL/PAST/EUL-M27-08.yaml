      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |-
        # 채점기준 미공개 — 단계별 추정 (소문항 배점 5/5 는 문제지에 표기 없어 추정)
        $f(a)=b$ 에서 $2^{a+1}=4$ 를 세워 $a=1$ 을 구한다. $a+b=4$ 를 답한다.
      steps:
