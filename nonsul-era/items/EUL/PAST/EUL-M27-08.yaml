stimuli: []
stem: |
  함수 $f(x)=2^{x+1}-1$의 그래프 위의 점 $(a,b)$와 직선 $y=1$ 사이의 거리가 2일 때, $a+b$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    $b$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $(a,b)$와 직선 $y=1$ 사이의 거리는 $|b-1|$이므로 $|b-1|=2$, 곧 $b=3$ 또는 $b=-1$이다. 그런데 $b=f(a)=2^{a+1}-1>-1$ 이므로 $b=-1$은 불가능하다. 따라서 $b=3$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |-
        # 채점기준 미공개 — 단계별 추정 (소문항 배점 5/5 는 문제지에 표기 없어 추정)
        $|b-1|=2$ 를 세워 $b=3,-1$ 을 얻고 $b=-1$ 을 치역($f>-1$)으로 배제한다. $b=3$ 을 답한다.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $a+b$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $b=f(a)=2^{a+1}-1=3$에서 $2^{a+1}=4$, 곧 $a+1=2$이므로 $a=1$. 따라서 $a+b=4$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
      criteria:
      - 2.M1
  rubric:
