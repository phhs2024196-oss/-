stem: |
  다음 조건을 모두 만족시키는 삼각형 ABC의 넓이를 계산하는 과정을 아래 단계에 따라 서술하시오.

  (가) $\cos B=\cos C$
  (나) $\sin A:\sin B=4:3$
  (다) 삼각형 ABC 외접원 지름의 길이는 9이다.
subparts:
- id: '1'
  stem: |
    $\cos B$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 2/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $0<B,C<\pi$ 에서 $\cos B=\cos C$ 이면 $B=C$ 이므로 $b=c$. 사인법칙에서 $a:b=\sin A:\sin B=4:3$ 이므로 $a=4k$, $b=c=3k$ 로 놓는다. 꼭짓점 A에서 BC에 내린 수선의 발은 BC의 중점이므로 $\cos B=\dfrac{2k}{3k}=\dfrac{2}{3}$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |-
        # 채점기준 미공개 — 단계별 추정 (소문항 배점 5/5 는 문제지에 표기 없어 추정)
        $\cos B=\cos C$ 에서 $b=c$ 와 사인법칙으로 $a:b:c=4:3:3$ 을 얻는다. $\cos B=\dfrac23$ 을 답한다.
      steps:
      - 1b-1
  outcome_codes:
