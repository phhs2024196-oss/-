  misconceptions: []
- id: '2'
  stem: |
    삼각형 ABC의 넓이를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 10*sqrt(5)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        외접원의 지름이 9이므로 사인법칙에서 $\dfrac{b}{\sin B}=9$. $\sin B=\sqrt{1-\dfrac{4}{9}}=\dfrac{\sqrt5}{3}$ 이므로 $b=3\sqrt5$, 곧 $k=\sqrt5$, $a=4\sqrt5$. 높이는 $\sqrt{b^2-\left(\dfrac{a}{2}\right)^2}=\sqrt{45-20}=5$. 따라서 넓이는 $\dfrac12\times4\sqrt5\times5=10\sqrt5$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
      criteria:
      - 2.M1
