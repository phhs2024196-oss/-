stimuli: []
stem: |
  모든 항이 서로 다른 양수인 등비수열 $\{a_n\}$에 대하여 수열 $\{b_n\}$을 $b_n=a_{2n+1}$이라 하자. 수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하고, 수열 $\{b_n\}$의 첫째항부터 제 $n$항까지의 합을 $T_n$이라 할 때, $S_{10}=6T_5$를 만족시킨다. $\dfrac{b_3}{a_3}$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    수열 $\{a_n\}$의 첫째항을 $a$, 공비를 $r$이라 할 때, $T_5$의 값을 $a$와 $r$에 대한 식으로 나타내시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: a*r**2*(1-r**10)/(1-r**2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $b_n=a_{2n+1}=ar^{2n}$ 이므로 $\{b_n\}$ 은 첫째항 $ar^2$, 공비 $r^2$ 인 등비수열이다. 항이 서로 다르므로 $r\ne1$, $r^2\ne1$ 이고 $T_5=\dfrac{ar^2(1-r^{10})}{1-r^2}$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |-
        # 채점기준 미공개 — 단계별 추정 (소문항 배점 5/5 는 문제지에 표기 없어 추정)
        $b_n=ar^{2n}$ 으로 $\{b_n\}$ 이 첫째항 $ar^2$, 공비 $r^2$ 임을 파악한다. $T_5$ 를 $a,r$ 의 식으로 나타낸다.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $\dfrac{b_3}{a_3}$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 1/16
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $S_{10}=\dfrac{a(1-r^{10})}{1-r}=6\cdot\dfrac{ar^2(1-r^{10})}{1-r^2}$. $a(1-r^{10})\ne0$ 이므로 양변을 나누면 $\dfrac{1}{1-r}=\dfrac{6r^2}{(1-r)(1+r)}$, 곧 $1+r=6r^2$. $(3r+1)(2r-1)=0$ 이고 $r>0$ 이므로 $r=\dfrac12$. $\dfrac{b_3}{a_3}=\dfrac{a_7}{a_3}=r^4=\dfrac1{16}$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |-
        # 채점기준 미공개 — 단계별 추정 (소문항 배점 5/5 는 문제지에 표기 없어 추정)
        $S_{10}=6T_5$ 에서 $1+r=6r^2$ 을 얻고 $r>0$ 으로 $r=\dfrac12$ 를 고른다. $\dfrac{b_3}{a_3}=r^4=\dfrac1{16}$ 을 답한다.
      steps:
      - 2b-1
