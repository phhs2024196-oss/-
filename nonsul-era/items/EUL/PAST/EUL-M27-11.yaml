stem: |
  함수

  $f(x)=\begin{cases}\dfrac{x^2+ax+b}{x-1}&(x\ne1)\\4&(x=1)\end{cases}$

  가 $x=1$에서 연속일 때, $a-3b$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오. (단, $a$, $b$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $a$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x=1$ 에서 연속이므로 $\lim_{x\to1}\dfrac{x^2+ax+b}{x-1}=f(1)=4$. 분모가 0 으로 가므로 분자도 0 으로 가야 하여 $1+a+b=0$, 곧 $b=-a-1$. 이때 $x^2+ax-a-1=(x-1)(x+a+1)$ 이므로 극한값은 $\lim_{x\to1}(x+a+1)=a+2=4$. 따라서 $a=2$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |-
        # 채점기준 미공개 — 단계별 추정 (소문항 배점 5/5 는 문제지에 표기 없어 추정)
        연속 조건 $\lim_{x\to1}f(x)=4$ 와 분자가 0 이어야 함($1+a+b=0$)을 이용하고 인수분해해 극한값을 구한다. $a=2$ 를 답한다.
      steps:
      - 1b-1
  outcome_codes:
