    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $a-3b$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '11'
    equivalents: []
    tolerance: null
  solutions:
