    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $b=-a-1=-3$ 이므로 $a-3b=2-3\times(-3)=11$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
