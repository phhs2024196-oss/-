stem: |
  좌표평면 위의 두 점 A$(a,\ 2a+1)$, B$(a+1,\ 2a+2)$에 대하여 선분 OA의 길이를 $f(a)$, 선분 AB의 길이를 $g(a)$라 하자. $\displaystyle\lim_{a\to-1}\dfrac{f(a)-g(a)}{a+1}$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오. (단, O는 원점이다.)
subparts:
- id: '1'
  stem: |
    $f(a)\times g(a)$를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: sqrt(10*a**2+8*a+2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(a)=\sqrt{a^2+(2a+1)^2}=\sqrt{5a^2+4a+1}$, $g(a)=\sqrt{1^2+1^2}=\sqrt2$ 이므로 $f(a)\times g(a)=\sqrt{2(5a^2+4a+1)}=\sqrt{10a^2+8a+2}$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |-
        # 채점기준 미공개 — 단계별 추정 (소문항 배점 5/5 는 문제지에 표기 없어 추정)
        $f(a)$, $g(a)$ 를 거리 공식으로 구한다. $f(a)\times g(a)=\sqrt{10a^2+8a+2}$ 를 답한다.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $\displaystyle\lim_{a\to-1}\dfrac{f(a)-g(a)}{a+1}$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: -3*sqrt(2)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\dfrac{f(a)-g(a)}{a+1}=\dfrac{f(a)^2-g(a)^2}{(a+1)(f(a)+g(a))}=\dfrac{5a^2+4a-1}{(a+1)(f(a)+g(a))}=\dfrac{(5a-1)(a+1)}{(a+1)(f(a)+g(a))}=\dfrac{5a-1}{f(a)+g(a)}$. $a\to-1$ 일 때 $f(-1)=\sqrt2$ 이므로 극한값은 $\dfrac{-6}{2\sqrt2}=-\dfrac{3\sqrt2}{2}$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |-
        # 채점기준 미공개 — 단계별 추정 (소문항 배점 5/5 는 문제지에 표기 없어 추정)
        분자를 유리화하고 $a+1$ 을 약분한다. 극한값 $-\dfrac{3\sqrt2}{2}$ 를 답한다.
      steps:
      - 2b-1
