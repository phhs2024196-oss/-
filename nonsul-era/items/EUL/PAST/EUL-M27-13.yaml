stimuli: []
stem: |
  최고차항의 계수가 1인 이차함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $x$의 값이 0에서 3까지 변할 때의 함수 $f(x)$의 평균변화율은 5이다.
  (나) $\displaystyle\lim_{x\to1}\dfrac{f(x)-f(1)}{x^2-1}=f(1)$

  $f(3)-f'(3)$의 값을 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    $f(x)$를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: x**2+2*x-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^2+px+q$ 로 놓는다. (가)에서 $\dfrac{f(3)-f(0)}{3}=\dfrac{9+3p}{3}=3+p=5$ 이므로 $p=2$. (나)에서 $\lim_{x\to1}\dfrac{f(x)-f(1)}{x-1}\cdot\dfrac1{x+1}=\dfrac{f'(1)}{2}=f(1)$. $f'(x)=2x+2$ 이므로 $f'(1)=4$, $f(1)=2$ 이고 $1+2+q=2$ 에서 $q=-1$. 따라서 $f(x)=x^2+2x-1$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |-
        # 채점기준 미공개 — 단계별 추정 (소문항 배점 5/5 는 문제지에 표기 없어 추정)
        (가)로 $p=2$, (나)를 $\dfrac{f'(1)}{2}=f(1)$ 로 바꾸어 $q=-1$ 을 구한다. $f(x)=x^2+2x-1$ 을 답한다.
      steps:
      - 1b-1
