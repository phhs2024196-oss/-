stem: |
  함수 $f(x)=x^3-2x^2$에 대하여 점 $(0,\ -8)$에서 곡선 $y=f(x)$에 그은 접선을 $y=g(x)$라 하자. 곡선 $y=f(x)$와 직선 $y=g(x)$로 둘러싸인 부분의 넓이를 계산하는 과정을 아래 단계에 따라 서술하시오.
subparts:
- id: '1'
  stem: |
    곡선 $y=f(x)$와 직선 $y=g(x)$의 두 교점을 모두 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: (-2,-16), (2,0)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        접점을 $(t,f(t))$ 로 놓으면 접선은 $y=(3t^2-4t)(x-t)+t^3-2t^2$. 점 $(0,-8)$ 을 지나므로 $-2t^3+2t^2=-8$, 곧 $t^3-t^2-4=0$, $(t-2)(t^2+t+2)=0$ 에서 $t=2$. 따라서 $g(x)=4x-8$. $f(x)-g(x)=x^3-2x^2-4x+8=(x-2)^2(x+2)$ 이므로 교점은 $x=-2,\ 2$, 즉 $(-2,-16)$, $(2,0)$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |-
        # 채점기준 미공개 — 단계별 추정 (소문항 배점 5/5 는 문제지에 표기 없어 추정)
        접점을 $t$ 로 놓고 $(0,-8)$ 을 지나는 조건에서 $t=2$, $g(x)=4x-8$ 을 구하고 $f-g$ 를 인수분해한다. 교점 $(-2,-16)$, $(2,0)$ 을 답한다.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    곡선 $y=f(x)$와 직선 $y=g(x)$로 둘러싸인 부분의 넓이를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 64/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        구간 $[-2,2]$ 에서 $f(x)\ge g(x)$ 이므로 넓이는 $\displaystyle\int_{-2}^{2}(x^3-2x^2-4x+8)\,dx=2\int_0^2(-2x^2+8)\,dx=2\left[-\dfrac23x^3+8x\right]_0^2=2\left(-\dfrac{16}3+16\right)=\dfrac{64}{3}$.
      source_flow: 공식 풀이 미공개 — 빠른 정답(p.22) 기준 작성
      criteria:
      - 2.M1
