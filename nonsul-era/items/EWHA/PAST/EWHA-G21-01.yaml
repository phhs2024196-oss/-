intent: |
  수열의 귀납적 정의를 이해하고 수열의 성질을 유추하기 위해 관련된 함수들의 상태를 수리적으로 추론하여 적용하는 문제이다. 이차부등식의 해를 구하고 함수의 성질을 파악하는 능력, 수학적 귀납법을 활용하여 수열의 성질을 추론하는 능력을 평가한다(문항카드 7 출제 의도).
key_idea: |
  고정점 $\beta=\frac{1+\sqrt5}{2}$(즉 $x^2=x+1$의 양의 근)를 기준으로, $x\ge\beta$에서 $x^2\ge x+1$, $0\le x\le\beta$에서 $x+\frac{1}{x+1}\le2$임을 (1)에서 얻고 귀납법·단조성 증명에 그대로 쓴다.
stuck: |
  (3)에서 $a_{n+1}\le a_n$을 $(a_{n+1})^2=a_n+1\le(a_n)^2$로, $b_n\le b_{n+1}$을 $b_n+\frac{1}{b_n+1}\le2$로 바꿔 (1)·(2)의 결과에 연결하는 발상
idea_tags: [IDEA-FIXED-POINT-BOUND, IDEA-INDUCTION-BOUND-THEN-MONOTONE]
tags: [수학적 귀납법, 귀납적 정의, 황금비]
