stimuli: []

stem: |
  모든 항이 양수인 두 수열 $\{a_n\}$, $\{b_n\}$이 $a_1=2$, $b_1=1$이고, 모든 자연수 $n$에 대하여
  $$(a_{n+1})^2=a_n+1,\qquad b_{n+1}=2-\frac{1}{b_n+1}$$
  을 만족시킨다. 아래 물음에 답하시오. [35점]

subparts:
- id: '1'
  stem: |
    부등식 $x^2\le x+1$의 해가 $\alpha\le x\le\beta$일 때 $\alpha,\beta$를 구하고, 닫힌구간 $[0,\beta]$에서 함수 $f(x)=x+\dfrac{1}{x+1}$의 최댓값이 2임을 보이시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'alpha=(1-sqrt(5))/2; beta=(1+sqrt(5))/2; max=2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x^2-x-1=0$의 두 근이 $\alpha,\beta$이고, $[0,\beta]$에서 $f'(x)>0$이므로 최댓값은 $f(\beta)=2$이다.
    steps:
    - id: 1a
      content: |
        $\alpha=\frac{1-\sqrt5}{2}$, $\beta=\frac{1+\sqrt5}{2}$. $f$는 증가하므로 최댓값 $f(\beta)=\beta+\frac{1}{\beta+1}=2$ ($\beta^2=\beta+1$ 이용).
      criteria: [1.M1, 1.A1, 1.M2, 1.A2]
    hint_ladder:
    - 이차부등식은 대응하는 이차방정식의 근부터 구한다.
    - $f'(x)$의 부호를 구간 $(0,\beta)$에서 확인하자.
  - id: S1-B
    audience: B
    source_flow: 선행_2021 문항카드 7 예시 답안 p.60
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $g(x)=x^2-x-1$에 대하여 $g(x)=0$의 해는 $x=\dfrac{1\pm\sqrt5}{2}$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 $g(x)\le0$, 즉 $x^2\le x+1$의 해는 $\dfrac{1-\sqrt5}{2}\le x\le\dfrac{1+\sqrt5}{2}$이고, $\alpha=\dfrac{1-\sqrt5}{2}$, $\beta=\dfrac{1+\sqrt5}{2}$이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        구간 $\left[0,\frac{1+\sqrt5}{2}\right]$에서 $f(x)$는 잘 정의되고, 구간 $\left(0,\frac{1+\sqrt5}{2}\right)$에서 $f'(x)=1-\dfrac{1}{(x+1)^2}>0$이므로 $f(x)$는 $\left[0,\frac{1+\sqrt5}{2}\right]$에서 증가함수이다.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        따라서 $x=\frac{1+\sqrt5}{2}$에서 최댓값을 갖고 $f\left(\frac{1+\sqrt5}{2}\right)=\dfrac{1+\sqrt5}{2}+\dfrac{1}{\frac{1+\sqrt5}{2}+1}=2$이므로 $[0,\beta]$에서 $f(x)$의 최댓값은 2이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $x^2-x-1=0$의 해 $x=\frac{1\pm\sqrt5}{2}$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $x^2\le x+1$의 해 $\frac{1-\sqrt5}{2}\le x\le\frac{1+\sqrt5}{2}$ 또는 $\alpha=\frac{1-\sqrt5}{2}$, $\beta=\frac{1+\sqrt5}{2}$를 적었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $\left(0,\frac{1+\sqrt5}{2}\right)$에서 $f'(x)=1-\frac{1}{(x+1)^2}>0$임을 보여 $f$가 $[0,\beta]$에서 증가함수임을 밝혔다(증가함수임을 다른 방법으로 논리적으로 보여도 3점).
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $x=\beta$에서 최댓값 $f(\beta)=2$를 계산 과정과 함께 보였다. 전개 과정 없이 $f\left(\frac{1+\sqrt5}{2}\right)=2$만 주장하면 1점.
      depends_on: [1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-9101}
  misconceptions:
  - id: MC-ALG-9101
    outcome_code: '71'
    wrong_work: '$x^2\le x+1$의 해를 $x\le\frac{1-\sqrt5}{2}$ 또는 $x\ge\frac{1+\sqrt5}{2}$로 씀'
    detect_cue: 부등식 방향과 해 구간(두 근 사이/바깥)이 맞지 않는다
    feedback: 최고차항 계수가 양수인 이차식이 0 이하가 되는 범위는 두 근 사이입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $\beta$가 문항 (1)에서 정해질 때, 모든 자연수 $n$에 대하여 두 부등식 $a_n\ge\beta$와 $b_n\le\beta$가 각각 성립함을 수학적 귀납법을 이용하여 보이시오.
  points: 15
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\beta^2=\beta+1$을 이용해 $(a_{k+1})^2=a_k+1\ge\beta+1=\beta^2$, $b_{k+1}=2-\frac{1}{b_k+1}\le2-\frac{1}{\beta+1}=\beta$.
    steps:
    - id: 2a
      content: |
        첫 항 확인 후, 귀납 가정에서 $(a_{k+1})^2\ge\beta^2$와 $a_{k+1}>0$으로 $a_{k+1}\ge\beta$, 그리고 $\frac{1}{b_k+1}$이 $b_k$에 대해 감소하므로 $b_{k+1}\le\beta$.
      criteria: [2.B1, 2.M1, 2.A1, 2.R1, 2.B2, 2.M2, 2.A2]
    hint_ladder:
    - $\beta$는 $x^2=x+1$의 근이다. $\beta+1$을 다르게 쓰면?
    - $b_k\le\beta$이면 $\frac{1}{b_k+1}$과 $\frac{1}{\beta+1}$의 대소는?
  - id: S2-B
    audience: B
    source_flow: 선행_2021 문항카드 7 예시 답안 p.60–61
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (i) 수열 $\{a_n\}$의 첫 항 $a_1=2\ge\dfrac{1+\sqrt5}{2}$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $n=k$일 때 $a_k\ge\dfrac{1+\sqrt5}{2}$라 가정하면
        $$(a_{k+1})^2=a_k+1\ge\frac{1+\sqrt5}{2}+1=\left(\frac{1+\sqrt5}{2}\right)^2$$
        이 성립한다.
      criteria: [2.M1, 2.A1]
    - id: 2b-3
      content: |
        $a_{k+1}$이 양수이므로 $n=k+1$일 때 부등식 $a_{k+1}\ge\dfrac{1+\sqrt5}{2}$가 성립한다. 따라서 수학적 귀납법에 의해서 모든 자연수 $n$에 대하여 $a_n\ge\beta$가 성립한다.
      criteria: [2.R1]
    - id: 2b-4
      content: |
        (ii) 수열 $\{b_n\}$의 첫 항 $b_1=1\le\dfrac{1+\sqrt5}{2}$이다.
      criteria: [2.B2]
    - id: 2b-5
      content: |
        $n=k$일 때 $b_k\le\dfrac{1+\sqrt5}{2}$라 가정하면
        $$b_{k+1}=2-\frac{1}{b_k+1}\le2-\frac{1}{\frac{1+\sqrt5}{2}+1}=2-\frac{2}{3+\sqrt5}=\frac{1+\sqrt5}{2}$$
        가 되어 $n=k+1$일 때 부등식 $b_{k+1}\le\dfrac{1+\sqrt5}{2}$가 성립한다. 따라서 수학적 귀납법에 의해서 모든 자연수 $n$에 대하여 $b_n\le\beta$가 성립한다.
      criteria: [2.M2, 2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        첫 항 $a_1=2\ge\frac{1+\sqrt5}{2}$임을 보였다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $n=k$일 때 $a_k\ge\frac{1+\sqrt5}{2}$라 가정했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $(a_{k+1})^2=a_k+1\ge\frac{1+\sqrt5}{2}+1=\left(\frac{1+\sqrt5}{2}\right)^2$이 성립함을 보였다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 1
      evidence: |
        $a_{k+1}$이 양수임을 지적하고 $a_{k+1}\ge\frac{1+\sqrt5}{2}$가 성립함을 주장했다.
      depends_on: [2.A1]
      steps: [2b-3]
    - id: 2.B2
      mark_type: B
      points: 2
      evidence: |
        첫 항 $b_1=1\le\frac{1+\sqrt5}{2}$임을 보였다.
      depends_on: []
      steps: [2b-4]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $n=k$일 때 $b_k\le\frac{1+\sqrt5}{2}$라 가정했다.
      depends_on: []
      implied_ok: false
      steps: [2b-5]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $b_{k+1}=2-\frac{1}{b_k+1}\le2-\frac{1}{\frac{1+\sqrt5}{2}+1}=\frac{1+\sqrt5}{2}$가 성립함을 보였다.
      depends_on: [2.M2]
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-PRF-9102}
  misconceptions:
  - id: MC-PRF-9102
    outcome_code: '72'
    wrong_work: '$(a_{k+1})^2\ge\beta^2$이므로 $a_{k+1}\ge\beta$ (양수 조건 언급 없음)'
    detect_cue: 제곱 부등식에서 바로 결론을 내리고 $a_{k+1}>0$을 쓰지 않았다
    feedback: $X^2\ge Y^2$에서 $X\ge Y$를 얻으려면 $X$, $Y$가 양수(음이 아님)여야 합니다. 문제의 "모든 항이 양수" 조건을 쓰세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    모든 자연수 $n$에 대하여 두 부등식 $a_n\ge a_{n+1}$과 $b_n\le b_{n+1}$이 각각 성립함을 보이시오.
  points: 10
  depends_on: ['1', '2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: (1)에서 $x\ge\beta\Rightarrow x^2\ge x+1$, $0\le x\le\beta\Rightarrow x+\frac{1}{x+1}\le2$를 읽어 내고 (2)의 범위를 대입한다.
    steps:
    - id: 3a
      content: |
        $(a_{n+1})^2=a_n+1\le(a_n)^2$, $b_n+\frac{1}{b_n+1}\le2\iff b_n\le b_{n+1}$.
      criteria: [3.M1, 3.M2, 3.A1, 3.R1, 3.M3, 3.A2, 3.R2]
    hint_ladder:
    - $a_n\ge a_{n+1}$을 제곱한 식과 점화식을 비교하자.
    - $b_{n+1}-b_n$을 (1)의 함수 $f$로 나타내 보자.
  - id: S3-B
    audience: B
    source_flow: 선행_2021 문항카드 7 예시 답안 p.61
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (i) 문항 (1)의 결과로부터 $x\ge\dfrac{1+\sqrt5}{2}$일 때 $x^2\ge x+1$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        문항 (2)의 결과로부터 $a_n\ge\dfrac{1+\sqrt5}{2}$이므로
        $$(a_{n+1})^2=a_n+1\le(a_n)^2$$
        이 성립한다.
      criteria: [3.M2, 3.A1]
    - id: 3b-3
      content: |
        $a_n,\ a_{n+1}$이 양수이므로 $a_{n+1}\le a_n$이 성립한다.
