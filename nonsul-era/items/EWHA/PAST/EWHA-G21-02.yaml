intent: |
  좌표평면 및 좌표공간에서 두 점 사이의 거리를 이용하여 조건을 만족하는 점을 찾고, 정사영의 성질과 공간도형의 성질을 이용하여 문제를 해결하는 수리적 추론 및 계산 능력을 평가한다. 또한 이 과정에서 삼각함수의 덧셈정리를 이해하고 있는지 점검한다(문항카드 8 출제 의도).
key_idea: |
  $\triangle\mathrm{OAD}$의 평면 $\mathrm{OAB}$ 위로의 정사영이 $\triangle\mathrm{OAC}$이므로 $\triangle\mathrm{OAC}=\triangle\mathrm{OAD}\cdot\cos\theta$이고, $\cos2\theta=2\cos^2\theta-1$로 $\overline{\mathrm{OD}}$에 관한 방정식을 세운다.
stuck: |
  (3)에서 이면각 $\theta$를 정사영 넓이의 비(또는 $\angle\mathrm{DMC}$, $\mathrm{M}$은 $\mathrm{OA}$의 중점)로 표현하는 발상
