stimuli: []

stem: |
  좌표공간에 세 점 $\mathrm{O}(0,0,0)$, $\mathrm{A}(2,-\sqrt2,0)$, $\mathrm{B}(2,\sqrt2,0)$이 있다. [35점]

subparts:
- id: '1'
  stem: |
    세 점 $\mathrm{O},\mathrm{A},\mathrm{B}$로부터 같은 거리에 있는 $xy$평면 위의 점 $\mathrm{C}$의 좌표를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '(3/2, 0, 0)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{C}(x,y,0)$로 두고 $\overline{\mathrm{CO}}^2=\overline{\mathrm{CA}}^2=\overline{\mathrm{CB}}^2$의 두 일차식을 연립한다.
    steps:
    - id: 1a
      content: |
        $-4x+2\sqrt2y+6=0$, $-4x-2\sqrt2y+6=0$에서 $x=\frac32$, $y=0$.
      criteria: [1.M1, 1.M2, 1.A1]
    hint_ladder:
    - 거리가 같다는 조건을 제곱해서 쓰면 이차항이 사라진다.
  - id: S1-B
    audience: B
    source_flow: 선행_2021 문항카드 8 예시 답안 p.65
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{C}$의 좌표를 $(x,y,0)$로 두면 점 $\mathrm{C}$로부터 각 점 $\mathrm{O},\mathrm{A},\mathrm{B}$까지의 거리의 제곱은
        $\overline{\mathrm{CO}}^2=x^2+y^2$, $\overline{\mathrm{CA}}^2=(2-x)^2+(-\sqrt2-y)^2$, $\overline{\mathrm{CB}}^2=(2-x)^2+(\sqrt2-y)^2$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\overline{\mathrm{CO}}^2=\overline{\mathrm{CA}}^2$으로부터 $0=-4x+2\sqrt2y+6$을 얻고, $\overline{\mathrm{CO}}^2=\overline{\mathrm{CB}}^2$으로부터 $0=-4x-2\sqrt2y+6$을 얻는다. 두 일차식을 연립하여 풀면 $0=-8x+12$이므로 $x=\frac32$이고 $y=0$이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 점 $\mathrm{C}$의 좌표는 $\left(\frac32,0,0\right)$이다.
      criteria: [1.A1]
  - id: S1-ALT
    audience: ALT
    source_flow: 선행_2021 문항카드 8 예시 답안 별해 p.65–66
    method_no: 2
    key_idea: 원 해설 별해 — $\mathrm{C}$는 선분 $\mathrm{OA}$, $\mathrm{OB}$의 수직이등분선의 교점이다.
    steps:
    - id: 1c-1
      content: |
        중점 $\mathrm{M}\left(1,-\frac{\sqrt2}{2},0\right)$, $\mathrm{N}\left(1,\frac{\sqrt2}{2},0\right)$, 직선 $\mathrm{OA}$, $\mathrm{OB}$의 기울기 $-\frac{\sqrt2}{2}$, $\frac{\sqrt2}{2}$이므로 수직이등분선은 $y=\sqrt2(x-1)-\frac{\sqrt2}{2}$, $y=-\sqrt2(x-1)+\frac{\sqrt2}{2}$이다. 교점은 $x=\frac32$, $y=0$이므로 $\mathrm{C}\left(\frac32,0,0\right)$.
      criteria: [1.M1, 1.M2, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        세 점 $\mathrm{O},\mathrm{A},\mathrm{B}$로부터 점 $\mathrm{C}$까지의 거리를 $\mathrm{C}$의 좌표를 사용하여 대수적으로 표현했다(수직이등분선 등 다른 방법도 풀이 과정 8점 안에서 인정).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        거리가 같다는 조건으로 방정식을 세우고 풀었다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        답 $\left(\frac32,0,0\right)$을 구했다.
      depends_on: [1.M2]
      steps: [1b-3, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9104}
  misconceptions:
  - id: MC-GEO-9104
    outcome_code: '71'
    wrong_work: '$\mathrm{C}=\left(\frac{0+2+2}{3},\frac{0-\sqrt2+\sqrt2}{3},0\right)=\left(\frac43,0,0\right)$'
    detect_cue: 거리 조건 없이 세 점 좌표의 평균을 답으로 썼다
    feedback: 세 점에서 같은 거리에 있는 점은 외심(수직이등분선의 교점)이며 무게중심과 다릅니다. 거리의 제곱이 같다는 식을 세우세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    세 점 $\mathrm{O},\mathrm{A},\mathrm{B}$로부터 같은 거리에 있는 좌표공간 위의 임의의 점 $\mathrm{D}$에서 $xy$평면에 내린 수선의 발 $\mathrm{H}$가 문항 (1)에서 구한 점 $\mathrm{C}$와 같음을 보이시오.
  points: 8
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 피타고라스 정리로 $\overline{\mathrm{HO}}=\overline{\mathrm{HA}}=\overline{\mathrm{HB}}$이고, (1)의 유일성으로 $\mathrm{H}=\mathrm{C}$.
    steps:
    - id: 2a
      content: |
        $\overline{\mathrm{HX}}^2=\overline{\mathrm{DX}}^2-\overline{\mathrm{DH}}^2$ ($\mathrm{X}=\mathrm{O},\mathrm{A},\mathrm{B}$)이므로 $\mathrm{H}$는 $xy$평면 위의 등거리점, 즉 $\mathrm{C}$.
      criteria: [2.M1, 2.A1, 2.R1]
    hint_ladder:
    - $\triangle\mathrm{DHO}$, $\triangle\mathrm{DHA}$, $\triangle\mathrm{DHB}$는 어떤 삼각형인가?
  - id: S2-B
    audience: B
    source_flow: 선행_2021 문항카드 8 예시 답안 p.66
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{H}$는 점 $\mathrm{D}$에서 $xy$평면에 내린 수선의 발이므로 $\angle\mathrm{DHO}=\angle\mathrm{DHA}=\angle\mathrm{DHB}=90^\circ$이다. 피타고라스 정리에 의해
        $$\overline{\mathrm{HO}}^2=\overline{\mathrm{DO}}^2-\overline{\mathrm{DH}}^2,\quad \overline{\mathrm{HA}}^2=\overline{\mathrm{DA}}^2-\overline{\mathrm{DH}}^2,\quad \overline{\mathrm{HB}}^2=\overline{\mathrm{DB}}^2-\overline{\mathrm{DH}}^2$$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        이고, $\overline{\mathrm{DO}}=\overline{\mathrm{DA}}=\overline{\mathrm{DB}}$이므로 $\overline{\mathrm{HO}}=\overline{\mathrm{HA}}=\overline{\mathrm{HB}}$를 얻는다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        따라서 점 $\mathrm{H}$는 세 점 $\mathrm{O},\mathrm{A},\mathrm{B}$로부터 같은 거리에 있는 $xy$평면 위의 점이므로 문항 (1)에서 구한 점 $\mathrm{C}$와 같다.
      criteria: [2.R1]
  - id: S2-ALT
    audience: ALT
    source_flow: 선행_2021 문항카드 8 예시 답안 별해 p.66
    method_no: 2
    key_idea: 원 해설 별해 — $\mathrm{D}(x,y,z)$로 두면 $z^2$이 소거되어 (1)과 같은 두 일차식이 나온다.
    steps:
    - id: 2c-1
      content: |
        $\overline{\mathrm{DO}}^2=x^2+y^2+z^2$, $\overline{\mathrm{DA}}^2=(2-x)^2+(-\sqrt2-y)^2+z^2$, $\overline{\mathrm{DB}}^2=(2-x)^2+(\sqrt2-y)^2+z^2$에서 $0=-4x+2\sqrt2y+6$, $0=-4x-2\sqrt2y+6$을 얻고 해는 $x=\frac32$, $y=0$이다. $\mathrm{H}=(x,y,0)=\left(\frac32,0,0\right)=\mathrm{C}$.
      criteria: [2.M1, 2.A1, 2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        세 점 $\mathrm{O},\mathrm{A},\mathrm{B}$로부터 점 $\mathrm{D}$까지의 거리가 같다는 조건을 피타고라스 정리로 표현하거나 점 $\mathrm{D}$의 좌표를 사용하여 대수적으로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        점 $\mathrm{H}$가 세 점 $\mathrm{O},\mathrm{A},\mathrm{B}$로부터 같은 거리에 있음을 기하적 혹은 대수적으로 기술했다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        문항 (1)을 이용하거나 점 $\mathrm{H}$의 좌표를 직접 구하여 점 $\mathrm{H}$가 점 $\mathrm{C}$와 같음을 결론지었다.
      depends_on: [2.A1]
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-PRF-9105}
  misconceptions:
  - id: MC-PRF-9105
    outcome_code: '72'
    wrong_work: '$\mathrm{D}=\left(\frac32,0,1\right)$이라 하면 $\overline{\mathrm{DO}}=\overline{\mathrm{DA}}=\overline{\mathrm{DB}}$이고 $\mathrm{H}=\mathrm{C}$이다'
    detect_cue: 특정한 점 $\mathrm{D}$ 하나(또는 $\mathrm{H}=\mathrm{C}$를 가정한 점)로 확인했다
    feedback: 「임의의 점 D」에 대한 명제이므로 D의 좌표를 문자로 두거나 피타고라스 정리로 일반적으로 보여야 합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    문항 (2)에서 주어진 한 점 $\mathrm{D}$에 대하여, 평면 $\mathrm{OAD}$와 평면 $\mathrm{OAB}$가 이루는 각의 크기를 $\theta$라 하자. $\cos2\theta=-\dfrac15$일 때, 선분 $\mathrm{OD}$의 길이를 구하시오. (단, 점 $\mathrm{D}$의 $z$좌표는 양수이다.)
  points: 17
  depends_on: ['1', '2']
  answer: {kind: value, value: '3*sqrt(6)/4', equivalents: ['sqrt(54)/4'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\triangle\mathrm{OAC}=\triangle\mathrm{OAD}\cdot\cos\theta$와 $\cos2\theta=2\cos^2\theta-1$로 $t=\overline{\mathrm{OD}}$에 관한 방정식을 얻는다.
    steps:
    - id: 3a
      content: |
        $\cos\theta=\dfrac{3\sqrt2/4}{\sqrt{\frac32\left(t^2-\frac32\right)}}$, $-\frac15=\dfrac{3-t^2}{t^2-\frac32}$에서 $t^2=\frac{27}{8}$, $t=\frac{3\sqrt6}{4}$.
      criteria: [3.R1, 3.M1, 3.A1, 3.B1, 3.M2, 3.A2, 3.A3]
    hint_ladder:
    - 점 $\mathrm{D}$의 평면 $\mathrm{OAB}$ 위로의 정사영은 (2)에서 이미 구했다.
    - 정사영의 넓이와 원래 넓이 사이에는 어떤 관계가 있는가?
  - id: S3-B
    audience: B
    source_flow: 선행_2021 문항카드 8 예시 답안 p.67
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        점 $\mathrm{D}$의 $xy$평면으로의 정사영, 즉 평면 $\mathrm{OAB}$로의 정사영이 점 $\mathrm{C}$이므로 삼각형 $\mathrm{OAD}$를 평면 $\mathrm{OAB}$로 정사영한 도형은 삼각형 $\mathrm{OAC}$이다.
      criteria: [3.R1]
    - id: 3b-2
      content: |
        따라서 $\triangle\mathrm{OAC}=\triangle\mathrm{OAD}\cdot\cos\theta$이다.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        삼각형 $\mathrm{OAC}$의 넓이는 $\overline{\mathrm{OC}}=\frac32$를 밑변, 점 $\mathrm{A}$의 $y$좌표의 절댓값 $\sqrt2$를 높이로 하여 $\triangle\mathrm{OAC}=\frac12\cdot\frac32\cdot\sqrt2=\frac{3\sqrt2}{4}$이다.
        삼각형 $\mathrm{OAD}$는 $\overline{\mathrm{OD}}=\overline{\mathrm{AD}}$인 이등변삼각형이므로 점 $\mathrm{D}$에서 변 $\mathrm{OA}$에 내린 수선의 발은 변 $\mathrm{OA}$의 중점 $\mathrm{M}$이다. $\overline{\mathrm{OA}}=\sqrt6$이므로 $\overline{\mathrm{OM}}=\frac{\sqrt6}{2}$이고, $\overline{\mathrm{OD}}=t$라 하면 $\overline{\mathrm{MD}}^2=t^2-\frac32$, 따라서 $\triangle\mathrm{OAD}=\frac12\overline{\mathrm{OA}}\cdot\overline{\mathrm{MD}}=\sqrt{\frac32\left(t^2-\frac32\right)}$이다.
      criteria: [3.A1]
    - id: 3b-4
      content: |
        그러므로 $\cos\theta=\dfrac{\triangle\mathrm{OAC}}{\triangle\mathrm{OAD}}=\dfrac{\frac{3\sqrt2}{4}}{\sqrt{\frac32\left(t^2-\frac32\right)}}$이다. 삼각함수의 덧셈정리에 의해 $\cos2\theta=\cos(\theta+\theta)=2\cos^2\theta-1$이 성립하므로
      criteria: [3.B1]
    - id: 3b-5
      content: |
        $$-\frac15=\cos2\theta=2\cdot\frac{\left(\frac{3\sqrt2}{4}\right)^2}{\frac32\left(t^2-\frac32\right)}-1=\frac{3-t^2}{t^2-\frac32}$$
      criteria: [3.M2]
    - id: 3b-6
      content: |
        이다. 따라서 $t^2=\frac{27}{8}$이고
      criteria: [3.A2]
    - id: 3b-7
      content: |
        $\overline{\mathrm{OD}}=t$는 양수이므로 $\overline{\mathrm{OD}}=t=\dfrac{3\sqrt6}{4}$이다.
      criteria: [3.A3]
  - id: S3-ALT1
    audience: ALT
    source_flow: 선행_2021 문항카드 8 예시 답안 별해1 p.67–68
    method_no: 2
