stimuli: []

stem: |
  자연수 $n\,(n\ge3)$에 대하여 닫힌구간 $[1,n]$에서 정의된 연속함수 $f(x)$가 다음 조건을 만족시킬 때, 아래 물음에 답하시오. [30점]

  (가) $f(1),f(2),f(3),\cdots,f(n)$은 $n$ 이하의 서로 다른 자연수이다.
  (나) $1\le k\le n-1$인 자연수 $k$에 대하여 닫힌구간 $[k,k+1]$에서 함수 $y=f(x)$의 그래프는 각각 두 점 $(k,f(k))$, $(k+1,f(k+1))$을 지나는 직선의 일부이다.

subparts:
- id: '1'
  stem: |
    함수 $f(x)$가 $f(k)=k\,(k=1,2,3,\cdots,n)$일 때 $\displaystyle\int_1^n f(x)\,dx$의 값을 구하시오.
  points: 8
  depends_on: []
  answer: {kind: expression, value: '(n**2-1)/2', equivalents: ['(n+1)*(n-1)/2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 모든 선분이 직선 $y=x$ 위에 있으므로 $f(x)=x$.
    steps:
    - id: 1a
      content: |
        $\int_1^n x\,dx=\frac{n^2-1}{2}$.
      criteria: [1.M1, 1.A1, 1.A2]
    hint_ladder:
    - 점 $(k,k)$들은 모두 어떤 직선 위에 있는가?
  - id: S1-B
    audience: B
    source_flow: 선행_2021 문항카드 9 예시 답안 p.74
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        닫힌구간 $[1,n]$에서 정의된 연속함수 $f(x)$가 $f(k)=k\ (k=1,2,\cdots,n)$이고 조건 (나)를 만족하면 함수 $f(x)$의 그래프는 좌표평면의 두 점 $(1,1)$과 $(n,n)$을 직선으로 연결한 일차함수의 그래프의 일부이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        그래프가 두 점 $(1,1)$과 $(n,n)$을 지나는 일차함수는 $f(x)=x$이므로
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $$\int_1^n f(x)\,dx=\int_1^n x\,dx=\left[\frac{x^2}{2}\right]_1^n=\frac{n^2-1}{2}$$
        이다.
      criteria: [1.A2]
  - id: S1-ALT
    audience: ALT
    source_flow: 선행_2021 문항카드 9 예시 답안 별해 p.74
    method_no: 2
    key_idea: 원 해설 별해 — 함숫값이 양수이므로 적분은 넓이이고, 평행한 두 변 1, $n$, 높이 $n-1$인 사다리꼴이다.
    steps:
    - id: 1c-1
      content: |
        $f$의 최솟값이 1이므로 $[1,n]$에서 함숫값이 모두 양수이다. 따라서 $\int_1^n f(x)\,dx$는 $y=f(x)$의 그래프, $x=1$, $x=n$, $x$축으로 둘러싸인 도형의 넓이이다.
      criteria: [1.M1]
    - id: 1c-2
      content: |
        이 도형은 두 직선 $x=1$, $x=n$이 평행인 사다리꼴이며 평행인 두 선분의 길이가 각각 $1$, $n$이고 높이가 $n-1$이므로 넓이는 $\frac{(n+1)(n-1)}{2}=\frac{n^2-1}{2}$이다.
      criteria: [1.A1, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        조건을 만족하는 함수는 두 점 $(1,1)$과 $(n,n)$을 직선으로 연결한 일차함수의 그래프임을 기술했다.
        [공식 별해 채점(같은 8점): 함숫값 양수 2 · 적분=넓이 2 · 사다리꼴 변 1, n·높이 n−1 서술 3 · 넓이 계산 1 — 별해로 쓴 답안은 이 배분으로 채점]
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        일차함수 $f(x)=x$를 기술했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $\int_1^n f(x)\,dx=\frac{n^2-1}{2}$을 구했다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9107}
  misconceptions:
  - id: MC-CAL-9107
    outcome_code: '71'
    wrong_work: '$\int_1^n f(x)\,dx=f(1)+f(2)+\cdots+f(n)=\frac{n(n+1)}{2}$'
    detect_cue: 적분값을 함숫값의 합으로 대신했다
    feedback: 정적분은 그래프 아래 넓이입니다. 각 구간 $[k,k+1]$의 도형은 직사각형이 아니라 사다리꼴입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    조건 (가), (나)를 만족하는 모든 함수 $f(x)$에 대하여 $\displaystyle\int_1^n f(x)\,dx$의 최솟값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '(n**2-n+1)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\int_1^n f=\frac{n(n+1)}{2}-\frac{f(1)+f(n)}{2}$이고 $f(1)+f(n)\le n+(n-1)$.
    steps:
    - id: 2a
      content: |
        최솟값 $\frac{n(n+1)}{2}-\frac{2n-1}{2}=\frac{n^2-n+1}{2}$.
      criteria: [2.B1, 2.M1, 2.M2, 2.A1, 2.R1, 2.A2]
    hint_ladder:
    - 각 구간에서 넓이는 사다리꼴 공식으로 계산된다.
    - 합을 펼치면 몇 번씩 더해지는 함숫값과 절반만 더해지는 함숫값이 있다.
  - id: S2-B
    audience: B
    source_flow: 선행_2021 문항카드 9 예시 답안 p.75
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        닫힌구간 $[1,n]$에서 정의된 연속함수 $f(x)$가 조건 (가), (나)를 만족하면 $[1,n]$에서 최솟값이 1이므로 함숫값이 모두 양수이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        따라서 $\int_1^n f(x)\,dx$는 함수 $f(x)$의 그래프, $x=1$, $x=n$, $x$축으로 둘러싸인 도형의 넓이이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        $k=1,2,\cdots,n-1$에 대하여 이 도형을 닫힌구간 $[k,k+1]$ 위의 도형으로 나누면 두 직선 $x=k$, $x=k+1$을 평행선으로 하는 사다리꼴이 되고, 평행인 두 선분의 길이가 $f(k)$, $f(k+1)$, 높이가 1이므로 넓이는 $\frac{\{f(k)+f(k+1)\}\cdot1}{2}$이다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        따라서
        $$\int_1^n f(x)\,dx=\sum_{k=1}^{n-1}\frac{f(k)+f(k+1)}{2}=\frac{f(1)}{2}+f(2)+\cdots+f(n-1)+\frac{f(n)}{2}=\sum_{k=1}^n f(k)-\frac{f(1)+f(n)}{2}$$
        이다. 조건 (가)에 의해 $\{f(k)\mid k=1,\cdots,n\}=\{1,2,\cdots,n\}$이므로 $\sum_{k=1}^n f(k)=\frac{n(n+1)}{2}$이고 $\int_1^n f(x)\,dx=\frac{n(n+1)}{2}-\frac{f(1)+f(n)}{2}$이다.
      criteria: [2.A1]
    - id: 2b-5
      content: |
        따라서 $\frac{f(1)+f(n)}{2}$이 최댓값일 때 $\int_1^n f(x)\,dx$가 최솟값을 갖는다. 조건 (가)에 따라 $f(1)=n$, $f(n)=n-1$이거나 $f(1)=n-1$, $f(n)=n$일 때 $\frac{f(1)+f(n)}{2}$이 최댓값 $\frac{2n-1}{2}$이 되고
      criteria: [2.R1]
    - id: 2b-6
      content: |
        $\int_1^n f(x)\,dx$는 최솟값 $\frac{n(n+1)}{2}-\frac{2n-1}{2}=\frac{n^2-n+1}{2}$을 갖는다.
      criteria: [2.A2]
  - id: S2-ALT
    audience: ALT
    source_flow: 선행_2021 문항카드 9 예시 답안 별해 p.76–77
    method_no: 2
    key_idea: 원 해설 별해 — 각 구간의 일차함수를 직접 적분해 $\int_k^{k+1}f(x)\,dx=\frac{f(k)+f(k+1)}{2}$을 얻는다.
    steps:
    - id: 2c-1
      content: |
        $\int_1^n f(x)\,dx=\sum_{k=1}^{n-1}\int_k^{k+1}f(x)\,dx$로 나누어 쓴다.
      criteria: [2.M1]
    - id: 2c-2
      content: |
        $[k,k+1]$에서 $f(x)=\{f(k+1)-f(k)\}x-kf(k+1)+(k+1)f(k)$이므로 $\int_k^{k+1}f(x)\,dx=\left[\{f(k+1)-f(k)\}\frac{x^2}{2}+\{-kf(k+1)+(k+1)f(k)\}x\right]_k^{k+1}=\frac{f(k+1)+f(k)}{2}$.
      criteria: [2.M2]
    - id: 2c-3
      content: |
        이후 본풀이와 같이 $\int_1^n f=\frac{n(n+1)}{2}-\frac{f(1)+f(n)}{2}$, 최솟값 $\frac{n^2-n+1}{2}$.
      criteria: [2.A1, 2.R1, 2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        연속함수 $f(x)$의 최솟값이 1이므로 구간 $[1,n]$에서 함숫값이 모두 양수임을 기술했다.
        [공식 별해 채점(같은 15점): 구간별 적분의 합으로 나눔 2 · 각 구간 적분값 계산 4 · 이하 2.A1(5)·2.R1(3)·2.A2(1) 공통 — 별해 답안은 2.B1·2.M1·2.M2 대신 이 배분]
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $\int_1^n f(x)\,dx$는 그래프, $x=1$, $x=n$, $x$축으로 둘러싸인 도형의 넓이임을 기술했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        닫힌구간 $[k,k+1]$ 위의 도형으로 나누면 사다리꼴이고 그 넓이가 $\frac{(f(k)+f(k+1))\cdot1}{2}$임을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $\int_1^n f(x)\,dx=\frac{n(n+1)}{2}-\left(\frac{f(1)+f(n)}{2}\right)$을 계산했다.
      depends_on: [2.M2]
      steps: [2b-4, 2c-3]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        $f(1)=n$, $f(n)=n-1$이거나 $f(1)=n-1$, $f(n)=n$일 때 $\int_1^n f(x)\,dx$가 최솟값을 가짐을 서술했다.
      depends_on: [2.A1]
      steps: [2b-5, 2c-3]
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: |
        최솟값 $\frac{n^2-n+1}{2}$을 구했다.
      depends_on: [2.R1]
      steps: [2b-6, 2c-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-9108}
  misconceptions:
  - id: MC-CAL-9108
    outcome_code: '72'
    wrong_work: '적분값을 작게 하려고 $f(1)=1$, $f(n)=2$로 두어 $\frac{n(n+1)}{2}-\frac32=\frac{n^2+n-3}{2}$'
    detect_cue: 빼는 항 $\frac{f(1)+f(n)}{2}$을 최소화했다(최댓값을 구한 셈)
    feedback: 적분값은 $\frac{n(n+1)}{2}$에서 $\frac{f(1)+f(n)}{2}$을 뺀 값이므로, 최솟값은 양 끝 함숫값의 합이 가장 클 때입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    문항 (2)의 최솟값을 갖는 함수 $f(x)$의 개수를 구하시오.
  points: 7
  depends_on: ['2']
  answer: {kind: expression, value: '2*factorial(n-2)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 양 끝값 $\{n,n-1\}$의 배치 2가지 × 나머지 $n-2$개 값의 순열 $(n-2)!$.
    steps:
