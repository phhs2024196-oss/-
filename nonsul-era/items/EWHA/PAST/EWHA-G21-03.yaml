intent: |
  일대일대응인 함수의 성질, 연속함수의 성질과 정적분의 의미를 이해하고 이로부터 최대·최소 문제를 해결하는 수리적 조작을 수행하는 문항이다(문항카드 9 출제 의도).
key_idea: |
  정적분을 구간 $[k,k+1]$의 사다리꼴 넓이의 합으로 쓰면 $\int_1^n f(x)\,dx=\sum_{k=1}^n f(k)-\frac{f(1)+f(n)}{2}=\frac{n(n+1)}{2}-\frac{f(1)+f(n)}{2}$이 되어, 양 끝값의 합을 최대로 하는 문제로 바뀐다.
stuck: |
  조건 (가)에서 $\{f(1),\dots,f(n)\}=\{1,\dots,n\}$(합이 고정)임을 읽어 내고, 적분값이 양 끝 함숫값에만 의존함을 보는 것
