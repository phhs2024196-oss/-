      content: |
        이러한 일대일대응의 개수는 원소의 개수가 $n-2$인 집합에서 $(n-2)$개의 원소를 선택하여 나열하는 순열의 수와 같으므로 ${}_{n-2}\mathrm{P}_{n-2}=(n-2)!$이다.
      criteria: [3.A1]
    - id: 3b-4
      content: |
        그러므로 $\int_1^n f(x)\,dx$가 최솟값이 되는 함수 $f(x)$의 개수는 $2(n-2)!$이다.
      criteria: [3.A2]
