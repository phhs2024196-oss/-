  - id: S3-B
    audience: B
    source_flow: 선행_2021 문항카드 9 예시 답안 p.77
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        연속함수 $f(x)$가 조건 (가)를 만족하면 $f$는 집합 $\{1,2,\cdots,n\}$에서 집합 $\{1,2,\cdots,n\}$으로의 일대일대응이다. 문항 (2)에서 구한 $\int_1^n f(x)\,dx$가 최솟값을 갖는 함수 $f(x)$는 이 일대일대응이고 $f(1)=n$, $f(n)=n-1$이거나 $f(1)=n-1$, $f(n)=n$을 만족해야 한다.
      criteria: [3.R1]
    - id: 3b-2
      content: |
        따라서 함수 $f(x)$는 집합 $\{l\mid 2\le l\le n-1\text{인 자연수}\}$에서 집합 $\{m\mid 1\le m\le n-2\text{인 자연수}\}$로의 일대일대응이다.
