stimuli: []

stem: |
  상수 $p\,(1<p<2)$에 대하여 함수 $f(x)=x^3-px^2+px$가 있다. 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
  $$a_{n+1}=f(a_n)$$
  을 만족시킨다. $0<a_1<1$일 때, 아래 물음에 답하시오. [40점]

subparts:
- id: '1'
  stem: |
    $0<x<\beta$에서 부등식 $f(x)>x$가 성립하고, $\beta<x<1$에서 부등식 $f(x)<x$가 성립하는 $\beta$를 구하시오.
  points: 6
  depends_on: []
  answer: {kind: value, value: 'p - 1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)-x=x(x-1)(x-p+1)$이고 $0<p-1<1$이므로 세 근 $0<p-1<1$ 사이의 부호를 읽는다.
    steps:
    - {id: 1a, content: '$g(x)=f(x)-x=x(x-1)(x-p+1)$, 부호 $+$ on $(0,p-1)$, $-$ on $(p-1,1)$ ⇒ $\beta=p-1$', criteria: ['1.M1', '1.A1', '1.B1', '1.A2']}
    hint_ladder:
    - $f(x)>x$를 한 함수의 부호 문제로 바꿔 보자.
    - $f(x)-x$는 $x$로 묶인다.
  - id: S1-B
    audience: B
    source_flow: 2022 자연계열 답안(출제의도 및 답안) p.5 예시답안 1-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $g(x)$를 $g(x)=f(x)-x$라고 하자.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $g(x)=x^3-px^2+(p-1)x=x(x-1)(x-p+1)$이므로 $g(x)=0$의 근은 $x=0,\,1,\,p-1$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $1<p<2$이므로 $0<p-1<1$이다.
      criteria: ['1.B1']
    - id: 1b-4
      content: |
        최고차항의 계수가 양수이고 서로 다른 세 근을 갖는 삼차함수의 그래프의 성질에 의해 $0<x<p-1$에서 $g(x)>0$, $p-1<x<1$에서 $g(x)<0$이다. 즉 $0<x<p-1$에서 $f(x)>x$, $p-1<x<1$에서 $f(x)<x$이다. 따라서 $\beta=p-1$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        방정식 $g(x)=f(x)-x=0$을 설정했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $g(x)=x(x-1)(x-p+1)$로 인수분해하여 근 $x=0,1,p-1$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: |
        $0<p-1<1$임을 언급했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $0<x<p-1$에서 $f(x)>x$임과 $p-1<x<1$에서 $f(x)<x$임을 보였다($\beta=p-1$).
      depends_on: [1.M1, 1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-9150}
  misconceptions:
  - id: MC-ALG-9150
    outcome_code: '71'
    wrong_work: '$f(x)=x(x^2-px+p)=0$의 근이나 $f''(x)=0$의 근을 경계로 잡아 $\beta$를 구함'
    detect_cue: $f(x)-x$를 만들지 않고 $f(x)$ 자체를 인수분해하거나 미분한다
    feedback: $f(x)>x$의 경계는 $f(x)-x=0$의 근입니다. $f(x)-x$를 인수분해하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    모든 자연수 $n$에 대하여 부등식 $0<a_n<1$이 성립함을 수학적 귀납법을 이용하여 보이시오.
  points: 15
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=3x^2-2px+p>0$(판별식 $p(p-3)<0$)이므로 $f$는 증가하고, $f(0)=0$, $f(1)=1$에서 $f((0,1))\subset(0,1)$.
    steps:
    - {id: 2a, content: '$D/4=p(p-3)<0\Rightarrow f''>0$; $0<a_k<1\Rightarrow 0=f(0)<f(a_k)<f(1)=1$', criteria: ['2.M2', '2.A1', '2.A2', '2.A3']}
    hint_ladder:
    - $a_{k+1}=f(a_k)$이므로 $f$가 구간 $(0,1)$을 어디로 보내는지 보면 된다.
    - $f'(x)$의 부호를 판별식으로 확인하자.
  - id: S2-B
    audience: B
    source_flow: 2022 자연계열 답안(출제의도 및 답안) p.5 예시답안 1-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $n=1$일 때, $0<a_1<1$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        $n=k$일 때 $0<a_k<1$을 가정하자. $a_{k+1}=f(a_k)$이므로 $0<f(a_k)<1$을 보이면 $0<a_{k+1}<1$이 성립한다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $f'(x)=3x^2-2px+p$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        이차방정식 $3x^2-2px+p=0$의 판별식을 이용하면 $D/4=p^2-3p=p(p-3)$이 $1<p<2$에서 $D/4<0$이다.
      criteria: ['2.A1']
    - id: 2b-5
      content: |
        따라서 $f'(x)=3x^2-2px+p>0$이고, 함수 $f(x)$는 구간 $(-\infty,\infty)$에서 증가한다.
      criteria: ['2.A2']
    - id: 2b-6
      content: |
        $f(0)=0$, $f(1)=1$이므로 $0<x<1$일 때 $0<f(x)<1$이다.
      criteria: ['2.B2', '2.A3']
    - id: 2b-7
      content: |
        $0<a_k<1$이므로 $0<f(a_k)<1$이고, $f(a_k)=a_{k+1}$이므로 $0<a_{k+1}<1$이다.
      criteria: ['2.R1', '2.R2']
    - id: 2b-8
      content: |
        따라서 수학적 귀납법에 의해 모든 자연수 $n$에 대하여 $0<a_n<1$이 성립한다.
      criteria: ['2.R3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        $n=1$일 때 $0<a_1<1$임을 언급했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $n=k$일 때 $0<a_k<1$임을 가정했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 1
      evidence: |
        $f'(x)=3x^2-2px+p$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $3x^2-2px+p=0$의 판별식을 이용하여 $1<p<2$에서 $D<0$임을 보였다.
      depends_on: [2.M2]
      steps: [2b-4]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $f'(x)>0$임을 보이고 함수 $f(x)$가 증가함을 주장했다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-5]
    - id: 2.B2
      mark_type: B
      points: 1
      evidence: |
        $f(0)=0$, $f(1)=1$임을 언급했다.
      depends_on: []
      steps: [2b-6]
    - id: 2.A3
      mark_type: A
      points: 2
      evidence: |
        앞의 근거들을 기반으로 $0<x<1$일 때 $0<f(x)<1$임을 주장했다.
      depends_on: [2.M2, 2.A2, 2.B2]
      steps: [2b-6]
    - id: 2.R1
      mark_type: R
      points: 1
      evidence: |
        가정 $0<a_k<1$을 언급하고 $0<f(a_k)<1$임을 주장했다.
      depends_on: [2.M1, 2.A3]
      steps: [2b-7]
    - id: 2.R2
      mark_type: R
      points: 1
      evidence: |
        $0<f(a_k)<1$임을 근거로 $0<a_{k+1}<1$임을 주장했다.
      depends_on: [2.R1]
      steps: [2b-7]
    - id: 2.R3
      mark_type: R
      points: 1
      evidence: |
        수학적 귀납법에 의해 모든 자연수 $n$에 대하여 $0<a_n<1$이 성립함을 기술했다.
      depends_on: [2.B1, 2.R2]
      steps: [2b-8]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-PRF-9151}
  misconceptions:
  - id: MC-PRF-9151
    outcome_code: '72'
    wrong_work: '$0<a_k<1$이면 $a_{k+1}=a_k^3-pa_k^2+pa_k$도 $0$과 $1$ 사이이다(근거 없음)'
    detect_cue: $f'(x)$나 증가성 언급 없이 귀납 단계를 끝낸다
    feedback: 구간의 끝값을 비교하려면 $f$가 증가함을 먼저 보여야 $f(0)<f(a_k)<f(1)$을 쓸 수 있습니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    문항 (1)에서 정해진 $\beta$에 대하여 $a_1\neq\beta$일 때, 모든 자연수 $n$에 대하여 부등식 $0<a_n<\beta$가 성립하거나, 모든 자연수 $n$에 대하여 부등식 $\beta<a_n<1$이 성립함을 수학적 귀납법을 이용하여 보이시오.
  points: 11
  depends_on: ['1', '2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f$가 증가하고 $f(0)=0$, $f(\beta)=\beta$, $f(1)=1$이므로 $(0,\beta)$와 $(\beta,1)$이 각각 $f$에 의해 보존된다. $a_1$이 어느 쪽인지로 경우를 나눠 귀납.
    steps:
    - {id: 3a, content: '$0<a_k<\beta\Rightarrow 0=f(0)<f(a_k)<f(\beta)=\beta$; $\beta<a_k<1\Rightarrow\beta<f(a_k)<1$', criteria: ['3.M2', '3.A1', '3.A2']}
    hint_ladder:
    - $\beta$도 $f(x)=x$의 근이다.
    - (2)에서 보인 증가성을 구간 $(0,\beta)$, $(\beta,1)$에 적용하자.
  - id: S3-B
    audience: B
    source_flow: 2022 자연계열 답안(출제의도 및 답안) p.6 예시답안 1-(3)
    method_no: 1
    steps:
    - id: 3b-0
      content: |
        문항 (1)의 결과로부터 $\beta=p-1$이고, $0<a_1<\beta$인 경우와 $\beta<a_1<1$인 경우로 나누어 보인다.
      criteria: ['3.M2']
    - id: 3b-1
      content: |
        (i) $0<a_1<\beta$인 경우: $n=1$일 때 $0<a_1<\beta$가 성립한다. $n=k$일 때 $0<a_k<\beta$를 가정하자.
      criteria: ['3.B1', '3.M1']
    - id: 3b-2
      content: |
        문항 (2)의 풀이로부터 $f(x)$가 구간 $(-\infty,\infty)$에서 증가하므로 $f(0)<f(a_k)<f(\beta)$이다. $f(0)=0$, $f(\beta)=\beta$이므로 $0<a_{k+1}<\beta$이다.
      criteria: ['3.M2', '3.A1']
    - id: 3b-3
      content: |
        따라서 수학적 귀납법에 의해 모든 자연수 $n$에 대하여 $0<a_n<\beta$이다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        (ii) $\beta<a_1<1$인 경우: $n=1$일 때 $\beta<a_1<1$이 성립한다. $n=k$일 때 $\beta<a_k<1$을 가정하자.
