intent: |
  함수와 관련하여 귀납적으로 정의된 수열을 이해하고, 함수의 미분으로 증가 상태와 성질을 분석한 뒤 이를 수열에 적용하여 수학적 귀납법으로 수열의 성질(유계성, 위치 보존, 단조성)을 추론하는 능력을 평가한다(문항카드 출제의도 요지).
key_idea: |
  $g(x)=f(x)-x=x(x-1)(x-p+1)$의 부호로 $\beta=p-1$을 얻고, $f'(x)>0$(판별식 $D/4=p(p-3)<0$)인 증가함수의 고정점 $0,\beta,1$ 사이 구간이 $f$에 의해 보존됨을 귀납법으로 보인다.
stuck: |
  $f$가 증가함수이고 $f(0)=0$, $f(\beta)=\beta$, $f(1)=1$이므로 구간 $(0,\beta)$, $(\beta,1)$이 $f$에 의해 자기 자신으로 옮겨진다는 관찰, 그리고 단조성은 $f(x)$와 $x$의 대소에서 나온다는 점
