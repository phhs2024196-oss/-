stimuli: []

stem: |
  아래 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    좌표평면에서 타원 $x^2+3y^2=3$과 직선 $y=x+k$가 서로 다른 두 점에서 만나도록 하는 실수 $k$의 값의 범위를 구하시오.
  points: 8
  depends_on: []
  answer: {kind: set, value: '-2 < k < 2', equivalents: ['Interval.open(-2, 2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 대입한 이차방정식의 판별식이 양수.
    steps:
    - {id: 1a, content: '$4x^2+6kx+3(k^2-1)=0$, $D/4=3(4-k^2)>0\Rightarrow -2<k<2$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 직선의 식을 타원의 식에 대입하자.
  - id: S1-B
    audience: B
    source_flow: 2022 자연계열 답안(출제의도 및 답안) pp.10–11 예시답안 2-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=x+k$를 $x^2+3y^2=3$에 대입하면 $x^2+3(x+k)^2=3$이고, $4x^2+6kx+3(k^2-1)=0$을 얻는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이 이차방정식이 서로 다른 두 실근을 가져야 하므로 판별식 $D$가 양수여야 한다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $D/4=9k^2-4\cdot3(k^2-1)=-3k^2+12=3(4-k^2)>0$이므로 $4-k^2>0$이다. 따라서 구하는 답은 $-2<k<2$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        두 식을 연립하여 이차방정식 $4x^2+6kx+3(k^2-1)=0$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        서로 다른 두 점에서 만나려면 이 이차방정식의 판별식이 양수여야 함을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $D=12(4-k^2)$ (또는 $D/4=3(4-k^2)$)를 얻고 답 $-2<k<2$를 얻었다.
      depends_on: [1.M1, 1.M2]
      accept:
      - $k=\pm2$일 때 접한다는 사실을 이용해 $-2<k<2$를 얻은 경우(채점기준 ※)
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9154}
  misconceptions:
  - id: MC-GEO-9154
    outcome_code: '71'
    wrong_work: '$D\ge0$에서 $-2\le k\le2$'
    detect_cue: 답의 범위에 등호가 들어 있다
    feedback: $D=0$이면 접하므로 한 점에서 만납니다. 서로 다른 두 점은 $D>0$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    타원 $x^2+3y^2=3$ 위의 점 $\mathrm{P}$에서의 접선의 기울기는 $1$이고, 점 $\mathrm{P}$의 $x$좌표는 양수이다. 타원 $x^2+3y^2=3$과 직선 $y=x+k$가 서로 다른 두 점 $\mathrm{Q},\mathrm{R}$에서 만날 때, 삼각형 $\mathrm{PQR}$의 넓이를 $f(k)$라 하자. $f(k)$를 구하시오.
  points: 12
  depends_on: ['1']
  answer: {kind: expression, value: 'sqrt(3*(4 - k**2))*(2 + k)/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $k=-2$일 때의 접점이 $\mathrm{P}$이고, 밑변 QR은 근의 차의 $\sqrt2$배, 높이는 P에서 직선까지의 거리.
    steps:
    - {id: 2a, content: '$\mathrm{P}\left(\tfrac32,-\tfrac12\right)$, $f(k)=\tfrac12\cdot\tfrac{\sqrt2\sqrt{3(4-k^2)}}{2}\cdot\tfrac{\lvert 2+k\rvert}{\sqrt2}=\tfrac{\sqrt{3(4-k^2)}(2+k)}{4}$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - 기울기 1인 접선은 (1)의 직선 중 어떤 $k$에 해당하는가?
    - 삼각형의 밑변을 QR로 잡자.
  - id: S2-B
    audience: B
    source_flow: 2022 자연계열 답안(출제의도 및 답안) p.11 예시답안 2-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문항 (1)의 풀이에서 직선 $y=x+k$가 타원에 접할 때는 $D=0$일 때이다. 따라서 $k=\pm2$이고, 이때 $4x^2+6kx+3(k^2-1)=4x^2\pm12x+9=(2x\pm3)^2=0$의 근은 $x=\mp\dfrac32$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이 중 양수인 경우는 $k=-2$일 때 $x=\dfrac32$이며, 이때 $y=\dfrac32-2=-\dfrac12$이다. 따라서 $\mathrm{P}\left(\dfrac32,-\dfrac12\right)$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $-2<k<2$일 때 두 점 Q, R의 $x$좌표의 차는 $4x^2+6kx+3(k^2-1)=0$의 두 근의 차와 같고, 근의 공식 또는 근과 계수의 관계로 $\dfrac{\sqrt{3(4-k^2)}}{2}$이다. 직선 QR의 기울기가 1이므로 $\overline{\mathrm{QR}}=\sqrt2\cdot\dfrac{\sqrt{3(4-k^2)}}{2}$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        점 $\mathrm{P}\left(\dfrac32,-\dfrac12\right)$과 직선 $x-y+k=0$ 사이의 거리는 $\dfrac{\left\lvert\frac32-\left(-\frac12\right)+k\right\rvert}{\sqrt{1^2+(-1)^2}}=\dfrac{\lvert 2+k\rvert}{\sqrt2}$이므로
        $$f(k)=\dfrac12\cdot\dfrac{\sqrt2\sqrt{3(4-k^2)}}{2}\cdot\dfrac{\lvert 2+k\rvert}{\sqrt2}=\dfrac{\sqrt{3(4-k^2)}\,(2+k)}{4}\quad(-2<k<2)$$
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        문항 (1)의 판별식 $D=0$ 조건을 사용하여 $\mathrm{P}\left(\dfrac32,-\dfrac12\right)$를 얻거나 P에서의 접선이 $y=x-2$임을 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        Q, R의 좌표 $\left(\dfrac{-3k\pm\sqrt{3(4-k^2)}}{4},\dfrac{k\pm\sqrt{3(4-k^2)}}{4}\right)$를 구하거나 두 근의 차로 $\overline{\mathrm{QR}}=\sqrt2\cdot\dfrac{\sqrt{3(4-k^2)}}{2}$를 구했다.
      depends_on: [2.M1]
      implied_ok: true
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: |
        점 P와 직선 사이의 거리 $\dfrac{\lvert 2+k\rvert}{\sqrt2}$ 등을 이용하여 $f(k)=\dfrac{\sqrt{3(4-k^2)}(2+k)}{4}$ $(-2<k<2)$를 구했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-ALG-9155}
  - {code: '73', misconception: MC-GEO-9156}
  misconceptions:
  - id: MC-ALG-9155
    outcome_code: '72'
    wrong_work: '$\overline{\mathrm{QR}}=\dfrac{\sqrt{3(4-k^2)}}{2}$로 두어 $f(k)=\dfrac{\sqrt{3(4-k^2)}(2+k)}{4\sqrt2}$'
    detect_cue: 넓이 식에 $\sqrt2$가 남아 있다
    feedback: 기울기 1인 선분의 길이는 $x$좌표 차의 $\sqrt{1+1^2}=\sqrt2$배입니다.
    remedy: [RL-2]
  - id: MC-GEO-9156
    outcome_code: '73'
    wrong_work: '$\mathrm{P}\left(-\dfrac32,\dfrac12\right)$을 택해 높이를 $\dfrac{\lvert k-2\rvert}{\sqrt2}$로 씀'
    detect_cue: P의 $x$좌표가 음수이거나 $f(k)$에 $(2-k)$가 나온다
    feedback: 「P의 $x$좌표는 양수」 조건으로 $k=-2$ 쪽 접점을 골라야 합니다.
    remedy: [RL-3]

- id: '3'
  stem: |
    문항 (1)에 해당하는 실수 $k$에 대하여 $\{f(k)\}^2$의 최댓값을 구하시오.
  points: 10
  depends_on: ['1', '2']
  answer: {kind: value, value: '81/16', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g(k)=\tfrac{3}{16}(4-k^2)(2+k)^2$, $g'(k)=\tfrac34(2+k)^2(1-k)$이므로 $k=1$에서 최대.
    steps:
    - {id: 3a, content: '$g''(k)=\tfrac34(2+k)^2(1-k)$, $g(1)=\tfrac{81}{16}$', criteria: ['3.M1', '3.A1', '3.R1', '3.A2']}
    hint_ladder:
    - 근호를 없애려면 제곱한 함수를 미분하자.
  - id: S3-B
    audience: B
    source_flow: 2022 자연계열 답안(출제의도 및 답안) p.12 예시답안 2-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $-2<k<2$에서 $g(k)=\{f(k)\}^2=\dfrac{3}{16}(4-k^2)(2+k)^2$이라 하고 $k$에 대하여 미분하면
        $$g'(k)=\dfrac{3}{16}\{(-2k)(2+k)^2+(4-k^2)\cdot2(2+k)\}=\dfrac34(2+k)^2(1-k)$$
      criteria: ['3.M1', '3.A1']
    - id: 3b-2
      content: |
        $-2<k<1$에서 $g'(k)>0$이므로 $g(k)$가 증가하고, $1<k<2$에서 $g'(k)<0$이므로 $g(k)$가 감소한다.
      criteria: ['3.A1', '3.R1']
    - id: 3b-3
      content: |
        따라서 $g(k)=\{f(k)\}^2$은 $k=1$에서 최댓값 $\dfrac{3(4-1)(2+1)^2}{16}=\dfrac{81}{16}$을 갖는다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $\{f(k)\}^2=\dfrac{3}{16}(4-k^2)(2+k)^2$의 도함수를 고려하고 계산했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A2], max_points: 2}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        도함수를 $\dfrac34(2+k)^2(1-k)$ 꼴로 인수분해하는 등의 방법으로 도함수가 $-2<k<1$에서 양수, $1<k<2$에서 음수임을 관찰했다.
      depends_on: [3.M1]
      steps: [3b-1, 3b-2]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
