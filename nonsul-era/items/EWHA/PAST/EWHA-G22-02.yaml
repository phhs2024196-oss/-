intent: |
  이차곡선과 직선의 위치 관계, 교점의 좌표 계산을 이해하고, 이차곡선의 접선과 점과 직선 사이의 거리를 이용하여 삼각형의 넓이를 효율적으로 계산한 뒤, 도함수로 다항함수의 최댓값을 구하는 능력을 평가한다(문항카드 출제의도 요지).
key_idea: |
  연립한 $4x^2+6kx+3(k^2-1)=0$의 판별식으로 $-2<k<2$와 접점 $\mathrm{P}\left(\tfrac32,-\tfrac12\right)$를 얻고, $\overline{\mathrm{QR}}=\sqrt2\cdot\tfrac{\sqrt{3(4-k^2)}}{2}$, 높이 $\tfrac{\lvert 2+k\rvert}{\sqrt2}$로 $f(k)$를 만든 뒤 $\{f(k)\}^2$을 미분한다.
stuck: |
  접점 P를 판별식 $D=0$인 경우(접선 $y=x-2$)로 찾는 연결, 그리고 근호를 피하려고 $\{f(k)\}^2$을 미분하는 것
