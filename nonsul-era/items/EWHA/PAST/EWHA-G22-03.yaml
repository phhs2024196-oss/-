intent: |
  함수의 그래프와 원의 관계로 제시된 조건의 수리적 의미를 이해하고, 원과 직선의 위치 관계, 두 점 사이의 거리, 점과 직선 사이의 거리를 활용하여 조건을 만족하는 함수를 결정하는 능력을 평가한다(문항카드 출제의도 요지).
key_idea: |
  원은 중심 $(s,r)$, 반지름 $r$로 $x$축에 접한다. $s\ge4$이면 원이 반직선 $y=\tfrac43x+8$에 접하므로 중심은 두 직선의 각의 이등분선 $y=\tfrac12x+3$ 위에 있고, $-4<s<4$이면 원이 꼭짓점 $(0,8)$을 지나므로 중심은 초점 $(0,8)$, 준선 $y=0$인 포물선 $y=\tfrac{1}{16}x^2+4$ 위에 있다.
stuck: |
  (1)의 수선의 발 $(0,8)$이 꺾인 그래프의 꼭짓점이라는 사실로부터 $s=4$가 두 경우(반직선에 접함 / 꼭짓점을 지남)의 경계임을 알아차리는 것
