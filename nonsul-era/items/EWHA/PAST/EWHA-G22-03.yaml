stimuli:
- label: 조건
  body: |
    좌표평면에서 실수 $s$에 대하여 원 $(x-s)^2+(y-r)^2=r^2$과 함수 $y=\dfrac43\lvert x\rvert+8$의 그래프가 한 점에서 만날 때 원의 반지름의 길이를 $f(s)$라 하자.

stem: |
  다음과 같이 실수 전체의 집합에서 정의된 함수 $f(s)$에 대하여 아래 물음에 답하시오. [30점]
  (원문은 이 발문 아래 상자 안에 「조건」 제시문이 있다.)

subparts:
- id: '1'
  stem: |
    점 $(4,5)$에서 직선 $y=\dfrac43x+8$에 내린 수선의 발을 구하시오.
  points: 6
  depends_on: []
  answer: {kind: value, value: '(0, 8)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 기울기 $-\tfrac34$인 직선 $y=-\tfrac34x+8$과의 교점.
    steps:
    - {id: 1a, content: '$y=-\tfrac34(x-4)+5=-\tfrac34x+8$, 교점 $(0,8)$', criteria: ['1.B1', '1.M1', '1.A1']}
    hint_ladder:
    - 수직인 두 직선의 기울기의 곱은 $-1$이다.
  - id: S1-B
    audience: B
    source_flow: 2022 자연계열 답안(출제의도 및 답안) p.16 예시답안 3-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직선 $y=\dfrac43x+8$에 수직인 직선의 기울기는 $-\dfrac34$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        기울기가 $-\dfrac34$이고 점 $(4,5)$를 지나는 직선은 $y=-\dfrac34(x-4)+5=-\dfrac34x+8$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        이 직선과 $y=\dfrac43x+8$의 교점은 $(0,8)$이다. 따라서 수선의 발은 $(0,8)$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        수직인 직선의 기울기 $-\dfrac34$를 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        기울기 $-\dfrac34$이고 $(4,5)$를 지나는 직선 $y=-\dfrac34x+8$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        두 직선의 교점으로 수선의 발 $(0,8)$을 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9158}
  misconceptions:
  - id: MC-GEO-9158
    outcome_code: '71'
    wrong_work: '수직인 직선의 기울기를 $\dfrac34$ 또는 $-\dfrac43$로 둠'
    detect_cue: 수선의 발이 $(0,8)$이 아니고 기울기 곱이 $-1$이 아니다
    feedback: 수직인 두 직선은 기울기의 곱이 $-1$이므로 $-\dfrac34$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $s\ge4$일 때, 함수 $f(s)$를 구하시오.
  points: 14
  depends_on: ['1']
  answer: {kind: expression, value: 's/2 + 3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 원 $(x-4)^2+(y-5)^2=25$가 경계. $s>4$에서는 직선 $y=\tfrac43x+8$과 $x$축에 동시에 접하므로 중심은 $(-6,0)$, $(4,5)$를 지나는 이등분선 위.
    steps:
    - {id: 2a, content: '$f(4)=5$, 이등분선 $y=\tfrac12x+3$ ⇒ $f(s)=\tfrac12s+3$', criteria: ['2.B1', '2.R1', '2.R2', '2.M1', '2.A1']}
    hint_ladder:
    - (1)의 점 $(4,5)$를 중심으로 하는 원은 어떤 원인가?
    - 두 직선에 동시에 접하는 원의 중심은 어디에 있는가?
  - id: S2-B
    audience: B
    source_flow: 2022 자연계열 답안(출제의도 및 답안) p.16 예시답안 3-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1)의 수선의 발 $(0,8)$은 함수 $y=\dfrac43\lvert x\rvert+8$의 그래프 위에 있다. 점 $(4,5)$는 $(0,8)$과의 거리가 $\sqrt{(0-4)^2+(8-5)^2}=5$이고 $x$축과의 거리가 5이므로, 원 $(x-4)^2+(y-5)^2=5^2$은 그래프와 한 점 $(0,8)$에서 만나고 $x$축과 접한다. 따라서 $f(4)=5$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        $s>4$일 때 $x$축에 접하는 원 $(x-s)^2+(y-r)^2=r^2$이 그래프와 한 점에서 만나려면 원이 직선 $y=\dfrac43x+8$에 접해야 한다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        평행하지 않은 두 직선에 동시에 접하는 원의 중심은 두 직선의 각을 이등분하는 직선 위에 있으므로, 두 직선 $y=\dfrac43x+8$과 $y=0$의 각을 이등분하는 직선 중 제1사분면을 지나는 직선을 구한다.
      criteria: ['2.R2']
    - id: 2b-4
      content: |
        점 $(4,5)$가 두 직선과 같은 거리에 있으므로 구하는 직선은 두 직선의 교점 $(-6,0)$과 $(4,5)$를 지나는 직선 $y=\dfrac{0-5}{-6-4}(x-4)+5=\dfrac12x+3$이다.
      criteria: ['2.M1']
    - id: 2b-5
      content: |
        $f(s)$를 결정하는 원의 중심이 $(s,f(s))$이므로 $s>4$일 때 $f(s)=\dfrac12s+3$이고, $s=4$일 때 $\dfrac12\cdot4+3=5$이므로 $s\ge4$일 때 $f(s)=\dfrac12s+3$이다.
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    source_flow: 2022 자연계열 답안(출제의도 및 답안) p.17 별해
    method_no: 2
    key_idea: 공식 별해 — 중심 $(s,f(s))$와 직선 $y=\tfrac43x+8$ 사이 거리 $\tfrac35\left\lvert f(s)-\tfrac43s-8\right\rvert$가 $\lvert f(s)\rvert$와 같다.
    steps:
    - id: 2c-1
      content: |
        $\dfrac35\left\lvert f(s)-\dfrac43s-8\right\rvert=\lvert f(s)\rvert$를 정리하면 $f(s)=\dfrac12s+3\ (s>4)$이고, $f(4)=5$와 합쳐 $s\ge4$에서 $f(s)=\dfrac12s+3$이다.
      criteria: ['2.M1', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        (1)의 점 $(4,5)$가 조건을 만족하므로 $s=4$일 때 $f(4)=5$임을 밝혔다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: |
        $s>4$일 때 $x$축에 접하는 원이 그래프와 한 점에서 만나려면 직선 $y=\dfrac43x+8$에 접해야 함을 서술했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.R2
      mark_type: R
      points: 3
      evidence: |
        두 직선 $y=\dfrac43x+8$과 $y=0$의 각을 이등분하는 직선 중 제1사분면을 지나는 직선을 구해야 함을 올바른 근거로 서술했다.
      depends_on: [2.R1]
      steps: [2b-3]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        점 $(-6,0)$과 $(4,5)$를 지나는 직선의 방정식 $y=\dfrac12x+3$을 구했다(또는 거리 같음 식을 세워 정리).
      depends_on: []
      implied_ok: false
      steps: [2b-4, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $s\ge4$일 때 $f(s)=\dfrac12s+3$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-5, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-GEO-9159}
  misconceptions:
  - id: MC-GEO-9159
    outcome_code: '72'
    wrong_work: '거리 같음 식 $\dfrac35\left\lvert r-\dfrac43s-8\right\rvert=r$에서 절댓값을 다른 부호로 풀어 $r=-2s-12$ 계열의 해를 택함'
    detect_cue: 반지름 식이 $s\ge4$에서 음수가 되거나 제1사분면을 지나지 않는 이등분선을 쓴다
    feedback: 중심 $(s,r)$은 $x$축 위쪽, 직선 아래쪽에 있으므로 $\tfrac43s+8-r>0$인 쪽, 즉 제1사분면을 지나는 이등분선을 택합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $-4<s<4$일 때, 함수 $f(s)$를 구하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: expression, value: 's**2/16 + 4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 원이 두 반직선에 접할 수 없으므로 꼭짓점 $(0,8)$을 지나고, 중심 $(s,f(s))$는 $(0,8)$과 $x$축에서 같은 거리.
    steps:
    - {id: 3a, content: '$f(s)^2=s^2+(f(s)-8)^2\Rightarrow f(s)=\tfrac{1}{16}s^2+4$', criteria: ['3.R1', '3.M1', '3.A1', '3.A2']}
    hint_ladder:
    - $s=4$에서 원은 어디서 그래프와 만났는가?
    - 한 점과 한 직선에서 같은 거리인 점의 자취는?
  - id: S3-B
    audience: B
    source_flow: 2022 자연계열 답안(출제의도 및 답안) p.17 예시답안 3-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $x$축에 접하는 원 $(x-s)^2+(y-r)^2=r^2$이 그래프와 한 점에서 만나려면 원이 반직선 $y=\dfrac43x+8\,(x>0)$ 또는 $y=-\dfrac43x+8\,(x<0)$에 접하거나 그래프의 꼭짓점 $(0,8)$을 지난다. $-4<s<4$이면 원이 두 반직선과 접하지 못하므로 원이 점 $(0,8)$을 지난다.
      criteria: ['3.R1']
    - id: 3b-2
      content: |
        따라서 원의 중심 $(s,f(s))$와 점 $(0,8)$의 거리 $\sqrt{s^2+(f(s)-8)^2}$과 중심과 $x$축의 거리 $\lvert f(s)\rvert$가 같다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        $\lvert f(s)\rvert^2=s^2+\{f(s)\}^2-16f(s)+64$를 정리하면 $f(s)=\dfrac{1}{16}s^2+4$이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        따라서 $-4<s<4$에서 $f(s)=\dfrac{1}{16}s^2+4$이다.
      criteria: ['3.A2']
  - id: S3-ALT
    audience: ALT
    source_flow: 2022 자연계열 답안(출제의도 및 답안) p.18 별해
    method_no: 2
    key_idea: 공식 별해 — 점 $(s,f(s))$는 준선 $y=0$, 초점 $(0,8)$인 포물선 위. 이는 $x^2=16y$를 $y$축 방향으로 4만큼 평행이동한 $x^2=16(y-4)$.
    steps:
    - id: 3c-1
      content: |
        포물선의 정의에 따라 $x^2=16(y-4)$, 즉 $y=\dfrac{1}{16}x^2+4$이므로 $f(s)=\dfrac{1}{16}s^2+4$.
      criteria: ['3.M1', '3.A1', '3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.R1
      mark_type: R
