- id: '4'
  stem: |
    문항 (3)에서 구한 자연수 $n$의 값의 범위에 대하여 극한값 $\displaystyle\lim_{a\to0+}\frac{1}{n}(S_0+S_1+\cdots+S_n)$을 구하시오.
  points: 13
  depends_on: ['2', '3']
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $k\le n$이면 모두 두 점에서 만나므로 $S_k=\tfrac{(1-a-2ka)^2}{1-a^2}$을 합해 닫힌 꼴로 만든 뒤 $na\to\tfrac12$, $\tfrac1n\to0$을 대입한다.
    steps:
    - {id: 4a, content: '$\tfrac1n\sum S_k=\tfrac{1}{1-a^2}\left(1+\tfrac1n\right)\left(\tfrac43(na)^2+\tfrac{2(4a-3)}{3}(na)+(1-a)^2\right)\to\tfrac13$', criteria: ['4.R1', '4.M1', '4.A1', '4.R2', '4.A2']}
    hint_ladder:
    - $a\to0+$이면 $n$은 어떻게 되는가? 각 $S_k$의 극한을 먼저 구하면 안 되는 이유는?
    - $\sum k$, $\sum k^2$로 합을 정리하고 $na$로 묶어 보자.
  - id: S4-B
    audience: B
    source_flow: 「2023 논술고사 자연계열 답안」 예시 답안 pp.7-8
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        문항 (3)의 범위 $\dfrac{1-3a}{2a}\le n<\dfrac{1-a}{2a}$에서는 $a(2n+1)<1$이므로 모든 $k=0,1,2,\cdots,n$에 대하여 $a(2k+1)<1$, 즉 구간 $[2k,2k+2]$에서 직선과 그래프가 두 점에서 만난다.
      criteria: ['4.R1']
    - id: 4b-2
      content: |
        따라서 문항 (2)의 결과에 의해 $S_k=\dfrac{(1-a-2ka)^2}{1-a^2}=\dfrac{1}{1-a^2}\left(4a^2k^2-4a(1-a)k+(1-a)^2\right)$이다.
      criteria: ['4.M1']
    - id: 4b-3
      content: |
        $\dfrac1n(S_0+\cdots+S_n)=\dfrac{1}{(1-a^2)n}\left(\dfrac{4a^2n(n+1)(2n+1)}{6}-\dfrac{4a(1-a)n(n+1)}{2}+(1-a)^2(n+1)\right)=\dfrac{n+1}{(1-a^2)n}\left(\dfrac{4a^2n^2}{3}+\dfrac{2(4a-3)an}{3}+(1-a)^2\right)$.
      criteria: ['4.A1']
    - id: 4b-4
      content: |
        $\dfrac{1-3a}{2a}\le n<\dfrac{1-a}{2a}$이므로 $\dfrac{2a}{1-a}<\dfrac1n\le\dfrac{2a}{1-3a}$이고, 따라서 $\displaystyle\lim_{a\to0+}\dfrac1n=0$이다.
      criteria: ['4.R2']
    - id: 4b-5
      content: |
        문항 (3)의 $\displaystyle\lim_{a\to0+}na=\dfrac12$와 함께 쓰면
        $\displaystyle\lim_{a\to0+}\dfrac{1}{1-a^2}\left(1+\dfrac1n\right)\left(\dfrac43(na)^2+\dfrac{2(4a-3)}{3}(na)+(1-a)^2\right)=\dfrac43\cdot\dfrac14-1+1=\dfrac13$.
      criteria: ['4.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.R1
      mark_type: R
      points: 3
      evidence: |
        $\dfrac{1-3a}{2a}\le n<\dfrac{1-a}{2a}$일 때 모든 $k=0,1,\cdots,n$에 대하여 교점이 두 점임을 지적했다.
      depends_on: []
      implied_ok: false
      steps: [4b-1]
    - id: 4.M1
      mark_type: M
      points: 2
      evidence: |
        문항 (2)의 결과를 인용하여 $S_k=\dfrac{(1-a-2ka)^2}{1-a^2}$ ($k=0,\cdots,n$)임을 보였다.
      depends_on: [4.R1]
      ft: {allowed: true, from: [2.A4], max_points: 2}
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 3
      evidence: |
        $\dfrac1n(S_0+S_1+\cdots+S_n)$을 닫힌 꼴로 구했다.
      depends_on: [4.M1]
      steps: [4b-3]
    - id: 4.R2
      mark_type: R
      points: 2
      evidence: |
        $\dfrac{1-3a}{2a}\le n<\dfrac{1-a}{2a}$을 인용하여 $\displaystyle\lim_{a\to0+}\dfrac1n=0$을 얻었다.
      depends_on: []
      steps: [4b-4]
    - id: 4.A2
      mark_type: A
      points: 3
      evidence: |
        극한값 $\dfrac13$을 얻었다.
      depends_on: [4.A1, 4.R2]
      steps: [4b-5]
    deductions: []
