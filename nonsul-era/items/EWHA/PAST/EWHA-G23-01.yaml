  - id: MC-ALG-9203
    outcome_code: '73'
    wrong_work: '$[2n+2,2n+4]$의 조건을 $a(2n+3)>1$로 두어 $n>\dfrac{1-3a}{2a}$로 씀(꼭짓점을 지나 한 점에서 만나는 경우 누락)'
    detect_cue: 하한에 등호가 없다
