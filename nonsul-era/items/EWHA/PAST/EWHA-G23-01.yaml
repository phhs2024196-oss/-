      points: 4
      evidence: |
        자연수 $n$의 범위 $\dfrac{1-3a}{2a}\le n<\dfrac{1-a}{2a}$를 구했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        범위로부터 $1-3a\le 2na<1-a$를 얻었다.
      depends_on: [3.A1]
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 3
