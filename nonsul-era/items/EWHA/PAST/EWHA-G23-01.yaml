stimuli: []

stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $2n\le x<2n+2$일 때, $f(x)=1-\lvert x-2n-1\rvert$이다. (단, $n=0,1,2,3,\cdots$ 이다.)
  (나) $x<0$일 때, $f(x)=0$이다.

  닫힌구간 $[2n,2n+2]$에서 직선 $y=ax\ (0<a<1)$와 함수 $y=f(x)$의 그래프가 두 점에서 만날 때 직선과 함수의 그래프로 둘러싸인 도형의 넓이를 $S_n$이라 한다. 아래 물음에 답하시오. [40점]

subparts:
- id: '1'
  stem: |
    $S_0$을 구하시오.
  points: 7
  depends_on: []
  answer: {kind: expression, value: '(1-a)/(1+a)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $[0,2]$에서 그래프는 $(0,0)$, $(1,1)$, $(2,0)$을 잇는 꺾은선이므로 둘러싸인 도형은 두 교점과 꼭짓점 $(1,1)$이 이루는 삼각형이다.
    steps:
    - {id: 1a, content: '교점 $(0,0)$, $\left(\tfrac{2}{1+a},\tfrac{2a}{1+a}\right)$, 높이 $\tfrac{1-a}{\sqrt{1+a^2}}$ → $S_0=\tfrac{1-a}{1+a}$', criteria: ['1.B1', '1.M1', '1.A1', '1.A2', '1.A3']}
    hint_ladder:
    - $[0,1]$과 $[1,2]$에서 $f(x)$를 절댓값 없이 써 보자.
    - 둘러싸인 도형의 꼭짓점은 몇 개인가?
  - id: S1-B
    audience: B
    source_flow: 「2023 논술고사 자연계열 답안」 예시 답안 p.5
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        구간 $[0,2]$에서 $y=f(x)$의 그래프는 $[0,1]$에서는 $y=x$, $[1,2]$에서는 $y=2-x$이다. 그러므로 직선 $y=ax$와의 교점은 $y=x$와의 교점 $(0,0)$과 $y=2-x$와의 교점 $\left(\dfrac{2}{1+a},\dfrac{2a}{1+a}\right)$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        따라서 둘러싸인 도형은 두 교점 $(0,0)$, $\left(\dfrac{2}{1+a},\dfrac{2a}{1+a}\right)$와 그래프 위의 점 $(1,1)$이 이루는 삼각형이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        두 교점 사이의 거리는 $\dfrac{2\sqrt{1+a^2}}{1+a}$이고, 점 $(1,1)$에서 직선 $y=ax$까지의 거리는 $\dfrac{\lvert 1-a\cdot1\rvert}{\sqrt{1+a^2}}=\dfrac{1-a}{\sqrt{1+a^2}}\ (0<a<1)$이다.
      criteria: ['1.A1', '1.A2']
    - id: 1b-4
      content: |
        $S_0=\dfrac12\cdot\dfrac{2\sqrt{1+a^2}}{1+a}\cdot\dfrac{1-a}{\sqrt{1+a^2}}=\dfrac{1-a}{1+a}$.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        두 교점 $(0,0)$, $\left(\dfrac{2}{1+a},\dfrac{2a}{1+a}\right)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        둘러싸인 도형이 $(0,0)$, $\left(\dfrac{2}{1+a},\dfrac{2a}{1+a}\right)$, $(1,1)$을 꼭짓점으로 하는 삼각형임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        두 교점 사이의 거리 $\dfrac{2\sqrt{1+a^2}}{1+a}$를 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        점 $(1,1)$과 직선 $y=ax$ 사이의 거리 $\dfrac{1-a}{\sqrt{1+a^2}}$를 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        삼각형의 넓이 $S_0=\dfrac{1-a}{1+a}$를 적었다.
      depends_on: [1.M1, 1.A1, 1.A2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9201}
  misconceptions:
  - id: MC-GEO-9201
    outcome_code: '71'
    wrong_work: '둘러싸인 도형을 $(0,0)$, $(2,0)$, 교점이 이루는 도형으로 보거나 꼭짓점 $(1,1)$을 빼고 넓이를 계산'
    detect_cue: 넓이 식에 점 $(1,1)$ 또는 꼭짓점까지의 거리가 나오지 않는다
    feedback: $[0,2]$에서 그래프는 $(1,1)$에서 꺾입니다. 직선 위쪽에 남는 부분은 두 교점과 $(1,1)$이 이루는 삼각형입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    닫힌구간 $[2n,2n+2]$에서 직선 $y=ax$와 함수 $y=f(x)$의 그래프가 두 점에서 만나도록 하는 실수 $a$의 값의 범위를 구하고 $S_n$을 구하시오.
  points: 9
  depends_on: ['1']
  answer: {kind: expression, value: 'a_upper=1/(2*n+1); S_n=(1-a-2*n*a)**2/(1-a**2)', equivalents: ['0<a<1/(2n+1)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 꼭짓점 $(2n+1,1)$이 직선보다 위에 있어야 두 점에서 만나고, (1)과 같은 삼각형 넓이 계산을 $n$에 대해 반복한다.
    steps:
    - {id: 2a, content: '$a(2n+1)<1$, 교점 $\left(\tfrac{2n}{1-a},\tfrac{2na}{1-a}\right)$, $\left(\tfrac{2(n+1)}{1+a},\tfrac{2(n+1)a}{1+a}\right)$ → $S_n=\tfrac{(1-a-2na)^2}{1-a^2}$', criteria: ['2.M1', '2.A1', '2.A2', '2.A3', '2.A4']}
    hint_ladder:
    - 직선이 꼭짓점 $(2n+1,1)$보다 위에 있으면 교점은 몇 개인가?
    - 넓이는 (1)과 같은 방법으로 구할 수 있다.
  - id: S2-B
    audience: B
    source_flow: 「2023 논술고사 자연계열 답안」 예시 답안 pp.5-6
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $[2n,2n+2]$에서 $f$의 그래프는 $[2n,2n+1]$에서 $y=x-2n$, $[2n+1,2n+2]$에서 $y=2n+2-x$이다. 직선 $y=ax$와 두 점에서 만나려면 그래프 위의 점 $(2n+1,1)$이 직선 $y=ax$보다 위쪽에 있어야 한다. 즉 $a(2n+1)<1$이므로 $0<a<\dfrac{1}{2n+1}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이때 두 교점은 $ax=x-2n\ (2n\le x<2n+1)$, $ax=2n+2-x\ (2n+1\le x\le 2n+2)$를 만족시키므로 $\left(\dfrac{2n}{1-a},\dfrac{2na}{1-a}\right)$, $\left(\dfrac{2(n+1)}{1+a},\dfrac{2(n+1)a}{1+a}\right)$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        두 교점 사이의 거리는 $\sqrt{\left(\dfrac{2(n+1)}{1+a}-\dfrac{2n}{1-a}\right)^2+\left(\dfrac{2(n+1)a}{1+a}-\dfrac{2na}{1-a}\right)^2}=\dfrac{2\sqrt{1+a^2}\,(1-a-2na)}{1-a^2}$이다.
      criteria: ['2.A2']
    - id: 2b-4
      content: |
        점 $(2n+1,1)$에서 직선 $y=ax$까지의 거리는 $\dfrac{\lvert 1-a(2n+1)\rvert}{\sqrt{1+a^2}}=\dfrac{1-(2n+1)a}{\sqrt{1+a^2}}$ $\left(0<a<\dfrac{1}{2n+1}\right)$이다.
      criteria: ['2.A3']
    - id: 2b-5
      content: |
        $S_n=\dfrac12\cdot\dfrac{2\sqrt{1+a^2}\,(1-a-2na)}{1-a^2}\cdot\dfrac{1-(2n+1)a}{\sqrt{1+a^2}}=\dfrac{(1-a-2na)^2}{1-a^2}$.
      criteria: ['2.A4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        점 $(2n+1,1)$이 직선보다 위쪽에 있어야 함을 지적하고 범위 $0<a<\dfrac{1}{2n+1}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        두 교점 $\left(\dfrac{2n}{1-a},\dfrac{2na}{1-a}\right)$, $\left(\dfrac{2(n+1)}{1+a},\dfrac{2(n+1)a}{1+a}\right)$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: |
        두 교점 사이의 거리 $\dfrac{2\sqrt{1+a^2}(1-a-2na)}{1-a^2}$을 구했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    - id: 2.A3
      mark_type: A
      points: 2
      evidence: |
        점 $(2n+1,1)$과 직선 $y=ax$ 사이의 거리 $\dfrac{1-(2n+1)a}{\sqrt{1+a^2}}$을 구했다.
      depends_on: [2.M1]
      steps: [2b-4]
    - id: 2.A4
      mark_type: A
      points: 1
      evidence: |
        삼각형의 넓이 $S_n=\dfrac{(1-a-2na)^2}{1-a^2}$을 적었다.
      depends_on: [2.A2, 2.A3]
      implied_ok: true
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-ALG-9202}
  misconceptions:
  - id: MC-ALG-9202
    outcome_code: '72'
    wrong_work: '구간 끝점 $(2n+2,0)$ 또는 $(2n,0)$을 기준으로 $a(2n+2)<1$처럼 범위를 잡음'
    detect_cue: 범위 식에 $2n+1$이 아닌 $2n$ 또는 $2n+2$가 들어 있다
    feedback: 직선이 삼각형 모양 그래프와 두 점에서 만나려면 꼭짓점 $(2n+1,1)$이 직선보다 위에 있어야 합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    실수 $a$에 대하여 직선 $y=ax$와 함수 $y=f(x)$의 그래프가 닫힌구간 $[2n,2n+2]$에서 두 점에서 만나고 닫힌구간 $[2n+2,2n+4]$에서는 한 점에서 만나거나 만나지 않는 자연수 $n$의 값의 범위를 $a$로 나타내고 극한값 $\displaystyle\lim_{a\to0+}na$를 구하시오.
  points: 11
  depends_on: ['2']
  answer: {kind: expression, value: 'n_lower=(1-3*a)/(2*a); n_upper=(1-a)/(2*a); limit=1/2', equivalents: ['(1-3a)/(2a) <= n < (1-a)/(2a)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $[2n,2n+2]$에서는 $a(2n+1)<1$, $[2n+2,2n+4]$에서는 꼭짓점 $(2n+3,1)$이 직선 위 또는 아래, 즉 $a(2n+3)\ge1$. 이를 $na$에 대해 풀어 조인다.
    steps:
    - {id: 3a, content: '$\tfrac{1-3a}{2a}\le n<\tfrac{1-a}{2a}$ → $1-3a\le 2na<1-a$ → $\lim na=\tfrac12$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2']}
    hint_ladder:
    - (2)의 조건을 $n$에 대한 부등식으로 바꿔 보자.
    - 다음 구간의 꼭짓점은 어디에 있어야 하는가?
  - id: S3-B
    audience: B
    source_flow: 「2023 논술고사 자연계열 답안」 예시 답안 pp.6-7
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        문항 (2)의 결과로부터 $0<a<\dfrac{1}{2n+1}$일 때 $[2n,2n+2]$에서 두 점에서 만나므로 자연수 $n$은 $n<\dfrac{1-a}{2a}$를 만족한다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        한편 $[2n+2,2n+4]$에서 한 점에서만 만나거나 만나지 않으려면 그래프 위의 점 $(2n+3,1)$이 직선 $y=ax$ 위의 점이거나 직선보다 아래쪽에 있어야 한다. 즉 $a(2n+3)\ge1$이므로 $n\ge\dfrac{1-3a}{2a}$이다. 따라서 $\dfrac{1-3a}{2a}\le n<\dfrac{1-a}{2a}$.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        이 범위에서 $1-3a\le 2na<1-a$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $a\to0+$일 때 양 끝이 모두 $1$로 수렴하므로 극한의 대소 관계에 의해 $\displaystyle\lim_{a\to0+}na=\dfrac12$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 1
      evidence: |
        $[2n,2n+2]$에서 두 점에서 만나기 위한 조건 $n<\dfrac{1-a}{2a}$를 적었다.
      depends_on: []
      implied_ok: false
