    outcome_code: '74'
    wrong_work: '각 $k$에 대해 $\lim_{a\to0+}S_k=1$이므로 평균도 $1$이라고 답함'
    detect_cue: 합을 닫힌 꼴로 정리하지 않고 극한을 각 항에 먼저 적용했으며 답이 $1$이다
    feedback: $a\to0+$이면 $n\to\infty$라서 더하는 항의 개수가 함께 늘어납니다. 합을 $n$, $na$로 정리한 뒤 극한을 취하세요.
