intent: |
  주어진 함수들에 의해 결정되는 도형을 파악하고, 점과 직선 사이의 거리 등 간단한 수리적 도구로 도형의 넓이를 구한 뒤 관련된 극한값을 구하는 수리적 조작 능력과, 함수들의 조건을 만족시키는 범위를 결정하고 극한의 대소 관계를 활용해 결과를 도출하는 수리적 추론 능력을 평가한다(공식 출제 의도 요지).
key_idea: |
  구간 $[2n,2n+2]$에서 $f$의 그래프는 꼭짓점 $(2n+1,1)$인 삼각형 모양이므로, 직선 $y=ax$와 두 점에서 만날 조건은 꼭짓점이 직선보다 위에 있는 것($a(2n+1)<1$)이고, 넓이는 두 교점과 꼭짓점이 이루는 삼각형의 넓이(밑변 × 점과 직선 사이 거리 ÷ 2)이다.
stuck: |
  (3)에서 $n$의 범위를 $\dfrac{1-3a}{2a}\le n<\dfrac{1-a}{2a}$로 정리해 $1-3a\le 2na<1-a$로 바꾸는 것, (4)에서 $a\to0+$일 때 $n\to\infty$이므로 항별 극한이 아니라 합을 닫힌 꼴로 구한 뒤 $na\to\tfrac12$, $\tfrac1n\to0$을 함께 쓰는 것
idea_tags: [IDEA-TENT-PEAK-ABOVE-LINE, IDEA-TRIANGLE-AREA-POINT-LINE-DIST, IDEA-SQUEEZE-NA-LIMIT]
tags: [톱니 함수, 삼각형 넓이, 극한의 대소 관계, 수열의 합]
elements:
  materials:
  - '주기 2로 반복되는 톱니(삼각파) 함수 $f(x)=1-\lvert x-2n-1\rvert$ ($2n\le x<2n+2$), $x<0$에서 $f(x)=0$'
  - '원점을 지나는 직선 $y=ax$ ($0<a<1$)'
  - '구간 $[2n,2n+2]$에서 직선과 그래프로 둘러싸인 삼각형의 넓이 $S_n$'
  concepts:
  - '절댓값 함수의 그래프'
  - '두 직선의 교점'
  - '두 점 사이의 거리'
  - '점과 직선 사이의 거리'
  - '함수의 극한과 극한의 대소 관계'
  - '자연수의 거듭제곱의 합 $\sum k$, $\sum k^2$'
  tools:
  - '꼭짓점 $(2n+1,1)$과 직선의 위치 비교 $a(2n+1)<1$'
  - '삼각형 넓이 $=\tfrac12\times$(두 교점 사이 거리)$\times$(꼭짓점과 직선 사이 거리)'
  - '$1-3a\le 2na<1-a$에서 $na\to\tfrac12$ (조임)'
  - '$\sum_{k=0}^{n}k=\tfrac{n(n+1)}{2}$, $\sum_{k=0}^{n}k^2=\tfrac{n(n+1)(2n+1)}{6}$'
  conditions:
  - '$0<a<1$'
  - '$[2n,2n+2]$에서 두 점에서 만남 $\iff 0<a<\tfrac{1}{2n+1}$'
  - '$[2n+2,2n+4]$에서 한 점에서 만나거나 만나지 않음 $\iff a(2n+3)\ge1$'
  stimuli_used: []
  subpart_links: '(2)는 (1)의 일반화, (3)은 (2)의 범위 조건을 $n$에 대해 풀어 쓰고, (4)는 (2)의 $S_k$와 (3)의 $\lim na$를 사용'

