stimuli: []

stem: |
  실수 $m,b$에 대하여 직선 $y=mx+b$가 함수 $y=\lvert x(x-2)\rvert$의 그래프와 서로 다른 세 점에서 만날 때 아래 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    $m=1$일 때 위 조건을 만족하는 $b$의 값을 모두 구하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '[0, 1/4]', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 직선 $y=x+b$를 위아래로 움직이면 세 점에서 만나는 순간은 꺾인 점 $(0,0)$을 지날 때와 $0<x<2$에서 $y=-x(x-2)$에 접할 때뿐이다.
    steps:
    - {id: 1a, content: '$b=0$(원점 통과), $-x^2+2x=x+b$의 판별식 $1-4b=0$에서 $b=\tfrac14$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 직선을 $y$축 방향으로 평행이동하며 교점 개수가 바뀌는 순간을 찾아보자.
    - 절댓값 안의 함숫값이 $0$이 되는 점을 지날 때도 교점 개수가 바뀐다.
  - id: S1-B
    audience: B
    source_flow: 「2023 논술고사 자연계열 답안」 예시 답안 p.12
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직선 $y=x+b$를 $y$축을 따라 평행이동하면 $b=-2$일 때 그래프와 한 점에서 만나고 $-2<b<0$일 때 두 점에서 만난다. $b>0$이면 직선이 $0<x<2$에서 함수의 그래프에 접할 때만 세 점에서 만난다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $b=0$일 때 직선 $y=x$는 그래프와 $(0,0)$, $(1,1)$, $(3,3)$의 세 점에서 만난다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        직선 $y=x+b$와 $y=-x(x-2)$가 접하면 $-x^2+2x=x+b$가 중근을 가지므로 판별식 $D=1-4b=0$, 즉 $b=\dfrac14$일 때 세 점에서 만난다. 따라서 구하는 값은 $b=0,\ \dfrac14$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        직선을 $y$축 방향으로 평행이동하여 $b=0$이거나 $0<x<2$에서 그래프에 접할 때만 세 점에서 만남을 보였다(그림으로 두 경우만 세 점임을 보여도 인정).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $b=0$일 때 직선과 그래프가 세 점에서 만남을 적었다.
      depends_on: [1.M1]
      implied_ok: true
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        접할 때 판별식 또는 미분으로 교점이 세 개가 되고 이때 $b=\dfrac14$임을 구했다.
      depends_on: [1.M1]
      implied_ok: true
      accept:
      - 그림을 그려 조건을 만족하는 $b$의 값이 두 개임을 보인 경우(공식 채점 기준 ※)
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-9205}
  misconceptions:
  - id: MC-ALG-9205
    outcome_code: '71'
    wrong_work: '판별식만 써서 $b=\tfrac14$ 하나만 답함'
    detect_cue: 답에 $b=0$이 없다
    feedback: 절댓값 그래프는 $(0,0)$에서 꺾입니다. 직선이 그 점을 지날 때도 교점 개수가 바뀌니 따로 확인하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $m\ge0$, $b>0$일 때 위 조건을 만족하는 $m$의 값의 범위를 구하고 $b$를 $m$으로 나타내시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'm_range=[0,2); b=(m-2)**2/4', equivalents: ['0<=m<2, b=(m-2)^2/4'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $m\ge0$, $b>0$인 직선은 $(0,0)$, $(2,0)$을 지날 수 없으므로 $0<x<2$에서 $y=-x(x-2)$에 접해야 한다. 판별식과 중근의 위치를 함께 쓴다.
    steps:
    - {id: 2a, content: '$D=(m-2)^2-4b=0$, 중근 $1-\tfrac m2\in(0,2)$ → $0\le m<2$, $b=\tfrac14(m-2)^2$', criteria: ['2.R1', '2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $m\ge0$, $b>0$이면 직선이 꺾인 점을 지날 수 있는가?
    - 접점의 $x$좌표가 어디에 있어야 하는가?
  - id: S2-B
    audience: B
    source_flow: 「2023 논술고사 자연계열 답안」 예시 답안 p.13
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $m\ge0$, $b>0$이면 직선 $y=mx+b$는 점 $(0,0)$, $(2,0)$을 지날 수 없다.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        따라서 직선이 그래프와 세 점에서 만나는 경우는 직선이 $0<x<2$에서 $y=-x(x-2)$의 그래프에 접할 때이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        이차방정식 $-x^2+2x=mx+b$가 중근을 갖고 중근이 $0<x<2$에 있어야 한다. 판별식 $D=(m-2)^2-4b=0$이므로 $b=\dfrac14(m-2)^2$이고, 중근 $1-\dfrac m2$가 $0<1-\dfrac m2<2$를 만족시키므로 $0\le m<2$이다($m\ge0$).
      criteria: ['2.A1', '2.A2']
    - id: 2b-4
      content: |
        그러므로 $0\le m<2$일 때 $b=\dfrac14(m-2)^2$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        $m\ge0$, $b>0$이므로 직선이 점 $(0,0)$, $(2,0)$을 지날 수 없음을 언급했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 1
      evidence: |
        세 점에서 만나는 경우는 직선이 $0<x<2$에서 $y=-x(x-2)$의 그래프에 접할 때임을 언급했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        접할 때 교점이 세 개이므로 $m$의 범위가 $0\le m<2$임을 보였다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: |
        판별식으로부터 접하는 경우 $b=\dfrac14(m-2)^2$을 만족함을 보였다.
      depends_on: [2.M1]
      steps: [2b-3, 2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-ALG-9206}
  misconceptions:
  - id: MC-ALG-9206
    outcome_code: '72'
    wrong_work: '판별식 $b=\tfrac14(m-2)^2$만 구하고 $m$의 범위를 $m\ge0$ 전체로 씀'
    detect_cue: 중근 $x=1-\tfrac m2$가 $0<x<2$에 있는지 확인하는 식이 없다
    feedback: 접점은 $y=-x(x-2)$가 실제 그래프인 $0<x<2$ 안에 있어야 합니다. 중근의 위치로 $m$의 범위를 제한하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    $m\ge0$, $b>0$일 때 직선 $y=mx+b$와 함수 $y=\lvert x(x-2)\rvert$의 그래프의 세 교점을 $x$좌표의 크기순으로 $\mathrm{A},\mathrm{B},\mathrm{C}$라 하자. 교점 $\mathrm{A}$와 $\mathrm{B}$사이에서 직선과 함수의 그래프로 둘러싸인 부분의 넓이와 교점 $\mathrm{B}$와 $\mathrm{C}$사이에서 직선과 함수의 그래프로 둘러싸인 부분의 넓이가 서로 같아지는 실수 $b$의 값을 모두 구하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: (2)에서 접할 때만 세 교점이므로 $0<b\le1$. $b=1$($m=0$)이면 $x=1$ 대칭으로 넓이가 같고, $0<b<1$이면 왼쪽 도형은 $b=1$일 때의 왼쪽 도형에 포함되고 오른쪽 도형은 $b=1$일 때의 오른쪽 도형을 포함하므로 $S_1<S_0=S_0'<S_2$.
    steps:
    - {id: 3a, content: '$b=1$에서 대칭, $0<b<1$에서 $S_1<S_0=S_0^{\prime}<S_2$ → $b=1$', criteria: ['3.M1', '3.B1', '3.R1', '3.R2']}
    hint_ladder:
    - (2)의 결과로 $b$의 범위를 먼저 구하자.
    - 두 넓이가 같아질 것 같은 대칭인 경우는 언제인가?
    - 대칭인 경우의 두 도형과 비교하면 나머지 경우의 대소를 정할 수 있다.
  - id: S3-B
    audience: B
    source_flow: 「2023 논술고사 자연계열 답안」 예시 답안 pp.13-14
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        문항 (2)의 결과로부터 세 점에서 만날 때는 직선과 그래프가 접할 때이고, $b=\dfrac14(m-2)^2\ (0\le m<2)$이므로 $0<b\le1$이다. 직선과 $y=x(x-2)$의 교점을 $\mathrm{A}(\alpha,m\alpha+b)$, $\mathrm{C}(\beta,m\beta+b)$ $(\alpha<\beta)$, 접점을 $\mathrm{B}(p,q)$라 하고, A와 B 사이 넓이를 $S_1$, B와 C 사이 넓이를 $S_2$라 하자.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (i) $b=1$일 때 직선 $y=1$은 $y=-x(x-2)$에 접하고, 둘러싸인 두 도형은 대칭축 $x=1$에 대하여 대칭이므로 넓이가 같다. 이때 $y=1$과 $y=x(x-2)$의 교점은 $(1-\sqrt2,1)$, $(1+\sqrt2,1)$이다.
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        (ii) $0<b<1$일 때 $m>0$이므로 $1-\sqrt2<\alpha<0$, $1+\sqrt2<\beta$이고, 접점은 $0<p<1$이다. 따라서 $1-\sqrt2<\alpha<p<1<1+\sqrt2<\beta$이다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $\alpha\le x\le p$에서 둘러싸인 도형은 $1-\sqrt2\le x\le1$에서 직선 $y=1$과 그래프로 둘러싸인 도형(넓이 $S_0$)에 포함되고 같지 않으므로 $S_1<S_0$이다. $p\le x\le\beta$에서 둘러싸인 도형은 $1\le x\le1+\sqrt2$에서 $y=1$과 그래프로 둘러싸인 도형(넓이 $S_0^{\prime}$)을 포함하고 같지 않으므로 $S_2>S_0^{\prime}$이다. (i)에서 $S_0=S_0^{\prime}$이므로 $S_1<S_0=S_0^{\prime}<S_2$.
      criteria: ['3.R2']
    - id: 3b-5
