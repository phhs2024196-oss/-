intent: |
  이차함수로부터 유도된 절댓값 함수의 그래프와 직선의 교점에 관한 조건을 수리적 조작으로 파악하고, 교점의 개수와 교점을 특정하는 직선의 위치를 추론하는 능력, 이차방정식의 판별식으로 직선과 그래프가 접하는 상황을 판별하고 도형의 넓이를 비교 판정하는 능력을 평가한다(공식 출제 의도 요지).
key_idea: |
  $y=\lvert x(x-2)\rvert$와 직선이 세 점에서 만나는 것은 직선이 꺾인 점 $(0,0)$ 또는 $(2,0)$을 지나거나, $0<x<2$에서 $y=-x(x-2)$에 접할 때뿐이다. $m\ge0$, $b>0$이면 꺾인 점을 지날 수 없으므로 접하는 경우만 남고, $b=1$일 때만 그림이 $x=1$에 대하여 대칭이 된다.
stuck: |
  (1)에서 접하는 경우 외에 꺾인 점 $(0,0)$을 지나는 경우($b=0$)를 찾는 것, (3)에서 $b\ne1$일 때 두 넓이가 같을 수 없음을 $b=1$일 때의 두 도형과 포함 관계로 비교해 보이는 것
idea_tags: [IDEA-ABS-QUAD-KINK-OR-TANGENT, IDEA-DISCRIMINANT-TANGENT, IDEA-AREA-COMPARE-BY-INCLUSION]
tags: [절댓값 이차함수, 교점의 개수, 판별식, 넓이 비교]
