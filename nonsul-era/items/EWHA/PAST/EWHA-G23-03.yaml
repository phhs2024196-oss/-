stimuli: []

stem: |
  좌표평면 위에서 원 $x^2+y^2=1$의 내부를 색칠하여 얻게 되는 그림을 $P_0$이라 하자. $P_0$에 원 $(x-1)^2+y^2=1$과 원 $(x+1)^2+y^2=1$의 내부를 색칠한 부분을 더하여 얻게 되는 그림을 $P_1$이라 하고 $P_1$에 원 $(x-2)^2+y^2=1$과 원 $(x+2)^2+y^2=1$의 내부를 색칠한 부분을 더하여 얻게 되는 그림을 $P_2$라 한다. 이 과정을 계속하여 $P_n$에 원 $(x-n-1)^2+y^2=1$과 원 $(x+n+1)^2+y^2=1$의 내부를 색칠한 부분을 더하여 얻게 되는 그림을 $P_{n+1}$이라 한다. $P_n$에 색칠되어 있는 부분의 넓이를 $S_n$이라 하자. (단, $n=0,1,2,3,\cdots$이다.)

  한 변의 길이가 $1$인 정삼각형의 넓이를 $\alpha$라 하고, 반지름의 길이가 $1$이고 중심각의 크기가 $\dfrac{\pi}{3}$인 부채꼴에서 호의 양 끝점과 중심을 꼭짓점으로 하는 삼각형을 제외한 도형의 넓이를 $\beta$라 할 때 아래 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    $S_0$을 $a_0\alpha+b_0\beta$로 나타낼 때 자연수 $a_0$, $b_0$을 구하시오.
  points: 8
  depends_on: []
  answer: {kind: expression, value: '(6, 6)', equivalents: ['a0=6, b0=6'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 단위원에 내접하는 정육각형은 정삼각형 6개이고, 남는 부분은 활꼴 6개이다.
    steps:
    - {id: 1a, content: '$S_0=\pi=6\alpha+6\beta$ → $a_0=b_0=6$', criteria: ['1.B1', '1.B2', '1.M1', '1.A1']}
    hint_ladder:
    - 원에 내접하는 정육각형을 그려 보자.
  - id: S1-B
    audience: B
    source_flow: 「2023 논술고사 자연계열 답안」 예시 답안 pp.18-19
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        넓이가 $\beta$인 도형은 [그림1]과 같이 반지름의 길이가 $1$이고 중심각의 크기가 $\dfrac{\pi}{3}$인 부채꼴에서 한 변의 길이가 $1$인 정삼각형을 뺀 것이다. [그림1: 정삼각형과 그 한 변 위에 붙은 활꼴]
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        그림 $P_0$은 중심이 $(0,0)$이고 반지름의 길이가 $1$인 원이다.
      criteria: ['1.B2']
    - id: 1b-3
      content: |
        따라서 $P_0$은 [그림2]와 같이 한 변의 길이가 $1$인 정삼각형 6개와 넓이가 $\beta$인 도형 6개로 분할된다. [그림2: 원에 내접하는 정육각형을 정삼각형 6개로 나누고, 남는 활꼴 6개]
      criteria: ['1.M1']
    - id: 1b-4
      content: |
        그러므로 $S_0=6\alpha+6\beta$이고 $a_0=6$, $b_0=6$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    source_flow: '「2023 논술고사 자연계열 답안」 예시 답안 p.19 별해 (공식 별해 채점: α 계산 2점, β 계산 3점, P₀ 넓이 π 1점, a₀·b₀ 2점)'
    method_no: 2
    key_idea: $\alpha$, $\beta$를 직접 계산해 $\pi=6\alpha+6\beta$임을 확인한다.
    steps:
    - id: 1c-1
      content: |
        $\alpha=\dfrac12\cdot1\cdot1\cdot\sin\dfrac{\pi}{3}=\dfrac{\sqrt3}{4}$, 부채꼴의 넓이 $\dfrac12\cdot1\cdot1\cdot\dfrac{\pi}{3}=\dfrac{\pi}{6}$이므로 $\beta=\dfrac{\pi}{6}-\dfrac{\sqrt3}{4}$이다.
      criteria: ['1.B1']
    - id: 1c-2
      content: |
        $S_0=\pi=6\cdot\dfrac{\sqrt3}{4}+6\left(\dfrac{\pi}{6}-\dfrac{\sqrt3}{4}\right)=6\alpha+6\beta$이므로 $a_0=6$, $b_0=6$.
      criteria: ['1.B2', '1.M1', '1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        넓이가 $\beta$인 도형을 그림으로 나타내거나, 중심각 $\dfrac{\pi}{3}$인 부채꼴에서 한 변의 길이가 $1$인 정삼각형을 뺀 것으로 서술했다.
      depends_on: []
      steps: [1b-1, 1c-1]
    - id: 1.B2
      mark_type: B
      points: 1
      evidence: |
        $P_0$이 중심 $(0,0)$, 반지름 $1$인 원임을 서술했다.
      depends_on: []
      steps: [1b-2, 1c-2]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $P_0$이 정삼각형 6개와 넓이가 $\beta$인 도형 6개로 분할됨을 기술했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3, 1c-2]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $S_0=6\alpha+6\beta$, $a_0=6$, $b_0=6$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-4, 1c-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9208}
  misconceptions:
  - id: MC-GEO-9208
    outcome_code: '71'
    wrong_work: '$\beta$를 부채꼴 넓이 $\tfrac{\pi}{6}$로 보고 $\pi=6\beta$, $a_0=0$으로 씀'
    detect_cue: $\beta=\tfrac{\pi}{6}$로 두었거나 $a_0$이 자연수가 아니다
    feedback: $\beta$는 부채꼴에서 삼각형을 뺀 활꼴의 넓이입니다. 부채꼴 = 정삼각형 + 활꼴 = $\alpha+\beta$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $S_1$을 $a_1\alpha+b_1\beta$로 나타낼 때 자연수 $a_1$, $b_1$을 구하시오.
  points: 12
  depends_on: ['1']
  answer: {kind: expression, value: '(14, 10)', equivalents: ['a1=14, b1=10'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 더해지는 초승달 모양 도형 하나는 정삼각형 4개와 활꼴 2개의 넓이 합 $4\alpha+2\beta$이다.
    steps:
    - {id: 2a, content: '$S_1=(6\alpha+6\beta)+2(4\alpha+2\beta)=14\alpha+10\beta$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - 새로 더해지는 부분은 원에서 무엇을 뺀 모양인가?
    - 그 도형을 정삼각형과 활꼴로 나누어 보자.
  - id: S2-B
    audience: B
    source_flow: 「2023 논술고사 자연계열 답안」 예시 답안 pp.19-20
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        그림 $P_1$은 [그림3]과 같이 그림 $P_0$에 [그림4]와 같이 나타나는 도형 두 개를 더한 것이다. [그림3: 가운데 원 $P_0$과 좌우로 겹치는 두 원. 그림4: 원에서 $P_0$과 겹치는 렌즈를 뺀 초승달 모양]
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        [그림4]의 도형은 [그림5]와 같이 분할되고, [그림6]처럼 넓이가 $\beta$인 도형을 이동하면 그 넓이는 한 변의 길이가 $1$인 정삼각형 4개의 넓이와 넓이가 $\beta$인 도형 2개의 넓이의 합과 같다. 따라서 [그림4]의 도형의 넓이는 $4\alpha+2\beta$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        문항 (1)에 따라 $S_0=6\alpha+6\beta$이므로 $S_1=(6\alpha+6\beta)+2(4\alpha+2\beta)=14\alpha+10\beta$이고, $a_1=14$, $b_1=10$이다.
      criteria: ['2.A2']
  - id: S2-ALT
    audience: ALT
    source_flow: '「2023 논술고사 자연계열 답안」 예시 답안 p.20 별해 (공식 별해 채점: 그림 구성 3점, [그림4] 넓이 5점, 결론 4점)'
    method_no: 2
    key_idea: '[그림4]의 도형은 단위원에서, 중심각 $\tfrac{2\pi}{3}$인 부채꼴에서 삼각형을 뺀 활꼴 두 개를 뺀 것이다([그림7]).'
    steps:
    - id: 2c-1
      content: |
        중심각 $\dfrac{2\pi}{3}$인 활꼴의 넓이는 $\dfrac12\cdot\dfrac{2\pi}{3}-\dfrac12\sin\dfrac{2\pi}{3}=\dfrac{\pi}{3}-\dfrac{\sqrt3}{4}$이므로 [그림4]의 넓이는 $\pi-2\left(\dfrac{\pi}{3}-\dfrac{\sqrt3}{4}\right)=\dfrac{\pi}{3}+\dfrac{\sqrt3}{2}=2\left(\dfrac{\pi}{6}-\dfrac{\sqrt3}{4}\right)+4\cdot\dfrac{\sqrt3}{4}=2\beta+4\alpha$.
      criteria: ['2.M1', '2.A1']
    - id: 2c-2
      content: |
        $S_1=(6\alpha+6\beta)+2(4\alpha+2\beta)=14\alpha+10\beta$, $a_1=14$, $b_1=10$.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $P_1$은 $P_0$에 [그림4]와 같은 초승달 모양 도형 두 개를 더한 것임을 서술했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: |
        타당한 방법으로 [그림4]의 도형의 넓이가 $4\alpha+2\beta$임을 구했다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $S_1=(6\alpha+6\beta)+2(4\alpha+2\beta)=14\alpha+10\beta$, $a_1=14$, $b_1=10$을 구했다.
      depends_on: [2.A1]
      ft: {allowed: true, from: [1.A1], max_points: 3}
      implied_ok: true
      steps: [2b-3, 2c-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-GEO-9209}
  misconceptions:
  - id: MC-GEO-9209
    outcome_code: '72'
    wrong_work: '$S_1=3S_0=18\alpha+18\beta$처럼 원 세 개의 넓이를 그대로 더함'
    detect_cue: 겹치는 렌즈 부분을 뺀 흔적이 없다
    feedback: 이웃한 원은 중심 거리가 $1$이라 겹칩니다. 새로 더해지는 넓이는 원에서 겹치는 부분을 뺀 초승달 모양입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $S_{2023}$을 $a_{2023}\alpha+b_{2023}\beta$로 나타낼 때 자연수 $a_{2023}$, $b_{2023}$을 구하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: expression, value: '(16190, 8098)', equivalents: ['a2023=16190, b2023=8098'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 매 단계 같은 초승달 도형 두 개가 더해지므로 $a_n$, $b_n$은 공차가 각각 $8$, $4$인 등차수열이다.
    steps:
    - {id: 3a, content: '$a_n=8n+6$, $b_n=4n+6$ → $a_{2023}=16190$, $b_{2023}=8098$', criteria: ['3.R1', '3.A1', '3.A2', '3.A3']}
    hint_ladder:
