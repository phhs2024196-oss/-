intent: |
  원에 관한 도형들로 제시된 조건을 이해하고, 그림에 대한 수리적 조작·다항식의 연산·등차수열을 활용하여 그림의 넓이를 정삼각형의 넓이 $\alpha$와 부채꼴에 관한 도형(활꼴)의 넓이 $\beta$의 합으로 나타내는 수리적 추론·조작 능력을 평가한다(공식 출제 의도 요지).
key_idea: |
  단위원은 정삼각형 6개와 활꼴 6개로 나뉘므로 $S_0=6\alpha+6\beta$이다. 한 단계마다 더해지는 초승달 모양 도형은 원에서 이웃 원과 겹치는 렌즈를 뺀 것으로 넓이가 $4\alpha+2\beta$이고, 양쪽에 두 개씩 더해지므로 $S_n-S_{n-1}=8\alpha+4\beta$인 등차수열이 된다.
stuck: |
  더해지는 초승달 모양 도형이 [그림5]·[그림6]처럼 정삼각형 4개와 활꼴 2개의 넓이 합과 같다는 분할(활꼴 하나를 옮겨 붙이기)을 찾는 것
