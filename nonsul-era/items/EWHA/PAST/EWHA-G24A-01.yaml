  misconceptions:
  - id: MC-CAL-9255
    outcome_code: '75'
    wrong_work: '「$a^{2^n}\to0$이므로 적분값은 $2\pi\ln1=0$」처럼 $\frac{1}{2^n}$ 없이 (4)의 양 끝만으로 결론'
    detect_cue: $2^n$으로 나눈 양쪽 수열이 없고, 적분값 자체가 $n$에 무관함을 쓰지 않았다
    feedback: (3)으로 적분값을 $\frac{1}{2^n}$배 꼴로 바꾼 뒤 (4)를 적용하고, 양쪽 수열의 극한이 같음을 보인 다음 샌드위치 정리를 쓰세요.
    remedy: [RL-5]

