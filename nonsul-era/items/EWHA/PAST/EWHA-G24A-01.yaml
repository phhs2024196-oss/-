- id: '4'
  stem: |
    다음 부등식이 모든 자연수 $n$에 대하여 성립함을 보이시오.
    $$2\pi\ln(1-a^{2^n})\le\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^{2^{n+1}}+1+2a^{2^n}\sin\theta)\,d\theta\le2\pi\ln(1+a^{2^n})$$
  points: 5
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $\sin\theta=\pm1$에서 진수가 $(1\pm a^{2^n})^2$이 되므로 진수를 위아래로 누르고 로그의 증가성을 쓴다.
    steps:
    - {id: 4a, content: '$(1-a^{2^n})^2\le a^{2^{n+1}}+1+2a^{2^n}\sin\theta\le(1+a^{2^n})^2$, $\int_{-\pi/2}^{\pi/2}\ln(1\pm a^{2^n})^2d\theta=2\pi\ln(1\pm a^{2^n})$', criteria: [4.R1, 4.M1, 4.A1]}
    hint_ladder:
    - $\sin\theta$ 대신 $\pm1$을 넣으면 진수는 어떤 완전제곱식이 되는가?
  - id: S4-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 p.7 [풀이] 1-(4)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $-1<a<1$이므로 $0\le a^{2^n}<1$이고, $\theta\in[-\frac{\pi}{2},\frac{\pi}{2}]$에서 $-1\le\sin\theta\le1$이므로
        $$(1-a^{2^n})^2=a^{2^{n+1}}+1+2a^{2^n}(-1)\le a^{2^{n+1}}+1+2a^{2^n}\sin\theta\le a^{2^{n+1}}+1+2a^{2^n}\cdot1=(1+a^{2^n})^2$$
      criteria: [4.R1]
    - id: 4b-2
      content: |
        밑이 1보다 큰 로그함수는 증가함수이므로
        $$\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(1-a^{2^n})^2d\theta\le\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^{2^{n+1}}+1+2a^{2^n}\sin\theta)d\theta\le\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(1+a^{2^n})^2d\theta$$
      criteria: [4.M1]
    - id: 4b-3
      content: |
        $\ln(1\pm a^{2^n})^2=2\ln(1\pm a^{2^n})$은 $\theta$에 대하여 상수이므로 $\displaystyle\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(1\pm a^{2^n})^2d\theta=2\ln(1\pm a^{2^n})\cdot\pi=2\pi\ln(1\pm a^{2^n})$이고, 주어진 부등식이 성립한다. ■
      criteria: [4.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.R1
      mark_type: R
      points: 2
      evidence: |
        $0\le a^{2^n}<1$을 언급하고 $(1-a^{2^n})^2\le a^{2^{n+1}}+1+2a^{2^n}\sin\theta\le(1+a^{2^n})^2$을 보였다.
      depends_on: []
      implied_ok: false
      steps: [4b-1]
    - id: 4.M1
      mark_type: M
      points: 2
      evidence: |
        로그함수(증가함수)를 적용하여 세 적분의 부등식을 세웠다.
      depends_on: [4.R1]
      implied_ok: false
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 1
      evidence: |
        양 끝 적분을 $2\pi\ln(1\pm a^{2^n})$으로 계산해 결론을 적었다.
      depends_on: [4.M1]
      steps: [4b-3]
    deductions: []
