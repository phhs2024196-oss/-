    outcome_code: '74'
    wrong_work: '$\int_{-\pi/2}^{\pi/2}\ln(1+a^{2^n})^2d\theta=\pi\ln(1+a^{2^n})$ 또는 $2\ln(1+a^{2^n})$'
    detect_cue: 계수 2(로그의 지수) 또는 구간 길이 $\pi$ 중 하나가 빠졌다
    feedback: $\ln(1\pm a^{2^n})^2=2\ln(1\pm a^{2^n})$이고, 상수를 길이 $\pi$인 구간에서 적분하면 $\pi$배가 됩니다.
    remedy: [RL-4]

- id: '5'
  stem: |
    수열의 극한의 대소관계를 이용하여 다음 정적분을 계산하시오.
    $$\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1+2a\sin\theta)\,d\theta$$
  points: 5
  depends_on: ['3', '4']
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S5-A
    audience: A
    method_no: 1
    key_idea: (3)과 (4)를 합치면 적분값이 $\frac{2\pi\ln(1\pm a^{2^n})}{2^n}$ 사이에 있고 양쪽이 모두 0으로 수렴한다.
    steps:
    - {id: 5a, content: '$\dfrac{2\pi\ln(1-a^{2^n})}{2^n}\le I\le\dfrac{2\pi\ln(1+a^{2^n})}{2^n}\to0$이므로 $I=0$', criteria: [5.M1, 5.A1, 5.R1]}
    hint_ladder:
    - (3)의 오른쪽 적분을 (4)로 눌러 보자.
    - $n\to\infty$일 때 $a^{2^n}$은?
  - id: S5-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 pp.7-8 [풀이] 1-(5)
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        문항 (3)의 등식과 문항 (4)의 부등식으로부터 모든 자연수 $n$에 대하여
        $$\frac{2\pi\ln(1-a^{2^n})}{2^n}\le\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1+2a\sin\theta)\,d\theta\le\frac{2\pi\ln(1+a^{2^n})}{2^n}$$
      criteria: [5.M1]
    - id: 5b-2
      content: |
        $-1<a<1$이므로 $\lim_{n\to\infty}a^{2^n}=0$이고 로그함수는 연속이므로 $\lim_{n\to\infty}\ln(1\pm a^{2^n})=\ln1=0$, 또 $\lim_{n\to\infty}\frac{2\pi}{2^n}=0$이다. 따라서 $\displaystyle\lim_{n\to\infty}\frac{2\pi\ln(1+a^{2^n})}{2^n}=0$, $\displaystyle\lim_{n\to\infty}\frac{2\pi\ln(1-a^{2^n})}{2^n}=0$.
      criteria: [5.A1]
    - id: 5b-3
      content: |
        수열의 극한의 대소 관계(샌드위치 정리)에 의하여 $\displaystyle\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1+2a\sin\theta)\,d\theta=0$이다.
      criteria: [5.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 5.M1
      mark_type: M
      points: 2
      evidence: |
        (3)과 (4)를 결합해 $\frac{2\pi\ln(1-a^{2^n})}{2^n}\le\int\ln(a^2+1+2a\sin\theta)d\theta\le\frac{2\pi\ln(1+a^{2^n})}{2^n}$을 적었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [3.A1, 4.A1], max_points: 2}
      steps: [5b-1]
    - id: 5.A1
      mark_type: A
      points: 2
      evidence: |
        양쪽 수열의 극한이 모두 0임을 구했다.
      depends_on: [5.M1]
      steps: [5b-2]
    - id: 5.R1
      mark_type: R
      points: 1
      evidence: |
        샌드위치 정리(극한의 대소 관계)에 의하여 적분값이 $0$이라고 결론지었다.
      depends_on: [5.A1]
      implied_ok: false
      cao: true
      steps: [5b-3]
    deductions: []
