intent: |
  주어진 적분을 삼각함수의 덧셈정리와 로그함수의 기본 성질을 활용하고 치환적분하여 다루기 쉬운 형태로 변형하는 능력과, 수학적 귀납법을 사용하여 적분값을 추론하는 능력을 평가한다(공식 출제의도 요지). 수열의 극한의 대소 관계로 적분값이 0임을 이끈다.
key_idea: |
  $I(a)=\int_{-\pi/2}^{\pi/2}\ln(a^2+1+2a\sin\theta)\,d\theta$에 대해 $2I(a)=I(a^2)$이므로 $I(a)=\dfrac{1}{2^n}I(a^{2^n})$이고, $I(a^{2^n})$은 $2\pi\ln(1\pm a^{2^n})$ 사이에 있어 $2^n$으로 나누면 0으로 수렴한다.
stuck: |
  $(a^2+1+2a\sin\theta)(a^2+1-2a\sin\theta)=a^4+1+2a^2\cos2\theta$로 묶은 뒤, $2\theta=t$ 치환으로 생긴 구간 $[-\pi,\pi]$를 둘로 나눠 $t\pm\frac{\pi}{2}$ 평행이동으로 다시 $[-\frac{\pi}{2},\frac{\pi}{2}]$의 사인 꼴로 되돌리는 단계
idea_tags: [IDEA-FUNCTIONAL-EQ-DOUBLING, IDEA-INDUCTION-ITERATE, IDEA-SQUEEZE-LIMIT]
tags: [로그 삼각 적분, 치환적분, 수학적 귀납법, 샌드위치 정리]
elements:
  materials:
  - '정적분 $\int_{-\pi/2}^{\pi/2}\ln(a^2+1+2a\sin\theta)\,d\theta$ $(-1<a<1)$'
  - '$a$를 $a^{2^n}$으로 바꾼 적분열 $\int_{-\pi/2}^{\pi/2}\ln(a^{2^{n+1}}+1+2a^{2^n}\sin\theta)\,d\theta$'
  concepts:
  - '치환적분법(적분 구간 변환)'
  - '로그의 성질 $\ln A+\ln B=\ln AB$'
  - '배각 공식 $1-2\sin^2\theta=\cos2\theta$'
  - '삼각함수의 성질 $\cos(x-\frac{\pi}{2})=\sin x$, $\cos(y+\frac{\pi}{2})=-\sin y$'
  - '수학적 귀납법'
  - '로그함수의 증가성과 정적분의 대소'
  - '등비수열의 극한, 수열의 극한의 대소 관계'
  tools:
  - '치환 $\theta=-t$, $2\theta=t$, $x=t+\frac{\pi}{2}$, $y=t-\frac{\pi}{2}$'
  - '적분 구간 분할 $\int_{-\pi}^{\pi}=\int_{-\pi}^{0}+\int_0^{\pi}$'
  - '$\beta=a^{2^k}$로 두고 문항 (2)를 $\beta$에 적용'
  - '$(1-a^{2^n})^2\le a^{2^{n+1}}+1+2a^{2^n}\sin\theta\le(1+a^{2^n})^2$'
  - '샌드위치 정리(수열의 극한의 대소 관계)'
  conditions:
  - '$-1<a<1$이므로 $0\le a^{2^n}<1$, 로그의 진수가 양수'
  - '$-1\le\sin\theta\le1$'
  - '$\lim_{n\to\infty}a^{2^n}=0$'
  stimuli_used: []
  subpart_links: '(2)는 (1)의 등식, (3)은 (2)를 $\beta=a^{2^k}$에 반복 적용, (5)는 (3)과 (4)를 결합'

