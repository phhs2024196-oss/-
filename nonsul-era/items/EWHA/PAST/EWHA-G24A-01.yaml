stimuli: []

stem: |
  실수 $a$가 $-1<a<1$일 때 다음 물음에 답하시오. [40점]

subparts:
- id: '1'
  stem: |
    다음 등식이 성립함을 보이시오.
    $$\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1-2a\sin\theta)\,d\theta=\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1+2a\sin\theta)\,d\theta$$
  points: 5
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\theta=-t$로 치환하면 $\sin\theta=-\sin t$이고 구간이 뒤집혀 $-1$과 상쇄된다.
    steps:
    - {id: 1a, content: '$\theta=-t$: $\int_{-\pi/2}^{\pi/2}\ln(a^2+1-2a\sin\theta)d\theta=\int_{\pi/2}^{-\pi/2}\ln(a^2+1+2a\sin t)(-1)dt$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $\sin(-t)=-\sin t$를 이용할 수 있는 치환은?
  - id: S1-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 p.5 [풀이] 1-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\theta=-t$로 치환하면 $d\theta=-dt$, $t$는 $\frac{\pi}{2}$에서 $-\frac{\pi}{2}$까지 변하고 $\sin\theta=\sin(-t)=-\sin t$이므로
        $$\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1-2a\sin\theta)\,d\theta=\int_{\frac{\pi}{2}}^{-\frac{\pi}{2}}\ln(a^2+1+2a\sin t)(-1)\,dt$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        적분 구간을 뒤집으면 $(-1)$이 상쇄되어 $\displaystyle\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1+2a\sin t)\,dt$가 되고, 이는 오른쪽 적분과 같다. ■
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\theta=-t$로 치환하여 $\displaystyle\int_{\frac{\pi}{2}}^{-\frac{\pi}{2}}\ln(a^2+1+2a\sin t)(-1)\,dt$ 꼴을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        구간을 뒤집어 $\displaystyle\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1+2a\sin t)\,dt$와 같음을 보였다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9250}
  misconceptions:
  - id: MC-CAL-9250
    outcome_code: '71'
    wrong_work: '$\theta=-t$로 바꾸고 구간을 그대로 $[-\frac{\pi}{2},\frac{\pi}{2}]$로 둔 채 $dt$ 앞의 $-1$도 생략'
    detect_cue: 치환 뒤 적분 구간과 $d\theta=-dt$가 함께 처리되지 않았다(우연히 상쇄된 결과만 적음)
    feedback: 치환하면 구간이 $\frac{\pi}{2}\to-\frac{\pi}{2}$로 뒤집히고 $d\theta=-dt$가 생깁니다. 두 부호가 상쇄됨을 식으로 보이세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    치환적분을 적용하여 문항 (1)로부터 다음 등식을 유도하시오.
    $$2\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1+2a\sin\theta)\,d\theta=\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^4+1+2a^2\sin\theta)\,d\theta$$
  points: 15
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (1)로 두 적분을 더해 로그를 묶으면 $a^4+1+2a^2\cos2\theta$가 되고, $2\theta=t$ 후 $[-\pi,0]$, $[0,\pi]$를 각각 $\pm\frac{\pi}{2}$ 평행이동하면 다시 사인 꼴이 된다.
    steps:
    - {id: 2a, content: '$2I=\int\ln\{(a^2+1)^2-4a^2\sin^2\theta\}d\theta=\int\ln(a^4+1+2a^2\cos2\theta)d\theta=\tfrac12\int_{-\pi}^{\pi}\ln(a^4+1+2a^2\cos t)dt$', criteria: [2.R1, 2.M1, 2.M2]}
    hint_ladder:
    - (1)의 두 적분을 더해 보자. 로그 두 개를 하나로 묶으면?
    - $1-2\sin^2\theta$는 무엇인가?
    - 구간 $[-\pi,\pi]$를 반으로 나누고 각각 $\frac{\pi}{2}$만큼 옮기면 코사인이 사인이 된다.
  - id: S2-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 pp.5-6 [풀이] 1-(2), 채점 기준 pp.3-4
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문항 (1)에 의하여
        $$2\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1+2a\sin\theta)\,d\theta=\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1+2a\sin\theta)\,d\theta+\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1-2a\sin\theta)\,d\theta$$
      criteria: [2.R1]
    - id: 2b-2
      content: |
        $\ln A+\ln B=\ln AB$와 $1-2\sin^2\theta=\cos2\theta$를 이용하면
        $$(\text{위 식})=\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln\{a^4+1+2a^2(1-2\sin^2\theta)\}\,d\theta=\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^4+1+2a^2\cos2\theta)\,d\theta$$
      criteria: [2.M1]
    - id: 2b-3
      content: |
        $2\theta=t$로 치환하면 $\displaystyle\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^4+1+2a^2\cos2\theta)\,d\theta=\frac12\int_{-\pi}^{\pi}\ln(a^4+1+2a^2\cos t)\,dt$이고, 이 적분을 $\displaystyle\int_{-\pi}^{0}+\int_{0}^{\pi}$로 나눈다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        $x=t+\frac{\pi}{2}$로 치환하면 $\cos t=\cos(x-\frac{\pi}{2})=\sin x$이므로 $\displaystyle\int_{-\pi}^{0}\ln(a^4+1+2a^2\cos t)\,dt=\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^4+1+2a^2\sin x)\,dx$.
        $y=t-\frac{\pi}{2}$로 치환하면 $\cos t=\cos(y+\frac{\pi}{2})=-\sin y$이므로 $\displaystyle\int_{0}^{\pi}\ln(a^4+1+2a^2\cos t)\,dt=\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^4+1-2a^2\sin y)\,dy$.
      criteria: [2.M3]
    - id: 2b-5
      content: |
        문항 (1)을 $a^2$($-1<a^2<1$)에 적용하면(또는 $\theta=-y$로 치환하면) $\displaystyle\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^4+1-2a^2\sin y)\,dy=\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^4+1+2a^2\sin\theta)\,d\theta$이다. 따라서
        $$2\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1+2a\sin\theta)\,d\theta=\frac12\cdot2\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^4+1+2a^2\sin\theta)\,d\theta=\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^4+1+2a^2\sin\theta)\,d\theta \quad■$$
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        문항 (1)을 근거로 $2\int\ln(a^2+1+2a\sin\theta)d\theta$를 $+$ 적분과 $-$ 적분의 합으로 썼다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        로그를 묶고 $1-2\sin^2\theta=\cos2\theta$를 써서 $\int\ln(a^4+1+2a^2\cos2\theta)d\theta$를 얻었다.
      depends_on: [2.R1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $2\theta=t$로 치환하여 $\frac12\int_{-\pi}^{\pi}\ln(a^4+1+2a^2\cos t)dt$를 얻고 $\int_{-\pi}^{0}+\int_0^{\pi}$로 나누었다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.M3
      mark_type: M
      points: 3
      evidence: |
        $x=t+\frac{\pi}{2}$, $y=t-\frac{\pi}{2}$ 치환으로 두 적분을 각각 $\int_{-\pi/2}^{\pi/2}\ln(a^4+1+2a^2\sin x)dx$, $\int_{-\pi/2}^{\pi/2}\ln(a^4+1-2a^2\sin y)dy$로 바꾸었다.
      depends_on: [2.M2]
      implied_ok: false
      steps: [2b-4]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        문항 (1)(또는 $\theta=-y$ 치환)으로 $-$ 적분을 $+$ 적분으로 바꾸고 계수 $\frac12\cdot2=1$까지 정리해 주어진 등식을 완성했다.
      depends_on: [2.M3]
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9251}
  - {code: '72', misconception: MC-CAL-9252}
  misconceptions:
  - id: MC-CAL-9251
    outcome_code: '71'
    wrong_work: '$\int_{-\pi/2}^{\pi/2}\ln(a^4+1+2a^2\cos2\theta)d\theta=\int_{-\pi}^{\pi}\ln(a^4+1+2a^2\cos t)dt$'
    detect_cue: $2\theta=t$ 치환 뒤 $\frac12$이 없어 최종 식의 계수가 2배로 나온다
    feedback: $d\theta=\frac12dt$입니다. 계수 $\frac12$이 마지막에 두 적분의 합 2와 상쇄되어 등식이 완성됩니다.
    remedy: [RL-2]
  - id: MC-CAL-9252
    outcome_code: '72'
    wrong_work: '$\frac12\int_{-\pi}^{\pi}\ln(a^4+1+2a^2\cos t)dt$에서 멈추거나, 코사인을 그대로 둔 채 구간만 $[-\frac{\pi}{2},\frac{\pi}{2}]$로 바꿈'
    detect_cue: 구간 분할과 $t\pm\frac{\pi}{2}$ 평행이동 치환이 없다
    feedback: $[-\pi,0]$과 $[0,\pi]$를 각각 $\frac{\pi}{2}$만큼 옮기면 $\cos$가 $\pm\sin$이 되어 원래 구간으로 돌아옵니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    문항 (2)로부터 다음 등식이 모든 자연수 $n$에 대하여 성립함을 수학적 귀납법을 이용하여 보이시오.
    $$\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1+2a\sin\theta)\,d\theta=\frac{1}{2^n}\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^{2^{n+1}}+1+2a^{2^n}\sin\theta)\,d\theta$$
  points: 10
  depends_on: ['2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $n=1$은 (2) 자체이고, $\beta=a^{2^k}$($0\le\beta<1$)에 (2)를 적용하면 $n=k\Rightarrow n=k+1$이다.
    steps:
    - {id: 3a, content: '$\int\ln(\beta^2+1+2\beta\sin\theta)d\theta=\tfrac12\int\ln(\beta^4+1+2\beta^2\sin\theta)d\theta$, $\beta^2=a^{2^{k+1}}$, $\beta^4=a^{2^{k+2}}$', criteria: [3.M1, 3.A1]}
    hint_ladder:
    - (2)는 어떤 $-1<a<1$에 대해서도 성립한다. $a$ 자리에 무엇을 넣을까?
  - id: S3-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 pp.6-7 [풀이] 1-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $n=1$일 때 주어진 등식은 $\displaystyle\int\ln(a^2+1+2a\sin\theta)d\theta=\frac12\int\ln(a^4+1+2a^2\sin\theta)d\theta$이고, 문항 (2)에 의하여 성립한다.
      criteria: [3.B1]
    - id: 3b-2
      content: |
        $n=k$일 때 $\displaystyle\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^2+1+2a\sin\theta)d\theta=\frac{1}{2^k}\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^{2^{k+1}}+1+2a^{2^k}\sin\theta)d\theta$가 성립한다고 가정한다. $\beta=a^{2^k}$라 하면 $0\le\beta<1$이고 $a^{2^{k+1}}=(a^{2^k})^2=\beta^2$, $a^{2^{k+2}}=(a^{2^{k+1}})^2=\beta^4$이다.
      criteria: [3.R1]
    - id: 3b-3
      content: |
        $-1<\beta<1$이므로 문항 (2)를 $\beta$에 적용하면
        $$\frac{1}{2^k}\int\ln(\beta^2+1+2\beta\sin\theta)d\theta=\frac{1}{2^k}\cdot\frac12\int\ln(\beta^4+1+2\beta^2\sin\theta)d\theta=\frac{1}{2^{k+1}}\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\ln(a^{2^{k+2}}+1+2a^{2^{k+1}}\sin\theta)d\theta$$
      criteria: [3.M1]
    - id: 3b-4
      content: |
        따라서 $n=k+1$일 때도 성립하고, 수학적 귀납법에 의하여 주어진 등식은 모든 자연수 $n$에 대하여 성립한다. ■
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        $n=1$일 때 문항 (2)에 의하여 등식이 성립함을 언급했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        $n=k$일 때 성립을 가정하고 $0\le a^{2^{k}}<1$(또는 $0\le a^{2^{k+1}}<1$), $a^{2^{k+1}}=(a^{2^k})^2$, $a^{2^{k+2}}=(a^{2^{k+1}})^2$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        가정과 문항 (2)를 $a^{2^k}$에 적용하여 $\frac{1}{2^{k+1}}\int\ln(a^{2^{k+2}}+1+2a^{2^{k+1}}\sin\theta)d\theta$를 유도했다.
      depends_on: [3.R1]
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 3}
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        수학적 귀납법에 의하여 모든 자연수 $n$에 대하여 성립한다고 결론을 적었다.
      depends_on: [3.M1]
      steps: [3b-4]
