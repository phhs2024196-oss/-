  - '도함수의 부호와 증가·감소, 극대·극소'
  - '함수의 그래프의 개형과 점근선($x\to-\infty$에서 $f\to0$)'
  - '방정식의 실근의 개수와 그래프의 교점'
  tools:
  - '$f^\prime(x)=x(x+2)e^x$의 부호표'
  - '$\tfrac94<2.7<e$로 $9e^{-3}<4e^{-2}$ 비교'
  - '직선 $y=k$와의 교점 개수에 따른 세 경우 분류'
  conditions:
  - '$2.7<e$ (문제의 단서)'
  - '$k>0$, 실근이 모두 정수'
  - '$f(x)\ge0$ 이고 $x>0$에서 증가'
  stimuli_used: []
