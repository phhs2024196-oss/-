stimuli: []

stem: |
  함수 $f(x)=x^2e^x$에 대하여 다음 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    함수 $f(x)$의 극댓값 $M$과 극솟값 $m$을 구하시오.
  points: 4
  depends_on: []
  answer: {kind: value, value: 'M=4*exp(-2); m=0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f^\prime(x)=x(x+2)e^x$의 부호가 $+,-,+$로 바뀐다.
    steps:
    - {id: 1a, content: '$M=f(-2)=4e^{-2}$, $m=f(0)=0$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 곱의 미분법으로 $f^\prime(x)$를 인수분해해 보자.
  - id: S1-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 p.11 [풀이] 2-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f^\prime(x)=2xe^x+x^2e^x=x(x+2)e^x$이므로 $f^\prime(x)=0$의 근은 $x=-2$, $x=0$이다. $(-\infty,-2)$에서 $f^\prime(x)>0$(증가), $(-2,0)$에서 $f^\prime(x)<0$(감소), $(0,\infty)$에서 $f^\prime(x)>0$(증가)이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 $x=-2$에서 극댓값 $M=f(-2)=4e^{-2}$, $x=0$에서 극솟값 $m=f(0)=0$을 갖는다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $f^\prime(x)=2xe^x+x^2e^x$를 구하고 근 $x=-2,0$과 구간별 증가·감소를 설명했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        극댓값 $M=4e^{-2}$, 극솟값 $m=0$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9256}
  misconceptions:
  - id: MC-CAL-9256
    outcome_code: '71'
    wrong_work: '$f^\prime(x)=2xe^x$로 두어 임계점을 $x=0$ 하나로 판단'
    detect_cue: 극댓값 $4e^{-2}$가 없고 $x=-2$가 언급되지 않는다
    feedback: $(x^2e^x)^\prime=2xe^x+x^2e^x$입니다. 곱의 미분법의 두 항을 모두 쓰세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $-3\le a\le2$인 정수 $a$에 대하여 함숫값 $f(a)$를 크기순으로 나열하시오. (단, $2.7<e$)
  points: 4
  depends_on: ['1']
  answer: {kind: value, value: 'f(0)<f(-1)<f(-3)<f(-2)<f(1)<f(2)', equivalents: ['0<exp(-1)<9*exp(-3)<4*exp(-2)<E<4*exp(2)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 여섯 값을 구하고, 까다로운 비교 $9e^{-3}<4e^{-2}$는 $\tfrac94<e$로 처리한다.
    steps:
    - {id: 2a, content: '$0<e^{-1}<9e^{-3}<4e^{-2}<e<4e^2$', criteria: [2.B1, 2.R1, 2.A1]}
    hint_ladder:
    - $9e^{-3}$과 $4e^{-2}$의 비는?
  - id: S2-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 p.11 [풀이] 2-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(-3)=9e^{-3}$, $f(-2)=4e^{-2}$, $f(-1)=e^{-1}$, $f(0)=0$, $f(1)=e$, $f(2)=4e^2$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $2<e<3$이므로 $0<e<4e^2$이고 $0<e^{-1}<4e^{-2}<e$이며, $\dfrac94<2.7<e$이므로 $e^{-1}<9e^{-3}<4e^{-2}$이다.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        따라서 $0<e^{-1}<9e^{-3}<4e^{-2}<e<4e^2$, 즉 $f(0)<f(-1)<f(-3)<f(-2)<f(1)<f(2)$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 1
      evidence: |
        여섯 함숫값 $9e^{-3},4e^{-2},e^{-1},0,e,4e^2$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        $9e^{-3}<4e^{-2}$를 $\tfrac94<2.7<e$ 또는 극댓값을 이용해 논리적으로 설명했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        $0<e^{-1}<9e^{-3}<4e^{-2}<e<4e^2$의 대소관계를 올바르게 적었다.
      depends_on: [2.B1, 2.R1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-9257}
  misconceptions:
  - id: MC-CAL-9257
    outcome_code: '72'
    wrong_work: '계수 $9>4$만 보고 $f(-3)>f(-2)$로 나열'
    detect_cue: $f(-3)$이 $f(-2)$보다 뒤(크다)에 놓였거나 $e$의 범위를 쓰지 않았다
    feedback: $\dfrac{9e^{-3}}{4e^{-2}}=\dfrac{9}{4e}$이고 $\tfrac94<2.7<e$이므로 이 비는 1보다 작습니다. $f(-2)$는 극댓값이라는 것도 근거가 됩니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    부등식 $m\le f(b)\le M$을 만족시키는 정수 $b$를 모두 구하시오.
  points: 6
  depends_on: ['1', '2']
  answer: {kind: set, value: 'b<=0', equivalents: ['all integers b <= 0'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $x\le0$에서 $0\le f\le4e^{-2}$이고, $x>0$에서는 $f(1)=e>4e^{-2}$이고 증가하므로 양의 정수는 불가능하다.
    steps:
    - {id: 3a, content: '$b\le0$인 모든 정수', criteria: [3.R1, 3.R2, 3.A1]}
    hint_ladder:
    - $x\le0$에서 $f$의 최댓값·최솟값은?
  - id: S3-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 p.12 [풀이] 2-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $x>0$일 때 $f(x)$는 증가이고 문항 (2)에 따라 $f(1)=e>4e^{-2}=M$이므로 $0\le f(b)\le4e^{-2}$를 만족하는 양의 정수 $b$는 존재하지 않는다.
      criteria: [3.R1]
    - id: 3b-2
      content: |
        $x\le0$일 때 $f(x)\ge0$이고 $f$는 $(-\infty,-2)$에서 증가, $(-2,0)$에서 감소하므로 $x\le0$에서 $x=-2$에서 극대이면서 최대, $x=0$에서 최소이다. 따라서 $b\le0$인 모든 정수는 $0\le f(b)\le4e^{-2}$를 만족한다.
      criteria: [3.R2]
    - id: 3b-3
      content: |
        구하는 정수 $b$는 $b\le0$인 모든 정수이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.R1
      mark_type: R
      points: 2
      evidence: |
        $x>0$에서 $f$가 증가이고 $e>4e^{-2}$임을 적어 양의 정수 $b$가 없음을 설명했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 2.A1], max_points: 2}
      steps: [3b-1]
    - id: 3.R2
      mark_type: R
      points: 3
      evidence: |
        $x\le0$에서의 최댓값($4e^{-2}$)과 최솟값($0$)을 기술했다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 1
      evidence: |
        구하는 정수는 $b\le0$인 모든 정수라고 답했다.
      depends_on: [3.R1, 3.R2]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-CAL-9258}
  misconceptions:
  - id: MC-CAL-9258
    outcome_code: '73'
    wrong_work: '$b=-3,-2,-1,0$만 답함(주어진 범위 $-3\le a\le2$에 갇힘)'
    detect_cue: 답이 유한 개 정수이다
    feedback: $x\to-\infty$에서 $f(x)\to0^+$이므로 $x\le0$ 전체에서 $0\le f\le4e^{-2}$입니다. 음의 정수는 모두 조건을 만족합니다.
    remedy: [RL-3]

- id: '4'
  stem: |
    방정식 $f(x)=k$의 실근이 모두 정수인 양의 실수 $k$의 최솟값을 구하시오.
  points: 16
  depends_on: ['1', '2']
  answer: {kind: value, value: 'E', equivalents: ['f(1)'], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $0<k\le4e^{-2}$이면 양의 근이 $(0,1)$에 있어 정수가 아니다. 따라서 $k>4e^{-2}$에서 양의 근이 $1$이 되는 $k=e$가 최소.
    steps:
    - {id: 4a, content: '$k_{\min}=f(1)=e$', criteria: [4.M1, 4.R1, 4.R2, 4.R3, 4.A1]}
    hint_ladder:
    - $y=k$와 $y=f(x)$의 교점 개수는 $k$와 $4e^{-2}$의 대소에 따라 어떻게 달라지는가?
    - 양의 근이 정수가 되려면 $k$는 적어도 얼마여야 하는가?
  - id: S4-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 p.12 [풀이] 2-(4)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $k>0$에 대하여 $f(x)=k$는 $0<k<M=4e^{-2}$일 때 서로 다른 세 실근, $k=4e^{-2}$일 때 서로 다른 두 실근, $k>4e^{-2}$일 때 한 개의 실근을 갖는다.
      criteria: [4.M1]
    - id: 4b-2
      content: |
        (ㄱ) $0<k<4e^{-2}$일 때 세 근이 모두 정수이려면 $f$가 감소하는 구간 $-2<x<0$의 근은 $x=-1$이어야 하므로 $k=e^{-1}=f(-1)$이다. 이때 다른 두 근 중 하나인 양수 $\alpha$가 정수여야 하는데, 문항 (2)에 따라 $f(0)=0<e^{-1}(=f(\alpha))<e=f(1)$이므로 $0<\alpha<1$, 즉 $\alpha$는 정수가 아니다. 따라서 조건을 만족하는 $k$는 없다.
      criteria: [4.R1]
    - id: 4b-3
      content: |
        (ㄴ) $k=4e^{-2}$일 때 근은 $x=-2$와 양의 실수 $\beta$이다. 문항 (2)에 따라 $f(0)=0<4e^{-2}(=f(\beta))<e=f(1)$이므로 $\beta$는 정수가 아니다. 따라서 $k=4e^{-2}$는 조건을 만족하지 않는다.
      criteria: [4.R2]
    - id: 4b-4
      content: |
        (ㄷ) $k>4e^{-2}$일 때 $f(x)=k$는 한 개의 양의 실근을 갖는다. $x>0$에서 $f$는 증가하고 $f(1)=e>4e^{-2}$이므로, 근이 양의 정수가 되는 가장 작은 $k$는 $x=1$일 때의 $f(1)=e$이다.
      criteria: [4.R3, 4.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: |
        $0<k<4e^{-2}$(세 실근), $k=4e^{-2}$(두 실근), $k>4e^{-2}$(한 실근)의 세 경우를 언급했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [4b-1]
    - id: 4.R1
      mark_type: R
      points: 5
      evidence: |
        ① $0<k<4e^{-2}$: $(-2,0)$의 근이 $x=-1$이어야 함, 양의 근 $\alpha$에 대해 $f(0)=0<e^{-1}<e=f(1)$을 언급하여 $\alpha$가 정수가 아니므로 조건을 만족하는 $k$가 없다고 결론지었다.
      depends_on: [4.M1]
      implied_ok: false
      steps: [4b-2]
    - id: 4.R2
      mark_type: R
      points: 4
      evidence: |
