intent: |
  도함수로 함수 $f(x)=x^2e^x$의 증가·감소와 극값을 판정하고, 무리수 $e$의 근삿값으로 정수에서의 함숫값과 극값의 대소 관계를 결정하며, 직선 $y=k$와의 교점 개수를 세 경우로 나누어 정수근의 존재 여부를 추론하는 능력을 평가한다(공식 출제의도 요지).
key_idea: |
  $f$는 $x=-2$에서 극대 $4e^{-2}$, $x=0$에서 극소 $0$이고 $f(0)<f(-1)<f(-3)<f(-2)<f(1)<f(2)$이다. $0<k\le4e^{-2}$이면 양의 근이 $(0,1)$에 있어 정수가 아니므로, 양의 근 하나뿐인 $k>4e^{-2}$에서 $x=1$이 근인 $k=e$가 최소이다.
stuck: |
  $f(x)=k$의 근이 모두 정수이려면 $(-2,0)$의 근은 $-1$뿐이어야 하고, 그때 양의 근이 $f(0)<k<f(1)$ 때문에 $(0,1)$에 갇힌다는 점
idea_tags: [IDEA-ROOT-COUNT-HORIZONTAL-LINE, IDEA-E-BOUND-COMPARE]
tags: [극값, 근의 개수, 정수근, e의 근삿값]
