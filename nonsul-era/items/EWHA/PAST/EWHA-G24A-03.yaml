stimuli: []

stem: |
  좌표평면의 원 $x^2+y^2=16$ 위의 두 점 $\mathrm{A}(\sqrt6+\sqrt2,\,\sqrt6-\sqrt2)$, $\mathrm{B}(\sqrt6-\sqrt2,\,\sqrt6+\sqrt2)$에 대하여 다음 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    두 점 $\mathrm{A}$, $\mathrm{B}$를 지나는 직선의 방정식을 구하시오.
  points: 4
  depends_on: []
  answer: {kind: expression, value: 'y = -x + 2*sqrt(6)', equivalents: ['x + y - 2*sqrt(6) = 0'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 기울기 $\dfrac{2\sqrt2}{-2\sqrt2}=-1$ (또는 A, B가 $y=x$에 대칭).
    steps:
    - {id: 1a, content: '$y=-x+2\sqrt6$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 두 점의 좌표를 비교하면 어떤 대칭이 보이는가?
  - id: S1-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 p.15 [풀이] 3-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        기울기는 $\dfrac{(\sqrt6+\sqrt2)-(\sqrt6-\sqrt2)}{(\sqrt6-\sqrt2)-(\sqrt6+\sqrt2)}=\dfrac{2\sqrt2}{-2\sqrt2}=-1$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        직선의 방정식은 $y=-1\cdot(x-\sqrt6-\sqrt2)+\sqrt6-\sqrt2=-x+2\sqrt6$이다.
      criteria: [1.A1]
  - id: S1-ALT
    audience: ALT
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 p.15 [별해] 3-(1)
    method_no: 2
    key_idea: A, B가 $y=x$에 대하여 대칭이므로 직선 AB는 $y=x$에 수직, 기울기 $-1$.
    steps:
    - id: 1c-1
      content: |
        A, B는 $y=x$에 대하여 대칭이므로 직선 AB는 $y=x$에 수직이고 기울기는 $-1$, 따라서 $y=-x+2\sqrt6$.
      criteria: [1.M1, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        기울기 공식(또는 $y=x$ 대칭)으로 기울기 $-1$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        직선의 방정식 $y=-x+2\sqrt6$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9263}
  misconceptions:
  - id: MC-GEO-9263
    outcome_code: '71'
    wrong_work: '분자는 A−B, 분모는 B−A로 빼서 기울기 $1$을 얻음'
    detect_cue: 기울기가 $1$이거나 직선이 B를 지나지 않는다
    feedback: 기울기는 같은 순서로 뺀 $\dfrac{y_2-y_1}{x_2-x_1}$입니다. 구한 직선에 두 점을 대입해 확인하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    호 $\mathrm{AB}$의 길이를 구하시오. (단, 호 $\mathrm{AB}$는 제1사분면에 있다.)
  points: 8
  depends_on: []
  answer: {kind: value, value: '4*pi/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\tan\alpha=2-\sqrt3$, $\tan\beta=2+\sqrt3$에서 중심각 $\beta-\alpha=\frac{\pi}{3}$.
    steps:
    - {id: 2a, content: '$\tan(\beta-\alpha)=\sqrt3\Rightarrow\beta-\alpha=\frac{\pi}{3}$, 호의 길이 $4\cdot\frac{\pi}{3}$', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - OA, OB가 $x$축과 이루는 각의 탄젠트를 구해 보자.
  - id: S2-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 pp.15-16 [풀이] 3-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        OA, OB가 $x$축과 이루는 각을 $\alpha,\beta$라 하면 $\tan\alpha=\dfrac{\sqrt6-\sqrt2}{\sqrt6+\sqrt2}=2-\sqrt3$, $\tan\beta=\dfrac{\sqrt6+\sqrt2}{\sqrt6-\sqrt2}=2+\sqrt3$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        탄젠트함수의 덧셈정리에 따라 $\tan(\beta-\alpha)=\dfrac{(2+\sqrt3)-(2-\sqrt3)}{1+(2+\sqrt3)(2-\sqrt3)}=\sqrt3$이므로 $\beta-\alpha=\dfrac{\pi}{3}$이다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        반지름이 4이므로 호의 길이는 $4\cdot\dfrac{\pi}{3}=\dfrac{4\pi}{3}$이다.
      criteria: [2.A1]
  - id: S2-ALT
    audience: ALT
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 p.16 [별해] 3-(2)
    method_no: 2
    key_idea: $\overline{\mathrm{AB}}=4=\overline{\mathrm{OA}}=\overline{\mathrm{OB}}$이므로 삼각형 AOB는 정삼각형, 중심각 $\frac{\pi}{3}$.
    steps:
    - id: 2c-1
      content: |
        $\overline{\mathrm{AB}}=\sqrt{(2\sqrt2)^2+(2\sqrt2)^2}=4$이고 $\overline{\mathrm{OA}}=\overline{\mathrm{OB}}=4$이므로 삼각형 AOB는 정삼각형, $\angle\mathrm{AOB}=\frac{\pi}{3}$, 호의 길이는 $\frac{4\pi}{3}$.
      criteria: [2.M1, 2.M2, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $\tan\alpha=2-\sqrt3$, $\tan\beta=2+\sqrt3$을 구했다(별해: $\overline{\mathrm{AB}}=4$).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        덧셈정리로 $\tan(\beta-\alpha)=\sqrt3$, 중심각 $\frac{\pi}{3}$을 구했다(별해: 정삼각형임을 설명하고 $\frac{\pi}{3}$).
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        호의 길이 $4\cdot\frac{\pi}{3}=\frac{4\pi}{3}$을 구했다.
      depends_on: [2.M2]
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-GEO-9260}
  misconceptions:
  - id: MC-GEO-9260
    outcome_code: '72'
    wrong_work: '중심각 $60^\circ$를 그대로 곱해 호의 길이 $240$ 또는 $\frac{1}{2}\cdot4\cdot\frac{\pi}{3}$'
    detect_cue: 답에 $\pi$가 없거나 $\frac{2\pi}{3}$이다
    feedback: 호의 길이는 호도법의 중심각 $\theta$에 대해 $r\theta$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    문항 (2)의 호 $\mathrm{AB}$와 선분 $\mathrm{AB}$로 둘러싸인 도형의 넓이를 구하시오.
  points: 7
  depends_on: ['2']
  answer: {kind: value, value: '8*pi/3 - 4*sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 활꼴 = 부채꼴 $-$ 삼각형 AOB.
    steps:
    - {id: 3a, content: '$\frac{8\pi}{3}-4\sqrt3$', criteria: [3.M1, 3.A1, 3.A2]}
    hint_ladder:
    - 부채꼴 AOB에서 무엇을 빼면 되는가?
  - id: S3-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 p.16 [풀이] 3-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        구하는 넓이는 부채꼴 AOB의 넓이에서 삼각형 AOB의 넓이를 뺀 것이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        중심각이 $\frac{\pi}{3}$이므로 부채꼴의 넓이는 $\frac12\cdot4^2\cdot\frac{\pi}{3}=\frac{8\pi}{3}$이다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        삼각형의 넓이는 $\frac12\cdot4^2\cdot\sin\frac{\pi}{3}=4\sqrt3$이므로 구하는 넓이는 $\frac{8\pi}{3}-4\sqrt3$이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        넓이가 부채꼴 AOB의 넓이에서 삼각형 AOB의 넓이를 뺀 것임을 설명했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        부채꼴의 넓이 $\frac{8\pi}{3}$을 구했다.
      depends_on: [3.M1]
      ft: {allowed: true, from: [2.M2], max_points: 2}
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: |
        삼각형의 넓이 $4\sqrt3$을 구하고 $\frac{8\pi}{3}-4\sqrt3$을 답했다.
      depends_on: [3.M1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-GEO-9261}
  misconceptions:
  - id: MC-GEO-9261
    outcome_code: '73'
    wrong_work: '넓이를 부채꼴 넓이 $\frac{8\pi}{3}$으로 답함'
    detect_cue: $4\sqrt3$을 빼는 단계가 없다
    feedback: 호와 현으로 둘러싸인 활꼴은 부채꼴에서 삼각형 AOB를 뺀 부분입니다.
    remedy: [RL-2]

- id: '4'
  stem: |
    좌표평면의 집합 $C=\{(\cos\theta-1,\sin\theta)\mid0\le\theta<2\pi\}$에 속하는 점 $\mathrm{P}(\cos\theta-1,\sin\theta)$에 대하여 문항 (2)의 호 $\mathrm{AB}$와 두 선분 $\mathrm{AP}$, $\mathrm{BP}$로 둘러싸인 도형의 넓이를 $S(\theta)$라 할 때, $S(\theta)$의 최댓값을 구하시오.
  points: 11
  depends_on: ['1', '3']
  answer: {kind: value, value: '8*pi/3 + sqrt(2) + 2', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $S=(\text{활꼴})+\triangle\mathrm{PAB}$, 높이 최대 $=\frac{1+2\sqrt6}{\sqrt2}+1$.
    steps:
    - {id: 4a, content: '$\max S=\frac{8\pi}{3}-4\sqrt3+\frac12\cdot4\left(\frac{\sqrt2}{2}+2\sqrt3+1\right)=\frac{8\pi}{3}+\sqrt2+2$', criteria: [4.R1, 4.M1, 4.A1, 4.A2, 4.A3]}
    hint_ladder:
    - 점 P의 자취는 무엇인가?
    - 넓이 중 변하는 부분은 어느 삼각형인가?
  - id: S4-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅰ_답안 pp.16-17 [풀이] 3-(4)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        집합 $C$의 점은 $(x+1)^2+y^2=\cos^2\theta+\sin^2\theta=1$로 나타나는 원 위의 점이다. $S(\theta)$는 (3)의 활꼴 넓이와 삼각형 PAB의 넓이의 합이므로, 이 원의 한 점과 문항 (1)의 직선 사이의 거리가 최대일 때 $S(\theta)$가 최대가 된다.
      criteria: [4.R1]
    - id: 4b-2
      content: |
        원의 중심 $(-1,0)$과 직선 $x+y-2\sqrt6=0$ 사이의 거리는 $\dfrac{\lvert-1+0-2\sqrt6\rvert}{\sqrt{1^2+1^2}}=\dfrac{\sqrt2}{2}+2\sqrt3$이다.
      criteria: [4.M1]
    - id: 4b-3
      content: |
        여기에 반지름 1을 더하면 최대 거리는 $\dfrac{\sqrt2}{2}+2\sqrt3+1$이다.
      criteria: [4.A1]
    - id: 4b-4
      content: |
        $\overline{\mathrm{AB}}=4$이므로 $S(\theta)$가 최대일 때 삼각형 PAB의 넓이는 $\frac12\cdot4\cdot\left(\frac{\sqrt2}{2}+2\sqrt3+1\right)=\sqrt2+4\sqrt3+2$이다.
      criteria: [4.A2]
    - id: 4b-5
      content: |
        (3)의 넓이 $\frac{8\pi}{3}-4\sqrt3$을 더하면 최댓값은 $\dfrac{8\pi}{3}+\sqrt2+2$이다.
      criteria: [4.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.R1
      mark_type: R
      points: 3
      evidence: |
        $C$가 원 $(x+1)^2+y^2=1$이고, 원 위의 점과 직선 AB 사이 거리가 최대일 때 넓이가 최대임을 설명했다.
      depends_on: []
      implied_ok: false
      steps: [4b-1]
    - id: 4.M1
      mark_type: M
