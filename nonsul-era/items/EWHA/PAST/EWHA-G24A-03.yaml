  - '원 위의 점에서 직선까지 최대 거리 = 중심까지 거리 + 반지름'
  conditions:
  - '호 $\mathrm{AB}$는 제1사분면에 있다'
  - '$\cos^2\theta+\sin^2\theta=1$이므로 $C$는 중심 $(-1,0)$, 반지름 1인 원'
  - '원 $C$는 직선 $\mathrm{AB}$에 대해 호의 반대쪽에 있다'
