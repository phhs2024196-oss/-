  - '제1사분면의 호 $\mathrm{AB}$'
  - '집합 $C=\{(\cos\theta-1,\sin\theta)\mid0\le\theta<2\pi\}$ 위의 점 $\mathrm{P}$'
  concepts:
  - '두 점을 지나는 직선의 방정식'
  - '탄젠트의 덧셈정리'
  - '호의 길이 $r\theta$, 부채꼴의 넓이 $\tfrac12r^2\theta$'
  - '삼각형의 넓이 $\tfrac12ab\sin C$'
  - '원의 방정식, 점과 직선 사이의 거리'
  tools:
  - '$\tan(\beta-\alpha)=\dfrac{\tan\beta-\tan\alpha}{1+\tan\beta\tan\alpha}$'
