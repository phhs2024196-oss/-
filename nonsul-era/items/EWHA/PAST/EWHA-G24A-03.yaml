intent: |
  원 위의 두 점을 지나는 직선, 호의 길이, 활꼴의 넓이를 구하고, 원 위의 점에 관한 조건으로 정의된 넓이 함수의 최댓값을 점과 직선 사이의 거리(원의 접선) 문제로 해석해 구하는 종합적 수리 능력을 평가한다(공식 출제의도 요지).
key_idea: |
  $S(\theta)=(\text{활꼴})+\triangle\mathrm{PAB}$이고 활꼴은 고정이므로, 원 $(x+1)^2+y^2=1$ 위의 점 $\mathrm{P}$와 직선 $\mathrm{AB}$ 사이 거리의 최댓값(중심까지 거리 $+$ 반지름)으로 삼각형 넓이를 최대화한다.
stuck: |
  집합 $C$가 원 $(x+1)^2+y^2=1$임을 알아보고, 넓이 최대를 직선 $\mathrm{AB}$까지의 거리 최대로 바꾸는 것
