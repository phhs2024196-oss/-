  - 부등식 $a^2e^a<4e^{-2}<(a+1)^2e^{a+1}$, $b^2e^b<e^{-1}<(b+1)^2e^{b+1}$
  - 방정식 $f(x)=k$ $(k>0)$
  concepts:
  - 곱의 미분법, 지수함수의 미분
  - 도함수의 부호와 증가·감소, 극대·극소
  - 함수의 그래프의 개형과 점근선($x\to-\infty$에서 $f\to0$)
  - 방정식의 실근의 개수와 그래프의 교점
  tools:
  - $f^\prime(x)=x(x+2)e^x$의 부호표
  - $16<2.7^3<e^3$으로 $16e^{-4}<e^{-1}<9e^{-3}$ 비교
  - 직선 $y=k$와의 교점 개수에 따른 세 경우 분류
  conditions:
  - $2.7<e$ (문제의 단서)
  - $k>0$, 실근이 모두 정수
  - $f(x)\ge0$ 이고 $x>0$에서 증가
