- id: '2'
  stem: |
    부등식 $a^2e^a<4e^{-2}<(a+1)^2e^{a+1}$과 $b^2e^b<e^{-1}<(b+1)^2e^{b+1}$을 만족시키는 정수 $a$, $b$를 모두 구하시오. (단, $2.7<e$)
  points: 9
  depends_on:
  - '1'
  answer:
    kind: set
    value: a=[0]; b=[-4, 0]
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 부등식은 $f(a)<c<f(a+1)$, 즉 직선 $y=c$와 그래프의 교점이 증가 구간에서 $(a,a+1)$ 안에 있다는 뜻이다.
    steps:
    - id: 2a
      content: $a=0$; $b=-4,\ 0$
      criteria:
      - 2.M1
      - 2.R1
      - 2.A1
      - 2.R2
      - 2.A2
    hint_ladder:
    - $f(a)<c<f(a+1)$은 $f$가 $[a,a+1]$에서 증가하며 값 $c$를 지난다는 뜻이다.
    - $y=4e^{-2}$와 $y=e^{-1}$은 그래프와 각각 몇 점에서 만나는가?
  - id: S2-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅱ_답안 pp.10-11 [풀이] 2-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        모든 실수 $x$에서 $f(x)\ge0$이고 $f$는 $x<-2$ 또는 $x>0$에서 증가, $(-2,0)$에서 감소한다. 그래프의 개형으로 $y=f(x)$는 직선 $y=4e^{-2}$와 서로 다른 두 점에서, 직선 $y=e^{-1}$과 서로 다른 세 점에서 만난다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        (ㄱ) $f(a)<4e^{-2}<f(a+1)$을 만족하는 정수 $a$는 $a\ge0$이고 이 구간에서 한 개 존재한다. $2<e$이므로 $f(0)=0<4e^{-2}<e=f(1)$이다.
      criteria:
      - 2.R1
    - id: 2b-3
      content: |
        따라서 구하는 정수 $a$는 $0$이다.
      criteria:
      - 2.A1
    - id: 2b-4
      content: |
        (ㄴ) $f(b)<e^{-1}<f(b+1)$을 만족하는 정수 $b$는 구간 $(-\infty,-2)$와 $(0,\infty)$에 구간별로 한 개씩 존재할 수 있다. $2.7<e<3$이므로 $16<2.7^3<e^3$이고, $f(-4)=16e^{-4}<e^{-1}<9e^{-3}=f(-3)$, $f(0)=0<e^{-1}<e=f(1)$이다.
      criteria:
      - 2.R2
    - id: 2b-5
      content: |
        따라서 구하는 정수 $b$는 $-4$와 $0$이다.
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $y=f(x)$가 직선 $y=4e^{-2}$와 두 점, 직선 $y=e^{-1}$과 세 점에서 만나는 두 경우로 구분했다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 1.A1
        max_points: 2
      steps:
      - 2b-1
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        정수 $a$는 $a\ge0$임을 설명하고 $0<4e^{-2}<e$를 언급했다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        $a=0$을 구했다.
      depends_on:
      - 2.R1
      steps:
      - 2b-3
    - id: 2.R2
      mark_type: R
      points: 2
      evidence: |
        $b$가 $(-\infty,-2)$, $(0,\infty)$에 한 개씩 있음을 설명하고 $16e^{-4}<e^{-1}<9e^{-3}$, $0<e^{-1}<e$를 언급했다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-4
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $b=-4,\ 0$을 구했다.
      depends_on:
      - 2.R2
      steps:
      - 2b-5
    deductions: []
