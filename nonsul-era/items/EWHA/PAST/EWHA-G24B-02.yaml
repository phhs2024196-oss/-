    detect_cue: $b=-4$가 없다
    feedback: 직선 $y=e^{-1}$은 $x<-2$에서도 그래프와 만납니다. 그 교점이 어느 두 정수 사이에 있는지 $e$의 범위로 확인하세요.
    remedy:
    - RL-3
- id: '3'
  stem: |
    방정식 $f(x)=k$의 실근이 모두 정수인 양의 실수 $k$의 최솟값을 구하시오.
  points: 17
  depends_on:
  - '1'
  - '2'
  answer:
    kind: value
    value: E
    equivalents:
    - f(1)
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $0<k\le4e^{-2}$이면 양의 근이 $(0,1)$에 있어 정수가 아니다. 따라서 $k>4e^{-2}$에서 양의 근이 $1$이 되는 $k=e$가 최소.
    steps:
    - id: 3a
      content: $k_{\min}=f(1)=e$
      criteria:
      - 3.M1
      - 3.R1
      - 3.R2
      - 3.R3
      - 3.A1
    hint_ladder:
    - $y=k$와 $y=f(x)$의 교점 개수는 $k$와 $4e^{-2}$의 대소에 따라 어떻게 달라지는가?
    - 양의 근이 정수가 되려면 $k$는 적어도 얼마여야 하는가?
  - id: S3-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅱ_답안 p.11 [풀이] 2-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $k>0$에 대하여 $f(x)=k$는 $0<k<M=4e^{-2}$일 때 서로 다른 세 실근, $k=4e^{-2}$일 때 서로 다른 두 실근, $k>4e^{-2}$일 때 한 개의 실근을 갖는다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        (ㄱ) $0<k<4e^{-2}$일 때 세 근이 모두 정수이려면 $f$가 감소하는 구간 $-2<x<0$의 근은 $x=-1$이어야 하므로 $k=e^{-1}=f(-1)$이다. 이때 다른 두 근 중 하나인 양수 $\alpha$가 정수여야 하는데, $2<e$이므로 $f(0)=0<e^{-1}(=f(\alpha))<e=f(1)$이므로 $0<\alpha<1$, 즉 $\alpha$는 정수가 아니다. 따라서 조건을 만족하는 $k$는 없다.
      criteria:
      - 3.R1
    - id: 3b-3
      content: |
        (ㄴ) $k=4e^{-2}$일 때 근은 $x=-2$와 양의 실수 $\beta$이다. $2<e$이므로 $f(0)=0<4e^{-2}(=f(\beta))<e=f(1)$이므로 $\beta$는 정수가 아니다. 따라서 $k=4e^{-2}$는 조건을 만족하지 않는다.
      criteria:
      - 3.R2
    - id: 3b-4
      content: |
        (ㄷ) $k>4e^{-2}$일 때 $f(x)=k$는 한 개의 양의 실근을 갖는다. $x>0$에서 $f$는 증가하고 $f(1)=e>4e^{-2}$이므로, 근이 양의 정수가 되는 가장 작은 $k$는 $x=1$일 때의 $f(1)=e$이다.
      criteria:
      - 3.R3
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $0<k<4e^{-2}$(세 실근), $k=4e^{-2}$(두 실근), $k>4e^{-2}$(한 실근)의 세 경우를 언급했다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 1.A1
        max_points: 3
      steps:
      - 3b-1
    - id: 3.R1
      mark_type: R
      points: 5
      evidence: |
        ① $0<k<4e^{-2}$: $(-2,0)$의 근이 $x=-1$이어야 함, 양의 근 $\alpha$에 대해 $f(0)=0<e^{-1}<e=f(1)$(문항 (2)에서 도출)을 언급하여 $\alpha$가 정수가 아니므로 조건을 만족하는 $k$가 없다고 결론지었다.
      depends_on:
      - 3.M1
      implied_ok: false
      steps:
      - 3b-2
    - id: 3.R2
      mark_type: R
      points: 4
      evidence: |
        ② $k=4e^{-2}$: 근 $x=-2$와 양수 $\beta$, $f(0)=0<4e^{-2}<e=f(1)$로 $\beta$가 정수가 아니어서 조건을 만족하지 않는다고 결론지었다.
      depends_on:
      - 3.M1
      implied_ok: false
      steps:
      - 3b-3
    - id: 3.R3
      mark_type: R
      points: 3
      evidence: |
        ③ $k>4e^{-2}$: 한 개의 양의 실근을 가지며 $f(1)=e>4e^{-2}$이고 $x>0$에서 $f$가 증가함을 기술했다.
      depends_on:
      - 3.M1
      implied_ok: false
      steps:
      - 3b-4
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        최솟값 $k=e$를 구했다.
      depends_on:
      - 3.R3
      cao: true
      steps:
      - 3b-4
    deductions: []
