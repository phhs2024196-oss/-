subparts:
- id: '1'
  stem: |
    함수 $f(x)$의 극댓값과 극솟값을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: max=4*exp(-2); min=0
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f^\prime(x)=x(x+2)e^x$의 부호가 $+,-,+$로 바뀐다.
    steps:
    - id: 1a
      content: $M=f(-2)=4e^{-2}$, $m=f(0)=0$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - 곱의 미분법으로 $f^\prime(x)$를 인수분해해 보자.
  - id: S1-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅱ_답안 p.10 [풀이] 2-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f^\prime(x)=2xe^x+x^2e^x=x(x+2)e^x$이므로 $f^\prime(x)=0$의 근은 $x=-2$, $x=0$이다. $(-\infty,-2)$에서 $f^\prime(x)>0$(증가), $(-2,0)$에서 $f^\prime(x)<0$(감소), $(0,\infty)$에서 $f^\prime(x)>0$(증가)이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 $x=-2$에서 극댓값 $f(-2)=4e^{-2}$, $x=0$에서 극솟값 $f(0)=0$을 갖는다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $f^\prime(x)=2xe^x+x^2e^x$를 구하고 근 $x=-2,0$과 구간별 증가·감소를 설명했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        극댓값 $4e^{-2}$, 극솟값 $0$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    deductions: []
