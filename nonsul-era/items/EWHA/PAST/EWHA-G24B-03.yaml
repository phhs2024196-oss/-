intent: |
  원 위의 두 점을 지나는 직선과 호의 길이를 구하고, 원 위의 점에 관한 조건으로 정의된 넓이 함수의 최댓값과 최솟값의 차를 점과 직선 사이의 거리(평행한 두 접선) 문제로 해석해 구하는 종합적 수리 능력을 평가한다(공식 출제의도 요지).
key_idea: |
  $S(\theta)=(\text{활꼴})+\triangle\mathrm{PAB}$에서 활꼴은 고정이므로 $M-m=\frac12\overline{\mathrm{AB}}(h_1-h_2)$이고, $h_1-h_2$는 원 $C$의 지름 $2$이다. 따라서 $(M-m)^2=\overline{\mathrm{AB}}^2$.
stuck: |
  활꼴 넓이를 실제로 계산하지 않고, 최대·최소 거리의 차가 지름(직선에 평행한 두 접선 사이 거리)임을 알아보는 것
