stimuli: []
stem: |
  좌표평면의 원 $x^2+y^2=16$ 위의 두 점 $\mathrm{A}(2\sqrt2,\,2\sqrt2)$, $\mathrm{B}(\sqrt6-\sqrt2,\,\sqrt6+\sqrt2)$에 대하여 다음 물음에 답하시오. [30점]
subparts:
- id: '1'
  stem: |
    두 점 $\mathrm{A}$, $\mathrm{B}$를 지나는 직선의 방정식을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: x + sqrt(3)*y - (2*sqrt(2) + 2*sqrt(6)) = 0
    equivalents:
    - y = -x/sqrt(3) + (2*sqrt(6) + 6*sqrt(2))/3
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 기울기 $\dfrac{2\sqrt2-(\sqrt6+\sqrt2)}{2\sqrt2-(\sqrt6-\sqrt2)}=-\dfrac{1}{\sqrt3}$.
    steps:
    - id: 1a
      content: $x+\sqrt3y-(2\sqrt2+2\sqrt6)=0$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - 기울기의 분모를 유리화해 보자.
  - id: S1-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅱ_답안 p.14 [풀이] 3-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 점 A, B를 지나는 직선의 기울기는 $\dfrac{2\sqrt2-(\sqrt6+\sqrt2)}{2\sqrt2-(\sqrt6-\sqrt2)}=-\dfrac{1}{\sqrt3}$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        직선의 방정식은 $y=-\dfrac{1}{\sqrt3}(x-2\sqrt2)+2\sqrt2=-\dfrac{1}{\sqrt3}x+\dfrac{2\sqrt6+6\sqrt2}{3}$, 즉 $x+\sqrt3y-(2\sqrt2+2\sqrt6)=0$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        두 점 A, B를 지나는 직선의 기울기 $-\frac{1}{\sqrt3}$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        직선의 방정식 $x+\sqrt3y-(2\sqrt2+2\sqrt6)=0$(또는 동치식)을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
      not_penalized:
      - 공식 채점기준표의 「$y=-x+2\sqrt6$」은 자연계열Ⅰ 문구가 남은 오기로 판단 — 예시답안의 $x+\sqrt3y-(2\sqrt2+2\sqrt6)=0$을 정답으로 채점
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  - code: '71'
    misconception: MC-GEO-9263
  misconceptions:
  - id: MC-GEO-9263
    outcome_code: '71'
    wrong_work: 자연계열Ⅰ처럼 A, B가 $y=x$에 대칭이라고 가정해 기울기 $-1$을 씀
    detect_cue: 기울기가 $-1$이거나 구한 직선이 A 또는 B를 지나지 않는다
    feedback: 기울기는 같은 순서로 뺀 $\dfrac{y_2-y_1}{x_2-x_1}$입니다. 구한 직선에 두 점을 대입해 확인하세요.
    remedy:
    - RL-1
- id: '2'
  stem: |
    호 $\mathrm{AB}$의 길이를 구하시오. (단, 호 $\mathrm{AB}$는 제1사분면에 있다.)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 2*pi/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\tan\alpha=1$, $\tan\beta=2+\sqrt3$에서 중심각 $\beta-\alpha=\frac{\pi}{6}$.
    steps:
    - id: 2a
      content: $\tan(\beta-\alpha)=\frac{1}{\sqrt3}\Rightarrow\beta-\alpha=\frac{\pi}{6}$, 호의 길이 $4\cdot\frac{\pi}{6}=\frac{2\pi}{3}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - OA, OB가 $x$축과 이루는 각의 탄젠트를 구해 보자.
  - id: S2-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅱ_답안 p.14 [풀이] 3-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        OA, OB가 $x$축과 이루는 각을 $\alpha,\beta$라 하면 $\tan\alpha=\dfrac{2\sqrt2}{2\sqrt2}=1$, $\tan\beta=\dfrac{\sqrt6+\sqrt2}{\sqrt6-\sqrt2}=2+\sqrt3$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        탄젠트함수의 덧셈정리에 의해 $\tan(\beta-\alpha)=\dfrac{(2+\sqrt3)-1}{1+(2+\sqrt3)\cdot1}=\dfrac{1}{\sqrt3}$이므로 $\beta-\alpha=\dfrac{\pi}{6}$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        원의 반지름이 4이므로 호 AB의 길이는 $4\cdot\dfrac{\pi}{6}=\dfrac{2\pi}{3}$이다.
      criteria:
      - 2.A1
  - id: S2-ALT
    audience: ALT
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅱ_답안 pp.14-15 [별해] 3-(2)
    method_no: 2
    key_idea: $\overline{\mathrm{AB}}^2=32-16\sqrt3$과 코사인법칙으로 $\cos\gamma=\frac{\sqrt3}{2}$.
    steps:
    - id: 2c-1
      content: |
        $\overline{\mathrm{AB}}^2=\{2\sqrt2-(\sqrt6-\sqrt2)\}^2+\{2\sqrt2-(\sqrt6+\sqrt2)\}^2=32-16\sqrt3$이고 코사인법칙에 의해 $\cos\gamma=\dfrac{4^2+4^2-(32-16\sqrt3)}{2\cdot4\cdot4}=\dfrac{\sqrt3}{2}$, $\gamma=\dfrac{\pi}{6}$이므로 호의 길이는 $\dfrac{2\pi}{3}$.
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $\tan\alpha=1$, $\tan\beta=2+\sqrt3$을 구했다(별해: $\overline{\mathrm{AB}}^2=32-16\sqrt3$).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2c-1
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        덧셈정리로 $\tan(\beta-\alpha)=\frac{1}{\sqrt3}$, 중심각 $\frac{\pi}{6}$을 구했다(별해: 코사인법칙으로 $\cos\gamma=\frac{\sqrt3}{2}$, $\gamma=\frac{\pi}{6}$).
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
      - 2c-1
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        호의 길이 $4\cdot\frac{\pi}{6}=\frac{2\pi}{3}$을 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
      - 2c-1
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  - code: '72'
    misconception: MC-GEO-9260
  misconceptions:
  - id: MC-GEO-9260
    outcome_code: '72'
    wrong_work: 중심각 $60^\circ$를 그대로 곱해 호의 길이 $240$ 또는 $\frac{1}{2}\cdot4\cdot\frac{\pi}{3}$
    detect_cue: 답에 $\pi$가 없거나 $\frac{\pi}{3}$ 등 $r\theta$와 다른 값이다
    feedback: 호의 길이는 호도법의 중심각 $\theta$에 대해 $r\theta$입니다.
    remedy:
    - RL-2
- id: '3'
  stem: |
    좌표평면의 집합 $C=\{(\cos\theta-1,\sin\theta)\mid0\le\theta<2\pi\}$에 속하는 점 $\mathrm{P}(\cos\theta-1,\sin\theta)$에 대하여 문항 (2)의 호 $\mathrm{AB}$와 두 선분 $\mathrm{AP}$, $\mathrm{BP}$로 둘러싸인 도형의 넓이를 $S(\theta)$라 하자. $S(\theta)$의 최댓값을 $M$, 최솟값을 $m$이라 할 때 $(M-m)^2$의 값을 구하시오.
  points: 18
  depends_on:
  - '1'
  - '2'
  answer:
    kind: value
    value: 32 - 16*sqrt(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 활꼴은 상쇄되고 $M-m=\frac12\overline{\mathrm{AB}}\cdot2=\overline{\mathrm{AB}}$.
    steps:
    - id: 3a
      content: $(M-m)^2=\overline{\mathrm{AB}}^2=32-16\sqrt3$
      criteria:
      - 3.R1
      - 3.R2
      - 3.M1
      - 3.R3
      - 3.A1
      - 3.A2
    hint_ladder:
    - 넓이 중 $\theta$에 따라 변하는 부분은?
    - 원 위의 점에서 직선까지 거리의 최댓값과 최솟값의 차는?
  - id: S3-B
    audience: B
    source_flow: (이화여대)2024 논술고사 자연계열 Ⅱ_답안 p.15 [풀이] 3-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        호 AB와 두 선분 AP, BP로 둘러싸인 도형의 넓이는 호 AB와 선분 AB로 둘러싸인 도형의 넓이와, 선분 AB를 밑변으로 하고 $C$의 한 점 P를 꼭짓점으로 하는 삼각형의 넓이의 합과 같다. 따라서 이 삼각형의 넓이가 최대일 때 $S(\theta)$가 최대이고 최소일 때 최소이다.
      criteria:
      - 3.R1
    - id: 3b-2
      content: |
        집합 $C$의 점은 $(x+1)^2+y^2=\cos^2\theta+\sin^2\theta=1$로 나타나는 원의 점이다. 이 원의 한 점과 (1)의 직선 사이의 거리가 최대인 $h_1$일 때 $S$가 최대, 최소인 $h_2$일 때 $S$가 최소이다.
      criteria:
      - 3.R2
    - id: 3b-3
      content: |
        $M-m$은 선분 AB를 공통인 밑변으로 하고 높이가 $h_1$, $h_2$인 두 삼각형의 넓이의 차이므로 $M-m=\frac12\overline{\mathrm{AB}}\cdot h_1-\frac12\overline{\mathrm{AB}}\cdot h_2=\frac12\overline{\mathrm{AB}}(h_1-h_2)$이다.
      criteria:
      - 3.M1
    - id: 3b-4
      content: |
        직선 $x+\sqrt3y-(2\sqrt2+2\sqrt6)=0$에서 거리가 최대 또는 최소가 되는 원 위의 점은 이 원과 기울기가 $-\frac{1}{\sqrt3}$인 접선이 만나는 두 점이다. 두 접선은 직선 AB에 평행하고 원의 반지름이 1이므로 $h_1=h_2+2$, 즉 $h_1-h_2=2$이다.
      criteria:
      - 3.R3
    - id: 3b-5
      content: |
        선분 AB의 길이의 제곱은 $\{2\sqrt2-(\sqrt6-\sqrt2)\}^2+\{2\sqrt2-(\sqrt6+\sqrt2)\}^2=32-16\sqrt3$이다.
      criteria:
      - 3.A1
    - id: 3b-6
      content: |
        따라서 $(M-m)^2=\left\{\frac12\cdot\overline{\mathrm{AB}}\cdot2\right\}^2=\overline{\mathrm{AB}}^2=32-16\sqrt3$이다.
      criteria:
      - 3.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.R1
      mark_type: R
      points: 4
      evidence: |
        넓이가 (호 AB와 선분 AB로 둘러싸인 도형) $+$ (삼각형 PAB)이고, 삼각형 넓이의 최대·최소일 때 $S$도 최대·최소임을 서술했다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
    - id: 3.R2
      mark_type: R
      points: 3
      evidence: |
        $C$가 원 $(x+1)^2+y^2=1$이며 원 위의 점과 직선 AB 사이 거리 $h_1$(최대), $h_2$(최소)에서 $S$가 최대·최소임을 설명했다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-2
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $M-m=\frac12\overline{\mathrm{AB}}(h_1-h_2)$임을 설명했다.
      depends_on:
      - 3.R1
      implied_ok: false
      steps:
      - 3b-3
    - id: 3.R3
      mark_type: R
      points: 4
      evidence: |
        거리가 최대·최소인 점이 기울기 $-\frac{1}{\sqrt3}$인 두 접선의 접점임을 근거로 $h_1-h_2=2$를 구했다.
      depends_on:
      - 3.R2
      implied_ok: false
      ft:
        allowed: true
        from:
        - 1.A1
        max_points: 4
      steps:
      - 3b-4
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $\overline{\mathrm{AB}}^2=32-16\sqrt3$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-5
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: |
        $(M-m)^2=32-16\sqrt3$을 구했다.
      depends_on:
      - 3.M1
      - 3.R3
      cao: true
      steps:
      - 3b-6
    deductions: []
