intent: |
  주어진 함수의 조건들을 통하여 주어진 함수가 증가함을 보이고 해당하는 역함수의 함숫값들과 정적분 값을 추론하는 수리적 조작 능력, 수리적 계산 능력, 수리적 추론 능력을 종합적으로 평가한다(공식 출제 의도).
key_idea: |
  $g'(x)=(2f(x)+f'(x)\tan2x)\cos2x>0$로 증가를 보이고, 역함수의 정적분은 넓이 관계 $\int_0^3h\,dx+\int_0^{\pi/6}g\,dx=\dfrac{\pi}{6}\cdot3$과 부분적분으로 $\int_0^{\pi/6}xg'(x)\,dx=2a+b$로 바꾼다.
stuck: |
  $f$를 모르는 채로 $\int_0^3h(x)\,dx$를 구해야 하므로, 역함수 넓이 관계와 부분적분으로 $xg'(x)$의 적분을 만들어 주어진 $a,b$로 연결하는 발상
idea_tags: [IDEA-INVERSE-INTEGRAL-AREA, IDEA-PARTS-TO-GIVEN-INTEGRALS, IDEA-FACTOR-DERIV-SIGN]
tags: [역함수의 정적분, 부분적분, 곱의 미분]
elements:
  materials:
  - '$f(\pi/6)=2\sqrt3$, $2f(x)+f^{\prime}(x)\tan2x>0$을 만족하는 미지 함수 $f$'
  - '$g(x)=f(x)\sin2x$ (구간 $[0,\pi/6]$)와 그 역함수 $h$'
  - '주어진 적분값 $a=\int_0^{\pi/6}xf(x)\cos2x\,dx$, $b=\int_0^{\pi/6}xf^{\prime}(x)\sin2x\,dx$'
  concepts:
  - 곱의 미분법·합성함수의 미분
  - 도함수의 부호와 증가·감소
  - 역함수의 뜻
  - 역함수의 정적분과 넓이
  - 부분적분법
  tools:
  - '$g^{\prime}=(2f+f^{\prime}\tan2x)\cos2x$ 로 인수 정리'
  - '넓이 관계 $\int_0^3h+\int_0^{\pi/6}g=\dfrac{\pi}{6}\times3$'
  - '부분적분 $\int_0^{\pi/6}g\,dx=\left[xg\right]_0^{\pi/6}-\int_0^{\pi/6}xg^{\prime}\,dx$'
  conditions:
  - '$0\le x\le\pi/6$에서 $\cos2x>0$'
  - '$g(0)=0$, $g(\pi/6)=3$'
  stimuli_used: []
  subpart_links: '(2)는 (1)의 증가성(역함수 존재)을, (3)은 (2)의 h(0)·h(3)과 (1)의 g′ 식을 사용'

