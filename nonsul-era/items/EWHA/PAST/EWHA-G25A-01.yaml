stimuli: []

stem: |
  모든 실수 $x$에서 미분가능한 함수 $f(x)$에 대하여 $f^{\prime}(x)$가 연속이다. 함수 $f(x)$가 다음 조건을 만족시킬 때,

  (가) $f\left(\dfrac{\pi}{6}\right)=2\sqrt3$

  (나) $2f(x)+f^{\prime}(x)\tan2x>0$

  아래 물음에 답하시오. [35점]

subparts:
- id: '1'
  stem: |
    구간 $\left[0,\dfrac{\pi}{6}\right]$에서 정의된 함수 $g(x)$가 $g(x)=f(x)\sin2x$일 때, $g(x)$는 구간 $\left[0,\dfrac{\pi}{6}\right]$에서 증가함을 보이시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g^{\prime}(x)=2f\cos2x+f^{\prime}\sin2x=(2f+f^{\prime}\tan2x)\cos2x$이고 두 인수가 모두 양수이다.
    steps:
    - {id: 1a, content: '$g^{\prime}(x)=(2f(x)+f^{\prime}(x)\tan2x)\cos2x>0$', criteria: [1.M1, 1.R1, 1.A1]}
    hint_ladder:
    - $g^{\prime}(x)$를 곱의 미분으로 구해 보자.
    - $\cos2x$로 묶으면 조건 (나)의 식이 보인다.
  - id: S1-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅰ)」 p.3 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$가 미분가능하므로 $g(x)=f(x)\sin2x$도 미분가능하고, $f^{\prime}(x)$가 연속이므로
        $$g^{\prime}(x)=2f(x)\cos2x+f^{\prime}(x)\sin2x$$
        는 연속함수이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $0\le x\le\dfrac{\pi}{6}$인 실수 $x$에 대해서 $\cos2x>0$이고, 조건 (나)에 의해 $g^{\prime}(x)=(2f(x)+f^{\prime}(x)\tan2x)\cos2x>0$이다. (공식 예시 답안과 채점 기준에는 「조건 (가)에 의해」로 적혀 있으나, 쓰이는 것은 조건 (나)이다.)
      criteria: [1.R1]
    - id: 1b-3
      content: |
        따라서 $g(x)=f(x)\sin2x$는 구간 $\left[0,\dfrac{\pi}{6}\right]$에서 증가한다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $g(x)$의 도함수가 $g^{\prime}(x)=2f(x)\cos2x+f^{\prime}(x)\sin2x$임을 결정했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $\cos2x>0$과 조건 (나)를 활용해 $g^{\prime}(x)>0$임을 얻었다(공식 표기: 「조건 (가)를 활용해」).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $g^{\prime}(x)>0$임을 이용하여 $g(x)$가 증가함을 결론지었다.
      depends_on: [1.R1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9350}
  misconceptions:
  - id: MC-CAL-9350
    outcome_code: '71'
    wrong_work: '$g^{\prime}(x)=f^{\prime}(x)\sin2x+f(x)\cos2x$'
    detect_cue: $\cos2x$ 앞의 계수 2가 없어 조건 (나)의 꼴로 묶이지 않는다
    feedback: $\sin2x$의 도함수는 $2\cos2x$입니다. 속미분 계수를 챙기면 $(2f+f^{\prime}\tan2x)\cos2x$로 묶입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    (1)에서 언급한 함수 $g(x)$의 역함수를 $h(x)$라 할 때, $h(0)$과 $h(3)$의 값을 각각 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: 'h(0)=0; h(3)=pi/6', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(0)=0$, $g(\pi/6)=f(\pi/6)\sin\frac{\pi}{3}=3$이므로 역함수의 뜻에서 바로 나온다.
    steps:
    - {id: 2a, content: '$g(0)=0,\ g(\pi/6)=3\Rightarrow h(0)=0,\ h(3)=\pi/6$', criteria: [2.B1, 2.A1]}
    hint_ladder:
    - $g$의 양 끝 값은 무엇인가?
  - id: S2-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅰ)」 p.4 예시 답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(0)=f(0)\times\sin0=0$이고 $g\left(\dfrac{\pi}{6}\right)=f\left(\dfrac{\pi}{6}\right)\times\sin\dfrac{\pi}{3}=2\sqrt3\times\dfrac{\sqrt3}{2}=3$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        함수 $h(x)$가 $g(x)$의 역함수이므로 $h(0)=0$, $h(3)=\dfrac{\pi}{6}$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: |
        $g(0)=0$과 $g\left(\dfrac{\pi}{6}\right)=3$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $h(x)$가 $g(x)$의 역함수임을 이용하여 $h(0)=0$, $h(3)=\dfrac{\pi}{6}$을 얻었다.
      depends_on: [2.B1]
      implied_ok: true
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-9351}
  misconceptions:
  - id: MC-ALG-9351
    outcome_code: '71'
    wrong_work: '$h(3)=g(3)=3f(3)\sin6$'
    detect_cue: $g$에 3을 대입하려 하거나 $f(3)$이 등장한다
    feedback: $h(3)=t$는 $g(t)=3$을 뜻합니다. 정의역 $[0,\pi/6]$에서 $g$의 값이 3이 되는 점을 찾으세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    $\displaystyle\int_0^{\frac{\pi}{6}}xf(x)\cos2x\,dx=a$, $\displaystyle\int_0^{\frac{\pi}{6}}xf^{\prime}(x)\sin2x\,dx=b$인 실수 $a,b$와 (2)에서 언급한 $h(x)$에 대하여, $\displaystyle\int_0^3h(x)\,dx$의 값을 $a,b$로 나타내시오.
  points: 15
  depends_on: ['1', '2']
  answer: {kind: expression, value: '2*a+b', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\int_0^3h=\dfrac{\pi}{2}-\int_0^{\pi/6}g=\int_0^{\pi/6}xg^{\prime}\,dx=2a+b$.
    steps:
    - {id: 3a, content: '넓이 관계와 부분적분으로 $\int_0^3h\,dx=\int_0^{\pi/6}xg^{\prime}(x)\,dx=2a+b$', criteria: [3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - $y=g(x)$와 $y=h(x)$의 그래프는 $y=x$에 대칭이다. 두 넓이의 합은 어떤 직사각형인가?
    - $\int g\,dx$에 부분적분을 쓰면 $xg^{\prime}(x)$가 나온다.
  - id: S3-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅰ)」 p.4 예시 답안
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2)의 결과로부터 $h(0)=0$, $h(3)=\dfrac{\pi}{6}$이므로, 정적분과 넓이의 관계를 통해
        $$\int_0^3h(x)\,dx+\int_0^{\frac{\pi}{6}}g(x)\,dx=\dfrac{\pi}{2}$$
        임을 알 수 있다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        부분적분법에 의해 $\displaystyle\int_0^{\frac{\pi}{6}}g(x)\,dx=\left[xg(x)\right]_0^{\frac{\pi}{6}}-\int_0^{\frac{\pi}{6}}xg^{\prime}(x)\,dx=\dfrac{\pi}{2}-\int_0^{\frac{\pi}{6}}xg^{\prime}(x)\,dx$를 얻는다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        따라서 $\displaystyle\int_0^3h(x)\,dx=\dfrac{\pi}{2}-\left(\dfrac{\pi}{2}-\int_0^{\frac{\pi}{6}}xg^{\prime}(x)\,dx\right)=\int_0^{\frac{\pi}{6}}(2xf(x)\cos2x+xf^{\prime}(x)\sin2x)\,dx=2a+b$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        정적분과 넓이의 관계를 통해 $\int_0^3h(x)\,dx+\int_0^{\pi/6}g(x)\,dx=\dfrac{\pi}{2}$를 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 5}
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: |
        부분적분법을 통해 $\int_0^{\pi/6}g(x)\,dx=\dfrac{\pi}{2}-\int_0^{\pi/6}xg^{\prime}(x)\,dx$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        $\int_0^3h(x)\,dx=\int_0^{\pi/6}(2xf(x)\cos2x+xf^{\prime}(x)\sin2x)\,dx=2a+b$를 얻었다.
      depends_on: [3.M1, 3.M2]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9352}
  - {code: '72', misconception: MC-CAL-9350}
  misconceptions:
  - id: MC-CAL-9352
    outcome_code: '71'
    wrong_work: '$\int_0^3h\,dx=\int_0^{\pi/6}g\,dx$로 놓거나 직사각형 넓이 $\dfrac{\pi}{2}$를 빠뜨려 답이 $-(2a+b)$'
    detect_cue: 결과에 부호가 반대이거나 $\dfrac{\pi}{2}$가 남는다
    feedback: 역함수 그래프와의 넓이 합은 가로 $\dfrac{\pi}{6}$, 세로 3인 직사각형 넓이 $\dfrac{\pi}{2}$입니다.
    remedy: [RL-3]
  - id: MC-CAL-9350
    outcome_code: '72'
    wrong_work: '$xg^{\prime}=xf\cos2x+xf^{\prime}\sin2x$로 써서 답이 $a+b$'
    detect_cue: 최종 답이 $a+b$이다
    feedback: $g^{\prime}(x)$의 첫 항은 $2f(x)\cos2x$입니다.
    remedy: [RL-1]

