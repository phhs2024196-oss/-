stimuli: []

stem: |
  구간 $[0,\infty)$에서 정의된 연속함수 $f(x)$가 다음 조건을 만족할 때,

  (가) 실수 $a>1$에 대하여 $f(x)=\begin{cases}a^x-1 & (0\le x<1)\\ a-a^{x-1} & (1\le x\le2)\end{cases}$ 이다.

  (나) 모든 자연수 $n$에 대하여, 구간 $[2n,\,2n+2]$에서 $f(x)=a^{-n}f(x-2n)$이다.

  아래 물음에 답하시오. [35점]

subparts:
- id: '1'
  stem: |
    $\displaystyle\int_0^2f(x)\,dx$의 값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: expression, value: 'a-1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $[1,2]$ 부분은 $[0,1]$ 부분과 합쳐 가로 1, 세로 $a-1$인 직사각형을 채운다.
    steps:
    - {id: 1a, content: '$\int_0^2f=\int_0^1f+\int_0^1(a-1-f)=a-1$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $y=a-a^{x-1}$은 $y=a^x-1$을 어떻게 옮긴 것인가?
  - id: S1-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅰ)」 pp.7–8 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)로부터 $0\le x\le1$에서의 함수 $f(x)$의 그래프를 $x$축 대칭, $x$축 방향으로 1, $y$축 방향으로 $a-1$만큼 평행이동하면 $1\le x\le2$에서의 함수 $f(x)$의 그래프와 같음을 알 수 있다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이로부터 치환적분법을 이용하면 $\displaystyle\int_1^2f(x)\,dx=\int_0^1(a-1-f(x))\,dx$임을 알 수 있다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $\displaystyle\int_0^2f(x)\,dx$의 값은 가로가 1, 세로가 $a-1$인 직사각형의 넓이와 같으므로 $\displaystyle\int_0^2f(x)\,dx=a-1$이다.
      criteria: [1.A1]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 직접 적분 — $\int_0^1(a^x-1)\,dx=\dfrac{a-1}{\ln a}-1$, $\int_1^2(a-a^{x-1})\,dx=a-\dfrac{a-1}{\ln a}$를 더하면 $a-1$.
    steps:
    - id: 1c-1
      content: |
        $\displaystyle\int_0^1(a^x-1)\,dx+\int_1^2(a-a^{x-1})\,dx=\left(\dfrac{a-1}{\ln a}-1\right)+\left(a-\dfrac{a-1}{\ln a}\right)=a-1$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $0\le x\le1$에서의 함수 $f(x)$를 대칭 및 평행이동하여 $1\le x\le2$에서의 $f(x)$와 같음을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        치환적분법을 이용하여 $\int_1^2f(x)\,dx=\int_0^1(a-1-f(x))\,dx$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        직사각형의 넓이와 같음을 이용하여 $\int_0^2f(x)\,dx=a-1$임을 보였다.
      depends_on: [1.M2]
      steps: [1b-3, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9353}
  misconceptions:
  - id: MC-GEO-9353
    outcome_code: '71'
    wrong_work: '$\int_1^2f\,dx=\int_0^1f\,dx$로 보아 $\int_0^2f=2\left(\dfrac{a-1}{\ln a}-1\right)$'
    detect_cue: 답에 $\ln a$가 남는다
    feedback: $x$축 대칭 후 위로 $a-1$ 올린 그래프 아래 넓이는 직사각형 넓이에서 원래 넓이를 뺀 것입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    모든 자연수 $n$에 대하여 $2n\le x\le2n+2$에서의 $f(x)$를 구하시오.
  points: 8
  depends_on: []
  answer: {kind: expression, value: 'a**(x-3*n)-a**(-n) (2n<=x<=2n+1); a**(1-n)-a**(x-3*n-1) (2n+1<=x<=2n+2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $y=x-2n$으로 놓고 (가)의 식에 $a^{-n}$을 곱한 뒤 $y$를 되돌린다.
    steps:
    - {id: 2a, content: '$f(x)=a^{-n}f(x-2n)$에 (가) 대입', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - $x-2n$은 어느 구간에 있는가?
  - id: S2-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅰ)」 p.8 예시 답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        조건 (나)로부터 각 자연수 $n$에 대하여 $f(x)=a^{-n}f(x-2n)$이므로, $y=x-2n$이라 하면 $2n\le x\le2n+2$일 때 $0\le y\le2$이고
        $$f(y+2n)=a^{-n}f(y)=\begin{cases}a^{y-n}-a^{-n} & (0\le y\le1)\\ a^{1-n}-a^{y-1-n} & (1\le y\le2)\end{cases}$$
        이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        다시 $x=y+2n$이라 하면
        $$f(x)=a^{-n}f(x-2n)=\begin{cases}a^{x-3n}-a^{-n} & (2n\le x\le2n+1)\\ a^{1-n}-a^{x-3n-1} & (2n+1\le x\le2n+2)\end{cases}$$
        이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $y=x-2n$을 이용하여 $2n\le x\le2n+2$에서의 함수 $f(x)$를 $0\le y\le2$에서의 $y$에 관한 함수로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $y=x-2n$을 대입하여 $2n\le x\le2n+2$에서의 함수 $f(x)$를 구간별로 표현했다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9354}
  misconceptions:
  - id: MC-GEO-9354
    outcome_code: '71'
    wrong_work: '$f(x)=a^{-n}(a^{x+2n}-1)$'
    detect_cue: 지수에 $x+2n$ 또는 $x-n$이 나타난다
    feedback: 오른쪽으로 $2n$만큼 옮긴 그래프는 $x$ 대신 $x-2n$을 넣습니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    모든 자연수 $n$에 대하여 $y=f(x)$와 $x$축 및 두 직선 $x=0$, $x=2n$으로 둘러싸인 부분의 넓이를 $S_n$이라 할 때, $\displaystyle\lim_{n\to\infty}S_n=2025$를 만족시키는 실수 $a$의 값을 구하시오.
  points: 15
  depends_on: ['1', '2']
  answer: {kind: value, value: '2025', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $S_n=\sum_{k=1}^n(a-1)a^{1-k}\to\dfrac{a-1}{1-1/a}=a$.
    steps:
    - {id: 3a, content: '$\lim S_n=a=2025$', criteria: [3.M3, 3.A2]}
    hint_ladder:
    - 각 구간 $[2k-2,2k]$의 넓이는 $[0,2]$의 넓이의 몇 배인가?
  - id: S3-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅰ)」 p.8 예시 답안
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        조건문으로부터 $f(0)=f(2)=0$이고, (2)의 결과로 자연수 $k$에 대하여 $f(2k)=f(2k+2)=0$이다(채점 기준 표기: $f(2n-2)=0$).
      criteria: [3.B1]
    - id: 3b-2
      content: |
        $(2k-2,\,2k)$에서 $f(x)$가 0이 아니므로 $S_n$은 $1\le k\le n$에 대하여 $y=f(x)$와 $x$축 및 두 직선 $x=2k-2$, $x=2k$로 둘러싸인 도형의 넓이를 모두 합한 것과 같다.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        치환적분법을 이용하면 그 넓이는
        $$\int_{2k-2}^{2k}f(x)\,dx=\int_0^2f(x+2k-2)\,dx=a^{1-k}\int_0^2f(x)\,dx=(a-1)a^{1-k}$$
        이다.
      criteria: [3.M2]
    - id: 3b-4
      content: |
        따라서 $S_n=\displaystyle\sum_{k=1}^n(a-1)a^{1-k}$이다.
      criteria: [3.A1]
    - id: 3b-5
      content: |
        $(a-1)a^{1-k}$는 초항이 $a-1$이고 공비가 $\dfrac1a$인 등비수열이고 $a>1$이므로 등비급수의 합은 수렴하며 $\displaystyle\lim_{n\to\infty}S_n=\sum_{n=1}^{\infty}(a-1)a^{1-n}=a$이다.
      criteria: [3.M3]
    - id: 3b-6
      content: |
        따라서 $a=2025$이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 1
      evidence: |
        자연수 $n$에 대하여 $f(2n-2)=0$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $S_n$이 $k=1,2,\cdots,n$에 대하여 $y=f(x)$와 $x$축 및 두 직선 $x=2k-2$, $x=2k$로 둘러싸인 부분의 넓이의 합으로 표현됨을 보였다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: |
        치환적분법을 이용하여 $\int_{2k-2}^{2k}f(x)\,dx=a^{-k+1}\int_0^2f(x)\,dx$임을 보였다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 4}
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        (1)의 결과를 이용하여 $S_n=\sum_{k=1}^n(a-1)a^{1-k}$임을 보였다.
      depends_on: [3.M1, 3.M2]
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [3b-4]
    - id: 3.M3
      mark_type: M
      points: 2
      evidence: |
        $a>1$임을 이용하여 등비급수의 합 $\sum_{n=1}^{\infty}(a-1)a^{1-n}=a$임을 보였다.
      depends_on: [3.A1]
      implied_ok: false
      steps: [3b-5, 3a]
    - id: 3.A2
      mark_type: A
      points: 1
      evidence: |
        문제의 조건으로부터 $a=2025$임을 보였다.
      depends_on: [3.M3]
      steps: [3b-6, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-9355}
  - {code: '72', misconception: MC-GEO-9354}
  misconceptions:
  - id: MC-ALG-9355
    outcome_code: '71'
    wrong_work: '$S_n=\sum_{k=1}^n(a-1)a^{-k}$로 써서 극한이 1이 되어 모순, 또는 공비를 $a$로 보아 발산'
    detect_cue: 첫째항이 $\dfrac{a-1}{a}$이거나 공비가 $a$로 적혀 있다
    feedback: 첫 구간 $[0,2]$에는 (나)가 적용되지 않으므로 첫째항은 $a-1$입니다. $[2k-2,2k]$에는 $n=k-1$이 적용됩니다.
    remedy: [RL-3]
  - id: MC-GEO-9354
    outcome_code: '72'
    wrong_work: '구간 $[2k-2,2k]$의 넓이를 $a^{-k}(a-1)$로 계산'
    detect_cue: 구간 번호와 (나)의 $n$을 같게 놓았다
    feedback: 구간 $[2k-2,2k]$는 (나)에서 $n=k-1$인 경우입니다.
    remedy: [RL-2]

