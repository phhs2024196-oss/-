intent: |
  제시된 조건으로부터 정의역 전체에서의 함수를 이해하고, 함수에 의해 결정되는 부분의 넓이를 수열로 정의하여 그 수열의 극한값을 구하는 문제이다. 대칭·평행이동의 성질을 이용한 넓이 계산과, 등비급수의 합공식을 이용한 극한값 계산의 수리적 계산 및 추론 능력을 평가한다(공식 출제 의도 요지).
key_idea: |
  $[1,2]$ 부분은 $[0,1]$ 부분을 $x$축 대칭 후 $(1,\,a-1)$만큼 평행이동한 것이므로 $\int_0^2f\,dx=a-1$이고, (나)에 의해 $[2k-2,2k]$의 넓이는 $a^{1-k}(a-1)$이므로 $S_n$은 공비 $\dfrac1a$인 등비수열의 합이다.
stuck: |
  $\int_1^2(a-a^{x-1})\,dx$를 $\int_0^1(a-1-f(x))\,dx$로 보아 직사각형 넓이로 처리하는 발상과, 조건 (나)의 $n$을 구간 번호와 맞추는 것($[2k-2,2k]$에는 $n=k-1$)
idea_tags: [IDEA-SYMMETRY-AREA-RECTANGLE, IDEA-SCALED-COPY-GEOMETRIC-SERIES]
tags: [평행이동, 대칭이동, 치환적분, 등비급수]
