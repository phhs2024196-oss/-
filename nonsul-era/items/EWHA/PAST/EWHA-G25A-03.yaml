intent: |
  실수에서 정의된 함수가 도함수와 적분의 형태로 주어졌을 때, 주어진 관계식을 미분과 적분의 기본 성질로 분석하여 함수를 $x$에 대한 식으로 나타낸 뒤 $x$절편과 극값을 추론하는 수리적 문제 해결 능력을 평가한다. 부분적분으로 도함수가 포함된 적분을 함수가 포함된 적분으로 변형하는 능력과 계산 능력을 본다(공식 출제 의도 요지).
key_idea: |
  $\int_0^xe^{-t}f^{\prime}(t)\,dt$에 부분적분을 하면 $e^{-x}f(x)+1+F(x)$가 되어 주어진 식이 $F(x)=x^2-x$로 정리되고, 미분하면 $f(x)=e^x(2x-1)$이다.
stuck: |
  우변의 $e^{x-t}=e^x\cdot e^{-t}$로 분리한 뒤 부분적분으로 $f^{\prime}$을 $f$로 바꾸어 $F(x)$를 만드는 발상
idea_tags: [IDEA-PARTS-DERIV-TO-FUNC, IDEA-INTEGRAL-EQUATION-DIFFERENTIATE]
tags: [정적분으로 정의된 함수, 부분적분, 극값]
elements:
  materials:
  - '적분 방정식 $f(x)+(x^2-x+1)e^x=\int_0^xe^{x-t}f^{\prime}(t)\,dt$'
  - '$F(x)=\int_0^xe^{-t}f(t)\,dt$'
  concepts:
  - 정적분의 뜻(위끝=아래끝이면 0)
  - 부분적분법
  - 정적분과 미분의 관계
  - 지수함수의 미분
  - 극값 판정
  tools:
  - '$e^{x-t}=e^xe^{-t}$ 분리'
  - '$\int_0^xe^{-t}f^{\prime}(t)\,dt=e^{-x}f(x)-f(0)+\int_0^xe^{-t}f(t)\,dt$'
  - '$\dfrac{d}{dx}\int_0^xe^{-t}f(t)\,dt=e^{-x}f(x)$'
  conditions:
  - '$f(0)=-1$'
  - '$f^{\prime}(x)=e^x(2x+1)$의 부호 변화'
  stimuli_used: []
  subpart_links: '(2)는 (1)의 f(0)=-1을, (3)은 (2)의 F(x)=x²-x를 사용'

