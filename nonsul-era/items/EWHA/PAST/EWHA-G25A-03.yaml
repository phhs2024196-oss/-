stimuli: []

stem: |
  모든 실수 $x$에서 미분가능한 함수 $f(x)$에 대하여 $f^{\prime}(x)$가 연속이다. 함수 $f(x)$가 다음 식을 만족시킬 때,
  $$f(x)+(x^2-x+1)e^x=\int_0^xe^{x-t}f^{\prime}(t)\,dt$$
  아래 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    $f(0)=-1$임을 보이시오.
  points: 5
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=0$을 대입하면 우변은 0이다.
    steps:
    - {id: 1a, content: '$f(0)+1=0$', criteria: [1.B1]}
    hint_ladder:
    - 위끝과 아래끝이 같은 정적분의 값은?
  - id: S1-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅰ)」 p.11 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 식에 $x=0$을 대입하면 $f(0)=-(0^2-0+1)e^0+\displaystyle\int_0^0e^{0-t}f^{\prime}(t)\,dt=-e^0=-1$이다.
      criteria: [1.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: |
        주어진 식에 $x=0$을 대입하여 $f(0)=-1$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9356}
  misconceptions:
  - id: MC-CAL-9356
    outcome_code: '71'
    wrong_work: '$x=0$을 대입한 뒤 우변을 $f^{\prime}(0)$ 등으로 남겨 결론을 내지 못함'
    detect_cue: $\int_0^0$의 값을 0으로 처리하지 않았다
    feedback: 위끝과 아래끝이 같은 정적분은 피적분함수와 관계없이 0입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    함수 $F(x)$를 $F(x)=\displaystyle\int_0^xe^{-t}f(t)\,dt$라 할 때, $F(a)=0$이 되도록 하는 실수 $a$의 값을 모두 구하시오.
  points: 13
  depends_on: ['1']
  answer: {kind: set, value: '{0, 1}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 부분적분으로 우변을 $e^x(e^{-x}f(x)+1+F(x))$로 바꾸면 $F(x)=x^2-x$.
    steps:
    - {id: 2a, content: '$F(x)=x^2-x\Rightarrow a=0,1$', criteria: [2.M1, 2.A2, 2.A3]}
    hint_ladder:
    - $e^{x-t}=e^x\cdot e^{-t}$로 나누어 보자.
    - $e^{-t}f^{\prime}(t)$를 부분적분하면 $e^{-t}f(t)$의 적분이 나온다.
  - id: S2-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅰ)」 pp.11–12 예시 답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        부분적분법을 적용하면
        $$\int_0^xe^{-t}f^{\prime}(t)\,dt=\left[e^{-t}f(t)\right]_0^x+\int_0^xe^{-t}f(t)\,dt$$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $$=e^{-x}f(x)-f(0)+\int_0^xe^{-t}f(t)\,dt=e^{-x}f(x)+1+\int_0^xe^{-t}f(t)\,dt$$
        이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        따라서 $f(x)=-(x^2-x+1)e^x+e^x\displaystyle\int_0^xe^{-t}f^{\prime}(t)\,dt=-(x^2-x+1)e^x+f(x)+e^x+e^x\int_0^xe^{-t}f(t)\,dt$이 되고, 정리하면 $e^x\displaystyle\int_0^xe^{-t}f(t)\,dt=e^x(x^2-x)$이다. 양변을 $e^x$로 나누면 $F(x)=\displaystyle\int_0^xe^{-t}f(t)\,dt=x^2-x$를 얻는다.
      criteria: [2.A2]
    - id: 2b-4
      content: |
        따라서 $F(a)=0$을 만족하는 실수 $a$는 0 또는 1이다.
      criteria: [2.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $\int_0^xe^{-t}f^{\prime}(t)\,dt$에 부분적분을 적용했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $\int_0^xe^{-t}f^{\prime}(t)\,dt=e^{-x}f(x)+1+\int_0^xe^{-t}f(t)\,dt$를 유도했다.
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.B1], max_points: 5}
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $F(x)=\int_0^xe^{-t}f(t)\,dt=x^2-x$를 유도했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    - id: 2.A3
      mark_type: A
      points: 2
      evidence: |
        $F(a)=0$을 만족하는 실수 $a$는 0 또는 1임을 구했다(각 1점).
      depends_on: [2.M1, 2.A2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9357}
  misconceptions:
  - id: MC-CAL-9357
    outcome_code: '71'
    wrong_work: '$\int_0^xe^{-t}f^{\prime}\,dt=\left[e^{-t}f\right]_0^x-\int_0^xe^{-t}f\,dt$로 써서 $F(x)=x-x^2$ 또는 정리 불가'
    detect_cue: 부분적분 둘째 항의 부호가 $-$이다
    feedback: $(e^{-t})^{\prime}=-e^{-t}$이므로 둘째 항은 $+\int_0^xe^{-t}f(t)\,dt$가 됩니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    함수 $f(x)$의 극값을 모두 구하시오.
  points: 12
  depends_on: ['2']
  answer: {kind: value, value: '-2*exp(-1/2)', equivalents: ['-2/sqrt(e)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $F^{\prime}(x)=e^{-x}f(x)=2x-1$에서 $f(x)=e^x(2x-1)$, $f^{\prime}(x)=e^x(2x+1)$.
    steps:
    - {id: 3a, content: '$x=-\frac12$에서 극솟값 $-2e^{-1/2}$, 극댓값 없음', criteria: [3.M1, 3.A1, 3.A3]}
    hint_ladder:
    - (2)의 식을 미분하면 $f$가 나온다.
  - id: S3-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅰ)」 p.12 예시 답안
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2)의 결과로부터 $\displaystyle\int_0^xe^{-t}f(t)\,dt=x^2-x$이므로, 양변을 $x$에 대하여 미분하면 정적분과 미분의 관계에 의하여 $e^{-x}f(x)=2x-1$이 성립한다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        따라서 $f(x)=e^x(2x-1)$이다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        $f^{\prime}(x)=e^x(2x+1)$이므로 $f^{\prime}(x)=0$인 실수 $x$는 $-\dfrac12$뿐이다.
      criteria: [3.A2]
    - id: 3b-4
      content: |
        $x=-\dfrac12$의 좌우에서 $f^{\prime}(x)$의 부호가 음에서 양으로 바뀐다.
      criteria: [3.R1]
    - id: 3b-5
      content: |
        따라서 $f(x)$는 $x=-\dfrac12$에서 극솟값 $f\left(-\dfrac12\right)=-2e^{-\frac12}$을 가진다(극댓값은 없다).
      criteria: [3.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $\int_0^xe^{-t}f(t)\,dt=x^2-x$의 양변을 $x$에 대하여 미분했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A2], max_points: 3}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $f(x)=e^x(2x-1)$을 찾았다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: |
        $f^{\prime}(x)=0$인 실수 $x$는 $-\dfrac12$임을 보였다.
      depends_on: [3.M1, 3.A1]
      steps: [3b-3]
    - id: 3.R1
      mark_type: R
      points: 2
      evidence: |
        $x=-\dfrac12$의 좌우에서 $f^{\prime}(x)$의 부호가 음에서 양으로 바뀜을 확인했다.
      depends_on: [3.A2]
      steps: [3b-4]
    - id: 3.A3
      mark_type: A
      points: 2
      evidence: |
        $f(x)$는 $x=-\dfrac12$에서 극솟값 $f\left(-\dfrac12\right)=-2e^{-\frac12}$을 가짐을 보였다.
      depends_on: [3.R1]
      steps: [3b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9358}
  misconceptions:
  - id: MC-CAL-9358
    outcome_code: '71'
    wrong_work: '$f^{\prime}(-\tfrac12)=0$이므로 극댓값 $-2e^{-1/2}$'
    detect_cue: 부호 변화 서술이 없고 극대·극소 판정이 없거나 틀렸다
    feedback: 도함수가 0인 점의 좌우에서 부호가 음→양이면 극소, 양→음이면 극대입니다. 부호 변화를 적으세요.
    remedy: [RL-3]

