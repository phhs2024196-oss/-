stem: |
  양의 실수 $a$에 대하여 아래 물음에 답하시오. [35점]

subparts:
- id: '1'
  stem: |
    좌표평면 위의 점 $\mathrm{P}(x,y)$에서 점 $\mathrm{A}(0,3)$까지의 거리를 $b$, 점 $\mathrm{P}(x,y)$에서 점 $\mathrm{B}(0,5)$까지의 거리를 $c$라 할 때, $b+c=4$이다. 이때 점 $\mathrm{P}$가 그리는 도형 $S$의 방정식을 구하시오.
  points: 6
  depends_on: []
  answer: {kind: expression, value: 'x**2/3+(y-4)**2/4=1', equivalents: ['4*x**2+3*y**2-24*y+36=0'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 초점 $(0,3),(0,5)$, 장축 길이 4인 타원 — 중심 $(0,4)$, $b^2=4-1=3$.
    steps:
    - {id: 1a, content: '$\dfrac{x^2}{3}+\dfrac{(y-4)^2}{4}=1$', criteria: [1.M1, 1.A2]}
    hint_ladder:
    - 두 초점까지 거리의 합이 일정한 점의 자취는?
  - id: S1-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅱ)」 p.4 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $b+c=4$이므로 $\sqrt{x^2+(y-3)^2}+\sqrt{x^2+(y-5)^2}=4$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 점 $\mathrm{P}(x,y)$는 $4x^2+3y^2-24y+36=0$을 만족시킨다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        따라서 점 $\mathrm{P}$가 그리는 도형 $S$의 방정식은 타원의 방정식 $\dfrac{x^2}{3}+\dfrac{(y-4)^2}{4}=1$이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        조건 $b+c=4$로부터 $\sqrt{x^2+(y-3)^2}+\sqrt{x^2+(y-5)^2}=4$를 설정했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        점 $\mathrm{P}(x,y)$가 만족시키는 방정식 $4x^2+3y^2-24y+36=0$을 유도했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        도형 $S$의 방정식이 타원의 방정식 $\dfrac{x^2}{3}+\dfrac{(y-4)^2}{4}=1$임을 보였다.
      depends_on: [1.M1]
      implied_ok: true
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9359}
  misconceptions:
  - id: MC-GEO-9359
    outcome_code: '71'
    wrong_work: '$\dfrac{x^2}{4}+\dfrac{(y-4)^2}{3}=1$'
    detect_cue: 장축이 $x$축 방향으로 적혀 있다
    feedback: 초점이 $y$축 위에 있으므로 장축은 $y$축 방향이고 $(y-4)^2$의 분모가 $2^2=4$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    좌표평면 위의 점 $\mathrm{Q}(x,y)$에서 점 $\mathrm{A}(0,3)$까지의 거리를 $d$, 점 $\mathrm{Q}$와 $x$축까지의 거리를 $e$라 할 때, $d+e=a$이다. 이때 $y\ge0$인 점 $\mathrm{Q}$가 그리는 도형 $T$의 방정식을 구하시오.
  points: 11
  depends_on: []
  answer: {kind: expression, value: 'a=3: x=0 (0<=y<=3); a>3: y=-x**2/(2*(a-3))+(a+3)/2 (y>=0); 0<a<3: empty', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\sqrt{x^2+(y-3)^2}=a-y$ (단 $y\le a$)를 제곱하면 $x^2=2(3-a)y-9+a^2$; $a=3$, $a>3$, $a<3$으로 나눈다.
    steps:
    - {id: 2a, content: '$a=3$: 선분, $a>3$: 위로 볼록인 포물선의 $y\ge0$ 부분, $a<3$: $d+e\ge3>a$라 공집합', criteria: [2.M2, 2.A2, 2.A4]}
    hint_ladder:
    - $y$를 이항하고 제곱하기 전에 양변의 부호 조건을 적어 두자.
    - $a=3$이면 $y$항이 사라진다.
  - id: S2-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅱ)」 p.4 예시 답안(단계 2b-6의 a<3 처리는 공식 답안 보정)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $d+e=a$이고 $y\ge0$이므로 $\sqrt{x^2+(y-3)^2}+y=a$를 얻는다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $y$를 이항하여 양변을 제곱하면 $x^2+(y-3)^2=(a-y)^2$이다(제곱 전 식에서 $a-y\ge0$).
      criteria: [2.A1]
    - id: 2b-3
      content: |
        $a=3$인 경우와 $a\ne3$인 경우로 구분한다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        (i) $a=3$인 경우, $x=0$이다. 이때 조건 $d+e=a$로부터 $\lvert y-3\rvert+\lvert y\rvert=3$을 얻는다. 즉 점 $\mathrm{Q}$가 그리는 도형 $T$의 방정식은 $x=0$, $0\le y\le3$이다.
      criteria: [2.A2, 2.A3]
    - id: 2b-5
      content: |
        (ii) $a\ne3$인 경우, 점 $\mathrm{Q}(x,y)$는 $x^2-6y+9=a^2-2ay$를 만족시킨다. 따라서 도형 $T$는 포물선 $y=\dfrac{1}{2(3-a)}(x^2+9-a^2)=\dfrac{1}{2(3-a)}x^2+\dfrac{3+a}{2}$의 $x$축 위쪽 부분에 포함된다.
      criteria: [2.A4]
    - id: 2b-6
      content: |
        [보정] 제곱 전 조건 $y\le a$를 확인한다. $a>3$이면 포물선은 위로 볼록이고 꼭짓점의 $y$좌표 $\dfrac{3+a}{2}<a$이므로 $y\ge0$인 부분 전체가 $T$이다. $0<a<3$이면 꼭짓점의 $y$좌표 $\dfrac{3+a}{2}>a$이고 포물선은 아래로 볼록이므로 $y\le a$를 만족하는 점이 없다. 실제로 $y\ge0$이면 $d+e\ge\lvert y-3\rvert+y\ge3>a$이므로 $T$는 공집합이다. 공식 예시 답안은 $a\ne3$ 전체에서 $T$를 포물선의 $x$축 위쪽 부분이라 적었으나 $0<a<3$에서는 성립하지 않는다.
      criteria: [2.A5]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        조건 $d+e=a$와 $y\ge0$으로부터 $\sqrt{x^2+(y-3)^2}+y=a$를 설정했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        정리하여 방정식 $x^2+(y-3)^2=(a-y)^2$을 유도했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $a=3$인 경우와 $a\ne3$인 경우로 구분했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $a=3$인 경우 $x=0$임을 보이고, 이때 $\lvert y-3\rvert+\lvert y\rvert=3$임을 보였다.
      depends_on: [2.M2]
      steps: [2b-4]
    - id: 2.A3
      mark_type: A
      points: 1
      evidence: |
        도형 $T$의 방정식이 $x=0$, $0\le y\le3$임을 보였다.
      depends_on: [2.A2]
      implied_ok: true
      steps: [2b-4]
    - id: 2.A4
      mark_type: A
      points: 2
      evidence: |
        $a\ne3$인 경우 $x^2-6y+9=a^2-2ay$가 성립함을 보였다.
      depends_on: [2.M2]
      steps: [2b-5]
    - id: 2.A5
      mark_type: A
      points: 1
      evidence: |
        도형 $T$의 방정식이 포물선 $y=\dfrac{1}{2(3-a)}x^2+\dfrac{3+a}{2}$, $y\ge0$임을 보였다(공식 채점 기준 문구). 보정: 이 포물선이 $T$가 되는 것은 $a>3$일 때이며, $0<a<3$이면 $T$는 공집합이다.
      depends_on: [2.M2, 2.A4]
      steps: [2b-6]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9361}
  - {code: '72', misconception: MC-GEO-9360}
  misconceptions:
  - id: MC-GEO-9361
    outcome_code: '71'
    wrong_work: '$a$에 관계없이 $y=\dfrac{x^2+9-a^2}{2(3-a)}$로 답함'
    detect_cue: $a=3$일 때 분모가 0이 되는 경우를 따로 다루지 않았다
    feedback: $a=3$이면 $y$항이 소거되어 $x=0$이 됩니다. 이 경우를 분리하세요.
    remedy: [RL-2]
  - id: MC-GEO-9360
    outcome_code: '72'
    wrong_work: '$0<a<3$에서도 $T$를 포물선 $y=\dfrac{x^2}{2(3-a)}+\dfrac{3+a}{2}$의 $x$축 위쪽 부분이라 답함'
    detect_cue: 제곱 전 조건 $a-y\ge0$을 확인한 흔적이 없다
    feedback: 제곱하기 전 $\sqrt{\cdots}=a-y\ge0$이어야 합니다. $a<3$이면 포물선 위의 점은 모두 $y>a$라 조건을 만족하지 않습니다.
    remedy: [RL-3]

- id: '3'
  stem: |
    언급된 (1), (2)의 두 도형 $S$, $T$가 서로 다른 두 점에서 만나도록 하는 실수 $a$의 값의 범위와 이때 두 교점의 좌표를 구하시오.
  points: 18
  depends_on: ['1', '2']
  answer: {kind: expression, value: '3<a<9; (+-sqrt((a-3)*(9-a)/3), 2*a/3)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 교점의 $y$는 $3y^2-8ay+4a^2=0$에서 $2a$ 또는 $\dfrac{2a}{3}$이고, $T$ 위의 점은 $y\le a$이므로 $y=\dfrac{2a}{3}$만 가능하며 $2<\dfrac{2a}{3}<6$이어야 두 점.
    steps:
    - {id: 3a, content: '$3<a<9$, 교점 $\left(\pm\sqrt{\dfrac{(a-3)(9-a)}{3}},\,\dfrac{2a}{3}\right)$', criteria: [3.A2, 3.A3]}
    hint_ladder:
    - 두 식에서 $x^2$을 소거하면 $y$의 이차방정식이 된다.
    - $T$ 위의 점은 $y\le a$를 만족해야 한다.
  - id: S3-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅱ)」 pp.5–6 예시 답안(단계 3b-7·3b-8의 1≤a<3 처리는 공식 답안 보정)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        도형 $S$: $\dfrac{x^2}{3}+\dfrac{(y-4)^2}{4}=1$은 $2\le y\le6$인 범위에 있는 타원이다. (i) $a=3$인 경우, 도형 $T$: $x=0$, $0\le y\le3$은 타원 $S$와 점 $(0,2)$에서만 만난다.
      criteria: [3.B1]
    - id: 3b-2
      content: |
        (ii) $a\ne3$인 경우, 도형 $T$는 $x^2=2(3-a)y-9+a^2$ $(y\ge0)$을 만족시키고, 도형 $S$는 $4x^2=12-3(y-4)^2$ $(2\le y\le6)$이므로 교점의 $y$좌표는 $12-3(y-4)^2=8(3-a)y-36+4a^2$ $(2\le y\le6)$을 만족시킨다.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        식을 정리하면 $3y^2-8ay+4a^2=0$ $(2\le y\le6)$이고, $y=2a,\ \dfrac{2a}{3}$이다.
      criteria: [3.A1]
    - id: 3b-4
      content: |
        $a$가 양의 실수이므로 $2a<2$이거나 $\dfrac{2a}{3}>6$인 경우, 즉 $a<1$이거나 $a>9$인 경우는 두 근이 모두 $[2,6]$ 밖이므로 도형 $S$와 도형 $T$는 만나지 않는다.
      criteria: [3.B2]
    - id: 3b-5
      content: |
        포물선의 꼭짓점 $\left(0,\dfrac{3+a}{2}\right)$은 $1<a<3$ 또는 $3<a<9$인 범위에서 타원의 안쪽에 있고, $a=1$이거나 $a=9$이면 타원 위에 있다.
      criteria: [3.R1]
    - id: 3b-6
      content: |
        (ㄱ) $3<a\le9$인 경우, $2a>6$이므로 교점의 $y$좌표는 $y=\dfrac{2a}{3}$이다. 이때 포물선은 위로 볼록이므로 두 도형의 교점은 $\left(\pm\sqrt{\dfrac{(a-3)(9-a)}{3}},\,\dfrac{2a}{3}\right)$이다. 따라서 $3<a<9$에서는 두 개의 교점을, $a=9$에서는 한 개의 교점 $(0,6)$을 갖는다. ($y=\dfrac{2a}{3}\le a$이므로 제곱 전 조건도 만족한다.)
      criteria: [3.A2, 3.A3]
    - id: 3b-7
      content: |
        (ㄴ) $1\le a<3$인 경우, $\dfrac{2a}{3}<2$이므로 후보는 $y=2a$뿐이다. 공식 예시 답안은 이로부터 교점 $\left(\pm\sqrt{(a-1)(3-a)},\,2a\right)$를 얻었으나, $y=2a>a$이므로 제곱 전 조건 $\sqrt{x^2+(y-3)^2}=a-y\ge0$을 만족하지 않는다. 예를 들어 $a=2$일 때 $(1,4)$에서 $d+e=\sqrt2+4\ne2$이다. (2)에서 본 대로 $0<a<3$이면 $T$가 공집합이므로 교점이 없다.
      criteria: [3.A4]
    - id: 3b-8
      content: |
        따라서 도형 $S$와 도형 $T$가 서로 다른 두 점에서 만나도록 하는 $a$의 범위는 $3<a<9$이고, 이때 교점은 $\left(\pm\sqrt{\dfrac{(a-3)(9-a)}{3}},\,\dfrac{2a}{3}\right)$이다. (공식 답: 「$1<a<3$일 때 $\left(\pm\sqrt{(a-1)(3-a)},2a\right)$이고, $3<a<9$일 때 $\left(\pm\sqrt{\dfrac{(a-3)(9-a)}{3}},\dfrac{2a}{3}\right)$」 — 앞부분은 무연근이다.)
      criteria: [3.A5]
