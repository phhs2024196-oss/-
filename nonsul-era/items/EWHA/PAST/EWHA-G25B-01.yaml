intent: |
  두 점 사이의 거리와 점과 축 사이의 거리의 합으로 결정되는 도형을 파악하고, 해당하는 도형들이 만나는 조건과 교점을 구하는 문제이다. 거리 조건으로부터 도형의 방정식을 유도하는 수리적 조작 능력과, 도형들이 만나는 조건을 만족시키는 범위·교점을 결정하는 수리적 추론 능력을 평가한다(공식 출제 의도 요지).
key_idea: |
  $S$는 초점 $(0,3),(0,5)$인 타원 $\dfrac{x^2}{3}+\dfrac{(y-4)^2}{4}=1$, $T$는 초점 $\mathrm{A}$·준선 $y=a$인 포물선의 $y\ge0$ 부분이다. 교점의 $y$좌표는 $3y^2-8ay+4a^2=0$의 근 $y=2a,\ \dfrac{2a}{3}$ 중 $2\le y\le6$이고 $y\le a$인 것이다.
stuck: |
  $\sqrt{x^2+(y-3)^2}=a-y$를 제곱할 때 생기는 조건 $y\le a$(즉 $d+e\ge3$이므로 $a<3$이면 $T$가 공집합)를 놓치지 않는 것, 그리고 $a=3$을 따로 분류하는 것
idea_tags: [IDEA-LOCUS-FOCUS-DIRECTRIX, IDEA-SQUARING-SIGN-CONDITION, IDEA-PARAMETER-CASE-SPLIT]
tags: [타원, 포물선, 자취, 공식 답 오류]
