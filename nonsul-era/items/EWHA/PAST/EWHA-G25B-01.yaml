  tools:
  - '근호 이항 후 제곱'
  - '$y$좌표에 관한 이차방정식 $3y^2-8ay+4a^2=0$'
  - '포물선 꼭짓점 $\left(0,\dfrac{3+a}{2}\right)$의 위치'
  conditions:
  - '$S$: $2\le y\le6$'
  - '$T$: $y\ge0$이고 제곱 전 조건 $y\le a$'
  - '$a=3$일 때 $T$는 선분 $x=0$, $0\le y\le3$'
