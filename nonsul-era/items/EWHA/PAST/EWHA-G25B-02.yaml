stimuli: []

stem: |
  구간 $[0,\infty)$에서 정의된 연속함수 $f(x)$가 다음 조건을 만족시킬 때,

  $2^{n-1}-1\le x<2^n-1$일 때, $f(x)=\sqrt{2^{n-1}(x+1)-2^{2n-2}}+2^{n-1}-1$이다. (단, $n=1,2,3,\cdots$이다.)

  아래 물음에 답하시오. [35점]

subparts:
- id: '1'
  stem: |
    함수 $f(x)$가 구간 $[0,\infty)$에서 증가함을 보이시오.
  points: 11
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 각 구간에서 증가하고, 구간 끝에서 $f(a_n)=a_n$이므로 다른 구간의 두 점은 $f(x)<a_{m+1}\le a_n\le f(y)$.
    steps:
    - {id: 1a, content: '같은 구간 / 다른 구간으로 나눠 $f(x)<f(y)$', criteria: [1.M1, 1.R1, 1.R2]}
    hint_ladder:
    - 구간의 양 끝에서 $f$의 값은 얼마인가?
  - id: S1-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅱ)」 p.8 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        실수 $x,y$가 $0\le x<y$를 만족한다. 수열 $\{a_n\}$을 $a_n=2^{n-1}-1$이라 하면, 어떤 자연수 $m,n$에 대하여 $a_m\le x<a_{m+1}$, $a_n\le y<a_{n+1}$이다. $x<y$이므로 $m\le n$을 만족한다. (공식 예시 답안에는 이 단계에서 $a_n=2^n-1$로 적혀 있으나, 구간 표기와 (2)에 맞추어 $a_n=2^{n-1}-1$로 적는다.)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (i) $m=n$인 경우, $a_n\le x<y<a_{n+1}$이다. 함수 $\sqrt{2^{n-1}(x+1)-2^{2n-2}}+2^{n-1}-1$은 구간 $[a_n,a_{n+1}]$에서 증가하므로 $f(a_n)\le f(x)<f(y)$이다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        (ii) $m<n$인 경우, $a_m\le x<a_{m+1}\le a_n\le y<a_{n+1}$이다. 함수 $f(x)$는 각각의 닫힌구간 $[a_m,a_{m+1}]$, $[a_n,a_{n+1}]$에서 증가하고 $f(a_m)=a_m$, $f(a_{m+1})=a_{m+1}$, $f(a_n)=a_n$이므로 $a_m\le f(x)<a_{m+1}\le a_n\le f(y)$이다. 따라서 함수 $f(x)$는 구간 $[0,\infty)$에서 증가한다.
      criteria: [1.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        임의의 $0\le x<y$인 $x,y$에 대해 $a_m\le x<a_{m+1}$, $a_n\le y<a_{n+1}$인 자연수 $m,n$을 찾았다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        $m=n$인 경우 $f(x)<f(y)$임을 보였다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R2
      mark_type: R
      points: 4
      evidence: |
        $m<n$인 경우 $f(x)<f(y)$임을 보였다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9362}
  misconceptions:
  - id: MC-CAL-9362
    outcome_code: '71'
    wrong_work: '각 구간에서 근호 안이 증가하므로 $f$는 증가한다고만 씀'
    detect_cue: 서로 다른 구간의 두 점 비교(또는 끝값 $f(a_n)=a_n$ 연결)가 없다
    feedback: 구간별 증가만으로는 전체 증가가 보장되지 않습니다. 구간 끝에서의 값이 이어짐($f(a_n)=a_n$)을 이용해 다른 구간의 점을 비교하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    수열 $\{a_n\}$이 모든 자연수 $n$에 대하여 $a_n=2^{n-1}-1$일 때, $\displaystyle\int_{a_n}^{a_{n+1}}f(x)\,dx$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '5*2**(2*n-2)/3-2**(n-1)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $t=x+1-2^{n-1}$이면 피적분함수가 $\sqrt{2^{n-1}t}+2^{n-1}-1$, 구간 $[0,2^{n-1}]$.
    steps:
    - {id: 2a, content: '$\dfrac23\cdot2^{2n-2}+(2^{n-1}-1)2^{n-1}=\dfrac53\cdot2^{2n-2}-2^{n-1}$', criteria: [2.M2, 2.A1]}
    hint_ladder:
    - 근호 안을 $2^{n-1}(x+1-2^{n-1})$로 묶어 보자.
  - id: S2-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅱ)」 p.9 예시 답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        자연수 $n$에 대하여 $\displaystyle\int_{a_n}^{a_{n+1}}f(x)\,dx=\int_{2^{n-1}-1}^{2^n-1}\left(\sqrt{2^{n-1}(x+1)-2^{2n-2}}+2^{n-1}-1\right)dx$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $t=x+1-2^{n-1}$로 치환하면 $\displaystyle\int_0^{2^{n-1}}\left(\sqrt{2^{n-1}t}+2^{n-1}-1\right)dt$이다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $$=\left[\dfrac{2^{\frac{n+1}{2}}t^{\frac32}}{3}+(2^{n-1}-1)t\right]_0^{2^{n-1}}=\dfrac53\times2^{2n-2}-2^{n-1}$$
        이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $f(x)$의 정의를 활용하여 $\int_{a_n}^{a_{n+1}}f(x)\,dx=\int_{2^{n-1}-1}^{2^n-1}\left(\sqrt{2^{n-1}(x+1)-2^{2n-2}}+2^{n-1}-1\right)dx$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        치환적분법을 활용하여 $\int_0^{2^{n-1}}\left(\sqrt{2^{n-1}t}+2^{n-1}-1\right)dt$를 얻었다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        함수 $\sqrt x$의 부정적분을 활용하여 $\int_{a_n}^{a_{n+1}}f(x)\,dx=\dfrac53\times2^{2n-2}-2^{n-1}$을 얻었다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9363}
  misconceptions:
  - id: MC-CAL-9363
    outcome_code: '71'
    wrong_work: '치환 후에도 구간을 $[2^{n-1}-1,\,2^n-1]$로 두고 계산'
    detect_cue: $t$에 관한 적분인데 구간이 $x$의 구간 그대로이다
    feedback: $t=x+1-2^{n-1}$이면 $x=2^{n-1}-1$일 때 $t=0$, $x=2^n-1$일 때 $t=2^{n-1}$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    함수 $f(x)$의 역함수를 $g(x)$라 할 때, (2)에서 언급된 수열 $\{a_n\}$에 대하여, $\displaystyle\int_{a_n}^{a_{n+1}}g(x)\,dx$의 값을 구하시오.
  points: 14
  depends_on: ['1', '2']
  answer: {kind: expression, value: '4*2**(2*n-2)/3-2**(n-1)', equivalents: ['2**(2*n)/3-2**(n-1)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f(a_n)=a_n$이므로 $\int f+\int g=a_{n+1}^2-a_n^2$.
    steps:
    - {id: 3a, content: '$B_n=3\cdot2^{2n-2}-2^n-A_n=\dfrac43\cdot2^{2n-2}-2^{n-1}$', criteria: [3.M1, 3.A1, 3.A2]}
    hint_ladder:
    - 구간 양 끝점이 고정점이다. 그래프와 역함수 그래프 사이의 넓이를 그림으로 보자.
  - id: S3-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅱ)」 p.9 예시 답안
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1)의 결과로부터 모든 자연수 $n$에 대하여 $f(a_n)=a_n$이고, 따라서 $g(a_n)=a_n$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $A_n=\displaystyle\int_{a_n}^{a_{n+1}}f(x)\,dx$, $B_n=\displaystyle\int_{a_n}^{a_{n+1}}g(x)\,dx$라 하면 $A_n+B_n=a_{n+1}^2-a_n^2=(2^n-1)^2-(2^{n-1}-1)^2=3\times2^{2n-2}-2^n$이다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        (2)의 결과에 의해서 $A_n=\dfrac53\times2^{2n-2}-2^{n-1}$이므로 $B_n=\dfrac43\times2^{2n-2}-2^{n-1}$이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        모든 자연수 $n$에 대하여 $f(a_n)=a_n$임을 통해 $g(a_n)=a_n$임을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        $\int_{a_n}^{a_{n+1}}f(x)\,dx+\int_{a_n}^{a_{n+1}}g(x)\,dx=3\times2^{2n-2}-2^n$임을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 5
      evidence: |
        $\int_{a_n}^{a_{n+1}}g(x)\,dx=\dfrac43\times2^{2n-2}-2^{n-1}$임을 얻었다.
      depends_on: [3.M1, 3.A1]
      ft: {allowed: true, from: [2.A1], max_points: 5}
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9364}
  - {code: '72', misconception: MC-CAL-9352}
  misconceptions:
  - id: MC-CAL-9364
    outcome_code: '71'
    wrong_work: '$A_n+B_n=(a_{n+1}-a_n)^2=2^{2n-2}$'
    detect_cue: 넓이 관계식의 우변이 $(a_{n+1}-a_n)^2$이다
    feedback: 두 넓이의 합은 큰 정사각형에서 작은 정사각형을 뺀 L자 모양, 즉 $a_{n+1}^2-a_n^2$입니다.
    remedy: [RL-3]
  - id: MC-CAL-9352
    outcome_code: '72'
    wrong_work: '$B_n=A_n$으로 답함'
    detect_cue: 답이 (2)와 같다
    feedback: 역함수의 정적분은 원함수의 정적분과 같지 않습니다. 직선 $y=x$에 대한 대칭과 넓이 관계를 쓰세요.
    remedy: [RL-4]

