intent: |
  주어진 함수의 조건들을 통하여 주어진 함수가 증가함을 보이고 특정 구간에서의 주어진 함수의 정적분 값과 역함수의 정적분 값을 추론하는 수리적 조작 능력, 수리적 계산 능력, 수리적 추론 능력을 종합적으로 평가한다(공식 출제 의도).
key_idea: |
  $a_n=2^{n-1}-1$에서 $f(a_n)=a_n$이고 각 구간에서 $f$는 증가하므로 전체에서 증가한다. $t=x+1-2^{n-1}$ 치환으로 $\int_{a_n}^{a_{n+1}}f=\dfrac53\cdot2^{2n-2}-2^{n-1}$, 역함수 넓이 관계 $\int f+\int g=a_{n+1}^2-a_n^2$로 $\int g$를 얻는다.
stuck: |
  서로 다른 구간에 놓인 두 점의 비교를 구간 끝값 $f(a_n)=a_n$으로 연결하는 것과, 역함수 적분을 넓이 관계로 바꾸는 발상
