stimuli: []

stem: |
  모든 자연수 $n$에 대하여 수열 $\{a_n\}$, $\{b_n\}$, $\{c_n\}$을 다음과 같이 정의할 때,
  $$a_n=\int_0^{\frac{\pi}{2}}\cos^{n-1}x\,dx,\qquad b_n=\dfrac{a_{2n+1}}{a_{2n}},\qquad c_n=\dfrac{a_{2n-1}}{a_{2n}}$$
  아래 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    모든 자연수 $n$에 대하여 $a_{n+2}=\dfrac{n}{n+1}a_n$임을 보이시오.
  points: 5
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\cos^{n+1}x=\cos^nx(\sin x)^{\prime}$로 부분적분하면 $n\int\cos^{n-1}x\sin^2x\,dx=na_n-na_{n+2}$.
    steps:
    - {id: 1a, content: '$a_{n+2}=na_n-na_{n+2}$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $\cos^{n+1}x$에서 $\cos x$ 하나를 $(\sin x)^{\prime}$로 보자.
  - id: S1-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅱ)」 p.12 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        각 자연수 $n$에 대하여 $a_{n+2}=\displaystyle\int_0^{\frac{\pi}{2}}\cos^{n+1}x\,dx=\int_0^{\frac{\pi}{2}}\cos^nx(\sin x)^{\prime}\,dx$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        부분적분법을 이용하면
        $$a_{n+2}=\left[\cos^nx\sin x\right]_0^{\frac{\pi}{2}}-\int_0^{\frac{\pi}{2}}(\cos^nx)^{\prime}\sin x\,dx=n\int_0^{\frac{\pi}{2}}\cos^{n-1}x\sin^2x\,dx=na_n-na_{n+2}$$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        이므로 $a_{n+2}=\dfrac{n}{n+1}a_n$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        $\cos x=(\sin x)^{\prime}$의 변형을 했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        부분적분을 이용하여 $a_{n+2}=na_n-na_{n+2}$를 구했다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $a_{n+2}=\dfrac{n}{n+1}a_n$ 결과를 도출했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9365}
  misconceptions:
  - id: MC-CAL-9365
    outcome_code: '71'
    wrong_work: '$(\cos^nx)^{\prime}=n\cos^{n-1}x$로 써서 $\int\cos^{n-1}x\sin x\,dx$가 남음'
    detect_cue: $\sin^2x$가 나타나지 않는다
    feedback: $(\cos^nx)^{\prime}=-n\cos^{n-1}x\sin x$입니다. 속미분 $-\sin x$를 챙기세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    수열 $\{b_n\}$이 수렴할 때, $\displaystyle\lim_{n\to\infty}b_n$의 값과 $\displaystyle\lim_{n\to\infty}c_n$의 값을 각각 구하시오.
  points: 12
  depends_on: ['1']
  answer: {kind: value, value: 'lim b_n = 1; lim c_n = 1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $c_n=\dfrac{2n}{2n-1}b_n$이고 $b_n\le1\le c_n$이므로 두 극한은 같고 1이다.
    steps:
    - {id: 2a, content: '$\lim b_n=\lim c_n$, $\lim b_n\le1\le\lim c_n$', criteria: [2.M1, 2.R1, 2.A3]}
    hint_ladder:
    - $\{a_n\}$은 감소수열인가?
  - id: S2-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅱ)」 pp.12–13 예시 답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a_{n+2}=\dfrac{n}{n+1}a_n$을 이용하면 $b_n=\dfrac{a_{2n+1}}{a_{2n}}=\dfrac{2n-1}{2n}\times\dfrac{a_{2n-1}}{a_{2n}}=\dfrac{2n-1}{2n}c_n$이고, $c_n=\dfrac{2n}{2n-1}b_n$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $\displaystyle\lim_{n\to\infty}\dfrac{2n}{2n-1}=1$이므로 수열의 극한에 대한 기본 성질을 이용하면 $\displaystyle\lim_{n\to\infty}c_n=\lim_{n\to\infty}\dfrac{2n}{2n-1}\times\lim_{n\to\infty}b_n=\lim_{n\to\infty}b_n$이다. (공식 예시 답안에는 $\dfrac{2n+1}{2n}$으로 적혀 있으나 $\dfrac{2n}{2n-1}$이 맞다. 극한값은 같다.)
      criteria: [2.A1]
    - id: 2b-3
      content: |
        한편, $0\le x\le\dfrac{\pi}{2}$에서 $0\le\cos x\le1$이므로 각 자연수 $n$에 대하여 $0\le\cos^nx\le\cos^{n-1}x$이고, $\cos^{n-1}x$와 $\cos^nx$로 둘러싸인 도형의 넓이는 $\displaystyle\int_0^{\frac{\pi}{2}}(\cos^{n-1}x-\cos^nx)\,dx\ge0$이다. 정적분의 성질로부터 $a_{n+1}\le a_n$이다.
      criteria: [2.R1]
    - id: 2b-4
      content: |
        이를 이용하면 $b_n=\dfrac{a_{2n+1}}{a_{2n}}\le\dfrac{a_{2n}}{a_{2n}}=1$이고 $c_n=\dfrac{a_{2n-1}}{a_{2n}}\ge\dfrac{a_{2n}}{a_{2n}}=1$이다.
      criteria: [2.A2]
    - id: 2b-5
      content: |
        수열의 극한의 대소 관계에 의해 $\displaystyle\lim_{n\to\infty}b_n\le1$이고 $\displaystyle\lim_{n\to\infty}c_n\ge1$이므로 $\displaystyle\lim_{n\to\infty}b_n=\lim_{n\to\infty}c_n=1$이다.
      criteria: [2.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $a_{n+2}=\dfrac{n}{n+1}a_n$을 이용하여 $c_n=\dfrac{2n}{2n-1}b_n$을 도출했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        수열의 극한의 기본 성질을 이용하여 $\lim b_n=\lim c_n$임을 도출했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        두 곡선으로 둘러싸인 도형의 넓이의 정의 및 정적분의 성질로부터 $a_{n+1}\le a_n$임을 도출했다.
      depends_on: []
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $a_{n+1}\le a_n$을 이용하여 $b_n\le1$, $c_n\ge1$을 도출했다.
      depends_on: [2.R1]
      steps: [2b-4]
    - id: 2.A3
      mark_type: A
      points: 2
      evidence: |
        수열의 극한의 대소 관계 및 두 극한값이 같음을 이용하여 $\lim b_n=\lim c_n=1$임을 도출했다.
      depends_on: [2.A1, 2.A2]
      implied_ok: true
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9366}
  misconceptions:
  - id: MC-CAL-9366
    outcome_code: '71'
    wrong_work: '$b_n=\dfrac{2n-1}{2n}c_n$에서 극한을 같다고만 놓고 값 1을 근거 없이 씀'
    detect_cue: $a_{n+1}\le a_n$ 또는 $b_n\le1\le c_n$ 같은 대소 관계가 없다
    feedback: 두 극한이 같다는 것만으로는 값이 정해지지 않습니다. $b_n\le1\le c_n$을 보여 끼워 넣으세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    수열 $\{b_n\}$이 수렴할 때, $\displaystyle\lim_{n\to\infty}\dfrac{1^2\times3^2\times\cdots\times(2n-1)^2}{2^2\times4^2\times\cdots\times(2n)^2}\times n$의 값을 구하시오.
  points: 13
  depends_on: ['1', '2']
  answer: {kind: value, value: '1/pi', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 주어진 곱은 $\dfrac{n}{a_1^2}a_{2n+1}^2=\dfrac1\pi\cdot\dfrac{4n}{\pi}a_{2n+1}^2=\dfrac1\pi b_n\to\dfrac1\pi$.
    steps:
    - {id: 3a, content: '$\dfrac{4n}{\pi}a_{2n+1}^2=b_n\to1$이므로 답 $\dfrac1\pi$', criteria: [3.M1, 3.A2, 3.A3]}
    hint_ladder:
    - $\dfrac{a_{2k+1}}{a_{2k-1}}=\dfrac{2k-1}{2k}$이다.
    - $a_{2n+1}a_{2n}$을 $n$으로 나타내 보자.
  - id: S3-B
    audience: B
    source_flow: 「2025 논술고사 답안지(자연 Ⅱ)」 p.13 예시 답안
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $a_{n+2}=\dfrac{n}{n+1}a_n$을 이용하면 $a_{2n+1}a_{2n}=\dfrac{n-1}{n}a_{2n-1}a_{2n-2}$이다. $a_1=\displaystyle\int_0^{\frac{\pi}{2}}1\,dx=\dfrac{\pi}{2}$과 $a_2=\displaystyle\int_0^{\frac{\pi}{2}}\cos x\,dx=1$이므로, 위 결과를 귀납적 방법으로 활용하면 $a_{2n+1}a_{2n}=\dfrac{\pi}{4n}$이 된다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $b_n=\dfrac{a_{2n+1}}{a_{2n}}=\dfrac{4n}{\pi}(a_{2n+1})^2$이 된다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        따라서 (2)의 결과로부터 $1=\displaystyle\lim_{n\to\infty}b_n=\lim_{n\to\infty}\dfrac{4n}{\pi}(a_{2n+1})^2$을 얻는다.
      criteria: [3.A2]
    - id: 3b-4
      content: |
        $\dfrac{a_{2n+1}}{a_{2n-1}}=\dfrac{2n-1}{2n}$을 이용하면 $\dfrac{1^2\times3^2\times\cdots\times(2n-1)^2}{2^2\times4^2\times\cdots\times(2n)^2}\times n=\left(\dfrac{a_3}{a_1}\right)^2\times\left(\dfrac{a_5}{a_3}\right)^2\times\cdots\times\left(\dfrac{a_{2n+1}}{a_{2n-1}}\right)^2\times n=\dfrac{n}{a_1^2}(a_{2n+1})^2$이다.
      criteria: [3.M2]
    - id: 3b-5
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}\dfrac{n}{a_1^2}(a_{2n+1})^2=\dfrac1\pi\times\lim_{n\to\infty}\dfrac{4n}{\pi}(a_{2n+1})^2=\dfrac1\pi$이다.
      criteria: [3.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $a_{n+2}=\dfrac{n}{n+1}a_n$을 이용하여 $a_{2n+1}a_{2n}=\dfrac{\pi}{4n}$임을 도출했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $a_{2n+1}a_{2n}=\dfrac{\pi}{4n}$과 $b_n$의 정의로부터 $b_n=\dfrac{4n}{\pi}(a_{2n+1})^2$이 됨을 도출했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: |
        $\lim b_n=1$을 이용하여 $\lim\dfrac{4n}{\pi}(a_{2n+1})^2=1$임을 도출했다.
      depends_on: [3.M1, 3.A1]
      ft: {allowed: true, from: [2.A3], max_points: 2}
      steps: [3b-3]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        $a_{n+2}=\dfrac{n}{n+1}a_n$을 이용하여 $\dfrac{1^2\times3^2\times\cdots\times(2n-1)^2\times n}{2^2\times4^2\times\cdots\times(2n)^2}=\left(\dfrac{a_3}{a_1}\right)^2\times\left(\dfrac{a_5}{a_3}\right)^2\times\cdots\times\left(\dfrac{a_{2n+1}}{a_{2n-1}}\right)^2\times n$을 도출했다.
      depends_on: []
      implied_ok: false
      steps: [3b-4]
    - id: 3.A3
      mark_type: A
      points: 2
      evidence: |
        위의 결과와 $\lim\dfrac{4n}{\pi}(a_{2n+1})^2=1$을 바탕으로 극한값이 $\dfrac1\pi$임을 도출했다.
      depends_on: [3.M2, 3.A2]
      steps: [3b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-9367}
  misconceptions:
  - id: MC-ALG-9367
