  - '$b_n=\dfrac{a_{2n+1}}{a_{2n}}$, $c_n=\dfrac{a_{2n-1}}{a_{2n}}$'
  - '곱 $\dfrac{1^2\times3^2\times\cdots\times(2n-1)^2}{2^2\times4^2\times\cdots\times(2n)^2}\times n$'
  concepts:
