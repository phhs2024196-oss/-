intent: |
  적분 및 귀납적 정의로 주어진 수열들의 관계를 파악하고 이를 활용하여 수열의 극한값을 구하는 문제이다. 부분적분법으로 적분으로 정의된 수열의 귀납적 정의를 찾고, 수열의 극한의 기본 성질·대소 관계와 정적분의 성질을 활용하여 극한값을 도출하는 수리적 계산 및 추론 능력을 평가한다(공식 출제 의도 요지).
key_idea: |
  부분적분으로 $a_{n+2}=\dfrac{n}{n+1}a_n$(월리스 적분), $a_{n+1}\le a_n$으로 $b_n\le1\le c_n$, $c_n=\dfrac{2n}{2n-1}b_n$이므로 두 극한은 1. $a_{2n+1}a_{2n}=\dfrac{\pi}{4n}$와 비의 연쇄 곱으로 구하는 극한은 $\dfrac1\pi$.
stuck: |
  $a_{2n+1}a_{2n}$이 $n$에 대해 단순한 꼴($\dfrac{\pi}{4n}$)이 된다는 것을 찾아 $b_n$을 $a_{2n+1}^2$로 바꾸는 것, 주어진 곱을 $\left(\dfrac{a_{2k+1}}{a_{2k-1}}\right)^2$의 연쇄 곱으로 보는 것
idea_tags: [IDEA-WALLIS-REDUCTION, IDEA-SQUEEZE-RATIO, IDEA-PRODUCT-TELESCOPE]
tags: [월리스 적분, 부분적분, 수열의 극한]
