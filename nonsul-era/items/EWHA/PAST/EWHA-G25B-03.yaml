  - 정적분의 성질
  tools:
  - '$\cos x=(\sin x)^{\prime}$ 변형 후 부분적분, $\sin^2x=1-\cos^2x$'
  - '$0\le\cos^nx\le\cos^{n-1}x$ ($0\le x\le\pi/2$)'
  - '$a_1=\dfrac{\pi}{2}$, $a_2=1$'
  conditions:
  - '수열 $\{b_n\}$이 수렴한다는 가정'
