intent: |
  주어진 조건으로부터 삼차함수의 근을 결정해 함수를 추론하고, 연속함수의 사잇값 정리와 도함수를 활용해 함수의 증감 상태를 파악하며, 삼각함수와 일차함수의 대소 관계를 적절한 치환으로 문제 해결에 적용하는 능력을 본다(공식 출제의도 요지).
key_idea: |
  기함수 조건과 $g(2)=0$에서 $f(0)=f(2)=f(-2)=0$이므로 $f(x)=ax(x-2)(x+2)$이다. $h=f-g$에 대해 $h'(0)<0<h'(1)$, 그리고 (2)의 부등식을 $x\to\tfrac{\pi}{2}x$로 치환한 $\sin\tfrac{\pi}{2}x>x$로 $h''>0$을 보여 $h'$의 근이 하나뿐임을 얻는다.
stuck: |
  (3)에서 유일성을 위해 $h''(x)=-2x+\tfrac{\pi^2}{4}\sin\tfrac{\pi}{2}x$의 부호를 (2)의 부등식을 치환해 판정하는 것
idea_tags: [IDEA-ODD-FUNC-ROOTS, IDEA-CONCAVE-CHORD-INEQ, IDEA-SECOND-DERIV-UNIQUE-ROOT]
tags: [삼차함수 결정, 볼록성 부등식, 사잇값 정리, 근의 유일성]
elements:
  materials:
  - '조건 (가) $f(-x)=-f(x)$, (나) $f(1)=g(1)$, $f(2)=g(2)$를 만족하는 삼차함수 $f(x)$'
  - '함수 $g(x)=\sin\dfrac{\pi}{2}x$'
  - '부등식 $\sin x\ge\dfrac{2}{\pi}x$ $(0\le x\le\tfrac{\pi}{2})$'
  - '차함수 $h(x)=f(x)-g(x)$'
  concepts:
  - '기함수(원점 대칭)와 $f(0)=0$'
  - '인수정리와 다항식의 인수분해'
  - '이계도함수와 그래프의 볼록성'
  - '사잇값의 정리'
  - '도함수의 부호와 함수의 증가·감소'
  - '사인함수의 미분'
  tools:
  - '$f(x)=ax(x-2)(x+2)$로 놓고 $f(1)=1$에서 $a$ 결정'
  - '위로 볼록인 함수의 그래프는 양 끝점을 잇는 선분보다 위'
  - '치환 $x=\tfrac{\pi}{2}t$로 $\sin\tfrac{\pi}{2}t>t$ 유도'
  - '$h''''>0$으로 $h''$의 증가성 → 근의 유일성'
  - '$h$의 증감표와 $h(0)=h(1)=0$'
  conditions:
  - '$g(2)=\sin\pi=0$, $g(1)=\sin\tfrac{\pi}{2}=1$'
  - '$h''(0)=\tfrac43-\tfrac{\pi}{2}<0$, $h''(1)=\tfrac13>0$'
  - '$\tfrac{\pi^2}{4}>2$'
  stimuli_used: []
  subpart_links: '(3)은 (1)의 $f$와 (2)의 부등식(치환형)을 사용, (4)는 (3)의 증명 과정($h''$의 부호 변화)을 사용'

