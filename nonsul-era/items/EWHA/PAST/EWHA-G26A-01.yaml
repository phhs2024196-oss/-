stimuli: []

stem: |
  삼차함수 $f(x)$와 함수 $g(x)=\sin\dfrac{\pi}{2}x$가 다음 조건을 만족시킬 때, 아래 물음에 답하시오. [40점]

  (가) 모든 실수 $x$에 대하여 $f(-x)=-f(x)$이다.

  (나) $f(1)=g(1)$, $f(2)=g(2)$

subparts:
- id: '1'
  stem: |
    삼차함수 $f(x)$를 구하시오.
  points: 6
  depends_on: []
  answer: {kind: expression, value: '-x**3/3 + 4*x/3', equivalents: ['-x*(x-2)*(x+2)/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 기함수이므로 $f(0)=0$, $g(2)=0$이므로 $f(\pm2)=0$ → $f(x)=ax(x-2)(x+2)$, $f(1)=1$에서 $a=-\tfrac13$.
    steps:
    - {id: 1a, content: '$f(0)=f(2)=f(-2)=0$, $f(x)=ax(x-2)(x+2)$, $-3a=1$', criteria: ['1.B1', '1.B2', '1.B3', '1.M1', '1.A1']}
    hint_ladder:
    - 조건 (가)에 $x=0$을 넣어 보자.
    - $g(2)$의 값과 조건 (가)를 함께 쓰면 $f$의 근을 몇 개 알 수 있는가?
  - id: S1-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅰ)」 pp.4-5 예시답안 1-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에 $x=0$을 대입하면 $f(-0)=-f(0)$이므로 $f(0)=0$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $g(2)=\sin\pi=0$이므로 조건 (나)로부터 $f(2)=g(2)=0$이다.
      criteria: ['1.B2']
    - id: 1b-3
      content: |
        다시 조건 (가)를 적용하면 $f(-2)=-f(2)=0$이다. 따라서 $f(x)=ax(x-2)(x+2)$ ($a\ne0$인 상수)이다.
      criteria: ['1.B3']
    - id: 1b-4
      content: |
        $g(1)=\sin\dfrac{\pi}{2}=1$이므로 조건 (나)로부터 $f(1)=g(1)=1$이다. 따라서 $-3a=1$, 즉 $a=-\dfrac13$이다.
      criteria: ['1.M1']
    - id: 1b-5
      content: |
        $f(x)=-\dfrac13x(x-2)(x+2)=-\dfrac13x^3+\dfrac43x$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 기함수인 삼차함수는 $f(x)=px^3+qx$ 꼴이므로 $p+q=1$, $8p+2q=0$을 풀어 $p=-\tfrac13$, $q=\tfrac43$.
    steps:
    - id: 1c-1
      content: |
        $f(x)=px^3+qx$로 두면 $f(1)=p+q=1$, $f(2)=8p+2q=0$이므로 $p=-\dfrac13$, $q=\dfrac43$.
      criteria: ['1.M1', '1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: |
        $f(0)=0$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 1
      evidence: |
        $g(2)=0$과 $f(2)=g(2)$로부터 $f(2)=0$임을 보였다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: |
        $f(-2)=0$임을 보였다.
      depends_on: []
      steps: [1b-3]
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        $g(1)=1$과 $f(1)=g(1)$로부터 $a=-\dfrac13$($-3a=1$)을 보였다.
      depends_on: []
      steps: [1b-4, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $f(x)=-\dfrac13x(x-2)(x+2)=-\dfrac13x^3+\dfrac43x$를 적었다.
      depends_on: [1.M1]
      steps: [1b-5, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-9450}
  misconceptions:
  - id: MC-ALG-9450
    outcome_code: '71'
    wrong_work: '$f(x)=ax^3+bx^2+cx+d$로 두고 $f(1)=1$, $f(2)=0$ 두 식만으로 풀려다 미지수가 남음'
    detect_cue: 조건 (가)로부터 $f(0)=0$, $f(-2)=0$(또는 짝수차 계수 0)을 끌어내지 않았다
    feedback: 기함수 조건은 $f(0)=0$과 근의 대칭($f(2)=0\Rightarrow f(-2)=0$)을 줍니다. 근 세 개로 인수분해하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $0\le x\le\dfrac{\pi}{2}$인 모든 실수 $x$에 대하여 부등식 $\sin x\ge\dfrac{2}{\pi}x$가 성립함을 보이시오.
  points: 8
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\sin x$는 $\left[0,\tfrac{\pi}{2}\right]$에서 위로 볼록이므로 양 끝점 $(0,0)$, $\left(\tfrac{\pi}{2},1\right)$을 잇는 선분 $y=\tfrac{2}{\pi}x$보다 위에 있다.
    steps:
    - {id: 2a, content: '$(\sin x)''''=-\sin x<0$, 현 $y=\tfrac{2}{\pi}x$ 위쪽', criteria: ['2.B1', '2.B2', '2.R1', '2.A1']}
    hint_ladder:
    - $y=\tfrac{2}{\pi}x$는 $y=\sin x$ 위의 어떤 두 점을 잇는 직선인가?
    - 이계도함수의 부호로 볼록성을 확인해 보자.
  - id: S2-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅰ)」 p.5 예시답안 1-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $k(x)=\sin x$는 $0<x<\dfrac{\pi}{2}$인 모든 실수 $x$에 대하여 $k''(x)=-\sin x<0$이므로 구간 $\left[0,\dfrac{\pi}{2}\right]$에서 위로 볼록이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        $k(0)=0$, $k\left(\dfrac{\pi}{2}\right)=1$이므로 두 점 $(0,0)$, $\left(\dfrac{\pi}{2},1\right)$을 잇는 선분은 $y=\dfrac{2}{\pi}x$이다.
      criteria: ['2.B2']
    - id: 2b-3
      content: |
        위로 볼록이므로 $y=k(x)$의 그래프는 이 선분보다 위에 있다. 즉 $\sin x>\dfrac{2}{\pi}x$ $\left(0<x<\dfrac{\pi}{2}\right)$ …… ①
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        양 끝점에서는 등호가 성립하므로 $0\le x\le\dfrac{\pi}{2}$인 모든 실수 $x$에 대하여 $\sin x\ge\dfrac{2}{\pi}x$이다. ■
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    method_no: 2
    key_idea: $p(x)=\sin x-\tfrac{2}{\pi}x$로 두면 $p'(x)=\cos x-\tfrac{2}{\pi}$는 감소하고 부호가 한 번 $+\to-$로 바뀌므로 $p$는 증가 후 감소, $p(0)=p(\tfrac{\pi}{2})=0$이므로 $p\ge0$.
    steps:
    - id: 2c-1
      content: |
        $p'(x)=\cos x-\dfrac{2}{\pi}$는 $\left[0,\dfrac{\pi}{2}\right]$에서 감소하며 $p'(0)>0>p'\left(\dfrac{\pi}{2}\right)$이므로 $p$는 증가하다가 감소한다. 양 끝값이 0이므로 $p(x)\ge0$이다.
      criteria: ['2.R1', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        $0<x<\dfrac{\pi}{2}$에서 $(\sin x)''=-\sin x<0$임을 보이고 $\left[0,\dfrac{\pi}{2}\right]$에서 위로 볼록임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 2
      evidence: |
        $k(0)=0$, $k\left(\dfrac{\pi}{2}\right)=1$임을 적었다.
      depends_on: []
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        두 점 $(0,0)$, $\left(\dfrac{\pi}{2},1\right)$을 잇는 선분 $y=\dfrac{2}{\pi}x$보다 $y=\sin x$의 그래프가 위에 있다고 근거와 함께 적었다.
      depends_on: [2.B1, 2.B2]
      steps: [2b-3, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $0\le x\le\dfrac{\pi}{2}$인 모든 $x$에 대하여 $\sin x\ge\dfrac{2}{\pi}x$라는 결론을 적었다.
      depends_on: [2.R1]
      steps: [2b-4, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-9451}
  misconceptions:
  - id: MC-CAL-9451
    outcome_code: '72'
    wrong_work: '$(\sin x)''''<0$이므로 그래프가 현 $y=\tfrac{2}{\pi}x$보다 아래에 있다고 결론'
    detect_cue: 위로 볼록과 현의 위·아래 관계를 반대로 적었다
    feedback: 위로 볼록인 함수의 그래프는 두 점을 잇는 선분보다 위에 있습니다. 간단한 예($y=-x^2$)로 확인해 보세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    $f'(c)=g'(c)$를 만족시키는 $c$가 열린구간 $(0,1)$에 오직 하나 존재함을 보이시오.
  points: 16
  depends_on: ['1', '2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h=f-g$에 대해 $h'(0)<0<h'(1)$로 존재, ①을 치환한 $\sin\tfrac{\pi}{2}x>x$로 $h''>0$을 보여 유일성.
    steps:
    - {id: 3a, content: '$h''(x)=-x^2+\tfrac43-\tfrac{\pi}{2}\cos\tfrac{\pi}{2}x$, $h''''(x)=-2x+\tfrac{\pi^2}{4}\sin\tfrac{\pi}{2}x>(\tfrac{\pi^2}{4}-2)x>0$', criteria: ['3.M1', '3.A1', '3.R1', '3.M2', '3.A2', '3.R2']}
    hint_ladder:
    - $h(x)=f(x)-g(x)$로 두고 $h'$의 양 끝값 부호를 보자.
    - 유일성은 $h'$이 단조임을 보이면 된다. $h''$에 (2)의 부등식을 쓰려면 어떻게 치환해야 하는가?
  - id: S3-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅰ)」 pp.5-6 예시답안 1-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $h(x)=f(x)-g(x)$라 하면 $h'(x)=-x^2+\dfrac43-\dfrac{\pi}{2}\cos\dfrac{\pi}{2}x$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $h'(0)=\dfrac43-\dfrac{\pi}{2}<0$이고 $h'(1)=\dfrac13>0$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $h'(x)$는 닫힌구간 $[0,1]$에서 연속이므로 사잇값의 정리에 의해 $h'(c)=0$인 $c$가 열린구간 $(0,1)$에 적어도 하나 존재한다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        식 ①에 $x=\dfrac{\pi}{2}t$로 치환하여 대입하면 $0<t<1$인 모든 실수 $t$에 대하여 $\sin\dfrac{\pi}{2}t>t$이다.
      criteria: ['3.M2']
    - id: 3b-5
      content: |
        따라서 $0<x<1$인 모든 실수 $x$에 대하여 $h''(x)=-2x+\dfrac{\pi^2}{4}\sin\dfrac{\pi}{2}x>-2x+\dfrac{\pi^2}{4}x>0$이다($\tfrac{\pi^2}{4}>2$).
      criteria: ['3.A2']
    - id: 3b-6
      content: |
