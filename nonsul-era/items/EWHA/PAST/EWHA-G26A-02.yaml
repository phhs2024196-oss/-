      evidence: |
        위 식을 정리해 $P(x)$가 $(n-1)$차 이하로 $P(x)=(c_1+\cdots+c_n)x^{n-1}+(\text{나머지 항})$으로 표현됨을 적었다.
      depends_on: [3.M1]
      steps: [3b-2, 3a]
    - id: 3.B1
      mark_type: B
