stimuli: []

stem: |
  두 다항식 $P(x)=a_mx^m+a_{m-1}x^{m-1}+\cdots+a_1x+a_0$와 $Q(x)=(x-b_1)(x-b_2)\cdots(x-b_n)$이 다음 조건을 만족시킨다.

  (가) $m<n$

  (나) $a_0,a_1,\cdots,a_m,b_1,\cdots,b_n$은 상수이다.

  (다) $a_m\ne0$

  (라) $b_1<b_2<\cdots<b_n$

  다음 등식

  $$\frac{P(x)}{Q(x)}=\frac{c_1}{x-b_1}+\frac{c_2}{x-b_2}+\cdots+\frac{c_n}{x-b_n}\quad(c_1,c_2,\cdots,c_n\text{은 상수})$$

  가 성립할 때, 아래 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    $x\ne b_k$ $(k=1,2,\cdots,n)$일 때, $\dfrac{Q'(x)}{Q(x)}=\displaystyle\sum_{k=1}^{n}\dfrac{1}{x-b_k}$이 성립함을 보이시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 곱의 로그는 로그의 합이므로 $\ln\lvert Q\rvert=\sum\ln\lvert x-b_k\rvert$를 미분한다.
    steps:
    - id: 1a
      content: |
        $\ln\lvert Q(x)\rvert=\sum_k\ln\lvert x-b_k\rvert$ → 미분하면 $\dfrac{Q'(x)}{Q(x)}=\sum_k\dfrac{1}{x-b_k}$
      criteria: ['1.M1', '1.A1']
    hint_ladder:
    - 곱을 합으로 바꾸는 함수는?
    - $\ln\lvert u\rvert$의 도함수는 $\dfrac{u'}{u}$이다.
  - id: S1-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅰ)」 p.10 예시답안 2-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        다항식 $Q(x)=(x-b_1)(x-b_2)\cdots(x-b_n)$에 대하여 ($x\ne b_k$이므로 $Q(x)\ne0$)
        $\ln\lvert Q(x)\rvert=\ln\lvert(x-b_1)(x-b_2)\cdots(x-b_n)\rvert=\ln\lvert x-b_1\rvert+\ln\lvert x-b_2\rvert+\cdots+\ln\lvert x-b_n\rvert$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        양변을 $x$에 대하여 미분하면 $\dfrac{Q'(x)}{Q(x)}=\dfrac{1}{x-b_1}+\cdots+\dfrac{1}{x-b_n}=\displaystyle\sum_{k=1}^n\dfrac{1}{x-b_k}$이 성립한다. ■
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    source_flow: 「2026 논술고사 답안지(자연Ⅰ)」 pp.10-11 예시답안 2-(1) 별해
    method_no: 2
    key_idea: 공식 별해 — 곱의 미분으로 $Q'(x)=\sum_k\prod_{i\ne k}(x-b_i)$를 구해 $Q(x)$로 나눈다.
    steps:
    - id: 1c-1
      content: |
        함수의 곱의 미분을 적용하면
        $Q'(x)=(x-b_2)(x-b_3)\cdots(x-b_n)+(x-b_1)(x-b_3)\cdots(x-b_n)+\cdots+(x-b_1)\cdots(x-b_{k-1})(x-b_{k+1})\cdots(x-b_n)+\cdots+(x-b_1)(x-b_2)\cdots(x-b_{n-1})$이다.
      criteria: ['1.M1']
    - id: 1c-2
      content: |
        이를 $Q(x)$로 나누면 각 항은 약분되어 $\dfrac{1}{x-b_1}+\cdots+\dfrac{1}{x-b_k}+\cdots+\dfrac{1}{x-b_n}=\displaystyle\sum_{k=1}^n\dfrac{1}{x-b_k}$이다. ■
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $Q(x)$에 로그함수를 적용하여 $\ln\lvert Q(x)\rvert=\ln\lvert x-b_1\rvert+\cdots+\ln\lvert x-b_n\rvert$을 유도했다.
      depends_on: []
      implied_ok: false
      accept:
      - '(공식 별해) 곱의 미분으로 $Q^{\prime}(x)=\sum_k\prod_{i\ne k}(x-b_i)$를 유도 — 5점'
      steps: [1b-1, 1a, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        위 식을 $x$에 대하여 미분하여 $\dfrac{Q'(x)}{Q(x)}=\displaystyle\sum_{k=1}^n\dfrac{1}{x-b_k}$을 얻었다.
      depends_on: [1.M1]
      accept:
      - '(공식 별해) $Q^{\prime}(x)$를 $Q(x)$로 나누어 합을 유도 — 5점'
      steps: [1b-2, 1a, 1c-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점(로그미분)}
  - {code: '21', meaning: 만점(곱의 미분 별해)}
  - {code: '71', misconception: MC-CAL-9455}
  misconceptions:
  - id: MC-CAL-9455
    outcome_code: '71'
    wrong_work: '$\ln Q(x)=\sum\ln(x-b_k)$로 절댓값 없이 적고 미분'
    detect_cue: 진수에 절댓값이 없어 $x<b_k$인 구간에서 로그가 정의되지 않는다
    feedback: $x-b_k$가 음수일 수 있으므로 $\ln\lvert Q(x)\rvert$로 써야 합니다. $\left(\ln\lvert u\rvert\right)'=\dfrac{u'}{u}$는 그대로 성립합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $k=1,2,\cdots,n$에 대하여 $Q'(b_k)\ne0$과 $c_k=\dfrac{P(b_k)}{Q'(b_k)}$가 성립함을 보이시오.
  points: 10
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $Q'(x)$의 전개에서 $x=b_k$이면 $(x-b_k)$가 없는 한 항만 남고, $P(x)=\sum_jc_j\prod_{i\ne j}(x-b_i)$에서도 마찬가지이다.
    steps:
    - id: 2a
      content: |
        $Q'(b_k)=\prod_{i\ne k}(b_k-b_i)\ne0$, $P(b_k)=c_k\prod_{i\ne k}(b_k-b_i)=c_kQ'(b_k)$
      criteria: ['2.B1', '2.R1', '2.M1', '2.B2', '2.A1']
    hint_ladder:
    - $Q'(x)$의 각 항 중 $(x-b_k)$를 인수로 갖지 않는 항은 몇 개인가?
    - 부분분수 식의 양변에 $Q(x)$를 곱해 보자.
  - id: S2-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅰ)」 pp.11-12 예시답안 2-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $Q'(x)=\displaystyle\sum_{j=1}^n(x-b_1)\cdots(x-b_{j-1})(x-b_{j+1})\cdots(x-b_n)$에서 $(x-b_k)$를 인수로 포함하지 않는 항은 $(x-b_1)\cdots(x-b_{k-1})(x-b_{k+1})\cdots(x-b_n)$ 하나이고 나머지 항은 모두 $(x-b_k)$를 인수로 포함한다. 따라서 $x=b_k$를 대입하면 $Q'(b_k)=(b_k-b_1)\cdots(b_k-b_{k-1})(b_k-b_{k+1})\cdots(b_k-b_n)$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        조건 (라)에 의하여 $i\ne k$이면 $b_k-b_i\ne0$이므로 $Q'(b_k)\ne0$이 성립한다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        부분분수 등식의 양변에 $Q(x)=(x-b_1)\cdots(x-b_n)$을 곱하면
        $P(x)=c_1(x-b_2)\cdots(x-b_n)+c_2(x-b_1)(x-b_3)\cdots(x-b_n)+\cdots+c_n(x-b_1)\cdots(x-b_{n-1})$이다. 이 중 $(x-b_k)$를 인수로 포함하지 않는 항은 $c_k(x-b_1)\cdots(x-b_{k-1})(x-b_{k+1})\cdots(x-b_n)$뿐이므로 $P(b_k)=c_k(b_k-b_1)\cdots(b_k-b_{k-1})(b_k-b_{k+1})\cdots(b_k-b_n)$이다.
      criteria: ['2.M1']
    - id: 2b-4
      content: |
        $(b_k-b_1)\cdots(b_k-b_{k-1})(b_k-b_{k+1})\cdots(b_k-b_n)=Q'(b_k)$이므로 $P(b_k)=c_k\cdot Q'(b_k)$이다.
      criteria: ['2.B2']
    - id: 2b-5
      content: |
        $Q'(b_k)\ne0$이므로 $c_k=\dfrac{P(b_k)}{Q'(b_k)}$이다. ■
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        $Q'(b_k)=(b_k-b_1)\cdots(b_k-b_{k-1})(b_k-b_{k+1})\cdots(b_k-b_n)$을 유도했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        조건 (라)에 의하여 $Q'(b_k)\ne0$임을 적었다.
      depends_on: [2.B1]
      steps: [2b-2, 2a]
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $P(b_k)=c_k(b_k-b_1)\cdots(b_k-b_{k-1})(b_k-b_{k+1})\cdots(b_k-b_n)$을 유도했다.
      depends_on: []
      steps: [2b-3, 2a]
    - id: 2.B2
      mark_type: B
      points: 2
      evidence: |
        $(b_k-b_1)\cdots(b_k-b_{k-1})(b_k-b_{k+1})\cdots(b_k-b_n)=Q'(b_k)$임을 확인했다.
      depends_on: []
      steps: [2b-4, 2a]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $Q'(b_k)\ne0$이므로 $c_k=\dfrac{P(b_k)}{Q'(b_k)}$가 성립함을 적었다.
      depends_on: [2.M1, 2.R1, 2.B2]
      steps: [2b-5, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-ALG-9456}
  misconceptions:
  - id: MC-ALG-9456
    outcome_code: '72'
    wrong_work: '$\dfrac{P(x)}{Q(x)}=\sum\dfrac{c_j}{x-b_j}$에 바로 $x=b_k$를 대입하려 하거나, $Q''(b_k)$를 「$Q(b_k)=0$이므로 $Q''(b_k)=0$」으로 처리'
    detect_cue: 분모가 0이 되는 대입, 또는 $Q(b_k)=0$에서 $Q'(b_k)=0$으로 넘어감
    feedback: 먼저 양변에 $Q(x)$를 곱해 다항식 등식으로 바꾼 뒤 대입하세요. $Q'(b_k)$는 곱의 미분 전개에서 남는 한 항입니다(서로 다른 근이면 0이 아님).
    remedy: [RL-2]

- id: '3'
  stem: |
    $c_1+\cdots+c_n=\begin{cases}0 & (m<n-1)\\ a_m & (m=n-1)\end{cases}$이 성립함을 보이시오.
  points: 10
  depends_on: ['2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 통분한 분자 $\sum_jc_j\prod_{i\ne j}(x-b_i)$의 $x^{n-1}$ 계수는 $c_1+\cdots+c_n$이고, 이것이 $P(x)$의 $x^{n-1}$ 계수와 같다.
    steps:
    - id: 3a
      content: |
        $P(x)=(c_1+\cdots+c_n)x^{n-1}+R(x)$, $\deg R<n-1$ → $x^{n-1}$ 계수 비교
      criteria: ['3.M1', '3.M2', '3.B1', '3.A1']
    hint_ladder:
    - (2)에서 얻은 $P(x)$의 표현에서 각 항은 몇 차 다항식인가?
    - $P(x)$의 $x^{n-1}$의 계수는 $m<n-1$일 때와 $m=n-1$일 때 각각 무엇인가?
  - id: S3-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅰ)」 p.12 예시답안 2-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\dfrac{c_1}{x-b_1}+\cdots+\dfrac{c_n}{x-b_n}$을 통분하면 분자는 $c_1(x-b_2)\cdots(x-b_n)+c_2(x-b_1)(x-b_3)\cdots(x-b_n)+\cdots+c_n(x-b_1)\cdots(x-b_{n-1})$, 분모는 $(x-b_1)\cdots(x-b_n)=Q(x)$이므로
        $P(x)=c_1(x-b_2)\cdots(x-b_n)+c_2(x-b_1)(x-b_3)\cdots(x-b_n)+\cdots+c_n(x-b_1)\cdots(x-b_{n-1})$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $(x-b_2)\cdots(x-b_n)$, $(x-b_1)(x-b_3)\cdots(x-b_n)$, $\cdots$, $(x-b_1)\cdots(x-b_{n-1})$은 모두 최고차항의 계수가 1인 $(n-1)$차 다항식이므로 $P(x)=(c_1+\cdots+c_n)x^{n-1}+R(x)$이다. 이때 $R(x)$는 차수가 $(n-1)$보다 낮은 다항식이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        따라서 $a_mx^m+a_{m-1}x^{m-1}+\cdots+a_1x+a_0=(c_1+\cdots+c_n)x^{n-1}+R(x)$이다.
      criteria: ['3.B1']
    - id: 3b-4
      content: |
        양변의 $x^{n-1}$의 계수를 비교하면 $m=n-1$일 때에는 $a_m=c_1+\cdots+c_n$이고, $m<n-1$일 때에는 좌변에 $x^{n-1}$항이 없으므로 $c_1+\cdots+c_n=0$이다. ■
      criteria: ['3.A1']
  - id: S3-ALT
    audience: ALT
    method_no: 2
    key_idea: 양변에 $x$를 곱하고 $x\to\infty$의 극한을 취하면 $\lim x\dfrac{P(x)}{Q(x)}=c_1+\cdots+c_n$이고, 좌변은 $m<n-1$이면 0, $m=n-1$이면 $a_m$이다.
    steps:
    - id: 3c-1
      content: |
        $\dfrac{xc_k}{x-b_k}\to c_k$이므로 $\displaystyle\lim_{x\to\infty}\dfrac{xP(x)}{Q(x)}=c_1+\cdots+c_n$. 좌변은 분자 차수 $m+1$, 분모 차수 $n$을 비교해 $m+1<n$이면 0, $m+1=n$이면 최고차항 계수의 비 $a_m$이다.
      criteria: ['3.M1', '3.A1']
