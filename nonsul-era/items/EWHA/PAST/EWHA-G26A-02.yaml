intent: |
  유리함수를 부분분수의 합으로 나타낼 때, 로그함수의 미분 또는 함수의 곱의 미분을 사용하면 분자 상수 $c_k$를 $\dfrac{P(b_k)}{Q'(b_k)}$로 쉽게 찾을 수 있음을 이해하고, 분모함수의 도함수를 인수분해의 관점에서 해석하는 능력을 본다(공식 출제의도 요지).
key_idea: |
  $Q'(x)$를 곱의 미분으로 전개하면 $x=b_k$에서 $(x-b_k)$를 포함하지 않는 항 하나만 남아 $Q'(b_k)=\prod_{i\ne k}(b_k-b_i)$이고, 부분분수 식에 $Q(x)$를 곱하면 $P(b_k)=c_kQ'(b_k)$이다. 통분한 분자의 $x^{n-1}$ 계수 비교로 $c_1+\cdots+c_n$을 얻는다.
stuck: |
  (2)에서 $P(x)=\sum_j c_j\prod_{i\ne j}(x-b_i)$로 바꾼 뒤 $x=b_k$를 대입하면 한 항만 남는다는 관찰, (3)에서 차수 비교로 $x^{n-1}$의 계수를 읽는 것
idea_tags: [IDEA-LOG-DERIV-PRODUCT, IDEA-PARTIAL-FRACTION-RESIDUE, IDEA-COEFF-COMPARE]
tags: [부분분수, 로그미분, 곱의 미분, 계수 비교, 일반화 증명]
elements:
  materials:
  - '다항식 $P(x)=a_mx^m+\cdots+a_1x+a_0$ ($a_m\ne0$, $m<n$)'
  - '서로 다른 일차인수의 곱 $Q(x)=(x-b_1)(x-b_2)\cdots(x-b_n)$, $b_1<b_2<\cdots<b_n$'
  - '부분분수 전개 $\dfrac{P(x)}{Q(x)}=\sum_{k=1}^n\dfrac{c_k}{x-b_k}$'
  concepts:
  - '다항식의 인수분해'
  - '로그함수의 미분 $\left(\ln\lvert u\rvert\right)^{\prime}=\dfrac{u^{\prime}}{u}$'
  - '함수의 곱의 미분법'
  - '다항식의 항등식과 계수 비교'
  - '다항식의 차수'
  tools:
  - '$\ln\lvert Q(x)\rvert=\sum\ln\lvert x-b_k\rvert$의 양변 미분'
  - '$Q^{\prime}(x)=\sum_k\prod_{i\ne k}(x-b_i)$ 전개'
  - '부분분수 식에 $Q(x)$를 곱해 다항식 등식으로 변환 후 $x=b_k$ 대입'
  - '$x^{n-1}$의 계수 비교'
  conditions:
  - '조건 (라): $i\ne k$이면 $b_k-b_i\ne0$'
  - '조건 (가) $m<n$: 다항식 부분 $R(x)$가 없음, $m\le n-1$'
  - '조건 (다) $a_m\ne0$: $m=n-1$일 때 최고차항 계수가 $a_m$'
  stimuli_used: []
  subpart_links: '(2)는 (1)의 별해에서 쓴 $Q^{\prime}(x)$ 전개식을 사용, (3)은 (2)의 $P(x)=\sum c_j\prod_{i\ne j}(x-b_i)$ 표현을 사용'

