stimuli: []

stem: |
  닫힌구간 $[-1,2]$에서 정의된 연속함수 $f(x)$에 대하여 함수 $H(x)$를

  $$H(x)=\int_0^xf(t)\,dt-\int_x^1f(t)\,dt\quad(-1\le x\le2)$$

  라 할 때, 아래 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    $-1<x<2$인 모든 실수 $x$에 대하여 함수 $H(x)$가 연속임을 보이시오.
  points: 7
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $F(x)=\int_{-1}^xf(t)dt$는 미분가능하고, $H$는 $F$의 상수배에 상수를 더한 것이다.
    steps:
    - id: 1a
      content: |
        $H(x)=2F(x)-2\int_{-1}^0f-\int_0^1f$, $F$ 미분가능 → 연속
      criteria: ['1.B1', '1.B2', '1.R1']
    hint_ladder:
    - 두 적분을 하나의 기준점 $-1$에서 시작하는 적분으로 바꿔 보자.
  - id: S1-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅰ)」 p.16 예시답안 3-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        닫힌구간 $[a,b]$에서 정의된 연속함수 $f(x)$에 대하여 적분과 미분의 관계에 의해 $\dfrac{d}{dx}\displaystyle\int_a^xf(t)dt=f(x)$ $(a<x<b)$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $-1<x<2$인 모든 실수 $x$에 대하여 $F(x)=\displaystyle\int_{-1}^xf(t)dt$라 하면 $F(x)$는 $-1<x<2$에서 미분가능하고, 따라서 연속이다.
      criteria: ['1.B2']
    - id: 1b-3
      content: |
        정적분의 성질에 의해
        $H(x)=2\left(F(x)-\displaystyle\int_{-1}^0f(t)dt\right)-\displaystyle\int_0^1f(t)dt=2F(x)-2\displaystyle\int_{-1}^0f(t)dt-\displaystyle\int_0^1f(t)dt$ …… ①
        이고, $F(x)$가 열린구간 $(-1,2)$에서 연속이므로 연속함수의 성질에 의해 $H(x)$도 그 구간에서 연속이다. ■
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        연속함수 $f$에 대하여 $\dfrac{d}{dx}\displaystyle\int_a^xf(t)dt=f(x)$ $(a<x<b)$라는 적분과 미분의 관계를 언급했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: |
        미분가능한 함수는 연속임을 언급했다.
      depends_on: []
      steps: [1b-2, 1a]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $H(x)$를 미분가능(연속)한 함수로 표현하여 열린구간 $(-1,2)$에서 연속이라는 결론을 도출했다.
      depends_on: [1.B1, 1.B2]
      steps: [1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9458}
  misconceptions:
  - id: MC-CAL-9458
    outcome_code: '71'
    wrong_work: '$\dfrac{d}{dx}\int_x^1f(t)dt=f(x)$로 두어 $H^{\prime}(x)=0$이라 쓰거나, 「$f$가 연속이므로 $H$도 연속」으로 근거 없이 끝냄'
    detect_cue: 아래끝이 $x$인 적분의 도함수 부호를 $+f(x)$로 썼거나 미분가능성→연속 연결이 없다
    feedback: $\int_x^1f(t)dt=-\int_1^xf(t)dt$이므로 도함수는 $-f(x)$입니다. 따라서 $H^{\prime}(x)=2f(x)$이고, 미분가능하므로 연속입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    다음 등식이 성립함을 보이시오.

    $$\int_0^1H(x)\,dx=\int_0^1(1-2x)f(x)\,dx$$
  points: 9
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\int_0^1H=[xH]_0^1-\int_0^1xH^{\prime}=H(1)-2\int_0^1xf$, $H(1)=\int_0^1f$.
    steps:
    - id: 2a
      content: |
        $\int_0^11\cdot H\,dx=\left[xH(x)\right]_0^1-2\int_0^1xf(x)dx=\int_0^1f-2\int_0^1xf$
      criteria: ['2.M1', '2.M2', '2.A1']
    hint_ladder:
    - $H$의 도함수는 간단하다. $H=1\cdot H$로 보고 부분적분해 보자.
  - id: S2-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅰ)」 pp.16-17 예시답안 3-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        상수 $A=-2\displaystyle\int_{-1}^0f(t)dt-\displaystyle\int_0^1f(t)dt$라 하자. ①로부터 $H(x)=2F(x)+A$이고, $\dfrac{d}{dx}x=1$이므로 부분적분법을 쓸 수 있다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\displaystyle\int_0^1H(x)dx=\int_0^1\left(1\cdot(2F(x)+A)\right)dx=2F(1)+A-2\int_0^1xF^{\prime}(x)dx$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        이때 $2F(1)+A=H(1)=\displaystyle\int_0^1f(x)dx$이고 $F^{\prime}(x)=f(x)$이므로 $\displaystyle\int_0^1H(x)dx=\int_0^1f(x)dx-2\int_0^1xf(x)dx=\int_0^1(1-2x)f(x)dx$가 성립한다. ■
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $\displaystyle\int_0^1H(x)dx=\int_0^11\cdot H(x)dx$이고 $1=\dfrac{d}{dx}x$임을 언급했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        부분적분법으로 $\displaystyle\int_0^1H(x)dx=\left[xH(x)\right]_0^1-2\int_0^1xf(x)dx$의 형태로 표현했다.
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.R1], max_points: 3}
      steps: [2b-2, 2a]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\left[xH(x)\right]_0^1=\displaystyle\int_0^1f(x)dx$임을 보이고 주어진 등식이 성립한다는 결론을 도출했다(공식 채점표 문구에 (3)의 결론이 섞여 있음 — rights_notice 참고).
      depends_on: [2.M2]
      steps: [2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-9459}
  misconceptions:
  - id: MC-CAL-9459
    outcome_code: '72'
    wrong_work: '경계항 $\left[xH(x)\right]_0^1$을 0으로 처리하여 $\int_0^1H=-2\int_0^1xf$로 결론'
    detect_cue: $H(1)=\int_0^1f(t)dt$를 계산하지 않았다
    feedback: $x=1$에서 $xH(x)=H(1)=\int_0^1f(t)dt-0$입니다. 경계항을 실제로 계산하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    $\displaystyle\int_0^1f(x)\,dx=2\int_0^1xf(x)\,dx$일 때, 다음 등식을 만족시키는 $c$가 열린구간 $(0,1)$에 적어도 하나 존재함을 보이시오.

    $$\int_0^cf(x)\,dx=\int_c^1f(x)\,dx$$
  points: 10
  depends_on: ['2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: (2)와 조건에서 $\int_0^1H=0$, $G(x)=\int_{-1}^xH$는 $G(0)=G(1)$이므로 롤의 정리로 $H(c)=G^{\prime}(c)=0$.
    steps:
    - id: 3a
      content: |
        $\int_0^1H=0\Rightarrow G(0)=G(1)\Rightarrow G^{\prime}(c)=H(c)=0$
      criteria: ['3.B1', '3.M1', '3.R1', '3.A1']
    hint_ladder:
    - 구하려는 등식은 $H(c)=0$과 같다.
    - $\int_0^1H\,dx=0$을 롤의 정리로 연결하려면 어떤 함수의 양 끝값이 같아야 하는가?
  - id: S3-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅰ)」 p.17 예시답안 3-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        주어진 조건과 문항 (2)의 결과로부터 $\displaystyle\int_0^1H(x)dx=\int_0^1f(x)dx-2\int_0^1xf(x)dx=0$이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        함수 $G(x)=\displaystyle\int_{-1}^xH(t)dt$를 $[-1,2]$에서 정의하면 $G$는 $(-1,2)$에서 미분가능하고 연속이며 $G^{\prime}(x)=H(x)$이다. $G(0)=\displaystyle\int_{-1}^0H(t)dt$, $G(1)=\int_{-1}^0H(t)dt+\int_0^1H(t)dt=\int_{-1}^0H(t)dt$이므로 $G(0)=G(1)$이다. $G$는 $[0,1]$에서 연속, $(0,1)$에서 미분가능하다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        롤의 정리에 의해 $G^{\prime}(c)=0$인 $c$가 열린구간 $(0,1)$에 적어도 하나 존재한다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $H(c)=G^{\prime}(c)=0$이므로 $H$의 정의에 의해 $\displaystyle\int_0^cf(x)dx=\int_c^1f(x)dx$가 성립한다. ■
      criteria: ['3.A1']
  - id: S3-ALT
    audience: ALT
    method_no: 2
    key_idea: $H$는 연속이고 $\int_0^1H=0$이므로 $H$가 $(0,1)$에서 부호를 바꾸지 않으면 $H\equiv0$이어야 한다 — 적분의 평균값 정리(교육과정 밖 명칭)를 사잇값 정리로 대신해 $H(c)=0$을 얻는다.
    steps:
    - id: 3c-1
      content: |
        $H$가 $(0,1)$에서 항상 양(음)이면 $\int_0^1H>0$($<0$)이 되어 모순. 따라서 $H\equiv0$이거나 $H$가 양·음 값을 모두 가지므로 사잇값의 정리로 $H(c)=0$인 $c\in(0,1)$가 존재한다.
      criteria: ['3.B1', '3.R1', '3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 1
      evidence: |
        $\displaystyle\int_0^1H(x)dx=0$임을 언급했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 1}
      steps: [3b-1, 3a, 3c-1]
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        함수 $H(x)$의 한 부정적분($G(x)=\int_{-1}^xH(t)dt$ 등)이 닫힌구간 $[0,1]$에서 롤의 정리 조건($G(0)=G(1)$, 연속·미분가능)을 만족함을 언급했다.
      depends_on: []
      steps: [3b-2, 3a]
    - id: 3.R1
      mark_type: R
      points: 4
      evidence: |
