intent: |
  새로 정의된 함수를 적분의 성질과 연결하여 연속성·미분가능성, 부분적분법, 롤의 정리를 바탕으로 한 존재 추론, 미분·적분 구조의 비교에 따른 동치 관계 설명 능력을 평가한다(공식 출제의도 요지).
key_idea: |
  $F(x)=\int_{-1}^xf(t)dt$로 두면 $H(x)=2F(x)+A$($A$는 상수)이므로 $H'=2f$이다. $\int_0^1H\,dx$를 $1\cdot H$로 보고 부분적분하면 $\int_0^1(1-2x)f\,dx$가 되고, 조건에서 $\int_0^1H=0$이므로 $G(x)=\int_{-1}^xH(t)dt$에 롤의 정리를 적용하면 $H(c)=0$인 $c$가 존재한다.
stuck: |
  (3)에서 롤의 정리를 $H$가 아니라 $H$의 한 부정적분 $G$에 적용해야 한다는 것(보조함수 설정)
