  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: (공식 해석) 구간 $(-1,2)$ 전체에서의 항등 동치. $f\equiv0\Rightarrow$ 모든 정적분이 0, $H\equiv0\Rightarrow F=-\tfrac{A}{2}$ 상수 $\Rightarrow f=F^{\prime}=0$.
    steps:
    - id: 4a
      content: |
        $f\equiv0\Rightarrow H\equiv0$; $H=2F+A\equiv0\Rightarrow F$ 상수 $\Rightarrow f=F^{\prime}\equiv0$
      criteria: ['4.R1', '4.R2']
    hint_ladder:
    - 이 동치는 한 점에서의 값이 아니라 구간 전체에서 함수가 0이라는 뜻으로 읽는다.
    - $H=2F+A$에서 $H$가 상수 0이면 $F$는?
  - id: S4-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅰ)」 pp.17-18 예시답안 3-(4)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $-1<x<2$인 모든 실수 $x$에 대하여 $f(x)=0$이면 임의의 구간에서 $f$의 정적분 값이 0이므로 $\displaystyle\int_0^xf(t)dt-\int_x^1f(t)dt=0$, 즉 $-1<x<2$인 모든 실수 $x$에 대하여 $H(x)=0$이다.
      criteria: ['4.R1']
    - id: 4b-2
      content: |
        역으로, $-1<x<2$인 모든 실수 $x$에 대하여 $H(x)=0$이면 $H(x)=2F(x)+A$이므로 $F(x)=-\dfrac{A}{2}$(상수함수)이다. 따라서 $-1<x<2$인 모든 실수 $x$에 대하여 $f(x)=F^{\prime}(x)=0$이다. ■
      criteria: ['4.R2']
