stimuli: []

stem: |
  함수 $f(x)$는 실수 전체의 집합에서 연속인 이계도함수 $f''(x)$를 갖고 다음 조건을 만족시킨다.

  (가) $\displaystyle\int_2^6f''(x)\cos\frac{\pi x}{4}\,dx=-\frac{\pi^2}{16}$

  (나) $x\ge2$인 모든 실수 $x$에 대하여 $f(x+4)=-f(x)$이다.

  모든 자연수 $n$에 대하여 $a_n=\displaystyle\int_0^{4n+2}f(x)\cos\frac{\pi x}{4}\,dx$라 할 때, 아래 물음에 답하시오. [40점]

subparts:
- id: '1'
  stem: |
    $\displaystyle\int_2^6f(x)\cos\frac{\pi x}{4}\,dx$의 값을 구하시오.
  points: 6
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 번 부분적분하면 경계항은 (나)와 $\cos\tfrac{\pi}{2}=\cos\tfrac{3\pi}{2}=0$으로 모두 사라지고 $\left(\tfrac{4}{\pi}\right)^2\cdot\left(-\tfrac{\pi^2}{16}\right)$의 부호를 바꾼 값 1이 남는다.
    steps:
    - id: 1a
      content: |
        $\int_2^6f\cos\tfrac{\pi x}{4}dx=-\tfrac{16}{\pi^2}\int_2^6f''\cos\tfrac{\pi x}{4}dx=1$
      criteria: ['1.M1', '1.A1']
    hint_ladder:
    - $\cos\tfrac{\pi x}{4}$를 적분하는 쪽으로 부분적분해 보자.
    - 경계항에서 $f(6)$과 $f(2)$의 관계는?
  - id: S1-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅱ)」 p.4 예시답안 1-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        부분적분법으로 $\displaystyle\int_2^6f(x)\cos\frac{\pi x}{4}dx=\frac{4}{\pi}\left[f(x)\sin\frac{\pi x}{4}\right]_2^6-\frac{4}{\pi}\int_2^6f'(x)\sin\frac{\pi x}{4}dx$이다.
        조건 (나)에서 $f(6)=-f(2)$이므로 $\left[f(x)\sin\dfrac{\pi x}{4}\right]_2^6=f(6)\sin\dfrac{3\pi}{2}-f(2)\sin\dfrac{\pi}{2}=-f(6)-f(2)=0$이다.
        따라서 $\displaystyle\int_2^6f(x)\cos\frac{\pi x}{4}dx=-\frac{4}{\pi}\int_2^6f'(x)\sin\frac{\pi x}{4}dx$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        다시 부분적분하면 $=-\dfrac{4}{\pi}\left(-\dfrac{4}{\pi}\left[f'(x)\cos\dfrac{\pi x}{4}\right]_2^6+\dfrac{4}{\pi}\displaystyle\int_2^6f''(x)\cos\frac{\pi x}{4}dx\right)$이고, $\cos\dfrac{\pi}{2}=0$, $\cos\dfrac{3\pi}{2}=0$과 조건 (가)에 의하여
        $\displaystyle\int_2^6f(x)\cos\frac{\pi x}{4}dx=-\frac{4}{\pi}\left(-\frac{4}{\pi}\cdot0+\frac{4}{\pi}\cdot\left(-\frac{\pi^2}{16}\right)\right)=1$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\displaystyle\int_2^6f(x)\cos\frac{\pi x}{4}dx=-\frac{4}{\pi}\int_2^6f'(x)\sin\frac{\pi x}{4}dx$를 유도했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\displaystyle\int_2^6f(x)\cos\frac{\pi x}{4}dx=1$을 도출했다.
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9462}
  misconceptions:
  - id: MC-CAL-9462
    outcome_code: '71'
    wrong_work: '$\cos\tfrac{\pi x}{4}$의 부정적분을 $\tfrac{\pi}{4}\sin\tfrac{\pi x}{4}$로 써서 값이 $\tfrac{\pi^4}{256}$ 등으로 나옴'
    detect_cue: 계수 $\tfrac{4}{\pi}$ 대신 $\tfrac{\pi}{4}$가 곱해져 있다
    feedback: $\left(\sin\tfrac{\pi x}{4}\right)^{\prime}=\tfrac{\pi}{4}\cos\tfrac{\pi x}{4}$이므로 부정적분에는 역수 $\tfrac{4}{\pi}$가 붙습니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $\displaystyle\lim_{m\to\infty}\frac{1}{m^2}\sum_{n=1}^ma_n$의 값을 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(x)=f(x)\cos\tfrac{\pi x}{4}$는 $x\ge2$에서 주기 4이므로 $a_{n+1}-a_n=\int_2^6g=1$, $a_n=n+t$.
    steps:
    - id: 2a
      content: |
        $a_n=n+\int_0^2g$, $\tfrac{1}{m^2}\sum(n+t)=\tfrac{m+1}{2m}+\tfrac{t}{m}\to\tfrac12$
      criteria: ['2.M1', '2.A1', '2.M2', '2.A2']
    hint_ladder:
    - $f(x+4)\cos\tfrac{\pi(x+4)}{4}$를 $f(x)\cos\tfrac{\pi x}{4}$로 나타내 보자.
    - $a_{n+1}-a_n$은 길이 4인 구간의 적분이다.
  - id: S2-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅱ)」 pp.4-5 예시답안 1-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(x)=f(x)\cos\dfrac{\pi x}{4}$라 하면, $x\ge2$인 모든 실수 $x$에 대해 $g(x+4)=f(x+4)\cdot\cos\left(\pi+\dfrac{\pi x}{4}\right)=(-f(x))\cdot\left(-\cos\dfrac{\pi x}{4}\right)=g(x)$ …… ㉠ 이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        문항 (1)에 의하여 $a_1=\displaystyle\int_0^6g=\int_0^2g+\int_2^6g=\int_0^2g(x)dx+1$이고, $a_{n+1}-a_n=\displaystyle\int_{4n+2}^{4n+6}g(x)dx$에서 $x=y+4n$이라 놓으면 ㉠과 문항 (1)에 의하여 $a_{n+1}-a_n=\displaystyle\int_2^6g(y+4n)dy=\int_2^6g(y)dy=1$이다.
        따라서 $a_n$은 첫째항이 $\int_0^2g(x)dx+1$, 공차가 1인 등차수열이고 $a_n=n+\displaystyle\int_0^2g(x)dx$ …… ㉡ 이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $\displaystyle\lim_{m\to\infty}\frac{1}{m^2}\sum_{n=1}^ma_n=\lim_{m\to\infty}\left(\frac{1}{m^2}\sum_{n=1}^mn+\frac{1}{m^2}\left(\int_0^2g\right)\sum_{n=1}^m1\right)$이고 $\sum_{n=1}^mn=\dfrac{m(m+1)}{2}$, $\sum_{n=1}^m1=m$이므로 $\displaystyle\lim_{m\to\infty}\frac{m(m+1)}{2m^2}=\frac12$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        수열의 극한의 기본 성질에 의해 $\displaystyle\lim_{m\to\infty}\frac{1}{m^2}\sum_{n=1}^ma_n=\lim_{m\to\infty}\frac{m(m+1)}{2m^2}+\lim_{m\to\infty}\frac1m\int_0^2g(x)dx=\frac12$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $x\ge2$에서 $f(x+4)\cos\dfrac{\pi(x+4)}{4}=f(x)\cos\dfrac{\pi x}{4}$임을 유도했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $a_n=n+\displaystyle\int_0^2f(x)\cos\frac{\pi x}{4}dx$임을 유도했다.
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-2, 2a]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $\displaystyle\lim_{m\to\infty}\frac{1}{m^2}\sum_{n=1}^mn=\frac12$을 유도했다.
      depends_on: []
      steps: [2b-3, 2a]
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: |
        $\displaystyle\lim_{m\to\infty}\frac{1}{m^2}\sum_{n=1}^ma_n=\frac12$을 도출했다.
      depends_on: [2.A1, 2.M2]
      steps: [2b-4, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-9463}
  misconceptions:
  - id: MC-CAL-9463
    outcome_code: '72'
    wrong_work: '$f(x+4)=-f(x)$만 보고 길이 4인 구간마다 적분값이 $1,-1,1,\cdots$로 교대한다고 판단해 극한을 0으로 답함'
    detect_cue: $\cos\tfrac{\pi(x+4)}{4}=-\cos\tfrac{\pi x}{4}$의 부호 반전을 반영하지 않았다
    feedback: 피적분함수 $f(x)\cos\tfrac{\pi x}{4}$ 전체를 보세요. 두 인수가 모두 부호를 바꾸므로 곱은 주기 4입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    다음 부등식이 성립함을 증명하시오.

    $$a_1^2+\cdots+a_{2026}^2\ge\frac{2025\times2026\times2027}{12}$$
  points: 12
  depends_on: ['2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\sum(n+t)^2=2026\left(t^2+2027t+\tfrac{2027\cdot4053}{6}\right)$을 완전제곱식으로 바꾼다.
    steps:
    - id: 3a
      content: |
        $2026\left(\left(t+\tfrac{2027}{2}\right)^2+\tfrac{2025\cdot2027}{12}\right)\ge\tfrac{2025\cdot2026\cdot2027}{12}$
      criteria: ['3.B1', '3.M1', '3.A1']
    hint_ladder:
    - (2)의 $a_n=n+t$를 대입해 $t$에 대한 식으로 정리하자.
    - $t$에 대한 이차식의 최솟값은?
  - id: S3-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅱ)」 pp.5-6 예시답안 1-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        식 ㉡에 의하여 $a_1^2+\cdots+a_{2026}^2=\displaystyle\sum_{n=1}^{2026}\left(n+\int_0^2g\right)^2=\sum n^2+2\left(\int_0^2g\right)\sum n+\left(\int_0^2g\right)^2\sum1$ …… ㉢ 이다.
        자연수의 거듭제곱의 합에 의하여 $\displaystyle\sum_{n=1}^{2026}n^2=\frac{2026\times2027\times4053}{6}$, $\displaystyle\sum_{n=1}^{2026}n=\frac{2026\times2027}{2}$, $\displaystyle\sum_{n=1}^{2026}1=2026$ …… ㉣ 이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        $t=\displaystyle\int_0^2g(x)dx$라 하면 ㉢, ㉣에 의하여 $a_1^2+\cdots+a_{2026}^2=2026\left(t^2+2027t+\dfrac{2027\times4053}{6}\right)$ …… ㉤ 이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        $2026\left(t^2+2027t+\dfrac{2027\times4053}{6}\right)=2026\left(\left(t+\dfrac{2027}{2}\right)^2+\dfrac{2025\times2027}{12}\right)\ge\dfrac{2025\times2026\times2027}{12}$ …… ㉥ 이므로 ㉤, ㉥에 의하여 주어진 부등식이 성립한다. ■
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 5
      evidence: |
        $\displaystyle\sum_{n=1}^{2026}n^2=\frac{2026\times2027\times4053}{6}$, $\displaystyle\sum_{n=1}^{2026}n=\frac{2026\times2027}{2}$, $\displaystyle\sum_{n=1}^{2026}1=2026$을 유도했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3a]
    - id: 3.M1
