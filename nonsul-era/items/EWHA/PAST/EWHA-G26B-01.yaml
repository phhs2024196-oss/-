  - id: MC-ALG-9464
    outcome_code: '73'
    wrong_work: '$\int_0^2f\cos\tfrac{\pi x}{4}dx$를 0으로 두어 $a_n=n$, $\sum n^2$만 계산하고 부등식을 확인'
    detect_cue: $t$를 미지수로 남기지 않고 특정 값으로 정했다
