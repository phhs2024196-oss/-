intent: |
  부분적분법으로 정적분 값을 구하고 그 결과로 적분으로 주어진 수열의 관계(등차수열)를 파악하여 극한값을 찾으며, 자연수의 거듭제곱의 합·이차함수의 최솟값·등차수열의 성질로 부등식과 분수 꼴 수열의 합을 도출하는 능력을 본다(공식 출제의도 요지).
key_idea: |
  두 번 부분적분하면 경계항이 (나)와 $\cos\tfrac{\pi}{2}=\cos\tfrac{3\pi}{2}=0$으로 사라져 $\int_2^6f\cos\tfrac{\pi x}{4}dx=1$. $g(x)=f(x)\cos\tfrac{\pi x}{4}$는 $x\ge2$에서 $g(x+4)=g(x)$이므로 $a_{n+1}-a_n=1$, $a_n=n+t$ ($t=\int_0^2g$). $\sum a_n^2$은 $t$의 이차식이고, 등호일 때 $a_n=n-\tfrac{2027}{2}$은 $a_n=-a_{2027-n}$.
stuck: |
  (2)에서 $f(x+4)=-f(x)$와 $\cos\left(\pi+\tfrac{\pi x}{4}\right)=-\cos\tfrac{\pi x}{4}$가 상쇄되어 $g$가 주기 4임을 보는 것, (4)에서 $\dfrac{a_n+a_{n+1}}{a_n^2a_{n+1}^2}=\dfrac{1}{a_n^2}-\dfrac{1}{a_{n+1}^2}$와 대칭 $a_n=-a_{2027-n}$
idea_tags: [IDEA-IBP-TWICE-BOUNDARY-VANISH, IDEA-ANTIPERIODIC-TIMES-COS, IDEA-QUADRATIC-IN-PARAMETER-MIN, IDEA-SYMMETRIC-CANCEL]
tags: [부분적분, 적분으로 정의된 수열, 등차수열, 거듭제곱의 합, 이차함수 최솟값]
