- id: '4'
  stem: |
    문항(3)의 부등식의 등호가 성립할 때 다음 식의 값을 구하시오.

    $$\frac{a_1+a_2}{a_1^2a_2^2}+\frac{a_3+a_4}{a_3^2a_4^2}+\cdots+\frac{a_{2025}+a_{2026}}{a_{2025}^2a_{2026}^2}$$
  points: 12
  depends_on: ['2', '3']
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 공차 1이므로 각 항은 $\tfrac{1}{a_n^2}-\tfrac{1}{a_{n+1}^2}$, 등호에서 $a_n=n-\tfrac{2027}{2}$은 $a_n=-a_{2027-n}$이라 짝지어 소거된다.
    steps:
    - id: 4a
      content: |
        합 $=\sum_{n=1}^{2026}\tfrac{(-1)^{n+1}}{a_n^2}$, $a_n^2=a_{2027-n}^2$이고 $n$과 $2027-n$의 홀짝이 반대 → 0
      criteria: ['4.B1', '4.B2', '4.M2', '4.A2']
    hint_ladder:
    - $a_{n+1}-a_n=1$을 분자에 곱해 보자.
    - 등호일 때 $a_n$을 구하고, $a_n$과 $a_{2027-n}$의 관계를 보자.
  - id: S4-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅱ)」 p.6 예시답안 1-(4)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $a_{n+1}-a_n=1$이므로 $\dfrac{a_n+a_{n+1}}{a_n^2a_{n+1}^2}=\dfrac{(a_n+a_{n+1})(a_{n+1}-a_n)}{a_n^2a_{n+1}^2}=\dfrac{a_{n+1}^2-a_n^2}{a_n^2a_{n+1}^2}=\dfrac{1}{a_n^2}-\dfrac{1}{a_{n+1}^2}$이다.
        따라서 주어진 식은 $\dfrac{1}{a_1^2}-\dfrac{1}{a_2^2}+\dfrac{1}{a_3^2}-\dfrac{1}{a_4^2}+\cdots+\dfrac{1}{a_{2025}^2}-\dfrac{1}{a_{2026}^2}$이다.
      criteria: ['4.A2']
    - id: 4b-2
      content: |
        문항 (3)의 부등식에서 등호가 성립하면 ㉤과 ㉥에 의하여 $t=\displaystyle\int_0^2g(x)dx=-\frac{2027}{2}$이다.
      criteria: ['4.B1']
    - id: 4b-3
      content: |
        따라서 ㉡에 의하여 $a_n=n-\dfrac{2027}{2}$이다.
      criteria: ['4.B2']
    - id: 4b-4
      content: |
        $1\le n\le2026$인 자연수 $n$에 대하여 $a_n+a_{2027-n}=\left(n-\dfrac{2027}{2}\right)+\left(2027-n-\dfrac{2027}{2}\right)=0$이므로 $a_n=-a_{2027-n}$이 성립한다.
      criteria: ['4.M2']
    - id: 4b-5
      content: |
        따라서 주어진 식 $=\left(\dfrac{1}{a_1^2}-\dfrac{1}{a_{2026}^2}\right)+\left(-\dfrac{1}{a_2^2}+\dfrac{1}{a_{2025}^2}\right)+\cdots+\left(\dfrac{1}{a_{1013}^2}-\dfrac{1}{a_{1014}^2}\right)=0$이다.
      criteria: ['4.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.B1
      mark_type: B
      points: 3
      evidence: |
        $\displaystyle\int_0^2f(x)\cos\frac{\pi x}{4}dx=-\frac{2027}{2}$임을 유도했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [3.M1], max_points: 3}
      steps: [4b-2, 4a]
    - id: 4.B2
      mark_type: B
      points: 1
      evidence: |
        $a_n=n-\dfrac{2027}{2}$임을 유도했다.
      depends_on: [4.B1]
      steps: [4b-3, 4a]
    - id: 4.M2
      mark_type: M
      points: 4
      evidence: |
        $a_n=-a_{2027-n}$임을 유도했다.
      depends_on: []
      steps: [4b-4, 4a]
    - id: 4.A2
      mark_type: A
      points: 4
      evidence: |
        주어진 식의 값이 0임을 도출했다.
      depends_on: [4.M2, 4.B2]
      steps: [4b-1, 4b-5, 4a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '74', misconception: MC-ALG-9465}
  misconceptions:
  - id: MC-ALG-9465
    outcome_code: '74'
    wrong_work: '$\tfrac{1}{a_1^2}-\tfrac{1}{a_2^2}+\tfrac{1}{a_3^2}-\cdots$를 연속 망원합으로 보고 $\tfrac{1}{a_1^2}-\tfrac{1}{a_{2026}^2}$로 처리'
    detect_cue: 짝으로 묶인 항 사이($-\tfrac{1}{a_2^2}$와 $+\tfrac{1}{a_3^2}$)를 소거했다
    feedback: 묶음은 $(a_1,a_2),(a_3,a_4),\cdots$뿐이라 이웃 묶음끼리는 소거되지 않습니다. 대칭 $a_n=-a_{2027-n}$을 이용해 앞뒤 항을 짝지으세요.
    remedy: [RL-4]

