        $a_1^2+\cdots+a_{2026}^2=2026\left(t^2+2027t+\dfrac{2027\times4053}{6}\right)$ $\left(t=\int_0^2f(x)\cos\frac{\pi x}{4}dx\right)$를 유도했다.
      depends_on: []
