stimuli: []

stem: |
  양의 실수 전체의 집합에서 정의되고 미분가능한 함수 $f(x)=\left(\dfrac{x}{x+6}\right)^x$에 대하여 아래 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{x\to0+}f(x)$와 $\displaystyle\lim_{x\to\infty}f(x)$의 값을 각각 구하시오. (단, $\displaystyle\lim_{x\to0+}x^x=1$이다.)
  points: 10
  depends_on: []
  answer: {kind: value, value: 'lim0=1; liminf=exp(-6)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\ln f=x\ln x-x\ln(x+6)\to0$ $(x\to0+)$, $f=\left(\left(1+\tfrac6x\right)^{x/6}\right)^{-6}\to e^{-6}$ $(x\to\infty)$.
    steps:
    - id: 1a
      content: |
        $\lim_{x\to0+}f=e^0=1$, $\lim_{x\to\infty}f=e^{-6}$
      criteria: ['1.B1', '1.B2']
    hint_ladder:
    - 지수에 $x$가 있으면 로그를 취해 보자.
    - $\dfrac{x}{x+6}=\dfrac{1}{1+\frac6x}$로 바꾸면 $e$의 정의가 보인다.
  - id: S1-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅱ)」 p.9 예시답안 2-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        양의 실수 $x$에 대해 $\dfrac{x}{x+6}>0$이므로 $f(x)>0$이고 함수 $g(x)=\ln f(x)=x\ln x-x\ln(x+6)$이 잘 정의된다.
        $\displaystyle\lim_{x\to0+}x^x=1$이고 $x\ln x=\ln(x^x)$이므로 $\displaystyle\lim_{x\to0+}x\ln x=\ln1=0$이다. 또한 $\displaystyle\lim_{x\to0+}x\ln(x+6)=0\cdot\ln6=0$이다.
        따라서 $\displaystyle\lim_{x\to0+}g(x)=0-0=0$이고 $f(x)=e^{g(x)}$이므로 $\displaystyle\lim_{x\to0+}f(x)=e^0=1$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to\infty}f(x)=\lim_{x\to\infty}\left(\frac{x}{x+6}\right)^x=\lim_{x\to\infty}\left(\left(\frac{1}{1+\frac6x}\right)^{\frac x6}\right)^6=\frac{1}{e^6}=e^{-6}$이다.
      criteria: ['1.B2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: |
        $\displaystyle\lim_{x\to0+}x^x=1$을 활용하여 $\displaystyle\lim_{x\to0+}g(x)=\lim_{x\to0+}\ln f(x)=0$을 구하고 $\displaystyle\lim_{x\to0+}f(x)=1$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: |
        $\displaystyle\lim_{x\to\infty}f(x)=e^{-6}$임을 구했다.
      depends_on: []
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9466}
  misconceptions:
  - id: MC-CAL-9466
    outcome_code: '71'
    wrong_work: '$\left(\dfrac{x}{x+6}\right)^x\to1^\infty=1$ 또는 $\left(1+\tfrac6x\right)^x\to e^6$을 그대로 답으로 적어 $e^6$'
    detect_cue: $\lim_{x\to\infty}f(x)$를 1 또는 $e^{6}$으로 적었다
    feedback: $1^\infty$ 꼴은 값이 정해지지 않습니다. $\dfrac{x}{x+6}=\left(1+\tfrac6x\right)^{-1}$이므로 극한은 $e^{-6}$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    함수 $f(x)$는 구간 $(0,\infty)$에서 감소함을 보이시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g^{\prime}(x)=h\left(\tfrac{6}{x+6}\right)$, $h(y)=\ln(1-y)+y<0$이고 $f^{\prime}=fg^{\prime}$.
    steps:
    - id: 2a
      content: |
        $g'(x)=\ln\left(1-\tfrac{6}{x+6}\right)+\tfrac{6}{x+6}=h(y)<0$, $f'=fg'<0$
      criteria: ['2.M1', '2.R1']
    hint_ladder:
    - $\ln f(x)$를 미분해 보자.
    - $g'(x)$를 $y=\tfrac{6}{x+6}$의 함수로 쓰면?
  - id: S2-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅱ)」 pp.9-10 예시답안 2-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(x)=\ln f(x)=x\ln x-x\ln(x+6)$은 양의 실수 전체에서 미분가능하므로
        $g'(x)=\ln x-\ln(x+6)+1-\dfrac{x}{x+6}=\ln\left(\dfrac{x}{x+6}\right)+\dfrac{6}{x+6}=\ln\left(1-\dfrac{6}{x+6}\right)+\dfrac{6}{x+6}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $h(y)=\ln(1-y)+y$라 하면 $h'(y)=-\dfrac{1}{1-y}+1=\dfrac{y}{y-1}$이므로 $0<y<1$에서 $h'(y)<0$이다. 따라서 $h$는 $[0,1)$에서 감소하고 $0<y<1$에서 $h(y)<h(0)=\ln1+0=0$이다.
        $\dfrac{6}{x+6}=y$로 치환하면 모든 양의 실수 $x$에서 $0<y<1$이므로 $g'(x)=h(y)<0$이다.
        $g'(x)=\dfrac{f'(x)}{f(x)}$이고 $f(x)>0$이므로 $f'(x)=f(x)g'(x)<0$이다. 따라서 $f(x)$는 구간 $(0,\infty)$에서 감소한다. ■
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        함수 $f(x)$의 도함수 또는 $\ln f(x)$의 도함수를 정확히 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: |
        구간 $(0,\infty)$에서 $f'(x)<0$임을 보여 감소함수임을 논했다. 또는 $\dfrac{f'(x)}{f(x)}<0$과 $f(x)>0$을 정확히 언급하여 $f'(x)<0$을 결론지었다.
      depends_on: [2.M1]
      steps: [2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-9467}
  misconceptions:
  - id: MC-CAL-9467
    outcome_code: '72'
    wrong_work: '$\left(x\ln\tfrac{x}{x+6}\right)^{\prime}=\ln\tfrac{x}{x+6}$로 곱의 미분 항을 빠뜨려 「$\ln$ 값이 음수이므로 감소」로 결론'
    detect_cue: $g'(x)$에 $\tfrac{6}{x+6}$ 항이 없다
    feedback: $x\ln u(x)$는 곱이므로 $\ln u+x\cdot\tfrac{u'}{u}$입니다. 추가 항 $\tfrac{6}{x+6}>0$ 때문에 부호 판정에 보조함수가 필요합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $f(c)=\dfrac{1}{15}$을 만족시키는 양의 실수 $c$가 오직 하나 존재함을 보이시오.
  points: 10
  depends_on: ['2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f(1)=\tfrac17>\tfrac1{15}>\tfrac1{27}=f(3)$, 연속이므로 사잇값 정리, 감소이므로 유일.
    steps:
    - id: 3a
      content: |
        $f(1)>\tfrac1{15}>f(3)$ → 사잇값 정리 → 감소성으로 유일
      criteria: ['3.B1', '3.R1', '3.R2']
    hint_ladder:
    - $f$의 값이 $\tfrac1{15}$보다 큰 점과 작은 점을 하나씩 찾아보자.
  - id: S3-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅱ)」 p.10 예시답안 2-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(1)=\dfrac17$, $f(3)=\left(\dfrac13\right)^3=\dfrac1{27}$이므로 $f(1)=\dfrac17>\dfrac1{15}>\dfrac1{27}=f(3)$이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        함수 $f(x)$가 연속이므로 사잇값의 정리에 의해 $f(c)=\dfrac1{15}$인 $c$가 열린구간 $(1,3)$에 적어도 하나 존재한다.
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        문항 (2)에 의해 $f(x)$는 구간 $(0,\infty)$에서 감소하므로 $f(c)=\dfrac1{15}$인 양의 실수 $c$가 오직 하나 존재한다. ■
      criteria: ['3.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 4
      evidence: |
        $f(a)<\dfrac1{15}$, $f(b)>\dfrac1{15}$이 되는 양수 $a$와 $b$를 구체적으로 제시했다(예: $f(3)=\tfrac1{27}$, $f(1)=\tfrac17$).
      depends_on: []
      implied_ok: false
      accept:
      - '(1)의 극한 $\lim_{x\to0+}f=1>\tfrac1{15}>e^{-6}=\lim_{x\to\infty}f$를 근거로 한 존재 논증도 공식 기준(구체적 수 제시)에 준해 판단 — 채점자 확인 필요'
      steps: [3b-1, 3a]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        사잇값의 정리에 의해 $f(c)=\dfrac1{15}$인 양수 $c$가 구간 $(a,b)$에 있음을 보였다.
      depends_on: [3.B1]
      steps: [3b-2, 3a]
    - id: 3.R2
      mark_type: R
      points: 3
      evidence: |
        $f(x)$가 감소함수임을 이용하여 $f(c)=\dfrac1{15}$인 양수 $c$가 유일함을 보였다.
      depends_on: [3.R1]
      ft: {allowed: true, from: [2.R1], max_points: 3}
      steps: [3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-CAL-9551}
  misconceptions:
  - id: MC-CAL-9551
    outcome_code: '73'
    wrong_work: '$f(1)>\tfrac1{15}>f(3)$과 사잇값 정리로 $c$의 존재만 보이고 「오직 하나」라고 결론'
    detect_cue: (2)의 감소성을 유일성 근거로 인용하지 않았다
    feedback: 존재는 사잇값 정리, 유일성은 감소성(일대일)으로 각각 보여야 합니다.
    remedy: [RL-3]

