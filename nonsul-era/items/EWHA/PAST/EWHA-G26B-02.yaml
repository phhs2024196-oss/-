intent: |
  로그를 취하고 자연상수 $e$의 정의를 활용해 함수의 극한값을 구하고, 도함수가 음의 값을 가짐을 판단해 감소함수임을 보이며, 사잇값 정리로 함숫값이 특정 값이 되는 양의 실수가 유일함을 추론하는 능력을 본다(공식 출제의도 요지).
key_idea: |
  $g(x)=\ln f(x)=x\ln x-x\ln(x+6)$. $g'(x)=\ln\left(1-\tfrac{6}{x+6}\right)+\tfrac{6}{x+6}$이고 $h(y)=\ln(1-y)+y<0$ $(0<y<1)$이므로 $f'=fg'<0$. $f(1)=\tfrac17>\tfrac1{15}>\tfrac1{27}=f(3)$.
stuck: |
  $g'(x)$의 부호를 판정하기 위해 $y=\tfrac{6}{x+6}$으로 치환한 보조함수 $h(y)=\ln(1-y)+y$를 세우는 것
