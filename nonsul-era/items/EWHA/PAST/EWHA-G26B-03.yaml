      content: |
        $2\sum\left(\tfrac1{k^2}-\tfrac1{(k+1)^2}\right)=2$
      criteria: ['3.M1', '3.A1']
    hint_ladder:
    - $(k+1)^2-k^2=2k+1$을 떠올리자.
  - id: S3-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅱ)」 p.15 예시답안 3-(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        문항 (2)의 결과에 따라 $h_k=\dfrac{(k+1)^2}{2k}$이므로 $\displaystyle\sum_{k=1}^\infty\frac{2k+1}{k^3h_k}=\sum_{k=1}^\infty\frac{2(2k+1)}{k^2(k+1)^2}=2\sum_{k=1}^\infty\left(\frac1{k^2}-\frac1{(k+1)^2}\right)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        부분합이 $2\left(1-\dfrac{1}{(n+1)^2}\right)$이므로 $\displaystyle2\sum_{k=1}^\infty\left(\frac1{k^2}-\frac1{(k+1)^2}\right)=2\left(1-\lim_{n\to\infty}\frac{1}{(n+1)^2}\right)=2$이다.
      criteria: ['3.A1']
