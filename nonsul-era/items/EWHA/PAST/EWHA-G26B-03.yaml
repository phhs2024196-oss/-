tags: [절댓값 도형, 마름모, 접선의 절편, 산술·기하평균, 망원급수]
elements:
  materials:
  - '집합 $A=\left\{(x,y)\mid\dfrac{\lvert x\rvert}{a}+\dfrac{\lvert y\rvert}{b}=1\right\}$(대각선 $2a$, $2b$인 마름모)'
  - '집합 $B=\left\{(x,y)\mid\lvert x^ky\rvert=3\right\}$(곡선 $y=\pm\tfrac{3}{\lvert x\rvert^k}$)'
  - '조건 $n(A\cap B)=4$, $a,b>0$, $k$는 자연수'
  - '급수 $\sum_{k=1}^\infty\dfrac{2k+1}{k^3h_k}$'
  concepts:
  - '집합의 연산'
  - '원점·$x$축·$y$축에 대한 대칭이동'
  - '직선의 방정식(절편형)'
  - '유리함수의 그래프'
  - '접선의 방정식'
  - '산술평균과 기하평균의 관계'
  - '급수의 수렴과 합'
  tools:
  - '제1사분면으로 축소($x,y>0$)'
  - '접점 $\left(\alpha,\tfrac{3}{\alpha^k}\right)$에서의 접선 $y-\tfrac{3}{\alpha^k}=-\tfrac{3k}{\alpha^{k+1}}(x-\alpha)$의 절편'
  - '마름모 넓이 $\tfrac12(2a)(2b)=2ab$, 둘레 $4\sqrt{a^2+b^2}$'
  - '$a^2+b^2\ge2ab$'
  - '$\dfrac{2(2k+1)}{k^2(k+1)^2}=2\left(\dfrac1{k^2}-\dfrac1{(k+1)^2}\right)$'
  conditions:
  - '$k=1$일 때 $ab=12$'
  - '$A\cap B$의 네 점 $(\pm\alpha,\pm\tfrac{3}{\alpha^k})$이 만드는 직사각형'
  stimuli_used: []
  subpart_links: '(2)는 (1)의 접선 방법을 일반 $k$로 확장, (3)은 (2)의 $h_k$를 사용'

