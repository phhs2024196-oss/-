intent: |
  집합과 등식으로 주어진 좌표평면의 도형이 $x$축·$y$축에 대칭임을 이해하고, 교점이 4개라는 조건을 접선 조건으로 해석해 접선의 방정식으로 넓이를 구하며, 둘레의 길이의 최솟값을 부등식으로 계산하고 넓이의 비율로 주어진 급수의 합을 구하는 능력을 본다(공식 출제의도 요지).
key_idea: |
  두 도형 모두 두 축에 대칭이므로 제1사분면만 보면 되고, $n(A\cap B)=4$는 선분 $\tfrac xa+\tfrac yb=1$이 곡선 $y=\tfrac{3}{x^k}$에 접한다는 뜻이다. 접점 $\left(\alpha,\tfrac{3}{\alpha^k}\right)$의 접선 절편에서 $a=\tfrac{k+1}{k}\alpha$, $b=\tfrac{3(k+1)}{\alpha^k}$이고, 마름모 넓이 $2ab$와 직사각형 넓이 $\tfrac{12}{\alpha^{k-1}}$의 비가 $\tfrac{(k+1)^2}{2k}$로 $\alpha$에 무관하다.
stuck: |
  $n(A\cap B)=4$를 「제1사분면에서 직선과 곡선이 접한다」로 바꾸는 해석
