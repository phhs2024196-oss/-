stimuli: []

stem: |
  좌표평면에 주어진 두 집합

  $$A=\left\{(x,y)\,\middle|\,\frac{\lvert x\rvert}{a}+\frac{\lvert y\rvert}{b}=1\right\},\quad B=\left\{(x,y)\,\middle|\,\lvert x^ky\rvert=3\right\}$$

  에 대하여 $n(A\cap B)=4$일 때 다음 물음에 답하시오. (단, $a,b$는 양수, $k$는 자연수) [30점]

subparts:
- id: '1'
  stem: |
    $k=1$일 때 집합 $A$가 나타내는 도형의 넓이가 일정함을 보이고, 이때 집합 $A$가 나타내는 도형의 둘레의 길이의 최솟값을 구하시오.
  points: 13
  depends_on: []
  answer: {kind: value, value: 'area=24; min_perimeter=8*sqrt(6)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 제1사분면에서 $\tfrac xa+\tfrac yb=1$이 $y=\tfrac3x$에 접하면 $a=2\alpha$, $b=\tfrac6\alpha$이므로 $ab=12$, 넓이 $2ab=24$, 둘레 $4\sqrt{a^2+b^2}\ge4\sqrt{2ab}=8\sqrt6$.
    steps:
    - id: 1a
      content: |
        $a=2\alpha$, $b=\tfrac6\alpha$, 넓이 $=24$, 둘레 $\ge4\sqrt{24}=8\sqrt6$
      criteria: ['1.B1', '1.M1', '1.A1', '1.A2', '1.B2', '1.A3']
    hint_ladder:
    - 두 도형은 어떤 대칭성을 가지는가? 제1사분면에서 교점이 몇 개여야 하는가?
    - 교점이 하나뿐이면 직선과 곡선은 어떤 관계인가?
  - id: S1-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅱ)」 p.14 예시답안 3-(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        집합 $A$, $B$가 나타내는 도형들은 모두 $x$축과 $y$축에 대하여 대칭이다. $k=1$이면 양의 실수 $a,b$에 대하여 직선 $\dfrac xa+\dfrac yb=1$이 제1사분면에서 곡선 $y=\dfrac3x$에 접할 때 주어진 조건을 만족한다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        접점을 $\left(\alpha,\dfrac3\alpha\right)$ $(\alpha>0)$라 하면 $y'=-\dfrac{3}{x^2}$이므로 접선의 기울기는 $-\dfrac{3}{\alpha^2}$이고 접선의 방정식은 $y-\dfrac3\alpha=-\dfrac{3}{\alpha^2}(x-\alpha)$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        이 접선과 $x$축의 교점이 $(2\alpha,0)$, $y$축의 교점이 $\left(0,\dfrac6\alpha\right)$이므로 $a=2\alpha$, $b=\dfrac6\alpha$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        집합 $A$가 나타내는 도형은 대각선의 길이가 $2a$, $2b$인 마름모이므로 넓이는 $\dfrac12(2a\cdot2b)=2ab=2\left(2\alpha\cdot\dfrac6\alpha\right)=24$이다. 그러므로 넓이는 $a,b$에 관계없이 일정하다.
      criteria: ['1.A2']
    - id: 1b-5
      content: |
        마름모의 둘레의 길이는 $4\sqrt{a^2+b^2}$이다.
      criteria: ['1.B2']
    - id: 1b-6
      content: |
        양의 실수 $a,b$는 $ab=12$를 만족하므로 산술평균과 기하평균의 부등식에 의해 $a^2+b^2\ge2\sqrt{a^2b^2}=2ab=24$이고, 둘레의 길이 $4\sqrt{a^2+b^2}$의 최솟값은 $4\sqrt{24}=8\sqrt6$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        집합 $A$, $B$가 나타내는 도형들이 모두 $x$축과 $y$축에 대하여 대칭임을 명시하거나 그림으로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        곡선 $y=\dfrac3x$의 점 $\left(\alpha,\dfrac3\alpha\right)$ $(\alpha>0)$에서 접선의 방정식을 바르게 구했다.
      depends_on: []
      steps: [1b-2, 1a]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $a=2\alpha$, $b=\dfrac6\alpha$를 바르게 구했다.
      depends_on: [1.M1]
      steps: [1b-3, 1a]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        마름모의 넓이를 $\dfrac12(2a\cdot2b)=24$로 구하여 넓이가 $a,b$에 관계없이 일정함을 보였다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-4, 1a]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: |
        마름모이므로 둘레의 길이가 $4\sqrt{a^2+b^2}$임을 바르게 구했다.
      depends_on: []
      steps: [1b-5, 1a]
    - id: 1.A3
      mark_type: A
      points: 3
      evidence: |
        산술평균과 기하평균의 부등식을 바르게 활용하여 둘레의 길이의 최솟값 $8\sqrt6$을 구했다.
      depends_on: [1.M1, 1.A2, 1.B2]
      steps: [1b-6, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9468}
  misconceptions:
  - id: MC-GEO-9468
    outcome_code: '71'
    wrong_work: '마름모 넓이를 대각선 곱 $2a\cdot2b=4ab=48$로 계산하거나 둘레를 $2(a+b)$로 계산'
    detect_cue: 넓이에 $\tfrac12$이 없거나 둘레가 변의 길이 $\sqrt{a^2+b^2}$를 쓰지 않았다
    feedback: 마름모 넓이는 (대각선 곱)$\times\tfrac12$, 한 변은 $(a,0)$과 $(0,b)$ 사이의 거리 $\sqrt{a^2+b^2}$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    자연수 $k$에 대하여 집합 $A$가 나타내는 도형의 넓이를 집합 $A\cap B$의 원소들을 꼭짓점으로 하는 사각형의 넓이로 나눈 값을 $h_k$라 할 때, $h_k$가 양수 $a,b$와 관계없이 일정함을 보이시오.
  points: 13
  depends_on: ['1']
  answer: {kind: expression, value: '(k+1)**2/(2*k)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 접점 $\left(\alpha,\tfrac{3}{\alpha^k}\right)$에서 $a=\tfrac{k+1}{k}\alpha$, $b=\tfrac{3(k+1)}{\alpha^k}$, 넓이비 $\dfrac{2ab}{4\alpha\cdot\frac{3}{\alpha^k}}=\dfrac{(k+1)^2}{2k}$.
    steps:
    - id: 2a
      content: |
        $2ab=\tfrac{6(k+1)^2}{k\alpha^{k-1}}$, 직사각형 $=\tfrac{12}{\alpha^{k-1}}$, $h_k=\tfrac{(k+1)^2}{2k}$
      criteria: ['2.B1', '2.M1', '2.A1', '2.A2', '2.A3', '2.A4']
    hint_ladder:
    - (1)과 같은 방법으로 $y=\tfrac{3}{x^k}$의 접선 절편을 구하자.
    - $A\cap B$의 네 점은 대칭이므로 어떤 사각형을 이루는가?
  - id: S2-B
    audience: B
    source_flow: 「2026 논술고사 답안지(자연Ⅱ)」 pp.14-15 예시답안 3-(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        집합 $A$, $B$가 나타내는 도형들은 모두 $x$축과 $y$축에 대하여 대칭이다. 자연수 $k$와 양수 $a,b$에 대하여 직선 $\dfrac xa+\dfrac yb=1$이 제1사분면에서 곡선 $y=\dfrac{3}{x^k}$에 접할 때 주어진 조건을 만족한다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        접점을 $\left(\alpha,\dfrac{3}{\alpha^k}\right)$ $(\alpha>0)$라 하면 $y'=-\dfrac{3k}{x^{k+1}}$이므로 접선의 방정식은 $y-\dfrac{3}{\alpha^k}=-\dfrac{3k}{\alpha^{k+1}}(x-\alpha)$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        이 접선과 $x$축의 교점이 $\left(\dfrac{k+1}{k}\alpha,0\right)$, $y$축의 교점이 $\left(0,\dfrac{3(k+1)}{\alpha^k}\right)$이므로 $a=\dfrac{k+1}{k}\alpha$, $b=\dfrac{3(k+1)}{\alpha^k}$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        집합 $A$가 나타내는 도형은 대각선의 길이가 $2a$, $2b$인 마름모이므로 넓이는 $\dfrac12(2a\cdot2b)=2ab=6\dfrac{(k+1)^2}{k\alpha^{k-1}}$이다.
      criteria: ['2.A2']
    - id: 2b-5
      content: |
        대칭성에 의해 $\left(\alpha,\dfrac{3}{\alpha^k}\right)$, $\left(-\alpha,\dfrac{3}{\alpha^k}\right)$, $\left(\alpha,-\dfrac{3}{\alpha^k}\right)$, $\left(-\alpha,-\dfrac{3}{\alpha^k}\right)$가 $A\cap B$의 네 원소이고, 이들을 꼭짓점으로 하는 사각형은 직사각형이므로 넓이는 $4\left(\alpha\cdot\dfrac{3}{\alpha^k}\right)=\dfrac{12}{\alpha^{k-1}}$이다.
      criteria: ['2.A3']
    - id: 2b-6
      content: |
        따라서 $h_k=\left(6\dfrac{(k+1)^2}{k\alpha^{k-1}}\right)\cdot\left(\dfrac{12}{\alpha^{k-1}}\right)^{-1}=\dfrac{(k+1)^2}{2k}$이므로 양수 $a,b$와 관계없이 일정하다. ■
      criteria: ['2.A4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        집합 $A$, $B$가 나타내는 도형들이 모두 $x$축과 $y$축에 대하여 대칭임을 명시하거나 그림으로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        곡선 $y=\dfrac{3}{x^k}$의 점 $\left(\alpha,\dfrac{3}{\alpha^k}\right)$ $(\alpha>0)$에서 접하는 접선의 방정식을 바르게 구했다.
      depends_on: []
      steps: [2b-2, 2a]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $a=\dfrac{k+1}{k}\alpha$, $b=\dfrac{3(k+1)}{\alpha^k}$를 바르게 구했다.
      depends_on: [2.M1]
      steps: [2b-3, 2a]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        마름모의 넓이를 $2ab=6\dfrac{(k+1)^2}{k\alpha^{k-1}}$로 구했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-4, 2a]
    - id: 2.A3
      mark_type: A
      points: 3
      evidence: |
        $A\cap B$의 네 원소를 꼭짓점으로 하는 사각형이 직사각형임을 확인하고 넓이 $4\left(\alpha\cdot\dfrac{3}{\alpha^k}\right)=\dfrac{12}{\alpha^{k-1}}$를 구했다.
      depends_on: [2.M1]
      steps: [2b-5, 2a]
    - id: 2.A4
      mark_type: A
      points: 2
      evidence: |
        $h_k=\dfrac{(k+1)^2}{2k}$를 구하고 이 값이 양수 $a,b$와 관계없이 일정함을 보였다.
      depends_on: [2.M1, 2.A2, 2.A3]
      steps: [2b-6, 2a]
    deductions: []
