- id: '3'
  stem: |
    문항(2)의 $h_k$에 대하여 $\displaystyle\sum_{k=1}^{\infty}\frac{2k+1}{k^3h_k}$의 값을 구하시오.
  points: 4
  depends_on: ['2']
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{2k+1}{k^3h_k}=\dfrac{2(2k+1)}{k^2(k+1)^2}=2\left(\dfrac1{k^2}-\dfrac1{(k+1)^2}\right)$의 망원급수.
    steps:
