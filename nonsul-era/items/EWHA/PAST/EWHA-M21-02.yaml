intent: |
  그래프가 원점대칭인 함수와 $y$축대칭인 함수에 대응하는 홀함수와 짝함수의 정의를 이해하고 활용하여 주어진 지수함수를 홀함수와 짝함수의 합으로 나타내는 수리적 추론과 조작을 수행하는 문제이다(안내 출제의도).
key_idea: |
  홀함수이면서 짝함수인 함수는 $0$뿐이므로 홀·짝 분해는 유일하고, $e^x=\frac{e^x-e^{-x}}{2}+\frac{e^x+e^{-x}}{2}$이다.
