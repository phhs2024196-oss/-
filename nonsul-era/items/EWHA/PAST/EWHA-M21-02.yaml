stimuli: []

stem: |
  함수 $f(x)$가 모든 실수 $x$에 대하여 $f(-x)=-f(x)$이면 함수 $f(x)$를 홀함수라 하고, $f(-x)=f(x)$이면 짝함수라 한다. 실수에서 정의된 함수에 대하여 다음 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    함수 $l(x)=e^x+e^{-x}$가 짝함수임을 보이시오.
  points: 5
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $l(-x)$를 직접 계산한다.
    steps:
    - {id: 1a, content: '$l(-x)=e^{-x}+e^{x}=l(x)$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $x$ 자리에 $-x$를 넣어 보자.
  - id: S1-B
    audience: B
    source_flow: 안내_2021 자연 문제2 우수답안 및 해설 p.42
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        모든 실수 $x$에 대하여, 함수 $l(x)$가 $l(-x)=e^{-x}+e^{-(-x)}=e^{-x}+e^x=l(x)$
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        를 만족하므로 짝함수이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $l(-x)=e^{-x}+e^{-(-x)}$를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $l(-x)=l(x)$가 모든 실수 $x$에서 성립하므로 짝함수라고 결론지었다.
      depends_on: [1.M1]
      steps: [1b-1, 1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-9113}
  misconceptions:
  - id: MC-ALG-9113
    outcome_code: '71'
    wrong_work: '$l(-x)=-e^{x}-e^{-x}=-l(x)$'
    detect_cue: $x\to-x$ 대입을 함수값 앞의 부호로 처리했다
    feedback: $l(-x)$는 지수의 $x$를 $-x$로 바꾼 것입니다. $e^{-(-x)}=e^x$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    홀함수이면서 짝함수인 함수 $h(x)$를 모두 찾으시오.
  points: 7
  depends_on: []
  answer: {kind: expression, value: '0', equivalents: ['h(x)=0'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $h(x)=h(-x)=-h(x)$이므로 $h(x)=0$.
    steps:
    - {id: 2a, content: '$2h(x)=0$에서 $h\equiv0$.', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - 두 정의를 동시에 쓰면 $h(-x)$를 두 가지로 쓸 수 있다.
  - id: S2-B
    audience: B
    source_flow: 안내_2021 자연 문제2 우수답안 및 해설 p.42
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        만약 함수 $h(x)$가 홀함수이면서 짝함수이면, $h(-x)=h(x)$이고 $h(-x)=-h(x)$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 $h(x)=h(-x)=-h(x)$이므로 $h(x)=0$이다. 이러한 함수는 함숫값이 항상 0인 상수함수 뿐이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $h(-x)=h(x)$와 $h(-x)=-h(x)$를 함께 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $h(x)=-h(x)$에서 모든 $x$에 대해 $h(x)=0$, 즉 상수함수 $0$뿐임을 적었다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-ALG-9114}
  misconceptions:
  - id: MC-ALG-9114
    outcome_code: '72'
    wrong_work: '상수함수 $h(x)=c$는 $h(-x)=h(x)$이므로 모든 상수함수'
    detect_cue: 홀함수 조건 $h(-x)=-h(x)$를 확인하지 않았다
    feedback: $h(x)=c$가 홀함수이려면 $c=-c$, 즉 $c=0$이어야 합니다.
    remedy: [RL-1]

- id: '3'
  stem: |
    홀함수 $f_1,f_2$와 짝함수 $g_1,g_2$가 모든 실수 $x$에 대하여
    $$f_1(x)+g_1(x)=f_2(x)+g_2(x)$$
    일 때, $f_1(x)=f_2(x)$, $g_1(x)=g_2(x)$임을 보이시오.
  points: 9
  depends_on: ['2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f_1-f_2=g_2-g_1$은 홀함수이면서 짝함수이므로 (2)에 의해 $0$.
    steps:
    - {id: 3a, content: '$f_1-f_2$ 홀, $g_2-g_1$ 짝, 서로 같으므로 둘 다 $0$.', criteria: [3.M1, 3.A1, 3.R1]}
    hint_ladder:
    - 홀함수끼리, 짝함수끼리 한쪽에 모아 보자.
  - id: S3-B
    audience: B
    source_flow: 안내_2021 자연 문제2 우수답안 및 해설 p.43
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        주어진 식을 변형하면 $f_1(x)-f_2(x)=g_2(x)-g_1(x)$로 쓸 수 있다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $f_1,f_2$가 홀함수이므로 $f_1(-x)-f_2(-x)=-f_1(x)+f_2(x)=-(f_1(x)-f_2(x))$, 즉 $f_1(x)-f_2(x)$는 홀함수이다. 함수 $g_1,g_2$가 짝함수이므로 $g_2(-x)-g_1(-x)=g_2(x)-g_1(x)$, 즉 $g_2(x)-g_1(x)$는 짝함수이다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        따라서 $f_1(x)-f_2(x)$, $g_2(x)-g_1(x)$는 각각 홀함수이면서 짝함수이므로 (2)에 의해 $f_1(x)-f_2(x)=0$, $g_2(x)-g_1(x)=0$이다.
      criteria: [3.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $f_1(x)-f_2(x)=g_2(x)-g_1(x)$로 변형했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        $f_1-f_2$가 홀함수, $g_2-g_1$이 짝함수임을 정의로 확인했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        두 함수가 같으므로 홀함수이면서 짝함수이고, (2)에 의해 $0$이므로 $f_1=f_2$, $g_1=g_2$임을 결론지었다.
      depends_on: [3.A1]
      ft: {allowed: true, from: [2.A1], max_points: 3}
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-PRF-9115}
  misconceptions:
  - id: MC-PRF-9115
    outcome_code: '73'
    wrong_work: '$f_1=x$, $f_2=x$, $g_1=x^2$, $g_2=x^2$이면 성립한다'
    detect_cue: 특정 함수의 예를 들어 확인했을 뿐 일반 논증이 없다
    feedback: 임의의 홀함수·짝함수에 대해 보여야 합니다. 차를 만들어 (2)의 결과를 쓰세요.
    remedy: [RL-1]

- id: '4'
  stem: |
    함수 $e^x$가 홀함수 $a(x)$와 짝함수 $b(x)$에 대하여 $e^x=a(x)+b(x)$일 때, $b(2021)-a(2021)$의 값을 구하시오.
  points: 9
  depends_on: ['1', '3']
  answer: {kind: value, value: 'exp(-2021)', equivalents: ['1/exp(2021)'], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $a=\frac{e^x-e^{-x}}{2}$, $b=\frac{e^x+e^{-x}}{2}$이고 (3)에 의해 유일하므로 $b-a=e^{-x}$.
    steps:
    - {id: 4a, content: '$b(2021)-a(2021)=e^{-2021}$', criteria: [4.M1, 4.A1, 4.R1, 4.A2]}
    hint_ladder:
    - $x$에 $-x$를 넣은 식 $e^{-x}=-a(x)+b(x)$와 연립해 보자.
  - id: S4-B
    audience: B
    source_flow: 안내_2021 자연 문제2 우수답안 및 해설 p.43
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        만약 함수 $e^x$가 홀함수 $a(x)$와 짝함수 $b(x)$에 대하여 $e^x=a(x)+b(x)$로 표현되면, (3)에 의해 한 쌍 뿐임을 알 수 있다.
      criteria: [4.R1]
    - id: 4b-2
      content: |
        문제 (1)을 활용하여 함수 $e^x$를 나타내면 $e^x=\left(\dfrac{e^x-e^{-x}}{2}\right)+\left(\dfrac{e^x+e^{-x}}{2}\right)$이고
      criteria: [4.M1]
    - id: 4b-3
      content: |
        함수 $a(x)=\dfrac{e^x-e^{-x}}{2}$와 $b(x)=\dfrac{e^x+e^{-x}}{2}$가 $a(-x)=\dfrac{e^{-x}-e^{x}}{2}=-a(x)$, $b(-x)=\dfrac{e^{-x}+e^{x}}{2}=b(x)$를 만족하므로 문제에서 구하는 홀함수는 $a(x)=\dfrac{e^x-e^{-x}}{2}$이고 짝함수는 $b(x)=\dfrac{e^x+e^{-x}}{2}$이다.
      criteria: [4.A1]
    - id: 4b-4
      content: |
        따라서 $b(2021)-a(2021)=e^{-2021}$이다.
      criteria: [4.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: |
        $e^x=\frac{e^x-e^{-x}}{2}+\frac{e^x+e^{-x}}{2}$로 분해했다(또는 $e^{-x}=-a(x)+b(x)$와 연립).
      depends_on: []
      implied_ok: false
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 3
      evidence: |
        $a(x)=\frac{e^x-e^{-x}}{2}$가 홀함수, $b(x)=\frac{e^x+e^{-x}}{2}$가 짝함수임을 확인했다.
      depends_on: [4.M1]
      steps: [4b-3]
    - id: 4.R1
      mark_type: R
      points: 2
      evidence: |
        (3)에 의해 그러한 분해가 한 쌍뿐임을 밝혔다.
      depends_on: []
      ft: {allowed: true, from: [3.R1], max_points: 2}
      steps: [4b-1]
    - id: 4.A2
      mark_type: A
      points: 1
      evidence: |
        $b(2021)-a(2021)=e^{-2021}$을 구했다.
      depends_on: [4.M1, 4.A1]
      steps: [4b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '74', misconception: MC-ALG-9116}
  misconceptions:
  - id: MC-ALG-9116
    outcome_code: '74'
    wrong_work: '$a(x)=\frac{e^x+e^{-x}}{2}$, $b(x)=\frac{e^x-e^{-x}}{2}$로 두어 $b(2021)-a(2021)=-e^{-2021}$'
    detect_cue: 홀·짝 부분을 바꿔 썼고 각각의 대칭성 확인이 없다
    feedback: $\frac{e^x+e^{-x}}{2}$는 (1)처럼 짝함수입니다. 각 부분의 대칭성을 직접 확인하세요.
    remedy: [RL-1]

