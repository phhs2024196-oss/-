stimuli: []

stem: |
  좌표평면에 포물선 $y=x^2+9$와 포물선 $y=x^2$이 주어져 있다. 포물선 $y=x^2$ 위의 점 $\mathrm{A}(0,0)$과 $\mathrm{B}(3,9)$에 대하여, 다음 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    포물선 $y=x^2+9$ 위의 점 $\mathrm{C}$에서의 접선이 선분 $\mathrm{AC}$와 수직일 때, 점 $\mathrm{C}$의 좌표를 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '(0, 9)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $c\ne0$이면 $2c\cdot\frac{c^2+9}{c}=2(c^2+9)>0$이라 $-1$이 될 수 없다.
    steps:
    - {id: 1a, content: '$c=0$만 가능, $\mathrm{C}(0,9)$.', criteria: [1.M1, 1.R1, 1.A1]}
    hint_ladder:
    - 기울기 곱의 부호를 보자.
    - 기울기를 쓸 수 없는 경우는 없는가?
  - id: S1-B
    audience: B
    source_flow: 안내_2021 자연 문제3 우수답안 및 해설 p.44
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        포물선 $y=x^2+9$의 점 $\mathrm{C}(c,c^2+9)$에서의 접선의 기울기는 $f'(c)=2c$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (i) $2c=0$이면, 점 $\mathrm{C}(0,9)$에서의 접선은 $x$축과 평행하고 선분 $\mathrm{AC}$는 $y$축과 평행하므로 서로 수직이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        (ii) $2c\ne0$이면, 선분 $\mathrm{AC}$는 기울기가 $\dfrac{(c^2+9)-0}{c-0}=\dfrac{c^2+9}{c}$이므로, 기울기 $2c$인 접선과 수직이려면 $2c\cdot\dfrac{c^2+9}{c}=-1$이어야 한다. 하지만 $2(c^2+9)\ge2\cdot9>0$이므로 성립하지 않는다. 따라서 구하는 점은 $\mathrm{C}(0,9)$로 유일하다.
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $\mathrm{C}(c,c^2+9)$에서 접선의 기울기 $2c$를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $c=0$일 때 접선(수평)과 $\mathrm{AC}$(수직선)가 수직임을 확인해 $\mathrm{C}(0,9)$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $c\ne0$이면 기울기 곱 $2(c^2+9)>0$이라 $-1$이 될 수 없음을 보여 유일성을 밝혔다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9117}
  misconceptions:
  - id: MC-GEO-9117
    outcome_code: '71'
    wrong_work: '$2c\cdot\frac{c^2+9}{c}=-1$은 해가 없으므로 점 $\mathrm{C}$는 존재하지 않는다'
    detect_cue: 기울기 곱 식만 세우고 $c=0$(기울기 0·정의 안 됨) 경우를 검토하지 않았다
    feedback: 기울기 곱 $-1$은 두 직선이 모두 기울기를 가질 때의 조건입니다. 수평선과 수직선의 경우를 따로 확인하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    포물선 $y=x^2+9$ 위의 점 $\mathrm{D}$에서의 접선이 선분 $\mathrm{BD}$와 수직일 때, 점 $\mathrm{D}$의 좌표를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '(1, 10)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $d\ne0,3$에서 $2d\cdot\frac{d^2}{d-3}=-1\iff(d-1)(2d^2+2d+3)=0$.
    steps:
    - {id: 2a, content: '$d=1$, $\mathrm{D}(1,10)$.', criteria: [2.M1, 2.R1, 2.M2, 2.A1, 2.A2]}
    hint_ladder:
    - $d=0$, $d=3$인 경우를 먼저 확인하자.
    - 삼차방정식의 정수근을 찾아보자.
  - id: S2-B
    audience: B
    source_flow: 안내_2021 자연 문제3 우수답안 및 해설 p.45
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        포물선 $y=x^2+9$의 점 $\mathrm{D}(d,d^2+9)$에서의 접선의 기울기는 $f'(d)=2d$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        (i) $2d=0$이면, 점 $\mathrm{D}(0,9)$에서의 접선은 $x$축과 평행하다. 하지만 두 점 $\mathrm{B}(3,9)$와 $\mathrm{D}(0,9)$를 이은 선분 $\mathrm{BD}$는 $y$축과 평행하지 않으므로 $\mathrm{D}(0,9)$에서의 접선과 수직이 아니다.
        (ii) $d=3$이면, 점 $\mathrm{D}(3,18)$에서의 접선의 기울기는 $f'(3)=6$이다. 그런데 두 점 $\mathrm{B}(3,9)$와 $\mathrm{D}(3,18)$을 이은 선분 $\mathrm{BD}$는 $y$축과 평행하므로 점 $\mathrm{D}(3,18)$에서의 접선은 선분 $\mathrm{BD}$와 수직이 아니다.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        (iii) $2d\ne0$, $d\ne3$이면, 선분 $\mathrm{BD}$는 기울기가 $\dfrac{(d^2+9)-9}{d-3}=\dfrac{d^2}{d-3}$이므로, 점 $\mathrm{D}$에서의 접선과 수직이려면 $2d\cdot\dfrac{d^2}{d-3}=-1$이어야 한다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        정리하면 $0=2d^3+d-3=(d-1)(2d^2+2d+3)$이고, 이차방정식 $2d^2+2d+3=0$은 판별식이 $2^2-4\cdot2\cdot3=-20<0$이어서 실수해가 없으므로, $2d^3+d-3=0$의 실수해는 $d=1$ 뿐이다.
      criteria: [2.A1]
    - id: 2b-5
      content: |
        따라서 구하는 점은 $\mathrm{D}(1,10)$으로 유일하다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 1
      evidence: |
        $\mathrm{D}(d,d^2+9)$에서 접선의 기울기 $2d$를 적었다.
      depends_on: []
      implied_ok: true
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        $d=0$, $d=3$인 경우 수직이 아님을 확인했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $\mathrm{BD}$의 기울기 $\frac{d^2}{d-3}$을 구해 $2d\cdot\frac{d^2}{d-3}=-1$을 세웠다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $2d^3+d-3=(d-1)(2d^2+2d+3)=0$으로 인수분해하고 판별식 $-20<0$으로 실근이 $d=1$뿐임을 보였다.
      depends_on: [2.M2]
      steps: [2b-4]
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: |
        $\mathrm{D}(1,10)$을 답했다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-GEO-9118}
  misconceptions:
  - id: MC-GEO-9118
    outcome_code: '72'
    wrong_work: '$2d^3+d-3=0$에서 $d=1$을 찾고 바로 $\mathrm{D}(1,10)$ (다른 근 검토 없음)'
    detect_cue: 이차인수 $2d^2+2d+3$의 실근 여부(판별식)를 확인하지 않았다
    feedback: 한 근을 찾은 뒤 나머지 인수의 실근 여부를 판별식으로 확인해야 점이 유일함이 보장됩니다.
    remedy: [RL-1]

- id: '3'
  stem: |
    포물선 $y=x^2+9$, 포물선 $y=x^2$과 선분 $\mathrm{AC},\mathrm{BD}$로 둘러싸인 도형의 넓이를 구하시오.
  points: 12
  depends_on: ['1', '2']
  answer: {kind: value, value: '58/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $x=1$에서 위 경계가 $y=x^2+9$에서 선분 $\mathrm{BD}$로 바뀐다.
    steps:
    - {id: 3a, content: '$\int_0^1 9\,dx+\int_1^3\left(-\frac x2+\frac{21}{2}-x^2\right)dx=9+\frac{31}{3}=\frac{58}{3}$', criteria: [3.M1, 3.M2, 3.A1, 3.A2]}
    hint_ladder:
    - 도형의 위쪽 경계를 $x$의 구간별로 적어 보자.
  - id: S3-B
    audience: B
    source_flow: 안내_2021 자연 문제3 우수답안 및 해설 p.45
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        선분 $\mathrm{AC}$는 $y$축의 일부이다. 직선 $x=1$의 왼쪽 부분은 $0\le x\le1$, $x^2\le y\le x^2+9$로 나타내어진다. 직선 $x=1$의 오른쪽 부분은 $1\le x\le3$이며 선분 $\mathrm{BD}$ 아래에 있고 포물선 $y=x^2$ 위에 있는 영역이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $\mathrm{B}(3,9)$와 $\mathrm{D}(1,10)$을 잇는 선분 $\mathrm{BD}$는 기울기가 $\frac{10-9}{1-3}=-\frac12$이므로, 해당 부분은 $1\le x\le3$, $x^2\le y\le-\frac x2+\frac{21}{2}$로 나타내어진다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        따라서 구하는 도형의 넓이는
        $$\int_0^1\{(x^2+9)-x^2\}dx+\int_1^3\left\{\left(-\frac x2+\frac{21}{2}\right)-x^2\right\}dx=[9x]_0^1+\left[-\frac{x^2}{4}+\frac{21x}{2}-\frac{x^3}{3}\right]_1^3$$
      criteria: [3.A1]
    - id: 3b-4
      content: |
        $$=9+\frac{31}{3}=\frac{58}{3}$$
        이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        영역을 $x=1$에서 나누어 $0\le x\le1$에서 $x^2\le y\le x^2+9$로 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 2.A2], max_points: 3}
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        선분 $\mathrm{BD}$의 방정식 $y=-\frac x2+\frac{21}{2}$을 구해 $1\le x\le3$ 부분을 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A2], max_points: 3}
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        두 정적분 식을 세워 $9$와 $\frac{31}{3}$을 계산했다.
      depends_on: [3.M1, 3.M2]
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: |
        넓이 $\frac{58}{3}$을 구했다.
      depends_on: [3.M1, 3.M2, 3.A1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-CAL-9119}
  misconceptions:
  - id: MC-CAL-9119
    outcome_code: '73'
    wrong_work: '$\int_0^3\{(x^2+9)-x^2\}dx=27$'
    detect_cue: 위 경계를 구간 전체에서 $y=x^2+9$로 잡았다(선분 $\mathrm{BD}$ 무시)
    feedback: 점 $\mathrm{D}$ 오른쪽에서는 선분 $\mathrm{BD}$가 위 경계입니다. 경계가 바뀌는 $x=1$에서 적분을 나누세요.
    remedy: [RL-2]

