intent: |
  좌표평면에서 포물선의 접선을 이해하고, 주어진 기하적 조건을 만족하는 점의 좌표를 삼차 방정식을 통하여 구하며, 함수의 그래프들로 둘러싸인 도형의 넓이를 정적분을 이용하여 구하는 문제이다. 인수분해 및 이차방정식의 판별식, 직선의 방정식, 넓이와 정적분의 관계를 종합적으로 활용하는 계산 능력을 평가한다(안내 출제의도).
key_idea: |
  접선 기울기 $2c$와 선분 기울기의 곱이 $-1$이라는 조건을, 기울기가 0이거나 정의되지 않는 경우를 먼저 분리한 뒤 세운다. (2)는 $2d^3+d-3=(d-1)(2d^2+2d+3)=0$.
stuck: |
  기울기 곱 $-1$ 식이 쓸 수 없는 경우($c=0$, $d=0$, $d=3$)를 따로 처리하는 경우 분류
