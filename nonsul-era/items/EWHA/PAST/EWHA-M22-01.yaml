stimuli:
- label: 수렴 조건
  body: |
    (ⅰ) $a_n\ge0$ (단, $n=1,2,3,\cdots$)
    (ⅱ) $a_n\ge a_{n+1}$ (단, $n=1,2,3,\cdots$)
- label: 수열 규칙
  body: |
    (ㄱ) $x_1=2022$
    (ㄴ) 곡선 $y=e^x$ 위의 점 $(x_n,e^{x_n})$에서의 접선이 직선 $y=1$과 만나는 점의 $x$좌표가 $x_{n+1}$이다. (단, $n=1,2,3,\cdots$)

stem: |
  [35점]

subparts:
- id: '1'
  stem: |
    실수 $a$에 대하여 부등식 $e^x-e^a\ge e^a(x-a)$가 성립함을 보이시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=e^x-e^a-e^a(x-a)$는 $x=a$에서 최솟값 0.
    steps:
    - {id: 1a, content: '$f''(x)=e^x-e^a$, $x<a$에서 음, $x>a$에서 양 ⇒ $f(x)\ge f(a)=0$', criteria: ['1.M1', '1.A1', '1.R1']}
    hint_ladder:
    - 차를 함수로 놓고 최솟값을 구하자.
  - id: S1-B
    audience: B
    source_flow: 2022 논술고사 안내 p.37 우수답안 및 해설 (1) 풀이
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=e^x-e^a-e^a(x-a)$의 도함수는 $f'(x)=e^x-e^a$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $x<a$일 때 $f'(x)<0$이고, $x>a$일 때 $f'(x)>0$이며, $f'(a)=0$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        함수 $f(x)$는 $x=a$에서 최솟값 $f(a)=0$을 갖는다. 따라서 $f(x)\ge0$, 즉 $e^x-e^a\ge e^a(x-a)$가 성립한다.
      criteria: ['1.R1']
  - id: S1-ALT
    audience: ALT
    source_flow: 2022 논술고사 안내 p.37 (1) 별해
    method_no: 2
    key_idea: 공식 별해 — 평균값 정리로 $e^x-e^a=e^c(x-a)$ ($c$는 $a$와 $x$ 사이)이고, $x-a$와 $e^c-e^a$의 부호가 같다.
    steps:
    - id: 1c-1
      content: |
        $x=a$이면 양변이 0이다. $x\neq a$이면 평균값 정리에 의해 $e^x-e^a=e^c(x-a)$인 $c$가 $a$와 $x$ 사이에 존재한다. $a<c<x$이면 $e^c>e^a$, $x-a>0$이고, $x<c<a$이면 $e^c<e^a$, $x-a<0$이므로 어느 경우든 $e^c(x-a)\ge e^a(x-a)$이다.
      criteria: ['1.M1', '1.A1', '1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f(x)=e^x-e^a-e^a(x-a)$를 놓고 $f'(x)=e^x-e^a$를 구했다(또는 평균값 정리를 적용했다).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $x<a$에서 $f'(x)<0$, $x>a$에서 $f'(x)>0$임을 밝혔다(별해: 두 경우 모두 $e^c(x-a)\ge e^a(x-a)$).
      depends_on: [1.M1]
      steps: [1b-2, 1c-1]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        $f$가 $x=a$에서 최솟값 $0$을 가지므로 $f(x)\ge0$이라는 결론을 적었다.
      depends_on: [1.A1]
      steps: [1b-3, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9161}
  misconceptions:
  - id: MC-CAL-9161
    outcome_code: '71'
    wrong_work: '$f''(x)=e^x-e^a$, $f''(a)=0$이므로 $f(x)\ge0$'
    detect_cue: 도함수의 부호 변화(최소 판정) 없이 결론
    feedback: $f'(a)=0$만으로는 최소인지 알 수 없습니다. $x=a$ 좌우에서 $f'$의 부호를 밝히세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    실수 $a$에 대하여 곡선 $y=e^x$ 위의 점 $(a,e^a)$에서의 접선이 직선 $y=1$과 만나는 점을 $(b,1)$이라 할 때, $e^b\ge1$임을 보이시오.
  points: 10
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $1-e^a=e^a(b-a)$이고 (1)에서 $e^a(b-a)\le e^b-e^a$.
    steps:
    - {id: 2a, content: '$1-e^a=e^a(b-a)\le e^b-e^a\Rightarrow e^b\ge1$', criteria: ['2.M1', '2.A1', '2.R1']}
    hint_ladder:
    - 접선의 식에 $(b,1)$을 대입하자.
    - (1)을 $x=b$에 적용하자.
  - id: S2-B
    audience: B
    source_flow: 2022 논술고사 안내 p.37 우수답안 및 해설 (2) 풀이
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $x=a$에서 $e^x$의 미분계수가 $e^a$이므로 점 $(a,e^a)$에서의 접선은 $y-e^a=e^a(x-a)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이 접선이 $y=1$과 만나는 점이 $(b,1)$이므로 $1-e^a=e^a(b-a)$가 성립한다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        문항 (1)의 결과로부터 $e^a(b-a)\le e^b-e^a$이므로 $1-e^a\le e^b-e^a$를 얻는다. 따라서 $e^b\ge1$이다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        접선의 방정식 $y-e^a=e^a(x-a)$를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        교점 조건 $1-e^a=e^a(b-a)$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: |
        (1)을 $x=b$에 적용해 $1-e^a\le e^b-e^a$, 즉 $e^b\ge1$을 이끌었다.
      depends_on: [2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-9162}
  misconceptions:
  - id: MC-CAL-9162
    outcome_code: '72'
    wrong_work: '$b=a-1+e^{-a}$을 구한 뒤 $a\ge0$인 경우만 $b\ge0$을 확인'
    detect_cue: (1)을 쓰지 않고 $a$의 부호로 경우를 나누다 일부만 다룬다
    feedback: (1)은 모든 실수 $x$에서 성립하므로 $x=b$를 대입하면 $a$에 관계없이 결론이 나옵니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    수열 $\{a_n\}$이 아래 조건 (ⅰ), (ⅱ)를 만족하면 수렴한다.
    [상자: 「수렴 조건」 (ⅰ)(ⅱ)]
    수열 $\{x_n\}$이 다음 규칙에 따라 정해질 때, 위의 조건 (ⅰ), (ⅱ)를 만족함을 보임으로써 수열 $\{x_n\}$이 수렴함을 보이시오.
    [상자: 「수열 규칙」 (ㄱ)(ㄴ)]
  points: 15
  depends_on: ['2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: (2)를 $a=x_n$, $b=x_{n+1}$에 적용하면 $x_{n+1}\ge0$, 그리고 $1-e^{x_n}=e^{x_n}(x_{n+1}-x_n)\le0$.
    steps:
    - {id: 3a, content: '$e^{x_{n+1}}\ge1\Rightarrow x_{n+1}\ge0$; $x_n\ge0\Rightarrow 1-e^{x_n}\le0\Rightarrow x_{n+1}\le x_n$', criteria: ['3.B1', '3.M1', '3.A1', '3.M2', '3.A2', '3.R1']}
    hint_ladder:
    - (2)의 $a$, $b$를 $x_n$, $x_{n+1}$로 바꿔 읽자.
  - id: S3-B
    audience: B
    source_flow: 2022 논술고사 안내 pp.37–38 우수답안 및 해설 (3) 풀이
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (i) 우선 $x_1=2022\ge0$이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        곡선 $y=e^x$ 위의 점 $(x_n,e^{x_n})$에서의 접선이 직선 $y=1$과 점 $(x_{n+1},1)$에서 만나므로 문항 (2)의 결과로부터 $e^{x_{n+1}}\ge1$이 성립한다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        즉 $x_{n+1}\ge0$이다. 따라서 모든 자연수 $n$에 대하여 $x_n\ge0$이 성립한다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        (ii) 자연수 $n$에 대하여 $x_n\ge0$이 성립하므로 $e^{x_n}\ge1$이 된다. 한편 $x_{n+1}$은 식 $1-e^{x_n}=e^{x_n}(x_{n+1}-x_n)$을 만족하므로
      criteria: ['3.M2']
    - id: 3b-5
      content: |
        $x_{n+1}\le x_n$이 성립한다.
      criteria: ['3.A2']
    - id: 3b-6
      content: |
        수열 $\{x_n\}$이 위의 조건 (i), (ii)를 만족하므로 수렴한다.
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 1
      evidence: |
        $x_1=2022\ge0$을 적었다.
      depends_on: []
      steps: [3b-1]
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        (2)를 $a=x_n$, $b=x_{n+1}$에 적용해 $e^{x_{n+1}}\ge1$을 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.R1], max_points: 4}
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $x_{n+1}\ge0$이므로 모든 $n$에 대해 $x_n\ge0$ (조건 (ⅰ))임을 적었다.
      depends_on: [3.M1]
      steps: [3b-3]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        $1-e^{x_n}=e^{x_n}(x_{n+1}-x_n)$을 세우고 $x_n\ge0$에서 $e^{x_n}\ge1$을 이용했다.
      depends_on: []
      implied_ok: false
      steps: [3b-4]
    - id: 3.A2
      mark_type: A
      points: 3
      evidence: |
        $x_{n+1}-x_n=\dfrac{1-e^{x_n}}{e^{x_n}}\le0$, 즉 $x_{n+1}\le x_n$ (조건 (ⅱ))을 얻었다.
      depends_on: [3.M2, 3.A1]
      steps: [3b-5]
    - id: 3.R1
      mark_type: R
      points: 2
      evidence: |
        (ⅰ), (ⅱ)를 모두 만족하므로 수렴한다고 결론지었다.
      depends_on: [3.A1, 3.A2]
      steps: [3b-6]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-CAL-9163}
  misconceptions:
  - id: MC-CAL-9163
    outcome_code: '73'
    wrong_work: '$x_{n+1}=x_n-1+e^{-x_n}\le x_n$이므로 감소하여 수렴한다'
    detect_cue: $x_n\ge0$(조건 (ⅰ))을 보이지 않거나, 감소 판단에 $x_n\ge0$을 쓰지 않는다
    feedback: $e^{-x_n}\le1$은 $x_n\ge0$일 때만 성립합니다. (ⅰ)을 먼저 보이고 (ⅱ)에 활용하세요.
    remedy: [RL-3]

