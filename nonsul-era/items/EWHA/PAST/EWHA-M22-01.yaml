  - '수열 $x_1=2022$, $x_{n+1}$ = 점 $(x_n,e^{x_n})$에서의 접선과 $y=1$의 교점의 $x$좌표'
  - '수렴 조건 (i) $a_n\ge0$, (ii) $a_n\ge a_{n+1}$'
  concepts:
