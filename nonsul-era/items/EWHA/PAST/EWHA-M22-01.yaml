  - '(별해) 평균값 정리 $e^x-e^a=e^c(x-a)$'
  - '$1-e^a=e^a(b-a)$'
  conditions:
  - '(3)은 수렴을 직접 증명하지 않고 (i)(ii)만 보이면 됨(문제에서 수렴 정리를 제공)'
  stimuli_used: [수렴 조건, 수열 규칙]
  subpart_links: '(2)는 (1)을, (3)은 (2)와 접선의 식을 사용'

