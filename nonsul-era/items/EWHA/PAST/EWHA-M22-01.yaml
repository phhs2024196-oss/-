intent: |
  지수함수와 접선의 성질을 이해하고 함수의 미분을 활용하여 주어진 조건에 대한 함수의 상태를 추론하며, 앞서 확인된 결과들을 활용하여 주어진 수열이 제시된 수렴 조건을 만족함을 유도하는 능력을 평가한다(안내 책자 출제의도 요지).
key_idea: |
  $e^x\ge e^a(x-a)+e^a$(접선 아래로 볼록)를 $x=b$에 적용하면 $1-e^a=e^a(b-a)\le e^b-e^a$에서 $e^b\ge1$. 따라서 $x_{n+1}\ge0$이고, $1-e^{x_n}=e^{x_n}(x_{n+1}-x_n)$에서 $x_{n+1}\le x_n$.
stuck: |
  (1)의 부등식을 접선과 $y=1$의 교점 $x=b$에 대입하는 연결, 그리고 (2)를 $a=x_n$, $b=x_{n+1}$로 읽는 것
idea_tags: [IDEA-TANGENT-BELOW-CONVEX, IDEA-NEWTON-ITERATION-MONOTONE]
tags: [지수함수, 접선, 수열의 수렴]
