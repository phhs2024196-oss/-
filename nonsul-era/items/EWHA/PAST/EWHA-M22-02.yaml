intent: |
  다항함수의 정적분을 이해하고 정적분의 기본 성질과 여러 가지 적분법(부분적분법, 치환적분법)을 활용하여 주어진 정적분들 사이의 관계를 수리적으로 추론하는 능력을 평가한다(안내 책자 출제의도 요지).
key_idea: |
  피적분함수를 합쳐 $(1-x)+x=1$을 만들고, 부분적분으로 $x$의 지수를 올리며, $t=1-x$ 치환으로 지수를 맞바꿔 네 적분 사이의 선형 관계를 얻은 뒤 연립한다.
stuck: |
  $A-B-C$의 피적분함수에서 $1-x(1-x)-x=(1-x)^2$이 나오는 것과, $x^{2021}(1-x)^{2023}$을 치환으로 $D$로 바꾸는 것
idea_tags: [IDEA-BETA-INTEGRAL-RECURSION, IDEA-SYMMETRIC-SUBST-1-MINUS-X]
tags: [정적분, 부분적분, 치환적분]
