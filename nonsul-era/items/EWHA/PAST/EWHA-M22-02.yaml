stimuli: []

stem: |
  실수 $A,B,C,D$가 다음과 같이 주어질 때, 아래 물음에 답하시오. [30점]
  $$A=\int_0^1x^{2021}(1-x)^{2021}dx,\quad B=\int_0^1x^{2022}(1-x)^{2022}dx,$$
  $$C=\int_0^1x^{2022}(1-x)^{2021}dx,\quad D=\int_0^1x^{2023}(1-x)^{2021}dx$$

subparts:
- id: '1'
  stem: |
    $B+D=C$임을 보이시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: 'B + D = C', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 피적분함수를 더하면 $x^{2022}(1-x)^{2021}\{(1-x)+x\}$.
    steps:
    - {id: 1a, content: '$B+D=\int_0^1x^{2022}(1-x)^{2021}\{(1-x)+x\}dx=C$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 두 피적분함수의 공통인수를 묶어 보자.
  - id: S1-B
    audience: B
    source_flow: 2022 논술고사 안내 p.40 우수답안 및 해설 (1) 풀이
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        정적분의 성질에 따라 $B+D=\displaystyle\int_0^1\left(x^{2022}(1-x)^{2022}+x^{2023}(1-x)^{2021}\right)dx$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $=\displaystyle\int_0^1x^{2022}(1-x)^{2021}\left((1-x)+x\right)dx=\int_0^1x^{2022}(1-x)^{2021}dx=C$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        정적분의 성질로 $B+D$를 하나의 정적분으로 합쳤다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: |
        공통인수 $x^{2022}(1-x)^{2021}$로 묶어 $(1-x)+x=1$을 얻고 $C$임을 보였다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9164}
  misconceptions:
  - id: MC-CAL-9164
    outcome_code: '71'
    wrong_work: '$x^{2022}(1-x)^{2022}+x^{2023}(1-x)^{2021}=x^{2022}(1-x)^{2022}\{1+x\}$로 묶음'
    detect_cue: 묶은 뒤 남는 인수가 $(1-x)+x$가 아니다
    feedback: 두 항의 공통인수는 $x^{2022}(1-x)^{2021}$입니다(지수가 작은 쪽).
    remedy: [RL-1]

- id: '2'
  stem: |
    $B=\dfrac{2022}{2023}D$임을 보이시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: 'B = 2022/2023*D', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x^{2022}$을 적분, $(1-x)^{2022}$를 미분하는 부분적분(경계항 0).
    steps:
    - {id: 2a, content: '$B=0+\tfrac{2022}{2023}\int_0^1x^{2023}(1-x)^{2021}dx$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $x$의 지수를 올리고 $(1-x)$의 지수를 내리는 적분법은?
  - id: S2-B
    audience: B
    source_flow: 2022 논술고사 안내 p.40 우수답안 및 해설 (2) 풀이
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        정적분 $B$에 $x^{2022}$을 적분하고 $(1-x)^{2022}$을 미분하여 부분적분법을 적용한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $$B=\left[\dfrac{x^{2023}}{2023}(1-x)^{2022}\right]_0^1-\int_0^1\dfrac{x^{2023}}{2023}\cdot2022(1-x)^{2021}(-1)dx$$
        경계항은 0이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $$=\dfrac{2022}{2023}\int_0^1x^{2023}(1-x)^{2021}dx=\dfrac{2022}{2023}D$$
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $x^{2022}$을 적분, $(1-x)^{2022}$을 미분하는 부분적분을 시도했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        부분적분 식(경계항과 $(1-x)^{2022}$의 도함수 $-2022(1-x)^{2021}$)을 바르게 적고 경계항이 0임을 밝혔다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $B=\dfrac{2022}{2023}D$를 얻었다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-9165}
  misconceptions:
  - id: MC-CAL-9165
    outcome_code: '72'
    wrong_work: '$(1-x)^{2022}$의 도함수를 $2022(1-x)^{2021}$로 써서 $B=-\dfrac{2022}{2023}D$'
    detect_cue: 결과에 음의 부호가 있다(양수끼리의 관계인데 음수)
    feedback: 합성함수 미분으로 $\{(1-x)^{2022}\}'=-2022(1-x)^{2021}$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $A-B-C=D$임을 보이고, $B=\dfrac{1011}{4045}A$임을 보이시오.
  points: 10
  depends_on: ['1', '2']
  answer: {kind: proof, value: 'A - B - C = D; B = 1011/4045*A', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $1-x(1-x)-x=(1-x)^2$로 $A-B-C=\int_0^1x^{2021}(1-x)^{2023}dx$, $t=1-x$로 $D$. 이후 (1)(2)와 연립.
    steps:
    - {id: 3a, content: '$A=B+C+D=B+\tfrac{4045}{2022}B+\tfrac{2023}{2022}B=\tfrac{2\cdot4045}{2022}B$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2']}
    hint_ladder:
    - $A-B-C$의 피적분함수를 $x^{2021}(1-x)^{2021}$로 묶자.
    - $x\leftrightarrow1-x$로 바꾸면 지수가 서로 바뀐다.
  - id: S3-B
    audience: B
    source_flow: 2022 논술고사 안내 p.40 우수답안 및 해설 (3) 풀이
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        정적분의 성질에 따라
        $$A-B-C=\int_0^1x^{2021}(1-x)^{2021}\left(1-x(1-x)-x\right)dx=\int_0^1x^{2021}(1-x)^{2021}(1-x)^2dx=\int_0^1x^{2021}(1-x)^{2023}dx$$
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $t=1-x$로 놓으면 $\dfrac{dt}{dx}=-1$이고, $x=0$일 때 $t=1$, $x=1$일 때 $t=0$이므로
        $$\int_0^1x^{2021}(1-x)^{2023}dx=\int_1^0(1-t)^{2021}t^{2023}(-dt)=\int_0^1t^{2023}(1-t)^{2021}dt=D$$
        따라서 $A-B-C=D$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        문항 (2)에서 $D=\dfrac{2023}{2022}B$를 얻고, 문항 (1)의 $B+D=C$에 대입하면 $C=B+\dfrac{2023}{2022}B=\dfrac{4045}{2022}B$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $A-B-C=D$로부터 $A=B+C+D=B+\dfrac{4045}{2022}B+\dfrac{2023}{2022}B=\dfrac{2\cdot4045}{2022}B$이며, 정리하면 $B=\dfrac{1011}{4045}A$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $A-B-C=\int_0^1x^{2021}(1-x)^{2023}dx$ (피적분함수 정리 $1-x(1-x)-x=(1-x)^2$)를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $t=1-x$ 치환(구간·부호 처리 포함)으로 그 적분이 $D$임을 보였다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 2
      evidence: |
        (1), (2)의 관계를 이용해 $C$, $D$를 $B$로 나타냈다($C=\dfrac{4045}{2022}B$, $D=\dfrac{2023}{2022}B$).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 2.A2], max_points: 2}
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: |
        $A=\dfrac{2\cdot4045}{2022}B$에서 $B=\dfrac{1011}{4045}A$를 얻었다.
      depends_on: [3.M2, 3.A1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-CAL-9166}
  misconceptions:
  - id: MC-CAL-9166
    outcome_code: '73'
    wrong_work: '$\int_0^1x^{2021}(1-x)^{2023}dx=\int_1^0(1-t)^{2021}t^{2023}dt=-D$'
    detect_cue: 치환 후 $dx=-dt$를 빠뜨리거나 구간을 뒤집으면서 부호를 두 번 바꾼다
    feedback: $dx=-dt$와 구간 $1\to0$을 함께 처리하면 부호가 상쇄되어 $+D$입니다.
    remedy: [RL-3]

