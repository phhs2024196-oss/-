intent: |
  집합과 원의 방정식으로 제시된 조건을 이해하고, 직선과 원의 관계에 관한 개념으로 수리적 조건을 유도한 뒤 두 점 사이의 거리, 점과 직선 사이의 거리를 활용하여 함숫값을 구하는 능력을 평가한다(안내 책자 출제의도 요지).
key_idea: |
  반지름의 최솟값 $m$은 점 $(a,0)$과 선분 사이의 최단 거리이다. 수선의 발 $\left(\tfrac a2-1,\tfrac a2+1\right)$이 선분 위에 있는 $0\le a\le4$에서는 점과 직선 사이 거리, 그 밖에서는 가까운 끝점까지의 거리.
stuck: |
  「한 점에서 만나는 반지름의 최솟값」을 원이 선분에 접하거나 끝점 하나만 지나는 경우로 해석하고, 수선의 발이 선분 위에 있는 $a$의 범위로 경우를 나누는 것
