stimuli: []

stem: |
  양의 실수 $a$에 대하여 함수 $f(a)$는 $y=x^2$ 위의 점 $(a,a^2)$에서 접선과 직선 $y=2$의 교점의 $x$좌표로 주어진다. 모든 항이 양수인 두 수열 $\{a_n\}$, $\{b_n\}$이 모든 자연수 $n$에 대하여
  $$a_{n+1}=f(a_n),\quad b_n=\frac12\left(a_n+\frac{2}{a_n}\right)$$
  을 만족시킬 때, 아래 물음에 답하시오. [35점]

subparts:
- id: '1'
  stem: |
    $a_1$이 양의 실수 일 때, $a_2\ge\sqrt2$이 성립함을 보이시오.
  points: 8
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선 $y-a^2=2a(x-a)$에 $y=2$를 넣어 $f(a)=\tfrac a2+\tfrac1a$를 얻고 산술·기하 평균 부등식을 쓴다.
    steps:
    - {id: 1a, content: '$f(a)=\tfrac a2+\tfrac1a\ge2\sqrt{\tfrac a2\cdot\tfrac1a}=\sqrt2$', criteria: ['1.M1', '1.A1', '1.R1']}
    hint_ladder:
    - 접선의 방정식에 $y=2$를 대입해 $f(a)$를 구하자.
    - 두 양수 $\tfrac a2$, $\tfrac1a$의 곱은 일정하다.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 논술고사 안내」 우수답안 및 해설 p.38
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $(a,a^2)$에서 $y=x^2$의 접선의 방정식은 $y-a^2=2a(x-a)$이다. 접선과 직선 $y=2$의 교점은 $2-a^2=2a(x-a)$를 만족한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이때 $x$좌표가 $f(a)$이므로 $f(a)=a+\dfrac{2-a^2}{2a}=\dfrac a2+\dfrac1a$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $a_1>0$에 대하여 $a_2=f(a_1)=\dfrac{a_1}{2}+\dfrac{1}{a_1}$이고, 산술·기하평균 부등식에 의하여 $a_2=\dfrac{a_1}{2}+\dfrac{1}{a_1}\ge2\sqrt{\dfrac{a_1}{2}\cdot\dfrac{1}{a_1}}=\sqrt2$가 성립한다.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        접선의 방정식 $y-a^2=2a(x-a)$를 쓰고 $y=2$와의 교점 조건을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $f(a)=\dfrac a2+\dfrac1a$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $a_1>0$이므로 산술·기하평균 부등식으로 $a_2\ge\sqrt2$를 이끌었다(양수 조건 명시).
      depends_on: [1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9211}
  misconceptions:
  - id: MC-CAL-9211
    outcome_code: '71'
    wrong_work: '$2-a^2=2a(x-a)$에서 $x=a-\tfrac{2-a^2}{2a}=\tfrac{3a}{2}-\tfrac1a$로 이항 부호 오류'
    detect_cue: $f(a)$에 $\tfrac{3a}{2}$ 또는 $-\tfrac1a$가 나온다
    feedback: 양변을 $2a$로 나눈 뒤 $a$를 더하면 $x=a+\tfrac{2-a^2}{2a}$입니다. $a=\sqrt2$를 넣으면 $f(\sqrt2)=\sqrt2$가 되는지 확인해 보세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $a_1\ge\sqrt2$일 때, 모든 자연수 $n$에 대하여 $a_n\ge\sqrt2$이 성립함을 수학적 귀납법을 이용하여 보이시오.
  points: 9
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (1)에서 양수 $a$에 대해 $f(a)\ge\sqrt2$이므로 귀납 단계는 $a_k>0$만 있으면 된다.
    steps:
    - {id: 2a, content: '$n=1$ 성립, $a_k\ge\sqrt2\Rightarrow a_{k+1}=\tfrac{a_k}{2}+\tfrac{1}{a_k}\ge\sqrt2$', criteria: ['2.B1', '2.M1', '2.R1']}
    hint_ladder:
    - $n=1$일 때와 $n=k\Rightarrow n=k+1$을 나누어 쓰자.
  - id: S2-B
    audience: B
    source_flow: 「2023학년도 논술고사 안내」 우수답안 및 해설 p.38
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $n=1$일 때 $a_1\ge\sqrt2$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        $n=k$일 때 $a_k\ge\sqrt2$를 가정하자. $a_{k+1}=f(a_k)=\dfrac{a_k}{2}+\dfrac{1}{a_k}$이 성립한다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $a_k$가 양수이므로 산술·기하평균 부등식에 의해 $a_{k+1}=\dfrac{a_k}{2}+\dfrac{1}{a_k}\ge2\sqrt{\dfrac{a_k}{2}\cdot\dfrac{1}{a_k}}=\sqrt2$가 성립한다. 따라서 수학적 귀납법에 의해 모든 자연수 $n$에 대하여 $a_n\ge\sqrt2$가 성립한다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        $n=1$일 때 성립함을 밝혔다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $n=k$일 때 $a_k\ge\sqrt2$를 가정하고 $a_{k+1}=\dfrac{a_k}{2}+\dfrac{1}{a_k}$로 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: |
        $a_k>0$을 근거로 $a_{k+1}\ge\sqrt2$를 보이고 수학적 귀납법으로 결론을 맺었다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-PRF-9212}
  misconceptions:
  - id: MC-PRF-9212
    outcome_code: '72'
    wrong_work: '$a_{k+1}\ge\sqrt2$라 가정하고 정리해 참인 식을 얻은 뒤 끝냄, 또는 $n=1$ 확인 누락'
    detect_cue: 귀납 단계에 결론 $a_{k+1}\ge\sqrt2$가 전제로 쓰였거나 첫 단계가 없다
    feedback: 귀납법은 $n=1$에서 성립 → $n=k$ 가정에서 $n=k+1$을 이끄는 두 단계입니다. 결론을 가정하지 마세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    $a_1\ge\sqrt2$일 때, 모든 자연수 $n$에 대하여 $a_{n+1}\le a_n$이 성립함을 보이시오.
  points: 8
  depends_on: ['2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a_{n+1}-a_n=\dfrac{2-a_n^2}{2a_n}$이고 (2)에서 $a_n\ge\sqrt2$이므로 분자가 $0$ 이하이다.
    steps:
    - {id: 3a, content: '$a_{n+1}-a_n=\tfrac{(\sqrt2+a_n)(\sqrt2-a_n)}{2a_n}\le0$', criteria: ['3.M1', '3.R1']}
    hint_ladder:
    - $a_{n+1}-a_n$을 계산해 부호를 보자.
  - id: S3-B
    audience: B
    source_flow: 「2023학년도 논술고사 안내」 우수답안 및 해설 p.38
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $a_1\ge\sqrt2$이므로 문항 (2)의 결과로부터 모든 자연수 $n$에 대하여 $a_n\ge\sqrt2$가 성립한다.
      criteria: ['3.R1']
    - id: 3b-2
      content: |
        $a_{n+1}=f(a_n)=a_n+\dfrac{2-a_n^2}{2a_n}$이므로 $a_{n+1}-a_n=\dfrac{2-a_n^2}{2a_n}=\dfrac{(\sqrt2+a_n)(\sqrt2-a_n)}{2a_n}\le0$이 성립한다.
      criteria: ['3.M1', '3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        (2)의 결과를 인용하여 모든 $n$에 대해 $a_n\ge\sqrt2$임을 밝혔다.
      depends_on: []
      steps: [3b-1]
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $a_{n+1}-a_n=\dfrac{2-a_n^2}{2a_n}$을 계산했다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        인수분해 등으로 $a_{n+1}-a_n\le0$의 부호를 근거와 함께 결론지었다.
      depends_on: [3.M1, 3.R1]
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-ALG-9213}
  misconceptions:
  - id: MC-ALG-9213
    outcome_code: '73'
    wrong_work: '$a_1\ge\sqrt2$이므로 $a_2\le a_1$만 보이고 모든 $n$으로 일반화'
    detect_cue: $a_n\ge\sqrt2$ (모든 $n$)를 (2)에서 인용하지 않았다
    feedback: 부호 판정에는 모든 $n$에 대해 $a_n\ge\sqrt2$가 필요합니다. (2)의 결과를 인용하세요.
    remedy: [RL-3]

- id: '4'
  stem: |
    모든 자연수 $n$에 대하여 $b_{n+1}\le b_n$이 성립함을 보이시오.
  points: 10
  depends_on: ['1', '2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $b_n=f(a_n)=a_{n+1}$이고, (1)에서 $a_2\ge\sqrt2$이므로 (2)의 귀납법을 둘째 항부터 적용해 $a_{n+1}\ge\sqrt2$, 따라서 $b_{n+1}-b_n=a_{n+2}-a_{n+1}\le0$.
    steps:
    - {id: 4a, content: '$b_n=a_{n+1}$, $a_{n+1}\ge\sqrt2$ → $b_{n+1}-b_n=\tfrac{2-a_{n+1}^2}{2a_{n+1}}\le0$', criteria: ['4.M1', '4.R1', '4.A1']}
    hint_ladder:
    - $b_n$을 $f$로 나타내 보자.
    - $a_1\ge\sqrt2$ 조건이 없을 때 어느 항부터 $\sqrt2$ 이상인가?
  - id: S4-B
    audience: B
    source_flow: 「2023학년도 논술고사 안내」 우수답안 및 해설 p.39
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        모든 자연수 $n$에 대하여 $b_n=\dfrac12\left(a_n+\dfrac{2}{a_n}\right)=\dfrac{a_n}{2}+\dfrac{1}{a_n}=f(a_n)=a_{n+1}$이 성립한다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        $a_1$이 양수이므로 (1)의 결과로부터 $a_2\ge\sqrt2$이다. (2)의 증명과정의 수학적 귀납법을 이용하면 모든 자연수 $n$에 대하여 $a_{n+1}\ge\sqrt2$임을 알 수 있다.
      criteria: ['4.R1']
    - id: 4b-3
      content: |
        따라서 $b_{n+1}-b_n=a_{n+2}-a_{n+1}=\dfrac{2-a_{n+1}^2}{2a_{n+1}}=\dfrac{(\sqrt2+a_{n+1})(\sqrt2-a_{n+1})}{2a_{n+1}}\le0$이 성립한다.
      criteria: ['4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: |
        $b_n=f(a_n)=a_{n+1}$임을 보였다.
      depends_on: []
      implied_ok: false
