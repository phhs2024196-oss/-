intent: |
  수열의 귀납적 정의와 제시된 함수들의 상태를 이해하고 주어진 조건으로부터 수열의 성질을 유추하는 수리적 추론 능력을 본다. 이차함수 그래프의 접선과 직선의 교점을 구하는 능력, 수학적 귀납법과 절대부등식(산술·기하 평균)을 활용해 수열의 성질을 추론하는 능력을 평가한다(공식 출제의도 요지).
key_idea: |
  접선과 $y=2$의 교점에서 $f(a)=\dfrac a2+\dfrac1a$(뉴턴 방법으로 $\sqrt2$를 근사하는 점화식)이고, 산술·기하 평균 부등식으로 $f(a)\ge\sqrt2$, $a_{n+1}-a_n=\dfrac{2-a_n^2}{2a_n}\le0$. 또 $b_n=f(a_n)=a_{n+1}$이므로 (4)는 $\{a_n\}$의 둘째 항부터의 감소성이다.
stuck: |
  (4)에서 $b_n=a_{n+1}$임을 알아차리고, $a_1$의 조건이 없어도 (1)에 의해 $a_2\ge\sqrt2$이므로 둘째 항부터 (2)·(3)의 논리를 다시 적용할 수 있음을 보는 것
idea_tags: [IDEA-NEWTON-SQRT2-RECUR, IDEA-AMGM-LOWER-BOUND, IDEA-SHIFTED-SEQUENCE-REUSE]
tags: [접선, 점화식, 수학적 귀납법, 산술기하평균]
