intent: |
  삼차함수의 성질을 이해하고 문제 풀이에 필요한 성질을 유추하기 위해 제시된 함수의 변화와 상태를 이해하고 수학적으로 추론하여 적용하는 문제이다. 함수의 미분과 적분의 관계, 극값·극한값·정적분 등의 계산능력과 이차방정식의 근과 계수의 관계, 삼차함수의 성질을 이해하고 활용할 수 있는지를 평가한다(공식 출제의도 요지).
key_idea: |
  $a,b$는 $f'(x)=3t(x-a)(x-b)$의 두 근이므로 $f(a)-f(b)=-\int_a^bf'(x)dx=\tfrac12t(b-a)^3$이고, 근과 계수의 관계로 $(b-a)^2=\tfrac{4-4t}{t^2}$이다. 직각삼각형 ABC($\angle C=90^\circ$)에서 $\overline{BC}=b-a$, $\overline{AC}=f(a)-f(b)$를 이 두 식으로 나타낸다.
stuck: |
  (2)에서 $g(t_0)=\tfrac{2}{\sqrt5}$를 $\overline{BC}=2\overline{AC}$로 바꾸는 것, (3)에서 삼차함수의 변곡점 대칭으로 넓이가 삼각형 ABC의 넓이와 같음을 보는 것
