stimuli: []

stem: |
  삼차함수 $f(x)=tx^3+3x^2+3x+2023$가 $x=a,b\,(a<b)$에서 극값을 가지도록 하는 양의 실수 $t$를 생각할 때 점 $\mathrm{A}(a,f(a))$, $\mathrm{B}(b,f(b))$, $\mathrm{C}(a,f(b))$에 관한 함수 $g(t)=\dfrac{\overline{\mathrm{BC}}}{\overline{\mathrm{AB}}}$에 대하여, 다음 물음에 답하시오. [35점]

subparts:
- id: '1'
  stem: |
    식 $\dfrac{\displaystyle\int_a^bf'(x)dx}{t(b-a)^3}$의 값을 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '-1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=3t(x-a)(x-b)$를 적분하면 $-\tfrac12t(b-a)^3$.
    steps:
    - {id: 1a, content: '$\int_a^b3t(x-a)(x-b)dx=-\tfrac12t(b-a)^3$ → $-\tfrac12$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $a,b$는 $f'(x)=0$의 근이다.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 논술고사 안내」 우수답안 및 해설 p.41
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a,b$가 $f'(x)=0$의 두 근이므로 $f'(x)=3t(x-a)(x-b)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\int_a^bf'(x)dx=\int_a^b3t(x-a)(x-b)dx=-\dfrac12t(b-a)^3$이므로 구하는 값은 $\dfrac{-\frac12t(b-a)^3}{t(b-a)^3}=-\dfrac12$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    source_flow: 「2023학년도 논술고사 안내」 우수답안 및 해설 p.41 별해
    method_no: 2
    key_idea: 직접 적분 후 근과 계수의 관계를 쓴다.
    steps:
    - id: 1c-1
      content: |
        $\displaystyle\int_a^b(3tx^2+6x+3)dx=t(b-a)\left(b^2+ab+a^2+\dfrac3t(a+b)+\dfrac3t\right)$이고 $a+b=-\dfrac2t$, $ab=\dfrac1t$를 쓰면 $t(b-a)\left(b^2+ab+a^2-\dfrac32(a+b)^2+3ab\right)=-\dfrac12t(b-a)^3$. 따라서 값은 $-\dfrac12$.
      criteria: ['1.M1', '1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $f'(x)=3t(x-a)(x-b)$로 놓거나 근과 계수의 관계를 써서 적분할 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $\int_a^bf'(x)dx=-\dfrac12t(b-a)^3$을 구하고 값 $-\dfrac12$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9215}
  misconceptions:
  - id: MC-CAL-9215
    outcome_code: '71'
    wrong_work: '$\int_a^b(x-a)(x-b)dx=\tfrac16(b-a)^3$으로 부호를 놓쳐 $\tfrac12$을 얻음'
    detect_cue: 답이 $\tfrac12$(양수)이다
    feedback: $a<x<b$에서 $(x-a)(x-b)<0$이므로 적분값은 음수입니다. $\int_a^b(x-a)(x-b)dx=-\tfrac16(b-a)^3$.
    remedy: [RL-1]

- id: '2'
  stem: |
    $g(t_0)=\dfrac{2\sqrt5}{5}$일 때, $t_0$의 값을 구하시오.
  points: 9
  depends_on: ['1']
  answer: {kind: value, value: '4/5', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\angle C=90^\circ$이므로 $\overline{BC}:\overline{AB}=2:\sqrt5$에서 $\overline{BC}=2\overline{AC}$, 즉 $t(b-a)^2=1$.
    steps:
    - {id: 2a, content: '$b-a=t(b-a)^3$, $(b-a)^2=\tfrac{4-4t}{t^2}$ → $\tfrac4t-4=1$ → $t_0=\tfrac45$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - 삼각형 ABC는 어떤 삼각형인가?
    - $(b-a)^2$을 근과 계수의 관계로 구하자.
  - id: S2-B
    audience: B
    source_flow: 「2023학년도 논술고사 안내」 우수답안 및 해설 p.41
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        직각삼각형 ABC를 생각하면 $g(t_0)=\dfrac{\overline{BC}}{\overline{AB}}=\dfrac{2\sqrt5}{5}$로부터 $\overline{BC}=2\overline{AC}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\overline{BC}=b-a$이고 $\overline{AC}=f(a)-f(b)$이다. 문항 (1)의 풀이에서 $f(a)-f(b)=-\displaystyle\int_a^bf'(x)dx=\dfrac12t(b-a)^3$이므로 $b-a=2(f(a)-f(b))=t(b-a)^3$, 즉 $t(b-a)^2=1$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $f'(x)=3tx^2+6x+3=0$의 두 근 $a,b$에 대한 근과 계수의 관계에서 $(b-a)^2=(b+a)^2-4ab=\left(\dfrac{-6}{3t}\right)^2-4\left(\dfrac{3}{3t}\right)=\dfrac{4-4t}{t^2}$이다. $b>a$이므로 $1-t>0$이고 이는 두 근을 가질 조건과 일치한다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $1=t(b-a)^2=t\cdot\dfrac{4-4t}{t^2}=\dfrac4t-4$를 풀면 $t_0=\dfrac45$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        직각삼각형 ABC에서 조건을 $\overline{BC}=2\overline{AC}$로 바꿨다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\overline{AC}=f(a)-f(b)=\dfrac12t(b-a)^3$을 써서 $t(b-a)^2=1$을 얻었다.
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        근과 계수의 관계로 $(b-a)^2=\dfrac{4-4t}{t^2}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $t_0=\dfrac45$을 구했다.
      depends_on: [2.A1, 2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-GEO-9216}
  misconceptions:
  - id: MC-GEO-9216
    outcome_code: '72'
    wrong_work: '$\overline{AC}=2\overline{BC}$로 두어 $t(b-a)^2=4$, $t=\tfrac12$을 얻음'
    detect_cue: 답이 $\tfrac12$이다
    feedback: $g=\overline{BC}/\overline{AB}=\tfrac{2}{\sqrt5}$이면 $\overline{BC}:\overline{AC}:\overline{AB}=2:1:\sqrt5$입니다. 어느 변이 2인지 확인하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    문항 (2)의 $t_0$에 대하여, 직선 $x=a,y=f(b)$와 $y=f(x)\ (x\ge a)$의 그래프로 둘러싸인 도형의 넓이를 구하시오.
  points: 9
  depends_on: ['2']
  answer: {kind: value, value: '5/16', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 삼차함수는 변곡점에 대해 점대칭이므로 넓이는 삼각형 ABC의 넓이 $\tfrac14t(b-a)^4=\tfrac{1}{4t}$이다.
    steps:
    - {id: 3a, content: '$\tfrac12\overline{BC}\cdot\overline{AC}=\tfrac14t(b-a)^4=\tfrac1{4t}=\tfrac5{16}$', criteria: ['3.M1', '3.A1', '3.A2']}
    hint_ladder:
    - 두 극점의 중점은 변곡점이다.
  - id: S3-B
    audience: B
    source_flow: 「2023학년도 논술고사 안내」 우수답안 및 해설 p.42
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        삼차함수는 변곡점을 중심으로 점대칭이므로 도형의 넓이는 삼각형 ABC의 넓이와 같다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        삼각형의 넓이는 $\dfrac12\cdot\overline{BC}\cdot\overline{AC}=\dfrac12(b-a)\left(\dfrac12t(b-a)^3\right)=\dfrac14t(b-a)^4$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        문항 (2)의 풀이에서 $(b-a)^2=\dfrac1t$이고 $t=\dfrac45$이므로 구하는 넓이는 $\dfrac{1}{4t}=\dfrac{5}{16}$이다.
      criteria: ['3.A2']
  - id: S3-ALT
    audience: ALT
    method_no: 2
    key_idea: '자체 대체 풀이(공식 해설 아님) — $f(x)-f(b)=t(x-b)^2(x-c)$로 인수분해해 $\int_a^b\{f(x)-f(b)\}dx$를 직접 계산하면 $\tfrac14t(b-a)^4$.'
    steps:
    - id: 3c-1
      content: |
        $f(x)-f(b)=t(x-b)^2(x-c)$이고 $f(a)-f(b)=t(a-b)^2(a-c)=\tfrac12t(b-a)^3$에서 $c=a-\tfrac{b-a}{2}$. $\int_a^bt(x-b)^2(x-c)dx=\tfrac14t(b-a)^4$이므로 넓이 $\tfrac{1}{4t}=\tfrac5{16}$.
      criteria: ['3.M1', '3.A1', '3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        점대칭으로 넓이가 삼각형 ABC의 넓이와 같음을 밝혔다(또는 $\int_a^b\{f(x)-f(b)\}dx$를 세웠다).
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3c-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        넓이를 $\dfrac14t(b-a)^4$으로 나타냈다.
      depends_on: [3.M1]
      steps: [3b-2, 3c-1]
    - id: 3.A2
      mark_type: A
      points: 3
      evidence: |
        $(b-a)^2=\dfrac1t$, $t=\dfrac45$을 대입해 $\dfrac{5}{16}$을 얻었다.
      depends_on: [3.A1]
      ft: {allowed: true, from: [2.A2], max_points: 3}
      implied_ok: true
      steps: [3b-3, 3c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-CAL-9217}
  misconceptions:
  - id: MC-CAL-9217
    outcome_code: '73'
    wrong_work: '넓이를 직사각형 $\overline{BC}\cdot\overline{AC}=\tfrac12t(b-a)^4=\tfrac58$로 씀'
    detect_cue: 답이 $\tfrac58$이다
    feedback: 점대칭으로 곡선이 직사각형을 넓이가 같은 두 부분으로 나눕니다. 구하는 넓이는 그 절반(삼각형 ABC)입니다.
    remedy: [RL-3]

- id: '4'
  stem: |
    극한값 $\displaystyle\lim_{t\to0^+}\frac{g(t)}{t}$을 구하시오.
  points: 9
  depends_on: ['2']
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{g(t)}{t}=\sqrt{\dfrac{4}{(4-4t)^2+4t^2}}\to\dfrac12$.
    steps:
    - {id: 4a, content: '$\overline{AB}^2=\tfrac{(4-4t)^3}{4t^4}+\tfrac{4-4t}{t^2}$, $\overline{BC}^2=\tfrac{4-4t}{t^2}$ → $\tfrac{g}{t}=\sqrt{\tfrac{4}{(4-4t)^2+4t^2}}\to\tfrac12$', criteria: ['4.M1', '4.A1', '4.A2']}
    hint_ladder:
    - $\overline{AB}$, $\overline{BC}$를 $t$로 나타내자.
  - id: S4-B
    audience: B
    source_flow: 「2023학년도 논술고사 안내」 우수답안 및 해설 p.42
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $\overline{AB}=\sqrt{(f(a)-f(b))^2+(b-a)^2}$이고, 문항 (2)의 풀이에서 $f(a)-f(b)=\dfrac12t(b-a)^3$, $(b-a)^2=\dfrac{4-4t}{t^2}$이므로 $\overline{AB}=\sqrt{\dfrac{(4-4t)^3}{4t^4}+\dfrac{4-4t}{t^2}}$, $\overline{BC}=b-a=\sqrt{\dfrac{4-4t}{t^2}}$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        따라서 $\dfrac{g(t)}{t}=\dfrac1t\sqrt{\dfrac{\frac{4-4t}{t^2}}{\frac{(4-4t)^3+4t^2(4-4t)}{4t^4}}}=\sqrt{\dfrac{4}{(4-4t)^2+4t^2}}$이다.
