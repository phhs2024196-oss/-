intent: |
  함수의 그래프에 관련된 집합과 원의 방정식으로 제시된 조건을 이해하고 그래프와 원의 교점에 대한 수리적 추론과 조작을 수행하여 함숫값을 구하는 문제이다. 직선과 원의 관계에 대한 이해를 바탕으로 수리적 조건을 유도하는 추론 능력과, 두 점 사이의 거리·점과 직선 사이의 거리를 바르게 이해하고 효율적으로 활용하는 능력을 평가한다(공식 출제의도 요지).
key_idea: |
  집합 $A$는 꺾은선 $y=\tfrac38(\lvert x\rvert-\lvert x-2\rvert+4)$, 즉 $x\le0$에서 $\tfrac34$, $0\le x\le2$에서 $\tfrac34(x+1)$, $x\ge2$에서 $\tfrac94$인 그래프와 그 위쪽이다. 중심 $(a,r)$, 반지름 $r$인 원은 $x$축에 접하므로, 그래프에 아래에서 접하는 조건을 각 부분(수평선: 중심의 $y$좌표 = 높이의 절반, 기울어진 선분: 각의 이등분선 $y=\tfrac{x+1}{3}$, 꺾인 점 $(0,\tfrac34)$를 지남)으로 나누어 $r$을 정한다.
stuck: |
  $0<a<\tfrac14$에서는 원이 선분 $y=\tfrac34(x+1)$의 내부가 아니라 끝점 $(0,\tfrac34)$에서 닿는다는 것 — 수선의 발 $\left(\tfrac{4a-1}{5},\tfrac{3a+3}{5}\right)$이 $0\le x$를 벗어나는 경계 $a=\tfrac14$를 (1)로 찾는 것
