stimuli:
- label: 함수 정의
  body: |
    실수 $a$에 대하여, 좌표평면의 집합 $A=\{(x,y)\mid 8y\ge3(\lvert x\rvert-\lvert x-2\rvert+4)\}$와 원 $(x-a)^2+(y-r)^2=r^2$이 한 점 또는 두 점에서 만나는 반지름 $r(>0)$이 있다. 이때 함숫값 $f(a)$는 $r$이다.

stem: |
  다음 함수 $f$에 대하여 아래 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    $a>-1$일 때, 좌표 평면의 점 $\left(a,\dfrac{a+1}{3}\right)$에서 직선 $y=\dfrac34(x+1)$에 내린 수선의 발을 $a$로 나타내시오.
  points: 8
  depends_on: []
  answer: {kind: expression, value: '((4*a-1)/5, (3*a+3)/5)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 기울기 $-\tfrac43$인 수선과 직선의 교점.
    steps:
    - {id: 1a, content: '$y-\tfrac{a+1}{3}=-\tfrac43(x-a)$와 $y=\tfrac34(x+1)$ 연립 → $\left(\tfrac{4a-1}{5},\tfrac{3a+3}{5}\right)$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 수직인 두 직선의 기울기의 곱은 $-1$이다.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 논술고사 안내」 우수답안 및 해설 p.44
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직선 $y=\dfrac34(x+1)$과 수직인 기울기는 $-\dfrac43$이므로 점 $\left(a,\dfrac{a+1}{3}\right)$을 지나고 기울기 $-\dfrac43$인 직선의 방정식은 $y-\dfrac{a+1}{3}=-\dfrac43(x-a)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이 직선과 $y=\dfrac34(x+1)$의 교점을 구하면 $\left(\dfrac{4a-1}{5},\dfrac{3a+3}{5}\right)$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        수직인 직선의 기울기 $-\dfrac43$로 수선의 방정식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        수선의 발 $\left(\dfrac{4a-1}{5},\dfrac{3a+3}{5}\right)$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9219}
  misconceptions:
  - id: MC-GEO-9219
    outcome_code: '71'
    wrong_work: '수선의 기울기를 $-\tfrac34$로 둠'
    detect_cue: 수선의 방정식 기울기가 $-\tfrac34$이다
    feedback: 기울기 $m$인 직선에 수직인 직선의 기울기는 $-\tfrac1m$입니다. $\tfrac34\times\left(-\tfrac43\right)=-1$.
    remedy: [RL-1]

- id: '2'
  stem: |
    실수 $a$에 대하여 원 $(x-a)^2+(y-r)^2=r^2$이 집합 $A$와 두 점에서 만나는 반지름 $r$이 있을 때, 실수 $a$를 모두 구하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '[19/8]', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 두 점에서 만나려면 $y=\tfrac94\ (x\ge2)$와 $y=\tfrac34(x+1)\ (0<x<2)$에 동시에 접해야 하므로 중심은 $y=\tfrac98$과 이등분선 $y=\tfrac{x+1}{3}$의 교점.
    steps:
    - {id: 2a, content: '$r=\tfrac98$, $\tfrac{x+1}{3}=\tfrac98$ → $a=\tfrac{19}{8}$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - 집합 $A$의 경계를 구간별로 절댓값 없이 써 보자.
    - 기울어진 선분과 $x$축에 동시에 접하는 원의 중심은 어디에 있는가?
  - id: S2-B
    audience: B
    source_flow: 「2023학년도 논술고사 안내」 우수답안 및 해설 p.44
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        집합 $A$는 함수 $y=\dfrac38(\lvert x\rvert-\lvert x-2\rvert+4)$의 그래프와 그보다 위에 있는 점들이다. 원이 $A$와 두 점에서 만나려면 그래프 중 $y=\dfrac38(x-(x-2)+4)=\dfrac94\ (x\ge2)$, $y=\dfrac38(x+(x-2)+4)=\dfrac34(x+1)\ (0<x<2)$와 각각 한 점에서 만나야 한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        원이 $y=\dfrac94\ (x\ge2)$와 한 점에서 만나려면 원의 중심 $(a,r)$이 직선 $y=\dfrac98$ 위에 있어야 한다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        원이 $y=\dfrac34(x+1)\ (0<x<2)$와 한 점에서 만나려면 중심 $(a,r)$은 직선 $y=\dfrac34(x+1)$과 $x$축까지의 거리가 같은 점으로 $\dfrac{\left\lvert y-\frac34(x+1)\right\rvert}{\sqrt{1^2+\left(\frac34\right)^2}}=\lvert y\rvert$를 만족하고, $y$좌표가 양수이므로 $y=\dfrac{x+1}{3}$ 위에 있다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        두 직선 $y=\dfrac98$과 $y=\dfrac{x+1}{3}$의 교점이 $\left(\dfrac{19}{8},\dfrac98\right)$이므로 구하는 $a$는 $\dfrac{19}{8}$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        집합 $A$의 경계를 구간별로 나타내고, 두 점에서 만나려면 $y=\dfrac94\ (x\ge2)$와 $y=\dfrac34(x+1)\ (0<x<2)$에 각각 한 점에서 만나야 함을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        중심이 $y=\dfrac98$ 위에 있어야 함을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        점과 직선 사이의 거리로 중심이 $y=\dfrac{x+1}{3}$ 위에 있어야 함을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $a=\dfrac{19}{8}$을 구했다.
      depends_on: [2.A1, 2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-GEO-9220}
  misconceptions:
  - id: MC-GEO-9220
    outcome_code: '72'
    wrong_work: '원이 직선 $y=\tfrac34(x+1)$ 전체에 접하는 조건만 써서 수평선 $y=\tfrac34\ (x\le0)$과의 접촉 등 다른 후보를 확인 없이 섞음, 또는 접점이 $0<x<2$, $x\ge2$에 있는지 확인하지 않음'
    detect_cue: 접점의 $x$좌표가 해당 구간에 있는지 확인한 서술이 없다
    feedback: 집합 $A$의 경계는 선분·반직선들입니다. 직선에 접하는 접점이 실제 그 선분 위에 있어야 그래프와 만나는 것입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $a>-1$일 때, 함수 $f(a)$를 구하시오.
  points: 12
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'Piecewise((3/8, a<=0), (2*a**2/3+3/8, a<1/4), ((a+1)/3, a<19/8), (9/8, True))', equivalents: ['f(a)=3/8 (-1<a<=0), 2a^2/3+3/8 (0<a<1/4), (a+1)/3 (1/4<=a<19/8), 9/8 (a>=19/8)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 원이 어느 부분에 닿는지로 나눈다 — $a\ge\tfrac{19}{8}$ 수평선 $\tfrac94$, $\tfrac14\le a<\tfrac{19}{8}$ 기울어진 선분(이등분선 위 중심), $0<a<\tfrac14$ 꺾인 점 $(0,\tfrac34)$, $-1<a\le0$ 수평선 $\tfrac34$.
    steps:
    - {id: 3a, content: '$f(a)=\tfrac38,\ \tfrac23a^2+\tfrac38,\ \tfrac{a+1}{3},\ \tfrac98$ (구간 $(-1,0]$, $(0,\tfrac14)$, $[\tfrac14,\tfrac{19}{8})$, $[\tfrac{19}{8},\infty)$)', criteria: ['3.B1', '3.M1', '3.A1', '3.A2', '3.B2']}
    hint_ladder:
    - $f(a)$는 원이 그래프에 접하는 중심의 $y$좌표이다.
    - (1)의 수선의 발이 선분 $0\le x<2$ 위에 있는 $a$의 범위는?
    - 수선의 발이 선분 밖이면 원은 어디에 닿는가?
  - id: S3-B
    audience: B
    source_flow: 「2023학년도 논술고사 안내」 우수답안 및 해설 pp.45-46
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(a)$는 $a>-1$에서 그래프와 한 점 또는 두 점에서 만나는 원의 중심의 $y$좌표이다. (2)에서 $a=\dfrac{19}{8}$일 때만 두 점에서 만나므로 나머지 $a$에서는 한 점에서 만나는 원의 중심의 $y$좌표이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (ㄱ) (2)에 따라 $a\ge\dfrac{19}{8}$에서 그래프 $y=\dfrac94\ (x\ge2)$와 한 점에서 만나는 원의 중심은 $\left(a,\dfrac98\right)$이므로 $f(a)=\dfrac98$이다.
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        (ㄴ) 원이 $y=\dfrac34(x+1)\ (0\le x<2)$와 한 점에서 만나려면 중심은 (2)에 따라 $y=\dfrac{x+1}{3}$ 위, 즉 $\left(a,\dfrac{a+1}{3}\right)$이고, 이 점에서 내린 수선의 발은 (1)에 따라 $\left(\dfrac{4a-1}{5},\dfrac{3a+3}{5}\right)$이다. $a=\dfrac14$일 때 수선의 발이 끝점 $\left(0,\dfrac34\right)$이므로 $\dfrac14\le a<\dfrac{19}{8}$에서 $f(a)=\dfrac{a+1}{3}$이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        (ㄷ) $0<a<\dfrac14$에서는 원이 그래프의 점 $\left(0,\dfrac34\right)$과 한 점에서 만나므로 $(0-a)^2+\left(\dfrac34-r\right)^2=r^2$이고 $r=\dfrac23a^2+\dfrac38$, 즉 $f(a)=\dfrac23a^2+\dfrac38$이다.
      criteria: ['3.A2']
    - id: 3b-5
      content: |
        (ㄹ) $-1<a\le0$에서는 원이 $y=\dfrac38(-x+(x-2)+4)=\dfrac34\ (x\le0)$와 한 점에서 만나야 하므로 중심은 $\left(a,\dfrac38\right)$이고 $f(a)=\dfrac38$이다. 정리하면
        $$f(a)=\begin{cases}\dfrac38 & (-1<a\le0)\\ \dfrac23a^2+\dfrac38 & \left(0<a<\dfrac14\right)\\ \dfrac{a+1}{3} & \left(\dfrac14\le a<\dfrac{19}{8}\right)\\ \dfrac98 & \left(\dfrac{19}{8}\le a\right)\end{cases}$$
      criteria: ['3.B2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $f(a)$를 그래프와 한 점(또는 두 점)에서 만나는 원의 중심의 $y$좌표로 해석하고 구간을 나누었다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        $a\ge\dfrac{19}{8}$에서 $f(a)=\dfrac98$을 구했다.
      depends_on: []
      ft: {allowed: true, from: [2.A2], max_points: 2}
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
