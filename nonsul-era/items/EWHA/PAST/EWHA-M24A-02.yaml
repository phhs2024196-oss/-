intent: |
  본 문제는 자연수와 유리수의 기본적인 성질을 이해하고 귀류법을 활용하여 주어진 문제의 결론을 수리적으로 추론하는 문제이다. 이 과정에서 제시된 조건을 통해 미지의 계수를 정하는 능력을 점검하고, 명제의 가정과 이미 알려진 성질, 조건 및 정의를 근거로 주어진 명제가 참임을 논리적으로 밝히는 수리적 증명 능력을 평가하고자 한다. 또한 다항함수의 미분, 증가와 감소 등의 수리적 개념을 효과적으로 활용하여 주어진 사차방정식의 근의 특성을 함수의 개형을 통해 판별하는 능력을 평가하고자 한다. (출제의도 원문, 안내_2024 p.42)
key_idea: |
  $(\sqrt3+\sqrt5)^2=8+2\sqrt{15}$를 이용해 $f(\sqrt3+\sqrt5)=(8m+n+124)+(2m+32)\sqrt{15}$로 정리하면 $m=-16$, $n=4$이다. $x^4-16x^2+4=0$이 유리근을 가지지 않음을 귀류법(짝·홀 논증)으로 보이면, 그 실근인 $\sqrt3+\sqrt5$는 무리수이다.
stuck: |
  유리근 $\frac pq$(서로소)를 대입한 $p^4=4q^2(4p^2-q^2)$에서 $p$, $q$가 모두 짝수임을 끌어내는 짝·홀 논증, 그리고 (1)~(3)을 엮어 $\sqrt3+\sqrt5$의 무리성을 결론짓는 구성
