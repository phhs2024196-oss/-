stimuli:
- label: 조건
  body: |
    $a,b,c,d$가 유리수일 때, $a=c$, $b=d$이면 $a+b\sqrt{15}=c+d\sqrt{15}$이다.
    거꾸로 $a+b\sqrt{15}=c+d\sqrt{15}$이면, $a=c$, $b=d$이다.

stem: |
  무리수 $\sqrt{15}$에 대하여 다음이 성립할 때, 아래 물음에 답하시오. [35점]

subparts:
- id: '1'
  stem: |
    정수 $m,n$에 대하여 함수 $f(x)=x^4+mx^2+n$라 할 때, $\sqrt3+\sqrt5$가 $f(x)=0$의 근이 되는 $m,n$의 값을 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '(-16, 4)', equivalents: ['m=-16, n=4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(\sqrt3+\sqrt5)$를 $\square+\square\sqrt{15}$ 꼴로 정리하고 박스 조건으로 두 부분을 각각 0으로 둔다.
    steps:
    - {id: 1a, content: '$(8m+n+124)+(2m+32)\sqrt{15}=0\Rightarrow m=-16,\ n=4$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $(\sqrt3+\sqrt5)^2$부터 계산해 보자.
    - $0=0+0\sqrt{15}$로 보고 박스 조건을 쓰자.
  - id: S1-B
    audience: B
    source_flow: 안내_2024 p.43 우수답안 및 해설 (1) 풀이
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(\sqrt3+\sqrt5)=(\sqrt3+\sqrt5)^4+m(\sqrt3+\sqrt5)^2+n=(8m+n+124)+(2m+32)\sqrt{15}=0$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $m,n$이 정수이므로 지문에 주어진 사실로부터 $m,n$에 관한 두 방정식 $8m+n+124=0$과 $2m+32=0$을 얻는다. 이 연립방정식을 풀면 $m=-16$이고 $n=4$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $f(\sqrt3+\sqrt5)=(8m+n+124)+(2m+32)\sqrt{15}$로 정리했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        박스 조건을 근거로 $8m+n+124=0$, $2m+32=0$을 세워 $m=-16$, $n=4$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-9306}
  misconceptions:
  - id: MC-ALG-9306
    outcome_code: '71'
    wrong_work: '$(8m+n+124)+(2m+32)\sqrt{15}=0$ 한 식에서 $n=-8m-124-(2m+32)\sqrt{15}$처럼 풀다 멈춤'
    detect_cue: 유리부분·무리부분을 따로 0으로 둔 두 식이 없다
    feedback: $m,n$이 정수(유리수)이므로 박스 조건에 의해 유리부분과 $\sqrt{15}$의 계수가 각각 0이어야 합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    문항 (1)에서 구한 $m,n$에 대하여 $x^4+mx^2+n=0$의 서로 다른 실근의 개수를 구하시오.
  points: 9
  depends_on: ['1']
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: "$f'(x)=4x(x-2\\sqrt2)(x+2\\sqrt2)$이고 극솟값 $-60<0$, 극댓값 $4>0$이므로 $x$축과 네 번 만난다."
    steps:
    - {id: 2a, content: '극값 $f(\pm2\sqrt2)=-60$, $f(0)=4$ → 서로 다른 실근 4개', criteria: [2.M1, 2.A1, 2.R1]}
    hint_ladder:
    - $y=f(x)$의 그래프와 $x$축의 교점의 개수를 세자.
    - 극댓값과 극솟값의 부호를 보자.
  - id: S2-B
    audience: B
    source_flow: 안내_2024 p.43 우수답안 및 해설 (2) 풀이
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        방정식 $f(x)=x^4-16x^2+4=0$의 서로 다른 실근의 개수는 함수 $y=f(x)$의 그래프와 $x$축의 교점의 개수와 같다. $f'(x)=4x^3-32x=4x(x-2\sqrt2)(x+2\sqrt2)$이므로 $f'(x)=0$을 만족시키는 $x$의 값은 $x=-2\sqrt2$, $x=0$ 또는 $x=2\sqrt2$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $f'(x)$의 부호를 조사하면 $f(x)$는 $(-\infty,-2\sqrt2)$에서 감소, $(-2\sqrt2,0)$에서 증가, $(0,2\sqrt2)$에서 감소, $(2\sqrt2,\infty)$에서 증가하고, $f(-2\sqrt2)=-60$, $f(0)=4$, $f(2\sqrt2)=-60$이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        따라서 실근이 4개의 구간 $(-\infty,-2\sqrt2)$, $(-2\sqrt2,0)$, $(0,2\sqrt2)$, $(2\sqrt2,\infty)$에서 하나씩 존재한다. 즉, 함수 $y=f(x)$의 그래프는 $x$축과 서로 다른 네 점에서 만나므로 서로 다른 실근의 개수는 $4$이다.
      criteria: [2.R1]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    key_idea: $t=x^2$으로 치환하면 $t^2-16t+4=0$의 두 근 $8\pm2\sqrt{15}$가 모두 양수이므로 $x=\pm\sqrt{8\pm2\sqrt{15}}$, 서로 다른 실근 4개(공식 해설 (3) 별해의 계산을 활용).
    steps:
    - id: 2c-1
      content: |
        $t^2-16t+4=0$에서 $t=8\pm2\sqrt{15}>0$이고 두 값이 다르므로 $x^2=t$는 각각 두 실근을 가져 서로 다른 실근은 $4$개이다.
      criteria: [2.M1, 2.A1, 2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $f'(x)=4x(x-2\sqrt2)(x+2\sqrt2)$로 임계점을 구했다(또는 $t=x^2$ 치환).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: ['1.A1'], max_points: 3}
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        증감표와 극값 $-60$, $4$, $-60$을 바르게 구했다(또는 $t=8\pm2\sqrt{15}>0$).
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        극값의 부호로부터 네 구간에 근이 하나씩 있음을 밝혀 실근의 개수 $4$를 결론지었다.
      depends_on: [2.A1]
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-9307}
  misconceptions:
  - id: MC-CAL-9307
    outcome_code: '72'
    wrong_work: '$t^2-16t+4=0$의 판별식이 양수이므로 실근은 $2$개'
    detect_cue: 답이 2
    feedback: $t=x^2$의 각 양근마다 $x=\pm\sqrt t$ 두 개의 실근이 생깁니다. $t$의 부호까지 확인하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    문항 (1)에서 구한 $m,n$에 대하여 $x^4+mx^2+n=0$의 실근이 모두 무리수임을 귀류법을 이용하여 보이시오.
  points: 10
  depends_on: ['1', '2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 유리근 $\frac pq$(서로소 자연수)를 가정하면 $p^4=4q^2(4p^2-q^2)$에서 $p$ 짝수, 다시 $4k^4=q^2(16k^2-q^2)$에서 $q$ 짝수가 되어 모순.
    steps:
    - {id: 3a, content: '$p=2k\Rightarrow4k^4=q^2(16k^2-q^2)$, $q$ 홀수면 우변 홀수 → $q$ 짝수 → 서로소 모순', criteria: [3.R1, 3.M1, 3.R2]}
    hint_ladder:
    - 유리수인 근 $\alpha$가 있다고 가정하고 $\alpha=\frac pq$로 두자. $-\alpha$도 근임을 이용하면 $\alpha>0$으로 둘 수 있다.
    - 대입 후 $q^4$를 곱해 $p$가 짝수임을 보이자.
  - id: S3-B
    audience: B
    source_flow: 안내_2024 p.43 우수답안 및 해설 (3) 풀이
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        문항 (2)로부터 $x^4-16x^2+4=0$의 근이 모두 실수이므로 근이 모두 무리수라는 결론을 부정하여 $x^4-16x^2+4=0$은 적어도 하나의 유리수인 근 $\alpha$를 가진다고 가정한다. $\alpha$와 $-\alpha$가 모두 $x^4-16x^2+4=0$의 근이 되므로 $\alpha=\dfrac pq$ ($p,q$는 서로소인 자연수)로 나타낼 수 있다.
      criteria: [3.R1]
    - id: 3b-2
      content: |
        $x^4-16x^2+4=0$에 근 $\dfrac pq$를 대입한 후 양변을 $q^4$로 곱하여 정리하면 $p^4=16p^2q^2-4q^4=4q^2(4p^2-q^2)$이다. 여기서 $4q^2(4p^2-q^2)$이 짝수이므로 $p^4$이 짝수이고 $p$도 짝수이다.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        따라서 $p=2k$ ($k$는 자연수)로 나타내면 $(2k)^4=4q^2(16k^2-q^2)$이고 $4k^4=q^2(16k^2-q^2)$이다. 만약 $q$가 홀수이면 $q^2$와 $16k^2-q^2$이 모두 홀수가 되므로, 두 홀수의 곱 $q^2(16k^2-q^2)$은 다시 홀수가 되지만 $4k^4$가 짝수이므로 모순이다. 결국 $q$는 짝수이다. 그러면 $p,q$가 모두 짝수이므로 서로소인 자연수라는 가정의 모순이다. 귀류법에 따라서 $x^4-16x^2+4=0$는 모두 무리수인 근을 가진다. ■
      criteria: [3.R2]
  - id: S3-ALT
    audience: ALT
    source_flow: 안내_2024 p.44 (3) 별해
    method_no: 2
    key_idea: 유리근 $\alpha$가 있으면 $\alpha^2$은 유리수이면서 $t^2-16t+4=0$의 근 $8\pm2\sqrt{15}$ 중 하나 — 모순.
    steps:
    - id: 3c-1
      content: |
        방정식 $x^4-16x^2+4=0$은 적어도 하나의 유리수인 근 $\alpha$를 가진다고 가정한다. 이때 $\alpha^2$은 유리수이고 방정식 $t^2-16t+4=0$의 근이 된다. 이 이차방정식의 근이 $8\pm2\sqrt{15}$이므로 $\alpha^2$은 $8\pm2\sqrt{15}$ 중 하나가 된다. $8\pm2\sqrt{15}$가 무리수이므로 $\alpha^2$이 유리수인 가정에 모순이다. 귀류법에 따라서 $x^4-16x^2+4=0$는 모두 무리수인 근을 가진다.
      criteria: [3.R1, 3.M1, 3.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        결론을 부정해 유리근 $\alpha$의 존재를 가정하고, $\alpha=\dfrac pq$($p,q$ 서로소인 자연수)로 두었다($-\alpha$도 근이라는 근거 또는 부호 처리 포함).
      depends_on: []
