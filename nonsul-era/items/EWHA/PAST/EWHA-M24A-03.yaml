intent: |
  본 문제는 좌표평면의 원과 직선의 관계로 주어진 문제를 이해하고, 주어진 조건에 대한 수리적 추론을 바탕으로 풀이를 기획하고 수행할 수 있는 수리적 문제 해결 능력을 평가하는 문제이다. 이 과정에서 직선과 점의 거리, 원과 직선의 위치 관계, 실수의 성질에 관한 수리 개념의 이해와 종합적 활용 능력, 그리고 문제 해결에 필요한 수리적 정보 수집을 위한 효율적 계산의 설계와 수행에 관한 계산 능력의 수월성을 평가한다. (출제의도 원문, 안내_2024 p.45)
key_idea: |
  중심이 단위원 밖에 있고 단위원과 외접하므로 반지름은 (중심과 원점 사이 거리)$-1$이다. 이것을 중심과 직선 $y=2x$ 사이의 거리와 같다고 놓아 중심을 구한다.
stuck: |
  외접 조건을 반지름 $=\lvert a\rvert-1$로 바꾸고, 점과 직선 사이의 거리 공식과 연립하는 설계. (3)에서 중심이 $x$축 위인 경우를 따로 구해 네 꼭짓점이 마름모를 이룸을 보는 것
