stimuli: []

stem: |
  좌표평면의 원 $x^2+y^2=1$에 대하여 다음 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    중심이 $y$축에 있고 원 $x^2+y^2=1$ 밖에서 한 점에서 만나며 직선 $y=2x$에 접하는 원의 방정식을 모두 구하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: 'x**2+(y-(5+sqrt(5))/4)**2=((1+sqrt(5))/4)**2; x**2+(y+(5+sqrt(5))/4)**2=((1+sqrt(5))/4)**2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 중심 $(0,a)$, 반지름 $\lvert a\rvert-1$을 직선 $y=2x$까지의 거리 $\frac{\lvert a\rvert}{\sqrt5}$와 같게 놓는다.
    steps:
    - {id: 1a, content: '$\frac{\lvert a\rvert}{\sqrt5}=\lvert a\rvert-1\Rightarrow\lvert a\rvert=\frac{5+\sqrt5}4$, 반지름 $\frac{1+\sqrt5}4$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 두 원이 밖에서 접하면 중심 사이 거리는 반지름의 합이다.
    - 원이 직선에 접할 조건을 점과 직선 사이의 거리로 쓰자.
  - id: S1-B
    audience: B
    source_flow: 안내_2024 p.46 우수답안 및 해설 (1) 풀이
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        구하는 원의 중심을 $(0,a)$라고 둔다. 조건에서 이 점은 원 $x^2+y^2=1$ 밖에 있으므로 $\lvert a\rvert>1$이고 구하는 원의 반지름의 길이는 $\lvert a\rvert-1$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        직선 $y-2x=0$과 점 $(0,a)$의 거리도 원의 반지름의 길이와 같으므로
        $$\dfrac{\lvert a-2\cdot0\rvert}{\sqrt{1^2+(-2)^2}}=\lvert a\rvert-1$$
        이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        이 식을 계산하면 $\lvert a\rvert=\dfrac{5+\sqrt5}{4}$이다. 따라서 구하는 원의 방정식은 모두
        $$x^2+\left(y-\dfrac{5+\sqrt5}{4}\right)^2=\left(\dfrac{1+\sqrt5}{4}\right)^2,\quad x^2+\left(y+\dfrac{5+\sqrt5}{4}\right)^2=\left(\dfrac{1+\sqrt5}{4}\right)^2$$
        이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        중심 $(0,a)$, $\lvert a\rvert>1$, 반지름 $\lvert a\rvert-1$을 외접 조건으로부터 썼다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        점 $(0,a)$와 직선 $y-2x=0$ 사이의 거리 $\dfrac{\lvert a\rvert}{\sqrt5}$를 반지름과 같게 놓은 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $\lvert a\rvert=\dfrac{5+\sqrt5}4$을 구하고 두 원의 방정식을 모두 적었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 두 원 중 하나만 답함
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9310}
  - {code: '72', misconception: MC-GEO-9312}
  misconceptions:
  - id: MC-GEO-9310
    outcome_code: '71'
    wrong_work: '반지름을 $\lvert a\rvert+1$로 두어 $\frac{\lvert a\rvert}{\sqrt5}=\lvert a\rvert+1$(해 없음)'
    detect_cue: 반지름 식이 $\lvert a\rvert+1$
    feedback: 밖에서 접하면 (중심 거리) $=$ (반지름의 합)이므로 $\lvert a\rvert=r+1$, 즉 $r=\lvert a\rvert-1$입니다.
    remedy: [RL-1]
  - id: MC-GEO-9312
    outcome_code: '72'
    wrong_work: '거리를 $\lvert a\rvert$ 또는 $\frac{\lvert a\rvert}{3}$로 계산'
    detect_cue: 분모가 $\sqrt5$가 아니다
    feedback: 점 $(x_1,y_1)$과 직선 $px+qy+r=0$ 사이의 거리는 $\frac{\lvert px_1+qy_1+r\rvert}{\sqrt{p^2+q^2}}$입니다.
    remedy: [RL-2]

- id: '2'
  stem: |
    문항 (1)에서 구한 원은 모두 직선 $y=-2x$에 접함을 보이시오.
  points: 10
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 두 원의 중심 $(0,\pm\frac{5+\sqrt5}4)$에서 $y+2x=0$까지의 거리가 반지름 $\frac{1+\sqrt5}4$와 같다(또는 $y$축 대칭).
    steps:
    - {id: 2a, content: '거리 $=\frac{(5+\sqrt5)/4}{\sqrt5}=\frac{\sqrt5+1}4=$ 반지름', criteria: [2.M1, 2.A1, 2.A2]}
    hint_ladder:
    - 원과 직선이 접할 조건을 다시 쓰자.
    - 두 직선 $y=2x$, $y=-2x$는 어떤 축에 대해 대칭인가?
  - id: S2-B
    audience: B
    source_flow: 안내_2024 p.46 우수답안 및 해설 (2) 풀이
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문항 (1)에서 구한 원의 중심과 직선 $y+2x=0$의 거리가 원의 반지름의 길이와 같으면 원이 직선 $y+2x=0$에 접한다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        원 $x^2+\left(y-\dfrac{5+\sqrt5}{4}\right)^2=\left(\dfrac{1+\sqrt5}{4}\right)^2$의 중심 $\left(0,\dfrac{5+\sqrt5}{4}\right)$와 직선 $y+2x=0$의 거리는 $\dfrac{\left\lvert\frac{5+\sqrt5}{4}+2\cdot0\right\rvert}{\sqrt{1^2+2^2}}=\dfrac{\sqrt5+1}{4}$이다. 이 거리는 반지름의 길이 $\dfrac{1+\sqrt5}{4}$와 같으므로 원과 직선이 접한다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        마찬가지로 원 $x^2+\left(y+\dfrac{5+\sqrt5}{4}\right)^2=\left(\dfrac{1+\sqrt5}{4}\right)^2$의 중심 $\left(0,-\dfrac{5+\sqrt5}{4}\right)$와 직선 $y+2x=0$의 거리는 $\dfrac{\left\lvert-\frac{5+\sqrt5}{4}+2\cdot0\right\rvert}{\sqrt{1^2+2^2}}=\dfrac{\sqrt5+1}{4}$이다. 이 거리 또한 반지름의 길이 $\dfrac{1+\sqrt5}{4}$와 같으므로 원과 직선이 접한다. ■
      criteria: [2.A2]
  - id: S2-ALT
    audience: ALT
    source_flow: 안내_2024 p.46 (2) 별해
    method_no: 2
    key_idea: 원들은 $y$축에 대하여 대칭이고 $y=2x$를 $y$축 대칭이동하면 $y=-2x$이다.
    steps:
    - id: 2c-1
      content: |
        문항 (1)에서 구한 원은 모두 중심이 $y$축에 있으므로 $y$축에 대하여 대칭이다. 직선 $y=2x$를 $y$축에 대하여 대칭이동하면 직선 $y=-2x$이다. 문항 (1)에서 구한 원이 각각 직선 $y=2x$와 한 점에서 만나므로 $y$축에 대하여 대칭이동한 직선 $y=-2x$와 각각 한 점에서 만난다. 따라서 문항 (1)에서 구한 원은 모두 직선 $y=-2x$에 접한다.
      criteria: [2.M1, 2.A1, 2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        접할 조건(중심과 직선 $y+2x=0$의 거리 $=$ 반지름)을 쓰거나 $y$축 대칭 논증을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: ['1.A1'], max_points: 4}
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        중심 $\left(0,\frac{5+\sqrt5}4\right)$에 대해 거리 $\frac{\sqrt5+1}4$가 반지름과 같음을 계산했다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        중심 $\left(0,-\frac{5+\sqrt5}4\right)$인 원도 확인했다(또는 대칭으로 두 원 모두에 대해 결론).
      depends_on: [2.M1]
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-GEO-9312}
  misconceptions:
  - id: MC-GEO-9312
    outcome_code: '72'
    wrong_work: '거리를 $\frac{5+\sqrt5}{4}\cdot\frac12$ 등으로 계산해 반지름과 다르다고 결론'
    detect_cue: 거리 계산의 분모가 $\sqrt5$가 아니다
    feedback: 직선 $2x+y=0$에서 분모는 $\sqrt{2^2+1^2}=\sqrt5$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    중심이 $x$축 또는 $y$축에 있고 원 $x^2+y^2=1$ 밖에서 한 점에서 만나며 직선 $y=2x$에 접하는 원의 중심들을 꼭짓점으로 하는 다각형의 넓이를 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '(35+15*sqrt(5))/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $x$축 위 중심 $(b,0)$은 $\frac{2\lvert b\rvert}{\sqrt5}=\lvert b\rvert-1$에서 $\lvert b\rvert=5+2\sqrt5$. 네 중심은 두 축 위에 원점 대칭으로 놓여 마름모를 이룬다.
    steps:
    - {id: 3a, content: '넓이 $=\frac12\cdot\frac{5+\sqrt5}2\cdot(10+4\sqrt5)=\frac{35+15\sqrt5}2$', criteria: [3.M1, 3.A1, 3.M2, 3.A2]}
    hint_ladder:
    - $y$축 위의 중심은 (1)에서 구했다. $x$축 위의 중심도 같은 방법으로 구하자.
    - 네 점이 두 축 위에서 원점에 대해 대칭이면 어떤 사각형인가?
  - id: S3-B
    audience: B
    source_flow: 안내_2024 p.46~47 우수답안 및 해설 (3) 풀이
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        원의 중심이 $y$축에 있는 경우는 문항 (1)에서 모두 구하여 $\left(0,\dfrac{5+\sqrt5}{4}\right)$, $\left(0,\dfrac{-5-\sqrt5}{4}\right)$이다. 중심이 $x$축에 있는 원의 중심을 $(b,0)$이라고 하자. 조건에서 이 점은 원 $x^2+y^2=1$ 밖에 있으므로 $\lvert b\rvert>1$이고 반지름의 길이는 $\lvert b\rvert-1$이다. 직선 $y-2x=0$과 점 $(b,0)$의 거리도 반지름의 길이와 같으므로 $\dfrac{\lvert0-2\cdot b\rvert}{\sqrt{1^2+(-2)^2}}=\lvert b\rvert-1$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        이 식을 계산하면 $\lvert b\rvert=5+2\sqrt5$이다. 따라서 중심이 $x$축에 있는 원의 중심은 모두 $(5+2\sqrt5,0)$, $(-5-2\sqrt5,0)$이다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        앞서 구한 원의 중심 $\left(0,\dfrac{5+\sqrt5}{4}\right)$, $\left(0,\dfrac{-5-\sqrt5}{4}\right)$, $(5+2\sqrt5,0)$, $(-5-2\sqrt5,0)$을 꼭짓점으로 하는 다각형은 마름모이다.
      criteria: [3.M2]
    - id: 3b-4
      content: |
        따라서 이 다각형의 넓이는
        $$\dfrac12\left(\dfrac{5+\sqrt5}{4}-\left(\dfrac{-5-\sqrt5}{4}\right)\right)\cdot\left(5+2\sqrt5-(-5-2\sqrt5)\right)=\dfrac{35+15\sqrt5}{2}$$
        이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $x$축 위 중심 $(b,0)$에 대해 $\dfrac{2\lvert b\rvert}{\sqrt5}=\lvert b\rvert-1$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
