intent: |
  이차함수의 성질을 이해하고 문제 풀이의 기초가 되는 이차함수의 접선의 변화를 유추하기 위해 제시된 함수의 상태를 분석하여 수학적으로 추론하여 적용하는 문제이다. 이 과정에서 이차함수의 그래프와 직선의 위치에 대한 수리적 이해, 정적분과 급수에 관한 계산능력을 점검한다. 또한, 이차방정식의 근과 계수와의 관계, 이차함수의 성질을 이해하고 활용할 수 있는지를 평가한다. (출제의도 원문, 안내_2024 p.48)
key_idea: |
  $y=x^2+\frac14$ 위의 점 $(t,t^2+\frac14)$에서의 접선과 $y=x^2$의 교점의 $x$좌표는 $x^2-2tx+t^2-\frac14=0$의 두 근 $t\pm\frac12$이므로 $\lvert a_2-a_1\rvert=1$이 항상 성립하고, 둘러싸인 넓이는 $t$에 관계없이 $\frac16$이다. 따라서 $m_k^2-24A_k=4k^2-4$이고 부분분수로 망원합을 만든다.
stuck: |
  접점 $t$를 매개변수로 두고 교점의 $x$좌표 차를 근과 계수의 관계로 계산하는 발상, 그리고 넓이 $A_k$가 $k$에 무관한 상수임을 알아차리는 것
idea_tags: [IDEA-TANGENT-CHORD-CONSTANT-WIDTH, IDEA-VIETA-ROOT-DIFFERENCE]
tags: [이차함수 접선, 근과 계수의 관계, 정적분 넓이, 부분분수 급수]
elements:
  materials:
  - '이차함수 $y=x^2+\frac14$와 그 위의 점 $\mathrm{P}$에서의 접선'
  - '접선과 $y=x^2$의 두 교점 $\mathrm{Q}(a_1,b_1)$, $\mathrm{R}(a_2,b_2)$'
  - '접선과 $y=x^2$으로 둘러싸인 도형의 넓이 $A_k$'
  - '접선의 기울기 $m_k$와 급수 $\sum_{k=2}^{\infty}\frac{1}{m_k^2-24A_k}$'
  concepts:
  - '접선의 방정식(판별식 $D=0$ 또는 도함수)'
  - '이차방정식의 근과 계수의 관계'
  - '두 점 사이의 거리'
  - '직선과 곡선 사이의 넓이(정적분)'
  - '부분분수와 급수의 합(망원합)'
  tools:
  - '판별식 $D=(m-2t)^2=0$으로 접선의 기울기 결정'
  - '$(a_2-a_1)^2=(a_1+a_2)^2-4a_1a_2$'
  - '$b_2-b_1=(a_2-a_1)(a_2+a_1)$ 또는 거리 공식 $\overline{\mathrm{QR}}^2=(a_2-a_1)^2+(b_2-b_1)^2$'
  - '$\int_{k-\frac12}^{k+\frac12}\{(\text{접선})-x^2\}dx$'
  - '$\frac1{k^2-1}=\frac12\left(\frac1{k-1}-\frac1{k+1}\right)$'
  conditions:
  - '점 $\mathrm{P}$는 $y=x^2+\frac14$ 위의 임의의 점'
  - '$\overline{\mathrm{QR}}=7$'
  - '$k$는 자연수'
  stimuli_used: []
  subpart_links: '(3)은 (2)의 $\lvert a_2-a_1\rvert=1$을 사용, (4)는 (1)의 넓이 계산을 일반화(넓이가 $k$에 무관)'

