    detect_cue: 답이 $\frac18$이거나 $\frac12$항이 빠졌다
    feedback: 차가 2칸씩 벌어지는 부분분수이므로 앞쪽 두 항 $1,\frac12$과 뒤쪽 두 항이 남습니다.
