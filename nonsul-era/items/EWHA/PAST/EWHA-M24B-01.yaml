stimuli: []

stem: |
  좌표평면에 주어진 이차함수 $y=x^2+\dfrac14$의 그래프 위의 임의의 점 $\mathrm{P}$에 그은 접선이 이차함수 $y=x^2$의 그래프와 만나는 점의 좌표를 각각 $\mathrm{Q}(a_1,b_1)$, $\mathrm{R}(a_2,b_2)$라 할 때 다음 물음에 답하시오. [35점]

subparts:
- id: '1'
  stem: |
    $\mathrm{P}\left(0,\dfrac14\right)$일 때, 접선과 $y=x^2$으로 둘러싸인 도형의 넓이를 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '1/6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}(0,\frac14)$에서의 접선은 $y=\frac14$이고, $y=x^2$과 $x=\pm\frac12$에서 만난다.
    steps:
    - {id: 1a, content: '$\int_{-1/2}^{1/2}\left(\frac14-x^2\right)dx=\frac16$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 꼭짓점에서의 접선은 어떤 직선인가?
    - 접선과 $y=x^2$의 교점의 $x$좌표를 구해 적분 구간으로 쓰자.
  - id: S1-B
    audience: B
    source_flow: 안내_2024 p.49 우수답안 및 해설 (1) 풀이
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P}\left(0,\dfrac14\right)$를 지나며 기울기가 $m$인 직선은 $y=mx+\dfrac14$이다. 이 직선이 $y=x^2+\dfrac14$의 접선일 때는 $x^2+\dfrac14=mx+\dfrac14$가 중근을 가질 때이므로 판별식 $D=m^2=0$에 따라 $m=0$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 접선은 $y=\dfrac14$이고 $y=x^2$과 $x=\pm\dfrac12$에서 만나므로 구하는 도형의 넓이는 $\displaystyle\int_{-\frac12}^{\frac12}\left(\dfrac14-x^2\right)dx=\dfrac16$이다.
      criteria: [1.A1]
  - id: S1-ALT
    audience: ALT
    source_flow: 안내_2024 p.49 (1) 별해
    method_no: 2
    key_idea: 도함수 $y'=2x$로 $\mathrm{P}$에서의 기울기 $0$을 바로 얻는다.
    steps:
    - id: 1c-1
      content: |
        $y'=2x$이므로 점 $\mathrm{P}\left(0,\dfrac14\right)$에서 접선의 방정식은 $y=0\cdot(x-0)+\dfrac14=\dfrac14$이고, 넓이는 $\displaystyle\int_{-\frac12}^{\frac12}\left(\dfrac14-x^2\right)dx=\dfrac16$이다.
      criteria: [1.M1, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        판별식 또는 도함수로 접선 $y=\dfrac14$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        교점 $x=\pm\dfrac12$을 구간으로 하는 적분식을 세우고 넓이 $\dfrac16$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9300}
  misconceptions:
  - id: MC-CAL-9300
    outcome_code: '71'
    wrong_work: '$\int_{-1/2}^{1/2}\left(x^2-\frac14\right)dx=-\frac16$ 또는 구간을 $[0,\frac12]$로만 잡아 $\frac1{12}$'
    detect_cue: 넓이가 음수이거나 적분 구간이 교점 $\pm\frac12$와 다르다
    feedback: 위에 있는 그래프(접선 $y=\frac14$)에서 아래 그래프를 빼고, 두 교점 사이 전체를 적분하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $y=x^2+\dfrac14$위의 임의의 점 $\mathrm{P}$에 대하여 $\lvert a_2-a_1\rvert=1$임을 보이시오.
  points: 9
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}(t,t^2+\frac14)$에서의 접선 $y=2t(x-t)+t^2+\frac14$와 $y=x^2$의 교점은 $x^2-2tx+t^2-\frac14=0$의 근이다.
    steps:
    - {id: 2a, content: '$(a_2-a_1)^2=(2t)^2-4\left(t^2-\frac14\right)=1$', criteria: [2.M1, 2.M2, 2.R1]}
    hint_ladder:
    - 점 $\mathrm{P}$의 $x$좌표를 $t$로 두고 접선의 방정식을 세우자.
    - $a_1,a_2$는 어떤 이차방정식의 두 근인가?
  - id: S2-B
    audience: B
    source_flow: 안내_2024 p.49 우수답안 및 해설 (2) 풀이
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        임의의 점 $\mathrm{P}\left(t,t^2+\dfrac14\right)$를 지나며 기울기가 $m$인 직선은 $y=m(x-t)+t^2+\dfrac14$이다. 이 직선이 $y=x^2+\dfrac14$의 접선일 때는 $x^2-mx+mt-t^2=0$이 중근을 가질 때이므로 $D=(m-2t)^2=0$, 즉 $m=2t$이다. 따라서 접선은 $y=2t(x-t)+t^2+\dfrac14$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        접선과 $y=x^2$이 만나는 점의 $x$좌표 $a_1,a_2$는 $x^2-2tx+t^2-\dfrac14=0$의 근이다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        근과 계수의 관계로부터 $(a_2-a_1)^2=(a_2+a_1)^2-4a_2a_1=(2t)^2-4\left(t^2-\dfrac14\right)=1$이고 $\lvert a_2-a_1\rvert=1$이다. ■
      criteria: [2.R1]
  - id: S2-ALT
    audience: ALT
    source_flow: 안내_2024 p.49 (2) 별해
    method_no: 2
    key_idea: 두 교점 $\mathrm{Q},\mathrm{R}$을 지나는 직선 $y=(a_1+a_2)x-a_1a_2$가 $y=x^2+\frac14$에 접한다는 판별식 조건을 쓴다.
    steps:
    - id: 2c-1
      content: |
        접선의 방정식은 $y-a_2^2=\dfrac{a_2^2-a_1^2}{a_2-a_1}(x-a_2)$, 즉 $y=(a_1+a_2)x-a_1a_2$이다. 따라서 $x^2-(a_1+a_2)x+\left(a_1a_2+\dfrac14\right)=0$이 중근을 가지므로 $D=(a_1+a_2)^2-4\left(a_1a_2+\dfrac14\right)=0\Rightarrow(a_2-a_1)^2=1$이고 $\lvert a_2-a_1\rvert=1$이다.
      criteria: [2.M1, 2.M2, 2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        임의의 점 $\mathrm{P}(t,t^2+\frac14)$에서의 접선 $y=2t(x-t)+t^2+\dfrac14$(또는 두 교점을 지나는 직선 $y=(a_1+a_2)x-a_1a_2$)을 식으로 썼다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $a_1,a_2$가 $x^2-2tx+t^2-\dfrac14=0$의 두 근임(또는 접할 조건의 판별식)을 식으로 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2c-1]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        $(a_2-a_1)^2=(a_1+a_2)^2-4a_1a_2=1$을 계산해 $t$에 관계없이 $\lvert a_2-a_1\rvert=1$이라고 결론지었다.
      depends_on: [2.M2]
      steps: [2b-3, 2c-1]
    deductions:
    - code: D2-1
      condition: 특정한 점 $\mathrm{P}$(예 $t=0$)에서만 확인하고 일반화
      effect: cap
      value: 3
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9301}
  - {code: '72', misconception: MC-ALG-9302}
  misconceptions:
  - id: MC-CAL-9301
    outcome_code: '71'
    wrong_work: '$y=x^2$의 도함수로 접선을 $y=2t(x-t)+t^2$로 둠'
    detect_cue: 접선의 $y$절편에 $\frac14$가 빠져 있다
    feedback: 접선은 $y=x^2+\frac14$ 위의 점 $\mathrm{P}$에서 그은 것입니다. 접점의 $y$좌표가 $t^2+\frac14$입니다.
    remedy: [RL-2]
  - id: MC-ALG-9302
    outcome_code: '72'
    wrong_work: '$(a_2-a_1)^2=(a_1+a_2)^2+4a_1a_2$로 계산'
    detect_cue: 결과가 $t$에 의존하거나 1이 아니다
    feedback: $(a_2-a_1)^2=(a_1+a_2)^2-4a_1a_2$입니다. 두 근의 합 $2t$, 곱 $t^2-\frac14$를 대입하세요.
    remedy: [RL-3]

- id: '3'
  stem: |
    $\overline{\mathrm{QR}}=7$일 때, 접선의 기울기를 구하시오.
  points: 9
  depends_on: ['2']
  answer: {kind: set, value: '[4*sqrt(3), -4*sqrt(3)]', equivalents: ['±4*sqrt(3)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\lvert a_2-a_1\rvert=1$이므로 $\lvert b_2-b_1\rvert=\sqrt{48}$이고 기울기는 $\frac{b_2-b_1}{a_2-a_1}$이다.
    steps:
    - {id: 3a, content: '$1+(b_2-b_1)^2=49\Rightarrow\lvert b_2-b_1\rvert=4\sqrt3$, 기울기 $\pm4\sqrt3$', criteria: [3.M1, 3.A1, 3.A2]}
    hint_ladder:
    - 거리 공식에 (2)의 결과를 넣어 보자.
  - id: S3-B
    audience: B
    source_flow: 안내_2024 p.50 우수답안 및 해설 (3) 풀이
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\overline{\mathrm{QR}}=7$이므로 $(a_2-a_1)^2+(b_2-b_1)^2=49=\overline{\mathrm{QR}}^2$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        문항 (2)로부터 $\lvert a_2-a_1\rvert=1$이므로 $\lvert b_2-b_1\rvert=\sqrt{48}$이다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        기울기는 $\dfrac{b_2-b_1}{a_2-a_1}$이므로 구하는 직선의 기울기는 $4\sqrt3$ 또는 $-4\sqrt3$이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $\overline{\mathrm{QR}}^2=(a_2-a_1)^2+(b_2-b_1)^2=49$를 세우고 (2)의 $\lvert a_2-a_1\rvert=1$을 대입했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: ['2.R1'], max_points: 4}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $\lvert b_2-b_1\rvert=\sqrt{48}=4\sqrt3$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: |
        기울기 $\dfrac{b_2-b_1}{a_2-a_1}$로부터 $4\sqrt3$과 $-4\sqrt3$을 모두 답했다.
      depends_on: [3.M1, 3.A1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-GEO-9303}
  misconceptions:
  - id: MC-GEO-9303
    outcome_code: '73'
    wrong_work: '기울기 $4\sqrt3$만 답함'
    detect_cue: 음의 기울기 $-4\sqrt3$이 빠졌다
    feedback: $\lvert b_2-b_1\rvert$만 정해지므로 $y$축 대칭인 접선(기울기 $-4\sqrt3$)도 조건을 만족합니다.
    remedy: [RL-4]

- id: '4'
  stem: |
    자연수 $k$에 대하여 점 $\mathrm{P}\left(k,k^2+\dfrac14\right)$에서 $y=x^2+\dfrac14$에 대한 접선의 기울기를 $m_k$라고 하고 접선과 $y=x^2$으로 둘러싸인 도형의 넓이를 $A_k$라고 하자. 이때 $\displaystyle\sum_{k=2}^{\infty}\dfrac{1}{(m_k^2-24A_k)}$의 값을 구하시오.
  points: 9
  depends_on: ['1']
  answer: {kind: value, value: '3/16', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $m_k=2k$, $A_k=\frac16$(상수)이므로 일반항은 $\frac1{4(k^2-1)}$이고 부분분수로 망원합을 만든다.
    steps:
    - {id: 4a, content: '$\frac14\sum_{k=2}^\infty\frac12\left(\frac1{k-1}-\frac1{k+1}\right)=\frac14\cdot\frac12\left(1+\frac12\right)=\frac3{16}$', criteria: [4.M1, 4.A1, 4.M2, 4.A2]}
    hint_ladder:
    - (1)의 넓이와 비교해 보자. $A_k$는 $k$에 따라 변하는가?
    - $\frac1{k^2-1}$을 두 분수의 차로 나타내 보자.
  - id: S4-B
    audience: B
    source_flow: 안내_2024 p.50~51 우수답안 및 해설 (4) 풀이
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        점 $\mathrm{P}\left(k,k^2+\dfrac14\right)$에서 $y=x^2+\dfrac14$에 대한 접선은 기울기가 $2k$인 직선이므로 $y=2k(x-k)+k^2+\dfrac14$이다. 이 직선과 $y=x^2$의 교점은 $x^2=2k(x-k)+k^2+\dfrac14$의 해 $x=k\pm\dfrac12$이므로 $\left(k-\dfrac12,\left(k-\dfrac12\right)^2\right)$, $\left(k+\dfrac12,\left(k+\dfrac12\right)^2\right)$이다.
      criteria: [4.M1]
    - id: 4b-2
      content: |
        $$A_k=\int_{k-\frac12}^{k+\frac12}\left\{2kx-k^2+\dfrac14-x^2\right\}dx=k\left\{\left(k+\tfrac12\right)^2-\left(k-\tfrac12\right)^2\right\}+\left(-k^2+\tfrac14\right)\cdot1-\dfrac13\left\{\left(k+\tfrac12\right)^3-\left(k-\tfrac12\right)^3\right\}=\dfrac16$$
        이므로 $k$에 관계없이 일정하다. 따라서 $m_k=2k$이고 $A_k=\dfrac16$이므로 $\displaystyle\sum_{k=2}^{\infty}\dfrac1{m_k^2-24A_k}=\sum_{k=2}^{\infty}\dfrac1{4k^2-4}=\dfrac14\sum_{k=2}^{\infty}\dfrac1{k^2-1}$이다.
      criteria: [4.A1]
    - id: 4b-3
      content: |
        급수 $\displaystyle\sum_{k=2}^{\infty}\dfrac1{k^2-1}$의 제 2항부터 제 $k$항까지의 부분합을 $S_k$라고 하면 $\dfrac1{k^2-1}=\dfrac12\left(\dfrac1{k-1}-\dfrac1{k+1}\right)$이므로
        $$S_k=\dfrac12\left\{\left(\dfrac11-\dfrac13\right)+\left(\dfrac12-\dfrac14\right)+\cdots+\left(\dfrac1{k-1}-\dfrac1{k+1}\right)\right\}=\dfrac12\left(1+\dfrac12-\dfrac1k-\dfrac1{k+1}\right)$$
      criteria: [4.M2]
    - id: 4b-4
      content: |
        $\displaystyle\lim_{k\to\infty}S_k=\dfrac34$이다. 따라서 $\displaystyle\sum_{k=2}^{\infty}\dfrac1{m_k^2-24A_k}=\dfrac14\cdot\dfrac34=\dfrac3{16}$이다.
      criteria: [4.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: |
        접선 $y=2k(x-k)+k^2+\dfrac14$(기울기 $m_k=2k$)과 교점 $x=k\pm\dfrac12$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [4b-1]
    - id: 4.A1
      mark_type: A
      points: 3
      evidence: |
        $A_k=\dfrac16$을 구해 일반항을 $\dfrac1{4k^2-4}$로 정리했다.
      depends_on: [4.M1]
      steps: [4b-2]
    - id: 4.M2
      mark_type: M
      points: 2
      evidence: |
        부분분수 $\dfrac1{k^2-1}=\dfrac12\left(\dfrac1{k-1}-\dfrac1{k+1}\right)$로 부분합 $S_k$를 정리했다.
      depends_on: []
      implied_ok: false
      steps: [4b-3]
    - id: 4.A2
      mark_type: A
      points: 1
      evidence: |
        $\lim S_k=\dfrac34$에서 합 $\dfrac3{16}$을 얻었다.
      depends_on: [4.A1, 4.M2]
      steps: [4b-4]
    deductions: []
