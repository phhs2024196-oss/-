stimuli: []

stem: |
  좌표평면의 원 $x^2+y^2=1$에 대하여 다음 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    중심이 $y$축에 있고 원 $x^2+y^2=1$과 한 점에서 만나며 직선 $y=2x$에 접하는 원의 방정식을 모두 구하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: 'x**2+(y-(5+sqrt(5))/4)**2=((1+sqrt(5))/4)**2; x**2+(y+(5+sqrt(5))/4)**2=((1+sqrt(5))/4)**2; x**2+(y-(5-sqrt(5))/4)**2=((-1+sqrt(5))/4)**2; x**2+(y+(5-sqrt(5))/4)**2=((-1+sqrt(5))/4)**2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 중심 $(0,a)$가 단위원 밖이면 반지름 $\lvert a\rvert-1$, 안이면 $1-\lvert a\rvert$. 각각 $\frac{\lvert a\rvert}{\sqrt5}$와 같게 놓는다.
    steps:
    - {id: 1a, content: '$\lvert a\rvert=\frac{5+\sqrt5}4$ (반지름 $\frac{1+\sqrt5}4$), $\lvert a\rvert=\frac{5-\sqrt5}4$ (반지름 $\frac{-1+\sqrt5}4$) → 원 4개', criteria: [1.M1, 1.M2, 1.A1, 1.A2]}
    hint_ladder:
    - 두 원이 한 점에서 만나는 방법은 몇 가지인가?
    - 원이 직선에 접할 조건을 점과 직선 사이의 거리로 쓰자.
  - id: S1-B
    audience: B
    source_flow: 안내_2024 p.56 우수답안 및 해설 (1) 풀이
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        구하는 원의 중심을 $(0,a)$라고 두면 이 점이 원 $x^2+y^2=1$의 밖에 있거나 안에 있을 수 있다. 원의 중심이 원의 밖에 있을 때 반지름의 길이는 $\lvert a\rvert-1$이고 원의 안에 있을 때 반지름의 길이가 $1-\lvert a\rvert$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        반지름의 길이가 $\lvert a\rvert-1$일 때 직선 $y-2x=0$과 점 $(0,a)$의 거리도 원의 반지름의 길이와 같으므로 $\dfrac{\lvert a-2\cdot0\rvert}{\sqrt{1^2+(-2)^2}}=\lvert a\rvert-1$이다. 이 식을 계산하면 $\lvert a\rvert=\dfrac{5+\sqrt5}{4}$이다.
      criteria: [1.M2, 1.A1]
    - id: 1b-3
      content: |
        반지름의 길이가 $1-\lvert a\rvert$일 때 직선 $y-2x=0$과 점 $(0,a)$의 거리도 원의 반지름의 길이와 같으므로 $\dfrac{\lvert a-2\cdot0\rvert}{\sqrt{1^2+(-2)^2}}=1-\lvert a\rvert$이다. 이 식을 계산하면 $\lvert a\rvert=\dfrac{5-\sqrt5}{4}$이다.
      criteria: [1.A2]
    - id: 1b-4
      content: |
        따라서 구하는 원의 방정식은 모두
        $$x^2+\left(y-\dfrac{5+\sqrt5}{4}\right)^2=\left(\dfrac{1+\sqrt5}{4}\right)^2,\quad x^2+\left(y+\dfrac{5+\sqrt5}{4}\right)^2=\left(\dfrac{1+\sqrt5}{4}\right)^2$$
        $$x^2+\left(y-\dfrac{5-\sqrt5}{4}\right)^2=\left(\dfrac{-1+\sqrt5}{4}\right)^2,\quad x^2+\left(y+\dfrac{5-\sqrt5}{4}\right)^2=\left(\dfrac{-1+\sqrt5}{4}\right)^2$$
        이다.
      criteria: [1.A1, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        중심이 단위원 밖(반지름 $\lvert a\rvert-1$)인 경우와 안(반지름 $1-\lvert a\rvert$)인 경우로 나누었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        점 $(0,a)$와 직선 $y-2x=0$ 사이의 거리 $\dfrac{\lvert a\rvert}{\sqrt5}$를 반지름과 같게 놓은 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        외접 경우 $\lvert a\rvert=\dfrac{5+\sqrt5}4$와 두 원의 방정식을 적었다.
      depends_on: [1.M2]
      steps: [1b-2, 1b-4]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        내접 경우 $\lvert a\rvert=\dfrac{5-\sqrt5}4$와 두 원의 방정식을 적었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3, 1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9311}
  - {code: '72', misconception: MC-GEO-9310}
  misconceptions:
  - id: MC-GEO-9311
    outcome_code: '71'
    wrong_work: '외접 경우의 원 2개만 답함'
    detect_cue: 반지름 $\frac{-1+\sqrt5}4$인 원이 없다
    feedback: '"한 점에서 만난다"에는 안에서 접하는 경우도 포함됩니다. 중심이 단위원 안에 있으면 반지름은 $1-\lvert a\rvert$입니다.'
    remedy: [RL-1]
  - id: MC-GEO-9310
    outcome_code: '72'
    wrong_work: '외접 반지름을 $\lvert a\rvert+1$로 둠'
    detect_cue: 반지름 식이 $\lvert a\rvert+1$
    feedback: 밖에서 접하면 (중심 거리) $=$ (반지름의 합)이므로 $r=\lvert a\rvert-1$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    문항 (1)에서 구한 원은 모두 직선 $y=-2x$에 접함을 보이시오.
  points: 10
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 각 중심 $(0,a)$에서 $y+2x=0$까지의 거리 $\frac{\lvert a\rvert}{\sqrt5}$는 $y=2x$까지의 거리와 같으므로 반지름과 같다(또는 $y$축 대칭).
    steps:
    - {id: 2a, content: '$\lvert a\rvert=\frac{5\pm\sqrt5}4$이면 거리 $\frac{\sqrt5\pm1}4=$ 반지름', criteria: [2.M1, 2.A1, 2.A2]}
    hint_ladder:
    - 두 직선 $y=2x$, $y=-2x$는 어떤 축에 대해 대칭인가?
  - id: S2-B
    audience: B
    source_flow: 안내_2024 p.56~57 우수답안 및 해설 (2) 풀이
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문항 (1)에서 구한 원의 중심과 직선 $y+2x=0$의 거리가 원의 반지름의 길이와 같으면 원이 직선 $y+2x=0$에 접한다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        중심 $\left(0,\pm\dfrac{5+\sqrt5}{4}\right)$와 직선 $y+2x=0$의 거리는 $\dfrac{\left\lvert\pm\frac{5+\sqrt5}{4}+2\cdot0\right\rvert}{\sqrt{1^2+2^2}}=\dfrac{\sqrt5+1}{4}$이다. 이 거리는 반지름의 길이 $\dfrac{1+\sqrt5}{4}$와 같으므로 두 원과 직선이 접한다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        중심 $\left(0,\pm\dfrac{5-\sqrt5}{4}\right)$와 직선 $y+2x=0$의 거리도 $\dfrac{\left\lvert\pm\frac{5-\sqrt5}{4}+2\cdot0\right\rvert}{\sqrt{1^2+2^2}}=\dfrac{\sqrt5-1}{4}$이다. 이 거리 또한 반지름의 길이 $\dfrac{-1+\sqrt5}{4}$와 같으므로 원과 직선이 접한다. ■
      criteria: [2.A2]
  - id: S2-ALT
    audience: ALT
    source_flow: 안내_2024 p.57 (2) 별해
    method_no: 2
    key_idea: 원들은 $y$축에 대하여 대칭이고 $y=2x$를 $y$축 대칭이동하면 $y=-2x$이다.
    steps:
    - id: 2c-1
      content: |
        문항 (1)에서 구한 원은 모두 중심이 $y$축에 있으므로 $y$축에 대하여 대칭이다. 직선 $y=2x$를 $y$축에 대하여 대칭이동하면 직선 $y=-2x$이다. 문항 (1)에서 구한 원이 각각 직선 $y=2x$와 한 점에서 만나므로 $y$축에 대하여 대칭이동한 직선 $y=-2x$와 각각 한 점에서 만난다. 따라서 문항 (1)에서 구한 원은 모두 직선 $y=-2x$에 접한다.
      criteria: [2.M1, 2.A1, 2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        접할 조건(중심과 직선 $y+2x=0$의 거리 $=$ 반지름)을 쓰거나 $y$축 대칭 논증을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: ['1.A1', '1.A2'], max_points: 4}
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        반지름 $\frac{1+\sqrt5}4$인 두 원에 대해 거리가 반지름과 같음을 계산했다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        반지름 $\frac{-1+\sqrt5}4$인 두 원에 대해서도 확인했다(또는 대칭으로 네 원 모두에 대해 결론).
      depends_on: [2.M1]
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-GEO-9312}
  misconceptions:
  - id: MC-GEO-9312
    outcome_code: '72'
    wrong_work: '거리를 $\frac{\lvert a\rvert}{2}$ 등으로 계산해 반지름과 다르다고 결론'
    detect_cue: 거리 계산의 분모가 $\sqrt5$가 아니다
    feedback: 직선 $2x+y=0$에서 분모는 $\sqrt{2^2+1^2}=\sqrt5$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    중심이 $x$축 또는 $y$축에 있고 원 $x^2+y^2=1$과 한 점에서 만나며 직선 $y=2x$에 접하는 모든 원에 대하여 반지름의 길이의 최댓값과 최솟값의 합을 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '(15+9*sqrt(5))/4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $x$축 위 중심 $(b,0)$은 외접 $\lvert b\rvert=5+2\sqrt5$(반지름 $4+2\sqrt5$), 내접 $\lvert b\rvert=5-2\sqrt5$(반지름 $-4+2\sqrt5$). 네 반지름 중 최대 $4+2\sqrt5$, 최소 $\frac{-1+\sqrt5}4$.
    steps:
    - {id: 3a, content: '$(4+2\sqrt5)+\frac{-1+\sqrt5}4=\frac{15+9\sqrt5}4$', criteria: [3.M1, 3.A1, 3.M2, 3.A2]}
    hint_ladder:
    - $x$축 위 중심도 외접·내접 두 경우로 나누자.
    - 반지름 네 값을 크기순으로 늘어놓자.
  - id: S3-B
    audience: B
    source_flow: 안내_2024 p.57 우수답안 및 해설 (3) 풀이
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        원의 중심이 $y$축에 있는 경우 원의 반지름은 문항 (1)에서 모두 구하여 $\dfrac{1+\sqrt5}{4}$, $\dfrac{-1+\sqrt5}{4}$이다. 중심이 $x$축에 있는 원의 중심을 $(b,0)$이라고 하자. 이 점이 원 $x^2+y^2=1$ 밖에 있으면 반지름의 길이는 $\lvert b\rvert-1$이고 원 안에 있으면 $1-\lvert b\rvert$이다. 직선 $y-2x=0$과 점 $(b,0)$의 거리도 반지름의 길이와 같으므로 $\dfrac{\lvert0-2\cdot b\rvert}{\sqrt{1^2+(-2)^2}}=\lvert b\rvert-1$ 또는 $1-\lvert b\rvert$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        밖에 있을 때 $\lvert b\rvert=5+2\sqrt5$이므로 반지름의 길이는 $4+2\sqrt5$이다. 마찬가지로 안에 있을 때 $\lvert b\rvert=5-2\sqrt5$이므로 반지름의 길이는 $-4+2\sqrt5$이다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
