intent: |
  본 문제는 좌표평면의 원과 직선의 관계로 주어진 문제를 이해하고, 주어진 조건에 대한 수리적 추론을 바탕으로 풀이를 기획하고 수행할 수 있는 수리적 문제 해결 능력을 평가하는 문제이다. 이 과정에서 직선과 점의 거리, 원과 직선의 위치 관계, 실수의 성질에 관한 수리 개념의 이해와 종합적 활용 능력, 그리고 문제 해결에 필요한 수리적 정보 수집을 위한 효율적 계산의 설계와 수행에 관한 계산 능력의 수월성을 평가한다. (출제의도 원문, 안내_2024 p.55)
key_idea: |
  단위원과 한 점에서 만나는 경우를 중심이 단위원 밖(외접, 반지름 $=\lvert a\rvert-1$)과 안(내접, 반지름 $=1-\lvert a\rvert$)으로 나누고, 각각 중심과 직선 $y=2x$ 사이의 거리를 반지름과 같게 놓는다.
stuck: |
  "한 점에서 만난다"를 외접과 내접 두 경우로 분류하는 것. 내접 경우를 빠뜨리면 (1)의 원 2개와 (3)의 최솟값을 놓친다.
idea_tags: [IDEA-TANGENT-CIRCLE-DISTANCE-EQUATION, IDEA-INTERNAL-EXTERNAL-CASES]
tags: [원과 직선, 점과 직선 사이의 거리, 두 원의 위치 관계, 경우 분류]
