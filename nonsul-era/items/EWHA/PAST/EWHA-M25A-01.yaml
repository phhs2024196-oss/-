intent: |
  두 곡선으로 둘러싸인 도형의 넓이를 정적분으로 구하고, 그 도형과 직선이 만나는 선분의 길이를 매개변수의 함수로 세운 뒤 정의 구간을 나누어 미분법으로 최댓값을 구하는 능력을 본다(공식 출제의도 요지: 이차함수의 최대·최소, 두 곡선의 교점, 함수와 정의 구간 설정, 미분법을 활용한 최댓값).
key_idea: |
  수평선 $y=t$는 $t=\tfrac92$를 경계로 왼쪽 끝이 곡선 $y=\tfrac12x^2$에서 $y=-x^2+\tfrac92x$로 바뀌고, 직선 $y=mx$는 $m=\tfrac32$(교점 $(3,\tfrac92)$ 통과)를 경계로 다른 끝점이 바뀐다. 구간별로 길이 함수를 세워 최대를 비교한다.
stuck: |
  선분의 양 끝이 어느 곡선 위에 있는지가 $t=\tfrac92$, $m=\tfrac32$에서 바뀐다는 점을 찾아 경우를 나누는 것, 그리고 $(3)$에서 길이를 $\{g(m)\}^2$로 바꿔 미분하는 것
