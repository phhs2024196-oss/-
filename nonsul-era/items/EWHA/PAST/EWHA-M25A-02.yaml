intent: |
  $m^2+n^2=2025$의 자연수 해를 원 $x^2+y^2=45^2$ 위의 자연수 격자점에 대응시키고, 이 격자점들이 점 $\mathrm{P}(-45,0)$을 지나고 기울기가 유리수인 직선과 원의 교점과 같음을 추론한 뒤, 직선과 원의 방정식으로 교점을 구체적으로 특정하는 능력을 본다(공식 출제의도 요지).
key_idea: |
  $\mathrm{P}(-45,0)$을 지나는 기울기 $\tfrac pq$인 직선과 원의 다른 교점은 $\left(\tfrac{45(q^2-p^2)}{p^2+q^2},\tfrac{90pq}{p^2+q^2}\right)$이고, $\gcd(pq,p^2+q^2)=1$이므로 $p^2+q^2\mid90$이다.
stuck: |
  원 위의 격자점을 '고정점을 지나는 유리 기울기 직선'으로 매개화하는 발상, 그리고 서로소 조건에서 $p^2+q^2$이 $90$의 약수임을 끌어내는 것
idea_tags: [IDEA-RATIONAL-PARAM-CIRCLE, IDEA-COPRIME-DIVISOR-BOUND]
tags: [피타고라스 수, 원 위의 격자점, 유리 매개화]
