stimuli: []

stem: |
  정의역이 양의 실수 집합인 함수 $f(x)$에 대하여 $f(ab)=f(a)+f(b)$ (단, $a>0,b>0$)를 만족시킨다고 할 때, 아래 물음에 답하시오. [35점]

subparts:
- id: '1'
  stem: |
    두 양의 실수 $a$와 $b$에 대하여 $f\left(\dfrac ab\right)=f(a)-f(b)$이 성립함을 보이고, $f(1)$의 값을 구하시오.
  points: 6
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a=b=1$ 대입, $a=b\cdot\tfrac ab$로 분해.
    steps:
    - {id: 1a, content: '$f(1)=2f(1)\Rightarrow f(1)=0$; $f(a)=f(b)+f\left(\tfrac ab\right)$', criteria: ['1.B1', '1.R1']}
    hint_ladder:
    - $a=b=1$을 넣어 보자.
    - $a$를 $b$와 $\tfrac ab$의 곱으로 보자.
  - id: S1-B
    audience: B
    source_flow: 「2025 논술고사 안내」 우수답안 및 해설 p.50
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(1)=f(1\cdot1)=f(1)+f(1)$이므로 $f(1)=0$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $f(a)=f\left(b\cdot\dfrac ab\right)=f(b)+f\left(\dfrac ab\right)$이므로 $f\left(\dfrac ab\right)=f(a)-f(b)$가 성립한다. ■
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: |
        $f(1)=f(1)+f(1)$에서 $f(1)=0$을 구했다.
      depends_on: []
      steps: [1b-1, 1a]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $f(a)=f\left(b\cdot\tfrac ab\right)=f(b)+f\left(\tfrac ab\right)$로 나눗셈 성질을 보였다.
      depends_on: []
      steps: [1b-2, 1a]
    deductions:
    - code: D1-1
      condition: $f(x)=\log x$ 등 특정 함수를 가정하고 성질을 확인함
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRF-9406}
  misconceptions:
  - id: MC-PRF-9406
    outcome_code: '71'
    wrong_work: '「$f(x)=\log x$이므로 $f\left(\tfrac ab\right)=\log a-\log b$, $f(1)=0$」'
    detect_cue: 주어진 함수방정식 대신 특정 함수(로그·지수)를 대입해 확인했다
    feedback: 조건을 만족하는 함수가 로그함수 하나라는 보장은 없습니다. 주어진 식 $f(ab)=f(a)+f(b)$에 값을 대입해서만 성질을 끌어내세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    임의의 양의 실수 $x$와 임의의 자연수 $n$에 대하여 $f(x^n)=nf(x)$와 $f\left(x^{\frac1n}\right)=\dfrac1nf(x)$이 성립함을 보이시오.
  points: 7
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x^{k+1})=f(x^k)+f(x)$로 귀납, $t=x^{1/n}$이면 $f(x)=f(t^n)=nf(t)$.
    steps:
    - {id: 2a, content: '귀납법으로 $f(x^n)=nf(x)$; $t=x^{1/n}$ 치환', criteria: ['2.R1', '2.R2']}
    hint_ladder:
    - $f(x^2)$부터 계산해 보자.
    - $x^{1/n}$을 새 문자로 두면 앞의 결과를 쓸 수 있다.
  - id: S2-B
    audience: B
    source_flow: 「2025 논술고사 안내」 우수답안 및 해설 p.50
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        임의의 양의 실수 $x$에 대하여 $f(x^2)=f(x\cdot x)=f(x)+f(x)=2f(x)$이다. 같은 방식으로 $f(x^k)=kf(x)$이면 $f(x^{k+1})=f(x^k\cdot x)=f(x^k)+f(x)=(k+1)f(x)$이므로, 수학적 귀납법에 의하여 임의의 자연수 $n$에 대하여 $f(x^n)=nf(x)$가 성립한다.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        임의의 자연수 $n$에 대하여 $x^{\frac1n}=t$라 하면 $t^n=x$이므로 $f(x)=f(t^n)=nf(t)=nf\left(x^{\frac1n}\right)$이다. 따라서 $f\left(x^{\frac1n}\right)=\dfrac1nf(x)$가 성립한다. ■
      criteria: ['2.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: |
        $f(x^{k+1})=f(x^k)+f(x)$를 이용한 수학적 귀납법(또는 반복 적용의 명시)으로 $f(x^n)=nf(x)$를 보였다.
      depends_on: []
      steps: [2b-1, 2a]
    - id: 2.R2
      mark_type: R
      points: 3
      evidence: |
        $t=x^{1/n}$로 두고 앞 결과를 적용해 $f\left(x^{1/n}\right)=\tfrac1nf(x)$를 보였다.
      depends_on: [2.R1]
      steps: [2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-PRF-9407}
  misconceptions:
  - id: MC-PRF-9407
    outcome_code: '72'
    wrong_work: '$f(x^n)=f(x)+f(x)+\cdots+f(x)=nf(x)$ 한 줄로 끝내고 $f(x^{1/n})$은 「같은 방법으로」라고만 씀'
    detect_cue: 귀납 단계($k\to k+1$)나 $t=x^{1/n}$ 치환이 없다
    feedback: 자연수 전체에 대한 명제는 수학적 귀납법으로 마무리하고, $\tfrac1n$ 거듭제곱은 $t=x^{1/n}$으로 앞 결과에 맞추어 보이세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    임의의 양의 실수 $x$와 임의의 유리수 $q$에 대하여 $f(x^q)=qf(x)$이 성립함을 보이시오.
  points: 7
  depends_on: ['1', '2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $q=0$, $q=\tfrac nm>0$, $q=-\tfrac nm<0$으로 나누어 $(1)$·$(2)$를 조합.
    steps:
    - {id: 3a, content: '$f(x^{n/m})=nf(x^{1/m})=\tfrac nmf(x)$, 음수는 $f(1/y)=-f(y)$', criteria: ['3.M1', '3.R1', '3.R2']}
    hint_ladder:
    - 유리수 $q$를 부호에 따라 나누어 보자.
    - $x^{n/m}=\left(x^{1/m}\right)^n$이다.
  - id: S3-B
    audience: B
    source_flow: 「2025 논술고사 안내」 우수답안 및 해설 p.50
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $q=0$이면 $x$가 양수이므로 $x^q=1$이어서 $f(x^0)=f(1)=0=0\cdot f(x)$가 성립한다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $q$가 양의 유리수이면 적당한 자연수 $n,m$이 존재하여 $q=\dfrac nm$이고 $x^q=x^{\frac nm}=\left(x^{\frac1m}\right)^n$이다. $(2)$에 의하여
        $$f(x^q)=f\left(\left(x^{\frac1m}\right)^n\right)=nf\left(x^{\frac1m}\right)=\frac nmf(x)=q\cdot f(x)$$
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        $q$가 음의 유리수이면 적당한 자연수 $n,m$이 존재하여 $q=-\dfrac nm$이고 $x^q=\dfrac{1}{x^{\frac nm}}$이다. $(1)$과 양의 유리수의 경우에 의하여
        $$f(x^q)=f\left(\frac{1}{x^{\frac nm}}\right)=-f\left(x^{\frac nm}\right)=-\frac nmf(x)=qf(x)$$
        가 성립한다. ■
      criteria: ['3.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $q=0$, 양, 음으로 경우를 나누고 $q=0$에서 $f(1)=0$으로 성립을 보였다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3a]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        $q=\tfrac nm$에 대해 $x^{n/m}=\left(x^{1/m}\right)^n$과 $(2)$의 두 식을 차례로 적용했다.
      depends_on: []
      steps: [3b-2, 3a]
    - id: 3.R2
      mark_type: R
      points: 2
      evidence: |
        $q<0$에서 $(1)$의 $f\left(\tfrac1y\right)=-f(y)$(즉 $f(1)-f(y)$)와 양수 경우를 결합했다.
      depends_on: [3.R1]
      steps: [3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-PRF-9408}
  misconceptions:
  - id: MC-PRF-9408
    outcome_code: '73'
    wrong_work: '$q=\tfrac nm$($n,m$ 자연수)인 경우만 보이고 끝냄'
    detect_cue: $q=0$이나 음의 유리수에 대한 서술이 없다
    feedback: 「임의의 유리수」에는 $0$과 음수도 포함됩니다. $f(1)=0$과 $f\left(\tfrac1y\right)=-f(y)$로 나머지 경우를 처리하세요.
    remedy: [RL-3]

- id: '4'
  stem: |
    함수 $f(x)$가 $x=1$에서 연속이면 함수 $f(x)$가 양의 실수 집합에서 연속임을 보이시오.
  points: 7
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $f(t)-f(a)=f\left(\tfrac ta\right)-f(1)$이고 $t\to a\iff\tfrac ta\to1$.
    steps:
    - {id: 4a, content: '$\lim_{t\to a}\{f(t)-f(a)\}=\lim_{x\to1}\{f(x)-f(1)\}=0$', criteria: ['4.M1', '4.R1']}
    hint_ladder:
    - 임의의 점 $a$에서의 차 $f(t)-f(a)$를 $(1)$의 성질로 바꿔 보자.
  - id: S4-B
    audience: B
    source_flow: 「2025 논술고사 안내」 우수답안 및 해설 p.51
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $f$가 $x=1$에서 연속이므로 $\displaystyle\lim_{x\to1}f(x)=f(1)$이다. 양의 실수 집합에서 연속임을 보이려면 임의의 $1$이 아닌 양의 실수 $a$에 대하여 $\displaystyle\lim_{t\to a}f(t)=f(a)$, 즉 $\displaystyle\lim_{t\to a}\{f(t)-f(a)\}=0$임을 보이면 된다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        $f(t)=f\left(\dfrac ta\cdot a\right)=f\left(\dfrac ta\right)+f(a)$이므로 $f(1)=0$에 의하여 $f(t)-f(a)=f\left(\dfrac ta\right)=f\left(\dfrac ta\right)-f(1)$이다.
      criteria: ['4.M1']
    - id: 4b-3
      content: |
        $a$가 양의 실수이므로 $t\to a$이기 위한 필요충분조건은 $\dfrac ta\to1$이고, $\dfrac ta=x$로 나타내면
        $$\lim_{t\to a}\{f(t)-f(a)\}=\lim_{\frac ta\to1}\left\{f\left(\frac ta\right)-f(1)\right\}=\lim_{x\to1}\{f(x)-f(1)\}=0$$
        이 성립한다. 따라서 $f$는 양의 실수 집합에서 연속이다. ■
      criteria: ['4.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: |
        $f(t)-f(a)=f\left(\tfrac ta\right)-f(1)$을 함수방정식과 $f(1)=0$으로 유도했다.
      depends_on: []
      implied_ok: false
      steps: [4b-1, 4b-2, 4a]
    - id: 4.R1
      mark_type: R
      points: 4
      evidence: |
        $t\to a\iff\tfrac ta\to1$을 밝히고 $x=1$에서의 연속성으로 $\lim_{t\to a}f(t)=f(a)$를 결론지었다.
      depends_on: [4.M1]
      steps: [4b-3, 4a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '74', misconception: MC-ALG-9409}
  misconceptions:
  - id: MC-ALG-9409
    outcome_code: '74'
    wrong_work: '$f(t)-f(a)=f(t-a)$로 놓고 $t-a\to0$을 씀'
    detect_cue: 곱의 꼴 함수방정식인데 차 $t-a$가 함수 안에 들어갔다
    feedback: $f(ab)=f(a)+f(b)$는 곱을 합으로 바꾸므로 차는 몫 $f\left(\tfrac ta\right)$로 나타납니다. 함수방정식의 꼴을 정확히 쓰세요.
    remedy: [RL-4]

- id: '5'
  stem: |
    함수 $f(x)$가 $x=1$에서 미분가능하면 임의의 양의 실수 $x$에 대하여 $f'(x)=\dfrac{f'(1)}{x}$이 성립함을 보이시오.
  points: 8
  depends_on: ['1']
