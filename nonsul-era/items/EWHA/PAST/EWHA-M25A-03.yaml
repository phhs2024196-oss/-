intent: |
  함수방정식 $f(ab)=f(a)+f(b)$를 만족하는 함수가 가지는 대수적 성질(나눗셈, 자연수·유리수 거듭제곱)을 단계적으로 유도하고, 이로부터 한 점에서의 연속성·미분가능성이 정의역 전체로 퍼짐을 추론하는 능력을 본다. 함수의 구체적 형태 없이 주어진 조건만으로 성질을 수학적으로 추론하는지 평가한다(공식 출제의도 요지).
key_idea: |
  $f(1)=0$과 $f\left(\tfrac ab\right)=f(a)-f(b)$를 이용해 임의의 점 $a$에서의 증분 $f(t)-f(a)$를 $x=1$ 근처의 증분 $f\left(\tfrac ta\right)-f(1)$로 옮긴다.
stuck: |
  $(4)$에서 $f(t)-f(a)=f\left(\tfrac ta\right)-f(1)$로 바꾸고 $t\to a\iff\tfrac ta\to1$을 쓰는 것, $(5)$에서 $x+h=x\left(1+\tfrac hx\right)$로 분해하는 것
