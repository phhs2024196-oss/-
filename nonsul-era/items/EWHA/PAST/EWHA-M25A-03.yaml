    steps:
    - id: 5b-1
      content: |
        $f$가 $1$에서 미분가능하므로 $\displaystyle\lim_{h\to0}\frac{f(1+h)-f(1)}{h}=\lim_{h\to0}\frac{f(1+h)}{h}=f'(1)$이 존재한다.
      criteria: ['5.M1']
    - id: 5b-2
      content: |
        임의의 양의 실수 $x$에 대하여 $x+h=x\left(1+\dfrac hx\right)$이고 $h$가 $0$으로 수렴하면 $\dfrac hx$도 $0$으로 수렴한다. 따라서
        $$\lim_{h\to0}\frac{f(x+h)-f(x)}{h}=\lim_{h\to0}\frac{f(x)+f\left(1+\frac hx\right)-f(x)}{h}=\lim_{h\to0}\frac{f\left(1+\frac hx\right)}{h}=\lim_{h\to0}\frac{f\left(1+\frac hx\right)}{\frac hx}\cdot\frac1x=\frac{f'(1)}{x}$$
      criteria: ['5.R1']
    - id: 5b-3
      content: |
        극한이 존재하므로 $f$는 $x$에서 미분가능하고 $f'(x)=\dfrac{f'(1)}{x}$이 성립한다. ■
      criteria: ['5.A1']
