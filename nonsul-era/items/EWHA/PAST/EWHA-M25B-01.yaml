intent: |
  정적분과 급수의 합 사이의 관계를 바탕으로 두 곡선으로 둘러싸인 도형의 넓이를 구한다. 이차함수의 성질과 조건으로 교점을 찾고, 닫힌구간에서 연속함수의 성질·두 곡선 사이 넓이의 정적분 표현·정적분의 성질로 두 함수의 대소를 논리적으로 밝히며, $y$축 대칭 함수의 정적분 성질을 적용하는지 평가한다(공식 출제의도 요지).
key_idea: |
  (라)는 $\int_0^2\{f(x)+g(x)\}dx=-6$이고, 교점이 $x=\pm2$뿐이므로 $f-g$는 $(-2,2)$에서 부호가 일정하다. $\int_0^2(f-g)dx=\tfrac23>0$으로 부호를 결정한다.
stuck: |
  $f$를 모르는 채로 $f-g$의 부호를 교점이 두 개뿐이라는 조건(사잇값 정리)과 적분값의 부호로 결정하는 것
