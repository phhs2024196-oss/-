stimuli:
- label: 조건
  body: |
    (가) 함수 $f(x)$의 치역은 $(0,\infty)$이다.
    (나) 모든 실수 $a$에 대하여 함수 $f(x)$는 구간 $[a,\infty)$에서 최솟값을 갖는다.
    (다) 실수 $b,c$에 대하여 구간 $[b+c,\infty)$에서 함수 $f(x)$의 최솟값은 $f(b)f(c)$이다.

stem: |
  실수 전체의 집합에서 정의된 함수 $f(x)$가 다음 조건을 만족시킬 때, 아래 물음에 답하시오. [40점]

subparts:
- id: '1'
  stem: |
    임의의 실수 $x$와 임의의 자연수 $n$에 대하여, $f(nx)=\{f(x)\}^n$과 $f\left(\dfrac xn\right)=\sqrt[n]{f(x)}$이 성립함을 보이시오.
  points: 12
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\{f(a)\}^2$, $\{f(b)\}^2$은 각각 $[2a,\infty)$, $[2b,\infty)$의 최솟값이므로 $a\le b\Rightarrow f(a)\le f(b)$; 증가이므로 $[nx,\infty)$의 최솟값은 $f(nx)$.'
    steps:
    - {id: 1a, content: '증가성 $\Rightarrow f(nx)=\{f(x)\}^n$, $x=na$ 치환으로 $n$제곱근', criteria: ['1.M1', '1.R1', '1.R2', '1.R3']}
    hint_ladder:
    - (다)에서 $b=c$로 두면 무엇이 최솟값인가?
    - $a\le b$이면 $[2b,\infty)$와 $[2a,\infty)$의 포함 관계는?
  - id: S1-B
    audience: B
    source_flow: 「2025 논술고사 안내」 우수답안 및 해설 p.55
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (다)와 수학적 귀납법에 의하여 임의의 실수 $x$와 자연수 $n$에 대하여 $f(x)^n$의 값은 구간 $[nx,\infty)$에서 함수 $f$의 최솟값이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $a\le b$에 대하여 $f(a)\cdot f(a)=f(a)^2$은 구간 $[2a,\infty)$에서 $f$의 최솟값이고 $f(b)^2$은 구간 $[2b,\infty)$에서 $f$의 최솟값이다. $[2b,\infty)\subseteq[2a,\infty)$이므로 $[2b,\infty)$에서의 최솟값은 $[2a,\infty)$에서의 최솟값보다 같거나 크다. 따라서 $f(a)^2\le f(b)^2$이고, $f$의 치역이 양의 실수 집합이므로 $f(a)\le f(b)$, 즉 $f$는 증가함수이다.
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        따라서 구간 $[nx,\infty)$에서 함수 $f$의 최솟값은 $f(nx)$이고, $f(nx)=\{f(x)\}^n$이 성립한다.
      criteria: ['1.R2']
    - id: 1b-4
      content: |
        $\dfrac xn=a$라 하면 $x=na$이고 $f(x)=f(na)=f(a)^n$이다. $f$의 치역이 양의 실수 집합이므로 $f\left(\dfrac xn\right)=f(a)=\sqrt[n]{f(x)}$가 성립한다.
      criteria: ['1.R3']
    - id: 1b-5
      content: |
        (다음 문항을 위한 정리) $f(0)\cdot f(0)=f(0)^2$은 $[0,\infty)$에서 $f$의 최솟값이고 $f$는 증가함수이므로 $f(0)^2=f(0)$, 치역이 양수이므로 $f(0)=1$이다. 따라서 $f(x)\cdot f(-x)$는 $[0,\infty)$에서의 최솟값 $f(0)=1$과 같고 $f(-x)=\dfrac{1}{f(x)}$이 성립한다. ■
      criteria: ['1.R3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        (다)를 반복 적용(귀납)하여 $\{f(x)\}^n$이 $[nx,\infty)$에서의 최솟값임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        구간 포함 관계와 $f>0$을 근거로 $f$가 증가함수임을 보였다.
      depends_on: []
      steps: [1b-2, 1a]
    - id: 1.R2
      mark_type: R
      points: 2
      evidence: |
        증가성으로 $[nx,\infty)$의 최솟값이 $f(nx)$임을 밝혀 $f(nx)=\{f(x)\}^n$을 결론지었다.
      depends_on: [1.M1, 1.R1]
      steps: [1b-3, 1a]
    - id: 1.R3
      mark_type: R
      points: 3
      evidence: |
        $x=na$로 두고 $f>0$을 근거로 $f\left(\tfrac xn\right)=\sqrt[n]{f(x)}$를 보였다.
      depends_on: [1.R2]
      steps: [1b-4, 1b-5, 1a]
    deductions:
    - code: D1-1
      condition: 증가성을 보이지 않고 $[b+c,\infty)$의 최솟값을 $f(b+c)$로 놓음
      effect: cap
      value: 6
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRF-9415}
  misconceptions:
  - id: MC-PRF-9415
    outcome_code: '71'
    wrong_work: '「$[b+c,\infty)$에서의 최솟값은 $f(b+c)$이므로 $f(b+c)=f(b)f(c)$」로 출발'
    detect_cue: $f$가 증가함수라는 증명 없이 구간 왼쪽 끝값을 최솟값으로 썼다
    feedback: 구간의 최솟값이 왼쪽 끝 함숫값이 되려면 $f$가 증가함수여야 합니다. 그 사실부터 (다)로 증명하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    임의의 실수 $x$와 임의의 유리수 $q$에 대하여, $f(qx)=\{f(x)\}^q$이 성립함을 보이시오.
  points: 10
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $q=0$은 $f(0)=1$, $q=\tfrac nm$은 $(1)$의 두 식, $q<0$은 $f(-y)=\tfrac{1}{f(y)}$.
    steps:
    - {id: 2a, content: '$f\left(n\cdot\tfrac xm\right)=\left\{f\left(\tfrac xm\right)\right\}^n=\{f(x)\}^{n/m}$', criteria: ['2.M1', '2.R1', '2.R2']}
    hint_ladder:
    - $f(0)$의 값은?
    - $f(x)f(-x)$는?
  - id: S2-B
    audience: B
    source_flow: 「2025 논술고사 안내」 우수답안 및 해설 p.55
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $q=0$이면 $f(qx)=f(0)=1$이고, 임의의 실수 $x$에 대하여 $f(x)>0$이므로 $\{f(x)\}^q=\{f(x)\}^0=1$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $q$가 양의 유리수이면 적당한 자연수 $n,m$이 존재하여 $q=\dfrac nm$이다. $(1)$에 의하여
        $$f(qx)=f\left(n\cdot\frac xm\right)=\left\{f\left(\frac xm\right)\right\}^n=\{f(x)\}^{\frac nm}=\{f(x)\}^q$$
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        $q$가 음의 유리수이면 적당한 자연수 $n,m$이 존재하여 $q=-\dfrac nm$이고 $qx=-\dfrac nmx$이다. $(1)$과 양의 유리수의 경우에 의하여
        $$f(qx)=f\left(-\frac nmx\right)=\frac{1}{f\left(\frac nmx\right)}=\frac{1}{\{f(x)\}^{\frac nm}}=\{f(x)\}^{-\frac nm}=\{f(x)\}^q$$
        이 성립한다. ■
      criteria: ['2.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $q=0$, 양, 음으로 경우를 나누고 $f(0)=1$로 $q=0$을 처리했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: |
        $q=\tfrac nm$에서 $(1)$의 두 식을 차례로 적용했다.
      depends_on: []
      steps: [2b-2, 2a]
    - id: 2.R2
      mark_type: R
      points: 3
      evidence: |
        $f(-y)=\tfrac{1}{f(y)}$(근거 포함)와 양수 경우를 결합해 음의 유리수 경우를 보였다.
      depends_on: [2.R1]
      steps: [2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-PRF-9416}
  misconceptions:
  - id: MC-PRF-9416
    outcome_code: '72'
    wrong_work: '$f(-x)=\tfrac{1}{f(x)}$을 근거 없이 쓰거나 $q<0$ 경우를 빠뜨림'
    detect_cue: $f(0)=1$과 $f(x)f(-x)=1$의 유도가 없다
    feedback: 음의 유리수를 다루려면 $f(0)=1$과 $f(-x)=\tfrac{1}{f(x)}$을 조건 (다)로 먼저 보여야 합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    함수 $f(x)$가 $x=0$에서 연속이면 함수 $f(x)$가 실수 전체의 집합에서 연속임을 보이시오.
  points: 9
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f(t)=f(t-a)f(a)$이므로 $f(t)-f(a)=f(a)\{f(t-a)-f(0)\}$.
    steps:
    - {id: 3a, content: '$\lim_{t\to a}\{f(t)-f(a)\}=f(a)\lim_{x\to0}\{f(x)-f(0)\}=0$', criteria: ['3.M1', '3.R1']}
    hint_ladder:
    - $f(t)$를 $f(t-a)$와 $f(a)$로 나타내 보자.
  - id: S3-B
    audience: B
    source_flow: 「2025 논술고사 안내」 우수답안 및 해설 p.56
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f$가 $x=0$에서 연속이므로 $\displaystyle\lim_{x\to0}f(x)=f(0)$이다. 실수 전체에서 연속임을 보이려면 임의의 $0$이 아닌 실수 $a$에 대하여 $\displaystyle\lim_{t\to a}f(t)=f(a)$임을 보이면 된다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $f(t)=f(t-a+a)$로 나타낼 수 있으며 $f(t-a)\cdot f(a)$는 구간 $[t,\infty)$에서 $f$의 최솟값이므로(증가함수) $f(t-a)\cdot f(a)=f(t)$이다. 따라서 $f(0)=1$에 의하여
        $$f(t)-f(a)=f(t-a)f(a)-f(a)=f(a)\{f(t-a)-1\}=f(a)\{f(t-a)-f(0)\}$$
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        $t\to a$이기 위한 필요충분조건이 $t-a\to0$이므로 $t-a=x$로 나타내면
        $$\lim_{t\to a}\{f(t)-f(a)\}=\lim_{x\to0}f(a)\{f(x)-f(0)\}=f(a)\cdot\lim_{x\to0}\{f(x)-f(0)\}=f(a)\cdot0=0$$
        이 성립한다. 그러므로 $f$는 실수 전체의 집합에서 연속이다. ■
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $f(t)=f(t-a)f(a)$(증가성·(다) 근거)와 $f(0)=1$로 $f(t)-f(a)=f(a)\{f(t-a)-f(0)\}$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3b-2, 3a]
    - id: 3.R1
      mark_type: R
      points: 5
      evidence: |
        $t\to a\iff t-a\to0$을 밝히고 $x=0$에서의 연속성으로 극한이 $0$임을 보였다.
      depends_on: [3.M1]
      steps: [3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-ALG-9409}
  misconceptions:
  - id: MC-ALG-9409
    outcome_code: '73'
    wrong_work: '$f(t)-f(a)=f(t-a)$로 놓고 $t-a\to0$이면 $f(0)=0$이라 씀'
    detect_cue: 곱의 꼴 $f(t)=f(t-a)f(a)$ 대신 차의 꼴을 썼다($f(0)=1$과 모순)
    feedback: 이 함수는 $f(b+c)=f(b)f(c)$의 곱 꼴입니다. 차 $f(t)-f(a)$는 $f(a)\{f(t-a)-1\}$로 바뀝니다.
    remedy: [RL-3]

- id: '4'
  stem: |
    함수 $f(x)$가 $x=0$에서 미분가능하면 임의의 실수 $x$에 대하여 $f'(x)=f'(0)f(x)$이 성립함을 보이시오.
  points: 9
  depends_on: ['1']
