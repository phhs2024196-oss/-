intent: |
  최솟값 조건으로 주어진 함수가 가지는 대수적 성질($f(nx)=\{f(x)\}^n$, 유리수 거듭제곱)을 유도하고, 이로부터 한 점에서의 연속성·미분가능성이 실수 전체로 퍼짐을 추론하는 능력을 본다. 함수의 구체적 형태 없이 주어진 조건만으로 성질을 수학적으로 추론하는지 평가한다(공식 출제의도 요지).
key_idea: |
  (다)에서 $b=c=a$, $b=c$ 등을 넣어 $\{f(a)\}^2\le\{f(b)\}^2$ $(a\le b)$로 $f$가 증가함수임을 먼저 보이면, $[b+c,\infty)$의 최솟값은 $f(b+c)$이므로 $f(b+c)=f(b)f(c)$가 된다.
stuck: |
  최솟값 조건 (다)에서 $f$의 증가성을 스스로 끌어내 $f(b+c)=f(b)f(c)$로 바꾸는 것, 그리고 $f(0)=1$, $f(-x)=\tfrac{1}{f(x)}$를 유도하는 것
