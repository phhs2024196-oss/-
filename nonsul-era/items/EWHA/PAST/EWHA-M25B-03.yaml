intent: |
  치환적분법으로 주어진 함수의 정적분을 삼각함수 거듭제곱의 정적분으로 변형하고 그 값을 계산하는 수리적 조작 능력, 그리고 함수의 대소 관계로부터 정적분값의 대소 관계를 구해 $\pi$의 유리수 근사 범위를 유도하는 추론 능력을 본다(공식 출제의도 요지).
key_idea: |
  $x=\tan\theta$ 치환으로 $\int_0^1f=\int_0^{\pi/4}\tan^4\theta(1-\tan\theta)^4d\theta$, 점화식 $I_{n+2}+I_n=\tfrac{1}{n+1}$로 $\int_0^1f=\tfrac{22}{7}-\pi$. $[0,1]$에서 $\tfrac{x^4(1-x)^4}{2}\le f\le x^4(1-x)^4$.
stuck: |
  $I_{n+2}+I_n=\tfrac{1}{n+1}$을 이용해 $(I_4+I_6)-4(I_5+I_7)+(I_6+I_8)+4I_6$으로 묶는 것
idea_tags: [IDEA-TAN-POWER-RECURRENCE, IDEA-INTEGRAL-SQUEEZE-PI]
tags: [치환적분, 정적분 점화식, 22/7 - π, 정적분과 부등식]
