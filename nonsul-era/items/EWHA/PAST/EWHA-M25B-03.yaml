stimuli: []

stem: |
  모든 자연수 $n$에 대하여, $I_n=\displaystyle\int_0^{\frac\pi4}\tan^n\theta\,d\theta$라 하자. 함수 $f(x)=\dfrac{x^4(1-x)^4}{1+x^2}$에 대해, 아래 물음에 답하시오. [30점]

subparts:
- id: '1'
  stem: |
    $\displaystyle\int_0^1f(x)dx=I_4-4I_5+6I_6-4I_7+I_8$이 성립함을 보이시오.
  points: 8
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=\tan\theta$로 치환하면 분모 $1+x^2$이 $dx$의 $\sec^2\theta$와 약분된다.
    steps:
    - {id: 1a, content: '$\int_0^{\pi/4}\tan^4\theta(1-\tan\theta)^4d\theta$ 전개', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 분모 $1+x^2$을 보면 어떤 치환이 떠오르는가?
  - id: S1-B
    audience: B
    source_flow: 「2025 논술고사 안내」 우수답안 및 해설 p.58
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x=\tan\theta$이면 $\dfrac{dx}{d\theta}=\sec^2\theta$이고 $1+x^2=1+\tan^2\theta=\sec^2\theta$이다. $x:0\to1$이면 $\theta:0\to\dfrac\pi4$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서
        $$\int_0^1f(x)dx=\int_0^{\pi/4}\tan^4\theta(1-\tan\theta)^4d\theta=\int_0^{\pi/4}\{\tan^4\theta-4\tan^5\theta+6\tan^6\theta-4\tan^7\theta+\tan^8\theta\}d\theta=I_4-4I_5+6I_6-4I_7+I_8$$
        이다. ■
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $x=\tan\theta$ 치환에서 $dx=\sec^2\theta\,d\theta$, $1+x^2=\sec^2\theta$, 적분 구간 $[0,\tfrac\pi4]$를 모두 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $\tan^4\theta(1-\tan\theta)^4$을 이항전개해 $I_4-4I_5+6I_6-4I_7+I_8$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9417}
  misconceptions:
  - id: MC-CAL-9417
    outcome_code: '71'
    wrong_work: '$x=\tan\theta$로 바꾸면서 적분 구간을 $[0,1]$ 그대로 두거나 $dx=\sec^2\theta\,d\theta$를 빠뜨림'
    detect_cue: 위끝이 $1$이거나 분모 $\sec^2\theta$가 남아 있다
    feedback: 치환할 때는 피적분함수, $dx$, 적분 구간 세 가지를 모두 바꿔야 합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $\displaystyle\int_0^1f(x)dx$의 값을 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '22/7 - pi', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $I_{n+2}+I_n=\tfrac1{n+1}$, $I_6=\tfrac{13}{15}-\tfrac\pi4$.
    steps:
    - {id: 2a, content: '$(I_4+I_6)-4(I_5+I_7)+(I_6+I_8)+4I_6=\tfrac15-\tfrac46+\tfrac17+4\left(\tfrac{13}{15}-\tfrac\pi4\right)=\tfrac{22}{7}-\pi$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $\tan^{n+2}\theta=\tan^n\theta(\sec^2\theta-1)$이다.
    - 이웃한 짝을 묶어 보자.
  - id: S2-B
    audience: B
    source_flow: 「2025 논술고사 안내」 우수답안 및 해설 p.58
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $1+\tan^2\theta=\sec^2\theta$이므로 모든 자연수 $n$에 대해
        $$I_{n+2}=\int_0^{\pi/4}\tan^n\theta(\sec^2\theta-1)d\theta=\left[\frac{\tan^{n+1}\theta}{n+1}\right]_{0}^{\pi/4}-I_n=\frac{1}{n+1}-I_n$$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $I_0=\displaystyle\int_0^{\pi/4}1\,d\theta=\frac\pi4$라 하면 $I_6=\dfrac15-I_4=\dfrac15-\dfrac13+I_2=\dfrac15-\dfrac13+1-I_0=\dfrac{13}{15}-\dfrac\pi4$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        따라서
        $$\int_0^1f(x)dx=(I_4+I_6)-4(I_5+I_7)+(I_6+I_8)+4I_6=\frac15-\frac46+\frac17+4\left(\frac{13}{15}-\frac\pi4\right)=\frac{22}{7}-\pi$$
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $I_{n+2}+I_n=\tfrac{1}{n+1}$을 유도했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $I_0=\tfrac\pi4$에서 $I_6=\tfrac{13}{15}-\tfrac\pi4$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2, 2a]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        묶음 정리로 $\int_0^1f(x)dx=\tfrac{22}{7}-\pi$를 얻었다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-9418}
  misconceptions:
  - id: MC-CAL-9418
    outcome_code: '72'
    wrong_work: '$I_{n+2}+I_n=\tfrac{1}{n+2}$ 또는 $\tfrac1n$으로 써서 값이 어긋남'
    detect_cue: $\left[\tfrac{\tan^{n+1}\theta}{n+1}\right]$의 지수·분모가 틀렸다
    feedback: $\int\tan^n\theta\sec^2\theta\,d\theta$는 $u=\tan\theta$ 치환으로 $\tfrac{\tan^{n+1}\theta}{n+1}$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $\displaystyle\int_0^1x^4(1-x)^4dx$의 값을 구하고, 이 값을 이용하여 $\dfrac{1979}{630}\le\pi\le\dfrac{3959}{1260}$이 성립함을 보이시오.
  points: 12
  depends_on: ['2']
  answer: {kind: value, value: '1/630', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $[0,1]$에서 $\tfrac{x^4(1-x)^4}{2}\le f\le x^4(1-x)^4$를 적분하면 $\tfrac{1}{1260}\le\tfrac{22}{7}-\pi\le\tfrac1{630}$.
    steps:
    - {id: 3a, content: '$\tfrac{22}{7}-\tfrac1{630}\le\pi\le\tfrac{22}{7}-\tfrac1{1260}$', criteria: ['3.B1', '3.M1', '3.R1']}
    hint_ladder:
    - $[0,1]$에서 $1+x^2$의 범위는?
  - id: S3-B
    audience: B
    source_flow: 「2025 논술고사 안내」 우수답안 및 해설 pp.58-59
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\displaystyle\int_0^1x^4(1-x)^4dx=\int_0^1(x^4-4x^5+6x^6-4x^7+x^8)dx=\frac15-\frac46+\frac67-\frac48+\frac19=\frac{1}{630}$이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        닫힌구간 $[0,1]$에서 $1\le1+x^2\le2$가 성립하므로 이 구간에서 $\dfrac{x^4(1-x)^4}{2}\le f(x)\le x^4(1-x)^4$이다. 따라서 $\displaystyle\int_0^1\left\{f(x)-\frac{x^4(1-x)^4}{2}\right\}dx$와 $\displaystyle\int_0^1\{x^4(1-x)^4-f(x)\}dx$는 각각 음이 아닌 함수와 $x$축으로 둘러싸인 도형의 넓이이므로 $0$보다 크거나 같다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        각각의 적분값을 직접 구하면 $\displaystyle\int_0^1\left\{f(x)-\frac{x^4(1-x)^4}{2}\right\}dx=\frac{22}{7}-\pi-\frac{1}{1260}$이고 $\displaystyle\int_0^1\{x^4(1-x)^4-f(x)\}dx=\frac{1}{630}-\frac{22}{7}+\pi$이다. 따라서 $\dfrac{22}{7}-\pi-\dfrac1{1260}\ge0$이고 $\dfrac1{630}-\dfrac{22}{7}+\pi\ge0$이며, 이를 정리하면 $\dfrac{1979}{630}\le\pi\le\dfrac{3959}{1260}$이다. ■
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 4
      evidence: |
        $\int_0^1x^4(1-x)^4dx=\tfrac{1}{630}$을 구했다.
      depends_on: []
      steps: [3b-1, 3a]
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $1\le1+x^2\le2$에서 $\tfrac{x^4(1-x)^4}{2}\le f(x)\le x^4(1-x)^4$을 세우고 적분의 부호(넓이)로 대소를 옮겼다.
      depends_on: []
      implied_ok: false
      steps: [3b-2, 3a]
    - id: 3.R1
      mark_type: R
      points: 4
      evidence: |
        $(2)$의 값과 결합해 $\tfrac{1979}{630}\le\pi\le\tfrac{3959}{1260}$을 정리했다.
      depends_on: [3.B1, 3.M1]
      ft: {allowed: true, from: [2.A2], max_points: 4}
      steps: [3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-CAL-9419}
  misconceptions:
  - id: MC-CAL-9419
    outcome_code: '73'
    wrong_work: '$1\le1+x^2\le2$에서 $x^4(1-x)^4\le f(x)\le2x^4(1-x)^4$로 부등호를 뒤집지 않고 나눔'
    detect_cue: 분모가 커지면 값이 작아진다는 점을 반영하지 않아 상·하한이 뒤바뀌었다
    feedback: 양수를 $1+x^2$로 나눌 때 분모가 클수록 값은 작아집니다. $\tfrac{1}{2}\le\tfrac{1}{1+x^2}\le1$로 바꿔 곱하세요.
    remedy: [RL-3]

