- id: '4'
  stem: |
    자연수 $k$와 $2^k$개의 양수 $a_1,a_2,a_3,\cdots,a_{2^k}$에 대하여 부등식
    $$a_1a_2a_3\cdots a_{2^k}\le\left(\dfrac{a_1+a_2+a_3+\cdots+a_{2^k}}{2^k}\right)^{2^k}$$
    이 성립한다고 가정하고, 등식
    $$a_1a_2a_3\cdots a_{2^k}=\left(\dfrac{a_1+a_2+a_3+\cdots+a_{2^k}}{2^k}\right)^{2^k}$$
    가 성립하기 위한 필요충분조건이 $a_1=\cdots=a_{2^k}$라고 가정할 때, $2^{k+1}$개의 양수 $a_1,a_2,a_3,\cdots,a_{2^k},a_{2^k+1},a_{2^k+2},\cdots,a_{2^{k+1}}$에 대하여
    $$a_1\cdots a_{2^k}\cdot a_{2^k+1}\cdots a_{2^{k+1}}=\left(\dfrac{a_1+\cdots+a_{2^k}+a_{2^k+1}+\cdots+a_{2^{k+1}}}{2^{k+1}}\right)^{2^{k+1}}$$
    이 성립하기 위한 필요충분조건이 $a_1=\cdots=a_{2^k}=a_{2^k+1}=\cdots=a_{2^{k+1}}$임을 보이시오.
  points: 10
  depends_on: ['2', '3']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: (3)의 두 부등식을 이으면 $\prod a_i\le(b_1b_2)^{2^k}\le\left(\frac{b_1+b_2}{2}\right)^{2^{k+1}}$이고, 등호이면 $b_1=b_2$, 그리고 (2)와 같은 귀류법으로 각 묶음이 모두 같다.
    steps:
    - {id: 4a, content: '연쇄의 등호 ⇒ $b_1=b_2$, 한 묶음이 같지 않으면 다른 묶음이 가정에 모순', criteria: [4.B1, 4.M1, 4.R1, 4.A1]}
    hint_ladder:
    - (2)의 풀이를 $2^k$개짜리 묶음 두 개에 그대로 적용해 보자.
  - id: S4-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 pp.26-27
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $a_1=\cdots=a_{2^{k+1}}$이면 $a_1\cdots a_{2^{k+1}}=a_1^{2^{k+1}}=\left(\dfrac{\sum a_1}{2^{k+1}}\right)^{2^{k+1}}=\left(\dfrac{a_1+\cdots+a_{2^{k+1}}}{2^{k+1}}\right)^{2^{k+1}}$이므로 등식이 성립한다.
      criteria: [4.B1]
    - id: 4b-2
      content: |
        이제 등식이 성립할 때 모두 같음을 보이자. $b_1=\dfrac{a_1+\cdots+a_{2^k}}{2^k}$, $b_2=\dfrac{a_{2^k+1}+\cdots+a_{2^{k+1}}}{2^k}$라 하면 (3)의 두 부등식으로부터
        $$a_1\cdots a_{2^{k+1}}\le b_1^{2^k}b_2^{2^k}=(b_1b_2)^{2^k}\le\left(\left(\dfrac{b_1+b_2}{2}\right)^2\right)^{2^k}=\left(\dfrac{a_1+\cdots+a_{2^{k+1}}}{2^{k+1}}\right)^{2^{k+1}}$$
        이 성립한다. 등식이 성립하면 위 부등식에서 등호가 성립하므로 (3)의 두 부등식에서 등호가 성립하고, 두 번째 부등식의 등호와 산술·기하평균 관계에 의하여 $b_1=b_2$이다.
      criteria: [4.M1]
    - id: 4b-3
      content: |
        $a_1=\cdots=a_{2^k}$와 $a_{2^k+1}=\cdots=a_{2^{k+1}}$ 중 적어도 하나의 등호가 성립하지 않는다고 가정하자. $a_1=\cdots=a_{2^k}$가 성립하지 않는 경우 주어진 가정에 의하여 $a_1\cdots a_{2^k}<\left(\dfrac{a_1+\cdots+a_{2^k}}{2^k}\right)^{2^k}$이다. (3)의 첫 번째 부등식에서 등호가 성립하므로 $a_{2^k+1}\cdots a_{2^k+2^k}>\left(\dfrac{a_{2^k+1}+\cdots+a_{2^k+2^k}}{2^k}\right)^{2^k}$이 성립해야 하는데, 이는 주어진 가정에 모순이다. 따라서 $a_1=\cdots=a_{2^k}$이고, 마찬가지 방법으로 $a_{2^k+1}=\cdots=a_{2^{k+1}}$이다.
      criteria: [4.R1]
    - id: 4b-4
      content: |
        앞선 결과와 $b_1=b_2$로부터 $a_1=a_{2^k+1}$이다. 그러므로 등식이 성립하면 $a_1=\cdots=a_{2^k}=a_{2^k+1}=\cdots=a_{2^{k+1}}$이다.
      criteria: [4.A1]
