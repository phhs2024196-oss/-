stem: |
  두 양수 $a_1,a_2$에 대하여, 부등식 $a_1a_2\le\left(\dfrac{a_1+a_2}{2}\right)^2$이 성립하는 것이 알려져 있다. 또한 등식 $a_1a_2=\left(\dfrac{a_1+a_2}{2}\right)^2$이 성립하기 위한 필요충분조건이 $a_1=a_2$인 것도 알려져 있다. 이 사실들을 이용하여 아래 물음에 답하시오. [40점]

subparts:
- id: '1'
  stem: |
    네 양수 $a_1,a_2,a_3,a_4$에 대하여, 다음 부등식이 성립함을 보이시오.
    $$a_1a_2a_3a_4\le\left(\dfrac{a_1+a_2}{2}\right)^2\left(\dfrac{a_3+a_4}{2}\right)^2\le\left(\dfrac{a_1+a_2+a_3+a_4}{4}\right)^4$$
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 개씩 짝지어 산술·기하평균을 쓰고, 두 평균 $b_1,b_2$에 다시 한 번 쓴 뒤 제곱한다.
    steps:
    - {id: 1a, content: '$a_1a_2\le b_1^2$, $a_3a_4\le b_2^2$, $b_1b_2\le\left(\tfrac{b_1+b_2}{2}\right)^2$을 제곱', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 네 수를 두 개씩 짝지어 보자.
    - 두 짝의 평균을 새로운 두 양수로 보면?
  - id: S1-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.24
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_1a_2a_3a_4=(a_1a_2)\cdot(a_3a_4)$로 두 개씩 짝을 지으면 두 양수에 대한 산술평균과 기하평균의 관계에 의하여 $a_1a_2\le\left(\dfrac{a_1+a_2}{2}\right)^2$, $a_3a_4\le\left(\dfrac{a_3+a_4}{2}\right)^2$이다. 양변이 모두 양수이므로 곱하면 첫 번째 부등식이 성립한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $b_1=\dfrac{a_1+a_2}{2}$, $b_2=\dfrac{a_3+a_4}{2}$라 하면 $b_1,b_2$는 양수이므로
        $$b_1b_2\le\left(\dfrac{b_1+b_2}{2}\right)^2=\left(\dfrac{a_1+a_2+a_3+a_4}{4}\right)^2$$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        위 부등식의 양변이 양수이므로 양변을 제곱하면 $\left(\dfrac{a_1+a_2}{2}\right)^2\left(\dfrac{a_3+a_4}{2}\right)^2=(b_1b_2)^2\le\left(\dfrac{a_1+a_2+a_3+a_4}{4}\right)^4$이 성립한다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $a_1a_2\le\left(\frac{a_1+a_2}{2}\right)^2$, $a_3a_4\le\left(\frac{a_3+a_4}{2}\right)^2$를 쓰고 곱해 첫 부등식을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $b_1=\frac{a_1+a_2}{2}$, $b_2=\frac{a_3+a_4}{2}$에 두 수의 산술·기하평균 관계를 적용한 식이 있다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        양변이 양수임을 근거로 제곱하여 두 번째 부등식을 결론지었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-9501}
  misconceptions:
  - id: MC-ALG-9501
    outcome_code: '71'
    wrong_work: '$b_1b_2\le\left(\frac{b_1+b_2}{2}\right)^2$에서 근거 없이 양변을 제곱'
    detect_cue: 제곱하거나 부등식끼리 곱할 때 양수라는 언급이 없다
    feedback: 부등식을 곱하거나 제곱할 때는 양변이 모두 양수임을 먼저 밝혀야 합니다.
    remedy: [RL-2]

- id: '2'
  stem: |
    네 양수 $a_1,a_2,a_3,a_4$에 대하여, 등식 $a_1a_2a_3a_4=\left(\dfrac{a_1+a_2+a_3+a_4}{4}\right)^4$이 성립하기 위한 필요충분조건이 $a_1=a_2=a_3=a_4$임을 보이시오.
  points: 10
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (1)의 연쇄의 양 끝이 같으면 가운데 부등식도 모두 등호이고, 귀류법으로 $a_1=a_2$, $a_3=a_4$를 얻는다.
    steps:
    - {id: 2a, content: '양 끝이 같으므로 $b_1=b_2$, 그리고 $a_1\ne a_2$이면 $a_3a_4>b_2^2$이 되어 모순', criteria: [2.B1, 2.M1, 2.R1, 2.A1]}
    hint_ladder:
    - (1)의 부등식 연쇄에서 양 끝이 같다면 가운데는?
    - $a_1\ne a_2$라고 가정하면 $a_3a_4$는 어떻게 되어야 하는가?
  - id: S2-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 pp.24-25
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a_1=a_2=a_3=a_4$이면 양변이 모두 $a_1^4$이므로 등식이 성립함을 간단히 확인할 수 있다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        이제 등식이 성립한다고 가정하자. (1)에 의해
        $$a_1a_2a_3a_4\le\left(\dfrac{a_1+a_2}{2}\right)^2\left(\dfrac{a_3+a_4}{2}\right)^2\le\left(\dfrac{a_1+a_2+a_3+a_4}{4}\right)^4=a_1a_2a_3a_4$$
        이므로 $a_1a_2a_3a_4=\left(\dfrac{a_1+a_2}{2}\right)^2\left(\dfrac{a_3+a_4}{2}\right)^2$이고, 두 번째 부등식의 등호 조건에서 $\dfrac{a_1+a_2}{2}=\dfrac{a_3+a_4}{2}$이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        만약 $a_1\ne a_2$라면 $a_1a_2<\left(\dfrac{a_1+a_2}{2}\right)^2$이므로 위 등식이 성립하려면 $a_3a_4>\left(\dfrac{a_3+a_4}{2}\right)^2$이어야 한다. 그러나 이는 산술평균과 기하평균의 관계에 모순이다. 따라서 귀류법에 의해 $a_1=a_2$이고, 마찬가지로 $a_3=a_4$이다.
      criteria: [2.R1]
    - id: 2b-4
      content: |
        $a_1=a_2$, $a_3=a_4$와 $\dfrac{a_1+a_2}{2}=\dfrac{a_3+a_4}{2}$로부터 $a_1=a_3$이므로 $a_1=a_2=a_3=a_4$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        $a_1=a_2=a_3=a_4$이면 등식이 성립함(충분조건 방향)을 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        (1)의 연쇄 부등식 양 끝이 같으므로 가운데 두 부등식이 등호이고 $\frac{a_1+a_2}{2}=\frac{a_3+a_4}{2}$임을 적었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        $a_1\ne a_2$로 가정하면 $a_3a_4>\left(\frac{a_3+a_4}{2}\right)^2$이 되어 모순임을 보여 $a_1=a_2$, $a_3=a_4$를 이끌었다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $a_1=a_3$을 이끌어 $a_1=a_2=a_3=a_4$를 결론지었다.
      depends_on: [2.M1, 2.R1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-PRF-9502}
  - {code: '73', misconception: MC-ALG-9500}
  misconceptions:
  - id: MC-PRF-9502
    outcome_code: '72'
    wrong_work: '$a_1=a_2=a_3=a_4$이면 등식이 성립한다는 것만 보이고 끝냄'
    detect_cue: 등식에서 출발해 네 수가 같음을 이끄는 부분이 없다
    feedback: 필요충분조건은 두 방향(⇒, ⇐)을 모두 보여야 합니다.
    remedy: [RL-1]
  - id: MC-ALG-9500
    outcome_code: '73'
    wrong_work: '$b_1=b_2$만으로 $a_1=a_2=a_3=a_4$라고 결론'
    detect_cue: 첫 번째 부등식의 등호 조건($a_1=a_2$, $a_3=a_4$)을 따지지 않았다
    feedback: 연쇄의 양 끝이 같으면 모든 부등식이 등호이어야 하므로 각 단계의 등호 조건을 모두 써야 합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    자연수 $k$와 $2^k$개의 양수 $a_1,a_2,a_3,\cdots,a_{2^k}$에 대하여
    $$a_1a_2a_3\cdots a_{2^k}\le\left(\dfrac{a_1+a_2+a_3+\cdots+a_{2^k}}{2^k}\right)^{2^k}$$
    가 성립한다고 가정할 때, $2^{k+1}$개의 양수 $a_1,a_2,a_3,\cdots,a_{2^k},a_{2^k+1},a_{2^k+2},\cdots,a_{2^{k+1}}$에 대하여 다음 두 부등식이 각각 성립함을 보이시오.
    $$a_1a_2\cdots a_{2^k}\cdot a_{2^k+1}a_{2^k+2}\cdots a_{2^{k+1}}\le\left(\dfrac{a_1+a_2+\cdots+a_{2^k}}{2^k}\right)^{2^k}\left(\dfrac{a_{2^k+1}+a_{2^k+2}+\cdots+a_{2^{k+1}}}{2^k}\right)^{2^k},$$
    $$\left(\dfrac{a_1+a_2+\cdots+a_{2^k}}{2^k}\right)\left(\dfrac{a_{2^k+1}+a_{2^k+2}+\cdots+a_{2^{k+1}}}{2^k}\right)\le\left(\dfrac{a_1+\cdots+a_{2^k}+a_{2^k+1}+\cdots+a_{2^{k+1}}}{2^{k+1}}\right)^2$$
  points: 10
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $2^{k+1}=2^k+2^k$로 두 묶음에 가정을 각각 쓰고, 두 묶음의 평균에 두 수의 산술·기하평균 관계를 쓴다.
    steps:
    - {id: 3a, content: '앞 묶음·뒤 묶음에 가정 적용 후 곱함, $b_1b_2\le\left(\tfrac{b_1+b_2}{2}\right)^2$', criteria: [3.M1, 3.A1, 3.M2]}
    hint_ladder:
    - $2^{k+1}$개를 어떻게 $2^k$개짜리로 나눌 수 있을까?
  - id: S3-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.25
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $2^{k+1}=2^k+2^k$이므로 $a_{2^k+1},a_{2^k+2},\cdots,a_{2^{k+1}}=a_{2^k+2^k}$는 $2^k$개의 양수들이다. 따라서 곱을 $(a_1a_2\cdots a_{2^k})\cdot(a_{2^k+1}a_{2^k+2}\cdots a_{2^{k+1}})$로 구분한다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        주어진 가정에 의하여 각각 $a_1\cdots a_{2^k}\le\left(\dfrac{a_1+\cdots+a_{2^k}}{2^k}\right)^{2^k}$과 $a_{2^k+1}\cdots a_{2^{k+1}}\le\left(\dfrac{a_{2^k+1}+\cdots+a_{2^{k+1}}}{2^k}\right)^{2^k}$이고, 모두 양수이므로 곱하면 첫 번째 부등식이 성립한다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
