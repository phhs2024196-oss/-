intent: |
  교과서의 두 양수에 대한 산술평균과 기하평균의 관계와 등호 조건이 $2^n$개의 양수에 대해서도 성립함을, $2^{k+1}=2^k+2^k$로 두 묶음으로 나누는 구조와 귀류법으로 단계적으로 증명하는 능력을 본다(공식 출제의도 요지).
key_idea: |
  $2^{k+1}$개를 $2^k$개씩 두 묶음으로 나누어 각 묶음에 가정을 쓰고, 두 묶음의 평균 $b_1,b_2$에 두 수의 산술·기하평균 관계를 한 번 더 쓴다. 등호 조건은 연쇄의 모든 부등식이 등호가 되어야 함과 귀류법으로 얻는다.
stuck: |
  등호 조건에서 연쇄 부등식 $X\le Y\le Z=X$로부터 각 부등식이 모두 등호임을 끌어내고, 한 묶음이 같지 않으면 다른 묶음이 가정에 모순되는 부등식을 만족해야 한다는 귀류 논법
