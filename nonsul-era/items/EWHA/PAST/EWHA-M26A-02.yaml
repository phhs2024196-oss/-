stimuli: []

stem: |
  $a>0$, $b>0$이고 $a<b$일 때, 다음과 같이 정의된 수열 $\{a_n\}$에 대하여 아래 물음에 답하시오. [30점]
  $$a_1=\dfrac{a+b}{2},\quad a_2=\dfrac{2aa_1}{a+a_1},\quad a_{2n+1}=\dfrac{a_{2n-1}+a_{2n}}{2},\quad a_{2n+2}=\dfrac{2a_{2n}a_{2n+1}}{a_{2n}+a_{2n+1}}\quad(n=1,2,3,\cdots)$$

subparts:
- id: '1'
  stem: |
    모든 자연수 $n$에 대하여 부등식 $a<a_n<b$이 성립함을 수학적 귀납법을 이용하여 보이시오.
  points: 8
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 명제를 「$a<a_{2n-1}<b$이고 $a<a_{2n}<b$」로 세워 $n$에 대한 귀납법을 쓴다. 산술평균·조화평균은 두 수 사이에 있다.
    steps:
    - {id: 1a, content: '$a_{2n+2}-a=\dfrac{a_{2n}(a_{2n+1}-a)+a_{2n+1}(a_{2n}-a)}{a_{2n}+a_{2n+1}}>0$ 등', criteria: [1.B1, 1.M1, 1.A1]}
    hint_ladder:
    - 홀수 번째 항과 짝수 번째 항을 한 쌍으로 묶어 귀납법을 세워 보자.
    - $a_{2n+2}-a$를 통분하면 분자는 어떤 꼴인가?
  - id: S1-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.29
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (i) $a<b$이므로 $a<\dfrac{a+b}{2}<b$, 즉 $a<a_1<b$이다. 한편 $a_2-a=\dfrac{2aa_1}{a+a_1}-a=\dfrac{a(a_1-a)}{a+a_1}$이고 $0<a<a_1$이므로 $a<a_2$이다. 또한 $b-a_2=\dfrac{ba+ba_1-2aa_1}{a+a_1}=\dfrac{a(b-a_1)+a_1(b-a)}{a+a_1}$이고 $0<a<a_1<b$이므로 $a_2<b$이다. 따라서 $n=1$일 때 $a<a_{2n-1}<b$, $a<a_{2n}<b$가 성립한다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (ii) 자연수 $n$에 대하여 $a<a_{2n-1}<b$, $a<a_{2n}<b$가 성립한다고 가정하면 $\dfrac{a+a}{2}<\dfrac{a_{2n-1}+a_{2n}}{2}<\dfrac{b+b}{2}$이고 $a_{2n+1}=\dfrac{a_{2n-1}+a_{2n}}{2}$이므로 $a<a_{2n+1}<b$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        한편 $a_{2n+2}-a=\dfrac{2a_{2n}a_{2n+1}-aa_{2n}-aa_{2n+1}}{a_{2n}+a_{2n+1}}=\dfrac{a_{2n}(a_{2n+1}-a)+a_{2n+1}(a_{2n}-a)}{a_{2n}+a_{2n+1}}$이고 $0<a<a_{2n}$, $0<a<a_{2n+1}$이므로 $a<a_{2n+2}$이다. 또한 $b-a_{2n+2}=\dfrac{a_{2n}(b-a_{2n+1})+a_{2n+1}(b-a_{2n})}{a_{2n}+a_{2n+1}}$이고 $0<a_{2n}<b$, $0<a_{2n+1}<b$이므로 $a_{2n+2}<b$이다. 따라서 $a<a_{2n+2}<b$이다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        (i)과 (ii)에 의하여 모든 자연수 $n$에 대하여 $a<a_n<b$가 성립한다.
      criteria: [1.R1]
  - id: S1-ALT
    audience: ALT
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 pp.29-30 별해
    method_no: 2
    key_idea: 조화평균을 $a_{2n+2}=\dfrac{2}{\frac{1}{a_{2n+1}}+\frac{1}{a_{2n}}}$로 쓰고 $\frac1b<\frac{1}{a_{2n}}<\frac1a$ 등을 더해 $a<a_{2n+2}<b$를 얻는다.
    steps:
    - id: 1c-1
      content: |
        $\dfrac1b<\dfrac{1}{a_{2n}}<\dfrac1a$, $\dfrac1b<\dfrac{1}{a_{2n+1}}<\dfrac1a$이므로 $a=\dfrac{2}{\frac1a+\frac1a}<a_{2n+2}=\dfrac{2}{\frac{1}{a_{2n+1}}+\frac{1}{a_{2n}}}<\dfrac{2}{\frac1b+\frac1b}=b$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        $a<a_1<b$와 $a<a_2<b$를 각각 근거와 함께 보였다(기초 단계).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        홀·짝 두 항에 대한 귀납 가정을 세우고 $a<a_{2n+1}<b$를 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $a_{2n+2}-a$, $b-a_{2n+2}$를 양수 인수로 나타내거나 역수 비교로 $a<a_{2n+2}<b$를 보였다.
      depends_on: [1.M1]
      steps: [1b-3, 1c-1]
    - id: 1.R1
      mark_type: R
      points: 1
      evidence: |
        (i)(ii)에 의해 모든 $n$에 대해 성립한다고 결론지었다.
      depends_on: [1.M1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRF-9504}
  misconceptions:
  - id: MC-PRF-9504
    outcome_code: '71'
    wrong_work: '$a<a_n<b$를 가정하고 바로 $a<a_{n+1}<b$를 보이려 함'
    detect_cue: $a_{2n+1}$, $a_{2n+2}$가 앞의 두 항에 의존하는데 귀납 가정이 한 항뿐이다
    feedback: 다음 항이 앞의 두 항으로 정해지므로 두 항(홀·짝)을 함께 가정하는 꼴로 귀납법을 세우세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    모든 자연수 $n$에 대하여 부등식 $a_{2n}<a_{2n+1}$이 성립함을 수학적 귀납법을 이용하여 보이시오.
  points: 8
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a_{2n+3}-a_{2n+2}=\dfrac{a_{2n+1}-a_{2n+2}}{2}=\dfrac{a_{2n+1}}{2(a_{2n}+a_{2n+1})}(a_{2n+1}-a_{2n})$.
    steps:
    - {id: 2a, content: '$a_3-a_2=\dfrac{a_1(a_1-a)}{2(a+a_1)}>0$, 귀납 단계는 위 인수분해', criteria: [2.B1, 2.M1, 2.A1]}
    hint_ladder:
    - $a_{2n+3}-a_{2n+2}$를 $a_{2n+1}-a_{2n+2}$로 바꿔 보자.
  - id: S2-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.30
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (i) $a>0$이고 (1)의 결과로부터 $a_1>a$이므로
        $a_3-a_2=\dfrac{a_1+a_2}{2}-a_2=\dfrac{a_1-a_2}{2}=\dfrac12\left(a_1-\dfrac{2aa_1}{a+a_1}\right)=\dfrac{a_1(a_1-a)}{2(a+a_1)}>0$이다. 따라서 $n=1$일 때 성립한다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        (ii) $a_{2n}<a_{2n+1}$이 성립한다고 가정하자. $a_{2n+3}-a_{2n+2}=\dfrac{a_{2n+1}+a_{2n+2}}{2}-a_{2n+2}=\dfrac{a_{2n+1}-a_{2n+2}}{2}$이고 $a_{2n+2}=\dfrac{2a_{2n}a_{2n+1}}{a_{2n}+a_{2n+1}}$이므로
        $$a_{2n+3}-a_{2n+2}=\dfrac{a_{2n+1}}{2(a_{2n}+a_{2n+1})}(a_{2n}+a_{2n+1}-2a_{2n})=\dfrac{a_{2n+1}}{2(a_{2n}+a_{2n+1})}(a_{2n+1}-a_{2n})$$
      criteria: [2.M1]
    - id: 2b-3
      content: |
        (1)의 결과로부터 모든 $n$에 대하여 $a_n>a>0$이고 가정으로부터 $a_{2n}<a_{2n+1}$이므로 $a_{2n+2}<a_{2n+3}$이 성립한다. (i)과 (ii)에 의하여 모든 자연수 $n$에 대하여 $a_{2n}<a_{2n+1}$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        $a_3-a_2=\frac{a_1(a_1-a)}{2(a+a_1)}>0$ 등으로 $n=1$인 경우를 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $a_{2n+3}-a_{2n+2}=\frac{a_{2n+1}}{2(a_{2n}+a_{2n+1})}(a_{2n+1}-a_{2n})$ 또는 동치식을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        (1)의 양수성과 귀납 가정을 인용해 $a_{2n+2}<a_{2n+3}$을 결론지었다.
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-9505}
  - {code: '72', misconception: MC-ALG-9506}
  misconceptions:
  - id: MC-ALG-9505
    outcome_code: '71'
    wrong_work: '「조화평균은 산술평균보다 작다」만 쓰고 $a_{2n+2}<a_{2n+3}$을 단정'
    detect_cue: $a_{2n+3}-a_{2n+2}$를 실제로 통분한 식이 없다
    feedback: 비교 대상이 서로 다른 두 수의 평균이므로 차를 직접 통분해 부호를 확인하세요.
    remedy: [RL-2]
  - id: MC-ALG-9506
    outcome_code: '72'
    wrong_work: '인수 $\frac{a_{2n+1}}{2(a_{2n}+a_{2n+1})}$의 부호를 근거 없이 양수로 둠'
    detect_cue: (1)의 $a_n>a>0$ 인용이 없다
    feedback: 인수의 부호는 (1)의 결과 $a_n>0$에서 나옵니다. 근거를 적으세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    모든 자연수 $n$에 대하여 부등식 $a_{2n-1}>a_{2n+1}$이 성립함을 보이시오.
  points: 7
  depends_on: ['1', '2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a_{2n+1}-a_{2n-1}=\dfrac{a_{2n}-a_{2n-1}}{2}$이고, 이것을 조화평균 식으로 $a_{2n-1}(a_{2n-2}-a_{2n-1})$에 비례하게 쓴다.
    steps:
    - {id: 3a, content: '$a_{2n+1}-a_{2n-1}=\dfrac{a_{2n-1}(a_{2n-2}-a_{2n-1})}{2(a_{2n-2}+a_{2n-1})}<0$ ($n\ge2$), $n=1$은 따로', criteria: [3.B1, 3.M1, 3.A1]}
    hint_ladder:
    - $a_{2n}$을 다시 $a_{2n-2}$, $a_{2n-1}$로 나타내 보자.
  - id: S3-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.31
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (i) $n=1$일 때 $a_3-a_1=\dfrac{a_2-a_1}{2}=\dfrac12\left(\dfrac{2aa_1}{a+a_1}-a_1\right)=\dfrac{a_1}{2(a+a_1)}(a-a_1)$이고 $a_1>a$이므로 $a_3<a_1$이다.
      criteria: [3.B1]
    - id: 3b-2
      content: |
        (ii) $n=2,3,4,\cdots$에 대하여
        $$a_{2n+1}-a_{2n-1}=\dfrac{a_{2n}-a_{2n-1}}{2}=\dfrac12\left(\dfrac{2a_{2n-2}a_{2n-1}}{a_{2n-2}+a_{2n-1}}-a_{2n-1}\right)=\dfrac{a_{2n-1}(a_{2n-2}-a_{2n-1})}{2(a_{2n-2}+a_{2n-1})}$$
      criteria: [3.M1]
    - id: 3b-3
      content: |
        (1)의 결과로부터 $a_n>a>0$이고, (2)의 결과로부터 $a_{2n-2}<a_{2n-1}$ $(n=2,3,4,\cdots)$이므로 $a_{2n-1}>a_{2n+1}$이 성립한다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        $n=1$인 경우 $a_3-a_1=\frac{a_1(a-a_1)}{2(a+a_1)}<0$을 보였다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $n\ge2$에서 $a_{2n+1}-a_{2n-1}=\frac{a_{2n-1}(a_{2n-2}-a_{2n-1})}{2(a_{2n-2}+a_{2n-1})}$ 또는 동치식을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        (1)의 양수성과 (2)의 $a_{2n-2}<a_{2n-1}$을 인용해 결론지었다.
      depends_on: [3.M1]
      ft: {allowed: true, from: [1.A1, 2.A1], max_points: 2}
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
