subparts:
- id: '1'
  stem: |
    임의의 실수 $-\dfrac{\pi}{2}<t<\dfrac{\pi}{2}$에 대해 좌표평면의 점 $\mathrm{P}(2\cos t,\sin t)$를 모두 지나고 두 점 $\mathrm{F}(-\sqrt3,0)$, $\mathrm{F'}(\sqrt3,0)$에서 점 $\mathrm{P}$까지 거리의 합이 일정한 이차곡선의 방정식을 구하시오.
  points: 6
  depends_on: []
  answer: {kind: expression, value: 'x**2/4 + y**2 = 1', equivalents: ['x**2 + 4*y**2 = 4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 초점이 $(\pm\sqrt3,0)$인 타원 $\frac{x^2}{a^2}+\frac{y^2}{a^2-3}=1$에 $t=0$인 점 $(2,0)$을 대입.
    steps:
    - {id: 1a, content: '$a^2=4$, $\dfrac{x^2}{4}+y^2=1$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 두 점에서 거리의 합이 일정한 곡선은?
  - id: S1-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.33
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 점에서 거리의 합이 일정한 이차곡선은 타원이며, 중심이 원점이고 두 초점이 $x$축 위에 있는 타원의 방정식은 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ (단, $b^2=a^2-c^2$)이다. $c^2=3$이고 점 $\mathrm{P}$가 이 곡선 위에 있으므로 $\dfrac{4\cos^2t}{a^2}+\dfrac{\sin^2t}{a^2-3}=1$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        위 식은 $t=0$일 때에도 성립하므로 $a^2=4$이다. 따라서 타원의 방정식은 $\dfrac{x^2}{4}+y^2=1$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        타원임을 밝히고 $b^2=a^2-3$인 표준형에 점 $\mathrm{P}$를 대입한 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\frac{x^2}{4}+y^2=1$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9507}
  misconceptions:
  - id: MC-GEO-9507
    outcome_code: '71'
    wrong_work: '$b^2=a^2+c^2$로 두어 $\frac{x^2}{4}+\frac{y^2}{7}=1$'
    detect_cue: 장축이 $x$축인데 $b^2>a^2$이다
    feedback: 타원에서는 $c^2=a^2-b^2$(초점이 장축 위)입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    임의의 실수 $-\dfrac{\pi}{2}<t<\dfrac{\pi}{2}$에 대해 좌표평면의 점 $\mathrm{Q}(3\sec t,2\tan t)$를 모두 지나고 두 점 $\mathrm{F}(-\sqrt{13},0)$, $\mathrm{F'}(\sqrt{13},0)$에서 점 $\mathrm{Q}$까지 거리의 차가 일정한 이차곡선의 방정식을 구하시오.
  points: 6
  depends_on: []
  answer: {kind: expression, value: 'x**2/9 - y**2/4 = 1', equivalents: ['4*x**2 - 9*y**2 = 36'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 쌍곡선 $\frac{x^2}{a^2}-\frac{y^2}{13-a^2}=1$에 $t=0$인 점 $(3,0)$을 대입.
    steps:
    - {id: 2a, content: '$a^2=9$, $\dfrac{x^2}{9}-\dfrac{y^2}{4}=1$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - 두 점에서 거리의 차가 일정한 곡선은?
  - id: S2-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.33
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 점에서 거리의 차가 일정한 이차곡선은 쌍곡선이며, 중심이 원점이고 두 초점이 $x$축 위에 있는 쌍곡선의 방정식은 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$ (단, $b^2=c^2-a^2$)이다. $c^2=13$이고 점 $\mathrm{Q}$가 이 곡선 위에 있으므로 $\dfrac{9\sec^2t}{a^2}-\dfrac{4\tan^2t}{13-a^2}=1$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        위 식은 $t=0$일 때에도 성립하므로 $a^2=9$이다. 따라서 쌍곡선의 방정식은 $\dfrac{x^2}{9}-\dfrac{y^2}{4}=1$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        쌍곡선임을 밝히고 $b^2=13-a^2$인 표준형에 점 $\mathrm{Q}$를 대입한 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\frac{x^2}{9}-\frac{y^2}{4}=1$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9507}
  misconceptions:
  - id: MC-GEO-9507
    outcome_code: '71'
    wrong_work: '타원처럼 $b^2=a^2-c^2$로 두어 $b^2<0$이 됨'
    detect_cue: 쌍곡선인데 $a,b,c$ 관계가 타원 공식이다
    feedback: 쌍곡선에서는 $c^2=a^2+b^2$입니다.
    remedy: [RL-1]

- id: '3'
  stem: |
    $2$보다 큰 자연수 $n$에 대하여 좌표평면 위의 세 점 $\mathrm{A}\left(-\dfrac32,0\right)$, $\mathrm{P}_n\left(2\cos\left(\dfrac{\pi}{2^n}\right),\sin\left(\dfrac{\pi}{2^n}\right)\right)$, $\mathrm{Q}_n\left(3\sec\left(\dfrac{\pi}{2^n}\right),2\tan\left(\dfrac{\pi}{2^n}\right)\right)$을 꼭짓점으로 하는 삼각형의 넓이를 $\dfrac54B_n$이라 할 때, $B_n$을 구하시오.
  points: 9
  depends_on: []
  answer: {kind: expression, value: 'sin(pi/2**n)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 직선 $\mathrm{AP}_n$까지 $\mathrm{Q}_n$의 거리가 $\dfrac{5\lvert\sin\theta_n\rvert}{2\,\overline{\mathrm{AP}_n}}$이므로 넓이 $\dfrac54\sin\theta_n$.
    steps:
    - {id: 3a, content: '$B_n=\sin\dfrac{\pi}{2^n}$', criteria: [3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - $\theta_n=\frac{\pi}{2^n}$으로 두고 밑변을 $\mathrm{AP}_n$으로 잡아 보자.
  - id: S3-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.34
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\theta_n=\dfrac{\pi}{2^n}$이라 하자. $\overline{\mathrm{AP}_n}=\sqrt{\left(2\cos\theta_n+\dfrac32\right)^2+(\sin\theta_n)^2}$이고, 점 $\mathrm{A}$와 $\mathrm{P}_n$을 지나는 직선 $\ell$의 방정식은 $\sin\theta_n\,x-\left(2\cos\theta_n+\dfrac32\right)y+\dfrac32\sin\theta_n=0$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        점 $\mathrm{Q}_n$에서 직선 $\ell$까지의 거리는
        $$h=\dfrac{\left\lvert\sin\theta_n(3\sec\theta_n)-\left(2\cos\theta_n+\frac32\right)(2\tan\theta_n)+\frac32\sin\theta_n\right\rvert}{\sqrt{\sin^2\theta_n+\left(2\cos\theta_n+\frac32\right)^2}}=\dfrac{5\lvert\sin\theta_n\rvert}{2\,\overline{\mathrm{AP}_n}}$$
      criteria: [3.M2]
    - id: 3b-3
      content: |
        따라서 삼각형 $\mathrm{AP}_n\mathrm{Q}_n$의 넓이는 $\dfrac12\times\overline{\mathrm{AP}_n}\times h=\dfrac54\lvert\sin\theta_n\rvert$이다. $0<\theta_n=\dfrac{\pi}{2^n}<\dfrac{\pi}{2}$이므로 $B_n=\sin\left(\dfrac{\pi}{2^n}\right)$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        직선 $\mathrm{AP}_n$의 방정식과 $\overline{\mathrm{AP}_n}$(또는 넓이 공식의 다른 밑변·좌표 공식)을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        점과 직선 사이의 거리 $h=\frac{5\lvert\sin\theta_n\rvert}{2\overline{\mathrm{AP}_n}}$을 계산했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        넓이 $\frac54\sin\frac{\pi}{2^n}$에서 $B_n=\sin\frac{\pi}{2^n}$을 얻었다.
      depends_on: [3.M2]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9508}
  misconceptions:
  - id: MC-GEO-9508
    outcome_code: '71'
    wrong_work: '거리 공식에서 분모 $\sqrt{A^2+B^2}$ 또는 절댓값을 빠뜨림'
    detect_cue: $h$에 $\overline{\mathrm{AP}_n}$이 약분되지 않거나 음수가 나온다
    feedback: 점 $(x_1,y_1)$과 직선 $Ax+By+C=0$ 사이 거리는 $\frac{\lvert Ax_1+By_1+C\rvert}{\sqrt{A^2+B^2}}$입니다.
    remedy: [RL-2]

- id: '4'
  stem: |
    닫힌구간 $\left[0,\dfrac{\pi}{2}\right]$에서 정의된 함수 $f(x)=\sin x$의 역함수를 $g(x)$라 하자. $2$보다 큰 자연수 $n$에 대하여
    $$C_n=\int_0^1\dfrac{B_n}{\cos(g(B_nx))}dx$$
    로 정의할 때, 급수 $\displaystyle\sum_{n=2}^{\infty}C_n$의 수렴, 발산을 조사하고, 수렴하면 그 합을 구하시오.
  points: 9
  depends_on: ['3']
  answer: {kind: value, value: 'pi/2', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 치환으로 $C_n=\int_0^{B_n}g'(x)dx=g(B_n)=\frac{\pi}{2^n}$, 첫째항 $\frac{\pi}{4}$·공비 $\frac12$인 등비급수.
    steps:
    - {id: 4a, content: '$\displaystyle\sum_{n=2}^\infty\dfrac{\pi}{2^n}=\dfrac{\pi}{2}$ (수렴)', criteria: [4.M1, 4.M2, 4.A1]}
    hint_ladder:
    - $B_nx=u$로 치환해 보자.
    - $\frac{1}{\cos(g(x))}$는 어떤 함수의 도함수인가?
  - id: S4-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.34
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        치환적분을 이용하면 $C_n=\displaystyle\int_0^{B_n}\dfrac{1}{\cos(g(x))}dx$이다.
      criteria: [4.M1]
    - id: 4b-2
      content: |
        $f'(x)=\cos x$이므로 역함수의 미분법에 의해 $g'(x)=(f^{-1})'(x)=\dfrac{1}{f'(f^{-1}(x))}=\dfrac{1}{\cos(g(x))}$이고, 따라서 $g(x)$는 $\dfrac{1}{\cos(g(x))}$의 한 부정적분이다.
      criteria: [4.M2]
    - id: 4b-3
      content: |
        정적분의 정의에 의해 $C_n=\displaystyle\int_0^{B_n}g'(x)dx=g(B_n)-g(0)$이고, $0<\dfrac{\pi}{2^n}<\dfrac{\pi}{2}$이므로 $g(B_n)=g\left(f\left(\dfrac{\pi}{2^n}\right)\right)=\dfrac{\pi}{2^n}$, $g(0)=0$이다. 따라서 $C_n=\dfrac{\pi}{2^n}$이고 급수 $\displaystyle\sum_{n=2}^{\infty}C_n$은 첫째항이 $\dfrac{\pi}{4}$이고 공비가 $\dfrac12$인 등비급수가 되므로 수렴하며, 그 합은 $\dfrac{\pi/4}{1-1/2}=\dfrac{\pi}{2}$이다.
      criteria: [4.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: |
        $u=B_nx$ 치환으로 $C_n=\int_0^{B_n}\frac{1}{\cos(g(u))}du$를 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [3.A1], max_points: 3}
      steps: [4b-1]
    - id: 4.M2
      mark_type: M
      points: 3
      evidence: |
        역함수의 미분법으로 $g'(x)=\frac{1}{\cos(g(x))}$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 3
      evidence: |
        $C_n=\frac{\pi}{2^n}$을 구하고 공비 $\frac12$인 등비급수이므로 수렴, 합 $\frac{\pi}{2}$를 적었다.
      depends_on: [4.M1, 4.M2]
      steps: [4b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9509}
