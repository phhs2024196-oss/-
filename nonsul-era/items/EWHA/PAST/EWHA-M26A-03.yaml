key_idea: |
  $\theta_n=\dfrac{\pi}{2^n}$에서 넓이가 $\dfrac54\sin\theta_n$이므로 $B_n=\sin\theta_n$이고, $g'(x)=\dfrac{1}{\cos(g(x))}$이므로 치환 후 $C_n=g(B_n)-g(0)=\theta_n$이다.
stuck: |
  $C_n$의 피적분함수를 $x\mapsto B_nx$로 치환한 뒤 $\dfrac{1}{\cos(g(x))}$가 역함수 $g$의 도함수임을 알아보는 발상
