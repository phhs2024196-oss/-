memo: |
  원문 (3)(4)는 「2보다 큰 자연수 $n$」에 대해 $B_n$, $C_n$을 정의하지만 급수는 $n=2$부터 합한다. 공식 해설은 $n=2$항($\frac{\pi}{4}$)을 첫째항으로 포함해 $\frac{\pi}{2}$를 답으로 제시했다. $n\ge3$만 합하면 $\frac{\pi}{4}$가 된다 — 원문 표기 불일치(사람 확인 필요).

