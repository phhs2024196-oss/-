intent: |
  적분으로 정의된 수열을 부분적분으로 분석해 귀납적 관계를 찾고, 수학적 귀납법으로 곱 수열의 부등식을 유도한 뒤, 극한의 대소 관계와 등비급수의 합을 이용해 극한값을 추론하는 능력을 평가한다(공식 출제의도 요지).
key_idea: |
  $\sin x\cos x=\frac14(\sin^2x-\cos^2x)'$로 부분적분하면 $S_{n+1}=\frac{2n-1}{2n}S_n+\frac{1}{2^{n+2}n}$이고, $A_k=\frac{2k}{2k-1}A_{k-1}$과 결합하면 $A_kS_{k+1}-A_{k-1}S_k=\frac{A_k}{2^{k+2}k}$가 된다.
stuck: |
