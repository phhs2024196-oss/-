stimuli: []

stem: |
  모든 자연수 $n$에 대하여 수열 $S_n$을 다음과 같이 정의할 때, 아래 물음에 답하시오. [40점]
  $$S_n=\int_0^{\frac{\pi}{2}}\dfrac{\sin x\cos x}{(2\sin^4x+2\cos^4x)^n}dx$$

subparts:
- id: '1'
  stem: |
    다음 두 등식이 성립함을 보이시오.
    $$\dfrac{d}{dx}(\sin^2x-\cos^2x)=4\sin x\cos x,\quad \sin^2x\cos^2x=\dfrac12(1-\sin^4x-\cos^4x)$$
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 곱의 미분법, 그리고 $1=(\sin^2x+\cos^2x)^2$를 전개.
    steps:
    - {id: 1a, content: '$2\sin x\cos x+2\cos x\sin x$; $(\sin^2x+\cos^2x)^2=1$', criteria: [1.M1, 1.M2]}
    hint_ladder:
    - $1=(\sin^2x+\cos^2x)^2$을 전개해 보자.
  - id: S1-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.36
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각함수의 미분에 의해 $\dfrac{d}{dx}\sin x=\cos x$, $\dfrac{d}{dx}\cos x=-\sin x$이다. 함수의 곱의 미분법에 의해 $\dfrac{d}{dx}(\sin^2x-\cos^2x)=2\sin x\cos x-2\cos x(-\sin x)=4\sin x\cos x$가 성립한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        한편 $\sin^2x+\cos^2x=1$이므로
        $$\sin^2x\cos^2x=\dfrac12\left((\sin^2x+\cos^2x)^2-\sin^4x-\cos^4x\right)=\dfrac12(1-\sin^4x-\cos^4x)$$
        이다.
      criteria: [1.M2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        곱(합성)의 미분으로 $2\sin x\cos x+2\cos x\sin x=4\sin x\cos x$를 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        $(\sin^2x+\cos^2x)^2=1$을 전개해 두 번째 등식을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRF-0003}
  misconceptions:
  - id: MC-PRF-0003
    outcome_code: '71'
    wrong_work: '두 번째 등식의 양변을 변형해 같은 식이 되었으니 성립한다고 서술'
    detect_cue: 증명할 등식을 전제로 쓰고 양변을 동시에 변형했다
    feedback: 한쪽 변(또는 항등식 $\sin^2x+\cos^2x=1$)에서 출발해 다른 변에 도달하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    모든 자연수 $n$에 대하여
    $$S_{n+1}=\dfrac{2n-1}{2n}S_n+\dfrac{1}{2^{n+2}n}$$
    이 성립함을 보이시오.
  points: 10
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\sin x\cos x=\frac14(\sin^2x-\cos^2x)'$로 부분적분, $(\sin^2x-\cos^2x)^2=2\cdot\frac{2\sin^4x+2\cos^4x}{2}-1$ 꼴로 정리하면 $S_n$, $S_{n+1}$로 돌아온다.
    steps:
    - {id: 2a, content: '$S_n=\dfrac{1}{2^{n+1}}+2nS_n-2nS_{n+1}$', criteria: [2.M1, 2.A1, 2.M2, 2.A2]}
    hint_ladder:
    - (1)의 첫 번째 등식으로 부분적분을 시도해 보자.
  - id: S2-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.36
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1)의 첫 번째 등식을 이용하여 부분적분법을 적용하면
        $$S_n=\dfrac14\int_0^{\frac{\pi}{2}}\dfrac{(\sin^2x-\cos^2x)'}{(2\sin^4x+2\cos^4x)^n}dx=\dfrac14\left[\dfrac{\sin^2x-\cos^2x}{(2\sin^4x+2\cos^4x)^n}\right]_0^{\frac{\pi}{2}}+2n\int_0^{\frac{\pi}{2}}\dfrac{\sin x\cos x(\sin^2x-\cos^2x)^2}{(2\sin^4x+2\cos^4x)^{n+1}}dx$$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        경계항은 $\dfrac14\left(\dfrac{1}{2^n}+\dfrac{1}{2^n}\right)=\dfrac{1}{2^{n+1}}$이고 $(\sin^2x-\cos^2x)^2=\sin^4x+\cos^4x-2\sin^2x\cos^2x$이므로
        $$S_n=\dfrac{1}{2^{n+1}}+2n\int_0^{\frac{\pi}{2}}\dfrac{\sin x\cos x(\sin^4x+\cos^4x-2\sin^2x\cos^2x)}{(2\sin^4x+2\cos^4x)^{n+1}}dx$$
      criteria: [2.A1]
    - id: 2b-3
      content: |
        (1)의 두 번째 등식을 대입하면 $\sin^4x+\cos^4x-2\sin^2x\cos^2x=2\sin^4x+2\cos^4x-1$이므로
        $$S_n=\dfrac{1}{2^{n+1}}+2n\int_0^{\frac{\pi}{2}}\left(\dfrac{\sin x\cos x}{(2\sin^4x+2\cos^4x)^n}-\dfrac{\sin x\cos x}{(2\sin^4x+2\cos^4x)^{n+1}}\right)dx=\dfrac{1}{2^{n+1}}+2nS_n-2nS_{n+1}$$
      criteria: [2.M2]
    - id: 2b-4
      content: |
        따라서 $S_{n+1}=\dfrac{2n-1}{2n}S_n+\dfrac{1}{2^{n+2}n}$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $u=(2\sin^4x+2\cos^4x)^{-n}$, $v'=\frac14(\sin^2x-\cos^2x)'$로 부분적분 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        경계항 $\frac{1}{2^{n+1}}$과 적분항의 계수 $2n$을 바르게 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        (1)의 두 번째 등식으로 분자를 $2\sin^4x+2\cos^4x-1$로 바꾸어 $S_n$, $S_{n+1}$로 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M2], max_points: 2}
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $S_{n+1}=\frac{2n-1}{2n}S_n+\frac{1}{2^{n+2}n}$로 정리했다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9511}
  misconceptions:
  - id: MC-CAL-9511
    outcome_code: '71'
    wrong_work: '경계항을 $\frac14\left(\frac{1}{2^n}-\frac{1}{2^n}\right)=0$으로 계산'
    detect_cue: $x=0$에서 $\sin^2x-\cos^2x=-1$의 부호를 반영하지 않았다
    feedback: $[\,\cdot\,]_0^{\pi/2}$에서 $x=0$일 때 값은 $-\frac{1}{2^n}$이므로 빼면 $+\frac{1}{2^n}$이 됩니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    모든 자연수 $m$에 대하여 수열 $A_m$을 $A_m=\dfrac21\times\dfrac43\times\dfrac65\times\cdots\times\dfrac{2m}{2m-1}$이라 정의한다. 모든 자연수 $m$에 대하여 부등식 $\sqrt{2m+1}\le A_m\le2\sqrt m$이 성립함을 보이시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 귀납 단계에서 $A_{k+1}=\frac{2k+2}{2k+1}A_k$와 $(2k+1)(2k+3)<(2k+2)^2$, $4k(k+1)<(2k+1)^2$를 쓴다.
    steps:
    - {id: 3a, content: '$\sqrt{2k+3}\le\frac{2k+2}{\sqrt{2k+1}}$, $\frac{4(k+1)\sqrt k}{2k+1}\le2\sqrt{k+1}$', criteria: [3.B1, 3.M1, 3.R1, 3.A1]}
    hint_ladder:
    - $A_{k+1}$과 $A_k$의 관계를 써서 귀납 가정을 그대로 곱해 보자.
  - id: S3-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.37
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        수학적 귀납법을 사용하여 증명한다. $m=1$이면 $A_1=2$이고 $\sqrt3\le2\le2$이므로 주어진 부등식은 성립한다.
      criteria: [3.B1]
    - id: 3b-2
      content: |
        $m=k$일 때 $\sqrt{2k+1}\le A_k\le2\sqrt k$가 성립한다고 가정하자. 정의에 의해 $A_{k+1}=\dfrac{2k+2}{2k+1}A_k$이므로 $\dfrac{2k+2}{\sqrt{2k+1}}\le A_{k+1}\le\dfrac{4(k+1)\sqrt k}{2k+1}$이 성립한다.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        한편 모든 자연수 $n$에 대하여 부등식 $(2n+1)(2n+3)<(2n+2)^2$, $4n(n+1)<(2n+1)^2$이 성립하므로 $\sqrt{2k+3}\le\dfrac{2k+2}{\sqrt{2k+1}}$, $\dfrac{4(k+1)\sqrt k}{2k+1}\le2\sqrt{k+1}$이다.
      criteria: [3.R1]
    - id: 3b-4
      content: |
        그러므로 $m=k+1$일 때 주어진 부등식이 성립한다. 따라서 수학적 귀납법에 의하여 주어진 부등식은 모든 자연수 $m$에 대하여 성립한다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        $m=1$에서 $\sqrt3\le2\le2$를 확인했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $A_{k+1}=\frac{2k+2}{2k+1}A_k$로 $\frac{2k+2}{\sqrt{2k+1}}\le A_{k+1}\le\frac{4(k+1)\sqrt k}{2k+1}$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
      points: 4
      evidence: |
        $(2k+1)(2k+3)<(2k+2)^2$와 $4k(k+1)<(2k+1)^2$를 근거로 양쪽 경계를 $\sqrt{2k+3}$, $2\sqrt{k+1}$과 비교했다.
      depends_on: [3.M1]
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 1
      evidence: |
        수학적 귀납법으로 모든 $m$에 대해 성립함을 결론지었다.
      depends_on: [3.R1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRF-9512}
  misconceptions:
  - id: MC-PRF-9512
    outcome_code: '71'
    wrong_work: '$\frac{2k+2}{\sqrt{2k+1}}\ge\sqrt{2k+3}$을 「분명하다」고만 쓰고 넘어감'
    detect_cue: 제곱 비교 $(2k+2)^2>(2k+1)(2k+3)$ 등 보조 부등식의 근거가 없다
    feedback: 귀납 단계의 핵심 비교는 양변을 제곱해 다항식 부등식으로 보여야 합니다.
    remedy: [RL-3]

- id: '4'
  stem: |
    임의의 실수 $\alpha$에 대하여 $\alpha<\dfrac12$이면 극한값 $\displaystyle\lim_{n\to\infty}\sum_{k=2}^{n}\dfrac{n^{\alpha}\sqrt k}{A_n}(A_kS_{k+1}-A_{k-1}S_k)$이 $0$임을 보이시오.
  points: 10
  depends_on: ['2', '3']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: (2)에 $A_k$를 곱하면 $A_kS_{k+1}-A_{k-1}S_k=\frac{A_k}{2^{k+2}k}$이고, (3)으로 $0\le$합$\le\frac{n^\alpha}{\sqrt{2n+1}}\left(\frac14-\frac{1}{2^{n+1}}\right)\to0$.
    steps:
    - {id: 4a, content: '조임 정리로 $0$', criteria: [4.M1, 4.M2, 4.A1]}
    hint_ladder:
    - $A_k\cdot\frac{2k-1}{2k}$는 무엇인가?
    - (3)의 두 부등식을 각각 분자·분모에 쓰자.
  - id: S4-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.37
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        (2)와 $A_{k-1}=\dfrac{2k-1}{2k}A_k$로부터 식 $A_kS_{k+1}-A_{k-1}S_k=\dfrac{A_k}{2^{k+2}k}$를 $2$ 이상의 모든 자연수 $k$에 대하여 얻는다. 그러므로
        $$\lim_{n\to\infty}\sum_{k=2}^{n}\dfrac{n^\alpha\sqrt k}{A_n}(A_kS_{k+1}-A_{k-1}S_k)=\lim_{n\to\infty}\sum_{k=2}^{n}\dfrac{n^\alpha A_k}{A_n2^{k+2}\sqrt k}$$
      criteria: [4.M1]
    - id: 4b-2
      content: |
        (3)에 의해 $\dfrac{A_k}{\sqrt k}\le2$, $\dfrac{1}{A_n}\le\dfrac{1}{\sqrt{2n+1}}$이므로
        $$0\le\sum_{k=2}^{n}\dfrac{n^\alpha A_k}{A_n2^{k+2}\sqrt k}\le\dfrac{n^\alpha}{\sqrt{2n+1}}\sum_{k=2}^{n}\dfrac{1}{2^{k+1}}=\dfrac{n^\alpha}{\sqrt{2n+1}}\left(\dfrac14-\dfrac{1}{2^{n+1}}\right)$$
      criteria: [4.M2]
    - id: 4b-3
      content: |
        $\alpha<\dfrac12$이면 $\displaystyle\lim_{n\to\infty}\dfrac{1}{n^{1/2-\alpha}}=0$이므로 $\displaystyle\lim_{n\to\infty}\dfrac{n^\alpha}{\sqrt{2n+1}}\left(\dfrac14-\dfrac{1}{2^{n+1}}\right)=\lim_{n\to\infty}\dfrac{1}{n^{1/2-\alpha}}\sqrt{\dfrac{n}{2n+1}}\left(\dfrac14-\dfrac{1}{2^{n+1}}\right)=0$이고, 극한의 대소 관계(조임 정리)에 의해 구하는 극한값은 $0$이다.
      criteria: [4.A1]
