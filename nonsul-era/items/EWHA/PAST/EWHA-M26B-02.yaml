key_idea: |
  $n\le x<n+1$에서 $f(x)=1+\left(-\frac13\right)^n\left(\lvert\cos\pi u\rvert-1\right)$ ($u=2^n(x-n)-k\in[0,1)$)이므로 각 구간에서 $f$의 값 범위가 $[1,\frac43]$, $[\frac89,1]$, … 처럼 정해지고, 각 조각은 $\lvert\cos\pi x\rvert$를 가로로 $2^{-n}$배, 세로로 $3^{-n}$배 한 것이다.
stuck: |
  조건 (다)의 $2^n(x-n)-[2^n(x-n)]$이 구간 $[n,n+1)$을 $2^n$개 조각으로 나누어 각 조각에서 $\lvert\cos\pi u\rvert$를 재현한다는 해석
