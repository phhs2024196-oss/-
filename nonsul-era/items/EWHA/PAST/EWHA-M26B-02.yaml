stimuli: []

stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$가 다음 조건을 만족시킬 때, 아래 물음에 답하시오. [30점]

  (가) $-1<x<1$인 모든 실수 $x$에 대하여, $f(x)=\lvert\cos\pi x\rvert$이다.

  (나) 임의의 실수 $x$에 대해 $f(x)=f(-x)$이다.

  (다) 모든 자연수 $n$과 $n\le x<n+1$을 만족하는 실수 $x$에 대하여
  $$f(x)=1+\left(-\dfrac13\right)^n\left(f\left(2^n(x-n)-\left[2^n(x-n)\right]\right)-1\right)$$
  가 성립한다. (단, $[x]$는 $x$를 넘지 않는 최대의 정수이다.)

subparts:
- id: '1'
  stem: |
    모든 자연수 $n$에 대하여 $f(n)=1$임을 보이시오.
  points: 8
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=n$을 (다)에 대입하면 안쪽 인수가 $f(0)=1$.
    steps:
    - {id: 1a, content: '$f(n)=1+\left(-\frac13\right)^n(f(0)-1)=1$', criteria: [1.B1, 1.M1]}
    hint_ladder:
    - $x=n$이면 $2^n(x-n)$은?
  - id: S1-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.39
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에 의해 $f(0)=\lvert\cos0\rvert=1$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        모든 자연수 $n$에 대해서 조건 (다)에 의해
        $$f(n)=1+\left(-\dfrac13\right)^n\left(f\left(2^n(n-n)-[2^n(n-n)]\right)-1\right)=1+\left(-\dfrac13\right)^n(f(0)-1)=1$$
        이다.
      criteria: [1.M1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: |
        (가)로부터 $f(0)=1$을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        (다)에 $x=n$을 대입해 안쪽 인수가 $f(0)$이 됨을 보이고 $f(n)=1$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    deductions: []
  outcome_codes:
