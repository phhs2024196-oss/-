intent: |
  좌표평면의 정사각형에서 주어진 반사 규칙을 이해하고, 직선의 기울기·좌표평면의 대칭·수열의 합·정수의 성질(서로소)을 적용해 점들을 결정하는 수리적 문제해결력과 조작적 활용 능력을 평가한다(공식 출제의도 요지).
