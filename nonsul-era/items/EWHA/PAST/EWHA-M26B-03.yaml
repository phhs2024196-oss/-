stimuli: []

stem: |
  좌표평면 위의 네 점 $\mathrm{O}(0,0)$, $\mathrm{A}(1,0)$, $\mathrm{B}(1,1)$, $\mathrm{C}(0,1)$을 꼭짓점으로 하는 정사각형에 대하여 다음의 규칙에 따라 정사각형의 변 위의 점을 차례로 정할 때, 아래 물음에 답하시오. (단, 정사각형의 꼭짓점도 변 위의 점이다.) [30점]

  (가) 원점 $\mathrm{O}$를 첫 번째 점 $\mathrm{P}_1$로 정하고 선분 $\mathrm{AB}$의 한 점을 두 번째 점 $\mathrm{P}_2$로 정한다. 이때 선분 $\mathrm{P}_1\mathrm{P}_2$를 포함하는 직선의 기울기를 $m\ (0\le m\le1)$이라 한다.

  (나) 만약 $n\ (n>1)$번째 점 $\mathrm{P}_n$이 정사각형의 꼭짓점이면 점 $\mathrm{P}_{n+1}$을 새로 정하지 않고 점 $\mathrm{P}_n$을 끝점이라 한다.

  (다) 만약 $n\ (n>1)$번째 점 $\mathrm{P}_n$이 끝점이 아니면 $(n+1)$번째 점 $\mathrm{P}_{n+1}$을 선분 $\mathrm{P}_{n-1}\mathrm{P}_n$과 정사각형의 점 $\mathrm{P}_n$을 포함하는 변이 이루는 각의 크기가 선분 $\mathrm{P}_n\mathrm{P}_{n+1}$과 정사각형의 점 $\mathrm{P}_n$을 포함하는 변이 이루는 각의 크기가 같도록 정한다. (단, 점 $\mathrm{P}_{n+1}$과 점 $\mathrm{P}_{n-1}$은 같지 않다.)

subparts:
- id: '1'
  stem: |
    기울기 $m=\dfrac23$에 대하여 위의 규칙에 따라 정해진 점들 $\mathrm{P}_n\ (n=1,2,3,\cdots)$을 모두 구하시오.
  points: 8
  depends_on: []
  answer: {kind: set, value: '[(0,0), (1,2/3), (1/2,1), (0,2/3), (1,0)]', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 기울기 $\frac23$과 $-\frac23$을 번갈아 쓰며 변과의 교점을 차례로 구한다.
    steps:
    - {id: 1a, content: '$\mathrm{P}_1(0,0)$, $\mathrm{P}_2\left(1,\frac23\right)$, $\mathrm{P}_3\left(\frac12,1\right)$, $\mathrm{P}_4\left(0,\frac23\right)$, $\mathrm{P}_5(1,0)$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - 반사 후 직선의 기울기는 부호만 바뀐다.
  - id: S1-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.43
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        규칙에 따라 $\mathrm{P}_1=(0,0)$이다. 점 $\mathrm{P}_2$는 기울기 $\dfrac23$이고 원점을 지나는 직선 $y=\dfrac23x$와 직선 $x=1$의 교점이므로 $\mathrm{P}_2=\left(1,\dfrac23\right)$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        점 $\mathrm{P}_3$은 선분 $\mathrm{BC}$ 위의 점으로 기울기 $-\dfrac23$이고 $\mathrm{P}_2$를 지나는 직선 $y=-\dfrac23(x-1)+\dfrac23$과 직선 $y=1$의 교점이므로 $\mathrm{P}_3=\left(\dfrac12,1\right)$이다. 점 $\mathrm{P}_4$는 선분 $\mathrm{CO}$ 위의 점으로 기울기 $\dfrac23$이고 $\mathrm{P}_3$을 지나는 직선 $y=\dfrac23\left(x-\dfrac12\right)+1$과 $y$축의 교점이므로 $\mathrm{P}_4=\left(0,\dfrac23\right)$이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        점 $\mathrm{P}_5$는 선분 $\mathrm{OA}$ 위의 점으로 기울기 $-\dfrac23$이고 $\mathrm{P}_4$를 지나는 직선 $y=-\dfrac23x+\dfrac23$과 $x$축의 교점이므로 $\mathrm{P}_5=(1,0)$이다. $\mathrm{P}_5=(1,0)$은 꼭짓점 $\mathrm{A}$이므로 끝점이다(공식 해설의 「꼭짓점 B」는 A의 오식으로 보아 바로잡음). 따라서 구하는 점들은 $\mathrm{P}_1=(0,0)$, $\mathrm{P}_2=\left(1,\dfrac23\right)$, $\mathrm{P}_3=\left(\dfrac12,1\right)$, $\mathrm{P}_4=\left(0,\dfrac23\right)$, $\mathrm{P}_5=(1,0)$이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        반사 후 기울기가 $\pm\frac23$으로 번갈아 바뀜을 쓰고 $\mathrm{P}_2=\left(1,\frac23\right)$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\mathrm{P}_3=\left(\frac12,1\right)$, $\mathrm{P}_4=\left(0,\frac23\right)$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\mathrm{P}_5=(1,0)$이 꼭짓점이므로 끝점임을 밝히고 다섯 점을 모두 제시했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9517}
  misconceptions:
  - id: MC-GEO-9517
    outcome_code: '71'
    wrong_work: '반사 후에도 기울기 $\frac23$을 유지해 $\mathrm{P}_3$을 잘못 구함'
    detect_cue: $\mathrm{P}_3$이 $\left(\frac12,1\right)$이 아니다
    feedback: 세로 변(또는 가로 변)에서 반사하면 직선의 기울기 부호가 바뀝니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $\dfrac{1}{20}<m<1$인 기울기 $m$에 대하여 규칙에 따라 정해진 점들이 꼭짓점 $\mathrm{C}$를 제외한 선분 $\mathrm{BC}$위에 있지 않고 꼭짓점 $\mathrm{C}(0,1)$이 끝점이 된다. 조건을 만족시키는 기울기 $m$에 대하여 $\dfrac1m$을 모두 더한 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '90', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 펼치면 $\mathrm{C}$는 $(2p,2q-1)$이고, 선분 BC 위 점이 없으려면 위로의 대칭이동이 없어야 하므로 $(2p,1)$, 즉 $m=\frac{1}{2p}$.
    steps:
    - {id: 2a, content: '$\frac{1}{20}<\frac{1}{2p}<1\Rightarrow p=1,\cdots,9$, $\sum2p=90$', criteria: [2.M1, 2.R1, 2.A1]}
    hint_ladder:
    - 반사 대신 정사각형을 대칭이동해 펼쳐 보자.
    - 꼭짓점 C는 펼친 평면에서 어떤 좌표들로 옮겨지는가?
  - id: S2-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 pp.43-44
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        규칙 (다)는 점 $\mathrm{P}_n$을 포함하는 정사각형의 한 변에 대하여 대칭이동한 정사각형에 관한 조건으로 생각하면, 기울기 $m,-m$을 교차로 사용하는 대신 같은 기울기 $m$인 직선과 대칭이동된 정사각형의 변의 교점을 구하고 이를 역으로 대칭이동하여 점 $\mathrm{P}_{n+1}$을 정하는 것으로 바꿀 수 있다. 이렇게 처음 정사각형을 오른쪽 또는 위쪽으로 차례로 대칭이동하면 구하는 점들은 직선 $y=mx$와 이들 정사각형들의 변의 교점에 대응하고, 꼭짓점 $\mathrm{C}(0,1)$이 이동될 수 있는 점은 자연수 $p,q\ (p\ge q)$에 대하여 $(2p,2q-1)$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        꼭짓점 $\mathrm{C}$가 끝점이므로 점들은 $(2p,2q-1)$을 지나는 직선으로 정해진다. 만약 $2p$와 $2q-1$이 서로소가 아니면 $(2p,2q-1)$ 이전에 끝점에 대응하는 점이 결정되므로 $2p$와 $2q-1$은 서로소이다. 또 점들이 선분 $\mathrm{BC}$의 점을 포함하지 않으므로 위쪽으로의 대칭이동 없이 오른쪽으로만 대칭이동이 이루어지고, 따라서 $\mathrm{C}$가 이동되는 점은 $(2p,1)$ 꼴이다.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        이 점과 $\mathrm{P}_1=(0,0)$을 지나는 직선의 기울기는 $m=\dfrac{1}{2p}$이고 $2p$와 $1$은 서로소이다. $\dfrac{1}{20}<\dfrac{1}{2p}<1$에서 $\dfrac12<p<10$이므로 구하는 값은
        $$\sum_{p=1}^{9}\left(\dfrac{1}{2p}\right)^{-1}=2\sum_{p=1}^{9}p=2\cdot\dfrac{9(9+1)}{2}=90$$
        이다.
      criteria: [2.A1]
  - id: S2-ALT
    audience: ALT
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.44 별해
    method_no: 2
    key_idea: 기울기 $m$과 $-m$을 번갈아 쓰므로 짝수 번째 점은 모두 선분 AB, 홀수 번째 점은 모두 선분 CO에 나타나야 한다. 선분 AB를 짝수 개의 같은 크기로 나눈 점 중 $x$축에 가장 가까운 점 $\left(1,\frac{1}{2p}\right)$이 기울기를 정한다.
    steps:
    - id: 2c-1
      content: |
        $m=\dfrac{1}{2p}$, $\dfrac{1}{20}<\dfrac{1}{2p}<1$에서 $p=1,\cdots,9$이고 $\sum2p=90$.
      criteria: [2.M1, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        대칭이동(펼치기) 또는 AB·CO 위 점의 규칙으로 $\mathrm{C}$에 대응하는 점·기울기의 꼴을 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        선분 BC 위에 점이 없으므로 대응점이 $(2p,1)$ 꼴(즉 $m=\frac{1}{2p}$)임을 근거와 함께 밝혔다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $p=1,\cdots,9$를 찾고 $\sum\frac1m=90$을 구했다.
      depends_on: [2.M1]
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9517}
  misconceptions:
  - id: MC-GEO-9517
    outcome_code: '71'
    wrong_work: '$m=\frac1p$ 꼴(홀수 분모 포함)을 모두 더해 $\sum_{p=2}^{19}p$로 계산'
    detect_cue: 분모가 홀수인 기울기(끝점이 A 또는 B)가 포함되었다
    feedback: 펼친 평면에서 $x$좌표가 짝수여야 원래 정사각형의 $x=0$, 즉 꼭짓점 C에 대응합니다.
    remedy: [RL-1]

- id: '3'
  stem: |
    꼭짓점 $\mathrm{C}(0,1)$가 끝점 $\mathrm{P}_{15}$이 되는 기울기 $m$을 모두 구하시오.
  points: 12
  depends_on: ['2']
  answer: {kind: set, value: '[1/14, 7/8]', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 대칭이동 횟수 $(2p-1)+(2q-2)=13$에서 $p+q=8$, $(2p,2q-1)$이 서로소인 것만 고른다.
    steps:
    - {id: 3a, content: '$(14,1),(8,7)$ → $m=\frac{1}{14},\frac78$', criteria: [3.M1, 3.M2, 3.R1, 3.A1]}
    hint_ladder:
    - 점의 개수와 대칭이동 횟수의 관계는?
    - $(2p,2q-1)$에 도달하기 전에 다른 꼭짓점을 만나지 않으려면?
  - id: S3-B
    audience: B
    source_flow: 「2026 논술고사 안내」 우수답안 및 해설 p.45
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        끝점 $\mathrm{P}_{15}$가 꼭짓점 $\mathrm{C}(0,1)$이 되기 위해서는 $\mathrm{P}_k\ (1\le k\le14)$은 모두 꼭짓점이 아닌 변 위에 존재하고 이 변들은 (2)의 풀이와 같이 대칭에 활용된다. 꼭짓점 $\mathrm{C}$를 대칭이동하여 도달할 수 있는 점은 자연수 $p,q\ (p\ge q)$에 대하여 $(2p,2q-1)$의 꼴이며 $2p$와 $2q-1$이 서로소이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
