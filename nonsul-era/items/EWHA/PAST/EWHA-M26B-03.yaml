  반사 대신 정사각형을 변에 대해 대칭이동해 펼치면 점들은 직선 $y=mx$와 격자선의 교점에 대응한다. 꼭짓점 $\mathrm{C}$는 펼친 평면의 $(2p,2q-1)$에 대응하고, 끝점이 되려면 $2p$와 $2q-1$이 서로소여야 한다.
