intent: |
  주어진 함수 $f(x)=x\ln x$의 성질을 파악하고 함숫값들의 대소관계를 도출하는 문제이다. 연속함수에 대한 사잇값의 정리와 미분가능한 함수의 평균값 정리, 도함수를 이용한 함수의 증감상태를 파악하는 능력, 함수가 특정한 값을 갖는 점이 유일하게 존재함을 증감상태와 사잇값의 정리로 추론하는 능력을 평가한다(공식 출제 의도 요지).
key_idea: |
  $f(x)=x\ln x$의 도함수 $f'(x)=1+\ln x$가 증가함수라는 사실을 (1)~(4) 전체에 쓴다: 증가 구간(1)(2), 평균값 정리(3), 두 구간의 평균변화율 비교(4).
stuck: |
  (4)에서 $z=\dfrac{x+y}{2}$를 잡고 $[x,z]$, $[z,y]$ 두 구간에 평균값 정리를 각각 적용해 기울기를 비교하는 발상
