intent: |
  조합을 이용한 경우의 수, 이산확률변수와 확률분포, 이산확률변수의 기댓값의 정의를 바탕으로, 네 장을 뽑아 작은 수부터 나열했을 때 인접한 두 수의 차이 값의 최솟값으로 정의되는 확률변수에 대해 특정 사건의 경우의 수와 기댓값을 구한다. 인접한 차이에 조건이 부여된 네 수의 선택을 중복조합 문제로 바꾸는 추론 능력과 기댓값 계산 능력을 평가한다(공식 출제 의도 요지).
key_idea: |
  뽑히지 않은 8개의 수를 $\square a_1\square a_2\square a_3\square a_4\square$의 다섯 칸에 나누어 넣고, 가운데 세 칸의 최소 개수를 빼서 음이 아닌 정수해의 개수(중복조합)로 센다.
stuck: |
  「인접한 차가 모두 $d$ 이상」을 가운데 칸에 $d-1$개 이상이 들어가는 조건으로 바꾸고, $M=d$를 $M\ge d$와 $M\ge d+1$의 차로 구하는 발상
idea_tags: [IDEA-GAP-TO-STARS-BARS, IDEA-EXACT-AS-DIFF-OF-AT-LEAST]
tags: [중복조합, 기댓값, 최소 간격]
