  - '치환 $m_i=n_i-(d-1)$'
  - '$P(M=d)=P(M\ge d)-P(M\ge d+1)$ 꼴의 차'
  conditions:
  - '$a_1<a_2<a_3<a_4$, 각 $a_{i+1}-a_i\ge d$'
  - '$M\ge4$는 불가능($a_4\ge12+a_1$)'
