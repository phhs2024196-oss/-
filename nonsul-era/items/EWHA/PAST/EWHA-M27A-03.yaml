# 메모: 공식 예시답안 (2)는 "접할 때 n(A∩B)=4를 만족한다"(충분조건)만 서술하고, n(A∩B)=4 ⇒ 접함(ab=4)의 역방향 근거는 생략함. 검산에서 ab<4 → 교점 0, ab>4 → 교점 8 임을 수치로 확인.
