intent: |
  절댓값을 포함한 등식으로 주어진 도형이 두 축에 대하여 대칭임을 파악하고, 도형의 기하학적 성질을 관찰하여 넓이의 불변성을 증명하며, 부등식의 성질로 둘레의 길이의 최솟값을 구하는 능력을 평가한다. 미분을 통한 접선의 방정식 도출을 주요 방법으로 착안·활용하는 능력을 본다(공식 출제 의도 요지).
key_idea: |
  두 도형이 두 축에 대하여 대칭이므로 $n(A\cap B)=4$는 제1사분면에서 직선 $\tfrac xa+\tfrac yb=1$이 $y=\tfrac1x$에 접하는 것과 같고, (1)의 접선식에서 $a=2\alpha$, $b=\tfrac2\alpha$, 즉 $ab=4$.
stuck: |
  교점 4개 조건을 「제1사분면에서 접한다」로 바꾸고, 접선의 절편으로 $a$, $b$를 표현하는 발상
