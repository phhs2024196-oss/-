stimuli: []

stem: |
  함수 $f(x)=\lvert x\rvert e^{\lvert x\rvert}$와 실수 $a$에 대하여 두 점 $(a,f(a))$, $(a+1,f(a+1))$을 잇는 선분과 곡선 $y=f(x)$로 둘러싸인 부분의 넓이를 $S(a)$라 할 때, 아래 물음에 답하시오. [40점]

subparts:
- id: '1'
  stem: |
    곡선 $y=f(x)$는 각각의 구간 $(0,\infty)$, $(-\infty,0)$에서 아래로 볼록함을 보이시오.
  points: 6
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x>0$에서 $f^{\prime\prime}(x)=(x+2)e^x>0$, 우함수이므로 $x<0$도 대칭.
    steps:
    - {id: 1a, content: '$f^{\prime\prime}(x)=(x+2)e^x>0$ $(x>0)$, $f(-x)=f(x)$', criteria: [1.M1, 1.A1, 1.R1]}
    hint_ladder:
    - 아래로 볼록은 이계도함수의 부호로 판정한다.
    - $f(-x)$와 $f(x)$를 비교해 보자.
  - id: S1-B
    audience: B
    source_flow: 2027 논술고사 안내 p.29
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        구간 $(0,\infty)$에서 $f(x)=xe^x$이므로 $f^{\prime}(x)=(x+1)e^x$, $f^{\prime\prime}(x)=(x+2)e^x>0$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 $f(x)$는 $(0,\infty)$에서 아래로 볼록인 함수이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        모든 실수 $x$에 대하여 $f(-x)=f(x)$이므로 곡선 $y=f(x)$는 $y$축에 대하여 대칭이다. 따라서 $(-\infty,0)$에서도 아래로 볼록이다.
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $x>0$에서 $f^{\prime\prime}(x)=(x+2)e^x$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $f^{\prime\prime}(x)>0$이므로 $(0,\infty)$에서 아래로 볼록이라고 적었다.
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: |
        $f(-x)=f(x)$(또는 $x<0$에서 $f^{\prime\prime}(x)=(2-x)e^{-x}>0$ 직접 계산)로 $(-\infty,0)$의 볼록성을 보였다.
      depends_on: []
      steps: [1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9561}
  misconceptions:
  - id: MC-CAL-9561
    outcome_code: '71'
    wrong_work: '$f^{\prime}(x)=(x+1)e^x>0$이므로 아래로 볼록'
    detect_cue: 이계도함수가 없다
    feedback: 증가는 일계도함수, 아래로 볼록은 이계도함수의 부호로 판정합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $x_1<x_2$인 실수 $x_1,x_2$에 대하여 곡선 $y=f(x)$ 위의 두 점 $\mathrm{P}=(x_1,f(x_1))$, $\mathrm{Q}=(x_2,f(x_2))$ 사이의 곡선 부분이 선분 $\mathrm{PQ}$보다 아래쪽에 있음을 보이시오.
  points: 8
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 같은 쪽이면 (1)의 볼록성, $x_1<0<x_2$이면 원점 O를 거쳐 PO, OQ가 각각 곡선 위에 있고, $f(x_1),f(x_2)>0$이므로 PO, OQ는 PQ 아래.
    steps:
    - {id: 2a, content: '경우 (i) $x_1,x_2\ge0$ (ii) $\le0$ (iii) $x_1<0<x_2$: 원점 경유', criteria: [2.M1, 2.R1, 2.R2]}
    hint_ladder:
    - 두 점이 $y$축의 같은 쪽에 있는 경우와 다른 쪽에 있는 경우로 나누자.
    - 다른 쪽이면 원점을 거쳐 생각하자.
  - id: S2-B
    audience: B
    source_flow: 2027 논술고사 안내 p.30
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $x_1,x_2\ge0$, $x_1,x_2\le0$, $x_1<0<x_2$인 경우로 나눈다. (i) $x_1,x_2\ge0$: (1)에서 $f$는 $(0,\infty)$에서 아래로 볼록이므로 $0<x_1<x_2$일 때 곡선 부분은 선분 PQ보다 아래에 있다. $x_1=0$, $x_2=\alpha>0$이면 직선 PQ는 $y=e^\alpha x$이고 $0<x<\alpha$에서 $e^\alpha x-f(x)=x(e^\alpha-e^x)>0$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        (ii) $x_1,x_2\le0$: $f(-x)=f(x)$로 곡선이 $y$축에 대하여 대칭이므로 (i)에서 성립한다.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        (iii) $x_1<0<x_2$: 원점 $\mathrm{O}=(0,f(0))$에 대해 $f$가 $[0,\infty)$, $(-\infty,0]$에서 각각 아래로 볼록하므로 P, O 사이의 곡선은 선분 PO보다, O, Q 사이의 곡선은 선분 OQ보다 아래쪽에 있다. $f(x_1)>0$, $f(x_2)>0$이므로 선분 PO와 OQ는 선분 PQ 아래에 있다. 따라서 곡선 부분은 선분 PQ보다 아래쪽에 있다.
      criteria: [2.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        경우를 나누고, 같은 쪽($\ge0$)인 경우를 (1)의 볼록성(끝점 0 포함)으로 처리했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1, 2a]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        $x_1,x_2\le0$ 경우를 대칭성으로 처리했다.
      depends_on: []
      steps: [2b-2, 2a]
    - id: 2.R2
      mark_type: R
      points: 3
      evidence: |
        $x_1<0<x_2$ 경우를 원점을 거쳐 PO, OQ와 PQ의 위치 관계($f(x_1),f(x_2)>0$)로 보였다.
      depends_on: []
      steps: [2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9562}
  misconceptions:
  - id: MC-CAL-9562
    outcome_code: '71'
    wrong_work: '두 구간에서 아래로 볼록이므로 모든 $x_1<x_2$에 대해 성립한다'
    detect_cue: $x_1<0<x_2$인 경우에 대한 별도 논증이 없다
    feedback: 볼록성은 구간마다 주어졌으므로, 두 점이 원점 양쪽에 있을 때는 따로 보여야 합니다(원점에서 미분가능하지 않음).
    remedy: [RL-2]

- id: '3'
  stem: |
    함수 $S(a)$가 미분가능하지 않은 실수 $a$의 값을 모두 구하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: set, value: '{-1, 0}', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $S(a)=\tfrac{f(a)+f(a+1)}{2}-\int_a^{a+1}f$를 세 경우로 구하고 $a=0$에서 우미분계수 $\tfrac12$, 좌미분계수 $-\tfrac12$; 대칭으로 $a=-1$도.
    steps:
    - {id: 3a, content: '$S^{\prime}(0^+)=\tfrac12\ne-\tfrac12=S^{\prime}(0^-)$, $S(a)=S(-a-1)$ ⇒ $a=-1,0$', criteria: [3.M1, 3.A1, 3.M2, 3.A2]}
    hint_ladder:
    - 적분 구간 $[a,a+1]$이 0을 포함하는지에 따라 나누자.
    - $S(a)$와 $S(-a-1)$의 관계는?
  - id: S3-B
    audience: B
    source_flow: 2027 논술고사 안내 pp.30-32
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2)에서 선분이 곡선 위쪽에 있으므로 네 점 $(a,0)$, $(a,f(a))$, $(a+1,f(a+1))$, $(a+1,0)$의 사다리꼴 넓이에서 빼서
        $$S(a)=\dfrac{f(a)+f(a+1)}{2}-\int_a^{a+1}f(x)\,dx.$$
      criteria: [3.M1]
    - id: 3b-2
      content: |
        (i) $a\ge0$: $\displaystyle\int_a^{a+1}xe^x\,dx=\big[(x-1)e^x\big]_a^{a+1}=ae^{a+1}-(a-1)e^a$이므로 $S(a)=\dfrac{e^a\big((3-e)a+e-2\big)}{2}$.
        (ii) $-1<a<0$: $S(a)=\dfrac{-ae^{-a}+(a+1)e^{a+1}}{2}+\displaystyle\int_a^0 xe^{-x}\,dx-\int_0^{a+1}xe^x\,dx=\dfrac{(a+2)e^{-a}}{2}+\dfrac{(1-a)e^{a+1}}{2}-2$.
        (iii) $a\le-1$: 대칭성에 의해 $S(a)=S(-a-1)=\dfrac{e^{-a-1}\big((e-3)a+2e-5\big)}{2}$.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        $a>0$에서 $S^{\prime}(a)=\dfrac{e^a\big((3-e)a+1\big)}{2}$, $-1<a<0$에서 $S^{\prime}(a)=-\dfrac{(a+1)e^{-a}+ae^{a+1}}{2}$이고, $a<-1$에서 $S^{\prime}(a)=-S^{\prime}(-a-1)$이다.
        $$\lim_{h\to0+}\dfrac{S(h)-S(0)}{h}=\dfrac{3-e}{2}+\dfrac{e-2}{2}=\dfrac12,\qquad \lim_{h\to0-}\dfrac{S(h)-S(0)}{h}=\dfrac12-\dfrac e2-1+\dfrac e2=-\dfrac12$$
        이므로 $S$는 $a=0$에서 미분가능하지 않다.
      criteria: [3.M2]
    - id: 3b-4
      content: |
        $S(a)=S(-a-1)$이므로 대칭성에 의해 $a=-1$에서도 미분가능하지 않다. 나머지 점에서는 각 식이 미분가능하므로 구하는 값은 $a=-1,0$이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $S(a)$를 사다리꼴 넓이 − 정적분으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3a]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $a\ge0$, $-1<a<0$, $a\le-1$ 각 경우의 $S(a)$ 식을 구했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        $a=0$에서 좌·우미분계수 $-\tfrac12$, $\tfrac12$를 계산해 비교했다.
      depends_on: []
      implied_ok: false
      steps: [3b-3, 3a]
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: |
        대칭성으로 $a=-1$도 포함하여 $a=-1,0$이라고 답했다.
      depends_on: [3.M2]
      steps: [3b-4, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9563}
  - {code: '72', misconception: MC-CAL-9564}
  misconceptions:
  - id: MC-CAL-9563
    outcome_code: '71'
    wrong_work: '모든 $a$에 대해 $S(a)=\tfrac{e^a((3-e)a+e-2)}{2}$로 계산해 미분불가능한 점이 없다고 답함'
    detect_cue: 적분 구간이 0을 포함하는 경우의 분리가 없다
    feedback: $f(x)=\lvert x\rvert e^{\lvert x\rvert}$의 식은 $x=0$에서 바뀝니다. $[a,a+1]$이 0을 포함하는지로 경우를 나누세요.
    remedy: [RL-3]
  - id: MC-CAL-9564
    outcome_code: '72'
    wrong_work: '$S$가 연속이므로 $a=0$에서 미분가능하다고 하거나 $a=0$만 답함'
    detect_cue: 좌·우미분계수 계산이 없거나 $a=-1$이 빠졌다
    feedback: 경계점에서는 좌·우미분계수를 각각 계산해 비교하고, $S(a)=S(-a-1)$ 대칭으로 대응점도 확인하세요.
    remedy: [RL-3]

- id: '4'
  stem: |
    함수 $S(a)$의 최솟값을 구하시오.
  points: 8
  depends_on: ['3']
