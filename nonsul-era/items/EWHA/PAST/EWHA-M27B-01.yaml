intent: |
  절댓값과 지수함수를 포함한 함수의 그래프 성질을 분석하고 곡선과 선분으로 둘러싸인 영역의 넓이를 탐구하여 미분과 적분의 활용 능력을 평가한다. 연속성·미분가능성·이계도함수로 볼록성을 판단하고, 절댓값 때문에 구간이 나뉘는 상황을 처리하며, 그래프의 성질과 방정식의 해의 개수 판단을 연결하는 통합적 문제 해결 능력을 본다(공식 출제 의도 요지).
key_idea: |
  $f$가 우함수이고 각 반직선에서 아래로 볼록이므로 현은 항상 곡선 위에 있고, $S(a)=\dfrac{f(a)+f(a+1)}{2}-\displaystyle\int_a^{a+1}f(x)\,dx$를 $a\ge0$, $-1<a<0$, $a\le-1$로 나누어 구한다. 대칭 $S(a)=S(-a-1)$.
stuck: |
  $x_1<0<x_2$인 경우를 원점을 거쳐 처리하는 것, 그리고 $S(a)=S(-a-1)$ 대칭과 $a=0,-1$에서 좌·우미분계수 비교
idea_tags: [IDEA-EVEN-FUNC-SYMMETRY, IDEA-TRAPEZOID-MINUS-INTEGRAL, IDEA-ONE-SIDED-DERIV-KINK]
tags: [지수함수, 절댓값, 볼록성, 넓이 함수, 미분가능성, 실근 개수]
