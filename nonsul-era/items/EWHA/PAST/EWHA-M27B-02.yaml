intent: |
  원순열의 개념과 경우의 수의 합의 법칙·곱의 법칙을 이해하고, 부부가 이웃하여 앉는 조건을 하나의 단위로 묶어 처리하는 방법으로 경우의 수를 구한다. 정확히 특정 수의 부부만 이웃하는 경우를 구하며 중복 계산된 경우를 제거·보정하는 논리적 추론 능력, 수열의 일반항으로 합을 구하고 범위를 판단하는 논증력을 평가한다(공식 출제 의도 요지).
key_idea: |
  이웃하지 않을 부부를 먼저 고르고, 나머지 부부를 묶음으로 본 원순열에서 고른 부부가 이웃하는 경우를 (1)·(2)의 결과로 뺀다(두 부부면 포함배제). (4)는 $\dfrac{a_k}{2^{k-1}3^{k+1}}=\dfrac{(k+1)!}{3^{k+1}}-\dfrac{k!}{3^k}$의 망원합.
stuck: |
  「정확히 $(k-1)$쌍」을 이웃하지 않는 부부 1쌍 선택 × (나머지 묶음 원순열 − 그 부부도 이웃하는 경우)로 세는 발상, (4)에서 $k-2=(k+1)-3$으로 쪼개는 발상
