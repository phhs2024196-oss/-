stimuli: []

stem: |
  좌표평면에 주어진 두 집합
  $$A=\left\{(x,y)\ \middle|\ \dfrac{\lvert x\rvert}{a}+\dfrac{\lvert y\rvert}{b}=1\right\},\quad B=\left\{(x,y)\ \middle|\ \lvert xy^k\rvert=c\right\}$$
  에 대하여 $n(A\cap B)=4$일 때 다음 물음에 답하시오.(단, $a,b,c$는 양수이고 $k$는 자연수이다.) [30점]

subparts:
- id: '1'
  stem: |
    주어진 $c>0$에 대하여 $k=1$일 때 집합 $A$가 나타내는 도형의 넓이가 $a,b$에 관계없이 일정함을 보이고, 이때 집합 $A$가 나타내는 도형의 둘레의 길이의 최솟값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: expression, value: 'area = 8*c; min = 8*sqrt(2*c)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 제1사분면에서 $y=\tfrac cx$에 접함 → $a=2\alpha$, $b=\tfrac{2c}{\alpha}$ → 넓이 $2ab=8c$; 둘레 $4\sqrt{a^2+b^2}\ge4\sqrt{2ab}=8\sqrt{2c}$.
    steps:
    - {id: 1a, content: '$2ab=8c$, $4\sqrt{a^2+b^2}\ge4\sqrt{8c}=8\sqrt{2c}$', criteria: [1.R1, 1.M1, 1.A1, 1.M2, 1.A2]}
    hint_ladder:
    - 대칭성을 이용해 제1사분면만 보자. 교점은 몇 개여야 하는가?
    - 접선의 $x$절편과 $y$절편이 곧 $a$, $b$이다.
  - id: S1-B
    audience: B
    source_flow: 2027 논술고사 안내 p.37
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $A$, $B$가 나타내는 도형이 모두 $x$축과 $y$축에 대하여 대칭이므로 $k=1$일 때 직선 $\dfrac xa+\dfrac yb=1$이 제1사분면에서 곡선 $y=\dfrac cx$에 접할 때 $n(A\cap B)=4$를 만족한다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        점 $\left(\alpha,\dfrac c\alpha\right)$ $(\alpha>0)$에서 접한다고 하면 $y^{\prime}=-\dfrac{c}{x^2}$이므로 접선은 $y-\dfrac c\alpha=-\dfrac{c}{\alpha^2}(x-\alpha)$이다. $x$축과의 교점 $(2\alpha,0)$, $y$축과의 교점 $\left(0,\dfrac{2c}{\alpha}\right)$이므로 $a=2\alpha$, $b=\dfrac{2c}{\alpha}$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $A$는 대각선의 길이가 $2a$, $2b$인 마름모이므로 넓이는 $\dfrac12(2a\cdot2b)=2ab=2\left(2\alpha\cdot\dfrac{2c}{\alpha}\right)=8c$로 $a,b$에 관계없이 일정하다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        둘레의 길이는 $4\sqrt{a^2+b^2}$이고 $ab=4c$이므로 산술평균-기하평균의 부등식에 의해 $a^2+b^2\ge2\sqrt{a^2b^2}=2ab=8c$이다.
      criteria: [1.M2]
    - id: 1b-5
      content: |
        따라서 둘레의 길이의 최솟값은 $4\sqrt{8c}=8\sqrt{2c}$이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        대칭성으로 $n(A\cap B)=4$를 제1사분면에서의 접함 조건으로 바꾸었다.
      depends_on: []
      steps: [1b-1, 1a]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        접선의 방정식과 절편으로 $a=2\alpha$, $b=\tfrac{2c}{\alpha}$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1a]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        넓이 $2ab=8c$로 일정함을 결론지었다.
      depends_on: [1.M1]
      steps: [1b-3, 1a]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        둘레 $4\sqrt{a^2+b^2}$와 $ab=4c$, 산술기하평균 부등식을 적용했다.
      depends_on: []
      implied_ok: false
      steps: [1b-4, 1a]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        최솟값 $8\sqrt{2c}$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-5, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-9558}
  - {code: '72', misconception: MC-GEO-9559}
  misconceptions:
  - id: MC-GEO-9558
    outcome_code: '71'
    wrong_work: '마름모와 곡선이 만나기만 하면 된다고 보고 $ab\ge4c$로 처리'
    detect_cue: 접함(제1사분면 교점 1개) 조건이 없다
    feedback: 대칭이므로 한 사분면의 교점이 정확히 하나, 즉 직선이 곡선에 접해야 합니다.
    remedy: [RL-1]
  - id: MC-GEO-9559
    outcome_code: '72'
    wrong_work: '둘레를 $4(a+b)$로 두어 최솟값 $16\sqrt c$'
    detect_cue: 한 변을 $a+b$로 썼다
    feedback: 마름모의 한 변은 $\sqrt{a^2+b^2}$입니다.
    remedy: [RL-2]

- id: '2'
  stem: |
    자연수 $k$에 대하여 집합 $A$가 나타내는 도형의 넓이를 집합 $A\cap B$의 원소들을 꼭짓점으로 하는 사각형의 넓이로 나눈 값을 $h_k$라고 하자. 이때, $h_k$가 양수 $a,b,c$와 관계없이 일정함을 보이고 $h_k$를 $k$에 관한 식으로 나타내시오.
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: '(k+1)**2/(2*k)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 접점 $\left(\tfrac{c}{\alpha^k},\alpha\right)$, $a=\tfrac{c(k+1)}{\alpha^k}$, $b=\tfrac{k+1}{k}\alpha$; 마름모 $2ab$, 직사각형 $\tfrac{4c}{\alpha^{k-1}}$.
    steps:
    - {id: 2a, content: '$h_k=\dfrac{2c(k+1)^2/(k\alpha^{k-1})}{4c/\alpha^{k-1}}=\dfrac{(k+1)^2}{2k}$', criteria: [2.M1, 2.A1, 2.M2, 2.A2]}
    hint_ladder:
    - $x=\tfrac{c}{y^k}$를 $y$의 함수로 보고 미분하자.
    - 교점 네 개는 어떤 사각형을 이루는가?
  - id: S2-B
    audience: B
    source_flow: 2027 논술고사 안내 pp.37-38
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        대칭성에 의해 직선 $\dfrac xa+\dfrac yb=1$이 제1사분면에서 곡선 $x=\dfrac{c}{y^k}$에 접할 때 $n(A\cap B)=4$이다. 점 $\left(\dfrac{c}{\alpha^k},\alpha\right)$에서 접한다고 하면 $x$를 $y$에 대해 미분하여 $x^{\prime}=-\dfrac{ck}{y^{k+1}}$이므로 접선은 $x-\dfrac{c}{\alpha^k}=-\dfrac{ck}{\alpha^{k+1}}(y-\alpha)$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $x$축과의 교점 $\left(\dfrac{c(k+1)}{\alpha^k},0\right)$, $y$축과의 교점 $\left(0,\dfrac{k+1}{k}\alpha\right)$이므로 $a=\dfrac{c(k+1)}{\alpha^k}$, $b=\dfrac{k+1}{k}\alpha$이고, 마름모의 넓이는 $2ab=2c\dfrac{(k+1)^2}{k\alpha^{k-1}}$이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        대칭성에 의해 $A\cap B=\left\{\left(\pm\dfrac{c}{\alpha^k},\pm\alpha\right)\right\}$이고 이들을 꼭짓점으로 하는 사각형은 직사각형이며 넓이는 $4\left(\dfrac{c}{\alpha^k}\cdot\alpha\right)=\dfrac{4c}{\alpha^{k-1}}$이다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        따라서 $h_k=\left(2c\dfrac{(k+1)^2}{k\alpha^{k-1}}\right)\left(\dfrac{4c}{\alpha^{k-1}}\right)^{-1}=\dfrac{(k+1)^2}{2k}$이므로 $h_k$는 $a,b,c$와 관계없이 일정하다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        제1사분면 접함 조건으로 바꾸고 $x=\tfrac{c}{y^k}$의 접선의 방정식을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.R1], max_points: 3}
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $a=\tfrac{c(k+1)}{\alpha^k}$, $b=\tfrac{k+1}{k}\alpha$와 마름모 넓이를 구했다.
      depends_on: [2.M1]
      steps: [2b-2, 2a]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        교점 네 개로 이루어진 직사각형의 넓이 $\tfrac{4c}{\alpha^{k-1}}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3, 2a]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $h_k=\tfrac{(k+1)^2}{2k}$를 얻고 $a,b,c$와 무관함을 밝혔다.
      depends_on: [2.A1, 2.M2]
      steps: [2b-4, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-9571}
  misconceptions:
  - id: MC-CAL-9571
    outcome_code: '71'
    wrong_work: '$x$절편을 $b$, $y$절편을 $a$로 대응하거나 절편 계산에서 $x=0$, $y=0$을 바꾸어 대입'
    detect_cue: $a=\tfrac{k+1}{k}\alpha$ 꼴이 나왔다
    feedback: $\tfrac xa+\tfrac yb=1$에서 $a$는 $x$절편, $b$는 $y$절편입니다. 접선에 $y=0$을 넣어 $x$절편을 구하세요.
    remedy: [RL-3]

- id: '3'
  stem: |
    문항(2)의 $h_k$에 대하여 $\displaystyle\sum_{k=1}^{\infty}\dfrac{4}{k^2h_{k+1}}$의 값을 구하시오.
  points: 8
  depends_on: ['2']
  answer: {kind: value, value: '5/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{4}{k^2h_{k+1}}=\dfrac{8(k+1)}{k^2(k+2)^2}=2\left(\dfrac1{k^2}-\dfrac1{(k+2)^2}\right)$, 한 칸 건너 소거 → $2\left(1+\tfrac14\right)$.
    steps:
    - {id: 3a, content: '$2\left(1+\tfrac1{2^2}\right)=\tfrac52$', criteria: [3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - $(k+2)^2-k^2$을 계산해 보자.
  - id: S3-B
    audience: B
    source_flow: 2027 논술고사 안내 p.38
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2)에서 $h_k=\dfrac{(k+1)^2}{2k}$이므로 $\dfrac{4}{k^2h_{k+1}}=\dfrac{8(k+1)}{k^2(k+2)^2}=2\left(\dfrac1{k^2}-\dfrac1{(k+2)^2}\right)$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $\displaystyle\sum_{k=1}^{\infty}\dfrac{4}{k^2h_{k+1}}=\lim_{n\to\infty}\sum_{k=1}^{n}2\left(\dfrac1{k^2}-\dfrac1{(k+2)^2}\right)=\lim_{n\to\infty}2\left(1+\dfrac1{2^2}-\dfrac1{(n+1)^2}-\dfrac1{(n+2)^2}\right)$
      criteria: [3.M2]
    - id: 3b-3
      content: |
        $=\dfrac52$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        일반항을 $2\left(\tfrac1{k^2}-\tfrac1{(k+2)^2}\right)$로 분해했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A2], max_points: 3}
      steps: [3b-1, 3a]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        부분합을 구해 남는 항 $1+\tfrac1{2^2}-\tfrac1{(n+1)^2}-\tfrac1{(n+2)^2}$을 적고 극한을 취했다.
      depends_on: [3.M1]
      steps: [3b-2, 3a]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $\tfrac52$를 얻었다.
      depends_on: [3.M2]
      steps: [3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-9572}
  misconceptions:
  - id: MC-ALG-9572
    outcome_code: '71'
    wrong_work: '첫 항 $1$만 남겨 합을 $2$로 답함'
    detect_cue: 남는 항에 $\tfrac1{2^2}$이 없다
    feedback: 두 칸 차이로 소거되므로 앞의 두 항 $\tfrac1{1^2}$, $\tfrac1{2^2}$이 남습니다.
    remedy: [RL-4]

