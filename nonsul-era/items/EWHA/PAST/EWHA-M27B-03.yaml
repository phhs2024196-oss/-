  - '마름모의 넓이·둘레'
  - '산술평균과 기하평균의 관계'
  - '급수의 합(부분합의 극한)'
  tools:
  - '$x=\tfrac{c}{y^k}$에서 $\tfrac{dx}{dy}=-\tfrac{ck}{y^{k+1}}$'
  - '접선의 $x$절편·$y$절편 = $a$, $b$'
