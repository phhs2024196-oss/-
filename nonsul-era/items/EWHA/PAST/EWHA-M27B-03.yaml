intent: |
  절댓값을 포함한 등식으로 정의된 집합이 나타내는 도형이 좌표축에 대하여 대칭임을 이해하고, 넓이의 불변성을 증명하며 둘레의 길이의 최솟값과 넓이의 비율로 정의된 급수의 합을 구하는 종합 문제이다. 적절한 함수를 설정하고 미분으로 접선의 방정식을 도출해 활용하는 능력, 급수의 합에 관한 개념적 이해와 계산 능력을 평가한다(공식 출제 의도 요지).
key_idea: |
  대칭성으로 제1사분면에서 직선 $\tfrac xa+\tfrac yb=1$이 곡선 $x=\tfrac{c}{y^k}$에 접하는 조건으로 바꾸고, 접점 $\left(\tfrac{c}{\alpha^k},\alpha\right)$에서의 접선 절편으로 $a=\tfrac{c(k+1)}{\alpha^k}$, $b=\tfrac{k+1}{k}\alpha$를 얻는다.
stuck: |
  $x=\dfrac{c}{y^k}$를 $y$의 함수로 보고 미분해 접선을 구하는 것, 넓이 비에서 $\alpha$와 $c$가 소거됨을 보는 것
idea_tags: [IDEA-SYMMETRY-REDUCE-QUADRANT, IDEA-TANGENT-INTERCEPTS, IDEA-PARTIAL-FRACTION-TELESCOPE]
tags: [절댓값 도형, 마름모, 접선, 넓이 비, 급수]
