stem: |
  함수 $g(x)$를 $x$와 $1$ 중에서 크지 않은 수로 정의하자. 구간 $(-1,\ \infty)$에서 정의된 함수 $f(x)=g(x)-\dfrac{x}{1+x}$에 대하여 $\displaystyle\lim_{x\to1-}\frac{f(x)-f(1)}{x-1}$와 $\displaystyle\lim_{x\to1+}\frac{f(x)-f(1)}{x-1}$의 값을 구하는 다음의 풀이 과정을 완성하시오.

  [풀이 과정] $x<1$일 때 $f(x)=$ ( ① ), $x>1$일 때 $f(x)=$ ( ② ).
  $f(1)=\dfrac{1}{2}$이므로 $\displaystyle\lim_{x\to1-}\frac{f(x)-f(1)}{x-1}=$ ( ③ ),
  $\displaystyle\lim_{x\to1+}\frac{f(x)-f(1)}{x-1}=$ ( ④ ) 이다.
subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '① x^2/(1+x)  ② 1/(1+x)  ③ 3/4  ④ -1/4', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $\min(x,1)$로 구간을 나누면 $f$가 두 유리함수로 쓰이고, 차분몫을 통분해 $(x-1)$을 약분한다.
    steps:
    - id: '1a'
      content: |
        $f(x)=\dfrac{x^2}{1+x}\ (x<1)$, $f(x)=\dfrac{1}{1+x}\ (x>1)$, 좌극한 $\dfrac34$, 우극한 $-\dfrac14$
      criteria: ['1.M1', '1.B2', '1.A1', '1.A2']
    hint_ladder:
    - '「크지 않은 수」는 두 수 중 작은 쪽(같으면 그 수)입니다. $x<1$, $x>1$에서 $g(x)$는?'
    - '$\dfrac{x^2}{1+x}-\dfrac12$를 통분하면 분자에 $(x-1)$이 인수로 나옵니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '답안지(자연).hwp [자연 7] 문항카드 5. 문항 해설·6. 채점 기준 + 보고서 자연A 문제7 카드(PDF 269~271쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $x<1$일 때 $g(x)=x$이므로 $f(x)=x-\dfrac{x}{1+x}=\dfrac{x^2}{1+x}$.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $x>1$일 때 $g(x)=1$이므로 $f(x)=1-\dfrac{x}{1+x}=\dfrac{1}{1+x}$.
      criteria: ['1.B2']
    - id: '1b-3'
      content: |
        $f(1)=\dfrac12$이므로
        $$\lim_{x\to1-}\frac{f(x)-f(1)}{x-1}=\lim_{x\to1-}\frac{\frac{x^2}{1+x}-\frac12}{x-1}=\lim_{x\to1-}\frac{(2x+1)(x-1)}{2(1+x)(x-1)}=\frac34$$
      criteria: ['1.A1']
    - id: '1b-4'
      content: |
        $$\lim_{x\to1+}\frac{f(x)-f(1)}{x-1}=\lim_{x\to1+}\frac{\frac{1}{1+x}-\frac12}{x-1}=\lim_{x\to1+}\frac{1-x}{2(1+x)(x-1)}=-\frac14$$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 2
      evidence: |
        ① $f(x)=\dfrac{x^2}{1+x}$ 또는 $f(x)=x-\dfrac{x}{1+x}$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.B2'
      mark_type: 'B'
      points: 2
      evidence: |
        ② $f(x)=\dfrac{1}{1+x}$ 또는 $f(x)=1-\dfrac{x}{1+x}$(채점기준 2점).
      depends_on: []
      steps: ['1b-2']
    - id: '1.A1'
      mark_type: 'A'
      points: 3
      evidence: |
        ③ $\displaystyle\lim_{x\to1-}\frac{f(x)-f(1)}{x-1}=\frac34$(채점기준 3점).
      depends_on: ['1.M1']
      steps: ['1b-3']
    - id: '1.A2'
      mark_type: 'A'
      points: 3
      evidence: |
        ④ $\displaystyle\lim_{x\to1+}\frac{f(x)-f(1)}{x-1}=-\frac14$(채점기준 3점).
      depends_on: ['1.M1', '1.B2']
      steps: ['1b-4']
    deductions: []
