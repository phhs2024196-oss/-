intent: |
  제시문의 상황에서 함수의 극한에 대한 정의와 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(보고서 문항카드 출제 의도 원문; 답안지 카드: 좌극한과 우극한 구하기 확인). $g(x)=\min(x,1)$로 구간을 나눠 $f$를 식으로 쓰고 $x=1$에서의 좌·우 극한을 계산한다.
key_idea: |
  $x<1$이면 $g(x)=x$, $x>1$이면 $g(x)=1$이므로 $f$를 구간별 유리함수로 쓴 뒤 각 극한을 약분해 계산한다.
stuck: |
  「크지 않은 수」= 작거나 같은 수(최솟값)라는 뜻을 읽어 내는 것과, 약분 전 $\frac00$ 꼴 처리.
