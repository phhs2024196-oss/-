stimuli: []
stem: |
  곡선 $y=ax^2$ 위의 원점이 아닌 점 $(k,\ ak^2)$에서의 접선이 점 $\left(\dfrac{1}{2a},\ 0\right)$을 지날 때, 이 접선의 기울기를 구하는 과정을 서술하시오. (단, $a$, $k$는 상수이고 $a\ne0$)
subparts:
- id: '1'
  stem: |
    이 접선의 기울기를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      접선 $y=2akx-ak^2$에 $\left(\frac1{2a},0\right)$을 대입하면 $ak^2=k$, $k\ne0$이므로 $ak=1$, 기울기 $2ak=2$.
    steps:
    - id: '1a'
      content: |
        $y=2akx-ak^2$, $0=k-ak^2\Rightarrow ak=1\Rightarrow$ 기울기 $2$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '접점은 $(k,ak^2)$입니다. 이 점에서의 접선의 방정식부터 쓰세요.'
    - '그 접선이 $\left(\frac1{2a},0\right)$을 지나도록 대입하면 $a$와 $k$의 관계가 나옵니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '답안지(자연).hwp [자연 8] 문항카드 5. 문항 해설·6. 채점 기준 + 보고서 자연A 문제8 카드(PDF 272~273쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $y'=2ax$이므로 점 $(k,ak^2)$에서의 접선의 기울기는 $m=2ak$이고, 접선의 방정식은 $y-ak^2=2ak(x-k)$, 즉 $y=2akx-ak^2$이다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        접선이 점 $\left(\dfrac{1}{2a},0\right)$을 지나므로 $ak^2=2ak\left(k-\dfrac{1}{2a}\right)$, 즉 $ak^2=k$이고 $k\ne0$이므로 $k=\dfrac1a$이다.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        따라서 접선의 기울기는 $m=2ak=2$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 4
      evidence: |
        접선의 방정식 $y-ak^2=2ak(x-k)$ 또는 $y=2akx-ak^2$(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
