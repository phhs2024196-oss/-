      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 2
      evidence: |
        접선의 기울기는 $2$(채점기준 2점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    deductions: []
