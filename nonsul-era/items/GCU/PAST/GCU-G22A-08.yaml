intent: |
  제시문의 상황에서 미분을 활용한 접선의 방정식을 이용하여 문제를 해결할 수 있는지를 평가한다(보고서 문항카드 출제 의도 원문; 답안지 카드: 미분의 활용). 곡선 밖의 점을 지나는 접선 조건에서 접점의 $x$좌표 $k$를 정하고 기울기를 구한다.
key_idea: |
  접점 $(k,ak^2)$에서의 접선 $y=2akx-ak^2$이 $\left(\frac{1}{2a},0\right)$을 지난다는 조건으로 $ak=1$을 얻는다.
stuck: |
  점 $\left(\frac1{2a},0\right)$을 접점으로 착각하지 않고, 접점을 $(k,ak^2)$으로 두어야 한다.
