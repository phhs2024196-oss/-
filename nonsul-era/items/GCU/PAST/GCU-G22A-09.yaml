intent: |
  제시문의 상황에서 지수함수의 그래프와 지수방정식을 활용하여 문제를 해결할 수 있는지를 평가한다(보고서 문항카드 출제 의도 원문; 답안지 카드: 지수방정식 풀이와 지수 함수의 이해). $t=2^{f(x)}$로 치환한 이차방정식의 근과 $f$의 최솟값을 비교해 실근이 하나일 조건을 찾는다.
key_idea: |
  $t=2^{f(x)}$로 두면 $t=4,6$이고, $f(x)=3^{|x|}+a$는 $x=0$에서만 최솟값 $1+a$를 가지며 그보다 큰 값은 두 번씩 취하므로 $2^{1+a}=6$이어야 한다.
stuck: |
  $t=4$인 경우를 최솟값으로 잡으면 $t=6$에서 근이 두 개 더 생긴다는 점(실근 개수 세기).
