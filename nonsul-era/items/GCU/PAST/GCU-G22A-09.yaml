stimuli: []
stem: |
  실수 $a$에 대하여 함수 $f(x)$를 $f(x)=3^{|x|}+a$라 하자. $x$에 대한 방정식 $4^{f(x)}-5\times2^{f(x)+1}+24=0$이 오직 하나의 실근을 갖도록 하는 $a$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $a$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\log_2 3', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $t=2^{f(x)}$이면 $t^2-10t+24=0$, $t=4,6$. $2^{f(x)}\ge2^{1+a}$이고 최솟값에서만 근이 하나이므로 $2^{1+a}=6$.
    steps:
    - id: '1a'
      content: |
        $t=4,6$; $f$의 최솟값 $1+a$; $2^{1+a}=6\Rightarrow a=\log_2 3$
      criteria: ['1.M1', '1.B1', '1.A1', '1.A2']
    hint_ladder:
    - '$4^{f(x)}=(2^{f(x)})^2$, $2^{f(x)+1}=2\cdot2^{f(x)}$입니다.'
    - '$3^{|x|}+a=c$는 $c$가 최솟값이면 근 1개, 더 크면 근 2개입니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '답안지(자연).hwp [자연 9] 문항카드 5. 문항 해설·6. 채점 기준 + 보고서 자연A 문제9 카드(PDF 274~275쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        방정식은 $2^{f(x)}$를 $t$라 치환하면 $t^2-10t+24=0$이 되고, 이 방정식의 해는 $t=4,\ 6$이다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $f(x)=3^{|x|}+a$의 그래프는 $x=0$에서 최솟값 $1+a$를 가지므로 $2^{f(x)}\ge2^{1+a}$이다.
      criteria: ['1.B1']
    - id: '1b-3'
      content: |
        오직 하나의 실근을 갖기 위해서는 $2^{f(x)}$의 최솟값이 $6$이 되어야 한다. ($\because$ $2^{f(x)}=4$이면 $2^{f(x)}=6$인 근 $x$가 존재)
      criteria: ['1.A1']
    - id: '1b-4'
      content: |
        따라서 $2^{1+a}=6$, 즉 $a$의 값은 $\log_2 6-1=\log_2 3$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
        $2^{f(x)}=t$, $t^2-10t+24=0$, $t=4,\ 6$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.B1'
      mark_type: 'B'
      points: 2
      evidence: |
        $f(x)=3^{|x|}+a$는 $x=0$에서 최솟값 $1+a$를 갖는다(채점기준 2점).
      depends_on: []
      steps: ['1b-2']
    - id: '1.A1'
      mark_type: 'A'
      points: 3
      evidence: |
        오직 하나의 실근을 갖기 위해서는 $2^{f(x)}$의 최솟값이 $6$만 가능(또는 $2^{f(x)}=4$는 부적합)(채점기준 3점).
      depends_on: ['1.M1', '1.B1']
      steps: ['1b-3']
    - id: '1.A2'
      mark_type: 'A'
      points: 2
      evidence: |
        $2^{1+a}=6$, 즉 $a=\log_2 6-1$ 또는 $\log_2 3$(채점기준 2점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-4']
    deductions: []
