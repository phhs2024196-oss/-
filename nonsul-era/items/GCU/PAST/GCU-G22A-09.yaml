    wrong_work: '$2^{f(x)}$의 최솟값을 $4$로 잡아 $2^{1+a}=4$, $a=1$이라 답함'
    detect_cue: '답이 $a=1$이고 $t=6$일 때의 근($3^{|x|}=\log_2 6-1$의 두 근)을 검토하지 않았다'
    feedback: '최솟값을 $4$로 하면 $2^{f(x)}=6$에서도 $x$가 두 개 생깁니다. 치환한 값마다 $x$가 몇 개인지 세어 보세요.'
    remedy: [RL-1]
