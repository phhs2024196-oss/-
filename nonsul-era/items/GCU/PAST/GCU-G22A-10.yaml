intent: |
  제시문의 상황에서 삼각함수의 정의와 삼각함수 사이의 관계를 이용하여 문제를 해결할 수 있는지를 평가한다(보고서 문항카드 출제 의도 원문; 답안지 카드: 삼각함수의 정의와 삼각함수 사이의 관계를 이용하여 값을 구하는 능력을 확인). 동경 위의 점 $(a,b)$로 $\cos\theta$, $\tan\theta$를 나타내 비 $\frac ab$를 구한다.
key_idea: |
  $\cos\theta=\dfrac{a}{\sqrt{a^2+b^2}}$, $\tan\theta=\dfrac ba$를 대입하면 $\dfrac{3a+b}{\sqrt{a^2+b^2}}=3$, 제곱해 $6ab=8b^2$.
stuck: |
  $\cos\theta\tan\theta=\sin\theta$로 정리한 뒤, 제곱하고 $b\ne0$으로 나누는 단계.
