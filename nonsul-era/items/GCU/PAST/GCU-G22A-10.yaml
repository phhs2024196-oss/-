stimuli: []
stem: |
  좌표평면에서 시초선을 원점에서 $x$축의 양의 방향으로 잡을 때, 각 $\theta$를 나타내는 동경과 원점을 중심으로 하는 원이 만나는 점의 좌표가 $(a,\ b)$이다.
  $3\cos\theta+\cos\theta\tan\theta=3$일 때, $\dfrac{a}{b}$의 값을 구하는 과정을 서술하시오. (단, $b\ne0$)
subparts:
- id: '1'
  stem: |
    $\dfrac{a}{b}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '4/3', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $3\cos\theta+\sin\theta=3$을 $(a,b)$로 쓰고 제곱해 $6ab=8b^2$, $b\ne0$으로 나눈다.
    steps:
    - id: '1a'
      content: |
        $\dfrac{3a+b}{\sqrt{a^2+b^2}}=3\Rightarrow 6ab=8b^2\Rightarrow \dfrac ab=\dfrac43$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - '$r=\sqrt{a^2+b^2}$라 하면 $\cos\theta=\frac ar$, $\tan\theta=\frac ba$입니다.'
    - '제곱한 뒤 $b\ne0$을 이용해 나누세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '답안지(자연).hwp [자연 10] 문항카드 5. 문항 해설·6. 채점 기준 + 보고서 자연A 문제10 카드(PDF 276~277쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $$3\frac{a}{\sqrt{a^2+b^2}}+\frac{a}{\sqrt{a^2+b^2}}\times\frac ba=3,\qquad \frac{3a+b}{\sqrt{a^2+b^2}}=3$$
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $(3a+b)^2=9(a^2+b^2)$, $9a^2+6ab+b^2=9a^2+9b^2$, $6ab=8b^2$
      criteria: ['1.M2']
    - id: '1b-3'
      content: |
        $b\ne0$이므로 $\therefore\ \dfrac{a}{b}=\dfrac{4}{3}$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
        $3\dfrac{a}{\sqrt{a^2+b^2}}+\dfrac{a}{\sqrt{a^2+b^2}}\times\dfrac ba=3$ 또는 $3\dfrac{a}{\sqrt{a^2+b^2}}+\dfrac{b}{\sqrt{a^2+b^2}}=3$ 또는 $3\cos\theta+\sin\theta=3$ 또는 $3(\cot\theta-\csc\theta)=-1$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.M2'
      mark_type: 'M'
      points: 2
      evidence: |
        $(3a+b)^2=9(a^2+b^2)$ 또는 $9a^2+6ab+b^2=9a^2+9b^2$ 또는 $5\cos^2\theta-9\cos\theta+4=0$ 또는 $\cot\theta+\csc\theta=3$(채점기준 2점).
      depends_on: ['1.M1']
      implied_ok: false
      steps: ['1b-2']
    - id: '1.A1'
      mark_type: 'A'
      points: 5
      evidence: |
        $\therefore\ \dfrac ab=\dfrac43$(채점기준 5점).
      depends_on: ['1.M2']
      steps: ['1b-3']
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
