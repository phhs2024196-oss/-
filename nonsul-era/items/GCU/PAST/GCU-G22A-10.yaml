  misconceptions:
  - id: MC-ALG-8104
    outcome_code: '71'
    wrong_work: '$\tan\theta=\dfrac ab$로 정의를 뒤바꿔 $3\cos\theta+\dfrac{a^2}{b\,r}=3$을 세움'
    detect_cue: '식에 $\frac{a^2}{b}$ 꼴이 나오고 답이 $\frac43$이 아닌 값'
    feedback: '동경 위의 점 $(a,b)$에 대해 $\tan\theta=\dfrac{y}{x}=\dfrac ba$입니다. 정의를 다시 확인하세요.'
    remedy: [RL-1]
