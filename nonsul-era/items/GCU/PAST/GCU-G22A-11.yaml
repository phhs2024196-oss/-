stem: |
  수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합 $S_n$이 $S_n=\dfrac{n^2(n+2)^2}{9}$일 때, $a_1+a_{100}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $a_1+a_{100}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '451112', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $a_n=\frac19(4n^3+6n^2-1)\ (n\ge2)$에서 $a_{100}=451111$, $a_1=S_1=1$.
    steps:
    - id: '1a'
      content: |
        $a_1=1$, $a_{100}=\frac19(4000000+60000-1)=451111$, 합 $451112$
      criteria: ['1.M1', '1.B2', '1.A1']
    hint_ladder:
    - '$n\ge2$일 때 $a_n=S_n-S_{n-1}$입니다.'
    - '$a_1$은 $S_1$으로 따로 구하세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '답안지(자연).hwp [자연 11] 문항카드 5. 문항 해설·6. 채점 기준 + 보고서 자연A 문제11 카드(PDF 278~279쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $a_n=S_n-S_{n-1}=\dfrac19\left\{n^2(n+2)^2-(n-1)^2(n+1)^2\right\}=\dfrac19(n^4+4n^3+4n^2-n^4+2n^2-1)=\dfrac19(4n^3+6n^2-1)$이고, $\therefore\ a_1=S_1=1$
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $\therefore\ a_{100}=\dfrac19(4000000+60000-1)=451111$
      criteria: ['1.B2']
    - id: '1b-3'
      content: |
        $\therefore\ a_1+a_{100}=451112$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
