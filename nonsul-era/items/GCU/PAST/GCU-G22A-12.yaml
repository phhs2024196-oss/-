      mark_type: 'A'
      points: 2
      evidence: |
        $b=0$, 또는 상수항은 $0$(채점기준 2점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 3
      evidence: |
        $a=14$, 또는 일차항의 계수는 $14$(채점기준 3점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    - id: '1.A3'
      mark_type: 'A'
      points: 2
      evidence: |
        $\displaystyle\lim_{x\to2}\frac{f(x)}{x-2}=-10$(채점기준 2점).
      depends_on: ['1.M1', '1.A2']
      steps: ['1b-4']
    deductions: []
