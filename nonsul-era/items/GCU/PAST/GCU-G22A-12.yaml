intent: |
  제시문의 상황에서 함수의 극한에 대한 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(보고서 문항카드 출제 의도 원문; 답안지 카드: 미정계수의 결정). 극한 조건으로 다항함수의 차수·계수를 정한다.
key_idea: |
  $\lim_{x\to\infty}\frac{f(x)-x^3}{x^2}=-9$에서 $f(x)=x^3-9x^2+ax+b$, $\lim_{x\to0}\frac{f(x)}{x}=14$에서 $b=0,\ a=14$.
stuck: |
  분모 $\to0$이고 극한이 존재하므로 분자 $\to0$, 즉 $f(0)=0$.
