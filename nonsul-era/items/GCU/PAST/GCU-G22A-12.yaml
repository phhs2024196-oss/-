stimuli: []
stem: |
  다항함수 $f(x)$가 $\displaystyle\lim_{x\to\infty}\frac{f(x)-x^3}{x^2}=-9$와 $\displaystyle\lim_{x\to0}\frac{f(x)}{x}=14$를 만족할 때, $\displaystyle\lim_{x\to2}\frac{f(x)}{x-2}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{x\to2}\frac{f(x)}{x-2}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-10', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=x^3-9x^2+14x=x(x-2)(x-7)$이므로 극한은 $2\cdot(2-7)=-10$.
    steps:
    - id: '1a'
      content: |
        $f(x)=x^3-9x^2+ax+b$, $b=0$, $a=14$, $\lim_{x\to2}x(x-7)=-10$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$f(x)-x^3$은 이차식이고 $x^2$의 계수는 $-9$입니다.'
    - '$x\to0$일 때 분모가 $0$으로 가니 분자도 $0$으로 가야 합니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '답안지(자연).hwp [자연 12] 문항카드 5. 문항 해설·6. 채점 기준 + 보고서 자연A 문제12 카드(PDF 280~281쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $\displaystyle\lim_{x\to\infty}\frac{f(x)-x^3}{x^2}=-9$이므로 $f(x)=x^3-9x^2+ax+b$이다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        또한 $\displaystyle\lim_{x\to0}\frac{f(x)}{x}=14$이므로 $f(0)=0$이 성립해야 하므로 $b=0$.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        따라서 $\displaystyle\lim_{x\to0}\frac{f(x)}{x}=\lim_{x\to0}\frac{x^3-9x^2+ax}{x}=\lim_{x\to0}(x^2-9x+a)=a=14$
      criteria: ['1.A2']
    - id: '1b-4'
      content: |
        이므로 $f(x)=x^3-9x^2+14x=x(x-2)(x-7)$이고 결국 $\displaystyle\lim_{x\to2}\frac{f(x)}{x-2}=\lim_{x\to2}x(x-7)=-10$.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
