      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.M2'
      mark_type: 'M'
      points: 2
      evidence: |
        $1<|a+1|$일 때, $f(x)=\log_{|a+1|}x$는 $x=16$에서 최댓값 $2$를 갖는다(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: ['1b-3']
    - id: '1.A2'
      mark_type: 'A'
      points: 3
      evidence: |
        $\therefore\ |a+1|=4\Rightarrow a=3,\ -5$(채점기준 3점).
      depends_on: ['1.M2']
      steps: ['1b-4']
