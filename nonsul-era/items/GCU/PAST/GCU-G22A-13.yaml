stimuli: []
stem: |
  정의역이 $\left\{x\,\middle|\,\dfrac{1}{9}\le x\le16\right\}$인 함수 $f(x)=\log_{|a+1|}x$의 최댓값이 $2$가 되도록 하는 모든 실수 $a$의 값을 구하는 과정을 서술하시오. (단, $a\ne-1$)
subparts:
- id: '1'
  stem: |
    모든 실수 $a$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '{-5, -4/3, -2/3, 3}', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $|a+1|<1$: $|a+1|^2=\frac19$; $|a+1|>1$: $|a+1|^2=16$.
    steps:
    - id: '1a'
      content: |
        $|a+1|=\frac13\Rightarrow a=-\frac23,-\frac43$; $|a+1|=4\Rightarrow a=3,-5$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2']
    hint_ladder:
    - '밑이 $1$보다 작으면 로그함수는 감소합니다.'
    - '두 경우 각각 최댓값이 정의역의 어느 끝에서 나오는지 정하세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '답안지(자연).hwp [자연 13] 문항카드 5. 문항 해설·6. 채점 기준 + 보고서 자연A 문제13 카드(PDF 282~283쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $0<|a+1|<1$일 때, 함수 $f(x)=\log_{|a+1|}x$는 감소 함수이므로 $x=\dfrac19$에서 최댓값 $2$를 갖는다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $|a+1|^2=\dfrac19$, $\therefore\ |a+1|=\dfrac13\Rightarrow a=-\dfrac23,\ -\dfrac43$
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        $1<|a+1|$일 때, 함수 $f(x)=\log_{|a+1|}x$는 증가 함수이므로 $x=16$에서 최댓값 $2$를 갖는다.
      criteria: ['1.M2']
    - id: '1b-4'
      content: |
        $|a+1|^2=16$, $\therefore\ |a+1|=4\Rightarrow a=3,\ -5$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 2
      evidence: |
