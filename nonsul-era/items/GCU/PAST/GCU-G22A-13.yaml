intent: |
  제시문의 상황에서 로그함수의 그래프를 이용하여 문제를 해결할 수 있는지를 평가한다(보고서 문항카드 출제 의도 원문; 답안지 카드: 지수와 로그의 활용). 밑 $|a+1|$이 1보다 작은 경우와 큰 경우로 나눠 최댓값이 생기는 끝점을 정한다.
key_idea: |
  $0<|a+1|<1$이면 감소해 $x=\frac19$에서, $|a+1|>1$이면 증가해 $x=16$에서 최댓값 $2$를 갖는다.
stuck: |
  밑이 $1$보다 작은 경우를 빠뜨리지 않는 것.
