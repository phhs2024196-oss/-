stimuli: []
stem: |
  원점을 동시에 출발하여 수직선 위를 움직이는 두 점 $\mathrm{A}$, $\mathrm{B}$의 시각 $t\ (t\ge0)$에서의 속도를 각각 $v_1(t)$, $v_2(t)$라 할 때,
  $v_1(t)=2t^3-12t^2+24t$, $v_2(t)=\dfrac{3}{2}t^2+9a\ (a\ge0)$이다. 두 점 $\mathrm{A}$, $\mathrm{B}$가 출발 후 오직 두 번 만나기 위한 모든 실수 $a$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    모든 실수 $a$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '{8/9, 10/9}', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $f(t)=\frac1{18}t^3-\frac12t^2+\frac43t\ (t>0)$와 $y=a$의 교점이 2개 ⇔ $a$가 극댓값 $\frac{10}9$ 또는 극솟값 $\frac89$.
    steps:
    - id: '1a'
      content: |
        $s_1=\frac12t^4-4t^3+12t^2$, $s_2=\frac12t^3+9at$; $f'(t)=\frac16(t-2)(t-4)$; $a=\frac{10}9,\ \frac89$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '각 점의 위치를 $\int_0^t v\,d\tau$로 구하세요.'
    - '$t>0$이므로 $s_1=s_2$의 양변을 $9t$로 나눌 수 있습니다. 남은 삼차함수의 그래프와 $y=a$를 비교하세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '답안지(자연).hwp [자연 14] 문항카드 5. 문항 해설·6. 채점 기준 + 보고서 자연A 문제14 카드(PDF 284~285쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        시각 $t\ (t\ge0)$에서의 두 점 A, B의 위치는 각각
        $$s_1(t)=\int_0^t(2\tau^3-12\tau^2+24\tau)\,d\tau=\frac12t^4-4t^3+12t^2,\quad s_2(t)=\int_0^t\left(\frac32\tau^2+9a\right)d\tau=\frac12t^3+9at$$
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $s_1(t)=s_2(t)$라 놓으면 $\dfrac1{18}t^4-\dfrac12t^3+\dfrac43t^2=at$이고, 출발 후 두 점이 만나는 횟수는 $\dfrac1{18}t^3-\dfrac12t^2+\dfrac43t=a$의 실근의 개수와 같다. 즉 $f(t)=\dfrac1{18}t^3-\dfrac12t^2+\dfrac43t\ (t\ge0)$의 그래프와 직선 $y=a$의 교점의 개수가 $2$인 $a$를 구한다.
      criteria: ['1.M2']
    - id: '1b-3'
      content: |
        $f'(t)=\dfrac16t^2-t+\dfrac43=\dfrac16(t-2)(t-4)$이므로 극값을 갖는 $t=2,\ 4$에서 직선 $y=a$와 만날 때 교점이 2개이다.
      criteria: ['1.A1']
    - id: '1b-4'
      content: |
        $f(2)=\dfrac{10}{9}$, $f(4)=\dfrac{8}{9}$이므로 $a=\dfrac{10}9$ 또는 $a=\dfrac89$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
        두 점의 위치 $s_1(t)=\int_0^t v_1\,dt=\frac12t^4-4t^3+12t^2$, $s_2(t)=\int_0^t v_2\,dt=\frac12t^3+9at$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.M2'
      mark_type: 'M'
      points: 2
      evidence: |
        출발 후 두 점이 만나는 횟수는 $\frac1{18}t^3-\frac12t^2+\frac43t=a$의 실근의 개수와 같다(또는 $t^3-9t^2+24t=18a$)(채점기준 2점).
      depends_on: ['1.M1']
      implied_ok: false
      steps: ['1b-2']
    - id: '1.A1'
      mark_type: 'A'
      points: 3
      evidence: |
        $t=2,\ 4$에서 직선 $y=a$와의 교점이 2개이다(채점기준 3점).
      depends_on: ['1.M2']
      steps: ['1b-3']
    - id: '1.A2'
      mark_type: 'A'
      points: 2
      evidence: |
        $f(2)=\frac{10}9$, $f(4)=\frac89$(채점기준 2점).
      depends_on: ['1.M2', '1.A1']
      steps: ['1b-4']
    deductions: []
