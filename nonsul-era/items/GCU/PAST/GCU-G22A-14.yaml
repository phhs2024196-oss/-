intent: |
  제시문의 상황에서 속도와 거리에 대한 적분법을 이용하여 문제를 해결할 수 있는지를 평가한다(보고서 문항카드 출제 의도 원문; 답안지 카드: 적분의 활용의 이해). 위치를 적분으로 구해 만나는 조건을 삼차함수와 수평선의 교점 개수로 바꾼다.
key_idea: |
  $s_1(t)=s_2(t)$를 $t>0$에서 $t$로 나누면 $\frac1{18}t^3-\frac12t^2+\frac43t=a$이고, 교점이 2개이려면 $a$가 극값 $f(2)=\frac{10}9$ 또는 $f(4)=\frac89$.
stuck: |
  출발 시각 $t=0$을 빼고 $t>0$에서의 교점 개수를 세는 것, 그리고 극값에서 접할 때 교점이 2개가 되는 것.
