stem: |
  함수 $f(x)=-x^2+6x-9$에 대하여, 곡선 위의 점 $(a,\ f(a))\ (0<a<3)$에서의 접선을 $l$이라 하자. $y=f(x)$의 그래프와 접선 $l$, $x$축 및 $y$축으로 둘러싸인 부분의 넓이의 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    넓이의 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $S(a)=9-\frac{(a+3)(9-a^2)}4$, $S'(a)=\frac34(a-1)(a+3)$이므로 $a=1$에서 최솟값 $1$.
    steps:
    - id: '1a'
      content: |
        접선 $y=(-2a+6)x+a^2-9$; $S=\frac14a^3+\frac34a^2-\frac94a+\frac94$; $S(1)=1$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '접선의 $x$절편과 $y$절편을 구해 삼각형 넓이를 쓰세요.'
    - '곡선과 두 축 사이의 넓이에서 삼각형 넓이를 빼면 됩니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '답안지(자연).hwp [자연 15] 문항카드 5. 문항 해설·6. 채점 기준 + 보고서 자연A 문제15 카드(PDF 286~287쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        곡선 $y=-(x-3)^2$ 위의 점 $(a,f(a))$에서 $f'(x)=-2x+6$이므로 접선의 방정식은 $y=-2(a-3)(x-a)-(a-3)^2$이다. 접선의 $x$절편은 $\dfrac{a+3}{2}$, $y$절편은 $a^2-9$이므로 접선과 $x$축, $y$축으로 둘러싸인 삼각형의 넓이는 $\dfrac12\times\dfrac{a+3}{2}\times(9-a^2)$이다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $$S=-\int_0^3(-x^2+6x-9)\,dx-\frac{(a+3)(9-a^2)}{4}=\left[\frac13x^3-3x^2+9x\right]_0^3-\frac{(a+3)(9-a^2)}{4}=\frac14a^3+\frac34a^2-\frac94a+\frac94$$
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        $S'=\dfrac34a^2+\dfrac32a-\dfrac94=\dfrac34(a-1)(a+3)$이므로 $a=1$에서 극솟값 $S=1$을 가지며 이 값이 최솟값이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 2
      evidence: |
        접선의 방정식 $y=-2(a-3)(x-a)-(a-3)^2$ 또는 $y=(-2a+6)x+a^2-9$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 6
      evidence: |
        부분의 넓이 $S=\frac14a^3+\frac34a^2-\frac94a+\frac94$(채점기준 6점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 2
      evidence: |
        넓이 $S$의 $0<a<3$에서의 최솟값: $a=1$에서 $S=1$(채점기준 2점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    deductions: []
