intent: |
  제시문의 상황에서 미분에서의 접선의 방정식과 정적분에서 곡선으로 둘러싸인 도형의 넓이를 이용하여 문제를 해결할 수 있는지를 평가한다(보고서 문항카드 출제 의도 원문; 답안지 카드: 적분의 활용의 이해). 넓이를 $a$의 삼차함수로 세운 뒤 미분으로 최솟값을 찾는다.
key_idea: |
  구하는 넓이 $=$ (곡선과 두 축 사이 넓이 $9$) $-$ (접선과 두 축이 만드는 삼각형 넓이) $=\frac14a^3+\frac34a^2-\frac94a+\frac94$.
stuck: |
  둘러싸인 영역을 「곡선 아래 넓이 − 삼각형」으로 보는 것.
