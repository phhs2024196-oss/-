stimuli: []
stem: |
  두 함수 $f(x)$와 $g(x)$가 $\displaystyle\lim_{x\to a}f(x)=\infty$와 $\displaystyle\lim_{x\to a}\{3f(x)-g(x)\}=2022$를 만족한다.
  $\displaystyle\lim_{x\to a}\frac{kf(x)-2g(x)}{2f(x)-g(x)}=-9$를 만족시키는 상수 $k$의 값을 구하는 다음의 풀이 과정을 완성하시오.

  [풀이 과정] $\displaystyle\lim_{x\to a}f(x)=\infty$이고 $\displaystyle\lim_{x\to a}\{3f(x)-g(x)\}=2022$이므로 $\displaystyle\lim_{x\to a}g(x)=$ ( ① ).
  또한 $\displaystyle\lim_{x\to a}\frac{3f(x)-g(x)}{f(x)}=$ ( ② )이므로 $\displaystyle\lim_{x\to a}\frac{g(x)}{f(x)}=$ ( ③ )이다.
  따라서 $\displaystyle\lim_{x\to a}\frac{kf(x)-2g(x)}{2f(x)-g(x)}=-9$이므로 $k=$ ( ④ )이다.
subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '① ∞  ② 0  ③ 3  ④ 15', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $\frac gf\to3$이므로 $\frac{k-2\cdot3}{2-3}=-9$에서 $k=15$.
    steps:
    - id: '1a'
      content: |
        $\lim g=\infty$, $\lim\frac{3f-g}{f}=0$, $\lim\frac gf=3$, $\frac{k-6}{-1}=-9\Rightarrow k=15$
      criteria: ['1.B1', '1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$3f-g$는 수렴하고 $f$는 발산합니다. $\frac{3f-g}{f}$의 극한은?'
    - '구하는 식의 분자·분모를 $f(x)$로 나누세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연B 문제7 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 288~290쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        조건에서 $\displaystyle\lim_{x\to a}f(x)=\infty$인데 $\displaystyle\lim_{x\to a}\{3f(x)-g(x)\}=2022$이므로 $\displaystyle\lim_{x\to a}g(x)=\infty$.
      criteria: ['1.B1']
    - id: '1b-2'
      content: |
        또한 $\displaystyle\lim_{x\to a}\{3f(x)-g(x)\}=2022$로부터 $\displaystyle\lim_{x\to a}\frac{3f(x)-g(x)}{f(x)}=\lim_{x\to a}\left(3-\frac{g(x)}{f(x)}\right)=0$이 성립하게 된다.
      criteria: ['1.M1']
    - id: '1b-3'
      content: |
        따라서 $\displaystyle\lim_{x\to a}\frac{g(x)}{f(x)}=3$이다.
      criteria: ['1.A1']
    - id: '1b-4'
      content: |
        결국 $$\lim_{x\to a}\frac{kf(x)-2g(x)}{2f(x)-g(x)}=\lim_{x\to a}\frac{k-2g(x)/f(x)}{2-g(x)/f(x)}=\frac{k-6}{-1}=-9$$이므로 $k=15$이다.
      criteria: ['1.A2']
