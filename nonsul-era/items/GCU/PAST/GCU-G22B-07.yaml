intent: |
  제시문의 상황에서 함수의 극한에 대한 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 발산하는 두 함수의 비의 극한을 수렴하는 식으로 바꿔 상수 $k$를 정한다.
key_idea: |
  $\lim(3f-g)=2022$, $\lim f=\infty$이므로 $\lim\frac{3f-g}{f}=0$, 즉 $\lim\frac gf=3$; 분자·분모를 $f$로 나눈다.
stuck: |
  $\infty-\infty$ 꼴에서 극한의 성질을 그대로 쓰지 않고 $f$로 나눈 비로 바꾸는 것.
