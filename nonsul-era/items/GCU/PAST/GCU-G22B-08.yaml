intent: |
  제시문의 상황에서 두 그래프로 둘러싸인 부분의 넓이를 정적분을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 절댓값을 기준으로 구간을 나눠 교점과 넓이를 구한다.
key_idea: |
  $x<2$에서 $g=2x+1$, $x\ge2$에서 $g=-2x+9$; 교점 $x=0$, $x=4$; 넓이는 두 구간 정적분의 합 $\frac{40}3$.
stuck: |
  절댓값 함수 $g$를 $x=2$ 기준으로 나누는 것.
