stimuli: []
stem: |
  두 함수 $f(x)=\dfrac{1}{2}x^2-2x+1$, $g(x)=5-2|x-2|$의 그래프로 둘러싸인 부분의 넓이 $S$를 구하는 다음의 풀이 과정을 완성하시오.

  [풀이 과정] $x<2$일 때, 두 그래프의 교점은 $f(x)=g(x)$에서 $x=$ ( ① )이다.
  $x\ge2$일 때, 두 그래프의 교점은 $f(x)=g(x)$에서 $x=$ ( ② )이다.
  따라서 넓이를 정적분의 식으로 나타내면 $S=$ ( ③ )이고,
  이 정적분의 값을 구하면 $S=$ ( ④ ) 이다.
subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '① 0  ② 4  ③ ∫_0^2{(2x+1)-f}dx+∫_2^4{(-2x+9)-f}dx  ④ 40/3', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      교점 $x=0,4$; $S=\int_0^2\left(4x-\frac12x^2\right)dx+\int_2^4\left(8-\frac12x^2\right)dx=\frac{40}3$.
    steps:
    - id: '1a'
      content: |
        ① $0$ ② $4$ ③ 두 구간 정적분 ④ $\frac{40}3$
      criteria: ['1.B1', '1.B2', '1.M1', '1.A1']
    hint_ladder:
    - '$x<2$이면 $|x-2|=2-x$입니다.'
    - '넓이는 (위 그래프)−(아래 그래프)를 구간별로 적분합니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연B 문제8 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 291~293쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $x<2$일 때 $g(x)=2x+1$이므로 $\dfrac12x^2-2x+1=2x+1$에서 교점은 $x=0$이다.
      criteria: ['1.B1']
    - id: '1b-2'
      content: |
        $x\ge2$일 때 $g(x)=-2x+9$이므로 $\dfrac12x^2-2x+1=-2x+9$에서 교점은 $x=4$이다.
      criteria: ['1.B2']
    - id: '1b-3'
      content: |
        따라서 넓이는
        $$S=\int_0^2(2x+1)-\left(\frac12x^2-2x+1\right)dx+\int_2^4(-2x+9)-\left(\frac12x^2-2x+1\right)dx$$
      criteria: ['1.M1']
    - id: '1b-4'
      content: |
        $$=\left[2x^2-\frac16x^3\right]_0^2+\left[-\frac16x^3+8x\right]_2^4=\frac{40}{3}$$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.B1'
      mark_type: 'B'
      points: 2
      evidence: |
        ① $x<2$일 때 교점은 $x=0$(채점기준 2점).
      depends_on: ['1.B1']
      steps: ['1b-1']
    - id: '1.B2'
      mark_type: 'B'
      points: 2
      evidence: |
        ② $x\ge2$일 때 교점은 $x=4$(채점기준 2점).
      depends_on: []
      steps: ['1b-2']
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
        ③ $S=\int_0^2(2x+1)-\left(\frac12x^2-2x+1\right)dx+\int_2^4(-2x+9)-\left(\frac12x^2-2x+1\right)dx$ 또는 $S=\int_0^24x-\frac12x^2\,dx+\int_2^48-\frac12x^2\,dx$ 또는 $S=2\int_0^2(2x+1)-\left(\frac12x^2-2x+1\right)dx$ 또는 $S=2\int_0^24x-\frac12x^2\,dx$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-3']
    - id: '1.A1'
      mark_type: 'A'
      points: 3
      evidence: |
        ④ 넓이 $S=\frac{40}3$(채점기준 3점).
      depends_on: ['1.M1']
      steps: ['1b-4']
    deductions: []
