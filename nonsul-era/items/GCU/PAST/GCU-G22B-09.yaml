stimuli: []
stem: |
  좌표평면에서 원 $(x-3)^2+(y-4)^2=25$ 위의 점 $\mathrm{P}$와 직선 $3x+4y+10=0$ 사이의 거리를 $D_{\mathrm{P}}$라 하자. $\log_2 D_{\mathrm{P}}$의 값이 자연수가 되도록 하는 점 $\mathrm{P}$의 개수를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    점 $\mathrm{P}$의 개수를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '5', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $7-5\le D_{\mathrm P}\le7+5$; $D_{\mathrm P}\in\{2,4,8\}$에서 점 $1+2+2=5$개.
    steps:
    - id: '1a'
      content: |
        거리 $7$, $2\le D_{\mathrm P}\le12$, $D_{\mathrm P}=2,4,8$, 개수 $5$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '원의 중심에서 직선까지의 거리를 먼저 구하세요.'
    - '$D_{\mathrm P}$가 최솟값·최댓값일 때와 그 사이일 때 점의 개수가 다릅니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연B 문제9 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 294~295쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        원 $(x-3)^2+(y-4)^2=25$의 중심을 $C$라 하면 $C(3,4)$이고 반지름의 길이는 $5$이다. 직선과 원의 중심 사이의 거리는 $\dfrac{|9+16+10|}{\sqrt{9+16}}=7$.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        따라서 $7-5\le D_{\mathrm P}\le7+5$.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        $\log_2 D_{\mathrm P}$가 자연수이려면 $D_{\mathrm P}=2,4,8$이어야 한다.
      criteria: ['1.A2']
    - id: '1b-4'
      content: |
        $D_{\mathrm P}=2$가 되는 점 P의 개수는 $1$이고, $D_{\mathrm P}=4$가 되는 점 P의 개수는 $2$이고, $D_{\mathrm P}=8$이 되는 점 P의 개수는 $2$이다. 따라서 총 $5$개다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
        직선과 원의 중심 사이의 거리는 $\frac{|9+16+10|}{\sqrt{9+16}}=7$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 3
      evidence: |
        $2\le D_{\mathrm P}\le12$(채점기준 3점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 2
      evidence: |
        $\log_2 D_{\mathrm P}$가 자연수이려면 $D_{\mathrm P}=2,4,8$(채점기준 2점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    - id: '1.A3'
      mark_type: 'A'
      points: 2
      evidence: |
        $5$개(채점기준 2점).
      depends_on: ['1.M1', '1.A2']
      steps: ['1b-4']
    deductions: []
