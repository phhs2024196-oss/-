stem: |
  부등식 $\log_2(x^2-2x)>\log_2(6-x)$를 만족시키는 $x$의 범위를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $x$의 범위를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: 'x<-2 또는 3<x<6', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      진수 조건 $x<0$ 또는 $2<x<6$과 $x<-2$ 또는 $x>3$의 공통부분.
    steps:
    - id: '1a'
      content: |
        $x<0$ 또는 $x>2$; $x<6$; $x<-2$ 또는 $x>3$ $\Rightarrow$ $x<-2$ 또는 $3<x<6$
      criteria: ['1.M1', '1.M2', '1.M3', '1.A1']
    hint_ladder:
    - '로그가 정의되려면 진수가 양수여야 합니다.'
    - '밑 $2>1$이므로 진수끼리 부등호 방향 그대로 비교합니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연B 문제10 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 296~297쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $\log_2(x^2-2x)$의 진수 조건: $x^2-2x>0$, $x(x-2)>0$, $x>2$ 또는 $x<0$
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $\log_2(6-x)$의 진수 조건: $6-x>0$, $6>x$. 따라서 위 두 조건을 모두 만족하는 $x$의 범위는 $x<0$ 또는 $2<x<6$
      criteria: ['1.M2']
    - id: '1b-3'
      content: |
        $\log_2(x^2-2x)>\log_2(6-x)$에서 $x^2-2x>6-x$, $x^2-x-6>0$: $x<-2$ 또는 $x>3$
      criteria: ['1.M3']
    - id: '1b-4'
      content: |
        따라서 모든 조건을 만족하는 범위는 $x<-2$ 또는 $3<x<6$이다.
      criteria: ['1.A1']
