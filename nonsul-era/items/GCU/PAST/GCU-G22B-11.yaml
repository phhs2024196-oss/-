stem: |
  둘레의 길이가 $80$인 부채꼴의 넓이의 최댓값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    부채꼴의 넓이의 최댓값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '400', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $S=\frac12r(80-2r)=-(r-20)^2+400$이므로 $r=20$에서 최댓값 $400$.
    steps:
    - id: '1a'
      content: |
        $\ell+2r=80$, $S=\frac12r(80-2r)$, 최댓값 $400$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '반지름 $r$, 호의 길이 $\ell$이라 하면 둘레는?'
    - '$S=\frac12r\ell$을 $r$만의 식으로 쓰세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연B 문제11 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 298~299쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        반지름을 $r$, 호의 길이를 $\ell$이라 하면 $\ell+2r=80$. 부채꼴의 중심각을 $\theta$, 면적을 $S$라 하면
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $$S=\frac12r\ell=\frac12r(80-2r)=-r^2+40r=-(r-20)^2+400$$
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        이므로 $r=20$일 때, 면적은 최댓값 $400$을 갖는다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
