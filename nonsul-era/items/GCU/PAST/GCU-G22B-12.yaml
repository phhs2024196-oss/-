intent: |
  제시문의 상황에서 미분법의 활용에서 접선의 방정식을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $h=f-g$가 접점에서 $h=h'=0$임을 이용해 $a-b$를 정한다.
key_idea: |
  $h(x)=x^3-3x+a-b$; 접점에서 $h'=0$이므로 $x=\pm1$, $h=0$이므로 $a-b=\pm2$; $a<b$로 $a-b=-2$.
stuck: |
  접할 조건 두 개($h=0$, $h'=0$)와 $a<b$로 후보를 거르는 것.
