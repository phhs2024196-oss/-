stem: |
  함수 $f(x)=x^3-x+a$와 $g(x)=2x+b$에 대하여 곡선 $y=f(x)$가 직선 $y=g(x)$와 접할 때, $f(1)-g(1)$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$는 상수이고 $a<b$이다.)
subparts:
- id: '1'
  stem: |
    $f(1)-g(1)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-4', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $h=f-g$, $h'(x)=3x^2-3=0$; $a-b=\pm2$ 중 $a<b$이므로 $-2$; $h(1)=-4$.
    steps:
    - id: '1a'
      content: |
        $x=\pm1$, $a-b=\pm2$, $a-b=-2$(접점 $x=-1$), $h(1)=-4$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$h(x)=f(x)-g(x)$라 하면 접점에서 $h$와 $h''$은 어떤 값?'
    - '$a<b$를 이용해 두 경우 중 하나를 고르세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연B 문제12 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 300~301쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $h(x)=f(x)-g(x)=x^3-3x+a-b$라 하자. 접점에서 $h'(x)=0$이므로, 접점에서 $x=\pm1$이다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        또한 접점에서 $h(x)=0$이므로 $a-b=\pm2$이다.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        한편 조건 $a<b$에 의해서 $a-b=-2$이고 두 그래프는 $x=-1$에서 접한다.
      criteria: ['1.A2']
    - id: '1b-4'
      content: |
        따라서 $f(1)-g(1)=h(1)=-4$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
        가능한 접점의 $x$값은 $x=\pm1$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 3
      evidence: |
        접점의 위치에 따라 $a-b=\pm2$(채점기준 3점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 2
      evidence: |
        $a-b=-2$이고 접점의 $x$값은 $x=-1$(채점기준 2점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    - id: '1.A3'
      mark_type: 'A'
      points: 2
      evidence: |
        $f(1)-g(1)=-4$(채점기준 2점).
      depends_on: ['1.M1', '1.A2']
      steps: ['1b-4']
    deductions: []
