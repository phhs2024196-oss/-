    wrong_work: '$a<b$ 조건으로 거르지 않고 $a-b=2$(접점 $x=1$)를 택하거나 두 값을 모두 답함'
    detect_cue: '답이 $0$이거나 $-4$와 $0$을 함께 적었다'
    feedback: '후보 $a-b=\pm2$ 가운데 조건 $a<b$를 만족하는 것만 남기세요.'
    remedy: [RL-1]
