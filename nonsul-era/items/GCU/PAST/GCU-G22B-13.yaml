    wrong_work: '$a_n=4^n$으로 두어 $\sum\log a_k=n(n+1)\log2$로 계산'
    detect_cue: '$n(n+1)>300$에서 $n=17$이라 답한다'
    feedback: '첫째항이 $1$이면 $a_1=4^0$입니다. 일반항의 지수가 $n-1$인지 확인하세요.'
    remedy: [RL-1]
