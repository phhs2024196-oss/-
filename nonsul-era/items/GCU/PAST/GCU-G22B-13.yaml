intent: |
  제시문의 상황에서 등비수열의 뜻, 여러 가지 수열의 합과 상용로그를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 로그합을 $n$의 이차식으로 바꿔 부등식을 푼다.
key_idea: |
  $a_n=2^{2n-2}$이므로 $\sum\log a_k=\log2\sum(2k-2)=n(n-1)\log2$; $n(n-1)>300$.
stuck: |
  $\sum_{k=1}^n(2k-2)=n(n-1)$ 계산과 $\frac{90}{0.3}=300$.
