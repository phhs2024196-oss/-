stimuli: []
stem: |
  첫째항이 $1$이고 공비가 $4$인 등비수열 $\{a_n\}$에 대하여 $\displaystyle\sum_{k=1}^{n}\log a_k>90$을 만족시키는 자연수 $n$의 최솟값을 구하는 과정을 서술하시오. (단, $\log2=0.3$으로 계산한다.)
subparts:
- id: '1'
  stem: |
    자연수 $n$의 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '18', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $n(n-1)\log2>90\iff n(n-1)>300$, $17\cdot16=272$, $18\cdot17=306$.
    steps:
    - id: '1a'
      content: |
        $a_n=2^{2n-2}$, 합 $n(n-1)\log2$, $n(n-1)>300$, $n=18$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$a_n=4^{n-1}=2^{2n-2}$입니다.'
    - '$\sum_{k=1}^n(2k-2)$를 계산하세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연B 문제13 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 302~303쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $a_n=4^{n-1}=2^{2n-2}$
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $\displaystyle\sum_{k=1}^n\log a_k=\sum_{k=1}^n(2k-2)\log2$
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        $\displaystyle\sum_{k=1}^n(2k-2)\log2=\log2\sum_{k=1}^n(2k-2)>90$, $\displaystyle\sum_{k=1}^n(2k-2)>\frac{90}{\log2}$, $n(n+1)-2n=n(n-1)>\dfrac{90}{\log2}=\dfrac{90}{0.3}=300$
      criteria: ['1.A2']
    - id: '1b-4'
      content: |
        $n=17$일 때 $17\times16=272<300$, $n=18$일 때 $18\times17=306>300$이므로 최솟값은 $n=18$. (카드 예시답안은 $18\times17=316$으로 표기 — 계산 오기, 결론 동일)
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 2
      evidence: |
        $a_n=4^{n-1}$ 혹은 $a_n=2^{2n-2}$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 2
      evidence: |
        $\sum_{k=1}^n\log a_k=\sum_{k=1}^n(2k-2)\log2$(채점기준 2점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 3
      evidence: |
        $n(n-1)>\frac{90}{\log2}$ 혹은 $n(n-1)>300$(채점기준 3점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    - id: '1.A3'
      mark_type: 'A'
      points: 3
      evidence: |
        $n=18$(채점기준 3점).
      depends_on: ['1.M1', '1.A2']
      steps: ['1b-4']
    deductions: []
