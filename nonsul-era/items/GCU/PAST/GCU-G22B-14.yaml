intent: |
  제시문의 상황에서 함수의 연속의 뜻과 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $x=1$에서의 연속 조건으로 후보를 얻고, 각 후보에서 분모가 $0$이 되는 점을 검토한다.
key_idea: |
  $x\to1+$: $\frac{a(x-1)}{x^2-1}\to\frac a2$, $x\to1-$: $\frac{3}{2a+4}$; $a^2+2a-3=0$에서 $a=-3$은 $x=3-\sqrt6$에서 분모 $0$이라 제외, $a=1$.
stuck: |
  경계점 조건만 보고 끝내지 않고, $x<1$ 구간에서 분모 $x^2+2ax+3$의 근을 확인하는 것.
