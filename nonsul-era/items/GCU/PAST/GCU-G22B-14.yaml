stem: |
  $f(x)=\begin{cases}x^2-1 & (x>1)\\ x^2+2ax+3 & (x\le1)\end{cases}$, $\quad g(x)=\begin{cases}ax-a & (x>1)\\ 2x+1 & (x\le1)\end{cases}$에 대해
  함수 $\dfrac{g(x)}{f(x)}$가 실수 전체의 집합에서 연속일 때, 상수 $a$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    상수 $a$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $\frac a2=\frac3{2a+4}\Rightarrow a^2+2a-3=0$; $a=-3$이면 $x^2-6x+3=0$의 근 $3-\sqrt6<1$에서 불연속.
    steps:
    - id: '1a'
      content: |
        우극한 $\frac a2$, 좌극한 $\frac3{2a+4}$, $a=-3$ 제외, $a=1$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '$x>1$에서 $\frac{a(x-1)}{(x-1)(x+1)}$로 약분됩니다.'
    - '후보 $a$마다 $x\le1$에서 분모가 $0$이 되는 $x$가 있는지 보세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연B 문제14 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 304~306쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $\dfrac{g(x)}{f(x)}=\begin{cases}\dfrac{ax-a}{x^2-1}&(x>1)\\[2mm]\dfrac{2x+1}{x^2+2ax+3}&(x\le1)\end{cases}$이고 유리함수 $\dfrac{ax-a}{x^2-1}$는 열린 구간 $(1,\infty)$에서 연속이다. 또한, 유리함수 $\dfrac{2x+1}{x^2+2ax+3}$는 분모 $x^2+2ax+3$가 $0$이 아니면 열린 구간 $(-\infty,1)$에서 연속이다. $\displaystyle\lim_{x\to1+}\frac{g(x)}{f(x)}=\lim_{x\to1+}\frac{ax-a}{x^2-1}=\lim_{x\to1+}\frac{a}{x+1}=\frac a2$이고
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $\displaystyle\lim_{x\to1-}\frac{g(x)}{f(x)}=\lim_{x\to1-}\frac{2x+1}{x^2+2ax+3}=\frac{3}{2a+4}$ (단, $a\ne-2$)이므로 $\dfrac a2=\dfrac{3}{2a+4}$일 때, 즉 $a^2+2a-3=0$이면 $x=1$에서 연속이다.
      criteria: ['1.M2']
    - id: '1b-3'
      content: |
        $a=-3$이면 유리함수 $\dfrac{2x+1}{x^2+2ax+3}$의 분모 $x^2+2ax+3=x^2-6x+3=0$이 $0$이 되는 $x=3-\sqrt6$가 구간 $(-\infty,1)$에 속하므로 함수 $\dfrac{g(x)}{f(x)}$는 $x=3-\sqrt6$에서 불연속이다.
      criteria: ['1.A1']
    - id: '1b-4'
      content: |
        $a=1$이면 모든 $x$에 대해 $x^2+2ax+3=x^2+2x+3\ne0$이므로 연속이다. 결국, $a=1$이면 함수 $\dfrac{g(x)}{f(x)}$가 실수 전체의 집합에서 연속이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 2
      evidence: |
        $\displaystyle\lim_{x\to1+}\frac{g(x)}{f(x)}=\frac a2$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.M2'
      mark_type: 'M'
      points: 2
      evidence: |
        $\displaystyle\lim_{x\to1-}\frac{g(x)}{f(x)}=\frac{3}{2a+4}$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: ['1b-2']
    - id: '1.A1'
      mark_type: 'A'
      points: 3
      evidence: |
        $a^2+2a-3=0$에서 $a=-3$이면 함수 $\frac{2x+1}{x^2+2ax+3}$의 분모가 0이 되므로 함수 $\frac{g(x)}{f(x)}$는 불연속이다(채점기준 3점).
      depends_on: ['1.M1', '1.M2']
      steps: ['1b-3']
    - id: '1.A2'
      mark_type: 'A'
      points: 3
      evidence: |
        $a^2+2a-3=0$에서 $a=1$이면 연속(채점기준 3점).
      depends_on: ['1.M1', '1.M2']
      steps: ['1b-4']
    deductions: []
