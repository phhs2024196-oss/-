    detect_cue: '답이 $a=\pm2$ 두 개뿐이다'
    feedback: '$a$가 극점이 아니어도 반대쪽 극값이 $0$이면 실근이 두 개가 됩니다. $f(-2)$, $f(2)$를 $a$의 식으로 쓰고 각각 $0$이 되는 $a$를 모두 찾으세요.'
    remedy: [RL-1]
