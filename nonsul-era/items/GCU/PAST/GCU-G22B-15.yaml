stimuli: []
stem: |
  미분가능한 함수 $f(x)=\displaystyle\int_a^x|t|-2\,dt$에 대하여 방정식 $f(x)=0$이 서로 다른 두 실근을 갖기 위한 모든 실수 $a$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    모든 실수 $a$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '{-2-2√2, -2, 2, 2+2√2}', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $a<0$: $f(-2)=0\Rightarrow a=-2$, $f(2)=0\Rightarrow a=-2-2\sqrt2$; $a\ge0$: $f(2)=0\Rightarrow a=2$, $f(-2)=0\Rightarrow a=2+2\sqrt2$.
    steps:
    - id: '1a'
      content: |
        $f$의 극값 $f(\pm2)$ 중 하나가 $0$; $a=-2,\ -2-2\sqrt2,\ 2,\ 2+2\sqrt2$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A3']
    hint_ladder:
    - '$f''(x)=|x|-2$이므로 극값은 $x=\pm2$에서 생깁니다.'
    - '삼차함수 꼴 그래프가 $x$축과 두 점에서 만나려면 극값 하나가 $0$이어야 합니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연B 문제15 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 307~309쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $a<0$일 때 (1) $x<0$인 경우 $f(x)=\displaystyle\int_a^x-t-2\,dt=\left[-\frac12t^2-2t\right]_a^x=-\frac12(x+2)^2+\left(\frac12a^2+2a+2\right)$, (2) $x\ge0$인 경우 $f(x)=\displaystyle\int_a^0-t-2\,dt+\int_0^xt-2\,dt=\frac12(x-2)^2+\left(\frac12a^2+2a-2\right)$. 방정식 $f(x)=0$이 서로 다른 두 실근을 갖기 위해서는 극값이 $0$이어야 한다. 따라서 $f(-2)=0$에서 $a=-2$이고
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $f(2)=0$에서 $a=-2-2\sqrt2$ $(a<0)$이다.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        $a\ge0$일 때 (1) $x\ge0$인 경우 $f(x)=\displaystyle\int_a^xt-2\,dt=\frac12(x-2)^2+\left(-\frac12a^2+2a-2\right)$, (2) $x<0$인 경우 $f(x)=\displaystyle\int_a^0t-2\,dt+\int_0^x-t-2\,dt=-\frac12(x+2)^2+\left(-\frac12a^2+2a+2\right)$. 방정식 $f(x)=0$이 서로 다른 두 실근을 갖기 위해서는 극값이어야 한다. 따라서 $f(2)=0$에서 $a=2$이고
      criteria: ['1.M2']
    - id: '1b-4'
      content: |
        $f(-2)=0$에서 $a=2+2\sqrt2$ $(a\ge0)$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
