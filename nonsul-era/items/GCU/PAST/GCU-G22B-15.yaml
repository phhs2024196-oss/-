intent: |
  제시문의 상황에서 다항함수의 정적분과 미분법의 활용에서의 방정식과 부등식을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $a$와 $x$의 부호로 경우를 나눠 $f$를 구하고, 서로 다른 두 실근이 되도록 극값이 $0$인 조건을 찾는다.
key_idea: |
  $f'(x)=|x|-2$이므로 $f$는 $x=-2$에서 극대, $x=2$에서 극소; 두 실근 ⇔ 극값 $f(-2)=0$ 또는 $f(2)=0$.
stuck: |
  $a$의 부호에 따라 적분 구간을 $0$에서 나누는 것과, 극값 두 개 각각이 $0$이 되는 경우를 모두 찾는 것.
