      depends_on: []
      implied_ok: false
      steps: ['1b-3']
    - id: '1.A3'
      mark_type: 'A'
      points: 3
      evidence: |
        $a=2+2\sqrt2$(채점기준 3점).
      depends_on: ['1.M2']
      steps: ['1b-4']
    deductions: []
