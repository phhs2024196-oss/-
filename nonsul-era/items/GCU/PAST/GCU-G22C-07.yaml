intent: |
  제시문의 상황에서 지수함수와 로그함수의 그래프를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 감소하는 지수함수 그래프의 제1사분면 부분(두 절편 사이)과 로그함수 그래프가 만나는 $a$의 범위를 구한다.
key_idea: |
  $y=\left(\frac12\right)^{x-2}-1$은 $(0,3)$과 $(2,0)$을 지나는 감소함수이므로, $y=\log_2(x+a)$가 $(0,3)$을 지날 때($a=8$)와 $(2,0)$을 지날 때($a=-1$) 사이.
stuck: |
  로그함수 그래프를 왼쪽·오른쪽으로 평행이동하며 경계를 찾는 것.
