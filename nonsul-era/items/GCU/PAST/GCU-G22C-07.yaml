    - id: '1.B2'
      mark_type: 'B'
      points: 2
      evidence: |
        ② $(2,0)$ 또는 $2$(채점기준 2점).
      depends_on: []
      steps: ['1b-2']
    - id: '1.A1'
      mark_type: 'A'
      points: 3
      evidence: |
        ③ $a=8$(채점기준 3점).
      depends_on: ['1.M1']
      steps: ['1b-3']
    - id: '1.A2'
      mark_type: 'A'
      points: 3
      evidence: |
        ④ $a=-1$(채점기준 3점).
      depends_on: ['1.M1', '1.B2']
      steps: ['1b-4']
    deductions: []
