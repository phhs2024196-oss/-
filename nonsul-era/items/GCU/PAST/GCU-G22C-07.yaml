stem: |
  두 함수 $y=\left(\dfrac{1}{2}\right)^{x-2}-1$, $y=\log_2(x+a)$의 그래프가 제$1$사분면에서 만나도록 하는 모든 실수 $a$의 값의 범위를 구하는 다음의 풀이 과정을 완성하시오.

  [풀이 과정] $y=\left(\dfrac{1}{2}\right)^{x-2}-1$은 두 점 $(0,$ ( ① )$)$과 $($( ② )$,0)$을 지나는 함수이다. 따라서 $y=\log_2(x+a)$의 그래프가 제$1$사분면에서 만나도록 하는 실수 $a$의 값은 ( ③ ) 보다 작아야 하고, ( ④ ) 보다 커야 한다.
subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '① 3  ② 2  ③ 8  ④ -1  (-1<a<8)', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $3=\log_2 a\Rightarrow a=8$, $0=\log_2(2+a)\Rightarrow a=-1$; $-1<a<8$.
    steps:
    - id: '1a'
      content: |
        ① $3$ ② $2$ ③ $8$ ④ $-1$
      criteria: ['1.M1', '1.B2', '1.A1', '1.A2']
    hint_ladder:
    - '지수함수의 $y$절편과 $x$절편을 구하세요.'
    - '$y=\log_2(x+a)$가 두 절편점을 지날 때의 $a$가 경계입니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연C 문제7 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 310~312쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $y=\left(\dfrac12\right)^{x-2}-1$은 $(0,3)$과
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $(2,0)$을 지나는 감소함수 형태이다. 따라서 $y=\log_2(x+a)$의 그래프가 제$1$사분면에서 만나도록 하는 $a$의 값은 $y=\log_2(x+a)$의 그래프가 점 $(0,3)$을 지나도록 하는 $a$값보다 작아야 하고, 점 $(2,0)$을 지나도록 하는 $a$값보다 커야 한다.
      criteria: ['1.B2']
    - id: '1b-3'
      content: |
        즉, $3=\log_2a$, $\therefore a=8$,
      criteria: ['1.A1']
    - id: '1b-4'
      content: |
        $0=\log_2(2+a)$, $\therefore a=-1$. $a$값의 범위는 $-1<a<8$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 2
      evidence: |
