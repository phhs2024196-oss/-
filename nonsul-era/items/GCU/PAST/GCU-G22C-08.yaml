intent: |
  제시문의 상황에서 등차수열과 등비수열의 관계, 등비수열의 합을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 로그로 이루어진 등차수열의 공차를 구하고 $3^{a_k}$가 등비수열임을 이용해 합을 계산한다.
key_idea: |
  $-2\log_32+10d=3\log_32$에서 $d=\frac12\log_32$; $3^{a_k}$는 첫째항 $3^{a_2}=\frac12$, 공비 $3^d=\sqrt2$인 등비수열.
stuck: |
  $3^{\log_3 2^{s}}=2^{s}$로 지수·로그를 정리하는 것과 항의 개수(8개).
