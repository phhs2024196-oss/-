stem: |
  두 수 $\log_3\dfrac{1}{4}$과 $\log_38$ 사이에 $9$개의 수 $a_1,\ a_2,\ a_3,\ \cdots,\ a_9$를 넣어 만든 $11$개의 수가 등차수열을 이룰 때, $3^{a_2}+3^{a_3}+3^{a_4}+\cdots+3^{a_9}$의 값을 구하는 다음의 풀이 과정을 완성하시오.

  [풀이 과정] $\log_3\dfrac{1}{4}+10d=\log_38$에서 공차 $d=$ ( ① ) 이다.
  $3^{a_2},\ 3^{a_3},\ 3^{a_4},\ \cdots,\ 3^{a_9}$은 첫째항이 ( ② ), 공비가 ( ③ ) 인 등비수열이므로 $3^{a_2}+3^{a_3}+3^{a_4}+\cdots+3^{a_9}$의 값은 ( ④ )이다.
subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '① (1/2)log_3 2  ② 1/2  ③ √2  ④ (15/2)(√2+1)', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $d=\frac12\log_32$, $3^{a_2}=\frac12$, 공비 $\sqrt2$, 8개 항의 합 $\frac{\frac12\{(\sqrt2)^8-1\}}{\sqrt2-1}=\frac{15}2(\sqrt2+1)$.
    steps:
    - id: '1a'
      content: |
        ① $\frac12\log_32$ ② $\frac12$ ③ $\sqrt2$ ④ $\frac{15}2(\sqrt2+1)$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$\log_3\frac14=-2\log_32$, $\log_38=3\log_32$입니다.'
    - '$3^{a_2}$부터 $3^{a_9}$까지는 몇 개의 항인가요?'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연C 문제8 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 313~314쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $-2\log_32+10d=3\log_32$에서 공차 $d=\dfrac12\log_32$이고, $a_1=-\dfrac32\log_32$, $a_2=-\log_32$, $\cdots$, $a_9=\dfrac52\log_32$.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $3^{a_2},\ 3^{a_3},\ 3^{a_4},\ \cdots,\ 3^{a_9}$는 첫째항이 $\dfrac12$,
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        공비가 $\sqrt2$인 등비수열이므로
      criteria: ['1.A2']
    - id: '1b-4'
      content: |
        $3^{a_2}+3^{a_3}+3^{a_4}+\cdots+3^{a_9}$의 값은 $\dfrac{\frac12\{(\sqrt2)^8-1\}}{\sqrt2-1}=\dfrac{15}{2}\cdot\dfrac{1}{\sqrt2-1}=\dfrac{15}{2}(\sqrt2+1)$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
        ① $d=\frac12\log_32$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 2
      evidence: |
        ② $\frac12$(채점기준 2점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 2
      evidence: |
        ③ $\sqrt2$(채점기준 2점).
      depends_on: ['1.M1']
      steps: ['1b-3']
    - id: '1.A3'
      mark_type: 'A'
      points: 3
      evidence: |
        ④ $\frac{15}2(\sqrt2+1)$ 또는 $\frac{15}2\cdot\frac1{\sqrt2-1}$(채점기준 3점).
      depends_on: ['1.M1', '1.A1', '1.A2']
      steps: ['1b-4']
    deductions: []
