intent: |
  제시문의 상황에서 지수함수와 로그함수의 그래프를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 밑이 $0$과 $1$ 사이인 지수함수의 최댓값 조건으로 $a$를 구하고 최솟값을 계산한다.
key_idea: |
  $0<\frac{\log_a(a+2)}{\log_a(a+2)+1}<1$이므로 $f$는 감소, 최댓값 $f(-2)=\frac92$; 비 $=\frac23$에서 $\log_a(a+2)=2$.
stuck: |
  밑이 $1$보다 작은 지수함수임을 알아차리는 것.
