stimuli: []
stem: |
  정의역이 $\{x\mid-2\le x\le1\}$인 함수 $f(x)=2\times\left(\dfrac{\log_a(a+2)}{\log_a(a+2)+1}\right)^{x}\ (a>1)$의 최댓값이 $\dfrac{9}{2}$일 때, 상수 $a$의 값과 $f(x)$의 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    상수 $a$의 값과 $f(x)$의 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'a=2, 최솟값 4/3', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $\left(\frac{L}{L+1}\right)^{-2}=\frac94\Rightarrow\frac L{L+1}=\frac23\Rightarrow L=2$, $a^2=a+2$, $a=2$; 최솟값 $f(1)=\frac43$.
    steps:
    - id: '1a'
      content: |
        $f(-2)=\frac92$, $\log_a(a+2)=2$, $a=2$, $f(1)=\frac43$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$a>1$이면 $\log_a(a+2)>0$입니다. 괄호 안의 값은 $1$보다 큰가요, 작은가요?'
    - '최댓값은 정의역의 어느 끝에서 나오나요?'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연C 문제9 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 315~316쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $0<\left(\dfrac{\log_a(a+2)}{\log_a(a+2)+1}\right)<1$이므로, 함수 $f(x)$는 $x=-2$에서 최댓값을 가진다. $f(-2)=2\times\left(\dfrac{\log_a(a+2)}{\log_a(a+2)+1}\right)^{-2}=\dfrac92$,
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $\left(\dfrac{\log_a(a+2)}{\log_a(a+2)+1}\right)^2=\dfrac49$, $\dfrac{\log_a(a+2)}{\log_a(a+2)+1}=\dfrac23$, $\therefore\log_a(a+2)=2$, $a+2=a^2$, $a^2-a-2=0$, $(a-2)(a+1)=0$, $\therefore a=2,\ -1$
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        따라서 $a=2$ ($a>1$이므로 $a=-1$은 해당하지 않음)
      criteria: ['1.A2']
    - id: '1b-4'
      content: |
        최솟값은 $f(1)=2\times\left(\dfrac{2}{2+1}\right)^1=\dfrac43$.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 2
      evidence: |
        $f(-2)=\frac92$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 3
      evidence: |
        $\log_a(a+2)=2$ 또는 $a^2-a-2=0$(채점기준 3점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 2
      evidence: |
        $a=2$이고 ($a=-1$은 해당하지 않음)(채점기준 2점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    - id: '1.A3'
      mark_type: 'A'
      points: 3
      evidence: |
        최솟값은 $f(1)=\frac43$(채점기준 3점).
      depends_on: ['1.M1', '1.A2']
      steps: ['1b-4']
    deductions: []
