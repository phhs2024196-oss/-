stimuli: []
stem: |
  $0\le x<2\pi$에서 방정식 $3+3\cos x\tan x=2\cos^2x$의 모든 실근의 합을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    모든 실근의 합을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3π', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $(2\sin x+1)(\sin x+1)=0$; $\sin x=-\frac12$의 두 해만 남는다.
    steps:
    - id: '1a'
      content: |
        $x=\frac76\pi,\ \frac{11}6\pi$ ($x=\frac32\pi$ 제외), 합 $3\pi$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$\cos x\tan x=\sin x$, $\cos^2x=1-\sin^2x$로 바꾸세요.'
    - '$\tan x$가 정의되지 않는 $x$가 해에 섞여 있지 않은지 확인하세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연C 문제10 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 317~318쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        삼각함수의 관계식 $\tan x=\dfrac{\sin x}{\cos x}$과 $\cos^2x=1-\sin^2x$을 식에 대입하여 정리하면 $2\sin^2x+3\sin x+1=0$의 식을 얻는다. $(2\sin x+1)(\sin x+1)=0$으로 인수분해 되어 $\sin x=-\dfrac12$ 또는 $\sin x=-1$을 만족하는 해를 구한다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $0\le x<2\pi$에서 (1) $\sin x=-\dfrac12$이므로 $x=\dfrac76\pi,\ \dfrac{11}6\pi$이다.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        (2) $\sin x=-1$이므로 $x=\dfrac32\pi$를 만족하지만 이 경우 $\cos\dfrac32\pi=0$이므로 $\tan x$가 정의되지 않으므로 해가 되지 않는다.
      criteria: ['1.A2']
    - id: '1b-4'
      content: |
        따라서 모든 실근은 $x=\dfrac76\pi,\ \dfrac{11}6\pi$이고 합은 $\dfrac76\pi+\dfrac{11}6\pi=3\pi$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
        $2\sin^2x+3\sin x+1=0$ 또는 $(2\sin x+1)(\sin x+1)=0$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 2
      evidence: |
        $\sin x=-\frac12$이므로 $x=\frac76\pi,\ \frac{11}6\pi$(채점기준 2점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 3
      evidence: |
        $\sin x=-1$이므로 $x=\frac32\pi$를 만족하지만 이 경우 $\cos\frac32\pi=0$이므로 $\tan x$가 정의되지 않으므로 해가 되지 않는다(채점기준 3점).
      depends_on: ['1.M1']
      steps: ['1b-3']
    - id: '1.A3'
      mark_type: 'A'
      points: 2
      evidence: |
        $3\pi$(채점기준 2점).
      depends_on: ['1.M1', '1.A1', '1.A2']
      steps: ['1b-4']
    deductions: []
