intent: |
  제시문의 상황에서 삼각함수의 그래프를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 삼각함수 사이의 관계로 $\sin x$의 이차방정식을 만들고, $\tan x$가 정의되지 않는 해를 제외한다.
key_idea: |
  $\cos x\tan x=\sin x$, $\cos^2x=1-\sin^2x$로 $2\sin^2x+3\sin x+1=0$; $\sin x=-1$이면 $\tan x$ 정의 안 됨.
stuck: |
  $x=\frac32\pi$를 해에서 빼는 것.
