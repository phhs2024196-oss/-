intent: |
  제시문의 상황에서 미분가능의 정의와 연속성을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 연속·미분가능 조건으로 $a,b$를 정하고 닫힌구간에서 최대·최소를 구한다.
key_idea: |
  연속: $3a+1=a^2+b$; 미분계수: $-2a=-2a^2$, $a\ne0$이므로 $a=1$, $b=3$; $[-2,2]$에서 최댓값 $f(2)=7$, 최솟값 $f(0)=3$.
stuck: |
  좌·우 미분계수를 비교하는 식 $-2a=-2a^2$.
