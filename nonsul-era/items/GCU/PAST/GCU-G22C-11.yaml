stem: |
  함수 $f(x)=\begin{cases}a(1-2x)+1 & (x<-1)\\ a^2x^2+b & (x\ge-1)\end{cases}$가 실수 전체의 집합에서 미분가능할 때, 닫힌구간 $[-2,\ 2]$에서 이 함수의 최댓값과 최솟값을 구하는 과정을 서술하시오. (단, $a$, $b$는 상수이고 $a\ne0$이다.)
subparts:
- id: '1'
  stem: |
    최댓값과 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '최댓값 7, 최솟값 3', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $a=1$, $b=3$이면 $f(x)=2-2x\ (x<-1)$, $x^2+3\ (x\ge-1)$; $f(-2)=6$, $f(2)=7$, $f(0)=3$.
    steps:
    - id: '1a'
      content: |
        $a=1$, $b=3$, 최댓값 $f(2)=7$, 최솟값 $f(0)=3$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$x=-1$에서 연속이어야 하고, 좌·우 미분계수도 같아야 합니다.'
    - '$a\ne0$ 조건으로 $a$를 하나로 정하세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연C 문제11 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 319~320쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $x=-1$에서 연속이므로 $\displaystyle\lim_{x\to-1-}f(x)=\lim_{x\to-1+}f(x)$로부터 $3a+1=a^2+b$, $b=-a^2+3a+1$이다. 또한 $x=-1$에서 미분가능하므로 $\displaystyle\lim_{x\to-1-}\frac{f(x)-f(-1)}{x-(-1)}=\lim_{x\to-1+}\frac{f(x)-f(-1)}{x-(-1)}$로부터 $-2a=-2a^2$이다. 따라서 조건 $a\ne0$으로부터 $a=1$,
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $b=3$이다.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        결과적으로 닫힌구간 $[-2,2]$에서 함수 $f(x)$는 $x=2$에서 최댓값 $f(2)=7$을 갖고
      criteria: ['1.A2']
    - id: '1b-4'
      content: |
        $f(x)$의 최솟값은 $x=0$에서의 극솟값 $f(0)=3$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 2
      evidence: |
        $a=1$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 2
      evidence: |
        $b=3$(채점기준 2점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 3
      evidence: |
        최댓값은 $f(2)=7$(채점기준 3점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    - id: '1.A3'
      mark_type: 'A'
      points: 3
      evidence: |
        최솟값은 $f(0)=3$(채점기준 3점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-4']
    deductions: []
