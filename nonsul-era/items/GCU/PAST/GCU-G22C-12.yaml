stem: |
  수열 $\{a_n\}$은 첫째항이 $3$이고, 모든 자연수 $n$에 대하여
  $$a_{n+1}=\begin{cases}a_n+5 & (a_n\le0\ \text{이거나}\ \log_2a_n\text{이 정수가 아닌 경우})\\ \log_2\dfrac{1}{a_n} & (a_n>0\ \text{이고}\ \log_2a_n\text{이 정수인 경우})\end{cases}$$
  를 만족시킬 때, $\displaystyle\sum_{k=1}^{1939}a_k$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{k=1}^{1939}a_k$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3047', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      주기 7, 한 주기 합 11, $277\times11=3047$.
    steps:
    - id: '1a'
      content: |
        $a_2=8,a_3=-3,a_4=2,a_5=-1,a_6=4,a_7=-2,a_8=3$; $277\times11=3047$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$a_2,a_3,\dots$를 직접 몇 개 구해 보세요.'
    - '$a_1$과 같은 값이 다시 나오면 그다음부터는 반복됩니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연C 문제12 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 321~322쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $a_1=3$이고, 차례로 대입하면 $a_2=8,\ a_3=-3,\ a_4=2,\ a_5=-1,\ a_6=4,\ a_7=-2,\ a_8=3$이므로 수열 $\{a_n\}$의 각 항은 $3,\ 8,\ -3,\ 2,\ -1,\ 4,\ -2,\ \cdots$ 반복된다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $\displaystyle\sum_{k=1}^{1939}a_k$은 $1939/7=277$이므로
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        $\displaystyle\sum_{k=1}^{1939}a_k=277\times\sum_{k=1}^{7}a_k=277\times11=3047$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
