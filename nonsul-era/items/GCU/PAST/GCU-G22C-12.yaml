intent: |
  제시문의 상황에서 수열의 귀납적 정의와 여러가지 수열의 합을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 항을 차례로 구해 주기 7을 찾고 합을 계산한다.
key_idea: |
  $3,8,-3,2,-1,4,-2,3,\dots$로 7개의 수가 반복되고 한 주기 합은 $11$; $1939=7\times277$.
stuck: |
  조건 「$a_n>0$이고 $\log_2a_n$이 정수」를 항마다 정확히 판정하는 것.
