intent: |
  제시문의 상황에서 연속함수의 성질과 사잇값 정리를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 보조함수 $g(x)=2f(x)-f(a)-f(b)$에 사잇값 정리를 적용한다.
key_idea: |
  $g(x)=2f(x)-f(a)-f(b)$이면 $g(a)=f(a)-f(b)$, $g(b)=-g(a)$로 부호가 반대이므로 사잇값 정리.
stuck: |
  평균값 $\frac12(f(a)+f(b))$가 $f(a)$와 $f(b)$ 사이에 있음을 보조함수의 부호로 나타내는 것.
