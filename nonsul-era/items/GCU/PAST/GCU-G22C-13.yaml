stimuli: []
stem: |
  $f(x)$가 다항함수일 때, 열린구간 $(21,\ 22)$에 속하는 임의의 서로 다른 두 실수 $a$, $b$에 대하여 $f(c)=\dfrac{1}{2}(f(a)+f(b))$가 성립하는 상수 $c$가 열린구간 $(21,\ 22)$에 존재함을 보이는 과정을 서술하시오. (단, $f(a)\ne f(b)$로 가정한다.)
subparts:
- id: '1'
  stem: |
    $c$가 열린구간 $(21,\ 22)$에 존재함을 보이시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $g(x)=2f(x)-f(a)-f(b)$는 $[a,b]$에서 연속이고 $g(a)=-g(b)\ne0$이므로 사잇값 정리로 $g(c)=0$인 $c$가 존재.
    steps:
    - id: '1a'
      content: |
        $g$ 연속, $g(a)g(b)<0$, 사잇값 정리, $[a,b]\subset(21,22)$
      criteria: ['1.M1', '1.R1', '1.R2', '1.R3']
    hint_ladder:
    - '$f(c)=\frac12(f(a)+f(b))$를 $g(c)=0$ 꼴로 바꿔 보세요.'
    - '$g(a)$와 $g(b)$의 부호를 비교하세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연C 문제13 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 323~324쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $g(x)=2f(x)-f(a)-f(b)$로 정의된 함수 $g(x)$는 열린 구간 $(21,22)$에서 연속이므로 닫힌 구간 $[a,b]$에서 연속이다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        또한, $g(a)=2f(a)-f(a)-f(b)=f(a)-f(b)$, $g(b)=2f(b)-f(a)-f(b)=f(b)-f(a)=-g(a)$. ($f(a)\ne f(b)$이므로 $g(a)g(b)<0$)
      criteria: ['1.R1']
    - id: '1b-3'
      content: |
        따라서 두 실수 $g(a)$와 $g(b)$ 사이에 $0$이 존재하므로 사잇값 정리(중간값 정리)에 의하여 $g(c)=0$를 만족하는 $c$가 닫힌 구간 $[a,b]$에 존재한다.
      criteria: ['1.R2']
    - id: '1b-4'
      content: |
        결국, $[a,b]\subset(21,22)$이고 $g(c)=2f(c)-f(a)-f(b)$이므로 $f(c)=\dfrac12(f(a)+f(b))$가 성립하는 $c$가 열린 구간 $(21,22)$에 존재한다. ■ (카드는 $a<b$로 두고 $[a,b]$를 씀; $a>b$이면 $[b,a]$)
      criteria: ['1.R3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
        $g(x)=2f(x)-f(a)-f(b)$는 닫힌 구간 $[a,b]$에서 연속이다(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.R1'
      mark_type: 'R'
      points: 3
      evidence: |
        $g(a)$와 $g(b)$의 부호가 다르다 또는 $g(a)g(b)<0$(채점기준 3점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.R2'
      mark_type: 'R'
      points: 2
      evidence: |
        사잇값 정리에 의해 $g(c)=0$을 만족하는 $c$가 닫힌 구간 $[a,b]$에 존재한다(채점기준 2점).
      depends_on: ['1.M1', '1.R1']
      steps: ['1b-3']
    - id: '1.R3'
      mark_type: 'R'
      points: 2
      evidence: |
        $[a,b]\subset(21,22)$이고 $g(c)=2f(c)-f(a)-f(b)$이므로 $f(c)=\frac12(f(a)+f(b))$가 성립하는 $c$가 열린 구간 $(21,22)$에 존재한다(채점기준 2점).
      depends_on: ['1.R2']
      steps: ['1b-4']
    deductions: []
