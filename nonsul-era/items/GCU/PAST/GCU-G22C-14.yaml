  제시문의 상황에서 역함수의 대칭성을 이용한 정적분의 값을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $y=x$ 대칭으로 역함수의 정적분을 원함수의 정적분으로 바꾼다.
