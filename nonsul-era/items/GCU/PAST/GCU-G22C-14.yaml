stimuli: []
stem: |
  함수 $f(x)=x^3+2x+2$의 역함수를 $g(x)$라 할 때, $\displaystyle\int_2^5g(x)\,dx$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\displaystyle\int_2^5g(x)\,dx$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '7/4', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $g(2)=0$, $g(5)=1$; $\int_2^5g=5-\int_0^1(x^3+2x+2)\,dx=5-\frac{13}4=\frac74$.
    steps:
    - id: '1a'
      content: |
        $g(2)=0$, $g(5)=1$, $5-\int_0^1f=\frac74$
      criteria: ['1.B1', '1.B2', '1.M2', '1.A1']
    hint_ladder:
    - '$f(a)=2$, $f(b)=5$인 $a$, $b$를 찾으세요.'
    - '역함수 그래프 아래 넓이는 직사각형에서 원함수 쪽 넓이를 뺀 것입니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연C 문제14 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 325~326쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $g(2)=a$라 하면 $f(a)=2$이므로 $a^3+2a+2=2$ 즉 $a(a^2+2)=0$을 만족하고 $a^2+2>0$이므로 $a=0$이다.
      criteria: ['1.B1']
    - id: '1b-2'
      content: |
        $g(5)=b$라 하면 $f(b)=5$이므로 $b^3+2b+2=5$ 즉 $(b-1)(b^2+b+3)=0$을 만족하고 $b^2+b+3=\left(b+\frac12\right)^2+\frac{11}4>0$이므로 $b=1$이다.
      criteria: ['1.B2']
    - id: '1b-3'
      content: |
        따라서 역함수는 직선 $y=x$에 대칭이므로 $\displaystyle\int_2^5g(x)\,dx=5-\int_0^1f(x)\,dx$이다.
      criteria: ['1.M2']
    - id: '1b-4'
      content: |
        따라서 $\displaystyle\int_2^5g(x)\,dx=5-\int_0^1x^3+2x+2\,dx=5-\left[\frac14x^4+x^2+2x\right]_0^1=\frac74$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
