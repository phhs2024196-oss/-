stimuli: []
stem: |
  함수 $f(x)=\dfrac{1}{9}(5x^2+7x+2)$에 대하여 곡선 $y=f(x)$ 위의 서로 다른 두 점 $\mathrm{A}(2,\ 4)$, $\mathrm{B}(a,\ f(a))$에서의 접선을 각각 $l_1$, $l_2$라 하면, 두 직선 $l_1$, $l_2$는 점 $\mathrm{P}$에서 서로 수직으로 만난다. 이때 삼각형 $\mathrm{ABP}$의 면적을 구하는 과정을 서술하시오. (단, $a$는 상수)
subparts:
- id: '1'
  stem: |
    삼각형 $\mathrm{ABP}$의 면적을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '15/4', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $l_1: 3x-y-2=0$, $l_2: x+3y+1=0$; $\overline{AP}=\frac{15}{\sqrt{10}}$, $\overline{BP}=\frac5{\sqrt{10}}$; 넓이 $\frac{15}4$.
    steps:
    - id: '1a'
      content: |
        $l_1$, $l_2$, $\overline{AP}=\frac{15}{\sqrt{10}}$, $\overline{BP}=\frac5{\sqrt{10}}$, 넓이 $\frac{15}4$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '$f''(2)$를 구하고, 수직이 되려면 $f''(a)$는 얼마여야 할까요?'
    - '$\overline{AP}$는 점 A에서 직선 $l_2$까지의 거리입니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연C 문제15 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 327~328쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $f'(2)=3$이므로 점 $A(2,4)$를 지나는 접선 $l_1$의 방정식은 $y-4=3(x-2)$, 또는 $3x-y-2=0$이다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        한편 $f'(x)=-\dfrac13$을 만족하는 $x$는 $x=-1$이므로 점 $B$는 $(-1,0)$이고 이 점을 지나는 접선 $l_2$의 방정식은 $y=-\dfrac13(x+1)$, 또는 $x+3y+1=0$이다.
      criteria: ['1.M2']
    - id: '1b-3'
      content: |
        선분 $\overline{AP}$의 길이는 점 A에서 직선 $l_2$까지의 수직거리이므로 $\dfrac{|1\cdot2+3\cdot4+1|}{\sqrt{1^2+3^2}}=\dfrac{15}{\sqrt{10}}$, 선분 $\overline{BP}$의 길이는 $\dfrac{|3(-1)-1(0)-2|}{\sqrt{3^2+(-1)^2}}=\dfrac{5}{\sqrt{10}}$이다.
      criteria: ['1.A1']
    - id: '1b-4'
      content: |
        따라서 직각삼각형 ABP의 면적은 $\dfrac12\cdot\dfrac{15}{\sqrt{10}}\cdot\dfrac{5}{\sqrt{10}}=\dfrac{15}{4}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 2
      evidence: |
        접선 $l_1$의 방정식은 $y-4=3(x-2)$ 또는 $3x-y-2=0$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.M2'
      mark_type: 'M'
      points: 4
      evidence: |
        접선 $l_2$의 방정식은 $y=-\frac13(x+1)$ 또는 $x+3y+1=0$(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: ['1b-2']
    - id: '1.A1'
      mark_type: 'A'
      points: 3
      evidence: |
        선분 $\overline{AP}$의 길이는 $\frac{15}{\sqrt{10}}$, 선분 $\overline{BP}$의 길이는 $\frac5{\sqrt{10}}$(채점기준 3점).
      depends_on: ['1.M1', '1.M2']
      steps: ['1b-3']
    - id: '1.A2'
      mark_type: 'A'
      points: 1
      evidence: |
        삼각형 ABP의 면적은 $\frac{15}4$(채점기준 1점).
      depends_on: ['1.M2', '1.A1']
      steps: ['1b-4']
    deductions: []
