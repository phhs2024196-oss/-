intent: |
  제시문의 상황에서 미분법의 활용에서 접선의 방정식을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 수직 조건으로 두 번째 접점을 찾고, 점과 직선 사이 거리로 직각삼각형의 두 변을 구한다.
key_idea: |
  $f'(2)=3$이므로 $f'(a)=-\frac13$, $a=-1$, $B(-1,0)$; $\overline{AP}$, $\overline{BP}$는 각각 A에서 $l_2$, B에서 $l_1$까지의 거리.
stuck: |
  P를 직접 구하지 않고 점과 직선 사이 거리로 직각을 낀 두 변을 구하는 것.
