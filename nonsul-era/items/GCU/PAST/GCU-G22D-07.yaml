stem: |
  $1$이 아닌 세 양수 $a$, $b$, $c$에 대하여 $a^3=b^4=c^5$일 때,
  $\log_{\frac{1}{a}}\sqrt{b}+\log_b\dfrac{b}{c}+\log_ca^{\frac{1}{2}}=\dfrac{q}{p}$이다. $\dfrac{q}{p}$의 값을 구하는 다음의 풀이 과정을 완성하시오. (단, $p$와 $q$는 서로소인 자연수)

  [풀이 과정] $a^3=b^4=c^5=k$라 하면 $a=k^{\frac13}$, $b=k^{\frac14}$, $c=k^{\frac15}$이므로
  $\log_{\frac1a}\sqrt{b}=$ ( ① ), $\log_b\dfrac{b}{c}=$ ( ② ), $\log_ca^{\frac12}=$ ( ③ )이다.
  따라서, $\dfrac{q}{p}$의 값은 ( ④ )이다.
subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '① -3/8  ② 1/5  ③ 5/6  ④ 79/120', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $-\frac12\log_ab=-\frac38$, $1-\log_bc=\frac15$, $\frac12\log_ca=\frac56$; 합 $\frac{79}{120}$.
    steps:
    - id: '1a'
      content: |
        ① $-\frac38$ ② $\frac15$ ③ $\frac56$ ④ $\frac{79}{120}$
      criteria: ['1.M1', '1.B1', '1.B2', '1.A1']
    hint_ladder:
    - '$\log_{k^{1/3}}k^{1/4}$은 지수의 비 $\frac{1/4}{1/3}$입니다.'
    - '$\log_{\frac1a}x=-\log_ax$입니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연D 문제7 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 329~331쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $a^3=b^4=c^5=k$라 하면 $a=k^{\frac13}$, $b=k^{\frac14}$, $c=k^{\frac15}$이므로 $\log_{\frac1a}\sqrt b=-\dfrac12\log_ab=-\dfrac12\log_{k^{\frac13}}k^{\frac14}=-\dfrac12\times\dfrac34=-\dfrac38$
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $\log_b\dfrac bc=1-\log_bc=1-\log_{k^{\frac14}}k^{\frac15}=1-\dfrac45=\dfrac15$
      criteria: ['1.B1']
    - id: '1b-3'
      content: |
        $\log_ca^{\frac12}=\dfrac12\log_{k^{\frac15}}k^{\frac13}=\dfrac56$
      criteria: ['1.B2']
    - id: '1b-4'
      content: |
        $\log_{\frac1a}\sqrt b+\log_b\dfrac bc+\log_ca^{\frac12}=\dfrac{79}{120}$
      criteria: ['1.A1']
