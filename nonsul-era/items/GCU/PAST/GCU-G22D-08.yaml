stem: |
  함수 $f(x)=\begin{cases}(3-a)x+b & (x<1)\\ ax^2+c & (x\ge1)\end{cases}$가 $x=1$에서 미분가능할 때, $b-c$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$, $c$는 상수)
subparts:
- id: '1'
  stem: |
    $b-c$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-1', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      연속에서 $b-c=2a-3$, 미분계수 일치에서 $a=1$.
    steps:
    - id: '1a'
      content: |
        $b-c=2a-3$, $a=1$, $b-c=-1$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - '$x=1$에서 연속이어야 합니다.'
    - '좌미분계수 $3-a$와 우미분계수 $2a$가 같아야 합니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연D 문제8 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 332~333쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        함수 $f(x)$가 $x=1$에서 연속이어야 하므로 $\displaystyle\lim_{x\to1-}f(x)=\lim_{x\to1+}f(x)$이다. 따라서 $3-a+b=a+c$, $b-c=2a-3$이다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        또한 함수 $f(x)$가 $x=1$에서 미분가능해야 하므로 $\displaystyle\lim_{x\to1-}\frac{f(x)-f(1)}{x-1}=\lim_{x\to1+}\frac{f(x)-f(1)}{x-1}$이다. 따라서 $\displaystyle\lim_{x\to1-}\frac{(3-a)(x-1)}{x-1}=\lim_{x\to1+}\frac{a(x^2-1)}{x-1}$, $3-a=2a$, $a=1$이다.
      criteria: ['1.M2']
    - id: '1b-3'
      content: |
        두 결과로부터 $b-c=-1$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
