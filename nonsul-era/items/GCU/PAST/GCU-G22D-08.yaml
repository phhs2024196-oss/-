intent: |
  제시문의 상황에서 미분가능의 정의와 연속성을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 연속 조건과 좌·우 미분계수 조건으로 $b-c$를 구한다.
key_idea: |
  연속: $3-a+b=a+c$이므로 $b-c=2a-3$; 미분가능: $3-a=2a$, $a=1$; $b-c=-1$.
stuck: |
  미지수가 셋인데 $b-c$만 정해진다는 점.
