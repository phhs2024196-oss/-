stem: |
  $0\le x\le2\pi$에서 함수 $f(x)=\cos\left(x-\dfrac{\pi}{2}\right)\sin(x-\pi)-2\cos^2x-\sin x$의 최댓값과 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    최댓값과 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '최댓값 0, 최솟값 -9/4', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $f=t^2-t-2=\left(t-\frac12\right)^2-\frac94$, $-1\le t\le1$; 최솟값 $f\left(\frac12\right)=-\frac94$, 최댓값 $f(-1)=0$.
    steps:
    - id: '1a'
      content: |
        $t^2-t-2$, 최댓값 $0$, 최솟값 $-\frac94$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$\cos\left(x-\frac\pi2\right)$, $\sin(x-\pi)$를 $\sin x$로 나타내세요.'
    - '$t=\sin x$의 범위 안에서 꼭짓점과 양 끝값을 비교하세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연D 문제9 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 334~335쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $\cos\left(x-\dfrac\pi2\right)=\sin x$, $\sin(x-\pi)=-\sin x$, $\cos^2x=1-\sin^2x$이므로 원래의 식을 $\sin x=t$의 식으로 다시 쓰면 $f(t)=t^2-t-2=\left(t-\dfrac12\right)^2-\dfrac94$이다. $0\le x\le2\pi$일 때 $-1\le t\le1$이다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        최댓값은 $f(-1)=0$이다.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        따라서 최솟값은 $f\left(\dfrac12\right)=-\dfrac94$이고,
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 4
      evidence: |
        $f(x)=\sin^2x-\sin x-2=\left(\sin x-\frac12\right)^2-\frac94$ 또는 $\sin x=t$일 때 $f(t)=t^2-t-2=\left(t-\frac12\right)^2-\frac94$ (카드 채점 기준 첫 식의 $-\frac14$는 $-\frac94$의 오기)(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 3
      evidence: |
        최댓값은 $0$(채점기준 3점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 3
      evidence: |
        최솟값은 $-\frac94$(채점기준 3점).
      depends_on: ['1.M1']
      steps: ['1b-3']
    deductions: []
