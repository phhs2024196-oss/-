intent: |
  제시문의 상황에서 삼각함수의 성질과 치환을 통한 이차함수의 최대최소를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $\sin x=t$로 바꿔 $[-1,1]$에서 이차함수의 최대·최소를 구한다.
key_idea: |
  $\cos\left(x-\frac\pi2\right)=\sin x$, $\sin(x-\pi)=-\sin x$, $\cos^2x=1-\sin^2x$로 $f=t^2-t-2\ (-1\le t\le1)$.
stuck: |
  이동된 삼각함수를 $\sin x$로 정확히 바꾸는 것.
