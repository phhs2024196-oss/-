stem: |
  등비수열 $\{a_n\}$에 대하여 $a_3+a_9=36$, $a_3+a_5=12$일 때, $a_1+a_9$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $a_1+a_9$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '34', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $r^2=2$, $a=2$, $a_1+a_9=a(1+r^8)=34$.
    steps:
    - id: '1a'
      content: |
        $r^2=2$, $a=2$, $2(1+2^4)=34$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '첫째항 $a$, 공비 $r$로 두 식을 쓰세요.'
    - '두 식을 나누면 $r^2$만의 식이 됩니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연D 문제10 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 336~337쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $a_3+a_9=ar^2(1+r^6)=36$, $a_3+a_5=ar^2(1+r^2)=12$
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        에서 $1-r^2+r^4=3$이다. $r^4-r^2-2=0$에서 $(r^2-2)(r^2+1)=0$, $\therefore r^2=2$
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        또한 $\therefore a=2$
      criteria: ['1.A2']
    - id: '1b-4'
      content: |
        $a_1+a_9=a(1+r^8)=2(1+2^4)=34$
      criteria: ['1.A3']
