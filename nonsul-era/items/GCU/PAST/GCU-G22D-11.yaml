intent: |
  제시문의 상황에서 새롭게 정의된 함수의 그래프와 함수의 연속의 정의를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 조건에서 $h(x)=|x|$를 정하고 $g$의 그래프로 교점 개수 함수 $f(t)$의 $t=0$ 근방을 조사한다.
key_idea: |
  $h^2=x^2$, $\sqrt{h^2}=h$이면 $h\ge0$이므로 $h=|x|$; $g=-x-1\ (-1\le x<0)$, $g=x\ (0\le x<1)$; $f(0)=2$, $\lim_{t\to0}f(t)=1$.
stuck: |
  $\sqrt{\{h(x)\}^2}=h(x)$에서 $h(x)\ge0$을 읽어 내는 것.
