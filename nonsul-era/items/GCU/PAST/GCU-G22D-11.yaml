stimuli: []
stem: |
  연속 함수 $h(x)$는 모든 실수 $x$에 대하여
  $$\{h(x)\}^2=x^2,\quad \sqrt{\{h(x)\}^2}=h(x)$$
  을 만족한다. 닫힌구간 $[-1,\ 1]$에서 정의된 함수 $g(x)=[x]+h(x)$의 그래프와 직선 $y=t$가 만나는 점의 개수를 함수 $f(t)$라 하자. $t=0$일 때, $f$가 불연속이지만 극한이 존재함을 보이는 다음의 풀이 과정을 완성하시오. (단, $[x]$는 $x$보다 크지 않은 최대 정수이다.)

  [풀이 과정] $g(x)$는 범위 $-1\le x<0$에서 일차함수 ( ① )와 같고, 범위 $0\le x<1$에서 일차함수 ( ② )와 같다. $\displaystyle\lim_{t\to0}f(t)=$ ( ③ )이지만 $f(0)=$ ( ④ )이므로, $f(t)$는 $t=0$에서 불연속이지만 극한은 존재한다.
subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '① g(x)=-x-1  ② g(x)=x  ③ 1  ④ 2', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $h=|x|$; $g$의 두 선분은 $t=0$에서 두 번(점 $x=-1$, $x=0$) 만나고 $0$ 근처 $t$에서는 한 번 만난다.
    steps:
    - id: '1a'
      content: |
        ① $-x-1$ ② $x$ ③ $1$ ④ $2$
      criteria: ['1.M1', '1.B2', '1.A1', '1.A2']
    hint_ladder:
    - '$\sqrt{A^2}=|A|$이므로 둘째 조건은 $h(x)\ge0$을 뜻합니다.'
    - '$g$의 그래프를 그리고 $y=t$를 $t=0$ 근처에서 움직여 보세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연D 문제11 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 338~340쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        조건을 만족하는 연속 함수 $h(x)$는 오직 $h(x)=|x|$ 하나뿐이므로 $g(x)=[x]+h(x)=[x]+|x|=\begin{cases}-1-x&(-1\le x<0)\\x&(0\le x<1)\\2&(x=1)\end{cases}$이다. (카드에는 마지막 줄이 「$(x=2)$」로 인쇄 — $x=1$의 오기)
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        따라서 범위 $0\le x<1$에서 $g(x)=x$이다.
      criteria: ['1.B2']
    - id: '1b-3'
      content: |
        결국 $f(t)=\begin{cases}0&(-\infty<t\le-1)\\1&(-1<t<0)\\2&(t=0)\\1&(0<t<1)\\0&(1\le t<2)\\1&(t=2)\\0&(2<t<\infty)\end{cases}$이므로 $\displaystyle\lim_{t\to0}f(t)=1$.
      criteria: ['1.A1']
    - id: '1b-4'
      content: |
        $f(0)=2$이므로 $t=0$에서 불연속이지만 극한은 존재한다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
