stimuli: []
stem: |
  삼차함수 $f(x)$가 다음 조건을 만족시킬 때, $f(1)+f(-1)$의 값을 구하는 과정을 서술하시오.

  (가) 모든 실수 $x$에 대하여 $f'(-x)=f'(x)$
  (나) $\displaystyle\int_{-2}^{2}f(x)\,dx=3$
subparts:
- id: '1'
  stem: |
    $f(1)+f(-1)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3/2', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $b=0$, $d=\frac34$, $f(1)+f(-1)=2d=\frac32$.
    steps:
    - id: '1a'
      content: |
        $b=0$, $d=\frac34$, $\frac32$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$f''(x)=3ax^2+2bx+c$가 우함수가 되려면?'
    - '$\int_{-2}^2$에서 홀수차항은 사라집니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연D 문제12 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 341~342쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        삼차함수를 $f(x)=ax^3+bx^2+cx+d$라고 놓으면 $f'(x)=3ax^2+2bx+c$이다. 모든 실수 $x$에 대하여 $f'(-x)=f'(x)$를 만족하므로 $f'(x)$는 $y$축 대칭이므로 $b=0$이다.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $\displaystyle\int_{-2}^2f(x)\,dx=\int_{-2}^2ax^3+cx+d\,dx=0+4d=3$이므로 $d=\dfrac34$이다.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        $f(x)=ax^3+cx+\dfrac34$이므로 $f(1)+f(-1)=\dfrac32$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
