      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 4
      evidence: |
        $f(1)+f(-1)=\frac32$(채점기준 4점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    deductions: []
