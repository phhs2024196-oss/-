intent: |
  제시문의 상황에서 삼차함수의 대칭성과 정적분의 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $f'$의 대칭으로 이차항이 $0$임을 보이고 정적분에서 상수항을 정한다.
key_idea: |
  $f'(-x)=f'(x)$이면 $b=0$; $\int_{-2}^2(ax^3+cx+d)\,dx=4d=3$; $f(1)+f(-1)=2d$.
stuck: |
  홀수차항의 정적분이 $0$이 되는 대칭성.
