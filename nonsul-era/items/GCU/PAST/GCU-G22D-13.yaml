stem: |
  $\log2\times\log5=a$일 때, $(\log25)^3-(\log4)^3=m(1-a)\sqrt{1-na}$을 만족시키는 두 자연수 $m$과 $n$의 값을 구하는 과정을 서술하시오. (단, $0<na<1$)
subparts:
- id: '1'
  stem: |
    두 자연수 $m$과 $n$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'm=8, n=4', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $=2(\log5-\log2)\cdot4(1-\log5\log2)=8\sqrt{1-4a}(1-a)$.
    steps:
    - id: '1a'
      content: |
        $8(\log5-\log2)(1-\log5\log2)$, $\log5-\log2=\sqrt{1-4a}$, $m=8$, $n=4$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '$\log25=2\log5$, $\log4=2\log2$입니다.'
    - '$\log5+\log2=1$을 써서 $(\log5-\log2)^2$을 $a$로 나타내세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연D 문제13 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 343~344쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $(\log25)^3-(\log4)^3=(\log25-\log4)[(\log25)^2+\log25\log4+(\log4)^2]$
        $=2(\log5-\log2)[(\log25+\log4)^2-\log25\log4]$
        $=2(\log5-\log2)[(2)^2-4\log5\log2]=8(\log5-\log2)(1-\log5\log2)$
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $(\log5-\log2)^2=(\log5+\log2)^2-4\log5\log2=1-4a$. 따라서, $\log5-\log2=\sqrt{1-4a}$ ($\log5>\log2$)
      criteria: ['1.M2']
    - id: '1b-3'
      content: |
        $(\log25)^3-(\log4)^3=8(\log5-\log2)(1-\log5\log2)=8\sqrt{1-4a}(1-a)$이므로 $m=8$,
      criteria: ['1.A1']
    - id: '1b-4'
      content: |
        $n=4$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
