intent: |
  제시문의 상황에서 상용로그와 로그의 성질 및 곱셈공식의 변형을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 세제곱의 차를 인수분해하고 $\log5+\log2=1$을 써서 $a$로 나타낸다.
key_idea: |
  $(\log25)^3-(\log4)^3=8(\log5-\log2)(1-\log5\log2)$, $\log5-\log2=\sqrt{1-4a}$.
stuck: |
  $\log5+\log2=1$과 $(\log5-\log2)^2=1-4a$.
