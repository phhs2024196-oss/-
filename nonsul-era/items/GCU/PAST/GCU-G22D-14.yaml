  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-8135}
  misconceptions:
  - id: MC-ALG-8135
    outcome_code: '71'
    wrong_work: '홀짝 구분 없이 $f(n)=\sqrt{n+1}$로 두고 $\sum\frac1{\sqrt{k+1}+\sqrt{k+3}}$을 망원합으로 처리'
    detect_cue: '답에 $\sqrt{101}$ 또는 $\sqrt{100}+\sqrt{99}-\sqrt3-\sqrt2$ 꼴이 나온다'
    feedback: '$n$이 짝수이면 $f(n)=\sqrt{n-1}$입니다. $a_2$를 직접 구해 보세요.'
    remedy: [RL-1]
