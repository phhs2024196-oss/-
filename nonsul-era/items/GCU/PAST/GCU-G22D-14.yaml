stem: |
  자연수 $n$에 대하여 함수 $f(n)$을 $f(n)=\begin{cases}\sqrt{n+1} & (n\text{이 홀수인 경우})\\ \sqrt{n-1} & (n\text{이 짝수인 경우})\end{cases}$
  라 하고, $a_n=\dfrac{1}{f(n)+f(n+2)}$이라 할 때, 수열 $\{a_n\}$에 대하여 $\displaystyle\sum_{k=1}^{98}a_k$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{k=1}^{98}a_k$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '(9+3√11-√2)/2', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $\frac12\{(\sqrt{100}-\sqrt2)+(\sqrt{99}-1)\}=\frac12(9+3\sqrt{11}-\sqrt2)$.
    steps:
    - id: '1a'
      content: |
        $a_1=\frac1{\sqrt2+\sqrt4}$, $a_2=\frac1{\sqrt1+\sqrt3}$, 망원합 $\frac12(9+3\sqrt{11}-\sqrt2)$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$a_1$, $a_2$, $a_3$, $a_4$를 직접 써 보세요.'
    - '$\frac1{\sqrt p+\sqrt{p+2}}=\frac{\sqrt{p+2}-\sqrt p}{2}$입니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연D 문제14 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 345~346쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $a_1=\dfrac1{f(1)+f(3)}=\dfrac1{\sqrt2+\sqrt4}$, $a_2=\dfrac1{f(2)+f(4)}=\dfrac1{\sqrt1+\sqrt3}$, $\cdots$
        $$\sum_{k=1}^{98}a_k=\frac1{\sqrt2+\sqrt4}+\frac1{\sqrt1+\sqrt3}+\cdots+\frac1{\sqrt{98}+\sqrt{100}}+\frac1{\sqrt{97}+\sqrt{99}}$$
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $$=\frac12\{(\sqrt4-\sqrt2)+(\sqrt3-\sqrt1)+\cdots+(\sqrt{100}-\sqrt{98})+(\sqrt{99}-\sqrt{97})\}$$
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        $$=\frac12\{\sqrt{100}+\sqrt{99}-\sqrt2-1\}=\frac12(9+3\sqrt{11}-\sqrt2)$$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
        $a_1=\frac1{\sqrt2+\sqrt4}$, $a_2=\frac1{\sqrt1+\sqrt3}$ 또는 $\sum_{k=1}^{98}a_k=\frac1{\sqrt2+\sqrt4}+\frac1{\sqrt1+\sqrt3}+\cdots+\frac1{\sqrt{98}+\sqrt{100}}+\frac1{\sqrt{97}+\sqrt{99}}$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 4
      evidence: |
        $\sum_{k=1}^{98}a_k=\frac12\{(\sqrt4-\sqrt2)+(\sqrt3-\sqrt1)+\cdots+(\sqrt{100}-\sqrt{98})+(\sqrt{99}-\sqrt{97})\}$(채점기준 4점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 3
      evidence: |
        $\sum_{k=1}^{98}a_k=\frac12(9+3\sqrt{11}-\sqrt2)$(채점기준 3점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    deductions: []
