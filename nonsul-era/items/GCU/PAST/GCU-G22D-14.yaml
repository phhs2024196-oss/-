intent: |
  제시문의 상황에서 여러가지 수열의 합을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 홀수·짝수 항을 나눠 분모를 유리화하고 망원합으로 계산한다.
key_idea: |
  홀수 $n$: $a_n=\frac1{\sqrt{n+1}+\sqrt{n+3}}$, 짝수 $n$: $a_n=\frac1{\sqrt{n-1}+\sqrt{n+1}}$; 각각 유리화 후 망원합.
stuck: |
  $f(n)$과 $f(n+2)$의 홀짝이 같다는 점을 이용해 두 갈래로 나누는 것.
