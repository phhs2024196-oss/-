stimuli: []
stem: |
  수직선 위를 움직이는 점 $\mathrm{P}$의 시각 $t\ (t\ge0)$에서의 위치 $x$가 $x=t^3-9t^2+24t$이다. 점 $\mathrm{P}$가 같은 위치를 세 번 지나가는 구간에서 점 $\mathrm{P}$의 평균속력을 구하는 과정을 서술하시오. (단, 평균속력은 움직인 거리를 경과 시간으로 나눈 값이다.)
subparts:
- id: '1'
  stem: |
    점 $\mathrm{P}$의 평균속력을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      구간 $1\le t\le5$에서 $16\to20\to16\to20$, 거리 $12$, 시간 $4$.
    steps:
    - id: '1a'
      content: |
        $v=3(t-2)(t-4)$, $x(2)=20$, $x(4)=16$, $[1,5]$, $\frac{4\times3}{5-1}=3$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '점 P가 방향을 바꾸는 시각과 그때의 위치를 구하세요.'
    - '위치 $16$과 $20$에 처음 도달하는 시각과 마지막으로 도달하는 시각을 찾으세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '보고서 자연D 문제15 문항카드 6. 채점 기준·7. 예시 답안 혹은 정답(PDF 347~348쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        속도는 $v=\dfrac{dx}{dt}=3t^2-18t+24=3(t-2)(t-4)$이므로 점 P는 $t=2$, $t=4$에서 방향을 바꾸며,
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        그때의 위치는 각각 $x(2)=20$, $x(4)=16$이다.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        $x(t)-16=(t-4)^2(t-1)$이므로 $x(1)=16$이고, $x(t)-20=(t-2)^2(t-5)$이므로 $x(5)=20$이다. 따라서 반복되는 구간은 $t=1$에서 $t=5$까지이며, 그동안에 점 P는 $x=16$과 $x=20$인 위치 사이를 세 번 반복해서 움직인다.
      criteria: ['1.A2']
    - id: '1b-4'
      content: |
        결과적으로 평균속력은 $\dfrac{4\times3}{5-1}=3$이다. (풀이2) 마지막 단계에서 움직인 거리는 $\displaystyle\int_1^5|v(t)|\,dt=12$로 구할 수도 있다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 2
      evidence: |
        $v=\frac{dx}{dt}=3t^2-18t+24=3(t-2)(t-4)$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 3
      evidence: |
        되돌아가는 위치는 $x(2)=20$, $x(4)=16$(채점기준 3점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 3
      evidence: |
        반복되는 구간은 $x(1)=16$에서 $x(5)=20$까지(채점기준 3점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    - id: '1.A3'
      mark_type: 'A'
      points: 2
      evidence: |
        평균속력은 $3$(채점기준 2점).
      depends_on: ['1.M1', '1.A2']
      steps: ['1b-4']
    deductions: []
