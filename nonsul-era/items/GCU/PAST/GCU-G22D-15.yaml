intent: |
  제시문의 상황에서 미분법의 활용에서 속도와 위치의 관계를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 방향이 바뀌는 시각의 위치로 같은 위치를 세 번 지나는 구간을 찾고 움직인 거리를 시간으로 나눈다.
key_idea: |
  $v=3(t-2)(t-4)$; $x(2)=20$, $x(4)=16$; $x(t)-16=(t-4)^2(t-1)$, $x(t)-20=(t-2)^2(t-5)$이므로 구간 $1\le t\le5$, 거리 $12$, 평균속력 $3$.
stuck: |
  「같은 위치를 세 번 지나가는 구간」을 $x=16$과 $x=20$ 사이를 오가는 시간 $[1,5]$로 해석하는 것.
