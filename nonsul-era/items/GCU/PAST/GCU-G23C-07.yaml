stimuli: []

stem: |
  다항함수 $f(x)$의 한 부정적분 $F(x)$가 모든 실수 $x$에 대하여
  $F(x)=f(x)+2x^{3}-5x^{2}-5x$를 만족시킨다. 방정식 $f(x)=4x^{2}+3$의 두 근을 $\alpha,\beta$라 할 때, $\alpha^{2}+\beta^{2}$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\alpha^{2}+\beta^{2}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '7', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      양변을 미분해 $f=f'+6x^{2}-10x-5$, $f(x)=6x^{2}+2x-3$을 얻는다.
    steps:
    - id: 1a
      content: |
        $f(x)=6x^{2}+2x-3$, $f(x)=4x^{2}+3\iff x^{2}+x-3=0$, $\alpha^{2}+\beta^{2}=1+6=7$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - |
      $F'(x)=f(x)$를 써서 주어진 식을 미분해 보자.
    - |
      $f(x)$의 최고차항은 무엇이어야 하는가?
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [C 7] 5. 문항 해설(PDF 239–240쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $F'(x)=f(x)$이고, $F(x)=f(x)+2x^{3}-5x^{2}-5x$의 양변을 미분하면
        $f(x)=f'(x)+6x^{2}-10x-5$ (이하 (1)식)이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f(x)=6x^{2}+ax+b$로 정의하면, $f'(x)=12x+a$이므로, (1)식에 이를 대입하면
        $6x^{2}+ax+b=6x^{2}+2x+a-5$, 즉 $a=2$, $b=-3$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        방정식 $f(x)=4x^{2}+3$에 계산한 $f(x)$를 대입하면, 즉 $x^{2}+x-3=0$ 방정식의 두 근을 $\alpha,\beta$라 할 때,
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $\alpha^{2}+\beta^{2}=(\alpha+\beta)^{2}-2\alpha\beta=1+6=7$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $F'(x)=f(x)$를 써서 양변을 미분한 식 $f(x)=f'(x)+6x^{2}-10x-5$가 있다(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $f(x)=6x^{2}+ax+b$로 놓고 계수 비교로 $a=2,\ b=-3$을 구했다(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $x^{2}+x-3=0$을 얻었다(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        $\alpha^{2}+\beta^{2}=(\alpha+\beta)^{2}-2\alpha\beta=7$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1, 1.A2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-8201}
  misconceptions:
  - id: MC-ALG-8201
    outcome_code: '71'
    wrong_work: |
      $x^{2}+x-3=0$에서 $\alpha\beta=3$으로 부호를 잘못 써 $\alpha^{2}+\beta^{2}=1-6=-5$
    detect_cue: |
      답이 음수($-5$)로 나온다(실수의 제곱합은 음수가 될 수 없음)
    feedback: |
      $ax^{2}+bx+c=0$에서 $\alpha\beta=\dfrac{c}{a}$입니다. 상수항 $-3$의 부호를 그대로 쓰세요.
    remedy: [RL-1]

