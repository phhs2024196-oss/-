intent: |
  제시문의 상황에서 간단한 다항함수의 부정적분을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $F'(x)=f(x)$를 이용해 주어진 항등식을 미분하여 $f(x)$를 결정하고, 근과 계수의 관계로 $\alpha^{2}+\beta^{2}$을 계산한다.
key_idea: |
  $F(x)=f(x)+2x^{3}-5x^{2}-5x$의 양변을 미분하면 $f(x)=f'(x)+6x^{2}-10x-5$이므로 $f(x)$는 최고차항이 $6x^{2}$인 이차함수이다.
stuck: |
  $F$가 $f$의 부정적분이라는 조건을 '양변 미분'으로 바꾸고, $f$의 차수(이차)를 정해 $f(x)=6x^{2}+ax+b$로 놓는 단계.
