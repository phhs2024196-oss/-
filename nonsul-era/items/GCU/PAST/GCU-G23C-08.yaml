intent: |
  제시문의 상황에서 함수의 극대와 극소를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 도함수의 부호 변화로 극대·극소의 위치를 구분하고, 그래프가 $x$축에 접한다는 조건을 극솟값 $0$으로 해석한다.
key_idea: |
  $f'(x)=-3(x+1)(x-3)$의 부호 변화로 $x=-1$에서 극소, $x=3$에서 극대이고, $x$축에 접하는 점에서 극솟값이 $0$이다.
stuck: |
  최고차항 계수가 음수이므로 작은 근 $x=-1$이 극소, 큰 근 $x=3$이 극대라는 점(증감표).
