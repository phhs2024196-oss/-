  misconceptions:
  - id: MC-CAL-8202
    outcome_code: '71'
    wrong_work: |
      최고차항이 음수인 것을 무시하고 작은 근 $x=-1$을 극대, $x=3$을 극소로 두어 $a=-1,\ b=3$, $f(3)=0$에서 $k=-27$
    detect_cue: |
      $a=-1,\ b=3,\ k=-27$이 나오거나 증감표 없이 극대·극소를 정한다
    feedback: |
      극대·극소는 $f'(x)$의 부호 변화로 정합니다. $f'(x)=-3(x+1)(x-3)$은 $x=-1$ 좌우에서 $-\to+$이므로 $x=-1$이 극소입니다.
    remedy: [RL-1]

