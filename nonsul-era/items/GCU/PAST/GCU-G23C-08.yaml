stimuli: []

stem: |
  함수 $f(x)=-x^{3}+3x^{2}+9x+k$는 $x=a$에서 극대이고, $x=b$에서 극소이다.
  $y=f(x)$의 그래프가 $x=b$에서 $x$축과 접한다고 할 때, 실수 $a,b,k$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    실수 $a,b,k$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'a=3, b=-1, k=5', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f'(x)=-3(x+1)(x-3)$, 증감표로 $a=3$, $b=-1$, $f(-1)=0$에서 $k=5$.
    steps:
    - id: 1a
      content: |
        $a=3,\ b=-1$, $f(-1)=k-5=0\Rightarrow k=5$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2']
    hint_ladder:
    - |
      $f'(x)=0$의 두 근 중 어느 쪽이 극대인가? 최고차항의 부호를 보자.
    - |
      $x$축에 접한다는 것은 그 점의 함숫값이 무엇이라는 뜻인가?
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [C 8] 5. 문항 해설(PDF 240–241쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=-x^{3}+3x^{2}+9x+k$에서 $f'(x)=-3x^{2}+6x+9=-3(x+1)(x-3)$
        $f'(x)=0$에서 $x=-1$ 또는 $x=3$에서 극값을 갖는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.
        $x<-1$: $f'(x)<0$, 감소 / $x=-1$: $f'(x)=0$, 극소 / $-1<x<3$: $f'(x)>0$, 증가 / $x=3$: $f'(x)=0$, 극대 / $x>3$: $f'(x)<0$, 감소
        그러므로 $a=3$, $b=-1$이며
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $x=-1$일 때 $x$축과 접하려면 극솟값이 $0$이어야 하므로
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $f(-1)=1+3-9+k=0$에서 $k=5$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f'(x)=-3(x+1)(x-3)$ 또는 동치식과 $f'(x)=0$의 근 $x=-1,3$(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        증감표(부호 변화)로 $a=3$(극대), $b=-1$(극소)을 밝혔다(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $x$축에 접하므로 극솟값 $f(b)=0$이라는 식을 세웠다(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $f(-1)=k-5=0$에서 $k=5$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M2]
      steps: [1b-4]
    deductions: []
