  misconceptions:
  - id: MC-ALG-8203
    outcome_code: '71'
    wrong_work: |
      $a^{\frac{1}{2}x}$을 $a^{\frac{1}{2}}\cdot a^{x}$처럼 다뤄 밑을 $\dfrac{3a}{10}$으로 잡아 $a\le\dfrac{10}{3}$, $\dfrac73<a\le\dfrac{10}{3}$에서 $1$개
    detect_cue: |
      첫째 조건이 $a\le3$ 근처로 나오고 답이 $1$개이다
    feedback: |
      $a^{\frac{1}{2}x}=\left(a^{\frac{1}{2}}\right)^{x}$입니다. 지수법칙으로 $x$제곱 꼴을 모은 뒤 밑을 비교하세요.
    remedy: [RL-1]

