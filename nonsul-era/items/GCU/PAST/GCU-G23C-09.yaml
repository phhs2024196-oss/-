intent: |
  제시문의 상황에서 주어진 조건과 지수함수의 그래프의 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 두 곡선을 $y=(\text{밑})^{x}$ 꼴로 정리해 원과 만나는 조건을 밑과 $1$의 대소 관계로 바꾼다.
key_idea: |
  두 곡선은 모두 $(0,1)$을 지나는 $y=r^{x}$ 꼴이고, 원 $(x-1)^{2}+y^{2}=1$은 $0\le x\le2$, $|y|\le1$에 놓이므로 밑 $r\le1$이면 만나고 $r>1$이면 만나지 않는다.
stuck: |
  $\dfrac{3^{x}\times a^{\frac{1}{2}x}}{10^{x}}=\left(\dfrac{3a^{\frac{1}{2}}}{10}\right)^{x}$처럼 밑 하나로 묶는 것과, '원과 만남'을 '밑 $\le1$'로 번역하는 것.
