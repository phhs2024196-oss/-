stimuli: []

stem: |
  $2$ 이상의 자연수 $a$에 대하여 원 $(x-1)^{2}+y^{2}=1$이 곡선 $y=\dfrac{3^{x}\times a^{\frac{1}{2}x}}{10^{x}}$과는 만나고,
  곡선 $y=a^{x}\times\left(\dfrac{7}{3}\right)^{-x}$과는 만나지 않도록 하는 $a$의 개수를 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $a$의 개수를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '9', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      밑 $\dfrac{3\sqrt a}{10}\le1$, 밑 $\dfrac{3a}{7}>1$에서 $\dfrac73<a\le\dfrac{100}{9}$.
    steps:
    - id: 1a
      content: |
        $a\le\dfrac{100}{9}$, $a>\dfrac{7}{3}$이므로 $a=3,4,\cdots,11$의 $9$개
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2', '1.A3']
    hint_ladder:
    - |
      두 곡선을 각각 $y=r^{x}$ 꼴로 정리해 보자.
    - |
      $y=r^{x}$는 항상 $(0,1)$을 지난다. 원은 어느 영역에 있는가?
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [C 9] 5. 문항 해설(PDF 241–242쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $y=\dfrac{3^{x}\times a^{\frac{1}{2}x}}{10^{x}}$의 그래프와 원 $(x-1)^{2}+y^{2}=1$이 만나기 위해서는
        $y=\dfrac{3^{x}\times a^{\frac{1}{2}x}}{10^{x}}=\left(\dfrac{3a^{\frac{1}{2}}}{10}\right)^{x}$에서 밑 $\left(\dfrac{3a^{\frac{1}{2}}}{10}\right)\le1$이어야 한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $a^{\frac{1}{2}}\le\dfrac{10}{3}$, $\therefore a\le\dfrac{100}{9}=11.1\cdots$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        함수 $y=a^{x}\times\left(\dfrac{7}{3}\right)^{-x}$의 그래프와 원 $(x-1)^{2}+y^{2}=1$이 만나지 않기 위해서는
        $a^{x}\times\left(\dfrac{7}{3}\right)^{-x}=\left(a\dfrac{3}{7}\right)^{x}$에서 밑 $\left(\dfrac{3}{7}a\right)>1$, $\therefore a>\dfrac{7}{3}=2.3\cdots$
      criteria: ['1.M2', '1.A2']
    - id: 1b-4
      content: |
        따라서 $\dfrac{7}{3}<a\le\dfrac{100}{9}$을 만족하는 $a$의 개수는 $9$개다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        첫째 곡선을 $\left(\dfrac{3a^{\frac12}}{10}\right)^{x}$로 정리하고 만날 조건을 밑 $\le1$로 세웠다(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $a\le\dfrac{100}{9}$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        둘째 곡선을 $\left(\dfrac{3}{7}a\right)^{x}$로 정리하고 만나지 않을 조건을 밑 $>1$로 세웠다(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        $a>\dfrac{7}{3}$(채점기준 미공개 — 해설 단계 기준 1점 배분)
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        $\dfrac{7}{3}<a\le\dfrac{100}{9}$인 자연수 $a$의 개수 $9$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1, 1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
