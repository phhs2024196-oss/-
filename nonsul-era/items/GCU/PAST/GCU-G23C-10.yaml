stimuli: []

stem: |
  사차함수 $f(x)$에 대하여 함수 $g(x)$를
  $$g(x)=\begin{cases}\dfrac{f(x)}{x^{2}-1} & (\lvert x\rvert\neq1)\\ x+p & (\lvert x\rvert=1)\end{cases}$$
  라 하자. 함수 $g(x)$가 실수 전체의 집합에서 연속이고, $\lim\limits_{x\to1}\dfrac{g(x)+1}{f(x)}=1$일 때, $g(p)$의 값을 구하는 다음의 풀이 과정을 완성하시오.

  [풀이 상자]
  $g(x)$가 실수 전체의 집합에서 연속이므로
  사차함수 $f(x)$를 $f(x)=(x^{2}-1)(ax^{2}+bx+c)$라 놓을 수 있다.
  $\lim\limits_{x\to1}\dfrac{g(x)+1}{f(x)}$가 존재하므로 $p=$ [ ① ]이다. $g(x)$가 $x=1$과 $x=-1$에서 연속이므로 $b=$ [ ② ]. 또한, $\lim\limits_{x\to1}\dfrac{g(x)+1}{f(x)}=1$이므로 $c=$ [ ③ ]. 따라서 $g(p)=$ [ ④ ]

subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 $g(p)$의 값을 구하는 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '① -2, ② 1, ③ -1/2, ④ -17/2', equivalents: ['$p=-2,\ b=1,\ c=-\frac{1}{2},\ g(p)=-\frac{17}{2}$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $g(1)=-1\Rightarrow p=-2$; 연속에서 $b=1$; 약분한 극한 $\dfrac{2a+b}{2(a+b+c)}=1$에서 $a=-\dfrac32$, $c=-\dfrac12$.
    steps:
    - id: 1a
      content: |
        $p=-2,\ b=1,\ c=-\dfrac12,\ g(-2)=-\dfrac{17}{2}$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2', '1.M3', '1.A3', '1.A4']
    hint_ladder:
    - |
      분모 $f(x)\to0$인데 극한값이 $1$이면 분자는?
    - |
      $x\ne\pm1$에서 $g(x)=ax^{2}+bx+c$이다. $x=\pm1$에서 연속 조건을 써 보자.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [C 10] 5. 문항 해설(PDF 243–244쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\lim\limits_{x\to1}\dfrac{g(x)+1}{f(x)}=1$이므로 $g(1)+1=0$.
        따라서 $p=-2$.
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        $g(x)$가 $\pm1$에서 연속이므로 $\lim\limits_{x\to1}g(x)=a+b+c=g(1)=-1$,
        $\lim\limits_{x\to-1}g(x)=a-b+c=g(-1)=-3$이므로 $b=1$.
      criteria: ['1.M2', '1.A2']
    - id: 1b-3
      content: |
        $1=\lim\limits_{x\to1}\dfrac{ax^{2}+bx+c+1}{(x^{2}-1)(ax^{2}+bx+c)}=\lim\limits_{x\to1}\dfrac{a(x+1)+b}{(x+1)(ax^{2}+bx+c)}=\dfrac{2a+b}{2(a+b+c)}$이므로 $c=-\dfrac{1}{2}$.
        $0=\lim\limits_{x\to1}g(x)+1=a+b+c+1=a+1-\dfrac{1}{2}+1$이므로 $a=-\dfrac{3}{2}$.
      criteria: ['1.M3', '1.A3']
    - id: 1b-4
      content: |
        따라서 $g(-2)=-\dfrac{3}{2}(-2)^{2}+(-2)-\dfrac{1}{2}=-\dfrac{17}{2}$
      criteria: ['1.A4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        극한이 존재하고 분모 $\to0$이므로 $g(1)+1=0$이라는 식(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        ① $p=-2$(채점기준 미공개 — 해설 단계 기준 1점 배분)
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $x=\pm1$에서의 연속으로 $a+b+c=-1$, $a-b+c=-3$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        ② $b=1$(채점기준 미공개 — 해설 단계 기준 1점 배분)
      depends_on: [1.M2]
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: |
        분자를 인수분해·약분해 극한을 $\dfrac{2a+b}{2(a+b+c)}$로 나타냄(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        ③ $c=-\dfrac{1}{2}$ (및 $a=-\dfrac{3}{2}$)(채점기준 미공개 — 해설 단계 기준 1점 배분)
      depends_on: [1.M3]
      steps: [1b-3]
    - id: 1.A4
      mark_type: A
      points: 1
      evidence: |
        ④ $g(p)=g(-2)=-\dfrac{17}{2}$(채점기준 미공개 — 해설 단계 기준 1점 배분)
      depends_on: [1.M3, 1.A1]
      steps: [1b-4]
    deductions: []
