intent: |
  제시문의 상황에서 주어진 조건과 함수의 연속의 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 분모가 $0$으로 가는 극한이 수렴할 조건과 $x=\pm1$에서의 연속 조건으로 미정계수를 차례로 결정한다.
key_idea: |
  $\lim\limits_{x\to1}\dfrac{g(x)+1}{f(x)}$이 수렴하려면 분자 $\to0$, 즉 $g(1)=-1$; $x=\pm1$에서의 연속으로 $a+b+c=-1$, $a-b+c=-3$.
stuck: |
  극한 $\lim\limits_{x\to1}\dfrac{g(x)+1}{f(x)}$에서 분자를 $(x-1)\{a(x+1)+b\}$로 인수분해해 약분하는 단계.
