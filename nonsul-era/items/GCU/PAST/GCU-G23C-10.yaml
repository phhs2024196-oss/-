  misconceptions:
  - id: MC-CAL-8204
    outcome_code: '71'
    wrong_work: |
      $g(p)=g(-2)$에 $|x|=1$일 때의 식 $x+p$를 적용해 $g(-2)=-2+p=-4$
    detect_cue: |
      ④에 $-4$를 쓴다
    feedback: |
      $x+p$는 $|x|=1$일 때만의 식입니다. $x=-2$에서는 $g(x)=\dfrac{f(x)}{x^{2}-1}=ax^{2}+bx+c$를 쓰세요.
    remedy: [RL-1]

