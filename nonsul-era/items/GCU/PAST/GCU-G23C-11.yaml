intent: |
  제시문의 상황에서 주어진 조건과 지수함수와 로그함수의 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 평행이동(또는 교점 좌표 계산)으로 직각삼각형의 두 변을 $a$로 나타낸다.
key_idea: |
  두 곡선은 $y=\log_{a}x$, $y=a^{x}$를 $x$축으로 $-2$, $y$축으로 $4$만큼 평행이동한 것이므로 $x=1$, $y=1$과 $y=\log_{a}x$, $y=a^{x}$가 만드는 삼각형으로 바꿔 생각한다.
stuck: |
  점 $\mathrm{A}$, $\mathrm{B}$의 좌표를 $a$로 나타내 직각삼각형의 두 변 길이가 모두 $a-1$임을 보는 것.
