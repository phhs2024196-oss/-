stem: |
  $a>1$인 상수 $a$에 대하여 곡선 $y=4+\log_{a}(x+2)$와 직선 $y=5$가 점 $\mathrm{A}$에서 만나고, 곡선 $y=a^{x+2}+4$와 직선 $x=-1$이 점 $\mathrm{B}$에서 만난다. 두 직선의 교점이 점 $\mathrm{P}$일 때, 삼각형 $\mathrm{PAB}$의 넓이가 $2$가 되는 $a$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    삼각형 $\mathrm{PAB}$의 넓이가 $2$가 되는 $a$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\mathrm{A}(a-2,5)$, $\mathrm{B}(-1,a+4)$, $\mathrm{P}(-1,5)$이므로 넓이 $\dfrac12(a-1)^{2}=2$.
    steps:
    - id: 1a
      content: |
        $\dfrac{1}{2}(a-1)(a-1)=2$, $a>1$이므로 $a=3$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - |
      두 곡선은 어떤 기본 곡선을 평행이동한 것인가?
    - |
      $\mathrm{PA}$와 $\mathrm{PB}$의 길이를 $a$로 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [C 11] 5. 문항 해설(PDF 244–245쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=4+\log_{a}(x+2)$와 $y=a^{x+2}+4$는 곡선 $y=\log_{a}x$와 $y=a^{x}$을 $x$축으로 $-2$만큼, $y$축으로 $4$만큼 평행 이동한 곡선이다. 따라서 직선 $x=-1$, $y=5$을 평행 이동한 $x=1$, $y=1$ 두 직선과 곡선 $y=\log_{a}x$와 $y=a^{x}$와의 만나는 점 $A$, $B$와 교점 $P(1,1)$의 삼각형 넓이와 같다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 삼각형의 넓이는 $\dfrac{1}{2}(a-1)(a-1)=2$이므로
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $a=3$이다.
      criteria: ['1.A2']
  - id: S1-ALT
    audience: ALT
    source_flow: 같은 문항카드 5. 문항 해설의 [다른 풀이]
    method_no: 2
    steps:
    - id: 1c-1
      content: |
        교점 $P(-1,5)$와 점 $A$의 $x$좌표는 $5=4+\log_{a}(x+2)$, $x=a-2$이므로 $(a-2,5)$이고, 점 $B$의 $y$좌표는 $y=a^{-1+2}+4=a+4$이므로 $(-1,a+4)$이다.
      criteria: ['1.M1']
    - id: 1c-2
      content: |
        따라서 삼각형의 넓이는 $\dfrac{1}{2}((a+4)-5)((a-2)-(-1))=\dfrac{1}{2}(a-1)(a-1)$이다. $\dfrac{1}{2}(a-1)^{2}=2$, $a>1$이므로 $a=3$.
      criteria: ['1.A1', '1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        평행이동 관계 또는 $\mathrm{A}(a-2,5)$, $\mathrm{B}(-1,a+4)$, $\mathrm{P}(-1,5)$ 좌표 설정(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        삼각형 넓이 $\dfrac{1}{2}(a-1)(a-1)$(채점기준 미공개 — 해설 단계 기준 4점 배분)
      depends_on: [1.M1]
      steps: [1b-2, 1c-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\dfrac12(a-1)^{2}=2$와 $a>1$에서 $a=3$(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: [1.M1, 1.A1]
      steps: [1b-3, 1c-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-8205}
  misconceptions:
  - id: MC-ALG-8205
    outcome_code: '71'
    wrong_work: |
      $\log_{a}(x+2)=1$에서 $x+2=a$ 대신 $x=a+2$로 두어 $\mathrm{A}(a+2,5)$, 넓이 $\dfrac12(a+3)(a-1)=2$에서 $a=-1+2\sqrt2$
    detect_cue: |
      $\mathrm{PA}$의 길이가 $a+3$으로 나오거나 답에 근호가 있다
    feedback: |
      $\log_{a}(x+2)=1\iff x+2=a\iff x=a-2$입니다. 평행이동 방향을 확인하세요.
    remedy: [RL-1]

