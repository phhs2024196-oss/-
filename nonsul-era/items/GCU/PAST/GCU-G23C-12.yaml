stimuli: []

stem: |
  모든 실수 $x$에 대하여 부등식 $\cos^{2}x+4\sin x+k\le0$이 항상 성립하도록 하는 실수 $k$의 최댓값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    실수 $k$의 최댓값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $-(\sin x-2)^{2}+5+k\le0$, $(\sin x-2)^{2}\ge1$이므로 $1-5-k\ge0$.
    steps:
    - id: 1a
      content: |
        $k\le-4$, 최댓값 $-4$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - |
      $\cos^{2}x$를 $\sin x$로 나타내 보자.
    - |
      $\sin x$가 움직일 수 있는 범위는?
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [C 12] 5. 문항 해설(PDF 245–246쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        사인의 식으로 바꾸면 $-\sin^{2}x+4\sin x+1+k=-(\sin x-2)^{2}+5+k\le0$. 따라서 부등식은 $(\sin x-2)^{2}-5-k\ge0$이 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        제곱항의 최솟값이 $1$이므로 $1-5-k\ge0$이 되어야 하므로
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $k\le-4$이다. 즉 $k$의 최댓값은 $-4$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\cos^{2}x=1-\sin^{2}x$로 바꿔 $-(\sin x-2)^{2}+5+k\le0$ 또는 동치식(채점기준 미공개 — 해설 단계 기준 4점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $-1\le\sin x\le1$에서 $(\sin x-2)^{2}$의 최솟값이 $1$($\sin x=1$)임을 밝혔다(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $k\le-4$, 최댓값 $-4$(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-8206}
  misconceptions:
  - id: MC-ALG-8206
    outcome_code: '71'
    wrong_work: |
      $-(\sin x-2)^{2}+5+k$의 최댓값을 꼭짓점 값 $5+k$로 보아 $k\le-5$, 최댓값 $-5$
    detect_cue: |
      답이 $-5$이다
    feedback: |
      $\sin x$는 $-1$과 $1$ 사이이므로 $\sin x=2$가 될 수 없습니다. 범위 $[-1,1]$에서 최댓값을 구하세요.
    remedy: [RL-1]

