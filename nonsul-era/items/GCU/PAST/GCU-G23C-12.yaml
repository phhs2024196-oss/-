intent: |
  제시문의 상황에서 삼각함수의 그래프와 부등식을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $\cos^{2}x=1-\sin^{2}x$로 바꿔 $\sin x$에 대한 이차식의 최댓값 조건으로 해석한다.
key_idea: |
  $\cos^{2}x+4\sin x+k=-(\sin x-2)^{2}+5+k$이고 $-1\le\sin x\le1$이므로 최댓값은 $\sin x=1$일 때 $4+k$.
stuck: |
  꼭짓점 $\sin x=2$가 범위 밖이므로 $(\sin x-2)^{2}$의 최솟값이 $0$이 아니라 $1$이라는 점.
