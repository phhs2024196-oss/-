intent: |
  제시문의 상황에서 함수의 극한과 연속에 대한 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $x=2$에서 좌변이 $0$이 되는 것으로 $a$를 정하고, 연속성으로 $f(2)$를 유리화한 극한값으로 구한다.
key_idea: |
  $x\to2$일 때 $(x-2)f(x)\to0$이므로 $\sqrt{4+a}=5$, $a=21$; $f(2)=\lim\limits_{x\to2}\dfrac{\sqrt{x^{2}+21}-5}{(x-2)(x^{2}+4)}$를 유리화.
stuck: |
  $f$가 연속이므로 $f(2)$를 극한값으로 구할 수 있다는 점과 분자 유리화.
