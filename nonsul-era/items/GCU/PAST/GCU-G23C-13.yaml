  - id: MC-CAL-8207
    outcome_code: '71'
    wrong_work: |
      유리화 후 분모의 $x^{2}+4$를 빠뜨려 $f(2)=\lim\limits_{x\to2}\dfrac{x+2}{\sqrt{x^{2}+21}+5}=\dfrac{2}{5}$, $\dfrac{a}{f(2)}=\dfrac{105}{2}$
    detect_cue: |
      $f(2)=\dfrac25$ 또는 답이 $52.5$이다
    feedback: |
      $f(x)=\dfrac{\sqrt{x^{2}+21}-5}{(x-2)(x^{2}+4)}$의 분모 전체를 유지한 채 유리화하세요.
    remedy: [RL-1]

