stimuli: []

stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$가 모든 실수 $x$에 대하여
  $$(x-2)f(x)=\dfrac{\sqrt{x^{2}+a}-5}{x^{2}+4}$$
  를 만족시킨다. $\dfrac{a}{f(2)}$의 값을 구하는 과정을 서술하시오. (단, $a$는 양수)

subparts:
- id: '1'
  stem: |
    $\dfrac{a}{f(2)}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '420', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $a=21$, $f(2)=\dfrac{4}{8\cdot10}=\dfrac{1}{20}$.
    steps:
    - id: 1a
      content: |
        $\dfrac{a}{f(2)}=21\times20=420$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2', '1.A3']
    hint_ladder:
    - |
      $x=2$를 대입하면 좌변은?
    - |
      $f(2)$는 $x\to2$일 때 $f(x)$의 극한값이다.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [C 13] 5. 문항 해설(PDF 247–248쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\lim\limits_{x\to2}(x-2)f(x)=0$이므로 $\lim\limits_{x\to2}\dfrac{\sqrt{x^{2}+a}-5}{x^{2}+4}=0$. 따라서 $\lim\limits_{x\to2}\sqrt{x^{2}+a}-5=0$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이므로 $a=21$. 따라서 $x\ne2$일 때 $f(x)=\dfrac{\sqrt{x^{2}+21}-5}{(x-2)(x^{2}+4)}$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $f(2)=\lim\limits_{x\to2}f(x)=\lim\limits_{x\to2}\dfrac{\sqrt{x^{2}+21}-5}{(x-2)(x^{2}+4)}=\lim\limits_{x\to2}\dfrac{(\sqrt{x^{2}+21}-5)(\sqrt{x^{2}+21}+5)}{(x-2)(x^{2}+4)(\sqrt{x^{2}+21}+5)}$
        $=\lim\limits_{x\to2}\dfrac{x+2}{(x^{2}+4)(\sqrt{x^{2}+21}+5)}=\dfrac{1}{20}$
      criteria: ['1.M2', '1.A2']
    - id: 1b-4
      content: |
        따라서 $\dfrac{a}{f(2)}=420$.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\lim\limits_{x\to2}(x-2)f(x)=0$에서 $\sqrt{4+a}-5=0$을 세웠다(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $a=21$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        연속성으로 $f(2)=\lim\limits_{x\to2}f(x)$로 놓고 분자를 유리화했다(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $f(2)=\dfrac{1}{20}$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        $\dfrac{a}{f(2)}=420$(채점기준 미공개 — 해설 단계 기준 1점 배분)
      depends_on: [1.M1, 1.M2]
      steps: [1b-4]
    deductions: []
