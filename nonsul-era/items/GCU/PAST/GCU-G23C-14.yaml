stimuli: []

stem: |
  일차함수 $f(x)$에 대하여 함수 $g(x)$를
  $$g(x)=x\int_{0}^{x}(tf(t)-11)\,dt-\int_{0}^{x}t^{2}f(t)\,dt$$
  라 할 때, 함수 $g(x)$는 $x=2$에서 극솟값 $-20$을 갖는다. 함수 $g(x)$가 $x=k$에서 또 다른 극솟값을 가질 때, $k$의 값을 구하는 과정을 서술하시오. (단, $k\neq2$)

subparts:
- id: '1'
  stem: |
    $k$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-11/4', equivalents: ['$-\frac{11}{4}$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $g'(x)=\int_{0}^{x}(tf(t)-11)\,dt-11x$; $g'(2)=0$, $g(2)=-20$에서 $f(x)=12x+6$.
    steps:
    - id: 1a
      content: |
        $g'(x)=4x^{3}+3x^{2}-22x=x(4x+11)(x-2)$, $k=-\dfrac{11}{4}$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2', '1.A3']
    hint_ladder:
    - |
      $x\int_{0}^{x}(\cdots)\,dt$는 곱의 미분법으로 미분한다.
    - |
      극솟값 조건은 $g'(2)=0$과 $g(2)=-20$ 두 개이다.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [C 14] 5. 문항 해설(PDF 248–249쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $g(2)=-20$ 그리고 $g'(2)=0$이다.
        $g'(x)=\displaystyle\int_{0}^{x}(tf(t)-11)\,dt-11x$, 따라서, $\displaystyle\int_{0}^{2}(tf(t)-11)\,dt-22=0$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f(x)=ax+b$라 하자. $\displaystyle\int_{0}^{2}(t(at+b)-11)\,dt-22=0$에서 $\dfrac{8}{3}a+2b=44$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $g(2)=-20$에서, $g(2)=2\displaystyle\int_{0}^{2}(tf(t)-11)\,dt-\int_{0}^{2}t^{2}f(t)\,dt=-20$
        즉, $\displaystyle\int_{0}^{2}t^{2}f(t)\,dt=64$ 따라서, $4a+\dfrac{8}{3}b=64$, $a=12$, $b=6$, $f(x)=12x+6$
      criteria: ['1.M2', '1.A2']
    - id: 1b-4
      content: |
        $g'(x)=4x^{3}+3x^{2}-22x=x(4x+11)(x-2)$, 따라서 $k=-\dfrac{11}{4}$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        곱의 미분법으로 $g'(x)=\int_{0}^{x}(tf(t)-11)\,dt-11x$를 구하고 $g'(2)=0$을 적용(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $f(x)=ax+b$로 놓아 $\dfrac{8}{3}a+2b=44$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $g(2)=-20$을 적용해 $\int_{0}^{2}t^{2}f(t)\,dt=64$ 또는 $4a+\dfrac83b=64$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        $a=12$, $b=6$ ($f(x)=12x+6$)(채점기준 미공개 — 해설 단계 기준 1점 배분)
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        $g'(x)=x(4x+11)(x-2)$에서 또 다른 극소점 $k=-\dfrac{11}{4}$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-8208}
  misconceptions:
  - id: MC-CAL-8208
    outcome_code: '71'
    wrong_work: |
      $x\int_{0}^{x}(tf(t)-11)\,dt$를 미분할 때 곱의 미분법을 빠뜨려 $g'(x)=x(xf(x)-11)-x^{2}f(x)=-11x$
    detect_cue: |
      $g'(x)=-11x$처럼 $f$가 사라진 도함수가 나오고 진행이 막힌다
    feedback: |
      $x$와 $\int_{0}^{x}(\cdots)\,dt$의 곱이므로 $(uv)'=u'v+uv'$로 미분해야 합니다.
    remedy: [RL-1]

