intent: |
  제시문의 상황에서 미분과 적분과의 관계를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 적분으로 정의된 함수를 곱의 미분법과 미적분의 기본정리로 미분하고, 극솟값 조건 두 개로 일차함수를 결정한다.
key_idea: |
