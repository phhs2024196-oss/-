intent: |
  제시문의 상황에서 원과 접하는 직선, 수열의 합 $\Sigma$, 등비수열의 합을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 접선의 절편으로 삼각형 넓이 $a_{n}$을 등비수열로 나타내 합을 구한다.
key_idea: |
  반지름 $r=\dfrac{1}{3^{n}}$, 기울기 $m$인 제1사분면 접선은 $y=mx+r\sqrt{1+m^{2}}$이므로 $l_{n}:\ y=-\dfrac{2}{3}x+\dfrac{\sqrt{13}}{3^{n+1}}$.
stuck: |
  $x^{2}+y^{2}=\dfrac{1}{9^{n}}$의 반지름이 $\dfrac{1}{3^{n}}$이라는 점과, $a_{n}$이 공비 $\dfrac19$인 등비수열이라는 점.
