  misconceptions:
  - id: MC-ALG-8209
    outcome_code: '71'
    wrong_work: |
      원의 반지름을 $\dfrac{1}{9^{n}}$으로 착각해 $a_{n}=\dfrac{13}{12}\left(\dfrac{1}{81}\right)^{n}$, 공비 $\dfrac{1}{81}$로 합을 계산
    detect_cue: |
      공비가 $\dfrac{1}{81}$이거나 $a_{1}=\dfrac{13}{972}$이 나온다
    feedback: |
      $x^{2}+y^{2}=r^{2}$에서 우변은 반지름의 제곱입니다. $\dfrac{1}{9^{n}}=\left(\dfrac{1}{3^{n}}\right)^{2}$.
    remedy: [RL-1]

