stimuli: []

stem: |
  모든 자연수 $n$에 대하여 기울기가 $-\dfrac{2}{3}$이고 원 $x^{2}+y^{2}=\dfrac{1}{9^{n}}$과 제$1$사분면에서 접하는 직선을 $l_{n}$이라 하고, 직선 $l_{n}$과 $x$축 및 $y$축으로 둘러싸인 삼각형의 넓이를 $a_{n}$이라 하자. $\displaystyle\sum_{k=1}^{10}a_{k}$의 값을 구하는 다음의 풀이 과정을 완성하시오.

  [풀이 상자]
  원 $x^{2}+y^{2}=\dfrac{1}{9^{n}}$의 반지름의 길이가 $\dfrac{1}{3^{n}}$이므로, 기울기가 $-\dfrac{2}{3}$이고 이 원에 접하는 직선 $l_{n}$의 방정식은 [ ① ]이다. 직선 $l_{n}$이 $x$축 및 $y$축에 둘러싸인 부분의 넓이 $a_{n}=$ [ ② ]이므로, 수열 $\{a_{n}\}$의 첫째항 $a_{1}=$ [ ③ ] 이다. 따라서 $\displaystyle\sum_{k=1}^{10}a_{k}=$ [ ④ ] 이다.

subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 $\sum_{k=1}^{10}a_{k}$의 값을 구하는 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '① y=-(2/3)x+√13/3^(n+1), ② 13/(12·9^n), ③ 13/108, ④ (13/96)(1-(1/3)^20)', equivalents: ['$a_{n}=\frac{13}{4\times3^{2n+1}}$', '$\frac{13}{96}\left(1-\frac{1}{9^{10}}\right)$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $l_{n}$의 $y$절편 $\dfrac{\sqrt{13}}{3^{n+1}}$, $x$절편 $\dfrac{\sqrt{13}}{2\cdot3^{n}}$이므로 $a_{n}=\dfrac{13}{12}\left(\dfrac19\right)^{n}$.
    steps:
    - id: 1a
      content: |
        $a_{1}=\dfrac{13}{108}$, $\sum_{k=1}^{10}a_{k}=\dfrac{13}{96}\left\{1-\left(\dfrac13\right)^{20}\right\}$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3', '1.M2', '1.A4']
    hint_ladder:
    - |
      기울기 $m$, 반지름 $r$인 원의 접선은 $y=mx\pm r\sqrt{1+m^{2}}$.
    - |
      $a_{n+1}$과 $a_{n}$의 비는?
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [C 15] 5. 문항 해설(PDF 249–251쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직선 $l_{n}$의 방정식은 $y=-\dfrac{2}{3}x+\dfrac{1}{3^{n}}\sqrt{1+\left(-\dfrac{2}{3}\right)^{2}}$이다.
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        직선 $l_{n}$이 $x$축 및 $y$축에 만나는 점은 $\left(0,\dfrac{1}{3^{n+1}}\sqrt{13}\right)$, $\left(\dfrac{1}{3^{n}2}\sqrt{13},0\right)$이므로 삼각형 넓이는
        $a_{n}=\dfrac{1}{2}\dfrac{13}{2\times3^{2n+1}}=\dfrac{13}{4\times3}\left(\dfrac{1}{9}\right)^{n}=\dfrac{13}{12\times9}\left(\dfrac{1}{9}\right)^{n-1}$이다.
      criteria: ['1.A2', '1.A3']
    - id: 1b-3
      content: |
        따라서 등비수열의 합은 $\displaystyle\sum_{k=1}^{10}a_{k}=\dfrac{13}{12\times9}\dfrac{1-\left(\frac{1}{9}\right)^{10}}{1-\frac{1}{9}}=\dfrac{13}{12\times8}\left(1-\left(\dfrac{1}{3}\right)^{20}\right)$이다
      criteria: ['1.M2', '1.A4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        반지름 $\dfrac{1}{3^{n}}$과 접선 공식(또는 원점과 직선 사이 거리)으로 $l_{n}$의 $y$절편을 구하는 식(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        ① $y=-\dfrac{2}{3}x+\dfrac{\sqrt{13}}{3^{n+1}}$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        ② $a_{n}=\dfrac{13}{12}\left(\dfrac{1}{9}\right)^{n}$ 또는 동치식(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        ③ $a_{1}=\dfrac{13}{108}$(채점기준 미공개 — 해설 단계 기준 1점 배분)
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 1
      evidence: |
        첫째항 $\dfrac{13}{108}$, 공비 $\dfrac19$인 등비수열의 합 공식 적용(채점기준 미공개 — 해설 단계 기준 1점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A4
      mark_type: A
      points: 2
      evidence: |
        ④ $\dfrac{13}{96}\left\{1-\left(\dfrac{1}{3}\right)^{20}\right\}$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
