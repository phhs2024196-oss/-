stem: |
  등차수열 $\{a_{n}\}$이 $a_{5}+a_{6}+a_{7}=30$, $a_{9}+a_{10}=6$을 만족시킨다. 수열 $\{a_{n}\}$의 첫째항부터 제$20$항까지의 합을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    첫째항부터 제$20$항까지의 합을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '20', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $3a+15d=30$, $2a+17d=6$에서 $a=20$, $d=-2$.
    steps:
    - id: 1a
      content: |
        $a_{20}=-18$, $S_{20}=\dfrac{20(20-18)}{2}=20$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - |
      첫째항 $a$, 공차 $d$로 두 조건을 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [D 7] 5. 문항 해설(PDF 251–252쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        등차수열 $\{a_{n}\}$의 첫째항을 $a$, 공차를 $d$라 하면,
        $a_{5}+a_{6}+a_{7}=30$에서, $(a+4d)+(a+5d)+(a+6d)=3a+15d=30$이고,
        $a_{9}+a_{10}=(a+8d)+(a+9d)=2a+17d=6$이다
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        상기 연립일차방정식을 풀이하면, $\therefore a=20$, $d=-2$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 $a_{20}=20+19(-2)=-18$이므로
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $\therefore S_{20}=\dfrac{20\times(a_{1}+a_{20})}{2}=\dfrac{20\times\{20+(-18)\}}{2}=20$
      criteria: ['1.A3']
