  제시문의 상황에서 사각형과 삼각형의 넓이를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 두 대각선과 끼인각으로 나타낸 사각형의 넓이 공식에서 대각선 길이의 곱을 구하고, 합과 곱으로 이차방정식을 세운다.
