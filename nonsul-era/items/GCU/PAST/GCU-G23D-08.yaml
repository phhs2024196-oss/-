stimuli: []

stem: |
  넓이가 $6$인 사각형 $\mathrm{ABCD}$가 다음 조건을 만족시킨다.

  (가) 두 대각선 $\mathrm{AC}$, $\mathrm{BD}$에 대하여 $\overline{\mathrm{AC}}+\overline{\mathrm{BD}}=11$
  (나) 두 대각선 $\mathrm{AC}$, $\mathrm{BD}$가 이루는 예각의 크기는 $30^{\circ}$이다.

  $\overline{\mathrm{AC}}<\overline{\mathrm{BD}}$일 때 $\dfrac{\overline{\mathrm{BD}}}{\overline{\mathrm{AC}}}$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\dfrac{\overline{\mathrm{BD}}}{\overline{\mathrm{AC}}}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '8/3', equivalents: ['$\frac{8}{3}$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\dfrac12xy\sin30^{\circ}=6$에서 $xy=24$, $x+y=11$.
    steps:
    - id: 1a
      content: |
        $t^{2}-11t+24=0$, $x=3$, $y=8$, $\dfrac{y}{x}=\dfrac{8}{3}$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - |
      대각선의 길이와 끼인각으로 사각형의 넓이를 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [D 8] 5. 문항 해설(PDF 252–253쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{AC}}=x$, $\overline{\mathrm{BD}}=y$라 하자. 조건 (가)에서 $x+y=11$, 조건 (나)에서 $\dfrac{1}{2}xy\sin30^{\circ}=6$으로부터 $xy=24$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $x$, $y$는 방정식 $t^{2}-11t+24=0$의 두 근이다. $x<y$이므로 $x=3$, $y=8$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 $\dfrac{y}{x}=\dfrac{8}{3}$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        사각형 넓이 $\dfrac{1}{2}xy\sin30^{\circ}=6$에서 $xy=24$(채점기준 미공개 — 해설 단계 기준 4점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $t^{2}-11t+24=0$과 $x<y$에서 $x=3$, $y=8$(채점기준 미공개 — 해설 단계 기준 4점 배분)
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $\dfrac{\overline{\mathrm{BD}}}{\overline{\mathrm{AC}}}=\dfrac{8}{3}$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-8211}
  misconceptions:
  - id: MC-ALG-8211
    outcome_code: '71'
    wrong_work: |
      넓이 공식의 $\dfrac{1}{2}$을 빠뜨려 $xy\sin30^{\circ}=6$, $xy=12$, $t^{2}-11t+12=0$(정수근 아님)
    detect_cue: |
      $xy=12$이거나 길이에 근호가 나온다
    feedback: |
      대각선이 이루는 각이 $\theta$인 사각형의 넓이는 $\dfrac{1}{2}\overline{\mathrm{AC}}\cdot\overline{\mathrm{BD}}\sin\theta$입니다.
    remedy: [RL-1]

