# 가천대 2023학년도 수시 논술(실전) 자연D [문제 9] — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 학교 해설 원문 중 '곡선 y=x^3-3tx^2+tx 에 접하는 직선의 기울기는…'은 문제의 곡선(y=-x^3+6tx^2+5tx)과 다른 식이 적힌 오기 — 계산값은 원래 곡선 기준으로 맞음. 해설 B 에는 문제의 곡선으로 고쳐 적음
