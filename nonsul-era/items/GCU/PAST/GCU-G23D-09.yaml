      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        ④ $y=(12t^{2}+5t)x-8t^{3}$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M2, 1.A2]
      steps: [1b-4]
