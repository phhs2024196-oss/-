      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        ② $12t^{2}+5t$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M2]
      steps: [1b-2]
    - id: 1.A2
