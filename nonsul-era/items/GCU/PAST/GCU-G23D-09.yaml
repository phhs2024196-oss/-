stimuli: []

stem: |
  곡선 $y=-x^{3}+6tx^{2}+5tx$에 접하는 직선 중에서 기울기가 최대인 접선의 방정식을 구하는 다음의 풀이 과정을 완성하시오. (단, $t$는 실수)

  [풀이 상자]
  $y'=$ [ ① ]이므로 곡선 $y=-x^{3}+6tx^{2}+5tx$에 접하는 직선의 기울기는 최댓값 [ ② ]을 갖는다. 이때 접점의 좌표는 [ ③ ]이므로 접선의 방정식은 [ ④ ]이다.

subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 기울기가 최대인 접선의 방정식을 구하는 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '① -3x^2+12tx+5t, ② 12t^2+5t, ③ (2t, 16t^3+10t^2), ④ y=(12t^2+5t)x-8t^3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $y'=-3(x-2t)^{2}+12t^{2}+5t$, 접점 $x=2t$.
    steps:
    - id: 1a
      content: |
        접점 $(2t,16t^{3}+10t^{2})$, 접선 $y=(12t^{2}+5t)x-8t^{3}$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - |
      접선의 기울기는 $y'$이다. $y'$을 $x$의 이차함수로 보자.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [D 9] 5. 문항 해설(PDF 253–254쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=-x^{3}+6tx^{2}+5tx$에서
        $y'=-3x^{2}+12tx+5t$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $=-3(x-2t)^{2}+12t^{2}+5t$
        곡선 $y=-x^{3}+6tx^{2}+5tx$에 접하는 직선의 기울기는 $x=2t$에서 최댓값 $12t^{2}+5t$를 갖는다.
      criteria: ['1.M2', '1.A1']
    - id: 1b-3
      content: |
        이때 접점의 좌표는 $(2t,16t^{3}+10t^{2})$이므로
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        접선의 방정식은
        $y=(12t^{2}+5t)(x-2t)+16t^{3}+10t^{2}$
        $y=(12t^{2}+5t)x-8t^{3}$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
