intent: |
  제시문의 상황에서 로그의 밑 변환 공식과 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 밑 변환으로 $(\log_{3}a)(\log_{2}b)=(\log_{2}a)(\log_{3}b)$임을 보이고 근과 계수의 관계로 두 로그값을 구한다.
key_idea: |
  $(\log_{3}a)(\log_{2}b)=\dfrac{\log_{2}a}{\log_{2}3}\cdot\dfrac{\log_{3}b}{\log_{3}2}=(\log_{2}a)(\log_{3}b)$이므로 $A=\log_{2}a$, $B=\log_{3}b$는 $x^{2}-3cx+2c^{2}=0$의 두 근.
stuck: |
  밑 변환으로 곱 $AB$를 만들어 합·곱 구조(이차방정식)를 발견하는 것과, $a<b$로 두 경우 중 하나를 고르는 것.
