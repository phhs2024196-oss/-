# 가천대 2023학년도 수시 논술(실전) 자연D [문제 10] — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 학교 해설은 '$A<B$이므로'라고만 적어 $a<b\Rightarrow A<B$의 근거가 생략됨(밑이 2와 3으로 달라 자명하지 않음) — 해설 B 에 보충 한 줄 추가
