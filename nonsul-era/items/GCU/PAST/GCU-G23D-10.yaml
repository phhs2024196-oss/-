stimuli: []

stem: |
  $1$보다 큰 자연수 $a,b,c$에 대하여 $\log_{2}a+\log_{3}b=3c$, $(\log_{3}a)(\log_{2}b)=2c^{2}$일 때,
  $\dfrac{a}{b}=k^{c}$을 만족시키는 유리수 $k$의 값을 구하는 과정을 서술하시오. (단, $a<b$)

subparts:
- id: '1'
  stem: |
    유리수 $k$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '2/9', equivalents: ['$\frac{2}{9}$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $A+B=3c$, $AB=2c^{2}$이므로 $\{A,B\}=\{c,2c\}$; $a<b$에서 $A=c$, $B=2c$.
    steps:
    - id: 1a
      content: |
        $a=2^{c}$, $b=9^{c}$, $k=\dfrac{2}{9}$
      criteria: ['1.M1', '1.A1', '1.R1', '1.A2']
    hint_ladder:
    - |
      $(\log_{3}a)(\log_{2}b)$를 밑 변환해 $\log_{2}a$, $\log_{3}b$로 나타내 보자.
    - |
      합과 곱을 알면 무엇을 세울 수 있는가?
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [D 10] 5. 문항 해설(PDF 254–256쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\log_{2}a+\log_{3}b=3c$, $(\log_{3}a)(\log_{2}b)=\dfrac{\log_{2}a}{\log_{2}3}\dfrac{\log_{3}b}{\log_{3}2}=(\log_{2}a)(\log_{3}b)=2c^{2}$이므로,
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $A=\log_{2}a$, $B=\log_{3}b$라 놓으면, $A+B=3c$, $AB=2c^{2}$.
        따라서 $A$와 $B$는 이차방정식 $x^{2}-3cx+2c^{2}=0$의 두 근이므로
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $A=\log_{2}a=c$, $B=\log_{3}b=2c$이다.
        $A<B$이므로, $A=2c$, $B=c$인 경우는 해당하지 않는다.
        (보충: $A=2c$, $B=c$이면 $a=4^{c}>3^{c}=b$가 되어 $a<b$에 모순이다.)
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        따라서 $a=2^{c}$, $b=3^{2c}=9^{c}$이므로, $\dfrac{a}{b}=\left(\dfrac{2}{9}\right)^{c}$. 따라서 $k=\dfrac{2}{9}$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        밑 변환으로 $(\log_{3}a)(\log_{2}b)=(\log_{2}a)(\log_{3}b)$(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $A+B=3c$, $AB=2c^{2}$에서 $x^{2}-3cx+2c^{2}=0$의 두 근 $c$, $2c$(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: |
        $a<b$ 조건으로 $A=c$, $B=2c$를 택하고 다른 경우를 배제(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: []
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $a=2^{c}$, $b=9^{c}$, $k=\dfrac{2}{9}$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1, 1.R1]
      steps: [1b-4]
    deductions: []
