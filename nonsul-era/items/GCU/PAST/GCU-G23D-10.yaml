    outcome_code: '71'
    wrong_work: |
      $a<b$를 확인하지 않고 $A=2c$, $B=c$를 택해 $a=4^{c}$, $b=3^{c}$, $k=\dfrac{4}{3}$
    detect_cue: |
      $k=\dfrac43$ (또는 $k>1$)이 나온다
    feedback: |
