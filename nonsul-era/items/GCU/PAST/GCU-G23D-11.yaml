stem: |
  $k<-1$인 $k$에 대하여 $0\le x\le2\pi$에서 함수 $y=\sin^{2}\left(\dfrac{\pi}{2}+x\right)-2k\sin x+3k-1$의 최댓값이 $-3$일 때, 이 함수의 최솟값을 구하는 다음의 풀이 과정을 완성하시오.

  [풀이 상자]
  $\sin x=t$라 하고 주어진 함수를 $t$의 식으로 나타내면 $y=$ [ ① ]이다. $k<-1$이므로 주어진 범위 $0\le x\le2\pi$에서 함수 $y$는 $x=$ [ ② ]에서 최댓값을, $x=$ [ ③ ]에서 최솟값을 갖는다. 따라서 주어진 최댓값으로부터 $k=$ [ ④ ]이고 최솟값은 $-11$이다.

subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 최솟값을 구하는 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '① -t^2-2kt+3k, ② π/2, ③ 3π/2, ④ -2 (최솟값 -11)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $y=-(t+k)^{2}+k^{2}+3k$, 축 $t=-k>1$이므로 $t=1$에서 최대 $k-1$, $t=-1$에서 최소 $5k-1$.
    steps:
    - id: 1a
      content: |
        $k-1=-3\Rightarrow k=-2$, 최솟값 $5k-1=-11$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - |
      $\sin\left(\dfrac{\pi}{2}+x\right)$는 무엇과 같은가?
    - |
      $t=\sin x$의 범위와 꼭짓점 $t=-k$의 위치를 비교하자.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [D 11] 5. 문항 해설(PDF 256–257쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sin\left(\dfrac{\pi}{2}+x\right)=\cos x$, $\cos^{2}x=1-\sin^{2}x$이므로 주어진 식은 $y=-\sin^{2}x-2k\sin x+3k$,
        혹은 $y=-(\sin x+k)^{2}+k^{2}+3k$이다. $\sin x=t$라 하면
        $y=f(t)=-t^{2}-2kt+3k=-(t+k)^{2}+k^{2}+3k$이고 정의역은 $[-1,1]$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $k<-1$이므로 최댓값은 $x=\dfrac{\pi}{2}$, 혹은 $t=1$에서 $f(1)=k-1$이다.
      criteria: ['1.M2', '1.A1']
    - id: 1b-3
      content: |
        따라서 $k=-2$이다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        따라서 $x=\dfrac{3\pi}{2}$, 혹은 $t=-1$에서의 최솟값은 $f(-1)=5k-1$, 즉 $-11$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        ① $y=-t^{2}-2kt+3k$ (정의역 $-1\le t\le1$)(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        축 $t=-k>1$에서 $[-1,1]$에서의 최대·최소 위치를 판단(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        ② $x=\dfrac{\pi}{2}$($t=1$), ③ $x=\dfrac{3\pi}{2}$($t=-1$)(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M2]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $k-1=-3$에서 ④ $k=-2$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        최솟값 $f(-1)=5k-1=-11$(채점기준 미공개 — 해설 단계 기준 1점 배분)
      depends_on: [1.M2, 1.A2]
      steps: [1b-4]
    deductions: []
