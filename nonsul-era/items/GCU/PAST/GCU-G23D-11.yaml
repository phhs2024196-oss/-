  - id: MC-ALG-8214
    outcome_code: '71'
    wrong_work: |
      $\sin^{2}\left(\dfrac{\pi}{2}+x\right)$를 $\sin^{2}x$로 두어 $y=t^{2}-2kt+3k-1$로 계산
    detect_cue: |
