intent: |
  제시문의 상황에서 치환과 삼각함수의 그래프와 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $\sin x=t$로 치환한 이차함수의 축 $t=-k>1$이 범위 밖에 있음을 이용해 최댓값·최솟값의 위치를 정한다.
key_idea: |
  $\sin\left(\dfrac{\pi}{2}+x\right)=\cos x$이므로 $y=-t^{2}-2kt+3k$ $(t=\sin x\in[-1,1])$, 축 $t=-k>1$이라 $[-1,1]$에서 증가.
stuck: |
  $\sin^{2}\left(\dfrac{\pi}{2}+x\right)=\cos^{2}x=1-\sin^{2}x$ 변환과 축이 구간 밖이라는 판단.
