intent: |
  제시문의 상황에서 적분의 속도와 거리에 대한 관계를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 위치의 차 $h(k)$의 그래프에서 $|h(k)|=72$의 양수 해 개수가 $2$가 되는 조건을 꼭짓점 값으로 결정한다.
key_idea: |
  $h(k)=\dfrac{1}{2}k^{2}-4ak$는 $k=4a$에서 최솟값 $-8a^{2}$; $h=72$는 양수 해가 항상 $1$개이므로 $h=-72$가 정확히 $1$개(접함)여야 한다.
stuck: |
  $|h(k)|=72$를 $h=72$, $h=-72$로 나눠 양수 해 개수를 세는 것.
