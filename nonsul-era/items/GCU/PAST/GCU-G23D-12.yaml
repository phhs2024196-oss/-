stimuli: []

stem: |
  시각 $t=0$일 때 동시에 원점을 출발하여 수직선 위를 움직이는
  두 점 $\mathrm{P}$, $\mathrm{Q}$의 시각 $t\ (t\ge0)$에서의 속도가 각각
  $$v_{1}(t)=2t-3a,\quad v_{2}(t)=t+a$$
  이다. 시각 $t=k$에서 두 점 $\mathrm{P}$, $\mathrm{Q}$ 사이의 거리가 $72$가 되도록 하는 모든 양수 $k$의 개수가 $2$일 때, 상수 $a$의 값을 구하는 과정을 서술하시오. (단, $a>0$)

subparts:
- id: '1'
  stem: |
    상수 $a$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $h(k)=\dfrac12k^{2}-4ak$, 최솟값 $h(4a)=-8a^{2}=-72$.
    steps:
    - id: 1a
      content: |
        $8a^{2}=72$, $a>0$이므로 $a=3$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2']
    hint_ladder:
    - |
      두 점의 위치를 각각 구해 차 $h(k)$를 만들자.
    - |
      $h(k)=72$와 $h(k)=-72$의 양수 해는 각각 몇 개인가?
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [D 12] 5. 문항 해설(PDF 257–258쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 점 $\mathrm{P}$, $\mathrm{Q}$의 시각 $t=k$에서의 위치를 각각 $f(k)$, $g(k)$라 하면,
        $f(k)=k^{2}-3ak$, $g(k)=\dfrac{1}{2}k^{2}+ak$, 즉, $h(k)=f(k)-g(k)=\dfrac{1}{2}k^{2}-4ak$.
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        따라서 두 점 사이의 거리는 $|h(k)|$이다.
        $|h(k)|=72$가 되도록 하는 모든 양수 $k$의 개수가 $2$개이려면,
        $k>0$일 때, $|h(k)|=72$의 서로 다른 실근의 개수가 $2$이어야 한다.
        따라서 $|h(4a)|=72$이어야 한다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $|h(4a)|=8a^{2}=72$, $\therefore a=3\ (\because a>0)$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        속도를 적분해 위치 $f(k)=k^{2}-3ak$, $g(k)=\dfrac12k^{2}+ak$를 구했다(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $h(k)=\dfrac{1}{2}k^{2}-4ak$와 거리 $|h(k)|$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        양수 해가 $2$개일 조건을 꼭짓점 $k=4a$에서 $|h(4a)|=72$로 세웠다(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $8a^{2}=72$, $a=3$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
