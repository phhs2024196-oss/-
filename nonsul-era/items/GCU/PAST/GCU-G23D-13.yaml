stem: |
  수열 $\{a_{n}\}$이 모든 자연수 $n$에 대하여 다음 조건을 만족시킨다.

  (가) $\displaystyle\sum_{k=1}^{10}(a_{k}+2)^{2}=192$
  (나) $\displaystyle\sum_{k=1}^{10}a_{k}(a_{k}+1)=\sum_{k=1}^{11}2a_{k}$
  (다) $\displaystyle\sum_{k=1}^{10}k(a_{k}-a_{k+1})=20$

  이때 $\displaystyle\sum_{k=1}^{11}a_{k}$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\sum_{k=1}^{11}a_{k}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '31', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $S_{10}=\sum_{k=1}^{10}a_{k}$, $S_{11}=\sum_{k=1}^{11}a_{k}$로 두면 $3S_{10}=152-2S_{11}$, $S_{10}=20+10(S_{11}-S_{10})$.
    steps:
    - id: 1a
      content: |
        연립하면 $S_{10}=30$, $S_{11}=31$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2', '1.A3']
    hint_ladder:
    - |
      (가)와 (나)를 전개해 $\sum a_{k}^{2}$을 소거하자.
    - |
      (다)를 항별로 펼쳐 보자.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [D 13] 5. 문항 해설(PDF 258–260쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\sum_{k=1}^{10}(a_{k}^{2}+4a_{k})+40=192$, $\displaystyle\sum_{k=1}^{10}(a_{k}^{2}+a_{k})=\sum_{k=1}^{11}2a_{k}$을 연립하여 풀면,
        $\displaystyle\sum_{k=1}^{10}3a_{k}=152-\sum_{k=1}^{11}2a_{k}$이다 (식-1).
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        $\displaystyle\sum_{k=1}^{10}k(a_{k}-a_{k+1})=(a_{1}-a_{2})+2(a_{2}-a_{3})+\cdots+10(a_{10}-a_{11})=20$이고,
        $(a_{1}+a_{2}+a_{3}+\cdots+a_{10})-10a_{11}=20$, $\displaystyle\sum_{k=1}^{10}a_{k}=20+10a_{11}$이고,
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\displaystyle\sum_{k=1}^{10}a_{k}=20+10\left(\sum_{k=1}^{11}a_{k}-\sum_{k=1}^{10}a_{k}\right)$이다. (식-2).
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        (식-1), (식-2)를 연립하여 풀면,
        $\displaystyle\sum_{k=1}^{11}a_{k}=31$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        (가)·(나)를 전개해 $\sum a_{k}^{2}$을 소거하는 식(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        (식-1) $3\sum_{k=1}^{10}a_{k}=152-2\sum_{k=1}^{11}a_{k}$(채점기준 미공개 — 해설 단계 기준 1점 배분)
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        (다)를 펼쳐 $\sum_{k=1}^{10}a_{k}-10a_{11}=20$(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        (식-2) $a_{11}=\sum_{k=1}^{11}a_{k}-\sum_{k=1}^{10}a_{k}$를 대입한 식(채점기준 미공개 — 해설 단계 기준 1점 배분)
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        연립하여 $\sum_{k=1}^{11}a_{k}=31$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1, 1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
