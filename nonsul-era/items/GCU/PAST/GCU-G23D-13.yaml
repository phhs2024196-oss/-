  misconceptions:
  - id: MC-ALG-8216
    outcome_code: '71'
    wrong_work: |
      (다)를 $a_{1}-a_{11}$ 또는 $\sum_{k=1}^{10}a_{k}-a_{11}=20$으로 잘못 펼쳐 계수 $10$을 놓침
    detect_cue: |
      (식-2)에 $10a_{11}$ 대신 $a_{11}$이 있다
    feedback: |
      $k(a_{k}-a_{k+1})$을 $k=1$부터 $10$까지 쓰면 $a_{2},\cdots,a_{10}$의 계수는 $1$, $a_{11}$의 계수는 $-10$이 됩니다.
    remedy: [RL-1]

