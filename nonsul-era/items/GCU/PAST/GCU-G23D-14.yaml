    outcome_code: '71'
    wrong_work: |
      주기 경계 $x=n,2n,\cdots$에서의 불연속(값이 $1$로 떨어짐)을 세지 않아 한 주기당 $3$개로 계산
    detect_cue: |
      한 주기당 불연속점을 $3$개($x=2,52,302$)로만 센다
    feedback: |
      $f(n)\ge2$이지만 $x=n$의 바로 오른쪽은 $f(0+)=1$이므로 $x=n$도 불연속점입니다.
    remedy: [RL-1]

