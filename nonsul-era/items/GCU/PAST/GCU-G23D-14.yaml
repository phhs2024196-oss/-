stimuli: []

stem: |
  정의역이 양의 실수 전체의 집합인 함수 $f(x)$가 자연수 $n$에 대하여 다음 조건을 만족시킨다.

  (가) $0<x\le n$일 때, 어떤 정수 $m$에 대하여
  $m\le\log_{5}(2x+21)<m+1$이면 $f(x)=m$이다.
  (나) 모든 양의 실수 $x$에 대하여 $f(x+n)=f(x)$이다.

  열린구간 $(0,2023)$에서 함수 $f(x)$가 $23$개의 불연속인 점을 갖도록 하는 자연수 $n$의 최댓값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    자연수 $n$의 최댓값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '344', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      한 주기 $(0,n]$의 불연속점은 $302<n<1552$에서 $x=2,52,302,n$의 $4$개.
    steps:
    - id: 1a
      content: |
        $n=344$: $(0,1720]$에 $20$개, $1722,1772,2022$에서 $3$개, 합 $23$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2']
    hint_ladder:
    - |
      $\log_{5}(2x+21)$이 정수가 되는 $x$를 구하자.
    - |
      $x=n$에서 $f(n)$과 $f(n+)$을 비교하자.
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [D 14] 5. 문항 해설(PDF 260–261쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $5^{2}=25$, $5^{3}=125$, $5^{4}=625$, $5^{5}=3125$이므로,
        구간 $(0,2)$에서 $f(x)=1$,
        구간 $[2,52)$에서 $f(x)=2$,
        구간 $[52,302)$에서 $f(x)=3$,
        구간 $[302,1552)$에서 $f(x)=4$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        구간 $(0,n)$에서 $f$의 불연속인 점의 개수는
        $n=2$일 때는 $1$개,
        $2<n\le52$일 때는 $2$개,
        $52<n\le302$일 때는 $3$개,
        $302<n<2023$일 때는 $4$개다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 구간 $(0,344]$에서 불연속인 점의 개수는 $4$이므로,
        구간 $(0,1720]$에서 $f(x)$의 불연속인 점의 개수는 $4\times5=20$.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        또한, $x=1722$, $x=1772$, $x=2022$에서 $f(x)$는 불연속이므로,
        불연속인 점의 개수가 $23$이 되도록 하는 자연수 $n$의 최댓값은 $344$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\log_{5}(2x+21)$이 정수가 되는 점으로 $f$의 값이 바뀌는 구간($x=2,52,302$ 등) 결정(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        한 주기 안 불연속점 개수를 $n$의 범위별로 분류(경계 $x=n$ 포함)(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $n=344$일 때 $(0,1720]$의 $5$주기에 $20$개를 셈(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $1722,1772,2022$의 $3$개를 더해 $23$, 최댓값 $n=344$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M2]
      steps: [1b-4]
