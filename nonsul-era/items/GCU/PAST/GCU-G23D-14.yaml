intent: |
  제시문의 상황에서 새롭게 정의된 함수의 그래프와 연속의 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 한 주기 안의 계단 위치를 구해 주기 $n$에 따라 불연속점의 개수를 분류하고 $(0,2023)$에서 세어 최대 $n$을 찾는다.
key_idea: |
  $0<x\le n$에서 $f(x)=[\log_{5}(2x+21)]$은 $x=2,52,302,1552$에서 값이 바뀌고, 주기 경계 $x=n$에서도 $f(n)\ne f(0+)=1$이라 불연속이다.
stuck: |
  주기 경계점 $x=n,2n,\cdots$도 불연속점이라는 것과, 23개가 되도록 $n$을 조절하는 셈.
