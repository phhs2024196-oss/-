# 가천대 2023학년도 수시 논술(실전) 자연D [문제 14] — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 학교 해설 '302<n<2023 일 때는 4개'는 n>1552 이면 x=1552 도 불연속이라 5개 — 답(344)에는 영향 없음. 또 344가 최댓값인 근거(345 이상에서 23개 불가)는 해설에 생략됨 — verify 에서 n=1..2022 전수 확인
