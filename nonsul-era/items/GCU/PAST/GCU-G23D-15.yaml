stimuli: []

stem: |
  곡선 $y=x^{2}+1$ 위의 점 $\mathrm{P}(t,t^{2}+1)$에서의 접선을 $l$이라 하자. 점 $\mathrm{Q}\left(m,\dfrac{9}{2}\right)$에 대하여 직선 $\mathrm{PQ}$와 직선 $l$이 서로 수직인 점 $\mathrm{P}$의 개수가 $1$이 되도록 하는 $m$의 범위를 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $m$의 범위를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'm<-4 또는 m>4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\dfrac{(t^{2}+1)-\frac92}{t-m}=-\dfrac{1}{2t}\iff2t^{3}-6t-m=0$.
    steps:
    - id: 1a
      content: |
        $f(-1)f(1)=(4-m)(-4-m)>0$에서 $m<-4$ 또는 $m>4$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2']
    hint_ladder:
    - |
      수직인 두 직선의 기울기의 곱은?
    - |
      삼차방정식이 실근을 하나만 가질 조건은?
  - id: S1-B
    audience: B
    source_flow: 「2023학년도 선행학습 영향평가 자체평가 보고서」 문항카드 [D 15] 5. 문항 해설(PDF 261–262쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $P(t,t^{2}+1)$이라 하면 $y=x^{2}+1$에서 $y'=2x$이므로 직선 $l$의 기울기는 $2t$이다.
        이때 직선 $PQ$의 기울기가 $-\dfrac{1}{2t}$이므로 $\dfrac{(t^{2}+1)-\frac{9}{2}}{t-m}=-\dfrac{1}{2t}$에서 $2t^{3}-6t-m=0$
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        $f(t)=2t^{3}-6t-m$라 하면 방정식 $f(t)=0$이 하나의 실근을 가져야 한다.
        $f'(t)=6t^{2}-6$이므로 $f'(t)=0$에서 $t=-1$ 또는 $t=1$
        함수 $f(t)$는 $t=-1$에서 극대, $t=1$에서 극소이므로 $f(-1)\times f(1)>0$이 성립해야 한다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $(-2+6-m)(2-6-m)>0$에서 $m<-4$ 또는 $m>4$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $l$의 기울기 $2t$와 수직 조건(기울기 곱 $-1$)으로 식을 세웠다(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $2t^{3}-6t-m=0$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        실근 $1$개 조건을 극값 $f(-1)$, $f(1)$의 곱 $>0$으로 세웠다(채점기준 미공개 — 해설 단계 기준 3점 배분)
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $m<-4$ 또는 $m>4$(채점기준 미공개 — 해설 단계 기준 2점 배분)
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
