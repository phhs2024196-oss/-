intent: |
  제시문의 상황에서 접선의 방정식의 기울기에 대한 조건과 도함수의 활용에서의 부등식을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 수직 조건을 $t$에 대한 삼차방정식으로 바꾸고 실근이 하나일 조건을 극값의 곱의 부호로 판정한다.
key_idea: |
  $l$의 기울기 $2t$, $\mathrm{PQ}$의 기울기 $-\dfrac{1}{2t}$에서 $2t^{3}-6t-m=0$; 실근 $1$개 $\iff$ 극댓값·극솟값의 곱 $>0$.
stuck: |
  점 P의 개수를 삼차방정식 $2t^{3}-6t-m=0$의 실근 개수로 바꾸는 것.
