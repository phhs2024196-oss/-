  - id: MC-CAL-8218
    outcome_code: '71'
    wrong_work: |
      실근 $1$개 조건을 $f(-1)f(1)<0$으로 반대로 세워 $-4<m<4$
    detect_cue: |
      답이 $-4<m<4$이다
    feedback: |
