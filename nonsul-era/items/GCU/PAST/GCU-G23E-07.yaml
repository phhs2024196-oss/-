stimuli: []
stem: |
  함수 $f(x)=-x^3+3x^2+9x+a$가 닫힌구간 $[-1,6]$에서 최솟값 $-40$을 갖는다. 곡선 $y=f(x)$와 직선 $y=k$가 만나는 점의 개수가 2가 되도록 하는 모든 상수 $k$의 값의 합을 구하는 과정을 서술하시오. (단, $a$는 상수)
subparts:
- id: '1'
  stem: |
    모든 상수 $k$의 값의 합을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '50', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(6)=-54+a=-40$에서 $a=14$, 극솟값 $9$·극댓값 $41$의 합.
    steps:
    - id: 1a
      content: $a=14$, $k\in\{f(-1),f(3)\}=\{9,41\}$, 합 $50$
      criteria:
      - 1.M1
      - 1.A1
      - 1.M2
      - 1.A2
    hint_ladder:
    - $f'(x)$를 인수분해해 극값 위치를 찾자.
    - 닫힌구간의 최솟값 후보는 극솟값과 양 끝값이다.
    - 수평선과 두 점에서 만나는 순간은 극값에서 접할 때다.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [E 7] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=-3x^2+6x+9=-3(x-3)(x+1)$이며, 닫힌구간 $[-1,6]$에서 최솟값은 $f(-1)=1+3-9+a=-5+a$와 $f(6)=-216+3\times36+54+a=-54+a$ 중에 있다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(6)=-54+a=-40$이므로 $a=14$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        곡선 $y=f(x)$와 직선 $y=k$가 만나는 점의 개수가 2가 되는 지점은 극솟값과 극댓값이다.
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $f(-1)=-5+a=9$와 $f(3)=-27+3\times9+27+a=41$이므로, 상수 $k$의 합은 $50$이다.
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f'(x)=-3(x-3)(x+1)$을 구하고 최솟값 후보 $f(-1)=-5+a$, $f(6)=-54+a$를 비교했다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $a=14$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        교점이 2개인 $k$는 극댓값·극솟값임을 밝혔다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $f(-1)=9$, $f(3)=41$, 합 $50$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      - 1.A1
      steps:
      - 1b-4
    deductions: []
