intent: |
  제시문의 상황에서 함수의 닫힌 구간에서의 최솟값과 도함수의 활용에서의 방정식을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 극값과 끝값을 비교해 $a$를 정하고, 수평선과의 교점 개수를 극값으로 판정한다.
key_idea: |
  닫힌구간의 최솟값은 극솟값 $f(-1)$과 끝값 $f(6)$ 중 작은 것이고, 직선 $y=k$와 두 점에서 만나려면 $k$가 극댓값 또는 극솟값이어야 한다.
stuck: |
  극솟값 $f(-1)$만 최솟값으로 보고 끝값 $f(6)$을 비교하지 않는 실수.
