stimuli: []
stem: |
  $\sin\theta\tan\theta=-\dfrac{8}{3}$일 때, $\sin\left(\dfrac{3\pi}{2}-\theta\right)$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\sin\left(\dfrac{3\pi}{2}-\theta\right)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\frac{1}{3}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $3\cos^2\theta-8\cos\theta-3=0$에서 $\cos\theta=-\tfrac13$, 구하는 값은 $-\cos\theta$.
    steps:
    - id: 1a
      content: $\cos\theta=-\tfrac13\Rightarrow\sin\left(\tfrac{3\pi}{2}-\theta\right)=-\cos\theta=\tfrac13$
      criteria:
      - 1.M1
      - 1.A1
      - 1.M2
      - 1.A2
    hint_ladder:
    - $\tan\theta=\dfrac{\sin\theta}{\cos\theta}$로 바꿔 보자.
    - $\sin^2\theta$를 $\cos\theta$로 나타내자.
    - $\dfrac{3\pi}{2}-\theta$는 $\pi+\left(\dfrac{\pi}{2}-\theta\right)$이다.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [E 8] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sin\theta\tan\theta=\dfrac{\sin^2\theta}{\cos\theta}=\dfrac{1}{\cos\theta}-\cos\theta=-\dfrac{8}{3}$로부터 $3\cos^2\theta-8\cos\theta-3=0$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $(3\cos\theta+1)(\cos\theta-3)=0$으로부터 $\cos\theta=-\dfrac{1}{3}$.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\sin\left(\dfrac{3\pi}{2}-\theta\right)=-\sin\left(\dfrac{\pi}{2}+\theta\right)=-\cos\theta$
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $-\cos\theta=\dfrac{1}{3}$.
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\sin^2\theta=1-\cos^2\theta$를 써서 $3\cos^2\theta-8\cos\theta-3=0$을 세웠다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        인수분해하고 $\cos\theta=3$을 버려 $\cos\theta=-\dfrac13$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $\sin\left(\dfrac{3\pi}{2}-\theta\right)=-\cos\theta$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        값 $\dfrac13$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      - 1.A1
      steps:
      - 1b-4
    deductions: []
