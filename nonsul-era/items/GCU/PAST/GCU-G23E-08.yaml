  제시문의 상황에서 삼각함수의 관계와 그래프를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $\sin^2\theta=1-\cos^2\theta$로 $\cos\theta$의 이차방정식을 세우고 $\dfrac{3\pi}{2}-\theta$ 변환을 적용한다.
