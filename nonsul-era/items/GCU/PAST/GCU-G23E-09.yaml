stimuli: []
stem: |
  첫째항이 $a$이고 공차가 $2a$인 등차수열 $\{a_n\}$에 대하여 $\displaystyle\sum_{k=1}^{10}\frac{3}{a_ka_{k+1}}=\frac{5}{7}$일 때, $a_3$의 값을 구하는 과정을 서술하시오. (단, $a>0$)
subparts:
- id: '1'
  stem: |
    $a_3$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '5\sqrt{2}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 부분분수로 소거하면 $\dfrac{3}{2a}\left(\dfrac1a-\dfrac1{21a}\right)=\dfrac{10}{7a^2}$.
    steps:
    - id: 1a
      content: $\dfrac{10}{7a^2}=\dfrac57\Rightarrow a=\sqrt2,\ a_3=5a=5\sqrt2$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - $a_{k+1}-a_k=2a$임을 이용해 분수를 둘로 쪼개 보자.
    - 소거 후 남는 항은 $\dfrac{1}{a_1}$과 $\dfrac{1}{a_{11}}$이다.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [E 9] 5. 문항 해설 (해설 마지막 줄 '$=\dfrac{5a^2}{7}$'은 '$\dfrac{10a^2}{7}$'의 오기로 보여 바로잡음)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\sum_{k=1}^{10}\frac{3}{a_ka_{k+1}}=\sum_{k=1}^{10}\frac{3}{a_{k+1}-a_k}\left(\frac{1}{a_k}-\frac{1}{a_{k+1}}\right)=\frac{3}{d}\left(\frac{1}{a_1}-\frac{1}{a_2}+\frac{1}{a_2}-\frac{1}{a_3}+\cdots-\frac{1}{a_{11}}\right)$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $=\dfrac{3}{2a}\left(\dfrac{1}{a_1}-\dfrac{1}{a_{11}}\right)=\dfrac{3}{2a}\left(\dfrac{1}{a}-\dfrac{1}{a+20a}\right)=\dfrac{5}{7}$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\therefore\ 3\left(1-\dfrac{1}{21}\right)=\dfrac{20}{7}=\dfrac{10a^2}{7}$, $a=\sqrt{2}$ (학교 해설 표기는 $\dfrac{5a^2}{7}$)
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $\therefore\ a_3=\sqrt{2}+2\times2\sqrt{2}=5\sqrt{2}$
      criteria:
      - 1.A3
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\dfrac{1}{a_ka_{k+1}}=\dfrac{1}{d}\left(\dfrac{1}{a_k}-\dfrac{1}{a_{k+1}}\right)$로 분해해 소거했다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        합을 $\dfrac{3}{2a}\left(\dfrac1a-\dfrac{1}{21a}\right)$로 나타냈다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $a=\sqrt2$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      - 1.A1
      steps:
      - 1b-3
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        $a_3=5\sqrt2$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      - 1.A2
      steps:
      - 1b-4
    deductions: []
