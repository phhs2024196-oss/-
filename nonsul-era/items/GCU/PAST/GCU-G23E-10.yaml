      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $b=2$ 또는 $b=-2$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      steps:
      - 1b-3
    - id: 1.A3
      mark_type: A
      points: 3
      evidence: |
        $f(3)=-1$, $-25$를 비교해 최솟값 $-25$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      - 1.A1
      - 1.A2
      steps:
      - 1b-4
