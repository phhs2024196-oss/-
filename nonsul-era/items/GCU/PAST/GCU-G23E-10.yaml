stimuli: []
stem: |
  최고차항의 계수가 1인 삼차함수 $f(x)$의 그래프가 $x$축과 서로 다른 두 점에서 만나고, $x\le a$인 모든 실수 $x$에 대하여 부등식 $f(x)\le0$이 성립하도록 하는 실수 $a$의 최댓값은 4이다. $f(0)=-16$일 때, $f(3)$의 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $f(3)$의 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-25', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=(x-b)^2(x-4)$, $-4b^2=-16$에서 $b=\pm2$.
    steps:
    - id: 1a
      content: $f(3)=-1$ 또는 $-25$, 최솟값 $-25$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - $x$축과 두 점에서 만나는 삼차함수는 접점(중근)이 하나 있다.
    - $f(x)\le0$이 깨지는 지점은 단근이다.
    - $b$의 두 값을 모두 확인하자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [E 10] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=f(x)$의 그래프가 $x=b$에서 $x$축과 접한다고 하면 $f(x)=0$은 중근을 가지며 $f(x)=(x-b)^2(x-c)$ ($c$는 상수, $b\ne c$)로 놓을 수 있다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x\le a$인 모든 실수 $x$에 대하여 $f(x)\le0$이 성립하도록 하는 실수 $a$의 최댓값이 4일 때 $c=4$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $x=0$을 대입하면 $f(0)=-4b^2$, 즉 $-4b^2=-16$에서 $b=2$ 또는 $b=-2$이므로 $f(x)=(x-2)^2(x-4)$ 또는 $f(x)=(x+2)^2(x-4)$.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $x=3$을 대입하면 $f(3)=-1$ 또는 $f(3)=-25$이므로 $f(3)$의 최솟값은 $-25$이다.
      criteria:
      - 1.A3
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
