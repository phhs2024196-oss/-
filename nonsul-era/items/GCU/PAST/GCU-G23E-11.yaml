stem: |
  실수 $a$와 6 이하의 자연수 $n$에 대하여 다음 조건을 만족시키는 순서쌍 $(a,n)$의 개수를 구하는 과정을 서술하시오.

  (가) $2a^2-9a+4=0$

  (나) $a^{3n^2-17n}<a^{n^2-30}$
subparts:
- id: '1'
  stem: |
    순서쌍 $(a,n)$의 개수를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '5', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a=\tfrac12$이면 $2n^2-17n+30>0$, $a=4$이면 $2n^2-17n+30<0$.
    steps:
    - id: 1a
      content: $(\tfrac12,1),(\tfrac12,2),(4,3),(4,4),(4,5)$의 5개
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - (가)를 인수분해하자.
    - 밑이 1보다 작으면 지수의 대소는 어떻게 되는가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [E 11] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $2a^2-9a+4=0$에서 $(2a-1)(a-4)=0$이므로 $a=\dfrac12$ 또는 $a=4$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a=\dfrac12$일 때, $a^{3n^2-17n}<a^{n^2-30}$에서 $3n^2-17n>n^2-30$, 즉 $2n^2-17n+30>0$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $(2n-5)(n-6)>0$이므로 $\dfrac52>n$ 또는 $6<n$. 이를 만족하는 6 이하의 자연수 $n=1,2$이다.
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $a=4$일 때 $3n^2-17n<n^2-30$ 즉 $2n^2-17n+30<0$, $(2n-5)(n-6)<0$이므로 $\dfrac52<n<6$. 이를 만족하는 6 이하의 자연수 $n=3,4,5$이다. (학교 해설 표기 '$\dfrac52<x<6$'의 $x$는 $n$의 오기)
      criteria:
      - 1.A2
    - id: 1b-5
      content: |
        그러므로 가능한 모든 $(a,n)$의 순서쌍은 $\left(\dfrac12,1\right),\left(\dfrac12,2\right),(4,3),(4,4),(4,5)$으로 5개이다.
      criteria:
      - 1.A3
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $a=\dfrac12$ 또는 $a=4$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
