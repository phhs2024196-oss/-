    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $a=\dfrac12$에서 부등호 방향을 바꿔 $2n^2-17n+30>0$을 세웠다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $n=1,2$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $a=4$에서 $2n^2-17n+30<0$, $n=3,4,5$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      steps:
      - 1b-4
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        순서쌍 5개(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      - 1.A1
      - 1.A2
      steps:
      - 1b-5
