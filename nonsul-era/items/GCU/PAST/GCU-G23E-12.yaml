intent: |
  제시문의 상황에서 주어진 조건과 등차중항을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 중근 조건으로 $b,c$를 $a$로 나타내고 등차중항으로 $a$를 정한다.
key_idea: |
  $x=3$에서 중근이면 $ax^2-2bx+c=a(x-3)^2$이므로 $b=3a$, $c=9a$이다.
stuck: |
  $-2bx$의 계수 때문에 판별식을 $b^2-4ac$로 잘못 쓰기 쉽다.
