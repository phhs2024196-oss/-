stem: |
  0이 아닌 세 수 $a,b,c$에 대하여, $x$에 대한 이차방정식 $ax^2-2bx+c=0$이 $x=3$에서 중근을 갖는다. 한편, 세 수 $a,5,c$가 순서대로 등차수열을 이룰 때, $a,b,c$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $a,b,c$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: 'a=1,\ b=3,\ c=9', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a(x-3)^2$와 비교해 $c=9a$, 등차중항 $10=a+9a$.
    steps:
    - id: 1a
      content: $a=1,\ b=3,\ c=9$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - 중근 $3$을 갖는 이차식을 직접 써 보자.
    - $a,5,c$가 등차수열이면 $5$는 무엇인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [E 12] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        판별식에 의해 $b^2=ac$이다. 또는 주어진 식이 $a(x-3)^2=0$이다(따라서 $b=3a$, $c=9a$).
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서, $a,5,c$가 등차수열을 이룰 때, $5\times2=a+9a$ 등차중항의 성질에 따라 $a=1$이다.
      criteria:
      - 1.M2
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $b=3$, $c=9$이다.
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        중근 조건으로 $b^2=ac$ 또는 $ax^2-2bx+c=a(x-3)^2$에서 $b=3a$, $c=9a$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
