      evidence: |
        $p=2$, $f(x)=\dfrac25\left(-(x-a)^4+(x-a)^2\right)$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $a=3$ (양수 조건으로 $a=-1$ 제외), $f(8)=-240$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      - 1.A1
      steps:
      - 1b-4
