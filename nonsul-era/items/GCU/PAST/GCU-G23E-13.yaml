stimuli: []
stem: |
  양의 실수 $a$에 대하여 사차함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $f(1)=-\dfrac{24}{5}$

  (나) $\displaystyle\lim_{x\to a}\left\{\frac{2}{f(x)}-\frac{5}{(x-a)^2}\right\}=5$

  $f(8)$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $f(8)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-240', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f=(x-a)^2g$, $2-5g=p(x-a)^2$, $p=2$로 $f=\frac25\{-(x-a)^4+(x-a)^2\}$.
    steps:
    - id: 1a
      content: $a=3$, $f(8)=-240$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - 두 분수를 통분해 보자.
    - 분모가 $0$으로 가면 분자도 $0$으로 가야 한다.
    - $g(a)$와 $p$의 관계를 극한값 $5$로 얻자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [E 13] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{x\to a}\frac{2(x-a)^2-5f(x)}{(x-a)^2f(x)}$가 존재하므로 $f(x)=(x-a)^2g(x)$, $g(x)$는 이차함수.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 $\displaystyle\lim_{x\to a}\frac{2(x-a)^2-5f(x)}{(x-a)^2f(x)}$가 존재하므로 실수 $p$에 대해 $2-5g(x)=p(x-a)^2$, $2-5g(a)=0$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 $g(a)=\dfrac25$. $\displaystyle\lim_{x\to a}\frac{2-5g(x)}{(x-a)^2g(x)}=\lim_{x\to a}\frac{p(x-a)^2}{(x-a)^2g(x)}=5$이므로 $\dfrac{p}{g(a)}=5$. 결국 $p=2$이고 $5g(x)=2-2(x-a)^2$이므로 $f(x)=(x-a)^2\dfrac{2-2(x-a)^2}{5}=\dfrac25\left(-(x-a)^4+(x-a)^2\right)$.
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        조건 (가)로부터 $f(1)=\dfrac25\left(-(1-a)^4+(1-a)^2\right)=-\dfrac{24}{5}$을 풀면 $a=3$. 결국 $f(x)=\dfrac25\left(-(x-3)^4+(x-3)^2\right)$이고, $f(8)=-240$.
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
