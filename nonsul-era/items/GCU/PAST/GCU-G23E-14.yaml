stem: |
  원에 내접하는 사각형 $ABCD$에서 대각선 $AC$, $BD$가 만나는 점을 $E$라 하자. $\overline{BD}=6$, $\angle BAD=60^\circ$이고 대각선 $AC$는 $\angle BAD$를 이등분하며 $\angle ABD=45^\circ$이다. 삼각형 $ABE$의 넓이를 $S$, 삼각형 $CDE$의 넓이를 $T$라 할 때, $S-T$의 값을 구하는 다음의 풀이 과정을 완성하시오.

  > 삼각형 $ABC$와 삼각형 $ABD$가 동일한 원에 내접하므로 사인법칙을 사용하면 $\overline{BC}$의 값은 [ ① ]이다. $\angle CBD=\angle CAD$이므로 $\angle ABC=75^\circ$이다.
  > $x=\overline{AB}=\overline{AC}$라 하고 삼각형 $ABC$에서 코사인법칙을 사용하면 $x^2$의 값은 [ ② ]이다. 따라서 삼각형 $ABC$의 넓이의 값은 [ ③ ]이다.
  > 한편 $\angle CBD=\angle CDB$이므로 $\overline{CD}=\overline{BC}$이다. 따라서 삼각형 $BCD$의 넓이는 $3\sqrt{3}$이다. 삼각형 $ABC$와 삼각형 $BCD$는 삼각형 $BCE$를 공통으로 포함하므로 $S-T$의 값은 [ ④ ]이다.
subparts:
- id: '1'
  stem: |
    빈칸 ①, ②, ③, ④를 채워 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '①\ 2\sqrt{3},\ ②\ 12(2+\sqrt{3}),\ ③\ 3(2+\sqrt{3}),\ ④\ 6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 사인법칙 $BC=2\sqrt3$, 이등변 $\triangle ABC$에 코사인법칙, 공통 $\triangle BCE$ 소거.
    steps:
    - id: 1a
      content: ①$2\sqrt3$ ②$12(2+\sqrt3)$ ③$3(2+\sqrt3)$ ④$6$
      criteria:
      - 1.B1
      - 1.B2
      - 1.B3
      - 1.B4
    hint_ladder:
    - $\angle BAC=30^\circ$, $\angle BAD=60^\circ$는 같은 원의 원주각이다.
    - $\angle ACB=\angle ADB=75^\circ$이다.
    - $S=\triangle ABC-\triangle BCE$, $T=\triangle BCD-\triangle BCE$.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [E 14] 5. 문항 해설 (해설 첫 줄 '동일한 원에 외접'은 '내접'의 오기)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각형 $ABC$와 삼각형 $ABD$가 동일한 원에 내접하므로 사인법칙에 의해 $\dfrac{\overline{BC}}{\sin30^\circ}=\dfrac{\overline{BD}}{\sin60^\circ}$, $\overline{BC}=2\sqrt3$. (①)
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $\angle CBD=\angle CAD=30^\circ$이므로 $\angle ABC=45^\circ+30^\circ=75^\circ$이고 $\angle ACB=180^\circ-(30^\circ+75^\circ)=75^\circ$. 따라서 삼각형 $ABC$는 이등변삼각형이다. $x=\overline{AB}=\overline{AC}$라 하면 코사인법칙에 의해 $(2\sqrt3)^2=2x^2-2x^2\cos30^\circ$, $x^2=12(2+\sqrt3)$. (②)
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        따라서 삼각형 $ABC$의 넓이는 $\dfrac12x^2\sin30^\circ=3(2+\sqrt3)$이다. (③)
      criteria:
      - 1.B3
    - id: 1b-4
      content: |
        $\angle CBD=\angle CDB=30^\circ$이므로 삼각형 $BCD$는 이등변삼각형이고 $\overline{CD}=\overline{BC}$. 따라서 삼각형 $BCD$의 넓이는 $\dfrac12\times6\times2\sqrt3\times\sin30^\circ=3\sqrt3$이다. 두 삼각형은 삼각형 $BCE$를 공유하므로 $S-T=3(2+\sqrt3)-3\sqrt3=6$이다. (④)
      criteria:
      - 1.B4
