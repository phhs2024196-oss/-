stimuli: []
stem: |
  상수 $a$에 대하여 함수
  $$f(x)=\begin{cases}x^3-3ax^2+2ax+1 & (x\le1)\\ -4x+3 & (x>1)\end{cases}$$
  이 실수 전체의 집합에서 연속일 때, $\displaystyle\int_{-1}^{9}f(x)dx-\int_{2}^{9}f(x)dx$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    주어진 정적분의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-7', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $2-a=-1$에서 $a=3$, $\int_{-1}^{1}+\int_{1}^{2}$로 계산.
    steps:
    - id: 1a
      content: $a=3$, $-4-3=-7$
      criteria:
      - 1.M1
      - 1.A1
      - 1.M2
      - 1.A2
    hint_ladder:
    - $x=1$에서 좌극한과 우극한을 맞추자.
    - 두 정적분의 차를 하나의 구간으로 합치자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [E 15] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$가 $x=1$에서 연속이므로 $\lim_{x\to1-}f(x)=\lim_{x\to1+}f(x)=f(1)$. $\lim_{x\to1-}f(x)=\lim_{x\to1-}(x^3-3ax^2+2ax+1)=2-a$, $\lim_{x\to1+}f(x)=\lim_{x\to1+}(-4x+3)=-1$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(1)=2-a$이므로 $a=3$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\displaystyle\int_{-1}^{9}f(x)dx-\int_{2}^{9}f(x)dx=\int_{-1}^{2}f(x)dx=\int_{-1}^{1}f(x)dx+\int_{1}^{2}f(x)dx$
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $\displaystyle\int_{-1}^{1}(x^3-9x^2+6x+1)dx+\int_{1}^{2}(-4x+3)dx=-4-3=-7$
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $x=1$에서 좌극한 $2-a$, 우극한 $-1$을 구해 연속 조건을 세웠다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $a=3$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $\int_{-1}^{2}f(x)dx=\int_{-1}^{1}+\int_{1}^{2}$로 정리했다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $-4-3=-7$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      - 1.A1
      steps:
      - 1b-4
    deductions: []
