intent: |
  제시문의 상황에서 함수가 일대일 대응이 되기 위한 조건이 증가 함수임을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 삼차함수가 일대일이려면 $f'(x)\ge0$이어야 함을 판별식으로 나타낸다.
key_idea: |
  최고차항 계수가 양수인 삼차함수가 일대일 대응 $\iff$ 증가함수 $\iff$ $f'(x)=0$이 중근 또는 허근.
stuck: |
  판별식 조건에서 등호($D=0$)를 빠뜨리기 쉽다.
