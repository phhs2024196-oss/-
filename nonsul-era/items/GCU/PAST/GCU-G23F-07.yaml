stimuli: []
stem: |
  실수 전체의 집합에서 정의된 함수 $f(x)=x^3-mx^2+\left(m+\dfrac43\right)x+5$가 일대일 대응이 되도록 하는 모든 정수 $m$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    모든 정수 $m$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '\{-1,0,1,2,3,4\}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{D}{4}=m^2-3m-4\le0$.
    steps:
    - id: 1a
      content: $-1\le m\le4$, 정수 $-1,0,1,2,3,4$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - 삼차함수가 일대일 대응이 되려면 항상 증가해야 한다.
    - $f'(x)\ge0$이 항상 성립할 조건은?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [F 7] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=3x^2-2mx+\left(m+\dfrac43\right)$. 함수 $f(x)$가 일대일 대응이 되려면 이차방정식 $f'(x)=0$이 중근 또는 허근을 가져야 한다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이차방정식 $3x^2-2mx+\left(m+\dfrac43\right)=0$의 판별식을 $D$라 하면 $\dfrac{D}{4}=m^2-3m-4$이므로 $m^2-3m-4\le0$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $(m+1)(m-4)\le0$에서 $-1\le m\le4$
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        따라서 정수 $m$의 값은 $-1,0,1,2,3,4$.
      criteria:
      - 1.A3
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        일대일 대응 $\iff$ $f'(x)=0$이 중근 또는 허근($f'(x)\ge0$)(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\dfrac{D}{4}=m^2-3m-4\le0$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $-1\le m\le4$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.A1
      - 1.M1
      steps:
      - 1b-3
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        정수 $-1,0,1,2,3,4$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.A2
      - 1.M1
      steps:
      - 1b-4
    deductions: []
