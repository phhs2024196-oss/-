stimuli: []
stem: |
  0이 아닌 두 실수 $a,b$에 대하여 $a^{-3}\times\sqrt{a^4b^{-2}}=3$, $a^{-1}-b^{-1}=-5$일 때, $a^2+b^2$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $a^2+b^2$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\frac{31}{9}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $ab=\tfrac13$, $a-b=\tfrac53$.
    steps:
    - id: 1a
      content: $a^2+b^2=\left(\tfrac53\right)^2+2\cdot\tfrac13=\tfrac{31}{9}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.M2
      - 1.A2
    hint_ladder:
    - 근호를 $\frac12$ 제곱으로 바꾸자.
    - $\dfrac1a-\dfrac1b$를 통분하자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [F 8] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a^{-3}\times\sqrt{a^4b^{-2}}=3$에서 $a^{-3}\times(a^4b^{-2})^{\frac12}=3$, $a^{-1}b^{-1}=3$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\dfrac{1}{ab}=3$에서 $ab=\dfrac13$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $a^{-1}-b^{-1}=-5$에서 $\dfrac1a-\dfrac1b=-5$, $\dfrac{b-a}{ab}=-5$에 $ab=\dfrac13$을 대입하면 $a-b=\dfrac53$
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $a^2+b^2=(a-b)^2+2ab=\left(\dfrac53\right)^2+2\times\dfrac13=\dfrac{31}{9}$
      criteria:
      - 1.A2
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    key_idea: 근호의 부호까지 따지는 엄밀한 풀이
    steps:
    - id: 1c-1
      content: |
        $\sqrt{a^4b^{-2}}=\dfrac{a^2}{\lvert b\rvert}$이므로 $\dfrac{1}{a\lvert b\rvert}=3$, 즉 $a\lvert b\rvert=\dfrac13$이고 $a>0$이다.
      criteria: []
    - id: 1c-2
      content: |
        $b<0$이면 $ab=-\dfrac13$, $\dfrac{b-a}{ab}=-5$에서 $b-a=\dfrac53>0$인데 $b<0<a$이므로 모순. 따라서 $b>0$, $ab=\dfrac13$, $a-b=\dfrac53$이고 $a^2+b^2=\dfrac{31}{9}$.
      criteria: []
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        지수법칙으로 $a^{-1}b^{-1}=3$을 얻었다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $ab=\dfrac13$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $\dfrac{b-a}{ab}=-5$에서 $a-b=\dfrac53$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $(a-b)^2+2ab=\dfrac{31}{9}$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      - 1.A1
      steps:
      - 1b-4
    deductions: []
