intent: |
  제시문의 상황에서 지수법칙과 그 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 거듭제곱근을 유리수 지수로 바꿔 $ab$를 얻고 곱셈공식으로 $a^2+b^2$를 구한다.
key_idea: |
  $a^{-3}\sqrt{a^4b^{-2}}=a^{-1}b^{-1}$ 꼴에서 $ab=\dfrac13$, $\dfrac1a-\dfrac1b=\dfrac{b-a}{ab}$.
stuck: |
  $\sqrt{a^4b^{-2}}=a^2\lvert b\rvert^{-1}$의 부호(학교 해설은 생략) — $b<0$이면 모순이 생겨 결과는 같다.
