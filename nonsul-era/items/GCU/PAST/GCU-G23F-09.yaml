stimuli: []
stem: |
  $0<\theta<\pi$인 $\theta$에 대하여 $\tan\theta+\dfrac{1}{\tan\theta}=-2$일 때, $\dfrac{1}{\cos\theta}-\dfrac{1}{\sin\theta}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\dfrac{1}{\cos\theta}-\dfrac{1}{\sin\theta}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-2\sqrt{2}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\sin\theta\cos\theta=-\tfrac12$, 제2사분면에서 $\sin\theta-\cos\theta=\sqrt2$.
    steps:
    - id: 1a
      content: $\dfrac{\sqrt2}{-1/2}=-2\sqrt2$
      criteria:
      - 1.M1
      - 1.A1
      - 1.M2
      - 1.A2
    hint_ladder:
    - $\tan\theta$를 $\dfrac{\sin\theta}{\cos\theta}$로 바꿔 통분하자.
    - $\tan\theta$의 부호로 $\theta$의 범위를 좁히자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [F 9] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\tan\theta+\dfrac{1}{\tan\theta}=\dfrac{\sin\theta}{\cos\theta}+\dfrac{\cos\theta}{\sin\theta}=\dfrac{1}{\sin\theta\cos\theta}=-2$로부터 $\sin\theta\cos\theta=-\dfrac12$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $(\sin\theta-\cos\theta)^2=1-2\sin\theta\cos\theta=2$.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\tan\theta$와 $\dfrac{1}{\tan\theta}$는 부호가 같으므로 $\theta$의 범위는 $\dfrac{\pi}{2}<\theta<\pi$이고 $\sin\theta>0$, $\cos\theta<0$이다. 따라서 $\sin\theta-\cos\theta=\sqrt2$이다.
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        따라서 $\dfrac{1}{\cos\theta}-\dfrac{1}{\sin\theta}=\dfrac{\sin\theta-\cos\theta}{\sin\theta\cos\theta}=-2\sqrt2$.
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
