intent: |
  제시문의 상황에서 곱으로 이루어진 함수의 연속에 대한 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 합성된 구간별 함수를 $x=0$ 근방에서 식으로 정리해 연속 조건을 세운다.
