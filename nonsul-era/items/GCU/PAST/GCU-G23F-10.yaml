stimuli: []
stem: |
  함수 $f(x)=\begin{cases}2x+a^2 & (x\le-1)\\ -x+2a+1 & (x>-1)\end{cases}$
  에 대하여 함수 $f(x^2)f(2x-1)$이 $x=0$에서 연속이 되도록 하는 실수 $a$의 값의 합을 구하는 과정을 서술하시오
subparts:
- id: '1'
  stem: |
    실수 $a$의 값의 합을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\frac{3}{2}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(x)=f(x^2)f(2x-1)$의 우극한 $(2a+1)(2+2a)$와 $g(0)=(2a+1)(a^2-2)$ 비교.
    steps:
    - id: 1a
      content: $(2a+1)(a^2-2a-4)=0$, 합 $-\tfrac12+2=\tfrac32$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - $x^2$은 항상 $-1$보다 크다.
    - $2x-1\le-1$이 되는 $x$의 범위는?
    - $(2a+1)$을 약분하지 말고 인수로 두자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [F 10] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x^2)=-x^2+2a+1$, $f(2x-1)=\begin{cases}4x-2+a^2 & (x\le0)\\ -2x+2+2a & (x>0)\end{cases}$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $g(x)=f(x^2)f(2x-1)$라 하면 $g(x)=\begin{cases}(-x^2+2a+1)(4x-2+a^2) & (x\le0)\\ (-x^2+2a+1)(-2x+2+2a) & (x>0)\end{cases}$
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\lim_{x\to0+}g(x)=(2a+1)(2+2a)$와 $g(0)=(2a+1)(-2+a^2)$가 같을 때 $x=0$에서 연속이다.
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        즉, $(2a+1)(a^2-2a-4)=0$. 따라서 $a$의 값의 합은 $-\dfrac12+2=\dfrac32$.
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $f(x^2)=-x^2+2a+1$, $f(2x-1)$을 $x\le0$, $x>0$으로 나눠 나타냈다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $g(x)$를 구간별 식으로 정리했다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\lim_{x\to0+}g(x)=(2a+1)(2+2a)$, $g(0)=(2a+1)(a^2-2)$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $(2a+1)(a^2-2a-4)=0$에서 합 $\dfrac32$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      - 1.A1
      steps:
      - 1b-4
    deductions: []
