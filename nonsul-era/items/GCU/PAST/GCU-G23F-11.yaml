stem: |
  $p>0$, $q<0$인 두 정수 $p,q$와 모든 자연수 $n$에 대하여 수열 $\{a_n\}$이 $a_1=30$, $a_{n+1}=a_n+3pn+q$를 만족시킨다. 두 부등식 $a_3>0$, $a_4<0$을 만족시키는 정수 $p,q$의 순서쌍 $(p,q)$를 모두 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    순서쌍 $(p,q)$를 모두 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '(1,-19),\ (1,-18),\ (1,-17),\ (2,-23)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $-15-\tfrac92p<q<-10-6p$가 정수 $q$를 가지려면 $p\le2$.
    steps:
    - id: 1a
      content: $(1,-19),(1,-18),(1,-17),(2,-23)$
      criteria:
      - 1.M1
      - 1.A1
      - 1.M2
      - 1.A2
      - 1.A3
    hint_ladder:
    - $a_2$, $a_3$, $a_4$를 차례로 써 보자.
    - $q$의 범위의 길이를 $p$로 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [F 11] 5. 문항 해설 ('구간 길이 $\ge2$' 서술은 엄밀한 필요조건이 아니므로 $p\ge3$은 직접 확인 권장)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_1=30$, $a_2=30+3p+q$, $a_3=30+9p+2q$, $a_4=30+18p+3q$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a_3=30+9p+2q>0$이므로 $q>-15-\dfrac92p$이고, $a_4=30+18p+3q<0$이므로 $q<-10-6p$이다. 따라서 $-15-\dfrac92p<q<-10-6p$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $-10-6p-\left(-15-\dfrac92p\right)\ge2$가 되어야 한다. 따라서 $p\le2$이므로 가능한 $p=1,2$이다. (참고: $p=3$이면 $-28.5<q<-28$, $p\ge4$이면 구간이 비어 정수 $q$가 없다.)
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        1) $p=1$일 때, $-\dfrac{39}{2}<q<-16$이므로 $q=-19,-18,-17$이다.
      criteria:
      - 1.A2
    - id: 1b-5
      content: |
        2) $p=2$일 때, $-24<q<-22$이므로 $q=-23$이다. 따라서 $(1,-19),(1,-18),(1,-17),(2,-23)$
      criteria:
      - 1.A3
