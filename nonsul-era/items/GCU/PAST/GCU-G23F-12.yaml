  제시문의 상황에서 주어진 조건과 로그함수의 그래프, 그 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 지름의 양 끝이 원의 중심에 대해 대칭임을 이용해 로그값의 부호 반대 조건을 세운다.
