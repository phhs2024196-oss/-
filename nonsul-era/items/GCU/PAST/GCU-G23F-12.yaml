stem: |
  $a>1$인 실수 $a$에 대해 곡선 $y=\log_ax$와 원 $C:\left(x-\dfrac53\right)^2+y^2=\dfrac{17}{9}$의 두 교점을 $P$, $Q$라 하자. 선분 $PQ$가 원 $C$의 지름일 때, $a$의 값을 구하는 다음의 풀이 과정을 완성하시오.

  > 선분 $PQ$가 원 $C$의 지름이므로 선분 $PQ$는 원의 중심 $\left(\dfrac53,0\right)$을 지난다.
  > 따라서 양수 $b$에 대해 점 $P$의 $x$좌표를 $\dfrac53-b$라 할 때,
  > 점 $Q$의 $x$좌표는 [ ① ].
  > 점 $P$와 점 $Q$의 $y$좌표의 부호가 서로 반대임을 이용하면, $b=$ [ ② ].
  > 따라서 점 $Q$의 $y$좌표는 [ ③ ].
  > 점 $Q$는 곡선 $y=\log_ax$와 원 $C$의 교점이므로, $a=$ [ ④ ].
subparts:
- id: '1'
  stem: |
    빈칸 ①, ②, ③, ④를 채워 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '①\ \tfrac{5}{3}+b,\ ②\ \tfrac{4}{3},\ ③\ \tfrac{1}{3},\ ④\ 27', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\left(\tfrac53-b\right)\left(\tfrac53+b\right)=1$에서 $b=\tfrac43$, $Q(3,\tfrac13)$.
    steps:
    - id: 1a
      content: ①$\tfrac53+b$ ②$\tfrac43$ ③$\tfrac13$ ④$27$
      criteria:
      - 1.B1
      - 1.B2
      - 1.B3
      - 1.B4
    hint_ladder:
    - 지름의 양 끝은 중심에 대해 대칭이다.
    - $y$좌표가 서로 반대이면 로그 진수의 곱은?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [F 12] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        선분 $PQ$가 원 $C$의 지름이므로 $PQ$는 원의 중심 $\left(\dfrac53,0\right)$를 지난다. 따라서 두 점 $P$, $Q$의 $x$좌표는 각각 $\dfrac53-b$, $\dfrac53+b$ $(b>0)$이다. (①)
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $y$좌표는 부호가 반대이므로 $\log_a\left(\dfrac53+b\right)=-\log_a\left(\dfrac53-b\right)=\log_a\left(\dfrac53-b\right)^{-1}$이고 $\left(\dfrac53-b\right)\left(\dfrac53+b\right)=1$로부터 $b=\dfrac43$. (②)
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        따라서 $Q$의 $x$좌표는 3이고 이를 원의 방정식에 대입하면 $Q$의 $y$좌표는 $\dfrac13$. (③)
      criteria:
      - 1.B3
    - id: 1b-4
      content: |
        $Q$는 교점이므로 $\log_a3=\dfrac13$. 따라서 $a=27$. (④)
      criteria:
      - 1.B4
