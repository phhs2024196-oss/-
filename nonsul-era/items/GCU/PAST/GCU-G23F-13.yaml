stimuli: []
stem: |
  두 연속 함수 $f(x),g(x)$가
  $$\lim_{x\to2}\frac{f(x)-4}{x-2}=2,\quad\lim_{x\to2}\frac{g(x)+2}{x-2}=-1$$
  을 만족시킬 때, $\displaystyle\lim_{x\to2}\frac{f(x)g(x)+8}{x^2-4}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    극한값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $fg+8=(x-2)^2FG-2(x-2)F+4(x-2)G$.
    steps:
    - id: 1a
      content: $\dfrac{-2F(2)+4G(2)}{4}=-2$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - $f(x)-4$를 $(x-2)$와 다른 함수의 곱으로 써 보자.
    - 분모 $x^2-4=(x-2)(x+2)$.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [F 13] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\lim_{x\to2}\dfrac{f(x)-4}{x-2}=2$이므로 $f(x)-4=(x-2)F(x)$이고 $F(2)=2$. $\lim_{x\to2}\dfrac{g(x)+2}{x-2}=-1$이므로 $g(x)+2=(x-2)G(x)$이고 $G(2)=-1$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 $f(x)=(x-2)F(x)+4$, $g(x)=(x-2)G(x)-2$이므로 $f(x)g(x)=(x-2)^2F(x)G(x)-2(x-2)F(x)+4(x-2)G(x)-8$.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 $\displaystyle\lim_{x\to2}\frac{f(x)g(x)+8}{x^2-4}=\lim_{x\to2}\frac{(x-2)^2F(x)G(x)-2(x-2)F(x)+4(x-2)G(x)}{(x-2)(x+2)}$
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $\displaystyle=-\lim_{x\to2}\frac{2F(x)-4G(x)}{x+2}=-2$
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
