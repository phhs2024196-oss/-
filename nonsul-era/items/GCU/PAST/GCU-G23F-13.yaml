      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        극한값 $-2$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      - 1.A1
      steps:
