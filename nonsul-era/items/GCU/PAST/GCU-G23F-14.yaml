stimuli: []
stem: |
  최고차항의 계수가 3인 이차함수 $f(x)$는 $x=3$에서 극값을 갖고, 모든 실수 $x$에 대하여
  $$g(x)=(1-x)f(x)+\int_1^xf(t)dt$$
  를 만족시킨다. 곡선 $y=\lvert g(x)\rvert$와 직선 $y=kx$가 서로 다른 세 점에서 만나도록 하는 실수 $k$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    실수 $k$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '12\sqrt{3}-18', equivalents: ['-18+12\sqrt{3}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(x)=-2x^3+12x^2-18x+8=-2(x-1)^2(x-4)$, 원점 접선 $t=1+\sqrt3$.
    steps:
    - id: 1a
      content: $k=g'(1+\sqrt3)=-18+12\sqrt3$
      criteria:
      - 1.M1
      - 1.A1
      - 1.M2
      - 1.A2
    hint_ladder:
    - $g'(x)$를 계산하면 $\int$ 부분이 정리된다.
    - $g(1)$의 값은?
    - $\lvert g\rvert$의 그래프를 그려 원점에서 직선을 돌려 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [F 14] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        이차함수의 최고차항이 3이고, $x=3$에서 극값을 갖기 때문에 $f'(x)=6(x-3)$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $g'(x)=(1-x)f'(x)$이므로 $g'(x)=-6(x-1)(x-3)$. $g(x)=-2x^3+12x^2-18x+C$이고 $g(1)=0$이므로 $C=8$.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        곡선 $y=g(x)$ 위 점 $(t,g(t))$ $(t>0)$에서의 접선의 방정식은 $y-g(t)=g'(t)(x-t)$. 원점을 지나므로 $-g(t)=g'(t)(-t)$ 즉 $2t^3-12t^2+18t-8=6t^3-24t^2+18t$, 이 식은 $4(t-1)(t^2-2t-2)=0$이고 $t=1,1+\sqrt3$를 만족하지만, 세 점을 지나기 위해서는 $t=1+\sqrt3$이다.
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $t=1+\sqrt3$에서의 직선의 기울기는 $g'(1+\sqrt3)$이므로 $g'(1+\sqrt3)=-18+12\sqrt3$.
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $f'(x)=6(x-3)$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $g'(x)=-6(x-1)(x-3)$, $g(x)=-2x^3+12x^2-18x+8$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        원점을 지나는 접선 조건 $4(t-1)(t^2-2t-2)=0$에서 $t=1+\sqrt3$ 선택(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $k=-18+12\sqrt3$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      steps:
      - 1b-4
    deductions: []
