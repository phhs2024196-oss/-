intent: |
  제시문의 상황에서 정적분의 활용의 곡선으로 둘러싸인 도형의 넓이를 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 절댓값을 풀어 $x$축과의 교점을 찾고 넓이를 구간별로 적분한다.
key_idea: |
  $x^2-5x\ge0$이면 $y=x^2-10x+9$, $x^2-5x<0$이면 $y=-x^2+9$; $x$축과의 교점은 $3$과 $9$.
stuck: |
  각 식의 근이 그 식이 적용되는 범위 안에 있는지 확인하는 것($x=1$, $x=-3$은 제외).
