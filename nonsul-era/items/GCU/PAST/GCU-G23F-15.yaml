stimuli: []
stem: |
  곡선 $y=\lvert x^2-5x\rvert-5x+9$와 $x$축으로 둘러싸인 부분의 넓이의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    넓이의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\frac{172}{3}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 교점 $3$, $9$; $[3,5]$와 $[5,9]$로 나눠 적분.
    steps:
    - id: 1a
      content: $\tfrac{44}{3}+\tfrac{128}{3}=\tfrac{172}{3}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.M2
      - 1.A2
    hint_ladder:
    - $x^2-5x$의 부호에 따라 식을 나누자.
    - 각 식의 근이 그 범위 안에 있는지 확인하자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 자체평가 보고서(2023) 문항카드 [F 15] 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\lvert x^2-5x\rvert-5x+9$라 하자. $x^2-5x\ge0$일 때, $f(x)=x^2-10x+9$. 마찬가지로 $x^2-5x<0$일 때, $f(x)=-x^2+9$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 $x$축과의 교점은 9 ($x^2-5x\ge0$ 부분)와 3 ($x^2-5x<0$ 부분)이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        둘러싸인 넓이 $S$는 $\displaystyle S=\int_3^9\lvert f(x)\rvert dx=\int_3^5(x^2-9)dx+\int_5^9(-x^2+10x-9)dx$
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $=\dfrac{44}{3}+\dfrac{128}{3}=\dfrac{172}{3}$
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        절댓값을 풀어 $x^2-10x+9$와 $-x^2+9$로 나눴다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $x$축과의 교점 $x=3$, $x=9$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $\int_3^5(x^2-9)dx+\int_5^9(-x^2+10x-9)dx$를 세웠다(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        넓이 $\dfrac{172}{3}$(학교 채점기준 미수록: 문항카드 해설 단계로 배분).
      depends_on:
      - 1.M2
      steps:
      - 1b-4
    deductions: []
