intent: |
  제시문의 상황에서 삼각함수의 성질을 이용하여 식을 정리할 수 있는지를 평가한다(문항카드 출제 의도 원문). $\sin\theta+\cos\theta$를 제곱해 $\sin\theta\cos\theta$를 구하고 $(\sin\theta-\cos\theta)^2$으로 연결한다.
key_idea: |
  $(\sin\theta\pm\cos\theta)^2=1\pm2\sin\theta\cos\theta$이므로 합의 제곱에서 곱을 얻고, 곱으로 차의 제곱을 구한다.
stuck: |
  $\sin^2\theta+\cos^2\theta=1$을 써서 교차항 $2\sin\theta\cos\theta$만 남기는 정리를 떠올리지 못하거나, 차의 제곱에서 부호를 틀린다.
