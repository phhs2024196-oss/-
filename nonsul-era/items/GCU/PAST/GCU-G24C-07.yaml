stimuli: []

stem: |
  $\sin\theta+\cos\theta=\dfrac{1}{2}$일 때, $\lvert\sin\theta-\cos\theta\rvert$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\lvert\sin\theta-\cos\theta\rvert$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{\sqrt7}{2}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      합을 제곱해 $2\sin\theta\cos\theta=-\tfrac34$, 차의 제곱은 $1-2\sin\theta\cos\theta=\tfrac74$.
    steps:
    - id: 1a
      content: |
        $2\sin\theta\cos\theta=-\dfrac34\Rightarrow\lvert\sin\theta-\cos\theta\rvert^2=\dfrac74\Rightarrow\lvert\sin\theta-\cos\theta\rvert=\dfrac{\sqrt7}{2}$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '주어진 식의 양변을 제곱해 보자.'
    - '$(\sin\theta-\cos\theta)^2$을 $\sin\theta\cos\theta$로 나타내 보자.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [C 7] 5. 문항 해설(PDF 280~281쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sin\theta+\cos\theta=\dfrac12$의 양변을 제곱하면
        $\sin^2\theta+2\sin\theta\cos\theta+\cos^2\theta=\dfrac14$, $1+2\sin\theta\cos\theta=\dfrac14$이므로 $2\sin\theta\cos\theta=-\dfrac34$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\lvert\sin\theta-\cos\theta\rvert^2=(\sin\theta-\cos\theta)^2=1-2\sin\theta\cos\theta=1+\dfrac34=\dfrac74$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 $\lvert\sin\theta-\cos\theta\rvert=\dfrac{\sqrt7}{2}$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $2\sin\theta\cos\theta=-\dfrac34$ (또는 $\sin\theta=\dfrac14\mp\dfrac{\sqrt7}{4}$)(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $\lvert\sin\theta-\cos\theta\rvert^2=\dfrac74$ (또는 $\cos\theta=\dfrac14\pm\dfrac{\sqrt7}{4}$)(채점기준 4점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $\lvert\sin\theta-\cos\theta\rvert=\dfrac{\sqrt7}{2}$(채점기준 2점).
      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-3]
    deductions: []
