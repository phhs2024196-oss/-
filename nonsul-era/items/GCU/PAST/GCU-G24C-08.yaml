stimuli: []

stem: |
  함수 $f(x)$가 실수 전체의 집합에서 연속이고 모든 실수 $x$에 대하여
  $$(x-2)(x+1)f(x)=(x-2)(x^3+ax+b)$$
  를 만족시킨다. $f(2)=1$일 때, $f(-1)$의 값을 구하는 다음의 풀이 과정을 완성하시오. (단, $a$, $b$는 상수이다.)

  [풀이 과정 상자] $x\neq-1$, $x\neq2$일 때, $f(x)=\dfrac{x^3+ax+b}{x+1}$이고 $f(x)$는 $x=2$에서 연속이므로 $\displaystyle\lim_{x\to2}f(x)=f(2)$이다. 즉, $\displaystyle\lim_{x\to2}\dfrac{x^3+ax+b}{x+1}=1$이므로 $\boxed{\ ①\ }=0$. 또한, 함수 $f(x)$는 $x=-1$에서도 연속이므로 $\displaystyle\lim_{x\to-1}f(x)=f(-1)$이다. 따라서 $\boxed{\ ②\ }=0$. $a$와 $b$를 구하면 $(a,b)=\boxed{\ ③\ }$이므로 $f(-1)=\boxed{\ ④\ }$.

subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 $f(-1)$의 값을 구하는 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $x=2$에서 $\dfrac{8+2a+b}{3}=1$, $x=-1$에서 분자 $-1-a+b=0$; 연립하면 $a=-2,\ b=-1$.
    steps:
    - id: 1a
      content: |
        ① $2a+b+5$, ② $a-b+1$, ③ $(-2,-1)$, ④ $f(-1)=\lim_{x\to-1}(x^2-x-1)=1$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '$x=2$에서의 연속을 $\lim_{x\to2}\dfrac{x^3+ax+b}{x+1}=1$로 써 보자.'
    - '$x\to-1$일 때 분모가 0으로 간다. 극한값이 존재하려면 분자는?'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [C 8] 5. 문항 해설(PDF 282~283쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x\neq-1,\ x\neq2$일 때 $f(x)=\dfrac{x^3+ax+b}{x+1}$이다. 함수 $f(x)$는 $x=2$에서 연속이므로 $\displaystyle\lim_{x\to2}f(x)=f(2)$, 즉 $\displaystyle\lim_{x\to2}\dfrac{x^3+ax+b}{x+1}=1$이므로 $2a+b=-5$. (① $2a+b+5$)
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        함수 $f(x)$는 $x=-1$에서도 연속이므로 $\displaystyle\lim_{x\to-1}f(x)=f(-1)$이다. $\displaystyle\lim_{x\to-1}\dfrac{x^3+ax+b}{x+1}=f(-1)$이고 극한값이 존재하므로 $-1-a+b=0$, 즉 $a-b=-1$이다. (② $a-b+1$)
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        이를 $2a+b=-5$와 연립해서 풀면 $a=-2$, $b=-1$. (③ $(-2,-1)$)
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        따라서 $f(-1)=\displaystyle\lim_{x\to-1}\dfrac{x^3-2x-1}{x+1}=\lim_{x\to-1}\dfrac{(x+1)(x^2-x-1)}{x+1}=\lim_{x\to-1}(x^2-x-1)=1$ (④ $1$)
      criteria: ['1.A2']
