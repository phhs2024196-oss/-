intent: |
  제시문의 상황에서 함수의 연속을 이용하여 단계별로 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 연속 조건을 극한값 존재 조건(분모 $\to0$이면 분자 $\to0$)으로 바꿔 미정계수를 정한다.
key_idea: |
  $x\neq-1,\ 2$에서 $f(x)=\dfrac{x^3+ax+b}{x+1}$이고, $x=2$·$x=-1$에서의 연속을 각각 극한 조건으로 쓴다.
stuck: |
  $x=-1$에서 분모가 0이 되므로 극한값이 존재하려면 분자도 0이어야 한다는 조건을 떠올려야 한다.
