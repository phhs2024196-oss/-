stimuli: []

stem: |
  다항함수 $f(x)$에 대하여 $2(x+1)f(x)$의 한 부정적분을 $G(x)$라 할 때, 함수 $G(x)$는 모든 실수 $x$에 대하여
  $$G(x)=(x+1)^2f(x)-x^4-4x^3-6x^2-4x$$
  를 만족시킨다. $G(0)=-2$일 때, $f(1)$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $f(1)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      양변을 미분해 $G'=2(x+1)f$와 비교하면 $f'(x)=4(x+1)$, $f(x)=2x^2+4x+C$, $G(0)=f(0)=-2$.
    steps:
    - id: 1a
      content: |
        $(x+1)^2f'(x)=4(x+1)^3\Rightarrow f'(x)=4(x+1)\Rightarrow f(x)=2x^2+4x-2\Rightarrow f(1)=4$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$G(x)$가 $2(x+1)f(x)$의 부정적분이라는 것을 미분 등식으로 써 보자.'
    - '주어진 등식을 미분하면 $2(x+1)f(x)$가 양변에 나타난다.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [C 9] 5. 문항 해설(PDF 284~285쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $2(x+1)f(x)$의 한 부정적분이 $G(x)$이므로, $G'(x)=2(x+1)f(x)$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $G(x)=(x+1)^2f(x)-x^4-4x^3-6x^2-4x$의 양변을 $x$에 대해 미분하면
        $G'(x)=2(x+1)f(x)+(x+1)^2f'(x)-4x^3-12x^2-12x-4$
        따라서 $(x+1)^2f'(x)=4x^3+12x^2+12x+4=4(x+1)^3$
        $f(x)$는 다항함수이므로 $f'(x)=4(x+1)$이고, $f(x)=2x^2+4x+C$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $G(0)=f(0)=-2$이므로 $f(x)=2x^2+4x-2$
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $f(1)=4$이다. [참고] $G(x)=x^4+4x^3+2x^2-4x-2$
      criteria: ['1.A3']
