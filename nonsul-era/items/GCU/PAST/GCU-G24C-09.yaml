intent: |
  제시문의 상황에서 부정적분을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 부정적분의 정의 $G'=2(x+1)f$와 주어진 등식의 미분을 비교해 $f'(x)$를 얻고 적분상수를 $G(0)$으로 정한다.
key_idea: |
  $G'(x)=2(x+1)f(x)$를 주어진 등식의 양변 미분과 비교하면 $(x+1)^2f'(x)=4(x+1)^3$이 된다.
stuck: |
  부정적분의 정의를 미분 등식으로 바꾸는 것, 그리고 $G(0)=f(0)$으로 적분상수를 정하는 것.
