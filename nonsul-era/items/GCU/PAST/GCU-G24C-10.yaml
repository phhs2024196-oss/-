stimuli: []

stem: |
  양수 $k$와 사차함수 $f(x)=x^4+\dfrac{8}{3}kx^3-6k^2x^2+3$에 대하여 다음 조건을 만족시키는 실수 $a$의 범위와 실수 $b$의 값을 구하는 과정을 서술하시오.

  (가) 곡선 $y=f(x)$와 직선 $y=a$는 서로 다른 두 점에서 만난다.
  (나) 곡선 $y=f(x)$와 직선 $y=b$는 서로 다른 세 점에서 만난다.

subparts:
- id: '1'
  stem: |
    조건 (가)를 만족시키는 실수 $a$의 범위와 조건 (나)를 만족시키는 실수 $b$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: 'a>3\ \text{또는}\ -45k^4+3<a<-\dfrac73k^4+3;\quad b=3\ \text{또는}\ b=-\dfrac73k^4+3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      극소 $-45k^4+3$, 극대 $3$, 극소 $-\tfrac73k^4+3$을 그려 두 점·세 점이 되는 높이를 읽는다.
    steps:
    - id: 1a
      content: |
        $f'(x)=4x(x+3k)(x-k)$, 극소 $f(-3k)=-45k^4+3<f(k)=-\tfrac73k^4+3$, 극대 $f(0)=3$ → $a>3$ 또는 $f(-3k)<a<f(k)$; $b=3$ 또는 $b=f(k)$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$f''(x)$를 인수분해해 극값을 모두 구하자.'
    - '두 극솟값 중 어느 쪽이 더 낮은지 비교하고 그래프를 그려 보자.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [C 10] 5. 문항 해설(PDF 286~287쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^4+\dfrac83kx^3-6k^2x^2+3$에서 $f'(x)=4x^3+8kx^2-12k^2x=4x(x+3k)(x-k)$
        $f'(x)=0$에서 $x=-3k$ 또는 $x=0$ 또는 $x=k$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        함수 $f(x)$는 $x=-3k$와 $x=k$에서 극소이고 $x=0$에서 극대이다.
        $f(-3k)=81k^4-72k^4-54k^4+3=-45k^4+3$
        $f(k)=k^4+\dfrac83k^4-6k^4+3=-\dfrac73k^4+3$으로 $f(-3k)<f(k)$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        곡선 $y=f(x)$와 서로 다른 두 점에서 만나기 위해서는 $a>f(0)=3$ 또는 $f(-3k)<a<f(k)$, 즉 $-45k^4+3<a<-\dfrac73k^4+3$.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        곡선 $y=f(x)$와 서로 다른 세 점에서 만나기 위해서는 $b=3$ 또는 $b=-\dfrac73k^4+3$을 만족해야 한다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $f'(x)=4x^3+8kx^2-12k^2x=4x(x+3k)(x-k)$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $x=-3k$와 $x=k$에서 극소이고 $x=0$에서 극대(채점기준 2점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        ($a$ 조건) $a>3$ 또는 $-45k^4+3<a<-\dfrac73k^4+3$(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 3
      evidence: |
        ($b$ 조건) $b=3$ 또는 $b=-\dfrac73k^4+3$(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-4]
    deductions: []
