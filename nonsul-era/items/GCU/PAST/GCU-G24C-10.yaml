    detect_cue: '$a$ 조건이 하나의 구간만 있다'
    feedback: '극댓값 3보다 높은 수평선도 사차함수의 바깥 두 가지와 두 점에서 만납니다. 수평선을 아래에서 위로 움직이며 모두 세어 보세요.'
    remedy: [RL-1]
  - id: MC-CAL-8405
    outcome_code: '72'
    wrong_work: '세 점에서 만나는 $b$로 $f(k)$만 쓰고 극댓값 $b=3$(접점 $x=0$)을 빠뜨림'
    detect_cue: '$b$의 값이 하나뿐이다'
    feedback: '극대점에서 접하는 수평선도 다른 두 점과 함께 세 점에서 만납니다.'
