intent: |
  제시문의 상황에서 주어진 조건과 함수의 극대, 극소를 이용하여 방정식을 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 사차함수의 극값 세 개의 대소를 비교해 수평선과의 교점 개수를 분류한다.
key_idea: |
  $f'(x)=4x(x+3k)(x-k)$에서 극소 $f(-3k)=-45k^4+3$, 극대 $f(0)=3$, 극소 $f(k)=-\tfrac73k^4+3$이고 $f(-3k)<f(k)$이므로 그래프 개형으로 교점 수를 센다.
stuck: |
  두 극솟값의 대소를 비교해 '두 점'과 '세 점'이 되는 높이를 빠짐없이 분류하는 것($a>3$ 쪽과 $b=3$을 놓치기 쉬움).
