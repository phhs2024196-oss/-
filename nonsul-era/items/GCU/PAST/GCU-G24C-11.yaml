  제시문의 상황에서 주어진 식과 정적분을 이용하여 단계별로 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 구간별 함수의 연속 조건으로 상수를 정하고 주기 5를 이용해 적분 구간을 옮긴다.
