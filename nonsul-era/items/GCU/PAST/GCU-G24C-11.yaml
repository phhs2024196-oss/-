stimuli: []

stem: |
  실수 전체의 집합에서 연속인 함수
  $$f(x)=\begin{cases}ax^3+8 & (-2\le x<0)\\ -4x+b & (0\le x<1)\\ \dfrac{b}{8}x^2-6x+9a & (1\le x<3)\end{cases}$$
  이 모든 실수 $x$에 대하여 $f\left(x-\dfrac52\right)=f\left(x+\dfrac52\right)$를 만족시킨다. $\displaystyle\int_{-2}^{5}f(x)\,dx$의 값을 구하는 다음의 풀이 과정을 완성하시오. (단, $a$, $b$는 상수이다.)

  [풀이 과정 상자] 함수 $f(x)$가 실수 전체의 집합에서 연속이므로 $a$의 값은 $\boxed{\ ①\ }$이고, $b$의 값은 $\boxed{\ ②\ }$이다. 또한, $\displaystyle\int_{-2}^{3}f(x)\,dx$의 값이 $\boxed{\ ③\ }$이고, 함수 $f(x)$가 $f\left(x-\dfrac52\right)=f\left(x+\dfrac52\right)$를 만족하므로 $\displaystyle\int_{-2}^{5}f(x)\,dx$의 값은 $\boxed{\ ④\ }$이다.

subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 $\int_{-2}^{5}f(x)\,dx$의 값을 구하는 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{98}{3}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $x=0$에서 $b=8$, $x=1$에서 $4=-5+9a$로 $a=1$; $\int_{-2}^3f=\tfrac{62}{3}$, 주기 5로 $\int_3^5f=\int_{-2}^0f=12$.
    steps:
    - id: 1a
      content: |
        ① $1$, ② $8$, ③ $\dfrac{62}{3}$, ④ $\dfrac{62}{3}+12=\dfrac{98}{3}$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '$x=0$과 $x=1$에서 좌극한과 우극한을 같게 놓자.'
    - '$x-\tfrac52=t$로 두면 $f(t)=f(t+5)$이다. $\int_3^5$를 어디로 옮길 수 있을까?'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [C 11] 5. 문항 해설(PDF 288~289쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$가 실수 전체의 집합에서 연속이므로 $x=0$, $x=1$에서 연속이다.
        $\displaystyle\lim_{x\to0-}f(x)=\lim_{x\to0+}f(x)=f(0)$, 즉 $\displaystyle\lim_{x\to0-}(ax^3+8)=\lim_{x\to0+}(-4x+b)=b$이고 $\therefore b=8$
      criteria: ['1.M2']
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to1-}f(x)=\lim_{x\to1+}f(x)=f(1)$, 즉 $\displaystyle\lim_{x\to1-}(-4x+8)=\lim_{x\to1+}(x^2-6x+9a)=-5+9a$이고 $4=-5+9a$ $\therefore a=1$
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        따라서 $f(x)=\begin{cases}x^3+8 & (-2\le x<0)\\ -4x+8 & (0\le x<1)\\ x^2-6x+9 & (1\le x<3)\end{cases}$이다.
        $\displaystyle\int_{-2}^{3}f(x)\,dx=\int_{-2}^{0}f(x)\,dx+\int_{0}^{1}f(x)\,dx+\int_{1}^{3}f(x)\,dx=12+6+\dfrac83=\dfrac{62}{3}$
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $\displaystyle\int_{-2}^{5}f(x)\,dx=\int_{-2}^{3}f(x)\,dx+\int_{3}^{5}f(x)\,dx$, $f\left(x-\dfrac52\right)=f\left(x+\dfrac52\right)$는 $f(x)=f(x+5)$이므로 $f(x)$는 주기가 5인 주기함수이다.
        $\displaystyle\int_{3}^{5}f(x)\,dx=\int_{-2}^{0}f(x)\,dx=12$. $\therefore\displaystyle\int_{-2}^{5}f(x)\,dx=\int_{-2}^{3}f(x)\,dx+\int_{3}^{5}f(x)\,dx=\dfrac{98}{3}$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
