stimuli: []

stem: |
  $a>\dfrac{3}{2}$일 때, 실수 전체의 집합에서 증가하고 연속인 함수 $f(x)$가 모든 실수 $x$에 대하여
  $$f(-x)=-f(x),\quad f(x)=f(x-2)+4a$$
  를 만족시킨다. 곡선 $y=f(x)$와 $x$축 및 직선 $x=1$로 둘러싸인 부분의 넓이가 $3$이고 $\displaystyle\int_{1}^{4}f(x)\,dx=45$일 때, $a$의 값을 구하는 다음의 풀이 과정을 완성하시오.

  [풀이 과정 상자] $f(1)$의 값을 $a$로 표현하면 $\boxed{\ ①\ }$이다. 곡선 $y=f(x-2)+4a$는 곡선 $y=f(x)$를 $x$축의 방향으로 $2$만큼, $y$축의 방향으로 $4a$만큼 평행이동한 곡선과 일치한다. 따라서 $f(4)$의 값을 $a$로 표현하면 $\boxed{\ ②\ }$이다. 또한, 곡선 $y=f(x)$와 $y$축 및 직선 $y=-2a$로 둘러싸인 부분의 넓이를 $a$로 표현하면 $\boxed{\ ③\ }$이다. $\displaystyle\int_{1}^{4}f(x)\,dx=45$이므로 $a$의 값은 $\boxed{\ ④\ }$이다.

subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 $a$의 값을 구하는 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(1)=2a$, $f(4)=8a$; $[-1,0]$ 쪽 넓이 $2a-3$; $\int_1^4f=(4a-3)+(4a+3)+(8a-3)=16a-3=45$.
    steps:
    - id: 1a
      content: |
        ① $2a$, ② $8a$, ③ $2a-3$, ④ $16a-3=45\Rightarrow a=3$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '$f(x)=f(x-2)+4a$에 $x=1$을 대입하고 $f(-1)=-f(1)$을 쓰자.'
    - '$[1,2]$, $[2,3]$, $[3,4]$의 그래프는 각각 $[-1,0]$, $[0,1]$, $[1,2]$의 그래프를 평행이동한 것이다.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [C 12] 5. 문항 해설(PDF 291쪽) = 「2024학년도 논술전형 답안지(자연).hwp」 문제 12(자연D)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(-x)=-f(x)$이므로 원점 대칭이다. 즉, $f(0)=0$. $f(-x)=-f(x)$와 $f(x)=f(x-2)+4a$에 $x=1$을 대입하고 $f(1)=2a$이다. (① $2a$)
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        곡선 $y=f(x-2)+4a$는 곡선 $y=f(x)$를 $x$축의 방향으로 2만큼, $y$축의 방향으로 $4a$만큼 평행이동한 곡선과 일치한다. 따라서 $f(2)=f(0)+4a=4a$, $f(3)=f(1)+4a=6a$, $f(4)=f(2)+4a=8a$. (② $8a$)
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        곡선 $y=f(x)$와 $x$축 및 직선 $x=1$로 둘러싸인 부분의 넓이가 3이고 원점 대칭($f(-1)=-2a$)과 증가함수인 성질을 이용하면, 곡선 $y=f(x)$와 $y$축 및 직선 $y=-2a$로 둘러싸인 부분의 넓이는 $2a-3$이다. (③ $2a-3$)
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $\displaystyle\int_1^4f(x)\,dx=\int_1^2f(x)\,dx+\int_2^3f(x)\,dx+\int_3^4f(x)\,dx$이고,
        $\displaystyle\int_1^2f(x)\,dx+\int_2^3f(x)\,dx+\int_3^4f(x)\,dx=(2a+2a-3)+(4a+3)+(6a+2a-3)$이므로
        $(2a+2a-3)+(4a+3)+(6a+2a-3)=16a-3=45$. 따라서, $a$의 값은 $3$. (④ $3$)
      criteria: ['1.A2']
