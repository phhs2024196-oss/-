intent: |
  제시문의 상황에서 주어진 조건과 정적분을 이용하여 문제를 해결할 수 있는 지를 평가한다(문항카드 출제 의도 원문). 기함수의 대칭과 평행이동 관계 $f(x)=f(x-2)+4a$로 $[1,4]$의 정적분을 $[0,1]$의 넓이와 $a$로 나타낸다.
key_idea: |
  $f(1)=2a$, $f(2)=4a$, $f(3)=6a$, $f(4)=8a$이고, 각 구간 $[n,n+1]$의 정적분을 넓이 3과 직사각형 넓이로 쪼개어 $16a-3$을 얻는다.
stuck: |
  $x=1$을 대입해 $f(1)=f(-1)+4a=-f(1)+4a$로 $f(1)=2a$를 얻는 것과, $[-1,0]$ 부분의 넓이를 직사각형에서 빼서 $2a-3$으로 표현하는 것.
