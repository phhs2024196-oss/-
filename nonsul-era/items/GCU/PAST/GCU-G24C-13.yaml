intent: |
  제시문의 상황에서 함수의 극한과 연속에 대한 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 부등식 양변에 $x^2$, $\dfrac1x$을 곱해 함수의 극한의 대소 관계(조임)로 $a$와 $\lim\dfrac{f(x)}{x}$를 구한다.
key_idea: |
  $\dfrac{9x}{2}-2\le x^2f(x)\le(3x-2)^2$에서 양끝 극한이 같아지는 $a=\tfrac43$을 찾고, $\dfrac{f(x)}{x}$를 같은 방식으로 조여 $0$으로 보낸다.
stuck: |
  $x^2f(x)$의 극한이 4가 되려면 양쪽 경계식의 극한이 모두 4인 점을 찾아야 한다는 발상, 그리고 분자·분모를 $x$로 나눠 $\dfrac{f(x)}{x}$를 만드는 것.
