      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $\displaystyle\lim_{x\to\infty}\frac{f(x)}{x}=0$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\displaystyle\lim_{x\to\infty}\frac{ax-f(x)}{2f(x)+3x}=\frac49$(채점기준 3점).
      depends_on: [1.A1, 1.M2]
      implied_ok: false
      steps: [1b-4]
    deductions: []
