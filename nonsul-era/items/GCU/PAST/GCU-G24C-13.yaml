stimuli: []

stem: |
  양의 실수 전체의 집합에서 정의된 함수 $f(x)$가 모든 양의 실수 $x$에 대하여
  $$\frac{9}{2x}-\frac{2}{x^2}\le f(x)\le\left(3-\frac{2}{x}\right)^2$$
  을 만족시킨다. $\displaystyle\lim_{x\to a}x^2f(x)=4$를 만족시키는 양수 $a$에 대해 $\displaystyle\lim_{x\to\infty}\frac{ax-f(x)}{2f(x)+3x}$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{x\to\infty}\frac{ax-f(x)}{2f(x)+3x}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac49', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $x^2$을 곱한 부등식의 양끝이 $x=\tfrac43$에서 모두 4, $\dfrac{f(x)}{x}\to0$이므로 극한은 $\dfrac{a}{3}=\dfrac49$.
    steps:
    - id: 1a
      content: |
        $a=\dfrac43$, $\lim_{x\to\infty}\dfrac{f(x)}{x}=0\Rightarrow\lim\dfrac{a-\frac{f(x)}{x}}{2\frac{f(x)}{x}+3}=\dfrac{a}{3}=\dfrac49$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2']
    hint_ladder:
    - '부등식의 각 변에 $x^2$을 곱해 보자.'
    - '구하는 극한의 분자·분모를 $x$로 나누면 어떤 극한이 필요한가?'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [C 13] 5. 문항 해설(PDF 292~293쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\dfrac{9}{2x}-\dfrac{2}{x^2}\le f(x)\le\left(3-\dfrac2x\right)^2$으로부터 $\dfrac{9x}{2}-2\le x^2f(x)\le(3x-2)^2$. 따라서
        $\displaystyle\lim_{x\to\frac43}\left(\frac{9x}{2}-2\right)=\lim_{x\to\frac43}(3x-2)^2=4$이므로 $\displaystyle\lim_{x\to\frac43}x^2f(x)=4$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $a=\dfrac43$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        또한, $\dfrac{\frac{9x}{2}-2}{x^3}\le\dfrac{f(x)}{x}\le\dfrac{(3x-2)^2}{x^3}$이고 $\displaystyle\lim_{x\to\infty}\frac{\frac{9x}{2}-2}{x^3}=0=\lim_{x\to\infty}\frac{(3x-2)^2}{x^3}$이므로 $\displaystyle\lim_{x\to\infty}\frac{f(x)}{x}=0$.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        따라서 $\displaystyle\lim_{x\to\infty}\frac{ax-f(x)}{2f(x)+3x}=\lim_{x\to\infty}\frac{a-\frac{f(x)}{x}}{2\frac{f(x)}{x}+3}=\frac49$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
