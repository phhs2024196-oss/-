stimuli: []

stem: |
  두 실수 $x$, $y$에 대하여 $\dfrac{1}{9x}+\dfrac{1}{2y}=\dfrac{1}{2}$이고 $512^{x}=144^{y}$일 때, $x=p\log_{2}24$, $y=q\log_{12}24$이다. $p$, $q$ 그리고 $9x\log_{24}2+y\log_{24}12$의 값을 각각 구하는 과정을 서술하시오. (단, $p$, $q$는 유리수이다.)

subparts:
- id: '1'
  stem: |
    $p$, $q$ 그리고 $9x\log_{24}2+y\log_{24}12$의 값을 각각 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: 'p=\dfrac29,\ q=1,\ 9x\log_{24}2+y\log_{24}12=3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $k=512^x=144^y$에서 $2\cdot12=k^{\frac1{9x}+\frac1{2y}}=k^{\frac12}$, $k=576$; $x=\log_{512}576$, $y=\log_{144}576$.
    steps:
    - id: 1a
      content: |
        $k=576\Rightarrow x=\dfrac29\log_2 24,\ y=\log_{12}24\Rightarrow p=\dfrac29,\ q=1$, 값 $=2+1=3$
      criteria: ['1.M1', '1.A2', '1.A3']
    hint_ladder:
    - '$512^x=144^y=k$로 두고 $2$, $12$를 $k$의 거듭제곱으로 나타내 보자.'
    - '$\frac1{9x}+\frac1{2y}=\frac12$를 지수에 쓰려면 두 식을 곱하자.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [C 14] 5. 문항 해설(PDF 294~295쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $512^x=144^y=k\ (k>0)$이라 하자. $512^x=k$에서 $2^{9x}=k$, $2=k^{\frac{1}{9x}}$. $144^y=k$에서 $12^{2y}=k$, $12=k^{\frac{1}{2y}}$.
        $\dfrac1{9x}+\dfrac1{2y}=\dfrac12$이고 $k^{\frac1{9x}+\frac1{2y}}=k^{\frac1{9x}}\times k^{\frac1{2y}}=2\times12=24$, $k^{\frac12}=24$이므로 $k=24^2=576$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $512^x=576$에서 $x=\log_{512}576=\dfrac29\cdot\dfrac{\log24}{\log2}=\dfrac29\log_2 24$, $\therefore p=\dfrac29$
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $144^y=576$에서 $y=\log_{144}576=\dfrac22\cdot\dfrac{\log24}{\log12}=\log_{12}24$, $\therefore q=1$.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $9x\log_{24}2+y\log_{24}12=9\times\dfrac29\dfrac{\log24}{\log2}\times\dfrac{\log2}{\log24}+\dfrac{\log24}{\log12}\times\dfrac{\log12}{\log24}=2+1=3$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $k=576$ 등으로 $x=\dfrac29\log_2 24$를 얻어 $p=\dfrac29$(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $q=1$(채점기준 4점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        $9x\log_{24}2+y\log_{24}12=3$(채점기준 2점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
