  misconceptions:
  - id: MC-ALG-8409
    outcome_code: '71'
    wrong_work: '$\log_{512}576=\dfrac{\log_2 576}{9}$에서 $\log_2576=\log_2 24$로 잘못 보아 $p=\dfrac19$'
    detect_cue: '$p$가 $\frac19$이거나 $q$가 $\frac12$이다'
    feedback: '$576=24^2$이므로 $\log_2576=2\log_2 24$입니다. 지수 2를 앞으로 꺼내세요.'
    remedy: [RL-1]

