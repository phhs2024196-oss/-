intent: |
  제시문의 상황에서 주어진 식과 로그의 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $512^x=144^y=k$로 두고 지수법칙으로 $k$를 구한 뒤 로그의 밑 변환으로 $x$, $y$를 표현한다.
key_idea: |
  $2=k^{\frac{1}{9x}}$, $12=k^{\frac{1}{2y}}$를 곱하면 $k^{\frac12}=24$, 즉 $k=576$이다.
stuck: |
  $512=2^9$, $144=12^2$로 바꿔 지수의 역수 합 조건 $\frac1{9x}+\frac1{2y}=\frac12$를 곱으로 연결하는 것.
