stimuli: []

stem: |
  좌표평면에 점 $\mathrm{A}(2,0)$과 원 $x^2+y^2=4$ 위의 점 $\mathrm{P}$가 있다. 동경 $\mathrm{OP}$가 나타내는 각의 크기를 $\theta$라 할 때, 점 $\mathrm{P}$와 $\theta$가 다음 조건을 만족시킨다.

  (가) 선분 $\mathrm{AP}$를 포함하는 부채꼴 $\mathrm{AOP}$의 넓이는 $\dfrac{3}{2}\pi$이다.
  (나) $\dfrac{\cos\theta}{\tan\theta}<0$

  $\sin2\theta$와 $\tan3\theta$의 값을 각각 구하는 과정을 서술하시오. (단, $\mathrm{O}$는 원점이다.)

subparts:
- id: '1'
  stem: |
    $\sin2\theta$와 $\tan3\theta$의 값을 각각 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '\sin2\theta=1,\ \tan3\theta=-1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\frac12\cdot4\alpha=\frac32\pi$에서 $\alpha=\frac34\pi$, (나)에서 $\theta=\frac54\pi$.
    steps:
    - id: 1a
      content: |
        $\theta=\dfrac54\pi\Rightarrow\sin2\theta=\sin\dfrac52\pi=1,\ \tan3\theta=\tan\dfrac{15}{4}\pi=-1$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '반지름 2인 부채꼴의 넓이 공식으로 중심각을 구하자.'
    - '중심각이 같은 점 P는 $x$축 위·아래 두 개다. (나)의 부호로 하나를 고르자.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [C 15] 5. 문항 해설(PDF 296~297쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        선분 AP를 포함하는 부채꼴 AOP에서 $\angle AOP=\alpha$라 하자. 조건 (가)에서 부채꼴 AOP의 넓이가 $\dfrac32\pi$이므로, $\dfrac12\cdot4\alpha=\dfrac32\pi$, $\alpha=\dfrac34\pi$
        이때, $\theta=\dfrac34\pi$ 또는 $\theta=\dfrac54\pi$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\theta=\dfrac34\pi$이라면, $\cos\theta<0$, $\tan\theta<0$이므로 조건 (나) 만족시키지 않는다.
        $\theta=\dfrac54\pi$이라면, $\cos\theta<0$, $\tan\theta>0$이므로 조건 (나) 만족시킨다. 따라서, $\theta=\dfrac54\pi$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        그러므로 $\sin2\theta=\sin\dfrac52\pi=\sin\dfrac\pi2=1$이고
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $\tan3\theta=\tan\dfrac{15}{4}\pi=\tan\left(3\pi+\dfrac34\pi\right)=\tan\dfrac34\pi=-1$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $\theta=\dfrac54\pi$(채점기준 5점).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $\sin2\theta=1$(채점기준 2점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\tan3\theta=-1$(채점기준 3점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-4]
    deductions: []
