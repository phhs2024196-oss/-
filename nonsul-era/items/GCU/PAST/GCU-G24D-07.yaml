intent: |
  제시문의 상황에서 삼각함수의 뜻을 이용하여 간단한 삼각방정식을 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문; 답안지: 삼각함수에 대한 이해 확인). $\tan\theta$에 대한 이차방정식을 풀고 각의 범위로 근을 고른다.
key_idea: |
  양변에 $\tan\theta$를 곱하면 $\tan^2\theta-(\sqrt3-1)\tan\theta-\sqrt3=0$, 즉 $(\tan\theta+1)(\tan\theta-\sqrt3)=0$.
stuck: |
  제3사분면에서 $\tan\theta>0$이므로 $\tan\theta=-1$을 버려야 한다.
