stem: |
  $\pi<\theta<\dfrac{3}{2}\pi$인 $\theta$에 대하여 $\tan\theta-\dfrac{\sqrt3}{\tan\theta}=\sqrt3-1$일 때, $2\cos\theta-4\sin\theta$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $2\cos\theta-4\sin\theta$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '2\sqrt3-1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $(\tan\theta+1)(\tan\theta-\sqrt3)=0$, 제3사분면이므로 $\tan\theta=\sqrt3$, $\theta=\frac43\pi$.
    steps:
    - id: 1a
      content: |
        $\tan\theta=\sqrt3\Rightarrow\theta=\dfrac43\pi\Rightarrow2\cos\theta-4\sin\theta=-1+2\sqrt3$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '분모를 없애 $\tan\theta$에 대한 이차방정식으로 바꾸자.'
    - '$\pi<\theta<\frac32\pi$에서 $\tan\theta$의 부호는?'
  - id: S1-B
    audience: B
    source_flow: '「2024학년도 논술전형 답안지(자연).hwp」 [수학 7] 5. 문항 해설·6. 채점 기준(= 선행학습 보고서 문항카드 [D 7], PDF 298~299쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\tan\theta-\dfrac{\sqrt3}{\tan\theta}=\sqrt3-1$을 정리하면
        $\tan^2\theta-(\sqrt3-1)\tan\theta-\sqrt3=0$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $\tan\theta=-1$, 또는 $\tan\theta=\sqrt3$인데, $\pi<\theta<\dfrac32\pi$이므로 $\tan\theta=\sqrt3$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 $\theta=\dfrac43\pi$이고,
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $2\cos\theta-4\sin\theta=2\sqrt3-1$.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
