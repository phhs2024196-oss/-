    outcome_code: '71'
    wrong_work: '$\tan\theta=-1$을 택해 $\theta=\frac54\pi$로 보고 $2\cos\theta-4\sin\theta=\sqrt2$'
    detect_cue: '답이 $\sqrt2$이거나 $\tan\theta=-1$을 버리지 않았다'
    feedback: '$\pi<\theta<\frac32\pi$(제3사분면)에서는 $\sin\theta<0$, $\cos\theta<0$이므로 $\tan\theta>0$입니다. 또 $\tan\frac54\pi=1$입니다.'
    remedy: [RL-1]

