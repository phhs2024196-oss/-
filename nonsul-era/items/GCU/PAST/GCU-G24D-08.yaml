stimuli: []

stem: |
  다항함수 $f(x)$에 대하여 곡선 $y=x^2f(x)-3x$ 위의 점 $(2,6)$에서의 접선의 기울기가 $1$일 때, $y=f(x)$ 위의 점 $\left(2,f(2)\right)$에서의 접선의 $y$절편을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $y=f(x)$ 위의 점 $\left(2,f(2)\right)$에서의 접선의 $y$절편을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '7', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $4f(2)-6=6$에서 $f(2)=3$, $4f(2)+4f'(2)-3=1$에서 $f'(2)=-2$.
    steps:
    - id: 1a
      content: |
        $f(2)=3,\ f'(2)=-2\Rightarrow y=-2x+7\Rightarrow y$절편 $7$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '점 $(2,6)$을 곡선의 식에 대입해 보자.'
    - '$y=x^2f(x)-3x$를 곱의 미분법으로 미분하자.'
  - id: S1-B
    audience: B
    source_flow: '「2024학년도 논술전형 답안지(자연).hwp」 [수학 8] 5. 문항 해설·6. 채점 기준(= 선행학습 보고서 문항카드 [D 8], PDF 300~301쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=x^2f(x)-3x$에서 $y'=2xf(x)+x^2f'(x)-3$이고 점 $(2,6)$이 곡선 $y=x^2f(x)-3x$ 위의 점이므로 $f(2)=3$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        곡선 $y=x^2f(x)-3x$ 위의 점 $(2,6)$에서의 접선의 기울기가 $1$이므로 $2\times2\times f(2)+2^2\times f'(2)-3=9+4f'(2)=1$. 즉, $f'(2)=-2$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 곡선 $y=f(x)$ 위의 점 $(2,f(2))$에서의 접선의 방정식은
        $y-f(2)=f'(2)\times(x-2)$, $y-3=-2(x-2)$
        즉, $y=-2x+7$.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        따라서 구하는 $y$절편은 $7$이다.
      criteria: ['1.A3']
