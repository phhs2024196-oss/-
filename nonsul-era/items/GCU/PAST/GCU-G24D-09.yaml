stimuli: []

stem: |
  첫째항이 $1$인 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여 $a_{n+1}=a_n+n\sin\left(\dfrac{n\pi}{2}+\pi\right)$를 만족시킬 때, $\displaystyle\sum_{k=1}^{42}a_k$의 값을 구하는 다음의 풀이 과정을 완성하시오.

  [풀이 과정 상자] 수열 $\{a_n\}$에 대해 $a_{4k-3}=2k-1$, $a_{4k-2}=a_{4k-1}=\boxed{\ ⓵\ }$, $a_{4k}=\boxed{\ ⓶\ }$이다. 따라서 $a_{4k-3}+a_{4k-2}+a_{4k-1}+a_{4k}=\boxed{\ ⓷\ }$이므로 $\displaystyle\sum_{k=1}^{42}a_k=\boxed{\ ⓸\ }$이다.

subparts:
- id: '1'
  stem: |
    빈칸 ⓵~⓸를 채워 $\sum_{k=1}^{42}a_k$의 값을 구하는 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '41', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $a_1,\dots,a_8=1,0,0,3,3,-2,-2,5$에서 규칙을 읽고 네 항씩 묶는다.
    steps:
    - id: 1a
      content: |
        ⓵ $-2k+2$, ⓶ $2k+1$, ⓷ $4$, ⓸ $4\times10+a_{41}+a_{42}=40+21-20=41$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '$\sin\left(\frac{n\pi}{2}+\pi\right)=-\sin\frac{n\pi}{2}$이다. $n=1,2,3,4$일 때 값은?'
    - '$a_1$부터 $a_{12}$까지 써 보고 네 개씩 묶어 보자.'
  - id: S1-B
    audience: B
    source_flow: '「2024학년도 논술전형 답안지(자연).hwp」 [수학 9] 5. 문항 해설·6. 채점 기준(= 선행학습 보고서 문항카드 [D 9], PDF 302~303쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_1=1$이고 $a_2=a_1+1\times\left(-\sin\dfrac\pi2\right)=1+(-1)=0$, $a_3=a_2+2\times(-\sin\pi)=0+0=0$, $a_4=a_3+3\times\left(-\sin\dfrac{3\pi}{2}\right)=0+3=3$, $a_5=a_4+4\times(-\sin2\pi)=3+0=3$이다.
        $a_6=-2$, $a_7=-2$, $a_8=5$이고, $a_9=5$, $a_{10}=-4$, $a_{11}=-4$, $a_{12}=7$이 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        위와 같이 $-\sin\left(\dfrac\pi2\times n\right)$는 $-1,0,1,0$이 반복되므로 $a_{4k-3}=2k-1$, $a_{4k-2}=a_{4k-1}=-2k+2$, $a_{4k}=2k+1$이 된다. (⓵ $-2k+2$, ⓶ $2k+1$)
      criteria: ['1.M1', '1.M2']
    - id: 1b-3
      content: |
        따라서 $a_k+a_{k+1}+a_{k+2}+a_{k+3}=4$가 반복되므로 (⓷ $4$)
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $\displaystyle\sum_{k=1}^{40}a_k+a_{41}+a_{42}=4\times10+(2\times11-1)+(-2\times11+2)=41$이다. (⓸ $41$)
      criteria: ['1.A2']
