intent: |
  제시문의 상황에서 수열의 귀납적 정의를 이용하여 단계별로 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문; 답안지: 다양한 수열의 규칙 찾기). $\sin\left(\frac{n\pi}{2}+\pi\right)=-\sin\frac{n\pi}{2}$의 주기 4를 이용해 네 항씩 묶는다.
key_idea: |
  $-\sin\frac{n\pi}{2}$는 $-1,0,1,0$이 반복되므로 $a_{4k-3}=2k-1$, $a_{4k-2}=a_{4k-1}=-2k+2$, $a_{4k}=2k+1$, 네 항의 합은 $4$.
stuck: |
  몇 항을 직접 나열해 4개 주기의 규칙을 일반화하는 것.
