stimuli: []

stem: |
  함수 $f(x)=\dfrac{ax+2}{x-b}$와 양의 실수 $t$에 대하여 $x$에 대한 방정식 $\lvert f(x)\rvert=t$의 서로 다른 실근의 개수를 $g(t)$라 하고, $x$에 대한 방정식 $\lvert f(x)\rvert=-tx$의 서로 다른 실근의 개수를 $h(t)$라 할 때, 두 함수 $g(t)$, $h(t)$가 다음 조건을 만족시킨다.

  (가) 함수 $g(t)$는 $t=b$에서만 불연속이다.
  (나) 함수 $h(t)$는 양의 실수 전체의 집합에서 연속이다.

  $f(3)+h(3)=\dfrac23$일 때, $f(a)$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$는 상수이고 $ab+2\neq0$이다.)

subparts:
- id: '1'
  stem: |
    $f(a)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-\dfrac{281}{180}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      (가)에서 $b=\lvert a\rvert>0$, (나)에서 $a<0$이므로 $b=-a$, $h(3)=1$에서 $f(3)=-\tfrac13$.
    steps:
    - id: 1a
      content: |
        $a<0,\ b=-a,\ \dfrac{3a+2}{3+a}=-\dfrac13\Rightarrow a=-\dfrac9{10}\Rightarrow f(a)=-\dfrac{281}{180}$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$f(x)$를 $a+\dfrac{k}{x-b}$ 꼴로 바꾸고 $y=\lvert f(x)\rvert$를 그려 보자.'
    - '$g(t)$의 값이 바뀌는 $t$는 어느 높이인가? $y=-tx$는 $x<0$ 쪽에서만 $y\ge0$이다.'
  - id: S1-B
    audience: B
    source_flow: '「2024학년도 논술전형 답안지(자연).hwp」 [수학 10] 5. 문항 해설·6. 채점 기준(= 선행학습 보고서 문항카드 [D 10], PDF 304~305쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\dfrac{ax+2}{x-b}=a+\dfrac{ab+2}{x-b}$이고, $a=0$이면 (가)를 만족하지 않는다. 또한, (가)에 의해 $b>0$이어야 한다.
        (1) $a>0$, $b>0$인 경우 조건 (나)를 만족하지 않는다.
        (2) $a<0$, $b>0$인 경우 조건 (나)를 만족한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        조건 (가)로부터 $b=-a$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $f(3)+h(3)=\dfrac23$이고 $h(3)=1$이므로 $f(3)=\dfrac{3a+2}{3+a}=-\dfrac13$. 즉 $a=-\dfrac9{10}$.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        따라서 $f(x)=\dfrac{-\frac9{10}x+2}{x-\frac9{10}}$이므로
        $f(a)=f\left(-\dfrac9{10}\right)=\dfrac{\left(-\frac9{10}\right)^2+2}{-\frac9{10}-\frac9{10}}=-\dfrac{281}{180}$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
