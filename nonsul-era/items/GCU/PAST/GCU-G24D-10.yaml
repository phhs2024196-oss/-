intent: |
  제시문의 상황에서 새롭게 정의된 함수와 주어진 조건, 함수의 연속을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문; 답안지: 함수의 연속에 대한 이해 확인). 유리함수 $\lvert f(x)\rvert$의 점근선과 교점 개수로 $a$, $b$의 부호와 관계를 정한다.
key_idea: |
  $f(x)=a+\dfrac{ab+2}{x-b}$이므로 $\lvert f(x)\rvert=t$의 근의 개수는 $t=\lvert a\rvert$에서만 바뀐다. (가)에서 $b=\lvert a\rvert>0$, (나)에서 $a<0$이므로 $b=-a$.
stuck: |
  $g(t)$의 불연속점이 점근선 높이 $\lvert a\rvert$임을 읽고, 직선 $y=-tx$와 $y=\lvert f(x)\rvert$의 교점 수가 $t$에 따라 변하지 않을 조건($a<0$)을 분류하는 것.
