intent: |
  제시문의 상황에서 주어진 조건을 만족하는 함수의 그래프의 개형을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문; 답안지: 함수의 극대와 극소). 극솟값 0인 중근과 등차수열 조건으로 $x=4$에 대칭인 식을 세운다.
key_idea: |
  세 근이 $4-a$, $4$, $4+a$이고 $x=4$가 중근이므로 $f(x)=-(x-4)^2(x-4-a)(x-4+a)$; 극댓값은 $x=4\pm\frac{a}{\sqrt2}$에서 $\frac{a^4}{4}$.
stuck: |
  $x=4$에서 극솟값 0이면 $x=4$가 중근이라는 것과, 등차수열 조건으로 나머지 두 근을 $4\pm a$로 두는 것.
