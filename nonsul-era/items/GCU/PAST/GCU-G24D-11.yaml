stimuli: []

stem: |
  최고차항의 계수가 $-1$인 사차함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) 함수 $f(x)$는 $x=4$에서 극솟값 $0$을 갖는다.
  (나) 방정식 $f(x)=0$의 세 실근을 작은 것부터 차례로 나열하면 등차수열을 이룬다.

  함수 $f(x)$의 극댓값이 $9$일 때, $f(1)$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $f(1)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-27', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=-(x-4)^2\{(x-4)^2-a^2\}$, 극댓값 $\frac{a^4}{4}=9$에서 $a^2=6$.
    steps:
    - id: 1a
      content: |
        $a^2=6\Rightarrow f(1)=-9(9-a^2)=-27$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '극솟값이 0이면 $x=4$는 $f(x)=0$의 어떤 근인가?'
    - '등차수열의 가운데 항은 $4$다. 나머지 두 근을 $4\pm a$로 두자.'
  - id: S1-B
    audience: B
    source_flow: '「2024학년도 논술전형 답안지(자연).hwp」 [수학 11] 5. 문항 해설·6. 채점 기준(= 선행학습 보고서 문항카드 [D 11], PDF 306~307쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가), (나)에 의하여 방정식 $f(x)=0$의 한 실근을 $4+a$라 하면 다른 한 실근은 $4-a$이므로 $f(x)=-(x-4)^2(x-4-a)(x-4+a)$ (단, $a$는 양의 상수).
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f'(x)=-2(x-4)(x-4-a)(x-4+a)-(x-4)^2(x-4-a)-(x-4)^2(x-4+a)$
        $=-(x-4)\{2(x-4)^2-2a^2+2(x-4)^2\}=-2(x-4)\{2(x-4)^2-a^2\}$
        $f'(x)=0$에서 $x=4$ 또는 $x=4\pm\dfrac{a}{\sqrt2}$이므로 함수 $f(x)$는 $x=4\pm\dfrac{a}{\sqrt2}$에서 극댓값을 갖는다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        이때 함수 $f(x)$의 극댓값이 9이므로 $f\left(4+\dfrac{a}{\sqrt2}\right)=-\dfrac{a^2}{2}\left(\dfrac{a}{\sqrt2}-a\right)\left(\dfrac{a}{\sqrt2}+a\right)=-\dfrac{a^2}{2}\left(\dfrac{a^2}{2}-a^2\right)=\dfrac{a^4}{4}=9$. 즉, $a^2=6$이므로
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $f(1)=-(1-4)^2(1-4-a)(1-4+a)=-9\times(9-a^2)=-27$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f(x)=-(x-4)^2(x-4-a)(x-4+a)$ (또는 $x-4=t$로 치환하면 $f(x)=f(t+4)=-t^2(t^2-a^2)$)(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $x=4\pm\dfrac{a}{\sqrt2}$(채점기준 3점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $a^2=6$(채점기준 2점).
      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        $-27$(채점기준 2점).
      depends_on: [1.M1, 1.A2]
      implied_ok: false
      steps: [1b-4]
    deductions: []
