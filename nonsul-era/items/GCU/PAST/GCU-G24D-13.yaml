stimuli: []

stem: |
  정의역이 $\{x\mid x\ge0\}$인 함수 $f(x)$가 모든 자연수 $n$에 대하여 다음을 만족시킨다.

  $2n-2\le x<2n$일 때, $f(x)=\cos(n\pi x)$

  $0\le x<4$에서 방정식 $2f(x)-1=0$의 서로 다른 실근 중 가장 작은 값과 가장 큰 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $0\le x<4$에서 방정식 $2f(x)-1=0$의 서로 다른 실근 중 가장 작은 값과 가장 큰 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '\text{가장 작은 값 }\dfrac13,\ \text{가장 큰 값 }\dfrac{23}{6}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $[0,2)$: $\cos\pi x=\frac12$의 최소 해 $\frac13$; $[2,4)$: $\cos2\pi x=\frac12$의 최대 해 $\frac{23}{6}$.
    steps:
    - id: 1a
      content: |
        $n=1$: $x=\dfrac13,\dfrac53$; $n=2$: $x=\dfrac{13}{6},\dfrac{17}{6},\dfrac{19}{6},\dfrac{23}{6}$ → 최소 $\dfrac13$, 최대 $\dfrac{23}{6}$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2']
    hint_ladder:
    - '$n=1$, $n=2$일 때 구간과 $f(x)$의 식을 각각 써 보자.'
    - '$\cos2\pi x=\frac12$의 해는 길이 1마다 두 개씩 있다.'
  - id: S1-B
    audience: B
    source_flow: '「2024학년도 논술전형 답안지(자연).hwp」 [수학 13] 5. 문항 해설·6. 채점 기준(= 선행학습 보고서 문항카드 [D 13], PDF 310~311쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $0\le x<2$ 즉 $n=1$일 때, $f(x)=\cos(\pi x)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $2f(x)-1=0$에서 $\cos(\pi x)=\dfrac12$, 이 구간에서 가장 작은 실근이 존재하고 그 값은 $x=\dfrac13$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $2\le x<4$ 즉 $n=2$일 때, $f(x)=\cos(2\pi x)$이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $2f(x)-1=0$에서 $\cos(2\pi x)=\dfrac12$, 이 구간에서 가장 큰 실근이 존재하고 그 값은 $x=\dfrac{23}{6}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $0\le x<2$(또는 $n=1$), $f(x)=\cos(\pi x)$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $x=\dfrac13$(채점기준 3점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $2\le x<4$(또는 $n=2$), $f(x)=\cos(2\pi x)$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $x=\dfrac{23}{6}$(채점기준 3점).
      depends_on: [1.M2]
      implied_ok: false
      steps: [1b-4]
    deductions: []
