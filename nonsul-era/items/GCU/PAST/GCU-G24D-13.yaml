intent: |
  제시문의 상황에서 주어진 조건과 삼각함수의 그래프를 이용하여 방정식 문제를 해결할 수 있는 지를 평가한다(문항카드 출제 의도 원문; 답안지: 삼각함수의 이해). 구간마다 주기가 다른 코사인함수에서 $\cos=\frac12$의 해를 찾는다.
key_idea: |
  $0\le x<2$에서 $f(x)=\cos\pi x$, $2\le x<4$에서 $f(x)=\cos2\pi x$이므로 각 구간에서 $\cos(\cdot)=\frac12$의 최소·최대 해를 구한다.
stuck: |
  $n$에 따라 구간과 식이 달라지는 정의를 $n=1,2$로 풀어 쓰는 것과, $\cos2\pi x=\frac12$의 해를 $[2,4)$ 안에서 모두 찾는 것.
