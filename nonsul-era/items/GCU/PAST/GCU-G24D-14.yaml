    outcome_code: '71'
    wrong_work: '$\sum\{ka_{k+1}-(k+1)a_k\}$를 망원합으로 보고 $10a_{11}-a_1=50$처럼 정리'
    detect_cue: '$-2\sum a_k$ 항 없이 $a_{11}$을 구했다'
    feedback: '$k a_{k+1}$과 $(k+1)a_k$는 계수가 달라 완전히 소거되지 않습니다. 같은 $a_j$끼리 모으면 계수가 $(j-1)-(j+1)=-2$이므로 $-2\sum_{k=1}^{10}a_k+10a_{11}$이 남습니다.'
    remedy: [RL-1]

