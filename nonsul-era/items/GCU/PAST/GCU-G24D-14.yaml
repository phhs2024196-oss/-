stem: |
  첫째항이 같은 두 수열 $\{a_n\}$, $\{b_n\}$이 모든 자연수 $n$에 대하여 $a_n+b_n=2$를 만족시키고, $\displaystyle\sum_{k=1}^{10}\{ka_{k+1}-(k+1)a_k\}=50$, $\displaystyle\sum_{k=1}^{9}\{(a_{k+1})^2-(b_{k+1})^2\}=20$일 때, $\displaystyle\sum_{k=1}^{11}a_k$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{k=1}^{11}a_k$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '23', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\sum_{k=1}^{10}a_k=15$, 전개하면 $-2\cdot15+10a_{11}=50$에서 $a_{11}=8$.
    steps:
    - id: 1a
      content: |
        $\sum_{k=1}^{10}a_k=15,\ a_{11}=8\Rightarrow\sum_{k=1}^{11}a_k=23$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$a_1=b_1$과 $a_1+b_1=2$에서 $a_1^2-b_1^2$은?'
    - '$\sum\{ka_{k+1}-(k+1)a_k\}$를 $k=1,2,3$까지 써서 어떤 항이 남는지 보자.'
  - id: S1-B
    audience: B
    source_flow: '「2024학년도 논술전형 답안지(자연).hwp」 [수학 14] 5. 문항 해설·6. 채점 기준(= 선행학습 보고서 문항카드 [D 14], PDF 312~313쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_n+b_n=2$에서 $\displaystyle\sum_{k=1}^{10}(a_k+b_k)=20$ (식1)이고, $\displaystyle\sum_{k=1}^{9}\{(a_{k+1})^2-(b_{k+1})^2\}=\sum_{k=1}^{10}\{(a_k)^2-(b_k)^2\}-(a_1^2-b_1^2)=20$이다. 이때 두 수열의 첫째항이 같으므로 $\displaystyle\sum_{k=1}^{10}\{(a_k-b_k)(a_k+b_k)\}=\sum_{k=1}^{10}\{2(a_k-b_k)\}=20$ (식2)이다.
        상기 식 (1, 2)을 연립하여 풀면, $\displaystyle\sum_{k=1}^{10}a_k=15$이고 $\displaystyle\sum_{k=1}^{10}b_k=5$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\sum_{k=1}^{10}\{ka_{k+1}-(k+1)a_k\}=50$을 전개하면 $(a_2-2a_1)+(2a_3-3a_2)+(3a_4-4a_3)+\cdots+(10a_{11}-11a_{10})=50$이고, $-2(a_1+a_2+a_3+\cdots+a_{10})+10a_{11}=50$, $-2\displaystyle\sum_{k=1}^{10}a_k+10a_{11}=50$이다. 따라서 $10a_{11}=80$, $a_{11}=8$이고
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\displaystyle\sum_{k=1}^{11}a_k=15+8=23$이다.
      criteria: ['1.A2']
