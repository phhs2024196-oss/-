intent: |
  제시문의 상황에서 주어진 조건과 합의 기호의 정의와 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문; 답안지: 합의 기호 성질 이해). 첨자 이동과 합차 공식으로 $\sum a_k$를 구하고 전개해 $a_{11}$을 얻는다.
key_idea: |
  $b_k=2-a_k$이고 $a_1=b_1$이므로 $\sum_{k=1}^{10}2(a_k-b_k)=20$; $\sum\{ka_{k+1}-(k+1)a_k\}=-2\sum_{k=1}^{10}a_k+10a_{11}$.
stuck: |
  $\sum_{k=1}^{9}$의 첨자를 $k+1$에서 $k$로 옮기며 $a_1^2-b_1^2=0$을 쓰는 것과, $\sum\{ka_{k+1}-(k+1)a_k\}$를 전개해 정리하는 것.
