intent: |
  제시문의 상황에서 로그함수의 그래프를 이용한 부등식 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문; 답안지: 로그의 정의 이해). 치환 $t=\frac{x}{3}$ 후 진수 조건과 밑이 1보다 큰 로그의 대소로 범위를 정한다.
key_idea: |
  $t=\frac{x}{3}$로 두면 진수 조건 $f(t)>0$, $g(t)>0$에서 $-3<t<-1$, $f(t)\le g(t)$에서 $-2\le t\le3.5$.
