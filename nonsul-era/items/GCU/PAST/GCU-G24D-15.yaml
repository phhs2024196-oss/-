stem: |
  두 이차함수 $y=f(x)$, $y=g(x)$의 그래프가 그림과 같을 때, 부등식 $\log_3 f\left(\dfrac{x}{3}\right)\le\log_3 g\left(\dfrac{x}{3}\right)$를 만족시키는 정수 $x$의 개수를 구하는 과정을 서술하시오.

  [그림: 좌표평면에 두 이차함수의 그래프. $y=g(x)$는 위로 볼록한 포물선으로 꼭짓점이 $y$축 위(원점보다 위)에 있고 $x$축과 $x=-3$, $x=3$에서 만난다. $y=f(x)$는 아래로 볼록한 포물선으로 왼쪽 위에서 내려와 $x$축과 $x=-1$에서 만나고, $y$절편은 음수이며, 꼭짓점은 $x$축 아래 $x=3$과 $x=\frac72$ 근처에 있고, 오른쪽으로 다시 올라가 $\frac72$보다 오른쪽(눈금 표시 없음)에서 $x$축과 만난다. 두 그래프는 $x=-2$($x$축 위쪽, 점선으로 표시)와 $x=\frac72$($x$축 아래쪽, 점선으로 표시)에서 만난다. 축 눈금으로 $-3$, $-2$, $-1$, $\mathrm{O}$, $3$, $\frac72$가 표시되어 있다.]

subparts:
- id: '1'
  stem: |
    부등식을 만족시키는 정수 $x$의 개수를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      진수 조건 $-3<t<-1$과 $f(t)\le g(t)$인 $-2\le t\le3.5$의 공통 범위 $-2\le t<-1$, 즉 $-6\le x<-3$.
    steps:
    - id: 1a
      content: |
        $-6\le x<-3\Rightarrow x=-6,-5,-4$, 개수 $3$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '$\frac{x}{3}=t$로 놓고 진수 조건부터 그래프에서 읽자.'
    - '밑이 3이면 $\log_3A\le\log_3B\iff A\le B$ (단, $A,B>0$).'
  - id: S1-B
    audience: B
    source_flow: '「2024학년도 논술전형 답안지(자연).hwp」 [수학 15] 5. 문항 해설·6. 채점 기준(= 선행학습 보고서 문항카드 [D 15], PDF 314~315쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        부등식 $\log_3 f\left(\dfrac{x}{3}\right)\le\log_3 g\left(\dfrac{x}{3}\right)$에서 $\dfrac{x}{3}=t$로 놓으면 $\log_3 f(t)\le\log_3 g(t)$
        로그의 진수 조건에 의하여 $f(t)>0$, $g(t)>0$이므로 $-3<t<-1$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        부등식 $\log_3 f(t)\le\log_3 g(t)$에서 밑 $3$이 $1$보다 크므로 $f(t)\le g(t)$에서 $-2\le t\le3.5$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        따라서 $-2\le t<-1$. 즉 $-2\le\dfrac{x}{3}<-1$. $-6\le x<-3$. 따라서 $x$는 $-4,-5,-6$이고
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        그 개수는 $3$이다.
      criteria: ['1.A2']
