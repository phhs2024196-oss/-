intent: |
  제시문의 상황에서 로그의 성질과 로그부등식을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $\log_2x$를 한 문자로 보아 이차부등식으로 바꾼다.
key_idea: |
  $\log_2\frac{x}{8}=\log_2x-3$, $\log_2\frac{x}{64}=\log_2x-6$이므로 $(\log_2x+2)(\log_2x-11)<0$.
stuck: |
  몫의 로그를 차로 나누어 $\log_2x$에 대한 이차부등식으로 만드는 것.
