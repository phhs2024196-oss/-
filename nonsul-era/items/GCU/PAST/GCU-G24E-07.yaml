stimuli: []

stem: |
  부등식 $\log_2\dfrac{x}{8}\times\log_2\dfrac{x}{64}<40$을 만족시키는 자연수 $x$의 최댓값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    부등식을 만족시키는 자연수 $x$의 최댓값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '2047', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $(\log_2x-3)(\log_2x-6)<40\iff(\log_2x+2)(\log_2x-11)<0$.
    steps:
    - id: 1a
      content: |
        $-2<\log_2x<11\Rightarrow\dfrac14<x<2048\Rightarrow$ 최댓값 $2047$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$\log_2\frac{x}{8}$를 $\log_2x$로 나타내 보자.'
    - '$\log_2x=t$로 두면 $t$에 대한 이차부등식이 된다.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [E 7] 5. 문항 해설(PDF 316~317쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\log_2\dfrac{x}{8}\times\log_2\dfrac{x}{64}=(\log_2x-3)(\log_2x-6)$
        $(\log_2x-3)(\log_2x-6)<40$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $(\log_2x+2)(\log_2x-11)<0$이므로
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        즉, $-2<\log_2x<11$, $2^{-2}<x<2^{11}$
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $2^{-2}<x<2048$. 따라서 부등식을 만족시키는 자연수 $x$의 최댓값은 $2047$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $(\log_2x-3)(\log_2x-6)<40$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $(\log_2x+2)(\log_2x-11)<0$(채점기준 3점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $-2<\log_2x<11$ (또는 $2^{-2}<x<2^{11}$)(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        $2047$(채점기준 2점).
      depends_on: [1.M1, 1.A2]
      implied_ok: false
      steps: [1b-4]
    deductions: []
