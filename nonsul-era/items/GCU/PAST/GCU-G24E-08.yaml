stem: |
  모든 항이 실수인 등비수열 $\{a_n\}$에 대하여 $a_2a_3=\dfrac32$, $a_7a_8=54$일 때, $a_5^{\,2}$의 값을 구하는 다음의 풀이 과정을 완성하시오.

  [풀이 과정 상자] 등비수열 $\{a_n\}$에 대하여 세 수 $a_2$, $\boxed{\ ①\ }$, $a_8$이 이 순서대로 등비수열을 이루고, 또한 세 수 $a_3$, $\boxed{\ ②\ }$, $a_7$이 이 순서대로 등비수열을 이루므로 $a_5^{\,4}=\boxed{\ ③\ }$이다. 따라서 $a_5^{\,2}$의 값은 $\boxed{\ ④\ }$이다.

subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 $a_5^{\,2}$의 값을 구하는 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '9', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $a_5^4=(a_2a_8)(a_3a_7)=(a_2a_3)(a_7a_8)=\frac32\times54=81$.
    steps:
    - id: 1a
      content: |
        ① $a_5$, ② $a_5$, ③ $81$, ④ $9$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '$a_2$와 $a_8$ 사이의 등비중항은 몇 번째 항인가?'
    - '$a_2a_8\times a_3a_7$을 주어진 곱으로 다시 묶어 보자.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [E 8] 5. 문항 해설(PDF 318~319쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        등비수열 $\{a_n\}$에 대하여 세 수 $a_2$, $a_5$, $a_8$이 순서대로 등비수열을 이루고, (① $a_5$)
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        또한 세 수 $a_3$, $a_5$, $a_7$이 순서대로 등비수열을 이루므로 (② $a_5$)
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $a_5^4=81$ (또는 $a_2a_8\times a_3a_7=a_2a_3\times a_7a_8=\dfrac32\times54$)이다. (③ $81$)
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        따라서 $a_5^2$의 값은 $9$이다. (④ $9$)
      criteria: ['1.A2']
