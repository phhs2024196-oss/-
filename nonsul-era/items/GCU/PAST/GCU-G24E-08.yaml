intent: |
  제시문의 상황에서 등비수열의 일반항을 이용하여 단계별로 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 등비중항 성질 $a_2a_8=a_3a_7=a_5^2$을 이용한다.
key_idea: |
  $a_2,a_5,a_8$과 $a_3,a_5,a_7$이 각각 등비수열이므로 $a_5^4=a_2a_8\cdot a_3a_7=(a_2a_3)(a_7a_8)=81$.
stuck: |
  첨자의 합이 같은 두 항의 곱이 같다는 등비중항 구조를 보는 것.
