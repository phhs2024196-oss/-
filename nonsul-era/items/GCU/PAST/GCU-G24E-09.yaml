intent: |
  제시문의 상황에서 삼각함수의 그래프와 방정식을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $y=\lvert6\sin x+1\rvert$의 그래프를 $[\pi,2\pi)$에서 그려 직선 $y=k$와 세 점에서 만나는 $k$를 찾고 대칭성으로 $\beta+\gamma$를 구한다.
key_idea: |
  $[\pi,2\pi)$에서 $\lvert6\sin x+1\rvert$는 $x=\pi$에서 $1$, $x\to2\pi$에서 $1$(포함 안 됨)이므로 교점이 세 개인 것은 $k=1$; $\beta$, $\gamma$는 $x=\frac32\pi$에 대칭.
stuck: |
  구간 끝 $x=2\pi$가 빠진다는 점 때문에 $k=1$일 때 근이 세 개가 된다는 것을 그래프로 판단하는 것.
