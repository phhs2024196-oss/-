      points: 3
      evidence: |
        $\alpha=\pi$(채점기준 3점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\beta+\gamma=3\pi$(채점기준 3점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        $3$(채점기준 1점).
      depends_on: [1.M1, 1.A1, 1.A2]
      implied_ok: false
      steps: [1b-4]
    deductions: []
