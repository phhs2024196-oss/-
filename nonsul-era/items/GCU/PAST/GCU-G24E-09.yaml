stimuli: []

stem: |
  $\pi\le x<2\pi$에서 $x$에 대한 방정식 $\lvert6\sin x+1\rvert=k$가 서로 다른 세 실근 $\alpha$, $\beta$, $\gamma$ $(\alpha<\beta<\gamma)$를 가질 때, $k\left(\dfrac{\beta+\gamma}{\alpha}\right)$의 값을 구하는 과정을 서술하시오. (단, $k$는 상수이다.)

subparts:
- id: '1'
  stem: |
    $k\left(\dfrac{\beta+\gamma}{\alpha}\right)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $k=1$일 때만 세 근: $\alpha=\pi$, $\beta,\gamma$는 $\sin x=-\frac13$의 두 근으로 합 $3\pi$.
    steps:
    - id: 1a
      content: |
        $k=1,\ \alpha=\pi,\ \beta+\gamma=3\pi\Rightarrow k\cdot\dfrac{\beta+\gamma}{\alpha}=3$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$\pi\le x<2\pi$에서 $y=6\sin x+1$은 $1$에서 출발해 $-5$까지 내려갔다가 다시 $1$ 가까이 올라온다.'
    - '끝점 $x=2\pi$는 포함되지 않는다. 수평선 $y=k$를 움직이며 교점 수를 세어 보자.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [E 9] 5. 문항 해설(PDF 320~321쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        [그림: 해설 그래프 — 점선 $y=6\sin x+1$과 실선 $y=\lvert6\sin x+1\rvert$, 직선 $y=1$과의 교점 $\alpha$, $\beta$, $\gamma$ 표시]
        $f(x)=\lvert6\sin x+1\rvert=k$라 하면 $\pi\le x<2\pi$에서 함수 $y=f(x)$의 그래프는 그림의 실선과 같다. 방정식 $\lvert6\sin x+1\rvert=k$가 서로 다른 세 실근을 가지므로 함수 $y=f(x)$의 그래프와 직선 $y=k$가 서로 다른 세 점에서 만나야 한다. 즉, $k=1$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\alpha=\pi$,
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\beta+\gamma=3\pi$이므로
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $k\left(\dfrac{\beta+\gamma}{\alpha}\right)=1\times\dfrac{3\pi}{\pi}=3$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
