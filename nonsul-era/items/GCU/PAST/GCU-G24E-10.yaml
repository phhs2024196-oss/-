stimuli: []

stem: |
  곡선 $C:\ y=x^4-5x^3-9x^2+2x-3$ 위의 $x$좌표가 양수인 점에서 접하는 직선 중 기울기가 최소인 접선의 방정식을 구하는 다음의 풀이 과정을 완성하시오.

  [풀이 과정 상자] 곡선 $C$에 접하는 접선의 접점의 $x$좌표를 $t$, 접선의 기울기를 $f(t)$라 하면, $t=\boxed{\ ①\ }$일 때 $f(t)$는 최솟값 $\boxed{\ ②\ }$을 갖는다. 즉, 기울기가 최소인 접선의 접점은 점 $(\boxed{\ ③\ })$이고 접선의 방정식은 $y=\boxed{\ ④\ }$이다.

subparts:
- id: '1'
  stem: |
    빈칸 ①~④를 채워 기울기가 최소인 접선의 방정식을 구하는 풀이 과정을 완성하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'y=-79x+105', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(t)=4t^3-15t^2-18t+2$, $f'(t)=6(2t+1)(t-3)$에서 $t>0$이면 $t=3$에서 최소 $-79$.
    steps:
    - id: 1a
      content: |
        ① $3$, ② $-79$, ③ $3,\ -132$, ④ $-79x+105$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '접점 $x=t$에서의 기울기 $f(t)$를 식으로 쓰자.'
    - '$f(t)$의 최솟값을 구하려면 $f(t)$를 다시 미분하자.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [E 10] 5. 문항 해설(PDF 322~323쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $C$에 접하는 접선의 접점의 $x$좌표를 $t$, 접선의 기울기를 $f(t)$라 하면 $f(t)=4t^3-15t^2-18t+2$
        이때 $f'(t)=12t^2-30t-18=0$에서 $t=3$일 때
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f(t)$는 최솟값 $-79$를 갖는다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        즉, 기울기가 최소인 접선의 접점은 점 $(3,-132)$이고
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        기울기는 $-79$이므로 접선의 방정식은 $y+132=-79(x-3)$, $y=-79x+105$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
