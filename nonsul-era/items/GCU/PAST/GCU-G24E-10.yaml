intent: |
  제시문의 상황에서 도함수의 활용의 함수의 그래프의 개형을 이용하여 단계별로 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 접선의 기울기를 접점의 함수 $f(t)$로 보고 다시 미분해 최솟값을 찾는다.
key_idea: |
  기울기 함수 $f(t)=4t^3-15t^2-18t+2$를 $t>0$에서 최소화: $f'(t)=6(2t+1)(t-3)$이므로 $t=3$.
stuck: |
  '기울기가 최소인 접선'을 도함수의 도함수(기울기의 변화)로 다루는 두 단계 최적화.
