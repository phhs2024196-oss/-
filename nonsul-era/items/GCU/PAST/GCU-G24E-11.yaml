intent: |
  제시문의 상황에서 주어진 조건과 지수함수의 성질을 이용하여 부등식 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 밑을 4로 통일해 집합 $A$를 구하고, 밑을 3으로 통일해 $B$의 원소의 곱을 지수의 합으로 계산한다.
key_idea: |
  $\left(\frac14\right)^{-x^2+5x+3}=4^{x^2-5x-3}$이므로 $x^2-6x+3<0$; $B$의 원소는 $3^{-a^2+2a+k}$이고 곱은 $3^{5k-25}$.
stuck: |
  두 번의 밑 통일과, 원소의 곱 $=1$을 지수의 합 $=0$으로 바꾸는 것.
