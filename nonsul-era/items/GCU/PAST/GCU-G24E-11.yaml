    outcome_code: '71'
    wrong_work: '$\left(\frac14\right)^{-x^2+5x+3}<4^{x-6}$에서 지수끼리 $-x^2+5x+3<x-6$으로 비교'
    detect_cue: '$A$가 $\{1,\dots,5\}$가 아닌 집합(예: $x^2-4x-9>0$의 정수해)이다'
    feedback: '밑 $\frac14$은 1보다 작습니다. $\frac14=4^{-1}$로 바꿔 밑을 4로 통일한 뒤 비교하세요.'
