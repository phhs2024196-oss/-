stimuli: []

stem: |
  두 집합
  $$A=\left\{x\ \middle|\ \left(\frac14\right)^{-x^2+5x+3}<4^{x-6},\ x\text{는 정수}\right\},$$
  $$B=\left\{x\ \middle|\ x=3^{-a^2}\times\left(\frac13\right)^{-2a-k},\ a\in A\right\}$$
  에 대하여 집합 $B$의 모든 원소의 곱이 $1$일 때, 상수 $k$의 값을 구하는 과정을 서술하시오

subparts:
- id: '1'
  stem: |
    상수 $k$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '5', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $A=\{1,2,3,4,5\}$, $B$의 원소 $3^{-a^2+2a+k}$의 곱 $3^{5k-25}=1$.
    steps:
    - id: 1a
      content: |
        $x^2-6x+3<0\Rightarrow A=\{1,2,3,4,5\}\Rightarrow3^{5k-25}=3^0\Rightarrow k=5$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$\frac14=4^{-1}$로 바꿔 지수끼리 비교하자.'
    - '$B$의 원소를 모두 $3$의 거듭제곱으로 쓰고 곱하면 지수끼리 더해진다.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [E 11] 5. 문항 해설(PDF 324~325쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        부등식 $\left(\frac14\right)^{-x^2+5x+3}<4^{x-6}$에서 $4^{x^2-5x-3}<4^{x-6}$, $x^2-5x-3<x-6$,
        $x^2-6x+3<0$,
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $3-\sqrt6<x<3+\sqrt6$. 따라서 부등식을 만족시키는 정수 $x$의 값은 $1,2,3,4,5$이므로 $A=\{1,2,3,4,5\}$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $a\in A$에 대하여, $x=3^{-a^2}\times\left(\frac13\right)^{-2a-k}=3^{-a^2+2a+k}$이므로,
        $a=1$일 때, $3^{1+k}$; $a=2$일 때, $3^{k}$; $a=3$일 때, $3^{-3+k}$; $a=4$일 때, $3^{-8+k}$; $a=5$일 때, $3^{-15+k}$
        집합 $B=\{3^{1+k},3^{k},3^{-3+k},3^{-8+k},3^{-15+k}\}$이므로 집합 $B$의 모든 원소의 곱은
        $3^{1+k}\times3^{k}\times3^{-3+k}\times3^{-8+k}\times3^{-15+k}=3^{5k-25}=3^0$.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        따라서 $k=5$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $x^2-6x+3<0$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        정수 $x$의 값은 $1,2,3,4,5$ (또는 $A=\{1,2,3,4,5\}$)(채점기준 3점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $3^{5k-25}=3^0$ (또는 $5k-25=0$)(채점기준 4점).
      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        $k=5$(채점기준 1점).
      depends_on: [1.M1, 1.A2]
      implied_ok: false
      steps: [1b-4]
    deductions: []
