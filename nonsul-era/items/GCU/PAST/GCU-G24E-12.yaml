stimuli: []

stem: |
  다음 조건을 만족시키는 최고차항의 계수가 $1$인 모든 사차함수 $f(x)$에 대하여 $f(2)$의 최댓값과 최솟값을 구하는 과정을 서술하시오.

  (가) $\displaystyle\lim_{x\to1}\frac{f(x)}{x-1}=4$
  (나) 모든 실수 $x$에 대하여 $\lvert f(x)\rvert\le\lvert xg(x)\rvert$, $g(0)=-4$인 연속함수 $g(x)$가 존재한다.

subparts:
- id: '1'
  stem: |
    $f(2)$의 최댓값과 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '\text{최댓값 }28,\ \text{최솟값 }12', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=x(x-1)(x^2+ax+b)$, $a+b=3$, $f'(0)=-b$, $-4\le-b\le4$에서 $-1\le a\le7$.
    steps:
    - id: 1a
      content: |
        $f(2)=2(4+2a+b)=2a+14$, $-1\le a\le7\Rightarrow12\le f(2)\le28$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '(가)에서 $f(1)$의 값은? (나)에 $x=0$을 대입하면?'
    - '$x\neq0$일 때 (나)를 $\lvert x\rvert$로 나누고 $x\to0$으로 보내 보자.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [E 12] 5. 문항 해설(PDF 326~327쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)로부터 $f(1)=0$. 조건 (나)에서 $0\le\lvert f(0)\rvert\le\lvert0\cdot g(0)\rvert=0$이므로 $f(0)=0$. 따라서 $f(x)=x(x-1)(x^2+ax+b)$로 놓을 수 있다. (가)에서
        $4=\displaystyle\lim_{x\to1}\frac{f(x)}{x-1}=\lim_{x\to1}x(x^2+ax+b)=1+a+b$이므로 $a+b=3$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $x\neq0$일 때 $\left\lvert\dfrac{f(x)}{x}\right\rvert\le\lvert g(x)\rvert$이므로 $-\lvert g(x)\rvert\le\dfrac{f(x)}{x}\le\lvert g(x)\rvert$으로부터 $-\lvert g(0)\rvert\le\displaystyle\lim_{x\to0}\frac{f(x)-f(0)}{x}\le\lvert g(0)\rvert$. 즉 $-4\le f'(0)\le4$이다.
        $f(x)=(x^2-x)(x^2+ax+b)$를 미분하면 $f'(x)=(2x-1)(x^2+ax+b)+(x^2-x)(2x+a)$이므로 $f'(0)=-b$.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $-4\le-b\le4$, 즉 $-4\le a-3\le4$이므로 $-1\le a\le7$. 따라서 $f(2)=2a+14$이므로, $f(2)$의 최솟값은 $a=-1$일 때인 $12$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        또한, $f(2)$의 최댓값은 $a=7$일 때인 $28$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        ($f(x)=x(x-1)(x^2+ax+b)$로 놓았을 때) $a+b=3$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        $f'(0)=-b$ (또는 $-4\le f'(0)\le4$)(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $f(2)$의 최솟값은 $12$(채점기준 2점).
      depends_on: [1.M1, 1.M2]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $f(2)$의 최댓값은 $28$(채점기준 2점).
      depends_on: [1.M1, 1.M2]
      implied_ok: false
      steps: [1b-4]
    deductions: []
