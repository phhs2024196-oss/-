intent: |
  제시문의 상황에서 주어진 조건과 도함수의 활용에서 함수의 그래프의 개형을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 극한 조건과 부등식 조건에서 $f(1)=0$, $f(0)=0$, $\lvert f'(0)\rvert\le4$를 끌어내 $f(2)$의 범위를 구한다.
key_idea: |
  $f(x)=x(x-1)(x^2+ax+b)$, (가)에서 $a+b=3$, (나)에서 $\left\lvert\dfrac{f(x)}{x}\right\rvert\le\lvert g(x)\rvert$이므로 $\lvert f'(0)\rvert\le\lvert g(0)\rvert=4$.
stuck: |
  (나)를 $x=0$에서 $f(0)=0$으로, $x\neq0$에서 $\frac{f(x)}{x}$의 극한(=$f'(0)$)에 대한 부등식으로 바꾸는 것.
