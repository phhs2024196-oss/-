      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        최솟값은 $12$(채점기준 2점).
      depends_on: [1.M1, 1.A2]
      implied_ok: false
      steps: [1b-4]
    deductions: []
