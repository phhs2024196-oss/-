intent: |
  제시문의 상황에서 도함수의 활용을 이용한 부등식에 대한 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $f(0)=f'(0)=0$으로 $f$를 한 문자로 나타내고, $g(x)\ge0$인 범위의 최소 $k$가 0이 되도록 이차식의 두 근의 부호를 정한다.
key_idea: |
  $f(x)=x^3+ax^2$, $g(x)=x\{x^2+(a+6)x+4a\}$; 최소 $k=0$이려면 이차식의 두 근이 모두 음수, 즉 $a+6>0$, $4a>0$.
stuck: |
  '$x\ge k$에서 $g(x)\ge0$인 $k$의 최솟값이 0'을 '$x=0$ 바로 왼쪽에서 음수, 오른쪽 전체에서 음이 아님'으로 해석해 근과 계수의 관계로 옮기는 것.
