stimuli: []

stem: |
  최고차항의 계수가 $1$이고 모든 항의 계수가 정수인 삼차함수 $f(x)$에 대하여 함수 $g(x)$를 $g(x)=f(x)+2f'(x)$라 하자. $f(0)=g(0)=0$이고, $x\ge k$인 모든 실수 $x$에 대하여 $g(x)\ge0$을 만족시키는 실수 $k$의 최솟값이 $0$일 때, $f(2)$의 최솟값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $f(2)$의 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '12', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f'(0)=0$이므로 $f(x)=x^3+ax^2$, 이차식 $x^2+(a+6)x+4a$의 두 근이 모두 음수여야 하므로 $a>0$, 정수이므로 $a\ge1$.
    steps:
    - id: 1a
      content: |
        $a\ge1\Rightarrow f(2)=8+4a\ge12$, 최솟값 $12$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$g(0)=f(0)+2f''(0)$에서 $f''(0)$의 값은?'
    - '$g(x)=x\cdot(\text{이차식})$이다. $x\ge0$에서는 음이 아니고 $0$ 바로 왼쪽에서 음수가 되려면 이차식의 근은 어디 있어야 할까?'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [E 13] 5. 문항 해설(PDF 328~329쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g(x)=f(x)+2f'(x)$에서 $f(0)=g(0)=0$이므로 $f'(0)=0$이다. 그러므로 $f(x)=x^3+ax^2$ ($a$는 상수)로 놓을 수 있다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이때 $g(x)=x^3+ax^2+6x^2+4ax=x(x^2+(a+6)x+4a)$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        이차방정식 $x^2+(a+6)x+4a=0$의 판별식 $D=(a+6)^2-16a=(a-2)^2+32>0$이므로 서로 다른 두 실근을 갖는다. $x\ge k$인 모든 실수 $x$에 대하여 $g(x)\ge0$을 만족시키는 실수 $k$의 최솟값이 0인 조건을 만족시키려면 이차방정식의 두 실근을 $\alpha,\beta$라 할 때 $\alpha+\beta<0$, $\alpha\beta>0$이어야 한다. 즉, $a+6>0$, $4a>0$이어야 하므로 $a>0$이다. 모든 항의 계수가 정수이므로 $a\ge1$이어야 한다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        따라서 $f(2)=8+4a\ge12$이므로 최솟값은 $12$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
