    wrong_work: '$a\ge0$으로 보아 $a=0$일 때 $f(2)=8$을 답함'
    detect_cue: '답이 $8$이다'
    feedback: '$a=0$이면 $g(x)=x^2(x+6)$은 $x\ge-6$에서 $g(x)\ge0$이라 $k$의 최솟값이 $-6$이 됩니다. 두 근의 곱 $4a>0$이 필요합니다.'
    remedy: [RL-1]

