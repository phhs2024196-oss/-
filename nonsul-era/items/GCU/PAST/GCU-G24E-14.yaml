    wrong_work: '$g''(0)=f''(0)+f(0)$로 곱의 미분 한 항을 빠뜨려 $f''(0)=2$, $g(1)=$ 다른 값'
    detect_cue: '$f(x)=x^2+2x-2$이다'
    feedback: '$(x^2+x+1)f(x)$의 미분은 $(2x+1)f(x)+(x^2+x+1)f''(x)$입니다. $x=0$에서 $f(0)+f''(0)$이 되고, 앞의 $f''(0)$과 합쳐 $2f''(0)+f(0)=0$입니다.'
    remedy: [RL-1]

