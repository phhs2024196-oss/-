stimuli: []

stem: |
  최고차항의 계수가 $1$인 이차함수 $f(x)$에 대하여 함수 $g(x)$를
  $$g(x)=\int_0^xf'(t)\,dt+(x^2+x+1)f(x)+1$$
  이라 할 때, 함수 $g(x)$가 $x=0$에서 극솟값 $-1$을 갖는다. $g(1)$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $g(1)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(0)=-2$, $f'(0)=1$이므로 $f(x)=x^2+x-2$, $f(1)=0$.
    steps:
    - id: 1a
      content: |
        $g(1)=\{f(1)-f(0)\}+3f(1)+1=2+0+1=3$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$g(0)$을 계산하면 $\int_0^0=0$이다.'
    - '극값이므로 $g''(0)=0$. $g(x)$를 미분해 $x=0$을 대입하자.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [E 14] 5. 문항 해설(PDF 330~331쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        최고차항 계수가 1인 이차함수 $f(x)=x^2+ax+b$라 하자.
        $g(0)=f(0)+1=-1$ 따라서 $f(x)=x^2+ax-2$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $g(x)=\displaystyle\int_0^xf'(t)\,dt+(x^2+x+1)f(x)+1$의 양변을 $x$에 대해 미분하면
        $g'(x)=f'(x)+(2x+1)f(x)+(x^2+x+1)f'(x)$. $g'(0)=0$이므로, $f'(0)=1$
        따라서 $f(x)=x^2+x-2$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $g(1)=\displaystyle\int_0^1f'(t)\,dt+(1^2+1+1)f(1)+1$이고, $\displaystyle\int_0^1f'(t)\,dt=f(1)-f(0)=2$
        $g(1)=2+3f(1)+1=3$ (원 해설은 이 줄의 $(x^2+x+1)f(x)$를 $x=1$ 대입 전 형태로 적음)
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f(0)=-2$ (또는 $f(x)=x^2+ax-2$, 또는 $f(x)=x^2+ax+b$의 상수항 $b=-2$)(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $f'(0)=1$ (또는 $f(x)=x^2+x-2$, 또는 $a=1$)(채점기준 4점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $g(1)=3$(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-3]
    deductions: []
