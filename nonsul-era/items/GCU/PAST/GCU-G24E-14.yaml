intent: |
  제시문의 상황에서 정적분으로 정의된 함수의 미분을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). $g(0)=-1$, $g'(0)=0$ 두 조건으로 $f$의 계수를 정한다.
key_idea: |
  $g(0)=f(0)+1=-1$에서 $f(0)=-2$, $g'(x)=f'(x)+(2x+1)f(x)+(x^2+x+1)f'(x)$에서 $g'(0)=2f'(0)+f(0)=0$이므로 $f'(0)=1$.
stuck: |
  $\frac{d}{dx}\int_0^xf'(t)\,dt=f'(x)$를 쓰고 곱의 미분을 함께 처리하는 것.
