stimuli: []

stem: |
  다음 조건을 만족시키는 두 실수 $a$, $b$의 순서쌍 $(a,b)$를 모두 구하는 과정을 서술하시오.

  (가) $f(x)$는 모든 실수 $x$에 대하여 $f(-x)=f(x)$를 만족시키는 다항함수이다.
  (나) $\displaystyle\lim_{x\to\infty}\frac{f(x)-x^2}{x-a}=b$
  (다) $\displaystyle\lim_{x\to a}\left\lvert\frac{f(x)}{(x-a)^k}\right\rvert=1$인 자연수 $k$가 존재한다.

subparts:
- id: '1'
  stem: |
    조건을 만족시키는 순서쌍 $(a,b)$를 모두 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '(0,0),\ \left(\dfrac12,0\right),\ \left(-\dfrac12,0\right)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=x^2+c$; $a=0$이면 $k=2$, $c=0$; $a\neq0$이면 $c=-a^2$, $k=1$, $\lvert2a\rvert=1$.
    steps:
    - id: 1a
      content: |
        $(0,0)$, $\left(\dfrac12,0\right)$, $\left(-\dfrac12,0\right)$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '(나)에서 $f(x)-x^2$의 차수는 몇 이하인가? 그때 일차항 계수는?'
    - '$a=0$인 경우와 $a\neq0$인 경우로 나누어 (다)를 살펴보자.'
  - id: S1-B
    audience: B
    source_flow: '선행학습 보고서 문항카드 [E 15] 5. 문항 해설(PDF 332~333쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (나)로부터 $f(x)=x^2+bx+c$로 놓을 수 있고, (가)로부터 $b=0$. 따라서 $f(x)=x^2+c$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (1) $a=0$이면, (다)로부터 $\displaystyle\lim_{x\to0}\left\lvert\frac{x^2+c}{x^k}\right\rvert=1$인데 $k=1$이면 어떤 상수 $c$에 대해서도 (다)를 만족시키지 못한다. $k=2$일 때 (다)가 성립하려면 $c=0$이어야 하고, $k>2$이면 (다)가 성립하지 않는다. 따라서 $(0,0)$은 구하는 순서쌍이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        (2) $a\neq0$일 때 극한 $\displaystyle\lim_{x\to a}\left\lvert\frac{f(x)}{(x-a)^k}\right\rvert=1$이 존재하려면 $f(a)=a^2+c=0$이므로 $f(x)=x^2-a^2$. $k=1$이면 $\displaystyle\lim_{x\to a}\left\lvert\frac{(x-a)(x+a)}{x-a}\right\rvert=\lvert2a\rvert=1$. $a=\pm\dfrac12$이므로 $\left(\dfrac12,0\right)$와
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $\left(-\dfrac12,0\right)$는 구하는 순서쌍이다. $k\ge2$이면 극한 $\displaystyle\lim_{x\to a}\left\lvert\frac{x^2-a^2}{(x-a)^k}\right\rvert=\lim_{x\to a}\left\lvert\frac{x+a}{(x-a)^{k-1}}\right\rvert$가 존재하지 않는다. 따라서 구하는 순서쌍은 $(0,0)$, $\left(\dfrac12,0\right)$와 $\left(-\dfrac12,0\right)$뿐이다.
      criteria: ['1.A3']
