intent: |
  제시문의 상황에서 주어진 조건과 함수의 극한의 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 극한 조건으로 다항함수의 차수·계수를 정하고 $a=0$, $a\neq0$으로 나누어 $k$와 상수를 결정한다.
key_idea: |
  (나)에서 $f(x)-x^2$은 일차 이하이므로 $f(x)=x^2+bx+c$, (가)에서 $b=0$; (다)는 $a=0$이면 $c=0,\ k=2$, $a\neq0$이면 $f(a)=0,\ k=1,\ \lvert2a\rvert=1$.
stuck: |
  (다)의 극한이 0이 아닌 유한값이 되려면 $(x-a)^k$와 같은 차수로 $f$가 0이 되어야 한다는 것을 경우별로 쓰는 것.
