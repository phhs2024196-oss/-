stimuli: []
stem: |
  다음 로그함수 $y=\log_a(x-1)$ $(a>0,\ a\neq1)$의 성질에 관한 내용을 완성하시오.

  1) $a>1$일 때, $x$의 값이 증가하면 $y$의 값은 증가한다.
     $0<a<1$일 때, $x$의 값이 증가하면 $y$의 값은 [ ① ]한다.
  2) $a$의 값에 관계없이 그래프는 점 ( [ ② ] )을 지난다.
  3) 함수 $y=\log_a(x-1)$의 그래프와 함수 $y=$ [ ③ ]의 그래프는 $x$축에 대하여 대칭이다.
  4) 함수 $y=$ [ ④ ]의 그래프는 함수 $y=\log_a(x-1)$의 그래프를 $x$축의 방향으로 $3$만큼, $y$축의 방향으로 $2$만큼 평행이동한 것이다.
