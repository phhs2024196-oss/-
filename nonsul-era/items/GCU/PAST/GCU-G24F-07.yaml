intent: |
  제시문의 상황에서 로그함수의 그래프의 성질을 이용하여 단계별로 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 밑의 범위에 따른 증감, 지나는 점, 대칭이동·평행이동을 빈칸으로 확인한다.
key_idea: |
  $y=\log_a(x-1)$은 $y=\log_a x$를 $x$축 방향으로 1만큼 평행이동한 것이므로 정점 $(2,0)$을 지나고, $x$축 대칭은 $y\to -y$, 평행이동은 $x\to x-3$, $y\to y-2$로 바꾼다.
stuck: '평행이동할 때 $x$ 대신 $x-3$을 넣어야 하는데 $x+3$을 넣거나, $(x-1)$ 안에 다시 $-3$을 더해 $x-4$를 만드는 단계를 놓치기 쉽다.'
