stem: |
  다항함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $\displaystyle\lim_{x\to\infty}f\left(\frac{1}{x}\right)=-3$
  (나) 모든 실수 $x$에 대하여 $f(x)=3x^2-4x+2x\displaystyle\int_0^2 f(t)\,dt+a$

  $f'(a)$의 값을 구하는 과정을 서술하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: '$f''(a)$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-18'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '(가)에서 $a=f(0)=-3$, $\int_0^2f=b$로 두면 $b=4b-6$.'
    steps:
    - id: 1a
      content: '$a=-3$, $b=2$, $f(x)=3x^2-3$, $f''(-3)=-18$'
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - '$x\to\infty$일 때 $\frac1x$은 어디로 가는가?'
    - '$\int_0^2f(t)\,dt$는 상수이다.'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [F 8](PDF 336쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: '$\displaystyle\lim_{x\to\infty}f\left(\frac1x\right)=-3$이므로 $a=-3$.'
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        $\displaystyle\int_0^2f(t)\,dt=b$라 놓으면 $f(x)=3x^2-4x+2bx-3$이므로
        $$b=\int_0^2(3t^2-4t+2bt-3)\,dt=\Big[t^3-2t^2+bt^2-3t\Big]_0^2=4b-6$$
        따라서 $b=2$, $f(x)=3x^2-3$.
      criteria:
      - 1.A1
    - id: '1b-3'
      content: '$f''(x)=6x$이므로 $f''(a)=f''(-3)=6\times(-3)=-18$.'
      criteria:
      - 1.A2
