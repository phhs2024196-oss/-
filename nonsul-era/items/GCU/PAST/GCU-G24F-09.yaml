stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여 $\displaystyle\int_a^x f(t)\,dt=x^3-x^2-6x$를 만족시킬 때, $f(a)$의 값을 구하는 과정을 서술하시오. (단, $a$는 양수이다.)
subparts:
- id: '1'
  stem: '$f(a)$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '15'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$x=a$ 대입 → $a(a-3)(a+2)=0$, $a=3$; 미분 → $f(x)=3x^2-2x-6$.'
    steps:
    - id: 1a
      content: '$a=3$, $f(x)=3x^2-2x-6$, $f(3)=15$'
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - '$\int_a^a f(t)\,dt$의 값은?'
    - '양변을 $x$에 대해 미분해 보자.'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [F 9](PDF 338쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $\displaystyle\int_a^xf(t)\,dt=x^3-x^2-6x$ (이하 (1)식)에서 $x=a$를 대입하면 $0=a^3-a^2-6a=a(a-3)(a+2)$. $a$가 양수이므로 $a=3$.
      criteria:
      - 1.M1
    - id: '1b-2'
      content: '(1)식의 양변을 미분하면 $f(x)=3x^2-2x-6$.'
      criteria:
      - 1.A1
    - id: '1b-3'
      content: '$f(a)=f(3)=27-6-6=15$.'
      criteria:
      - 1.A2
