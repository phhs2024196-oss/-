stimuli: []
stem: |
  $x>0$에서 정의된 함수 $f(x)=\dfrac{x^{\frac{1}{2}}}{\sqrt[7]{x^2}}$에 대하여 $\{f(f(n))\}^{49}$의 값이 $1000$보다 큰 자연수가 되도록 하는 자연수 $n$의 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: '자연수 $n$의 최솟값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '81'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '지수 정리로 $n^{\frac94}$을 얻고 $n=k^4$, $k^9>1000$.'
    steps:
    - id: 1a
      content: '$f(x)=x^{\frac3{14}}$, $\{f(f(n))\}^{49}=n^{\frac94}$, $n=3^4=81$'
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - '$\sqrt[7]{x^2}$를 $x$의 거듭제곱으로 쓰면?'
    - '$n^{\frac94}$이 자연수가 되려면 $n$은 어떤 꼴이어야 하는가?'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [F 10](PDF 340쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: '$f(x)=\dfrac{x^{\frac12}}{\sqrt[7]{x^2}}=x^{\frac12-\frac27}=x^{\frac3{14}}$'
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        $\{f(f(n))\}^{49}=\left\{\left(n^{\frac3{14}}\right)^{\frac3{14}}\right\}^{49}=n^{\frac3{14}\times\frac3{14}\times49}=n^{\frac94}$
      criteria:
      - 1.A1
    - id: '1b-3'
      content: |
        $n^{\frac94}$이 자연수가 되려면 $n$은 자연수 $k$에 대하여 $n=k^4$의 꼴이어야 한다. 즉 $n$은 $2^4,3^4,4^4,\cdots$가 될 수 있는데 $n=2^4$일 경우 $n^{\frac94}=2^{4\times\frac94}=2^9=512$이므로 1000보다 작다. 따라서 조건을 만족시키는 가장 작은 자연수 $n$은 $3^4=81$이다.
      criteria:
      - 1.A2
