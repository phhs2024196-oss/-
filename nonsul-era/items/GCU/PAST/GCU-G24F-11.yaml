intent: |
  제시문의 상황에서 수열의 합이 주어졌을 때, 일반항을 구하는 방법을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 부분분수로 소거되는 합을 계산한다.
key_idea: |
