stem: |
  첫째항이 $a_1$이고 제$n$항까지의 합이 $S_n=\dfrac32a_1n^2-\dfrac12a_1n$인 등차수열 $\{a_n\}$에 대하여 $\displaystyle\sum_{k=1}^{4}\frac{7}{a_{2k}a_{2k+2}}=1$일 때, $a_5$의 값을 구하는 과정을 서술하시오. (단, $a_1>0$)
subparts:
- id: '1'
  stem: '$a_5$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 13/2
    equivalents:
    - '$\frac{13}{2}$'
    - '6.5'
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$a_n=(3n-2)a_1$, 망원합으로 $\frac{1}{4a_1^2}=1$.'
    steps:
    - id: 1a
      content: '$d=3a_1$, $a_1=\frac12$, $a_5=13a_1=\frac{13}2$'
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - '$a_n=S_n-S_{n-1}$을 계산해 보자.'
    - '$\frac{1}{a_{2k}a_{2k+2}}$을 두 분수의 차로 나타내면?'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [F 11](PDF 342쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $a_n=S_n-S_{n-1}=\frac32a_1n^2-\frac12a_1n-\left(\frac32a_1(n-1)^2-\frac12a_1(n-1)\right)=3a_1n-2a_1$이다. 따라서 등차수열 $\{a_n\}$의 공차 $d=3a_1$이다.
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        $$\sum_{k=1}^{4}\frac{7}{a_{2k}a_{2k+2}}=\sum_{k=1}^{4}\frac{7}{a_{2k+2}-a_{2k}}\left(\frac1{a_{2k}}-\frac1{a_{2k+2}}\right)=\frac{7}{2d}\left(\frac1{a_2}-\frac1{a_{10}}\right)=\frac7{2d}\left(\frac1{a_1+d}-\frac1{a_1+9d}\right)$$
        공차 $d=3a_1$이므로 $\dfrac7{6a_1}\left(\dfrac1{4a_1}-\dfrac1{a_1+27a_1}\right)=\dfrac7{6a_1}\left(\dfrac7{28a_1}-\dfrac1{28a_1}\right)=\dfrac1{4a_1^2}=1$
        $\therefore a_1=\frac12$ $(a_1>0)$
      criteria:
      - 1.A1
    - id: '1b-3'
      content: '$a_5=\frac12+4\times\frac32=\frac{13}2$'
      criteria:
      - 1.A2
