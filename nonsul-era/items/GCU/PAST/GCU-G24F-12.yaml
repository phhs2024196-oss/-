stimuli: []
stem: |
  다음 조건을 만족시키는 최고차항의 계수가 $1$인 모든 사차함수 $f(x)$에 대하여 $f(2)$의 최댓값과 최솟값을 구하는 과정을 서술하시오.

  (가) $\displaystyle\lim_{x\to1}\frac{f(x)}{x-1}=4$
  (나) 모든 실수 $x$에 대하여 $|f(x)|\le|xg(x)|$, $g(0)=-4$인 연속함수 $g(x)$가 존재한다.
subparts:
- id: '1'
  stem: '$f(2)$의 최댓값과 최솟값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '최댓값 28, 최솟값 12'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$f(x)=x(x-1)(x^2+ax+b)$, $a+b=3$, $|f''(0)|=|b|\le4$에서 $-1\le a\le7$.'
    steps:
    - id: 1a
      content: '$f(2)=2a+14$, $-1\le a\le 7$이므로 최솟값 $12$, 최댓값 $28$'
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - '(가)에서 $f(1)$의 값은?'
    - '(나)에 $x=0$을 넣어 보자.'
    - '$x\neq0$일 때 양변을 $|x|$로 나누면?'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [F 12](PDF 344쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        조건 (가)로부터 $f(1)=0$. 조건 (나)에서 $0\le|f(0)|\le|0\cdot g(0)|=0$이므로 $f(0)=0$. 따라서 $f(x)=x(x-1)(x^2+ax+b)$로 놓을 수 있다. (가)에서 $4=\displaystyle\lim_{x\to1}\frac{f(x)}{x-1}=\lim_{x\to1}x(x^2+ax+b)=1+a+b$이므로 $a+b=3$.
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        $x\neq0$일 때 $\left|\dfrac{f(x)}{x}\right|\le|g(x)|$이므로 $-|g(x)|\le\dfrac{f(x)}{x}\le|g(x)|$으로부터 $-|g(0)|\le\displaystyle\lim_{x\to0}\frac{f(x)-f(0)}{x}\le|g(0)|$. 즉 $-4\le f'(0)\le4$이다. $f(x)=(x^2-x)(x^2+ax+b)$를 미분하면 $f'(x)=(2x-1)(x^2+ax+b)+(x^2-x)(2x+a)$이므로 $f'(0)=-b$.
      criteria:
      - 1.M2
    - id: '1b-3'
      content: |
        $-4\le-b\le4$, 즉 $-4\le a-3\le4$이므로 $-1\le a\le7$. 따라서 $f(2)=2a+14$이므로 $f(2)$의 최솟값은 $a=-1$일 때인 $12$이다.
      criteria:
      - 1.A1
    - id: '1b-4'
      content: '또한 $f(2)$의 최댓값은 $a=7$일 때인 $28$이다.'
      criteria:
      - 1.A2
