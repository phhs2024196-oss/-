stem: |
  다음 조건을 만족시키는 모든 일차 이상의 다항함수 $f(x)$에 대하여 $\displaystyle\int_0^6 f(x)\,dx$의 최솟값을 구하는 다음의 풀이 과정을 완성하시오.

  (가) 모든 실수 $x$에 대하여 $\displaystyle\int_{-\frac32}^{x}tf'(t)\,dt=\left(\frac23x+1\right)\{f(x)+k\}$이다. (단, $k$는 실수이다.)
  (나) $x$에 대한 방정식 $f(x)=m$이 실근을 갖도록 하는 실수 $m$의 최솟값은 $-9$이다.
  (다) $f(0)\ge0$

  [풀이] 다항함수 $f(x)$의 최고차항을 $ax^n$($n$은 자연수, $a$는 $0$이 아닌 상수)이라 하자. 조건 (가)에서 $\displaystyle\int_{-\frac32}^{x}tf'(t)\,dt=\left(\frac23x+1\right)\{f(x)+k\}$의 양변을 $x$에 대해 미분하고 최고차항을 비교하면 $n$의 값은 [ ① ]이다. 한편, 조건 (나)로부터 $k$의 값은 [ ② ]이다. 조건 (다)에서 $f(0)\ge0$이므로 $\displaystyle\int_0^6f(x)\,dx$의 값은 $a$의 값이 [ ③ ]일 때 최소이다. 따라서, $\displaystyle\int_0^6f(x)\,dx$의 최솟값은 [ ④ ]이다.
subparts:
- id: '1'
  stem: 빈칸 ①~④에 알맞은 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '① 2 ② 9 ③ 1 ④ -36'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '미분 후 최고차항 비교 $\frac{a}{3}n=\frac23a$에서 $n=2$; $f=a(x-3)^2-k$.'
    steps:
    - id: 1a
      content: '$n=2$, $k=9$, $f(0)=9a-9\ge0$에서 $a=1$일 때 $\int_0^6f=18a-54$ 최소 $-36$'
      criteria:
      - 1.B1
      - 1.B2
      - 1.B3
      - 1.B4
    hint_ladder:
    - '양변을 미분하면 $xf''(x)$가 나온다.'
    - 양변의 최고차항 계수를 비교해 보자.
    - '$f(x)$를 완전제곱 꼴로 바꾸면?'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [F 13](PDF 346쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        조건 (가)의 양변을 $x$에 대해 미분하면 $xf'(x)=\frac23\{f(x)+k\}+\left(\frac23x+1\right)f'(x)$이고, $\frac13xf'(x)=\frac23\{f(x)+k\}+f'(x)$로부터 좌변의 최고차항은 $\frac a3nx^n$, 우변의 최고차항은 $\frac23ax^n$. 따라서 $n=2$.
      criteria:
      - 1.B1
    - id: '1b-2'
      content: |
        $f(x)=ax^2+bx+c$를 $\frac13xf'(x)=\frac23\{f(x)+k\}+f'(x)$ 식에 대입하여 정리하면 $\frac b3=\frac23b+2a$, $\frac23(c+k)+b=0$. 따라서 $b=-6a$, $k=9a-c$.
        $f(x)=ax^2+bx+c=a(x-3)^2+c-9a=a(x-3)^2-k$. 한편, 조건 (나)로부터 $a>0$, $-k=-9$. 즉 $k$의 값은 $9$이다.
      criteria:
      - 1.B2
    - id: '1b-3'
      content: |
        따라서 $f(x)=a(x-3)^2-9$이다. 조건 (다)에서 $f(0)\ge0$이므로 $f(0)=0=f(6)$일 때 $\int_0^6f(x)\,dx$의 값이 최소이다. $a$의 값은 $1$이다.
      criteria:
      - 1.B3
    - id: '1b-4'
      content: '따라서 $\int_0^6f(x)\,dx$의 최솟값은 $-36$이다.'
      criteria:
      - 1.B4
