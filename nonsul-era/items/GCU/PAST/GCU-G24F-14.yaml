stimuli: []
stem: |
  원점 O에서 점 $\mathrm{A}(0,13)$을 지나고 기울기가 음인 직선 $l$에 내린 수선의 발을 H라 할 때, $\overline{\mathrm{OH}}=5$이다. 직선 $l$이 $x$축의 양의 방향과 이루는 각의 크기를 $\theta$라 할 때, $2\sin\theta-3\cos\theta$의 값을 구하는 과정을 서술하시오. (단, $\dfrac{\pi}{2}<\theta<\pi$)
subparts:
- id: '1'
  stem: '$2\sin\theta-3\cos\theta$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $\overline{AH}=12$, $\sin\alpha=\frac{12}{13}$, $\cos\alpha=\frac5{13}$, $\theta=\pi-\alpha$.
    steps:
    - id: 1a
      content: |
        $\sin\theta=\frac{12}{13}$, $\cos\theta=-\frac5{13}$, $2\sin\theta-3\cos\theta=\frac{39}{13}=3$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - '삼각형 $OAH$는 어떤 삼각형인가?'
    - '직선 $l$이 $x$축과 만나는 점을 $B$라 하고 삼각형 $AOB$를 보자.'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [F 14](PDF 348쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        삼각형 $OAH$는 직각삼각형이므로 $\overline{AH}=\sqrt{13^2-5^2}=12$이다. 이때 $\angle AOH=\alpha$라고 하면 $\sin\alpha=\frac{12}{13}$, $\cos\alpha=\frac5{13}$이다.
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        직선 $l$과 만나는 $x$축의 점을 $B$라 할 때, 삼각형 $AOH$와 삼각형 $AOB$는 닮음이고 $\angle AOH=\angle ABO$이다. 따라서 $\theta=\pi-\alpha$이다. 즉 $\sin\theta=\frac{12}{13}$, $\cos\theta=-\frac5{13}$.
      criteria:
      - 1.A1
    - id: '1b-3'
      content: |
        $2\sin(\pi-\alpha)-3\cos(\pi-\alpha)=2\sin\alpha+3\cos\alpha=2\cdot\frac{12}{13}+3\cdot\frac5{13}=\frac{39}{13}=3$
      criteria:
      - 1.A2
