stimuli: []
stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$가 모든 실수 $x$에 대하여
  $$\{f(x)\}^4-4x^2\{f(x)\}^2-4\{f(x)\}^2+16x^2=0$$
  을 만족시킨다. 함수 $f(x)$의 최댓값이 $0$이고 최솟값이 $-2$일 때, 함수 $g(x)=\dfrac{f(x)}{x}$의 $x=0$에서의 좌극한과 우극한을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: '$g(x)$의 $x=0$에서의 좌극한과 우극한을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '좌극한 2, 우극한 -2'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '인수분해로 $f(x)\in\{\pm2,\pm2x\}$, 조건으로 $0$ 근방에서 $f(x)=-2|x|$.'
    steps:
    - id: 1a
      content: '$\lim_{x\to0-}g(x)=2$, $\lim_{x\to0+}g(x)=-2$'
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - '$\{f(x)\}^2$을 한 문자로 보고 인수분해해 보자.'
    - '최댓값이 $0$이면 $f(0)$은?'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [F 15](PDF 350쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $\{f(x)\}^4-4x^2\{f(x)\}^2-4\{f(x)\}^2+16x^2=[\{f(x)\}^2-4][f(x)-2x][f(x)+2x]=0$이므로 모든 실수 $x$에 대하여 $f(x)$의 값은 $2$, $-2$, $2x$, 또는 $-2x$이다.
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        이때 실수 전체의 집합에서 연속이면서 $f(x)$의 최댓값이 $0$, 최솟값이 $-2$인 함수는 $f(x)=\begin{cases}-2|x| & (|x|\le1)\\ -2 & (|x|>1)\end{cases}$이므로 $\displaystyle\lim_{x\to0-}g(x)=\lim_{x\to0-}\frac{f(x)}{x}=\lim_{x\to0-}\frac{2x}{x}=2$
      criteria:
      - 1.A1
    - id: '1b-3'
      content: '$\displaystyle\lim_{x\to0+}g(x)=\lim_{x\to0+}\frac{f(x)}{x}=\lim_{x\to0+}\frac{-2x}{x}=-2$'
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
