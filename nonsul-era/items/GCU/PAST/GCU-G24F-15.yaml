intent: |
  제시문의 상황에서 주어진 조건과 함수의 극한을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 인수분해로 함숫값 후보를 찾고 연속·최대·최소 조건으로 함수를 확정한다.
key_idea: |
  주어진 식은 $[\{f(x)\}^2-4][f(x)-2x][f(x)+2x]=0$으로 인수분해되므로 $f(x)\in\{2,-2,2x,-2x\}$이고, 연속·최댓값 0·최솟값 $-2$에서 $f(x)=-2|x|$ $(|x|\le1)$, $-2$ $(|x|>1)$.
stuck: '네 가지 값 중 연속성과 최대·최소 조건으로 $x=0$ 근방에서 $f(x)=-2|x|$임을 결정하는 것.'
