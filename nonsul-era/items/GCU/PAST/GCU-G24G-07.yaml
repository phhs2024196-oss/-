stimuli: []
stem: |
  $\log_{(-x)}(-2x^2-7x+15)$가 정의되기 위한 모든 정수 $x$의 값의 합을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: '모든 정수 $x$의 값의 합을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-9'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '밑: $x<0$, $x\neq-1$; 진수: $-5<x<\frac32$.'
    steps:
    - id: 1a
      content: '$x=-4,-3,-2$이므로 합은 $-9$'
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - '로그의 밑이 만족해야 할 조건 두 가지는?'
    - '$-2x^2-7x+15$를 인수분해해 보자.'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [G 7](PDF 352쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: '$\log_{(-x)}(-2x^2-7x+15)$에서 밑 $-x>0$, $-x\neq1$이므로 $x<0$, $x\neq-1$.'
      criteria:
      - 1.M1
    - id: '1b-2'
      content: '$-2x^2-7x+15>0\ \Rightarrow\ (2x-3)(-x-5)>0$이므로 $-5<x<\dfrac32$.'
      criteria:
      - 1.M2
    - id: '1b-3'
      content: '이 두 가지를 모두 만족시키는 $x=-4,-3,-2$이므로 모든 정수 $x$의 값의 합은 $-9$.'
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: '$x<0$, $x\neq-1$(채점기준 4점).'
      depends_on: []
      implied_ok: false
      steps:
      - '1b-1'
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: '$(2x-3)(-x-5)>0$ (또는 $(2x-3)(x+5)<0$, 또는 $-5<x<\frac32$)(채점기준 2점).'
      depends_on: []
      implied_ok: false
      steps:
      - '1b-2'
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: '$-9$(채점기준 4점).'
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - '1b-3'
    deductions: []
