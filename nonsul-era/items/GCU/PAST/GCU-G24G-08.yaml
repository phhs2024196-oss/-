stimuli: []
stem: |
  함수 $f(x)=2\sin\left(\dfrac{3\pi}{2}+x\right)\cos(x+\pi)+\sin(\pi-x)+1$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M+m$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: '$M+m$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 25/8
    equivalents:
    - '$\frac{25}{8}$'
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$f=-2t^2+t+3$ $(t=\sin x,\ -1\le t\le1)$.'
    steps:
    - id: 1a
      content: '$M=\frac{25}8$ ($t=\frac14$), $m=f(-1)=0$, $M+m=\frac{25}8$'
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - '$\sin\left(\frac{3\pi}{2}+x\right)$와 $\cos(x+\pi)$를 $\cos x$로 나타내 보자.'
    - '$\sin x=t$로 놓으면 $t$의 범위는?'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [G 8](PDF 354쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $\sin\left(\dfrac{3\pi}2+x\right)=-\cos x$이고, $\cos(x+\pi)=-\cos x$이다. $\cos^2x=1-\sin^2x$이므로 주어진 식은 $y=-2\sin^2x+\sin(\pi-x)+3$이다. $\sin(\pi-x)=\sin x$이므로 $f(x)=-2\sin^2x+\sin x+3$.
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        $t=\sin x$라 하면 $f(t)=-2t^2+t+3=-2\left(t-\dfrac14\right)^2+\dfrac{25}8$이다. 정의역은 $[-1,1]$이므로 최댓값은 $M=\dfrac{25}8$이다.
      criteria:
      - 1.M2
    - id: '1b-3'
      content: '최솟값은 $f(-1)=0$, $f(1)=2$이므로 $m=0$이다.'
      criteria:
      - 1.A1
    - id: '1b-4'
      content: '따라서 $M+m=\dfrac{25}8$이다.'
      criteria:
      - 1.A2
  rubric:
