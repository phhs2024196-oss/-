  제시문의 상황에서 수열의 귀납적 정의와 추론을 이용하여 단계별로 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 거꾸로 항을 결정하고 주기성을 찾아 개수를 센다.
