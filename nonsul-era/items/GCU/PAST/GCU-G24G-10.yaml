stimuli: []
stem: |
  다항함수 $f(x)=x^3-2ax^2+x+3$이 일대일 함수일 때, 실수 $a$의 최댓값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: '실수 $a$의 최댓값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: sqrt(3)/2
    equivalents:
    - '$\frac{\sqrt3}{2}$'
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$f''(x)=3\left(x-\frac23a\right)^2+1-\frac43a^2\ge0$.'
    steps:
    - id: 1a
      content: '$a^2\le\frac34$이므로 $a$의 최댓값은 $\frac{\sqrt3}2$'
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 일대일인 삼차함수는 증가함수이다.
    - '$f''(x)\ge0$이 모든 $x$에서 성립할 조건은?'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [G 10](PDF 358쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $f'(x)=3x^2-4ax+1=3\left(x-\dfrac23a\right)^2+1-\dfrac43a^2\ge0$이 모든 $x$에 대하여 성립할 때 $f$는 증가함수이고 일대일 함수이다.
      criteria:
      - 1.M1
    - id: '1b-2'
      content: '따라서 $1-\dfrac43a^2\ge0$일 때(또는 $f''(x)=0$의 판별식 $16a^2-12\le0$), $f$는 일대일 함수이므로'
      criteria:
      - 1.M2
    - id: '1b-3'
      content: '$a$의 최댓값은 $\dfrac{\sqrt3}2$.'
      criteria:
      - 1.A1
  - id: 'S1-ALT'
    audience: ALT
    method_no: 2
    source_flow: |
      문항카드 [G 10] 5. 문항 해설 풀이 1 — 이계도함수 $f''$를 쓰는 방법(수학Ⅱ 범위 밖, 같은 해 모의 A형 답안에 '교재에는 없는 방법' 명시). 참고 풀이.
    steps:
    - id: '1c-1'
      content: |
        도함수 $f'(x)=3x^2-4ax+1$의 값이 $0$ 이상이 되는 실수 $a$의 최댓값을 구하면 충분하다. 이 함수는 $f''(x)=6x-4a=0$일 때, 즉 $x=\frac23a$일 때 최솟값을 갖는다.
      criteria:
      - 1.M1
    - id: '1c-2'
      content: |
        $f'\left(\frac23a\right)=-\frac43a^2+1$이 최솟값이고, $0$ 이상이 되기 위해서는 $-\frac43a^2+1\ge0$, $a^2\le\frac34$. 따라서 $a$의 최댓값은 $\frac{\sqrt3}2$이다.
      criteria:
      - 1.M2
      - 1.A1
