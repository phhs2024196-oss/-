stimuli: []
stem: |
  자연수 $n$에 대하여 $6\log_8\left(\dfrac{7}{3n+17}\right)$의 값이 정수가 되도록 하는 $100$ 이하의 모든 $n$의 값을 구하는 다음의 풀이 과정을 완성하시오.

  [풀이] $6\log_8\left(\dfrac7{3n+17}\right)$이 정수가 되려면 $\left(\dfrac7{3n+17}\right)^2=2^m$ ($m$은 정수) $\cdots\cdots$ ㉠ 이어야 한다. 이때 $3n+17$은 $7$의 배수가 되어야 하므로 $n=7k-1$ ($k$는 $1\le k\le$ [ ① ]인 자연수)이어야 한다. $n=7k-1$을 ㉠에 대입하면 $\left(\dfrac1{3k+2}\right)^2=2^m$이며, 이 식을 성립시키기 위해서는 $3k+2$는 $2$의 거듭제곱이어야 한다. 위의 조건을 만족시키는 자연수 $k$의 값을 구하면 $k=$ [ ② ] 또는 $k=$ [ ③ ]이다. 따라서 모든 $n$의 값의 합은 [ ④ ]이다.
subparts:
- id: '1'
  stem: 빈칸 ①~④에 알맞은 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: ① 14 ② 2 ③ 10 ④ 82
    equivalents:
    - ② 10 ③ 2 (순서 무관)
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$1\le k\le14$에서 $5\le3k+2\le44$인 2의 거듭제곱 $8,16,32$ 중 가능한 것 $8,32$.'
    steps:
    - id: 1a
      content: '$k=2,10$, $n=13,69$, 합 $82$'
      criteria:
      - 1.B1
      - 1.B2
      - 1.B3
      - 1.B4
    hint_ladder:
    - '$6\log_8X$를 밑이 2인 로그로 바꿔 보자.'
    - '$n\le100$이면 $k$의 범위는?'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [G 11](PDF 360쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $6\log_8\left(\frac7{3n+17}\right)=\log_2\left(\frac7{3n+17}\right)^2$. 이 값이 정수가 되려면 $\left(\frac7{3n+17}\right)^2=2^m$ ($m$은 정수) ㉠ 이어야 한다. 이때 $3n+17$은 7의 배수가 되어야 하므로 $n=7k-1$ ($k$는 $1\le k\le14$인 자연수)이어야 한다.
      criteria:
      - 1.B1
    - id: '1b-2'
      content: |
        $n=7k-1$을 ㉠에 대입하면 $\left(\frac1{3k+2}\right)^2=2^m$. $(3k+2)^2=2^{-m}$이므로 $3k+2$는 2의 거듭제곱이어야 한다. $1\le k\le14$일 때 $5\le3k+2\le44$에서의 2의 거듭제곱은 $8,16,32$이다. $3k+2=8$, $3k+2=16$, $3k+2=32$에서 $k=2$
      criteria:
      - 1.B2
    - id: '1b-3'
      content: '또는 $k=10$.'
      criteria:
      - 1.B3
    - id: '1b-4'
      content: '따라서 $n=13$ 또는 $n=69$이므로 모든 $n$의 값의 합은 $82$이다.'
      criteria:
      - 1.B4
