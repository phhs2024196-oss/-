stimuli: []
stem: |
  곡선 $y=ax^3-2x$ $(a>0)$과 원 $x^2+y^2=\dfrac1{18}$의 서로 다른 교점의 개수가 $4$가 되도록 하는 모든 $a$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: '모든 $a$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: set
    value: '{100/3, 36}'
    equivalents:
    - '$a=\frac{100}{3}$ 또는 $a=36$'
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$t=x^2$로 두면 $g(t)=a^2t^3-4at^2+5t-\frac1{18}$, 극값 위치 $t=\frac1a,\frac5{3a}$.'
    steps:
    - id: 1a
      content: |
        $g\left(\frac5{3a}\right)=\frac{50}{27a}-\frac1{18}=0$ 또는 $g\left(\frac1a\right)=\frac2a-\frac1{18}=0$에서 $a=\frac{100}3$ 또는 $a=36$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - '원의 방정식에 $y=ax^3-2x$를 대입해 보자.'
    - '$x^2=t$로 놓으면 교점 4개는 양근 몇 개에 해당하는가?'
    - '삼차함수가 서로 다른 두 실근을 가질 조건은?'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [G 12](PDF 362쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        곡선 $y=ax^3-2x$ $(a>0)$과 원 $x^2+y^2=\frac1{18}$의 서로 다른 교점의 개수가 4가 되기 위해서는 방정식 $x^2+(ax^3-2x)^2=\frac1{18}$, 즉 $a^2x^6-4ax^4+5x^2-\frac1{18}=0$이 서로 다른 4개의 실근을 가져야 한다.
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        이때 $x^2=t$ $(t\ge0)$이라 하면 $a^2t^3-4at^2+5t-\frac1{18}=0$이고 이 방정식이 서로 다른 두 개의 양의 실근을 가져야 한다. 따라서 $f(t)=a^2t^3-4at^2+5t-\frac1{18}$이라 하면 $f'(t)=3a^2t^2-8at+5=(3at-5)(at-1)$에서 방정식 $f'(t)=0$의 해는 $t=\frac5{3a}$ 또는 $t=\frac1a$.
      criteria:
      - 1.M2
    - id: '1b-3'
      content: |
        $f(t)=0$이 두 개의 양의 실근을 가지려면 $f\left(\frac5{3a}\right)=\frac{50}{27a}-\frac1{18}=0$에서 $a=\frac{100}3$
      criteria:
      - 1.A1
    - id: '1b-4'
      content: '또는 $f\left(\frac1a\right)=\frac2a-\frac1{18}=0$이어야 하므로 $a=36$.'
      criteria:
      - 1.A2
