intent: |
  제시문의 상황에서 주어진 조건과 적분의 활용을 이용하여 속도, 가속도에 대한 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 위치 조건으로 $k$를 정하고 속도의 부호가 바뀌는 시각에서 나누어 거리를 구한다.
key_idea: |
  $1+\int_0^1v(t)\,dt=17$에서 $k=24$; $v(t)=3(t-2)(t-4)$는 $t=2$에서 부호가 바뀌므로 $\int_0^3|v|\,dt$를 $[0,2]$, $[2,3]$으로 나눈다.
stuck: '움직인 거리는 $\int|v(t)|\,dt$이므로 속도의 부호가 바뀌는 $t=2$에서 구간을 나눠야 한다.'
