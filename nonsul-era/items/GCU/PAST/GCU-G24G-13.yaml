stimuli: []
stem: |
  수직선 위를 움직이는 점 P의 시각 $t$ $(t\ge0)$에서의 속도 $v(t)$가 $v(t)=3t^2-18t+k$이다. 시각 $t=0$에서의 점 P의 위치는 $1$이고 시각 $t=1$에서의 점 P의 위치는 $17$이다. 점 P가 시각 $t=0$에서 $t=3$까지 움직인 거리를 구하는 과정을 서술하시오. (단, $k$는 상수이다.)
subparts:
- id: '1'
  stem: '점 P가 시각 $t=0$에서 $t=3$까지 움직인 거리를 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '22'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$k=24$, $v(t)=3(t-2)(t-4)$.'
    steps:
    - id: 1a
      content: '$\int_0^2v\,dt=20$, $\int_2^3(-v)\,dt=2$, 거리 $22$'
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - '$t=1$에서의 위치를 정적분으로 나타내 보자.'
    - '$v(t)$가 음수가 되는 구간은?'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [G 13](PDF 364쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        시각 $t=0$에서의 점 P의 위치는 1이고, 시각 $t=1$에서의 점 P의 위치는 17이므로 $1+\displaystyle\int_0^1v(t)\,dt=1+\Big[t^3-9t^2+kt\Big]_0^1=k-7=17$, $\therefore k=24$
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        시각 $t=0$에서 $t=3$까지 점 P가 움직인 거리는 $\displaystyle\int_0^3|v(t)|\,dt=\int_0^2(3t^2-18t+24)\,dt+\int_2^3(-3t^2+18t-24)\,dt$
      criteria:
      - 1.M2
    - id: '1b-3'
      content: '$\displaystyle\int_0^2(3t^2-18t+24)\,dt=20$'
      criteria:
      - 1.A1
    - id: '1b-4'
      content: '$\displaystyle\int_2^3(-3t^2+18t-24)\,dt=2$이므로 움직인 거리는 $20+2=22$.'
      criteria:
      - 1.A2
