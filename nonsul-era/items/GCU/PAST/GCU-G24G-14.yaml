intent: |
  제시문의 상황에서 주어진 조건과 등비수열의 일반항을 이용하여 복잡한 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 공비의 범위와 첫째항의 부호로 경우를 나누어 집합의 최대·차대 원소를 결정한다.
key_idea: |
  $|r|>1$이면 $\alpha_1,\alpha_2=a_{10}^2,a_9^2$, $|r|<1$이면 $a_1^2,a_2^2$이고, $B$의 큰 두 원소는 $r$과 첫째항의 부호에 따라 달라진다. 조건을 만족하는 경우는 $-1<r<0$ (첫째항 양수)뿐이며 $a_1=3$, $r=-\frac23$.
