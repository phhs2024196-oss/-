stem: |
  첫째항이 정수이고 모든 항이 서로 다른 등비수열 $\{a_n\}$에 대하여 두 집합 $A$, $B$는 다음과 같다.

  (가) $A=\{\,a_k^2\mid a_k\text{는 수열 }\{a_n\}\text{의 항, }k\text{는 }1\le k\le10\text{인 자연수}\,\}$
  (나) $B=\{\,(-1)^{k+1}a_k\mid a_k\text{는 수열 }\{a_n\}\text{의 항, }k\text{는 }1\le k\le10\text{인 자연수}\,\}$

  집합 $A$의 원소를 큰 수부터 차례로 $\alpha_1,\alpha_2,\alpha_3,\cdots,\alpha_{10}$이라 하고, 집합 $B$의 원소를 큰 수부터 차례로 $\beta_1,\beta_2,\beta_3,\cdots,\beta_{10}$이라 하자. $\dfrac{\alpha_1}{\alpha_2}=\left(\dfrac{\beta_1}{\beta_2}\right)^2$, $\beta_2=2$, $\dfrac{\alpha_1-\alpha_2}{\beta_1-\beta_2}=5$일 때, $\alpha_2\times\beta_3$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: '$\alpha_2\times\beta_3$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 16/3
    equivalents:
    - '$\frac{16}{3}$'
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '경우 분류로 $-1<r<0$, 첫째항 양수만 가능; $a_1-a_2=5$, $-a_2=2$.'
    steps:
    - id: 1a
      content: '$a_1=3$, $r=-\frac23$, $\alpha_2\times\beta_3=a_2^2\times a_3=\frac{16}3$'
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - '$|r|>1$과 $|r|<1$일 때 $A$의 가장 큰 두 원소는?'
    - '$B$의 원소는 짝수 번째 항의 부호를 바꾼 것이다. $r<0$이면 어떻게 되는가?'
    - '$\frac{\alpha_1-\alpha_2}{\beta_1-\beta_2}$를 인수분해해 보자.'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [G 14](PDF 366쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        모든 항이 다른 등비수열에서 공비 $r$은 $0$, $1$, $-1$이 되어서는 안 된다. (가)에서 공비 $r$의 부호에 관계없이 $|r|>1$이면 $\alpha_1,\alpha_2$는 각각 $a_{10}^2,a_9^2$이고 그렇지 않으면 $a_1^2,a_2^2$가 된다. (나)에서는 짝수항에 $-1$을 곱하는데, 공비 $r$과 첫째항 부호에 따라 부호가 달라진다.
        1) $r>1$과 2) $0<r<1$에 대해서 $\frac{\alpha_1}{\alpha_2}=\left(\frac{\beta_1}{\beta_2}\right)^2$ 조건을 만족하지 않는다.
        3) $-1<r<0$의 경우, 첫째항이 음수이면 모든 항이 음수이므로 $\beta_1,\beta_2$는 $-a_{10},a_9$가 되어 $\frac{a_1^2}{a_2^2}\neq\left(\frac{a_{10}}{-a_9}\right)^2$이고, 첫째항이 양수이면 $B$집합의 모든 항이 양수가 되어 $\beta_1,\beta_2$는 $a_1,-a_2$가 되어 해당 조건을 만족한다.
        4) $r<-1$에 대해서 첫째항이 음수이면 $B$집합의 모든 항이 음수이고 $\beta_1,\beta_2$는 $a_1,-a_2$로 $\frac{a_{10}^2}{a_9^2}\neq\left(\frac{a_1}{-a_2}\right)^2$, 첫째항이 양수이면 $B$집합의 모든 항이 양수이고 $\beta_1,\beta_2$는 $-a_{10},a_9$가 되어 해당 조건을 만족한다.
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        상기 3)과 4) 경우에 대해서 $\frac{\alpha_1-\alpha_2}{\beta_1-\beta_2}=5$ 식을 풀이해 보면,
        3) $\frac{a_1^2-a_2^2}{a_1+a_2}=a_1-a_2=5$, $\beta_2=-a_2=2$이므로 $a_1=3$. 첫째항의 양의 정수 조건을 만족하고,
      criteria:
      - 1.A1
    - id: '1b-3'
      content: |
        $r=-\frac23$ $(-1<r<0)$이다.
        4) $\frac{a_{10}^2-a_9^2}{-a_{10}-a_9}=-a_{10}+a_9=5$이고 $\beta_2=a_9=2$이므로 $\frac{a_{10}}{a_9}=\frac{-3}2=r$ $(r<-1)$. $a_9=a_1\left(\frac{-3}2\right)^8=2$, $a_1=\frac{2^9}{3^8}$ 첫째항이 정수가 아니다.
      criteria:
      - 1.A2
    - id: '1b-4'
      content: |
        따라서 3)에서 $\alpha_2\times\beta_3=a_2^2\times a_3=(ar)^2ar^2=a^3r^4=27\times\frac{2^4}{3^4}=\frac{16}3$ (여기서 $a=a_1$).
      criteria:
      - 1.A3
