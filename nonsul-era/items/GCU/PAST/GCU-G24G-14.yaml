  misconceptions:
  - id: 'MC-ALG-8517'
    outcome_code: '71'
    wrong_work: |
      $\beta_3$을 $a_3$이 아닌 $-a_3$이나 $a_2^2$ 등으로 잘못 대응시키거나 $\alpha_2=a_1^2$로 두어 $\alpha_2\times\beta_3$을 $12$ 등으로 계산
    detect_cue: '답이 $\frac{16}{3}$이 아니다'
    feedback: |
      $-1<r<0$, $a_1>0$이면 $B$의 원소는 모두 양수이고 $a_1>-a_2>a_3>\cdots$ 순서입니다. $\alpha_2=a_2^2$, $\beta_3=a_3$입니다.
    remedy:
    - 'RL-1'
