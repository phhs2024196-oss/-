      depends_on:
      - 1.M1
      steps:
      - '1b-2'
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: '$r=-\frac23$(채점기준 2점).'
      depends_on:
      - 1.M1
      steps:
      - '1b-3'
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: '$\frac{16}{3}$(채점기준 2점).'
      depends_on:
      - 1.M1
      - 1.A1
      - 1.A2
      steps:
      - '1b-4'
    deductions: []
