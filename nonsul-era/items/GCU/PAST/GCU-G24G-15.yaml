stimuli: []
stem: |
  양의 실수 $t$에 대하여 직선 $y=-t$가 두 함수
  $$y=\frac{5}{x-3},\quad y=-\frac{2}{x-3}$$
  의 그래프와 만나는 점을 각각 A, B라 하고, 직선 $y=t$가 두 함수
  $$y=\frac1x-2,\quad y=-\frac3x-2$$
  의 그래프와 만나는 점을 각각 C, D라 하자. 사각형 ABCD의 넓이를 $f(t)$라 할 때, $\displaystyle\lim_{t\to\infty}f(t)$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: '$\lim_{t\to\infty}f(t)$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '11'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$\overline{AB}=\frac7t$, $\overline{CD}=\frac4{t+2}$, 높이 $2t$.'
    steps:
    - id: 1a
      content: '$f(t)=7+\frac{4t}{t+2}\to11$'
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - '$\frac{5}{x-3}=-t$를 $x$에 대해 풀어 보자.'
    - '$AB$와 $CD$는 서로 평행하다.'
  - id: 'S1-B'
    audience: B
    source_flow: '선행학습 보고서 문항카드 [G 15](PDF 368쪽~) 5. 문항 해설·6. 채점 기준'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        사각형 $ABCD$의 넓이는 두 삼각형 $ABC$와 $ACD$의 합이다(또는 사다리꼴 $ABCD$의 넓이로 구할 수도 있다). $A$의 $x$좌표는 $x=3-\frac5t$, $B$의 $x$좌표는 $x=3+\frac2t$.
      criteria:
      - 1.M1
    - id: '1b-2'
      content: '$C$의 $x$좌표는 $x=\frac1{t+2}$, $D$의 $x$좌표는 $x=\frac{-3}{t+2}$.'
      criteria:
      - 1.M2
    - id: '1b-3'
      content: |
        따라서 $f(t)=\frac12\times2t\times\left\{3+\frac2t-3+\frac5t\right\}+\frac12\times2t\times\left\{\frac1{t+2}-\frac{-3}{t+2}\right\}=7+\frac{4t}{t+2}$
      criteria:
      - 1.A1
    - id: '1b-4'
      content: |
        이므로 $\displaystyle\lim_{t\to\infty}f(t)=\lim_{t\to\infty}\left(7+\frac{4t}{t+2}\right)=11$.
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
