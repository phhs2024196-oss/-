intent: |
  제시문의 상황에서 새롭게 정의된 함수와 극한의 성질을 이용하여 문제를 해결할 수 있는지를 평가한다(문항카드 출제 의도 원문). 네 점의 좌표를 $t$로 나타내 사각형(사다리꼴) 넓이를 구하고 극한을 계산한다.
key_idea: |
  $AB$와 $CD$는 각각 직선 $y=-t$, $y=t$ 위의 수평선분이므로 사각형 $ABCD$는 높이 $2t$인 사다리꼴: $f(t)=\frac12\cdot2t\left(\frac7t+\frac4{t+2}\right)$.
stuck: '네 점의 $x$좌표를 $t$로 정확히 구하고, 넓이가 높이 $2t$와 두 밑변의 곱으로 정리되는 것.'
