intent: |
  삼각함수의 성질과 그래프를 이용하여 삼각함수의 값을 구한다(문항카드 출제 의도 원문). 각 변환 공식으로 식을 $\tan\theta$, $\cos\theta$로 정리하고 동경의 사분면으로 부호를 정한다.
key_idea: |
  $\sin\theta=-\dfrac{1}{\sqrt6}$, $\cos\theta<0$이므로 $\theta$는 제3사분면의 각이고, 반지름 $\sqrt6$인 원 위의 점 $(-\sqrt5,-1)$로 삼각함수 값을 읽는다.
stuck: |
