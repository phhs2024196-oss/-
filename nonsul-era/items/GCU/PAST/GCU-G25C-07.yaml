stimuli: []
stem: |
  $0\le\theta<2\pi$에 대하여 $\cos\left(\dfrac{\pi}{2}+\theta\right)=\dfrac{1}{\sqrt{6}}$이고 $\cos\theta<0$일 때,
  $\tan^{2}(\pi+\theta)+\sqrt{5}\tan\theta+3\sin^{2}\left(\dfrac{3}{2}\pi+\theta\right)$
  의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    주어진 식의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \frac{37}{10}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      각 변환으로 $\tan^2\theta+\sqrt5\tan\theta+3\cos^2\theta$로 바꾸고 제3사분면에서 값을 구한다.
    steps:
    - id: 1a
      content: |
        $\sin\theta=-\frac{1}{\sqrt6}$, 제3사분면 $\Rightarrow \cos\theta=-\frac{\sqrt5}{\sqrt6}$, $\tan\theta=\frac{1}{\sqrt5}$ $\Rightarrow \frac15+1+\frac52=\frac{37}{10}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $\cos\left(\frac{\pi}{2}+\theta\right)$를 $\sin\theta$로 나타내 보자.
    - |
      $\sin\theta<0$, $\cos\theta<0$이면 $\theta$는 몇 사분면의 각인가?
  - id: S1-B
    audience: B
    source_flow: 해설_자연.hwp 문항카드(수학 자연 7번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\cos\left(\dfrac{\pi}{2}+\theta\right)=-\sin\theta=\dfrac{1}{\sqrt6}$이고 $\cos\theta<0$이므로 $\theta$는 제3사분면 위의 각이고,
        $\tan^{2}(\pi+\theta)+\sqrt5\tan\theta+3\sin^{2}\left(\dfrac32\pi+\theta\right)=\tan^2\theta+\sqrt5\tan\theta+3\cos^2\theta$ 이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        각 $\theta$의 동경과 원점을 중심으로 하고 반지름이 $\sqrt6$인 원의 교점을 $\mathrm{A}$라 하면 $\mathrm{A}(-\sqrt5,-1)$이다. 삼각함수의 정의에 의해
        $\cos\theta=-\dfrac{\sqrt5}{\sqrt6}$이고 $\tan\theta=\dfrac{1}{\sqrt5}$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\therefore\ \tan^2\theta+\sqrt5\tan\theta+3\cos^2\theta=\left(\dfrac{1}{\sqrt5}\right)^2+\sqrt5\left(\dfrac{1}{\sqrt5}\right)+3\times\left(-\dfrac{\sqrt5}{\sqrt6}\right)^2=\dfrac15+1+\dfrac52=\dfrac{37}{10}$
      criteria:
      - 1.A2
