  misconceptions:
  - id: MC-ALG-8602
    outcome_code: '71'
    wrong_work: |
      $\frac13x^{-4}$를 $\frac{1}{3x^{4}}$이 아니라 $(3x)^{-4}$로 계산
    detect_cue: |
      $f(1)=\frac{1}{81}$ 등 잘못된 값이 나온다
    feedback: |
      계수 $\frac13$은 거듭제곱 밖에 있습니다. $\frac13x^{-4}=\frac{1}{3x^4}$입니다.
    remedy:
    - RL-MC-ALG-8602
