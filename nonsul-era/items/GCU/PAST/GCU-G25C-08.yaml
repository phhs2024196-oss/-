stimuli: []
stem: |
  함수 $f(x)=\begin{cases}\dfrac{1}{3}x^{-4} & (0<x\le 2)\\ \log_{3}x & (x>2)\end{cases}$ 에 대하여 $\displaystyle\sum_{n=1}^{3}f(f(f(n)))$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\sum_{n=1}^{3}f(f(f(n)))$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      33+16\log_3 2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $n=1,2,3$ 각각 세 번 합성한다.
    steps:
    - id: 1a
      content: |
        $3+(3+16\log_32)+27=33+16\log_32$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $f(1)$부터 차례로 구해 보자.
    - |
      $f(2)=\frac{1}{48}$은 $0<x\le2$에 속한다.
  - id: S1-B
    audience: B
    source_flow: 해설_자연.hwp 문항카드(수학 자연 8번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(1)=\dfrac13$, $f(f(1))=f\left(\dfrac13\right)=\dfrac13\left(\dfrac13\right)^{-4}=27$, $f(f(f(1)))=f(27)=3$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(2)=\dfrac13\times2^{-4}$, $f(f(2))=\dfrac13\left(\dfrac{1}{3\times16}\right)^{-4}=3^{3}2^{16}$, $f(f(f(2)))=f(3^{3}2^{16})=3+16\log_32$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $f(3)=\log_33=1$, $f(f(3))=\dfrac13(1)^{-4}=\dfrac13$, $f(f(f(3)))=f\left(\dfrac13\right)=\dfrac13\left(\dfrac13\right)^{-4}=27$
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $\displaystyle\sum_{n=1}^{3}f(f(f(n)))=3+3+16\log_32+27=33+16\log_32$
      criteria:
      - 1.A3
