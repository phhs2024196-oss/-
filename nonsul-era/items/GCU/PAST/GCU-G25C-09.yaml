stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$\int_{0}^{x}tf(t)\,dt=f(x)+ax^{3}+x^{2}+x-2$$
  를 만족시킬 때, $f(a)$의 값을 구하는 과정을 서술하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $f(a)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \frac{7}{3}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      차수 비교 → $f(x)=bx+c$, $x=0$ 대입 → $c=2$, 계수비교.
    steps:
    - id: 1a
      content: |
        $f(x)=-x+2$, $a=-\frac13$, $f(a)=\frac73$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $f$의 차수를 $n$이라 하고 양변의 차수를 비교해 보자.
    - |
      $x=0$을 대입하면?
  - id: S1-B
    audience: B
    source_flow: 해설_자연.hwp 문항카드(수학 자연 9번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$가 상수함수이면 성립하지 않는다. $f(x)=bx^{n}+\cdots+(\text{상수})$로 놓았을 때 $n$의 값은 $1$. 따라서 $f(x)=bx+c$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        주어진 식에서 $x$에 $0$을 대입하면 $0=f(0)-2=c-2$. 따라서 $c=2$, $f(x)=bx+2$.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\dfrac13bx^{3}+x^{2}=bx+2+ax^{3}+x^{2}+x-2=ax^{3}+(b+1)x$ 이므로 $b+1=0$, $a=\dfrac13b$.
        $b=-1$, $a=-\dfrac13$.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $f(x)=-x+2$이므로 $f(a)=f\left(-\dfrac13\right)=\dfrac13+2=\dfrac73$.
      criteria:
      - 1.A3
