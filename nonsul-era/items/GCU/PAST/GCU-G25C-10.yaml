stimuli: []
stem: |
  자연수 $k$에 대하여 $\sqrt[n]{(2^{k})^{7}}$의 값이 $8$의 배수가 되도록 하는 $2$ 이상의 자연수 $n$의 개수를 $f(k)$라 하자. < 보기 > 에서 옳은 것만을 있는 대로 고르는 과정을 서술하시오.

  < 보기 >
  ㄱ. $f(7)=2$
  ㄴ. $f(k)=2$를 만족시키는 $5$ 이하의 $k$의 개수는 $2$이다.
  ㄷ. $f(k)=5$를 만족시키는 $10$ 이하의 모든 $k$의 값의 합은 $24$이다.
subparts:
- id: '1'
  stem: |
    < 보기 > 에서 옳은 것만을 있는 대로 고르는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: choice
    value: ㄴ, ㄷ
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $2^{7k/n}$이 8의 배수 $\iff \frac{7k}{n}$이 3 이상의 자연수.
    steps:
    - id: 1a
      content: |
        $f(1..10)=0,1,2,3,2,5,1,5,4,5$ → ㄱ 거짓, ㄴ 참($k=3,5$), ㄷ 참($6+8+10$)
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $\sqrt[n]{(2^k)^7}$을 2의 거듭제곱으로 써 보자.
    - |
      $k=1$부터 10까지 표를 만들어 보자.
  - id: S1-B
    audience: B
    source_flow: 해설_자연.hwp 문항카드(수학 자연 10번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sqrt[n]{(2^{k})^{7}}$의 값이 $8$의 배수가 되기 위해서는 $2^{\frac{7k}{n}}$에서 $\dfrac{7k}{n}=m$이 $3$ 이상의 자연수이어야 한다.
        $k=1$: 없음, $f(1)=0$ / $k=2$: $n=2$, $f(2)=1$ / $k=3$: $n=3,7$, $f(3)=2$ / $k=4$: $n=2,4,7$, $f(4)=3$ / $k=5$: $n=5,7$, $f(5)=2$ /
        $k=6$: $n=2,3,6,7,14$, $f(6)=5$ / $k=7$: $n=7$, $f(7)=1$ / $k=8$: $n=2,4,7,8,14$, $f(8)=5$ / $k=9$: $n=3,7,9,21$, $f(9)=4$ / $k=10$: $n=2,5,7,10,14$, $f(10)=5$.
        ㄱ. $f(7)=1$이므로 거짓.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ㄴ. $f(k)=2$인 $5$ 이하의 $k$는 $k=3,5$ (즉 $f(3)=2$, $f(5)=2$)로 $2$개이므로 참.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        ㄷ. $f(k)=5$인 $10$ 이하의 $k$는 $k=6,8,10$이고 합은 $24$이므로 참.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        따라서 옳은 것은 ㄴ, ㄷ.
      criteria:
      - 1.A3
