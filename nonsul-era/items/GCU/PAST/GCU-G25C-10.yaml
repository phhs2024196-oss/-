intent: |
  거듭제곱근을 이해(문항카드 출제 의도 원문). $\sqrt[n]{(2^k)^7}=2^{7k/n}$이 8의 배수가 될 조건($\frac{7k}{n}$이 3 이상의 자연수)으로 $f(k)$를 세어 <보기>를 판정한다.
key_idea: |
  $f(k)$는 $7k$의 약수 $n\ (n\ge2)$ 중 $\frac{7k}{n}\ge3$인 것의 개수.
stuck: |
  '8의 배수'를 $\frac{7k}{n}\ge3$인 자연수 조건으로 바꾸는 것과 $k\le10$까지 빠짐없이 세는 것.
