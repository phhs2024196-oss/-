  misconceptions:
  - id: MC-CAL-8605
    outcome_code: '71'
    wrong_work: |
      $\left|x-\frac13\right|$를 약분해 $\frac{x^2+ax+5}{3(x+\frac{23}{3})}$의 극한을 $b$로 놓음
    detect_cue: |
      $b=\frac{1}{24}\left(\frac19+\frac a3+5\right)$를 하나의 식으로만 두고 $a$를 정하지 못한다
    feedback: |
      $|x-\frac13|$은 $x<\frac13$에서 $-(x-\frac13)$입니다. 좌극한과 우극한을 따로 구해 비교하세요.
    remedy:
    - RL-MC-CAL-8605
