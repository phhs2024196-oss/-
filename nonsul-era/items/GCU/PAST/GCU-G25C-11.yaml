stimuli: []
stem: |
  다항함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $\displaystyle\lim_{x\to\infty}\frac{f(x)}{9x^{2}-1}=\frac{1}{3}$　　(나) $\displaystyle\lim_{x\to\frac{1}{3}}\frac{9x^{2}-1}{f(x)}=\frac{1}{4}$

  $\displaystyle\lim_{x\to\frac{1}{3}}\frac{\left|x-\frac{1}{3}\right|\left(x^{2}+ax+5\right)}{f(x)}=b$를 만족시키는 두 상수 $a$, $b$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    두 상수 $a$, $b$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      a=-\frac{46}{3},\ b=0
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      (가)로 $f$는 최고차항 계수 3인 이차함수, (나)로 $\left(x-\frac13\right)$을 인수로 가짐.
    steps:
    - id: 1a
      content: |
        $f(x)=3\left(x-\frac13\right)\left(x+\frac{23}{3}\right)$, 좌우극한 $\mp\frac{1}{24}\left(\frac19+\frac a3+5\right)$ → $b=0$, $a=-\frac{46}{3}$
      criteria:
      - 1.M1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      (가)에서 $f$의 차수와 최고차항 계수는?
    - |
      $x\to\frac13^-$과 $x\to\frac13^+$에서 $|x-\frac13|$은 각각 무엇인가?
  - id: S1-B
    audience: B
    source_flow: 해설_자연.hwp 문항카드(수학 자연 11번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 $0$이 아닌 극한값이 존재하고 분모가 이차함수이므로 $f(x)$도 이차함수이다. $f(x)=\alpha x^2+\beta x+\gamma$로 놓으면
        $\displaystyle\lim_{x\to\infty}\frac{\alpha+\frac{\beta}{x}+\frac{\gamma}{x^2}}{9-\frac{1}{x^2}}=\frac{\alpha}{9}=\frac13$ 에서 $\alpha=3$.
        조건 (나)에서 (분자)$\to0$이고 $0$이 아닌 극한값이 존재하므로 (분모)$\to0$이어야 한다. 따라서 $f(x)=3\left(x-\dfrac13\right)(x+k)$로 놓을 수 있다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to\frac13}\frac{9\left(x-\frac13\right)\left(x+\frac13\right)}{3\left(x-\frac13\right)(x+k)}=\lim_{x\to\frac13}\frac{3\left(x+\frac13\right)}{x+k}=\frac{2}{k+\frac13}=\frac14$ 에서 $k=\dfrac{23}{3}$.
        즉 $f(x)=3\left(x-\dfrac13\right)\left(x+\dfrac{23}{3}\right)$.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $\displaystyle\lim_{x\to\frac13-}\frac{-\left(x-\frac13\right)(x^2+ax+5)}{3\left(x-\frac13\right)\left(x+\frac{23}{3}\right)}=-\frac{\frac19+\frac a3+5}{24}$, $\displaystyle\lim_{x\to\frac13+}\frac{\left(x-\frac13\right)(x^2+ax+5)}{3\left(x-\frac13\right)\left(x+\frac{23}{3}\right)}=\frac{\frac19+\frac a3+5}{24}$.
        극한값이 존재하므로 $-\dfrac{\frac19+\frac a3+5}{24}=\dfrac{\frac19+\frac a3+5}{24}=b=0$. 따라서 $a=-\dfrac{46}{3}$
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $b=0$
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        $f(x)=3\left(x-\frac13\right)(x+k)$ 꼴로 놓고 $f(x)=3\left(x-\frac13\right)\left(x+\frac{23}{3}\right)$을 구함(원 채점기준 2.5점+3.5점 — 정수 배점 규칙상 두 마크를 합침).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $a=-\frac{46}{3}$(채점기준 3점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        $b=0$(채점기준 1점).
      depends_on:
      - 1.M1
      - 1.A2
      implied_ok: false
      steps:
      - 1b-4
    deductions: []
