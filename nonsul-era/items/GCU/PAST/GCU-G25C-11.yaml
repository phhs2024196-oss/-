  극한을 이용한 함수의 결정(문항카드 출제 의도 원문). (가)(나)로 이차함수 $f$를 결정한 뒤 절댓값이 있는 극한의 좌·우극한 일치 조건으로 $a$, $b$를 구한다.
key_idea: |
