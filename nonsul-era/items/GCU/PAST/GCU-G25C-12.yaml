stimuli: []
stem: |
  삼차함수 $f(x)$가 두 실수 $\alpha$, $\beta\ (\alpha<\beta)$에 대하여 다음 조건을 만족시킨다.

  (가) $f'(\alpha)=f'(\beta)=0$
  (나) $f(\alpha)f(\beta)<0$
  (다) $|f(\beta)|=2|f(\alpha)|$

  집합 $A=\{x\mid |f(x)|-|f(t)|=0\}$의 원소의 개수가 홀수가 되도록 하는 모든 실수 $t$의 개수가 $m$이고, 이러한 $m$개의 실수 $t$의 값을 작은 수부터 차례로 $t_1,\ t_2,\ t_3,\ \cdots,\ t_m$이라 하자. $\dfrac{1}{|f(\alpha)|}\displaystyle\sum_{i=1}^{m}f(t_i)$의 가능한 모든 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\frac{1}{|f(\alpha)|}\sum_{i=1}^{m}f(t_i)$의 가능한 모든 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: set
    value: |
      \{-3,\ 3\}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      홀수 개가 되는 높이는 $0$, $|f(\alpha)|$, $|f(\beta)|$뿐: $3+5+3=11$개.
    steps:
    - id: 1a
      content: |
        $f(\alpha)>0$이면 $\frac{-|f(\beta)|-|f(\alpha)|}{|f(\alpha)|}=-3$, $f(\alpha)<0$이면 $3$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $y=|f(x)|$의 그래프를 그려 보자.
    - |
      수평선 $y=k$와의 교점 수가 홀수인 $k$는?
  - id: S1-B
    audience: B
    source_flow: 해설_자연.hwp 문항카드(수학 자연 12번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 $x=\alpha$와 $x=\beta$에서 극값을 가지며, 조건 (나)에서 함숫값의 부호는 다르므로 그래프의 개형은 $f(\alpha)>0$인 경우와 $f(\alpha)<0$인 경우 두 가지이다.
        방정식 $|f(x)|=|f(t)|$의 실근의 개수가 홀수가 되도록 하는 실수 $t$는 $y=|f(x)|$의 그래프가 직선 $y=0$, $y=|f(\alpha)|$, $y=|f(\beta)|$와 만나는 점들의 $x$좌표이므로 $m=11$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        (1) $f(\alpha)>0$일 때 $\dfrac{1}{|f(\alpha)|}\displaystyle\sum_{i=1}^{m}f(t_i)=\dfrac{-|f(\beta)|-|f(\alpha)|}{|f(\alpha)|}=-3$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        (2) $f(\alpha)<0$일 때 마찬가지로 $m=11$이고 $\dfrac{1}{|f(\alpha)|}\displaystyle\sum_{i=1}^{m}f(t_i)=\dfrac{|f(\beta)|+|f(\alpha)|}{|f(\alpha)|}=3$이다. 따라서 $\pm3$이다.
      criteria:
      - 1.A2
