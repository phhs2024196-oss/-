  함수의 그래프의 개형을 이용하여 방정식의 실근 구하기(문항카드 출제 의도 원문). $y=|f(x)|$의 그래프와 수평선의 교점 개수가 홀수가 되는 높이($0$, $|f(\alpha)|$, $|f(\beta)|$)를 찾고 $f(\alpha)$의 부호로 경우를 나눈다.
