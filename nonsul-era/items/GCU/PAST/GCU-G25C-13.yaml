stimuli: []
stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $0\le x<1$일 때, $f(x)=a\left(x-\dfrac{1}{4}\right)^{2}-\dfrac{9}{16}$이다.
  (나) 모든 실수 $x$에 대하여 $f(x+1)=f(x)+1$을 만족시킨다.

  자연수 $n$에 대하여 $p_n=\displaystyle\int_{n-1}^{n}f(x)\,dx$라 할 때, 함수 $g(x)=\displaystyle\sum_{n=1}^{100}\left(x-p_n\right)^{2}$은 $x=\alpha$에서 최솟값을 갖는다. $\alpha$의 값을 구하는 과정을 서술하시오. (단, $a$, $\alpha$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $\alpha$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \frac{2363}{48}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      연속 → $a=2$, $p_1=-\frac{13}{48}$, $p_n=p_1+(n-1)$, $\alpha=$평균.
    steps:
    - id: 1a
      content: |
        $\alpha=p_1+\frac{99}{2}=\frac{2363}{48}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $x=1$에서 좌극한과 $f(1)=f(0)+1$을 비교하자.
    - |
      $\int_{n-1}^n f(x)dx$와 $\int_0^1 f(x)dx$의 관계는?
  - id: S1-B
    audience: B
    source_flow: 해설_자연.hwp 문항카드(수학 자연 13번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(1)=f(0)+1=\dfrac{a}{16}-\dfrac{9}{16}+1=\dfrac{a}{16}+\dfrac{7}{16}$이고 $\displaystyle\lim_{x\to1-}f(x)=\lim_{x\to1-}a\left(x-\frac14\right)^2-\frac{9}{16}=\frac{9a-9}{16}$.
        $f$는 $x=1$에서 연속이므로 $a=2$. 따라서 $f(x)=2\left(x-\dfrac14\right)^2-\dfrac{9}{16}$, $f(0)=-\dfrac{7}{16}$, $f(1)=\dfrac{9}{16}$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        구간 $[0,1]$에서 $y=f(x)$의 그래프와 직선 $y=-\dfrac{9}{16}$ 사이의 부분의 넓이를 $A$라 하면 $A=\displaystyle\int_0^1\left\{f(x)-\left(-\frac{9}{16}\right)\right\}dx=\int_0^1 2\left(x-\frac14\right)^2dx=\frac{7}{24}$.
        $p_1=\displaystyle\int_0^1 f(x)\,dx=A-\frac{9}{16}=-\frac{13}{48}$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        조건 (나)로부터 $p_2=\displaystyle\int_0^1 f(x)\,dx+1$. 따라서 $p_n=\displaystyle\int_{n-1}^{n}f(x)\,dx=(n-1)+\int_0^1 f(x)\,dx$이므로 수열 $\{p_n\}$은 첫째항이 $-\dfrac{13}{48}$이고 공차가 $1$인 등차수열이다.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $g(x)=100x^2-2(p_1+p_2+\cdots+p_{100})x+(p_1^2+\cdots+p_{100}^2)$이므로 $x=\dfrac{p_1+\cdots+p_{100}}{100}$에서 최솟값을 가진다. 따라서
        $\alpha=\dfrac{1}{100}\displaystyle\sum_{n=1}^{100}p_n=\frac12(2p_1+99)=p_1+\frac{99}{2}=\frac{2363}{48}$
      criteria:
      - 1.A3
