intent: |
  함수의 그래프와 정의를 활용하여 수열의 규칙성을 찾아 정적분의 값을 구하는 방법의 이해 확인(문항카드 출제 의도 원문). 연속 조건으로 $a$를 정하고 $f(x+1)=f(x)+1$로 $p_n$이 등차수열임을 보인 뒤 $g$의 최소를 평균으로 구한다.
key_idea: |
  $p_n=p_1+(n-1)$이고 $\sum(x-p_n)^2$은 $x=\frac{1}{100}\sum p_n$에서 최소.
