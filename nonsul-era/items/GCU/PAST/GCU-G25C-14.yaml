stimuli: []
stem: |
  삼차함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $\displaystyle\lim_{x\to2}\frac{f(x)-f(-2)}{x-2}=1$
  (나) $\displaystyle\lim_{x\to0}\frac{f(x+2)}{f(x-2)}=3$

  ① $f(2)\neq0$일 때, 위 조건을 만족시키는 함수가 존재하는지 서술하시오.
  ② $\displaystyle\int_{0}^{3}f(x)\,dx$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    ① $f(2)\neq0$일 때, 위 조건을 만족시키는 함수가 존재하는지 서술하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: 존재하지 않는다
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      (가)에서 $f(2)=f(-2)$; 0이 아니면 (나)의 극한은 $1$.
    steps:
    - id: 1a
      content: |
        모순 → 존재하지 않음, 따라서 $f(2)=f(-2)=0$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - |
      (가)에서 분모가 $0$으로 가면 분자는?
  - id: S1-B
    audience: B
    source_flow: 해설_자연.hwp 문항카드(수학 자연 14번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가)에서 $x\to2$일 때 (분모)$\to0$이고 극한값이 존재하므로 (분자)$\to0$이어야 한다. 따라서 $\displaystyle\lim_{x\to2}\{f(x)-f(-2)\}=0$에서 $f(2)=f(-2)$이다.
        이때 $f(2)=f(-2)\neq0$이면 $\displaystyle\lim_{x\to0}\frac{f(x+2)}{f(x-2)}=\frac{f(2)}{f(-2)}=1$이 되므로 모순. 따라서 조건을 만족시키는 함수는 존재하지 않는다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 $f(2)=f(-2)=0$이다.
      criteria:
      - 1.A1
