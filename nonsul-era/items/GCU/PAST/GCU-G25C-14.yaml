  - id: MC-CAL-8608
    outcome_code: '71'
    wrong_work: |
      (가)의 극한값 1을 $f'(2)=1$로만 해석하고 $f(2)=f(-2)$를 이끌지 않음
    detect_cue: |
      $f(-2)$와 $f(2)$의 관계 없이 '존재한다'고 답한다
    feedback: |
      분모 $x-2\to0$이므로 분자 $f(x)-f(-2)\to0$, 즉 $f(2)=f(-2)$가 먼저 필요합니다.
    remedy:
    - RL-MC-CAL-8608
- id: '2'
  stem: |
    ② $\int_0^3 f(x)\,dx$의 값을 구하는 과정을 서술하시오.
  points: 6
  depends_on:
  - '1'
  answer:
    kind: value
    value: |
      -\frac{1}{16}
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=a(x+2)(x-2)(x-k)$로 놓고 (나)→$k=-1$, (가)→$a=\frac1{12}$.
    steps:
    - id: 2a
      content: |
        $\int_0^3\frac{1}{12}(x^2-4)(x+1)dx=-\frac1{16}$
      criteria:
      - 2.M1
    hint_ladder:
    - |
      $f(\pm2)=0$이면 $f$는 어떤 꼴인가?
  - id: S2-B
    audience: B
    source_flow: 해설_자연.hwp 문항카드(수학 자연 14번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)=a(x+2)(x-2)(x-k)$ ($a$는 $0$이 아닌 상수, $k$는 상수)
        $\displaystyle\lim_{x\to0}\frac{f(x+2)}{f(x-2)}=\lim_{x\to0}\frac{ax(x+4)(x+2-k)}{ax(x-4)(x-2-k)}=\frac{4(2-k)}{-4(-2-k)}=3$ 에서 $k=-1$, 즉 $f(x)=a(x+2)(x-2)(x+1)$.
        $\displaystyle\lim_{x\to2}\frac{f(x)-f(-2)}{x-2}=\lim_{x\to2}\frac{a(x+2)(x-2)(x+1)}{x-2}=12a=1$ 에서 $a=\dfrac{1}{12}$. 따라서 $f(x)=\dfrac{1}{12}(x+2)(x-2)(x+1)$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        즉 $\displaystyle\int_0^3 f(x)\,dx=-\frac{1}{16}$
      criteria:
      - 2.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: |
        $f(x)=\frac{1}{12}(x+2)(x-2)(x+1)$을 구하고 $\int_0^3 f(x)dx=-\frac{1}{16}$(원 채점기준 4.5점+1.5점 — 정수 배점 규칙상 두 마크를 합침).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2b-2
    deductions: []
