stimuli: []
stem: |
  다음 조건을 만족시키는 모든 자연수 $n$의 값의 합을 $m$이라 하자.

  함수 $f(x)=\sin\dfrac{\pi}{n}x$가 모든 실수 $x$에 대하여 $f(x+30)=f(x)$를 만족시킨다.

  그림과 같이 중심이 $\mathrm{O}$이고 반지름의 길이가 $4$인 원에 내접하는 예각삼각형 $\mathrm{ABC}$에 대하여 점 $\mathrm{O}$에서 세 선분 $\mathrm{AB}$, $\mathrm{BC}$, $\mathrm{CA}$에 내린 수선의 발을 각각 $\mathrm{D}$, $\mathrm{E}$, $\mathrm{F}$라 하자. $5\sin^{2}A=4\sin^{2}C$이고 $\overline{\mathrm{OD}}:\overline{\mathrm{OE}}:\overline{\mathrm{OF}}=12:m:6\left(3\sqrt{5}-1\right)$일 때, 선분 $\mathrm{OE}$의 길이와 $\sin^{2}B$의 값을 구하는 과정을 서술하시오.

  [그림: 중심 O, 반지름 4인 원에 예각삼각형 ABC가 내접하고, O에서 변 AB, BC, CA에 내린 수선의 발 D, E, F와 선분 OD, OE, OF가 그려져 있다.]
subparts:
- id: '1'
  stem: |
    선분 $\mathrm{OE}$의 길이와 $\sin^2B$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \overline{\mathrm{OE}}=2,\ \sin^2B=\frac{9+3\sqrt5}{32}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $m=24$ → 비 $2:4:(3\sqrt5-1)$을 $h$로 두고 $\sin^2A=1-h^2$, $\sin^2C=\frac{4-h^2}{4}$.
    steps:
    - id: 1a
      content: |
        $5-5h^2=4-h^2\Rightarrow h=\frac12$, $\overline{\mathrm{OE}}=2$, $\sin^2B=\frac{9+3\sqrt5}{32}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $\sin\frac{\pi}{n}x$의 주기는?
    - |
      $\overline{\mathrm{BC}}$를 $\sin A$와 $\overline{\mathrm{OE}}$로 각각 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: 해설_자연.hwp 문항카드(수학 자연 15번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\dfrac{30}{n}$이 $2$의 배수가 되어야 하므로, 가능한 $n$은 $1$, $3$, $5$, $15$이고, $m=24$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\overline{\mathrm{OD}}:\overline{\mathrm{OE}}:\overline{\mathrm{OF}}=12:24:6\left(3\sqrt5-1\right)=2:4:\left(3\sqrt5-1\right)$이므로 양수 $h$에 대하여 $\overline{\mathrm{OD}}=2h$, $\overline{\mathrm{OE}}=4h$, $\overline{\mathrm{OF}}=\left(3\sqrt5-1\right)h$라 하면
        $\sin^2A=\dfrac{\overline{\mathrm{BC}}^2}{64}=\dfrac{4\overline{\mathrm{BE}}^2}{64}=\dfrac{16-\overline{\mathrm{OE}}^2}{16}=1-h^2$, $\sin^2B=\dfrac{16-\left(3\sqrt5-1\right)^2h^2}{16}$, $\sin^2C=\dfrac{4-h^2}{4}$이다.
        $5-5h^2=4-h^2$이므로 $h=\dfrac12$이고, 따라서 $\overline{\mathrm{OE}}=2$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\sin^2B=\dfrac{9+3\sqrt5}{32}$이다.
      criteria:
      - 1.A2
