stimuli: []
stem: |
  $1$이 아닌 두 양수 $a$, $b\ (a\neq b)$가
  $$\log_a\frac{1}{b}=\left(\log_{\frac{1}{b}}a\right)\times\left(\log_a\frac{b^{3}}{a^{2}}\right)$$
  을 만족시킬 때, $\log_ba+\log_{\frac{1}{a}}b$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\log_ba+\log_{\frac1a}b$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      -\frac{3}{2}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $X=\log_ab$: $-X=-\frac1X(3X-2)$.
    steps:
    - id: 1a
      content: |
        $X^2-3X+2=0$, $X=2$, $\frac1X-X=-\frac32$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      각 로그를 $\log_ab$로 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 64(PDF 224~225쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $-\log_ab=-\dfrac{1}{\log_ab}(3\log_ab-2)$이므로 $(\log_ab)^2=3\log_ab-2$. 정리하면 $(\log_ab)^2-3\log_ab+2=0$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $(\log_ab)^2-3\log_ab+2=(\log_ab-2)(\log_ab-1)=0$이므로 $\log_ab=2$ 또는 $\log_ab=1$. $a\neq b$이므로 $\log_ab=2$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $\log_ba+\log_{\frac1a}b=\dfrac{1}{\log_ab}-\log_ab=\dfrac12-2=-\dfrac32$
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
