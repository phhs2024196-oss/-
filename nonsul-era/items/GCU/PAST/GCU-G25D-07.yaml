  - id: MC-ALG-8628
    outcome_code: '71'
    wrong_work: |
      $\log_{\frac1b}a$를 $\frac{1}{\log_ab}$로 바꾸며 부호(−)를 빠뜨림
    detect_cue: |
      $X^2=-(3X-2)$ 꼴의 다른 이차방정식이 나온다
    feedback: |
      $\log_{\frac1b}a=\frac{\log a}{-\log b}=-\frac{1}{\log_ab}$입니다.
    remedy:
    - RL-MC-ALG-8628
