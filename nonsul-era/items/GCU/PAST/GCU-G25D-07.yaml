intent: |
  로그의 성질을 이해하고 수식을 계산할 수 있는지 확인한다(문항카드 출제 의도 원문). $\log_ab=X$로 놓고 식을 $X$에 대한 이차방정식으로 바꾼다.
key_idea: |
  $\log_a\frac1b=-X$, $\log_{\frac1b}a=-\frac1X$, $\log_a\frac{b^3}{a^2}=3X-2$.
stuck: |
  $a\neq b$로 $X=1$을 배제하는 것.
