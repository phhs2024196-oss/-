stimuli: []
stem: |
  함수 $f(x)=x^{2}+ax+b$가 다음 조건을 만족시킬 때, $f(a)+f(b)$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$는 상수이다.)

  (가) $\displaystyle\int_0^1f(x)\,dx=\frac13$
  (나) $\displaystyle\lim_{x\to0}\left\{\frac{x^{2}+x+1}{x}\int_1^{x+1}f(t)\,dt\right\}=3$
subparts:
- id: '1'
  stem: |
    $f(a)+f(b)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '24'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      (가) → $b=-\frac a2$, (나) → $f(1)=3$.
    steps:
    - id: 1a
      content: |
        $a=4$, $b=-2$, $f(4)+f(-2)=30-6=24$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      (나)의 극한을 부정적분 $F$로 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 65(PDF 226~227쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)로부터 $\dfrac13=\displaystyle\int_0^1(x^2+ax+b)\,dx=\dfrac13+\dfrac a2+b$. $b=-\dfrac a2$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        함수 $f(x)$의 한 부정적분을 $F(x)$라 하면
        $3=\displaystyle\lim_{x\to0}\left\{\frac{x^2+x+1}{x}[F(t)]_1^{x+1}\right\}=\lim_{x\to0}\left\{(x^2+x+1)\times\frac{F(1+x)-F(1)}{x}\right\}=(0+0+1)\times F'(1)=f(1)$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $=f(1)=1+a+b=1+a-\dfrac a2=1+\dfrac a2$. 따라서 $a=4$, $b=-2$이다.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $f(x)=x^2+4x-2$이므로 $f(a)+f(b)=f(4)+f(-2)=30-6=24$
      criteria:
      - 1.A3
