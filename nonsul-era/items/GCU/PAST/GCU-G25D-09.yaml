stimuli: []
stem: |
  삼각형 $\mathrm{ABC}$가 다음 조건을 만족시킨다.

  (가) $\overline{\mathrm{BC}}\times\overline{\mathrm{CA}}=42$
  (나) $\cos C=\dfrac{27}{28}$
  (다) $\sin A+\sin B=\dfrac{13\sqrt{55}}{56}$

  삼각형 $\mathrm{ABC}$의 외접원의 넓이를 $S$라 할 때, $\sqrt{\dfrac{495S}{\pi}}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\sqrt{\frac{495S}{\pi}}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '84'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\sin C=\frac{\sqrt{55}}{28}$, 코사인법칙을 $R$에 대한 식으로.
    steps:
    - id: 1a
      content: |
        $\frac{27}{28}=\frac{55\times165}{56^2\times21}R^2-1\Rightarrow R=\frac{28}{\sqrt{55}}$, 답 $84$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $\overline{\mathrm{BC}}$, $\overline{\mathrm{CA}}$를 $R$과 사인으로 나타내자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 66(PDF 228~229쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이를 $R$이라 하자. $42=\overline{\mathrm{BC}}\times\overline{\mathrm{CA}}=4R^2\sin A\sin B$이고, $\sin C=\sqrt{1-\cos^2C}=\dfrac{\sqrt{55}}{28}$이므로,
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\dfrac{27}{28}=\cos C=\dfrac{\overline{\mathrm{BC}}^2+\overline{\mathrm{CA}}^2-\overline{\mathrm{AB}}^2}{2\times\overline{\mathrm{BC}}\times\overline{\mathrm{CA}}}=\dfrac{4R^2\sin^2A+4R^2\sin^2B-4R^2\sin^2C}{8R^2\sin A\sin B}=\dfrac{(\sin A+\sin B)^2-2\sin A\sin B-\sin^2C}{2\sin A\sin B}=\dfrac{\frac{13^2\times55}{56^2}-\frac{55}{28^2}}{\frac{21}{R^2}}-1=\dfrac{55\times165}{56^2\times21}R^2-1$ 이다.
        그러므로 $R=\dfrac{28}{\sqrt{55}}$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        따라서 삼각형 $\mathrm{ABC}$의 외접원의 넓이 $S=\dfrac{42\times56}{165}\pi$이고, $\sqrt{\dfrac{495S}{\pi}}=84$이다.
      criteria:
      - 1.A2
