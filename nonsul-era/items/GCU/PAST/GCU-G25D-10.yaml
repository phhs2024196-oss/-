  주어진 도형을 수식화하여 이를 통해 수열의 합을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). $S_n=n^2$, $l_n=2n+2\sqrt2n$으로 일반항을 구해 합 공식에 넣는다.
