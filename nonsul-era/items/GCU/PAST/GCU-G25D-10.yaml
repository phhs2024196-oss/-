stimuli: []
stem: |
  자연수 $n$에 대하여 좌표평면에서 $\mathrm{A}_n(-n,0)$, $\mathrm{B}_n(n,0)$, $\mathrm{C}_n(0,n)$을 꼭짓점으로 하는 삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$의 넓이를 $S_n$, 둘레의 길이를 $l_n$이라 하자. $\displaystyle\sum_{n=1}^{10}S_n$과 $\displaystyle\sum_{n=1}^{10}l_n$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\sum_{n=1}^{10}S_n$과 $\sum_{n=1}^{10}l_n$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \sum S_n=385,\ \sum l_n=110(1+\sqrt2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $S_n=n^2$, $l_n=2n(1+\sqrt2)$.
    steps:
    - id: 1a
      content: |
        $385$, $110(1+\sqrt2)$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $\overline{\mathrm{A}_n\mathrm{C}_n}$의 길이는?
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 67(PDF 230~231쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$의 넓이는 $S_n=\dfrac12\times2n\times n=n^2$이고,
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        둘레의 길이는 $l_n=2n+2\sqrt2n$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\displaystyle\sum_{n=1}^{10}S_n=\sum_{k=1}^{10}k^2=\frac{10\times11\times21}{6}=385$
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $\displaystyle\sum_{n=1}^{10}l_n=(2+2\sqrt2)\sum_{k=1}^{10}k=(2+2\sqrt2)\times55=110(1+\sqrt2)$
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $S_n=n^2$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $l_n=2n+2\sqrt2n$ (또는 $l_n=2n(1+\sqrt2)$)(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\sum_{n=1}^{10}S_n=385$(채점기준 3점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A3
      mark_type: A
      points: 3
      evidence: |
        $\sum_{n=1}^{10}l_n=110(1+\sqrt2)$(채점기준 3점).
      depends_on:
      - 1.M2
      implied_ok: false
      steps:
      - 1b-4
    deductions: []
