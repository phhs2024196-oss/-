    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        (i) $b+1>0$인 경우 만족, (ii) $b+1=0$인 경우 만족(채점기준 3점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        (iii) $b+1<0$인 경우 $-3\le b<-1$에서 만족(채점기준 4점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        최댓값 $9$(채점기준 1점).
      depends_on:
      - 1.M1
      - 1.A1
      - 1.A2
      implied_ok: false
      steps:
      - 1b-4
    deductions: []
