stimuli: []
stem: |
  삼차함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $\displaystyle\lim_{x\to\infty}\frac{f(x)}{x^{3}}=\frac13$
  (나) $\displaystyle\lim_{x\to0}\frac{f(x)}{x}=4$
  (다) 두 양수 $x_1$, $x_2\ (x_1<x_2)$에 대하여 $f(x_1)-f(x_2)+x_1^{2}-x_2^{2}<0$이다.

  방정식 $f(x)=0$의 세 근의 합의 최댓값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    세 근의 합의 최댓값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '9'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=\frac13x^3+bx^2+4x$, $g'(x)=x^2+2(b+1)x+4\ge0\ (x>0)$.
    steps:
    - id: 1a
      content: |
        $b\ge-3$, 세 근의 합 $-3b\le9$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      (다)를 $f(x)+x^2$에 대한 조건으로 바꿔 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 68(PDF 232~233쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=ax^3+bx^2+cx+d$라 하면 조건 (가)에서 $a=\dfrac13$. 조건 (나)에서 (분모)$\to0$이고 $0$이 아닌 극한값이 존재하므로 (분자)$\to0$, 따라서 $d=0$. $\displaystyle\lim_{x\to0}\left(\frac13x^2+bx+c\right)=4$이므로 $c=4$.
        그러므로 $f(x)=\dfrac13x^3+bx^2+4x=x\left(\dfrac13x^2+bx+4\right)$이고 방정식 $f(x)=0$의 세 근의 합은 $-3b$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        조건 (다)에서 $f(x_1)+x_1^2<f(x_2)+x_2^2$이므로 $g(x)=f(x)+x^2$이라 하면 $(0,\infty)$에서 증가함수이다. 그 필요조건은 $x>0$일 때 $g'(x)\ge0$.
        $g'(x)=x^2+2(b+1)x+4=\{x+(b+1)\}^2-b^2-2b+3$, 축 $x=-(b+1)$.
        (i) $b+1>0$: 축이 음수이고 $g'(0)=4>0$이므로 $x>0$에서 $g'(x)>0$. (ii) $b+1=0$: $g'(x)=x^2+4>0$.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        (iii) $b+1<0$: 축이 양수이므로 $g'(-(b+1))=-b^2-2b+3\ge0$, $-3\le b\le1$. $b+1<0$과 함께 $-3\le b<-1$에서 $g'(x)\ge0$. (i)(ii)(iii)에 의하여 필요충분조건은 $b\ge-3$.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $f(x)=0$의 모든 근의 합은 $-3b$이므로 $-3b\le9$. 따라서 구하는 최댓값은 $9$이다.
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
