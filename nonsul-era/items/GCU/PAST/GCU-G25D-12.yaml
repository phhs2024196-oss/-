stimuli: []
stem: |
  함수 $f(x)=-\dfrac13x^{3}+x+7$과 실수 $t$에 대하여 집합
  $$A=\{x\mid(f(x)f'(t)-f'(t))(x-t)+f(x)(f(t)-1)-f(t)+1=0\}$$
  일 때, 집합 $A$의 원소의 개수가 $1$이 되도록 하는 모든 $t$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    모든 $t$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: set
    value: |
      t=-1,\ 1,\ 3,\ -\frac{3}{2}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $(f(x)-1)(f'(t)(x-t)+f(t)-1)=0$; $f(x)=1\iff x=3$.
    steps:
    - id: 1a
      content: |
        수평 접선 $t=\pm1$, 접선이 $(3,1)$ 지남 $t=3,-\frac32$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      조건식을 $f(x)-1$로 묶어 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 69(PDF 234~235쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        집합 $A$의 조건식을 정리하면 $(f(x)-1)(f'(t)(x-t)+f(t)-1)=0$이므로 $f(x)=1$ 또는 $f'(t)(x-t)+f(t)=1$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(x)=1$을 만족하는 점은 $(3,1)$이다. $f'(x)=-x^2+1$에서 $x=\pm1$일 때 $f'(x)=0$이고 $f(-1)>1$이므로 그래프의 개형을 그려보면 점 $(3,1)$은 $f(x)=1$을 만족하는 유일한 점이다. $y=f'(t)(x-t)+f(t)$는 $x=t$에서의 접선이므로 접선과 $y=1$이 만나는 점이 없거나 만나는 점이 오직 $(3,1)$이어야 $n(A)=1$을 만족한다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        (i) 접선이 $x$축에 평행한 경우, $f'(t)=-t^2+1=0$일 때, $t=\pm1$이다.
        (ii) 접선이 $(3,1)$을 지나는 경우, $y-\left(-\dfrac13t^3+t+7\right)=(-t^2+1)(x-t)$가 $(3,1)$을 지날 때 $(t-3)^2(2t+3)=0$이므로 $t=3,\ -\dfrac32$이다.
        (i), (ii)에 의하여 답은 $t=\pm1,\ 3,\ -\dfrac32$이다. (해설 원문은 '(i), (ii), (iii)에 의하여'로 표기)
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
