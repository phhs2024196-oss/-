    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $f(3)=1$ (또는 $(3,1)$)(채점기준 1점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 7
      evidence: |
        $t=\pm1$ (원 채점기준 3.5점) + $t=3,\ -\frac32$ (원 3.5점) — 정수 배점 규칙상 인접 두 마크를 합침.
      depends_on:
      - 1.M1
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
    deductions: []
