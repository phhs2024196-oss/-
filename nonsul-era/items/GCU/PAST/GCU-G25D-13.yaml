stimuli: []
stem: |
  다항함수 $f(x)$와 $g(x)$가 다음 조건을 만족시킨다.

  (가) $f(0)=1$이고, $f(x)$의 한 부정적분 $F(x)$가 모든 실수 $x$에 대하여 $F(x)=\dfrac12\{f(x)\}^{2}$이다.
  (나) 모든 실수 $x$에 대하여 $\displaystyle\int_0^x\{t+g(t)\}\,dt=x+g(x)+\frac{x^{3}}{3}+a$이다.

  $\displaystyle\int_0^{\frac12}\frac{x^{2}}{1+x}dx+\int_0^{\frac12}\frac{f(x)}{1-x}dx+\int_0^{\frac12}\frac{g(x)}{x^{2}-1}dx$의 값을 구하는 과정을 서술하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: |
    주어진 식의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      -\frac{3}{8}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=x+1$, $g(x)=x^2+x+2$.
    steps:
    - id: 1a
      content: |
        합 $=\int_0^{\frac12}(x-1)dx=-\frac38$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - (가)의 양변을 미분해 보자.
    - |
      (나)에 $x=0$을 대입하면?
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 70(PDF 236~238쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가): $F(x)=\dfrac12\{f(x)\times f(x)\}$의 양변을 미분하면 $f(x)=f(x)f'(x)$, $f(x)\{f'(x)-1\}=0\Rightarrow f(x)=0$ 또는 $f'(x)=1$이다. $f(0)=1$이므로 $f'(x)=1$이다. 따라서 $f(x)=\displaystyle\int1\,dx=x+C$이고 $f(0)=1$이므로 $f(x)=x+1$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        조건 (나)의 양변을 $x$에 대하여 미분하면 $x+g(x)=1+g'(x)+x^2$이다. $g(x)$가 상수함수라면 이 등식을 만족할 수 없다. $g(x)$의 최고차항을 $\alpha x^n$이라 하면 $g'(x)$의 최고차항은 $\alpha nx^{n-1}$이므로 $\alpha x^n=x^2$이어야 한다.
        조건 (나)의 식에 $x=0$을 대입하면 $0=g(0)+a$. 따라서 $g(x)=x^2+bx-a$로 놓을 수 있다. $g'(x)=2x+b$이므로 $x+(x^2+bx-a)=1+(2x+b)+x^2$, 정리하면 $(b-1)x-(a+b+1)=0$이다. 따라서 $b=1$, $a=-b-1=-2$이다. $g(x)=x^2+x+2$.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\displaystyle\int_0^{\frac12}\frac{x^2}{1+x}dx+\int_0^{\frac12}\frac{x+1}{1-x}dx+\int_0^{\frac12}\frac{x^2+x+2}{x^2-1}dx=\int_0^{\frac12}\frac{x^2(x-1)+(x+1)(-1-x)+x^2+x+2}{x^2-1}dx=\int_0^{\frac12}\frac{x^3-x^2-x+1}{x^2-1}dx$
        $\displaystyle=\int_0^{\frac12}\frac{(x^2-1)(x-1)}{x^2-1}dx=\int_0^{\frac12}(x-1)\,dx=\left[\frac{x^2}{2}-x\right]_0^{\frac12}=-\frac38$
      criteria:
      - 1.A1
