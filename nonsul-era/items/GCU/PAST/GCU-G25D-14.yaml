stimuli: []
stem: |
  그림과 같이 선분 $\mathrm{AB}$를 지름으로 하는 원 위에
  $\overline{\mathrm{CA}}=\sqrt[4]{5}$, $\overline{\mathrm{CB}}=\sqrt[4]{20}$, $\overline{\mathrm{DB}}=\sqrt[4]{1.25}$
  인 점 $\mathrm{C}$와 점 $\mathrm{D}$를 잡는다. 점 $\mathrm{C}$에서 선분 $\mathrm{AB}$에 내린 수선의 발을 $\mathrm{P}$, 점 $\mathrm{D}$에서 선분 $\mathrm{AB}$에 내린 수선의 발을 $\mathrm{Q}$라 할 때, $\overline{\mathrm{PB}}$, $\overline{\mathrm{QB}}$, $\dfrac{\overline{\mathrm{AB}}}{\overline{\mathrm{PQ}}}$의 값을 구하는 과정을 서술하시오.

  [그림: 수평 지름 $\mathrm{AB}$(왼쪽 A, 오른쪽 B)를 갖는 원. 점 C는 지름 위쪽 호 위(A에 가까운 쪽), 점 D는 아래쪽 호 위(B에 가까운 쪽). 선분 CA, CB, DA, DB가 그려져 있고, C에서 AB에 내린 수선의 발 P는 A 가까이, D에서 내린 수선의 발 Q는 B 가까이에 직각 표시와 함께 있다. 길이 $\sqrt[4]5$(CA), $\sqrt[4]{20}$(CB), $\sqrt[4]{1.25}$(DB)가 표시됨.]
subparts:
- id: '1'
  stem: |
    $\overline{\mathrm{PB}}$, $\overline{\mathrm{QB}}$, $\frac{\overline{\mathrm{AB}}}{\overline{\mathrm{PQ}}}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \overline{\mathrm{PB}}=\frac{2\sqrt5}{\sqrt[4]{45}},\ \overline{\mathrm{QB}}=\frac{\frac12\sqrt5}{\sqrt[4]{45}},\ \frac{\overline{\mathrm{AB}}}{\overline{\mathrm{PQ}}}=2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\angle\mathrm{ACB}=\angle\mathrm{ADB}=90^\circ$, 닮음.
    steps:
    - id: 1a
      content: |
        $\overline{\mathrm{AB}}=\sqrt[4]{45}$, $\overline{\mathrm{PB}}=\frac{\sqrt{20}}{\sqrt[4]{45}}$, $\overline{\mathrm{QB}}=\frac{\sqrt{5/4}}{\sqrt[4]{45}}$, 비 $2$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - 지름에 대한 원주각은?
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 71(PDF 239~241쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        선분 $\mathrm{AB}$가 원의 지름이므로 $\angle\mathrm{ACB}=\angle\mathrm{ADB}=90^\circ$. 직각삼각형 $\mathrm{ABC}$에서 $\overline{\mathrm{AB}}=\sqrt{\overline{\mathrm{CA}}^2+\overline{\mathrm{CB}}^2}=\sqrt{(\sqrt[4]5)^2+(\sqrt[4]{20})^2}=\sqrt[4]{45}$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\triangle\mathrm{ABC}$와 $\triangle\mathrm{CBP}$는 닮음이므로 $\overline{\mathrm{PB}}:\overline{\mathrm{CB}}=\overline{\mathrm{CB}}:\overline{\mathrm{AB}}$. 따라서 $\overline{\mathrm{PB}}=\dfrac{(\sqrt[4]{20})^2}{\sqrt[4]{45}}$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        마찬가지로 $\overline{\mathrm{QB}}:\overline{\mathrm{DB}}=\overline{\mathrm{DB}}:\overline{\mathrm{AB}}$, $\overline{\mathrm{QB}}=\dfrac{\left(\sqrt[4]{\frac54}\right)^2}{\sqrt[4]{45}}$
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $\overline{\mathrm{PQ}}=\overline{\mathrm{PB}}-\overline{\mathrm{QB}}=\dfrac{2\sqrt5-\frac12\sqrt5}{\sqrt[4]{45}}=\dfrac{\frac32\sqrt5}{\sqrt[4]{45}}$. 따라서 $\dfrac{\overline{\mathrm{AB}}}{\overline{\mathrm{PQ}}}=2$
      criteria:
      - 1.M1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\overline{\mathrm{AB}}=\sqrt[4]{45}$ (원 채점기준 1.5점) + $\frac{\overline{\mathrm{AB}}}{\overline{\mathrm{PQ}}}=2$ (원 2.5점) — 0.5점 단위 두 마크(1행·4행, 비인접)를 정수 배점 규칙상 합침.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-4
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\overline{\mathrm{PB}}=\frac{(\sqrt[4]{20})^2}{\sqrt[4]{45}}$ (또는 $\frac{\sqrt{20}}{\sqrt[4]{45}}$, $\frac{2\sqrt5}{45^{1/4}}$)(채점기준 3점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\overline{\mathrm{QB}}=\frac{(\sqrt[4]{5/4})^2}{\sqrt[4]{45}}$ (또는 $\frac{\frac12\sqrt5}{\sqrt[4]{45}}$)(채점기준 3점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-3
    deductions: []
