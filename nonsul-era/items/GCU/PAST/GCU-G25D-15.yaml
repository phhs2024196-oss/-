      evidence: |
        $\frac{1}{S_{12}}=\frac{3^{1/3}-1}{80}$ (또는 $\frac{\sqrt[3]3-1}{80}$)(채점기준 4점).
      depends_on:
      - 1.M1
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
