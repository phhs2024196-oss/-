stem: |
  모든 항이 양수인 등비수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
  $$a_na_{n+1}a_{n+2}=3^{n}$$
  을 만족시킨다. 수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라 할 때, $\dfrac{1}{S_{12}}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\frac{1}{S_{12}}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \frac{3^{\frac13}-1}{80}
    equivalents:
    - |
      \frac{\sqrt[3]{3}-1}{80}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $r^3=3$, $a_1^3r^3=3\Rightarrow a_1=1$.
    steps:
    - id: 1a
      content: |
        $S_{12}=\frac{r^{12}-1}{r-1}=\frac{80}{3^{1/3}-1}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $n$과 $n+1$일 때의 식을 나눠 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 72(PDF 242~243쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_na_{n+1}a_{n+2}=3^n$에서 $\dfrac{a_{n+1}a_{n+2}a_{n+3}}{a_na_{n+1}a_{n+2}}=\dfrac{3^{n+1}}{3^n}$, $\dfrac{a_{n+3}}{a_n}=\dfrac{ar^{n+2}}{ar^{n-1}}=r^3=3$. 따라서 공비 $r$은 $r=3^{\frac13}$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $n=1$일 때, $a_1a_2a_3=a_1\times a_1r\times a_1r^2=a_1^3r^3=3$이므로 $a_1=1$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $S_{12}=\dfrac{r^{12}-1}{r-1}=\dfrac{81-1}{3^{\frac13}-1}$. 따라서 $\dfrac{1}{S_{12}}=\dfrac{3^{\frac13}-1}{80}$ 또는 $\dfrac{\sqrt[3]3-1}{80}$이다.
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
