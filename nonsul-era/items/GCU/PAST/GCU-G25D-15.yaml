  - id: MC-ALG-8636
    outcome_code: '71'
    wrong_work: |
      $\frac{a_{n+3}}{a_n}=r^3$을 $r$로 보고 $r=3$으로 둠
    detect_cue: |
      $S_{12}$가 $\frac{3^{12}-1}{2}$ 꼴로 크게 나온다
    feedback: |
      $a_{n+3}$과 $a_n$은 세 항 떨어져 있으므로 비는 $r^3$입니다.
