stimuli: []
stem: |
  공비 $r$가 음수인 등비수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라 하자.
  $$\frac{S_4-S_1}{S_{10}-S_4}=\frac{64}{9}$$
  일 때, $r$의 값을 구하는 과정을 서술하시오. (단, $a_1\neq0$, $r\neq-1$)
subparts:
- id: '1'
  stem: |
    $r$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      -\frac{\sqrt[3]{9}}{2}
    equivalents:
    - |
      -\sqrt[3]{\frac{9}{8}}
    - |
      -\frac{3^{\frac23}}{2}
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $r^3(r^3+1)=\frac{9}{64}$.
    steps:
    - id: 1a
      content: |
        $(8r^3-1)(8r^3+9)=0$, $r<0\Rightarrow r^3=-\frac98$, $r=-\frac{\sqrt[3]9}{2}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $S_4-S_1$과 $S_{10}-S_4$는 각각 어떤 항들의 합인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 73(PDF 244~245쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\dfrac{S_4-S_1}{S_{10}-S_4}=\dfrac{r^3-1}{r^3(r^6-1)}=\dfrac{1}{r^3(r^3+1)}=\dfrac{64}{9}$, $r^3(r^3+1)=\dfrac{9}{64}$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\left(r^3+\dfrac12\right)^2-\dfrac14-\dfrac{9}{64}=0$, $\left(r^3+\dfrac12\right)^2=\dfrac{25}{64}$, $(8r^3-1)(8r^3+9)=0$, $r^3=\dfrac18$ 또는 $r^3=-\dfrac98$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        공비 $r$가 음수이므로 $r=-\sqrt[3]{\dfrac98}=-\left(\dfrac98\right)^{\frac13}=-\dfrac{\sqrt[3]9}{2}$
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $r^3(r^3+1)=\frac{9}{64}$(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $r^3=-\frac98$(채점기준 4점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $r=-\sqrt[3]{\frac98}$ (또는 $-\frac{9^{1/3}}{8^{1/3}}$, $-\frac{\sqrt[3]9}{2}$, $-\frac{3^{2/3}}{2}$)(채점기준 2점).
      depends_on:
      - 1.M1
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
    deductions: []
