stimuli: []
stem: |
  다항함수 $f(x)$에 대하여 $\displaystyle\lim_{x\to\infty}\frac{\sqrt{x^{4}-5}-f(x)}{6x^{2}+1}=\frac13$일 때, 함수 $g(x)$를
  $$g(x)=\begin{cases}f(1-x)-f(x) & (x<1)\\ f(x) & (x\ge1)\end{cases}$$
  이라 하자. 함수 $g(x)$가 $x=1$에서 미분가능할 때, $f(3)$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $f(3)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      -\frac{17}{3}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=-x^2+bx+c$; 연속 $2b+c=2$; 미분가능 $2-2b=-2+b$.
    steps:
    - id: 1a
      content: |
        $b=\frac43$, $c=-\frac23$, $f(3)=-\frac{17}{3}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      극한 조건에서 $f$의 이차항 계수를 구하자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 74(PDF 246~247쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 $\displaystyle\lim_{x\to\infty}\frac{\sqrt{x^4-5}-f(x)}{6x^2+1}=\frac13$로부터 $f(x)$는 이차함수이며 $f(x)=ax^2+bx+c$라 하자. $\dfrac{1-a}{6}=\dfrac13$이므로 $a=-1$이고, $f(x)=-x^2+bx+c$, $g(x)=\begin{cases}(2-2b)x+b-1 & (x<1)\\ f(x) & (x\ge1)\end{cases}$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        (1) 함수 $g(x)$가 $x=1$에서 미분가능하므로 $x=1$에서 연속이다. 따라서 $f(0)-f(1)=f(1)$, 즉 $2f(1)=f(0)$을 만족하므로 $2b+c=2$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        (2) $\displaystyle\lim_{x\to1-}\frac{g(x)-g(1)}{x-1}=(2-2b)=-2+b=\lim_{x\to1+}\frac{g(x)-g(1)}{x-1}$이다. 따라서 $b=\dfrac43$, $c=-\dfrac23$이다.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $f(x)=-x^2+\dfrac43x-\dfrac23$이므로 $f(3)=-\dfrac{17}{3}$이다.
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
