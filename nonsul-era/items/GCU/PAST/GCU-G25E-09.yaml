stem: |
  자연수 $k$에 대하여 함수 $f(x)=5^{3x+3}-5^{2x+\log_2k}$의 그래프가 $x$축과 만나는 점의 $x$좌표를 $a$라 하자. $1\le a\le3$을 만족시키는 모든 $k$의 값의 합을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    모든 $k$의 값의 합을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '1960'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $a=\log_2k-3$.
    steps:
    - id: 1a
      content: |
        $16\le k\le64$, 합 $1960$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $f(x)=0$을 풀어 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 75(PDF 248~249쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=5^{3x+3}-5^{2x+\log_2k}$, $5^{3x+3}=5^{2x+\log_2k}$, $x=\log_2k-3$. 함수 $y=f(x)$ 그래프가 $x$축과 만나는 점의 $x$좌표 $a$는 $a=\log_2k-3$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $1\le a\le3$이므로 $1\le\log_2k-3\le3$, 따라서 $16\le k\le64$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\therefore\ 16+17+\cdots+63+64$이므로 모든 $k$의 값의 합은 $1960$이다.
      criteria:
      - 1.A2
