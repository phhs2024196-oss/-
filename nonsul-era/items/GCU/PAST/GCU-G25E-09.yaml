intent: |
  지수의 성질과 로그의 성질을 이용하여 답을 도출할 수 있는지 확인한다(문항카드 출제 의도 원문). 밑이 같은 지수방정식에서 지수를 같게 놓아 $a=\log_2k-3$을 얻고, 범위 조건을 $k$의 범위로 바꿔 합을 구한다.
key_idea: |
  $5^{3x+3}=5^{2x+\log_2k}\iff x=\log_2k-3$.
stuck: |
  로그 부등식 $4\le\log_2k\le6$을 $16\le k\le64$로 바꾸는 것.
