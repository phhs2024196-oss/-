intent: |
  함수의 연속에 대한 정의와 함수의 극한을 이해하는지 확인한다(문항카드 출제 의도 원문). $g$가 한 점에서만 불연속이 되려면 분모 $f(x^2+9)$가 $x=0$에서만 $0$이어야 하므로 $f$가 $x-9$를 인수로 가져야 함을 보이고, (나)로 나머지 인수를 정한다.
key_idea: |
  $x^2+9\ge9$이므로 $f(x^2+9)=0$이 $x=0$ 하나만 가지려면 $f(9)=0$이고 다른 근은 $9$보다 작아야 한다.
stuck: |
  $9+\alpha$의 부호로 경우를 나누는 단계.
