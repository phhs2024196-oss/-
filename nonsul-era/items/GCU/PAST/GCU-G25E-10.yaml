stimuli: []
stem: |
  최고차항의 계수가 $1$인 이차함수 $f(x)$와 두 실수 $a$, $b$가 다음 조건을 만족시킬 때, $a+b+f(3)$의 값을 구하는 과정을 서술하시오.

  (가) 함수 $g(x)=\dfrac{x}{f(x^{2}+9)}$는 $x=a$에서만 불연속이다.
  (나) $\displaystyle\lim_{x\to-3}\frac{f(x-2)}{f(x^{2})}=b$
subparts:
- id: '1'
  stem: |
    $a+b+f(3)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      -\frac{287}{6}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=(x-9)(x+\beta)$, (나)에서 $\beta=5$.
    steps:
    - id: 1a
      content: |
        $a=0$, $b=\frac16$, $f(3)=-48$, 합 $-\frac{287}{6}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $x^2+9$의 범위는?
    - |
      (나)에서 분모가 $0$이 되면 분자는?
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 76(PDF 250~251쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        임의의 실수 $x$에 대하여 $f(x)>0$이면 $g(x)$는 모든 실수에서 연속이므로 조건을 만족시킬 수 없다. 그러므로 $f(x)=(x+\alpha)(x+\beta)$라 하자($\alpha\le\beta$). $g(x)=\dfrac{x}{(x^2+9+\alpha)(x^2+9+\beta)}$이므로
        $9+\alpha>0$이면 $9+\beta>0$이므로 $f(x^2+9)>0$이고 $g$는 연속이 되어 (가)를 만족시킬 수 없다. $9+\alpha<0$이면 $g$는 $x=\pm\sqrt{-\alpha-9}$에서 불연속이므로 (가)를 만족시킬 수 없다. 따라서 $9+\alpha=0$, $\alpha=-9$이고 $f(x)=(x-9)(x+\beta)$.
        $g(x)=\dfrac{x}{f(x^2+9)}$는 $x=0$에서만 불연속이므로 $a=0$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to-3}\frac{f(x-2)}{f(x^2)}=\lim_{x\to-3}\frac{(x-2-9)(x-2+\beta)}{(x+3)(x-3)(x^2+\beta)}=b$이므로 $\displaystyle\lim_{x\to-3}(x-2+\beta)=-5+\beta=0$이다. 따라서 $\beta=5$이고 $f(x)=(x-9)(x+5)$이다. 따라서 $f(3)=-6\times8=-48$이고,
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        또한 $b=\displaystyle\lim_{x\to-3}\frac{(x-11)(x+3)}{(x+3)(x-3)(x^2+5)}=\frac{-14}{-6\times14}=\frac16$이다.
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        따라서 $a+b+f(3)=0+\dfrac16-48=-\dfrac{287}{6}$이다.
      criteria:
      - 1.A2
