stimuli: []
stem: |
  그림과 같이 중심이 $\mathrm{O}$이고 길이가 $6$인 선분 $\mathrm{AB}$를 지름으로 하는 반원이 있다. 호 $\mathrm{AB}$ 위의 점 $\mathrm{P}$에 대하여 $\overline{\mathrm{PB}}=\overline{\mathrm{PC}}$가 되도록 호 $\mathrm{PA}$ 위에 점 $\mathrm{C}$를 잡는다. 선분 $\mathrm{OP}$가 선분 $\mathrm{BC}$와 만나는 점을 $\mathrm{D}$라 하자. 사각형 $\mathrm{ACPD}$가 평행사변형일 때, 선분 $\mathrm{AP}$의 길이와 $\sin(\angle\mathrm{PBC})$의 값을 구하는 과정을 서술하시오.

  [그림: 지름 AB(왼쪽 A, 중앙 O, 오른쪽 B) 위의 반원. 호 위 오른쪽 위에 P, 왼쪽 위에 C. 선분 CP, PB, CB, PA, OP가 그려져 있고 OP와 CB의 교점이 D.]
subparts:
- id: '1'
  stem: |
    선분 $\mathrm{AP}$의 길이와 $\sin(\angle\mathrm{PBC})$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \overline{\mathrm{AP}}=2\sqrt6,\ \sin(\angle\mathrm{PBC})=\frac{1}{\sqrt3}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\overline{\mathrm{AC}}=\overline{\mathrm{PD}}=y$, $\overline{\mathrm{OD}}=\frac y2$ ⇒ $y=2$.
    steps:
    - id: 1a
      content: |
        $\overline{\mathrm{BC}}=4\sqrt2$, $x=2\sqrt3$, $\overline{\mathrm{AP}}=2\sqrt6$, $\sin\theta=\frac{1}{\sqrt3}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $\overline{\mathrm{PB}}=\overline{\mathrm{PC}}$, $\overline{\mathrm{OB}}=\overline{\mathrm{OC}}$이면 직선 OP는 BC와 어떤 관계인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 77(PDF 252~253쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{PD}}\perp\overline{\mathrm{BC}}$이고 $\overline{\mathrm{PB}}=\overline{\mathrm{PC}}$, $\overline{\mathrm{OB}}=\overline{\mathrm{OC}}=3$이므로 $\overline{\mathrm{CD}}=\overline{\mathrm{BD}}$이다. 선분 $\mathrm{OD}$가 직각삼각형 $\mathrm{ABC}$의 두 변의 중점을 지나므로 선분 $\mathrm{AC}$는 선분 $\mathrm{OD}$와 평행이고, $\overline{\mathrm{AC}}=2\overline{\mathrm{OD}}$이다. 사각형 $\mathrm{ACPD}$가 평행사변형이므로 $\overline{\mathrm{CP}}=\overline{\mathrm{AD}}$이다.
        $\overline{\mathrm{PB}}=\overline{\mathrm{PC}}=x$, $\overline{\mathrm{AC}}=\overline{\mathrm{PD}}=y$라 놓으면 $\dfrac y2+y=3$이므로 $y=2$.
        $\angle\mathrm{APB}=\dfrac\pi2$이므로 $\overline{\mathrm{AP}}^2=36-x^2$, $\angle\mathrm{ACB}=\dfrac\pi2$이므로 $\overline{\mathrm{BC}}^2=32$, 즉 $\overline{\mathrm{BC}}=4\sqrt2$. 또한 $\mathrm{ACPD}$가 평행사변형이므로 $\overline{\mathrm{AD}}=\overline{\mathrm{PC}}=x$.
        $\angle\mathrm{PBC}=\theta$라 할 때, $\overline{\mathrm{AP}}^2=x^2+4+4x\sin\theta$이므로 $2x^2+4x\sin\theta-32=0$. 직각삼각형 $\mathrm{PBD}$로부터 $\sin\theta=\dfrac2x$이므로 $2x^2-24=0$, 즉 $x=2\sqrt3$이고
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 $\overline{\mathrm{AD}}=2\sqrt3$이고 $\overline{\mathrm{AP}}=2\sqrt6$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\sin\theta=\dfrac{1}{\sqrt3}$.
      criteria:
      - 1.A2
