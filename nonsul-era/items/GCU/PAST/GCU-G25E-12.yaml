stimuli: []
stem: |
  다항함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) 모든 실수 $x$에 대하여
  $$f(x)=x^{3}-3x^{2}+2x\int_0^2f(t)\,dt+\left\{\int_0^2\frac{f(t)}{\sqrt2}\,dt\right\}^{2}$$
  (나) 임의의 두 실수 $x_1$, $x_2\ (x_1<x_2)$에 대하여
  $$f(x_2)-3x_1^{2}>f(x_1)-3x_2^{2}$$

  실수 전체의 집합에서 연속인 함수 $g(x)$가 $0\le x<1$일 때 $g(x)=f(x)+ax^{2}$이고, 모든 실수 $x$에 대하여 $g(x+1)=g(x)+b$를 만족시킨다. $\displaystyle\int_2^3g(x)\,dx=\frac{79}{12}$일 때, $a$와 $b$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $a$와 $b$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      a=b=\frac{5}{2}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $c=c^2+4c-4$ → $c=1$ 또는 $-4$; (나)로 $c=1$.
    steps:
    - id: 1a
      content: |
        $f(x)=x^3-3x^2+2x+\frac12$, 연속 → $a=b$, 적분 → $\frac{28a+9}{12}=\frac{79}{12}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $\int_0^2f(t)dt=c$로 놓아 보자.
    - |
      (나)를 $f(x)+3x^2$에 대한 조건으로 바꿔 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 78(PDF 253~255쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $c=\displaystyle\int_0^2f(x)\,dx$라 놓으면 $f(x)=x^3-3x^2+2cx+\dfrac12c^2$이므로 $c=\displaystyle\int_0^2\left(x^3-3x^2+2cx+\frac12c^2\right)dx=\left[\frac14x^4-x^3+cx^2+\frac12c^2x\right]_0^2=c^2+4c-4$이므로 $c=1$ 또는 $c=-4$이다.
        (1) $c=1$일 때, $f(x)=x^3-3x^2+2x+\dfrac12$이므로 $f(x)+3x^2=x^3+2x+\dfrac12$는 증가함수이다. 따라서 조건 (나)를 만족한다.
        (2) $c=-4$일 때, $f(x)=x^3-3x^2-8x+8$이므로 $f(x)+3x^2=x^3-8x+8$인데 모든 실수에서 증가함수인 것이 아니므로 조건 (나)를 만족시키지 않는다.
        따라서 모든 조건을 만족시키는 함수는 $f(x)=x^3-3x^2+2x+\dfrac12$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $g(x)$가 $x=1$에서 연속이므로 $\displaystyle\lim_{x\to1-}g(x)=\lim_{x\to1+}g(x)=\lim_{x\to0+}g(x)+b=\lim_{x\to0+}f(x)+ax^2+b=\frac12+b$인데 $\displaystyle\lim_{x\to1-}g(x)=f(1)+a=\frac12+a$이므로 $a=b$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\displaystyle\int_2^3g(x)\,dx=\int_1^2\{g(x)+b\}dx=\int_1^2g(x)\,dx+b=\int_0^1g(x)\,dx+2b=\int_0^1\left(x^3-3x^2+2x+\frac12+ax^2\right)dx+2a=\frac{28a+9}{12}=\frac{79}{12}$이므로 $a=b=\dfrac52$이다.
      criteria:
      - 1.A2
