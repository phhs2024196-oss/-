stimuli: []
stem: |
  실수 전체의 집합에서 미분가능한 함수 $f(x)$의 도함수가
  $$f'(x)=\begin{cases}-2 & (x>b)\\ -4x^{3}-12x^{2}-9x-2 & (x\le b)\end{cases}$$
  이다. 함수 $g(x)$는 $g(x)=|f(x)|$이고 세 집합 $A$, $B$, $C$를
  $$A=\left\{x\ \middle|\ \lim_{h\to0-}\frac{g(x+h)-g(x)}{h}+\lim_{h\to0+}\frac{g(x+h)-g(x)}{h}=0\right\},$$
  $$B=\left\{x\ \middle|\ \lim_{h\to0-}\frac{g(x+h)-g(x)}{h}=\lim_{h\to0+}\frac{g(x+h)-g(x)}{h}=0\right\},$$
  $$C=\{g(x)\mid x\in A\}$$
  라 할 때, $n(A)=3$, $n(B)=2$, $n(C)=2$이다. 집합 $C$의 모든 원소를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    집합 $C$의 모든 원소를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: set
    value: |
      C=\left\{0,\ \frac{27}{16}\right\}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f'(b)$ 연속: $-4b^3-12b^2-9b-2=-2$ → $b=0$ 또는 $-\frac32$.
    steps:
    - id: 1a
      content: |
        $b=0$, $D_1=-\frac{5}{16}$, $C=\{0,\frac{27}{16}\}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $f$가 $x=b$에서 미분가능하려면?
    - |
      $B$에 속하는 점은 어떤 점인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 79(PDF 256~258쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=\begin{cases}-2 & (x>b)\\ -(x+2)(2x+1)^2 & (x\le b)\end{cases}$에서 $f_1'(x)=-2$, $f_2'(x)=-4x^3-12x^2-9x-2$라 하자. $f$가 실수 전체에서 미분가능하므로 연속이다.
        $f$가 $x=b$에서 연속이므로 $f(b)=f_1(b)=f_2(b)$이고, 미분가능하므로 $\displaystyle\lim_{x\to b-}\frac{f(x)-f(b)}{x-b}=\lim_{x\to b+}\frac{f(x)-f(b)}{x-b}$, $-4b^3-12b^2-9b-2=-2$이므로 $b=-\dfrac32$ 또는 $b=0$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        (1) $b=-\dfrac32$일 때, $g(x)=|f(x)|=\begin{cases}|2x-K_1| & \left(x>-\frac32\right)\\ \left|x^4+4x^3+\frac92x^2+2x-K_2\right| & \left(x\le-\frac32\right)\end{cases}$에 대해 $n(A)=3$, $n(B)=2$, $n(C)=2$를 만족하는 경우가 없다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        (2) $b=0$일 때 $f(x)=\begin{cases}-2x+D_1 & (x>0)\\ -x^4-4x^3-\frac92x^2-2x+D_2 & (x\le0)\end{cases}$이고, $f$가 연속이므로 $D_1=D_2$이다. $h(x)=\begin{cases}-2x & (x>0)\\ -x^4-4x^3-\frac92x^2-2x & (x\le0)\end{cases}$라 놓으면 $g(x)=|h(x)+D_1|$이다.
        $n(A)=3$, $n(B)=2$, $n(C)=2$를 만족하는 상수 $D_1$은 $D_1=-h\left(-\dfrac12\right)=-\dfrac{5}{16}$이다. 따라서 $C=\left\{g\left(-\dfrac12\right),\ g(-2)\right\}$이고, $g\left(-\dfrac12\right)=0$, $g(-2)=2-\dfrac{5}{16}=\dfrac{27}{16}$이다. 그러므로 $C=\left\{0,\ \dfrac{27}{16}\right\}$
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $b=0$ (원 채점기준 1.5점) + $b=-\frac32$ (원 1.5점) — 정수 배점 규칙상 인접 두 마크를 합침.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $b=-\frac32$일 때 조건을 만족하지 않는다(채점기준 3점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $C=\left\{0,\ \frac{27}{16}\right\}$(채점기준 4점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-3
    deductions: []
