stimuli: []
stem: |
  시각 $t=0$일 때 동시에 원점을 출발하여 수직선 위를 움직이는 두 점 $\mathrm{P}$, $\mathrm{Q}$가 있다. 시각 $t\ (t\ge0)$에서의 점 $\mathrm{P}$의 속도 $v_1(t)$와 점 $\mathrm{Q}$의 가속도 $a_2(t)$는
  $$v_1(t)=-\frac12t^{2}+\frac52t,\quad a_2(t)=2t-\frac12$$
  이다. 시각 $t=k$일 때, 두 점 $\mathrm{P}$, $\mathrm{Q}$의 속도가 같고 점 $\mathrm{Q}$의 가속도가 점 $\mathrm{P}$의 가속도의 $7$배이다. $t=0$에서 $t=k$까지 두 점 $\mathrm{P}$, $\mathrm{Q}$가 움직인 거리의 차를 구하는 과정을 서술하시오. (단, $k$는 상수이다.)
subparts:
- id: '1'
  stem: |
    움직인 거리의 차를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \frac{47}{24}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $a_1=-t+\frac52$, $2k-\frac12=7(-k+\frac52)\Rightarrow k=2$.
    steps:
    - id: 1a
      content: |
        $v_2=t^2-\frac12t$, 거리 $\frac{11}{3}$, $\frac{41}{24}$, 차 $\frac{47}{24}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - P의 가속도를 구하자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 80(PDF 259~260쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        시각 $t$에서 점 $\mathrm{P}$의 가속도는 $a_1(t)=-t+\dfrac52$이고, 시각 $t=k$일 때 점 $\mathrm{Q}$의 가속도가 점 $\mathrm{P}$의 가속도의 $7$배이므로 $2k-\dfrac12=7\left(-k+\dfrac52\right)$, 즉 $k=2$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        점 $\mathrm{Q}$의 속도 $v_2(t)=t^2-\dfrac12t+C$ (단, $C$는 적분상수)이고, $t=2$일 때 두 점의 속도가 같으므로 $C=0$이고 $v_2(t)=t^2-\dfrac12t$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $t=0$에서 $t=2$까지 점 $\mathrm{P}$가 움직인 거리 $\displaystyle\int_0^2|v_1(t)|dt=\frac{11}{3}$이고, 점 $\mathrm{Q}$가 움직인 거리 $\displaystyle\int_0^2|v_2(t)|dt=\int_0^{\frac12}\left(-t^2+\frac12t\right)dt+\int_{\frac12}^2\left(t^2-\frac12t\right)dt=\frac{41}{24}$이다.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        따라서 두 점 $\mathrm{P}$, $\mathrm{Q}$가 움직인 거리의 차는 $\dfrac{11}{3}-\dfrac{41}{24}=\dfrac{47}{24}$이다.
      criteria:
      - 1.A3
