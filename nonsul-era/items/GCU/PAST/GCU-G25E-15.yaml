stimuli: []
stem: |
  상수 $a$와 $\dfrac{\pi}{2}<\theta<\pi$에 대하여, 이차방정식 $3x^{2}-\sqrt5x+a=0$의 해가 $\sin\theta$, $\cos\theta$이다. $\sin\theta-\cos\theta$의 값을 $b$라 할 때, $ab$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $ab$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      -\frac{2\sqrt{13}}{9}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\sin\theta+\cos\theta=\frac{\sqrt5}{3}$, $\sin\theta\cos\theta=\frac a3=-\frac29$.
    steps:
    - id: 1a
      content: |
        $a=-\frac23$, $b=\frac{\sqrt{13}}{3}$, $ab=-\frac{2\sqrt{13}}{9}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - 근과 계수의 관계를 쓰자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 81(PDF 261~262쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        이차방정식의 근과 계수의 관계에 의해 $\sin\theta+\cos\theta=\dfrac{\sqrt5}{3}$ …①, $\sin\theta\cos\theta=\dfrac a3$ …②
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ①의 양변을 제곱하면 $(\sin\theta+\cos\theta)^2=\dfrac59$, $\sin\theta\cos\theta=-\dfrac29$ …③. ②와 ③에 의해 $a=-\dfrac23$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $(\sin\theta-\cos\theta)^2=\sin^2\theta+\cos^2\theta-2\sin\theta\cos\theta=1+\dfrac49=\dfrac{13}{9}$. $\dfrac\pi2<\theta<\pi$이므로 $\sin\theta>0$, $\cos\theta<0$이다. $\sin\theta-\cos\theta>0$이므로 $\sqrt{(\sin\theta-\cos\theta)^2}=\sqrt{\dfrac{13}{9}}=\dfrac{\sqrt{13}}{3}=b$
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $\therefore\ a\times b=-\dfrac23\times\dfrac{\sqrt{13}}{3}=-\dfrac{2\sqrt{13}}{9}$
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        $\sin\theta+\cos\theta=\frac{\sqrt5}{3}$(채점기준 1점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $a=-\frac23$(채점기준 4점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $b=\frac{\sqrt{13}}{3}$(채점기준 4점 — 보고서 채점기준표에는 $b=\frac{\sqrt{11}}{3}$으로 인쇄되어 있으나 해설·검산 모두 $\frac{\sqrt{13}}{3}$, 오식으로 판단).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        $a\times b=-\frac{2\sqrt{13}}{9}$(채점기준 1점).
      depends_on:
      - 1.M1
      - 1.A1
      - 1.A2
      implied_ok: false
      steps:
      - 1b-4
    deductions: []
