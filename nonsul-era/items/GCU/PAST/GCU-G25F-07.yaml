stimuli: []
stem: |
  $0\le\theta<2\pi$에서 $\sin\left(\dfrac32\pi+\theta\right)-\cos\left(\dfrac32\pi+\theta\right)=-\dfrac34$일 때, $\tan\theta+\dfrac{1}{\tan\theta}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\tan\theta+\frac{1}{\tan\theta}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      -\frac{32}{7}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\cos\theta+\sin\theta=\frac34$.
    steps:
    - id: 1a
      content: |
        $\sin\theta\cos\theta=-\frac{7}{32}$, 값 $=\frac{1}{\sin\theta\cos\theta}=-\frac{32}{7}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $\frac32\pi+\theta=\pi+(\frac\pi2+\theta)$로 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 82(PDF 263~264쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sin\left(\pi+\left(\dfrac\pi2+\theta\right)\right)-\cos\left(\pi+\left(\dfrac\pi2+\theta\right)\right)=-\dfrac34$, $-\sin\left(\dfrac\pi2+\theta\right)+\cos\left(\dfrac\pi2+\theta\right)=-\dfrac34$, $-\cos\theta-\sin\theta=-\dfrac34$, $\cos\theta+\sin\theta=\dfrac34$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $(\sin\theta+\cos\theta)^2=\sin^2\theta+\cos^2\theta+2\sin\theta\cos\theta$, $\therefore\ \sin\theta\cos\theta=-\dfrac{7}{32}$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\tan\theta+\dfrac{1}{\tan\theta}=\dfrac{\sin\theta}{\cos\theta}+\dfrac{\cos\theta}{\sin\theta}=\dfrac{\sin^2\theta+\cos^2\theta}{\sin\theta\cos\theta}=-\dfrac{32}{7}$
      criteria:
      - 1.A2
  rubric:
