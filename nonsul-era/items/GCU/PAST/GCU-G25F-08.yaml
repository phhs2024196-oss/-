  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\frac16+\frac19\left(\frac{1}{3n+1}-\frac{1}{3n+4}\right)$.
    steps:
    - id: 1a
      content: |
        $2+\frac19\left(\frac14-\frac1{40}\right)=\frac{81}{40}$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 분모를 인수분해하자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 83(PDF 265~266쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\dfrac{3n^2+5n+2}{18n^2+30n+8}=\dfrac16\times\dfrac{9n^2+15n+6}{9n^2+15n+4}=\dfrac16\left(1+\dfrac{2}{9n^2+15n+4}\right)=\dfrac16\left\{1+\dfrac{2}{(3n+1)(3n+4)}\right\}$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $=\dfrac16+\dfrac19\left(\dfrac{1}{3n+1}-\dfrac{1}{3n+4}\right)$
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\displaystyle\sum_{n=1}^{12}\left\{\frac16+\frac19\left(\frac{1}{3n+1}-\frac{1}{3n+4}\right)\right\}=2+\frac19\left(\frac14-\frac17+\frac17-\cdots-\frac{1}{37}+\frac{1}{37}-\frac{1}{40}\right)=2+\frac19\left(\frac14-\frac{1}{40}\right)=2+\frac{1}{40}=\frac{81}{40}$
      criteria:
      - 1.A1
