  misconceptions:
  - id: MC-ALG-8648
    outcome_code: '71'
    wrong_work: |
      $\sum_{n=1}^{100}\log_2a_n$을 $\sum_{n=1}^{100}\sin\frac n6\pi$로 계산(짝짓기 없이 모든 $n$ 사용)
    detect_cue: |
      $\log_2a_n$의 합이 $\frac32$가 아님
    feedback: |
      $\log_2a_n+\log_2a_{n+1}=\sin\frac n6\pi$이므로 두 항씩 묶으면 홀수 $n$의 값만 더해집니다.
    remedy:
    - RL-MC-ALG-8648
