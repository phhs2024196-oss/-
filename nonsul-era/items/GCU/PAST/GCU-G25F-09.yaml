stimuli: []
stem: |
  모든 항이 양수인 수열 $\{a_n\}$, $\{b_n\}$, $\{c_n\}$이 모든 자연수 $n$에 대하여
  $$a_na_{n+1}=2^{\sin\frac n6\pi},\quad b_nb_{n+1}=2^{\cos\frac n3\pi},\quad c_nc_{n+1}=2^{\tan\frac{2n-1}{4}\pi}$$
  을 만족시킬 때, $\displaystyle\sum_{n=1}^{100}\log_2(a_nb_nc_n)$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    합의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '51'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      홀수 $n$에 대한 지수의 합.
    steps:
    - id: 1a
      content: |
        $\frac32-\frac12+50=51$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - |
      $(a_1a_2)(a_3a_4)\cdots$로 묶어 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 84(PDF 267~269쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\sum_{n=1}^{100}\log_2(a_nb_nc_n)=\sum_{n=1}^{100}(\log_2a_n+\log_2b_n+\log_2c_n)$
        $\displaystyle\sum_{n=1}^{100}\log_2a_n=\log_2\{(a_1a_2)(a_3a_4)\cdots(a_{99}a_{100})\}=\sin\frac\pi6+\sin\frac36\pi+\cdots+\sin\frac{97}{6}\pi+\sin\frac{99}{6}\pi$
        사인함수의 주기는 $2\pi$이므로 $\sin\dfrac\pi6+\sin\dfrac36\pi+\cdots+\sin\dfrac{11}{6}\pi$의 값이 $8$번 반복되며, 그 값은 $0$이다. 따라서 $\displaystyle\sum_{n=1}^{100}\log_2a_n=\sin\frac{97}{6}\pi+\sin\frac{99}{6}\pi=\frac32$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\sum_{n=1}^{100}\log_2b_n=\cos\frac\pi3+\cos\frac33\pi+\cdots+\cos\frac{99}{3}\pi$. 코사인함수의 주기는 $2\pi$이므로 $\cos\dfrac\pi3+\cos\dfrac33\pi+\cos\dfrac53\pi$의 값이 $16$번 반복되며, 그 값은 $0$이다. 따라서 $\displaystyle\sum_{n=1}^{100}\log_2b_n=\cos\frac{97}{3}\pi+\cos\frac{99}{3}\pi=-\frac12$. $\displaystyle\sum_{n=1}^{100}\log_2c_n=\tan\frac\pi4+\tan\frac54\pi+\cdots+\tan\frac{197}{4}\pi$. 탄젠트함수의 주기는 $\pi$이므로 $\tan\dfrac\pi4$의 값이 $50$번 반복되며, 그 값은 $50$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\displaystyle\sum_{n=1}^{100}\log_2(a_nb_nc_n)=\frac32-\frac12+50=51$
      criteria:
      - 1.A1
