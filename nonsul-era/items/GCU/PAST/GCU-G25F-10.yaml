stimuli: []
stem: |
  그림과 같이 $1<k<16$인 자연수 $k$에 대하여 함수 $y=|(x-1)(x-k)|$의 그래프가 직선 $y=m(x-1)$과 서로 다른 세 점에서 만난다. 세 점의 $x$좌표를 작은 수부터 크기 순서대로 $a_1$, $a_2$, $a_3$이라 하자. 세 수 $a_1$, $a_2$, $a_3$이 이 순서대로 공비가 $r$인 등비수열을 이룰 때, 공비 $r$가 유리수가 되도록 하는 모든 자연수 $k$의 값의 합을 구하는 과정을 서술하시오. (단, $m$은 양수이다.)

  [그림: $y=|(x-1)(x-k)|$의 W자 모양 그래프와 점 $(1,0)$을 지나는 직선 $y=m(x-1)$. 교점 $a_1=1$, 가운데 볼록 부분 위 $a_2$, $x=k$ 오른쪽 $a_3$.]
subparts:
- id: '1'
  stem: |
    모든 자연수 $k$의 값의 합을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '34'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $(r^2-k)=m$, $-r+k=m$ ⇒ $r^2+r-2k=0$.
    steps:
    - id: 1a
      content: |
        $r=-\frac12+\frac{\sqrt{8k+1}}{2}$, $k=3,6,10,15$, 합 $34$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - |
      $a_1$은 얼마인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 85(PDF 270~271쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        그림에서 $a_1=1$이고 공비가 $r$이므로, $a_1=1$, $a_2=r$, $a_3=r^2$이다. $a_1$, $a_2$, $a_3$의 순서대로 서로 다른 세 점에서 만나므로 $r>1$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x=a_3$일 때 $y$값이 같으므로 $(r^2-1)(r^2-k)=m(r^2-1)$, $r^2-k=m$ …①, $x=a_2$일 때 $y$값이 같으므로 $-(r-1)(r-k)=m(r-1)$, $-r+k=m$ …②. ①, ②를 연립하면 $r^2+r-2k=0$, 이차방정식을 풀면 $r=-\dfrac12\pm\sqrt{2k+\dfrac14}=-\dfrac12\pm\dfrac{\sqrt{8k+1}}{2}$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $r>1$이고, $8k+1$이 자연수의 제곱수가 되면 $r$가 유리수가 되므로, $1<k<16$인 자연수 $k$는 $3,\ 6,\ 10,\ 15$이고,
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        합은 $3+6+10+15=34$이다. (참고: $k=3\to r=2,\ m=1$, $k=6\to r=3,\ m=3$, $k=10\to r=4,\ m=6$, $k=15\to r=5,\ m=10$)
      criteria:
      - 1.A1
