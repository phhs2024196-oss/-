  misconceptions:
  - id: MC-ALG-8650
    outcome_code: '71'
    wrong_work: |
      $y=-\log_5(-x)+a$를 증가함수로 보고 $x=-\frac1{125}$에서 최솟값을 잡음
    detect_cue: |
      $a=-\frac{11}{5}$ 등 음수
    feedback: |
      $x$가 커지면 $-x$는 작아지고 $-\log_5(-x)$는 커지므로 $y$는 증가합니다. 따라서 최솟값은 왼쪽 끝 $x=-\sqrt[5]5$에서입니다.
    remedy:
    - RL-MC-ALG-8650
