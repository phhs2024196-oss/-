      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $M=4$(채점기준 3점).
      depends_on:
      - 1.M1
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
    deductions: []
