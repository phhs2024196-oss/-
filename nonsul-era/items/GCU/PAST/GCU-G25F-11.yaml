stimuli: []
stem: |
  방정식 $\log_5(5^{x}+10)=\dfrac x2+\log_5\dfrac{10}{25}+2$의 두 근을 $\alpha$, $\beta$라 할 때, $\dfrac{1}{5^{\alpha}}+\dfrac{1}{5^{\beta}}$의 값을 $m$이라 하자.
  정의역이 $\left\{x\ \middle|\ -\sqrt[5]5\le x\le-\dfrac{1}{125}\right\}$인 함수 $y=-\log_5(-x)+a$의 최댓값은 $M$이고 최솟값이 $m$일 때, $a$, $M$, $m$의 값을 구하는 과정을 서술하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $a$, $M$, $m$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      a=1,\ M=4,\ m=\frac{4}{5}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $k^2-80k+100=0$ ($k=5^x$).
    steps:
    - id: 1a
      content: |
        $m=\frac{80}{100}=\frac45$; $x=-\sqrt[5]5$에서 최솟값 $\Rightarrow a=1$, $M=4$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $5^x=k$로 치환하자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 86(PDF 272~274쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\log_5(5^x+10)=\dfrac x2+2+(\log_510-\log_525)=\dfrac x2+2+\log_510-2$, $\log_5\dfrac{5^x+10}{10}=\dfrac x2$, $\dfrac{5^x+10}{10}=5^{\frac x2}$에서 양변을 제곱하면 $\dfrac{(5^x+10)^2}{100}=5^x$.
        $5^x=k$라 하자$(k>0)$. $k^2-80k+100=0$. 이차방정식의 근과 계수 관계에 의해 $5^\alpha+5^\beta=80$, $5^\alpha\times5^\beta=100$.
        $\therefore\ \dfrac{1}{5^\alpha}+\dfrac{1}{5^\beta}=\dfrac{5^\beta+5^\alpha}{5^\alpha\times5^\beta}=\dfrac{80}{100}=\dfrac45=m$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        정의역이 $\left\{x\,\middle|\,-\sqrt[5]5\le x\le-\dfrac1{125}\right\}$인 함수 $y=-\log_5(-x)+a$는 $x=-\sqrt[5]5$일 때 최솟값을 갖고, 최솟값이 $\dfrac45$이므로 $\dfrac45=-\log_5\sqrt[5]5+a$, $\therefore\ a=1$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        함수 $y=-\log_5(-x)+1$은 $x=-\dfrac1{125}$일 때 최댓값 $M=4$를 갖는다.
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
