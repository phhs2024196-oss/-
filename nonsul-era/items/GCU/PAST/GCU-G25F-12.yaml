intent: |
  함수의 극대와 극소를 이해하고, 이를 활용하여 주어진 $k$값의 범위를 구할 수 있는지 확인한다(문항카드 출제 의도 원문). $g'=f$가 $[0,k]$에서 감소함을 보이고 $f(k)<0$이므로 $f(0)>0$이면 부호가 바뀌어 극값이 생김을 이용한다.
key_idea: |
  $f'(x)$는 $x=k+2$에서 최대이고 $f'(k)=-3<0$이므로 $[0,k]$에서 $f$는 감소.
stuck: |
