stimuli: []
stem: |
  양수 $k$에 대하여 함수 $f(x)$는 $f(x)=(k-x)^{3}+6(k-x)^{2}+3(k-x)-18$이라고 하자. 닫힌구간 $[0,k]$에서 정의된 함수
  $$g(x)=\int_0^xf(t)\,dt$$
  가 열린구간 $(0,k)$에서 극값을 갖도록 하는 $k$의 범위를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $k$의 범위를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      k>\frac{-3+\sqrt{33}}{2}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f$는 $[0,k]$에서 감소, $f(k)=-18<0$.
    steps:
    - id: 1a
      content: |
        $f(0)=(k+3)(k^2+3k-6)>0\Rightarrow k>\frac{-3+\sqrt{33}}2$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $g'(x)$는 무엇인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 87(PDF 275~276쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        열린구간 $(0,k)$에서 $g'(x)=f(x)$이다. $f(x)$의 닫힌구간 $[0,k]$에서 $f(x)$를 전개하여 미분하면 $f'(x)=-3x^2+(6k+12)x-3k^2-12k-3$이므로, $f'(x)$는 $x=k+2$에서 최대이고, $f'(k)=-3<0$이다. 따라서 닫힌구간 $[0,k]$에서 $f'(x)<0$이므로 $f(x)$는 감소한다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(k)=-18<0$이므로
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $f(0)=k^3+6k^2+3k-18=(k+3)(k^2+3k-6)>0$을 만족시키는 양수 $k$에 대하여 $g(x)$가 열린구간 $(0,k)$에서 극값을 가진다. $k$가 양수이므로 $k+3$은 항상 양수이고, 따라서 $k^2+3k-6>0$을 만족시키는 양수 $k$에 대하여 $g(x)$가 열린구간 $(0,k)$에서 극값을 가진다. 따라서 $k>\dfrac{-3+\sqrt{33}}{2}$이다.
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        닫힌구간 $[0,k]$에서 $f(x)$는 감소 (또는 $g'(x)$는 감소 또는 열린구간 $(0,k)$에서 $f'(x)<0$)(채점기준 5점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $f(k)=-18<0$(채점기준 1점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $k^2+3k-6>0$ (원 채점기준 2.5점) + $k>\frac{-3+\sqrt{33}}{2}$ (원 1.5점) — 정수 배점 규칙상 인접 두 마크를 합침.
      depends_on:
      - 1.M1
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
    deductions: []
