stimuli: []
stem: |
  최고차항의 계수가 $1$인 이차함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $f(x)$의 최솟값은 음수이다.
  (나) 함수 $y=f(x)$의 그래프와 직선 $y=f(2)$가 서로 다른 두 점 $\mathrm{A}$, $\mathrm{B}$에서 만나고 두 점 $\mathrm{A}$, $\mathrm{B}$의 $x$좌표의 합은 $6$이다.
  (다) $\displaystyle\lim_{x\to5}\frac{1}{x-5}\left\{\int_a^x|f(t)|\,dt-2\int_a^3|f(t)|\,dt\right\}=6$

  $af(3)$의 값을 구하는 과정을 서술하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $af(3)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-10'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $b=-6$, $a=1$, $|f(5)|=|-5+c|=6$.
    steps:
    - id: 1a
      content: |
        $c=-1$ ((가)로 $c=11$ 배제), $af(3)=-10$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      (다)의 극한이 존재하려면 $x=5$에서 괄호 안은?
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 88(PDF 277~278쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^2+bx+c$라 하자. 조건 (나): $\mathrm{A}$, $\mathrm{B}$의 $x$좌표는 $f(x)=f(2)$의 서로 다른 실근이다. $x^2+bx+c=4+2b+c\Rightarrow x^2+bx-2b-4=0$이므로 근과 계수의 관계(또는 대칭축)에 의해 $-b=6$, 즉 $b=-6$이다. 따라서 $f(x)=x^2-6x+c$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        조건 (다)로부터 $\displaystyle\int_a^5|f(t)|dt-2\int_a^3|f(t)|dt=0$이므로 $\displaystyle\int_a^5|f(t)|dt=2\int_a^3|f(t)|dt$이다. 따라서 $\displaystyle\int_3^5|f(t)|dt=\int_a^5|f(t)|dt+\int_3^a|f(t)|dt=\int_a^3|f(t)|dt$이다. $|f(x)|\ge0$이고 함수 $y=|f(x)|$는 직선 $x=3$에 대하여 대칭이므로 $a=1$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $g(x)=\displaystyle\int_1^x|f(t)|dt-2\int_1^3|f(t)|dt$라 하면 $g(5)=0$이고 $\displaystyle\lim_{x\to5}\frac{g(x)-g(5)}{x-5}=g'(5)=|f(5)|=|-5+c|=6$. $c=11$일 때 $f(x)=x^2-6x+11$이고 $f(x)$의 최솟값 $f(3)=2>0$이므로 조건 (가)를 만족시킬 수 없다. $c=-1$일 때 $f(x)=x^2-6x-1$이고 $f(x)$의 최솟값 $f(3)=-10<0$
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $af(3)=1\times(-10)=-10$
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $f(x)=x^2+bx+c$라 하면 $b=-6$ (또는 $f(x)=x^2-6x+c$)(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $a=1$(채점기준 3점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $c=-1$ (또는 $f(x)=x^2-6x-1$)(채점기준 4점).
      depends_on:
      - 1.M2
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        $af(3)=-10$(채점기준 1점).
      depends_on:
      - 1.M1
      - 1.A1
      implied_ok: false
      steps:
      - 1b-4
    deductions: []
