intent: |
  함수의 극한의 성질과 다항함수의 정적분의 성질을 이해하고 적용할 수 있는지 확인한다(문항카드 출제 의도 원문). (나)에서 대칭축 $x=3$을 얻고, (다)의 극한이 존재하려면 괄호가 $x=5$에서 0이어야 함을 써서 대칭성으로 $a=1$, 미분계수로 $|f(5)|=6$을 얻는다.
key_idea: |
  $|f|$는 $x=3$에 대해 대칭이므로 $\int_3^5|f|=\int_1^3|f|$.
stuck: |
