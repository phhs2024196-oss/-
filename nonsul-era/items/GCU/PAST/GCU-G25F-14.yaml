intent: |
  주어진 도형의 넓이를 표현할 수 있고, 함수의 극한을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). 수선의 발 B의 $x$좌표 $t$를 $m$으로 나타내고 두 삼각형 넓이를 $t$, $m$으로 표현해 극한을 계산한다.
key_idea: |
  $t=\frac{4(m+1)}{m^2+1}$, $\frac{S}{T}=\frac{4-t}{t}=\frac{m^2-m}{m+1}$.
stuck: |
