stimuli: []
stem: |
  좌표평면 위의 점 $\mathrm{A}(4,4)$와 실수 $m\ (m>1)$에 대하여 점 $\mathrm{A}$에서 직선 $y=mx$에 내린 수선의 발을 $\mathrm{B}$라 하자. 점 $\mathrm{B}$를 지나며 $x$축에 수직인 직선이 선분 $\mathrm{OA}$와 만나는 점을 $\mathrm{C}$라 하자. 삼각형 $\mathrm{ABC}$의 넓이를 $S(m)$, 삼각형 $\mathrm{OBC}$의 넓이를 $T(m)$이라 할 때, $\displaystyle\lim_{m\to1+}\frac{S(m)}{(m-1)T(m)}$의 값을 구하는 과정을 서술하시오. (단, $\mathrm{O}$는 원점이고, 점 $\mathrm{B}$의 $x$좌표는 $0$보다 크다.)
subparts:
- id: '1'
  stem: |
    극한값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \frac{1}{2}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $t=\frac{4(m+1)}{m^2+1}$.
    steps:
    - id: 1a
      content: |
        $S=\frac{8m(m+1)(m-1)^2}{(m^2+1)^2}$, $T=\frac{8(m-1)(m+1)^2}{(m^2+1)^2}$, 극한 $\frac12$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - |
      B$(t, mt)$로 놓자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 89(PDF 279~280쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        어떤 $t$에 대해 $\mathrm{B}(t,mt)$이다. 점 $\mathrm{A}$에서 직선 $\mathrm{BC}$에 내린 수선의 발을 $\mathrm{H}$, 직선 $\mathrm{BC}$가 $x$축과 만나는 점을 $\mathrm{D}$라 하면, 삼각형 $\mathrm{OBD}$와 삼각형 $\mathrm{BAH}$는 닮은꼴이므로 $t:mt=(mt-4):(4-t)$. 따라서 $t=\dfrac{4(m+1)}{m^2+1}$이므로
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        삼각형 $\mathrm{ABC}$의 넓이는 $S(m)=\dfrac12(mt-t)(4-t)=\dfrac{8m(m+1)(m-1)^2}{(m^2+1)^2}$이고, 삼각형 $\mathrm{OBC}$의 넓이는 $T(m)=\dfrac t2(mt-t)=\dfrac12(m-1)\left\{\dfrac{4(m+1)}{m^2+1}\right\}^2=\dfrac{8(m-1)(m+1)^2}{(m^2+1)^2}$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 $\displaystyle\lim_{m\to1+}\frac{S(m)}{(m-1)T(m)}=\frac12$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\mathrm{B}(t,mt)$에 대해 $t=\frac{4(m+1)}{m^2+1}$ ($t$ 대신 다른 매개변수 사용 가능)(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        $S(m)=\frac12(mt-t)(4-t)$, $T(m)=\frac t2(mt-t)$ (또는 $\frac{S(m)}{T(m)}=\frac{m^2-m}{m+1}$)(채점기준 5점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $\lim_{m\to1+}\frac{S(m)}{(m-1)T(m)}=\frac12$(채점기준 2점).
      depends_on:
      - 1.M2
      implied_ok: false
      steps:
      - 1b-3
    deductions: []
