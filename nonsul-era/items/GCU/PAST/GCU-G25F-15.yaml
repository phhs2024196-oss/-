stimuli: []
stem: |
  사차함수 $f(x)=\dfrac14x^{4}-\dfrac53x^{3}+x^{2}+8x+9$이고, 삼차함수 $g(x)$는 최고차항의 계수가 $1$이고 $g(0)=-\dfrac13$이다. $f(x)$와 $g(x)$가 $x=a$에서 같은 극댓값을 가질 때, 함수 $g(x)$의 극솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $g(x)$의 극솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \frac{47}{3}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f'(x)=(x+1)(x-2)(x-4)$, 극댓값 $f(2)=\frac{59}{3}$.
    steps:
    - id: 1a
      content: |
        $g(x)=x^3-9x^2+24x-\frac13$, 극솟값 $g(4)=\frac{47}{3}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $f'(x)$를 인수분해하자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 보고서(2025) 문항카드 90(PDF 281~282쪽) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=x^3-5x^2+2x+8=(x+1)(x-2)(x-4)$이므로, $f(x)$는 $x=2$에서
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        극댓값 $\dfrac{59}{3}$를 가진다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $g(x)=x^3+bx^2+cx-\dfrac13$이라 하면, $0=g'(2)=12+4b+c$이고, $\dfrac{59}{3}=g(2)=8+4b+2c-\dfrac13$이므로, $b=-9$, $c=24$이다.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $g'(x)=3x^2-18x+24=3(x-2)(x-4)$이므로, 함수 $g(x)$의 극솟값은 $g(4)=\dfrac{47}{3}$이다.
      criteria:
      - 1.A3
