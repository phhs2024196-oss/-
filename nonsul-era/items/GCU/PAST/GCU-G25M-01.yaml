stimuli: []
stem: |
  그림과 같이 자연수 $n$에 대하여 직각삼각형 $\mathrm{AB_0C_0}$의 선분 $\mathrm{AB_0}$ 위의 점 $\mathrm{B}_n$과 선분 $\mathrm{AC_0}$ 위의 점 $\mathrm{C}_n$을 다음 규칙에 따라 정한다.

  (가) $\angle\mathrm{C_0}=\dfrac{\pi}{2}$, $\angle\mathrm{B_0}=\dfrac{5}{12}\pi$, $\overline{\mathrm{B_0C_0}}=6$
  (나) 선분 $\mathrm{B_0C_0}$을 지름으로 하는 반원을 $G_0$이라 하고, $G_0$이 선분 $\mathrm{AB_0}$과 만나는 점 중 $\mathrm{B_0}$이 아닌 점이 $\mathrm{B_1}$이다. 점 $\mathrm{B_1}$을 지나면서 선분 $\mathrm{B_0C_0}$과 평행한 직선이 선분 $\mathrm{AC_0}$과 만나는 점이 $\mathrm{C_1}$이다.
  (다) 선분 $\mathrm{B_1C_1}$을 지름으로 하는 반원을 $G_1$이라 하고, $G_1$이 선분 $\mathrm{AB_1}$과 만나는 점 중 $\mathrm{B_1}$이 아닌 점이 $\mathrm{B_2}$이다. 점 $\mathrm{B_2}$를 지나면서 선분 $\mathrm{B_1C_1}$과 평행한 직선이 선분 $\mathrm{AC_1}$과 만나는 점이 $\mathrm{C_2}$이다.
  (라) 선분 $\mathrm{B}_n\mathrm{C}_n$을 지름으로 하는 반원을 $G_n$이라 하고, $G_n$이 선분 $\mathrm{AB}_n$과 만나는 점 중 $\mathrm{B}_n$이 아닌 점이 $\mathrm{B}_{n+1}$이다. 점 $\mathrm{B}_{n+1}$을 지나면서 선분 $\mathrm{B}_n\mathrm{C}_n$과 평행한 직선이 선분 $\mathrm{AC}_n$과 만나는 점이 $\mathrm{C}_{n+1}$이다.

  반원 $G_{n-1}$에서 호 $\mathrm{B}_{n-1}\mathrm{B}_n$과 선분 $\mathrm{B}_{n-1}\mathrm{B}_n$으로 둘러싸인 부분의 넓이를 $T_{n-1}$이라 하자. $\displaystyle\sum_{k=0}^{\infty}T_k=\left(p+q\sqrt{3}\right)\left(\frac{\pi}{3}-1\right)$일 때, 유리수 $p$와 $q$의 값을 구하는 과정을 서술하시오. [15점]

  [그림: 밑변 $\mathrm{B_0C_0}$(왼쪽 $\mathrm{B_0}$, 오른쪽 $\mathrm{C_0}$)이 수평이고 꼭짓점 $\mathrm{A}$가 $\mathrm{C_0}$ 바로 위에 있는 직각삼각형. 첫 그림: $\mathrm{B_0C_0}$을 지름으로 삼각형 안쪽(위쪽)에 그린 반원 $G_0$이 빗변 $\mathrm{AB_0}$과 $\mathrm{B_1}$에서 만나고, 호 $\mathrm{B_0B_1}$과 현 $\mathrm{B_0B_1}$ 사이의 활꼴 $T_0$이 색칠됨. 둘째 그림: $\mathrm{B_1}$에서 밑변에 평행한 선분 $\mathrm{B_1C_1}$($\mathrm{C_1}$은 $\mathrm{AC_0}$ 위)을 지름으로 반원 $G_1$을 그리고 $\mathrm{AB_1}$과의 교점 $\mathrm{B_2}$, 활꼴 $T_1$이 색칠됨. 이후 같은 과정이 반복됨($\cdots$).]
subparts:
- id: '1'
  stem: |
    유리수 $p$와 $q$의 값을 구하는 과정을 서술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: |
      p=\frac{108}{11},\ q=\frac{48}{11}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $T_0=\frac34\pi-\frac94$, 공비 $\sin^4\frac{5}{12}\pi=\frac{7+4\sqrt3}{16}$.
    steps:
    - id: 1a
      content: |
        $\sum T_n=\frac{\frac94\left(\frac{\pi}{3}-1\right)}{1-\sin^4\frac{5}{12}\pi}=\frac{108+48\sqrt3}{11}\left(\frac{\pi}{3}-1\right)$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $\mathrm{B_0B_1}$과 $\mathrm{C_0B_1}$은 어떤 각을 이루는가?
    - |
      $\overline{\mathrm{B_1C_1}}$을 $\overline{\mathrm{B_0C_0}}$으로 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: 해설_의예.hwp 문항카드(수학 의예 1번) 5. 문항 해설 + 선행학습 보고서(2025) 문항카드 91 6. 채점 기준(PDF 283~284쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $T_0=\dfrac{3^2}{2}\cdot\dfrac{\pi}{6}-\dfrac{3^2}{2}\sin\dfrac{\pi}{6}=\dfrac{3\pi}{4}-\dfrac94$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\overline{\mathrm{AB_0}}=\dfrac{6}{\cos\frac{5}{12}\pi}$, $\overline{\mathrm{B_0B_1}}=6\cos\dfrac{5}{12}\pi$이므로 $\overline{\mathrm{AB_1}}=\dfrac{6}{\cos\frac{5}{12}\pi}-6\cos\dfrac{5}{12}\pi$.
        $\overline{\mathrm{AB_0}}:\overline{\mathrm{AB_1}}=6:\overline{\mathrm{B_1C_1}}$이므로 $\overline{\mathrm{B_1C_1}}=6\sin^2\dfrac{5\pi}{12}$.
        따라서 $T_1=\left(\dfrac{3\pi}{4}-\dfrac94\right)\sin^4\dfrac{5\pi}{12}$이고, 직각삼각형 $\mathrm{AB}_k\mathrm{C}_k$의 밑변의 길이의 비율은 $\sin^2\dfrac{5\pi}{12}$이므로 $T_k$의 공비는 $\sin^4\dfrac{5}{12}\pi$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $\displaystyle\sum_{n=0}^{\infty}T_n=\left(\frac34\pi-\frac94\right)\frac{1}{1-\sin^4\frac{5}{12}\pi}=\frac{108+48\sqrt3}{11}\left(\frac{\pi}{3}-1\right)$이므로 $p=\dfrac{108}{11}$, $q=\dfrac{48}{11}$
      criteria:
      - 1.A2
  - id: S1-ALT1
    audience: ALT
    source_flow: 해설_의예.hwp 문항 해설 2
    method_no: 2
    steps:
    - id: 1alt1-1
      content: |
        $\angle\mathrm{A}=\dfrac{\pi}{12}=\alpha$라 하자. 직각삼각형 $\mathrm{B_0B_1C_0}$의 외접원의 반이 $G_0$이므로 점 $\mathrm{B_1}$은 꼭짓점 $\mathrm{C_0}$에서 빗변 $\mathrm{AB_0}$에 내린 수선의 발과 일치한다. 선분 $\mathrm{B_0C_0}$의 중점을 $\mathrm{M_0}$이라 하면 $\angle\mathrm{B_0M_0B_1}=2\alpha$.
      criteria: []
    - id: 1alt1-2
      content: |
        $\overline{\mathrm{C_0B_1}}=6\cos\alpha$, $\overline{\mathrm{B_1C_1}}=6\cos^2\alpha$, … 이므로 $T_n=\left(3\cos^{2n}\alpha\right)^2(\alpha-\sin\alpha\cos\alpha)$.
        $\displaystyle\sum_{n=0}^{\infty}T_n=9(\alpha-\sin\alpha\cos\alpha)\frac{1}{1-\cos^4\alpha}=9\left(\frac{\pi}{12}-\frac12\sin\frac{\pi}{6}\right)\frac{1}{1-\left(\frac{1+\cos(\pi/6)}{2}\right)^2}=\frac94\left(\frac{\pi}{3}-1\right)\frac{16}{9-4\sqrt3}=\frac{108+48\sqrt3}{11}\left(\frac{\pi}{3}-1\right)$
      criteria: []
