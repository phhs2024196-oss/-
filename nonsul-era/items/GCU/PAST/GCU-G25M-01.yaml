intent: |
  삼각형의 닮은꼴을 이용한 변의 길이의 규칙성으로 영역의 넓이의 무한 합 구하기(문항카드 출제 의도 원문). 보고서 문항카드 91 출제 의도는 '등비급수의 합을 이용하여 반복되는 도형의 넓이를 구할 수 있는지 확인한다'. $T_0$를 활꼴 넓이로 구하고 닮음비 $\sin^2\frac{5}{12}\pi$에서 넓이의 공비 $\sin^4\frac{5}{12}\pi$를 얻는다.
key_idea: |
  $\overline{\mathrm{B}_{n+1}\mathrm{C}_{n+1}}=\sin^2\frac{5}{12}\pi\cdot\overline{\mathrm{B}_n\mathrm{C}_n}$이므로 $T_n$은 공비 $\sin^4\frac{5}{12}\pi$인 등비수열.
stuck: |
  $\mathrm{B}_1$이 $\mathrm{C}_0$에서 빗변에 내린 수선의 발임(지름에 대한 원주각)을 보고 닮음비를 구하는 단계.
