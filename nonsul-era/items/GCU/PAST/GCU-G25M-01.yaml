      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: |
        $p=\frac{108}{11}$, $q=\frac{48}{11}$(원 채점기준 $p$ 2.5점+$q$ 2.5점 — 정수 배점 규칙상 두 마크를 합침).
      depends_on:
      - 1.M1
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
    deductions: []
