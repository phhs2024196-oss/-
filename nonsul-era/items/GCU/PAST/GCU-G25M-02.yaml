intent: |
  정적분을 급수의 합으로 나타내는 방법에 대한 이해 확인(문항카드 출제 의도 원문). $\left(1+\frac1n\right)^2\ln n=\frac{4}{n^4}\sum k^3\ln n\cdot$(보정)으로 바꿔 두 합을 하나로 묶고 $\int_0^1x^3\ln(x+1)dx$로 나타낸다.
key_idea: |
  $\sum_{k=1}^nk^3=\frac{n^2(n+1)^2}{4}$이므로 $\left(1+\frac1n\right)^2\ln n=\frac{4}{n^4}\sum_{k=1}^nk^3\ln n$.
stuck: |
  $\ln n$ 항을 $\sum k^3$으로 바꿔 $\ln\frac{n}{k+n}$을 만드는 발상.
