stimuli: []
stem: |
  $\displaystyle\lim_{n\to\infty}\left\{\left(1+\frac{1}{n}\right)^{2}\ln n-\frac{4}{n^{4}}\sum_{k=1}^{n}k^{3}\ln(k+n)\right\}$의 값을 구하는 과정을 서술하시오. [15점]
subparts:
- id: '1'
  stem: |
    극한값을 구하는 과정을 서술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: |
      -\frac{7}{12}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      두 합을 묶어 $-\frac{4}{n}\sum\left(\frac kn\right)^3\ln\left(\frac kn+1\right)$.
    steps:
    - id: 1a
      content: |
        $-4\int_0^1x^3\ln(x+1)dx=-4\cdot\frac14\cdot\frac{7}{12}=-\frac{7}{12}$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - |
      $\sum_{k=1}^nk^3$의 공식을 떠올려 보자.
  - id: S1-B
    audience: B
    source_flow: 해설_의예.hwp 문항카드(수학 의예 2번) 5. 문항 해설 + 선행학습 보고서(2025) 문항카드 92 6. 채점 기준(PDF 286~287쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{n\to\infty}\left(1+\frac1n\right)^2\ln n=\lim_{n\to\infty}\frac{n^2(n+1)^2}{4}\times\frac{4}{n^4}\times\ln n=\lim_{n\to\infty}\sum_{k=1}^nk^3\times\frac{4}{n^4}\times\ln n$ 이다. 따라서
        $\displaystyle\lim_{n\to\infty}\left\{\left(1+\frac1n\right)^2\ln n-\frac{4}{n^4}\sum_{k=1}^nk^3\ln(k+n)\right\}=\lim_{n\to\infty}\frac{4}{n^4}\sum_{k=1}^nk^3\{\ln n-\ln(k+n)\}=-4\lim_{n\to\infty}\sum_{k=1}^n\left(\frac kn\right)^3\ln\left(\frac kn+1\right)\frac1n$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle=-4\int_0^1x^3\ln(x+1)\,dx$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        또한 $\displaystyle\int_0^1x^3\ln(x+1)\,dx=\left[\frac14x^4\ln(x+1)\right]_0^1-\int_0^1\frac14\frac{x^4}{x+1}dx=\frac{\ln2}{4}-\frac14\int_0^1\left(x^3-x^2+x-1+\frac{1}{x+1}\right)dx=\frac{\ln2}{4}-\frac14\left(-\frac{7}{12}+\ln2\right)=\frac14\times\frac{7}{12}$
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        따라서 구하는 극한의 값은 $-4\times\dfrac14\times\dfrac{7}{12}=-\dfrac{7}{12}$이다.
      criteria:
      - 1.A1
