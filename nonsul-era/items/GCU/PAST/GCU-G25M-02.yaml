    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $\lim\sum\left(\frac kn\right)^3\ln\left(\frac kn+1\right)\frac1n=\int_0^1x^3\ln(x+1)dx$ (원 채점기준 3.5점) + $\int_0^1x^3\ln(x+1)dx=\frac14\times\frac{7}{12}$ (원 5점) + 극한값 $-\frac{7}{12}$ (원 1.5점) — 정수 배점 규칙상 풀이 순서상 이어지는 세 마크를 합침.
      depends_on:
      - 1.M1
      implied_ok: false
