stimuli: []
stem: |
  함수 $f(x)=\ln(ax)$의 그래프와 이차함수 $g(x)=b^{2}x^{2}-bx+1$의 그래프가 한 점 $\mathrm{P}(\alpha,\beta)$에서만 만나고 $f'(\alpha)=g'(\alpha)$이다. 기울기가 음수이고 점 $\mathrm{P}$를 지나는 직선이 $x$축, $y$축과 만나는 점을 각각 $\mathrm{A}$, $\mathrm{B}$라 하자. 선분 $\mathrm{AB}$의 길이의 최솟값이 $8$일 때, $ab$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$는 양수이다.) [20점]
subparts:
- id: '1'
  stem: |
    $ab$의 값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: |
      \frac{e}{27}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\frac1\alpha=2b^2\alpha-b\Rightarrow\alpha=\frac1b$, $\ln\frac ab=1$.
    steps:
    - id: 1a
      content: |
        $(1+b^{2/3})^{3/2}=8b\Rightarrow b^{2/3}=\frac13$, $ab=eb^2=\frac{e}{27}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $f'(\alpha)=g'(\alpha)$를 $\alpha$에 대한 이차방정식으로 정리해 보자.
    - |
      직선이 $x$축과 이루는 각을 $\theta$로 두면 $\overline{\mathrm{AB}}$는?
  - id: S1-B
    audience: B
    source_flow: 해설_의예.hwp 문항카드(수학 의예 3번) 5. 문항 해설 + 선행학습 보고서(2025) 문항카드 93 6. 채점 기준(PDF 288~290쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=\dfrac1x$, $g'(x)=2b^2x-b$이므로 $\dfrac1\alpha=2b^2\alpha-b$이고 $2b^2\alpha^2-b\alpha-1=(2b\alpha+1)(b\alpha-1)=0$이다. $\alpha>0$이므로 $\alpha=\dfrac1b$.
        $f(\alpha)=g(\alpha)$이므로 $\ln a\alpha=\ln\dfrac ab=b^2\alpha^2-b\alpha+1=1$. 따라서 $a=eb$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        점 $\mathrm{P}$의 좌표는 $\left(\dfrac1b,1\right)$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        점 $\mathrm{P}$를 지나는 직선과 $x$축이 이루는 각을 $\theta$라 하면 $\overline{\mathrm{PA}}=\dfrac{1}{\sin\theta}$, $\overline{\mathrm{PB}}=\dfrac1b\cdot\dfrac{1}{\cos\theta}$이므로 $F(\theta)=\dfrac{1}{b\cos\theta}+\dfrac{1}{\sin\theta}$.
        $F'(\theta)=\dfrac{\sin\theta}{b\cos^2\theta}-\dfrac{\cos\theta}{\sin^2\theta}=\dfrac{\sin^3\theta-b\cos^3\theta}{b\cos^2\theta\sin^2\theta}$이므로 $\tan\theta=\sqrt[3]{b}$ $\left(0<\theta<\dfrac{\pi}{2}\right)$일 때 $F'(\theta)=0$이고, 이 값 $\gamma$의 좌우에서 $F'$의 부호가 $-$에서 $+$로 바뀌므로 $F(\gamma)$가 최소.
        (다른 풀이: 직선 $y-1=-m\left(x-\dfrac1b\right)$에서 $G(m)=\overline{\mathrm{AB}}^2$, $G'(m)=\dfrac{2}{b^2m^3}(m^4+bm^3-bm-b)=\dfrac{2}{b^2m^3}(m+b)(m^3-b)$, $m=\sqrt[3]{b}$에서 최소)
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $F(\gamma)=\dfrac{\sqrt{1+b^{2/3}}}{b}+\dfrac{\sqrt{1+b^{2/3}}}{\sqrt[3]{b}}=\dfrac{\left(1+b^{2/3}\right)^{3/2}}{b}=8$에서 $1+b^{2/3}=(8b)^{2/3}=4b^{2/3}$, $b^{2/3}=\dfrac13$이므로 $b=\dfrac{1}{3\sqrt3}$이고 $ab=eb^2=\dfrac{e}{27}$이다.
      criteria:
      - 1.A3
