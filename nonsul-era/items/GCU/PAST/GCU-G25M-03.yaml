      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: M
      points: 5
      evidence: |
        $F'(m)=\frac{2}{b^2m^3}(m^4+bm^3-bm-b)=0$ 또는 이와 동치인 극소 조건(채점기준 5점).
      depends_on:
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A3
      mark_type: A
      points: 12
      evidence: |
        $ab=eb^2=\frac{e}{27}$(채점기준 12점).
      depends_on:
      - 1.A2
      implied_ok: false
      steps:
      - 1b-4
    deductions: []
