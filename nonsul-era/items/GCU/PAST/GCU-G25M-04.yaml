stimuli: []
stem: |
  자연수 $n$에 대하여 양의 실수 전체의 집합에서 정의된 함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $0<x\le n$일 때, 어떤 정수 $m$에 대하여 $m\le\log_{7}(3x+1)<m+1$이면 $f(x)=m$이다.
  (나) 모든 양의 실수 $x$에 대하여 $f(x+n)=f(x)$이다.

  열린구간 $(0,2025)$에 속하는 $x=c$에서 함수 $f(x)$가 불연속일 때, $c$의 개수가 $k$가 되도록 하는 모든 자연수 $n$ 중 최댓값을 $a_k$라 하자. $a_7$, $a_{13}$, $a_{19}$, $a_{25}$의 값을 구하는 과정을 서술하시오. [20점]
subparts:
- id: '1'
  stem: |
    $a_7$, $a_{13}$, $a_{19}$, $a_{25}$의 값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: |
      a_7=2008,\ a_{13}=955,\ a_{19}=477,\ a_{25}=337
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $(0,n)$의 불연속점: $n\le2$에서 0개, $2<n\le16$에서 1개, …, $800<n$에서 4개; 경계점 포함해 반복 수를 센다.
    steps:
    - id: 1a
      content: |
        $a_7=2008$, $a_{13}=955$, $a_{19}=477$, $a_{25}=337$
      criteria:
      - 1.M1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $\log_7(3x+1)$이 정수가 되는 $x$는?
    - |
      $n$이 크면 몇 번 반복되는가?
  - id: S1-B
    audience: B
    source_flow: 해설_의예.hwp 문항카드(수학 의예 4번) 5. 문항 해설 + 선행학습 보고서(2025) 문항카드 94 6. 채점 기준(PDF 291~292쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $7^2=49$, $7^3=343$, $7^4=2401$이므로, 구간 $(0,2)$에서 $f(x)=0$, $[2,16)$에서 $f(x)=1$, $[16,114)$에서 $f(x)=2$, $[114,800)$에서 $f(x)=3$, $[800,2025)$에서 $f(x)=4$.
        구간 $(0,n)$에서 $f$의 불연속인 점의 개수는 $n=2$일 때 $0$개, $2<n\le16$일 때 $1$개, $16<n\le114$일 때 $2$개, $114<n\le800$일 때 $3$개, $800<n\le2025$일 때 $4$개다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        불연속인 점의 개수가 $7$개일 때, $800<n\le2025$인 $n$에 대하여 $(0,n)$의 그래프가 한 번 반복되고 $(n,2025)$에서 불연속인 점이 $2$개($x=2010$, $x=2024$)가 있어야 한다. 따라서 $a_7=2008$.
        불연속인 점의 개수가 $13$개일 때, $800<n\le2025$인 $n$에 대하여 (해설 원문 그대로) $(0,n)$의 그래프가 두 번 반복되고 $(2n,2025)$에서 불연속점이 $3$개($x=1912$, $1926$, $2024$) 존재하면 최댓값인 $n$을 찾을 수 있다. 따라서 $a_{13}=955$.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        불연속인 점의 개수가 $19$개일 때, $114<n\le800$인 $n$에 대하여 $(0,n)$의 그래프가 네 번 반복되고 $(4n,2025)$에서 불연속인 점이 $3$개($x=1910$, $1924$, $2022$) 존재하면 된다. 따라서 $a_{19}=477$.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        불연속인 점의 개수가 $25$개일 때, $114<n\le800$인 $n$에 대하여 $(0,n)$의 그래프가 여섯 번 반복되고 $(6n,2025)$에서 불연속인 점이 $1$개($x=2024$) 존재하면 된다. 따라서 $a_{25}=337$.
      criteria:
      - 1.A3
