intent: |
  함수의 그래프를 이용하여 연속 또는 불연속을 판정하는 방법의 이해 확인(문항카드 출제 의도 원문). $f$의 계단이 바뀌는 점 $x=2,16,114,800$과 주기 $n$의 반복을 세어 불연속점 개수가 $k$인 최대 $n$을 구한다.
key_idea: |
  $3x+1=7^m$인 $x=2,16,114,800$에서 값이 바뀌고, 주기 $n$의 경계 $x=n,2n,\cdots$에서도 불연속.
stuck: |
  $k$가 주어졌을 때 반복 횟수와 남는 구간의 불연속점을 조합해 $n$을 최대로 하는 배치를 찾는 것.
