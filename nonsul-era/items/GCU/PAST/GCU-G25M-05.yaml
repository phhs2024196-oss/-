stimuli: []
stem: |
  실수 전체의 집합에서 미분가능한 함수 $f(x)$가 다음을 만족한다.

  (가) $f(0)=\dfrac{\pi}{2}$이고, 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여 $f(a_n)=2n\pi+\dfrac{\pi}{2}$를 만족시킨다.
  (나) 모든 실수 $x$에 대하여 $f'(x)>0$이고, $f'(x)$는 실수 전체의 집합에서 연속이다.
  (다) 자연수 $n$에 대하여
  　$2(n-1)\pi+\dfrac{\pi}{2}\le f(x)\le 2n\pi-\dfrac{\pi}{2}$일 때, $f'(x)\ge\dfrac{1}{2+\cos f(x)}$이고,
  　$2n\pi-\dfrac{\pi}{2}\le f(x)\le 2n\pi+\dfrac{\pi}{2}$일 때, $f'(x)\le\dfrac{1}{2+\cos f(x)}$이다.

  실수 전체의 집합에서 미분가능한 함수 $g(x)$가 모든 실수 $x$에 대하여 $g(x)>0$와
  $$g(x)=1-\int_{0}^{x}g(t)\cos f(t)\,dt$$
  를 만족시킬 때, $\displaystyle\lim_{n\to\infty}g(a_n)$의 값을 구하는 과정을 서술하시오. [25점]
subparts:
- id: '1'
  stem: |
    $\lim_{n\to\infty}g(a_n)$의 값을 구하는 과정을 서술하시오.
  points: 25
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\frac{g'}{g}=-\cos f$, $t=h(x)$ 치환, (다)로 반주기별 상한.
    steps:
    - id: 1a
      content: |
        $g(a_n)\le e^{-\pi}g(a_{n-1})\Rightarrow 0<g(a_n)\le e^{-n\pi}\to0$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $g'(x)$를 구해 $\frac{g'(x)}{g(x)}$를 보자.
    - |
      $\int\cos f(t)\,dt$를 $f$의 역함수로 치환해 보자.
  - id: S1-B
    audience: B
    source_flow: 해설_의예.hwp 문항카드(수학 의예 5번) 5. 문항 해설 + 선행학습 보고서(2025) 문항카드 95 6. 채점 기준(PDF 293~296쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        사잇값 정리에 의해 자연수 $n$에 대하여 $f(b_n)=2n\pi-\dfrac{\pi}{2}$를 만족하는 양수 $b_n$이 존재한다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\ln\dfrac{g(b_1)}{g(0)}=\displaystyle\int_0^{b_1}\frac{g'(t)}{g(t)}dt=-\int_0^{b_1}\cos f(t)\,dt$. $y=f(x)$의 역함수를 $y=h(x)$라 하고 $t=h(x)$로 치환하면
        $-\displaystyle\int_0^{b_1}\cos f(t)\,dt=-\int_{f(0)}^{f(b_1)}h'(x)\cos x\,dx=\int_{\frac\pi2}^{\frac32\pi}\frac{-\cos x}{f'(h(x))}dx$.
        $F(x)=\displaystyle\int_{\frac\pi2}^{x}\frac{-\cos t}{f'(h(t))}dt+\int_{\frac\pi2}^{x}\cos t(2+\cos t)\,dt$로 놓으면 $F\left(\frac\pi2\right)=0$이고 (다)에 의해 $\left(\frac\pi2,\frac32\pi\right)$에서 $F'(x)=\cos x\left(2+\cos x-\dfrac{1}{f'(h(x))}\right)\le0$. 즉 $F(x)\le0$이므로 $\displaystyle\int_{\frac\pi2}^{\frac32\pi}\frac{-\cos t}{f'(h(t))}dt\le-\int_{\frac\pi2}^{\frac32\pi}\cos t(2+\cos t)\,dt=4-\frac\pi2$, $g(b_1)\le e^{4-\frac\pi2}$.
        같은 방식으로 $\left[2n\pi+\frac\pi2,\ 2(n+1)\pi-\frac\pi2\right]$에서 $H(x)$를 세우면 $\ln\dfrac{g(b_{n+1})}{g(a_n)}\le4-\dfrac\pi2$이므로 $g(b_{n+1})\le e^{4-\frac\pi2}g(a_n)$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        같은 방식으로 $\left[2n\pi-\frac\pi2,\ 2n\pi+\frac\pi2\right]$에서 $G(x)=\displaystyle\int_{2n\pi-\frac\pi2}^{x}\frac{-\cos t}{f'(h(t))}dt+\int_{2n\pi-\frac\pi2}^{x}\cos t(2+\cos t)\,dt$로 놓으면 $G'(x)\le0$, $G\le0$이므로
        $\ln\dfrac{g(a_n)}{g(b_n)}=\displaystyle\int_{2n\pi-\frac\pi2}^{2n\pi+\frac\pi2}\frac{-\cos x}{f'(h(x))}dx\le-4-\frac\pi2$이고 $g(a_n)\le e^{-4-\frac\pi2}g(b_n)$이다.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        따라서 자연수 $n$에 대하여 $0<g(a_n)\le e^{-\pi}g(a_{n-1})$이므로 $0<g(a_n)\le e^{-n\pi}$이고, $\displaystyle\lim_{n\to\infty}g(a_n)=0$이다.
      criteria:
      - 1.A3
