intent: |
  정적분으로 정의된 함수의 미분과 치환적분법에 대한 이해(문항카드 출제 의도 원문). $\frac{g'}{g}=-\cos f$를 적분하고, 역함수로 치환해 (다)의 부등식으로 반주기마다 $\ln g$의 증감 상한을 얻어 $g(a_n)\le e^{-n\pi}$를 보인다.
key_idea: |
  $\ln\frac{g(a_n)}{g(b_n)}=\int_{2n\pi-\frac\pi2}^{2n\pi+\frac\pi2}\frac{-\cos x}{f'(h(x))}dx\le-4-\frac\pi2$, $\ln\frac{g(b_{n+1})}{g(a_n)}\le4-\frac\pi2$.
stuck: |
  역함수 $h$로 치환하고 (다)의 부등식을 $\cos x$의 부호와 결합해 비교함수 $F$, $G$, $H$를 세우는 단계.
