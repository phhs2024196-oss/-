intent: |
  극한과 미분을 이용한 함수의 이해(문항카드 출제 의도 원문). $|f(x)|$의 특징값($\lim_{x\to0+}$, 극값 $|f(1)|$, $\lim_{x\to\infty}$, $x\le0$ 부분의 $1$)이 겹치는 경우를 분류해 $g(t)$의 불연속 크기가 2보다 큰 $a$를 모두 찾는다.
key_idea: |
  $-(x+1)^2e^{-x}$는 $x=1$에서 최솟값 $-4e^{-1}$, $x\to0+$에서 $-1$, $x\to\infty$에서 $0$; 이 높이들이 서로 또는 $1$과 같아질 때 $g$가 크게 뛴다.
stuck: |
  특징 높이들이 일치하는 경우를 빠짐없이 나열하는 것.
