stimuli: []
stem: |
  함수
  $$f(x)=\begin{cases}x^{2}+4x+3 & (x\le0)\\ -(x+1)^{2}e^{-x}+a & (x>0)\end{cases}$$
  에 대하여 함수 $y=|f(x)|$의 그래프와 직선 $y=t$가 만나는 서로 다른 점의 개수를 $g(t)$라 하면, $\displaystyle\lim_{t\to k-}g(t)-\lim_{t\to k+}g(t)>2$를 만족시키는 상수 $k$가 존재하도록 하는 모든 양수 $a$의 개수는 $n$이다. 이러한 $n$개의 양수 $a$의 값을 작은 수부터 차례로 $a_1$, $a_2$, $a_3$, $\cdots$, $a_n$이라 하고, $a=a_1$일 때, 실수 $m$에 대하여 $\displaystyle\lim_{t\to m-}g(t)+\lim_{t\to m+}g(t)$의 최댓값을 $M$이라 하자. $M$과 $\displaystyle\sum_{k=1}^{n}a_k$의 값을 구하는 과정을 서술하시오. (단, $n$은 자연수이다.) [20점]
subparts:
- id: '1'
  stem: |
    $M$과 $\sum_{k=1}^na_k$의 값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: |
      M=12,\ \sum_{k=1}^{n}a_k=\frac{5}{2}+8e^{-1}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      특징 높이: $a-1$, $|a-4e^{-1}|$, $a$, $1$, $3$.
    steps:
    - id: 1a
      content: |
        $a\in\{4e^{-1}-1,\ 2e^{-1},\ 1,\ 2e^{-1}+\frac12,\ 2\}$, 합 $\frac52+8e^{-1}$, $M=12$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $-(x+1)^2e^{-x}$의 극값과 양 끝 극한을 구해 보자.
    - 높이가 겹칠 때 교점 개수가 얼마나 줄어드는가?
  - id: S1-B
    audience: B
    source_flow: 해설_의예.hwp 문항카드(수학 의예 6번) 5. 문항 해설 + 선행학습 보고서(2025) 문항카드 96 6. 채점 기준(PDF 297~299쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x>0$에서 $-(x+1)^2e^{-x}$는 $x=1$일 때 최솟값 $-4e^{-1}$을 갖고, $\displaystyle\lim_{x\to0+}\{-(x+1)^2e^{-x}\}=-1$이다.
        (i) 모든 $x>0$에서 $f(x)>0$인 경우: (1) $\displaystyle\lim_{x\to0+}|f(x)|=a-1=1$, 즉 $a=2$일 때 $k=1$에서 $\lim_{t\to k-}g(t)-\lim_{t\to k+}g(t)=3$.
        (ii) $x>0$에서 $f(x)\le0$인 $x$가 존재하는 경우:
        (1) $\displaystyle\lim_{x\to0+}|f(x)|=|f(1)|$, $-1+a=4e^{-1}-a$, 즉 $a=2e^{-1}+\dfrac12$일 때 $k=2e^{-1}-\dfrac12$에서 차가 $3$.
        (2) $\displaystyle\lim_{x\to\infty}|f(x)|=a=1$일 때 $k=1$에서 차가 $3$.
        (3) $|f(1)|=\displaystyle\lim_{x\to\infty}|f(x)|$, $a=4e^{-1}-a$, 즉 $a=2e^{-1}$일 때 $k=2e^{-1}$에서 차가 $3$.
        (4) $|f(1)|=1$, $4e^{-1}-a=1$, 즉 $a=4e^{-1}-1$일 때 $k=1$에서 차가 $4$.
        나머지 경우에는 조건을 만족시키는 $k$가 없다. 따라서 $a$의 값은 $4e^{-1}-1,\ 2e^{-1},\ 1,\ 2e^{-1}+\dfrac12,\ 2$이고 $a_1=4e^{-1}-1$, $n=5$, $\displaystyle\sum_{k=1}^5a_k=\frac52+8e^{-1}$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a_1=4e^{-1}-1$일 때 $g(t)=\begin{cases}0 & (t<0)\\ 3 & (t=0)\\ 6 & (0<t<4e^{-1}-1)\\ 5 & (4e^{-1}-1\le t\le2-4e^{-1})\\ 6 & (2-4e^{-1}<t<1)\\ 4 & (t=1)\\ 2 & (1<t\le3)\\ 1 & (t>3)\end{cases}$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $\displaystyle\lim_{t\to m-}g(t)+\lim_{t\to m+}g(t)$는 최댓값 $12$를 갖는다. 즉 $M=12$
      criteria:
      - 1.A2
