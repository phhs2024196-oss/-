stimuli: []
stem: |
  $\overline{\mathrm{AB}}=3$, $\overline{\mathrm{BC}}=4$, $\angle\mathrm{B}=\dfrac{\pi}{2}$인 직각삼각형 $\mathrm{ABC}$에서 선분 $\mathrm{BC}$를 $1:a$로 내분하는 점을 $\mathrm{P}$, 선분 $\mathrm{CA}$를 $1:a$로 내분하는 점을 $\mathrm{Q}$라 하자. $\overline{\mathrm{AP}}=\overline{\mathrm{PQ}}$일 때, $\cos(\angle\mathrm{APQ})$의 값과 삼각형 $\mathrm{APQ}$의 넓이를 구하는 과정을 서술하시오. (단, $a$는 양수이다.) [20점]
subparts:
- id: '1'
  stem: |
    $\cos(\angle\mathrm{APQ})$의 값과 삼각형 $\mathrm{APQ}$의 넓이를 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: |
      \cos(\angle\mathrm{APQ})=-\frac{49}{1201},\ S=\frac{5000}{1083}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\overline{\mathrm{PQ}}^2=\frac{25+16a^2-32a}{(1+a)^2}$, $\overline{\mathrm{AP}}^2=9+\frac{16}{(1+a)^2}$.
    steps:
    - id: 1a
      content: |
        $a=\frac{50}{7}$, $\cos\theta=-\frac{49}{1201}$, $S=\frac{5000}{1083}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $\overline{\mathrm{CQ}}$, $\overline{\mathrm{PC}}$, $\overline{\mathrm{BP}}$를 $a$로 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: 해설_의예.hwp 문항카드(수학 의예 7번) 5. 문항 해설 + 선행학습 보고서(2025) 문항카드 97 6. 채점 기준(PDF 300~301쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{CQ}}=\dfrac{5}{1+a}$, $\overline{\mathrm{PC}}=\dfrac{4a}{1+a}$, $\cos C=\dfrac45$이므로 $\overline{\mathrm{PQ}}^2=\overline{\mathrm{CQ}}^2+\overline{\mathrm{PC}}^2-2\overline{\mathrm{CQ}}\,\overline{\mathrm{PC}}\cos C=\dfrac{25+16a^2-32a}{(1+a)^2}$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\overline{\mathrm{BP}}=\dfrac{4}{1+a}$이므로 $\overline{\mathrm{AP}}^2=9+\dfrac{16}{(1+a)^2}$. $\overline{\mathrm{AP}}^2=\overline{\mathrm{PQ}}^2$이므로 $9(1+a)^2+16=25+16a^2-32a$이고 $a=\dfrac{50}{7}$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\overline{\mathrm{QA}}=\dfrac{a}{1+a}\overline{\mathrm{AC}}=\dfrac{250}{57}$이므로 $\angle\mathrm{APQ}=\theta$라 하면 $\cos\theta=\dfrac{\overline{\mathrm{AP}}^2+\overline{\mathrm{PQ}}^2-\overline{\mathrm{QA}}^2}{2\overline{\mathrm{AP}}\,\overline{\mathrm{PQ}}}=1-\dfrac12\times\dfrac{\overline{\mathrm{QA}}^2}{\overline{\mathrm{AP}}^2}=-\dfrac{49}{1201}$이다.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        삼각형 $\mathrm{APQ}$의 넓이를 $S$라 하면 $S=\dfrac{a}{1+a}\left(6-\dfrac{\overline{\mathrm{AB}}\times\overline{\mathrm{BP}}}{2}\right)=\dfrac{50}{57}\times\dfrac{100}{19}=\dfrac{5000}{1083}$이다.
      criteria:
      - 1.A3
