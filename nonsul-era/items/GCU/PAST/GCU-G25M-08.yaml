      evidence: |
        $a=9(1+\sqrt3)$, $b=\frac\pi6$, $c=8\sqrt3$(채점기준 10점).
      depends_on:
      - 1.A2
      implied_ok: false
      steps:
      - 1b-4
    deductions: []
