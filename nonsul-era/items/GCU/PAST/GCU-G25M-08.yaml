      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: M
      points: 2
      evidence: |
        $\int_0^{\frac\pi2}S(t)dt=\int_0^{\frac\pi6}\frac{\sqrt3}{4}e^t\cos t\,dt+\int_{\frac\pi6}^{\frac\pi2}\frac{\sqrt3}{4}e^t\sin2t\,dt$(채점기준 2점).
      depends_on:
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A3
      mark_type: A
