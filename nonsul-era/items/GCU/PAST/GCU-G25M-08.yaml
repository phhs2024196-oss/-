stimuli: []
stem: |
  $0\le x\le\dfrac{\pi}{2}$에서 정의된 두 함수 $f(x)=\sqrt{e^{x}\cos x}$, $g(x)=\sqrt{e^{x}\sin2x}$에 대하여 함수 $h(x)$를 $h(x)=\begin{cases}f(x) & (f(x)\ge g(x))\\ g(x) & (f(x)<g(x))\end{cases}$라 하자.
  곡선 $y=h(x)\ \left(0\le x\le\dfrac{\pi}{2}\right)$와 $x$축 및 $y$축으로 둘러싸인 부분을 밑면으로 하고, $x$축에 수직인 평면으로 자른 단면이 모두 정삼각형인 입체도형이 있다. 이 입체도형의 부피를 $V$라 할 때, $80V+10\sqrt{3}=ae^{b}+ce^{\frac{\pi}{2}}$을 만족시키는 상수 $a$, $b$, $c$의 값을 구하는 과정을 서술하시오. [15점]
subparts:
- id: '1'
  stem: |
    상수 $a$, $b$, $c$의 값을 구하는 과정을 서술하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: |
      a=9(1+\sqrt3),\ b=\frac{\pi}{6},\ c=8\sqrt3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $h=f$ on $[0,\frac\pi6]$, $h=g$ on $(\frac\pi6,\frac\pi2]$.
    steps:
    - id: 1a
      content: |
        $V=\frac{9(1+\sqrt3)}{80}e^{\frac\pi6}+\frac{\sqrt3}{10}e^{\frac\pi2}-\frac{\sqrt3}{8}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $f(x)-g(x)$를 인수분해해 보자.
  - id: S1-B
    audience: B
    source_flow: 해설_의예.hwp 문항카드(수학 의예 8번) 5. 문항 해설 + 선행학습 보고서(2025) 문항카드 98 6. 채점 기준(PDF 302~304쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 함수 $f(x)=\sqrt{e^x\cos x}$, $g(x)=\sqrt{e^x\sin2x}$는 $x=\dfrac\pi6,\ \dfrac\pi2$에서 만난다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $0\le x\le\dfrac\pi6$에서 $f(x)-g(x)=\sqrt{e^x\cos x}\left(1-\sqrt{2\sin x}\right)\ge0$이고, $\dfrac\pi6<x\le\dfrac\pi2$에서 $f(x)-g(x)<0$이므로 $h(x)=\begin{cases}f(x) & \left(0\le x\le\frac\pi6\right)\\ g(x) & \left(\frac\pi6<x\le\frac\pi2\right)\end{cases}$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        단면의 넓이를 $S(t)$라 하면 $S(t)=\dfrac{\sqrt3}{4}\{h(t)\}^2$이므로 부피는 $\displaystyle\int_0^{\frac\pi2}S(t)\,dt=\int_0^{\frac\pi6}\frac{\sqrt3}{4}e^t\cos t\,dt+\int_{\frac\pi6}^{\frac\pi2}\frac{\sqrt3}{4}e^t\sin2t\,dt$이다.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        부분적분을 활용하면 $\displaystyle\int_0^{\frac\pi6}e^t\cos t\,dt=e^{\frac\pi6}\left(\frac{1+\sqrt3}{4}\right)-\frac12$, $\displaystyle\int_{\frac\pi6}^{\frac\pi2}e^t\sin2t\,dt=e^{\frac\pi6}\left(\frac{2-\sqrt3}{10}\right)+\frac25e^{\frac\pi2}$이므로
        $V=\dfrac{9(1+\sqrt3)}{80}e^{\frac\pi6}+\dfrac{\sqrt3}{10}e^{\frac\pi2}-\dfrac{\sqrt3}{8}$이다. 따라서 $80V+10\sqrt3=9(1+\sqrt3)e^{\frac\pi6}+8\sqrt3e^{\frac\pi2}$, $a=9(1+\sqrt3)$, $b=\dfrac\pi6$, $c=8\sqrt3$
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
