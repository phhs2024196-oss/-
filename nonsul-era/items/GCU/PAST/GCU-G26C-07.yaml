intent: |
  삼각함수에 대한 종합적인 이해를 바탕으로 최댓값과 최솟값을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). $\cos x=t$로 치환해 $a$를 $t$의 이차함수로 나타내고 $-1\le t\le1$에서의 치역을 구한다.
key_idea: |
  $a=5\cos^2x-4\cos x-4$로 분리하면 실근 조건은 $a$가 이 함수의 치역에 속하는 것이다.
