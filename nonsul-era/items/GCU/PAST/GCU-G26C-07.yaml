stimuli: []

stem: |
  방정식 $5\cos^2\left(\dfrac{\pi}{2}-x\right)+4\cos x+a=1$이 실근을 가지도록 하는 실수 $a$의 최댓값과 최솟값을 각각 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    실수 $a$의 최댓값과 최솟값을 각각 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '최댓값 $5$, 최솟값 $-\frac{24}{5}$', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\sin^2x=1-\cos^2x$로 $a=5t^2-4t-4\ (t=\cos x,\ -1\le t\le1)$를 얻는다.
    steps:
    - id: 1a
      content: |
        $a=5\left(t-\frac25\right)^2-\frac{24}{5}$, $-1\le t\le1$ $\Rightarrow$ 최솟값 $-\frac{24}{5}$, 최댓값 $5$($t=-1$)
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$\cos\left(\frac{\pi}{2}-x\right)$를 $\sin x$로 바꾸고 식을 $\cos x$만으로 나타내 보자.'
    - '$a$를 한쪽으로 분리하면 실근 조건은 무엇이 되는가?'
    - '$t=\cos x$의 범위를 잊지 말자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 55 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $5\cos^2\left(\dfrac{\pi}{2}-x\right)+4\cos x+a-1=0$에서 $\cos\left(\dfrac{\pi}{2}-x\right)=\sin x$이므로
        $5\sin^2x+4\cos x+a-1=0\iff5(1-\cos^2x)+4\cos x+a-1=0$
        $\iff5\cos^2x-4\cos x-4=a$ 이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\cos x=t$라 하면 $y=5t^2-4t-4=5\left(t-\dfrac25\right)^2-\dfrac{24}{5}\quad(-1\le t\le1)$
        $t=\dfrac25$일 때 최솟값은 $-\dfrac{24}{5}$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $t=-1$일 때 최댓값은 $5$이다. 따라서 실수 $a$의 최댓값은 $5$, 최솟값은 $-\dfrac{24}{5}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $5\cos^2x-4\cos x-4=a$로 정리했다(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        최솟값 $-\dfrac{24}{5}$ (또는 $a\ge-\dfrac{24}{5}$)(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        최댓값 $5$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-8701}
  misconceptions:
  - id: MC-ALG-8701
    outcome_code: '71'
    wrong_work: |
      $t=\cos x$의 범위를 생각하지 않고 $a\ge-\frac{24}{5}$만 쓰거나 최댓값을 $t=1$에서의 값 $-3$으로 답함
    detect_cue: |
      최댓값이 없다고 하거나 $-3$이 나온다
    feedback: |
      $t=\cos x$는 $-1\le t\le1$에서만 움직입니다. 꼭짓점과 양 끝점의 함숫값을 모두 비교하세요.
    remedy: [RL-1]

