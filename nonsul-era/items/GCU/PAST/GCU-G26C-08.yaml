intent: |
  수열의 귀납적 정의를 이해하고, 주어진 조건을 만족시키는 몇 개의 항을 나열하여 수열의 규칙을 찾을 수 있는지 확인한다(문항카드 출제 의도 원문). $\frac{2n+1}{n(n+1)}=\frac1n+\frac1{n+1}$로 분해하면 교대 부호 합이 망원식으로 정리된다.
key_idea: |
  $\dfrac{2n+1}{n(n+1)}=\dfrac1n+\dfrac1{n+1}$이므로 $(-1)^n$이 곱해진 합에서 이웃 항이 상쇄된다.
stuck: |
  교대 부호가 붙은 합을 정리할 때 부호를 놓쳐 상쇄되는 항을 잘못 찾는다.
