stem: |
  첫째항이 $\dfrac{47}{45}$인 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
  $$a_{n+1}=a_n+(-1)^n\times\frac{2n+1}{n(n+1)}$$
  을 만족시킬 때, $a_{2025}=\dfrac{q}{p}$이다. $\sqrt{p}+q$의 값을 구하는 과정을 서술하시오.
  (단, $p$, $q$는 서로소인 자연수이다.)

subparts:
- id: '1'
  stem: |
    $\sqrt{p}+q$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '136', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $(-1)^n\left(\frac1n+\frac1{n+1}\right)$을 $n=1$부터 $2024$까지 더하면 $-1+\frac1{2025}$만 남는다.
    steps:
    - id: 1a
      content: |
        $a_{2025}=a_1-1+\frac{1}{2025}=\frac{91}{2025}$, $p=2025$, $q=91$, $\sqrt p+q=136$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$\frac{2n+1}{n(n+1)}$을 두 분수의 합으로 나누어 보자.'
    - '$n=1,2,3$일 때 더해지는 항을 나열해 부호를 살펴보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 56 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_{2025}=a_{2024}+(-1)^{2024}\times\left(\dfrac1{2024}+\dfrac1{2025}\right)$
        $=a_{2023}+(-1)^{2023}\times\left(\dfrac1{2023}+\dfrac1{2024}\right)+\left(\dfrac1{2024}+\dfrac1{2025}\right)$
        $=\cdots$
        $=a_1+(-1)^1\times\left(\dfrac11+\dfrac12\right)+\left(\dfrac12+\dfrac13\right)-\left(\dfrac13+\dfrac14\right)+\cdots-\left(\dfrac1{2023}+\dfrac1{2024}\right)+\left(\dfrac1{2024}+\dfrac1{2025}\right)$
        $=a_1-1+\dfrac1{2025}=\dfrac{91}{2025}$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $p=2025$, $q=91$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\therefore\ \sqrt p+q=45+91=136$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        $a_{2025}=a_1-1+\dfrac1{2025}$ (또는 $a_{2025}=\dfrac{91}{2025}$)(채점기준 6점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $p=2025$, $q=91$(채점기준 각 1.5점 — 정수 배점 규칙상 한 마크로 합침, 하나만 맞으면 1.5점에 해당).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        $\sqrt p+q=136$(채점기준 1점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-8702}
  misconceptions:
  - id: MC-ALG-8702
    outcome_code: '71'
    wrong_work: |
      모든 항을 같은 부호로 더해 $a_{2025}=a_1+\sum_{n=1}^{2024}\left(\frac1n+\frac1{n+1}\right)$처럼 상쇄되지 않는 합으로 처리
    detect_cue: |
      $a_{2025}$에 조화수열 꼴의 합이 남거나 $a_1+1-\frac1{2025}$ 같은 부호 반대 결과
    feedback: |
      $(-1)^n$의 부호를 $n=1,2,3$에서 직접 써 보고, 어떤 항이 서로 지워지는지 확인하세요.
    remedy: [RL-1]

