stem: |
  $a>0$인 실수 $a$에 대하여 함수 $f(x)=ax^3$의 역함수를 $g(x)$라 하자. 곡선 $y=f(x)$ 위의 점 $(5,\ f(5))$에서의 접선의 방정식이 점 $(4,\ 2)$를 지날 때, 두 곡선 $y=f(x)$, $y=g(x)$로 둘러싸인 부분의 넓이를 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    두 곡선으로 둘러싸인 부분의 넓이를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '25', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $a=\frac1{25}$, $f(x)=x$의 해 $x=0,\pm5$, 넓이 $=4\int_0^5\left(x-\frac1{25}x^3\right)dx$
    steps:
    - id: 1a
      content: |
        $2=75a(4-5)+125a\Rightarrow a=\frac1{25}$, $S=\frac{25}{4}$, 넓이 $4S=25$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '접선의 방정식에 $(4,2)$를 대입해 $a$를 구하자.'
    - '역함수의 그래프는 어떤 직선에 대칭인가?'
    - '$y=f(x)$와 $y=x$의 교점을 구해 보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 57 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $(5,\ f(5))$에서의 접선의 방정식은 $y=75a(x-5)+125a$이고 점 $(4,\ 2)$를 지나므로 $a=\dfrac1{25}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        제1사분면에서 $y=f(x)$, $y=g(x)$로 둘러싸인 부분의 넓이는 제1사분면에서 $y=x$와 $y=f(x)$로 둘러싸인 부분의 넓이 $S$의 2배이다.
        $S=\displaystyle\int_0^5\left(x-\dfrac1{25}x^3\right)dx=\dfrac{25}{4}$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        대칭성에 의하여 구하는 부분의 넓이는 $4S=25$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $a=\dfrac1{25}$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\displaystyle\int_0^5\left(x-\dfrac1{25}x^3\right)dx=\dfrac{25}{4}$ (또는 $\displaystyle\int_0^5\dfrac1{25}x^3dx=\dfrac{25}{4}$)(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        넓이 $25$(채점기준 4점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
