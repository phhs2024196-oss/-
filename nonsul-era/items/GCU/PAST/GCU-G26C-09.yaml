intent: |
  정적분을 활용하여 두 곡선으로 둘러싸인 도형의 넓이를 구할 수 있는지 확인한다(문항카드 출제 의도 원문). 접선 조건으로 $a$를 정하고, 역함수 그래프가 $y=x$에 대칭임을 이용해 넓이를 $y=x$와 $y=f(x)$ 사이 넓이로 바꾼다.
key_idea: |
  $y=f(x)$와 $y=g(x)$로 둘러싸인 넓이는 $y=x$와 $y=f(x)$로 둘러싸인 넓이의 2배이다.
