  misconceptions:
  - id: MC-CAL-8701
    outcome_code: '71'
    wrong_work: |
      제1사분면의 $y=x$와 $y=f(x)$ 사이 넓이 $\frac{25}{4}$ 또는 그 2배 $\frac{25}{2}$를 답으로 씀
    detect_cue: |
      답이 $\frac{25}{4}$ 또는 $\frac{25}{2}$
    feedback: |
      두 곡선은 $y=x$에 대칭이고, 원점에 대해서도 대칭입니다. 교점 $x=-5,0,5$ 사이의 모든 부분을 세었는지 확인하세요.
    remedy: [RL-1]

