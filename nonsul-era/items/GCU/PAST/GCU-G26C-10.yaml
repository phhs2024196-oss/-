  - id: MC-ALG-8703
    outcome_code: '71'
    wrong_work: |
      $4^a=27$에서 $\log_2 3=\frac{3}{2}a$로 잘못 바꿔 $p=\frac32$를 얻음
    detect_cue: |
      $p$ 또는 $q$가 $\frac32$로 나온다
    feedback: |
