intent: |
  실수까지 확장된 지수법칙 및 로그의 성질을 이용하여 식을 간단히 나타낼 수 있는지 종합적으로 확인한다(문항카드 출제 의도 원문). $2^{\frac23ab}=5$, $2^{\frac23a}=3$을 이용해 $\log_{10}5$, $\log_{10}6$을 $a$, $b$로 나타낸다.
key_idea: |
  $4^a=27$, $9^b=25$에서 $3=2^{\frac23a}$, $5=2^{\frac23ab}$이므로 모든 수를 2의 거듭제곱으로 쓸 수 있다.
