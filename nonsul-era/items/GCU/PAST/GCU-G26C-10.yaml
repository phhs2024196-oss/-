stimuli: []

stem: |
  $a=\log_4 27$, $b=\log_9 25$일 때, $\log_5 10=1+\dfrac{1}{pab}$이고 $\log_6 10=\dfrac{1+pab}{1+qa}$이다. $p$와 $q$의 값을 구하는 과정을 서술하시오. (단, $p$와 $q$는 상수이다.)

subparts:
- id: '1'
  stem: |
    $p$와 $q$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '$p=\frac{2}{3}$, $q=\frac{2}{3}$', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\log_2 3=\frac23a$, $\log_2 5=\frac23ab$이므로 $\log_5 10=\frac{1+\frac23ab}{\frac23ab}$, $\log_6 10=\frac{1+\frac23ab}{1+\frac23a}$.
    steps:
    - id: 1a
      content: |
        $\log_5 10=1+\frac{3}{2ab}\Rightarrow p=\frac23$, $\log_6 10=\frac{1+\frac23ab}{1+\frac23a}\Rightarrow q=\frac23$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$4^a=27$을 $2$와 $3$의 거듭제곱으로 써 보자.'
    - '$3$과 $5$를 모두 $2$의 거듭제곱으로 나타낼 수 있다.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 58 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\log_4 27=a$로부터 $4^a=27$, 즉 $2^{2a}=3^3$. 또한 $\log_9 25=b$로부터 $9^b=25$, 즉 $3^b=5$.
        따라서 $2^{2ab}=3^{3b}=5^3$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\log_{10}5=t$라 할 때, $5=10^t=2^t5^t$이므로 $2^{\frac23ab}=5=2^t5^t=2^t2^{\frac23abt}$이다.
        따라서 $\dfrac23ab=t+\dfrac23abt$이므로 $t=\dfrac{2ab}{3+2ab}$이다.
        $\log_5 10=\dfrac1{\log_{10}5}=\dfrac{3+2ab}{2ab}=1+\dfrac{3}{2ab}$이므로 $p=\dfrac23$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\log_{10}6=s$라 하면 $10^s=6=2\times3=2\times2^{\frac23a}$이고
        또한 $10^s=2^s5^s=2^s\times2^{\frac23abs}$이므로 $1+\dfrac{2a}{3}=s+\dfrac23abs$.
        따라서 $\log_{10}6=s=\dfrac{3+2a}{3+2ab}$이므로
        $\log_6 10=\dfrac{3+2ab}{3+2a}=\dfrac{1+\frac23ab}{1+\frac23a}=\dfrac{1+pab}{1+qa}$
        따라서 $q=\dfrac23$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $2^{\frac23ab}=5$ (또는 $2^{2ab}=3^{3b}=5^3$)(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $p=\dfrac23$(채점기준 4점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $q=\dfrac23$(채점기준 4점).
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
