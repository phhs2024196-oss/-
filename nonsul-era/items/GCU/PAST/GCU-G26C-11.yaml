intent: |
  로그함수의 그래프에서 수열의 일반항을 찾고, 등비수열의 합을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). 직선 $y=n$과 두 로그함수의 교점으로 $a_n$을 구하고 $b_n$이 등비수열임을 이용한다.
key_idea: |
  $\mathrm{R}_n=(2,\ n-1)$이고 $\mathrm{P}_n\mathrm{Q}_n$은 직선 $y=n$ 위에 있으므로 삼각형의 높이는 항상 $1$, $a_n=\frac12\overline{\mathrm{P}_n\mathrm{Q}_n}$이다.
stuck: |
  반복 과정에서 $n$번째 삼각형의 꼭짓점 좌표를 일반화하지 못하거나 밑이 $\frac13$, $\frac19$인 로그방정식을 잘못 푼다.
