stem: |
  두 함수 $y=\log_{\frac13}(x-1)$, $y=\log_{\frac19}(3-x)$의 그래프가 점 $\mathrm{R}_1(2,\ 0)$에서 만난다. 직선 $y=1$이 두 함수 $y=\log_{\frac13}(x-1)$, $y=\log_{\frac19}(3-x)$의 그래프와 만나는 점을 각각 $\mathrm{P}_1$, $\mathrm{Q}_1$이라 할 때, 삼각형 $\mathrm{P}_1\mathrm{Q}_1\mathrm{R}_1$의 넓이를 $a_1$이라 하자. 선분 $\mathrm{P}_1\mathrm{Q}_1$ 위의 점 중 $x$좌표가 $2$인 점을 $\mathrm{R}_2$라 하고, 직선 $y=2$가 두 함수 $y=\log_{\frac13}(x-1)$, $y=\log_{\frac19}(3-x)$의 그래프와 만나는 점을 각각 $\mathrm{P}_2$, $\mathrm{Q}_2$라 할 때, 삼각형 $\mathrm{P}_2\mathrm{Q}_2\mathrm{R}_2$의 넓이를 $a_2$라 하자. 이와 같은 과정을 계속하여 $n$번째 얻은 삼각형 $\mathrm{P}_n\mathrm{Q}_n\mathrm{R}_n$의 넓이를 $a_n$이라 하자. 모든 자연수 $n$에 대하여 $a_n+b_n=1-\dfrac{1}{2\times3^n}$을 만족시키는 수열 $\{b_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라 할 때, $1458S_3$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $1458S_3$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '91', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\mathrm{P}_n\left(\left(\frac13\right)^n+1,\ n\right)$, $\mathrm{Q}_n\left(3-\left(\frac19\right)^n,\ n\right)$, $a_n=\frac12\overline{\mathrm{P}_n\mathrm{Q}_n}$, $b_n=\frac12\left(\frac19\right)^n$.
    steps:
    - id: 1a
      content: |
        $S_3=\frac{\frac1{18}\left\{1-\left(\frac19\right)^3\right\}}{1-\frac19}=\frac{91}{1458}$, $1458S_3=91$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '직선 $y=n$이 두 그래프와 만나는 점의 $x$좌표를 구해 보자.'
    - '$\mathrm{R}_n$의 $y$좌표는 $n-1$이다. 삼각형의 높이는?'
    - '$b_n$을 구하면 어떤 수열이 되는가?'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 59 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        자연수 $n$에 대하여 직선 $y=n$이 두 함수 $y=\log_{\frac13}(x-1)$, $y=\log_{\frac19}(3-x)$의 그래프와 만나는 점의 좌표를 각각 구하면 $\mathrm{P}_n\left(\left(\dfrac13\right)^n+1,\ n\right)$, $\mathrm{Q}_n\left(3-\left(\dfrac19\right)^n,\ n\right)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\overline{\mathrm{P}_n\mathrm{Q}_n}=3-\left(\dfrac19\right)^n-\left(\dfrac13\right)^n-1=2-\left(\dfrac19\right)^n-\left(\dfrac13\right)^n$이므로
        삼각형 $\mathrm{P}_n\mathrm{Q}_n\mathrm{R}_n$의 넓이는 $a_n=\dfrac12\times\left\{2-\left(\dfrac19\right)^n-\left(\dfrac13\right)^n\right\}$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $a_n+b_n=1-\dfrac12\times\left(\dfrac13\right)^n=\dfrac12\times\left\{2-\left(\dfrac19\right)^n-\left(\dfrac13\right)^n\right\}+b_n$에서 $b_n=\dfrac12\times\left(\dfrac19\right)^n$이다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        즉, 수열 $\{b_n\}$은 첫째항이 $\dfrac1{18}$이고 공비가 $\dfrac19$인 등비수열이므로
        $S_3=\dfrac{\frac1{18}\left\{1-\left(\frac19\right)^3\right\}}{1-\frac19}=\dfrac{\frac{728}{729}}{16}=\dfrac{91}{1458}$
        따라서 $1458S_3=91$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $\mathrm{P}_n\left(\left(\dfrac13\right)^n+1,\ n\right)$, $\mathrm{Q}_n\left(3-\left(\dfrac19\right)^n,\ n\right)$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\overline{\mathrm{P}_n\mathrm{Q}_n}=2-\left(\dfrac19\right)^n-\left(\dfrac13\right)^n$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $b_n=\dfrac12\times\left(\dfrac19\right)^n$(채점기준 2점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 3
      evidence: |
        $1458S_3=91$(채점기준 3점).
      depends_on: [1.M1, 1.A2]
      steps: [1b-4]
    deductions: []
