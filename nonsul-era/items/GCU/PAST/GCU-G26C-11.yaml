  - {code: '71', misconception: MC-ALG-8704}
  misconceptions:
  - id: MC-ALG-8704
    outcome_code: '71'
    wrong_work: |
      $\log_{\frac13}(x-1)=n$에서 $x-1=3^n$으로 계산
    detect_cue: |
      $\mathrm{P}_n$의 $x$좌표가 $3^n+1$처럼 커져 선분 길이가 음수가 된다
    feedback: |
      $\log_{\frac13}(x-1)=n\iff x-1=\left(\frac13\right)^n$입니다. 로그의 정의로 다시 바꿔 보세요.
    remedy: [RL-1]

