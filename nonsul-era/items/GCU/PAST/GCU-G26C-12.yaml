intent: |
  정적분과 관련된 수학적 표현의 의미를 이해하고 정적분과 미분의 관계로부터 식을 해결할 수 있는지 확인한다(문항카드 출제 의도 원문). 상수인 정적분을 $b$로 두고, $x=1$ 대입과 미분으로 얻은 두 식을 연립한다.
key_idea: |
  $\int_2^3tf'(t)\,dt$는 상수이므로 $b$로 놓고, $x=1$ 대입($a+b+53=0$)과 $f(x)$를 구해 $b$의 정의에 대입($38a+4b+195=0$)한다.
stuck: |
  $\int_2^3tf'(t)\,dt$가 상수임을 인식하지 못하거나, $x=1$을 대입하는 조건을 놓친다.
