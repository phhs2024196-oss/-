  - id: MC-CAL-8702
    outcome_code: '71'
    wrong_work: |
      미분한 식만 사용하고 $x=1$ 대입 조건($a+b+53=0$)을 쓰지 않아 $a$, $b$를 정하지 못함
    detect_cue: |
      미지수 2개에 식이 하나뿐이라 답이 정해지지 않는다
    feedback: |
      $\int_1^1f(t)\,dt=0$이므로 $x=1$을 대입하면 또 하나의 식을 얻습니다.
    remedy: [RL-1]

