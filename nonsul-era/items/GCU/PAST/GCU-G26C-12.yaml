stimuli: []

stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$\int_1^xf(t)\,dt=x^4+ax^3+x^2\int_2^3tf'(t)\,dt+52x$$
  를 만족시킬 때, $a$와 $f(2)$의 값을 모두 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $a$와 $f(2)$의 값을 모두 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '$a=\frac{1}{2}$, $f(2)=-124$', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $b=\int_2^3tf'(t)\,dt$로 두면 $a+b+53=0$, $f(x)=4x^3+3ax^2+2bx+52$.
    steps:
    - id: 1a
      content: |
        $b=195+38a+5b$와 연립 $\Rightarrow a=\frac12$, $b=-\frac{107}{2}$, $f(2)=84+12a+4b=-124$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$\int_2^3tf''(t)\,dt$는 $x$에 따라 변하는가?'
    - '양변에 $x=1$을 대입해 보자.'
    - '양변을 $x$에 대하여 미분해 보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 60 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\int_2^3tf'(t)\,dt=b$라 하자. $\displaystyle\int_1^xf(t)\,dt=x^4+ax^3+bx^2+52x$에서
        양변에 $x=1$을 대입하면 $a+b+53=0$이고,
        양변을 $x$에 관하여 미분하면 $f(x)=4x^3+3ax^2+2bx+52$이므로 $xf'(x)=12x^3+6ax^2+2bx$이다.
        $b=\displaystyle\int_2^3tf'(t)\,dt=\Big[3t^4+2at^3+bt^2\Big]_2^3=195+38a+5b$이므로 $38a+4b+195=0$이다.
        따라서 $a=\dfrac12$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $b=-\dfrac{107}{2}$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $f(2)=84+12a+4b=-124$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
