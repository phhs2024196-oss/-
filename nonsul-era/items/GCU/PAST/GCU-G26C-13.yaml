stimuli: []

stem: |
  함수 $f(x)$가 $\displaystyle\lim_{x\to0}\frac{x}{f(x)-x}=\frac12$을 만족시킬 때,
  $\displaystyle\lim_{x\to0}\frac{35xf(x)+5\{f(x)\}^2}{2\{f(x)\}^2+3xf(x)-2x^2}$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    극한값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\lim\frac{f(x)}{x}-1=2$이므로 $\lim\frac{f(x)}{x}=3$.
    steps:
    - id: 1a
      content: |
        $\frac{35\cdot3+5\cdot3^2}{(2\cdot3-1)(3+2)}=\frac{150}{25}=6$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - '주어진 극한을 $\frac{f(x)}{x}$로 나타내 보자.'
    - '구하는 식의 분자·분모를 $x^2$으로 나누어 보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 61 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{x\to0}\frac{x}{f(x)-x}=\lim_{x\to0}\frac{1}{\frac{f(x)-x}{x}}=\lim_{x\to0}\frac{1}{\frac{f(x)}{x}-1}=\frac{1}{\lim_{x\to0}\left\{\frac{f(x)}{x}-1\right\}}=\frac12$
        $\displaystyle\lim_{x\to0}\frac{f(x)}{x}-1=2$, $\displaystyle\lim_{x\to0}\frac{f(x)}{x}=3$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to0}\frac{35xf(x)+5\{f(x)\}^2}{2\{f(x)\}^2+3xf(x)-2x^2}=\lim_{x\to0}\frac{35xf(x)+5\{f(x)\}^2}{\{2f(x)-x\}\{f(x)+2x\}}=\lim_{x\to0}\frac{\frac{35f(x)}{x}+5\left\{\frac{f(x)}{x}\right\}^2}{\left\{\frac{2f(x)}{x}-1\right\}\left\{\frac{f(x)}{x}+2\right\}}$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $=\dfrac{35\times3+5\times3^2}{(2\times3-1)(3+2)}=\dfrac{150}{25}=6$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $\displaystyle\lim_{x\to0}\frac{f(x)}{x}=3$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        주어진 식을 $\dfrac{f(x)}{x}$를 이용하여 표현했다(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: |
        극한값 $6$(채점기준 6점).
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-8703}
  misconceptions:
  - id: MC-CAL-8703
    outcome_code: '71'
    wrong_work: |
      $\lim\frac{x}{f(x)-x}=\frac12$에서 $\lim\frac{f(x)}{x}=2$로 처리(1을 더하지 않음)
    detect_cue: |
      $\lim\frac{f(x)}{x}=2$를 써서 답이 $\frac{90}{12}=\frac{15}{2}$
    feedback: |
      $\frac{f(x)-x}{x}=\frac{f(x)}{x}-1$의 극한이 $2$입니다. 1을 빼먹지 않았는지 확인하세요.
    remedy: [RL-1]

