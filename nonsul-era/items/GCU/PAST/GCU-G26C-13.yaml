intent: |
  함수의 극한의 성질을 이용하여 함수의 극한값을 계산할 수 있는지 확인한다(문항카드 출제 의도 원문). 분모·분자를 $x^2$으로 나누어 $\lim_{x\to0}\frac{f(x)}{x}=3$만으로 극한값을 계산한다.
key_idea: |
  $\lim_{x\to0}\frac{f(x)}{x}=3$을 얻은 뒤 주어진 식을 $\frac{f(x)}{x}$의 식으로 바꾼다.
stuck: |
