stimuli: []

stem: |
  자연수 $k$에 대하여 두 함수 $f(x)=-\log_2(k+1)x$, $g(x)=\log_{\frac12}\left(\dfrac{k+1}{kx}\right)$이 있다. 양의 실수 전체의 집합에서 정의된 함수 $h(x)$를
  $$h(x)=\begin{cases}f(x) & (g(x)<f(x))\\ g(x) & (g(x)\ge f(x))\end{cases}$$
  라 하자. 곡선 $y=h(x)$와 직선 $y=\log_2k$가 만나는 서로 다른 두 점 사이의 거리를 $l(k)$라 할 때, $\dfrac{10}{3}\times\displaystyle\sum_{k=1}^{9}l(k)$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\dfrac{10}{3}\times\displaystyle\sum_{k=1}^{9}l(k)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '177', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      교점 $x=a=\frac1{\sqrt k}$; 왼쪽 교점 $x=\frac1{k(k+1)}$, 오른쪽 교점 $x=k+1$, $l(k)=k+1-\frac1{k(k+1)}$.
    steps:
    - id: 1a
      content: |
        $\frac{10}{3}\left\{54-\left(1-\frac1{10}\right)\right\}=\frac{10}{3}\times\frac{531}{10}=177$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$f$와 $g$는 각각 증가함수인가, 감소함수인가?'
    - '두 함수의 교점을 먼저 구해 보자.'
    - '$\frac{1}{k(k+1)}$은 어떻게 분해되는가?'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 62 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 함수의 교점은 $-\log_2(k+1)x=\log_{\frac12}\left(\dfrac{k+1}{kx}\right)$이므로 $(k+1)x=\dfrac{k+1}{kx}$이다.
        따라서 교점의 $x$좌표는 $a=\dfrac1{\sqrt k}$이다. 곡선 $y=h(x)$와 직선 $y=\log_2k$가 만나는 서로 다른 두 점을 $\mathrm{A}$, $\mathrm{B}$라 하자.
        (1) $x<a$일 때, $-\log_2(k+1)x=\log_2k$에서 $x=\dfrac1{k(k+1)}$이다.
        $k$가 자연수이므로 $\dfrac1{k(k+1)}<\dfrac1{\sqrt{k(k+1)}}<\dfrac1{\sqrt k}$이므로 점 $\mathrm{A}$의 $x$좌표는 $\dfrac1{k(k+1)}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (2) $x\ge a$일 때, $\log_{\frac12}\left(\dfrac{k+1}{kx}\right)=\log_2k$에서 $x=k+1$이고, $\dfrac1{\sqrt k}<k+1$이므로 점 $\mathrm{B}$의 $x$좌표는 $k+1$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        두 점 사이의 거리 $l(k)$는 $l(k)=k+1-\dfrac1{k(k+1)}$이므로
        $\dfrac{10}{3}\displaystyle\sum_{k=1}^9l(k)=\dfrac{10}{3}\sum_{k=1}^9\left\{k+1-\dfrac1{k(k+1)}\right\}=\dfrac{10}{3}\left\{\sum_{k=1}^9(k+1)-\sum_{k=1}^9\left(\dfrac1k-\dfrac1{k+1}\right)\right\}$
        $=\dfrac{10}{3}\times\left\{\dfrac{9\times10}{2}+9-\left(1-\dfrac1{10}\right)\right\}=\dfrac{10}{3}\times\dfrac{531}{10}=177$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        점 $\mathrm{A}$의 $x$좌표는 $\dfrac1{k(k+1)}$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        점 $\mathrm{B}$의 $x$좌표는 $k+1$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $\dfrac{10}{3}\displaystyle\sum_{k=1}^9l(k)=177$(채점기준 4점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-8705}
  misconceptions:
  - id: MC-ALG-8705
    outcome_code: '71'
    wrong_work: |
      $f$, $g$ 각각과 직선의 교점을 구간 확인 없이 쓰거나, $\log_{\frac12}\frac{k+1}{kx}=\log_2k$에서 $x=\frac{k+1}{k^2}$로 계산
    detect_cue: |
      $\mathrm{B}$의 $x$좌표가 $k+1$이 아닌 값($\frac{k+1}{k^2}$ 등)
    feedback: |
      $\log_{\frac12}X=-\log_2X$입니다. $-\log_2\frac{k+1}{kx}=\log_2k$에서 $\frac{kx}{k+1}=k$를 다시 풀어 보세요.
    remedy: [RL-1]

