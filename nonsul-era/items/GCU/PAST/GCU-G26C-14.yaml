intent: |
  로그함수의 그래프와 로그함수의 성질 및 $\sum$의 성질을 활용하여 문제를 해결할 수 있는지 확인한다(문항카드 출제 의도 원문). $h(x)$는 두 로그함수 중 큰 쪽이므로, 교점 $x=\frac1{\sqrt k}$의 좌우에서 직선 $y=\log_2k$와의 교점을 각각 구한다.
key_idea: |
  $f$는 감소, $g$는 증가하므로 $h=\max(f,g)$; 교점 $x=\frac1{\sqrt k}$ 왼쪽은 $f$, 오른쪽은 $g$와 직선의 교점이다.
stuck: |
  $h(x)$의 정의(큰 쪽 선택)를 해석해 어느 쪽 그래프와 만나는지 구간별로 판정하는 단계.
