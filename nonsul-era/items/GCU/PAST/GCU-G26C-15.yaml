intent: |
  미분계수를 이해하고, $\Sigma$의 성질을 활용하여 여러 가지 수열의 합을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). 각 극한을 $\frac35f'(k+1)$로 바꾼 뒤 $\sum$의 성질로 $a$를 구한다.
