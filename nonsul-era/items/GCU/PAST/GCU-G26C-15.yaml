    wrong_work: |
      $\lim_{h\to0}\frac{f(k+1+h)-f(k+1-2h)}{5h}=\frac15f'(k+1)$로 처리
    detect_cue: |
      $\frac15\sum f'(k+1)=54+3a=90$에서 $a=12$가 나온다
    feedback: |
      $(k+1+h)-(k+1-2h)=3h$입니다. 분모를 $3h$로 맞추면 앞에 $\frac35$가 곱해집니다.
    remedy: [RL-1]

