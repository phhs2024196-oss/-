stem: |
  함수 $f(x)=x^2+ax+b$가 다음 조건을 만족시킬 때, $f(a+b)$의 값을 구하는 과정을 서술하시오.
  (단, $a$, $b$는 상수이다.)
  (가) $f(2)=f'(2)$
  (나) $\displaystyle\sum_{k=1}^{15}\lim_{h\to0}\frac{f(k+1+h)-f(k+1-2h)}{5h}=90$

subparts:
- id: '1'
  stem: |
    $f(a+b)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      (나) $\Rightarrow\frac35\sum_{k=1}^{15}f'(k+1)=162+9a=90$, $a=-8$; (가) $\Rightarrow b=8$.
    steps:
    - id: 1a
      content: |
        $a=-8$, $b=8$, $f(a+b)=f(0)=b=8$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '분모를 $3h$로 바꾸면 무엇의 정의가 되는가?'
    - '$f''(x)=2x+a$를 대입하고 $\sum$을 계산해 보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 63 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=2x+a$이고, 조건 (나)에 의하여
        $\displaystyle\sum_{k=1}^{15}\lim_{h\to0}\frac{f(k+1+h)-f(k+1-2h)}{5h}=\frac35\times\sum_{k=1}^{15}\lim_{h\to0}\frac{f(k+1+h)-f(k+1-2h)}{3h}$
        $=\dfrac35\times\displaystyle\sum_{k=1}^{15}f'(k+1)=\frac35\times\sum_{k=1}^{15}(2k+a+2)=162+9a=90$
        이므로 $a=-8$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        조건 (가)에 의하여 $f(2)=4+2a+b=-12+b=f'(2)=a+4=-4$이므로 $b=8$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 $f(a+b)=f(0)=b=8$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
