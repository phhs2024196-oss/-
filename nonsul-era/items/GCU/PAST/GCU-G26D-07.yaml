stem: |
  $a>0$, $b>0$이고, 함수 $f(x)=a\sin\dfrac{x}{3b}+c$의 주기가 $6\pi$, 최솟값이 $-2$이다.
  $f\left(\dfrac{\pi}{2}\right)=\dfrac32$일 때, $a\times b\times c$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$, $c$는 상수이다.)

subparts:
- id: '1'
  stem: |
    $a\times b\times c$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\frac{7}{9}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $b=1$, $-a+c=-2$, $\frac12a+c=\frac32$.
    steps:
    - id: 1a
      content: |
        $a=\frac73$, $b=1$, $c=\frac13$, $abc=\frac79$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$y=\sin kx$의 주기는 $\frac{2\pi}{|k|}$이다.'
    - '$a>0$일 때 최솟값은 $-a+c$이다.'
    - '$\sin\frac{\pi}{6}$의 값을 이용하자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 64 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=a\sin\dfrac{x}{3b}+c$의 주기는 $\dfrac{2\pi}{\left|\frac{1}{3b}\right|}=6\pi$, $b>0$이므로 $6b\pi=6\pi$, $b=1$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f(x)=a\sin\dfrac{x}{3b}+c$의 최솟값은 $-|a|+c=-2$, $a>0$이므로 $-a+c=-2\ \cdots(1)$
        $f\left(\dfrac{\pi}{2}\right)=\dfrac12a+c=\dfrac32\ \cdots(2)$
        (1), (2)를 연립하면 $a=\dfrac73$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $c=\dfrac13$
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $\therefore\ abc=\dfrac79$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
