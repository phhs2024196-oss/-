      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $c=\dfrac13$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        $abc=\dfrac79$(채점기준 1점).
      depends_on: [1.M1, 1.A1, 1.A2]
      steps: [1b-4]
    deductions: []
