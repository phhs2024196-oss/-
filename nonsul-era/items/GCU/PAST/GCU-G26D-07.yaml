intent: |
  삼각함수의 그래프를 그릴 수 있고 이를 문제해결에 활용할 수 있는지 확인한다(문항카드 출제 의도 원문). 주기 공식으로 $b$, 최솟값과 함숫값 조건의 연립으로 $a$, $c$를 구한다.
key_idea: |
  주기 $\dfrac{2\pi}{\left|\frac{1}{3b}\right|}=6b\pi=6\pi$, 최솟값 $-a+c=-2$, $f\left(\frac{\pi}{2}\right)=\frac12a+c$.
stuck: |
  주기 공식에서 $\frac{1}{3b}$의 역수를 잘못 처리하거나 $\sin\frac{\pi}{6}$ 값을 놓친다.
