  misconceptions:
  - id: MC-ALG-8707
    outcome_code: '71'
    wrong_work: |
      $\sqrt{g(x)}=x+\frac12$로 두고 $2x+2=x+\frac12$에서 $x=-\frac32$를 답으로 씀
    detect_cue: |
      답이 $-\frac32$(진수 $2x+2<0$)
    feedback: |
