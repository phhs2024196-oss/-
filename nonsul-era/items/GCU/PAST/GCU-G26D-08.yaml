stimuli: []

stem: |
  일차함수 $f(x)$와 이차함수 $g(x)$가
  $$f(x)=a(x+1),\quad g(x)=b(x+c)^2$$
  일 때, 모든 실수 $x$에 대하여 다음 조건을 만족시킨다.
  (가) $\{f(x)\}^2-4g(x)=4x+3$
  (나) $f(x)-g'(x)=1$
  두 함수 $y=\log_2f(x)$, $y=\log_2\sqrt{g(x)}$의 그래프가 만나는 점의 $x$좌표의 값을 구하는 과정을 서술하시오. (단, $a$, $b$, $c$는 상수이다.)

subparts:
- id: '1'
  stem: |
    두 그래프가 만나는 점의 $x$좌표의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'x=-\frac{5}{6}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      (나)에서 $a=2b$, (가)에서 $a^2=4b$ $\Rightarrow$ $a=2$, $b=1$, $c=\frac12$.
    steps:
    - id: 1a
      content: |
        $\log_2(2x+2)=\log_2\left|x+\frac12\right|$, $-1<x<-\frac12$에서 $2x+2=-x-\frac12$ $\Rightarrow$ $x=-\frac56$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '(나)의 일차항 계수와 상수항을 비교해 보자.'
    - '$\sqrt{g(x)}$는 어떤 절댓값 식인가?'
    - '진수 조건 $f(x)>0$을 확인하자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 65 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (나)에서 $f(x)-g'(x)=ax+a-2bx-2bc=1$이므로 $a=2b$이고,
        조건 (가)에서 $a^2(x+1)^2-4b(x+c)^2=4x+3$이므로 $4b=a^2=4b^2$이다.
        따라서 $b=1$, $a=2$이다. 즉 $f(x)=2x+2$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        조건 (나)에서 $1=a-2bc=2-2c$이므로 $c=\dfrac12$이다. 즉 $g(x)=x^2+x+\dfrac14=\left(x+\dfrac12\right)^2$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        함수 $y=\log_2f(x)=\log_2 2(x+1)\quad(x>-1)$
        함수 $y=\log_2\left|x+\dfrac12\right|=\begin{cases}\log_2\left(x+\frac12\right) & \left(x>-\frac12\right)\\ \log_2\left(-x-\frac12\right) & \left(x<-\frac12\right)\end{cases}$
        $x>-\dfrac12$일 때, $2x+2=x+\dfrac12$, $x=-\dfrac32$이므로 범위 밖의 값이라 모순이지만,
        $-1<x<-\dfrac12$일 때, $2x+2=-x-\dfrac12$, $x=-\dfrac56$이므로 범위 내에 존재한다.
        따라서 $x=-\dfrac56$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $f(x)=2x+2$ (또는 $a=2$)(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $g(x)=x^2+x+\dfrac14=\left(x+\dfrac12\right)^2$ (또는 $b=1$, $c=\dfrac12$)(채점기준 2점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 6
      evidence: |
        $x=-\dfrac56$(채점기준 6점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
