intent: |
  로그함수의 그래프와 로그함수의 성질을 통해 방정식을 해결할 수 있는지 확인한다(문항카드 출제 의도 원문). 항등식 조건으로 $f$, $g$를 정하고 $\log_2\sqrt{g(x)}=\log_2\left|x+\frac12\right|$로 바꿔 진수 조건 아래에서 교점을 구한다.
key_idea: |
  $\sqrt{(x+\frac12)^2}=\left|x+\frac12\right|$이므로 $x+\frac12$의 부호로 경우를 나누고, $f(x)>0$인 $x>-1$에서만 교점을 찾는다.
stuck: |
  $\sqrt{g(x)}=x+\frac12$로 절댓값 없이 처리해 범위 밖 해 $-\frac32$를 답으로 쓴다.
