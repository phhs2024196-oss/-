intent: |
  등비수열의 일반항을 구하고, 지수법칙 및 로그의 성질을 이용하여 식을 간단히 나타낼 수 있는지 종합적으로 확인한다(문항카드 출제 의도 원문). $\frac{a_5a_7}{a_4a_6a_8}=\frac{1}{ar^5}$로 정리해 공비를 구하고 $a_m=3^{-9}$의 지수를 비교한다.
key_idea: |
  $\frac{a_5a_7}{a_4a_6a_8}=\frac{a^2r^{10}}{a^3r^{15}}=\frac{1}{ar^5}$, $\log_3$을 취하면 $-\frac12-5\log_3r=9$.
stuck: |
  분자·분모의 지수 합($r^{10}$, $r^{15}$)을 잘못 세거나 $a=\sqrt3=3^{\frac12}$를 지수로 바꾸지 못한다.
