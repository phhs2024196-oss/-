stimuli: []

stem: |
  첫째항이 $\sqrt3$인 등비수열 $\{a_n\}$에 대하여 $\log_3\dfrac{a_5a_7}{a_4a_6a_8}=9$일 때,
  $a_m=\dfrac{1}{3^9}$을 만족시키는 자연수 $m$과 공비의 값을 모두 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    자연수 $m$과 공비의 값을 모두 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '공비 $3^{-\frac{19}{10}}$, $m=6$', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\frac{1}{ar^5}$에서 $\log_3r=-\frac{19}{10}$.
    steps:
    - id: 1a
      content: |
        $a_m=3^{\frac12-\frac{19}{10}(m-1)}=3^{-9}\Rightarrow m=6$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$a_n=ar^{n-1}$을 대입해 분수를 간단히 하자.'
    - '$\sqrt3=3^{\frac12}$로 쓰고 $\log_3$을 계산하자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 66 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        등비수열 $\{a_n\}$의 첫째항은 $a_1=a=\sqrt3$이고 공비를 $r$라 하자. 등비수열의 일반항은 $a_n=ar^{n-1}$이므로
        문제에서 주어진 식을 $r$와 $a$로 표현하면 $\dfrac{a_5a_7}{a_4a_6a_8}=\dfrac{a^2r^{10}}{a^3r^{15}}=\dfrac{1}{ar^5}$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\log_3\dfrac{a_5a_7}{a_4a_6a_8}=9\iff-5\log_3r-\dfrac12=9$이므로 $r=3^{-\frac{19}{10}}$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $a_m=ar^{m-1}=\sqrt3\left(3^{-\frac{19}{10}}\right)^{m-1}=3^{\frac12-\frac{19}{10}(m-1)}=3^{-9}$이므로
        $\dfrac12-\dfrac{19}{10}(m-1)=-9$이다. $\therefore\ m=6$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\dfrac{a_5a_7}{a_4a_6a_8}=\dfrac{1}{ar^5}$ (또는 $\log_3\dfrac{a_5a_7}{a_4a_6a_8}=-5\log_3r-\dfrac12$)(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        공비는 $r=3^{-\frac{19}{10}}$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $m=6$(채점기준 4점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-8708}
  misconceptions:
  - id: MC-ALG-8708
    outcome_code: '71'
    wrong_work: |
      $a_4a_6a_8=a^3r^{18}$ 등으로 지수를 잘못 더해 공비가 $3^{-\frac{19}{16}}$처럼 나옴
    detect_cue: |
      공비의 지수 분모가 10이 아니다
    feedback: |
      $a_n=ar^{n-1}$이므로 $a_4a_6a_8=a^3r^{3+5+7}=a^3r^{15}$입니다.
    remedy: [RL-1]

