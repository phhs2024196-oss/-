intent: |
  정적분을 활용하여 두 곡선으로 둘러싸인 도형의 넓이를 구하고 함수의 극한값을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). $T(t)$, $S(t)$를 $t$의 식으로 구한 뒤 $\frac00$ 꼴 극한을 인수분해·유리화로 계산한다.
