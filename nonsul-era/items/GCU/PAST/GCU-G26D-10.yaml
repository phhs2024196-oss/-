stem: |
  그림과 같이 직선 $y=x$가 곡선 $y=\sqrt x$와 만나는 점 중 원점 $\mathrm{O}$가 아닌 점을 $\mathrm{A}$라 하고 점 $\mathrm{B}(t,\ \sqrt t)$에 대하여 삼각형 $\mathrm{OAB}$의 넓이를 $T(t)$라 하자. 곡선 $y=x^2$과 $x$축 및 두 직선 $x=t$, $x=1$로 둘러싸인 부분의 넓이를 $S(t)$라 할 때, $\displaystyle\lim_{t\to1-}\frac{S(t)}{T(t)}$의 값을 구하는 과정을 서술하시오. (단, $0<t<1$)
  [그림: 좌표평면에 곡선 $y=\sqrt x$, 직선 $y=x$, 곡선 $y=x^2$이 원점 $\mathrm{O}$와 점 $\mathrm{A}(1,1)$에서 만나도록 그려져 있다. 세로 점선 $x=t$가 곡선 $y=\sqrt x$와 만나는 점이 $\mathrm{B}$이고, 선분 $\mathrm{OB}$, $\mathrm{BA}$, $\mathrm{OA}$로 삼각형 $\mathrm{OAB}$가 그려져 있다.]

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{t\to1-}\frac{S(t)}{T(t)}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $T(t)=\frac12(\sqrt t-t)$, $S(t)=\frac13(1-t^3)$.
    steps:
    - id: 1a
      content: |
        $\lim\frac{S}{T}=\frac23\lim_{t\to1-}\frac{(1+t+t^2)(\sqrt t+t)}{t}=\frac23\times6=4$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '삼각형 $\mathrm{OAB}$를 직선 $x=t$로 나누어 넓이를 구해 보자.'
    - '$t\to1$일 때 분모·분자가 모두 0이다. 인수 $1-t$를 만들어 보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 67 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $T(t)=\dfrac12\{t(\sqrt t-t)+(1-t)(\sqrt t-t)\}=\dfrac12(\sqrt t-t)$이고
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $S(t)=\displaystyle\int_t^1x^2\,dx=\dfrac13(1-t^3)$이므로
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\displaystyle\lim_{t\to1-}\frac{S(t)}{T(t)}=\lim_{t\to1-}\frac{\frac13(1-t^3)}{\frac12(\sqrt t-t)}=\frac23\lim_{t\to1-}\frac{(1-t)(1+t+t^2)(\sqrt t+t)}{t-t^2}$
        $=\dfrac23\displaystyle\lim_{t\to1-}\frac{(1+t+t^2)(\sqrt t+t)}{t}=4$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $T(t)=\dfrac12(\sqrt t-t)$(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $S(t)=\dfrac13(1-t^3)$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\displaystyle\lim_{t\to1-}\frac{S(t)}{T(t)}=4$(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-8705}
  misconceptions:
  - id: MC-CAL-8705
    outcome_code: '71'
    wrong_work: |
      $\frac{1-t^3}{\sqrt t-t}$에서 $\sqrt t\approx t$로 보고 분모를 $1-t$처럼 처리해 $\frac23\times3=2$를 얻음
    detect_cue: |
      답이 2
    feedback: |
      $\sqrt t-t=\sqrt t(1-\sqrt t)$이고 $1-\sqrt t=\frac{1-t}{1+\sqrt t}$입니다. 분모의 $1-t$ 인수를 정확히 만들어 보세요.
    remedy: [RL-1]

