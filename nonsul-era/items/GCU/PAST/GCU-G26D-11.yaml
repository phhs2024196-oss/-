stimuli: []

stem: |
  사차함수 $f(x)=\dfrac{5}{16}x^4-\dfrac52x^2+4$가 있다. 실수 $t$에 대하여 방정식 $|f(x)|=t$의 서로 다른 실근의 개수를 $g(t)$라 할 때, $\displaystyle\lim_{t\to1+}g(t)+\lim_{t\to1-}g(t)+g(1)$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{t\to1+}g(t)+\lim_{t\to1-}g(t)+g(1)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '18', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      극댓값 $4$, 극솟값 $-1$이므로 $|f|$의 그래프에서 $t$가 $1$보다 조금 크면 4개, 조금 작으면 8개, $t=1$이면 6개.
    steps:
    - id: 1a
      content: |
        $4+8+6=18$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$f''(x)$를 인수분해해 극값을 구하자.'
    - '$y=|f(x)|$는 $x$축 아래 부분을 위로 접은 것이다.'
    - '직선 $y=t$를 $t=1$ 위아래로 움직여 교점을 세자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 68 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\dfrac{5}{16}x^4-\dfrac52x^2+4$에서 $f'(x)=\dfrac54x^3-5x=\dfrac54x(x+2)(x-2)$이므로
        $f(0)=4$에서 극댓값, $f(-2)=f(2)=-1$에서 극솟값을 갖는다.
        따라서 $|f(x)|=t$의 서로 다른 실근은 곡선 $y=|f(x)|$와 직선 $y=t$가 만날 때이므로
        $\displaystyle\lim_{t\to1+}g(t)=4$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\lim_{t\to1-}g(t)=8$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $g(1)=6$이다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        따라서 $\displaystyle\lim_{t\to1+}g(t)+\lim_{t\to1-}g(t)+g(1)=18$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
