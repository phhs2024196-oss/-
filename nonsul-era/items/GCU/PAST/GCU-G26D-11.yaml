intent: |
  다항함수의 극댓값과 극솟값을 구하고, 방정식으로부터 함수의 극한값을 이해하고 있는지 확인한다(문항카드 출제 의도 원문). $y=|f(x)|$의 그래프와 직선 $y=t$의 교점 개수로 $g(t)$를 파악해 $t=1$ 근방의 좌·우극한과 함숫값을 구한다.
key_idea: |
  $f$의 극댓값 $f(0)=4$, 극솟값 $f(\pm2)=-1$이므로 $y=|f(x)|$는 $x=\pm2$에서 높이 $1$인 극대를 갖는다.
stuck: |
  $|f(x)|$로 접어 올린 그래프에서 높이 $1$ 근처의 교점 개수를 정확히 세는 단계.
