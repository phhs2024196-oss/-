stimuli: []

stem: |
  다음 조건을 만족시키는 모든 다항함수 $f(x)$에 대하여 $f(-1)$의 최솟값을 구하는 과정을 서술하시오. (단, $f(x)$의 계수는 모두 정수이다.)
  (가) $x\ge1$인 모든 실수 $x$에 대하여 $x^2<f\left(\dfrac{x-1}{6}\right)$을 만족시킨다.
  (나) $x\ge2$인 모든 실수 $x$에 대하여 $f\left(\dfrac{x-2}{6}\right)<x^2$을 만족시킨다.
  (다) 함수 $\displaystyle\int_0^xf(t)\,dt$는 $x=-\dfrac13$에서 극값을 갖는다.

subparts:
- id: '1'
  stem: |
    $f(-1)$의 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '18', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $36t^2+12t+1<f(t)<36t^2+24t+4\ (t\ge0)$ $\Rightarrow$ $f(x)=36x^2+ax+b$, $1<b<4$, $4-\frac a3+b=0$.
    steps:
    - id: 1a
      content: |
        $(a,b)=(18,2),(21,3)$, $f(-1)=20,18$ $\Rightarrow$ 최솟값 $18$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '(나)에서 $t=\frac{x-2}{6}$로 치환하면 $x$는 $t$의 어떤 식인가?'
    - '양변을 $t^2$으로 나누고 $t\to\infty$를 생각하자.'
    - '(다)는 $f\left(-\frac13\right)=0$을 뜻한다.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 69 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (나)의 부등식에서 $t=\dfrac{x-2}{6}$로 치환하면 $t\ge0$일 때, $f(t)<(6t+2)^2$이고
        조건 (가)의 부등식에서 $t=\dfrac{x-1}{6}$로 치환하면 $t\ge0$일 때, $(6t+1)^2<f(t)$이다.
        따라서 $t\ge0$에 대하여 $36t^2+12t+1<f(t)<36t^2+24t+4$이다.
        $t\ne0$일 때, $36+\dfrac{12}{t}+\dfrac{1}{t^2}<\dfrac{f(t)}{t^2}<36+\dfrac{24}{t}+\dfrac{4}{t^2}$이므로
        함수의 극한의 대소관계에 의하여 $\displaystyle\lim_{t\to\infty}\frac{f(t)}{t^2}=36$이다.
        따라서 정수 $a$와 정수 $b$가 존재해서 $f(x)=36x^2+ax+b$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $t=0$을 대입하면 $1<b<4$임을 알 수 있다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        이때, $g(x)=\displaystyle\int_0^x(36t^2+at+b)\,dt$라 하자.
        $g(x)$는 삼차함수이고 조건 (다)에 의해 함수 $g(x)$는 $x=-\dfrac13$에서 극값을 가지므로
        $g'\left(-\dfrac13\right)=36\left(-\dfrac13\right)^2+a\left(-\dfrac13\right)+b=4-\dfrac a3+b=0$이다.
        모든 계수는 정수이므로 위 조건들을 만족하는 함수는 $f(x)=36x^2+18x+2$ 또는 $f(x)=36x^2+21x+3$뿐이다.
        각각의 경우 $f(-1)=20$, $f(-1)=18$이므로 $f(-1)$의 최솟값은 $18$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $f(x)=36x^2+ax+b$ (또는 $f(x)=36x^2+\cdots$)(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        상수항의 범위 $1<b<4$ (또는 $b=2$, $b=3$)(채점기준 4점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        최솟값은 $18$(채점기준 4점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
