  misconceptions:
  - id: MC-CAL-8707
    outcome_code: '71'
    wrong_work: |
      $t=0$에서 $1\le b\le4$로 보아 $b=1$ 또는 $b=4$도 포함해 $f(-1)$의 최솟값을 $15$ 등으로 답함
    detect_cue: |
      $b=1$($a=15$) 또는 $b=4$($a=24$)를 후보에 넣는다
    feedback: |
      조건은 엄격한 부등호($<$)입니다. $t=0$에서 $1<b<4$이므로 $b=2,3$뿐입니다.
    remedy: [RL-1]

