stimuli: []

stem: |
  상수 $a\ (a>0)$에 대하여 함수 $f(x)$가
  $$f(x)=\begin{cases}x^3 & (x<0)\\ ax(x-2) & (x\ge0)\end{cases}$$
  이다. 실수 $t$에 대하여 $x$에 대한 방정식 $f(x)=f(t)$의 서로 다른 실근의 개수를 $g(t)$라 하고, 점 $(0,\ -9)$에서 곡선 $y=f(x)$에 그은 접선의 방정식을 $y=h(x)$라 하자.
  $\left|\displaystyle\lim_{t\to k+}g(t)-\lim_{t\to k-}g(t)\right|=2$를 만족시키는 모든 실수 $k$의 값의 합이 $1$일 때,
  곡선 $y=ax(x-2)$와 $y$축 및 직선 $y=h(x)$로 둘러싸인 부분의 넓이를 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    넓이를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '9', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $g(t)$: $1,2,3,2,3,2,3,2,1$ (경계 $t=-\sqrt[3]a,0,1,2$) $\Rightarrow$ $k=-\sqrt[3]a$, $2$, 합 $1$에서 $a=1$.
    steps:
    - id: 1a
      content: |
        접점 $c=3$, $h(x)=4x-9$, 넓이 $\int_0^3(x-3)^2dx=9$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$f(t)$의 값이 $-a$보다 작을 때, $-a$일 때, $-a$와 $0$ 사이일 때로 나누어 실근을 세자.'
    - '$g(t)$가 2만큼 뛰는 $t$는 어디인가?'
    - '접점을 $(c,\ ac(c-2))$로 두고 접선이 $(0,-9)$를 지나게 하자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 70 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x<0$에서 $f(x)=f(1)$의 해는 $x=\sqrt[3]{-a}=-\sqrt[3]a$이므로 $g(t)$는 다음과 같다.
        $g(t)=1\ (t<-\sqrt[3]a)$, $2\ (t=-\sqrt[3]a)$, $3\ (-\sqrt[3]a<t<0)$, $2\ (t=0)$, $3\ (0<t<1)$, $2\ (t=1)$, $3\ (1<t<2)$, $2\ (t=2)$, $1\ (t>2)$
        따라서 $\left|\displaystyle\lim_{t\to k+}g(t)-\lim_{t\to k-}g(t)\right|=2$를 만족시키는 실수 $k$는 $-\sqrt[3]a$와 $2$뿐이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        모든 실수 $k$의 값의 합이 $1$이므로 $a=1$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        또한, $x=c$일 때 곡선 $y=ax(x-2)$에 접하는 접선의 방정식은 $y=(2c-2)(x-c)+c^2-2c$이다.
        점 $(0,\ -9)$를 지나는 직선은 $c>0$이므로 $-9=(2c-2)(0-c)+c^2-2c=-c^2$을 만족하는 $c$의 값은 $c=3$이다. 따라서 접선은 $y=h(x)=4x-9$이다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        구하는 부분의 넓이 $A=\displaystyle\int_0^3\{x^2-2x-(4x-9)\}\,dx=\left[\frac13x^3-3x^2+9x\right]_0^3=9$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $\left|\displaystyle\lim_{t\to k+}g(t)-\lim_{t\to k-}g(t)\right|=2$를 만족시키는 실수 $k$는 $-\sqrt[3]a$와 $2$뿐이다(채점기준 5점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $a=1$(채점기준 1점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        접선은 $y=h(x)=4x-9$(채점기준 2점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        넓이는 $9$(채점기준 2점).
      depends_on: [1.M1, 1.A2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-8708}
  misconceptions:
  - id: MC-CAL-8708
    outcome_code: '71'
    wrong_work: |
      $g(t)$의 값이 바뀌는 $t=-\sqrt[3]a,0,1,2$를 모두 $k$로 보아 합 $3-\sqrt[3]a=1$에서 $a=8$을 얻음
    detect_cue: |
      $a=8$ 또는 $k$를 4개 이상 나열
    feedback: |
      조건은 좌극한과 우극한의 차가 $2$인 점입니다. $t=0,1$에서는 좌·우극한이 모두 $3$입니다.
    remedy: [RL-1]

