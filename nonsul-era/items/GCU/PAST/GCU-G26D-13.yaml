intent: |
  함수의 극한에 대한 성질을 이용하여 미지수를 찾고, 정적분을 활용하여 두 곡선으로 둘러싸인 부분의 넓이를 구할 수 있는지 확인한다(문항카드 출제 의도 원문). $g(t)$를 $t$의 구간별로 구해 불연속점 $k=-\sqrt[3]a$, $2$를 찾고 $a=1$을 정한 뒤, 점 $(0,-9)$에서 그은 접선과 넓이를 구한다.
key_idea: |
  $f(t)$의 값이 $-a$, $0$인 지점에서 실근 개수가 바뀐다; 좌·우극한 차가 $2$인 곳은 $t=-\sqrt[3]a$와 $t=2$.
stuck: |
  방정식 $f(x)=f(t)$의 실근 개수를 $t$의 구간별로 빠짐없이 분류하는 단계.
