intent: |
  삼각함수의 성질을 활용하여 식을 간단히 표현하고 삼각함수를 포함한 방정식을 통해 종합적으로 이해하고 있는지 확인한다(문항카드 출제 의도 원문). $\theta=x+\frac{\pi}{3}$로 정리하면 $\cos\theta=t$에 대한 이차방정식이 되고, $-1<t\le\frac12$의 근 하나가 $x$ 두 개에 대응함을 이용한다.
