stimuli: []

stem: |
  $0\le x\le\dfrac43\pi$일 때, 방정식
  $$\cos^2\left(x+\frac56\pi\right)-a\cos\left(x+\frac43\pi\right)+a\sin\left(x+\frac56\pi\right)-2a-4=0$$
  의 서로 다른 실근의 개수가 $2$가 되도록 하는 정수 $a$의 값을 모두 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    정수 $a$의 값을 모두 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: 'a=-3, a=-2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      방정식 $\iff\cos^2\theta-2a\cos\theta+2a+3=0$ ($\theta=x+\frac{\pi}{3}$), $t^2-2at+2a+3=0$이 $-1<t\le\frac12$에서 오직 하나의 실근.
    steps:
    - id: 1a
      content: |
        $a<-1$: $f(-1)=4a+4<0$, $f\left(\frac12\right)=\frac{13}{4}+a\ge0$ $\Rightarrow a=-3,-2$; 나머지 경우 불가
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$x+\frac56\pi=\left(x+\frac{\pi}{3}\right)+\frac{\pi}{2}$, $x+\frac43\pi=\left(x+\frac{\pi}{3}\right)+\pi$로 보자.'
    - '$\theta=x+\frac{\pi}{3}$의 범위에서 $\cos\theta=t$의 해가 몇 개인지 $t$값별로 세어 보자.'
    - '$f(t)=t^2-2at+2a+3$의 꼭짓점 $t=a$의 위치로 경우를 나누자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 71 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\cos^2\left(x+\dfrac56\pi\right)=\cos^2\left(x+\dfrac{\pi}{3}+\dfrac{\pi}{2}\right)=\sin^2\left(x+\dfrac{\pi}{3}\right)$
        $\cos\left(x+\dfrac43\pi\right)=\cos\left(x+\dfrac{\pi}{3}+\pi\right)=-\cos\left(x+\dfrac{\pi}{3}\right)$
        $\sin\left(x+\dfrac56\pi\right)=\sin\left(x+\dfrac{\pi}{3}+\dfrac{\pi}{2}\right)=\cos\left(x+\dfrac{\pi}{3}\right)$
        이므로 주어진 식은 $1-\cos^2\left(x+\dfrac{\pi}{3}\right)+a\cos\left(x+\dfrac{\pi}{3}\right)+a\cos\left(x+\dfrac{\pi}{3}\right)-2a-4=0$
        즉, $\cos^2\left(x+\dfrac{\pi}{3}\right)-2a\cos\left(x+\dfrac{\pi}{3}\right)+(2a+3)=0\ \cdots$ ㉠
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $0\le x\le\dfrac43\pi$일 때, $\cos\left(x+\dfrac{\pi}{3}\right)=t$가 ㉠을 만족시키는 서로 다른 $x$의 개수가 $2$이려면
        $-1<t\le\dfrac12$에서 다음 방정식 $t^2-2at+2a+3=0\ \cdots$ ㉡ 이 오직 하나의 실근만을 가져야 한다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 $f(t)=t^2-2at+2a+3=(t-a)^2-a^2+2a+3$이라 하면 구하는 정수 $a$는 $-1<t\le\dfrac12$에서 함수 $y=f(t)$의 그래프와 $t$축이 한 점에서 만나도록 하는 정수 $a$와 같다.
        (i) $a<-1$일 때, $f(-1)=4a+4<0$이고 $f\left(\dfrac12\right)=\dfrac{13}{4}+a\ge0$이어야 하므로 조건을 만족하는 정수 $a$는 $-3$과 $-2$이다.
        (ii) $a=-1$일 때, $f(t)=t^2+2t+1=(t+1)^2$이므로 조건을 만족하지 않는다.
        (iii) $-1<a<\dfrac12$일 때, 즉 $a=0$일 때 $f(t)=t^2+3>0$이므로 조건을 만족하지 않는다.
        (iv) $a\ge\dfrac12$일 때, $f(-1)=4a+4>0$이고 $f\left(\dfrac12\right)=\dfrac{13}{4}+a\le0$이어야 하므로 조건을 만족하는 정수는 없다.
        따라서 조건을 만족하는 정수 $a$는 $-3$과 $-2$ 뿐이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\cos^2\left(x+\dfrac{\pi}{3}\right)-2a\cos\left(x+\dfrac{\pi}{3}\right)+2a+3=0$ (또는 $\sin^2\left(x+\dfrac{5\pi}{6}\right)-2a\sin\left(x+\dfrac{5\pi}{6}\right)+2a+3=0$)(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        방정식 $t^2-2at+2a+3=0$이 $-1<t\le\dfrac12$에서 오직 하나의 실근만을 가져야 한다(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $a=-3$, $a=-2$(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
