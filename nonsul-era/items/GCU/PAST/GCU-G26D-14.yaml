  misconceptions:
  - id: MC-ALG-8709
    outcome_code: '71'
    wrong_work: |
      $t$의 범위를 $-1\le t\le1$ 전체로 보거나 $t=-1$도 $x$ 두 개에 대응한다고 보아 $a=-1$을 포함
    detect_cue: |
      답에 $a=-1$이 들어가거나 범위를 $[-1,1]$로 둔다
    feedback: |
      $\theta=x+\frac{\pi}{3}\in\left[\frac{\pi}{3},\frac{5\pi}{3}\right]$입니다. $\cos\theta=-1$은 $\theta=\pi$ 하나뿐이고, $\cos\theta>\frac12$인 $\theta$는 없습니다.
    remedy: [RL-1]

