  $\theta=x+\frac{\pi}{3}\in\left[\frac{\pi}{3},\frac{5\pi}{3}\right]$에서 $\cos\theta=t$의 해는 $-1<t\le\frac12$일 때 2개, $t=-1$일 때 1개.
