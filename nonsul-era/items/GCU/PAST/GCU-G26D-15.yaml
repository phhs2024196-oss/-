stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) 곡선 $y=f(x)$ 위의 점 $(2,\ f(2))$에서의 접선의 방정식이 $y=-4x+24$이다.
  (나) $f(0)=14$
  함수 $f(x)$의 극댓값과 극솟값을 모두 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    함수 $f(x)$의 극댓값과 극솟값을 모두 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '극댓값 $\frac{37}{2}$, 극솟값 $\frac{328}{27}$', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f'(2)=12+4a+b=-4$, $f(2)=22+4a+2b=16$.
    steps:
    - id: 1a
      content: |
        $f'(x)=3x^2-13x+10=(3x-10)(x-1)$, 극댓값 $f(1)=\frac{37}{2}$, 극솟값 $f\left(\frac{10}{3}\right)=\frac{328}{27}$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '접선의 기울기와 접점의 $y$좌표를 각각 식으로 쓰자.'
    - '$f''(x)=0$의 두 근에서 극대·극소를 판정하자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 72 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (나)에 의해 $f(x)=x^3+ax^2+bx+14$이다.
        $f'(x)=3x^2+2ax+b$이므로, $(2,\ f(2))$에서의 접선의 방정식은 $y-(22+4a+2b)=(12+4a+b)(x-2)$이다.
        따라서 $4a+b=-16$, $4a+2b=-6$이므로 $a=-\dfrac{13}{2}$, $b=10$이다.
        $f'(x)=3x^2-13x+10=(3x-10)(x-1)=0$이므로
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        함수 $f(x)$는 $x=1$에서 극대, $x=\dfrac{10}{3}$에서 극소를 갖는다. 따라서 극댓값은 $f(1)=1+a+b+14=\dfrac{37}{2}$이고,
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        극솟값은 $f\left(\dfrac{10}{3}\right)=\dfrac{328}{27}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
