  misconceptions:
  - id: MC-CAL-8709
    outcome_code: '71'
    wrong_work: |
      $f'(2)=-4$만 쓰고 $f(2)=16$을 쓰지 않아 계수를 정하지 못하거나 $y$절편 $24$를 $f(0)$으로 혼동
    detect_cue: |
      미지수 2개에 식 1개, 또는 $f(0)=24$를 사용
    feedback: |
      접선 $y=-4x+24$는 기울기($f'(2)=-4$)와 접점($f(2)=-8+24=16$) 두 정보를 줍니다.
    remedy: [RL-1]

