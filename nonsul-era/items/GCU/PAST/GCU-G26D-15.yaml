intent: |
  곡선 위의 한 점에서의 접선의 방정식과 다항함수의 극댓값과 극솟값을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). 접선 조건 $f(2)=16$, $f'(2)=-4$로 계수를 정한 뒤 $f'(x)=0$의 해에서 극값을 계산한다.
