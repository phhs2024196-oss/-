stem: |
  $0\le x<\dfrac{\pi}{2}$일 때, 방정식 $3\cos^2x-\sin x\cos x-2\sin^2x=0$의 실근을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    실근을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'x=\frac{\pi}{4}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $(3\cos x+2\sin x)(\cos x-\sin x)=0$에서 $\tan x=-\frac32$ 또는 $\tan x=1$.
    steps:
    - id: 1a
      content: |
        $0\le x<\frac{\pi}{2}$에서 $\tan x\ge0$이므로 $\tan x=1$, $x=\frac{\pi}{4}$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '좌변을 $\cos x$와 $\sin x$의 이차식으로 보고 인수분해하자.'
    - '주어진 범위에서 $\tan x$의 부호는?'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 73 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $(3\cos x+2\sin x)(\cos x-\sin x)=0$
        $\cos x=-\dfrac23\sin x$, $\cos x=\sin x$
        $\tan x=-\dfrac32$ 또는 $\tan x=1$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $0\le x<\dfrac{\pi}{2}$일 때 $\tan x\ge0$
        $\therefore\ \tan x=1$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\therefore\ x=\dfrac{\pi}{4}$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\tan x=-\dfrac32$, $\tan x=1$ (또는 $\cos x=-\dfrac23\sin x$, $\cos x=\sin x$)(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        두 개의 식 중에 가능한 경우는 $\tan x=1$ (또는 $\cos x=\sin x$)(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $x=\dfrac{\pi}{4}$(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
