  삼각함수의 정의와 삼각함수 사이의 관계를 이용하여 문제를 해결할 수 있는지 확인한다(문항카드 출제 의도 원문). 좌변을 인수분해해 $\tan x$의 값으로 바꾸고 $0\le x<\frac{\pi}{2}$에서 가능한 해만 고른다.
