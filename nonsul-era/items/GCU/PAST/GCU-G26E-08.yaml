stem: |
  수열 $\{a_n\}$에 대하여 첫째항부터 제$n$항까지의 합을 $S_n$이라 하자. $S_1=3$이고 모든 자연수 $n$에 대하여 $S_{n+1}=3S_n+2$를 만족시킬 때, $\log_3\dfrac{8}{a_6}$의 값과 $S_7$의 값을 모두 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\log_3\dfrac{8}{a_6}$의 값과 $S_7$의 값을 모두 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '$\log_3\frac{8}{a_6}=-4$, $S_7=2915$', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $S_n$: $3,11,35,107,323,971,2915$
    steps:
    - id: 1a
      content: |
        $a_6=971-323=648=8\times3^4$, $\log_3\frac{8}{a_6}=-4$, $S_7=2915$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$S_2, S_3, \ldots$를 차례로 구해 보자.'
    - '$a_6$은 $S_6$과 $S_5$로 어떻게 나타나는가?'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 74 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $S_1=3$, $S_2=11$, $S_3=35$, $S_4=107$, $S_5=323$, $S_6=971$, $S_7=2915$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $a_6=S_6-S_5=648$이므로
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\log_3\dfrac{8}{a_6}=\log_3\dfrac{8}{8\times3^4}=-4$이다.
      criteria: ['1.A2']
  rubric:
