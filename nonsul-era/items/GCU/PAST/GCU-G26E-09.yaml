stem: |
  함수 $f(x)=x^2-3x+k$에 대하여 함수 $y=\dfrac{3x+1}{2\{f(x)\}^2-2xf(x)+5f(x)}$가 실수 전체의 집합에서 연속이 되도록 하는 실수 $k$의 값의 범위를 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    실수 $k$의 값의 범위를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'k>\frac{9}{4}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)\ne0$: $9-4k<0$, $2f(x)-2x+5\ne0$: $6-4k<0$.
    steps:
    - id: 1a
      content: |
        공통 범위 $k>\frac94$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '분모를 $f(x)$로 묶어 보자.'
    - '두 이차식이 실근을 갖지 않을 조건은?'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 75 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 함수 $y=3x+1$, $y=2\{f(x)\}^2-2xf(x)+5f(x)$는 실수 전체의 집합에서 연속이므로
        함수 $\dfrac{3x+1}{2\{f(x)\}^2-2xf(x)+5f(x)}$가 실수 전체의 집합에서 연속이려면
        모든 실수 $x$에 대하여 $f(x)\{2f(x)-2x+5\}\ne0$이어야 한다. 즉, $f(x)\ne0$이고 $2f(x)-2x+5\ne0$이어야 한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (1) $f(x)\ne0$인 경우, $x^2-3x+k>0$이므로 판별식 $D=9-4k<0$이다. 즉, $k>\dfrac94$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        (2) $2f(x)-2x+5\ne0$인 경우, $2x^2-8x+2k+5>0$이므로 판별식 $\dfrac{D}{4}=6-4k<0$이다. 즉, $k>\dfrac32$이다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        따라서 두 조건을 모두 만족시키는 실수 $k$의 범위는 $k>\dfrac94$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
