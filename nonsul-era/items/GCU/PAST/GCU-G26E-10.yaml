  misconceptions:
  - id: MC-CAL-8711
    outcome_code: '71'
    wrong_work: |
      극값 $f(0)=27$을 최솟값으로 보아 $m=27$
    detect_cue: |
      $m=27$, $M\times m=733$
    feedback: |
      닫힌구간에서는 끝점 $t=3$의 값 $f(3)=9$도 비교해야 합니다.
    remedy: [RL-1]

