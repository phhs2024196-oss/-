stem: |
  실수 $t\ (0\le t\le3)$에 대하여 점 $(t,\ \sqrt{27-t^3})$과 원점 사이의 거리의 제곱을 $f(t)$라 하자.
  닫힌구간 $[0,\ 3]$에서 함수 $f(t)$의 최댓값과 최솟값을 각각 $M$, $m$이라 할 때, $M\times m$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $M\times m$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\frac{733}{3}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(0)=27$, $f\left(\frac23\right)=27+\frac{4}{27}$, $f(3)=9$.
    steps:
    - id: 1a
      content: |
        $M=\frac{733}{27}$, $m=9$, $M\times m=\frac{733}{3}$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '거리의 제곱을 $t$의 식으로 쓰자.'
    - '극값과 양 끝값을 모두 비교하자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 76 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(t)=t^2+\left(\sqrt{27-t^3}\right)^2=-t^3+t^2+27$이므로
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f'(t)=-3t^2+2t$이다. 닫힌구간 $[0,3]$에서 $f'(t)=0$인 $t$의 값은 $0$과 $\dfrac23$이다. $f(0)=27$, $f\left(\dfrac23\right)=27+\dfrac{4}{27}$, $f(3)=9$이므로 $M=27+\dfrac{4}{27}$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $m=9$이다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        따라서 $M\times m=\dfrac{733}{3}$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f(t)=-t^3+t^2+27$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $M=\dfrac{733}{27}$ (또는 $M=27+\dfrac{4}{27}$)(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $m=9$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        $M\times m=\dfrac{733}{3}$(채점기준 1점).
      depends_on: [1.M1, 1.A1, 1.A2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
