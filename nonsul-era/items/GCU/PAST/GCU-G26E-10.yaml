intent: |
  삼차함수의 최댓값과 최솟값을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). 거리의 제곱을 $f(t)=-t^3+t^2+27$로 나타내고 닫힌구간 $[0,3]$에서 극값과 끝값을 비교한다.
