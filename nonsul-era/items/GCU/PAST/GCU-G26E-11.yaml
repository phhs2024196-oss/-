stimuli: []

stem: |
  $-\dfrac14<x<\dfrac34$에서 기울기가 양수이고 점 $\left(\dfrac14,\ 0\right)$을 지나는 직선과 함수 $y=\tan2\pi x$의 그래프가 만나는 두 점의 $x$좌표를 각각 $a$, $b\ (a<b)$라 하자. $a+2b=\dfrac76$일 때, $\sin(2a+b)\pi$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\sin(2a+b)\pi$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\frac{\sqrt{3}}{2}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      주기 $\frac12$, 대칭으로 $a+b=\frac12$.
    steps:
    - id: 1a
      content: |
        $b=\frac23$, $a=-\frac16$, $2a+b=\frac13$, $\sin\frac{\pi}{3}=\frac{\sqrt3}{2}$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$y=\tan2\pi x$의 그래프는 점 $\left(\frac14,0\right)$에 대하여 어떤 대칭성을 갖는가?'
    - '$a+b$를 먼저 구하자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 77 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=\tan2\pi x$의 주기는 $\dfrac12$이고 $a+b=\dfrac12$이다. $a+2b=(a+b)+b=\dfrac12+b=\dfrac76$이므로 $b=\dfrac23$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $a=-\dfrac16$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $2a+b=a+(a+b)=a+\dfrac12=-\dfrac16+\dfrac12=\dfrac13$
        $\therefore\ \sin(2a+b)\pi=\sin\dfrac{\pi}{3}=\dfrac{\sqrt3}{2}$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $b=\dfrac23$(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $a=-\dfrac16$(채점기준 4점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $\sin(2a+b)\pi=\dfrac{\sqrt3}{2}$(채점기준 2점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-8712}
  misconceptions:
  - id: MC-ALG-8712
    outcome_code: '71'
    wrong_work: |
      $a+b=0$으로 두어 $b=\frac76$ 등 범위 밖 값을 얻음
    detect_cue: |
      $b$가 $\frac34$보다 크거나 $a+b=0$을 사용
    feedback: |
      직선이 지나는 점 $\left(\frac14,0\right)$이 대칭의 중심입니다. 따라서 $\frac{a+b}{2}=\frac14$입니다.
    remedy: [RL-1]

