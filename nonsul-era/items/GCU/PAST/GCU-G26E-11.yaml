  탄젠트함수의 그래프와 주기의 내용을 활용할 수 있는지 확인한다(문항카드 출제 의도 원문). $y=\tan2\pi x$의 그래프가 점 $\left(\frac14,0\right)$에 대하여 대칭이므로 두 교점의 $x$좌표 합이 $\frac12$임을 이용한다.
