stimuli: []

stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킬 때, $f'(3)$의 값을 구하는 과정을 서술하시오.
  $0$이 아닌 모든 실수 $x$에 대하여
  $$\frac{3f'(x)-f'(0)}{4}+\frac{23}{4}x^2-4\le\frac{f(3x)-f(0)}{3x}\le\frac12x^4+5x^2$$
  이다.

subparts:
- id: '1'
  stem: |
    $f'(3)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '19', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $-2x^2-8\le3ax+b\le\frac{x^4-8x^2}{2}$, 양쪽 극값이 $-8$ $\Rightarrow$ $a=0$, $b=-8$.
    steps:
    - id: 1a
      content: |
        $f'(x)=3x^2-8$, $f'(3)=19$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$f(x)=x^3+ax^2+bx+c$를 대입해 부등식을 정리하자.'
    - '$h(x)=\frac12x^4-4x^2$의 최솟값과 $-2x^2-8$의 최댓값은?'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 78 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$는 최고차항의 계수가 $1$인 삼차함수이므로 $f(x)=x^3+ax^2+bx+c$(단, $a$, $b$, $c$는 상수)이다. 따라서 $f'(x)=3x^2+2ax+b$이므로
        주어진 부등식에 대입하면 $8x^2+\dfrac32ax+\dfrac12b-4\le9x^2+3ax+b\le\dfrac12x^4+5x^2$이다.
        즉, $-2x^2-8\le3ax+b\le\dfrac{x^4-8x^2}{2}$이므로
        $g(x)=-2x^2-8$이라 하면, $g(x)$의 최댓값은 $-8$이고,
        $h(x)=\dfrac12x^4-4x^2$이라 하면, $h'(x)=2x(x-2)(x+2)$이고 $h(2)=h(-2)=-8$의 최솟값을 갖는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서, $0$이 아닌 모든 실수 $x$에 대하여 부등식을 만족시키려면 $y=3ax+b$가 $y=-8$이 되어야 한다. 따라서 $a=0$, $b=-8$이다. $f'(x)=3x^2-8$이므로
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $f'(3)=19$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
