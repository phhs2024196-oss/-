    wrong_work: |
      $\frac{f(3x)-f(0)}{3x}=3x^2+ax+b$처럼 $3$의 거듭제곱을 빠뜨려 정리
    detect_cue: |
      정리된 부등식의 $x^2$ 계수가 $9$가 아니다
    feedback: |
      $f(3x)=27x^3+9ax^2+3bx+c$이므로 $\frac{f(3x)-f(0)}{3x}=9x^2+3ax+b$입니다.
    remedy: [RL-1]

