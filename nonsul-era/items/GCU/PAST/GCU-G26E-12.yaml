intent: |
  함수의 극대와 극소 및 미분계수를 이해하고, 주어진 값을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). 부등식을 정리해 직선 $y=3ax+b$가 $y=-2x^2-8$(최댓값 $-8$)과 $y=\frac12x^4-4x^2$(최솟값 $-8$) 사이에 끼임을 이용한다.
key_idea: |
  $-2x^2-8\le3ax+b\le\frac{x^4-8x^2}{2}$, 위쪽 함수의 최솟값과 아래쪽 함수의 최댓값이 모두 $-8$이므로 직선은 $y=-8$.
stuck: |
  $f(x)=x^3+ax^2+bx+c$를 대입해 부등식을 $3ax+b$로 정리하는 계산과, 두 함수의 최대·최소를 비교하는 발상.
