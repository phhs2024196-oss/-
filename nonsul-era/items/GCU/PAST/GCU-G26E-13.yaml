stimuli: []

stem: |
  최고차항의 계수가 $1$인 다항함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) $\displaystyle\lim_{x\to\infty}\frac{f(x)}{xf'(x)}=\frac13$
  (나) $\displaystyle\lim_{x\to0}\left\{\left(x^2+\frac1x\right)f(x)\right\}$이 존재한다.
  (다) $\displaystyle\lim_{x\to-1}\left\{\left(x^2+\frac1x\right)\frac{1}{f(x)}\right\}=3$
  $\displaystyle\int_{-2}^{2}|f(x)|\,dx$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\displaystyle\int_{-2}^{2}|f(x)|\,dx$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\frac{33}{2}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=x^3+ax^2+bx$, $a-b=1$, $\frac{-3}{2-a}=3$ $\Rightarrow$ $f(x)=x^3+3x^2+2x$.
    steps:
    - id: 1a
      content: |
        $\int_{-2}^{-1}f\,dx+\int_{-1}^{0}(-f)\,dx+\int_0^2f\,dx=\frac14+\frac14+16=\frac{33}{2}$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$f(x)=x^n+\cdots$이면 $\frac{f(x)}{xf''(x)}\to\frac1n$이다.'
    - '(나)의 극한이 존재하려면 $f(0)$은?'
    - '(다)에서 $x^2+\frac1x=\frac{x^3+1}{x}$은 $x=-1$에서 $0$이다.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 79 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        최고차항의 계수가 $1$인 다항함수 $f(x)$를 $f(x)=x^n+\cdots$라 하면
        조건 (가)에서 $\displaystyle\lim_{x\to\infty}\frac{f(x)}{xf'(x)}=\lim_{x\to\infty}\frac{x^n+\cdots}{x\times(nx^{n-1}+\cdots)}=\frac13$이므로 다항함수 $f(x)$의 차수는 $3$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        조건 (나)로부터 $\displaystyle\lim_{x\to0}\left\{\left(x^2+\frac1x\right)f(x)\right\}$이 존재하므로 $f(0)=0$
        따라서 $f(x)=x^3+ax^2+bx$라 놓을 수 있고, $\displaystyle\lim_{x\to0}\left\{\left(x^2+\frac1x\right)f(x)\right\}=\lim_{x\to0}\frac{(x^3+1)(x^3+ax^2+bx)}{x}=b$
        조건 (다)로부터 $\displaystyle\lim_{x\to-1}\left\{\left(x^2+\frac1x\right)\frac{1}{f(x)}\right\}=\lim_{x\to-1}\frac{(x+1)(x^2-x+1)}{xf(x)}$가 존재하므로
        $f(-1)=0$, 즉 $a-b=1$이고, $f(x)=x^3+ax^2+bx=x^3+ax^2+ax-x=(x+1)(x^2+ax-x)$이다. 따라서
        $\displaystyle\lim_{x\to-1}\left\{\left(x^2+\frac1x\right)\frac{1}{f(x)}\right\}=\lim_{x\to-1}\frac{(x+1)(x^2-x+1)}{x(x+1)(x^2+ax-x)}=\frac{-3}{2-a}=3$
        이므로 $a=3$, $b=2$이다. 따라서 $f(x)=x^3+3x^2+2x$이고,
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\displaystyle\int_{-2}^{2}|f(x)|\,dx=\int_{-2}^{-1}f(x)\,dx+\int_{-1}^{0}\{-f(x)\}\,dx+\int_0^2f(x)\,dx=\frac{33}{2}$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $f(x)$는 3차 다항함수이다 (또는 $f(x)=x^3+\cdots$)(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $f(x)=x^3+3x^2+2x$(채점기준 4점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $\displaystyle\int_{-2}^{2}|f(x)|\,dx=\frac{33}{2}$(채점기준 4점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
