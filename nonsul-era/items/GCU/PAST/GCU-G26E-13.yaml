  극한의 성질을 활용하여 주어진 조건을 만족하는 다항함수를 찾고, 정적분과 다항함수의 그래프와의 관계를 이해하고 있는지 확인한다(문항카드 출제 의도 원문). (가)로 차수, (나)로 $f(0)=0$, (다)로 $f(-1)=0$과 계수를 정한 뒤 부호 구간별로 $|f(x)|$를 적분한다.
