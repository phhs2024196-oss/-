stimuli: []

stem: |
  점 $\mathrm{A}$의 좌표를 $(-2,\ 0)$이라 하고, 함수 $f(x)=\log_2(x+2)$의 그래프가 $y$축과 만나는 점을 $\mathrm{B}$라 하자. $2$ 이상인 자연수 $n$에 대하여 곡선 $y=f(x)$ 위의 $x$좌표가 $2^n$인 점을 $\mathrm{P}$라 하고 두 삼각형 $\mathrm{PBO}$, $\mathrm{PBA}$의 넓이의 차를 $S_n$이라 할 때, $S_n>2026$을 만족시키는 자연수 $n$의 최솟값을 구하는 과정을 서술하시오. (단, $\mathrm{O}$는 원점이다.)

subparts:
- id: '1'
  stem: |
    자연수 $n$의 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '2027', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $S_n=\triangle\mathrm{PBO}-\triangle\mathrm{PBA}=\log_2(2+2^n)-1$.
    steps:
    - id: 1a
      content: |
        $\log_2(2+2^n)>2027\iff2+2^n>2^{2027}$ $\Rightarrow$ $n=2027$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$\mathrm{B}$의 좌표와 $\overline{\mathrm{BO}}$를 구하자.'
    - '$\triangle\mathrm{PBA}$는 사다리꼴과 삼각형의 넓이로 나타내 보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 80 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{BO}}=\log_22=1$이므로 ($\mathrm{B}(0,1)$)
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $x$좌표가 $2^n$인 점 $\mathrm{P}$에 대하여 삼각형 $\mathrm{PBO}$의 넓이는 $\triangle\mathrm{PBO}=\dfrac12\times\overline{\mathrm{BO}}\times2^n=2^{n-1}$, $\triangle\mathrm{BAO}=1$이므로
        $\triangle\mathrm{PBA}=1+\dfrac12\times2^n\times\{1+\log_2(2+2^n)\}-\dfrac12\times(2+2^n)\times\log_2(2+2^n)=2^{n-1}+1-\log_2(2+2^n)$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $S_n=\triangle\mathrm{PBO}-\triangle\mathrm{PBA}=2^{n-1}-2^{n-1}-1+\log_2(2+2^n)=\log_2(2+2^n)-1$
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $S_n=\log_2(2+2^n)-1>2026$이므로 $\log_2(2+2^n)>2027$, $2+2^n>2^{2027}$이므로 이를 만족시키는 $n$의 최솟값은 $2027$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        점 $\mathrm{B}(0,1)$ 또는 $\overline{\mathrm{BO}}=1$(채점기준 1점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\triangle\mathrm{PBA}=2^{n-1}+1-\log_2(2+2^n)$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $S_n=\log_2(2+2^n)-1$(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 3
      evidence: |
        $n$의 최솟값은 $2027$(채점기준 3점).
      depends_on: [1.M1, 1.A2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
