  misconceptions:
  - id: MC-ALG-8713
    outcome_code: '71'
    wrong_work: |
      $2+2^n>2^{2027}$을 $2^n\ge2^{2027}$ 대신 $n>2027$로 처리해 $2028$을 답함
    detect_cue: |
      답이 2028
    feedback: |
      $n=2027$이면 $2+2^{2027}>2^{2027}$이 성립합니다. 경계값을 직접 대입해 확인하세요.
    remedy: [RL-1]

