stimuli: []

stem: |
  실수 $a$에 대하여 함수 $f(x)=(x-2)(x-a)$의 한 부정적분을 $F(x)$라 하자. $x$에 대한 방정식 $F(x)=0$의 서로 다른 실근의 개수가 $2$일 때, $F(0)$의 최솟값을 구하는 과정을 서술하시오. (단, $2<a\le6$)

subparts:
- id: '1'
  stem: |
    $F(0)$의 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-\frac{32}{3}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $F(x)=\frac13x^3-\frac{a+2}{2}x^2+2ax+C$, $F(2)=0$ 또는 $F(a)=0$.
    steps:
    - id: 1a
      content: |
        $F(a)=0$: $C=\frac{a^3}{6}-a^2\ge-\frac{16}{3}$; $F(2)=0$: $C=\frac43-2a\ge-\frac{32}{3}$ $\Rightarrow$ 최솟값 $-\frac{32}{3}$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$F(x)$를 적분상수 $C$를 포함해 구하자.'
    - '삼차방정식이 서로 다른 두 실근을 가질 조건은?'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 81 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $F(x)=\displaystyle\int f(x)\,dx=\int\{x^2-(a+2)x+2a\}\,dx=\frac13x^3-\frac{a+2}{2}x^2+2ax+C$이므로,
        $F(x)=0$이 서로 다른 두 실근을 가지려면 함수 $F(x)$의 극댓값 혹은 극솟값이 $0$이어야 한다.
        ② $F(a)=-\dfrac{a^3}{6}+a^2+C=0$인 경우 $F(0)=C=\dfrac{a^3}{6}-a^2$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        은 $a=4$일 때 최솟값 $-\dfrac{16}{3}$을 가진다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        ① $F(2)=-\dfrac43+2a+C=0$인 경우 $F(0)=C=\dfrac43-2a$
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        는 $a=6$일 때 최솟값 $-\dfrac{32}{3}$를 가진다. 따라서 $F(0)$의 최솟값은 $-\dfrac{32}{3}$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        $F(0)=\dfrac{a^3}{6}-a^2$ (또는 적분상수 $C=\dfrac{a^3}{6}-a^2$)(채점기준 1점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $-\dfrac{16}{3}$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $F(0)=\dfrac43-2a$ (또는 적분상수 $C=\dfrac43-2a$)(채점기준 2점).
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: |
        최솟값 $-\dfrac{32}{3}$(채점기준 4점).
      depends_on: [1.M1, 1.A1, 1.A2]
      steps: [1b-4]
    deductions: []
