stem: |
  첫째항이 $1$인 등차수열 $\{a_n\}$에 대하여 $\displaystyle\sum_{n=1}^{10}a_n=100$일 때, $\displaystyle\sum_{n=1}^{10}\frac{2}{a_na_{n+1}}$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{n=1}^{10}\frac{2}{a_na_{n+1}}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\frac{20}{21}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $10+45d=100$에서 $d=2$, $a_n=2n-1$.
    steps:
    - id: 1a
      content: |
        $\sum_{n=1}^{10}\left(\frac{1}{2n-1}-\frac{1}{2n+1}\right)=1-\frac{1}{21}=\frac{20}{21}$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '합 조건으로 공차를 구하자.'
    - '$\frac{2}{(2n-1)(2n+1)}$을 두 분수의 차로 나타내 보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 82 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\{a_n\}$은 등차수열이고 $a_1=1$이므로 $a_n=1+d(n-1)$이다.
        $\displaystyle\sum_{n=1}^{10}a_n=100$이므로 $a_n=2n-1$이다. 따라서,
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\sum_{n=1}^{10}\frac{2}{a_na_{n+1}}=\sum_{n=1}^{10}\frac{2}{(2n-1)(2n+1)}=\sum_{n=1}^{10}\left(\frac{1}{2n-1}-\frac{1}{2n+1}\right)=1-\frac13+\frac13-\frac15+\cdots+\frac{1}{19}-\frac{1}{21}$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $=1-\dfrac{1}{21}=\dfrac{20}{21}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $a_n=2n-1$ (또는 공차는 $2$)(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\displaystyle\sum_{n=1}^{10}\frac{2}{a_na_{n+1}}=\sum_{n=1}^{10}\left(\frac{1}{2n-1}-\frac{1}{2n+1}\right)$ (또는 $=1-\frac13+\frac13-\frac15+\cdots+\frac{1}{19}-\frac{1}{21}$)(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\displaystyle\sum_{n=1}^{10}\frac{2}{a_na_{n+1}}=\frac{20}{21}$(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
