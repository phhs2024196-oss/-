stem: |
  상수 $a$에 대하여 이차함수 $f(x)$가
  $$9\times\lim_{x\to3}\frac{f(x)-x}{x^3-27}=\lim_{x\to2}\frac{f(x)-f(x+1)}{x^2-4}=a$$
  를 만족시킬 때, $a$와 $f(7)$의 값을 모두 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $a$와 $f(7)$의 값을 모두 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '$a=-\frac{1}{5}$, $f(7)=11$', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=c(x-3)(x-2)+3$, $\frac{c-1}{3}=-\frac{c}{2}$.
    steps:
    - id: 1a
      content: |
        $c=\frac25$, $a=-\frac15$, $f(7)=\frac25\cdot20+3=11$
      criteria: ['1.M1', '1.A2', '1.A3']
    hint_ladder:
    - '분모가 $0$으로 가면 분자도 $0$으로 가야 한다.'
    - '$f(3)$, $f(2)$의 값은?'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 83 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건으로 주어진 두 극한값이 존재하기 위해 $f(3)=3$, $f(2)=3$이다.
        따라서 $c$는 $0$이 아닌 상수에 대하여 $f(x)=c(x-3)(x-2)+3$으로 놓을 수 있다.
        극한을 계산하면
        $\displaystyle9\lim_{x\to3}\frac{f(x)-x}{x^3-27}=9\lim_{x\to3}\frac{c(x-3)(x-2)-(x-3)}{(x-3)(x^2+3x+9)}=9\lim_{x\to3}\frac{c(x-2)-1}{x^2+3x+9}=\frac{c-1}{3}$
        $\displaystyle\lim_{x\to2}\frac{f(x)-f(x+1)}{x^2-4}=\lim_{x\to2}\frac{-2c(x-2)}{(x-2)(x+2)}=\lim_{x\to2}\frac{-2c}{x+2}=-\frac{c}{2}$
        이다. 따라서 $\dfrac{c-1}{3}=-\dfrac{c}{2}$가 성립하고 $c=\dfrac25$이고
      criteria: ['1.A2']
    - id: 1b-2
      content: |
        $a=-\dfrac15$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        따라서 $f(7)=11$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
