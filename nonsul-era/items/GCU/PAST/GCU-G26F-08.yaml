      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $f(x)=\dfrac25(x-3)(x-2)+3$ (또는 최고차항의 계수가 $\dfrac25$)(또는 $f(x)=\dfrac25x^2+\cdots$)(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: |
        $f(7)=11$(채점기준 4점).
      depends_on: [1.M1, 1.A2]
      steps: [1b-3]
    deductions: []
