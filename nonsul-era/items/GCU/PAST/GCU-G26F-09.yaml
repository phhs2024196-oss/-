stimuli: []

stem: |
  모든 항이 정수인 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
  $$a_{n+1}=\begin{cases}-2a_n+7 & (a_n<4\text{인 경우})\\ a_n-n+5 & (a_n\ge4\text{인 경우})\end{cases}$$
  를 만족시킨다. $a_6=11$일 때, $a_1$, $a_4$, $\displaystyle\sum_{k=1}^{10}a_k$의 값을 모두 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $a_1$, $a_4$, $\displaystyle\sum_{k=1}^{10}a_k$의 값을 모두 구하는 과정을 서술하시오.
  points: 11
  depends_on: []
  answer: {kind: value, value: '$a_1=1$, $a_4=10$, $\sum_{k=1}^{10}a_k=70$', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $a_6=11\Rightarrow a_5=11\Rightarrow a_4=10\Rightarrow a_3=8\Rightarrow a_2=5\Rightarrow a_1=1$
    steps:
    - id: 1a
      content: |
        $1+5+8+10+11+11+10+8+5+1=70$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$a_6=11$이 되는 $a_5$의 후보를 두 식에서 각각 구해 보자.'
    - '후보가 해당 경우의 조건을 만족하는지 확인하자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 84 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        ① $a_6=11=-2a_5+7$이면 $a_5=-2$이나 이때 $a_4$가 조건을 만족하지 않는다.
        ② $a_6=11=a_5-5+5$이면 $a_5=11$
         i) $a_5=11=-2a_4+7$이면 $a_4=-2$이나 이때 $a_3$가 조건을 만족하지 않는다.
         ii) $a_5=11=a_4-4+5$이면 $a_4=10$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $a_4=10=-2a_3+7$ 또는 $a_4=10=a_3-3+5$인데 $a_3$은 정수이므로 $a_3=8$
        $a_3=8$이면 $a_2=5$, $a_1=1$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $a_7=10$, $a_8=8$, $a_9=5$, $a_{10}=1$
        그러므로 $\displaystyle\sum_{k=1}^{10}a_k=1+5+8+10+11+11+10+8+5+1=70$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $a_4=10$(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $a_1=1$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $\displaystyle\sum_{k=1}^{10}a_k=70$(채점기준 4점). [보고서 채점기준 합계 3+4+4=11점 — 다른 문항(10점)과 다름, 보고서 표기 그대로]
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
