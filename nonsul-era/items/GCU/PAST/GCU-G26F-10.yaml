  misconceptions:
  - id: MC-ALG-8716
    outcome_code: '71'
    wrong_work: |
      $\frac{2\pi}{b}=2\pi$로 두어 $b=1$
    detect_cue: |
      $b=1$, $f\left(\frac{\pi}{3}\right)$에 $\sin\frac{\pi}{3}$ 사용
