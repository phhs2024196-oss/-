stem: |
  함수 $f(x)=a\sin bx+c\left(0\le x\le\dfrac{2\pi}{b}\right)$는 $x=\alpha$에서 최댓값 $10$, $x=\beta$에서 최솟값 $m$을 갖는다. $y=f(x)$의 그래프 위의 두 점 $\mathrm{A}(\alpha,10)$, $\mathrm{B}(\beta,m)$을 지나는 직선을 $y=g(x)$라 하자. $\beta-\alpha=2\pi$이고 $f\left(\dfrac{\pi}{3}\right)=8$일 때, 직선 $y=g(x)$와 $x$축 및 두 직선 $x=\alpha$, $x=\beta$로 둘러싸인 부분의 넓이를 구하는 과정을 서술하시오. (단, $a$, $b$, $c$는 양수이고, $a<c$이다.)

subparts:
- id: '1'
  stem: |
    둘러싸인 부분의 넓이를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '12\pi', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $b=\frac12$, $a=4$, $c=6$, $m=2$, $\alpha=\pi$, $\beta=3\pi$.
    steps:
    - id: 1a
      content: |
        사다리꼴 넓이 $\frac12\times(10+2)\times2\pi=12\pi$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '최댓값과 최솟값을 갖는 두 점 사이의 $x$ 간격은 주기의 몇 배인가?'
    - '$a+c=10$, $f\left(\frac{\pi}{3}\right)=8$을 연립하자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 85 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $b$가 양수이므로 함수 $f(x)$의 주기는 $\dfrac{2\pi}{b}$이고 $x=\alpha$일 때 최대, $x=\beta$일 때 최소이므로
        $2\pi=\beta-\alpha=\dfrac{\pi}{b}$, $b=\dfrac12$이고 $f(x)=a\sin\dfrac{x}{2}+c$이다.
        $f(x)$는 $x=\pi$에서 최댓값 $a+c=10$, $x=3\pi$에서 최솟값 $-a+c=m$을 갖는다.
        $8=f\left(\dfrac{\pi}{3}\right)=a\sin\dfrac{\pi}{6}+c=\dfrac a2+c$이므로 $a+c=10$과 $\dfrac a2+c=8$을 연립하면 $a=4$, $c=6$이므로
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f(x)=4\sin\dfrac{x}{2}+6$이고 $m=-a+c=-4+6=2$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        구하는 영역의 넓이는 꼭짓점이 $(\pi,0)$, $\mathrm{A}(\pi,10)$, $\mathrm{B}(3\pi,2)$, $(3\pi,0)$인 사다리꼴의 넓이와 같으므로 $\dfrac12\times(10+2)\times2\pi=12\pi$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $b=\dfrac12$, $a=4$, $c=6$ (또는 $f(x)=4\sin\dfrac x2+6$)(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $m=2$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        영역의 넓이는 $12\pi$(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
