stimuli: []

stem: |
  $2$ 이상의 자연수 $n$에 대하여 실수 $a$의 $n$제곱근 중 실수인 것의 개수를 $f_n(a)$라 하자.
  $2f_{n+1}(a^n)+(-1)^n\times f_n(f_{n+1}(a))$의 값이 최소일 때,
  $$f_n(a)-3f_{n+1}(a^n)+f_{n+1}(|a|^n-a^n)$$
  의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      6가지 경우 값: $3,4,1,4,-1,4$ → 최소 $-1$ ($a<0$, $n$ 홀수).
    steps:
    - id: 1a
      content: |
        $f_n(a)=1$, $f_{n+1}(a^n)=0$, $f_{n+1}(-2a^n)=2$ → $1-0+2=3$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$n$이 홀수이면 $n+1$은 짝수이다.'
    - '$a>0$, $a=0$, $a<0$으로 나누어 보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 86 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        실수 $a$와 자연수 $n$에 따라 다음과 같이 경우를 나누어 계산한다.
        (1) $a>0$이고 $n$이 홀수일 때, $a^n>0$이므로 $f_{n+1}(a^n)=2$, $f_{n+1}(a)=2$, $f_n(2)=1$이다. 따라서 $2f_{n+1}(a^n)+(-1)^n\times f_n(f_{n+1}(a))=3$
        (2) $a>0$이고 $n$이 짝수일 때, $a^n>0$이므로 $f_{n+1}(a^n)=1$, $f_{n+1}(a)=1$, $f_n(1)=2$이다. 따라서 $\cdots=4$
        (3) $a=0$이고 $n$이 홀수일 때, $f_{n+1}(a^n)=1$, $f_{n+1}(a)=1$, $f_n(1)=1$이다. 따라서 $\cdots=1$
        (4) $a=0$이고 $n$이 짝수일 때, $f_{n+1}(a^n)=1$, $f_{n+1}(a)=1$, $f_n(1)=2$이다. 따라서 $\cdots=4$
        (5) $a<0$이고 $n$이 홀수일 때, $a^n<0$이므로 $f_{n+1}(a^n)=0$, $f_{n+1}(a)=0$, $f_n(0)=1$이다. 따라서 $\cdots=-1$
        (6) $a<0$이고 $n$이 짝수일 때, $a^n>0$이므로 $f_{n+1}(a^n)=1$, $f_{n+1}(a)=1$, $f_n(1)=2$이다. 따라서 $\cdots=4$
        따라서 $a<0$이고 $n$이 홀수일 때, 최솟값 $-1$이고, 이때, $a^n<0$이므로 $f_n(a)=1$, $f_{n+1}(a^n)=0$,
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f_{n+1}(|a|^n-a^n)=f_{n+1}(-2a^n)=2$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $f_n(a)-3f_{n+1}(a^n)+f_{n+1}(|a|^n-a^n)=3$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f_{n+1}(a^n)=0$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $f_{n+1}(|a|^n-a^n)=2$(채점기준 4점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $f_n(a)-3f_{n+1}(a^n)+f_{n+1}(|a|^n-a^n)=3$(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
