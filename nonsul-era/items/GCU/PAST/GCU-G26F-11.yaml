  misconceptions:
  - id: MC-ALG-8717
    outcome_code: '71'
    wrong_work: |
      음수의 짝수제곱근도 실수 1개가 있다고 보거나, $n+1$의 홀짝을 $n$과 같게 처리
    detect_cue: |
      $f_{n+1}(a^n)$을 $1$로 계산하는 등 경우표가 해설과 다름
    feedback: |
      $n$이 짝수일 때 양수의 실수 $n$제곱근은 2개, $0$은 1개, 음수는 0개입니다. $n$이 홀수면 항상 1개입니다.
    remedy: [RL-1]

