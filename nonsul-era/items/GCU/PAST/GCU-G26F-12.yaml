intent: |
  연속함수의 성질을 이해하고, 이를 활용하여 주어진 $k$의 값을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). $g(x)=f(x)f(k-x)$의 불연속 후보는 $x=0$, $x=k$뿐이므로 $k=0$, $k>0$, $k<0$으로 나누어 좌극한과 우극한을 비교한다.
key_idea: |
  $x=0$에서 $f(0^-)=-5$, $f(0^+)=-4$이므로 $f(k)=0$이어야 하거나($k=4$ 또는 $k=-5$), $k=0$이면 두 불연속이 상쇄된다.
stuck: |
  $k=0$일 때 두 함수의 불연속점이 겹쳐 곱의 극한이 존재하는 경우를 놓친다.
