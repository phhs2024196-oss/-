stimuli: []

stem: |
  실수 전체의 집합에서 정의된 함수 $f(x)$가
  $$f(x)=\begin{cases}(x+5)(x-1) & (x<0)\\ x-4 & (x\ge0)\end{cases}$$
  일 때, 모든 실수 $a$에 대하여 극한값 $\displaystyle\lim_{x\to a}f(x)f(k-x)$가 존재하도록 하는 실수 $k$의 값을 모두 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    실수 $k$의 값을 모두 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: 'k=-5, k=0, k=4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $x=0$: $-5f(k)$ vs $-4f(k)$ (단 $k\ne0$) → $f(k)=0$.
    steps:
    - id: 1a
      content: |
        $k>0$: $k=4$; $k<0$: $(k+5)(k-1)=0$에서 $k=-5$; $k=0$: 양쪽 극한 모두 $20$.
      criteria: ['1.M1', '1.M2', '1.M3', '1.A1']
    hint_ladder:
    - '$g(x)=f(x)f(k-x)$가 불연속일 수 있는 점은 어디인가?'
    - '$k=0$, $k>0$, $k<0$으로 나누어 보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 87 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        구간을 나눠서 정리하면 함수 $f(x)$와 $f(k-x)$는 다음과 같다.
        $f(x)=\begin{cases}(x+5)(x-1) & (x<0)\\ -4 & (x=0)\\ x-4 & (x>0)\end{cases}$, $f(k-x)=\begin{cases}k-4-x & (x<k)\\ -4 & (x=k)\\ (k-x+5)(k-x-1) & (x>k)\end{cases}$
        $g(x)=f(x)f(k-x)$라 하자.
        (1) $k=0$인 경우
        $g(x)=\begin{cases}-(x+4)(x+5)(x-1) & (x<0)\\ 16 & (x=0)\\ (x-4)(x-5)(x+1) & (x>0)\end{cases}$
        이다. $a\ne0$일 때, $g(x)$의 좌극한과 우극한은 연속함수의 성질에 의해서 같다.
        $a=0$일 때, $\displaystyle\lim_{x\to0+}g(x)=\lim_{x\to0-}g(x)=20$이므로 좌극한과 우극한이 같다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (2) $k>0$인 경우
        $g(x)=\begin{cases}(x+5)(x-1)(k-x-4) & (x<0)\\ -4(k-4) & (x=0)\\ (x-4)(k-x-4) & (0<x<k)\\ -4(k-4) & (x=k)\\ (x-4)(k-x+5)(k-x-1) & (x>k)\end{cases}$
        $a\ne0$, $a\ne k$일 때, $g(x)$의 좌극한과 우극한은 연속함수의 성질에 의해서 같다.
        $a=0$과 $a=k$에서 극한값 $\displaystyle\lim_{x\to a}f(x)f(k-x)$가 존재하도록 하는 실수 $k=4$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        (3) $k<0$인 경우
        $g(x)=\begin{cases}(x+5)(x-1)(k-x-4) & (x<k)\\ -4(k+5)(k-1) & (x=k)\\ (x+5)(x-1)(k-x+5)(k-x-1) & (k<x<0)\\ -4(k+5)(k-1) & (x=0)\\ (x-4)(k-x+5)(k-x-1) & (x>0)\end{cases}$
        $a\ne0$, $a\ne k$일 때, $g(x)$의 좌극한과 우극한은 연속함수의 성질에 의해서 같다.
        $a=0$과 $a=k$에서 극한값 $\displaystyle\lim_{x\to a}f(x)f(k-x)$가 존재하도록 하는 실수 $k=-5$이다.
      criteria: ['1.M3']
    - id: 1b-4
      content: |
        따라서 구하는 $k$의 값은 $-5$, $0$, $4$이다.
      criteria: ['1.A1']
