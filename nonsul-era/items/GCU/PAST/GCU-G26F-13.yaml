stem: |
  다항함수 $f(x)$의 한 부정적분을 $F(x)$라 하자. 모든 실수 $x$에 대하여
  $$F(x)=x^2f(x)-2x^4+ax+1$$
  가 성립할 때, $F\left(\dfrac{2}{af'(0)}\right)$의 값을 구하는 과정을 서술하시오. (단, $a$는 상수이다.)

subparts:
- id: '1'
  stem: |
    $F\left(\dfrac{2}{af'(0)}\right)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '517', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=2x^2+\frac23x+\frac13$, $a=\frac13$, $f'(0)=\frac23$.
    steps:
    - id: 1a
      content: |
        $F(9)=\frac23\cdot729+\frac13\cdot81+\frac13\cdot9+1=517$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$f$가 $n$차이면 $F$와 $x^2f(x)$의 차수는 각각?'
    - '$F(0)$의 값은?'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 88 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 조건에 의해 $f(x)$는 최고차항의 계수가 $2$인 이차함수이다.
        $f(x)=2x^2+bx+c$라 하자.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\int f(x)\,dx=\frac23x^3+\frac b2x^2+cx+C$
        인데, $F(0)=1$이므로 $F(x)=\dfrac23x^3+\dfrac b2x^2+cx+1$이 된다. 또한
        $x^2f(x)-2x^4+ax+1=bx^3+cx^2+ax+1$
        이므로 $a=c=\dfrac13$, $b=\dfrac23$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 $F\left(\dfrac{2}{af'(0)}\right)=F\left(\dfrac{2}{ab}\right)=F(9)=517$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $f(x)$는 최고차항의 계수가 $2$인 $2$차 다항식 (또는 $f(x)=2x^2+\cdots$)(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $a=\dfrac13$(채점기준 4점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $F\left(\dfrac{2}{af'(0)}\right)=517$(채점기준 2점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
