intent: |
  로그함수를 이해하고, 이를 그래프로 표현하여 주어진 값을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). $\alpha=\log_at+1$, $\beta=t-\frac1a$로 두면 $\alpha^2+\beta^2=\frac{100}{9}$, $\alpha\beta=\frac{16}{3}$이므로 이차방정식으로 두 경우를 얻고 정수 조건으로 고른다.
key_idea: |
  $\mathrm{A}\left(\frac1a,2\right)$, $\overline{\mathrm{BC}}=2\log_at+2=2\alpha$, 높이 $\beta=t-\frac1a$.
stuck: |
  $\overline{\mathrm{AB}}$와 넓이 조건을 대칭식 $\alpha+\beta$, $\alpha\beta$로 바꾸는 발상.
