stem: |
  상수 $a\,(a>1)$와 양수 $t\,(t>1)$에 대하여 곡선 $y=\log_ax+3$과 곡선 $y=\log_{\frac1a}x+1$이 만나는 점을 $\mathrm{A}$라 하고, 직선 $x=t$와 두 곡선이 만나는 점을 각각 $\mathrm{B}$, $\mathrm{C}$라 하자. $\overline{\mathrm{AB}}=\dfrac{10}{3}$이고 삼각형 $\mathrm{ABC}$의 넓이가 $\dfrac{16}{3}$일 때, $a$와 $t$의 값을 모두 구하는 과정을 서술하시오. (단, 점 $\mathrm{B}$와 점 $\mathrm{C}$의 $y$좌표는 정수이다.)

subparts:
- id: '1'
  stem: |
    $a$와 $t$의 값을 모두 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '$a=3$, $t=3$', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\alpha+\beta=\frac{14}{3}$, $\alpha\beta=\frac{16}{3}$ → $\{\alpha,\beta\}=\{2,\frac83\}$.
    steps:
    - id: 1a
      content: |
        $\alpha=2$: $a=t$, $a-\frac1a=\frac83$ → $a=t=3$; $\alpha=\frac83$: $\log_at=\frac53$로 $\mathrm{B}$의 $y$좌표가 정수가 아님.
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '점 $\mathrm{A}$의 좌표를 먼저 구하자.'
    - '$\alpha=\log_at+1$, $\beta=t-\frac1a$로 두면 두 조건은?'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 89 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\log_ax+3=\log_{\frac1a}x+1$에서 $2\log_ax=-2$이므로 $\mathrm{A}$의 좌표는 $\mathrm{A}\left(\dfrac1a,2\right)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        두 점 $\mathrm{B}$, $\mathrm{C}$의 좌표는 각각 $\mathrm{B}(t,\log_at+3)$, $\mathrm{C}\left(t,\log_{\frac1a}t+1\right)$이다.
        또한, $\overline{\mathrm{AB}}=\dfrac{10}{3}$이므로 $\left(t-\dfrac1a\right)^2+(\log_at+1)^2=\dfrac{100}{9}$이다.
        삼각형 $\mathrm{ABC}$의 넓이가 $\dfrac{16}{3}$이므로 $(2\log_at+2)\times\left(t-\dfrac1a\right)\times\dfrac12=\dfrac{16}{3}$이다.
        따라서 $\alpha=\log_at+1$, $\beta=t-\dfrac1a$이라 하면, $\alpha^2+\beta^2=\dfrac{100}{9}$, $\alpha\beta=\dfrac{16}{3}$이므로 $\alpha+\beta=\dfrac{14}{3}$이고,
        $\alpha$, $\beta$는 이차방정식의 $3x^2-14x+16=(3x-8)(x-2)=0$의 두 근이다.
        (1) $\alpha=2$, $\beta=\dfrac83$인 경우, $\log_at=1$이므로 $a=t$이고
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $a-\dfrac1a=\dfrac83$이다.
        즉, $3a^2-8a-3=(3a+1)(a-3)=0$이므로
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        조건을 만족하는 $a=t=3$이다.
        (2) $\alpha=\dfrac83$, $\beta=2$인 경우, $\log_at=\dfrac53$이므로 점 $\mathrm{B}$의 $y$좌표가 정수가 아니다.
        따라서 조건을 만족하는 $a=t=3$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $\mathrm{A}\left(\dfrac1a,2\right)$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\log_at=1$ (또는 $a=t$)(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $t-\dfrac1a=\dfrac83$ (또는 $a-\dfrac1a=\dfrac83$)(또는 $3a^2-8a-3=0$)(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        $t=3$, $a=3$(채점기준 2점).
      depends_on: [1.M1, 1.A1, 1.A2]
      steps: [1b-4]
    deductions: []
