stimuli: []

stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$4f(x)=-2x^3+6x+\lim_{h\to0}\frac1h\int_1^{1+h}\{f(t)\}^2\,dt$$
  를 만족시킬 때, $f(x)$의 극댓값과 극솟값을 모두 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $f(x)$의 극댓값과 극솟값을 모두 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '극댓값 $2$, 극솟값 $0$', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $4f(1)=4+\{f(1)\}^2$ → $f(1)=2$, $f(x)=\frac12(-x^3+3x+2)$.
    steps:
    - id: 1a
      content: |
        $f'(x)=\frac32(1+x)(1-x)$, 극댓값 $f(1)=2$, 극솟값 $f(-1)=0$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$\lim_{h\to0}\frac1h\int_1^{1+h}g(t)\,dt$는 무엇과 같은가?'
    - '$x=1$을 대입해 보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 90 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $4f(x)=-2x^3+6x+\displaystyle\lim_{h\to0}\frac1h\int_1^{1+h}\{f(t)\}^2dt=-2x^3+6x+\{f(1)\}^2$
        $4f(1)=-2+6+\{f(1)\}^2$이고, $\{f(1)-2\}^2=0$이다.
        따라서 $4f(x)=-2x^3+6x+4$, $f(x)=\dfrac12(-x^3+3x+2)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f'(x)=\dfrac12(-3x^2+3)=\dfrac32(1+x)(1-x)$이므로 $f(x)$는 $x=\pm1$에서 극값을 갖는다.
        [증감표: $x<-1$에서 $f'(x)<0$(감소), $-1<x<1$에서 $f'(x)>0$(증가), $x>1$에서 $f'(x)<0$(감소)]
        $f(x)$는 $x=1$일 때, 극댓값 $f(1)=\dfrac12(-1+3+2)=2$를 갖고
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $f(x)$는 $x=-1$일 때, 극솟값 $f(-1)=\dfrac12(1-3+2)=0$을 갖는다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
