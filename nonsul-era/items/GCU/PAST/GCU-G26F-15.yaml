  misconceptions:
  - id: MC-CAL-8718
    outcome_code: '71'
    wrong_work: |
      $h\to0$이면 적분 구간 길이가 $0$이므로 극한을 $0$으로 보아 $f(x)=\frac{-x^3+3x}{2}$
    detect_cue: |
      극댓값 $1$, 극솟값 $-1$
    feedback: |
      $\frac1h$가 곱해져 있으므로 극한은 $0$이 아니라 피적분함수의 값 $\{f(1)\}^2$입니다.
    remedy: [RL-1]

