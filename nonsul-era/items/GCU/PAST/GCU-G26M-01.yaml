  misconceptions:
  - id: MC-ALG-8719
    outcome_code: '71'
    wrong_work: |
      $f_{n+1}(1)$, $f_{n+1}(2)$를 $n+2$의 홀짝으로 계산해 최댓값·최솟값이 달라짐
    detect_cue: |
      $M$, $m$이 $4$, $1$이 아닌 값(예: $m=-1$)
    feedback: |
      $n$, $n+1$, $n+2$는 홀짝이 번갈아 바뀝니다. 각 함수의 첨자에 맞춰 개수를 따로 세세요.
    remedy: [RL-1]

