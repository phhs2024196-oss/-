    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        $m=1$(채점기준 5점).
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $2<k<16$(채점기준 3점).
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $13$(채점기준 2점).
      depends_on: [1.M1, 1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
