  거듭제곱근의 뜻을 알고 로그의 진수에 미지수를 포함하는 부등식을 해결할 수 있는지 확인한다(문항카드 출제 의도 원문). $a$의 부호와 $n$의 홀짝으로 6가지 경우를 나누어 $M=4$, $m=1$을 얻고, $y=\log_4(\pm x+k)+1$의 교점을 꼭짓점으로 하는 정삼각형의 한 변 길이로 부등식을 세운다.
