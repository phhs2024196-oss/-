stimuli: []

stem: |
  $2$ 이상의 자연수 $n$에 대하여 실수 $a$의 $n$제곱근 중 실수인 것의 개수를 $f_n(a)$라 할 때,
  $$f_n\left((-a)^n\right)+(-1)^n\times f_{n+1}\left((-a)^{n+1}\right)+f_{n+1}\left(f_{n+2}(a^n)\right)$$
  의 최댓값을 $M$, 최솟값을 $m$이라 하자. $2$ 이상의 자연수 $k$에 대하여 두 함수 $y=\log_M(x+k)+m$, $y=\log_M(-x+k)+m$의 그래프의 교점을 $\mathrm{A}$라 하고, 삼각형 $\mathrm{ABC}$가 정삼각형이 되도록 하는 $x$축 위의 서로 다른 두 점을 $\mathrm{B}$, $\mathrm{C}$라 할 때, $\sqrt3<\overline{\mathrm{BC}}<2\sqrt3$을 만족시키는 $k$의 개수를 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $k$의 개수를 구하는 과정을 서술하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '13', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      6가지 경우의 값 $1,4,2,3,1,4$ → $M=4$, $m=1$; $\mathrm{A}(0,1+\log_4k)$.
    steps:
    - id: 1a
      content: |
        $\sqrt3<\frac{2}{\sqrt3}(1+\log_4k)<2\sqrt3$ → $2<k<16$ → $13$개
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '$a>0$, $a=0$, $a<0$과 $n$의 홀짝으로 나누어 보자.'
    - '두 로그함수의 그래프는 $y$축에 대하여 대칭이다.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 91 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        실수 $a$와 자연수 $n$을 다음과 같이 경우를 나누어 계산한다.
        (1) $a>0$이고 $n$이 홀수일 때, $(-a)^n<0$, $(-a)^{n+1}>0$, $a^n>0$이므로 $f_n((-a)^n)=1$, $f_{n+1}((-a)^{n+1})=2$, $f_{n+2}(a^n)=1$이다. 따라서 (식)$=1$
        (2) $a>0$이고 $n$이 짝수일 때, $(-a)^n>0$, $(-a)^{n+1}<0$, $a^n>0$이므로 $f_n((-a)^n)=2$, $f_{n+1}((-a)^{n+1})=1$, $f_{n+2}(a^n)=2$이다. 따라서 (식)$=4$
        (3) $a=0$이고 $n$이 홀수일 때, $f_n(0)=f_{n+1}(0)=f_{n+2}(0)=1$이므로 (식)$=2$
        (4) $a=0$이고 $n$이 짝수일 때, $f_n(0)=f_{n+1}(0)=f_{n+2}(0)=1$이므로 (식)$=3$
        (5) $a<0$이고 $n$이 홀수일 때, $(-a)^n>0$, $(-a)^{n+1}>0$, $a^n<0$이므로 $f_n((-a)^n)=1$, $f_{n+1}((-a)^{n+1})=2$, $f_{n+2}(a^n)=1$이다. 따라서 (식)$=1$
        (6) $a<0$이고 $n$이 짝수일 때, $(-a)^n>0$, $(-a)^{n+1}>0$, $a^n>0$이므로 $f_n((-a)^n)=2$, $f_{n+1}((-a)^{n+1})=1$, $f_{n+2}(a^n)=2$이다. 따라서 (식)$=4$
        따라서 최댓값 $M=4$,
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        최솟값 $m=1$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        두 함수 $y=\log_4(x+k)+1$, $y=\log_4(-x+k)+1$의 그래프의 교점 $\mathrm{A}(0,1+\log_4k)$이므로
        $\overline{\mathrm{BC}}=\dfrac{2}{\sqrt3}(1+\log_4k)$이다. 따라서 부등식 $\sqrt3<\overline{\mathrm{BC}}=\dfrac{2}{\sqrt3}(\log_4k+1)<2\sqrt3$을 풀면
        $2<k<16$이므로
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $k$의 개수는 $13$개이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
