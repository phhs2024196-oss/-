stem: |
  등비수열 $\{a_n\}$과 수열 $\{b_n\}$이 다음 조건을 만족시킨다.
  (가) $0<a_1<\dfrac{\pi}{2}$, $0<a_2<\dfrac{\pi}{2}$이고 $\tan a_1=\dfrac34$, $\tan a_2=\dfrac13$이다.
  (나) $\tan b_1=\dfrac14$
  (다) 모든 자연수 $n$에 대하여 $0<b_n<\dfrac{\pi}{2}$이고
  $$(1-\tan a_n\tan b_n)\tan b_{n+1}=\tan a_n+\tan b_n$$
  이다.
  $\displaystyle\lim_{n\to\infty}b_n=b$라 할 때, $\tan b$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\tan b$의 값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\frac{103}{4}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\tan(a_1-a_2)=\frac13=\tan a_2$ → $a_1=2a_2$; $b_{n+1}-b_n=a_n$.
    steps:
    - id: 1a
      content: |
        $b=b_1+\frac{a_1}{1-\frac12}=b_1+2a_1$, $\tan2a_1=\frac{24}{7}$, $\tan b=\frac{103}{4}$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '$\tan(a_1-a_2)$를 계산해 보자.'
    - '조건 (다)를 $\tan b_{n+1}$에 대해 정리하면 어떤 덧셈정리 꼴인가?'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 92 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각함수 덧셈정리에 의하여 $\tan(a_1-a_2)=\dfrac{\tan a_1-\tan a_2}{1+\tan a_1\tan a_2}=\dfrac{\frac34-\frac13}{1+\frac34\times\frac13}=\dfrac13=\tan a_2$
        이다. 또한, $-\dfrac{\pi}{2}<a_1-a_2<\dfrac{\pi}{2}$, $0<a_2<\dfrac{\pi}{2}$이므로 탄젠트 함수의 성질에 의해 $a_1=2a_2$이 성립하고 수열 $\{a_n\}$이 등비수열이므로 $a_n=a_1\left(\dfrac12\right)^{n-1}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        조건 (다)와 삼각함수 덧셈정리에 의하여 $\dfrac{\tan b_{n+1}-\tan b_n}{1+\tan b_{n+1}\tan b_n}=\tan(b_{n+1}-b_n)=\tan a_n$
        이다. $-\dfrac{\pi}{2}<b_{n+1}-b_n<\dfrac{\pi}{2}$이므로 모든 자연수 $n$에 대하여 $b_{n+1}-b_n=a_n$이 성립한다. 따라서
        $\displaystyle\sum_{k=1}^{n}a_k=\sum_{k=1}^{n}(b_{k+1}-b_k)=(b_2-b_1)+(b_3-b_2)+\cdots+(b_{n+1}-b_n)=-b_1+b_{n+1}$
        이므로 $\dfrac{a_1}{1-\frac12}=\displaystyle\sum_{k=1}^{\infty}a_k=-b_1+\lim_{n\to\infty}b_{n+1}=-b_1+b$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        따라서 $b=b_1+2a_1$이다. 삼각함수의 덧셈정리에 의하여 $\tan2a_1=\dfrac{24}{7}$이고,
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $\tan b=\tan(b_1+2a_1)=\dfrac{\tan b_1+\tan2a_1}{1-\tan b_1\tan2a_1}=\dfrac{\frac14+\frac{24}{7}}{1-\frac14\times\frac{24}{7}}=\dfrac{103}{4}$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $a_n=a_1\left(\dfrac12\right)^{n-1}$(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 8
      evidence: |
        $b_{n+1}-b_n=a_n$ 혹은 $b_n=b_1+\displaystyle\sum_{k=1}^{n-1}a_k$(채점기준 8점).
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $\tan2a_1=\dfrac{24}{7}$(채점기준 4점).
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $\tan b=\dfrac{103}{4}$(채점기준 4점).
      depends_on: [1.M1, 1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
