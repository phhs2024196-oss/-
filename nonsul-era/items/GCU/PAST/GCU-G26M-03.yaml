stimuli: []

stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$가 실수 $a$에 대하여 다음 조건을 만족시킬 때, $f'(a)$와 $\displaystyle\int_0^{2a}f(x)\,dx$의 값을 모두 구하는 과정을 서술하시오. (단, $a>1$)
  (가) 모든 실수 $x$에 대하여 $f(x)+f(2a-x)=2a^2$이다.
  (나) $\displaystyle\int_0^{2a}\{f(x)-x\}\,dx=36$
  (다) $\displaystyle\int_{-1}^{1}(x+5)^2f(x+a)\,dx=440$

subparts:
- id: '1'
  stem: |
    $f'(a)$와 $\displaystyle\int_0^{2a}f(x)\,dx$의 값을 모두 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '$f''(a)=-3$, $\int_0^{2a}f(x)\,dx=54$', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=(x-a)^3+b(x-a)+a^2$, $2a^3-2a^2=36$ → $a=3$.
    steps:
    - id: 1a
      content: |
        (다): $\frac{20b}{3}+460=440$ → $b=-3$; $f'(3)=b=-3$, $\int_0^6f\,dx=54$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$g(x)=f(x+a)-a^2$로 두면 (가)는 무엇을 뜻하는가?'
    - '$(x+5)^2=x^2+10x+25$에서 기함수와 곱해지는 항을 나누어 보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 93 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x+a)+f(2a-(x+a))=f(x+a)+f(a-x)=2a^2$이므로
        $g(x)=f(x+a)-a^2$라 하면 $g(x)+g(-x)=f(x+a)-a^2+f(-x+a)-a^2=0$이다.
        따라서 곡선 $y=g(x)$는 원점 대칭이다. $g(x)=x^3+bx$라 하자.
        $f(x)=g(x-a)+a^2$이므로 곡선 $y=f(x)$는 곡선 $y=g(x)$를 $x$축의 양의 방향으로 $a$만큼, $y$축의 양의 방향으로 $a^2$만큼 평행이동한 곡선이다. 따라서 곡선 $y=f(x)$는 점 $(a,a^2)$에 대칭이다.
        $f(x)=g(x-a)+a^2=(x-a)^3+b(x-a)+a^2$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\int_0^{2a}f(x)\,dx=\int_0^{2a}\{(x-a)^3+b(x-a)+a^2\}\,dx=\int_{-a}^{a}(t^3+bt+a^2)\,dt=2a^3$ ($t=x-a$로 치환)
        (나) $\displaystyle36=\int_0^{2a}\{f(x)-x\}\,dx=\int_0^{2a}f(x)\,dx-\int_0^{2a}x\,dx=2a^3-2a^2$
        $a^3-a^2-18=(a-3)(a^2+2a+6)=0$이므로 $a=3$. 따라서 $f(x)=(x-3)^3+b(x-3)+9$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\displaystyle\int_{-1}^{1}(x+5)^2f(x+a)\,dx=\int_{-1}^{1}(x+5)^2f(x+3)\,dx=\int_{-1}^{1}(x+5)^2(x^3+bx+9)\,dx$
        $\displaystyle=\int_{-1}^{1}(x+5)^2(x^3+bx)\,dx+9\int_{-1}^{1}(x+5)^2\,dx=20\int_0^1x(x^3+bx)\,dx+18\int_0^1(x^2+25)\,dx$ ($\because$ $x^3+bx$는 기함수)
        $\displaystyle=20\left(\frac15+\frac b3\right)+18\left(\frac13+25\right)=\frac{20b}{3}+460$
        $\dfrac{20b}{3}+460=440$에서 $b=-3$이므로 $f(x)=(x-3)^3-3(x-3)+9$이다.
        $a=3$,
      criteria: ['1.A3']
    - id: 1b-4
      content: |
        $f'(a)=f'(3)=b=-3$, $\displaystyle\int_0^{2a}f(x)\,dx=2a^3=54$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f(x)=g(x-a)+a^2=(x-a)^3+b(x-a)+a^2$ (또는 $f(x)=(x-a)^3+bx+c$)(또는 $y=f(x)$의 그래프는 점 $(a,a^2)$에 대칭)(또는 $g(x)=f(x+a)-a^2$는 원점대칭)(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: |
        $\displaystyle\int_0^{2a}f(x)\,dx=2a^3$ (또는 $\displaystyle\int_0^{2a}f(x)\,dx=54$)(또는 $a=3$)(채점기준 7점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\displaystyle\int_0^{2a}f(x)\,dx=54$(채점기준 3점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 7
      evidence: |
        $f'(a)=-3$(채점기준 7점).
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
