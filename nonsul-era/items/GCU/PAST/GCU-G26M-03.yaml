intent: |
  합성함수의 미분법과 치환적분법을 활용하여 미분계수와 정적분을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). 조건 (가)에서 곡선이 점 $(a,a^2)$에 대해 대칭임을 보이고, $f(x)=(x-a)^3+b(x-a)+a^2$로 두어 (나)에서 $a$, (다)에서 $b$를 구한다.
key_idea: |
  $g(x)=f(x+a)-a^2$는 기함수 → $\int_0^{2a}f(x)\,dx=2a^3$.
stuck: |
