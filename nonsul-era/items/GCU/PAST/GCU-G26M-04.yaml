stimuli: []

stem: |
  실수 전체의 집합에서 미분가능한 함수 $f(x)$가 두 실수 $a$, $b$와 모든 실수 $x$에 대하여
  $$f(x)+\frac{2}{\pi}\sin\frac{\pi f(x)}{2}=\frac{ae^x-b}{e^x+1}$$
  를 만족시킨다. 첫째항이 $4a^3-13a^2+12a-2$이고 공비가 $\dfrac13b^3-\dfrac32b^2+2b$인 모든 등비수열 $\{a_n\}$에 대하여 급수 $\displaystyle\sum_{n=1}^{\infty}a_n$의 최댓값을 구하는 과정을 서술하시오. (단, $a\ge0$, $b\ge0$)

subparts:
- id: '1'
  stem: |
    급수 $\displaystyle\sum_{n=1}^{\infty}a_n$의 최댓값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '12', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $0\le a\le2$, $0\le b\le2$; 첫째항 최댓값 $2$ ($a=2$), 공비 범위 $\left[0,\frac56\right]$.
    steps:
    - id: 1a
      content: |
        $\frac{2}{1-\frac56}=12$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '$g(x)=x+\frac{2}{\pi}\sin\frac{\pi}{2}x$의 도함수가 $0$이 되는 점은?'
    - '$h(x)=\frac{ae^x-b}{e^x+1}$의 치역은?'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 94 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g(x)=x+\dfrac{2}{\pi}\sin\dfrac{\pi}{2}x$라 하자. 그러면 $g'(x)=1+\cos\dfrac{\pi}{2}x\ge0$이다. 정수 $k$에 대하여 $x=4k+2$에서만 $g'(x)=0$이므로 $g(x)$는 열린구간 $(4k-2,4k+2)$에서 증가한다.
        또한 최대·최소 정리에 의해 연속함수 $g(x)$는 닫힌구간 $[4k-2,4k+2]$에서 최댓값과 최솟값을 가져야 하는데, 열린구간 $(4k-2,4k+2)$에 $g(x)$의 극점이 존재하지 않기 때문에 닫힌구간 $[4k-2,4k+2]$에서 $g(x)$의 최댓값과 최솟값은 각각 $g(4k+2)=(4k+2)$와 $g(4k-2)=(4k-2)$이다. 즉, $g(x)$는 닫힌구간 $[4k-2,4k+2]$에서 증가한다. 따라서 $g(x)$는 실수 전체의 집합에서 증가하고, $g(x)$의 역함수가 존재한다. $h(x)=\dfrac{ae^x-b}{e^x+1}$라 하자.
        ① 만약 $a+b\ne0$이면, $h'(x)=\dfrac{(a+b)e^x}{(e^x+1)^2}>0$, $\displaystyle\lim_{x\to\infty}h(x)=a$, $\displaystyle\lim_{x\to-\infty}h(x)=-b$이다. 따라서 모든 실수 $x$에 대해 함수 $h(x)$는 $-b<h(x)<a$를 만족시킨다.
        함수 $f(x)$가 실수 전체의 집합에서 미분가능하므로 $g(f(x))=h(x)$의 양변을 미분하여 $g'(f(x))f'(x)=h'(x)$를 얻을 수 있다. 그런데 모든 실수 $x$에 대해 $h'(x)>0$이므로 모든 실수 $x$에 대해 $g'(f(x))\ne0$이다. 따라서 모든 실수 $x$와 정수 $k$에 대해 $f(x)\ne4k+2$이다.
        $f(x)=g^{-1}(h(x))$이므로 모든 실수 $x$와 정수 $k$에 대해 $h(x)\ne g(4k+2)=4k+2$이고, 따라서 모든 실수 $x$에 대해 함수 $h(x)$는 $-2<h(x)<2$를 만족시키고, $a\le2$, $b\le2$가 성립한다.
        ② 만약 $a=0$이고, $b=0$이면 모든 실수 $x$에 대해 $f(x)=0$이므로 함수 $f(x)$가 실수 전체의 집합에서 미분가능하다.
        따라서 $0\le a\le2$와
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $0\le b\le2$가 성립한다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        이때, 함수 $y=4x^3-13x^2+12x-2$는 닫힌구간 $[0,2]$에서 최댓값 $2$를 가지고, 함수 $y=\dfrac13x^3-\dfrac32x^2+2x$는 닫힌구간 $[0,2]$에서 최솟값 $0$, 최댓값 $\dfrac56$을 가지므로,
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $a_1=2$이고, 공비가 $\dfrac56$일 때, $\displaystyle\sum_{n=1}^{\infty}a_n$은 최댓값 $12$를 갖는다.
      criteria: ['1.A2']
