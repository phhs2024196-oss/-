intent: |
  미분을 활용하여 함수의 그래프의 개형을 추론하고 등비급수의 합을 구할 수 있는지 확인한다(문항카드 출제 의도 원문). $g(x)=x+\frac{2}{\pi}\sin\frac{\pi}{2}x$가 증가함수이고 $x=4k+2$에서 $g'=0$이므로, $f=g^{-1}\circ h$가 미분가능하려면 $h(x)=\frac{ae^x-b}{e^x+1}$의 치역이 $4k+2$를 피해야 한다.
key_idea: |
  $-b<h(x)<a$이고 $h(x)\ne\pm2$ → $0\le a\le2$, $0\le b\le2$.
stuck: |
  $f(x)\ne4k+2$ 조건을 $h$의 치역 조건으로 옮기는 단계.
