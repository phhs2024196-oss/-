stimuli: []

stem: |
  첫째항이 $0$인 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
  $$a_{n+1}=\sum_{k=1}^{n}(-1)^{n-k}\times k\times(n-k+1)^2$$
  이다. $\displaystyle\sum_{k=1}^{m}a_k=-78$일 때, 자연수 $m$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    자연수 $m$의 값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '25', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $a_{2n}=n^2$, $a_{2n+1}=-n(n+1)$.
    steps:
    - id: 1a
      content: |
        $\sum_{k=1}^{2n}a_k=\frac{n(n+1)}{2}>0$, $\sum_{k=1}^{2n-1}a_k=\frac n2(1-n)=-78$ → $n=13$, $m=25$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - '$a_2, a_3, a_4, \ldots$를 몇 개 계산해 규칙을 찾아보자.'
    - '홀수 번째 항과 짝수 번째 항을 나누어 생각하자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 95 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        임의의 자연수 $n$에 대하여
        $a_{2n+1}=-(2n)^2+2(2n-1)^2-3(2n-2)^2+\cdots-(2n-1)2^2+(2n)$
        $=a_{2n}+\{-(2n)^2+(2n-1)^2-(2n-2)^2+(2n-3)^2-\cdots-2^2+1^2\}$
        $=a_{2n}+\{(-2n+(2n-1))(2n+(2n-1))+\cdots+(-2+1)(2+1)\}$
        $=n^2-\{2n+(2n-1)+\cdots+2+1\}=n^2-\dfrac{2n(2n+1)}{2}=-n(n+1)$
        [보고서 해설의 중간 전개 일부를 줄여 옮김]
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        자연수 $n$이 짝수일 때
        $a_{2n}=(2n-1)^2-2(2n-2)^2+\cdots-n^3+\cdots-(2n-2)2^2+(2n-1)$
        $=\{(2n-1)-2(2n-2)+\cdots+(n-1)(n+1)\}(2n)-n^3$
        $=\{-1^2+2^2-3^2+4^2+\cdots-(n-1)^2+n^2\}(2n)-n^3$
        $=\{1+2+3+4+\cdots+(n-1)+n\}(2n)-n^3=\dfrac{n(n+1)(2n)}{2}-n^3=n^2$
        같은 방법으로, 자연수 $n$이 홀수일 때
        $a_{2n}=(2n-1)^2-2(2n-2)^2+\cdots+n^3-\cdots-(2n-2)2^2+(2n-1)$
        $=-[1+2+3+4+\cdots+n-1](2n)+n^3=-\dfrac{(n-1)(n)(2n)}{2}+n^3=n^2$
        따라서 임의의 자연수 $n$에 대하여 $a_{2n}=n^2$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        결국, 자연수 $n$에 대하여 $a_{2n}=n^2$, $a_{2n+1}=-n(n+1)$이다.
        $\displaystyle\sum_{k=1}^{2n}a_k=\sum_{k=1}^{n}a_{2k-1}+\sum_{k=1}^{n}a_{2k}=\sum_{k=1}^{n}(-k^2+k)+\sum_{k=1}^{n}k^2=\sum_{k=1}^{n}k=\frac{n(n+1)}{2}>0$
        $\displaystyle\sum_{k=1}^{2n-1}a_k=\left(\sum_{k=1}^{n}a_{2k-1}\right)+\left(\sum_{k=1}^{n}a_{2k}\right)-a_{2n}=\sum_{k=1}^{n}k-n^2=\frac12n(n+1)-n^2=\frac n2(1-n)<0$
        이고, 주어진 조건이 $\displaystyle\sum_{k=1}^{m}a_k=-78<0$이므로 $m$은 홀수이고 $m=25$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        임의의 자연수 $m$에 대하여 $a_{2m+1}=-m(m+1)$(채점기준 5점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 8
      evidence: |
        짝수 $m$에 대해 $a_{2m}=m^2$ (또는 $a_{2m}+a_{2m+1}=-m$)(또는 $a_{2m-1}+a_{2m}=m$)(채점기준 4.5점) + 홀수 $n$에 대해 $a_{2n}=n^2$ (또는 $a_{2n}+a_{2n+1}=-n$)(또는 $a_{2n-1}+a_{2n}=n$)(채점기준 3.5점) — 소수점 배점이라 두 항목을 합산(8점).
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: |
        구하는 조건을 만족하는 자연수 $m$의 값은 $m=25$(채점기준 7점).
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
