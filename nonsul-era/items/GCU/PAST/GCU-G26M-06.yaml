      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        변곡점의 $x$좌표는 $x=0$ 또는 $x^2-6x+6=0$을 만족한다(채점기준 3.5점) + $-\dfrac{108}{e^6}$(채점기준 6.5점) — 소수점 배점이라 두 항목을 합산(10점).
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
