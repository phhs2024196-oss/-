stimuli: []

stem: |
  두 상수 $a$, $b$에 대하여 함수 $f(x)$를
  $$f(x)=\frac{x^3+ax^2+bx}{e^x}$$
  라 하자. 실수 $t$에 대하여 함수 $g(x)=|t-f(x)|$가 $x=p$에서 미분가능하지 않은 실수 $p$의 개수를 $h(t)$라 할 때, 함수 $h(t)$는 다음 조건을 만족시킨다.
  (가) 함수 $h(t)$가 $t=k$에서 불연속인 실수 $k$의 값은 $2$개이다.
  (나) $\displaystyle\lim_{t\to0+}h(t)+\lim_{t\to0-}h(t)+h(0)=3$
  집합 $A=\{\alpha\mid\text{점 }(\alpha,f(\alpha))\text{는 곡선 }y=f(x)\text{의 변곡점, }\alpha\text{는 실수}\}$의 서로 다른 두 원소 $\alpha$, $\beta$에 대하여 $f'(\alpha)\times f'(\beta)$의 최솟값을 구하는 과정을 서술하시오. (단, $\displaystyle\lim_{x\to\infty}f(x)=0$)

subparts:
- id: '1'
  stem: |
    $f'(\alpha)\times f'(\beta)$의 최솟값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '-\frac{108}{e^{6}}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $a=b=0$, $f''(x)=\frac{x^3-6x^2+6x}{e^x}$, $\alpha+\beta=6$, $\alpha\beta=6$.
    steps:
    - id: 1a
      content: |
        $f'(\alpha)f'(\beta)=\frac{\alpha^2\beta^2(9-3\alpha-3\beta+\alpha\beta)}{e^{\alpha+\beta}}=-\frac{108}{e^6}$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - '$g(x)=|t-f(x)|$는 직선 $y=t$와 곡선 $y=f(x)$가 어떻게 만나는 점에서 미분가능하지 않은가?'
    - '$f''(x)=0$의 서로 다른 실근의 개수로 경우를 나누어 보자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 96 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g(x)=|t-f(x)|$이므로 미분가능하지 않은 실수 $x$의 값은 직선 $y=t$와 $y=f(x)$가 만나는 점의 $x$좌표 중에 존재한다. $f'(x)=\dfrac{-x^3+(3-a)x^2+(2a-b)x+b}{e^x}$이고 $e^x>0$이므로 $f'(x)=0$의 근은 $-x^3+(3-a)x^2+(2a-b)x+b=0$의 근과 같고, $\displaystyle\lim_{x\to\infty}f(x)=0$이므로 $x$축이 점근선이다.
        조건 (가)에서 불연속인 실수의 값은 2개이므로 $y=f(x)$의 그래프 개형은 다음과 같이 생각할 수 있다.
        (1) $f'(x)=0$의 서로 다른 실근이 3개인 경우, 조건 (가)를 만족하려면 두 개의 극댓값이 같고 극솟값이 $0$이어야 한다. 따라서 $\displaystyle\lim_{t\to0+}h(t)+\lim_{t\to0-}h(t)+h(0)=4+1+1=6$이므로 조건 (나)를 만족시키지 않는다.
        (2) $f'(x)=0$의 서로 다른 실근이 2개인 경우, 조건 (가)를 만족하려면 $f'(x)$는 $x=0$에서 중근을 가져야 한다. 따라서 $\displaystyle\lim_{t\to0+}h(t)+\lim_{t\to0-}h(t)+h(0)=2+1+0=3$이므로 조건 (나)를 만족시킨다.
        (3) $f'(x)=0$의 서로 다른 실근이 1개인 경우, 극댓값만 존재한다. $\displaystyle\lim_{t\to0+}h(t)+\lim_{t\to0-}h(t)+h(0)=2+1+1=4$이므로 조건 (나)를 만족시키지 않는다.
        따라서 $-x^3+(3-a)x^2+(2a-b)x+b=0$은 $x=0$에서 중근을 가져야 하므로 $a=0$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이고 $b=0$이고 $f(x)=\dfrac{x^3}{e^x}$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        변곡점을 구하면 $f''(x)=\dfrac{x^3-6x^2+6x}{e^x}$이므로 $x^2-6x+6=0$의 두 근은 $0$이 아닌 두 변곡점의 $x$좌표이다. 두 변곡점의 $x$좌표를 각각 $\alpha$, $\beta$라 하면 $\alpha+\beta=6$, $\alpha\beta=6$이다.
        따라서 $f'(\alpha)f'(\beta)=\dfrac{\alpha^2(3-\alpha)}{e^\alpha}\dfrac{\beta^2(3-\beta)}{e^\beta}=\dfrac{\alpha^2\beta^2(9-3\alpha-3\beta+\alpha\beta)}{e^{\alpha+\beta}}=-\dfrac{108}{e^6}$이다.
        [그림: 해설에 첨부된 그래프 — $y=|t-f(x)|$ 꼴의 실선 곡선이 $x=-3$, $x=-1$ 부근에서 $x$축에 닿는 꺾인 모양이고, $x>0$에서는 점선 곡선이 $x$축을 점근선으로 완만히 감소] [판독확인: 해설 그림의 곡선이 $f(x)=\frac{x^3}{e^x}$의 개형과 일치하지 않아 보여 그림이 무엇을 나타내는지 불명확함 — 원본 그림 확인 필요]
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
