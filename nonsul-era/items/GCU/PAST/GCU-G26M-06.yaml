  함수의 그래프의 개형을 그리고 방정식에 대한 문제를 해결할 수 있는지 확인한다(문항카드 출제 의도 원문). $h(t)$는 $f(x)=t$의 해 중 $f'(x)\ne0$인 것의 개수이므로 $f'(x)=0$의 근 개수로 개형을 나누어 (가), (나)를 확인하고 $a=b=0$을 얻는다.
