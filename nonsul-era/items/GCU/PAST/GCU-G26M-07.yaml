stem: |
  네 수열 $\{a_n\}$, $\{b_n\}$, $\{c_n\}$, $\{d_n\}$이 모든 자연수 $n$에 대하여
  $$a_{n+1}=\frac{{a_n}^2+2}{2a_n},\quad b_n=\frac{a_n-\sqrt2}{a_n+\sqrt2},\quad c_{n+1}=\frac{c_n+2}{c_n+1},\quad d_n=\frac{c_n-\sqrt2}{c_n+\sqrt2}$$
  을 만족시킨다. $b_8=(b_1)^p$, $d_8=(d_1)^q$, $a_8=c_m$일 때, 자연수 $p$, $q$, $m$의 값을 모두 구하는 과정을 서술하시오. (단, $a_1=c_1=1$)

subparts:
- id: '1'
  stem: |
    자연수 $p$, $q$, $m$의 값을 모두 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '$p=128$, $q=8$, $m=128$', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $b_{n+1}=(b_n)^2$, $d_{n+1}=d_1d_n$, $b_1=d_1=2\sqrt2-3$.
    steps:
    - id: 1a
      content: |
        $b_8=(b_1)^{128}$, $d_8=(d_1)^8$, $a_8=c_m\iff b_8=d_m\iff m=128$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - '$b_{n+1}=\frac{a_{n+1}-\sqrt2}{a_{n+1}+\sqrt2}$에 $a_{n+1}$을 대입해 정리하자.'
    - '$d_1$과 $b_1$을 비교하자.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 97 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $b_1=\dfrac{a_1-\sqrt2}{a_1+\sqrt2}=\dfrac{1-\sqrt2}{1+\sqrt2}=-(1-\sqrt2)^2=2\sqrt2-3$
        $d_1=\dfrac{c_1-\sqrt2}{c_1+\sqrt2}=\dfrac{1-\sqrt2}{1+\sqrt2}=b_1$이다.
        $b_{n+1}=\dfrac{a_{n+1}-\sqrt2}{a_{n+1}+\sqrt2}=\dfrac{\frac{{a_n}^2+2}{2a_n}-\sqrt2}{\frac{{a_n}^2+2}{2a_n}+\sqrt2}=\dfrac{{a_n}^2-2\sqrt2a_n+2}{{a_n}^2+2\sqrt2a_n+2}=\left(\dfrac{a_n-\sqrt2}{a_n+\sqrt2}\right)^2=(b_n)^2$
        이다. 즉, 모든 자연수 $n$에 대하여 $b_{n+1}=(b_n)^2$이 성립한다. 따라서 $b_8=(b_7)^2=(b_6)^4=(b_5)^8=\cdots=(b_1)^{128}$
        이므로 $p=128$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $d_{n+1}=\dfrac{c_{n+1}-\sqrt2}{c_{n+1}+\sqrt2}=\dfrac{\frac{c_n+2}{c_n+1}-\sqrt2}{\frac{c_n+2}{c_n+1}+\sqrt2}=\dfrac{c_n+2-\sqrt2c_n-\sqrt2}{c_n+2+\sqrt2c_n+\sqrt2}=\dfrac{(1-\sqrt2)(c_n-\sqrt2)}{(1+\sqrt2)(c_n+\sqrt2)}=d_1d_n$
        이다. 즉, 모든 자연수 $n$에 대하여 $d_{n+1}=d_1d_n$이 성립한다. 따라서 $d_8=d_1d_7=(d_1)^2d_6=(d_1)^3d_5=\cdots=(d_1)^7d_1=(d_1)^8$
        이므로 $q=8$.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        또한, $d_{2^7}=(d_1)^{2^7}=b_8=\dfrac{a_8-\sqrt2}{a_8+\sqrt2}=1+\dfrac{-2\sqrt2}{a_8+\sqrt2}$이고,
        $d_{2^7}=\dfrac{c_{2^7}-\sqrt2}{c_{2^7}+\sqrt2}=1+\dfrac{-2\sqrt2}{c_{2^7}+\sqrt2}$이므로 $a_8=c_{2^7}$. 따라서 $a_8=c_{128}$이므로 $m=128$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: |
