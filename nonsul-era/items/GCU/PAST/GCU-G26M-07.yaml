      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 7
      evidence: |
        $q=8$(채점기준 7점).
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: |
        $m=128$(채점기준 6점).
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
