stem: |
  함수 $f(x)=x^3+ax^2+bx+c$가 다음 조건을 만족시킬 때, $f(3)$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$, $c$는 상수이다.)
  (가) 모든 실수 $k$에 대하여 방정식 $f(x)=k$의 서로 다른 실근의 개수는 $1$이다.
  (나) 함수 $f'(x)$는 $x=-1$에서 최솟값을 갖는다.
  (다) 곡선 $y=f(x)$ 위의 점 $(-2,-3)$에서의 접선의 방정식을 $y=g(x)$라 할 때, $g(f'(2))=117$이다.

subparts:
- id: '1'
  stem: |
    $f(3)$의 값을 구하는 과정을 서술하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '67', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $a^2-3b\le0$, $a=3$, $b\ge3$; $b(b+24)+2b-3=117$ → $b=4$.
    steps:
    - id: 1a
      content: |
        $f(-2)=-3$ → $c=1$, $f(3)=27+27+12+1=67$
      criteria: ['1.M1', '1.A1']
    hint_ladder:
    - '(가)는 $f$가 증가함수라는 뜻이다.'
    - '$g(x)=f''(-2)(x+2)-3$이다.'
  - id: S1-B
    audience: B
    source_flow: '2026학년도 대학별고사 선행학습 영향평가 자체평가보고서 문항카드 98 5. 문항 해설 · 6. 채점 기준'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에 의해 방정식 $f'(x)=3x^2+2ax+b=0$이 서로 다른 두 실근을 가질 수 없으므로 $a^2-3b\le0$이 성립한다. 조건 (나)에 의해 $-\dfrac{2a}{6}=-1$이므로, $a=3$이고, $b\ge3$이다.
        $f'(2)=12+4a+b=24+b$이고, 곡선 $y=f(x)$ 위의 점 $(-2,-3)$에서의 접선의 방정식은
        $y=f'(-2)(x+2)-3=(12-4a+b)(x+2)-3=bx+2b-3$
        이므로 조건 (다)에 의해 $b(b+24)+2b-3=117$이다. 따라서 $b=4$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        조건 (다)에 의해 $f(-2)=-8+4a-2b+c=-3$
        이므로, $c=1$이다. 따라서 $f(3)=27+9a+3b+c=67$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 9
      evidence: |
        $a=3$(채점기준 4.5점) + $b=4$(채점기준 4.5점) — 소수점 배점이라 두 항목을 합산(9점).
      depends_on: []
      implied_ok: false
