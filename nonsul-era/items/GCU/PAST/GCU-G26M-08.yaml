      points: 6
      evidence: |
        $c=1$(채점기준 4.5점) + $f(3)=67$(채점기준 1.5점) — 소수점 배점이라 두 항목을 합산(6점).
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
