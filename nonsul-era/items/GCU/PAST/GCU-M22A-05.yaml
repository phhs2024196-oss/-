stem: |
  함수 $f(x)=2^{x-1}+k$의 역함수를 $g(x)$라 하자. 함수 $y=g(x)$의 그래프가 점 $(5,2)$을 지날 때, $g(35)$의 값을 구하는 과정을 아래 과정을 참고하여 서술하시오.

  [풀이 과정] $f(x)$의 역함수 $g(x)=$ ( ① ) 이다.
  $g(5)=2$ 이므로, $k=$ ( ② ) 이다.
  따라서, $g(35)=$ ( ③ ) 이다.
