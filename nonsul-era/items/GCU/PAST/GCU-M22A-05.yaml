  지수함수와 로그함수의 역함수 관계 이해(문항카드 출제 의도 원문). 지수함수의 역함수를 로그로 쓰고, 지나는 점으로 상수 $k$를 정한다.
key_idea: |
  $y=2^{x-1}+k\iff x=\log_2(y-k)+1$이므로 $g(x)=\log_2(x-k)+1$; $g(5)=2$에서 $k=3$.
