    빈칸을 채워 $g(35)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '① log_2(x-k)+1  ② 3  ③ 6', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $g(x)=\log_2(x-k)+1$, $\log_2(5-k)=1$에서 $k=3$, $g(35)=\log_232+1=6$.
    steps:
    - id: '1a'
      content: |
        $g(x)=\log_2(x-k)+1$, $k=3$, $g(35)=6$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - '$y=2^{x-1}+k$를 $x$에 대해 푸세요.'
    - '$g(5)=2$는 $f(2)=5$와 같은 뜻입니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '가이드북 모의고사 답안지(수학) 5번 문항카드 5. 문항 해설·6. 채점 기준(PDF 29~30쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $f(x)$의 역함수는 $g(x)=\log_2(x-k)+1$.
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $g(5)=2$이므로, $k=3$.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        $g(35)=\log_2(35-3)+1=6$.
      criteria: ['1.A2']
