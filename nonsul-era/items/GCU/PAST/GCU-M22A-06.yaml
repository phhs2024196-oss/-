intent: |
  삼각부등식과 삼각함수 정의의 이해(문항카드 출제 의도 원문). 판별식으로 $\cos\theta$의 범위를 구하고 경계각의 탄젠트를 계산한다.
key_idea: |
  $D=3\sin^2\theta-4\left(\cos\theta-\frac14\right)\ge0\iff(3\cos\theta-2)(\cos\theta+2)\le0\iff\cos\theta\le\frac23$; $\alpha$는 1사분면, $\beta$는 4사분면.
stuck: |
  $\sin^2\theta=1-\cos^2\theta$로 바꿔 $\cos\theta$의 이차부등식으로 만들고, 경계각의 사분면을 판단하는 것.
