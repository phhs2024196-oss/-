stimuli: []
stem: |
  $0\le\theta<2\pi$일 때, $x$에 대한 이차방정식 $x^2+(\sqrt3\sin\theta)x+\cos\theta-\dfrac{1}{4}=0$이 실근을 갖도록 하는 모든 $\theta$의 값의 범위는 $\alpha\le\theta\le\beta$이다. $\tan\alpha-\tan\beta$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\tan\alpha-\tan\beta$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '√5', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $\cos\alpha=\cos\beta=\frac23$, $\tan\alpha=\frac{\sqrt5}2$, $\tan\beta=-\frac{\sqrt5}2$.
    steps:
    - id: '1a'
      content: |
        $\cos\theta\le\frac23$, $\tan\alpha=\frac{\sqrt5}2$, $\tan\beta=-\frac{\sqrt5}2$, 차 $\sqrt5$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '실근 조건은 판별식 $D\ge0$입니다.'
    - '$\cos\theta\le\frac23$인 $\theta$의 범위를 단위원에서 그려 보세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '가이드북 모의고사 답안지(수학) 6번 문항카드 5. 문항 해설·6. 채점 기준(PDF 31~32쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        실근을 갖기 위한 이차방정식의 판별식 $D\ge0$, 따라서 $3\sin^2\theta-4\left(\cos\theta-\dfrac14\right)\ge0$
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        이는 $(3\cos\theta-2)(\cos\theta+2)\le0$이고, 이를 풀면 $-2\le\cos\theta\le\dfrac23$이다.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        항상 $\cos\theta\ge-1$이므로, $\cos\theta\le\dfrac23$. $\cos\alpha=\cos\beta=\dfrac23$, $\alpha$는 1사분면, $\beta$는 4사분면
      criteria: ['1.A2']
    - id: '1b-4'
      content: |
        $\tan\alpha=\dfrac{\sqrt5}2$, $\tan\beta=-\dfrac{\sqrt5}2$ $\quad\therefore\ \sqrt5$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
        실근을 갖기 위한 이차방정식의 판별식 $D\ge0$, 따라서 $3\sin^2\theta-4\left(\cos\theta-\frac14\right)\ge0$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 2
      evidence: |
        $(3\cos\theta-2)(\cos\theta+2)\le0$이고, 이를 풀면 $-2\le\cos\theta\le\frac23$(채점기준 2점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 2
      evidence: |
        항상 $\cos\theta\ge-1$이므로 $\cos\theta\le\frac23$; $\cos\alpha=\cos\beta=\frac23$, $\alpha$는 1사분면, $\beta$는 4사분면(채점기준 2점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    - id: '1.A3'
      mark_type: 'A'
      points: 3
      evidence: |
        $\tan\alpha=\frac{\sqrt5}2$, $\tan\beta=-\frac{\sqrt5}2$ $\therefore\sqrt5$(채점기준 3점).
      depends_on: ['1.M1', '1.A2']
      steps: ['1b-4']
    deductions: []
