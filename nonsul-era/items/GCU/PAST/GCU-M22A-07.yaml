stimuli: []
stem: |
  자연수 $n$에 대하여 $x$에 대한 이차방정식 $x^2+25x-(2n-1)(2n+1)=0$의 두 근을 $\alpha_n,\ \beta_n$이라 하자. 등식 $\displaystyle\sum_{n=1}^{m}\left(\frac{1}{\alpha_n}+\frac{1}{\beta_n}\right)=12$를 만족시키는 자연수 $m$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    자연수 $m$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '12', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $\sum\frac{25}{(2n-1)(2n+1)}=\frac{25m}{2m+1}$, $25m=12(2m+1)$에서 $m=12$.
    steps:
    - id: '1a'
      content: |
        $\alpha_n+\beta_n=-25$, $\alpha_n\beta_n=-(2n-1)(2n+1)$, $\frac{25m}{2m+1}=12$, $m=12$
      criteria: ['1.M1', '1.A1', '1.A2', '1.A3']
    hint_ladder:
    - '$\frac1\alpha+\frac1\beta=\frac{\alpha+\beta}{\alpha\beta}$입니다.'
    - '$\frac1{(2n-1)(2n+1)}$을 두 분수의 차로 쪼개세요.'
  - id: 'S1-B'
    audience: B
    source_flow: '가이드북 모의고사 답안지(수학) 7번 문항카드 5. 문항 해설·6. 채점 기준(PDF 33~34쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        근과 계수와의 관계에 의해 $\alpha_n+\beta_n=-25$, $\alpha_n\beta_n=-(2n-1)(2n+1)$이고,
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        식에 대입하면 $\displaystyle\sum_{n=1}^m\left(\frac1{\alpha_n}+\frac1{\beta_n}\right)=\sum_{n=1}^m\frac{\alpha_n+\beta_n}{\alpha_n\beta_n}=\sum_{n=1}^m\frac{25}{(2n-1)(2n+1)}$이다.
      criteria: ['1.A1']
    - id: '1b-3'
      content: |
        따라서 $$\sum_{n=1}^m\frac{25}{(2n-1)(2n+1)}=\frac{25}{2}\sum_{n=1}^m\left(\frac1{2n-1}-\frac1{2n+1}\right)=\frac{25}{2}\left(1-\frac13+\frac13-\frac15+\cdots-\frac1{2m+1}\right)=\frac{25m}{2m+1}$$
      criteria: ['1.A2']
    - id: '1b-4'
      content: |
        $25m=12(2m+1)$이므로 $m=12$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 2
      evidence: |
        근과 계수의 관계에 의해 $\alpha_n+\beta_n=-25$, $\alpha_n\beta_n=-(2n-1)(2n+1)$(채점기준 2점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.A1'
      mark_type: 'A'
      points: 2
      evidence: |
        $\sum_{n=1}^m\left(\frac1{\alpha_n}+\frac1{\beta_n}\right)=\sum_{n=1}^m\frac{\alpha_n+\beta_n}{\alpha_n\beta_n}=\sum_{n=1}^m\frac{25}{(2n-1)(2n+1)}$(채점기준 2점).
      depends_on: ['1.M1']
      steps: ['1b-2']
    - id: '1.A2'
      mark_type: 'A'
      points: 4
      evidence: |
        $\sum_{n=1}^m\frac{25}{(2n-1)(2n+1)}=\frac{25}2\sum_{n=1}^m\left(\frac1{2n-1}-\frac1{2n+1}\right)=\frac{25}2\left(1-\frac13+\frac13-\frac15+\cdots-\frac1{2m+1}\right)=\frac{25m}{2m+1}$(채점기준 4점).
      depends_on: ['1.M1', '1.A1']
      steps: ['1b-3']
    - id: '1.A3'
      mark_type: 'A'
      points: 2
      evidence: |
        따라서 $25m=12(2m+1)$이므로 $m=12$(채점기준 2점).
      depends_on: ['1.M1', '1.A2']
      steps: ['1b-4']
