intent: |
  수열의 개념을 이해하고 그 합을 계산할 수 있는지 확인함(문항카드 출제 의도 원문). 근과 계수의 관계로 일반항을 분수꼴로 바꾸고 부분분수로 망원합을 계산한다.
key_idea: |
  $\frac1{\alpha_n}+\frac1{\beta_n}=\frac{\alpha_n+\beta_n}{\alpha_n\beta_n}=\frac{25}{(2n-1)(2n+1)}$, 합 $\frac{25m}{2m+1}=12$.
stuck: |
  부분분수 분해 $\frac1{(2n-1)(2n+1)}=\frac12\left(\frac1{2n-1}-\frac1{2n+1}\right)$.
