stimuli: []
stem: |
  다음 조건을 만족시키는 다항함수 $f(x)$를 구하는 과정을 서술하시오

  (가) $f'(x)=3x^2-2x+1$.
  (나) 곡선 $y=f(x)$ 위의 점 $(1,\ f(1))$에서의 접선의 $x$절편은 $-1$이다.
subparts:
- id: '1'
  stem: |
    다항함수 $f(x)$를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'f(x)=x^3-x^2+x+3', equivalents: [], tolerance: null}
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=x^3-x^2+x+c$, $f'(1)=2$, $0=2(-1-1)+(1+c)$에서 $c=3$.
    steps:
    - id: '1a'
      content: |
        $f=x^3-x^2+x+c$, 접선 $y=2(x-1)+f(1)$, $c=3$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - '(가)를 적분하면 적분상수가 하나 남습니다.'
    - '$x$절편이 $-1$이면 접선은 점 $(-1,0)$을 지납니다.'
  - id: 'S1-B'
    audience: B
    source_flow: '가이드북 모의고사 답안지(수학) 8번 문항카드 5. 문항 해설·6. 채점 기준(PDF 35~36쪽)'
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        (가)로부터 $f(x)=\displaystyle\int f'(x)\,dx=\int3x^2-2x+1\,dx=x^3-x^2+x+c$
      criteria: ['1.M1']
    - id: '1b-2'
      content: |
        $f'(1)=2$이므로 곡선 $y=f(x)$ 위의 점 $(1,f(1))$에서의 접선의 방정식은 $y=2(x-1)+f(1)$이다.
      criteria: ['1.M2']
    - id: '1b-3'
      content: |
        접선의 $x$절편이 $-1$이므로 $0=2(-1-1)+(1-1+1+c)$. 따라서 $c=3$
      criteria: ['1.A1']
    - id: '1b-4'
      content: |
        결국, $f(x)=x^3-x^2+x+3$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: '1.M1'
      mark_type: 'M'
      points: 3
      evidence: |
        (가)로부터 $f(x)=\int f'(x)\,dx=\int3x^2-2x+1\,dx=x^3-x^2+x+c$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-1']
    - id: '1.M2'
      mark_type: 'M'
      points: 3
      evidence: |
        $f'(1)=2$이므로 곡선 $y=f(x)$ 위의 점 $(1,f(1))$에서의 접선의 방정식은 $y=2(x-1)+f(1)$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: ['1b-2']
    - id: '1.A1'
      mark_type: 'A'
      points: 2
      evidence: |
        접선의 $x$절편이 $-1$이므로 $0=2(-1-1)+(1-1+1+c)$, 따라서 $c=3$(채점기준 2점).
      depends_on: ['1.M1', '1.M2']
      steps: ['1b-3']
    - id: '1.A2'
      mark_type: 'A'
      points: 2
      evidence: |
        결국 $f(x)=x^3-x^2+x+3$(채점기준 2점).
      depends_on: ['1.M2', '1.A1']
      steps: ['1b-4']
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
