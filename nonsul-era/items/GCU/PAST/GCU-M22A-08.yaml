intent: |
  다항함수의 부정적분을 구하는 기본 공식을 이용하고 도함수로부터 접선의 방정식을 유도하는 능력 확인(문항카드 출제 의도 원문). 부정적분으로 $f$를 구하고 접선의 $x$절편 조건으로 적분상수를 정한다.
key_idea: |
  $f(x)=x^3-x^2+x+c$, 접선 $y=2(x-1)+f(1)$이 $(-1,0)$을 지나므로 $c=3$.
stuck: |
  접선의 $x$절편이 $-1$ ⇔ 접선이 점 $(-1,0)$을 지남.
