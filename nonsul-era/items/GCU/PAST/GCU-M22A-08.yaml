  misconceptions:
  - id: MC-CAL-8140
    outcome_code: '71'
    wrong_work: '접선의 $x$절편 조건을 $y$절편으로 처리해 $f(1)-2=-1$, $c=0$으로 계산'
    detect_cue: '답이 $f(x)=x^3-x^2+x$이다'
    feedback: '$x$절편이 $-1$이라는 것은 접선이 점 $(-1,0)$을 지난다는 뜻입니다.'
    remedy: [RL-1]
