stimuli: []
stem: |
  $\dfrac32\pi<\theta<2\pi$인 $\theta$에 대하여 $6\cos\theta-\dfrac{1}{\cos\theta}=-1$일 때, $\sin\theta\cos\theta$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\sin\theta\cos\theta$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-\frac{2\sqrt{2}}{9}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\cos\theta=\tfrac13$, $\sin\theta=-\tfrac{2\sqrt2}{3}$.
    steps:
    - id: 1a
      content: $\sin\theta\cos\theta=-\tfrac{2\sqrt2}{9}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - 양변에 $\cos\theta$를 곱해 보자.
    - 제4사분면에서 $\cos\theta$와 $\sin\theta$의 부호는?
  - id: S1-B
    audience: B
    source_flow: 모범답안 A형 문항카드([문제 1]=문제지 [문제 5]) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $6\cos\theta-\dfrac{1}{\cos\theta}=-1\Rightarrow6\cos^2\theta+\cos\theta-1=0$. 따라서 $\cos\theta=-\dfrac12$ 또는 $\cos\theta=\dfrac13$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        주어진 범위를 만족하는 것은 $\cos\theta=\dfrac13$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $\sin\theta=-\dfrac{2\sqrt2}{3}$이므로,
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $\sin\theta\cos\theta=-\dfrac{2\sqrt2}{9}$
      criteria:
      - 1.A3
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $6\cos^2\theta+\cos\theta-1=0$, $\cos\theta=-\dfrac12$ 또는 $\dfrac13$(채점기준 3점).
      depends_on: []
