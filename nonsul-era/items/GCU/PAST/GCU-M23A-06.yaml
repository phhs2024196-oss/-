stimuli: []
stem: |
  함수 $f(x)=-2x^3+3x^2+12x+a$가 닫힌 구간 $[-1,5]$에서 최솟값 $-105$을 가질 때, 곡선 $y=f(x)$와 직선 $y=k$가 만나는 점의 개수가 2가 되도록 하는 모든 상수 $k$의 값의 합을 구하는 과정을 서술하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: |
    모든 상수 $k$의 값의 합을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '33', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(5)=-115+a=-105$에서 $a=10$, 극값 $3$, $30$.
    steps:
    - id: 1a
      content: $k=3,30$, 합 $33$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - $f'(x)$를 인수분해하자.
    - 최솟값 후보는 극솟값과 양 끝값이다.
  - id: S1-B
    audience: B
    source_flow: 모범답안 A형 문항카드([문제 2]=문제지 [문제 6]) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=-6x^2+6x+12=-6(x-2)(x+1)$이며,
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        닫힌 구간 $[-1,5]$에서 최솟값은 $f(-1)=2+3-12+a=-7+a$와 $f(5)=-2\times125+3\times25+60+a=-115+a$ 중에 $f(5)=-115+a=-105$이므로, $a=10$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        곡선 $y=f(x)$와 직선 $y=k$가 만나는 점의 개수가 2가 되는 지점은 $f(-1)=-7+a=3$과 $f(2)=-2\times8+3\times4+24+a=30$이므로, 상수 $k$의 합은 33이다.
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
