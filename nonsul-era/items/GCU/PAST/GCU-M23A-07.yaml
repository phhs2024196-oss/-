stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여 $\displaystyle\int_a^xf(t)\,dt=x^3+x^2-6x$을 만족시킬때 $f(a)$의 값을 구하는 과정을 서술하시오. (단, $a$는 양수이다.)
subparts:
- id: '1'
  stem: |
    $f(a)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '10', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a(a+3)(a-2)=0$에서 $a=2$, $f(x)=3x^2+2x-6$.
    steps:
    - id: 1a
      content: $f(2)=10$
      criteria:
      - 1.M1
      - 1.A1
      - 1.M2
      - 1.A2
    hint_ladder:
    - $x$에 $a$를 넣으면 좌변은?
    - 양변을 $x$에 대해 미분하자.
  - id: S1-B
    audience: B
    source_flow: 모범답안 A형 문항카드([문제 3]=문제지 [문제 7]) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\int_a^xf(t)\,dt=x^3+x^2-6x$ (이하 (1)식)의 식에서 $x=a$를 대입하면, $0=a^3+a^2-6a=a(a+3)(a-2)$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이때 $a$가 양수이므로, $a=2$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        (1) 식의 양변을 미분하면, $f(x)=3x^2+2x-6$이므로,
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $f(a)=f(2)=3\times2^2+2\times2-6=10$이다.
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
