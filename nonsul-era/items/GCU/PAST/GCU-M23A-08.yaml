stem: |
  모든 항이 음수이고 $a_1=-3$인 수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 할 때, 모든 자연수 $n$에 대하여
  $$3(S_{n+1}+S_n)=-(S_{n+1}-S_n)^2\quad\cdots(\ast)$$
  이 성립한다. $a_n$의 값을 구하는 다음의 풀이 과정을 완성하시오. (단, 아래 빈칸의 ①, ②, ③은 모두 숫자로 쓰시오)

  > $S_1=a_1=-3$이고, $(\ast)$에 $n=$ [ ① ]을 대입하면
  > $3(S_2+S_1)=-(S_2-S_1)^2$이므로, 이를 정리하면
  > $S_2=a_1+a_2=-3+a_2$이다. 따라서, $a_2=$ [ ② ]이다.
  > 한편, $(\ast)$에 $n$ 대신 $n+1$을 대입하면
  > $3(S_{n+2}+S_{n+1})=-(S_{n+2}-S_{n+1})^2\quad\cdots(\star)$
  > 이고, 수식 $(\star)-(\ast)$을 정리하면
  > $a_{n+2}-a_{n+1}=$ [ ③ ] 이다. 따라서 $a_n=$ [ ④ ].
