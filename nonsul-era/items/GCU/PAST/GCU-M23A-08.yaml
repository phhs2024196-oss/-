    - 두 식을 빼면 $a_{n+2}^2-a_{n+1}^2$이 나온다.
  - id: S1-B
    audience: B
    source_flow: 모범답안 A형 문항카드([문제 4]=문제지 [문제 8], 카드는 $(\ast)$·$(\star)$를 ㉠·㉡으로 표기) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $S_1=a_1=-3$이므로 $(\ast)$에 $n=1$.
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $3(S_2+S_1)=-(S_2-S_1)^2$ 정리하면 $S_2(S_2+9)=0$, $S_2=-9$, $S_2=a_1+a_2=-3+a_2$이므로 $a_2=-6$,
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        $(\star)-(\ast)$에서 $3(a_{n+2}+a_{n+1})=-a_{n+2}^2+a_{n+1}^2\Rightarrow-3=a_{n+2}-a_{n+1}$
      criteria:
      - 1.B3
    - id: 1b-4
      content: |
        따라서 $a_n$은 첫째항이 $-3$이고 공차가 $-3$인 등차수열. 따라서 $a_n=-3n$.
      criteria:
      - 1.B4
