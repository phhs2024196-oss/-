stimuli: []
stem: |
  두 함수 $f(x)=\begin{cases}x^3+2x^2+3x & (x<1)\\ 2x-1 & (x\ge1)\end{cases}$, $g(x)=2x^2+ax$에 대하여 함수 $f(x)g(x)$가 $x=1$에서 연속이 되도록 하는 상수 $a$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    상수 $a$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 좌극한 $6(2+a)$, 우극한·함숫값 $2+a$.
    steps:
    - id: 1a
      content: $5(2+a)=0$, $a=-2$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - $x\to1-$와 $x\to1+$에서 각각 어느 식을 쓰는가?
  - id: S1-B
    audience: B
    source_flow: 모범답안 B형 문항카드([문제 1]=문제지 [문제 5]) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)g(x)$가 $x=1$에서 연속이 되려면 $\lim_{x\to1-}f(x)g(x)=\lim_{x\to1+}f(x)g(x)=f(1)g(1)$이어야 한다. $\lim_{x\to1-}f(x)g(x)=\lim_{x\to1-}(x^3+2x^2+3x)(2x^2+ax)=6(2+a)$, (학교 해설 첫 줄의 두 번째 $\lim_{x\to1-}$는 $\lim_{x\to1+}$의 오기)
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\lim_{x\to1+}f(x)g(x)=\lim_{x\to1+}(2x-1)(2x^2+ax)=2+a$,
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $f(1)g(1)=6(2+a)=(2+a)$이므로 $6(2+a)=(2+a)$, $5(2+a)=0$
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        따라서 $a=-2$
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
