      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $f(x)=5x^2$를 $x^2-x-1=0$으로 바꿔 실근의 합을 구한다(채점기준 2점).
      depends_on:
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        모든 실근의 합 1(채점기준 3점).
      depends_on:
      - 1.M2
      steps:
      - 1b-4
    deductions: []
