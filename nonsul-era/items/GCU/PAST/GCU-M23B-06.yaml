stimuli: []
stem: |
  다항함수 $f(x)$의 한 부정적분 $F(x)$가 모든 실수 $x$에 대하여 $F(x)=f(x)+x^3-2x^2$을 만족시킬 때, 방정식 $f(x)=5x^2$의 모든 실근의 합을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    방정식 $f(x)=5x^2$의 모든 실근의 합을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=3x^2+2x+2$, $x^2-x-1=0$.
    steps:
    - id: 1a
      content: 판별식 양수, 실근의 합 $1$
      criteria:
      - 1.M1
      - 1.A1
      - 1.M2
      - 1.A2
    hint_ladder:
    - 양변을 미분하자.
    - $f(x)=3x^2+ax+b$로 놓고 계수를 비교하자.
    - 실근이 실제로 있는지 판별식으로 확인하자.
  - id: S1-B
    audience: B
    source_flow: 모범답안 B형 문항카드([문제 2]=문제지 [문제 6]) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $F'(x)=f(x)$이고, $F(x)=f(x)+x^3-2x^2$의 양변을 미분하면 $f(x)=f'(x)+3x^2-4x$ (이하 (1)식)이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(x)=3x^2+ax+b$로 정의하면, $f'(x)=6x+a$이므로, (1)식에 이를 대입하면, $3x^2+ax+b=3x^2+2x+a$, 즉 $a=2$, $b=2$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        방정식 $f(x)=5x^2$에 계산한 $f(x)$를 대입하면, $3x^2+2x+2=5x^2$이고, 즉 $x^2-x-1=0$ (이하 (2)식)을 만족하는 실근의 합을 구하면 문제가 해결된다.
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        이차방정식 (2)의 판별식은 $\dfrac{D}{4}=\left(-\dfrac12\right)^2+1>0$을 만족하므로, 방정식 (2)는 서로 다른 두 실근을 갖는다. 따라서 구하는 모든 실근의 합은 1이다.
      criteria:
      - 1.A2
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
