stimuli: []
stem: |
  등차수열 $\{a_n\}$이 $a_8+a_9+a_{10}=30$, $a_{21}+a_{23}=72$를 만족시킬 때, $a_{30}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $a_{30}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '52', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a=-6$, $d=2$.
    steps:
    - id: 1a
      content: $a_{30}=-6+29\times2=52$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - 첫째항 $a$, 공차 $d$로 각 항을 쓰자.
  - id: S1-B
    audience: B
    source_flow: 모범답안 B형 문항카드([문제 3]=문제지 [문제 7]) 5. 문항 해설·6. 채점 기준 (해설의 '일반항이 $a+nd$'는 $a+(n-1)d$의 오기)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        수열 $\{a_n\}$의 일반항이 $a+(n-1)d$일 때 $a_8=a+7d$, $a_9=a+8d$, $a_{10}=a+9d$, $a_{21}=a+20d$, $a_{23}=a+22d$. (학교 해설은 $a_{23}=a+21d$로 적었으나 아래 식 $2a+42d$는 $a+22d$로 계산됨)
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a_8+a_9+a_{10}=3a+24d=30$, $a_{21}+a_{23}=2a+42d=72$
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $3a+24d=30$와 $2a+42d=72$를 풀면 $a=-6$, $d=2$.
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        따라서 $a_{30}=a+29d=-6+29\times2=-6+58=52$
      criteria:
      - 1.A2
