stimuli: []
stem: |
  두 함수 $y=-3^{-x+2}+1$, $y=\log_{\frac12}(x+a)$의 그래프가 제 4사분면에서 만나도록 하는 모든 실수 $a$ 값의 범위를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    모든 실수 $a$ 값의 범위를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: -1<a<256, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $-8<\log_{\frac12}a$ ($x=0$)와 $\log_{\frac12}(2+a)<0$ ($x=2$).
    steps:
    - id: 1a
      content: $-1<a<256$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - 지수함수가 $x$축, $y$축과 만나는 점을 구하자.
    - 로그함수는 감소함수이다.
  - id: S1-B
    audience: B
    source_flow: 모범답안 B형 문항카드([문제 4]=문제지 [문제 8]) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $y=-3^{-x+2}+1$은 $(0,-8)$과 $(2,0)$을 지난다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서, $-8=\log_{\frac12}(a)$와 $0=\log_{\frac12}(2+a)$을 만족하는 $a$ 값의 사이에 있어야 4사분면에서 두 함수는 만난다. 즉, $-1<a$이고
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $a<2^8=256$이다.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        따라서, $-1<a<256$.
      criteria:
      - 1.A3
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
