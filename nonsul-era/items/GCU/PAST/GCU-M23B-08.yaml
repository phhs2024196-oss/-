  지수로그함수의 이해(문항카드 출제 의도 원문). 증가하는 지수함수와 감소하는 로그함수가 제4사분면에서 만날 조건을 경계점 비교로 구한다.
key_idea: |
  $y=-3^{-x+2}+1$은 $(0,-8)$과 $(2,0)$을 지나는 증가함수이므로, 감소하는 로그함수가 $x=0$에서 $-8$보다 위, $x=2$에서 $0$보다 아래에 있어야 한다.
stuck: |
