stimuli: []
stem: |
  다항함수 $f(x)=x^3+3ax^2+x$가 일대일 함수일 때 실수 $a$의 최댓값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: '실수 $a$의 최댓값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/sqrt(3)
    equivalents:
    - '$\frac{1}{\sqrt3}$'
    - '$\frac{\sqrt3}{3}$'
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$f''(x)$의 최솟값 $f''(-a)=1-3a^2\ge0$.'
    steps:
    - id: 1a
      content: '$a^2\le\frac13$이므로 최댓값 $\frac1{\sqrt3}$'
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
    hint_ladder:
    - 일대일인 삼차함수는 증가함수이다.
    - '이차함수 $f''(x)$의 최솟값은?'
  - id: 'S1-B'
    audience: B
    source_flow: 「2024학년도 논술 모의고사 A형 답안.hwp」 문항카드(수학 A형 5번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: '1b-1'
      content: '도함수 $f''(x)=3x^2+6ax+1$의 값이 $0$ 이상이 되는 실수 $a$의 최댓값을 구하면 충분하다.'
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        이 함수는 $x=-a$일 때 최솟값을 갖는다. (학교 해설 풀이 1은 $f''(x)=6x+6a=0$으로 구하며, 답안지에 '2계도함수 판정법을 사용했는데 교재에는 없는 방법'이라고 적혀 있다. $f'(x)=3(x+a)^2+1-3a^2$로 꼭짓점을 찾아도 같다.)
      criteria:
      - 1.M2
    - id: '1b-3'
      content: '즉, $f''(-a)=-3a^2+1$이 최솟값이고, $0$ 이상이 되기 위해서는 $-3a^2+1\ge0$이 되어야 한다.'
      criteria:
      - 1.M3
    - id: '1b-4'
      content: '$a^2\le\frac13$. 따라서 $a$의 최댓값은 $\frac1{\sqrt3}$이다.'
      criteria:
      - 1.A1
  - id: 'S1-ALT'
    audience: ALT
    method_no: 2
    source_flow: 「2024학년도 논술 모의고사 A형 답안.hwp」 문항카드(수학 A형 5번) 5. 문항 해설 풀이 2
    steps:
    - id: '1c-1'
      content: '$f''(x)=3x^2+6ax+1=3(x+a)^2+1-3a^2\ge0$가 모든 $x$에 대하여 성립할 때 $f$는 순증가함수이고 일대일 함수이다.'
      criteria:
      - 1.M1
      - 1.M2
    - id: '1c-2'
      content: |
        따라서 $1-3a^2\ge0$일 때(또는 $f'(x)=0$의 판별식 $9a^2-3\le0$), $f$는 일대일 함수이므로 $a$의 최댓값은 $\frac1{\sqrt3}$.
      criteria:
      - 1.M3
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
