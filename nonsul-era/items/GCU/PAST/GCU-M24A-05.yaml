      steps:
      - '1b-1'
      - '1c-1'
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: '이 함수는 $f''''(x)=6x+6a=0$ 또는 $x=-a$일 때 최소(채점기준 3점).'
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - '1b-2'
      - '1c-1'
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: '$f''(-a)=-3a^2+1$이 최솟값이고 이 값이 0 이상이 되어야 한다(채점기준 3점).'
      depends_on:
      - 1.M2
