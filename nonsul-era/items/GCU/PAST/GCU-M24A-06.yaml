stimuli: []
stem: |
  $\displaystyle\lim_{x\to-1}\frac{x^2+ax+b}{x^2-1}=\frac12$일 때, 상수 $a$와 $b$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: '상수 $a$와 $b$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 'a=1, b=0'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$b=a-1$을 대입해 $(x+1)$로 약분.'
    steps:
    - id: 1a
      content: '$\lim_{x\to-1}\frac{x+a-1}{x-1}=\frac{a-2}{-2}=\frac12$에서 $a=1$, $b=0$'
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - '분모가 0으로 가는데 극한값이 존재하면 분자는?'
  - id: 'S1-B'
    audience: B
    source_flow: 「2024학년도 논술 모의고사 A형 답안.hwp」 문항카드(수학 A형 6번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        식 $\lim_{x\to-1}\frac{x^2+ax+b}{x^2-1}=\frac12$에서 $x\to-1$일 때 분모 $x^2-1\to0$이고 극한값이 존재하므로 분자도 $x^2+ax+b\to0$이어야 한다. 즉, $\lim_{x\to-1}(x^2+ax+b)=1-a+b=0$에서 $b=a-1$을 얻는다.
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        이것을 원래 극한 식에 대입하면 $\displaystyle\lim_{x\to-1}\frac{x^2+ax+a-1}{x^2-1}=\lim_{x\to-1}\frac{(x+1)(x+a-1)}{(x+1)(x-1)}=\lim_{x\to-1}\frac{x+a-1}{x-1}=\frac{-2+a}{-2}=\frac12$
      criteria:
      - 1.M2
    - id: '1b-3'
      content: '이고, 따라서 $a=1$이고'
      criteria:
      - 1.A1
    - id: '1b-4'
      content: '$b=a-1=1-1=0$.'
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
