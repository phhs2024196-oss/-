    outcome_code: '71'
    wrong_work: '약분 후 $\frac{x+a-1}{x-1}$에 $x=-1$을 넣을 때 분모를 $-1-1=-2$가 아닌 $2$ 또는 $0$으로 처리해 $a=3$ 등을 얻음'
    detect_cue: '$a=3$, $b=2$ 같은 답'
