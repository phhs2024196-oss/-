      points: 3
      evidence: |
        $\lim_{x\to-1}\frac{x^2+ax+b}{x^2-1}=\lim_{x\to-1}\frac{x^2+ax+a-1}{x^2-1}=\frac{-2+a}{-2}$(채점기준 3점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - '1b-2'
    - id: 1.A1
