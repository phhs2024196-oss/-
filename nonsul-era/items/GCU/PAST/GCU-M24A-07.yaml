stem: |
  $\sin(\pi+\theta)=\dfrac34$이고 $\sin\left(\dfrac\pi2+\theta\right)<0$일 때, $\tan\theta$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: '$\tan\theta$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '3*sqrt(7)/7'
    equivalents:
    - '$\frac{3}{\sqrt7}$'
    - '$\frac{3\sqrt7}{7}$'
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$\sin\theta=-\frac34$, $\cos\theta=-\frac{\sqrt7}4$.'
    steps:
    - id: 1a
      content: '$\tan\theta=\frac{3}{\sqrt7}=\frac{3\sqrt7}7$'
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - '$\sin(\pi+\theta)$를 $\sin\theta$로 나타내면?'
    - '$\sin\left(\frac\pi2+\theta\right)$는 무엇과 같은가?'
  - id: 'S1-B'
    audience: B
    source_flow: 「2024학년도 논술 모의고사 A형 답안.hwp」 문항카드(수학 A형 7번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: '1b-1'
      content: '$\sin(\pi+\theta)=-\sin\theta=\frac34$, $\therefore\sin\theta=-\frac34$.'
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        $\sin\left(\frac\pi2+\theta\right)=\cos\theta<0$. 따라서 $\cos\theta=-\sqrt{1-\sin^2\theta}=-\sqrt{1-\frac9{16}}=-\sqrt{\frac7{16}}=-\frac{\sqrt7}4$
      criteria:
      - 1.A1
    - id: '1b-3'
      content: |
        $\tan\theta=\dfrac{\sin\theta}{\cos\theta}=\dfrac{-\frac34}{-\frac{\sqrt7}4}=\dfrac3{\sqrt7}=\dfrac{3\sqrt7}7$
      criteria:
      - 1.A2
