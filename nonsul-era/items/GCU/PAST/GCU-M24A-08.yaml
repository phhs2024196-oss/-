stem: |
  공차가 $0$이 아닌 등차수열 $\{a_n\}$에 대하여 $b_n=a_n+a_7$이라 하고, 수열 $\{b_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라고 하자. $S_n$이 다음 조건을 만족시킬 때, $a_5$의 값을 구하는 과정을 서술하시오.

  (가) $1\le n\le12$인 모든 자연수 $n$에 대하여 $S_n=S_{13-n}$이다.
  (나) $S_{15}=60$
subparts:
- id: '1'
  stem: '$a_5$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-8'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$S_6=S_7\Rightarrow b_7=2a_7=0\Rightarrow a_1=-6d$.'
    steps:
    - id: 1a
      content: '$S_{15}=15d=60$, $d=4$, $a_5=-24+16=-8$'
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - '(가)에서 $n=6$이면?'
    - '$S_7-S_6$은 무엇인가?'
  - id: 'S1-B'
    audience: B
    source_flow: 「2024학년도 논술 모의고사 A형 답안.hwp」 문항카드(수학 A형 8번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: '1b-1'
      content: '조건 (가)에서 $n=6$이면 $S_6=S_7$이고, $S_7-S_6=b_7=0$이다.'
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        따라서 $b_7=a_7+a_7=0$인데, 등차수열 $\{a_n\}$의 첫째항을 $a_1$, 공차를 $d$라 할 때, $a_7$에 대해 $a_7=a_1+6d=0$이 성립한다. 그러므로 $b_n=a_n=a_1+(n-1)d=-6d-d+nd=-7d+nd$이다.
      criteria:
      - 1.A1
    - id: '1b-3'
      content: '제15항까지의 합 $S_{15}=\dfrac{15(-6d+(-7d+15d))}2=\dfrac{15\times2d}2=60$이므로 $d=4$이다.'
      criteria:
      - 1.A2
    - id: '1b-4'
      content: '따라서 $a_5=-24+4\times4=-8$이다.'
      criteria:
      - 1.A3
