stimuli: []
stem: |
  $x$에 대한 부등식
  $$x^2-x\log_3\left(\sqrt3\,n\right)+\log_3\sqrt n\le0$$
  을 만족시키는 정수 $x$의 개수가 $1$이 되도록 하는 자연수 $n$의 개수를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: '자연수 $n$의 개수를 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '7'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$\left(x-\frac12\right)(x-\log_3n)\le0$; 정수 1개 $\iff$ $\log_3n=0$ 또는 $1\le\log_3n<2$.'
    steps:
    - id: 1a
      content: '$n=1,3,4,5,6,7,8$이므로 $7$개'
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - '$\log_3(\sqrt3n)$과 $\log_3\sqrt n$을 $\log_3n$으로 나타내 보자.'
    - '근 $\frac12$과 $\log_3n$ 사이에 정수가 하나만 있으려면?'
  - id: 'S1-B'
    audience: B
    source_flow: 「2024학년도 논술 모의고사 B형 답안.hwp」 문항카드(수학 B형 5번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $x^2-x\log_3(\sqrt3n)+\log_3\sqrt n\le0$
        $x^2-x\left(\frac12+\log_3n\right)+\frac12\log_3n\le0$
        $\left(x-\frac12\right)(x-\log_3n)\le0$
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        정수 $x$가 1개이려면 (해 구간의 끝 $\log_3n$에 대하여) $0\le\log_3n\le\frac12$ 또는 $\frac12\le\log_3n<2$, 이때 정수해는 $x=0$ 또는 $x=1$. (답안지 원문은 '$0\le x\le\frac12$ 또는 $\frac12\le x<2$'로 $x$를 써서 표기했으나 문맥상 $\log_3n$의 범위이다. $0<\log_3n\le\frac12$인 자연수 $n$은 없으므로 $\log_3n=0$, 즉 $n=1$.)
      criteria:
      - 1.M2
    - id: '1b-3'
      content: '따라서 $n=1$, $3$, $4$, $5$, $6$, $7$, $8$'
      criteria:
      - 1.A1
    - id: '1b-4'
      content: '이므로 $7$개.'
      criteria:
      - 1.A2
