stimuli: []
stem: |
  함수 $f(x)$가 실수 전체의 집합에서 연속이고 모든 실수 $x$에 대하여
  $$(x-1)(x-2)f(x)=(x-2)(x^3+ax+b)$$
  를 만족시킨다. $f(2)=1$일 때, $f(1)$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$는 상수이다.)
subparts:
- id: '1'
  stem: '$f(1)$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-3'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$2a+b=-7$, $a+b=-1$에서 $a=-6$, $b=5$.'
    steps:
    - id: 1a
      content: '$f(1)=\lim_{x\to1}(x^2+x-5)=-3$'
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - '$x\neq1,2$일 때 $f(x)$를 식으로 나타내 보자.'
    - '$x=1$에서 극한값이 존재하려면?'
  - id: 'S1-B'
    audience: B
    source_flow: 「2024학년도 논술 모의고사 B형 답안.hwp」 문항카드(수학 B형 6번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: '1b-1'
      content: '$x\neq1$, $x\neq2$일 때 $f(x)=\dfrac{(x-2)(x^3+ax+b)}{(x-1)(x-2)}=\dfrac{x^3+ax+b}{x-1}$이다.'
      criteria:
      - 1.M1
    - id: '1b-2'
      content: |
        함수 $f(x)$는 $x=2$에서 연속이므로 $\lim_{x\to2}f(x)=f(2)$이다. 즉, $\lim_{x\to2}\frac{x^3+ax+b}{x-1}=1$이므로 $\frac{8+2a+b}{2-1}=1$이고 $2a+b=-7$이다.
      criteria:
      - 1.A1
    - id: '1b-3'
      content: |
        또한, 함수 $f(x)$는 $x=1$에서도 연속이므로 $\lim_{x\to1}f(x)=f(1)$이다. $\lim_{x\to1}\frac{x^3+ax+b}{x-1}=f(1)$에서 $x\to1$일 때 분모 $x-1\to0$이고 극한값이 존재하므로 분자도 $x^3+ax+b\to0$이어야 한다. 즉, $\lim_{x\to1}(x^3+ax+b)=1+a+b=0$에서 $a+b=-1$이다.
      criteria:
      - 1.A2
    - id: '1b-4'
      content: |
        위의 $2a+b=-7$과 연립해서 풀면 $a=-6$, $b=5$를 얻는다. 따라서 $f(1)=\displaystyle\lim_{x\to1}\frac{x^3-6x+5}{x-1}=\lim_{x\to1}\frac{(x-1)(x^2+x-5)}{x-1}=\lim_{x\to1}(x^2+x-5)=-3$
      criteria:
      - 1.A3
