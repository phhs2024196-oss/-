stem: |
  모든 항이 실수인 등비수열 $\{a_n\}$에 대하여 $a_3a_4=\dfrac54$, $a_{12}a_{13}=20$일 때, $a_8^2$의 값을 구하는 다음의 풀이 과정을 완성하시오.

  [풀이] 등비수열 $\{a_n\}$에 대하여 세 수 $a_3$, [ ① ], $a_{13}$이 순서대로 등비수열을 이루고, 또한 세 수 $a_4$, $a_8$, [ ② ]이 순서대로 등비수열을 이루므로 $a_8^4=$ [ ③ ]이다. 따라서 $a_8^2$의 값은 [ ④ ]이다.
