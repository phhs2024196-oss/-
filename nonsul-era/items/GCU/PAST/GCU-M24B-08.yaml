stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$\int_1^x f(t)\,dt=x^3+ax+b$$
  를 만족시킨다. $f(-1)=1$일 때, $\displaystyle\int_a^b f(x)\,dx$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$는 상수이다.)
subparts:
- id: '1'
  stem: '$\int_a^bf(x)\,dx$의 값을 구하는 과정을 서술하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: 'S1-A'
    audience: A
    method_no: 1
    key_idea: '$f(x)=3x^2+a$, $a=-2$, $b=1$.'
    steps:
    - id: 1a
      content: '$\int_{-2}^1(3x^2-2)\,dx=3$'
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - '양변을 $x$에 대해 미분하면?'
    - '$x=1$을 대입하면 좌변은?'
  - id: 'S1-B'
    audience: B
    source_flow: 「2024학년도 논술 모의고사 B형 답안.hwp」 문항카드(수학 B형 8번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: '1b-1'
      content: |
        $\int_1^xf(t)\,dt=x^3+ax+b$ $\cdots\cdots$ ㉠. ㉠의 양변을 $x$에 대하여 미분하면 정적분과 미분의 관계로부터 $f(x)=3x^2+a$이다.
      criteria:
      - 1.M1
    - id: '1b-2'
      content: '$1=f(-1)=3+a$이므로 $a=-2$.'
      criteria:
      - 1.A1
    - id: '1b-3'
      content: '㉠의 양변에 $x=1$을 대입하면 $0=\int_1^1f(t)\,dt=1-2+b$이므로 $b=1$이다.'
      criteria:
      - 1.A2
    - id: '1b-4'
      content: '따라서 $\displaystyle\int_a^bf(x)\,dx=\int_{-2}^1(3x^2-2)\,dx=\Big[x^3-2x\Big]_{-2}^1=3$.'
      criteria:
      - 1.A3
