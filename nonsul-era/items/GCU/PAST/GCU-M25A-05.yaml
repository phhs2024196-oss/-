intent: |
  지수함수 성질을 이용하여 값을 구한다(문항카드 출제 의도 원문). 밑 $a$의 범위에 따라 증가·감소를 판정해 최솟값을 갖는 끝점을 정하고, 구한 $a$가 범위 조건에 맞는지 확인한다.
key_idea: |
  $a>1$이면 $x=2$, $0<a<1$이면 $x=3$에서 최솟값을 갖는다. 구한 $a$가 가정한 범위에 있는지 확인한다.
stuck: |
  ① $a=\frac19$이 나왔을 때 가정 $a>1$과 모순임을 판정하는 단계.
