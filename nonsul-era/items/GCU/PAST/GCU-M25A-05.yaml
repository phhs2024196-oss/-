stimuli: []
stem: |
  정의역이 $\{x\mid 2\le x\le 3\}$인 함수 $y=a^{x-1}+2\ (a>0,\ a\ne1)$의 최솟값이 $\dfrac{19}{9}$이다. (단, $a$는 상수)
  ① $a>1$일 때 위 조건을 만족시키는 함수가 존재하는지 서술하시오.
  ② $0<a<1$일 때 위 조건을 만족시키는 함수가 존재하는지 서술하시오.
subparts:
- id: '1'
  stem: |
    ① $a>1$일 때 위 조건을 만족시키는 함수가 존재하는지 서술하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: |
      존재하지 않는다($a=\frac19$은 $a>1$에 모순)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      증가함수 → $x=2$에서 최솟값.
    steps:
    - id: 1a
      content: |
        $a+2=\frac{19}{9}\Rightarrow a=\frac19$, $a>1$ 모순
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - |
      $a>1$이면 증가함수인가 감소함수인가?
  - id: S1-B
    audience: B
    source_flow: 답안지(A형).hwp 문항카드(A5) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a>1$일 때, $y=a^{x-1}+2$는 증가함수이므로, $x=2$에서 최솟값 $\dfrac{19}{9}$를 가져야 한다. 즉, $a+2=\dfrac{19}{9}$에서 $a=\dfrac19$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 $a>1$인 조건을 만족시키지 못한다(조건을 만족시키는 함수가 없다).
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        ① $a=\frac19$(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $a>1$ 조건을 만족시키는 함수가 없음(채점기준 1점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  - code: '71'
    misconception: MC-ALG-8611
  misconceptions:
  - id: MC-ALG-8611
    outcome_code: '71'
    wrong_work: |
      $a>1$인데 최솟값을 $x=3$에서 잡아 $a^2+2=\frac{19}{9}$, $a=\frac13$을 답으로 씀
    detect_cue: |
      ① 에서 $a=\frac13$이 나오고 '존재한다'고 답한다
    feedback: |
      밑이 1보다 크면 증가함수이므로 최솟값은 왼쪽 끝 $x=2$에서 나옵니다.
    remedy:
    - RL-MC-ALG-8611
- id: '2'
  stem: |
    ② $0<a<1$일 때 위 조건을 만족시키는 함수가 존재하는지 서술하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: |
      존재한다($a=\frac13$)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      감소함수 → $x=3$에서 최솟값.
    steps:
    - id: 2a
      content: |
        $a^2+2=\frac{19}{9}\Rightarrow a=\frac13$
      criteria:
      - 2.M1
      - 2.A1
    hint_ladder:
    - |
      $0<a<1$이면 최솟값은 어느 끝점에서?
  - id: S2-B
    audience: B
    source_flow: 답안지(A형).hwp 문항카드(A5) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $0<a<1$일 때, $y=a^{x-1}+2$는 감소함수이므로, $x=3$에서 최솟값 $\dfrac{19}{9}$를 가져야 한다. 즉, $a^2+2=\dfrac{19}{9}$에서 $a^2=\dfrac19$. 따라서 $a=\dfrac13$
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $a=\dfrac13$은 $0<a<1$을 만족하므로 조건을 만족시키는 함수가 있다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        ② $a=\frac13$(채점기준 4점).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        $0<a<1$ 조건을 만족시키는 함수가 있음(채점기준 1점).
      depends_on:
      - 2.M1
      implied_ok: false
