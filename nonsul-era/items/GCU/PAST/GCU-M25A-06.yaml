stem: |
  $\sin\left(\dfrac{\pi}{2}+\theta\right)-\cos\left(\dfrac{\pi}{2}+\theta\right)=\dfrac{1}{5}$일 때, $\sin^{3}\theta+\cos^{3}\theta$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\sin^3\theta+\cos^3\theta$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \frac{37}{125}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\cos\theta+\sin\theta=\frac15$, 제곱 → $\sin\theta\cos\theta=-\frac{12}{25}$.
    steps:
    - id: 1a
      content: |
        $\left(\frac15\right)^3+3\cdot\frac{12}{25}\cdot\frac15=\frac{37}{125}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $\sin\left(\frac{\pi}{2}+\theta\right)$와 $\cos\left(\frac{\pi}{2}+\theta\right)$를 바꿔 보자.
  - id: S1-B
    audience: B
    source_flow: 답안지(A형).hwp 문항카드(A6) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sin\left(\dfrac{\pi}{2}+\theta\right)=\cos\theta$, $\cos\left(\dfrac{\pi}{2}+\theta\right)=-\sin\theta$이므로 $\cos\theta+\sin\theta=\dfrac15$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        양변을 제곱하면 $\left(\cos^2\theta+\sin^2\theta\right)+2\sin\theta\cos\theta=\dfrac{1}{25}$, $1+2\sin\theta\cos\theta=\dfrac{1}{25}$, $2\sin\theta\cos\theta=-\dfrac{24}{25}$, $\sin\theta\cos\theta=-\dfrac{12}{25}$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\therefore\ \sin^3\theta+\cos^3\theta=(\sin\theta+\cos\theta)^3-3\sin\theta\cos\theta(\sin\theta+\cos\theta)=\left(\dfrac15\right)^3-3\left(-\dfrac{12}{25}\right)\left(\dfrac15\right)=\dfrac{37}{125}$
      criteria:
      - 1.A2
