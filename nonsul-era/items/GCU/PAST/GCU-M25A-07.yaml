stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$\int_{0}^{x}f(t)\,dt=f(x)+ax^{2}+x$$
  를 만족시킬 때, $f(a)$의 값을 구하는 과정을 서술하시오. (단, $a$는 상수)
subparts:
- id: '1'
  stem: |
    $f(a)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      \frac{1}{2}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=bx+c$, $c=0$, 계수비교.
    steps:
    - id: 1a
      content: |
        $f(x)=-x$, $a=-\frac12$, $f(a)=\frac12$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $f$의 차수를 $n$으로 놓고 비교하자.
  - id: S1-B
    audience: B
    source_flow: 답안지(A형).hwp 문항카드(A7) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=bx^{n}+\cdots+(\text{상수})$로 놓았을 때 $n$의 값은 $1$. 따라서 $f(x)=bx+c$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        주어진 식에서 $x$에 $0$을 대입하면 $f(0)=0=b\times0+c$. 따라서 $c=0$.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\dfrac12bx^{2}=bx+ax^{2}+x$에서 $b+1=0$, $a=\dfrac12b$. $b=-1$, $a=-\dfrac12$.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $f(x)=-x$. $f(a)=f\left(-\dfrac12\right)=\dfrac12$.
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 0
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f(x)=bx+c$(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $f(0)=0$ 또는 $f(x)=bx$(채점기준 3점).
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $b=-1$, $a=-\frac12$(채점기준 3점).
      depends_on:
      - 1.M1
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A3
      mark_type: A
