stem: |
  첫째항이 $1$이고 공차가 $3$인 등차수열 $\{a_n\}$에 대하여 첫째항부터 제 $n$항까지의 합이 $S_n$일 때, $S_n>\displaystyle\sum_{k=1}^{4}(a_k)^{2}$을 만족시키는 자연수 $n$의 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    자연수 $n$의 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
