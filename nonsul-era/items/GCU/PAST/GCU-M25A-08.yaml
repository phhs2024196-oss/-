    value: '11'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $a_n=3n-2$, $\sum a_k^2=166$, $S_n=\frac{n(3n-1)}2$.
    steps:
    - id: 1a
      content: |
        $n(3n-1)>332\Rightarrow n=11$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      $a_1,a_2,a_3,a_4$를 직접 써 보자.
  - id: S1-B
    audience: B
    source_flow: 답안지(A형).hwp 문항카드(A8) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_n=1+(n-1)\times3=3n-2$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\sum_{k=1}^{4}(a_k)^2=\sum_{k=1}^4(3k-2)^2=1+4^2+7^2+10^2=166$
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $S_n=\dfrac{n\{2+(n-1)\times3\}}{2}=\dfrac{n(3n-1)}{2}$
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        $\dfrac{n(3n-1)}{2}>166$, 즉 $n(3n-1)>332$이므로 $n=10$일 때 $290$, $n=11$일 때 $352$이다. 따라서 최솟값은 $n=11$.
      criteria:
      - 1.A3
