intent: |
  자연수 거듭제곱의 합 이해(문항카드 출제 의도 원문). $\sum_{k=1}^{4}a_k^2=166$을 계산하고 $S_n=\frac{n(3n-1)}{2}>166$인 최소 $n$을 찾는다.
key_idea: |
  $n(3n-1)>332$를 만족하는 최소 자연수 $n$은 $n=11$ ($10\cdot29=290$, $11\cdot32=352$).
stuck: |
  부등식 $n(3n-1)>332$의 경계를 정확히 확인하는 것.
