stem: |
  $1$이 아닌 두 양수 $a$, $b\ (a\neq b)$가 $\log_{a}b:\log_{b}a=\log_{a}\dfrac{a^{3}}{b}:2$를 만족시킬 때, $\log_{a}b+\log_{b}\dfrac{1}{a}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\log_ab+\log_b\frac1a$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: |
      -\frac{5}{6}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $X=\log_ab$로 두면 $2X=\frac{3-X}{X}$.
    steps:
    - id: 1a
      content: |
        $2X^2+X-3=0$, $X=-\frac32$, 값 $X-\frac1X=-\frac56$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $\log_ba$와 $\log_a\frac{a^3}{b}$를 $\log_ab$로 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: 답안지(B형).hwp 문항카드(수학 5번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\log_ab:\log_ba=\log_a\dfrac{a^3}{b}:2$에서 $\log_ab:\log_ba=(3-\log_ab):2$.
        따라서 $2\log_ab=\dfrac{1}{\log_ab}(3-\log_ab)$이므로 $2(\log_ab)^2=3-\log_ab$. 정리하면 $2(\log_ab)^2+\log_ab-3=0$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $2(\log_ab)^2+\log_ab-3=(2\log_ab+3)(\log_ab-1)=0$이므로 $\log_ab=-\dfrac32$ 또는 $\log_ab=1$. $a\neq b$이므로 $\log_ab=-\dfrac32$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $\log_ab+\log_b\dfrac1a=\log_ab-\log_ba=\log_ab-\dfrac{1}{\log_ab}=-\dfrac32+\dfrac23=-\dfrac56$
      criteria:
      - 1.A2
