intent: |
  로그법칙의 이해(문항카드 출제 의도 원문). $\log_ab=X$로 놓아 비례식을 $X$에 대한 이차방정식으로 바꾸고 $a\neq b$로 근을 고른다.
key_idea: |
  $\log_ba=\frac1X$, $\log_a\frac{a^3}{b}=3-X$이므로 $2X^2+X-3=0$.
stuck: |
  비례식 $p:q=r:s\iff ps=qr$로 바꾸는 단계와 $a\neq b$로 $X=1$을 배제하는 것.
