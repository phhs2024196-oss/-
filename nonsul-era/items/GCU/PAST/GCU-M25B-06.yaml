  무한대에서의 극한의 이해 확인(문항카드 출제 의도 원문). 망원합으로 $f(x)=\frac{5}{(x+1)(x+6)}$를 얻고 극한 조건으로 $g$의 최고차항 계수, 근과 계수의 관계로 나머지 계수를 정한다.
key_idea: |
