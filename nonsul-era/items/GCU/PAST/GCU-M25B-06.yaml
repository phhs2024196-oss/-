stimuli: []
stem: |
  함수 $f(x)=\displaystyle\sum_{k=1}^{5}\frac{1}{(x+k)(x+k+1)}$에 대해 $g(x)$는 $\displaystyle\lim_{x\to\infty}f(x)g(x)=10$을 만족시키는 이차함수이다. $\alpha$, $\beta$가 방정식 $g(x)=0$의 서로 다른 두 실근이고 $\alpha+\beta=-2$, $\alpha\beta=-1$을 만족할 때, $g(x)$의 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $g(x)$의 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=\frac{5}{(x+1)(x+6)}$ → $g$의 최고차항 계수 2.
    steps:
    - id: 1a
      content: |
        $g(x)=2x^2+4x-2=2(x+1)^2-4$, 최솟값 $-4$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - 각 항을 두 분수의 차로 써 보자.
  - id: S1-B
    audience: B
    source_flow: 답안지(B형).hwp 문항카드(수학 6번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\displaystyle\sum_{k=1}^5\frac{1}{(x+k)(x+k+1)}=\frac{1}{x+1}-\frac{1}{x+6}=\frac{5}{(x+1)(x+6)}$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to\infty}f(x)g(x)=10$이므로 $g(x)=2x^2+bx+c$라 놓을 수 있다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\alpha$, $\beta$가 방정식 $g(x)=0$의 서로 다른 두 실근이므로 근과 계수의 관계로부터 $\alpha+\beta=-\dfrac b2=-2$, $\alpha\beta=\dfrac c2=-1$이므로 $b=4$, $c=-2$.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        따라서 $g(x)=2x^2+4x-2=2(x+1)^2-4$이므로, 최솟값은 $g(-1)=-4$.
      criteria:
      - 1.A3
