stimuli: []
stem: |
  다항함수 $f(x)$에 대하여, $\displaystyle\lim_{x\to\infty}\frac{f(x)}{2x^{2}+3}=2$일 때, 함수 $g(x)$를 $g(x)=\begin{cases}f(x-1)-f(x) & (x<1)\\ f(x-1) & (x\ge1)\end{cases}$ 이라 하자. 함수 $g(x)$가 $x=1$에서 미분가능할 때, $f(3)$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $f(3)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '16'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=4x^2+ax+b$, 연속 → $a+b=-4$, 미분가능 → $a=-8$.
    steps:
    - id: 1a
      content: |
        $f(x)=4x^2-8x+4$, $f(3)=16$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.A3
    hint_ladder:
    - |
      극한 조건에서 $f$의 차수와 최고차항 계수는?
  - id: S1-B
    audience: B
    source_flow: 답안지(B형).hwp 문항카드(수학 7번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 $\displaystyle\lim_{x\to\infty}\frac{f(x)}{2x^2+3}=2$로부터 $f(x)=4x^2+ax+b$라고 하면 ($a$, $b$는 상수)
        $g(x)=\begin{cases}-8x+4-a & (x<1)\\ 4(x-1)^2+a(x-1)+b & (x\ge1)\end{cases}$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $g(x)$가 $x=1$에서 미분가능하므로 $x=1$에서 연속이다. 따라서 $\displaystyle\lim_{x\to1-}g(x)=-4-a=b=\lim_{x\to1+}g(x)$이므로 $a+b=-4$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $g(x)$가 $x=1$에서 미분가능하므로 $\displaystyle\lim_{x\to1-}\frac{g(x)-g(1)}{x-1}=-8=a=\lim_{x\to1+}\frac{g(x)-g(1)}{x-1}$이므로 $a=-8$, $b=4$이다.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        따라서 $f(x)=4x^2-8x+4$이므로 $f(3)=16$이다.
      criteria:
      - 1.A3
