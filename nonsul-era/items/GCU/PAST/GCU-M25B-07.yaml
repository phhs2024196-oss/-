    wrong_work: |
      극한 조건에서 $f$의 최고차항 계수를 2로 둠($f(x)=2x^2+ax+b$)
    detect_cue: |
      $f(3)$이 16이 아닌 값($a=-4$, $b=0$ 등)
    feedback: |
      $\frac{f(x)}{2x^2+3}\to2$이면 $f$의 최고차항 계수는 $2\times2=4$입니다.
