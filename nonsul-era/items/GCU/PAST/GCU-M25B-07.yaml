intent: |
  함수의 극한, 연속과 미분가능의 개념에 대한 이해 확인(문항카드 출제 의도 원문). 극한 조건으로 $f(x)=4x^2+ax+b$로 놓고, $x=1$에서의 연속·미분가능 조건으로 $a$, $b$를 정한다.
key_idea: |
  $x<1$에서 $g(x)=f(x-1)-f(x)=-8x+4-a$ (일차식), $x\ge1$에서 $g(x)=4(x-1)^2+a(x-1)+b$.
stuck: |
  $f(x-1)-f(x)$를 전개해 일차식으로 정리하는 계산.
