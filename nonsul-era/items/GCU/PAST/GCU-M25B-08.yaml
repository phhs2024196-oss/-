stem: |
  네 점 $\mathrm{O}(0,0)$, $\mathrm{A}(1,0)$, $\mathrm{B}(1,1)$, $\mathrm{C}(0,1)$을 꼭짓점으로 하는 정사각형 $\mathrm{OABC}$가 있다. $-1<t<1$인 실수 $t$에 대하여 직선 $y=x+t\ (0\le x\le1)$ 위의 $x$좌표가 $0$, $1$인 점을 각각 $\mathrm{P}$, $\mathrm{Q}$라 하고 점 $\mathrm{Q}$에서 $y$축에 내린 수선의 발을 $\mathrm{R}$이라 할 때, 직선 $y=x+t\ (0\le x\le1)$과 두 선분 $\mathrm{PR}$, $\mathrm{QR}$로 둘러싸인 부분의 내부와 사각형 $\mathrm{OABC}$의 내부의 공통부분의 넓이를 $S(t)$라 하자. 보기에서 옳은 것만을 있는 대로 고르는 과정을 서술하시오.

  보기
  ㄱ. $S(0)=\dfrac{1}{2}$
  ㄴ. $-1<\alpha<0$인 모든 실수 $\alpha$에 대하여 $S(\alpha)+S(1+\alpha)=\dfrac{2}{3}$이다.
