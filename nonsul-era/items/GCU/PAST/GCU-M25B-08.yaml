  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $t<0$과 $t\ge0$으로 나눠 $S(t)$를 구한다.
    steps:
    - id: 1a
      content: |
        $S(\alpha)+S(1+\alpha)=\frac12(1-\alpha^2)+\frac12\alpha^2=\frac12$ → ㄱ만 참
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - |
      $t=0$일 때 삼각형 PQR은 어디에 놓이는가?
  - id: S1-B
    audience: B
    source_flow: 답안지(B형).hwp 문항카드(수학 8번) 5. 문항 해설·6. 채점 기준
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        ㄱ. $S(0)=1-\displaystyle\int_0^1x\,dx=\frac12$ 이므로 $S(0)=\dfrac12$로 옳다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ㄴ. $-1<t<0$일 때 $S(t)=\dfrac12(1-t^2)$이고 $0\le t<1$일 때 $S(t)=\dfrac12(1-t)^2$.
        따라서 $-1<\alpha<0$인 모든 실수 $\alpha$에 대하여 $S(\alpha)+S(1+\alpha)=\dfrac12$이므로 $S(\alpha)+S(1+\alpha)=\dfrac23$는 옳지 않다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        옳은 것은 ㄱ.
      criteria:
      - 1.A2
