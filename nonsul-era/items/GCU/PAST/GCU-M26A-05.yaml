stimuli: []

stem: |
  부등식 $\left(\dfrac{1}{3}\right)^{x+2}<27<\left(\dfrac{1}{9}\right)^{3x}$을 만족시키는 모든 정수 $x$의 합을 $M$이라 하고, 모든 정수 $x$의 곱을 $N$이라 하자. $\log|M|^{N}$의 값을 구하는 과정을 서술하시오.

subparts:
- id: '1'
  stem: |
    $\log|M|^{N}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '24', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 밑을 3으로 맞춰 $-5<x<-\tfrac12$를 얻고 정수 $-4,-3,-2,-1$의 합·곱을 구한다.
    steps:
    - {id: 1a, content: '$-5<x<-\tfrac12\Rightarrow M=-10,\ N=24,\ \log 10^{24}=24$', criteria: ['1.M1', '1.A1', '1.A2', '1.A3']}
    hint_ladder:
    - $\frac13$과 $\frac19$를 모두 3의 거듭제곱으로 써 보자.
  - id: S1-B
    audience: B
    source_flow: 해설지_A형 문항카드(수학 모의고사 A형 5번) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 부등식은 $3^{-(x+2)}<3^{3}<3^{-6x}$이고 밑 $3>1$이므로
        ① $-x-2<3$에서 $x>-5$, ② $3<-6x$에서 $x<-\dfrac12$.
        $\therefore\ -5<x<-\dfrac12$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        모든 정수 $x$의 합: $M=-10$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        모든 정수 $x$의 곱: $N=(-4)\times(-3)\times(-2)\times(-1)=24$
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $\log|M|^{N}=\log 10^{24}=24$
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        밑을 3으로 통일해 $-5<x<-\dfrac12$을 구했다(채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $M=-10$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $N=(-4)\times(-3)\times(-2)\times(-1)=24$(채점기준 3점).
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        $\log|M|^{N}=\log10^{24}=24$(채점기준 1점).
      depends_on: [1.M1, 1.A1, 1.A2]
      steps: [1b-4]
    deductions: []
