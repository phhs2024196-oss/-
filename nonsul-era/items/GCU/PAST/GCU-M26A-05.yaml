intent: |
  지수 부등식을 이해한다(문항카드 출제 의도 원문). 밑을 3으로 통일해 연립부등식을 풀고, 정수해의 합·곱으로 로그 값을 계산한다.
key_idea: |
  $\left(\frac13\right)^{x+2}=3^{-(x+2)}$, $\left(\frac19\right)^{3x}=3^{-6x}$로 밑을 3으로 맞추면 밑이 1보다 크므로 지수끼리 비교한다.
stuck: |
  밑이 $\frac13$, $\frac19$인 채로 비교하면 부등호 방향을 뒤집어야 하는데, 이를 놓치기 쉽다.
