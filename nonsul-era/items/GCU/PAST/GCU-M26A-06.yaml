stimuli: []
stem: |
  함수 $f(x)=\dfrac{1}{2}x^{2}-x+k$에 대하여 함수 $g(x)=\dfrac{1}{\{f(x)\}^{2}+3xf(x)}$가 실수 전체의 집합에서 연속이 되도록 하는 실수 $k$의 범위를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $g(x)$가 실수 전체의 집합에서 연속이 되도록 하는 실수 $k$의 범위를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: k>2, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 분모 $f(x)\{f(x)+3x\}$가 0이 되지 않도록 두 이차식의 판별식을 모두 음수로 만든다.
    steps:
    - {id: 1a, content: '$1-2k<0$, $1-\frac k2<0$의 공통부분 $k>2$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - 분모를 $f(x)$로 묶어 보자.
    - 최고차항 계수가 양수인 이차식이 0이 되지 않으려면?
  - id: S1-B
    audience: B
    source_flow: 해설지_A형 문항카드(수학 모의고사 A형 6번) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g(x)$가 실수 전체의 집합에서 연속이려면 모든 실수 $x$에 대하여 $f(x)\{f(x)+3x\}\ne0$이어야 한다. 즉, $f(x)=\dfrac12x^2-x+k\ne0$이고 $f(x)+3x=\dfrac12x^2+2x+k\ne0$이어야 한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        모든 실수 $x$에 대하여 $\dfrac12x^2-x+k\ne0$이려면 $\dfrac12x^2-x+k>0$이므로 판별식 $D_1=1-2k<0$이고, $k>\dfrac12$이다.
      criteria: [1.A2]
    - id: 1b-3
      content: |
        마찬가지로 $\dfrac12x^2+2x+k>0$이므로 판별식 $\dfrac{D_2}{4}=1-\dfrac k2<0$이고, $k>2$이다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        따라서 공통부분은 $k>2$이다.
      criteria: [1.A2]
