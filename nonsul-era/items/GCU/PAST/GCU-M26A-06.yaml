intent: |
  함수의 연속 이해(문항카드 출제 의도 원문). 분모가 0이 되지 않을 조건을 두 이차식의 판별식 조건으로 바꾸어 공통 범위를 구한다.
key_idea: |
  $g(x)=\dfrac{1}{f(x)\{f(x)+3x\}}$가 실수 전체에서 연속 $\iff$ 모든 실수 $x$에서 $f(x)\ne0$이고 $f(x)+3x\ne0$. 최고차항 계수가 양수인 두 이차식이 항상 양수일 조건(판별식 $<0$)의 공통부분을 잡는다.
stuck: |
  $\{f(x)\}^2+3xf(x)$를 $f(x)\{f(x)+3x\}$로 인수분해하지 않고 4차식 그대로 다루면 막힌다. 또 두 조건 중 하나만 쓰고 끝내기 쉽다.
