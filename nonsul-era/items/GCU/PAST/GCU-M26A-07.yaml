stem: |
  $\overline{\rm BC}=4$인 삼각형 ${\rm ABC}$가 다음 조건을 만족시킬 때, 삼각형 ${\rm ABC}$의 넓이를 구하는 과정을 서술하시오.

  (가) $3\sin A=2\sin C$

  (나) $\sin A+2\sin C=2\sin B$
subparts:
- id: '1'
  stem: |
    삼각형 ${\rm ABC}$의 넓이를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3\sqrt{15}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 사인의 비를 변의 비로 바꿔 $b=8$, $c=6$을 얻고 코사인법칙·넓이 공식을 쓴다.
    steps:
    - {id: 1a, content: '$b=8,\ c=6,\ \cos B=-\tfrac14,\ \sin B=\tfrac{\sqrt{15}}4,\ S=3\sqrt{15}$', criteria: [1.M1, 1.A1, 1.A2, 1.A3]}
    hint_ladder:
    - (가)를 (나)에 대입하면 $\sin B$와 $\sin A$의 관계가 나온다.
    - 사인법칙 $\frac{a}{\sin A}=\frac{b}{\sin B}$를 쓰자.
  - id: S1-B
    audience: B
    source_flow: 해설지_A형 문항카드(수학 모의고사 A형 7번) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 두 조건으로부터 $\sin B=2\sin A$이다. 이를 사인법칙 $\dfrac{4}{\sin A}=\dfrac{b}{\sin B}=\dfrac{c}{\sin C}$에 대입하여 정리하면 $b=8$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        또한, $\dfrac{4}{\sin A}=\dfrac{c}{\sin C}=\dfrac{c}{\frac32\sin A}$이므로 $c=6$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        이를 코사인법칙에 대입하면 $64=36+16-2\times6\times4\times\cos B$이므로 $\cos B=-\dfrac14$. 따라서 $\sin B=\sqrt{1-\cos^2B}=\dfrac{\sqrt{15}}{4}$.
      criteria: [1.A2]
    - id: 1b-4
      content: |
        삼각형 ${\rm ABC}$의 넓이 $S$는 $S=\dfrac12ca\sin B=12\times\dfrac{\sqrt{15}}{4}=3\sqrt{15}$.
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
