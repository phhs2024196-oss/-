intent: |
  사인법칙과 코사인법칙을 활용해서 삼각형의 넓이를 구하는데 필요한 정보를 구하는 방법에 대한 이해 확인(문항카드 출제 의도 원문). 사인 비를 변의 비로 바꾸어 세 변을 정한 뒤 코사인법칙으로 각을 구한다.
key_idea: |
  (가)(나)에서 $\sin B=2\sin A$, $\sin C=\frac32\sin A$ → 사인법칙으로 $b=2a=8$, $c=\frac32a=6$. 코사인법칙으로 $\cos B$를 구하면 넓이가 나온다.
stuck: |
