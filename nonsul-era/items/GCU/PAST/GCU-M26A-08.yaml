stem: |
  함수 $f(x)=x^{2}+ax+b$가 다음 조건을 만족시킬 때, $f(a)$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$는 상수이다.)

  (가) $\displaystyle\sum_{k=1}^{9}\lim_{h\to0}\frac{f(k-3+4h)-f(k-3-2h)}{2h}=0$

  (나) $f(3)=f'(3)$
subparts:
- id: '1'
  stem: |
    $f(a)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '37', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 극한을 $3f'(k-3)$로 바꿔 $a=-4$, (나)에서 $b=5$를 구한다.
    steps:
    - {id: 1a, content: '$3\sum_{k=1}^{9}(2k-6+a)=0\Rightarrow a=-4$, $b=5$, $f(-4)=37$', criteria: [1.M1, 1.A1, 1.A2, 1.A3]}
    hint_ladder:
    - 분자에 $f(k-3)$을 빼고 더해 보자.
    - $f'(x)=2x+a$를 시그마에 넣자.
  - id: S1-B
    audience: B
    source_flow: 해설지_A형 문항카드(수학 모의고사 A형 8번) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{h\to0}\frac{f(k-3+4h)-f(k-3-2h)}{2h}=2\lim_{h\to0}\frac{f(k-3+4h)-f(k-3)}{4h}+\lim_{h\to0}\frac{f(k-3-2h)-f(k-3)}{-2h}=2f'(k-3)+f'(k-3)=3f'(k-3)$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $f'(x)=2x+a$이므로 $\displaystyle\sum_{k=1}^{9}\lim_{h\to0}\frac{f(k-3+4h)-f(k-3-2h)}{2h}=3\sum_{k=1}^{9}(2k-6+a)=3\{9\times10+9(a-6)\}$. $3\{9\times10+9(a-6)\}=0$이므로 $a=-4$, $f(x)=x^2-4x+b$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $f(3)=9-12+b=6-4=f'(3)$이므로 $b=5$, $f(x)=x^2-4x+5$.
      criteria: [1.A2]
    - id: 1b-4
      content: |
        따라서 $f(a)=f(-4)=37$.
      criteria: [1.A3]
