intent: |
  미분의 성질 이해(문항카드 출제 의도 원문). 미분계수의 정의 꼴로 극한을 $3f'(k-3)$으로 바꾸고 시그마 계산으로 계수를 정한다.
key_idea: |
  $\lim_{h\to0}\dfrac{f(k-3+4h)-f(k-3-2h)}{2h}=2f'(k-3)+f'(k-3)=3f'(k-3)$. $f'(x)=2x+a$이므로 (가)는 $a$에 대한 일차방정식.
stuck: |
  분자에 $f(k-3)$을 빼고 더하는 변형을 못 하면 극한을 미분계수로 바꾸지 못한다.
