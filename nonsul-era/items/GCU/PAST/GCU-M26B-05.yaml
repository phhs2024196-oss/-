stem: |
  다항함수 $f(x)$가 다음 조건을 만족시킬 때, $f(k)$의 값을 구하는 과정을 서술하시오. (단, $k$는 상수이다.)

  (가) $\displaystyle\lim_{x\to\infty}\frac{f(x)+x^{3}}{x+1}=k$

  (나) $\displaystyle\lim_{x\to-1}\frac{f(x)-x^{3}}{x+1}=f(1)$
subparts:
- id: '1'
  stem: |
    $f(k)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '31', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (가)로 $f(x)=-x^3+kx+a$, (나)로 $a=k-2$와 $k-6=2k-3$.
    steps:
    - {id: 1a, content: '$f(x)=-x^3+kx+k-2,\ k=-3,\ f(-3)=31$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $\frac{f(x)+x^3}{x+1}$이 수렴하려면 분자의 차수는?
    - $x\to-1$에서 분모가 0으로 간다.
  - id: S1-B
    audience: B
    source_flow: 해설지_B형 문항카드(수학 모의고사 B형 5번) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{x\to\infty}\frac{f(x)+x^{3}}{x+1}=k$에서 $f(x)=-x^3+kx+a$($a$는 상수)로 놓을 수 있다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to-1}\frac{f(x)-x^{3}}{x+1}=f(1)$에서 분모가 0으로 가고 극한값이 존재하므로, $\displaystyle\lim_{x\to-1}\{f(x)-x^3\}=\lim_{x\to-1}(-2x^3+kx+a)=0$이고, 따라서 $a=k-2$이다.
      criteria: [1.A2]
    - id: 1b-3
      content: |
        $\displaystyle\lim_{x\to-1}\frac{f(x)-x^{3}}{x+1}=\lim_{x\to-1}\frac{-2x^3+kx+k-2}{x+1}=\lim_{x\to-1}\frac{(x+1)(-2x^2+2x+k-2)}{x+1}=k-6$
      criteria: [1.A1]
    - id: 1b-4
      content: |
        $f(1)=2k-3=k-6$이므로 $k=-3$이고 $f(k)=31$이다.
      criteria: [1.A2]
