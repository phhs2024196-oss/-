  materials:
  - 다항함수 $f(x)$
  - (가) $\lim_{x\to\infty}\frac{f(x)+x^3}{x+1}=k$
  - (나) $\lim_{x\to-1}\frac{f(x)-x^3}{x+1}=f(1)$
  concepts:
  - 함수의 극한
  - $\frac{\infty}{\infty}$ 꼴 극한과 차수
  - $\frac00$ 꼴 극한(분모 $\to0$이면 분자 $\to0$)
  tools:
  - 최고차항 비교로 $f(x)=-x^3+kx+a$
  - 인수분해 $(x+1)(-2x^2+2x+k-2)$
  conditions:
  - $f(x)$는 다항함수
  - $k$는 상수
