intent: |
  극한을 이용한 함수 구하기(문항카드 출제 의도 원문). $x\to\infty$ 극한으로 차수와 계수를, $x\to-1$ 극한(분모 $\to0$)으로 상수항을 정한다.
key_idea: |
  (가)에서 $f(x)+x^3$은 일차 이하이고 일차항 계수가 $k$ → $f(x)=-x^3+kx+a$. (나)에서 분모 $\to0$이므로 분자 $\to0$, $a=k-2$; 인수분해로 극한 $k-6=f(1)=2k-3$.
stuck: |
  (가)에서 $f(x)$의 꼴을 정하지 못하거나, (나)에서 분자 $\to0$ 조건을 쓰지 않으면 막힌다.
