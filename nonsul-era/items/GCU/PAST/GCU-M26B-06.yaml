stimuli: []
stem: |
  함수 $f(x)=a\sin(2x+1)+\dfrac12$의 최솟값이 $-1$이고 $\sin\theta+\cos\theta=-\dfrac{a}{3}$일 때, $\cos^3\theta(\tan^3\theta+1)$의 값을 구하는 과정을 서술하시오. (단, $a$는 양수이다.)
subparts:
- id: '1'
  stem: |
    $\cos^3\theta(\tan^3\theta+1)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-\frac{11}{16}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a=\frac32$, $\sin\theta\cos\theta=-\frac38$, 세제곱 합 공식.
    steps:
    - {id: 1a, content: '$-\frac12\left(1+\frac38\right)=-\frac{11}{16}$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $a>0$일 때 $a\sin(\cdot)$의 최솟값은 $-a$.
    - $\cos^3\theta\tan^3\theta=\sin^3\theta$.
  - id: S1-B
    audience: B
    source_flow: 해설지_B형 문항카드(수학 모의고사 B형 6번) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$의 최솟값이 $-1$이고 $a$가 양수이므로 $a=\dfrac32$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 $\sin\theta+\cos\theta=-\dfrac12$이고 양변을 제곱하여 정리하면 $\sin\theta\cos\theta=-\dfrac38$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        결국 $\cos^3\theta(\tan^3\theta+1)=\sin^3\theta+\cos^3\theta=(\sin\theta+\cos\theta)(\sin^2\theta-\sin\theta\cos\theta+\cos^2\theta)=-\dfrac12\left(1+\dfrac38\right)=-\dfrac{11}{16}$
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
