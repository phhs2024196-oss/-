intent: |
  삼각함수의 그래프와 삼각함수 사이의 관계에 대한 이해 확인(문항카드 출제 의도 원문). 최솟값으로 $a$를 정하고 $\sin\theta\cos\theta$를 구해 세제곱의 합 공식을 쓴다.
key_idea: |
  $a>0$이면 최솟값 $-a+\frac12=-1$, $a=\frac32$. $\cos^3\theta(\tan^3\theta+1)=\sin^3\theta+\cos^3\theta=(\sin\theta+\cos\theta)(1-\sin\theta\cos\theta)$.
stuck: |
  $\cos^3\theta(\tan^3\theta+1)$을 $\sin^3\theta+\cos^3\theta$로 바꾸는 것을 놓치면 막힌다.
