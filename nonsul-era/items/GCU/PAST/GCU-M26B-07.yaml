  적분의 성질 이해(문항카드 출제 의도 원문). 대칭 구간 적분으로 짝수차항 계수를 없애고, 정적분으로 정의된 함수의 극한을 미분계수로 바꾼다.
key_idea: |
  (가) $\int_{-x}^{x}f(t)dt=2\left(\frac a3x^3+cx\right)=0$ → $a=c=0$. (나) $\frac{1}{x^2-4}\int_2^x(3x-t)f(t)dt$를 $\frac{3x}{x+2}\cdot\frac1{x-2}\int_2^xf-\frac1{x+2}\cdot\frac1{x-2}\int_2^xtf$로 나눠 $f(2)$를 얻는다.
stuck: |
  (나)에서 피적분함수의 $x$를 적분 밖으로 빼내지 않으면 극한을 처리하지 못한다.
