      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        $\displaystyle\int_a^bf(x)\,dx=8$ (채점기준 1점).
      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-4]
    deductions: []
