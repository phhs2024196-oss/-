stimuli: []
stem: |
  함수 $f(x)=x^{3}+ax^{2}+bx+c$가 다음 조건을 만족시킬 때, $\displaystyle\int_{a}^{b}f(x)\,dx$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$, $c$는 상수이다.)

  (가) 모든 실수 $x$에 대하여 $\displaystyle\int_{-x}^{x}f(t)\,dt=0$

  (나) $\displaystyle\lim_{x\to2}\frac{1}{x^{2}-4}\int_{2}^{x}(3x-t)f(t)\,dt=12$
subparts:
- id: '1'
  stem: |
    $\displaystyle\int_{a}^{b}f(x)\,dx$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (가)로 $a=c=0$, (나)의 극한이 $f(2)$임을 보여 $b=2$.
    steps:
    - {id: 1a, content: '$f(x)=x^3+2x$, $\int_0^2(x^3+2x)dx=8$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $x^3$, $x$는 기함수, $x^2$, 상수는 우함수.
    - $(3x-t)f(t)$에서 $3x$는 적분변수와 무관하다.
  - id: S1-B
    audience: B
    source_flow: 해설지_B형 문항카드(수학 모의고사 B형 7번) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        모든 실수 $x$에 대하여 $\displaystyle\int_{-x}^{x}f(t)\,dt=2\int_0^x(at^2+c)\,dt=2\left(\frac a3x^3+cx\right)=0$이므로 $a=c=0$, $f(x)=x^3+bx$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to2}\frac{1}{x^{2}-4}\int_{2}^{x}(3x-t)f(t)\,dt=\lim_{x\to2}\left\{\frac{3x}{x+2}\times\frac{1}{x-2}\int_2^xf(t)\,dt\right\}-\lim_{x\to2}\left\{\frac{1}{x+2}\times\frac1{x-2}\int_2^xtf(t)\,dt\right\}=\frac64\times f(2)-\frac14\times2f(2)=f(2)$.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $f(2)=8+2b=12$, $b=2$, $f(x)=x^3+2x$.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        $\displaystyle\int_a^bf(x)\,dx=\int_0^2f(x)\,dx=\int_0^2(x^3+2x)\,dx=\left[\frac{x^4}{4}+x^2\right]_0^2=8$.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
