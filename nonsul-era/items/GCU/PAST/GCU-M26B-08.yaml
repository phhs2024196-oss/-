intent: |
  수열의 귀납적 정의에 대하여 이해한다(문항카드 출제 의도 원문). $a_7=15$에서 거꾸로 각 경우의 정수 조건과 범위 조건을 확인하며 $a_1$을 모두 찾는다.
key_idea: |
  역추적: $a_{n+1}=-3a_n+8$ ($a_n<5$) 또는 $a_n-n+3$ ($a_n\ge5$). 각 단계에서 정수 조건과 경우 조건(부등식)을 모두 확인한다. $a_6=18$, $a_5=20$, $a_4=21$ ($-4$는 $a_2$가 없어 탈락), $a_3=21$, $a_2=20$, $a_1=-4$ 또는 $18$.
stuck: |
  역으로 구한 값이 그 경우의 조건($a_n<5$ 또는 $a_n\ge5$)을 만족하는지 확인하지 않거나, 막다른 가지($a_4=-4$)를 끝까지 따라가지 않으면 틀린다.
