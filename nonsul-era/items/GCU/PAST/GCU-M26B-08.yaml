stimuli: []
stem: |
  모든 항이 정수인 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여

  $$a_{n+1}=\begin{cases}-3a_n+8 & (a_n<5\text{인 경우})\\ a_n-n+3 & (a_n\ge5\text{인 경우})\end{cases}$$

  를 만족시킨다. $a_7=15$가 되도록 하는 모든 $a_1$의 값의 합을 구할 때, < 보기 > 에서 옳은 것만을 있는 대로 고르는 과정을 서술하시오.

  < 보기 >

  ㄱ. $a_4=-4$를 가질 수 있다.

  ㄴ. $a_7=15$가 되도록 하는 모든 $a_1$의 값의 합은 $14$이다.
subparts:
- id: '1'
  stem: |
    < 보기 > 에서 옳은 것만을 있는 대로 고르는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: choice, value: ㄴ, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_7$부터 거꾸로, 정수·범위 조건을 확인하며 가지를 친다.
    steps:
    - {id: 1a, content: '$a_6=18,a_5=20,a_4\in\{-4,21\}$; $a_4=-4$는 $a_2$ 없음(ㄱ 거짓); $a_1\in\{-4,18\}$, 합 14(ㄴ 참)', criteria: [1.M1, 1.A1, 1.A2, 1.A3]}
    hint_ladder:
    - $-3a_6+8=15$를 만족하는 정수 $a_6$이 있는가?
    - $a_4=-4$에서 $a_3$, $a_2$를 끝까지 따라가 보자.
  - id: S1-B
    audience: B
    source_flow: 해설지_B형 문항카드(수학 모의고사 B형 8번) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_7=15$에서 $-3a_6+8=15$이면 $a_6$이 정수가 아니므로 $a_6-6+3=15$, $a_6=18$. 마찬가지 방법으로 $a_5=20$. $a_5=20$에서 $-3a_4+8=20$ 또는 $a_4-4+3=20$이므로 $a_4=-4$ 또는 $21$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $a_4=-4$일 때 $a_3=4$를 가질 수 있으나 주어진 조건을 만족하는 $a_2$가 존재하지 않으므로 $a_4=-4$가 성립하지 않는다. ㄱ은 거짓.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $a_4=21$일 때 $a_3=21$, $a_2=20$. $a_2=20$에서 $-3a_1+8=20$이면 $a_1=-4$ ($a_1<5$), $a_1-1+3=20$이면 $a_1=18$ ($a_1\ge5$).
      criteria: [1.A1]
    - id: 1b-4
      content: |
        따라서 가질 수 있는 모든 $a_1$의 값은 $-4$, $18$이므로 모든 $a_1$의 값의 합은 $14$이다.
      criteria: [1.A2]
    - id: 1b-5
      content: |
        ㄴ은 참. 옳은 것은 ㄴ.
      criteria: [1.A3]
