stimuli: []
stem: |
  좌표평면 위를 움직이는 점 ${\rm P}$의 시각 $t\left(0<t<\dfrac{\pi}{2}\right)$에서의 위치 $(x,y)$가

  $$x=2\cos t+2\sqrt{3}\,a\sin^{2}t,\quad y=\frac{\sqrt{3}}{32}(\tan t+a\cot t)$$

  이다. $0<t<\dfrac{\pi}{2}$에서 점 ${\rm P}$의 속력이 $0$인 순간이 존재할 때, 이 순간 점 ${\rm P}$의 가속도의 크기를 $b$라 하자. $a$와 $b$의 값을 구하는 과정을 서술하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $a$와 $b$의 값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: expression, value: 'a=\frac13,\ b=\frac23', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 속도 성분을 동시에 0으로 놓고 $\sec t$, $\tan t$를 연결한다.
    steps:
    - {id: 1a, content: '$a=\frac13$, $t=\frac\pi6$, $b=\sqrt{\frac13+\frac19}=\frac23$', criteria: [1.M1, 1.A1, 1.A2, 1.A3, 1.A4]}
    hint_ladder:
    - 속력이 0이면 $\frac{dx}{dt}$와 $\frac{dy}{dt}$가 모두 0이다.
    - $\tan^2t=\sec^2t-1$.
  - id: S1-B
    audience: B
    source_flow: 해설지_의예과 문항카드 1(의예 모의 문제 1) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\dfrac{dx}{dt}=-2\sin t+4\sqrt3a\sin t\cos t=-2\sin t(1-2\sqrt3a\cos t)$, $\dfrac{dy}{dt}=\dfrac{\sqrt3}{32}(\sec^2t-a\csc^2t)$. 속력이 0일 때 $\dfrac{dx}{dt}=0$이고 $\dfrac{dy}{dt}=0$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $-2\sin t(1-2\sqrt3a\cos t)=0$에서 $\sin t\ne0$ $\left(0<t<\dfrac\pi2\right)$이므로 $1-2\sqrt3a\cos t=0$이다. $\cos t=\dfrac{1}{2\sqrt3a}$, 즉 $\sec t=2\sqrt3a$. $\dfrac{\sqrt3}{32}(\sec^2t-a\csc^2t)=0$에서 $\tan^2t=a$이고 $a>0$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $a=\tan^2t=\sec^2t-1=12a^2-1$로부터 $12a^2-a-1=0$, $(3a-1)(4a+1)=0$. $a>0$이므로 $a=\dfrac13$.
      criteria: [1.A2]
    - id: 1b-4
      content: |
        $\cos t=\dfrac{1}{2\sqrt3a}=\dfrac{\sqrt3}{2}$이므로 $t=\dfrac\pi6$이다. $\dfrac{d^2x}{dt^2}=-2\cos t+\dfrac{4\sqrt3}{3}\cos2t$, $\dfrac{d^2y}{dt^2}=\dfrac{\sqrt3}{32}\left(2\sec^2t\tan t+\dfrac23\csc^2t\cot t\right)$.
      criteria: [1.A3]
    - id: 1b-5
      content: |
        $t=\dfrac\pi6$에서 가속도의 크기 $b$는
        $$b=\sqrt{\left(-2\cos\frac\pi6+\frac{4\sqrt3}{3}\cos\frac\pi3\right)^2+\left\{\frac{\sqrt3}{16}\left(\sec^2\frac\pi6\tan\frac\pi6+\frac13\csc^2\frac\pi6\cot\frac\pi6\right)\right\}^2}=\sqrt{\left(-\frac{\sqrt3}{3}\right)^2+\left\{\frac{\sqrt3}{16}\left(\frac{4}{3\sqrt3}+\frac{4\sqrt3}{3}\right)\right\}^2}=\sqrt{\frac13+\frac19}=\frac23.$$
        $a=\dfrac13$, $b=\dfrac23$.
      criteria: [1.A4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        두 속도 성분 $\dfrac{dx}{dt}$, $\dfrac{dy}{dt}$를 구하고 속력 0 ⇔ 두 성분이 모두 0임을 씀. 학교 채점기준 미공개(해설지_의예과에 6. 채점 기준 없음) — 문항 해설 흐름에 따라 작성한 자체 배점.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $\sec t=2\sqrt3a$ (또는 $\cos t=\frac1{2\sqrt3a}$)와 $\tan^2t=a$.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $12a^2-a-1=0$에서 $a=\dfrac13$.
      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: |
        $t=\dfrac\pi6$과 $\dfrac{d^2x}{dt^2}$, $\dfrac{d^2y}{dt^2}$.
      depends_on: [1.M1, 1.A2]
      implied_ok: false
      steps: [1b-4]
    - id: 1.A4
      mark_type: A
      points: 4
      evidence: |
        $b=\dfrac23$.
      depends_on: [1.M1, 1.A3]
      implied_ok: false
      steps: [1b-5]
    deductions: []
