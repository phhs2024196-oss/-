intent: |
  속력과 가속도의 크기 구하기(문항카드 출제 의도 원문). 속력이 0이면 두 속도 성분이 동시에 0임을 이용해 $a$와 그 시각을 구하고, 그 시각의 가속도 크기를 계산한다.
key_idea: |
  $\frac{dx}{dt}=-2\sin t(1-2\sqrt3a\cos t)=0$, $\frac{dy}{dt}=\frac{\sqrt3}{32}(\sec^2t-a\csc^2t)=0$ → $\sec t=2\sqrt3a$, $\tan^2t=a$ → $a=12a^2-1$.
stuck: |
  두 조건을 $1+\tan^2t=\sec^2t$로 연결하지 못하면 $a$가 결정되지 않는다.
