stem: |
  아래와 같이 원점 $O(0,0)$을 지나며 기울기가 양수인 직선 $l$과 곡선 $y=\log_{a}(1+x)$이 만나는 점 중 제 $1$사분면 위의 점을 ${\rm A}$라 하자. 점 ${\rm A}$를 지나고 직선 $l$과 수직인 직선이 $x$축과 만나는 점을 ${\rm B}$라 하고, 점 ${\rm B}$를 지나고 $x$축과 수직인 직선이 $l$과 만나는 점을 ${\rm C}$, 점 ${\rm C}$를 지나고 직선 $l$과 수직인 직선이 $x$축과 만나는 점을 ${\rm D}$라 하자. 이때, $\overline{\rm AB}:\overline{\rm CD}=2:3$을 만족하고 ${\rm A}$의 $x$좌표가 $8$이다. 두 실수 $p$, $q$에 대하여 곡선 $y=\log_{a}(1+x-p)+q$이 두 점 ${\rm A}$, ${\rm C}$를 지날 때, $a$, $p$, $3^{\frac{q}{2\sqrt{2}}}$의 값을 구하는 과정을 서술하시오. (단, $a>1$이다.)

  [그림: 좌표평면에 원점 $O$를 지나는 직선 $l$(오른쪽 위로 증가)과 원점을 지나는 곡선 $y=\log_a(1+x)$가 그려져 있고, 둘은 제1사분면의 점 ${\rm A}$에서 만난다. ${\rm A}$에서 $x$축에 내린 수선의 발이 ${\rm H}$이며 $\overline{O{\rm H}}=8$로 표시되어 있다(점선). ${\rm A}$를 지나 $l$에 수직인 직선이 $x$축과 ${\rm B}$에서 만나고(직각 표시), ${\rm B}$에서 세운 수직선이 $l$과 ${\rm C}$에서 만나며(직각 표시), ${\rm C}$를 지나 $l$에 수직인 직선이 $x$축과 ${\rm D}$에서 만난다. $x$축 위의 순서는 $O$, ${\rm H}$, ${\rm B}$, ${\rm D}$이고 ${\rm C}$는 곡선보다 위에 있다.]
subparts:
- id: '1'
  stem: |
    $a$, $p$, $3^{\frac{q}{2\sqrt{2}}}$의 값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: expression, value: 'a=3^{\frac{1}{2\sqrt2}},\ p=7,\ 3^{\frac{q}{2\sqrt2}}=\frac92', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 닮음으로 $\overline{OB}=12$, 기울기 $\frac{\sqrt2}2$를 얻고, A·C 대입식의 차로 $p$를 구한다.
    steps:
    - {id: 1a, content: 'C$(12,6\sqrt2)$, $\log_a9=4\sqrt2$, $\frac{13-p}{9-p}=3$, $p=7$, $3^{q/(2\sqrt2)}=\frac92$', criteria: [1.M1, 1.A1, 1.A2, 1.A3, 1.A4]}
    hint_ladder:
    - $\triangle OAB$와 $\triangle OCD$는 닮음이다.
    - 두 점 대입식을 빼면 $q$가 사라진다.
  - id: S1-B
    audience: B
    source_flow: 해설지_의예과 문항카드 2(의예 모의 문제 2) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\triangle OAB\sim\triangle OCD$이고 $\overline{AB}:\overline{CD}=2:3$이므로 $\overline{OA}:\overline{OC}=2:3$. $\triangle OAH\sim\triangle OCB$이고 $\overline{OA}:\overline{OC}=2:3$이므로 $\overline{OH}:\overline{OB}=2:3$. $\overline{OH}=8$이므로 $\overline{OB}=12$이다. 따라서 점 C의 $x$좌표는 $12$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\triangle OAH\sim\triangle OBA$이므로 $\overline{OH}:\overline{OA}=\overline{OA}:\overline{OB}$이고 $(\overline{OA})^2=\overline{OH}\cdot\overline{OB}=(8)(12)$. 따라서 $\overline{OA}=4\sqrt6$, $\overline{AH}=4\sqrt2$, $\dfrac{\overline{AH}}{\overline{OH}}=\dfrac{4\sqrt2}{8}=\dfrac{\sqrt2}{2}$이고 직선 $l$의 방정식은 $y=\dfrac{\sqrt2}{2}x$이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        점 A는 $y=\log_a(1+x)$ 위의 점이므로 A의 좌표는 $(8,\log_a9)$, 점 C는 $y=\dfrac{\sqrt2}{2}x$ 위의 점이므로 C의 좌표는 $(12,6\sqrt2)$. $\overline{AH}=4\sqrt2=\log_a9$로부터 $a=3^{\frac{1}{2\sqrt2}}$.
      criteria: [1.A2]
    - id: 1b-4
      content: |
        두 점 A와 C가 곡선 $y=\log_a(1+x-p)+q$ 위에 있기 위해서는 $4\sqrt2=\log_a(9-p)+q$, $6\sqrt2=\log_a(13-p)+q$가 성립해야 한다. 아래 식에서 위의 식을 빼면 $2\sqrt2=\log_a\left(\dfrac{13-p}{9-p}\right)\Rightarrow a^{2\sqrt2}=3^{\frac{2\sqrt2}{2\sqrt2}}=3=\dfrac{13-p}{9-p}$. 따라서 $p=7$.
      criteria: [1.A3]
    - id: 1b-5
      content: |
        $q=4\sqrt2-\log_a2=4\sqrt2-2\sqrt2\log_32=\log_3\left(\dfrac92\right)^{2\sqrt2}$. 최종적으로 $p=7$, $3^{\frac{q}{2\sqrt2}}=\dfrac92$.
      criteria: [1.A4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
