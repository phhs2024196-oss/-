stimuli: []
stem: |
  자연수 $k$와 정수가 아닌 실수 $a$에 대하여 수열 $\{a_n\}$, $\{b_n\}$이 다음을 만족시킨다.

  (가) $\{a_n\}$은 첫째항이 $a$이고, 공차가 $k$인 등차수열이다.

  (나) 모든 자연수 $n$에 대하여 $b_n=\dfrac{a_n+10+|a_n-10|}{2}$이다.

  $\displaystyle\sum_{n=1}^{\infty}\frac{1}{b_nb_{n+1}}$의 값을 $c_k$라 하자. $c_5=\dfrac{17}{500}$일 때, $c_2$, $c_{10}$, $\displaystyle\lim_{k\to\infty}kc_k$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $c_2$, $c_{10}$, $\displaystyle\lim_{k\to\infty}kc_k$의 값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: expression, value: 'c_2=\frac{61}{700},\ c_{10}=\frac{2}{125},\ \lim_{k\to\infty}kc_k=\frac1{10}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $b_n$이 10에서 $a_n$으로 바뀌는 항 번호 $p$로 나눠 급수를 계산한다.
    steps:
    - {id: 1a, content: '$a=\frac52$; $c_2=\frac3{100}+\frac1{105}+\frac1{21}=\frac{61}{700}$; $k\ge8$에서 $c_k=\frac{k+10}{k(10k+25)}$', criteria: [1.M1, 1.A1, 1.A2, 1.A3, 1.A4]}
    hint_ladder:
    - $b_n=\max(a_n,10)$이다.
    - $a_n\ge10$인 항부터는 망원급수가 된다.
  - id: S1-B
    audience: B
    source_flow: 해설지_의예과 문항카드 3(의예 모의 문제 3) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가)에 의해 $a_n=a+(n-1)k$이다. 자연수 $n$에 대하여 만약 $a_n<10$이면 $b_n=\dfrac{a_n+10+(10-a_n)}{2}=10$이고, 만약 $a_n\ge10$이면 $b_n=\dfrac{a_n+10+(a_n-10)}{2}=a_n$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $k=5$일 때, $a+5(n-1)\ge10$을 만족하는 자연수 $n$의 최솟값을 $p$라 하자. $n<p$이면 $b_n=10$이고, $n\ge p$이면 $b_n=a+5(n-1)$이므로
        $$c_5=\begin{cases}\dfrac{1}{5a} & (p=1)\\[2mm] \dfrac{p-2}{100}+\dfrac{1}{10(a+5(p-1))}+\dfrac{1}{5(a+5(p-1))} & (p\ge2)\end{cases}$$
        이다(부분분수 $\frac{1}{(a+k(n-1))(a+kn)}=\frac1k\left(\frac{1}{a+k(n-1)}-\frac{1}{a+kn}\right)$ 이용).
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $c_5=\dfrac{17}{500}$에 대해: $p=1$이면 $a=\dfrac{100}{17}$로 $a+5(p-1)\ge10$에 모순. $p=2$이면 $a=\dfrac{65}{17}$로 역시 모순. $p=3$이면 $a=\dfrac52$이고 $a+5(n-1)\ge10$을 만족시키는 $n$의 최솟값도 3이다. $p\ge4$이면 $\dfrac{3}{10(a+5(p-1))}=\dfrac{17}{500}-\dfrac{p-2}{100}\le\dfrac{7}{500}$에서 $a+5(p-1)\ge\dfrac{150}{7}$, $a+5(p-2)\ge\dfrac{115}{7}>10$이므로 $p$가 최솟값이 아니게 된다. 따라서 $a=\dfrac52$이다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        $k=2$일 때 $\dfrac52+2(n-1)\ge10$을 만족하는 $n$의 최솟값은 $5$이므로 $b_n=10$ $(n<5)$, $b_n=\dfrac52+2(n-1)$ $(n\ge5)$이고
        $$c_2=\frac{3}{100}+\frac{1}{10b_5}+\sum_{n=5}^{\infty}\frac{1}{\left(\frac52+2(n-1)\right)\left(\frac52+2n\right)}=\frac{3}{100}+\frac{1}{105}+\frac{1}{21}=\frac{61}{700}.$$
      criteria: [1.A2]
    - id: 1b-5
      content: |
        $k\ge8$에 대하여 $b_1=10$, $b_n=\dfrac52+(n-1)k$ $(n\ge2)$이므로
        $$c_k=\frac{1}{10b_2}+\sum_{n=2}^{\infty}\frac{1}{\left(\frac52+k(n-1)\right)\left(\frac52+kn\right)}=\frac{1}{10k+25}+\frac{1}{k\left(k+\frac52\right)}=\frac{k+10}{k(10k+25)}.$$
        따라서 $c_{10}=\dfrac{20}{10\times125}=\dfrac{2}{125}$.
      criteria: [1.A3]
    - id: 1b-6
      content: |
        $\displaystyle\lim_{k\to\infty}kc_k=\lim_{k\to\infty}\frac{k(k+10)}{k(10k+25)}=\frac{1}{10}$.
      criteria: [1.A4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $b_n=10$ ($a_n<10$), $b_n=a_n$ ($a_n\ge10$)으로 나누고 경계 항 $p$로 $c_5$를 식으로 나타냄. 학교 채점기준 미공개(해설지_의예과에 6. 채점 기준 없음) — 문항 해설 흐름에 따라 작성한 자체 배점.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: |
        $p$에 대한 경우 분류로 $a=\dfrac52$를 유일하게 결정.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $c_2=\dfrac{61}{700}$.
      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 3
      evidence: |
        $c_{10}=\dfrac{2}{125}$ (또는 $k\ge8$에서 $c_k=\frac{k+10}{k(10k+25)}$).
      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-5]
    - id: 1.A4
      mark_type: A
      points: 3
      evidence: |
        $\displaystyle\lim_{k\to\infty}kc_k=\dfrac1{10}$.
      depends_on: [1.M1, 1.A3]
      implied_ok: false
      steps: [1b-6]
    deductions: []
