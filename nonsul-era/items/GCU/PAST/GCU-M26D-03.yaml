intent: |
  수열의 극한, 급수의 이해(문항카드 출제 의도 원문). $b_n$이 $10$ 또는 $a_n$이 되는 경계 $p$에 따라 급수를 나누어 계산하고, $c_5$ 조건으로 $a$를 정한 뒤 $c_2$, $c_{10}$, $\lim kc_k$를 구한다.
key_idea: |
  $b_n=\max(a_n,10)$. $a_n\ge10$이 되는 첫 항 번호 $p$에 대해 $c_5=\frac{p-2}{100}+\frac{1}{10b_p}+\frac{1}{5b_p}$ ($p\ge2$). $p$별 경우를 따져 $a=\frac52$.
stuck: |
  $p$에 대한 경우 분류(특히 $p\ge4$ 배제)를 하지 않으면 $a$가 유일하게 정해지지 않는다.
