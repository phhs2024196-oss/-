intent: |
  역함수의 그래프가 직선 $y=x$에 대칭임을 활용해서 영역의 넓이를 정적분으로 구하기(문항카드 출제 의도 원문). $f^{-1}$을 삼차함수로 구하고 평행이동·반사한 곡선과 $x=|y|$ 사이 넓이로 바꾼다.
key_idea: |
  $f^{-1}\left(\frac x2+1\right)=g(x)$에서 $f^{-1}(t)=8a(t-1)^3+2b(t-1)+1$. $(-1,-1)$ 평행이동 후 $y=x$ 대칭으로 보면 곡선 $y=8ax^3+2bx$와 $x=|y|$ 사이의 넓이.
stuck: |
  $f$를 직접 구하려 하면 막힌다. 역함수 쪽(삼차함수)에서 넓이를 계산하고 $y=|x|$도 함께 반사해야 한다.
