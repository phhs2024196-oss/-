intent: |
  로그의 밑의 변환의 이해(문항카드 출제 의도 원문). 밑을 3으로 통일해 $a\sqrt b=3^m$ 꼴로 바꾸고 100 이하의 자연수 후보를 센다.
key_idea: |
  $\log_3a+\log_9b=\log_3a\sqrt b=m$ → $a\sqrt b=3^m$. $a\in\{1,3,9,27,81\}$, $b\in\{1,9,81\}$, $a=b=1$ 제외.
stuck: |
  $m$이 자연수(0 제외)라는 조건으로 $a=b=1$을 빼는 것을 잊기 쉽다.
