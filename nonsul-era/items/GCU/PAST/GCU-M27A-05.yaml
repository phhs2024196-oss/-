stimuli: []
stem: |
  $\log_{3}a+\log_{9}b$의 값이 자연수가 되도록 하는 $100$ 이하의 두 자연수 $a$, $b$의 모든 순서쌍 $(a,b)$의 개수를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    모든 순서쌍 $(a,b)$의 개수를 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '14', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 밑을 3으로 통일해 $a\sqrt b=3^m$($m\ge1$).
    steps:
    - {id: 1a, content: $5\times3-1=14$, criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $\log_9b$를 밑이 3인 로그로 바꾸자.
    - $a\sqrt b$가 3의 거듭제곱이어야 한다.
  - id: S1-B
    audience: B
    source_flow: A형_해설_수학 문항카드 [A5] 5. 문항 해설(PDF 2쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\log_3a+\log_9b=\log_3a+\log_{3^2}b=\log_3a+\dfrac12\log_3b=\log_3a+\log_3\sqrt b=\log_3a\sqrt b$. 이때 $\log_3a\sqrt b=m$ ($m$은 자연수)라 하면 $a\sqrt b=3^m$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        그런데 $a$, $b$는 100 이하의 자연수이므로 가능한 $a$는 $1$, $3$, $9$, $27$, $81$이고 가능한 $b$는 $1$, $9$, $81$이다. 단 $a=b=1$인 경우는 제외한다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        따라서 모든 순서쌍 $(a,b)$의 개수는 $5\times3-1=14$이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\log_3a\sqrt b=m$ 혹은 $a\sqrt b=3^m$ ($m$은 자연수) (채점기준 3점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        가능한 $a$는 $1,3,9,27,81$, 가능한 $b$는 $1,9,81$ (모두 맞아야 함) (채점기준 3점).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        순서쌍 $(a,b)$의 개수는 $14$ (또는 $a=b=1$ 제외) (채점기준 4점).
      depends_on: [1.M1, 1.A1]
      implied_ok: false
      steps: [1b-3]
    deductions: []
