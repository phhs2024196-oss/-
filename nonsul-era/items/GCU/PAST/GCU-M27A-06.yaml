stimuli: []
stem: |
  수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합 $S_n$이 $S_n=\dfrac{7n}{n^{2}+3n+2}$을 만족시킨다. $|a_6+a_7+a_8|=\dfrac{q}{p}$ ($p$와 $q$는 서로소)라 할 때, $\dfrac{q}{p}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\dfrac{q}{p}$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '\frac{19}{90}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S_8-S_5$를 계산한다.
    steps:
    - {id: 1a, content: '$\frac{28}{45}-\frac56=-\frac{19}{90}$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $a_6+a_7+a_8$을 $S_n$으로 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: A형_해설_수학 문항카드 [A6] 5. 문항 해설(PDF 4쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_n=S_n-S_{n-1}$, $a_6+a_7+a_8=S_6-S_5+S_7-S_6+S_8-S_7=S_8-S_5$이고 $S_n=\dfrac{7n}{n^2+3n+2}=\dfrac{7n}{(n+1)(n+2)}$이므로
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        $S_8=\dfrac{7\times8}{9\times10}=\dfrac{56}{90}=\dfrac{28}{45}$, $S_5=\dfrac{7\times5}{6\times7}=\dfrac{35}{42}=\dfrac56$, $S_8-S_5=\dfrac{28}{45}-\dfrac56=-\dfrac{19}{90}$. 따라서 $|a_6+a_7+a_8|=\dfrac{19}{90}$.
        (또는 $a_6=S_6-S_5=-\dfrac1{12}$, $a_7=S_7-S_6=-\dfrac5{72}$, $a_8=S_8-S_7=-\dfrac7{120}$.)
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
