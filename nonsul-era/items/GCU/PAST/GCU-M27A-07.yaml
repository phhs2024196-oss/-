stimuli: []
stem: |
  $3\overline{\rm AC}=\overline{\rm BC}$인 삼각형 ${\rm ABC}$에서

  $$\sin^{3}B-\cos C\sin A\sin^{2}B-\sin B+\cos C\sin A=0$$

  일 때, $\cos C$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\cos C$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: \frac13, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 인수분해 후 $B=90^\circ$를 배제하고 $\sin B=\cos C\sin A$에서 $A=90^\circ$.
    steps:
    - {id: 1a, content: '$a=3b$, $c=2\sqrt2b$, $\cos C=\frac{9b^2+b^2-8b^2}{6b^2}=\frac13$', criteria: [1.M1, 1.A1, 1.A2, 1.A3]}
    hint_ladder:
    - $\sin^2B$로 묶이는 두 항과 나머지 두 항을 나눠 보자.
    - $\sin B=\cos C\sin A$를 변으로 바꾸자.
  - id: S1-B
    audience: B
    source_flow: A형_해설_수학 문항카드 [A7] 5. 문항 해설(PDF 6쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sin^3B-\cos C\sin A\sin^2B-\sin B+\cos C\sin A=\sin^2B(\sin B-\cos C\sin A)-(\sin B-\cos C\sin A)=(\sin^2B-1)(\sin B-\cos C\sin A)=0$
        (1) $\sin^2B-1=-\cos^2B=0$인 경우, $\angle B=90^\circ$인 직각삼각형이지만 $\overline{AC}<\overline{BC}$이므로 만족시키지 않는다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (2) $\sin B=\cos C\sin A$인 경우,
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $\overline{BC}=a$, $\overline{AC}=b$, $\overline{AB}=c$라 하고 삼각형 ABC의 외접원의 반지름의 길이를 $R$이라 하면, 사인법칙과 코사인법칙에 의해 $\dfrac{b}{2R}=\dfrac{a^2+b^2-c^2}{2ab}\times\dfrac{a}{2R}$, $2b^2=a^2+b^2-c^2$, $b^2+c^2=a^2$. 삼각형 ABC는 $\angle A=90^\circ$인 직각삼각형이다.
      criteria: [1.A2]
    - id: 1b-4
      content: |
        $3\overline{AC}=\overline{BC}$이므로 $a=3b$이고 피타고라스 정리에 의해 $c=2\sqrt2b$이므로 $\cos C=\dfrac{9b^2+b^2-8b^2}{6b^2}=\dfrac13$이다.
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
