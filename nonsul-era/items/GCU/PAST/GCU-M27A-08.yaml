stimuli: []
stem: |
  최고차항의 계수가 $1$인 두 이차함수 $f(x)$와 $g(x)$가 다음 조건을 만족시킬 때, $f(1)$, $f'(1)$, $f(0)+g(0)$, $f'(0)+g'(0)$의 값을 모두 구하는 과정을 서술하시오.

  (가) $\displaystyle\lim_{x\to1}\frac{f(x)+g(x)}{x-1}=3g'(1)$

  (나) $\displaystyle\lim_{x\to1}\frac{\{f(x)\}^2-\{g(x)\}^2}{x-1}=6g(1)$

  (다) 함수 $f(x)g(x)$의 $x=1$에서의 미분 계수는 $3$이다.
subparts:
- id: '1'
  stem: |
    $f(1)$, $f'(1)$, $f(0)+g(0)$, $f'(0)+g'(0)$의 값을 모두 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'f(1)=3,\ f''(1)=-2,\ f(0)+g(0)=5,\ f''(0)+g''(0)=-7', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (가)(나)(다)를 $f(1),g(1),f'(1),g'(1)$의 방정식으로 바꾼다.
    steps:
    - {id: 1a, content: '$g''(1)=-1$, $f''(1)=-2$, $g(1)=-3$, $f(1)=3$; $f=x^2-4x+6$, $g=x^2-3x-1$', criteria: [1.M1, 1.A1, 1.A2, 1.A3]}
    hint_ladder:
    - (가)에서 $f(1)+g(1)=0$.
    - (나)의 분자를 인수분해하자.
  - id: S1-B
    audience: B
    source_flow: A형_해설_수학 문항카드 [A8] 5. 문항 해설(PDF 8쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가) 극한 $\displaystyle\lim_{x\to1}\frac{f(x)+g(x)}{x-1}$이 존재하므로 $f(1)=-g(1)$이다. $\displaystyle\lim_{x\to1}\frac{f(x)+g(x)}{x-1}=\lim_{x\to1}\left\{\frac{f(x)-f(1)}{x-1}+\frac{g(x)-g(1)}{x-1}\right\}=f'(1)+g'(1)=3g'(1)$이므로 $f'(1)=2g'(1)$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to1}\frac{\{f(x)\}^2-\{g(x)\}^2}{x-1}=\lim_{x\to1}\frac{f(x)+g(x)}{x-1}(f(x)-g(x))=-6g'(1)g(1)$이므로 (나)로부터 $-6g'(1)g(1)=6g(1)$이다. $g(1)=0$이면 $f'(1)g(1)+f(1)g'(1)=0$이므로 (다)에 모순이다. 따라서 $g(1)\ne0$이고 $g'(1)=-1$, $f'(1)=2g'(1)=-2$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        (다)로부터 $f'(1)g(1)+f(1)g'(1)=-2g(1)+g(1)=3$. $g(1)=-3$, $f(1)=3$.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        $f(x)=x^2+ax+b$, $g(x)=x^2+px+q$라 하면 $f'(1)=2+a=-2\Rightarrow a=-4$, $f(1)=1-4+b=3\Rightarrow b=6$. $g'(1)=2+p=-1\Rightarrow p=-3$, $g(1)=1-3+q=-3\Rightarrow q=-1$. 결국 $f(x)=x^2-4x+6$, $g(x)=x^2-3x-1$이고 $f(0)+g(0)=5$, $f'(0)+g'(0)=-7$이다.
      criteria: [1.A2, 1.A3]
