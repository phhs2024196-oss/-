intent: |
  다항함수의 미분법(문항카드 출제 의도 원문). 극한 조건을 미분계수 관계로 바꾸고, 곱의 미분으로 $g(1)$을 정한 뒤 두 이차함수를 결정한다.
key_idea: |
  (가) $f(1)=-g(1)$, $f'(1)+g'(1)=3g'(1)$ → $f'(1)=2g'(1)$. (나) $\frac{f^2-g^2}{x-1}=\frac{f+g}{x-1}(f-g)\to3g'(1)\cdot(-2g(1))=6g(1)$. $g(1)\ne0$이므로 $g'(1)=-1$.
stuck: |
  (나)를 $(f+g)(f-g)$로 인수분해해 (가)의 결과를 재사용하는 것을 놓치면 막힌다. $g(1)=0$인 경우를 (다)로 배제해야 한다.
