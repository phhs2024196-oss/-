intent: |
  지수 함수와 로그 함수의 그래프 개형의 이해 확인(문항카드 출제 의도 원문). 두 그래프가 $y$축 대칭임과 $g$의 점근 성질로 $q=2$, $p=1$을 정해 $a$, $b$를 구한다.
key_idea: |
  $\lim_{x\to0}g(x)=-\infty$이므로 $q=2$는 항상. $p=1$이려면 $y=3$이 $f$의 최솟값 $f(0)=1+a$에 접해야 함 → $a=2$, $f(1)=g(1)$로 $b=4$.
stuck: |
  $q$가 $b$와 무관하게 항상 2라는 점을 보지 못하면 경우를 너무 많이 나눈다.
