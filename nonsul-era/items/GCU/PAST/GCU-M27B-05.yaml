stimuli: []
stem: |
  함수 $f(x)=2^{|x|}+a$의 그래프와 직선 $y=3$이 만나는 점의 개수를 $p$, 함수 $g(x)=\log_{2}|x|+b$와 직선 $y=3$이 만나는 점의 개수를 $q$라 하자. $p+q=3$이고 $f(1)=g(1)$일 때, $a+b$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $a+b$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $q=2$가 항상 성립하므로 $p=1$, 즉 $f(0)=3$.
    steps:
    - {id: 1a, content: '$a=2$, $b=f(1)=4$, $a+b=6$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $g(x)$의 그래프는 $x\to0$일 때 어떻게 되는가?
    - $f$와 $y=3$이 한 점에서만 만나는 경우는?
  - id: S1-B
    audience: B
    source_flow: B형_해설_수학 문항카드 [B5] 5. 문항 해설(PDF 2쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 함수 $y=f(x)$, $y=g(x)$의 그래프 모두 $y$축에 대하여 대칭이다. $\lim_{x\to0}g(x)=-\infty$이므로 $g(x)=\log_2|x|+b$와 직선 $y=3$이 만나는 점의 개수는 항상 2개이다. $q=2$. 따라서 $f(x)=2^{|x|}+a$의 그래프와 직선 $y=3$이 만나는 점의 개수 $p=1$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $p+q=3$이면서 동시에 $f(1)=g(1)$을 만족하기 위해서는 두 함수의 그래프와 직선 $y=3$이 아래 그림과 같아야 한다. [그림: $y=f(x)$는 꼭짓점 $(0,3)$에서 직선 $y=3$에 접하고 위로 벌어진 $y$축 대칭 곡선, $y=g(x)$는 $x=0$ 근처에서 $-\infty$로 내려가는 $y$축 대칭 곡선이며 $y=3$과 두 점에서 만나고, 두 곡선은 $x=\pm1$에서 만난다.] 즉, $f(0)=1+a=3$이므로 $a=2$이고,
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $f(1)=g(1)$이므로 $a+2=b$이다. 따라서 $b=4$이고 $a+b=6$.
      criteria: [1.A2]
  rubric:
