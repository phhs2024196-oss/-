stimuli: []
stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$가 모든 실수 $x$에 대하여

  $$\{(f(x))^2+f(x)\}(f(x)-2x)=(f(x)+1)(2x+1)$$

  을 만족시킨다. $f(0)-f(-3)=4$일 때, $f(2)-f(-2)$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $f(2)-f(-2)$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $(f+1)^2(f-2x-1)=0$, 연속성으로 $x=-1$에서만 분기 전환.
    steps:
    - {id: 1a, content: '$f(x)=-1\ (x>-1)$, $2x+1\ (x\le-1)$; $f(2)-f(-2)=-1-(-3)=2$', criteria: [1.M1, 1.A1, 1.A2, 1.A3]}
    hint_ladder:
    - $f(x)=F$로 놓고 $F$에 대한 식으로 정리하자.
    - $-1=2x+1$인 $x$는?
  - id: S1-B
    audience: B
    source_flow: B형_해설_수학 문항카드 [B6] 5. 문항 해설(PDF 4쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\{(f(x))^2+f(x)\}(f(x)-2x)=(f(x)+1)(2x+1)$을 정리하면 $(f(x)+1)^2(f(x)-2x-1)=0$이므로 $f(x)=-1$ 또는 $f(x)=2x+1$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $f(0)-f(-3)=4$를 만족시키는 연속 함수 $f(x)$는 $f(x)=\begin{cases}-1 & (x>-1)\\ 2x+1 & (x\le-1)\end{cases}$
      criteria: [1.A1]
    - id: 1b-3
      content: |
        따라서 $f(2)=-1$, $f(-2)=-3$이므로 $f(2)-f(-2)=2$.
      criteria: [1.A2, 1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
