intent: |
  연속 함수의 성질에 대한 이해 확인(문항카드 출제 의도 원문). 항등식을 인수분해해 $f(x)=-1$ 또는 $2x+1$을 얻고, 연속성과 조건으로 함수를 결정한다.
key_idea: |
  $(f+1)^2(f-2x-1)=0$ → 각 $x$에서 $f(x)=-1$ 또는 $2x+1$. 연속이므로 두 식이 만나는 $x=-1$에서만 바꿀 수 있다. $f(0)-f(-3)=4$로 $f(x)=-1$ ($x>-1$), $2x+1$ ($x\le-1$).
stuck: |
  정리한 식을 $(f+1)^2(f-2x-1)=0$으로 인수분해하는 것이 핵심 고비다.
