intent: |
  삼각함수와 활용의 이해 확인(문항카드 출제 의도 원문). 변환 공식으로 $\sin x$에 대한 식으로 정리하고 $\sin x$의 범위로 최대·최소를 구한다.
key_idea: |
  $\cos\left(\frac\pi2+x\right)=-\sin x$, $\cos(\pi-x)=-\cos x$, $\cos\left(\frac32\pi-x\right)=-\sin x$, $\sin(\pi-x)=\sin x$ → $f(x)=\frac12+\frac{1}{2\sin x+3}$.
stuck: |
  분자 $2-2\sin^2x-3\sin x$를 $2-\sin x(2\sin x+3)$로 묶어 약분하는 단계가 고비.
