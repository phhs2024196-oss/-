stimuli: []
stem: |
  $\dfrac{\pi}{2}\le x\le\dfrac{3}{2}\pi$에서 함수

  $$f(x)=\frac12-\frac12\cos\left(\frac{\pi}{2}+x\right)+\frac{2\cos^{2}(\pi-x)+3\cos\left(\frac{3}{2}\pi-x\right)}{4\sin(\pi-x)+6}$$

  의 최댓값과 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $f(x)$의 최댓값과 최솟값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '\text{최댓값 }\frac32,\ \text{최솟값 }\frac{7}{10}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=\frac12+\frac1{2\sin x+3}$로 정리.
    steps:
    - {id: 1a, content: '$1\le2\sin x+3\le5$이므로 $\frac7{10}\le f(x)\le\frac32$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $\pi\pm x$, $\frac\pi2+x$ 꼴을 모두 $\sin x$, $\cos x$로 바꾸자.
  - id: S1-B
    audience: B
    source_flow: B형_해설_수학 문항카드 [B7] 5. 문항 해설(PDF 6쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\cos\left(\dfrac\pi2+x\right)=-\sin x$, $\cos(\pi-x)=-\cos x$, $\cos\left(\dfrac32\pi-x\right)=-\sin x$, $\sin(\pi-x)=\sin x$이므로
        $$f(x)=\frac12+\frac12\sin x+\frac{2\cos^2x-3\sin x}{4\sin x+6}=\frac12+\frac12\sin x+\frac{2(1-\sin^2x)-3\sin x}{4\sin x+6}=\frac12+\frac12\sin x+\frac{2-\sin x(2\sin x+3)}{2(2\sin x+3)}=\frac12+\frac{1}{2\sin x+3}$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\dfrac\pi2\le x\le\dfrac32\pi$에서 $-1\le\sin x\le1$, $1\le2\sin x+3\le5$, $\dfrac15\le\dfrac{1}{2\sin x+3}\le1$이므로 $\dfrac{7}{10}\le\dfrac12+\dfrac{1}{2\sin x+3}\le\dfrac32$이다.
      criteria: [1.A1, 1.A2]
