stimuli: []
stem: |
  함수 $f(x)=x^{3}+5x^{2}+ax+7$는 $x\ge0$인 모든 실수 $x$에 대하여 $f(x)\ge f'(x)$를 만족시키고, 함수 $g(x)=\displaystyle\int_{-a}^{x}(f(x)-f(t))(f(t))^{2}\,dt$는 $x=b$에서 극값을 갖는다. $a$와 $b$의 값을 구하는 과정을 서술하시오. (단, $a$와 $b$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $a$와 $b$의 값을 구하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'a=3,\ b=-\frac13', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $h(1)=0$이므로 $h'(1)=0$; $g'=f'\int_{-3}^xf^2$의 부호표.
    steps:
    - {id: 1a, content: '$a=3$, $f''(x)=(x+3)(3x+1)$, 부호 변화는 $x=-\frac13$에서만', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $f(x)-f'(x)$에 $x=1$을 넣어 보자.
    - $g(x)$의 피적분함수에서 $f(x)$를 적분 밖으로.
  - id: S1-B
    audience: B
    source_flow: B형_해설_수학 문항카드 [B8] 5. 문항 해설(PDF 8쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $h(x)=f(x)-f'(x)$라 하면 $h(x)=x^3+2x^2+(a-10)x+(7-a)$이다. $h(1)=0$이고 $x\ge0$인 모든 실수 $x$에 대하여 $h(x)\ge0$이므로 $h(x)$는 $x=1$에서 극소이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $h'(x)=3x^2+4x+a-10=0$. $h'(1)=3+4+a-10=0$. $a=3$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $g(x)=f(x)\displaystyle\int_{-3}^{x}(f(t))^2dt-\int_{-3}^{x}(f(t))^3dt$이므로 $g'(x)=f'(x)\displaystyle\int_{-3}^{x}(f(t))^2dt$. $g'(x)=0$에서 $f'(x)=3x^2+10x+3=(x+3)(3x+1)=0$ 또는 $\displaystyle\int_{-3}^{x}(f(t))^2dt=0$. $x<-3$일 때 $\displaystyle\int_{-3}^{x}(f(t))^2dt<0$이고, $x>-3$일 때 $\displaystyle\int_{-3}^{x}(f(t))^2dt>0$이다.
      criteria: [1.A2]
    - id: 1b-4
      content: |
        따라서 $g(x)$의 증가와 감소는 다음 표와 같다.

        | $x$ | $\cdots$ | $-3$ | $\cdots$ | $-\frac13$ | $\cdots$ |
        |---|---|---|---|---|---|
        | $f'(x)$ | $+$ | $0$ | $-$ | $0$ | $+$ |
        | $\int_{-3}^{x}(f(t))^2dt$ | $-$ | $0$ | $+$ | $+$ | $+$ |
        | $g'(x)$ | $-$ | $0$ | $-$ | $0$ | $+$ |
        | $g(x)$ | ↘ | | ↘ | 극소 | ↗ |

        즉, $g(x)$는 $x=-\dfrac13$에서 극소이므로 $b=-\dfrac13$. (원문 증감표의 둘째 행 머리는 $\int_0^x(f(t))^2dt$로 인쇄되어 있으나 본문 흐름상 $\int_{-3}^{x}$의 오기로 보아 바로잡음.)
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
