key_idea: |
  $h(x)=f(x)-f'(x)=x^3+2x^2+(a-10)x+(7-a)$, $h(1)=0$ 항상 → $x\ge0$에서 $h\ge0$이면 $h'(1)=0$, $a=3$. $g'(x)=f'(x)\int_{-3}^{x}(f(t))^2dt$.
stuck: |
