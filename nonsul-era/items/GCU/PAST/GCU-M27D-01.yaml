stimuli: []
stem: |
  $\overline{\rm AC}=2$, $\overline{\rm BC}=\sqrt{3}$이고, 점 ${\rm P}$는 선분 ${\rm AC}$의 중점이다. 점 ${\rm A}$를 지나고 직선 ${\rm BC}$와 평행한 직선이 직선 ${\rm BP}$와 만나는 점을 ${\rm Q}$, 선분 ${\rm PQ}$의 중점을 ${\rm D}$라 하자. 네 점 ${\rm A}$, ${\rm B}$, ${\rm C}$, ${\rm D}$가 한 원 위에 있을 때, 삼각형 ${\rm ABC}$의 외접원의 반지름을 $R$이라 하자. 이때, $\dfrac{3\tan\angle{\rm ACB}}{R}$의 값을 구하는 과정을 서술하시오. (단, 점 ${\rm Q}$는 직선 ${\rm AC}$에 대하여 점 ${\rm B}$와 반대쪽에 위치한다.)
subparts:
- id: '1'
  stem: |
    $\dfrac{3\tan\angle{\rm ACB}}{R}$의 값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 합동으로 $\overline{PD}=\frac12\overline{PB}$, 방멱으로 $\overline{PB}=\sqrt2$, 코사인법칙으로 $\cos\theta=\frac1{\sqrt3}$.
    steps:
    - {id: 1a, content: '$\tan\theta=\sqrt2$, $\overline{AB}^2=3$, $R^2=\frac98$, $\frac{3\sqrt2}{3/(2\sqrt2)}=4$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $\triangle APQ$와 $\triangle CPB$를 비교하자.
    - 현 AC와 현 BD가 P에서 만난다.
  - id: S1-B
    audience: B
    source_flow: 의예_해설 문항카드 1(의약학 모의 문제 1) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\theta=\angle ACB$라 하자. 점 P는 선분 AC의 중점이므로 $\overline{AP}=\overline{PC}=1$이다. 직선 AQ와 BC가 서로 평행이므로 $\angle PAQ=\angle PCB$, $\angle PQA=\angle PBC$이다. 따라서 두 삼각형 APQ, CPB는 닮음(합동)이고, $\overline{AP}=\overline{PC}$이므로 $\overline{PQ}=\overline{PB}$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        점 D가 선분 PQ의 중점이므로 $\overline{PD}=\dfrac12\overline{PQ}=\dfrac12\overline{PB}$이다. 네 점 A, B, C, D가 한 원 위에 있으므로 두 현의 교점 정리에 의하여 $\overline{PA}\times\overline{PC}=\overline{PD}\times\overline{PB}$이다. 따라서 $\overline{PB}=\sqrt2$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        삼각형 PBC에서 코사인법칙에 의하여 $\overline{PB}^2=\overline{PC}^2+\overline{BC}^2-2\times\overline{PC}\times\overline{BC}\times\cos\theta$이므로 $3-2\sqrt3\cos\theta-1=2-2\sqrt3\cos\theta=0$이다. 따라서 $\cos\theta=\dfrac{1}{\sqrt3}$이고 $\tan\theta=\sqrt2$이다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        삼각형 ABC에서 코사인법칙을 적용하면 $\overline{AB}^2=\overline{AC}^2+\overline{BC}^2-2\times\overline{AC}\times\overline{BC}\times\cos\theta$이므로 $\overline{AB}^2=7-4\sqrt3\times\dfrac1{\sqrt3}=3$이다. 사인법칙에 의하여 $R=\dfrac{\overline{AB}}{2\sin\theta}$, 즉 $R^2=\dfrac{\overline{AB}^2}{4\sin^2\theta}=\dfrac{3}{4(1-\cos^2\theta)}=\dfrac98$이다.
      criteria: [1.A1]
    - id: 1b-5
      content: |
        즉 $\dfrac{3\tan\theta}{R}=\dfrac{3\sqrt2}{\frac{3}{2\sqrt2}}=4$이다.
      criteria: [1.A2]
