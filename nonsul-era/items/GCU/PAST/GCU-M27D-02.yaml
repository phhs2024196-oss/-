stimuli: []
stem: |
  극한

  $$\lim_{n\to\infty}\frac{1}{n^{2}}\left\{\frac{2n+1}{kn+2}+\frac{2n+2}{kn+4}+\cdots+\frac{2n+n}{kn+2n}\right\}\left\{\frac{kn+2}{2n+1}+\frac{kn+4}{2n+2}+\cdots+\frac{kn+2n}{2n+n}\right\}$$

  의 값이 $1$이 되는 자연수 $k$를 모두 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    극한값이 $1$이 되는 자연수 $k$를 모두 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: set, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 리만 합의 극한을 정적분으로 계산해 $L(k)$를 만들고 $k=4$만 $L(k)=1$.
    steps:
    - {id: 1a, content: '$L(k)=\left[\frac12+\left(1-\frac k4\right)\ln\frac{k+2}{k}\right]\left[2+(k-4)\ln\frac32\right]$, $L(4)=1$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $\frac{1}{n^2}$을 두 괄호에 $\frac1n$씩 나눠 주자.
    - $\frac{2+i/n}{k+2i/n}$에서 $x=\frac in$.
  - id: S1-B
    audience: B
    source_flow: 의예_해설 문항카드 2(의약학 모의 문제 2) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_n=\dfrac1n\left\{\dfrac{2n+1}{kn+2}+\cdots+\dfrac{2n+n}{kn+2n}\right\}$, $b_n=\dfrac1n\left\{\dfrac{kn+2}{2n+1}+\cdots+\dfrac{kn+2n}{2n+n}\right\}$이라 하면 주어진 식은 $\lim_{n\to\infty}a_nb_n$과 같다.
        $$\lim_{n\to\infty}a_n=\lim_{n\to\infty}\sum_{i=1}^{n}\frac{2+\frac in}{k+\frac{2i}{n}}\frac1n=\int_0^1\frac{2+x}{k+2x}dx=\int_0^1\left\{\frac12+\left(2-\frac k2\right)\frac{1}{k+2x}\right\}dx=\frac12+\left(1-\frac k4\right)\ln\frac{k+2}{k}$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $$\lim_{n\to\infty}b_n=\lim_{n\to\infty}\sum_{i=1}^{n}\frac{k+\frac{2i}{n}}{2+\frac in}\frac1n=\int_0^1\frac{k+2x}{2+x}dx=\int_0^1\left(2+\frac{k-4}{2+x}\right)dx=2+(k-4)\ln\frac32$$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $L(k)=\lim_{n\to\infty}a_nb_n=\left[\dfrac12+\left(\dfrac{4-k}{4}\right)\ln\dfrac{k+2}{k}\right]\left[2+(k-4)\ln\dfrac32\right]$라고 하면 $L(4)=1$임은 분명하다. 또한, $k=1,2,3,5$일 때 $L(k)>1$이고, $k\ge6$일 때 $L(k)<1$이므로 구하는 자연수 $k$는 $k=4$뿐이다.
        (검산 메모: 수치 계산으로는 $k\ge6$에서도 $L(k)>1$이다(예: $L(6)\approx1.0011$, $k\to\infty$에서 $L(k)\to1.0137$). 해설 원문의 '$k\ge6$일 때 $L(k)<1$'은 부정확하나 $k\ne4$에서 $L(k)\ne1$이므로 결론 $k=4$는 맞다.)
      criteria: [1.A1]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 1c-1
      content: |
        (참고·교육과정 밖 부등식 사용) 코시-슈바르츠 부등식 $\left(\int_0^1uv\,dx\right)^2\le\int_0^1u^2dx\int_0^1v^2dx$에 $u=\sqrt{\frac{2+x}{k+2x}}$, $v=\sqrt{\frac{k+2x}{2+x}}$를 넣으면 $L(k)\ge1$이고, 등호는 $\frac{2+x}{k+2x}$가 상수일 때, 즉 $k=4$일 때뿐이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
