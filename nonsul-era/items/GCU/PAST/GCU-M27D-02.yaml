      evidence: |
        $\displaystyle\lim_{n\to\infty}\frac1n\left\{\frac{kn+2}{2n+1}+\cdots+\frac{kn+2n}{2n+n}\right\}=2+(k-4)\ln\frac32$ (채점기준 8점).
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
