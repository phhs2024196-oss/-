intent: |
  무한 급수를 정적분으로 변형한 후 미적분학의 기본정리를 써서 정적분의 값을 구하는 방법에 대한 이해 확인(문항카드 출제 의도 원문). 두 리만 합의 극한을 각각 정적분으로 구해 곱이 1이 되는 $k$를 찾는다.
key_idea: |
  $\frac1n\sum\frac{2+i/n}{k+2i/n}\to\int_0^1\frac{2+x}{k+2x}dx$, $\frac1n\sum\frac{k+2i/n}{2+i/n}\to\int_0^1\frac{k+2x}{2+x}dx$. $L(k)$의 두 인수는 $k=4$에서 각각 $\frac12$, $2$.
stuck: |
  주어진 식을 $\frac1n\cdot\frac1n$으로 나누어 두 리만 합의 곱으로 보는 것이 첫 고비. $k\ne4$에서 $L(k)\ne1$임을 보이는 것이 두 번째 고비.
