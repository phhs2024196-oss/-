stimuli: []
stem: |
  최고차항의 계수가 음수인 삼차함수 $f(x)$가 $x=a$에서 극솟값을 가지고, $x=k$에서 극댓값을 가진다. 함수 $g(x)=2x+\sin\dfrac{\pi}{2}x$의 역함수 $g^{-1}(x)$에 대하여 함수

  $$h(x)=\begin{cases}\dfrac{f(x)+g^{-1}(x)}{\ln10} & (x\le a)\\[2mm] \dfrac{\log(1+f(x)^{2})-1}{x-a} & (x>a)\end{cases}$$

  이 실수 전체의 집합에서 미분가능할 때, 가능한 $f(x)$의 모든 극댓값들의 합을 구하는 과정을 서술하시오. (단, $k$는 음의 정수이다.)
subparts:
- id: '1'
  stem: |
    가능한 $f(x)$의 모든 극댓값들의 합을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\frac{61}{3}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a=-5$, $f(-5)=3$; 미분계수 일치로 $c(k+5)=-\frac53$; $f(k)=\frac5{18}(k+5)^2+3$.
    steps:
    - {id: 1a, content: '$k=-1,-2,-3,-4$: $\frac{67}9+\frac{11}2+\frac{37}9+\frac{59}{18}=\frac{61}3$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $x=a$에서 연속이려면 오른쪽 식의 분자가 0으로 가야 한다.
    - $g(-3)$을 계산해 보자.
  - id: S1-B
    audience: B
    source_flow: 의예_해설 문항카드 3(의약학 모의 문제 3) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $h(x)$가 $x=a$에서 연속이므로 $\displaystyle\lim_{x\to a+}\frac{\log(1+f(x)^2)-1}{x-a}$가 존재하고, 그 값은 $h(a)=\dfrac{f(a)+g^{-1}(a)}{\ln10}$와 같다. 따라서 $f(a)^2=9$이다. 삼차함수 $f(x)$가 $x=a$에서 극솟값을 가지므로 $f'(a)=0$이고,
        $$h(a)=\frac{f(a)+g^{-1}(a)}{\ln10}=\lim_{x\to a+}\frac{\log(1+f(x)^2)-\log(1+f(a)^2)}{x-a}=\frac{2f(a)f'(a)}{\ln10(1+f(a)^2)}=0$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (1) $f(a)=-3$인 경우 $g^{-1}(a)=3$이고 $a=g(3)=5$이다. 함수 $f(x)$의 최고차항의 계수가 음수이므로 $a<k$인데, $k$가 음의 정수이므로 모순이 발생한다.
        (2) $f(a)=3$인 경우 $g^{-1}(a)=-3$이고 $a=g(-3)=-5$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $f'(x)=c(x+5)(x-k)$라 하면 $c<0$이고, $k$가 음의 정수이므로 가능한 $k$의 값은 $k=-1$, $-2$, $-3$, $-4$이다. 또한, $f'(x)$를 적분하여 $f(x)=\dfrac c2(x+5)^2(x-k)-\dfrac c6(x+5)^3+3$을 얻을 수 있다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        함수 $h(x)$가 $x=-5$에서 미분가능하므로
        $$\lim_{x\to-5-}\frac{h(x)-h(-5)}{x+5}=\frac{1}{\ln10}\left(f'(-5)+\frac{1}{g'(g^{-1}(-5))}\right)=\frac{1}{2\ln10}$$
        이고, 따라서
        $$\frac{1}{2\ln10}=\lim_{x\to-5+}\frac{h(x)}{x+5}=\lim_{x\to-5+}\frac{\log(1+f(x)^2)-1}{(x+5)^2}=\lim_{x\to-5+}\frac{\frac{10}{f(x)^2-9}\log\left(1+\frac{f(x)^2-9}{10}\right)}{\frac{10(x+5)^2}{f(x)^2-9}}=-\frac{3c(k+5)}{10\ln10}$$
        이며, $c(k+5)=-\dfrac53$이다.
      criteria: [1.A2]
    - id: 1b-5
      content: |
        $f(k)=-\dfrac c6(k+5)^3+3=\dfrac{5}{18}(k+5)^2+3$이므로 가능한 극댓값들은 $\dfrac{67}{9}$, $\dfrac{11}{2}$, $\dfrac{37}{9}$, $\dfrac{59}{18}$이고, 총합은 $\dfrac{61}{3}$이다.
      criteria: [1.A2]
