intent: |
  역함수의 미분법, 여러가지 함수의 미분법(문항카드 출제 의도 원문). 연속·미분가능 조건으로 $f(a)$, $a$를 정하고, $x=a$에서 좌·우 미분계수를 비교해 $c(k+5)$를 구한다.
key_idea: |
  연속에서 $\log(1+f(a)^2)=1$, $f(a)^2=9$. $f(a)=-3$이면 $a=g(3)=5>k$ 모순 → $f(a)=3$, $a=g(-3)=-5$. 좌미분 $\frac{1}{2\ln10}$, 우미분 $-\frac{3c(k+5)}{10\ln10}$.
stuck: |
  우미분계수 $\lim\frac{\log(1+f^2)-1}{(x+5)^2}$를 $\frac{f^2-9}{10}$ 치환으로 계산하는 단계가 고비.
