intent: |
  극한의 성질 및 두 곡선 사이의 넓이(문항카드 출제 의도 원문). 극한 존재 조건으로 실근이 $x=2$ 하나뿐임을 보이고, 교점 조건과 정수 조건으로 $f$를 결정해 넓이를 구한다.
key_idea: |
  $f(\beta)=0$이면 $f(2\beta-2)=0$, $f(4\beta-6)=0$, … → $\beta\ne2$이면 근이 너무 많음 → 실근은 $2$뿐. $f(x)-x=(x-a)^2(x-b)$ 또는 $(x-a)(x-b)^2$, $f(2)=0$.
stuck: |
