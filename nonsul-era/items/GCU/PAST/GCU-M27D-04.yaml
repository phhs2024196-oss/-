stimuli: []
stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킬 때, 곡선 $y=f(x)$와 직선 $y=x$로 둘러싸인 영역의 넓이를 구하는 과정을 서술하시오.

  (가) 모든 실수 $\alpha$에 대하여 $\displaystyle\lim_{x\to\alpha}\frac{f(2x-2)}{f(x)}$의 값이 존재한다.

  (나) 곡선 $y=f(x)$와 직선 $y=x$의 교점은 $2$개이고 교점의 $x$좌표는 모두 정수이다.
subparts:
- id: '1'
  stem: |
    곡선 $y=f(x)$와 직선 $y=x$로 둘러싸인 영역의 넓이를 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\frac{1}{12}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 실근이 $x=2$뿐 → $f(2)=0$; $(2-a)^2(2-b)=-2$ 등의 정수해.
    steps:
    - {id: 1a, content: '$f(x)=(x-3)^2(x-4)+x$, $\int_3^4|f(x)-x|dx=\frac1{12}$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $f(\beta)=0$이면 $f(2\beta-2)$는?
    - 교점이 2개인 삼차식 $f(x)-x$는 중근을 가진다.
  - id: S1-B
    audience: B
    source_flow: 의예_해설 문항카드 4(의약학 모의 문제 4) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼차함수는 적어도 하나의 실근을 가지므로 $f(\beta)=0$이라 하자. $\displaystyle\lim_{x\to\beta}\frac{f(2x-2)}{f(x)}$가 존재하고 $f(\beta)=0$이므로 $f(2\beta-2)=0$이다. 같은 이유로 $f(2(2\beta-2)-2)=f(4\beta-6)=0$이다. 결국 $\beta\ne2\beta-2$, 즉 $\beta\ne2$이면 $\beta$, $2\beta-2$, $4\beta-6$, $8\beta-14$가 삼차방정식 $f(x)=0$의 근이 되어 모순이다. 따라서 $\beta=2$이고 방정식 $f(x)=0$의 실근은 $x=2$가 유일하다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        조건 (나)로부터 교점을 $(a,a)$, $(b,b)$라 하면 $f(x)=(x-a)^2(x-b)+x$ 또는 $f(x)=(x-a)(x-b)^2+x$이다. 따라서 $(2-a)^2(2-b)=-2$ 또는 $(2-a)(2-b)^2=-2$이고, $2-a$, $2-b$가 정수이므로
        case 1: $(2-a)^2=1$, $2-b=-2$ → $a=1,b=4$ 또는 $a=3,b=4$
        case 2: $2-a=-2$, $(2-b)^2=1$ → $a=4,b=1$ 또는 $a=4,b=3$.
        가능한 삼차함수는 ① $f(x)=(x-3)^2(x-4)+x=(x-2)(x^2-8x+18)$, ② $f(x)=(x-1)^2(x-4)+x=(x-2)(x-(2+\sqrt2))(x-(2-\sqrt2))$이다. 실근은 $x=2$뿐이어야 하므로 ②는 불가능하고, $x^2-8x+18$의 판별식 $D/4=16-18<0$이므로 ①이 맞다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        결국 $f(x)=x^3-10x^2+34x-36$이고 $y=x$와의 교점은 $(3,3)$, $(4,4)$이다. 넓이는
        $$\int_3^4|f(x)-x|dx=\int_3^4(-x^3+10x^2-33x+36)dx=\left[-\frac{x^4}{4}+\frac{10x^3}{3}-\frac{33x^2}{2}+36x\right]_3^4=\frac{1}{12}.$$
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
