stimuli: []
stem: |
  다음 조건을 만족시키는 두 양수 $a$, $b$에 대하여 $|a^{2}-3b|$의 최댓값과 최솟값을 구하는 과정을 서술하시오.

  (가) $9^{a}=27^{b}$

  (나) $|a+b-ab^{2}|=1$
subparts:
- id: '1'
  stem: |
    $|a^{2}-3b|$의 최댓값과 최솟값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: expression, value: '\text{최댓값 }\frac{7\sqrt{33}-33}{8},\ \text{최솟값 }\frac{9-\sqrt{33}}{8}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $2a=3b$로 $b$를 소거하고 $\frac49a^3=\frac53a\pm1$을 푼다.
    steps:
    - {id: 1a, content: '$a=\frac{3+\sqrt{33}}4,\ \frac32,\ \frac{\sqrt{33}-3}4$ → $|a^2-2a|=\frac{9-\sqrt{33}}8,\ \frac34,\ \frac{7\sqrt{33}-33}8$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - 9와 27을 3의 거듭제곱으로.
    - $|X|=1$이면 $X=1$ 또는 $X=-1$.
  - id: S1-B
    audience: B
    source_flow: 한의예약학_해설 문항카드 1(의약학 모의 문제 1) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $9^a=27^b$이므로 $3^{2a}=3^{3b}$이고, 따라서 $2a=3b$이다. $a+b=\dfrac53a$와 $ab^2=\dfrac49a^3$의 차이가 1이므로 $\dfrac49a^3=\dfrac53a\pm1$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (1) $\dfrac49a^3=\dfrac53a+1$: $4a^3-15a-9=(2a+3)(2a^2-3a-3)=0$이므로 $a=\dfrac{3+\sqrt{33}}{4}$이다. $|a^2-3b|=|a^2-2a|=\dfrac{9-\sqrt{33}}{8}<\dfrac48$.
      criteria: [1.A2]
    - id: 1b-3
      content: |
        (2) $\dfrac49a^3=\dfrac53a-1$: $4a^3-15a+9=(2a-3)(2a^2+3a-3)=0$이므로 $a=\dfrac32$ 혹은 $a=\dfrac{\sqrt{33}-3}{4}$이다. $a=\dfrac32$이면 $|a^2-2a|=\dfrac34$이고, $a=\dfrac{\sqrt{33}-3}{4}$이면 $|a^2-2a|=\dfrac{7\sqrt{33}-33}{8}>\dfrac78$이다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        따라서 최댓값은 $\dfrac{7\sqrt{33}-33}{8}$이고, 최솟값은 $\dfrac{9-\sqrt{33}}{8}$이다.
      criteria: [1.A1, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
