intent: |
  정적분으로 표시된 함수의 미분 이해(문항카드 출제 의도 원문). 덧셈정리로 $\int_0^x\sin(x-t)f(t)dt$를 분리해 두 번 미분하면 $f=h''+h$이고, 대칭 치환으로 $g$가 남는 적분을 구한다.
key_idea: |
  $h(x)=\int_0^x\sin(x-t)f(t)dt$이면 $h''+h=f$. $\int_0^{\pi/4}f=h'(\tfrac\pi4)-h'(0)+\int_0^{\pi/4}h$, $h'$의 양 끝 값은 0. $I=\int_0^{\pi/4}\sin^2(4t)g(t)dt$는 $t\to\frac\pi4-t$ 치환으로 $I=\frac{3\pi}{8}-I$.
stuck: |
  $g$를 모른 채 적분값을 구해야 하므로 $g(x)+g\left(\frac\pi4-x\right)=3$의 대칭 치환을 떠올리는 것이 고비.
