stimuli: []
stem: |
  함수 $g(x)$는 닫힌 구간 $\left[0,\dfrac{\pi}{4}\right]$에서 연속이고 열린 구간 $\left(0,\dfrac{\pi}{4}\right)$에서 연속인 이계도함수를 갖는다. 또한, 모든 $x\in\left[0,\dfrac{\pi}{4}\right]$에 대하여

  $$g(x)+g\left(\frac{\pi}{4}-x\right)=3$$

  가 성립한다. 구간 $\left[0,\dfrac{\pi}{4}\right]$에서 연속인 함수 $f(x)$가 모든 $x\in\left[0,\dfrac{\pi}{4}\right]$에 대하여

  $$\int_{0}^{x}\sin(x-t)f(t)\,dt=1-\cos(4x)+\sin^{2}(4x)g(x)$$

  를 만족할 때, $\displaystyle\int_{0}^{\frac{\pi}{4}}f(t)\,dt$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\displaystyle\int_{0}^{\frac{\pi}{4}}f(t)\,dt$의 값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\frac{7\pi}{16}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f=h''+h$, $h'(0)=h'(\frac\pi4)=0$, 대칭 치환으로 $I=\frac{3\pi}{16}$.
    steps:
    - {id: 1a, content: '$\int_0^{\pi/4}f=\int_0^{\pi/4}(1-\cos4t)dt+I=\frac\pi4+\frac{3\pi}{16}=\frac{7\pi}{16}$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $\sin(x-t)$를 덧셈정리로 펼치자.
    - $t$를 $\frac\pi4-t$로 바꿔 보자.
  - id: S1-B
    audience: B
    source_flow: 한의예약학_해설 문항카드 2(의약학 모의 문제 2) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $h(x)=\displaystyle\int_0^x\sin(x-t)f(t)dt$라 하자. 삼각함수의 덧셈정리에 의해 $h(x)=\sin x\displaystyle\int_0^xf(t)\cos t\,dt-\cos x\int_0^xf(t)\sin t\,dt$이다. 양변을 미분하면 $h'(x)=\cos x\displaystyle\int_0^xf(t)\cos t\,dt+\sin x\int_0^xf(t)\sin t\,dt$이고, 다시 미분하면
        $$h''(x)=-\sin x\int_0^xf(t)\cos t\,dt+\cos^2x\,f(x)+\cos x\int_0^xf(t)\sin t\,dt+\sin^2x\,f(x)=-h(x)+f(x)$$
        이다. 즉, $f(x)=h''(x)+h(x)$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        문제의 조건에 따라 $h(x)=1-\cos(4x)+\sin^2(4x)g(x)$, $h'(x)=4\sin(4x)+8\cos(4x)\sin(4x)g(x)+\sin^2(4x)g'(x)$이므로 $h'\left(\dfrac\pi4\right)=h'(0)=0$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $I=\displaystyle\int_0^{\frac\pi4}\sin^2(4t)g(t)dt$라 하자. $\dfrac\pi4-t=u$로 치환하면 $I=\displaystyle\int_0^{\frac\pi4}\sin^2(\pi-4u)g\left(\frac\pi4-u\right)du=\int_0^{\frac\pi4}\sin^2(4u)(3-g(u))du=\frac{3\pi}{8}-I$이고, $I=\dfrac{3\pi}{16}$이다.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        따라서
        $$\int_0^{\frac\pi4}f(t)dt=\int_0^{\frac\pi4}h''(t)dt+\int_0^{\frac\pi4}h(t)dt=h'\left(\frac\pi4\right)-h'(0)+\int_0^{\frac\pi4}h(t)dt=\int_0^{\frac\pi4}(1-\cos4t)dt+\int_0^{\frac\pi4}\sin^2(4t)g(t)dt=\frac\pi4+\frac{3\pi}{16}=\frac{7\pi}{16}.$$
      criteria: [1.A1]
