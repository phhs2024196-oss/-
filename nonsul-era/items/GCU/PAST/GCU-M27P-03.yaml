stimuli: []
stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$는 역함수가 존재한다. $f(x)$의 역함수를 $g(x)$라 하고 함수 $h(x)$를 $h(x)=\dfrac{g(x)}{f(x)}$라 하자. 양수 $a$에 대하여 $f(x)$와 $h(x)$가 다음 조건을 만족시킬 때, 두 곡선 $y=f(x)$와 $y=g(x)$로 둘러싸인 영역의 넓이를 구하는 과정을 서술하시오.

  (가) 점 $\left(a+\dfrac13,\ f\left(a+\dfrac13\right)\right)$는 곡선 $y=f(x)$의 변곡점이다.

  (나) $h(a)=1$

  (다) $h'(a)=0$
subparts:
- id: '1'
  stem: |
    두 곡선 $y=f(x)$와 $y=g(x)$로 둘러싸인 영역의 넓이를 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: \frac16, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(a)=a$, $f'(a)=1$, 변곡점으로 $b=-1$; $f(x)-x=(x-a)^2(x-a-1)$.
    steps:
    - {id: 1a, content: $2\int_0^1(-t^3+t^2)dt=\frac16$, criteria: [1.M1, 1.A1, 1.A2, 1.A3]}
    hint_ladder:
    - $f(a)=g(a)$이면 $f(f(a))=a$.
    - $f$가 증가함수이면 $f(a)>a$일 때 무슨 모순?
  - id: S1-B
    audience: B
    source_flow: 한의예약학_해설 문항카드 3(의약학 모의 문제 3) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (나)로부터 $f(a)=g(a)$이므로 $a=f(f(a))$이다. $f$의 역함수가 존재하므로 $f$는 증가함수이다. $a<f(a)$이면 $f(a)<f(f(a))=a$이므로 모순이다. 마찬가지로 $a>f(a)$이면 $f(a)>f(f(a))=a$이므로 모순이다. 따라서 $f(a)=a=g(a)$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $g'(a)=\dfrac{1}{f'(g(a))}=\dfrac{1}{f'(a)}$이므로 (다)로부터 $h'(a)=\dfrac{g'(a)f(a)-g(a)f'(a)}{(f(a))^2}=\dfrac1a\left(\dfrac{1}{f'(a)}-f'(a)\right)=0$이다. $a>0$이고 $f'(a)>0$이므로 $f'(a)=1$이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $f(a)=a$이므로 $f(x)=(x-a)^3+b(x-a)^2+c(x-a)+a$라 하자. $f''(x)=6(x-a)+2b$이므로 (가)로부터 $f''\left(a+\dfrac13\right)=6\cdot\dfrac13+2b=0\Rightarrow b=-1$이다. 따라서 $f(x)=(x-a)^3-(x-a)^2+c(x-a)+a$이고 $c=f'(a)=1$이다. 결국 $f(x)=(x-a)^3-(x-a)^2+(x-a)+a$이다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        $f(x)-x=(x-a)^3-(x-a)^2=(x-a)^2(x-a-1)$이므로 $y=f(x)$와 $y=x$는 두 점 $(a,a)$와 $(a+1,a+1)$에서 만난다.
      criteria: [1.A2]
    - id: 1b-5
      content: |
        $y=f(x)$와 $y=g(x)$로 둘러싸인 영역의 넓이는
        $$2\int_a^{a+1}|f(x)-x|dx=2\int_a^{a+1}|(x-a)^3-(x-a)^2|dx=2\int_0^1(-t^3+t^2)dt\ (t=x-a)=2\left(-\frac14+\frac13\right)=\frac16.$$
      criteria: [1.A3]
