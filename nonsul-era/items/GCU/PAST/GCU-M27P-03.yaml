intent: |
  극한의 성질 및 두 곡선 사이의 넓이(문항카드 출제 의도 원문). 증가함수의 성질로 $f(a)=a$를 보이고, 역함수 미분으로 $f'(a)=1$, 변곡점 조건으로 $f$를 결정해 $f$와 역함수 사이 넓이를 구한다.
key_idea: |
  $h(a)=1$ → $f(a)=g(a)$ → $a=f(f(a))$; $f$ 증가이므로 $f(a)=a$. $h'(a)=\frac1a\left(\frac1{f'(a)}-f'(a)\right)=0$ → $f'(a)=1$. $f(x)-x=(x-a)^2(x-a-1)$.
stuck: |
  $f(f(a))=a$에서 $f(a)=a$를 이끄는 귀류(증가함수) 논증이 고비.
