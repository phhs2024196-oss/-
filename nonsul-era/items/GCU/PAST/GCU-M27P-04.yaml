intent: |
  그래프의 개형과 도함수의 활용의 이해 확인(문항카드 출제 의도 원문). 두 조각의 극댓값이 같음을 보이고, 근이 2개가 되는 $t$와 두 근의 차로 $k$를 구한다.
key_idea: |
  $f'(x)=4e^{-x^2}(1-2x^2)$로 $x=\frac{\sqrt2}2$에서 극대 $2\sqrt2e^{-1/2}$. $x<0$ 조각 $f(-kx)$는 $x=-\frac{\sqrt2}{2k}$에서 같은 극댓값. 근 2개 ⇔ $t=2\sqrt2e^{-1/2}$.
stuck: |
  두 조각의 극댓값이 $k$와 무관하게 같다는 것과, $0<t<$극댓값이면 근이 4개라는 개형 판단이 고비.
