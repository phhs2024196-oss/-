stimuli: []
stem: |
  양수 $k$와 함수 $f(x)=4xe^{-x^{2}}$에 대하여 함수 $g(x)$를

  $$g(x)=\begin{cases}f(-kx) & (x<0)\\ f(x) & (x\ge0)\end{cases}$$

  이라 하자. $x$에 관한 방정식 $g(x)=t$의 서로 다른 실근의 개수가 $2$이고, 두 실근의 차가 $\dfrac{3\sqrt{2}}{2}$가 되도록 하는 실수 $t$와 $k$의 값을 구하는 과정을 서술하시오. (단, $\displaystyle\lim_{x\to\infty}\frac{x}{e^{x^{2}}}=0$이다.)
subparts:
- id: '1'
  stem: |
    실수 $t$와 $k$의 값을 구하는 과정을 서술하시오.
  points: 20
  depends_on: []
  answer: {kind: expression, value: 't=2\sqrt2e^{-\frac12},\ k=\frac12', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 극대점의 높이가 같으므로 $t$는 극댓값, 근의 차는 $\frac{\sqrt2}2+\frac{\sqrt2}{2k}$.
    steps:
    - {id: 1a, content: '$\frac{\sqrt2}{2}+\frac{\sqrt2}{2k}=\frac{3\sqrt2}{2}\Rightarrow k=\frac12$', criteria: [1.M1, 1.A1, 1.A2, 1.A3]}
    hint_ladder:
    - $f'(x)$의 부호를 조사하자.
    - $f(-kx)$는 $f$를 가로로 늘이고 뒤집은 것이다.
  - id: S1-B
    audience: B
    source_flow: 한의예약학_해설 문항카드 4(의약학 모의 문제 4) 5. 문항 해설
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=4xe^{-x^2}$이므로 $f'(x)=4e^{-x^2}(1-2x^2)$이고, $f'(x)$의 부호가 $x=\dfrac{\sqrt2}{2}$의 좌우에서 양에서 음으로 변한다. 따라서 $\left(\dfrac{\sqrt2}{2},\ 2\sqrt2e^{-1/2}\right)$에서 극댓값을 갖는다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        마찬가지로 $f(-kx)=-4kxe^{-k^2x^2}$이고 $\{f(-kx)\}'=-4ke^{-k^2x^2}(1-2k^2x^2)$이므로 $\left(-\dfrac{\sqrt2}{2k},\ 2\sqrt2e^{-1/2}\right)$에서 극댓값을 갖는다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $f(0)=0$, $\displaystyle\lim_{x\to\infty}f(x)=0$, $\displaystyle\lim_{x\to-\infty}f(-kx)=0$이므로 그래프의 개형은 [그림: $x=0$에서 0, 양쪽에 높이가 같은 봉우리 하나씩($x=-\frac{\sqrt2}{2k}$, $x=\frac{\sqrt2}2$)이 있고 양 끝에서 $x$축에 점근하는 곡선]과 같다. 따라서 방정식 $g(x)=t$는 $t=2\sqrt2e^{-1/2}$에서 서로 다른 두 실근을 갖고,
      criteria: [1.A2]
    - id: 1b-4
      content: |
        두 근의 차가 $\dfrac{\sqrt2}{2}+\dfrac{\sqrt2}{2k}=\dfrac{3\sqrt2}{2}$이므로 $k=\dfrac12$이다.
      criteria: [1.A3]
