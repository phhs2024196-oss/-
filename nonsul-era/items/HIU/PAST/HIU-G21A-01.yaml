stimuli: []

stem: |
  수직선 위에 점 A가 있고, 앞면이 나올 확률이 $\dfrac12$인 동전이 있다. 이 동전을 한 번 던져서 앞면이 나오면 점 A를 $+1$ 만큼, 뒷면이 나오면 점 A를 $-1$ 만큼 이동시키는 '시행'을 한다. 점 A의 시작 좌표는 1 또는 2 이다. 자연수 $n$을 '시행횟수'라 하고 위 '시행'을 $n$회 반복한다. 아래와 같이 '성공', '실패', '보류' 사건을 정의한다.

  ● 점 A가 좌표 0에 도달하기 전에 좌표 3에 먼저 도달하는 사건을 '성공'으로 정의한다.
  ● 점 A가 좌표 3에 도달하기 전에 좌표 0에 먼저 도달하는 사건을 '실패'라고 정의한다.
  ● 점 A가 $n$회의 '시행' 동안 좌표 0 또는 3에 도달하지 못한 사건을 '보류'라고 정의한다.

  '시행횟수'가 $n$일 때, $x=1$ 또는 $x=2$에 대하여 점 A가 좌표 $x$에서 시작하여 '성공'할 확률을 $S(n,x)$, '보류'될 확률을 $D(n,x)$, '실패'할 확률을 $F(n,x)$라 하자.

subparts:
- id: '1'
  stem: |
    $D(3,1)$과 $D(4,2)$를 구하고, 모든 자연수 $n$에 대하여 $D(n,1)$과 $D(n,2)$를 각각 $n$에 대한 식으로 표현하시오.
  points: 4
  depends_on: []
  answer: {kind: expression, value: 'D(3,1)=1/8; D(4,2)=1/16; D(n,1)=(1/2)**n; D(n,2)=(1/2)**n', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '보류는 동전이 앞·뒤를 번갈아 내는 단 한 가지 경우뿐이다.'
    steps:
    - {id: 1a, content: '$D(3,1)=\left(\tfrac12\right)^3$, $D(4,2)=\left(\tfrac12\right)^4$, $D(n,1)=D(n,2)=\left(\tfrac12\right)^n$', criteria: ['1.B1', '1.B2']}
    hint_ladder:
    - 좌표 1, 2에서 0이나 3으로 가지 않으려면 매번 어느 쪽으로 움직여야 하는가?
  - id: S1-B
    audience: B
    source_flow: G21_am.pdf p.5 예시 답안 (1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        좌표 1에서 시작하여 3회의 시행 후 '보류'가 되는 경우는 3번의 동전을 던지는 '시행'에서 '앞뒤앞'이 나와야 한다. 이러한 확률은 $\left(\dfrac12\right)^3$이다. 마찬가지로 좌표 2에서 시작하여 4회의 시행 후 '보류'가 되는 경우는 '뒤앞뒤앞'이 나와야 하고 확률은 $\left(\dfrac12\right)^4$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        좌표 1에서 시작하여 $n$회의 시행 후 '보류'가 되는 경우는 $n$회의 '시행'에서 '앞뒤앞…'이 연속으로 번갈아 나오는 경우뿐이다. 따라서 $D(n,1)=\left(\dfrac12\right)^n$이다. 마찬가지로 $D(n,2)=\left(\dfrac12\right)^n$이다.
      criteria: ['1.B2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        $D(3,1)=\dfrac18$과 $D(4,2)=\dfrac1{16}$을 구함 (원 채점기준 2점)
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: |
        $D(n,1)=D(n,2)=\left(\dfrac12\right)^n$을 구함 (원 채점기준 2점)
      depends_on: []
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $n\ge2$인 모든 자연수 $n$에 대하여 점 A는 좌표 1에서 시작하면 첫 '시행' 후 $\dfrac12$의 확률로 좌표 0으로 이동하여 '실패'하거나, $\dfrac12$의 확률로 좌표 2로 이동한 후에 '시행'을 반복하게 된다. 이를 이용하여 $S(n,1)$을 $S(n-1,2)$에 대한 식으로 표현하시오.
  points: 4
  depends_on: []
  answer: {kind: expression, value: 'S(n,1)=S(n-1,2)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '첫 시행이 앞면일 때만 성공 가능하고, 그 뒤는 좌표 2에서 $n-1$회 시행하는 것과 같다.'
    steps:
    - {id: 2a, content: '$S(n,1)=\tfrac12\cdot0+\tfrac12S(n-1,2)$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 첫 시행에서 뒷면이 나오면 어떻게 되는가?
  - id: S2-B
    audience: B
    source_flow: G21_am.pdf p.5~6 예시 답안 (2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 A가 좌표 1에서 출발하면 첫 '시행' 후 $\dfrac12$의 확률로 좌표 0으로 이동하여 '실패'하거나, $\dfrac12$의 확률로 좌표 2로 이동하여 '시행'을 반복하게 된다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이때 좌표 2로 이동한 후 '성공'할 확률은 시작 좌표가 2이고 '시행횟수'가 $n-1$인 경우와 같으므로 $S(n-1,2)$이다. 따라서 $S(n,1)=\dfrac12S(n-1,2)$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        첫 시행 결과(앞면/뒷면)로 경우를 나누고 앞면 이후를 좌표 2에서 $n-1$회 시행하는 상황으로 보았다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $S(n,1)=\dfrac12S(n-1,2)$를 올바르게 유도함 (원 채점기준: 이 식의 올바른 유도 4점을 M·A 2+2로 나눔)
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $n\ge2$인 모든 자연수 $n$에 대하여 문항 (2)와 유사한 방식으로 $S(n,2)$를 $S(n-1,1)$에 대한 식으로 표현하시오.
  points: 4
  depends_on: []
  answer: {kind: expression, value: 'S(n,2)=S(n-1,1)/2+1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '앞면이면 바로 성공(확률 1), 뒷면이면 좌표 1에서 $n-1$회 시행.'
    steps:
    - {id: 3a, content: '$S(n,2)=\tfrac12\cdot1+\tfrac12S(n-1,1)$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 좌표 2에서 앞면이 나오면 어디에 도달하는가?
  - id: S3-B
    audience: B
    source_flow: G21_am.pdf p.6 예시 답안 (3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        점 A가 좌표 2에서 출발하면 첫 '시행' 후 $\dfrac12$의 확률로 좌표 3으로 이동하여 '성공'하거나, $\dfrac12$의 확률로 좌표 1로 이동하여 $n-1$회 '시행'을 반복하게 된다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        이때 좌표 1로 이동한 후 '성공'할 확률은 시작좌표가 1이고 '시행횟수'가 $n-1$인 경우와 같으므로 $S(n-1,1)$이다. 따라서 $S(n,2)=\dfrac12S(n-1,1)+\dfrac12$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        첫 시행으로 경우를 나누어 앞면이면 바로 성공, 뒷면이면 좌표 1에서 $n-1$회 시행하는 상황으로 보았다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $S(n,2)=\dfrac12S(n-1,1)+\dfrac12$을 올바르게 유도함 (원 채점기준 4점을 2+2로 나눔)
      depends_on: [3.M1]
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    모든 자연수 $n$에 대하여 $S(n,2)=F(n,1)$가 성립함을 간단히 설명하고, 이 사실을 이용하여 $a_n=S(n,1)$과 $b_n=S(n,2)$에 대해 수열 $\{a_n+b_n\}$의 극한값 $\displaystyle\lim_{n\to\infty}(a_n+b_n)$을 구하시오.
  points: 4
  depends_on: ['1']
  answer: {kind: expression, value: 'S(n,2)=F(n,1); a_n+b_n=1-(1/2)**n; lim(a_n+b_n)=1', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: '$x\mapsto3-x$ 대칭으로 $S(n,2)=F(n,1)$, 그리고 $S(n,1)+D(n,1)+F(n,1)=1$.'
    steps:
    - {id: 4a, content: '$a_n+b_n=S(n,1)+F(n,1)=1-D(n,1)=1-\left(\tfrac12\right)^n\to1$', criteria: ['4.R1', '4.A1']}
    hint_ladder:
    - 좌표 2에서 3으로 가는 것과 좌표 1에서 0으로 가는 것은 어떤 관계인가?
  - id: S4-B
    audience: B
    source_flow: G21_am.pdf p.6 예시 답안 (4)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        좌표 1에서 시작하여 '성공'하는 사건과 좌표 2에서 시작하여 '실패'하는 사건은 대칭이다. 따라서 $S(n,2)=F(n,1)$이다. (원 예시답안 문장 그대로 — 엄밀히는 좌표 2에서 '성공'하는 사건과 좌표 1에서 '실패'하는 사건이 $x\mapsto3-x$ 대칭이다. 보고서 참조)
      criteria: ['4.R1']
    - id: 4b-2
      content: |
        확률의 총합은 1이어야 하므로 $S(n,1)+D(n,1)+F(n,1)=1$이다. 이를 이용하여 $a_n+b_n=S(n,1)+S(n,2)=1-\left(\dfrac12\right)^n$을 얻을 수 있다. 따라서 $\displaystyle\lim_{n\to\infty}(a_n+b_n)=\lim_{n\to\infty}\left\{1-\left(\frac12\right)^n\right\}=1$이다.
      criteria: ['4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 4.R1
      mark_type: R
      points: 2
      evidence: |
