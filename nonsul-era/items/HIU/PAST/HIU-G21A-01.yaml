intent: |
  주어진 사건의 확률 및 조건부 확률을 계산할 수 있는지 평가한다. 해당 확률을 계산하여 얻어진 수열의 극한을 구할 수 있는지 평가한다.
  (1) 주어진 사건의 확률을 계산할 수 있는지 평가한다.
  (2) 주어진 사건을 두 가지 경우로 나누어 각각의 확률을 조건부 확률을 이용하여 구할 수 있는지 평가한다.
  (3) 주어진 사건을 두 가지 경우로 나누어 각각의 확률을 조건부 확률을 이용하여 구할 수 있는지 평가한다.
  (4) 확률의 총합이 1임을 이해하고 있는지 평가한다. 수열의 극한값을 계산할 수 있는지 평가한다.
  (5) 두 수열의 합의 극한은 각 수열의 극한값의 합과 같음을 이해하고 있는지 평가한다. 주어진 수열을 상수배한 수열의 극한값은 해당 수열의 극한값의 상수배한 결과와 같음을 이해하고 있는지 평가한다.
key_idea: |
  첫 시행의 결과로 경우를 나누면 $S(n,1)=\frac12S(n-1,2)$, $S(n,2)=\frac12S(n-1,1)+\frac12$이고, 대칭성 $S(n,2)=F(n,1)$과 확률의 총합 $S+D+F=1$로 $a_n+b_n=1-\left(\frac12\right)^n$을 얻는다.
stuck: |
  좌표 1에서 '성공'과 좌표 2에서 '실패'가 대칭($x\mapsto3-x$)이라는 관찰, 그리고 극한값 $a,b$에 대해 점화식에 극한을 취해 연립하는 발상
