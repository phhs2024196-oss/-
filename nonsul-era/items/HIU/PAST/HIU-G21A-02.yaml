stimuli: []

stem: |
  반지름이 1인 반구 모양의 인간 복부가 <그림 1>에 그려져 있다. 복부 내부에 지방이 있는 부분을 복부의 밑면으로부터 높이가 $h$인 지점에서 밑면과 평행한 평면으로 자른 단면은 반지름이 $1-\sqrt h$인 원이며, 이 원은 같은 평면으로 자른 복부의 단면과 중심이 같다. 복부 내부의 지방을 흡입관 끝으로 훑으며 흡입해서 모두 제거한 후, <그림 2>와 같이 지방이 제거된 빈 공간에 원뿔 모양의 의료 보형물을 삽입한다. (단, $0\le h\le1$)

  [그림 1: 반지름 1인 반구. 밑면 중심에서 꼭대기(높이 1)까지 위로 뾰족하게 오므라드는 지방 영역(옆면이 오목한 곡면)이 있고, 높이 $h$에서 자른 단면이 반지름 $1-\sqrt h$인 원으로 표시됨. 왼쪽 위에서 '지방 흡입관'이 반구 안으로 비스듬히 들어와 있음]
  [그림 2: 같은 반구에서 지방이 제거된 빈 공간 안에, 밑면이 반구 밑면 위에 있고 꼭짓점이 위를 향한 원뿔(축이 밑면 중심에서 수직)이 들어 있음]

subparts:
- id: '1'
  stem: |
    <그림 1>에서 제거된 지방의 부피를 구하시오.
  points: 4
  depends_on: []
  answer: {kind: value, value: 'pi/6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '단면적 $\pi(1-\sqrt h)^2$을 $0$부터 $1$까지 적분.'
    steps:
    - {id: 1a, content: '$\int_0^1\pi(1-\sqrt h)^2dh=\pi\left(1-\tfrac43+\tfrac12\right)=\tfrac{\pi}{6}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 높이 $h$에서의 단면의 넓이는?
  - id: S1-B
    audience: B
    source_flow: G21_am.pdf p.11 예시 답안 (1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        높이를 축으로 생각하면 축에 수직인 평면으로 자른 단면은 반지름 $1-\sqrt h$인 원이고 단면적은 $\pi(1-\sqrt h)^2$이다. 다음과 같이 정적분을 이용하여 부피를 구한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\int_0^1\pi(1-\sqrt h)^2dh=\int_0^1\pi(1-2\sqrt h+h)\,dh=\pi\left[h-\frac43h^{\frac32}+\frac12h^2\right]_0^1=\frac16\pi$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        부피를 정적분 식 $\int_0^1\pi(1-\sqrt h)^2dh$로 나타냄 (원 채점기준 2점)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        정적분 과정을 보이고 부피 $\dfrac{\pi}{6}$을 최종적으로 구함 (원 채점기준 2점)
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    복부 위에서 바라보았을 때, 좌표평면 위를 흡입관 끝이 움직인다. 시각 $t$에서의 흡입관 끝의 위치 점 $\mathrm{P}(x,y)$가
    $$x=e^{-t}\cos t,\quad y=e^{-t}\sin t$$
    일 때, 점 $\mathrm{P}(x,y)$가 시각 $t=0$에서 $t=\pi$까지 움직인 거리를 구하시오.
  points: 7
  depends_on: []
  answer: {kind: value, value: 'sqrt(2)*(1-exp(-pi))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '속력이 $\sqrt2e^{-t}$로 깔끔하게 정리된다.'
    steps:
    - {id: 2a, content: '$\sqrt{(x'')^2+(y'')^2}=\sqrt2e^{-t}$, $l=\int_0^\pi\sqrt2e^{-t}dt=\sqrt2(1-e^{-\pi})$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $\frac{dx}{dt}$와 $\frac{dy}{dt}$를 제곱해 더해 보라.
  - id: S2-B
    audience: B
    source_flow: G21_am.pdf p.11 예시 답안 (2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{P}$가 움직인 거리 $l$은 $l=\displaystyle\int_0^\pi\sqrt{\left(\frac{dx}{dt}\right)^2+\left(\frac{dy}{dt}\right)^2}\,dt$이고, $\dfrac{dx}{dt}=-e^{-t}\cos t-e^{-t}\sin t$, $\dfrac{dy}{dt}=-e^{-t}\sin t+e^{-t}\cos t$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $l=\displaystyle\int_0^\pi\sqrt{(-e^{-t}\cos t-e^{-t}\sin t)^2+(-e^{-t}\sin t+e^{-t}\cos t)^2}\,dt=\int_0^\pi e^{-t}\sqrt{(\cos t+\sin t)^2+(-\sin t+\cos t)^2}\,dt$
        $=\displaystyle\int_0^\pi e^{-t}\sqrt{2(\sin^2t+\cos^2t)}\,dt=\int_0^\pi e^{-t}\sqrt2\,dt=\sqrt2\left[-e^{-t}\right]_0^\pi=\sqrt2(1-e^{-\pi})$
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $x$와 $y$의 도함수 $\dfrac{dx}{dt}$, $\dfrac{dy}{dt}$를 구함 (원 채점기준 3점)
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        정적분을 통하여 거리 $\sqrt2(1-e^{-\pi})$를 구함 (원 채점기준 4점)
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    <그림 2>에서 삽입하는 의료 보형물인 원뿔의 중심축은 반구 밑면의 중심을 지나고 반구 밑면에 수직이다. 이때 삽입 가능한 의료 보형물의 최대 부피를 구하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: '9*pi/64', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '축 단면의 경계 $y=(x-1)^2$의 $x=a$에서의 접선이 모선일 때 $V(a)=\tfrac{\pi}{12}(a+1)^2(1-a^2)$.'
    steps:
    - {id: 3a, content: '$V''(a)=\tfrac{\pi}{6}(a+1)(-2a^2-a+1)=0\Rightarrow a=\tfrac12$, $V_{\max}=\tfrac{9}{64}\pi$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - 원뿔의 축을 포함하는 평면으로 잘라 보라.
    - 높이 $h$에서 반지름이 $1-\sqrt h$이면, 단면 경계곡선의 식은?
  - id: S3-B
    audience: B
    source_flow: G21_am.pdf p.12 예시 답안 (3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        밑면의 중심과 밑면에 수직으로 지나는 평면으로 <그림 2>의 복부를 잘랐을 때, 원뿔의 단면은 [그림 3: 점 $(-1,0)$, $(0,1)$, $(1,0)$을 지나는 오목한 두 곡선과, 그 곡선에 접하는 두 직선 및 $x$축으로 이루어진 삼각형; 접점의 $x$좌표 $a$ 표시] 과 같이 $y=(x-1)^2$와 $y=(x+1)^2$에 각각 접하는 2개의 직선들과 $x$축 상 $(-1,0)$과 $(1,0)$ 사이의 직선으로 이루어진 삼각형이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        <그림 3>의 $x=a$에서 $y=(x-1)^2$에 접하는 접선의 기울기는 $2(a-1)$이며, 접선의 방정식은 $y=2(a-1)(x-a)+(a-1)^2$이다. 해당 직선이 $x$축과 $y$축과 만나는 점들은 각각 $\left(\dfrac{a+1}{2},0\right)$과 $(0,1-a^2)$이다. 즉, 원뿔 밑면의 반지름은 $\dfrac{a+1}{2}$이고, 원뿔의 높이는 $1-a^2$이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        따라서 원뿔의 부피는 $V=\dfrac1{12}\pi(a+1)^2(1-a^2)$이다. 단, $0\le a\le1$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        함수 $V$의 도함수 $\dfrac{dV}{da}=\dfrac16\pi(a+1)(-2a^2-a+1)$는 $a=\dfrac12$에서 $\dfrac{dV}{da}=0$, $0<a<\dfrac12$에서 $\dfrac{dV}{da}>0$, $\dfrac12<a<1$에서 $\dfrac{dV}{da}<0$을 만족한다. 그래프의 개형으로부터 구간 $[0,1]$에서 함수 $V$는 $a=\dfrac12$에서 최댓값 $\dfrac{9}{64}\pi$을 취한다. 즉, 원뿔의 최대 부피는 $\dfrac{9}{64}\pi$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        밑면에 중심과 밑면에 수직인 평면으로 입체 도형을 자른 평면을 $-1\le x\le1$와 $-1\le y\le1$ 구간에서 좌표평면에 표현 (원 채점기준 3점)
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        접선의 방정식을 세우고, 접점의 좌표를 이용하여 원뿔 부피를 함수 $V=\dfrac{\pi}{12}(a+1)^2(1-a^2)$로 표현 (원 채점기준 3점)
      depends_on: [3.M1]
      implied_ok: false
      steps: [3b-2, 3b-3]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        합성함수의 미분과 함수의 최댓값 구하는 원리를 이용하여 부피가 최대가 되는 접점의 좌표 $a=\dfrac12$를 구한 후 최대 부피값 $\dfrac{9}{64}\pi$ 구함 (원 채점기준 3점)
      depends_on: [3.M2]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

