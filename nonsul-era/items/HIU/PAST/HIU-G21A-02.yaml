intent: |
  미분과 적분을 이용하여 입체도형의 부피, 좌표평면 위에서 점이 움직인 거리, 함수의 최댓값을 구할 수 있는지 평가한다.
  (1) 정적분을 이용하여 입체도형의 부피를 구할 수 있는지 평가한다.
  (2) 미분과 적분을 이용하여 좌표평면 위에서 점이 움직인 거리를 구할 수 있는지 평가한다.
  (3) 원뿔의 부피를 적절한 함수로 나타내고, 미분을 이용하여 부피의 최댓값을 구할 수 있는지 평가한다.
key_idea: |
  단면적 $\pi(1-\sqrt h)^2$을 높이로 적분하고, (3)은 축을 포함하는 단면에서 경계곡선 $y=(x-1)^2$($0\le x\le1$)의 접선이 원뿔의 모선이 될 때 접점 $x=a$의 함수로 부피를 세운다.
stuck: |
  (3)에서 축을 포함하는 평면으로 잘라 2차원 문제로 바꾸고, 단면 반지름 $1-\sqrt h$를 곡선 $h=(1-r)^2$으로 읽는 것
