stimuli: []

stem: |
  아래 <그림 1>과 같이 중심에서 꼭짓점까지의 거리가 1인 정$n$각형 두 개가 꼭짓점을 맞대며 한 변에서 서로 접하고 있다. 두 도형 중 하나의 '고정 도형'은 제 자리에 고정되어 있다. 나머지 하나의 '회전 도형'이 꼭짓점을 축으로 다음 변이 접할 때까지 회전하고, 이를 반복하여 '고정 도형'의 주위를 돌아 원래 자리까지 움직인다. (단, 정$n$각형의 중심은 외접원의 중심이다.)

  [그림 1: 검게 칠한 정오각형(고정 도형)의 한 변에 실선 정오각형(회전 도형)이 맞닿아 있고, 고정 도형 둘레에 회전 도형이 차례로 놓이는 위치들이 점선 정오각형으로, 회전 방향이 화살표로 그려져 있음. 회전 도형 안에 중심에서 꼭짓점까지의 거리 1 표시]
  [그림 2: 중심 O에서 꼭짓점까지의 거리가 1인 정$n$각형의 일부; 가장 아래 변의 한 꼭짓점에서 가장 먼(위쪽) 꼭짓점까지의 선분이 $r_n$으로 표시됨]

subparts:
- id: '1'
  stem: |
    $n=3$일 때 '회전 도형'이 훑고 지나간 면적을 구하시오.
  points: 4
  depends_on: []
  answer: {kind: value, value: '9*sqrt(3)/4 + 9*pi/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '정삼각형 3개(한 변 $\sqrt3$) + 반지름 $\sqrt3$, 중심각 $\pi$인 부채꼴 3개.'
    steps:
    - {id: 1a, content: '$3\cdot\tfrac{3\sqrt3}{4}+3\cdot\tfrac{3\pi}{2}=\tfrac{9\sqrt3}{4}+\tfrac{9\pi}{2}$', criteria: ['1.R1', '1.A1']}
    hint_ladder:
    - 한 꼭짓점을 축으로 회전하는 동안 가장 먼 꼭짓점은 어떤 곡선을 그리는가?
  - id: S1-B
    audience: B
    source_flow: G21_am.pdf p.16 예시 답안 (1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        정삼각형이 차지하는 (i) 영역과, 꼭짓점의 궤적에 포함되는 (ii) 영역의 합으로 나누어 생각할 수 있다. [그림: 검은 정삼각형(고정 도형) 주위로 세 개의 반원 모양 영역 (ii)와 그 사이의 정삼각형 영역 (i)이 그려진 세잎 모양 도형]
      criteria: ['1.R1']
    - id: 1b-2
      content: |
        (i) 영역: 정삼각형 3개, 한 변의 길이 $\sqrt3$: 총 넓이 $3\times\left(\dfrac{3\sqrt3}{4}\right)$
        (ii) 영역: 부채꼴 3개, 반지름 $\sqrt3$, 중심각 $\pi$: 총 넓이 $3\times\left(\dfrac{3\pi}{2}\right)$
        총 넓이 $\dfrac{9\sqrt3}{4}+\dfrac{9\pi}{2}$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: |
        '회전 도형'이 훑고 지나간 도형의 형태(정삼각형 3개 + 반원 3개)를 구하고 과정을 설명함 (원 채점기준 2점)
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        '회전 도형'이 훑고 지나간 면적 $\dfrac{9\sqrt3}{4}+\dfrac{9\pi}{2}$을 구함 (원 채점기준 2점)
      depends_on: [1.R1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $n$이 3 이상의 홀수일 때 <그림 2>와 같이 중심 O에서 꼭짓점까지의 거리가 1인 정$n$각형의 가장 먼 두 꼭짓점 사이의 거리를 $r_n$이라 하자. $r_n=2\cos\left(\dfrac{\pi}{2n}\right)$임을 보이시오.
  points: 6
  depends_on: []
  answer: {kind: proof, value: 'r_n=2*cos(pi/(2*n))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '가장 먼 두 꼭짓점과 중심이 이루는 이등변삼각형의 꼭지각은 $\pi-\frac{\pi}{n}$이다.'
    steps:
    - {id: 2a, content: '$\angle\mathrm{AOD}=\pi-\tfrac{\pi}{n}$, 밑각 $\tfrac{\pi}{2n}$, $r_n=2\cos\tfrac{\pi}{2n}$', criteria: ['2.R1', '2.M1', '2.A1']}
    hint_ladder:
    - 이웃한 두 꼭짓점과 중심이 이루는 각은?
  - id: S2-B
    audience: B
    source_flow: G21_am.pdf p.17 예시 답안 (2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        정$n$각형의 중심을 O라고 한다 [예시 그림: $n=5$인 경우. 꼭짓점 A가 맨 위, 아래 변 BD의 중점 C, A에서 OD에 대응하는 AD 위의 점 E($\mathrm{OE}\perp\mathrm{AD}$), $\mathrm{AB}=\mathrm{AD}=r_n$]. 이등변삼각형 OBD에서 $\angle\mathrm{BOD}=2\pi/n$이므로, $\angle\mathrm{COD}=1/2\times\angle\mathrm{BOD}=\pi/n$.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        $\angle\mathrm{AOD}=\pi-\angle\mathrm{COD}=\dfrac{n-1}{n}\pi$이므로, 이등변삼각형 AOD에서 $\angle\mathrm{OAD}=\angle\mathrm{ODA}=\left(\pi-\dfrac{n-1}{n}\pi\right)/2=\dfrac{\pi}{2n}$.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $\cos(\angle\mathrm{ODA})=\cos\left(\dfrac{\pi}{2n}\right)=\dfrac{\overline{\mathrm{DE}}}{1}=r_n/2$, 따라서 $r_n=2\cos\left(\dfrac{\pi}{2n}\right)$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        중심과 두 연이은 꼭지점이 이루는 각이 $2\pi/n$임을 설명함 (원 채점기준 2점)
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $r_n$을 포함하는 이등변삼각형(AOD)을 나타냄 (원 채점기준 2점)
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $\cos\left(\dfrac{\pi}{2n}\right)=r_n/2$임을 이용하여 $r_n$의 값을 구함 (원 채점기준 2점)
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $n$이 3 이상의 홀수일 때 '회전 도형'이 훑고 지나간 면적을 $S_n$이라 하자. $S_n$의 식을 구하고, $\displaystyle\lim_{k\to\infty}S_{2k+1}$의 값과 그 의미를 설명하시오. (단, $k$는 자연수이다.)
  points: 10
  depends_on: ['2']
  answer: {kind: expression, value: 'S_n=4*cos(pi/(2*n))**2*(n*sin(pi/n)/2+3*pi/2); limit=8*pi', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$n$개의 이등변삼각형(두 변 $r_n$, 끼인각 $\frac{\pi}{n}$)과 $n$개의 부채꼴(반지름 $r_n$, 중심각 $\frac{3\pi}{n}$).'
    steps:
    - {id: 3a, content: '$S_n=r_n^2\left(\tfrac{n\sin(\pi/n)}{2}+\tfrac{3\pi}{2}\right)\to4\left(\tfrac{\pi}{2}+\tfrac{3\pi}{2}\right)=8\pi$', criteria: ['3.R1', '3.M1', '3.A1', '3.R2']}
    hint_ladder:
    - (1)의 정삼각형 영역과 반원 영역은 일반 $n$에서 무엇이 되는가?
  - id: S3-B
    audience: B
    source_flow: G21_am.pdf p.17~18 예시 답안 (3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $n$개의 (i) 영역 및 (ii) 영역의 합으로 생각할 수 있다. 이때 (i)은 정$n$각형의 한 변과 두 개의 가장 먼 두 꼭짓점 사이를 잇는 선분으로 이루어진 이등변삼각형이고, (ii)는 $r_n$을 반지름으로 갖는 부채꼴이다. [그림: 고정 도형의 꼭짓점 A에서 회전 도형의 가장 먼 꼭짓점 D·E까지 선분 $r_n$, 호 DE로 이루어진 부채꼴 (ii)와 삼각형 ABE (i)이 표시됨. C, B는 고정 도형의 이웃 꼭짓점, O는 중심]
      criteria: ['3.R1']
    - id: 3b-2
      content: |
        $\angle\mathrm{CAB}$는 정$n$각형의 내각이므로 $\angle\mathrm{CAB}=\pi\left(\dfrac{n-2}{n}\right)$. 이등변삼각형 ABE에 대하여 위 문제에서 $\dfrac{\angle\mathrm{AEB}}{2}=\dfrac{\pi}{2n}$이므로 $\angle\mathrm{EAB}=\dfrac{\pi}{2}\left(\dfrac{n-1}{n}\right)$. 점 A 주위로 $2\pi=\angle\mathrm{DAE}+2\angle\mathrm{EAB}+\angle\mathrm{CAB}$이므로 $\angle\mathrm{DAE}=3\pi/n$. 위 문제에서 주어진 것과 같이 $r_n=2\cos\left(\dfrac{\pi}{2n}\right)$.
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        (i) 이등변삼각형 $n$개, 긴 변 $r_n=2\cos\left(\dfrac{\pi}{2n}\right)$, 사이각 $\pi/n$: 총 넓이 $n\times\left(2\cos\dfrac{\pi}{2n}\right)^2\times\dfrac{\sin(\pi/n)}{2}$
        (ii) 부채꼴 $n$개, 반지름 $r_n=2\cos\left(\dfrac{\pi}{2n}\right)$, 중심각 $3\pi/n$: 총 넓이 $n\times\left(2\cos\dfrac{\pi}{2n}\right)^2\times\dfrac{3\pi}{2n}$
      criteria: ['3.M1']
    - id: 3b-4
      content: |
        $S_n=4\cos^2\left(\dfrac{\pi}{2n}\right)\times\left(\dfrac{n\sin(\pi/n)}{2}+\dfrac{3\pi}{2}\right)$,
        $S_{2k+1}=4\cos^2\left(\dfrac{\pi}{2(2k+1)}\right)\times\left(\dfrac{(2k+1)\sin(\pi/(2k+1))}{2}+\dfrac{3\pi}{2}\right)$,
        $\displaystyle\lim_{k\to\infty}S_{2k+1}=8\pi$
      criteria: ['3.A1']
    - id: 3b-5
      content: |
        극한을 취하면 반지름 1인 원 '회전도형'이 반지름 1인 원 '고정도형'의 둘레에 접하며 움직이는 것과 같다 (반지름 3인 원의 중심에 반지름 1인 구멍이 뚫린 영역, 넓이 $9\pi-\pi=8\pi$).
      criteria: ['3.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.R1
      mark_type: R
      points: 2
      evidence: |
        $r_n$을 변으로 갖는 이등변삼각형과 $r_n$을 반지름으로 갖는 부채꼴로 이루어짐을 설명함 (원 채점기준 2점)
      depends_on: []
      steps: [3b-1, 3b-2]
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        이등변삼각형과 부채꼴 각각의 면적을 구함 (원 채점기준 3점)
      depends_on: [3.R1]
      implied_ok: false
