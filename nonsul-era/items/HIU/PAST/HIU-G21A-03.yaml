intent: |
  간단한 평면도형과 삼각함수의 기본적인 성질을 이해하는지 평가한다. 이를 바탕으로 주어진 수학적 조건에서 변형되는 수열의 식을 수립하고 응용할 수 있는지 평가한다. 삼각함수로 이루어진 수열의 극한값을 구할 수 있는지 평가한다.
  (1) 간단한 도형의 넓이를 삼각함수를 이용하여 구할 수 있는지 평가한다.
  (2) 간단한 도형에서 각과 변의 길이 사이의 관계를 삼각함수를 이용하여 구할 수 있는지 평가한다.
  (3) 도형의 넓이를 삼각함수를 이용하여 구할 수 있는지 평가한다. 삼각함수의 극한을 구할 수 있는지 평가한다.
key_idea: |
  꼭짓점을 축으로 한 번 회전할 때 회전 도형이 훑는 영역은 '가장 먼 꼭짓점까지의 거리 $r_n$을 반지름으로 하는 부채꼴(중심각 $\frac{3\pi}{n}$)'과 '정$n$각형의 한 변과 두 대각선 $r_n$으로 이루어진 이등변삼각형(꼭지각 $\frac{\pi}{n}$)'으로 나뉜다.
stuck: |
  회전 한 번마다 훑는 영역을 부채꼴과 이등변삼각형으로 분해하고, 점 A 주위 각의 합 $2\pi=\angle\mathrm{DAE}+2\angle\mathrm{EAB}+\angle\mathrm{CAB}$로 부채꼴의 중심각 $\frac{3\pi}{n}$을 얻는 것
