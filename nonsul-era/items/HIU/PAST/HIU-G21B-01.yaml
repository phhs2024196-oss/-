stimuli: []

stem: |
  공원에 서식하는 다람쥐의 개체수 $N$을 예측하고자 한다. 먼저 공원 내 다람쥐 20마리를 잡아 표식을 부착한 뒤 풀어 주었다. 며칠 후 공원에서 임의로 잡은 25마리를 모아 표식을 확인하였다. 이때 3마리만 표식이 있을 확률을 $f(N)$이라고 하자.

  위와 같은 사건이 일어나려면 다람쥐는 42마리 이상임을 알 수 있다. 즉 $N\ge42$이다.

subparts:
- id: '1'
  stem: |
    함수 $f(N)$을 구하시오.
  points: 7
  depends_on: []
  answer: {kind: expression, value: 'binomial(20,3)*binomial(N-20,22)/binomial(N,25)', equivalents: ['factorial(20)*factorial(25)*factorial(N-20)*factorial(N-25)/(factorial(3)*factorial(17)*factorial(22)*factorial(N-42)*factorial(N))'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '표식 있는 20마리 중 3마리, 없는 $N-20$마리 중 22마리.'
    steps:
    - {id: 1a, content: '$f(N)=\dfrac{{}_{20}\mathrm{C}_3\times{}_{N-20}\mathrm{C}_{22}}{{}_N\mathrm{C}_{25}}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 25마리 중 표식이 없는 것은 몇 마리인가?
  - id: S1-B
    audience: B
    source_flow: G21_pm.pdf p.6 예시 답안 (1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        총 경우의 수: ${}_N\mathrm{C}_{25}$ (총 $N$마리중 25마리를 순서 상관없이 뽑는 경우의 수)
        문제의 사건이 일어날 경우의 수: ${}_{20}\mathrm{C}_3\times{}_{N-20}\mathrm{C}_{22}$ (표식이 붙여진 20마리 중 3마리를 뽑을 경우의 수 $\times$ 표식이 붙여지지 않은 $(N-20)$마리 중 $(25-3)$마리를 뽑을 경우의 수)
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 이 사건의 확률은
        $$f(N)=\frac{{}_{20}\mathrm{C}_3\times{}_{N-20}\mathrm{C}_{22}}{{}_N\mathrm{C}_{25}}=\frac{\dfrac{20!}{3!(20-3)!}\cdot\dfrac{(N-20)!}{(22)!(N-20-22)!}}{\dfrac{N!}{25!(N-25)!}}=\frac{20!25!(N-20)!(N-25)!}{3!17!22!(N-42)!N!}$$
        답안으로 가능한 다른 표현들: $f(N)=\dfrac{{}_{20}C_3\times{}_{N-20}C_{22}}{{}_NC_{25}}$, $f(N)=\dfrac{20\times19\times18\times25\times24\times23\times(N-20)!(N-25)!}{3!(N-42)!N!}$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        전체 경우의 수 ${}_N\mathrm{C}_{25}$와 사건의 경우의 수 ${}_{20}\mathrm{C}_3\times{}_{N-20}\mathrm{C}_{22}$를 세움
      depends_on: []
      implied_ok: true
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        조합을 이용하여 확률을 $N$에 대한 함수로 올바르게 표시 (원 채점기준은 통합 7점 — M3·A4로 나눔)
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $g(N)=\dfrac{f(N+1)}{f(N)}$일 때, $g(N)$을 $\dfrac{N^2+cN+d}{N^2+aN+b}$의 형태로 구하시오.
  points: 3
  depends_on: ['1']
  answer: {kind: expression, value: '(N**2-43*N+456)/(N**2-40*N-41)', equivalents: ['(N-19)*(N-24)/((N-41)*(N+1))'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '팩토리얼 비가 대부분 약분된다.'
    steps:
    - {id: 2a, content: '$g(N)=\dfrac{(N-19)(N-24)}{(N-41)(N+1)}=\dfrac{N^2-43N+456}{N^2-40N-41}$', criteria: ['2.A1']}
    hint_ladder:
    - $\dfrac{(N-19)!}{(N-20)!}$는?
  - id: S2-B
    audience: B
    source_flow: G21_pm.pdf p.6 예시 답안 (2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $$g(N)=\frac{\dfrac{{}_{20}C_3\times{}_{N+1-20}C_{22}}{{}_{N+1}C_{25}}}{\dfrac{{}_{20}C_3\times{}_{N-20}C_{22}}{{}_NC_{25}}}=\frac{\dfrac{20!25!(N+1-20)!(N+1-25)!}{3!17!22!(N+1-42)!(N+1)!}}{\dfrac{20!25!(N-20)!(N-25)!}{3!17!22!(N-42)!N!}}=\frac{(N-19)(N-24)}{(N-41)(N+1)}=\frac{N^2-43N+456}{N^2-40N-41}$$
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.A1
      mark_type: B
      points: 3
      evidence: |
        문제에서 요구한 유리함수 형태로 $g(N)=\dfrac{N^2-43N+456}{N^2-40N-41}$을 표시 (원 채점기준 3점)
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $f(N+1)>f(N)$을 만족하는 $N$의 범위와 $f(N+1)<f(N)$을 만족하는 $N$의 범위를 각각 구하시오.
  points: 5
  depends_on: ['2']
  answer: {kind: set, value: 'f(N+1)>f(N): 42<=N<=165; f(N+1)<f(N): N>=166', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$g(N)>1\iff N^2-43N+456>N^2-40N-41\iff 3N<497$.'
    steps:
    - {id: 3a, content: '$N<\tfrac{497}{3}=165.66\cdots$ 이므로 $42\le N\le165$; 반대로 $N\ge166$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $f(N)>0$이므로 $f(N+1)>f(N)$은 $g(N)$에 대해 무엇과 같은가?
  - id: S3-B
    audience: B
    source_flow: G21_pm.pdf p.6 예시 답안 (3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $42\le N$일 때, $f(N)>0$이므로 $f(N+1)>f(N)$일 필요충분조건은 $1<\dfrac{f(N+1)}{f(N)}=\dfrac{N^2-43N+456}{N^2-40N-41}$ 즉, $N^2-43N+456>N^2-40N-41$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        따라서 $3N<497$, $N<\dfrac{497}{3}=165.666\cdots$이다. $N$은 자연수이므로 $42\le N\le165$.
        마찬가지로 $f(N+1)<f(N)$일 필요충분조건은 $N>165.666\cdots$이다. $N$은 자연수이므로 $N\ge166$.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $f(N)>0$을 근거로 $f(N+1)>f(N)$을 $g(N)>1$, 즉 일차부등식으로 바꿈 (원 채점기준: 두 범위 중 한 가지만 올바르게 구하면 2점)
      depends_on: []
      implied_ok: true
      ft: {allowed: true, from: [2.A1], max_points: 2}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $42\le N\le165$와 $N\ge166$ 두 범위를 각각 올바르게 구함 (원 채점기준: 각각 올바르게 5점)
      depends_on: [3.M1]
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    위의 결과를 이용하여 $f(N)$이 최대가 되는 자연수 $N$의 값을 구하고, 그 이유를 설명하시오.
  points: 5
  depends_on: ['3']
  answer: {kind: value, value: '166', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: '$f(42)<\cdots<f(166)>f(167)>\cdots$.'
    steps:
    - {id: 4a, content: '$N=166$', criteria: ['4.R1', '4.A1']}
    hint_ladder:
    - (3)의 두 범위가 바뀌는 경계는?
  - id: S4-B
    audience: B
    source_flow: G21_pm.pdf p.6 예시 답안 (4)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        (3)으로부터 42이상의 자연수의 집합에서 정의된 함수 $f(N)$에 대해, $42\le N\le165$일 때 $f(N)<f(N+1)$이고, $N\ge166$일 때 $f(N)>f(N+1)$이다.
      criteria: ['4.R1']
    - id: 4b-2
      content: |
        즉, $f(42)<f(43)<\cdots<f(165)<f(166)>f(167)>\cdots$이므로 $N=166$일 때 $f(N)$은 최대가 된다.
      criteria: ['4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 4.R1
      mark_type: R
      points: 2
      evidence: |
        $g(N)>1$일 때 $f(N)$은 증가하며, $g(N)<1$일 때 $f(N)$은 감소함을 판단 (원 채점기준 2점; 일차부등식을 통한 증감 판단 2점과 같은 내용)
      depends_on: []
      ft: {allowed: true, from: [3.A1], max_points: 2}
      steps: [4b-1]
    - id: 4.A1
      mark_type: A
      points: 3
      evidence: |
        $N=166$을 올바르게 구하고 이때 $f(N)$가 자연수 $N$일 때 최대가 됨을 설명 (원 채점기준 5점 만점 항목 — R2·A3로 나눔)
      depends_on: [4.R1]
      steps: [4b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

