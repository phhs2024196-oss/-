intent: |
  주어진 사건이 일어날 경우의 수와 확률을 계산할 수 있는지 평가한다. 또한 함수의 증감을 파악하여 확률이 최대가 되는 값을 구할 수 있는지 평가한다.
  (1) 조합을 이용하여 확률을 구할 수 있는지 평가한다.
  (2) 식을 정리하여 간단한 유리함수 형태로 변형할 수 있는지 평가한다.
  (3) 일차 부등식을 만족하는 변수의 범위를 찾을 수 있는지 평가한다.
  (4) 위의 결과를 바탕으로 함수의 증감을 파악하여 확률이 최대가 되는 자연수를 구할 수 있는지 평가한다.
key_idea: |
  $f(N)=\dfrac{{}_{20}\mathrm{C}_3\times{}_{N-20}\mathrm{C}_{22}}{{}_N\mathrm{C}_{25}}$의 연속항 비 $\dfrac{f(N+1)}{f(N)}=\dfrac{N^2-43N+456}{N^2-40N-41}$을 1과 비교하면 일차부등식 $3N<497$이 된다.
stuck: |
  자연수에서 정의된 함수의 최대를 미분 대신 연속항의 비 $g(N)$와 1의 대소로 판단하는 발상
