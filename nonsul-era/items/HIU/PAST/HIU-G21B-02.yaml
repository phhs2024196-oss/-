intent: |
  다항식으로 주어진 방정식의 서로 다른 양의 실근의 개수에 관한 조건을 탐구하는 과정을 통하여, 롤의 정리 및 연속함수와 다항함수의 기본적인 특성을 이해하는지 평가하고, 해답을 유도하는 과정이 요구하는 수학적 사고력을 평가하고자 하였다.
key_idea: |
  최고차항 계수가 양수이고 근에서 부호가 바뀌므로 양의 근의 개수의 홀짝은 $a_0=f(0)$의 부호로 정해지고, 롤의 정리 $k_0\le k_1+1$과 홀짝 조건을 합치면 $k_0\le k_1$, 이를 $f'$에 다시 적용해 $k_0\le k_2$를 얻는다.
stuck: |
  (3)에서 $a_0$와 $a_1$의 부호가 같으면 (1)에 의해 $k_0$와 $k_1$의 홀짝이 같으므로 $k_0=k_1+1$이 불가능하다는 관찰
