stimuli: []

stem: |
  다음의 예는 함수 $g(x)$의 그래프와 함숫값의 부호를 나타낸 표이다. 방정식 $g(x)=0$은 양의 실근 $a,b,c,d$를 갖는다.

  [그림: $y=g(x)$의 그래프. $y$축 위의 양수에서 출발해 $x=a$에서 $x$축을 아래로 지나고, $a$와 $b$ 사이에서 음수(작은 물결 모양)로 있다가 $x=b$에서 위로 지나 $b$와 $c$ 사이에서 양수, $x=c$에서 아래로, $c$와 $d$ 사이에서 음수, $x=d$ 이후 양수로 증가]

  | $x$ | $0$ | $\cdots$ | $a$ | $\cdots$ | $b$ | $\cdots$ | $c$ | $\cdots$ | $d$ | $\cdots$ |
  |---|---|---|---|---|---|---|---|---|---|---|
  | $g(x)$ | $g(0)$ | $+$ | $0$ | $-$ | $0$ | $+$ | $0$ | $-$ | $0$ | $+$ |

  다음 롤의 정리에 따라, 위의 미분가능한 함수 $g(x)$에 대하여 $a$와 $b$ 사이에 $g'(x)=0$의 양의 실근이 하나 이상 존재함을 알 수 있다.

  <롤의 정리>
  함수 $g(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능할 때, $g(a)=g(b)$이면 $g'(c)=0$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.

  실수 계수를 갖는 $n$차 다항함수 $f(x)=a_nx^n+a_{n-1}x^{n-1}+\cdots+a_1x+a_0$가 다음의 조건 (a)와 (b)를 만족한다.

  (a) $a_n>0$, $a_{n-1}\cdots a_1a_0\ne0$
  (b) 함수 $f(x)$, $f'(x)$, $f''(x)$의 그래프들은 $x$축에 접하지 않는다.

  이러한 다항함수 $f(x)$에 대하여 세 방정식 $f(x)=0$, $f'(x)=0$, $f''(x)=0$의 서로 다른 양의 실근의 개수를 각각 $k_0$, $k_1$, $k_2$라고 하자.

subparts:
- id: '1'
  stem: |
    $a_0>0$ 이면 $f(x)=0$의 서로 다른 양의 실근의 개수 $k_0$가 짝수이고, $a_0<0$ 이면 $k_0$가 홀수임을 위의 제시문에 주어진 것과 같은 표를 이용하여 설명하시오.
  points: 5
  depends_on: []
  answer: {kind: proof, value: 'a_0>0 => k_0 even; a_0<0 => k_0 odd', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$f(0)=a_0$에서 출발해 근마다 부호가 바뀌고 마지막 구간은 $+$이다.'
    steps:
    - {id: 1a, content: '마지막 구간의 부호 $=\operatorname{sgn}(a_0)\cdot(-1)^{k_0}=+$', criteria: ['1.R1']}
    hint_ladder:
    - $x$가 충분히 클 때 $f(x)$의 부호는?
  - id: S1-B
    audience: B
    source_flow: G21_pm.pdf p.13 예시 답안 (1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$의 그래프가 $x$축에 접하지 않으므로 근의 전후에서 $f(x)$의 값의 부호가 바뀐다. $f(x)=0$의 서로 다른 양의 실근을 $r_1<r_2<\cdots<r_{k_0}$라 하면, $a_0>0$인 경우와 $a_0<0$인 경우의 제시문에 주어진 것과 같은 표는 각각 아래와 같다.
        (a) $a_0>0$인 경우: $x$: $0,\cdots,r_1,\cdots,r_2,\cdots,\cdots,r_{k_0},\cdots$ / $f(x)$: $a_0,+,0,-,0,+,\cdots,0,(-1)^{k_0}$의 부호
        (b) $a_0<0$인 경우: $f(x)$: $a_0,-,0,+,0,-,\cdots,0,(-1)^{k_0+1}$의 부호
      criteria: ['1.R1']
    - id: 1b-2
      content: |
        $f(x)$의 최고차항의 계수가 양수이므로, $r_{k_0}<x$인 $x$의 구간에서 $f(x)$의 값의 부호는 $+$이어야 한다. 따라서, $a_0>0$일 때 $(-1)^{k_0}$의 부호가 $+$이어야 하므로 $k_0$는 짝수이다. 마찬가지로 $a_0<0$일 때 $k_0+1$이 짝수이어야 하므로 $k_0$는 홀수이다.
        만약 $f(x)=0$의 양의 실근이 존재하지 않는다면 즉, $k_0=0$이라면, 위와 같은 표의 $x>0$ 구간 전체에서 함숫값의 부호가 $+$이어야 하므로 $a_0>0$이다. 따라서 이 경우도 (1)은 성립한다.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: |
        예시 답안의 표와 유사한 표를 그리고 정확한 논리 전개로 설명함 (원 채점기준 5점)
      depends_on: []
      steps: [1b-1, 1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    롤의 정리를 이용하여 $k_0\le k_1+1$이 성립함을 설명하시오.
  points: 3
  depends_on: []
  answer: {kind: proof, value: 'k_0 <= k_1 + 1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '이웃한 양의 근 사이마다 $f''$의 양의 근이 하나씩.'
    steps:
    - {id: 2a, content: '$r_i<s_i<r_{i+1}$ ($1\le i\le k_0-1$) $\Rightarrow k_1\ge k_0-1$', criteria: ['2.R1']}
    hint_ladder:
    - $f(r_i)=f(r_{i+1})=0$에 롤의 정리를 적용하라.
  - id: S2-B
    audience: B
    source_flow: G21_pm.pdf p.13~14 예시 답안 (2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        항상 $k_1\ge0$이므로 $k_0\le1$인 경우 주어진 부등식은 당연히 성립한다. 이제 $k_0\ge2$라고 가정하고, $f(x)=0$의 서로 다른 양의 실근을 $r_1<r_2<\cdots<r_{k_0}$라 하자.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        각 $1\le i\le k_0-1$에 대하여 롤의 정리에 의해 $r_i<s_i<r_{i+1}$인 $f'(x)=0$의 양의 실근 $s_i$이 존재한다. 즉, $r_1<s_1<r_2<s_2<r_3<\cdots<r_{k_0-1}<s_{k_0-1}<r_{k_0}$인 $f'(x)=0$의 서로 다른 양의 실근 $s_1,s_2,\dots,s_{k_0-1}$이 존재한다. 따라서 $k_1\ge k_0-1$이 성립하므로 $k_0\le k_1+1$이다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        서로 다른 양의 실근을 $0<r_1<r_2<\cdots<r_{k_0}$와 같이 표현하고, 롤의 정리를 적용하여 설명함 (원 채점기준 3점)
      depends_on: []
      steps: [2b-1, 2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $n\ge1$이고 $a_0$와 $a_1$의 부호가 같은 경우, $k_0\le k_1$이 성립함을 설명하시오.
  points: 5
  depends_on: ['1', '2']
  answer: {kind: proof, value: 'k_0 <= k_1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '(1)을 $f$와 $f''$에 각각 적용하면 $k_0\equiv k_1\pmod 2$.'
    steps:
    - {id: 3a, content: '$k_0\ne k_1+1$ 이고 $k_0\le k_1+1$ 이므로 $k_0\le k_1$', criteria: ['3.R1', '3.R2']}
    hint_ladder:
    - $f'(x)$의 상수항은 무엇인가?
  - id: S3-B
    audience: B
    source_flow: G21_pm.pdf p.14 예시 답안 (3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        문항 (1)에 의해 $f(x)$의 상수항인 $a_0$와 $f'(x)$의 상수항인 $a_1$의 부호가 같은 경우, $k_0$와 $k_1$은 모두 짝수이거나 모두 홀수이다. 따라서 $k_0\ne k_1+1$ 이다.
      criteria: ['3.R1']
    - id: 3b-2
      content: |
        문항 (2)에 의해 $k_0\le k_1+1$이므로 $k_0\le k_1$ 이다.
      criteria: ['3.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        문항 (1)의 결과를 $f$와 $f'$에 적용하여 $k_0\ne k_1+1$을 도출함
      depends_on: []
      steps: [3b-1]
    - id: 3.R2
      mark_type: R
      points: 2
      evidence: |
        문항 (2)의 결과를 이용하여 $k_0\le k_1$을 설명함 (원 채점기준은 두 단계 합쳐 5점 — 3+2로 나눔)
      depends_on: [3.R1]
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    $n\ge2$이고 $a_0$, $a_1$, $a_2$의 부호가 모두 같은 경우, $k_0\le k_2$이 성립함을 설명하시오.
  points: 3
  depends_on: ['3']
  answer: {kind: proof, value: 'k_0 <= k_1 <= k_2', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: '(3)을 $f''$에 다시 적용($f''$의 상수항 $a_1$, $f''''$의 상수항 $2a_2$).'
    steps:
    - {id: 4a, content: '$k_0\le k_1\le k_2$', criteria: ['4.R1']}
    hint_ladder:
    - $f'(x)$도 조건 (a), (b)를 만족하는가?
  - id: S4-B
    audience: B
    source_flow: G21_pm.pdf p.14 예시 답안 (4)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        문항 (3)에 의해 $k_0\le k_1$이다. $f'(x)$의 상수항인 $a_1$과 $f''(x)$의 상수항인 $2a_2$의 부호가 같으므로 마찬가지로 문항 (3)에 의하여 $k_1\le k_2$이다. 따라서 $k_0\le k_1\le k_2$ 이므로 $k_0\le k_2$이다.
      criteria: ['4.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 4.R1
      mark_type: R
      points: 3
      evidence: |
        문항 (3)의 결과를 ($f$와 $f'$에 이어 $f'$와 $f''$에) 이용하여 설명함 (원 채점기준 3점)
      depends_on: []
      steps: [4b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '5'
  stem: |
    다항함수 $f(x)=x^4+2718x^3-2818x^2-3141x-5926$는 제시문의 조건 (a)와 (b)를 만족한다. 위의 결과들을 이용하여 방정식 $f(x)=0$의 서로 다른 양의 실근의 개수를 구하시오.
  points: 4
  depends_on: ['1', '4']
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S5-A
    audience: A
    method_no: 1
    key_idea: '$a_0,a_1,a_2<0$ → $k_0\le k_2\le2$, 그리고 $a_0<0$이면 $k_0$ 홀수.'
    steps:
