stimuli: []

stem: |
  반지름이 1인 원에 내접하는 정다각형들을 생각하자. 이러한 정$n$각형의 꼭짓점들을 시곗바늘이 도는 방향과 반대인 방향의 순서대로 $\mathrm{P}_1,\mathrm{P}_2,\dots,\mathrm{P}_n$이라 하자.

  [그림: 왼쪽 $n=4$ — 원에 내접한 정사각형 $\mathrm{P}_1$(오른쪽 위), $\mathrm{P}_2$(왼쪽 위), $\mathrm{P}_3$(왼쪽 아래), $\mathrm{P}_4$(오른쪽 아래)와 두 대각선. 오른쪽 $n=5$ — 원에 내접한 정오각형 $\mathrm{P}_1$(맨 위), $\mathrm{P}_2,\mathrm{P}_3,\mathrm{P}_4,\mathrm{P}_5$(시계 반대 방향)와 모든 대각선(별 모양)]

  정$n$각형의 두 꼭짓점을 잇는 선분들은 ${}_n\mathrm{C}_2=\dfrac{n(n-1)}{2}$개 있다. 이 선분들의 길이의 평균을 $M_n$이라 하자. 가령 정사각형의 두 꼭짓점을 잇는 선분은 6개 있고 그 길이의 평균 $M_4$는 아래와 같다.
  $$M_4=\frac{\sqrt2+\sqrt2+\sqrt2+\sqrt2+2+2}{6}=\frac{2\sqrt2+2}{3}$$

subparts:
- id: '1'
  stem: |
    정$n$각형의 꼭짓점 $\mathrm{P}_i$, $\mathrm{P}_j$를 잇는 선분의 길이 $\overline{\mathrm{P}_i\mathrm{P}_j}$를 구하시오. (단, $1\le i<j\le n$ 이다.)
  points: 3
  depends_on: []
  answer: {kind: expression, value: '2*sin(pi*(j-i)/n)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '중심각 $\frac{2\pi}{n}(j-i)$인 현의 길이.'
    steps:
    - {id: 1a, content: '$\overline{\mathrm{P}_i\mathrm{P}_j}=2\sin\dfrac{\pi(j-i)}{n}$', criteria: ['1.A1']}
    hint_ladder:
    - 반지름 1인 원에서 중심각 $\theta$인 현의 길이는?
  - id: S1-B
    audience: B
    source_flow: G21_pm.pdf p.22 예시 답안 (1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        정$n$각형의 인접한 두 꼭짓점 사이의 중심각은 $\dfrac{2\pi}{n}$ 이므로 $i$번째, $j$번째 꼭짓점 사이의 중심각은 $k=j-i$라 하면 $\dfrac{2\pi}{n}k$ ($1\le k\le\dfrac n2$인 경우) 또는 $2\pi-\dfrac{2\pi}{n}k$ ($\dfrac n2\le k\le n-1$인 경우) 이다.
      criteria: ['1.A1']
    - id: 1b-2
      content: |
        반지름 1인 원에서 중심각이 $0\le\theta\le\pi$인 현의 길이는 $2\sin\dfrac\theta2$이며 중심각이 $2\pi-\theta$인 현($\pi\le\theta\le2\pi$)의 길이 또한 $2\sin\dfrac{2\pi-\theta}{2}=2\sin\left(\pi-\dfrac\theta2\right)=2\sin\dfrac\theta2$ 이므로 $i$번째, $j$번째 꼭짓점 사이의 거리 $\overline{\mathrm{P}_i\mathrm{P}_j}$는 $2\sin\dfrac{\pi}{n}k$ 이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.A1
      mark_type: B
      points: 3
      evidence: |
        답 $2\sin\dfrac{\pi(j-i)}{n}$을 구하고 (그림 등을 이용하여) 설명함 (원 채점기준 3점)
      depends_on: []
      steps: [1b-1, 1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    정$n$각형의 첫번째 꼭짓점과 다른 꼭짓점을 잇는 선분들의 길이 $\overline{\mathrm{P}_1\mathrm{P}_2}$, $\overline{\mathrm{P}_1\mathrm{P}_3}$, $\dots$, $\overline{\mathrm{P}_1\mathrm{P}_n}$의 평균을 $L_n$이라 하자. $M_n=L_n$임을 설명하시오.
  points: 4
  depends_on: []
  answer: {kind: proof, value: 'M_n = L_n', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '대칭성으로 어느 꼭짓점에서나 평균이 $L_n$; $n$개를 더하면 각 선분이 두 번.'
    steps:
    - {id: 2a, content: '$nL_n=\tfrac{1}{n-1}\cdot2\cdot\tfrac{n(n-1)}{2}M_n=nM_n$', criteria: ['2.R1']}
    hint_ladder:
    - $\mathrm{P}_2$에서 다른 꼭짓점까지의 길이의 평균은?
  - id: S2-B
    audience: B
    source_flow: G21_pm.pdf p.22 예시 답안 (2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        꼭짓점 $\mathrm{P}_i$와 다른 꼭짓점을 이은 선분들의 길이의 평균은 각 $1\le i\le n$에 대해 모두 동일한 값 $L_n$이다. 즉,
        $L_n=\dfrac{1}{n-1}\left(\overline{\mathrm{P}_1\mathrm{P}_2}+\overline{\mathrm{P}_1\mathrm{P}_3}+\cdots+\overline{\mathrm{P}_1\mathrm{P}_n}\right)$ ($\mathrm{P}_1$과 다른 꼭짓점을 이은 선분의 길이의 평균)
        $L_n=\dfrac{1}{n-1}\left(\overline{\mathrm{P}_2\mathrm{P}_1}+\overline{\mathrm{P}_2\mathrm{P}_3}+\cdots+\overline{\mathrm{P}_2\mathrm{P}_n}\right)$ ($\mathrm{P}_2$와 다른 꼭짓점을 이은 선분의 길이의 평균)
        $\cdots$
        $L_n=\dfrac{1}{n-1}\left(\overline{\mathrm{P}_n\mathrm{P}_1}+\overline{\mathrm{P}_n\mathrm{P}_2}+\cdots+\overline{\mathrm{P}_n\mathrm{P}_{n-1}}\right)$ ($\mathrm{P}_n$과 다른 꼭짓점을 이은 선분의 길이의 평균)
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        임의의 두 꼭짓점을 잇는 선분은 위의 $n$개의 식의 우변에서 두 번씩 나타난다. 가령 꼭짓점 $\mathrm{P}_i$, $\mathrm{P}_j$를 잇는 선분은 $i$번째, $j$번째 식의 우변에 한 번씩 나타난다. 따라서 위의 $n$개의 식을 모두 더하면
        $n\times L_n=\dfrac{1}{n-1}\times2\times(\text{모든 선분의 길이의 합})=\dfrac{1}{n-1}\times2\times\dfrac{n(n-1)}{2}\times M_n=n\times M_n$
        을 얻고, 따라서 $L_n=M_n$ 이다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: |
        설명과 식의 전개가 논리적이고 정확함(각 꼭짓점의 평균이 모두 $L_n$, 합하면 각 선분이 두 번 나타남) (원 채점기준 4점)
      depends_on: []
      steps: [2b-1, 2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $\displaystyle\lim_{n\to\infty}M_n$의 값을 구하시오.
  points: 4
  depends_on: ['1', '2']
  answer: {kind: value, value: '4/pi', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$M_n=\frac{n}{n-1}\cdot\frac1n\sum_{k=1}^n2\sin\frac{\pi k}{n}$ → 정적분.'
    steps:
    - {id: 3a, content: '$\lim M_n=\int_0^12\sin\pi x\,dx=\tfrac4\pi$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $\sin\left(\pi\frac nn\right)=0$을 더해도 합은 그대로이다.
  - id: S3-B
    audience: B
    source_flow: G21_pm.pdf p.22 예시 답안 (3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1)과 (2)에 의해
        $M_n=L_n=\dfrac{1}{n-1}\left(\overline{\mathrm{P}_1\mathrm{P}_2}+\overline{\mathrm{P}_1\mathrm{P}_3}+\cdots+\overline{\mathrm{P}_1\mathrm{P}_n}\right)=\dfrac{1}{n-1}\displaystyle\sum_{k=1}^{n-1}2\sin\left(\frac\pi nk\right)=\frac{n}{n-1}\cdot\frac1n\sum_{k=1}^{n}2\sin\left(\pi\frac kn\right)$ $\left(\because\ \sin\left(\pi\dfrac nn\right)=0\right)$
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        이고, $n\to\infty$일 때 극한을 취하면 정적분과 급수 사이의 관계에 의해 극한값은
        $\displaystyle\lim_{n\to\infty}M_n=\lim_{n\to\infty}\frac{n}{n-1}\times\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}2\sin\left(\pi\frac kn\right)=1\times\int_0^12\sin\pi x\,dx=-\frac2\pi\cos\pi x\Big|_0^1=\frac4\pi$
        이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $M_n$을 삼각함수의 급수로 나타내고 급수의 극한을 정적분으로 나타냄
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        극한값 $\dfrac4\pi$을 구하였으며 식의 전개과정이 정확함 (원 채점기준은 통합 4점 — 2+2로 나눔)
      depends_on: [3.M1]
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    정$2n$각형의 꼭짓점들이 홀수번째 꼭짓점은 검은색으로, 짝수번째 꼭짓점은 흰색으로 칠해져 있다. 서로 같은 색 두 꼭짓점을 잇는 선분들의 개수와 서로 다른 색 두 꼭짓점을 잇는 선분들의 개수를 각각 구하시오.
  points: 3
  depends_on: []
  answer: {kind: expression, value: 'same=n*(n-1); different=n**2', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: '다른 색: $n\times n$, 같은 색: ${}_{2n}\mathrm{C}_2-n^2$.'
    steps:
    - {id: 4a, content: '같은 색 $n(n-1)$, 다른 색 $n^2$', criteria: ['4.B1', '4.B2']}
    hint_ladder:
    - 검은 꼭짓점과 흰 꼭짓점은 각각 몇 개인가?
  - id: S4-B
    audience: B
    source_flow: G21_pm.pdf p.23 예시 답안 (4)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
