intent: |
  정다각형의 두 꼭짓점을 잇는 선분들의 길이와 그 평균에 대한 문제이다. 삼각함수의 기본 성질, 정적분과 급수의 관계, 경우의 수, 평균의 정의, 수열의 극한 등을 이해하고 적절히 응용할 수 있는지 평가한다.
  (1) 삼각함수를 이용하여 간단한 평면도형에서 선분의 길이를 구할 수 있는지 평가한다.
  (2) 평균의 정의와 정다각형의 대칭성을 이해하는지 평가한다.
  (3) 정적분과 급수의 관계로부터 급수의 극한을 구할 수 있는지 평가한다.
  (4) 간단한 경우의 수를 구할 수 있는지 평가한다.
  (5) 모집단을 나누었을 때, 각 집단의 평균과 전체의 평균과의 관계를 이해하는지 평가한다. 수열의 극한의 기본 성질을 이해하는지 평가한다.
key_idea: |
  현의 길이 $\overline{\mathrm{P}_i\mathrm{P}_j}=2\sin\frac{\pi(j-i)}{n}$, 대칭성으로 $M_n=L_n$(이중세기), $M_n=\frac{n}{n-1}\cdot\frac1n\sum_{k=1}^{n}2\sin\frac{\pi k}{n}\to\int_0^12\sin\pi x\,dx=\frac4\pi$; 정$2n$각형의 같은 색 선분은 정$n$각형 두 개이므로 $F_n=M_n$이고 $M_{2n}$을 가중평균으로 분해해 $G_n$의 극한을 얻는다.
stuck: |
  (2)에서 $n$개의 $L_n$ 식을 모두 더하면 각 선분이 두 번씩 세어진다는 관찰, (5)에서 $M_{2n}$을 $F_n$, $G_n$의 가중평균으로 쓰는 것
