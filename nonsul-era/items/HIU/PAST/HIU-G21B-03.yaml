- id: '5'
  stem: |
    위 (4)의 정$2n$각형에서 서로 같은 색 두 꼭짓점을 잇는 선분들의 길이의 평균을 $F_n$이라 하고, 서로 다른 색 두 꼭짓점을 잇는 선분들의 길이의 평균을 $G_n$이라 하자. $\displaystyle\lim_{n\to\infty}F_n$, $\displaystyle\lim_{n\to\infty}G_n$의 값을 각각 구하시오.
  points: 6
  depends_on: ['3', '4']
  answer: {kind: value, value: 'lim F_n=4/pi; lim G_n=4/pi', equivalents: [], tolerance: null}
  solutions:
  - id: S5-A
    audience: A
    method_no: 1
    key_idea: '$F_n=M_n$, $M_{2n}=\frac{n-1}{2n-1}F_n+\frac{n}{2n-1}G_n$.'
    steps:
    - {id: 5a, content: '$\tfrac4\pi=\tfrac12\cdot\tfrac4\pi+\tfrac12\lim G_n\Rightarrow\lim G_n=\tfrac4\pi$', criteria: ['5.A1', '5.A2']}
    hint_ladder:
    - 검은 꼭짓점만 모으면 어떤 도형인가?
  - id: S5-B
    audience: B
    source_flow: G21_pm.pdf p.23 예시 답안 (5)
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        정$2n$각형에서 검은색 꼭짓점들은 정$n$각형의 꼭짓점들이다. 따라서 정$2n$각형에서 두 꼭짓점이 모두 검은색인 선분의 개수는 정$n$각형의 두 꼭짓점을 잇는 선분의 개수 $\dfrac{n(n-1)}{2}$ 이고, 그 길이의 평균은 $M_n$ 이다. 두 꼭짓점이 모두 흰색인 선분의 개수와 길이의 평균도 마찬가지이다. 따라서 같은 색 꼭짓점을 잇는 선분의 길이의 평균은 $F_n=\dfrac12M_n+\dfrac12M_n=M_n$ 이고 그 극한은 $\displaystyle\lim_{n\to\infty}F_n=\lim_{n\to\infty}M_n=\frac4\pi$ 이다.
      criteria: ['5.A1']
    - id: 5b-2
      content: |
        정$2n$각형의 두 꼭짓점들을 잇는 선분들의 길이의 평균 $M_{2n}$은 서로 같은색 꼭짓점을 잇는 선분들, 서로 다른색 두 꼭짓점을 잇는 선분들 각각의 개수와 길이의 평균으로부터
        $M_{2n}=\dfrac{n(n-1)}{2n(2n-1)/2}F_n+\dfrac{n^2}{2n(2n-1)/2}G_n=\dfrac{n-1}{2n-1}F_n+\dfrac{n}{2n-1}G_n$
        와 같이 쓸 수 있다. $n\to\infty$일 때 극한을 취하면 $\displaystyle\lim_{n\to\infty}M_{2n}=\lim_{n\to\infty}M_n=\frac4\pi$ 로부터 $\dfrac4\pi=\dfrac12\cdot\dfrac4\pi+\dfrac12\cdot\displaystyle\lim_{n\to\infty}G_n$, 즉, $\displaystyle\lim_{n\to\infty}G_n=\frac4\pi$ 이다.
      criteria: ['5.A2']
