stimuli: []

stem: |
  막대 1과 막대 2가 <그림 1>과 같이 B에서 연결되어 있다. 막대 1은 A를 중심으로 시곗바늘이 도는 방향으로 회전하고, 막대 1과 막대 2 사이의 각도는 자유롭게 변할 수 있다. 막대 1이 회전할 때 막대 2는 <그림 2>와 같이 항상 P 점을 지나면서 움직인다. 이때, 막대 1과 막대 2가 연결된 점의 속력은 항상 1이다. 막대 1이 <그림 3>과 같은 위치로 가면, 그다음에는 막대 2가 <그림 4>와 같은 모양이 될 때까지 B"을 중심으로 회전한다.

  [그림 1: 한 칸의 길이가 1인 점선 격자 위에 막대 1(B에서 오른쪽 A까지 수평, 길이 1)과 막대 2(B에서 아래쪽 C까지 수직, 길이 2)가 B에서 'ㄱ'자를 뒤집은 모양으로 연결되어 있다. 가로 폭 2, A 위로 1·아래로 2, C 아래쪽 폭 1이 괄호로 표시되어 있다.]
  [그림 2: 막대 1이 A를 중심으로 시계 방향으로 회전하여 끝이 B'에 있고, 처음 B의 위치를 P라 할 때 $\angle\mathrm{B'AP}=\theta$로 표시되어 있다. 막대 2는 B'에서 P를 지나 끝 C'까지 이어지고, C에서 C'까지 C의 자취가 점선으로 그려져 있다.]
  [그림 3: 막대 1이 A의 바로 위 B''에서 수직이 되었고(A에 직각 표시), 막대 2는 B''에서 P를 지나 C''까지 이어진다. B'의 자취와 C'→C''의 자취가 점선으로 그려져 있다.]
  [그림 4: 막대 1은 A–B''에 수직으로 고정되고, 막대 2가 B''을 중심으로 회전하여 B''의 왼쪽 C'''까지 수평이 된 모양. C→C'→C''→C'''의 자취가 점선으로 그려져 있다.]

subparts:
- id: '1'
  stem: |
    <그림 2>에서 $\theta=\dfrac{\pi}{3}$일 때 A와 C' 사이의 거리를 구하시오.
  points: 4
  depends_on: []
  answer: {kind: value, value: 'sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\theta=\dfrac{\pi}{3}$이면 $\triangle\mathrm{AB'P}$가 정삼각형이므로 $\triangle\mathrm{AB'C'}$은 $\angle\mathrm{B'}=\dfrac{\pi}{3}$, $\overline{\mathrm{AB'}}=1$, $\overline{\mathrm{B'C'}}=2$인 직각삼각형이다.
    steps:
    - {id: 1a, content: '$\overline{\mathrm{AC''}}=\sqrt{2^2-1^2}=\sqrt3$', criteria: [1.B1]}
    hint_ladder:
    - $\overline{\mathrm{AP}}$와 $\overline{\mathrm{AB'}}$의 길이를 비교해 보자.
    - 삼각형 $\mathrm{AB'C'}$에서 $\angle\mathrm{B'}$와 두 변의 길이를 알 수 있다.
  - id: S1-B
    audience: B
    source_flow: G22_am.pdf p.4
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{AB'}}=\overline{\mathrm{AP}}=1$이고 $\theta=\dfrac{\pi}{3}$이므로 $\triangle\mathrm{AB'P}$는 정삼각형이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        따라서 $\triangle\mathrm{AB'C'}$은 $\angle\mathrm{AB'C'}=\dfrac{\pi}{3}$, $\overline{\mathrm{AB'}}=1$, $\overline{\mathrm{B'C'}}=2$인 삼각형으로, $\overline{\mathrm{AB'}}=\overline{\mathrm{B'C'}}\cos\dfrac{\pi}{3}$이므로 $\angle\mathrm{B'AC'}=\dfrac{\pi}{2}$인 직각삼각형이 된다. 따라서 A와 C' 사이의 거리는 $\sqrt{2^2-1^2}=\sqrt3$이다.
      criteria: [1.B1]
  - id: S1-ALT
    audience: ALT
    source_flow: G22_am.pdf p.4 별해
    method_no: 2
    key_idea: 원 해설 별해 — P를 시점으로 하는 벡터로 계산한다.
    steps:
    - id: 1c-1
      content: |
        $\triangle\mathrm{AB'P}$는 한 변의 길이가 1인 정삼각형이므로 $\overrightarrow{\mathrm{PB'}}=\left(\dfrac12,\dfrac{\sqrt3}{2}\right)$, $\overrightarrow{\mathrm{PC'}}=\left(-\dfrac12,-\dfrac{\sqrt3}{2}\right)$이다. $\overrightarrow{\mathrm{PA}}=(1,0)$이므로 A와 C' 사이의 거리는 $\sqrt{\left(\dfrac32\right)^2+\left(\dfrac{\sqrt3}{2}\right)^2}=\sqrt3$이다.
      criteria: [1.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: |
        A와 C' 사이의 거리 $\sqrt3$을 근거(정삼각형 $\mathrm{AB'P}$와 직각삼각형 $\mathrm{AB'C'}$, 또는 벡터 계산)와 함께 구했다. (문항카드: 거리를 구함 4점)
      depends_on: []
      steps: [1b-1, 1b-2, 1c-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    <그림 2>에서 $\theta=\dfrac{\pi}{3}$일 때 C'을 지나는 막대 2의 끝의 속력을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: A를 원점, 직선 PA를 $x$축으로 두면 $\mathrm{C'}=\left(-\cos t-2\sin\dfrac t2,\ \sin t-2\cos\dfrac t2\right)$이고 속력은 $\sqrt{2-2\sin\dfrac t2}$이다.
    steps:
    - {id: 2a, content: '$\sqrt{2-2\sin\tfrac{\pi}{6}}=1$', criteria: [2.B1, 2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - 연결점 B'의 좌표를 $\theta$로 나타내 보자. 속력이 1인 원운동이면 $\theta$와 시간 $t$는 어떤 관계인가?
    - 이등변삼각형 $\mathrm{AB'P}$의 밑각으로 막대 2의 방향을 구하자.
  - id: S2-B
    audience: B
    source_flow: G22_am.pdf p.4-5
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        A를 원점, 직선 PA를 $x$축으로 하는 좌표에서 $\overrightarrow{\mathrm{AB'}}=(-\cos\theta,\sin\theta)$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        두 막대가 연결된 점 B'은 점 A를 중심으로 반지름 1인 원운동을 하는데 속력이 1이므로 $\theta=t$이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        $\triangle\mathrm{AB'P}$는 이등변삼각형이므로 $\phi=\angle\mathrm{AB'P}=\dfrac12(\pi-\theta)$이다. 따라서 점 B'을 지나고 선분 PA와 수직인 직선과 선분 B'C' 사이의 각도는 $\phi-\left(\dfrac{\pi}{2}-\theta\right)=\dfrac{\theta}{2}$이고 선분 B'C'의 길이는 2이므로 $\overrightarrow{\mathrm{B'C'}}=\left(-2\sin\dfrac{\theta}{2},-2\cos\dfrac{\theta}{2}\right)$이다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        막대 2의 끝 C'의 좌표를 $(x,y)$라 하면 $\overrightarrow{\mathrm{AC'}}=\overrightarrow{\mathrm{AB'}}+\overrightarrow{\mathrm{B'C'}}=\left(-\cos\theta-2\sin\dfrac{\theta}{2},\ \sin\theta-2\cos\dfrac{\theta}{2}\right)$이므로
        $x=-\cos t-2\sin\dfrac t2$, $y=\sin t-2\cos\dfrac t2$이다.
      criteria: [2.M2]
    - id: 2b-5
      content: |
        $\dfrac{dx}{dt}=\sin t-\cos\dfrac t2$, $\dfrac{dy}{dt}=\cos t+\sin\dfrac t2$이므로 속력은
        $$\sqrt{\left(\sin t-\cos\frac t2\right)^2+\left(\cos t+\sin\frac t2\right)^2}=\sqrt{2-2\left(\sin t\cos\frac t2-\cos t\sin\frac t2\right)}=\sqrt{2-2\sin\frac t2}$$
        이다. $\theta=\dfrac{\pi}{3}$ (즉, $t=\dfrac{\pi}{3}$)일 때 속력은 $\sqrt{2-2\sin\dfrac{\pi}{6}}=1$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        막대 1과 막대 2가 연결된 점의 좌표 $(-\cos\theta,\sin\theta)$를 구했다.
      depends_on: []
      steps: [2b-1, 2a]
    - id: 2.M1
      mark_type: M
      points: 1
      evidence: |
        연결점의 속력이 1이므로 $\theta=t$로 치환했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2a]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: |
        벡터의 합 $\overrightarrow{\mathrm{AB'}}+\overrightarrow{\mathrm{B'C'}}$를 이용하여 막대 2 끝의 좌표 $\left(-\cos t-2\sin\dfrac t2,\ \sin t-2\cos\dfrac t2\right)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3, 2b-4, 2a]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        위치의 좌표를 미분하여 속도와 속력 $\sqrt{2-2\sin\dfrac t2}$를 구하고 $\theta=\dfrac{\pi}{3}$에서 속력 1을 얻었다.
      depends_on: [2.M2]
      steps: [2b-5, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    <그림 2>에서 $\theta=\dfrac{\pi}{3}$일 때 C'을 지나는 막대 2의 끝의 가속도 크기를 구하시오.
  points: 4
  depends_on: ['2']
  answer: {kind: value, value: 'sqrt(3)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: (2)의 속도를 한 번 더 미분하면 가속도의 크기는 $\sqrt{\dfrac54-\sin\dfrac t2}$이다.
    steps:
    - {id: 3a, content: '$\sqrt{\tfrac54-\sin\tfrac{\pi}{6}}=\tfrac{\sqrt3}{2}$', criteria: [3.B1]}
    hint_ladder:
    - (2)에서 구한 $\dfrac{dx}{dt}$, $\dfrac{dy}{dt}$를 다시 미분하자.
  - id: S3-B
    audience: B
    source_flow: G22_am.pdf p.5
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2)의 결과로부터 막대 2의 끝 C'의 가속도는 $\left(\dfrac{d^2x}{dt^2},\dfrac{d^2y}{dt^2}\right)=\left(\cos t+\dfrac12\sin\dfrac t2,\ -\sin t+\dfrac12\cos\dfrac t2\right)$이다.
      criteria: [3.B1]
    - id: 3b-2
      content: |
        가속도의 크기는
        $$\sqrt{\left(\cos t+\frac12\sin\frac t2\right)^2+\left(\sin t-\frac12\cos\frac t2\right)^2}=\sqrt{1+\frac14-\left(\sin t\cos\frac t2-\cos t\sin\frac t2\right)}=\sqrt{\frac54-\sin\frac t2}$$
        이고, $t=\dfrac{\pi}{3}$일 때 $\sqrt{\dfrac54-\sin\dfrac{\pi}{6}}=\dfrac{\sqrt3}{2}$이다.
      criteria: [3.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 4
      evidence: |
        위치의 좌표를 두 번 미분하여 가속도 $\left(\cos t+\dfrac12\sin\dfrac t2,\ -\sin t+\dfrac12\cos\dfrac t2\right)$와 그 크기 $\dfrac{\sqrt3}{2}$를 구했다.
      depends_on: []
      ft: {allowed: true, from: [2.M2], max_points: 4}
      steps: [3b-1, 3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

