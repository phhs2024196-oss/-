stimuli: []

stem: |
  송신기 A와 수신기 B로 이루어져 있는 무선 네트워크를 가정하자. 송신기 A와 수신기 B의 거리는 $r$ km 이다 ($r>0$). 이 무선 네트워크에서 송신기 A는 수신기 B에게 0 또는 1을 보낸다. B는 A로부터 받은 신호 $X$를 이용하여 A가 0을 보냈는지 또는 1을 보냈는지를 결정하는데, B가 받은 신호 $X$는 다음과 같은 확률분포를 따른다.

  a) 0을 전송한 경우: $X$는 정규분포 $N(0,\,0.5^2)$을 따른다.
  b) 1을 전송한 경우: $X$는 정규분포 $N(r^{-2},\,0.5^2)$을 따른다.

  그리고, 수신기 B는 $X$를 이용하여, 송신기 A가 어떤 것을 보냈는지를 결정한다. 만약 $X>0.5r^{-2}$이라면 수신기 B는 송신기 A가 1을 보냈다고 결정하고, 그 외의 경우에는 송신기 A가 0을 보냈다고 결정한다. 송신기 A가 0을 보낼 확률과 1을 보낼 확률이 모두 0.5이다.

subparts:
- id: '1'
  stem: |
    송신기 A가 0을 보낼 확률, 1을 보낼 확률을 각각 $P(0\text{보냄})$, $P(1\text{보냄})$이라 하자. 수신기 B에서 오류가 일어날 확률은 조건부 확률을 이용하여 다음과 같이 나타낼 수 있다:
    $$P(\text{오류})=P(0\text{결정}\mid 1\text{보냄})\times P(1\text{보냄})+P(1\text{결정}\mid 0\text{보냄})\times P(0\text{보냄})$$
    송신기 A와 수신기 B 사이의 거리 $r=1$ km 일 때 수신기 B에서 오류가 일어날 확률을 아래의 표준정규분포표 <표 1>을 이용하여 계산하시오.

    <표 1> $z$ : $P(0\le Z\le z)$
    0.25 : 0.10, 0.50 : 0.19, 0.75 : 0.27, 1.00 : 0.34, 1.25 : 0.39, 1.50 : 0.43, 1.75 : 0.46, 2.00 : 0.48
  points: 6
  depends_on: []
  answer: {kind: value, value: '0.16', equivalents: ['4/25'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 조건부확률 모두 표준화하면 $P(Z>r^{-2})$가 되어 $P(\text{오류})=P(Z>r^{-2})$, $r=1$이면 $0.5-0.34=0.16$.
    steps:
    - {id: 1a, content: '$P(\text{오류})=P(Z>1)=0.16$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 각 조건부확률을 $X$에 대한 부등식의 확률로 써 보자.
    - $Z=\dfrac{X-\mu}{0.5}$로 표준화하자.
  - id: S1-B
    audience: B
    source_flow: G22_am.pdf p.9
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        정규분포 $N(\mu,\sigma^2)$를 따르는 확률변수 $X$에 대해 확률변수 $Z=\dfrac{X-\mu}{\sigma}$는 표준정규분포 $N(0,1)$을 따른다.
        송신기 A가 1을 보냈을 때, 수신기 B가 받은 신호 $X$는 정규분포 $N(r^{-2},0.5^2)$을 따르므로 $P(0\text{결정}\mid 1\text{보냄})=P(X\le 0.5r^{-2})$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $P(X\le0.5r^{-2})=P(0.5Z+r^{-2}\le0.5r^{-2})=P(Z\le-r^{-2})=P(Z>r^{-2})$이다. 마찬가지로 A가 0을 보냈을 때 $X$는 $N(0,0.5^2)$을 따르므로 $P(1\text{결정}\mid 0\text{보냄})=P(X>0.5r^{-2})=P(0.5Z>0.5r^{-2})=P(Z>r^{-2})$이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        송신기 A가 0과 1을 보내는 확률이 각각 0.5이므로 $P(\text{오류})=P(Z>r^{-2})\times0.5+P(Z>r^{-2})\times0.5=P(Z>r^{-2})$이다. $r=1$일 때, 이 확률은 표준정규분포표로부터 $P(Z>1)=0.5-P(0\le Z\le1)=0.16$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        오류가 일어날 (조건부) 확률을 정규분포 확률변수 $X$로 나타냈다($P(X\le0.5r^{-2})$, $P(X>0.5r^{-2})$).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        이 확률을 표준정규분포 확률변수 $Z$로 변환하여 $P(Z>r^{-2})$로 나타냈다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2, 1a]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        표준정규분포표를 이용하여 확률값 $0.16$을 계산했다.
      depends_on: [1.M2]
      steps: [1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    수신기 B에서 오류가 일어날 확률을 거리 $r=1$ km와 거리 $r=2$ km인 두 경우에 대하여 각각 계산하시오. 그리고, $r=1$ km인 경우 오류가 일어날 확률의 제곱과 $r=2$ km인 경우 오류가 일어날 확률 각각을 소수점 셋째 자리에서 반올림하여 소수점 둘째 자리까지 구하고, 그 둘의 크기를 비교하시오.
  points: 4
  depends_on: ['1']
  answer: {kind: value, value: 'P1=0.16; P2=0.40; P1sq=0.03; compare=P2>P1sq', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $r=2$이면 $r^{-2}=0.25$이므로 $P(Z>0.25)=0.40$이고, $0.16^2=0.0256\approx0.03$보다 크다.
    steps:
    - {id: 2a, content: '$0.40>0.03$', criteria: [2.A1, 2.A2]}
    hint_ladder:
    - (1)의 일반식 $P(Z>r^{-2})$에 $r=2$를 넣자.
  - id: S2-B
    audience: B
    source_flow: G22_am.pdf p.9-10
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1)에서 구한 식으로부터 $r=1$ km일 때 오류 확률은 $0.16$이고, $r=2$ km일 때 오류가 일어날 확률은 $P(Z>0.25)=0.5-0.10=0.4$가 된다.
      criteria: [2.A1]
    - id: 2b-2
      content: |
        $r=1$ km일 때 확률의 제곱의 값은 $0.16^2=0.0256$이고, 소수점 셋째 자리에서 반올림하면 $0.03$이다. 둘을 비교하면 $r=2$일 때 오류를 일으킬 확률이 더 크다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $r=2$일 때 확률 $P(Z>0.25)=0.40$을 계산했다.
      depends_on: [1.M2]
      ft: {allowed: true, from: [1.M2, 1.A1], max_points: 3}
      steps: [2b-1, 2a]
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: |
        $r=1$일 때 확률의 제곱($0.0256\approx0.03$)을 구하고 $r=2$일 때의 확률이 더 크다고 비교했다.
      depends_on: [1.M2]
      ft: {allowed: true, from: [1.A1], max_points: 1}
      steps: [2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    직선 위의 A-B-C로 이루어진 릴레이 통신을 생각해 보자. A는 B에 0 또는 1을 보내고 B는 A로부터 받은 신호 $X$를 이용하여 A가 무엇을 보냈는지를 결정한다. 그리고, 릴레이 B는 결정된 신호 (0 또는 1) 를 C에게 보낸다. 이때, C가 B로부터 받은 신호의 확률분포는 제시문에서 언급된 수신기 B가 송신기 A로부터 받은 신호의 확률분포와 동일하다. A와 B 사이의 거리는 1 km이고 B와 C 사이의 거리 또한 1 km라고 하자. 이때, A로부터 2 km 떨어진 수신기 C에서 오류가 일어날 확률을 표준정규분포표 <표 1>을 이용하여 소수점 둘째 자리까지 구하시오. 이를 (2)에서 구한 거리가 $r=2$ km일 때 수신기 B에서 오류가 일어날 확률과 비교하시오.
  points: 10
  depends_on: ['1', '2']
  answer: {kind: value, value: 'PC=0.27; compare=PC<0.40', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 두 구간 중 정확히 한 곳에서만 오류가 나야 하므로 $2\times0.16\times0.84\approx0.27<0.4$.
    steps:
    - {id: 3a, content: '$p(1-q)+(1-p)q=2(0.16)(0.84)=0.2688\approx0.27$', criteria: [3.M1, 3.A1, 3.A2]}
    hint_ladder:
    - 두 구간에서 모두 오류가 나면 C는 무엇을 결정하는가?
  - id: S3-B
    audience: B
    source_flow: G22_am.pdf p.10
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        송신기-수신기 A-B와 B-C 각각에서 오류가 일어날 수 있다. 따라서 C에서 오류가 일어나는 경우는(즉, C에서 A가 보낸 신호와 반대로 결정하는 경우는) A-B에서 오류가 발생하고 B-C에서 무오류인 경우와, A-B에서 무오류이고 B-C에서 오류가 발생하는 경우이다.
        A-B와 B-C에서 오류가 일어나는 두 사건은 서로 독립사건이며, 여사건의 확률에 의해 (무오류일 확률) $=1-$(오류일 확률)이므로 A-B에서 오류가 일어날 확률을 $p$, B-C에서 오류가 일어날 확률을 $q$라 하면 (수신기 C에서 오류가 일어날 확률) $=p(1-q)+(1-p)q$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        송신기로부터 거리가 $r$인 수신기에서 오류가 일어날 확률을 (1)에서와 같이 구하면
        $P(\text{오류})=P(Z>r^{-2})\times\{P(1\text{보냄})+P(0\text{보냄})\}=P(Z>r^{-2})$이다. 따라서 A-B에서 오류가 일어날 확률 $p$와 B-C에서 오류가 일어날 확률 $q$는 모두 $P(Z>1)=0.16$이다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        위에서 구한 식에 의해 (수신기 C에서 오류가 일어날 확률) $=p(1-q)+(1-p)q=2\times0.16\times0.84=0.27$이다. 이 확률은 (2)에서 구한 송신기-수신기의 거리가 2 km일 때 수신기에서 오류가 일어날 확률 $0.4$보다 작다. 즉, A-C 사이에 B가 있어서 신호를 중계할 때 오류가 발생할 확률이 더 작게 된다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        C에서 오류가 일어나는 경우(한 구간에서만 오류)를 설명하고, 이를 이용하여 C에서 오류가 일어날 확률을 $p(1-q)+(1-p)q$로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3a]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        A-B와 B-C에서 오류가 일어날 확률을 각각 $0.16$으로 구했다.
      depends_on: [3.M1]
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [3b-2, 3a]
    - id: 3.A2
      mark_type: A
