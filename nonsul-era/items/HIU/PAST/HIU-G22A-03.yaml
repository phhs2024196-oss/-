intent: |
  삼각형의 내각과 외각, 원과 접선 등 삼각형과 원의 성질을 이해하고 삼각함수를 이용하여 도형의 길이를 구할 수 있는지 평가한다.
  (1) 주어진 각도와 길이로부터 삼각함수를 이용하여 원의 반지름을 구할 수 있는지 평가한다.
  (2) (1)에서 구한 식을 이용하여 두 각도 사이의 관계를 구할 수 있는지 평가한다.
  (3) 문제에서 요구하는 길이가 두 원의 반지름의 차이임을 이해하고 (1), (2)의 결과를 이용하여 구할 수 있는지 평가한다.
key_idea: |
  각 바퀴의 진행 방향은 회전 반지름과 수직이므로 앞·뒷바퀴 진행 방향의 수선의 교점 O가 공통 중심이고, 직각삼각형 AOB에서 $l=R_A\sin\theta=R_B\tan\theta$이다.
stuck: |
  바퀴가 그리는 원의 중심이 진행 방향(접선)에 수직인 두 직선의 교점이라는 것, 그리고 도로 최소 폭이 가장 큰 회전 반지름과 가장 작은 회전 반지름의 차라는 것
