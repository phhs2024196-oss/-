stimuli:
- label: 가
  body: |
    자전거를 <그림 1>과같이 각 바퀴의 중심이 양 끝점에 있는 길이가 $l$인 선분으로 볼 수 있다. 앞바퀴의 진행 방향은 선분과 일정한 각도 $\theta$를 유지하고, 뒷바퀴의 진행 방향은 항상 선분과 같은 방향이다. 각각의 바퀴는 미끄러지지 않고 진행한다 ($\theta>0$).
    ※ 앞바퀴와 뒷바퀴가 지나간 자취는 서로 다른 원 위에 있음이 알려져 있다.
- label: 나
  body: |
    자동차의 움직임을 <그림 2>와 같이 각 바퀴의 중심이 네 꼭짓점에 있는, 가로의 길이가 $w$이고, 세로의 길이가 $l$인 직사각형의 움직임으로 볼 수 있다. 두 앞바퀴의 진행 방향은 세로 방향과 일정한 각도 $\theta_1$, $\theta_2$를 각각 유지하고, 뒷바퀴의 진행 방향은 세로 방향과 항상 같은 방향이다 ($\theta_1>0$, $\theta_2>0$). 각각의 바퀴는 미끄러지지 않고 진행한다.
- label: 다
  body: |
    각 바퀴의 회전 반지름은 '바퀴의 중심에서 해당 바퀴가 그리는 원의 중심까지 거리'로 정의하고, 모든 바퀴의 두께와 크기는 무시한다.

stem: |
  [그림 1: 세로로 놓인 길이 $l$인 선분의 위 끝에 앞바퀴, 아래 끝에 뒷바퀴가 있다. 앞바퀴는 선분 방향(위쪽)에서 왼쪽으로 각 $\theta$만큼 기울어진 방향으로 놓여 있다.]
  [그림 2: 가로 $w$, 세로 $l$인 직사각형의 위쪽 두 꼭짓점에 앞바퀴, 아래쪽 두 꼭짓점에 뒷바퀴가 있다. 왼쪽 앞바퀴는 세로 방향에서 왼쪽으로 $\theta_1$, 오른쪽 앞바퀴는 세로 방향에서 왼쪽으로 $\theta_2$만큼 기울어져 있고, 그림에서 $\theta_1>\theta_2$로 그려져 있다.]

subparts:
- id: '1'
  stem: |
    <그림 1>에서 앞바퀴 회전 반지름과 뒷바퀴 회전 반지름을 각각 $\theta$와 $l$로 나타내시오.
  points: 4
  depends_on: []
  answer: {kind: expression, value: 'R_front = l/sin(theta); R_rear = l/tan(theta)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 진행 방향의 수선의 교점 O에서 직각삼각형 AOB의 $\angle\mathrm{AOB}=\theta$, 높이 $l$.
    steps:
    - {id: 1a, content: '$R_A=\dfrac{l}{\sin\theta}$, $R_B=\dfrac{l}{\tan\theta}$', criteria: [1.B1, 1.B2]}
    hint_ladder:
    - 미끄러지지 않는 바퀴의 진행 방향과 회전 반지름은 어떤 관계인가?
  - id: S1-B
    audience: B
    source_flow: G22_am.pdf p.14
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        각 바퀴의 진행 방향은 회전 반지름과 수직이다. 따라서 앞바퀴의 진행 방향에 수직인 직선과 뒷바퀴의 진행 방향에 수직인 직선의 교점 O는 앞바퀴, 뒷바퀴가 각각 그리는 두 원의 공통의 중심이다. 앞바퀴의 회전 반지름(빗변)은 $\overline{\mathrm{OA}}=R_A$, 뒷바퀴의 회전 반지름(밑변)은 $\overline{\mathrm{OB}}=R_B$이다.
      criteria: [1.B1, 1.B2]
    - id: 1b-2
      content: |
        직각삼각형 AOB의 높이는 두 바퀴 사이의 거리 $l$이고 $\angle\mathrm{AOB}$는 앞바퀴의 진행 방향 각도 $\theta$와 같으므로 $l=R_A\sin\theta=R_B\tan\theta$이다. 즉, $R_A=\dfrac{l}{\sin\theta}$, $R_B=\dfrac{l}{\tan\theta}$이다.
      criteria: [1.B1, 1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        앞바퀴의 회전 반지름 $\dfrac{l}{\sin\theta}$를 구했다.
      depends_on: []
      steps: [1b-1, 1b-2, 1a]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: |
        뒷바퀴의 회전 반지름 $\dfrac{l}{\tan\theta}$를 구했다.
      depends_on: []
      steps: [1b-1, 1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    <그림 2>에서 각도 $\theta_1$과 각도 $\theta_2$의 관계식을 $l$과 $w$를 사용하여 구하시오.
  points: 8
  depends_on: ['1']
  answer: {kind: expression, value: '1/tan(theta2) = 1/tan(theta1) + w/l', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 두 뒷바퀴의 회전 반지름은 $\dfrac{l}{\tan\theta_1}$, $\dfrac{l}{\tan\theta_2}$이고 그 차가 $w$이다.
    steps:
    - {id: 2a, content: '$\dfrac{1}{\tan\theta_2}=\dfrac{1}{\tan\theta_1}+\dfrac{w}{l}$', criteria: [2.B1, 2.B2, 2.M1]}
    hint_ladder:
    - 네 바퀴의 원은 중심이 같다. 뒷바퀴 두 개의 회전 반지름 차는?
  - id: S2-B
    audience: B
    source_flow: G22_am.pdf p.14
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        O를 중심으로 회전하는 자동차의 안쪽 앞바퀴 A, 안쪽 뒷바퀴 B, 바깥쪽 앞바퀴 C, 바깥쪽 뒷바퀴 D의 회전 반지름을 각각 $R_A$, $R_B$, $R_C$, $R_D$라 하자. $\theta_1=\angle\mathrm{AOB}$, $\theta_2=\angle\mathrm{COD}$라 하면, (1)에서와 같이 $R_A=\dfrac{l}{\sin\theta_1}$, $R_B=\dfrac{l}{\tan\theta_1}$, $R_C=\dfrac{l}{\sin\theta_2}$, $R_D=\dfrac{l}{\tan\theta_2}$이다.
      criteria: [2.B1, 2.B2]
    - id: 2b-2
      content: |
        $R_D=R_B+w$이므로 $R_B=\dfrac{l}{\tan\theta_1}$, $R_D=\dfrac{l}{\tan\theta_2}$를 대입하여 정리하면 $\dfrac{1}{\tan\theta_2}=\dfrac{1}{\tan\theta_1}+\dfrac{w}{l}$을 얻는다.
      criteria: [2.M1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        안쪽 뒷바퀴의 회전 반지름 $\dfrac{l}{\tan\theta_1}$을 구했다.
      depends_on: []
      ft: {allowed: true, from: [1.B2], max_points: 2}
      steps: [2b-1, 2a]
    - id: 2.B2
      mark_type: B
      points: 2
      evidence: |
        바깥쪽 뒷바퀴의 회전 반지름 $\dfrac{l}{\tan\theta_2}$를 구했다.
      depends_on: []
      ft: {allowed: true, from: [1.B2], max_points: 2}
      steps: [2b-1, 2a]
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        두 회전 반지름과 자동차의 너비 사이의 관계 $R_D=R_B+w$를 이용하여 $\dfrac{1}{\tan\theta_2}=\dfrac{1}{\tan\theta_1}+\dfrac{w}{l}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    (2)번과 같은 조건으로 자동차가 움직일 때, 바퀴가 도로에서 벗어나지 않고 지나갈 수 있는 도로의 최소 폭 $s$를 $l$, $w$, $\theta_2$만을 사용하여 구하시오.
  points: 8
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'l*(1 - cos(theta2))/sin(theta2) + w', equivalents: ['l/sin(theta2) - l/tan(theta2) + w'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $s=R_C-R_B$이고 (2)로 $R_B=\dfrac{l}{\tan\theta_2}-w$.
    steps:
    - {id: 3a, content: '$s=\dfrac{l(1-\cos\theta_2)}{\sin\theta_2}+w$', criteria: [3.B1, 3.B2, 3.M1]}
    hint_ladder:
    - 네 바퀴 중 회전 반지름이 가장 작은 것과 가장 큰 것은 어느 바퀴인가?
  - id: S3-B
    audience: B
    source_flow: G22_am.pdf p.15
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        문제에서 묻는 길의 최소 폭 $s$는 가장 작은 회전 반지름을 가지는 안쪽 뒷바퀴 B와 가장 큰 회전 반지름을 가지는 바깥쪽 앞바퀴 C의 회전 반지름의 차이이다.
      criteria: [3.B1, 3.B2]
    - id: 3b-2
      content: |
        즉, $s=R_C-R_B$이다. (1), (2)에서 구한 $R_B=\dfrac{l}{\tan\theta_1}$, $R_C=\dfrac{l}{\sin\theta_2}$, $\dfrac{1}{\tan\theta_2}=\dfrac{1}{\tan\theta_1}+\dfrac{w}{l}$를 대입하여 정리하면
        $$s=R_C-R_B=\frac{l}{\sin\theta_2}-\frac{l}{\tan\theta_1}=\frac{l}{\sin\theta_2}-\frac{l}{\tan\theta_2}+w=\frac{l(1-\cos\theta_2)}{\sin\theta_2}+w$$
        를 얻는다.
      criteria: [3.M1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        네 바퀴의 회전 반지름 중 최솟값이 안쪽 뒷바퀴의 $R_B$임을 구했다.
      depends_on: []
      steps: [3b-1, 3a]
    - id: 3.B2
      mark_type: B
      points: 2
      evidence: |
        네 바퀴의 회전 반지름 중 최댓값이 바깥쪽 앞바퀴의 $R_C=\dfrac{l}{\sin\theta_2}$임을 구했다.
      depends_on: []
      steps: [3b-1, 3a]
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        두 반지름의 차이가 도로의 최소 폭임을 설명하고 $l$, $w$, $\theta_2$를 이용하여 $s=\dfrac{l(1-\cos\theta_2)}{\sin\theta_2}+w$를 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.M1], max_points: 4}
      steps: [3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

