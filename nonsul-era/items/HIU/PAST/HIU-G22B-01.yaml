intent: |
  사회적으로 이슈가 되고 있는 다양한 환경 문제들 가운데, 일반적으로 경험할 수 있는 것을 출제 문제의 배경으로 삼고자 하였다. 창문이 열려 있을 때와 닫혀 있을 때 실내공기 중 유해물질의 농도가 각각 지수함수로 주어졌다. 지수함수와 로그함수의 성질을 이해하고 적절히 활용하여 문제를 해결할 수 있는지 평가한다. 로그의 성질을 이해하고 계산에 활용할 수 있는지 평가한다.
  (1) 지수함수와 로그함수의 성질을 이해하고 활용하여 간단한 방정식을 풀 수 있는지 평가한다.
  (2) 지수함수를 이용하여 문제의 조건에 맞는 적절한 부등식을 찾고 로그함수를 활용하여 이를 풀 수 있는지 평가한다.
  (3) 등비수열, 지수함수를 이용하여 문제의 조건에 맞는 적절한 부등식을 찾고 로그함수를 활용하여 이를 풀 수 있는지 평가한다.
key_idea: |
  $\log2=0.3$으로 $\log0.4=-0.4$, $\log0.2=-0.7$, $\log1.25=0.1$을 얻어 농도 부등식을 일차부등식으로 바꾸고, 주기 반복에서는 8시간마다 농도가 공비 $0.4^2\times1.25^6$인 등비수열을 이룬다는 점을 쓴다.
stuck: |
  (2)에서 위반 시간의 총합을 최소화하려면 첫 24시간이 끝날 때 농도가 기준 이하여야 한다는 조건 해석, (3)에서 기준을 처음 만족하는 시점이 24시간과 32시간 사이의 환기 구간 안에 있음을 찾는 것
