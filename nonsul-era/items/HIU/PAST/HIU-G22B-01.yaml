stimuli:
- label: 가
  body: |
    창문을 열어 환기하는 경우, [그림 1]과 같이 창문을 열기 직전 벤젠 농도가 $a$ $\mu$g/m$^3$이면, 환기 시작 후 $t$시간이 경과했을 때, 벤젠 농도 $C=a\times0.4^t$ $\mu$g/m$^3$ 이다.
- label: 나
  body: |
    창문을 닫아 놓는 경우, [그림 2]와 같이 창문을 닫기 직전 벤젠 농도가 $b$ $\mu$g/m$^3$ 이면, 창문을 닫은 후 $s$시간이 경과했을 때, 벤젠 농도 $C=b\times1.25^s$ $\mu$g/m$^3$ 이다.

    [그림 1: 가로축 '창문을 연 후 경과 시간 (t)', 세로축 '벤젠 농도 (C)'. $a$에서 시작해 감소하는 곡선 $C=a\times0.4^t$.]
    [그림 2: 가로축 '창문을 닫은 후 경과 시간 (s)', 세로축 '벤젠 농도 (C)'. $b$에서 시작해 증가하는 곡선 $C=b\times1.25^s$.]
- label: 다
  body: |
    신축 아파트 A의 벤젠 농도를 대략적으로 알아보기 위해 $\log2$는 $0.3$으로 계산한다. 예를 들어, $\log5=\log10-\log2=1-\log2$이므로, $\log5$는 $1-0.3=0.7$로 계산한다.

stem: |
  아파트 신축 과정에서 사용한 건축 재료에는 휘발성 성분인 벤젠을 비롯한 각종 유기화합물들이 포함되어 있다. 신축 아파트 입주민들이 이를 지속적으로 흡입하게 되면 두통이 발생하는 등 새집 증후군이라고 알려진 증상이 나타나기도 한다. 벤젠($\mathrm{C_6H_6}$)은 국제 암연구소에서 제시한 물질별 위해성 등급에 따르면 1급 발암물질로 알려져 있다. 이에 정부에서는 신축 아파트의 실내공기질 권고기준을 마련하였으며, 이 중 벤젠 농도는 $30$ $\mu$g/m$^3$ 이하로 설정되어 있다.

  신축 아파트 A의 완공 직후 실내공기질 검사 결과, 벤젠 농도가 $150$ $\mu$g/m$^3$ 으로 측정되었으며, 벤젠 농도는 다음의 조건 (가), (나)에 따라 변동한다.

subparts:
- id: '1'
  stem: |
    완공 직후부터 창문을 열어 환기하기 시작하면 몇 시간 후 벤젠 농도가 실내공기질 권고기준을 만족하게 되는지 구하시오.
  points: 4
  depends_on: []
  answer: {kind: value, value: '7/4', equivalents: ['1.75'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $150\times0.4^t\le30\iff t\log0.4\le\log0.2\iff -0.4t\le-0.7$.
    steps:
    - {id: 1a, content: '$t\ge\dfrac74$ (1시간 45분)', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 농도가 30 이하가 되는 조건을 부등식으로 쓰고 양변에 로그를 취하자.
  - id: S1-B
    audience: B
    source_flow: G22_pm.pdf p.4
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        창문을 열어두었을 때 $t$시간 후 벤젠 농도($C$)가 기준치 이하(30 $\mu$g/m$^3$ 이하)로 내려갔다면 $C=150(0.4)^t\le30$이다. 즉 $(0.4)^t\le0.2$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        로그함수를 이용하여 이 부등식을 풀면 $t\times\log0.4\le\log0.2$, $t\times(\log4-\log10)\le\log2-\log10$, $t\times(2\log2-\log10)\le\log2-\log10$이다. $\log2=0.3$으로 주어졌으므로 $t\times(2\times0.3-1)\le0.3-1$, 즉 $t\times(-0.4)\le-0.7$ ($\log0.4=-0.4$, $\log0.2=-0.7$)이다.
        따라서 $t\ge1.75$ 또는 $\dfrac74$이다. 즉, 1.75시간($=\dfrac74$시간 $=$ 1시간 45분) 후 권고기준을 만족하게 된다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        적절한 부등식 $150(0.4)^t\le30$을 제시했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        농도가 권고기준을 만족하게 되는 시간 $\dfrac74$시간을 올바르게 계산하여 구했다.
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    매일 일정한 $t$시간 동안 창문을 열어 환기한 후, 나머지 $24-t$시간 동안은 창문을 닫아 놓으려 한다. 완공 직후부터 벤젠 농도가 실내공기질 권고기준을 위반하는 시간의 총합을 최소화하려면 적어도 몇 시간 이상 매일 환기해야 하는지 구하시오.
  points: 8
  depends_on: ['1']
  answer: {kind: value, value: '31/5', equivalents: ['6.2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 첫 24시간이 끝날 때 농도가 30 이하이면 위반 시간은 (1)의 1.75시간뿐이다. $150(0.4)^t(1.25)^{24-t}\le30$.
    steps:
    - {id: 2a, content: '$-0.4t+0.1(24-t)\le-0.7\Rightarrow t\ge6.2$', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - 위반 시간이 최소가 되려면 첫날이 끝날 때 농도가 어떠해야 하는가?
    - $\log1.25$를 $\log2$로 나타내 보자.
  - id: S2-B
    audience: B
    source_flow: G22_pm.pdf p.4-5
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        24시간마다 일정하게 환기를 반복할 때 벤젠 농도가 30 이상인 시간의 총합을 최소화하려면 처음 24시간 경과했을 때 벤젠 농도가 30 이하이어야 한다. 즉, 처음 창문을 열어 $t$시간 동안 환기시킨 후 창문을 닫고 $24-t$시간 지났을 때 30 $\mu$g/m$^3$ 이하가 되면 된다. 이를 부등식으로 나타내면 $150(0.4)^t(1.25)^{24-t}\le30$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        로그함수를 이용하여 풀면 $(0.4)^t(1.25)^{24-t}\le0.2$, $t\times\log0.4+(24-t)\times\log1.25\le\log0.2$이다.
        ($\log1.25=\log\dfrac{125}{100}=\log125-\log100=3\log5-2\log10=3\times0.7-2=0.1$. 공식 예시답안에는 $\log\dfrac{25}{100}=\log25-\log100$으로 적혀 있으나 $\dfrac{125}{100}$, $\log125$의 오기이다.)
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $t\times(-0.4)+(24-t)\times(0.1)\le-0.7$, $t\times(-0.4-0.1)\le-0.7-24\times0.1$, $t\times(-0.5)\le-3.1$이므로 $t\ge6.2$ 또는 $\dfrac{31}{5}$이다. 즉, 매일 적어도 6.2시간($=\dfrac{31}{5}$시간 $=$ 6시간 12분) 동안 환기해야 한다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        적절한 부등식 $150(0.4)^t(1.25)^{24-t}\le30$을 제시했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        $\log0.2$, $\log0.4$, $\log1.25$를 모두 $\log2$와 연관된 형태로 변환했다($-0.7$, $-0.4$, $0.1$).
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2a]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        구하는 환기 시간 $\dfrac{31}{5}$시간을 올바르게 계산하여 얻었다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    완공 직후부터 2시간 동안 창문을 열어 환기한 후, 6시간 동안 창문을 닫아놓는 방식으로 창문 열고 닫기를 주기적으로 반복할 경우, 최소 몇 시간 후 입주가 가능한지 구하시오. (단, 입주 후에도 같은 방식으로 계속 환기하며, 벤젠 농도가 실내공기질 권고기준을 항상 만족해야 한다.)
  points: 8
  depends_on: ['1', '2']
  answer: {kind: value, value: '97/4', equivalents: ['24.25'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 8시간마다 농도의 상용로그가 $2(-0.4)+6(0.1)=-0.2$씩 줄어 $n\ge3.5$이므로 24~32시간 사이에서 $-0.6-0.4t\le-0.7$.
    steps:
    - {id: 3a, content: '$t\ge0.25$이므로 $24.25$시간 후', criteria: [3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - 8시간마다의 농도는 어떤 수열을 이루는가?
    - 기준을 처음 만족하는 때는 어느 8시간 구간 안에 있는가? 그 뒤에 다시 기준을 넘지는 않는가?
  - id: S3-B
    audience: B
    source_flow: G22_pm.pdf p.5
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        8시간마다 일정하게 환기를 반복할 때 8시간마다 벤젠 농도는 직전 농도에 $0.4^2\times1.25^6$을 곱한 값이 된다. 8시간씩 $n$번 지난 후 벤젠 농도가 30 $\mu$g/m$^3$ 이하가 되었다면 $150(0.4)^{2n}(1.25)^{6n}\le30$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        이를 (1), (2)에서와 같이 로그함수를 이용하여 풀면 $n\{2\times(-0.4)+6\times0.1\}\le-0.7$, 즉 $n\ge3.5$이다. $n$은 정수이므로 $n=4$이다. 즉, $8\times3=24$시간 후($n=3$) 벤젠 농도는 30보다 크지만 $8\times4=32$시간 후($n=4$) 벤젠 농도는 30보다 작게 된다.
        그런데, 24시간과 32시간 사이에 벤젠 농도가 30 이하로 내려가는 때가 있고 그 이후에는 항상 벤젠 농도가 30 이하이다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        이 시점을 $24+t$라 하면 (단, $0<t<8$) $150(0.4)^6(1.25)^{18}(0.4)^t\le30$이고, 이를 로그함수를 이용하여 풀면
        $6\times\log0.4+18\times\log1.25+t\times\log0.4\le\log0.2$, $6\times(-0.4)+18\times(0.1)+t\times(-0.4)\le-0.7$, $t\times(-0.4)\le-0.1$, $t\ge0.25$이다.
        즉, $24+0.25=24.25$시간($=\dfrac{97}{4}$시간 $=$ 24시간 15분) 후 입주가 가능하다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        적절한 부등식 $150(0.4)^{2n}(1.25)^{6n}\le30$ (또는 $150(0.4)^6(1.25)^{18}(0.4)^t\le30$)을 제시했다.
