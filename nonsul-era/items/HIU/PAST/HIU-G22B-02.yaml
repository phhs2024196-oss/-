intent: |
  실생활에서 경험하는 간단한 자연 현상들을 수학적으로 이해하고 해결할 수 있는지 평가한다. 이차방정식과 이차함수의 성질을 이해하고 미분과 적분을 활용하여 접선의 기울기와 입체도형의 부피를 구할 수 있는지 평가한다.
  (1) 정적분을 활용하여 입체도형의 부피를 구할 수 있는지 평가한다.
  (2) 주어진 조건으로부터 이차함수의 식을 구할 수 있는지 평가한다.
  (3) 도함수를 활용하여 접선의 기울기를 구할 수 있는지 평가한다.
  (4) 정적분을 활용하여 입체도형의 부피를 구할 수 있는지 평가한다.
  (5) 도함수를 활용하여 접선의 기울기에 대한 문제를 해결할 수 있는지 평가한다.
key_idea: |
  P로부터 높이 $x$인 단면은 바깥 반지름 1, 안쪽 반지름 $\sqrt{x/A}$인 원환이므로 $S(x)=\pi-\dfrac{\pi x}{A}$, 물의 부피는 $\pi a_1+\dfrac{\pi A}{2}$이고, 회전 전후 부피 보존으로 $A$를 정한다.
stuck: |
  수면 높이 $h=x+a_1$에서 안쪽 원의 반지름 $r=\sqrt{x/A}$를 얻어 단면 원환의 넓이를 쓰는 것, 그리고 물컵의 수면도 같은 $A$를 가지므로 기울기 $2Ar$로 거리를 제한하는 것
