stimuli:
- label: 가
  body: |
    [그림 2]는 놀이 기구의 중심축을 포함하고 물컵의 중심을 지나는 평면으로 자른 단면이다. 물통 안의 수면의 한 점과 중심축과의 거리를 $r$이라 할 때, 밑면으로부터 그 점까지의 높이 $h$는 적절한 상수 $A$, $a_1$에 대하여, 포물선의 식 $h=Ar^2+a_1$을 따른다. 흥미롭게도, 물컵 안의 수면의 한 점과 중심축과의 거리를 $r$이라 할 때, 밑면으로부터 그 점까지의 높이 $h$도 물통의 경우와 동일한 상수 $A$와 적절한 상수 $a_2$에 대하여, $h=Ar^2+a_2$를 따른다.
- label: 나
  body: |
    [그림 3a]에서 놀이 기구의 중심축과 물통 안 수면이 만나는 점을 점 P라 하자. 점 P로부터 높이가 $x$인 점을 지나고 지표면과 평행인 평면 $\alpha$를 생각하자. $0<x<A$일 때, 물통 안의 물이 차 있는 부분을 평면 $\alpha$로 자른 단면은 [그림 3b]와 같다. 이때 단면의 경계를 이루는 두 원은 중심이 같다.

stem: |
  새로 개장한 홍익대공원에 [그림 1]과 같은 문어 모양의 놀이 기구가 있다. 밑면의 반지름이 1 m이고 높이가 3 m인 직원기둥 모양의 물통이 놀이 기구의 가운데 위치하고, 문어 다리 모양의 기구체가 물통에 연결되어 있다. 기구체의 끝에 홍익이가 물컵을 들고 타고 있다. 놀이 기구를 작동시키면, 전체 놀이 기구는 물통의 중심을 지나고 지표면과 수직인 중심축에 대하여 시간당 일정한 회전수로 회전한다. 놀이 기구가 정지해 있을 때는 물통과 물컵의 수면은 수평이지만, 작동하는 동안에는 회전의 영향으로 [그림 1]과 같이 물통 안의 물은 중심축 부근이 움푹 파인 모양이 된다. 물통과 물컵 안의 수면의 높이는 중심축으로부터의 거리가 멀어질수록 증가한다.

  [그림 1: 반지름 1 m, 높이 3 m인 원기둥 물통이 중심축 위에 있고, 물통 안 수면은 가운데가 움푹 파인 곡면이다. 물통에서 여러 개의 문어 다리 모양 기구체가 방사형으로 뻗어 있고, 한 다리 끝에 물컵이 있다.]
  [그림 2: $r$축(가로)과 $h$축(세로)의 단면. 물통($-1\le r\le1$) 안의 수면은 $h$절편 $a_1$인 포물선이고, 물통 가장자리의 점 Q에서 그은 접선이 $r$축과 이루는 각이 $\theta_1$이다. 같은 $A$를 가지며 $h$절편이 $a_2$(음수)인 더 큰 포물선이 물컵 위치를 지나고, 물컵 중심에서 수면이 수평과 이루는 각이 $\theta_2$로 표시되어 있다.]
  [그림 3a: 물통 안 포물면 수면의 최저점 P에서 높이 $x$인 수평면 $\alpha$가 물을 자르는 모습.]
  [그림 3b: 평면 $\alpha$ 위의 단면. 중심이 같은 두 원 사이의 원환(빗금) 부분이 $S(x)$이다.]

subparts:
- id: '1'
  stem: |
    [그림 3b]의 단면의 넓이를 $S(x)$ m$^2$라고 할 때, $S(x)$를 $A$와 $x$의 식으로 표현하시오. 이를 이용하여 물통 안의 물의 부피를 $A$와 $a_1$의 식으로 나타내시오.
  points: 4
  depends_on: []
  answer: {kind: expression, value: 'S = pi - pi*x/A; V = pi*a1 + pi*A/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 안쪽 원의 반지름은 $\sqrt{x/A}$, 바깥 원은 1. P 아래는 높이 $a_1$인 원기둥.
    steps:
    - {id: 1a, content: '$S(x)=\pi-\dfrac{\pi x}{A}$, $V=\pi a_1+\dfrac{\pi A}{2}$', criteria: [1.B1, 1.M1]}
    hint_ladder:
    - 높이 $x+a_1$에서 수면의 반지름을 구하자.
  - id: S1-B
    audience: B
    source_flow: G22_pm.pdf p.10
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        [그림 3a]에서 밑면에서 평면 $\alpha$까지의 높이를 $h$라 하면 $h=x+a_1$이다. [그림 3b]의 안쪽 원의 반지름을 $r$이라 하면 $h=Ar^2+a_1$이므로, $x=Ar^2$ 즉, $r=\sqrt{\dfrac{x}{A}}$이다. 바깥쪽 원의 반지름은 1이므로 $S(x)=\pi-\pi r^2=\pi-\dfrac{\pi x}{A}$이다. 또한 $0\le r\le1$이므로 $0\le x\le A$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        구하는 물의 부피는 점 P 아래쪽 부분의 부피와 점 P 위쪽 부분의 부피의 합이므로
        $$\pi a_1+\int_0^A S(x)\,dx=\pi a_1+\pi A-\frac{\pi A^2}{2A}=\pi a_1+\frac{\pi A}{2}$$
        이다.
      criteria: [1.M1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        단면의 넓이 $S(x)=\pi-\dfrac{\pi x}{A}$를 주어진 식을 이용하여 구했다.
      depends_on: []
      steps: [1b-1, 1a]
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        물의 부피 $\pi a_1+\dfrac{\pi A}{2}$를 적분을 이용하여 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    놀이 기구가 정지하고 있을 때 물통 안의 수면의 높이가 2 m이고, 놀이 기구가 회전할 때 물통 안의 수면의 최저 높이가 $2-\dfrac{\sqrt3}{12}$ m 일 때, $A$의 값을 구하시오.
  points: 4
  depends_on: ['1']
  answer: {kind: value, value: 'sqrt(3)/6', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 부피 보존 $\pi a_1+\dfrac{\pi A}{2}=2\pi$.
    steps:
    - {id: 2a, content: '$A=4-2a_1=\dfrac{\sqrt3}{6}$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - 회전해도 물의 양은 변하지 않는다.
  - id: S2-B
    audience: B
    source_flow: G22_pm.pdf p.10
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        놀이기구가 정지했을 때 물의 부피는 $2\pi$인데 회전할 때도 물통 안의 물의 부피는 이와 동일하므로 (1)의 결과에서 $\pi a_1+\dfrac{\pi A}{2}=2\pi$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $a_1=2-\dfrac{\sqrt3}{12}$로부터 $A=4-2a_1=4-2\left(2-\dfrac{\sqrt3}{12}\right)=\dfrac{\sqrt3}{6}$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        물의 부피는 놀이기구가 정지했을 때와 회전할 때 같음을 이용해 $\pi a_1+\dfrac{\pi A}{2}=2\pi$를 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 2}
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        위의 관계를 이용하여 $A=\dfrac{\sqrt3}{6}$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    놀이 기구가 회전할 때, 물통의 가장자리에서 물통의 수면과 지표면이 이루는 각의 크기는 [그림 2]의 점 Q에서 포물선의 접선과 $r$축이 이루는 각의 크기 $\theta_1$으로 나타난다. 문항 (2)와 동일한 가정하에서 각의 크기 $\theta_1$을 구하시오.
  points: 4
  depends_on: ['2']
  answer: {kind: value, value: 'pi/6', equivalents: ['30 degrees'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $r=1$에서 기울기 $2A=\dfrac{\sqrt3}{3}$.
    steps:
    - {id: 3a, content: '$\tan\theta_1=\dfrac{\sqrt3}{3}$, $\theta_1=\dfrac{\pi}{6}$', criteria: [3.M1, 3.A1]}
    hint_ladder:
    - 점 Q의 $r$좌표는 얼마인가?
  - id: S3-B
    audience: B
    source_flow: G22_pm.pdf p.10
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        수면의 높이는 $h=Ar^2+a_1$이므로 $\dfrac{dh}{dr}=2Ar$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        점 Q에서(즉, $r=1$일 때) 접선의 기울기는 $2A=\dfrac{\sqrt3}{3}$이다. $\tan\left(\dfrac{\pi}{6}\right)=\dfrac{\sqrt3}{3}$이므로 $\theta_1=\dfrac{\pi}{6}=30^\circ$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        수면의 높이를 $r$에 대해 미분한 도함수 $\dfrac{dh}{dr}=2Ar$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3a]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        도함수 값을 이용하여 $\tan\theta_1=\dfrac{\sqrt3}{3}$과 각의 크기 $\theta_1=\dfrac{\pi}{6}$을 구했다.
      depends_on: [3.M1]
      ft: {allowed: true, from: [2.A1], max_points: 2}
      steps: [3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    놀이 기구가 정지하고 있을 때 물통에 물을 가득 채우고 놀이 기구를 작동시키면, 놀이 기구가 회전하며 물통의 물이 움푹 파인 모양이 되며, 파인 만큼의 물이 물통에서 넘치게 된다. 이때 수면의 높이는 적절한 상수 $a_3$에 대하여 $h=Ar^2+a_3$ 을 따른다고 할 때, 넘치게 되는 물의 부피를 구하시오. 단, 상수 $A$의 값은 문항 (2)에서 구한 값과 같다.
  points: 4
  depends_on: ['1', '2']
  answer: {kind: value, value: 'sqrt(3)*pi/12', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 파인 부분은 단면이 반지름 $\sqrt{x/A}$인 원, 높이 $0\le x\le A$.
    steps:
    - {id: 4a, content: '$\displaystyle\int_0^A\frac{\pi x}{A}dx=\frac{\pi A}{2}=\frac{\sqrt3\pi}{12}$', criteria: [4.B1]}
    hint_ladder:
    - 넘친 물의 양은 파인 부분의 부피와 같다.
  - id: S4-B
    audience: B
    source_flow: G22_pm.pdf p.11
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        물이 넘친 부분의 부피는 회전으로 인해 움푹 파이게 되는 부분의 부피와 같다. 이 부분의 부피를 (1)에서와 같이 구한다. 움푹 파인 부분의 바닥에서부터 높이가 $x$인 지면과 평행한 평면으로 자른 단면은 [그림 3b]의 안쪽원과 같이 반지름 $\sqrt{\dfrac{x}{A}}$인 원이다. 단면적은 $\dfrac{\pi x}{A}$이고 $0\le x\le A$이므로 구하는 부피는 $\displaystyle\int_0^A\frac{\pi x}{A}\,dx=\frac{\pi A}{2}=\frac{\pi\sqrt3}{12}$이다.
      criteria: [4.B1]
