- id: '5'
  stem: |
    $n=4$인 경우, 확률 $\mathrm{P}(B)$를 구하시오.
  points: 6
  depends_on: ['2', '3', '4']
  answer: {kind: value, value: '37/128', equivalents: [], tolerance: null}
  solutions:
  - id: S5-A
    audience: A
    method_no: 1
    key_idea: $C$는 서로 다른 '오류 2개' 세로줄 3개 + 오류 1개 이하 세로줄 1개, ${}_4C_3\times3!\times4$가지.
    steps:
    - {id: 5a, content: '$\dfrac{5}{16}-\dfrac{96}{2^{12}}=\dfrac{37}{128}$', criteria: [5.R1, 5.A1, 5.A2]}
    hint_ladder:
    - 오류가 남은 세로줄이 4개면 가로줄에 오류가 몇 개씩 생기는가?
  - id: S5-B
    audience: B
    source_flow: G22_pm.pdf p.17
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        (3)에서와 같이 $n=4$일 때 $A$, $B$, $C$에 속하는 경우를 구한다. 먼저 $4\times3=12$개의 소자의 오류 여부를 ○, ×로 나타낸다면 $2^{12}$가지 경우가 있다. 이 중 $A$에 속하는 경우는 (위에서 아래로) (×,×,×), (○,×,×), (×,○,×), (×,×,○)와 같은 세로줄이 (중복을 허용하여) 세 개 이상 있는 경우이다.
        이때, 네 세로줄 중에 하나가 (×,×,×)이거나, (○,×,×), (×,○,×), (×,×,○) 중 같은 세로줄이 2개 이상 있으면 (3)에서와 같이 [세로줄 수정]직후 세 개 이상의 오류를 포함한(즉, ×가 세 개 이상인) 가로줄이 있어서 오작동한다(즉, $B$에 속하는 경우이다).
      criteria: [5.R1]
    - id: 5b-2
      content: |
        따라서, $C$에 속하는 경우는 네 개의 세로줄 중 (○,×,×), (×,○,×), (×,×,○)이 하나씩 있고 나머지 한 세로줄은 오류가 한 개 이하인 즉, (○,○,○), (×,○,○), (○,×,○), (○,○,×) 중 하나인 경우이다. 이러한 경우의 수는 4개의 세로줄 중 3개를 선택하여 (○,×,×), (×,○,×), (×,×,○)을 나열하고 나머지 한줄에 4가지 중 하나를 선택하는 경우의 수이므로 ${}_4C_3\times3!\times4$이다. 따라서 $\mathrm{P}(C)=\dfrac{{}_4C_3\times3!\times4}{2^{12}}=\dfrac{3}{128}$이다.
      criteria: [5.A1]
    - id: 5b-3
      content: |
        (2)에 의해 $n=4$일 때 $\mathrm{P}(A)=\dfrac{5}{16}$이고, (4)에서와 같이 $\mathrm{P}(A)=\mathrm{P}(B)+\mathrm{P}(C)$이므로 $\mathrm{P}(B)=\mathrm{P}(A)-\mathrm{P}(C)=\dfrac{5}{16}-\dfrac{3}{128}=\dfrac{37}{128}$이다.
      criteria: [5.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 5.R1
      mark_type: R
      points: 3
      evidence: |
        $n=4$인 경우, 사건 $C$에 포함되는 초기 상태(서로 다른 오류 2개 세로줄 3개와 오류 1개 이하 세로줄 1개)를 정확히 설명했다.
      depends_on: []
      steps: [5b-1, 5b-2, 5a]
    - id: 5.A1
      mark_type: A
      points: 2
      evidence: |
        경우의 수 ${}_4C_3\times3!\times4=96$을 계산하여 $\mathrm{P}(C)=\dfrac{3}{128}$을 구했다.
      depends_on: [5.R1]
      steps: [5b-2, 5a]
    - id: 5.A2
      mark_type: A
      points: 1
      evidence: |
        올바른 $\mathrm{P}(A)=\dfrac{5}{16}$을 이용하여 $\mathrm{P}(B)=\mathrm{P}(A)-\mathrm{P}(C)=\dfrac{37}{128}$을 계산했다.
      depends_on: [5.R1]
      ft: {allowed: true, from: [2.M1], max_points: 1}
      steps: [5b-3, 5a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

