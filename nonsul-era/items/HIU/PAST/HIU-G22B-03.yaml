stimuli:
- label: 가
  body: |
    [세로줄 수정] 각 세로줄에서 생긴 오류가 1개 이하이면 보호장치가 해당 세로줄의 오류를 수정하고, 오류가 2개 이상이면 오류는 모두 그대로 남는다.
- label: 나
  body: |
    [가로줄 수정] 세로줄 수정 후 남은 오류들 중, 각 가로줄에서 오류가 2개 이하이면 보호장치가 해당 가로줄의 오류를 모두 수정하고, 3개 이상이면 오류는 모두 그대로 남는다.
- label: 다
  body: |
    위의 (가), (나)에서 수정되지 않고 남아있는 오류가 있으면 장치는 오작동한다.

stem: |
  [그림: 3행 $n$열로 배열된 소자(칩) 그림. 각 가로줄은 소자 3개 뒤에 …으로 이어진다.]

  위의 그림과 같이 3개의 소자로 이루어진 세로줄이 $n$개 있어서, 모두 $3n$개의 소자로 이루어진 장치를 생각하자. (단, $n\ge3$)

  전원을 켜면 장치는 초기 상태에 들어가고, 이때 각각의 소자에는 독립적으로 $1/2$의 확률로 오류가 생긴다. 오류가 없는 소자의 상태를 ○, 오류가 있는 상태를 ×로 표시하자. 예를 들어, $n=4$인 경우, 다음과 같은 초기 상태들이 있을 수 있다.

  (a) 1행: ○×○×, 2행: ××○○, 3행: ○○×○
  (b) 1행: ○×○○, 2행: ×××○, 3행: ×○××

  이후 아래와 같이 보호장치가 작동하여 일부 소자의 오류를 수정하는데, 이 장치의 정상작동 여부는 다음의 순서로 결정된다.

  (가), (나), (다) [제시문 참조]

  예를 들어, 수정된 오류를 ⊗로 나타낼 때, 초기 상태가 (a)라면, [세로줄 수정]에 의해 (a′)의 상태가 되고, [가로줄 수정]에 의해 (a″)의 상태가 되어 장치는 정상작동한다. 초기 상태 (b)는 [세로줄 수정]에 의해 (b′)의 상태가 되고, [가로줄 수정]에 의해 (b″)의 상태가 되어 장치가 오작동한다.

  (a′) 1행: ○×○⊗, 2행: ⊗×○○, 3행: ○○⊗○ / (a″) 1행: ○⊗○⊗, 2행: ⊗⊗○○, 3행: ○○⊗○
  (b′) 1행: ○×○○, 2행: ×××○, 3행: ×○×⊗ / (b″) 1행: ○⊗○○, 2행: ×××○, 3행: ⊗○⊗⊗

  장치의 정상작동 여부는 초기 상태에 의해 결정되고, 초기 상태는 $2^{3n}$개가 있다. 이 장치의 전원을 켰을 때, [세로줄 수정] 직후, $n$개의 세로줄들 중에서 오류가 남아있는 세로줄이 3개 이상이 되는 초기 상태들의 집합을 사건 $A$라 하자. [세로줄 수정]과 [가로줄 수정]을 거쳐 장치의 오작동을 일으키는 초기 상태들의 집합을 사건 $B$라 하자.

subparts:
- id: '1'
  stem: |
    장치의 전원을 켰을 때, [세로줄 수정] 직후, 첫 번째 세로줄에 오류가 남아있을 확률을 구하시오.
  points: 2
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 오류 개수 $\sim\mathrm{B}\left(3,\tfrac12\right)$에서 2개 이상일 확률.
    steps:
    - {id: 1a, content: '$\dfrac38+\dfrac18=\dfrac12$', criteria: [1.B1]}
    hint_ladder:
    - 세로줄 수정 후에도 오류가 남으려면 처음 오류가 몇 개여야 하는가?
  - id: S1-B
    audience: B
    source_flow: G22_pm.pdf p.16
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        3개의 소자 중 각각의 소자에 오류가 생길 사건은 서로 독립이며 확률은 $\dfrac12$이므로 오류가 생긴 소자의 개수는 이항분포 $\mathrm{B}\left(3,\dfrac12\right)$를 따른다. [세로줄 수정] 직후 첫 번째 세로줄에 오류가 남아있는 경우는 처음에 그 세로줄의 3개의 소자 중 오류가 생긴 소자가 2개 또는 3개인 경우이므로 확률은 ${}_3C_2\times\dfrac{1}{2^3}+{}_3C_3\times\dfrac{1}{2^3}=\dfrac38+\dfrac18=\dfrac12$이다.
      criteria: [1.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        사건의 확률 $\dfrac12$을 구했다.
      depends_on: []
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $n\ge3$인 경우, 확률 $\mathrm{P}(A)$를 $n$에 대한 식으로 나타내시오.
  points: 4
  depends_on: ['1']
  answer: {kind: expression, value: '1 - (n**2 + n + 2)/2**(n + 1)', equivalents: ['1 - (1 + n + n*(n-1)/2)/2**n'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 오류 남은 세로줄 개수 $\sim\mathrm{B}\left(n,\tfrac12\right)$, 여사건은 2개 이하.
    steps:
    - {id: 2a, content: '$1-\dfrac{1}{2^{n+1}}(n^2+n+2)$', criteria: [2.R1, 2.M1]}
    hint_ladder:
    - 각 세로줄의 결과는 서로 독립이다. 여사건을 생각하자.
  - id: S2-B
    audience: B
    source_flow: G22_pm.pdf p.16
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        각 세로줄에 대해 [세로줄 수정] 직후 오류가 남아있을 사건은 서로 독립이고, (1)의 결과에 의해 각각의 확률은 $1/2$이다.
      criteria: [2.R1]
    - id: 2b-2
      content: |
        따라서, [세로줄 수정] 직후 $n$개의 세로줄 중 $k$개의 세로줄에 오류가 남아있을 확률은 이항분포에 의해 ${}_nC_k\times\dfrac{1}{2^n}$이다. 구하는 확률은 $n$개 중 2개 이하의 세로줄에 오류가 남아있는 사건의 여사건의 확률이므로
        $$\mathrm{P}(A)=1-\frac{1}{2^n}({}_nC_0+{}_nC_1+{}_nC_2)=1-\frac{1}{2^n}\left(1+n+\frac{n(n-1)}{2}\right)=1-\frac{1}{2^{n+1}}(n^2+n+2)$$
        이다.
      criteria: [2.M1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 1
      evidence: |
        각 세로줄에 오류가 남아 있을 사건이 서로 독립임을 설명했다.
      depends_on: []
      steps: [2b-1, 2a]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        이항정리 또는 이항분포를 이용하여 $\mathrm{P}(A)=1-\dfrac{1}{2^{n+1}}(n^2+n+2)$를 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.B1], max_points: 3}
      steps: [2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $n=3$인 경우, 아래에 주어진 초기 상태 (c)는 $A$에 포함되고 $B$에는 포함되지 않는다. 반면, (d)는 $A$와 $B$에 모두 포함된다. 사건 $C=A-B$라 할 때, 확률 $\mathrm{P}(C)$를 구하시오.

    (c) 1행: ○××, 2행: ×○×, 3행: ××○
    (d) 1행: ×××, 2행: ×○×, 3행: ××○
  points: 6
  depends_on: []
  answer: {kind: value, value: '3/256', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $C$는 세 세로줄이 모두 오류 정확히 2개이고 ○의 위치가 모두 다른 경우, 즉 $3!$가지.
    steps:
    - {id: 3a, content: '$\mathrm{P}(C)=\dfrac{3!}{2^9}=\dfrac{3}{256}$', criteria: [3.R1, 3.A1]}
    hint_ladder:
    - 오류가 3개인 세로줄이 있으면 어떻게 되는가?
    - 오류 2개짜리 세로줄 중 같은 모양이 두 개 있으면?
  - id: S3-B
    audience: B
    source_flow: G22_pm.pdf p.16-17
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $n=3$일 때, $3\times3=9$개의 소자의 오류 여부를 ○, ×로 그림 (c), (d)와 같이 나타낸다면 $2^9=512$가지 경우가 있다(예시답안 원문에는 $2^9=516$으로 오기). 이들 중 각각의 세로줄에 두 개 이상의 오류가 있는 초기상태들의 집합이 $A$이다. $A$에 속하는 경우 중 만약 (d)와 같이 한 세로줄에 세 개의 오류가 있으면 세 개의 오류를 포함한 가로줄이 있게 되어서 장치는 오작동한다. 그러므로, 초기상태 $I\in C$이면, $I$는 각 세로줄에 오직 두 개씩의 오류를 가진다.
      criteria: [3.R1]
    - id: 3b-2
      content: |
        그런데, 두 개씩의 오류를 가진 세로줄은 (○,×,×), (×,○,×), (×,×,○) 중 하나이다. 만약 1행 ○×○, 2행 ×××, 3행 ×○×와 같이, 같은 모양의 세로줄이 있으면, 역시 세 개의 오류를 포함한 가로줄이 있게 되어서 장치는 오작동한다. 그러므로, $C=A-B$에 포함되는 초기상태는 (c)와 같이 (○,×,×), (×,○,×), (×,×,○)를 (중복없이) 나열한 것들이다. 따라서 $3!=6$가지가 있다. 그러므로 $\mathrm{P}(C)=\dfrac{6}{2^9}=\dfrac{3}{256}$이다.
      criteria: [3.R1, 3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.R1
      mark_type: R
      points: 4
      evidence: |
        사건 $C$에 포함되는 초기 상태(각 세로줄에 오류가 정확히 2개이고 세 세로줄의 모양이 모두 다름)를 정확히 설명했다.
      depends_on: []
      steps: [3b-1, 3b-2, 3a]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        경우의 수 $3!=6$을 계산하여 $\mathrm{P}(C)=\dfrac{3}{256}$을 구했다.
      depends_on: [3.R1]
      steps: [3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    $n=3$인 경우, 확률 $\mathrm{P}(B)$를 구하시오.
  points: 2
  depends_on: ['2', '3']
  answer: {kind: value, value: '29/256', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $B\subset A$, $B\cap C=\varnothing$이므로 $\mathrm{P}(B)=\mathrm{P}(A)-\mathrm{P}(C)$.
    steps:
    - {id: 4a, content: '$\dfrac18-\dfrac{3}{256}=\dfrac{29}{256}$', criteria: [4.M1]}
    hint_ladder:
    - 오류가 남은 세로줄이 2개 이하이면 가로줄 수정 후 오류가 남을 수 있는가?
  - id: S4-B
    audience: B
    source_flow: G22_pm.pdf p.17
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $C=A-B$이므로 $B\cap C=\varnothing$, 즉 $B$와 $C$는 서로 배반사건이다. 또한 $B\subset A$이므로 $A=B\cup C$이다. 따라서 $\mathrm{P}(A)=\mathrm{P}(B)+\mathrm{P}(C)$이다. $n=3$인 경우, (2)의 결과에 의해 $\mathrm{P}(A)=\dfrac18$이므로 $\mathrm{P}(B)=\mathrm{P}(A)-\mathrm{P}(C)=\dfrac18-\dfrac{3}{256}=\dfrac{29}{256}$이다.
      criteria: [4.M1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 2
      evidence: |
        두 확률의 차 $\mathrm{P}(A)-\mathrm{P}(C)$를 이용하여 $\mathrm{P}(B)=\dfrac{29}{256}$을 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.M1, 3.A1], max_points: 2}
      steps: [4b-1, 4a]
    deductions: []
