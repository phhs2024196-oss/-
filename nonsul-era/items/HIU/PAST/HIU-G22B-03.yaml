intent: |
  제시문에서 주어진 확률적 상황을 파악하여 경우의 수를 구하고 확률을 계산할 수 있는지 평가한다.
  (1) 사건의 독립을 이해하는지 평가한다.
  (2) 이항정리 또는 이항분포를 이해하고 이용할 수 있는지 평가한다.
  (3) 사건, 여사건 등의 확률적 개념을 잘 이해하고 확률의 덧셈정리를 이용하여 확률을 계산할 수 있는지 평가한다.
  (4), (5) 순열과 조합을 이용한 경우의 수를 계산할 수 있는지 평가한다.
key_idea: |
  [세로줄 수정] 뒤 오류가 남는 세로줄은 각각 독립적으로 확률 $\dfrac12$이고, 오작동(B)은 오류가 남은 세로줄이 3개 이상일 때만 생기므로 $B\subset A$, $P(B)=P(A)-P(C)$이며 $C$는 서로 다른 '오류 2개' 세로줄 3개가 모두 들어 있는 경우로 센다.
stuck: |
  $B\subset A$를 알아차리고 $C=A-B$(가로줄 수정으로 모두 고쳐지는 경우)를 직접 세는 발상, 그리고 같은 모양의 세로줄 또는 오류 3개 세로줄이 있으면 오류 3개인 가로줄이 생긴다는 분류
