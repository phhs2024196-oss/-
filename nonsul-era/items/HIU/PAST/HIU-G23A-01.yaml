stimuli: []

stem: |
  정사각형 종이의 한 변이 중심점 $O$와 접하도록 여러 번 접었다 펴면, 접힌 자국이 없는 영역과 그 경계를 이루는 곡선이 생긴다(<그림 1>).정사각형 종이의 변 $\ell_1$이 중심점 $O$와 접하도록 접고 $\ell_1$ 위의 점 $O$에서 $\ell_1$에 수직인 직선 $\ell_2$를 그으면, 직선 $\ell_2$와 접힌 선 $\ell_3$이 만나는 점 $P$가 경계 곡선 위의 점이 되는 것이 알려져 있다(<그림 2>).

  [그림 1: 정사각형 종이 세 장. 첫째는 아랫변이 중심점 $O$에 닿도록 아래쪽을 비스듬히 접어 올린 모습, 둘째는 펼친 뒤 남은 접힌 자국(점선), 셋째는 여러 번 접어 생긴 많은 접힌 자국이 $O$ 아래쪽에 아래로 볼록한 곡선 모양의 경계를 만든 모습]
  [그림 2: 왼쪽은 접어 올린 변 $\ell_1$이 $O$를 지나고, $O$에서 $\ell_1$에 수직인 직선 $\ell_2$가 접힌 선 $\ell_3$과 점 $P$에서 만나는 모습. 오른쪽은 펼친 종이에서 $P$가 $O$ 아래의 경계 곡선 위에 있는 모습]
subparts:
- id: '1'
  stem: |
    중심점 $O$를 좌표평면의 원점에 두고 직선 $y=-1$에 변을 가지는 종이의 아래쪽을 <그림 1>과 같은 방법으로 접어서 얻는 곡선이 포물선이 되는 이유를 설명하고, 이 포물선의 준선과 초점을 구하시오.
  points: 5
  depends_on: []
  answer: {kind: expression, value: 'focus: (0, 0); directrix: y = -1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접힌 선 $\ell_3$에 대한 선대칭으로 $\overline{PO}$와 $P$에서 변까지의 거리가 같다.
    steps:
    - {id: 1a, content: '$\ell_3$ 대칭 $\Rightarrow\overline{PO}=d(P,\,y=-1)$, 초점 $O(0,0)$, 준선 $y=-1$', criteria: ['1.R1', '1.B1', '1.B2']}
    hint_ladder:
    - 접으면 변 위의 어느 점이 $O$에 겹치는가?
    - 접힌 선은 겹친 두 점을 잇는 선분과 어떤 관계인가?
  - id: S1-B
    audience: B
    source_flow: G23_seoul_am.pdf p.3
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        포물선의 정의: 평면 상의 한 점(초점)과 이 점을 지나지 않는 직선(준선)으로부터 거리가 같은 점들의 집합.
      criteria: ['1.R1']
    - id: 1b-2
      content: |
        <그림 2>의 점 $P$는 원점과 정사각형의 아랫변(직선 $y=-1$)으로부터 거리가 같다. 이는 접힌 흔적 $\ell_3$을 기준으로 선대칭을 이루기 때문이다(접기 전 $\ell_2$ 위에서 $P$와 아랫변 사이의 선분이 접힌 뒤 $P$와 $O$ 사이의 선분과 겹친다).
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        따라서 이와 같은 점들의 집합은 원점 $O$를 초점, 직선 $y=-1$을 준선으로 가지는 포물선(의 일부)이다.
      criteria: ['1.B1', '1.B2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        포물선의 정의를 쓰고, 접힌 선 $\ell_3$에 대한 선대칭으로 $P$에서 $O$까지의 거리와 $P$에서 아랫변까지의 거리가 같음을 설명했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1a]
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: |
        준선 $y=-1$을 적었다.
      steps: [1b-3, 1a]
    - id: 1.B2
      mark_type: B
      points: 1
      evidence: |
        초점 $O(0,0)$을 적었다.
      steps: [1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    중심점 $O$를 좌표평면의 원점에 두고 직선 $x=1$, $x=-1$, $y=1$, $y=-1$에 네 변을 가지는 정사각형 모양 종이에서, 네 변 각각에 대해 제시문과 같은 방법으로 곡선을 만들었을 때 곡선에 해당하는 식을 모두 구하시오.
  points: 8
  depends_on: ['1']
  answer: {kind: expression, value: 'x**2 = 2*y + 1; y**2 = -2*x + 1; y**2 = 2*x + 1; x**2 = -2*y + 1', equivalents: ['y = (x**2 - 1)/2; x = -(y**2 - 1)/2; x = (y**2 - 1)/2; y = -(x**2 - 1)/2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 초점 $O$, 준선이 각 변인 포물선 $\sqrt{x^2+y^2}=$(점과 변 사이 거리).
    steps:
    - {id: 2a, content: '$x^2=2y+1$, $y^2=-2x+1$, $y^2=2x+1$, $x^2=-2y+1$', criteria: ['2.B1', '2.B2', '2.B3', '2.B4']}
    hint_ladder:
    - (1)의 결과를 네 변에 각각 적용하라.
  - id: S2-B
    audience: B
    source_flow: G23_seoul_am.pdf p.4
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1)에 의해 구하는 네 곡선은 각각 점 $O$를 초점, 직선 $x=1$, $x=-1$, $y=1$, $y=-1$을 준선으로 가지는 포물선이다.
      criteria: ['2.B1', '2.B2', '2.B3', '2.B4']
    - id: 2b-2
      content: |
        점 $O$를 초점, 직선 $y=-1$을 준선으로 가지는 포물선: 원점부터 점 $P(x,y)$까지의 거리는 $\sqrt{x^2+y^2}$이고 점 $P$부터 직선 $y=-1$까지의 거리는 $\lvert y+1\rvert$이므로 $\sqrt{x^2+y^2}=\lvert y+1\rvert$로부터 $x^2+y^2=y^2+2y+1$, 즉 $x^2=2y+1$이다. (또는 $y=\dfrac{x^2-1}{2}$)
      criteria: ['2.B1']
    - id: 2b-3
      content: |
        마찬가지로 준선 $x=1$이면 $y^2=-2x+1$, 준선 $x=-1$이면 $y^2=2x+1$, 준선 $y=1$이면 $x^2=-2y+1$이다.
      criteria: ['2.B2', '2.B3', '2.B4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        준선 $y=-1$인 포물선 $x^2=2y+1$(또는 동치식)을 구했다.
      steps: [2b-1, 2b-2, 2a]
    - id: 2.B2
      mark_type: B
      points: 2
      evidence: |
        준선 $x=1$인 포물선 $y^2=-2x+1$(또는 동치식)을 구했다.
      steps: [2b-1, 2b-3, 2a]
    - id: 2.B3
      mark_type: B
      points: 2
      evidence: |
        준선 $x=-1$인 포물선 $y^2=2x+1$(또는 동치식)을 구했다.
      steps: [2b-1, 2b-3, 2a]
    - id: 2.B4
      mark_type: B
      points: 2
      evidence: |
        준선 $y=1$인 포물선 $x^2=-2y+1$(또는 동치식)을 구했다.
      steps: [2b-1, 2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    문항 (2)에서 접힌 자국이 없는 영역 $R$가 아래의 그림과 같이 생성될 때, 이 영역의 넓이를 구하시오.

    [그림: 정사각형 안에 네 변 방향으로 접은 많은 접힌 선(직선)들이 그려져 있고, 가운데 $O$ 주위에 네 개의 포물선 호로 둘러싸인 둥근 사각형 모양의 영역 $R$가 있다.]
  points: 7
  depends_on: ['2']
  answer: {kind: value, value: '(16*sqrt(2) - 20)/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 대칭으로 포물선 $y=\tfrac{x^2-1}{2}$, 직선 $y=x$, $y$축으로 둘러싸인 부분의 $8$배.
    steps:
    - {id: 3a, content: '$8\displaystyle\int_{1-\sqrt2}^{0}\left(x-\tfrac{x^2-1}{2}\right)dx=\tfrac{16\sqrt2-20}{3}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 네 포물선 중 어느 것이 영역의 경계가 되는지 대칭축으로 나누어 보라.
  - id: S3-B
    audience: B
    source_flow: G23_seoul_am.pdf p.4
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        대칭을 고려하면 정사각형의 각 변을 준선으로 삼는 각각의 포물선은 $y=x$와 $y=-x$ 2개의 직선으로 그 경계가 나뉜다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        아래쪽 포물선 $y=\dfrac{x^2-1}{2}$과 직선 $y=x$의 교점은 $x^2-2x-1=0$으로부터 $x=y=1\pm\sqrt2$이다. 두 교점 중 3사분면의 교점은 $x=1-\sqrt2$, $y=1-\sqrt2$이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        구하는 넓이는 대칭으로부터 포물선 $y=\dfrac{x^2-1}{2}$와 직선 $y=x$, $y$축으로 둘러싸인 부분의 넓이의 $8$배이다. 구간 $1-\sqrt2\le x\le0$에서 포물선은 직선 $y=x$ 아래쪽에 있으므로
        $$8\times\int_{1-\sqrt2}^{0}\left(x-\frac{x^2-1}{2}\right)dx$$
      criteria: ['3.M1']
    - id: 3b-4
      content: |
        $$=8\times\left[-\frac{x^3}{6}+\frac{x^2}{2}+\frac{x}{2}\right]_{1-\sqrt2}^{0}=8\times\frac{4\sqrt2-5}{6}=\frac{16\sqrt2-20}{3}$$
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        적분구간 $[1-\sqrt2,\,0]$을 포함하여 넓이를 구하는 계산식(대칭 $8$배 등)을 정확히 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.B1], max_points: 3}
      steps: [3b-1, 3b-2, 3b-3, 3a]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        정적분을 계산해 넓이 $\dfrac{16\sqrt2-20}{3}$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-4, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

