intent: |
  고등학교 기하 과목에서 제시되는 이차곡선 중 하나인 포물선의 특성을 파악하고, 포물선의 식을 구할 수 있는지 평가한다. 또한, 포물선으로 둘러싸인 도형의 넓이를 구할 수 있는지를 평가한다.
key_idea: |
  접힌 선 $\ell_3$에 대한 선대칭으로 $\overline{PO}=$($P$와 변 사이 거리)가 되어 경계 곡선은 $O$를 초점, 변을 준선으로 하는 포물선이고, 네 포물선으로 둘러싸인 영역은 대칭으로 $8$조각으로 나누어 적분한다.
stuck: |
  종이를 접는 조작을 "두 점에서 같은 거리"라는 포물선의 정의로 번역하는 것, 그리고 (3)에서 네 포물선의 경계가 직선 $y=\pm x$로 나뉨을 파악하는 것
