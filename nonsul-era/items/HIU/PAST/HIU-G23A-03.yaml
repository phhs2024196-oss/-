- id: '4'
  stem: |
    문항 (3)의 $f(x)$와 이에 대한 $s(n)$, $t(n)$에 대하여 $\displaystyle\lim_{n\to\infty}\frac{s(n)}{n^2}$, $\displaystyle\lim_{n\to\infty}\frac{t(n)}{n^2}$, $\displaystyle\lim_{n\to\infty}\frac{s(n)}{n}$을 구하시오. 이 중에서 문항 (3)의 $y=f(x)$의 그래프와 $x$축 사이 영역의 넓이와 같은 것은 무엇인가? $\displaystyle\lim_{n\to\infty}\frac{s(n)}{n}$은 $y=f(x)$의 그래프의 길이를 나타내는가?
  points: 4
  depends_on: ['3']
  answer: {kind: expression, value: 'lim_s_n2 = 0; lim_t_n2 = 4; lim_s_n = 6; area = 4; length = 2*sqrt(5)', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $\tfrac{t(n)}{n^2}$은 그래프 아래 칸들의 넓이의 합(구분구적), 길이는 두 선분의 길이 합 $2\sqrt5\ne6$.
    steps:
    - {id: 4a, content: '극한 $0,4,6$; 넓이 $=\lim\tfrac{t(n)}{n^2}=4$; 길이 $2\sqrt5\ne6$이므로 나타내지 않음', criteria: ['4.B1', '4.R1', '4.R2']}
    hint_ladder:
    - $\tfrac1{n^2}$은 칸 하나의 넓이이다.
  - id: S4-B
    audience: B
    source_flow: G23_seoul_am.pdf p.15
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $\displaystyle\lim_{n\to\infty}\frac{s(n)}{n^2}=\lim_{n\to\infty}\frac{6n}{n^2}=0$, $\displaystyle\lim_{n\to\infty}\frac{t(n)}{n^2}=\lim_{n\to\infty}\frac{4n^2-2n}{n^2}=4$, $\displaystyle\lim_{n\to\infty}\frac{s(n)}{n}=\lim_{n\to\infty}\frac{6n}{n}=6$이다.
      criteria: ['4.B1']
    - id: 4b-2
      content: |
        $t(n)$은 그래프의 아래 $x$축 위쪽의 정사각형들의 개수이고, $\dfrac1{n^2}$는 각 정사각형의 넓이이므로 $\dfrac{t(n)}{n^2}$는 이 정사각형들의 넓이의 합이다. 그 극한 $\displaystyle\lim_{n\to\infty}\frac{t(n)}{n^2}$은 그래프와 $x$축 사이의 넓이이다. 실제로 넓이를 계산하면(삼각형과 사다리꼴의 넓이의 합) $\dfrac12\times1\times2+2\times\dfrac{(2+1)}{2}=4$이다.
      criteria: ['4.R1']
    - id: 4b-3
      content: |
        주어진 함수 그래프의 길이는 $(0,0)$과 $(1,2)$를 잇는 선분의 길이와 $(1,2)$와 $(3,1)$을 잇는 선분의 길이의 합이므로 $\sqrt{1+4}+\sqrt{4+1}=2\sqrt5$이고 $\displaystyle\lim_{n\to\infty}\frac{s(n)}{n}$은 그래프의 길이를 나타내지 않는다.
      criteria: ['4.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.B1
      mark_type: B
      points: 2
      evidence: |
        (3)의 식을 이용하여 세 극한 $0$, $4$, $6$을 구했다.
      ft: {allowed: true, from: [3.B1, 3.B2], max_points: 2}
      steps: [4b-1, 4a]
    - id: 4.R1
