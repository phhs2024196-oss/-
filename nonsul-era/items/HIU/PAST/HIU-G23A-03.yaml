stimuli:
- label: 가
  body: |
    홍익이는 컴퓨터 화면에 그려진 함수의 그래프를 보고, 확대하면 작은 픽셀들로 그림이 그려지는 것을 확인하였다. 곡선을 그리는 픽셀들을 보고, 픽셀의 개수를 셈으로써 곡선의 길이, 그리고 곡선으로 둘러싸인 영역의 넓이를 구할 수 있는지 궁금하였다.

    픽셀들을 더 작게 하여 촘촘하게 하면서, 해당되는 픽셀의 개수와 픽셀의 넓이의 곱, 또는 해당되는 픽셀의 개수와 픽셀의 한 변의 길이의 곱 등의 극한을 취하면 영역의 넓이 또는 곡선의 길이와 관련이 있으리라 예상하였고, 아래 (나)와 같은 설정으로 시작하여 수식으로 확인하고자 하였다.

    [그림: 모눈 위에 구간 $[a,b]$에서 정의된 곡선 $y=f(x)$(올라갔다 내려갔다 다시 조금 올라가는 모양)가 그려져 있고, 곡선이 지나는 칸은 진한 회색, 곡선 아래와 $x$축 사이의 칸은 연한 회색으로 칠해져 있다. 범례: 진한 칸의 개수 : $s(n)$, 연한 칸의 개수 : $t(n)$]
- label: 나
  body: |
    자연수 $n$에 대해, 좌표평면을 한 변의 길이가 $\dfrac1n$인 정사각형으로 이루어진 모눈종이(격자)로 생각하자. 이때 $x$축과 $y$축을 모눈의 경계선 중에 포함한다. 여기에서는, 각 정사각형 영역은 옆쪽과 아래쪽 경계선은 포함하고 위쪽 경계선은 포함하지 않는다고 하자(밑줄 원문). 또한, 정사각형 영역이 곡선의 점을 하나라도 포함하는 경우 그 곡선을 만난다고 하자. 구간 $[a,b]$에서 정의되는 음이 아닌 값을 갖는 연속 함수 $f(x)$에 대해, $y=f(x)$의 그래프 곡선과 만나는 정사각형들의 개수를 $s(n)$이라 하고, $x$축과 곡선 사이에서 $x$축과는 만나도 되지만 그래프 곡선과는 만나지 않는 정사각형들의 개수를 $t(n)$이라 하자. 단, $a,b$는 정수만 고려하고, 구간 $[a,b]$를 넘어서는 정사각형은 고려하지 않는다.

    예를 들어, 아래의 그림과 같이 구간 $[0,1]$에서의 함수 $f(x)=x$에 대해, $s(2)=4$, $t(2)=1$이고, $s(3)=6$, $t(3)=3$이다.

    [그림: 왼쪽은 $n=2$인 모눈($y$축 눈금 $\tfrac12,1,\tfrac32,2$)에 $y=x$를 그리고 만나는 칸 4개를 진하게, 아래 칸 1개를 연하게 칠한 그림. 오른쪽은 $n=3$인 모눈($y$축 눈금 $\tfrac13,\cdots,2$)에 만나는 칸 6개를 진하게, 아래 칸 3개를 연하게 칠한 그림]

stem: |
  제시문 (가), (나)를 읽고 다음 물음에 답하시오. [편집 주: 원문에는 별도의 공통 발문이 없다]

subparts:
- id: '1'
  stem: |
    실수 $c$에 대해 가우스 기호 $[c]$는 $c$를 넘지 않는 최대 정수를 나타낸다. 즉 $c$에 대해 $m\le c<m+1$인 정수 $m$이 $[c]$의 값이다. 임의의 실수 $c$에 대해, 분모가 자연수 $n$이고 분자가 정수인 분수 중에서 $c$를 넘지 않는 가장 큰 분수를 가우스 기호를 이용하여 표시하시오.
  points: 2
  depends_on: []
  answer: {kind: expression, value: 'floor(n*c)/n', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\tfrac mn\le c<\tfrac{m+1}{n}\iff m\le nc<m+1$.
    steps:
    - {id: 1a, content: '$m=[nc]$, 구하는 분수는 $\tfrac{[nc]}{n}$', criteria: ['1.R1', '1.B1']}
    hint_ladder:
    - 구하는 분수를 $\tfrac mn$이라 두고 $c$와의 대소 관계를 부등식으로 써 보라.
  - id: S1-B
    audience: B
    source_flow: G23_seoul_am.pdf p.14
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\dfrac mn$이 문제에서 구하는 분수라면 $\dfrac mn\le c<\dfrac{m+1}{n}$이다. 즉, $m\le nc<m+1$이므로
      criteria: ['1.R1']
    - id: 1b-2
      content: |
        $m=[nc]$이고, $\dfrac mn=\dfrac{[nc]}{n}$이 된다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: |
        답 $\dfrac{[nc]}{n}$을 적었다(설명 없이 맞는 답만 있으면 이 1점만).
      steps: [1b-2, 1a]
    - id: 1.R1
      mark_type: R
      points: 1
      evidence: |
        $\dfrac mn\le c<\dfrac{m+1}{n}$에서 $m\le nc<m+1$로 바꾸어 가우스 기호의 정의로 $m=[nc]$임을 설명했다.
      depends_on: []
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    닫힌 구간 $[a,b]$를 길이 $\dfrac1n$인 구간들로 분할하였을 때, $k$번째 구간에서의 $f(x)$의 최솟값을 $m_k$, 최댓값을 $M_k$라 하자. $s(n)$과 $t(n)$의 식을 가우스 기호와 $\sum$ 기호를 이용하여 나타내시오.
  points: 7
  depends_on: ['1']
  answer: {kind: expression, value: 's = Sum(floor(n*M(k)) - floor(n*m(k)) + 1, (k, 1, n*(b - a))); t = Sum(floor(n*m(k)), (k, 1, n*(b - a)))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $k$번째 열에서 만나는 칸의 밑변 높이는 $\tfrac{[nm_k]}{n}$부터 $\tfrac{[nM_k]}{n}$까지.
    steps:
    - {id: 2a, content: '$s(n)=\displaystyle\sum_{k=1}^{n(b-a)}([nM_k]-[nm_k]+1)$, $t(n)=\displaystyle\sum_{k=1}^{n(b-a)}[nm_k]$', criteria: ['2.B1', '2.B2']}
    hint_ladder:
    - 한 열(소구간) 안에서 그래프가 지나는 높이의 범위는 $[m_k,M_k]$이다.
  - id: S2-B
    audience: B
    source_flow: G23_seoul_am.pdf p.14
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        줄간격이 $\dfrac1n$인 모눈종이에 함수의 그래프를 그렸다고 생각하자. $x$축상의 두 점 $a,b$ 사이에는 길이 $\dfrac1n$인 작은 구간이 $n(b-a)$개 있다.
      criteria: ['2.B1', '2.B2']
    - id: 2b-2
      content: |
        $k$번째 소구간 위쪽의 정사각형 중 그래프와 만나는 가장 아래쪽의 정사각형은 (1)에 의해 밑변의 높이($y$좌표)가 $\dfrac{[nm_k]}{n}$이고, 가장 위쪽의 정사각형은 밑변의 높이가 $\dfrac{[nM_k]}{n}$이 되어 그래프와 만나는 정사각형의 개수는 $[nM_k]-[nm_k]+1$이다.
      criteria: ['2.B1']
    - id: 2b-3
      content: |
        $k$번째 소구간 위쪽의 정사각형들 중 그래프와 만나지 않고 그 아래쪽에 있는 것들은 밑변의 높이가 $\dfrac{[nm_k]}{n}$인 정사각형 아래쪽의 정사각형들이므로 개수는 $[nm_k]$이다.
      criteria: ['2.B2']
    - id: 2b-4
      content: |
        따라서 $s(n)=\displaystyle\sum_{k=1}^{n(b-a)}([nM_k]-[nm_k]+1)$, $t(n)=\displaystyle\sum_{k=1}^{n(b-a)}[nm_k]$이다.
      criteria: ['2.B1', '2.B2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 4
      evidence: |
        $s(n)=\displaystyle\sum_{k=1}^{n(b-a)}([nM_k]-[nm_k]+1)$을 정확히 구했다.
      steps: [2b-1, 2b-2, 2b-4, 2a]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: |
        $t(n)=\displaystyle\sum_{k=1}^{n(b-a)}[nm_k]$을 정확히 구했다.
      steps: [2b-1, 2b-3, 2b-4, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    구간 $[0,3]$에서 정의된 함수 $f(x)$의 식이 다음과 같다고 한다.
    $$f(x)=\begin{cases}2x & (0\le x<1)\\ -\dfrac12(x-1)+2=-\dfrac x2+\dfrac52 & (1\le x\le3)\end{cases}$$
    [그림: $(0,0)$에서 $(1,2)$까지 올라가는 선분과 $(1,2)$에서 $(3,1)$까지 내려가는 선분으로 이루어진 꺾은선 그래프]

    주어진 $f(x)$에 대하여 $s(n)$와 $t(n)$을 자연수 $n$에 관한 다항식으로 나타내시오.
  points: 7
  depends_on: ['2']
  answer: {kind: expression, value: 's = 6*n; t = 4*n**2 - 2*n', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 증가 구간은 $[nM_k]-[nm_k]=2$, 감소 구간은 망원 합, $t$는 같은 값이 두 번씩 나타남을 이용한다.
    steps:
    - {id: 3a, content: '$s(n)=3n+n+2n=6n$, $t(n)=(n^2-n)+(3n^2-n)=4n^2-2n$', criteria: ['3.B1', '3.B2']}
    hint_ladder:
    - $1\le k\le n$에서 $M_k=\tfrac{2k}{n}$, $m_k=\tfrac{2(k-1)}{n}$이다.
    - $n+1\le k\le3n$에서 $[nM_k]=\left[\tfrac{-k+1+5n}{2}\right]$, $[nm_k]=\left[\tfrac{-k+5n}{2}\right]$이다.
  - id: S3-B
    audience: B
    source_flow: G23_seoul_am.pdf p.14-15
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        소구간에서 증가하는 함수는 최솟값을 왼쪽 끝점에서, 최댓값을 오른쪽 끝점에서 가진다(감소할 때는 반대). $k$번째 소구간은 $\left[\dfrac{k-1}{n},\dfrac kn\right]$ $(k=1,2,\cdots,3n)$이므로
        $$M_k=\begin{cases}\dfrac{2k}{n} & 1\le k\le n\\ -\dfrac{k-1}{2n}+\dfrac52 & n+1\le k\le3n\end{cases},\quad [nM_k]=\begin{cases}2k & 1\le k\le n\\ \left[\dfrac{-k+1+5n}{2}\right] & n+1\le k\le3n\end{cases}$$
        $$m_k=\begin{cases}\dfrac{2(k-1)}{n} & 1\le k\le n\\ -\dfrac{k}{2n}+\dfrac52 & n+1\le k\le3n\end{cases},\quad [nm_k]=\begin{cases}2(k-1) & 1\le k\le n\\ \left[\dfrac{-k+5n}{2}\right] & n+1\le k\le3n\end{cases}$$
      criteria: ['3.B1', '3.B2']
    - id: 3b-2
      content: |
        (2)에 의해
        $$s(n)=\sum_{k=1}^{3n}([nM_k]-[nm_k]+1)=\sum_{k=1}^{n}3+\sum_{k=n+1}^{3n}\left(\left[\frac{-k+1+5n}{2}\right]-\left[\frac{-k+5n}{2}\right]\right)+\sum_{k=n+1}^{3n}1$$
        이다. $\sum_{k=1}^{n}3=3n$, $\sum_{k=n+1}^{3n}1=2n$이고, 가운데 합은
        $$\left(\left[\tfrac{4n}{2}\right]-\left[\tfrac{4n-1}{2}\right]\right)+\left(\left[\tfrac{4n-1}{2}\right]-\left[\tfrac{4n-2}{2}\right]\right)+\cdots+\left(\left[\tfrac{2n+1}{2}\right]-\left[\tfrac{2n}{2}\right]\right)=\left[\tfrac{4n}{2}\right]-\left[\tfrac{2n}{2}\right]=2n-n=n$$
        이다(중간의 항들은 연이은 두 항씩 서로 상쇄되어 첫 항과 마지막 항만 남는다). 따라서 $s(n)=6n$이다.
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        마찬가지로 (2)에 의해 $t(n)=\displaystyle\sum_{k=1}^{3n}[nm_k]=\sum_{k=1}^{n}2(k-1)+\sum_{k=n+1}^{3n}\left[\frac{-k+5n}{2}\right]$이다.
        $$\sum_{k=n+1}^{3n}\left[\frac{-k+5n}{2}\right]=\left[\tfrac{4n-1}{2}\right]+\left[\tfrac{4n-2}{2}\right]+\cdots+\left[\tfrac{2n}{2}\right]=(2n-1)+(2n-1)+(2n-2)+(2n-2)+\cdots+n=\sum_{k=1}^{n}2(2n-k)$$
        (항은 $2n$개이며 가우스 기호 안의 값은 $\tfrac12$씩 줄어들어 $2n-1,2n-2,\cdots,n$이 연달아 두 번씩 나타난다.)
      criteria: ['3.B2']
    - id: 3b-4
      content: |
        $\sum_{k=1}^{n}2(k-1)=n(n+1)-2n=n^2-n$이고, $\sum_{k=1}^{n}2(2n-k)=4n^2-n(n+1)=3n^2-n$이므로, 정리하면 $t(n)=4n^2-2n$이다.
      criteria: ['3.B2']
