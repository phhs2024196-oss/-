intent: |
  $\Sigma$의 뜻을 알고, 그 성질을 이해하고 이를 활용할 수 있는지 평가한다.
  수열의 극한에 대한 성질을 이해하고, 극한값을 구할 수 있는지 평가한다.
  정적분과 급수의 합 사이의 관계를 이해하는지 평가한다.
key_idea: |
  $k$번째 소구간 위에서 그래프와 만나는 정사각형은 밑변 높이가 $\tfrac{[nm_k]}{n}$부터 $\tfrac{[nM_k]}{n}$까지이므로 $s(n)=\sum([nM_k]-[nm_k]+1)$, $t(n)=\sum[nm_k]$이고, 가우스 기호 합은 망원(상쇄)·짝짓기로 계산한다.
stuck: |
  "$c$를 넘지 않는 가장 큰 분모 $n$ 분수"를 $\tfrac{[nc]}{n}$로 표현해 칸의 개수를 가우스 기호로 세는 것, 그리고 $\sum[\tfrac{-k+5n}{2}]$처럼 반정수가 섞인 가우스 기호 합을 두 항씩 묶어 계산하는 것
