      points: 1
      evidence: |
        넓이(값 $4$와 비교 또는 정적분과 급수의 합의 관계)를 근거로 넓이와 같은 것이 $\displaystyle\lim_{n\to\infty}\frac{t(n)}{n^2}$임을 설명했다.
      depends_on: []
      steps: [4b-2, 4a]
    - id: 4.R2
      mark_type: R
      points: 1
      evidence: |
        그래프의 길이 $2\sqrt5$를 제시하고 $\displaystyle\lim_{n\to\infty}\frac{s(n)}{n}=6$과 같지 않음을 설명했다.
      depends_on: []
      steps: [4b-3, 4a]
