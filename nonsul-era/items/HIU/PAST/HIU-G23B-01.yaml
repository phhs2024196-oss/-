intent: |
  실생활에서 고등학교 수학 교육과정에서 배운 개념들을 활용하여 주어진 조건에서 해를 찾는 문제에 적용하고 해결할 수 있는지를 평가한다. 또한, 좌표평면과 벡터의 성질을 이해하고 활용할 수 있는지 평가한다.
  (1) 위치벡터의 개념을 이해하고 평면벡터와 좌표의 대응을 활용할 수 있는지 평가한다.
  (2) 평면벡터의 크기와 좌표상의 거리의 개념, 원의 성질을 활용하여 문제의 조건에 맞는 함수를 찾을 수 있는지 평가한다.
  (3) 이차함수의 최솟값을 구할 수 있는지 평가한다.
key_idea: |
  점에서 원까지의 최단 거리는 $\lvert\,\lvert\vec{x_i}-\vec c\rvert-r\rvert$이므로 $S_n$은 $r$에 대한 이차함수가 되어 $r=\dfrac1n\sum\lvert\vec{x_i}-\vec c\rvert$(거리의 평균)에서 최소이고, $M_4$는 가장 가까운 거리와 가장 먼 거리의 평균에서 최소이다.
stuck: |
  점과 원 사이 최단 거리를 중심까지의 거리와 반지름의 차로 바꾸는 것, (2)에서 최댓값 함수 $M_4$가 $d_2$, $d_3$ 두 개만으로 결정됨을 파악하는 것
