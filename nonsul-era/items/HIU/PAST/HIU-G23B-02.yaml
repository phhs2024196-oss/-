stimuli: []

stem: |
  홍익이는 낙하산을 이용하여 우주발사체의 추진체를 재활용하는 기술을 접하였고, 머리와 추진체로 분리되는 물 로켓을 만들고 추진체를 재활용하고자 추진체에 낙하산을 설치하였다. 그리고 $t=0$초에서 물 로켓을 지면으로부터 수직 방향으로 발사하였다. 시각 $t$에서의 지면으로부터 물 로켓 추진체 밑면의 높이를 $y_1(t)$ m, 물 로켓 머리의 높이를 $y_2(t)$ m라 하자. <그림 1>과 같이 발사 후 $t=6$까지 물 로켓은 머리와 추진체가 같이 움직이고, $t=6$에서 물 분사를 멈추고 머리와 추진체로 분리된다. <그림 2>와 같이 추진체는 $t=9$에서 최고 높이에 도달하고 낙하산이 펴진다. 낙하산에 의하여 $t=12$까지 추진체의 속도가 시간에 따라 변한다. 그 후 착륙할 때까지의 속도는 일정하다. $t=t_2$에서 추진체는 지면에 착륙한다. <그림 3>과 같이 물 로켓 머리의 속도는 $t=6$ 이후 일정하다가 $t=t_1$에서 예상치 못한 돌풍이 발생하여 시간에 따라 변한다. 이를 정리하면, 시각 $t$에서의 물 로켓 추진체의 속도 $v_1(t)$ m/s와 물 로켓 머리의 속도 $v_2(t)$ m/s는 다음과 같다. (단, $y_1(0)=0$, $y_2(0)=10$ 이다.)
  $$v_1(t)=\begin{cases}20t-\dfrac52t^2 & (0\le t<6)\\ 90-10t & (6\le t<9)\\ -10+\dfrac{10}{27}(12-t)^3 & (9\le t<12)\\ -10 & (12\le t\le t_2)\end{cases}$$
  $$v_2(t)=\begin{cases}20t-\dfrac52t^2 & (0\le t<6)\\ 30 & (6\le t<t_1)\\ \dfrac{30}{t_2-t_1}(t_2-t) & (t_1\le t\le t_2)\end{cases}$$

  [그림 1: $t=0$에 높이 10 m인 물 로켓이 지면에서 발사되어 $t=6$에 머리와 추진체가 함께 상승한 모습. 세로축 높이 $y_1,y_2$ (m)]
  [그림 2: $t=9$에 추진체가 최고 높이에서 낙하산을 펴고, $t=t_2$에 지면에 착륙한 모습. 세로축 높이 $y_1$ (m)]
  [그림 3: 머리가 $t=t_1$에 돌풍(바람 그림)을 만나고 $t=t_2$에 높이 910 m에 있는 모습. 세로축 높이 $y_2$ (m)]
subparts:
- id: '1'
  stem: |
    $t=6$에서 물 로켓이 머리와 추진체로 분리될 때, 머리의 높이 $y_2(6)$의 값을 구하시오.
  points: 4
  depends_on: []
  answer: {kind: value, value: '190', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $y_2(6)=10+\int_0^6v_2\,dt$.
    steps:
    - {id: 1a, content: '$10+\left[10t^2-\tfrac56t^3\right]_0^6=190$', criteria: ['1.B1']}
    hint_ladder:
    - 높이는 처음 높이에 속도의 정적분을 더한 것이다.
  - id: S1-B
    audience: B
    source_flow: G23_seoul_pm.pdf p.9
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\dfrac{dy_2}{dt}=v_2$이므로 $y_2(6)=y_2(0)+\displaystyle\int_0^6v_2(t)dt=10+\int_0^6\left(20t-\frac52t^2\right)dt=10+\left[10t^2-\frac56t^3\right]_0^6=10+360-180=190$ m
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: |
        정적분을 활용하여 $y_2(6)=10+\displaystyle\int_0^6\left(20t-\tfrac52t^2\right)dt$의 식을 세우고 값 $190$을 계산했다.
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $t=12$에서 추진체 밑면의 높이 $y_1(12)$의 값을 구하시오.
  points: 4
  depends_on: []
  answer: {kind: value, value: '405/2', equivalents: ['202.5'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 세 구간으로 나누어 적분한다.
    steps:
    - {id: 2a, content: '$180+45-\tfrac{45}{2}=\tfrac{405}{2}$', criteria: ['2.B1']}
    hint_ladder:
    - $[0,6]$, $[6,9]$, $[9,12]$로 나누어 적분하라.
  - id: S2-B
    audience: B
    source_flow: G23_seoul_pm.pdf p.9
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        마찬가지로 $\dfrac{dy_1}{dt}=v_1$이므로
        $$y_1(12)=y_1(0)+\int_0^{12}v_1(t)dt=\int_0^6\left(20t-\frac52t^2\right)dt+\int_6^9(90-10t)dt+\int_9^{12}\left\{-10+\frac{10}{27}(12-t)^3\right\}dt$$
        $$=\left[10t^2-\frac56t^3\right]_0^6+\left[90t-5t^2\right]_6^9+\left[-10t-\frac5{54}(12-t)^4\right]_9^{12}$$
        $$=(360-180)+\{(810-405)-(540-180)\}+\left\{(-120-0)-\left(-90-\frac{15}{2}\right)\right\}=\frac{405}{2}\ \mathrm{m}$$
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 4
      evidence: |
        정적분을 활용하여 $y_1(12)$의 식을 구간별로 세우고 값 $\dfrac{405}{2}$를 계산했다.
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    추진체가 착륙한 시각 $t=t_2$에서 머리의 높이가 $y_2(t_2)=910$ m일 때, 돌풍이 발생한 시각 $t_1$을 구하시오.
  points: 12
  depends_on: ['1', '2']
  answer: {kind: value, value: '111/4', equivalents: ['27.75'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $y_1(t_2)=0\Rightarrow t_2=\tfrac{129}{4}$, $y_2(t_2)=10+15t_1+15t_2=910$.
    steps:
    - {id: 3a, content: '$t_2=12+\tfrac{405}{20}=\tfrac{129}{4}$, $t_1=60-t_2=\tfrac{111}{4}$', criteria: ['3.B1', '3.B2']}
    hint_ladder:
    - 착륙했다는 것은 $y_1(t_2)=0$이라는 뜻이다.
  - id: S3-B
    audience: B
    source_flow: G23_seoul_pm.pdf p.9
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $12\le t\le t_2$에서 $v_1(t)=-10$이고 문항 (2)에서 $y_1(12)=\dfrac{405}{2}$이므로 $y_1(t_2)=0$인 시간 $t_2$는 $0=y_1(t_2)=y_1(12)+\displaystyle\int_{12}^{t_2}v_1(t)dt=\frac{405}{2}-10(t_2-12)$로부터 $t_2=12+\dfrac{405}{20}=\dfrac{129}{4}$이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        문항 (1)에서 $y_2(6)=190$이고 주어진 조건에 의해 $y_2(t_2)=910$이므로
        $$910=y_2(t_2)=y_2(6)+\int_6^{t_1}v_2(t)dt+\int_{t_1}^{t_2}v_2(t)dt=190+\int_6^{t_1}30\,dt+\int_{t_1}^{t_2}\frac{30}{t_2-t_1}(t_2-t)dt$$
        $$=190+30(t_1-6)+\left[-\frac{15}{t_2-t_1}(t_2-t)^2\right]_{t_1}^{t_2}=190+30(t_1-6)+\frac{15}{t_2-t_1}(t_2-t_1)^2=10+15t_1+15t_2$$
      criteria: ['3.B2']
    - id: 3b-3
      content: |
        로부터 $t_1=\dfrac{900}{15}-t_2=60-\dfrac{129}{4}=\dfrac{111}{4}$이다.
      criteria: ['3.B2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 6
      evidence: |
        정적분을 활용하여 $y_1(t_2)$를 구하고, $y_1(t_2)=0$으로부터 $t_2=\dfrac{129}{4}$를 구했다.
      ft: {allowed: true, from: [2.B1], max_points: 6}
      steps: [3b-1, 3a]
    - id: 3.B2
      mark_type: B
      points: 6
      evidence: |
        정적분을 활용하여 $y_2(t_2)=10+15t_1+15t_2$를 구하고, $y_2(t_2)=910$으로부터 $t_1=\dfrac{111}{4}$를 구했다.
      ft: {allowed: true, from: [1.B1], max_points: 6}
      steps: [3b-2, 3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

