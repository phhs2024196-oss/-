intent: |
  우주발사체의 재활용 기술이 주목받는 가운데, 학생들이 관심을 가질 수 있는 대상 중 수학적 해석이 가능한 대상을 문제의 배경으로 삼았다. 정적분을 활용하여 속도와 거리에 대한 문제를 해결할 수 있는지 평가한다.
  (1) 속도와 거리에 대한 관계를 이해하고 정적분을 활용하여 속도가 주어졌을 때 거리를 구할 수 있는지 평가한다.
  (2) 구간을 나누어 함수를 적분할 수 있는지 평가한다.
  (3) 속도와 거리의 상호 관계를 이해하는지 평가한다. 주어진 조건으로부터 식을 구하고 해를 찾아낼 수 있는지 평가한다.
key_idea: |
  $y(t)=y(0)+\int_0^t v(s)\,ds$를 구간별로 적분하고, 착륙 조건 $y_1(t_2)=0$으로 $t_2$를, $y_2(t_2)=910$으로 $t_1$을 구한다.
stuck: |
  미지의 $t_1$, $t_2$가 속도식 안에 들어 있는 구간별 적분을 정리하는 것($\int_{t_1}^{t_2}\tfrac{30}{t_2-t_1}(t_2-t)dt=15(t_2-t_1)$)
