intent: |
  독립시행의 확률을 계산할 수 있는지 평가한다. 로그함수와 합성함수의 도함수를 구할 수 있는지 평가한다. 도함수를 이용하여 함수의 증가, 감소를 파악하고 부등식에 활용할 수 있는지 평가한다. 수열의 극한을 구하고 이를 활용할 수 있는지 평가한다.
key_idea: |
  $\mathrm{P}(A_n)=\left(1-\tfrac1n\right)^n=f(n)$이고 $\tfrac{d}{dx}\ln f(x)=-\ln\tfrac{x}{x-1}+\tfrac1{x-1}>0$($\ln u<u-1$)이므로 $\mathrm{P}(A_n)$은 증가하며 극한 $\tfrac1e<\tfrac12$이므로 모든 항이 $\tfrac12$보다 작다.
stuck: |
  (4)에서 $\ln u<u-1$을 $u=\tfrac{x}{x-1}$에 적용하는 것, (5)에서 증가수열과 극한 $\tfrac1e$를 결합해 귀류로 $\mathrm{P}(A_n)<\tfrac12$을 보이는 것
