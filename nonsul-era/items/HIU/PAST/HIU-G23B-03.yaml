stimuli:
- label: 가
  body: |
    홍익이는 등교하기 위하여 집 앞 버스 정류장에서 매일 아침 8시 정각부터 학교 버스를 기다리기 시작한다. 홍익이가 타려는 학교 버스는 매일 아침 8시부터 9시까지 한 시간 동안 임의의 시각에 무작위로 한 번 정류장에 도착한다. 자연수 $n$에 대하여 홍익이가 $n$일 동안 등교한다고 할 때, $n$일 동안 하루도 빠짐없이 $\dfrac1n$시간보다 긴 시간 동안 홍익이가 버스를 기다리는 사건을 $A_n$이라고 하자.

    [그림 1: 8시부터 9시까지의 수직선을 앞쪽 $\tfrac1n$시간과 뒤쪽 $\left(1-\tfrac1n\right)$시간으로 나눈 그림]
- label: 나
  body: |
    로그함수 $y=\ln x$는 다음 성질을 만족한다.
    (a) 함수 $y=\ln x$는 무리수 $e$를 밑으로 하는 로그함수이며, $e=2.718\cdots$임이 알려져 있다.
    (b) 로그함수 $y=\ln x$는 구간 $(0,\infty)$에서 증가한다.
    (c) $1$이 아닌 양의 실수 $x$에 대하여 부등식 $\ln x<x-1$이 성립한다.

    [그림 2: 직선 $y=x-1$과 곡선 $y=\ln x$가 점 $(1,0)$에서 접하고 곡선이 직선 아래에 있는 그림]

stem: |
  제시문 (가), (나)를 읽고 다음 물음에 답하시오. [편집 주: 원문에는 별도의 공통 발문이 없다]

subparts:
- id: '1'
  stem: |
    사건 $A_1$과 $A_2$가 일어날 확률 $\mathrm{P}(A_1)$과 $\mathrm{P}(A_2)$를 각각 구하시오.
  points: 2
  depends_on: []
  answer: {kind: value, value: 'P(A1) = 0; P(A2) = 1/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 하루에 $\tfrac1n$시간보다 오래 기다릴 확률은 $1-\tfrac1n$.
    steps:
    - {id: 1a, content: '$\mathrm{P}(A_1)=0$, $\mathrm{P}(A_2)=\tfrac12\cdot\tfrac12=\tfrac14$', criteria: ['1.B1', '1.B2']}
    hint_ladder:
    - 버스는 반드시 9시 전에 온다.
  - id: S1-B
    audience: B
    source_flow: G23_seoul_pm.pdf p.14
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        학교 버스는 8시와 9시 사이에 도착하므로, $n=1$일 때 홍익이가 $\dfrac1n=1$시간보다 더 기다리는 사건 $A_1$이 일어날 확률은 $\mathrm{P}(A_1)=0$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $n=2$일 때 첫날, 둘째날 각각 홍익이가 $\dfrac1n=\dfrac12$시간보다 더 기다리는 사건의 확률은 각각 $\dfrac12$이고, 두 사건은 서로 독립이므로 $\mathrm{P}(A_2)=\dfrac12\cdot\dfrac12=\dfrac14$이다.
      criteria: ['1.B2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: |
        확률 $\mathrm{P}(A_1)=0$을 구했다.
      steps: [1b-1, 1a]
    - id: 1.B2
      mark_type: B
      points: 1
      evidence: |
        확률 $\mathrm{P}(A_2)=\dfrac14$을 구했다.
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    사건 $A_n$이 일어날 확률 $\mathrm{P}(A_n)$을 구하시오.
  points: 2
  depends_on: ['1']
  answer: {kind: expression, value: '(1 - 1/n)**n', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 독립시행.
    steps:
    - {id: 2a, content: '$\mathrm{P}(A_n)=\left(1-\tfrac1n\right)^n$', criteria: ['2.B1']}
    hint_ladder:
    - 하루의 확률을 구하고 $n$일이 독립임을 이용하라.
  - id: S2-B
    audience: B
    source_flow: G23_seoul_pm.pdf p.14
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        임의의 등교일에 홍익이가 $\dfrac1n$시간보다 긴 시간 동안 버스를 기다리는 사건의 확률은 $1-\dfrac1n$이고, 각각의 등교일의 이 사건은 서로 독립이다. 따라서 독립시행의 확률에 따라 $\mathrm{P}(A_n)=\left(1-\dfrac1n\right)^n$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        확률 $\mathrm{P}(A_n)=\left(1-\dfrac1n\right)^n$을 구했다.
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    정의역이 $\{x\mid x>1\}$인 함수 $f(x)=\left(1-\dfrac1x\right)^x$에 대하여 $\dfrac{d}{dx}\ln f(x)$를 구하시오.
  points: 2
  depends_on: []
  answer: {kind: expression, value: 'log(1 - 1/x) + 1/(x - 1)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\ln f(x)=x\ln\left(1-\tfrac1x\right)$을 곱의 미분·합성함수 미분.
    steps:
    - {id: 3a, content: '$\ln\left(1-\tfrac1x\right)+\tfrac1{x-1}$', criteria: ['3.B1']}
    hint_ladder:
    - 먼저 로그를 풀어 $x\ln(\cdots)$ 꼴로 만들라.
  - id: S3-B
    audience: B
    source_flow: G23_seoul_pm.pdf p.14
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\ln f(x)=x\ln\left(1-\dfrac1x\right)$이다. 따라서
        $$\frac{d}{dx}\ln f(x)=\ln\left(1-\frac1x\right)+x\cdot\frac{x}{x-1}\cdot\frac1{x^2}=\ln\left(1-\frac1x\right)+\frac1{x-1}$$
        을 얻는다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        로그함수와 합성함수의 미분법으로 $\ln\left(1-\dfrac1x\right)+\dfrac1{x-1}$을 구했다.
      steps: [3b-1, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    제시문의 (나)와 문항 (3)의 결과를 이용하여 모든 자연수 $n$에 대하여 $\mathrm{P}(A_{n+1})>\mathrm{P}(A_n)$임을 보이시오.
  points: 7
  depends_on: ['1', '2', '3']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $\ln\tfrac{x}{x-1}<\tfrac{1}{x-1}$이므로 $(\ln f)'>0$, $f$ 증가, $\mathrm{P}(A_n)=f(n)$ $(n\ge2)$.
    steps:
    - {id: 4a, content: '$(\ln f)^\prime=-\ln\tfrac{x}{x-1}+\tfrac1{x-1}>0$ $\Rightarrow$ $f$ 증가; $\mathrm{P}(A_1)<\mathrm{P}(A_2)$는 (1)로', criteria: ['4.R1', '4.R2']}
    hint_ladder:
    - $\ln\left(1-\tfrac1x\right)=-\ln\tfrac{x}{x-1}$로 쓰고 (나)의 (c)를 적용하라.
    - $n=1$은 따로 확인해야 한다.
  - id: S4-B
    audience: B
    source_flow: G23_seoul_pm.pdf p.14
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        모든 실수 $x>1$에 대하여 $\dfrac{x}{x-1}>1$을 만족하므로, 제시문 (나)의 (c)를 활용하면 $\ln\left(\dfrac{x}{x-1}\right)<\dfrac{x}{x-1}-1=\dfrac1{x-1}$이다.
      criteria: ['4.R1']
    - id: 4b-2
      content: |
        위의 부등식과 문항 (3)의 결과로부터 $\dfrac{d}{dx}\ln f(x)=\ln\left(\dfrac{x-1}{x}\right)+\dfrac1{x-1}=-\ln\left(\dfrac{x}{x-1}\right)+\dfrac1{x-1}>0$이다. 즉, 함수 $\ln f(x)$는 구간 $(1,\infty)$에서 증가하는 함수이다. 따라서 제시문 (나)의 로그함수의 성질 (b)를 활용하여 함수 $f(x)$도 구간 $(1,\infty)$에서 증가하는 함수임을 알 수 있다.
      criteria: ['4.R1']
    - id: 4b-3
      content: |
        문항 (1)의 결과로부터 $\mathrm{P}(A_1)=0$, $\mathrm{P}(A_2)=\dfrac14$이므로 $\mathrm{P}(A_1)<\mathrm{P}(A_2)$이다. 또한, $1$보다 큰 자연수 $n$에 대하여 확률 $\mathrm{P}(A_n)$은 함숫값 $f(n)$과 같고, 함수 $f(x)$가 구간 $(1,\infty)$에서 증가하는 함수이므로 $\mathrm{P}(A_{n+1})>\mathrm{P}(A_n)$이다. 따라서 모든 자연수 $n$에 대하여 $\mathrm{P}(A_{n+1})>\mathrm{P}(A_n)$이다.
      criteria: ['4.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.R1
      mark_type: R
      points: 5
      evidence: |
        (나)의 (c)로 $\ln\dfrac{x}{x-1}<\dfrac1{x-1}$을 얻어 $\dfrac{d}{dx}\ln f(x)>0$을 보이고, (b)로 $f(x)$가 $(1,\infty)$에서 증가함을 보였다.
      depends_on: []
      steps: [4b-1, 4b-2, 4a]
    - id: 4.R2
      mark_type: R
      points: 2
      evidence: |
        $\mathrm{P}(A_n)=f(n)$ $(n\ge2)$과 $\mathrm{P}(A_1)<\mathrm{P}(A_2)$를 이용하여 모든 자연수 $n$에 대해 $\mathrm{P}(A_{n+1})>\mathrm{P}(A_n)$을 보였다.
      depends_on: [4.R1]
      steps: [4b-3, 4a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '5'
  stem: |
    홍익이가 $n$일 동안 적어도 한 번 이상 $\dfrac1n$시간보다 짧은 시간 동안 버스를 기다리는 사건을 $B_n$이라고 하자. 사건 $B_n$이 일어날 확률을 $\mathrm{P}(B_n)$이라고 할 때, 모든 자연수 $n$에 대하여 $\mathrm{P}(B_n)>\dfrac12$임을 보이시오.
  points: 7
  depends_on: ['2', '4']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S5-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}(B_n)=1-\mathrm{P}(A_n)$, $\mathrm{P}(A_n)\nearrow\tfrac1e<\tfrac12$.
    steps:
    - {id: 5a, content: '$\lim\mathrm{P}(A_n)=\tfrac1e$, 증가수열이므로 $\mathrm{P}(A_n)<\tfrac1e<\tfrac12$', criteria: ['5.R1', '5.B1', '5.R2']}
    hint_ladder:
    - $B_n$은 $A_n$과 어떤 관계인가?
    - 증가하는 수열의 각 항과 극한값의 대소를 생각하라.
  - id: S5-B
    audience: B
    source_flow: G23_seoul_pm.pdf p.14-15
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        사건 $B_n$은 사건 $A_n$의 여사건이므로 $\mathrm{P}(B_n)=1-\mathrm{P}(A_n)$이다. 따라서 $\mathrm{P}(A_n)<\dfrac12$이면 $\mathrm{P}(B_n)>\dfrac12$이므로, 모든 자연수 $n$에 대하여 $\mathrm{P}(A_n)<\dfrac12$임을 보이면 충분하다.
      criteria: ['5.R1']
    - id: 5b-2
      content: |
        수열 $\{\mathrm{P}(A_n)\}$의 극한값은
        $$\lim_{n\to\infty}\mathrm{P}(A_n)=\lim_{n\to\infty}\left(1-\frac1n\right)^n=\lim_{x\to0+}(1-x)^{\frac1x}=\lim_{x\to0-}(1+x)^{-\frac1x}=\lim_{x\to0}\frac{1}{(1+x)^{\frac1x}}=\frac1e$$
        이다.
      criteria: ['5.B1']
    - id: 5b-3
      content: |
