stimuli: []

stem: |
  두 양수 $a,b$에 대하여 $\log_3(2a+b)=2$, $\log_3a+\log_3b=1$일 때, $4a^2+b^2$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    두 양수 $a,b$에 대하여 $\log_3(2a+b)=2$, $\log_3a+\log_3b=1$일 때, $4a^2+b^2$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '69', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 로그 조건을 지수로 바꾸면 $2a+b=9$, $ab=3$이고 $4a^2+b^2=(2a+b)^2-4ab=69$이다.
    steps:
    - {id: 1a, content: '$2a+b=9$, $ab=3\Rightarrow4a^2+b^2=81-12=69$', criteria: ['1.M1', '1.M2', '1.M3', '1.A1']}
    hint_ladder:
    - 로그의 합을 하나의 로그로 묶어 보자.
    - $4a^2+b^2$을 $2a+b$와 $ab$로 나타낼 수 있는가?
  - id: S1-B
    audience: B
    source_flow: G23_sejong.pdf p.2
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\log_3(2a+b)=2$에서 $2a+b=3^2=9$이다.
      criteria: ['1.M2']
    - id: 1b-2
      content: |
        $\log_3a+\log_3b=1$에서 $\log_3ab=1$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $\log_3ab=1$에서 $ab=3$이므로
      criteria: ['1.M3']
    - id: 1b-4
      content: |
        $4a^2+b^2=(2a+b)^2-4ab$이므로 $4a^2+b^2=(2a+b)^2-4ab=81-12=69$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    source_flow: G23_sejong.pdf p.3 (풀이법 2)
    method_no: 2
    key_idea: 원 해설 풀이법 2 — $2a+b=9$, $ab=3$을 연립하여 $a$, $b$를 직접 구한다.
    steps:
    - id: 1c-1
      content: |
        $2a+b=9$, $ab=3$을 연립하여 $a,b$를 각각 구하면 $a=\dfrac{9\pm\sqrt{57}}{4}$, $b=\dfrac{9\mp\sqrt{57}}{2}$이므로 $4a^2+b^2=69$
      criteria: ['1.A1']
  - id: S1-ALT2
    audience: ALT
    source_flow: G23_sejong.pdf p.3 (풀이법 3)
    method_no: 3
    key_idea: 원 해설 풀이법 3 — $2a$, $b$를 두 근으로 하는 이차방정식 $x^2-9x+6=0$을 이용한다.
    steps:
    - id: 1d-1
      content: |
        $2a+b=9$, $ab=3$에서 $2a,b$를 근으로 하는 이차방정식은 $x^2-9x+6=0$임을 이용하여 $a,b$를 구한다. (근과 계수의 관계로 $(2a)^2+b^2=9^2-2\cdot6=69$)
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $\log_3a+\log_3b=1$에서 로그의 합을 곱으로 변환하여 $\log_3ab=1$을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $\log_3(2a+b)=2$를 지수의 형태로 변형하여 $2a+b=9$를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: |
        $\log_3ab=1$을 지수의 형태로 변형하여 $ab=3$을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        구해진 조건들을 이용하여 $4a^2+b^2=69$를 구했다.
      depends_on: [1.M2, 1.M3]
      steps: [1b-4, 1c-1, 1d-1]
    deductions: []
