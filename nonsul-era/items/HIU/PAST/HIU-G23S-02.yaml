stimuli: []

stem: |
  방정식 $x^3+3x^2-1+a=0$이 서로 다른 세 실근을 갖도록 하는 실수 $a$의 값의 범위를 구하시오.

subparts:
- id: '1'
  stem: |
    방정식 $x^3+3x^2-1+a=0$이 서로 다른 세 실근을 갖도록 하는 실수 $a$의 값의 범위를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '-3 < a < 1', equivalents: ['(-3, 1)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=x^3+3x^2-1$의 극댓값 $f(-2)=3$, 극솟값 $f(0)=-1$이므로 $-1<-a<3$.
    steps:
    - {id: 1a, content: '$-1<-a<3\iff-3<a<1$', criteria: ['1.M1', '1.A1', '1.A2', '1.M2', '1.A3']}
    hint_ladder:
    - $a$를 우변으로 넘겨 곡선과 수평선의 교점으로 생각해 보자.
  - id: S1-B
    audience: B
    source_flow: G23_sejong.pdf p.5
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^3+3x^2-1$, $g(x)=-a$라고 놓자.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f^{\prime}(x)=3x^2+6x=3x(x+2)$이므로 $x=0$ 또는 $x=-2$에서 $f^{\prime}(x)=0$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        함수의 증가와 감소를 표로 나타내면 다음과 같다.
        [표: $x<-2$에서 $f^{\prime}(x)>0$ 증가, $x=-2$에서 $f^{\prime}=0$·$f=3$, $-2<x<0$에서 $f^{\prime}<0$ 감소, $x=0$에서 $f^{\prime}=0$·$f=-1$, $x>0$에서 $f^{\prime}>0$ 증가]
        함수 $f(x)$는 $x=-2$에서 극댓값 $3$을 갖고 $x=0$에서 극솟값 $-1$을 갖는다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $y=f(x)$와 $y=-a$의 교점의 개수가 실근의 개수이므로 곡선 $y=f(x)$와 직선 $y=-a$가 서로 다른 세 실근을 가지려면 교점의 개수가 세 개가 되어야 한다. 그러므로, 상수 $-a$의 값의 범위는 $-1<-a<3$이다.
      criteria: ['1.M2']
    - id: 1b-5
      content: |
        따라서 $-3<a<1$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        미지수 $a$를 제외한 함수 $f(x)=x^3+3x^2-1$을 정의했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        도함수 $f^{\prime}(x)=3x(x+2)$를 구하고 $f^{\prime}(x)=0$의 해 $x=0,-2$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        증감표로 $f(x)$의 증가·감소(극댓값 $3$, 극솟값 $-1$)를 이용하여 그래프 개형을 확인했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        두 그래프의 교점이 실근임을 이용하여 서로 다른 세 근을 갖는 $-a$의 범위 $-1<-a<3$을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        (4)에서 구한 부등식으로부터 $-3<a<1$을 적었다.
      depends_on: [1.M2]
      steps: [1b-5]
    deductions: []
