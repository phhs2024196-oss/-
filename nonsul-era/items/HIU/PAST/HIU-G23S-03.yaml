stimuli: []

stem: |
  함수 $f(x)=\begin{cases}-3x+2 & (x<0)\\ 3x+2 & (x\ge0)\end{cases}$ 에 대하여 함수 $g(x)$를
  $g(x)=\displaystyle\int_{-1}^{x}tf(t)dt$ 라 할 때, $g(-2)$, $g(3)$ 값을 각각 구하시오.

subparts:
- id: '1'
  stem: |
    함수 $f(x)=\begin{cases}-3x+2 & (x<0)\\ 3x+2 & (x\ge0)\end{cases}$ 에 대하여 함수 $g(x)$를 $g(x)=\displaystyle\int_{-1}^{x}tf(t)dt$ 라 할 때, $g(-2)$, $g(3)$ 값을 각각 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'g(-2)=10; g(3)=34', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(-2)=-\int_{-2}^{-1}(-3t^2+2t)dt=10$, $g(3)=\int_{-1}^{0}(-3t^2+2t)dt+\int_0^3(3t^2+2t)dt=-2+36=34$.
    steps:
    - {id: 1a, content: '$g(-2)=10$, $g(3)=-2+36=34$', criteria: ['1.M1', '1.A1', '1.M2', '1.M3', '1.A2']}
    hint_ladder:
    - $x=-2$이면 적분의 위끝이 아래끝보다 작다.
    - $x=3$이면 적분 구간 안에서 $f$의 식이 바뀌는 점이 있다.
  - id: S1-B
    audience: B
    source_flow: G23_sejong.pdf p.7
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g(-2)=\displaystyle\int_{-1}^{-2}tf(t)dt=-\int_{-2}^{-1}tf(t)dt=-\int_{-2}^{-1}t(-3t+2)dt=-\int_{-2}^{-1}(-3t^2+2t)dt$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $=10$ 이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $g(3)=\displaystyle\int_{-1}^{3}tf(t)dt=\int_{-1}^{0}tf(t)dt+\int_{0}^{3}tf(t)dt$
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $=\displaystyle\int_{-1}^{0}t(-3t+2)dt+\int_{0}^{3}t(3t+2)dt=\int_{-1}^{0}(-3t^2+2t)dt+\int_{0}^{3}(3t^2+2t)dt$
        (원 예시 답안은 이 줄의 첫 적분 앞에 $-$ 부호가 붙어 있으나 오기이다. $\int_{-1}^{0}(-3t^2+2t)dt=-2$이므로 다음 줄의 $-2$와 맞으려면 부호가 없어야 한다.)
      criteria: ['1.M3']
    - id: 1b-5
      content: |
        $=-2+36=34$ 이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $g(-2)$를 계산하는 적분식(예: $-\int_{-2}^{-1}(-3t^2+2t)dt$)을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $g(-2)=10$을 옳게 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3   # 원 채점기준표는 4점이나 표 합계가 2+1+4+3+1=11 로 문항 배점 10점과 맞지 않음(원문 오류) → 1점 줄여 합 10
      evidence: |
        $g(3)$을 구할 때 $t=0$을 기준으로 적분 구간을 나누었다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: |
        $g(3)$을 계산하는 적분식 $\int_{-1}^{0}(-3t^2+2t)dt+\int_{0}^{3}(3t^2+2t)dt$를 세웠다.
      depends_on: [1.M2]
      implied_ok: false
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        $g(3)=34$를 옳게 구했다.
      depends_on: [1.M3]
      steps: [1b-5]
    deductions: []
