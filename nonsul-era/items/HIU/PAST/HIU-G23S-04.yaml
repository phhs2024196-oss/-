stimuli: []

stem: |
  $0\le\theta<2\pi$일 때, $x$에 대한 이차방정식 $2x^2+(4\sin\theta)x+(1-\cos\theta)=0$이 중근을 갖도록 하는 서로 다른 $\theta$ 값들을 모두 구하시오.

subparts:
- id: '1'
  stem: |
    $0\le\theta<2\pi$일 때, $x$에 대한 이차방정식 $2x^2+(4\sin\theta)x+(1-\cos\theta)=0$이 중근을 갖도록 하는 서로 다른 $\theta$ 값들을 모두 구하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '{0, 2*pi/3, 4*pi/3}', equivalents: ['0°, 120°, 240°'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $D/4=0$에서 $2\cos^2\theta-\cos\theta-1=0$, $\cos\theta=-\tfrac12$ 또는 $1$이므로 $\theta=0,\tfrac{2\pi}{3},\tfrac{4\pi}{3}$.
    steps:
    - {id: 1a, content: '$(2\cos\theta+1)(\cos\theta-1)=0\Rightarrow\theta=0,\tfrac{2\pi}{3},\tfrac{4\pi}{3}$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 중근을 가질 조건은 판별식으로 나타낸다.
    - $\sin^2\theta$를 $\cos\theta$로 바꾸어 보자.
  - id: S1-B
    audience: B
    source_flow: G23_sejong.pdf p.9-10
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x$에 대한 이차방정식 $2x^2+(4\sin\theta)x+(1-\cos\theta)=0$의 판별식을 $D$라 하면 이차방정식이 중근을 갖도록 하기 위해서는 $D=0$ 이어야 한다.
        즉, $D/4=(2\sin\theta)^2-2(1-\cos\theta)=0$ [또는 $D=(4\sin\theta)^2-8(1-\cos\theta)=0$] 이며 정리하면 $2\sin^2\theta+\cos\theta-1=0$ 이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\sin^2\theta=1-\cos^2\theta$을 이용하여 정리하면 $2(1-\cos^2\theta)+\cos\theta-1=0$
        즉, $2\cos^2\theta-\cos\theta-1=0$ 이다.
        이를 인수 분해하면 $(2\cos\theta+1)(\cos\theta-1)=0$이므로 $\cos\theta=-\dfrac{1}{2}$ 또는 $\cos\theta=1$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\cos\theta=-\dfrac{1}{2}$을 만족하는 $\theta$를 찾기 위해 $y=\cos\theta$와 $y=-\dfrac{1}{2}$의 교점을 구해야 하므로
        [그림 1: $0\le\theta\le2\pi$에서 $y=\cos\theta$의 그래프와 직선 $y=-\frac12$. 두 교점의 $\theta$ 좌표 $\frac{2\pi}{3}$, $\frac{4\pi}{3}$에 점선 표시]
        $0\le\theta<2\pi$에서 $\theta=\dfrac{2\pi}{3},\dfrac{4\pi}{3}$ (또는 $120^\circ$, $240^\circ$)이다.
        $\cos\theta=1$을 만족하는 $\theta$는 $0\le\theta<2\pi$에서 $\theta=0$ (또는 $0^\circ$)이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        판별식을 구하고 $D=0$ (또는 $\dfrac{D}{4}=0$)의 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        판별식을 정리하여 $\cos\theta$가 들어간 삼각방정식 $2\cos^2\theta-\cos\theta-1=0$을 구하고, $\cos\theta=-\dfrac12$ 또는 $\cos\theta=1$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $y=\cos\theta$와 $y=-\dfrac12$의 교점과 $y=\cos\theta$와 $y=1$의 교점을 이용해 $\theta=0,\dfrac{2\pi}{3},\dfrac{4\pi}{3}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
