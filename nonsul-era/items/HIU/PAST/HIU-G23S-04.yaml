intent: |
  계수가 삼각함수로 표현된 이차방정식의 근을 판별을 할 수 있는지를 확인한다. 이차방정식의 판별식이 삼각함수가 포함된 방정식일 때, 삼각함수의 그래프를 이용하여 삼각방정식을 풀 수 있는지를 확인한다.
key_idea: '$\dfrac{D}{4}=4\sin^2\theta-2(1-\cos\theta)=0$을 $\cos\theta$에 대한 이차방정식 $2\cos^2\theta-\cos\theta-1=0$으로 바꾼다.'
stuck: |
  $\sin^2\theta=1-\cos^2\theta$로 바꿔 $\cos\theta$만의 이차방정식으로 정리하는 것
