      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: |
        두 식을 적절히 정리하여 $(a_1+b_1)$항에 대한 식 $3(a_1+b_1)=24$를 얻었다.
      depends_on: [1.M2]
      implied_ok: false
