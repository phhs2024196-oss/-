stem: |
  두 등차수열 $\{a_n\}$, $\{b_n\}$에 대하여
  $a_2+b_4=11$, $a_5+b_{13}=20$일 때, $a_1+b_1$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    두 등차수열 $\{a_n\}$, $\{b_n\}$에 대하여 $a_2+b_4=11$, $a_5+b_{13}=20$일 때, $a_1+b_1$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $11=(a_1+b_1)+d_1+3d_2$, $20=(a_1+b_1)+4(d_1+3d_2)$에서 $3(a_1+b_1)=44-20=24$.
    steps:
    - {id: 1a, content: '$3(a_1+b_1)=4\cdot11-20=24\Rightarrow a_1+b_1=8$', criteria: ['1.M1', '1.M2', '1.M3', '1.A1']}
    hint_ladder:
    - 두 조건식에서 공차 부분을 비교해 보자.
  - id: S1-B
    audience: B
    source_flow: G23_sejong.pdf p.12
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_n=a_1+(n-1)d_1$, $b_n=b_1+(n-1)d_2$ 라 하자.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        그러면
        $11=a_1+d_1+b_1+3d_2=a_1+b_1+d_1+3d_2$ ……… (가)
        $20=a_1+4d_1+b_1+12d_2=a_1+b_1+4d_1+12d_2$ ……… (나) 이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        식 (가) 에 4배 한 것에서 식 (나)을 변변히 빼면
        $24=11\times4-20=3(a_1+b_1)$
      criteria: ['1.M3']
    - id: 1b-4
      content: |
        이므로 $a_1+b_1=8$ 이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
