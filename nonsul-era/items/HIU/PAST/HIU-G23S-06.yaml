stimuli: []

stem: |
  실수 $a$에 대하여 정의역이 $\{x\mid x\ge-1\}$인 함수 $f(x)=-(3^{-x}+1)^2+3^{-x+1}+2a$ 의 최댓값이 1일 때, 함수 $f(x)$의 최솟값을 구하시오.

subparts:
- id: '1'
  stem: |
    실수 $a$에 대하여 정의역이 $\{x\mid x\ge-1\}$인 함수 $f(x)=-(3^{-x}+1)^2+3^{-x+1}+2a$ 의 최댓값이 1일 때, 함수 $f(x)$의 최솟값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '-21/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t=3^{-x}\in(0,3]$에서 $f=-(t-\tfrac12)^2-\tfrac34+2a$; 최댓값 $2a-\tfrac34=1$, 최솟값 $f|_{t=3}=2a-7=-\tfrac{21}{4}$.
    steps:
    - {id: 1a, content: '$2a=\tfrac74$, 최솟값 $2a-7=-\tfrac{21}{4}$', criteria: ['1.M1', '1.M2', '1.B1', '1.A1', '1.A2']}
    hint_ladder:
    - $3^{-x+1}$을 $3^{-x}$로 나타내 보자.
    - $x\ge-1$일 때 $3^{-x}$가 가질 수 있는 값의 범위는?
  - id: S1-B
    audience: B
    source_flow: G23_sejong.pdf p.15
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $3^{-x}=t$이라 하고, $3^{-x+1}=3\cdot3^{-x}$을 이용하여
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f(x)=-(t+1)^2+3t+2a=-t^2+t-1+2a=-\left(t-\dfrac{1}{2}\right)^2-\dfrac{3}{4}+2a$로 정리할 수 있다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $x\ge-1$에서 $0<t\le3$이고,
      criteria: ['1.B1']
    - id: 1b-4
      content: |
        이 범위에서 위의 $t$에 대한 이차함수는 $t=\dfrac{1}{2}$일 때 최댓값 $2a-\dfrac{3}{4}$을 가지고 $t=3$일 때, 최솟값 $2a-7$을 가진다.
        최댓값이 1이므로 $2a=\dfrac{7}{4}$ (또는 $a=\dfrac{7}{8}$)이다.
      criteria: ['1.A1']
    - id: 1b-5
      content: |
        이를 이용하면 최솟값은 $2a-7=-\dfrac{21}{4}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        지수 연산 $3^{-x+1}=3\cdot3^{-x}$로 변형했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        $3^{-x}=t$로 치환하여(굳이 치환하지 않더라도) 주어진 함수식을 완전제곱 형태 $-\left(t-\frac12\right)^2-\frac34+2a$로 재변형했다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        $0<t\le3$의 범위를 구했다($t$의 범위에 $0$이 포함되지 않음).
      depends_on: []
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        새롭게 정의된 이차함수에서 최댓값이 1임을 이용해 $a=\dfrac78$ (또는 $2a=\dfrac74$)을 구했다.
      depends_on: [1.M2]
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $a$값을 이용하여 최솟값 $-\dfrac{21}{4}$을 구했다.
      depends_on: [1.M2, 1.B1]
      steps: [1b-5]
    deductions: []
