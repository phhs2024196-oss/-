stimuli: []

stem: |
  다음 조건을 모두 만족시키는 다항함수 $f(x)$를 구하시오.
  (가) $\displaystyle\lim_{x\to\infty}\dfrac{f(x)}{x^3-2x^2+1}=1$
  (나) $\displaystyle\lim_{x\to1}\dfrac{f^{\prime}(x)}{x-1}=6$
  (다) $f(2)=0$

subparts:
- id: '1'
  stem: |
    다음 조건을 모두 만족시키는 다항함수 $f(x)$를 구하시오.
    (가) $\displaystyle\lim_{x\to\infty}\dfrac{f(x)}{x^3-2x^2+1}=1$
    (나) $\displaystyle\lim_{x\to1}\dfrac{f^{\prime}(x)}{x-1}=6$
    (다) $f(2)=0$
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'x**3 - 3*x - 2', equivalents: ['(x+1)**2*(x-2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f^{\prime}(x)=3(x-1)(x-a)$, (나)에서 $3(1-a)=6$, $a=-1$; $f=x^3-3x+C$, $f(2)=0$에서 $C=-2$.
    steps:
    - {id: 1a, content: '$f^{\prime}(x)=3x^2-3$, $f(x)=x^3-3x-2$', criteria: ['1.R1', '1.R2', '1.A1', '1.A2']}
    hint_ladder:
    - (가)에서 $f(x)$의 차수와 최고차항의 계수를 알 수 있다.
    - 분모가 $0$으로 가는데 극한이 존재하면 분자는?
  - id: S1-B
    audience: B
    source_flow: G23_sejong.pdf p.18
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가)로부터 $f(x)$는 3차 항의 계수가 1인 3차 다항식임을 알 수 있다.
        다항식의 미분법을 이용하면 $f^{\prime}(x)$는 최고차항의 계수가 3인 2차 다항식이다.
      criteria: ['1.R1']
    - id: 1b-2
      content: |
        (나)로부터 $f^{\prime}(1)=0$이므로 $f^{\prime}(x)=3(x-1)(x-a)$라고 놓자.
      criteria: ['1.R2']
    - id: 1b-3
      content: |
        (나)로부터 $\displaystyle\lim_{x\to1}\dfrac{3(x-1)(x-a)}{x-1}=6$이므로 $3-3a=6$, 즉, $a=-1$ 이다.
        그러므로 $f^{\prime}(x)=3x^2-3$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        부정적분을 이용하여 $f(x)$를 구하면 $f(x)=\displaystyle\int(3x^2-3)dx=x^3-3x+c$이다.
        (다)를 이용하면 $f(2)=2+c=0$ 이므로, $c=-2$, 그러므로 $f(x)=x^3-3x-2$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        (가)로부터 $f^{\prime}(x)$는 최고차항의 계수가 3인 2차 다항식임을 추론했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R2
      mark_type: R
      points: 2
      evidence: |
        (나)의 극한이 존재하므로 $f^{\prime}(1)=0$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        (나)의 극한값을 이용하여 $f^{\prime}(x)=3x^2-3$을 구했다.
      depends_on: [1.R1, 1.R2]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: |
        $f^{\prime}(x)$의 부정적분을 구하고, (다)를 이용하여 $f(x)=x^3-3x-2$를 구했다.
      depends_on: [1.R1]
      steps: [1b-4]
    deductions: []
