intent: |
  고등학교 『기하』 교과서에서 다루는 이차곡선 중 하나인 타원의 정의를 숙지하고, 타원과 직선의 위치 관계에 대해 이해한다. 고등학교 『미적분』 교과서에서 다루는 음함수의 미분을 통해 미분값을 구할 수 있고, 접선의 방정식에 활용할 수 있다. 고등학교 『수학』 교과서에서 다루는 절대부등식을 활용하여 최대/최솟값을 찾을 수 있다. 이를 통해, 고등학교 과정에서 학습한 내용을 실생활 문제에 적용하여 최적의 해를 구하는 데 활용할 수 있다.
key_idea: |
  접선의 두 절편 $\dfrac{9}{x_1}$, $\dfrac{1}{y_1}$로 마름모 넓이 $\dfrac{18}{x_1y_1}$을 만들고, 타원 조건 $\dfrac{x_1^2}{9}+y_1^2=1$에 산술·기하 평균 부등식을 적용해 $x_1y_1\le\dfrac32$를 얻는다.
stuck: |
  자투리 넓이를 $x_1y_1$ 하나의 함수로 줄인 뒤, 타원 방정식의 두 항에 산술·기하 평균 부등식을 쓰는 발상
