stimuli:
- label: 가
  body: |
    $x_1>0,y_1>0$ 이며, 둘레길의 폭은 무시한다. 사각형의 네 꼭짓점은 $\mathrm{F},\mathrm{F}',\mathrm{G},\mathrm{G}'$이다.
- label: 나
  body: |
    꽃밭의 경계를 나타내는 타원의 방정식은 $\dfrac{x^2}{9}+y^2=1$ 이다. 꽃밭의 넓이는 $3\pi$ $\mathrm{m}^2$이며, 꽃밭의 경계의 폭은 무시한다.
- label: 다
  body: |
    임의의 실수 $r>0,s>0$에 대하여, $\sqrt{rs}\le\dfrac{r+s}{2}$이며 등호는 $r=s$일 때 성립한다.

stem: |
  중심이 원점 $\mathrm{O}$이고, 장축 길이가 $6$ m, 단축의 길이가 $2$ m인 타원 모양의 경계를 갖는 꽃밭이 있다. 아래 그림과 같이 타원 위의 네 개의 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(-x_1,y_1)$, $\mathrm{C}(-x_1,-y_1)$, $\mathrm{D}(x_1,-y_1)$를 선택하여 이에 외접하는 사각형 모양의 둘레길을 만들려고 한다. 사각형 내부에서 타원 내부를 제외한 나머지 부분을 자투리 공간(아래 그림의 빗금 친 부분)이라 한다. 자투리 공간의 넓이가 최소가 되도록 둘레길을 만들려고 한다.

  [그림 1: 좌표평면에 타원 $\dfrac{x^2}{9}+y^2=1$(꽃밭, $x$절편 $\pm3$, $y$절편 $\pm1$)이 그려져 있고, 타원 위의 점 $\mathrm{A}(x_1,y_1)$(제1사분면), $\mathrm{B}(-x_1,y_1)$, $\mathrm{C}(-x_1,-y_1)$, $\mathrm{D}(x_1,-y_1)$에서 타원에 접하는 네 직선이 $x$축 위의 점 $\mathrm{F}$(양), $\mathrm{F}'$(음)과 $y$축 위의 점 $\mathrm{G}$(양), $\mathrm{G}'$(음)을 꼭짓점으로 하는 마름모(둘레길)를 이룬다. 마름모 내부에서 타원 바깥 부분이 빗금 친 '자투리 공간'이다.]

subparts:
- id: '1'
  stem: |
    방정식 $\dfrac{x^2}{9}+y^2=1$에서 $\dfrac{dy}{dx}$를 구하시오.
  points: 4
  depends_on: []
  answer: {kind: expression, value: '-x/(9*y)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 양변을 $x$에 대하여 미분한다(음함수의 미분법).
    steps:
    - {id: 1a, content: '$\dfrac{2}{9}x+2y\dfrac{dy}{dx}=0\Rightarrow\dfrac{dy}{dx}=-\dfrac{x}{9y}\ (y\ne0)$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $y$를 $x$의 함수로 보고 양변을 $x$에 대하여 미분해 보자.
  - id: S1-B
    audience: B
    source_flow: G24_seoul.pdf p.45
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        음함수의 미분법을 이용하여 구할 수 있다. $\dfrac{d}{dx}\left(\dfrac{x^2}{9}\right)+\dfrac{d}{dx}(y^2)=\dfrac{d}{dx}(1)$에서 $\dfrac{2}{9}x+2y\dfrac{dy}{dx}=0$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $\dfrac{dy}{dx}=-\dfrac{x}{9y}$ (단, $y\ne0$)이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        음함수의 미분법을 활용하여 양변을 $x$에 대하여 미분한 식이 있다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        미분값 $\dfrac{dy}{dx}=-\dfrac{x}{9y}$를 정확히 계산하여 나타냈다.
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    점 $\mathrm{A}(x_1,y_1)$에서의 타원의 접선의 방정식을 $y=cx+d$이라고 하자. 문항 (1)의 결과를 이용하여, $c$를 $x_1$과 $y_1$에 대한 식으로 나타내고, $d$를 $y_1$에 대한 식으로 나타내시오. 또한, 이 접선의 $x$절편을 $x_1$에 대한 식으로 나타내시오.
  points: 4
  depends_on: ['1']
  answer: {kind: expression, value: 'c = -x1/(9*y1); d = 1/y1; xint = 9/x1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 기울기 $c=-\dfrac{x_1}{9y_1}$로 접선을 쓰고 $\dfrac{x_1^2}{9}+y_1^2=1$로 $y$절편을 정리한다.
    steps:
    - {id: 2a, content: '$y=-\dfrac{x_1}{9y_1}x+\dfrac{1}{y_1}$, $x$절편 $\dfrac{9}{x_1}$', criteria: ['2.B1', '2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - 점 $(x_1,y_1)$이 타원 위에 있다는 사실을 $y$절편 정리에 써 보자.
  - id: S2-B
    audience: B
    source_flow: G24_seoul.pdf p.45
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $(x_1,y_1)$ 위에서의 기울기는 $c=-\dfrac{x_1}{9y_1}$이 된다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        이를 접선의 방정식 $y=c(x-x_1)+y_1$에 대입하면
        $$y=-\dfrac{x_1}{9y_1}(x-x_1)+y_1=-\dfrac{x_1}{9y_1}x+\left(\dfrac{x_1^2}{9y_1}+y_1\right)\quad\cdots\cdots ①$$
        한편, $(x_1,y_1)$은 타원 위에 있는 점이므로 $\dfrac{x_1^2}{9}+y_1^2=1$을 만족한다. 이를 이용하면 $\dfrac{x_1^2}{9y_1}+y_1=\dfrac{1}{y_1}$을 얻을 수 있다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        이를 위 접선의 방정식 ①에 대입하면 $y=-\dfrac{x_1}{9y_1}x+\dfrac{1}{y_1}$이 되어, $c=-\dfrac{x_1}{9y_1}$, $d=\dfrac{1}{y_1}$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        이를 이용하면 접선의 $x$절편은 $\dfrac{9}{x_1}$가 된다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 1
      evidence: |
        $c$를 $x_1$과 $y_1$을 활용한 간소화된 식 $c=-\dfrac{x_1}{9y_1}$으로 표현했다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 1}
      steps: [2b-1, 2a]
    - id: 2.M1
      mark_type: M
      points: 1
      evidence: |
        점 $(x_1,y_1)$이 타원 위의 점이라는 조건 $\dfrac{x_1^2}{9}+y_1^2=1$을 써서 $y$절편을 정리하려 했다.
      depends_on: []
      implied_ok: true
      steps: [2b-2, 2a]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        $d$를 $y_1$을 활용한 간소화된 식 $d=\dfrac{1}{y_1}$로 표현했다.
      depends_on: [2.M1]
      steps: [2b-3, 2a]
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: |
        접선의 $x$절편을 $x_1$을 이용한 간소화된 식 $\dfrac{9}{x_1}$로 표현했다.
      depends_on: [2.M1]
      steps: [2b-4, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    자투리 공간의 넓이가 최솟값을 가질 때 $x_1$과 $y_1$을 구하고, 이때 자투리 공간의 넓이를 구하시오.
  points: 8
  depends_on: ['2']
  answer: {kind: expression, value: 'x1 = 3*sqrt(2)/2; y1 = sqrt(2)/2; area = 12 - 3*pi', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 자투리 넓이 $\dfrac{18}{x_1y_1}-3\pi$이고, $1=\dfrac{x_1^2}{9}+y_1^2\ge\dfrac{2x_1y_1}{3}$.
    steps:
    - {id: 3a, content: '$\dfrac{18}{x_1y_1}-3\pi\ge12-3\pi$, 등호는 $\dfrac{x_1^2}{9}=y_1^2=\dfrac12$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - 마름모의 두 대각선의 길이를 (2)의 절편으로 나타내 보자.
    - 제시문 (다)에서 $r=\dfrac{x_1^2}{9}$, $s=y_1^2$으로 두면?
  - id: S3-B
    audience: B
    source_flow: G24_seoul.pdf p.45-46
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        해당 둘레길이 $x$축과 만나는 점을 각각 $\mathrm{F}(a,0)$과 $\mathrm{F}'(-a,0)$라 하고, $y$축과 만나는 점을 각각 $\mathrm{G}(0,b)$과 $\mathrm{G}'(0,-b)$라 하자(단, $a>0,b>0$이다.). $a$와 $b$는 각각 (2)에서 구한 접선의 $x$절편과 $y$절편이므로 $a=\dfrac{9}{x_1}$, $b=\dfrac{1}{y_1}$임을 알 수 있다. 둘레길은 마름모 모양이며 내부의 넓이는 $2ab=\dfrac{18}{x_1y_1}$이다. 꽃밭의 넓이는 $3\pi$이므로, 자투리 공간의 넓이는 $\dfrac{18}{x_1y_1}-3\pi$가 된다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        한편, $(x_1,y_1)$은 제시된 타원 방정식 위의 점이므로 $1=\dfrac{x_1^2}{9}+y_1^2$을 만족한다. 제시문 (다)를 이용하여 아래의 부등식이 성립함을 알 수 있다.
        $$1=\dfrac{x_1^2}{9}+y_1^2\ge2\sqrt{\left(\dfrac{x_1^2}{9}\right)y_1^2}=\dfrac{2x_1y_1}{3}\ \Rightarrow\ \dfrac{1}{x_1y_1}\ge\dfrac23\ \Rightarrow\ \dfrac{18}{x_1y_1}-3\pi\ge12-3\pi$$
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        등호는 $\dfrac{x_1^2}{9}=y_1^2=\dfrac12$일 때 성립한다. 즉, 자투리 공간의 총 넓이의 최솟값은 $12-3\pi$이고, 이때 $(x_1,y_1)=\left(\dfrac{3\sqrt2}{2},\dfrac{\sqrt2}{2}\right)$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        (2)에서 구한 접선의 방정식을 활용해 자투리 공간의 넓이를 $x_1$과 $y_1$에 대한 간소화된 식 $\dfrac{18}{x_1y_1}-3\pi$로 정확히 표현했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1, 2.A2], max_points: 2}
      steps: [3b-1, 3a]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        제시문 (다)의 부등식을 활용하여 자투리 공간의 넓이의 최솟값 $12-3\pi$를 구했다.
      depends_on: [3.M1]
      implied_ok: false
      steps: [3b-2, 3a]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        자투리 공간의 넓이가 최솟값을 가질 때 $(x_1,y_1)=\left(\dfrac{3\sqrt2}{2},\dfrac{\sqrt2}{2}\right)$을 정확히 구했다.
      depends_on: [3.M2]
      steps: [3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    문항 (3)과 같이 자투리 공간의 넓이가 최솟값을 가지도록 둘레길을 설치하였다. 이후 점 $\mathrm{F}$와 $\mathrm{F}'$을 초점으로 가지고 점 $\mathrm{G}$와 $\mathrm{G}'$을 지나는 타원 모양의 울타리를 설치하려고 한다. 이 울타리를 나타내는 타원의 방정식을 구하시오. (단, 울타리의 폭은 무시한다.)
  points: 4
  depends_on: ['2', '3']
  answer: {kind: expression, value: 'x**2/20 + y**2/2 = 1', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
