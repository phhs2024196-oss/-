intent: |
  고등학교 『확률과 통계』 교과서에서 다루는 경우의 수와 확률의 의미를 이해하고 이를 활용할 수 있는지 평가한다.
  (1) 이산확률변수의 기댓값을 구할 수 있는지 평가한다.
  (2) 경우의 수로부터 확률을 구하고 그 의미를 이해하는지 평가한다.
  (3) 이항분포의 평균과 표준편차를 알고, 정규 근사하여 확률을 구할 수 있는지 평가한다.
  (4) 확률과 경우의 수를 활용하여 주어진 상황을 분석하고 논리적으로 해결할 수 있는지 평가한다.
key_idea: |
  엄마의 한 면 $n$이 이기는 경우의 수는 $n$보다 작은 상대 눈의 개수이므로, $p_1-p_2=\dfrac{1}{36}\sum(f(a_i)-g(a_i))$로 면마다 독립적인 점수의 합이 된다.
stuck: |
  $p_1-p_2$를 엄마 주사위 각 면의 기여 $f(n)-g(n)$의 합으로 분해하고, 구간별 값표로 최댓값을 찾는 발상
