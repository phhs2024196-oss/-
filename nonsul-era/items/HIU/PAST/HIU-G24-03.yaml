stimuli: []

stem: |
  홍익이는 <그림1>과 같이 반지름이 $R_0$ cm 이고 두께가 없는 구 모양의 특수 풍선을 제작하여 풍선 속에 물을 가득 담았다. 물풍선은 비어있는 원뿔 모양의 그릇(이하 원뿔그릇) 안에 놓이고, 원뿔그릇 옆면에 접한다. 이때 물풍선의 중심과 원뿔그릇 꼭짓점 사이의 거리는 $3R_0$ cm 이다. 물풍선 밑에는 작은 구멍이 있어서 풍선이 수축하며 이 구멍으로 물이 빠져나간다. $t$초 후 빠져나간 물의 부피는 $V(t)=\dfrac{\pi}{3}t$ $\mathrm{cm}^3$ 이다. 빠져나간 물은 <그림2>와 같이 원뿔그릇의 아래부터 즉시 채워지며, 물이 떨어지는 데 걸리는 시간은 무시한다. 물이 빠져나간 만큼 부피가 줄어드는 물풍선은 항상 구 모양을 유지하며 원뿔그릇 옆면에 접하고, 물풍선의 반지름은 $R$이라 한다. <그림2(a)>부터 <그림3(b)>까지에 대한 설명은 아래와 같다.

  • <그림2(a)> 시각 $t$ $(0<t<t_1)$에, 물풍선 구멍을 통해 빠져나간 물이 원뿔그릇에 고여 원뿔 모양을 이룬다.
  <그림2(b)> 시간이 지남에 따라 빠져나간 물이 이루는 원뿔의 밑면과 물풍선은 서로 접한다. <그림2(c)> 이후 물풍선의 일부가 빠져나간 물에 잠긴다. 물풍선이 빠져나간 물에 잠긴 후에도 물풍선에서 물은 계속 빠져나간다.
  • <그림3(a)> 시각 $t_1$은 빠져나간 물이 원뿔그릇과 이에 접하는 물풍선 사이의 공간을 모두 채우는 순간이다. 이때 물풍선의 반지름은 $R_1$이다.
  <그림3(b)>는 시각 $t_1$에서 물풍선이 빠져나간 물에 잠긴 부분을 나타낸다. 물풍선의 중심 $\mathrm{O}$에서 원뿔그릇의 꼭짓점을 지나는 선분 위의 한 점 $\mathrm{P}$에 대하여 $\overline{\mathrm{OP}}=x$라 하자. 이때 점 $\mathrm{P}$를 지나고 원뿔그릇의 밑면에 평행한 평면으로 물풍선을 자른 단면의 넓이를 $S(x)$라 하자.

  [그림 1: 시간축($t=0$ → $0<t<t_1$ → $t=t_1$) 아래에 다섯 개의 원뿔그릇 단면도. <그림1>: 반지름 $R_0$인 물풍선이 원뿔그릇 옆면에 접해 있고(접점에서 반지름과 옆면이 직각), 중심에서 꼭짓점까지의 거리가 $3R_0$. <그림2(a)>: 풍선이 작아지고 그릇 바닥(꼭짓점 쪽)에 작은 원뿔 모양의 물이 고임. <그림2(b)>: 물이 이루는 원뿔의 밑면이 풍선 아랫부분에 접함. <그림2(c)>: 풍선 일부가 물에 잠김. <그림3(a)>: 반지름 $R_1$인 풍선의 아랫부분이 잠기고, 물이 풍선과 그릇 사이 공간을 접점 원 높이까지 모두 채움.]
  [그림 2: <그림3(b)> 왼쪽은 시각 $t_1$에서 원뿔그릇 안의 반지름 $R_1$ 풍선으로, 접점들이 이루는 원(수평 단면) 아래의 구 부분(잠긴 부분)이 빗금으로 표시되고 중심에서 그 단면까지 수선이 그려져 있다. 오른쪽은 중심 $\mathrm{O}$에서 꼭짓점 방향으로 거리 $x$인 점 $\mathrm{P}$를 지나는 수평 단면(넓이 $S(x)$)과 반지름 $R_1$을 나타낸 그림이다.]

subparts:
- id: '1'
  stem: |
    시각 $t$에서 물풍선의 반지름 $R$을 $R_0$과 $t$에 대한 식으로 나타내시오. $(0\le t\le t_1)$
  points: 2
  depends_on: []
  answer: {kind: expression, value: 'R = (R0**3 - t/4)**(1/3)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 줄어든 구의 부피 = 빠져나간 물의 부피.
    steps:
    - {id: 1a, content: '$\dfrac43\pi(R_0^3-R^3)=\dfrac{\pi}{3}t\Rightarrow R=\left(R_0^3-\dfrac14t\right)^{\frac13}$', criteria: ['1.M1']}
    hint_ladder:
    - 풍선이 잃은 부피와 빠져나간 물의 부피는 어떤 관계인가?
  - id: S1-B
    audience: B
    source_flow: G24_seoul.pdf p.56
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        처음 물풍선의 반지름 : $R_0$
        $t$초 후, 물풍선을 빠져나간 물의 부피 : $V(t)=\dfrac{\pi}{3}t$
        물이 빠져나간 후의 물풍선의 반지름을 $R$이라 하면, 물이 빠져나가 변한 물풍선의 부피 : $V(t)=\dfrac{\pi}{3}t=\dfrac43\pi\left(R_0^3-R^3\right)$ 이므로 $R=\left(R_0^3-\dfrac14t\right)^{\frac13}$이다.
      criteria: ['1.M1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        물풍선을 빠져나가는 물의 부피를 변화율을 사용하여 $\dfrac{\pi}{3}t=\dfrac43\pi(R_0^3-R^3)$ 꼴의 수식으로 표현하고 $R=\left(R_0^3-\dfrac14t\right)^{\frac13}$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $S(x)$를 $R_1$과 $x$의 식으로 표현하시오.
  points: 4
  depends_on: []
  answer: {kind: expression, value: 'S = pi*(R1**2 - x**2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 단면 원의 반지름은 $\sqrt{R_1^2-x^2}$.
    steps:
    - {id: 2a, content: '$S(x)=\pi(R_1^2-x^2)$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 중심, 점 $\mathrm{P}$, 단면 원 위의 한 점이 이루는 직각삼각형을 보자.
  - id: S2-B
    audience: B
    source_flow: G24_seoul.pdf p.57
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        물풍선의 반지름은 $R_1$이고, $\overline{\mathrm{OP}}=x$이므로 피타고라스의 정리를 이용하면 단면인 원의 반지름은 $\sqrt{(R_1^2-x^2)}$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서, 원의 넓이는 $S(x)=\pi(R_1^2-x^2)$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        단면에 만들어지는 원의 반지름이 $\sqrt{(R_1^2-x^2)}$와 같음을 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        $S(x)=\pi(R_1^2-x^2)$을 나타냈다.
      depends_on: [2.M1]
      steps: [2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    시각 $t_1$에서 빠져나간 물에 잠긴 물풍선 부분의 부피를 $R_1$에 대한 식으로 나타내시오.
  points: 6
  depends_on: ['2']
  answer: {kind: expression, value: '28*pi*R1**3/81', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 반꼭지각 $\sin\alpha=\dfrac13$이므로 접점 원은 중심에서 $\dfrac{R_1}{3}$ 아래, 잠긴 부분은 $\dfrac{R_1}{3}\le x\le R_1$.
    steps:
    - {id: 3a, content: '$\displaystyle\int_{R_1/3}^{R_1}\pi(R_1^2-x^2)dx=\dfrac{28}{81}\pi R_1^3$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 중심, 접점, 꼭짓점이 이루는 직각삼각형과 중심, 접점, 접점 원의 중심이 이루는 직각삼각형은 닮음이다.
  - id: S3-B
    audience: B
    source_flow: G24_seoul.pdf p.57
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        삼각형 닮음을 이용하면 $x$가 $\dfrac13R_1$부터 $R_1$까지의 변화에 대해 넓이 $S(x)$를 적분한 값이 된다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $$\int_{\frac{R_1}{3}}^{R_1}\pi(R_1^2-x^2)dx=\pi\left[R_1^2x-\dfrac13x^3\right]_{\frac{R_1}{3}}^{R_1}=\pi\left[R_1^3-\dfrac{R_1^3}{3}-\dfrac{R_1^3}{3}+\dfrac{R_1^3}{81}\right]=\dfrac{28}{81}\pi R_1^3$$
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        문항 (2)에서 사용한 넓이 구하는 공식 $S(x)=\pi(R_1^2-x^2)$을 사용하고, 범위를 정확히 $\dfrac13R_1$에서부터 $R_1$이라고 표현했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 3}
      steps: [3b-1, 3a]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        적분을 계산하여 정확하게 답 $\dfrac{28}{81}\pi R_1^3$을 도출했다.
      depends_on: [3.M1]
      steps: [3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    $R_0=5$일 때, 시각 $t_1$를 구하시오.
  points: 8
  depends_on: ['1', '3']
  answer: {kind: value, value: '125', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 빠져나간 물 $=\dfrac{64}{81}\pi R_1^3-\dfrac{28}{81}\pi R_1^3=\dfrac49\pi R_1^3$이 풍선 부피 감소량과 같다.
    steps:
    - {id: 4a, content: '$\dfrac43\pi(R_0^3-R_1^3)=\dfrac49\pi R_1^3\Rightarrow\Delta V=\dfrac13\pi R_0^3=\dfrac{\pi}{3}t_1\Rightarrow t_1=R_0^3=125$', criteria: ['4.M1', '4.M2', '4.A1']}
    hint_ladder:
    - 시각 $t_1$에 물이 채운 공간은 (원뿔) − (잠긴 구 부분)이다.
  - id: S4-B
    audience: B
    source_flow: G24_seoul.pdf p.57-58
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        시각 $t_1$에서 물에 잠기지 않은 물풍선의 부피와 접선이 이루는 면을 밑면으로 하는 원뿔의 부피의 합은 시각 $0$초에서 물풍선의 부피와 같아야 한다. 각각을 다음과 같이 구한다.
        (가) 시각 $0$초에서 물풍선의 부피 : $\dfrac43\pi R_0^3$
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        (나) 빠져나간 물의 부피:
        $$\Delta V=\pi\left(\dfrac{2\sqrt2}{3}R_1\right)^2\times\dfrac83R_1\times\dfrac13-\dfrac{28}{81}\pi R_1^3=\dfrac{64}{81}\pi R_1^3-\dfrac{28}{81}\pi R_1^3=\dfrac{36}{81}\pi R_1^3,$$
        즉, $R_1^3=\dfrac{81}{36\pi}\Delta V$ (원문은 $R_2^3$으로 표기 — 오기)
      criteria: ['4.M1']
    - id: 4b-3
      content: |
        (다) 작아진 풍선의 부피 $\Delta V=\dfrac43\pi R_0^3-\dfrac43\pi R_1^3$
        $$\Rightarrow\Delta V=\dfrac43\pi R_0^3-\dfrac43\pi\left(\dfrac{81}{36\pi}\Delta V\right)\Rightarrow\Delta V=\dfrac13\pi R_0^3$$
      criteria: ['4.M2']
    - id: 4b-4
      content: |
        따라서, $\Delta V=\dfrac{\pi}{3}t_1=\dfrac13\pi R_0^3$. $R_0=5$ 이므로, $t_1=\dfrac{3}{\pi}\cdot\dfrac13\pi R_0^3=5^3=125$, $t_1$은 $125$ 초
      criteria: ['4.A1']
