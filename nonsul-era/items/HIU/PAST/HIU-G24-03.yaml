intent: |
  고등학교 『수학』, 『수학 Ⅰ』, 『미적분』 교과서에서 다루는 개념들을 종합적으로 활용하여 주어진 조건에서 해를 찾는 문제에 적용하고 해결할 수 있는지를 평가한다. 또한, 원의 면적을 구하는 식을 이용하여 구와 원뿔 부피를 구하는 것을 이해하고 활용할 수 있는지 평가한다.
  (1) 시간에 따른 변화량을 이해하고 구의 적분 부피의 변화량과의 관계를 식으로 만들어 낼 수 있는지를 평가한다.
  (2) 원뿔과 원의 특징을 이해하여 닮음 삼각형을 적용하여 길이를 유추하고, 그 관계를 이용하여 원의 넓이에 대한 수식을 만들 수 있는지를 평가한다.
  (3) 원의 넓이를 구하는 식을 단면의 적분 공식에 적용하여 구하고자 하는 구간의 부피를 구할 수 있는지를 평가한다.
  (4) 앞서 구한 부피와 닮은 삼각형을 이용하여 필요한 부피들을 할 수 있는지 평가한다. 또한, 제시문에 주어진 시간에 따른 변화량과 부피의 관계를 통해 시간개념을 이해하고 있는지를 평가한다.
key_idea: |
  물풍선은 항상 옆면에 접하고 중심-꼭짓점 거리가 $3R$이므로 원뿔의 반꼭지각 $\alpha$는 $\sin\alpha=\dfrac13$으로 일정하다. 접점이 이루는 원은 중심에서 $\dfrac{R}{3}$ 아래에 있고, 빠져나간 물의 부피 = (접점 원까지의 원뿔 부피) − (잠긴 구 부분 부피).
stuck: |
  접점 원의 높이($\dfrac{R_1}{3}$, 꼭짓점에서 $\dfrac83R_1$)와 그 반지름 $\dfrac{2\sqrt2}{3}R_1$을 닮음으로 찾고, 부피 보존식을 세우는 단계
