stimuli: []

stem: |
  모든 항이 양수인 등비수열 $\{a_n\}$이 $a_3=45$, $a_8=9a_6$을 만족시킬 때, $\{a_n\}$의 첫째항부터 제$n$항까지의 합 $S_n$을 구하시오.

subparts:
- id: '1'
  stem: |
    모든 항이 양수인 등비수열 $\{a_n\}$이 $a_3=45$, $a_8=9a_6$을 만족시킬 때, $\{a_n\}$의 첫째항부터 제$n$항까지의 합 $S_n$을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '5*(3**n - 1)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $r^2=9$, $r>0$에서 $r=3$, $a=5$이고 $S_n=\dfrac52(3^n-1)$.
    steps:
    - {id: 1a, content: '$r=3$, $a=5$, $S_n=\dfrac{5}{2}(3^n-1)$', criteria: ['1.B1', '1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $a_8$과 $a_6$의 비는 공비의 몇 제곱인가?
  - id: S1-B
    audience: B
    source_flow: G24_sejong.pdf p.2
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        등비수열 $\{a_n\}$의 일반항을 $a_n=ar^{n-1}$이라고 하자.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $a_3=ar^2=45$, $a_8=9a_6$은 $ar^7=9ar^5$이다. 모든 항이 양수이므로 $a>0,r>0$이다. $ar^7=9ar^5$에 의하여 $r^2=9$이고, $r>0$이므로 $r=3$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $ar^2=9a=45$, $a=5$이므로, 일반항 $a_n$은 $a_n=5\times3^{n-1}$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        등비수열의 합 공식에 의해 수열의 합 $S_n$은 $S_n=a\dfrac{r^n-1}{r-1}=5\dfrac{3^n-1}{3-1}=\dfrac52(3^n-1)$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: |
        등비수열 $\{a_n\}$의 일반항을 $a_n=ar^{n-1}$으로 표시했다.
      depends_on: []
      steps: [1b-1, 1a]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        공비 $r=3$을 구했다. ($r>0$ 또는 모든 항이 양수임을 언급하지 않으면 1점 감점)
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1a]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        등비수열의 일반항 $a_n=5\times3^{n-1}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-3, 1a]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        등비수열의 합 $S_n=\dfrac52(3^n-1)$을 구했다.
      depends_on: [1.M1]
      steps: [1b-4, 1a]
    deductions:
