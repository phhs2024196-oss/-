stimuli: []

stem: |
  $\tan\theta<0$, $\cos\theta=-\dfrac35$일 때, $\sin\theta+\dfrac{1}{\tan\theta}$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    $\tan\theta<0$, $\cos\theta=-\dfrac35$일 때, $\sin\theta+\dfrac{1}{\tan\theta}$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1/20', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\sin\theta=\cos\theta\tan\theta>0$이므로 $\sin\theta=\dfrac45$, $\tan\theta=-\dfrac43$.
    steps:
    - {id: 1a, content: '$\dfrac45-\dfrac34=\dfrac{1}{20}$', criteria: ['1.M1', '1.A1', '1.A2', '1.A3']}
    hint_ladder:
    - $\tan\theta$와 $\cos\theta$가 모두 음수인 사분면은 어디인가?
  - id: S2-B
    audience: B
    source_flow: G24_sejong.pdf p.4
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (삼각함수는 주기함수이므로 $0\le\theta<2\pi$에서만 고려하면 충분하다.)
        $0\le\theta<2\pi$일 때 $\tan\theta<0$인 $\theta$의 범위는 $\dfrac{\pi}{2}<\theta<\pi$ (제2사분면) 또는 $\dfrac{3\pi}{2}<\theta<2\pi$ (제4사분면)이다. 한편, $\cos\theta<0$인 $\theta$의 범위는 $\dfrac{\pi}{2}<\theta<\dfrac{3\pi}{2}$(제2사분면, 제3사분면)이므로, 공통범위는 $\dfrac{\pi}{2}<\theta<\pi$ (제2사분면)이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\sin^2\theta=1-\cos^2\theta=1-\dfrac{9}{25}=\dfrac{16}{25}$이고, $\dfrac{\pi}{2}<\theta<\pi$에서 $\sin\theta>0$이므로, $\sin\theta=\dfrac45$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        이때, $\tan\theta=\dfrac{\sin\theta}{\cos\theta}=-\dfrac43$이다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        그러므로 $\sin\theta+\dfrac{1}{\tan\theta}=\dfrac45-\dfrac34=\dfrac{1}{20}$이다.
      criteria: ['1.A3']
  - id: S2-ALT
    audience: ALT
    source_flow: G24_sejong.pdf p.4-5 (다른 풀이)
    method_no: 2
    key_idea: 원 해설 다른 풀이 — 부호는 $\sin\theta=\cos\theta\tan\theta>0$으로, 절댓값은 세 변이 $3,4,5$인 직각삼각형으로 구한다.
    steps:
    - id: 1c-1
      content: |
        (다른 풀이, $\sin\theta$의 부호) $\tan\theta<0$이고 $\cos\theta<0$이므로 $\sin\theta=\cos\theta\tan\theta>0$이다.
      criteria: ['1.M1']
    - id: 1c-2
      content: |
        (삼각함수의 절댓값 계산의 다른 풀이, 삼각형 이용) 부호는 위 방식으로 구하고, 삼각함수의 절댓값은 삼각형을 이용하여 구할 수도 있다. [그림: 각 $\theta$를 낀 밑변 $3$, 높이 $4$, 빗변 $5$인 직각삼각형] 따라서 $\sin\theta=\dfrac45$, $\tan\theta=-\dfrac43$이다.
      criteria: ['1.A1', '1.A2']
