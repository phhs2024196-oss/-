stimuli: []

stem: |
  세 함수 $f(x)=3^x$, $g(x)=\left(\dfrac13\right)^{x-1}+2$, $h(x)=9^x+b$의 그래프가 모두 한 점에서 만날 때, 상수 $b$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    세 함수 $f(x)=3^x$, $g(x)=\left(\dfrac13\right)^{x-1}+2$, $h(x)=9^x+b$의 그래프가 모두 한 점에서 만날 때, 상수 $b$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-6', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f=g$에서 $3^x=3$, 교점 $(1,3)$을 $h$에 대입한다.
    steps:
    - {id: 1a, content: '$(3^x+1)(3^x-3)=0\Rightarrow x=1$, $3=9+b\Rightarrow b=-6$', criteria: ['1.M1', '1.M2', '1.A1', '1.A2', '1.A3']}
    hint_ladder:
    - $\left(\dfrac13\right)^{x-1}$을 밑이 $3$인 거듭제곱으로 바꿔 보자.
  - id: S3-B
    audience: B
    source_flow: G24_sejong.pdf p.7-8
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 함수 $f(x)=3^x$, $g(x)=\left(\dfrac13\right)^{x-1}+2$의 그래프의 교점을 구하기 위해 두 식을 연립하면 $3^x=\left(\dfrac13\right)^{x-1}+2$,
      criteria: ['1.M2']
    - id: 1b-2
      content: |
        즉 $3^x=3\times\dfrac{1}{3^x}+2$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        양변에 $3^x$을 곱하고 정리하면 $(3^x)^2-2(3^x)-3=0$이다. 인수분해하면 $(3^x+1)(3^x-3)=0$이므로 $3^x=3$ 또는 $3^x=-1$이다. $3^x>0$이므로 $3^x=-1$은 성립하지 않는다. 그러므로 $3^x=3$이고 $x=1$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $x=1$을 $f(x)$ 또는 $g(x)$에 대입하면 $f(1)=3$, $g(1)=3$이다. 그러므로 두 그래프의 교점은 $(1,3)$이다.
      criteria: ['1.A2']
    - id: 1b-5
      content: |
        함수 $h(x)=9^x+b$의 그래프가 교점 $(1,3)$을 지나므로 이를 대입하면 $3=9+b$이다. 그러므로 $b=-6$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        지수의 성질을 이용하여 $\left(\dfrac13\right)^{x-1}$을 $\dfrac{3}{3^x}$ 또는 $3^{1-x}$으로 변형했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1a]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $f(x)$, $g(x)$를 연립하여 지수가 포함된 방정식을 만들었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        지수가 포함된 방정식의 해 $x=1$을 구했다($3^x=-1$ 제외).
      depends_on: [1.M1, 1.M2]
      steps: [1b-3, 1a]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        해를 이용하여 교점 $(1,3)$을 구했다.
      depends_on: [1.M2]
      steps: [1b-4, 1a]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        교점을 $h(x)=9^x+b$에 대입하여 $b=-6$을 구했다.
      depends_on: [1.M2]
      steps: [1b-5, 1a]
    deductions: []
