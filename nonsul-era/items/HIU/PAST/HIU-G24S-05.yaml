      depends_on: [1.M1]
      steps: [1b-3, 1a]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        $h(t)=\dfrac12(t^4+20t^2+100)$의 식을 구했다.
      depends_on: [1.M1]
      steps: [1b-4, 1a]
    - id: 1.A4
      mark_type: A
      points: 2
      evidence: |
        $h'(1)=22$의 값을 구했다.
      depends_on: [1.M1]
      steps: [1b-5, 1a]
    deductions: []
