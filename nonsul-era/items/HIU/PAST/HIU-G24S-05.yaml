stimuli: []

stem: |
  곡선 $y=10-x^2$ 위의 점 $(t,10-t^2)$에서의 접선의 $x$절편을 $f(t)$, $y$절편을 $g(t)$라 하자. 함수 $h(t)=tf(t)g(t)$에 대하여 $h'(1)$을 구하시오. (단, $t>0$)

subparts:
- id: '1'
  stem: |
    곡선 $y=10-x^2$ 위의 점 $(t,10-t^2)$에서의 접선의 $x$절편을 $f(t)$, $y$절편을 $g(t)$라 하자. 함수 $h(t)=tf(t)g(t)$에 대하여 $h'(1)$을 구하시오. (단, $t>0$)
  points: 10
  depends_on: []
  answer: {kind: value, value: '22', equivalents: [], tolerance: null}
  solutions:
  - id: S5-A
    audience: A
    method_no: 1
    key_idea: $h(t)=\dfrac12(t^4+20t^2+100)$, $h'(t)=2t^3+20t$.
    steps:
    - {id: 1a, content: '$h''(1)=2+20=22$', criteria: ['1.M1', '1.A1', '1.A2', '1.A3', '1.A4']}
    hint_ladder:
    - 접선의 방정식을 먼저 쓰고 $y=0$, $x=0$을 대입해 보자.
  - id: S5-B
    audience: B
    source_flow: G24_sejong.pdf p.13
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=10-x^2$의 점 $(t,10-t^2)$에서의 접선의 기울기는 $-2t$이므로, 곡선 위의 점 $(t,10-t^2)$에서의 곡선의 접선의 방정식은 $y=-2t(x-t)+10-t^2=-2tx+10+t^2$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        접선의 $x$절편은 $0=-2tx+10+t^2$으로부터 $x=\dfrac{10+t^2}{2t}$ $(t>0)$이므로 $f(t)=\dfrac{10+t^2}{2t}$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $y$절편은 $10+t^2$이므로 $g(t)=10+t^2$이다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        따라서 $h(t)=tf(t)g(t)=\dfrac12(10+t^2)(10+t^2)=\dfrac12(t^4+20t^2+100)$이다.
      criteria: ['1.A3']
    - id: 1b-5
      content: |
        그러므로, $h'(t)=2t^3+20t$이고, $h'(1)=22$이다.
      criteria: ['1.A4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
