stem: |
  $x$에 대한 방정식 $x^2-x\log_3(9k)+\log_3(k^2)=0$의 두 실근 $\alpha,\beta$가 양수이고 $\alpha^2+\beta^2=13$을 만족시킬 때, $k$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    $x$에 대한 방정식 $x^2-x\log_3(9k)+\log_3(k^2)=0$의 두 실근 $\alpha,\beta$가 양수이고 $\alpha^2+\beta^2=13$을 만족시킬 때, $k$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '27', equivalents: [], tolerance: null}
  solutions:
  - id: S6-A
    audience: A
    method_no: 1
    key_idea: 두 근은 $2$와 $\log_3k$이므로 $4+(\log_3k)^2=13$, 양수 조건으로 $\log_3k=3$.
    steps:
    - {id: 1a, content: '$\log_3k=3\Rightarrow k=27$', criteria: ['1.M1', '1.M2', '1.A1', '1.A2']}
    hint_ladder:
    - $\log_3(9k)$와 $\log_3(k^2)$을 $\log_3k$로 나타내 보자.
  - id: S6-B
    audience: B
    source_flow: G24_sejong.pdf p.15 (풀이 1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        방정식 $x^2-x\log_39k+\log_3k^2=0$의 두 실근 $\alpha,\beta$는 이차방정식의 근과 계수의 관계에 의하여 $\alpha+\beta=\log_39k=\log_39+\log_3k=2+\log_3k$,
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\alpha\beta=\log_3k^2=2\log_3k$를 만족한다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\alpha^2+\beta^2=(\alpha+\beta)^2-2\alpha\beta=(2+\log_3k)^2-2(2\log_3k)=13$이므로 $(\log_3k)^2-9=(\log_3k-3)(\log_3k+3)=0$이다. 한편, 두 실근은 양수이므로 $\alpha+\beta=2+\log_3k>0$, $\alpha\beta=2\log_3k>0$이어야 한다. 그러므로 $\log_3k=-3$은 가능하지 않고, $\log_3k=3$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        즉 $k=3^3=27$이다.
      criteria: ['1.A2']
  - id: S6-ALT
    audience: ALT
    source_flow: G24_sejong.pdf p.16 (풀이 2, 별첨)
    method_no: 2
    key_idea: 원 해설 풀이 2 — 인수분해 $(x-2)(x-\log_3k)=0$로 두 근을 직접 구한다.
    steps:
    - id: 1c-1
      content: |
        $x^2-x\log_39k+\log_3k^2=0$은 $x^2-(2+\log_3k)x+2\log_3k=0$으로 표현되고 인수분해 또는 근의 공식에 의해 두 실근 $\alpha,\beta$를 구하면 $2,\log_3k$이다.
        (별첨) 인수분해: $(x-2)(x-\log_3k)=0$
        근의 공식: $x=\dfrac{2+\log_3k\pm\sqrt{(2+\log_3k)^2-8\log_3k}}{2}=\dfrac{2+\log_3k\pm(2-\log_3k)}{2}=\begin{cases}2\\\log_3k\end{cases}$
      criteria: ['1.M1', '1.M2']
    - id: 1c-2
      content: |
        두 양의 실근 $\alpha,\beta$는 $\alpha^2+\beta^2=13$을 만족하고, 두 근 중 한 근이 $2$이므로 나머지 한 근은 $3$이다. 따라서 $\log_3k=3$이다. 그러므로 $k=3^3=27$이다.
      criteria: ['1.A1', '1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\log_39k=2+\log_3k$로 변형했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1, 1a]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $\log_3k^2=2\log_3k$로 변형했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1c-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: |
        $\alpha^2+\beta^2=13$을 이용하여 $\log_3k=3$의 값을 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3, 1c-2, 1a]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\log_3k=3$으로부터 $k=27$의 값을 구했다.
      depends_on: [1.M1]
      steps: [1b-4, 1c-2, 1a]
    deductions: []
