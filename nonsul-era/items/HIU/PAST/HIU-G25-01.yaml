    - 가장 안쪽 $f(3)$부터 차례로 계산해 보자.
  - id: S2-B
    audience: B
    source_flow: G25_seoul.pdf p.52(인쇄 쪽 79) 예시 답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(3)=f(f(f(3)))=f(f(2^3))=f(f(8))=f(2^8)=f(256)$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $f(256)=2^{256}$이므로 $m=256$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
