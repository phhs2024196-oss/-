- id: '3'
  stem: |
    $g(3)$과 "구골"($10^{100}$) 중 더 큰 수는 무엇인지 고르고 그 이유를 설명하시오.
  points: 6
  depends_on: ['2']
  answer: {kind: choice, value: '구골', equivalents: ['10**100 > g(3)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $5>2^2$이므로 $10^{100}=2^{100}5^{100}>2^{300}>2^{256}$.
    steps:
    - {id: 3a, content: '$10^{100}>2^{300}>2^{256}=g(3)$', criteria: ['3.M1', '3.R1']}
    hint_ladder:
    - $10=2\times5$로 나누고 $5$를 2의 거듭제곱과 비교해 보자.
  - id: S3-B
    audience: B
    source_flow: G25_seoul.pdf p.53(인쇄 쪽 80) 예시 답안
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2)에서 $g(3)=2^{256}$이므로 $2^{256}$과 $10^{100}$의 크기를 비교하면 된다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $10^{100}=2^{100}5^{100}>2^{100}(2^2)^{100}=2^{300}>2^{256}$이므로 $10^{100}>g(3)$이다. 따라서 "구골"이 더 크다.
      criteria: ['3.R1']
  - id: S3-ALT
    audience: ALT
    source_flow: G25_seoul.pdf p.52 채점 기준(로그 근사 인정)
    method_no: 2
    key_idea: 채점 기준이 인정하는 방법 — 양변에 상용로그를 취하면 $\log g(3)=256\log2\approx77.06<100=\log10^{100}$.
    steps:
    - id: 3c-1
      content: |
        $\log2\approx0.3010$이므로 $\log 2^{256}=256\log2\approx77.06<100$, 따라서 $2^{256}<10^{100}$.
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 1
      evidence: |
        $2^{256}$과 $10^{100}$의 크기를 비교하는 문제임을 서술함.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 1}
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 5
      evidence: |
        지수법칙을 바르게 사용하여 $10^{100}>2^{256}$의 결론을 얻음(양변에 로그를 취하고 $\log2$의 근삿값을 이용하는 경우도 인정, 풀이 과정이 없으면 불인정).
      depends_on: []
      implied_ok: false
      steps: [3b-2, 3c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    $h(2)$를 오직 숫자 2만 사용하여 $h(2)=2^{2^{2^{\cdot^{\cdot^{\cdot^{2}}}}}}$로 표현할 때, 우변에 나타나는 숫자 2의 개수를 구하시오. (예를 들어, $2^{2^2}$에는 숫자 2의 개수가 3이다.)
  points: 6
  depends_on: ['1']
  answer: {kind: value, value: '19', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $h(2)=g(16)$은 2가 16개 쌓이고 맨 위가 16인 탑이며, $16=2^{2^2}$이 2를 3개 더한다.
    steps:
    - {id: 4a, content: '$h(2)=g(16)$, 2의 개수 $16+3=19$', criteria: ['4.M1', '4.M2', '4.A1']}
    hint_ladder:
    - $g(1)=2^1$, $g(2)=2^{2^2}$, $g(3)=2^{2^{2^3}}$의 꼴을 비교해 보자.
    - 맨 위에 남는 수 16도 2만으로 나타내야 한다.
  - id: S4-B
    audience: B
    source_flow: G25_seoul.pdf p.53(인쇄 쪽 80) 예시 답안
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $h(2)=g(g(2))=g(16)$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        $g(n)$은 함수 $f(n)=2^n$을 $n$번 합성하여 $n$을 넣은 값이므로 $g(n)=2^{2^{\cdot^{\cdot^{2^n}}}}$이며, 이때 가장 위의 지수 $n$ 아래의 숫자 2의 개수도 $n$이다. 따라서 $g(16)=2^{2^{\cdot^{\cdot^{2^{16}}}}}$이며, 이때 2의 개수는 16이다.
      criteria: ['4.M2']
    - id: 4b-3
      content: |
        $16=2^{2^2}$이므로 $h(2)=2^{2^{2^{\cdot^{\cdot^{\cdot^{2}}}}}}$의 2의 개수는 $16+3=19$이다.
      criteria: ['4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 1
      evidence: |
        $h(2)=g(16)$임을 서술함.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 1}
      steps: [4b-1]
    - id: 4.M2
      mark_type: M
      points: 2
      evidence: |
        $g(16)$ 또는 $g(n)$을 표현하는 식(맨 위 지수 $n$ 아래에 2가 $n$개)을 정확히 구함.
      depends_on: []
      implied_ok: false
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 3
      evidence: |
        $h(2)$의 지수표현에서 숫자 2의 개수 $19$를 풀이 과정과 함께 정확히 구함.
      depends_on: [4.M1, 4.M2]
      steps: [4b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '5'
  stem: |
    홍익이는 숫자 2를 "구골"($10^{100}$)번 사용하여 나타낸 수 $2^{2^{2^{\cdot^{\cdot^{\cdot^{2}}}}}}$ (숫자 2의 개수가 $10^{100}$)을 "홍익수"라고 하였다. "홍익수"와 $h(3)$ 중 더 큰 수는 무엇인지 고르고 그 이유를 설명하시오.
  points: 6
  depends_on: ['2', '4']
  answer: {kind: choice, value: 'h(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S5-A
    audience: A
    method_no: 1
    key_idea: $a=g(2^{256})$은 2가 $2^{256}$개 이상 쌓인 탑이라 $10^{100}$보다 크고, $h(3)=g(a)$는 2가 $a$개 쌓인 탑이다.
    steps:
    - {id: 5a, content: '$a=g(2^{256})>10^{100}$이므로 $h(3)=g(a)$에는 2가 $10^{100}$개보다 많다', criteria: ['5.M1', '5.R1', '5.R2']}
    hint_ladder:
    - $h(3)=g(g(g(3)))$에서 $g(3)$은 이미 구했다.
    - 2를 더 많이 쌓은 탑이 더 크다.
  - id: S5-B
    audience: B
    source_flow: G25_seoul.pdf p.53(인쇄 쪽 80) 예시 답안
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        $h(3)=g(g(g(3)))=g(g(2^{256}))$이다. $a=g(2^{256})$이라 하자.
      criteria: ['5.M1']
    - id: 5b-2
      content: |
        $a=2^{2^{\cdot^{\cdot^{2^{256}}}}}$이며 이때 가장 위 $2^{256}$의 아래 숫자 2의 개수가 $2^{256}$이다. $10^{100}<(2^4)^{100}=2^{400}$이므로, $10^{100}$보다 $a$가 더 크다.
      criteria: ['5.R1']
    - id: 5b-3
      content: |
        $h(3)=g(a)$이므로, $h(3)=2^{2^{\cdot^{\cdot^{2^a}}}}$이며 이때 $a$의 아래 숫자 2가 $a$개이므로, 2를 $10^{100}$개 사용한 "홍익수"보다 $h(3)$이 더 크다.
      criteria: ['5.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 5.M1
      mark_type: M
      points: 1
      evidence: |
        $h(3)=g(g(2^{256}))$임을 서술함.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 1}
      steps: [5b-1]
    - id: 5.R1
      mark_type: R
      points: 3
      evidence: |
        $g(2^{256})>10^{100}$임을 보임(풀이 과정이 없으면 불인정).
      depends_on: [5.M1]
      implied_ok: false
      steps: [5b-2]
    - id: 5.R2
