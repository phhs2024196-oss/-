stimuli: []

stem: |
  "1000000000 ⋯ 000"

  홍익이는 어릴 때 큰 수를 좋아해서 공책 한 페이지를 하나의 수를 적는 데 사용하기도 했다. 이후 홍익이는 지수를 사용하면 아주 큰 수도 간단히 나타낼 수 있다는 것을 알게 되었다. 예를 들어, 관측 가능한 우주에는 대략 $10^{82}$개의 원자가 있다고 추측된다. $10^{100}$은 "구골(googol)"이라고 불리며, IT 기업 구글(google)의 회사명은 이 수의 이름에서 유래했다고 알려져 있다.

  이보다 더 큰 수를 표현하고 싶었던 홍익이는 다음의 두 가지 방법을 생각하였다.

  첫째, 지수를 여러 번 반복한다. 이때 가장 위의 지수 연산부터 순서대로 한다.

  예를 들어, $a^{b^{c^d}}=a^{\left(b^{\left(c^d\right)}\right)}$이며, 따라서 $2^{2^{2^2}}=2^{2^4}=2^{16}=65536$이다.

  둘째, 함수의 합성을 이용한다. 홍익이는 자연수의 집합을 정의역 및 공역으로 갖는 세 함수 $f,g,h$를 다음과 같이 정의하였다.

  $f(n)=2^n$

  $g(n)=(\underbrace{f\circ f\circ\cdots\circ f}_{n\text{개}})(n)$

  $h(n)=(\underbrace{g\circ g\circ\cdots\circ g}_{n\text{개}})(n)$

  즉, $g(1)=f(1)$, $g(2)=f(f(2))$, $g(3)=f(f(f(3)))$, $\cdots$, $h(1)=g(1)$, $h(2)=g(g(2))$, $h(3)=g(g(g(3)))$, $\cdots$ 이다.

subparts:
- id: '1'
  stem: |
    $g(2)$의 값을 구하시오.
  points: 6
  depends_on: []
  answer: {kind: value, value: '16', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 안쪽부터 $f(2)=4$, $f(4)=16$.
    steps:
    - {id: 1a, content: '$g(2)=f(f(2))=f(4)=16$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $g(2)$는 $f$를 몇 번 합성한 것인가?
  - id: S1-B
    audience: B
    source_flow: G25_seoul.pdf p.52(인쇄 쪽 79) 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        정의에 따라 $g(2)=f(f(2))$이고, 안쪽부터 계산하면 $f(2)=2^2$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $g(2)=f(f(2))=f(2^2)=f(4)=2^4=16$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        풀이 과정을 적절히 서술함: $g(2)=f(f(2))=f(2^2)$처럼 합성을 안쪽부터 계산한 과정이 적혀 있다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        정답 $16$을 제시함.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

