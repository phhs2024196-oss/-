intent: |
  함수 및 합성함수의 개념은 고등학교 수학 교육과정에서 중요한 개념이며, 합성함수는 큰 자연수를 나타내는 편리한 방법을 제시한다. 이 문제에서는 거듭제곱 연산을 합성하여 만들어진 수의 크기를 비교하는 과정에서 함수의 합성과 지수법칙을 이해하고 사용할 수 있는지 평가한다.
key_idea: |
  $g(n)$은 $f(n)=2^n$을 $n$번 합성한 것이므로 맨 위 지수 $n$ 아래에 2가 $n$개 쌓인 지수탑이고, 크기 비교는 지수법칙($10^{100}<2^{400}$ 등)으로 한다.
stuck: |
  $g(n)$을 '2가 $n$개 쌓이고 맨 위에 $n$이 있는 지수탑'으로 일반화하고, $h(2)=g(16)$에서 맨 위의 16도 $2^{2^2}$로 바꿔 2의 개수에 더해야 한다는 점
