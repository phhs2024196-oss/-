key_idea: |
  주머니 선택을 조건으로 나누어 $\mathrm{P}(R)=\mathrm{P}(R\mid A)\mathrm{P}(A)+\mathrm{P}(R\mid B)\mathrm{P}(B)$로 계산하고, 복원 추출의 '멈춤' 시행은 독립시행의 곱(파랑, 파랑, 빨강)으로 본다.
stuck: |
  $X=3$이 '파란 공, 파란 공, 빨간 공' 순서로 나오는 사건과 같다는 것, 그리고 (4)에서 주머니별 $\mathrm{P}(X=3)$을 각각 구해 베이즈 꼴로 합치는 것
