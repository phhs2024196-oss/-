stimuli: []

stem: |
  주머니 2개에 각각 4개와 8개의 공이 들어있다. A 주머니에는 빨간 공 2개와 파란 공 2개가 들어있고, B 주머니에는 빨간 공 2개와 파란 공 6개가 들어 있다. 이를 이용하여, 아래와 같은 다양한 사건들의 확률을 계산해 보려고 한다.

  ※ 최종 답은 모두 기약분수의 형태로 나타내시오.

subparts:
- id: '1'
  stem: |
    두 주머니 A, B 중 임의로 1개의 주머니를 택하여 임의로 1개의 공을 꺼낼 때, 빨간 공을 꺼낼 확률을 구하시오.
  points: 7
  depends_on: []
  answer: {kind: value, value: '3/8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 주머니별로 나누어 더한다.
    steps:
    - {id: 1a, content: '$\tfrac12\cdot\tfrac12+\tfrac12\cdot\tfrac14=\tfrac38$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 어느 주머니를 택했는지로 경우를 나누어 보자.
  - id: S1-B
    audience: B
    source_flow: G25_seoul.pdf p.57(인쇄 쪽 84) 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        '$R$: 주머니에서 빨간 공이 나오는 사건'일 때, $\mathrm{P}(R)=\mathrm{P}(R\cap A)+\mathrm{P}(R\cap B)=\mathrm{P}(R\mid A)\mathrm{P}(A)+\mathrm{P}(R\mid B)\mathrm{P}(B)$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\mathrm{P}(R)=\dfrac12\left(\dfrac12\right)+\dfrac12\left(\dfrac14\right)=\dfrac38$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        덧셈정리·조건부확률로 식 $\mathrm{P}(R\mid A)\mathrm{P}(A)+\mathrm{P}(R\mid B)\mathrm{P}(B)$를 바르게 세움(식이 맞았는데 기약분수가 아니거나 답이 틀린 경우 5점, 풀이과정이 정확하지 않거나 없으면 0점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        설명과 답안의 수식이 정확하고 기약분수 $\dfrac38$을 제시함.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    두 주머니 A, B 중 임의로 1개의 주머니를 택하여 임의로 꺼낸 1개의 공이 빨간색일 때, 공을 꺼낸 주머니가 A일 확률을 구하시오.
  points: 7
  depends_on: ['1']
  answer: {kind: value, value: '2/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}(A\mid R)=\mathrm{P}(A\cap R)/\mathrm{P}(R)$.
    steps:
    - {id: 2a, content: '$\dfrac{1/4}{3/8}=\dfrac23$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 조건부확률의 정의에 (1)의 결과를 넣자.
  - id: S2-B
    audience: B
    source_flow: G25_seoul.pdf p.57(인쇄 쪽 84) 예시 답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        빨간 공이 나왔을 때 주머니 A를 선택한 확률은 $\mathrm{P}(A\mid R)=\dfrac{\mathrm{P}(A\cap R)}{\mathrm{P}(R)}$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\mathrm{P}(A\cap R)=\dfrac12\cdot\dfrac12=\dfrac28$, $\mathrm{P}(R)=\dfrac38$이므로 $\mathrm{P}(A\mid R)=\dfrac{2/8}{3/8}=\dfrac23$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        조건부확률 식 $\mathrm{P}(A\mid R)=\dfrac{\mathrm{P}(A\cap R)}{\mathrm{P}(R)}$를 바르게 세움(식이 맞았는데 기약분수가 아니거나 답이 틀린 경우 5점).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 5}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        설명과 답안의 수식이 명확하고 기약분수 $\dfrac23$을 제시함.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    하나의 주머니를 가지고 다음의 조건을 모두 만족하도록 공을 계속 꺼내는 시행을 생각하자.

    • 꺼낸 공은 주머니에 다시 넣는다.
    • 꺼낸 공이 빨간색이면 공 꺼내기를 멈춘다.
    • 공을 꺼낸 횟수가 10회가 되면 공 꺼내기를 멈춘다.

    이 시행에서 공을 꺼낸 횟수를 확률변수 $X$라 하자. B 주머니를 가지고 위의 시행을 하였을 때, $X=3$일 확률 $\mathrm{P}(X=3)$을 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '9/64', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $X=3$은 파랑·파랑·빨강 순서.
    steps:
    - {id: 3a, content: '$\left(\tfrac34\right)^2\cdot\tfrac14=\tfrac9{64}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 세 번째에 처음으로 빨간 공이 나오려면 앞의 두 번은 어떤 공이어야 하는가?
  - id: S3-B
    audience: B
    source_flow: G25_seoul.pdf p.57(인쇄 쪽 84) 예시 답안
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        '$G$: 주머니에서 파란 공이 나오는 사건'일 때, 주머니 B에서 꺼낸 공이 빨간색일 확률은 $\mathrm{P}(R\mid B)=\dfrac14$, 파란색일 확률은 $\mathrm{P}(G\mid B)=\dfrac34$이다. 제시된 조건에서 $X=3$이 되는 사건은 주머니 B에서 공을 세 번 꺼내는 독립시행에서 순서대로 파란색, 파란색, 빨간색 공이 나오는 사건이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        구하는 확률은 $\mathrm{P}(G\mid B)\mathrm{P}(G\mid B)\mathrm{P}(R\mid B)=\left(\dfrac34\right)^2\times\dfrac14=\dfrac9{64}$.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 6
      evidence: |
        $\mathrm{P}(X=3\mid B)$를 독립시행(파랑, 파랑, 빨강)의 곱으로 바르게 세움(식이 맞았는데 기약분수가 아니거나 답이 틀린 경우 6점).
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        수식과 답이 모두 정확함: $\dfrac9{64}$.
      depends_on: [3.M1]
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    두 주머니 A, B 중 임의로 1개의 주머니를 택하여, 문항(3)과 같은 방식으로 선택한 주머니에서 공을 꺼내는 시행을 하였더니 공을 3회 꺼낸 후 멈추었다고 하자. 공을 꺼낸 주머니가 A일 확률을 구하시오.
  points: 8
  depends_on: ['3']
  answer: {kind: value, value: '8/17', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}(C\mid A)=\tfrac18$, $\mathrm{P}(C\mid B)=\tfrac9{64}$로 베이즈.
    steps:
    - {id: 4a, content: '$\dfrac{\frac12\cdot\frac18}{\frac12\cdot\frac18+\frac12\cdot\frac9{64}}=\dfrac8{17}$', criteria: ['4.M1', '4.A1']}
    hint_ladder:
    - 주머니 A로 같은 시행을 하면 $X=3$일 확률은 얼마인가?
  - id: S4-B
    audience: B
    source_flow: G25_seoul.pdf p.57(인쇄 쪽 84) 예시 답안
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        제시된 방법으로 공을 꺼내는 시행을 하였을 때, $X=3$이 되는 사건을 $C$라 하자. 문항 (3)으로부터 $\mathrm{P}(C\mid B)=\dfrac9{64}$이다. 또한 문항 (3)의 풀이와 동일한 방법으로 주머니 A를 골랐을 때 $X=3$일 확률은 $\mathrm{P}(C\mid A)=\left(\dfrac12\right)^2\times\left(\dfrac12\right)=\dfrac18$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        따라서 $\mathrm{P}(C)=\mathrm{P}(C\mid A)\mathrm{P}(A)+\mathrm{P}(C\mid B)\mathrm{P}(B)=\dfrac12\times\dfrac18+\dfrac12\times\dfrac9{64}=\dfrac{17}{128}$이며, $X=3$일 때 주머니 A를 선택할 확률은 $\mathrm{P}(A\mid C)=\dfrac{\mathrm{P}(A\cap C)}{\mathrm{P}(C)}=\left(\dfrac12\times\dfrac18\right)\Big/\left(\dfrac{17}{128}\right)=\dfrac8{17}$.
      criteria: ['4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 6
      evidence: |
        $\mathrm{P}(C\mid A)$, $\mathrm{P}(C\mid B)$와 조건부확률 식 $\mathrm{P}(A\mid X=3)$을 바르게 세움(식이 맞았는데 기약분수가 아니거나 답이 틀린 경우 6점). [원문 채점기준은 '$\mathrm{P}(R\mid X=3)$'로 적혀 있으나 문맥상 $\mathrm{P}(A\mid X=3)$]
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [3.A1], max_points: 6}
      steps: [4b-1]
    - id: 4.A1
      mark_type: A
      points: 2
      evidence: |
        수식과 답이 모두 정확함: $\dfrac8{17}$.
      depends_on: [4.M1]
      steps: [4b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

