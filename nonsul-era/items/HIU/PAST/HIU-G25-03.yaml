stem: |
  홍익이는 지난 평창 동계올림픽에서 하프파이프를 타는 스노우보더가 만드는 궤적을 관찰하였다. 스노우보더의 헬멧이 하프파이프의 곡선과 일정한 거리를 두고 움직이듯이, 포물선과 일정한 거리를 두고 움직이는 점이 그리는 곡선에 대해 궁금해졌다.

  궁금증을 해결하기 위해, 홍익이는 포물선의 방정식을 $y=x^2$으로 정하고, 포물선과 포물선의 초점이 포함된 영역(<그림 1>의 영역 $\alpha$)에 있는 원과 포물선 사이의 관계에서 다음과 같은 특징을 관찰하였다.

  ① 원의 중심과 반지름의 길이에 따라 원과 포물선이 만나는 점의 개수 $n$은 <그림 1>과 같이 0, 1, 또는 2이다.
  ② 반지름의 길이가 충분히 작은 경우에 원과 포물선이 만나는 점의 개수 $n$은 0 또는 1이다.
  ③ 원이 포물선과 한 점에서 만나면서 이동할 때, 원의 중심이 그리는 궤적은 <그림 2>와 같은 형태의 곡선이다.

  이에 대해 좀 더 자세히 알아보기 위해 아래와 같이 생각해 보았다.

  방정식 $y=x^2$으로 주어진 포물선을 포물선 $p$라 하자. 포물선 $p$는 좌표평면을 포물선의 초점이 포함된 영역과 준선이 포함된 영역으로 나눈다. <그림 1>과 같이 포물선의 초점이 포함된 영역과 포물선을 합하여 영역 $\alpha$라 정의하자. <그림 2>와 같이 영역 $\alpha$에서 반지름의 길이가 $\dfrac14$인 원이 포물선 $p$와 한 점에서 만나면서 이동할 때 원의 중심 $\mathrm{Q}(x,y)$가 그리는 궤적을 곡선 $q$라 하자.

  [그림 1: 포물선 $p$($y=x^2$)의 안쪽(위쪽)이 회색으로 칠해진 영역 $\alpha$. 그 안에 포물선과 만나지 않는 원($n=0$), 포물선의 오른쪽 가지에 한 점에서 접하는 작은 원($n=1$), $y$축 위에 중심이 있고 포물선과 두 점에서 만나는 큰 원($n=2$)이 그려져 있다.]
  [그림 2: 포물선 $p$ 안쪽에서 포물선에 접하며 움직이는 여러 개의 작은 원과, 그 중심들이 그리는 포물선 모양의 곡선 $q$. 원점 근처의 원은 원점에서 접하고, 한 원의 중심 $\mathrm{Q}(x,y)$와 접점 $\mathrm{P}(t,t^2)$이 표시되어 있다.]
  ※ 단 O는 원점이다.

subparts:
- id: '1'
  stem: |
    영역 $\alpha$에서 중심이 $\mathrm{C}(0,c)$이고 반지름의 길이 $r$이 1인 원이 포물선 $p$와 서로 다른 두 점에서 만나고 직선 $l$은 이 두 점을 지난다. 다음 그림에서 색칠된 두 삼각형의 닮음을 이용하여 이 원의 중심의 좌표 $(0,c)$를 구하고 원과 포물선이 만나는 두 점의 좌표를 구하시오.

    [그림: 중심 $\mathrm{C}(0,c)$, 반지름 $r=1$인 원이 포물선 $p$와 $x=\pm a$인 두 점에서 만나고, 두 교점을 지나는 수평선이 직선 $l$이다. 오른쪽 교점에서 포물선의 접선을 그어, 중심 C에서 교점까지의 반지름(빗변 1)을 빗변으로 하고 직선 $l$을 밑변으로 하는 작은 직각삼각형과, 교점에서 수평 방향 1·수직 방향 $2a$인 큰 직각삼각형이 색칠되어 있다. 반지름과 접선이 이루는 각은 직각으로 표시되어 있다.]
  points: 6
  depends_on: []
  answer: {kind: expression, value: 'center=(0, 5/4); points=(sqrt(3)/2, 3/4), (-sqrt(3)/2, 3/4)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선 기울기 $2a$의 삼각형(1, $2a$, $\sqrt{1+4a^2}$)과 반지름 삼각형이 닮음이므로 교점의 $x$좌표 $a=\dfrac{2a}{\sqrt{1+4a^2}}$.
    steps:
    - {id: 1a, content: '$1+4a^2=4$, $a=\pm\tfrac{\sqrt3}{2}$, $c=a^2+\tfrac1{\sqrt{1+4a^2}}=\tfrac54$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 교점에서 반지름과 포물선의 접선은 어떤 관계인가?
    - 접선 기울기 $2a$로 만든 직각삼각형의 빗변은?
  - id: S1-B
    audience: B
    source_flow: G25_seoul.pdf p.63(인쇄 쪽 90) 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        원의 중심을 $\mathrm{C}(0,c)$라 할 때, 그림에서 닮은꼴 삼각형을 이용하면 (큰 삼각형의 빗변은 $\sqrt{1+4a^2}$, 반지름 1인 작은 삼각형의 밑변은 $\dfrac{2a}{\sqrt{1+4a^2}}$, 높이는 $\dfrac1{\sqrt{1+4a^2}}$)
        $$a=\frac{2a}{\sqrt{1+4a^2}}$$
        이때 $a$의 값은 $(1+4a^2)=4$, $a=\pm\dfrac{\sqrt3}{2}$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        그림에서 $c=a^2+\dfrac1{\sqrt{1+4a^2}}=\dfrac54$이므로 원의 중심의 좌표는 $\left(0,\dfrac54\right)$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        원과 포물선이 만나는 점의 좌표는 $\left(\dfrac{\sqrt3}{2},\dfrac34\right)$, $\left(-\dfrac{\sqrt3}{2},\dfrac34\right)$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
