- id: '4'
  stem: |
    문항(3)과 동일한 상황에서 함수 $x=f(t)$, $y=g(t)$를 이용하여 $t=t_0$일 때 곡선 $q$ 위의 점 Q에서 접선의 기울기를 구하고, 포물선 $p$ 위의 점 $\mathrm{P}(t_0,t_0^2)$에서 접선의 기울기를 구하여 두 기울기가 같음을 보이시오.
  points: 6
  depends_on: ['3']
  answer: {kind: proof, value: 'slope_q = 2*t0; slope_p = 2*t0', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $f'(t)=1-\dfrac1{2(4t^2+1)^{3/2}}$, $g'(t)=2t\,f'(t)$이므로 $\dfrac{g'}{f'}=2t$.
    steps:
    - {id: 4a, content: '$g''(t)=2t\left(1-\tfrac1{2(4t^2+1)^{3/2}}\right)=2t\,f''(t)$', criteria: ['4.M1', '4.B1', '4.R1']}
    hint_ladder:
    - $f'(t)$와 $g'(t)$를 각각 구해 공통인수를 찾아보자.
  - id: S4-B
    audience: B
    source_flow: G25_seoul.pdf p.64–65(인쇄 쪽 91–92) 예시 답안
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        매개변수를 이용하여 점 $\mathrm{Q}(f(t),g(t))$에서의 기울기를 구하면 $\dfrac{dy}{dx}=\dfrac{dy/dt}{dx/dt}=\dfrac{g'(t)}{f'(t)}$이고
        $$f'(t)=1-\frac1{2\sqrt{4t^2+1}}+\frac{2t^2}{(4t^2+1)^{3/2}}=1-\frac1{2(4t^2+1)^{3/2}}$$
        $$g'(t)=2t-\frac{t}{(4t^2+1)^{3/2}}=2t\left(1-\frac1{2(4t^2+1)^{3/2}}\right)$$
        이므로 $\dfrac{g'(t)}{f'(t)}=2t$. 점 $\mathrm{Q}(f(t_0),g(t_0))$에서의 기울기는 $\dfrac{g'(t_0)}{f'(t_0)}=2t_0$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        포물선 $p$ 위의 점 $\mathrm{P}(t,t^2)$에서 접선의 기울기는 $\dfrac{dy}{dx}=2t$이므로 점 $\mathrm{P}(t_0,t_0^2)$에서의 기울기는 $2t_0$이다.
      criteria: ['4.B1']
    - id: 4b-3
      content: |
        따라서 두 접선의 기울기는 같다.
      criteria: ['4.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 4
      evidence: |
        점 $\mathrm{Q}(f(t_0),g(t_0))$에서 접선의 기울기 $\dfrac{g'(t_0)}{f'(t_0)}=2t_0$를 구함(중간 과정에 충분한 설명이 없는 경우 0점).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [3.B1, 3.B2], max_points: 4}
      steps: [4b-1]
    - id: 4.B1
      mark_type: B
      points: 1
      evidence: |
        점 $\mathrm{P}(t_0,t_0^2)$에서 접선의 기울기 $2t_0$를 구함.
      depends_on: []
      steps: [4b-2]
    - id: 4.R1
      mark_type: R
      points: 1
      evidence: |
        두 접선의 기울기가 같음을 설명함.
      depends_on: [4.M1, 4.B1]
      implied_ok: false
      steps: [4b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '5'
  stem: |
    문항(3)과 동일한 상황에서 $t=\dfrac38$일 때와 $t=\dfrac23$일 때의 점 Q를 각각 $\mathrm{Q}_1$, $\mathrm{Q}_2$라 하자. 아래의 두 포물선을 비교하여 곡선 $q$가 포물선인지 아닌지 설명하시오.

    • 준선이 $x$축과 평행하고 꼭짓점의 좌표가 $\left(0,\dfrac14\right)$이며 점 $\mathrm{Q}_1$을 지나는 포물선
    • 준선이 $x$축과 평행하고 꼭짓점의 좌표가 $\left(0,\dfrac14\right)$이며 점 $\mathrm{Q}_2$를 지나는 포물선
  points: 6
  depends_on: ['3']
  answer: {kind: expression, value: 'Q1=(9/40, 109/320); Q2=(7/15, 107/180); c=145/81; d=155/98; 포물선 아님', equivalents: [], tolerance: null}
  solutions:
  - id: S5-A
    audience: A
    method_no: 1
    key_idea: 꼭짓점 $\left(0,\tfrac14\right)$, 축이 $y$축인 포물선은 $y=cx^2+\tfrac14$ 하나뿐인데, $\mathrm{Q}_1$, $\mathrm{Q}_2$가 주는 $c$가 다르다.
    steps:
    - {id: 5a, content: '$c=\tfrac{145}{81}\ne\tfrac{155}{98}=d$이므로 $q$는 포물선이 아니다', criteria: ['5.B1', '5.M1', '5.R1']}
    hint_ladder:
    - $t=0$일 때 $\mathrm{Q}=\left(0,\tfrac14\right)$이므로 $q$가 포물선이라면 꼭짓점은 어디여야 하는가?
  - id: S5-B
    audience: B
    source_flow: G25_seoul.pdf p.65(인쇄 쪽 92) 예시 답안
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        $t=\dfrac38$일 때 $f\left(\dfrac38\right)=\dfrac38-\dfrac{3/8}{2\sqrt{4(3/8)^2+1}}=\dfrac9{40}$이고, $g\left(\dfrac38\right)=\left(\dfrac38\right)^2+\dfrac1{4\sqrt{4(3/8)^2+1}}=\dfrac{109}{320}$이므로 점 $\mathrm{Q}_1$의 좌표는 $\left(\dfrac9{40},\dfrac{109}{320}\right)$이다.
        $t=\dfrac23$일 때 $f\left(\dfrac23\right)=\dfrac23-\dfrac{2/3}{2\sqrt{4(2/3)^2+1}}=\dfrac7{15}$이고, $g\left(\dfrac23\right)=\left(\dfrac23\right)^2+\dfrac1{4\sqrt{4(2/3)^2+1}}=\dfrac{107}{180}$이므로 점 $\mathrm{Q}_2$의 좌표는 $\left(\dfrac7{15},\dfrac{107}{180}\right)$이다.
      criteria: ['5.B1']
    - id: 5b-2
      content: |
        준선이 $x$축과 평행하고 꼭짓점의 좌표가 $\left(0,\dfrac14\right)$이며 점 $\mathrm{Q}_1$을 지나는 포물선의 방정식을 $y=cx^2+\dfrac14$라 하면, $c=\dfrac{y-\frac14}{x^2}=\dfrac{\frac{109}{320}-\frac14}{\frac{81}{1600}}=\dfrac{145}{81}$이므로 $y=\dfrac{145}{81}x^2+\dfrac14$.
        점 $\mathrm{Q}_2$를 지나는 포물선의 방정식을 $y=dx^2+\dfrac14$라 하면, $d=\dfrac{\frac{107}{180}-\frac14}{\frac{49}{225}}=\dfrac{155}{98}$이므로 $y=\dfrac{155}{98}x^2+\dfrac14$.
      criteria: ['5.M1']
    - id: 5b-3
      content: |
        주어진 조건을 만족하는 각각의 포물선은 유일하며 두 포물선이 같지 않으므로 준선이 $x$축과 평행하고 꼭짓점의 좌표가 $\left(0,\dfrac14\right)$이며 점 $\mathrm{Q}_1$과 $\mathrm{Q}_2$를 동시에 지나는 포물선은 없다. 따라서 곡선 $q$는 포물선이 아니다.
      criteria: ['5.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 5.B1
      mark_type: B
      points: 2
      evidence: |
        점 $\mathrm{Q}_1\left(\dfrac9{40},\dfrac{109}{320}\right)$, $\mathrm{Q}_2\left(\dfrac7{15},\dfrac{107}{180}\right)$를 구함.
      depends_on: []
      ft: {allowed: true, from: [3.B1, 3.B2], max_points: 2}
      steps: [5b-1]
    - id: 5.M1
      mark_type: M
      points: 2
      evidence: |
        각각의 포물선의 방정식 $y=\dfrac{145}{81}x^2+\dfrac14$, $y=\dfrac{155}{98}x^2+\dfrac14$를 구함.
      depends_on: []
      implied_ok: false
      steps: [5b-2]
    - id: 5.R1
      mark_type: R
      points: 2
      evidence: |
        두 포물선의 방정식이 일치하지 않으므로 곡선 $q$는 포물선이 아니라고 설명함. [원문 채점기준은 '곡선 $p$'로 적혀 있으나 문맥상 곡선 $q$]
      depends_on: [5.M1]
      implied_ok: false
      steps: [5b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

