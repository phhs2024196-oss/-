      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        원의 중심의 좌표 $\left(0,\dfrac54\right)$를 구함.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        세 개의 점(중심과 두 교점)의 좌표를 정확히 서술함: 교점 $\left(\pm\dfrac{\sqrt3}{2},\dfrac34\right)$.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
