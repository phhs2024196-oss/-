- id: '2'
  stem: |
    중심이 $\mathrm{C}(0,r)$이고 반지름의 길이가 $r$인 원이 포물선 $p$와 한 점에서 만나기 위한 $r$의 최댓값을 구하시오.
  points: 6
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 연립하면 $x^2(x^2-2r+1)=0$이고, 원점 외의 교점이 없으려면 $x^2=2r-1$이 양의 근을 갖지 않아야 한다.
    steps:
    - {id: 2a, content: '$x^2(x^2-2r+1)=0$에서 $x^2=2r-1\le0$, $r\le\tfrac12$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 원의 방정식에 $y=x^2$을 대입해 보자.
  - id: S2-B
    audience: B
    source_flow: G25_seoul.pdf p.63–64(인쇄 쪽 90–91) 예시 답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        원의 중심이 $\mathrm{C}(0,r)$이고 반지름이 $r$인 원의 방정식은 $x^2+(y-r)^2=r^2$. 포물선 $y=x^2$과의 교점을 구하기 위해 $y=x^2$를 원의 방정식에 대입하면 $x^2+(x^2-r)^2=r^2$이고, 정리하면 $x^2(x^2-2r+1)=0$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        여기서 $x=0$ 또는 $x^2=2r-1$이다. $2r-1\le0$일 때 근은 $x=0$(따라서 $y=0$) 하나이므로 $r\le\dfrac12$. 따라서 $r$의 최댓값은 $r=\dfrac12$이다.
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    source_flow: G25_seoul.pdf p.63–64 별해
    method_no: 2
    key_idea: 원 해설 별해 — 원의 방정식을 포물선의 방정식에 대입하여 $y$에 관한 식으로 푼다.
    steps:
    - id: 2c-1
      content: |
        $x^2=y$를 대입하면 $y=r^2-(y-r)^2$, 정리하면 $y(y+(1-2r))=0$. $y=x^2\ge0$이므로 $2r-1\le0$일 때 근은 $x=0$, $y=0$ 하나만 존재한다. 따라서 $r$의 최댓값은 $r=\dfrac12$이다.
      criteria: ['2.M1', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        원의 방정식과 포물선의 방정식을 이용하여 식을 구하고 방정식의 근이 하나가 되기 위한 조건을 설명함.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $r$의 최댓값 $r=\dfrac12$을 정확히 구함.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    중심이 $\mathrm{Q}(x,y)$이고 반지름이 $\dfrac14$인 원이 포물선 $p$와 <그림 2>와 같이 한 점 $\mathrm{P}(t,t^2)$에서 만날 때, $\mathrm{Q}(x,y)$의 좌표는 매개변수 $t$에 대한 함수 $x=f(t)$, $y=g(t)$로 나타낼 수 있다. 이때 함수 $f(t)$, $g(t)$를 구하시오.
  points: 6
  depends_on: []
  answer: {kind: expression, value: 'f(t) = t - t/(2*sqrt(4*t**2+1)); g(t) = t**2 + 1/(4*sqrt(4*t**2+1))', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 접점에서 법선 방향 단위벡터 $\dfrac{(-2t,1)}{\sqrt{4t^2+1}}$의 $\tfrac14$배만큼 이동.
    steps:
    - {id: 3a, content: '$f(t)=t-\dfrac{t}{2\sqrt{4t^2+1}}$, $g(t)=t^2+\dfrac1{4\sqrt{4t^2+1}}$', criteria: ['3.B1', '3.B2']}
    hint_ladder:
    - 접선 기울기 $2t$로 밑변 1, 높이 $2t$인 직각삼각형을 그려 보자.
  - id: S3-B
    audience: B
    source_flow: G25_seoul.pdf p.64(인쇄 쪽 91) 예시 답안
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $t>0$일 때 그림(접점에서 밑변 1, 높이 $2t$인 직각삼각형과, 반지름 $r$을 빗변으로 하고 밑변 $\dfrac{2rt}{\sqrt{1+4t^2}}$, 높이 $\dfrac{r}{\sqrt{1+4t^2}}$인 직각삼각형)에서 삼각형의 닮음을 이용하여
        $$f(t)=t-\frac{2rt}{\sqrt{4t^2+1}}=t-\frac{t}{2\sqrt{4t^2+1}}$$
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        $$g(t)=t^2+\frac{r}{\sqrt{4t^2+1}}=t^2+\frac1{4\sqrt{4t^2+1}}$$
        함수 $f$와 $g$는 $f(-t)=-f(t)$, $g(-t)=g(t)$이며 $f(0)=0$, $g(0)=\dfrac14$이므로 모든 구간에서 위의 식이 성립한다.
      criteria: ['3.B2']
  rubric:
