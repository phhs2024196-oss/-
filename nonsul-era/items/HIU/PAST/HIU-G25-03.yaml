intent: |
  이 문제는 포물선과 한 점에서 만나면서 이동하는 원의 중심이 그리는 곡선에 대해서 다루고 있다. 이 곡선은 포물선과 비슷한 형태를 보이지만 함수의 형태로 나타낼 수 없다. 따라서 원과 포물선이 한 점에서 만날 때의 기하학적 특성을 활용하여 곡선의 좌표를 매개변수 함수 형태로 표현하고, 매개변수로 표현된 함수의 미분을 수행할 수 있는지 평가한다. 또한 이 곡선이 포물선이 아니라는 것을 포물선의 특성을 이용하여 설명할 수 있는지를 평가한다.
key_idea: |
  접점 $\mathrm{P}(t,t^2)$에서 법선 방향으로 반지름 $r$만큼 들어간 점이 중심이다. 접선 기울기 $2t$로 만든 직각삼각형(빗변 $\sqrt{1+4t^2}$)과의 닮음으로 $x=t-\dfrac{2rt}{\sqrt{4t^2+1}}$, $y=t^2+\dfrac{r}{\sqrt{4t^2+1}}$.
stuck: |
  원과 포물선이 접할 때 중심이 접점의 법선 위에 있다는 것을 '기울기 $2t$인 직각삼각형과의 닮음'으로 좌표화하는 것, 그리고 (2)에서 한 점에서만 만날 조건을 $x^2(x^2-2r+1)=0$의 근 조건으로 읽는 것
