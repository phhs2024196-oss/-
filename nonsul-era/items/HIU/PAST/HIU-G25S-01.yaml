stimuli: []

stem: |
  삼차함수 $f(x)=ax^3+7x^2+bx+a$가
  $$\lim_{h\to0}\frac{f(1-h)-1}{h}=-4$$
  를 만족시킬 때, $a+b$의 값을 구하시오. (단, $a$, $b$는 상수이다.)

subparts:
- id: '1'
  stem: |
    위의 조건을 만족시킬 때, $a+b$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(1)=1$, $f'(1)=4$의 두 식을 연립한다.
    steps:
    - id: 1a
      content: |
        $2a+b+7=1$, $3a+14+b=4$에서 $a=-4$, $b=2$, $a+b=-2$
      criteria: ['1.M1', '1.B1', '1.A1']
    hint_ladder:
    - 분모가 0으로 가는데 극한이 수렴하면 분자는?
    - $\frac{f(1-h)-f(1)}{h}$은 어떤 미분계수와 관계있는가?
  - id: S1-B
    audience: B
    source_flow: G25_sejong.pdf p.2(인쇄 쪽 94) 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 극한이 수렴하므로 $f(1)=2a+b+7=1$이다. 미분계수의 정의에 의해 극한값은 $-f'(1)$이므로 $f'(1)=4$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f'(x)=3ax^2+14x+b$
      criteria: ['1.B1']
    - id: 1b-3
      content: |
        에 조건 $f'(1)=4$을 대입하면 $3a+b=-10$이다. $a,b$에 대한 두 식을 연립하여 풀면 $a=-4$, $b=2$이다. 그러므로 $a+b=-2$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        미분계수의 정의로부터 $f(1)=1$, $f'(1)=4$를 얻음.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        주어진 함수를 미분하여 $f'(x)=3ax^2+14x+b$를 얻음.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        앞의 결과로 연립방정식을 풀어 $a=-4$, $b=2$, 답 $a+b=-2$를 얻음.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
