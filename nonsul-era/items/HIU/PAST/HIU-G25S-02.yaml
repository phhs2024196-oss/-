stimuli: []

stem: |
  수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
  $$2a_{n+1}=a_n+a_{n+2}$$
  를 만족시킨다.
  $$a_1=1,\ a_2=6$$
  일 때, $\displaystyle\sum_{n=1}^{20}\frac1{a_na_{n+1}}$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{n=1}^{20}\frac1{a_na_{n+1}}$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '20/101', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      등차수열 $a_n=5n-4$, 부분분수로 소거하면 $\frac15\left(1-\frac1{101}\right)$.
    steps:
    - id: 1a
      content: |
        $\sum_{n=1}^{20}\frac15\left(\frac1{5n-4}-\frac1{5n+1}\right)=\frac15\cdot\frac{100}{101}=\frac{20}{101}$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - $2a_{n+1}=a_n+a_{n+2}$는 무엇을 뜻하는가?
    - 분모가 두 일차식의 곱이면 어떻게 분리하는가?
  - id: S1-B
    audience: B
    source_flow: G25_sejong.pdf p.4(인쇄 쪽 96) 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 귀납적 정의로부터 수열 $\{a_n\}$은 등차수열임을 알 수 있고, $a_1=1$, $a_2=6$이므로 일반항 $a_n=5n-4$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\dfrac1{a_na_{n+1}}$의 합을 구하기 위해 유리식을 두 개의 항으로 분리하면 $\dfrac1{a_na_{n+1}}=\dfrac1{(5n-4)(5n+1)}=\dfrac15\left(\dfrac1{5n-4}-\dfrac1{5n+1}\right)$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        그러므로 $\displaystyle\sum_{n=1}^{20}\frac1{a_na_{n+1}}=\frac15\left[\left(1-\frac16\right)+\left(\frac16-\frac1{11}\right)+\dots+\left(\frac1{96}-\frac1{101}\right)\right]=\frac{20}{101}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        귀납적 정의로부터 수열 $\{a_n\}$은 등차수열임을 알고 일반항 $a_n=5n-4$를 구함.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        분모가 서로 다른 두 일차식의 곱으로 나타내어진 유리식을 두 개의 항으로 분리함.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $\sum$ 기호의 의미를 알고 합 $\dfrac{20}{101}$을 구함.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
