stimuli: []

stem: |
  두 식 $\log_ab+\log_b(a^4)=4$, $b=-a+6$을 만족시키는 1보다 큰 양수 $a$, $b$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    두 식을 만족시키는 1보다 큰 양수 $a$, $b$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'a=2; b=4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $t+\frac4t=4\Rightarrow t=2\Rightarrow b=a^2$, $a^2+a-6=0$.
    steps:
    - id: 1a
      content: |
        $(t-2)^2=0$, $b=a^2$, $(a+3)(a-2)=0$, $a>1$에서 $a=2$, $b=4$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - $\log_b(a^4)$을 $\log_ab$로 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: G25_sejong.pdf p.6(인쇄 쪽 98) 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $t=\log_ab$로 치환하면 $\log_b(a^4)=4\log_ba=\dfrac4{\log_ab}=\dfrac4t$이므로 첫번째 식 $\log_ab+\log_b(a^4)=4$는 $t+\dfrac4t=4$가 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        양변에 $t$를 곱하여 정리하면 $t^2-4t+4=(t-2)^2=0$을 얻어 $t=2$를 구하고 이로부터 $b=a^2$이 된다. 두 번째 식에 $b=a^2$을 대입하여 정리하면 $a^2+a-6=(a+3)(a-2)=0$.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $a$가 1보다 커야 하므로 답은 $a=2$, $b=a^2=4$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $t=\log_ab$로 치환한 뒤 $\log_b(a^4)=\dfrac4{\log_ab}=\dfrac4t$를 대입하여 첫번째 식을 $t$에 관한 이차 방정식으로 바꿈.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $t$에 관한 이차 방정식을 풀어 $t$의 값과 $a$와 $b$ 사이의 관계식을 구하여 두 번째 식에 대입하여 $a$에 관한 이차 방정식으로 바꿈.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $a$에 관한 이차 방정식을 풀어 $a$의 값을 구하고 $a$와 $b$ 사이의 관계식에 대입하여 $b$의 값도 구함($a=2$, $b=4$).
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
