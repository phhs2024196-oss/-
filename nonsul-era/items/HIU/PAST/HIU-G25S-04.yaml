stimuli: []

stem: |
  함수
  $$f(x)=\begin{cases}-x+2&(x<1)\\ax+1&(x\ge1)\end{cases}$$
  에 대하여, 함수 $\{f(x)+1\}^2$이 실수 전체의 집합에서 연속이 되도록 하는 모든 실수 $a$값의 합을 구하시오.

subparts:
- id: '1'
  stem: |
    함수 $\{f(x)+1\}^2$이 실수 전체의 집합에서 연속이 되도록 하는 모든 실수 $a$값의 합을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $(a+2)^2=4$에서 $a=0$ 또는 $a=-4$.
    steps:
    - id: 1a
      content: |
        $\lim_{x\to1-}\{f(x)+1\}^2=4=(a+2)^2$, $a=-4,0$, 합 $-4$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - $x\ne1$에서는 다항함수이므로 연속이다. $x=1$만 보면 된다.
  - id: S1-B
    audience: B
    source_flow: G25_sejong.pdf p.8(인쇄 쪽 100) 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $\{f(x)+1\}^2$가 $x=1$에서 연속이므로 $\displaystyle\lim_{x\to1-}\{f(x)+1\}^2=\{f(1)+1\}^2$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to1-}\{f(x)+1\}^2=\left\{\lim_{x\to1-}f(x)+1\right\}^2=(1+1)^2=4$이고 $\{f(1)+1\}^2=(a+2)^2$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $(a+2)^2=4$에서 $a=-4,\ 0$이다. 따라서 문제의 조건을 만족하는 모든 실수 $a$의 값의 합은 $-4+0=-4$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $x=1$에서 연속조건으로 $\lim_{x\to1-}\{f(x)+1\}^2=\{f(1)+1\}^2$을 명시함.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        식 $\lim_{x\to1-}\{f(x)+1\}^2=4$, $\{f(1)+1\}^2=(a+2)^2$를 옳게 얻음.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $(a+2)^2=4$로부터 $a=-4,\ 0$을 얻어 답 $-4+0=-4$를 얻음.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
