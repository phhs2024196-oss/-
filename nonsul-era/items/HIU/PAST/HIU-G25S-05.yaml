stimuli: []

stem: |
  두 함수 $f(x)=x^3+3x^2+3$, $g(x)=x^2+4x+k$의 그래프가 만나는 점의 개수가 3이 되도록 하는 정수 $k$의 개수를 구하시오.

subparts:
- id: '1'
  stem: |
    두 그래프가 만나는 점의 개수가 3이 되도록 하는 정수 $k$의 개수를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '9', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      극댓값 $h(-2)=11$, 극솟값 $h\left(\tfrac23\right)=\tfrac{41}{27}$이므로 $\tfrac{41}{27}<k<11$.
    steps:
    - id: 1a
      content: |
        정수 $k=2,3,\dots,10$, 9개
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - $f(x)=g(x)$에서 $k$만 한쪽으로 보내 보자.
  - id: S1-B
    audience: B
    source_flow: G25_sejong.pdf p.10(인쇄 쪽 102) 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $h(x)=x^3+3x^2+3-(x^2+4x)=x^3+2x^2-4x+3$이라 하자. $f(x)=g(x)$의 근은 $h(x)=k$의 근과 같으므로 $h(x)$의 그래프를 이용하여 $k$의 범위를 구한다. $h'(x)=3x^2+4x-4=(x+2)(3x-2)$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        함수의 증가와 감소를 표로 나타내면 $x<-2$에서 증가, $x=-2$에서 극댓값 $11$, $-2<x<\dfrac23$에서 감소, $x=\dfrac23$에서 극솟값 $\dfrac{41}{27}$, $x>\dfrac23$에서 증가이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        곡선 $y=h(x)$와 직선 $y=k$가 서로 다른 세 실근을 가지려면 교점의 개수가 세 개가 되어야 한다. 그러므로 상수 $k$의 값의 범위는 $\dfrac{41}{27}<k<11$이다. 이 범위 내의 정수는 $k=2,3,\dots,10$이므로 정수인 $k$의 개수는 9개이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $f(x)-g(x)$에서 미지수 $k$를 제외한 함수를 $h(x)$라고 정의하고 도함수를 구함.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        함수의 증가 감소표를 이용하여 $h(x)$의 증가 감소를 구하고 이를 이용하여 그래프 개형을 확인함.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        서로 다른 세 실근을 갖는 $k$의 범위 $\dfrac{41}{27}<k<11$을 구하고 정수 $k$의 개수 9를 구함.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
