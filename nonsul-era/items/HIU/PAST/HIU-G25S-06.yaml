intent: |
  삼각함수 사이의 관계와 삼각함수의 성질을 이용하여 주어진 각도에서의 삼각함수의 값을 구할 수 있는지 확인한다. 또한 사인법칙과 코사인법칙을 활용하여 외접원의 반지름으로부터 삼각형의 변의 길이를 구하고 이로부터 삼각형의 넓이를 계산할 수 있는지 확인한다.
key_idea: |
  (가)에서 $\sin A=\cos A$, (나)에서 $\cos(\pi-B)=-\cos B=-\sin B$이므로 $A=B=\dfrac\pi4$, $C=\dfrac\pi2$.
stuck: |
  $A+C=\pi-B$로 바꾸어 (나)를 $\tan B=1$로 읽는 것
