stimuli: []

stem: |
  삼각형 ABC가 다음 두 조건을 만족시킨다.

  (가) $\sin A=\sin\left(A+\dfrac\pi2\right)$

  (나) $\cos(A+C)=-\sin B$

  삼각형 ABC에 외접하는 원의 넓이가 $8\pi$일 때, 삼각형 ABC의 넓이를 구하시오.

subparts:
- id: '1'
  stem: |
    삼각형 ABC에 외접하는 원의 넓이가 $8\pi$일 때, 삼각형 ABC의 넓이를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $A=B=\frac\pi4$, $C=\frac\pi2$, $R=2\sqrt2$, 두 변 $4$, $4$.
    steps:
    - id: 1a
      content: |
        $\overline{\mathrm{AC}}=\overline{\mathrm{BC}}=2R\sin\frac\pi4=4$, 넓이 $\frac12\cdot4\cdot4=8$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - $\sin\left(A+\frac\pi2\right)$을 $A$의 다른 삼각함수로 바꾸어 보자.
    - $A+C$를 $B$로 나타내자.
  - id: S1-B
    audience: B
    source_flow: G25_sejong.pdf p.12–13(인쇄 쪽 104–105) 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가) $\sin A=\sin(A+\pi/2)=\cos A$, $\tan A=1$, $A=\dfrac\pi4$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        또한 $A+B+C=\pi$이므로 (나)로부터는 $\cos(A+C)=\cos(\pi-B)=-\cos B=-\sin B$, $\tan B=1$, $B=\dfrac\pi4$, $C=\pi-A-B=\dfrac\pi2$를 확인할 수 있다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        또한 삼각형의 외접원의 반지름 $R$은 $\pi R^2=8\pi$로부터 $R=2\sqrt2$로 나온다. 이제 사인법칙으로부터 $\overline{\mathrm{AC}}=2\cdot2\sqrt2\sin B=4$, $\overline{\mathrm{BC}}=2\cdot2\sqrt2\sin A=4$이므로 삼각형 ABC의 넓이는 $\dfrac12\overline{\mathrm{AC}}\,\overline{\mathrm{BC}}\sin C=\dfrac12\cdot4\cdot4\cdot1=8$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    source_flow: G25_sejong.pdf p.13(인쇄 쪽 105) 다른 풀이
    method_no: 2
    key_idea: |
      원 해설 다른 풀이 — $B$는 $\cos^2B+\sin^2B=2\sin^2B=1$로도 구하고, 넓이는 빗변 $\overline{\mathrm{AB}}=2R=4\sqrt2$인 직각이등변삼각형으로 구한다.
    steps:
    - id: 1c-1
      content: |
        $\cos^2B+\sin^2B=2\sin^2B=1$, $0<B<\pi$이므로 $\sin B>0$이고 $\cos B=\sin B=\dfrac{\sqrt2}{2}$, $B=\dfrac\pi4$로 구할 수도 있다.
      criteria: ['1.M2']
    - id: 1c-2
      content: |
        직각삼각형은 빗변이 원의 중심을 지나므로 빗변의 길이 $\overline{\mathrm{AB}}=4\sqrt2$이다. 직각삼각형 ABC의 삼각비를 이용하면 $\overline{\mathrm{AC}}=\overline{\mathrm{BC}}=4$이므로 넓이는 $\dfrac12\overline{\mathrm{AC}}\,\overline{\mathrm{BC}}=\dfrac12\cdot4\cdot4=8$이다. [원문은 '$\overline{\mathrm{AC}}=\overline{\mathrm{AB}}=4$'로 적혀 있으나 문맥상 $\overline{\mathrm{AC}}=\overline{\mathrm{BC}}=4$]
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $\sin A$와 $\cos A$의 값을 구하고 이로부터 각도 $A=\dfrac\pi4$를 구함.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        $\tan B$ 또는 $\sin B$와 $\cos B$의 값을 구하고 이로부터 각도 $B=\dfrac\pi4$와 $C=\dfrac\pi2$를 구함.
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        사인법칙과 코사인법칙을 이용하여 삼각형의 변들의 길이를 구하고 삼각형의 넓이 8을 계산함.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3, 1c-2]
    deductions: []
