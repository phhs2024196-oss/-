stimuli: []

stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$(x-2)f(x)=x^3-ax+b+\int_2^xf(t)\,dt$$
  를 만족시킬 때, $f'(1)+a+b$의 값을 구하시오. (단, $a$, $b$는 상수이다.)

subparts:
- id: '1'
  stem: |
    $f'(1)+a+b$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '37', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $a=12$, $b=16$, $f'(x)=3(x+2)$.
    steps:
    - id: 1a
      content: |
        $f'(1)+a+b=9+12+16=37$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - 정적분의 위끝과 아래끝이 같아지는 $x$를 대입해 보자.
    - 양변을 미분하면 무엇이 소거되는가?
  - id: S1-B
    audience: B
    source_flow: G25_sejong.pdf p.15(인쇄 쪽 107) 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        문제의 식의 양변에 $x=2$를 대입하면 $8-2a+b=0$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        양변을 $x$에 관하여 미분하면 $f(x)+f'(x)(x-2)=3x^2-a+f(x)$이고, $f'(x)(x-2)=3x^2-a$이다. 양변에 $x=2$를 대입하면 $a=12$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $b=16$이다. 그러므로 $x\ne2$일 때, $f'(x)=\dfrac{3x^2-12}{x-2}=3(x+2)$이다. 따라서 $f'(1)+a+b=37$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        문제의 식의 양변에 $x=2$를 대입하여 식 $8-2a+b=0$을 얻음.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 7
      evidence: |
        양변을 $x$에 관하여 미분하여 $f'(x)(x-2)=3x^2-a$를 얻고 이에 $x=2$를 대입하여 $a=12$를 얻음.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $b=16$을 얻고 $f'(x)=3(x+2)$를 얻어 문제의 답 $f'(1)+a+b=37$을 얻음.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
