stimuli:
- label: 제시문
  body: |
    홍익이는 최근 흥행한 영화 [아바타: 물의 길]의 핵심 기술인 3D 안경의 원리를 학습하였다. 그 결과 빛(자연광)은 전기장이 모든 방향으로 진동하면서 전파되지만, 스크린에서 송출된 영상은 좌측 안경을 통해 좌원편광(전기장이 시계 방향으로 회전, <그림 1>)만 통과되고, 우측 안경을 통해 우원편광(전기장이 반시계 방향으로 회전, <그림 2>)만 통과되면서, 인체의 좌우 눈에 각각 다른 영상이 전달되어 영상의 입체감을 유발한다는 사실을 알았다.
    이에 영감을 얻은 홍익이는 수행평가로 전기장의 세기 및 방향을 제어하는 편광판을 개발하였다. 특수 제작된 조리개를 돌리면 전기장의 진폭 및 $y$성분 전기장의 위상차를 $\theta$만큼 조절할 수 있도록 설계하였으며, 개발한 편광판의 효용성을 입증하기 위해서 다음과 같은 실험을 수행하였다. 먼저, 광원과 편광판을 설치하였고, 편광판이 전기장의 방향과 시간에 따른 경로를 어떻게 조절하는지 검출기 화면을 통해 확인하였다.

    홍익이는 검출된 움직임을 수학적으로 분석하니 전기장은 두 개의 직교하는 성분으로 나눌 수 있음을 알았다.

    전기장의 $x$성분: $x=A\cos2\pi t$
    전기장의 $y$성분: $y=B\cos(2\pi t+\theta)$

    여기서
    $A$, $B$: 진폭
    $t$: 시간
    $\theta$: 위상차(상수)

    [그림 1: 「검출기 화면 (좌원편광)」 — 원 모양의 경로와 화살표, 아래에 「시간에 따른 경로」, 캡션 <그림 1>]
    [그림 2: 「검출기 화면 (우원편광)」 — 원 모양의 경로와 화살표, 아래에 「시간에 따른 경로」, 캡션 <그림 2>]

stem: |
  (제시문의 설정에 대하여 다음 물음에 답하시오.) [판독확인: 원문에는 별도의 공통 발문 없이 (1)~(4)가 이어짐]

subparts:
- id: '1'
  stem: |
    $A=B=1$, $\theta=0$일 때, 전기장의 $x$성분과 전기장의 $y$성분과의 관계를 좌표평면(오른쪽 좌표평면 참조) 위에 그리시오.
    [그림: $-3\le x\le3$, $-3\le y\le3$ 범위의 눈금 1 간격 모눈 좌표평면]
  points: 5
  depends_on: []
  answer: {kind: expression, value: 'y = x, -1 <= x <= 1', equivalents: ['점 (-1,-1)과 점 (1,1)을 연결한 선분'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=y=\cos2\pi t$이므로 $y=x$이고 $-1\le x\le1$이다.
    steps:
    - {id: 1a, content: '$x=\cos2\pi t$, $y=\cos2\pi t\Rightarrow y=x\ (-1\le x\le1)$', criteria: ['1.B1']}
    hint_ladder:
    - $\theta=0$이면 두 성분의 식은 어떻게 되는가?
  - id: S1-B
    audience: B
    source_flow: G26_seoul.pdf p.4~5(인쇄 67~68쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $A=B=1$, $\theta=0$일 때, $x=\cos2\pi t$, $y=\cos2\pi t$이다. $t$에 따라서 점 $(-1,-1)$과 점 $(1,1)$을 연결한 선 위에서 진동한다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        따라서 전기장의 $x$성분과 전기장의 $y$성분의 관계는 $y=x\ (-1\le x\le1)$이므로, 좌표평면 위에 점 $(-1,-1)$과 점 $(1,1)$을 연결한 선분을 그린다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: |
        점 $(-1,-1)$과 점 $(1,1)$을 연결한 선분을 그렸다(부분 점수 없음).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $A=B=1$, $\theta=\dfrac{\pi}{3}$일 때, $\dfrac{dy}{dx}=a+b\cot2\pi t$이다. 이때, 상수 $a$, $b$를 구하시오. (단, $2t$는 정수가 아니다.)
  points: 7
  depends_on: []
  answer: {kind: value, value: 'a = 1/2; b = sqrt(3)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 덧셈정리로 $y$를 전개한 뒤 $\dfrac{dy}{dx}=\dfrac{dy/dt}{dx/dt}$를 계산한다.
    steps:
    - {id: 2a, content: '$\dfrac{dy}{dx}=\dfrac{-\pi\sin2\pi t-\sqrt3\pi\cos2\pi t}{-2\pi\sin2\pi t}=\dfrac12+\dfrac{\sqrt3}{2}\cot2\pi t$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $\cos\left(2\pi t+\dfrac{\pi}{3}\right)$을 덧셈정리로 펼쳐 보자.
  - id: S2-B
    audience: B
    source_flow: G26_seoul.pdf p.5(인쇄 68쪽)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $x=\cos2\pi t$, $\dfrac{dx}{dt}=-2\pi\sin2\pi t$와 같다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        또한, $y$는 삼각함수의 덧셈정리에 의해서 아래와 같이 정의된다.
        $$y=\cos\left(2\pi t+\dfrac{\pi}{3}\right)=\cos2\pi t\times\cos\dfrac{\pi}{3}-\sin2\pi t\times\sin\dfrac{\pi}{3}=\dfrac12\cos2\pi t-\dfrac{\sqrt3}{2}\sin2\pi t$$
        따라서, $y$를 $t$에 대해서 미분하면 $\dfrac{dy}{dt}=-\dfrac{2\pi}{2}\sin2\pi t-\dfrac{2\sqrt3\pi}{2}\cos2\pi t=-\pi\sin2\pi t-\sqrt3\pi\cos2\pi t$.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        이를 이용해 $\dfrac{dy}{dx}$에 대해서 정리하면
        $$\dfrac{dy}{dx}=\dfrac{dy/dt}{dx/dt}=\dfrac{-\pi\sin2\pi t-\sqrt3\pi\cos2\pi t}{-2\pi\sin2\pi t}=\dfrac12+\dfrac{\sqrt3}{2}\cot2\pi t$$
        (단, $2t$는 정수가 아니다.) 따라서 $a=\dfrac12$, $b=\dfrac{\sqrt3}{2}$.
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    source_flow: G26_seoul.pdf p.6(인쇄 69쪽) 다른 풀이
    method_no: 2
    key_idea: 원 해설 다른 풀이 — $y$를 전개하지 않고 바로 미분한 뒤 분자에 덧셈정리를 적용한다.
    steps:
    - id: 2c-1
      content: |
        $\dfrac{dy}{dt}=-2\pi\sin\left(2\pi t+\dfrac{\pi}{3}\right)$이므로
        $$\dfrac{dy}{dx}=\dfrac{-2\pi\sin\left(2\pi t+\frac{\pi}{3}\right)}{-2\pi\sin2\pi t}=\dfrac{\sin2\pi t\times\cos\frac{\pi}{3}+\cos2\pi t\times\sin\frac{\pi}{3}}{\sin2\pi t}=\dfrac12+\dfrac{\sqrt3}{2}\cot2\pi t$$
      criteria: ['2.M1', '2.M2', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $x$를 $t$에 대해서 미분하여 $\dfrac{dx}{dt}=-2\pi\sin2\pi t$를 적었다(부분 점수 없음).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $y$를 $t$에 대해서 미분한 식을 적었다(부분 점수 없음).
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $a=\dfrac12$, $b=\dfrac{\sqrt3}{2}$를 구했다(부분 점수 없음).
      depends_on: [2.M1, 2.M2]
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $A=B=\sqrt5$, $\theta=\dfrac{\pi}{2}$일 때의 주기를 $p$라 하자. 시각 $t=0$에서 $t=\dfrac{p}{4}$까지 전기장이 검출되도록 하였다. 이때, 검출기에 그려진 곡선의 길이를 구하고, 편광판을 통과한 전기장이 좌원편광인지 우원편광인지 판단하시오.
  points: 8
  depends_on: []
  answer: {kind: expression, value: 'length = sqrt(5)*pi/2; direction = 좌원편광', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $x=\sqrt5\cos2\pi t$, $y=-\sqrt5\sin2\pi t$는 반지름 $\sqrt5$인 원을 시계 방향으로 돈다.
    steps:
    - {id: 3a, content: '$p=1$, 속력 $2\sqrt5\pi$, 길이 $=\tfrac14\cdot2\sqrt5\pi=\tfrac{\sqrt5\pi}{2}$; $(\sqrt5,0)\to(0,-\sqrt5)$이므로 시계 방향 = 좌원편광', criteria: ['3.B1', '3.B2']}
    hint_ladder:
    - $\cos\left(2\pi t+\dfrac{\pi}{2}\right)$은 어떤 함수인가?
    - $t=0$과 $t=\dfrac14$에서 점의 위치를 비교해 보자.
  - id: S3-B
    audience: B
    source_flow: G26_seoul.pdf p.6~7(인쇄 69~70쪽)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $A=B=\sqrt5$, $\theta=\dfrac{\pi}{2}$일 때, $x=\sqrt5\cos2\pi t$, $y=\sqrt5\cos\left(2\pi t+\dfrac{\pi}{2}\right)=-\sqrt5\sin2\pi t$이다. 주기 $p=1$이기 때문에 시각 $t=0$에서 $t=\dfrac14$까지 이동한 길이를 구한다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        $\dfrac{dx}{dt}=-2\sqrt5\pi\sin2\pi t$, $\dfrac{dy}{dt}=-2\sqrt5\pi\cos2\pi t$이므로
        $$l=\int_0^{\frac14}\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}\,dt=\int_0^{\frac14}\sqrt{(2\sqrt5\pi)^2(\sin^22\pi t+\cos^22\pi t)}\,dt=\int_0^{\frac14}2\sqrt5\pi\,dt=\dfrac{\sqrt5\pi}{2}$$
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        $t=0$일 때 $x=\sqrt5$, $y=0$이며, $t=\dfrac14$일 때 $x=0$, $y=-\sqrt5$임을 알 수 있으며, 전기장은 점 $(\sqrt5,0)$에서 점 $(0,-\sqrt5)$로 시계 방향으로 진행함을 알 수 있다. 따라서 좌원편광이다.
