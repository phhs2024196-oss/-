intent: |
  (1) 고등학교 미적분 과목에서 도형(선 또는 곡선)과 매개변수로 나타낸 함수와의 관계를 이해하고, 삼각함수의 덧셈정리와 함께 매개변수로 나타낸 함수의 미분법을 이해하고 있는지 시험하고자 한다. 또한, 매개변수로 나타낸 곡선 길이를 정적분으로 구할 수 있는지 판단하고자 한다.
  (2) 기하 과목에서 제시되는 이차곡선 중 하나인 타원의 특성을 파악하고, 매개변수로 나타낸 함수를 함수 꼴로 유도할 수 있는지를 시험하고자 한다. 또한, 해당 타원의 접선 방정식을 구하고 산술평균과 기하평균을 이용하여 도형의 최솟값을 구할 수 있는지 평가하고자 한다.
  (3) 고교 교육과정의 범위를 준수하고 그 내용을 충실히 반영하여, 수험생들이 이해하기 쉬운 수준으로 구성하였다.
key_idea: |
  $x=A\cos2\pi t$, $y=B\cos(2\pi t+\theta)$를 덧셈정리로 풀어 매개변수 곡선(선분·원·타원)으로 보고, 매개변수 미분·곡선의 길이·타원의 접선과 산술-기하평균을 적용한다.
stuck: |
  $\theta=\dfrac{\pi}{2}$일 때 $y=-B\sin2\pi t$로 바뀌어 원·타원이 되고, $t$가 증가할 때 회전 방향(시계/반시계)을 판단하는 것
