- id: '4'
  stem: |
    $A=3$, $B=2$, $\theta=\dfrac{\pi}{2}$일 때, 검출기에 그려진 곡선에서 1사분면에 위치한 임의의 점 $\mathrm{P}(x_1,y_1)$에서의 접선이 $x$축, $y$축과 만나는 점을 각각 $\mathrm{M}$, $\mathrm{N}$이라고 하자. 점 $\mathrm{P}$에서의 접선의 방정식을 구하고, 삼각형 $\mathrm{OMN}$ 넓이의 최솟값을 구하시오. (단, $\mathrm{O}$는 원점이다.)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'tangent: 4*x1*x + 9*y1*y = 36; min = 6', equivalents: ['x1*x/9 + y1*y/4 = 1'], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 곡선은 타원 $4x^2+9y^2=36$이고, 넓이 $\dfrac{18}{x_1y_1}$의 최소는 산술-기하평균으로 $x_1y_1\le3$에서 얻는다.
    steps:
    - {id: 4a, content: '접선 $4x_1x+9y_1y=36$, $S=\tfrac{18}{x_1y_1}$, $36=4x_1^2+9y_1^2\ge12x_1y_1\Rightarrow S\ge6$', criteria: ['4.B1', '4.M1', '4.A1']}
    hint_ladder:
    - $x=3\cos2\pi t$, $y=-2\sin2\pi t$에서 $t$를 소거해 보자.
  - id: S4-B
    audience: B
    source_flow: G26_seoul.pdf p.7~8(인쇄 70~71쪽)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $x=3\cos2\pi t$, $y=-2\sin2\pi t$이기 때문에 $4x^2+9y^2=36$이므로 타원임을 알 수 있다. 따라서 점 $\mathrm{P}(x_1,y_1)$에서의 접선의 방정식은 $4x_1x+9y_1y=36$이다.
      criteria: ['4.B1']
    - id: 4b-2
      content: |
        $x$축, $y$축과 만나는 점 $\mathrm{M}$, $\mathrm{N}$은 $\mathrm{M}\left(\dfrac{9}{x_1},0\right)$, $\mathrm{N}\left(0,\dfrac{4}{y_1}\right)$이므로 삼각형 $\mathrm{OMN}$ 넓이 $S$는 $S=\dfrac12\times\dfrac{9}{x_1}\times\dfrac{4}{y_1}=\dfrac{18}{x_1y_1}$.
      criteria: ['4.M1']
    - id: 4b-3
      content: |
        점 $\mathrm{P}(x_1,y_1)$이 타원 위의 점이므로 $4x_1^2+9y_1^2=36$이다. 이때, 산술평균과 기하평균의 관계에 따라 $36=4x_1^2+9y_1^2\ge2\sqrt{4x_1^2\times9y_1^2}=12x_1y_1$이므로 $x_1y_1\le3$이다. 따라서 $S\ge6$이기 때문에, 삼각형 $\mathrm{OMN}$ 넓이의 최솟값은 $6$이다. (등호는 $4x_1^2=9y_1^2=18$, 즉 $\mathrm{P}\left(\dfrac{3}{\sqrt2},\sqrt2\right)$일 때)
      criteria: ['4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.B1
      mark_type: B
      points: 2
      evidence: |
