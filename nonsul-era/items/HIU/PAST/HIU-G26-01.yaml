      points: 3
      evidence: |
        넓이를 $x_1$, $y_1$로 $S=\dfrac{18}{x_1y_1}$과 같이 정의했다(부분 점수 없음).
      depends_on: []
      implied_ok: false
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 5
      evidence: |
        산술평균과 기하평균의 관계로 $x_1y_1\le3$을 보이고 최솟값 $6$을 구했다(부분 점수 없음).
      depends_on: [4.M1]
      steps: [4b-3]
    deductions: []
