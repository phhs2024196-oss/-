stimuli:
- label: 제시문
  body: |
    어떤 게임에서 얻는 점수를 확률변수 $X$라 하면, $n$번째 시행 후 얻는 점수는 $X_n$이다. 이 게임의 점수 수열 $\{X_n\}$은 다음과 같이 정의된다.

    ■ 초기 점수 $X_0=0$이다.
    ■ 매 시행마다 두 사건 $A$와 $B$ 중 한 사건이 일어난다. $n$번째 시행의 사건을 각각 $A_n$, $B_n$이라고 하자.
    ■ 수열 $\{X_n\}$이 모든 자연수 $n$에 대하여 다음 조건을 만족시킨다.
      • 사건 $A_n$이 일어나면 점수는 1만큼 증가하고, 사건 $B_n$이 일어나면 점수는 0으로 초기화된다. 즉,
      $$X_n=\begin{cases}X_{n-1}+1 & (\text{사건 }A_n\text{ 일어남})\\ 0 & (\text{사건 }B_n\text{ 일어남})\end{cases}$$
      • 사건 $A_n$과 $B_n$이 일어날 확률은 다음과 같다.
        ▴ $(n-1)$번째 점수가 $x$인 사건$(X_{n-1}=x)$이 일어났을 때, 사건 $A_n$이 일어날 확률은 $\dfrac{1}{x+2}$이다. 즉,
        $$\mathrm{P}(A_n\mid X_{n-1}=x)=\dfrac{1}{x+2}$$
        ▴ $(n-1)$번째 점수가 $x$인 사건$(X_{n-1}=x)$이 일어났을 때, 사건 $B_n$이 일어날 확률은 $\dfrac{x+1}{x+2}$이다. 즉,
        $$\mathrm{P}(B_n\mid X_{n-1}=x)=\dfrac{x+1}{x+2}$$

    ※ 답안은 기약분수의 형태로 작성하시오.

stem: |
  (제시문의 게임에 대하여 다음 물음에 답하시오.) [판독확인: 원문에는 별도의 공통 발문 없이 (1)~(4)가 이어짐]

subparts:
- id: '1'
  stem: |
    확률변수 $X_2$의 확률분포를 표로 나타내시오.
  points: 8
  depends_on: []
  answer: {kind: set, value: 'P(X2=0) = 7/12; P(X2=1) = 1/4; P(X2=2) = 1/6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $X_1$의 분포를 먼저 구하고 조건부확률로 $X_2$의 각 값의 확률을 계산한다.
    steps:
    - {id: 1a, content: '$X_1$: $0,1$ 각 $\tfrac12$ → $P(X_2=2)=\tfrac16$, $P(X_2=1)=\tfrac14$, $P(X_2=0)=\tfrac7{12}$', criteria: ['1.B1', '1.B2', '1.B3', '1.B4', '1.B5']}
    hint_ladder:
    - $X_1$이 가질 수 있는 값과 그 확률부터 구하자.
  - id: S1-B
    audience: B
    source_flow: G26_seoul.pdf p.13(인쇄 76쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        우선 확률변수 $X_1$의 확률분포를 구하자. 확률변수 $X_1$이 가질 수 있는 값은 $0,1$이고, $P(X_1=1\mid X_0=0)=\dfrac12$, $P(X_1=0\mid X_0=0)=\dfrac12$이므로
        $P(X_1=0)=P(X_0=0)P(X_1=0\mid X_0=0)=\dfrac12$, $P(X_1=1)=P(X_0=0)P(X_1=1\mid X_0=0)=\dfrac12$.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        확률변수 $X_2$가 가질 수 있는 값은 $0,1,2$이다. (원문 「1, 2, 3」은 오기)
        • $X_2=2$: $X_1=1$이고 사건 $A_2$가 일어난 경우 (원문은 「$X_1=1$이고 $X_2=1$인 경우」로 표기 — 오기) $P(X_2=2)=P(X_1=1)P(X_2=2\mid X_1=1)=\dfrac12\times\dfrac13=\dfrac16$
      criteria: ['1.B2']
    - id: 1b-3
      content: |
        • $X_2=1$: $X_1=0$이고 $X_2=1$인 경우 $P(X_2=1)=P(X_1=0)P(X_2=1\mid X_1=0)=\dfrac12\times\dfrac12=\dfrac14$
      criteria: ['1.B3']
    - id: 1b-4
      content: |
        • $X_2=0$: $X_1=0$이고 $X_2=0$인 경우 또는 $X_1=1$이고 $X_2=0$인 경우
        $$P(X_2=0)=P(X_1=0)P(X_2=0\mid X_1=0)+P(X_1=1)P(X_2=0\mid X_1=1)=\dfrac12\times\dfrac12+\dfrac12\times\dfrac23=\dfrac{7}{12}$$
      criteria: ['1.B4']
    - id: 1b-5
      content: |
        즉, 확률변수 $X_2$의 확률분포를 표로 나타내면 다음과 같다.
        $X_2$: $0$, $1$, $2$, 합계 / $P(X_2=x)$: $\dfrac{7}{12}$, $\dfrac14$, $\dfrac16$, $1$
      criteria: ['1.B5']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        $X_1$의 확률분포($P(X_1=0)=P(X_1=1)=\dfrac12$)가 정확하다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 1
      evidence: |
        $P(X_2=2)$ 확률의 수식이 정확하며 답($\dfrac16$)도 정확하다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 1
      evidence: |
        $P(X_2=1)$ 확률의 수식이 정확하며 답($\dfrac14$)도 정확하다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.B4
      mark_type: B
      points: 3
      evidence: |
        $P(X_2=0)$ 확률의 수식(두 경우의 합)이 정확하며 답($\dfrac{7}{12}$)도 정확하다.
      depends_on: []
      implied_ok: false
      steps: [1b-4]
    - id: 1.B5
      mark_type: B
      points: 1
      evidence: |
        확률분포표가 정확하다.
      depends_on: []
      implied_ok: false
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 설명이 없이 맞는 답안만 제시된 경우
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    3번째 시행 후 얻은 점수가 0일 확률 $\mathrm{P}(X_3=0)$을 구하시오.
  points: 8
  depends_on: ['1']
  answer: {kind: value, value: '7/12', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $X_2=0$인 경우와 $X_2\neq0$인 경우로 나누어 조건부확률의 합으로 계산한다.
    steps:
    - {id: 2a, content: '$\tfrac7{12}\cdot\tfrac12+\tfrac14\cdot\tfrac23+\tfrac16\cdot\tfrac34=\tfrac7{12}$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $X_2$의 값에 따라 $X_3=0$이 될 확률이 다르다.
  - id: S2-B
    audience: B
    source_flow: G26_seoul.pdf p.13(인쇄 76쪽)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $X_3=0$의 확률은 다음과 같이 생각해 볼 수 있다.
        $$P(X_3=0)=P(X_2=0)P(X_3=0\mid X_2=0)+P(X_2\neq0)P(X_3=0\mid X_2\neq0)$$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $P(X_2=0)P(X_3=0\mid X_2=0)=\dfrac{7}{12}\times\dfrac12=\dfrac{7}{24}$
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $P(X_2\neq0)P(X_3=0\mid X_2\neq0)=P(X_2=1)P(X_3=0\mid X_2=1)+P(X_2=2)P(X_3=0\mid X_2=2)=\dfrac14\times\dfrac23+\dfrac16\times\dfrac34=\dfrac{7}{24}$
        $\therefore P(X_3=0)=\dfrac{7}{24}+\dfrac{7}{24}=\dfrac{7}{12}$
      criteria: ['2.A2']
  - id: S2-ALT
    audience: ALT
    source_flow: G26_seoul.pdf p.14(인쇄 77쪽) [다른 방법]
    method_no: 2
    key_idea: 원 해설 다른 방법 — $P(X_3=3)$, $P(X_3=2)$, $P(X_3=1)$을 구해 여사건으로 계산한다.
    steps:
    - id: 2c-1
      content: |
        $P(X_3=3)=P(X_2=2)P(X_3=3\mid X_2=2)=\dfrac16\times\dfrac14=\dfrac{1}{24}$
        $P(X_3=2)=P(X_2=1)P(X_3=2\mid X_2=1)=\dfrac14\times\dfrac13=\dfrac{1}{12}$
        $P(X_3=1)=P(X_2=0)P(X_3=1\mid X_2=0)=\dfrac{7}{12}\times\dfrac12=\dfrac{7}{24}$
        $\therefore P(X_3=0)=1-P(X_3=1)-P(X_3=2)-P(X_3=3)=1-\dfrac{7}{24}-\dfrac{1}{12}-\dfrac{1}{24}=\dfrac{7}{12}$
      criteria: ['2.M1', '2.A1', '2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $P(X_3=0)$을 두 확률의 합으로 표현한 수식이 정확하다. ([다른 답안] 방식: $P(X_3=3)$ 수식·답 정확 2점)
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.B4, 1.B5], max_points: 2}
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $P(X_2=0)P(B_3\mid X_2=0)=\dfrac{7}{24}$ 수식과 답이 정확하다. ([다른 답안] 방식: $P(X_3=2)$ 수식·답 정확 2점)
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: |
        $P(X_2\neq0)P(B_3\mid X_2\neq0)=\dfrac{7}{24}$ 수식과 답이 정확하다. ([다른 답안] 방식: $P(X_3=1)$, $P(X_3=0)$ 각 2점)
      depends_on: [2.M1]
      steps: [2b-3, 2c-1]
    deductions:
    - code: D2-1
      condition: 설명이 없이 맞는 답안만 제시된 경우
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    이 게임을 3번 시행하여 0점이 나온 사건을 $C$라 하자. 게임을 3번 시행하는 작업을 $m$번 독립적으로 반복할 때, 사건 $C$가 일어나는 횟수를 확률변수 $Y$라고 하자. $\mathrm{V}(2Y+3)=280$일 때, $m$의 값을 구하시오.
  points: 8
  depends_on: ['2']
  answer: {kind: value, value: '288', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $Y\sim\mathrm{B}\left(m,\dfrac{7}{12}\right)$이고 $V(2Y+3)=4V(Y)$.
    steps:
    - {id: 3a, content: '$4\cdot m\cdot\tfrac7{12}\cdot\tfrac5{12}=280\Rightarrow m=288$', criteria: ['3.M1', '3.A1', '3.A2']}
    hint_ladder:
    - $Y$는 어떤 분포를 따르는가?
  - id: S3-B
    audience: B
    source_flow: G26_seoul.pdf p.14(인쇄 77쪽)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        한 번의 작업에서 사건 $C$가 일어날 확률은 $p=\mathrm{P}(X_3=0)=\dfrac{7}{12}$로 일정하므로, 확률변수 $Y$는 이항분포 $\mathrm{B}\left(m,\dfrac{7}{12}\right)$를 따른다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\mathrm{V}(2Y+3)=2^2\mathrm{V}(Y)=2^2\times m\times\dfrac{7}{12}\times\dfrac{5}{12}=280$이므로
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $m=288$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
