key_idea: |
  직전 점수에 따라 증가·초기화 확률이 정해지는 귀납적 정의를 따라 $X_1\to X_2\to X_3$의 분포를 조건부확률·곱셈정리로 전개하고, $P(X_3=0)=\dfrac{7}{12}$을 성공 확률로 하는 이항분포의 분산·정규근사로 잇는다.
stuck: |
  $P(X_3=0)$을 $X_2$의 값으로 나누어 조건부확률의 합으로 표현하는 것, 그리고 이항분포를 정규분포로 근사하면 평균에서 확률이 0.5가 된다는 것
