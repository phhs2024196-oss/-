- id: '4'
  stem: |
    문항 (3)의 확률변수 $Y$에 대하여, $2Y-3$이 $a$ 이상일 확률이 0.5일 때, $a$의 값을 구하시오. (단, $a$는 상수이다.)
  points: 6
  depends_on: ['3']
  answer: {kind: value, value: '333', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $m$이 충분히 크므로 $2Y-3$을 정규분포로 근사하면 확률 0.5인 경계는 평균 $E(2Y-3)$이다.
    steps:
    - {id: 4a, content: '$E(Y)=168$, $E(2Y-3)=333$, $V(2Y-3)=280$; $P(Z\ge\tfrac{a-333}{\sqrt{280}})=0.5\Rightarrow a=333$', criteria: ['4.B1', '4.R1', '4.M1', '4.A1', '4.A2']}
    hint_ladder:
    - 정규분포에서 확률이 0.5가 되는 경계는 어디인가?
  - id: S4-B
    audience: B
    source_flow: G26_seoul.pdf p.14(인쇄 77쪽)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $\mathrm{E}(Y)=288\times\dfrac{7}{12}=168$이므로, $\mathrm{E}(2Y-3)=2\mathrm{E}(Y)-3=333$, $\mathrm{V}(2Y-3)=280$이다.
      criteria: ['4.B1']
    - id: 4b-2
      content: |
        $mp=288\times\dfrac{7}{12}=168\ge5$이고 $m(1-p)=288\times\dfrac{5}{12}=120\ge5$이므로 $m$은 충분히 크다. (원문은 「$n$은 충분히 크다」로 표기)
      criteria: ['4.R1']
    - id: 4b-3
      content: |
        그러므로 이항분포와 정규분포의 관계를 이용하면
        $$\mathrm{P}(2Y-3\ge a)=\mathrm{P}\left(Z\ge\dfrac{a-333}{\sqrt{280}}\right)=\mathrm{P}(Z\ge0)=0.5$$
      criteria: ['4.M1', '4.A1']
    - id: 4b-4
      content: |
        즉, 확률변수 $2Y-3$이 $a=333$ 이상일 확률이 0.5이다. $\therefore a=333$
      criteria: ['4.A2']
