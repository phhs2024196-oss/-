  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $(-\vec u)\cdot\overrightarrow{F_2}=3k-\dfrac92>0$에서 $k\ge2$이고, $k=2$일 때 이 내적 $\dfrac32$가 양수 내적 중 최소임을 확인한다.
    steps:
    - {id: 3a, content: '$\overrightarrow{F_2}=\left(-\tfrac{3\sqrt3}{2}+\sqrt3k,-\tfrac{15}{2}\right)$, $(\sqrt3,0)\cdot\overrightarrow{F_2}=-\tfrac92+3k$; $k=2$에서 $\tfrac32$가 최소', criteria: ['3.B1', '3.R1', '3.A1']}
    hint_ladder:
    - 반대 경로의 기본벡터 $-\vec u$와 $\overrightarrow{F_2}$의 내적이 양수가 되어야 한다.
    - 그 내적이 다른 기본벡터들과의 양의 내적보다 작은지도 확인하자.
  - id: S3-B
    audience: B
    source_flow: G26_seoul.pdf p.22(인쇄 85쪽)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        좌표평면상에서 $\overrightarrow{F_2}=3\overrightarrow{F_1}+(\sqrt3k,0)=3\left(-\dfrac{\sqrt3}{2},-\dfrac52\right)+(\sqrt3k,0)=\left(-\dfrac{3\sqrt3}{2}+\sqrt3k,\,-\dfrac{15}{2}\right)$
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        문항 (2)에서 도출된 $\vec u=(-\sqrt3,0)$와 방향이 반대인 기본벡터 $-\vec u$의 성분은 $(\sqrt3,0)$이다. 이때, $(-\vec u)\cdot\overrightarrow{F_2}=(\sqrt3,0)\cdot\left(-\dfrac{3\sqrt3}{2}+\sqrt3k,-\dfrac{15}{2}\right)=-\dfrac92+3k$이다.
        $k=1$일 때, $(-\vec u)\cdot\overrightarrow{F_2}=-\dfrac32$이므로 문항 (2)의 $\vec u\cdot\vec F>0$ 조건을 만족하지 않아 경로 변경이 불가능하다.
        $k=2$일 때, $(-\vec u)\cdot\overrightarrow{F_2}=\dfrac32$이므로 문항 (2)의 $\vec u\cdot\vec F>0$ 조건을 만족한다.
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        $k=2$일 때, 문항 (1)에서 도출한 나머지 기본벡터들과 $\overrightarrow{F_2}=\left(\dfrac{\sqrt3}{2},-\dfrac{15}{2}\right)$의 내적을 계산한다. 우선 $\vec u\cdot\vec F>0$인 조건을 고려하면, 두 벡터 $\vec u$, $\vec F$가 이루는 각의 크기가 $\theta\ (0^\circ\le\theta\le180^\circ)$일 때 $\theta<90^\circ$인 경우만 고려하면 된다. 이 경우,
        $\left(-\dfrac{3\sqrt3}{2},-\dfrac32\right)\cdot\overrightarrow{F_2}=9$, $\left(-\dfrac{\sqrt3}{2},-\dfrac32\right)\cdot\overrightarrow{F_2}=\dfrac{21}{2}$, $(0,-3)\cdot\overrightarrow{F_2}=\dfrac{45}{2}$, $\left(\dfrac{\sqrt3}{2},-\dfrac32\right)\cdot\overrightarrow{F_2}=12$, $\left(\dfrac{3\sqrt3}{2},-\dfrac32\right)\cdot\overrightarrow{F_2}=\dfrac{27}{2}$
        이고, 각각 $\vec u\cdot\vec F>0$ 조건은 만족하지만 $\dfrac32$보다 크다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        따라서 $k=2$일 때, 전자는 문항 (2)에서 도출된 경로의 반대경로로 이동하며, 해당 경로의 단위벡터 성분은 $(\sqrt3,0)$이다. 따라서 $k$의 최솟값은 $2$이다.
      criteria: ['3.A1']
