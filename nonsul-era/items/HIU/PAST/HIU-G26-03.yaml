stimuli:
- label: 제시문
  body: |
    그래핀은 탄소 원자가 정육각형 형태로 무한히 반복되는 벌집모양의 격자구조를 갖는 물질이다. 그래핀의 격자 내 전자는 외부 전자기력에 의해 초기 위치로부터 A 타입 이동경로 (이하 A 경로) 또는 B 타입 이동경로 (이하 B 경로)를 따라 이동한다. 아래 그림은 그래핀 내에서 가능한 A 경로와 B 경로의 예시이며, 각각의 경로는 기본벡터를 사용하여 간략하게 나타낼 수 있다. 이때, 예시 1의 기본벡터와 크기가 같은 기본벡터를 갖는 경로를 'A 경로', 예시 3의 기본벡터와 크기가 같은 기본벡터를 갖는 경로를 'B 경로'로 정의한다. 전자는 초기 위치로부터 A 또는 B 경로만을 따라 이동하며, A 경로를 따라 이동하는 중 B 경로를 따라 이동할 수 없으며, B 경로를 따라 이동하는 중 A 경로를 따라 이동할 수 없다. (단, 외부 전자기력이 변화하면 경로변경 가능하다.)

    [그림: 왼쪽 열 「그래핀에서 전자의 이동경로」, 오른쪽 열 「기본벡터를 통한 표현」. 세로 변을 갖는 정육각형 벌집 격자 위에
    A 타입 이동경로(예시 1): 한 꼭짓점(「전자」)에서 출발해 위-오른쪽 대각 변과 아래-오른쪽 대각 변을 번갈아 지나며 오른쪽 수평 방향으로 나아가는 지그재그 경로 — 기본벡터는 두 변을 지난 수평 오른쪽 화살표(크기 $\sqrt3$).
    A 타입 이동경로(예시 2): 대각 변과 세로 변을 번갈아 지나며 오른쪽 아래로 나아가는 경로 — 기본벡터는 오른쪽 아래(수평에서 $-60^\circ$) 방향 화살표.
    B 타입 이동경로(예시 3): 한 육각형의 왼쪽 위 꼭짓점에서 왼쪽 대각 변·세로 변·오른쪽 대각 변을 따라 내려가 아래로 나아가는 경로 — 기본벡터는 수직 아래 방향 화살표(크기 $3$).
    B 타입 이동경로(예시 4): 오른쪽에서 왼쪽 아래로 대각 변·세로 변을 지나는 경로 — 기본벡터는 왼쪽 아래(수평에서 $210^\circ$) 방향 화살표.]

stem: |
  (제시문의 설정에 대하여 다음 물음에 답하시오.) [판독확인: 원문에는 별도의 공통 발문 없이 (1)~(3)이 이어짐]

subparts:
- id: '1'
  stem: |
    아래의 그래핀 격자 내 전자의 초기 위치를 $(0,0)$이라고 할 때, 임의의 외부 전자기력에 대하여 해당 전자가 가질 수 있는 모든 이동경로에 대한 12개의 기본벡터들을 성분으로 나타내시오. 또한, 12개의 기본벡터들을 취하는 경로들이 A인지 B인지 각각 구분하시오. (아래 좌표평면에서 정육각형의 한 변의 길이는 1이다.)
    [그림: 좌표평면 위의 정육각형(한 변 1, 세로 변을 가짐) 벌집 격자. 원점 $(0,0)$은 격자의 한 꼭짓점이며 $x$축은 원점을 지나는 꼭짓점들을 잇고, 원점에서 위로 세로 변이 뻗어 있다. 왼쪽에 세로 변 길이 1 표시]
  points: 10
  depends_on: []
  answer:
    kind: set
    value: 'A: (sqrt(3),0), (sqrt(3)/2,3/2), (-sqrt(3)/2,3/2), (-sqrt(3),0), (-sqrt(3)/2,-3/2), (sqrt(3)/2,-3/2); B: (3*sqrt(3)/2,3/2), (0,3), (-3*sqrt(3)/2,3/2), (-3*sqrt(3)/2,-3/2), (0,-3), (3*sqrt(3)/2,-3/2)'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: A 경로 기본벡터는 크기 $\sqrt3$(두 변의 합), B 경로 기본벡터는 크기 $3$이며 각각 $60^\circ$ 간격의 6방향이다.
    steps:
    - {id: 1a, content: 'A: $\sqrt3(\cos k60^\circ,\sin k60^\circ)$, B: $3(\cos(30^\circ+k60^\circ),\sin(30^\circ+k60^\circ))$, $k=0,\dots,5$', criteria: ['1.B1', '1.B2']}
    hint_ladder:
    - 예시 1의 기본벡터는 정육각형의 변 몇 개를 합한 것인가?
  - id: S1-B
    audience: B
    source_flow: G26_seoul.pdf p.20~21(인쇄 83~84쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        문항 (1)에서 주어진 좌표평면상에서 전자의 초기 위치 $(0,0)$으로부터 가능한 모든 A 경로와 B 경로들을 해당 기본벡터들로 표시하면 아래 그림과 같다.
        [그림: 원점에서 뻗은 12개의 화살표 — 짧은 빨간 화살표 6개(A 경로), 긴 파란 화살표 6개(B 경로)]
        해당 12개 기본벡터들의 성분을 3시 방향으로부터 반시계 방향으로 구하면 아래와 같다.
        $(\sqrt3,0)$, $\left(\dfrac{3\sqrt3}{2},\dfrac32\right)$, $\left(\dfrac{\sqrt3}{2},\dfrac32\right)$, $(0,3)$, $\left(-\dfrac{\sqrt3}{2},\dfrac32\right)$, $\left(-\dfrac{3\sqrt3}{2},\dfrac32\right)$, $(-\sqrt3,0)$, $\left(-\dfrac{3\sqrt3}{2},-\dfrac32\right)$, $\left(-\dfrac{\sqrt3}{2},-\dfrac32\right)$, $(0,-3)$, $\left(\dfrac{\sqrt3}{2},-\dfrac32\right)$, $\left(\dfrac{3\sqrt3}{2},-\dfrac32\right)$
      criteria: ['1.B1', '1.B2']
    - id: 1b-2
      content: |
        이 때, A 경로 기본벡터와 B 경로 기본벡터를 구분하면,
        A 경로 기본벡터: $(\sqrt3,0)$, $\left(\dfrac{\sqrt3}{2},\dfrac32\right)$, $\left(-\dfrac{\sqrt3}{2},\dfrac32\right)$, $(-\sqrt3,0)$, $\left(-\dfrac{\sqrt3}{2},-\dfrac32\right)$, $\left(\dfrac{\sqrt3}{2},-\dfrac32\right)$
        B 경로 기본벡터: $\left(\dfrac{3\sqrt3}{2},\dfrac32\right)$, $(0,3)$, $\left(-\dfrac{3\sqrt3}{2},\dfrac32\right)$, $\left(-\dfrac{3\sqrt3}{2},-\dfrac32\right)$, $(0,-3)$, $\left(\dfrac{3\sqrt3}{2},-\dfrac32\right)$
      criteria: ['1.B1', '1.B2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: |
        6개 기본벡터들의 좌표를 모두 정확하게 적고, A 경로 B 경로 구분을 모두 정확하게 했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: |
        나머지 6개 기본벡터들의 좌표를 모두 정확하게 적고, A 경로 B 경로 구분을 모두 정확하게 했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    전자는 그래핀 격자 내에서 기본벡터 $\vec{u}$와 전자기력 벡터 $\vec{F}$의 내적 $\vec{u}\cdot\vec{F}>0$이면서, $\vec{u}\cdot\vec{F}$가 최소인 경로를 따라 이동한다. 아래 그림과 같이 전자기력 벡터 $\overrightarrow{F_1}$을 가해 주었을 때, 전자는 문항 (1)에서 도출한 기본벡터들 중, 어떠한 기본벡터를 갖는 경로로 이동할지 그 성분을 나타내시오. 또한, 해당 기본벡터와 $\overrightarrow{F_1}$의 내적을 구하시오. (단, A 경로와 B 경로의 기본벡터들과 $\overrightarrow{F_1}$의 내적이 동일한 경우, 전자는 A 경로로 이동한다.)
    [그림: (1)과 같은 격자 위에 원점 $(0,0)$에서 왼쪽 아래의 격자 꼭짓점으로 향하는 화살표 $\overrightarrow{F_1}$ — 예시 답안에 따르면 $\overrightarrow{F_1}=\left(-\dfrac{\sqrt3}{2},-\dfrac52\right)$]
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'u = (-sqrt(3), 0); dot = 3/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{F_1}=\left(-\dfrac{\sqrt3}{2},-\dfrac52\right)$와 12개 벡터의 내적 중 양수 최솟값은 $\dfrac32$이고, A·B 두 벡터가 공동이므로 A 경로를 택한다.
    steps:
    - {id: 2a, content: '$(-\sqrt3,0)\cdot\overrightarrow{F_1}=\tfrac32=\left(\tfrac{3\sqrt3}{2},-\tfrac32\right)\cdot\overrightarrow{F_1}$ → A 경로 $(-\sqrt3,0)$', criteria: ['2.B1', '2.B2', '2.B3']}
    hint_ladder:
    - 그림에서 $\overrightarrow{F_1}$의 끝점 좌표를 격자에서 읽어 보자.
  - id: S2-B
    audience: B
    source_flow: G26_seoul.pdf p.21(인쇄 84쪽)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        좌표평면상에서 $\overrightarrow{F_1}$의 성분은 $\left(-\dfrac{\sqrt3}{2},-\dfrac52\right)$이며, 이를 문항 (1)로부터 도출한 기본벡터들과 함께 좌표평면에 나타낸다.
        $\vec u\cdot\vec F>0$ 조건을 만족하면서 내적이 최소인 기본벡터 $\vec u$는 $(-\sqrt3,0)$, $\left(\dfrac{3\sqrt3}{2},-\dfrac32\right)$이다. (그림에서 점선 동그라미로 표시)
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        이중 전자는 A 경로를 따르므로 $(-\sqrt3,0)$의 기본벡터를 따라 이동한다.
      criteria: ['2.B2']
    - id: 2b-3
      content: |
        또한 $\vec u\cdot\overrightarrow{F_1}=(-\sqrt3,0)\cdot\left(-\dfrac{\sqrt3}{2},-\dfrac52\right)=\dfrac32$이다.
      criteria: ['2.B3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 4
      evidence: |
        $\vec u\cdot\overrightarrow{F_1}>0$ 조건을 만족하면서 내적이 최소인 기본벡터 $\vec u$ 두 개($(-\sqrt3,0)$, $\left(\dfrac{3\sqrt3}{2},-\dfrac32\right)$)를 모두 정확하게 적고, A 경로인지 B 경로인지 정확하게 명시했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.B1, 1.B2], max_points: 4}
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: |
        이동경로에 대한 기본벡터 $(-\sqrt3,0)$을 정확하게 명시했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: |
        내적값 $\dfrac32$를 정확하게 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    문항 (2)에서 전자기력 벡터 $\overrightarrow{F_1}$을 $\overrightarrow{F_2}=3\overrightarrow{F_1}+(\sqrt3k,0)$로 변화시켰다. 이때, 전자의 이동이 문항 (2)에서 도출된 경로로부터 반대 경로로 변경되는 양의 정수 $k$의 최솟값을 구하시오. (단, 반대 경로란 방향이 반대인 기본벡터 $-\vec{u}$를 갖는 경로를 의미한다.)
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
