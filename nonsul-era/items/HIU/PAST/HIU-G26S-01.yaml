stimuli: []

stem: |
  수열 $\{a_n\}$이 $a_1=6$, $a_2=4$, $a_3=3$이고, 등비수열 $\{b_n\}$이 모든 자연수 $n$에 대하여 $b_n=a_n+\alpha$일 때, $a_7$의 값을 구하시오. (단, $\alpha$는 상수이다.)

subparts:
- id: '1'
  stem: |
    위 물음에 답하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '33/16', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 등비중항으로 $\alpha=-2$, $b_n=4\left(\dfrac12\right)^{n-1}$, $a_7=b_7+2$.
    steps:
    - {id: 1a, content: '$(4+\alpha)^2=(6+\alpha)(3+\alpha)\Rightarrow\alpha=-2$, $r=\tfrac12$, $a_7=\tfrac1{16}+2=\tfrac{33}{16}$', criteria: ['1.M1', '1.A1', '1.A2', '1.A3']}
    hint_ladder:
    - $b_1$, $b_2$, $b_3$은 등비수열의 연속한 세 항이다.
  - id: S1-B
    audience: B
    source_flow: G26_sejong.pdf p.2~3(인쇄 87~88쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        등비중항 식으로부터 $\alpha$를 먼저 구한다. $b_2=4+\alpha$가 $b_1=6+\alpha$과 $b_3=3+\alpha$의 등비중항이므로
        $$b_2^2=(4+\alpha)^2=b_1b_3=(6+\alpha)(3+\alpha),\quad \alpha^2+8\alpha+16=\alpha^2+9\alpha+18,\quad \alpha=-2$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        다음으로 등비수열 $\{b_n\}$의 공비 $r$를 구한다. $b_1=6-2=4$, $b_2=4+(-2)=2$, $r=\dfrac{b_2}{b_1}=\dfrac24=\dfrac12$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        이제 $\{b_n\}$은 공비 $\dfrac12$, 초항 4인 등비수열이므로 $b_n=4\left(\dfrac12\right)^{n-1}$, $b_7=4\cdot2^{-6}=\dfrac{1}{16}$.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        마지막으로 $b_7=a_7-2$, $a_7=b_7+2=\dfrac{33}{16}$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
