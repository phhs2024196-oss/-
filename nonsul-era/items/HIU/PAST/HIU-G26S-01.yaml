      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\{b_n\}$의 일반항의 식 $b_n=4\left(\dfrac12\right)^{n-1}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        $b_7=\dfrac1{16}$과 $a_7=\dfrac{33}{16}$의 값을 구했다.
      depends_on: [1.M1]
      steps: [1b-4]
    deductions: []
