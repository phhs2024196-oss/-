  주어진 조건에서 함수의 극한의 성질을 이용하여 다항함수를 추론할 수 있는지를 확인하는 문항으로 교육과정의 성취기준에 근거한다.
key_idea: |
  (가)에서 $x^2f\left(\dfrac1x\right)\to-1$이므로 $f$는 이차항 계수 $-1$인 이차함수, (나)에서 $f(-1)=0$이므로 $x+1$이 인수이다.
stuck: |
  $x\to0$일 때 $x^2f\left(\dfrac1x\right)$의 극한이 $f$의 차수와 최고차항 계수를 결정한다는 해석
