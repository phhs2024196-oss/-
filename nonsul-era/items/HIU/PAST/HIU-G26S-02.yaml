stimuli: []

stem: |
  다항함수 $f(x)$가 다음 두 조건을 모두 만족시킬 때, $f(2)$의 값을 구하시오.
  (가) $\displaystyle\lim_{x\to0}x^2f\left(\dfrac1x\right)=-1$
  (나) $\displaystyle\lim_{x\to-1}\dfrac{f(x)}{x+1}=f(1)$

subparts:
- id: '1'
  stem: |
    위 물음에 답하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=(x+1)(-x+b)$로 두고 (나)에서 $b+1=2b-2$.
    steps:
    - {id: 1a, content: '$f(x)=-x^2+ax+b=(x+1)(-x+b)$, $b+1=2b-2\Rightarrow b=3$, $f(2)=3$', criteria: ['1.M1', '1.M2', '1.A1', '1.A2']}
    hint_ladder:
    - $x^2f\left(\dfrac1x\right)$에서 $f$가 삼차 이상이거나 일차 이하이면 극한은 어떻게 되는가?
  - id: S1-B
    audience: B
    source_flow: G26_sejong.pdf p.5(인쇄 90쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가)로부터 $f(x)$의 차수가 2이며 이차항의 계수가 $-1$임을 안다. $f(x)=-x^2+ax+b$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (나)로부터 $x+1$이 $f(x)$의 인수가 됨을 안다. $f(x)=(x+1)(-x+b)$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        이제 $\displaystyle\lim_{x\to-1}\dfrac{f(x)}{x+1}=\lim_{x\to-1}(-x+b)=b+1=f(1)=(1+1)(-1+b)=2b-2$
        또는 $\displaystyle\lim_{x\to-1}\dfrac{f(x)}{x+1}=\lim_{x\to-1}\dfrac{f(x)-f(-1)}{x-(-1)}=f'(-1)=b+1=f(1)=2b-2$
        이므로 $b=3$, $f(x)=(x+1)(-x+3)=-x^2+2x+3$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        마지막으로 $f(2)=-4+4+3=3$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        (가)로부터 $f(x)$의 차수가 2이며 이차항의 계수가 $-1$임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        (나)로부터 $x+1$이 $f(x)$의 인수임을 알고 $f(x)$를 인수분해 형태로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        극한값 $\displaystyle\lim_{x\to-1}\dfrac{f(x)}{x+1}$과 $f(1)$을 각각 계산하고 비교하여 $f(x)=-x^2+2x+3$을 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        함수값 $f(2)=3$을 계산했다.
      depends_on: [1.M1]
      steps: [1b-4]
    deductions: []
