stimuli: []

stem: |
  $-\dfrac{\pi}{2}<x<\dfrac{\pi}{2}$일 때, 방정식 $3\tan^2x-8\tan x-3=0$을 만족시키는 모든 실근 $x$에 대하여 $\cos x$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    위 물음에 답하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '{1/sqrt(10), 3/sqrt(10)}', equivalents: ['{sqrt(10)/10, 3*sqrt(10)/10}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\tan x=3$ 또는 $-\dfrac13$이고, 각각 $\cos x=\dfrac1{\sqrt{10}}$, $\dfrac3{\sqrt{10}}$.
    steps:
    - {id: 1a, content: '$(3t+1)(t-3)=0$; $\cos^2x=\tfrac{1}{1+t^2}$, $\cos x>0$', criteria: ['1.B1', '1.B2']}
    hint_ladder:
    - $\tan x=t$로 치환하면 어떤 방정식이 되는가?
  - id: S1-B
    audience: B
    source_flow: G26_sejong.pdf p.7(인쇄 92쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\tan x=t$라고 치환하면 주어진 방정식은 $3t^2-8t-3=(3t+1)(t-3)=0$이므로 $t=3$ 또는 $t=-\dfrac13$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $\tan x=\dfrac{\sin x}{\cos x}=3$인 경우, $x\in\left(0,\dfrac{\pi}{2}\right)$이고 양변을 제곱하고 $\sin^2x=1-\cos^2x$를 이용하여 풀면 $10\cos^2x=1$이므로 $\cos x=\dfrac{1}{\sqrt{10}}$이다.
        $\tan x=-\dfrac13$인 경우, $x\in\left(-\dfrac{\pi}{2},0\right)$이고 양변을 제곱하여 풀면 $10\cos^2x=9$이고, 4사분면에서 $\cos$은 양수이므로 $\cos x=\dfrac{3}{\sqrt{10}}$이다.
      criteria: ['1.B2']
  - id: S1-ALT
    audience: ALT
    source_flow: G26_sejong.pdf p.7(인쇄 92쪽) 다른 풀이(삼각형 이용)
    method_no: 2
    key_idea: 원 해설 다른 풀이 — 삼각함수의 절댓값은 삼각형을 이용하여 구할 수도 있다.
    steps:
    - id: 1c-1
      content: |
        $\tan x=3$인 경우, 직각삼각형의 밑변과 높이의 길이 비는 $1:3$이고, 피타고라스 정리를 이용하여 빗변의 길이 $=\sqrt{10}$임을 구하고, $\cos x$를 구한다.
        [그림: 밑변 1, 높이 3인 직각삼각형, 밑변과 빗변 사이의 각 $x$]
      criteria: ['1.B2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: |
        $t=\tan x$로 치환한 뒤 $t$에 관한 이차방정식의 해 $t=3$, $t=-\dfrac13$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 6
      evidence: |
        $t=\tan x$임과 $x\in\left(-\dfrac{\pi}{2},\dfrac{\pi}{2}\right)$에서 $\cos$은 양수임을 이용하여 $\cos x=\dfrac{1}{\sqrt{10}}$, $\dfrac{3}{\sqrt{10}}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1c-1]
    deductions: []
