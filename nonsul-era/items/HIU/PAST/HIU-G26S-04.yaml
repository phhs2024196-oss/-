  함수의 연속성의 정의를 이해하는지와 이차방정식의 실근을 구할 수 있는지를 확인하는 문항으로 교육과정의 내용을 반영한다.
key_idea: |
  $x=0$에서 불연속이려면 좌극한 $|a|\neq$ 우극한 $a$, 즉 $a<0$이고, 이때 $x\ge0$에서의 양의 실근 $-\dfrac32+\sqrt{\dfrac94-a}<5$에서 $a>-40$.
stuck: |
  $|a|\neq a$를 $a<0$으로 바꾸고, $x<0$ 부분 $-x+|a|=0$은 실근이 없음을 확인하는 것
