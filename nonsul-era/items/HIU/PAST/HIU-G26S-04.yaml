stimuli: []

stem: |
  함수 $f(x)=\begin{cases}-x+|a| & (x<0)\\ x^2+3x+a & (x\ge0)\end{cases}$는 $x=0$에서만 불연속이다. $x$에 대한 방정식 $f(x)=0$의 실근의 값이 5보다 작을 때, 정수 $a$의 최댓값과 최솟값을 구하시오.

subparts:
- id: '1'
  stem: |
    위 물음에 답하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'max = -1; min = -39', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 불연속 조건 $a<0$, 실근 조건 $a>-40$.
    steps:
    - {id: 1a, content: '$|a|\neq a\Rightarrow a<0$; $\sqrt{\tfrac94-a}<\tfrac{13}{2}\Rightarrow a>-40$; 최댓값 $-1$, 최솟값 $-39$', criteria: ['1.B1', '1.B2']}
    hint_ladder:
    - $x=0$에서의 좌극한과 우극한을 비교해 보자.
  - id: S1-B
    audience: B
    source_flow: G26_sejong.pdf p.9(인쇄 94쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$가 $x=0$에서 불연속이므로 $\displaystyle\lim_{x\to0-}f(x)=|a|\neq\lim_{x\to0+}f(x)=a$이며 즉 $a<0$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        또한, $a<0$일 때 $x>0$에서 $f(x)=x^2+3x+a=0$의 실근 $-\dfrac32+\sqrt{\dfrac94-a}$이 5보다 작아야 하므로
        $$\sqrt{\dfrac94-a}<5+\dfrac32=\dfrac{13}{2},\quad \dfrac94-a<\dfrac{169}{4},\quad a>-\dfrac{160}{4}=-40$$
        이다. 따라서 정수 $a$의 최댓값은 $-1$, 최솟값은 $-39$이다.
      criteria: ['1.B2']
