stimuli: []

stem: |
  함수 $f(x)=2^{x-a}-6a^2$의 그래프와 직선 $y=x$가 두 점 $\mathrm{A}$, $\mathrm{B}$에서 만난다고 하자. $\overline{\mathrm{AB}}=\sqrt2$일 때, 실수 $a$의 값을 모두 구하시오.

subparts:
- id: '1'
  stem: |
    위 물음에 답하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '{-1/2, 1/3}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x_2=x_1+1$, $x_1=a$, $1-6a^2=a$.
    steps:
    - {id: 1a, content: '$x_2-x_1=1$; ㉡$-$㉠: $2^{x_1-a}=1\Rightarrow x_1=a$; $6a^2+a-1=0\Rightarrow a=-\tfrac12,\tfrac13$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 두 교점은 모두 직선 $y=x$ 위에 있다. 좌표를 어떻게 둘 수 있는가?
  - id: S1-B
    audience: B
    source_flow: G26_sejong.pdf p.11~12(인쇄 96~97쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 점 $\mathrm{A}$, $\mathrm{B}$의 $x$좌표를 각각 $x_1$, $x_2\ (x_1<x_2)$라 하면, 두 점은 $y=x$ 위에 있으므로 두 점의 좌표는 $\mathrm{A}(x_1,x_1)$, $\mathrm{B}(x_2,x_2)$이다.
        $\overline{\mathrm{AB}}=\sqrt2$이므로 $\sqrt{(x_2-x_1)^2+(x_2-x_1)^2}=\sqrt2$이고, $x_2-x_1=1$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $x_2=x_1+1$이고, $f(x_1)=x_1$, $f(x_1+1)=x_1+1$
        $2^{x_1-a}-6a^2=x_1$ ⋯⋯ ㉠
        $2^{x_1+1-a}-6a^2=x_1+1$ ⋯⋯ ㉡
        ㉡$-$㉠을 하면 $2^{x_1+1-a}-2^{x_1-a}=1$, $2^{x_1-a}(2-1)=1$, $x_1-a=0$, $x_1=a$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $x_1=a$를 ㉠에 대입하면 $1-6a^2=a$, $6a^2+a-1=0$, $a=-\dfrac12$ 또는 $a=\dfrac13$
        [그림: $a=-\dfrac12$일 때 교점의 $x$좌표 $-\dfrac12$, $\dfrac12$ / $a=\dfrac13$일 때 교점의 $x$좌표 $\dfrac13$, $\dfrac43$인 그래프 (참고)]
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\overline{\mathrm{AB}}=\sqrt2$로부터 $x_2-x_1=1$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        식 $x_1=a$를 옳게 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $6a^2+a-1=0$으로부터 $a=-\dfrac12$ 또는 $a=\dfrac13$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
