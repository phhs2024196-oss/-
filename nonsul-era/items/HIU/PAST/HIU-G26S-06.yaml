stimuli: []

stem: |
  최고차항의 계수가 1인 삼차함수 $f(x)$와 일차함수 $g(x)=3x+1$이 다음 두 조건을 모두 만족시킬 때, $f(3)$의 값을 구하시오.
  (가) $x$에 대한 방정식 $f(x)=g(x)$는 서로 다른 세 실근 $-\alpha$, $0$, $\alpha\ (\alpha>0)$를 갖는다.
  (나) 곡선 $y=f(x)$와 직선 $y=g(x)$로 둘러싸인 부분의 넓이는 $8$이다.

subparts:
- id: '1'
  stem: |
    위 물음에 답하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '25', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)-g(x)=x^3-\alpha^2x$, 넓이 $\dfrac{\alpha^4}{2}=8$에서 $\alpha^2=4$.
    steps:
    - {id: 1a, content: '$f(x)=x^3-4x+3x+1=x^3-x+1$, $f(3)=25$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $f(x)-g(x)$를 세 근으로 인수분해해 보자.
  - id: S1-B
    audience: B
    source_flow: G26_sejong.pdf p.14~15(인쇄 99~100쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$는 최고차항의 계수가 1인 삼차함수이므로 $f(x)=x^3+ax^2+bx+c$라 한다. (가)에 따라 방정식 $f(x)-g(x)=x^3+ax^2+(b-3)x+(c-1)=0$은 $x=0$, $\pm\alpha$를 근으로 가지므로
        $$f(x)-g(x)=x^3+ax^2+(b-3)x+(c-1)=x(x-\alpha)(x+\alpha)=x^3-\alpha^2x$$
        이다. 그러므로 $a=0$, $c=1$, $\alpha=\sqrt{3-b}$이고 서로 다른 세 실근을 갖기 위해서는 $3-b>0$이어야 한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $y=f(x)-g(x)$는 기함수이므로
        $$2\int_0^{\sqrt{3-b}}\left((3-b)x-x^3\right)dx=\dfrac12(3-b)^2=8$$
        이다. $b=7,\,-1$이다. 이 중 $b<3$이어야 하므로 $b=-1$이다. 그러므로 $f(x)=x^3-x+1$이고,
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $f(3)=25$이다.
      criteria: ['1.A2']
  - id: S1-ALT
    audience: ALT
    source_flow: G26_sejong.pdf p.15(인쇄 100쪽) 다른 풀이
    method_no: 2
    key_idea: 원 해설 다른 풀이 — 계수를 두지 않고 $\alpha$로 바로 넓이를 계산한다.
    steps:
    - id: 1c-1
      content: |
        (가)에 따라 $f(x)-g(x)=x(x-\alpha)(x+\alpha)$이고, 이는 기함수이므로 $f$와 $g$로 둘러싸인 부분의 넓이는
        $$2\int_0^{\alpha}\left(-x^3+\alpha^2x\right)dx=\dfrac12\alpha^4=8$$
        이다. 그러므로 $\alpha^2=4$. $f(x)=x^3-\alpha^2x+g(x)=x^3-x+1$이고 $f(3)=25$이다.
      criteria: ['1.M1', '1.A1', '1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        최고차항의 계수가 1인 삼차함수를 $f(x)=x^3+ax^2+bx+c$라고 두고, (가) 조건을 이용하여 $a=0$과 $c=1$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: |
        정적분을 이용하여 $f(x)$와 $g(x)$로 둘러싸인 부분의 넓이를 계산하고 (나) 조건을 이용하여 $b=-1$을 구하고, $f(x)=x^3-x+1$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2, 1c-1]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $f(3)=25$를 구했다.
      depends_on: [1.M1]
      steps: [1b-3, 1c-1]
    deductions: []
