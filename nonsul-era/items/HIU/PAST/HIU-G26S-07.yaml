key_idea: |
  $f$의 극댓값 $f(0)=a$, 극솟값 $f(2)=a-4$와 $0$의 대소 관계로 $\lvert f(x)\rvert$의 개형을 분류하고, 극값(서로 다른 값)의 개수가 2개인 경우를 찾는다.
stuck: |
  $\lvert f\rvert$의 극값에 $f(x)=0$인 점의 값 $0$이 포함되고, 「극값의 개수」를 서로 다른 극값의 개수로 세면 $\lvert f(0)\rvert=\lvert f(2)\rvert$인 $a=2$도 해가 된다는 것
