stimuli: []

stem: |
  함수 $f(x)=x^3-3x^2+a$에 대하여 함수 $\lvert f(x)\rvert$가 오직 2개의 극값을 갖도록 하는 실수 $a$의 값을 모두 구하시오.

subparts:
- id: '1'
  stem: |
    위 물음에 답하시오.
  points: 15
  depends_on: []
  answer: {kind: set, value: '{0, 2, 4}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 극값 후보는 $\lvert a\rvert$, $\lvert a-4\rvert$, $0$이고, 이 중 서로 다른 값이 2개가 되는 경우는 $a=0$, $a=4$(하나가 0) 또는 $a=2$($\lvert a\rvert=\lvert a-4\rvert$).
    steps:
    - {id: 1a, content: '$a>4$, $2<a<4$, $0<a<2$, $a<0$: 3개; $a=4,2,0$: 2개', criteria: ['1.B1', '1.R1', '1.R2', '1.R3', '1.R4']}
    hint_ladder:
    - $f(x)$의 극댓값과 극솟값을 먼저 구하자.
    - $\lvert f(x)\rvert$에서는 $f(x)=0$인 점도 극소가 된다.
  - id: S1-B
    audience: B
    source_flow: G26_sejong.pdf p.17~19(인쇄 102~104쪽)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=x^3-3x^2+a$에서 $f^{\prime}(x)=3x^2-6x=3x(x-2)$, $f^{\prime}(x)=0$에서 $x=0$ 또는 $x=2$이다. 함수 $f(x)$의 극값은 $f(0)=a$, $f(2)=8-12+a=a-4$이다. ($x=0$에서 극대, $x=2$에서 극소)
        함수 $\lvert f(x)\rvert=\lvert x^3-3x^2+a\rvert$의 그래프의 개형은 극값 $\lvert f(0)\rvert$, $\lvert f(2)\rvert$, $0$의 대소 관계에 따라서 다음과 같다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        (i) $a>4$일 때, $f(0)>f(2)>0$이고, 방정식 $\lvert f(x)\rvert=0$의 실근을 $\alpha$라 하면 $\lvert f(x)\rvert$는 $x=\alpha$에서 $0$, $x=0$에서 $f(0)$, $x=2$에서 $f(2)$를 극값으로 가지므로 3개의 극값을 가진다.
        (iii) $2<a<4$일 때, $-f(2)<f(0)$이고, 방정식 $\lvert f(x)\rvert=0$의 서로 다른 실근을 $\alpha$, $\beta$, $\gamma$라 하면 극값은 $0$, $f(0)$, $-f(2)$이므로 3개의 극값을 가진다.
        (v) $0<a<2$일 때, $0<f(0)<-f(2)$이고, 극값은 $0$, $f(0)$, $-f(2)$이므로 3개의 극값을 가진다.
        (vii) $a<0$일 때, $0<-f(0)<-f(2)$이고, 방정식 $\lvert f(x)\rvert=0$의 실근을 $\alpha$라 하면 극값은 $-f(0)$, $-f(2)$, $0$이므로 3개의 극값을 가진다.
        [그림: 각 경우의 $\lvert f(x)\rvert$ 그래프 개형과 증감표]
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        (ii) $a=4$일 때, $f(2)=0$이고 방정식 $\lvert f(x)\rvert=0$의 서로 다른 실근을 $\alpha$, $2$라 하면 극값은 $x=\alpha$에서 $0$, $x=0$에서 $f(0)$, $x=2$에서 $0$이므로 $\lvert f(x)\rvert$는 2개의 극값을 가진다.
      criteria: ['1.R2']
    - id: 1b-4
      content: |
        (iv) $a=2$일 때, $f(0)=-f(2)$이고 방정식 $\lvert f(x)\rvert=0$의 서로 다른 실근을 $\alpha$, $\beta$, $\gamma$라 하면 극값은 $0$, $f(0)$, $-f(2)\,(=f(0))$이므로 $\lvert f(x)\rvert$는 2개의 극값을 가진다.
      criteria: ['1.R3']
    - id: 1b-5
      content: |
        (vi) $a=0$일 때, $f(0)=0$이고 방정식 $\lvert f(x)\rvert=0$의 서로 다른 실근을 $0$, $\alpha$라 하면 극값은 $x=0$에서 $0$, $x=2$에서 $-f(2)$, $x=\alpha$에서 $0$이므로 $\lvert f(x)\rvert$는 2개의 극값을 가진다.
        (i)~(vii)에 의하여 $a=0$, $a=2$, $a=4$이다.
      criteria: ['1.R4']
