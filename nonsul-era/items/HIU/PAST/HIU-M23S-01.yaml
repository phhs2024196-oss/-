intent: |
  지수함수의 그래프를 대칭이동, 평행이동 시켜 함수를 구한다. 지수함수와 로그함수는 서로 역함수임을 이용하여 역함수를 구하고, 지수함수, 로그함수의 성질을 활용하여 답을 구한다.
key_idea: |
  $f(x)=2^{-(x-2)}-8$, $g(x)=-\log_2(x+8)+2$. $g(a)=0\iff a=f(0)$로 $a$를 바로 구한다.
stuck: |
  $y$축 대칭 후 평행이동의 순서($2^{-x}\to2^{-(x-2)}$)
