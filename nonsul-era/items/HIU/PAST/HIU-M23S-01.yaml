stimuli: []

stem: |
  함수 $y=f(x)$의 그래프는 함수 $y=2^x$의 그래프를 $y$축에 대해 대칭이동 시킨 후, $x$축의 방향으로 2만큼, $y$축의 방향으로 $-8$만큼 평행이동한 것이다. 함수 $f(x)$의 역함수 $g(x)$를 구하고, $y=g(x)$가 점 $(a,0)$, $(0,b)$를 지날 때, $a^2+b$를 구하시오.

subparts:
- id: '1'
  stem: |
    함수 $f(x)$의 역함수 $g(x)$를 구하고, $y=g(x)$가 점 $(a,0)$, $(0,b)$를 지날 때, $a^2+b$를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'g = -log(x + 8, 2) + 2; a**2 + b = 15', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a=f(0)=-4$, $b=g(0)=-1$.
    steps:
    - {id: 1a, content: '$f(x)=2^{-(x-2)}-8$, $g(x)=-\log_2(x+8)+2$, $a=f(0)=-4$, $b=g(0)=-1$, $a^2+b=15$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2', '1.A3', '1.A4']}
    hint_ladder:
    - 역함수가 점 $(a,0)$을 지나면 원래 함수는 어느 점을 지나는가?
  - id: S1-B
    audience: B
    source_flow: X23_sejong_example.pdf p.2
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        지수함수 $y=2^x$의 그래프를 $y$축에 대해 대칭이동하면 $y=2^{-x}$이고,
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이를 $x$축의 방향으로 2만큼, $y$축의 방향으로 $-8$만큼 평행이동하면, $f(x)=2^{-(x-2)}-8$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        함수 $y=f(x)$를 $x$에 대하여 정리하면, $x=-\log_2(y+8)+2$이고, $x$와 $y$를 바꾸어 $f(x)$의 역함수 $g(x)$를 구하면 $g(x)=-\log_2(x+8)+2$.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        함수 $g(x)$가 점 $(a,0)$를 지나므로 $g(a)=0$이고, $f(0)=a$이다. 즉, $a=f(0)=2^{-(0-2)}-8=-4$
      criteria: ['1.A2']
    - id: 1b-5
      content: |
        이고, 함수 $g(x)$가 점 $(0,b)$를 지나므로 $g(0)=b$이다. 따라서 $b=-\log_28+2=-1$이고,
      criteria: ['1.A3']
    - id: 1b-6
      content: |
        $a^2+b=16-1=15$
      criteria: ['1.A4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        $y$축 대칭이동한 함수 $y=2^{-x}$를 구했다. (공식 단계 (1) 1점)
      depends_on: []
      implied_ok: true
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        평행이동한 함수 $f(x)=2^{-(x-2)}-8$을 구했다. (공식 단계 (1) 2점)
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        로그함수를 이용하여 역함수 $g(x)=-\log_2(x+8)+2$를 구했다. (공식 단계 (2) 2점)
      depends_on: []
      implied_ok: false
      steps: [1b-3, 1a]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $g(a)=0$ 또는 $f(0)=a$를 이용하여 $a=-4$를 구했다. (공식 단계 (3) 2점)
      depends_on: [1.M2]
      steps: [1b-4, 1a]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        $g(0)=b$ 또는 $f(b)=0$을 이용하여 $b=-1$을 구했다. (공식 단계 (3) 2점)
      depends_on: [1.M2]
      steps: [1b-5, 1a]
    - id: 1.A4
      mark_type: A
      points: 1
      evidence: |
        구해진 $a$, $b$로 $a^2+b=15$를 구했다. (공식 단계 (3) 1점)
      depends_on: [1.M2]
      steps: [1b-6, 1a]
    deductions: []
