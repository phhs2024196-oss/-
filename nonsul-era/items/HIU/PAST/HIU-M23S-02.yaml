stem: |
  함수 $f(x)=-2x^3+3(a-1)x^2+6ax$의 극댓값이 0일 때, $f(1)$의 값을 구하시오. (단, $a\ge0$)

subparts:
- id: '1'
  stem: |
    함수 $f(x)=-2x^3+3(a-1)x^2+6ax$의 극댓값이 0일 때, $f(1)$의 값을 구하시오. (단, $a\ge0$)
  points: 15
  depends_on: []
  answer: {kind: value, value: '-5', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 극대점 $x=a$에서 $f(a)=a^2(a+3)=0$.
    steps:
    - {id: 1a, content: '$f^{\prime}=-6(x-a)(x+1)$, 극대 $x=a$, $f(a)=a^3+3a^2=0\Rightarrow a=0$, $f(1)=-5$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $f^{\prime}(x)$를 인수분해해 보라.
  - id: S1-B
    audience: B
    source_flow: X23_sejong_example.pdf p.3
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f^{\prime}(x)=-6x^2+6(a-1)x+6a=-6(x^2-(a-1)x-a)=-6(x-a)(x+1)=0$에서 $x=-1$ 또는 $x=a$이고, $a\ge0$이므로 함수의 증감을 표로 나타내면 $x<-1$에서 $f^{\prime}(x)<0$(감소), $-1<x<a$에서 $f^{\prime}(x)>0$(증가), $x>a$에서 $f^{\prime}(x)<0$(감소)이다. 따라서, 함수 $f(x)$는 $x=a$에서 극댓값을 갖는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        극댓값이 0이므로, $f(a)=-2a^3+3(a-1)a^2+6a^2=a^3+3a^2=a^2(a+3)=0$이고, $a=-3$ 또는 $a=0$이다. $a\ge0$이므로, $a=0$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서, $f(x)=-2x^3-3x^2$이고, $f(1)=-2-3=-5$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
