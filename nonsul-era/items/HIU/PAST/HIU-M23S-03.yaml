stimuli: []

stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$f(x)=2x^2-4x-\int_0^xf^{\prime}(t)dt$$
  을 만족할 때, 곡선 $y=f(x)$와 $x$축으로 둘러싸인 부분의 넓이를 구하시오.

subparts:
- id: '1'
  stem: |
    곡선 $y=f(x)$와 $x$축으로 둘러싸인 부분의 넓이를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '4/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=x^2-2x$, 넓이 $\int_0^2(2x-x^2)dx$.
    steps:
    - {id: 1a, content: '$f(0)=0$, $f(x)=2x^2-4x-f(x)\Rightarrow f(x)=x^2-2x$, 넓이 $=\tfrac43$', criteria: ['1.B1', '1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $f^{\prime}$의 정적분은 $f$로 어떻게 표현되는가?
  - id: S1-B
    audience: B
    source_flow: X23_sejong_example.pdf p.4
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 식에 $x=0$을 대입하면, $\int_0^0f^{\prime}(t)dt=0$이므로 $f(0)=0$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $\int_0^xf^{\prime}(t)dt=f(x)-f(0)$이므로 $f(x)=2x^2-4x-\int_0^xf^{\prime}(t)dt=2x^2-4x-(f(x)-f(0))=2x^2-4x-f(x)$이고, 정리하면 $2f(x)=2x^2-4x$ 즉, $f(x)=x^2-2x$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $f(x)=x^2-2x=x(x-2)=0$에서 $x=0$ 또는 $x=2$이다. 함수 $y=f(x)$의 그래프는 $x=0$, $x=2$에서 $x$축과 만난다. [그림: 포물선 $y=x^2-2x$와 $x$축 사이, $0\le x\le2$ 부분이 색칠됨]
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        구간 $[0,2]$에서 $f(x)\le0$이므로, 구하는 넓이는
        $$\int_0^2\lvert x^2-2x\rvert dx=\int_0^2-(x^2-2x)dx=-\left[\frac{x^3}{3}-x^2\right]_0^2=-\left(\frac83-4\right)=\frac43$$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
