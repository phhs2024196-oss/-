- id: '4'
  stem: |
    삼각함수의 덧셈정리를 이용하여 등식
    $$\cos(\alpha-\beta)-\cos(\alpha+\beta)=2\sin\alpha\sin\beta,\quad\sin(\alpha-\beta)-\sin(\alpha+\beta)=-2\cos\alpha\sin\beta$$
    이 성립함을 보이고, 이를 이용하여 다음 등식이 성립함을 보이시오.
    $$\sum_{k=1}^{n}\sin kx\sin\frac{x}{2}=\sin\frac{(n+1)x}{2}\sin\frac{nx}{2}$$
    $$\sum_{k=1}^{n}\cos kx\sin\frac{x}{2}=\cos\frac{(n+1)x}{2}\sin\frac{nx}{2}$$
  points: 6
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $\alpha=kx$, $\beta=\frac x2$로 두면 각 항이 망원 합이 된다.
    steps:
    - {id: 4a, content: '$\sin kx\sin\tfrac x2=\tfrac12\left(\cos(k-\tfrac12)x-\cos(k+\tfrac12)x\right)$을 더하면 $\tfrac12\left(\cos\tfrac x2-\cos(n+\tfrac12)x\right)=\sin\tfrac{(n+1)x}{2}\sin\tfrac{nx}{2}$', criteria: ['4.R1', '4.M1', '4.R2']}
    hint_ladder:
    - 곱을 차로 바꾸면 이웃한 항끼리 무엇이 일어나는가?
  - id: S4-B
    audience: B
    source_flow: M26_a.hwp(예시답안_자연) 4. 예시 답안 (4)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        삼각함수의 덧셈정리를 이용하면
        $\cos(\alpha-\beta)-\cos(\alpha+\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta-(\cos\alpha\cos\beta-\sin\alpha\sin\beta)=2\sin\alpha\sin\beta$,
        $\sin(\alpha-\beta)-\sin(\alpha+\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta-(\sin\alpha\cos\beta+\cos\alpha\sin\beta)=-2\cos\alpha\sin\beta$.
      criteria: ['4.R1']
    - id: 4b-2
      content: |
        위의 두 등식을 이용하면,
        $$\sum_{k=1}^{n}\sin kx\sin\frac x2=\sum_{k=1}^{n}\frac12\left(\cos\left(k-\frac12\right)x-\cos\left(k+\frac12\right)x\right)=\frac12\left(\left(\cos\frac x2-\cos\frac{3x}{2}\right)+\left(\cos\frac{3x}{2}-\cos\frac{5x}{2}\right)+\cdots+\left(\cos\left(n-\frac12\right)x-\cos\left(n+\frac12\right)x\right)\right)$$
        $$=\frac12\left(\cos\frac x2-\cos\left(n+\frac12\right)x\right)=\sin\frac{(n+1)x}{2}\sin\frac{nx}{2}$$
      criteria: ['4.M1', '4.R2']
    - id: 4b-3
      content: |
        $$\sum_{k=1}^{n}\cos kx\sin\frac x2=-\sum_{k=1}^{n}\frac12\left(\sin\left(k-\frac12\right)x-\sin\left(k+\frac12\right)x\right)=-\frac12\left(\left(\sin\frac x2-\sin\frac{3x}{2}\right)+\cdots+\left(\sin\left(n-\frac12\right)x-\sin\left(n+\frac12\right)x\right)\right)$$
        $$=-\frac12\left(\sin\frac x2-\sin\left(n+\frac12\right)x\right)=\cos\frac{(n+1)x}{2}\sin\frac{nx}{2}$$
      criteria: ['4.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.R1
      mark_type: R
      points: 2
      evidence: |
        덧셈정리로 두 곱→차 등식을 전개하여 보였다. (자체 배점)
      depends_on: []
      steps: [4b-1, 4a]
    - id: 4.M1
      mark_type: M
      points: 2
      evidence: |
        $\alpha=kx$, $\beta=\dfrac x2$로 두어 각 항을 차로 바꾸고 망원 합으로 정리했다.
      depends_on: []
      implied_ok: false
      steps: [4b-2, 4a]
    - id: 4.R2
      mark_type: R
      points: 2
      evidence: |
        남은 두 항 $\dfrac12\left(\cos\dfrac x2-\cos\left(n+\dfrac12\right)x\right)$ 등을 다시 곱으로 바꾸어 두 등식을 모두 완성했다.
      depends_on: [4.M1, 4.R1]
      steps: [4b-2, 4b-3, 4a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '5'
  stem: |
    문항(4)의 등식을 활용하여 점 $\mathrm{P}_{100}$의 시각 $t$에서의 속도의 크기를 구하고, 반닫힌 구간 $(0,1]$에서 점 $\mathrm{P}_{100}$의 속도의 크기가 $0$이 되는 시각은 모두 몇 개인지 구하시오.
  points: 8
  depends_on: ['1', '4']
  answer: {kind: expression, value: 'speed = 2*pi*Abs(sin(100*pi*t)/sin(pi*t)) (t not integer), 200*pi (t integer); count = 99', equivalents: [], tolerance: null}
  solutions:
  - id: S5-A
    audience: A
    method_no: 1
    key_idea: $x=2\pi t$로 (4)를 적용하면 속력 $2\pi\left\lvert\dfrac{\sin100\pi t}{\sin\pi t}\right\rvert$, 영점은 $t=\dfrac{m}{100}$ ($m=1,\dots,99$).
    steps:
    - {id: 5a, content: '$f^{\prime 2}+g^{\prime 2}=(2\pi)^2\dfrac{\sin^2100\pi t}{\sin^2\pi t}$; $t=1$에서는 $200\pi$; 영점 $99$개', criteria: ['5.M1', '5.A1', '5.B1', '5.A2']}
    hint_ladder:
    - $\mathrm{P}_{100}$의 좌표를 $k$에 대한 합으로 써 보라.
    - $t$가 정수이면 $\sin\pi t=0$이므로 따로 계산해야 한다.
  - id: S5-B
    audience: B
    source_flow: M26_a.hwp(예시답안_자연) 4. 예시 답안 (5)
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        점 $\mathrm{P}_k$는 중심이 $\mathrm{P}_{k-1}$이며 반지름이 $\dfrac1k$인 원 위에 있는 점이며, $k$번째 나무막대가 $x$축과 이루는 각은 $2\pi kt$이므로, 점 $\mathrm{P}_{100}$의 위치 $(x,y)$를 $x=f(t)$, $y=g(t)$라 하면, $f(t)=\displaystyle\sum_{k=1}^{100}\frac1k\cos2\pi kt$, $g(t)=\displaystyle\sum_{k=1}^{100}\frac1k\sin2\pi kt$이며, $f^{\prime}(t)=-2\pi\displaystyle\sum_{k=1}^{100}\sin2\pi kt$, $g^{\prime}(t)=2\pi\displaystyle\sum_{k=1}^{100}\cos2\pi kt$이다.
      criteria: ['5.M1']
    - id: 5b-2
      content: |
        (i) $t$가 정수일 때, $\sin2\pi kt=0$, $\cos2\pi kt=1$이므로, $f^{\prime}(t)=0$, $g^{\prime}(t)=200\pi$, 따라서 속도의 크기는 $200\pi$이다.
      criteria: ['5.B1']
    - id: 5b-3
      content: |
        (ii) $t$가 정수가 아닐 때 문항(4)의 등식에서 $x=2\pi t$라 하면, $\sin\dfrac x2=\sin\pi t\ne0$이므로, $f^{\prime}(t)=-2\pi\dfrac{\sin101\pi t\sin100\pi t}{\sin\pi t}$, $g^{\prime}(t)=2\pi\dfrac{\cos101\pi t\sin100\pi t}{\sin\pi t}$이다. 따라서 $f^{\prime}(t)^2+g^{\prime}(t)^2=(2\pi)^2\dfrac{\sin^2100\pi t}{\sin^2\pi t}$이며, 속도의 크기는 $2\pi\left\lvert\dfrac{\sin100\pi t}{\sin\pi t}\right\rvert$이다.
      criteria: ['5.A1']
    - id: 5b-4
      content: |
        $0<t\le1$의 구간에서 $t=1$일 때는 속도의 크기가 $0$이 아니므로, 속도의 크기가 $0$이 되는 시각은 구간 $0<t<1$에서 $\sin100\pi t=0$의 해이다. 정수 $m$에 대해 $100t=m$이라 두면 $t=\dfrac{m}{100}$이므로, $t=\dfrac{1}{100},\ \dfrac{2}{100},\ \cdots,\ \dfrac{99}{100}$에서 속도의 크기가 $0$이 된다. 따라서, 속도의 크기가 $0$이 되는 시각은 총 $99$개이다.
      criteria: ['5.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 5.M1
      mark_type: M
      points: 2
      evidence: |
        $\mathrm{P}_{100}$의 좌표를 $\sum_{k=1}^{100}\frac1k\cos2\pi kt$, $\sum_{k=1}^{100}\frac1k\sin2\pi kt$로 쓰고 미분했다. (자체 배점)
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [5b-1, 5a]
    - id: 5.A1
      mark_type: A
      points: 3
      evidence: |
        (4)의 등식($x=2\pi t$)으로 속도의 크기 $2\pi\left\lvert\dfrac{\sin100\pi t}{\sin\pi t}\right\rvert$를 얻었다.
      depends_on: [5.M1]
      ft: {allowed: true, from: [4.R2], max_points: 3}
      steps: [5b-3, 5a]
    - id: 5.B1
      mark_type: B
      points: 1
      evidence: |
        $t$가 정수일 때 속도의 크기 $200\pi$를 따로 구했다.
      steps: [5b-2, 5a]
    - id: 5.A2
      mark_type: A
      points: 2
      evidence: |
        $t=1$을 제외하고 $\sin100\pi t=0$의 해 $t=\dfrac{m}{100}$ ($m=1,\dots,99$)를 세어 $99$개를 얻었다.
      depends_on: [5.M1]
      steps: [5b-4, 5a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

