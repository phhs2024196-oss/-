intent: |
  이 문항은 일정한 규칙에 따라 회전하는 여러 개의 나무막대가 모터로 연결된 로봇팔의 운동을 수학적으로 표현함으로써 로봇팔의 끝부분이 움직인 거리, 속도의 크기 등을 구하는 문제로, 실제 공학적 상황을 기반으로 지원자의 수학적 사고력과 문제 해결 능력을 종합적으로 평가한다. 지원자는 회전하는 물체들이 서로 연결되어 있을 때 물체의 위치를 좌표평면상에서 시각에 대한 함수로 표현해야 하며, 이 과정에서 삼각함수의 활용, 수열의 합, 정적분, 그리고 여러가지 함수의 미분 등에 대한 이해가 통합적으로 요구된다.
  이러한 문항 구성은 단편적인 공식 적용을 벗어나, 수학을 이용하여 실제 현상을 해석하고 예측할 수 있는 능력을 평가하는 데 목적이 있다. 문제의 초반부는 비교적 간단한 두 막대의 운동을 분석하도록 하여 기본 개념에 대한 이해도를 확인하고, 이후 단계에서는 $100$번째 막대의 끝점의 위치를 분석함으로써 논리적 추론력과 일반화 능력, 수학적 표현력을 평가한다.
key_idea: |
  $k$번째 막대는 테이블 기준으로 $1$초에 $k$바퀴 돌므로 $\mathrm{P}_n$의 위치는 $\left(\sum_{k=1}^{n}\frac1k\cos2\pi kt,\ \sum_{k=1}^{n}\frac1k\sin2\pi kt\right)$이고, 속도의 합은 곱으로 바꾸는 망원 합으로 닫힌 꼴이 된다.
stuck: |
  $k$번째 막대가 $x$축과 이루는 각이 $2\pi kt$라는 일반화, 그리고 $\sin\dfrac{x}{2}$를 곱해 합을 망원 합으로 바꾸는 발상
