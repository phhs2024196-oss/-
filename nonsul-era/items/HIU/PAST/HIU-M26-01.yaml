stem: |
  홍익이는 과학 수행평가 프로젝트로 나무막대와 모터를 이용하여 평면에서 회전하는 로봇팔을 만들었다. 우선 길이가 $1$m인 첫 번째 나무막대의 한쪽 끝을 테이블에 고정되어 있는 모터에 연결하고, 그 막대의 반대편 끝은 길이가 $\dfrac12$m인 두 번째 나무막대의 한쪽 끝과 모터로 연결하였다. 전원을 연결하면 두 개의 모터가 동시에 작동하여 일정한 속도로 반시계 방향으로 $1$초에 한 바퀴씩 계속 회전한다. 이때 회전하는 두 개의 나무막대는 서로 부딪히지 않고 회전한다. 첫 번째 나무막대는 테이블의 고정점을 기준으로 $1$초에 한 바퀴씩 회전한다. 두 번째 나무막대는 첫 번째 나무막대와 연결된 부분을 기준으로 $1$초에 한 바퀴씩 회전하지만, 첫 번째 나무막대도 동시에 회전하기 때문에 테이블을 기준으로 하면 $1$초에 두 바퀴를 회전하는 것을 관찰하였다.

  다음으로 이러한 로봇팔의 움직임을 일반화하여 아래와 같은 방식으로 나무막대를 계속 이어나갔다. $k$번째 나무막대는 길이는 $\dfrac1k$m이고 그 막대의 한쪽 끝은 $k-1$번째 막대의 끝에 모터로 연결이 되어 있다. 그리고 $k$번째 나무막대는 $k-1$번째 막대와 연결된 부분을 기준으로 $1$초에 한 바퀴씩 계속 서로 부딪히지 않고 회전한다. 홍익이는 로봇팔의 운동을 이해하기 위해 좌표평면을 사용하여 로봇팔의 연결부 위치를 아래와 같이 나타내었다.

  ① 첫 번째 나무막대가 고정된 테이블의 고정점을 원점 $\mathrm{O}$로 하고 첫 번째 막대의 반대편 끝점을 $\mathrm{P}_1$, 두 번째 막대의 끝점을 $\mathrm{P}_2$, 같은 방식으로 $k$번째 나무막대의 끝점을 $\mathrm{P}_k$라 한다. <그림 1, 2>
  ② 시각 $t=0$일 때 $\mathrm{P}_k$의 위치는 $\left(\displaystyle\sum_{n=1}^{k}\frac1n,\ 0\right)$이다. <그림 1>
  ③ 모든 모터가 $t$초간 회전했을 때 각 점의 위치는 <그림 2>와 같다.

  [그림 1: '$t=0$' — 좌표평면에서 원점 $\mathrm{O}$부터 $x$축 양의 방향으로 막대들이 일직선으로 놓여 있고, $x$축 위에 차례로 $\mathrm{P}_1$, $\mathrm{P}_2$, $\mathrm{P}_3$, …, $\mathrm{P}_k$가 표시되어 있다.]
  [그림 2: '$t$초 후' — 원점 $\mathrm{O}$에서 시작한 첫 번째 막대가 반시계 방향으로 회전하여 제1사분면의 $\mathrm{P}_1$에 이르고, 이어서 $\mathrm{P}_2$, $\mathrm{P}_3$, $\mathrm{P}_k$가 점점 짧아지는 막대로 꺾여 이어진 모습. 각 연결부에 회전 방향을 나타내는 곡선 화살표와 범례 '모터의 회전 방향'이 있다.]

subparts:
- id: '1'
  stem: |
    점 $\mathrm{P}_2$의 시각 $t$에서의 위치 $(x,\ y)$가 $x=f(t)$, $y=g(t)$로 나타내어질 때, $f(t)$, $g(t)$를 각각 구하시오.
  points: 5
  depends_on: []
  answer: {kind: expression, value: 'f = cos(2*pi*t) + cos(4*pi*t)/2; g = sin(2*pi*t) + sin(4*pi*t)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 첫 번째 막대의 각은 $2\pi t$, 두 번째 막대가 $x$축과 이루는 각은 $4\pi t$.
    steps:
    - {id: 1a, content: '$f(t)=\cos2\pi t+\tfrac12\cos4\pi t$, $g(t)=\sin2\pi t+\tfrac12\sin4\pi t$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 테이블을 기준으로 두 번째 막대는 1초에 몇 바퀴 도는가?
  - id: S1-B
    audience: B
    source_flow: M26_a.hwp(예시답안_자연) 4. 예시 답안 (1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        첫 번째 나무막대의 길이는 $1$이므로 점 $\mathrm{P}_1$는 중심이 $\mathrm{O}$이며 반지름이 $1$인 원 위에 있는 점이며, 막대가 $x$축과 이루는 각을 $\theta$라 하면 점 $\mathrm{P}_1$의 위치 $(x,y)$는 $x=\cos\theta$, $y=\sin\theta$이다. 시각 $t=0$에서 $\theta=0$이며 나무막대가 $1$초에 한 바퀴 회전하므로 시각 $t$에서 $\theta$는 $\theta=2\pi t$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        점 $\mathrm{P}_2$는 중심이 $\mathrm{P}_1$이며 반지름이 $\dfrac12$인 원 위에 있는 점이며, 두 번째 나무막대가 $x$축과 이루는 각은 $2\theta$이므로 점 $\mathrm{P}_2$의 위치 $(x,y)$는 $x=\cos\theta+\dfrac12\cos2\theta$, $y=\sin\theta+\dfrac12\sin2\theta$이다. 따라서 $f(t)=\cos2\pi t+\dfrac12\cos4\pi t$, $g(t)=\sin2\pi t+\dfrac12\sin4\pi t$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $\mathrm{P}_1=(\cos2\pi t,\sin2\pi t)$, 두 번째 막대가 $x$축과 이루는 각이 $4\pi t$임을 적었다. (자체 배점 — 공식 채점 기준 미공개)
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $f(t)=\cos2\pi t+\dfrac12\cos4\pi t$, $g(t)=\sin2\pi t+\dfrac12\sin4\pi t$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    삼각함수의 덧셈정리를 이용하여 등식
    $$\sin2\alpha=2\sin\alpha\cos\alpha,\quad\cos2\alpha=\cos^2\alpha-\sin^2\alpha$$
    이 성립함을 보이고, 이를 이용하여 문항(1)의 $f(t)$, $g(t)$에 대해 다음 등식이 성립함을 보이시오.
    $$f^{\prime}(t)^2+g^{\prime}(t)^2=16\pi^2\cos^2\pi t$$
  points: 6
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 제곱합을 전개하면 $4\pi^2(2+2\cos2\pi t)$이고 반각 관계로 $16\pi^2\cos^2\pi t$.
    steps:
    - {id: 2a, content: '$f^{\prime 2}+g^{\prime 2}=4\pi^2(2+2\cos(4\pi t-2\pi t))=8\pi^2(1+\cos2\pi t)=16\pi^2\cos^2\pi t$', criteria: ['2.R1', '2.M1', '2.R2']}
    hint_ladder:
    - $\cos2\pi t\cos4\pi t+\sin2\pi t\sin4\pi t$는 무엇과 같은가?
  - id: S2-B
    audience: B
    source_flow: M26_a.hwp(예시답안_자연) 4. 예시 답안 (2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        삼각함수의 덧셈정리를 이용하여
        $\cos2\alpha=\cos(\alpha+\alpha)=\cos\alpha\cos\alpha-\sin\alpha\sin\alpha=\cos^2\alpha-\sin^2\alpha$,
        $\sin2\alpha=\sin(\alpha+\alpha)=\cos\alpha\sin\alpha+\sin\alpha\cos\alpha=2\sin\alpha\cos\alpha$.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        문항 (1)로부터 $f^{\prime}(t)=-2\pi(\sin2\pi t+\sin4\pi t)$, $g^{\prime}(t)=2\pi(\cos2\pi t+\cos4\pi t)$이므로, 위의 두 등식과 $\cos^2\alpha+\sin^2\alpha=1$임을 이용하면,
        $$f^{\prime}(t)^2+g^{\prime}(t)^2=4\pi^2\left((\sin2\pi t+\sin4\pi t)^2+(\cos2\pi t+\cos4\pi t)^2\right)=4\pi^2\left(2+2\cos2\pi t\cos4\pi t+2\sin2\pi t\sin4\pi t\right)$$
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $$=4\pi^2\left(2+2\cos2\pi t(\cos^22\pi t-\sin^22\pi t)+2\sin2\pi t(2\sin2\pi t\cos2\pi t)\right)=4\pi^2\left(2+2(\cos^22\pi t+\sin^22\pi t)\cos2\pi t\right)=4\pi^2(2+2\cos2\pi t)$$
        $$=4\pi^2\left(2+2(\cos^2\pi t-\sin^2\pi t)\right)=4\pi^2\left(2(\cos^2\pi t+\sin^2\pi t)+2(\cos^2\pi t-\sin^2\pi t)\right)=4\pi^2(4\cos^2\pi t)=16\pi^2\cos^2\pi t$$
      criteria: ['2.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        덧셈정리 $\sin(\alpha+\alpha)$, $\cos(\alpha+\alpha)$로 두 배각 등식을 보였다. (자체 배점)
      depends_on: []
      steps: [2b-1, 2a]
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $f^{\prime}(t)$, $g^{\prime}(t)$를 구해 제곱합을 $4\pi^2(2+2\cos2\pi t\cos4\pi t+2\sin2\pi t\sin4\pi t)$로 전개했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [2b-2, 2a]
    - id: 2.R2
      mark_type: R
      points: 2
      evidence: |
        배각 등식을 써서 $4\pi^2(2+2\cos2\pi t)=16\pi^2\cos^2\pi t$까지 논리적으로 이었다.
      depends_on: [2.M1, 2.R1]
      steps: [2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    시각 $t=0$에서 $t=1$까지 점 $\mathrm{P}_2$가 움직인 거리를 구하시오.
  points: 5
  depends_on: ['2']
  answer: {kind: value, value: '8', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 속력 $4\pi\lvert\cos\pi t\rvert$를 $[0,1]$에서 적분.
    steps:
    - {id: 3a, content: '$\int_0^14\pi\lvert\cos\pi t\rvert dt=2\int_0^{1/2}4\pi\cos\pi t\,dt=8$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 절댓값을 벗길 때 $\cos\pi t$의 부호가 바뀌는 곳은?
  - id: S3-B
    audience: B
    source_flow: M26_a.hwp(예시답안_자연) 4. 예시 답안 (3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        문항 (2)로부터 점 $\mathrm{P}_2$의 시각 $t$에서의 속도의 크기는 $\sqrt{f^{\prime}(t)^2+g^{\prime}(t)^2}=4\pi\lvert\cos\pi t\rvert$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        따라서 시각 $t=0$에서 $t=1$까지 점 $\mathrm{P}_2$가 움직인 거리는
        $$\int_0^1\sqrt{f^{\prime}(t)^2+g^{\prime}(t)^2}\,dt=\int_0^{1/2}4\pi\cos\pi t\,dt+\int_{1/2}^{1}4\pi(-\cos\pi t)\,dt=2\int_0^{1/2}4\pi\cos\pi t\,dt=8\sin\pi t\Big|_0^{1/2}=8$$
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
