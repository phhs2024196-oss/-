  공학적 소재를 활용하여 수학적 능력을 측정하고자 함. 좌표공간에서의 두 점 사이의 거리와 단면의 넓이를 이용한 입체도형의 부피를 구하는 문항으로 기하와 미적분 두 과목을 융합하여 학생들의 종합적인 사고력을 요구하는 문항임.
key_idea: |
  원점에서 거리 $r$인 점의 높이 $h(r)=\dfrac{1}{(1+r^2)^{3/2}}-C$가 $r$에 대해 감소하므로, 높이 $t$에서의 단면은 $h(r)=t$인 반지름 $r$의 원이고 $S(t)=\pi r^2$를 $t$로 적분하면 부피가 된다.
