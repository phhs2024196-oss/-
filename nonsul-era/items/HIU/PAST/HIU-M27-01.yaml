stimuli: []

stem: |
  반도체 제작 과정은 한 점 $\mathrm{P}(0,0,1)$에서 실리콘 원자를 $xy$평면 위에 있는 충분히 넓은 기판 위에 뿌려주는 것으로 시작한다. $xy$평면 위의 점 $\mathrm{Q}$에 대하여 두 점 $\mathrm{P}$와 $\mathrm{Q}$ 사이의 거리를 $d$라 하자. 증발 과정을 고려하지 않았을 때, 점 $\mathrm{Q}$에서 쌓이는 실리콘의 높이는 $\dfrac{1}{d^3}$이다.
  실제로 쌓이는 실리콘의 높이는 증발 과정을 통하여 줄어드는데, 기판의 온도가 높으면 실리콘의 증발량이 증가하고, 온도가 낮으면 줄어든다. 기판의 온도가 균일하다고 가정하면, 쌓이는 실리콘의 높이는 양의 상수 $C$만큼 줄어든다. 즉, $\dfrac{1}{d^3}\le C$인 점에서는 실리콘이 모두 증발하여 쌓이지 않으며, $\dfrac{1}{d^3}>C$인 점에서 최종적으로 쌓인 실리콘은 $\dfrac{1}{d^3}-C$의 높이를 갖는다. 점 $\mathrm{P}$에서 뿌려지는 모든 실리콘 원자는 기판에 남아 있거나, 기판에서 증발하여 없어진다.

  [그림 1: 위쪽 그림 — 좌표공간에서 $z$축 위의 점 $\mathrm{P}(0,0,1)$로부터 $xy$평면(기판)으로 실리콘이 뿌려지는 모습(주황색 점선 화살표). 원점 $\mathrm{O}(0,0,0)$을 중심으로 종 모양의 실리콘 더미가 쌓여 있고, 기판 위의 점 $\mathrm{Q}$와 원점 사이의 거리 $r$, $\mathrm{P}$와 $\mathrm{Q}$ 사이의 거리 $d$(파란 점선)가 표시되어 있다. 아래 왼쪽 그림 '단면' — $yz$평면 단면으로, 구간 $[-R,R]$에서 높이가 최대 $t_{\max}$인 종 모양 곡선과, 높이 $t$인 수평선이 곡선과 만나는 점의 $y$좌표 $-r$, $r$이 표시되어 있다. 아래 오른쪽 그림 — 실리콘 더미를 높이 $t$에서 $xy$평면과 평행한 평면으로 자른 입체 모습, 밑면의 범위 $-R$, $0$, $R$ 표시.]

subparts:
- id: '1'
  stem: |
    $C=\dfrac18$일 때, 실리콘이 가장 높이 쌓인 곳의 높이 $t_{\max}$를 구하고, 위에서 내려다 보았을 때 실리콘이 쌓인 부분의 반지름의 길이 $R$을 구하시오.
  points: 7
  depends_on: []
  answer: {kind: expression, value: 't_max = 7/8; R = sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 높이 $h(r)=\dfrac{1}{(1+r^2)^{3/2}}-\dfrac18$은 $r$에 대해 감소하므로 최댓값은 $h(0)$, 쌓인 영역은 $h(r)>0$.
    steps:
    - {id: 1a, content: '$t_{\max}=h(0)=\tfrac78$, $h(r)>0\iff(1+r^2)^{3/2}<8\iff r<\sqrt3$이므로 $R=\sqrt3$', criteria: ['1.B1', '1.B2']}
    hint_ladder:
    - $xy$평면 위의 점 중 $\mathrm{P}$에 가장 가까운 점은 어디인가?
    - $\mathrm{Q}$에서 원점까지의 거리를 $r$이라 하면 $d$는 $r$로 어떻게 표현되는가?
  - id: S1-B
    audience: B
    source_flow: 해설지_서울_자연.pdf p.3-4
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\dfrac{1}{d^3}\ge\dfrac18$일 때, 점 $\mathrm{Q}$에서 실리콘이 쌓인 부분의 높이는 $\dfrac{1}{d^3}-\dfrac18$이므로 $d$가 작을수록 높이가 높다. $xy$평면에서 점 $\mathrm{P}$에 가장 가까운 점은 원점이며, 이때 $d=1$이므로 가장 높이 쌓인 곳의 높이 $t_{\max}$는 $1-\dfrac18=\dfrac78$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        또한, 점 $\mathrm{Q}$에서 원점까지의 거리를 $r$이라 할 때, $d=\sqrt{1+r^2}$이므로 실리콘이 쌓인 부분은 $\dfrac{1}{d^3}=\dfrac{1}{(1+r^2)^{\frac32}}>\dfrac18$을 만족한다. 즉, $0\le r<\sqrt3$이므로 실리콘이 쌓인 부분의 반지름의 길이는 $R=\sqrt3$이다.
      criteria: ['1.B2']
  - id: S1-ALT
    audience: ALT
    source_flow: 해설지_서울_자연.pdf p.4 (다른 풀이)
    method_no: 2
    key_idea: 해설지의 다른 풀이 — 높이 함수 $h(r)$을 미분해 감소함을 보이고 최댓값을 $h(0)$으로 얻는다.
    steps:
    - id: 1c-1
      content: |
        점 $\mathrm{Q}$에 쌓인 실리콘의 높이는 $h(r)=\dfrac{1}{(1+r^2)^{\frac32}}-\dfrac18$이다. 실리콘이 쌓인 부분은 $h(r)>0$ 또는 $0\le r<\sqrt3$을 만족하므로 $R=\sqrt3$이다.
      criteria: ['1.B2']
    - id: 1c-2
      content: |
        $r>0$일 때 $h^{\prime}(r)=-\dfrac{3r}{(1+r^2)^{\frac52}}<0$이므로 $h(r)$는 $0\le r<\sqrt3$에서 감소하여 높이의 최댓값은 $h(0)=1-\dfrac18=\dfrac78$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: |
        가장 높이 쌓인 곳(원점, $d=1$)의 높이 $t_{\max}=\dfrac78$을 근거와 함께 구했다. (공식 채점 기준: 가장 높이 쌓인 곳의 높이를 정확히 구함 3점)
      steps: [1b-1, 1c-2, 1a]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: |
        $d=\sqrt{1+r^2}$로 놓고 $\dfrac{1}{(1+r^2)^{3/2}}>\dfrac18$을 풀어 $R=\sqrt3$을 구했다. (공식 채점 기준: 반지름의 길이를 정확히 구함 4점)
      steps: [1b-2, 1c-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $C=\dfrac18$일 때, [그림 1]과 같이 실리콘이 쌓인 부분을 높이가 $t$인 지점을 지나고 $xy$평면과 평행인 평면으로 자를 때 생기는 단면의 넓이를 $S(t)$라고 하자. $S(t)$를 $t$에 대한 식으로 나타내시오.
  points: 7
  depends_on: ['1']
  answer: {kind: expression, value: 'pi*((1/8 + t)**(-2/3) - 1)', equivalents: ['pi*(4/(1+8*t)**(2/3) - 1)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 높이 $t$의 단면은 $h(r)=t$인 반지름 $r$의 원이다.
    steps:
    - {id: 2a, content: '$(1+r^2)^{-3/2}=\tfrac18+t\Rightarrow r^2=\left(\tfrac18+t\right)^{-2/3}-1$, $S(t)=\pi r^2$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 높이가 $r$에만 의존하면 같은 높이의 점들은 어떤 도형을 이루는가?
  - id: S2-B
    audience: B
    source_flow: 해설지_서울_자연.pdf p.4
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{Q}$에서 원점까지의 거리를 $r$이라 할 때, 실리콘이 쌓인 높이 $h(r)$은 $r$에 대하여 감소하는 함수이므로, 높이가 $h(r)=t$인 평면으로 자른 단면은 반지름의 길이가 $r$인 원 모양이며, 단면의 넓이는 $\pi r^2$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $h(r)=\dfrac{1}{(1+r^2)^{\frac32}}-\dfrac18=t$로부터 $r^2=\left(\dfrac18+t\right)^{-\frac23}-1$이므로
        $S(t)=\pi r^2=\pi\left\{\left(\dfrac18+t\right)^{-\frac23}-1\right\}$이다. (단, $0\le t\le\dfrac78$)
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        단면이 원점을 중심으로 하고 반지름이 $r$($h(r)=t$)인 원임을 서술했다. (공식: 단면의 모양을 정확히 서술함 2점)
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $h(r)=t$를 $r^2$에 대해 풀어 $S(t)=\pi\left\{\left(\dfrac18+t\right)^{-2/3}-1\right\}$을 얻었다. (공식: 정확한 풀이 과정을 통해 $S(t)$를 구함 5점)
      depends_on: [2.M1]
      steps: [2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    문항(2)의 결과를 사용하여, $C=\dfrac18$일 때 실리콘이 쌓인 부분의 부피를 구하시오.
  points: 7
  depends_on: ['1', '2']
  answer: {kind: value, value: '5*pi/8', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 부피 $=\int_0^{7/8}S(t)\,dt$.
    steps:
    - {id: 3a, content: '$\int_0^{7/8}\pi\left\{\left(\tfrac18+t\right)^{-2/3}-1\right\}dt=\pi\left[3\left(\tfrac18+t\right)^{1/3}-t\right]_0^{7/8}=\tfrac{5\pi}{8}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 단면의 넓이를 높이 방향으로 적분하면 무엇이 되는가?
  - id: S3-B
    audience: B
    source_flow: 해설지_서울_자연.pdf p.4
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        문항(2)의 결과를 사용하여 실리콘이 쌓인 부분의 부피를 구하면 $\displaystyle\int_0^{\frac78}S(t)\,dt=\int_0^{\frac78}\pi\left\{\left(\dfrac18+t\right)^{-\frac23}-1\right\}dt$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $$\int_0^{\frac78}S(t)\,dt=\left[\pi\left\{3\left(\dfrac18+t\right)^{\frac13}-t\right\}\right]_0^{\frac78}=\pi\left\{\left(3-\dfrac78\right)-3\times\left(\dfrac18\right)^{\frac13}\right\}=\dfrac{5\pi}{8}$$
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        부피를 $\displaystyle\int_0^{7/8}S(t)\,dt$의 적분 식으로 표현했다. (공식 2점)
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 2}
      steps: [3b-1, 3a]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        적분을 계산하여 $\dfrac{5\pi}{8}$을 얻었다. (공식 5점)
      depends_on: [3.M1]
      steps: [3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    $C\to0+$일 때, 실리콘이 쌓인 부분의 부피의 극한값을 구하고, $C=\dfrac18$일 때, 총 뿌려진 실리콘 중 증발하지 않고 기판에 남아있는 실리콘의 비율을 구하시오.
  points: 9
  depends_on: ['3']
  answer: {kind: expression, value: 'limit = 2*pi; ratio = 5/16', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 일반 $C$에 대해 $V(C)=\pi(2+C-3C^{1/3})$, $C\to0+$이면 총량 $2\pi$.
    steps:
