stimuli: []

stem: |
  함수 $y=2\sin^2x-4\cos x$의 최댓값을 구하시오. (단 $x$의 범위는 $0\le x\le2\pi$이다)

subparts:
- id: '1'
  stem: |
    함수 $y=2\sin^2x-4\cos x$의 최댓값을 구하시오. (단 $x$의 범위는 $0\le x\le2\pi$이다)
  points: 10
  depends_on: []
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t=\cos x$로 치환해 $[-1,1]$에서 이차함수의 최댓값을 구한다.
    steps:
    - {id: 1a, content: '$y=-2t^2-4t+2=-2(t+1)^2+4$, $-1\le t\le1$에서 $t=-1$일 때 최댓값 $4$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 사인과 코사인 중 하나로 통일할 수 있는가?
    - 치환한 변수가 가질 수 있는 값의 범위는?
  - id: S1-B
    audience: B
    source_flow: 해설지_세종_자연.pdf p.2
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가) 공식 $\sin^2x=1-\cos^2x$을 이용하여 주어진 식을 다음과 같이 바꾼다.
        $$y=2\sin^2x-4\cos x=2(1-\cos^2x)-4\cos x=-2\cos^2x-4\cos x+2$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (나) 이제, $t=\cos x$라 치환하면, 위 식은 $y=-2t^2-4t+2=-2(t+1)^2+4$. 한편, $\cos x$는 $-1$과 $1$ 사이의 모든 값을 가질 수 있으므로, $-1\le t\le1$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        (다) $y=-2(t+1)^2+4$의 그래프는 위로 볼록한 포물선이며, 꼭짓점은 $y$는 $t=-1$일 때 최대가 되며, $t=-1$은 주어진 범위 $-1\le t\le1$에 포함되므로 $y$는 $t=-1$일 때, 즉 $x=\pi$일 때 최댓값을 갖는다. 따라서 최댓값은 $y=-2(-1+1)^2+4=4$임을 알 수 있다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\sin^2x=1-\cos^2x$를 이용하여 함수를 $\cos x$에 대한 식 $-2\cos^2x-4\cos x+2$로 변환했다. (공식 3점)
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        $t=\cos x$로 치환하고 $t$의 범위를 $-1\le t\le1$로 설정하여 $t$에 대한 이차함수로 나타냈다. (공식 4점)
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2, 1a]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        주어진 $t$의 범위에서 이차함수의 최댓값 $4$를 정확히 구했다. (공식 3점)
      depends_on: [1.M2]
      steps: [1b-3, 1a]
    deductions: []
