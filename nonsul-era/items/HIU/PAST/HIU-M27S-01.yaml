intent: |
  삼각함수 사이의 관계($\sin^2x+\cos^2x=1$)를 이용하여 주어진 함수를 하나의 삼각함수에 대한 이차함수로 변환할 수 있는지를 평가한다. 또한, 치환을 통해 얻어진 이차함수의 정의역을 올바르게 파악하고, 해당 범위 내에서 최댓값을 구하는 능력을 확인하고자 한다.
key_idea: |
  $\sin^2x=1-\cos^2x$로 바꾸고 $t=\cos x$($-1\le t\le1$)로 치환하면 $y=-2(t+1)^2+4$이다.
stuck: |
  치환한 $t$의 범위를 $-1\le t\le1$로 제한하는 것
