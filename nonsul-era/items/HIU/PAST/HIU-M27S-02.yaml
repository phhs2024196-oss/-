intent: |
  로그방정식을 풀기 위해 가장 먼저 로그의 밑과 진수 조건을 정확히 파악하여 해의 범위를 설정할 수 있는지를 평가한다. 또한, 밑 변환 공식을 이용하여 복잡한 로그방정식을 간단한 형태로 변형하고, 이를 통해 논리적으로 해를 추론하는 능력을 확인하고자 한다.
key_idea: |
  $\log_4x^2=\log_2\lvert x\rvert$이므로 $x+2=\lvert x\rvert$ ($x>-2$, $x\ne0$)를 부호로 나누어 푼다.
stuck: |
  $\log_4x^2=\log_2x$로 잘못 바꾸면 $x<0$인 해 $x=-1$을 놓친다($\sqrt{x^2}=\lvert x\rvert$)
