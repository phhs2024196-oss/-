intent: |
  수열의 합과 일반항 사이의 관계($a_1=S_1$, $n\ge2$일 때 $a_n=S_n-S_{n-1}$)를 정확히 이해하고 이를 이용하여 일반항을 유도할 수 있는지 평가한다. 또한, 구해진 일반항을 바탕으로 새로운 수열의 규칙을 파악하고 시그마($\Sigma$) 기호의 성질과 자연수 거듭제곱의 합 공식을 활용하여 정확하게 계산할 수 있는지 확인한다.
key_idea: |
  $a_1=S_1=4$, $n\ge2$에서 $a_n=S_n-S_{n-1}=2n+2$이고 $n=1$에서도 성립한다. $a_{2k}=4k+2$.
stuck: |
  $n\ge2$에서 구한 식이 $n=1$에서도 성립하는지 확인하는 것
