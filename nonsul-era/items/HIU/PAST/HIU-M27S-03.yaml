stimuli: []

stem: |
  수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하자. $S_n=n^2+3n$일 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    수열 $\{a_n\}$의 일반항 $a_n$을 구하시오.
  points: 5
  depends_on: []
  answer: {kind: expression, value: '2*n + 2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_1=S_1$, $n\ge2$에서 $a_n=S_n-S_{n-1}$.
    steps:
    - {id: 1a, content: '$a_1=4$, $a_n=(n^2+3n)-\{(n-1)^2+3(n-1)\}=2n+2$, $n=1$에서도 성립', criteria: ['1.B1', '1.A1']}
    hint_ladder:
    - $S_n-S_{n-1}$은 무엇인가? 언제 쓸 수 있는가?
  - id: S1-B
    audience: B
    source_flow: 해설지_세종_자연.pdf p.7-8
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        수열의 합 $S_n=n^2+3n$에서, 첫째항 $a_1=S_1=1^2+3\times1=4$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $n\ge2$일 때, 일반항 $a_n$은 $a_n=S_n-S_{n-1}$이므로
        $a_n=(n^2+3n)-\{(n-1)^2+3(n-1)\}=(n^2+3n)-(n^2-2n+1+3n-3)=(n^2+3n)-(n^2+n-2)=2n+2$이다.
        이 식에 $n=1$을 대입하면 $2\times1+2=4$이므로, 위에서 구한 첫째항 $a_1$의 값과 일치한다. 따라서 수열 $\{a_n\}$의 일반항은 모든 자연수 $n$에 대하여 $a_n=2n+2$이다.
      criteria: ['1.M1', '1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        $a_1=S_1$임을 이용하여 첫째항 $4$를 구했다. (공식 채점 기준 (1) 2점)
      steps: [1b-1, 1a]
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        $n\ge2$일 때 $a_n=S_n-S_{n-1}$을 이용했다. (공식 채점 기준 (2) 3점 중 방법)
      depends_on: []
      implied_ok: true
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $a_n=2n+2$를 구하고 $n=1$일 때도 성립함을 확인했다. (공식 채점 기준 (2) 3점 중 정확성)
      depends_on: [1.M1, 1.B1]
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $\displaystyle\sum_{k=1}^{5}a_{2k}$의 값을 구하시오.
  points: 5
  depends_on: ['1']
  answer: {kind: value, value: '70', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a_{2k}=4k+2$를 $k=1$부터 $5$까지 더한다.
    steps:
    - {id: 2a, content: '$\sum_{k=1}^{5}(4k+2)=4\cdot15+10=70$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $a_n$의 $n$ 자리에 $2k$를 넣어 보라.
  - id: S2-B
    audience: B
    source_flow: 해설지_세종_자연.pdf p.8
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1)에서 구한 일반항 $a_n=2n+2$에서 $n$자리에 $2k$를 대입하면, $a_{2k}=2\times2k+2=4k+2$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 구하고자 하는 합은 시그마 기호의 성질에 의해
        $$\sum_{k=1}^{5}a_{2k}=\sum_{k=1}^{5}(4k+2)=4\sum_{k=1}^{5}k+\sum_{k=1}^{5}2=4\times\left(\frac{5\times6}{2}\right)+2\times5=70$$
        즉, 구하고자 하는 값은 70이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        일반항을 이용하여 $a_{2k}=4k+2$를 구했다. (공식 채점 기준 (3) 2점)
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        시그마의 성질이나 등차수열의 합 공식으로 $70$을 계산했다. (공식 채점 기준 (4) 3점)
      depends_on: [2.M1]
      steps: [2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

