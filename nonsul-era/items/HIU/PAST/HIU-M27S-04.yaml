stimuli: []

stem: |
  상수 $a$, $b$, $c$에 대하여, 시각 $t$에서의 점 $\mathrm{P}$의 위치를 나타내는 함수 $f(t)$가 다음과 같이 주어진다.

  $f(t)=at^3+bt^2+ct$ (단, $a\ne0$)

  함수 $f(t)$가 다음 조건을 만족시킨다.

  $\displaystyle\lim_{t\to\infty}\frac{bt^3}{f(t)}=2$, $\displaystyle\lim_{t\to2}\frac{f(t-1)}{t-2}=4$

subparts:
- id: '1'
  stem: |
    주어진 조건을 만족하는 함수 $f(t)$를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 't**3 + 2*t**2 - 3*t', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $b=2a$, $f(1)=0$, $f^{\prime}(1)=4$의 연립.
    steps:
    - {id: 1a, content: '$b=2a$, $a+b+c=0$, $3a+2b+c=4\Rightarrow a=1,b=2,c=-3$', criteria: ['1.M1', '1.M2', '1.M3', '1.A1']}
    hint_ladder:
    - $t\to\infty$일 때 다항식의 비는 무엇으로 결정되는가?
    - $t-1=x$로 치환하면 두 번째 극한은 어떤 꼴인가?
  - id: S1-B
    audience: B
    source_flow: 해설지_세종_자연.pdf p.11-12
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        위치함수 $f(t)$의 도함수가 속도 $v(t)$라고 표현할 수 있다. 주어진 조건 $\displaystyle\lim_{t\to\infty}\frac{bt^3}{f(t)}$에서 $t\to\infty$일 때 다항함수의 극한은 최고차항에 의해 결정되므로 분자와 분모의 최고차항만 비교하면 $\dfrac{bt^3}{at^3}=\dfrac ba=2$. 따라서 첫 번째 관계식 $b=2a$를 얻는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        제시된 다른 조건 $\displaystyle\lim_{t\to2}\frac{f(t-1)}{t-2}=4$에서 $x=t-1$로 치환하면 $t\to2$일 때 $x\to1$이므로 $\displaystyle\lim_{x\to1}\frac{f(x)}{x-1}$로 나타낼 수 있다. 이 식이 유한한 값을 가지기 위해서는 $f(1)=0$을 만족해야 한다. 따라서 위 극한은 미분의 정의에 의해서 $\displaystyle\lim_{x\to1}\frac{f(x)}{x-1}=\lim_{x\to1}\frac{f(x)-f(1)}{x-1}=v(1)=4$를 만족한다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        위에서 도출된 조건으로부터 $f(1)=a+b+c=0$, $v(t)=3at^2+2bt+c\Rightarrow v(1)=3a+2b+c=4$.
      criteria: ['1.M3']
    - id: 1b-4
      content: |
        $a+b+c=a+2a+c=0\Rightarrow c=-3a$, $3a+2b+c=3a+2\times2a-3a=4a=4\Rightarrow\therefore a=1$, $b=2$, $c=-3$. 최종적으로 $f(t)=t^3+2t^2-3t$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        무한대 극한으로 계수 관계식 $b=2a$를 결정했다. (공식 2점)
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        두 번째 극한을 $f(1)=0$과 미분계수 $f^{\prime}(1)=4$로 해석했다. (공식 4점)
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1a]
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: |
        $a+b+c=0$, $3a+2b+c=4$의 식을 세워 계수 관계를 도출했다. (공식 2점)
      depends_on: [1.M2]
      implied_ok: false
      steps: [1b-3, 1a]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $a=1$, $b=2$, $c=-3$과 $f(t)=t^3+2t^2-3t$를 구했다. (공식 2점)
      depends_on: [1.M1, 1.M3]
      steps: [1b-4, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    (1)에서 구한 함수 $f(t)$를 이용하여, 시간 $t=3$에서 점 $P$의 가속도를 구하시오.
  points: 5
  depends_on: ['1']
  answer: {kind: value, value: '22', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a(t)=f^{\prime\prime}(t)=6t+4$.
    steps:
    - {id: 2a, content: '$v(t)=3t^2+4t-3$, $a(t)=6t+4$, $a(3)=22$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - 위치를 두 번 미분하면 무엇인가?
  - id: S2-B
    audience: B
    source_flow: 해설지_세종_자연.pdf p.12
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        위치함수 $f(t)$의 도함수가 속도 $v(t)$이고, 속도 $v(t)$의 도함수가 가속도 $a(t)$라고 표현할 수 있다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 속도와 가속도는 $v(t)=3t^2+4t-3$, $a(t)=6t+4$와 같이 구할 수 있다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $t=3$에서의 가속도는 $a(3)=6\times3+4=22$이다. 따라서, 구하고자 하는 답은 22이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 1
      evidence: |
        위치의 도함수가 속도, 속도의 도함수가 가속도임을 적었다. (공식 1점)
      depends_on: []
      implied_ok: true
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $v(t)=3t^2+4t-3$, $a(t)=6t+4$를 구했다. (공식 2점)
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [2b-2, 2a]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $t=3$을 대입하여 가속도 $22$를 구했다. (공식 2점)
      depends_on: [2.M1]
      steps: [2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

