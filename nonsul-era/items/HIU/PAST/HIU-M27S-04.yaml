intent: |
  무한대에서의 극한을 통해 다항함수의 최고차항 계수를 판단하는 능력과, 주어진 극한식을 미분계수의 정의로 해석하는 사고력을 평가한다. 또한 이를 바탕으로 함수의 계수를 정확히 구하고, 미분을 통해 속도와 가속도의 개념을 연결하여 계산하는 종합적인 미적분 활용 능력을 측정하는 데 목적이 있다.
key_idea: |
  $t\to\infty$ 극한에서 $\dfrac ba=2$, $\displaystyle\lim_{t\to2}\frac{f(t-1)}{t-2}=\lim_{x\to1}\frac{f(x)}{x-1}=4$에서 $f(1)=0$, $f^{\prime}(1)=4$.
stuck: |
  분모가 $0$으로 가는 극한이 수렴하므로 분자도 $0$($f(1)=0$)이고, 남은 극한이 미분계수라는 해석
