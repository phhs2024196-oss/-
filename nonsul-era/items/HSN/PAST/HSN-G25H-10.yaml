stimuli: []
stem: |
  함수 $y=\log_{\frac{1}{4}}x$의 그래프를 $x$축에 대하여 대칭이동한 후, $x$축의 방향으로 2만큼, $y$축의 방향으로 1만큼 평행이동시킨 그래프가 점 $(a,2)$를 지날 때, 상수 $a$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=\log_{\frac14}x$의 그래프를 $x$축에 대하여 대칭이동한 그래프의 식은 $y=-\log_{\frac14}x$이다. 이 그래프를 $x$축의 방향으로 2만큼, $y$축의 방향으로 1만큼 평행이동시킨 함수는 $y=-\log_{\frac14}(x-2)+1$ (또는 $y=\log_4(x-2)+1$)이다.
      source_flow: 보고서 p.100
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이 함수가 점 $(a,2)$를 지나므로 $2=-\log_{\frac14}(a-2)+1=\log_4(a-2)+1$.
      source_flow: 보고서 p.100
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\log_4(a-2)=1$, $a-2=4$이므로 $a=6$.
      source_flow: 보고서 p.100
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $y=-\log_{\frac14}(x-2)+1=\log_4(x-2)+1$ (또는 $y=\frac12\log_2(x-2)+1$)을 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        식 $2=-\log_{\frac14}(a-2)+1$ (또는 $2=\frac12\log_2(a-2)+1$ 또는 $2=\log_4(a-2)+1$)을 세웠다.
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $a=6$을 구했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
