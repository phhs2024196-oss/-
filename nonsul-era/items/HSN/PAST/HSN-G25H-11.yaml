stimuli: []
stem: |
  $\displaystyle\int_0^3 x\lvert x-2\rvert\,dx$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 8/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\int_0^3 x\lvert x-2\rvert dx=\int_0^2 -x(x-2)dx+\int_2^3 x(x-2)dx$
      source_flow: 보고서 p.102
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b-2
      content: |
        $=\displaystyle\int_0^2(-x^2+2x)dx+\int_2^3(x^2-2x)dx=\left[-\frac13x^3+x^2\right]_0^2+\left[\frac13x^3-x^2\right]_2^3$
        $=\left(-\frac83+4\right)+\left(\frac{19}{3}-5\right)$
      source_flow: 보고서 p.102
      criteria:
      - 1.M3
    - id: 1b-3
      content: |
        $=\dfrac83$
      source_flow: 보고서 p.102
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        절댓값을 나누었다(부호 판별).
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        구간을 나누어 $\displaystyle\int_0^2-x(x-2)dx+\int_2^3x(x-2)dx$로 계산식을 세웠다.
      depends_on:
      - 1.M1
      steps:
      - 1b-1
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: |
        원시함수로 적분을 올바르게 계산했다($\left[-\frac13x^3+x^2\right]_0^2+\left[\frac13x^3-x^2\right]_2^3$).
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $\dfrac83$을 구했다.
      depends_on:
      - 1.M3
