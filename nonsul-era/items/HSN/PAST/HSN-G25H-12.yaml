stimuli: []
stem: |
  함수
  $$f(x)=\begin{cases}\dfrac{x^3-1}{ax^2-a} & (x>1)\\[4pt] \dfrac{3}{8} & (x\le 1)\end{cases}$$
  이 $x=1$에서 연속이 되도록 하는 양수 $a$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{x\to1-}f(x)=\lim_{x\to1+}f(x)=f(1)$이어야 하고
      source_flow: 보고서 p.104
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to1+}f(x)=\lim_{x\to1+}\frac{x^3-1}{a(x^2-1)}=\lim_{x\to1+}\frac{x^2+x+1}{a(x+1)}=\frac{3}{2a}$이므로
      source_flow: 보고서 p.104
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $\dfrac{3}{2a}=\dfrac38$, 즉 $a=4$
      source_flow: 보고서 p.104
      criteria:
      - 1.M2
      - 1.A1
