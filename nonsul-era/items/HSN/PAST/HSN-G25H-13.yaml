stimuli: []
stem: |
  삼차함수 $f(x)=ax^3+3x^2+3ax+1$이 실수 전체의 집합에서 증가하도록 하는 실수 $a$의 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=ax^3+3x^2+3ax+1$이 실수 전체의 집합에서 증가하기 위해서는 $a>0$이고 $f'(x)=3ax^2+6x+3a\ge0$이어야 하므로,
      source_flow: 보고서 p.107
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        2차 방정식 $3ax^2+6x+3a=0$의 판별식을 $D$라 하면 $\dfrac D4=9-9a^2\le0$이어야 한다.
      source_flow: 보고서 p.107
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $a^2\ge1$, 즉 $a\ge1$ 또는 $a\le-1$. 그런데 $a>0$이므로 $a$의 최솟값은 1이다.
      source_flow: 보고서 p.107
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $f'(x)=3ax^2+6x+3a$를 구했다(미분을 올바르게).
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        $\dfrac D4=9-9a^2\le0$ (또는 $1-a^2\le0$)을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $a$의 최솟값 1을 구했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
