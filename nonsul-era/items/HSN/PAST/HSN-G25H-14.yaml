stimuli: []
stem: |
  수열 $\{a_n\}$이 모든 자연수 $n$에 대하여 $a_n+a_{n+8}=5$를 만족시킨다.
  $\displaystyle\sum_{n=1}^{4}a_{2n}=1$일 때, $\displaystyle\sum_{n=1}^{36}a_{2n}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '81'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_2+a_{10}=5$, $a_4+a_{12}=5$, $a_6+a_{14}=5$, $a_8+a_{16}=5$, $a_{10}+a_{18}=5$, $a_{12}+a_{20}=5$, $a_{14}+a_{22}=5$, $a_{16}+a_{24}=5$, $\cdots$ 각각 변끼리 더하면 $a_2+a_4+\cdots+a_{16}=20$, $a_{10}+a_{12}+\cdots+a_{24}=20$
      source_flow: 보고서 p.108
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\sum_{n=1}^4a_{2n}=a_2+a_4+a_6+a_8=1$이므로 $\displaystyle\sum_{n=5}^8a_{2n}=a_{10}+a_{12}+a_{14}+a_{16}=20-1=19$
      source_flow: 보고서 p.108
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $\displaystyle\sum_{n=1}^{36}a_{2n}=\left(\sum_{n=1}^4a_{2n}+\sum_{n=5}^8a_{2n}\right)+\left(\sum_{n=9}^{12}a_{2n}+\sum_{n=13}^{16}a_{2n}\right)+\cdots+\sum_{n=33}^{36}a_{2n}$
      source_flow: 보고서 p.108
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $=(1+19)+(1+19)+\cdots+(1+19)+1=20\times4+1=81$
      source_flow: 보고서 p.108
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $a_2+a_4+\cdots+a_{16}=20$과 같이 8개 항을 더하여 20이 나오거나, $a_{10}+a_{12}+a_{14}+a_{16}=19$와 같이 4개 항을 더하여 19가 나왔다.
      steps:
      - 1b-1
