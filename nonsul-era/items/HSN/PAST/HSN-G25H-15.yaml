stimuli: []
stem: |
  $-2\le x\le4$일 때, 방정식 $\lvert\sin\pi x\rvert^2-\cos^2\pi x=0$의 모든 근의 합을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '12'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sin^2\pi x-\cos^2\pi x=\sin^2\pi x-(1-\sin^2\pi x)=2\sin^2\pi x-1=0$
      source_flow: 보고서 p.110
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이므로 $\sin\pi x=\pm\dfrac{1}{\sqrt2}$ 이고
      source_flow: 보고서 p.110
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $0\le x\le2$에서 근 $x=\dfrac14,\dfrac34,\dfrac54,\dfrac74$이고 근의 합은 4이다.
      source_flow: 보고서 p.110
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        이와 같은 방법으로 하면, 주기가 2이므로 $2\le x\le4$에서 모든 근의 합은 $4+8=12$이고 $-2\le x\le0$에서 모든 근의 합은 $4-8=-4$이다. 그러므로 구하는 값은 12이다.
      source_flow: 보고서 p.110
      criteria:
      - 1.A1
  - id: S1-B2
    audience: B
    method_no: 2
    steps:
    - id: 1b2-1
      content: |
        $\sin^2\pi x-\cos^2\pi x=(\sin\pi x-\cos\pi x)(\sin\pi x+\cos\pi x)=0$
      source_flow: 보고서 p.110
      criteria:
      - 1.M1
    - id: 1b2-2
      content: |
        i) $\sin\pi x=\cos\pi x$의 $0\le x\le2$에서의 해 $x=\dfrac14,\dfrac54$이고 ii) $\sin\pi x=-\cos\pi x$의 $0\le x\le2$에서의 해 $x=\dfrac34,\dfrac74$이다.
      source_flow: 보고서 p.110
      criteria:
      - 1.M2
    - id: 1b2-3
      content: |
        그러므로 $0\le x\le2$에서 모든 근의 합은 4이다.
      source_flow: 보고서 p.110
      criteria:
      - 1.M3
    - id: 1b2-4
      content: |
        주기가 2이므로 $0\le x\le4$일 때 모든 근의 합은 $4+(4+8)=4\times(1+3)$이고 $-2\le x\le0$일 때 모든 근의 합은 $4\times(-1)$이다. 그러므로 구하는 값은 12이다.
      source_flow: 보고서 p.110
      criteria:
      - 1.A1
  - id: S1-B3
    audience: B
    method_no: 3
    steps:
    - id: 1b3-1
      content: |
        $y=\lvert\sin\pi x\rvert$, $y=\cos\pi x$, $y=-\cos\pi x$의 그래프를 그린다. $0\le x\le2$에서 $\lvert\sin\pi x\rvert-\cos\pi x=0$의 근은 $x=1$에 대하여 대칭이므로 $\dfrac{x_1+x_2}{2}=1$이고 $\cos\pi x+\lvert\sin\pi x\rvert=0$의 근도 $x=1$에 대하여 대칭이므로 $\dfrac{x_3+x_4}{2}=1$이다.
      source_flow: 보고서 p.110
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b3-2
      content: |
        그러므로 $0\le x\le2$에서 모든 근의 합은 4이다.
      source_flow: 보고서 p.110
      criteria:
      - 1.M3
    - id: 1b3-3
      content: |
        $2\le x\le4$구간에서는 근이 $x=3$에 대하여 대칭이므로 모든 근의 합은 $12=4\times3$이다. $0<x\le4$일 때 모든 근의 합은 $4\times(1+3)$이고 $-2\le x\le0$일 때 모든 근의 합은 $4\times(-1)$이다. 그러므로 구하는 값은 12이다.
      source_flow: 보고서 p.110
      criteria:
      - 1.A1
