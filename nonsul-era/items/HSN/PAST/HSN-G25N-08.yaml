      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $a=-3$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $b=\displaystyle\lim_{x\to3}\frac{\sqrt{2x+3}-x}{x-3}=\lim_{x\to3}\frac{(\sqrt{2x+3}-x)(\sqrt{2x+3}+x)}{(x-3)(\sqrt{2x+3}+x)}$을 구했다.
      depends_on:
