stimuli: []
stem: |
  $\displaystyle\lim_{x\to3}\dfrac{\sqrt{2x-a}-x}{x-3}=b$일 때, 두 상수 $a$, $b$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: a=-3; b=-2/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{x\to3}\frac{\sqrt{2x-a}-x}{x-3}=b$ $\cdots\cdots$ ㉠ 에서 $x\to3$일 때 (분모)$\to0$이고 극한값이 존재하므로 (분자)$\to0$이어야 한다. 즉 $\displaystyle\lim_{x\to3}\sqrt{2x-a}-x=\sqrt{6-a}-3=0$
      source_flow: 보고서 p.132
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\sqrt{6-a}=3$에서 $a=-3$
      source_flow: 보고서 p.132
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        ㉠에서 $b=\displaystyle\lim_{x\to3}\frac{\sqrt{2x+3}-x}{x-3}=\lim_{x\to3}\frac{(\sqrt{2x+3}-x)(\sqrt{2x+3}+x)}{(x-3)(\sqrt{2x+3}+x)}=\lim_{x\to3}\frac{2x+3-x^2}{(x-3)(\sqrt{2x+3}+x)}=\lim_{x\to3}\frac{-(x-3)(x+1)}{(x-3)(\sqrt{2x+3}+x)}$
      source_flow: 보고서 p.132
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $=\displaystyle\lim_{x\to3}\frac{-(x+1)}{\sqrt{2x+3}+x}=-\frac46=-\frac23$
      source_flow: 보고서 p.132
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
