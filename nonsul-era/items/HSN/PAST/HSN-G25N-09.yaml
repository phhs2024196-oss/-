stem: |
  등차수열 $\{a_n\}$이 $a_1=36$이고 $\lvert a_{10}\rvert=\lvert a_{28}\rvert$일 때, $a_m=-10$을 만족시키는 자연수 $m$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '24'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_n=36+(n-1)d$라 하자. $a_1=36$, $\lvert a_{10}\rvert=\lvert a_{28}\rvert$이므로 $\lvert36+9d\rvert=\lvert36+27d\rvert$이고, $36+9d=\pm(36+27d)$이다.
      source_flow: 보고서 p.134
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        i) $36+9d=36+27d$인 경우 $d=0$이 되고 $a_m=-10$을 만족시키는 $m$이 존재할 수 없다. ii) $36+9d=-(36+27d)$인 경우 $d=-2$이고 $a_n=38-2n$이다.
      source_flow: 보고서 p.134
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $38-2m=-10$이므로 $m=24$이다.
      source_flow: 보고서 p.134
      criteria:
      - 1.A1
