stimuli: []
stem: |
  $0$이 아닌 상수 $a$에 대하여 함수 $f(x)$가 다음과 같다.
  $$f(x)=\begin{cases}x & (x>0)\\ x+a & (x\le0)\end{cases}$$
  함수 $g(x)=\{f(x)-1\}\{f(x)+2\}$가 $x=0$에서 연속일 때, $a$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '-1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{x\to0-}f(x)=a$, $\displaystyle\lim_{x\to0+}f(x)=0$. 함수 $g(x)$가 $x=0$에서 연속이므로 $\displaystyle\lim_{x\to0-}g(x)=\lim_{x\to0+}g(x)=g(0)$
      source_flow: 보고서 p.137
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to0-}g(x)=\lim_{x\to0-}\{f(x)-1\}\{f(x)+2\}=(a-1)(a+2)$
      source_flow: 보고서 p.137
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $\displaystyle\lim_{x\to0+}g(x)=\lim_{x\to0+}\{f(x)-1\}\{f(x)+2\}=-2$
      source_flow: 보고서 p.137
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $(a-1)(a+2)=-2$, $a^2+a=0$이고 $a\ne0$이므로 $a=-1$
      source_flow: 보고서 p.137
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
