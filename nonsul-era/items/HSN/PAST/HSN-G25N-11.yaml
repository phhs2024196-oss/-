stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$\lim_{h\to0}\frac{f(x-2h)-f(x)}{h}=4x^2+ax$$
  를 만족시킨다. $f'(1)=0$이고 $f(3)=-8$일 때, 함수 $f(x)$를 구하는 과정을 서술하시오. (단, $a$는 상수)
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: a=-4; f=-2*x**3/3+x**2+1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{h\to0}\frac{f(x-2h)-f(x)}{h}=\lim_{h\to0}\left\{\frac{f(x-2h)-f(x)}{-2h}\times(-2)\right\}$, 즉 $-2f'(x)=4x^2+ax$
      source_flow: 보고서 p.139
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f'(x)=-2x^2-\dfrac a2x$, $f'(1)=-2-\dfrac a2=0$이므로 $a=-4$
      source_flow: 보고서 p.139
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $f'(x)=-2x^2+2x$, 따라서 $f(x)=-\dfrac23x^3+x^2+C$라 놓으면 $f(3)=-18+9+C=-8$에서 $C=1$. 따라서 $f(x)=-\dfrac23x^3+x^2+1$
      source_flow: 보고서 p.139
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        식 $-2f'(x)=4x^2+ax$를 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $a=-4$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $f(x)=-\dfrac23x^3+x^2+1$를 구했다.
      depends_on:
      - 1.A1
      steps:
      - 1b-3
