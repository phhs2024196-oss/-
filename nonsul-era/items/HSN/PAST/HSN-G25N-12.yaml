stimuli: []
stem: |
  그림과 같이 $\overline{AB}=4$, $\overline{AD}=5$, $\overline{BD}=\overline{BC}=6$인 사다리꼴 ABCD가 있다.
  [그림 1: 사다리꼴 ABCD. 꼭짓점 A와 D가 위쪽, B와 C가 아래쪽에 있고, 변 AB=4, AD=5, 대각선 BD=6, 변 BC=6이 표시되어 있다.]
  다음은 사다리꼴 ABCD의 넓이를 구하는 과정이다. (가), (나), (다), (라), (마)에 들어갈 가장 알맞은 수를 구하시오.

  삼각형 ABD에서 $\angle ADB=\theta$라 하면, 삼각형 ABD에서 코사인법칙에 의하여 $\cos\theta=$ (가) 이므로, $\sin\theta=$ (나) 이다. 따라서 삼각형 ABD의 넓이는 (다) 이다.

  사각형 ABCD가 사다리꼴이므로 $\angle DBC=\theta$이고 삼각형 BCD의 넓이는 (라) 이다. 따라서 사다리꼴 ABCD의 넓이는 (마) 이다.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: ga=3/4; na=sqrt(7)/4; da=15*sqrt(7)/4; ra=9*sqrt(7)/2; ma=33*sqrt(7)/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각형 ABD에서 $\angle ADB=\theta$라 하면 코사인법칙에 의하여 $\cos\theta=\dfrac{\overline{AD}^2+\overline{BD}^2-\overline{AB}^2}{2\times\overline{AD}\times\overline{BD}}=\dfrac{25+36-16}{2\times5\times6}=\dfrac{45}{60}=\dfrac34$ (가)
      source_flow: 보고서 p.141
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $0<\theta<\pi$이므로 $\sin\theta=\sqrt{1-\cos^2\theta}=\sqrt{1-\dfrac9{16}}=\sqrt{\dfrac7{16}}=\dfrac{\sqrt7}{4}$ (나)
      source_flow: 보고서 p.141
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        삼각형 ABD의 넓이는 $\dfrac12\times\overline{AD}\times\overline{BD}\times\sin\theta=\dfrac12\times5\times6\times\dfrac{\sqrt7}{4}=\dfrac{15\sqrt7}{4}$ (다) $\cdots$ ㉠
      source_flow: 보고서 p.141
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        사각형 ABCD가 사다리꼴이므로 $\angle DBC=\theta$이다. 삼각형 BCD의 넓이는 $\dfrac12\times\overline{BD}\times\overline{BC}\times\sin\theta=\dfrac12\times6\times6\times\dfrac{\sqrt7}{4}=\dfrac{9\sqrt7}{2}$ (라) $\cdots$ ㉡
      source_flow: 보고서 p.141
      criteria:
      - 1.A2
    - id: 1b-5
      content: |
        ㉠, ㉡에 의해 사각형 ABCD의 넓이는 $\dfrac{15\sqrt7}{4}+\dfrac{9\sqrt7}{2}=\dfrac{33\sqrt7}{4}$ (마)
      source_flow: 보고서 p.141
      criteria:
      - 1.A2
