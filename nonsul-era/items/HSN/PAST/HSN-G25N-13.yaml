    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        위 조건식에서 $x=1$을 대입하면 $0=1+a+b$, $a+b=-1$이다.
      source_flow: 보고서 p.142
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        위 조건식의 양변을 미분하면 $xf(x)=3x^2+2ax+b$이고
      source_flow: 보고서 p.142
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        양변에 $x=0$을 대입하면 $b=0$이고 $a=-1$이다. 그러므로 $f(x)=3x-2$이고 $f(b)=f(0)=-2$이다.
      source_flow: 보고서 p.142
      criteria:
      - 1.A1
