stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$\int_1^x tf(t)\,dt=x^3+ax^2+bx$$
  를 만족시킬 때, $f(b)$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$는 상수이다.)
