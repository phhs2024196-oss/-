stimuli: []
stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $f(-1)=0$이고 함수 $\lvert f(x)\rvert$는 $x=\alpha$ ($\alpha\ne-1$)에서만 미분가능하지 않다. (단, $\alpha$는 상수)
  (나) 함수 $f(x)$의 극솟값은 $-4$이다.

  함수 $f(x)$를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: alpha=2; f=(x+1)**2*(x-2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가) 조건에 의해 함수 $f(x)$는 $x=-1$에서 $x$축에 접하고 $x=\alpha$가 근이어야 한다. 즉, $f(x)=(x+1)^2(x-\alpha)$이다.
      source_flow: 보고서 p.144
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f'(x)=2(x+1)(x-\alpha)+(x+1)^2=0$, $(x+1)\{2(x-\alpha)+x+1\}=0$, $x=-1$ 또는 $x=\dfrac{2\alpha-1}{3}$이다. 함수 $f(x)$는 $x=-1$에서 극댓값을 가지므로 극솟값을 가지는 $x$는 $\dfrac{2\alpha-1}{3}$이다.
      source_flow: 보고서 p.144
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $f\left(\dfrac{2\alpha-1}{3}\right)=\left(\dfrac{2\alpha-1}{3}+1\right)^2\left(\dfrac{2\alpha-1}{3}-\alpha\right)=\dfrac{-4(\alpha+1)^3}{27}=-4$, $(\alpha+1)^3=27$, $\alpha=2$. 그러므로 $f(x)=(x+1)^2(x-2)$
      source_flow: 보고서 p.144
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
