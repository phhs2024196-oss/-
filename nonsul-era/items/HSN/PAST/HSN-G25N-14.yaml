    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        극솟값을 가지는 $x=\dfrac{2\alpha-1}{3}$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
