stimuli: []
stem: |
  함수 $f(x)=x^3+x-1$의 역함수를 $g(x)$라 하자.
  두 곡선 $y=f(x)$, $y=g(x)$와 두 직선 $x=-1$, $y=-1$로 둘러싸인 부분의 넓이를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 5/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=3x^2+1>0$이므로 함수 $f$는 실수 전체의 집합에서 증가하고, 역함수 $g(x)$가 존재한다. $x=x^3+x-1$에서 $x^3-1=0$이므로 $f(1)=1$이고 $g(1)=1$, 즉 교점은 $(1,1)$. 또 $f(0)=-1$이므로 $g(-1)=0$
      source_flow: 보고서 p.146
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        [그림 1: 곡선 $y=f(x)$, $y=g(x)$와 직선 $y=x$, 두 직선 $x=-1$, $y=-1$로 둘러싸인 영역이 색칠되어 있다.] $S=1+2\displaystyle\int_0^1\{x-(x^3+x-1)\}dx$
      source_flow: 보고서 p.146
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $=1+2\displaystyle\int_0^1(-x^3+1)dx=1+2\left[-\dfrac14x^4+x\right]_0^1=1+2\cdot\dfrac34=\dfrac52$
      source_flow: 보고서 p.146
      criteria:
      - 1.A1
  - id: S1-B2
    audience: B
    method_no: 2
    steps:
    - id: 1b2-1
      content: |
        $f'(x)=3x^2+1>0$이므로 $f$는 증가하고 역함수 $g$가 존재한다. $f(1)=1$, $g(1)=1$이고 교점은 $(1,1)$, $f(0)=-1$이므로 $g(-1)=0$
      source_flow: 보고서 p.146
      criteria:
      - 1.M1
    - id: 1b2-2
      content: |
        $S=4-2\displaystyle\int_0^1\{f(x)-(-1)\}dx=4-2\int_0^1\{(x^3+x-1)-(-1)\}dx=4-2\cdot\dfrac34=\dfrac52$
      source_flow: 보고서 p.146
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B3
    audience: B
    method_no: 3
    steps:
    - id: 1b3-1
      content: |
        $f'(x)=3x^2+1>0$이므로 $f$는 증가하고 역함수 $g$가 존재한다. $f(1)=1$, $g(1)=1$이고 교점은 $(1,1)$, $f(0)=-1$이므로 $g(-1)=0$
      source_flow: 보고서 p.146
      criteria:
      - 1.M1
    - id: 1b3-2
      content: |
        $S=2\left[\displaystyle\int_{-1}^1\{x-f(x)\}dx-\int_{-1}^0\{(-1)-f(x)\}dx\right]=2\left[\int_{-1}^1\{(-x^3+1)\}dx-\int_{-1}^0\{(-x^3-x)\}dx\right]=2\left(2-\dfrac34\right)=\dfrac52$
      source_flow: 보고서 p.146
      criteria:
      - 1.M1
      - 1.A1
