stimuli: []
stem: |
  방정식 $\log_3(5x+3)=2+\log_3(x-1)$을 만족시키는 실수 $x$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        로그의 진수 조건에 의하여 $5x+3>0,\ x-1>0$ 따라서 $x>1$ ……㉠
        $\log_3(5x+3)=2+\log_3(x-1)$에서
        $\log_3(5x+3)-\log_3(x-1)=2$
        $\log_3\dfrac{5x+3}{x-1}=2$
        $\dfrac{5x+3}{x-1}=3^2$
      source_flow: 보고서 p.120
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $5x+3=9(x-1)$
        $x=3$
        (위의 값은 진수 조건 ㉠을 만족시킨다.)
      source_flow: 보고서 p.120
      criteria:
      - 1.A1
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    key_idea: 별해
    steps:
    - id: 1c1-1
      content: |
        $\log_3(5x+3)=2+\log_3(x-1)=\log_3 3^2(x-1)$
        $5x+3=9(x-1)=9x-9$
      source_flow: 보고서 p.120
      criteria:
      - 1.M1
    - id: 1c1-2
      content: |
        $4x=12$
        $\therefore x=3$
      source_flow: 보고서 p.120
      criteria:
      - 1.A1
  rubric:
