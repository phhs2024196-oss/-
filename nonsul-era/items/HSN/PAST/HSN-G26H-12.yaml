stimuli: []
stem: |
  수열 $\{a_n\}$은 첫째항이 $10$이고 모든 자연수 $n$에 대하여 $a_{n+1}=a_n-\dfrac23$를 만족시킨다.
  $a_n>0$이 되는 자연수 $n$의 최댓값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '15'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_1=10$이고 공차 $d=a_{n+1}-a_n=-\dfrac23$이므로,
        수열의 일반항 $a_n=10-\dfrac23(n-1)=-\dfrac23n+\dfrac{32}{3}$
      source_flow: 보고서 p.122
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 $-\dfrac23n+\dfrac{32}{3}>0$에서 $2n<32$ 즉 $n<16$
        그러므로 $n$의 최댓값은 $15$이다.
      source_flow: 보고서 p.122
      criteria:
      - 1.A1
