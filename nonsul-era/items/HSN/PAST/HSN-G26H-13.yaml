stimuli: []
stem: |
  함수 $f(x)=-x^3+ax^2+6x-3$이 $x=2$에서 극대일 때,
  함수 $f(x)$의 극솟값을 구하는 과정을 서술하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: -13/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=-3x^2+2ax+6$이고
        $x=2$에서 극대이므로 $f'(2)=-12+4a+6=0$이므로 $a=\dfrac32$
      source_flow: 보고서 p.124
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f'(x)=-3x^2+3x+6=0$을 풀면 $3(x-2)(x+1)=0$
        따라서 함수 $f(x)$는 $x=-1$에서 극솟값을 가진다.
        $f(-1)=1+\dfrac32-6-3=-\dfrac{13}{2}$
        그러므로 구하는 극솟값은 $-\dfrac{13}{2}$
      source_flow: 보고서 p.124
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $f'(x)=-3x^2+2ax+6$과 $f'(2)=0$으로 $a=\dfrac32$를 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $f'(x)=0$의 근 $x=2,-1$에서 $x=-1$이 극소임을 판정하고 극솟값 $-\dfrac{13}{2}$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
