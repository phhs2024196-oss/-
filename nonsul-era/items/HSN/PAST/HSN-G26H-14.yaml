stimuli: []
stem: |
  함수 $f(x)=\begin{cases} x^2-3 & (x<3) \\ x+a & (x\ge3) \end{cases}$에 대하여 함수 $\{f(x)-1\}^2$이 $x=3$에서 연속이 되도록 하는 모든 실수 $a$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 3, -7
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g(x)=\{f(x)-1\}^2$라 하자. 함수 $g(x)$가 $x=3$에서 연속이 되려면
        $\lim_{x\to3-}g(x)=\lim_{x\to3+}g(x)=g(3)$ 이어야 한다.
        $\lim_{x\to3-}g(x)=\lim_{x\to3-}(x^2-3-1)^2=(9-4)^2=25$
        $\lim_{x\to3+}g(x)=\lim_{x\to3+}(x+a-1)^2=(3+a-1)^2=(2+a)^2$
        $g(3)=(2+a)^2$이므로
      source_flow: 보고서 p.126
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $25=(2+a)^2$ (또는 $a^2+4a-21=0$)
        따라서 실수 $a=3$ 또는 $a=-7$이다.
      source_flow: 보고서 p.126
      criteria:
      - 1.A1
