  item_note: '문항카드 5. 문항 해설: 삼각함수는 삼각비를 일반화시킨 개념으로서 주기적인 성질을 가지는 자연 현상이나 사회 현상을 표현하고 설명하는 데 활용된다. 본 문항의 핵심적인 내용은 수학Ⅰ의 ''삼각함수'' 단원에서 다루어진다. 따라서 본 문항을 통해 학생들이 삼각함수의 뜻을 알고, 사인함수의 그래프를 그릴 수 있는지를 평가한다.'
