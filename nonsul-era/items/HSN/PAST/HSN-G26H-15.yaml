      points: 4
      evidence: 주기 $6$과 평행이동을 파악하고 네 점이 이루는 사각형이 평행사변형임을 밝혔다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 점 $C$의 좌표를 $\left(3+k,\dfrac32\right)$로 놓고 밑변 $3-2k$, 높이 $3$으로 넓이 식을 세워 $k=\dfrac12$, $a=3$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
