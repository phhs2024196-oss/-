stimuli: []
stem: |
  $0\le x\le6$에서 함수 $y=a\sin\dfrac{\pi(x-3)}{3}$의 그래프와 두 직선 $\lvert y\rvert=\dfrac32$의 그래프는 네 점에서 만난다. 네 점으로 이루어진 사각형의 넓이가 $6$일 때 양수 $a$를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=a\sin\dfrac{\pi(x-3)}{3}$는 주기가 $6$인 함수 $y=a\sin\dfrac{\pi x}{3}$을 $x$축으로 $3$만큼 평행이동한 것이다.
        [그림: 곡선 $y=a\sin\dfrac{\pi(x-3)}{3}$와 직선 $y=\dfrac32,\ y=-\dfrac32$의 교점 네 점을 꼭짓점으로 하는 사각형(평행사변형)이 색칠되어 있는 그래프]
        만나는 네 점을 원점에서 가까운 순서대로 $A,B,C,D$라 하면 선분 $AB$와 선분 $CD$가 평행하고 길이가 같으므로 사각형 $ABDC$는 평행사변형이다.
      source_flow: 보고서 p.128~129
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        점 $C$의 좌표를 $\left(3+k,\dfrac32\right)$라 하면, 점 $D$의 좌표는 $\left(6-k,\dfrac32\right)$이다. ($k>0$)
        점 $C$에서 $y=a\sin\dfrac{\pi(x-3)}{3}$와 직선 $y=\dfrac32$이 만나므로, $a\sin\dfrac{\pi k}{3}=\dfrac32$ ……㉠
        평행사변형의 밑변 $=\overline{CD}$의 길이 $=\overline{AB}$의 길이 $=3-2k$
        평행사변형 $ABDC$의 넓이는 $(3-2k)\cdot3=6$이므로 $k=\dfrac12$
        ㉠에 대입하면 $a=3$
      source_flow: 보고서 p.128~129
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
