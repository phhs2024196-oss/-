  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\left(\dfrac19\right)^x<3^{10-4x}$에서 $\left(\dfrac19\right)^x=3^{-2x}$이므로
        주어진 부등식은 $3^{-2x}<3^{10-4x}$
      source_flow: 보고서 p.131
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        지수함수의 성질에 따라 $-2x<10-4x$이므로 $x<5$
        자연수 $x=1,2,3,4$ 그러므로 개수는 $4$.
      source_flow: 보고서 p.131
      criteria:
      - 1.A1
