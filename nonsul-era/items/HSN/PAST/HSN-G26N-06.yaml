  item_note: '문항카드 5. 문항 해설: 지수함수와 로그함수는 급격히 증감하는 수량이나 현상을 다루는 유용한 도구로서 자연 현상이나 사회 현상을 표현하고 설명하는 데 활용된다. 본 문항의 핵심적인 내용은 수학Ⅰ의 ''지수함수와 로그함수'' 단원에서 다루어진다. 따라서 본 문항을 통해 학생들이 지수법칙을 이해하고 이를 이용하여 식을 간단히 나타낸 뒤, 지수함수를 활용하여 문제를 해결할 수 있는지를 평가한다.'
