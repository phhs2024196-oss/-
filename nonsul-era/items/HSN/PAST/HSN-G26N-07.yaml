  item_note: '문항카드 5. 문항 해설: 미분과 역관계에 있는 적분은 도형의 넓이와 부피를 구하는 데 필요한 개념으로, 미분과 함께 변화 현상을 다루는 데 활용된다. 본 문항의 핵심적인 내용은 수학Ⅱ의 ''적분'' 단원에서 다루어진다. 따라서 본 문항을 통해 학생들이 정적분의 뜻을 알고 다항함수의 정적분을 구할 수 있는지를 평가한다.'
