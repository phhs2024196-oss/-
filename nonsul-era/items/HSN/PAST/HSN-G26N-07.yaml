stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$\int_0^x f(t)\,dt=2x^3-3x^2\int_0^1 f(t)\,dt$$
  를 만족시킬 때, $f(1)$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\int_0^x f(t)\,dt=2x^3-3x^2\int_0^1 f(t)\,dt$ ……㉠
        $\int_0^1 f(t)\,dt=k$ ($k$는 실수)라 하자.
        ㉠의 양변을 $x$에 대하여 미분하면 $f(x)=6x^2-6kx$
      source_flow: 보고서 p.133~135
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\int_0^1(6t^2-6kt)\,dt=\left[2t^3-3kt^2\right]_0^1=2-3k$
        즉 $k=2-3k$이므로 $k=\dfrac12$이다.
        따라서 $f(x)=6x^2-3x$이므로 $f(1)=3$이다.
      source_flow: 보고서 p.133~135
      criteria:
      - 1.A1
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    key_idea: 별해1
    steps:
    - id: 1c1-1
      content: |
        $\int_0^1 f(t)\,dt=k$라 하자.
        $\int_0^x f(t)\,dt=2x^3-3kx^2$이므로 $x=1$을 대입하면, $k=2-3k$이다.
        따라서, $k=\dfrac12$이다.
      source_flow: 보고서 p.133~135
      criteria:
      - 1.M1
    - id: 1c1-2
      content: |
        $\int_0^x f(t)\,dt=2x^3-3kx^2$이므로 $k=\dfrac12$를 대입하면,
        $\int_0^x f(t)\,dt=2x^3-\dfrac32x^2$이다.
        양변을 미분하면, $f(x)=6x^2-3x$
        $\therefore f(1)=3$
      source_flow: 보고서 p.133~135
      criteria:
      - 1.A1
  - id: S1-ALT2
    audience: ALT
    method_no: 3
    key_idea: 별해2
    steps:
    - id: 1c2-1
      content: |
        $x=1$을 대입하면 $\int_0^1 f(t)\,dt=2-3\int_0^1 f(t)\,dt$
        $\therefore \int_0^1 f(t)\,dt=\dfrac12$
        $\therefore \int_0^x f(t)\,dt=2x^3-\dfrac32x^2$
      source_flow: 보고서 p.133~135
      criteria:
      - 1.M1
    - id: 1c2-2
      content: |
        양변을 미분하면, $f(x)=6x^2-3x$
        따라서, $f(1)=6-3=3$
      source_flow: 보고서 p.133~135
      criteria:
      - 1.A1
