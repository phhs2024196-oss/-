stimuli: []
stem: |
  두 자연수 $m,n$의 순서쌍 $(m,n)$이
  $$\log_{2n}\sqrt m+2\log_{2n}m=\dfrac{15}{4}$$
  를 만족시킬 때, $m+n$의 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '10'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\log_{2n}\sqrt m+2\log_{2n}m=\dfrac52\log_{2n}m=\dfrac{15}{4}$이므로
        $\log_{2n}m=\dfrac32$에서 $m^2=(2n)^3$ (또는 $m=(2n)^{\frac32}$)이다.
      source_flow: 보고서 p.137
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        좌변이 제곱수이므로 $n=2p^2$ ($p$는 자연수) 꼴이어야 한다.
        $p=1$이면 $(2n)^3=(2\times2)^3=(2^3)^2$이다.
        그러므로 $n=2,\ m=8$일 때, $m+n$의 최솟값은 $10$이다.
      # 원본 오기 수정(독립 교차검증 2회 일치, 2026-11-23): 보고서 p.137 원문은 "n=2p 꼴" → (2n)^3 이 제곱수이려면 n=2p^2
      source_flow: 보고서 p.137
      criteria:
      - 1.A1
