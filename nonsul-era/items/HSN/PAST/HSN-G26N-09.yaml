      evidence: 좌변을 $a_1-a_n$으로, 우변을 $\dfrac n2$로 계산했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $a_1-a_n=\dfrac n2$에서 $a_n=a_1-\dfrac n2$를 구하고 $a_{40}=5$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
