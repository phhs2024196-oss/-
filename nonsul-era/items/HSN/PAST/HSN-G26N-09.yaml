stimuli: []
stem: |
  수열 $\{a_n\}$이 $n\ge2$인 모든 자연수 $n$에 대하여
  $$\sum_{k=1}^{n-1}(a_k-a_{k+1})=\sum_{k=1}^{n-1}\dfrac{k}{n-1}$$
  를 만족시킨다. $a_1=25$일 때, $a_{40}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sum_{k=1}^{n-1}(a_k-a_{k+1})=(a_1-a_2)+(a_2-a_3)+\cdots+(a_{n-1}-a_n)=a_1-a_n$이고,
        $\sum_{k=1}^{n-1}\dfrac{k}{n-1}=\dfrac1{n-1}\left\{\dfrac{(n-1)n}{2}\right\}=\dfrac n2$이므로
      source_flow: 보고서 p.139
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\sum_{k=1}^{n-1}(a_k-a_{k+1})=\sum_{k=1}^{n-1}\dfrac{k}{n-1}$에서 $a_1-a_n=\dfrac n2$ ……㉠
        ㉠에서 $a_n=a_1-\dfrac n2$이므로 $a_{40}=25-\dfrac{40}{2}=5$이다.
      source_flow: 보고서 p.139
      criteria:
      - 1.A1
