  item_note: '문항카드 5. 문항 해설: 수열은 규칙적으로 나열된 수로 나타낼 수 있는 현상을 탐구하는 데 활용되며 수열의 극한과 급수의 기초 개념이다. 본 문항의 핵심적인 내용은 수학Ⅰ의 ''수열'' 단원에서 다루어진다. 따라서 본 문항을 통해 학생들이 등비수열의 뜻을 알고, 일반항, 첫째항부터 제 $n$ 항까지의 합을 구할 수 있는지를 평가한다.'
