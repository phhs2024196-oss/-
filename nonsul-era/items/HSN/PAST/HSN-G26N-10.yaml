stimuli: []
stem: |
  첫째항이 $4$이고 공비가 $2$인 등비수열 $\{a_n\}$이 있다. 수열 $\{a_n^2\}$의 첫째항부터 $n$항까지의 합을 $S_n$이라 할 때, $S_n-S_{n-2}=320$을 만족시키는 자연수 $n$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        등비수열 $\{a_n\}$의 첫째항이 $4$이고 공비가 $2$이므로 $a_n=4\times2^{n-1}=2^{n+1}$
        $a_n^2=(2^{n+1})^2=2^{2(n-1)+4}=2^4\times4^{n-1}$
        따라서 수열 $\{a_n^2\}$은 첫째항이 $16$이고 공비가 $4$인 등비수열이므로
        수열 $\{a_n^2\}$의 첫째항부터 $n$항까지의 합 $S_n=\dfrac{16(4^n-1)}{4-1}$이고
      source_flow: 보고서 p.141~142
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $S_{n-2}=\dfrac{16(4^{n-2}-1)}{4-1}$이다.
        $S_n-S_{n-2}=\dfrac{16}{3}\{(4^n-1)-(4^{n-2}-1)\}=\dfrac{16}{3}\times4^{n-2}\times(16-1)=80\times4^{n-2}$
        따라서 $S_n-S_{n-2}=320=80\times4^{n-2}$에서
        $4=4^{n-2}$이 되는 $n=3$이다.
      source_flow: 보고서 p.141~142
      criteria:
      - 1.A1
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    key_idea: 별해
    steps:
    - id: 1c1-1
      content: |
        등비수열 $\{a_n\}$의 첫째항이 $4$이고 공비가 $2$이므로 $a_n=4\times2^{n-1}=2^{n+1}$
        $a_n^2=(2^{n+1})^2=2^{2(n-1)+4}=2^4\times4^{n-1}$
        $S_n-S_{n-2}=a_n^2+a_{n-1}^2=16\cdot4^{n-1}+16\cdot4^{n-2}=16\cdot4^{n-2}\cdot5$
      source_flow: 보고서 p.141~142
      criteria:
      - 1.M1
    - id: 1c1-2
      content: |
        $16\cdot4^{n-2}\cdot5=320$
        $4^{n-2}=4$
        $\therefore n=3$
      source_flow: 보고서 p.141~142
      criteria:
      - 1.A1
