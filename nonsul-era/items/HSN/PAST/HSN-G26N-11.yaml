stem: |
  함수 $f(x)=\begin{cases} x^3+x^2-x+3 & (x<1) \\ ax^2+b & (x\ge1) \end{cases}$가 $x=1$에서 미분가능할 때, $a-b$의 값을 구하는 과정을 서술하시오. (단, $a,\ b$는 상수이다.)
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$가 $x=1$에서 미분가능하므로 $x=1$에서 연속이다.
        즉, $\lim_{x\to1-}f(x)=\lim_{x\to1+}f(x)=f(1)$
        $\lim_{x\to1-}f(x)=x^3+x^2-x+3=1+1-1+3=4$
        $\lim_{x\to1+}f(x)=a+b$
        $f(1)=a+b$이므로 $a+b=4$ ……㉠
      source_flow: 보고서 p.144
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        함수 $f(x)$가 $x=1$에서 미분가능하므로
        $\lim_{x\to1-}\dfrac{f(x)-f(1)}{x-1}=\lim_{x\to1+}\dfrac{f(x)-f(1)}{x-1}$을 만족한다.
        $\lim_{x\to1-}\dfrac{f(x)-f(1)}{x-1}=\lim_{x\to1-}\dfrac{x^3+x^2-x+3-(a+b)}{x-1}=4$
        $\lim_{x\to1+}\dfrac{f(x)-f(1)}{x-1}=\lim_{x\to1+}\dfrac{ax^2+b-(a+b)}{x-1}=2a$
        $4=2a$이어야 하므로 $a=2$이고 ㉠에 의해 $b=2$이다.
        따라서 $a-b=0$이다.
      # 원본 오기 수정(독립 교차검증 2회 일치, 2026-11-23): 보고서 p.144 원문은 분자 상수 5 → f(x)=x^3+x^2-x+3 이므로 3
      source_flow: 보고서 p.144
      criteria:
      - 1.A1
