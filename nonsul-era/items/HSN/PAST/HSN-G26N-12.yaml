  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        선분 $AC$가 원의 지름이므로 삼각형 $ABC$는 $\angle B=\dfrac\pi2$인 직각삼각형이다.
        $\sin(\angle CAB)=\dfrac{\sqrt3}{3}$이므로 $\overline{BC}=2\sqrt3$이고 $\overline{AB}=2\sqrt6$이다.
        $\angle ADB=\angle ACB$이므로 $\cos(\angle ADB)=\dfrac{\sqrt3}{3}$이다.
        (가) $2\sqrt3$, (나) $2\sqrt6$, (다) $\dfrac{\sqrt3}{3}$
      source_flow: 보고서 p.146~147
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\overline{BD}=x$라 하면 삼각형 $ABD$에서 코사인법칙에 의하여
        $\overline{AB}^2=\overline{AD}^2+\overline{BD}^2-2\overline{AD}\times\overline{BD}\times\cos(\angle ADB)$이므로
        $x$에 대한 이차방정식 $x^2-6x+3=0$을 얻는다.
        그러므로 $x=\cdots\cdots$. (이하 생략)
        (라) $-6$
      source_flow: 보고서 p.146~147
      criteria:
      - 1.A1
