stem: |
  그림과 같이 길이가 $6$인 선분 $AC$를 지름으로 하는 원에 내접하는 두 삼각형 $ABC$, $ABD$가 있다.
  [그림 1: 선분 $AC$를 지름으로 하는 원. 원 위에 점 $A$(왼쪽), $D$(왼쪽 위), $C$(오른쪽 위), $B$(오른쪽 아래)가 있고 삼각형 $ABC$, $ABD$를 이룬다. 중심 근처에 $6$, 선분 $AD$ 옆에 $3\sqrt3$이 표시되어 있고 일부 선분은 점선이다.]
  다음은 $\overline{AD}=3\sqrt3$이고 $\sin(\angle CAB)=\dfrac{\sqrt3}{3}$일 때, $\overline{BD}$의 길이를 구하는 과정이다.
  (가), (나), (다), (라)에 들어갈 가장 알맞은 수를 구하시오.
  선분 $AC$가 원의 지름이므로 삼각형 $ABC$는 $\angle B=\dfrac\pi2$인 직각삼각형이다.
  $\sin(\angle CAB)=\dfrac{\sqrt3}{3}$이므로 $\overline{BC}=$ (가)이고 $\overline{AB}=$ (나)이다.
  $\angle ADB=\angle ACB$이므로 $\cos(\angle ADB)=$ (다)이다.
  $\overline{BD}=x$라 하면 삼각형 $ABD$에서 코사인법칙에 의하여
  $x$에 대한 이차방정식 $x^2+$ (라) $x+3=0$을 얻는다.
  그러므로 $x=\cdots\cdots$. (이하 생략)
