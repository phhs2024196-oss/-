stimuli: []
stem: |
  삼차함수 $f(x)$에 대하여 함수 $y=f'(x)$의 그래프가 그림과 같고 $f'(0)=f'(2)=0$이다.
  [그림 1: 좌표평면에서 곡선 $y=f'(x)$는 위로 볼록한 포물선이고, $x$축과 원점 $O$와 $x=2$에서 만난다. 두 점 사이에서 곡선은 $x$축 위쪽에 있다.]
  함수 $f(x)$의 극솟값이 $-1$이고 극댓값이 $3$일 때, $f(-1)$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        이차함수 $y=f'(x)$가 $f'(0)=f'(2)=0$이고 위로 볼록하므로
        $f'(x)=ax(x-2)=ax^2-2ax$ ($a<0$)
        그러므로 $f(x)=\dfrac13ax^3-ax^2+C$ ($C$는 상수)
      source_flow: 보고서 p.149
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 $x=0$일 때 극소이고 극솟값은 $f(0)=C=-1$
        $x=2$일 때 극대이고 극댓값은 $f(2)=\dfrac83a-4a-1=3$
        즉, $a=-3$
        따라서 $f(x)=-x^3+3x^2-1$이고 $f(-1)=3$
      source_flow: 보고서 p.149
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $f'(x)=ax(x-2)$ ($a<0$)로 놓고 $f(x)=\dfrac13ax^3-ax^2+C$를 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $f(0)=-1$, $f(2)=3$으로 $C=-1$, $a=-3$을 구하고 $f(-1)=3$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
