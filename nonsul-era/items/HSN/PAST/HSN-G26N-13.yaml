  item_note: '문항카드 5. 문항 해설: 미분은 함수의 순간적인 변화를 설명하는 도구로서 여러 가지 미분법과 함수의 적분에 대한 기초가 되고 최대, 최소 문제를 포함하여 변화 현상을 다루는 데 활용된다. 본 문항의 핵심적인 내용은 수학Ⅱ의 ''미분'' 단원에서 다루어진다. 따라서 본 문항을 통해 학생들이 함수의 그래프의 개형을 그리고, 함수의 증가와 감소, 극대와 극소를 판정하고 구할 수 있는지를 평가한다.'
