stem: |
  $0\le x\le2\pi$에서 방정식 $\sin x=\cos4x$의 모든 근의 합을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 15*pi/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 함수 $y=\sin x$와 $y=\cos4x$의 그래프를 그리면 다음과 같다.
        [그림: $0\le x\le2\pi$에서 $y=\sin x$와 $y=\cos4x$의 그래프]
      source_flow: 보고서 p.151
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        두 그래프의 교점의 $x$좌표를 순서대로 $x_1<x_2<\cdots<x_7$이라 하면 함수의 대칭성에 의해서
        $\dfrac{x_1+x_3}{2}=\dfrac\pi2,\ x_2=\dfrac\pi2,\ \dfrac{x_4+x_7}{2}=\dfrac{3\pi}{2},\ \dfrac{x_5+x_6}{2}=\dfrac{3\pi}{2}$이다.
        $x_1+x_2+\cdots+x_7=\dfrac{15\pi}{2}$이므로,
        모든 근의 합은 $\dfrac{15\pi}{2}$이다.
      source_flow: 보고서 p.151
      criteria:
      - 1.A1
