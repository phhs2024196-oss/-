stimuli: []
stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) 모든 실수 $x$에 대하여 $\{f(x)\}^2-(x^2+1)f(x)+x^2=0$
  (나) 함수 $f(x)$는 $x=-1$에서만 미분가능하지 않다.
  (다) 함수 $f(x)$의 최솟값은 $0$이다.
  $f(-2)+f'(2)$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\{f(x)\}^2-(x^2+1)f(x)+x^2=0$이므로 $(f(x)-x^2)(f(x)-1)=0$이다.
        따라서 (주어진 $x$에 대하여) $f(x)=x^2$ 또는 $f(x)=1$을 만족한다.
      source_flow: 보고서 p.153
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        그러므로 문제의 조건을 만족하는 함수의 그래프를 표현하면 다음과 같다.
        [그림: $x\le-1$ 부분은 직선 $y=1$이 실선, $x\ge-1$ 부분은 포물선 $y=x^2$이 실선이며, $x<-1$에서의 포물선과 $x>1$에서의 직선 $y=1$은 점선으로 표시된 그래프]
        그러므로 $f(-2)=1$이고 $f'(x)=2x,\ f'(2)=4$이다.
        따라서 $f(-2)+f'(2)=5$이다.
      source_flow: 보고서 p.153
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
