stimuli: []
stem: |
  $\pi<\theta<\dfrac{3}{2}\pi$인 $\theta$에 대하여 $\dfrac{\sin\theta}{1-\sin\theta}-\dfrac{\sin\theta}{1+\sin\theta}=2$일 때, $\theta$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: '5*pi/4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        좌변을 통분하면 $\dfrac{\sin\theta(1+\sin\theta)-\sin\theta(1-\sin\theta)}{1-\sin^2\theta}=\dfrac{2\sin^2\theta}{\cos^2\theta}=2\tan^2\theta$이므로 $\tan^2\theta=1$이다. (풀이 2: $\dfrac{2\sin^2\theta}{1-\sin^2\theta}=2$에서 $\sin^2\theta=\dfrac12$)
      source_flow: 모범답안 p.7
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\pi<\theta<\dfrac32\pi$에서 $\tan\theta>0$이므로 $\tan\theta=1$, 따라서 $\theta=\dfrac54\pi$이다.
      source_flow: 모범답안 p.7
      criteria: [1.A1]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 1c-1
      content: |
        풀이 2: $\dfrac{2\sin^2\theta}{1-\sin^2\theta}=2$에서 $\sin^2\theta=1-\sin^2\theta$, 즉 $\sin^2\theta=\dfrac12$이다.
      source_flow: 모범답안 p.7
      criteria: [1.M1]
    - id: 1c-2
      content: |
        $\pi<\theta<\dfrac32\pi$에서 $\sin\theta<0$이므로 $\sin\theta=-\dfrac{\sqrt2}{2}$, 따라서 $\theta=\dfrac54\pi$이다.
      source_flow: 모범답안 p.7
      criteria: [1.A1]
  rubric:
