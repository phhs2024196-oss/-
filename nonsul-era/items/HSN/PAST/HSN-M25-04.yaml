stimuli: []
stem: |
  함수
  $$f(x)=\begin{cases}-3ax+a^2 & (x<2)\\ 2x-a & (x\ge2)\end{cases}$$
  가 실수 전체의 집합에서 연속이 되도록 하는 모든 실수 $a$의 값의 합을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    (소문항 없음)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        각 구간에서 $f$는 다항함수이므로 연속이고, $x=2$에서 연속이려면 $\displaystyle\lim_{x\to2-}f(x)=f(2)$이어야 하므로 $-6a+a^2=4-a$, 즉 $a^2-5a-4=0$이다.
      source_flow: 모범답안 p.7
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이차방정식 $a^2-5a-4=0$의 판별식을 $D$라 하면 $D=(-5)^2-4\times(-4)=25+16=41>0$이므로 근과 계수의 관계에 의하여 모든 실수 $a$의 값의 합은 $5$이다.
      source_flow: 모범답안 p.7
      criteria: [1.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $x=2$에서의 연속 조건으로 $-6a+a^2=4-a$ (또는 $a^2-5a-4=0$)을 세웠다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        판별식으로 서로 다른 두 실근을 확인하고 근과 계수의 관계로 합 $5$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
