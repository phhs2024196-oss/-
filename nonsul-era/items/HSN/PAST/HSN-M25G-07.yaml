    steps:
    - id: 1b-1
      content: |
        양수 $x$에 대하여 $\dfrac{(3x-7)(2x^2+1)}{x(x^2+7)}<\dfrac{f(x)}{x}<\dfrac{3x(2x^2+1)}{x(x^2+3)}$이고, 두 극한 $\displaystyle\lim_{x\to\infty}\dfrac{(3x-7)(2x^2+1)}{x(x^2+7)}=6$, $\displaystyle\lim_{x\to\infty}\dfrac{3x(2x^2+1)}{x(x^2+3)}=6$이므로 극한의 대소 관계에 의하여 $\displaystyle\lim_{x\to\infty}\dfrac{f(x)}{x}=6$이다. 따라서 (가)의 정답은 6이다.
      source_flow: 모범답안 p.20
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to\infty}\dfrac{4x+2f(x)}{8x-f(x)}=\lim_{x\to\infty}\dfrac{4+2\cdot\frac{f(x)}{x}}{8-\frac{f(x)}{x}}=\dfrac{4+2\times6}{8-6}=8$이다. 따라서 (나)의 정답은 8이다.
      source_flow: 모범답안 p.20
      criteria: [1.B2]
