stimuli: []
stem: |
  함수 $f(x)$가 모든 실수 $x$에 대하여 $\dfrac{3x-7}{x^2+7}<\dfrac{f(x)}{2x^2+1}<\dfrac{3x}{x^2+3}$를 만족시킨다. 다음은 $\displaystyle\lim_{x\to\infty}\dfrac{4x+2f(x)}{8x-f(x)}$의 값을 구하는 과정이다. 아래의 (가), (나)에 들어갈 가장 적절한 상수를 구하시오.
  
  양수 $x$에 대하여
  $$\dfrac{(3x-7)(2x^2+1)}{x(x^2+7)}<\dfrac{f(x)}{x}<\dfrac{3x(2x^2+1)}{x(x^2+3)}$$
  이다.
  
  $\displaystyle\lim_{x\to\infty}\dfrac{(3x-7)(2x^2+1)}{x(x^2+7)}=$ (가), $\displaystyle\lim_{x\to\infty}\dfrac{3x(2x^2+1)}{x(x^2+3)}=$ (가)
  
  이므로 함수의 극한의 대소 관계에 의하여 $\displaystyle\lim_{x\to\infty}\dfrac{f(x)}{x}=$ (가)이다.
  
  따라서 $\displaystyle\lim_{x\to\infty}\dfrac{4x+2f(x)}{8x-f(x)}=$ (나)이다.
