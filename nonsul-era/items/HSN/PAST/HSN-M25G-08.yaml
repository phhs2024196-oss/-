stimuli: []
stem: |
  삼차함수 $f(x)$가 다음 조건을 만족시킬 때, 곡선 $y=f(x)$와 $x$축으로 둘러싸인 부분의 넓이를 구하는 과정을 서술하시오.
  
  (가) $f(x)$의 최고차항의 계수는 $-1$이다.
  (나) 방정식 $f(x)=0$을 만족시키는 실수 $x$의 값은 $0,1,2$이다.
