  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=-x(x-1)(x-2)=-x^3+3x^2-2x$이다.
      source_flow: 모범답안 p.21
      criteria: [1.M1]
    - id: 1b-2
      content: |
        구하는 넓이는 $\displaystyle\int_0^2|f(x)|\,dx=2\int_0^1(x^3-3x^2+2x)\,dx=2\left[\dfrac14x^4-x^3+x^2\right]_0^1=2\times\dfrac14=\dfrac12$이다.
      source_flow: 모범답안 p.21
      criteria: [1.A1]
