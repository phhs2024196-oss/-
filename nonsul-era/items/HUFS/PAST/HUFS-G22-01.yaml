stimuli: []

stem: |
  $x$에 대한 이차방정식 $x^2-3x+1=0$의 한 근이 $\tan\theta$일 때, $\sin\theta\times\cos\theta$의 값을 구하시오. (단, $\theta$는 $0<\theta<\dfrac{\pi}{2}$인 상수이다.) (9점)

subparts:
- id: '1'
  stem: |
    $\sin\theta\times\cos\theta$의 값을 구하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 근의 곱이 1이므로 나머지 근은 $\dfrac1{\tan\theta}$, 두 근의 합 $3=\dfrac1{\sin\theta\cos\theta}$.
    steps:
    - {id: 1a, content: '$3=\tan\theta+\dfrac1{\tan\theta}=\dfrac1{\sin\theta\cos\theta}\Rightarrow\sin\theta\cos\theta=\dfrac13$', criteria: [1.M1, 1.M2, 1.M3, 1.A1, 1.A2]}
    hint_ladder:
    - 두 근의 곱은 얼마인가?
    - $\tan\theta+\dfrac1{\tan\theta}$를 $\sin\theta$, $\cos\theta$로 나타내 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 선행학습 영향평가 자체평가보고서 p.75
    steps:
    - id: 1b-1
      content: |
        (i) 근과 계수의 관계로부터 두 근의 곱은 $1$인데, 한 근이 $\tan\theta$이므로 나머지 한 근은 $\dfrac{1}{\tan\theta}$이다. (3점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (ii) 근과 계수의 관계로부터 두 근의 합은 $3$이므로
        $$3=\tan\theta+\dfrac{1}{\tan\theta}\ (2점)$$
        $$=\dfrac{\sin\theta}{\cos\theta}+\dfrac{\cos\theta}{\sin\theta}=\dfrac{\sin^2\theta+\cos^2\theta}{\sin\theta\cos\theta}\ (2점)$$
        $$=\dfrac{1}{\sin\theta\cos\theta}\ (1점)$$
        이 성립한다.
      criteria: [1.M2, 1.M3, 1.A1]
    - id: 1b-3
      content: |
        (iii) 따라서 $\sin\theta\cos\theta=\dfrac{1}{3}$이다. (1점)
      criteria: [1.A2]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 근 $\dfrac{3\pm\sqrt5}2$ 두 경우를 모두 놓고 $\sin\theta\cos\theta=\dfrac{\tan\theta}{1+\tan^2\theta}$에 대입(채점 유의사항 2 — 한 경우만 계산하면 1점 감점).
    steps:
    - id: 1c-1
      content: |
        $\sin\theta\cos\theta=\dfrac{\tan\theta}{1+\tan^2\theta}$이고 $\tan^2\theta=3\tan\theta-1$이므로 $\dfrac{\tan\theta}{3\tan\theta}=\dfrac13$. 두 근 어느 쪽이어도 같다.
      criteria: [1.M2, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 두 근의 곱이 1임에서 나머지 한 근이 $\dfrac1{\tan\theta}$임을 적었다(채점기준 도입 3점).
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: 두 근의 합에서 $3=\tan\theta+\dfrac1{\tan\theta}$를 세웠다.
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: '$\dfrac{\sin\theta}{\cos\theta}+\dfrac{\cos\theta}{\sin\theta}=\dfrac{\sin^2\theta+\cos^2\theta}{\sin\theta\cos\theta}$로 변형했다.'
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: '$\sin^2\theta+\cos^2\theta=1$을 써서 $\dfrac1{\sin\theta\cos\theta}$를 얻었다(전개 합 5점).'
      depends_on: [1.M3]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: $\sin\theta\cos\theta=\dfrac13$.
      depends_on: [1.M2]
      cao: true
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: '$\tan\theta$를 $\dfrac{3\pm\sqrt5}2$ 중 하나로만 놓고 풂(채점 유의사항 2)'
      effect: minus
      value: 1
    - code: D1-2
      condition: 단순 계산 실수 등 사소한 실수(건당)
      effect: minus
      value: 1
