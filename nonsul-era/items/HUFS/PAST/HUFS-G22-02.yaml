stimuli: []

stem: |
  곡선 $y=x^3-x$와 직선 $y=3x$로 둘러싸인 영역의 넓이를 구하시오. (9점)

subparts:
- id: '1'
  stem: |
    둘러싸인 영역의 넓이를 구하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: '8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 교점 $x=-2,0,2$, 위아래가 바뀌는 두 영역을 원점대칭으로 합쳐 $2\displaystyle\int_0^2(4x-x^3)\,dx$.
    steps:
    - {id: 1a, content: '$x^3-4x=x(x+2)(x-2)$, $S=2\displaystyle\int_0^2(4x-x^3)dx=2\left[2x^2-\dfrac{x^4}4\right]_0^2=8$', criteria: [1.B1, 1.M1, 1.A1]}
    hint_ladder:
    - 두 그래프의 교점의 $x$좌표부터 구하자.
    - 각 구간에서 어느 그래프가 위에 있는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 선행학습 영향평가 자체평가보고서 p.76~77
    steps:
    - id: 1b-1
      content: |
        (i) $f(x)=x^3-x$, $g(x)=3x$로 두면 $f(x)-g(x)=x^3-4x=x(x+2)(x-2)$이다. 따라서 두 함수의 그래프의 교점의 $x$좌표는 $-2$, $0$, $2$이다. (3점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (ii) 좌표평면에 두 함수의 그래프를 그리면 [그림: $y=x^3-x$와 $y=3x$가 $x=-2,0,2$에서 만나고, $-2\le x\le0$에서는 곡선이 직선 위, $0\le x\le2$에서는 직선이 곡선 위에 있는 두 영역이 색칠됨] 다음과 같다. 따라서 함수 $f(x)$의 그래프와 함수 $g(x)$의 그래프로 둘러싸인 영역의 넓이 $S$는
        $$S=\int_{-2}^{0}(f(x)-g(x))\,dx+\int_{0}^{2}(g(x)-f(x))\,dx$$
        이다. (3점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        (iii) 함수 $f(x)-g(x)=x^3-4x$의 그래프는 원점대칭이므로 $S$는 다음과 같이 계산할 수 있다.
        $$S=2\int_0^2(g(x)-f(x))\,dx=2\int_0^2(4x-x^3)\,dx=2\left[2x^2-\dfrac{x^4}{4}\right]_0^2=8\ (3점)$$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
