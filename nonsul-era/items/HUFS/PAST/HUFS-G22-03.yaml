stimuli: []

stem: |
  원 $x^2+y^2=r^2$ 위의 점과 직선 $y=-rx+2r$ 사이의 거리의 최댓값과 최솟값을 각각 $M(r)$과 $m(r)$이라고 할 때, $\displaystyle\lim_{r\to0+}\dfrac{M(r)}{m(r)}$의 값을 구하시오. (단, $0<r<\sqrt3$이다.) (9점)

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{r\to0+}\dfrac{M(r)}{m(r)}$의 값을 구하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 중심과 직선 사이 거리 $d$에 대해 $M=d+r$, $m=d-r$.
    steps:
    - {id: 1a, content: '$d=\dfrac{2r}{\sqrt{r^2+1}}$, $\dfrac{M}{m}=\dfrac{2+\sqrt{r^2+1}}{2-\sqrt{r^2+1}}\to\dfrac{2+1}{2-1}=3$', criteria: [1.M1, 1.B1, 1.B2, 1.M2, 1.A1]}
    hint_ladder:
    - 원 위의 점에서 직선까지의 거리가 가장 먼 점과 가장 가까운 점은 어디에 있는가?
    - 중심에서 직선까지의 거리 $d$로 $M$, $m$을 나타내 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 선행학습 영향평가 자체평가보고서 p.77~78
    steps:
    - id: 1b-1
      content: |
        (i) 원의 중심을 지나고 직선 $\ell:y=-rx+2r$에 수직인 직선을 $\ell^\prime$이라고 하자. 두 직선 $\ell$과 $\ell^\prime$의 교점을 $\mathrm{A}$라 하고, 직선 $\ell^\prime$과 원의 두 교점 중 점 $\mathrm{A}$에 더 가까운 점을 $\mathrm{B}$, 나머지 점을 $\mathrm{C}$라고 하자. 그러면 $M(r)$은 선분 $\mathrm{AC}$의 길이이고, $m(r)$은 선분 $\mathrm{AB}$의 길이이다. (2점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (ii) 원의 중심 $\mathrm{O}(0,0)$과 직선 $\ell:rx+y-2r=0$ 사이의 거리를 $d$라고 하면
        $$M(r)=d+r,\quad m(r)=d-r$$
        이다. (1점)
      criteria: [1.B1]
    - id: 1b-3
      content: |
        (iii) 한편, 점과 직선 사이의 거리 공식에 의해
        $$d=\dfrac{\lvert-2r\rvert}{\sqrt{r^2+1}}=\dfrac{2r}{\sqrt{r^2+1}}$$
        이다. (2점)
      criteria: [1.B2]
    - id: 1b-4
      content: |
        (iv) (ii)와 (iii)에 의해 구하려는 극한값은 다음과 같다. [그림: 원 $x^2+y^2=r^2$, 직선 $y=-rx+2r$($y$절편 $2r$, $x$절편 $2$), 원점을 지나는 수직 점선 위의 점 $\mathrm{A}$(직선 위), $\mathrm{B}$, $\mathrm{C}$(원 위)]
        $$\lim_{r\to0+}\dfrac{M(r)}{m(r)}=\lim_{r\to0+}\dfrac{\dfrac{2r}{\sqrt{r^2+1}}+r}{\dfrac{2r}{\sqrt{r^2+1}}-r}=\lim_{r\to0+}\dfrac{2r+r\sqrt{r^2+1}}{2r-r\sqrt{r^2+1}}=\lim_{r\to0+}\dfrac{2+\sqrt{r^2+1}}{2-\sqrt{r^2+1}}\ (2점)$$
      criteria: [1.M2]
    - id: 1b-5
      content: |
        $$=\dfrac{2+1}{2-1}=3\ (2점)$$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 중심을 지나 직선에 수직인 직선으로 최대·최소 거리가 되는 점을 정해 $M(r)$, $m(r)$을 선분 길이로 나타냈다.
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: $M(r)=d+r$, $m(r)=d-r$을 적었다(채점기준 도입 = (i)+(ii) 3점).
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: 점과 직선 사이의 거리 공식으로 $d=\dfrac{2r}{\sqrt{r^2+1}}$을 구했다(채점기준 전개 2점).
      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: 분자·분모를 $r$로 약분해 $\dfrac{2+\sqrt{r^2+1}}{2-\sqrt{r^2+1}}$ 꼴로 정리했다.
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: 극한값 $3$(채점기준 결론 = (iv) 4점).
      depends_on: [1.M2]
      cao: true
      steps: [1b-5]
