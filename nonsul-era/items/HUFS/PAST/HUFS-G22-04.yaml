stimuli: []

stem: |
  모든 자연수 $n$에 대하여 다음 명제가 성립함을 수학적 귀납법으로 증명하시오. (9점)

  $9^{2^n}$을 $2^{n+3}$으로 나눈 나머지는 $1$이다.

subparts:
- id: '1'
  stem: |
    위 명제를 수학적 귀납법으로 증명하시오.
  points: 9
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $n=1$에서 $81=16\times5+1$, 귀납 가정 $9^{2^k}=2^{k+3}q+1$을 제곱한다.
    steps:
    - {id: 1a, content: '$9^{2^{k+1}}=(2^{k+3}q+1)^2=2^{k+4}(2^{k+2}q^2+q)+1$', criteria: [1.B1, 1.M1, 1.M2, 1.R1]}
    hint_ladder:
    - 「나머지가 1이다」를 몫을 써서 등식으로 나타내 보자.
    - $9^{2^{k+1}}$은 $9^{2^k}$과 어떤 관계인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 선행학습 영향평가 자체평가보고서 p.79
    steps:
    - id: 1b-1
      content: |
        (i) $n=1$일 때 $9^{2^n}=9^2=81$, $2^{n+3}=16$이다. $81=16\times5+1$이므로 $9^{2^n}=81$을 $2^{n+3}=16$으로 나눈 나머지는 $1$이다. 즉, 주어진 명제가 $n=1$일 때 성립한다. (3점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (ii) $n=k$(단, $k\ge1$)일 때 위 명제가 성립한다고 가정하자. (1점) 즉, 어떤 정수 $q$(단, $q\ge0$)에 대해
        $$9^{2^k}=2^{k+3}q+1\qquad\cdots\cdots(1)$$
        이 성립한다. (1점)
      criteria: [1.M1, 1.M2]
    - id: 1b-3
      content: |
        (iii) 이제 (1)에 의해
        $$9^{2^{k+1}}=9^{2^k\times2}=(9^{2^k})^2=(2^{k+3}q+1)^2=2^{2k+6}q^2+2^{k+4}q+1=2^{k+4}(2^{k+2}q^2+q)+1\qquad\cdots\cdots(2)$$
        이 성립한다. 따라서 $9^{2^{k+1}}$을 자연수인 $2^{k+4}$으로 나누면, 정수인 몫은 $2^{k+2}q^2+q$이고 나머지는 $1$이다. 따라서 위 명제는 $n=k+1$일 때도 성립한다.
        (i)~(iii)에 의해, 주어진 명제는 모든 자연수 $n$에 대하여 성립한다. (4점)
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $n=1$일 때 $81=16\times5+1$로 성립함을 보였다(채점기준 도입).
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: $n=k$($k\ge1$)일 때 명제가 성립한다고 가정했다.
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 1
      evidence: 가정을 정수 $q\ge0$에 대한 식 (1) $9^{2^k}=2^{k+3}q+1$로 세웠다(채점기준 전개 = 1+1점).
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: 식 (1)을 제곱해 식 (2) $9^{2^{k+1}}=2^{k+4}(2^{k+2}q^2+q)+1$을 유도하고, 몫이 정수이므로 나머지가 1임을 밝혀 $n=k+1$에서 성립한다는 결론을 내렸다(채점기준 결론).
      depends_on: [1.M2]
      not_penalized:
      - 마지막 문장 「(i)~(iii)에 의해 … 모든 자연수 $n$에 대하여 성립한다」 생략(채점 유의사항 2)
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 수학적 귀납법이 아닌 다른 증명(채점 유의사항 1)
      effect: zero
      value: 0
    - code: D1-2
      condition: 단순 계산 실수 등 사소한 실수(건당)
      effect: minus
      value: 1
