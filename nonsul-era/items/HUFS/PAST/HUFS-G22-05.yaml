stimuli: []

stem: |
  상수 $a$, $b$, $c$가 다음 조건을 모두 만족한다.

  (가) $a>0$, $b>0$, $c>0$

  (나) $\sqrt{a}=\sqrt[3]{b}=\sqrt[5]{c}$

  (다) $\log_3\dfrac{bc}{a}=3$

  $1$보다 큰 두 실수 $m$과 $n$이 $\log_3a\times\log_mb\times\log_nc=1$을 만족할 때, $\log_3mn$의 최솟값과 그 때의 $\log_3m$과 $\log_3n$의 값을 구하시오. (10점)

subparts:
- id: '1'
  stem: |
    $\log_3mn$의 최솟값과 그 때의 $\log_3m$과 $\log_3n$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '(sqrt(15), sqrt(15)/2, sqrt(15)/2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a=3$, $b=3^{\frac32}$, $c=3^{\frac52}$ → $\log_3m\log_3n=\dfrac{15}4$ → 산술·기하평균.
    steps:
    - {id: 1a, content: '$\log_3m+\log_3n\ge2\sqrt{\dfrac{15}4}=\sqrt{15}$, 등호 $\log_3m=\log_3n=\dfrac{\sqrt{15}}2$', criteria: [1.B1, 1.B2, 1.R1, 1.M1, 1.A1]}
    hint_ladder:
    - (나)의 공통값을 $k$로 두자.
    - $\log_mb$, $\log_nc$를 밑이 3인 로그로 바꾸어 보자.
    - 곱이 일정한 두 양수의 합의 최솟값은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 선행학습 영향평가 자체평가보고서 p.80
    steps:
    - id: 1b-1
      content: |
        (i) (나)에 의해 상수 $k$를 $k=\sqrt a=\sqrt[3]b=\sqrt[5]c$로 둔다. 그러면 $a=k^2$, $b=k^3$, $c=k^5$이 되고, 이를 (다)에서 주어진 식에 대입하면 $3=\log_3\dfrac{bc}{a}=\log_3k^6$이므로 $\log_3k=\dfrac12$이다. 따라서
        $$k=3^{\frac12},\quad a=3,\quad b=3^{\frac32},\quad c=3^{\frac52}\qquad\cdots\cdots(1)$$
        이다. (3점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (ii) $1$보다 큰 두 실수 $m$과 $n$이 $\log_3a\times\log_mb\times\log_nc=1$을 만족한다면, 로그의 성질과 (1)에 의해
        $$1=\log_3a\times\dfrac{\log_3b}{\log_3m}\times\dfrac{\log_3c}{\log_3n}=\dfrac{1\times\dfrac32\times\dfrac52}{\log_3m\times\log_3n}$$
        이므로
        $$\log_3m\times\log_3n=\dfrac{15}{4}\qquad\cdots\cdots(2)$$
        가 된다. (2점)
      criteria: [1.B2]
    - id: 1b-3
      content: |
        (iii) 로그의 성질에 의해 $\log_3mn=\log_3m+\log_3n$이다. $m$과 $n$은 모두 $1$보다 크기 때문에 $\log_3m$과 $\log_3n$ 모두 양수임을 주목한다. (1점)
      criteria: [1.R1]
    - id: 1b-4
      content: |
        (iv) 이제, 양수인 $\log_3m$과 $\log_3n$에 대해 산술평균과 기하평균 사이의 관계를 이용하면 (2)에 의해
        $$\dfrac{\log_3m+\log_3n}{2}\ge\sqrt{\log_3m\times\log_3n}=\sqrt{\dfrac{15}{4}}\qquad\cdots\cdots(3)$$
        를 얻는다. 따라서 $\log_3mn=\log_3m+\log_3n$의 최솟값은 $2\sqrt{\dfrac{15}{4}}=\sqrt{15}$이다. (3점)
      criteria: [1.M1]
    - id: 1b-5
      content: |
        (v) 부등식 (3)의 등호가 성립할 조건은 $\log_3m=\log_3n$이다. 따라서 $\log_3mn$이 최솟값을 가질 때 $\log_3m$과 $\log_3n$의 값은 $\log_3m=\log_3n=\dfrac{\sqrt{15}}{2}$이다. (1점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $a=3$, $b=3^{\frac32}$, $c=3^{\frac52}$을 구했다(채점기준 도입, 다른 방식 허용 — 채점 유의사항 3).
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: 밑변환으로 $\log_3m\times\log_3n=\dfrac{15}4$를 얻었다(채점기준 전개).
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 1
      evidence: $m,n>1$이므로 $\log_3m$, $\log_3n$이 양수임을 확인했다(채점 유의사항 2 — 반드시 필요).
      steps: [1b-3]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 산술·기하평균 관계로 $\log_3mn$의 최솟값 $\sqrt{15}$를 구했다.
      depends_on: [1.R1]
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: 등호 조건에서 $\log_3m=\log_3n=\dfrac{\sqrt{15}}2$(채점기준 결론 = 1+3+1점).
      depends_on: [1.M1]
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 단순 계산 실수 등 사소한 실수(건당)
      effect: minus
      value: 1
