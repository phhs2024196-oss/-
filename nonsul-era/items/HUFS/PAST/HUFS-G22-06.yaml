stimuli: []

stem: |
  좌표평면 위의 세 점 $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$가 다음을 모두 만족한다.

  (가) 점 $\mathrm{A}$와 $\mathrm{B}$는 곡선 $y=\log_39x$ 위에 있다.

  (나) 점 $\mathrm{A}$의 $x$좌표는 점 $\mathrm{B}$의 $x$좌표보다 크다.

  (다) 점 $\mathrm{C}$는 곡선 $y=\log_3x$ 위에 있다.

  (라) 선분 $\mathrm{AC}$는 $y$축에 평행하다.

  (마) 삼각형 $\mathrm{ABC}$는 정삼각형이다.

  점 $\mathrm{C}$의 좌표를 $(\alpha,\beta)$라고 할 때, $\alpha\times3^{\beta}$의 값을 구하시오. (10점)

subparts:
- id: '1'
  stem: |
    $\alpha\times3^{\beta}$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '27/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{AC}}=2$로 일정, B는 AC 중점 높이에서 왼쪽 $\sqrt3$.
    steps:
    - {id: 1a, content: '$\log_3\alpha+1=\log_39(\alpha-\sqrt3)\Rightarrow3\alpha=9(\alpha-\sqrt3)\Rightarrow\alpha=\dfrac{3\sqrt3}2$, $\alpha\times3^\beta=\alpha^2=\dfrac{27}4$', criteria: [1.B1, 1.B2, 1.M1, 1.B3, 1.B4, 1.A1]}
    hint_ladder:
    - $\log_39x$와 $\log_3x$는 어떤 관계인가?
    - 한 변이 세로로 놓인 정삼각형의 나머지 꼭짓점 좌표는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 선행학습 영향평가 자체평가보고서 p.81~82
    steps:
    - id: 1b-1
      content: |
        (i) 점 $\mathrm{C}$의 좌표 $(\alpha,\beta)$는 (다)에 의해 $(\alpha,\beta)=(\alpha,\log_3\alpha)$이다. (1점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (ii) (라)와 (가)에 의해 점 $\mathrm{A}$의 좌표는 $(\alpha,\log_39\alpha)=(\alpha,2+\log_3\alpha)$이고, 점 $\mathrm{C}$의 좌표는 $(\alpha,\log_3\alpha)$이므로 선분 $\mathrm{AC}$의 길이는 $2$이다. (2점)
      criteria: [1.B2]
    - id: 1b-3
      content: |
        (iii) (나)에 의해 점 $\mathrm{B}$와 선분 $\mathrm{AC}$는 왼쪽 그림과 같고, (마)와 (ii)에 의해 삼각형 $\mathrm{ABC}$는 한 변의 길이가 $2$인 정삼각형이다. 점 $\mathrm{C}$의 좌표가 $(\alpha,\log_3\alpha)$이므로 점 $\mathrm{B}$의 좌표는 $(\alpha-\sqrt3,\log_3\alpha+1)$이다. (2점) [그림: 곡선 $y=\log_39x$ 위의 점 $\mathrm{A}$, $\mathrm{B}$와 곡선 $y=\log_3x$ 위의 점 $\mathrm{C}(\alpha,\beta)$, $\mathrm{A}$ 바로 아래 $\mathrm{C}$, $\mathrm{AC}$의 중점 $\mathrm{D}$와 같은 높이 왼쪽에 $\mathrm{B}$]
      criteria: [1.M1]
    - id: 1b-4
      content: |
        (iv) 한편 (가)와 점 $\mathrm{B}$의 좌표가 $(\alpha-\sqrt3,\log_3\alpha+1)$이라는 사실로부터
        $$\log_3\alpha+1=\log_39(\alpha-\sqrt3)$$
        이 성립한다. $\log_33\alpha=\log_39(\alpha-\sqrt3)$을 풀어서 $\alpha=\dfrac{3\sqrt3}{2}$을 얻는다. (3점)
      criteria: [1.B3]
    - id: 1b-5
      content: |
        (v) (i)에서 $\beta=\log_3\alpha$이고 $\alpha=\dfrac{3\sqrt3}{2}$이므로, $\beta=\log_3\dfrac{3\sqrt3}{2}$이다. (1점)
      criteria: [1.B4]
    - id: 1b-6
      content: |
        (vi) 따라서 $\alpha\times3^\beta=\dfrac{3\sqrt3}{2}\times3^{\log_3\frac{3\sqrt3}{2}}=\left(\dfrac{3\sqrt3}{2}\right)^2=\dfrac{27}{4}$이다. (1점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: (다)에서 $\mathrm{C}(\alpha,\log_3\alpha)$, 즉 $\beta=\log_3\alpha$를 적었다.
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: $\mathrm{A}(\alpha,2+\log_3\alpha)$에서 $\overline{\mathrm{AC}}=2$임을 확인했다(채점기준 도입 = 1+2점).
      steps: [1b-2]
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 정삼각형 조건과 (나)로 $\mathrm{B}(\alpha-\sqrt3,\log_3\alpha+1)$을 구했다.
      not_penalized:
      - 그래프를 작성하지 않음(채점 유의사항 3)
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 3
      evidence: $\log_3\alpha+1=\log_39(\alpha-\sqrt3)$을 세워 풀어 $\alpha=\dfrac{3\sqrt3}2$를 얻었다.
      steps: [1b-4]
    - id: 1.B4
      mark_type: B
      points: 1
      evidence: $\beta=\log_3\dfrac{3\sqrt3}2$를 적었다(채점기준 전개 = 2+3+1점).
      steps: [1b-5]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: $\alpha\times3^\beta=\dfrac{27}4$(채점기준 결론).
      depends_on: [1.M1]
      cao: true
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 단순 계산 실수 등 사소한 실수(건당)
      effect: minus
      value: 1
