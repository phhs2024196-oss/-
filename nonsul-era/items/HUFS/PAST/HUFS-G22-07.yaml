stimuli: []

stem: |
  곡선 $y=x^4+3x^3$ 위의 점 $\mathrm{P}(-1,-2)$에서의 접선은 점 $\mathrm{P}$가 아닌 두 점 $\mathrm{Q}$와 $\mathrm{R}$에서 이 곡선과 만난다. 두 점 $\mathrm{Q}$와 $\mathrm{R}$의 $x$좌표를 각각 $\alpha$와 $\beta$라고 할 때, $\alpha^2+\beta^2$의 값을 구하시오. (10점)

subparts:
- id: '1'
  stem: |
    $\alpha^2+\beta^2$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '7', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선과 곡선의 교점 방정식은 접점에서 중근을 갖는다.
    steps:
    - {id: 1a, content: '$y=5x+3$, $(x+1)^2(x^2+x-3)=0$, $\alpha^2+\beta^2=1+6=7$', criteria: [1.B1, 1.M1, 1.A1]}
    hint_ladder:
    - 점 P에서의 접선의 기울기는?
    - 교점 방정식이 $(x+1)^2$을 인수로 갖는 이유는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 선행학습 영향평가 자체평가보고서 p.83
    steps:
    - id: 1b-1
      content: |
        (i) 함수 $y=x^4+3x^3$의 도함수는 $y^\prime=4x^3+9x^2$이므로 점 $\mathrm{P}$에서의 접선의 기울기는 $5$이고 접선의 방정식은 $y+2=5(x+1)$, 즉 $y=5x+3$이다. (4점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (ii) 곡선과 점 $\mathrm{P}$에서의 접선의 교점을 조사하기 위해 방정식 $x^4+3x^3=5x+3$을 세운다.
        $$x^4+3x^3-(5x+3)=(x+1)^2(x^2+x-3)$$
        이고, 점 $\mathrm{P}$의 $x$좌표는 $-1$이므로 점 $\mathrm{Q}$와 $\mathrm{R}$의 $x$좌표인 $\alpha$와 $\beta$는 이차방정식 $x^2+x-3=0$의 두 근이다. (3점) [그림: 곡선 $y=x^4+3x^3$과 접선 $y=5x+3$, 점 $\mathrm{P}$에서 접하고 $x=\alpha$인 점 $\mathrm{Q}$(왼쪽 아래), $x=\beta$인 점 $\mathrm{R}$(오른쪽 위)에서 만남]
      criteria: [1.M1]
    - id: 1b-3
      content: |
        (iii) 근과 계수와의 관계로부터 $\alpha+\beta=-1$, $\alpha\beta=-3$이다. 따라서
        $$\alpha^2+\beta^2=(\alpha+\beta)^2-2\alpha\beta=1+6=7$$
        이다. (3점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: 접선의 방정식 $y=5x+3$을 구했다(채점기준 도입).
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $x^4+3x^3-(5x+3)=(x+1)^2(x^2+x-3)$으로 $\alpha$, $\beta$가 $x^2+x-3=0$의 두 근임을 보였다(채점기준 전개).
      not_penalized:
      - 그래프를 그리지 않음(채점 유의사항 3)
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $\alpha^2+\beta^2=7$(채점기준 결론, $\alpha$, $\beta$를 직접 구해도 인정 — 채점 유의사항 4).
      depends_on: [1.M1]
      cao: true
      steps: [1b-3]
