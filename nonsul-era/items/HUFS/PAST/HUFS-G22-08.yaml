stimuli: []

stem: |
  수열 $\{a_n\}$이 다음을 모두 만족한다.

  (가) $\displaystyle\sum_{k=1}^{n}a_k=pn^2+20n$ (단, $p$는 상수이다.)

  (나) $a_1+a_3+a_5+a_7=24$

  이 때, $a_2+a_4+a_6+a_8$의 값을 구하시오. (10점)

subparts:
- id: '1'
  stem: |
    $a_2+a_4+a_6+a_8$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S_n$이 상수항 없는 이차식 → 공차 $2p$인 등차수열.
    steps:
    - {id: 1a, content: '$a_n=p+20+2p(n-1)$, $28p+80=24\Rightarrow p=-2$, $24+4\times(-4)=8$', criteria: [1.M1, 1.B1, 1.B2, 1.R1, 1.B3, 1.A1]}
    hint_ladder:
    - $S_n-S_{n-1}$을 계산해 보자.
    - $a_2-a_1$, $a_4-a_3$, … 는 모두 무엇과 같은가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 선행학습 영향평가 자체평가보고서 p.84
    steps:
    - id: 1b-1
      content: |
        (i) 각각의 $n\ge1$에 대해 $S_n=\displaystyle\sum_{k=1}^na_k$라고 하자. 그러면 $n\ge2$일 때
        $$S_n-S_{n-1}=\sum_{k=1}^na_k-\sum_{k=1}^{n-1}a_k=a_n\qquad\cdots\cdots(1)$$
        이 된다. (1점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (ii) 한편 (가)에 의해
        $$S_n-S_{n-1}=pn^2+20n-\{p(n-1)^2+20(n-1)\}=2pn-p+20\quad(n\ge2)$$
        이므로 (1)에 의해
        $$a_n=2pn-p+20\quad(n\ge2)\qquad\cdots\cdots(2)$$
        이다. (2점)
      criteria: [1.B1]
    - id: 1b-3
      content: |
        (iii) (가)에서 주어진 식에 $n=1$을 대입하면
        $$a_1=p+20\qquad\cdots\cdots(3)$$
        이다. (1점)
      criteria: [1.B2]
    - id: 1b-4
      content: |
        (iv) (2)와 (3)으로부터
        $$a_n=a_1+2p(n-1)\quad(n\ge1)$$
        이 성립한다. 따라서 수열 $\{a_n\}$은 첫째항이 $a_1=p+20$이고 공차가 $2p$인 등차수열이다. (2점)
      criteria: [1.R1]
    - id: 1b-5
      content: |
        (v) 이제 (나)에 의해
        $$24=a_1+a_3+a_5+a_7=4a_1+12\times2p=4(p+20)+24p=28p+80$$
        이므로 $p=-2$임을 찾는다. (2점)
      criteria: [1.B3]
    - id: 1b-6
      content: |
        (vi) 등차수열 $\{a_n\}$의 공차는 $2p=-4$이므로 (나)를 활용하면
        $$a_2+a_4+a_6+a_8=(a_1+a_3+a_5+a_7)+4\times(-4)=24-16=8$$
        이다. (2점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: $n\ge2$일 때 $a_n=S_n-S_{n-1}$임을 적었다.
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: $a_n=2pn-p+20$ ($n\ge2$)을 구했다.
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 1
      evidence: $n=1$을 대입해 $a_1=p+20$을 구했다.
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: (2)(3)으로 $a_n=a_1+2p(n-1)$ ($n\ge1$), 첫째항 $p+20$, 공차 $2p$인 등차수열임을 밝혔다(채점기준 도입 = 1+2+1+2점).
      steps: [1b-4]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: (나)에서 $28p+80=24$, $p=-2$를 구했다(채점기준 전개).
      steps: [1b-5]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $a_2+a_4+a_6+a_8=8$(채점기준 결론).
      depends_on: [1.R1]
      cao: true
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 단순 계산 실수 등 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: $a_1$을 명시적으로 구하지 않고 등차수열이라고 기술함(채점 유의사항 4)
      effect: minus
      value: 1
