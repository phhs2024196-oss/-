      points: 2
      evidence: 높이 $\overline{\mathrm{BC}}=\dfrac{\lvert t^3-3t^2\rvert}{\sqrt{17}}$을 구했다.
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: 밑변 OA가 고정이므로 $\overline{\mathrm{BC}}$가 최대일 때 넓이가 최대임을 설명했다(채점기준 도입 = 1+2+2점).
      not_penalized:
      - 그림을 그리지 않음(채점 유의사항 2)
      steps: [1b-3]
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 절댓값을 정리한 $g(t)=-t^3+3t^2$를 미분해 증감을 따져 $(0,3)$에서 최댓값 $g(2)=4$, $\overline{\mathrm{BC}}$의 최댓값 $\dfrac4{\sqrt{17}}$을 구했다(채점기준 전개).
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: 넓이의 최댓값 $6$(채점기준 결론).
      depends_on: [1.M1]
      cao: true
      steps: [1b-5]
