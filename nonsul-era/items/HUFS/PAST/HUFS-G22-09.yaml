stimuli: []

stem: |
  함수 $f(x)=x^3-3x^2-4x$의 그래프 위의 세 점 $\mathrm{O}(0,0)$, $\mathrm{A}(3,-12)$, $\mathrm{B}(t,f(t))$를 꼭짓점으로 하는 삼각형 $\mathrm{OAB}$의 넓이의 최댓값을 구하시오. (단, $0<t<3$이다.) (12점)

subparts:
- id: '1'
  stem: |
    삼각형 $\mathrm{OAB}$의 넓이의 최댓값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 밑변 OA 고정 → 높이 $\dfrac{-t^3+3t^2}{\sqrt{17}}$ 최대.
    steps:
    - {id: 1a, content: '$g(t)=-t^3+3t^2$, $g^\prime(t)=-3t(t-2)$, 최댓값 $g(2)=4$, 넓이 $\dfrac12\times\sqrt{153}\times\dfrac4{\sqrt{17}}=6$', criteria: [1.B1, 1.B2, 1.R1, 1.M1, 1.A1]}
    hint_ladder:
    - 세 꼭짓점 중 움직이는 점은 하나뿐이다. 밑변을 무엇으로 잡을까?
    - 점 B에서 직선 OA까지의 거리를 $t$로 나타내 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 선행학습 영향평가 자체평가보고서 p.85
    steps:
    - id: 1b-1
      content: |
        (i) 점 $\mathrm{O}$와 $\mathrm{A}$를 지나는 직선 $\ell$의 식은 $y=-4x$, 즉 $4x+y=0$이다. (1점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (ii) 점 $\mathrm{B}(t,t^3-3t^2-4t)$에서 직선 $\ell$에 내린 수선의 발을 $\mathrm{C}$라고 하면 선분 $\mathrm{BC}$의 길이는 점과 직선 사이의 거리 공식에 의해
        $$\dfrac{\lvert4t+(t^3-3t^2-4t)\rvert}{\sqrt{16+1}}=\dfrac{\lvert t^3-3t^2\rvert}{\sqrt{17}}$$
        이다. (2점) [그림: $y=x^3-3x^2-4x$의 그래프와 직선 $4x+y=0$, 점 $\mathrm{O}$, $\mathrm{A}(3,-12)$, 곡선 위의 점 $\mathrm{B}(t,f(t))$, $\mathrm{B}$에서 직선 $\mathrm{OA}$에 내린 수선의 발 $\mathrm{C}$, 삼각형 $\mathrm{OAB}$ 색칠]
      criteria: [1.B2]
    - id: 1b-3
      content: |
        (iii) 삼각형 $\mathrm{OAB}$의 밑변의 길이를 선분 $\mathrm{OA}$의 길이로, 높이를 선분 $\mathrm{BC}$의 길이로 생각하자. 그러면 선분 $\mathrm{BC}$의 길이가 최대일 때 삼각형 $\mathrm{OAB}$의 넓이가 최대가 된다. (2점)
      criteria: [1.R1]
    - id: 1b-4
      content: |
        (iv) $t^3-3t^2=t^2(t-3)$이므로 $0<t<3$일 때 $\lvert t^3-3t^2\rvert=-t^3+3t^2$이다. 실수전체의 집합에서 정의된 $t$에 대한 함수 $g(t)=-t^3+3t^2$을 미분하면
        $$g^\prime(t)=-3t^2+6t=-3t(t-2)$$
        이고, $g^\prime(t)=0$이 되는 $t$는 $0$과 $2$이다. $g^\prime(t)=-3t(t-2)$의 부호를 따져 그래프의 개형을 생각해볼 때 $g(t)$는 $t=0$에서 극솟값 $g(0)=0$을 갖고, $t=2$에서 극댓값 $g(2)=4$를 갖는다. 열린구간 $(0,3)$에서 함수 $g(t)$의 최댓값은 $g(2)=4$이다. 따라서 (ii)에 의해 선분 $\mathrm{BC}$의 길이의 최댓값은 $\dfrac{4}{\sqrt{17}}$이다. (5점)
      criteria: [1.M1]
    - id: 1b-5
      content: |
        (v) 삼각형 $\mathrm{OAB}$의 넓이는 $\dfrac12\times\overline{\mathrm{OA}}\times\overline{\mathrm{BC}}=\dfrac12\times\sqrt{153}\times\overline{\mathrm{BC}}$이므로, 최댓값은 $\dfrac12\times\sqrt{153}\times\dfrac{4}{\sqrt{17}}=6$이다. (2점)
      criteria: [1.A1]
