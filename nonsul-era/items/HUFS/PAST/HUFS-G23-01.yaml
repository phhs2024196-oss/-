stimuli: []

stem: |
  모든 실수 $x$에 대하여 이차부등식
  $$x^2-(4\cos\theta)x+1\ge0$$
  이 성립하도록 하는 $\theta$의 값의 범위가 $\alpha\le\theta\le\beta$일 때, $\alpha+\beta$의 값을 구하시오. (단, $0\le\theta\le\pi$) (9점)

subparts:
- id: '1'
  stem: |
    $\alpha+\beta$의 값을 구하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: 'pi', equivalents: ['\pi'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 판별식 $D\le0$에서 $\lvert\cos\theta\rvert\le\frac12$, 즉 $\frac{\pi}{3}\le\theta\le\frac{2\pi}{3}$.
    steps:
    - {id: 1a, content: '$D=16\cos^2\theta-4\le0\Rightarrow-\frac12\le\cos\theta\le\frac12\Rightarrow\alpha+\beta=\frac{\pi}{3}+\frac{2\pi}{3}=\pi$', criteria: [1.M1, 1.B1, 1.A1]}
    hint_ladder:
    - 이차함수 $y=x^2-(4\cos\theta)x+1$의 그래프가 $x$축 아래로 내려가지 않을 조건은?
    - $\cos\theta$의 범위를 $0\le\theta\le\pi$에서 그래프로 읽어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 문항카드 p.71~72(문항 해설·채점 기준)
    steps:
    - id: 1b-1
      content: |
        모든 실수 $x$에 대해 부등식 $x^2-(4\cos\theta)x+1\ge0$이 성립하려면 이차방정식 $x^2-(4\cos\theta)x+1=0$의 판별식 $D$가 $D\le0$를 만족해야 한다. (3점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        즉, $D=16\cos^2\theta-4\le0$이어야 하고, 이로부터
        $$-\frac12\le\cos\theta\le\frac12\quad\cdots\cdots(1)$$
        를 얻는다. (3점)
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $0\le\theta\le\pi$에서 함수 $y=\cos\theta$의 그래프를 고려해 볼 때, 부등식 (1)이 성립하는 $\theta$의 범위는 $\dfrac{\pi}{3}\le\theta\le\dfrac{2\pi}{3}$이다. 따라서 $\alpha=\dfrac{\pi}{3}$, $\beta=\dfrac{2\pi}{3}$이고, $\alpha+\beta=\pi$이다. (3점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: (도입) 이차부등식이 모든 실수 $x$에서 성립할 조건이 판별식 $D\le0$임을 적었다.
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: (전개) $D=16\cos^2\theta-4\le0$으로부터 $-\frac12\le\cos\theta\le\frac12$를 얻었다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: (결론) $\frac{\pi}{3}\le\theta\le\frac{2\pi}{3}$임을 언급하고 $\alpha+\beta=\pi$라는 결론을 냈다.
      depends_on: [1.M1]
      not_penalized:
      - 함수 $y=\cos\theta$의 그래프를 그리지 않음
      steps: [1b-3]
