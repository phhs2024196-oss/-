stimuli: []

stem: |
  다항함수 $f(x)$가 다음 조건을 모두 만족시킬 때, $f^{\prime}(2)$의 값을 구하시오. (9점)

  (가) $\displaystyle\lim_{x\to\infty}\frac{f(x)}{2x^3+5x+1}=1$

  (나) $\displaystyle\lim_{x\to0}\frac{f^{\prime}(x)}{x}=2$

subparts:
- id: '1'
  stem: |
    $f^{\prime}(2)$의 값을 구하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: '28', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (가)로 $f(x)=2x^3+ax^2+bx+c$, (나)로 $b=0$, $a=1$이므로 $f^{\prime}(x)=6x^2+2x$.
    steps:
    - {id: 1a, content: '$f^{\prime}(x)=6x^2+2ax+b$, $b=f^{\prime}(0)=0$, $2a=2$, $f^{\prime}(2)=24+4=28$', criteria: [1.M1, 1.M2, 1.B1, 1.A1]}
    hint_ladder:
    - (가)의 극한이 1이 되려면 $f(x)$의 차수와 최고차항의 계수는?
    - (나)에서 분모가 0으로 갈 때 극한값이 존재하려면 분자는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 문항카드 p.72~73(문항 해설·채점 기준)
    steps:
    - id: 1b-1
      content: |
        조건 (가)에 의해
        $$f(x)=2x^3+ax^2+bx+c\ (\text{단, }a,b,c\text{는 상수})\quad\cdots\cdots(1)$$
        이다. (2점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        조건 (나)에서 $\displaystyle\lim_{x\to0}\frac{f^{\prime}(x)}{x}$의 값이 존재하고 $\displaystyle\lim_{x\to0}x=0$이므로, $\displaystyle\lim_{x\to0}f^{\prime}(x)=0$이어야 한다. 따라서 $f^{\prime}(0)=0$이고, (1)에서 $f^{\prime}(x)=6x^2+2ax+b$이므로 $b=0$이다. (3점)
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $f^{\prime}(x)=6x^2+2ax$를 조건 (나)에 대입하면
        $$2=\lim_{x\to0}\frac{f^{\prime}(x)}{x}=\lim_{x\to0}(6x+2a)=2a$$
        이고, $a=1$을 얻는다. (3점)
      criteria: [1.B1]
    - id: 1b-4
      content: |
        $f^{\prime}(x)=6x^2+2x$이므로 $f^{\prime}(2)=28$이다. (1점)
      criteria: [1.A1]
