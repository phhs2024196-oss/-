stimuli: []

stem: |
  좌표평면 위의 점 $\mathrm{P}(0,3)$과 곡선 $y=\dfrac{x^2}{4}\ (-1\le x\le3)$ 위의 점 $\mathrm{Q}$에 대해 $\overline{\mathrm{PQ}}$의 최댓값을 $a$, 최솟값을 $b$라고 하자. 이 때, $a^2\times b^2$의 값을 구하시오. (9점)

subparts:
- id: '1'
  stem: |
    $a^2\times b^2$의 값을 구하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: '153/2', equivalents: ['76.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{PQ}}^2$를 사차함수로 두고 $[-1,3]$에서 끝점·임계점 $0,2$를 비교한다.
    steps:
    - {id: 1a, content: '$f(-1)=\frac{137}{16}$, $f(0)=9$, $f(2)=8$, $f(3)=\frac{153}{16}$이므로 $a^2b^2=\frac{153}{16}\cdot8=\frac{153}{2}$', criteria: [1.M1, 1.M2, 1.B1, 1.A1]}
    hint_ladder:
    - 거리 대신 거리의 제곱을 함수로 두자.
    - 닫힌구간에서는 끝점의 함숫값도 후보이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 문항카드 p.73~74(문항 해설·채점 기준)
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P}(0,3)$과 곡선 위의 점 $\mathrm{Q}\left(x,\dfrac{x^2}{4}\right)$ (단, $-1\le x\le3$)에 대해 $f(x)=\overline{\mathrm{PQ}}^2$이라고 하면
        $$f(x)=(x-0)^2+\left(\frac{x^2}{4}-3\right)^2=\frac{x^4}{16}-\frac{x^2}{2}+9$$
        이다. (1점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $f(x)$를 $x$에 대해 미분하면 $f^{\prime}(x)=\dfrac{x^3}{4}-x=\dfrac{x}{4}(x-2)(x+2)$이고, $-1<x<3$에서 $f^{\prime}(x)=0$인 $x$는 $0$, $2$이다. (3점)
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 $-1\le x\le3$의 범위에서 $f(x)$의 최댓값과 최솟값은 다음 값들 중에서 찾으면 된다.
        $$f(-1)=\frac{137}{16},\ f(0)=9,\ f(2)=8,\ f(3)=\frac{153}{16}$$
        즉, $f(x)$의 최댓값은 $\dfrac{153}{16}$이고, 최솟값은 $8$이다. (3점)
      criteria: [1.B1]
    - id: 1b-4
      content: |
        $\overline{\mathrm{PQ}}=\sqrt{f(x)}$이므로 $\overline{\mathrm{PQ}}$의 최댓값 $a$와 최솟값 $b$는 $a^2=\dfrac{153}{16}$, $b^2=8$를 만족한다. 결국
        $$a^2\times b^2=\frac{153}{16}\times8=\frac{153}{2}$$
        이다. (2점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: (도입) 점 $\mathrm{Q}\left(x,\frac{x^2}{4}\right)$에 대해 $f(x)=\overline{\mathrm{PQ}}^2=\frac{x^4}{16}-\frac{x^2}{2}+9$의 식을 썼다.
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: (도입) $f^{\prime}(x)=\frac{x}{4}(x-2)(x+2)$를 구하고 $-1<x<3$에서 $f^{\prime}(x)=0$인 $x=0,2$를 찾았다.
      steps: [1b-2]
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: (전개) 임계점과 끝점의 함숫값 $f(-1),f(0),f(2),f(3)$을 계산해 최댓값 $\frac{153}{16}$, 최솟값 $8$을 찾았다.
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: (결론) $a^2\times b^2=\frac{153}{2}$을 계산했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-4]
    deductions:
