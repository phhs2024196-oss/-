stimuli: []

stem: |
  다항함수 $f(x)$가 다음 조건을 모두 만족시킬 때, $f(2)$의 값을 구하시오. (9점)

  (가) $f(x)$는 최고차항의 계수가 $1$인 삼차함수이다.

  (나) $f(0)=8$

  (다) 모든 실수 $x$에서 연속인 어떤 함수 $g(x)$에 대하여 $f(x)=3+\displaystyle\int_1^x(x-2+t)g(t)\,dt$이다.

subparts:
- id: '1'
  stem: |
    $f(2)$의 값을 구하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: '10', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (다)에서 $f(1)=3$, 미분하여 $f^{\prime}(1)=0$을 얻고 $f(x)=x^3+ax^2+bx+8$에 넣는다.
    steps:
    - {id: 1a, content: '$1+a+b+8=3$, $3+2a+b=0\Rightarrow a=3,\ b=-9$, $f(2)=8+12-18+8=10$', criteria: [1.M1, 1.B1, 1.M2, 1.A1]}
    hint_ladder:
    - 적분 구간이 $[1,1]$이 되도록 $x$에 무엇을 넣을까?
    - 적분 기호 안의 $x$를 밖으로 꺼내고 미분해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 문항카드 p.74~75(문항 해설·채점 기준)
    steps:
    - id: 1b-1
      content: |
        조건 (가)에 의해 $f(x)=x^3+ax^2+bx+c$ (단, $a,b,c$는 상수)이고, 조건 (나)에 의해 $8=f(0)=c$이다. 따라서
        $$f(x)=x^3+ax^2+bx+8\quad\cdots\cdots(1)$$
        이다. (1점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        조건 (다)의 식에 $x=1$을 대입하면 $f(1)=3$이 되고, (1)로부터
        $$1+a+b+8=3\quad\cdots\cdots(2)$$
        을 얻는다. (2점)
      criteria: [1.B1]
    - id: 1b-3
      content: |
        조건 (다)의 식을 $f(x)=3+(x-2)\displaystyle\int_1^xg(t)dt+\int_1^xtg(t)dt$으로 정리하고, 양변을 $x$에 대해 미분하면
        $$f^{\prime}(x)=\int_1^xg(t)dt+(x-2)g(x)+xg(x)=\int_1^xg(t)dt+2(x-1)g(x)$$
        가 된다. 여기에 $x=1$을 대입하면 $f^{\prime}(1)=0$이 되고, (1)로부터 $f^{\prime}(x)=3x^2+2ax+b$이므로
        $$3+2a+b=0\quad\cdots\cdots(3)$$
        을 얻는다. (4점)
      criteria: [1.M2]
    - id: 1b-4
      content: |
        (2)와 (3)을 연립하면 $a=3$, $b=-9$를 찾고, $f(x)=x^3+3x^2-9x+8$이 된다. 따라서 $f(2)=10$이다. (2점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: (도입) 조건 (가)와 (나)로부터 $f(x)=x^3+ax^2+bx+8$을 얻었다.
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: (전개) 조건 (다)의 식으로부터 $f(1)=3$을 얻고, $1+a+b+8=3$을 찾았다.
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: (전개) 조건 (다)의 식을 미분해서 $f^{\prime}(1)=0$을 얻고, $3+2a+b=0$을 찾았다.
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: (결론) 두 식을 연립하여 $a=3$, $b=-9$를 구하고 $f(2)=10$을 계산했다.
      depends_on: [1.B1, 1.M2]
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
