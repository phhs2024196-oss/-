stimuli: []

stem: |
  다음 조건을 만족시키는 모든 자연수 $n$의 값의 합을 구하시오. (10점)

  어떤 실수 $r$에 대해 $4^r-2^{r+\frac{10}{n}}=-1$이고, $4^r+4^{-r}$은 자연수이다.

subparts:
- id: '1'
  stem: |
    조건을 만족시키는 모든 자연수 $n$의 값의 합을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '22', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$4^r+4^{-r}=2^{\frac{20}{n}}-2$가 자연수 ⟺ $n\in\{1,2,4,5,10\}$, 역으로 $X^2-2^{\frac{10}{n}}X+1=0$이 양의 실근을 가진다.'
    steps:
    - {id: 1a, content: '$2^r+2^{-r}=2^{\frac{10}{n}}\Rightarrow4^r+4^{-r}=2^{\frac{20}{n}}-2$, $n\mid20$, $n\ne20$, 합 $1+2+4+5+10=22$', criteria: [1.M1, 1.B1, 1.R1, 1.A1]}
    hint_ladder:
    - 첫 식의 양변에 $2^{-r}$을 곱해 보자.
    - $2^{\frac{20}{n}}-2$가 자연수가 되려면 $\frac{20}{n}$은 어떤 수여야 하나?
    - 찾은 $n$마다 실수 $r$가 정말 존재하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 문항카드 p.75~76(문항 해설·채점 기준)
    steps:
    - id: 1b-1
      content: |
        자연수 $n$이 문제의 조건을 만족시킨다고 하자. 식 $4^r-2^{r+\frac{10}{n}}=-1$의 양변에 $2^{-r}$을 곱해서
        $$2^r+2^{-r}=2^{\frac{10}{n}}$$
        을 얻는다. 또한, 양변을 제곱해서
        $$4^r+4^{-r}=2^{\frac{20}{n}}-2\quad\cdots\cdots(1)$$
        를 얻는다. (4점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        문제의 조건에서 $4^r+4^{-r}$은 자연수이므로 (1)에 의해 $2^{\frac{20}{n}}-2$는 자연수이다. 숫자 $2$는 어떤 자연수의 거듭제곱수가 아니므로 $2^{\frac{20}{n}}-2$이 자연수라는 것은 $n$이 $20$의 약수이고 $2^{\frac{20}{n}}>2$라는 것이다. 가능한 $n$은 $1,2,4,5,10$이다. (4점)
      criteria: [1.B1]
    - id: 1b-3
      content: |
        자연수 $n$이 $1,2,4,5$ 또는 $10$일 때, $2^{\frac{10}{n}}\ge2^{\frac{10}{10}}=2$이다. 식 $4^r-2^{r+\frac{10}{n}}=-1$에 $X=2^r$를 대입하여 방정식
        $$X^2-2^{\frac{10}{n}}X+1=0$$
        를 얻는다. 여기에서 $2^{\frac{10}{n}}\ge2$이므로 판별식 $D$가 $D\ge0$을 만족하여 방정식은 실근 $X$를 가지고, 근과 계수의 관계에 의해 $X>0$이다. 지수함수 $f(x)=2^x$의 치역이 양의 실수 전체집합이므로 $X=2^r$를 만족하는 실수 $r$이 존재하고 $4^r-2^{r+\frac{10}{n}}=-1$를 만족한다. (1점)
      criteria: [1.R1]
    - id: 1b-4
      content: |
        결국 문제의 조건을 만족시키는 자연수 $n$은 정확히 $1,2,4,5,10$이고, 이 값들을 더하면 $22$이다. (1점)
      criteria: [1.A1]
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    source_flow: 2024 논술가이드북 p.55 예시 답안 (iii)(역 확인 부분만 다름)
    steps:
    - id: 1c-1
      content: |
        역으로, 자연수 $n$이 $1,2,4,5$ 또는 $10$이라 하자. 그러면 $2^{\frac{10}{n}}\ge2^{\frac{10}{10}}=2$이다. 함수 $f(x)=2^x+2^{-x}$은 $f(0)=2$를 만족하고, $x$의 값이 한없이 커질 때 함숫값 $f(x)$도 한없이 커지므로 $f(r)=2^{\frac{10}{n}}$이 되는 $0$ 이상의 실수 $r$이 존재한다. 즉, $2^r+2^{-r}=2^{\frac{10}{n}}$이고, 이로부터 $4^r-2^{r+\frac{10}{n}}=-1$, $4^r+4^{-r}=2^{\frac{20}{n}}-2$가 성립한다. 게다가 $2^{\frac{20}{n}}-2$는 자연수이다. 따라서 $n$은 문제의 조건을 만족시킨다. (1점)
      criteria: [1.R1]
