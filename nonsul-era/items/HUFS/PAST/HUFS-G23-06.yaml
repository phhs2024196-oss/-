stimuli: []

stem: |
  두 양수 $a$와 $b$가 다음 조건을 모두 만족시킨다.

  (가) $\log a=m+\alpha$ (단, $m$은 정수, $0\le\alpha<1$)

  (나) $\log b=n+\beta$ (단, $n$은 정수, $0\le\beta<1$)

  (다) 점 $\mathrm{P}(m,n)$과 점 $\mathrm{Q}(\alpha,\beta)$는 모두 제1사분면의 점이다.

  (라) 점 $\mathrm{P}$는 곡선 $y=\dfrac{18}{x}$ 위에 있다.

  (마) 점 $\mathrm{Q}$는 직선 $y=-x+1$ 위에 있다.

  $a\times b$의 최댓값과 최솟값의 곱이 $10^k$일 때, $k$의 값을 구하시오. (10점)

subparts:
- id: '1'
  stem: |
    $k$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '30', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $ab=10^{m+n+1}$, $mn=18$에서 $m+n$의 최댓값 $19$, 최솟값 $9$.
    steps:
    - {id: 1a, content: '$ab=10^{(m+n)+1}$, $\max=10^{20}$, $\min=10^{10}$, $k=30$', criteria: [1.R1, 1.B1, 1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 제1사분면의 점이라는 조건에서 $m,n,\alpha,\beta$의 범위는?
    - $\log ab$를 $m,n,\alpha,\beta$로 나타내 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 문항카드 p.76~77(문항 해설·채점 기준)
    steps:
    - id: 1b-1
      content: |
        조건 (가), (나), (다)에서 $m$과 $n$은 자연수이고, $0<\alpha<1$, $0<\beta<1$이다. (1점)
      criteria: [1.R1]
    - id: 1b-2
      content: |
        조건 (라)로부터 $n=\dfrac{18}{m}$, 즉 $mn=18$을 얻는다. 가능한 자연수 순서쌍 $(m,n)$은
        $$(m,n)=(1,18),\ (2,9),\ (3,6),\ (6,3),\ (9,2)\ \text{또는}\ (18,1)\quad\cdots\cdots(1)$$
        이다. (2점)
      criteria: [1.B1]
    - id: 1b-3
      content: |
        조건 (마)로부터 $\beta=-\alpha+1$, 즉
        $$\alpha+\beta=1\quad\cdots\cdots(2)$$
        을 얻는다. (1점)
      criteria: [1.M1]
    - id: 1b-4
      content: |
        다음을 유도한다.
        $$\begin{aligned}ab&=10^{\log ab}=10^{\log a+\log b}\\&=10^{(m+\alpha)+(n+\beta)}\quad((\text{가}),(\text{나})\text{에 의해})\\&=10^{(m+n)+1}\quad((2)\text{에 의해})\end{aligned}$$
        (3점)
      criteria: [1.M2]
    - id: 1b-5
      content: |
        따라서 (1)에 의해 $ab$의 최댓값은 $(m,n)=(1,18)$ 또는 $(18,1)$일 때 $10^{20}$이고, $ab$의 최솟값은 $(m,n)=(3,6)$ 또는 $(6,3)$일 때 $10^{10}$이다. 두 값의 곱인 $10^k$은 $10^{30}$이고, 결국 $k=30$이다. (3점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 1
      evidence: (도입) 조건 (다)에서 $m,n$은 자연수이고 $0<\alpha<1$, $0<\beta<1$임을 밝혔다.
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: (도입) 조건 (라)에서 $mn=18$인 자연수 순서쌍 $(m,n)$ 6개를 찾았다.
      steps: [1b-2]
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: (도입) 조건 (마)로부터 $\alpha+\beta=1$을 얻었다.
      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: (전개) $ab=10^{m+n+1}$임을 유도했다.
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: (결론) $ab$의 최댓값은 $10^{20}$, 최솟값은 $10^{10}$임을 밝히고 $k=30$을 얻었다.
      depends_on: [1.B1, 1.M2]
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
