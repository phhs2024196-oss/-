stimuli: []

stem: |
  두 함수
  $$f(x)=-4x(x+3)(x-3),\qquad g(x)=-16\lvert x\rvert+48$$
  의 그래프로 둘러싸인 도형의 넓이를 구하시오. (10점)

subparts:
- id: '1'
  stem: |
    두 그래프로 둘러싸인 도형의 넓이를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '208', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 교점 $x=-3,1,3$, 꺾인 점 $x=0$으로 나누어 위아래를 정해 적분한다.
    steps:
    - {id: 1a, content: '$\int_{-3}^0(g-f)dx+\int_0^1(g-f)dx+\int_1^3(f-g)dx=153+23+32=208$', criteria: [1.B1, 1.M1, 1.A1]}
    hint_ladder:
    - $x\ge0$에서 $f(x)=g(x)$를 풀어 보자.
    - $\lvert x\rvert$가 있으므로 $x=0$에서도 구간을 나눈다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 문항카드 p.78(문항 해설·채점 기준)
    steps:
    - id: 1b-1
      content: |
        두 함수 $f(x)$와 $g(x)$의 그래프는 아래 그림과 같다. 제1사분면에 존재하는 교점 $\mathrm{P}$의 $x$좌표는 양수이다. 식 $f(x)=g(x)$를 세우면
        $$-4x(x+3)(x-3)=-16x+48$$
        즉 $(x-3)(x+4)(x-1)=0$이다. 따라서 점 $\mathrm{P}$의 $x$좌표는 $1$이다. (3점)

        [그림] 문항카드 해설의 그래프: $y=f(x)$(검은 곡선)는 $x=-3,0,3$에서 $x$축과 만나고 $x<0$ 쪽에서 아래로 볼록하게 내려갔다가 $x>0$ 쪽에서 위로 솟는다. $y=g(x)$(붉은 꺾은선)는 $(-3,0)$, $(0,48)$, $(3,0)$을 잇는 산 모양이며, 두 그래프는 $x=-3$, 제1사분면의 점 $\mathrm{P}$($x=1$), $x=3$에서 만나고 그 사이 영역이 색칠되어 있다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        두 함수 $f(x)$와 $g(x)$의 그래프로 둘러싸인 도형의 넓이는 다음과 같다.
        $$\begin{aligned}&\int_{-3}^{0}\{g(x)-f(x)\}dx+\int_{0}^{1}\{g(x)-f(x)\}dx+\int_{1}^{3}\{f(x)-g(x)\}dx\\&=\int_{-3}^{0}\{(16x+48)-(-4x^3+36x)\}dx+\int_{0}^{1}\{(-16x+48)-(-4x^3+36x)\}dx+\int_{1}^{3}\{(-4x^3+36x)-(-16x+48)\}dx\\&=\int_{-3}^{0}(4x^3-20x+48)dx+\int_{0}^{1}(4x^3-52x+48)dx+\int_{1}^{3}(-4x^3+52x-48)dx\\&=\Big[x^4-10x^2+48x\Big]_{-3}^{0}+\Big[x^4-26x^2+48x\Big]_{0}^{1}+\Big[-x^4+26x^2-48x\Big]_{1}^{3}\\&=153+23+32\\&=208\end{aligned}$$
        (7점)
      criteria: [1.M1, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: (도입) 두 함수의 그래프의 제1사분면에서의 교점의 $x$좌표 $1$을 찾았다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: (전개) 두 함수의 크기관계를 고려하여 적분구간을 $[-3,0]$, $[0,1]$, $[1,3]$으로 나눠 정적분 식을 세웠다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: (결론) 정적분을 계산해 넓이 $153+23+32=208$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
