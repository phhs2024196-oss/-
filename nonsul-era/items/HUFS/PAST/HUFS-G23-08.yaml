stimuli: []

stem: |
  모든 실수 $x$에서 연속인 함수 $f(x)$가 다음 조건을 모두 만족시킨다.

  (가) $\displaystyle\int_0^1f(x)\,dx<0$

  (나) $\displaystyle\int_{2020}^{2024}f(x)\,dx=130$

  (다) $\displaystyle\int_{2022}^{2024}f(x)\,dx=90$

  (라) 수열 $\{a_n\}$이 $a_n=\displaystyle\int_0^nf(x)\,dx\ (n=1,2,3,\ldots)$으로 정의될 때, $\{a_n\}$은 등비수열이다.

  이 때, 등비수열 $\{a_n\}$의 공비의 값을 구하시오. (10점)

subparts:
- id: '1'
  stem: |
    등비수열 $\{a_n\}$의 공비의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-3/2', equivalents: ['-1.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 적분값을 $a_1r^{2019}(r^4-1)$, $a_1r^{2021}(r^2-1)$로 쓰고 나누면 $r^2=\frac94$, $a_1<0$에서 $r=-\frac32$.
    steps:
    - {id: 1a, content: '$\dfrac{130}{90}=\dfrac{r^2+1}{r^2}\Rightarrow r^2=\dfrac94$; $r=\frac32$이면 $a_1>0$이 되어 (가)에 모순, $r=-\frac32$', criteria: [1.M1, 1.B1, 1.R1]}
    hint_ladder:
    - $\int_{2020}^{2024}f(x)dx$를 $a_n$으로 나타내 보자.
    - 두 식을 나누면 $a_1$이 사라진다.
    - (가)는 $a_1$의 부호를 알려 준다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 문항카드 p.79~80(문항 해설·채점 기준)
    steps:
    - id: 1b-1
      content: |
        등비수열 $\{a_n\}$의 공비를 $r$이라고 하면
        $$a_1=\int_0^1f(x)dx,\qquad a_n=\int_0^nf(x)dx=a_1r^{n-1}\ (n=1,2,3,\ldots)$$
        이다. 그러면 조건 (나)와 (다), 정적분의 성질로부터
        $$130=\int_{2020}^{2024}f(x)dx=\int_0^{2024}f(x)dx-\int_0^{2020}f(x)dx=a_{2024}-a_{2020}=a_1r^{2023}-a_1r^{2019}=a_1r^{2019}(r^4-1),\quad\cdots\cdots(1)$$
        $$90=\int_{2022}^{2024}f(x)dx=\int_0^{2024}f(x)dx-\int_0^{2022}f(x)dx=a_{2024}-a_{2022}=a_1r^{2023}-a_1r^{2021}=a_1r^{2021}(r^2-1)\quad\cdots\cdots(2)$$
        을 얻는다. (5점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (1)과 (2)로부터 다음을 유도한다.
        $$\frac{130}{90}=\frac{a_1r^{2019}(r^4-1)}{a_1r^{2021}(r^2-1)}=\frac{r^2+1}{r^2}$$
        따라서 $r^2=\dfrac94$이고, $r=\dfrac32$ 또는 $-\dfrac32$이다. (3점)
      criteria: [1.B1]
    - id: 1b-3
      content: |
        조건 (가)에 의해 $a_1<0$이므로 (1) 혹은 (2)로부터 $r=-\dfrac32$이어야 함을 알 수 있다. (2점)
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: (도입) 공비를 $r$이라 하고 조건들과 정적분의 성질로 $130=a_1r^{2019}(r^4-1)$과 $90=a_1r^{2021}(r^2-1)$을 유도했다.
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: (전개) 두 식으로부터 $r^2=\frac94$를 찾았다.
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: (결론) 조건 (가)에서 $a_1<0$임을 근거로 $r=-\frac32$임을 결론냈다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
