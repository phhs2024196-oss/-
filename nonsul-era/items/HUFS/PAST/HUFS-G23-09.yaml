stimuli: []

stem: |
  두 실수 $a$와 $b$에 대하여 실수 $a\odot b$를 다음과 같이 정의하자.
  $$a\odot b=\begin{cases}a-b&(a\ge b)\\0&(a<b)\end{cases}$$
  이 때, 방정식
  $$(\sin\theta\odot\cos\theta)+(\cos\theta\odot(1-\cos\theta))=\sin\theta$$
  를 만족시키는 $\theta$의 값을 모두 구하시오. (단, $\dfrac{\pi}{4}\le\theta\le\dfrac{\pi}{2}$) (12점)

subparts:
- id: '1'
  stem: |
    방정식을 만족시키는 $\theta$의 값을 모두 구하시오.
  points: 12
  depends_on: []
  answer: {kind: set, value: 'pi/2', equivalents: ['{pi/2}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 첫 항은 항상 $\sin\theta-\cos\theta$, 둘째 항은 $\theta\le\frac{\pi}{3}$에서 $2\cos\theta-1$, 그 밖에서 $0$.
    steps:
    - {id: 1a, content: '$\theta\le\frac{\pi}{3}$: $\cos\theta=1$ 해 없음; $\theta>\frac{\pi}{3}$: $\cos\theta=0$, $\theta=\frac{\pi}{2}$', criteria: [1.M1, 1.B1, 1.B2]}
    hint_ladder:
    - $\frac{\pi}{4}\le\theta\le\frac{\pi}{2}$에서 $\sin\theta$와 $\cos\theta$ 중 어느 쪽이 큰가?
    - $\cos\theta$와 $1-\cos\theta$의 대소가 바뀌는 $\theta$는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 문항카드 p.80~81(문항 해설·채점 기준)
    steps:
    - id: 1b-1
      content: |
        $\dfrac{\pi}{4}\le\theta\le\dfrac{\pi}{2}$에서 $\sin\theta\ge\cos\theta$이므로
        $$\sin\theta\odot\cos\theta=\sin\theta-\cos\theta$$
        이다. (2점)

        [그림] 문항카드 해설의 그래프 1: $0\le\theta\le\frac{\pi}{2}$에서 $y=\sin\theta$(붉은 선)와 $y=\cos\theta$(검은 선), 두 그래프가 $\theta=\frac{\pi}{4}$에서 $\frac{\sqrt2}{2}$로 만나고 $\frac{\pi}{4}$ 이후 $\sin\theta$가 위에 있다. 축에 $\frac{\pi}{4},\frac{\pi}{3},\frac{\pi}{2}$, $\frac12,\frac{\sqrt2}{2},1$ 표시.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\dfrac{\pi}{4}\le\theta\le\dfrac{\pi}{2}$에서 두 함수 $y=\cos\theta$와 $y=1-\cos\theta$의 그래프는 아래와 같다.

        [그림] 문항카드 해설의 그래프 2: $y=\cos\theta$(검은 선)와 $y=1-\cos\theta$(붉은 선)가 $\theta=\frac{\pi}{3}$에서 높이 $\frac12$로 만나고, $\frac{\pi}{3}$ 이전에는 $\cos\theta$가, 이후에는 $1-\cos\theta$가 위에 있다.

        $\dfrac{\pi}{4}\le\theta\le\dfrac{\pi}{3}$일 때는 $\cos\theta\ge1-\cos\theta$이므로, 문제의 방정식 $(\sin\theta\odot\cos\theta)+\{\cos\theta\odot(1-\cos\theta)\}=\sin\theta$는
        $$(\sin\theta-\cos\theta)+(\cos\theta-(1-\cos\theta))=\sin\theta,$$
        즉 $\cos\theta=1$이 된다. 하지만 $\dfrac{\pi}{4}\le\theta\le\dfrac{\pi}{3}$에서 $\cos\theta=1$을 만족하는 $\theta$는 존재하지 않는다. (5점)
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $\dfrac{\pi}{3}<\theta\le\dfrac{\pi}{2}$일 때는 $\cos\theta<1-\cos\theta$이므로, 문제의 방정식 $(\sin\theta\odot\cos\theta)+\{\cos\theta\odot(1-\cos\theta)\}=\sin\theta$는
        $$(\sin\theta-\cos\theta)+0=\sin\theta$$
        즉 $\cos\theta=0$이 된다. $\dfrac{\pi}{3}<\theta\le\dfrac{\pi}{2}$에서 $\cos\theta=0$을 만족하는 $\theta$는 $\dfrac{\pi}{2}$이다. (5점)
      criteria: [1.B2]
    - id: 1b-4
      content: |
        따라서 $\dfrac{\pi}{4}\le\theta\le\dfrac{\pi}{2}$에서 문제의 방정식을 만족시키는 $\theta$는 $\dfrac{\pi}{2}$뿐이다.
      criteria: [1.B2]
