    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: (도입) $\frac{\pi}{4}\le\theta\le\frac{\pi}{2}$에서 $\sin\theta\odot\cos\theta=\sin\theta-\cos\theta$임을 찾았다.
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: (전개) $\frac{\pi}{4}\le\theta\le\frac{\pi}{3}$일 때 방정식이 $\cos\theta=1$이 되어 해가 없음을 보였다.
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: (결론) $\frac{\pi}{3}<\theta\le\frac{\pi}{2}$일 때 방정식이 $\cos\theta=0$이 되어 $\theta=\frac{\pi}{2}$임을 찾았다.
      steps: [1b-3, 1b-4]
    deductions:
    - code: D1-1
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
