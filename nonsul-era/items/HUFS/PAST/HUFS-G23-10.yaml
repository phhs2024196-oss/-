      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: (전개) $n=k$일 때 명제가 참임을 가정하고 $a_k^2+2=3^kb$로 표현했다.
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 7
      evidence: (결론) 귀납적 정의와 가정을 대입해 $a_{k+1}^2+2=3^{k+1}(3^{2k-1}b^3-b)$를 유도하고 $n=k+1$일 때도 명제가 참임을 밝혔다.
      depends_on: [1.M1]
      not_penalized:
      - 문항 해설 (iv)의 최종 결론 문장을 쓰지 않음
      steps: [1b-3, 1b-4]
