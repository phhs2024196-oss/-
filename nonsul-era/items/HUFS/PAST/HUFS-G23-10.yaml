stimuli: []

stem: |
  수열 $\{a_n\}$은 다음과 같이 귀납적으로 정의된다.
  $$a_1=1,\qquad a_{n+1}=a_n^{\,3}+3a_n\ (n=1,2,3,\ldots)$$
  모든 자연수 $n$에 대하여 정수 $a_n^{\,2}+2$는 $3^n$의 배수임을 수학적 귀납법으로 증명하시오. (12점)

subparts:
- id: '1'
  stem: |
    모든 자연수 $n$에 대하여 $a_n^{\,2}+2$가 $3^n$의 배수임을 수학적 귀납법으로 증명하시오.
  points: 12
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 귀납 가정 $a_k^2=3^kb-2$를 $a_{k+1}^2+2=a_k^2(a_k^2+3)^2+2$에 대입하면 $3^{k+1}(3^{2k-1}b^3-b)$.
    steps:
    - {id: 1a, content: '$n=1$: $3$은 $3^1$의 배수. $a_k^2+2=3^kb\Rightarrow a_{k+1}^2+2=(3^kb-2)(3^kb+1)^2+2=3^{k+1}(3^{2k-1}b^3-b)$', criteria: [1.B1, 1.M1, 1.R1]}
    hint_ladder:
    - $a_{k+1}^2$을 $a_k^2$만으로 나타내 보자.
    - 귀납 가정을 $a_k^2=3^kb-2$ 꼴로 써서 대입해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 선행학습 영향평가 보고서 문항카드 p.81~82(문항 해설·채점 기준)
    steps:
    - id: 1b-1
      content: |
        $n=1$일 때, $a_1^{\,2}+2=1^2+2=3$이고 $3^1=3$이므로 $a_1^{\,2}+2$는 $3^1$의 배수이다. 따라서 $n=1$인 경우에 $a_n^{\,2}+2$는 $3^n$의 배수이다. (2점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $n=k\ (k\ge1)$일 때, $a_n^{\,2}+2$가 $3^n$의 배수임을 가정하자. 그러면 $a_n^{\,2}+2\ge2$이므로
        $$a_k^{\,2}+2=3^kb\quad\cdots\cdots(1)$$
        를 만족시키는 자연수 $b$가 존재한다. (3점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        다음을 유도한다.
        $$\begin{aligned}a_{k+1}^{\,2}+2&=(a_k^{\,3}+3a_k)^2+2\quad(\text{수열 }\{a_n\}\text{의 귀납적 정의에 의해})\\&=a_k^{\,2}(a_k^{\,2}+3)^2+2\\&=(3^kb-2)(3^kb+1)^2+2\quad((1)\text{에 의해})\\&=(3^kb-2)(3^{2k}b^2+2\times3^kb+1)+2\\&=(3^{3k}b^3+2\times3^{2k}b^2+3^kb-2\times3^{2k}b^2-4\times3^kb-2)+2\\&=3^{3k}b^3-3^{k+1}b\\&=3^{k+1}(3^{2k-1}b^3-b)\end{aligned}$$
        이때 $b$는 자연수이고 $3^{2k-1}$은 $3$ 이상인 자연수이므로 $3^{2k-1}b^3-b=b(3^{2k-1}b^2-1)$도 자연수이다. 즉 $a_{k+1}^{\,2}+2$은 $3^{k+1}$의 배수이다. 따라서 $n=k+1$일 때도 $a_n^{\,2}+2$는 $3^n$의 배수이다. (7점)
      criteria: [1.R1]
    - id: 1b-4
      content: |
        수학적 귀납법으로부터 모든 자연수 $n$에 대하여 $a_n^{\,2}+2$는 $3^n$의 배수이다.
      criteria: [1.R1]
