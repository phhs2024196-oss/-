stimuli: []

stem: |
  수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라고 하자. 다음 조건이 모두 성립할 때, $S_{20}$의 값을 구하시오.

  (가) $a_1=1$, $a_2=2$

  (나) $S_{2n+1}=S_{2n}+3n+1\quad(n=1,2,3,\cdots)$

  (다) $S_{2n+2}=S_{2n+1}+2^n\quad(n=1,2,3,\cdots)$

subparts:
- id: '1'
  stem: |
    $S_{20}$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1169', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 조건 (나)·(다)에서 $a_{2n+1}=3n+1$, $a_{2n+2}=2^n$을 얻어 홀수 번째 항(등차)과 짝수 번째 항(등비)으로 나누어 더한다.
    steps:
    - {id: 1a, content: '$S_{20}=1+2+\dfrac{9(4+28)}{2}+2(2^9-1)=1169$', criteria: [1.B1, 1.B2, 1.M1]}
    hint_ladder:
    - $S_{2n+1}-S_{2n}$은 어떤 항인가?
    - $a_3,a_5,a_7,\cdots$와 $a_4,a_6,a_8,\cdots$는 각각 어떤 수열인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024학년도 선행학습 영향평가 자체평가보고서 p.131~132(PDF p.133~134) 문항 해설 (i)~(iii)
    steps:
    - id: 1b-1
      content: |
        (i) 조건 (나)에 의해 $a_{2n+1}=S_{2n+1}-S_{2n}=3n+1\ (n=1,2,3,\cdots)$이므로 수열 $a_3,a_5,a_7,\cdots$은 첫째항이 $a_3=4$이고 공차가 $3$인 등차수열이다. (2점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (ii) 조건 (다)에 의해 $a_{2n+2}=S_{2n+2}-S_{2n+1}=2^n\ (n=1,2,3,\cdots)$이므로 수열 $a_4,a_6,a_8,\cdots$은 첫째항이 $a_4=2$이고 공비가 $2$인 등비수열이다. (2점)
      criteria: [1.B2]
    - id: 1b-3
      content: |
        (iii) 조건 (가)와 (i), (ii)를 이용해서 다음을 계산한다.
        $$\begin{aligned}S_{20}&=a_1+a_2+a_3+\cdots+a_{20}\\&=a_1+a_2+(\underbrace{a_3+a_5+a_7+\cdots+a_{19}}_{9\text{개 항}})+(\underbrace{a_4+a_6+a_8+\cdots+a_{20}}_{9\text{개 항}})\\&=1+2+\dfrac{9(a_3+a_{19})}{2}+\dfrac{a_4(2^9-1)}{2-1}\\&=1+2+\dfrac{9(4+28)}{2}+2(2^9-1)\\&=1169\end{aligned}$$
        (또는, $1+2+\sum_{n=1}^{9}(3n+1)+\sum_{n=1}^{9}2^n$) (6점)
      criteria: [1.M1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: $a_{2n+1}=S_{2n+1}-S_{2n}=3n+1$에서 $a_3,a_5,a_7,\cdots$이 첫째항 4, 공차 3인 등차수열임을 적었다.
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: $a_{2n+2}=S_{2n+2}-S_{2n+1}=2^n$에서 $a_4,a_6,a_8,\cdots$이 첫째항 2, 공비 2인 등비수열임을 적었다.
      steps: [1b-2]
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: $S_{20}$을 $a_1+a_2$와 홀수 번째 9개 항, 짝수 번째 9개 항의 합으로 묶고 등차·등비수열의 합 공식으로 $1169$를 계산했다.
      depends_on: [1.B1, 1.B2]
      steps: [1b-3]
