intent: |
  합 $S_n$의 관계식에서 홀수 번째 항과 짝수 번째 항을 각각 구해 등차수열·등비수열임을 파악하고, 합의 공식으로 $S_{20}$을 계산하는 능력을 본다.
key_idea: |
  $a_{2n+1}=S_{2n+1}-S_{2n}=3n+1$, $a_{2n+2}=S_{2n+2}-S_{2n+1}=2^n$이므로 $S_{20}=1+2+\sum_{n=1}^{9}(3n+1)+\sum_{n=1}^{9}2^n=1169$.
