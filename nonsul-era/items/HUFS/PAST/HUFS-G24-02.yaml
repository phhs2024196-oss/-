stimuli: []

stem: |
  다항함수 $f(x)$가 다음 조건을 만족시킬 때, $f(2)$의 값을 구하시오.

  (가) 모든 실수 $x$에 대해 $\lvert f(x)-x^2\rvert\le2$

  (나) $\displaystyle\lim_{x\to1}\dfrac{f(x)}{3x^2-x-2}=\dfrac25$

subparts:
- id: '1'
  stem: |
    $f(2)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (가)를 $x^2$으로 나눈 부등식의 극한으로 $f(x)=x^2+ax+b$, (나)에서 $f(x)=(x-1)(x+c)$와 $\dfrac{1+c}{5}=\dfrac25$로 $f(x)=x^2-1$, $f(2)=3$.
    steps:
    - {id: 1a, content: '$f(x)=x^2+ax+b\Rightarrow f(x)=(x-1)(x+c)\Rightarrow c=1,\ f(2)=3$', criteria: [1.M1, 1.M2, 1.A1, 1.A2]}
    hint_ladder:
    - 부등식 $x^2-2\le f(x)\le x^2+2$의 각 변을 $x^2$으로 나누면?
    - (나)의 분모가 $x\to1$일 때 $0$으로 가면 분자는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024학년도 선행학습 영향평가 자체평가보고서 p.133(PDF p.135) 문항 해설 (i)~(iii)
    steps:
    - id: 1b-1
      content: |
        (i) 조건 (가)에 의해 부등식 $x^2-2\le f(x)\le x^2+2$ ($x$는 실수)가 성립하는데 모든 항을 $x^2$(단, $x\ne0$)으로 나누면
        $$1-\dfrac{2}{x^2}\le\dfrac{f(x)}{x^2}\le1+\dfrac{2}{x^2}$$
        가 된다. 여기서 $\lim_{x\to\infty}\left(1-\dfrac{2}{x^2}\right)=\lim_{x\to\infty}\left(1+\dfrac{2}{x^2}\right)=1$이므로 $\lim_{x\to\infty}\dfrac{f(x)}{x^2}=1$이 성립한다. 따라서 다항함수 $f(x)$는
        $$f(x)=x^2+ax+b\quad(a,\ b\text{는 상수})\qquad\cdots\cdots(1)$$
        이다. (3점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (ii) 조건 (나)와 (1)에 의해
        $$\dfrac25=\lim_{x\to1}\dfrac{f(x)}{3x^2-x-2}=\lim_{x\to1}\dfrac{x^2+ax+b}{(3x+2)(x-1)}$$
        이므로 $f(x)=(x-1)(x+c)$ ($c$는 상수) $\cdots\cdots(2)$이다. (3점)
      criteria: [1.M2]
    - id: 1b-3
      content: |
        다시 한번 조건 (나)와 (2)에 의해
        $$\dfrac25=\lim_{x\to1}\dfrac{f(x)}{3x^2-x-2}=\lim_{x\to1}\dfrac{(x-1)(x+c)}{(3x+2)(x-1)}=\lim_{x\to1}\dfrac{x+c}{3x+2}=\dfrac{1+c}{5}$$
        이므로, $c=1$임을 찾는다. 따라서 $f(x)=(x-1)(x+1)=x^2-1$이다. (3점)
      criteria: [1.A1]
    - id: 1b-4
      content: |
        (iii) 구하고자 하는 $f(2)$의 값은 $f(2)=2^2-1=3$이다. (1점)
      criteria: [1.A2]
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    key_idea: (가)에서 $f(x)-x^2$이 유계인 다항식이므로 상수이다.
    steps:
    - id: 1c-1
      content: |
        $g(x)=f(x)-x^2$은 다항식이고 모든 실수에서 $\lvert g(x)\rvert\le2$이므로 상수함수이다(일차 이상의 다항식은 유계가 아님). $f(x)=x^2+b$에서 (나)의 분모가 $x\to1$일 때 $0$이므로 $f(1)=1+b=0$, $b=-1$. 이때 $\lim_{x\to1}\dfrac{x+1}{3x+2}=\dfrac25$로 (나)도 성립하므로 $f(2)=3$.
      criteria: [1.M1, 1.M2, 1.A1, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 조건 (가)를 $1-\dfrac{2}{x^2}\le\dfrac{f(x)}{x^2}\le1+\dfrac{2}{x^2}$로 변형해 $\lim_{x\to\infty}\dfrac{f(x)}{x^2}=1$을 설명하고 $f(x)=x^2+ax+b$를 얻었다.
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: (나)에서 분모가 $(3x+2)(x-1)$이고 극한값이 존재하므로 $f(x)=(x-1)(x+c)$ 꼴임을 적었다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $\lim_{x\to1}\dfrac{x+c}{3x+2}=\dfrac{1+c}{5}=\dfrac25$에서 $c=1$, $f(x)=x^2-1$을 얻었다.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: $f(2)=3$.
      depends_on: [1.M1, 1.M2]
      cao: true
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
