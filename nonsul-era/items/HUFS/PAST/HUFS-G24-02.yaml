intent: |
  부등식 조건에서 함수의 극한(샌드위치 정리)으로 다항함수의 차수와 최고차항을 결정하고, $\dfrac00$ 꼴 극한 조건으로 인수와 계수를 정하는 능력을 본다.
key_idea: |
  $1-\dfrac{2}{x^2}\le\dfrac{f(x)}{x^2}\le1+\dfrac{2}{x^2}$에서 $\lim_{x\to\infty}\dfrac{f(x)}{x^2}=1$이므로 $f(x)=x^2+ax+b$, (나)에서 $f(1)=0$이고 $\dfrac{1+c}{5}=\dfrac25$로 $f(x)=x^2-1$.
stuck: |
  절댓값 부등식을 $x^2$으로 나누어 $x\to\infty$ 극한으로 $f$가 최고차항의 계수 1인 이차식임을 끌어내는 단계
