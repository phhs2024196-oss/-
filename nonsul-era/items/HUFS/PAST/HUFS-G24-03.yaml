intent: |
  사인함수의 치역으로 이차방정식의 근을 걸러내고, 사인함수의 주기성으로 방정식의 일반해를 구한 뒤 $y=x^2-1$의 그래프와 수평선의 교점 개수로 바꾸어 세는 능력을 본다.
key_idea: |
  $\sin(t^2-1)=\dfrac{-1+\sqrt5}{2}$이고, $\sin\alpha=\dfrac{-1+\sqrt5}{2}$ ($0<\alpha<\dfrac\pi2$)에 대해 $t^2-1=\alpha+2n\pi$ 또는 $(\pi-\alpha)+2n\pi$. $-1\le t^2-1\le35$이고 $11\pi<35<12\pi$이므로 $n=0,1,\cdots,5$의 12개 직선이 각각 두 점에서 만나 $24$개.
stuck: |
  $t^2-1$의 범위 $[-1,35]$를 $\pi$의 배수와 비교해 해당하는 $n$의 범위를 정하는 단계
