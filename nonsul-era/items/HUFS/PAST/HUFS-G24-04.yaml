      points: 2
      evidence: $\alpha=0$, $\alpha=2$인 경우 넓이가 각각 $16$임을 정적분으로 구했다.
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $0<\alpha<2$인 경우 $S=\int_0^\alpha f(x)\,dx-\int_\alpha^2 f(x)\,dx=-2\alpha^4+8\alpha^3-16\alpha+16$을 구했다.
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 5
      evidence: $g'(x)=-8(x-1)(x^2-2x-2)$에서 $0<x<2$의 최솟값이 $g(1)=6$임을 근거와 함께 구했다.
      depends_on: [1.M2]
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: 경우 (ii)의 $16$과 비교해 넓이의 최솟값이 $6$이라고 결론 내렸다.
      depends_on: [1.M1, 1.M3]
      cao: true
      steps: [1b-5]
