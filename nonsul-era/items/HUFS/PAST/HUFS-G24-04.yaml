stimuli: []

stem: |
  삼차함수 $f(x)$가 다음 조건을 만족시킬 때, $f(x)$의 그래프와 $x$축으로 둘러싸인 도형의 넓이의 최솟값을 구하시오.

  (가) $f(x)$의 최고차항의 계수는 $12$이다.

  (나) $f(0)=f(2)=0$

  (다) $x<0$이면 $f(x)<0$

  (라) $x>2$이면 $f(x)>0$

subparts:
- id: '1'
  stem: |
    $f(x)$의 그래프와 $x$축으로 둘러싸인 도형의 넓이의 최솟값을 구하시오.
  points: 14
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=12x(x-2)(x-\alpha)$, $0\le\alpha\le2$. 양 끝 $\alpha=0,2$에서 넓이 $16$, $0<\alpha<2$에서 $S(\alpha)=-2\alpha^4+8\alpha^3-16\alpha+16$의 최솟값 $S(1)=6$.
    steps:
    - {id: 1a, content: '$S(\alpha)=-2\alpha^4+8\alpha^3-16\alpha+16$, $S''(\alpha)=-8(\alpha-1)(\alpha^2-2\alpha-2)$, $S(1)=6<16$', criteria: [1.B1, 1.M1, 1.M2, 1.M3, 1.A1]}
    hint_ladder:
    - 세 번째 근을 $\alpha$로 두면 (다)(라)에서 $\alpha$의 범위는?
    - $0<\alpha<2$일 때 $f$의 부호는 어느 구간에서 바뀌는가?
    - 넓이를 $\alpha$에 대한 함수로 보고 미분하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024학년도 선행학습 영향평가 자체평가보고서 p.135~136(PDF p.137~138) 문항 해설 (i)~(iv)
    steps:
    - id: 1b-1
      content: |
        (i) 조건 (가)와 (나)에 의해 삼차함수 $f(x)$는 다음과 같다.
        $$f(x)=12x(x-2)(x-\alpha)=12\{x^3-(2+\alpha)x^2+2\alpha x\}\quad(\text{단, }\alpha\text{는 상수})$$
        게다가 조건 (다)와 (라)에 의해 $0\le\alpha\le2$임을 알 수 있다. (2점)

        함수 $f(x)$의 그래프의 개형은 아래와 같다. [그림] (해설 그림 3개: $\alpha=0$일 때 원점에서 $x$축에 접하고 $0<x<2$에서 $x$축 아래로 내려갔다가 $x=2$에서 올라가는 곡선, $\alpha=2$일 때 $0<x<2$에서 $x$축 위로 올라갔다가 $x=2$에서 $x$축에 접하는 곡선, $0<\alpha<2$일 때 $(0,\alpha)$에서 $x$축 위, $(\alpha,2)$에서 $x$축 아래에 있는 곡선. 둘러싸인 부분은 음영 표시)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (ii) 함수 $f(x)$의 그래프와 $x$축으로 둘러싸인 도형의 넓이를 $S$라고 하자. $\alpha=0$인 경우
        $$S=-\int_0^2f(x)\,dx=-\int_0^2 12(x^3-2x^2)\,dx=-\left[3x^4-8x^3\right]_0^2=16$$
        이고, $\alpha=2$인 경우
        $$S=\int_0^2f(x)\,dx=\int_0^2 12(x^3-4x^2+4x)\,dx=\left[3x^4-16x^3+24x^2\right]_0^2=16$$
        이다. (2점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $0<\alpha<2$인 경우
        $$\begin{aligned}S&=\int_0^\alpha f(x)\,dx-\int_\alpha^2 f(x)\,dx\\&=\int_0^\alpha 12\{x^3-(2+\alpha)x^2+2\alpha x\}\,dx-\int_\alpha^2 12\{x^3-(2+\alpha)x^2+2\alpha x\}\,dx\\&=\left[3x^4-4(2+\alpha)x^3+12\alpha x^2\right]_0^\alpha-\left[3x^4-4(2+\alpha)x^3+12\alpha x^2\right]_\alpha^2\\&=-2\alpha^4+8\alpha^3-16\alpha+16\end{aligned}$$
        이다. (4점)
      criteria: [1.M2]
    - id: 1b-4
      content: |
        (iii) 함수 $g(x)=-2x^4+8x^3-16x+16$을 미분하면
        $$g'(x)=-8x^3+24x^2-16=-8(x-1)(x^2-2x-2)$$
        이므로 $g'(x)=0$을 만족하는 $x$는 $x=1,\ 1+\sqrt3,\ 1-\sqrt3$이다. 따라서 사차함수 $g(x)$는 총 세 개의 극값을 갖는다. 또한 최고차항의 계수가 음수인 사차함수 그래프의 개형을 고려해 볼 때 $0<x<2$의 범위에서 $g(x)$의 최솟값은 $x=1$일 때 $g(1)=6$이다. (5점)

        [그림] (해설 그림: $x=1-\sqrt3$, $1+\sqrt3$에서 극대, $x=1$에서 극소값 $6$을 갖는 $y=g(x)$의 그래프)
      criteria: [1.M3]
    - id: 1b-5
      content: |
        (iv) 따라서 $0<\alpha<2$인 경우 $S$는 $\alpha=1$일 때 최솟값 $6$을 가지게 되고, 과정 (ii)에 의해 $f(x)$의 그래프와 $x$축으로 둘러싸인 도형의 넓이의 최솟값은 $6$이다. (1점)
      criteria: [1.A1]
