intent: |
  부호 조건으로 삼차함수의 미정 근의 범위를 정하고, 근의 위치에 따라 경우를 나누어 정적분으로 넓이를 구한 뒤, 넓이를 매개변수의 사차함수로 보고 미분해 최솟값을 구하는 능력을 본다.
key_idea: |
  $f(x)=12x(x-2)(x-\alpha)$, $0\le\alpha\le2$. $\alpha=0,2$이면 넓이 $16$, $0<\alpha<2$이면 $S=-2\alpha^4+8\alpha^3-16\alpha+16$이고 $S'=-8(\alpha-1)(\alpha^2-2\alpha-2)$에서 $\alpha=1$일 때 최솟값 $6$.
stuck: |
  넓이를 $\alpha$의 사차함수로 정리한 뒤 구간 $(0,2)$에서 극값을 판정하는 두 번째 최적화 단계
