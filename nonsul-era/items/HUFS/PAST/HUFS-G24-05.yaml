      points: 5
      evidence: $3t^2-kt-6=0$의 양근 $t=\dfrac{k+\sqrt{k^2+72}}{6}$을 $k=3,4,5,6$에 대해 계산해 유리수인 경우 $k=3$, $t=2$를 얻었다.
      depends_on: [1.M2, 1.B1]
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $t=2$에서 $a_1=\cdots=a_{100}=0$이고 $b_1=1$, $b_2=\cdots=b_{100}=0$임을 유도했다.
      depends_on: [1.M3]
      steps: [1b-5]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: $\displaystyle\sum_{n=1}^{100}(a_n+b_n)=1$.
      depends_on: [1.M3]
      cao: true
