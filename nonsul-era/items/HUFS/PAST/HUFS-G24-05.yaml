intent: |
  로그의 밑 변환으로 두 조건을 한 변수 $t=\log_xy$의 식으로 바꾸고, 등비수열의 합으로 $t$의 범위를 잡아 자연수 조건의 후보를 나열한 뒤, $t$의 유리성으로 후보를 하나로 좁히는 능력을 본다.
key_idea: |
  $t=\log_xy$이면 $3\left(t-\dfrac2t\right)$는 자연수이고 $2\le t<3$이므로 그 값은 $3,4,5,6$. (나)에서 $t$는 유리수이므로 $t=\dfrac{k+\sqrt{k^2+72}}{6}$이 유리수인 $k=3$, $t=2$. 그러면 $a_n=0$, $b_1=1$, 나머지 $b_n=0$으로 합은 $1$.
stuck: |
  조건 (나)의 우변이 유한 합이므로 $t$가 유리수라는 사실로 $k=3,4,5,6$ 중 하나를 고르는 단계
