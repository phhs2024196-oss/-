stimuli: []

stem: |
  $1$보다 큰 두 자연수 $x$와 $y$가 다음 조건을 만족시킨다.

  (가) $3(\log_xy-\log_yx^2)$의 값은 자연수이다.

  (나) $0$ 또는 $1$의 값을 가지는 어떤 $100$개의 수 $a_1,\ a_2,\ a_3,\ \cdots,\ a_{100}$에 대해
  $$\log_xy=2+\dfrac{a_1}{2}+\dfrac{a_2}{2^2}+\dfrac{a_3}{2^3}+\cdots+\dfrac{a_{100}}{2^{100}}$$

  (다) $0$ 또는 $1$의 값을 가지는 어떤 $100$개의 수 $b_1,\ b_2,\ b_3,\ \cdots,\ b_{100}$에 대해
  $$\log_yx=\dfrac{b_1}{2}+\dfrac{b_2}{2^2}+\dfrac{b_3}{2^3}+\cdots+\dfrac{b_{100}}{2^{100}}$$

  이 때, $\displaystyle\sum_{n=1}^{100}(a_n+b_n)$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{n=1}^{100}(a_n+b_n)$의 값을 구하시오.
  points: 16
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t=\log_xy$로 두면 $3\left(t-\dfrac2t\right)\in\{3,4,5,6\}$, $t$가 유리수이므로 $t=2$. 따라서 $a_n$은 모두 $0$, $b_1=1$이고 나머지 $b_n=0$.
    steps:
    - {id: 1a, content: '$2\le t<3\Rightarrow3\le3\left(t-\dfrac2t\right)<7$, $t=\dfrac{k+\sqrt{k^2+72}}{6}$ 유리수 $\Rightarrow k=3$, $t=2$ $\Rightarrow\sum(a_n+b_n)=1$', criteria: [1.M1, 1.M2, 1.B1, 1.M3, 1.A1, 1.A2]}
    hint_ladder:
    - $\log_yx$와 $\log_yx^2$을 $\log_xy$로 나타내 보자.
    - (나)의 우변이 가질 수 있는 가장 작은 값과 가장 큰 값은?
    - (나)의 우변은 유리수이다. 그러면 $t$는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024학년도 선행학습 영향평가 자체평가보고서 p.137~138(PDF p.139~140) 문항 해설 (i)~(iii)
    steps:
    - id: 1b-1
      content: |
        (i) $t=\log_xy$라고 하면 $\log_yx=\dfrac{1}{\log_xy}=\dfrac1t$이므로 조건 (가)에 의해 $3\left(t-\dfrac2t\right)$는 자연수이다. (2점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        조건 (나)에서 $a_1,\ a_2,\ a_3,\ \cdots,\ a_{100}$은 $0$ 또는 $1$이므로 부등식
        $$2\le t\le2+\dfrac12+\dfrac1{2^2}+\dfrac1{2^3}+\cdots+\dfrac1{2^{100}}=2+\dfrac{\frac12\left\{1-\left(\frac12\right)^{100}\right\}}{1-\frac12}=3-\dfrac1{2^{100}}<3$$
        을 찾는다. $2\le t<3$이므로 $\dfrac13<\dfrac1t\le\dfrac12$이고 $-1\le-\dfrac2t<-\dfrac23$이다. 따라서 $1\le t-\dfrac2t<\dfrac73$이고
        $$3\le3\left(t-\dfrac2t\right)<7$$
        을 얻는다. 이때 $3\left(t-\dfrac2t\right)$는 자연수이므로 될 수 있는 값은
        $$3\left(t-\dfrac2t\right)=3,\ 4,\ 5,\ 6\qquad\cdots\cdots(1)$$
        이다. (5점)
      criteria: [1.M2]
    - id: 1b-3
      content: |
        (ii) 조건 (나)에 의해 $t$가 유리수임을 주목한다. (1점)
      criteria: [1.B1]
    - id: 1b-4
      content: |
        $k=3\left(t-\dfrac2t\right)$라고 하면 $3t^2-kt-6=0$인데, $t$는 양수이므로 $t=\dfrac{k+\sqrt{k^2+72}}{6}$이다. (1)에 의해 $k$는 $3,\ 4,\ 5,\ 6$이 될 수 있고 각각의 경우 $\dfrac{k+\sqrt{k^2+72}}{6}$을 계산하면 차례대로
        $$\dfrac{3+\sqrt{81}}{6},\quad\dfrac{4+\sqrt{88}}{6},\quad\dfrac{5+\sqrt{97}}{6},\quad\dfrac{6+\sqrt{108}}{6}$$
        이다. 이 값이 유리수가 되는 경우는 $k=3$일 때이다. 따라서
        $$t=\dfrac{3+\sqrt{81}}{6}=2\qquad\cdots\cdots(2)$$
        이다. (5점)
      criteria: [1.M3]
    - id: 1b-5
      content: |
        (iii) 조건 (나)와 (2)로부터 $2=2+\dfrac{a_1}{2}+\dfrac{a_2}{2^2}+\dfrac{a_3}{2^3}+\cdots+\dfrac{a_{100}}{2^{100}}$이 성립하는데, $a_1,\ a_2,\ a_3,\ \cdots,\ a_{100}$은 $0$ 또는 $1$이므로
        $$a_1=a_2=a_3=\cdots=a_{100}=0\qquad\cdots\cdots(3)$$
        을 찾는다. 또한 조건 (다)와 (2)로부터 $\dfrac12=\dfrac{b_1}{2}+\dfrac{b_2}{2^2}+\dfrac{b_3}{2^3}+\cdots+\dfrac{b_{100}}{2^{100}}$이 성립하는데, $b_1,\ b_2,\ b_3,\ \cdots,\ b_{100}$은 $0$ 또는 $1$이므로
        $$b_1=1,\quad b_2=b_3=\cdots=b_{100}=0\qquad\cdots\cdots(4)$$
        을 찾는다. (2점)
      criteria: [1.A1]
    - id: 1b-6
      content: |
        따라서 (3)과 (4)로부터 $\displaystyle\sum_{n=1}^{100}(a_n+b_n)=1$이다. (1점)
      criteria: [1.A2]
