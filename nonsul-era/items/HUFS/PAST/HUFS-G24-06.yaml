    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: $f_1$의 $x=0$에서의 좌극한 $-1$, 우극한 $1$로 불연속이므로 $<f_1(x)>=-1$임을 적었다.
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: $f_2$의 좌극한·우극한·함숫값이 모두 $0$이어서 $x=0$에서 연속임을 보였다.
      steps: [1b-2]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $f_2$의 미분계수의 좌극한 $-1$, 우극한 $1$이 달라 미분가능하지 않으므로 $<f_2(x)>=0$임을 보였다.
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: $n\ge3$일 때 $f_n$이 $x=0$에서 연속임을 보였다.
      implied_ok: true
      not_penalized:
      - 연속임을 보이지 않고 미분가능함만 보인 뒤 $<f_n(x)>=1$이라 한 경우(전개 6점 인정, 채점 유의사항 1)
      steps: [1b-4]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $n\ge3$일 때 미분계수의 좌극한·우극한이 모두 $0$이어서 미분가능하므로 $<f_n(x)>=1$임을 보였다.
      steps: [1b-5]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $-1+0+1\times98=97$.
      depends_on: [1.M1, 1.M2]
      cao: true
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
