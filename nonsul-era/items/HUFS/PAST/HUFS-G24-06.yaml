stimuli: []

stem: |
  임의의 함수 $f(x)$에 대해 실수 $<f(x)>$를 다음과 같이 정의하자.
  $$<f(x)>=\begin{cases}-1 & (f(x)\text{가 }x=0\text{에서 불연속일 때})\\ 0 & (f(x)\text{가 }x=0\text{에서 연속이지만 미분가능하지 않을 때})\\ 1 & (f(x)\text{가 }x=0\text{에서 미분가능할 때})\end{cases}$$

  각각의 자연수 $n$에 대해 함수 $f_n(x)$를
  $$f_n(x)=\begin{cases}\dfrac{x^n(1+\lvert x\rvert)}{\lvert x\rvert} & (x\ne0)\\ 0 & (x=0)\end{cases}$$
  이라 할 때, $<f_1(x)>+<f_2(x)>+\cdots+<f_{100}(x)>$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    $<f_1(x)>+<f_2(x)>+\cdots+<f_{100}(x)>$의 값을 구하시오.
  points: 16
  depends_on: []
  answer: {kind: value, value: '97', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x>0$이면 $f_n=x^{n-1}+x^n$, $x<0$이면 $f_n=-x^{n-1}+x^n$. $<f_1>=-1$, $<f_2>=0$, $n\ge3$이면 $<f_n>=1$이므로 $-1+0+98=97$.
    steps:
    - {id: 1a, content: '$<f_1(x)>=-1$, $<f_2(x)>=0$, $<f_n(x)>=1\ (n\ge3)$ → $-1+0+1\times98=97$', criteria: [1.B1, 1.B2, 1.M1, 1.B3, 1.M2, 1.A1]}
    hint_ladder:
    - $x>0$과 $x<0$에서 $\lvert x\rvert$를 벗기고 약분해 보자.
    - $n=2$일 때 미분계수의 좌극한과 우극한은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024학년도 선행학습 영향평가 자체평가보고서 p.140(PDF p.142) 문항 해설 (i)~(iv)
    steps:
    - id: 1b-1
      content: |
        (i) $n=1$일 때,
        $$f_n(x)=f_1(x)=\begin{cases}\dfrac{x(1-x)}{-x}=-1+x & (x<0)\\ 0 & (x=0)\\ \dfrac{x(1+x)}{x}=1+x & (x>0)\end{cases}$$
        이다. 이때, $\lim_{x\to0-}f_1(x)=\lim_{x\to0-}(-1+x)=-1$, $\lim_{x\to0+}f_1(x)=\lim_{x\to0+}(1+x)=1$이므로 $f_1(x)$는 $x=0$에서 불연속이다. 따라서 $<f_1(x)>=-1$이다. (2점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (ii) $n=2$일 때,
        $$f_n(x)=f_2(x)=\begin{cases}\dfrac{x^2(1-x)}{-x}=-x+x^2 & (x<0)\\ 0 & (x=0)\\ \dfrac{x^2(1+x)}{x}=x+x^2 & (x>0)\end{cases}$$
        이다. 이때, $\lim_{x\to0-}f_2(x)=\lim_{x\to0-}(-x+x^2)=0$, $\lim_{x\to0+}f_2(x)=\lim_{x\to0+}(x+x^2)=0$, $f_2(0)=0$이므로 $f_2(x)$는 $x=0$에서 연속이다. (2점)
      criteria: [1.B2]
    - id: 1b-3
      content: |
        한편,
        $$\lim_{h\to0-}\dfrac{f_2(0+h)-f_2(0)}{h}=\lim_{h\to0-}\dfrac{(-h+h^2)-0}{h}=\lim_{h\to0-}(-1+h)=-1,$$
        $$\lim_{h\to0+}\dfrac{f_2(0+h)-f_2(0)}{h}=\lim_{h\to0+}\dfrac{(h+h^2)-0}{h}=\lim_{h\to0+}(1+h)=1$$
        이므로 $f_2(x)$는 $x=0$에서 미분가능하지 않다. 따라서 $<f_2(x)>=0$이다. (4점)
      criteria: [1.M1]
    - id: 1b-4
      content: |
        (iii) $n\ge3$일 때,
        $$f_n(x)=\begin{cases}\dfrac{x^n(1-x)}{-x}=-x^{n-1}+x^n & (x<0)\\ 0 & (x=0)\\ \dfrac{x^n(1+x)}{x}=x^{n-1}+x^n & (x>0)\end{cases}$$
        이다. 이때, $\lim_{x\to0-}f_n(x)=\lim_{x\to0-}(-x^{n-1}+x^n)=0$, $\lim_{x\to0+}f_n(x)=\lim_{x\to0+}(x^{n-1}+x^n)=0$, $f_n(0)=0$이므로 $f_n(x)$는 $x=0$에서 연속이다. (2점)
      criteria: [1.B3]
    - id: 1b-5
      content: |
        한편, $n-2\ge1$임을 주목하면
        $$\lim_{h\to0-}\dfrac{f_n(0+h)-f_n(0)}{h}=\lim_{h\to0-}\dfrac{(-h^{n-1}+h^n)-0}{h}=\lim_{h\to0-}(-h^{n-2}+h^{n-1})=0,$$
        $$\lim_{h\to0+}\dfrac{f_n(0+h)-f_n(0)}{h}=\lim_{h\to0+}\dfrac{(h^{n-1}+h^n)-0}{h}=\lim_{h\to0+}(h^{n-2}+h^{n-1})=0$$
        이므로 $f_n(x)$는 $x=0$에서 미분가능하다. 따라서 $<f_n(x)>=1$이다. (4점)
      criteria: [1.M2]
    - id: 1b-6
      content: |
        (iv) 그러므로 $<f_1(x)>+<f_2(x)>+<f_3(x)>+\cdots+<f_{100}(x)>=-1+0+(1\times98)=97$이다. (2점)
      criteria: [1.A1]
