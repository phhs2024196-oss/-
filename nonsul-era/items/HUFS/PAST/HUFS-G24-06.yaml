intent: |
  절댓값이 들어간 함수를 $x$의 부호에 따라 나누어 정리하고, $n$에 따라 $x=0$에서의 연속성과 미분가능성을 좌극한·우극한으로 판정해 분류하는 능력을 본다.
key_idea: |
  $x\ne0$에서 $f_n(x)=x^{n-1}+x^n$ ($x>0$), $-x^{n-1}+x^n$ ($x<0$). $n=1$은 불연속($-1$), $n=2$는 연속이지만 미분계수의 좌우극한이 $-1$, $1$로 미분 불가능($0$), $n\ge3$은 미분가능($1$). 합은 $-1+0+98=97$.
stuck: |
  $\lvert x\rvert$를 $x<0$, $x>0$으로 나누어 약분하고, $n=2$에서 연속이지만 미분가능하지 않은 경우를 구별하는 단계
