intent: |
  원과 곡선의 교점 조건을 사차방정식의 실근 조건으로 바꾸어 귀류법으로 원의 비존재를 증명하고, 접선에 수직인 직선을 이용해 조건을 만족시키는 원을 직접 구성해 존재를 보이는 능력을 본다.
key_idea: |
  (1) 중심 $(c,c)$인 원과 $y=x^2+2$의 교점 방정식 $f(x)=x^4+(5-2c)x^2-2cx+(2c^2-4c+4-r^2)=0$의 실근이 $-\dfrac12$뿐이면 $f'\left(-\dfrac12\right)=0$이어야 하나 $f'\left(-\dfrac12\right)=-\dfrac{11}{2}$. (2) $a=0$이면 중심 O, 반지름 2인 원, $a\ne0$이면 P에서의 법선 $l'$과 $y=x$의 교점 Q를 중심으로 하고 반지름이 $\overline{\mathrm{PQ}}$인 원.
stuck: |
  (1) 교점이 하나뿐이라는 조건을 「사차함수가 $x=-\dfrac12$에서 극소이고 $f'\left(-\dfrac12\right)=0$」으로 바꾸는 단계, (2) 원의 중심을 P에서의 법선 위에서 찾는 발상
