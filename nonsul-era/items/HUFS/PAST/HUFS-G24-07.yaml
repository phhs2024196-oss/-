stimuli:
- label: 그림
  body: |
    [그림] (문항에는 그림이 없고, 공식 해설 (2)에 그림 2개가 있음)
    ① $a=0$인 경우: 원점 O를 중심으로 하고 반지름의 길이가 2인 원이 곡선 $y=x^2+2$와 점 $\mathrm{P}(0,2)$에서만 만나며, 직선 $y=2$(점선)가 두 곡선의 공통접선, 직선 $y=x$가 원점을 지난다.
    ② $a\ne0$인 경우: 곡선 $y=x^2+2$ 위의 점 P에서의 접선 $l$(빨간 점선)과 P를 지나 $l$에 수직인 직선 $l'$(검은 점선)이 그려져 있고, $l'$과 직선 $y=x$의 교점 Q를 중심으로 하는 원이 P에서 $l$에 접한다. 원과 곡선은 $l$을 경계로 서로 반대쪽에 있다.

stem: |
  점 $\mathrm{P}(a,b)$가 곡선 $y=x^2+2$ 위에 있다.

subparts:
- id: '1'
  stem: |
    만약 $a=-\dfrac12$이면 아래의 조건 (가)와 (나)를 모두 만족시키는 원이 존재하지 않음을 귀류법을 사용하여 증명하시오. 여기서 귀류법이란, 명제의 결론을 부정하여 가정 또는 이미 알려진 사실에 모순됨을 보여서 그 결론이 성립함을 보여주는 증명방식이다.

    (가) 원의 중심은 직선 $y=x$ 위에 있다.

    (나) 점 $\mathrm{P}(a,b)$는 원과 곡선 $y=x^2+2$의 단 하나의 교점이 된다.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 존재한다고 가정하면 교점 방정식 $f(x)=0$의 실근은 $-\dfrac12$뿐이고 $f$는 그 점에서 극소이므로 $f'\left(-\dfrac12\right)=0$이어야 하지만, 실제로는 $c$에 관계없이 $-\dfrac{11}{2}$이다.
    steps:
    - {id: 1a, content: '$f''(x)=4x^3+2(5-2c)x-2c$, $f''\left(-\dfrac12\right)=-\dfrac{11}{2}\ne0$ → 모순', criteria: [1.R1, 1.M1, 1.M2, 1.R2]}
    hint_ladder:
    - 중심을 $(c,c)$로 두고 원의 방정식에 $y=x^2+2$를 대입하자.
    - 최고차항의 계수가 양수인 사차함수가 실근을 하나만 가지면 그 점에서 그래프는 어떤 모양인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024학년도 선행학습 영향평가 자체평가보고서 p.142(PDF p.144) 문항 해설 (1)
    steps:
    - id: 1b-1
      content: |
        $a=-\dfrac12$일 때 조건 (가)와 (나)를 모두 만족시키는 원이 존재한다고 가정하자. (1점)
      criteria: [1.R1]
    - id: 1b-2
      content: |
        조건 (가)에 의해 원의 중심은 점 $(c,c)$이고($c$는 상수), 원의 반지름의 길이를 $r$이라고 하면 원의 방정식은
        $$(x-c)^2+(y-c)^2=r^2\qquad\cdots\cdots(1)$$
        이다. 원과 곡선 $y=x^2+2$의 교점을 찾기 위해 $y=x^2+2$를 (1)에 대입하면 $(x-c)^2+(x^2+2-c)^2=r^2$이 되고, 이를 정리하면 다음과 같다.
        $$x^4+(5-2c)x^2-2cx+(2c^2-4c+4-r^2)=0$$
        함수 $f(x)$를 $f(x)=x^4+(5-2c)x^2-2cx+(2c^2-4c+4-r^2)$이라고 하면 조건 (나)에 의해 방정식 $f(x)=0$의 실근은 오직 $x=-\dfrac12$ 하나이다. (3점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        게다가 최고차항의 계수가 양수인 사차함수의 그래프의 개형을 고려해 볼 때
        $$f\left(-\dfrac12\right)=0\text{ 이고 }f(x)>0\ \left(x\ne-\dfrac12\right)$$
        여야 한다. 따라서 $f(x)$는 $x=-\dfrac12$에서 극소이고
        $$f'\left(-\dfrac12\right)=0\qquad\cdots\cdots(2)$$
        을 만족한다. (3점)
      criteria: [1.M2]
    - id: 1b-4
      content: |
        한편, $f(x)$를 미분하면 $f'(x)=4x^3+2(5-2c)x-2c$이고 $x=-\dfrac12$를 대입하면
        $$f'\left(-\dfrac12\right)=4\left(-\dfrac18\right)+2(5-2c)\left(-\dfrac12\right)-2c=-\dfrac{11}{2}$$
        인데 이는 (2)에 모순이다. (3점)

        따라서 처음의 가정이 잘못되었고, 두 조건 (가)와 (나)를 모두 만족시키는 원은 존재하지 않는다.
      criteria: [1.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 1
      evidence: $a=-\dfrac12$일 때 조건 (가)와 (나)를 모두 만족시키는 원이 존재한다고 가정한다고 적었다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 중심 $(c,c)$, 반지름 $r$로 두고 $f(x)=x^4+(5-2c)x^2-2cx+(2c^2-4c+4-r^2)$을 얻어 $f(x)=0$의 실근이 오직 $x=-\dfrac12$ 하나임을 밝혔다.
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 사차함수의 개형에서 $f(x)>0\ \left(x\ne-\dfrac12\right)$이므로 $x=-\dfrac12$에서 극소이고 $f'\left(-\dfrac12\right)=0$이어야 함을 적었다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.R2
      mark_type: R
      points: 3
      evidence: $f'\left(-\dfrac12\right)=-\dfrac{11}{2}$을 계산해 $f'\left(-\dfrac12\right)=0$과 모순임을 보이고 결론을 적었다.
      depends_on: [1.M2]
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 귀류법을 사용하지 않은 다른 증명
      effect: zero
      value: 0
    - code: D1-2
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    만약 $a\ne-\dfrac12$이면 위의 조건 (가)와 (나)를 모두 만족시키는 원이 존재함을 보이시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a=0$이면 원점 중심·반지름 2인 원. $a\ne0$이면 P에서의 접선 $l$에 수직인 직선 $l'$의 기울기 $-\dfrac{1}{2a}\ne1$이므로 $l'$과 $y=x$의 교점 Q가 있고, 중심 Q·반지름 $\overline{\mathrm{PQ}}$인 원은 $l$에 P에서 접해 곡선과 P에서만 만난다.
    steps:
    - {id: 2a, content: '$a=0$: $x^2+y^2=4$ / $a\ne0$: $l'':y-b=-\dfrac{1}{2a}(x-a)$와 $y=x$의 교점 Q, 반지름 $\overline{\mathrm{PQ}}$', criteria: [2.B1, 2.M1, 2.R1]}
    hint_ladder:
    - 원이 곡선과 P에서만 만나려면 P에서 같은 접선을 가지면 좋겠다. 원의 중심은 어디에 있어야 하는가?
    - P에서의 법선이 $y=x$와 평행해지는 경우는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2024학년도 선행학습 영향평가 자체평가보고서 p.142~143(PDF p.144~145) 문항 해설 (2)
    steps:
    - id: 2b-1
      content: |
        다음과 같이 $a=0$인 경우와 $a\ne0$인 경우로 나누어 생각한다. 먼저, $a=0$이라면 원점 O를 중심으로 하고 반지름의 길이가 2인 원은 곡선 $y=x^2+2$와 정확히 한 점 $\mathrm{P}(0,2)$에서 만난다. 게다가 원점 O는 직선 $y=x$ 위에 있으므로 이 원은 조건 (가)와 (나)를 모두 만족한다. (2점) [그림]
      criteria: [2.B1]
    - id: 2b-2
      content: |
        이제 $a\ne0$인 경우를 생각하자. 함수 $y=x^2+2$를 미분하면 $y'=2x$이므로 곡선 $y=x^2+2$ 위의 점 $\mathrm{P}(a,b)$에서의 접선 $l$의 방정식은
        $$y-b=2a(x-a)$$
        이다. 여기서 기울기 $2a$는 $0$이 아니므로 점 P를 지나고 $l$에 수직인 직선 $l'$의 방정식은
        $$y-b=-\dfrac{1}{2a}(x-a)$$
        이다. 전제조건에서 $a\ne-\dfrac12$이므로 $l'$의 기울기 $-\dfrac{1}{2a}$은 $1$이 아니고, 따라서 $l'$은 직선 $y=x$와 평행하지 않고 한 점 Q에서 만난다. (4점) [그림]
      criteria: [2.M1]
    - id: 2b-3
      content: |
        이때, 중심이 점 Q이고 반지름의 길이가 $\overline{\mathrm{PQ}}$인 원을 생각해보자. 우선 원의 중심 Q가 직선 $y=x$ 위에 있으므로 조건 (가)를 만족한다. 또한 직선 $l$과 선분 PQ는 점 P에서 만나고 서로 수직이므로 직선 $l$은 원의 점 P에서의 접선이기도 하다. 오른쪽 그림과 같이 원과 곡선 $y=x^2+2$는 직선 $l$을 기준으로 점 P를 제외하고 서로 반대쪽에 위치하므로 원과 곡선 $y=x^2+2$ 모두 직선 $l$과의 교점이 점 P로 유일하다. 따라서 조건 (나)를 만족한다. (4점)
      criteria: [2.R1]
  - id: S2-ALT1
    audience: ALT
    method_no: 2
    key_idea: 검산 메모(공식 해설 아님) — 공식 구성의 원은 $a<-\dfrac12$에서 곡선과 P 이외의 두 점에서도 만나며, 이때 조건을 만족하는 원은 존재하지 않는다.
    steps:
    - id: 2c-1
      content: |
        [검산 메모] 원이 곡선과 P에서만 만나려면 P에서 곡선에 접해야 한다(가로지르면 닫힌곡선인 원이 곡선의 안쪽과 바깥쪽을 오가므로 다른 교점이 생김). 따라서 $a\ne0$이면 중심은 법선 $l'$ 위에 있어야 하고, (가)에서 중심은 공식 해설의 점 $\mathrm{Q}\left(\dfrac{a(2a^2+5)}{2a+1},\ \dfrac{a(2a^2+5)}{2a+1}\right)$로 유일하다.
        이 원과 곡선의 교점 방정식은 $(x-a)^2\left\{(2a+1)x^2+2a(2a+1)x+2a^3+3a^2+5\right\}=0$ 꼴이 되고, 둘째 인수의 판별식은 $-4(2a+1)^3(2a^2+5)$이다. 따라서 $a>-\dfrac12$이면 교점은 P뿐이지만, $a<-\dfrac12$이면 다른 교점이 두 개 생긴다. 예) $a=-1$: $\mathrm{Q}(7,7)$, $r^2=80$이고 교점 방정식은 $(x+1)^2(x^2-2x-6)=0$으로 $x=1\pm\sqrt7$에서도 만난다.
        즉 「원과 곡선이 $l$을 기준으로 반대쪽」이라는 공식 해설의 주장은 $a<-\dfrac12$에서 성립하지 않으며(이때 Q가 $l$에 대해 곡선과 같은 쪽), 문항 (2)의 명제는 $a>-\dfrac12$인 경우에만 참이다.
      criteria: [2.M1, 2.R1]
