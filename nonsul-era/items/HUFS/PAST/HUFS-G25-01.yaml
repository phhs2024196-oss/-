stimuli: []

stem: |
  자연수 $n$에 대한 다음의 명제가 모든 자연수 $n$에 대하여 성립함을 수학적 귀납법으로 증명하시오.

  [상자] 중심이 원점이고 반지름의 길이가 $45^n$인 원 위에는 $x$좌표와 $y$좌표가 모두 자연수인 점이 있다.

subparts:
- id: '1'
  stem: |
    위 명제가 모든 자연수 $n$에 대하여 성립함을 수학적 귀납법으로 증명하시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $45^2=27^2+36^2$이고, $(45^k)^2=a^2+b^2$이면 양변에 $45^2$을 곱해 $(45^{k+1})^2=(45a)^2+(45b)^2$.
    steps:
    - {id: 1a, content: '$n=1$: $(27,36)$. $n=k\Rightarrow n=k+1$: $(a,b)\mapsto(45a,45b)$', criteria: [1.B1, 1.M1, 1.R1]}
    hint_ladder:
    - $45=3^2\times5$이고 $5^2=3^2+4^2$이다.
    - 원 $x^2+y^2=r^2$ 위의 점 $(a,b)$를 $45$배 하면 어느 원 위의 점이 되는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 선행학습 영향평가 자체평가보고서 p.149-150 문항 해설
    steps:
    - id: 1b-1
      content: |
        문제에서 주어진 자연수 $n$에 대한 명제를 $p(n)$이라고 하자.

        (i) $n=1$일 때
        $$(45^n)^2=45^2=3^4\times5^2=3^4\times(3^2+4^2)=(3^2\times3)^2+(3^2\times4)^2=27^2+36^2$$
        이므로 점 $(27,36)$은 원 $x^2+y^2=45^2$ 위의 점이다. 따라서 명제 $p(n)$은 $n=1$일 때 성립한다. (3점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (ii) $n=k\ (k\ge1)$일 때 명제 $p(n)$이 성립한다고 가정하면
        $$(45^k)^2=a^2+b^2\qquad\cdots(1)$$
        을 만족시키는 두 자연수 $a$와 $b$가 존재한다. (2점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $n=k+1$일 때,
        $$(45^{k+1})^2=(45^k)^2\times45^2=(a^2+b^2)\times45^2=(45a)^2+(45b)^2$$
        ((1)에 의해) 이 성립하므로 $(45a,45b)$는 $x$좌표와 $y$좌표가 모두 자연수인 원 $x^2+y^2=(45^{k+1})^2$ 위의 점이 된다. 따라서 명제 $p(n)$은 $n=k+1$일 때도 성립한다. (5점)

        그러므로 (i)과 (ii)에 의해 명제 $p(n)$은 모든 자연수 $n$에 대하여 성립한다.
      criteria: [1.R1]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 2025학년도 선행학습 영향평가 자체평가보고서 p.150 [별해]
    key_idea: 공식 별해 — $(a^2+b^2)(27^2+36^2)=(27a+36b)^2+(36a-27b)^2=(-27a+36b)^2+(36a+27b)^2$를 이용해 새 점을 만든다.
    steps:
    - id: 2b-1
      content: |
        (i) $n=1$일 때 $(45^n)^2=45^2=27^2+36^2\ \cdots(1)$이므로 점 $(27,36)$은 원 $x^2+y^2=45^2$ 위의 점이다. (3점)

        (ii) $n=k\ (k\ge1)$일 때 성립한다고 가정하면 $(45^k)^2=a^2+b^2\ \cdots(2)$를 만족시키는 두 자연수 $a$, $b$가 존재한다. (2점)
    - id: 2b-2
      content: |
        $n=k+1$일 때 (2), (1)에 의해
        $$(45^{k+1})^2=(a^2+b^2)\times(27^2+36^2)=(27a)^2+(27b)^2+(36a)^2+(36b)^2=(27a+36b)^2+(36a-27b)^2\ \cdots(3)$$
        $$=(-27a+36b)^2+(36a+27b)^2\ \cdots(4)$$
        이다. 만약 $36a-27b\neq0$이라면 (3)에 의해 $c=27a+36b$, $d=\lvert36a-27b\rvert$라 하고, 만약 $36a-27b=0$이면 (4)에 의해 $c=\lvert-27a+36b\rvert$, $d=36a+27b$라 하면 점 $(c,d)$는 $x$좌표와 $y$좌표가 모두 자연수인 원 $x^2+y^2=(45^{k+1})^2$ 위의 점이 된다. (5점)

        그러므로 (i)과 (ii)에 의해 명제 $p(n)$은 모든 자연수 $n$에 대하여 성립한다.
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: |
        [도입] $n=1$일 때 $45^2=27^2+36^2$ 등으로 원 $x^2+y^2=45^2$ 위의 자연수 좌표의 점(예: $(27,36)$ 또는 $(36,27)$)을 제시했다.
      accept: ['$(36,27)$을 제시해도 된다(채점 유의사항 2)']
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        [전개] $n=k$일 때 명제가 성립한다고 가정하고 $(45^k)^2=a^2+b^2$인 자연수 $a$, $b$의 존재를 식으로 적었다.
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: |
        [전개] $(45^{k+1})^2=(45a)^2+(45b)^2$ 등으로 $n=k+1$일 때 원 위의 자연수 좌표의 점을 구체적으로 제시하고 명제가 성립함을 밝혔다. [결론(0점)] 모든 자연수 $n$에 대하여 성립한다고 결론을 냈다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 수학적 귀납법이 아닌 증명(채점 유의사항 1)
      effect: zero
      value: 0
    - code: D1-2
      condition: 단순한 계산 실수와 같은 사소한 실수(건당, 채점 유의사항 3)
      effect: minus
      value: 1
