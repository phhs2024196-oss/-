    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: |
        [도입] 곡선 $y=f(x)$ 위의 점 중에서 $y$좌표가 $0$ 이상의 정수인 점의 개수가 $7+9=16$임을 구간별로 확인했다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        [전개] $y$좌표가 음의 정수인 점이 $16$개가 될 조건을 $-17\le-\left(\frac15\right)^{3+a}+8<-16$ (또는 $24<5^{-(3+a)}\le25$)으로 찾았다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        [결론] $5^x$의 증가와 $a$가 정수임을 써서 $a=-5$를 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
