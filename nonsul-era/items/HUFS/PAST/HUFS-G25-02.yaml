stimuli: []

stem: |
  함수
  $$f(x)=\begin{cases}2^x & (x<3)\\ \left(\dfrac15\right)^{x+a}-\left(\dfrac15\right)^{3+a}+8 & (x\ge3)\end{cases}$$
  에 대하여 곡선 $y=f(x)$ 위의 점 중에서 $y$좌표가 정수인 점의 개수가 $32$일 때, 정수 $a$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    정수 $a$의 값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '-5', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $y\ge0$인 정수 점은 $7+9=16$개로 고정. 나머지 $16$개가 음의 정수이려면 점근선이 $[-17,-16)$ 안, 즉 $24<5^{-(3+a)}\le25$에서 $a=-5$.
    steps:
    - {id: 1a, content: '$16+16=32$, $-17\le8-5^{-(3+a)}<-16\Rightarrow-(3+a)=2\Rightarrow a=-5$', criteria: [1.B1, 1.M1, 1.A1]}
    hint_ladder:
    - $x<3$에서 $2^x$가 가지는 정수 값은 몇 개인가?
    - $x\ge3$인 부분의 그래프는 $y=8$에서 출발해 어떤 직선으로 다가가는가?
    - 음의 정수 $-1,-2,\cdots,-16$만 가지려면 점근선은 어디에 있어야 하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 선행학습 영향평가 자체평가보고서 p.151-152 문항 해설
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$의 그래프는 [그림]과 같다. $x<3$일 때 그래프의 점근선은 $y=0$, $x\ge3$일 때 그래프의 점근선은 $y=-\left(\dfrac15\right)^{3+a}+8$이다.

        [그림] 해설 그림: $x<3$에서 $y=2^x$가 점 $(0,1)$을 지나 $(3,8)$ 직전까지 증가하고, $x\ge3$에서 $(3,8)$에서 급격히 감소하여 점선 점근선 $y=-\left(\frac15\right)^{3+a}+8$에 가까워지는 곡선.

        곡선 $y=f(x)$ 위의 점 중에서 $y$좌표가 $0$ 이상의 정수인 점은

        (i) $x<3$일 때 $y$좌표가 각각 $1,2,3,\cdots,7$인 점 $7$개

        (ii) $x\ge3$일 때 $y$좌표가 각각 $8,7,6,\cdots,1,0$인 점 $9$개

        이므로 개수는 $7+9=16$이다. (5점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        곡선 $y=f(x)$ 위의 점 중에서 $y$좌표가 정수인 점의 개수는 $32$이므로 곡선 $y=f(x)$ 위의 점 중에서 $y$좌표가 음의 정수인 점의 개수는 $32-16=16\ \cdots(1)$이다. 앞에 주어진 함수 $f(x)$의 그래프를 참고하면 곡선
        $$y=\left(\frac15\right)^{x+a}-\left(\frac15\right)^{3+a}+8=\left(\frac15\right)^{a}\times\left(\frac15\right)^{x}-\left\{\left(\frac15\right)^{3+a}-8\right\}$$
        은 $x$의 값이 증가하면 $y$의 값은 감소하는 함수이고 점근선은 직선 $y=-\left(\dfrac15\right)^{3+a}+8$이다. (1)에 의해
        $$-17\le-\left(\frac15\right)^{3+a}+8<-16\quad\text{즉,}\quad24<5^{-(3+a)}\le25\qquad\cdots(2)$$
        가 된다. (5점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        지수함수 $y=5^x$은 $x$의 값이 증가하면 $y$의 값도 증가하는 함수이고 $a$는 정수이므로 (2)에 의해
        $$-(3+a)=2\quad\text{즉,}\quad a=-5$$
        이다. (2점)
      criteria: [1.A1]
