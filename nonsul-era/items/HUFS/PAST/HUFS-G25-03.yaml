stimuli:
- label: 그림
  body: |
    [그림] 좌표평면에 직사각형 $\mathrm{ABCD}$($\mathrm{A}(-1,2)$, $\mathrm{D}(1,2)$가 위, $\mathrm{B}(-1,-2)$, $\mathrm{C}(1,-2)$가 아래)와 곡선 $y=f(x)$가 그려져 있다. 곡선은 $x=-1$, $x=a$($-1$과 $0$ 사이), $x=1$에서 $x$축과 만나며, 직사각형 안에서 $-1<x<a$ 부분은 위로 볼록하게 $x$축 위로, $a<x<1$ 부분은 $x$축 아래로 내려갔다가 $x=1$에서 다시 올라온다. 곡선 위쪽 부분($S_1$)은 흰색, 아래쪽 부분($S_2$)은 회색으로 칠해져 있다. 축에는 $2$, $-2$, $-1$, $1$, $\mathrm{O}$ 표시.

stem: |
  오른쪽 그림과 같이 꼭짓점이 $\mathrm{A}(-1,2)$, $\mathrm{B}(-1,-2)$, $\mathrm{C}(1,-2)$, $\mathrm{D}(1,2)$인 직사각형의 네 변으로 둘러싸인 도형은 함수 $f(x)=(x+1)(x-a)(x-1)$의 그래프에 의해 두 부분으로 나누어진다. 나누어진 부분 중 위쪽과 아래쪽의 넓이를 각각 $S_1$, $S_2$라고 할 때 $S_1:S_2=5:4$이다. 이때 상수 $a$의 값을 구하시오. (단, $-1<a<0$)

subparts:
- id: '1'
  stem: |
    상수 $a$의 값을 구하시오.
  points: 13
  depends_on: []
  answer: {kind: value, value: '-1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S_1=\frac59\times8=\frac{40}{9}$, $S_1=\int_{-1}^1\{2-f(x)\}dx=4-\frac{4a}{3}$.
    steps:
    - {id: 1a, content: '$4-\dfrac{4a}{3}=\dfrac{40}{9}\Rightarrow a=-\dfrac13$', criteria: [1.B1, 1.M1, 1.A1]}
    hint_ladder:
    - $S_1+S_2$는 무엇과 같은가?
    - 위쪽 부분은 곡선과 어떤 세 직선으로 둘러싸여 있는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 선행학습 영향평가 자체평가보고서 p.153-154 문항 해설
    steps:
    - id: 1b-1
      content: |
        직사각형 $\mathrm{ABCD}$의 네 변으로 둘러싸인 도형은 곡선 $y=f(x)$에 의해 두 부분으로 나누어지므로
        $$S_1+S_2=\text{직사각형 ABCD의 넓이}=8$$
        이다. 게다가 $S_1:S_2=5:4$이므로
        $$S_1=\frac{5}{5+4}\times8=\frac{40}{9}\qquad\cdots(1)$$
        이다. (4점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        한편 두 부분 중 위쪽 부분은 곡선 $y=f(x)$와 세 직선 $y=2$, $x=-1$, $x=1$로 둘러싸인 도형이므로
        $$\begin{aligned}S_1&=\int_{-1}^{1}\{2-f(x)\}dx=\int_{-1}^{1}\{2-(x^3-ax^2-x+a)\}dx\\&=\int_{-1}^{1}\{(-x^3+x)+(ax^2+2-a)\}dx\\&=2\int_{0}^{1}(ax^2+2-a)dx\\&=2\left[\frac a3x^3+(2-a)x\right]_0^1=4-\frac{4a}{3}\qquad\cdots(2)\end{aligned}$$
        (곡선 $y=-x^3+x$와 $y=ax^2+2-a$는 각각 원점과 $y$축에 대칭이므로) 이다. (7점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        따라서 (1)과 (2)에 의해
        $$4-\frac{4a}{3}=\frac{40}{9}\quad\text{즉,}\quad a=-\frac13$$
        이다. (2점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: |
        [도입] $S_1$과 $S_2$의 비와 $S_1+S_2=8$을 이용하여 $S_1=\frac{40}{9}$을 찾았다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: |
        [전개] 정적분을 이용하여 삼차함수의 곡선과 세 직선으로 둘러싸인 도형의 넓이 $S_1=\int_{-1}^{1}\{2-f(x)\}dx=4-\frac{4a}{3}$을 구했다.
      not_penalized:
      - 그래프가 원점 또는 $y$축 대칭인 함수에 관한 정적분의 성질을 사용하지 않아도 된다(채점 유의사항 2)
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        [결론] 두 가지 방법으로 구한 $S_1$을 비교하여 $a=-\frac13$을 구했다.
      depends_on: [1.B1, 1.M1]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 타당한 설명이 없이 답만 기술(채점 유의사항 4)
      effect: zero
      value: 0
    - code: D1-2
      condition: 단순한 계산 실수와 같은 사소한 실수(건당, 채점 유의사항 3)
      effect: minus
      value: 1
