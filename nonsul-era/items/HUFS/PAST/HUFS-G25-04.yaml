stimuli: []

stem: |
  다항함수 $f(x)$가 다음 조건을 모두 만족시킬 때, 상수 $a$의 값을 구하시오. (단, $a>0$)

  (가) $f(x)$는 최고차항의 계수가 $1$인 삼차함수이다.

  (나) $f(a)=0$

  (다) 모든 실수 $x$에 대하여 $(x-2a)f(x)\ge0$

  (라) $f(x)$의 극솟값은 $-500$이다.

subparts:
- id: '1'
  stem: |
    상수 $a$의 값을 구하시오.
  points: 14
  depends_on: []
  answer: {kind: value, value: '15', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (다)에서 $f(x)=(x-a)^2(x-2a)$, 극솟값 $f\left(\frac{5a}{3}\right)=-\frac{4a^3}{27}=-500$.
    steps:
    - {id: 1a, content: '$f(x)=(x-a)^2(x-2a)$, $-\dfrac{4a^3}{27}=-500\Rightarrow a=15$', criteria: [1.B1, 1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - (가), (나)에서 $f(x)$를 인수 $(x-a)$를 써서 나타내 보자.
    - $(x-2a)f(x)$는 사차식이다. 항상 $0$ 이상이면 근은 어떠해야 하는가?
    - $a<x<2a$에서 나머지 이차식의 부호는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 선행학습 영향평가 자체평가보고서 p.155 문항 해설
    steps:
    - id: 1b-1
      content: |
        조건 (가)와 (나)에 의해
        $$f(x)=(x-a)(x^2+bx+c)\quad(b,\ c\text{는 상수})\qquad\cdots(1)$$
        이다. (2점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        그러면 조건 (다)에 의해
        $$\text{모든 실수 }x\text{에 대하여 }(x-2a)(x-a)(x^2+bx+c)\ge0\qquad\cdots(2)$$
        이 성립하는데 사차함수 그래프의 개형으로부터
        $$\text{방정식 }(x-2a)(x-a)(x^2+bx+c)=0\text{의 해는 }a\text{와 }2a\text{뿐이다.}\qquad\cdots(3)$$
        (4점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        또한, $a<x<2a$인 모든 $x$에 대하여 $(x-a)(x-2a)<0$이므로 (2)와 (3)에 의해 $a<x<2a$인 모든 $x$에 대하여 $x^2+bx+c<0$이다. 따라서 이차함수 그래프의 개형으로부터
        $$\text{방정식 }x^2+bx+c=0\text{은 실수 전체의 집합에서 서로 다른 2개의 해를 갖는다.}\qquad\cdots(4)$$
        이제 (3)과 (4)에 의해 $x^2+bx+c=(x-a)(x-2a)$이고, (1)로부터
        $$f(x)=(x-a)^2(x-2a)=x^3-4ax^2+5a^2x-2a^3$$
        이다. (3점)
      criteria: [1.M2]
    - id: 1b-4
      content: |
        $f(x)$를 미분하면
        $$f^{\prime}(x)=3x^2-8ax+5a^2=(3x-5a)(x-a)$$
        이므로 삼차함수 그래프의 개형으로부터 $f(x)$는 $x=a$에서 극댓값, $x=\dfrac{5a}{3}$에서 극솟값을 갖는다. 그러면 조건 (라)에 의해
        $$f\left(\frac{5a}{3}\right)=-500\quad\text{즉,}\quad-\frac{4a^3}{27}=-500$$
        이 되고, $a=15$이다. (5점)
      criteria: [1.A1]
