intent: 부등식 조건 $(x-2a)f(x)\ge0$을 사차함수 그래프의 개형으로 해석하여 삼차함수를 $f(x)=(x-a)^2(x-2a)$로 결정하고, 극솟값 조건으로 $a$를 구하는 능력을 본다.
key_idea: '$(x-2a)(x-a)(x^2+bx+c)\ge0$이 항상 성립하려면 근이 $a$, $2a$뿐이고 $a<x<2a$에서 $x^2+bx+c<0$이므로 $x^2+bx+c=(x-a)(x-2a)$. $f\left(\frac{5a}{3}\right)=-\frac{4a^3}{27}=-500$에서 $a=15$.'
stuck: 조건 (다)에서 이차식 $x^2+bx+c$가 $(x-a)(x-2a)$와 같아야 함을 이끄는 단계(근이 $a$, $2a$뿐임과 $a<x<2a$에서의 부호)
