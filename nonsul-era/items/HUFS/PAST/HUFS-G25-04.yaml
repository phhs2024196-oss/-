    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        [도입] 조건 (가)와 (나)로부터 $f(x)=(x-a)(x^2+bx+c)$로 나타냈다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        [전개] 조건 (다)를 $(x-2a)(x-a)(x^2+bx+c)\ge0$으로 쓰고, 사차함수 그래프의 개형으로부터 방정식의 해가 $a$와 $2a$뿐임을 밝혔다.
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        [전개] $a<x<2a$에서 $x^2+bx+c<0$임을 근거로 $x^2+bx+c=(x-a)(x-2a)$, 즉 $f(x)=(x-a)^2(x-2a)$를 도출했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        [결론] $f^{\prime}(x)=(3x-5a)(x-a)$에서 극솟값 $f\left(\frac{5a}{3}\right)=-\frac{4a^3}{27}=-500$을 얻고 $a=15$를 구했다.
      depends_on: [1.M2]
      steps: [1b-4]
