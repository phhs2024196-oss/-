      accept: ['도입 단계에서 함수 $f(x)$의 그래프를 통해 연속임을 보여도 된다(채점 유의사항 2)']
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: |
        [전개] $g$가 $x=a$에서 연속일 조건 $2f(a)=6n-f(a)$, 즉 $f(a)=2n$을 얻고, 정수 $n$이 조건을 만족시킨다는 것이 곡선 $y=f(x)$와 직선 $y=2n$의 교점의 개수가 $4$라는 것임을 보였다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        [결론] $0<2n<8$에서 정수 $n=1,2,3$을 모두 찾고 합 $6$을 구했다.
      depends_on: [1.M1]
      not_penalized:
      - 결론 단계에서 함수 $f(x)$의 그래프를 그리지 않아도 된다(채점 유의사항 2)
      steps: [1b-3]
