stimuli: []

stem: |
  함수 $f(x)=\begin{cases}3x^2+12x+8 & (x<0)\\ 2x^2-8x+8 & (x\ge0)\end{cases}$에 대하여 다음 조건을 만족시키는 모든 정수 $n$의 값의 합을 구하시오.

  [상자] 함수 $g(x)=\begin{cases}2f(x) & (x<a)\\ 6n-f(x) & (x\ge a)\end{cases}$이 모든 실수 $x$에서 연속이 되도록 하는 상수 $a$의 개수는 $4$이다.

subparts:
- id: '1'
  stem: |
    조건을 만족시키는 모든 정수 $n$의 값의 합을 구하시오.
  points: 16
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g$ 연속 ⟺ $f(a)=2n$. 교점 4개 ⟺ $0<2n<8$ → $n=1,2,3$.
    steps:
    - {id: 1a, content: '$f$ 연속, $f(a)=2n$의 해 4개 ⟺ $0<2n<8$, $1+2+3=6$', criteria: [1.B1, 1.M1, 1.A1]}
    hint_ladder:
    - $f(x)$는 $x=0$에서 연속인가?
    - $g(x)$가 $x=a$에서 연속일 조건을 식으로 쓰면?
    - 「$a$의 개수」는 어떤 두 그래프의 교점 개수인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 선행학습 영향평가 자체평가보고서 p.156 문항 해설
    steps:
    - id: 1b-1
      content: |
        먼저 함수 $f(x)$는 $0$이 아닌 모든 실수 $x$에서 연속이다. 또한
        $$\lim_{x\to0-}f(x)=\lim_{x\to0-}(3x^2+12x+8)=8,\quad\lim_{x\to0+}f(x)=\lim_{x\to0+}(2x^2-8x+8)=8,\quad f(0)=8$$
        이므로 함수 $f(x)$는 $x=0$에서도 연속이다. (3점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        따라서 함수 $f(x)$는 모든 실수 $x$에서 연속이므로 함수 $g(x)$는 $a$가 아닌 모든 실수 $x$에서 연속이다. 또한
        $$\lim_{x\to a-}g(x)=\lim_{x\to a-}2f(x)=2f(a),\quad\lim_{x\to a+}g(x)=\lim_{x\to a+}\{6n-f(x)\}=6n-f(a),\quad g(a)=6n-f(a)$$
        이므로 함수 $g(x)$가 모든 실수 $x$에서 연속이 되기 위한 상수 $a$의 조건은
        $$2f(a)=6n-f(a)\quad\text{즉,}\quad f(a)=2n$$
        이다. 정리하면, 정수 $n$이 문제의 조건을 만족시킨다는 것은
        $$\text{곡선 }y=f(x)\text{와 직선 }y=2n\text{이 만나는 점의 개수가 }4\qquad\cdots(1)$$
        인 것과 같다. (8점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        함수 $f(x)$의 그래프는 [그림]과 같아서 정수 $n$이 조건 (1)을 만족한다는 것은
        $$0<2n<8$$
        이라는 것을 알 수 있다. 그러므로 문제의 조건을 만족하는 정수 $n$은 $1$, $2$, $3$이고, 이러한 모든 정수 $n$의 값의 합은
        $$1+2+3=6$$
        이다. (5점)

        [그림] 해설 그림: $x<0$에서 $x$축 아래로 내려갔다가($x=-2$에서 최소 $-4$) 올라와 점 $(0,8)$에 이르고, $x\ge0$에서 $(0,8)$에서 내려와 $x$축에 접한 뒤($x=2$) 다시 올라가는 곡선 $y=f(x)$.
      criteria: [1.A1]
