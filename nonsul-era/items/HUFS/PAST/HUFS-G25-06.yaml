intent: 사인함수의 주기·최대·최소를 이용해 직선 $y=a^2$과의 교점 개수를 경우별로 세고, 교점 5개 조건과 $c\le10$을 만족시키는 자연수 $(a,b,c)$를 빠짐없이 찾는 능력을 본다.
key_idea: '$a^2$이 $a+c$, $c$, $-a+c$와 모두 다르면 교점은 $0$ 또는 $2b$개(짝수). 따라서 $a^2=a+c,\ b=5$ 또는 $a^2=c,\ b=3$ 또는 $a^2=-a+c,\ b=5$이고 $c\le10$에서 7쌍, $abc$의 최댓값 $90$, 최솟값 $3$.'
stuck: 교점 개수 5(홀수)가 되려면 직선 $y=a^2$이 최댓값·최솟값·중심선 중 하나를 지나야 함을 알아내고, 각 경우의 교점 수($b$, $2b-1$, $b$)를 정확히 세는 단계
