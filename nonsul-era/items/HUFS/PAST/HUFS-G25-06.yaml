stimuli: []

stem: |
  세 자연수 $a$, $b$, $c$에 대하여 함수 $f(x)=a\sin bx+c$가 다음 조건을 모두 만족시킬 때, $a\times b\times c$의 최댓값과 최솟값을 각각 구하시오.

  (가) $f(0)\le10$

  (나) $0<x<2\pi$일 때, 방정식 $f(x)=a^2$의 해의 개수는 $5$이다.

subparts:
- id: '1'
  stem: |
    $a\times b\times c$의 최댓값과 최솟값을 각각 구하시오.
  points: 17
  depends_on: []
  answer: {kind: value, value: '[90, 3]', equivalents: ['최댓값 90, 최솟값 3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 교점 5개(홀수)이려면 $a^2\in\{a+c,\ c,\ -a+c\}$이고 각각 $b=5,3,5$. $c\le10$에서 7쌍, $abc\in\{20,90,3,24,81,10,60\}$.
    steps:
    - {id: 1a, content: '최댓값 $3\cdot5\cdot6=90$, 최솟값 $1\cdot3\cdot1=3$', criteria: [1.B1, 1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $0<x<2\pi$에 사인 곡선이 몇 주기 들어가는가?
    - 직선이 최댓값·최솟값·중심선이 아닌 높이를 지나면 교점 개수는 짝수인가 홀수인가?
    - 중심선 $y=c$와는 $0<x<2\pi$에서 몇 번 만나는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 선행학습 영향평가 자체평가보고서 p.157-158 문항 해설
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$에 $x=0$을 대입을 하면 $f(0)=c$이고, 조건 (가)는
        $$c\le10\qquad\cdots(1)$$
        가 된다. 또한, 조건 (나)는
        $$0<x<2\pi\text{일 때 곡선 }y=f(x)\text{와 직선 }y=a^2\text{이 만나는 점의 개수가 }5\qquad\cdots(2)$$
        가 된다. (2점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        함수 $f(x)=a\sin bx+c$의 주기는 $\dfrac{2\pi}{b}$이고, 최댓값과 최솟값은 각각 $a+c$, $-a+c$이다. 만약 $a^2$이 $a+c$, $c$, $-a+c$와 모두 다르다면 $0<x<2\pi$일 때 곡선 $y=f(x)$와 직선 $y=a^2$이 만나는 점의 개수는 $0$ 또는 $2b$가 되고 조건 (2)는 성립하지 않게 된다. 따라서 조건 (2)가 성립한다는 것은
        $$a^2=a+c\text{이고 }b=5\quad\text{또는}\quad a^2=c\text{이고 }b=3\quad\text{또는}\quad a^2=-a+c\text{이고 }b=5\qquad\cdots(3)$$
        인 것과 같다. (6점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        이제 조건 (1)과 (3)을 만족시키는 $a$, $b$, $c$를 모두 찾으면 다음과 같다.
        $$\begin{cases}a=2,\ b=5,\ c=2\\ a=3,\ b=5,\ c=6\\ a=1,\ b=3,\ c=1\\ a=2,\ b=3,\ c=4\\ a=3,\ b=3,\ c=9\\ a=1,\ b=5,\ c=2\\ a=2,\ b=5,\ c=6\end{cases}$$
        (7점)
      criteria: [1.M2]
    - id: 1b-4
      content: |
        그러므로 $a\times b\times c$의 최댓값과 최솟값은 각각 $90$, $3$이다. (2점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        [도입] 조건 (가)는 $c\le10$이고, 조건 (나)는 $0<x<2\pi$일 때 곡선 $y=f(x)$와 직선 $y=a^2$이 만나는 점의 개수가 $5$라는 것임을 적었다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        [전개] 주기 $\frac{2\pi}{b}$와 최댓값·최솟값을 이용해 교점 5개의 조건이 $a^2=a+c,\ b=5$ 또는 $a^2=c,\ b=3$ 또는 $a^2=-a+c,\ b=5$임을 밝혔다.
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 7
      evidence: |
        [전개] 조건 (가)와 (나)를 모두 만족시키는 자연수 $(a,b,c)$ 7쌍을 빠짐없이 찾았다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        [결론] $a\times b\times c$의 최댓값 $90$과 최솟값 $3$을 각각 구했다.
      depends_on: [1.M2]
      steps: [1b-4]
    deductions:
