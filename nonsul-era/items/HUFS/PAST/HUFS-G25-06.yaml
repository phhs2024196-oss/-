      condition: 타당한 설명이 없이 답만 기술(채점 유의사항 3)
      effect: zero
      value: 0
    - code: D1-2
      condition: 단순한 계산 실수와 같은 사소한 실수(건당, 채점 유의사항 2)
      effect: minus
      value: 1
