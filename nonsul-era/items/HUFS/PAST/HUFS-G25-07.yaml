stimuli: []

stem: |
  점 $\mathrm{P}(-2,0)$을 지나는 직선 $l$이 곡선 $y=\dfrac{\lvert4x^2+3x-1\rvert}{4}$과 서로 다른 세 점에서 만날 때, 직선 $l$과 곡선 $y=\dfrac{\lvert4x^2+3x-1\rvert}{4}$이 만나는 모든 점의 $x$좌표의 합을 구하시오.

subparts:
- id: '1'
  stem: |
    직선 $l$과 곡선이 만나는 모든 점의 $x$좌표의 합을 구하시오.
  points: 18
  depends_on: []
  answer: {kind: value, value: '-1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 뒤집힌 부분에 접하는 접선 $l:y=\frac14x+\frac12$(접점 $x=-\frac12$), 나머지 교점의 합은 $4x^2+2x-3=0$에서 $-\frac12$.
    steps:
    - {id: 1a, content: '$-\dfrac12+\left(-\dfrac12\right)=-1$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 곡선의 그래프에서 $x$축 아래 부분이 뒤집힌 구간은 어디인가?
    - $\mathrm{P}$를 지나는 직선이 세 점에서 만나려면 어느 부분에 접해야 하는가?
    - 나머지 두 교점은 어떤 이차방정식의 근인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 선행학습 영향평가 자체평가보고서 p.159-160 문항 해설
    steps:
    - id: 1b-1
      content: |
        곡선 $y=\dfrac{\lvert4x^2+3x-1\rvert}{4}$의 그래프는 [그림 1]과 같다. 직선 $l$은 점 $\mathrm{P}(-2,0)$을 지나고 곡선 $y=\dfrac{\lvert4x^2+3x-1\rvert}{4}$과 서로 다른 세 점에서 만나므로 직선 $l$은 $-1<x<\dfrac14$일 때 곡선 $y=\dfrac{-(4x^2+3x-1)}{4}$ 위의 한 점 $\mathrm{Q}$에서의 접선이 된다. 함수 $f(x)=\dfrac{-(4x^2+3x-1)}{4}$이라 하고 점 $\mathrm{Q}$의 $x$좌표를 $c$라고 하면 $f^{\prime}(x)=\dfrac{-(8x+3)}{4}$이므로 직선 $l$의 방정식은
        $$y-\frac{-(4c^2+3c-1)}{4}=\frac{-(8c+3)}{4}(x-c)\qquad\cdots(1)$$
        이다. 또한 직선 $l$은 점 $\mathrm{P}(-2,0)$을 지나므로
        $$\frac{4c^2+3c-1}{4}=\frac{-(8c+3)}{4}(-2-c)$$
        가 성립하고 이를 풀면 $c=-\dfrac12$ 또는 $-\dfrac72$이다. 점 $\mathrm{Q}$의 위치에 의해 $-1<c<\dfrac14$이므로 $c=-\dfrac12$이고 (1)로부터 직선 $l$의 방정식은
        $$y=\frac14x+\frac12$$
        이다. (10점)

        [그림 1] 해설 그림: $x$절편 $-1$, $\frac14$ 사이에서 위로 볼록하게 뒤집힌 부분이 있는 W자 모양 곡선 $y=\frac{\lvert4x^2+3x-1\rvert}{4}$과 점 $\mathrm{P}(-2,0)$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        [그림 2]와 같이 직선 $l$과 곡선 $y=\dfrac{\lvert4x^2+3x-1\rvert}{4}$이 만나는 점 중 $\mathrm{Q}$가 아닌 두 점을 $\mathrm{R}$과 $\mathrm{S}$라고 하면 두 점은 곡선 $y=\dfrac{4x^2+3x-1}{4}$ 위에 있다. 두 점 $\mathrm{R}$과 $\mathrm{S}$의 $x$좌표는
        $$\frac14x+\frac12=\frac{4x^2+3x-1}{4}\quad\text{즉,}\quad4x^2+2x-3=0$$
        의 두 근이고, 따라서 두 점 $\mathrm{R}$과 $\mathrm{S}$의 $x$좌표의 합은 $-\dfrac12$이다. (6점)

        [그림 2] 해설 그림: 점 $\mathrm{P}(-2,0)$을 지나는 직선 $l$(빨간색)이 뒤집힌 부분의 점 $\mathrm{Q}$에서 접하고, 왼쪽 가지의 점 $\mathrm{R}$, 오른쪽 가지의 점 $\mathrm{S}$에서 곡선과 만난다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        그러므로 직선 $l$과 곡선 $y=\dfrac{\lvert4x^2+3x-1\rvert}{4}$이 만나는 모든 점의 $x$좌표의 합은
        $$\text{점 Q의 }x\text{좌표}+(\text{점 R의 }x\text{좌표}+\text{점 S의 }x\text{좌표})=-\frac12-\frac12=-1$$
        이다. (2점)
      criteria: [1.A1]
