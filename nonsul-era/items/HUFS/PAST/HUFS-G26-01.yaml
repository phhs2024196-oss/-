stimuli: []

stem: |
  함수 $y=\log_2(x+a)+b$의 그래프와 그 역함수의 그래프가 두 점에서 만난다. 이 두 점의 $x$좌표가 각각 $-1$, $1$일 때, 함수 $y=\log_2(x+a)+b$의 그래프가 직선 $y=3$과 만나는 점의 $x$좌표를 구하시오. (단, $a$, $b$는 상수) (10점)

subparts:
- id: '1'
  stem: |
    함수 $y=\log_2(x+a)+b$의 그래프가 직선 $y=3$과 만나는 점의 $x$좌표를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '9', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 교점은 $y=x$ 위에 있으므로 $\log_2(x+a)+b=x$의 두 근이 $\pm1$이다.
    steps:
    - {id: 1a, content: '$\log_2(a-1)+b=-1$, $\log_2(a+1)+b=1\Rightarrow a=\dfrac53$, $b=\log_2\dfrac34$, $\log_2\dfrac{3x+5}{4}=3\Rightarrow x=9$', criteria: [1.R1, 1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - 증가함수와 그 역함수의 그래프의 교점은 어느 직선 위에 있는가?
    - 두 교점을 그 직선의 식에 대입해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026학년도 선행학습 영향평가 자체평가보고서 p.164 문항 해설(i)~(iii)
    steps:
    - id: 1b-1
      content: |
        (i) 함수 $y=\log_2(x+a)+b$의 그래프와 그 역함수의 그래프의 교점은 함수 $y=\log_2(x+a)+b$의 그래프와 직선 $y=x$의 교점과 같다. (2점)
      criteria: [1.R1]
    - id: 1b-2
      content: |
        (ii) 따라서 방정식 $\log_2(x+a)+b=x$의 두 근이 $x=-1$, $1$이므로 대입하면
        $$\log_2(a-1)+b=-1\ \cdots(1),\qquad \log_2(a+1)+b=1\ \cdots(2)$$
        이다. (1)과 (2)를 연립하면 $\log_2(a+1)-\log_2(a-1)=2$, 즉 $\log_2\dfrac{a+1}{a-1}=2$이므로 $\dfrac{a+1}{a-1}=4$이다. 따라서 $a=\dfrac53$이다. (3점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        이때 $a=\dfrac53$을 (2)에 대입하면 $\log_2\dfrac83+b=1$이므로 $b=1-\log_2\dfrac83=\log_22-\log_2\dfrac83=\log_2\dfrac34$이다. 따라서 주어진 함수는 $y=\log_2\left(x+\dfrac53\right)+\log_2\dfrac34=\log_2\left(\dfrac{3x+5}{4}\right)$이다. (2점)
      criteria: [1.A1]
    - id: 1b-4
      content: |
        (iii) 함수 $y=\log_2\left(\dfrac{3x+5}{4}\right)$의 그래프와 직선 $y=3$이 만나는 점의 $x$좌표는 방정식 $\log_2\left(\dfrac{3x+5}{4}\right)=3$의 근이다. 이 방정식을 풀면 $\dfrac{3x+5}{4}=8$이므로 $x=9$이다. (3점)
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: |
        로그함수의 그래프와 그 역함수의 그래프의 교점이 직선 $y=x$와의 교점과 같다고 적었다(채점기준 도입).
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $x=-1$, $1$을 $\log_2(x+a)+b=x$에 대입한 두 식을 연립해 $a=\dfrac53$을 구했다(채점기준 전개).
      depends_on: [1.R1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $b=\log_2\dfrac34$를 구하고 함수를 $y=\log_2\dfrac{3x+5}{4}$로 나타냈다(채점기준 전개).
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\log_2\dfrac{3x+5}{4}=3$을 풀어 $x=9$를 얻었다(채점기준 결론).
      depends_on: [1.M1]
      steps: [1b-4]
