stimuli:
- label: 조건
  body: |
    (가) $f(x)$의 최고차항의 계수는 $1$이다.

    (나) $f'(1)=f'(3)=0$

    (다) 함수 $\lvert f(x)\rvert$가 $x=a$에서 미분가능하지 않은 실수 $a$의 개수는 $3$이다.

stem: |
  삼차함수 $f(x)$가 다음 조건을 만족시킨다.

  [조건 (가)~(다)]

  이때 $f(0)$이 정수가 되도록 하는 모든 $f(1)$의 값의 합을 구하시오. (12점)

subparts:
- id: '1'
  stem: |
    $f(0)$이 정수가 되도록 하는 모든 $f(1)$의 값의 합을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=x^3-6x^2+9x+C$, 극댓값 $4+C>0$, 극솟값 $C<0$에서 $C\in\{-1,-2,-3\}$.
    steps:
    - {id: 1a, content: '$-4<C<0$, $C=-1,-2,-3$이므로 $f(1)=3,2,1$, 합 $6$', criteria: [1.M1, 1.R1, 1.A1]}
    hint_ladder:
    - $f'(x)$를 인수분해된 꼴로 나타내 보자.
    - $\lvert f(x)\rvert$는 어떤 점에서 뾰족해지는가?
    - 방정식 $f(x)=0$이 서로 다른 세 실근을 가질 조건은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026학년도 선행학습 영향평가 자체평가보고서 p.166 문항 해설(i)~(iii)
    steps:
    - id: 1b-1
      content: |
        (i) 조건 (나)에 의해 상수 $k$에 대하여 $f'(x)=k(x-1)(x-3)=k(x^2-4x+3)\ \cdots(1)$이다. (단, $k\ne0$)
        (1)에 의해 $f(x)=k\left(\dfrac13x^3-2x^2+3x\right)+C$ ($C$는 상수)이고, 조건 (가)에 의해 $\dfrac13k=1$이므로 $k=3$이다. 따라서 $f(x)=x^3-6x^2+9x+C\ \cdots(2)$이다. (5점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (ii) (2)와 조건 (나)에 의해 삼차함수 $f(x)$는 $x=1$에서 극댓값 $f(1)=4+C$, $x=3$에서 극솟값 $f(3)=C$를 가진다.
        조건 (다)에 의해 극댓값 $f(1)=4+C>0$, 극솟값 $f(3)=C<0$이어야 한다. 즉, $-4<C<0\ \cdots(3)$이다. (4점)
        [그림] 해설지 그림: $y=f(x)$(점선)가 $x$축과 세 점에서 만나고, $x$축 아래 부분을 접어 올린 $y=\lvert f(x)\rvert$(실선)가 세 교점에서 뾰족하게 꺾인다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        (iii) $f(0)=C$가 정수이므로, (3)을 만족시키는 상수 $C$의 값은 $-1$, $-2$, $-3$이 된다. 따라서 $f(1)=4+C$의 값은 $1$, $2$, $3$이고, 이들의 합은 $6$이다. (3점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        조건 (나)에 의해 $f'(x)=k(x-1)(x-3)$으로 나타내고, 조건 (가)에 의해 $f(x)=x^3-6x^2+9x+C$ ($C$는 상수)임을 유도했다(채점기준 도입).
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        조건 (나)와 (다)에 의해 극댓값 $4+C>0$, 극솟값 $C<0$, 즉 $-4<C<0$임을 설명했다(채점기준 전개).
      depends_on: [1.M1]
      not_penalized:
      - 함수 $y=f(x)$의 그래프를 그리지 않음(채점 유의사항 2)
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $f(0)$이 정수가 되는 $C=-1,-2,-3$을 찾고 $f(1)$의 값의 합 $6$을 구했다(채점기준 결론).
      depends_on: [1.R1]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
