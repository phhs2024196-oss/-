intent: |
  도함수 조건으로 삼차함수를 상수항만 남기고 결정한 뒤, 절댓값 함수가 미분가능하지 않은 점의 개수를 극댓값·극솟값의 부호 조건으로 바꾸어 상수항의 범위를 구하는 능력을 본다.
key_idea: |
  $f(x)=x^3-6x^2+9x+C$이고 $\lvert f(x)\rvert$가 미분가능하지 않은 점은 $f$의 그래프가 $x$축을 뚫고 지나는 점이므로, 그런 점이 3개 ⟺ 극댓값 $4+C>0$, 극솟값 $C<0$ ⟺ $-4<C<0$.
stuck: |
  $\lvert f(x)\rvert$가 미분가능하지 않은 점의 개수 3을 방정식 $f(x)=0$이 서로 다른 세 실근을 가질 조건(극댓값·극솟값의 부호가 다름)으로 바꾸는 단계
idea_tags: [IDEA-ABS-NONDIFF-SIGN-CHANGE, IDEA-CUBIC-THREE-ROOTS-EXTREMA-SIGN]
