      depends_on: [1.R1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        합의 공식으로 $\displaystyle\sum_{n=1}^{10}a_n=445\pi$를 구했다(채점기준 결론).
      depends_on: [1.M1]
      steps: [1b-3]
