stimuli: []

stem: |
  자연수 $n$에 대하여 세 점 $\mathrm{A}_n(n,\ n+1)$, $\mathrm{B}(0,\ 1)$, $\mathrm{O}(0,\ 0)$을 꼭짓점으로 하는 삼각형 $\mathrm{OA}_n\mathrm{B}$의 외접원의 넓이를 $a_n$이라 할 때, $\displaystyle\sum_{n=1}^{10}a_n$의 값을 구하시오. (13점)

subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{n=1}^{10}a_n$의 값을 구하시오.
  points: 13
  depends_on: []
  answer: {kind: value, value: '445*pi', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\angle\mathrm{OBA}_n=\dfrac34\pi$로 일정하므로 사인법칙으로 $R$을 구한다.
    steps:
    - {id: 1a, content: '$2R=\dfrac{\sqrt{n^2+(n+1)^2}}{\sin\frac34\pi}$, $a_n=\left(n^2+n+\dfrac12\right)\pi$, $\sum=(385+55+5)\pi=445\pi$', criteria: [1.R1, 1.M1, 1.A1]}
    hint_ladder:
    - 점 $\mathrm{A}_n$과 점 $\mathrm{B}$는 어떤 직선 위에 있는가?
    - $n$에 관계없이 크기가 일정한 각을 찾아 사인법칙을 쓰자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026학년도 선행학습 영향평가 자체평가보고서 p.168 문항 해설(i)~(iii)
    steps:
    - id: 1b-1
      content: |
        (i) 모든 자연수 $n$에 대하여 점 $\mathrm{A}_n$과 점 $\mathrm{B}$는 직선 $y=x+1$ 위에 있으므로, $\angle\mathrm{OBA}_n=\dfrac34\pi$이다. 또한 $\overline{\mathrm{OA}_n}=\sqrt{n^2+(n+1)^2}$이다. (4점)
        [그림] 해설지 그림: 좌표평면에 직선 $y=x+1$(점선)과 그 위의 점 $\mathrm{B}(0,1)$, $\mathrm{A}_n(n,n+1)$, 원점 $\mathrm{O}$를 잇는 삼각형 $\mathrm{OA}_n\mathrm{B}$.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        (ii) 사인법칙에 의해 삼각형 $\mathrm{OA}_n\mathrm{B}$의 외접원의 반지름의 길이 $R$은
        $$R=\dfrac{\overline{\mathrm{OA}_n}}{2\sin B}=\dfrac{\sqrt{n^2+(n+1)^2}}{2\sin\left(\dfrac34\pi\right)}=\sqrt{n^2+n+\dfrac12}\ \cdots(1)$$
        이다. 따라서 (1)에 의해 삼각형 $\mathrm{OA}_n\mathrm{B}$의 외접원의 넓이는 $a_n=\pi R^2=\left(n^2+n+\dfrac12\right)\pi$이다. (5점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        (iii) 그러므로
        $$\sum_{n=1}^{10}a_n=\sum_{n=1}^{10}\left(n^2+n+\dfrac12\right)\pi=\pi\left(\sum_{n=1}^{10}n^2+\sum_{n=1}^{10}n+\sum_{n=1}^{10}\dfrac12\right)$$
        $$=\left\{\dfrac{10(10+1)(2\times10+1)}{6}+\dfrac{10(10+1)}{2}+5\right\}\pi=(385+55+5)\pi=445\pi$$
        이다. (4점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
