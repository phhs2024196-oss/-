intent: |
  실수의 $n$제곱근 중 실수인 것의 개수를 $n$의 홀짝과 밑의 부호로 분류하고, 합의 조건에서 각 $f(n)$의 값을 결정해 로그의 밑을 구하는 능력을 본다.
key_idea: |
  $n$이 홀수이면 $f(n)=1$, 짝수이면 $\log_an-1$의 부호(즉 $n$과 $a$의 대소)에 따라 $0,1,2$. 홀수 부분의 합 $24$를 빼면 $2f(2)+4f(4)+6f(6)+8f(8)=32$이고 이를 만족하는 경우는 $f(2)=0$, $f(4)=1$, $f(6)=f(8)=2$뿐이므로 $a=4$.
stuck: |
  짝수 $n$에서 $f(n)$이 $n<a$, $n=a$, $n>a$에 따라 $0,1,2$로 갈리고 $n$에 대해 단조라는 점을 이용해 $32$를 만드는 경우를 하나로 좁히는 단계
