stimuli: []

stem: |
  $n$이 $2$ 이상의 정수일 때, $(\log_an-1)$의 $n$제곱근 중 실수인 것의 개수를 $f(n)$이라 하자. 이때 $\displaystyle\sum_{n=2}^{9}nf(n)=56$을 만족시키는 실수 $a$의 값을 구하시오. (단, $a>1$) (14점)

subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{n=2}^{9}nf(n)=56$을 만족시키는 실수 $a$의 값을 구하시오.
  points: 14
  depends_on: []
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 홀수 $n$은 $f(n)=1$, 짝수 $n$은 $n$과 $a$의 대소로 $0,1,2$. 짝수 부분의 합이 $32$가 되는 경우를 찾는다.
    steps:
    - {id: 1a, content: '홀수 합 $24$, 짝수 합 $32$ → $f(2)=0$, $f(4)=1$, $f(6)=f(8)=2$ → $a=4$', criteria: [1.B1, 1.B2, 1.M1, 1.A1]}
    hint_ladder:
    - 홀수 $n$이면 실수인 $n$제곱근은 몇 개인가?
    - 짝수 $n$이면 $\log_an-1$의 부호에 따라 개수가 어떻게 달라지는가?
    - 짝수 항의 합이 얼마가 되어야 하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026학년도 선행학습 영향평가 자체평가보고서 p.170 문항 해설(i)~(iv)
    steps:
    - id: 1b-0
      content: |
        $n$이 홀수인지, 짝수인지에 따라 실수 $(\log_an-1)$의 $n$제곱근 중 실수인 것의 개수 $f(n)$을 구해보자.

        (i) $n$이 홀수인 경우, $f(n)=1$이다. (3점)
      criteria: [1.B1]
    - id: 1b-1
      content: |
        (ii) $n$이 짝수인 경우,
        $\log_an-1<0$ 즉, $n<a$일 때, $f(n)=0$
        $\log_an-1=0$ 즉, $n=a$일 때, $f(n)=1$
        $\log_an-1>0$ 즉, $n>a$일 때, $f(n)=2$
        이다. (4점)
      criteria: [1.B2]
    - id: 1b-2
      content: |
        (iii) (i)에 의해 $\displaystyle\sum_{n=2}^{9}nf(n)$에서 $n$이 홀수일 때 합은 $3f(3)+5f(5)+7f(7)+9f(9)=3+5+7+9=24$이고, $\displaystyle\sum_{n=2}^{9}nf(n)=56$이어야 하므로 $n$이 짝수일 때 합은
        $$2f(2)+4f(4)+6f(6)+8f(8)=32\ \cdots(1)$$
        가 된다. 따라서 (ii)에 의해 (1)을 만족시키는 경우는 $f(2)=0$, $f(4)=1$, $f(6)=f(8)=2$이다. (5점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        (iv) 그러므로 (ii)에 의해 $a=4$이다. (2점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: |
        $n$이 홀수일 때 $f(n)=1$임을 적었다(채점기준 도입 7점 중 3점).
      steps: [1b-0]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: |
        $n$이 짝수일 때 $n<a$, $n=a$, $n>a$에 따라 $f(n)=0,1,2$임을 적었다(채점기준 도입 7점 중 4점).
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $\displaystyle\sum_{n=2}^{9}nf(n)=56$으로부터 짝수 항의 합 $2f(2)+4f(4)+6f(6)+8f(8)=32$를 얻고 $f(2)=0$, $f(4)=1$, $f(6)=f(8)=2$를 구했다(채점기준 전개).
      depends_on: [1.B1, 1.B2]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $f(4)=1$로부터 $a=4$를 찾았다(채점기준 결론).
      depends_on: [1.M1]
      steps: [1b-3]
