intent: |
  극한값의 존재·부호 조건과 무한대에서의 극한 조건으로 다항함수의 인수와 차수·최고차항을 결정하고, 남은 이차식의 근의 위치를 최고차항 계수의 부호로 나누어 정수 조건과 결합하는 능력을 본다.
key_idea: |
  $f(x)=(x+1)(x-2)Q(x)$, $Q$는 최고차항 계수 $\pm1$인 이차식이고 $Q(-1)<0<Q(2)$. 계수 $1$이면 $\alpha<-1<\beta<2$로 $\alpha+\beta=3$인 정수 없음, 계수 $-1$이면 $-1<\alpha<2<\beta$에서 $\alpha=0$, $\beta=3$. 실근 $-1,0,2,3$의 곱은 $0$.
stuck: |
  $\lvert f(x)\rvert$의 극한에서 최고차항 계수가 $-1$일 수도 있음을 놓치지 않고, $Q(-1)<0<Q(2)$로부터 근의 위치를 계수의 부호별로 나누는 단계
idea_tags: [IDEA-LIMIT-EXISTS-FACTOR, IDEA-IVT-ROOT-LOCATION-SIGN-SPLIT]
