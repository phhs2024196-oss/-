stimuli:
- label: 조건
  body: |
    (가) 극한값 $\displaystyle\lim_{x\to-1}\dfrac{f(x)}{x+1}$가 존재하고, 그 값은 양수이다.

    (나) 극한값 $\displaystyle\lim_{x\to2}\dfrac{f(x)}{x-2}$가 존재하고, 그 값은 양수이다.

    (다) $\displaystyle\lim_{x\to\infty}\dfrac{\lvert f(x)\rvert}{x^4}=1$

stem: |
  다항함수 $f(x)$가 다음 조건을 만족시킨다.

  [조건 (가)~(다)]

  방정식 $f(x)=0$의 모든 실근이 정수이고 모든 실근의 합이 $4$일 때, 모든 실근의 곱을 구하시오. (16점)

subparts:
- id: '1'
  stem: |
    방정식 $f(x)=0$의 모든 실근의 곱을 구하시오.
  points: 16
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=(x+1)(x-2)Q(x)$, $Q(-1)<0<Q(2)$에서 $Q$의 최고차항 계수 부호로 근의 위치를 나눈다.
    steps:
    - {id: 1a, content: '계수 $1$: $\alpha<-1<\beta<2$ 불가, 계수 $-1$: $-1<\alpha<2<\beta$, $\alpha+\beta=3$ → $\alpha=0$, $\beta=3$, 곱 $0$', criteria: [1.M1, 1.R1, 1.M2, 1.A1]}
    hint_ladder:
    - 극한값이 존재하려면 $f(-1)$, $f(2)$는 얼마여야 하는가?
    - 조건 (다)에서 $f$의 차수와 최고차항의 계수는?
    - $Q(-1)$, $Q(2)$의 부호는 $Q$의 근의 위치에 대해 무엇을 알려 주는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026학년도 선행학습 영향평가 자체평가보고서 p.172 문항 해설(i)~(iv)
    steps:
    - id: 1b-1
      content: |
        (i) 조건 (가)에 의해 $f(-1)=0$이고, 조건 (나)에 의해 $f(2)=0$이다. 또한 조건 (다)에 의해 $f(x)$는 최고차항의 계수가 $1$ 또는 $-1$인 사차함수이다.
        따라서 $f(x)$를
        $$f(x)=(x+1)(x-2)Q(x)\ \cdots(1)$$
        라 두면 $Q(x)$는 최고차항의 계수가 $1$ 또는 $-1$인 이차함수이다. (5점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (ii) 조건 (가)에 의해 $\displaystyle\lim_{x\to-1}\dfrac{f(x)}{x+1}=\lim_{x\to-1}(x-2)Q(x)=-3Q(-1)>0$이고, 조건 (나)에 의해 $\displaystyle\lim_{x\to2}\dfrac{f(x)}{x-2}=\lim_{x\to2}(x+1)Q(x)=3Q(2)>0$이므로,
        $$Q(-1)<0,\quad Q(2)>0\ \cdots(2)$$
        이다. (3점)
      criteria: [1.R1]
    - id: 1b-3
      content: |
        (iii) 방정식 $Q(x)=0$은 (2)에 의해 서로 다른 두 실근 $\alpha$, $\beta$ $(\alpha<\beta)$를 가진다. (1)에 의해 방정식 $f(x)=0$의 실근은 $-1$, $2$, $\alpha$, $\beta$이고, 모든 실근의 합이 $4$이므로
        $$\alpha+\beta=3\ (\text{단, }\alpha,\ \beta\text{는 정수})\ \cdots(3)$$
        이어야 한다. (3점)
      criteria: [1.M2]
    - id: 1b-4
      content: |
        (iv) 이차함수 $Q(x)$의 최고차항의 계수가 $1$ 또는 $-1$인지에 따라 (2)와 (3)을 만족하는 $\alpha$, $\beta$를 구해보자.
        $Q(x)$의 최고차항의 계수가 $1$인 경우, (2)에 의해 $\alpha<-1<\beta<2$이고, 이때 (3)을 만족하는 정수 $\alpha$, $\beta$는 존재하지 않는다.
        $Q(x)$의 최고차항의 계수가 $-1$인 경우, (2)에 의해 $-1<\alpha<2<\beta$이고, 이때 (3)을 만족하는 정수 $\alpha$, $\beta$는 $\alpha=0$, $\beta=3$이다.
        따라서 방정식 $f(x)=0$의 모든 실근은 $-1$, $0$, $2$, $3$이고, 이들의 곱은 $0$이다. (5점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        조건 (가), (나), (다)에 의해 $f(x)=(x+1)(x-2)Q(x)$ ($Q$는 최고차항의 계수가 $\pm1$인 이차함수)로 나타냈다(채점기준 도입).
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        조건 (가), (나)의 극한값을 계산해 $Q(-1)<0$, $Q(2)>0$임을 설명했다(채점기준 전개).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $Q(x)=0$의 두 실근 $\alpha$, $\beta$에 대해 실근의 합 조건에서 $\alpha+\beta=3$을 세웠다(채점기준 결론 8점 중 3점, 해설 (iii)).
      depends_on: [1.R1]
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        최고차항의 계수가 $1$, $-1$인 두 경우를 나누어 $\alpha=0$, $\beta=3$을 찾고 모든 실근의 곱 $0$을 구했다(채점기준 결론 8점 중 5점, 해설 (iv)).
      depends_on: [1.M2]
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
