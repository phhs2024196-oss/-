stimuli:
- label: 조건
  body: |
    (가) 수열 $\{a_n\}$의 첫째항은 $30$이고 공차는 정수이다.

    (나) $T_{10}=T_{11}$

stem: |
  등차수열 $\{a_n\}$에 대하여 $T_n=\lvert a_1+a_2+\cdots+a_n\rvert$이라 할 때, 수열 $\{a_n\}$과 $\{T_n\}$이 다음 조건을 만족시킨다.

  [조건 (가)~(나)]

  이때 $T_n>T_{n+1}$을 만족시키는 자연수 $n$의 최솟값과 최댓값의 합을 구하시오. (17점)

subparts:
- id: '1'
  stem: |
    $T_n>T_{n+1}$을 만족시키는 자연수 $n$의 최솟값과 최댓값의 합을 구하시오.
  points: 17
  depends_on: []
  answer: {kind: value, value: '31', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\lvert S_{10}+a_{11}\rvert=\lvert S_{10}\rvert$의 두 경우에서 정수 공차 $d=-3$, 이후 $\lvert n(21-n)\rvert>\lvert(n+1)(20-n)\rvert$를 범위별로 푼다.
    steps:
    - {id: 1a, content: '$d=-3$, $T_n=\left\lvert\tfrac{3n(21-n)}2\right\rvert$, $T_n>T_{n+1}\iff 11\le n\le20$, $11+20=31$', criteria: [1.M1, 1.R1, 1.M2, 1.A1]}
    hint_ladder:
    - $T_{11}$을 $S_{10}$과 $a_{11}$로 나타내 보자.
    - $\lvert A\rvert=\lvert B\rvert$이면 $A=B$ 또는 $A=-B$이다.
    - $S_n$의 부호가 바뀌는 $n$을 기준으로 범위를 나누자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026학년도 선행학습 영향평가 자체평가보고서 p.174 문항 해설(i)~(iii)
    steps:
    - id: 1b-1
      content: |
        (i) 등차수열 $\{a_n\}$의 공차를 $d$라 할 때, 조건 (가)에 의해 $a_n=30+(n-1)d\ \cdots(1)$이다. 첫째항부터 제$n$항까지의 합을 $S_n=a_1+a_2+\cdots+a_n$이라 할 때,
        $$S_n=\dfrac{n\{60+(n-1)d\}}{2}\ \cdots(2)$$
        이고, $T_n=\lvert S_n\rvert$이다. (3점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (ii) 조건 (나)에서 $\lvert S_{10}\rvert=\lvert S_{11}\rvert=\lvert S_{10}+a_{11}\rvert$이므로, $\lvert S_{10}+a_{11}\rvert=\lvert S_{10}\rvert\ \cdots(3)$이다. (3)에서
        $S_{10}+a_{11}=S_{10}$인 경우, $a_{11}=0$이다. 따라서 (1)에 의해 $a_{11}=30+10d=0$ 즉, $d=-3$이다.
        $S_{10}+a_{11}=-S_{10}$인 경우, $a_{11}=-2S_{10}$이다. 따라서 (1)과 (2)에 의해 $-2S_{10}=-2\times\dfrac{10(60+9d)}{2}=30+10d=a_{11}$ 즉, $d=-\dfrac{63}{10}$이다.
        조건 (가)에 의해 공차 $d$는 정수이므로 $d=-3$이다. (6점)
      criteria: [1.R1]
    - id: 1b-3
      content: |
        (iii) $T_n=\left\lvert\dfrac{n\{60+(n-1)(-3)\}}{2}\right\rvert$이고, $T_{n+1}=\left\lvert\dfrac{(n+1)\{60+n(-3)\}}{2}\right\rvert$이므로, 부등식 $T_n>T_{n+1}$은
        $$\lvert n(21-n)\rvert>\lvert(n+1)(20-n)\rvert\ \cdots(4)$$
        이다. (4)에서
        $1\le n\le20$인 경우, $n(21-n)>(n+1)(20-n)$이다. 즉, $-n^2+21n>-n^2+19n+20$이므로 $n>10$이다. 따라서 (4)를 만족시키는 자연수 $n=11,12,\dots,20$이다.
        $n\ge21$인 경우, $n(21-n)<(n+1)(20-n)$이다. 따라서 $n<10$이므로 (4)를 만족시키는 자연수 $n$이 존재하지 않는다. (6점)
      criteria: [1.M2]
    - id: 1b-4
      content: |
        그러므로, $T_n>T_{n+1}$을 만족시키는 자연수 $n$의 최솟값은 $11$, 최댓값은 $20$이고, 이들의 합은 $31$이다. (2점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        조건 (가)에 의해 $a_n=30+(n-1)d$와 $T_n=\left\lvert\dfrac{n\{60+(n-1)d\}}{2}\right\rvert$를 구했다(채점기준 도입).
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 6
      evidence: |
        $\lvert S_{10}+a_{11}\rvert=\lvert S_{10}\rvert$를 두 경우로 나누어 $d=-3$, $d=-\dfrac{63}{10}$을 얻고 정수 조건으로 $d=-3$을 찾았다(채점기준 전개).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: |
        $T_n>T_{n+1}$을 $\lvert n(21-n)\rvert>\lvert(n+1)(20-n)\rvert$로 바꾸고 $1\le n\le20$, $n\ge21$로 나누어 $n=11,\dots,20$을 얻었다(채점기준 결론 8점 중 6점).
      depends_on: [1.R1]
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        최솟값 $11$, 최댓값 $20$의 합 $31$을 적었다(채점기준 결론 8점 중 2점).
      depends_on: [1.M2]
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

