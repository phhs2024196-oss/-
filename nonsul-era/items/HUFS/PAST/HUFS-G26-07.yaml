stimuli: []

stem: |
  실수 $t$에 대하여, $-1\le x\le1$에서 함수 $f(x)=x^2-2\lvert x-t\rvert+1$의 최댓값을 $g(t)$라 하자. 이때 $\displaystyle\int_{-3}^{2}g(t)\,dt$의 값을 구하시오. (18점)

subparts:
- id: '1'
  stem: |
    $\displaystyle\int_{-3}^{2}g(t)\,dt$의 값을 구하시오.
  points: 18
  depends_on: []
  answer: {kind: value, value: '11/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 절댓값을 풀어 두 포물선 조각으로 나누고, 꺾인 점 $x=t$가 $[-1,1]$ 안에 있는지로 $g(t)$를 구한다.
    steps:
    - {id: 1a, content: '$g(t)=4+2t\ (t\le-1)$, $t^2+1\ (-1<t<1)$, $4-2t\ (t\ge1)$, $\int_{-3}^{2}g=\dfrac{11}3$', criteria: [1.M1, 1.R1, 1.A1]}
    hint_ladder:
    - $x<t$와 $x\ge t$로 나누어 $f(x)$를 완전제곱식으로 정리해 보자.
    - 꺾인 점 $x=t$가 구간 $[-1,1]$의 왼쪽, 안, 오른쪽에 있는 경우를 나누자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026학년도 선행학습 영향평가 자체평가보고서 p.175~176 문항 해설(i)~(iii)
    steps:
    - id: 1b-1
      content: |
        (i) $f(x)=x^2-2\lvert x-t\rvert+1$에서
        $$f(x)=\begin{cases}x^2+2x-2t+1=(x+1)^2-2t & (x<t)\\ x^2-2x+2t+1=(x-1)^2+2t & (x\ge t)\end{cases}\ \cdots(1)$$
        이다. (4점)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (ii) (1)에 의해 $-1\le x\le1$에서 함수 $y=f(x)$의 그래프는 $t$의 범위에 따라 다음과 같다.
        [그림] 해설지 그림 3개: ① $t\le-1$인 경우 — $[-1,1]$에서 $y=(x-1)^2+2t$의 감소하는 포물선 조각($x=-1$에서 가장 높고 $x=1$에서 가장 낮음). ② $-1<t<1$인 경우 — $x=t$까지 증가하는 $(x+1)^2-2t$ 조각과 $x=t$ 이후 감소하는 $(x-1)^2+2t$ 조각이 $x=t$에서 뾰족하게 만남(최고점 $x=t$). ③ $t\ge1$인 경우 — $[-1,1]$에서 $y=(x+1)^2-2t$의 증가하는 포물선 조각($x=1$에서 가장 높음).

        $t\le-1$인 경우, $-1\le x\le1$에서 $f(x)=(x-1)^2+2t$이므로 $f(x)$는 $x=-1$에서 최댓값을 가진다. 즉, $g(t)=f(-1)=4+2t$이다.

        $-1<t<1$인 경우, $-1\le x\le1$에서 $f(x)=\begin{cases}(x+1)^2-2t & (-1\le x<t)\\ (x-1)^2+2t & (t\le x\le1)\end{cases}$이므로 $f(x)$는 $x=t$에서 최댓값을 가진다. 즉, $g(t)=f(t)=t^2+1$이다.

        $t=1$인 경우, $-1\le x\le1$에서 $f(x)=\begin{cases}(x+1)^2-2 & (-1\le x<1)\\ 2 & (x=1)\end{cases}$이므로 $f(x)$는 $x=1$에서 최댓값을 가진다. 즉, $g(1)=f(1)=2$이다.

        $t>1$인 경우, $-1\le x\le1$에서 $f(x)=(x+1)^2-2t$이므로 $f(x)$는 $x=1$에서 최댓값을 가진다. 즉, $g(t)=f(1)=4-2t$이다.

        따라서 $-1\le x\le1$에서 함수 $f(x)$의 최댓값 $g(t)$는
        $$g(t)=\begin{cases}4+2t & (t\le-1)\\ t^2+1 & (-1<t<1)\\ 4-2t & (t\ge1)\end{cases}$$
        이다. (9점)
      criteria: [1.R1]
    - id: 1b-3
      content: |
        (iii) 그러므로,
        $$\int_{-3}^{2}g(t)\,dt=\int_{-3}^{-1}(4+2t)\,dt+\int_{-1}^{1}(t^2+1)\,dt+\int_{1}^{2}(4-2t)\,dt=\dfrac{11}{3}$$
        이다. (5점)
      criteria: [1.A1]
