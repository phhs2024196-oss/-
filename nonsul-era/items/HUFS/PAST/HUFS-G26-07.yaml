intent: |
  절댓값이 들어간 이차식을 구간별로 나타내고, 매개변수 $t$의 범위에 따라 닫힌구간에서의 최댓값 함수 $g(t)$를 구한 뒤 구간별 정적분으로 계산하는 능력을 본다.
key_idea: |
  $f(x)=(x+1)^2-2t\ (x<t)$, $(x-1)^2+2t\ (x\ge t)$. $t\le-1$이면 $g=f(-1)=4+2t$, $-1<t<1$이면 $g=f(t)=t^2+1$, $t\ge1$이면 $g=f(1)=4-2t$. $\int_{-3}^{2}g=0+\dfrac83+1=\dfrac{11}3$.
stuck: |
  $t$의 위치($-1$ 이하, $-1$과 $1$ 사이, $1$ 이상)에 따라 $[-1,1]$에서 $f$의 그래프 모양이 달라지고, 가운데 경우 최댓값이 꺾인 점 $x=t$에서 생김을 파악하는 단계
