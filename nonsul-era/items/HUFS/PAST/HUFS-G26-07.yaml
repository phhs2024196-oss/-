    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $f(x)$를 $x<t$일 때 $(x+1)^2-2t$, $x\ge t$일 때 $(x-1)^2+2t$로 나타냈다(채점기준 도입).
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 9
      evidence: |
        $t$의 범위에 따라 $-1\le x\le1$에서 $y=f(x)$를 파악하고 $g(t)=4+2t\ (t\le-1)$, $t^2+1\ (-1<t<1)$, $4-2t\ (t\ge1)$을 구했다(채점기준 전개).
      depends_on: [1.M1]
      not_penalized:
      - 함수 $y=f(x)$의 그래프를 그리지 않음(채점 유의사항 2)
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        구간별 정적분으로 $\displaystyle\int_{-3}^{2}g(t)\,dt=\dfrac{11}3$을 구했다(채점기준 결론).
      depends_on: [1.R1]
      steps: [1b-3]
    deductions:
