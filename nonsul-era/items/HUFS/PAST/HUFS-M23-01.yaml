stem: |
  ※ 다음 물음에 답하시오. 답안지에 반드시 풀이과정 또는 증명과정을 제시하시오.

  [문제 1] 자연수 $n$이 $2\le n\le10$일 때, $-n^2+7n-10$의 $n$제곱근 중에서 음의 실수가 존재하도록 하는 모든 $n$의 값의 합을 구하시오. (9점)

subparts:
- id: '1'
  stem: |
    조건을 만족시키는 모든 $n$의 값의 합을 구하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: '20', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$-(n-2)(n-5)>0$이면 $n$ 짝수($n=4$), $<0$이면 $n$ 홀수($n=7,9$), 합 $20$.'
    steps:
    - {id: 1a, content: '부호로 세 경우 → $n=4,7,9$ → $4+7+9=20$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $-n^2+7n-10$을 인수분해해 부호를 조사해 보자.
    - 양수의 $n$제곱근 중 음의 실수는 언제 있는가? 음수일 때는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북 p.91
    steps:
    - id: 1b-1
      content: |
        $-n^2+7n-10=-(n-2)(n-5)$의 부호에 따라 세 가지 경우로 나눌 수 있다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        경우 1. $-n^2+7n-10>0$인 경우, 즉, $2<n<5$일 때를 생각하자. 이 경우 $-n^2+7n-10$의 $n$제곱근 중에서 음의 실수가 존재하려면 $n$은 짝수여야 한다. 게다가 조건 $2\le n\le10$가 성립하므로 이 경우 가능한 $n$은 $4$ 하나이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        경우 2. $-n^2+7n-10<0$인 경우, 즉, $n<2$이거나 $n>5$일 때를 생각하자. 이 경우 $-n^2+7n-10$의 $n$제곱근 중에서 음의 실수가 존재하려면 $n$은 홀수여야 한다. 게다가 조건 $2\le n\le10$가 성립하므로 이 경우 가능한 $n$은 $7$과 $9$ 두 개이다.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        경우 3. $-n^2+7n-10=0$인 경우는 해당 사항이 없다.
      criteria: [1.M2]
    - id: 1b-5
      content: |
        따라서 $-n^2+7n-10$의 $n$제곱근 중에서 음의 실수가 존재하도록 하는 모든 $n$의 합은 $4+7+9=20$이다.
      criteria: [1.A1]
