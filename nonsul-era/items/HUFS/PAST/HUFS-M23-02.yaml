stem: |
  ※ 다음 물음에 답하시오. 답안지에 반드시 풀이과정 또는 증명과정을 제시하시오.

  [문제 2] 정의역이 $\{x\mid0\le x\le4\}$인 함수 $y=\log_{\frac12}(x^2-2x+8)$의 최솟값을 구하시오. (9점)

subparts:
- id: '1'
  stem: |
    함수 $y=\log_{\frac12}(x^2-2x+8)$의 최솟값을 구하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: '-4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '진수 $(x-1)^2+7$의 범위 $[7,16]$, 감소하는 로그이므로 최솟값 $\log_{\frac12}16=-4$.'
    steps:
    - {id: 1a, content: '$7\le f(x)\le16$ → $\log_{\frac12}16=-4$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 진수를 완전제곱식으로 바꾸어 범위를 구해 보자.
    - 밑이 $\frac12$인 로그함수는 증가하는가, 감소하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북 p.91
    steps:
    - id: 1b-1
      content: |
        정의역이 $\{x\mid0\le x\le4\}$인 함수 $f(x)=x^2-2x+8$은 $f(x)=(x-1)^2+7$로 쓸 수 있고,
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이차함수 그래프의 개형으로부터 $7\le f(x)\le16$임을 알 수 있다. [그래프: $x=1$에서 최솟값 $7$, $x=0$에서 $8$, $x=4$에서 $16$]
      criteria: [1.M2]
    - id: 1b-3
      content: |
        게다가 로그함수 $y=\log_{\frac12}x$는 감소함수이므로 함수 $y=\log_{\frac12}f(x)$의 최솟값은 $\log_{\frac12}16=-4$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: (도입) 함수 $f(x)=x^2-2x+8$을 $f(x)=(x-1)^2+7$로 변형한다.
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: (전개) $0\le x\le4$일 때 $7\le f(x)\le16$임을 찾는다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: (결론) $y=\log_{\frac12}x$가 감소함수임을 파악하여 함수 $y=\log_{\frac12}f(x)$의 최솟값 $-4$를 얻는다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
