stem: |
  ※ 다음 물음에 답하시오. 답안지에 반드시 풀이과정 또는 증명과정을 제시하시오.

  [문제 4] 사차함수 $f(x)=x^4-4cx^3+3$이 모든 실수 $x$에 대해 $f(x)\ge0$를 만족할 때, 상수 $c$의 최댓값을 구하시오. (9점)

subparts:
- id: '1'
  stem: |
    상수 $c$의 최댓값을 구하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: 'sqrt(3)/3', equivalents: ['\dfrac{\sqrt3}{3}', '\dfrac{1}{\sqrt3}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '최솟값 후보 $f(0)=3$, $f(3c)=-27c^4+3$ → $c^4\le\frac19$ → $c\le\frac{\sqrt3}{3}$.'
    steps:
    - {id: 1a, content: '$f(3c)\ge0\iff c^4\le\frac19$, 최댓값 $\frac{\sqrt3}{3}$', criteria: [1.R1, 1.M1, 1.A1]}
    hint_ladder:
    - $f^{\prime}(x)$를 인수분해해 보자.
    - 모든 실수에서 $f(x)\ge0$은 최솟값에 대한 조건으로 바꿀 수 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북 p.92
    steps:
    - id: 1b-1
      content: |
        사차함수 $f(x)=x^4-4cx^3+3$의 도함수는 $f^{\prime}(x)=4x^3-12cx^2=4x^2(x-3c)$이다. 최고차항의 계수가 양수인 사차함수 그래프의 개형으로부터 함수 $f(x)$는 반드시 $x=0$ 또는 $x=3c$에서 최솟값을 갖게 된다.
        따라서 모든 실수 $x$에 대해 $f(x)\ge0$가 성립하려면 $f(0)\ge0$이고 $f(3c)\ge0$이어야 한다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        한편, $f(0)=3$이고 $f(3c)=81c^4-4c\times27c^3+3=-27c^4+3$이므로 모든 실수 $x$에 대해 $f(x)\ge0$가 성립하려면, $-27c^4+3\ge0$, 즉 $c^4\le\dfrac19$이어야 한다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        따라서 상수 $c$가 될 수 있는 최댓값은 $\dfrac{\sqrt3}{3}$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: (도입) 모든 실수 $x$에 대해 $f(x)\ge0$가 성립하려면 $f(0)\ge0$이고 $f(3c)\ge0$이어야 함을 설명한다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: (전개) $f(0)\ge0$이고 $f(3c)\ge0$인 것은 $c^4\le\dfrac19$라는 것임을 보인다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: (결론) 상수 $c$가 될 수 있는 최댓값은 $\dfrac{\sqrt3}{3}$이라는 결론을 내린다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명이 없이 답만 쓴 경우
      effect: zero
      value: 0
