stimuli:
- label: 조건
  body: |
    (가) 각 꼭짓점의 $x$좌표와 $y$좌표는 모두 자연수이고, $x$좌표는 $100$ 이하이다.

    (나) 한 변의 길이는 $1$이다.

    (다) 두 함수 $y=\log3x$, $y=\log8x$의 그래프와 모두 만난다.
- label: 그림
  body: |
    [그림] 좌표평면에 $x$축 눈금 $0\sim6$, $y$축 눈금 $0\sim3$의 점선 격자가 그려져 있고, 두 곡선 $y=\log8x$(위쪽)와 $y=\log3x$(아래쪽)가 원점 근처에서 시작해 오른쪽으로 완만히 증가한다. $x=6$ 부근에서 $y=\log8x$는 약 $1.7$, $y=\log3x$는 약 $1.3$이다.

stem: |
  ※ 다음 물음에 답하시오. 답안지에 반드시 풀이과정 또는 증명과정을 제시하시오.

  [문제 5] 좌표평면에서 다음 조건을 모두 만족시키는 정사각형의 개수를 구하시오. (10점)

subparts:
- id: '1'
  stem: |
    조건을 모두 만족시키는 정사각형의 개수를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '77', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '꼭짓점 $(i,j)\sim(i+1,j+1)$. 두 그래프와 모두 만날 조건 $\frac{10^j}{3}-1\le i\le\frac{10^{j+1}}{8}$, $i\le99$ → $10+67=77$.'
    steps:
    - {id: 1a, content: '$j=1$: $i=3,\cdots,12$(10개), $j=2$: $i=33,\cdots,99$(67개), 합 $77$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 정사각형의 왼쪽 아래 꼭짓점을 $(i,j)$로 두자. $i$의 범위는?
    - 증가함수의 그래프가 정사각형과 만나려면 $x=i$에서의 높이와 $x=i+1$에서의 높이가 어떠해야 하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북 p.92
    steps:
    - id: 1b-1
      content: |
        좌표평면에서 정사각형이 조건 (가)와 (나)를 만족하려면 $99$ 이하의 자연수 $i$와 자연수 $j$에 대해 정사각형의 네 꼭짓점이 $\mathrm{A}(i,j)$, $\mathrm{B}(i+1,j)$, $\mathrm{C}(i+1,j+1)$, $\mathrm{D}(i,j+1)$이어야 한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        함수 $y=\log3x$는 증가함수이므로 정사각형 $\mathrm{ABCD}$가 조건 (다)를 만족시키려면 $\log3i\le j+1$이고 $j\le\log3(i+1)$이어야 하고, 이를 정리하면
        (1) $\dfrac{10^j}{3}-1\le i\le\dfrac{10^{j+1}}{3}$
        이다. 마찬가지로 정사각형 $\mathrm{ABCD}$가 함수 $y=\log8x$의 그래프와 만나려면
        (2) $\dfrac{10^j}{8}-1\le i\le\dfrac{10^{j+1}}{8}$
        이어야 한다. 정사각형 $\mathrm{ABCD}$가 조건 (다)를 만족시키려면 (1)과 (2)를 동시에 만족시켜야 하므로
        (3) $\dfrac{10^j}{3}-1\le i\le\dfrac{10^{j+1}}{8}$ 이어야 한다.
        (원문에는 (2) 앞 문장이 「함수 $y=\log3x$의 그래프와 만나려면」으로 인쇄되어 있으나 식 (2)의 내용상 $y=\log8x$의 오기로 보아 고쳐 적음)
      criteria: [1.M2]
    - id: 1b-3
      content: |
        한편, 부등식 (3)을 만족시키는 $i$와 $j$는 다음과 같다.
        $j=1$일 때 $i=3,4,\cdots,12$
        $j=2$일 때 $i=33,34,\cdots,99$
        그러므로 조건 (가), (나), (다)를 모두 만족시키는 정사각형은 총 $77$개이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
