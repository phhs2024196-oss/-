      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: (결론) 조건 (가), (나), (다)를 모두 만족시키는 정사각형의 개수를 구한다.
      depends_on: [1.M2]
      steps: [1b-3]
