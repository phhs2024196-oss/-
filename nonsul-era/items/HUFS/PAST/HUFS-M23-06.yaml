stimuli:
- label: 조건
  body: |
    (가) $a\ne b$

    (나) $(a-b)\sin^2C=a\sin^2A-b\sin^2B$

    (다) 삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이는 $2\sqrt3$이다.

stem: |
  ※ 다음 물음에 답하시오. 답안지에 반드시 풀이과정 또는 증명과정을 제시하시오.

  [문제 6] 다음 조건을 모두 만족시키는 삼각형 $\mathrm{ABC}$가 있다. 단, $\overline{\mathrm{BC}}=a$, $\overline{\mathrm{CA}}=b$, $\overline{\mathrm{AB}}=c$이다. 이 때, $c$의 값을 구하시오. (10점)

subparts:
- id: '1'
  stem: |
    $c$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$c^2=a^2+ab+b^2$ → $\cos C=-\frac12$ → $c=2\cdot2\sqrt3\cdot\frac{\sqrt3}{2}=6$.'
    steps:
    - {id: 1a, content: '$C=\frac23\pi$, $c=6$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 사인법칙으로 $\sin A$, $\sin B$, $\sin C$를 변의 길이로 바꾸어 보자.
    - 얻은 식을 코사인법칙과 비교하면 $\cos C$는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북 p.93
    steps:
    - id: 1b-1
      content: |
        삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이를 $R$이라고 하면 사인법칙에 의해
        $$\sin A=\frac{a}{2R},\quad \sin B=\frac{b}{2R},\quad \sin C=\frac{c}{2R}$$
        이고, 이를 조건 (나)에서 주어진 식에 대입하면
        $$(a-b)\left(\frac{c}{2R}\right)^2=a\left(\frac{a}{2R}\right)^2-b\left(\frac{b}{2R}\right)^2$$
        이다. 양변에 $(2R)^2$을 곱하면 $(a-b)c^2=a^3-b^3$이 되고, 조건 (가)에서 $a-b\ne0$이므로
        (1) $c^2=a^2+ab+b^2$ 이 성립한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        한편, 코사인법칙에 의해 $c^2=a^2+b^2-2ab\cos C$이므로 (1)로부터
        $$a^2+ab+b^2=a^2+b^2-2ab\cos C$$
        를 얻는다. 따라서 $\cos C=-\dfrac12$이고, $C=\dfrac23\pi$이고, 가 된다. [원문 그대로: 「이고, 가 된다」 사이 일부 누락]
      criteria: [1.M2]
    - id: 1b-3
      content: |
        마지막으로, 조건 (다)에서 $R=2\sqrt3$이므로 사인법칙에 의해
        $$c=2R\sin C=2\times2\sqrt3\times\frac{\sqrt3}{2}=6$$ 이다.
      criteria: [1.A1]
