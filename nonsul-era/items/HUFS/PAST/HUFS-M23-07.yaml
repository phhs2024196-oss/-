stimuli:
- label: 조건
  body: |
    (가) $\displaystyle\lim_{x\to2}\frac{xf(x)}{(x-2)^2}=10$

    (나) $\displaystyle\lim_{x\to\infty}\frac{f(x)}{2x^3-3}=2$

stem: |
  ※ 다음 물음에 답하시오. 답안지에 반드시 풀이과정 또는 증명과정을 제시하시오.

  [문제 7] 다항함수 $f(x)$가 다음 조건을 모두 만족시킬 때, $f(1)$의 값을 구하시오. (10점)

subparts:
- id: '1'
  stem: |
    $f(1)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$f(x)=(x-2)^2(4x+k)$, $\lim_{x\to2}x(4x+k)=2(8+k)=10$ → $k=-3$, $f(1)=1\cdot1=1$.'
    steps:
    - {id: 1a, content: '$f(x)=(x-2)^2(4x-3)$, $f(1)=1$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 분모가 $0$으로 가는데 극한값이 존재하려면 분자는?
    - 조건 (나)로 $f(x)$의 차수와 최고차항의 계수를 정해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북 p.93
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 $x\to2$일 때 (분모)$\to0$이고 극한값이 존재하므로 (분자)$\to0$이어야 한다. 따라서
        (1) $f(x)=(x-2)^2h(x)$ (단, $h(x)$는 다항식)으로 놓을 수 있다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        한편, 조건 (나)로부터 $f(x)$는 최고차항의 계수가 $4$인 삼차함수임을 알 수 있다. 따라서 (1)에 의해
        (2) $f(x)=(x-2)^2(4x+k)$ (단, $k$는 상수)이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        이제, (2)를 조건 (가)에 대입하면
        $$10=\lim_{x\to2}\frac{xf(x)}{(x-2)^2}=\lim_{x\to2}x(4x+k)=2(8+k)$$
        이고, $k=-3$을 찾는다. 따라서 $f(x)=(x-2)^2(4x-3)$이고, $f(1)=1$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: (도입) 조건 (가)로부터 $f(x)=(x-2)^2h(x)$를 얻는다.
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: (전개) 조건 (나)로부터 $f(x)=(x-2)^2(4x+k)$를 얻는다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: (결론) $f(x)=(x-2)^2(4x+k)$를 조건 (가)에 대입하여 $k=-3$을 찾고, 이로부터 $f(1)=1$을 구한다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
