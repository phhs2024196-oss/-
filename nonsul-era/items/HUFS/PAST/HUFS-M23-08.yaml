      evidence: (전개) 색칠한 도형의 넓이를 구하는 방법을 찾고 계산한다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: (결론) $abc$의 값을 계산한다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
