stimuli:
- label: 그림
  body: |
    [그림] 중심이 원점 $\mathrm{O}$이고 반지름이 $2$인 원(눈금 $-2$, $2$ 표시)과 포물선 $y=ax^2$이 그려져 있다. 포물선과 원의 제1사분면 교점이 $\mathrm{P}$이고, $\mathrm{P}$에서 $x$축에 내린 수선의 발 $\mathrm{Q}$(직각 표시)가 있으며 선분 $\mathrm{OP}$와 $\mathrm{PQ}$는 점선이다. 원의 내부 중 포물선보다 위쪽 영역(원의 위쪽 호와 포물선으로 둘러싸인 부분)이 색칠되어 있다.

stem: |
  ※ 다음 물음에 답하시오. 답안지에 반드시 풀이과정 또는 증명과정을 제시하시오.

  [문제 8] 그림과 같이 이차함수 $y=ax^2$ ($a>0$)의 그래프는 중심이 원점 $\mathrm{O}$이고 반지름의 길이가 $2$인 원과 두 점에서 만난다. 두 교점 중 $1$사분면에 위치한 점을 $\mathrm{P}$라 하고, 점 $\mathrm{P}$에서 $x$축에 내린 수선의 발을 $\mathrm{Q}$라고 하면 $\angle\mathrm{POQ}=30^\circ$이다. 그림에서 색칠한 도형의 넓이가 $b\pi+c\sqrt3$일 때, $abc$의 값을 구하시오. (단, $b$와 $c$는 유리수) (10점)

subparts:
- id: '1'
  stem: |
    $abc$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '4/27', equivalents: ['\dfrac{4}{27}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$a=\frac13$, 넓이 $\frac43\pi+\frac13\sqrt3$ → $abc=\frac13\cdot\frac43\cdot\frac13=\frac4{27}$.'
    steps:
    - {id: 1a, content: '$a=\frac13$, $b=\frac43$, $c=\frac13$, $abc=\frac{4}{27}$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 직각삼각형 $\mathrm{POQ}$에서 점 $\mathrm{P}$의 좌표는?
    - 색칠한 도형은 $y$축 대칭이다. 반쪽을 부채꼴과 다른 도형으로 나누어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북 p.93
    steps:
    - id: 1b-1
      content: |
        직각삼각형 $\mathrm{POQ}$는 빗변의 길이가 $2$이고 $\angle\mathrm{POQ}=30^\circ$이므로 삼각비에 의해 점 $\mathrm{P}$와 점 $\mathrm{Q}$의 좌표는 각각 $(\sqrt3,1)$과 $(\sqrt3,0)$이다. 점 $\mathrm{P}(\sqrt3,1)$은 이차함수 $y=ax^2$의 그래프 위의 점이므로 $1=3a$가 성립하고, 따라서 $a=\dfrac13$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        원점 $\mathrm{O}$와 점 $\mathrm{P}$를 지나는 직선의 방정식은 $y=\dfrac{\sqrt3}{3}x$이다. 점 $\mathrm{R}(0,2)$라 할 때 색칠한 도형은 $y$축 대칭이므로 넓이는
        $2\times$(부채꼴 $\mathrm{OPR}$의 넓이 $+$ 직선 $y=\dfrac{\sqrt3}{3}x$와 곡선 $y=\dfrac13x^2$으로 둘러싸인 도형의 넓이)
        가 된다. 계산을 하면 다음과 같다.
        $$2\times\left(\frac12\times2^2\times\frac13\pi+\int_0^{\sqrt3}\left(\frac{\sqrt3}{3}x-\frac13x^2\right)dx\right)=2\times\left(\frac23\pi+\left[\frac{\sqrt3}{6}x^2-\frac19x^3\right]_0^{\sqrt3}\right)=\frac43\pi+\frac13\sqrt3$$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서, $b=\dfrac43$, $c=\dfrac13$이고, $abc=\dfrac13\times\dfrac43\times\dfrac13=\dfrac{4}{27}$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
