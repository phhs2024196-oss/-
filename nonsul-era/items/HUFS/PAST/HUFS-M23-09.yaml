stimuli: []

stem: |
  ※ 다음 물음에 답하시오. 답안지에 반드시 풀이과정 또는 증명과정을 제시하시오.

  [문제 9] 모든 자연수 $n$에 대하여 다음 부등식이 성립함을 수학적 귀납법으로 증명하시오. (단, $0\le a\le b$) (12점)
  $$\left(\frac{a+2b}{3}\right)^n\le\frac{a^n+2b^n}{3}$$

subparts:
- id: '1'
  stem: |
    위 부등식이 모든 자연수 $n$에 대하여 성립함을 수학적 귀납법으로 증명하시오.
  points: 12
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$n=1$은 등호. $n=k$ 가정에 $\frac{a+2b}{3}\ge0$을 곱해 $n=k+1$의 우변과 비교하면 차이 $\frac{2(b^k-a^k)(b-a)}{9}\ge0$.'
    steps:
    - {id: 1a, content: '$\frac{a^{k+1}+2b^{k+1}}{3}-\left(\frac{a+2b}{3}\right)^{k+1}\ge\frac{2(b^k-a^k)(b-a)}{9}\ge0$', criteria: [1.R1, 1.M1]}
    hint_ladder:
    - $n=1$일 때 양변을 비교해 보자.
    - $\left(\frac{a+2b}{3}\right)^{k+1}=\left(\frac{a+2b}{3}\right)^k\cdot\frac{a+2b}{3}$에 귀납 가정을 써 보자.
    - 남는 식 $2a^{k+1}+2b^{k+1}-2a^kb-2ab^k$를 인수분해해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북 p.94
    steps:
    - id: 1b-1
      content: |
        (i) $n=1$일 때 $\left(\dfrac{a+2b}{3}\right)^n=\dfrac{a+2b}{3}$이고 $\dfrac{a^n+2b^n}{3}=\dfrac{a+2b}{3}$이므로 문제에서 제시된 부등식 $\left(\dfrac{a+2b}{3}\right)^n\le\dfrac{a^n+2b^n}{3}$가 성립한다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        (ii) $n=k\,(\ge1)$일 때 문제의 부등식이 성립한다고 가정하자. 그러면
        (1) $\left(\dfrac{a+2b}{3}\right)^k\le\dfrac{a^k+2b^k}{3}$ 이다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        (iii) $0\le a\le b$라는 조건과 (1)을 이용해서 다음을 유도한다.
        $$\begin{aligned}\frac{a^{k+1}+2b^{k+1}}{3}-\left(\frac{a+2b}{3}\right)^{k+1}&=\frac{a^{k+1}+2b^{k+1}}{3}-\left(\frac{a+2b}{3}\right)^k\left(\frac{a+2b}{3}\right)\\&\ge\frac{a^{k+1}+2b^{k+1}}{3}-\left(\frac{a^k+2b^k}{3}\right)\left(\frac{a+2b}{3}\right)\\&=\frac{a^{k+1}+2b^{k+1}}{3}-\frac{a^{k+1}+2a^kb+2ab^k+4b^{k+1}}{9}\\&=\frac{2a^{k+1}+2b^{k+1}-2a^kb-2ab^k}{9}\\&=\frac{2(b^k-a^k)(b-a)}{9}\\&\ge0\end{aligned}$$
      criteria: [1.M1]
    - id: 1b-4
      content: |
        이로부터 $\left(\dfrac{a+2b}{3}\right)^{k+1}\le\dfrac{a^{k+1}+2b^{k+1}}{3}$이고, 따라서 문제의 부등식은 $n=k+1$일 때도 성립한다.
      criteria: [1.M1]
    - id: 1b-5
      content: |
        그러므로 수학적 귀납법에 의해 문제의 부등식은 모든 자연수 $n$에 대해 성립한다.
      criteria: []
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: (도입) $n=1$일 때 부등식이 성립함을 보이고, $n=k\,(\ge1)$일 때 부등식이 성립함을 가정한다.
      steps: [1b-1, 1b-2]
    - id: 1.M1
      mark_type: M
      points: 9
      evidence: (전개·결론) 귀납법 가정을 활용하여 $n=k+1$일 때도 부등식이 성립함을 보인다.
      depends_on: [1.R1]
      not_penalized:
      - 문항 해설의 맨 마지막 문장(「그러므로 수학적 귀납법에 의해 … 성립한다」)은 쓰지 않아도 감점하지 않는다.
      steps: [1b-3, 1b-4]
    deductions:
    - code: D1-1
      condition: 수학적 귀납법이 아닌 다른 증명
      effect: zero
      value: 0
    - code: D1-2
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
