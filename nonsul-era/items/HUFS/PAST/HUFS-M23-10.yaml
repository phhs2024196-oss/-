stimuli:
- label: 조건
  body: |
    (가) 임의의 양의 실수 $a$와 $b$에 대해 $f(ab)=f(a)+f(b)-3$이다.

    (나) $f^{\prime}(1)=3$

stem: |
  ※ 다음 물음에 답하시오. 답안지에 반드시 풀이과정 또는 증명과정을 제시하시오.

  [문제 10] 양의 실수 전체의 집합에서 미분가능한 함수 $f(x)$가 다음 조건을 모두 만족시킬 때, $x=3$에서의 미분계수를 구하시오. (12점)

subparts:
- id: '1'
  stem: |
    $x=3$에서의 미분계수를 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$f^{\prime}(3)=\lim_{h\to0}\frac{f(1+\frac h3)-3}{h}=\frac13f^{\prime}(1)=1$ ($f(1)=3$).'
    steps:
    - {id: 1a, content: '$f^{\prime}(3)=\frac13\times3=1$', criteria: [1.M1, 1.B1, 1.A1]}
    hint_ladder:
    - $f(3+h)$에서 $3+h$를 $3$과 어떤 수의 곱으로 써 보자.
    - 조건 (가)에 $a=b=1$을 넣으면?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 논술가이드북 p.94
    steps:
    - id: 1b-1
      content: |
        미분계수의 정의와 조건 (가)를 이용해서 다음을 유도한다.
        $$\begin{aligned}(1)\quad f^{\prime}(3)&=\lim_{h\to0}\frac{f(3+h)-f(3)}{h}=\lim_{h\to0}\frac{f\!\left(3\left(1+\frac h3\right)\right)-f(3)}{h}\\&=\lim_{h\to0}\frac{\left\{f(3)+f\!\left(1+\frac h3\right)-3\right\}-f(3)}{h}=\lim_{h\to0}\frac{f\!\left(1+\frac h3\right)-3}{h}\end{aligned}$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        한편, 조건 (가)의 식에 $a=b=1$을 대입하면 $f(1)=f(1)+f(1)-3$이므로 $f(1)=3$이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        따라서 (1)과 조건 (나)를 이용하면
        $$f^{\prime}(3)=\lim_{h\to0}\frac{f\!\left(1+\frac h3\right)-f(1)}{h}=\frac13\lim_{h\to0}\left\{\frac{f\!\left(1+\frac h3\right)-f(1)}{\frac h3}\right\}=\frac13f^{\prime}(1)=\frac13\times3=1$$ 이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
