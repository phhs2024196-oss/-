      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: (전개) 조건 (가)의 식에 $a=b=1$을 대입해서 $f(1)=3$을 찾는다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: (결론) 도입부에서 유도한 식과 조건 (나)를 이용해서 $f^{\prime}(3)=1$을 구한다.
      depends_on: [1.M1, 1.B1]
      steps: [1b-3]
