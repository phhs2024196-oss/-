stimuli: []

stem: |
  두 다항함수 $f(x)$, $g(x)$가 다음 조건을 모두 만족시킬 때, $\dfrac{2f(100)}{g(98)\times g(99)}$의 값을 구하시오. (10점)

  (가) $f(x)g(x)=x^4-6x^3+11x^2-6x$

  (나) $\displaystyle\lim_{x\to\infty}\dfrac{f(x)}{x^3}=\dfrac12$

  (다) 극한값 $\displaystyle\lim_{x\to1}\dfrac{g(x)}{x-1}$가 존재한다.

subparts:
- id: '1'
  stem: |
    $\dfrac{2f(100)}{g(98)\times g(99)}$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '25', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (나)로 $f$는 최고차항의 계수 $\frac12$인 삼차, (다)로 $g(1)=0$이므로 $g=2(x-1)$, $f=\frac12x(x-2)(x-3)$.
    steps:
    - {id: 1a, content: '$\dfrac{2\cdot\frac12\cdot100\cdot98\cdot97}{(2\cdot97)(2\cdot98)}=25$', criteria: [1.B1, 1.B2, 1.B3, 1.M1, 1.A1]}
    hint_ladder:
    - (가)의 우변을 인수분해해 보자.
    - (나)에서 $f$의 차수와 최고차항의 계수는?
    - (다)에서 분모가 0으로 가면 분자는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 논술가이드북 p.45
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 인수분해를 통해 $f(x)g(x)=x(x-1)(x-2)(x-3)$을 얻는다. (2점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        조건 (나)에 의해 $f(x)$는 최고차항의 계수가 $\dfrac12$인 삼차함수이다. (2점)
      criteria: [1.B2]
    - id: 1b-3
      content: |
        조건 (다)에 의해 $g(x)$는 $(x-1)$로 나누어떨어진다. (2점)
      criteria: [1.B3]
    - id: 1b-4
      content: |
        과정 (i)로부터 $f(x)=\dfrac12x(x-2)(x-3)$, $g(x)=2(x-1)$임을 추론할 수 있다. (2점)
      criteria: [1.M1]
    - id: 1b-5
      content: |
        따라서 $\dfrac{2f(100)}{g(98)\times g(99)}=\dfrac{2\times\frac12\times100\times98\times97}{(2\times97)\times(2\times98)}=25$이다. (2점)
      criteria: [1.A1]
