intent: |
  곱의 인수분해, 무한대에서의 극한, 분모가 0으로 가는 극한의 존재 조건에서 두 다항함수의 정보를 모아 각각을 결정하는 능력을 본다.
key_idea: |
  $f(x)g(x)=x(x-1)(x-2)(x-3)$에서 (나)로 $f$는 최고차항의 계수가 $\frac12$인 삼차, (다)로 $g$는 $x-1$로 나누어떨어지므로 $g(x)=2(x-1)$, $f(x)=\frac12x(x-2)(x-3)$.
stuck: |
  (다)의 극한이 존재하려면 $g(1)=0$이어야 한다는 것을 일차식 $g$의 결정에 연결하는 단계
