stimuli: []

stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여

  $$\int_{-1}^{x}(x-t)f(t)dt=x^3+ax^2+bx+2\ (\text{단, }a,\ b\text{는 상수})$$

  를 만족시킬 때, $\displaystyle\int_{-1}^{a+b}f'(x)dx$의 값을 구하시오. (12점)

subparts:
- id: '1'
  stem: |
    $\displaystyle\int_{-1}^{a+b}f'(x)dx$의 값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '60', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=-1$ 대입, 미분 후 다시 $x=-1$ 대입으로 $a=4$, $b=5$. 두 번 미분하면 $f(x)=6x+8$, $f'(x)=6$.
    steps:
    - {id: 1a, content: '$\int_{-1}^{9}6\,dx=60$', criteria: [1.B1, 1.M1, 1.B2, 1.M2, 1.B3, 1.A1]}
    hint_ladder:
    - 적분 구간이 한 점이 되는 $x$를 대입해 보자.
    - 피적분함수의 $x$를 적분 기호 밖으로 꺼낼 수 있는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 논술가이드북 p.45
    steps:
    - id: 1b-1
      content: |
        주어진 식 $\int_{-1}^{x}(x-t)f(t)dt=x^3+ax^2+bx+2$ …… (1)의 양변에 $x=-1$을 대입하면 $0=-1+a-b+2$ …… (2)를 얻는다. (1점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        식 (1)의 좌변을 변형하면 $x\int_{-1}^{x}f(t)dt-\int_{-1}^{x}tf(t)dt=x^3+ax^2+bx+2$가 되고, 양변을 $x$에 대하여 미분하면 $\int_{-1}^{x}f(t)dt+xf(x)-xf(x)=3x^2+2ax+b$, 즉 $\int_{-1}^{x}f(t)dt=3x^2+2ax+b$ …… (3)이 된다. (4점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        식 (3)의 양변에 $x=-1$을 대입하면 $0=3-2a+b$ …… (4)가 된다. (1점)
      criteria: [1.B2]
    - id: 1b-4
      content: |
        이제 식 (2)와 (4)를 연립해서 $a=4$, $b=5$를 찾는다. (2점)
      criteria: [1.M2]
    - id: 1b-5
      content: |
        한편, 식 (3)의 양변을 $x$에 대하여 미분하면 $f(x)=6x+2a=6x+8$이므로 $f'(x)=6$이다. (2점)
      criteria: [1.B3]
    - id: 1b-6
      content: |
        따라서 $\displaystyle\int_{-1}^{a+b}f'(x)dx=\int_{-1}^{9}6\,dx=60$을 얻는다. (2점)
      criteria: [1.A1]
