intent: |
  적분 변수와 무관한 $x$를 적분 기호 밖으로 꺼내 미분하고, 아래끝 대입으로 미정계수를 결정하는 정적분으로 정의된 함수의 기본 처리 능력을 본다.
key_idea: |
  $x=-1$ 대입과 한 번 미분한 식 $\int_{-1}^xf(t)dt=3x^2+2ax+b$에 다시 $x=-1$을 대입해 $a=4$, $b=5$, 한 번 더 미분해 $f(x)=6x+8$.
stuck: |
