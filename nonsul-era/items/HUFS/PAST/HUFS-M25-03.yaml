stimuli: []

stem: |
  원점을 중심으로 하고 반지름의 길이가 $1$인 원 위에 두 점 $\mathrm{A}(-1,0)$, $\mathrm{B}(1,0)$이 있다. 이 원 위를 움직이는 점 $\mathrm{C}$에 대하여 두 점 $\mathrm{A}$, $\mathrm{C}$사이의 거리를 $b$라고 하고, 두 점 $\mathrm{B}$, $\mathrm{C}$사이의 거리를 $a$라고 하자. 이때 $b^4-2ba^2+a^2$의 최솟값을 구하시오. (13점)

subparts:
- id: '1'
  stem: |
    $b^4-2ba^2+a^2$의 최솟값을 구하시오.
  points: 13
  depends_on: []
  answer: {kind: value, value: '-2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a^2+b^2=4$로 소거하면 $f(b)=b^4+2b^3-b^2-8b+4$ ($0\le b\le2$), $f'(x)=2(x-1)(2x^2+5x+4)$이므로 최솟값 $f(1)=-2$.
    steps:
    - {id: 1a, content: '$f(1)=1+2-1-8+4=-2$', criteria: [1.B1, 1.R1, 1.B2, 1.M1, 1.R2, 1.A1]}
    hint_ladder:
    - 선분 AB는 원의 지름이다. $\angle\mathrm{ACB}$는?
    - $a^2$을 $b$로 나타내면 식은 $b$만의 함수가 된다. $b$의 범위는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 논술가이드북 p.46
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{C}$가 두 점 $\mathrm{A}$, $\mathrm{B}$와 다를 때 삼각형 $\mathrm{ACB}$는 직각삼각형이므로 피타고라스 정리에 의해 $b^2+a^2=4$가 된다. (2점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        이 식은 점 $\mathrm{C}$가 점 $\mathrm{A}$ 또는 점 $\mathrm{B}$와 일치할 때도 성립한다. (1점)
      criteria: [1.R1]
    - id: 1b-3
      content: |
        따라서 $b^4-2ba^2+a^2=b^4+(-2b+1)(4-b^2)=b^4+2b^3-b^2-8b+4$이다. 여기서 $b$의 범위는 $0\le b\le2$이다. (2점)
      criteria: [1.B2]
    - id: 1b-4
      content: |
        함수 $f(x)=x^4+2x^3-x^2-8x+4$의 도함수는 $f'(x)=4x^3+6x^2-2x-8=2(x-1)(2x^2+5x+4)$이고, $f'(x)=0$을 만족하는 실수 $x$는 $x=1$뿐이다. (4점)
      criteria: [1.M1]
    - id: 1b-5
      content: |
        최고차항의 계수가 양수인 사차함수의 그래프의 개형을 고려해 볼 때 함수 $f(x)$는 $x=1$에서 최솟값 $f(1)=-2$를 갖는다. (3점)
      criteria: [1.R2]
    - id: 1b-6
      content: |
        $b$의 범위는 $0\le b\le2$이므로 $b^4-2ba^2+a^2$의 최솟값은 $f(x)$의 최솟값과 같은 $-2$이다. (1점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: 직각삼각형과 피타고라스 정리로 $a^2+b^2=4$를 얻었다.
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 1
      evidence: C가 A 또는 B와 일치할 때도 $a^2+b^2=4$가 성립함을 언급했다.
      steps: [1b-2]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: 식을 $b^4+2b^3-b^2-8b+4$로 바꾸고 $0\le b\le2$를 적었다.
      steps: [1b-3]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $f'(x)=2(x-1)(2x^2+5x+4)$를 구하고 $f'(x)=0$의 실근이 $x=1$뿐임을 밝혔다.
      steps: [1b-4]
    - id: 1.R2
      mark_type: R
      points: 3
      evidence: 그래프 개형(증감)으로 $x=1$에서 최솟값 $f(1)=-2$임을 판단했다.
      steps: [1b-5]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: $1$이 $b$의 범위 안에 있으므로 구하는 최솟값이 $-2$라고 결론지었다.
      depends_on: [1.M1]
      cao: true
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수 등 사소한 실수(채점 유의사항 2)
      effect: minus
      value: 1
