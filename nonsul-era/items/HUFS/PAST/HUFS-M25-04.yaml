stimuli: []

stem: |
  수열 $\{a_n\}$이 모든 자연수 $n$에 대하여 다음 조건을 모두 만족시킬 때, $\displaystyle\sum_{n=1}^{99}\dfrac{\sin a_n}{1+\cos a_n}$의 값을 구하시오. (14점)

  (가) $\sqrt n\tan a_n=1$

  (나) $\sin a_n+\cos a_n>0$

subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{n=1}^{99}\dfrac{\sin a_n}{1+\cos a_n}$의 값을 구하시오.
  points: 14
  depends_on: []
  answer: {kind: value, value: '9', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 제1사분면 판정 → $\sin a_n=\frac1{\sqrt{n+1}}$, $\cos a_n=\sqrt{\frac n{n+1}}$ → 항 $=\sqrt{n+1}-\sqrt n$ → 합 $9$.
    steps:
    - {id: 1a, content: '$\sum_{n=1}^{99}(\sqrt{n+1}-\sqrt n)=\sqrt{100}-\sqrt1=9$', criteria: [1.R1, 1.M1, 1.A1]}
    hint_ladder:
    - $\tan a_n>0$이면 $a_n$은 어느 사분면의 각인가?
    - (나)는 어느 사분면을 배제하는가?
    - $\frac1{\sqrt{n+1}+\sqrt n}$을 유리화해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 논술가이드북 p.46
    steps:
    - id: 1b-1
      content: |
        조건 (가)에 의해 $\tan a_n$은 양수이므로 $a_n$은 제1 또는 제3 사분면의 각이다. 만약 $a_n$이 제3 사분면의 각이라면 $\sin a_n$과 $\cos a_n$은 모두 음수인데 이 경우 조건 (나)가 성립하지 않는다. 따라서 $a_n$은 제1사분면의 각이고, $\sin a_n$과 $\cos a_n$은 모두 양수이다. (4점)
      criteria: [1.R1]
    - id: 1b-2
      content: |
        조건 (가)에 의해 $\tan a_n=\dfrac{\sin a_n}{\cos a_n}=\dfrac1{\sqrt n}$ 즉, $\cos a_n=\sqrt n\sin a_n$이고 이를 $\sin^2a_n+\cos^2a_n=1$에 대입하면 $\sin a_n=\dfrac1{\sqrt{n+1}}$, $\cos a_n=\sqrt{\dfrac n{n+1}}$ …… (1)을 얻는다. (5점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        이제 (1)을 이용하여 다음을 계산한다.
        $$\sum_{n=1}^{99}\dfrac{\sin a_n}{1+\cos a_n}=\sum_{n=1}^{99}\dfrac{\frac1{\sqrt{n+1}}}{1+\sqrt{\frac n{n+1}}}=\sum_{n=1}^{99}\dfrac1{\sqrt{n+1}+\sqrt n}=\sum_{n=1}^{99}\dfrac{\sqrt{n+1}-\sqrt n}{(\sqrt{n+1}+\sqrt n)(\sqrt{n+1}-\sqrt n)}=\sum_{n=1}^{99}(\sqrt{n+1}-\sqrt n)=\sqrt{100}-\sqrt1=9$$
        (5점)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.R1
