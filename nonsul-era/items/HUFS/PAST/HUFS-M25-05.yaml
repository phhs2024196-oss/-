stimuli: []

stem: |
  모든 자연수 $n$에 대하여 다음 명제가 성립함을 수학적 귀납법으로 증명하시오. (16점)

  등식
  $(x-1)\times(x-2)\times(x-3)\times\cdots\times(x-2n)=f(x)^2-g(x)^2$
  이 성립하게 하는 두 다항식 $f(x)$, $g(x)$가 존재한다.

subparts:
- id: '1'
  stem: |
    위 명제가 모든 자연수 $n$에 대하여 성립함을 수학적 귀납법으로 증명하시오.
  points: 16
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $n=1$은 $(x-\frac32)^2-(\frac12)^2$. 귀납 단계는 새 두 인수도 $p^2-q^2$ 꼴로 쓰고 $(f^2-g^2)(p^2-q^2)=(fp+gq)^2-(fq+gp)^2$.
    steps:
    - {id: 1a, content: '$n=k+1$: $f_{k+1}=fp+gq$, $g_{k+1}=fq+gp$', criteria: [1.B1, 1.R1, 1.M1, 1.B2, 1.A1]}
    hint_ladder:
    - $n=1$일 때 $x^2-3x+2$를 완전제곱식을 써서 나타내 보자.
    - 새로 붙는 두 인수 $(x-2k-1)(x-2k-2)$도 같은 꼴로 쓸 수 있는가?
    - $(f^2-g^2)(p^2-q^2)$를 전개해 두 제곱의 차로 다시 묶어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 논술가이드북 p.47
    steps:
    - id: 1b-1
      content: |
        $(x-1)(x-2)=x^2-3x+2=\left(x-\dfrac32\right)^2-\left(\dfrac12\right)^2$이므로 $n=1$일 때 명제가 성립한다. (5점)
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $n=k$일 때 명제가 성립한다고 가정하자. 그러면 $(x-1)(x-2)(x-3)\cdots(x-2k)=f(x)^2-g(x)^2$ …… (1)을 만족시키는 두 다항식 $f(x)$, $g(x)$가 존재한다. (3점)
      criteria: [1.R1]
    - id: 1b-3
      content: |
        $n=k+1$일 때를 고려하자. 우선 $(x-1)(x-2)(x-3)\cdots(x-2(k+1))=\{(x-1)(x-2)(x-3)\cdots(x-2k)\}\times\{(x-(2k+1))(x-(2k+2))\}$ …… (2)임을 주목한다. (1점)
      criteria: [1.M1]
    - id: 1b-4
      content: |
        과정 (i)과 유사하게 $p(x)=x-\left(2k+\dfrac32\right)$, $q(x)=\dfrac12$이라고 하면 $(x-(2k+1))(x-(2k+2))=p(x)^2-q(x)^2$ …… (3)이 된다. (3점)
      criteria: [1.B2]
    - id: 1b-5
      content: |
        이제 (1), (2), (3)을 이용하여 다음을 유도한다.
        $$\begin{aligned}(x-1)(x-2)\cdots(x-2(k+1))&=\{(x-1)\cdots(x-2k)\}\times\{(x-(2k+1))(x-(2k+2))\}\\&=(f(x)^2-g(x)^2)(p(x)^2-q(x)^2)\\&=f(x)^2p(x)^2+g(x)^2q(x)^2-(f(x)^2q(x)^2+g(x)^2p(x)^2)\\&=(f(x)p(x)+g(x)q(x))^2-(f(x)q(x)+g(x)p(x))^2\end{aligned}$$
        따라서 $n=k+1$일 때도 명제가 성립한다. (4점)
      criteria: [1.A1]
    - id: 1b-6
      content: |
        수학적 귀납법으로부터 모든 자연수 $n$에 대하여 주어진 명제가 성립한다. (채점 유의사항 2: 이 단계는 작성하지 않아도 된다.)
      criteria: []
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: $(x-1)(x-2)=\left(x-\frac32\right)^2-\left(\frac12\right)^2$으로 $n=1$일 때 성립을 보였다.
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: $n=k$일 때 성립을 가정하고 식 (1)을 만족시키는 다항식 $f$, $g$를 두었다.
      steps: [1b-2]
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: $n=k+1$일 때의 곱을 $n=k$의 곱과 $(x-(2k+1))(x-(2k+2))$의 곱으로 나누었다.
      steps: [1b-3]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: $(x-(2k+1))(x-(2k+2))=p(x)^2-q(x)^2$ ($p=x-(2k+\frac32)$, $q=\frac12$)로 나타냈다.
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $(f^2-g^2)(p^2-q^2)=(fp+gq)^2-(fq+gp)^2$를 유도해 $n=k+1$일 때 성립을 결론지었다.
      depends_on: [1.M1, 1.B2]
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수 등 사소한 실수(채점 유의사항 3)
      effect: minus
      value: 1
    - code: D1-2
      condition: 수학적 귀납법이 아닌 다른 증명(채점 유의사항 1)
      effect: zero
      value: 0
