intent: |
  로그의 성질과 진수 조건, 밑 변환으로 로그부등식을 정리하고, 소인수 조건과 범위를 결합해 자연수를 결정하는 능력을 본다.
key_idea: |
  $ab=2025^2=3^8\times5^4$, $\log_{\sqrt{2025}}\sqrt{50-a}=\log_{2025}(50-a)$이므로 $(a-2)(a-40)>0$, 진수 조건 $a<50$, (가)로 $40<a<50$. 소인수가 3, 5뿐인 $a=45$.
stuck: |
  $\log_{\sqrt{2025}}\sqrt{50-a}$를 밑이 2025인 로그로 바꾸고, $40<a<50$에서 $3^p5^q$ 꼴을 찾는 단계
