stimuli:
- label: 그림
  body: |
    [그림] 좌표평면에 $x$축, $y$축과 원점 O가 있다. $x$축 위의 점 $\mathrm{P}(a,0)$, $y$축 위의 점 $\mathrm{Q}(0,10-a)$와 $\mathrm{R}(0,a-10)$을 잇는 삼각형 PQR가 그려져 있고, 삼각형 안에 세 변에 접하는 원(내접원)이 있다. 원은 $y$축(변 QR)에 원점 O에서 접하는 것처럼 그려져 있고, 중심은 $x$축 위에 있다.

stem: |
  오른쪽 그림과 같이 세 점 $\mathrm{P}(a,0)$, $\mathrm{Q}(0,10-a)$, $\mathrm{R}(0,a-10)$을 꼭짓점으로 하는 삼각형 $\mathrm{PQR}$이 있다. 이 삼각형에 내접하는 원의 반지름의 길이를 $r$이라고 할 때, $\displaystyle\lim_{a\to0+}\dfrac{r}{a}$의 값을 구하시오. (단, $0<a<10$) (18점)

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{a\to0+}\dfrac{r}{a}$의 값을 구하시오.
  points: 18
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: ['0.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 중심 $\mathrm{S}(r,0)$과 직선 PQ의 거리 $=r$에서 $r$을 $a$로 나타내고 분자를 유리화하면 $\frac{(10-a)^2}{(10-a)^2+\sqrt{(10-a)^4+a^2(10-a)^2}}\to\frac12$.
    steps:
    - {id: 1a, content: '$\dfrac{10^2}{10^2+\sqrt{10^4}}=\dfrac12$', criteria: [1.R1, 1.M1, 1.B1, 1.A1]}
    hint_ladder:
    - 이등변삼각형의 내접원 중심은 어디에 있는가? 변 QR는 $y$축 위에 있다.
    - 중심에서 직선 PQ까지의 거리가 반지름이다.
    - $\frac00$ 꼴이면 분자를 유리화해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025학년도 논술가이드북 p.49
    steps:
    - id: 1b-1
      content: |
        삼각형 $\mathrm{PQR}$은 이등변삼각형이므로 내접원의 중심은 밑변 $\mathrm{QR}$의 수직이등분선인 $x$축 위에 있다. 따라서 내접원의 중심은 $\mathrm{S}(r,0)$이다. (3점)
      criteria: [1.R1]
    - id: 1b-2
      content: |
        두 점 $\mathrm{P}$, $\mathrm{Q}$를 지나는 직선의 방정식은 $y=\dfrac{a-10}{a}(x-a)$ 즉, $(10-a)x+ay-(10-a)a=0$이다. 원의 중심 $\mathrm{S}(r,0)$과 직선 사이의 거리는 원의 반지름의 길이인 $r$이므로 $\dfrac{\lvert(10-a)r-(10-a)a\rvert}{\sqrt{(10-a)^2+a^2}}=r$이 성립한다. (5점)
      criteria: [1.M1]
    - id: 1b-3
      content: |
        위 식의 양변을 제곱하고 정리하면 $a^2r^2+2a(10-a)^2r-(10-a)^2a^2=0$을 얻게 되고, $a$와 $r$은 양수이므로 $r=\dfrac{-(10-a)^2+\sqrt{(10-a)^4+a^2(10-a)^2}}{a}$이 된다. (4점)
      criteria: [1.B1]
    - id: 1b-4
      content: |
        따라서
        $$\begin{aligned}\lim_{a\to0+}\dfrac ra&=\lim_{a\to0+}\dfrac{-(10-a)^2+\sqrt{(10-a)^4+a^2(10-a)^2}}{a^2}\\&=\lim_{a\to0+}\dfrac{\left(-(10-a)^2+\sqrt{(10-a)^4+a^2(10-a)^2}\right)\times\left((10-a)^2+\sqrt{(10-a)^4+a^2(10-a)^2}\right)}{a^2\times\left((10-a)^2+\sqrt{(10-a)^4+a^2(10-a)^2}\right)}\\&=\lim_{a\to0+}\dfrac{(10-a)^2}{(10-a)^2+\sqrt{(10-a)^4+a^2(10-a)^2}}=\dfrac{10^2}{10^2+\sqrt{10^4}}=\dfrac12\end{aligned}$$
        을 찾는다. (6점)
      criteria: [1.A1]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 넓이 $=$ 반둘레 $\times r$ 이용(공식 해설 아님, 내 풀이).
    steps:
    - id: 2-1
      content: |
        넓이 $\frac12\cdot2(10-a)\cdot a=a(10-a)$, 둘레의 절반 $\sqrt{a^2+(10-a)^2}+(10-a)$이므로 $r=\dfrac{a(10-a)}{\sqrt{a^2+(10-a)^2}+(10-a)}$, $\dfrac ra\to\dfrac{10}{10+10}=\dfrac12$.
      criteria: []
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: 이등변삼각형의 대칭으로 내접원의 중심이 $\mathrm{S}(r,0)$임을 밝혔다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 직선 PQ의 방정식을 세우고 중심과 직선 사이의 거리가 $r$이라는 식을 세웠다.
      steps: [1b-2]
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: 이차방정식을 풀어 양수 조건으로 $r$을 $a$에 대한 식으로 나타냈다.
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: 분자 유리화 등으로 $\lim_{a\to0+}\frac ra=\frac12$를 계산했다.
      depends_on: [1.M1]
      cao: true
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수 등 사소한 실수(채점 유의사항 2)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술(채점 유의사항 3)
      effect: zero
      value: 0
