  이등변삼각형의 대칭성으로 내접원의 중심을 정하고 점과 직선 사이의 거리로 반지름을 매개변수의 식으로 나타낸 뒤, 무리식의 유리화로 $\frac00$ 꼴 극한을 계산하는 능력을 본다.
