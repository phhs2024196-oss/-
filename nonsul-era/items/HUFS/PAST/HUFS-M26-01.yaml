stimuli: []

stem: |
  ※ 다음 물음에 답하시오. 답안지에 반드시 풀이과정 또는 증명과정을 제시하시오.

  [문제 1] 등차수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하고, 수열 $\{b_n\}$을 $b_n=S_{n+2}-a_{n+1}$이라 할 때, 수열 $\{a_n\}$과 $\{b_n\}$은 다음 조건을 만족한다.

  (가) 모든 $n$에 대하여 $a_n$은 자연수이다.

  (나) $(b_2-b_1)(b_3-b_2)=70$

  이때 $b_5$의 값을 구하시오. (10점)

subparts:
- id: '1'
  stem: |
    $b_5$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '54', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $b_{n+1}-b_n=a_{n+2}$이므로 $a_3a_4=70$, 증가하는 자연수 등차수열이고 $a_2>0$이어야 하므로 $a_3=7$, $a_4=10$, $a_n=3n-2$, $b_5=S_7-a_6=70-16=54$.
    steps:
    - {id: 1a, content: '$b_{n+1}-b_n=a_{n+2}$, $a_3a_4=70$, $(a_3,a_4)=(7,10)$, $a=1$, $d=3$, $b_5=54$', criteria: [1.R1, 1.M1, 1.B1, 1.B2, 1.A1]}
    hint_ladder:
    - $b_{n+1}-b_n$을 $S$끼리, $a$끼리 묶어 정리해 보라.
    - 조건 (나)는 수열 $\{a_n\}$의 어떤 두 항의 곱인가?
    - 70의 약수 쌍 중 $a_2=2a_3-a_4$가 자연수가 되는 것은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026학년도 논술가이드북 p.46(PDF p.48) 문항 해설
    steps:
    - id: 1b-1
      content: |
        (i) 등차수열 $\{a_n\}$의 첫째항을 $a$, 공차를 $d$라 할 때, 조건 (가)에 의해 모든 $n$에 대하여 $a_n$은 자연수이므로 $a$와 $d$도 모두 자연수이며,
        $$a_n<a_{n+1}\quad\cdots(1)$$
        가 된다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        (ii) 수열 $\{b_n\}$의 정의가 $b_n=S_{n+2}-a_{n+1}$이므로
        $$b_{n+1}-b_n=(S_{n+3}-a_{n+2})-(S_{n+2}-a_{n+1})=(S_{n+3}-S_{n+2})-(a_{n+2}-a_{n+1})=a_{n+3}-d=a_{n+2}\quad\cdots(2)$$
        이다. 한편, 조건 (나)에 (2)를 적용하면
        $$(b_2-b_1)(b_3-b_2)=a_3\times a_4=70\quad\cdots(3)$$
        이 된다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        이제 (1), (3)을 만족하는 $a_3$과 $a_4$를 찾으면 $(a_3,a_4)=(1,70),\ (2,35),\ (5,14),\ (7,10)$이다. $a_3$의 값이 $1,2,5$인 경우는 $a_2$의 값이 모두 음수가 되므로 조건 (가)가 성립되지 않는다. 따라서
        $$a_3=7,\ a_4=10\quad\cdots(4)$$
        이 된다.
      criteria: [1.B1]
    - id: 1b-4
      content: |
        그러므로 (4)로부터 수열 $\{a_n\}$은 첫째항 $a$가 $1$이고 공차 $d$가 $3$인 등차수열이다. $\cdots(5)$
      criteria: [1.B2]
    - id: 1b-5
      content: |
        (iii) (5)로부터 $b_5=S_7-a_6=\dfrac{7(2\times1+6\times3)}{2}-(1+3\times5)=70-16=54$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: 조건 (가)에서 첫째항 $a$와 공차 $d$가 자연수이고 $a_n<a_{n+1}$임을 적었다. (채점기준 도입 2점)
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $b_{n+1}-b_n=a_{n+2}$를 유도하고 조건 (나)를 $a_3a_4=70$으로 바꾸었다.
      steps: [1b-2]
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: 70의 약수 쌍 중 $a_2>0$(조건 (가))을 만족하는 $a_3=7$, $a_4=10$만 남김을 근거와 함께 적었다.
      steps: [1b-3]
    - id: 1.B2
      mark_type: B
      points: 1
      evidence: 첫째항 1, 공차 3을 구했다. (채점기준 전개 6점 = 2+3+1)
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $b_5=S_7-a_6=70-16=54$. (채점기준 결론 2점)
      depends_on: [1.M1]
      cao: true
      steps: [1b-5]
