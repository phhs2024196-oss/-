      points: 3
      evidence: $b=2a^{\frac12}$과 $b=a^2$에서 관계식 $b=a^2=2a^{\frac12}$을 얻었다. (채점기준 전개 6점 = 3+3)
      steps: [1b-3]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: $a^3=4$, $b^3=16$을 각각 구했다.
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: $a^3+b^3=20$. (채점기준 결론 3점 = 2+1)
      depends_on: [1.M1]
      cao: true
      steps: [1b-5]
