stimuli: []

stem: |
  [문제 2] 1보다 큰 두 상수 $a$, $b$[판독확인: 원본은 $a$와 $b$ 사이 쉼표가 공백으로 보임]에 대하여 $x$에 대한 이차방정식
  $$x^2-\frac{5(\log b-\log2)}{\log a}x+\frac{2\log a}{\log b}=0$$
  의 두 근이 $\log_ab$, $\log_ba$일 때, $a^3+b^3$의 값을 구하시오. (12점)

subparts:
- id: '1'
  stem: |
    $a^3+b^3$의 값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '20', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 곱 $1=2\log_ba$에서 $\log_ab=2$, 합 $\dfrac52=5\log_a\dfrac b2$에서 $b=2\sqrt a$. $a^2=2\sqrt a$이므로 $a^3=4$, $b^3=a^6=16$, 합 20.
    steps:
    - {id: 1a, content: '$\log_ab=2$, $\log_ba=\dfrac12$, $b=a^2=2a^{\frac12}$, $a^3=4$, $b^3=16$, $a^3+b^3=20$', criteria: [1.M1, 1.B1, 1.B2, 1.B3, 1.A1]}
    hint_ladder:
    - 두 근 $\log_ab$, $\log_ba$의 곱은 항상 얼마인가?
    - 두 근의 곱을 이차방정식의 계수로 쓰면?
    - $\dfrac{\log b-\log2}{\log a}$를 하나의 로그로 쓰면?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026학년도 논술가이드북 p.47(PDF p.49) 문항 해설
    steps:
    - id: 1b-1
      content: |
        (i) 이차방정식의 근과 계수의 관계로부터
        $$\log_ab+\log_ba=\frac{5(\log b-\log2)}{\log a}=5\log_a\frac b2\quad\cdots(1)$$
        $$\log_ab\times\log_ba=\frac{2\log a}{\log b}=2\log_ba\quad\cdots(2)$$
        이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (ii) (2)에 의해 $\log_ab=2$이므로 이차방정식의 두 근 $\log_ab$, $\log_ba$는
        $$\log_ab=2,\quad\log_ba=\frac{1}{\log_ab}=\frac12$$
        이 된다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        따라서 (1)에서 $5\log_a\dfrac b2=2+\dfrac12=\dfrac52$ 즉, $\log_a\dfrac b2=\dfrac12$이므로 $b=2a^{\frac12}$이다. 또한 $\log_ab=2$로부터 $b=a^2$이므로
        $$b=a^2=2a^{\frac12}\quad\cdots(3)$$
        이다.
      criteria: [1.B2]
    - id: 1b-4
      content: |
        (iii) (3)에서 $a^2=2a^{\frac12}$으로부터 $a^4=4a$이므로 $a^3=4$이고, $b=a^2$으로부터 $b^3=a^6=(a^3)^2=16$이다.
      criteria: [1.B3]
    - id: 1b-5
      content: |
        그러므로 $a^3+b^3=4+16=20$이다.
      criteria: [1.A1]
