stimuli: []

stem: |
  [문제 3] 두 실수 $x$, $y$가 다음 조건을 만족시킬 때, $\tan(x+y)$의 최댓값을 구하시오. (13점)

  (가) $0\le x\le\pi$, $0\le y\le\pi$

  (나) $\cos^2x+\cos^2y=\dfrac32$

  (다) $\sin x\sin y=\dfrac14$

subparts:
- id: '1'
  stem: |
    $\tan(x+y)$의 최댓값을 구하시오.
  points: 13
  depends_on: []
  answer: {kind: value, value: sqrt(3), equivalents: ['3**(1/2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\sin^2x+\sin^2y=\dfrac12$, $\sin^2x\sin^2y=\dfrac1{16}$에서 $\sin^2x=\sin^2y=\dfrac14$, 범위에서 $\sin x=\sin y=\dfrac12$. $x,y\in\left\{\dfrac\pi6,\dfrac{5\pi}6\right\}$이므로 $\tan(x+y)\in\{0,\sqrt3,-\sqrt3\}$, 최댓값 $\sqrt3$.
    steps:
    - {id: 1a, content: '$\sin x=\sin y=\dfrac12$, $x+y=\pi,\ \dfrac\pi3,\ \dfrac{5\pi}3$, 최댓값 $\tan\dfrac\pi3=\sqrt3$', criteria: [1.M1, 1.M2, 1.B1, 1.B2, 1.B3, 1.A1]}
    hint_ladder:
    - 조건 (나)를 $\sin$으로 바꾸면?
    - $\sin^2x$와 $\sin^2y$의 합과 곱을 알면 무엇을 세울 수 있는가?
    - $[0,\pi]$에서 $\sin x=\dfrac12$인 $x$는 몇 개인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026학년도 논술가이드북 p.48(PDF p.50) 문항 해설
    steps:
    - id: 1b-1
      content: |
        (i) 조건 (나)에 의해 $\cos^2x+\cos^2y=(1-\sin^2x)+(1-\sin^2y)=\dfrac32$이므로
        $$\sin^2x+\sin^2y=\frac12\quad\cdots(1)$$
        이 된다. 조건 (다)에 주어진 식의 양변을 제곱하면
        $$\sin^2x\sin^2y=\frac1{16}\quad\cdots(2)$$
        이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (ii) $\sin^2x=a$, $\sin^2y=b$라 하면, (1), (2)로부터 $a+b=\dfrac12$, $ab=\dfrac1{16}$이고, 이차방정식의 근과 계수의 관계로부터 $a$, $b$는 $t$에 대한 이차방정식
        $$t^2-\frac12t+\frac1{16}=\left(t-\frac14\right)^2=0\quad\cdots(3)$$
        의 두 근임을 알 수 있다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 (3)으로부터 $a=b=\dfrac14$이므로, $\sin^2x=\sin^2y=\dfrac14$이 된다. 조건 (가)에 의해 $0\le x\le\pi$, $0\le y\le\pi$이므로
        $$\sin x=\sin y=\frac12\quad\cdots(4)$$
        이다.
      criteria: [1.B1]
    - id: 1b-4
      content: |
        (iii) 이제 (4)를 만족시키는 $x$, $y$를 모두 찾으면
        $$\left(x,y\right)=\left(\frac\pi6,\frac{5\pi}6\right),\ \left(\frac{5\pi}6,\frac\pi6\right),\ \left(\frac\pi6,\frac\pi6\right),\ \left(\frac{5\pi}6,\frac{5\pi}6\right)$$
        이다.
      criteria: [1.B2]
    - id: 1b-5
      content: |
        따라서 가능한 $x+y$의 값은 $\pi$, $\dfrac\pi3$, $\dfrac{5\pi}3$이고, $\tan(x+y)$의 값은 $0$, $\sqrt3$, $-\sqrt3$이 된다.
      criteria: [1.B3]
    - id: 1b-6
      content: |
        그러므로 $\tan(x+y)$의 최댓값은 $\sqrt3$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: (나), (다)에서 $\sin^2x+\sin^2y=\dfrac12$, $\sin^2x\sin^2y=\dfrac1{16}$의 두 방정식을 얻었다. (채점기준 도입 3점)
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $\sin^2x$, $\sin^2y$를 두 근으로 하는 이차방정식 $t^2-\dfrac12t+\dfrac1{16}=0$을 세웠다.
      steps: [1b-2]
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: $\sin^2x=\sin^2y=\dfrac14$와 범위 (가)에서 $\sin x=\sin y=\dfrac12$을 얻었다. (채점기준 전개 4점 = 2+2)
      steps: [1b-3]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: (가)를 만족하는 $(x,y)$ 네 쌍을 모두 찾았다.
      steps: [1b-4]
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: $x+y=\pi,\ \dfrac\pi3,\ \dfrac{5\pi}3$과 $\tan(x+y)=0,\ \sqrt3,\ -\sqrt3$을 구했다.
      steps: [1b-5]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: 최댓값 $\sqrt3$. (채점기준 결론 6점 = 3+2+1)
      depends_on: [1.M1]
      cao: true
      steps: [1b-6]
