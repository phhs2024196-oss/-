stimuli: []

stem: |
  [문제 4] 삼차함수 $f(x)$에 대하여 다음 조건을 만족시키는 모든 실수 $\alpha$값의 합을 구하시오. (단, $\alpha\ne1$) (14점)

  (가) 최고차항의 계수가 $1$이다.

  (나) 함수 $\lvert f(x)\rvert$는 $x=\alpha$와 $x=1$에서만 극솟값을 갖고, 극솟값은 모두 $0$이다.

  (다) $f'(0)=15$

subparts:
- id: '1'
  stem: |
    조건을 만족시키는 모든 실수 $\alpha$값의 합을 구하시오.
  points: 14
  depends_on: []
  answer: {kind: value, value: '5', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(\alpha)=f(1)=0$이고 세 번째 근이 있으면 그곳도 $\lvert f\rvert$의 극소점이 되므로 중근. $f=(x-\alpha)^2(x-1)$에서 $\alpha=-5,3$, $f=(x-1)^2(x-\alpha)$에서 $\alpha=7$. 합 $5$.
    steps:
    - {id: 1a, content: "중근이 $\\alpha$: $f'(0)=\\alpha^2+2\\alpha=15$, $\\alpha=-5,3$. 중근이 1: $f'(0)=2\\alpha+1=15$, $\\alpha=7$. 합 $5$", criteria: [1.R1, 1.M1, 1.M2, 1.B1, 1.M3, 1.B2, 1.A1]}
    hint_ladder:
    - $\lvert f(x)\rvert$의 극솟값이 $0$인 점은 $f$의 어떤 점인가?
    - $f$가 서로 다른 세 실근을 가지면 $\lvert f\rvert$의 극소점은 몇 개인가?
    - 중근이 $\alpha$인 경우만 생각하지 않았는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026학년도 논술가이드북 p.49(PDF p.51) 문항 해설
    steps:
    - id: 1b-1
      content: |
        (i) 조건 (나)에 의해 함수 $\lvert f(x)\rvert$는 $x=\alpha\ (\alpha\ne1)$와 $x=1$에서만 극솟값을 가지므로 함수 $\lvert f(x)\rvert$의 그래프의 개형은 다음 그림과 같이 두 가지 경우만 있다.

        [그림] 두 그래프 모두 $y=\lvert f(x)\rvert$(실선)와 $y=f(x)$(점선)를 함께 그린 것이다. 왼쪽: 왼쪽 근에서 $x$축에 닿아 꺾이고 위로 볼록한 봉우리를 지나 오른쪽 점에서 $x$축에 접한 뒤 다시 올라가는 개형(오른쪽 점이 중근). 오른쪽: 왼쪽 점에서 $x$축에 접하고(중근) 봉우리를 지나 오른쪽 근에서 $x$축에 닿아 꺾인 뒤 올라가는 개형으로, 그 사이 $f(x)$(점선)는 $x$축 아래로 내려갔다 올라온다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        따라서
        $$f(\alpha)=0,\quad f(1)=0\quad\cdots(1)$$
        이고, $f'(\alpha)=0$ 또는 $f'(1)=0$임을 유추할 수 있다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        (ii) $f'(\alpha)=0$인 경우, 조건 (가)와 (1)에 의해
        $$f(x)=(x-\alpha)^2(x-1)=(x^2-2\alpha x+\alpha^2)(x-1),\quad f'(x)=(2x-2\alpha)(x-1)+(x^2-2\alpha x+\alpha^2)\quad\cdots(2)$$
        이다.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        조건 (다)에서 $f'(0)=15$이므로 (2)에 의해 $f'(0)=\alpha^2+2\alpha=15$가 된다. 즉, $\alpha^2+2\alpha-15=(\alpha+5)(\alpha-3)=0$이므로 $\alpha=-5$ 또는 $\alpha=3$이다.
      criteria: [1.B1]
    - id: 1b-5
      content: |
        (iii) $f'(1)=0$인 경우, 조건 (가)와 (1)에 의해
        $$f(x)=(x-1)^2(x-\alpha)=(x^2-2x+1)(x-\alpha),\quad f'(x)=(2x-2)(x-\alpha)+(x^2-2x+1)\quad\cdots(3)$$
        이고,
      criteria: [1.M3]
    - id: 1b-6
      content: |
        (3)에 $f'(0)=2\alpha+1=15$에 의해 $\alpha=7$이 된다.
      criteria: [1.B2]
    - id: 1b-7
      content: |
        (iv) 따라서 모든 조건을 만족시키는 실수 $\alpha$의 값은 $-5,\ 3,\ 7$이고, 이들의 합은 $5$이다.
      criteria: [1.A1]
