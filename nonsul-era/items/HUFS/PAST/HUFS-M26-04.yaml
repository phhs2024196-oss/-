      points: 2
      evidence: $f'(1)=0$인 경우 $f(x)=(x-1)^2(x-\alpha)$와 $f'(x)$를 적었다.
      steps: [1b-5]
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: $2\alpha+1=15$에서 $\alpha=7$을 구했다. (채점기준 전개 8점 = 2+2+2+2)
      steps: [1b-6]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: 모든 $\alpha$의 합 $-5+3+7=5$. (채점기준 결론 1점)
