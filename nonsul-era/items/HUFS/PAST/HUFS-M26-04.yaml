intent: $\lvert f(x)\rvert$의 극솟값 조건을 그래프 개형으로 해석하여 삼차함수가 $x=\alpha$ 또는 $x=1$에서 중근을 가져야 함을 찾고, 두 경우로 나누어 미분 조건으로 $\alpha$를 결정하는 능력을 본다.
key_idea: '$\lvert f\rvert$의 극솟값이 $x=\alpha$, $x=1$에서만 나오고 모두 0이므로 $f(\alpha)=f(1)=0$이고 나머지 근이 없어야 하므로 중근. $f=(x-\alpha)^2(x-1)$이면 $\alpha^2+2\alpha=15$, $f=(x-1)^2(x-\alpha)$이면 $2\alpha+1=15$. $\alpha=-5,3,7$, 합 5.'
