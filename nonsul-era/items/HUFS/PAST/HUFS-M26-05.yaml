stimuli: []

stem: |
  [문제 5] 함수 $f(x)=\begin{cases}-2(x+1) & (x\le0)\\ \dfrac12x-5 & (x>0)\end{cases}$에 대하여 다음 조건을 만족시키는 모든 실수 $a$의 값의 합을 구하시오. (16점)

  함수 $g(x)=f(x)f(x-a)$는 $x=a$에서 연속이다.

subparts:
- id: '1'
  stem: |
    조건을 만족시키는 모든 실수 $a$의 값의 합을 구하시오.
  points: 16
  depends_on: []
  answer: {kind: value, value: '9', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a=0$이면 좌우극한 $4\ne25$로 불연속. $a\ne0$이면 $x=a$에서 $f(x)$는 연속이고 $f(x-a)$만 끊기므로 $f(a)\cdot(-5)=f(a)\cdot(-2)$, 곧 $f(a)=0$. $a=-1$, $10$, 합 $9$.
    steps:
    - {id: 1a, content: '$a=0$ 제외, $a\ne0$에서 $f(a)=0$ → $a=-1,\ 10$, 합 $9$', criteria: [1.R1, 1.B1, 1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $f(x)$는 어디에서 불연속인가? 그렇다면 $f(x-a)$는?
    - $a=0$인 경우와 아닌 경우의 차이는?
    - 불연속인 인수에 곱해진 다른 인수의 값이 $0$이면?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026학년도 논술가이드북 p.50(PDF p.52) 문항 해설
    steps:
    - id: 1b-1
      content: |
        (i) 함수 $f(x)$는 $x=0$에서 불연속이므로 함수 $f(x-a)$는 $x=a$에서 불연속이다. ([그림] $y=f(x)$의 그래프: $x\le0$에서 $(0,-2)$까지의 직선, $x>0$에서 $(0,-5)$에서 시작하는 직선)
      criteria: [1.R1]
    - id: 1b-2
      content: |
        (ii) $a=0$일 때, $g(x)=\{f(x)\}^2$이 되고,
        $$\lim_{x\to a+}g(x)=\lim_{x\to0+}\{f(x)\}^2=25,\qquad\lim_{x\to a-}g(x)=\lim_{x\to0-}\{f(x)\}^2=4$$
        즉, $\displaystyle\lim_{x\to a+}g(x)\ne\lim_{x\to a-}g(x)$이므로 $a=0$일 때 함수 $g(x)$는 $x=a$에서 불연속이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        (iii) $a\ne0$일 때, $f(x)$는 $x=a$에서 연속이므로
        $$\lim_{x\to a+}g(x)=\lim_{x\to a+}f(x)f(x-a)=-5f(a),\qquad\lim_{x\to a-}g(x)=\lim_{x\to a-}f(x)f(x-a)=-2f(a),\qquad g(a)=f(a)f(0)=-2f(a)$$
        이다.
      criteria: [1.M1]
    - id: 1b-4
      content: |
        따라서 함수 $g(x)$가 $x=a$에서 연속이 되기 위해서는
        $$-5f(a)=-2f(a)\ \text{즉},\ f(a)=0\quad\cdots(1)$$
        이어야 한다.
      criteria: [1.M2]
    - id: 1b-5
      content: |
        (iv) (1)을 만족시키는 $a$의 값은 $-1$과 $10$이 되고, 이러한 모든 실수 $a$의 값의 합은 $-1+10=9$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: $f(x)$가 $x=0$에서 불연속이고 $f(x-a)$가 $x=a$에서 불연속임을 적었다(그래프는 그리지 않아도 됨). (채점기준 도입 3점)
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $a=0$일 때 우극한 25, 좌극한 4로 $g$가 불연속임을 보였다.
      steps: [1b-2]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $a\ne0$일 때 우극한 $-5f(a)$, 좌극한 $-2f(a)$, 함숫값 $-2f(a)$를 구했다.
      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 연속 조건을 $f(a)=0$으로 정리했다. (채점기준 전개 9점 = 3+3+3)
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $f(a)=0$에서 $a=-1$, $10$을 찾고 합 $9$를 구했다. (채점기준 결론 4점)
      depends_on: [1.M2]
      cao: true
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명이 없이 답만 기술
      effect: zero
      value: 0
