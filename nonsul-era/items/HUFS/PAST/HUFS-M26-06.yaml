intent: 다항함수의 극한으로 차수와 최고차항을 정하고, 정적분의 구간 분할 성질로 두 적분이 0이 됨을 끌어내어 계수를 매개변수 $a$로 나타낸 뒤, $f(-1)$을 $a$의 이차함수로 최대화하는 능력을 본다.
key_idea: '$\int_{-a}^{2a}=\int_0^{2a}+\int_{-a}^0$이므로 세 적분이 같으면 $\int_0^{2a}f=\int_{-a}^0f=0$. $f=x^2+bx+c$에서 $b=-\dfrac23a$, $c=-\dfrac23a^2$, $f(-1)=-\dfrac23\left(a-\dfrac12\right)^2+\dfrac76$, 최댓값 $\dfrac76$.'
stuck: 적분 구간의 덧셈으로 「세 적분이 같다」를 「두 적분이 모두 0」으로 바꾸는 단계와, 계수를 $a$로 표현한 뒤 $f(-1)$을 다시 $a$의 함수로 보는 2단 최적화
