stem: |
  [문제 1] 다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    곡선 $y=e^x\,(0\le x\le\ln t)$와 $y$축, 직선 $y=t$로 둘러싸인 도형을 밑면으로 하는 두 입체도형 $\mathrm{A}$와 $\mathrm{B}$가 있다. 도형 $\mathrm{A}$는 $y$축에 수직인 평면으로 자른 단면이 모두 정사각형이고, 도형 $\mathrm{B}$는 $x$축에 수직인 평면으로 자른 단면이 모두 정삼각형이다. 도형 $\mathrm{A}$의 부피를 $V(t)$, 도형 $\mathrm{B}$의 부피를 $W(t)$라 할 때, 극한값 $\displaystyle\lim_{t\to\infty}\frac{\ln t}{t}\,\frac{W(t)}{V(t)}$를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 'sqrt(3)/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $V(t)=\int_1^t(\ln y)^2dy$, $W(t)=\frac{\sqrt3}{4}\int_0^{\ln t}(t-e^x)^2dx$를 구하면 $V\sim t(\ln t)^2$, $W\sim\frac{\sqrt3}{4}t^2\ln t$이다.
    steps:
    - {id: 1a, content: '$\dfrac{\ln t}{t}\dfrac{W}{V}=\dfrac{\frac{\sqrt3}{4}(t^2\ln^2t-\cdots)}{t^2\ln^2t-\cdots}\to\dfrac{\sqrt3}{4}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $y$축에 수직인 단면의 한 변은 $y$의 어떤 함수인가?
    - 두 부피의 최고차항은 각각 무엇인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 자체평가보고서 2021 문항카드5 p.54(인쇄 52쪽 이후 7. 예시 답안)'
    steps:
    - id: 1b-1
      content: |
        높이 $y\,(1\le y\le t)$에서 도형 A의 단면은 한 변이 $\ln y$인 정사각형이고, $x\,(0\le x\le\ln t)$에서 도형 B의 단면은 한 변이 $t-e^x$인 정삼각형이므로
        $V(t)=\displaystyle\int_1^t(\ln y)^2dy$, $W(t)=\dfrac{\sqrt3}{4}\displaystyle\int_0^{\ln t}(t-e^x)^2dx$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        부분적분을 이용하면
        $V(t)=\big[y(\ln y)^2\big]_1^t-2\displaystyle\int_1^t\ln y\,dy=t(\ln t)^2-2\big[y\ln y-y\big]_1^t=t(\ln t)^2-2t\ln t+2t-2$이고,
        $W(t)=\dfrac{\sqrt3}{4}\displaystyle\int_0^{\ln t}\left(e^{2x}-2te^x+t^2\right)dx=\dfrac{\sqrt3}{4}\left[\dfrac12e^{2x}-2te^x+t^2x\right]_0^{\ln t}=\dfrac{\sqrt3}{4}\left(t^2\ln t-\dfrac32t^2+2t-\dfrac12\right)$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        따라서
        $\dfrac{\ln t}{t}\dfrac{W(t)}{V(t)}=\dfrac{\sqrt3}{4}\cdot\dfrac{t^2(\ln t)^2-\frac32t^2\ln t+2t\ln t-\frac12\ln t}{t^2(\ln t)^2-2t^2\ln t+2t^2-2t}$이고, 분모·분자를 $t^2(\ln t)^2$으로 나누면
        $\displaystyle\lim_{t\to\infty}\frac{\ln t}{t}\frac{W(t)}{V(t)}=\frac{\sqrt3}{4}\lim_{t\to\infty}\frac{1-\frac{3}{2\ln t}+\frac{2}{t\ln t}-\frac{1}{2t^2\ln t}}{1-\frac{2}{\ln t}+\frac{2}{(\ln t)^2}-\frac{2}{t(\ln t)^2}}=\frac{\sqrt3}{4}$이다.
        (공식 예시답안은 $\lim\frac{W}{V}=\infty$까지만 적고 $\frac{\ln t}{t}$ 인수를 빠뜨렸다. 발문대로 계산하면 $\frac{\sqrt3}{4}$.)
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        정적분을 이용하여 $V(t)=t(\ln t)^2-2t\ln t+2t-2$, $W(t)=\dfrac{\sqrt3}{4}\left(t^2\ln t-\dfrac32t^2+2t-\dfrac12\right)$을 정확히 구했다(공식 채점기준 20/100점 → 10점 환산).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        최고차항으로 나누어 극한값 $\dfrac{\sqrt3}{4}$를 구했다(공식 10/100점 → 5점 환산).
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    양의 실수 $t$에 대하여 곡선 $y=(x+1)^{\frac32}\,(-1\le x\le t)$의 길이를 $l(t)$라 하고, 이 곡선 위의 점 $\left(t,\,(t+1)^{\frac32}\right)$과 원점 사이의 거리를 $d(t)$라 하자. 이때 극한값 $\displaystyle\lim_{t\to\infty}\frac{l(t)}{d(t)}$를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $l(t)=\frac{8}{27}\left\{\left(\frac94t+\frac{13}{4}\right)^{3/2}-1\right\}$, $d(t)=\sqrt{t^2+(t+1)^3}$이고 둘 다 $t^{3/2}$ 차수이다.
    steps:
    - {id: 2a, content: '$\dfrac{l}{d}\to\dfrac{8}{27}\left(\dfrac94\right)^{3/2}=1$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 곡선의 길이 공식 $\int\sqrt{1+(y')^2}\,dx$를 쓰자.
    - 분모·분자를 $t^{3/2}$으로 나누어 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 자체평가보고서 2021 문항카드5 p.54–55(인쇄 54–55쪽 예시 답안 2)'
    steps:
    - id: 2b-1
      content: |
        $y'=\dfrac32(x+1)^{\frac12}$이므로
        $l(t)=\displaystyle\int_{-1}^t\sqrt{1+\frac94(x+1)}\,dx=\int_{-1}^t\sqrt{\frac94x+\frac{13}{4}}\,dx=\left[\frac{8}{27}\left(\frac94x+\frac{13}{4}\right)^{\frac32}\right]_{-1}^t=\frac{8}{27}\left(\frac94t+\frac{13}{4}\right)^{\frac32}-\frac{8}{27}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        한편 $d(t)=\sqrt{t^2+\left((t+1)^{\frac32}\right)^2}=\sqrt{t^2+(t+1)^3}$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        따라서 $\dfrac{l(t)}{d(t)}=\dfrac{8}{27}\cdot\dfrac{\left(\frac94t+\frac{13}{4}\right)^{\frac32}-1}{\sqrt{t^2+(t+1)^3}}$이고, 분모와 분자를 $t^{\frac32}$로 나누면
        $\displaystyle\lim_{t\to\infty}\frac{l(t)}{d(t)}=\lim_{t\to\infty}\frac{8}{27}\cdot\frac{\left(\frac94+\frac{13}{4}\cdot\frac1t\right)^{\frac32}-\left(\frac1t\right)^{\frac32}}{\sqrt{\frac1t+\left(1+\frac1t\right)^3}}=\frac{8}{27}\left(\frac94\right)^{\frac32}=1$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        곡선의 길이 $l(t)=\dfrac{8}{27}\left(\dfrac94t+\dfrac{13}{4}\right)^{\frac32}-\dfrac{8}{27}$와 거리 $d(t)=\sqrt{t^2+(t+1)^3}$을 정확히 구했다(공식 30/100점 → 15점 환산).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $t^{\frac32}$으로 나누어 극한값 $1$을 구했다(공식 10/100점 → 5점 환산).
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    자연수 $n$에 대하여 한 변의 길이가 $n^2-12n+37$인 정사각형의 넓이를 $a_n$, 한 변의 길이가 $2n+1$인 정사각형의 넓이를 $b_n$이라고 하자. $\dfrac{a_n}{b_n}$이 최소가 되는 $n$을 구하고, 이때 $\dfrac{a_n}{b_n}$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 'n = 6; ratio = 1/169', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=\dfrac{(x^2-12x+37)^2}{(2x+1)^2}$의 도함수 부호는 $x^2+x-43$이 결정하므로 $x=\frac{-1+\sqrt{173}}{2}\in(6,7)$에서 최소이고, $n=6,7$을 비교한다.
    steps:
    - {id: 3a, content: '$\dfrac{a_6}{b_6}=\dfrac{1}{13^2}<\dfrac{4}{15^2}=\dfrac{a_7}{b_7}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 자연수 $n$ 대신 양의 실수 $x$에 대한 함수로 보자.
    - 연속함수의 최소점이 정수가 아니면 어느 정수들을 비교해야 하는가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 자체평가보고서 2021 문항카드5 p.57(인쇄 55쪽 예시 답안 3)'
    steps:
    - id: 3b-1
      content: |
        양의 실수 $x$에 대하여 $f(x)=\dfrac{(x^2-12x+37)^2}{(2x+1)^2}$이라 하면
        $f'(x)=\dfrac{2(x^2-12x+37)(2x-12)(2x+1)^2-(x^2-12x+37)^2\cdot2(2x+1)\cdot2}{(2x+1)^4}=\dfrac{4(x^2-12x+37)\{(x-6)(2x+1)-(x^2-12x+37)\}}{(2x+1)^3}=\dfrac{4(x^2-12x+37)(x^2+x-43)}{(2x+1)^3}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $x^2-12x+37=(x-6)^2+1>0$이고 $x>0$일 때 $(2x+1)^3>0$이므로 $f'(x)$의 부호는 $x^2+x-43$이 결정한다. $x^2+x-43=0$의 양의 근은 $x=\dfrac{-1+\sqrt{173}}{2}$이고,
        $0<x<\dfrac{-1+\sqrt{173}}{2}$에서 $f'(x)<0$, $x>\dfrac{-1+\sqrt{173}}{2}$에서 $f'(x)>0$이므로 $f$는 $x=\dfrac{-1+\sqrt{173}}{2}$에서 최소이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        $13<\sqrt{173}<14$이므로 $6<\dfrac{-1+\sqrt{173}}{2}<\dfrac{13}{2}<7$이다. 따라서 $n=6$ 또는 $n=7$에서 $\dfrac{a_n}{b_n}$이 최소가 된다.
        $\dfrac{a_6}{b_6}=\dfrac{1}{13^2}<\dfrac{4}{15^2}=\dfrac{a_7}{b_7}$이므로 $n=6$일 때 최솟값 $\dfrac{a_6}{b_6}=\dfrac{1}{169}$을 갖는다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        몫의 미분으로 $f'(x)=\dfrac{4(x^2-12x+37)(x^2+x-43)}{(2x+1)^3}$을 구하고 증감을 조사해 최소점 $\dfrac{-1+\sqrt{173}}{2}$을 찾았다(공식 20/100점 → 10점 환산).
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        $n=6,7$을 비교해 $n=6$, $\dfrac{a_6}{b_6}=\dfrac{1}{169}$을 구했다(공식 10/100점 → 5점 환산).
      depends_on: [3.M1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0412}
  misconceptions:
