key_idea: |
  단면의 넓이를 적분해 부피를, $\int\sqrt{1+(y')^2}\,dx$로 곡선의 길이를 구한 뒤 최고차항으로 나누어 극한을 구하고, 몫의 미분으로 증감을 조사해 정수 $n$에서의 최소를 판정한다.
stuck: |
  (1) 도형 A의 단면이 $y$축에 수직이므로 $y$에 대해 적분해야 한다는 점, $(\ln t)/t$ 인수까지 포함한 차수 비교. (3) 연속함수의 최소점 $\frac{-1+\sqrt{173}}{2}$이 정수가 아니므로 양옆 정수 $n=6,7$을 비교해야 한다는 점.
