stimuli:
- label: 제시문
  body: |
    $1$ 이하의 모든 양의 실수 $a$, $b$, $c$와 $abcd=1$을 만족시키는 실수 $d$에 대하여 부등식
    $$a+b+c+d+\frac{1}{abc+abd+acd+bcd}\ge M$$
    을 만족시키는 양의 실수 $M$의 최댓값을 다음과 같이 구하고자 한다.
    위 부등식을 아래와 같이 쓰자.
    $$a+b+c+\frac{1}{abc}+\frac{1}{abc+\frac1a+\frac1b+\frac1c}\ge M$$
    $f(x)=a+b+x+\dfrac{1}{abx}+\dfrac{1}{abx+\frac1a+\frac1b+\frac1x}$ (단, $0<x\le1$)이라 하면,
    $$f^\prime(x)=\frac{\boxed{\ (\text{ㄱ})\ }}{x^2}\left\{\frac{1}{\left(abx+\frac1a+\frac1b+\frac1x\right)^2}-\frac{1}{ab}\right\}\le0$$
    이므로 $f(c)\ge f(1)$이 성립한다.
    이번에는 $f(1)=g(b)$가 되도록 $g(x)=a+x+1+\dfrac{1}{ax}+\dfrac{1}{ax+\frac1a+\frac1x+1}$ (단, $0<x\le1$)이라 하면,
    $g^\prime(x)\le0$이므로 $g(b)\ge g(1)$이 성립한다.
    마지막으로 $g(1)=h\!\left(a+\dfrac1a+2\right)$가 되는 $h(x)$를 생각하면……
    (이하 생략)

stem: |
  [문제 2] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    제시문의 (ㄱ)에 알맞은 수식을 쓰고 $f^\prime(x)\le0$인 이유를 설명하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '1 - a*b*x**2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\frac{d}{dx}\left(x+\frac1{abx}\right)=\frac{abx^2-1}{abx^2}$와 둘째 항의 미분을 묶으면 공통인수 $\frac{1-abx^2}{x^2}$가 나온다.
    steps:
    - {id: 1a, content: '(ㄱ)$=1-abx^2\ge0$, 괄호 안은 $\le\frac19-1<0$', criteria: ['1.M1', '1.R1']}
    hint_ladder:
    - $f(x)$의 각 항을 미분해 $\frac{1}{x^2}$을 묶어 보자.
    - $a,b,x\le1$이면 $\frac1a+\frac1b+\frac1x$는 얼마 이상인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 자체평가보고서 2021 문항카드6 p.60(인쇄 58쪽 예시 답안 1)'
    steps:
    - id: 1b-1
      content: |
        $f^\prime(x)=1-\dfrac{1}{abx^2}-\dfrac{ab-\frac{1}{x^2}}{\left(abx+\frac1a+\frac1b+\frac1x\right)^2}=\dfrac{1-abx^2}{x^2}\left\{\dfrac{1}{\left(abx+\frac1a+\frac1b+\frac1x\right)^2}-\dfrac{1}{ab}\right\}$이므로 (ㄱ)은 $1-abx^2$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $a$, $b$, $x$는 $1$ 이하이므로 $1-abx^2\ge0$이고, $\left(abx+\frac1a+\frac1b+\frac1x\right)^2\ge9$이므로 $\dfrac{1}{\left(abx+\frac1a+\frac1b+\frac1x\right)^2}\le\dfrac19$, 또 $\dfrac{1}{ab}\ge1$이므로
        $\left\{\dfrac{1}{\left(abx+\frac1a+\frac1b+\frac1x\right)^2}-\dfrac{1}{ab}\right\}\le0$이다. 따라서 $f^\prime(x)\le0$이다.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        (ㄱ)에 $1-abx^2$를 정확히 썼다(공식 10/100점 → 5점 환산).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: |
        $1-abx^2\ge0$이고 괄호 안이 $\frac19-\frac1{ab}\le0$ 이하임을 근거로 $f^\prime(x)\le0$을 설명했다(공식 10/100점 → 5점 환산).
      depends_on: []
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0412}
  misconceptions:
  - id: MC-CAL-0412
    outcome_code: '71'
    wrong_work: '$\left(\dfrac{1}{u}\right)^\prime=\dfrac{u^\prime}{u^2}$로 부호를 바꿔 (ㄱ)$=abx^2-1$로 씀'
    detect_cue: (ㄱ)의 부호가 반대이고 괄호 안 부호 판정과 모순
    feedback: $\left(\dfrac1u\right)^\prime=-\dfrac{u^\prime}{u^2}$입니다. 몫의 미분에서 순서와 부호를 확인하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    제시문에서 생략된 마지막 과정을 완성하여 $M$의 최댓값을 구하시오.
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: '17/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $h(x)=x+\frac1x$ ($x\ge4$)는 증가하므로 $h\!\left(a+\frac1a+2\right)\ge h(4)=\frac{17}{4}$, 등호는 $a=b=c=d=1$.
    steps:
    - {id: 2a, content: '$f(c)\ge f(1)=g(b)\ge g(1)=h(a+\frac1a+2)\ge h(4)=\frac{17}{4}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $g(1)$을 $a+\frac1a+2$ 하나의 식으로 정리해 보자.
    - $a+\frac1a+2$의 범위는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 자체평가보고서 2021 문항카드6 p.60–61(인쇄 58–59쪽 예시 답안 2)'
    steps:
    - id: 2b-1
      content: |
        $g(1)=a+\dfrac1a+2+\dfrac{1}{a+\frac1a+2}$이므로 $g(1)=h\!\left(a+2+\frac1a\right)$이 되도록 $h(x)=x+\dfrac1x$라고 정의하자. 단 $a+2+\dfrac1a\ge4$이므로 $h(x)$는 $x\ge4$에서 정의한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이제 $h^\prime(x)=1-\dfrac{1}{x^2}$이고 $\dfrac{1}{x^2}\le\dfrac{1}{16}\le1$이므로 $h^\prime(x)\ge0$이다. $\therefore h\!\left(2+a+\frac1a\right)\ge h(4)=4+\dfrac14=\dfrac{17}{4}$.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        따라서 $f(c)\ge f(1)=g(b)\ge g(1)=h\!\left(a+\frac1a+2\right)\ge h(4)=\dfrac{17}{4}$이고 이 값은 $a=b=c=1$일 때의 값이므로 $M$의 최댓값은 $\dfrac{17}{4}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        $h(x)=x+\frac1x$를 $x\ge4$에서 정의하고 $h^\prime(x)\ge0$을 보여 $f(c)\ge f(1)=g(b)\ge g(1)\ge h(4)$의 연쇄를 명확히 설명했다(공식 30/100점 → 15점 환산).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        등호 조건 $a=b=c=1$을 밝히고 최댓값 $\dfrac{17}{4}$을 얻었다(공식 10/100점 → 5점 환산).
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    다음 부등식을 만족시키는 양의 실수 $K$의 최댓값을 제시문과 동일한 방법으로 구하시오. (단, 실수 $a$, $b$, $c$, $d$는 제시문과 동일한 조건을 만족한다.)
    $$2(a+b+c+d)+\frac{17}{abc+abd+acd+bcd}\ge K$$
  points: 20
  depends_on: ['1', '2']
  answer: {kind: value, value: '49/4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $A(a+b+c+d)+\frac{B}{\cdots}$로 일반화하면 각 단계의 감소·증가 조건은 $A\ge\frac B9$, $A\ge\frac B{16}$이고 $A=2$, $B=17$은 이를 만족하므로 $K=4A+\frac B4$.
    steps:
    - {id: 3a, content: '$K_{\max}=h(4)=4\cdot2+\frac{17}{4}=\frac{49}{4}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 계수를 $A$, $B$로 두고 $f^\prime(x)$를 다시 구해 보자.
    - $\frac{17}{9}\le2$인가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 자체평가보고서 2021 문항카드6 p.61(인쇄 59쪽 예시 답안 3)'
    steps:
    - id: 3b-1
      content: |
        일반적으로 양의 실수 $A$, $B$에 대해 제시문과 문항 2의 과정을 반복하면
        $A(a+b+c+d)+\dfrac{B}{abc+abd+acd+bcd}=A\left(a+b+c+\dfrac1{abc}\right)+\dfrac{B}{abc+\frac1a+\frac1b+\frac1c}$,
        $f(x)=A\left(a+b+x+\dfrac{1}{abx}\right)+\dfrac{B}{abx+\frac1a+\frac1b+\frac1x}$,
        $f^\prime(x)=\dfrac{1-abx^2}{x^2}\left\{\dfrac{B}{\left(abx+\frac1a+\frac1b+\frac1x\right)^2}-\dfrac{A}{ab}\right\}$이다.
        $\left(abx+\frac1a+\frac1b+\frac1x\right)^2\ge9$, $\dfrac{B}{(\cdots)^2}\le\dfrac B9$, $\dfrac{A}{ab}\ge A$이므로 $A\ge\dfrac B9$이면 $f^\prime(x)\le0$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $g(x)=A\left(a+x+1+\dfrac1{ax}\right)+\dfrac{B}{ax+\frac1a+\frac1x+1}$, $g^\prime(x)=\dfrac{1-ax^2}{x^2}\left\{\dfrac{B}{\left(ax+\frac1a+\frac1x+1\right)^2}-\dfrac Aa\right\}$이므로 $A\ge\dfrac B9$이면 $g^\prime(x)\le0$.
        $h(x)=Ax+\dfrac Bx$ ($x\ge4$), $h^\prime(x)=A-\dfrac{B}{x^2}$이고 $\dfrac{B}{x^2}\le\dfrac{B}{16}\le\dfrac B9$이므로 $\dfrac B9\le A$이면 $h^\prime(x)\ge0$.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        $A=2$, $B=17$일 때 $\dfrac{17}{9}\le2$이므로 각 단계에 필요한 부등식을 모두 만족한다.
        $\therefore h\!\left(2+a+\frac1a\right)\ge h(4)=4A+\dfrac B4=8+\dfrac{17}{4}=\dfrac{49}{4}$가 $K$의 최댓값이 된다(등호 $a=b=c=d=1$).
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        계수가 바뀐 $f$, $g$, $h$에 대해 도함수 부호 조건($A\ge\frac B9$ 등)을 확인하며 제시문과 같은 연쇄 부등식을 명확히 설명했다(공식 30/100점 → 15점 환산).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1, 2.M1], max_points: 15}
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        최댓값 $\dfrac{49}{4}$를 얻었다(공식 10/100점 → 5점 환산).
      depends_on: [3.M1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

