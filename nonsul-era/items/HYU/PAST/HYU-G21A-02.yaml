  도함수를 이용하여 절대부등식을 도출하는 과정을 제시하고, 그 과정을 이해했는지와 계수가 바뀐 다른 경우에 같은 방법을 적용할 수 있는지를 물어 수학적 독해능력과 적용능력을 평가한다(문항카드6 출제 의도 요지).
key_idea: |
  변수를 하나씩 함수의 변수로 보고 감소함을 보여 $1$로 밀어 올리는 '한 변수씩 고정' 기법: $f(c)\ge f(1)=g(b)\ge g(1)=h\!\left(a+\frac1a+2\right)\ge h(4)$.
stuck: |
  $h(x)=x+\frac1x$를 산술·기하평균으로 얻은 $x=a+\frac1a+2\ge4$ 범위에서만 보아야 증가함을 쓸 수 있다는 점, (3)에서 계수 $A=2$, $B=17$이 각 단계의 조건 $A\ge\frac B9$, $A\ge\frac{B}{16}$를 만족하는지 확인하는 점.
