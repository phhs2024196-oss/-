intent: |
  삼각함수의 덧셈정리와 치환적분법을 주요 내용으로, 정사각형에 내접하는 삼각형이 갖는 성질을 분석하고 정확한 논증으로 결과를 도출할 수 있는지를 본다(문항카드8 출제 의도 요지).
key_idea: |
  $\angle\mathrm{HAQ}=s$로 두면 $\overline{\mathrm{AH}}=\frac{\cos s}{\cos t}=\frac{\cos(\frac\pi4-s)}{\cos(\frac\pi4-t)}$에서 $s=t$, 즉 $\overline{\mathrm{AH}}=1$로 H가 사분원 위에 있음을 보이고, 넓이를 $t$, $s$의 식으로 나타내 치환적분한다.
stuck: |
  (1) H가 그리는 곡선이 반지름 $1$인 사분원임을 알아채는 것($\triangle\mathrm{DAQ}\equiv\triangle\mathrm{HAQ}$), (3) 정삼각형이 정사각형 안에 있도록 하는 $s$의 범위 $\left[\frac\pi4,\frac{5\pi}{12}\right]$와 한 변 $a=\frac{1}{\sin(s+\frac\pi6)}$을 구하는 것.
