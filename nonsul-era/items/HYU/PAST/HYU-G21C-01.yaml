intent: |
  귀납적으로 정의된 수열에서 첨자 $k$의 형태(이진 구조)에 따라 항의 값을 분류하고, 조건을 만족하는 $k$의 개수를 세어 수열의 합과 정적분의 관계(구분구적법)로 극한을 구할 수 있는지를 본다(문항카드9 채점 기준·예시 답안 기준 요지, 출제 의도 쪽은 미판독).
key_idea: |
  $a_k$의 값은 $2021$, $2019$, $2^{2020}$보다 큰 수 셋뿐이다: $2021\xrightarrow{\text{ㄴ}}2021$, $2021\xrightarrow{\text{ㄷ}}2019$, $2019\xrightarrow{\text{ㄴ}}2019$, $2019\xrightarrow{\text{ㄷ}}3^{2020}+2018$, 큰 수는 계속 큰 수. 따라서 $k=2^m$, $2^m+1$, $2^l(2^m+1)$ 꼴만 작다.
stuck: |
  $k$를 $2^l(2^m+1)$처럼 'ㄴ·ㄷ을 적용한 순서'로 분해해 보는 발상, 그리고 $c_n=\frac{n(n-1)}{2}$를 얻은 뒤 $S_n=\frac1n\sum\frac{2}{1+t/n}$을 정적분으로 바꾸는 것.
idea_tags: [IDEA-BINARY-INDEX-RECURSION, IDEA-STATE-CLASSIFICATION, IDEA-RIEMANN-SUM-LIMIT]
tags: [기출, 한양대, 귀납적 정의, 수열, 구분구적법, 배점환산, 배점추정]
