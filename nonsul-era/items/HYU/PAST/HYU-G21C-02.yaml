intent: |
  합성함수의 미분법으로 주어진 함수를 미분하고, 곡선의 길이 공식과 평균값 정리·극한의 대소 관계를 활용해 극한값을 계산하며, 부정적분의 형태를 추론해 제시된 값을 계산할 수 있는지를 본다(문항카드10 문항 해설 요지).
key_idea: |
  $\int\sqrt{1+e^x}\,dx=f(x)$ ($a=2$, $b=1$)를 알아낸 뒤, 곡선 길이를 $\frac12\{f(2k+2e^{-k})-f(2k)\}$로 바꾸어 평균값 정리·조임정리로 극한을 구하고, $F$의 성장을 $2f$와 유계인 로그 적분으로 나누어 본다.
stuck: |
  (1) 도함수 조건을 $e^x$에 대한 항등식으로 바꿔 계수를 비교하는 것, (2) $x=2t$ 치환으로 $f$의 차로 나타내는 것, (3) $\int_0^x\ln\frac{\sqrt{1+e^t}-1}{\sqrt{1+e^t}+1}dt$를 $-\ln\frac{\sqrt2+1}{\sqrt2-1}\cdot x$와 $0$ 사이로 묶는 것.
