intent: |
  서로 접하는 원들의 반지름에서 도출되는 수열을 추적해 값을 얻어내는 능력, 미분방정식으로 주어진 함수의 성질을 이용해 적분값을 함수와 $n$의 식으로 나타내고 극한을 구하는 능력, 이항정리·치환적분·부분적분으로 적분값을 $n$의 식으로 나타내고 극한을 구하는 능력을 평가한다(문항카드 문항 해설 요지).
key_idea: |
  (1) 반지름 $a$, $b$인 두 원과 직선에 접하는 원의 반지름 $r$은 $\frac{1}{\sqrt r}=\frac{1}{\sqrt a}+\frac{1}{\sqrt b}$이므로 $c_n=\frac{1}{\sqrt{r_n}}$은 이웃한 두 값의 합으로 생긴다. (2) $u=f(x)$ 치환으로 $a_n=2\left(\sqrt{2-f(2021n)}-\sqrt{2-f(\frac1n)}\right)$. (3) $b_n=\int_{e^{-1}}^1t(t+1)^ndt$를 부분적분.
stuck: |
  (1) 직선에 접하는 세 원의 관계식 $\sqrt r=\frac{1}{1/\sqrt a+1/\sqrt b}$을 세우고 $c_n$이 작은 순으로 채워 넣는 트리(1,1→2→3,3→4,5,5,4→…)를 만드는 것, (2) $\lim_{n\to\infty}f(n)=0$을 $\ln f$의 부등식으로 보이는 것.
idea_tags: [IDEA-DESCARTES-TANGENT-CIRCLES-LINE, IDEA-ODE-SUBSTITUTION-INTEGRAL, IDEA-BINOMIAL-SUBSTITUTION-BYPARTS]
tags: [기출, 한양대, 의예과, 접하는 원, 미분방정식, 적분과 극한, 배점환산, 배점추정]
