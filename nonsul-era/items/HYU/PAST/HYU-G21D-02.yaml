stimuli:
- label: 가
  body: |
    평면 위에 반지름이 $1$인 원 $C$와 $D$가 서로 접하고 있다. 원 $C$와 $D$는 각각 직선 $l$과 서로 다른 점에서 접한다. 원 $C$, $D$, 직선 $l$에 둘러싸인 영역을 $A$라고 하자.
- label: 나
  body: |
    양의 실수 전체의 집합에서 미분가능한 함수 $f(x)$가
    $$0<f(x)<2,\qquad f^\prime(x)=-f(x)\sqrt{2-f(x)},\qquad \lim_{t\to0+}f(t)=2$$
    를 만족시킨다.
- label: 다
  body: |
    $e=\displaystyle\lim_{x\to0}(1+x)^{\frac1x}=2.71828\ldots$

stem: |
  [문제 2] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    제시문 <가>에서 직선 $l$에 접하면서 영역 $A$에 들어갈 수 있는 가장 큰 원을 $C_1$이라 하자.
    영역 $A$에서 원 $C_1$, $\cdots$, $C_n$의 내부를 제외한 영역에 들어가고, 그 중심이 원 $C_1$, $\cdots$, $C_n$의 중심과 다르며, 직선 $l$에 접하는 가장 큰 원 하나를 택하여 $C_{n+1}$이라 하자.
    원 $C_{12}$의 반지름을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '1/49', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $c=\frac{1}{\sqrt r}$이면 새 원의 $c$는 접하는 두 원의 $c$의 합이고, 작은 $c$부터 채우면 $2;3,3;4,4;5,5,5,5;6,6;7,7,7,7$.
    steps:
    - {id: 1a, content: '$c_{12}=7$, $r_{12}=\frac{1}{49}$', criteria: ['1.R1', '1.A1']}
    hint_ladder:
    - 반지름 $a$, $b$인 두 원과 직선에 동시에 접하는 원의 반지름을 구해 보자.
    - $\frac{1}{\sqrt r}$로 바꾸면 덧셈이 된다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 자체평가보고서 2021 의예과 문제 2 문항카드 p.90–91(인쇄 88–89쪽 예시 답안 [2-1])'
    steps:
    - id: 1b-1
      content: |
        직선 $l$에 접하는 두 원의 반지름이 $a$, $b$라고 할 때, 이 두 원에 접하고 직선에 접하는 원의 반지름 $r$을 구하면
        $(a+b)^2=(a-b)^2+d^2$이므로 $d=2\sqrt{ab}$이고, $d=\sqrt{(a+r)^2-(a-r)^2}+\sqrt{(b+r)^2-(b-r)^2}=2\sqrt{ab}$에서
        $\sqrt r=\dfrac{1}{\frac{1}{\sqrt a}+\frac{1}{\sqrt b}}$ …(★)를 얻을 수 있다.
      criteria: ['1.R1']
    - id: 1b-2
      content: |
        원 $C$, $D$에서 시작하여 $C_1,C_2,\dots$의 반지름 $r_1,r_2,\dots$에 대해 $c_n=\dfrac{1}{\sqrt{r_n}}$으로 정의하면, 원 $C_n$이 직선 $l$과 원 $C_k$, $C_m$에 접할 때 (★)에 의해 $\dfrac{1}{\sqrt{r_n}}=\dfrac{1}{\sqrt{r_k}}+\dfrac{1}{\sqrt{r_m}}$, 즉 $c_n=c_k+c_m$이다.
        $A$의 영역 중 가장 큰 원부터 채워 넣어야 하므로 $c_n$이 작은 순서대로 위 계산을 반복한다.
        [그림: $C$, $D$의 $c=1,1$에서 시작해 $2$ → $3,3$ → $4,4$ → $5,5,5,5$ → $6,6$ → $7,7,7,7$ … 이웃한 두 값을 더해 가는 트리]
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        따라서 $c_{12}=c_{13}=c_{14}=c_{15}=7$이므로 $r_{12}=\left(\dfrac17\right)^2=\dfrac{1}{49}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 10
      evidence: |
        관계식 $\frac{1}{\sqrt r}=\frac{1}{\sqrt a}+\frac{1}{\sqrt b}$을 유도하고 $c_n$이 작은 순서로 채워지는 계산 과정을 명확히 설명했다(공식 20/100점 → 10점 환산).
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $r_{12}=\dfrac{1}{49}$을 정확히 얻었다(공식 10/100점 → 5점 환산).
      depends_on: [1.R1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    수열 $\{a_n\}$은 모든 자연수 $n$에 대하여
    $$a_n=\int_{\frac1n}^{2021n}f(x)\,dx$$
    를 만족시킨다. $\displaystyle\lim_{n\to\infty}a_n$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '2*sqrt(2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $u=f(x)$로 치환하면 $a_n=2\left(\sqrt{2-f(2021n)}-\sqrt{2-f(\frac1n)}\right)$이고 $f(0+)=2$, $f(\infty)=0$이다.
    steps:
    - {id: 2a, content: '$\lim a_n=2\sqrt{2-0}-0=2\sqrt2$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $f$는 감소하는 일대일 함수이다. $u=f(x)$로 치환해 보자.
    - $\lim_{n\to\infty}f(n)$은 얼마인가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 자체평가보고서 2021 의예과 문제 2 문항카드 p.91(인쇄 89쪽 예시 답안 [2-2])'
    steps:
    - id: 2b-1
      content: |
        제시문 <나>에 의하여 구간 $(0,\infty)$에서 $f^\prime(x)<0$이므로 $f(x)$는 감소하고 일대일 함수이다. $u=f(x)$로 치환하면
        $a_n=\displaystyle\int_{\frac1n}^{2021n}f(x)\,dx=\int_{f(\frac1n)}^{f(2021n)}u\frac{du}{f^\prime(x)}=-\int_{f(\frac1n)}^{f(2021n)}\frac{u\,du}{u\sqrt{2-u}}=-\int_{f(\frac1n)}^{f(2021n)}\frac{du}{\sqrt{2-u}}=2\left(\sqrt{2-f(2021n)}-\sqrt{2-f\left(\tfrac1n\right)}\right)$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        가정에 의하여 $\displaystyle\lim_{n\to\infty}\sqrt{2-f\left(\tfrac1n\right)}=\sqrt{2-\lim_{t\to0+}f(t)}=0$이다.
        $(0,\infty)$에서 $0<f(x)<2$이고 감소하므로 $\sqrt{2-f(x)}$는 $0<\sqrt{2-f(x)}<\sqrt2$이고 증가한다.
        자연수 $n$에 대하여 $\displaystyle\int_1^n\sqrt{2-f(x)}\,dx\ge\sqrt{2-f(1)}\,(n-1)$이고, 한편 $\displaystyle\int_1^n\sqrt{2-f(x)}\,dx=-\int_1^n\frac{f^\prime(x)}{f(x)}dx=-\left(\ln f(n)-\ln f(1)\right)$이므로 $\ln f(n)-\ln f(1)\le-\sqrt{2-f(1)}\,(n-1)$.
        따라서 $\displaystyle\lim_{n\to\infty}\ln f(n)=-\infty$, 즉 $\displaystyle\lim_{n\to\infty}f(2021n)=\lim_{n\to\infty}f(n)=0$.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        그러므로 $\displaystyle\lim_{n\to\infty}a_n=2\lim_{n\to\infty}\sqrt{2-f(2021n)}=2\sqrt2$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: |
        $u=f(x)$ 치환으로 $a_n=2\left(\sqrt{2-f(2021n)}-\sqrt{2-f(\frac1n)}\right)$처럼 $f$와 $n$의 식으로 나타냈다(공식 15/100점 → 7.5점, 정수화하여 8점 [배점추정]).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 7
      evidence: |
        $f\left(\frac1n\right)\to2$, $f(2021n)\to0$의 근거를 밝혀 $\lim a_n=2\sqrt2$를 구했다(공식 15/100점 → 7점 [배점추정]).
      depends_on: [2.M1]
      steps: [2b-2, 2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    수열 $\{b_n\}$은 모든 자연수 $n$에 대하여
    $$b_n=\int_0^1e^{-(n+2)x}(1+e^x)^n\,dx$$
    를 만족시킨다. $\displaystyle\lim_{n\to\infty}\frac{n}{2^n}b_n$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $t=e^{-x}$로 $b_n=\int_{e^{-1}}^1t(t+1)^ndt$이고 부분적분하면 주항은 $\frac{2^{n+1}}{n+1}$, 나머지는 $\left(\frac{1+e^{-1}}{2}\right)^n\to0$ 꼴이다.
    steps:
    - {id: 3a, content: '$\frac{n}{2^n}b_n=\frac{2n}{n+1}-\frac{4n}{(n+1)(n+2)}+(\to0)\to2$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $e^{-(n+2)x}(1+e^x)^n=e^{-2x}(1+e^{-x})^n$이다.
    - $t=e^{-x}$로 치환한 뒤 부분적분하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 자체평가보고서 2021 의예과 문제 2 문항카드 p.91–92(인쇄 89–90쪽 예시 답안 [2-3] <해 1>)'
    steps:
    - id: 3b-1
      content: |
        이항정리에 의하여 $b_n=\displaystyle\int_0^1e^{-(n+2)x}\sum_{k=0}^{n}{}_n\mathrm{C}_k\,e^{(n-k)x}dx=\sum_{k=0}^{n}{}_n\mathrm{C}_k\int_0^1e^{-(k+2)x}dx$이고, $t=e^{-x}$로 치환하면
        $b_n=\displaystyle\sum_{k=0}^{n}{}_n\mathrm{C}_k\int_{e^{-1}}^1t^{k+1}dt=\int_{e^{-1}}^1t(t+1)^n\,dt$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        부분적분법에 의하여
        $\displaystyle\int_{e^{-1}}^1t(t+1)^ndt=\left[\frac{t(t+1)^{n+1}}{n+1}\right]_{e^{-1}}^1-\frac{1}{n+1}\int_{e^{-1}}^1(t+1)^{n+1}dt=\frac{2^{n+1}-e^{-1}(1+e^{-1})^{n+1}}{n+1}-\frac{2^{n+2}-(1+e^{-1})^{n+2}}{(n+1)(n+2)}$.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        따라서
        $\dfrac{n}{2^n}b_n=\dfrac{2n}{n+1}-\dfrac{e^{-1}(1+e^{-1})n}{n+1}\left(\dfrac{1+e^{-1}}{2}\right)^n-\dfrac{4n}{(n+1)(n+2)}+\dfrac{(1+e^{-1})^2n}{(n+1)(n+2)}\left(\dfrac{1+e^{-1}}{2}\right)^n$ …(★★)
        제시문 <다>에 의하여 $\dfrac{1+e^{-1}}{2}\in(0,1)$이므로 $\displaystyle\lim_{n\to\infty}\left(\frac{1+e^{-1}}{2}\right)^n=0$. 그러므로 $\displaystyle\lim_{n\to\infty}\frac{n}{2^n}b_n=2$.
      criteria: ['3.A1']
  - id: S3-ALT
    audience: ALT
    method_no: 2
    source_flow: '선행학습 영향평가 자체평가보고서 2021 의예과 문제 2 문항카드 p.92(인쇄 90쪽 [2-3] <해 2>)'
    key_idea: |
      $\frac{1}{n+1}\frac{d}{dx}(1+e^{-x})^{n+1}=-e^{-x}(1+e^{-x})^n$을 이용해 $b_n=\int_0^1e^{-x}\cdot e^{-x}(1+e^{-x})^ndx$를 바로 부분적분한다.
    steps:
    - id: 3c-1
      content: |
