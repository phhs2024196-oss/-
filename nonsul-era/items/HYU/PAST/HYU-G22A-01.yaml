stimuli:
- label: 제시문
  body: |
    공간에서 두 평면 $\alpha$와 $\beta$의 교선을 $l$이라 하고, 두 평면이 이루는 각의 크기를 $\theta\left(0<\theta<\dfrac{\pi}{2}\right)$라고 하자.

stem: |
  [문제 1] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    평면 $\alpha$ 위에 삼각형 $\mathrm{ABC}$가 있다. $\overline{\mathrm{AB}}=\overline{\mathrm{AC}}=1$이고 각 $\mathrm{A}$는 직각이며 선분 $\mathrm{BC}$는 직선 $l$과 평행할 때, 선분 $\mathrm{AB}$의 평면 $\beta$ 위로의 정사영의 길이를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'sqrt(2)/2*sqrt(1 + cos(theta)**2)', equivalents: ['sqrt(1/2 + cos(theta)**2/2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\mathrm{BC}\parallel l$이므로 $\mathrm{B'C'}=\sqrt2$, 높이만 $\cos\theta$배가 된다.
    steps:
    - id: 1a
      content: |
        $h=\dfrac{1}{\sqrt2}$, $h'=\dfrac{\cos\theta}{\sqrt2}$, $\overline{\mathrm{A'B'}}=\sqrt{\dfrac12+\dfrac12\cos^2\theta}$
      criteria: [1.M1, 1.A1]
    hint_ladder:
    - 교선 $l$에 평행한 선분의 정사영은 길이가 어떻게 되는가?
    - 삼각형의 높이(교선에 수직인 방향)는 몇 배로 줄어드는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드7 예시답안 1 (PDF p.83, 인쇄 p.81)'
    steps:
    - id: 1b-1
      content: |
        삼각형 $\mathrm{ABC}$의 평면 $\beta$ 위로의 정사영을 $\mathrm{A'B'C'}$이라 하고, $h$, $h'$을 각각 삼각형 $\mathrm{ABC}$와 $\mathrm{A'B'C'}$의 높이라 하자. $\mathrm{BC}\parallel l$이므로 $\overline{\mathrm{B'C'}}=\overline{\mathrm{BC}}=\sqrt2$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $h=\sin45^\circ=\dfrac{1}{\sqrt2}$이고, 높이는 $l$에 수직이므로 $h'=h\cdot\cos\theta=\dfrac{1}{\sqrt2}\cos\theta$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $\mathrm{A'}$에서 내린 수선의 발은 $\mathrm{B'C'}$의 중점이므로
        $\overline{\mathrm{A'B'}}=\sqrt{\dfrac12+\dfrac12\cos^2\theta}=\dfrac{\sqrt2}{2}\sqrt{1+\cos^2\theta}$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        길이를 구하는 과정이 명료하게 기술되었다(교선에 평행한 변은 그대로, 높이는 $\cos\theta$배임을 밝힘). [카드 배점 20 → 10]
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        선분 $\mathrm{A'B'}$의 길이 $\dfrac{\sqrt2}{2}\sqrt{1+\cos^2\theta}$를 정확히 구했다. [카드 배점 10 → 5]
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    평면 $\alpha$ 위에 점 $\mathrm{P}$와 $\mathrm{Q}$가 있다. $\overline{\mathrm{PQ}}=1$이고 직선 $\mathrm{PQ}$가 직선 $l$과 이루는 각의 크기를 $t$라고 할 때, 선분 $\mathrm{PQ}$의 평면 $\beta$ 위로의 정사영의 길이를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'sqrt(sin(t)**2*cos(theta)**2 + cos(t)**2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $\mathrm{PQ}$를 빗변으로, 한 변은 $l$에 수직($\sin t$), 한 변은 $l$에 평행($\cos t$)인 직각삼각형을 만든다.
    steps:
    - id: 2a
      content: |
        $\overline{\mathrm{P'R'}}=\sin t\cos\theta$, $\overline{\mathrm{R'Q'}}=\cos t$, $\overline{\mathrm{P'Q'}}=\sqrt{\sin^2t\cos^2\theta+\cos^2t}$
      criteria: [2.M1, 2.A1]
    hint_ladder:
    - 1.처럼 $l$에 평행한 변과 수직인 변을 갖는 직각삼각형을 만들어 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드7 예시답안 2 (PDF p.83, 인쇄 p.81)'
    steps:
    - id: 2b-1
      content: |
        선분 $\mathrm{PQ}$를 가장 긴 변으로 하고, 직선 $\mathrm{PR}\perp l$, 직선 $\mathrm{RQ}\parallel l$인 평면 $\alpha$ 위의 직각삼각형 $\mathrm{PRQ}$를 생각한다. 이때 $\angle\mathrm{Q}=t$, $\overline{\mathrm{PR}}=\sin t$, $\overline{\mathrm{RQ}}=\cos t$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        삼각형 $\mathrm{PQR}$의 평면 $\beta$ 위로의 정사영을 $\mathrm{P'Q'R'}$이라 하면 $\angle\mathrm{R'}=90^\circ$인 직각삼각형이고 $\overline{\mathrm{P'R'}}=\sin t\cos\theta$, $\overline{\mathrm{R'Q'}}=\cos t$이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        따라서 $\overline{\mathrm{P'Q'}}=\sqrt{\sin^2t\cos^2\theta+\cos^2t}$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        길이를 구하는 과정이 명료하게 기술되었다(평행·수직 성분 분해, 수직 성분만 $\cos\theta$배, 정사영 삼각형이 직각삼각형임). [카드 배점 20 → 10]
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        정사영의 길이 $\sqrt{\sin^2t\cos^2\theta+\cos^2t}$를 정확히 구했다. [카드 배점 10 → 5]
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    평면 $\alpha$ 위에 한 변의 길이가 $1$인 정삼각형 $\mathrm{RST}$가 있고 이 삼각형의 평면 $\beta$ 위로의 정사영을 삼각형 $\mathrm{R'S'T'}$이라고 하자. $\cos\theta=\dfrac{3}{\pi}$일 때, $\overline{\mathrm{R'S'}}^2+\overline{\mathrm{S'T'}}^2+\overline{\mathrm{T'R'}}^2$의 값을 구하시오.
  points: 20
  depends_on: ['2']
  answer: {kind: value, value: '(27 + 3*pi**2)/(2*pi**2)', equivalents: ['3/2*(3/pi)**2 + 3/2'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      세 변이 $l$과 이루는 각 $t,\ \tfrac{\pi}{3}-t,\ \tfrac{\pi}{3}+t$에 2.의 공식을 적용해 더하면 $\tfrac32\cos^2\theta+\tfrac32$로 $t$가 사라진다.
    steps:
    - id: 3a
      content: |
        $\displaystyle\sum\overline{\cdot}^2=\cos^2\theta\sum\sin^2(\cdot)+\sum\cos^2(\cdot)=\tfrac32\cos^2\theta+\tfrac32=\dfrac{27+3\pi^2}{2\pi^2}$
      criteria: [3.M1, 3.A1]
    hint_ladder:
    - 세 변이 직선 $l$과 이루는 각을 하나의 문자 $t$로 나타내 보자.
    - 덧셈정리로 전개하면 $t$에 관한 항이 어떻게 되는가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드7 예시답안 3 (PDF p.83~84, 인쇄 p.81~82)'
    steps:
    - id: 3b-1
      content: |
        점 $\mathrm{R},\mathrm{S},\mathrm{T}$ 중 직선 $l$에 가장 가까운 점을 $\mathrm{R}$이라 하고, 직선 $\mathrm{RS}$가 $l$과 이루는 각을 $t$라 하면 직선 $\mathrm{TS}$가 $l$과 이루는 각은 $\dfrac{\pi}{3}-t$, 직선 $\mathrm{RT}$가 $l$과 이루는 각은 $\dfrac{\pi}{3}+t$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        2.의 식을 적용하면
        $\overline{\mathrm{R'S'}}^2=\sin^2t\cos^2\theta+\cos^2t$,
        $\overline{\mathrm{T'S'}}^2=\left(\sin\dfrac{\pi}{3}\cos t-\cos\dfrac{\pi}{3}\sin t\right)^2\cos^2\theta+\left(\cos\dfrac{\pi}{3}\cos t+\sin\dfrac{\pi}{3}\sin t\right)^2$,
        $\overline{\mathrm{R'T'}}^2=\left(\sin\dfrac{\pi}{3}\cos t+\cos\dfrac{\pi}{3}\sin t\right)^2\cos^2\theta+\left(\cos\dfrac{\pi}{3}\cos t-\sin\dfrac{\pi}{3}\sin t\right)^2$.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        세 값을 더하면 $\sin^2t+\sin^2\left(\dfrac{\pi}{3}-t\right)+\sin^2\left(\dfrac{\pi}{3}+t\right)=\dfrac32$, $\cos^2t+\cos^2\left(\dfrac{\pi}{3}-t\right)+\cos^2\left(\dfrac{\pi}{3}+t\right)=\dfrac32$이므로
        $\overline{\mathrm{R'S'}}^2+\overline{\mathrm{S'T'}}^2+\overline{\mathrm{T'R'}}^2=\dfrac32\cos^2\theta+\dfrac32$이다.
      criteria: [3.M1]
    - id: 3b-4
      content: |
        $\cos\theta=\dfrac{3}{\pi}$을 대입하면 $\dfrac32\left(\dfrac{3}{\pi}\right)^2+\dfrac32=\dfrac{27+3\pi^2}{2\pi^2}$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        요구한 값을 구하는 과정이 타당하다(세 변이 $l$과 이루는 각 설정, 2.의 식 적용, 덧셈정리로 합이 $\tfrac32\cos^2\theta+\tfrac32$임을 보임). [카드 배점 30 → 15]
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 15}
      steps: [3b-1, 3b-2, 3b-3]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        삼각형의 정사영의 변들의 제곱의 합 $\dfrac{27+3\pi^2}{2\pi^2}$을 정확히 구했다. [카드 배점 10 → 5]
      depends_on: [3.M1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

