intent: |
  두 평면이 이루는 각과 정사영의 뜻을 바탕으로, 교선에 평행한 방향과 수직인 방향으로 선분을 분해하여 정사영의 길이를 구하고(1·2), 그 결과를 삼각함수의 덧셈정리와 결합해 정삼각형 정사영의 변의 제곱의 합을 계산하는 능력을 본다.
key_idea: |
  평면 $\alpha$ 위 선분을 교선 $l$에 평행한 성분($\cos t$)과 수직인 성분($\sin t$)으로 나누면, 평행 성분은 그대로, 수직 성분은 $\cos\theta$배가 되어 정사영 길이의 제곱은 $\sin^2t\cos^2\theta+\cos^2t$이다.
stuck: |
  교선에 수직인 방향의 길이만 $\cos\theta$배로 줄어든다는 사실(정사영 길이를 단순히 $\cos\theta$배로 착각)과, 3.에서 세 변이 $l$과 이루는 각을 $t,\ \tfrac{\pi}{3}-t,\ \tfrac{\pi}{3}+t$로 잡는 발상
idea_tags: [IDEA-PROJ-DECOMPOSE-PARALLEL-PERP, IDEA-TRIG-ADDITION-SUM-CONSTANT]
tags: [기출, 한양대, 정사영, 이면각, 덧셈정리, 배점환산]
