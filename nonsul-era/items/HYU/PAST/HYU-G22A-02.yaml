stem: |
  [문제 2] 다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    주머니에 숫자 $1$, $2$, $3$이 각각 적힌 카드 $3$장이 들어 있다. 이 주머니에서 임의로 한 장의 카드를 꺼내어 숫자를 확인한 후 다시 주머니에 넣는 시행을 $54$회 반복할 때, 꺼낸 카드에 적힌 수의 평균을 $\overline{X}$라 하자. 이때 표본평균 $\overline{X}$는 근사적으로 정규분포를 따른다.
    $-2\overline{X}$의 평균과 분산을 구하고, $\mathrm{P}\left(-2\overline{X}\ge-\dfrac{11}{3}\right)$의 값을 구하시오.
    (단, $Z$가 표준정규분포를 따르는 확률변수일 때, $\mathrm{P}(0\le Z\le0.5)=0.1915$, $\mathrm{P}(0\le Z\le1)=0.3413$, $\mathrm{P}(0\le Z\le1.5)=0.4332$, $\mathrm{P}(0\le Z\le2)=0.4772$로 계산한다.)
  points: 15
  depends_on: []
  answer: {kind: value, value: 'E=-4; V=4/81; P=0.0668', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\overline{X}\sim\mathrm{N}\left(2,\tfrac{1}{81}\right)$이므로 $-2\overline{X}\sim\mathrm{N}\left(-4,\tfrac{4}{81}\right)$.
    steps:
    - id: 1a
      content: |
        $\mathrm{P}\left(-2\overline{X}\ge-\tfrac{11}{3}\right)=\mathrm{P}(Z\ge1.5)=0.5-0.4332=0.0668$
      criteria: [1.B1, 1.B2]
    hint_ladder:
    - 모집단 $X$의 평균과 분산부터 구하자.
    - 표본평균의 분산은 $\dfrac{\sigma^2}{n}$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드8 예시답안 1 (PDF p.87, 인쇄 p.85)'
    steps:
    - id: 1b-1
      content: |
        꺼낸 카드에 적힌 수를 $X$라 하면 $\mathrm{E}(X)=\dfrac{1+2+3}{3}=2=\mathrm{E}(\overline{X})$, $\mathrm{V}(X)=\dfrac{(1-2)^2+(2-2)^2+(3-2)^2}{3}=\dfrac23$, $\mathrm{V}(\overline{X})=\dfrac{\mathrm{V}(X)}{54}=\dfrac{1}{81}$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $n=54$가 충분히 크므로 $\overline{X}$는 근사적으로 $\mathrm{N}\left(2,\dfrac{1}{81}\right)$을 따르고, $\mathrm{E}(-2\overline{X})=-2\mathrm{E}(\overline{X})=-4$, $\mathrm{V}(-2\overline{X})=(-2)^2\mathrm{V}(\overline{X})=\dfrac{4}{81}$이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $Z=\dfrac{-2\overline{X}+4}{\sqrt{4/81}}$은 표준정규분포 $\mathrm{N}(0,1)$을 따르므로
        $\mathrm{P}\left(-2\overline{X}\ge-\dfrac{11}{3}\right)=\mathrm{P}\left(Z\ge\dfrac{-11/3+4}{2/9}\right)=\mathrm{P}(Z\ge1.5)=1-\mathrm{P}(Z\le1.5)=0.0668$이다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 8
      evidence: |
        $-2\overline{X}$의 평균 $-4$와 분산 $\dfrac{4}{81}$을 구했다. [카드 배점 15 → 8]
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.B2
      mark_type: B
      points: 7
      evidence: |
        표준정규분포를 활용하여 확률 $0.0668$을 제대로 계산했다. [카드 배점 15 → 7]
      depends_on: []
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    함수 $f(x)=\dfrac{\ln x}{x}$를 이용하여 $a^b=b^a$을 만족시키는 서로 다른 양의 정수 $a$, $b$의 순서쌍 $(a,b)$를 모두 구하시오.
  points: 20
  depends_on: []
  answer: {kind: set, value: '[(2,4),(4,2)]', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $f$는 $(0,e)$에서 증가, $(e,\infty)$에서 감소하므로 $f(a)=f(b)$, $a<b$이면 $a<e<b$, 즉 $a\in\{1,2\}$이다.
    steps:
    - id: 2a
      content: |
        $a=1$은 $f(1)=0<f(b)$로 불가, $a=2$이면 $f(2)=f(4)$이고 $b=4$뿐. 대칭으로 $(2,4),(4,2)$
      criteria: [2.M1, 2.M2, 2.A1]
    hint_ladder:
    - $a^b=b^a$의 양변에 자연로그를 취하고 $ab$로 나누어 보자.
    - $f(x)=\dfrac{\ln x}{x}$의 증가·감소를 조사하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드8 예시답안 2 (PDF p.87~88, 인쇄 p.85~86)'
    steps:
    - id: 2b-1
      content: |
        $f'(x)=\dfrac{1-\ln x}{x^2}$이므로 $f'(e)=0$이고, $x<e$에서 $f'(x)>0$, $x>e$에서 $f'(x)<0$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $a<b$인 순서쌍 $(a,b)$가 $a^b=b^a$를 만족하면 $\dfrac{\ln a}{a}=\dfrac{\ln b}{b}$, 즉 $f(a)=f(b)$이다. $e<a<b$이면 $f(a)>f(b)$, $a<b<e$이면 $f(a)<f(b)$이므로 불가능하고, 따라서 $a<e<b$여야 한다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $e=2.71\cdots$이므로 $a$는 $1$ 또는 $2$이다. 모든 $b>e$에 대해 $f(1)=0<f(b)$이므로 $a=1$일 수는 없다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        $a=2$이면 $b=4$가 $a^b=b^a$를 만족하고, $4$보다 큰 $b'$에 대해서는 $f(2)=f(4)>f(b')$이므로 $b=4$가 유일하다. 대칭적으로 $b<a$도 가능하므로 구하는 순서쌍은 $(2,4)$, $(4,2)$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: |
        $f(x)$의 도함수를 이용하여 $f(x)$가 증가·감소하는 구간을 구했다. [카드 배점 15 → 8]
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: R
      points: 7
      evidence: |
        $f(x)$의 성질과 $e$의 근삿값으로 가능한 경우($a<e<b$, $a\in\{1,2\}$, $a\ne1$)를 알아냈다. [카드 배점 15 → 7]
      depends_on: [2.M1]
      steps: [2b-2, 2b-3]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        순서쌍 $(2,4)$, $(4,2)$를 정확한 근거(유일성 포함)와 함께 모두 구했다. [카드 배점 10 → 5]
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $n\ge3$인 자연수 $n$에 대하여 둘레의 길이가 $1$인 정 $n$각형의 넓이를 $f(n)$이라 하자.
    $f(12)$의 값을 구하고, $\displaystyle\lim_{n\to\infty}f(n)$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 'f12=(2+sqrt(3))/48; limit=1/(4*pi)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      중심과 이웃한 두 꼭짓점이 만드는 삼각형 $n$개로 나누면 $f(n)=\dfrac{\sin\frac{2\pi}{n}}{4n\left(1-\cos\frac{2\pi}{n}\right)}$.
    steps:
    - id: 3a
      content: |
        $f(12)=\dfrac{2+\sqrt3}{48}$, $\displaystyle\lim_{n\to\infty}f(n)=\dfrac{1}{4\pi}$
      criteria: [3.B1, 3.B2]
    hint_ladder:
    - 외접원의 중심과 이웃한 두 꼭짓점으로 이루어진 삼각형을 생각하자.
    - $n\to\infty$이면 정 $n$각형은 둘레가 1인 원에 가까워진다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드8 예시답안 3 (PDF p.88, 인쇄 p.86)'
    steps:
    - id: 3b-1
      content: |
        점 $\mathrm{O}$를 정 $n$각형의 외접원의 중심, 점 $\mathrm{A},\mathrm{B}$를 이웃한 두 꼭짓점이라 하자. 외접원의 반지름을 $r$이라 하면 삼각형 $\mathrm{OAB}$에서 코사인법칙에 의해 $\left(\dfrac1n\right)^2=2r^2-2r^2\cos\dfrac{2\pi}{n}$, 즉 $r^2=\dfrac{1}{2n^2\left(1-\cos\frac{2\pi}{n}\right)}$이다.
      criteria: [3.B1]
    - id: 3b-2
      content: |
        $\triangle\mathrm{OAB}=\dfrac12r^2\sin\dfrac{2\pi}{n}=\dfrac{\sin\frac{2\pi}{n}}{4n^2\left(1-\cos\frac{2\pi}{n}\right)}$이므로 $f(n)=n\times\triangle\mathrm{OAB}=\dfrac{\sin\frac{2\pi}{n}}{4n\left(1-\cos\frac{2\pi}{n}\right)}$이다.
      criteria: [3.B1]
    - id: 3b-3
      content: |
        $f(12)=\dfrac{\sin\frac{\pi}{6}}{48\left(1-\cos\frac{\pi}{6}\right)}=\dfrac{1}{48(2-\sqrt3)}=\dfrac{2+\sqrt3}{48}$이다.
      criteria: [3.B1]
    - id: 3b-4
      content: |
        $\displaystyle\lim_{n\to\infty}f(n)=\lim_{n\to\infty}\dfrac{1}{4n}\cdot\dfrac{1+\cos\frac{2\pi}{n}}{\sin\frac{2\pi}{n}}=\lim_{n\to\infty}\dfrac{1}{4n}\cdot\dfrac{\frac{2\pi}{n}}{\sin\frac{2\pi}{n}}\cdot\dfrac{1+\cos\frac{2\pi}{n}}{\frac{2\pi}{n}}=\dfrac{1}{4\pi}$이다.
      criteria: [3.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 10
      evidence: |
        $f(12)=\dfrac{2+\sqrt3}{48}$을 구했다(넓이를 삼각함수로 나타내는 과정 포함). [카드 배점 20 → 10]
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3b-2, 3b-3]
    - id: 3.B2
      mark_type: B
      points: 5
      evidence: |
        극한값 $\displaystyle\lim_{n\to\infty}f(n)=\dfrac{1}{4\pi}$을 구했다. [카드 배점 10 → 5]
      depends_on: []
      steps: [3b-4]
    deductions: []
