intent: |
  표본평균의 분포와 정규분포 표준화로 확률을 계산하고(1), 함수 $\dfrac{\ln x}{x}$의 증가·감소와 $e$의 근삿값으로 $a^b=b^a$의 정수해를 모두 찾으며(2), 정 $n$각형의 넓이를 삼각함수로 나타내 삼각함수의 극한을 구하는(3) 능력을 본다.
key_idea: |
  $a^b=b^a\iff f(a)=f(b)$이고 $f(x)=\dfrac{\ln x}{x}$는 $x<e$에서 증가, $x>e$에서 감소하므로 $a<e<b$, 즉 작은 수는 $1$ 또는 $2$뿐이다.
stuck: |
  2.에서 $a<b$를 가정하고 $f$의 단조성으로 작은 쪽이 $e$보다 작아야 함을 끌어내는 것, 3.에서 $\dfrac{1-\cos u}{\sin u}$ 꼴을 $\dfrac{\sin u}{u}\to1$로 바꾸는 변형
idea_tags: [IDEA-SAMPLE-MEAN-LINEAR-TRANSFORM, IDEA-LNX-OVER-X-AB-BA, IDEA-POLYGON-AREA-LIMIT-CIRCLE]
