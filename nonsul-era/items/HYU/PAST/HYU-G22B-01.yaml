stimuli:
- label: 가
  body: |
    오른쪽 그림과 같이 반지름의 길이가 $1$인 원 위의 두 점 $\mathrm{P}$, $\mathrm{Q}$를 잇는 한 호 $\mathrm{PQ}$의 길이를 $t$라고 할 때, 현 $\mathrm{PQ}$의 길이를 $f(t)$, 현 $\mathrm{PQ}$와 길이가 $t$인 호 $\mathrm{PQ}$로 둘러싸인 도형의 넓이를 $g(t)$라고 하자.
    [그림: 반지름 1인 원 위의 두 점 P(위), Q(왼쪽 아래). 굵게 표시한 호 PQ에 길이 t, 현 PQ와 호로 둘러싸인 활꼴(빗금)에 g(t), 현 PQ에 f(t) 표시]
- label: 나
  body: |
    반지름의 길이가 $1$인 원 위에 서로 다른 $n$개의 점 $\mathrm{P_0}$, $\mathrm{P_1}$, $\cdots$, $\mathrm{P_{n-1}}$이 순서대로 놓여 있고,
    $\overline{\mathrm{P_0P_1}}=\overline{\mathrm{P_1P_2}}=\cdots=\overline{\mathrm{P_{n-2}P_{n-1}}}=\overline{\mathrm{P_{n-1}P_0}}$을 만족시킨다. 예를 들어, 오른쪽 그림은 $n=6$인 경우이다.
    [그림: 원에 내접하는 정육각형. 꼭짓점이 위에서부터 반시계 방향으로 P0(맨 위), P1, P2, P3(맨 아래), P4, P5이고 여섯 변에 같은 길이 표시]

stem: |
  [문제 1] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    제시문 <가>에서 주어진 식 $f(t)$, $g(t)$에 대하여 극한값 $\displaystyle\lim_{t\to0+}\dfrac{g(t)}{f(t)}$를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $f(t)=2\sin\tfrac t2$, $g(t)=\tfrac12(t-\sin t)$이고 $g$는 $t^3$ 정도로, $f$는 $t$ 정도로 작아진다.
    steps:
    - id: 1a
      content: |
        $\dfrac{g(t)}{f(t)}=\dfrac12\cdot\dfrac{t/2}{\sin(t/2)}\left(1-\dfrac{\sin t}{t}\right)\to\dfrac12\cdot1\cdot0=0$
      criteria: [1.M1, 1.A1]
    hint_ladder:
    - 원의 중심에서 현에 수선을 내려 보자.
    - 활꼴의 넓이는 부채꼴에서 삼각형을 뺀 것이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드9 예시답안 1 (PDF p.92, 인쇄 p.90)'
    steps:
    - id: 1b-1
      content: |
        원의 중심 $\mathrm{O}$에서 현 $\mathrm{PQ}$에 내린 수선의 발을 $\mathrm{H}$라 하면 $\angle\mathrm{QOH}=\dfrac t2$이므로 $f(t)=2\overline{\mathrm{QH}}=2\sin\dfrac t2$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $g(t)=\dfrac12\times1^2\times t-\dfrac12\times1^2\times\sin t=\dfrac12(t-\sin t)$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $\displaystyle\lim_{t\to0+}\dfrac{g(t)}{f(t)}=\lim_{t\to0+}\dfrac{\frac12(t-\sin t)}{2\sin\frac t2}=\lim_{t\to0+}\dfrac12\cdot\dfrac{\frac t2}{\sin\frac t2}\left(1-\dfrac{\sin t}{t}\right)=\dfrac12\times1\times(1-1)=0$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        현 $\mathrm{PQ}$의 길이 $f(t)=2\sin\tfrac t2$와 활꼴의 넓이 $g(t)=\tfrac12(t-\sin t)$를 구했다. [카드 배점 20 → 10]
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        삼각함수의 극한의 성질을 활용해서 $\displaystyle\lim_{t\to0+}\dfrac{g(t)}{f(t)}=0$을 구했다. [카드 배점 10 → 5]
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    제시문 <나>에서 주어진 $n$개의 점 $\mathrm{P_0}$, $\mathrm{P_1}$, $\cdots$, $\mathrm{P_{n-1}}$에 대하여 극한값
    $$\lim_{n\to\infty}\dfrac{\overline{\mathrm{P_0P_1}}+\overline{\mathrm{P_0P_2}}+\cdots+\overline{\mathrm{P_0P_{n-1}}}}{n}$$
    을 구하시오.
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '4/pi', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $\overline{\mathrm{P_0P_k}}=f\left(\tfrac{2\pi k}{n}\right)$이고 $f(2\pi)=0$이므로 평균은 $\dfrac{1}{2\pi}\displaystyle\int_0^{2\pi}2\sin\tfrac t2\,dt$로 수렴한다.
    steps:
    - id: 2a
      content: |
        $\dfrac{1}{2\pi}\displaystyle\int_0^{2\pi}2\sin\dfrac t2\,dt=\dfrac{1}{2\pi}\left[-4\cos\dfrac t2\right]_0^{2\pi}=\dfrac4\pi$
      criteria: [2.M1, 2.A1]
    hint_ladder:
    - $\overline{\mathrm{P_0P_k}}$를 1.의 $f$로 나타내 보자.
    - 합을 $\displaystyle\sum F\left(\tfrac{2\pi k}{n}\right)\tfrac{2\pi}{n}$ 꼴로 바꾸자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드9 예시답안 2 (PDF p.92, 인쇄 p.90)'
    steps:
    - id: 2b-1
      content: |
        1.에서 구한 $f(t)$에 대하여 $\overline{\mathrm{P_0P_1}}=f\left(\dfrac{2\pi}{n}\right)$, $\overline{\mathrm{P_0P_2}}=f\left(\dfrac{2\pi}{n}\cdot2\right)$, $\cdots$, $\overline{\mathrm{P_0P_{n-1}}}=f\left(\dfrac{2\pi}{n}\cdot(n-1)\right)$이고, $f\left(\dfrac{2\pi}{n}\cdot n\right)=f(2\pi)=0$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}\dfrac{\overline{\mathrm{P_0P_1}}+\cdots+\overline{\mathrm{P_0P_{n-1}}}}{n}=\lim_{n\to\infty}\sum_{k=1}^{n}f\left(\dfrac{2\pi}{n}k\right)\dfrac1n=\lim_{n\to\infty}\sum_{k=1}^{n}f\left(0+\dfrac{2\pi-0}{n}k\right)\dfrac{2\pi-0}{n}\cdot\dfrac{1}{2\pi}=\dfrac{1}{2\pi}\int_0^{2\pi}f(t)\,dt$이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        $f(t)=2\sin\dfrac t2$이므로 $\dfrac{1}{2\pi}\displaystyle\int_0^{2\pi}f(t)\,dt=\dfrac4\pi$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        주어진 극한을 적당한 정적분 $\dfrac{1}{2\pi}\displaystyle\int_0^{2\pi}f(t)\,dt$의 식으로 변환하였다. [카드 배점 20 → 10]
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 10}
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        정적분의 값 $\dfrac4\pi$를 구했다. [카드 배점 10 → 5]
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    제시문 <나>에서 주어진 $n$개의 점 $\mathrm{P_0}$, $\mathrm{P_1}$, $\cdots$, $\mathrm{P_{n-1}}$에 대하여 호 $\mathrm{P_0P_1}$과 현 $\mathrm{P_0P_1}$로 둘러싸인 도형의 넓이를 $S_1$, 호 $\mathrm{P_0P_2}$와 현 $\mathrm{P_0P_2}$로 둘러싸인 도형의 넓이를 $S_2$, $\cdots$, 호 $\mathrm{P_0P_{n-1}}$과 현 $\mathrm{P_0P_{n-1}}$로 둘러싸인 도형의 넓이를 $S_{n-1}$이라 하자. 극한값
    $$\lim_{n\to\infty}\dfrac{S_1^2+S_2^2+\cdots+S_{n-1}^2}{n}$$
    을 구하시오. (단, $S_1<S_2<\cdots<S_{n-1}$이 되도록 호를 선택한다.)
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: 'pi**2/3 + 5/8', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $S_k=g\left(\tfrac{2\pi k}{n}\right)$, $g(2\pi)=\pi$이고 $\tfrac{\pi^2}{n}\to0$이므로 극한은 $\dfrac{1}{2\pi}\displaystyle\int_0^{2\pi}g(t)^2dt$.
    steps:
    - id: 3a
      content: |
        $\dfrac{1}{8\pi}\displaystyle\int_0^{2\pi}(t^2-2t\sin t+\sin^2t)\,dt=\dfrac{1}{8\pi}\left(\dfrac83\pi^3+5\pi\right)=\dfrac{\pi^2}{3}+\dfrac58$
      criteria: [3.M1, 3.A1]
    hint_ladder:
    - 단서에 맞게 호를 고르면 $S_k$는 1.의 $g$로 어떻게 표현되는가?
    - $k=n$ 항을 더하고 빼서 구분구적법 꼴을 만들자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드9 예시답안 3 (PDF p.93, 인쇄 p.91)'
    steps:
    - id: 3b-1
      content: |
        1.에서 구한 $g(t)$에 대하여 $S_1=g\left(\dfrac{2\pi}{n}\right)$, $S_2=g\left(\dfrac{2\pi}{n}\cdot2\right)$, $\cdots$, $S_{n-1}=g\left(\dfrac{2\pi}{n}\cdot(n-1)\right)$이고, $g\left(\dfrac{2\pi}{n}\cdot n\right)=g(2\pi)=\pi$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $\displaystyle\lim_{n\to\infty}\dfrac{S_1^2+\cdots+S_{n-1}^2}{n}=\lim_{n\to\infty}\left(\sum_{k=1}^{n}\left(g\left(\dfrac{2\pi}{n}k\right)\right)^2\dfrac1n-\left(g(2\pi)\right)^2\dfrac1n\right)=\lim_{n\to\infty}\sum_{k=1}^{n}\left(g\left(\dfrac{2\pi}{n}k\right)\right)^2\dfrac{2\pi}{n}\cdot\dfrac{1}{2\pi}-\lim_{n\to\infty}\dfrac{\pi^2}{n}$
        $=\dfrac{1}{2\pi}\displaystyle\int_0^{2\pi}(g(t))^2dt-0=\dfrac{1}{8\pi}\int_0^{2\pi}(t^2-2t\sin t+\sin^2t)\,dt$이다.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        부분적분에 의해 $\displaystyle\int t\sin t\,dt=-t\cos t+\sin t+C_1$, $\displaystyle\int\sin^2t\,dt=\dfrac12(t-\cos t\sin t)+C_2$이므로
        $\dfrac{1}{8\pi}\displaystyle\int_0^{2\pi}(t^2-2t\sin t+\sin^2t)\,dt=\dfrac{1}{8\pi}\left[\dfrac13t^3-2(-t\cos t+\sin t)+\dfrac12(t-\cos t\sin t)\right]_0^{2\pi}=\dfrac{1}{8\pi}\left(\dfrac83\pi^3+5\pi\right)=\dfrac{\pi^2}{3}+\dfrac58$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        주어진 극한을 적당한 정적분 $\dfrac{1}{2\pi}\displaystyle\int_0^{2\pi}(g(t))^2dt$의 식으로 변환하였다. [카드 배점 20 → 10]
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 10}
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
      points: 10
      evidence: |
        부분적분으로 정적분의 값 $\dfrac{\pi^2}{3}+\dfrac58$을 구했다. [카드 배점 20 → 10]
      depends_on: [3.M1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

