intent: |
  원의 호와 현에 대한 정보를 삼각함수로 나타내 삼각함수의 극한을 구하고(1), 원 위의 등간격 점에서 만든 현의 길이·활꼴 넓이의 평균을 정적분과 급수의 합 사이의 관계로 정적분으로 바꾸어 치환적분·부분적분으로 계산하는(2·3) 능력을 본다.
key_idea: |
  $f(t)=2\sin\dfrac t2$, $g(t)=\dfrac12(t-\sin t)$이고 $\overline{\mathrm{P_0P_k}}=f\left(\dfrac{2\pi k}{n}\right)$, $S_k=g\left(\dfrac{2\pi k}{n}\right)$이므로 평균은 $\dfrac{1}{2\pi}\displaystyle\int_0^{2\pi}$로 수렴한다.
stuck: |
  합이 $k=1$부터 $n-1$까지라 $k=n$ 항을 보충($f(2\pi)=0$, $g(2\pi)=\pi$, $\tfrac{\pi^2}{n}\to0$)해 구분구적법 꼴로 맞추는 것, 그리고 단서 $S_1<\cdots<S_{n-1}$가 호 $\mathrm{P_0P_k}$를 길이 $\tfrac{2\pi k}{n}$인 호로 잡으라는 뜻임을 읽는 것
