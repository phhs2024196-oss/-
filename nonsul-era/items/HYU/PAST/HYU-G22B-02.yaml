intent: |
  사건의 경우와 확률을 파악해 이산확률변수의 기댓값을 $p$의 식으로 나타내고(1), 타원을 좌표평면에 옮겨 기울기가 주어진 접선과 평행한 두 직선 사이의 거리로 외접 직사각형을 분석하며(2), 구간을 나누어 부분적분해 함수의 성질(우함수)을 이끌어내는(3) 능력을 본다.
key_idea: |
  3.에서 $F$를 $f$의 한 부정적분이라 하면 $\displaystyle\int_{-a}^{a}(a-|x|)f'(x)dx=F(a)+F(-a)-2F(0)$이므로 조건은 $F(x)+F(-x)=2F(0)$이고, 미분하면 $f(x)=f(-x)$이다.
stuck: |
  1.에서 3·4·5경기에서 끝나는 경우의 수(마지막 경기는 우승팀 승)를 빠짐없이 세는 것, 2.에서 기울기 $m=0$인 경우를 먼저 배제하는 것, 3.에서 $|x|$ 때문에 구간을 $[-a,0]$, $[0,a]$로 나누어 부분적분하는 발상
