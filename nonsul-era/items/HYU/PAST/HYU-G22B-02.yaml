stem: |
  [문제 2] 다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    두 팀 $\mathrm{A}$와 $\mathrm{B}$가 배구 시합을 반복하여 어느 한 팀이 $3$승을 거두면 우승팀으로 결정된다.
    각 시합은 팀 $\mathrm{A}$가 승리할 확률이 $p$인 독립시행이고 무승부는 없다고 가정할 때, 우승팀이 결정될 때까지 실시한 시합 횟수의 기댓값을 $p$에 대한 식으로 나타내시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '6*p**4 - 12*p**3 + 3*p**2 + 3*p + 3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $k$번째 경기에서 끝나려면 그 경기 승자가 앞의 $k-1$경기에서 정확히 2승을 해야 한다.
    steps:
    - id: 1a
      content: |
        $\mathrm{E}(X)=3[p^3+q^3]+4[3p^3q+3pq^3]+5[6p^3q^2+6p^2q^3]$ ($q=1-p$) $=6p^4-12p^3+3p^2+3p+3$
      criteria: [1.M1, 1.A1]
    hint_ladder:
    - 시합은 최소 몇 번, 최대 몇 번 하게 되는가?
    - 마지막 경기는 반드시 우승팀이 이긴다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드10 예시답안 문항1 (PDF p.96, 인쇄 p.94)'
    steps:
    - id: 1b-1
      content: |
        확률변수 $X$를 진행한 시합 횟수라고 하자. 우승팀이 결정될 경우는 팀 $\mathrm{A}$의 결과가 승승승, 패패패(시합 3회), 패승승승, 승패승승, 승승패승, 승패패패, 패승패패, 패패승패(시합 4회), 승패패승승, 승패승패승, 승승패패승, 패승패승승, 패승승패승, 패패승승승, 승승패패패, 승패승패패, 승패패승패, 패승승패패, 패승패승패, 패패승승패(시합 5회)로 총 20가지이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 기댓값은
        $\mathrm{E}(X)=3[p^3+(1-p)^3]+4[3p^3(1-p)+3p(1-p)^3]+5[6p^3(1-p)^2+6p^2(1-p)^3]$이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        이 기댓값을 $p$의 식으로 정리하면 $6p^4-12p^3+3p^2+3p+3$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: |
        우승팀이 결정될 경우의 수(3회 2가지, 4회 6가지, 5회 12가지)와 확률을 제대로 파악했다. [카드 배점 15 → 8]
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: |
        기댓값의 정의에 따라 $6p^4-12p^3+3p^2+3p+3$ (또는 정리 전 동치식)으로 표현했다. [카드 배점 15 → 7]
      depends_on: [1.M1]
      steps: [1b-2, 1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    장축의 길이가 $6$, 단축의 길이가 $4$인 타원이 있다. 네 변이 각각 이 타원에 접하는 직사각형의 한 변의 길이가 $2\sqrt5$일 때, 이 직사각형의 넓이를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '8*sqrt(10)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $\dfrac{x^2}{9}+\dfrac{y^2}{4}=1$에서 기울기 $m$, $-\tfrac1m$인 접선 쌍 사이 거리가 직사각형의 두 변이다.
    steps:
    - id: 2a
      content: |
        $a=2\sqrt{\dfrac{9m^2+4}{m^2+1}}$, $b=2\sqrt{\dfrac{9+4m^2}{1+m^2}}$, $a^2+b^2=52$이므로 한 변이 $2\sqrt5$이면 다른 변은 $4\sqrt2$, 넓이 $8\sqrt{10}$
      criteria: [2.M1, 2.A1]
    hint_ladder:
    - 타원을 좌표평면에 놓고 기울기가 $m$인 접선의 방정식을 써 보자.
    - 직사각형의 변의 길이는 평행한 두 접선 사이의 거리이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드10 예시답안 문항2 (PDF p.96~97, 인쇄 p.94~95)'
    steps:
    - id: 2b-1
      content: |
        타원을 좌표평면에 두어 $\dfrac{x^2}{9}+\dfrac{y^2}{4}=1$이라 하고, 직사각형의 한 변을 포함하는 접선의 기울기를 $m$이라 하자. $m=0$이면 직사각형의 변의 길이는 $6$ 또는 $4$이고 $2\sqrt5$가 아니므로 $m\ne0$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        기울기 $m(\ne0)$인 직선에 수직인 직선의 기울기는 $-\dfrac1m$이므로 직사각형의 네 변은 각각 다음 접선에 포함된다.
        ① $y=mx+\sqrt{9m^2+4}$, ② $y=mx-\sqrt{9m^2+4}$, ③ $y=-\dfrac1mx+\sqrt{\dfrac{9}{m^2}+4}$, ④ $y=-\dfrac1mx-\sqrt{\dfrac{9}{m^2}+4}$
        [그림: 타원 $\tfrac{x^2}{9}+\tfrac{y^2}{4}=1$과 이에 외접하는 기울어진 직사각형, 네 변을 포함하는 접선 ①②③④]
      criteria: [2.M1]
    - id: 2b-3
      content: |
        직선 ①과 ② 사이의 거리를 $a$, 직선 ③과 ④ 사이의 거리를 $b$라 하면 $a=2\sqrt{\dfrac{9m^2+4}{m^2+1}}$, $b=2\sqrt{\dfrac{9+4m^2}{1+m^2}}$이고, $a$와 $b$ 중 하나가 $2\sqrt5$이다.
      criteria: [2.A1]
    - id: 2b-4
      content: |
        $a=2\sqrt5$이면 $m=\pm\dfrac12$이고 따라서 $b=4\sqrt2$이다. $b=2\sqrt5$이면 $m=\pm2$이고 따라서 $a=4\sqrt2$이다. 두 경우 모두 직사각형의 넓이는 $ab=8\sqrt{10}$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: |
        타원을 좌표평면에 두어 직사각형의 각 변을 포함하는 접선의 방정식(기울기 $m$, $-\tfrac1m$)을 구했다. [카드 배점 15 → 8]
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 7
      evidence: |
        직사각형의 각 변의 길이를 평행한 두 직선 사이의 거리로 해석하고 넓이 $8\sqrt{10}$을 구했다. [카드 배점 15 → 7]
      depends_on: [2.M1]
      steps: [2b-3, 2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    실수 전체의 범위에서 미분가능한 함수 $f(x)$가 임의의 양수 $a$에 대하여 $\displaystyle\int_{-a}^{a}(a-|x|)f'(x)dx=0$을 만족시킨다. 이때 모든 실수 $x$에 대하여 $f(x)=f(-x)$가 성립함을 보이시오.
  points: 20
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $[-a,0]$, $[0,a]$로 나누어 부분적분하면 $F(a)+F(-a)-2F(0)=0$, 이를 $a$에 대해 미분한다.
    steps:
    - id: 3a
      content: |
        $\displaystyle\int_{-a}^{a}(a-|x|)f'(x)dx=F(a)+F(-a)-2F(0)=0\Rightarrow f(a)-f(-a)=0\ (a>0)$
      criteria: [3.M1, 3.R1]
    hint_ladder:
    - $|x|$를 없애려면 적분 구간을 어떻게 나누어야 하는가?
    - $(a\mp x)$를 미분할 쪽, $f'(x)$를 적분할 쪽으로 두고 부분적분하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드10 예시답안 문항3 (PDF p.97, 인쇄 p.95)'
    steps:
    - id: 3b-1
      content: |
        $f(x)$의 한 부정적분을 $F(x)$라 하자. 구간 $[-a,a]$를 $[-a,0]$과 $[0,a]$로 나누어 각각 부분적분하면
        $\displaystyle\int_0^a(a-x)f'(x)dx=\Big[(a-x)f(x)\Big]_0^a+\int_0^af(x)dx=F(a)-F(0)-af(0)$,
        $\displaystyle\int_{-a}^0(a+x)f'(x)dx=\Big[(a+x)f(x)\Big]_{-a}^0-\int_{-a}^0f(x)dx=F(-a)-F(0)+af(0)$를 얻는다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        이를 합하면 $\displaystyle\int_{-a}^{a}(a-|x|)f'(x)dx=F(a)+F(-a)-2F(0)$이 되고, 주어진 조건에 의해 모든 $x\ge0$에 대해 $F(x)=-F(-x)+2F(0)$임을 알 수 있다.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        양변을 $x$에 대해 미분하면 $f(x)=f(-x)$가 모든 $x>0$에 대해 성립한다. $x=0$인 경우에는 당연히 $f(x)=f(-x)$이고, $x<0$인 경우에도 대칭성에 의해 $f(x)=f(-(-x))=f(-x)$임을 알 수 있다. 따라서 모든 $x$에 대해 $f(x)=f(-x)$가 성립한다. ■
      criteria: [3.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        구간별 부분적분을 통해 $F(x)+F(-x)=2F(0)$임을 밝혀냈다. [카드 배점 20 → 10]
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3b-2]
    - id: 3.R1
      mark_type: R
      points: 10
