intent: |
  사건이 일어나는 경우의 규칙성을 찾아 등비수열의 합으로 확률을 구하고(1), 원 안의 호와 현을 같은 매개변수(중심각)로 나타내 매개변수로 나타낸 함수의 미분법으로 미분계수를 구하며(2), 이계도함수로 도함수의 감소를 밝히고 평균값 정리를 활용해 부등식을 증명하는(3) 능력을 본다.
key_idea: |
  3.에서 $f'(x)=\dfrac{1}{(x+e)\ln(x+e)}$는 감소함수이므로, 평균값 정리로 $\dfrac{f(a+b)-f(a)}{b}=f'(z)$, $\dfrac{f(b)-f(0)}{b}=f'(w)$에서 $w<b\le a<z$이면 $f'(w)>f'(z)$이고 $f(0)=\ln(\ln e)=0$이다.
stuck: |
  1.에서 처음으로 같은 면이 연속 두 번 나오는 시점의 확률이 $\left(\tfrac12\right)^{x-1}$임을 찾는 것(최대 3000번 조건은 2022 이하 확률에 영향 없음), 2.에서 $x$를 직접 쓰지 않고 중심각 $t$를 매개변수로 두는 것, 3.에서 $f(0)=0$을 이용해 $f(b)$를 평균변화율로 보는 발상
