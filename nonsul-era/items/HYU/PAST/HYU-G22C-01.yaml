stem: |
  [문제 1] 다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    한 개의 동전을 같은 면이 연속으로 두 번 나올 때까지 반복하여 던지되, 최대 $3000$번까지만 던질 수 있다. 이때 동전을 던진 횟수가 $2022$ 이하일 확률을 구하시오.
    (단, 동전의 앞면과 뒷면이 나올 확률은 $\dfrac12$로 동일하다.)
  points: 10
  depends_on: []
  answer: {kind: value, value: '1 - (1/2)**2021', equivalents: ['1 - 0.5**2021'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      처음으로 $x$번째에 같은 면이 연속되려면 $2$번째부터 $x-1$번째까지는 직전과 달라야 하므로 $\mathrm{P}(A_x)=\left(\tfrac12\right)^{x-1}$.
    steps:
    - id: 1a
      content: |
        $\displaystyle\sum_{x=2}^{2022}0.5^{x-1}=1-0.5^{2021}$
      criteria: [1.M1, 1.A1]
    hint_ladder:
    - 동전을 $x$번 던졌을 때 처음으로 같은 면이 연속으로 나올 확률을 $x=2,3,4$에 대해 구해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드11 예시답안 1 (PDF p.100~101, 인쇄 p.98~99)'
    steps:
    - id: 1b-1
      content: |
        동전을 $x$번 던질 때 처음으로 같은 면이 두 번 연속으로 나오는 사건을 $A_x$라 하자. 한 번 던질 경우 같은 면이 연속으로 두 번 나오는 사건은 불가능하므로 $\mathrm{P}(A_1)=0$이다. 두 번 던질 경우 4가지 결과 중 2가지(앞면, 앞면), (뒷면, 뒷면)이므로 $\mathrm{P}(A_2)=\dfrac24=\dfrac12=0.5^{2-1}$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        전 단계에서 멈추지 않고 계속 던진 경우에는 정확하게 결과들의 절반만큼 같은 면이 두 번 연속으로 나오므로
        $\mathrm{P}(A_3)=\mathrm{P}(A_2)/2=0.5^{3-1}$, $\mathrm{P}(A_4)=\mathrm{P}(A_3)/2=0.5^{4-1}$, $\cdots$, $\mathrm{P}(A_x)=\mathrm{P}(A_{x-1})/2=0.5^{x-1}\ (x=2,3,4,\cdots,2022)$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        따라서 동전을 던진 횟수가 $2022$ 이하일 확률은 $\displaystyle\sum_{x=2}^{2022}\mathrm{P}(A_x)=\sum_{x=2}^{2022}0.5^{x-1}$이고, 이는 첫째항이 $0.5$, 공비가 $0.5$인 등비수열을 첫째항부터 제 $2021$항까지 더한 것이므로 $\dfrac{0.5(1-0.5^{2021})}{1-0.5}=1-0.5^{2021}$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        동전을 $x$번 던질 때 같은 면이 연속으로 두 번 나오는 사건의 확률을 찾아내고, 이 확률과 등비수열의 항 사이의 관계를 파악했다. [카드 배점 10 → 5]
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        등비수열의 합을 활용하여 확률 $1-0.5^{2021}$을 구했다. [카드 배점 10 → 5]
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    그림과 같이 길이가 $2$인 선분 $\mathrm{AB}$를 지름으로 하는 반원이 있다. 호 $\mathrm{AB}$ 위의 두 점 $\mathrm{P}$, $\mathrm{Q}$에 대하여 현 $\mathrm{PQ}$의 길이가 $x\ (0<x<2)$일 때, 호 $\mathrm{PQ}$와 현 $\mathrm{PQ}$로 둘러싸인 도형의 넓이를 $f(x)$라고 하자. 함수 $f(x)$의 $x=1$에서의 미분계수를 구하시오.
    [그림: 지름 AB(길이 2) 위의 반원. 호 위의 점 P(왼쪽), Q(오른쪽 위)를 잇는 현 PQ의 길이 x, 현 PQ와 호 PQ로 둘러싸인 부분(빗금)이 f(x)]
  points: 20
  depends_on: []
  answer: {kind: value, value: 'sqrt(3)/6', equivalents: ['1/(2*sqrt(3))'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      중심각 $t$로 $x=\sqrt2\sqrt{1-\cos t}$, $f=\tfrac12(t-\sin t)$를 매개변수 표현하고 $t=\tfrac{\pi}{3}$에서 $\dfrac{dy/dt}{dx/dt}$를 계산.
    steps:
    - id: 2a
      content: |
        $\dfrac{dy}{dt}=\dfrac{1-\cos t}{2}$, $\dfrac{dx}{dt}=\dfrac{\sin t}{\sqrt2\sqrt{1-\cos t}}$, $t=\dfrac{\pi}{3}$에서 $f'(1)=\dfrac{1/4}{\sqrt3/2}=\dfrac{\sqrt3}{6}$
      criteria: [2.M1, 2.A1]
    hint_ladder:
    - 현의 길이와 활꼴의 넓이를 모두 중심각 $t$로 나타내 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드11 예시답안 2 (PDF p.101, 인쇄 p.99)'
    steps:
    - id: 2b-1
      content: |
        선분 $\mathrm{AB}$의 중점을 $\mathrm{O}$라 하고, 부채꼴 $\mathrm{OPQ}$의 중심각을 $t\ (0<t<\pi)$라 하면
        $x=\overline{\mathrm{PQ}}=\sqrt{1^2+1^2-2\times1\times1\times\cos t}=\sqrt2\sqrt{1-\cos t}$,
        $y=f(x)=\dfrac12\times1^2\times t-\dfrac12\times1^2\times\sin t=\dfrac12(t-\sin t)$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $t=\dfrac{\pi}{3}$일 때 $x=1$이므로 $x=1$에서의 $f(x)$의 미분계수 $f'(1)$은 $t=\dfrac{\pi}{3}$일 때 $\dfrac{dy/dt}{dx/dt}$의 값이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        $\dfrac{dy}{dt}=\dfrac{1-\cos t}{2}$, $\dfrac{dx}{dt}=\dfrac{\sin t}{\sqrt2\sqrt{1-\cos t}}$이므로 $f'(1)=\dfrac{1}{2\sqrt3}=\dfrac{\sqrt3}{6}$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        현의 길이 $x$와 활꼴의 넓이 $f(x)$를 부채꼴의 중심각 $t$에 대한 매개변수 방정식으로 표현했다. [카드 배점 20 → 10]
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        매개변수로 나타낸 함수의 미분법을 사용해서 미분계수 $f'(1)=\dfrac{\sqrt3}{6}$을 구했다. [카드 배점 20 → 10]
      depends_on: [2.M1]
      steps: [2b-2, 2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    함수 $f(x)=\ln(\ln(x+e))$와 양의 실수 $a$, $b$에 대하여 부등식
    $$f(a+b)<f(a)+f(b)$$
    가 항상 성립함을 보이시오.
  points: 20
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $f''$가 감소하고 $f(0)=0$이므로 평균값 정리로 $\dfrac{f(a+b)-f(a)}{b}=f'(z)<f'(w)=\dfrac{f(b)-f(0)}{b}$.
    steps:
    - id: 3a
      content: |
        $f''(x)=-\dfrac{1+\ln(x+e)}{(x+e)^2(\ln(x+e))^2}<0$, $a\ge b$이면 $0<w<b\le a<z<a+b$이므로 $f(a+b)-f(a)<f(b)$
      criteria: [3.M1, 3.M2, 3.R1]
    hint_ladder:
    - $f(0)$의 값은 얼마인가?
    - $f(a+b)-f(a)$와 $f(b)-f(0)$을 각각 평균값 정리로 나타내 보자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드11 예시답안 3 (PDF p.101, 인쇄 p.99)'
    steps:
    - id: 3b-1
      content: |
        $f'(x)=\dfrac{1}{(x+e)\ln(x+e)}$이고 이를 한 번 더 미분하면 $f''(x)=-\dfrac{1+\ln(x+e)}{(x+e)^2(\ln(x+e))^2}$이므로 모든 $x>0$에 대해 $f''(x)<0$이다. 즉, $f'$은 감소한다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        일반성을 잃지 않고 $a\ge b$라 가정하자. 그러면 평균값 정리에 의해 $\dfrac{f(a+b)-f(a)}{b}=f'(z)$인 $z$가 열린 구간 $(a,a+b)$에서 항상 존재하고, $\dfrac{f(b)}{b}=\dfrac{f(b)-f(0)}{b-0}=f'(w)$인 $w$가 열린 구간 $(0,b)$에서 항상 존재한다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        그런데 $0<w<b\le a<z<a+b$이므로 $w<z$, 따라서 $f'(w)>f'(z)$임을 알 수 있다. 이를 정리하면 $f(a+b)<f(a)+f(b)$를 얻는다. ■
      criteria: [3.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 8
      evidence: |
        함수 $f(x)$의 도함수와 이계도함수를 계산하여 도함수가 감소함수임을 밝혔다. [카드 배점 15 → 8]
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 7
      evidence: |
        주어진 부등식을 평균값 정리를 이용하여 변형했다($f(0)=0$ 이용). [카드 배점 15 → 7]
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
      points: 5
      evidence: |
        도함수가 감소한다는 사실과 평균값 정리를 종합하여 주어진 부등식을 알맞게 증명하였다. [카드 배점 10 → 5]
      depends_on: [3.M1, 3.M2]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

