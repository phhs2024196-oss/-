intent: |
  쌍곡선의 정의와 코사인법칙으로 초점과의 거리를 구해 점의 좌표를 찾고(1), 타원의 접선의 방정식과 점과 직선 사이의 거리로 함수 $f(t)$를 구해 부분분수로 정적분하며(2), 초점에서 타원 위 점까지의 거리를 구해 $f(t)h(t)$가 상수 $a^2b^2$임을 보이는(3) 능력을 본다.
key_idea: |
  타원 위 점 $\mathrm{P}(t,s)$에서 $f(t)=\dfrac{a^4b^2}{a^4-c^2t^2}$, $\overline{\mathrm{PF_1}}=\dfrac{a^2-ct}{a}$, $\overline{\mathrm{PF_2}}=\dfrac{a^2+ct}{a}$ ($c^2=a^2-b^2$)이므로 $h(t)=\dfrac{a^4-c^2t^2}{a^2}$이고 곱은 $a^2b^2$이다.
stuck: |
  1.에서 $q-p=2a$와 코사인법칙을 연립하는 것, 2.에서 $s^2=\dfrac{a^2b^2-b^2t^2}{a^2}$을 대입해 $f(t)$를 $t$만의 식으로 만든 뒤 부분분수로 나누는 것, 3.에서 $\overline{\mathrm{PF_1}}^2$이 완전제곱 $\dfrac{(a^2-ct)^2}{a^2}$이 됨을 알아보는 것
