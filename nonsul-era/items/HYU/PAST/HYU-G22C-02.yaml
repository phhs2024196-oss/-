stimuli:
- label: 가
  body: |
    쌍곡선 $\dfrac{x^2}{5}-\dfrac{y^2}{27}=\dfrac12$ 위의 두 점 $\mathrm{A}$, $\mathrm{B}$가 다음 조건을 만족시킨다.
    • 점 $\mathrm{A}$는 제1사분면에 있고, 점 $\mathrm{B}$는 제3사분면에 있다.
    • 위 쌍곡선의 두 초점을 $\mathrm{F}$, $\mathrm{F'}$이라 할 때, $\cos(\angle\mathrm{FAF'})=\cos(\angle\mathrm{F'BF})=\dfrac{7}{25}$이다.
- label: 나
  body: |
    타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ (단, $0<b<a$)의 두 초점을 $\mathrm{F_1}$, $\mathrm{F_2}$라 하고 타원 위의 점 $\mathrm{P}$에서의 접선을 $l$이라 하자. 점 $\mathrm{P}$의 $x$좌표를 $t$라고 할 때, 원점으로부터 접선 $l$까지 거리의 제곱을 $f(t)$라 하고 $\overline{\mathrm{PF_1}}\times\overline{\mathrm{PF_2}}$를 $h(t)$라 하자.

stem: |
  [문제 2] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    제시문 <가>에서 두 점 $\mathrm{A}$, $\mathrm{B}$의 좌표를 각각 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 'A=(5/2, 9/2); B=(-5/2, -9/2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $c=4$, $p=\overline{\mathrm{AF}}$, $q=\overline{\mathrm{AF'}}$에서 $q-p=\sqrt{10}$, $\dfrac{7}{25}=\dfrac{p^2+q^2-64}{2pq}$.
    steps:
    - id: 1a
      content: |
        $p=\dfrac32\sqrt{10}$, $q=\dfrac52\sqrt{10}$, $\mathrm{A}\left(\dfrac52,\dfrac92\right)$, $\mathrm{B}\left(-\dfrac52,-\dfrac92\right)$
      criteria: [1.M1, 1.A1]
    hint_ladder:
    - 쌍곡선의 정의에서 $\overline{\mathrm{AF'}}-\overline{\mathrm{AF}}$는 얼마인가?
    - 삼각형 $\mathrm{AFF'}$에 코사인법칙을 쓰자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드12 예시답안 1 (PDF p.104~105, 인쇄 p.102~103)'
    steps:
    - id: 1b-1
      content: |
        주어진 쌍곡선을 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$로 표현하면 $a^2=\dfrac52$, $b^2=\dfrac{27}{2}$이다. 따라서 초점 $\mathrm{F}$의 $x$좌표를 양수 $c$라 하면 $c=\sqrt{a^2+b^2}=4$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $p=\overline{\mathrm{AF}}$, $q=\overline{\mathrm{AF'}}$이라 하면 쌍곡선의 정의와 코사인법칙에 의하여 $q-p=2a=\sqrt{10}$, $\cos(\angle\mathrm{F'AF})=\dfrac{7}{25}=\dfrac{p^2+q^2-8^2}{2pq}$, 즉 $q=p+\sqrt{10}$이고 $14pq=25(p^2+q^2-64)$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        첫 번째 식을 두 번째 식에 대입하면 $14p^2+14\sqrt{10}p=25(2p^2+2\sqrt{10}p-54)$, 정리하면 $2p^2+2\sqrt{10}p-75=0$이다. 그러므로 $p=\dfrac32\sqrt{10}$이고 $q=\dfrac52\sqrt{10}$이다.
      criteria: [1.M1]
    - id: 1b-4
      content: |
        점 $\mathrm{A}$의 좌표를 $(x_0,y_0)$이라 하면 $\overline{\mathrm{AF'}}^2=\dfrac{125}{2}=(x_0+4)^2+y_0^2$이고 $\overline{\mathrm{AF}}^2=\dfrac{45}{2}=(x_0-4)^2+y_0^2$이다. 이를 연립하여 풀면 $x_0=\dfrac52$, $y_0=\dfrac92$, 즉 $\mathrm{A}\left(\dfrac52,\dfrac92\right)$이다. 비슷하게 점 $\mathrm{B}$의 좌표를 구하면 $\left(-\dfrac52,-\dfrac92\right)$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: |
        $\overline{\mathrm{AF}}=\dfrac32\sqrt{10}$와 $\overline{\mathrm{AF'}}=\dfrac52\sqrt{10}$을 제대로 구했다. [카드 배점 15 → 8]
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: |
        두 점 $\mathrm{A}\left(\dfrac52,\dfrac92\right)$, $\mathrm{B}\left(-\dfrac52,-\dfrac92\right)$의 좌표를 제대로 구했다. [카드 배점 15 → 7]
      depends_on: [1.M1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    제시문 <나>에서 $b=\dfrac{\sqrt3}{2}a$일 때, $\dfrac{1}{a^3}\displaystyle\int_0^af(t)\,dt$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '3*log(3)/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $f(t)=\dfrac{a^4b^2}{a^4-c^2t^2}=\dfrac{a^4b^2}{2a^2}\left(\dfrac{1}{a^2-ct}+\dfrac{1}{a^2+ct}\right)$을 적분.
    steps:
    - id: 2a
      content: |
        $\displaystyle\int_0^af(t)dt=\dfrac{a^4b^2}{2a^2c}\ln\dfrac{a^2+ca}{a^2-ca}$, $b^2=\tfrac34a^2$, $c=\tfrac a2$ 대입 $\Rightarrow\dfrac34a^3\ln3$
      criteria: [2.M1, 2.A1]
    hint_ladder:
    - 점 $\mathrm{P}(t,s)$에서의 접선의 방정식을 쓰고 원점까지의 거리를 구하자.
    - $s^2$을 $t$로 나타내 $f(t)$를 $t$만의 식으로 바꾸자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드12 예시답안 2 (PDF p.105~106, 인쇄 p.103~104)'
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{P}$의 좌표를 $(t,s)$라 하면 접선의 기울기는 $-\dfrac{b^2t}{a^2s}$, 접선의 방정식은 $y-s=-\dfrac{b^2t}{a^2s}(x-t)$이다. 이를 정리하면 $b^2tx+a^2sy=b^2t^2+a^2s^2$이고, $\dfrac{t^2}{a^2}+\dfrac{s^2}{b^2}=1$이므로 $b^2tx+a^2sy-a^2b^2=0$을 얻는다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 $f(t)=\left(\dfrac{a^2b^2}{\sqrt{b^4t^2+a^4s^2}}\right)^2$이고, $s^2=\dfrac{a^2b^2-b^2t^2}{a^2}$이므로
        $f(t)=\dfrac{a^4b^4}{b^4t^2+a^4b^2-a^2b^2t^2}=\dfrac{a^4b^2}{a^4+(b^2-a^2)t^2}$이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        $a^2-b^2=c^2\ (b<a)$ 중 양수인 $c$를 선택하면 $f(t)=\dfrac{a^4b^2}{a^4-c^2t^2}=\dfrac{a^4b^2}{2a^2}\left(\dfrac{1}{a^2-ct}+\dfrac{1}{a^2+ct}\right)$이다.
      criteria: [2.M1]
    - id: 2b-4
      content: |
        $\displaystyle\int\dfrac{1}{a^2+ct}dt=\dfrac1c\ln(a^2+ct)+C_1$, $\displaystyle\int\dfrac{1}{a^2-ct}dt=-\dfrac1c\ln(a^2-ct)+C_2$이므로
        $\displaystyle\int_0^af(t)dt=\dfrac{a^4b^2}{2a^2}\cdot\dfrac1c\Big[\ln(a^2+ct)-\ln(a^2-ct)\Big]_0^a=\dfrac{a^4b^2}{2a^2c}\ln\dfrac{a^2+ca}{a^2-ca}$ $\cdots$ (A)이다.
      criteria: [2.A1]
    - id: 2b-5
      content: |
        $b=\dfrac{\sqrt3}{2}a$이면 $b^2=\dfrac34a^2$, $c=\sqrt{a^2-b^2}=\dfrac a2$이므로 (A)$=\dfrac34a^3\ln3$이고, $\dfrac{1}{a^3}\displaystyle\int_0^af(t)dt=\dfrac34\ln3$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $f(t)=\dfrac{a^4b^2}{a^4+(b^2-a^2)t^2}$ (또는 동치식)를 정확히 구했다. [카드 배점 20 → 10]
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2, 2b-3]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        정적분을 정확히 하여 $\dfrac34\ln3$을 얻었다. [카드 배점 20 → 10]
      depends_on: [2.M1]
      steps: [2b-4, 2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    제시문 <나>에서 $f(t)\times h(t)$를 $a$와 $b$에 대한 식으로 나타내시오.
  points: 15
  depends_on: ['2']
  answer: {kind: expression, value: 'a**2*b**2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $\overline{\mathrm{PF_1}}=\dfrac{a^2-ct}{a}$, $\overline{\mathrm{PF_2}}=\dfrac{a^2+ct}{a}$이므로 $h(t)=\dfrac{a^4-c^2t^2}{a^2}$.
    steps:
    - id: 3a
      content: |
        $f(t)h(t)=\dfrac{a^4b^2}{a^4-c^2t^2}\cdot\dfrac{a^4-c^2t^2}{a^2}=a^2b^2$
      criteria: [3.M1, 3.A1]
    hint_ladder:
    - $\overline{\mathrm{PF_1}}^2$을 $t$만의 식으로 나타내면 완전제곱식이 된다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '2022 선행학습 영향평가 자체평가보고서 문항카드12 예시답안 3 (PDF p.106, 인쇄 p.104)'
    steps:
    - id: 3b-1
      content: |
        2.에서 선택한 양수 $c$를 사용하여 $\mathrm{F_1}=(c,0)=\left(\sqrt{a^2-b^2},0\right)$, $\mathrm{F_2}=(-c,0)=\left(-\sqrt{a^2-b^2},0\right)$이라 하고 점 $\mathrm{P}$의 좌표를 $(t,s)$라 하면
        $\overline{\mathrm{PF_1}}^2=(c-t)^2+s^2=c^2-2ct+t^2+\dfrac{a^2b^2-b^2t^2}{a^2}=\dfrac{a^2(b^2+c^2)+t^2(a^2-b^2)-2cta^2}{a^2}=\dfrac{a^4+t^2c^2-2cta^2}{a^2}=\dfrac{(a^2-tc)^2}{a^2}$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        마찬가지로 $\overline{\mathrm{PF_2}}^2=\dfrac{(a^2+tc)^2}{a^2}$이다. 따라서 $h(t)=\dfrac{a^4-t^2c^2}{a^2}$이다.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        2.에 의해 $f(t)=\dfrac{a^4b^2}{a^4+(b^2-a^2)t^2}$이므로 $f(t)h(t)=\dfrac{a^4b^2}{a^4+(b^2-a^2)t^2}\times\dfrac{a^4-t^2c^2}{a^2}=a^2b^2$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        식을 구하는 과정이 명료하게 기술되었다($\overline{\mathrm{PF_1}}$, $\overline{\mathrm{PF_2}}$를 $t$의 식으로 구해 $h(t)$를 얻음). [카드 배점 20 → 10]
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.M1], max_points: 10}
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
