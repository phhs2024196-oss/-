intent: |
  로그함수의 성질과 합성함수의 미분법으로 다항식의 이계도함수 값을 구하고(1), 최대·최소 정리와 정적분의 대소, 극한의 대소 관계, 부분적분법으로 극한값을 구하며(2), 포물선 위의 점을 대입해 만든 사차함수의 그래프 개형을 도함수로 파악해 교점 개수가 바뀌는 $k_0$을 구하는(3) 능력을 본다.
key_idea: |
  3.에서 $x=\dfrac{y^2}{4}$을 대입한 $r(y)=y^4+2(8-k^2)y^2-32ky+8(k^2-2)$는 $r'(y)=4(y-k)(y^2+ky+8)$이고, 왼쪽 극솟값 $r(c)=-2h\left(\tfrac{k}{\sqrt2}\right)$의 부호가 제시문 <라>에 의해 $k=5\sqrt2$에서 바뀐다.
stuck: |
  1.에서 곱을 직접 전개하지 않고 $\ln p(x)$를 두 번 미분하는 발상, 2.에서 $c_n$을 부분적분해 $q(1)$을 떼어내고 나머지를 <가>·<나>·<다>로 0에 보내는 것, 3.에서 $r(c)$를 $c^2+kc+8=0$으로 차수를 낮춰 <라>의 $h\left(\tfrac{k}{\sqrt2}\right)$와 연결하는 것
