stimuli:
- label: 제시문
  body: |
    오른쪽 그림과 같이 길이가 $2$인 선분 $\mathrm{AB}$를 지름으로 하는 반원이 있다. 점 $\mathrm{O}$는 선분 $\mathrm{AB}$의 중점이다. 호 $\mathrm{AB}$ 위의 한 점 $\mathrm{R}$에서 선분 $\mathrm{AB}$에 내린 수선의 발을 $\mathrm{H}$라 하고, 점 $\mathrm{H}$에서 선분 $\mathrm{AR}$에 내린 수선의 발을 $\mathrm{P}$라 하자.

    [그림: 선분 AB 위에 그린 반원. 왼쪽 끝 A, 중점 O, 오른쪽 끝 B이며 A와 O 사이에 길이 1이 표시됨. 호 위의 점 R에서 AB에 내린 수선의 발 H(직각 표시)는 O와 B 사이에 있고, 선분 AR과 H에서 AR에 내린 수선 HP(P에 직각 표시)가 그려져 있음]

stem: |
  [문제 1] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    $\angle\mathrm{ROB}=\dfrac{\pi}{3}$일 때, $\overline{\mathrm{OP}}^2+\overline{\mathrm{BP}}^2$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '13/8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{AP}}=\dfrac{3\sqrt3}{4}$를 구한 뒤 $\angle\mathrm{PAO}=\dfrac{\pi}{6}$을 낀 두 삼각형에서 코사인법칙을 쓴다.
    steps:
    - id: 1a
      content: |
        $\overline{\mathrm{AR}}=\sqrt3$, $\overline{\mathrm{PR}}=\dfrac{\sqrt3}{4}$에서 $\overline{\mathrm{AP}}=\dfrac{3\sqrt3}{4}$, $\overline{\mathrm{OP}}^2=\dfrac{7}{16}$, $\overline{\mathrm{BP}}^2=\dfrac{19}{16}$, 합 $\dfrac{13}{8}$.
      criteria: ['1.M1', '1.A1']
    hint_ladder:
    - $\angle\mathrm{AOR}$의 크기를 먼저 구해 보자.
    - $\angle\mathrm{RAB}$는 원주각이다. $\overline{\mathrm{AP}}$를 알면 코사인법칙을 두 번 쓸 수 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2023 문항카드5 예시답안 p.61'
    steps:
    - id: 1b-1
      content: |
        $\angle\mathrm{AOR}=\pi-\dfrac{\pi}{3}=\dfrac{2\pi}{3}$이므로 코사인법칙에서 $\overline{\mathrm{AR}}^2=1^2+1^2-2\times1\times1\times\cos\dfrac{2\pi}{3}=3$, $\overline{\mathrm{AR}}=\sqrt3$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\angle\mathrm{RAB}=\dfrac{\pi}{6}$이므로 $\overline{\mathrm{RH}}=\dfrac{\sqrt3}{2}$이고, $\angle\mathrm{HRP}=\dfrac{\pi}{3}$이므로 $\overline{\mathrm{PR}}=\dfrac{\sqrt3}{4}$이다. 따라서 $\overline{\mathrm{AP}}=\sqrt3-\dfrac{\sqrt3}{4}=\dfrac{3}{4}\sqrt3$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $\overline{\mathrm{OP}}^2=\overline{\mathrm{AP}}^2+\overline{\mathrm{OA}}^2-2\,\overline{\mathrm{AP}}\times\overline{\mathrm{OA}}\times\cos\dfrac{\pi}{6}=\dfrac{27}{16}+1-\dfrac{9}{4}=\dfrac{7}{16}$,
        $\overline{\mathrm{BP}}^2=\overline{\mathrm{AP}}^2+\overline{\mathrm{AB}}^2-2\,\overline{\mathrm{AP}}\times\overline{\mathrm{AB}}\times\cos\dfrac{\pi}{6}=\dfrac{27}{16}+4-\dfrac{9}{2}=\dfrac{19}{16}$.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        따라서 $\overline{\mathrm{OP}}^2+\overline{\mathrm{BP}}^2=\dfrac{7}{16}+\dfrac{19}{16}=\dfrac{13}{8}$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 소문항 2의 좌표 $\mathrm{P}\left(\tfrac12(\cos^2t+2\cos t-1),\tfrac12\sin t(1+\cos t)\right)$에 $t=\dfrac{\pi}{3}$을 대입하면 $\mathrm{P}\left(-\dfrac18,\dfrac{3\sqrt3}{8}\right)$이다.
    steps:
    - id: 1c-1
      content: |
        $\overline{\mathrm{OP}}^2=\dfrac{1}{64}+\dfrac{27}{64}=\dfrac{7}{16}$, $\overline{\mathrm{BP}}^2=\dfrac{81}{64}+\dfrac{27}{64}=\dfrac{19}{16}$이므로 합은 $\dfrac{13}{8}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        선분 AP의 길이 $\dfrac{3\sqrt3}{4}$(또는 P의 위치를 결정하는 동치 정보)를 근거와 함께 구했다. (문항카드: 선분 AP의 길이를 구했는가? 10/30)
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        코사인법칙(또는 좌표)으로 $\overline{\mathrm{OP}}^2=\dfrac{7}{16}$, $\overline{\mathrm{BP}}^2=\dfrac{19}{16}$을 구하고 합 $\dfrac{13}{8}$을 적었다. (문항카드 20/30)
      depends_on: [1.M1]
      steps: [1b-3, 1b-4, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    점 $\mathrm{R}$가 $\mathrm{A}$에서 $\mathrm{B}$까지 호 $\mathrm{AB}$ 위를 움직일 때, 선분 $\mathrm{OP}$의 길이의 최솟값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: 'sqrt(33)/9', equivalents: ['sqrt(11)/(3*sqrt(3))'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 좌표로 P를 매개변수 $t$로 나타내면 $\overline{\mathrm{OP}}^2=\tfrac12 f(t)$, $f(t)=\cos^3t+\cos^2t-\cos t+1$이고 $\cos t=\tfrac13$에서 최소 $\tfrac{22}{27}$이다.
    steps:
    - id: 2a
      content: |
        $f'(t)=-\sin t(\cos t+1)(3\cos t-1)$이므로 최솟값 $f=\dfrac{22}{27}$, $\overline{\mathrm{OP}}_{\min}=\sqrt{\dfrac{11}{27}}=\dfrac{\sqrt{33}}{9}$.
      criteria: ['2.M1', '2.A1']
    hint_ladder:
    - 반원을 좌표평면에 놓고 $\mathrm{R}(\cos t,\sin t)$로 두자.
    - P는 직선 AR과, H를 지나고 AR에 수직인 직선의 교점이다.
    - $\overline{\mathrm{OP}}^2$은 $\cos t$만의 식이 된다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2023 문항카드5 예시답안 p.61~62'
    steps:
    - id: 2b-1
      content: |
        $\mathrm{A}(-1,0)$, $\mathrm{B}(1,0)$, $\mathrm{O}(0,0)$이 되도록 반원을 좌표평면 위($y\ge0$)에 두고 $\angle\mathrm{ROB}=t\ (0\le t\le\pi)$라 하면 $\mathrm{R}(\cos t,\sin t)$, $\mathrm{H}(\cos t,0)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $0<t<\pi$일 때 직선 AR은 $y=\dfrac{\sin t}{\cos t+1}(x+1)$, 점 H를 지나고 AR에 수직인 직선은 $y=-\dfrac{1+\cos t}{\sin t}(x-\cos t)$이다. 두 식을 연립하면
        $$x=\frac12(\cos^2t+2\cos t-1),\qquad y=\frac12\sin t(1+\cos t)$$
        이다. ($t=0$이면 $\mathrm{P}=\mathrm{B}$, $t=\pi$이면 $\mathrm{P}=\mathrm{A}$이고 이 식도 성립한다.)
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $\overline{\mathrm{OP}}=\sqrt{x^2+y^2}=\sqrt{\dfrac12(\cos^3t+\cos^2t-\cos t+1)}$이다. $f(t)=\cos^3t+\cos^2t-\cos t+1$이라 하자.
      criteria: ['2.M1']
    - id: 2b-4
      content: |
        $f'(t)=-\sin t(\cos t+1)(3\cos t-1)$이고 $0\le t\le\pi$에서 $-1\le\cos t\le1$이다. $\cos\alpha=\dfrac13$인 $\alpha$에 대하여 증감표는 $t=0$에서 $f=2$, $(0,\alpha)$에서 감소, $t=\alpha$에서 $f=\dfrac{22}{27}$, $(\alpha,\pi)$에서 증가, $t=\pi$에서 $f=2$이다.
      criteria: ['2.A1']
    - id: 2b-5
      content: |
        따라서 $\overline{\mathrm{OP}}$의 최솟값은 $\sqrt{\dfrac12\times\dfrac{22}{27}}=\dfrac{\sqrt{11}}{3\sqrt3}=\dfrac{\sqrt{33}}{9}$이다.
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    method_no: 2
    key_idea: $u=\cos t\in[-1,1]$로 치환하면 $g(u)=u^3+u^2-u+1$, $g'(u)=(3u-1)(u+1)$이므로 닫힌구간 $[-1,1]$에서 최솟값 $g\left(\tfrac13\right)=\tfrac{22}{27}$.
    steps:
    - id: 2c-1
      content: |
        $g(-1)=2$, $g(1)=2$, $g\left(\dfrac13\right)=\dfrac{22}{27}$이므로 $\overline{\mathrm{OP}}_{\min}=\sqrt{\dfrac{11}{27}}=\dfrac{\sqrt{33}}{9}$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $\overline{\mathrm{OP}}$(또는 $\overline{\mathrm{OP}}^2$)를 한 문자 $t$(또는 $\cos t$)에 대한 식 $\tfrac12(\cos^3t+\cos^2t-\cos t+1)$ 또는 동치식으로 나타냈다. (문항카드 20/40)
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2, 2b-3]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        도함수(증감표)로 $\cos t=\tfrac13$에서 최소임을 밝히고 최솟값 $\dfrac{\sqrt{33}}{9}$을 구했다. (문항카드 20/40)
      depends_on: [2.M1]
      steps: [2b-4, 2b-5, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    점 $\mathrm{R}$가 $\mathrm{A}$에서 $\mathrm{B}$까지 호 $\mathrm{AB}$ 위를 움직일 때, 점 $\mathrm{P}$가 이루는 곡선과 선분 $\mathrm{AB}$로 둘러싸인 도형을 밑면으로 하는 입체도형이 있다. 이 입체도형을 선분 $\mathrm{AB}$에 수직인 평면으로 자른 단면이 모두 정사각형일 때, 이 입체도형의 부피를 구하시오.
  points: 15
  depends_on: ['2']
  answer: {kind: value, value: '8/15', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 단면의 한 변이 P의 $y$좌표이므로 $V=\int_{-1}^{1}y^2\,dx$이고, $\cos t=-1+\sqrt{2+2x}$로 $y^2=\sqrt2(1+x)^{3/2}-(1+x)^2$.
    steps:
    - id: 3a
      content: |
        $V=\displaystyle\int_{-1}^{1}\left\{\sqrt2(1+x)^{\frac32}-(1+x)^2\right\}dx=\dfrac{8}{15}$.
      criteria: ['3.M1', '3.A1']
    hint_ladder:
    - 단면 정사각형의 한 변의 길이는 무엇인가?
    - 2에서 구한 $x$의 식을 $\cos t$에 대해 풀어 보자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2023 문항카드5 예시답안 p.62'
    steps:
    - id: 3b-1
      content: |
        2에서 구한 $\mathrm{P}(x,y)$의 좌표에서 $2x+2=(\cos t+1)^2$이고 $\cos t+1\ge0$이므로 $\cos t=-1+\sqrt{2+2x}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $$y^2=\left(\frac12\sin t(1+\cos t)\right)^2=\frac14(1-\cos t)(1+\cos t)^3=\frac14\left(2-\sqrt{2+2x}\right)\left(\sqrt{2+2x}\right)^3=\sqrt2(1+x)^{\frac32}-(1+x)^2$$
        이다. 단면은 한 변의 길이가 $y$인 정사각형이므로 넓이는 $y^2$이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        $-1\le x\le1$이므로 구하는 부피는
        $$\int_{-1}^{1}y^2dx=\int_{-1}^{1}\sqrt2(1+x)^{\frac32}dx-\int_{-1}^{1}(1+x)^2dx=\left[\frac{2\sqrt2}{5}(1+x)^{\frac52}-\frac13(1+x)^3\right]_{-1}^{1}=\frac{8}{15}$$
        이다.
      criteria: ['3.A1']
  - id: S3-ALT
    audience: ALT
    method_no: 2
