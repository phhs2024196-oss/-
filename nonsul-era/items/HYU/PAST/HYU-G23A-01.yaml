intent: |
  반원 안의 삼각형들이 만족하는 조건을 코사인법칙·삼각함수로 분석하고, 점 P의 자취를 매개변수로 나타내 미분으로 최솟값을 구하며, 단면이 정사각형인 입체의 부피를 적분으로 구하는 능력을 본다(문항카드5 출제 의도 요지).
key_idea: |
  $\angle\mathrm{ROB}=t$로 두면 $\mathrm{P}\left(\tfrac12(\cos^2t+2\cos t-1),\ \tfrac12\sin t(1+\cos t)\right)$이고, $\overline{\mathrm{OP}}^2=\tfrac12(\cos^3t+\cos^2t-\cos t+1)$을 $\cos t$의 삼차식으로 보고 최소화한다.
stuck: |
  점 P를 두 직선(AR, H를 지나 AR에 수직인 직선)의 교점으로 보고 매개변수 $t$로 나타내는 발상, 그리고 부피에서 $y^2$을 $x$의 함수로 바꾸기 위해 $\cos t=-1+\sqrt{2+2x}$로 역변환하는 단계
