stem: |
  [문제 2] 다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    수열 $\{a_n\}$은 모든 자연수 $n$에 대하여 $\dfrac{a_n}{n+1}=\displaystyle\int_0^{\beta}\sin^nx\cos x\,dx$를 만족시킨다. $\displaystyle\sum_{n=1}^{\infty}a_n=\dfrac16$일 때, $\tan\beta$의 값을 구하시오. $\left(\text{단, }0<\beta<\dfrac{\pi}{2}\right)$
  points: 20
  depends_on: []
  answer: {kind: value, value: 'sqrt(2)/4', equivalents: ['1/(2*sqrt(2))'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_n=\sin^{n+1}\beta$이므로 $\dfrac{\sin^2\beta}{1-\sin\beta}=\dfrac16$에서 $\sin\beta=\dfrac13$.
    steps:
    - id: 1a
      content: |
        $6s^2+s-1=(3s-1)(2s+1)=0$, $s=\sin\beta=\dfrac13$, $\tan\beta=\dfrac{1}{2\sqrt2}=\dfrac{\sqrt2}{4}$.
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - 피적분함수 $\sin^nx\cos x$에서 $\sin x$를 하나의 문자로 보자.
    - $a_n$은 어떤 수열인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2023 문항카드6 예시답안 p.65~66'
    steps:
    - id: 1b-1
      content: |
        $t=\sin x$로 놓으면 $\dfrac{dt}{dx}=\cos x$이고, $x=0$일 때 $t=0$, $x=\beta$일 때 $t=\sin\beta$이므로
        $$\frac{a_n}{n+1}=\int_0^{\beta}(\sin x)^n\cos x\,dx=\int_0^{\sin\beta}t^n\,dt=\frac{(\sin\beta)^{n+1}}{n+1}$$
        에서 $a_n=(\sin\beta)^{n+1}$을 얻는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        수열 $\{a_n\}$은 첫째항이 $(\sin\beta)^2$이고 공비가 $\sin\beta$인 등비수열이다. $0<\beta<\dfrac{\pi}{2}$에서 $0<\sin\beta<1$이므로 급수는 수렴하고 그 합은 $\dfrac{(\sin\beta)^2}{1-\sin\beta}$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\dfrac{(\sin\beta)^2}{1-\sin\beta}=\dfrac16$에서 $6(\sin\beta)^2=1-\sin\beta$이다. $y=\sin\beta$라 하면 $6y^2+y-1=(3y-1)(2y+1)=0$이고 $y>0$이므로 $\sin\beta=\dfrac13$이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        빗변 $3$, 높이 $1$인 직각삼각형에서 밑변은 $2\sqrt2$이므로 $\tan\beta=\dfrac{1}{2\sqrt2}=\dfrac{\sqrt2}{4}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        치환적분법으로 $a_n=(\sin\beta)^{n+1}$을 구했다. (문항카드 10/40)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 10
      evidence: |
        등비급수의 합 $\dfrac{\sin^2\beta}{1-\sin\beta}$(수렴 조건 포함)을 세워 $\sin\beta=\dfrac13$을 구했다. (문항카드 20/40)
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $\tan\beta=\dfrac{\sqrt2}{4}$를 구했다. (문항카드 10/40)
      depends_on: [1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    평균이 $m$, 표준편차가 $\sigma$인 정규분포를 따르는 모집단에서 크기가 $n$인 표본을 임의추출할 때, 표본평균을 $\overline X$라 하자. 이 모집단의 확률변수를 $X$라 할 때, 두 확률변수 $X$, $\overline X$가 다음 세 조건을 만족시킨다. 이때, $m+\sigma+n$의 값을 구하시오. (단, $Z$가 표준정규분포를 따르는 확률변수일 때, $\mathrm{P}(0\le Z\le1.5)=0.4332$, $\mathrm{P}(0\le Z\le2.0)=0.4772$, $\mathrm{P}(0\le Z\le2.5)=0.4938$로 계산한다.)

    (가) $\mathrm{P}(X\ge8)+\mathrm{P}(\overline X\ge8)=1$

    (나) $\mathrm{P}(X\ge12)+\mathrm{P}(\overline X\ge7.5)=1$

    (다) 표본평균의 값이 $\bar x$일 때, $m$에 대한 신뢰도 $95.44\,\%$의 신뢰구간이 $\bar x-1\le m\le\bar x+1$이다.
  points: 15
  depends_on: []
  answer: {kind: value, value: '76', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (가)에서 $m=8$, (나)에서 $\dfrac{4}{\sigma}=\dfrac{0.5\sqrt n}{\sigma}$로 $n=64$, (다)에서 $2\cdot\dfrac{\sigma}{8}=1$로 $\sigma=4$.
    steps:
    - id: 2a
      content: |
        $m+\sigma+n=8+4+64=76$.
      criteria: ['2.M1', '2.A1']
    hint_ladder:
    - $X$와 $\overline X$의 분포는 모두 어느 직선에 대하여 대칭인가?
    - $\mathrm{P}(Z_1\ge a)+\mathrm{P}(Z_2\ge b)=1$이면 $a$와 $b$는 어떤 관계인가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2023 문항카드6 예시답안 p.66'
    steps:
    - id: 2b-1
      content: |
        $X\sim\mathrm{N}(m,\sigma^2)$이므로 크기가 $n$인 표본의 표본평균 $\overline X$는 $\mathrm{N}\left(m,\dfrac{\sigma^2}{n}\right)$을 따른다. 정규분포의 확률밀도함수의 그래프는 직선 $x=m$에 대하여 대칭인 종 모양이므로, 조건 (가) $\mathrm{P}(X\ge8)+\mathrm{P}(\overline X\ge8)=1$에서 $m=8$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $Z_1=\dfrac{X-8}{\sigma}$, $Z_2=\dfrac{\overline X-8}{\sigma/\sqrt n}$은 모두 $\mathrm{N}(0,1)$을 따르고 그 그래프는 $z=0$에 대하여 대칭이다. 조건 (나)에서 $\mathrm{P}\left(Z_1\ge\dfrac{12-8}{\sigma}\right)+\mathrm{P}\left(Z_2\ge\dfrac{7.5-8}{\sigma/\sqrt n}\right)=1$이므로 $\dfrac{4}{\sigma}=\dfrac{0.5\sqrt n}{\sigma}$, 즉 $n=64$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $m$에 대한 신뢰도 $95.44\,\%$의 신뢰구간은 $\bar x-2\times\dfrac{\sigma}{\sqrt{64}}\le m\le\bar x+2\times\dfrac{\sigma}{\sqrt{64}}$이고, 조건 (다)에서 $2\times\dfrac{\sigma}{\sqrt{64}}=1$, 즉 $\sigma=4$이다.
      criteria: ['2.M1']
    - id: 2b-4
      content: |
        따라서 $m+\sigma+n=8+4+64=76$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        정규분포의 대칭성으로 $m=8$, 표준화로 $n=64$, 신뢰구간으로 $\sigma=4$를 각각 근거와 함께 구했다. (문항카드 20/30)
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2, 2b-3]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $m+\sigma+n=76$을 계산했다. (문항카드 10/30)
      depends_on: [2.M1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    평평한 면과 둥근 면이 나올 확률이 각각 $p$, $1-p$인 윷짝 한 개를 $2023$번 던졌을 때, 평평한 면이 나온 횟수가 짝수일 확률을 $p$에 대한 식으로 나타내시오. (단, $0$은 짝수이다.)
  points: 15
  depends_on: []
  answer: {kind: expression, value: '1/2 - (2*p - 1)**2023/2', equivalents: ['1/2 + (1 - 2*p)**2023/2'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\{p+(1-p)\}^{2023}-\{p+(p-1)\}^{2023}$을 전개하면 $k$가 짝수인 항만 2배로 남는다.
    steps:
    - id: 3a
      content: |
        $1-(2p-1)^{2023}=2\displaystyle\sum_{j=0}^{1011}{}_{2023}\mathrm{C}_{2j}p^{2j}(1-p)^{2023-2j}$이므로 구하는 확률은 $\dfrac12-\dfrac{(2p-1)^{2023}}{2}$.
      criteria: ['3.M1', '3.A1']
    hint_ladder:
    - 평평한 면이 $k$번 나올 확률을 조합으로 써 보자.
    - $(1-p)$ 대신 $(p-1)$을 넣은 이항 전개와 비교해 보자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2023 문항카드6 예시답안 p.66~67'
    steps:
    - id: 3b-1
      content: |
        평평한 면이 $k$번 나올 확률은 ${}_{2023}\mathrm{C}_kp^k(1-p)^{2023-k}$이므로 구하는 확률은 $\displaystyle\sum_{j=0}^{1011}{}_{2023}\mathrm{C}_{2j}p^{2j}(1-p)^{2023-2j}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        이항정리로 $\{p+(1-p)\}^{2023}=\displaystyle\sum_{k=0}^{2023}{}_{2023}\mathrm{C}_kp^k(1-p)^{2023-k}$,
        $\{p+(p-1)\}^{2023}=\displaystyle\sum_{k=0}^{2023}{}_{2023}\mathrm{C}_kp^k(1-p)^{2023-k}(-1)^{2023-k}$이다. 여기서 $(-1)^{2023-k}$는 $k$가 홀수이면 $1$, 짝수이면 $-1$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        두 식을 빼면 $1-(2p-1)^{2023}=2\displaystyle\sum_{j=0}^{1011}{}_{2023}\mathrm{C}_{2j}p^{2j}(1-p)^{2023-2j}$이고, 이는 평평한 면이 나온 횟수가 짝수일 확률의 $2$배이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        따라서 구하는 확률은 $\dfrac12-\dfrac{(2p-1)^{2023}}{2}$ 또는 $\dfrac12+\dfrac{(1-2p)^{2023}}{2}$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        짝수 번 나올 확률을 $\sum{}_{2023}\mathrm{C}_{2j}p^{2j}(1-p)^{2023-2j}$ 꼴의 조합 식으로 표현했다. (문항카드 10/30)
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 10
      evidence: |
        이항정리(두 전개의 차)로 $\dfrac12-\dfrac{(2p-1)^{2023}}{2}$ 또는 동치식을 얻었다. (문항카드 20/30)
      depends_on: [3.M1]
      steps: [3b-2, 3b-3, 3b-4]
    deductions: []
