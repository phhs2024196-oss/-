intent: |
  적분으로 정의된 함수의 이계도함수로 곡선의 오목·볼록과 변곡점을 조사하고, 부분적분법으로 함수를 구해 접선과 곡선으로 둘러싸인 넓이를 계산하며, 미분과 적분의 관계로 함수를 구한 뒤 삼각함수의 최댓값을 이용해 부등식을 보이는 능력을 본다(문항카드7 출제 의도 요지).
key_idea: |
  $s=x-t$로 치환하면 $f(x)=\int_0^x(x-s)se^s\,ds$, $f'(x)=\int_0^x se^s\,ds$, $f''(x)=xe^x$이다. <나>는 양변을 미분하면 $e^{-x}\int_0^xg'(t)\,dt=\sin(2\pi x)+2\pi x\cos(2\pi x)$가 된다.
stuck: |
  피적분함수에 $x$가 섞인 정적분을 치환으로 정리한 뒤 미분하는 단계, 그리고 (3)에서 $g$를 구한 뒤 $\sin\le1$, $\cos\le1$로 위에서 누르는 발상
