stimuli:
- label: 가
  body: |
    <가> 함수 $f(x)$는 다음 조건을 만족시킨다.
    $$f(x)=\int_0^x(xt-t^2)e^{x-t}dt$$
- label: 나
  body: |
    <나> 함수 $g(x)$는 다음 조건을 만족시킨다.

    (1) $g(0)=0$

    (2) $e^{-x}\displaystyle\int_0^xg'(t)dt=\int_0^xe^{-t}g'(t)dt-x\sin(2\pi x)$

stem: |
  [문제 1] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    제시문 <가>에서 주어진 곡선 $y=f(x)$의 오목과 볼록을 조사하고 변곡점의 좌표를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '(0, 0)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f''(x)=xe^x$이므로 $(-\infty,0)$에서 위로 볼록, $(0,\infty)$에서 아래로 볼록, 변곡점 $(0,0)$.
    steps:
    - id: 1a
      content: |
        $s=x-t$로 $f(x)=x\int_0^xse^sds-\int_0^xs^2e^sds$, $f'(x)=\int_0^xse^sds$, $f''(x)=xe^x$.
      criteria: ['1.M1', '1.A1']
    hint_ladder:
    - 적분 변수가 아닌 $x$를 적분 기호 밖으로 꺼낼 수 있도록 치환해 보자.
    - $f''(x)$의 부호를 조사하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2023 문항카드7 예시답안 p.70'
    steps:
    - id: 1b-1
      content: |
        $f(0)=0$이다. $s=x-t$라 놓으면 $\dfrac{ds}{dt}=-1$이고
        $$f(x)=\int_x^0(x-s)se^s(-1)\,ds=\int_0^x(x-s)se^s\,ds=\int_0^xxse^s\,ds-\int_0^xs^2e^s\,ds$$
        이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f'(x)=\dfrac{d}{dx}\left[x\int_0^xse^sds-\int_0^xs^2e^sds\right]=\int_0^xse^sds+x^2e^x-x^2e^x=\int_0^xse^sds$이고 $f'(0)=0$이다. 한 번 더 미분하면 $f''(x)=xe^x$이고 $f''(0)=0$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $x<0$일 때 $f''(x)<0$, $x>0$일 때 $f''(x)>0$이므로 열린구간 $(-\infty,0)$에서 위로 볼록하고 열린구간 $(0,\infty)$에서 아래로 볼록하다. $f''(0)=0$이고 $x=0$ 좌우에서 $f''(x)$의 부호가 바뀌므로 점 $(0,f(0))=(0,0)$은 변곡점이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 먼저 부분적분으로 $f(x)=xe^x-2e^x+x+2$를 구하고(소문항 2의 계산) 두 번 미분한다.
    steps:
    - id: 1c-1
      content: |
        $f'(x)=xe^x-e^x+1$, $f''(x)=xe^x$이므로 같은 결론을 얻는다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        이계도함수 $f''(x)=xe^x$를 구했다. (문항카드 10/20)
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $f''$의 부호로 $(-\infty,0)$ 위로 볼록, $(0,\infty)$ 아래로 볼록을 밝히고 변곡점 $(0,0)$을 구했다. (문항카드 10/20)
      depends_on: [1.M1]
      steps: [1b-3, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    제시문 <가>에서 주어진 곡선 $y=f(x)$ 위의 점 $(0,f(0))$에서의 접선을 $\ell_1$, 점 $(2,f(2))$에서의 접선을 $\ell_2$라고 하자. 곡선 $y=f(x)$와 두 직선 $\ell_1$, $\ell_2$로 둘러싸인 도형의 넓이를 구하시오.
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: '(-exp(4) + 8*exp(2) + 1)/(exp(2) + 1)', equivalents: ['9 - exp(2) - 8/(exp(2) + 1)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=xe^x-2e^x+x+2$, $\ell_1:y=0$, $\ell_2:y=(e^2+1)x-2(e^2-1)$이고 구하는 넓이는 $\int_0^2f\,dx$에서 삼각형 $S_2$를 뺀 것이다.
    steps:
    - id: 2a
      content: |
        $(9-e^2)-\left(4-\dfrac{4(e^2-1)}{e^2+1}\right)=\dfrac{-e^4+8e^2+1}{e^2+1}$.
      criteria: ['2.M1', '2.R1', '2.A1']
    hint_ladder:
    - 부분적분으로 $f(x)$를 닫힌 꼴로 구하자.
    - 곡선이 $\ell_2$보다 항상 위에 있는지 $f(x)-\ell_2(x)$를 인수분해해 확인하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2023 문항카드7 예시답안 p.71~72'
    steps:
    - id: 2b-1
      content: |
        $f(x)=xe^x\int_0^xte^{-t}dt-e^x\int_0^xt^2e^{-t}dt$이다. 부분적분법으로
        $A=xe^x\int_0^xte^{-t}dt=xe^x\left[-xe^{-x}-e^{-x}+1\right]=-x^2-x+xe^x$,
        $B=e^x\int_0^xt^2e^{-t}dt=e^x\left[-x^2e^{-x}+2(-xe^{-x}-e^{-x}+1)\right]=-x^2-2x-2+2e^x$
        이므로 $f(x)=A-B=xe^x-2e^x+x+2$, $f'(x)=xe^x-e^x+1$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        점 $(0,0)$에서의 접선의 기울기는 $f'(0)=0$이므로 $\ell_1:y=0$이다. 점 $(2,4)$에서의 접선의 기울기는 $f'(2)=e^2+1$이므로 $\ell_2:y=(e^2+1)x-2(e^2-1)$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $f(x)-\{(e^2+1)x-2(e^2-1)\}=xe^x-2e^x+x+2-(e^2+1)x+2(e^2-1)=(x-2)(e^x-e^2)\ge0$이므로 곡선 $y=f(x)$는 접선 $\ell_2$보다 항상 위에 있다.
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        [그림: $x\ge0$에서 곡선은 $x$축($\ell_1$) 위에 있고, $\ell_2$는 $x$절편 $\dfrac{2(e^2-1)}{e^2+1}$에서 $x$축과 만나 점 $(2,4)$에서 곡선에 접함. 곡선·$x$축·$\ell_2$로 둘러싸인 영역 $S_1$과, $\ell_2$·$x$축·직선 $x=2$로 둘러싸인 삼각형 $S_2$]
        $S_1+S_2=\displaystyle\int_0^2f(x)dx=\left[xe^x-3e^x+\frac12x^2+2x\right]_0^2=9-e^2$이다.
      criteria: ['2.A1']
    - id: 2b-5
      content: |
        삼각형 $S_2$의 넓이는 $\left(2-\dfrac{2(e^2-1)}{e^2+1}\right)\times4\times\dfrac12=4-\dfrac{4(e^2-1)}{e^2+1}$이다. 따라서 구하는 넓이는
        $$(S_1+S_2)-S_2=5-e^2+\frac{4(e^2-1)}{e^2+1}=9-e^2-\frac{8}{e^2+1}=\frac{-e^4+8e^2+1}{e^2+1}$$
        이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $f(x)=xe^x-2e^x+x+2$를 바탕으로 접선 $\ell_1:y=0$, $\ell_2:y=(e^2+1)x-2(e^2-1)$을 구했다. (문항카드 10/40)
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: |
        $f(x)-\ell_2(x)=(x-2)(e^x-e^2)\ge0$ 등으로 곡선이 접선 $\ell_2$보다 항상 위에 있음을 밝혔다. (문항카드 10/40)
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        정적분으로 넓이 $\dfrac{-e^4+8e^2+1}{e^2+1}$(동치식 허용)을 구했다. (문항카드 20/40)
      depends_on: [2.M1, 2.R1]
      steps: [2b-4, 2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    제시문 <나>에서 주어진 함수 $g(x)$에 대하여, $\displaystyle\int_0^{2023}g(x)dx<4046\pi e^{2023}$이 성립함을 보이시오.
  points: 20
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 양변을 미분해 $g(x)=e^x\{\sin(2\pi x)+2\pi x\cos(2\pi x)\}$를 구하고 $g(x)\le e^x(1+2\pi x)$로 누른다.
    steps:
    - id: 3a
      content: |
        $\int_0^{2023}e^x(1+2\pi x)dx=4046\pi e^{2023}+(1-2\pi)(e^{2023}-1)<4046\pi e^{2023}$.
      criteria: ['3.M1', '3.R1']
    hint_ladder:
    - 조건 (2)의 양변을 $x$에 대하여 미분해 보자.
    - $\sin$, $\cos$는 $1$을 넘지 않는다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2023 문항카드7 예시답안 p.72'
    steps:
    - id: 3b-1
      content: |
        조건 (2)의 양변을 $x$에 대해 미분하면
        $$-e^{-x}\int_0^xg'(t)dt+e^{-x}g'(x)=e^{-x}g'(x)-\sin(2\pi x)-2\pi x\cos(2\pi x)$$
        이므로 $e^{-x}\int_0^xg'(t)dt=\sin(2\pi x)+2\pi x\cos(2\pi x)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $g(0)=0$이고 $g(x)-g(0)=e^x\{\sin(2\pi x)+2\pi x\cos(2\pi x)\}$이므로 $g(x)=e^x\{\sin(2\pi x)+2\pi x\cos(2\pi x)\}$이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        모든 양의 실수 $x$에 대해 $\sin(2\pi x)\le1$, $\cos(2\pi x)\le1$이므로 $\sin(2\pi x)+2\pi x\cos(2\pi x)\le1+2\pi x$이고, 따라서 $g(x)\le e^x(1+2\pi x)$이다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $$\int_0^{2023}g(x)dx\le\int_0^{2023}e^x(1+2\pi x)dx=\left[e^x\right]_0^{2023}+2\pi\left(\left[xe^x\right]_0^{2023}-\int_0^{2023}e^xdx\right)$$
        $$=e^{2023}-1+2\pi(2023e^{2023}-e^{2023}+1)=4046\pi e^{2023}+(1-2\pi)(e^{2023}-1)$$
        이다.
      criteria: ['3.R1']
    - id: 3b-5
      content: |
        $(1-2\pi)(e^{2023}-1)<0$이므로 $\displaystyle\int_0^{2023}g(x)dx\le4046\pi e^{2023}+(1-2\pi)(e^{2023}-1)<4046\pi e^{2023}$이다. ■
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
