intent: |
  이항계수의 성질(파스칼 관계)과 대칭성, $\sum$의 성질, 등비수열의 합을 이용해 3의 배수 번째 이항계수의 합에 관한 관계식을 분석하고 정확한 논증으로 값을 도출하는 능력을 본다(문항카드9 출제 의도 요지).
key_idea: |
  파스칼 관계를 세 번 적용해 ${}_{3n+3}\mathrm{C}_{3k}$를 ${}_{3n}\mathrm{C}$ 네 항으로 펼치고, 합하면 $a_n+a_{n+1}=3\cdot2^{3n}$. 이 점화식을 부호를 바꿔 더하면 $a_{100}$이 나오고, 대칭성으로 ${}_{300}\mathrm{C}_{3k-1}$과 ${}_{300}\mathrm{C}_{3k-2}$의 합이 같다.
stuck: |
  (2) 펼친 항들 ${}_{3n}\mathrm{C}_{3k-3}$, ${}_{3n}\mathrm{C}_{3k}$가 각각 $a_n-1$을 이룬다는 것을 보고 $3\sum{}_{3n}\mathrm{C}_j$로 묶는 단계, (3) 교대합으로 $a_{100}$을 구하고 나머지 두 잉여류의 합을 대칭성으로 반분하는 발상
