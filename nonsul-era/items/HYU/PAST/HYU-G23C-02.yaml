intent: |
  미분으로 함수의 개형을 파악해 합성함수 방정식의 근의 개수와 연결하고, 미분계수의 의미를 삼각함수의 덧셈정리에 적용하며, 평행이동해도 호와 현 사이 영역이 일정하다는 사실과 삼각형 넓이로 도함수를 계산하는 능력을 본다(문항카드10 출제 의도 요지).
key_idea: |
  (1) $f$의 최댓값이 $\tfrac1e$(유일한 최대점 $x=e-\alpha$)이므로 $(f\circ f)(x)=\tfrac1e\iff f(x)=e-\alpha$. (2) 접선의 기울기 $a=\tan\alpha$, $b=\tan\beta$와 $\theta=\pi-\alpha-\beta$. (3) 현 PQ의 길이가 항상 1이라 활꼴 넓이가 상수이고, $\triangle\mathrm{APQ}=\tfrac{\sqrt3}{4}(1-t^2)$.
stuck: |
  (1) $f(u)=\tfrac1e$의 해가 최대점 하나뿐임을 이용해 바깥 함수를 벗기는 단계, (3) 평행이동해도 현의 길이가 변하지 않는다는 불변량을 찾아 넓이를 삼각형 부분과 상수 부분으로 나누는 발상
