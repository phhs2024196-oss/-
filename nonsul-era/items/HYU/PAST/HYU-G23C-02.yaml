stimuli: []

stem: |
  [문제 2] 다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    함수 $f(x)=\dfrac{\ln(x+\alpha)}{x+\alpha}$에 대하여 방정식 $(f\circ f)(x)=\dfrac1e$이 서로 다른 두 실근을 갖도록 하는 실수 $\alpha$의 범위를 구하시오. $\left(\text{단, }\displaystyle\lim_{x\to\infty}\frac{\ln x}{x}=0\right)$
  points: 15
  depends_on: []
  answer: {kind: set, value: 'Interval.open(E - 1/E, E)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f$의 최댓값은 $x=e-\alpha$에서 $\tfrac1e$이므로 $(f\circ f)(x)=\tfrac1e\iff f(x)=e-\alpha$이고, 이것이 두 근을 가질 조건은 $0<e-\alpha<\tfrac1e$.
    steps:
    - id: 1a
      content: |
        $0<e-\alpha<\dfrac1e\iff e-\dfrac1e<\alpha<e$.
      criteria: ['1.M1', '1.A1']
    hint_ladder:
    - $f(u)=\dfrac1e$을 만족하는 $u$는 몇 개인가?
    - $y=f(x)$와 수평선 $y=c$의 교점이 두 개인 $c$의 범위는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2023 문항카드10 예시답안 p.84'
    steps:
    - id: 1b-1
      content: |
        $f(x)=\dfrac{\ln(x+\alpha)}{x+\alpha}$를 미분하면 $f'(x)=\dfrac{1}{(x+\alpha)^2}\{1-\ln(x+\alpha)\}$이다. 따라서 $f'(x)$는 $-\alpha<x<e-\alpha$에서 양수, $x>e-\alpha$에서 음수, $x=e-\alpha$에서 $0$이며, $f(x)$는 $x=e-\alpha$에서 최댓값 $\dfrac1e$을 갖는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f(x)$는 $x>-\alpha$에서만 정의되고 $x$가 $-\alpha$로 가까이 갈수록 음의 무한대로 발산하며, $\displaystyle\lim_{x\to\infty}\frac{\ln x}{x}=0$에 의해 $x\to\infty$일 때 $0$에 가까워진다. [그림: 점근선 $x=-\alpha$ 오른쪽에서 $-\infty$로부터 증가해 $x=e-\alpha$에서 높이 $\tfrac1e$의 최댓값에 닿은 뒤 감소하며 $x$축에 점근하는 곡선]
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        그러므로 $(f\circ f)(x)=\dfrac1e$이라면 $f(x)=e-\alpha$인데, $f(x)=c$인 $x$가 정확히 두 개가 되는 것은 $0<c<\dfrac1e$에서만 가능하다. 그러므로 $0<e-\alpha<\dfrac1e$이고, 이것은 $e-\dfrac1e<\alpha<e$와 동치이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        $f'(x)$의 부호로 $f(x)$의 개형(정의역 $x>-\alpha$, $-\infty$에서 증가, 최댓값 $e^{-1}$, $x\to\infty$에서 $0$에 수렴)을 정확히 파악했다. (문항카드 20/30)
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $f(x)=e-\alpha$로 바꾸어 $0<e-\alpha<\dfrac1e$, 즉 $e-\dfrac1e<\alpha<e$를 구했다. (문항카드 10/30)
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    미분가능한 함수 $f(x)$가 네 조건
    $$f'(1)<0,\qquad f'(-1)>0,\qquad f'(-1)-f'(1)=23,\qquad f(1)=f(-1)=0$$
    을 만족시킨다. 곡선 $y=f(x)$ 위의 점 $\mathrm{A}(-1,0)$에서의 접선과 점 $\mathrm{B}(1,0)$에서의 접선의 교점을 $\mathrm{P}$, 삼각형 $\mathrm{APB}$의 넓이를 $S$라 할 때, $\cot(\angle\mathrm{APB})$를 $S$에 대한 식으로 나타내시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'S/2 - 1/23', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a=f'(-1)$, $b=-f'(1)$이면 $S=\dfrac{2ab}{a+b}$, $\tan(\angle\mathrm{APB})=\dfrac{a+b}{ab-1}$, $a+b=23$.
    steps:
    - id: 2a
      content: |
        $\cot(\angle\mathrm{APB})=\dfrac{ab-1}{a+b}=\dfrac{S}{2}-\dfrac{1}{23}$.
      criteria: ['2.M1', '2.A1']
    hint_ladder:
    - 두 접선이 $x$축과 이루는 예각을 각각 $\alpha$, $\beta$라 하자.
    - $\angle\mathrm{APB}=\pi-\alpha-\beta$이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2023 문항카드10 예시답안 p.84'
    steps:
    - id: 2b-1
      content: |
        $f'(-1)=a$, $f'(1)=-b$로 놓자($a>0$, $b>0$, $a+b=23$). 곡선 위의 점 $\mathrm{A}(-1,0)$과 $\mathrm{B}(1,0)$에서의 접선은 각각 $y=a(x+1)$, $y=-b(x-1)$이고, 연립하면 교점 $\mathrm{P}\left(\dfrac{b-a}{a+b},\dfrac{2ab}{a+b}\right)$를 얻는다. 따라서 $S=\dfrac12\times2\times\dfrac{2ab}{a+b}=\dfrac{2ab}{a+b}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        두 접선이 $x$축과 이루는 예각 $\angle\mathrm{PAB}$, $\angle\mathrm{PBA}$를 각각 $\alpha$, $\beta$라 하면 $a=\tan\alpha$, $b=\tan\beta$이다. $\theta=\angle\mathrm{APB}$라 하면 $\theta=\pi-\alpha-\beta$이므로
        $$\tan\theta=\tan(\pi-\alpha-\beta)=-\tan(\alpha+\beta)=\frac{\tan\alpha+\tan\beta}{\tan\alpha\tan\beta-1}=\frac{a+b}{ab-1}$$
        이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        그러므로 $\cot\theta=\dfrac{ab}{a+b}-\dfrac{1}{a+b}=\dfrac{S}{2}-\dfrac{1}{23}$이 된다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        두 접선의 교점을 구해 삼각형의 넓이 $S$를 $f'(-1)$과 $f'(1)$의 식 $\dfrac{2ab}{a+b}$ 등으로 나타냈다. (문항카드 20/30)
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        삼각함수의 덧셈정리로 $\cot(\angle\mathrm{APB})=\dfrac{S}{2}-\dfrac{1}{23}$을 얻었다. (문항카드 10/30)
      depends_on: [2.M1]
      steps: [2b-2, 2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    높이가 $1$인 정삼각형 $\mathrm{ABC}$의 꼭짓점 $\mathrm{A}$를 중심으로 하고 변 $\mathrm{BC}$에 접하는 원이 있다. 오른쪽 그림과 같이 이 원을 직선 $\mathrm{BC}$에 접한 채 거리 $t$만큼 $(0<t<1)$ 평행이동한 원과 변 $\mathrm{AB}$, 변 $\mathrm{AC}$로 둘러싸인 도형의 넓이를 $f(t)$라고 하자. 이때 도함수 $f'(t)$를 구하시오.

    [그림: 밑변 BC가 수평인 정삼각형 ABC. 꼭짓점 A에서 오른쪽으로 거리 $t$만큼 떨어진 점(이동한 원의 중심)에서 BC에 내린 수직 점선(BC와 직각)이 있고, 이동한 원의 호가 BC에 접하며 변 AB, AC와 만남. 두 변 AB, AC와 원호로 둘러싸인 부분이 색칠되어 $f(t)$로 표시됨. 문제지에서 '높이가 1인'에 밑줄]
  points: 20
  depends_on: []
  answer: {kind: expression, value: '-sqrt(3)*t/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 현 PQ의 길이가 항상 1(반지름과 같음)이므로 활꼴 넓이는 상수 $C$, $f(t)=\tfrac{\sqrt3}{4}\overline{\mathrm{AP}}\cdot\overline{\mathrm{AQ}}+C=\tfrac{\sqrt3}{4}(1-t^2)+C$.
    steps:
    - id: 3a
      content: |
        $f'(t)=-\dfrac{\sqrt3}{2}t$.
      criteria: ['3.M1', '3.A1']
    hint_ladder:
    - A를 원점 위 $(0,1)$에 두고 원과 두 변의 교점을 구하자.
    - 현 PQ의 길이를 계산해 보면 $t$와 무관하다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2023 문항카드10 예시답안 p.84~85'
    steps:
    - id: 3b-1
      content: |
        $\mathrm{A}(0,1)$, 직선 BC를 $x$축으로 두면 원의 방정식은 $(x-t)^2+(y-1)^2=1$이고 직선 AB와 AC의 방정식은 각각 $y=\sqrt3x+1$, $y=-\sqrt3x+1$이다. 원과 직선 AB, AC가 만나는 두 점 $\mathrm{P}(x_1,y_1)$, $\mathrm{Q}(x_2,y_2)$를 구하려면 이차방정식 $(x-t)^2+(\sqrt3x)^2=1$을 풀어야 하며, 그 결과 $x_1=\dfrac14\left(t-\sqrt{4-3t^2}\right)$, $x_2=\dfrac14\left(t+\sqrt{4-3t^2}\right)$, $y_1=1+\dfrac{\sqrt3}{4}\left(t-\sqrt{4-3t^2}\right)$, $y_2=1-\dfrac{\sqrt3}{4}\left(t+\sqrt{4-3t^2}\right)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        선분 PQ의 길이는 $\sqrt{(x_1-x_2)^2+(y_1-y_2)^2}=\sqrt{\left(\dfrac{\sqrt{4-3t^2}}{2}\right)^2+\left(\dfrac{\sqrt3t}{2}\right)^2}=1$이 되므로, 호 PQ와 현 PQ 사이 영역의 넓이는 $t$와 관계없이 항상 상수 $C$로 일정하다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        삼각형 APQ의 넓이는 $\dfrac12\overline{\mathrm{AP}}\times\overline{\mathrm{AQ}}\times\sin(\angle\mathrm{PAQ})=\dfrac{\sqrt3}{4}\overline{\mathrm{AP}}\times\overline{\mathrm{AQ}}$이고, $\overline{\mathrm{AP}}^2=x_1^2+(y_1-1)^2=\dfrac14\left(t-\sqrt{4-3t^2}\right)^2$, $\overline{\mathrm{AQ}}^2=x_2^2+(y_2-1)^2=\dfrac14\left(t+\sqrt{4-3t^2}\right)^2$이므로 $\overline{\mathrm{AP}}\times\overline{\mathrm{AQ}}=-\dfrac14\left(t-\sqrt{4-3t^2}\right)\left(t+\sqrt{4-3t^2}\right)=1-t^2$이 된다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        따라서 $f(t)=\dfrac{\sqrt3}{4}(1-t^2)+C$이고 $f'(t)=-\dfrac{\sqrt3}{2}t$를 얻는다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        원의 방정식과 직선 AB, AC의 방정식을 연립하여 교점 P, Q의 좌표를 구했다. (문항카드 20/40)
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 10
      evidence: |
        현 PQ의 길이가 1로 일정함(활꼴 넓이 상수)을 보이고 $\triangle\mathrm{APQ}=\dfrac{\sqrt3}{4}(1-t^2)$로부터 $f'(t)=-\dfrac{\sqrt3}{2}t$를 구했다. (문항카드 20/40)
      depends_on: [3.M1]
      steps: [3b-2, 3b-3, 3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

