key_idea: '(1) $a,r$의 부호로 경우를 나눠 $\sum\lvert a_n\rvert=\dfrac{\lvert a\rvert}{1-\lvert r\rvert}$를 처리, (2) $f(6)<0$이어야 접선의 $y$절편 조건이 성립해 $q=\alpha\beta=18$, (3) $g(x)=e^{-x}\lvert\cos x\rvert$의 극댓값이 공비 $e^{-\pi}$인 등비수열.'
stuck: (2)에서 $f(6)>0$인 경우가 모순임을 보이고 $f(6)<0$에서 $\lvert f\rvert=-f$로 접선을 세우는 단계, (3)에서 $b_n$이 $x=\dfrac{(4n-1)\pi}{4}$에서의 극댓값임을 그래프 개형으로 해석하는 단계
