stimuli:
- label: 가
  body: |
    등비수열 $\{a_n\}$에 대하여 급수 $\displaystyle\sum_{n=1}^{\infty}a_n$이 수렴하고,
    $$\sum_{n=1}^{\infty}a_{2n}=-4,\qquad \sum_{n=1}^{\infty}\lvert a_n\rvert=20$$
    이 성립한다.
- label: 나
  body: |
    최고차항의 계수가 $1$인 이차함수 $f(x)$가 다음 조건을 만족시킨다.
    (1) 방정식 $f(x)=0$은 서로 다른 두 실근 $\alpha$, $\beta\ (\alpha<\beta)$를 갖고, $\displaystyle\int_0^{\alpha}\lvert f(x)\rvert dx=\dfrac{50}{3}$이다.
    (2) 함수 $\lvert f(x)\rvert$는 $x=6$에서 미분가능하고, 곡선 $y=\lvert f(x)\rvert$ 위의 점 $(6,\lvert f(6)\rvert)$에서의 접선의 $y$절편이 $\lvert f(0)\rvert$이다.
- label: 다
  body: |
    $x>0$에서 정의된 함수 $g(x)=e^{-x}\lvert\cos x\rvert$에 대하여 수열 $\{b_n\}$이 다음 조건을 만족시킨다.
    (1) $b_1<1$이고 모든 자연수 $n$에 대하여 $b_{n+1}<b_n$이다.
    (2) $b_1<k<1$인 모든 실수 $k$에 대하여 곡선 $y=g(x)$와 직선 $y=k$가 만나는 점의 개수는 $1$이다.
    (3) 모든 자연수 $n$과 $b_{n+1}<k<b_n$인 모든 실수 $k$에 대하여 곡선 $y=g(x)$와 직선 $y=k$가 만나는 점의 개수는 $2n+1$이다.

stem: |
  [문제 1] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    급수 $\displaystyle\sum_{n=1}^{\infty}a_{4n-1}$의 합이 될 수 있는 값을 모두 구하시오.
  points: 15
  depends_on: []
  answer: {kind: set, value: '[16/17, -16/17]', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\dfrac{ar}{1-r^2}=-4$, $\dfrac{\lvert a\rvert}{1-\lvert r\rvert}=20$을 부호별로 풀면 $(a,r)=\left(15,-\dfrac14\right),\left(-15,\dfrac14\right)$, $\sum a_{4n-1}=\dfrac{ar^2}{1-r^4}=\pm\dfrac{16}{17}$.'
    steps:
    - {id: 1a, content: '$(a,r)=\left(15,-\dfrac14\right)$ 또는 $\left(-15,\dfrac14\right)$ ⇒ $\pm\dfrac{16}{17}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - '$a_n=ar^{n-1}$로 놓고 두 급수를 $a$, $r$로 나타내 보자.'
    - '$\lvert a\rvert$, $\lvert r\rvert$을 없애려면 $a$, $r$의 부호로 경우를 나누어야 한다.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드5 PDF p.74~75(인쇄 p.72~73)'
    steps:
    - id: 1b-1
      content: |
        $a_n=ar^{n-1}\ (-1<r<1)$이라 하면 $\lvert a_n\rvert=\lvert a\rvert\lvert r\rvert^{n-1}$, $a_{2n}=ar^{2n-1}=ar\times r^{2(n-1)}$이므로
        $$\sum_{n=1}^{\infty}a_{2n}=\dfrac{ar}{1-r^2}=-4,\qquad \sum_{n=1}^{\infty}\lvert a_n\rvert=\dfrac{\lvert a\rvert}{1-\lvert r\rvert}=20.$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (경우 1) $a>0$, $0<r<1$: $-4=\dfrac{a}{1-r}\cdot\dfrac{r}{1+r}=\dfrac{20r}{1+r}$에서 $5r=-(1+r)$, $r=-\dfrac16<0$ 이므로 모순.
        (경우 2) $a>0$, $-1<r<0$: $-4=\dfrac{a}{1+r}\cdot\dfrac{r}{1-r}=\dfrac{20r}{1-r}$에서 $5r=-(1-r)$, $r=-\dfrac14$, $a=20(1+r)=15$.
        (경우 3) $a<0$, $0<r<1$: $-4=\dfrac{-a}{1-r}\cdot\dfrac{-r}{1+r}=-\dfrac{20r}{1+r}$에서 $5r=1+r$, $r=\dfrac14$, $a=-20(1-r)=-15$.
        (경우 4) $a<0$, $-1<r<0$: $-4=-\dfrac{20r}{1-r}$에서 $5r=1-r$, $r=\dfrac16>0$ 이므로 모순.
        (참고) $ar=-4(1-r^2)<0$을 이용하면 (경우 2)와 (경우 3)만 바로 고려할 수 있다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $a_{4n-1}=ar^{4n-2}=ar^2\times r^{4(n-1)}$이므로 $l=\displaystyle\sum_{n=1}^{\infty}a_{4n-1}=\dfrac{ar^2}{1-r^4}$.
        $(a,r)=\left(15,-\dfrac14\right)$이면 $l=\dfrac{15\times16}{(16+1)(16-1)}=\dfrac{16}{17}$, $(a,r)=\left(-15,\dfrac14\right)$이면 $l=-\dfrac{16}{17}$.
        따라서 가능한 값은 $\dfrac{16}{17}$, $-\dfrac{16}{17}$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: 두 급수 조건을 $a$, $r$의 식으로 세우고 부호에 따른 경우를 따져 가능한 $(a,r)=\left(15,-\dfrac14\right)$, $\left(-15,\dfrac14\right)$를 모두 구했다(공식 채점기준 "가능한 $a$와 $r$의 값을 모두 구하였는가" 20/100).
      depends_on: []
      steps: [1a, 1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $\sum a_{4n-1}=\dfrac{ar^2}{1-r^4}$로 계산해 $\dfrac{16}{17}$, $-\dfrac{16}{17}$을 모두 적었다(공식 채점기준 10/100).
      depends_on: [1.M1]
      steps: [1a, 1b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '2'
  stem: |
    $f(10)$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '8', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\alpha>0$이고, $f(6)>0$이면 접선의 $y$절편이 $q-36\ne q$이므로 $f(6)<0$. 그러면 $y$절편 $36-q=q$에서 $q=\alpha\beta=18$, 적분 조건에서 $\alpha=2$, $\beta=9$.'
    steps:
    - {id: 2a, content: '$f(x)=x^2-11x+18$, $f(10)=8$', criteria: [2.A1]}
    hint_ladder:
    - '$\alpha\le0$이면 적분값의 부호가 어떻게 되는가?'
    - '$f(6)$의 부호에 따라 $\lvert f\rvert$의 접선 식이 달라진다.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드5 PDF p.75~76(인쇄 p.73~74)'
    steps:
    - id: 2b-1
      content: |
        $\alpha=0$이면 $\displaystyle\int_0^{\alpha}\lvert f(x)\rvert dx=0\ne\dfrac{50}{3}$으로 모순. $\alpha<0$이면 $\displaystyle\int_0^{\alpha}\lvert f(x)\rvert dx=-\int_{\alpha}^{0}\lvert f(x)\rvert dx<0$ (넓이는 양수)이므로 모순. 따라서 $0<\alpha<\beta$이고, $f(x)=x^2+px+q$라 하면 $q=\alpha\beta>0$.
      criteria: [2.R1]
    - id: 2b-2
      content: |
        곡선 $y=\lvert f(x)\rvert$ 위의 점 $(6,\lvert f(6)\rvert)$에서의 접선을 $y=h(x)$라 하자.
        $f(6)>0$이면 $h(x)=f'(6)(x-6)+f(6)=(12+p)(x-6)+(36+6p+q)$, $h(0)=q-36$. 조건 (2)에 의해 $h(0)=\lvert f(0)\rvert=q$ 이어야 하지만 $q-36=q$를 만족시키는 $q$는 없으므로 $f(6)>0$일 수 없다. 또 $\lvert f(x)\rvert$가 $x=6$에서 미분가능하므로 $f(6)\ne0$. 따라서 $f(6)<0$.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        $f(6)<0$이므로 $h(x)=-f'(6)(x-6)-f(6)=-(12+p)(x-6)-(36+6p+q)$, $h(0)=6(12+p)-(36+6p+q)=36-q=q$, 즉 $q=18$.
        근과 계수의 관계에서 $p=-(\alpha+\beta)$, $18=q=\alpha\beta$이므로 $p=-\left(\alpha+\dfrac{18}{\alpha}\right)$이고 $\alpha^2<\alpha\beta=18$에서 $0<\alpha<3\sqrt2$. 또한 $f(6)<0$이므로 $0<\alpha<6<\beta$.
      criteria: [2.M1]
    - id: 2b-4
      content: |
        구간 $[0,\alpha)$에서 $\lvert f(x)\rvert=f(x)>0$이므로
        $$\int_0^{\alpha}\lvert f(x)\rvert dx=\int_0^{\alpha}f(x)dx=\dfrac13\alpha^3+\dfrac12p\alpha^2+q\alpha=\dfrac{50}{3}\ \cdots\ \text{㉠}$$
        ㉠의 양변에 $6$을 곱하면 $2\alpha^3+3p\alpha^2+6q\alpha=100$이고, $q=18$, $p=-\left(\alpha+\dfrac{18}{\alpha}\right)$을 대입하면 $2\alpha^3-3\alpha^2\left(\alpha+\dfrac{18}{\alpha}\right)+108\alpha=100$, 즉 $\alpha^3-54\alpha+100=0$.
      criteria: [2.A1]
    - id: 2b-5
      content: |
        이 식의 해는 $2$, $-1-\sqrt{51}$, $-1+\sqrt{51}$이다. $-1-\sqrt{51}<0$, $-1+\sqrt{51}>3\sqrt2$이므로 $\alpha=2$. 따라서 $\beta=9$, $p=-(2+9)=-11$, $f(x)=x^2-11x+18$이고 $f(10)=8$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: 적분 조건으로 $\alpha>0$, 접선 조건과 미분가능성으로 $f(6)<0$(즉 $\beta>6$)임을 근거와 함께 적었다(공식 채점기준 "$\alpha>0$이고 $\beta>6$임을 확인하였는가" 10/100).
      depends_on: []
      steps: [2b-1, 2b-2]
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $f(6)<0$일 때의 접선 $y$절편 $36-q=q$에서 $\alpha\beta=q=18$을 얻었다(공식 채점기준 10/100).
      depends_on: [2.R1]
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: 적분 조건에서 $\alpha^3-54\alpha+100=0$을 세워 $\alpha=2$, $\beta=9$, $f(x)=x^2-11x+18$, $f(10)=8$을 얻었다(공식 채점기준 20/100).
      depends_on: [2.M1]
      steps: [2a, 2b-4, 2b-5]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '3'
  stem: |
    급수 $\displaystyle\sum_{n=1}^{\infty}b_n$의 합을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'exp(pi/4)/(sqrt(2)*(exp(pi) - 1))', equivalents: ['\dfrac{e^{\frac{\pi}{4}}}{\sqrt2(e^{\pi}-1)}'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$b_n$은 $g$의 $n$번째 극댓값 $g\left(\dfrac{3\pi}{4}+(n-1)\pi\right)=\dfrac{1}{\sqrt2}e^{\frac{\pi}{4}}e^{-n\pi}$, 공비 $e^{-\pi}$인 등비수열.'
    steps:
    - {id: 3a, content: '$\displaystyle\sum b_n=\dfrac{e^{\frac{\pi}{4}}}{\sqrt2(e^{\pi}-1)}$', criteria: [3.A1]}
    hint_ladder:
    - '$P(x)=e^{-x}\cos x$의 극값을 먼저 구해 보자.'
    - '직선 $y=k$를 아래로 내리면서 교점 개수가 언제 바뀌는지 그래프로 보자.'
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드5 PDF p.76(인쇄 p.74)'
    steps:
    - id: 3b-1
      content: |
        $P(x)=e^{-x}\cos x$라 하면 $P'(x)=-e^{-x}(\cos x+\sin x)$. $0<x<\dfrac{\pi}{2}$ 또는 $\dfrac{\pi}{2}<x<\dfrac{3\pi}{2}$에서 $P'(x)=0$이면 $\cos x+\sin x=\cos x(1+\tan x)=0$, $\tan x=-1$. $x=\dfrac{3\pi}{4}$에서 $P$는 극솟값 $P\left(\dfrac{3\pi}{4}\right)=-\dfrac{1}{\sqrt2}e^{\frac{\pi}{4}}e^{-\pi}$을 가지므로 $g(x)=\lvert P(x)\rvert$는 $x=\dfrac{3\pi}{4}$에서 극댓값 $g\left(\dfrac{3\pi}{4}\right)=\dfrac{1}{\sqrt2}e^{\frac{\pi}{4}}e^{-\pi}$을 갖는다.
        [그림: $y=g(x)$의 개형 — $x\to0+$에서 $1$에 가까워지며 감소해 $x=\dfrac{\pi}{2}$에서 $0$, $x=\dfrac{3\pi}{4}$, $\dfrac{7\pi}{4}$에서 점점 낮아지는 봉우리, $x=\dfrac{3\pi}{2}$, $\dfrac{5\pi}{2}$에서 $0$]
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $\dfrac{3\pi}{2}<x<\dfrac{5\pi}{2}$에서 $g$는 $x=\dfrac{7\pi}{4}$에서 극댓값 $g\left(\dfrac{7\pi}{4}\right)=\dfrac{1}{\sqrt2}e^{\frac{\pi}{4}}e^{-2\pi}<g\left(\dfrac{3\pi}{4}\right)$을 가지므로 $b_1=g\left(\dfrac{3\pi}{4}\right)=\dfrac{1}{\sqrt2}e^{\frac{\pi}{4}}e^{-\pi}$.
        $\dfrac{5\pi}{2}<x<\dfrac{7\pi}{2}$에서 극댓값 $g\left(\dfrac{11\pi}{4}\right)=\dfrac{1}{\sqrt2}e^{\frac{\pi}{4}}e^{-3\pi}<g\left(\dfrac{7\pi}{4}\right)$이므로 $b_2=g\left(\dfrac{7\pi}{4}\right)=\dfrac{1}{\sqrt2}e^{\frac{\pi}{4}}e^{-2\pi}$.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        $y=\tan x$가 주기 $\pi$인 주기함수이므로 $\{b_n\}$은 첫째항이 $\dfrac{1}{\sqrt2}e^{\frac{\pi}{4}}e^{-\pi}$이고 공비가 $e^{-\pi}$인 등비수열이다. $0<e^{-\pi}<1$이므로
        $$\sum_{n=1}^{\infty}b_n=\dfrac{1}{\sqrt2}e^{\frac{\pi}{4}}\times\dfrac{e^{-\pi}}{1-e^{-\pi}}=\dfrac{e^{\frac{\pi}{4}}}{\sqrt2(e^{\pi}-1)}.$$
      criteria: [3.A1]
