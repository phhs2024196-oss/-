key_idea: '$P(l=j)=\dfrac{{}_4\mathrm{C}_j\,{}_3\mathrm{C}_{4-j}}{{}_7\mathrm{C}_4}$와 $k$의 독립 균등분포로 $(k,l)$ 16가지를 전수 정리하고, 경로 수 $\dfrac{(k+l)!}{k!\,l!}$, 신뢰구간 길이 $2z\dfrac{\sigma}{\sqrt n}$을 쓴다.'
stuck: $W=\dfrac kl$의 같은 값을 갖는 $(k,l)$ 쌍을 빠짐없이 묶는 단계와 $\sigma(Y)=\lvert-0.5\rvert\sigma(X)$를 쓰는 단계
