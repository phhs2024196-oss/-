stimuli:
- label: 가
  body: |
    파란 상자에는 숫자 $1$, $2$, $3$, $4$가 하나씩 적혀 있는 $4$개의 공이 들어 있고, 빨간 상자에는 숫자 $5$가 적혀 있는 공이 $4$개, 숫자 $6$이 적혀 있는 공이 $3$개 들어 있다. 파란 상자에서 임의로 $1$개의 공을 꺼낼 때 공에 적힌 수를 $k$, 빨간 상자에서 임의로 $4$개의 공을 동시에 꺼낼 때 숫자 $5$가 적힌 공의 개수를 $l$이라 하자.
- label: 나
  body: |
    평균이 $10$, 표준편차가 $4$인 확률변수 $X$에 대하여,
    확률변수 $Y=-0.5X+5$의 평균을 $m$, 표준편차를 $\sigma$라 하자.
    정규분포 $\mathrm{N}(m,\sigma^2)$을 따르는 모집단에서 크기가 $n$인 표본을 임의추출하여 추정한 모평균 $m$에 대한 신뢰도 $98.76\%$의 신뢰구간은 $a\le m\le b$이고 신뢰도 $86.64\%$의 신뢰구간은 $c\le m\le d$이다.
    단, $Z$가 표준정규분포를 따르는 확률변수일 때, $Z$에 대한 확률은 오른쪽 표준정규분포표를 이용하여 계산한다.
    [표: $z$ / $\mathrm P(0\le Z\le z)$ — $1.0$ / $0.3413$, $1.5$ / $0.4332$, $2.0$ / $0.4772$, $2.5$ / $0.4938$]

stem: |
  [문제 2] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    제시문 <가>에서 주어진 $k$, $l$에 대하여 $\dfrac{k}{l}$의 값을 확률변수 $W$라 할 때, $W$의 기댓값 $\mathrm E(W)$를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '69/56', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$k$, $l$이 독립이므로 $\mathrm E(W)=\mathrm E(k)\,\mathrm E\!\left(\dfrac1l\right)=\dfrac52\cdot\dfrac{69}{140}=\dfrac{69}{56}$로도 확인된다.'
    steps:
    - {id: 1a, content: '$\mathrm E(W)=\dfrac{69}{56}$', criteria: [1.A1]}
    hint_ladder:
    - '$l$이 가질 수 있는 값과 그 확률을 먼저 구하자.'
    - '같은 $W$ 값을 주는 $(k,l)$ 쌍을 묶어 표를 만들자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드6 PDF p.79~80(인쇄 p.77~78)'
    steps:
    - id: 1b-1
      content: |
        $k$는 $\dfrac14$의 확률로 $1,2,3,4$ 중 하나의 값을 갖는다. $l$의 값을 확률변수 $L$이라 하면 $\mathrm P(L=l)=\dfrac{{}_4\mathrm{C}_l\times{}_3\mathrm{C}_{4-l}}{{}_7\mathrm{C}_4}$이고
        $\mathrm P(L=1)=\dfrac{4}{35}$, $\mathrm P(L=2)=\dfrac{18}{35}$, $\mathrm P(L=3)=\dfrac{12}{35}$, $\mathrm P(L=4)=\dfrac{1}{35}$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $W$의 확률분포($\times\dfrac{1}{140}$):
        $W=\dfrac14$: $(1,4)$ $1$; $\dfrac13$: $(1,3)$ $12$; $\dfrac12$: $(1,2),(2,4)$ $19$; $\dfrac23$: $(2,3)$ $12$; $\dfrac34$: $(3,4)$ $1$; $1$: $(1,1),(2,2),(3,3),(4,4)$ $35$; $\dfrac43$: $(4,3)$ $12$; $\dfrac32$: $(3,2)$ $18$; $2$: $(2,1),(4,2)$ $22$; $3$: $(3,1)$ $4$; $4$: $(4,1)$ $4$.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $$\mathrm E(W)=\dfrac{1}{140}\left(1\times\dfrac14+12\times\dfrac13+19\times\dfrac12+12\times\dfrac23+1\times\dfrac34\right)+\dfrac{1}{140}\left(35\times1+12\times\dfrac43+18\times\dfrac32+22\times2+4\times3+4\times4\right)=\dfrac{69}{56}.$$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: '$l$의 확률분포와 $(k,l)$별 확률을 구해 $\mathrm P\!\left(W=\dfrac kl\right)$ 표(또는 동치 계산)를 적었다(공식 채점기준 20/100).'
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $\mathrm E(W)=\dfrac{69}{56}$을 얻었다(공식 채점기준 10/100).
      depends_on: [1.M1]
      steps: [1a, 1b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '2'
  stem: |
    제시문 <가>에서 주어진 $k$, $l$에 대하여 가로의 길이가 $k$이고 세로의 길이가 $l$인 직사각형을 한 변의 길이가 $1$인 $k\times l$개의 정사각형으로 나눈 도형이 있다. 이 도형의 왼쪽 아래 꼭짓점을 $\mathrm A$, 오른쪽 위 꼭짓점을 $\mathrm B$라 하자. 예를 들어, 오른쪽 그림은 $k=3$, $l=4$인 경우이다. 한 변의 길이가 $1$인 정사각형의 변을 따라 점 $\mathrm A$에서 점 $\mathrm B$까지 최단거리로 이동하는 경우의 수를 확률변수 $U$라 할 때, $\mathrm P(U\le10)$을 구하시오.
    [그림: 가로 3칸, 세로 4칸으로 나뉜 직사각형 격자. 왼쪽 아래 꼭짓점 A, 오른쪽 위 꼭짓점 B, 아래 변 길이 3, 오른쪽 변 길이 4 표시]
  points: 20
  depends_on: []
  answer: {kind: value, value: '19/28', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$U=\dfrac{(k+l)!}{k!\,l!}\le10$인 $(k,l)$은 $k+l\le5$ 또는 $(1,4),(4,1)$ 등 10쌍.'
    steps:
    - {id: 2a, content: '$\mathrm P(U\le10)=\dfrac{95}{140}=\dfrac{19}{28}$', criteria: [2.A1]}
    hint_ladder:
    - '최단 경로는 오른쪽 $k$번, 위쪽 $l$번 이동을 나열하는 방법의 수이다.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드6 PDF p.80(인쇄 p.78)'
    steps:
    - id: 2b-1
      content: |
        점 A에서 B까지 최단거리로 이동하는 경우의 수는 $\dfrac{(k+l)!}{k!\,l!}$이다.
        $k=1$: $2,3,4,5$; $k=2$: $3,6,10,15$; $k=3$: $4,10,20,35$; $k=4$: $5,15,35,70$ ($l=1,2,3,4$ 순).
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $U$의 확률분포($\times\dfrac{1}{140}$): $U=2$: $4$, $3$: $22$, $4$: $16$, $5$: $5$, $6$: $18$, $10$: $30$, $15$: $19$, $20$: $12$, $35$: $13$, $70$: $1$.
        $U\le10$인 $(k,l)$은 $(1,1),(1,2),(1,3),(1,4),(2,1),(2,2),(2,3),(3,1),(3,2),(4,1)$이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        $$\mathrm P(U\le10)=\dfrac{4+4+18+4+12+4+1+18+18+12}{140}=\dfrac{4\times4+18\times3+12\times2+1\times1}{35\times4}=\dfrac{19}{28}.$$
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: $k$, $l$에 대한 최단 경로 수 $\dfrac{(k+l)!}{k!\,l!}$(16가지)를 구했다(공식 채점기준 20/100).
      depends_on: []
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: $U\le10$인 $(k,l)$을 모두 골라 확률을 더해 $\dfrac{19}{28}$을 얻었다(공식 채점기준 20/100).
      depends_on: [2.M1]
      steps: [2a, 2b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '3'
  stem: |
    제시문 <나>를 읽고 두 부등식 $1<b-a$와 $d-c<\dfrac65$를 만족시키는 자연수 $n$의 최댓값과 최솟값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 'max=99; min=26', equivalents: ['최댓값 99, 최솟값 26'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$\sigma=2$, $b-a=\dfrac{10}{\sqrt n}>1$, $d-c=\dfrac{6}{\sqrt n}<\dfrac65$ ⇒ $25<n<100$.'
    steps:
    - {id: 3a, content: '최댓값 $99$, 최솟값 $26$', criteria: [3.A1]}
    hint_ladder:
    - '$P(\lvert Z\rvert\le z)=0.9876$, $0.8664$인 $z$를 표에서 찾자.'
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드6 PDF p.81(인쇄 p.79)'
    steps:
    - id: 3b-1
      content: |
        $Y=-0.5X+5$이므로 $m=\mathrm E(Y)=-0.5\mathrm E(X)+5=0$, $\sigma=\sigma(Y)=\lvert-0.5\rvert\sigma(X)=2$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        표본평균을 $\bar y$라 하면 신뢰도 $98.76\%$의 신뢰구간은 $\bar y-2.5\dfrac{\sigma}{\sqrt n}\le m\le\bar y+2.5\dfrac{\sigma}{\sqrt n}$이고 $b-a=2\times2.5\dfrac{\sigma}{\sqrt n}=\dfrac{5\sigma}{\sqrt n}$이므로 $1<\dfrac{5\sigma}{\sqrt n}$, $\sqrt n<10$, $n<100$.
        신뢰도 $86.64\%$의 신뢰구간은 $\bar y-1.5\dfrac{\sigma}{\sqrt n}\le m\le\bar y+1.5\dfrac{\sigma}{\sqrt n}$이고 $d-c=\dfrac{3\sigma}{\sqrt n}<\dfrac65$에서 $\sqrt n>5$, $n>25$.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        따라서 두 부등식을 만족시키는 자연수 $n$의 최댓값은 $99$, 최솟값은 $26$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: $\sigma=2$를 구하고 신뢰구간 길이로 $n<100$, $n>25$(부등식)를 세웠다(공식 채점기준 20/100).
      depends_on: []
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: 최댓값 $99$, 최솟값 $26$을 적었다(공식 채점기준 10/100).
      depends_on: [3.M1]
      steps: [3a, 3b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}

