subparts:
- id: '1'
  stem: |
    오른쪽 그림은 크기가 같은 정육면체 $25$개를 가로로 $5$개, 세로로 $5$개씩 쌓아 만든 직육면체이다. 정육면체의 모서리를 따라 꼭짓점 $\mathrm P$에서 꼭짓점 $\mathrm Q$까지 최단거리로 이동할 때, 색칠된 정육면체의 꼭짓점을 지나지 않고 이동하는 경우의 수를 구하시오.
    [그림: 정육면체를 가로 5개, 세로 5개로 쌓은 두께 1칸의 직육면체. 맨 위 줄 가장 왼쪽 정육면체가 색칠되어 있다. $\mathrm P$는 앞면 왼쪽 아래 꼭짓점, $\mathrm Q$는 뒷면 오른쪽 위 꼭짓점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '2486', equivalents: ['226\times11'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '앞면 경로 $252-26=226$가지에 깊이 이동 $f$를 넣는 자리 $11$가지.'
    steps:
    - {id: 1a, content: '$226\times11=2486$', criteria: [1.A1]}
    hint_ladder:
    - 깊이 방향 모서리는 경로에서 정확히 한 번 지난다.
    - 색칠된 정육면체의 꼭짓점은 앞면·뒷면에서 같은 위치에 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드7 PDF p.84~85(인쇄 p.82~83)'
    steps:
    - id: 1b-1
      content: |
        꼭짓점 $\mathrm P$를 포함하고 정사각형 25개로 이루어진 면을 면 $\mathrm X$, 꼭짓점 $\mathrm Q$를 포함하고 정사각형 25개로 이루어진 면을 면 $\mathrm Y$라 하자. $\mathrm P$에서 $\mathrm Q$까지 최단거리로 가려면 가로, 세로 방향으로 정육면체의 모서리를 5개씩 지나고 면 $\mathrm X$와 면 $\mathrm Y$를 동시에 만나는 정육면체의 모서리를 1개 지난다. 가로 이동을 $d$, 세로 이동을 $e$, 두 면을 잇는 모서리를 따라 이동하는 것을 $f$라 하자.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        꼭짓점 $\mathrm Q$와 모서리로 연결된 면 $\mathrm X$의 꼭짓점을 $\mathrm R$이라 하자. $\mathrm P$에서 $\mathrm R$까지 최단거리로 이동하는 경우의 수는 $d,d,d,d,d,e,e,e,e,e$를 일렬로 나열하는 경우의 수 $\dfrac{10!}{5!\times5!}=252$이고, 이 중 색칠된 정육면체의 꼭짓점을 지나는 경우의 수는 $1+5^2=26$이다. 따라서 색칠된 정육면체의 꼭짓점을 지나지 않고 $\mathrm P$에서 $\mathrm R$까지 가는 경우의 수는 $252-26=226$.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        색칠된 정육면체의 꼭짓점을 지나지 않고 $\mathrm P$에서 $\mathrm Q$까지 가는 경로는 위의 $d,e$ 나열에 $f$를 하나 넣어서 얻어지고, 넣는 방법의 수는 $11$이므로 총 경우의 수는 $226\times11=2486$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 같은 것이 있는 순열로 색칠된 정육면체의 꼭짓점을 지나지 않고 $\mathrm P$에서 $\mathrm R$까지 가는 경우의 수 $252-26=226$을 구했다(공식 채점기준 10/100).
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: $f$를 끼워 넣는 11가지를 곱해 $\mathrm P$에서 $\mathrm Q$까지의 총 경우의 수 $2486$을 구했다(공식 채점기준 20/100).
      depends_on: [1.M1]
      steps: [1a, 1b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '2'
  stem: |
    주머니 $\mathrm A$에는 숫자 $4$가 적힌 공이 세 개, 숫자 $6$이 적힌 공이 두 개, 숫자 $8$이 적힌 공이 한 개 들어 있고, 주머니 $\mathrm B$에는 숫자 $0$이 적힌 공이 여섯 개, 숫자 $1$이 적힌 공이 네 개 들어 있다.
    주머니 $\mathrm A$에서 한 개의 공을 임의로 꺼낼 때 공에 적힌 수를 $a$, 주머니 $\mathrm B$에서 한 개의 공을 임의로 꺼낼 때 공에 적힌 수를 $b$라 하자. 곡선 $y=(x+7)\left(x^2-abx+\dfrac a2-6\right)$이 $x$축과 만나는 세 점 중에서 가장 가까운 두 점 사이의 거리를 확률변수 $X$라 할 때, $X$의 기댓값 $\mathrm E(X)$를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: expression, value: '49/15 + 4*sqrt(2)/5 + 2*sqrt(3)/15', equivalents: ['\dfrac{49}{15}+\dfrac45\sqrt2+\dfrac{2}{15}\sqrt3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$(a,b)$ 6가지마다 세 근 $-7$, $\dfrac{c\pm\sqrt{c^2-4d}}{2}$의 가장 짧은 간격을 구해 확률을 곱해 더한다.'
    steps:
    - {id: 2a, content: '$\mathrm E(X)=\dfrac{49}{15}+\dfrac45\sqrt2+\dfrac{2}{15}\sqrt3$', criteria: [2.A1]}
    hint_ladder:
    - '$c=ab$, $d=\dfrac a2-6$으로 놓고 가능한 $(c,d)$를 모두 적자.'
    - '$-7$과 작은 근의 간격, 두 근의 간격 중 어느 것이 작은지 비교하자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드7 PDF p.85~86(인쇄 p.83~84)'
    steps:
    - id: 2b-1
      content: |
        $c=ab$, $d=\dfrac a2-6$이라 하자. $(a,b)$가 가질 수 있는 값은 $(4,0),(4,1),(6,0),(6,1),(8,0),(8,1)$이므로 $(c,d)$는 $(0,-4),(4,-4),(0,-3),(6,-3),(0,-2),(8,-2)$이다.
        $(ab)^2-4\left(\dfrac a2-6\right)=c^2-4d\ge8>0$이므로 $(x+7)(x^2-cx+d)=0$은 세 근 $x_1=-7$, $x_2=\dfrac{c-\sqrt{c^2-4d}}{2}$, $x_3=\dfrac{c+\sqrt{c^2-4d}}{2}$를 갖는다.
        $x_2$는 차례로 $-2$, $2-2\sqrt2$, $-\sqrt3$, $3-2\sqrt3$, $-\sqrt2$, $4-3\sqrt2$이므로 $x_1<-2\le x_2<x_3$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        가장 가까운 두 점 사이의 거리는 $x_2-x_1=\dfrac{c-\sqrt{c^2-4d}}{2}+7$과 $x_3-x_2=\sqrt{c^2-4d}$를 비교하면 된다.
        $x_2-x_1<x_3-x_2\iff c+14<3\sqrt{c^2-4d}\iff c^2+28c+196<9(c^2-4d)\iff 9d+49<c(2c-7)$이므로 이를 만족하는 $(c,d)$는 $(6,-3)$, $(8,-2)$, 즉 $(a,b)=(6,1),(8,1)$이다. 한편 $x_2-x_1>x_3-x_2\iff 9d+49>c(2c-7)$이고 이를 만족하는 $(c,d)$는 $(0,-4),(4,-4),(0,-3),(0,-2)$, 즉 $(a,b)=(4,0),(4,1),(6,0),(8,0)$이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        $X$의 확률분포: $(a,b)=(4,0)$: $X=4$, $\dfrac36\times\dfrac{6}{10}=\dfrac{3}{10}$; $(4,1)$: $4\sqrt2$, $\dfrac15$; $(6,0)$: $2\sqrt3$, $\dfrac15$; $(6,1)$: $10-2\sqrt3$, $\dfrac{2}{15}$; $(8,0)$: $2\sqrt2$, $\dfrac{1}{10}$; $(8,1)$: $11-3\sqrt2$, $\dfrac{1}{15}$.
        $$\mathrm E(X)=4\times\dfrac{3}{10}+4\sqrt2\times\dfrac15+2\sqrt3\times\dfrac15+(10-2\sqrt3)\times\dfrac{2}{15}+2\sqrt2\times\dfrac{1}{10}+(11-3\sqrt2)\times\dfrac{1}{15}=\dfrac{49}{15}+\dfrac45\sqrt2+\dfrac{2}{15}\sqrt3.$$
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: 세 근을 구하고 $x_2-x_1$과 $x_3-x_2$를 비교해 $(a,b)$별 가장 가까운 두 점 사이의 거리를 정했다(공식 채점기준 20/100).
      depends_on: []
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: $X$의 확률분포를 적고 $\mathrm E(X)=\dfrac{49}{15}+\dfrac45\sqrt2+\dfrac{2}{15}\sqrt3$을 얻었다(공식 채점기준 20/100).
      depends_on: [2.M1]
      steps: [2a, 2b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '3'
  stem: |
    $0<x<\dfrac{\pi}{2}$에서 정의된 함수 $f(x)=\dfrac{1}{\sin^22x}$에 대하여 두 함수 $g(x)$와 $h(x)$를
    $$g(x)=\int_{\frac{\pi}{6}}^{x}f(t)\,dt,\qquad h(x)=\int_{\frac{\pi}{6}}^{x}g(t)\,dt\qquad\left(0<x<\dfrac{\pi}{2}\right)$$
    라 하자. 극한값 $\displaystyle\lim_{x\to0+}\dfrac{h(x)+\{g(x)\}^2}{f(x)}$을 구하시오. (단, $\displaystyle\lim_{t\to0+}t^2\ln t=0$이다.)
  points: 15
  depends_on: []
  answer: {kind: value, value: '1/4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$\dfrac{g^2}{f}=\left(-\dfrac12\cos2x+\dfrac{1}{2\sqrt3}\sin2x\right)^2\to\dfrac14$, $\dfrac hf$는 $\sin^22x\ln\lvert\sin2x\rvert$ 꼴이라 $0$.'
    steps:
    - {id: 3a, content: '극한값 $\dfrac14$', criteria: [3.A1]}
    hint_ladder:
    - '$\left(\dfrac{\cos x}{\sin x}\right)^\prime$을 계산해 보자.'
    - '$\dfrac{1}{f(x)}=\sin^22x$를 곱해 보자.'
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드7 PDF p.86~87(인쇄 p.84~85)'
    steps:
    - id: 3b-1
      content: |
        $p(x)=\dfrac{\cos x}{\sin x}$에 대해 $p'(x)=-\dfrac{1}{\sin^2x}$이고 $\dfrac{d}{dx}p(2x)=2p'(2x)=-\dfrac{2}{\sin^22x}$이므로
        $$g(x)=\int_{\frac{\pi}{6}}^{x}\dfrac{1}{\sin^22t}dt=\left[-\dfrac12p(2t)\right]_{\frac{\pi}{6}}^{x}=-\dfrac{\cos2x}{2\sin2x}+\dfrac{\cos\frac{\pi}{3}}{2\sin\frac{\pi}{3}}=-\dfrac12\dfrac{\cos2x}{\sin2x}+\dfrac{1}{2\sqrt3}.$$
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $\dfrac{d}{dx}\ln\lvert q(2x)\rvert=\dfrac{2q'(2x)}{q(2x)}$를 이용하면
        $$h(x)=-\dfrac12\int_{\frac{\pi}{6}}^{x}\left(\dfrac{\cos2t}{\sin2t}-\dfrac{1}{\sqrt3}\right)dt=-\dfrac12\left[\dfrac12\ln\lvert\sin2t\rvert-\dfrac{1}{\sqrt3}t\right]_{\frac{\pi}{6}}^{x}=-\dfrac14\ln\lvert\sin2x\rvert+\dfrac14\ln\sin\dfrac{\pi}{3}+\dfrac{1}{2\sqrt3}x-\dfrac{\pi}{12\sqrt3}.$$
      criteria: [3.M1]
    - id: 3b-3
      content: |
        $$\lim_{x\to0+}\dfrac{\{g(x)\}^2}{f(x)}=\lim_{x\to0+}\left(-\dfrac12\cos2x+\dfrac{1}{2\sqrt3}\sin2x\right)^2=\dfrac14,$$
        $$\lim_{x\to0+}\dfrac{h(x)}{f(x)}=\lim_{x\to0+}\left(-\dfrac14\sin^22x\ln\lvert\sin2x\rvert+\dfrac14\ln\dfrac{\sqrt3}{2}\sin^22x+\dfrac{1}{2\sqrt3}x\sin^22x-\dfrac{\pi}{12\sqrt3}\sin^22x\right)=\lim_{t\to0+}\left(-\dfrac14t^2\ln t\right)=0$$
        이므로 구하는 극한값은 $0+\dfrac14=\dfrac14$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
