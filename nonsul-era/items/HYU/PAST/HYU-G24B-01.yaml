intent: 같은 것이 있는 순열로 입체 격자의 최단 경로 수를 세고, 삼차방정식의 세 근 사이 거리 비교로 확률분포를 만들어 기댓값을 구하며, 삼각함수의 부정적분으로 정의된 함수의 극한을 구하는 능력을 본다.
key_idea: '(1) 두께 1인 직육면체의 경로는 앞면 격자 경로 $d^5e^5$에 깊이 이동 $f$ 하나를 끼워 넣은 것이고, 색칠된 정육면체 꼭짓점 회피는 앞면 투영에서 판정된다 → $226\times11$. (2) $x^2-cx+d$의 두 근과 $-7$의 간격 비교 $9d+49<c(2c-7)$. (3) $g(x)=-\dfrac{\cos2x}{2\sin2x}+\dfrac{1}{2\sqrt3}$, $\dfrac{h}{f}\to0$.'
stuck: (1) 입체 경로를 평면 경로와 깊이 방향 한 번의 이동으로 분해하는 발상, (3) $\int g$에서 $\ln\lvert\sin2x\rvert$가 나오고 $\sin^22x\ln\lvert\sin2x\rvert\to0$을 쓰는 단계
idea_tags: [IDEA-CNT-3D-LATTICE-INSERT-STEP, IDEA-PRB-CUBIC-ROOT-GAP-CASES, IDEA-CAL-INTEGRAL-FUNCTION-LIMIT]
