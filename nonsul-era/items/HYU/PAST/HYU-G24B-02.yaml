stimuli:
- label: 가
  body: |
    오른쪽 그림과 같이 길이가 $2$인 선분 $\mathrm{AB}$를 지름으로 하는 반원의 호 위에 $\overline{\mathrm{QB}}<\overline{\mathrm{PB}}$이고 $\overline{\mathrm{PQ}}=1$인 두 점 $\mathrm P$, $\mathrm Q$가 있다. 이 반원 안에 선분 $\mathrm{PQ}$를 지름으로 하고 선분 $\mathrm{AB}$와 점 $\mathrm H$에서 접하는 반원이 있다.
    (1) 선분 $\mathrm{AB}$의 중점을 $\mathrm O$라 할 때, $\angle\mathrm{BOQ}=\theta$라 하자. $\left(\text{단, }0<\theta<\dfrac{\pi}{2}\right)$
    (2) 선분 $\mathrm{PQ}$ 위의 점 $\mathrm T$에 대하여 점 $\mathrm T$를 지나고 선분 $\mathrm{AB}$와 수직인 직선이 호 $\mathrm{AB}$와 만나는 점을 $\mathrm S$라 하자.
    [그림: 지름 $\mathrm{AB}=2$인 큰 반원(중심 $\mathrm O$), 호 위의 $\mathrm P$(위쪽)와 $\mathrm Q$($\mathrm B$ 가까이), 선분 $\mathrm{PQ}$(길이 1)를 지름으로 하고 $\mathrm{AB}$ 위의 점 $\mathrm H$에 접하는 작은 반원, $\angle\mathrm{BOQ}=\theta$, $\mathrm{PQ}$ 위의 $\mathrm T$를 지나는 수직선이 큰 호와 만나는 점 $\mathrm S$]
- label: 나
  body: |
    오른쪽 그림과 같이 평면 $\alpha$와 평면 $\beta$는 직선 $l$에서 만난다. 평면 $\alpha$ 위에 중심이 $\mathrm O$이고 반지름의 길이가 $1$인 원이 있다. 이 원을 밑면으로 하는 반구와 평면 $\beta$가 만나서 생기는 도형은 반지름의 길이가 $\dfrac12$인 원 $C$이다. 원 $C$를 밑면으로 하는 반구는 평면 $\alpha$와 한 점 $\mathrm H$에서만 만난다.
    [그림: 평면 $\alpha$ 위의 반지름 1인 반구(중심 $\mathrm O$), 직선 $l$에서 $\alpha$와 만나는 비스듬한 평면 $\beta$, 반구와 $\beta$의 교선인 원 $C$(반지름 $\dfrac12$), $C$를 밑면으로 하여 아래로 볼록한 작은 반구가 $\alpha$와 점 $\mathrm H$에서 접하고 그 정사영 영역이 음영으로 표시됨]

stem: |
  [문제 2] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    제시문 <가>에서 주어진 각의 크기 $\theta$에 대하여, $\cos\theta$와 $\sin\theta$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: 'cos=(3*sqrt(2)+sqrt(3))/6; sin=(3-sqrt(6))/6', equivalents: ['\cos\theta=\dfrac{3\sqrt2+\sqrt3}{6},\ \sin\theta=\dfrac{3-\sqrt6}{6}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\mathrm{RH}=\dfrac12=\dfrac12\left(\sin\left(\theta+\dfrac{\pi}{3}\right)+\sin\theta\right)$ ⇒ $3\sin\theta+\sqrt3\cos\theta=2$.'
    steps:
    - {id: 1a, content: '$\cos\theta=\dfrac{3\sqrt2+\sqrt3}{6}$, $\sin\theta=\dfrac{3-\sqrt6}{6}$', criteria: [1.A1]}
    hint_ladder:
    - '$\triangle\mathrm{OPQ}$는 어떤 삼각형인가?'
    - '작은 반원의 중심(PQ의 중점)에서 AB까지의 거리는?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드8 PDF p.90~91(인쇄 p.88~89)'
    steps:
    - id: 1b-1
      content: |
        반원을 좌표평면에 두면 $\mathrm Q(\cos\theta,\sin\theta)$, $\mathrm P\left(\cos\left(\theta+\dfrac{\pi}{3}\right),\sin\left(\theta+\dfrac{\pi}{3}\right)\right)$이다. 선분 $\mathrm{PQ}$의 중점을 $\mathrm R$이라 하면 선분 $\mathrm{RH}$는 선분 $\mathrm{PQ}$가 지름인 반원의 반지름이므로 $\mathrm{RH}=\dfrac12$.
        따라서 $\dfrac12=\mathrm{RH}=\dfrac12\left(\sin\left(\theta+\dfrac{\pi}{3}\right)+\sin\theta\right)$이고, 덧셈정리로 정리하면 $3\sin\theta+\sqrt3\cos\theta=2$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\sin^2\theta+\cos^2\theta=1$과 연립하면 $0<\theta<\dfrac{\pi}{2}$에서 $\cos\theta=\dfrac{3\sqrt2+\sqrt3}{6}$, $\sin\theta=\dfrac{3-\sqrt6}{6}$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: $\cos\theta$, $\sin\theta$가 만족하는 등식 $3\sin\theta+\sqrt3\cos\theta=2$(또는 동치식)를 세웠다(공식 채점기준 20/100).
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: $\cos\theta=\dfrac{3\sqrt2+\sqrt3}{6}$, $\sin\theta=\dfrac{3-\sqrt6}{6}$을 구했다(공식 채점기준 20/100).
      depends_on: [1.M1]
      steps: [1a, 1b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '2'
  stem: |
    제시문 <가>에서 주어진 두 점 $\mathrm S$와 $\mathrm T$에 대하여, 선분 $\mathrm{ST}$의 길이의 최댓값을 구하시오.
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: 'sqrt(3) - 3/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\mathrm{ST}=f(t)=\dfrac32\cos t+\dfrac{\sqrt3}{2}\sin t-\dfrac32$, $f''(t)=0$ ⇔ $t=\dfrac{\pi}{6}$.'
    steps:
    - {id: 2a, content: '최댓값 $f\left(\dfrac{\pi}{6}\right)=\sqrt3-\dfrac32$', criteria: [2.A1]}
    hint_ladder:
    - '$\mathrm S$를 $(\cos(\theta+t),\sin(\theta+t))$로 놓아 보자.'
    - '직선 $\mathrm{PQ}$의 방정식을 R의 좌표와 기울기로 구하자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드8 PDF p.91(인쇄 p.89)'
    steps:
    - id: 2b-1
      content: |
        호 $\mathrm{PQ}$ 위의 점 $\mathrm S$의 좌표를 $(\cos(\theta+t),\sin(\theta+t))\ \left(0\le t\le\dfrac{\pi}{3}\right)$라 하자. 중점 $\mathrm R$의 좌표는 $\left(\dfrac12\left(\cos\left(\theta+\dfrac{\pi}{3}\right)+\cos\theta\right),\dfrac12\left(\sin\left(\theta+\dfrac{\pi}{3}\right)+\sin\theta\right)\right)=\left(\dfrac{\sqrt2}{2},\dfrac12\right)$이므로 직선 $\mathrm{OR}$의 기울기는 $\dfrac{1}{\sqrt2}$이고, 직선 $\mathrm{PQ}$는 $\mathrm{OR}$과 수직이므로 기울기가 $-\sqrt2$, 방정식은 $y=-\sqrt2x+\dfrac32$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        점 $\mathrm T$의 좌표는 $\left(\cos(\theta+t),-\sqrt2\cos(\theta+t)+\dfrac32\right)$이고
        $$\mathrm{ST}=f(t)=\sin(\theta+t)-\left(-\sqrt2\cos(\theta+t)+\dfrac32\right)=\dfrac32\cos t+\dfrac{\sqrt3}{2}\sin t-\dfrac32.$$
      criteria: [2.M1]
    - id: 2b-3
      content: |
        $f'(t)=-\dfrac32\sin t+\dfrac{\sqrt3}{2}\cos t$이므로 $0<t<\dfrac{\pi}{6}$에서 증가, $\dfrac{\pi}{6}<t<\dfrac{\pi}{3}$에서 감소하고 $f(0)=f\left(\dfrac{\pi}{3}\right)=0$. 따라서 $\mathrm{ST}$의 최댓값은 $f\left(\dfrac{\pi}{6}\right)=\sqrt3-\dfrac32$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: 선분 $\mathrm{ST}$의 길이를 한 문자에 대한 식(예 $f(t)=\dfrac32\cos t+\dfrac{\sqrt3}{2}\sin t-\dfrac32$)으로 나타냈다(공식 채점기준 20/100).
      depends_on: []
      steps: [2b-1, 2b-2]
      ft: {allowed: true, from: [1.A1], max_points: 10}
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: 도함수(증감표)로 최댓값 $\sqrt3-\dfrac32$을 구했다(공식 채점기준 10/100).
      depends_on: [2.M1]
      steps: [2a, 2b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '3'
  stem: |
    제시문 <나>에서 주어진 원 $C$의 평면 $\alpha$ 위로의 정사영의 넓이를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 'pi/(4*sqrt(3))', equivalents: ['\dfrac{\pi}{4\sqrt3}'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$l$에 수직인 단면은 <가>의 그림과 같고 $\cos a=\dfrac{\mathrm{RH}}{\mathrm{OR}}=\dfrac{1/2}{\sqrt3/2}$.'
    steps:
    - {id: 3a, content: '$\dfrac{\pi}{4}\times\dfrac{1}{\sqrt3}=\dfrac{\pi}{4\sqrt3}$', criteria: [3.A1]}
    hint_ladder:
    - '직선 $l$에 수직이고 $\mathrm O$를 지나는 평면으로 잘라 보자.'
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드8 PDF p.92(인쇄 p.90)'
    steps:
    - id: 3b-1
      content: |
        직선 $l$과 수직이고 원의 중심 $\mathrm O$를 포함하는 평면을 생각하면, 지름이 $2$인 반구와 지름이 $1$인 반구가 이 평면과 만나서 생기는 도형은 각각 $\overline{\mathrm{AB}}=2$인 선분 $\mathrm{AB}$를 지름으로 하는 반원과 $\overline{\mathrm{PQ}}=1$인 선분 $\mathrm{PQ}$를 지름으로 하는 반원이다(제시문 <가>의 그림).
        [그림: 단면에서 큰 반원, $\mathrm{PQ}$를 지름으로 하는 작은 반원, $\mathrm{PQ}$의 중점 $\mathrm R$과 수선의 발 $\mathrm H$, 각 $a$ 표시]
      criteria: [3.M1]
    - id: 3b-2
      content: |
        평면 $\alpha$와 평면 $\beta$가 이루는 각을 $a$라 하면 $a=\angle\mathrm{RBH}=\angle\mathrm{ORH}$이므로 $\cos a=\dfrac{\mathrm{RH}}{\mathrm{OR}}$. $\mathrm{RH}=\dfrac12$이고 $\mathrm{OR}$은 한 변의 길이가 $1$인 정삼각형 $\mathrm{OPQ}$의 높이이므로 $\mathrm{OR}=\dfrac{\sqrt3}{2}$. 따라서 $\cos a=\dfrac{1}{\sqrt3}$.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        원 $C$의 넓이는 $\dfrac{\pi}{4}$이므로 구하는 정사영의 넓이는 $\dfrac{\pi}{4}\cos a=\dfrac{\pi}{4\sqrt3}$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: 두 평면이 이루는 각 $a$에 대하여 $\cos a=\dfrac{1}{\sqrt3}$을 근거($\mathrm{RH}=\dfrac12$, $\mathrm{OR}=\dfrac{\sqrt3}{2}$)와 함께 구했다(공식 채점기준 20/100).
      depends_on: []
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: 정사영의 넓이 $\dfrac{\pi}{4\sqrt3}$을 구했다(공식 채점기준 10/100).
      depends_on: [3.M1]
      steps: [3a, 3b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}

