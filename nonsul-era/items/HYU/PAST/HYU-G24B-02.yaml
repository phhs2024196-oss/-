key_idea: 'PQ의 중점 R의 높이 $=$ 작은 반원의 반지름 $\dfrac12$ ⇒ $\sin\left(\theta+\dfrac{\pi}{3}\right)+\sin\theta=1$. $\mathrm{ST}=\dfrac32\cos t+\dfrac{\sqrt3}{2}\sin t-\dfrac32$. 공간에서는 $l$에 수직인 단면이 <가>와 같아 $\cos a=\dfrac{\mathrm{RH}}{\mathrm{OR}}=\dfrac{1}{\sqrt3}$.'
stuck: 작은 반원이 AB에 접한다는 조건을 중점 R의 높이 $\dfrac12$로 바꾸는 단계와, <나>의 공간 상황을 직선 $l$에 수직인 단면으로 잘라 <가>의 그림으로 환원하는 단계
