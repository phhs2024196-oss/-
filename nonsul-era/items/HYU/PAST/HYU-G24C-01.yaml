key_idea: '(1) 행별로 (빨, 파, 노) 개수를 분류해 $\dfrac{5!}{a!b!c!}$, $\dfrac{6!}{d!e!f!}$을 더하고 곱한다. (2) 각 열에서 세 색을 하나씩 미리 빼면 $p+q+r=7n$의 음이 아닌 정수해 ⇒ ${}_3\mathrm H_{7n}$. (3) $f(x)=r(x+1)(x-3)(x-s)$, $f''$의 꼭짓점이 $x=\dfrac23$ ⇒ $s=0$, $r=-6$.'
stuck: (2)에서 각 열에 세 색이 최소 하나씩 있다는 조건이 넓이 순서쌍 개수에서는 $p,q,r\ge n$으로만 작용함을 알아차리는 단계
