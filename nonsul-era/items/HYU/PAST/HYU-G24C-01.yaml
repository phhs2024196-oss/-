stem: |
  [문제 1] 다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    그림과 같이 넓이가 $1$인 정사각형 $11$개로 이루어진 도형이 있다. 넓이가 $1$인 각각의 정사각형 내부를 빨간색, 파란색, 노란색의 세 가지 색 중 한 가지 색으로 칠한다. 각각의 가로 행에 빨간색으로 칠해진 정사각형의 개수가 파란색으로 칠해진 정사각형의 개수보다 크고, 각각의 가로 행에 노란색으로 칠해진 정사각형이 $2$개 이하가 되는 경우의 수를 구하시오.
    [그림: 윗줄에 정사각형 5개, 아랫줄에 정사각형 6개가 왼쪽 끝을 맞춰 붙어 있는 도형(아랫줄이 오른쪽으로 한 칸 더 김)]
  points: 15
  depends_on: []
  answer: {kind: value, value: '15633', equivalents: ['81\times193'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '윗줄 $16+25+40=81$, 아랫줄 $22+96+75=193$, 곱 $15633$.'
    steps:
    - {id: 1a, content: '$81\times193=15633$', criteria: [1.A1]}
    hint_ladder:
    - 두 행은 서로 독립이므로 행마다 따로 세어 곱하자.
    - 노란색 개수로 경우를 나누자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드9 PDF p.96(인쇄 p.94)'
    steps:
    - id: 1b-1
      content: |
        첫 번째 가로 행에서 빨간색, 파란색, 노란색으로 칠해진 정사각형의 개수를 $a,b,c$라 하면 $a>b$, $c\le2$, $a+b+c=5$. 이 행을 칠하는 경우의 수는 같은 것이 있는 순열의 수 $\dfrac{5!}{a!b!c!}$이고, 노란색 개수 $0,1,2$로 나누어 더하면
        $$\left(\dfrac{5!}{5!0!0!}+\dfrac{5!}{4!1!0!}+\dfrac{5!}{3!2!0!}\right)+\left(\dfrac{5!}{4!0!1!}+\dfrac{5!}{3!1!1!}\right)+\left(\dfrac{5!}{3!0!2!}+\dfrac{5!}{2!1!2!}\right)=16+25+40=81.$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        두 번째 가로 행에서 개수를 $d,e,f$라 하면 $d>e$, $f\le2$, $d+e+f=6$이고 경우의 수는 $\dfrac{6!}{d!e!f!}$. 노란색 개수로 나누어 더하면
        $$\left(\dfrac{6!}{6!0!0!}+\dfrac{6!}{5!1!0!}+\dfrac{6!}{4!2!0!}\right)+\left(\dfrac{6!}{5!0!1!}+\dfrac{6!}{4!1!1!}+\dfrac{6!}{3!2!1!}\right)+\left(\dfrac{6!}{4!0!2!}+\dfrac{6!}{3!1!2!}\right)=22+96+75=193.$$
      criteria: [1.M1]
    - id: 1b-3
      content: |
        그러므로 구하는 경우의 수는 $81\times193=15633$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: 각 행의 색별 개수가 정해졌을 때 같은 것이 있는 순열로 경우의 수를 세어 $81$, $193$을 구했다(공식 채점기준 20/100).
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 두 행의 경우의 수를 곱해 $15633$을 얻었다(공식 채점기준 10/100).
      depends_on: [1.M1]
      steps: [1a, 1b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '2'
  stem: |
    그림과 같이 자연수 $n$에 대하여 가로의 길이가 $n$이고 세로의 길이가 $10$인 직사각형을 한 변의 길이가 $1$인 $10\times n$개의 정사각형으로 나눈 도형이 있다. 한 변의 길이가 $1$인 각각의 정사각형 내부를 빨간색, 파란색, 노란색의 세 가지 색 중 한 가지 색으로 칠한다. 이 도형의 각 세로 열마다 세 가지 색이 적어도 한 번씩 나타나게 칠할 때, 넓이가 $10n$인 직사각형에서 빨간색, 파란색, 노란색으로 칠해진 부분의 넓이를 각각 $p$, $q$, $r$이라 하자.
    $p$, $q$, $r$의 모든 순서쌍 $(p,q,r)$의 개수를 $f(n)$이라 할 때, $f(5)+f(7)$의 값을 구하시오.
    [그림: 세로 10칸, 가로 $n$칸의 격자(중간은 점으로 생략), 왼쪽에 세로 길이 10, 아래에 가로 길이 $n$ 표시]
  points: 15
  depends_on: []
  answer: {kind: value, value: '1941', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$f(n)={}_3\mathrm H_{7n}=\dfrac{(7n+2)(7n+1)}{2}$, $f(5)+f(7)=666+1275$.'
    steps:
    - {id: 2a, content: '$f(5)+f(7)=1941$', criteria: [2.A1]}
    hint_ladder:
    - '각 열에서 세 색을 하나씩 먼저 칠해 두면 남은 칸은 몇 개인가?'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드9 PDF p.96(인쇄 p.94)'
    steps:
    - id: 2b-1
      content: |
        전체 $10\times n$개의 정사각형 중 빨간색, 파란색, 노란색으로 칠해진 부분의 넓이를 각각 $p,q,r$라 하자. 각 세로 열마다 세 가지 색이 적어도 한 번씩 나타나는 경우를 세기 위해 각 세로 열에서 빨간색, 파란색, 노란색으로 색칠된 것을 하나씩 미리 제외하고 세면 충분하다. 그러므로 구하는 순서쌍 $(p,q,r)$의 개수는 $p+q+r=7n$을 만족하는 음이 아닌 세 정수의 순서쌍의 개수와 같다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        이는 $3$개의 문자 중에서 $7n$개를 택하는 중복조합의 수 ${}_3\mathrm H_{7n}={}_{7n+2}\mathrm C_2=\dfrac{(7n+2)(7n+1)}{2}$이다. 그러므로
        $$f(5)+f(7)=\dfrac{37\times36}{2}+\dfrac{51\times50}{2}=666+1275=1941.$$
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: 구하는 순서쌍의 개수가 $p+q+r=7n$(또는 $x+y+z=7n$)을 만족하는 음이 아닌 정수 순서쌍의 개수와 같음을 보였다(공식 채점기준 20/100).
      depends_on: []
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: ${}_3\mathrm H_{7n}$을 계산해 $f(5)+f(7)=1941$을 얻었다(공식 채점기준 10/100).
      depends_on: [2.M1]
      steps: [2a, 2b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '3'
  stem: |
    주머니에 숫자 $1$이 적힌 공이 한 개, 숫자 $2$가 적힌 공이 두 개, 숫자 $3$이 적힌 공이 세 개 들어 있다. 이 주머니에서 한 개의 공을 임의로 꺼낼 때 공에 적힌 수를 $c$라 하자. 다음 조건을 만족시키는 삼차함수 $f(x)$의 $-1$에서 $c$까지의 정적분의 값을 확률변수 $Y$라 할 때, $Y$의 기댓값 $\mathrm E(Y)$를 구하시오.
    [조건 상자: 제시문 <가>, <나>]
  points: 20
  depends_on: []
  answer: {kind: value, value: '281/6', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$f(x)=-6x(x+1)(x-3)$, $\displaystyle\int_{-1}^{c}f=-\dfrac32c^4+4c^3+9c^2-\dfrac72$ ⇒ $Y=8,\ \dfrac{81}{2},\ 64$.'
    steps:
    - {id: 3a, content: '$\mathrm E(Y)=\dfrac{281}{6}$', criteria: [3.A2]}
    hint_ladder:
    - '$f(x)=r(x+1)(x-3)(x-s)$로 놓자.'
    - '$f''(x)$는 이차함수이다. 최댓값을 갖는 위치는?'
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드9 PDF p.97(인쇄 p.95)'
    steps:
    - id: 3b-1
      content: |
        $f(-1)=f(3)=0$이므로 $f(x)=r(x+1)(x-3)(x-s)$ 꼴이다.
        $f'(x)=r(x+1)(x-3)+r(x+1)(x-s)+r(x-3)(x-s)=r\left(3x^2-(4+2s)x-3+2s\right)=r\left(3\left(x-\dfrac{2+s}{3}\right)^2-\dfrac{(2+s)^2}{3}-3+2s\right)$.
        $f'(x)$가 $x=\dfrac23$에서 최댓값을 가지려면 $s=0$이고 $r<0$이어야 한다. $f'(0)=-3r=18$에서 $r=-6$, 따라서 $f(x)=-6x(x+1)(x-3)=-6x^3+12x^2+18x$.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $$\int_{-1}^{c}f(x)dx=\left[-\dfrac32x^4+4x^3+9x^2\right]_{-1}^{c}=-\dfrac32c^4+4c^3+9c^2-\dfrac72.$$
        $c=1,2,3$일 때 $Y=8,\ \dfrac{81}{2},\ 64$.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        $\mathrm P(c=1)=\dfrac16$, $\mathrm P(c=2)=\dfrac26$, $\mathrm P(c=3)=\dfrac36$이므로
        $$\mathrm E(Y)=8\times\dfrac16+\dfrac{81}{2}\times\dfrac26+64\times\dfrac36=\dfrac{281}{6}.$$
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: 미분을 이용해 $s=0$, $r=-6$, 즉 $f(x)=-6x(x+1)(x-3)$을 구했다(공식 채점기준 10/100).
      depends_on: []
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: $\displaystyle\int_{-1}^{c}f(x)dx=-\dfrac32c^4+4c^3+9c^2-\dfrac72$ 및 $c=1,2,3$에서의 값 $8$, $\dfrac{81}{2}$, $64$를 구했다(공식 채점기준 10/100).
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 10
      evidence: $c$의 확률분포 $\dfrac16,\dfrac26,\dfrac36$로 $\mathrm E(Y)=\dfrac{281}{6}$을 구했다(공식 채점기준 20/100).
      depends_on: [3.M1]
      steps: [3a, 3b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}

