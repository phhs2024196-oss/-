stem: |
  [문제 2] 다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    타원 $\dfrac{x^2}{3}+\dfrac{y^2}{2}=1$ 위의 점 $\mathrm P$와 타원 $\dfrac{x^2}{2}+\dfrac{y^2}{3}=1$ 위의 점 $\mathrm Q$가 직선 $y=x$에 대하여 대칭이다. 두 점 $\mathrm A(-1,0)$, $\mathrm B(0,-1)$에 대하여 $\overrightarrow{\mathrm{AP}}\cdot\overrightarrow{\mathrm{BQ}}$의 최댓값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '8*sqrt(3)/3', equivalents: ['\dfrac{8\sqrt3}{3}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$2b(a+1)=\pm2\sqrt2(a+1)\sqrt{1-\dfrac{a^2}{3}}$, $a=1$에서 최대 $\dfrac{8\sqrt3}{3}$.'
    steps:
    - {id: 1a, content: '최댓값 $\dfrac{8\sqrt3}{3}$', criteria: [1.A1]}
    hint_ladder:
    - '$\mathrm P(a,b)$이면 $\mathrm Q$의 좌표는?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드10 PDF p.101(인쇄 p.99)'
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm P$의 좌표를 $(a,b)$라 두면 점 $\mathrm Q$의 좌표는 $(b,a)$이고 $\dfrac{a^2}{3}+\dfrac{b^2}{2}=1$로부터
        $$\overrightarrow{\mathrm{AP}}\cdot\overrightarrow{\mathrm{BQ}}=(a+1,b)\cdot(b,a+1)=2b(a+1)=\pm2\sqrt2(a+1)\sqrt{1-\dfrac{a^2}{3}}.$$
        따라서 닫힌구간 $[-\sqrt3,\sqrt3]$에서 $f(a)=2\sqrt2(a+1)\sqrt{1-\dfrac{a^2}{3}}$의 최댓값과 $-f(a)$의 최댓값 중 큰 값이 구하는 최댓값이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $f'(a)=-\dfrac{2\sqrt2(2a+3)(a-1)}{\sqrt{3(3-a^2)}}$이고 $f'(a)=0$에서 $a=-\dfrac32,\ 1$. 증감표에서 $f\left(-\dfrac32\right)=-\dfrac{\sqrt2}{2}$(극소), $f(1)=\dfrac{8\sqrt3}{3}$(극대), $f(\pm\sqrt3)=0$.
        $f(a)$의 최댓값은 $\dfrac{8\sqrt3}{3}$, $-f(a)$의 최댓값은 $\dfrac{\sqrt2}{2}$이므로 $\overrightarrow{\mathrm{AP}}\cdot\overrightarrow{\mathrm{BQ}}$의 최댓값은 $\dfrac{8\sqrt3}{3}$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: $\overrightarrow{\mathrm{AP}}\cdot\overrightarrow{\mathrm{BQ}}=2b(a+1)=\pm2\sqrt2(a+1)\sqrt{1-\dfrac{a^2}{3}}$처럼 한 변수의 함수로 나타냈다(공식 채점기준 20/100).
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 증감표(또는 동치 논증)로 최댓값 $\dfrac{8\sqrt3}{3}$을 구했다(공식 채점기준 10/100).
      depends_on: [1.M1]
      steps: [1a, 1b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '2'
  stem: |
    오른쪽 그림과 같이 길이가 $\sqrt2$인 선분 $\mathrm{AC}$를 지름으로 하고 중심이 $\mathrm O$인 원이 있다. 이 원 위에 $\angle\mathrm{AOE}=\theta\ \left(0<\theta<\dfrac{\pi}{2}\right)$가 되도록 점 $\mathrm E$를 잡고, 직선 $\mathrm{EO}$가 원과 만나는 점 중 $\mathrm E$가 아닌 점을 $\mathrm G$라 하자. 대각선이 선분 $\mathrm{AC}$인 정사각형 $\mathrm{ABCD}$의 내부와 대각선이 선분 $\mathrm{EG}$인 정사각형 $\mathrm{EFGH}$의 내부의 공통부분의 넓이를 $S(\theta)$라 하자. 함수 $S(\theta)$에 대하여 $\theta=\dfrac{\pi}{3}$에서의 미분계수 $S'\left(\dfrac{\pi}{3}\right)$를 구하시오.
    [그림: 원의 지름 $\mathrm{AC}$(수평, $\mathrm A$ 왼쪽), 원에 내접하는 정사각형 $\mathrm{ABCD}$($\mathrm B$ 아래, $\mathrm D$ 위)와 정사각형 $\mathrm{EFGH}$($\mathrm E$는 $\mathrm A$에서 시계 방향으로 $\theta$만큼 아래, 반시계 순서로 $\mathrm E$, $\mathrm F$(오른쪽 아래), $\mathrm G$(오른쪽 위), $\mathrm H$(왼쪽 위)), 두 정사각형의 공통부분인 팔각형이 회색으로 칠해짐]
  points: 20
  depends_on: []
  answer: {kind: value, value: '2*sqrt(3) - 10/3', equivalents: ['2\sqrt3-\dfrac{10}{3}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$S(\theta)=8\triangle\mathrm{OMN}=\dfrac{1-\tan(\theta/2)}{1+\tan(\theta/2)}+\tan\dfrac{\theta}{2}$.'
    steps:
    - {id: 2a, content: '$S''\left(\dfrac{\pi}{3}\right)=2\sqrt3-\dfrac{10}{3}$', criteria: [2.A1]}
    hint_ladder:
    - 공통부분은 중심 O에 대해 대칭인 팔각형이다. 몇 개의 합동인 삼각형으로 나눌 수 있을까?
    - '정사각형의 중심에서 변까지의 거리는 $\dfrac12$이다.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드10 PDF p.101~102(인쇄 p.99~100)'
    steps:
    - id: 2b-1
      content: |
        선분 $\mathrm{AB}$와 선분 $\mathrm{EH}$가 만나는 점을 $\mathrm M$, 선분 $\mathrm{AB}$와 선분 $\mathrm{EF}$가 만나는 점을 $\mathrm N$이라 두면 $S(\theta)$는 삼각형 $\mathrm{OMN}$의 넓이의 $8$배이다. 선분 $\mathrm{AN}$과 선분 $\mathrm{EO}$가 만나는 점을 $\mathrm P$라 두면 $\angle\mathrm{PEN}=\angle\mathrm{OAP}=\dfrac{\pi}{4}$이고 $\angle\mathrm{EPN}=\angle\mathrm{APO}$이므로 $\angle\mathrm{PNE}=\angle\mathrm{AOP}=\theta$.
        [그림: 원 안의 두 정사각형과 점 $\mathrm M$, $\mathrm N$, $\mathrm P$ 및 $\mathrm O$에서 각 꼭짓점으로 그은 점선]
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $\pi=\angle\mathrm{PNE}+\angle\mathrm{PNO}+\angle\mathrm{ONF}=\theta+2\angle\mathrm{PNO}$로부터 $\angle\mathrm{PNO}=\dfrac{\pi}{2}-\dfrac{\theta}{2}$, $\angle\mathrm{MON}=\dfrac{\pi}{4}$로부터 $\angle\mathrm{OMN}=\dfrac{\pi}{4}+\dfrac{\theta}{2}$. 점 $\mathrm O$에서 $\mathrm{MN}$에 내린 수선의 발을 $\mathrm Q$라 하면 $\mathrm{OQ}=\dfrac12$이므로
        $$S(\theta)=8\times\dfrac12\times\left(\dfrac12\cot\left(\dfrac{\pi}{4}+\dfrac{\theta}{2}\right)+\dfrac12\cot\left(\dfrac{\pi}{2}-\dfrac{\theta}{2}\right)\right)\times\dfrac12=\dfrac{1-\tan(\theta/2)}{1+\tan(\theta/2)}+\tan\dfrac{\theta}{2}.$$
      criteria: [2.M1]
    - id: 2b-3
      content: |
        $S'(\theta)=-\dfrac{\sec^2(\theta/2)}{(1+\tan(\theta/2))^2}+\dfrac12\sec^2\dfrac{\theta}{2}$이므로
        $$S'\left(\dfrac{\pi}{3}\right)=-\dfrac{(2/\sqrt3)^2}{(1+1/\sqrt3)^2}+\dfrac12\left(\dfrac{2}{\sqrt3}\right)^2=2\sqrt3-\dfrac{10}{3}.$$
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: 공통부분의 넓이를 $S(\theta)=\dfrac{1-\tan(\theta/2)}{1+\tan(\theta/2)}+\tan\dfrac{\theta}{2}$(또는 동치식)로 나타냈다(공식 채점기준 20/100).
      depends_on: []
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: $S'(\theta)$를 구하고 $S'\left(\dfrac{\pi}{3}\right)=2\sqrt3-\dfrac{10}{3}$을 얻었다(공식 채점기준 20/100).
      depends_on: [2.M1]
      steps: [2a, 2b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '3'
  stem: |
    자연수 $n$에 대하여 두 곡선 $y=\cos x$와 $y=1-ax^2$이 만나는 점의 개수가 $4n+1$이 되도록 하는 양수 $a$를 $a_n$이라 하자. 예를 들어, 아래 그림은 $n=1$인 경우이다.
    극한값 $\displaystyle\lim_{n\to\infty}\cos\sqrt{\dfrac{2}{a_n}-4}$를 구하시오.
    [그림: $y=\cos x$와 위로 볼록한 포물선 $y=1-a_1x^2$이 $x=0$에서 만나고, 양쪽으로 각각 한 번 교차한 뒤 $x=\pm$(두 번째 골짜기 근처)에서 접하는 모습($n=1$, 교점 5개)]
  points: 15
  depends_on: []
  answer: {kind: value, value: '-1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '접점 $x_n\in(2n\pi,(2n+1)\pi)$에서 $x_n^2=\dfrac{2}{a_n}-4$, $\cos x_n=1-\dfrac{2x_n^2}{x_n^2+4}\to-1$.'
    steps:
    - {id: 3a, content: '극한값 $-1$', criteria: [3.A1]}
    hint_ladder:
    - '교점 개수가 홀수 $4n+1$이 되려면 어떤 점에서 두 곡선이 접해야 할까?'
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: '선행학습 영향평가 보고서 2024 문항카드10 PDF p.103(인쇄 p.101)'
    steps:
    - id: 3b-1
      content: |
        두 곡선 $y=\cos x$와 $y=1-ax^2$이 $4n+1$개의 점에서 만나려면 구간 $(2n\pi,(2n+1)\pi)$에서 교점의 개수가 $1$이고 그 점에서 접선의 기울기가 같아야 한다. 이 구간에서 두 곡선이 만나는 점의 $x$좌표를 $x_n$이라 두면 $\cos x_n=1-a_nx_n^2$과 $-\sin x_n=-2a_nx_n$이 성립한다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $1=\cos^2x_n+\sin^2x_n=(1-a_nx_n^2)^2+(2a_nx_n)^2$을 정리하면 $a_n^2x_n^2\left(x_n^2-\dfrac{2}{a_n}+4\right)=0$인데, $a_n$과 $x_n$은 모두 양수이므로 $x_n^2=\dfrac{2}{a_n}-4$.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        따라서 $\cos\sqrt{\dfrac{2}{a_n}-4}=\cos x_n=1-a_nx_n^2=1-\dfrac{2x_n^2}{x_n^2+4}$이고 $\displaystyle\lim_{n\to\infty}x_n=\infty$이므로
        $$\lim_{n\to\infty}\cos\sqrt{\dfrac{2}{a_n}-4}=\lim_{n\to\infty}\left(1-\dfrac{2x_n^2}{x_n^2+4}\right)=-1.$$
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: 접할 조건으로 $x_n$과 $a_n$의 관계식 $x_n^2=\dfrac{2}{a_n}-4$를 구했다(공식 채점기준 20/100).
      depends_on: []
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: 관계식을 이용해 극한값 $-1$을 구했다(공식 채점기준 10/100).
      depends_on: [3.M1]
      steps: [3a, 3b-3]
