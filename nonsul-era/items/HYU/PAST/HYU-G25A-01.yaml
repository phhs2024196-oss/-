intent: |
  수학Ⅰ 수열의 합과 확률과 통계의 이산확률변수(확률분포·기댓값·분산)를 이해하고 활용할 수 있는지 본다. 자릿수별 원소 개수 $b_n$을 식으로 나타내 조건을 만족하는 카드 수 $r$을 정하고, $0$의 개수 분포로 분산을 구하며, 1의 총 개수 $a_n$을 거듭제곱의 합으로 나타내 합을 구한다.
key_idea: |
  $n\ge3$일 때 $A_n$의 원소는 가운데 $n-2$자리에 $0$이 없거나 하나, 일의 자리는 $0$ 또는 $1$이므로 $b_n=2(n-1)$이고, 1의 개수별로 $n-2,\,n-1,\,n$번 나타나는 원소가 각각 $n-2,\,n-1,\,1$개이다.
stuck: |
  $10^5$보다 크고 $10^9$보다 작은 수가 카드에 모두(52장) 들어갔는지 아닌지로 경우를 나누는 것, 그리고 $X$가 일의 자리 $0$까지 센 $0$의 개수라는 점
