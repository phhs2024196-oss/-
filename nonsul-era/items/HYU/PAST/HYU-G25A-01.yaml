stimuli:
- label: 제시문
  body: |
    각 자릿수가 $0$ 또는 $1$이고, 일의 자리를 제외한 각 자리에 나타나는 $0$의 개수의 합이 $1$ 이하인 모든 자연수의 집합을 $A$라 하자. 또한 자연수 $n$에 대하여 집합 $A_n=\{x\mid x\in A$이고 $n-1\le\log_{10}x<n\}$이라 하자.
    예를 들어, $11101110$, $11111110$은 집합 $A_8$의 원소이고 $11111001$은 집합 $A_8$의 원소가 아니다.

    $60$보다 큰 자연수 $r$에 대하여, 집합 $A$의 원소를 작은 수부터 크기순으로 나열하여 첫 번째부터 $r$번째까지의 숫자를 크기와 모양이 같은 카드에 한 개씩 적어 상자에 넣었다. 이 상자에서 임의로 한 장의 카드를 뽑을 때 그 카드에 적힌 숫자가 $10^5$보다 크고 $10^9$보다 작은 수일 확률이 $\dfrac47$이다. 이 상자에서 임의로 한 장의 카드를 뽑아 그 카드에 적힌 숫자에 나타나는 $0$의 개수를 확률변수 $X$라 하자.

stem: |
  [문제 1] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    $r$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '91', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $b_n=2(n-1)\ (n\ge3)$로 5자리 이하 21장, 6~9자리 52장. 52장 미만이면 $r=49$(조건 위반), 52장 모두면 $\dfrac{52}{r}=\dfrac47$에서 $r=91$.
    steps:
    - {id: 1a, content: '$\sum_{k=1}^{5}b_k=21$, $\sum_{k=6}^{9}b_k=52$, $\dfrac{52}{r}=\dfrac47\Rightarrow r=91$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $A_n$의 원소 개수 $b_n$을 $n=1,2,3,4,5$에 대해 직접 세어 보자.
    - 범위 안의 카드가 모두 들어갔는지 아닌지로 나누어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드5 p.81~82 예시답안 1
    steps:
    - id: 1b-1
      content: |
        $A_n$의 원소 개수를 $b_n$이라 하면 $b_1=1$, $b_2=2$이다. $A_3$에는 숫자 1이 1번·2번·3번 나타나는 원소가 각각 $1,2,1$개이므로 $b_3=4$, 같은 방법으로 $b_4=6$, $b_5=8$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $n\ge3$일 때 $A_n$의 원소는 숫자 1이 $n-2$번, $n-1$번, $n$번 나타나는 원소로 나뉜다. 1이 $n-2$번: 일의 자리와 최고 자리를 제외한 $n-2$자리 중 $0$이 1번만 들어가고 일의 자리가 $0$인 경우로 $n-2$개. 1이 $n-1$번: 가운데 $n-2$자리 중 하나가 $0$이고 일의 자리가 $1$이거나, 가운데에 $0$이 없고 일의 자리가 $0$인 경우로 $(n-2)+1=n-1$개. 1이 $n$번: $1$개. 따라서 $b_n=(n-2)+(n-1)+1=2(n-1)$.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $10^5$보다 작은 수가 적힌 카드는 $\displaystyle\sum_{k=1}^{5}b_k=b_1+b_2+\sum_{k=3}^{5}b_k=1-2\times5+2\times\frac{5\times6}{2}=21$장, $10^5$보다 크고 $10^9$보다 작은 수가 적힌 카드는 최대 $\displaystyle\sum_{k=6}^{9}b_k=1-2\times9+2\times\frac{9\times10}{2}-21=52$장이다.
      criteria: ['1.M1']
    - id: 1b-4
      content: |
        (경우 1) 그 카드가 52장보다 적으면 $\dfrac{r-21}{r}=\dfrac47$에서 $3r=147$, $r=49$이지만 $r>60$을 만족하지 않는다.
        (경우 2) 52장이면 $\dfrac{52}{r}=\dfrac47$에서 $r=91$이고 조건을 만족한다. 따라서 $r=91$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: |
        $A_n$의 원소 개수를 $n$에 대한 식($b_n=2(n-1)$, $n\ge3$)으로 나타내고 $10^5$보다 크고 $10^9$보다 작은 수가 적힌 카드의 최대 개수 52를 구했다(채점기준 15/30).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: |
        가능한 경우의 $r$ 값($49$, $91$)을 모두 구하고 $r>60$에 맞는 $r=91$을 골랐다(채점기준 15/30).
      depends_on: ['1.M1']
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $\mathrm{V}(X)$의 값을 구하시오.
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: '270/637', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $r=91=\sum_{k=1}^{10}b_k$이므로 카드는 $A_1\sim A_{10}$ 전체. $P(X=0,1,2)=\dfrac{10}{91},\dfrac{45}{91},\dfrac{36}{91}$.
    steps:
    - {id: 2a, content: '$E(X)=\dfrac97$, $E(X^2)=\dfrac{189}{91}$, $V(X)=\dfrac{270}{637}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $\sum_{k=1}^{n}b_k=91$인 $n$을 먼저 구하자.
    - 각 $A_n$에서 $0$이 0개, 1개, 2개인 원소는 몇 개인가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드5 p.82 예시답안 2
    steps:
    - id: 2b-1
      content: |
        $\displaystyle\sum_{k=1}^{n}b_k=1-2n+2\times\frac{n(n+1)}{2}=n^2-n+1$이고 $n^2-n+1=91$인 자연수는 $n=10$이므로 상자에는 $A_1,\dots,A_{10}$의 원소가 모두 들어 있다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $n\le2$일 때 $0$이 2번인 원소 0개, 1번인 원소 1개, 0번인 원소 2개이고, $n\ge3$일 때 $A_n$에서 $0$이 2번·1번·0번 나타나는 원소가 각각 $n-2$, $n-1$, $1$개이다. 따라서
        $$P(X=0)=\frac{1\times10}{91}=\frac{10}{91},\quad P(X=1)=\frac{\sum_{k=2}^{10}(k-1)}{91}=\frac{45}{91},\quad P(X=2)=\frac{\sum_{k=3}^{10}(k-2)}{91}=\frac{36}{91}.$$
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $E(X)=\dfrac{45}{91}+2\times\dfrac{36}{91}=\dfrac{117}{91}=\dfrac97$이고
        $$V(X)=\left(0-\tfrac97\right)^2\tfrac{10}{91}+\left(1-\tfrac97\right)^2\tfrac{45}{91}+\left(2-\tfrac97\right)^2\tfrac{36}{91}=\frac{81\times10+4\times45+25\times36}{49\times91}=\frac{1890}{49\times91}=\frac{270}{637}.$$
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 2025 선행학습 영향평가 보고서 문항카드5 p.82 예시답안 2 ii)
    key_idea: $E(X^2)=0^2\cdot\tfrac{10}{91}+1^2\cdot\tfrac{45}{91}+2^2\cdot\tfrac{36}{91}=\tfrac{189}{91}$이므로 $V(X)=\tfrac{189}{91}-\tfrac{81}{49}=\tfrac{270}{637}$.
    steps:
    - id: 2c-1
      content: |
        $V(X)=E(X^2)-\{E(X)\}^2=\dfrac{189}{91}-\dfrac{81}{49}=\dfrac{1890}{49\times91}=\dfrac{270}{637}$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        상자의 카드가 $A_1\sim A_{10}$ 전체임을 밝히고 $X$의 확률분포 $\tfrac{10}{91},\tfrac{45}{91},\tfrac{36}{91}$을 구했다(채점기준 20/40).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        확률분포로 $V(X)=\dfrac{270}{637}$을 정확히 구했다(채점기준 20/40).
      depends_on: ['2.M1']
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    집합 $A_n$의 원소에 나타나는 숫자 $1$의 총 개수를 $a_n$이라 하자. 예를 들어, $A_2=\{10,11\}$이므로 $a_2=3$이다. 이때 $\displaystyle\sum_{k=1}^{20}a_k$의 값을 구하시오.
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '4789', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a_n=(n-2)(n-2)+(n-1)(n-1)+n\cdot1=2n^2-5n+5\ (n\ge2)$, $a_1=1$.
    steps:
    - {id: 3a, content: '$\sum_{k=1}^{20}a_k=1+\sum_{k=2}^{20}(2k^2-5k+5)=4789$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 1에서 얻은, 숫자 1이 $n-2,\,n-1,\,n$번 나타나는 원소의 개수를 이용하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드5 p.83 예시답안 3
    steps:
    - id: 3b-1
      content: |
        $a_1=1$, $a_2=3$이다. 1번 결과에서 $A_3$에는 숫자 1이 1·2·3번 나타나는 원소가 각각 $1,2,1$개이므로 $a_3=1\times1+2\times2+3\times1=8$, $A_4$는 $a_4=2\times2+3\times3+4\times1=17$, $A_5$는 $a_5=3\times3+4\times4+5\times1=30$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $n\ge3$일 때 숫자 1이 $n-2$번, $n-1$번, $n$번 나타나는 원소가 각각 $n-2$, $n-1$, $1$개이므로
        $$a_n=(n-2)\times(n-2)+(n-1)\times(n-1)+n=2n^2-5n+5$$
        이고, $n=2$일 때도 $a_2=3=2\times2^2-5\times2+5$이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        $$\sum_{k=1}^{20}a_k=a_1+\sum_{k=2}^{20}(2k^2-5k+5)=1+\left\{\sum_{k=1}^{20}(2k^2-5k+5)-2\right\}=2\times\frac{20\times21\times41}{6}-5\times\frac{20\times21}{2}+99=5740-1050+99=4789.$$
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        $a_n$을 자연수의 거듭제곱의 합 형태($a_n=2n^2-5n+5$, $n\ge2$)로 나타냈다(채점기준 20/30).
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        $\sum_{k=1}^{20}a_k=4789$를 정확히 구했다($a_1=1$ 별도 처리 포함, 채점기준 10/30).
      depends_on: ['3.M1']
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

