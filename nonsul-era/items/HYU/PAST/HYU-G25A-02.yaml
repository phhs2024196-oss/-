stimuli:
- label: 가
  body: |
    함수 $f(x)=\dfrac{1}{x^2+1}$과 $-\dfrac{1}{\sqrt3}<t<\dfrac{1}{\sqrt3}$인 실수 $t$에 대하여 점 $\mathrm{A}(t,f(t))$가 있다. 점 $\mathrm{A}$가 아닌 곡선 $y=f(x)$ 위의 서로 다른 두 점 $\mathrm{B}$, $\mathrm{C}$에 대하여 점 $\mathrm{B}$에서의 접선과 점 $\mathrm{C}$에서의 접선이 모두 점 $\mathrm{A}$를 지날 때, 직선 $\mathrm{AB}$, 직선 $\mathrm{AC}$와 $x$축으로 둘러싸인 삼각형의 넓이를 $g(t)$라 하자.
- label: 나
  body: |
    자연수 $n$에 대하여 원 $x^2+y^2=40n^4$과 직선 $y=-3x+10n$이 만나는 서로 다른 두 점을 $\mathrm{P}_n$, $\mathrm{Q}_n$이라 하자. 선분 $\mathrm{P}_n\mathrm{Q}_n$ 위의 점 중 $x$좌표가 정수인 점의 개수를 $T_n$이라 하자.
- label: 다
  body: |
    수열 $\{a_n\}$은 모든 자연수 $n$에 대하여 $\displaystyle\sum_{k=1}^{n}a_k=T_n+1$을 만족시킨다.

stem: |
  [문제 2] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    $g(t)$를 $t$에 대한 식으로 나타내시오.
  points: 20
  depends_on: []
  answer: {kind: expression, value: '2/sqrt(t**2 + 1)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접점 $s=-t\pm\sqrt{t^2+1}$, $x$절편 $-t\pm2\sqrt{t^2+1}$, 밑변 $4\sqrt{t^2+1}$, 높이 $\tfrac{1}{t^2+1}$.
    steps:
    - {id: 1a, content: '$g(t)=\tfrac12\times4\sqrt{t^2+1}\times\tfrac{1}{t^2+1}=\tfrac{2}{\sqrt{t^2+1}}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 접점을 $(s,f(s))$로 놓고 접선이 $\mathrm{A}$를 지날 조건을 쓰자.
    - 그 식은 $s=t$를 근으로 가진다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드6 p.86 예시답안 1
    steps:
    - id: 1b-1
      content: |
        곡선 위의 점 $(s,f(s))\ (s\ne t)$에서의 접선은 $y=-\dfrac{2s}{(s^2+1)^2}(x-s)+\dfrac{1}{s^2+1}$이고, 그 $x$절편은 $\dfrac12\left(3s+\dfrac1s\right)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이 접선이 $\mathrm{A}(t,f(t))$를 지나므로 $\dfrac{1}{t^2+1}=-\dfrac{2s}{(s^2+1)^2}(t-s)+\dfrac{1}{s^2+1}$, 즉
        $$\frac{2s(t-s)}{(s^2+1)^2}=\frac{(t-s)(t+s)}{(s^2+1)(t^2+1)}\iff\frac{2s}{s^2+1}=\frac{t+s}{t^2+1}\iff(s-t)(s^2+2ts-1)=0$$
        ($s\ne t$ 이용)이므로 $s^2+2ts-1=0$, $s=-t\pm\sqrt{t^2+1}$이다. 조건 $-\tfrac1{\sqrt3}<t<\tfrac1{\sqrt3}$에서 $t\ne-t\pm\sqrt{t^2+1}$임을 확인할 수 있다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $s=-t+\sqrt{t^2+1}$일 때와 $s=-t-\sqrt{t^2+1}$일 때 접선의 $x$절편은 각각 $-t+2\sqrt{t^2+1}$, $-t-2\sqrt{t^2+1}$이다. 따라서
        $$g(t)=\frac12\times4\sqrt{t^2+1}\times\frac{1}{t^2+1}=\frac{2}{\sqrt{t^2+1}}\quad\left(-\tfrac1{\sqrt3}<t<\tfrac1{\sqrt3}\right).$$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        두 접점의 $x$좌표 $s=-t\pm\sqrt{t^2+1}$을 구했다(채점기준 20/40).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        두 $x$절편과 높이로 삼각형의 넓이 $g(t)=\dfrac{2}{\sqrt{t^2+1}}$을 구했다(채점기준 20/40).
      depends_on: ['1.M1']
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    수열 $\{a_n\}$의 일반항을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: expression, value: '8*n - 4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 교점의 $x$좌표 $3n\pm n\sqrt{4n^2-1}$, $2n^2-1<n\sqrt{4n^2-1}<2n^2$이므로 $T_n=4n^2-1$, $S_n=4n^2$.
    steps:
    - {id: 2a, content: '$T_n=4n^2-1$, $a_1=4$, $a_n=S_n-S_{n-1}=8n-4$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 교점의 $x$좌표를 구하자.
    - $n\sqrt{4n^2-1}$은 어떤 두 연속 정수 사이에 있는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드6 p.87 예시답안 2
    steps:
    - id: 2b-1
      content: |
        $y=-3x+10n$을 $x^2+y^2=40n^4$에 대입해 정리하면 $x^2-6nx+10n^2-4n^4=0$이므로 $x=3n\pm\sqrt{9n^2-(10n^2-4n^4)}=3n\pm n\sqrt{4n^2-1}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $n\sqrt{4n^2-1}<2n^2$은 자명하고, $2n^2-1<n\sqrt{4n^2-1}\iff(2n^2-1)^2<n^2(4n^2-1)\iff4n^4-4n^2+1<4n^4-n^2\iff3n^2>1$이므로 $2n^2-1<n\sqrt{4n^2-1}<2n^2$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        따라서 $T_n$은 $3n-(2n^2-1)$ 이상 $3n+2n^2-1$ 이하인 정수의 개수이고 $T_n=3n+2n^2-1-(3n-2n^2+1)+1=4n^2-1$이다.
      criteria: ['2.M1']
    - id: 2b-4
      content: |
        $S_n=\sum_{k=1}^{n}a_k=T_n+1=4n^2$이므로 $a_1=S_1=4$, $n\ge2$일 때 $a_n=S_n-S_{n-1}=8n-4$이다. $a_1=4$도 이 식을 만족하므로 모든 자연수 $n$에 대해 $a_n=8n-4$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        선분 $\mathrm{P}_n\mathrm{Q}_n$ 위의 $x$좌표가 정수인 점의 개수 $T_n=4n^2-1$을 근거와 함께 구했다(채점기준 20/40).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2, 2b-3]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        $S_n=4n^2$에서 $a_1$을 확인하고 일반항 $a_n=8n-4$를 구했다(채점기준 20/40).
      depends_on: ['2.M1']
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $\displaystyle\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}g''\left(\frac{a_k+4}{16n}\right)$의 값을 구하시오.
  points: 10
  depends_on: ['1', '2']
  answer: {kind: value, value: '-16*sqrt(5)/25', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{a_k+4}{16n}=\dfrac{k}{2n}$이므로 극한은 $2\int_0^{1/2}g''(t)\,dt=2\left\{g'\left(\tfrac12\right)-g'(0)\right\}$.
    steps:
    - {id: 3a, content: '$g''(t)=-\dfrac{2t}{(t^2+1)^{3/2}}$, $2\left(g''\left(\tfrac12\right)-g''(0)\right)=-\dfrac{16}{25}\sqrt5$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $a_k=8k-4$를 대입하면 인자가 간단해진다.
    - $\dfrac1n=2\cdot\dfrac{1}{2n}$으로 보자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드6 p.87 예시답안 3
    steps:
    - id: 3b-1
      content: |
        함수 $g$의 이계도함수 $g''$가 닫힌구간 $\left[0,\tfrac12\right]$에서 연속이므로
        $$\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}g''\left(\frac{a_k+4}{16n}\right)=2\lim_{n\to\infty}\frac{1}{2n}\sum_{k=1}^{n}g''\left(\frac{k}{2n}\right)=2\int_0^{\frac12}g''(t)\,dt.$$
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $g'(t)=-\dfrac{2t}{(t^2+1)^{3/2}}$가 $g''(t)$의 부정적분이므로
        $$2\int_0^{\frac12}g''(t)\,dt=2\left(g'\left(\tfrac12\right)-g'(0)\right)=-\frac{16}{25}\sqrt5.$$
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        주어진 극한값을 정적분 $2\int_0^{1/2}g''(t)\,dt$로 나타냈다(채점기준 10/20).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: ['1.A1', '2.A1'], max_points: 5}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        정적분을 계산해 $-\dfrac{16}{25}\sqrt5$를 얻었다(채점기준 10/20).
      depends_on: ['3.M1']
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

