intent: |
  접선의 방정식과 $x$절편으로 삼각형의 넓이를 구하는 능력, 수열의 합으로 주어진 조건에서 일반항을 구하는 능력, 정적분과 급수의 합 사이의 관계로 극한값을 정적분으로 나타내 계산하는 능력을 본다.
key_idea: |
  점 $\mathrm{A}$를 지나는 접선의 접점 $s$는 $(s-t)(s^2+2ts-1)=0$에서 $s=-t\pm\sqrt{t^2+1}$이고, $T_n$은 $2n^2-1<n\sqrt{4n^2-1}<2n^2$으로 세며, $\dfrac{a_k+4}{16n}=\dfrac{k}{2n}$이 되어 극한은 $2\int_0^{1/2}g''(t)\,dt$이다.
stuck: |
  접선 조건식에서 $s-t$ 인수를 빼내는 정리, $n\sqrt{4n^2-1}$의 정수 부분을 부등식으로 잡는 것, 리만 합을 $\int g''=g'$로 바꾸는 것
idea_tags: [IDEA-TANGENT-THROUGH-EXTERNAL-POINT, IDEA-FLOOR-SQRT-BOUND, IDEA-RIEMANN-SUM-INTEGRAL]
tags: [접선, 정수점 개수, 수열의 합과 일반항, 정적분과 급수, 배점환산]
