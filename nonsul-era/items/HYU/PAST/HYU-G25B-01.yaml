intent: |
  수학Ⅱ의 다항함수 정적분, 수학의 경우의 수(합의 법칙·곱의 법칙)와 조합, 수학Ⅱ의 함수의 연속·미분계수, 미적분의 치환적분법 같은 기본 내용을 활용할 수 있는지 본다. 정적분 값으로 순서쌍을 세고, 방향 전환 지점을 조합으로 세어 최단 경로 수를 구하며, 연속·미분가능 조건으로 함수를 결정한 뒤 치환적분으로 넓이를 구한다.
key_idea: |
  2.는 방향이 바뀌는 지점의 좌표를 고르는 문제로 바꾸어 $_{n-1}\mathrm{C}_k$의 곱으로 센다. 3.은 각 구간의 $f$가 $g$를 가로·세로로 축소·평행이동한 것이므로 $x=3$에서의 미분가능 조건으로 $g$를 정하고, 치환하면 각 구간의 적분이 $\left(\tfrac49\right)^{k-1}\int_0^3|g|$가 된다.
stuck: |
  2.에서 시작 방향(오른쪽/위쪽)에 따라 전환 지점의 $x$좌표·$y$좌표를 고르는 개수가 정해진다는 것, 3.에서 $[3,5)$의 $f$를 $g$로 직접 써서 좌·우 미분계수를 맞추는 것
idea_tags: [IDEA-LATTICE-TURN-COUNT, IDEA-SELF-SIMILAR-PIECEWISE, IDEA-SUBSTITUTION-SCALING]
tags: [정적분, 최단 경로, 조합, 연속과 미분가능, 치환적분, 등비수열, 배점환산]
elements:
  materials:
  - '$20\le\int_1^2(2x^3+3ax^2+bx)\,dx\le30$, $a,b\in\{1,\dots,5\}$'
  - '$n\times n$ 정사각형 도로망에서 방향 전환 지점이 4개·7개인 최단 경로 수 $f(n)$, $g(n)$'
  - '삼차함수 $g$와 $a_n=9\left(1-\left(\tfrac23\right)^{n-1}\right)$로 조각별 정의된 $f$'
  concepts:
  - 다항함수의 정적분
  - 합의 법칙과 곱의 법칙
  - 조합의 수
  - 함수의 연속
  - 미분계수와 미분가능성
  - 치환적분법
  - 등비수열의 합
  tools:
  - '$\int_1^2(\cdots)\,dx=7a+\dfrac{3b+15}{2}$로 $a$별 경우 나누기'
  - '전환 지점 좌표 선택: $_{n-1}\mathrm{C}_2\times{}_{n-1}\mathrm{C}_1$, $_{n-1}\mathrm{C}_3\times{}_{n-1}\mathrm{C}_3$, 시작 방향 대칭으로 2배'
  - '$x=3$에서 좌·우 미분계수 일치로 $x_0=\tfrac32$, $g''(0)g''(3)=9$로 계수 결정'
  - '치환 $y=\left(\tfrac32\right)^{k-1}(x-a_{k+1})+3$'
  - '$\int_0^3|g|=2\int_0^{3/2}g$ (대칭)'
  conditions:
  - '방향 전환 지점은 A와 B를 제외'
  - '4회 전환: 오른쪽→위쪽 전환 2회($x$좌표 2개), 위쪽→오른쪽 전환 2회(그중 하나의 $y$좌표는 $n$이 아님에 주의)'
  - '$a_1=0$, $a_2=3$, $a_3=5$, $a_4=\tfrac{19}{3}$, $a_5=\tfrac{65}{9}$'
  - '$[a_n,a_{n+1})$에서 $f$의 인자 $\left(\tfrac32\right)^{n-1}(x-a_{n+1})+3\in[0,3)$이므로 $f=g$ 사용'
