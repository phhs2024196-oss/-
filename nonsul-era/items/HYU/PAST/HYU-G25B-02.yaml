stem: |
  [문제 2] 다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    자연수 $n$에 대하여, $0<x<\dfrac{\pi}{2}$일 때 두 곡선 $y=\sin x$와 $y=\dfrac{n}{n+1}\tan x$가 만나는 점을 $\mathrm{P}_n$이라 하자. 점 $\mathrm{P}_n$에서의 곡선 $y=\sin x$의 접선을 $l_1$, 점 $\mathrm{P}_n$에서의 곡선 $y=\dfrac{n}{n+1}\tan x$의 접선을 $l_2$라 하자. 두 직선 $l_1$, $l_2$와 $x$축으로 둘러싸인 삼각형의 넓이를 $S_n$이라 할 때, $\displaystyle\lim_{n\to\infty}n^2S_n$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\cos\theta=\tfrac{n}{n+1}$, $l_1$·$l_2$의 $x$절편 $\theta-\tan\theta$, $\theta-\sin\theta\cos\theta$, $S_n=\tfrac12\sin^2\theta\left(\tfrac1{\cos\theta}-\cos\theta\right)=\dfrac{(2n+1)^2}{2n(n+1)^3}$.
    steps:
    - {id: 1a, content: '$n^2S_n=\dfrac{n(2n+1)^2}{2(n+1)^3}\to2$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 교점의 $x$좌표를 $\theta$라 하면 $\cos\theta$는?
    - $\left(\tfrac{n}{n+1}\tan x\right)'$를 $\theta$에서 계산하면 $\sec\theta$가 된다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드8 p.97~98 예시답안 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P}_n$의 $x$좌표를 $\theta$라 하면 $\sin\theta=\dfrac{n}{n+1}\tan\theta$이므로 $\cos\theta=\dfrac{n}{n+1}$이다. 직선 $l_1$, $l_2$를 각각 $y=f(x)$, $y=g(x)$라 하면
        $$f(x)=(\cos\theta)(x-\theta)+\sin\theta,\qquad g(x)=\frac{n}{n+1}(\sec^2\theta)(x-\theta)+\sin\theta=\sec\theta\,(x-\theta)+\sin\theta.$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        삼각형의 넓이는 $S_n=\dfrac12\sin\theta\times(l_1,\ l_2$의 $x$절편 사이의 거리$)$이다. $f(x)=0\iff x=\theta-\dfrac{\sin\theta}{\cos\theta}$, $g(x)=0\iff x=\theta-\sin\theta\cos\theta$이므로
        $$S_n=\frac12\sin^2\theta\left(\frac{1}{\cos\theta}-\cos\theta\right)=\frac12\left(1-\left(\frac{n}{n+1}\right)^2\right)\left(\frac{n+1}{n}-\frac{n}{n+1}\right)=\frac{(2n+1)^2}{2n(n+1)^3}.$$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}n^2S_n=\lim_{n\to\infty}\frac{n(2n+1)^2}{2(n+1)^3}=2$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $y=\sin x$와 $y=\dfrac{n}{n+1}\tan x$의 $\mathrm{P}_n$에서의 접선의 방정식을 구했다(채점기준 10/30).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $S_n=\dfrac{(2n+1)^2}{2n(n+1)^3}$을 정확히 구하고 $\lim n^2S_n=2$를 계산했다(채점기준 20/30).
      depends_on: ['1.M1']
      steps: [1b-2, 1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    점 $\mathrm{F}$를 초점으로 하는 포물선 $y^2=4px$ $(p>0)$ 위에 원점이 아닌 점 $\mathrm{P}(x_1,y_1)$이 있다. 점 $\mathrm{P}$에서 포물선에 접하는 직선이 직선 $x=-p$와 만나는 점을 $\mathrm{Q}$라 하고, 점 $\mathrm{Q}$와 $y$좌표가 같은 포물선 위의 점을 $\mathrm{P}'$이라 하자. 각 $\mathrm{PFP}'$의 크기를 $\theta$라 할 때, $\cos\theta=\dfrac15$이다. $x_1$을 $p$에 대한 식으로 나타내시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '3*p/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}'\left(\dfrac{(x_1-p)^2}{4x_1},\dfrac{2p(x_1-p)}{y_1}\right)$, 내적과 준선 거리로 $\cos\theta=\dfrac{x_1-p}{x_1+p}=\dfrac15$.
    steps:
    - {id: 2a, content: '$\dfrac{x_1-p}{x_1+p}=\dfrac15\Rightarrow x_1=\dfrac{3p}{2}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 포물선 위의 점에서의 접선 공식을 쓰자.
    - $|\overrightarrow{\mathrm{FP}}|$는 준선까지의 거리와 같다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드8 p.98 예시답안 2
    steps:
    - id: 2b-1
      content: |
        포물선 $y^2=4px$ 위의 점 $\mathrm{P}(x_1,y_1)$에서의 접선은 $y_1y=2p(x+x_1)$이므로 직선 $x=-p$와 만나는 점은 $\left(-p,\dfrac{2p(x_1-p)}{y_1}\right)$이다. 점 $\mathrm{P}'$의 $x$좌표를 $x_2$라 하면 $\left(\dfrac{2p(x_1-p)}{y_1}\right)^2=4px_2$이고 $y_1^2=4px_1$이므로 $x_2=\dfrac{(x_1-p)^2}{4x_1}$이다. 따라서 $\mathrm{P}'\left(\dfrac{(x_1-p)^2}{4x_1},\dfrac{2p(x_1-p)}{y_1}\right)$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\mathrm{F}(p,0)$이므로 $\overrightarrow{\mathrm{FP}}=(x_1-p,\ y_1)$, $\overrightarrow{\mathrm{FP}'}=\left(\dfrac{(x_1-p)^2}{4x_1}-p,\ \dfrac{2p(x_1-p)}{y_1}\right)$이고 $\cos\theta=\dfrac{\overrightarrow{\mathrm{FP}}\cdot\overrightarrow{\mathrm{FP}'}}{|\overrightarrow{\mathrm{FP}}||\overrightarrow{\mathrm{FP}'}|}$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $x=-p$는 준선이므로 $|\overrightarrow{\mathrm{FP}}|=x_1+p$, $|\overrightarrow{\mathrm{FP}'}|=x_2+p=\dfrac{(x_1-p)^2}{4x_1}+p$이다. $\overrightarrow{\mathrm{FP}}\cdot\overrightarrow{\mathrm{FP}'}=\dfrac{(x_1-p)^3}{4x_1}+p(x_1-p)$이므로 $\cos\theta=\dfrac{x_1-p}{x_1+p}$이고, $\cos\theta=\dfrac15$에서 $x_1=\dfrac{3p}{2}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        점 $\mathrm{P}'$의 좌표를 $x_1$, $y_1$, $p$로 나타냈다(채점기준 10/30).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        평면벡터의 내적으로 $\cos\theta=\dfrac{x_1-p}{x_1+p}$를 얻어 $x_1=\dfrac{3p}{2}$로 나타냈다(채점기준 20/30).
      depends_on: ['2.M1']
      steps: [2b-2, 2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    한 변의 길이가 $4$인 정육면체 $\mathrm{ABCD}-\mathrm{EFGH}$가 있다. 선분 $\mathrm{FH}$ 위의 한 점 $\mathrm{P}$와 선분 $\mathrm{FG}$ 위의 한 점 $\mathrm{Q}$에 대하여 선분 $\mathrm{CP}$와 선분 $\mathrm{DQ}$가 한 점 $\mathrm{R}$에서 만나고, $\overline{\mathrm{DR}}:\overline{\mathrm{RQ}}=4:3$이다. 평면 $\mathrm{APC}$와 평면 $\mathrm{EFGH}$가 이루는 각의 크기가 $\theta$일 때, $\cos\theta$의 값을 구하시오. (단, $0<\theta<\dfrac{\pi}{2}$)
    [그림: 윗면 $\mathrm{ABCD}$(뒤 왼쪽 $\mathrm{A}$, 앞 왼쪽 $\mathrm{B}$, 앞 오른쪽 $\mathrm{C}$, 뒤 오른쪽 $\mathrm{D}$), 아랫면 $\mathrm{EFGH}$($\mathrm{E}$는 $\mathrm{A}$ 아래, $\mathrm{F}$는 $\mathrm{B}$ 아래, $\mathrm{G}$는 $\mathrm{C}$ 아래, $\mathrm{H}$는 $\mathrm{D}$ 아래)인 정육면체. 대각선 $\mathrm{FH}$ 위의 점 $\mathrm{P}$, 모서리 $\mathrm{FG}$ 위의 점 $\mathrm{Q}$, 선분 $\mathrm{AP}$, $\mathrm{AC}$, $\mathrm{CP}$, $\mathrm{DQ}$가 그려져 있고 $\mathrm{CP}$와 $\mathrm{DQ}$의 교점이 $\mathrm{R}$]
  points: 20
  depends_on: []
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{PQ}\parallel\mathrm{CD}\parallel\mathrm{GH}$, 닮음으로 $\overline{\mathrm{PQ}}=\overline{\mathrm{FQ}}=3$, $\triangle\mathrm{APC}=12$, 정사영 $\triangle\mathrm{PEG}=4$.
    steps:
    - {id: 3a, content: '$\cos\theta=\dfrac{4}{12}=\dfrac13$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - 만나는 두 직선 $\mathrm{CP}$, $\mathrm{DQ}$는 하나의 평면을 결정한다.
    - 그 평면이 평행한 두 면과 만나는 교선은 어떤 관계인가?
    - 삼각형 $\mathrm{APC}$의 면 $\mathrm{EFGH}$ 위로의 정사영은?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드8 p.99 예시답안 3
    steps:
    - id: 3b-1
      content: |
        직선 $\mathrm{CP}$와 직선 $\mathrm{DQ}$가 한 점에서 만나므로 이 두 직선은 하나의 평면을 결정한다. 즉 직선 $\mathrm{CD}$와 직선 $\mathrm{PQ}$는 한 평면 위에 있고, 평행한 두 평면 $\mathrm{ABCD}$와 $\mathrm{EFGH}$에 각각 포함되므로 $\mathrm{CD}\parallel\mathrm{PQ}$이다. 또 $\mathrm{CD}\parallel\mathrm{GH}$이므로 $\mathrm{PQ}\parallel\mathrm{GH}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        점 $\mathrm{R}$에서 평면 $\mathrm{EFGH}$에 내린 수선의 발을 $\mathrm{R}'$이라 하면 $\triangle\mathrm{R}'\mathrm{PQ}\sim\triangle\mathrm{R}'\mathrm{GH}$이다. 한편 $\mathrm{RR}'\parallel\mathrm{DH}$이므로 $\triangle\mathrm{QRR}'\sim\triangle\mathrm{QDH}$이고, $\overline{\mathrm{DR}}:\overline{\mathrm{RQ}}=4:3$에서 $\overline{\mathrm{HR}'}:\overline{\mathrm{R}'\mathrm{Q}}=4:3$이다. 따라서 $\overline{\mathrm{PQ}}:\overline{\mathrm{GH}}=3:4$이고 $\overline{\mathrm{GH}}=4$이므로 $\overline{\mathrm{PQ}}=\overline{\mathrm{FQ}}=3$이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $\overline{\mathrm{PG}}=\sqrt{\overline{\mathrm{PQ}}^2+\overline{\mathrm{QG}}^2}=\sqrt{10}$, $\overline{\mathrm{CP}}=\sqrt{\overline{\mathrm{PG}}^2+\overline{\mathrm{CG}}^2}=\sqrt{26}$이다. 삼각형 $\mathrm{APC}$는 $\overline{\mathrm{AP}}=\overline{\mathrm{PC}}=\sqrt{26}$, $\overline{\mathrm{AC}}=4\sqrt2$인 이등변삼각형이고, 점 $\mathrm{P}$에서 선분 $\mathrm{AC}$에 내린 수선의 발을 $\mathrm{H}'$이라 하면 $\overline{\mathrm{PH}'}=\sqrt{\overline{\mathrm{AP}}^2-\overline{\mathrm{AH}'}^2}=3\sqrt2$이므로 넓이는 $\dfrac12\times3\sqrt2\times4\sqrt2=12$이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
