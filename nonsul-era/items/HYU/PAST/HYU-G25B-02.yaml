intent: |
  미적분의 수열의 극한·접선의 방정식, 기하의 포물선과 접선·평면벡터의 성분과 내적, 공간도형의 위치 관계와 정사영을 활용할 수 있는지 본다. 두 곡선의 교점에서 그은 접선으로 만든 삼각형 넓이의 극한, 포물선의 준선 성질과 내적으로 점의 좌표, 두 직선이 결정하는 평면과 정사영 넓이 비로 이면각을 구한다.
key_idea: |
  1.은 교점의 $x$좌표 $\theta$가 $\cos\theta=\tfrac{n}{n+1}$을 만족하는 것, 2.는 $|\overrightarrow{\mathrm{FP}}|=x_1+p$(준선까지 거리)와 내적으로 $\cos\theta=\tfrac{x_1-p}{x_1+p}$, 3.은 두 직선 CP·DQ가 한 평면을 이루어 $\mathrm{PQ}\parallel\mathrm{CD}$가 되는 것과 정사영 넓이 비 $\cos\theta=\tfrac{S'}{S}$.
stuck: |
  2.에서 $\mathrm{P}'$의 좌표를 $x_1,y_1,p$로 나타내 내적을 정리하는 계산, 3.에서 만나는 두 직선이 결정하는 평면과 평행한 두 평면의 교선이 평행하다는 관찰
