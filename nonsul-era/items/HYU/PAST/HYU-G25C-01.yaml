stem: |
  [문제 1] 다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    곡선 $y=x^3+3x^2-x-6$을 $x$축의 방향으로 $m$만큼, $y$축의 방향으로 $n$만큼 평행이동한 곡선을 $y=g(x)$라 하자. 모든 실수 $x$에 대하여 $g(-x)=-g(x)$가 성립할 때, $m$과 $n$의 값을 구하고, 이 두 곡선으로 둘러싸인 도형의 넓이를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 'm = 1; n = 3; area = 27/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(-x)+g(x)=0$이 항등식이 되려면 $3(m-1)x^2+m^3-3m^2-m+6-n=0$, 즉 $m=1$, $n=3$, $g(x)=x^3-4x$.
    steps:
    - {id: 1a, content: '교점 $x=-2,1$, $\int_{-2}^{1}|g-f|\,dx=\dfrac{27}{2}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 평행이동한 곡선은 $g(x)=f(x-m)+n$이다.
    - $g(-x)=-g(x)$를 정리해 항등식의 계수를 비교하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드9 p.103 예시답안 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^3+3x^2-x-6$이라 하면 $g(x)=f(x-m)+n$이다. 모든 $x$에 대해 $g(-x)=-g(x)$이므로 정리하면
        $$3(m-1)x^2+m^3-3m^2-m+6-n=0$$
        이고, 이로부터 $m=1$, $n=3$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이때 $g(x)=x^3-4x$이므로 곡선 $y=f(x)$, $y=g(x)$의 교점은 $(1,-3)$, $(-2,0)$이다. 따라서 구하는 도형의 넓이는
        $$\int_{-2}^{1}|g(x)-f(x)|\,dx=-3\int_{-2}^{1}(x^2+x-2)\,dx=-3\left[\frac13x^3+\frac12x^2-2x\right]_{-2}^{1}=\frac{27}{2}.$$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: |
        항등식 비교로 $m=1$, $n=3$을 구했다(채점기준 15/30).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: |
        두 곡선의 교점 $x=-2,\ 1$을 구하고 둘러싸인 도형의 넓이 $\dfrac{27}{2}$을 구했다(채점기준 15/30).
      depends_on: ['1.M1']
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    세 변 $\mathrm{AB}$, $\mathrm{BC}$, $\mathrm{CA}$의 길이가 각각 $3$, $4$, $5$인 삼각형 $\mathrm{ABC}$가 있다. 삼각형 $\mathrm{PQR}$은 다음 조건을 만족시킨다.

    <가> 꼭짓점 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$은 각각 선분 $\mathrm{AB}$, $\mathrm{BC}$, $\mathrm{CA}$ 위에 있다.
    <나> 두 선분 $\mathrm{PQ}$와 $\mathrm{QR}$은 서로 수직이고 $\overline{\mathrm{PQ}}=\overline{\mathrm{QR}}$이다.

    $\overline{\mathrm{BP}}=x$ $(0\le x\le3)$라 할 때, 삼각형 $\mathrm{PQR}$의 넓이를 $x$에 대한 식으로 나타내고, 삼각형 $\mathrm{PQR}$의 넓이가 최소가 되게 하는 $x$의 값을 구하시오.
    [그림: $\angle\mathrm{B}=90^\circ$인 직각삼각형 $\mathrm{ABC}$($\mathrm{A}$ 위, $\mathrm{B}$ 왼쪽 아래, $\mathrm{C}$ 오른쪽 아래, $\overline{\mathrm{AB}}=3$, $\overline{\mathrm{BC}}=4$, $\overline{\mathrm{CA}}=5$). $\mathrm{P}$는 $\mathrm{AB}$ 위($\overline{\mathrm{BP}}=x$), $\mathrm{Q}$는 $\mathrm{BC}$ 위, $\mathrm{R}$은 $\mathrm{CA}$ 위이고 $\angle\mathrm{PQR}=90^\circ$, $\overline{\mathrm{PQ}}=\overline{\mathrm{QR}}$ 표시]
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'S(x) = (29*x**2 - 36*x + 72)/49; x_min = 18/29', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{R}$에서 $\mathrm{BC}$에 수선 $\mathrm{RH}$를 내리면 $\triangle\mathrm{PBQ}\equiv\triangle\mathrm{QHR}$, $\overline{\mathrm{BQ}}=a=\dfrac{12-3x}{7}$, 넓이 $\dfrac12\left(x^2+a^2\right)$.
    steps:
    - {id: 2a, content: '$\dfrac{1}{49}(29x^2-36x+72)=\dfrac{29}{49}\left(x-\dfrac{18}{29}\right)^2+\dfrac{36}{29}$, 최소 $x=\dfrac{18}{29}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $\mathrm{R}$에서 $\mathrm{BC}$에 수선을 내려 보자.
    - $\overline{\mathrm{RH}}:\overline{\mathrm{HC}}=3:4$를 이용하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드9 p.103~104 예시답안 2
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{R}$에서 선분 $\mathrm{BC}$에 내린 수선의 발을 $\mathrm{H}$라 하면 삼각형 $\mathrm{PBQ}$와 삼각형 $\mathrm{QHR}$은 합동이다. $\overline{\mathrm{HR}}=\overline{\mathrm{BQ}}=a$라 하면 $\overline{\mathrm{QH}}=\overline{\mathrm{BP}}=x$이고 $\overline{\mathrm{HC}}=4-(x+a)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\dfrac{\overline{\mathrm{RH}}}{\overline{\mathrm{HC}}}=\dfrac{\overline{\mathrm{AB}}}{\overline{\mathrm{BC}}}=\dfrac34$로부터 $\dfrac{a}{4-(x+a)}=\dfrac34$이고, 따라서 $a=\dfrac{12-3x}{7}$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        삼각형 $\mathrm{PQR}$의 넓이 $=$ 사다리꼴 $\mathrm{PBHR}$의 넓이 $-$ (삼각형 $\mathrm{PBQ}$의 넓이 $+$ 삼각형 $\mathrm{QHR}$의 넓이)
        $$=\frac12\left(x+\frac{12-3x}{7}\right)^2-2\times\frac12x\times\frac{12-3x}{7}=\frac{1}{49}(29x^2-36x+72).$$
      criteria: ['2.M1']
    - id: 2b-4
      content: |
        $0\le x\le3$이므로 $\dfrac{1}{49}(29x^2-36x+72)=\dfrac{29}{49}\left(x-\dfrac{18}{29}\right)^2+\dfrac{36}{29}$는 $x=\dfrac{18}{29}$일 때 최솟값 $\dfrac{36}{29}$을 갖는다. 따라서 구하는 $x$의 값은 $\dfrac{18}{29}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: |
        삼각형 $\mathrm{PQR}$의 넓이를 $\dfrac{1}{49}(29x^2-36x+72)$처럼 $x$에 대한 식으로 나타냈다(채점기준 15/30).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2, 2b-3]
    - id: 2.A1
      mark_type: A
      points: 7
      evidence: |
        완전제곱식과 $0\le x\le3$으로 넓이가 최소가 되는 $x=\dfrac{18}{29}$을 구했다(채점기준 15/30).
      depends_on: ['2.M1']
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    정삼각형 $\mathrm{A_1B_1C_1}$과 $0<t<\dfrac12$인 상수 $t$에 대하여 점 $\mathrm{A_1}'$, $\mathrm{B_1}'$, $\mathrm{C_1}'$은 각각 변 $\mathrm{A_1B_1}$, $\mathrm{B_1C_1}$, $\mathrm{C_1A_1}$ 위에 있고, $\overline{\mathrm{A_1A_1}'}=t\overline{\mathrm{A_1B_1}}$, $\overline{\mathrm{B_1B_1}'}=t\overline{\mathrm{B_1C_1}}$, $\overline{\mathrm{C_1C_1}'}=t\overline{\mathrm{C_1A_1}}$을 만족시킨다. 아래 그림과 같이 선분 $\mathrm{A_1B_1}'$과 $\mathrm{C_1A_1}'$이 만나는 점을 $\mathrm{A_2}$, 선분 $\mathrm{B_1C_1}'$과 $\mathrm{A_1B_1}'$이 만나는 점을 $\mathrm{B_2}$, 선분 $\mathrm{C_1A_1}'$과 $\mathrm{B_1C_1}'$이 만나는 점을 $\mathrm{C_2}$라 하면 삼각형 $\mathrm{A_2B_2C_2}$는 정삼각형이다.
    정삼각형 $\mathrm{A_2B_2C_2}$에도 같은 방법을 적용하여, 각각 변 $\mathrm{A_2B_2}$, $\mathrm{B_2C_2}$, $\mathrm{C_2A_2}$ 위에 있고 $\overline{\mathrm{A_2A_2}'}=t\overline{\mathrm{A_2B_2}}$, $\overline{\mathrm{B_2B_2}'}=t\overline{\mathrm{B_2C_2}}$, $\overline{\mathrm{C_2C_2}'}=t\overline{\mathrm{C_2A_2}}$를 만족시키는 점을 각각 $\mathrm{A_2}'$, $\mathrm{B_2}'$, $\mathrm{C_2}'$이라 하면 선분 $\mathrm{A_2B_2}'$과 $\mathrm{C_2A_2}'$이 만나는 점 $\mathrm{A_3}$, 선분 $\mathrm{B_2C_2}'$과 $\mathrm{A_2B_2}'$이 만나는 점 $\mathrm{B_3}$, 선분 $\mathrm{C_2A_2}'$과 $\mathrm{B_2C_2}'$이 만나는 점 $\mathrm{C_3}$을 세 꼭짓점으로 하는 정삼각형 $\mathrm{A_3B_3C_3}$을 얻는다. 이와 같은 과정을 반복하여 정삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$ $(n\ge2)$을 얻을 수 있다. 자연수 $n$에 대하여 정삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$의 넓이를 $s_n$이라 하자.
    $s_2=rs_1$을 만족시키는 $r$을 $t$에 대한 식으로 나타내고, $\displaystyle\sum_{n=1}^{\infty}s_n=3s_1$을 만족시키는 $t$의 값을 구하시오.
    [그림 왼쪽: 정삼각형 $\mathrm{A_1B_1C_1}$($\mathrm{A_1}$ 위, $\mathrm{B_1}$ 왼쪽 아래, $\mathrm{C_1}$ 오른쪽 아래)에 $\mathrm{A_1}'$(변 $\mathrm{A_1B_1}$ 위, $\mathrm{A_1}$ 가까이), $\mathrm{B_1}'$(변 $\mathrm{B_1C_1}$ 위, $\mathrm{B_1}$ 가까이), $\mathrm{C_1}'$(변 $\mathrm{C_1A_1}$ 위, $\mathrm{C_1}$ 가까이)을 찍고 선분 $\mathrm{A_1B_1}'$, $\mathrm{B_1C_1}'$, $\mathrm{C_1A_1}'$을 그어 안쪽 정삼각형 $\mathrm{A_2B_2C_2}$를 만든 그림. 그림 오른쪽: 같은 작업을 $\mathrm{A_2B_2C_2}$에 반복해 $\mathrm{A_2}'$, $\mathrm{B_2}'$, $\mathrm{C_2}'$과 $\mathrm{A_3B_3C_3}$을 만든 그림]
  points: 20
  depends_on: []
  answer: {kind: expression, value: 'r = (1 - 2*t)**2/(t**2 - t + 1); t = (5 - sqrt(15))/10', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 한 변 1로 두면 $\overline{\mathrm{A_1B_1}'}=\sqrt{1-t+t^2}$, $\overline{\mathrm{A_2B_2}}=\dfrac{1-2t}{\sqrt{1-t+t^2}}$, $r=\dfrac{(1-2t)^2}{t^2-t+1}$, $\dfrac{1}{1-r}=3$.
    steps:
    - {id: 3a, content: '$\dfrac{1-t+t^2}{3t(1-t)}=3\iff10t^2-10t+1=0$, $0<t<\tfrac12$에서 $t=\dfrac{5-\sqrt{15}}{10}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 한 변의 길이를 1로 두고 코사인법칙으로 $\overline{\mathrm{A_1B_1}'}$을 구하자.
    - 삼각형 $\mathrm{A_1B_1B_1}'$과 $\mathrm{B_1B_2B_1}'$은 닮음이다.
    - 같은 과정을 반복하므로 $s_{n+1}=rs_n$이다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드9 p.104 예시답안 3
    steps:
    - id: 3b-1
      content: |
        두 정삼각형의 넓이의 비 $r$을 구하는 것이므로 정삼각형 $\mathrm{A_1B_1C_1}$의 한 변의 길이를 1이라 가정해도 좋다. 그러면 $s_1=\dfrac{\sqrt3}{4}$이고 $\overline{\mathrm{A_1B_1}}=1$, $\overline{\mathrm{B_1B_1}'}=t$이다. 코사인법칙에 의해 $\overline{\mathrm{A_1B_1}'}^2=1^2+t^2-2\times1\times t\times\cos\dfrac\pi3$이고, 정리하면 $\overline{\mathrm{A_1B_1}'}=\sqrt{1-t+t^2}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        삼각형 $\mathrm{A_1B_1B_1}'$과 $\mathrm{B_1B_2B_1}'$은 닮은 삼각형이므로
        $$\frac{\overline{\mathrm{B_1B_2}}}{\overline{\mathrm{B_1B_1}'}}=\frac{\overline{\mathrm{A_1B_1}}}{\overline{\mathrm{A_1B_1}'}}\Rightarrow\overline{\mathrm{B_1B_2}}=\frac{t}{\sqrt{1-t+t^2}},\qquad\frac{\overline{\mathrm{B_1}'\mathrm{B_2}}}{\overline{\mathrm{B_1B_1}'}}=\frac{\overline{\mathrm{B_1B_1}'}}{\overline{\mathrm{A_1B_1}'}}\Rightarrow\overline{\mathrm{B_1}'\mathrm{B_2}}=\frac{t^2}{\sqrt{1-t+t^2}}.$$
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        삼각형 $\mathrm{A_1A_1}'\mathrm{A_2}$와 $\mathrm{B_1B_1}'\mathrm{B_2}$는 합동이므로 $\overline{\mathrm{A_1A_2}}=\overline{\mathrm{B_1B_2}}=\dfrac{t}{\sqrt{1-t+t^2}}$이고
        $$\overline{\mathrm{A_2B_2}}=\overline{\mathrm{A_1B_1}'}-\overline{\mathrm{A_1A_2}}-\overline{\mathrm{B_2B_1}'}=\sqrt{1-t+t^2}-\frac{t}{\sqrt{1-t+t^2}}-\frac{t^2}{\sqrt{1-t+t^2}}=\frac{1-2t}{\sqrt{1-t+t^2}}.$$
        (원 해설의 「삼각형 $\mathrm{A_1A_1}'\mathrm{A_2}'$」은 $\mathrm{A_1A_1}'\mathrm{A_2}$의 오기로 보고 고쳐 적음.)
      criteria: ['3.M1']
    - id: 3b-4
      content: |
        $s_2=\dfrac{\sqrt3}{4}\left(\dfrac{1-2t}{\sqrt{1-t+t^2}}\right)^2=\dfrac{(1-2t)^2}{1-t+t^2}s_1$이므로 $r=\dfrac{(1-2t)^2}{t^2-t+1}$이다.
      criteria: ['3.M1']
    - id: 3b-5
      content: |
        모든 자연수 $n$에 대하여 $s_{n+1}=rs_n$이 성립하므로 $\sum s_n$은 공비가 $r$인 등비급수이고, $0<t<\dfrac12$일 때 $0<r<1$이다.
        $$\sum_{n=1}^{\infty}s_n=\frac{s_1}{1-r}=\frac{1-t+t^2}{3t(1-t)}s_1=3s_1$$
        을 만족시키는 $t$의 값은 $10t^2-10t+1=0$, $0<t<\dfrac12$에서 $t=\dfrac{5-\sqrt{15}}{10}=\dfrac12-\dfrac{\sqrt{15}}{10}$이다.
      criteria: ['3.A1']
