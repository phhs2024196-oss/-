intent: |
  수학·수학Ⅰ·수학Ⅱ·미적분의 다항식, 이차함수, 삼각함수, 다항함수의 적분, 등비급수 단원의 기본 내용을 바탕으로, 평행이동과 정적분으로 넓이를 구하고, 이차함수의 최소로 넓이가 최소인 값을 찾으며, 코사인법칙으로 변의 길이를 구해 등비급수를 분석할 수 있는지 본다.
key_idea: |
  1.은 $g(-x)=-g(x)$의 계수 비교로 $m,n$을 정하고, 2.는 $\mathrm{R}$에서 $\mathrm{BC}$에 내린 수선으로 $\triangle\mathrm{PBQ}\equiv\triangle\mathrm{QHR}$을 만들어 넓이를 이차식으로, 3.은 코사인법칙과 닮음으로 $\overline{\mathrm{A_2B_2}}=\dfrac{1-2t}{\sqrt{1-t+t^2}}$을 얻어 공비 $r$인 등비급수로 본다.
stuck: |
  2.에서 직각이등변 조건을 합동인 두 직각삼각형으로 바꾸는 보조선, 3.에서 $\triangle\mathrm{A_1B_1B_1'}\sim\triangle\mathrm{B_1B_2B_1'}$을 찾고 $\overline{\mathrm{A_2B_2}}=\overline{\mathrm{A_1B_1'}}-\overline{\mathrm{A_1A_2}}-\overline{\mathrm{B_2B_1'}}$로 나누는 것
