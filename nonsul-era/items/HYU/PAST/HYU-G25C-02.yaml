  - '상수 묶기 $a=2f''(0)$, $b=2f(0)-\int_0^{\pi/2}e^tf''''(t)\,dt$'
  - '$\int(\sin x+3\cos x)e^{2x}\,dx=e^{2x}(\sin x+\cos x)+C$ (부분적분 반복)'
  - '$p(x)=ax^4+bx^3+cx^2+dx+k$ 대입 후 계수 비교'
