  - '$[0,1]$에서 증가하는 $q=p$의 역함수 $r$, $x$축·$y$축·$y=1$·$y=r(x)$로 둘러싸인 넓이 $\tfrac{159}{5}$'
  concepts:
  - 정적분으로 정의된 함수
  - 부분적분법
