stimuli:
- label: 가
  body: |
    실수 전체의 집합에서 두 번 미분가능하고 이계도함수가 연속인 함수 $f(x)$가 모든 실수 $x$에 대하여
    $$f(x)=e^x(3\sin x-\cos x)+2\int_0^xf''(t)(x-t)\,dt+\int_0^{\frac\pi2}e^tf''(t)\,dt$$
    를 만족시킨다.
- label: 나
  body: |
    함수 $p(x)$가 다음 조건을 만족시킨다.
    (ㄱ) 함수 $p(x)$는 사차함수이다.
    (ㄴ) 모든 실수 $x$에 대하여
    $$p(x)=4x^4+\int_0^xp''(t)(3x-5t)\,dt+\frac32\int_0^2tp(t)\,dt$$
    이다.
    (ㄷ) 함수 $p(x)$가 닫힌구간 $[0,1]$에서 증가한다.
    (ㄹ) 닫힌구간 $[0,1]$에서 함수 $q(x)$를 $q(x)=p(x)$로 정의하자.
    함수 $q(x)$의 역함수를 $r(x)$라 할 때, $x$축, $y$축, 직선 $y=1$과 곡선 $y=r(x)$ $(q(0)\le x\le q(1))$로 둘러싸인 도형의 넓이는 $\dfrac{159}{5}$이다.

stem: |
  [문제 2] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    $f(0)$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '1 - 2*exp(pi)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 부분적분으로 $f(x)=-e^x(3\sin x-\cos x)+ax+b$, $x=0$ 대입으로 $a=4$, 적분 상수 조건으로 $b=-2e^\pi$.
    steps:
    - {id: 1a, content: '$f(0)=1+b=1-2e^\pi$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $\int_0^xf''(t)(x-t)\,dt$를 부분적분하자.
    - $f(0)$, $f'(0)$, $\int_0^{\pi/2}e^tf''(t)\,dt$는 모두 상수이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드10 p.108~109 예시답안 1
    steps:
    - id: 1b-1
      content: |
        부분적분법을 이용하면
        $$\int_0^xf''(t)(x-t)\,dt=\left[(-t+x)f'(t)\right]_0^x+\int_0^xf'(t)\,dt=-f'(0)x+f(x)-f(0)$$
        이므로 <가>의 조건에서 $f(x)=-e^x(3\sin x-\cos x)+2f'(0)x+2f(0)-\int_0^{\frac\pi2}e^tf''(t)\,dt$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $a=2f'(0)$, $b=2f(0)-\int_0^{\frac\pi2}e^tf''(t)\,dt$라 하면 $f(x)=-e^x(3\sin x-\cos x)+ax+b$ ㉠이고, 미분하면 $f'(x)=-e^x(4\sin x+2\cos x)+a$ ㉡, $f''(x)=-2e^x(\sin x+3\cos x)$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        ㉠에 $x=0$을 대입하면 $f(0)=1+b$, ㉡에 $x=0$을 대입하면 $f'(0)=-2+a$이므로 $a=2f'(0)=-4+2a$, 따라서 $a=4$이다.
      criteria: ['1.M1']
    - id: 1b-4
      content: |
        부분적분법으로 $h(x)=(\sin x+3\cos x)e^{2x}$의 부정적분을 구하면
        $$\int h(x)\,dx=\frac12(\sin x+3\cos x)e^{2x}+\frac14\left\{(-\cos x+3\sin x)e^{2x}-\int h(x)\,dx\right\}$$
        에서 $\int h(x)\,dx=e^{2x}(\sin x+\cos x)+C$ ㉢이다. $e^xf''(x)=-2h(x)$이므로 ㉢에 의하여
        $$b=2f(0)+2\int_0^{\frac\pi2}h(t)\,dt=2(1+b)+2(e^\pi-1)=2b+2e^\pi$$
        이고 $b=-2e^\pi$, $f(0)=1-2e^\pi$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2025 선행학습 영향평가 보고서 문항카드10 p.108~109 [별해]
    key_idea: $\int_0^xf''(t)(x-t)\,dt=x\int_0^xf''(t)\,dt-\int_0^xtf''(t)\,dt$를 곱의 미분법으로 미분하면 $f'(x)-f'(0)$.
    steps:
    - id: 1c-1
      content: |
        $\dfrac{d}{dx}\int_0^xf''(t)(x-t)\,dt=\int_0^xf''(t)\,dt=f'(x)-f'(0)$이므로 <가>를 미분하면 $f'(x)=e^x(4\sin x+2\cos x)+2f'(x)-2f'(0)$, 즉 $f'(x)=-e^x(4\sin x+2\cos x)+2f'(0)$ ㉡'. $x=0$을 대입하면 $f'(0)=2$이므로 $f'(x)=-e^x(4\sin x+2\cos x)+4$.
      criteria: ['1.M1']
    - id: 1c-2
      content: |
        양변을 적분하면 $f(x)=-e^x(3\sin x-\cos x)+4x+b$이므로
        $$1+b=f(0)=-1+\int_0^{\frac\pi2}e^tf''(t)\,dt=-1-2\int_0^{\frac\pi2}h(t)\,dt=-1-2(e^\pi-1)=1-2e^\pi$$
        이고 $b=-2e^\pi$, $f(0)=1-2e^\pi$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        부분적분(또는 미분)으로 함수 $f'(x)=-e^x(4\sin x+2\cos x)+4$를 구했다(채점기준 20/40).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1b-3, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $\int_0^{\pi/2}e^tf''(t)\,dt$를 계산해 $f(0)=1-2e^\pi$를 구했다(채점기준 20/40).
      depends_on: ['1.M1']
      steps: [1b-4, 1c-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    제시문 <나>의 조건 중 (ㄱ), (ㄴ)만을 이용하여 $\displaystyle\int_0^3p(x)\,dx$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '123/5', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 부분적분 후 미분해 계수 비교하면 $x^3$·$x$의 계수 $0$, $x^4$의 계수 $1$, 상수항 $k=-(3c+8)$. $\int_0^3$에서 $c$가 소거된다.
    steps:
    - {id: 2a, content: '$\int_0^3(x^4+cx^2-(3c+8))\,dx=\dfrac{243}{5}+9c-(9c+24)=\dfrac{123}{5}$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $\int_0^xp''(t)(3x-5t)\,dt$를 부분적분하자.
    - $x=0$을 대입하면 $p(0)$은 무엇과 같은가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드10 p.109~110 예시답안 2
    steps:
    - id: 2b-1
      content: |
        부분적분법을 이용하면 $\displaystyle\int_0^xp''(t)(3x-5t)\,dt=\left[(-5t+3x)p'(t)\right]_0^x+5\int_0^xp'(t)\,dt=-(2p'(x)+3p'(0))x+5p(x)-5p(0)$이므로, <나>의 (ㄴ)으로부터
        $$4p(x)=-4x^4+(2p'(x)+3p'(0))x+5p(0)-\frac32\int_0^2tp(t)\,dt\ \cdots\text{㉠},\qquad p(0)=\frac32\int_0^2tp(t)\,dt.$$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        (ㄱ)에 의하여 $p(x)=ax^4+bx^3+cx^2+dx+k\ (a\ne0)$라 하면 $p'(x)=4ax^3+3bx^2+2cx+d$, $p''(x)=12ax^2+6bx+2c$ ㉡이다. ㉠의 양변을 미분하면 $2p'(x)=-16x^3+2p''(x)x+3p'(0)$ ㉢이고, $x=0$을 대입하면 $2p'(0)=3p'(0)$이므로 $d=p'(0)=0$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        ㉢에 ㉡을 대입하면 $8ax^3+6bx^2+4cx=(-16+24a)x^3+12bx^2+4cx$이므로 $8a=-16+24a$, $6b=12b$, 즉 $a=1$, $b=0$이다.
      criteria: ['2.M1']
    - id: 2b-4
      content: |
        $p(x)=x^4+cx^2+k$를 $k=\dfrac32\int_0^2tp(t)\,dt$에 대입하면 $k=\dfrac32\left[\dfrac16t^6+\dfrac c4t^4+\dfrac k2t^2\right]_0^2=16+6c+3k$이므로 $k=-(3c+8)$, 즉 $p(x)=x^4+cx^2-(3c+8)$ ($c$는 상수)이다.
      criteria: ['2.M2']
    - id: 2b-5
      content: |
        $$\int_0^3p(x)\,dx=\left[\frac15x^5+\frac c3x^3-(3c+8)x\right]_0^3=\frac{243}{5}+9c-(9c+24)=\frac{123}{5}.$$
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        사차함수 $p(x)$의 $x^3$의 계수와 $x$의 계수가 $0$임을 확인했다(채점기준 10/30).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2, 2b-3]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: |
        $x^2$의 계수 $c$와 상수항 사이의 관계식 $k=-(3c+8)$을 구했다(채점기준 10/30).
      depends_on: []
      implied_ok: false
      steps: [2b-4]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $\int_0^3p(x)\,dx=\dfrac{123}{5}$을 구했다(채점기준 10/30).
      depends_on: ['2.M1', '2.M2']
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $p(1)$의 값을 구하시오.
  points: 15
  depends_on: ['2']
  answer: {kind: value, value: '-25', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: (ㄷ)에서 $c>-1$, $[0,1]$에서 $p<0$이므로 역함수 영역의 넓이 $=-\int_0^1p=\dfrac{39}{5}+\dfrac{8c}{3}=\dfrac{159}{5}$, $c=9$.
    steps:
    - {id: 3a, content: '$p(x)=x^4+9x^2-35$, $p(1)=-25$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - $p(0)$, $p(1)$을 $c$로 나타내고 (ㄷ)을 쓰자.
    - 역함수의 그래프는 $y=x$에 대칭이다. 넓이를 $p$의 적분으로 바꾸자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2025 선행학습 영향평가 보고서 문항카드10 p.110 예시답안 3
    steps:
    - id: 3b-1
      content: |
        $p(x)=x^4+cx^2-(3c+8)$에 $x=0$ 또는 $1$을 대입하면 $p(0)=-(3c+8)$, $p(1)=-(2c+7)$이다. (ㄷ)으로부터 $-3c-8=p(0)<p(1)=-2c-7$이므로 $c>-1$이고, $0<x<1$이면 $p(0)<p(x)<p(1)=-2c-7<-5<0$ ㉠이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
