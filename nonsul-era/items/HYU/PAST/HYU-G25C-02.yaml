intent: |
  수학의 역함수, 수학Ⅱ·미적분의 미분법과 적분법(이계도함수, 삼각함수의 미분법, 부분적분법, 넓이와 적분)에 대한 전반적인 지식을 평가한다. 정적분으로 나타내어진 함수에서 $f$와 사차함수 $p$를 결정하고, 함수의 증가와 역함수 그래프의 대칭으로 넓이 조건을 해석한다.
key_idea: |
  $\int_0^xf''(t)(x-t)\,dt=f(x)-f(0)-f'(0)x$ (부분적분)로 $f(x)=-e^x(3\sin x-\cos x)+ax+b$ 꼴을 얻고, $p$는 미분한 식의 계수 비교로 $p(x)=x^4+cx^2-(3c+8)$이 된다. 역함수 영역의 넓이는 $y=x$ 대칭으로 $\left|\int_0^1p(x)\,dx\right|$와 같다.
stuck: |
  적분 안의 $x$를 밖으로 빼거나 부분적분해 미지수 $f(0)$, $f'(0)$, $\int_0^{\pi/2}e^tf''(t)\,dt$를 상수로 다루는 것, 3.에서 $p(0)<p(x)<p(1)<0$으로 넓이의 부호를 정하는 것
idea_tags: [IDEA-INTEGRAL-EQUATION-DIFFERENTIATE, IDEA-INVERSE-AREA-SYMMETRY]
tags: [정적분으로 정의된 함수, 부분적분, 이계도함수, 역함수, 넓이, 배점환산]
