  - '(ㄷ) 증가에서 $p(0)<p(1)$ ⇒ $c>-1$, 이때 $[0,1]$에서 $p(x)<0$'
  - '넓이 $=-\int_0^1p(x)\,dx=\tfrac{159}{5}$'
  stimuli_used: [가, 나]
