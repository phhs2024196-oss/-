intent: |
  수학Ⅰ 삼각함수 단원의 사인법칙·코사인법칙, 수학Ⅰ 수열 단원의 여러 가지 수열의 합, 수학 경우의 수(곱의 법칙), 수학Ⅱ 정적분의 개념을 이해하고 활용할 수 있는지 본다. 넓이로 $\sin A$를 얻어 나머지 변과 내접원의 반지름을 구하고, 조건을 만족하는 함수의 개수를 여사건으로 세어 거듭제곱의 합으로 비를 구하며, $4\sin\frac{(2n-1)\pi}{6}$가 가질 수 있는 값을 파악해 정적분 조건을 만족하는 $n$의 개수를 센다.
key_idea: |
  1은 $\sin A=\frac{2S}{bc}$와 코사인법칙, $S=\frac12(a+b+c)r$. 2는 $a_n=n^3-(\text{짝수 개수})(\text{홀수 개수})n$을 $n$의 홀짝으로 나눔. 3은 $c=4\sin\frac{(2n-1)\pi}{6}\in\{-4,-2,2,4\}$로 경우를 나누고 $x^3-3x+2$의 $[\frac12,2]$에서의 범위와 비교.
stuck: |
  2에서 '또는' 조건을 여사건($f(a)$ 짝수이고 $f(b)$ 홀수)으로 바꾸고 $n$의 홀짝에 따라 $a_n$을 나누는 것, 3에서 $c=2$일 때 피적분함수의 부호가 $x=\sqrt3$에서 바뀌는 것
idea_tags: [IDEA-AREA-SINE-INRADIUS, IDEA-COMPLEMENT-COUNT, IDEA-PERIODIC-CASE-SPLIT]
tags: [사인법칙, 코사인법칙, 내접원, 여사건, 거듭제곱의 합, 절댓값 정적분, 배점환산]
