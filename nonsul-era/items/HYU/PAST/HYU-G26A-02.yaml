  - '$t=\frac14$에서 $g=0$, 가속도 $(0,1)$ ⇒ $g''(\frac14)=1$; $g\ge0$ ⇒ $g''(\frac14)=0$'
  - '$x\ge0$에서 $f''(x)>0$, $g(1)\ge0$로 해 선택'
