intent: |
  고등학교 수학 과정의 지식을 적절히 활용해 논리적으로 결론에 도달하는지 본다. 지수·삼각함수의 미분과 성질로 $F(x)=\int_0^xf(t)dt$의 그래프 개형을 파악해 $\lvert\int_a^xf\rvert$가 미분가능한 $a$를 모두 구하고, 원과 직선의 위치 관계와 함수의 극한의 대소 관계로 두 현 사이 넓이의 극한을 구하며, 합성함수의 미분법·이계도함수·속도와 가속도로 삼차함수 $f$를 결정한다.
key_idea: |
  1은 $h(x)=F(x)-F(a)$가 $h(a)=0$이므로 $y=F(a)$와 $y=F(x)$의 모든 교점에서 $f=0$이어야 함. 2는 넓이를 두 직사각형 사이에 끼워 넣음. 3은 $h=f\circ g$를 두 번 미분하고 속력 최대 조건 $g'(1)g''(1)=0$을 쓴다.
stuck: |
  1에서 $F(2\pi)>0=F(0)$임을 $(e^t-\cos t)^{2026}$의 증가성과 $\sin(t+\pi)=-\sin t$로 보이는 것, 2에서 넓이를 직사각형으로 위아래 평가하는 것, 3에서 점 P가 $x$축 위($g=0$)이고 $g\ge0$이므로 $g'(\frac14)=0$임을 읽는 것
