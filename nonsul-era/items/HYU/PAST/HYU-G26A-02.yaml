  - '$g(x)=\left\lvert\int_a^xf(t)dt\right\rvert$'
  - '원 $x^2+y^2=1$과 평행한 두 직선 $y=a(x-1)$, $y=a(x-1)+k$로 둘러싸인 넓이 $S(k)$'
  - '점 $\mathrm{P}(t,g(t))$의 운동, $h(t)=f(g(t))$, 최고차항 계수 1인 삼차함수 $f$'
  concepts: [정적분으로 정의된 함수, 미분가능성, 함수의 그래프 개형, 점과 직선 사이의 거리, 함수의 극한의 대소 관계, 합성함수의 미분법, 이계도함수, 속도와 가속도]
  tools:
  - '$F(x)=\int_0^xf$의 증감표와 우함수성 $F(-x)=F(x)$'
  - '$s(t)=e^t-\cos t$의 증가성, 평행이동 $t\to t+\pi$'
  - '직사각형 $\mathrm{PBCQ}\subset$ 영역 $\subset\mathrm{ARSD}$, 조임정리'
