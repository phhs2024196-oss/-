  - '$y_{k+1}=\frac18y_k+35$ 반복, $8^4$ 곱하기'
  - '$g=f''$ 부호 조건, $\sin2t=2\sin t\cos t$'
  - '$\sin(x+\pi)=-\sin x$, $\lvert\sin2x\rvert$ 주기 $\frac\pi2$'
