intent: |
  수학Ⅰ·수학Ⅱ·미적분의 지수함수와 로그함수, 수열, 미분, 적분 단원의 기본 내용을 바탕으로 논리적으로 결론에 도달하는지 본다. 지수·로그의 관계로 점의 $x$좌표를 구해 지수함수의 정적분으로 넓이를 구하고, $y_k$와 $y_{k+1}$ 사이의 귀납적 관계식으로 $y_1$을 구하며, 그래프와 삼각함수의 덧셈정리·적분으로 $\int_0^{2026\pi}\lvert f'(x)\rvert dx$의 최솟값을 구한다.
key_idea: |
  1은 $2^{s_1-3}+35=2^{s_1-1}$에서 $2^{s_1}=\frac{280}{3}$. 2는 $y_{k+1}=2^{\log_2y_k-3}+35=\frac18y_k+35$. 3은 $f'(t)=g(t)=a\sin t+b\lvert\sin2t\rvert$의 부호가 $(0,\pi)$, $(\pi,2\pi)$에서 각각 일정할 조건 $\lvert a\rvert\ge2\lvert b\rvert$ ($a\ne0$)와 $\int_0^{2\pi}\lvert g\rvert=4\lvert a\rvert$.
stuck: |
  3에서 단조 조건을 $g(t)=f'(t)$의 부호 조건으로 바꾸고, $a\sin t\le2b\sin t\cos t$를 $\sin t$의 부호로 나누어 $a\ge2b\cos t$ ⇒ $a\ge2b$로 정리하는 것
idea_tags: [IDEA-EXP-LOG-INVERSE-POINTS, IDEA-RECURRENCE-AFFINE, IDEA-MONOTONE-SIGN-CONDITION]
tags: [지수함수, 로그함수, 귀납적 정의, 등비수열의 합, 절댓값 적분, 경우 나누기, 배점환산]
