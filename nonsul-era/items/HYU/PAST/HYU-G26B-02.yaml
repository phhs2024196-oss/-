stimuli:
- label: 가
  body: |
    [그림: 사면체 $\mathrm{ABCD}$ — 꼭짓점 $\mathrm{A}$ 위, $\mathrm{B}$ 왼쪽, $\mathrm{C}$ 오른쪽 아래, $\mathrm{D}$ 오른쪽 뒤. 면 $\mathrm{BCD}$ 안에 점 $\mathrm{O}$, 변 $\mathrm{CD}$ 위에 점 $\mathrm{P}$, 선분 $\mathrm{AO}$, $\mathrm{AP}$, $\mathrm{OP}$, $\mathrm{OD}$가 점선으로 그려져 있다.]
    오른쪽 그림과 같이 $\overline{\mathrm{AB}}=\overline{\mathrm{AC}}=\overline{\mathrm{AD}}=a$이고 $\overline{\mathrm{BC}}=\overline{\mathrm{CD}}=\overline{\mathrm{DB}}=6$인 사면체 $\mathrm{ABCD}$가 있다.
    점 $\mathrm{A}$에서 삼각형 $\mathrm{BCD}$에 내린 수선의 발을 $\mathrm{O}$, 점 $\mathrm{O}$를 지나고 직선 $\mathrm{BC}$에 평행한 직선이 선분 $\mathrm{CD}$와 만나는 점을 $\mathrm{P}$라 하자. (단, $a>2\sqrt3$)
- label: 나
  body: |
    [그림: 사면체 $\mathrm{ABCD}$ 안에 정육면체 $\mathrm{EFGH-IJKL}$ — 아랫면 $\mathrm{IJKL}$은 면 $\mathrm{BCD}$ 위, 윗면 $\mathrm{EFGH}$의 $\mathrm{E}$, $\mathrm{F}$는 앞쪽(면 $\mathrm{ABC}$ 쪽), $\mathrm{G}$, $\mathrm{H}$는 뒤쪽]
    제시문 <가>에서 주어진 사면체 $\mathrm{ABCD}$에 대하여 정육면체 $\mathrm{EFGH-IJKL}$은 다음 조건을 만족시킨다.
    (1) 정사각형 $\mathrm{IJKL}$은 면 $\mathrm{BCD}$에 포함되고, 직선 $\mathrm{IJ}$와 직선 $\mathrm{BC}$는 서로 평행하다.
    (2) 선분 $\mathrm{EF}$는 면 $\mathrm{ABC}$에 포함된다.
    (3) 점 $\mathrm{G}$는 면 $\mathrm{ACD}$에, 점 $\mathrm{H}$는 면 $\mathrm{ABD}$에 포함된다.

stem: |
  [문제 2] 다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    네 삼각형 $\mathrm{DOP}$, $\mathrm{AOD}$, $\mathrm{AOP}$, $\mathrm{APD}$의 넓이의 곱을 $a$에 관한 식으로 표현하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '12*(a**2 - 12)*sqrt(a**2 - 9)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\triangle\mathrm{DOP}=2\sqrt3$, $\triangle\mathrm{AOD}=\sqrt{3(a^2-12)}$, $\triangle\mathrm{AOP}=\sqrt{a^2-12}$, $\triangle\mathrm{APD}=\frac23\triangle\mathrm{ABC}=2\sqrt{a^2-9}$.
    steps:
    - {id: 1a, content: '곱 $=12(a^2-12)\sqrt{a^2-9}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $\mathrm{O}$는 삼각형 $\mathrm{BCD}$의 어떤 점인가?
    - $\mathrm{D}$에서 $\mathrm{BC}$에 내린 수선의 발 $\mathrm{M}$을 생각하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 선행학습 영향평가 보고서 문항카드8 p.111~112 예시답안 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{O}$에서 $\mathrm{B}$, $\mathrm{C}$, $\mathrm{D}$까지의 거리가 모두 같으므로 $\mathrm{O}$는 삼각형 $\mathrm{BCD}$의 외심이고, 정삼각형이므로 무게중심이다. $\mathrm{D}$에서 $\mathrm{BC}$에 내린 수선의 발을 $\mathrm{M}$이라 하면 직선 $\mathrm{AO}$와 $\mathrm{DM}$은 수직이고 $\mathrm{O}$에서 만난다. 삼수선의 정리에 의해 $\mathrm{AM}\perp\mathrm{BC}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\overline{\mathrm{DM}}=3\sqrt3$이고 $\overline{\mathrm{DM}}:\overline{\mathrm{DO}}=\overline{\mathrm{DC}}:\overline{\mathrm{DP}}=\overline{\mathrm{MC}}:\overline{\mathrm{OP}}=3:2$이므로 $\overline{\mathrm{DO}}=2\sqrt3$, $\overline{\mathrm{DP}}=4$, $\overline{\mathrm{OP}}=2$. $\overline{\mathrm{OM}}=\sqrt3$, $\overline{\mathrm{AM}}=\sqrt{a^2-9}$, $\overline{\mathrm{AO}}=\sqrt{a^2-12}$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\triangle\mathrm{DOP}=\frac12\times2\sqrt3\times2=2\sqrt3$, $\triangle\mathrm{AOD}=\sqrt{3(a^2-12)}$, $\triangle\mathrm{AOP}=\sqrt{a^2-12}$, $\triangle\mathrm{APD}=\frac23\triangle\mathrm{ACD}=\frac23\triangle\mathrm{ABC}=\frac23\times\frac12\times\overline{\mathrm{AM}}\times\overline{\mathrm{BC}}=2\sqrt{a^2-9}$이므로 곱은 $12(a^2-12)\sqrt{a^2-9}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        삼수선의 정리로 $\mathrm{AM}\perp\mathrm{BC}$ 등 공간도형 구조($\mathrm{O}$=무게중심)를 밝혔다(공식 10점 → 5).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        네 삼각형의 넓이와 곱 $12(a^2-12)\sqrt{a^2-9}$를 구했다(공식 20점 → 10).
      depends_on: [1.M1]
      steps: [1b-2, 1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    평면 $\mathrm{ACD}$가 평면 $\mathrm{EFGH}$와 이루는 예각의 크기를 $\theta_1$, 평면 $\mathrm{ACD}$가 평면 $\mathrm{FJKG}$와 이루는 예각의 크기를 $\theta_2$, 평면 $\mathrm{ACD}$가 평면 $\mathrm{EIJF}$와 이루는 예각의 크기를 $\theta_3$이라 하자.
    $\theta_1$, $\theta_2$, $\theta_3$ 중 가장 작은 것을 $\theta$라 할 때, $\cos\theta=\dfrac{\sqrt6}{3}$이 되도록 하는 $a$의 값을 모두 구하시오.
  points: 15
  depends_on: ['1']
  answer: {kind: set, value: '{3*sqrt(6)/2, 6}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\cos\theta_1=\frac{\sqrt3}{\sqrt{a^2-9}}$, $\cos\theta_2=\frac{\sqrt{3(a^2-12)}}{2\sqrt{a^2-9}}$, $\cos\theta_3=\frac{\sqrt{a^2-12}}{2\sqrt{a^2-9}}$; $a<4$이면 $\theta=\theta_1$, $a\ge4$이면 $\theta=\theta_2$.
    steps:
    - {id: 2a, content: '$a^2-9=\frac92\Rightarrow a=\frac{3\sqrt6}{2}$; $24(a^2-9)=27(a^2-12)\Rightarrow a=6$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 삼각형 $\mathrm{APD}$를 세 평면에 정사영하면 어떤 삼각형이 되는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 선행학습 영향평가 보고서 문항카드8 p.112 예시답안 2
    steps:
    - id: 2b-1
      content: |
        $\theta$가 가장 작으므로 $\cos\theta$는 $\cos\theta_1$, $\cos\theta_2$, $\cos\theta_3$ 중 가장 큰 것이다.
        $\cos\theta_1=\dfrac{\triangle\mathrm{DOP}}{\triangle\mathrm{APD}}=\dfrac{\sqrt3}{\sqrt{a^2-9}}$, $\cos\theta_2=\dfrac{\triangle\mathrm{AOD}}{\triangle\mathrm{APD}}=\dfrac{\sqrt{3(a^2-12)}}{2\sqrt{a^2-9}}$, $\cos\theta_3=\dfrac{\triangle\mathrm{AOP}}{\triangle\mathrm{APD}}=\dfrac{\sqrt{a^2-12}}{2\sqrt{a^2-9}}$ (평면 $\mathrm{EFGH}\parallel\mathrm{BCD}$, $\mathrm{FJKG}\parallel\mathrm{AOD}$, $\mathrm{EIJF}\parallel\mathrm{AOP}$).
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 $\cos\theta_2>\cos\theta_3$이다. 한편 $\cos\theta_1>\cos\theta_2\iff2>\sqrt{a^2-12}\iff a<4$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        (i) $2\sqrt3<a<4$일 때 $\dfrac{\sqrt6}{3}=\cos\theta_1=\dfrac{\sqrt3}{\sqrt{a^2-9}}$이므로 $a^2-9=\dfrac92$, $a=\dfrac{3\sqrt6}{2}$.
        (ii) $a\ge4$일 때 $\dfrac{\sqrt6}{3}=\cos\theta_2$이므로 $24(a^2-9)=27(a^2-12)$, $a=6$.
        따라서 $a=\dfrac{3\sqrt6}{2}$ 또는 $a=6$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: |
        $\cos\theta_1$, $\cos\theta_2$, $\cos\theta_3$을 구했다(공식 15점 → 8).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 8}
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 7
      evidence: |
        대소 비교로 경우를 나누어 $a=\frac{3\sqrt6}{2}$, $a=6$을 모두 구했다(공식 15점 → 7).
      depends_on: [2.M1]
      steps: [2b-2, 2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $a=4$일 때 정사각형 $\mathrm{EIJF}$의 평면 $\mathrm{ACD}$ 위로의 정사영의 넓이를 구하시오.
  points: 20
  depends_on: ['2']
  answer: {kind: value, value: '(351*sqrt(7) - 108*sqrt(21))/847', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 정육면체 한 변 $x=\frac{3\sqrt3}{2\sqrt3+1}=\frac{18-3\sqrt3}{11}$, $\cos\theta_3=\frac{1}{\sqrt7}$이므로 넓이 $x^2\cos\theta_3$.
    steps:
    - {id: 3a, content: '$\left(\frac{18-3\sqrt3}{11}\right)^2\times\frac1{\sqrt7}=\frac{351\sqrt7-108\sqrt{21}}{847}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 평면 $\mathrm{EFGH}$로 사면체를 자른 단면은 어떤 도형인가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2026 선행학습 영향평가 보고서 문항카드8 p.112~113 예시답안 3
    steps:
    - id: 3b-1
      content: |
        평면 $\mathrm{EFGH}$가 선분 $\mathrm{AB}$, $\mathrm{AC}$, $\mathrm{AD}$와 만나는 점을 $\mathrm{B'}$, $\mathrm{C'}$, $\mathrm{D'}$, 선분 $\mathrm{AM}$과 $\mathrm{B'C'}$의 교점을 $\mathrm{M'}$이라 하자. 정육면체의 한 변을 $x$라 하면 삼각형 $\mathrm{B'C'D'}$이 정삼각형이므로 $\overline{\mathrm{M'D'}}=\left(1+\frac{\sqrt3}{2}\right)x$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\mathrm{M'}$에서 $\mathrm{DM}$에 내린 수선의 발을 $\mathrm{N}$이라 하면 삼수선의 정리에 의해 $\mathrm{MN}\perp\mathrm{BC}$이므로 $\mathrm{N}$은 선분 $\mathrm{MO}$ 위의 점이다. 삼각형 $\mathrm{AMO}\sim\mathrm{M'MN}$이므로 $\overline{\mathrm{M'M}}:\overline{\mathrm{M'N}}=\overline{\mathrm{AM}}:\overline{\mathrm{AO}}=\sqrt7:2$에서 $\overline{\mathrm{M'M}}=\frac{\sqrt7}{2}x$, $\overline{\mathrm{AM'}}=\sqrt7\left(1-\frac x2\right)$이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        삼각형 $\mathrm{AMD}\sim\mathrm{AM'D'}$이므로 $\sqrt7\left(1-\frac x2\right):\left(1+\frac{\sqrt3}{2}\right)x=\overline{\mathrm{AM}}:\overline{\mathrm{MD}}=\sqrt7:3\sqrt3$. 즉 $\left(1+\frac{\sqrt3}{2}\right)x=3\sqrt3\left(1-\frac x2\right)$이고 $x=\dfrac{3\sqrt3}{2\sqrt3+1}=\dfrac{18-3\sqrt3}{11}$이다.
      criteria: ['3.M1']
    - id: 3b-4
      content: |
        $a=4$에서 $\cos\theta_3=\frac{1}{\sqrt7}$이므로 정사영의 넓이는 $x^2\cos\theta_3=\left(\dfrac{18-3\sqrt3}{11}\right)^2\times\dfrac1{\sqrt7}=\dfrac{351\sqrt7-108\sqrt{21}}{847}$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        단면 정삼각형과 닮음으로 정육면체 한 변 $x=\frac{18-3\sqrt3}{11}$, 즉 정사각형 $\mathrm{EIJF}$의 넓이 $x^2$을 구했다(공식 20점 → 10).
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3b-2, 3b-3, 3a]
    - id: 3.A1
      mark_type: A
      points: 10
      evidence: |
        $\cos\theta_3=\frac{1}{\sqrt7}$을 곱해 정사영의 넓이 $\frac{351\sqrt7-108\sqrt{21}}{847}$을 구했다(공식 20점 → 10).
      depends_on: [3.M1]
      ft: {allowed: true, from: [2.M1], max_points: 10}
      steps: [3b-4, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

