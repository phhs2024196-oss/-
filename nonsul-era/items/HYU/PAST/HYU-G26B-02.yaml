intent: |
  기하의 공간도형 단원(직선과 평면의 위치 관계, 삼수선의 정리, 정사영)의 주요 내용을 다룬다. 삼수선의 정리로 사면체의 구조를 파악해 네 삼각형의 넓이를 구하고, 공간에서 두 평면이 이루는 각의 크기를 정사영 넓이의 비로 계산하며, 정사각형의 넓이와 그 정사영의 넓이를 구할 수 있는지 본다.
key_idea: |
  $\mathrm{O}$는 정삼각형 $\mathrm{BCD}$의 무게중심, $\overline{\mathrm{DO}}=2\sqrt3$, $\overline{\mathrm{OP}}=2$, $\overline{\mathrm{AO}}=\sqrt{a^2-12}$. 삼각형 $\mathrm{APD}$를 평면 $\mathrm{BCD}$, $\mathrm{AOD}$, $\mathrm{AOP}$에 정사영하면 $\mathrm{DOP}$, $\mathrm{AOD}$, $\mathrm{AOP}$이므로 $\cos\theta_i$는 넓이의 비.
stuck: |
  정육면체의 세 면 $\mathrm{EFGH}$, $\mathrm{FJKG}$, $\mathrm{EIJF}$가 각각 평면 $\mathrm{BCD}$, $\mathrm{AOD}$, $\mathrm{AOP}$와 평행함을 알아채는 것, 3에서 단면 $\mathrm{B'C'D'}$의 닮음으로 한 변 $x$를 구하는 것
