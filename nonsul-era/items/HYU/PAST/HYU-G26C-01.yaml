    method_no: 1
    key_idea: $\mathrm{BP}\parallel\mathrm{MN}$, $\mathrm{EP'}\parallel\mathrm{MN}\perp\mathrm{QR}$에서 $\triangle\mathrm{P'EH}\sim\triangle\mathrm{RQE}$로 $t=2$; $\triangle\mathrm{PQR}=\frac{3\sqrt{21}}{2}$, $\triangle\mathrm{P'QR}=\frac32$.
    steps:
    - {id: 3a, content: '$t=2$, $\cos\theta=\dfrac{3/2}{3\sqrt{21}/2}=\dfrac{\sqrt{21}}{21}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 두 직선 $\mathrm{BM}$과 $\mathrm{PN}$이 만나므로 한 평면을 결정한다. 이 평면이 두 밑면과 만나는 교선은?
    - 점 $\mathrm{P}$에서 평면 $\mathrm{DEF}$에 내린 수선의 발 $\mathrm{P'}$을 생각하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2026 선행학습 영향평가 보고서 문항카드9 p.118 예시답안 3
    steps:
    - id: 3b-1
      content: |
        두 직선 $\mathrm{BM}$과 $\mathrm{PN}$은 점 $\mathrm{S}$에서 만나므로 하나의 평면을 결정한다. 두 직선 $\mathrm{BP}$와 $\mathrm{MN}$은 이 평면 위에 있으면서 서로 평행한 두 평면 $\mathrm{ABC}$와 $\mathrm{DEF}$에 각각 포함되므로 서로 평행하다. 점 $\mathrm{P}$에서 평면 $\mathrm{DEF}$에 내린 수선의 발을 $\mathrm{P'}$이라 하면 $\mathrm{EP'}\parallel\mathrm{MN}$이고 $\mathrm{EP'}\perp\mathrm{QR}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\mathrm{P'}$에서 선분 $\mathrm{EF}$에 내린 수선의 발을 $\mathrm{H}$라 하면 두 삼각형 $\mathrm{P'EH}$와 $\mathrm{RQE}$는 닮음이다. $\mathrm{P'}$은 선분 $\mathrm{DF}$를 $2:1$로 내분하므로 $\overline{\mathrm{P'F}}=\sqrt2$, $\overline{\mathrm{P'H}}=\overline{\mathrm{HF}}=1$, $\overline{\mathrm{EH}}=2$이다. 그러므로 $\overline{\mathrm{EQ}}:\overline{\mathrm{ER}}=\overline{\mathrm{EH}}:\overline{\mathrm{P'H}}$, 즉 $t:(3-t)=2:1$이고 $t=2$이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        $\overline{\mathrm{ER}}=1$이므로 $\overline{\mathrm{RH}}=1$, $\overline{\mathrm{P'R}}=\sqrt2$, $\overline{\mathrm{PR}}=\sqrt{\overline{\mathrm{PP'}}^2+\overline{\mathrm{P'R}}^2}=\sqrt{38}$. $\mathrm{P'}$에서 선분 $\mathrm{EQ}$에 내린 수선의 발은 $\mathrm{EQ}$의 중점이므로 $\overline{\mathrm{P'Q}}=\overline{\mathrm{P'E}}=\sqrt5$, $\overline{\mathrm{PQ}}=\sqrt{41}$.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        삼각형 $\mathrm{PQR}$에서 코사인법칙에 의해 $\cos\angle\mathrm{QPR}=\dfrac{41+38-5}{2\sqrt{41}\sqrt{38}}=\dfrac{37}{\sqrt{1558}}$, $\sin\angle\mathrm{QPR}=\dfrac{3\sqrt{21}}{\sqrt{1558}}$이므로 넓이는 $\frac12\times\overline{\mathrm{PQ}}\times\overline{\mathrm{PR}}\times\sin\angle\mathrm{QPR}=\dfrac{3\sqrt{21}}{2}$이다.
      criteria: ['3.A1']
    - id: 3b-5
      content: |
        삼각형 $\mathrm{PQR}$의 평면 $\mathrm{DEF}$ 위로의 정사영은 삼각형 $\mathrm{P'QR}$이고 그 넓이는 $\triangle\mathrm{DEF}-\triangle\mathrm{DQP'}-\triangle\mathrm{QER}-\triangle\mathrm{P'RF}=\frac92-1-1-1=\frac32$이다. 따라서 $\cos\theta=\dfrac{\sqrt{21}}{21}$이다.
      criteria: ['3.A1']
