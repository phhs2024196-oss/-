intent: |
  수학의 도형의 방정식(점과 직선 사이의 거리)과 경우의 수, 미적분의 등비급수와 삼각함수의 덧셈정리, 기하의 직선과 평면의 위치 관계와 정사영을 바탕으로 논리적 사고를 통해 답을 구할 수 있는지 본다. 거리 공식으로 조건을 만족하는 경우를 세고, 삼각형의 닮음과 덧셈정리로 등비급수의 공비를 계산해 합을 구하며, 직선과 평면의 위치 관계와 도형의 넓이·정사영 넓이의 관계로 두 평면이 이루는 각을 구한다.
key_idea: |
  1은 $\lvert2a+b-30\rvert\le30$. 2는 $\triangle\mathrm{B_2C_2F_1}\sim\triangle\mathrm{G_1C_2D_2}$에서 $r^2=a(\sqrt2-a)$, 사인법칙으로 $r=\frac{\sqrt2}{2}a(1+\cot\theta)$. 3은 $\mathrm{BP}\parallel\mathrm{MN}$에서 $\mathrm{EP'}\parallel\mathrm{MN}\perp\mathrm{QR}$, 닮음으로 $t=2$, $\cos\theta=\frac{\triangle\mathrm{P'QR}}{\triangle\mathrm{PQR}}$.
stuck: |
  2에서 $\angle\mathrm{B_1F_1E_1}=\theta$(원주각 $\frac\pi4$ 이용)를 찾아 닮음 삼각형 두 개를 세우는 것, 3에서 두 직선 $\mathrm{BM}$, $\mathrm{PN}$이 정하는 평면이 두 평행 평면과 만나는 교선 $\mathrm{BP}\parallel\mathrm{MN}$을 알아채는 것
