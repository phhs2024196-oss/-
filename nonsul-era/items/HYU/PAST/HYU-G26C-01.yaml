      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2, 2a]
    - id: 2.A1
      mark_type: A
      points: 12
      evidence: |
        정사각형 $\mathrm{A_2B_2C_2D_2}$의 한 변 $\frac{12}{17}$과 급수의 합 $\frac{1156}{253}$을 구했다(공식 25점 → 12).
      depends_on: [2.M1]
      steps: [2b-3, 2b-4, 2b-5, 2a]
    deductions: []
