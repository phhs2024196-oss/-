stem: |
  [문제 1] 다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    좌표평면 위에 있는 $5$개의 점 $\mathrm{P}_1(-6,-3)$, $\mathrm{P}_2(-6,3)$, $\mathrm{P}_3(-3,6)$, $\mathrm{P}_4(6,3)$, $\mathrm{P}_5(6,-3)$ 중에서 서로 다른 $3$개를 선택하여 그 점들을 꼭짓점으로 하는 삼각형을 만들 때, 그 삼각형의 무게중심과 직선 $y=-2x+30$ 사이의 거리가 $6\sqrt5$ 이하가 되는 경우의 수를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 무게중심 $(a,b)$에 대해 조건은 $\lvert2a+b-30\rvert\le30$. 10가지 중 값이 $30,30,28,27,25,22$인 6가지.
    steps:
    - {id: 1a, content: '$\lvert2a+b-30\rvert\le30$을 만족하는 경우 $6$가지', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 무게중심 $(a,b)$와 직선 $2x+y-30=0$ 사이의 거리를 식으로 쓰자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 선행학습 영향평가 보고서 문항카드9 p.117 예시답안 1
    steps:
    - id: 1b-1
      content: |
        무게중심이 $(a,b)$일 때 직선 $2x+y-30=0$까지의 거리는 $\dfrac{\lvert2a+b-30\rvert}{\sqrt{2^2+1^2}}$이고, 이것이 $6\sqrt5$ 이하일 필요충분조건은 $\lvert2a+b-30\rvert\le30$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        세 점과 무게중심, $\lvert2a+b-30\rvert$는 다음과 같다.
        $\mathrm{P_1P_2P_3}$: $(-5,2)$, $38$; $\mathrm{P_1P_2P_5}$: $(-2,-1)$, $35$; $\mathrm{P_1P_2P_4}$: $(-2,1)$, $33$; $\mathrm{P_1P_3P_5}$: $(-1,0)$, $32$; $\mathrm{P_1P_3P_4}$: $(-1,2)$, $30$; $\mathrm{P_1P_5P_4}$: $(2,-1)$, $27$; $\mathrm{P_2P_3P_5}$: $(-1,2)$, $30$; $\mathrm{P_2P_3P_4}$: $(-1,4)$, $28$; $\mathrm{P_2P_5P_4}$: $(2,1)$, $25$; $\mathrm{P_3P_5P_4}$: $(3,2)$, $22$.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        그러므로 $\lvert2a+b-30\rvert\le30$을 만족하는 경우의 수는 $6$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        세 점으로 만든 삼각형의 무게중심 좌표를 모두 구했다(공식 10점 → 5).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1a]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        거리 조건 $\lvert2a+b-30\rvert\le30$으로 경우의 수 $6$을 구했다(공식 10점 → 5).
      depends_on: [1.M1]
      steps: [1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [그림: 정사각형 $\mathrm{A_1B_1C_1D_1}$(왼쪽 위 $\mathrm{A}_1$, 왼쪽 아래 $\mathrm{B}_1$, 오른쪽 아래 $\mathrm{C}_1$, 오른쪽 위 $\mathrm{D}_1$)과 내접원, 원 위의 점 $\mathrm{E}_1$(왼쪽 위), 아랫변 중점 $\mathrm{F}_1$, 오른쪽 변 중점 $\mathrm{G}_1$로 만든 삼각형 $\mathrm{E_1F_1G_1}$, $\mathrm{G}_1$에서의 각 $\theta$, 그 안의 정사각형 $\mathrm{A_2B_2C_2D_2}$와 내접원, 같은 방식의 점 $\mathrm{E_2}$, $\mathrm{F_2}$, $\mathrm{G_2}$]
    오른쪽 그림과 같이 한 변의 길이가 $2$인 정사각형 $\mathrm{A_1B_1C_1D_1}$에 대하여 선분 $\mathrm{B_1C_1}$의 중점을 $\mathrm{F}_1$, 선분 $\mathrm{C_1D_1}$의 중점을 $\mathrm{G}_1$이라 하자.
    정사각형 $\mathrm{A_1B_1C_1D_1}$에 내접하는 원 위의 점 $\mathrm{E}_1$에 대하여 $\theta=\angle\mathrm{E_1G_1F_1}$이라 할 때, $\dfrac\pi4<\theta<\dfrac\pi2$를 만족시킨다.
    세 점 $\mathrm{B}_2$, $\mathrm{C}_2$, $\mathrm{D}_2$는 각각 선분 $\mathrm{E_1F_1}$, $\mathrm{F_1G_1}$, $\mathrm{E_1G_1}$ 위의 점이며, 두 직선 $\mathrm{B_1C_1}$과 $\mathrm{B_2C_2}$가 서로 평행하고 두 직선 $\mathrm{C_1D_1}$과 $\mathrm{C_2D_2}$가 서로 평행하며, 사각형 $\mathrm{A_2B_2C_2D_2}$는 정사각형이다.
    정사각형 $\mathrm{A_2B_2C_2D_2}$에도 같은 방법을 적용하여, 선분 $\mathrm{B_2C_2}$의 중점을 $\mathrm{F}_2$, 선분 $\mathrm{C_2D_2}$의 중점을 $\mathrm{G}_2$라 하자.
    정사각형 $\mathrm{A_2B_2C_2D_2}$에 내접하는 원 위의 점 $\mathrm{E}_2$는 $\angle\mathrm{E_1G_1F_1}=\angle\mathrm{E_2G_2F_2}$를 만족시킨다.
    이와 같은 과정을 반복하여 정사각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n\mathrm{D}_n$과 세 점 $\mathrm{E}_n$, $\mathrm{F}_n$, $\mathrm{G}_n\ (n\ge3)$을 얻을 수 있다.
    모든 자연수 $n$에 대하여 정사각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n\mathrm{D}_n$의 넓이를 $S_n$이라 하자.
    $\cos\theta=\dfrac{\sqrt5}{5}$일 때 급수 $\displaystyle\sum_{n=1}^{\infty}S_n$의 합을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '1156/253', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{C_2F_1}}=a$, 한 변 $r$이면 $r^2=a(\sqrt2-a)$, $r=\frac{\sqrt2}{2}a(1+\cot\theta)$이므로 $r=\frac{2(1+\cot\theta)}{(1+\cot\theta)^2+2}=\frac{12}{17}$.
    steps:
    - {id: 2a, content: '$\sum S_n=\dfrac{4}{1-r^2/4}=\dfrac{1156}{253}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $\angle\mathrm{F_1E_1G_1}$은 어떤 호에 대한 원주각인가?
    - 삼각형 $\mathrm{B_2C_2F_1}$과 $\mathrm{G_1C_2D_2}$를 비교해 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 선행학습 영향평가 보고서 문항카드9 p.117~118 예시답안 2
    steps:
    - id: 2b-1
      content: |
        각 $\mathrm{F_1E_1G_1}$은 호 $\mathrm{F_1G_1}$에 대한 원주각이므로 $\angle\mathrm{F_1E_1G_1}=\frac\pi4$이다. 삼각형 $\mathrm{E_1F_1G_1}$에서 $\angle\mathrm{E_1F_1G_1}=\frac{3\pi}{4}-\theta$이고, 삼각형 $\mathrm{C_1F_1G_1}$에서 $\overline{\mathrm{C_1F_1}}=\overline{\mathrm{C_1G_1}}$이므로 $\angle\mathrm{C_1F_1G_1}=\frac\pi4$. 그러므로 $\angle\mathrm{B_1F_1E_1}=\theta$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\mathrm{B_1C_1}\parallel\mathrm{B_2C_2}$이므로 $\angle\mathrm{C_2B_2F_1}=\angle\mathrm{B_1F_1E_1}=\theta$, $\angle\mathrm{B_2C_2F_1}=\angle\mathrm{C_1F_1C_2}=\frac\pi4$. 또 $\mathrm{C_1D_1}\parallel\mathrm{C_2D_2}$이므로 $\angle\mathrm{D_2C_2G_1}=\angle\mathrm{C_1G_1C_2}=\frac\pi4$. 그러므로 두 삼각형 $\mathrm{B_2C_2F_1}$과 $\mathrm{G_1C_2D_2}$는 닮음이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $\overline{\mathrm{C_2F_1}}=a$라 하면 $\overline{\mathrm{C_2G_1}}=\sqrt2-a$이고, 정사각형 $\mathrm{A_2B_2C_2D_2}$의 한 변을 $r$이라 하면 닮음에서 $r:(\sqrt2-a)=a:r$, 즉 $r^2=a(\sqrt2-a)$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        삼각형 $\mathrm{B_2C_2F_1}$에서 사인법칙에 의해 $\dfrac{a}{\sin\theta}=\dfrac{r}{\sin\left(\frac{3\pi}{4}-\theta\right)}$이고 덧셈정리에 의해 $r=a\dfrac{\sin\left(\theta+\frac\pi4\right)}{\sin\theta}=\dfrac{\sqrt2}{2}a(1+\cot\theta)$이다.
      criteria: ['2.A1']
    - id: 2b-5
      content: |
        두 식에서 $a=\dfrac{2\sqrt2}{(1+\cot\theta)^2+2}$, $r=\dfrac{2(1+\cot\theta)}{(1+\cot\theta)^2+2}$. $\cos\theta=\frac{\sqrt5}{5}$이므로 $\cot\theta=\frac12$, $r=\frac{12}{17}$. $\sum S_n$은 첫째항 $4$, 공비 $\frac{r^2}{4}$인 등비급수이므로 $\displaystyle\sum_{n=1}^\infty S_n=\frac{4}{1-\frac{r^2}{4}}=\frac{1156}{253}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
