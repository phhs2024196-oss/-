  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [그림: 삼각기둥 $\mathrm{ABC-DEF}$ — 위 밑면 $\mathrm{ABC}$, 아래 밑면 $\mathrm{DEF}$, 변 $\mathrm{AC}$ 위의 점 $\mathrm{P}$, 선분 $\mathrm{BE}$ 근처의 점 $\mathrm{S}$, $\mathrm{DF}$의 중점 $\mathrm{M}$, $\mathrm{DE}$ 위의 $\mathrm{Q}$, $\mathrm{EF}$ 위의 $\mathrm{R}$, $\mathrm{QR}$ 위의 점 $\mathrm{N}$, 점선 $\mathrm{PQ}$, $\mathrm{PR}$, $\mathrm{PN}$, $\mathrm{BM}$]
    $\overline{\mathrm{AB}}=\overline{\mathrm{BC}}=\overline{\mathrm{DE}}=\overline{\mathrm{EF}}=3$, $\angle\mathrm{ABC}=\angle\mathrm{DEF}=\dfrac\pi2$, $\overline{\mathrm{AD}}=6$인 삼각기둥 $\mathrm{ABC-DEF}$가 있다. 점 $\mathrm{P}$는 선분 $\mathrm{AC}$를 $2:1$로 내분하는 점이고, 점 $\mathrm{M}$은 선분 $\mathrm{DF}$의 중점이다. 선분 $\mathrm{DE}$ 위의 점 $\mathrm{Q}$는 $\overline{\mathrm{EQ}}=t\ (0<t<3)$, 선분 $\mathrm{EF}$ 위의 점 $\mathrm{R}$은 $\overline{\mathrm{ER}}=3-t$를 만족시킨다.
    직선 $\mathrm{BM}$이 평면 $\mathrm{PQR}$과 만나는 점을 $\mathrm{S}$라 할 때, $\overline{\mathrm{BS}}:\overline{\mathrm{SM}}=2:1$이다. 점 $\mathrm{N}$은 직선 $\mathrm{PS}$와 직선 $\mathrm{QR}$의 교점이다. 직선 $\mathrm{MN}$과 직선 $\mathrm{QR}$이 서로 수직일 때, 평면 $\mathrm{PQR}$이 평면 $\mathrm{DEF}$와 이루는 예각의 크기 $\theta$에 대하여 $\cos\theta$의 값을 구하시오.
  points: 20
