intent: |
  수학의 이차방정식과 이차함수, 여러 가지 방정식, 도형의 이동, 수학Ⅰ의 수열의 합, 수학Ⅱ·미적분의 함수의 연속, 도함수의 활용과 여러 가지 미분법, 기하의 위치벡터와 평면벡터의 성분에 대한 전반적인 지식을 평가한다. 몫의 미분으로 $f$가 $[0,1]$에서 증가함을 보여 최댓값·최솟값을 구하고, 그 결과로 얻는 부등식과 위치벡터로 합성함수 꼴 식의 최댓값을 구하며, $k$의 값에 따라 경우를 나누어 $h(s)$의 불연속점을 찾고 수열의 합을 구한다.
key_idea: |
  1은 $f'(x)$의 분자가 $(1+x)^{n-1}(1-x^{n-1})-(1-x)^{n-1}(1+x^{n-1})>0$. 2는 1의 $F(x)=\frac{(1+x)^8+(1-x)^8}{1+x^8}\ge2$에서 $(a+b)^8+(a-b)^8\ge2(a^8+b^8)$(등호는 $a=0$ 또는 $b=0$)을 얻어 두 번 적용하고 조건과 더한다. 3은 $\lvert g(x)+k\rvert$의 그래프에서 꼭짓점·모서리 높이가 겹쳐야 불연속점이 2개.
stuck: |
  2에서 1의 결과를 두 변수 부등식 $(a+b)^8+(a-b)^8\ge2(a^8+b^8)$으로 바꾸고 $a\pm b$에 $\sqrt[8]{1-s^8}$, $\sqrt[8]{1-(f(s))^8}$와 $s$, $f(s)$를 각각 대입하는 발상(보조 부등식 스스로 설정)
