- id: '3'
  stem: |
    자연수 $n$에 대하여 함수 $g(x)$는 $g(x)=\begin{cases}x^2+2nx+n^2+2 & (x\le0)\\ x^2-6nx+n^2+2 & (x>0)\end{cases}$이다.
    다음 조건을 만족시키는 양수 $k$를 $a_n$이라 하자.

    [조건] 실수 $s$에 대하여 곡선 $y=\lvert g(x)+k\rvert$와 직선 $y=s$의 교점의 개수를 $h(s)$라 하자. 함수 $h(s)$가 $s=p$에서 불연속이 되도록 하는 실수 $p$의 개수는 $2$이다.

    $\displaystyle\sum_{n=1}^{10}a_n$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '1520', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 불연속 후보는 $s=0$, $k+2$(왼쪽 꼭짓점), $k+n^2+2$($x=0$의 모서리), $\lvert k+2-8n^2\rvert$(오른쪽 꼭짓점). $k=4n^2-2$일 때만 $k+2=-k+8n^2-2$로 겹쳐 2개.
    steps:
    - {id: 3a, content: '$a_n=4n^2-2$, $\sum_{n=1}^{10}a_n=4\times\frac{10\times11\times21}{6}-2\times10=1520$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $y=\lvert g(x)+k\rvert$의 그래프에서 $h(s)$가 바뀌는 높이를 모두 적어 보자.
    - 그 높이들 중 두 개가 겹치려면 $k$가 어떤 값이어야 하는가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2026 선행학습 영향평가 보고서 문항카드10 p.124 예시답안 3 (보고서 원본 PDF 126쪽)
    steps:
    - id: 3b-1
      content: |
        $k$의 값을 기준으로 경우를 나누면
        (i) $k\ge8n^2-2$: $h$는 $s=k+n^2+2,\ k+2,\ k-8n^2+2$에서 불연속.
        (ii) $4n^2-2<k<8n^2-2$: $s=k+n^2+2,\ k+2,\ -k+8n^2-2,\ 0$에서 불연속.
        (iii) $k=4n^2-2$: $s=k+n^2+2,\ 0$에서 불연속.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (iv) $\frac72n^2-2<k<4n^2-2$: $s=k+n^2+2,\ -k+8n^2-2,\ k+2,\ 0$에서 불연속.
        (v) $k=\frac72n^2-2$: $s=k+n^2+2,\ k+2,\ 0$에서 불연속.
        (vi) $0<k<\frac72n^2-2$: $s=-k+8n^2-2,\ k+n^2+2,\ k+2,\ 0$에서 불연속.
        [그림: (ii) $4n^2-2<k<8n^2-2$, (iii) $k=4n^2-2$, (vi) $0<k<\frac72n^2-2$일 때 $y=\lvert g(x)+k\rvert$의 그래프 — (iii)에서는 왼쪽 극소와 오른쪽 극대의 높이가 같다]
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        따라서 $a_n=4n^2-2$이고 $\displaystyle\sum_{n=1}^{10}a_n=4\times\frac{10\times11\times21}{6}-2\times10=1520$이다.
      criteria: ['3.A1']
