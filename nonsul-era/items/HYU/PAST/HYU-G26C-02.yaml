stem: |
  [문제 2] 다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    자연수 $n\ (n\ge3)$에 대하여 닫힌구간 $[0,1]$에서 정의된 함수
    $$f(x)=\frac{(1+x)^n+(1-x)^n}{1+x^n}$$
    의 최댓값과 최솟값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'max = 2**(n-1); min = 2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=n\cdot\frac{(1+x)^{n-1}(1-x^{n-1})-(1-x)^{n-1}(1+x^{n-1})}{(1+x^n)^2}>0$이므로 증가. 최댓값 $f(1)=2^{n-1}$, 최솟값 $f(0)=2$.
    steps:
    - {id: 1a, content: '$\left(\frac{1+x}{1-x}\right)^{n-1}>\frac{1+x^{n-1}}{1-x^{n-1}}$ ⇒ $f''>0$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 몫의 미분법으로 $f'(x)$의 분자를 정리하자.
    - $0<x<1$이면 $x^{n-1}<x$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 선행학습 영향평가 보고서 문항카드10 p.122 예시답안 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=n\cdot\dfrac{\left((1+x)^{n-1}-(1-x)^{n-1}\right)(1+x^n)-x^{n-1}\left((1+x)^n+(1-x)^n\right)}{(1+x^n)^2}=n\cdot\dfrac{(1+x)^{n-1}(1-x^{n-1})-(1-x)^{n-1}(1+x^{n-1})}{(1+x^n)^2}$ …… (＊)
        (공식 예시답안 첫 줄의 $(1-x)^{x-1}$은 $(1-x)^{n-1}$의 오기로 보아 고쳐 적음)
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $0<x<1$이면 $x^{n-1}<x$이므로 $\left(\dfrac{1+x}{1-x}\right)^{n-1}\ge\dfrac{1+x}{1-x}>\dfrac{1+x^{n-1}}{1-x^{n-1}}$. 그러므로 $(1+x)^{n-1}(1-x^{n-1})>(1+x^{n-1})(1-x)^{n-1}$, 즉 (＊)의 분자가 양수이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        열린구간 $(0,1)$에서 $f'(x)>0$이므로 닫힌구간 $[0,1]$에서 $f$는 증가한다. 따라서 최댓값은 $f(1)=2^{n-1}$, 최솟값은 $f(0)=2$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        몫의 미분법으로 $f'(x)$를 구했다(공식 10점 → 5).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $[0,1]$에서 $f$가 증가함을 보이고 최댓값 $2^{n-1}$, 최솟값 $2$를 구했다(공식 20점 → 10).
      depends_on: [1.M1]
      steps: [1b-2, 1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0412}
  misconceptions:
  - id: MC-CAL-0412
    outcome_code: '71'
    wrong_work: '$f''(x)=\dfrac{(1+x^n)\cdot N''-N\cdot nx^{n-1}}{(1+x^n)^2}$의 분자 두 항 순서를 바꿔 $f''<0$으로 판단'
    detect_cue: 분자가 $N\cdot nx^{n-1}-(1+x^n)N'$ 꼴이고 $f$가 감소한다고 결론
    feedback: 몫의 미분은 (분모)×(분자)′−(분자)×(분모)′입니다. $f(0)=2<f(1)=2^{n-1}$로 방향을 확인해 보세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $k>1$인 실수 $k$에 대하여 함수 $f(x)=-x^3+\left(\dfrac1k+1\right)x^2-\left(\dfrac1k+1\right)x$가 있고,
    $0\le s\le1$인 실수 $s$에 대하여 두 점 $\mathrm{A}\left(\sqrt[8]{1-s^8},\,s\right)$와 $\mathrm{B}\left(\sqrt[8]{1-(f(s))^8},\,f(s)\right)$가 있다.
    $\overrightarrow{\mathrm{OM}}=\dfrac12\left(\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}\right)$인 점 $\mathrm{M}(g(s),h(s))$가 $(g(s))^8+(h(s))^8\ge1-\dfrac{1}{k^8}$을 만족시킬 때,
    $\left\{\sqrt[8]{1-s^8}-\sqrt[8]{1-(f(s))^8}\right\}^8+\{s-f(s)\}^8$의 최댓값을 구하시오. (단, $\mathrm{O}$는 원점이다.)
  points: 20
  depends_on: ['1']
  answer: {kind: expression, value: '256/k**8', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $(a+b)^8+(a-b)^8\ge2(a^8+b^8)$을 $(a,b)=\left(g,\ \frac{\sqrt[8]{1-s^8}-\sqrt[8]{1-f^8}}{2}\right)$, $\left(h,\ \frac{s-f}{2}\right)$에 적용해 더하면 $\left(\frac{X}{2}\right)^8+\left(\frac{Y}{2}\right)^8\le\frac1{k^8}$, 등호는 $s=\frac1k$.
    steps:
    - {id: 2a, content: '최댓값 $2^8\cdot\frac1{k^8}=\frac{256}{k^8}$ ($s=\frac1k$)', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 문항 1에서 $n=8$이면 $\frac{(1+x)^8+(1-x)^8}{1+x^8}\ge2$이다. $x=\frac ba$로 놓아 보자.
    - $\mathrm{A}$, $\mathrm{B}$는 모두 곡선 $x^8+y^8=1$ 위에 있다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 선행학습 영향평가 보고서 문항카드10 p.122~124 예시답안 2
    steps:
    - id: 2b-1
      content: |
        문항 1에서 $0\le x\le1$이면 $F(x)=\dfrac{(1+x)^8+(1-x)^8}{1+x^8}\ge2$이다. (i) $a\ge b>0$이면 $1\ge\frac ba>0$이므로 $F\left(\frac ba\right)\ge2$, (ii) $b\ge a>0$이면 $F\left(\frac ab\right)\ge2$. 따라서 $a,b>0$이면 $(a+b)^8+(a-b)^8\ge2(a^8+b^8)$ …… ㉠. (iii) 부호가 다른 경우와 $a=0$ 또는 $b=0$인 경우에도 ㉠에 의해 성립하므로 모든 실수 $a,b$에 대해 $(a+b)^8+(a-b)^8\ge2(a^8+b^8)$ …… ㉡. $F$는 $x=0$에서 최솟값을 가지므로 등호는 $a=0$ 또는 $b=0$일 때 성립한다 …… (＊)
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $0\le s\le1$에서 $f(s)=-s(s-1)\left(s-\frac1k\right)-s$이고 $f(0)=0$, $f(1)=-1$. $f'(s)=-3s^2+2\left(\frac1k+1\right)s-\left(\frac1k+1\right)$의 판별식이 $\left(\frac1k-2\right)\left(\frac1k+1\right)<0$이므로 $f'(s)<0$이고 $-1\le f(s)\le0$이다.
        [그림: $t=s$, $t=-s$, $t=f(s)$의 그래프 — $t=f(s)$는 $(0,0)$에서 $(1,-1)$로 감소하며 $s=\frac1k$에서 $t=-s$와 만남]
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        ㉡에 $a=\frac{\sqrt[8]{1-s^8}+\sqrt[8]{1-(f(s))^8}}{2}$, $b=\frac{\sqrt[8]{1-s^8}-\sqrt[8]{1-(f(s))^8}}{2}$를 대입하면 $(1-s^8)+(1-(f(s))^8)\ge2\left(a^8+b^8\right)$ …… ㉢. ㉡에 $a=\frac{s+f(s)}{2}$, $b=\frac{s-f(s)}{2}$를 대입하면 $s^8+(f(s))^8\ge2\left(\left(\frac{s+f(s)}{2}\right)^8+\left(\frac{s-f(s)}{2}\right)^8\right)$ …… ㉣.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        ㉢과 ㉣을 더하면 $g(s)=\frac{\sqrt[8]{1-s^8}+\sqrt[8]{1-(f(s))^8}}{2}$, $h(s)=\frac{s+f(s)}{2}$이므로
        $2\ge2\left((g(s))^8+\left(\frac{\sqrt[8]{1-s^8}-\sqrt[8]{1-(f(s))^8}}{2}\right)^8+(h(s))^8+\left(\frac{s-f(s)}{2}\right)^8\right)\ge2\left(1-\frac1{k^8}+\left(\frac{\sqrt[8]{1-s^8}-\sqrt[8]{1-(f(s))^8}}{2}\right)^8+\left(\frac{s-f(s)}{2}\right)^8\right)$.
        즉 $\left(\frac{\sqrt[8]{1-s^8}-\sqrt[8]{1-(f(s))^8}}{2}\right)^8+\left(\frac{s-f(s)}{2}\right)^8\le\left(\frac1k\right)^8$ …… ㉤. (공식 예시답안의 「$1-\left(\frac1k\right)^8$」은 조건의 $1-\frac1{k^8}$과 같음)
      criteria: ['2.A1']
    - id: 2b-5
      content: |
        (＊)에 의해 ㉤의 등호가 성립하려면 $s=f(s)$ 또는 $s=-f(s)$이고, 이를 만족하는 $s$는 $0,1,\frac1k$이다. ① $s=0$이면 $f(0)=0$이므로 ㉤의 좌변이 $0$. ② $s=1$이면 $f(1)=-1$이므로 $(g,h)=(0,0)$이고 조건을 만족하지 않는다. ③ $s=\frac1k$이면 $f\left(\frac1k\right)=-\frac1k$이므로 ㉤의 좌변이 $\left(\frac1k\right)^8$이고 등호가 성립하며 $\left(g\left(\frac1k\right)\right)^8+\left(h\left(\frac1k\right)\right)^8=1-\frac1{k^8}$이다. 그러므로 구하는 최댓값은 $\dfrac{256}{k^8}$이다.
        (참고: $F(x)$의 최댓값이 $2^7$임을 이용해 ㉡을 보일 수도 있다. 양수 $a>b>0$에 대해 $u=\frac{a+b}{2}$, $v=\frac{a-b}{2}$이면 $F\left(\frac vu\right)\le2^7$이므로 $(a+b)^8+(a-b)^8\ge2(a^8+b^8)$.)
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $[0,1]$에서 $f(s)$의 그래프 개형($f(0)=0$, $f(1)=-1$, $f'<0$, $f(\frac1k)=-\frac1k$)을 파악했다(공식 20점 → 10).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2, 2a]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
