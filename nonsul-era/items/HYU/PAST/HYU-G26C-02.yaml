  materials:
  - '$f(x)=\dfrac{(1+x)^n+(1-x)^n}{1+x^n}$ $(0\le x\le1,\ n\ge3)$'
  - '$f(x)=-x^3+\left(\frac1k+1\right)x^2-\left(\frac1k+1\right)x$, 점 $\mathrm{A}(\sqrt[8]{1-s^8},s)$, $\mathrm{B}(\sqrt[8]{1-(f(s))^8},f(s))$, 중점 $\mathrm{M}(g(s),h(s))$'
  - '$g(x)=x^2+2nx+n^2+2\ (x\le0)$, $x^2-6nx+n^2+2\ (x>0)$, $y=\lvert g(x)+k\rvert$와 $y=s$의 교점 개수 $h(s)$'
  concepts: [몫의 미분법, 함수의 증가와 감소, 최댓값과 최솟값, 위치벡터, 평면벡터의 성분, 이차함수의 최대·최소, 그래프의 평행이동과 대칭이동, 함수의 연속, 수열의 합]
  tools:
  - '$\left(\frac{1+x}{1-x}\right)^{n-1}\ge\frac{1+x}{1-x}>\frac{1+x^{n-1}}{1-x^{n-1}}$'
  - '$F\left(\frac ba\right)\ge2$ ⇒ $(a+b)^8+(a-b)^8\ge2(a^8+b^8)$'
  - '두 부등식의 합과 조건 $(g(s))^8+(h(s))^8\ge1-\frac1{k^8}$'
  - '$f(\frac1k)=-\frac1k$, $f(1)=-1$, $f''(s)<0$'
  - '$k$와 $4n^2-2$, $\frac72n^2-2$, $8n^2-2$의 대소로 경우 나누기'
  conditions:
  - '$n\ge3$, $0<x<1$에서 $x^{n-1}<x$'
  - '$k>1$, $0\le s\le1$'
  - '등호 조건 $s=\pm f(s)$ ⇒ $s=0,1,\frac1k$, $s=1$은 조건 불만족'
  - '$h(s)$가 불연속인 $p$가 정확히 2개'
