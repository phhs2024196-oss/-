stem: |
  다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    닫힌구간 $[0,\pi]$에서 $\sin(x-\cos x)$와 $\sin x$의 크기를 비교하시오.
  points: 20
  depends_on: []
  answer: {kind: expression, value: 'equal_at = pi/2; otherwise = sin(x - cos(x)) < sin(x)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=\tfrac{\pi}{2}$에서는 같고, 그 앞에서는 $x-\cos x<x$와 $\sin$의 증가, 그 뒤에서는 $x-\cos x>x$와 $\sin$의 감소로 모두 $\sin(x-\cos x)<\sin x$.
    steps:
    - {id: 1a, content: '$\cos x$의 부호로 $[0,\tfrac{\pi}{2})$, $\{\tfrac{\pi}{2}\}$, $(\tfrac{\pi}{2},\pi]$로 나누어 비교', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $\cos x$의 부호가 바뀌는 곳은 어디인가?
    - $\sin x$가 증가하는 구간과 감소하는 구간에서 각각 $x-\cos x$와 $x$의 크기를 비교해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 모의논술 예시답안 1번 p.1 문항 1
    steps:
    - id: 1b-1
      content: |
        (i) $x=\dfrac{\pi}{2}$: $\sin\left(\dfrac{\pi}{2}-\cos\dfrac{\pi}{2}\right)=\sin\dfrac{\pi}{2}$이므로 $\sin(x-\cos x)=\sin x$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (ii) $0\le x<\dfrac{\pi}{2}$: $\cos x>0$이므로 $x-\cos x<x$이고 $\sin x$는 $0\le x<\dfrac{\pi}{2}$에서 단조증가함수이므로 $\sin(x-\cos x)<\sin x$. (이때 $x-\cos x\ge -1>-\dfrac{\pi}{2}$이므로 $x-\cos x$도 $\sin$의 증가 구간 $\left[-\dfrac{\pi}{2},\dfrac{\pi}{2}\right]$ 안에 있다.)
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        (iii) $\dfrac{\pi}{2}<x\le\pi$: $\cos x<0$이므로 $x-\cos x>x$이고 $\sin x$는 $\dfrac{\pi}{2}<x\le\pi$에서 단조감소함수이므로 $\sin(x-\cos x)<\sin x$. (이때 $x-\cos x\le\pi+1<\dfrac{3\pi}{2}$이므로 $\sin$의 감소 구간 안에 있다.)
      criteria: ['1.M1']
    - id: 1b-4
      content: |
        따라서 $x=\dfrac{\pi}{2}$일 때 $\sin(x-\cos x)=\sin x$이고, $[0,\pi]$의 나머지 $x$에서는 $\sin(x-\cos x)<\sin x$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2021 모의논술 예시답안 1번 p.1 〈별해〉(평균값 정리)
    key_idea: 평균값 정리로 $\sin x-\sin(x-\cos x)=\cos\alpha\cos x$를 만들고 $\cos\alpha$와 $\cos x$의 부호가 같음을 보인다.
    steps:
    - id: 1c-1
      content: |
        $0\le x<\dfrac{\pi}{2}$: $x-\cos x<x$이고 $[x-\cos x,x]$에서 평균값 정리를 적용하면 $\sin x-\sin(x-\cos x)=\cos\alpha\,(x-(x-\cos x))=\cos\alpha\cos x$인 $\alpha\in(x-\cos x,x)$가 존재한다. $x-\cos x\ge x-1\ge -1$이므로 $\cos\alpha>0$이고 $\sin x>\sin(x-\cos x)$.
      criteria: ['1.M1']
    - id: 1c-2
      content: |
        $\dfrac{\pi}{2}<x\le\pi$: $x-\cos x>x$이고 $[x,x-\cos x]$에서 평균값 정리로 $\sin(x-\cos x)-\sin x=\cos\alpha\,(-\cos x)$인 $\alpha\in(x,x-\cos x)$가 존재한다. $x-\cos x\le x+1\le\pi+1$이므로 $\cos\alpha<0$이고 $\sin x>\sin(x-\cos x)$. $x=\dfrac{\pi}{2}$에서는 두 값이 같다.
      criteria: ['1.M1', '1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        각 구간별로 $x-\cos x$의 값의 범위($x$보다 작은지 큰지)와 $\sin x$의 증감을 파악했다(평가지침 20/40).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1b-3, 1c-1, 1c-2]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $x=\tfrac{\pi}{2}$에서 같고 나머지에서 $\sin(x-\cos x)<\sin x$라는 정리된 결론을 올바르게 제시했다(평가지침 20/40).
      depends_on: ['1.M1']
      steps: [1b-4, 1c-2]
    deductions: []

- id: '2'
  stem: |
    $\displaystyle\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\left\{x\cos^2x+x^3\cos x+\sin x\right\}dx$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 피적분함수가 기함수이므로 대칭 구간 적분값은 0.
    steps:
    - {id: 2a, content: '$g(-x)=-g(x)$ 확인 후 $\int_{-a}^{a}g=0$', criteria: ['2.M1']}
    hint_ladder:
    - 적분 구간이 원점에 대칭이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2021 모의논술 예시답안 1번 p.1 문항 2
    steps:
    - id: 2b-1
      content: |
        $g(x)=x\cos^2x+x^3\cos x+\sin x$라 하면 $x\cos^2x$, $x^3\cos x$, $\sin x$가 모두 기함수이므로 $g(-x)=-g(x)$, 즉 주어진 함수는 원점에 대칭인 함수이다. 따라서 $\left[-\dfrac{\pi}{2},\dfrac{\pi}{2}\right]$에서의 정적분 값은 $0$이다.
      criteria: ['2.M1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $y$축 대칭·원점 대칭 함수의 정적분 성질을 이용해(피적분함수가 기함수임을 밝히고) 답 $0$을 구했다(평가지침 20/20).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    deductions: []

- id: '3'
  stem: |
    $f(x)=2x\cos2x-\sin x$일 때,
    $$\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\{2xf(x)-\cos2x\}\,dx+\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\left[\,2x\{2xf(x)-\cos2x\}-f(x)\,\right]dx$$
    의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '-2*pi - 4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 첫째 피적분함수는 우함수, 둘째는 기함수이므로 $2\int_0^{\pi/2}\{4x^2\cos2x-2x\sin x-\cos2x\}dx$만 부분적분으로 계산.
    steps:
    - {id: 3a, content: '$=2\int_0^{\pi/2}\{4x^2\cos2x-2x\sin x-\cos2x\}dx=-2\pi-4+0$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 두 피적분함수를 전개해 각 항의 대칭성을 살펴보자.
    - 남는 적분은 $x^2\cos2x$, $x\sin x$의 부분적분이다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2021 모의논술 예시답안 1번 p.1 문항 3
    steps:
    - id: 3b-1
      content: |
        (1) $2xf(x)-\cos2x=4x^2\cos2x-2x\sin x-\cos2x$
        (2) $2x\{2xf(x)-\cos2x\}=8x^3\cos2x-4x^2\sin x-4x\cos2x+\sin x$ 이므로 둘째 피적분함수는 $2x\{2xf(x)-\cos2x\}-f(x)=8x^3\cos2x-4x^2\sin x-6x\cos2x+2\sin x$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (1)의 함수는 $y$축에 대칭인 함수, (2)의 함수는 원점에 대칭인 함수이다. 그러므로
        $$(\text{주어진 식})=2\int_0^{\frac{\pi}{2}}\{2xf(x)-\cos2x\}dx=2\int_0^{\frac{\pi}{2}}\{4x^2\cos2x-2x\sin x-\cos2x\}dx.$$
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        부분적분으로
        $2\displaystyle\int_0^{\frac{\pi}{2}}4x^2\cos2x\,dx=2\Big[2x^2\sin2x+2x\cos2x-\sin2x\Big]_0^{\frac{\pi}{2}}=-2\pi$,
        $-2\displaystyle\int_0^{\frac{\pi}{2}}2x\sin x\,dx=\Big[4x\cos x-4\sin x\Big]_0^{\frac{\pi}{2}}=-4$,
        $-2\displaystyle\int_0^{\frac{\pi}{2}}\cos2x\,dx=0$.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        따라서 구하는 값은 $-2\pi-4$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        대칭성으로 둘째 적분이 $0$이고 실제로 계산해야 하는 정적분이 $2\int_0^{\pi/2}\{4x^2\cos2x-2x\sin x-\cos2x\}dx$임을 파악했다(평가지침 20/40).
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
      points: 10
      evidence: |
        부분적분 등을 활용하여 정확한 값 $-2\pi-4$를 구했다(평가지침 20/40).
      depends_on: ['3.M1']
      steps: [3b-3, 3b-4]
    deductions: []

