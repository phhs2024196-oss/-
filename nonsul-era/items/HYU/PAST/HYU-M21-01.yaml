intent: |
  삼각함수를 주제로 함수의 증감, 함수의 대칭성(우함수·기함수)에 따른 정적분 값, 부분적분법을 기초 지식으로 하여 주어진 상황에 적용할 수 있는지를 본다.
key_idea: |
  $\cos x$의 부호로 $x-\cos x$와 $x$의 대소를 정하고 $\sin x$의 증감을 적용한다. 적분은 피적분함수를 우함수·기함수로 나누어 기함수 부분을 지운다.
stuck: |
  1.에서 $x=\tfrac{\pi}{2}$ 앞뒤로 $\sin x$의 증감이 바뀌는 것과 $x-\cos x$가 $x$보다 작거나 큰 것이 맞물려 두 구간 모두 $\sin(x-\cos x)<\sin x$가 되는 점, 3.에서 두 적분을 더하면 기함수 부분이 사라지고 남는 적분만 계산하면 된다는 점
