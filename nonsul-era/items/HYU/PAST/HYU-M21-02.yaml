stem: |
  다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    임의의 실수 $t$에 대해,
    $$\sin(t)\sin\left(\frac{\pi}{3}-t\right)=a\cos(bt+c)+d$$
    를 만족시키는 상수 $a,b,c,d$들의 집합 $\{a,b,c,d\}$를 하나 구하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: 'a = 1/2; b = 2; c = -pi/3; d = -1/4', equivalents: ['a = 1/2; b = -2; c = pi/3; d = -1/4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\cos(t-(\tfrac{\pi}{3}-t))-\cos(t+(\tfrac{\pi}{3}-t))=2\sin t\sin(\tfrac{\pi}{3}-t)$.
    steps:
    - {id: 1a, content: '$\sin t\sin(\tfrac{\pi}{3}-t)=\tfrac12\cos(2t-\tfrac{\pi}{3})-\tfrac14$', criteria: ['1.M1']}
    hint_ladder:
    - 코사인의 덧셈정리 두 식을 빼 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2021 모의논술 예시답안 2번 p.2 문항 1
    steps:
    - id: 1b-1
      content: |
        $\cos(t)\cos\left(\dfrac{\pi}{3}-t\right)+\sin(t)\sin\left(\dfrac{\pi}{3}-t\right)=\cos\left(t-\left(\dfrac{\pi}{3}-t\right)\right)=\cos\left(2t-\dfrac{\pi}{3}\right)$
        $\cos(t)\cos\left(\dfrac{\pi}{3}-t\right)-\sin(t)\sin\left(\dfrac{\pi}{3}-t\right)=\cos\left(t+\left(\dfrac{\pi}{3}-t\right)\right)=\dfrac12$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        변변 빼서 정리하면 $\sin(t)\sin\left(\dfrac{\pi}{3}-t\right)=\dfrac12\cos\left(2t-\dfrac{\pi}{3}\right)-\dfrac14$이므로 $a=\dfrac12$, $b=2$, $c=-\dfrac{\pi}{3}$, $d=-\dfrac14$이다. 따라서 구하는 답은 $\left\{\dfrac12,\,2,\,-\dfrac{\pi}{3},\,-\dfrac14\right\}$이다.
      criteria: ['1.M1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        삼각함수의 덧셈정리를 이용해서 항등식을 만족하는 상수 $a,b,c,d$를 바르게 구했다(평가지침 20/20).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    deductions: []

- id: '2'
  stem: |
    한 변의 길이가 $1$인 정삼각형 $\mathrm{ABC}$가 있다. $0\le t\le\dfrac{\pi}{3}$인 $t$에 대해,
    선분 $\mathrm{AB}$를 점 $\mathrm{A}$를 중심으로 $t$만큼 회전시켜 얻어진 선분을 $l$,
    선분 $\mathrm{BC}$를 점 $\mathrm{B}$를 중심으로 $t$만큼 회전시켜 얻어진 선분을 $m$,
    선분 $\mathrm{CA}$를 점 $\mathrm{C}$를 중심으로 $t$만큼 회전시켜 얻어진 선분을 $n$이라 하자.
    그림과 같이 선분 $l$과 $m$의 교점을 $\mathrm{P}$, 선분 $m$과 $n$의 교점을 $\mathrm{Q}$, 선분 $n$과 $l$의 교점을 $\mathrm{R}$이라 하고, 삼각형 $\mathrm{PQR}$의 넓이를 $S(t)$라 할 때, $\displaystyle\int_0^{\frac{\pi}{3}}S(t)\,dt$의 값을 구하시오.
    [그림: A는 왼쪽 아래, B는 오른쪽 아래, C는 위쪽 꼭짓점인 정삼각형 ABC. A에서 변 AB와 각 $t$를 이루며 삼각형 안쪽(위쪽)으로 뻗은 선분 $l$, B에서 변 BC와 각 $t$를 이루며 안쪽으로 뻗은 선분 $m$, C에서 변 CA와 각 $t$를 이루며 안쪽으로 뻗은 선분 $n$이 그려져 있다(회전 방향은 세 꼭짓점 모두 같은 방향, 반시계). $l$과 $m$의 교점 P는 B 가까이, $m$과 $n$의 교점 Q는 C 가까이, $n$과 $l$의 교점 R은 A 가까이 있으며, 내부에 작은 삼각형 PQR이 생긴다. 각 꼭짓점의 각 $t$가 표시되어 있다.]
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: 'sqrt(3)*pi/6 - 3/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $S(t)=\tfrac{\sqrt3}{4}-3\cdot\tfrac{1}{\sqrt3}\sin t\sin(\tfrac{\pi}{3}-t)=\tfrac{\sqrt3}{2}\left(1-\cos(2t-\tfrac{\pi}{3})\right)$.
    steps:
    - {id: 2a, content: '$\int_0^{\pi/3}\tfrac{\sqrt3}{2}(1-\cos(2t-\tfrac{\pi}{3}))dt=\tfrac{\sqrt3}{6}\pi-\tfrac34$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 삼각형 PQR 바깥의 세 삼각형은 서로 합동이다.
    - 삼각형 ABP의 두 밑각은 $t$와 $\tfrac{\pi}{3}-t$이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2021 모의논술 예시답안 2번 p.2 문항 2
    steps:
    - id: 2b-1
      content: |
        먼저 삼각형 $\mathrm{ABP}$의 넓이를 구하자. $\mathrm{P}$에서 $\mathrm{AB}$에 내린 수선의 길이를 $h$, 수선의 발까지 $\mathrm{A}$로부터의 거리를 $x$라 하면 그림으로부터 $\tan(t)=\dfrac{h}{x}$, $\tan\left(\dfrac{\pi}{3}-t\right)=\dfrac{h}{1-x}$이다.
        [그림: 밑변 AB(길이 1) 위의 삼각형 ABP, A의 각 $t$, B의 각 $\tfrac{\pi}{3}-t$, 높이 $h$가 밑변을 $x$와 $1-x$로 나눔]
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 $h=\dfrac{\tan(t)\tan\left(\frac{\pi}{3}-t\right)}{\tan(t)+\tan\left(\frac{\pi}{3}-t\right)}=\dfrac{\sin(t)\sin\left(\frac{\pi}{3}-t\right)}{\sin\left(t+\left(\frac{\pi}{3}-t\right)\right)}=\dfrac{2}{\sqrt3}\sin(t)\sin\left(\dfrac{\pi}{3}-t\right)$이므로, 삼각형 $\mathrm{ABP}$의 넓이는 $\dfrac12\cdot1\cdot h=\dfrac{1}{\sqrt3}\sin(t)\sin\left(\dfrac{\pi}{3}-t\right)$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        삼각형 $\mathrm{PQR}$의 넓이 $S(t)$는 (삼각형 $\mathrm{ABC}$의 넓이) $-$ (삼각형 $\mathrm{ABP}$의 넓이) $-$ (삼각형 $\mathrm{BCQ}$의 넓이) $-$ (삼각형 $\mathrm{CAR}$의 넓이) $=$ (삼각형 $\mathrm{ABC}$의 넓이) $-3\cdot$(삼각형 $\mathrm{ABP}$의 넓이)
        $=\dfrac{\sqrt3}{4}-3\cdot\dfrac{1}{\sqrt3}\sin(t)\sin\left(\dfrac{\pi}{3}-t\right)=\dfrac{\sqrt3}{2}\left(1-\cos\left(2t-\dfrac{\pi}{3}\right)\right)$ (1.의 결과 이용)이므로,
        (공식 예시답안에는 첫 빼는 항이 「삼각형 PQR의 넓이」로 적혀 있으나 문맥상 「삼각형 ABP의 넓이」의 오기이므로 고쳐 옮김.)
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        $\displaystyle\int_0^{\frac{\pi}{3}}S(t)\,dt=\int_0^{\frac{\pi}{3}}\frac{\sqrt3}{2}\left(1-\cos\left(2t-\frac{\pi}{3}\right)\right)dt=\frac{\sqrt3}{2}\left[t-\frac12\sin\left(2t-\frac{\pi}{3}\right)\right]_0^{\frac{\pi}{3}}=\frac{\sqrt3}{2}\left(\frac{\pi}{3}-\frac{\sqrt3}{2}\right)=\frac{\sqrt3}{6}\pi-\frac34$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        삼각형 $\mathrm{ABP}$의 넓이 $\dfrac{1}{\sqrt3}\sin t\sin(\tfrac{\pi}{3}-t)$(또는 동치식)를 구했다(평가지침 20/40).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        $S(t)=\triangle\mathrm{ABC}-3\triangle\mathrm{ABP}$로 정적분 $\int_0^{\pi/3}S(t)dt=\tfrac{\sqrt3}{6}\pi-\tfrac34$를 구했다(평가지침 20/40).
      depends_on: ['2.M1']
      steps: [2b-3, 2b-4]
    deductions: []

- id: '3'
  stem: |
    곡선 $y=x\ln x$와 이 곡선 위의 점 $(1,0)$에서의 접선, 그리고 직선 $x=t$(단, $t>1$)로 둘러싸인 도형의 넓이를 $P(t)$라 하고, 곡선 $y=\ln x$와 이 곡선 위의 점 $(1,0)$에서의 접선, 그리고 직선 $x=t$(단, $t>1$)로 둘러싸인 도형의 넓이를 $Q(t)$라 하자.
    극한값 $\displaystyle\lim_{t\to\infty}\frac{P(t)}{t\,Q(t)}$를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 두 접선 모두 $y=x-1$. $P(t)=\tfrac12t^2\ln t-\tfrac34t^2+t-\tfrac14$, $Q(t)=\tfrac12t^2-t\ln t-\tfrac12$이고 분자·분모를 $t^3$으로 나누면 $\tfrac{\ln t}{t}\to0$으로 극한 $0$.
    steps:
    - {id: 3a, content: '$\dfrac{P}{tQ}=\dfrac{\frac{\ln t}{2t}-\frac{3}{4t}+\frac1{t^2}-\frac1{4t^3}}{\frac12-\frac{\ln t}{t}-\frac1{2t^2}}\to0$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - 두 곡선의 $(1,0)$에서의 접선을 각각 구해 보자.
    - $x\ln x$, $\ln x$의 적분은 부분적분이다.
    - $\dfrac{\ln t}{t}$의 극한을 이용하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2021 모의논술 예시답안 2번 p.2 문항 3
    steps:
    - id: 3b-1
      content: |
        먼저 $P(t)$를 구하자. $(x\ln x)'=\ln x+1$이므로 곡선 $y=x\ln x$에 $(1,0)$에서 접하는 직선의 기울기는 $1$이고 직선의 방정식은 $y=x-1$이다. 따라서 부분적분을 이용하면
        $$P(t)=\int_1^t\{x\ln x-(x-1)\}dx=\left[\frac12x^2\ln x\right]_1^t-\int_1^t\frac12x\,dx-\int_1^t(x-1)\,dx=\frac12t^2\ln t-\left[\frac34x^2-x\right]_1^t=\frac12t^2\ln t-\frac34t^2+t-\frac14$$
        이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        그리고 $Q(t)$를 구하자. $(\ln x)'=\dfrac1x$이므로 곡선 $y=\ln x$에 접하고 $(1,0)$을 지나는 접선의 기울기는 $1$이고 직선의 방정식은 $y=x-1$이다. 마찬가지로 부분적분을 이용하면
        $$Q(t)=\int_1^t\{(x-1)-\ln x\}dx=\frac12t^2-t\ln t-\frac12$$
        을 얻는다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        한편, 양수 $x$에 대하여 $\ln x<x$이므로 $\ln x=\ln(\sqrt x)^2=2\ln\sqrt x<2\sqrt x$를 얻을 수 있고, 이를 이용하면 $x>1$인 $x$에 대하여 $0<\dfrac{\ln x}{x}<\dfrac{2}{\sqrt x}$가 된다. 이때 $\lim_{x\to\infty}\dfrac{2}{\sqrt x}=0$이므로 $\lim_{x\to\infty}\dfrac{\ln x}{x}=0$이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        극한값을 구하면
        $$\lim_{t\to\infty}\frac{P(t)}{tQ(t)}=\lim_{t\to\infty}\frac{\frac12t^2\ln t-\frac34t^2+t-\frac14}{t\left(\frac12t^2-t\ln t-\frac12\right)}=\lim_{t\to\infty}\frac{\frac{\ln t}{2t}-\frac{3}{4t}+\frac{1}{t^2}-\frac{1}{4t^3}}{\frac12-\frac{\ln t}{t}-\frac{1}{2t^2}}=0$$
        임을 알 수 있다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        접선 $y=x-1$과 부분적분을 이용하여 $P(t)=\tfrac12t^2\ln t-\tfrac34t^2+t-\tfrac14$를 정확히 구했다(평가지침 10/40).
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: |
        접선 $y=x-1$과 부분적분을 이용하여 $Q(t)=\tfrac12t^2-t\ln t-\tfrac12$를 정확히 구했다(평가지침 10/40).
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 10
      evidence: |
        극한값 $\lim_{x\to\infty}\tfrac{\ln x}{x}=0$을 활용하여 $\lim_{t\to\infty}\tfrac{P(t)}{tQ(t)}=0$을 정확히 구했다(평가지침 20/40).
      depends_on: ['3.M1', '3.M2']
      steps: [3b-3, 3b-4]
