intent: |
  삼각함수의 덧셈정리를 이해하여 활용하는지, 삼각형의 넓이를 삼각함수로 나타내고 앞 문항의 결과로 삼각함수의 정적분을 계산하는지, 접선의 기울기·부정적분(부분적분)·함수의 극한을 활용하는지를 본다.
key_idea: |
  곱 $\sin t\sin(\tfrac{\pi}{3}-t)$를 덧셈정리의 두 식의 차로 $\tfrac12\cos(2t-\tfrac{\pi}{3})-\tfrac14$로 바꾸고, 이를 $S(t)=\triangle\mathrm{ABC}-3\triangle\mathrm{ABP}$에 대입해 적분한다. 극한은 $\lim\tfrac{\ln x}{x}=0$으로 처리한다.
stuck: |
  $S(t)$를 직접 구하지 않고 정삼각형에서 합동인 세 삼각형 $\mathrm{ABP},\mathrm{BCQ},\mathrm{CAR}$를 빼는 발상, 그리고 $\triangle\mathrm{ABP}$의 높이를 $\tan$ 두 개로 나타내는 계산
idea_tags: [IDEA-PRODUCT-TO-SUM, IDEA-AREA-COMPLEMENT-SYMMETRY, IDEA-LOG-OVER-X-LIMIT]
tags: [삼각함수 덧셈정리, 회전, 정적분, 부분적분, 극한, 배점환산]
