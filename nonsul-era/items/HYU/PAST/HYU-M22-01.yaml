intent: |
  함수의 극한, 정적분의 활용, 정적분과 급수의 관계, 평균값 정리를 이해하는지 묻는다. 제시문의 극한 대소 관계(조임 정리)와 정적분·급수의 관계식을 적절히 이용해 극한값을 구할 수 있는지 측정한다.
key_idea: |
  $\tfrac{1}{\sqrt x}$의 그래프로 합을 적분 사이에 끼우고 조임 정리를 쓴다. 3.은 (다)의 등식과 평균값 정리로 $f(\tfrac kn)-f(x)$를 $f'$의 범위로 감싸 2.의 두 극한으로 끼운다.
stuck: |
  3.에서 $\sum(\tfrac kn)^5-n\int_0^1x^5dx$를 (다)의 적분합으로 바꾼 뒤 평균값 정리로 $5(\tfrac{k-1}{n})^4(\tfrac kn-x)$와 $5(\tfrac kn)^4(\tfrac kn-x)$ 사이에 끼우는 발상 — 2.가 그 양 끝의 극한이라는 연결
