intent: |
  타원의 기본 성질과 음함수의 미분법·삼각함수의 덧셈정리를 활용해 결과를 도출하는지(1.), 함수의 극한으로 다항함수를 결정하고 최솟값을 구하는지(2.), 속도·가속도의 개념과 삼각함수의 미분법으로 최댓값·최솟값을 구하는지(3.)를 묻는다.
key_idea: |
  타원의 반사 성질(초점 $\mathrm F$에서 출발해 $\mathrm P$에서 반사된 공은 다른 초점 $\mathrm F'$을 지난다)로 $\mathrm Q$가 직선 $\mathrm{PF'}$ 위에 있고, 법선이 $\angle\mathrm{FPQ}$를 이등분하므로 두 직선의 기울기는 $\tan(\alpha\pm\tfrac{\pi}{4})$이다.
stuck: |
  1.에서 공의 경로가 다른 초점을 지난다는 사실과 법선의 기울기 $\tfrac{4y_0}{x_0}$를 이용해 두 기울기 조건을 세우는 것, 그리고 넓이를 $x$축(직선 $\mathrm{FF'}$)으로 두 삼각형으로 나누어 구하는 것
