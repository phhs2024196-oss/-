stem: |
  다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    장축의 길이가 $4$, 단축의 길이가 $2$인 타원 모양의 당구대 위의 한 초점 $\mathrm F$에 공이 놓여 있다. 이 공을 쳤을 때 그림과 같이 공은 타원 둘레의 점 $\mathrm P$를 지나 점 $\mathrm Q$에 닿았다. 이때 점 $\mathrm F,\mathrm P$를 지나는 직선과 점 $\mathrm P$에서의 접선이 이루는 예각과 점 $\mathrm P,\mathrm Q$를 지나는 직선과 점 $\mathrm P$에서의 접선이 이루는 예각은 서로 같다.
    $\angle\mathrm{FPQ}=\dfrac{\pi}{2}$일 때, 삼각형 $\mathrm{FPQ}$의 넓이를 구하시오.
    [그림: 가로로 긴 타원. 왼쪽 안쪽에 초점 F, 아래쪽 둘레 위에 점 P, 오른쪽 둘레 위에 점 Q. 선분 FP, PQ, FQ가 그어져 있고 P에서 타원에 접하는 직선이 그려져 있으며, P에 직각 표시와 접선과 이루는 두 예각이 같다는 표시가 있다.]
  points: 20
  depends_on: []
  answer: {kind: set, value: '{24/17 - 4*sqrt(2)/17, 24/17 + 4*sqrt(2)/17}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 반사 성질로 Q는 직선 $\mathrm{PF'}$ 위. 법선 기울기 $\tfrac{4y_0}{x_0}=\tan\alpha$, 직선 FP·PQ의 기울기는 $\tan(\alpha\pm\tfrac{\pi}{4})$.
    steps:
    - {id: 1a, content: '$\mathrm P(\mp\tfrac{2\sqrt2}{\sqrt3},-\tfrac1{\sqrt3})$, 넓이 $=\tfrac12\cdot2\sqrt3(|y_0|+|y_1|)=\tfrac{24}{17}\mp\tfrac{4}{17}\sqrt2$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 타원의 한 초점에서 출발해 둘레에서 반사된 공은 어디를 지나는가?
    - 법선이 $\angle\mathrm{FPQ}$를 이등분한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2022 모의논술 예시답안 2번 p.2 문항 1
    steps:
    - id: 1b-1
      content: |
        타원을 좌표평면에 두어 $x^2+4y^2=4$라 하자. 공이 초점 $\mathrm F(-\sqrt3,0)$에 있고 점 $\mathrm P(x_0,y_0)$는 $x$축 아래에 있다고 가정하자. 다른 초점 $\mathrm F'(\sqrt3,0)$은 점 $\mathrm P(x_0,y_0)$와 점 $\mathrm Q(x_1,y_1)$를 지나는 직선 위에 놓여 있다. 점 $\mathrm P$에서의 타원의 법선과 $x$축의 양의 방향이 이루는 각을 $\alpha$라 하면, 이 법선의 기울기는 $\tan\alpha=\dfrac{4y_0}{x_0}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 점 $\mathrm F,\mathrm P$를 지나는 직선의 기울기는 $\dfrac{y_0-0}{x_0-(-\sqrt3)}=\tan\left(\alpha+\dfrac{\pi}{4}\right)=\dfrac{\frac{4y_0}{x_0}+1}{1-\frac{4y_0}{x_0}}$, 점 $\mathrm P,\mathrm Q$를 지나는 직선의 기울기는 $\dfrac{y_0-0}{x_0-\sqrt3}=\tan\left(\alpha-\dfrac{\pi}{4}\right)=\dfrac{\frac{4y_0}{x_0}-1}{1+\frac{4y_0}{x_0}}$이다.
        [그림: P가 왼쪽 아래인 경우와 오른쪽 아래인 경우 두 그림, 각 $\alpha$ 표시]
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        이로부터 점 $\mathrm P(x_0,y_0)$는 $\left(-\dfrac{2\sqrt2}{\sqrt3},-\dfrac{1}{\sqrt3}\right)$ 또는 $\left(\dfrac{2\sqrt2}{\sqrt3},-\dfrac1{\sqrt3}\right)$이고, 점 $\mathrm Q(x_1,y_1)$의 $y$좌표는 각각 $y_1=\dfrac{\sqrt3}{21+12\sqrt2}$ 또는 $y_1=\dfrac{\sqrt3}{21-12\sqrt2}$이다.
      criteria: ['1.M1']
    - id: 1b-4
      content: |
        따라서 삼각형 $\mathrm{FPQ}$의 넓이 $=$ 삼각형 $\mathrm{FPF'}$의 넓이 $+$ 삼각형 $\mathrm{FQF'}$의 넓이 $=\dfrac12\cdot2\sqrt3\cdot|y_0|+\dfrac12\cdot2\sqrt3\cdot|y_1|=\dfrac{24}{17}-\dfrac{4}{17}\sqrt2$ 또는 $\dfrac{24}{17}+\dfrac4{17}\sqrt2$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 반사 성질로 $\angle\mathrm{FPF'}=\tfrac{\pi}{2}$. $\mathrm{PF}+\mathrm{PF'}=4$, $\mathrm{PF}^2+\mathrm{PF'}^2=12$에서 $\mathrm{PF}=2\pm\sqrt2$, 그 다음 직선 $\mathrm{PF'}$와 타원의 다른 교점 Q를 구해 직각삼각형 넓이 $\tfrac12\mathrm{PF}\cdot\mathrm{PQ}$로 계산한다(공식 자료에 없는 풀이).
    steps:
    - id: 1c-1
      content: |
        $\mathrm{PF}\cdot\mathrm{PF'}=\dfrac{4^2-12}{2}=2$이므로 $\{\mathrm{PF},\mathrm{PF'}\}=\{2+\sqrt2,2-\sqrt2\}$. 초점 $\mathrm F'$을 지나는 초점현의 성질(또는 극좌표 $r=\dfrac{b^2/a}{1+e\cos\theta}$)로 $\mathrm{F'Q}$를 구해 $\mathrm{PQ}=\mathrm{PF'}+\mathrm{F'Q}$, 넓이 $\dfrac12\mathrm{PF}\cdot\mathrm{PQ}=\dfrac{24\mp4\sqrt2}{17}$.
      criteria: ['1.M1', '1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        점 $\mathrm P$의 좌표 $\left(\mp\tfrac{2\sqrt2}{\sqrt3},-\tfrac1{\sqrt3}\right)$(또는 대칭인 점)를 잘 구했다(평가지침 20/40).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1b-3, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        삼각형 $\mathrm{FPQ}$의 넓이 $\tfrac{24}{17}\mp\tfrac4{17}\sqrt2$를 잘 구했다(평가지침 20/40).
      depends_on: ['1.M1']
      steps: [1b-4, 1c-1]
    deductions: []
  misconceptions: []

- id: '2'
  stem: |
    다항함수 $f(x)$가 $\displaystyle\lim_{x\to\infty}\frac{f(x)}{x^2+2x+3}=4$, $\displaystyle\lim_{x\to-1}\frac{x+1}{f(x)}=-\frac17$을 만족시킬 때, $-2\le t\le2$인 $t$에 대하여 $g(t)=\displaystyle\int_{-t}^{t}f(x)\,dx$라 하자. $g(t)$의 최솟값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '-28/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=4(x+1)(x+c)$, $\tfrac{1}{4(c-1)}=-\tfrac17$에서 $f=4x^2+x-3$, $g(t)=\tfrac83t^3-6t$.
    steps:
    - {id: 2a, content: '$g(-2)=-\tfrac{28}{3}<g(\tfrac{\sqrt3}{2})=-2\sqrt3$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 첫 극한에서 $f$의 차수와 최고차항, 둘째 극한에서 $f(-1)$을 알 수 있다.
    - 극솟값과 구간 끝값을 비교하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2022 모의논술 예시답안 2번 p.2 문항 2
    steps:
    - id: 2b-1
      content: |
        $\displaystyle\lim_{x\to\infty}\frac{f(x)}{x^2+2x+3}=4$로부터 다항함수 $f(x)$는 $f(x)=4x^2+ax+b$라 할 수 있고, $\displaystyle\lim_{x\to-1}\frac{x+1}{f(x)}=-\frac17$로부터 $f(x)$는 $(x+1)$을 인수로 갖는 것을 알 수 있다. $f(x)=4(x+1)(x+c)$라 할 때, $\displaystyle\lim_{x\to-1}\frac{x+1}{f(x)}=\lim_{x\to-1}\frac{1}{4(x+c)}=\frac{1}{4(c-1)}=-\frac17$이므로 $c=-\dfrac34$가 되어 $f(x)=4x^2+x-3$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 $g(t)=\displaystyle\int_{-t}^{t}(4x^2+x-3)dx=\frac83t^3-6t$이다. $g'(t)=8t^2-6=8\left(t^2-\dfrac34\right)$이므로 $g(t)$는 $t=\dfrac{\sqrt3}{2}$에서 극솟값을 갖는다.
        $g(-2)=-\dfrac{28}{3}<-2\sqrt3=g\left(\dfrac{\sqrt3}{2}\right)$이므로, $g(t)$는 $t=-2$에서 최솟값 $g(-2)=-\dfrac{28}{3}$을 갖는다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        다항함수 $f(x)=4x^2+x-3$을 잘 구했다(평가지침 10/30).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        그래프의 개형(극솟값과 구간 끝값 비교)을 이용하여 $g(t)$의 최솟값 $-\tfrac{28}{3}$을 잘 구했다(평가지침 20/30).
      depends_on: ['2.M1']
      steps: [2b-2]
    deductions: []
  misconceptions: []

- id: '3'
  stem: |
    좌표평면 위를 움직이는 점 $\mathrm P(x,y)$의 시각 $t$에서의 위치가
    $$x=2\cos t,\quad y=\sin t$$
    일 때, 시각 $t$에서의 점 $\mathrm P$의 속력을 $f(t)$, 가속도의 크기를 $g(t)$라 하자.
    $0\le t\le2$인 $t$에 대하여 $\dfrac{f(t)}{g(t)}$의 최댓값과 최솟값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 'max = 2; min = 1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f=\sqrt{1+3\sin^2t}$, $g=\sqrt{1+3\cos^2t}$, $h'(t)$의 부호는 $\sin t\cos t$의 부호.
    steps:
    - {id: 3a, content: '$h(0)=\tfrac12$ 최소, $h(\tfrac{\pi}{2})=2$ 최대($\tfrac{\pi}{2}<2$)', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 속도와 가속도 벡터의 크기를 각각 구하자.
    - $\tfrac{\pi}{2}$가 구간 $[0,2]$ 안에 있다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2022 모의논술 예시답안 2번 p.2 문항 3
    steps:
    - id: 3b-1
      content: |
        $f(t)=\sqrt{(-2\sin t)^2+(\cos t)^2}=\sqrt{1+3\sin^2t}$, $g(t)=\sqrt{(-2\cos t)^2+(-\sin t)^2}=\sqrt{1+3\cos^2t}$이다. $h(t)=\dfrac{f(t)}{g(t)}$라 하자.
        $$h'(t)=\frac{\frac{6\sin t\cos t}{2\sqrt{1+3\sin^2t}}\sqrt{1+3\cos^2t}-\sqrt{1+3\sin^2t}\,\frac{-6\cos t\sin t}{2\sqrt{1+3\cos^2t}}}{1+3\cos^2t}=\frac{3\sin t\cos t(1+3\cos^2t+1+3\sin^2t)}{(1+3\cos^2t)\sqrt{1+3\sin^2t}\sqrt{1+3\cos^2t}}=\frac{15\sin t\cos t}{(1+3\cos^2t)\sqrt{1+3\sin^2t}\sqrt{1+3\cos^2t}}$$
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $h'(t)$의 분자가 $0$이 되는 경우를 살펴보면, 정수 $n$에 대하여 $h'\left(\dfrac{n\pi}{2}\right)=0$이므로 $t=\dfrac{n\pi}{2}$에서 극값을 갖는다. 정수 $n$에 대하여 $t=n\pi$에서 극솟값 $h(n\pi)=\dfrac12$, $t=n\pi+\dfrac{\pi}{2}$에서 극댓값 $h\left(n\pi+\dfrac{\pi}{2}\right)=2$를 가지고, 실수 $t$에 대해서 $\dfrac12\le h(t)\le2$를 만족한다. 따라서 $0\le t\le2$인 $t$에 대하여 $h(t)$는 최솟값 $h(0)=\dfrac12$, 최댓값 $h\left(\dfrac{\pi}{2}\right)=2$를 갖는다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        속력·가속도의 크기를 구하고 $\tfrac{f(t)}{g(t)}$의 도함수를 잘 구했다(평가지침 20/30).
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
