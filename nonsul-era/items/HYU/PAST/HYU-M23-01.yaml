  - '쌍곡선 $\tfrac{x^2}{a^2}-\tfrac{y^2}{b^2}=1$, 초점 $\mathrm P(-c,0)$, $\mathrm A(c,0)$, 꼭짓점에서 $\overline{\mathrm{AQ}}$ 최소'
  - '이등변삼각형의 중선 ⟂ 밑변, 피타고라스 정리'
