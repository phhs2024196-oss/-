intent: |
  평면벡터와 그 내적, 코사인법칙, 쌍곡선의 의미, 부분적분법, 치환적분법 등 고교 교육과정의 중요한 개념과 법칙을 이해하고 적절히 활용할 수 있는지를 물어 문제 이해도와 활용도를 측정한다.
key_idea: |
  변의 비 $2:1:2$에서 $\cos B=\tfrac14$, $\cos A=\tfrac78$을 얻는다. 2.의 세 등식은 $\mathrm B,\mathrm C,\mathrm Q$가 두 점 $\mathrm P,\mathrm A$를 초점으로 하는 쌍곡선 위에 있다는 뜻이고, 3.은 부분적분과 치환 $x=\tfrac{\pi}{2}-t$로 두 적분의 $\int_0^\theta f(\cos x)dx$가 상쇄되어 $-\theta f(\cos\theta)$만 남는다.
stuck: |
  2.에서 거리의 차가 일정하다는 등식을 쌍곡선의 정의로 읽어 내고, $\mathrm{PB}=\mathrm{PC}+\mathrm{BC}$에서 $\mathrm C$가 선분 $\mathrm{PB}$ 위에 있음을 알아 $\mathrm{PA}$를 구하는 것. 3.에서 첫 적분을 $(xf(\cos x))'$의 부분적분으로 보는 것
