stimuli:
- label: 제시문
  body: |
    평면 위의 삼각형 $\mathrm{ABC}$의 세 변의 길이의 비가 $\overline{\mathrm{AB}}:\overline{\mathrm{BC}}:\overline{\mathrm{CA}}=2:1:2$이다.

stem: |
  다음 제시문을 읽고 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    $\left|\overrightarrow{\mathrm{AB}}+\dfrac32\overrightarrow{\mathrm{BC}}\right|=2$인 경우 $\overline{\mathrm{AB}}$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '8/sqrt(19)', equivalents: ['8*sqrt(19)/19'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 제곱하여 내적으로 전개하고 $\cos B=\tfrac14$를 쓴다.
    steps:
    - {id: 1a, content: '$|\overrightarrow{\mathrm{AB}}|=4d$, $|\overrightarrow{\mathrm{BC}}|=2d$이면 $19d^2=4$, $\overline{\mathrm{AB}}=\tfrac{8}{\sqrt{19}}$', criteria: ['1.R1', '1.A1']}
    hint_ladder:
    - 벡터의 크기는 제곱하면 내적이 된다.
    - 각 B의 코사인을 변의 비로 구하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 모의논술 예시답안 1번 p.1 문항 1
    steps:
    - id: 1b-1
      content: |
        $\left(\overrightarrow{\mathrm{AB}}+\dfrac32\overrightarrow{\mathrm{BC}}\right)\cdot\left(\overrightarrow{\mathrm{AB}}+\dfrac32\overrightarrow{\mathrm{BC}}\right)=4$이고 $\overrightarrow{\mathrm{AB}}\cdot\overrightarrow{\mathrm{BC}}=-(\overrightarrow{\mathrm{BA}}\cdot\overrightarrow{\mathrm{BC}})$이므로
        $$|\overrightarrow{\mathrm{AB}}|^2+\frac94|\overrightarrow{\mathrm{BC}}|^2-3(\overrightarrow{\mathrm{BA}}\cdot\overrightarrow{\mathrm{BC}})=4.$$
      criteria: ['1.R1']
    - id: 1b-2
      content: |
        $\cos B=\dfrac14$이다. $|\overrightarrow{\mathrm{AB}}|=4d$라 하면 $|\overrightarrow{\mathrm{BC}}|=2d$이므로 $\overrightarrow{\mathrm{BA}}\cdot\overrightarrow{\mathrm{BC}}=4d\cdot2d\cdot\dfrac14=2d^2$이고, 위의 등식으로부터 $19d^2=4$임을 알 수 있다.
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        따라서 $\overline{\mathrm{AB}}=|\overrightarrow{\mathrm{AB}}|=\dfrac{8}{\sqrt{19}}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 10
      evidence: |
        내적 전개와 $\cos B=\tfrac14$로 $19d^2=4$(또는 동치)에 이르는 계산 과정을 타당하게 기술했다(평가지침 20/30).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $\overline{\mathrm{AB}}=\tfrac{8}{\sqrt{19}}$을 정확하게 계산했다(평가지침 10/30).
      depends_on: ['1.R1']
      steps: [1b-3]
    deductions: []
  misconceptions: []

- id: '2'
  stem: |
    아래의 등식을 만족하는 평면 위의 두 점 $\mathrm P$와 $\mathrm Q$에 대하여, $\overline{\mathrm{AQ}}$가 최소가 될 때 $\dfrac{\overline{\mathrm{AQ}}}{\overline{\mathrm{BC}}}$의 값을 구하시오.
    $$2(\overline{\mathrm{PB}}-\overline{\mathrm{AB}})=2(\overline{\mathrm{AC}}-\overline{\mathrm{PC}})=2(\overline{\mathrm{AQ}}-\overline{\mathrm{PQ}})=\overline{\mathrm{BC}}$$
  points: 18
  depends_on: []
  answer: {kind: value, value: '(1 + sqrt(31))/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: B, C, Q는 P, A를 초점으로 하는 쌍곡선($2a=\tfrac12\overline{\mathrm{BC}}$) 위. $\overline{\mathrm{AQ}}$ 최소는 P 쪽 꼭짓점에서 $a+c$, $c$는 $\mathrm{PA}=2c$로 결정.
    steps:
    - {id: 2a, content: '$\overline{\mathrm{BC}}=4a$, $\overline{\mathrm{PA}}=2a\sqrt{31}$, $\tfrac{a+c}{4a}=\tfrac{1+\sqrt{31}}{4}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 두 점까지 거리의 차가 일정한 점들의 자취는 무엇인가?
    - 세 점 P, C, B의 위치 관계를 길이로 확인하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 모의논술 예시답안 1번 p.1 문항 2
    steps:
    - id: 2b-1
      content: |
        문제에 주어진 식으로부터 세 점 $\mathrm B,\mathrm C,\mathrm Q$는 두 점 $\mathrm P,\mathrm A$를 초점으로 하는 쌍곡선 위에 있으며, 점 $\mathrm C,\mathrm Q$는 점 $\mathrm P$쪽에, 점 $\mathrm B$는 $\mathrm A$쪽에 가까움을 알 수 있다. 문제는 도형의 위치가 아닌 크기에 관한 것이므로 $\mathrm P=(-c,0)$, $\mathrm A=(c,0)$으로 하고, 쌍곡선은 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$ (단, $b^2=c^2-a^2$, $a>0$)을 만족하는 것으로 하고 문제를 해결하여도 무방하다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이 경우 $\overline{\mathrm{BC}}=4a$이고 $\overline{\mathrm{AB}}=\overline{\mathrm{AC}}=8a$이다. $\overline{\mathrm{AQ}}$가 최소가 되는 경우를 생각하므로 $\mathrm Q=(-a,0)$으로 하고 문제를 생각한다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $2(\overline{\mathrm{PB}}-\overline{\mathrm{AB}})=\overline{\mathrm{BC}}$로부터 $\overline{\mathrm{PB}}=10a$, $2(\overline{\mathrm{AC}}-\overline{\mathrm{PC}})=\overline{\mathrm{BC}}$로부터 $\overline{\mathrm{PC}}=6a$가 되어 $\overline{\mathrm{PB}}=\overline{\mathrm{PC}}+\overline{\mathrm{BC}}$가 성립하여 점 $\mathrm C$가 선분 $\mathrm{PB}$ 위에 있음을 알 수 있는데, 선분 $\mathrm{BC}$의 중점과 점 $\mathrm A$, $\mathrm P$는 직각삼각형을 이루므로 $\overline{\mathrm{PA}}=2a\sqrt{31}$임을 알 수 있다. (중점을 M이라 하면 $\overline{\mathrm{AM}}^2=64a^2-4a^2=60a^2$, $\overline{\mathrm{PM}}=8a$, $\overline{\mathrm{PA}}^2=124a^2$.) 한편 두 초점 사이의 거리 $\overline{\mathrm{PA}}=2c$이므로 $c=a\sqrt{31}$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        따라서 $\dfrac{\overline{\mathrm{AQ}}}{\overline{\mathrm{BC}}}=\dfrac{a+c}{4a}=\dfrac{a+a\sqrt{31}}{4a}=\dfrac{1+\sqrt{31}}{4}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: |
        쌍곡선의 정의를 활용하여 최소 조건을 만족하는 Q의 위치(P 쪽 가지의 꼭짓점)를 찾았다(평가지침 15/35).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        $\overline{\mathrm{PA}}=2a\sqrt{31}$을 얻어 $\tfrac{\overline{\mathrm{AQ}}}{\overline{\mathrm{BC}}}=\tfrac{1+\sqrt{31}}{4}$를 정확하게 계산했다(평가지침 20/35).
      depends_on: ['2.M1']
      steps: [2b-3, 2b-4]
    deductions: []
  misconceptions: []

- id: '3'
  stem: |
    삼각형 $\mathrm{ABC}$의 각 $\mathrm A$의 크기를 $\theta$라고 하자.
    함수 $f(x)=\left(x-\dfrac78\right)^3+\dfrac1\theta$에 대하여 다음 정적분의 값을 구하시오.
    $$\int_0^{\theta}x\sin x\,f^\prime(\cos x)\,dx-\int_{\frac{\pi}{2}-\theta}^{\frac{\pi}{2}}f(\sin x)\,dx$$
  points: 17
  depends_on: []
  answer: {kind: value, value: '-1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 첫 적분 $=-\theta f(\cos\theta)+\int_0^\theta f(\cos x)dx$, 둘째 적분 $=\int_0^\theta f(\cos t)dt$. 차는 $-\theta f(\tfrac78)=-1$.
    steps:
    - {id: 3a, content: '$-\theta f(\cos\theta)=-\theta\cdot\tfrac1\theta=-1$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $x f(\cos x)$를 미분해 보자.
    - 둘째 적분에 $x=\tfrac{\pi}{2}-t$를 대입하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2023 모의논술 예시답안 1번 p.1 문항 3
    steps:
    - id: 3b-1
      content: |
        $(xf(\cos x))^\prime=f(\cos x)-x\sin x f^\prime(\cos x)$이므로 구하는 식의 첫 번째 항에 부분적분법을 적용하면
        $$\int_0^\theta x\sin x f^\prime(\cos x)dx=\big[x(-f(\cos x))\big]_0^\theta+\int_0^\theta f(\cos x)dx.$$
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        두 번째 항에 치환 $x=\dfrac{\pi}{2}-t$를 적용하면
        $$\int_{\frac{\pi}{2}-\theta}^{\frac{\pi}{2}}f(\sin x)dx=\int_\theta^0f\left(\sin\left(\frac{\pi}{2}-t\right)\right)\cdot(-1)\,dt=\int_0^\theta f(\cos t)dt$$
        이다. 따라서 구하고자 하는 값은 $\big[x(-f(\cos x))\big]_0^\theta=-\theta f(\cos\theta)$.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        세 변의 비가 $2:1:2$인 이등변삼각형 $\mathrm{ABC}$에 코사인법칙을 적용하면 $\cos\theta=\dfrac{2^2+2^2-1^2}{2\cdot2\cdot2}=\dfrac78$이다. 따라서 구하고자 하는 값은 $-\theta f(\cos\theta)=-\theta f\left(\dfrac78\right)=-\theta\cdot\dfrac1\theta=-1$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        치환적분법과 부분적분법을 적절히 활용하여 주어진 식을 $-\theta f(\cos\theta)$와 같이 간단하게 바꾸었다(평가지침 20/35).
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
      points: 7
      evidence: |
        코사인법칙으로 $\cos\theta=\tfrac78$을 얻어 $-\theta f(\cos\theta)=-1$을 정확하게 계산했다(평가지침 15/35).
      depends_on: ['3.M1']
      steps: [3b-3]
    deductions: []
  misconceptions: []

