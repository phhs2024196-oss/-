  - '$f(x)=(x-\tfrac78)^3+\tfrac1\theta$, $\int_0^\theta x\sin x f^\prime(\cos x)dx-\int_{\pi/2-\theta}^{\pi/2}f(\sin x)dx$'
  concepts:
