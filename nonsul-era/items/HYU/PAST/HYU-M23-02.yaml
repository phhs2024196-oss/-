intent: |
  수열의 평균으로 이루어진 급수와 정적분의 관계(1.), 주어진 조건으로 연쇄법칙·부분적분법을 활용하는 능력(2.), 삼각함수(코사인법칙)로 원하는 식을 구하고 정적분의 정의·부분적분법으로 극한값을 구하는 능력(3.)을 측정한다.
key_idea: |
  1.은 $x_n=\tfrac1n\sum_{k=1}^{2n}f(\tfrac{2k-1}{2n})$, $f(x)=\tfrac1{1+x}$로 보아 $\int_0^2$. 2.는 $\int f^\prime(t)dt$를 $t$와 곱으로 보고 부분적분해 $f^{\prime\prime}$ 조건을 쓴다. 3.은 $S_k=\sin\tfrac{k\pi}{n+1}$이고 $\tfrac{1}{n+1}\sum\sin^2\to\tfrac1\pi\int_0^\pi\sin^2t\,dt$.
stuck: |
  2.에서 $f^\prime$의 식을 구하지 않고 $\int_x^{\sqrt3x}f^\prime(t)\cdot1\,dt$를 부분적분해 $tf^{\prime\prime}(t)=\sin t$로 만드는 발상. 3.에서 지름 위 원주각이 직각이라 $S_k^2=\tfrac14\overline{\mathrm{AP}_k}^2\overline{\mathrm{P}_k\mathrm B}^2$가 $\sin^2$으로 정리되는 것
idea_tags: [IDEA-RIEMANN-MIDPOINT-SUM, IDEA-IBP-TIMES-ONE, IDEA-INSCRIBED-RIGHT-ANGLE]
tags: [정적분과 급수, 부분적분, 원주각, 코사인법칙, 배점환산, 원문조건모순]
elements:
  materials:
  - '$x_n=\tfrac1n\sum_{k=1}^{2n}\tfrac{2n}{2n+2k-1}$'
  - '$f^{\prime\prime}(x)=\tfrac{\sin x}{x}$, $\lim_{x\to\pi/\sqrt3}f^\prime(x)=\tfrac1{\sqrt3}$, $\lim_{x\to\pi}f^\prime(x)=1$, $\lim\int_x^{\sqrt3x}f^\prime(t)dt$'
  - '반지름 1인 반원의 호를 $n+1$등분하는 점 $\mathrm P_k$, 삼각형 $\mathrm{AP}_k\mathrm B$의 넓이 $S_k$'
  concepts:
  - 정적분과 급수의 합
  - 부분적분법
  - 합성함수의 미분법(연쇄법칙)
  - 코사인법칙
  - 원주각
  tools:
  - '중점 리만합 $\tfrac1n\sum f(\tfrac{2k-1}{2n})\to\int_0^2f$'
  - '$\int f^\prime(t)dt=[tf^\prime(t)]-\int tf^{\prime\prime}(t)dt$'
  - '중심각 $\tfrac{k\pi}{n+1}$에 코사인법칙, $\overline{\mathrm{P}_k\mathrm B}^2=4-\overline{\mathrm{AP}_k}^2$'
  - '$\int\sin^2t\,dt=\tfrac12(t-\cos t\sin t)+C$'
  conditions:
  - '$\overline{\mathrm{AP}_1}=\cdots=\overline{\mathrm P_n\mathrm B}$이면 호가 $n+1$등분 — 중심각 $\tfrac{\pi}{n+1}$씩'
  - '2.의 단서로 주어진 수치($\cos\tfrac{\pi}{\sqrt3}=-0.24$ 등) 중 답에는 $\cos\tfrac{\pi}{\sqrt3}$만 쓰임'
  - '원문 2.의 조건 (i)~(iii)은 서로 정확히 맞지 않음($\int_{\pi/\sqrt3}^{\pi}\tfrac{\sin x}{x}dx\approx0.339\ne1-\tfrac1{\sqrt3}\approx0.423$) — 공식 풀이는 끝값의 극한만 사용'
