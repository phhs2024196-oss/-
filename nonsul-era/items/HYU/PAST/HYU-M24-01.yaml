stem: |
  다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    집합 $A=\{k\mid k\text{는 }4n+2\text{ 이하의 자연수}\}$의 부분집합 중에서 $n+1$개 이상의 짝수를 포함하고 $n$개 이하의 홀수를 포함하는 부분집합의 개수는? 단, $n$은 자연수이다.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '2**(4*n)', equivalents: ['16**n'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 짝수·홀수가 각각 $2n+1$개. 홀수 쪽 $\sum_{r\le n}{}_{2n+1}\mathrm C_r=2^{2n}$, 짝수 쪽 $\sum_{t\ge n+1}{}_{2n+1}\mathrm C_t=2^{2n}$.
    steps:
    - {id: 1a, content: '$2^{2n}\times2^{2n}=2^{4n}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $A$에 짝수와 홀수는 각각 몇 개인가?
    - ${}_{2n+1}\mathrm C_r={}_{2n+1}\mathrm C_{2n+1-r}$을 이용하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 모의논술 예시답안 1번 p.1 문항 1
    steps:
    - id: 1b-1
      content: |
        $2n+1$개의 홀수 중에서 $n$개 이하의 홀수를 선택하는 경우의 수는
        $${}_{2n+1}\mathrm C_0+{}_{2n+1}\mathrm C_1+\cdots+{}_{2n+1}\mathrm C_n=\frac12\left({}_{2n+1}\mathrm C_0+{}_{2n+1}\mathrm C_1+\cdots+{}_{2n+1}\mathrm C_n+\cdots+{}_{2n+1}\mathrm C_{2n+1}\right)=\frac12\,2^{2n+1}=2^{2n}.$$
        $2n+1$개의 짝수 중에서 $t$개의 짝수를 선택하는 경우의 수는 ${}_{2n+1}\mathrm C_t$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 문제에 제시된 조건을 만족하는 $A$의 부분집합들의 개수는
        $${}_{2n+1}\mathrm C_{n+1}\times2^{2n}+{}_{2n+1}\mathrm C_{n+2}\times2^{2n}+\cdots+{}_{2n+1}\mathrm C_{2n+1}\times2^{2n}=\frac12\left({}_{2n+1}\mathrm C_0+\cdots+{}_{2n+1}\mathrm C_{2n+1}\right)\times2^{2n}=\frac12\,2^{2n+1}\times2^{2n}=2^{4n}.$$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        부분집합들의 개수를 조합수(${}_{2n+1}\mathrm C_r$의 합과 곱)를 이용하여 표현했다(평가지침 10/20).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        유도한 식으로부터 개수 $2^{4n}$을 정확히 계산했다(평가지침 10/20).
      depends_on: ['1.M1']
      steps: [1b-2]
    deductions: []
  misconceptions: []

- id: '2'
  stem: |
    미분가능한 함수 $f(x)$는 다음 조건을 만족시킨다.
    (i) 임의의 실수 $a,b$에 대하여 $f(a+b)=f(a)+f(b)$이다.
    (ii) $f(3)=6$이다.
    정적분 $\displaystyle\int_0^2\{f(x)\}^9\{f(2-x)\}^{10}f^\prime(x)\,dx$의 값을 $k$라 할 때, ${}_{20}\mathrm C_{10}\times k$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '2**39/5', equivalents: ['2**40/10'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(0)=0$, $f(2)=4$, $f(2-x)=4-f(x)$. $f(x)=t$로 $k=\int_0^4t^9(4-t)^{10}dt$, 부분적분 반복으로 $k=\tfrac{9!\,10!}{20!}4^{20}$.
    steps:
    - {id: 2a, content: '${}_{20}\mathrm C_{10}k=\tfrac{4^{20}}{10}=\tfrac{2^{39}}{5}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $f(0)$, $f(1)$, $f(2)$를 조건 (i)으로 구해 보자.
    - $f(2-x)$를 $f(x)$로 나타내자.
    - $t^9(4-t)^{10}$은 부분적분을 반복하면 차수가 옮겨 간다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2024 모의논술 예시답안 1번 p.1 문항 2
    steps:
    - id: 2b-1
      content: |
        임의의 실수 $a,b$에 대하여 $f(a+b)=f(a)+f(b)$이므로 $f(0)=f(0+0)=f(0)+f(0)$이고, $6=f(3)=f(2+1)=f(2)+f(1)=f(1+1)+f(1)=f(1)+f(1)+f(1)$. 따라서 $f(0)=0$, $f(1)=2$, $f(2)=4$. 또한 $f(2-x)=f(2)-f(x)$이므로 $f(x)=t$로 치환해서 적분하면
        $${}_{20}\mathrm C_{10}\int_0^2f(x)^9f(2-x)^{10}f^\prime(x)\,dx={}_{20}\mathrm C_{10}\int_0^4t^9(4-t)^{10}\,dt$$
        이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $I=\displaystyle\int_0^4t^9(4-t)^{10}dt$에 부분적분을 적용하면
        $$I=\left[\frac1{10}t^{10}(4-t)^{10}\right]_0^4+\int_0^4t^{10}(4-t)^9dt=\left[\frac1{11}t^{11}(4-t)^9\right]_0^4+\frac9{11}\int_0^4t^{11}(4-t)^8dt=\frac9{11}\cdot\frac8{12}\int_0^4t^{12}(4-t)^7dt=\cdots=\frac9{11}\cdot\frac8{12}\cdot\frac7{13}\cdots\frac1{19}\int_0^4t^{19}(4-t)^0dt=\frac9{11}\cdot\frac8{12}\cdot\frac7{13}\cdots\frac1{19}\cdot\frac{4^{20}}{20}$$
        따라서 ${}_{20}\mathrm C_{10}I={}_{20}\mathrm C_{10}\cdot\dfrac9{11}\cdot\dfrac8{12}\cdots\dfrac1{19}\cdot\dfrac{4^{20}}{20}=\dfrac{2^{40}}{10}=\dfrac{2^{39}}{5}$.
        (공식 예시답안의 첫 줄 $\left[\tfrac1{10}t^{10}(4-t)^{10}\right]_0^4+\int_0^4t^{10}(4-t)^9dt$는 계수 $\tfrac{10}{10}=1$이 생략된 꼴로 결과는 같다.)
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        함수의 성질($f(0)=0$, $f(2)=4$, $f(2-x)=4-f(x)$)을 활용하여 치환적분 $\int_0^4t^9(4-t)^{10}dt$를 올바르게 유도했다(평가지침 20/40).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        부분적분을 활용하여 정적분을 계산해 ${}_{20}\mathrm C_{10}k=\tfrac{2^{39}}{5}$를 구했다(평가지침 20/40).
      depends_on: ['2.M1']
      steps: [2b-2]
    deductions: []
  misconceptions: []

- id: '3'
  stem: |
    좌표평면에서 선분 $\mathrm{AB}$를 아랫변으로 하는 사다리꼴 $\mathrm{ABCD}$가 다음 조건을 만족시킨다.
    (i) $\overline{\mathrm{CD}}=1$, $\overline{\mathrm{DA}}=5$
    (ii) $\cos\angle\mathrm{DAB}=\dfrac35$,  $\cos\angle\mathrm{BCD}=-\dfrac1{\sqrt5}$
    점 $\mathrm P$가 $(\overrightarrow{\mathrm{AP}}+\overrightarrow{\mathrm{CP}})\cdot(2\overrightarrow{\mathrm{BP}}+\overrightarrow{\mathrm{DP}})=\dfrac{67}{8}$을 만족시킬 때, $|\overrightarrow{\mathrm{AP}}|$의 최댓값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: 'sqrt(541)/4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm A(0,0),\mathrm B(6,0),\mathrm C(4,4),\mathrm D(3,4)$이면 조건은 원 $(x-\tfrac72)^2+(y-\tfrac53)^2=\tfrac{541}{144}$, 최댓값은 $\overline{\mathrm{AQ}}+r$.
    steps:
    - {id: 3a, content: '$\tfrac{\sqrt{541}}6+\tfrac{\sqrt{541}}{12}=\tfrac{\sqrt{541}}4$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - 꼭짓점 D, C에서 AB에 수선을 내려 높이와 밑변을 구하자.
    - 내적 조건을 좌표로 쓰면 어떤 도형이 나오는가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2024 모의논술 예시답안 1번 pp.1-2 문항 3
    steps:
    - id: 3b-1
      content: |
        점 D에서 선분 AB에 내린 수선의 발을 H라 하고, 점 C에서 선분 AB에 내린 수선의 발을 H$^\prime$이라 하면
        $\overline{\mathrm{AH}}=\overline{\mathrm{DA}}\cos\angle\mathrm{DAB}=5\times\dfrac35=3$, $\overline{\mathrm{DH}}=\overline{\mathrm{DA}}\sin\angle\mathrm{DAB}=5\times\dfrac45=4$,
        $4=\overline{\mathrm{DH}}=\overline{\mathrm{CH^\prime}}=\overline{\mathrm{BC}}\sin(\pi-\angle\mathrm{BCD})=\overline{\mathrm{BC}}\sin\angle\mathrm{BCD}=\overline{\mathrm{BC}}\times\dfrac2{\sqrt5}$, 즉 $\overline{\mathrm{BC}}=2\sqrt5$.
        따라서 $\overline{\mathrm{H^\prime B}}=\overline{\mathrm{BC}}\cos(\pi-\angle\mathrm{BCD})=-2\sqrt5\cos\angle\mathrm{BCD}=2\sqrt5\times\dfrac1{\sqrt5}=2$이고, $\overline{\mathrm{AB}}=\overline{\mathrm{AH}}+\overline{\mathrm{CD}}+\overline{\mathrm{H^\prime B}}=3+1+2=6$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        점 A가 원점, 선분 AB가 $x$축에 놓여있다고 하면 $\mathrm A(0,0)$, $\mathrm B(6,0)$, $\mathrm C(4,4)$, $\mathrm D(3,4)$이다. 점 P의 좌표를 $(x,y)$라 하면 $(\overrightarrow{\mathrm{AP}}+\overrightarrow{\mathrm{CP}})\cdot(2\overrightarrow{\mathrm{BP}}+\overrightarrow{\mathrm{DP}})=\dfrac{67}8$로부터
        $$((x,y)+(x-4,y-4))\cdot(2(x-6,y)+(x-3,y-4))=(2x-4,2y-4)\cdot(3x-15,3y-4)=(2x-4)(3x-15)+(2y-4)(3y-4)=\frac{67}8$$
        즉 $\left(x-\dfrac72\right)^2+\left(y-\dfrac53\right)^2=\dfrac{541}{144}$이다. 따라서 점 P는 중심이 점 $\mathrm Q\left(\dfrac72,\dfrac53\right)$이고 반지름이 $\dfrac{\sqrt{541}}{12}$인 원 위에 있다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $|\overrightarrow{\mathrm{AP}}|$의 최댓값은 $\overline{\mathrm{AQ}}+\dfrac{\sqrt{541}}{12}=\sqrt{\left(\dfrac72\right)^2+\left(\dfrac53\right)^2}+\dfrac{\sqrt{541}}{12}=\dfrac{\sqrt{541}}6+\dfrac{\sqrt{541}}{12}=\dfrac{\sqrt{541}}4$.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        사다리꼴에 대한 정보(높이 4, $\overline{\mathrm{BC}}=2\sqrt5$, $\overline{\mathrm{AB}}=6$ 또는 꼭짓점 좌표)를 적절히 얻었다(평가지침 10/40).
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 10
      evidence: |
        점 P에 대한 식을 원 $(x-\tfrac72)^2+(y-\tfrac53)^2=\tfrac{541}{144}$으로 잘 정리했다(평가지침 20/40).
      depends_on: ['3.M1']
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        $|\overrightarrow{\mathrm{AP}}|$의 최댓값 $\tfrac{\sqrt{541}}4$를 정확히 계산했다(평가지침 10/40).
      depends_on: ['3.M2']
      steps: [3b-3]
    deductions: []
  misconceptions: []

