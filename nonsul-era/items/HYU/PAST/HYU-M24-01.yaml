intent: |
  경우의 수를 조합으로 표현하고 이항정리를 실제 계산에 적용하는지(1.), 함수의 성질을 이용해 치환적분을 찾아내고 부분적분으로 정적분을 계산하는지(2.), 삼각함수와 벡터의 내적의 의미를 이해하고 활용하는지(3.)를 평가한다.
key_idea: |
  1.은 홀수 $2n+1$개 중 $n$개 이하를 고르는 수가 이항계수의 대칭으로 $\tfrac12\cdot2^{2n+1}$임을 쓴다. 2.는 $f(x)=t$ 치환 후 $f(2-x)=4-t$로 $\int_0^4t^9(4-t)^{10}dt$를 부분적분 반복. 3.은 사다리꼴을 좌표에 놓아 내적 조건을 원의 방정식으로 바꾼다.
stuck: |
  1.에서 짝수 쪽 합 $\sum_{t\ge n+1}{}_{2n+1}\mathrm C_t$도 대칭으로 $2^{2n}$이 된다는 것, 2.에서 $f(a+b)=f(a)+f(b)$로 $f(2-x)=f(2)-f(x)$를 끌어내 피적분함수를 $f(x)$만의 식으로 바꾸는 발상, 3.에서 사다리꼴의 높이와 밑변을 삼각비로 구해 좌표를 정하는 것
idea_tags: [IDEA-BINOMIAL-SYMMETRY-HALF, IDEA-CAUCHY-ADDITIVE-SUBST, IDEA-DOT-CONDITION-CIRCLE]
tags: [이항정리, 조합, 치환적분, 부분적분, 벡터 내적, 원의 방정식, 배점환산]
