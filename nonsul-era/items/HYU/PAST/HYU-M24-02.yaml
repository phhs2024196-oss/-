stem: |
  다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    오른쪽 그림과 같이 반지름의 길이가 $1$인 구와 구의 중심 $\mathrm O$를 지나는 평면 $\alpha$가 있다. 구와 평면이 만나서 생기는 원 위에 $\overline{\mathrm{AB}}=\sqrt3$을 만족시키는 두 점 $\mathrm A,\mathrm B$가 있다. 구면 위의 한 점 $\mathrm P$에 대하여, 삼각형 $\mathrm{ABP}$의 평면 $\alpha$ 위로의 정사영을 삼각형 $\mathrm{ABH}$라 하자. 사면체 $\mathrm{ABHP}$의 부피가 최대일 때, 삼각형 $\mathrm{ABH}$의 넓이를 구하시오.
    [그림: 평행사변형으로 그린 평면 $\alpha$가 반지름 1인 구를 중심 O에서 자르고, 단면 원 위에 A, B($\overline{\mathrm{AB}}=\sqrt3$, 점선 호에 $\sqrt3$ 표시). 구면 위 점 P에서 평면에 내린 수선의 발 H, $\overline{\mathrm{OP}}=1$ 점선 표시, 선분 PA, PB, PH, AH, BH와 사면체 ABHP가 그려져 있다.]
  points: 15
  depends_on: []
  answer: {kind: value, value: '3*(sqrt(3) + sqrt(11))/16', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: H는 AB의 수직이등분선(지름) 위, O에 대해 AB 반대쪽. $\overline{\mathrm{OH}}=t$이면 $V=\tfrac{\sqrt3}{12}(2t+1)\sqrt{1-t^2}$, $t=\tfrac{-1+\sqrt{33}}8$에서 최대.
    steps:
    - {id: 1a, content: '$\triangle\mathrm{ABH}=\tfrac12\sqrt3(\tfrac12+t)=\tfrac3{16}(\sqrt3+\sqrt{11})$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - H가 같은 높이를 유지하며 AB와 평행하게 움직이면 부피는 어떻게 되는가?
    - O에서 현 AB까지의 거리는 $\tfrac12$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 모의논술 예시답안 2번 p.3 문항 1
    steps:
    - id: 1b-1
      content: |
        점 H는 점 P의 평면 $\alpha$ 위로의 정사영이므로 점 P에서 평면 $\alpha$에 내린 수선의 발이다. 따라서 사면체의 부피는 $\dfrac13\times$(삼각형 ABH의 넓이)$\times\overline{\mathrm{PH}}$이다. 현 AB와 수직인 원의 지름을 CD라 하자. 단, 현 AB와 지름 CD의 교점 M은 선분 CO 위에 있다고 하자.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        먼저 사면체 ABPH의 부피가 최대이면 수선의 발 H는 적어도 지름 CD 위에 있어야 한다. 만약 H가 지름 CD 위에 있지 않으면, 점 H를 지나고 현 AB와 평행한 직선과 지름 CD의 교점을 H$^\prime$이라 하고 H$^\prime$을 수선의 발로 하는 구면 위의 점을 P$^\prime$이라 할 때, 사면체 ABP$^\prime$H$^\prime$의 부피는 사면체 ABPH의 부피보다 크게 되어 모순이다.
        더욱이 수선의 발 H는 선분 OD 위에 있어야 한다. 만약 H가 선분 CO 위에 있다면, $\overline{\mathrm{DH^{\prime\prime}}}=\overline{\mathrm{CH}}$를 만족시키는 선분 OD 위의 점을 H$^{\prime\prime}$이라 하고 H$^{\prime\prime}$을 수선의 발로 하는 구면 위의 점을 P$^{\prime\prime}$이라 할 때, 사면체 ABP$^{\prime\prime}$H$^{\prime\prime}$의 부피는 사면체 ABPH의 부피보다 크게 되어 모순이다.
        [그림: 원 위의 A, B와 지름 CD, M, O, H, H$^\prime$, H$^{\prime\prime}$의 위치를 보인 네 그림. 셋째 그림에 $\overline{\mathrm{MO}}=\tfrac12$, $\overline{\mathrm{OH}}=t$, 넷째(단면) 그림에 $\overline{\mathrm{OP}}=1$, $\overline{\mathrm{PH}}=\sqrt{1-t^2}$]
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        이제 H는 선분 OD 위에 있으므로 $\overline{\mathrm{OH}}=t\ (0<t<1)$라 하고 사면체의 부피를 $f(t)$라 하면
        $$f(t)=\frac13\times\frac12\times\sqrt3\times\left(\frac12+t\right)\times\sqrt{1-t^2}=\frac{\sqrt3}{12}(2t+1)\sqrt{1-t^2}$$
        이고 $f^\prime(t)=-\dfrac{\sqrt3(4t^2+t-2)}{12\sqrt{1-t^2}}=0$일 때 $t=\dfrac{-1+\sqrt{33}}8$이다. 증감표에서 $f(t)$는 $t=\dfrac{-1+\sqrt{33}}8$일 때 최대임을 알 수 있다. (공식 예시답안의 증감표에는 $\tfrac{-1+\sqrt3}{8}$로 인쇄되어 있으나 본문과 같이 $\tfrac{-1+\sqrt{33}}8$의 오기이므로 고쳐 적음.)
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        이때 삼각형 ABH의 넓이는 $\dfrac12\times\sqrt3\times\left(\dfrac12+\dfrac{-1+\sqrt{33}}8\right)=\dfrac3{16}(\sqrt3+\sqrt{11})$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        H의 위치를 정당화하고 사면체 ABHP의 부피를 $\tfrac{\sqrt3}{12}(2t+1)\sqrt{1-t^2}$ 등 적절한 식으로 표현했다(평가지침 20/30).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        부피가 최대일 때 삼각형 ABH의 넓이 $\tfrac3{16}(\sqrt3+\sqrt{11})$을 구했다(평가지침 10/30).
      depends_on: ['1.M1']
      steps: [1b-3, 1b-4]
    deductions: []
  misconceptions: []

- id: '2'
  stem: |
    닫힌구간 $[0,1]$에서 두 함수 $f(x)=\dfrac1mx^m$과 $g(x)=1-\sqrt{1-x^2}$이 주어져 있다.
    곡선 $y=f(x)$와 곡선 $y=g(x)$가 오직 한 개의 점에서만 만나기 위한 양의 실수 $m$의 범위를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: set, value: 'Union(Interval.open(0, 1), Interval(2, oo))', equivalents: ['0 < m < 1 or m >= 2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 원점은 항상 교점. $(0,1]$에서 교점이 없을 조건을 $m$의 네 범위로 나누어 조사.
    steps:
    - {id: 2a, content: '$0<m<1$, $m\ge2$이면 교점 없음; $m=1$, $1<m<2$이면 교점 있음', criteria: ['2.M1', '2.M2', '2.M3']}
    hint_ladder:
    - $x=0$은 언제나 교점이다.
    - $g(x)\le x$를 이용해 $m<1$일 때를 보자.
    - $1<m<2$일 때 $x\to0^+$ 근처와 $x=1$에서 부호를 비교하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2024 모의논술 예시답안 2번 pp.3-4 문항 2
    steps:
    - id: 2b-1
      content: |
        양의 실수 $m$의 값과 상관없이 항상 $f(0)=0=g(0)$이므로, 두 곡선이 $0<x\le1$의 범위에서 만나지 않도록 하는 $m$의 범위를 구하면 된다. 네 가지 경우로 나누어 조사하자.
        $0<m<1$: $0<x\le1$일 때 $g(x)=1-\sqrt{1-x^2}\le x<\dfrac1mx^m=f(x)$이므로 두 곡선은 만나지 않는다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $m=1$: $f(1)=1=g(1)$이므로 두 곡선은 점 $(1,1)$에서 만난다.
        $1<m<2$: $0<x\le1$일 때 $1-\dfrac1mx^m\ge0$이므로
        $$f(x)=g(x)\iff\sqrt{1-x^2}=1-\frac1mx^m\iff1-x^2=\left(1-\frac1mx^m\right)^2\iff-x^2=-\frac2mx^m+\frac1{m^2}x^{2m}\iff x^{2m-1}-2mx^{m-1}+m^2x=0$$
        이다. 함수 $h(x)=x^{2m-1}-2mx^{m-1}+m^2x$는 $h(0)=0$, $\displaystyle\lim_{x\to0^+}h^\prime(x)=-\infty$를 만족하므로 $h(a)<0$인 $a\in(0,1)$가 존재한다. $h(x)$는 닫힌구간 $[a,1]$에서 연속이고 $h(a)<0<(m-1)^2=h(1)$이므로 사잇값 정리에 의해 $h(c)=0$인 $c$가 열린구간 $(a,1)$에 적어도 하나 존재한다. 따라서 두 곡선은 $0<x\le1$의 범위에서 만난다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $m\ge2$: $0<x\le1$일 때 $1-\dfrac1mx^m\ge0$이므로
        $$f(x)=g(x)\iff\sqrt{1-x^2}=1-\frac1mx^m\iff1-x^2=\left(1-\frac1mx^m\right)^2\iff-x^2=-\frac2mx^m+\frac1{m^2}x^{2m}\iff\frac2mx^{m-2}=1+\frac1{m^2}x^{2m-2}$$
        이다. 마지막 식의 좌변은 $1$보다 작거나 같고 우변은 $1$보다 크기 때문에 등식이 성립할 수 없으므로 $0<x<1$에서 두 곡선은 만나지 않는다. ($x=1$에서도 $f(1)=\tfrac1m<1=g(1)$.)
        따라서 곡선 $y=f(x)$와 $y=g(x)$가 한 점에서 만나도록 하는 양의 실수 $m$의 범위는 $0<m<1$, $m\ge2$이다.
      criteria: ['2.M3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $0<m<1$일 때 두 곡선이 한 점(원점)에서만 만남을 보였다(평가지침 10/40).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 8
      evidence: |
        $1\le m<2$일 때 두 곡선이 두 점 이상에서 만남을 보였다($m=1$의 $(1,1)$, $1<m<2$의 사잇값 정리)(평가지침 15/40).
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.M3
      mark_type: M
      points: 7
      evidence: |
        $m\ge2$일 때 두 곡선이 한 점에서 만남을 보이고 범위 $0<m<1$ 또는 $m\ge2$를 결론지었다(평가지침 15/40).
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    deductions: []
  misconceptions: []

- id: '3'
  stem: |
    각 면에 $1,2,3,4$ 네 개의 수가 각각 하나씩 적혀있는 정사면체 주사위 $\mathrm A$와 각 면에 $1,2,3,4,5,6$ 여섯 개의 수가 각각 하나씩 적혀있는 정육면체 주사위 $\mathrm B$를 한 번씩 던질 때마다, 다음과 같은 규칙으로 수직선 위의 점 $\mathrm P$를 이동시킨다.
    (i) 주사위 $\mathrm A$를 던져 바닥에 닿는 면에 적혀있는 수를 $3$으로 나눈 나머지가 $1$이면 양의 방향으로 $1$만큼 이동하고, $3$으로 나눈 나머지가 $2$이면 음의 방향으로 $2$만큼 이동하고, 적혀있는 수가 $3$의 배수이면 양의 방향으로 $3$만큼 이동한다.
    (ii) 주사위 $\mathrm B$를 던져 바닥에 닿는 면에 적혀있는 수가 $3$의 배수이면 양의 방향으로 $1$만큼 이동하고, $3$의 배수가 아니면 음의 방향으로 $2$만큼 이동한다.
    주사위 $\mathrm A$와 주사위 $\mathrm B$를 함께 던지는 시행을 세 번 반복한 후, 수직선의 원점에서 출발한 점 $\mathrm P$가 규칙대로 이동하여 도착한 점이 나타내는 수의 기댓값을 구하시오.
