key_idea: |
  1.은 부피 최대이면 H가 현 AB에 수직인 지름 위(중심 반대쪽)에 있어야 함을 보이고 $\overline{\mathrm{OH}}=t$로 $V(t)=\tfrac{\sqrt3}{12}(2t+1)\sqrt{1-t^2}$를 미분한다. 2.는 $m$의 범위를 $0<m<1$, $m=1$, $1<m<2$, $m\ge2$로 나누어 $x\in(0,1]$에서의 교점 유무를 판정한다. 3.은 한 번 시행의 변화량 $X$의 기댓값을 세 배 한다.
stuck: |
  1.에서 H의 위치를 지름 CD의 O 쪽 반대편으로 제한하는 논증(평행 이동·대칭 이동으로 부피가 커짐), 2.에서 $1<m<2$일 때 $h(x)=x^{2m-1}-2mx^{m-1}+m^2x$의 부호 변화로 사잇값 정리를 쓰는 것
