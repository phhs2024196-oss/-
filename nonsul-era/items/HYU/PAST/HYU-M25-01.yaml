stem: |
  다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    서로 구분이 되지 않는 주사위 3개를 동시에 던질 때 나오는 눈의 수 $a$, $b$, $c$ (단, $a\ge b\ge c$)에 대해 아래 식의 값이 자연수인 경우의 수를 구하시오.
    $$\frac{a}{3}(a-c)^3+\frac{b}{2}(a-c)^2+(a-c)$$
  points: 15
  depends_on: []
  answer: {kind: value, value: '22', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 6을 곱하면 $2a(a-c)^3+3b(a-c)^2+6(a-c)$가 6의 배수여야 하므로 $b(a-c)^2$은 짝수, $a(a-c)^3$은 3의 배수.
    steps:
    - {id: 1a, content: '(A) $b$ 짝수 또는 $a-c$ 짝수, (B) $a$가 3의 배수 또는 $a-c$가 3의 배수 → $13+4+5+0=22$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 식의 값이 자연수이려면 먼저 $a$와 $c$는 어떤 관계여야 하는가?
    - 양변에 6을 곱하면 각 항이 2와 3으로 나누어떨어져야 하는 조건이 보인다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 모의논술 예시답안 1번 p.1 문항 1
    steps:
    - id: 1b-1
      content: |
        (공식 예시답안은 마지막 항을 $c(a-c)$로 적었으나 문제지는 $(a-c)$이다. 이 항은 6을 곱하면 어느 쪽이든 6의 배수라 결과는 같으므로 문제지대로 쓴다.)
        식의 값을 자연수 $n$이라 하면 $n>0$이어야 하므로 $a>c$이다. 양변에 6을 곱하면 $2a(a-c)^3+3b(a-c)^2+6(a-c)=6n$이고, 양변이 각각 2와 3으로 나누어떨어져야 하므로
        (A) $b(a-c)^2$은 2의 배수, (B) $a(a-c)^3$은 3의 배수이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (A1) $b$가 2의 배수, 즉 $b=2,4,6$.
        (A2) $b$는 2의 배수가 아니고 $a-c$가 2의 배수: $(a,b,c)=(6,5,2),(6,3,2),(5,5,1),(5,3,1),(5,1,1),(6,5,4),(5,5,3),(5,3,3),(4,3,2),(3,3,1),(3,1,1)$.
        (B1) $a$가 3의 배수, 즉 $a=3,6$.
        (B2) $a$는 3의 배수가 아니고 $a-c$가 3의 배수: $(a,b,c)=(5,5,2),(5,4,2),(5,3,2),(5,2,2),(4,4,1),(4,3,1),(4,2,1),(4,1,1)$.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        (A1)이고 (B1): $(3,2,2),(3,2,1),(6,6,5),(6,6,4),(6,6,3),(6,6,2),(6,6,1),(6,4,4),(6,4,3),(6,4,2),(6,4,1),(6,2,2),(6,2,1)$ — 13가지.
        (A1)이고 (B2): $(5,4,2),(5,2,2),(4,4,1),(4,2,1)$ — 4가지.
        (A2)이고 (B1): $(6,5,2),(6,3,2),(6,5,4),(3,3,1),(3,1,1)$ — 5가지.
        (A2)이고 (B2): 없음.
        따라서 구하는 경우의 수는 $13+4+5=22$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: $d=a-c\in\{1,\dots,5\}$로 나누어 $\tfrac a3d^3+\tfrac b2d^2$의 정수 조건을 $d$의 홀짝·3의 배수 여부로 판정하며 전수 조사한다.
    steps:
    - id: 1c-1
      content: |
        $d$가 6의 배수가 아니므로 $d$ 짝수이면 (A) 자동, $d=3$이면 (B) 자동. $d=1,\dots,5$ 각각에서 가능한 $(a,b,c)$를 세면 $22$가지.
      criteria: ['1.M1', '1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $a>c$와 2의 배수·3의 배수 조건으로 서로 배제되는 경우를 나누어 세는 과정을 명확히 기술했다(평가지침 10/30).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        경우의 수 $22$를 정확히 구했다(평가지침 20/30).
      depends_on: ['1.M1']
      steps: [1b-3, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    중심이 원점이고 반지름이 1인 원을 $x$축 방향으로 $p$만큼(단, $0<p<3$) $y$축 방향으로 1만큼 평행이동한 원 $\mathrm{O}$가 있다. 원 $\mathrm{O}$의 중심을 $\mathrm{P}$라 하고, 원 $\mathrm{O}$가 직선 $y=-\dfrac13x+2$와 만나는 두 점을 각각 $\mathrm{Q}$, $\mathrm{R}$이라 하자. 삼각형 $\triangle\mathrm{PQR}$의 넓이가 최대가 되는 $p$를 구하고, 이때 삼각형 $\triangle\mathrm{PQR}$의 넓이를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '(3 - sqrt(5), 1/2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $S=\tfrac12dl$, $d=\tfrac{\lvert p-3\rvert}{\sqrt{10}}$, $l=\tfrac{\sqrt{10}}{15}\sqrt{-9p^2+54p+9}$이고 $S^2$을 미분한다.
    steps:
    - {id: 2a, content: '$S=\tfrac1{30}\lvert p-3\rvert\sqrt{-9p^2+54p+9}$, $p=3-\sqrt5$에서 $S=\tfrac12$', criteria: ['2.M1', '2.M2', '2.M3']}
    hint_ladder:
    - 삼각형의 밑변을 $\overline{\mathrm{QR}}$, 높이를 중심에서 직선까지의 거리로 보자.
    - 근호가 있는 함수의 최댓값은 제곱한 함수로 다루면 편하다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 모의논술 예시답안 1번 p.2 문항 2
    steps:
    - id: 2b-1
      content: |
        $\overline{\mathrm{QR}}=l$, 점 $\mathrm{P}(p,1)$에서 직선 $x+3y-6=0$까지의 거리를 $d$라 하면 $S=\dfrac12dl$이고 $d=\dfrac{\lvert p+3-6\rvert}{\sqrt{1^2+3^2}}=\dfrac{\lvert p-3\rvert}{\sqrt{10}}$이다.
      criteria: ['2.M2']
    - id: 2b-2
      content: |
        $\mathrm{Q}(x_1,y_1)$, $\mathrm{R}(x_2,y_2)$는 직선 위에 있으므로 $l=\sqrt{(x_1-x_2)^2+\tfrac19(x_1-x_2)^2}=\dfrac{\sqrt{10}}{3}\lvert x_1-x_2\rvert$.
        원 $(x-p)^2+(y-1)^2=1$에 $y=-\tfrac13x+2$를 대입하면 $(x-p)^2+\left(-\tfrac13x+1\right)^2=1\Rightarrow 10x^2-6(3p+1)x+9p^2=0$이므로
        $\lvert x_1-x_2\rvert=\dfrac15\sqrt{-9p^2+54p+9}$, $l=\dfrac{\sqrt{10}}{15}\sqrt{-9p^2+54p+9}$.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $S=\dfrac1{30}\lvert p-3\rvert\sqrt{-9p^2+54p+9}$. $S^2$이 최대일 때 $S$가 최대이므로 $V(x)=\dfrac1{30^2}(x-3)^2(-9x^2+54x+9)$의 $0<x<3$에서의 최대를 구한다.
        $V'(x)=-\dfrac{36(x-3)}{30^2}(x^2-6x+4)$이므로 $V$는 $x=3\pm\sqrt5$에서 극대, $x=3$에서 극소이다.
      criteria: ['2.M3']
    - id: 2b-4
      content: |
        $0<x<3$에서 $V$는 $x=3-\sqrt5$일 때 최대이므로 $S$는 $p=3-\sqrt5$일 때 최대이고, 이때
        $S=\dfrac1{30}\lvert p-3\rvert\sqrt{-9(p^2-6p+4)+45}=\dfrac1{30}\sqrt5\sqrt{45}=\dfrac12$.
      criteria: ['2.M3']
  - id: S2-ALT
    audience: ALT
    method_no: 2
    key_idea: 반지름 1인 원에서 $\angle\mathrm{QPR}=\theta$라 하면 $S=\tfrac12\sin\theta\le\tfrac12$이고, 등호는 $\theta=90^\circ$, 즉 $d=\tfrac1{\sqrt2}$일 때이다.
    steps:
    - id: 2c-1
      content: |
        $S=\tfrac12\cdot1\cdot1\cdot\sin\theta\le\tfrac12$. 등호 조건 $d=\tfrac{3-p}{\sqrt{10}}=\tfrac{1}{\sqrt2}$에서 $p=3-\sqrt5$ $(0<p<3)$.
      criteria: ['2.M3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        원과 직선이 만나는 두 점 사이의 거리 $l$을 $p$에 대한 식으로 구했다(평가지침 10/30).
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: |
        원의 중심과 직선 사이의 거리 $d=\dfrac{\lvert p-3\rvert}{\sqrt{10}}$를 $p$에 대한 식으로 구했다(평가지침 10/30).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M3
      mark_type: M
      points: 5
      evidence: |
        미분을 이용하여 극댓값을 구하고 $p=3-\sqrt5$, 넓이 $\dfrac12$을 얻었다(평가지침 10/30).
      depends_on: []
      implied_ok: false
      steps: [2b-3, 2b-4, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    자연수 $n$에 대해 한 변의 길이가 $\sqrt[4]{n}$인 정육각형의 임의의 세 꼭짓점으로 만든 삼각형 중 넓이가 양의 정수인 삼각형의 개수를 $a_n$이라고 하자. $\displaystyle\sum_{n=1}^{2025}a_n$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '192', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 삼각형 20개는 넓이 $\tfrac{\sqrt3}{4}\sqrt n$(6개), $\tfrac{\sqrt3}{2}\sqrt n$(12개), $\tfrac{3\sqrt3}{4}\sqrt n$(2개)의 세 종류.
    steps:
    - {id: 3a, content: '$n=48k^2$ ($k\le6$)에서 8개, $n=12k^2$ ($k\le12$)에서 12개 → $8\times6+12\times12=192$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - 정육각형의 세 꼭짓점으로 만드는 삼각형은 모양에 따라 몇 종류인가?
    - 넓이가 $\sqrt n$의 상수배일 때 정수가 되려면 $n$은 어떤 꼴이어야 하는가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2025 모의논술 예시답안 1번 p.3–4 문항 3
    steps:
    - id: 3b-1
      content: |
        삼각형의 개수는 6개의 꼭짓점에서 3개를 고르는 경우의 수 ${}_6\mathrm{C}_3=20$이고, 모양에 따라 세 종류로 나뉜다.
        ① 두 변의 길이가 $\sqrt[4]{n}$이고 끼인각이 $120^\circ$인 이등변삼각형: 한 꼭짓점과 인접한 두 꼭짓점 — 6개.
        ② 한 변이 $\sqrt[4]{n}$, 빗변이 $2\sqrt[4]{n}$이고 그 끼인각이 $60^\circ$인 직각삼각형: 한 꼭짓점, 반대편 꼭짓점과 그 인접 꼭짓점 중 하나 — 12개.
        ③ 한 변의 길이가 $\sqrt[4]{9n}$인 정삼각형: 한 꼭짓점씩 건너뛰어 선택 — 2개.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $S=\tfrac12ab\sin\theta$와 정삼각형 넓이 공식으로
        ① $S=\tfrac12\sqrt[4]n\cdot\sqrt[4]n\sin\tfrac{2\pi}{3}=\tfrac{\sqrt3}{4}\sqrt n$,
        ② $\cos\theta=\tfrac{\sqrt[4]n}{2\sqrt[4]n}=\tfrac12$이므로 $\theta=\tfrac\pi3$, $S=\tfrac12\sqrt[4]n\cdot2\sqrt[4]n\sin\tfrac\pi3=\tfrac{\sqrt3}{2}\sqrt n$,
        ③ $S=\tfrac{\sqrt3}{4}(\sqrt[4]{9n})^2=\tfrac{3\sqrt3}{4}\sqrt n$.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        종류 ①과 ③은 $n=48k^2$일 때, ②는 $n=12k^2$일 때 넓이가 정수가 된다($k$는 자연수).
        $48\times6^2=1728$, $48\times7^2=2352$이므로 $48k^2\le2025$인 $n$은 6개, $12\times12^2=1728$, $12\times13^2=2028$이므로 $12k^2\le2025$인 $n$은 12개이다.
        따라서 $\displaystyle\sum_{n=1}^{2025}a_n=(6+2)\times6+12\times12=192$.
      criteria: ['3.A1']
