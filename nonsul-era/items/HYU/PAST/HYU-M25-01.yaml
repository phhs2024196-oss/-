intent: |
  주사위 눈이 주어진 식을 만족하는 경우를 서로 배제되는 경우로 나누어 세는 능력, 평행이동한 원과 직선의 교점·점과 직선 사이의 거리로 삼각형 넓이를 식으로 세우고 미분으로 최댓값을 구하는 능력, 정육각형의 세 꼭짓점으로 만든 삼각형의 종류·개수·넓이를 구해 수열의 합으로 연결하는 능력을 본다.
key_idea: |
  1.은 $6\times$식을 보고 $b(a-c)^2$이 짝수, $a(a-c)^3$이 3의 배수인 조건으로 나눈다. 2.는 $S=\tfrac12 d\,l$을 $p$의 식으로 쓰고 $S^2$을 미분한다. 3.은 정육각형 삼각형 20개를 세 종류로 나누어 넓이가 $\sqrt n$의 상수배임을 이용한다.
stuck: |
  1.에서 짝수 조건(A)과 3의 배수 조건(B)을 각각 두 경우로 나눈 뒤 겹치지 않게 조합하는 단계, 2.에서 근호를 없애려고 $S^2$을 최대화하는 발상, 3.에서 넓이가 정수가 되는 $n$이 $48k^2$, $12k^2$ 꼴임을 찾는 단계
idea_tags: [IDEA-DIVISIBILITY-CASE-SPLIT, IDEA-SQUARE-TO-MAXIMIZE, IDEA-HEXAGON-TRIANGLE-TYPES]
