intent: |
  정사영의 넓이 관계를 활용해 두 평면이 이루는 각이 일정함을 보이는 능력, 곱의 법칙으로 인접 조건이 있는 색칠 경우의 수를 세는 능력, 도함수로부터 사차함수 그래프의 개형을 유추해 교점 개수 함수의 불연속점을 판단하는 능력을 본다.
key_idea: |
  1.은 $\triangle\mathrm{PQR}$이 정삼각형이고 평면 $\mathrm{EFGH}$ 위 정사영 넓이와의 비가 $\cos\theta=\tfrac1{\sqrt3}$로 일정함을 보인다. 2.는 열 단위로 (위, 아래) 색 쌍을 정하면 다음 열은 3가지씩. 3.은 $f'$의 극댓값 $k$, 극솟값 $k-\tfrac4{27}$의 부호로 $f$의 극값 개수를 분류한다.
stuck: |
  1.에서 넓이 비($\cos\theta$)로 각을 다루는 발상, 2.에서 이웃한 열 사이의 전이 경우가 항상 3가지임을 찾는 단계, 3.에서 $g(t)$의 불연속점이 $f$의 극값(서로 다른 극값)에서 생긴다는 해석과 경계값 $k=0$, $k=\tfrac4{27}$의 처리
