stem: |
  다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    [그림: 정육면체 $\mathrm{ABCD}-\mathrm{EFGH}$. 윗면 $\mathrm{ABCD}$(앞쪽 모서리 $\mathrm{AB}$, 뒤쪽 $\mathrm{DC}$), 아랫면 $\mathrm{EFGH}$($\mathrm{E}$는 $\mathrm{A}$ 아래, $\mathrm{F}$는 $\mathrm{B}$ 아래, $\mathrm{G}$는 $\mathrm{C}$ 아래, $\mathrm{H}$는 $\mathrm{D}$ 아래). 점 $\mathrm{P}$는 모서리 $\mathrm{AD}$ 위 $\mathrm{D}$ 가까이, 점 $\mathrm{Q}$는 모서리 $\mathrm{EF}$ 위 $\mathrm{E}$ 가까이, 점 $\mathrm{R}$은 모서리 $\mathrm{GC}$ 위 $\mathrm{G}$ 가까이 있고 $\mathrm{DP}$, $\mathrm{EQ}$, $\mathrm{GR}$에 같은 길이 표시]
    오른쪽 그림과 같이 한 변의 길이가 1인 정육면체 $\mathrm{ABCD}-\mathrm{EFGH}$가 있다. 점 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$는 각각 모서리 $\mathrm{AD}$, $\mathrm{EF}$, $\mathrm{GC}$ 위에 있고, $\overline{\mathrm{DP}}=\overline{\mathrm{EQ}}=\overline{\mathrm{GR}}$를 만족시키며 움직인다. 점 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$를 지나는 평면과 평면 $\mathrm{EFGH}$가 이루는 각의 크기는 일정함을 보이시오.
  points: 15
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\triangle\mathrm{PQR}$의 넓이 $\tfrac{\sqrt3}{2}(1-t+t^2)$, 정사영 넓이 $\tfrac12(1-t+t^2)$이므로 $\cos\theta=\tfrac1{\sqrt3}$.
    steps:
    - {id: 1a, content: '$\cos\theta=\dfrac{\tfrac12(1-t+t^2)}{\tfrac{\sqrt3}{2}(1-t+t^2)}=\dfrac1{\sqrt3}$ (상수)', criteria: ['1.M1', '1.R1']}
    hint_ladder:
    - 삼각형 $\mathrm{PQR}$의 세 변의 길이를 비교해 보자.
    - 두 평면이 이루는 각은 정사영의 넓이와 어떤 관계가 있는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 모의논술 예시답안 2번 p.5 문항 1
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{DP}}=\overline{\mathrm{EQ}}=\overline{\mathrm{GR}}=t$ $(0\le t\le1)$라 하면 대칭성에 의해 삼각형 $\mathrm{PQR}$은 정삼각형이고, 한 변의 길이는
        $\overline{\mathrm{PQ}}=\sqrt{(1-t)^2+\left(\sqrt{1+t^2}\right)^2}=\sqrt{2-2t+2t^2}$이다.
        따라서 정삼각형의 넓이는 $\dfrac{\sqrt3}{4}\left(\sqrt{2-2t+2t^2}\right)^2=\dfrac{\sqrt3}{2}(1-t+t^2)$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        삼각형 $\mathrm{PQR}$의 평면 $\mathrm{EFGH}$ 위로의 정사영은 정사각형 $\mathrm{EFGH}$에서 세 직각삼각형을 뺀 것이므로 그 넓이는
        $1\times1-\left\{\tfrac12\times1\times t+\tfrac12(1-t)t+\tfrac12(1-t)\times1\right\}=\tfrac12(1-t+t^2)$.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        평면 $\mathrm{PQR}$과 평면 $\mathrm{EFGH}$가 이루는 각을 $\theta$라 하면
        $\cos\theta=\dfrac{\text{정사영의 넓이}}{\text{삼각형 PQR의 넓이}}=\dfrac{\tfrac12(1-t+t^2)}{\tfrac{\sqrt3}{2}(1-t+t^2)}=\dfrac1{\sqrt3}$이고, 이는 상수이므로 두 평면이 이루는 각은 일정하다. ■
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        삼각형 $\mathrm{PQR}$의 넓이 $\tfrac{\sqrt3}{2}(1-t+t^2)$와 평면 $\mathrm{EFGH}$ 위로의 정사영의 넓이 $\tfrac12(1-t+t^2)$를 구했다(평가지침 20/30).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: |
        넓이의 비로 $\cos\theta=\tfrac1{\sqrt3}$가 상수임을 밝혀 각이 일정함을 보였다(평가지침 10/30).
      depends_on: ['1.M1']
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    집합 $\{(x,y)\mid 1\le x\le7,\ 1\le y\le2,\ x,y\text{는 자연수}\}$의 원소인 14개의 점에 빨간색, 파란색, 노란색의 세 가지 색 중 한 가지 색을 칠한다. 이 집합의 원소인 두 점 $(x_1,y_1)$, $(x_2,y_2)$가 $\lvert x_1-x_2\rvert+\lvert y_1-y_2\rvert=1$을 만족시키면 서로 다른 색을 칠하고자 할 때, 가능한 모든 경우의 수를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '4374', equivalents: ['2*3**7', '6*3**6'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 첫 열은 ${}_3\mathrm{P}_2=6$, 이후 각 열은 앞 열이 정해지면 3가지.
    steps:
    - {id: 2a, content: '$6\times3^6=4374$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 같은 $x$좌표의 두 점은 반드시 다른 색이다. 한 열씩 칠해 보자.
    - 앞 열의 색이 정해졌을 때 다음 열에 가능한 (위, 아래) 색 쌍은 몇 가지인가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 모의논술 예시답안 2번 p.5 문항 2
    steps:
    - id: 2b-1
      content: |
        점 $(1,1)$과 $(1,2)$를 세 가지 색 중 서로 다른 색으로 칠하는 경우의 수는 ${}_3\mathrm{P}_2=6$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $1\le x\le6$인 자연수 $x$에 대하여 $(x,1)$과 $(x,2)$가 서로 다른 두 색으로 칠해져 있을 때, 조건을 만족시키며 $(x+1,1)$과 $(x+1,2)$를 칠하는 경우는 가능한 여섯 가지 경우에서 $(x,1)$과 $(x+1,1)$이 같은 색인 경우와 $(x,2)$와 $(x+1,2)$가 같은 색인 경우를 제외한 3가지이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        곱의 법칙에 의해 모든 경우의 수는 $6\times3^6=2\times3^7=4374$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $(x,1)$, $(x,2)$가 서로 다른 색일 때 $(x+1,1)$, $(x+1,2)$를 조건에 맞게 칠하는 경우가 3가지임을 구했다(평가지침 10/30).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        곱의 법칙으로 전체 경우의 수 $4374$를 구했다(평가지침 20/30).
      depends_on: ['2.M1']
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    사차함수 $f(x)$의 도함수는 $f'(x)=x^3-x^2+k$이다 (단, $k$는 실수).
    이때, 실수 $t$에 대해 직선 $y=t$와 함수 $y=f(x)$의 그래프의 교점의 개수를 $g(t)$라 하자.
    함수 $g(t)$가 연속이 아닌 점을 오직 1개만 갖게 하는 $k$의 값의 범위를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: set, value: 'Union(Interval(-oo, 0), Interval(Rational(4, 27), oo))', equivalents: ['k <= 0 or k >= 4/27'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f'$의 극댓값 $f'(0)=k$, 극솟값 $f'(\tfrac23)=k-\tfrac4{27}$의 부호로 $f$의 극값 개수를 나눈다.
    steps:
    - {id: 3a, content: '$0<k<\tfrac4{27}$이면 극값 3개(불연속점 2개 이상), 그 밖에는 극솟값 1개 → $k\le0$ 또는 $k\ge\tfrac4{27}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $f'(x)$의 그래프를 먼저 그려 보자. $f''(x)$는?
    - $g(t)$의 값은 $t$가 $f$의 극값을 지날 때 바뀐다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2025 모의논술 예시답안 2번 p.5 문항 3
    steps:
    - id: 3b-1
      content: |
        $f''(x)=3x^2-2x=x(3x-2)$이므로 $f'(x)$는 $x=0$에서 극대이고 극댓값은 $f'(0)=k$, $x=\tfrac23$에서 극소이고 극솟값은 $f'\left(\tfrac23\right)=-\tfrac4{27}+k$이다.
        [그림: $y=f'(x)$의 개형 — $x=0$에서 극대 $k$, $x=\tfrac23$에서 극소, $x=1$에서 다시 값 $k$]
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $f'(0)=k<0$ 또는 $f'\left(\tfrac23\right)=-\tfrac4{27}+k>0$인 경우 $f'(x)=0$은 오직 1개의 근만을 가지며 이 점에서 $f(x)$는 극소이다.
        $k=0$ 또는 $k=\tfrac4{27}$인 경우 $f'(x)=0$은 서로 다른 2개의 근을 가지는데 중근에서는 극값이 아니고 나머지 한 점에서 $f(x)$가 극소이다.
        $0<k<\tfrac4{27}$인 경우 $f'(x)=0$은 서로 다른 세 실근을 가지며 두 점에서 극소, 한 점에서 극대이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        $0<k<\tfrac4{27}$인 경우 직선 $y=t$와 $y=f(x)$의 교점은 0개에서 최대 4개까지 생길 수 있어 $g(t)$가 연속이 아닌 점이 2개 이상이다.
        $k<0$ 또는 $k>\tfrac4{27}$인 경우 교점은 0개에서 최대 2개까지 생기나, 오직 1개의 $t$(극솟값)에 대해서만 교점이 1개이므로 $g(t)$는 오직 한 점에서만 연속이 아니다. $k=0$, $k=\tfrac4{27}$도 같다.
        따라서 $k\le0$ 또는 $k\ge\tfrac4{27}$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        $k$의 값에 따라 $y=f(x)$의 그래프의 개형(극값의 개수와 종류)이 어떻게 나타나는지 설명했다(평가지침 20/40).
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
      points: 10
      evidence: |
        $t$의 값에 따른 교점 개수의 변화를 설명하고 $k\le0$ 또는 $k\ge\tfrac4{27}$을 얻었다(평가지침 20/40).
      depends_on: ['3.M1']
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

