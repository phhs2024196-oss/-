intent: |
  직각삼각형의 내접원·외접원 넓이를 식으로 세워 함수의 극한값을 구하는 능력, 타원의 접선의 방정식으로 네 접선이 둘러싼 도형의 넓이를 구하고 몫의 미분법과 증감표로 최댓값을 구하는 능력, 벡터 식이 나타내는 도형을 파악하고 점과 직선 사이의 거리로 삼각형 넓이의 최댓값을 구하는 능력을 본다.
key_idea: |
  1.은 접선의 길이로 $r=\tfrac12\left(x+\tfrac1x-\sqrt{x^2+\tfrac1{x^2}}\right)$, $R=\tfrac12\overline{\mathrm{AC}}$. 2.는 기울기 $\sqrt m$인 타원의 접선 $y=\sqrt mx\pm\sqrt{a^2m+b^2}$과 수직 접선 사이 거리의 곱. 3.은 $\overrightarrow{\mathrm{PA}}+\overrightarrow{\mathrm{PB}}=2\overrightarrow{\mathrm{PM}}$으로 $\lvert\mathrm{PM}\rvert=2\lvert\mathrm{PG}\rvert$인 원(아폴로니오스 원)을 얻는다.
stuck: |
  1.에서 $\infty-\infty$ 꼴 극한을 유리화로 처리하는 단계, 2.에서 네 직선이 만드는 직사각형의 두 변을 평행선 사이 거리로 구하고 $\{S(m)\}^2$을 미분해 인수 $(a^2-b^2)^2(1-m)$을 얻는 계산, 3.에서 벡터 합을 중점으로 바꾸는 발상
