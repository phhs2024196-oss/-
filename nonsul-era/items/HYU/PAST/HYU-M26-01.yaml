stem: |
  다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    삼각형 $\mathrm{ABC}$는 $\overline{\mathrm{AB}}=x$, $\overline{\mathrm{BC}}=\dfrac1x$ $(x>0)$이고 $\angle\mathrm{ABC}=90^\circ$인 직각삼각형이다.
    이 삼각형의 내접원의 넓이를 $f(x)$, 외접원의 넓이를 $g(x)$라 할 때,
    $\displaystyle\lim_{x\to\infty}f(x)g(x)$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 'pi**2/16', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)g(x)=\tfrac{\pi^2}{16}\left(x^2+1-\sqrt{x^4+1}\right)^2\left(1+\tfrac1{x^4}\right)$이고 괄호 안 극한은 1.
    steps:
    - {id: 1a, content: '$\lim(x^2+1-\sqrt{x^4+1})=1$이므로 극한값은 $\tfrac{\pi^2}{16}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 내접원의 반지름 $r$과 꼭짓점에서 접점까지의 길이 사이 관계를 그림에 표시해 보자.
    - 직각삼각형의 외접원의 중심은 어디인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 모의논술 예시답안 1번 p.1 문항 1
    steps:
    - id: 1b-1
      content: |
        내접원의 반지름을 $r$이라 하자. [그림: 꼭짓점에서 접점까지의 길이 $x-r$, $\tfrac1x-r$, $r$] 이므로
        $\left(x-r+\tfrac1x-r\right)^2=\overline{\mathrm{AC}}^2=\overline{\mathrm{AB}}^2+\overline{\mathrm{BC}}^2=x^2+\tfrac1{x^2}$이고, $r<x$이므로 $r$에 대해 정리하면
        $r=\dfrac12\left(x+\dfrac1x-\sqrt{x^2+\dfrac1{x^2}}\right)$, $f(x)=\pi r^2=\dfrac\pi4\left(x+\dfrac1x-\sqrt{x^2+\dfrac1{x^2}}\right)^2$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        외접원의 반지름을 $R$이라 하면 외접원의 중심은 빗변 $\mathrm{AC}$의 중점이므로 $R=\dfrac12\overline{\mathrm{AC}}=\dfrac12\sqrt{x^2+\dfrac1{x^2}}$, $g(x)=\pi R^2=\dfrac\pi4\left(x^2+\dfrac1{x^2}\right)$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $f(x)g(x)=\dfrac{\pi^2}{16}\left(x+\dfrac1x-\sqrt{x^2+\dfrac1{x^2}}\right)^2\left(x^2+\dfrac1{x^2}\right)=\dfrac{\pi^2}{16}\left(x^2+1-\sqrt{x^4+1}\right)^2\left(1+\dfrac1{x^4}\right)$이고
        $\displaystyle\lim_{x\to\infty}\left(1+\dfrac1{x^4}\right)=1$, $\displaystyle\lim_{x\to\infty}\left(x^2+1-\sqrt{x^4+1}\right)=\lim_{x\to\infty}\dfrac{2}{1+\frac1{x^2}+\sqrt{1+\frac1{x^4}}}=1$이므로
        $\displaystyle\lim_{x\to\infty}f(x)g(x)=\dfrac{\pi^2}{16}\times1^2\times1=\dfrac{\pi^2}{16}$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 직각삼각형 내접원 반지름 $r=\dfrac{\text{넓이}}{\text{반둘레}}=\dfrac{1}{x+\frac1x+\overline{\mathrm{AC}}}$를 쓰면 $rR\to\tfrac14$가 바로 보인다.
    steps:
    - id: 1c-1
      content: |
        $rR=\dfrac{\tfrac12\overline{\mathrm{AC}}}{x+\frac1x+\overline{\mathrm{AC}}}\to\dfrac{x/2}{2x}=\dfrac14$이므로 $f g=\pi^2(rR)^2\to\dfrac{\pi^2}{16}$.
      criteria: ['1.M1', '1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: |
        두 원의 넓이 $f(x)$와 $g(x)$를 $x$에 대한 식으로 표현했다(평가지침 15/30).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: |
        극한값 $\dfrac{\pi^2}{16}$을 구했다(평가지침 15/30).
      depends_on: ['1.M1']
      steps: [1b-3, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $0\le m\le2026$인 실수 $m$에 대하여 기울기가 $\sqrt m$이고 타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$에 접하는 두 직선 $l_1$, $l_2$가 있다. 직선 $l_1$, $l_2$와 각각 수직으로 만나고 타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$과 접하는 두 직선 $l_3$, $l_4$가 있다. 네 직선 $l_1$, $l_2$, $l_3$, $l_4$로 둘러싸인 도형의 넓이를 $S(m)$이라 할 때, $\{S(m)\}^2$의 최댓값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '4*(a**2 + b**2)**2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\{S(m)\}^2=\dfrac{16(a^2m+b^2)(a^2+b^2m)}{(m+1)^2}$, 도함수 $16(a^2-b^2)^2\dfrac{1-m}{(m+1)^3}$.
    steps:
    - {id: 2a, content: '$m=1$에서 최대, 최댓값 $4(a^2+b^2)^2$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 기울기가 주어진 타원의 접선의 방정식을 떠올리자.
    - 네 직선이 만드는 도형은 직사각형이다. 두 변의 길이는 평행한 두 접선 사이의 거리이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 모의논술 예시답안 1번 p.1–2 문항 2
    steps:
    - id: 2b-1
      content: |
        기울기가 $\sqrt m$이고 타원에 접하는 직선은 $y=\sqrt mx\pm\sqrt{a^2m+b^2}$이므로 $l_1:y=\sqrt mx+\sqrt{a^2m+b^2}$, $l_2:y=\sqrt mx-\sqrt{a^2m+b^2}$라 두자.
        $l_1$과 수직인 직선의 기울기는 $-\dfrac1{\sqrt m}$이므로 $l_3:y=-\dfrac1{\sqrt m}x+\sqrt{\dfrac{a^2}{m}+b^2}$, $l_4:y=-\dfrac1{\sqrt m}x-\sqrt{\dfrac{a^2}{m}+b^2}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $l_1$ 위의 점 $(0,\sqrt{a^2m+b^2})$에서 $l_2$까지의 거리는 $\dfrac{2\sqrt{a^2m+b^2}}{\sqrt{m+1}}$,
        $l_3$ 위의 점 $\left(0,\sqrt{\frac{a^2}{m}+b^2}\right)$에서 $l_4$까지의 거리는 $\dfrac{2\sqrt{\frac{a^2}{m}+b^2}}{\sqrt{\frac1m+1}}=\dfrac{2\sqrt{a^2+b^2m}}{\sqrt{m+1}}$이므로
        $S(m)=\dfrac{4\sqrt{(a^2m+b^2)(a^2+b^2m)}}{m+1}$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $\{S(m)\}^2=f(m)=\dfrac{16(a^2m+b^2)(a^2+b^2m)}{(m+1)^2}$이라 두고 미분하면
        $f'(m)=16\dfrac{\{a^2(a^2+b^2m)+b^2(a^2m+b^2)\}(m+1)-2(a^2m+b^2)(a^2+b^2m)}{(m+1)^3}=16(a^2-b^2)^2\dfrac{1-m}{(m+1)^3}$.
        증감표: $0<m<1$에서 $f'(m)\ge0$(증가), $m=1$에서 $f(1)=4(a^2+b^2)^2$, $1<m\le2026$에서 $f'(m)\le0$(감소).
        따라서 $\{S(m)\}^2$의 최댓값은 $4(a^2+b^2)^2$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: |
        네 직선으로 둘러싸인 도형의 넓이 $S(m)=\dfrac{4\sqrt{(a^2m+b^2)(a^2+b^2m)}}{m+1}$을 구했다(평가지침 15/30).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 7
      evidence: |
        몫의 미분법과 증감표로 $\{S(m)\}^2$의 최댓값 $4(a^2+b^2)^2$을 구했다(평가지침 15/30).
      depends_on: ['2.M1']
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    좌표평면 위의 세 점 $\mathrm{A}(6,2)$, $\mathrm{B}(-2,-4)$, $\mathrm{C}(5,-1)$을 꼭짓점으로 하는 삼각형 $\mathrm{ABC}$의 무게중심을 $\mathrm{G}$라 할 때, $\lvert\overrightarrow{\mathrm{PA}}+\overrightarrow{\mathrm{PB}}\rvert=4\lvert\overrightarrow{\mathrm{PG}}\rvert$를 만족시키는 점 $\mathrm{P}$가 나타내는 도형을 $T$라 하자. 도형 $T$위의 점 $\mathrm{P}$에 대하여 삼각형 $\mathrm{APC}$의 넓이의 최댓값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '5/2 + sqrt(10)/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\lvert\mathrm{PM}\rvert=2\lvert\mathrm{PG}\rvert$ ($\mathrm{M}(2,-1)$)이므로 $T$는 중심 $\left(\tfrac{10}3,-1\right)$, 반지름 $\tfrac23$인 원.
    steps:
    - {id: 3a, content: '최댓값 $=\tfrac12\sqrt{10}\left(\tfrac5{\sqrt{10}}+\tfrac23\right)=\tfrac52+\tfrac{\sqrt{10}}3$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $\overrightarrow{\mathrm{PA}}+\overrightarrow{\mathrm{PB}}$를 선분 $\mathrm{AB}$의 중점으로 나타내 보자.
    - 원 위의 점에서 직선까지 거리의 최댓값은?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2026 모의논술 예시답안 1번 p.2 문항 3
    steps:
    - id: 3b-1
      content: |
        선분 $\mathrm{AB}$의 중점을 $\mathrm{M}(2,-1)$이라 하면 $2\lvert\overrightarrow{\mathrm{PM}}\rvert=\lvert\overrightarrow{\mathrm{PA}}+\overrightarrow{\mathrm{PB}}\rvert=4\lvert\overrightarrow{\mathrm{PG}}\rvert$, 즉 $\lvert\overrightarrow{\mathrm{PM}}\rvert=2\lvert\overrightarrow{\mathrm{PG}}\rvert$.
        $\mathrm{P}(x,y)$, $\mathrm{G}\left(\tfrac{6-2+5}{3},\tfrac{2-4-1}{3}\right)=(3,-1)$이므로 $(x-2)^2+(y+1)^2=4(x-3)^2+4(y+1)^2$,
        정리하면 $3x^2-20x+3y^2+6y+35=0$, 즉 $\left(x-\tfrac{10}3\right)^2+(y+1)^2=\left(\tfrac23\right)^2$.
        그러므로 $T$는 점 $\mathrm{D}\left(\tfrac{10}3,-1\right)$을 중심으로 하고 반지름의 길이가 $\tfrac23$인 원이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\overline{\mathrm{AC}}=\sqrt{(6-5)^2+(2+1)^2}=\sqrt{10}$, 직선 $\mathrm{AC}$는 $y=3x-16$이다.
        삼각형 $\mathrm{APC}$의 넓이는 $\tfrac12\times\overline{\mathrm{AC}}\times(\mathrm{P}$와 직선 $\mathrm{AC}$ 사이의 거리$)$이고,
        거리의 최댓값 $=$ ($\mathrm{D}$와 직선 $\mathrm{AC}$ 사이의 거리) $+$ (반지름) $=\dfrac5{\sqrt{10}}+\dfrac23$.
        따라서 넓이의 최댓값은 $\dfrac{\sqrt{10}}2\left(\dfrac5{\sqrt{10}}+\dfrac23\right)=\dfrac52+\dfrac{\sqrt{10}}3$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
