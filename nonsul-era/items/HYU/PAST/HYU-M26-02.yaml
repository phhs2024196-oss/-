intent: |
  양수 $a$의 범위에 따라 극한값이 달라짐을 알고 로그함수의 성질로 극한을 구하는 능력, 도함수를 활용해 부등식을 만족하는 자연수의 개수를 구하고 수열의 극한을 구하는 능력, 타원과 포물선의 성질과 포물선의 접선의 방정식, 평면벡터의 내적을 활용하는 능력을 본다.
key_idea: |
  1.은 $a<1$, $a=1$, $a>1$로 나누어 큰 쪽 항을 묶어 낸다. 2.는 $n^k\le k^n\iff f(k)\ge f(n)$ ($f(x)=\tfrac{\ln x}{x}$)이고 $f$는 $x>e$에서 감소. 3.은 $\mathrm{A}(-x_1,0)$에서 $\cos60^\circ=\tfrac{x_1-p}{x_1+p}$로 $x_1=3p$, 타원과의 교점 조건과 연결한다.
stuck: |
  1.에서 $a$의 범위 분류, 2.에서 지수 부등식을 $\tfrac{\ln x}{x}$의 대소로 바꾸는 발상, 3.에서 $b^4=(a^2-p^2)^2$을 이용해 교점의 $x$좌표를 $\tfrac{a(a-p)}{a+p}$로 정리하는 계산
idea_tags: [IDEA-DOMINANT-TERM-CASE-LIMIT, IDEA-LNX-OVER-X-COMPARE, IDEA-PARABOLA-TANGENT-INTERSECT-AXIS]
tags: [로그 극한, 수열의 극한, 지수 부등식, 포물선의 접선, 타원, 내적, 배점환산]
elements:
  materials:
  - '$\displaystyle\lim_{n\to\infty}\dfrac1n\log(a^{2n}+a^{5n})$ ($a>0$)'
  - '$n^k\le k^n$을 만족시키는 자연수 $k$의 개수 $a_n$ ($n,k>2$)'
  - '한 초점을 공유하는 타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$과 포물선 $y^2=4px$, 두 교점에서 그은 포물선의 접선이 이루는 각 $60^\circ$'
  concepts:
  - 로그함수
  - 함수의 극한의 성질
  - 수열의 극한
  - 도함수의 활용
  - 여러 가지 함수의 미분
  - 이차곡선과 직선의 위치 관계
  - 포물선의 접선의 방정식
  - 평면벡터의 내적
  tools:
  - '큰 항 $a^{2n}$ 또는 $a^{5n}$을 묶어 $\log$를 분리'
  - '양변에 자연로그를 취해 $\dfrac{\ln n}{n}\le\dfrac{\ln k}{k}$로 변형'
  - '$f(x)=\dfrac{\ln x}{x}$의 도함수 $\dfrac{1-\ln x}{x^2}$'
  - '포물선의 접선 $y_1y=2p(x+x_1)$'
  - '내적으로 $\cos\theta$ 계산'
  - '$\dfrac ap=t$로 치환한 이차방정식'
  conditions:
  - '$a=1$이면 $\log2$가 상수라 극한 0'
  - '$k\ge3$인 자연수만 셈 → $a_n=n-2$'
  - '타원의 초점 $(p,0)$이므로 $a^2-b^2=p^2$'
  - '$x_1>0$인 근을 택하고 $t>0$'
  stimuli_used: []
