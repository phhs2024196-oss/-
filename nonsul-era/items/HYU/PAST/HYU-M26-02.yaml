stem: |
  다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{n\to\infty}\frac1n\log(a^{2n}+a^{5n})$의 값을 구하시오. (단, $a$는 양수이다.)
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'Piecewise((2*log(a), a < 1), (0, Eq(a, 1)), (5*log(a), True))', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $0<a<1$이면 $a^{2n}$, $a>1$이면 $a^{5n}$이 지배한다.
    steps:
    - {id: 1a, content: '$0<a<1$: $2\log a$, $a=1$: $0$, $a>1$: $5\log a$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $a$가 1보다 작을 때와 클 때 $a^{2n}$과 $a^{5n}$ 중 어느 쪽이 더 큰가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 모의논술 예시답안 2번 p.3 문항 1
    steps:
    - id: 1b-1
      content: |
        $a=1$일 때, $\displaystyle\lim_{n\to\infty}\frac1n\log(a^{2n}+a^{5n})=\lim_{n\to\infty}\frac1n\log2=0$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $0<a<1$일 때, $\displaystyle\lim_{n\to\infty}\frac1n\log a^{2n}(1+a^{3n})=\lim_{n\to\infty}\left[2\log a+\frac{\log(1+a^{3n})}{n}\right]=2\log a$.
        $1<a<\infty$일 때, $\displaystyle\lim_{n\to\infty}\frac1n\log a^{5n}(a^{-3n}+1)=\lim_{n\to\infty}\left[5\log a+\frac{\log(a^{-3n}+1)}{n}\right]=5\log a$.
        답: $2\log a$ $(0<a<1)$, $0$ $(a=1)$, $5\log a$ $(a>1)$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        양수 $a$의 범위를 $0<a<1$, $a=1$, $a>1$로 나누었다(평가지침 10/30).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        극한값을 $a$의 범위에 따라 $2\log a$, $0$, $5\log a$로 구했다(평가지침 20/30).
      depends_on: ['1.M1']
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    자연수 $n$에 대하여 $n^k\le k^n$을 만족시키는 자연수 $k$의 개수를 $a_n$이라 하자.
    $\displaystyle\lim_{n\to\infty}\frac{a_n}{n}$의 값을 구하시오. (단, $n$, $k$는 2보다 큰 자연수이다.)
  points: 15
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=\tfrac{\ln x}{x}$가 $x>e$에서 감소하므로 $3\le k\le n$만 가능, $a_n=n-2$.
    steps:
    - {id: 2a, content: '$a_n=n-2$, $\lim\tfrac{a_n}{n}=1$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 양변에 로그를 취하고 $kn$으로 나누어 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 모의논술 예시답안 2번 p.3 문항 2
    steps:
    - id: 2b-1
      content: |
        주어진 부등식에 자연로그를 취하면 $n^k\le k^n\iff k\ln n\le n\ln k\iff\dfrac{\ln n}{n}\le\dfrac{\ln k}{k}$이다.
        양의 실수에서 정의된 함수 $f(x)=\dfrac{\ln x}{x}$에 대하여 $a_n$은 $f(k)\ge f(n)$을 만족시키는 자연수 $k$의 개수이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $f'(x)=\dfrac{1-\ln x}{x^2}$이고 $x>e$인 $x$에 대하여 $f'(x)<0$이므로 구간 $(e,\infty)$에서 $f(x)$는 감소한다.
        $n\ge3$인 자연수 $n$에 대하여 자연수 $k$가 $k\le n$이면 $f(k)\ge f(n)$이고, $k>n$이면 $f(k)<f(n)$이다.
        따라서 $a_n=n-2$이므로 $\displaystyle\lim_{n\to\infty}\frac{a_n}{n}=1$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $f(x)=\dfrac{\ln x}{x}$에 대하여 $f(k)\ge f(n)$을 만족시키는 자연수 $k$의 개수가 $a_n$임을 보였다(평가지침 10/30).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        $f(x)$의 도함수로 $a_n=n-2$와 극한값 $1$을 구했다(평가지침 20/30).
      depends_on: ['2.M1']
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ $(0<b<a)$의 한 초점이 포물선 $y^2=4px$ $(p>0)$의 초점일 때,
    포물선과 타원이 만나는 두 점을 $\mathrm{P}_1$, $\mathrm{P}_2$라 하자. 점 $\mathrm{P}_1$에서의 포물선의 접선과
    점 $\mathrm{P}_2$에서의 포물선의 접선이 만나는 점을 $\mathrm{A}$라 하자. 각 $\mathrm{P}_1\mathrm{A}\mathrm{P}_2$의 크기가 $60^\circ$일 때,
    $\dfrac ap$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '2 + sqrt(7)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{A}(-x_1,0)$, $\cos\theta=\tfrac{x_1-p}{x_1+p}=\tfrac12$에서 $x_1=3p$, 한편 $x_1=\tfrac{a(a-p)}{a+p}$.
    steps:
    - {id: 3a, content: '$3p=\tfrac{a(a-p)}{a+p}\Rightarrow t^2-4t-3=0$, $t=\tfrac ap=2+\sqrt7$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - 두 교점은 $x$축에 대하여 대칭이다. 두 접선의 교점은 어디에 있는가?
    - 두 벡터 $\overrightarrow{\mathrm{AP_1}}$, $\overrightarrow{\mathrm{AP_2}}$의 내적으로 $\cos60^\circ$를 표현하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2026 모의논술 예시답안 2번 p.3 문항 3
    steps:
    - id: 3b-1
      content: |
        두 교점 중 $y$좌표가 양수인 점을 $\mathrm{P}_1(x_1,y_1)$이라 하면 $\mathrm{P}_2(x_1,-y_1)$이다.
        $\mathrm{P}_1$, $\mathrm{P}_2$에서의 포물선의 접선은 $y_1y=2p(x+x_1)$, $-y_1y=2p(x+x_1)$이므로 $\mathrm{A}(-x_1,0)$이고
        $\overrightarrow{\mathrm{AP_1}}=(2x_1,y_1)$, $\overrightarrow{\mathrm{AP_2}}=(2x_1,-y_1)$이다.
        $\angle\mathrm{P_1AP_2}=\theta$라 하면 $\cos\theta=\dfrac{4x_1^2-y_1^2}{4x_1^2+y_1^2}=\dfrac{4x_1^2-4px_1}{4x_1^2+4px_1}=\dfrac{x_1-p}{x_1+p}$.
        $\theta=60^\circ$이므로 $x_1=3p$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $x_1$과 $y_1$은 $\dfrac{x_1^2}{a^2}+\dfrac{y_1^2}{b^2}=1$과 $y_1^2=4px_1$을 만족하므로 $\dfrac{x_1^2}{a^2}+\dfrac{4px_1}{b^2}=1$, $x_1>0$.
        이를 풀면 $x_1=-\dfrac{2a^2p}{b^2}+\sqrt{\dfrac{4a^4p^2}{b^4}+a^2}$이고, $b^2=a^2-p^2$이므로
        $x_1=-\dfrac{2a^2p}{b^2}+\dfrac{a(a^2+p^2)}{b^2}=\dfrac{a(a-p)^2}{b^2}=\dfrac{a(a-p)}{a+p}$.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        그러므로 $3p=\dfrac{a(a-p)}{a+p}$이고, $\dfrac ap=t$라 하면 $t^2-4t-3=0$이다. $t>0$이므로 $t=2+\sqrt7$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        내적을 활용하여 두 교점의 $x$좌표와 $p$의 관계식 $x_1=3p$를 구했다(평가지침 10/40).
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 10
      evidence: |
        두 교점의 $x$좌표를 $a$와 $p$로 $x_1=\dfrac{a(a-p)}{a+p}$처럼 표현했다(평가지침 20/40).
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        $\dfrac ap=2+\sqrt7$을 구했다(평가지침 10/40).
      depends_on: ['3.M1', '3.M2']
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

