intent: |
  미분으로 두 곡선의 접선의 기울기를 구하고 두 직선의 수직 조건으로 얻은 방정식을 인수분해해 해를 구하는 능력, 특정한 사람이 이웃하는 순열의 경우의 수를 구하는 능력, 지수함수·로그함수의 대칭성과 정적분으로 두 도형의 넓이를 표현하고 극한값을 구하는 능력을 본다.
key_idea: |
  1.은 공통 기울기 $m$으로 $c=\tfrac{m+8}3$, $b m=-(a+2)$를 얻고 $\mathrm{PQ}$ 기울기 $-\tfrac1m$ 조건을 $m^3+10m+28=0$으로 정리한다. 2.는 (서준·도윤 이웃) $-$ (민서·도윤·서준이 도윤 가운데로 이웃). 3.은 $y=a^x$와 $y=\log_ax$가 $y=x$에 대칭이므로 $R=2\int(x-a^x)dx$, $S=2(g-f)^2$이고 $f<e<g$, $g>\tfrac{\ln(1/\ln a)}{\ln a}$로 극한을 정리한다.
stuck: |
  1.에서 $c$, $d$, $b$를 모두 $m$과 $a$로 바꿔 $m$만의 삼차방정식을 얻는 정리, 2.에서 빼야 할 경우가 '도윤이가 가운데'인 세 명 묶음임을 찾는 단계, 3.에서 $g(a)\to\infty$의 속도를 부등식 $a^{g}=g>\tfrac1{\ln a}$로 잡아 $\tfrac1{g\ln a}\to0$을 보이는 단계
