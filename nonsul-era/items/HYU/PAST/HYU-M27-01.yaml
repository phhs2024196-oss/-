stem: |
  다음 물음에 답하시오. (50점)

subparts:
- id: '1'
  stem: |
    곡선 $y=\sqrt{-x^2-4x+1}$ 위의 점 $\mathrm{P}(a,b)$에서의 접선은 곡선 $y=\dfrac32x^2-8x+12$ 위의
    점 $\mathrm{Q}(c,d)$에서의 접선과 평행하고, 점 $\mathrm{P}$와 점 $\mathrm{Q}$를 지나는 직선과 수직이다.
    이때, 점 $\mathrm{P}$와 점 $\mathrm{Q}$의 좌표를 각각 구하시오. (단, $-2-\sqrt5<a<-2+\sqrt5$)
  points: 15
  depends_on: []
  answer: {kind: expression, value: '((0, 1), (2, 2))', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 공통 기울기 $m$에 대해 $bm=-(a+2)$, $c=\tfrac{m+8}3$, $m\left(\tfrac{m^2-64}6+12-b\right)=a-c$ → $(m+2)(m^2-2m+14)=0$.
    steps:
    - {id: 1a, content: '$m=-2$, $c=2$, $a=0$ → $\mathrm{P}(0,1)$, $\mathrm{Q}(2,2)$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 두 접선의 공통 기울기를 $m$으로 두고 $a$, $b$, $c$, $d$를 $m$으로 나타내 보자.
    - 직선 $\mathrm{PQ}$의 기울기는 $-\dfrac1m$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 모의논술 예시답안 1번 p.1 문항 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\sqrt{-x^2-4x+1}=\sqrt{5-(x+2)^2}$, $g(x)=\tfrac32x^2-8x+12$라 하면 $b=\sqrt{5-(a+2)^2}$, $d=\tfrac32c^2-8c+12$이다.
        접선의 기울기를 $m$이라 하면 $m=f'(a)=\dfrac{-(a+2)}{\sqrt{5-(a+2)^2}}=-\dfrac{a+2}{b}$라서 $bm=-(a+2)$이고,
        $m=g'(c)=3c-8$이므로 $c=\dfrac{m+8}3$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        직선 $\mathrm{PQ}$의 기울기는 $\dfrac{g(c)-f(a)}{c-a}=-\dfrac1m$, 즉 $m\left(\tfrac32c^2-8c+12-b\right)=a-c$이다.
        $\tfrac32c^2-8c=\tfrac12c(3c-16)=\tfrac12c(m-8)=\tfrac16(m+8)(m-8)=\dfrac{m^2-8^2}{6}$을 이용하면
        $m\left(\dfrac{m^2-8^2}{6}+12-b\right)=a-\dfrac{m+8}3\iff m^3+(-8^2+72)m-6mb=6a-2(m+8)\iff m^3+8m+6(a+2)=6a-2m-16\iff m^3+10m+28=0\iff(m+2)(m^2-2m+14)=0$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        판별식을 이용하면 $m^2-2m+14>0$이므로 $m=-2$이다. 대입하면 $c=\dfrac{-2+8}3=2$이고 $-2=\dfrac{-(a+2)}{\sqrt{5-(a+2)^2}}\Rightarrow4(5-(a+2)^2)=(a+2)^2\Rightarrow(a+2)^2=4$라서 $a=0$ 또는 $a=-4$인데, 기울기 $-2=\dfrac{-(a+2)}{\sqrt{5-(a+2)^2}}$를 만족하려면 $a=0$이다.
        이를 이용하여 $b=1$, $d=2$를 얻고, 따라서 $\mathrm{P}(0,1)$, $\mathrm{Q}(2,2)$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: |
        미분을 활용하여 두 곡선의 접선의 기울기 $f'(a)=-\dfrac{a+2}{b}$, $g'(c)=3c-8$을 구했다(평가지침 15/30).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: |
        수직인 직선의 기울기와 인수분해 $(m+2)(m^2-2m+14)=0$을 이용하여 $\mathrm{P}(0,1)$, $\mathrm{Q}(2,2)$를 구했다(평가지침 15/30).
      depends_on: ['1.M1']
      steps: [1b-2, 1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    서준이와 도윤이와 민서를 포함한 5명이 영화관에서 영화를 보려고 한다. 일렬로 된 7개의 좌석이 남아 있을 때, 다음 두 조건을 모두 만족시키도록 앉는 경우의 수를 구하시오.

    (1) 서준이와 도윤이가 이웃하게 앉는다.
    (2) 도윤이와 민서가 이웃하게 앉지 않는다.
  points: 15
  depends_on: []
  answer: {kind: value, value: '600', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $2\times{}_6\mathrm{P}_4-2\times{}_5\mathrm{P}_3=720-120$.
    steps:
    - {id: 2a, content: '$720-120=600$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 서준이와 도윤이를 한 묶음으로 생각해 보자.
    - 조건 (1)을 만족하면서 조건 (2)를 어기는 경우, 세 사람은 어떻게 앉아 있는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 모의논술 예시답안 1번 p.1 문항 2
    steps:
    - id: 2b-1
      content: |
        서준이와 도윤이를 한 묶음으로 생각하면, 서준이와 도윤이가 이웃하게 앉는 경우의 수는 6개의 좌석에 4명이 앉는 경우의 수에 두 사람의 자리를 바꾸는 두 가지 방법을 곱하여 $2\times{}_6\mathrm{P}_4=720$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        서준이와 도윤이가 이웃하고 도윤이와 민서가 이웃하게 되는 경우는 세 명이 모두 이웃하면서 도윤이가 가운데에 앉는 경우이다. 세 명을 한 묶음으로 생각하고 서준이와 민서의 자리를 바꾸는 두 가지를 고려하면 $2\times{}_5\mathrm{P}_3=120$이다.
        그러므로 구하는 경우의 수는 $720-120=600$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: |
        서준이와 도윤이를 한 묶음으로 생각하여 이웃하게 앉는 경우의 수 $720$을 구했다(평가지침 15/30).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 7
      evidence: |
        세 명이 모두 이웃하는(도윤이 가운데) 경우 $120$을 제외하여 $600$을 구했다(평가지침 15/30).
      depends_on: ['2.M1']
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $1<a<e^{\frac1e}$인 실수 $a$에 대하여, 두 곡선 $y=a^x$와 $y=\log_ax$는 서로 다른 두 점 $\mathrm{A}$, $\mathrm{B}$에서 만난다. $\mathrm{A}$, $\mathrm{B}$의 $x$좌표를 각각 $f(a)$, $g(a)$라 하자. (단, $0<f(a)<g(a)$이다.)
    위의 두 곡선으로 둘러싸인 도형의 넓이를 $R(a)$, 선분 $\mathrm{AB}$를 한 변으로 하는 정사각형의 넓이를 $S(a)$라 하자. 극한값 $\displaystyle\lim_{a\to1+}\frac{R(a)}{S(a)}$를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{R}{S}=\dfrac{1+\frac fg-\frac{2}{g\ln a}}{2\left(1-\frac fg\right)}$이고 $\tfrac fg\to0$, $\tfrac1{g\ln a}\to0$.
    steps:
    - {id: 3a, content: '극한값 $\tfrac12$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 두 곡선은 $y=x$에 대하여 대칭이다. 교점은 어디에 있는가?
    - $a\to1+$일 때 $f(a)$와 $g(a)$는 각각 어떻게 되는가? $f<e<g$를 보이자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2027 모의논술 예시답안 1번 p.1–2 문항 3
    steps:
    - id: 3b-1
      content: |
        $y=a^x$와 $y=\log_ax$는 그래프가 직선 $y=x$에 대하여 대칭이므로 $\mathrm{A}$, $\mathrm{B}$는 직선 $y=x$ 위의 점이며 $R(a)$는 곡선 $y=a^x$와 직선 $y=x$로 둘러싸인 넓이의 2배이다. 따라서
        $R(a)=2\displaystyle\int_{f(a)}^{g(a)}(x-a^x)\,dx=2\left[\tfrac12x^2-\dfrac{a^x}{\ln a}\right]_{f(a)}^{g(a)}=g(a)^2-f(a)^2-\dfrac{2(g(a)-f(a))}{\ln a}=(g(a)-f(a))\left(g(a)+f(a)-\dfrac2{\ln a}\right)$.
        선분 $\mathrm{AB}$의 길이는 $\sqrt2(g(a)-f(a))$이므로 $S(a)=2(g(a)-f(a))^2$이다. 그러므로
        $\dfrac{R(a)}{S(a)}=\dfrac{g(a)+f(a)-\frac2{\ln a}}{2(g(a)-f(a))}=\dfrac{1+\frac{f(a)}{g(a)}-\frac{2}{g(a)\ln a}}{2\left(1-\frac{f(a)}{g(a)}\right)}$ …… ①
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        한편 $1<a<e^{\frac1e}$이므로 $\ln a<\dfrac1e$이고 $a^e<e<\dfrac1{\ln a}=\log_ae$이다. 또한 $x>0$에 대하여 $a^x<\log_ax$와 $f(a)<x<g(a)$가 동치이므로 $f(a)<e<g(a)$이다.
        $a^{g(a)}=g(a)>e$이므로 $g(a)>\log_ae=\dfrac1{\ln a}$이고, $0<\dfrac{f(a)}{g(a)}<e\ln a$이므로 $\displaystyle\lim_{a\to1+}\frac{f(a)}{g(a)}=0$이다.
        또한 $a^{g(a)}=g(a)>\dfrac1{\ln a}$이므로 $g(a)>\log_a\left(\dfrac1{\ln a}\right)=\dfrac{\ln\left(\frac1{\ln a}\right)}{\ln a}$이고, 따라서 $0<\dfrac1{g(a)\ln a}<\dfrac{1}{\ln\left(\frac1{\ln a}\right)}$이므로 $\displaystyle\lim_{a\to1+}\frac1{g(a)\ln a}=0$이다.
        ①에 의해 $\displaystyle\lim_{a\to1+}\frac{R(a)}{S(a)}=\frac12$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        $R(a)=(g-f)\left(g+f-\dfrac2{\ln a}\right)$, $S(a)=2(g-f)^2$처럼 $R(a)$와 $S(a)$를 $a$로 표현했다(평가지침 20/40).
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 10
      evidence: |
        $\tfrac fg\to0$, $\tfrac1{g\ln a}\to0$을 근거와 함께 보이고 극한값 $\dfrac12$을 구했다(평가지침 20/40).
      depends_on: ['3.M1']
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

