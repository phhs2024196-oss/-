intent: |
  곡선 위의 점에서의 접선의 방정식과 음함수 꼴 방정식의 미분, 포물선의 접선과 등비수열의 기본 성질, 원의 방정식과 두 점 사이의 거리 및 정적분을 바탕으로 주어진 값과 도형의 넓이를 구할 수 있는지를 본다.
key_idea: |
  1.은 두 접선과 $x$축이 만드는 삼각형의 넓이를 $t$, $s$의 식으로 세워 $t=\tfrac12$에서 $s=2$를 얻고 음함수 미분. 2.는 $\overline{\mathrm{P}_k\mathrm{H}_k}=x_k+p$, $x_{k+1}=\tfrac{(x_k-p)^2}{4x_k}$와 등비중항 조건. 3.은 반지름 2인 원의 현 $\mathrm{PQ}$의 중점 $\mathrm{O}(x,y)$에 대해 $\overline{\mathrm{PQ}}=2y$이므로 $x^2+2y^2=4$.
stuck: |
  1.에서 넓이 조건을 $s$의 삼차방정식으로 정리하고 $s>1$인 근이 하나뿐임을 보이는 단계, 2.에서 등비중항 식이 $x_1+p=4x_2$로 단순해지는 계산, 3.에서 작은 반원의 반지름이 중점의 $y$좌표라는 해석
