subparts:
- id: '1'
  stem: |
    곡선 $y=x+\dfrac1x$ 위의 점 $\left(t,t+\dfrac1t\right)$에서의 접선과 점 $\left(s,s+\dfrac1s\right)$에서의 접선, 그리고 $x$축으로 둘러싸인 도형의 넓이가 $\dfrac{32}{15}$일 때, $t=\dfrac12$에서 $\dfrac{ds}{dt}$의 값을 구하시오. (단, $0<t<1<s$)
  points: 20
  depends_on: []
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 넓이 $\dfrac{2(s-t)(ts+1)^2}{(1-t^2)(s^2-1)(t+s)}=\dfrac{32}{15}$를 $F(t,s)=0$으로 보고 음함수 미분.
    steps:
    - {id: 1a, content: '$t=\tfrac12\Rightarrow s=2$, $\dfrac{ds}{dt}=4$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 각 접선의 $x$절편과 두 접선의 교점을 구해 삼각형의 넓이를 쓰자.
    - $s$를 $t$의 함수로 보고 넓이 조건식을 그대로 $t$로 미분하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 모의논술 예시답안 2번 p.3 문항 1
    steps:
    - id: 1b-1
      content: |
        점 $\left(t,t+\frac1t\right)$에서의 접선은 $y=\left(1-\frac1{t^2}\right)(x-t)+t+\frac1t=\left(1-\frac1{t^2}\right)x+\frac2t$이고 $x$절편은 $\dfrac{2t}{1-t^2}$이다.
        점 $\left(s,s+\frac1s\right)$에서의 접선은 $y=\left(1-\frac1{s^2}\right)x+\frac2s$이고 $x$절편은 $-\dfrac{2s}{s^2-1}$이다.
        두 접선의 교점은 $\left(\frac1{t^2}-\frac1{s^2}\right)x=\frac2t-\frac2s$에서 $x=\dfrac{2ts}{t+s}$, $y=\dfrac{2(ts+1)}{t+s}$이다.
        두 접선과 $x$축으로 둘러싸인 도형은 삼각형이므로 넓이는
        $\dfrac12\left(\dfrac{2t}{1-t^2}+\dfrac{2s}{s^2-1}\right)\dfrac{2(ts+1)}{t+s}=\dfrac{2(s-t)(ts+1)^2}{(1-t^2)(s^2-1)(t+s)}=\dfrac{32}{15}$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $t=\dfrac12$일 때 $5\left(s-\frac12\right)\left(\frac s2+1\right)^2=4(s^2-1)\left(s+\frac12\right)$이고 정리하면 $22s^3-19s^2-52s+4=(s-2)(22s^2+25s-2)=0$.
        $h(s)=22s^2+25s-2$라 두면 $h(1)=45>0$이고 $s>1$일 때 $h'(s)=44s+25>0$이므로 $s>1$에서 $h(s)>0$이다. 따라서 $s=2$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        위 방정식을 정리하면 $(31t^2-16)s^3+(t^3+14t)s^2-(46t^2-31)s-16t^3+t=0$이다. $s$를 $t$에 대한 함수로 보고 양변을 $t$에 대해 미분하면
        $62ts^3+3(31t^2-16)s^2\dfrac{ds}{dt}+(3t^2+14)s^2+2(t^3+14t)s\dfrac{ds}{dt}-92ts-(46t^2-31)\dfrac{ds}{dt}-48t^2+1=0$
        이고 $t=\dfrac12$, $s=2$를 대입하면 $\dfrac{ds}{dt}=4$를 얻는다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: |
        삼각형의 넓이를 $t$와 $s$에 대한 식 $\dfrac{2(s-t)(ts+1)^2}{(1-t^2)(s^2-1)(t+s)}$로 표현했다(평가지침 15/40).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $t=\dfrac12$일 때 $s=2$임을 구했다(평가지침 10/40).
      depends_on: ['1.M1']
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 7
      evidence: |
        음함수의 미분법을 이용하여 $t=\dfrac12$에서 $\dfrac{ds}{dt}=4$를 구했다(평가지침 15/40).
      depends_on: ['1.M1']
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    직선 $x=-p$ $(p>0)$ 위에 $y$좌표가 0이 아닌 점 $\mathrm{H}_1$이 있다. 점 $\mathrm{H}_1$과 $y$좌표가 같은 포물선 $y^2=4px$ 위의 점을 $\mathrm{P}_1$이라 하자. 포물선 $y^2=4px$ 위의 점 $\mathrm{P}_1$에서의 접선이 직선 $x=-p$와 만나는 점을 $\mathrm{H}_2$, 점 $\mathrm{H}_2$와 $y$좌표가 같은 포물선 위의 점을 $\mathrm{P}_2$라 하자.
    포물선 $y^2=4px$ 위의 점 $\mathrm{P}_2$에서의 접선이 직선 $x=-p$와 만나는 점을 $\mathrm{H}_3$, 점 $\mathrm{H}_3$과 $y$좌표가 같은 포물선 위의 점을 $\mathrm{P}_3$이라 하자. $\overline{\mathrm{P}_1\mathrm{H}_1}$, $\overline{\mathrm{P}_2\mathrm{H}_2}$, $\overline{\mathrm{P}_3\mathrm{H}_3}$가 이 순서대로 등비수열의 연속된 세 항일 때, 점 $\mathrm{P}_1$의 $x$좌표를 $p$에 대한 식으로 나타내시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'p/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x_{k+1}=\dfrac{(x_k-p)^2}{4x_k}$, $\overline{\mathrm{P}_k\mathrm{H}_k}=x_k+p$, 등비중항에서 $x_1+p=4x_2$.
    steps:
    - {id: 2a, content: '$x_1+p=\dfrac{(x_1-p)^2}{x_1}\Rightarrow x_1=\dfrac p3$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 포물선 위의 점 $(x_1,y_1)$에서의 접선 $y_1y=2p(x+x_1)$을 이용하자.
    - $\overline{\mathrm{P}_k\mathrm{H}_k}$는 $x$좌표로 어떻게 나타나는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 모의논술 예시답안 2번 p.3 문항 2
    steps:
    - id: 2b-1
      content: |
        $\mathrm{P}_1(x_1,y_1)$이라 두자. $\mathrm{P}_1$에서의 접선은 $y_1y=2p(x+x_1)$이므로 $\mathrm{H}_2$의 $y$좌표는 $\dfrac{2p(-p+x_1)}{y_1}$이다.
        $\mathrm{P}_2(x_2,y_2)$라 두면 $y_2=\dfrac{2p(-p+x_1)}{y_1}$이므로 $y_2^2=4px_2$로부터 $x_2=\dfrac{(x_1-p)^2}{4x_1}$을 얻는다.
        같은 방법으로 $\mathrm{P}_3(x_3,y_3)$에 대해 $x_3=\dfrac{(x_2-p)^2}{4x_2}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\overline{\mathrm{P_1H_1}}=x_1+p$, $\overline{\mathrm{P_2H_2}}=x_2+p$, $\overline{\mathrm{P_3H_3}}=x_3+p$가 이 순서대로 등비수열의 연속된 세 항이므로 $\overline{\mathrm{P_2H_2}}^2=\overline{\mathrm{P_1H_1}}\times\overline{\mathrm{P_3H_3}}$을 만족한다.
        (공식 예시답안에는 이 식이 $\overline{\mathrm{P_2H_2}}^2=\overline{\mathrm{P_1H_1}}\times\overline{\mathrm{P_2H_2}}$로 적혀 있으나, 바로 다음 식 $(x_2+p)^2=(x_1+p)(x_3+p)$에 맞게 $\overline{\mathrm{P_3H_3}}$로 바로잡았다.)
        $x_3+p=\dfrac{(x_2-p)^2+4px_2}{4x_2}=\dfrac{(x_2+p)^2}{4x_2}$이므로 $(x_2+p)^2=(x_1+p)(x_3+p)=\dfrac{(x_1+p)(x_2+p)^2}{4x_2}$, 즉 $x_1+p=4x_2=\dfrac{(x_1-p)^2}{x_1}$을 얻는다. 이로부터 $x_1=\dfrac p3$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        점 $\mathrm{P}_2$, $\mathrm{P}_3$의 $x$좌표 $x_2=\dfrac{(x_1-p)^2}{4x_1}$, $x_3=\dfrac{(x_2-p)^2}{4x_2}$를 각각 구했다(평가지침 10/30).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        등비수열의 성질을 이용하여 $x_1=\dfrac p3$을 구했다(평가지침 20/30).
      depends_on: ['2.M1']
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [그림: 지름 $\mathrm{AB}$(길이 4)인 반원과 그 호 위의 두 점 $\mathrm{P}$(위쪽), $\mathrm{Q}$(오른쪽 아래). 선분 $\mathrm{PQ}$를 지름으로 하는 작은 반원이 선분 $\mathrm{AB}$에 점 $\mathrm{R}$에서 접하고, $\mathrm{PQ}$의 중점 $\mathrm{O}$ 표시]
    오른쪽 그림과 같이 길이 4인 선분 $\mathrm{AB}$가 지름인 반원의 호 위에 두 점 $\mathrm{P}$, $\mathrm{Q}$가 있다. 선분 $\mathrm{PQ}$는 선분 $\mathrm{AB}$와 점 $\mathrm{R}$에서 접하는 작은 반원의 지름이다.
    점 $\mathrm{R}$이 점 $\mathrm{A}$에서 점 $\mathrm{B}$까지 선분 $\mathrm{AB}$ 위에서 움직일 때, 선분 $\mathrm{PQ}$의 중점 $\mathrm{O}$가 이루는 곡선과 선분 $\mathrm{AB}$로 둘러싸인 도형의 넓이를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 'sqrt(2)*pi', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 원점 중심 반지름 2인 원의 현 $\mathrm{PQ}$의 중점 $\mathrm{O}(x,y)$에서 $x^2+y^2+\left(\tfrac{\overline{\mathrm{PQ}}}2\right)^2=4$, $\tfrac{\overline{\mathrm{PQ}}}{2}=y$.
    steps:
    - {id: 3a, content: '$y=\tfrac1{\sqrt2}\sqrt{4-x^2}$, 넓이 $\tfrac1{\sqrt2}\cdot2\pi=\sqrt2\pi$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 반원을 좌표평면에 놓고 $\mathrm{O}(x,y)$라 하자. 작은 반원의 반지름은?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2027 모의논술 예시답안 2번 p.3 문항 3
    steps:
    - id: 3b-1
      content: |
        지름의 양 끝점 $\mathrm{A}$, $\mathrm{B}$가 각각 $(-2,0)$, $(2,0)$이고 호가 $x$축 위쪽에 있도록 반원을 좌표평면에 두자. $\mathrm{P}(a,b)$, $\mathrm{Q}(c,d)$, 선분 $\mathrm{PQ}$의 중점 $\mathrm{O}(x,y)$라 하면
        $a^2+b^2=4$, $c^2+d^2=4$, $\dfrac{a+c}2=x$, $\dfrac{b+d}2=y$, $\sqrt{(a-c)^2+(b-d)^2}=2y$가 성립한다.
        (공식 예시답안에는 마지막 식이 $\sqrt{(a-c)^2+(b-d)^2}=(2y)^2$으로 적혀 있으나, 작은 반원의 반지름이 $y$이므로 $\overline{\mathrm{PQ}}=2y$로 바로잡았다.)
        $a,b,c,d$를 소거하고 $y$에 대해 정리하면 $y=\dfrac1{\sqrt2}\sqrt{4-x^2}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        따라서 구하는 도형은 곡선 $y=\dfrac1{\sqrt2}\sqrt{4-x^2}$과 선분 $\mathrm{AB}$로 둘러싸인 도형이다($-2\le x\le2$, $0\le y\le\sqrt2$).
        넓이는 $\dfrac1{\sqrt2}\displaystyle\int_{-2}^{2}\sqrt{4-x^2}\,dx$이고 $\displaystyle\int_{-2}^{2}\sqrt{4-x^2}\,dx$는 반지름 2인 반원의 넓이 $2\pi$이므로 구하는 넓이는 $\dfrac1{\sqrt2}\times2\pi=\sqrt2\pi$이다.
      criteria: ['3.A1']
