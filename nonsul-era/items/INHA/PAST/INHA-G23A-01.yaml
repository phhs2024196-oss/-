stimuli:
- label: 제시문
  body: |
    이차방정식 $ax^2+bx+c=0\ (a\neq0)$의 두 근을 $\alpha$, $\beta$라 하면
    $$\alpha+\beta=-\dfrac{b}{a},\quad \alpha\beta=\dfrac{c}{a}$$
    이다.

stem: |
  [문제 1] (35점) 다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    실수 $\alpha$, $\beta\ (\alpha<\beta)$에 대하여 $\beta-\alpha=k$라 할 때, 곡선 $y=(x-\alpha)(x-\beta)$와 $x$축으로 둘러싸인 영역의 넓이를 $k$의 식으로 나타내시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: expression, value: '\dfrac{k^3}{6}', equivalents: ['k^3/6'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$x=\alpha+u$로 평행이동하면 $-\displaystyle\int_0^k u(u-k)\,du=\dfrac{k^3}{6}$.'
    steps:
    - {id: 1a, content: '$-\displaystyle\int_\alpha^\beta(x-\alpha)(x-\beta)dx=-\int_0^{k}x(x-k)dx=\dfrac{k^3}{6}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 곡선은 $\alpha<x<\beta$에서 $x$축 아래에 있다.
    - $x-\alpha=u$로 치환하면 적분 구간이 $[0,k]$가 된다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설(문항카드) p.2 예시답안 (1-1)
    steps:
    - id: 1b-1
      content: |
        $\beta+\alpha=-a$, $\beta\alpha=b$라 하면 근의 공식으로부터 $k=\beta-\alpha=\sqrt{a^2-4b}$이고 $\beta^2-\alpha^2=(\beta+\alpha)(\beta-\alpha)=-ak$이다. 또 $\beta^3-\alpha^3=(\beta-\alpha)\{(\beta+\alpha)^2-\beta\alpha\}=k(a^2-b)$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        구간 $[\alpha,\beta]$에서 $(x-\alpha)(x-\beta)\le0$이므로 구하는 넓이는
        $$\int_\alpha^\beta(-x^2-ax-b)\,dx=-\dfrac13(\beta^3-\alpha^3)-\dfrac a2(\beta^2-\alpha^2)-b(\beta-\alpha)$$
        $$=-\dfrac13k(a^2-b)+\dfrac a2\cdot ak-bk=\dfrac16k(a^2-4b)=\dfrac16k^3$$
        이다.
      criteria: [1.M1, 1.A1]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    source_flow: 2023 자연오전 해설 p.3 [별해]
    steps:
    - id: 1c-1
      content: |
        $$-\int_\alpha^\beta(x-\alpha)(x-\beta)dx=-\int_0^{\beta-\alpha}x(x-\beta+\alpha)dx=\dfrac{-(\beta-\alpha)^3}{3}+\dfrac{(\beta-\alpha)^3}{2}=\dfrac{k^3}{6}$$
      criteria: [1.M1, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.2): 계산 실패로 답을 못 구하면 0점, 넓이를 $-\int_\alpha^\beta(x-\alpha)(x-\beta)dx$로 나타내고 계산을 완성하지 못하면 3점, $\dfrac{k^3}{6}$을 올바르게 구하면 (누적) 10점.'
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: '넓이를 $-\displaystyle\int_\alpha^\beta(x-\alpha)(x-\beta)dx$(또는 같은 뜻의 정적분)로 나타냈다.'
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1a, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: '넓이를 $\dfrac{k^3}{6}$으로 올바르게 구했다.'
      depends_on: [1.M1]
      steps: [1b-2, 1a, 1c-1]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5101}
  misconceptions:
  - id: MC-CAL-5101
    outcome_code: '70'
    wrong_work: '$\displaystyle\int_\alpha^\beta(x-\alpha)(x-\beta)dx=-\dfrac{k^3}{6}$을 그대로 넓이로 써서 음수 넓이를 답함'
    detect_cue: 답이 $-\dfrac{k^3}{6}$ 또는 부호 설명 없음
    feedback: 곡선이 $x$축 아래에 있는 구간에서는 정적분 값의 부호를 바꿔야 넓이가 됩니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    자연수 $m$에 대하여 곡선 $y=x^2$과 직선 $y=mx+\dfrac{51}{4}$로 둘러싸인 영역의 넓이 $S$를 $m$의 식으로 나타내시오. [10점]
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'S=\dfrac16(m^2+51)^{\frac32}', equivalents: ['(m^2+51)^(3/2)/6', '\dfrac{(m^2+51)\sqrt{m^2+51}}{6}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 두 교점의 $x$좌표 차가 $\sqrt{m^2+51}$이므로 (1-1)에 대입.
    steps:
    - {id: 2a, content: '$\beta-\alpha=\sqrt{m^2+51}$ ⇒ $S=\dfrac16(m^2+51)^{\frac32}$', criteria: [2.B1]}
    hint_ladder:
    - 직선과 포물선 사이의 넓이는 $\displaystyle\int_\alpha^\beta\{(mx+\tfrac{51}{4})-x^2\}dx$이다.
    - 이것은 $-\displaystyle\int_\alpha^\beta(x-\alpha)(x-\beta)dx$와 같다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설 p.3 예시답안 (1-2)
    steps:
    - id: 2b-1
      content: |
        $x^2-mx-\dfrac{51}{4}=0$의 두 근은 $x=\dfrac{m\pm\sqrt{m^2+51}}{2}$이므로 $\beta-\alpha=\sqrt{m^2+51}$이다.
        두 근 사이에서 $mx+\dfrac{51}{4}-x^2=-(x-\alpha)(x-\beta)\ge0$이므로 (1-1)에 의해 $S=\dfrac16(m^2+51)^{\frac32}$이다.
      criteria: [2.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.2): $S=\dfrac16(m^2+51)^{\frac32}$를 구하면 10점(부분점수 항목 없음).'
    criteria:
    - id: 2.B1
      mark_type: B
      points: 10
      evidence: '교점의 $x$좌표 차 $\sqrt{m^2+51}$을 구하고 $S=\dfrac16(m^2+51)^{\frac32}$를 적었다.'
      depends_on: []
      steps: [2b-1, 2a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-5102}
  misconceptions:
  - id: MC-ALG-5102
    outcome_code: '70'
    wrong_work: '두 근의 차를 $\sqrt{m^2-51}$ 또는 $\sqrt{m^2+51}/2$로 계산(판별식에서 $4\cdot\frac{51}{4}$의 부호·계수 실수)'
    detect_cue: 답에 $m^2-51$ 또는 $\dfrac{1}{48}$ 같은 계수가 나타남
    feedback: '$x^2-mx-\frac{51}{4}=0$의 판별식은 $m^2+51$이고 두 근의 차는 $\sqrt{D}/|a|$입니다.'
    remedy: [RL-2]

- id: '3'
  stem: |
    (1-2)에서 구한 $S$가 유리수가 되는 자연수 $m$을 모두 구하시오. [15점]
  points: 15
  depends_on: ['2']
  answer: {kind: set, value: '\{7,\ 25\}', equivalents: ['m=7, 25'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$\sqrt{m^2+51}=M$(정수) ⇒ $(M+m)(M-m)=51=3\times17$.'
    steps:
    - {id: 3a, content: '$(M-m,M+m)=(3,17),(1,51)$ ⇒ $m=7,25$', criteria: [3.R1, 3.A1, 3.A2]}
    hint_ladder:
    - $(m^2+51)^{\frac32}$이 유리수가 되려면 $\sqrt{m^2+51}$은 어떤 수여야 할까?
    - $M^2-m^2=51$을 인수분해하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설 p.3 예시답안 (1-3)
    steps:
    - id: 3b-1
      content: |
        자연수 $m$에 대해 $\dfrac16(m^2+51)^{\frac32}$이 유리수가 되려면 $\sqrt{m^2+51}$이 정수가 되어야 한다.
      criteria: [3.R1]
    - id: 3b-2
      content: |
        $\sqrt{m^2+51}=M$이라 하면 $M^2-m^2=51$, 즉 $(M+m)(M-m)=51=3\times17$이다. 이때 $M+m>M-m$이므로
        (i) $M-m=3$인 경우: $M+m=17$이 되고 따라서 $m=7$이다.
        (ii) $M-m=1$인 경우: $M+m=51$이 되고 따라서 $m=25$이다.
        따라서 $m=7,\ 25$이다.
      criteria: [3.A1, 3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.2): $\sqrt{m^2+51}$이 정수가 되어야 한다는 사실 언급 3점, $m=7$을 구하면(계산 없어도) 2점, $m=25$를 구하면 10점. 단 (1-2) 답이 틀린 경우 이 부분 최대 7점, $m=7,25$를 답만 쓴 경우 최대 5점.'
    criteria:
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: '$S$가 유리수이려면 $\sqrt{m^2+51}$이 정수여야 한다고 적었다.'
      depends_on: []
      steps: [3b-1, 3a]
    - id: 3.A1
      mark_type: B
      points: 2
      evidence: '$m=7$을 구했다(계산 없어도 인정).'
      depends_on: []
      steps: [3b-2, 3a]
    - id: 3.A2
      mark_type: A
      points: 10
      evidence: '$(M+m)(M-m)=51$의 인수 쌍을 따져 $m=25$를 구했다.'
      depends_on: [3.R1]
      steps: [3b-2, 3a]
    deductions:
    - code: D3-1
      condition: (1-2)의 답이 틀린 경우
      effect: cap
      value: 7
    - code: D3-2
      condition: '$m=7,25$를 과정 없이 답만 쓴 경우'
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CNT-5103}
  misconceptions:
  - id: MC-CNT-5103
    outcome_code: '70'
    wrong_work: '작은 $m$부터 대입해 $m=7$만 찾고 멈추거나, 인수 쌍 $(1,51)$을 빠뜨림'
    detect_cue: 답이 $m=7$ 하나뿐
    feedback: '$(M-m)(M+m)=51$의 가능한 인수 쌍을 모두 나열해야 "모두 구하시오"에 답할 수 있습니다.'
    remedy: [RL-3]

