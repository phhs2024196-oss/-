stimuli:
- label: 가
  body: |
    [부분적분법] 두 함수 $f(x)$, $g(x)$가 미분가능할 때
    $$\int f(x)g'(x)dx=f(x)g(x)-\int f'(x)g(x)dx$$
    이다.
- label: 나
  body: |
    $\displaystyle\int x^2e^xdx=(x^2-2x+2)e^x+C$ 이다.

stem: |
  [문제 2] (30점) 다음 제시문을 읽고 물음에 답하시오.
  (※) 함수 $f(x)=(x-2)^2e^x$과 닫힌구간 $[a,b]$에서 $g(x)\ge f(x)$인 일차함수 $g(x)$에 대하여
  $$S=\int_a^b(g(x)-f(x))dx$$
  라 하자.

subparts:
- id: '1'
  stem: |
    점 $(2,0)$을 지나고 곡선 $y=f(x)$에 접하는 직선의 방정식을 모두 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: set, value: 'y=0,\ y=-ex+2e', equivalents: ['y=0, y=-e(x-2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '접점 $(t,f(t))$의 접선에 $(2,0)$을 대입하면 $t=1$ 또는 $t=2$.'
    steps:
    - {id: 1a, content: '$-(t-2)^2e^t=t(t-2)e^t(2-t)$ ⇒ $(t-2)^2(t-1)=0$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 접점을 $(t,f(t))$로 두자.
    - '$f^{\prime}(x)=x(x-2)e^x$이다.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설(문항카드) p.5 예시답안 (2-1)
    steps:
    - id: 1b-1
      content: |
        $f'(x)=x(x-2)e^x$이므로 곡선 $y=f(x)$ 위의 점 $(t,f(t))$에서의 접선은
        $$y-(t-2)^2e^t=t(t-2)e^t(x-t)$$
        이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이 직선이 $(2,0)$을 지나므로 $-(t-2)^2e^t=t(t-2)e^t(2-t)=-t(t-2)^2e^t$, 즉 $(t-2)^2(t-1)e^t=0$이므로 $t=1$이거나 $t=2$이다. 따라서 구하고자 하는 직선은
        $$y=0,\qquad y=-ex+2e$$
        이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.5): 점 $(t,f(t))$에서의 접선 $y-(t-2)^2e^t=t(t-2)e^t(x-t)$를 구하면 5점, 두 접선 $y=0$, $y=-ex+2e$를 구하면 5점.'
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: '점 $(t,f(t))$에서의 접선 $y-(t-2)^2e^t=t(t-2)e^t(x-t)$를 적었다.'
      depends_on: []
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: '두 접선 $y=0$, $y=-ex+2e$를 모두 적었다.'
      depends_on: [1.M1]
      steps: [1b-2, 1a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5104}
  misconceptions:
  - id: MC-CAL-5104
    outcome_code: '70'
    wrong_work: '$(2,0)$이 곡선 위의 점이므로 그 점에서의 접선 $y=0$ 하나만 답함'
    detect_cue: 답이 $y=0$ 하나뿐
    feedback: '"지나는" 접선은 접점이 다른 곳에 있을 수도 있습니다. 접점을 $t$로 두고 모든 $t$를 찾으세요.'
    remedy: [RL-1]

- id: '2'
  stem: |
    $a,b\ (a<b)$가 방정식 $f'(x)=0$의 두 근이고 $g(x)=6-3x$일 때, $S$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '16-2e^2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$a=0$, $b=2$, $\displaystyle\int(x-2)^2e^xdx=(x^2-6x+10)e^x+C$.'
    steps:
    - {id: 2a, content: '$S=\left[6x-\tfrac32x^2-(x^2-6x+10)e^x\right]_0^2=16-2e^2$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - $(x-2)^2=x^2-4x+4$로 전개해 (나)와 $\int xe^xdx$를 쓰자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설 p.5 예시답안 (2-2)
    steps:
    - id: 2b-1
      content: |
        $f'(x)=x(x-2)e^x$이므로 $a=0$, $b=2$이다. 제시문 (가)의 부분적분법을 이용하면 $\displaystyle\int xe^xdx=(x-1)e^x+C$이므로 제시문 (나)에 의해
        $$\int(x-2)^2e^xdx=(x^2-6x+10)e^x+C$$
        이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        그러므로
        $$S=\int_0^2[6-3x-(x-2)^2e^x]dx=\left[6x-\dfrac32x^2-(x^2-6x+10)e^x\right]_0^2=16-2e^2$$
        이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.5): $\int(x-2)^2e^xdx=(x^2-6x+10)e^x+C$를 구하면 5점, $S=16-2e^2$을 구하면 5점.'
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: '$\displaystyle\int(x-2)^2e^xdx=(x^2-6x+10)e^x+C$를 적었다.'
      depends_on: []
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: '$S=16-2e^2$을 적었다.'
      depends_on: [2.M1]
      steps: [2b-2, 2a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5105}
  misconceptions:
  - id: MC-CAL-5105
    outcome_code: '70'
    wrong_work: '$\int(x-2)^2e^xdx$를 $(x-2)^2e^x-2(x-2)e^x+C$로 끝내 마지막 부분적분 항 $+2e^x$를 빠뜨림'
    detect_cue: '부정적분이 $(x^2-6x+8)e^x$ 꼴이거나 답이 $14-2e^2$ 등'
    feedback: 다항식×지수함수의 부분적분은 다항식이 상수가 될 때까지 반복해야 합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $a=-1$, $b=2$일 때, $S$가 최소가 되는 $g(x)$를 구하고 이때의 $S$의 값을 구하시오. [10점]
  points: 10
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'g(x)=f\left(\tfrac12\right)+f^{\prime}\left(\tfrac12\right)\left(x-\tfrac12\right)=-\dfrac34\sqrt e\,x+\dfrac{21}{8}\sqrt e,\quad S=\dfrac{27}{4}\sqrt e-2e^2+\dfrac{17}{e}', equivalents: ['g(x)=\dfrac{9}{4}\sqrt e-\dfrac34\sqrt e\left(x-\dfrac12\right)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$\displaystyle\int_{-1}^2g=3g(\tfrac12)\ge3f(\tfrac12)$, 등호는 $x=\tfrac12$에서의 접선.'
    steps:
    - {id: 3a, content: '$S=3g(\tfrac12)-\int_{-1}^2f\ge3f(\tfrac12)-\int_{-1}^2f=\tfrac{27}{4}\sqrt e-2e^2+\tfrac{17}{e}$', criteria: [3.M1, 3.A1]}
    hint_ladder:
    - $S$가 최소이면 직선은 곡선에 접해야 한다.
    - 접점을 $t$로 두고 넓이를 $t$의 함수로 나타내 미분하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설 p.5~6 예시답안 (2-3)
    steps:
    - id: 3b-1
      content: |
        $S$가 최소일 때 직선 $y=g(x)$는 곡선 $y=f(x)$에 접하므로 $g(x)=f(t)+f'(t)(x-t)$로 쓸 수 있다. (2-1)의 결과와 함수 $y=f(x)$의 그래프에 의해 $-1\le t\le1$이다.
        [그림: $y=f(x)$(붉은 곡선, $x=0$에서 극댓값 4, $x=2$에서 $x$축에 접함)와 곡선 위 두 점에서 그은 두 접선을 그린 그래프]
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $g(x)=f(t)+f'(t)(x-t)$일 때의 $S$를 $h(t)$로 두면
        $$h(t)=\int_{-1}^2[f(t)+f'(t)(x-t)-f(x)]dx=3f(t)+\left(-3t+\dfrac32\right)f'(t)-\int_{-1}^2f(x)dx$$
        이고
        $$\dfrac{dh}{dt}=\left(-3t+\dfrac32\right)f''(t)=-3\left(t-\dfrac12\right)(t^2-2)e^t$$
        이다. $-1\le t\le1$에서 $t^2-2<0$이므로 $h'(t)$는 $t=\dfrac12$의 좌우에서 음에서 양으로 바뀐다. 따라서 $S$는 $t=\dfrac12$일 때, 즉 $g(x)=f\left(\dfrac12\right)+f'\left(\dfrac12\right)\left(x-\dfrac12\right)$일 때 최소이다.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        최솟값은
        $$3f\left(\dfrac12\right)-\int_{-1}^2f(x)dx=\dfrac{27}{4}\sqrt e-\left[(x^2-6x+10)e^x\right]_{-1}^2=\dfrac{27}{4}\sqrt e-2e^2+\dfrac{17}{e}$$
        을 갖는다.
      criteria: [3.A1]
  - id: S3-ALT
    audience: ALT
    method_no: 2
    source_flow: 2023 자연오전 해설 p.6 (별해)
    steps:
    - id: 3c-1
      content: |
        $g(x)$가 일차식이므로 $\displaystyle\int_{-1}^2g(x)dx=3g\left(\dfrac12\right)$이다. 그러므로
        $$S=3g\left(\dfrac12\right)-\int_{-1}^2f(x)dx\ \ge\ 3f\left(\dfrac12\right)-\int_{-1}^2f(x)dx=\dfrac{27}{4}\sqrt e-2e^2+\dfrac{17}{e}$$
        이다. $g(x)=f\left(\dfrac12\right)+f'\left(\dfrac12\right)\left(x-\dfrac12\right)$이면 $g\left(\dfrac12\right)=f\left(\dfrac12\right)$이고 함수 $y=f(x)$의 그래프와 (2-1)의 결과에 의해 구간 $[-1,2]$에서 $g(x)\ge f(x)$이므로 위 부등식에서 등호가 성립한다. 따라서 $S$의 최솟값은 $\dfrac{27}{4}\sqrt e-2e^2+\dfrac{17}{e}$이다.
      criteria: [3.M1, 3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.5): $g(x)=f(\tfrac12)+f^{\prime}(\tfrac12)(x-\tfrac12)$일 때 $S$가 최소임을 보이면 5점, $S$의 최솟값이 $\tfrac{27}{4}\sqrt e-2e^2+\tfrac{17}{e}$임을 보이면 5점.'
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: '$g(x)=f(\tfrac12)+f^{\prime}(\tfrac12)(x-\tfrac12)$일 때 $S$가 최소임을 근거(넓이 함수의 미분 또는 $\int g=3g(\tfrac12)$)와 함께 보였다.'
      depends_on: []
      steps: [3b-1, 3b-2, 3a, 3c-1]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: '$S$의 최솟값 $\dfrac{27}{4}\sqrt e-2e^2+\dfrac{17}{e}$을 적었다.'
      depends_on: [3.M1]
      steps: [3b-3, 3a, 3c-1]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5106}
  misconceptions:
  - id: MC-CAL-5106
    outcome_code: '70'
    wrong_work: '양 끝점 $(-1,f(-1))$, $(2,f(2))$를 잇는 직선이나 (2-1)의 접선 $y=-ex+2e$를 최소 직선으로 잡음'
    detect_cue: '$g$가 $x=\tfrac12$에서의 접선이 아님'
    feedback: '구간에서 곡선 위에 있는 직선 중 넓이가 최소인 것은 구간 중점에서의 접선입니다($\int g=3g(\tfrac12)$).'
    remedy: [RL-3]

