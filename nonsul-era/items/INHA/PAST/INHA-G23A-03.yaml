  - 정수 전수 확인
  conditions:
  - '$s<a<t$인 모든 $s,t$에 대해 $f(s)>f(a)>f(t)$ ⇒ $a$를 포함한 구간에서 감소 + $f(a)$가 왼쪽 모든 값보다 작고 오른쪽 모든 값보다 큼'
  - '$\lvert g(x)-k\rvert$가 $[-1,1]$에서 최솟값을 갖지 않음 ⇒ $y=k$에 가장 가까운 점이 빈 점 $(0,0)$ 하나뿐'
