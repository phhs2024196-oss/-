key_idea: '$g(t)=\lim_{x\to t+}f^{\prime}(x)$는 $t<0$에서 $\tfrac t2$, $t\ge0$에서 $4-2t$로 $t=0$에서 끊긴다. 평균변화율이 $g$의 값으로 실현되지 않는 것은 그 값이 $g$의 치역의 틈 $[0,2)$ 근처에 떨어질 때뿐이다.'
stuck: (3-3)에서 평균변화율이 $\dfrac{f(b)}{b}$와 $\dfrac{f(a)}{a}$ 사이 값임을 이용해 $0\le\dfrac{f(b)-f(a)}{b-a}\le-2b+4$로 조건을 바꾸는 단계
