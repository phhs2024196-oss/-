stimuli:
- label: 두 직선의 수직 조건
  body: |
    [두 직선의 수직 조건] 두 직선 $y=mx+n$과 $y=m'x+n'$에서
    (i) 두 직선이 서로 수직이면 $mm'=-1$이다.
    (ii) $mm'=-1$이면 두 직선은 서로 수직이다.

stem: |
  [문제 1] (30점) 다음 제시문을 읽고 물음에 답하시오.
  ※ 좌표평면에서 원점을 $O$라 하자. 실수 $t\ (t\ge1)$에 대하여 함수 $f(x)=e^{-x}$의 그래프 위의 한 점 $P(t,e^{-t})$에서의 접선이 $x$축과 만나는 점을 $Q$라 하고, 점 $P$를 지나고 접선에 수직인 직선이 $x$축과 만나는 점을 $R$이라 하자.
  [그림: 곡선 $y=e^{-x}$ 위의 점 $P$에서 그은 접선이 $x$축과 $Q$에서 만나고, $P$를 지나는 수직선(법선)이 $x$축과 $R$에서 만난다. $x$축 위에 왼쪽부터 $O$, $R$, $Q$ 순서로 놓이고 선분 $OP$도 그려져 있다.]

subparts:
- id: '1'
  stem: |
    (1-1) 삼각형 $OPQ$의 넓이 $A(t)$를 $t$의 식으로 나타내시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'A(t)=\dfrac{(t+1)e^{-t}}{2}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '접선 $y=-e^{-t}(x-t)+e^{-t}$의 $x$절편은 $t+1$.'
    steps:
    - {id: 1a, content: '$A(t)=\dfrac12(t+1)e^{-t}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $f'(t)=-e^{-t}$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오후 해설(문항카드) p.2 예시답안 (1-1)
    steps:
    - id: 1b-1
      content: |
        직선 $PQ$의 기울기는 $-e^{-t}$이고, $(t,e^{-t})$를 지나므로 직선 $PQ$의 방정식은 $y=-e^{-t}(x-t)+e^{-t}$이 된다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $Q$의 좌표는 $(t+1,0)$이 된다. 따라서 삼각형 $OPQ$의 넓이 $A(t)$는 $A(t)=\dfrac{(t+1)e^{-t}}{2}$이 된다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.2): 직선 $PQ$의 방정식 $y=-e^{-t}(x-t)+e^{-t}$을 구하면 5점, $A(t)=\dfrac{(t+1)e^{-t}}{2}$으로 나타내면 5점.'
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: '직선 $PQ$의 방정식 $y=-e^{-t}(x-t)+e^{-t}$을 적었다.'
      depends_on: []
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: '$Q(t+1,0)$과 $A(t)=\dfrac{(t+1)e^{-t}}{2}$를 적었다.'
      depends_on: [1.M1]
      steps: [1b-2, 1a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5118}
  misconceptions:
  - id: MC-CAL-5118
    outcome_code: '70'
    wrong_work: '$(e^{-x})^{\prime}=e^{-x}$로 미분해 접선 기울기를 $+e^{-t}$로 둠'
    detect_cue: '$Q$의 좌표가 $(t-1,0)$'
    feedback: '합성함수 미분으로 $(e^{-x})^{\prime}=-e^{-x}$입니다. 그림에서도 $Q$는 $P$의 오른쪽에 있습니다.'
    remedy: [RL-1]

- id: '2'
  stem: |
    (1-2) $(2t-1)A(t)$의 최댓값을 구하시오. [10점]
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{9}{2e^2}', equivalents: ['4.5e^{-2}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$g(t)=\tfrac12(2t^2+t-1)e^{-t}$, $g^{\prime}(t)=\tfrac12(2-t)(1+2t)e^{-t}$.'
    steps:
    - {id: 2a, content: '$t=2$에서 최대, $g(2)=\dfrac{9}{2e^2}$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - 곱의 미분법으로 도함수를 구해 부호를 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오후 해설 p.3 예시답안 (1-2)
    steps:
    - id: 2b-1
      content: |
        함수 $g(t)=(2t-1)A(t)=\dfrac12(2t-1)(t+1)e^{-t}=\dfrac12(2t^2+t-1)e^{-t}$이라 하면 $g'(t)=\dfrac12(2-t)(1+2t)e^{-t}$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $1\le t<2$에서 $g'(t)>0$이고 $2<t$에서 $g'(t)<0$이므로 $t=2$에서 최댓값을 갖는다. 따라서 $g(2)=\dfrac{9}{2e^2}$가 최댓값이 된다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.2): $(2t-1)A(t)$의 도함수 $\tfrac12(2-t)(1+2t)e^{-t}$을 구하면 5점, 최댓값 $\tfrac{9}{2e^2}$를 구하면 5점.'
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: '도함수 $\tfrac12(2-t)(1+2t)e^{-t}$을 적었다.'
      depends_on: []
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: '도함수의 부호 변화로 $t=2$에서 최대임을 밝히고 최댓값 $\dfrac{9}{2e^2}$를 적었다.'
      depends_on: [2.M1]
      steps: [2b-2, 2a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5119}
  misconceptions:
  - id: MC-CAL-5119
    outcome_code: '70'
    wrong_work: '곱의 미분에서 $e^{-t}$의 미분 부호를 놓쳐 $g^{\prime}(t)=\tfrac12(2t^2+5t)e^{-t}$ 등으로 계산해 최댓값이 없다고 하거나 끝점 $t=1$을 답함'
    detect_cue: '최댓값을 $g(1)=e^{-1}$로 답하거나 "최댓값 없음"'
    feedback: '$\{p(t)e^{-t}\}^{\prime}=\{p^{\prime}(t)-p(t)\}e^{-t}$입니다.'
    remedy: [RL-2]

- id: '3'
  stem: |
    (1-3) 삼각형 $OPQ$의 내접원의 반지름을 $r$이라 하고, 삼각형 $PQR$의 넓이를 $S$라 할 때, $\displaystyle\lim_{t\to\infty}\dfrac{r}{S}$의 값을 구하시오. [10점]
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$r=\dfrac{2A}{OP+PQ+OQ}$, $S=\dfrac12RQ\cdot e^{-t}$, $RQ=1+e^{-2t}$.'
    steps:
    - {id: 3a, content: '$\dfrac rS=\dfrac{2(t+1)}{(OP+PQ+OQ)(1+e^{-2t})}\to1$', criteria: [3.B1, 3.B2, 3.A1]}
    hint_ladder:
    - 삼각형의 넓이 $=\tfrac12r\times$(둘레).
    - $R$의 좌표를 수직 조건으로 구하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오후 해설 p.3 예시답안 (1-3)
    steps:
    - id: 3b-1
      content: |
        선분 $OP$의 길이는 $\sqrt{t^2+(e^{-t})^2}$, 선분 $PQ$의 길이는 $\sqrt{1+(e^{-t})^2}$, 선분 $OQ$의 길이는 $t+1$이다.
        삼각형 $OPQ$의 넓이는 $\dfrac{(t+1)e^{-t}}{2}$이고 내접원의 반지름을 이용하여 삼각형 $OPQ$의 넓이를 표현하면 $\dfrac12r(\overline{OP}+\overline{PQ}+\overline{QO})=\dfrac{(t+1)e^{-t}}{2}$이므로
        $$r=\dfrac{(t+1)e^{-t}}{\sqrt{t^2+(e^{-t})^2}+\sqrt{1+(e^{-t})^2}+t+1}$$
        이다.
      criteria: [3.B1]
    - id: 3b-2
      content: |
        직선 $PR$은 직선 $PQ$에 수직이므로 제시문에 의하여 직선 $PR$의 기울기는 $e^t$이고 점 $P(t,e^{-t})$을 지나므로 직선 $PR$의 방정식은 $y=e^t(x-t)+e^{-t}$이다. 점 $R$의 좌표는 $(t-e^{-2t},0)$이다. 그러므로 선분 $RQ$의 길이는 $1+e^{-2t}$이므로 삼각형 $PQR$의 넓이는 $S=\dfrac{(1+e^{-2t})e^{-t}}{2}$이다.
      criteria: [3.B2]
    - id: 3b-3
      content: |
        따라서 구하고자 하는 극한은
        $$\lim_{t\to\infty}\dfrac rS=\lim_{t\to\infty}\dfrac{2(t+1)}{\left(\sqrt{t^2+(e^{-t})^2}+\sqrt{1+(e^{-t})^2}+t+1\right)(1+e^{-2t})}=1$$
        이다.
      criteria: [3.A1]
  - id: S3-ALT
    audience: ALT
    method_no: 2
    source_flow: 2023 자연오후 해설 p.3 (별해)
    steps:
    - id: 3c-1
      content: |
        직선 $PR$의 방정식은 $y=e^t(x-t)+e^{-t}$이므로 점 $R$의 좌표는 $(t-e^{-2t},0)$이고 $\overline{RQ}=(t+1)-(t-e^{-2t})=1+e^{-2t}$이다.
        삼각형의 넓이를 내접원의 반지름에 대하여 표현하면 $\dfrac12r(\overline{OP}+\overline{PQ}+\overline{RQ})$이고 [판독확인: 원문 표기 그대로 — 문맥상 $\overline{OQ}$], $\displaystyle\lim_{t\to\infty}\dfrac{\overline{OP}+\overline{PQ}}{\overline{OQ}}=1$이므로 점 $P$에서 $x$축까지의 거리를 $h$라 하면
        $$\lim_{t\to\infty}\dfrac rS=\lim_{t\to\infty}\dfrac{\dfrac{\overline{OQ}\cdot h}{\overline{OP}+\overline{PQ}+\overline{OQ}}}{\dfrac12\overline{RQ}\cdot h}=\dfrac{\frac12}{\frac12\cdot1}=1$$
        이다.
      criteria: [3.B1, 3.B2, 3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.2): $r=\dfrac{(t+1)e^{-t}}{\sqrt{t^2+(e^{-t})^2}+\sqrt{1+(e^{-t})^2}+t+1}$을 구하면 3점, $S=\dfrac{(1+e^{-2t})e^{-t}}{2}$을 구하면 3점, 극한값 1을 구하면 4점.'
    criteria:
    - id: 3.B1
      mark_type: M
      points: 3
      evidence: '$r=\dfrac{(t+1)e^{-t}}{\sqrt{t^2+e^{-2t}}+\sqrt{1+e^{-2t}}+t+1}$을 적었다.'
      depends_on: []
      steps: [3b-1, 3a, 3c-1]
    - id: 3.B2
      mark_type: B
      points: 3
      evidence: '$R(t-e^{-2t},0)$과 $S=\dfrac{(1+e^{-2t})e^{-t}}{2}$을 적었다.'
      depends_on: []
      steps: [3b-2, 3a, 3c-1]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: '극한값 1을 적었다.'
      depends_on: [3.B1, 3.B2]
      steps: [3b-3, 3a, 3c-1]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5120}
  misconceptions:
  - id: MC-CAL-5120
    outcome_code: '70'
    wrong_work: '$OP\approx t$, $PQ\approx1$, $OQ=t+1$에서 둘레를 $t+1$로만 근사해 극한을 2로 답함'
    detect_cue: 답이 2 또는 $\tfrac12$
    feedback: '둘레는 $OP+PQ+OQ\sim2t$입니다. 각 변의 지배항을 빠짐없이 더하세요.'
    remedy: [RL-3]

