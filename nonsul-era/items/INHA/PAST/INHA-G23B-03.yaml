stimuli:
- label: 가
  body: |
    [부분적분법] 두 함수 $f(x)$, $g(x)$가 미분가능할 때
    $$\int f(x)g'(x)dx=f(x)g(x)-\int f'(x)g(x)dx$$
    이다.
- label: 나
  body: |
    두 번 미분가능한 함수 $f(x)$가 어떤 구간에서
    $f''(x)>0$이면 곡선 $y=f(x)$는 그 구간에서 아래로 볼록하고,
    $f''(x)<0$이면 곡선 $y=f(x)$는 그 구간에서 위로 볼록하다.

stem: |
  [문제 3] (35점) 다음 제시문을 읽고 물음에 답하시오.
  (※) $0\le t<\pi$인 실수 $t$에 대하여 함수 $f(x)$를
  $$f(x)=\begin{cases}(\sin t)x & (0\le x\le t)\\ \dfrac{t\sin t}{t-\pi}(x-\pi) & (t<x\le\pi)\end{cases}$$
  로 정의할 때, $S=\displaystyle\int_0^\pi\lvert f(x)-x\sin x\rvert dx$라 하자.

subparts:
- id: '1'
  stem: |
    (3-1) 닫힌구간 $[0,\pi]$에서 $x$에 대한 방정식 $f(x)-x\sin x=0$의 서로 다른 해의 개수를 $g(t)$라 할 때, $g(t)=4$를 만족하는 $t$의 값의 범위를 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: set, value: '\dfrac\pi2<t<\pi', equivalents: ['(\pi/2,\pi)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '원점에서 곡선 $y=x\sin x$에 그은 접선의 접점은 $x=\tfrac\pi2$. 꼭짓점이 그 오른쪽이면 첫 선분이 곡선을 한 번 더 자른다.'
    steps:
    - {id: 1a, content: '접선 조건 $t^2\cos t=0$ ⇒ $t=\tfrac\pi2$, 따라서 $\tfrac\pi2<t<\pi$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $y=x\sin x$의 그래프를 $y'$, $y''$로 그려 보자.
    - 원점을 지나는 접선을 구하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오후 해설(문항카드) p.8~9 예시답안 (3-1)
    steps:
    - id: 1b-1
      content: |
        $y=x\sin x$일 때, $y'=\sin x+x\cos x$이다. $y'=0$이면 $\tan x=-x$이므로 $\sin\alpha+\alpha\cos\alpha=0$인 $\alpha\in\left(\dfrac\pi2,\pi\right)$가 존재한다.
        마찬가지로 $y''=2\cos x-x\sin x$이고 $2\cos\beta-\beta\sin\beta=0$인 $\beta\in\left(0,\dfrac\pi2\right)$가 존재한다. 따라서 그래프의 개형은 다음과 같다.
        [그림: $[0,\pi]$에서 $y=x\sin x$의 그래프. 원점에서 시작해 아래로 볼록하게 증가하다가 변곡점 뒤 위로 볼록, $\tfrac\pi2$와 $\pi$ 사이에서 최댓값(약 1.8) 후 $(\pi,0)$으로 감소]
      criteria: [1.M1]
    - id: 1b-2
      content: |
        점 $(0,0)$을 지나고 곡선 $y=x\sin x$에 접하는 직선을 구해보자. 곡선 $y=x\sin x$의 $x=t$에서의 접선은 $y-t\sin t=(\sin t+t\cos t)(x-t)$이고, $(0,0)$을 지나므로 $t^2\cos t=0$이고 $t=0,\ \dfrac\pi2,\ \dfrac{3\pi}{2},\cdots$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        따라서 그래프의 개형으로부터 $g(t)=4$인 $t$의 범위는 $\dfrac\pi2<t<\pi$이다.
        [그림: 곡선 $y=x\sin x$와 두 꺾은선. 검은 꺾은선은 꼭짓점이 $x=\tfrac\pi2$(원점에서의 접선), 파란 꺾은선은 꼭짓점이 $\tfrac\pi2$보다 오른쪽에 있어 첫 선분이 곡선과 한 번 더 만난다]
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.8): $x=\tfrac\pi2$일 때 곡선 $y=x\sin x$에 접하는 직선이 원점을 지나는 것을 확인하면 5점, $t$의 범위가 $\tfrac\pi2<t<\pi$임을 보이면 5점.'
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: '$x=\tfrac\pi2$에서 곡선 $y=x\sin x$에 접하는 직선이 원점을 지남(접선식에 원점 대입 $t^2\cos t=0$)을 적었다.'
      depends_on: []
      steps: [1b-1, 1b-2, 1a]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: '그래프 개형을 근거로 $\tfrac\pi2<t<\pi$를 적었다.'
      depends_on: [1.M1]
      steps: [1b-3, 1a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5124}
  misconceptions:
  - id: MC-CAL-5124
    outcome_code: '70'
    wrong_work: '변곡점 $\beta$ 또는 최댓점 $\alpha$를 경계로 잡아 $\beta<t<\pi$ 또는 $\alpha<t<\pi$로 답함'
    detect_cue: 경계가 $\tfrac\pi2$가 아님
    feedback: '첫 선분이 곡선과 다시 만나는지는 원점에서 그은 접선의 접점($x=\tfrac\pi2$)과 비교해야 합니다.'
    remedy: [RL-1]

- id: '2'
  stem: |
    (3-2) $t=\dfrac\pi4$일 때 $S$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '-\dfrac{\sqrt2}{32}\pi^2+\left(\dfrac{\sqrt2}{4}+1\right)\pi-\sqrt2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\int x\sin x\,dx=-x\cos x+\sin x+C$, 구간 $[0,\tfrac\pi4]$와 $[\tfrac\pi4,\pi]$로 나눔.'
    steps:
    - {id: 2a, content: '$S=-\dfrac{\sqrt2}{32}\pi^2+\left(\dfrac{\sqrt2}{4}+1\right)\pi-\sqrt2$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - 두 번째 선분의 식은 $y=-\tfrac{\sqrt2}{6}(x-\pi)$이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오후 해설 p.9 예시답안 (3-2)
    steps:
    - id: 2b-1
      content: |
        제시문 (가)에 의해 $\displaystyle\int x\sin x\,dx=-x\cos x+\sin x+C$이므로
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $$S=\int_0^{\frac\pi4}\left(\dfrac{\sqrt2}{2}x-x\sin x\right)dx+\int_{\frac\pi4}^{\pi}\left\{x\sin x+\dfrac{\sqrt2}{6}(x-\pi)\right\}dx$$
        $$=\left[\dfrac{\sqrt2}{4}x^2+x\cos x-\sin x\right]_0^{\frac\pi4}+\left[-x\cos x+\sin x+\dfrac{\sqrt2}{12}(x-\pi)^2\right]_{\frac\pi4}^{\pi}$$
        $$=-\dfrac{\sqrt2}{32}\pi^2+\left(\dfrac{\sqrt2}{4}+1\right)\pi-\sqrt2$$
        이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.8): $\int x\sin x\,dx=-x\cos x+\sin x+C$를 구하면 5점, $S=-\tfrac{\sqrt2}{32}\pi^2+(\tfrac{\sqrt2}{4}+1)\pi-\sqrt2$를 구하면 5점.'
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: '$\displaystyle\int x\sin x\,dx=-x\cos x+\sin x+C$를 적었다.'
      depends_on: []
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: '$S=-\dfrac{\sqrt2}{32}\pi^2+\left(\dfrac{\sqrt2}{4}+1\right)\pi-\sqrt2$를 적었다.'
      depends_on: [2.M1]
      steps: [2b-2, 2a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5125}
  misconceptions:
  - id: MC-CAL-5125
    outcome_code: '70'
    wrong_work: '절댓값을 풀지 않고 $\int_0^\pi(f(x)-x\sin x)dx$를 한 번에 계산'
    detect_cue: '구간을 $\tfrac\pi4$에서 나누지 않음, 답이 음수이거나 $\pi$와 크게 다름'
    feedback: '구간마다 $f$와 $x\sin x$ 중 어느 쪽이 위인지 확인해 절댓값을 푸세요.'
    remedy: [RL-2]

- id: '3'
  stem: |
    (3-3) $S$의 최댓값을 구하시오. [15점]
  points: 15
  depends_on: ['1', '2']
  answer: {kind: value, value: '\pi', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$t>\tfrac\pi2$는 같은 선분을 공유하는 $t_2<\tfrac\pi2$로 바꾸면 $S$가 커지고, $0\le t\le\tfrac\pi2$에서 $S^{\prime}(t)<0$.'
    steps:
    - {id: 3a, content: '$S(t)=t^2\sin t+2t\cos t-\tfrac{\pi t}{2}\sin t-2\sin t+\pi$, $S(0)=\pi$', criteria: [3.R1, 3.M1, 3.A1]}
    hint_ladder:
    - $t>\tfrac\pi2$일 때 꺾은선과 곡선의 다른 교점을 꼭짓점으로 삼아 보자.
    - $0\le t\le\tfrac\pi2$에서 $S$를 $t$의 식으로 나타내 미분하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오후 해설 p.9~10 예시답안 (3-3)
    steps:
    - id: 3b-1
      content: |
        $t=t_1>\dfrac\pi2$이면 함수 $y=f(x)$의 그래프는 곡선 $y=x\sin x$와 $x=t_2\ \left(0<t_2<\dfrac\pi2\right)$일 때 만난다. 그래프에 의해 $t=t_2$일 때의 $S$는 $t=t_1$일 때의 $S$보다 크다. 그러므로 $S$는 $0\le t\le\dfrac\pi2$일 때 최댓값을 갖는다.
        [그림: 곡선 $y=x\sin x$ 위의 $x=t_1>\tfrac\pi2$를 꼭짓점으로 하는 꺾은선과, 첫 선분이 곡선과 만나는 $x=t_2<\tfrac\pi2$를 꼭짓점으로 하는 꺾은선을 함께 그린 그림]
      criteria: [3.R1]
    - id: 3b-2
      content: |
        $0\le t\le\dfrac\pi2$이면 $S$는
        $$S=\int_0^t\{(\sin t)x-x\sin x\}dx+\int_t^\pi\left\{x\sin x-\dfrac{t\sin t}{t-\pi}(x-\pi)\right\}dx=t^2\sin t+2t\cos t-\dfrac{\pi t}{2}\sin t-2\sin t+\pi$$
        이므로, $0<t<\dfrac\pi2$일 때 $\dfrac{dS}{dt}=t\left(t-\dfrac\pi2\right)\cos t-\dfrac\pi2\sin t<0$이다.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        따라서 $S$는 $t=0$일 때 최댓값 $\pi$를 갖는다.
      criteria: [3.A1]
  - id: S3-ALT
    audience: ALT
    method_no: 2
    source_flow: 2023 자연오후 해설 p.10 [별해]
    steps:
    - id: 3c-1
      content: |
        $t=t_1>\dfrac\pi2$이면 위와 같이 $S$는 $0\le t\le\dfrac\pi2$일 때 최댓값을 갖는다. $0<t\le\dfrac\pi2$라고 하고, $S_0=\displaystyle\int_0^\pi x\sin x\,dx=\pi$라고 하자.
        두 점 $(t,0)$, $(t,t\sin t)$을 각각 $P$, $P_0$이라고 하고, 원점을 $O$, 점 $(\pi,0)$을 $Q$라고 하면, 그래프의 개형으로부터
        $$S_0-S>\int_t^\pi x\sin x\,dx-S>\text{삼각형 }P_0PQ\text{의 넓이}-\text{삼각형 }OP_0P\text{의 넓이}\ge0$$
        이므로 $S$는 $t=0$일 때 최댓값 $S_0=\pi$를 갖는다.
      criteria: [3.R1, 3.M1, 3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.8): $S$는 $0\le t\le\tfrac\pi2$일 때 최댓값을 갖는 것을 보이면 5점, $\tfrac{dS}{dt}=t(t-\tfrac\pi2)\cos t-\tfrac\pi2\sin t<0$임을 보이면 5점, $S$의 최댓값 $\pi$를 구하면 5점.'
    criteria:
    - id: 3.R1
      mark_type: R
      points: 5
      evidence: '$t>\tfrac\pi2$인 경우를 $t_2<\tfrac\pi2$인 경우와 비교해 $S$가 $0\le t\le\tfrac\pi2$에서 최댓값을 가짐을 보였다.'
      depends_on: []
      steps: [3b-1, 3a, 3c-1]
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: '$0\le t\le\tfrac\pi2$에서 $S(t)$를 구하고 $\tfrac{dS}{dt}=t(t-\tfrac\pi2)\cos t-\tfrac\pi2\sin t<0$임을 보였다.'
      depends_on: []
      steps: [3b-2, 3a, 3c-1]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: '$S$의 최댓값 $\pi$($t=0$)를 적었다.'
      depends_on: [3.R1, 3.M1]
      steps: [3b-3, 3a, 3c-1]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5126}
  misconceptions:
  - id: MC-CAL-5126
    outcome_code: '70'
    wrong_work: '$0\le t\le\tfrac\pi2$에서 구한 $S(t)$ 식을 $t>\tfrac\pi2$에도 그대로 써서 $S^{\prime}(t)=0$인 점을 최대로 답함'
    detect_cue: '최댓값 후보가 $t>\tfrac\pi2$이거나 답이 $\pi$가 아님'
    feedback: '$t>\tfrac\pi2$이면 첫 선분이 곡선을 가로질러 절댓값 안의 부호가 바뀌므로 같은 식을 쓸 수 없습니다.'
    remedy: [RL-3]

remedy_links:
- id: RL-1
  trigger: {type: misconception, ref: MC-CAL-5124}
  relation: remediation
  target: {kind: concept, ref: CON-CAL-TANGENT-THROUGH-POINT-I1}
