stimuli:
- label: 가
  body: |
    [부분적분법] 두 함수 $f(x)$, $g(x)$가 미분가능할 때
    $$\int f(x)g'(x)dx=f(x)g(x)-\int f'(x)g(x)dx$$
    이다.
- label: 나
  body: |
    [사잇값의 정리] 함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\neq f(b)$이면 $f(a)$와 $f(b)$ 사이에 있는 임의의 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.

stem: |
  [문제 2] (35점) 다음 제시문을 읽고 물음에 답하시오.
  (※) 함수
  $$f(x)=\pi x\sin(\pi x)$$
  에 대하여 다음 질문에 답하시오.

subparts:
- id: '1'
  stem: |
    정수 $n$에 대하여 $\displaystyle\int_n^{n+1}f(x)\,dx$의 값을 구하시오. [5점]
  points: 5
  depends_on: []
  answer: {kind: expression, value: '(-1)^n(2n+1)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\int\pi x\sin\pi x\,dx=-x\cos\pi x+\tfrac1\pi\sin\pi x+C$.'
    steps:
    - {id: 1a, content: '$[-x\cos\pi x]_n^{n+1}=(-1)^n(2n+1)$', criteria: [1.B1]}
    hint_ladder:
    - $u=x$, $v'=\pi\sin\pi x$로 부분적분하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설(문항카드) p.11 예시답안 (2-1)
    steps:
    - id: 1b-1
      content: |
        부분적분을 이용하면
        $$\int_n^{n+1}f(x)dx=\left[-x\cos\pi x\right]_n^{n+1}+\int_n^{n+1}\cos\pi x\,dx$$
        $$=n\cos n\pi-(n+1)\cos(n+1)\pi=(-1)^nn-(-1)^{n+1}(n+1)=(-1)^n(2n+1)$$
        이다.
      criteria: [1.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.11): $\int_n^{n+1}f(x)dx=(-1)^n(2n+1)$를 구하면 5점.'
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: '부분적분으로 $\displaystyle\int_n^{n+1}f(x)dx=(-1)^n(2n+1)$를 구했다.'
      depends_on: []
      steps: [1b-1, 1a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5111}
  misconceptions:
  - id: MC-CAL-5111
    outcome_code: '70'
    wrong_work: '$\int_n^{n+1}\cos\pi x\,dx$를 0이 아닌 값으로 계산하거나 $\cos n\pi=1$로 두어 부호 $(-1)^n$을 빠뜨림'
    detect_cue: 답이 $2n+1$ 또는 $-(2n+1)$로 $n$의 홀짝과 무관
    feedback: '$\cos n\pi=(-1)^n$이고 $\sin$의 정수배 값은 0입니다.'
    remedy: [RL-1]

- id: 2a
  stem: |
    (2-2) (a) $0\le a<b<c\le6$인 실수 $a,b,c$에 대하여 $\displaystyle\int_a^bf(x)\,dx-\int_b^cf(x)\,dx$의 최댓값 $M$과 최솟값 $m$을 구하시오. [10점]
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: 'M=20,\ m=-16', equivalents: [], tolerance: null}
  solutions:
  - id: S2a-A
    audience: A
    method_no: 1
    key_idea: '최적점은 정수, 최대는 $a$ 짝·$b$ 홀·$c$ 짝이고 $b-a=1$ ⇒ $(4,5,6)$, 최소는 $(3,4,5)$.'
    steps:
    - {id: 2aa, content: '$I_4-I_5=9+11=20$, $I_3-I_4=-7-9=-16$ ($I_n=\int_n^{n+1}f$)', criteria: [2a.R1, 2a.R2, 2a.A1]}
    hint_ladder:
    - 끝점에서 $f$가 0이 아니면 끝점을 조금 움직여 값을 키울 수 있다.
    - (2-1)의 값을 표로 만들어 보자.
  - id: S2a-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설 p.12 예시답안 (2-2)(a)
    steps:
    - id: 2ab-1
      content: |
        $\displaystyle\int_a^bf(x)dx-\int_b^cf(x)dx$가 최대가 되는 $a,b,c$의 값을 각각 $a_1,b_1,c_1$이라고 하자. 그러면 $a_1,b_1,c_1$은 모두 정수이다. 왜냐하면 $a_1$이 정수가 아니라면 $f(a_1)>0$ 또는 $f(a_1)<0$인데, $f(a_1)>0$이라면 $a$의 값이 $a_1$보다 약간 작아지면 $\int_a^{b_1}f(x)dx-\int_{b_1}^{c_1}f(x)dx$의 값은 더 커지고, $f(a_1)<0$이라면 $a$의 값이 $a_1$보다 약간 커지면 그 값이 더 커지기 때문이다. 마찬가지 이유로 $b_1$, $c_1$도 정수이다.
      criteria: [2a.R1]
    - id: 2ab-2
      content: |
        이때 $a_1$은 짝수이다. 왜냐하면 $a_1$이 홀수라면 구간 $(a_1-1,a_1)$에서 $f(x)>0$이므로 $\int_{a_1-1}^{b_1}f(x)dx-\int_{b_1}^{c_1}f(x)dx$의 값이 $\int_{a_1}^{b_1}f(x)dx-\int_{b_1}^{c_1}f(x)dx$보다 크기 때문이다. 마찬가지로 $b_1$은 홀수이고 $c_1$은 짝수이다.
        $b_1$이 홀수이고 $a_1,c_1$이 짝수일 때 이 값이 최대이려면 $b_1-a_1=1$이어야 한다. 왜냐하면 고정된 홀수 $b_1$에 대하여 $\int_a^{b_1}f(x)dx$는 $a\ (a<b_1)$가 짝수 중에서 $a=b_1-1$일 때 최대이기 때문이다.
      criteria: [2a.R2]
    - id: 2ab-3
      content: |
        이 중에서 $\int_a^bf(x)dx-\int_b^cf(x)dx$는 $a,b,c$가 각각 $4,5,6$일 때 최대이고 $M=20$이다.
        마찬가지로 최솟값은 $b$가 짝수이고 $b-a=1$일 때 얻어진다. 실제로 $a,b,c$가 각각 $3,4,5$일 때 최소이고 $m=-16$이다.
      criteria: [2a.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.11): 최댓값/최솟값일 때 $a,b,c$가 정수여야 함을 파악하면 3점, 최댓값/최솟값을 구하는 정확한 논리를 제시하면 3점, $M=20$, $m=-16$을 구하면 4점.'
    criteria:
    - id: 2a.R1
      mark_type: R
      points: 3
      evidence: '최댓값·최솟값일 때 $a,b,c$가 정수여야 하는 이유(끝점을 조금 옮기면 값이 커짐/작아짐)를 적었다.'
      depends_on: []
      steps: [2ab-1, 2aa]
    - id: 2a.R2
      mark_type: R
      points: 3
      evidence: '홀짝 조건과 $b-a=1$ 등 최댓값·최솟값을 주는 정수를 좁히는 논리를 적었다.'
      depends_on: []
      steps: [2ab-2, 2aa]
    - id: 2a.A1
      mark_type: A
      points: 4
      evidence: '$M=20$, $m=-16$을 적었다.'
      depends_on: [2a.R1, 2a.R2]
      steps: [2ab-3, 2aa]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5112}
  misconceptions:
  - id: MC-CAL-5112
    outcome_code: '70'
    wrong_work: '$f$의 극값 위치(또는 $f$의 최대·최소점)를 $a,b,c$ 후보로 잡음'
    detect_cue: '$a,b,c$가 정수가 아닌 값으로 제시됨'
    feedback: '$\int_a^b f$를 $a$로 미분하면 $-f(a)$이므로 극값 후보는 $f(a)=0$인 점, 즉 정수입니다.'
    remedy: [RL-2]

- id: 2b
  stem: |
    (2-2) (b) $m<k<M$인 임의의 실수 $k$에 대하여
    $$\int_a^bf(x)\,dx-\int_b^cf(x)\,dx=k$$
    를 만족하는 실수 $a,b,c\ (0<a<b<c<6)$가 존재함을 보이시오. [10점]
  points: 10
  depends_on: [2a]
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2b-A
    audience: A
    method_no: 1
    key_idea: '창을 $(3,4,5)\to(4,5,6)$로 평행이동하는 연속함수 $h(x)$에 사잇값 정리.'
    steps:
    - {id: 2ba, content: '$h(0)=m$, $h(1)=M$, $h$ 연속 ⇒ $h(t)=k$인 $t\in(0,1)$', criteria: [2b.M1, 2b.R1]}
    hint_ladder:
    - (a)의 최소 $(3,4,5)$와 최대 $(4,5,6)$를 연속적으로 이어 보자.
  - id: S2b-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설 p.12 예시답안 (2-2)(b)
    steps:
    - id: 2bb-1
      content: |
        함수 $h(x)$를 닫힌구간 $[0,1]$에서 $h(x)=\displaystyle\int_{3+x}^{4+x}f(t)dt-\int_{4+x}^{5+x}f(t)dt$라고 정의하면,
        $h(x)=2\displaystyle\int_3^{4+x}f(t)dt-\int_3^{5+x}f(t)dt-\int_3^{3+x}f(t)dt$이므로 적분과 미분의 관계로부터 $h(x)$는 미분가능하므로 연속이다.
      criteria: [2b.M1]
    - id: 2bb-2
      content: |
        $h(0)=m$, $h(1)=M$이므로, 제시문 (나) 사잇값의 정리에 의하여 $m<k<M$인 임의의 실수 $k$에 대하여 $h(t)=k$인 $t$가 구간 $(0,1)$에 존재한다. 모든 $0<t<1$에 대하여 $h(t)$는 항상 $\displaystyle\int_a^bf(x)dx-\int_b^cf(x)dx$ (단, $0<a<b<c<6$)의 꼴이므로, 문제와 같이 $\displaystyle\int_a^bf(x)dx-\int_b^cf(x)dx=k$를 만족하는 실수 $a,b,c$가 존재한다.
      criteria: [2b.R1]
  - id: S2b-ALT
    audience: ALT
    method_no: 2
    source_flow: 2023 자연오전 해설 p.12 [(2-2)(b)의 별해]
    steps:
    - id: 2bc-1
      content: |
        구간 $[4,5]$에서 $h_1(x)=\displaystyle\int_3^xf(t)dt-\int_x^5f(t)dt$라고 하면, 구간에서 $h_1(x)$는 연속이고 $h_1(4)=-16$, $h_1(5)=2$이므로 $-16<k<2$일 때 $h_1(x)=k$인 $x\ (4<x<5)$가 사잇값의 정리에 의해 존재한다. 한편 구간 $[5,6]$에서 $h_2(x)=\displaystyle\int_4^xf(t)dt-\int_x^6f(t)dt$라고 하면, 구간에서 $h_2(x)$는 연속이고 $h_2(5)=20$, $h_2(6)=-2$이므로 $-2<k<20$일 때 $h_2(x)=k$인 $x\ (5<x<6)$가 사잇값의 정리에 의해 존재한다. 두 사실로부터 문제와 같이 $\displaystyle\int_a^bf(x)dx-\int_b^cf(x)dx=k$를 만족하는 실수 $a,b,c$ (단, $0<a<b<c<6$)가 존재한다.
      criteria: [2b.M1, 2b.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.11): $h(x)=\int_{3+x}^{4+x}f(t)dt-\int_{4+x}^{5+x}f(t)dt$ 등의 적당한 연속함수를 찾으면 7점, 사잇값의 정리를 언급하여 증명을 완성하면 3점.'
    criteria:
    - id: 2b.M1
      mark_type: M
      points: 7
      evidence: '양 끝값이 $m$, $M$(또는 $k$를 포함하는 두 값)이고 $0<a<b<c<6$ 꼴을 유지하는 연속함수 $h$를 정의하고 연속임을 밝혔다.'
      depends_on: []
      steps: [2bb-1, 2ba, 2bc-1]
    - id: 2b.R1
      mark_type: R
      points: 3
      evidence: '사잇값의 정리를 언급하여 $h(t)=k$인 $t$의 존재와 그에 대응하는 $a,b,c$의 존재를 결론지었다.'
      depends_on: [2b.M1]
      steps: [2bb-2, 2ba, 2bc-1]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5113}
  misconceptions:
  - id: MC-CAL-5113
    outcome_code: '70'
