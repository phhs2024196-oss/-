  materials:
  - '한 변의 길이가 1인 정$n$각형 $P_1P_2\cdots P_n$과 각 꼭짓점의 동전 $R_i$'
  - '함수 $f:\{1,\ldots,n\}\to\{1,\ldots,n\}$에 따라 시계 방향으로 $f(i)$만큼 옮기는 시행'
  - '공평한 함수(시행 후 각 꼭짓점에 동전이 정확히 하나)'
  concepts: [곱의 법칙, 일대일대응, 합의 기호 Σ, 정수의 나머지(배수·약수), 귀류법]
  tools: [f(1)부터 차례로 값 정하기(곱의 법칙), 전체 회전(모든 동전 1칸 추가 이동), (a) 반복으로 치역 평행이동, 동전 이동 연쇄 추적, 이동 거리 합을 n으로 나눈 나머지 비교]
  conditions:
  - '공평 ⇔ $i+f(i)$를 $n$으로 나눈 나머지가 모두 다름'
  - '$f(k)\le n-1$ ⇒ $g=f+1$도 공역 $\{1,\ldots,n\}$ 안'
  - '치역 $\{a,b\}$, $b-a\ge5$, $n=9$ ⇒ (a)로 $b=9$로 옮겨 $a\in\{1,2,3,4\}$만 조사'
  - '$n$ 짝수 ⇒ $\tfrac{n(n+1)}{2}\equiv\tfrac n2\pmod n$'
  stimuli_used: [가, 나, 다]
  subpart_links: '(3-2)(b)는 (3-2)(a)의 평행이동을 반복 사용, (3-3)은 제시문 (나)의 합 공식과 (다)의 귀류법 사용'

