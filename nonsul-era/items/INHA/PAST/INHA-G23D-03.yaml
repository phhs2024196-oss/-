stimuli:
- label: 가
  body: |
    [곱의 법칙] 두 사건 A, B에서 사건 A가 일어나는 경우의 수가 $m$이고, 그 각각의 경우에 대하여 사건 B가 일어나는 경우의 수가 $n$일 때, 사건 A에 잇달아 사건 B가 일어나는 경우의 수는 $m\times n$이다.
- label: 나
  body: |
    일대일대응 $f:\{1,2,\cdots,n\}\to\{1,2,\cdots,n\}$에 대하여 $\displaystyle\sum_{i=1}^nf(i)=\dfrac{n(n+1)}{2}$이다.
- label: 다
  body: |
    어떤 명제가 참임을 증명할 때, 명제의 결론을 부정하여 가정한 사실 또는 이미 알려진 사실에 모순이 생김을 보이면 된다. 이처럼 증명하는 방법을 귀류법이라 한다.

stem: |
  [문제 3] (35점) 다음 제시문을 읽고 물음에 답하시오.
  (※) $n$은 3 이상의 정수이다. 한 변의 길이가 1인 정$n$각형 $P_1P_2\cdots P_n$의 각 꼭짓점 $P_i$ 위에 동전 $R_i$가 놓여있다. 함수 $f:\{1,2,\cdots,n\}\to\{1,2,\cdots,n\}$에 대하여 다음의 시행을 한다.
  [시행 상자] 모든 $1\le i\le n$에 대하여 동전 $R_i$를 정$n$각형 $P_1P_2\cdots P_n$의 둘레를 따라 시계 방향으로 $f(i)$만큼 옮긴다.
  예를 들어, $n=4$일 때, $f(1)=3,f(2)=4,f(3)=1,f(4)=1$이면 동전 $R_1,R_2,R_3,R_4$는 시행 후 각각 $P_4,P_2,P_4,P_1$로 이동한다.
  함수 $f:\{1,2,\cdots,n\}\to\{1,2,\cdots,n\}$이 다음 조건을 만족하면 $f$를 '공평한 함수'라 하자.
  [조건 상자] (조건) 시행 후 정$n$각형 $P_1P_2\cdots P_n$의 각 꼭짓점에는 정확히 하나의 동전이 놓인다.
  예를 들어, $n=4$일 때, $f(1)=2,f(2)=4,f(3)=1,f(4)=1$이면 동전 $R_1,R_2,R_3,R_4$는 시행 후 각각 $P_3,P_2,P_4,P_1$로 이동하므로 $f$는 공평한 함수이다
  [판독확인: 원문 문장 끝 마침표 없음, 원문 표기 그대로]

subparts:
- id: '1'
  stem: |
    (3-1) 공평한 함수의 개수를 $n$의 식으로 나타내시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'n!', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$f(1),f(2),\ldots$를 차례로 정하면 선택지가 $n,n-1,\ldots,1$개.'
    steps:
    - {id: 1a, content: '$n\times(n-1)\times\cdots\times1=n!$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $f(1)$의 값으로 가능한 것은 몇 가지인가?
    - $f(2)$는 $R_2$가 $R_1$과 겹치지 않게 정해야 한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설(문항카드) p.14~15 예시답안 (3-1)
    steps:
    - id: 1b-1
      content: |
        함수 $f$가 공평한 함수가 되도록 $f(1)$부터 $f(n)$까지 값을 차례대로 정하자. $f(1)$의 값으로 가능한 것은 1부터 $n$까지 $n$가지 경우가 있다. $f(1)$의 값을 정한 후에, $f(2)$의 값은, 시행 후 $R_2$가 $R_1$과 겹치지 않아야 하므로 $n-1$가지 경우가 있다. 같은 방법으로 $f(3)$의 값은, 시행 후 $R_3$가 $R_1$ 또는 $R_2$와 겹치지 않아야 하므로 $n-2$가지 경우가 있고, $\cdots$, $f(n)$의 값은 시행 후 $R_n$이 $R_1,R_2,\ldots,R_{n-1}$과 겹치지 않아야 하므로 1가지 경우가 있다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 곱의 법칙에 의하여 공평한 함수 $f$의 개수는 $n!$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.14): 공평한 함수의 개수를 구하는 타당한 방법을 제시하면 3점, 공평한 함수의 개수가 $n!$임을 보이면 7점.'
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: '$f(1),f(2),\ldots$를 차례로 정하며 각 단계의 경우의 수(겹치지 않는 위치 수)를 따지는 등 타당한 세기 방법을 적었다.'
      depends_on: []
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: '곱의 법칙으로 개수가 $n!$임을 보였다.'
      depends_on: [1.M1]
      steps: [1b-2, 1a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CNT-5114}
  misconceptions:
  - id: MC-CNT-5114
    outcome_code: '70'
    wrong_work: '공평한 함수를 일대일대응 $f$와 같은 것으로 보아 "일대일대응의 개수 $n!$"이라고만 쓰고 근거를 대지 않음(또는 $n^n$)'
    detect_cue: '$f$ 자체의 일대일 여부로 공평함을 판정'
    feedback: '공평함은 $f$가 아니라 도착 위치 $i+f(i)$(나머지)가 서로 다른지의 문제입니다. 예시 $f(3)=f(4)=1$도 공평합니다.'
    remedy: [RL-1]

- id: 2a
  stem: |
    (3-2) (a) $f:\{1,2,\cdots,n\}\to\{1,2,\cdots,n\}$이 공평한 함수이고, 모든 $k=1,2,\cdots,n$에 대하여 $f(k)\le n-1$일 때, $g(x)=f(x)+1$로 정의된 함수 $g:\{1,2,\cdots,n\}\to\{1,2,\cdots,n\}$도 공평한 함수임을 보이시오. [5점]
  points: 5
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2a-A
    audience: A
    method_no: 1
    key_idea: $g$에 의한 시행 = $f$에 의한 시행 후 모든 동전을 1칸 더 회전.
    steps:
    - {id: 2aa, content: '회전은 꼭짓점 사이의 일대일대응이므로 공평성 유지', criteria: [2a.R1]}
    hint_ladder:
    - $g$로 옮긴 결과를 $f$로 옮긴 결과와 비교해 보자.
  - id: S2a-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설 p.15 예시답안 (3-2)(a)
    steps:
    - id: 2ab-1
      content: |
        함수 $g$로 시행을 하여 동전을 옮기면, 함수 $f$로 시행을 하여 동전을 옮긴 후 시계 방향으로 1만큼씩 더 옮긴 것과 같다. 동전은 모두 다른 꼭짓점 위로 옮겨지므로 $g$는 공평한 함수이다.
      criteria: [2a.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.14): $g(x)$가 공평한 함수임을 보이면 5점.'
    criteria:
    - id: 2a.R1
      mark_type: R
      points: 5
      evidence: '$g$의 시행이 $f$의 시행 후 모두 1칸 더 옮긴 것과 같아 동전이 서로 다른 꼭짓점에 놓임을 적었다($g$의 공역 조건 $f(k)+1\le n$ 포함).'
      depends_on: []
      steps: [2ab-1, 2aa]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRF-5115}
  misconceptions:
  - id: MC-PRF-5115
    outcome_code: '70'
    wrong_work: '$n=4$ 등 특정 예에서 $g$가 공평함을 확인하고 일반적으로 성립한다고 결론'
    detect_cue: 구체적 $n$, $f$ 하나만 다룸
    feedback: 예시 확인은 증명이 아닙니다. 모든 동전이 똑같이 1칸 더 회전한다는 일반적 관찰을 쓰세요.
    remedy: [RL-2]

- id: 2b
  stem: |
    (3-2) (b) 공평한 함수 $f:\{1,2,\cdots,9\}\to\{1,2,\cdots,9\}$의 치역이 $\{a,b\}\ (1\le a<b\le9)$라 하자. 5 이상의 자연수 중 $b-a$의 값으로 가능한 것을 모두 찾으시오. [10점]
  points: 10
  depends_on: [2a]
  answer: {kind: set, value: '6', equivalents: ['\{6\}', 'b-a=6'], tolerance: null}
  solutions:
  - id: S2b-A
    audience: A
    method_no: 1
    key_idea: '(a)로 $b=9$(움직이지 않음)로 옮기면, $a$만큼 옮기는 동전들은 $a$ 간격의 연쇄를 이루며 $9$의 약수 $a=3$일 때만 닫힌다.'
    steps:
    - {id: 2ba, content: '$a=1,2,4$이면 연쇄가 $P_9$에서 충돌, $a=3$이면 공평 ⇒ $b-a=6$', criteria: [2b.R1, 2b.B1]}
    hint_ladder:
    - (a)를 여러 번 써서 $b=9$로 만들 수 있다.
    - 9만큼 옮기는 동전은 움직이지 않은 것과 같다.
  - id: S2b-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설 p.15 예시답안 (3-2)(b)
    steps:
    - id: 2bb-1
      content: |
        치역이 $\{a,b\}$인 공평한 함수가 존재하면, (3-2) (a)에 의하여 치역이 $\{a-b+9,9\}$인 공평한 함수가 존재한다. 이때, 치역의 두 원소의 차는 변화가 없으므로 $b=9$이고, $9-a\ge5$, 즉 $a=1,2,3,4$인 경우만 고려하면 된다.
        정9각형 위에 있는 9개의 동전 중 일부는 시계 방향으로 9만큼 옮기고, 나머지는 시계 방향으로 $a$만큼 옮긴다. 9만큼 옮기면 원래 있던 꼭짓점으로 돌아오므로, 움직이지 않는 것으로 간주할 수 있다. 시행을 할 때, 옮기지 않는 동전과 $a$만큼 옮기는 동전이 각각 적어도 하나씩 존재하므로, 정9각형 위에는 $R$은 옮기지 않고, $R'$은 시계 방향으로 $a$만큼 옮기는 시계 방향으로 연속하여 위치한 두 동전 $R,R'$이 존재한다.
      criteria: [2b.R1]
    - id: 2bb-2
      content: |
        정$n$각형을 적당히 회전하여 $R=R_9$, $R'=R_1$, 즉 $f(9)=9$, $f(1)=a$라고 가정할 수 있다. 이때 시행 후 동전 $R_9$는 $P_9$ 위에 그대로 남아있고, $R_1$은 $P_{1+a}$로 이동한다. 시행 후 동전의 위치가 겹치지 않으므로 원래 $P_{1+a}$ 위에 있던 동전 $R_{1+a}$는 이동해야 한다. 따라서 $f(1+a)=a$이고, $R_{1+a}$는 $P_{1+2a}$로 이동한다. 그러면 $P_{1+2a}$ 위에 있던 동전 $R_{1+2a}$도 이동해야 하고, $f(1+2a)=a$이다. 이와 같은 방법으로 시행 후 동전의 위치를 보면 다음과 같다.
        $a=1$인 경우, $R_1$은 $P_2$, $R_2$는 $P_3$, $\cdots$, $R_8$은 $P_9$로 이동한다.
        $a=2$인 경우, $R_1$은 $P_3$로, $R_3$는 $P_5$로, $R_5$는 $P_7$로, $R_7$은 $P_9$로 이동한다.
        $a=4$인 경우, $R_1$은 $P_5$로, $R_5$는 $P_9$로 이동한다.
        위의 세 가지 경우에는 $P_9$ 위에 적어도 두 개의 동전이 위치하게 되어 공평한 함수가 될 수 없다. 따라서, $a=1,2,4$인 공평한 함수는 존재하지 않는다.
      criteria: [2b.R1]
    - id: 2bb-3
      content: |
        $a=3$인 경우에는,
        $$f(k)=\begin{cases}3 & k=1,4,7\\ 9 & k=2,3,5,6,8,9\end{cases}$$
        로 정의하면 공평한 함수가 된다. 이때 $b-a$의 값은 6이다.
        따라서 5 이상의 자연수 중 $b-a$의 값으로 가능한 것은 6뿐이다.
      criteria: [2b.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.14): $b-a$가 5,7,8인 경우에 불가능함을 명확하게 보이면 6점, $b-a$가 6인 공평한 함수를 하나 찾으면 4점.'
    criteria:
