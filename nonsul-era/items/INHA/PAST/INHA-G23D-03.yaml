- id: '3'
  stem: |
    (3-3) $n$이 짝수일 때 공평한 일대일대응 $f$가 존재하지 않음을 보이시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$\sum(i+f(i)-k)=\sum f(i)=\tfrac{n(n+1)}2\equiv\tfrac n2\pmod n$인데 각 항은 $n$의 배수.'
    steps:
    - {id: 3a, content: '$n\mid\sum f(i)=\tfrac{n(n+1)}{2}=\tfrac n2\cdot n+\tfrac n2$ 모순', criteria: [3.M1, 3.M2, 3.R1]}
    hint_ladder:
    - 동전 $R_i$가 $P_k$로 가면 $i+f(i)$와 $k$의 관계는?
    - 모든 동전에 대해 더해 보자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2023 자연오전 해설 p.15 예시답안 (3-3)
    steps:
    - id: 3b-1
      content: |
        귀류법으로 공평한 일대일대응이 존재하지 않음을 보이자. 공평한 일대일대응 $f$가 존재한다고 가정하자.
        각각의 $i$에 대하여, 시행 후 동전 $R_i$의 위치를 $P_k$라 하면, $i+f(i)=k$이거나 $i+f(i)=n+k$이다. 즉, $i+f(i)-k$는 $n$의 배수이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        따라서 모든 동전 $R_i$에 대하여 $(i+f(i)-k)$의 값을 모두 더하면 그 값은 $n$의 배수가 된다. 또한 공평한 함수의 정의에 의하여 시행 후에는 각각의 $1\le k\le n$에 대하여 $P_k$에 정확히 하나의 동전이 놓인다. 따라서 모든 동전 $R_i$에 대하여 $(i+f(i)-k)$의 값을 더한 것은 $\displaystyle\sum_{i=1}^n(i+f(i))-\sum_{k=1}^nk$와 같고, $f$는 일대일 대응이므로 제시문 (나)에 의하여
        $$\sum_{i=1}^n(i+f(i))-\sum_{k=1}^nk=\sum_{i=1}^nf(i)=1+2+\cdots+n=\dfrac{n(n+1)}{2}$$
        이다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        그런데 $n$이 짝수이므로 $\dfrac{n(n+1)}{2}=\dfrac n2\cdot n+\dfrac n2$은 $n$으로 나눈 나머지가 $\dfrac n2$으로 $n$의 배수가 될 수 없다. 이는 모순이다. 따라서 공평한 일대일대응은 존재하지 않는다.
      criteria: [3.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.14): 동전 $R_i$가 점 $P_k$로 이동할 때 $i+f(i)-k$가 $n$의 배수임을 보이면 4점, 동전이 이동한 거리의 합이 $\tfrac{n(n+1)}{2}$임을 보이면 3점, $n$이 짝수일 때 $\tfrac{n(n+1)}{2}$이 $n$의 배수가 아님을 이용하여 공평한 함수가 존재하지 않음을 보이면 3점.'
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: '동전 $R_i$가 $P_k$로 이동할 때 $i+f(i)-k$가 $n$의 배수임을 적었다.'
      depends_on: []
      steps: [3b-1, 3a]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: '$k$가 $1,\ldots,n$을 한 번씩 지남과 제시문 (나)를 써서 합(이동 거리의 합)이 $\tfrac{n(n+1)}{2}$임을 보였다.'
      depends_on: []
      steps: [3b-2, 3a]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: '$n$이 짝수이면 $\tfrac{n(n+1)}{2}$이 $n$의 배수가 아님을 보여 모순으로 결론지었다.'
      depends_on: [3.M1, 3.M2]
      steps: [3b-3, 3a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRF-5117}
  misconceptions:
  - id: MC-PRF-5117
    outcome_code: '70'
    wrong_work: '$n=4$(또는 작은 짝수)에서 모든 일대일대응을 조사해 성립하지 않음을 보이고 일반 짝수로 확장'
    detect_cue: 특정 $n$에 대한 사례 조사만 있음
    feedback: '일반 $n$에 대해서는 불변량(이동 거리 합의 $n$에 대한 나머지)을 찾아 귀류법으로 보여야 합니다.'
    remedy: [RL-4]

