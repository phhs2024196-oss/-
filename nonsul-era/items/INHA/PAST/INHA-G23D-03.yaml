intent: 지문에서 주어진 상황을 논리적으로 해석하고 분석하는 능력을 평가한다. 문제에서 주어진 조건으로부터 문제 해결에 필요한 핵심 아이디어를 찾고 활용하는 능력을 평가한다. 또한, 수의 기본적인 성질(정수의 짝수, 홀수, 약수, 배수 관계 등)을 다루는 능력과 귀류법을 이용하여 문제를 해결하는 능력을 평가한다.
key_idea: '동전 $R_i$가 $P_k$로 가면 $i+f(i)-k$는 $n$의 배수. 공평하면 $k$가 $1,\ldots,n$을 한 번씩 지나므로 합 $\sum(i+f(i)-k)=\sum f(i)$가 $n$의 배수여야 하는데, $f$가 일대일대응이면 $\tfrac{n(n+1)}{2}$이고 $n$이 짝수이면 $n$의 배수가 아니다.'
stuck: (3-2)(b)에서 (a)를 반복 적용해 $b=9$로 정규화한 뒤 $a$만큼 옮기는 동전들의 연쇄를 추적하는 단계, (3-3)에서 위치를 $n$으로 나눈 나머지로 보는 발상
idea_tags: [IDEA-SUM-OF-DISPLACEMENTS-MOD-N, IDEA-NORMALIZE-BY-SHIFT]
tags: [경우의 수, 일대일대응, 나머지, 귀류법, 인하대 기출, 의예과]
