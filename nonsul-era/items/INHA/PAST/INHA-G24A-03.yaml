stimuli:
- label: 가
  body: |
    (매개변수로 나타낸 함수의 미분법)
    두 함수 $x=f(t)$, $y=g(t)$가 $t$에 대하여 미분가능하고 $f'(t)\neq0$이면
    $$\dfrac{dy}{dx}=\dfrac{\dfrac{dy}{dt}}{\dfrac{dx}{dt}}=\dfrac{g'(t)}{f'(t)}$$
- label: 나
  body: |
    (정적분의 치환적분법)
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때 도함수 $g'(t)$가 $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
- label: 다
  body: |
    삼각함수의 덧셈정리에 의해 $\cos2\alpha=\cos^2\alpha-\sin^2\alpha=2\cos^2\alpha-1=1-2\sin^2\alpha$이므로
    $$\cos^2\alpha=\dfrac{1+\cos2\alpha}{2},\quad \sin^2\alpha=\dfrac{1-\cos2\alpha}{2}$$

stem: |
  [문제 3] (30점) 다음 제시문을 읽고 물음에 답하시오.
  (※) $0\le p\le2\pi$인 실수 $p$에 대하여 두 곡선 $y=(x-p)^2+q$와 $y=\cos x$가 오직 한 점에서 만날 때의 $q$의 값을 $g(p)$라 하자. 이때 함수 $g(p)$는 $p$에 대하여 미분가능하다.

subparts:
- id: '1'
  stem: |
    (3-1) 두 곡선이 오직 한 점에서 만날 때, 교점의 $x$좌표를 $t$라 하자. 이때 $p$와 $q$를 각각 $t$의 식으로 나타내시오. (8점)
  points: 8
  depends_on: []
  answer: {kind: expression, value: 'p=t+\dfrac{\sin t}{2},\ q=\cos t-\left(\dfrac{\sin t}{2}\right)^2', equivalents: ['q=\cos t-\dfrac{\sin^2t}{4}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 한 점에서만 만나면 그 점에서 접한다(함숫값·기울기 일치).
    steps:
    - {id: 1a, content: '$(t-p)^2+q=\cos t$, $2(t-p)=-\sin t$ ⇒ $p=t+\dfrac{\sin t}{2}$, $q=\cos t-\dfrac{\sin^2t}{4}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 포물선이 $\cos x$ 위에 놓이고 한 점에서만 닿는 모양을 그려 보자.
    - 교점에서 두 곡선의 접선 기울기가 같아야 한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 자연오전 해설(문항카드) p.9 예시답안 (3-1), 채점기준 p.8, 영향평가 보고서 PDF p.70
    steps:
    - id: 1b-1
      content: |
        한 점에서 만나는 경우 교점에서 접선의 기울기가 일치해야 하므로 두 방정식 $(t-p)^2+q=\cos t$, $2(t-p)=-\sin t$를 얻는다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $p$, $q$를 각각 $t$에 대하여 풀면 $p=t+\dfrac{\sin t}{2}$, $q=\cos t-\left(\dfrac{\sin t}{2}\right)^2$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.8): 두 곡선이 한 점에서 만날 조건 6점, $p$, $q$를 $t$로 표현 2점.'
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: '교점에서 함숫값과 미분계수가 같다는 두 식 $(t-p)^2+q=\cos t$, $2(t-p)=-\sin t$를 세웠다.'
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: '$p=t+\dfrac{\sin t}{2}$, $q=\cos t-\dfrac{\sin^2t}{4}$를 적었다.'
      depends_on: [1.M1]
      steps: [1b-2, 1a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5206}
  misconceptions:
  - id: MC-CAL-5206
    outcome_code: '70'
    wrong_work: '$(t-p)^2+q=\cos t$ 하나만 써서 $q=\cos t-(t-p)^2$로 두고 $p$를 $t$로 나타내지 못함'
    detect_cue: 미분계수 조건 $2(t-p)=-\sin t$가 없다
    feedback: 오직 한 점에서 만나려면 그 점에서 접해야 합니다. 기울기 조건도 함께 쓰세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    (3-2) $g'\left(\dfrac{\pi}{4}+\dfrac{\sqrt2}{4}\right)$의 값을 구하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '-\dfrac{\sqrt2}{2}', equivalents: ['-\sin\dfrac{\pi}{4}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\dfrac{dq}{dp}=\dfrac{q''(t)}{p''(t)}=-\sin t$ (일반적으로 성립).'
    steps:
    - {id: 2a, content: '$p(t)$ 증가 ⇒ $t=\dfrac{\pi}{4}$, $g''=\dfrac{-\sin t(1+\frac{\cos t}{2})}{1+\frac{\cos t}{2}}=-\sin\dfrac{\pi}{4}$', criteria: [2.B1, 2.M1, 2.A1]}
    hint_ladder:
    - $p=\dfrac{\pi}{4}+\dfrac{\sqrt2}{4}$이 되는 $t$를 찾고 유일함을 확인하자.
    - 제시문 (가)를 $x=p(t)$, $y=q(t)$에 적용하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2024 자연오전 해설(문항카드) p.9 예시답안 (3-2), 채점기준 p.8, 영향평가 보고서 PDF p.70
    steps:
    - id: 2b-1
      content: |
        $\dfrac{dp}{dt}=1+\dfrac{\cos t}{2}>0$이므로 $p=\dfrac{\pi}{4}+\dfrac{\sqrt2}{4}$인 $t$는 $t=\dfrac{\pi}{4}$가 유일하다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $\dfrac{dq}{dt}=-\sin t-\dfrac{\sin t\cos t}{2}=-\sin t\left(1+\dfrac{\cos t}{2}\right)$, $\dfrac{dp}{dt}=1+\dfrac{\cos t}{2}$.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        제시문 (가)를 이용하면 $g'\left(\dfrac{\pi}{4}+\dfrac{\sqrt2}{4}\right)=\dfrac{q'\left(\frac{\pi}{4}\right)}{p'\left(\frac{\pi}{4}\right)}=-\sin\dfrac{\pi}{4}=-\dfrac{\sqrt2}{2}$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.8): $t=\dfrac{\pi}{4}$ 2점, $\dfrac{dq}{dt}$, $\dfrac{dp}{dt}$ 6점, $g''$ 값 2점.'
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: '$t=\dfrac{\pi}{4}$를 찾았다(유일성 근거 포함 권장).'
      depends_on: []
      steps: [2b-1, 2a]
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: '$\dfrac{dq}{dt}$, $\dfrac{dp}{dt}$를 구했다.'
      depends_on: []
      steps: [2b-2, 2a]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: '$g''\left(\dfrac{\pi}{4}+\dfrac{\sqrt2}{4}\right)=-\dfrac{\sqrt2}{2}$를 적었다.'
      depends_on: [2.M1]
      steps: [2b-3, 2a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5207}
  misconceptions:
  - id: MC-CAL-5207
    outcome_code: '70'
    wrong_work: '$\dfrac{dq}{dt}\Big|_{t=\pi/4}=-\dfrac{\sqrt2}{2}\left(1+\dfrac{\sqrt2}{4}\right)$을 그대로 답함'
    detect_cue: '답에 $1+\dfrac{\sqrt2}{4}$ 인자가 남아 있다'
    feedback: '$g''(p)=\dfrac{dq}{dp}$입니다. $\dfrac{dq}{dt}$를 $\dfrac{dp}{dt}$로 나누세요.'
    remedy: [RL-2]
- id: '3'
  stem: |
    (3-3) 정적분 $\displaystyle\int_0^{2\pi}g(x)dx$의 값을 구하시오. (12점)
  points: 12
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{\pi}{4}', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$x=p(t)$로 치환: $\displaystyle\int_0^{2\pi}q(t)p''(t)\,dt$.'
    steps:
    - {id: 3a, content: '$\displaystyle\int_0^{2\pi}\left(\cos t-\dfrac{\sin^2t}{4}\right)\left(1+\dfrac{\cos t}{2}\right)dt=\dfrac{2\pi}{8}=\dfrac{\pi}{4}$', criteria: [3.M1, 3.A1]}
    hint_ladder:
    - $g$를 $p$의 식으로 직접 쓰기는 어렵다. 적분 변수를 $t$로 바꾸자.
    - $p=0\iff t=0$, $p=2\pi\iff t=2\pi$.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2024 자연오전 해설(문항카드) p.9 예시답안 (3-3), 채점기준 p.8, 영향평가 보고서 PDF p.70
    steps:
    - id: 3b-1
      content: |
        제시문 (나)를 이용하여 $x=p(t)=t+\dfrac{\sin t}{2}$로 치환하면 ($p(0)=0$, $p(2\pi)=2\pi$)
        $$\int_0^{2\pi}g(x)\,dx=\int_0^{2\pi}\left(\cos t-\left(\dfrac{\sin t}{2}\right)^2\right)\left(1+\dfrac{\cos t}{2}\right)dt=\int_0^{2\pi}\left(\cos t+\dfrac{\cos^2t}{2}-\dfrac{\sin^2t}{4}-\dfrac{\sin^2t\cos t}{8}\right)dt$$
      criteria: [3.M1]
    - id: 3b-2
      content: |
        제시문 (다)를 이용하면
        $$=\int_0^{2\pi}\left(\cos t+\dfrac{1+\cos2t}{4}-\dfrac{1-\cos2t}{8}-\dfrac{\sin^2t\cos t}{8}\right)dt=\left[\sin t+\dfrac18t+\dfrac{3}{16}\sin2t-\dfrac{1}{24}\sin^3t\right]_0^{2\pi}=\dfrac{\pi}{4}$$
        (참고: 공식 예시답안은 둘째 줄부터 $\cos t$ 항을 생략함. $\int_0^{2\pi}\cos t\,dt=0$이라 결과는 같으며 여기서는 보완해 적음)
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.8): 치환적분을 올바르게 적용 4점, 적분값 정확히 계산 8점.'
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: '$x=p(t)$ 치환으로 $\displaystyle\int_0^{2\pi}q(t)p''(t)\,dt$(구간 $0\sim2\pi$ 포함)로 바꿨다.'
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3a]
    - id: 3.A1
      mark_type: A
      points: 8
      evidence: '반각 공식 등으로 적분해 $\dfrac{\pi}{4}$를 얻었다.'
      depends_on: [3.M1]
      steps: [3b-2, 3a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5208}
  misconceptions:
  - id: MC-CAL-5208
    outcome_code: '70'
    wrong_work: '$\displaystyle\int_0^{2\pi}q(t)\,dt$로 $p''(t)$를 빠뜨려 $-\dfrac{\pi}{4}$를 답함'
    detect_cue: 답이 $-\dfrac{\pi}{4}$이거나 피적분함수에 $1+\dfrac{\cos t}{2}$가 없다
    feedback: '$dx=p''(t)\,dt$입니다. 치환하면 피적분함수에 $\dfrac{dx}{dt}$가 곱해져야 합니다.'
    remedy: [RL-3]

