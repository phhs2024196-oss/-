  - '$\dfrac{(x+1)\sin^3x}{2-\cos^2x}$의 $[-\pi,\pi]$ 정적분'
  concepts: [정적분의 치환적분법, 삼각함수의 성질, 기함수·우함수의 정적분, 로그함수의 적분]
  tools: ['$u=\pi-x$ 치환', '$y=\cos u$ 치환', '기함수 적분 0, 우함수 적분 2배', '$\dfrac{1}{2-u^2}$의 부분분수 분해']
  conditions:
  - '$\sin(\pi-u)=\sin u$ ⇒ $f(\sin x)$는 $x\mapsto\pi-x$에 대해 불변'
  - '$\dfrac{\sin^3x}{2-\cos^2x}$는 기함수, $\dfrac{x\sin^3x}{2-\cos^2x}$는 우함수 ⇒ $[-\pi,\pi]$ 적분 정리'
  stimuli_used: [가, 나]
  subpart_links: '(1-3)은 (1-2)의 등식 사용, (1-1)의 $u=\pi-x$와 $y=\cos u$ 치환을 (1-2)·(1-3)에서 반복'

