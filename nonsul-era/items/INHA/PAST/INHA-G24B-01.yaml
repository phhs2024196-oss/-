key_idea: '$u=\pi-x$ 치환으로 $\displaystyle\int_0^\pi xf(\sin x)\,dx=\dfrac{\pi}{2}\int_0^\pi f(\sin x)\,dx$를 얻고, (1-3)은 기함수 부분을 지운 뒤 이 등식과 $u=\cos x$ 치환, 부분분수로 계산한다.'
