key_idea: '최근접점 $Q(a,a^2)$에서 $PQ$는 접선과 수직이므로 $P(x,y)$와 $a$ 사이에 $2a^3-(2y-1)a-x=0$이 성립하고, 이를 음함수 미분해 $a''(s)$를 얻는다. (2-3)은 $P$, $Q$, 원의 중심 $S$가 한 직선 위에 있을 때 $PQ+PR=QS-1$.'
stuck: (2-2)에서 $Q$가 $s$에 따라 움직이므로 $a$를 $s$의 함수로 보고 음함수 미분하는 단계, (2-3)에서 세 점이 일직선이어야 함을 귀류로 보이는 단계
