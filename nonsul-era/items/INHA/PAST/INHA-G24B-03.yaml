key_idea: '$f''''>0$이면 할선 기울기가 오른쪽으로 갈수록 커진다((3-1)). $f''(\alpha)>1$이면 어떤 $\beta>\alpha$ 이후로 $f$가 기울기 $k>1$인 직선보다 위에 있게 되어 결국 $f(x)>x$ — 귀류.'
stuck: (3-2)에서 $f'(\alpha)>1$을 가정한 뒤 (3-1)로 $x>\beta$에서 $f(x)>f(\beta)+k(x-\beta)$를 얻고, 이 직선이 $y=x$를 넘어서는 $x$를 잡는 단계
