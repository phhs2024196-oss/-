stimuli:
- label: 가
  body: |
    (사잇값의 정리)
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\neq f(b)$일 때, $f(a)$와 $f(b)$ 사이의 임의의 값 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: 나
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(x)\ge g(x)$일 때, 두 곡선 $y=f(x)$, $y=g(x)$와 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b(f(x)-g(x))\,dx$$

stem: |
  [문제 2] (35점) 다음 제시문을 읽고 물음에 답하시오.
  (※) 실수 $t$에 대하여 함수 $f(x)$를
  $$f(x)=\begin{cases}(x-1)(x-4)-tx & (x\le4)\\ -2(x-4)-tx & (x\ge4)\end{cases}$$
  라 하자. $f(x)=0$이 양의 실근을 갖지 않는 $t$의 값 중 가장 큰 값을 $c$라 하자. 함수 $g(t)$는 정의역이 구간 $(c,\infty)$이고 다음 두 조건을 모두 만족한다.
  (i) $f(\beta)=0$인 어떤 양의 실수 $\beta$에 대하여 $g(t)=\displaystyle\int_0^\beta f(x)\,dx$이다.
  (ii) 함수 $g(t)$가 $t=a$에서 불연속인 $a$의 값은 세 개이다.

subparts:
- id: '1'
  stem: |
    (2-1) 상수 $c$의 값을 구하시오. (7점)
  points: 7
  depends_on: []
  answer: {kind: value, value: '-2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$t=-2$이면 $x\ge4$에서 $f=8$, $x\le4$에서 $x^2-3x+4>0$; $t>-2$이면 $f(0)=4>0$이고 $f\to-\infty$.'
    steps:
    - {id: 1a, content: '$t=-2$: 근 없음, $t>-2$: 사잇값 정리로 양의 근 존재 ⇒ $c=-2$', criteria: [1.B1, 1.R1]}
    hint_ladder:
    - $x\ge4$에서 $f(x)=-(2+t)x+8$의 기울기 부호를 보자.
    - $t>-2$이면 $f(0)>0$이고 $x$가 커지면 $f(x)<0$이 된다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 자연오전(의예과) 해설(문항카드) p.14 예시답안 (2-1), 채점기준 p.14, 영향평가 보고서 PDF p.89
    steps:
    - id: 1b-1
      content: |
        모든 실수 $t$에 대하여 함수 $f(x)$는 연속이다. $t=-2$이면 $f(x)=x^2-3x+4\ (x\le4)$, $8\ (x\ge4)$인데 $x^2-3x+4=\left(x-\dfrac32\right)^2+\dfrac74>0$이므로 $f(x)=0$은 실근을 갖지 않는다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        한편 $t>-2$이면 $f(0)=4>0$이고 $x$가 커짐에 따라 $f(x)$가 무한히 작아지므로, 제시문 (가)에 의해 $f(x)=0$이 되는 양의 실수 $x$가 존재한다. 따라서 $c=-2$이다.
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.14): $t=-2$일 때 실근이 없음을 증명 2점, $t>-2$일 때 양의 실근이 있음을 증명 5점.'
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: '$t=-2$일 때 $f(x)=0$이 실근을 갖지 않음을 보였다.'
      depends_on: []
      steps: [1b-1, 1a]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: '$t>-2$일 때 $f(0)>0$과 $f(x)\to-\infty$(또는 음수인 점), 사잇값 정리로 양의 실근 존재를 보였다.'
      depends_on: []
      steps: [1b-2, 1a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5209}
  misconceptions:
  - id: MC-CAL-5209
    outcome_code: '70'
    wrong_work: '$x\le4$ 부분의 판별식 $(5+t)^2-16<0$만 보고 $c=-1$이라 답함'
    detect_cue: 답이 $-1$이거나 $x\ge4$ 구간을 조사하지 않음
    feedback: '$x\ge4$ 구간의 식 $-(2+t)x+8$도 근을 만들 수 있습니다. 두 구간을 모두 조사하세요.'
    remedy: [RL-1]
- id: '2'
  stem: |
    (2-2) 함수 $g(t)$의 값이 최소가 되는 $t$의 값이 두 개 이상일 때, $g(0)$의 값을 구하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{11}{6}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$t\neq0$이면 $g(t)>-\dfrac83$이므로 $g(0)=-\dfrac83$이면 최소점이 $t=0$ 하나뿐 ⇒ 모순.'
    steps:
    - {id: 2a, content: '$g(0)\in\left\{\int_0^1f=\dfrac{11}{6},\ \int_0^4f=-\dfrac83\right\}$, 다른 $t$에서 $g>-\dfrac83$ ⇒ $g(0)=\dfrac{11}{6}$', criteria: [2.B1, 2.R1]}
    hint_ladder:
    - $t=0$일 때 $f(x)=0$의 양의 근은 1과 4이다.
    - $g(0)$이 $-\dfrac83$이면 최솟값을 갖는 $t$는 몇 개인가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2024 자연오전(의예과) 해설(문항카드) p.14~15 예시답안 (2-2), 채점기준 p.14, 영향평가 보고서 PDF p.89
    steps:
    - id: 2b-1
      content: |
        $h(x)=(x-1)(x-4)\ (x\le4)$, $-2(x-4)\ (x\ge4)$라 하면 $g(t)=\displaystyle\int_0^\beta(h(x)-tx)\,dx$이고 $\beta$는 $h(\beta)=t\beta$인 어떤 양의 실수이다.
        $t>0$이면 $h(x)=tx$의 해는 유일하고 $x\in(0,\beta)$에서 $h(x)>tx$이므로 $g(t)>0$, 또 $\displaystyle\lim_{t\to\infty}g(t)=0$이다.
        $t=0$이면 해는 1, 4이므로 $g(0)$은 $\displaystyle\int_0^1f(x)\,dx=\dfrac{11}{6}$ 또는 $\displaystyle\int_0^4f(x)\,dx=-\dfrac83$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $-1<t<0$이면 세 실근 $\alpha_1<\alpha_2<\alpha_3$을 갖고 $\displaystyle\int_0^{\alpha_1}f\,dx>0$, $\displaystyle\int_0^{\alpha_3}f\,dx>\int_0^{\alpha_2}f\,dx>-\dfrac83$이므로 $g(t)>-\dfrac83$. $t=-1$이면 직선 $y=-x$는 $y=h(x)$에 $(2,-2)$에서 접하고 어떤 경우든 $g(-1)>0$, $-2<t<-1$이면 하나의 실근 $\beta(>4)$를 갖고 $g(t)>0$이다.
        따라서 $0$이 아닌 모든 $t\in(-2,\infty)$에 대하여 $g(t)>-\dfrac83$이다. 만약 $g(0)=-\dfrac83$이면 $g$의 최솟값은 $-\dfrac83$이고 $t=0$에서만 최솟값을 가지므로 조건에 모순이다. 따라서 $g(0)=\displaystyle\int_0^1f(x)\,dx=\dfrac{11}{6}$이다.
      criteria: [2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.14): $g(0)$이 $\int_0^1f=\dfrac{11}{6}$ 또는 $\int_0^4f=-\dfrac83$임을 밝히면 3점, $g(0)=\dfrac{11}{6}$인 이유를 정확하게 설명하면 7점.'
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: '$g(0)$의 후보 $\dfrac{11}{6}$, $-\dfrac83$을 정적분으로 구했다.'
      depends_on: []
      steps: [2b-1, 2a]
    - id: 2.R1
      mark_type: R
      points: 7
      evidence: '$t\neq0$에서 $g(t)>-\dfrac83$임을 근거로 $g(0)=-\dfrac83$이면 최소점이 하나뿐이라 모순임을 설명하고 $g(0)=\dfrac{11}{6}$을 결론지었다.'
      depends_on: [2.B1]
      steps: [2b-2, 2a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5210}
  misconceptions:
  - id: MC-CAL-5210
    outcome_code: '70'
    wrong_work: '최솟값이 되도록 더 작은 $-\dfrac83$을 $g(0)$으로 고름'
    detect_cue: 답이 $-\dfrac83$
    feedback: '최소가 되는 $t$가 두 개 이상이어야 합니다. $-\dfrac83$은 $t=0$에서만 나오는 값임을 확인하세요.'
    remedy: [RL-2]
- id: 3a
  stem: |
    (2-3) 함수 $g(t)$의 값이 최소가 되는 $t$의 값이 두 개 이상이고 $t=a$에서 불연속인 $a$의 값을 $p$, $q$, $r$ $(p<q<r)$이라 하자.
    (a) 가능한 $p$의 값 중 가장 작은 값을 구하시오. (8점)
  points: 8
  depends_on: ['2']
  answer: {kind: value, value: '-1', equivalents: [], tolerance: null}
  solutions:
  - id: S3a-A
    audience: A
    method_no: 1
    key_idea: '$-2<t<-1$에서는 근이 하나라 $g$가 연속, 근의 개수가 바뀌는 첫 지점은 직선이 $y=(x-1)(x-4)$에 접하는 $t=-1$.'
    steps:
    - {id: 3aa, content: '접할 조건 $(5+t)^2=16$, $t=-1$; $(-2,-1)$에서 연속 ⇒ $p_{\min}=-1$', criteria: [3a.M1, 3a.A1]}
    hint_ladder:
    - $g$가 불연속이 될 수 있으려면 근이 여러 개여야 한다.
    - 직선 $y=tx$가 곡선 $y=(x-1)(x-4)$에 접할 때를 찾자.
  - id: S3a-B
    audience: B
    method_no: 1
    source_flow: 2024 자연오전(의예과) 해설(문항카드) p.15 예시답안 (2-3)(a), 채점기준 p.14, 영향평가 보고서 PDF p.89
    steps:
    - id: 3ab-1
      content: |
        서로 다른 $t_1$, $t_2$ $(t_1<t_2)$에서 $g(t)$가 최솟값 $m$을 갖는다고 하자. $\displaystyle\lim_{t\to\infty}g(t)=0$이고 $g(0)=\dfrac{11}{6}$이므로 $g(t)$는 $\dfrac{11}{6}$ 이하의 모든 양수를 함숫값으로 갖고, 따라서 $m\le0$이다. 또 $-2<t\le-1$과 $t\ge0$에서 $g(t)$는 항상 양수이므로 $-1<t_1<t_2<0$이다.
      criteria: [3a.M1]
    - id: 3ab-2
      content: |
        불연속점을 제외한 각 구간에서 $g(t)$는 감소하므로 $g(t)$는 $t=t_1$, $t_2$에서 불연속이다. $g(t)$는 $t\in(-2,-1)$에서 연속이므로 불연속점 중 가장 작은 것은 $p=-1$일 때 가능하다(직선 $y=tx$가 $y=(x-1)(x-4)$에 접하는 $t=-1$).
      criteria: [3a.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.14): 직선 $y=tx$가 $y=(x-1)(x-4)$에 접할 때 $p$가 최소가 될 수 있음을 밝히면 4점, $p=-1$임을 설명하면 4점.'
    criteria:
    - id: 3a.M1
      mark_type: M
      points: 4
      evidence: '직선 $y=tx$가 $y=(x-1)(x-4)$에 접할 때 $p$가 최소가 될 수 있음(그보다 작은 $t$에서는 근이 하나라 연속)을 밝혔다.'
      depends_on: []
      implied_ok: false
      steps: [3ab-1, 3aa]
    - id: 3a.A1
      mark_type: A
      points: 4
      evidence: '$p=-1$임을 설명했다.'
      depends_on: [3a.M1]
      steps: [3ab-2, 3aa]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5211}
  misconceptions:
  - id: MC-CAL-5211
    outcome_code: '70'
    wrong_work: '판별식의 다른 근 $t=-9$나 정의역 끝 $c=-2$를 $p$로 답함'
    detect_cue: 답이 $-9$ 또는 $-2$
    feedback: '$t=-9$에서는 접점이 음수 쪽이고, $-2<t<-1$에서는 근이 하나라 $g$가 연속입니다. 양의 근의 개수가 바뀌는 곳을 찾으세요.'
    remedy: [RL-3]
- id: 3b
  stem: |
    (b) (a)에서 구한 $p$의 값에 대하여 $q-p$의 값이 최소가 될 때 $r$의 값을 구하시오. (10점)
  points: 10
  depends_on: [3a]
  answer: {kind: value, value: '-\dfrac{2}{7}', equivalents: [], tolerance: null}
  solutions:
  - id: S3b-A
    audience: A
    method_no: 1
    key_idea: '$q=t_1$이 최소가 되려면 최솟값 $m$이 최대, 즉 $m=0$. $r=t_2$는 $\beta_2>4$에서 $\int_0^{\beta_2}f=0$.'
    steps:
    - {id: 3ba, content: '$t_2=-\dfrac{2(\beta_2-4)}{\beta_2}$, $4\beta_2-\dfrac{56}{3}=0\Rightarrow\beta_2=\dfrac{14}{3}$, $r=-\dfrac27$', criteria: [3b.M1, 3b.M2, 3b.R1, 3b.A1]}
    hint_ladder:
    - $p=-1$, $q=t_1$, $r=t_2$이다. $q-p$를 줄이려면 $t_1$을 줄여야 한다.
    - 최솟값 $m$이 클수록 $t_1$은 작아진다. $m$의 최댓값은?
    - $g(t_2)=0$인 $t_2$를 $\beta_2>4$로 계산하자.
  - id: S3b-B
    audience: B
    method_no: 1
    source_flow: 2024 자연오전(의예과) 해설(문항카드) p.15 예시답안 (2-3)(b), 채점기준 p.14, 영향평가 보고서 PDF p.89
    steps:
    - id: 3bb-1
      content: |
        (a)의 관찰에서 최솟값 $m\le0$이고 최소가 되는 $t$의 값 $t_1<t_2$는 $(-1,0)$에 있어야 한다.
      criteria: [3b.M1]
    - id: 3bb-2
      content: |
        $p=-1$, $q=t_1$, $r=t_2$이다. $q-p=t_1+1$이 최소가 되려면 $t_1$이 최소여야 한다. $g(t_1)=m$인데 $m$이 클수록 $t_1$의 값은 작아진다.
      criteria: [3b.M2]
    - id: 3bb-3
      content: |
        $m\le0$이어야 하므로 $g(t_1)=0$일 때 $q-p$가 최소가 된다. 이때 $r$의 값은 $g(t_2)=0$이 되는 $t_2$의 값이다.
      criteria: [3b.R1]
    - id: 3bb-4
      content: |
        $g(t_2)=\displaystyle\int_0^{\beta_2}f(x)\,dx$라 하면 $t_2=-\dfrac{2(\beta_2-4)}{\beta_2}$이고
        $$0=\int_0^{\beta_2}f(x)\,dx=\int_0^4(x-1)(x-4)\,dx-\int_4^{\beta_2}2(x-4)\,dx-t_2\int_0^{\beta_2}x\,dx=-\dfrac83-(\beta_2^2-8\beta_2+16)+\beta_2(\beta_2-4)=4\beta_2-\dfrac{56}{3}$$
        이다. 따라서 $\beta_2=\dfrac{14}{3}$이고 $r=t_2=-\dfrac27$이다.
      criteria: [3b.A1]
