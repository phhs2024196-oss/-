key_idea: '$f(x)=h(x)-tx$로 보면 $f(\beta)=0$의 양의 근은 꺾인 곡선 $y=h(x)$와 직선 $y=tx$의 교점. 근이 하나뿐인 $t$에서는 $g$가 정해지고($g>0$, $t\to\infty$에서 $0$), 근이 셋인 $-1<t<0$에서만 값을 골라 불연속·최솟값을 만들 수 있다.'
stuck: 근이 여러 개인 구간에서 $g(t)$를 어떤 근으로 고를지(최솟값 두 번 이상, 불연속점 정확히 세 개) 동시에 만족시키는 배치를 구성하는 단계
