stimuli:
- label: 가
  body: |
    (수학적 귀납법)
    자연수 $n$에 대한 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.
    (1) $n=1$일 때, 명제 $p(n)$이 성립한다.
    (2) $n=k\ (k\ge1)$일 때 명제 $p(n)$이 성립한다고 가정하면, $n=k+1$일 때에도 명제 $p(n)$이 성립한다.
- label: 나
  body: |
    (귀류법)
    어떤 명제가 참임을 증명할 때, 명제의 결론을 부정하여 가정한 사실 또는 이미 알려진 사실에 모순이 생김을 보이면 된다. 이처럼 증명하는 방법을 귀류법이라 한다.

stem: |
  [문제 3] (35점) 다음 제시문을 읽고 물음에 답하시오.
  (※) $a_1,a_2,\cdots,a_{99}$는 자연수 $1,2,\cdots,99$의 재배열이다. 즉, $\{a_1,a_2,\cdots,a_{99}\}=\{1,2,\cdots,99\}$이다.
  $$b_1=a_2-a_1,\ b_2=a_3-a_2,\ \cdots,\ b_{98}=a_{99}-a_{98},\ b_{99}=a_1-a_{99}$$
  라 하고 $b_1b_2,\ b_2b_3,\ b_3b_4,\ \cdots,\ b_{98}b_{99},\ b_{99}b_1$ 중에 양수인 것의 개수를 $N$이라 하자.

subparts:
- id: '1'
  stem: |
    (3-1) 2 이상의 자연수 $n$에 대하여 실수 $x_1,x_2,\cdots,x_n$이 다음 조건을 만족한다.
    [조건 상자] 모든 $i=1,2,\cdots,n-1$에 대하여 $x_ix_{i+1}<0$ 이다.
    수학적 귀납법을 이용하여 $n$이 홀수이면 $x_n$과 $x_1$은 부호가 서로 같고, $n$이 짝수이면 $x_n$과 $x_1$은 부호가 서로 다름을 보이시오. (5점)
  points: 5
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$x_{k-1}x_k<0$이므로 $x_k$의 부호는 $x_{k-1}$과 반대; $n=k-1$의 결과를 홀짝으로 넘긴다.'
    steps:
    - {id: 1a, content: '기초 $n=2,3$; $n=k-1$ 가정 → $k$ 짝수/홀수 경우 분리', criteria: [1.R1]}
    hint_ladder:
    - $n=2$, $n=3$에서 먼저 확인하자.
    - $x_{k-1}$과 $x_k$의 부호는 항상 반대이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2024 자연오전(의예과) 해설(문항카드) p.18 예시답안 (3-1), 채점기준 p.17, 영향평가 보고서 PDF p.93
    steps:
    - id: 1b-1
      content: |
        $n=2$이면 $x_n=x_2$이고 $x_1x_2<0$이므로 $x_1$과 $x_n$의 부호는 서로 다르다. $n=3$이면 $x_n=x_3$이다. $x_1x_2<0$이므로 $x_1$과 $x_2$는 부호가 다르고, $x_2x_3<0$이므로 $x_2$와 $x_3$은 부호가 다르다. 따라서 $x_1$과 $x_3$은 부호가 서로 같다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        $k\ge4$에 대하여 $n=k-1$일 때 성립한다고 가정하고 $n=k$일 때 성립함을 보이자.
        $k$가 짝수이면 $k-1$은 홀수이다. 따라서 $x_{k-1}$은 $x_1$과 부호가 같다. 또한 $x_{k-1}x_k<0$이므로 $x_{k-1}$과 $x_k$는 부호가 다르다. 즉 $x_1$과 $x_k$는 부호가 서로 다르다.
        $k$가 홀수이면 $k-1$은 짝수이다. 따라서 $x_1$과 $x_{k-1}$은 부호가 다르고, $x_{k-1}x_k<0$이므로 $x_{k-1}$과 $x_k$는 부호가 다르므로 $x_1$과 $x_k$는 부호가 서로 같다.
        따라서 수학적 귀납법에 의하여 2 이상인 모든 자연수 $n$에 대하여 명제가 성립한다.
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.17): 수학적 귀납법을 이용하여 명제를 증명하면 5점(단일 기준).'
    criteria:
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: '기초 단계와, $n=k-1$ 가정에서 $k$의 홀짝 두 경우로 $n=k$를 보이는 귀납 단계를 모두 적었다.'
      depends_on: []
      steps: [1b-1, 1b-2, 1a]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRF-5212}
  misconceptions:
  - id: MC-PRF-5212
    outcome_code: '70'
    wrong_work: '$x_1>0$이면 $x_2<0,\ x_3>0,\cdots$ 처럼 나열만 하고 "따라서 성립"으로 끝냄'
    detect_cue: '$n=k$ 가정을 쓰는 문장이나 홀짝 경우 분리가 없다'
    feedback: 수학적 귀납법을 쓰라는 조건입니다. 가정한 $n=k-1$의 결론과 $x_{k-1}x_k<0$을 연결해 홀짝 두 경우를 모두 보이세요.
    remedy: [RL-1]
- id: 2a
  stem: |
    (3-2) (a) 모든 재배열 $a_1,a_2,\cdots,a_{99}$에 대하여 $N\ge1$임을 보이시오. (5점)
  points: 5
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2a-A
    audience: A
    method_no: 1
    key_idea: '$N=0$이면 $b_1,\cdots,b_{99}$가 교대 ⇒ (3-1)에서 $b_1$, $b_{99}$ 같은 부호 ⇒ $b_{99}b_1>0$ 모순.'
    steps:
    - {id: 2aa, content: '$N=0$ 가정 ⇒ $b_ib_{i+1}<0\ (i\le98)$ ⇒ (3-1), $n=99$ 홀수 ⇒ $b_{99}b_1>0$ ⇒ $N\ge1$ 모순', criteria: [2a.R1]}
    hint_ladder:
    - 결론을 부정해 $N=0$이라 가정하자.
    - (3-1)을 $x_i=b_i$, $n=99$에 적용하자.
  - id: S2a-B
    audience: B
    method_no: 1
    source_flow: 2024 자연오전(의예과) 해설(문항카드) p.18 예시답안 (3-2)(a), 채점기준 p.17, 영향평가 보고서 PDF p.93~94
    steps:
    - id: 2ab-1
      content: |
        귀류법으로 증명하자. $N=0$인 재배열 $a_1,a_2,\cdots,a_{99}$가 존재한다고 가정하자. 그러면 각각의 $i=1,2,\cdots,98$에 대하여 $b_ib_{i+1}<0$이다. (3-1)에 의하여 $b_1$과 $b_{99}$의 부호는 같고 $b_{99}b_1>0$이므로 $N=0$이라는 것에 모순이다. 따라서 $N\ge1$이다. (각 $b_i\neq0$이므로 곱은 0이 아니다.)
      criteria: [2a.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.17): $N=0$인 재배열이 존재하지 않음을 증명하면 5점.'
    criteria:
    - id: 2a.R1
      mark_type: R
      points: 5
      evidence: '$N=0$을 가정하고 (3-1)로 $b_{99}b_1>0$을 이끌어 모순을 보였다.'
      depends_on: []
      steps: [2ab-1, 2aa]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRF-5213}
  misconceptions:
  - id: MC-PRF-5213
    outcome_code: '70'
    wrong_work: '$b_1+b_2+\cdots+b_{99}=0$이므로 양수와 음수가 있다는 것만으로 $N\ge1$이라 결론'
    detect_cue: (3-1)을 쓰지 않고 이웃한 곱의 부호를 다루지 않음
    feedback: 양수·음수가 섞여 있어도 교대로 나오면 이웃 곱은 모두 음수일 수 있습니다. 순환의 마지막 곱 $b_{99}b_1$을 (3-1)로 확인하세요.
    remedy: [RL-2]
- id: 2b
  stem: |
    (b) $N=1$인 재배열 $a_1,a_2,\cdots,a_{99}$가 존재함을 보이시오. (5점)
  points: 5
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2b-A
    audience: A
    method_no: 1
    key_idea: '$a_1=50$, 짝수 번째에 51 이상, 홀수 번째에 50 이하를 놓으면 $b$가 교대하고 $b_{99}b_1$만 양수.'
    steps:
    - {id: 2ba, content: '$a_1=50$, $a_{2k}=50+k$, $a_{2k+1}=k\ (k=1,\cdots,49)$', criteria: [2b.B1, 2b.R1]}
    hint_ladder:
    - 큰 수와 작은 수를 번갈아 놓아 보자.
    - $b_{99}$와 $b_1$만 같은 부호가 되게 맞추자.
  - id: S2b-B
    audience: B
    method_no: 1
    source_flow: 2024 자연오전(의예과) 해설(문항카드) p.18 예시답안 (3-2)(b), 채점기준 p.17, 영향평가 보고서 PDF p.94
    steps:
    - id: 2bb-1
      content: |
        $n$이 짝수일 때 $a_n$은 51 이상이고 $n$이 홀수일 때 $a_n$은 50 이하인 아래 재배열에 대하여 $N=1$임을 보이자.
        $$a_1=50,\quad k=1,2,\cdots,49\text{에 대하여 }a_{2k}=50+k,\ a_{2k+1}=k\qquad(*)$$
      criteria: [2b.B1]
    - id: 2bb-2
      content: |
        $k=1,\cdots,49$에 대하여 $b_{2k}=a_{2k+1}-a_{2k}\le50-51<0$, $b_{2k-1}=a_{2k}-a_{2k-1}\ge51-50>0$이고 $b_{99}=a_1-a_{99}=50-49>0$이다. 즉 $b_1,b_2,\cdots,b_{99}$에는 양수와 음수가 교대로 나온다. 따라서 $b_1b_2,b_2b_3,\cdots,b_{98}b_{99}$는 모두 음수이고 $b_{99}b_1$은 양수이다. 그러므로 이 재배열에서 $N=1$이다.
      criteria: [2b.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 0, isw: true}
    note: '공식 채점기준(해설 p.17): $N=1$인 재배열을 찾으면 3점, 그 재배열에 대하여 $N=1$인 이유를 설명하면 2점.'
    criteria:
    - id: 2b.B1
      mark_type: B
      points: 3
      evidence: '$N=1$인 재배열을 구체적으로 제시했다.'
      depends_on: []
      steps: [2bb-1, 2ba]
    - id: 2b.R1
      mark_type: R
      points: 2
      evidence: '제시한 재배열에서 $b_i$의 부호를 확인해 $N=1$인 이유를 설명했다.'
      depends_on: [2b.B1]
      steps: [2bb-2, 2ba]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRF-5214}
  misconceptions:
