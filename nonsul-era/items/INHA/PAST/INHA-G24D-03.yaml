    outcome_code: '70'
    wrong_work: '$1,2,\cdots,99$ 순서 그대로를 예로 들거나, 예시만 쓰고 부호 확인 없음'
    detect_cue: '항등 배열(그때 $N=97$)이거나 $b_i$의 부호 서술이 없다'
    feedback: 존재 증명은 예시와 함께 그 예시가 조건을 만족하는 이유(각 $b_i$의 부호)를 적어야 합니다.
    remedy: [RL-3]
- id: 3a
  stem: |
    (3-3) $N=1$일 때, $\displaystyle\sum_{i=1}^{99}\lvert b_i\rvert$이 가질 수 있는 값 중 가장 큰 값을 $M$이라 하자.
    (a) $M$의 값을 구하시오. (10점)
  points: 10
  depends_on: ['1', 2b]
  answer: {kind: value, value: '4900', equivalents: [], tolerance: null}
  solutions:
  - id: S3a-A
    audience: A
    method_no: 1
    key_idea: '$\sum\lvert b_i\rvert=2(a_2+\cdots+a_{98})-2(a_3+\cdots+a_{99})\le2(3675-1225)$.'
    steps:
    - {id: 3aa, content: '$\le2\{(51+\cdots+99)-(1+\cdots+49)\}=4900$, 등호는 $(*)$에서', criteria: [3a.M1, 3a.M2, 3a.A1, 3a.B1]}
    hint_ladder:
    - $N=1$이면 어느 한 곳만 빼고 $b_i$의 부호가 교대한다. 그곳을 $b_{99}b_1$로 두자.
    - 부호에 맞춰 절댓값을 벗기면 $a_1$이 사라진다.
  - id: S3a-B
    audience: B
    method_no: 1
    source_flow: 2024 자연오전(의예과) 해설(문항카드) p.18 예시답안 (3-3)(a), 채점기준 p.17, 영향평가 보고서 PDF p.94
    steps:
    - id: 3ab-1
      content: |
        $N=1$이므로 어떤 $j=1,2,\cdots,99$에 대하여 $b_jb_{j+1}>0$이고(단, $b_{100}=b_1$) $j$가 아닌 $i$에 대하여 $b_ib_{i+1}<0$이다. 일반성을 잃지 않고 $j=99$, 즉 $b_{99}b_1>0$이고 $b_1b_2,\cdots,b_{98}b_{99}<0$이라 하자. 또한 일반성을 잃지 않고 $b_{99}>0$이라 하자. 이때 $b_1>0$이다. (3-1)에 의하여 $b_1,b_3,\cdots,b_{99}$는 모두 양수, $b_2,b_4,\cdots,b_{98}$은 모두 음수이다.
      criteria: [3a.M1]
    - id: 3ab-2
      content: |
        따라서 $\lvert b_{2k-1}\rvert=a_{2k}-a_{2k-1}$, $\lvert b_{2k}\rvert=a_{2k}-a_{2k+1}$이고
        $$\sum_{i=1}^{99}\lvert b_i\rvert=\sum_{k=1}^{50}\lvert b_{2k-1}\rvert+\sum_{k=1}^{49}\lvert b_{2k}\rvert=2(a_2+a_4+\cdots+a_{98})-2(a_3+a_5+\cdots+a_{99})$$
        이다.
      criteria: [3a.M2]
    - id: 3ab-3
      content: |
        $a_2+a_4+\cdots+a_{98}\le51+52+\cdots+99=49\cdot75=3675$이고 $a_3+a_5+\cdots+a_{99}\ge1+2+\cdots+49=49\cdot25=1225$이므로 $\displaystyle\sum_{i=1}^{99}\lvert b_i\rvert\le2(3675-1225)=4900$이다.
      criteria: [3a.A1]
    - id: 3ab-4
      content: |
        또한 (3-2)(b)에서 구한 재배열 $(*)$에서 $\displaystyle\sum_{i=1}^{99}\lvert b_i\rvert=4900$이므로 $M=4900$이다.
      criteria: [3a.B1]
