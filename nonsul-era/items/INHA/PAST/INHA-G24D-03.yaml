      content: |
        (a)에서 $j=99$이고 $b_{99}>0$인 경우에 $\displaystyle\sum_{i=1}^{99}\lvert b_i\rvert=4900$이기 위해서는 $a_2,a_4,\cdots,a_{98}\ge51$이고 $a_3,a_5,\cdots,a_{99}\le49$이어야 한다(따라서 $a_1=50$). [판독확인: 공식 예시답안은 '$a_3,a_5,\cdots,a_{99}\ge49$'로 표기 — 오기로 보아 $\le49$로 적음]
