key_idea: '부호가 교대로 바뀌는 수열의 홀짝 성질((3-1))로 $N=0$이 불가능함을 보이고, $N=1$이면 $b_i$의 부호가 한 곳을 빼고 교대하므로 $\sum\lvert b_i\rvert=2(a_2+a_4+\cdots+a_{98})-2(a_3+a_5+\cdots+a_{99})$로 정리된다.'
stuck: (3-3)에서 $N=1$일 때 일반성을 잃지 않고 $b_{99}b_1>0$, $b_{99}>0$으로 두고 $\sum\lvert b_i\rvert$를 짝수·홀수 번째 항의 합으로 바꾸는 단계
