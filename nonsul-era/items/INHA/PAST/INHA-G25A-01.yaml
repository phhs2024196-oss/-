intent: |
  정적분의 성질에 대한 이해와 정적분의 계산 능력을 평가한다. 특히 주어진 적분 형태에 대해서 부분적분법을 적절히 적용할 수 있는지를 평가한다. (1-1) 삼각함수의 성질을 활용하여 식을 적절히 변형하여 활용할 수 있는지, (1-2) 정적분의 부분적분법과 삼각함수의 성질을 활용하여 주어진 정적분 값을 계산할 수 있는지, (1-3) 정적분의 부분적분법과 삼각함수의 성질을 활용하여 주어진 부등식을 증명할 수 있는지 평가한다.
key_idea: '$f''(x)=\dfrac18g(x)$이므로 $\displaystyle\int_0^\pi e^xf(x)g(x)\,dx=8\int_0^\pi e^xf(x)f''(x)\,dx$를 부분적분하면 $f(0)=f(\pi)=0$에 의해 $-4\displaystyle\int_0^\pi e^x\{f(x)\}^2dx$가 된다.'
stuck: (1-3)에서 $g$가 $f$의 도함수의 8배임을 알아보고, 부분적분 결과에 같은 적분이 다시 나타나는 것을 이항해 정리하는 단계
