stimuli:
- label: 가
  body: |
    $a$를 포함하는 어떤 열린구간에서 미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고 $x$의 값이 $a$보다 작은 값에서 $a$보다 큰 값으로 바뀔 때
    (1) $f'(x)$의 부호가 양$(+)$에서 음$(-)$으로 바뀌면 함수 $f(x)$는 $x=a$에서 극댓값을 가진다.
    (2) $f'(x)$의 부호가 음$(-)$에서 양$(+)$으로 바뀌면 함수 $f(x)$는 $x=a$에서 극솟값을 가진다.
- label: 나
  body: |
    임의의 양의 실수 $\alpha\,(\alpha\ne2)$에 대하여, $1+\dfrac{\alpha}{2}>\sqrt{2\alpha}$이다.

stem: |
  다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: 1a
  stem: |
    (2-1) $f(t)=\cos(t-1)\sin(t-2)\sin(t^2)$이라 하자.
    (a) 열린구간 $(0,3)$에서 $f(t)=0$이 되는 $t$의 값을 모두 구하시오. (5점)
  points: 5
  depends_on: []
  answer: {kind: set, value: '\left\{\sqrt{\pi},\ 2,\ \sqrt{2\pi},\ 1+\dfrac{\pi}{2}\right\}', equivalents: [], tolerance: null}
  solutions:
  - id: S1a-A
    audience: A
    method_no: 1
    key_idea: 인수마다 영점을 구해 범위 $0<t<3$에 드는 것만 남긴다.
    steps:
    - {id: 1aa, content: '$t-1=\dfrac{\pi}{2}$, $t-2=0$, $t^2=\pi,\,2\pi$', criteria: [1a.B1]}
    hint_ladder:
    - 곱이 0이면 인수 중 하나가 0이다.
    - $t^2$의 범위는 $(0,9)$이다.
  - id: S1a-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오전 해설(문항카드) p.7 예시답안 (2-1)(a), 채점기준 p.7
    steps:
    - id: 1ab-1
      content: |
        $\cos(t-1)\sin(t-2)\sin(t^2)=0$이므로 $\cos(t-1)=0$, $\sin(t-2)=0$ 또는 $\sin(t^2)=0$이다. 따라서 $t-1=\pm\dfrac{\pi}{2}+2n\pi$, $t-2=n\pi$ 또는 $t^2=n\pi$ ($n$은 정수) 꼴이어야 한다.
      criteria: [1a.B1]
    - id: 1ab-2
      content: |
        $0<t<3$이므로 $-1<t-1<2$, $-2<t-2<1$, $0<t^2<9$이다. 따라서 범위 내에서 함숫값이 0이 되는 $t$의 값들은 $1+\dfrac{\pi}{2}$, $2$, $\sqrt\pi$, $\sqrt{2\pi}$이다.
      criteria: [1a.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1a.B1
      mark_type: B
      points: 5
      evidence: 해 $\sqrt\pi$, $2$, $\sqrt{2\pi}$, $1+\dfrac{\pi}{2}$를 모두 찾았다.
      depends_on: []
      steps: [1ab-1, 1ab-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-5302}
  misconceptions:
  - id: MC-ALG-5302
    outcome_code: '70'
    wrong_work: '$\sin(t^2)=0$에서 $t^2=\pi$만 찾고 $t^2=2\pi$($\sqrt{2\pi}<3$)를 빠뜨림'
    detect_cue: 해가 3개이고 $\sqrt{2\pi}$가 없다
    feedback: 합성된 변수 $t^2$의 범위 $(0,9)$를 먼저 구하고 그 안의 $n\pi$를 모두 세어 보세요.
    remedy: [RL-1]
- id: 1b
  stem: |
    (b) 열린구간 $(0,3)$에서 정의된 함수 $F(x)=\displaystyle\int_0^xf(t)dt$에 대하여, $F(x)$가 극댓값을 가지는 $x$의 값과 극솟값을 가지는 $x$의 값을 각각 모두 구하시오. (10점)
  points: 10
  depends_on: [1a]
  answer: {kind: set, value: '극대 $x=2,\ 1+\dfrac{\pi}{2}$, 극소 $x=\sqrt{\pi},\ \sqrt{2\pi}$', equivalents: [], tolerance: null}
  solutions:
  - id: S1b-A
    audience: A
    method_no: 1
    key_idea: $F'=f$이고 네 영점 모두 단순근이라 부호가 $-,+,-,+,-$로 번갈아 바뀐다.
    steps:
    - {id: 1ba, content: '$\sqrt\pi<2<\sqrt{2\pi}<1+\dfrac{\pi}{2}$, $f$의 부호 $-\,|\,+\,|\,-\,|\,+\,|\,-$', criteria: [1b.M1, 1b.A1]}
    hint_ladder:
    - $F'(x)=f(x)$이다.
    - $1+\dfrac{\pi}{2}$와 $\sqrt{2\pi}$ 중 어느 것이 더 클까? 제시문 (나)를 보자.
  - id: S1b-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오전 해설(문항카드) p.7~8 예시답안 (2-1)(b), 채점기준 p.7
    steps:
    - id: 1bb-1
      content: |
        $F(x)=\displaystyle\int_0^x\cos(t-1)\sin(t-2)\sin(t^2)dt$를 미분하면 $F'(x)=f(x)=\cos(x-1)\sin(x-2)\sin(x^2)$이고, 범위 내에서 이 값이 0이 되는 $x$의 값들을 순서대로 나열하면 $\sqrt\pi$, $2$, $\sqrt{2\pi}$, $1+\dfrac{\pi}{2}$이다. (제시문 (나)에 의하여 $1+\dfrac{\pi}{2}>\sqrt{2\pi}$이다.)
      criteria: [1b.M1]
    - id: 1bb-2
      content: |
        각 값의 좌우에서 $\cos(x-1)$, $\sin(x-2)$, $\sin(x^2)$의 부호를 관찰하자. $\dfrac{\pi}{2}$의 좌우에서 코사인함수의 부호가 양에서 음으로 바뀌고 $0$의 좌우에서 사인함수의 부호가 음에서 양으로, $\pi$의 좌우에서 사인함수의 부호가 양에서 음으로 바뀐다. 그러므로
        [표: $x$ … $\sqrt\pi$ … $2$ … $\sqrt{2\pi}$ … $1+\frac{\pi}{2}$ … 에서 $\cos(x-1)$: $+,+,+,+,+,+,+,0,-$ / $\sin(x-2)$: $-,-,-,0,+,+,+,+,+$ / $\sin(x^2)$: $+,0,-,-,-,0,+,+,+$ / $f(x)$: $-,0,+,0,-,0,+,0,-$]
      criteria: [1b.M1]
    - id: 1bb-3
      content: |
        그러므로 제시문 (가)에 의해 함수 $F(x)$는 $\sqrt\pi$, $\sqrt{2\pi}$에서 극솟값을, $2$, $1+\dfrac{\pi}{2}$에서 극댓값을 갖는다.
      criteria: [1b.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1b.M1
      mark_type: M
      points: 8
      evidence: $\sqrt\pi$, $2$, $\sqrt{2\pi}$, $1+\dfrac{\pi}{2}$의 좌우에서 $F'(x)=f(x)$의 부호 변화를 맞게 서술했다(부호표 등).
      depends_on: []
      steps: [1bb-1, 1bb-2]
    - id: 1b.A1
      mark_type: A
      points: 2
      evidence: 극대 $x=2,\ 1+\dfrac{\pi}{2}$, 극소 $x=\sqrt\pi,\ \sqrt{2\pi}$를 모두 찾았다.
      depends_on: [1b.M1]
      steps: [1bb-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5303}
  misconceptions:
  - id: MC-CAL-5303
    outcome_code: '70'
    wrong_work: '$1+\dfrac{\pi}{2}<\sqrt{2\pi}$로 순서를 잘못 잡거나 순서 근거 없이 부호표를 작성해 극대·극소를 뒤바꿈'
    detect_cue: 부호표에서 $1+\dfrac{\pi}{2}$가 $\sqrt{2\pi}$보다 왼쪽에 있다
    feedback: 근의 대소를 먼저 확정해야 부호표가 맞습니다. 제시문 (나)에 $\alpha=\pi$를 넣어 보세요.
    remedy: [RL-2]
- id: 2a
  stem: |
    (2-2) $g(t)=\cos(t^2-1)\sin(t^2-2)\cos^2(t^2-3)\sin^2(t^2-4)$라 하자.
    (a) 열린구간 $(-\sqrt\pi,\sqrt\pi)$에서 $g(t)=0$이 되는 $t$의 값을 모두 구하시오. (5점)
  points: 5
  depends_on: []
  answer: {kind: set, value: '\pm\sqrt{1+\dfrac{\pi}{2}},\ \pm\sqrt2,\ \pm\sqrt{3-\dfrac{\pi}{2}},\ \pm\sqrt{4-\pi}', equivalents: [], tolerance: null}
  solutions:
  - id: S2a-A
    audience: A
    method_no: 1
    key_idea: $0\le t^2<\pi$에서 각 인수의 영점은 하나씩이다.
    steps:
    - {id: 2aa, content: '$t^2=1+\dfrac{\pi}{2},\ 2,\ 3-\dfrac{\pi}{2},\ 4-\pi$', criteria: [2a.B1]}
    hint_ladder:
    - $t^2-k$의 범위를 구해 보자.
  - id: S2a-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오전 해설(문항카드) p.8 예시답안 (2-2)(a), 채점기준 p.7
    steps:
    - id: 2ab-1
      content: |
        $-\sqrt\pi<t<\sqrt\pi$이므로 $0\le t^2<\pi$이고, 따라서 $-n\le t^2-n<\pi-n$이다. 범위를 고려하여 각 항이 0이 되는 $t$의 값을 찾으면
        $\cos(t^2-1)=0\iff t^2-1=\dfrac{\pi}{2}\iff t=\pm\sqrt{1+\dfrac{\pi}{2}}$,
        $\sin(t^2-2)=0\iff t^2-2=0\iff t=\pm\sqrt2$,
        $\cos(t^2-3)=0\iff t^2-3=-\dfrac{\pi}{2}\iff t=\pm\sqrt{3-\dfrac{\pi}{2}}$,
        $\sin(t^2-4)=0\iff t^2-4=-\pi\iff t=\pm\sqrt{4-\pi}$.
        즉, 해는 $t=\pm\sqrt{1+\dfrac{\pi}{2}},\ \pm\sqrt2,\ \pm\sqrt{3-\dfrac{\pi}{2}},\ \pm\sqrt{4-\pi}$이다.
      criteria: [2a.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2a.B1
      mark_type: B
      points: 5
      evidence: 해 8개 $\pm\sqrt{1+\frac{\pi}{2}}$, $\pm\sqrt2$, $\pm\sqrt{3-\frac{\pi}{2}}$, $\pm\sqrt{4-\pi}$를 모두 찾았다.
      depends_on: []
      steps: [2ab-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-5303}
  misconceptions:
  - id: MC-ALG-5303
    outcome_code: '70'
    wrong_work: '$t^2=a$에서 양수 해 $t=\sqrt a$만 적어 음수 해를 빠뜨림'
    detect_cue: 해가 4개이고 모두 양수
    feedback: 구간이 $(-\sqrt\pi,\sqrt\pi)$이므로 $t^2=a$의 두 해 $\pm\sqrt a$가 모두 들어갑니다.
    remedy: [RL-1]
- id: 2b
  stem: |
    (b) 열린구간 $(-\sqrt\pi,\sqrt\pi)$에서 정의된 함수 $G(x)=\displaystyle\int_0^xg(t)dt$에 대하여, $G(x)$가 극댓값을 가지는 $x$의 값과 극솟값을 가지는 $x$의 값을 각각 모두 구하시오. (15점)
  points: 15
  depends_on: [2a]
  answer: {kind: set, value: '극대 $x=\sqrt{1+\dfrac{\pi}{2}},\ -\sqrt2$, 극소 $x=-\sqrt{1+\dfrac{\pi}{2}},\ \sqrt2$', equivalents: [], tolerance: null}
  solutions:
  - id: S2b-A
    audience: A
    method_no: 1
    key_idea: 제곱 인수의 영점에서는 $G'$의 부호가 그대로이고, $\cos(x^2-1)$, $\sin(x^2-2)$의 영점에서만 부호가 바뀐다. $x<0$에서는 $x^2$가 감소하므로 바뀌는 방향이 반대다.
    steps:
    - {id: 2ba, content: '$\pm\sqrt{1+\frac{\pi}{2}}$: $-\to+$(왼쪽), $+\to-$(오른쪽) / $\pm\sqrt2$: $+\to-$(왼쪽), $-\to+$(오른쪽) / $\pm\sqrt{3-\frac{\pi}{2}}$, $\pm\sqrt{4-\pi}$: 변화 없음', criteria: [2b.M1, 2b.R1, 2b.A1]}
    hint_ladder:
    - $\cos^2(\cdot)\sin^2(\cdot)$은 영점 근처에서 부호가 어떤가?
    - $x$가 음수일 때 $x$가 커지면 $x^2$은 작아진다.
  - id: S2b-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오전 해설(문항카드) p.8~9 예시답안 (2-2)(b), 채점기준 p.7
    steps:
    - id: 2bb-1
      content: |
        $G(x)=\displaystyle\int_0^x\cos(t^2-1)\sin(t^2-2)\cos^2(t^2-3)\sin^2(t^2-4)dt$를 미분하면 $G'(x)=g(x)=\cos(x^2-1)\sin(x^2-2)\cos^2(x^2-3)\sin^2(x^2-4)$이다. 이 함수의 값이 0이 되는 점들의 좌우에서의 $G'(x)$의 부호를 관찰하자.
      criteria: [2b.M1]
    - id: 2bb-2
      content: |
        1) $x=\pm\sqrt{1+\dfrac{\pi}{2}}$인 경우. $\cos^2(x^2-3)\sin^2(x^2-4)$의 부호는 이 점들의 근방에서 항상 양수이므로 $\cos(x^2-1)$과 $\sin(x^2-2)$의 부호만 고려하면 된다. $x^2-2=\dfrac{\pi}{2}-1$이므로 이 점들의 근방에서 $\sin(x^2-2)$의 값은 양수이다. $x=-\sqrt{1+\frac{\pi}{2}}$의 좌우에서 $x^2-1$은 $\dfrac{\pi}{2}$보다 큰 값에서 작은 값으로 변하고, $\cos(x^2-1)$은 음수에서 양수로 변한다. $x=\sqrt{1+\frac{\pi}{2}}$의 좌우에서 $x^2-1$은 $\dfrac{\pi}{2}$보다 작은 값에서 큰 값으로 변하고, $\cos(x^2-1)$은 양수에서 음수로 변한다. 그러므로 제시문 (가)에 의해 $x=-\sqrt{1+\frac{\pi}{2}}$에서 극솟값을 갖고, $x=\sqrt{1+\frac{\pi}{2}}$에서 극댓값을 갖는다.
      criteria: [2b.M1]
    - id: 2bb-3
      content: |
        2) $x=\pm\sqrt2$인 경우. $\cos^2(x^2-3)\sin^2(x^2-4)$는 이 점들의 근방에서 양수이고, $x^2-1=1$이므로 근방에서 $\cos(x^2-1)$의 값은 양수이다. $x=-\sqrt2$의 좌우에서 $x^2-2$는 0보다 큰 값에서 작은 값으로 변하고, $\sin(x^2-2)$는 양수에서 음수로 변한다. $x=\sqrt2$의 좌우에서 $x^2-2$는 0보다 작은 값에서 큰 값으로 변하고, $\sin(x^2-2)$는 음수에서 양수로 변한다. 그러므로 제시문 (가)에 의해 $x=-\sqrt2$에서 극댓값을 갖고, $x=\sqrt2$에서 극솟값을 갖는다.
      criteria: [2b.M1]
    - id: 2bb-4
      content: |
        3) $x=\pm\sqrt{3-\dfrac{\pi}{2}}$인 경우. 이 점들의 좌우에서 $\cos^2(x^2-3)$의 값은 항상 양수이므로(그 점 제외), 함숫값의 부호가 바뀌지 않는다. 따라서 이 점들에서 극댓값이나 극솟값을 갖지 않는다.
        4) $x=\pm\sqrt{4-\pi}$인 경우. 이 점들의 좌우에서 $\sin^2(x^2-4)$의 값은 항상 양수이므로, 함숫값의 부호가 바뀌지 않는다. 따라서 이 점들에서 극댓값이나 극솟값을 갖지 않는다.
      criteria: [2b.R1]
    - id: 2bb-5
      content: |
        따라서 $G(x)$가 극댓값을 갖는 점은 $\sqrt{1+\dfrac{\pi}{2}}$, $-\sqrt2$이고, 극솟값을 갖는 점은 $-\sqrt{1+\dfrac{\pi}{2}}$, $\sqrt2$이다.
      criteria: [2b.A1]
