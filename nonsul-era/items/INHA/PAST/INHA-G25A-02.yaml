intent: |
  극댓값, 극솟값의 개념을 이해하고, 미분가능한 함수가 극댓값과 극솟값을 갖는 점을 구할 수 있는지 평가한다. (2-1) 극댓값, 극솟값의 개념을 이해하고, 삼각함수의 성질을 활용하여 함수가 극댓값, 극솟값을 갖는 점을 계산할 수 있는지, (2-2) 삼각함수의 성질을 활용하여 주어진 함수의 미분계수가 0이 되는 점들에 대하여 각 점에서 극댓값, 극솟값을 갖는지 또는 둘 다 갖지 않는지 판단하는 능력을 평가한다.
key_idea: '$F''(x)=f(x)$이므로 $f$의 영점 좌우에서 각 인수의 부호 변화를 조사한다. 제곱 인수의 영점에서는 부호가 바뀌지 않아 극값이 아니다.'
stuck: (2-2)에서 $\cos^2$, $\sin^2$ 인수의 영점은 $G'(x)=0$이지만 부호 변화가 없어 극값이 아님을 판단하는 단계, 그리고 (2-1)에서 $1+\dfrac{\pi}{2}$와 $\sqrt{2\pi}$의 대소 비교
idea_tags: [IDEA-FTC-DERIV-SIGN-TABLE, IDEA-SQUARED-FACTOR-NO-SIGN-CHANGE, IDEA-AMGM-ORDER-ROOTS]
tags: [인하대 기출, 2025 자연 오전, 정적분으로 정의된 함수, 극값 판정, 삼각방정식]
