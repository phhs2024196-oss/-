intent: |
  접선의 방정식을 구하고 판별식을 이용하여 이차함수의 그래프의 개형을 파악하고, 그래프의 평행이동을 이해하는지 평가한다. (3-1) 접선의 방정식을 구할 수 있는지, (3-2) 판별식을 이용하여 이차함수의 그래프의 개형을 파악하고, 그래프의 평행이동을 이해하는지 평가한다.
key_idea: '(3-1)의 넓이 $4(a^2+b)^{\frac32}=4f(a)^{\frac32}$는 평행이동해도 변하지 않으므로, 꼭짓점을 $y$축 위로 옮기면 $S=4g(1)^{\frac32}$이다.'
stuck: (3-2)(b)에서 $y=g(x)$와 점 $A$를 함께 평행이동해 (3-1)의 상황으로 만들고, 넓이를 $4f(a)^{\frac32}$꼴(점의 $x$좌표에서의 함숫값)로 읽어 내는 단계
idea_tags: [IDEA-TANGENT-FROM-EXTERNAL-POINT, IDEA-TRANSLATION-INVARIANCE, IDEA-DISCRIMINANT-SIGN-POSITIVE]
tags: [인하대 기출, 2025 자연 오전, 접선, 판별식, 평행이동, 의예과 공통]
elements:
  materials: ['포물선 $f(x)=x^2+b$ 밖의 점 $X(a,0)$에서 그은 두 접선', '접점과 $x$축 위 수선의 발로 이루는 사다리꼴', '계수에 $p$가 들어간 이차함수 $g(x)=x^2+(p-2)x+(p^3-4p+4)$']
  concepts: [접선의 방정식, 이차방정식의 판별식, 그래프의 평행이동, 삼차함수의 최대·최소(구간 끝 극한)]
  tools: [접점 $x$좌표를 $c$로 두고 기울기 $2c$로 방정식 세우기, 사다리꼴 넓이 공식, 판별식 인수분해 후 완전제곱, 평행이동으로 (3-1) 결과 재사용, 도함수로 삼차함수 최솟값]
  conditions:
  - '$b>0$ ⇒ $a^2+b>0$이므로 접선이 항상 두 개'
  - '$-2<p<2$ ⇒ $p+2>0$, $h(p)<0$이므로 판별식 음수, $g(x)>0$'
  - '열린구간 $(-2,2)$ ⇒ 끝점 극한 $\lim_{p\to-2+}r(p)=1$과 극솟값 $r(1)=1$ 비교'
  stimuli_used: [가, 나]
  subpart_links: (3-2)(b)는 (3-1)의 넓이 공식과 (3-2)(a)의 $g(x)>0$ 사용, (3-2)(c)는 (b)의 $S(p)$ 사용

