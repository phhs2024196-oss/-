stimuli:
- label: 가
  body: |
    (접선의 방정식) 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: 나
  body: |
    (판별식) 이차방정식 $ax^2+bx+c=0\ (a\ne0)$의 판별식은 $D=b^2-4ac$이다.

stem: |
  다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    (3-1) 실수 $a$와 양의 실수 $b$에 대하여 점 $X(a,0)$에서 곡선 $f(x)=x^2+b$에 그은 두 접선이 곡선과 만나는 접점을 각각 $P$, $Q$라 하자. 점 $P$, $Q$에서 $x$축에 내린 수선의 발을 각각 $P'$, $Q'$이라 할 때, 사다리꼴 $PP'Q'Q$의 넓이를 $a$와 $b$의 식으로 나타내시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: '4(a^2+b)^{\frac32}', equivalents: ['4(a^2+b)\sqrt{a^2+b}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접점 $x$좌표 $c$는 $c^2-2ac-b=0$의 두 근 $a\pm\sqrt{a^2+b}$이고, 두 높이의 합은 $f(c_1)+f(c_2)=4(a^2+b)$이다.
    steps:
    - {id: 1a, content: '넓이 $=\dfrac12\cdot4(a^2+b)\cdot2\sqrt{a^2+b}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 접점을 $(c,c^2+b)$로 두고 접선이 $(a,0)$을 지나는 조건을 써 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오전 해설(문항카드) p.12 예시답안 (3-1), 채점기준 p.12
    steps:
    - id: 1b-1
      content: |
        접점의 $x$좌표를 $c$라 하면 제시문 (가)의 접선의 기울기로부터 $2c=\dfrac{c^2+b}{c-a}$이고 $c=a\pm\sqrt{a^2+b}$이다. 따라서 $P$와 $Q$의 $x$좌표는 각각 $a-\sqrt{a^2+b}$, $a+\sqrt{a^2+b}$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $P'=(a-\sqrt{a^2+b},0)$, $Q'=(a+\sqrt{a^2+b},0)$이므로 사다리꼴 $PP'Q'Q$의 넓이는
        $$\frac12\times\left(\overline{PP'}+\overline{QQ'}\right)\times\overline{P'Q'}=\frac12\times4(a^2+b)\times2\sqrt{a^2+b}=4(a^2+b)^{\frac32}$$
        이다. [그림(해설지): 포물선과 $X$에서 그은 두 접선, 접점 $P$(왼쪽 아래)·$Q$(오른쪽 위), 수선의 발 $P'$, $Q'$로 이루는 사다리꼴이 색칠됨]
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $P$, $Q$의 $x$좌표 $a\pm\sqrt{a^2+b}$를 모두 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 사다리꼴 $PP'Q'Q$의 넓이 $4(a^2+b)^{\frac32}$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5306}
  misconceptions:
  - id: MC-CAL-5306
    outcome_code: '70'
    wrong_work: '점 $X(a,0)$을 접점으로 보고 $y=f''(a)(x-a)+f(a)$를 접선으로 씀'
    detect_cue: 접선이 하나뿐이거나 접점 $x$좌표가 $a$
    feedback: $X$는 곡선 밖의 점입니다. 접점을 $(c,f(c))$로 두고 그 접선이 $X$를 지나는 조건으로 $c$를 구하세요.
    remedy: [RL-1]
- id: 2a
  stem: |
    (3-2) $-2<p<2$인 실수 $p$에 대하여 $g(x)=x^2+(p-2)x+(p^3-4p+4)$라 하자.
    (a) 이차방정식 $g(x)=0$의 판별식이 $(p+2)h(p)$일 때, $h(p)$의 최댓값을 구하시오. (5점)
  points: 5
  depends_on: []
  answer: {kind: value, value: '-\dfrac{15}{16}', equivalents: ['-15/16'], tolerance: null}
  solutions:
  - id: S2a-A
    audience: A
    method_no: 1
    key_idea: 판별식을 $(p+2)$로 인수분해하면 $h(p)=-4p^2+9p-6$.
    steps:
    - {id: 2aa, content: '$h(p)=-4\left(p-\dfrac98\right)^2-\dfrac{15}{16}$', criteria: [2a.B1]}
    hint_ladder:
    - 판별식에 $p=-2$를 넣으면 0이 된다.
  - id: S2a-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오전 해설(문항카드) p.12 예시답안 (3-2)(a), 채점기준 p.12
    steps:
    - id: 2ab-1
      content: |
        제시문 (나)에 의하여 판별식이 $(p-2)^2-4(p^3-4p+4)=-4p^3+p^2+12p-12=(p+2)(-4p^2+9p-6)$이므로 $h(p)=-4p^2+9p-6=-4\left(p-\dfrac98\right)^2-\dfrac{15}{16}$는 $p=\dfrac98$에서 최댓값 $-\dfrac{15}{16}$을 가진다.
      criteria: [2a.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2a.B1
      mark_type: B
      points: 5
      evidence: $h(p)=-4p^2+9p-6$을 구하고 최댓값 $-\dfrac{15}{16}$을 구했다.
      depends_on: []
      steps: [2ab-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-5304}
  misconceptions:
  - id: MC-ALG-5304
    outcome_code: '70'
    wrong_work: '판별식을 전개할 때 $-4(p^3-4p+4)$의 부호를 놓쳐 $h(p)$를 잘못 얻음'
    detect_cue: $h(p)$가 $(p+2)$로 나누어떨어지지 않거나 최댓값이 양수
    feedback: 문제에서 $(p+2)$가 인수라고 했으니, 전개 결과에 $p=-2$를 넣어 0이 되는지 검산하세요.
    remedy: [RL-2]
- id: 2b
  stem: |
    (b) 점 $A(1,0)$에서 $y=g(x)$에 그은 두 접선의 접점을 각각 $B$, $C$라 하고, 점 $B$, $C$에서 $x$축에 내린 수선의 발을 각각 $B'$, $C'$이라 하자. 사다리꼴 $BB'C'C$의 넓이를 $S$라 할 때, $S$를 $p$의 식으로 나타내시오. (10점)
  points: 10
  depends_on: ['1', 2a]
  answer: {kind: expression, value: 'S=4(p^3-3p+3)^{\frac32}', equivalents: ['4g(1)^{3/2}'], tolerance: null}
  solutions:
  - id: S2b-A
    audience: A
    method_no: 1
    key_idea: 꼭짓점을 $y$축 위로 평행이동하면 (3-1)이 되고 넓이 $4f(a)^{\frac32}$는 $4g(1)^{\frac32}$로 바뀐다.
    steps:
    - {id: 2ba, content: '$g(1)=p^3-3p+3$, $S=4(p^3-3p+3)^{\frac32}$', criteria: [2b.M1, 2b.A1]}
    hint_ladder:
    - $g(x)>0$이면 꼭짓점의 $y$좌표는 양수이다.
    - (3-1)의 답 $4(a^2+b)^{\frac32}$에서 $a^2+b$는 무엇인가?
  - id: S2b-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오전 해설(문항카드) p.12~13 예시답안 (3-2)(b), 채점기준 p.12
    steps:
    - id: 2bb-1
      content: |
        $p\in(-2,2)$이므로 $p+2>0$이다. 따라서 (a)에 의하여 $g(x)=0$의 판별식 $(p+2)h(p)$는 음수이고 모든 실수 $x$에 대하여 $g(x)>0$이다.
      criteria: [2b.M1]
    - id: 2bb-2
      content: |
        곡선 $y=g(x)$의 꼭짓점이 $y$축 위에 오도록 곡선 $y=g(x)$와 점 $A$를 평행이동하면 (3-1)과 같은 상황이 된다. (3-1)에서 사다리꼴 $PP'Q'Q$의 넓이는 $4(a^2+b)^{\frac32}=4f(a)^{\frac32}$이므로 사다리꼴 $BB'C'C$의 넓이는
        $$S=4g(1)^{\frac32}=4(p^3-3p+3)^{\frac32}$$
        이다.
      criteria: [2b.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2b.M1
      mark_type: M
      points: 5
      evidence: 판별식이 음수여서 $g(x)>0$(꼭짓점이 $x$축 위쪽)임을 밝혀 곡선 $y=g(x)$의 개형을 파악했다.
      depends_on: []
      steps: [2bb-1]
    - id: 2b.A1
      mark_type: A
      points: 5
      evidence: 사다리꼴 $BB'C'C$의 넓이 $S=4(p^3-3p+3)^{\frac32}$를 구했다(평행이동 또는 직접 계산).
      depends_on: [2b.M1]
      ft: {allowed: true, from: [1.A1], max_points: 5}
      steps: [2bb-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-5305}
  misconceptions:
  - id: MC-ALG-5305
    outcome_code: '70'
    wrong_work: '곡선만 평행이동하고 점 $A$는 그대로 두어 (3-1)의 $a$를 1로 놓음'
    detect_cue: '$S=4\left(1+\text{꼭짓점의 }y\text{좌표}\right)^{\frac32}$ 꼴이 나옴'
    feedback: 평행이동할 때 점 $A$도 함께 옮겨야 같은 사다리꼴이 됩니다. $a^2+b=f(a)$임을 이용하면 이동 없이 $g(1)$로 바로 읽을 수 있습니다.
    remedy: [RL-3]
- id: 2c
  stem: |
    (c) $S$의 최솟값을 구하시오. (5점)
  points: 5
  depends_on: [2b]
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S2c-A
    audience: A
    method_no: 1
    key_idea: $r(p)-1=p^3-3p+2=(p-1)^2(p+2)\ge0$.
    steps:
    - {id: 2ca, content: '$p=1$에서 $r=1$, $S=4$', criteria: [2c.B1]}
    hint_ladder:
    - $r(p)=p^3-3p+3$의 극솟값과 구간 끝의 극한값을 비교하자.
  - id: S2c-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오전 해설(문항카드) p.13 예시답안 (3-2)(c), 채점기준 p.12
    steps:
    - id: 2cb-1
      content: |
        $S$는 $p^3-3p+3$이 최소일 때 최솟값을 가진다. $r(p)=p^3-3p+3$이라 하면 $r'(p)=3p^2-3$이므로 $p=1$에서 극솟값, $p=-1$에서 극댓값을 가진다. $\displaystyle\lim_{p\to-2+}r(p)=1=r(1)$이므로 $S$는 $p=1$일 때 최솟값을 가지고 이때 $S=4$이다.
      criteria: [2c.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2c.B1
      mark_type: B
      points: 5
      evidence: $r(p)=p^3-3p+3$의 최솟값 $1$($p=1$, 구간 끝 극한 비교 포함)로 $S$의 최솟값 $4$를 구했다.
      depends_on: []
      ft: {allowed: true, from: [2b.A1], max_points: 5}
      steps: [2cb-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5307}
  misconceptions:
  - id: MC-CAL-5307
    outcome_code: '70'
    wrong_work: '열린구간 끝 $p\to-2+$를 확인하지 않거나, $r(-2)=1$을 함숫값으로 보고 최솟값을 두 곳에서 갖는다고 씀'
    detect_cue: 구간 끝에 대한 언급이 없거나 $p=-2$를 답에 포함
    feedback: 열린구간에서는 끝점 값이 실제로 취해지지 않습니다. 극솟값과 끝점 극한을 비교해 최솟값이 실제로 존재하는지 확인하세요.
    remedy: [RL-4]

