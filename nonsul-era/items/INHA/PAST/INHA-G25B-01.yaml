intent: |
  삼각함수의 성질을 이용하여 삼각형의 넓이를 함수로 나타내고, 함수의 미분을 이용하여 함수의 극대, 극소, 최대, 최소를 구할 수 있는지 평가한다. (1-1) 삼각함수의 성질을 이용하여 삼각형의 넓이를 함수로 나타낼 수 있는지, (1-2) 함수의 미분을 이용하여 함수의 극대, 극소를 판정할 수 있는지, (1-3) 함수의 최대, 최소를 구할 수 있는지 평가한다.
key_idea: '$P$, $Q$가 어느 변 위에 있는지에 따라 $x$를 $\left[0,\frac{\pi}{12}\right]$, $\left[\frac{\pi}{12},\frac{\pi}{4}\right]$, $\left[\frac{\pi}{4},\frac{\pi}{3}\right]$로 나누고 $S=\frac12\overline{AP}\cdot\overline{AQ}\sin\frac{\pi}{6}$을 쓰면, 분모 미분이 $\sin(2x\pm\cdot)$, $\cos(2x-\cdot)$ 꼴로 정리된다.'
stuck: 구간 경계 $x=\dfrac{\pi}{12}$, $\dfrac{\pi}{4}$에서 $S$가 미분가능하지 않지만 제시문 (나)의 정의로 극대임을 판정하는 단계
