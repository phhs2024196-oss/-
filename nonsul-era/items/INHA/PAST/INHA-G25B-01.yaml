stimuli:
- label: 가
  body: |
    (삼각형의 넓이) 삼각형 $ABC$에 대하여 $\overline{CA}=b$, $\overline{AB}=c$라 할 때, 삼각형 $ABC$의 넓이는 $S=\dfrac12bc\sin A$이다.
- label: 나
  body: |
    (극대와 극소) 함수 $f(x)$에서 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\le f(a)$일 때 $x=a$에서 극대라고 하며, $f(a)$를 극댓값이라고 한다. 또, $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\ge f(a)$일 때 $x=a$에서 극소라고 하며, $f(a)$를 극솟값이라고 한다. 극댓값과 극솟값을 통틀어 극값이라고 한다.

stem: |
  다음 제시문을 읽고 물음에 답하시오.
  (※) 한 변의 길이가 $10$인 정사각형 $ABCD$에서 두 점 $P$, $Q$는 변 $BC$ 또는 변 $CD$ 위에 있으며 $\angle PAQ=\dfrac{\pi}{6}$이다. (단, $\angle BAP<\angle BAQ$이고, 두 점 $P$, $Q$는 모두 변 $BC$ 위에 있을 수도 있고 모두 변 $CD$ 위에 있을 수도 있다.)
  $\angle BAP=x$일 때, 삼각형 $APQ$의 넓이를 $S(x)$라 하자.
  [그림: 정사각형 $ABCD$(왼쪽 아래 $A$, 오른쪽 아래 $B$, 오른쪽 위 $C$, 왼쪽 위 $D$). 점 $P$는 변 $BC$ 위, 점 $Q$는 변 $CD$ 위에 있고, 선분 $AP$, $AQ$, $PQ$가 그려져 있다. $\angle BAP=x$, $\angle PAQ=\frac{\pi}{6}$로 표시.]

subparts:
- id: '1'
  stem: |
    (1-1) $0\le x\le\dfrac{\pi}{3}$일 때, $S(x)$를 $x$의 범위에 따라 $x$의 식으로 나타내시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'S(x)=\dfrac{25}{\cos x\cos(x+\frac{\pi}{6})}\ (0\le x\le\frac{\pi}{12}),\ \dfrac{25}{\cos x\cos(\frac{\pi}{3}-x)}\ (\frac{\pi}{12}\le x\le\frac{\pi}{4}),\ \dfrac{25}{\sin x\cos(\frac{\pi}{3}-x)}\ (\frac{\pi}{4}\le x\le\frac{\pi}{3})', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$S=\frac12\cdot\overline{AP}\cdot\overline{AQ}\cdot\frac12$이고 각 변 위 점까지의 거리는 $\frac{10}{\cos(\text{그 변과 이루는 각})}$.'
    steps:
    - {id: 1a, content: '$\overline{AP}=\frac{10}{\cos x}$ 또는 $\frac{10}{\sin x}$, $\overline{AQ}=\frac{10}{\cos(x+\frac{\pi}{6})}$ 또는 $\frac{10}{\cos(\frac{\pi}{3}-x)}$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $Q$가 점 $C$에 올 때와 $P$가 점 $C$에 올 때의 $x$를 구하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오후 해설(문항카드) p.3~4 예시답안 (1-1), 채점기준 p.3
    steps:
    - id: 1b-1
      content: |
        다음 세 가지 경우로 나눌 수 있다.
        (i) $P$, $Q$가 모두 변 $BC$ 위에 있을 때 $\left(0\le x\le\dfrac{\pi}{12}\right)$, (ii) $P$는 변 $BC$ 위에 있고 $Q$는 변 $CD$ 위에 있을 때 $\left(\dfrac{\pi}{12}\le x\le\dfrac{\pi}{4}\right)$, (iii) $P$, $Q$가 모두 변 $CD$ 위에 있을 때 $\left(\dfrac{\pi}{4}\le x\le\dfrac{\pi}{3}\right)$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (i) $\overline{AP}=\dfrac{10}{\cos x}$이고 $\overline{AQ}=\dfrac{10}{\cos\left(x+\frac{\pi}{6}\right)}$이다.
        (ii) $\overline{AP}=\dfrac{10}{\cos x}$이고 $\overline{AQ}=\dfrac{10}{\cos\left(\frac{\pi}{3}-x\right)}$이다.
        (iii) $\overline{AP}=\dfrac{10}{\cos\left(\frac{\pi}{2}-x\right)}=\dfrac{10}{\sin x}$, $\overline{AQ}=\dfrac{10}{\cos\left(\frac{\pi}{3}-x\right)}$이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        제시문 (가)에 의해 $S(x)=\dfrac12\cdot\overline{AP}\cdot\overline{AQ}\cdot\sin\dfrac{\pi}{6}$이므로, 결론적으로
        $$S(x)=\begin{cases}\dfrac{25}{\cos x\cos\left(x+\frac{\pi}{6}\right)} & \left(0\le x\le\frac{\pi}{12}\right)\\[2mm] \dfrac{25}{\cos x\cos\left(\frac{\pi}{3}-x\right)} & \left(\frac{\pi}{12}\le x\le\frac{\pi}{4}\right)\\[2mm] \dfrac{25}{\sin x\cos\left(\frac{\pi}{3}-x\right)} & \left(\frac{\pi}{4}\le x\le\frac{\pi}{3}\right)\end{cases}$$
        이다. (공식 예시답안에는 "제시문 (나)에 의해"로 적혀 있음 — 해설 오기)
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $x$의 범위를 $\left[0,\frac{\pi}{12}\right]$, $\left[\frac{\pi}{12},\frac{\pi}{4}\right]$, $\left[\frac{\pi}{4},\frac{\pi}{3}\right]$의 3가지 경우로 올바르게 나눴다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 3가지 경우에 대하여 각각 $\overline{AP}$, $\overline{AQ}$를 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 3가지 경우에 대하여 각각 $S(x)$를 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-5301}
  misconceptions:
  - id: MC-GEO-5301
    outcome_code: '70'
    wrong_work: '$Q$가 변 $CD$ 위에 있을 때도 $\overline{AQ}=\dfrac{10}{\cos(x+\frac{\pi}{6})}$를 그대로 써서 한 식으로 답함'
    detect_cue: 구간 분할이 없거나 두 구간뿐
    feedback: 점이 변 $CD$ 위로 넘어가면 기준이 되는 변이 $AD$로 바뀌어 $\overline{AQ}=\frac{10}{\cos(\frac{\pi}{2}-\angle BAQ)}$가 됩니다. $P$, $Q$가 꼭짓점 $C$를 지나는 순간을 경계로 나누세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    (1-2) 열린구간 $\left(0,\dfrac{\pi}{3}\right)$에서 함수 $S(x)$가 극값을 가지는 $x$의 값을 모두 구하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: set, value: '극대 $x=\dfrac{\pi}{12},\ \dfrac{\pi}{4}$, 극소 $x=\dfrac{\pi}{6}$', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 구간별 $S'$의 분자가 $\sin\left(2x+\frac{\pi}{6}\right)$, $\sin\left(2x-\frac{\pi}{3}\right)$, $-\cos\left(2x-\frac{\pi}{3}\right)$이라 부호가 $+,-,+,-$.
    steps:
    - {id: 2a, content: '증가 → ($\frac{\pi}{12}$) 감소 → ($\frac{\pi}{6}$) 증가 → ($\frac{\pi}{4}$) 감소', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - $\cos x\cos(x+\frac{\pi}{6})$을 미분하면 어떤 한 개의 삼각함수가 될까?
    - 미분가능하지 않은 점도 극값이 될 수 있다(제시문 (나)).
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오후 해설(문항카드) p.4 예시답안 (1-2), 채점기준 p.3
    steps:
    - id: 2b-1
      content: |
        $S'(x)$를 각 구간에서 계산하면
        $$S'(x)=\begin{cases}\dfrac{25\sin\left(2x+\frac{\pi}{6}\right)}{\cos^2x\cos^2\left(x+\frac{\pi}{6}\right)} & \left(0\le x<\frac{\pi}{12}\right)\\[2mm] \dfrac{25\sin\left(2x-\frac{\pi}{3}\right)}{\cos^2x\cos^2\left(\frac{\pi}{3}-x\right)} & \left(\frac{\pi}{12}<x<\frac{\pi}{4}\right)\\[2mm] \dfrac{-25\cos\left(2x-\frac{\pi}{3}\right)}{\sin^2x\cos^2\left(\frac{\pi}{3}-x\right)} & \left(\frac{\pi}{4}<x\le\frac{\pi}{3}\right)\end{cases}$$
        이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $S'(x)$를 살펴보면, (i) $0\le x<\dfrac{\pi}{12}$일 때 $S'(x)>0$이므로 $S(x)$는 증가한다. (ii) $\dfrac{\pi}{12}<x<\dfrac{\pi}{4}$일 때 $S'\left(\dfrac{\pi}{6}\right)=0$이며, $\dfrac{\pi}{12}<x<\dfrac{\pi}{6}$일 때 $S'(x)<0$이고 $\dfrac{\pi}{6}<x<\dfrac{\pi}{4}$일 때 $S'(x)>0$이므로 $S(x)$는 $x=\dfrac{\pi}{6}$일 때 극솟값을 갖는다. (iii) $\dfrac{\pi}{4}<x\le\dfrac{\pi}{3}$일 때 $S'(x)<0$이므로 $S(x)$는 감소한다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        이것으로부터 $x=\dfrac{\pi}{12}$일 때와 대칭적으로 $x=\dfrac{\pi}{4}$일 때 극댓값을 갖는다는 것을 알 수 있다(제시문 (나)). 따라서 극값을 가지는 $x$는 $\dfrac{\pi}{12}$, $\dfrac{\pi}{6}$, $\dfrac{\pi}{4}$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: 3가지 경우에 대하여 각각 $S'(x)$를 구했다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: $S'(x)$가 양수 또는 음수가 되는 구간을 찾았다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 극대 $x=\dfrac{\pi}{12},\ \dfrac{\pi}{4}$, 극소 $x=\dfrac{\pi}{6}$을 구했다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5308}
  misconceptions:
  - id: MC-CAL-5308
    outcome_code: '70'
    wrong_work: '$S''(x)=0$인 점만 극값 후보로 보아 $x=\dfrac{\pi}{6}$ 하나만 답함'
    detect_cue: 답에 $\frac{\pi}{12}$, $\frac{\pi}{4}$가 없다
    feedback: 극값의 정의(제시문 (나))는 미분가능성을 요구하지 않습니다. 구간 경계에서 증가→감소로 바뀌면 극대입니다.
    remedy: [RL-2]
- id: '3'
  stem: |
    (1-3) 닫힌구간 $\left[0,\dfrac{\pi}{3}\right]$에서 함수 $S(x)$가 최댓값을 가질 때와 최솟값을 가질 때의 $x$의 값을 구하시오. (10점)
  points: 10
  depends_on: ['2']
  answer: {kind: set, value: '최댓값 $x=\dfrac{\pi}{12},\ \dfrac{\pi}{4}$, 최솟값 $x=0,\ \dfrac{\pi}{3}$', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $S\left(\frac{\pi}{6}\right)=\frac{100}{3}$과 $S(0)=S\left(\frac{\pi}{3}\right)=\frac{50}{\sqrt3}$을 비교.
    steps:
    - {id: 3a, content: '$\frac{100}{3}>\frac{50}{\sqrt3}$이므로 극소는 최소 아님', criteria: [3.B1, 3.A1, 3.A2]}
    hint_ladder:
    - 극솟값과 양 끝값을 비교하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오후 해설(문항카드) p.4 예시답안 (1-3), 채점기준 p.3
    steps:
    - id: 3b-1
      content: |
        (1-2)에서 살펴본 대로 $x=\dfrac{\pi}{12}$일 때와 $x=\dfrac{\pi}{4}$일 때 $S(x)$가 최댓값을 갖는다는 것을 알 수 있다.
      criteria: [3.A2]
    - id: 3b-2
      content: |
        한편 $S(x)$는 $x=\dfrac{\pi}{6}$일 때 극솟값을 갖지만 $S\left(\dfrac{\pi}{6}\right)=\dfrac{100}{3}$이고 $S(0)=S\left(\dfrac{\pi}{3}\right)=\dfrac{50}{\sqrt3}$인데, $\dfrac{100}{3}>\dfrac{50}{\sqrt3}$이므로 $x=0$일 때와 $x=\dfrac{\pi}{3}$일 때 $S(x)$가 최솟값을 갖는다.
      criteria: [3.B1, 3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 3
      evidence: 극솟값 $S\left(\frac{\pi}{6}\right)=\frac{100}{3}$이 최솟값이 아님을 (양 끝값 $\frac{50}{\sqrt3}$과 비교해) 밝혔다.
      depends_on: []
      steps: [3b-2]
    - id: 3.A1
