intent: |
  곡선의 접선의 식을 구할 수 있는지 평가한다. 두 곡선 사이의 도형의 넓이를 구할 수 있는지 평가한다. (2-1) 두 곡선이 한 점에서 만나는 조건과 접선의 기울기가 같다는 조건을 이해하는지, (2-2) 곡선의 접선의 식을 구할 수 있는지, (2-3) 두 곡선 사이의 도형의 넓이를 구할 수 있는지 평가한다.
key_idea: '접점 조건 $\frac a3x^2+1=b\sqrt x$, $\frac{2a}{3}x=\frac{b}{2\sqrt x}$에서 $x=\frac{1}{\sqrt a}$, $b=\frac43a^{\frac14}$. 공통접선은 $y=\frac{2\sqrt a}{3}x+\frac23$이고, 접선 위·아래 두 넓이가 모두 $\frac{1}{9\sqrt a}$이다.'
stuck: (2-1)에서 두 조건식에서 $b$를 소거해 $ax^2=1$을 얻는 단계, (2-3)에서 $b\sqrt x=\frac43a^{\frac14}\sqrt x$의 적분 계산
idea_tags: [IDEA-COMMON-TANGENT-TWO-CONDITIONS, IDEA-PARAMETER-FAMILY-FIXED-POINT, IDEA-AREA-RATIO-INVARIANT]
tags: [인하대 기출, 2025 자연 오후, 공통접선, 정적분과 넓이, 매개변수에 무관]
