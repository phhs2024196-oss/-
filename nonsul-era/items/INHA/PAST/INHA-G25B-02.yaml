stimuli:
- label: 가
  body: |
    (접선의 방정식) 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: 나
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$와 $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b\lvert f(x)-g(x)\rvert dx$$

stem: |
  다음 제시문을 읽고 물음에 답하시오.
  (※) 양의 실수 $a$, $b$에 대하여 두 곡선 $y=\dfrac a3x^2+1$과 $y=b\sqrt x$가 한 점 $P$에서만 만나고, 점 $P$에서의 곡선 $y=\dfrac a3x^2+1$의 접선과 곡선 $y=b\sqrt x$의 접선이 서로 일치한다고 하자.

subparts:
- id: '1'
  stem: |
    (2-1) $b$를 $a$의 식으로 나타내시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'b=\dfrac43a^{\frac14}', equivalents: ['(4/3)a^(1/4)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 함숫값·미분계수 일치에서 $b=\frac{4a}{3}x^{\frac32}$를 대입하면 $ax^2=1$.
    steps:
    - {id: 1a, content: '$x=a^{-\frac12}$, $b=\frac43a\cdot a^{-\frac34}=\frac43a^{\frac14}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 접하는 점에서는 함숫값과 미분계수가 모두 같다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오후 해설(문항카드) p.7 예시답안 (2-1), 채점기준 p.7
    steps:
    - id: 1b-1
      content: |
        점 $P$에서는 두 함수의 함숫값이 같고 미분계수도 같다. 따라서 이 점에서는 두 개의 등식 $\dfrac a3x^2+1=b\sqrt x$와 $\dfrac{2a}{3}x=\dfrac{b}{2\sqrt x}$가 성립한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        먼저, $\dfrac{2a}{3}x=\dfrac{b}{2\sqrt x}$로부터 $b=\dfrac{4a}{3}x^{\frac32}$을 얻는다. 이것을 $\dfrac a3x^2+1=b\sqrt x$에 대입하면 $x=\dfrac{1}{\sqrt a}=a^{-\frac12}$이다. 따라서 $b=\dfrac43a^{\frac14}$이 된다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 두 곡선이 한 점에서 만나는 조건과 그 점에서의 미분계수가 같다는 조건을 식으로 썼다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: 관계식 $b=\dfrac43a^{\frac14}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5310}
  misconceptions:
  - id: MC-CAL-5310
    outcome_code: '70'
    wrong_work: '$\dfrac a3x^2+1=b\sqrt x$의 판별식 등 교점 조건 하나만 쓰고 미분계수 일치 조건을 빠뜨림'
    detect_cue: 조건식이 하나뿐이거나 $b$에 $x$가 남는다
    feedback: 두 곡선이 한 점에서 접하려면 함숫값과 미분계수가 모두 같아야 합니다. 두 식을 연립해 접점의 $x$좌표부터 구하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    (2-2) 점 $P$에서의 곡선 $y=\dfrac a3x^2+1$의 접선이 $a$의 값에 관계없이 좌표평면의 일정한 점을 지남을 보이시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 접선 $y=\frac{2\sqrt a}{3}x+\frac23$의 $y$절편이 $a$와 무관.
    steps:
    - {id: 2a, content: '$P=\left(\frac{1}{\sqrt a},\frac43\right)$, 기울기 $\frac{2\sqrt a}{3}$, 고정점 $\left(0,\frac23\right)$', criteria: [2.B1, 2.M1, 2.A1]}
    hint_ladder:
    - $P$의 $y$좌표는 $a$에 관계없다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오후 해설(문항카드) p.7 예시답안 (2-2), 채점기준 p.7
    steps:
    - id: 2b-1
      content: |
        점 $P$의 $x$좌표는 $x=\dfrac{1}{\sqrt a}$이므로 $P=\left(\dfrac{1}{\sqrt a},\dfrac43\right)$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        이 점에서의 접선의 기울기, 즉 미분계수는 $\dfrac{2\sqrt a}{3}$이다. 따라서 제시문 (가)에 의해 접선의 방정식은 $y-\dfrac43=\dfrac{2\sqrt a}{3}\left(x-\dfrac{1}{\sqrt a}\right)$이고 이것을 정리하면 $y=\dfrac{2\sqrt a}{3}x+\dfrac23$이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        그러므로 $a$의 값에 관계없이 접선이 $y$축 위의 점 $\left(0,\dfrac23\right)$을 지난다. ■
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: $P$의 좌표 $\left(\dfrac{1}{\sqrt a},\dfrac43\right)$를 구했다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: 접선의 방정식 $y=\dfrac{2\sqrt a}{3}x+\dfrac23$을 구했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 접선이 항상 $\left(0,\dfrac23\right)$을 지남을 밝혔다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5311}
  misconceptions:
  - id: MC-CAL-5311
    outcome_code: '70'
    wrong_work: '특정 $a$ 값 두세 개로 접선을 그려 교점을 찾고 일반 증명 없이 결론'
    detect_cue: 접선 방정식이 $a$에 대한 일반식으로 적혀 있지 않다
    feedback: $a$에 관계없음을 보이려면 접선을 $a$에 대한 식으로 쓰고, $a$를 포함하지 않는 점을 찾아야 합니다.
    remedy: [RL-2]
- id: '3'
  stem: |
    (2-3) 두 곡선 $y=\dfrac a3x^2+1$, $y=b\sqrt x$ 및 $y$축으로 둘러싸인 도형을 $A$라 하자. 점 $P$에서의 곡선 $y=\dfrac a3x^2+1$의 접선에 의해 도형 $A$가 두 개의 도형으로 나누어진다. 이때 이 두 도형의 넓이의 비는 $a$의 값에 관계없이 일정함을 보이시오. (15점)
  points: 15
  depends_on: ['1', '2']
  answer: {kind: proof, value: null, equivalents: ['넓이의 비 1:1'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 두 넓이가 모두 $\frac{1}{9\sqrt a}$이라 비는 항상 $1:1$.
    steps:
    - {id: 3a, content: '윗도형 $\frac{a}{9}a^{-\frac32}-\frac{\sqrt a}{3}a^{-1}+\frac{1}{3\sqrt a}$, 아랫도형 $\frac{1}{3\sqrt a}+\frac{2}{3\sqrt a}-\frac89a^{\frac14}a^{-\frac34}$', criteria: [3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - 구간 $\left[0,\frac{1}{\sqrt a}\right]$에서 접선과 각 곡선 사이의 넓이를 각각 적분하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오후 해설(문항카드) p.7 예시답안 (2-3), 채점기준 p.7
    steps:
    - id: 3b-1
      content: |
        제시문 (나)에 의해 접선 $y=\dfrac{2\sqrt a}{3}x+\dfrac23$에 의해 생긴 두 도형 중 윗도형의 넓이는
        $$\int_0^{\frac{1}{\sqrt a}}\left(\frac a3x^2+1-\frac{2\sqrt a}{3}x-\frac23\right)dx=\left[\frac a9x^3-\frac{\sqrt a}{3}x^2+\frac x3\right]_0^{\frac{1}{\sqrt a}}=\frac{1}{9\sqrt a}$$
        이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        아랫도형의 넓이는
        $$\int_0^{\frac{1}{\sqrt a}}\left(\frac{2\sqrt a}{3}x+\frac23-\frac43a^{\frac14}\sqrt x\right)dx=\left[\frac13\sqrt a\,x^2+\frac23x-\frac43a^{\frac14}\cdot\frac23x^{\frac32}\right]_0^{\frac{1}{\sqrt a}}=\frac{1}{9\sqrt a}$$
        이다. (공식 해설지의 부정적분 표기 "$4a^{\frac14}\frac23x^{\frac32}$"는 오기)
      criteria: [3.M2]
    - id: 3b-3
      content: |
        따라서 이 접선은 도형 $A$를 $a$의 값에 관계없이 항상 $1:1$의 비율로 나눈다. ■
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 6
      evidence: 윗도형(포물선과 접선 사이)의 넓이 $\dfrac{1}{9\sqrt a}$을 정적분으로 구했다.
      depends_on: []
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 6
      evidence: 아랫도형(접선과 $y=b\sqrt x$ 사이)의 넓이 $\dfrac{1}{9\sqrt a}$을 정적분으로 구했다.
      depends_on: []
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: 두 도형의 넓이가 항상 같음(비 $1:1$, $a$와 무관)을 서술했다.
      depends_on: [3.M1, 3.M2]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5312}
  misconceptions:
  - id: MC-CAL-5312
    outcome_code: '70'
    wrong_work: '아랫도형을 접선과 $x$축 사이 넓이로 잡거나 적분 구간을 $y$축까지가 아닌 교점까지로 잘못 잡음'
    detect_cue: 아랫도형 넓이에 $b\sqrt x$의 적분 항이 없거나 구간 끝이 $\frac{1}{\sqrt a}$이 아님
    feedback: 도형 $A$는 두 곡선과 $y$축으로 둘러싸인 부분입니다. 접선 아래쪽 도형은 접선과 $y=b\sqrt x$ 사이, 구간 $\left[0,\frac{1}{\sqrt a}\right]$입니다.
    remedy: [RL-3]

