stimuli:
- label: 가
  body: |
    (사잇값의 정리) 함수 $f(x)$가 닫힌구간 $[a,\,b]$에서 연속이고 $f(a)\ne f(b)$이면, $f(a)$와 $f(b)$ 사이의 임의의 값 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,\,b)$에 적어도 하나 존재한다.
    [판독확인: 원문 제시문 상자에 (가) 표기 없음]

stem: |
  다음 제시문을 읽고 물음에 답하시오.
  (※) 실수 $a\,(a>1)$에 대하여 양의 실수의 집합에서 정의된 연속함수 $f(x)$가 다음과 같다. (단, $b$, $c$는 양의 실수이다.)
  $$f(x)=\begin{cases}\log_ax & (0<x<2)\\ b^x & (2\le x<4)\\ \log_cx & (x\ge4)\end{cases}$$

subparts:
- id: '1'
  stem: |
    (3-1) $\dfrac{(\log a)^2}{\log c}$의 값을 구하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac12\log2', equivalents: ['(log 2)/2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $b^4=(b^2)^2$이므로 $\log_c4=(\log_a2)^2$.
    steps:
    - {id: 1a, content: '$\dfrac{2\log2}{\log c}=\dfrac{(\log2)^2}{(\log a)^2}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $x=2$와 $x=4$에서 연속 조건을 쓰자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오후 해설(문항카드) p.10 예시답안 (3-1), 채점기준 p.10
    steps:
    - id: 1b-1
      content: |
        연속함수의 정의로부터 $\log_a2=b^2$이고 $\log_c4=b^4$이므로, $(\log_a2)^2=\log_c4$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        로그의 밑 변환에 의해 $\dfrac{(\log2)^2}{(\log a)^2}=\dfrac{2\log2}{\log c}$이므로 $\dfrac{(\log a)^2}{\log c}=\dfrac12\log2$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 연속함수의 정의로부터 $\log_a2=b^2$, $\log_c4=b^4$ 등 $a$, $b$, $c$의 관계를 얻었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: 로그의 성질을 이용하여 값 $\dfrac12\log2$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-5307}
  misconceptions:
  - id: MC-ALG-5307
    outcome_code: '70'
    wrong_work: '$\log_c4=\dfrac{\log c}{\log4}$처럼 밑 변환을 거꾸로 써서 $\dfrac{(\log a)^2}{\log c}$을 잘못 구함'
    detect_cue: 답이 $2\log2$, $\dfrac{1}{2\log2}$ 등
    feedback: '$\log_cx=\dfrac{\log x}{\log c}$입니다(밑이 분모). 변환 후 양변을 정리해 보세요.'
    remedy: [RL-1]
- id: '2'
  stem: |
    (3-2) 방정식 $f(x)=\dfrac12$의 해가 되는 양의 실수 $x$의 값이 $3$개가 되도록 하는 $a$의 값의 범위를 구하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: set, value: '2^{\sqrt2}<a<4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(2)=\log_a2>\frac12$, $f(4)=(\log_a2)^2<\frac12$.
    steps:
    - {id: 2a, content: '$\frac{1}{\sqrt2}>\log_a2>\frac12\iff2^{\sqrt2}<a<4$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - $f$는 $(0,2]$와 $[4,\infty)$에서 증가한다. 해가 세 개이려면 가운데 구간은?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오후 해설(문항카드) p.10 예시답안 (3-2), 채점기준 p.10
    steps:
    - id: 2b-1
      content: |
        $f(x)$는 구간 $(0,2]$와 구간 $[4,\infty)$에서 각각 증가함수이다. 따라서 문제의 조건을 만족하려면 $f(x)$가 닫힌구간 $[2,4]$에서 감소함수여야 하며 그래프의 개형으로부터 $f(2)>\dfrac12$이고 $f(4)<\dfrac12$이어야 한다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $f(2)=\log_a2>\dfrac12$에서 $a<4$, $f(4)=b^4=(\log_a2)^2<\dfrac12$에서 $\log_a2<\dfrac{1}{\sqrt2}$, 즉 $a>2^{\sqrt2}$이다. 이를 만족하는 $a$의 범위는 $2^{\sqrt2}<a<4$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: 그래프의 개형에서 $f(x)$가 닫힌구간 $[2,4]$에서 감소함수이며 $f(2)>\dfrac12$이고 $f(4)<\dfrac12$이어야 한다는 사실을 적었다.
      depends_on: []
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $a$의 범위 $2^{\sqrt2}<a<4$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-5308}
  misconceptions:
  - id: MC-ALG-5308
    outcome_code: '70'
    wrong_work: '$f(2)\ge\frac12$, $f(4)\le\frac12$처럼 등호를 포함해 $2^{\sqrt2}\le a\le4$로 답함'
    detect_cue: 답의 범위에 등호가 있다
    feedback: $f(2)=\frac12$이면 $x=2$에서 두 해가 하나로 합쳐져 해가 2개가 됩니다. 끝값에서 해의 개수를 직접 세어 보세요.
    remedy: [RL-2]
- id: '3'
  stem: |
    (3-3) $f(f(\beta))=f(8)$이고 $f(\beta)\ne8$인 실수 $\beta\,(\beta>1)$가 존재하도록 하는 $a$의 값의 범위를 구하시오. (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: set, value: 'a\ge2\sqrt2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f(x)=f(8)$이 $8$이 아닌 해 $k$를 가지면 사잇값의 정리로 $f(\beta)=k$인 $\beta$가 있으므로, 조건은 「$[2,4]$에서 감소, $f(2)\ge f(8)$」.
    steps:
    - {id: 3a, content: '$\log_a2\ge\log_c8\iff\log c\ge3\log a\iff\log a\ge\frac32\log2$', criteria: [3.M1, 3.R1, 3.R2, 3.A1]}
    hint_ladder:
    - $f(\beta)$를 하나의 값 $k$로 보면 $f(k)=f(8)$이다.
    - $k=8$이면 안 되므로 $f(x)=f(8)$이 다른 해를 가져야 한다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오후 해설(문항카드) p.10 예시답안 (3-3), 채점기준 p.10
    steps:
    - id: 3b-1
      content: |
        방정식 $f(x)=f(8)$의 해가 $x=8$뿐이라면 $f(f(\beta))=f(8)$는 $f(\beta)=8$을 의미하게 되므로 문제의 조건을 만족하지 않기 때문에 방정식 $f(x)=f(8)$은 $x=8$이 아닌 해를 가져야 한다. 그러려면 $f(x)$가 닫힌구간 $[2,4]$에서 감소하여야 한다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        역으로 방정식 $f(x)=f(8)$이 해 $x=k\ (k\ne8)$를 갖는다면, $f(x)$의 그래프의 개형 또는 사잇값의 정리에 의해 $f(x)$의 치역은 실수 전체의 집합이므로 $f(\beta)=k\ (k\ne8)$를 만족하는 $\beta$가 존재한다. 이때 $f(f(\beta))=f(8)$이 성립한다.
      criteria: [3.R2]
    - id: 3b-3
      content: |
        따라서 문제의 조건을 만족하려면 $f(x)$는 닫힌구간 $[2,4]$에서 감소함수이고 $f(2)\ge f(8)$이어야 한다.
      criteria: [3.R1]
    - id: 3b-4
      content: |
        즉, $\log_a2\ge\log_c8$이어야 하는데, 이는 $3\log a\le\log c=\dfrac{2(\log a)^2}{\log2}$, 즉 $\log a\ge\dfrac32\log2$와 동치이므로, 문제의 조건을 만족하는 $a$의 범위는 $a\ge2\sqrt2$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: $f(x)=f(8)\ (x\ne8)$인 $x$가 존재하려면 $f(x)$가 닫힌구간 $[2,4]$에서 감소하여야 한다는 사실을 적었다.
      depends_on: []
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: $f(2)\ge f(8)$이어야 함을 서술했다.
      depends_on: []
      steps: [3b-3]
    - id: 3.R2
      mark_type: R
      points: 5
      evidence: 다른 해 $k$가 $f(x)$의 치역에 있으면(사잇값의 정리 등) $f(\beta)=k$인 $\beta$가 존재해 조건을 만족한다는 사실을 밝혔다.
      depends_on: []
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: $a$의 범위 $a\ge2\sqrt2$를 구했다.
      depends_on: [3.M1, 3.R1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-5309}
  misconceptions:
  - id: MC-ALG-5309
    outcome_code: '70'
    wrong_work: '$f(f(\beta))=f(8)$에서 $f$가 일대일이라고 보고 $f(\beta)=8$만 고려하거나, $f(2)>f(8)$로 등호를 빼 $a>2\sqrt2$로 답함'
    detect_cue: 「해 없음」 또는 답이 $a>2\sqrt2$
    feedback: $f$는 $[2,4]$에서 감소할 수 있어 일대일이 아닙니다. $f(2)=f(8)$이면 $k=2$가 $8$이 아닌 해이므로 등호도 포함됩니다.
    remedy: [RL-3]

