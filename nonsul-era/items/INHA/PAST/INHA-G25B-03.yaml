  materials: ['구간별로 정의된 연속함수 $f(x)=\log_ax\,(0<x<2)$, $b^x\,(2\le x<4)$, $\log_cx\,(x\ge4)$', '방정식 $f(x)=\frac12$의 해의 개수', '합성 방정식 $f(f(\beta))=f(8)$']
  concepts: [함수의 연속, 로그의 성질(밑 변환), 지수·로그함수의 그래프와 증감, 사잇값의 정리]
  tools: [연결점에서 함숫값 일치로 매개변수 관계식, 밑 변환 공식, 구간별 증감과 끝값 비교로 해의 개수, 치역 확인으로 해의 존재]
  conditions:
  - '연속함수 ⇒ $x=2$, $x=4$에서 좌·우 함숫값 일치'
  - '$a>1$ ⇒ $\log_ax$, $\log_cx$ 증가($c>1$), $b^x$의 증감은 $b$와 $1$의 대소'
  - '해가 3개 ⇒ $f$가 $[2,4]$에서 감소, $f(2)>\frac12>f(4)$'
  - '$f(\beta)\ne8$ ⇒ $f(x)=f(8)$이 $x\ne8$인 해를 가져야 함'
  stimuli_used: [가]
  subpart_links: (3-2)·(3-3)은 (3-1)의 $\log c=\dfrac{2(\log a)^2}{\log2}$ 관계 사용

