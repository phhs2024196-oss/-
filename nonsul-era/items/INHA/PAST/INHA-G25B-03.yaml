intent: |
  로그함수와 지수함수의 그래프의 개형을 이해하는지 평가한다. 그리고 연속함수 $f(x)$에 대하여 방정식 $f(x)=c$의 해가 여러 개 존재하는 상황을 이해하고 사잇값의 정리를 사용해서 해의 존재성을 알아낼 수 있는지 평가한다. (3-1) 연속함수 조건으로부터 등식을 세워서 간단한 로그가 포함된 식의 계산을 할 수 있는지, (3-2) 지수함수와 로그함수의 그래프의 개형을 이해하고 있는지, (3-3) 그래프의 개형을 보고 방정식 $f(x)=f(8)$이 해를 여러 개 가지는 조건으로부터 문제의 조건을 만족하는 $a$의 범위를 구할 수 있는지 평가한다.
key_idea: '연속 조건 $\log_a2=b^2$, $\log_c4=b^4$에서 $(\log_a2)^2=\log_c4$. $f$는 $(0,2]$, $[4,\infty)$에서 증가하므로 $[2,4]$에서 감소($b<1$)해야 해가 여러 개 생기고, 조건은 $f(2)$, $f(4)$와 기준값의 대소로 정해진다.'
stuck: (3-3)에서 $f(f(\beta))=f(8)$, $f(\beta)\ne8$을 「방정식 $f(x)=f(8)$이 $8$이 아닌 해 $k$를 갖고 $f(\beta)=k$인 $\beta$가 존재」로 바꾸는 단계
