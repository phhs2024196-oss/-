stimuli:
- label: 가
  body: |
    처음 몇 개의 항과 이웃하는 여러 항 사이의 관계식으로 수열을 정의하는 것을 수열의 귀납적 정의라 한다.
- label: 나
  body: |
    모든 실수 $\alpha$에 대하여 $\cos\alpha=\sin\left(\dfrac{\pi}{2}-\alpha\right)=\sin\left(\dfrac{\pi}{2}+\alpha\right)$이다.

stem: |
  다음 제시문을 읽고 물음에 답하시오.
  (※) 수열 $\{a_n\}$은 다음 조건을 만족한다. (단, $0\le a_1<2\pi$이다.)
  [상자] 자연수 $n$에 대하여 $a_{n+1}$은 방정식 $\sin\left(2x-\dfrac32a_n\right)=\cos\left(x-\dfrac32a_n\right)$을 만족하는 양의 실수 $x$의 값을 작은 것부터 나열했을 때 $(n+1)$번째 값이다.

subparts:
- id: '1'
  stem: |
    $a_1=0$일 때, $a_2$, $a_3$의 값을 구하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: 'a_2=\dfrac{\pi}{2},\ a_3=\dfrac{4\pi}{3}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 해는 ① $\dfrac{\pi}{2}+2k\pi$ 또는 ② $a_n+\dfrac{\pi}{6}+\dfrac{2k\pi}{3}$ 꼴이다.
    steps:
    - {id: 1a, content: '$a_1=0$: $\frac{\pi}{6},\frac{\pi}{2},\frac{5\pi}{6},\cdots$의 2번째 $\frac{\pi}{2}$ / $a_2=\frac{\pi}{2}$: $\frac{\pi}{2},\frac{2\pi}{3},\frac{4\pi}{3},\cdots$의 3번째 $\frac{4\pi}{3}$', criteria: [1.B1, 1.B2]}
    hint_ladder:
    - 제시문 (나)로 우변을 사인으로 바꾸자.
    - $\sin A=\sin B$이면 $A=B+2k\pi$ 또는 $A=\pi-B+2k\pi$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오전(의예) 해설(문항카드) p.20 예시답안 (2-1), 채점기준 p.20
    steps:
    - id: 1b-1
      content: |
        $\sin\left(2x-\dfrac32a_n\right)=\cos\left(2x-\dfrac32a_n-\dfrac{\pi}{2}\right)$이므로 $\sin\left(2x-\dfrac32a_n\right)=\cos\left(x-\dfrac32a_n\right)$이면 $2x-\dfrac32a_n-\dfrac{\pi}{2}=x-\dfrac32a_n+2l\pi$인 정수 $l$이 존재하거나 $2x-\dfrac32a_n-\dfrac{\pi}{2}=2k\pi-\left(x-\dfrac32a_n\right)$인 정수 $k$가 존재한다. 각각의 경우
        $x=\dfrac{\pi}{2},\ \dfrac{\pi}{2}+2\pi,\ \dfrac{\pi}{2}+4\pi,\ \dfrac{\pi}{2}+6\pi,\ \cdots$ ……①
        또는 $x=a_n+\dfrac{\pi}{6},\ a_n+\dfrac{\pi}{6}\pm\dfrac{2\pi}{3},\ a_n+\dfrac{\pi}{6}\pm\dfrac{4\pi}{3},\ a_n+\dfrac{\pi}{6}\pm\dfrac{6\pi}{3},\cdots$ 중 양수인 것이다. ……②
        ①을 만족하는 $x$의 값은 수열의 이전 항의 값에 관계없이 결정되며, ②를 만족하는 $x$의 값은 이전 항의 값에 따라서 달라질 수 있다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        ① 또는 ②를 만족하는 $x$의 값을 작은 것부터 나열해 보면 $a_2$는 $\dfrac{\pi}{6},\dfrac{\pi}{2},\dfrac{5\pi}{6},\cdots$ 중에서 2번째 값인 $\dfrac{\pi}{2}$이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $a_3$은 $\dfrac{\pi}{2},\dfrac{2}{3}\pi,\dfrac43\pi,2\pi,\cdots$ 중에서 3번째 값인 $\dfrac{4\pi}{3}$이다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: $n=1$일 때 조건을 만족하는 $x$의 값($\frac{\pi}{6},\frac{\pi}{2},\frac{5\pi}{6},\cdots$)을 찾아내고 $a_2=\dfrac{\pi}{2}$를 구했다.
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: $n=2$일 때 조건을 만족하는 $x$의 값($\frac{\pi}{2},\frac{2\pi}{3},\frac{4\pi}{3},\cdots$)을 찾아내고 $a_3=\dfrac{4\pi}{3}$을 구했다.
      depends_on: []
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-5306}
  misconceptions:
  - id: MC-ALG-5306
    outcome_code: '70'
    wrong_work: '$\sin A=\cos B$에서 $A=\dfrac{\pi}{2}-B+2k\pi$ 한 가족만 풀어 ①(또는 ②)을 빠뜨리고 $a_2=\dfrac{5\pi}{6}$ 등으로 답함'
    detect_cue: 해의 목록에 $\frac{\pi}{2}+2k\pi$ 꼴 또는 $\frac{2\pi}{3}$ 간격 꼴 중 하나만 있다
    feedback: '$\sin A=\sin B$의 해는 $A=B+2k\pi$와 $A=\pi-B+2k\pi$ 두 가족입니다. 둘 다 구해 합쳐서 나열하세요.'
    remedy: [RL-1]
- id: '2'
  stem: |
    $a_2=a_1+\dfrac{\pi}{6}$가 되기 위한 첫째항 $a_1$의 조건을 구하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: set, value: '\dfrac{\pi}{3}<a_1\le\dfrac{\pi}{2}\ \text{또는}\ a_1=\pi', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a_2$는 ①의 $\dfrac{\pi}{2}$와 ②의 최소해 중 하나이므로, 둘이 다를 때와 같을 때로 나눈다.
    steps:
    - {id: 2a, content: '다를 때 $\frac{\pi}{2}<a_1+\frac{\pi}{6}\le\frac{2\pi}{3}$, 같을 때 $a_1+\frac{\pi}{6}-\frac{2\pi}{3}=\frac{\pi}{2}$', criteria: [2.B1, 2.B2]}
    hint_ladder:
    - ②의 해는 길이 $\frac{2\pi}{3}$인 구간마다 하나씩 있다.
    - ①의 $\frac{\pi}{2}$와 ②의 가장 작은 값이 같으면 어떻게 될까?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오전(의예) 해설(문항카드) p.20~21 예시답안 (2-2), 채점기준 p.20
    steps:
    - id: 2b-1
      content: |
        각각의 $n$에 대하여 ②를 만족하는 $x$는 각각의 구간 $\left(\dfrac{2(m-1)\pi}{3},\dfrac{2m\pi}{3}\right]$에 하나씩 존재한다. $(m=1,2,3,\cdots)$
        (경우 1) $n=1$일 때 ①을 만족하는 값 $\dfrac{\pi}{2}$와 ②를 만족하는 가장 작은 값이 서로 다르면, $a_2$는 이 두 값 중 더 큰 값이다. ②를 만족하는 양수 중 가장 작은 값이 $a_1+\dfrac{\pi}{6}$이 되려면 $a_1+\dfrac{\pi}{6}\le\dfrac{2\pi}{3}$이어야 하고 이 값이 $\dfrac{\pi}{2}$보다 크려면 $\dfrac{\pi}{2}<a_1+\dfrac{\pi}{6}$이어야 한다. 따라서 $\dfrac{\pi}{3}<a_1\le\dfrac{\pi}{2}$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        (경우 2) $n=1$일 때 ①을 만족하는 값 $\dfrac{\pi}{2}$와 ②를 만족하는 가장 작은 값이 같으면, $a_2$는 ②를 만족하는 $x$의 값 중 크기순으로 두 번째의 값이다. 그러므로 $\dfrac{2\pi}{3}<a_2\le\dfrac{4\pi}{3}$이어야 하는데, $a_2=a_1+\dfrac{\pi}{6}$이므로 ②를 만족하는 가장 작은 값은 $a_1+\dfrac{\pi}{6}-\dfrac{2\pi}{3}$이고 이 값이 $\dfrac{\pi}{2}$와 같아야 한다. 따라서 $a_1=\pi$이다.
        그러므로 문제의 조건을 만족하려면 $\dfrac{\pi}{3}<a_1\le\dfrac{\pi}{2}$ 또는 $a_1=\pi$이다.
      criteria: [2.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 6
      evidence: $n=1$일 때 조건을 만족하는 $x$의 값이 $\dfrac{\pi}{2}$보다 작은 경우(①과 ②의 최솟값이 다른 경우)를 분석해 $\dfrac{\pi}{3}<a_1\le\dfrac{\pi}{2}$를 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 4
      evidence: 조건을 만족하는 $x$의 값 중에 가장 작은 값이 $\dfrac{\pi}{2}$인 경우(①과 ②가 겹치는 경우) $a_1=\pi$임을 구했다.
      depends_on: []
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CNT-5301}
  misconceptions:
  - id: MC-CNT-5301
    outcome_code: '70'
    wrong_work: '①과 ②의 해가 같은 값이 되는 경우를 고려하지 않아 $a_1=\pi$를 빠뜨림'
    detect_cue: 답이 $\frac{\pi}{3}<a_1\le\frac{\pi}{2}$뿐
    feedback: 두 해 가족의 값이 겹치면 하나로 세므로 순서가 밀립니다. 겹치는 경우를 따로 조사하세요.
    remedy: [RL-2]
- id: '3'
  stem: |
    $a_2=a_1+\dfrac{\pi}{6}\le\dfrac{2\pi}{3}$일 때, 집합 $\{\sin a_n\mid n=1,2,3,\cdots\}$의 원소의 개수가 될 수 있는 값을 모두 구하시오. (15점)
  points: 15
  depends_on: ['2']
  answer: {kind: set, value: '3,\ 4,\ 5', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\frac{\pi}{3}<a_1<\frac{\pi}{2}$이면 $a_n$은 $a_1,\ a_1+\frac{\pi}{6},\ a_1+\frac{\pi}{3},\ a_1+\frac{7\pi}{6}$에 $2\pi$씩 더해지는 4항 주기라 일반적으로 4개, $a_1=\frac{5\pi}{12}$이면 3개, $a_1=\frac{\pi}{2}$이면 ①·②가 겹쳐 5개.
    steps:
    - {id: 3a, content: '일반 4개 / $\sin\frac{5\pi}{12}=\sin\frac{7\pi}{12}$로 3개 / $a_1=\frac{\pi}{2}$: $\{1,\pm\frac12,\pm\frac{\sqrt3}{2}\}$로 5개', criteria: [3.B1, 3.B2, 3.B3]}
    hint_ladder:
    - $a_3$, $a_4$, $a_5$를 구간 $\left(\frac{2(m-1)\pi}{3},\frac{2m\pi}{3}\right]$을 이용해 구해 보자.
    - $a_1=\frac{\pi}{2}$이면 $a_2=\frac{2\pi}{3}$이고 ①의 값과 ②의 값이 겹친다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오전(의예) 해설(문항카드) p.21~22 예시답안 (2-3), 채점기준 p.20
    steps:
    - id: 3b-1
      content: |
        $\dfrac{\pi}{2}<a_2=a_1+\dfrac{\pi}{6}<\dfrac{2\pi}{3}$인 경우, $a_3$은 ②를 만족하는 값 중 구간 $\left(\dfrac{2\pi}{3},\dfrac{4\pi}{3}\right]$에 있는 것이다. 따라서 $a_3=a_2+\dfrac{\pi}{6}=a_1+\dfrac{\pi}{3}$이다.
        $a_4$는 ②를 만족하는 값 중에 구간 $\left(\dfrac{4\pi}{3},2\pi\right]$에 있는 것이므로 $a_4=\left(a_3+\dfrac{\pi}{6}\right)+\dfrac{2\pi}{3}=a_1+\dfrac{7\pi}{6}$이다.
        $a_5$는 구간 $\left(2\pi,\dfrac{8\pi}{3}\right]$에 있으면서 ②를 만족하는 값 $a_1+2\pi$와 ①을 만족하는 값 $\dfrac{\pi}{2}+2\pi$ 중 작은 값인 $a_1+2\pi$이다. 위 과정을 반복하면 $a_5,a_6,a_7,a_8$은 각각 $a_1,a_2,a_3,a_4$에 각각 $2\pi$씩 더한 값이고 이 규칙성은 4개의 항마다 반복된다.
      criteria: [3.B1]
    - id: 3b-2
      content: |
        따라서 $\{\sin a_n\mid n=1,2,3,\cdots\}=\left\{\sin a_1,\ \sin\left(a_1+\dfrac{\pi}{6}\right),\ \sin\left(a_1+\dfrac{\pi}{3}\right),\ \sin\left(a_1+\dfrac{7\pi}{6}\right)\right\}$이고, $\dfrac{\pi}{3}<a_1<\dfrac{\pi}{2}$일 때 이 집합의 원소의 개수는 일반적으로 4이다.
      criteria: [3.B1]
    - id: 3b-3
      content: |
        $a_1=\dfrac{5\pi}{12}$일 때는 $\sin a_1=\sin\left(a_1+\dfrac{\pi}{6}\right)$이므로 원소의 개수가 3이다.
      criteria: [3.B2]
    - id: 3b-4
      content: |
        $a_1=\dfrac{\pi}{2}$, $a_2=\dfrac{2\pi}{3}$인 경우에는 $a_3=a_2+\dfrac{\pi}{6}=\dfrac{5\pi}{6}$이다. 이 이후의 항은 다음과 같다.
        (i) $n=4m$ ($m$은 자연수) 꼴일 때 $a_n$은 $\left\{\frac{\pi}{3},\frac{\pi}{3}+2\pi,\cdots\right\}\cup\left\{\frac{\pi}{2},\frac{\pi}{2}+2\pi,\cdots\right\}\cup\{\pi,\pi+2\pi,\cdots\}\cup\left\{\frac{5\pi}{3},\frac{5\pi}{3}+2\pi,\cdots\right\}$ 중 $n$번째의 값이며 이 값은 $\frac{5\pi}{3},\frac{5\pi}{3}+2\pi,\frac{5\pi}{3}+4\pi,\cdots$ 중 하나이다.
        (ii) $n=4m+1$ ($m$은 음이 아닌 정수) 꼴일 때 $a_n$은 $\left\{\frac{\pi}{2},\cdots\right\}\cup\left\{\frac{7\pi}{6},\cdots\right\}\cup\left\{\frac{11\pi}{6},\cdots\right\}$ 중 $n$번째 값이며 이 값은 $\frac{\pi}{2},\frac{7\pi}{6}+2\pi,\frac{11\pi}{6}+4\pi,\cdots$ 중 하나이다.
        (iii) $n=4m+2$ ($m$은 음이 아닌 정수) 꼴일 때 $a_n$은 $\left\{\frac{\pi}{2},\cdots\right\}\cup\left\{\frac{2\pi}{3},\cdots\right\}\cup\left\{\frac{4\pi}{3},\cdots\right\}\cup\{2\pi,4\pi,6\pi,\cdots\}$ 중 $n$번째의 값이며 이 값은 $\frac{2\pi}{3},\frac{2\pi}{3}+2\pi,\frac{2\pi}{3}+4\pi,\cdots$ 중 하나이다.
        (iv) $n=4m+3$ ($m$은 음이 아닌 정수) 꼴일 때 $a_n$은 $\left\{\frac{\pi}{6},\cdots\right\}\cup\left\{\frac{\pi}{2},\cdots\right\}\cup\left\{\frac{5\pi}{6},\cdots\right\}\cup\left\{\frac{3\pi}{2},\cdots\right\}$ 중 $n$번째의 값이며 이 값은 $\frac{5\pi}{6},\frac{5\pi}{6}+2\pi,\frac{5\pi}{6}+4\pi,\cdots$ 중 하나이다.
        이때 집합 $\{\sin a_n\mid n=1,2,3,\cdots\}=\left\{\sin\frac{5\pi}{3},\sin\frac{\pi}{2},\sin\frac{7\pi}{6},\sin\frac{11\pi}{6},\sin\frac{2\pi}{3},\sin\frac{5\pi}{6}\right\}=\left\{1,\pm\frac12,\pm\frac{\sqrt3}{2}\right\}$의 원소의 개수는 5이다.
        따라서 이 집합의 원소의 개수가 될 수 있는 값은 $3,4,5$이다.
      criteria: [3.B3]
