intent: |
  삼각함수의 성질 또는 개형을 이해하여 삼각함수로 주어진 문제의 조건을 파악할 수 있는지 평가한다. 또한 귀납적으로 정의된 수열을 계산하여 문제를 해결할 수 있는지 평가한다. (2-1) 수열의 귀납적 정의를 이해하는지, (2-2) 사인함수와 코사인함수의 성질을 이해하는지, (2-3) 귀납적으로 정의된 수열의 성질을 파악하여 문제를 해결할 수 있는지 평가한다.
key_idea: '제시문 (나)로 방정식을 $x=\dfrac{\pi}{2}+2k\pi$(①, 이전 항과 무관) 또는 $x=a_n+\dfrac{\pi}{6}+\dfrac{2k\pi}{3}$(②)로 바꾸면, ②의 해는 구간 $\left(\dfrac{2(m-1)\pi}{3},\dfrac{2m\pi}{3}\right]$마다 하나씩 있어 $a_{n+1}$이 어느 구간에 있는지로 수열이 결정된다.'
stuck: (2-2)에서 ①의 값 $\dfrac{\pi}{2}$와 ②의 가장 작은 값이 같은 경우($a_1=\pi$)를 따로 보는 단계, (2-3)에서 $a_1=\dfrac{\pi}{2}$일 때 ①·② 값이 겹쳐 순서가 밀리는 특수 경우와 $a_1=\dfrac{5\pi}{12}$에서 사인값이 겹치는 경우를 찾는 단계
idea_tags: [IDEA-TRIG-EQ-TWO-FAMILIES, IDEA-RECURSIVE-PERIODIC-BLOCK, IDEA-CASE-COINCIDENT-ROOTS]
tags: [인하대 기출, 2025 의예과, 삼각방정식, 귀납적 정의, 경우 분류]
elements:
  materials: ['삼각방정식 $\sin\left(2x-\frac32a_n\right)=\cos\left(x-\frac32a_n\right)$의 양의 해', '해를 작은 순서로 나열한 $(n+1)$번째 값으로 정의된 수열', '집합 $\{\sin a_n\}$의 원소의 개수']
  concepts: ['삼각함수의 성질($\cos\alpha=\sin(\frac{\pi}{2}\pm\alpha)$)', 삼각방정식의 일반해, 수열의 귀납적 정의, 경우 분류]
  tools: ['제시문 (나)로 코사인을 사인으로 바꿔 두 해 가족 ①·② 도출', '②의 해가 길이 $\frac{2\pi}{3}$ 구간마다 하나임을 이용', 첫째항 범위에 따른 경우 분류, 4항 주기(2π 증가) 규칙 발견, 사인값 일치 조건 확인]
  conditions:
  - '$0\le a_1<2\pi$ ⇒ ②의 가장 작은 양수 해의 위치로 $a_2$ 결정'
  - '$a_2=a_1+\dfrac{\pi}{6}$ ⇒ ②의 최소해가 $a_1+\dfrac{\pi}{6}$이고 그것이 2번째 값'
  - '$a_2\le\dfrac{2\pi}{3}$ ⇒ (2-2)의 경우 중 $\dfrac{\pi}{3}<a_1\le\dfrac{\pi}{2}$만 남음'
  - '①과 ②의 값이 같으면 한 개의 값으로 셈 ⇒ 순서가 밀리는 특수 경우 발생'
  stimuli_used: [가, 나]
  subpart_links: (2-2)는 (2-1)에서 얻은 두 해 가족 ①·② 사용, (2-3)은 (2-2)의 첫째항 조건을 출발점으로 사용

