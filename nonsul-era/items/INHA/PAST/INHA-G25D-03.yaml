    remedy: [RL-3]
- id: '3'
  stem: |
    (3-3) 다음 세 조건을 모두 만족하는 집합 $S$의 개수를 구하시오. (10점)
    (i) $S\subset\{1,2,3,\cdots,2024\}$
    (ii) $n(S)=202$
    (iii) $\sigma(S)=10100$
  points: 10
  depends_on: [2b, 2c]
  answer: {kind: value, value: '19', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $10100=100^2+100$이므로 최대 원소를 뺀 201원소 집합이 극값 $100^2$을 가져 $\{d,\cdots,201d\}$꼴이고, 최대 원소는 $202d$ 또는 $203d$.
    steps:
    - {id: 3a, content: '$202d\le2024\Rightarrow d\le10$, $203d\le2024\Rightarrow d\le9$, 합 $19$', criteria: [3.R1, 3.B1]}
    hint_ladder:
    - $10100$을 $100^2$과 비교해 보자.
    - (3-2)(c)에서 $1\in S$ 조건이 없으면 어떤 집합이 가능할까?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2025 자연오전(의예) 해설(문항카드) p.26 예시답안 (3-3), 채점기준 p.25
    steps:
    - id: 3b-1
      content: |
        $S$의 원소를 크기순으로 $a_1<a_2<\cdots<a_{202}$라 하고 $S'=S-\{a_{202}\}$라 하자. $n(S')=201$이므로 (3-2)(b)에 의하여 $\sigma(S')\le100^2$이다.
        한편 $100\ge\sigma(S)-\sigma(S')=(100^2+100)-\sigma(S')\ge(100^2+100)-100^2=100$이므로 $100=\sigma(S)-\sigma(S')$이고 $\sigma(S')=100^2$이어야 한다.
      criteria: [3.R1]
    - id: 3b-2
      content: |
        $100=\sigma(S)-\sigma(S')$에서 $a+b=a_{202}$를 만족하는 $S$의 원소 $a,b\,(a<b)$의 순서쌍 $(a,b)$의 개수가 정확히 $100$개라는 것을 알 수 있다. 또한, $\sigma(S')=100^2$이므로 (3-2)(c)와 같은 방법으로 $S'$은 반드시 $\{d,2d,\cdots,201d\}$꼴, 즉 $a_k=dk\ (k=1,2,\cdots,201)$인 자연수 $d$가 존재함을 알 수 있다. 한편 $a+b=a_{202}$를 만족하는 순서쌍 $(a,b)$의 개수가 정확히 $100$개이기 위해서는 $a_{202}=202d$ 또는 $203d$이어야 한다. 그러므로 $S=\{d,2d,\cdots,201d,202d\}$ 또는 $\{d,2d,\cdots,201d,203d\}$꼴이다.
      criteria: [3.R1]
    - id: 3b-3
      content: |
        전자의 경우 가능한 $S$의 개수는 $10$, 후자의 경우 가능한 $S$의 개수는 $9$이므로 가능한 $S$의 개수는 총 $19$이다.
      criteria: [3.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.R1
      mark_type: R
      points: 7
      evidence: $S$가 $\{d,2d,\cdots,201d,202d\}$ 또는 $\{d,2d,\cdots,201d,203d\}$ 두 가지 형태뿐임을 증명했다.
