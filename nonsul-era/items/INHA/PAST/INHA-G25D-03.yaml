intent: |
  주어진 상황을 논리적으로 해석하고 수학적 귀납법을 이용하여 명제를 증명할 수 있는지 평가한다. (3-1) 주어진 조건을 이해하는지, (3-2) 수학적 귀납법을 이용하여 명제를 증명할 수 있는지, (3-3) 등차수열의 성질을 주어진 조건에 적용하여 문제를 해결할 수 있는지 평가한다.
key_idea: '가장 큰 두 원소를 합으로 갖는 쌍은 최대 $2n-1$개이므로 원소를 둘씩 늘릴 때 $\sigma$의 증가는 $2k-1$ 이하이고 $\sigma(S)\le n^2$. 등호 조건을 가장 큰 두 원소를 뺀 집합에 넘겨 귀납법으로 $S=\{1,\cdots,2n+1\}$을 얻는다.'
stuck: (3-2)(c)에서 $S'=S-\{x,y\}$에 대해 $\sigma(S')=(n-1)^2$을 (a)·(b)로 끌어내 귀납 가정을 적용하는 단계, (3-3)에서 $10100=100^2+100$을 (3-2)의 상황(원소 201개 + 하나)으로 읽어 내는 단계
idea_tags: [IDEA-INDUCTION-REMOVE-TOP-TWO, IDEA-TELESCOPE-INCREMENT-BOUND, IDEA-EXTREMAL-STRUCTURE-AP]
tags: [인하대 기출, 2025 의예과, 수학적 귀납법, 집합, 등차수열, 극값 구조]
elements:
  materials: ['자연수 유한집합 $S$에서 $a+b=c$인 세 원소 $(a<b<c)$의 개수 $\sigma(S)$', '원소 $2n+1$개 집합의 $\sigma$ 최댓값', '$\{1,\cdots,2024\}$의 202원소 부분집합 중 $\sigma=10100$']
  concepts: [집합의 표현, 수학적 귀납법, 등차수열, 경우의 수(순서쌍 세기)]
  tools: [합이 $c$인 쌍의 개수 세기, 원소를 크기순으로 쌓으며 증가분 상한 합(망원합), 가장 큰 두 원소 제거 후 귀납 가정 적용, 극값 등호 조건 추적, 등차수열 꼴의 배수 구조]
  conditions:
  - '$a<b<c$, $a+b=c$ ⇒ 고정된 $c$에 대해 쌍 $(a,b)$의 개수는 $c$보다 작은 원소 수의 절반 이하'
  - '$n(S)\le2$ ⇒ $\sigma(S)=0$ (귀납의 출발)'
  - '$1\in S$ ⇒ 등차수열 $\{d,2d,\cdots\}$에서 $d=1$로 고정'
  - '$n(S)=202$, $\sigma(S)=10100=100^2+100$ ⇒ 최대 원소를 뺀 $S''$은 $\sigma(S'')=100^2$인 극값 집합'
  stimuli_used: [가]
  subpart_links: '(3-2)(b)는 (a)의 상한 사용, (3-2)(c)는 (a)·(b)와 귀납법 사용, (3-3)은 (3-2)(b)·(c)의 극값 구조를 배수꼴로 확장해 사용'

