    outcome_code: '70'
    wrong_work: '$S''$에 귀납 가정을 적용하면서 $\sigma(S'')=(n-1)^2$(최댓값 유지)을 보이지 않음'
    detect_cue: '$S''$이 $\{1,\cdots,2n-1\}$이라고 바로 단정, $\sigma(S'')$에 대한 부등식이 없다'
