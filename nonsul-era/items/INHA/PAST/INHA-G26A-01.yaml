stimuli:
- label: 가
  body: |
    (가) 음이 아닌 두 실수 $a$, $b$에 대하여
    $$\dfrac{a+b}{2}\ge\sqrt{ab}\ \text{(단, 등호는 } a=b\text{일 때 성립)}$$
- label: 나
  body: |
    (나) $f(x)$는 닫힌구간 $[a,b]$에서 정의된 상수함수가 아닌 연속함수이고, 이 구간의 모든 실수 $x$에 대하여 $f(x)\ge0$이면 $\displaystyle\int_a^b f(x)\,dx$는 도형의 넓이이므로 $\displaystyle\int_a^b f(x)\,dx>0$이다.

stem: |
  [문제 1] (30점) 다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    (1-1) 구간 $[-1,1]$에서 정의된 연속함수 $f(x)$가
    $$\int_{-1}^{1}\left\{2(f(x))^2+\sin^2\pi x\right\}dx=2$$
    를 만족한다. 정적분 $\displaystyle\int_{-1}^{1}f(x)|\sin\pi x|\,dx$의 값이 최대일 때, 함수 $f(x)$와 이 정적분의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: 'f(x)=\dfrac{|\sin\pi x|}{\sqrt2},\ \text{최댓값 }\dfrac{\sqrt2}{2}', equivalents: ['f(x)=|\sin\pi x|/\sqrt2, 1/\sqrt2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$2f^2+\sin^2\pi x\ge2\sqrt2|f||\sin\pi x|\ge2\sqrt2 f|\sin\pi x|$를 적분하면 상한 $\frac{\sqrt2}{2}$, 등호는 $\sqrt2 f=|\sin\pi x|$.'
    steps:
    - {id: 1a, content: '$2\ge2\sqrt2\int_{-1}^1 f|\sin\pi x|dx$, 등호 $\iff\int(\sqrt2f-|\sin\pi x|)^2dx=0$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 피적분함수의 두 항에 산술·기하평균을 적용해 보자.
    - 등호가 성립하면 두 적분의 차를 완전제곱식의 적분으로 쓸 수 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오전 문항카드 p.3 예시답안(1-1), 채점기준 p.3
    steps:
    - id: 1b-1
      content: |
        제시문 (가)에 의해
        $2=\displaystyle\int_{-1}^{1}\{2(f(x))^2+\sin^2\pi x\}dx\ge\int_{-1}^{1}2|\sqrt2 f(x)\sin\pi x|dx\ge\int_{-1}^{1}2\sqrt2 f(x)|\sin\pi x|dx$
        이다. 따라서 $\displaystyle\int_{-1}^{1}f(x)|\sin\pi x|dx\le\dfrac{1}{\sqrt2}=\dfrac{\sqrt2}{2}$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $|\sqrt2 f(x)|=|\sin\pi x|$이면 첫 번째 부등식에서, $|f(x)|=f(x)$이면 두 번째 부등식에서 등호가 성립한다. 역으로 등호가 성립하면
        $0=\displaystyle\int_{-1}^{1}\{2(f(x))^2+\sin^2\pi x\}dx-\int_{-1}^{1}2\sqrt2 f(x)|\sin\pi x|dx=\int_{-1}^{1}(\sqrt2 f(x)-|\sin\pi x|)^2dx$.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        제시문 (나)에 의해 연속함수 $(\sqrt2 f(x)-|\sin\pi x|)^2$은 구간 $[-1,1]$에서 상수이어야 하고 또한 $0$이어야 하므로 $\sqrt2 f(x)=|\sin\pi x|$.
        따라서 $f(x)=\dfrac{|\sin\pi x|}{\sqrt2}$이고 구하는 적분의 최댓값은 $\dfrac{\sqrt2}{2}$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: |
        (공식) $f(x)$가 양수일 때, 산술평균과 기하평균의 관계를 이용하여 적분값(최댓값 $\frac{\sqrt2}{2}$)을 구하였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        등호 조건을 완전제곱식의 적분이 0인 것으로 바꾸어 제시문 (나)로 해석하였다(공식 '등호 조건을 만족하는 함수를 정확히 구하면 8점'의 일부, 3점/5점 분할은 자체 배분).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $f(x)=\dfrac{|\sin\pi x|}{\sqrt2}$를 정확히 구하였다.
      depends_on: [1.R1]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 절댓값을 제대로 처리하지 못함(공식 채점기준)
      effect: minus
      value: 3
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5401}
  misconceptions:
  - id: MC-CAL-5401
    outcome_code: '70'
    wrong_work: '$f(x)=\dfrac{\sin\pi x}{\sqrt2}$ (절댓값 누락)로 답함'
    detect_cue: 답의 $f(x)$에 절댓값이 없다
    feedback: 등호 조건은 $\sqrt2|f|=|\sin\pi x|$이고, 최대가 되려면 $f\ge0$이어야 합니다. 부호를 따로 확인하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    (1-2) 실수 전체의 집합에서 미분가능하고 도함수가 연속인 함수 $f(x)$는 다음 조건을 만족한다.
    (ⅰ) 모든 실수 $x$에 대하여 $f'(x)f(x)<0$이다.
    (ⅱ) $f(0)=\dfrac{1}{\sqrt2}$, $f(2)=\dfrac{1}{\sqrt2\,e^2}$
    정적분
    $$\int_0^2\left\{\left(2e^xf'(x)\right)^2+\dfrac{1}{\left(e^xf(x)\right)^2}\right\}dx$$
    의 값이 최소가 될 때, $f(1)$과 이 정적분의 값을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: 'f(1)=\dfrac{1}{\sqrt2\,e},\ \text{최솟값 }8', equivalents: ['f(1)=\dfrac{\sqrt2}{2e}, 8'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '산술·기하평균으로 피적분함수 $\ge4|f''/f|=-4f''/f$, 적분하면 $-4[\ln f]_0^2=8$. 등호 $-2f''f=e^{-2x}$에서 $f=\frac{e^{-x}}{\sqrt2}$.'
    steps:
    - {id: 2a, content: '$(f^2)''=-e^{-2x}$, $f(0)^2=\frac12$ ⇒ $f^2=\frac{e^{-2x}}2$', criteria: [2.R1, 2.A1]}
    hint_ladder:
    - 두 항의 곱이 $e^x$를 지운다.
    - '$\frac{f''}{f}$의 적분은 로그이다.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오전 문항카드 p.3~4 예시답안(1-2), 채점기준 p.3
    steps:
    - id: 2b-1
      content: |
        제시문 (가)와 치환적분 및 조건 (ⅰ), (ⅱ)에 의해
        $\displaystyle\int_0^2\left\{(2e^xf'(x))^2+\dfrac{1}{(e^xf(x))^2}\right\}dx\ge\int_0^2 4\left|\dfrac{f'(x)}{f(x)}\right|dx=-4\int_0^2\dfrac{f'(x)}{f(x)}dx=-4[\ln f(x)]_0^2=8$
        이 성립한다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        등호가 성립할 때는 구간 $[0,2]$에서 $|2f'(x)f(x)|=e^{-2x}$가 성립할 때이고, 정적분의 최솟값은 $8$이다. 조건 (ⅰ)에 의해 $-2f'(x)f(x)=e^{-2x}$이다.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        따라서 구간 $[0,2]$에서 $\left((f(x))^2-\dfrac{e^{-2x}}{2}\right)'=0$이다. 조건 (ⅱ) 및 정적분과 부정적분의 관계로부터 $0\le x\le2$에서
        $(f(x))^2-\dfrac{e^{-2x}}{2}=\displaystyle\int_0^x0\,dx=0$이고 $f(x)>0$이므로 $f(x)=\dfrac{e^{-x}}{\sqrt2}$ $(0\le x\le2)$.
      criteria: [2.A1]
    - id: 2b-4
      content: |
        이 함수가 등호 조건을 만족하는 유일한 함수임을 보이자. 등호 조건으로부터
        $0=\displaystyle\int_0^2\left\{(2e^xf')^2+\dfrac{1}{(e^xf)^2}\right\}dx-\int_0^24\left|\dfrac{f'}{f}\right|dx=\int_0^2\left(|2e^xf'(x)|-\left|\dfrac{1}{e^xf(x)}\right|\right)^2dx$
        이므로 제시문 (나)에 의해 $|2e^xf'(x)|-\left|\dfrac{1}{e^xf(x)}\right|=0$이고, 이를 정리하면 위의 조건을 만족하는 함수는 유일하다. 따라서 $f(1)=\dfrac{1}{\sqrt2\,e}$이고 정적분의 값은 $8$이다.
      criteria: [2.R1, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        (공식) 산술평균과 기하평균의 관계 및 치환적분법을 이용하여 최소가 되는 적분값 8을 정확히 구하였다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: |
        (공식) 등호 조건을 정확히 해석하였다(절댓값 처리 포함): $-2f'(x)f(x)=e^{-2x}$.
      depends_on: [2.M1]
      steps: [2b-2, 2b-4]
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: |
        (공식) 적분값이 최소가 되는 $f(x)=\dfrac{e^{-x}}{\sqrt2}$를 정확히 구하고 $f(1)=\dfrac{1}{\sqrt2e}$를 적었다.
      depends_on: [2.R1]
      steps: [2b-3, 2b-4]
    deductions:
    - code: D2-1
      condition: 조건 (ⅰ)을 이용하여 절댓값을 처리하는 것을 잊음(공식 채점기준)
      effect: minus
      value: 3
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5402}
  misconceptions:
  - id: MC-CAL-5402
    outcome_code: '70'
    wrong_work: '$\int_0^2 4\dfrac{f''}{f}dx=4[\ln f]_0^2=-8$로 두어 최솟값을 $-8$ 또는 음수로 씀'
    detect_cue: 최솟값이 음수이거나 $|f'/f|$의 절댓값을 조건 (ⅰ)로 처리하지 않음
    feedback: 기하평균은 $4|f'/f|$입니다. 조건 (ⅰ) $f'f<0$에서 $|f'/f|=-f'/f$로 바꾸세요.
    remedy: [RL-2]

