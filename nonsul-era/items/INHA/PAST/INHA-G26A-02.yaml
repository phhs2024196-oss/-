stimuli:
- label: 가
  body: |
    함수 $f(x)$에 대하여 좌극한 $\displaystyle\lim_{x\to a-}\dfrac{f(x)-f(a)}{x-a}$와 우극한 $\displaystyle\lim_{x\to a+}\dfrac{f(x)-f(a)}{x-a}$가 각각 존재하고, 그 값이 서로 같다면 $f(x)$는 $x=a$에서 미분가능하다고 한다.

stem: |
  [문제 2] (35점) 다음 제시문을 읽고 물음에 답하시오.
  (※) 다항함수 $f(x)$는 $f(2)=4$를 만족하고, 함수 $g(x)$는 다음과 같다.
  $$g(x)=\begin{cases}|x+1| & (x\le0)\\[2pt] \dfrac{1}{x} & (0<x\le1)\\[2pt] x & (x>1)\end{cases}$$

subparts:
- id: '1'
  stem: |
    (2-1) 함수 $f(x)g(x)$가 실수 전체의 집합에서 연속이 되도록 하는 $f(x)$ 중 차수가 최소인 것을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'f(x)=x^2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$x=0$에서만 문제: 좌극한 $f(0)$, 우극한 $\lim f(x)/x$ ⇒ $x^2\mid f$, $f(2)=4$면 $x^2$.'
    steps:
    - {id: 1a, content: '$f=x^nh$, $n\ge2$ ⇒ 최소 $f(x)=x^2$', criteria: [1.B1, 1.A1]}
    hint_ladder:
    - $g$가 불연속인 점은 어디인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오전 문항카드 p.7 예시답안(2-1), 채점기준 p.7
    steps:
    - id: 1b-1
      content: |
        $g(x)$는 $x\ne0$일 때 연속이다. 따라서 임의의 다항식 $f(x)$에 대해서 $f(x)g(x)$는 $x\ne0$에서 연속이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        만일 $f(0)\ne0$이고 $f(x)g(x)$가 $x=0$에서 연속이면
        $\displaystyle\lim_{x\to0-}g(x)=\dfrac{\lim_{x\to0-}f(x)g(x)}{\lim_{x\to0-}f(x)}=\dfrac{\lim_{x\to0+}f(x)g(x)}{\lim_{x\to0+}f(x)}=\lim_{x\to0+}g(x)$
        가 되어 $g(x)$가 $x=0$에서 연속임을 의미하므로 $f(0)=0$이어야 한다. 그러므로 $f(x)=x^nh(x)$ ($n\ge1$, $h(0)\ne0$인 다항식)의 형태이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $f(x)g(x)$가 $x=0$에서 연속이므로
        $\displaystyle\lim_{x\to0-}f(x)g(x)=\lim_{x\to0-}x^n(x+1)h(x)=0=\lim_{x\to0+}x^{n-1}h(x)=\lim_{x\to0+}f(x)g(x)$
        이다. 따라서 $n\ge2$이고 $f(x)$의 차수는 2 이상이다. $f(x)=x^2$이 $f(2)=4$와 문제의 조건을 만족하므로 이 함수가 구하려는 다항함수이다.
      criteria: [1.M1, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: (공식) $g(x)$가 $x=0$에서만 불연속임을 확인하였다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: (공식) $f(x)$를 구하였다($f(0)=0$, $x^2\mid f$ 조건 도출 포함).
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: (공식) 구한 $f(x)=x^2$의 차수가 최소이고 $f(x)g(x)$가 연속임을 확인하였다.
      depends_on: [1.M1]
      steps: [1b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5403}
  misconceptions:
  - id: MC-CAL-5403
    outcome_code: '70'
    wrong_work: '$f(0)=0$만으로 충분하다고 보고 $f(x)=2x$ (1차)를 답함'
    detect_cue: 답이 1차식이거나 $\lim_{x\to0+}f(x)/x$를 확인하지 않음
    feedback: '$x\to0+$에서 $f(x)g(x)=f(x)/x\to f''(0)$입니다. 이것이 왼쪽 값 0과 같아야 하므로 $x^2$이 인수여야 합니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    (2-2) 함수 $f(x)g(x)$가 실수 전체의 집합에서 미분가능하도록 하는 $f(x)$ 중 차수가 최소인 것을 구하시오. [15점]
  points: 15
  depends_on: ['1']
  answer: {kind: expression, value: 'f(x)=\dfrac16x^3(x-1)(x+1)', equivalents: ['\dfrac{x^5-x^3}{6}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$g$의 미분불가능점 $-1,0,1$: $x=\pm1$에서는 $f(\pm1)=0$, $x=0$에서는 $\lim f(x)/x^2=0$ ⇒ $x^3(x-1)(x+1)\mid f$.'
    steps:
    - {id: 2a, content: '$f=\frac16x^3(x-1)(x+1)$ ($f(2)=4$)', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - $g$가 미분가능하지 않은 점을 모두 찾자. $|x+1|$도 잊지 말자.
    - '$f(1)\ne0$이면 $g=\frac{fg}{f}$가 $x=1$에서 미분가능해져 모순이다.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오전 문항카드 p.7~8 예시답안(2-2), 채점기준 p.7
    steps:
    - id: 2b-1
      content: |
        $g(x)$는 $x=-1,0,1$ 이외의 모든 실수에서 미분가능하다. 임의의 다항함수 $f(x)$에 대하여 $f(x)g(x)$는 $x=-1,0,1$ 이외의 실수에서 미분가능하다. (2-1)로부터 $f(0)=0$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        $f(1)\ne0$이라고 가정하자. $f(x)g(x)$가 $x=1$에서 미분가능하므로
        $\displaystyle\lim_{x\to1-}\dfrac{g(x)-g(1)}{x-1}=\lim_{x\to1-}\left(\dfrac{f(x)g(x)-f(1)g(1)}{f(x)(x-1)}-\dfrac{f(x)g(1)-f(1)g(1)}{f(x)(x-1)}\right)=\lim_{x\to1-}\dfrac{f(x)g(x)-f(1)g(1)}{f(x)(x-1)}-\dfrac{f'(1)g(1)}{f(1)}$
        $\displaystyle=\lim_{x\to1+}\dfrac{f(x)g(x)-f(1)g(1)}{f(x)(x-1)}-\dfrac{f'(1)g(1)}{f(1)}=\lim_{x\to1+}\dfrac{g(x)-g(1)}{x-1}$
        이다. 따라서 제시문에 의하여 $g(x)$가 $x=1$에서 미분가능하므로 모순이다. 그러므로 $f(1)=0$이고 마찬가지 방법으로 $f(-1)=0$이다.
        따라서 $f(x)=x^a(x-1)^b(x+1)^ch(x)$ ($a,b,c\ge1$, $h(x)$는 $h(-1)h(0)h(1)\ne0$인 다항함수)이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        (ⅰ) $x=-1$에서 미분가능할 필요충분조건은 제시문에 의하여
        $\displaystyle\lim_{x\to-1-}\dfrac{f(x)g(x)-f(-1)g(-1)}{x+1}=-f(-1)$, $\displaystyle\lim_{x\to-1+}\dfrac{f(x)g(x)-f(-1)g(-1)}{x+1}=f(-1)$
        두 극한값이 같은 것이다. 따라서 필요충분조건은 $c\ge1$이다.
        (ⅱ) $x=0$에서 미분가능한 함수는 연속이므로 (2-1)로부터 $a\ge2$이다. 따라서
        $\displaystyle\lim_{x\to0-}\dfrac{f(x)g(x)-f(0)g(0)}{x}=0$, $\displaystyle\lim_{x\to0+}\dfrac{f(x)g(x)-f(0)g(0)}{x}=\lim_{x\to0+}\dfrac{f(x)g(x)}{x}=\lim_{x\to0+}x^{a-2}(x-1)^b(x+1)^ch(x)$
        이다. 제시문에 의하여 두 값이 같아야 하므로 필요충분조건은 $a\ge3$이다.
        (ⅲ) $x=1$에서 미분가능할 필요충분조건은
        $\displaystyle\lim_{x\to1-}\dfrac{f(x)g(x)-f(1)g(1)}{x-1}=\lim_{x\to1-}x^{2}(x-1)^{b-1}(x+1)h(x)$, $\displaystyle\lim_{x\to1+}\dfrac{f(x)g(x)-f(1)g(1)}{x-1}=\lim_{x\to1+}x^{4}(x-1)^{b-1}(x+1)h(x)$
        두 극한값이 같은 것이다. 따라서 필요충분조건은 $b\ge1$이다. [판독확인: 원문 예시답안의 지수 $x^2$, $x^4$는 $a=3$을 대입한 표기로 보임 — 원문 그대로]
      criteria: [2.R1]
    - id: 2b-4
      content: |
        그러므로 주어진 조건 $f(2)=4$를 만족하는 다항함수 $f(x)$는 $h(x)=\dfrac16$일 때 $f(x)=\dfrac16x^3(x-1)(x+1)$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: (공식) $g(x)$가 $x=-1,0,1$에서만 미분가능하지 않음을 확인하였다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: (공식) $f(x)$를 구하였다($f(\pm1)=0$, $x^3$ 인수 조건).
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2b-4]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: |
        각 점에서 좌·우 미분계수를 비교해 지수 조건이 필요충분임을 밝혔다(공식 '차수가 최소이고 미분가능함을 확인 7점'의 일부, 4점/3점 분할은 자체 배분).
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $f(x)=\dfrac16x^3(x-1)(x+1)$이 차수 최소이고 $f(x)g(x)$가 미분가능함을 확인하였다.
      depends_on: [2.R1]
      steps: [2b-4]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5404}
  misconceptions:
  - id: MC-CAL-5404
    outcome_code: '70'
    wrong_work: '$x=-1$의 꺾인 점($|x+1|$)을 놓쳐 $f(x)=\dfrac12x^3(x-1)$ (4차)를 답함'
    detect_cue: 답에 $(x+1)$ 인수가 없다
    feedback: 절댓값 함수의 꺾인 점도 미분불가능점입니다. $g$의 모든 미분불가능점을 먼저 나열하세요.
    remedy: [RL-2]
- id: '3'
  stem: |
    (2-3) (2-2)에서 구한 함수 $f(x)$에 대하여 다음 세 극한값을 구하시오. [10점]
    $$\lim_{x\to1-}(f(x)g(x))',\qquad \lim_{x\to1+}(f(x)g(x))',\qquad \lim_{x\to\infty}\dfrac{\ln(1+|f(x)|)}{\ln x}$$
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '\dfrac13,\ \dfrac13,\ 5', equivalents: ['1/3, 1/3, 5'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$x=1$ 근처 $fg=\frac16x^2(x^2-1)$ / $\frac16x^4(x^2-1)$를 미분, 로그 극한은 최고차 $x^5$.'
    steps:
    - {id: 3a, content: '$\frac13$, $\frac13$, $5$', criteria: [3.A1, 3.A2, 3.A3]}
    hint_ladder:
    - 로그 안에서 $x^5$을 묶어 내자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오전 문항카드 p.8 예시답안(2-3), 채점기준 p.7
    steps:
    - id: 3b-1
      content: |
        $x=1$ 근처에서 $f(x)g(x)=\begin{cases}\frac16x^2(x^2-1) & (0<x\le1)\\ \frac16x^4(x^2-1) & (x>1)\end{cases}$ 이다. 따라서
        $\displaystyle\lim_{x\to1-}(f(x)g(x))'=\lim_{x\to1-}\left\{\frac13x(x^2-1)+\frac13x^3\right\}=\frac13$,
        $\displaystyle\lim_{x\to1+}(f(x)g(x))'=\lim_{x\to1+}\left\{\frac23x^3(x^2-1)+\frac13x^5\right\}=\frac13$.
      criteria: [3.A1, 3.A2]
    - id: 3b-2
      content: |
        $f(x)=\frac16x^3(x-1)(x+1)$이므로
        $\displaystyle\lim_{x\to\infty}\dfrac{\ln(1+|f(x)|)}{\ln x}=\lim_{x\to\infty}\dfrac{5\ln x+\ln\left(\frac{1}{x^5}+\left|\frac16\left(1-\frac{1}{x^2}\right)\right|\right)}{\ln x}=5$.
      criteria: [3.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.A1
      mark_type: B
      points: 3
      evidence: (공식) $\lim_{x\to1-}(f(x)g(x))'=\frac13$을 구하였다.
      depends_on: []
      steps: [3b-1]
    - id: 3.A2
      mark_type: B
      points: 3
      evidence: (공식) $\lim_{x\to1+}(f(x)g(x))'=\frac13$을 구하였다.
      depends_on: []
      steps: [3b-1]
    - id: 3.A3
      mark_type: B
      points: 4
      evidence: (공식) $\lim_{x\to\infty}\frac{\ln(1+|f(x)|)}{\ln x}=5$를 구하였다.
      depends_on: []
