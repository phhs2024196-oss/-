intent: |
  함수의 극값을 이해하고, 삼각함수의 도함수를 구할 수 있는지 평가한다. 수열의 극한값을 구할 수 있는지 평가한다.
  (1-1) 함수의 극값을 이해하고, 삼각함수의 도함수와 함수의 곱의 미분법을 활용하여 주어진 함수를 미분할 수 있는지 평가한다. 수열의 극한값을 구할 수 있는지 평가한다.
  (1-2) 무리수 $e$의 정의를 활용하여 수열의 극한값을 구할 수 있는지 평가한다.
key_idea: '$f''(x)=\sin^{n-1}x\{(n+1)\cos^2x-1\}$에서 $\cos^2a_n=\frac1{n+1}$, $\tan a_n=\sqrt n$; $b_n$은 $\left(1+\frac1n\right)^{-n/2}$ 꼴로 정리한다.'
stuck: '$(1+\sqrt n)b_n$을 $\left\{\left(1+\frac1n\right)^n\right\}^{-1/2}$과 나머지의 곱으로 바꾸는 단계'
