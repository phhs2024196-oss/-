intent: |
  (2-1) 도형의 길이, 넓이 등을 좌표평면을 활용하여 계산하고 분석할 수 있는지 평가한다.
  (2-2) (2-1)에서 구한 결과에 넓이가 1이라는 조건을 반영하여 정사각형의 넓이를 함수로 표현할 수 있는지 평가한다. 또한, 함수의 극댓값을 계산할 수 있는지 평가한다.
  (2-3) 도형의 닮음을 이용하여 넓이를 구하고, 식 변형을 통하여 극댓값을 간단히 구할 수 있는지 평가한다.
key_idea: '내접 정사각형 한 변 $\frac{a(b+c)}{a+b+c}$에 $a=\frac2x$ ($x=BC$)를 넣으면 $\frac{2x}{x^2+2}$, 닮음비로 작은 정사각형 한 변을 구하고 $y=x^2$으로 치환해 최대화한다.'
stuck: (2-3)에서 삼각형 $APQ$가 $ABC$와 닮음이고 그 안의 정사각형 $XYZW$가 같은 비율로 줄어든다는 관찰
