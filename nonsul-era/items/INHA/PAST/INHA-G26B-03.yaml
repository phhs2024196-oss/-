intent: |
  삼각함수의 공식과 정적분의 치환적분법을 이해하고, 정적분의 값을 계산할 수 있는지 평가한다. 함수의 극한값을 구할 수 있는지 평가한다.
  (3-1) 삼각함수의 공식을 활용하여 정적분의 값을 계산할 수 있는지 평가한다.
  (3-2) 정적분의 치환적분법을 활용하여 정적분의 값을 계산할 수 있는지 평가한다.
  (3-3) 미분계수의 정의와 적분과 미분의 관계를 이해하고, 삼각함수의 극한값을 계산할 수 있는지 평가한다.
key_idea: '$t=\pi-y$ 치환으로 $t\sin t$ 꼴을 $\pi\sin t$ 꼴로 바꾸고, $\frac{\pi}{2}$ 근방 구간 $\left[\frac\pi2-h,\frac\pi2+h\right]$의 적분이 $0$으로 감을 (3-3) 극한으로 보인 뒤 $a=\frac\pi2-h$로 극한을 취한다.'
stuck: '(3-2)의 식은 $a<\frac\pi2$에서만 성립하므로 $f(\pi)$를 가운데 구간과 나머지로 쪼개 극한으로 넘기는 단계'
idea_tags: [IDEA-REFLECT-SUBSTITUTION-PI-MINUS, IDEA-SPLIT-INTEGRAL-LIMIT]
tags: [치환적분, 삼각함수의 적분, 미분계수의 정의, 인하 실전, 의예과 공유]
elements:
  materials: ['$\int_0^a\frac{dt}{1+\sin t}$', '$\frac{t\sin t}{1+\sin t}$의 대칭 구간 적분', '$f(x)=\int_0^x\frac{t\sin t}{1+\sin t}dt$']
  concepts: [정적분의 치환적분법, 삼각함수의 적분($\sec$, $\tan$), 미분계수의 정의, 미분과 적분의 관계, 삼각함수의 극한]
  tools: ['분자·분모에 $1-\sin t$ 곱하기', '$t=\pi-y$ 치환', '$\frac{1}{2h}(f(\frac\pi2+h)-f(\frac\pi2-h))\to f''(\frac\pi2)$', '$a=\frac\pi2-h$ 대입 후 $h\to0+$ 극한']
  conditions:
  - '$0<a<\frac\pi2$ ⇒ $\cos t\ne0$이라 $\sec$, $\tan$ 사용 가능(구간 끝 $\frac\pi2$ 제외)'
  - '$f(\pi)$는 (3-2)의 식에 $a=\frac\pi2$를 바로 넣을 수 없음 ⇒ 극한으로 처리'
  stimuli_used: [가, 나]
  subpart_links: '(3-2)는 (3-1)의 결과, (3-3)은 (3-2)의 결과($a=\frac\pi2-h$) 사용'

