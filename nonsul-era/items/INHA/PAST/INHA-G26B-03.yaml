stimuli:
- label: 가
  body: |
    (가) (정적분의 치환적분법)
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때 도함수 $g'(t)$가 $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
- label: 나
  body: |
    (나) (나누어진 구간에서의 정적분)
    임의의 세 실수 $a$, $b$, $c$를 포함하는 구간에서 함수 $f(t)$가 연속일 때
    $$\int_a^cf(t)\,dt+\int_c^bf(t)\,dt=\int_a^bf(t)\,dt$$

stem: |
  [문제 3] (35점) 다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    (3-1) $0<a<\dfrac{\pi}{2}$인 실수 $a$에 대하여
    $$\int_0^a\dfrac{1}{1+\sin t}dt$$
    를 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: expression, value: '\tan a-\sec a+1', equivalents: ['\tan a-\dfrac{1}{\cos a}+1'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\frac{1}{1+\sin t}=\frac{1-\sin t}{\cos^2t}=\sec^2t-\tan t\sec t$.'
    steps:
    - {id: 1a, content: '$[\tan t-\sec t]_0^a$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 분모를 $\cos^2t$로 만들어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오후 문항카드 p.10 예시답안(3-1), 채점기준 p.10
    steps:
    - id: 1b-1
      content: |
        $0<a<\dfrac\pi2$인 실수 $a$에 대하여,
        $\displaystyle\int_0^a\dfrac{1}{1+\sin t}dt=\int_0^a\dfrac{1-\sin t}{(1+\sin t)(1-\sin t)}dt=\int_0^a\dfrac{1-\sin t}{1-\sin^2t}dt=\int_0^a\dfrac{1-\sin t}{\cos^2t}dt$
      criteria: [1.M1, 1.M2]
    - id: 1b-2
      content: |
        $\displaystyle=\int_0^a(\sec^2t-\tan t\sec t)dt=[\tan t-\sec t]_0^a=\tan a-\sec a+1$
        이다.
      criteria: [1.M2, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: (공식) 함수의 분자와 분모에 $1-\sin t$를 곱하여 식을 변형하였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        (공식) $\sin^2t+\cos^2t=1$을 활용하여 주어진 함수를 $\sec^2t-\sec t\tan t$로 변형하였다. [판독확인: 채점기준표 원문은 '$\sec^2t+\sec t\tan t$' — 예시답안과 부호 다름, 원문 표기 그대로]
      depends_on: [1.M1]
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: (공식) 적분값 $\tan a-\sec a+1$을 구하였다.
      depends_on: [1.M2]
      steps: [1b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5414}
  misconceptions:
  - id: MC-CAL-5414
    outcome_code: '70'
    wrong_work: '$\int\frac{1}{1+\sin t}dt=\ln(1+\sin t)$ 또는 $\frac{\ln(1+\sin t)}{\cos t}$로 적분'
    detect_cue: 답에 로그가 있다
    feedback: '$\ln$ 꼴은 분자가 분모의 도함수일 때만 됩니다. 켤레식 $1-\sin t$를 곱해 $\sec$, $\tan$ 꼴로 바꾸세요.'
    remedy: [RL-1]
- id: '2'
  stem: |
    (3-2) $0<a<\dfrac{\pi}{2}$인 실수 $a$에 대하여
    $$\int_0^a\dfrac{t\sin t}{1+\sin t}dt+\int_{\pi-a}^{\pi}\dfrac{t\sin t}{1+\sin t}dt$$
    를 구하시오. [10점]
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: '\pi(a-\tan a+\sec a-1)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$t=\pi-y$로 두 번째 적분을 바꾸면 $t$가 소거되고 $\pi\int_0^a\frac{\sin t}{1+\sin t}dt$만 남는다.'
    steps:
    - {id: 2a, content: '$\pi\left(a-\int_0^a\frac{dt}{1+\sin t}\right)$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - '$\sin(\pi-y)=\sin y$를 이용하자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오후 문항카드 p.10 예시답안(3-2), 채점기준 p.10
    steps:
    - id: 2b-1
      content: |
        $0<a<\dfrac\pi2$인 실수 $a$에 대하여, 제시문 (가)에 의하여 ($t=\pi-y$)
        $\displaystyle\int_0^a\dfrac{t\sin t}{1+\sin t}dt=\int_{\pi-a}^{\pi}\dfrac{(\pi-y)\sin y}{1+\sin y}dy=\pi\int_{\pi-a}^{\pi}\dfrac{\sin y}{1+\sin y}dy-\int_{\pi-a}^{\pi}\dfrac{y\sin y}{1+\sin y}dy$
        이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        (3-1)과 제시문 (가)에 의하여 ($y=\pi-t$)
        $\displaystyle\int_0^a\dfrac{t\sin t}{1+\sin t}dt+\int_{\pi-a}^{\pi}\dfrac{t\sin t}{1+\sin t}dt=\pi\int_{\pi-a}^{\pi}\dfrac{\sin y}{1+\sin y}dy=\pi\int_0^a\dfrac{\sin t}{1+\sin t}dt$
        $\displaystyle=\pi\int_0^a\left(1-\dfrac{1}{1+\sin t}\right)dt=\pi a-\pi\int_0^a\dfrac{1}{1+\sin t}dt=\pi(a-\tan a+\sec a-1)$
        이다.
      criteria: [2.M1, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        (공식) 정적분의 치환적분법을 사용하여 주어진 정적분을 $\int_0^a\frac{\sin t}{1+\sin t}dt$에 관한 식으로 표현하였다. [판독확인: 채점기준표 원문 적분 상한은 $x$ — 원문 표기 그대로]
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: (공식) 주어진 정적분의 값 $\pi(a-\tan a+\sec a-1)$을 구하였다.
      depends_on: [2.M1]
      steps: [2b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5415}
  misconceptions:
  - id: MC-CAL-5415
    outcome_code: '70'
    wrong_work: '$t=\pi-y$ 치환에서 $dt=-dy$의 부호와 적분 구간 뒤집기를 함께 빠뜨려 결과에 $-\pi$가 붙음'
    detect_cue: 답의 부호가 반대이거나 $\int_0^a\frac{t\sin t}{1+\sin t}$가 소거되지 않음
    feedback: 치환할 때 $dt=-dy$와 적분 구간의 순서 변화를 같이 처리하세요.
    remedy: [RL-2]
- id: '3'
  stem: |
    (3-3) $0\le x\le\pi$인 실수 $x$에 대하여 $f(x)=\displaystyle\int_0^x\dfrac{t\sin t}{1+\sin t}dt$라 할 때, 극한
    $$\lim_{h\to0+}\dfrac{1}{2h}\left(f\left(\dfrac{\pi}{2}+h\right)-f\left(\dfrac{\pi}{2}-h\right)\right)$$
    의 값을 구한 후, $f(\pi)$의 값을 구하시오. [15점]
  points: 15
  depends_on: ['2']
  answer: {kind: value, value: '\dfrac{\pi}{4},\ f(\pi)=\dfrac{\pi^2}{2}-\pi', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '극한은 $f''(\frac\pi2)=\frac\pi4$, 가운데 적분은 $0$으로 가므로 $f(\pi)=\lim_{h\to0+}\pi(a-\tan a+\sec a-1)|_{a=\frac\pi2-h}$.'
    steps:
    - {id: 3a, content: '$\sec a-\tan a=\frac{1-\sin a}{\cos a}\to0$ ⇒ $f(\pi)=\frac{\pi^2}2-\pi$', criteria: [3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - 대칭 차분은 미분계수이다.
    - '$\frac\pi2$ 근처를 잘라 내고 (3-2)를 쓰자.'
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오후 문항카드 p.11 예시답안(3-3), 채점기준 p.10
    steps:
    - id: 3b-1
      content: |
        미분계수의 정의와 적분과 미분의 관계에 의하여,
        $\displaystyle\lim_{h\to0+}\dfrac1{2h}\left(f\left(\tfrac\pi2+h\right)-f\left(\tfrac\pi2-h\right)\right)=\lim_{h\to0+}\dfrac{f(\frac\pi2+h)-f(\frac\pi2)}{2h}+\lim_{h\to0+}\dfrac{f(\frac\pi2-h)-f(\frac\pi2)}{2(-h)}=f'\left(\tfrac\pi2\right)=\dfrac{\frac\pi2\sin\frac\pi2}{1+\sin\frac\pi2}=\dfrac\pi4$
        이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        따라서 $\displaystyle\lim_{h\to0+}\int_{\frac\pi2-h}^{\frac\pi2+h}\dfrac{t\sin t}{1+\sin t}dt=\lim_{h\to0+}\left(f\left(\tfrac\pi2+h\right)-f\left(\tfrac\pi2-h\right)\right)=0$ 이다.
      criteria: [3.R1]
    - id: 3b-3
      content: |
        제시문 (나)와 (3-2)에 의하여 ($a=\frac\pi2-h$)
        $\displaystyle f(\pi)=\lim_{h\to0+}f(\pi)=\lim_{h\to0+}\left(\int_0^{\frac\pi2-h}\dfrac{t\sin t}{1+\sin t}dt+\int_{\frac\pi2-h}^{\frac\pi2+h}\dfrac{t\sin t}{1+\sin t}dt+\int_{\frac\pi2+h}^{\pi}\dfrac{t\sin t}{1+\sin t}dt\right)$
        $\displaystyle=\lim_{h\to0+}\left(\int_0^{\frac\pi2-h}\dfrac{t\sin t}{1+\sin t}dt+\int_{\frac\pi2+h}^{\pi}\dfrac{t\sin t}{1+\sin t}dt\right)+\lim_{h\to0+}\int_{\frac\pi2-h}^{\frac\pi2+h}\dfrac{t\sin t}{1+\sin t}dt$
        $\displaystyle=\lim_{h\to0+}\left\{\pi\left(\tfrac\pi2-h\right)-\pi\tan\left(\tfrac\pi2-h\right)+\pi\sec\left(\tfrac\pi2-h\right)-\pi\right\}$
      criteria: [3.M2]
    - id: 3b-4
      content: |
        $\displaystyle=\dfrac{\pi^2}{2}-\pi-\pi\lim_{h\to0+}\dfrac{\sin(\frac\pi2-h)-1}{\cos(\frac\pi2-h)}=\dfrac{\pi^2}{2}-\pi-\pi\lim_{h\to0+}\dfrac{\cos h-1}{\sin h}$
        $\displaystyle=\dfrac{\pi^2}{2}-\pi-\pi\lim_{h\to0+}\dfrac{(\cos h-1)(\cos h+1)}{\sin h(\cos h+1)}=\dfrac{\pi^2}{2}-\pi+\pi\lim_{h\to0+}\dfrac{\sin h}{\cos h+1}=\dfrac{\pi^2}{2}-\pi$
        이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: (공식) 미분계수의 정의와 적분과 미분의 관계를 사용하여 주어진 극한값 $\frac\pi4$를 구하였다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 4
      evidence: (공식) 이를 활용하여 $\lim_{h\to0+}\int_{\frac\pi2-h}^{\frac\pi2+h}\frac{t\sin t}{1+\sin t}dt=0$임을 확인하였다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: (공식) $f(\pi)=\int_0^{\frac\pi2-h}+\int_{\frac\pi2-h}^{\frac\pi2+h}+\int_{\frac\pi2+h}^{\pi}\frac{t\sin t}{1+\sin t}dt$로 표현하였다.
      depends_on: []
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: (공식) 삼각함수의 극한값을 계산하여 $f(\pi)=\frac{\pi^2}{2}-\pi$를 구하였다.
      depends_on: [3.M2]
      steps: [3b-4]
    deductions:
    - code: D3-1
      condition: $\int_{\frac\pi2-h}^{\frac\pi2+h}\frac{t\sin t}{1+\sin t}dt$를 고려하지 않고 $f(\pi)$의 값을 구함(공식 채점기준)
      effect: minus
      value: 4
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5416}
  misconceptions:
  - id: MC-CAL-5416
    outcome_code: '70'
