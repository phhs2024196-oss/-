intent: |
  지수함수와 로그함수의 그래프를 그릴 수 있고, 그 성질을 이해하는지 평가한다.
  (2-1) 평행이동의 의미를 이해하는지 평가한다.
  (2-2) 직선 $y=x$에 대한 대칭이동의 의미를 이해하는지 평가한다.
  (2-3) 지수함수와 로그함수의 그래프의 성질을 이해하여, 문제를 해결할 수 있는지 평가한다.
key_idea: '$y=\log_2(x-4)+1$은 $y=2^{x-1}+4$의 $y=x$ 대칭이므로 $C$는 $P(a+1,b+4)$의 대칭점 $(b+4,a+1)$이고, 평행사변형 조건은 두 대각선 중점 일치로 $b-a=3$.'
stuck: 점 $C$를 직접 구하지 않고 (2-1)의 점 $P$의 대칭점으로 잡는 발상
idea_tags: [IDEA-EXP-LOG-REFLECTION-POINT, IDEA-PARALLELOGRAM-MIDPOINT]
tags: [지수·로그함수 대칭, 평행사변형, 인하 실전, 의예과]
