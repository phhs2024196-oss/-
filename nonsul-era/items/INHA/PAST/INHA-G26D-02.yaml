stimuli:
- label: 가
  body: |
    일반적으로 $a>0$, $a\ne1$일 때, 로그함수 $y=\log_ax$의 그래프는 지수함수 $y=a^x$의 그래프와 직선 $y=x$에 대하여 대칭이다.

stem: |
  [문제 2] (35점) 다음 제시문을 읽고 물음에 답하시오.
  (※) 곡선 $y=2^x$ 위의 점 $A$를 직선 $y=x$에 대하여 대칭이동한 점을 $B$라 하고,
  곡선 $y=\log_2(x-4)+1$ 위의 점 $C$에서 직선 $y=x$에 내린 수선의 발을 $D$라 할 때,
  네 점 $A$, $B$, $C$, $D$는
  $$(\text{직선 }AB\text{의 }y\text{절편})=(\text{직선 }CD\text{의 }y\text{절편})-5$$
  를 만족한다.

subparts:
- id: '1'
  stem: |
    (2-1) 점 $A$의 좌표가 $(a,b)$일 때, 점 $P(a+1,b+4)$는 직선 $CD$와 곡선 $y=2^{x-1}+4$의 교점임을 보이시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$CD$: $y=-(x-a)+(b+5)$에 $P$ 대입, $b=2^a$이면 $b+4=2^{(a+1)-1}+4$.'
    steps:
    - {id: 1a, content: '두 식에 $P$의 좌표 대입', criteria: [1.R1, 1.R2]}
    hint_ladder:
    - $AB$와 $CD$는 모두 $y=x$에 수직이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오후-의예과 문항카드 p.18 예시답안(2-1), 채점기준 p.18
    steps:
    - id: 1b-1
      content: |
        직선 $AB$의 기울기는 $-1$이고 직선 $AB$는 점 $A(a,b)$를 지나므로, 직선 $AB$의 방정식은 $y=-(x-a)+b$이고 직선 $CD$의 방정식은
        $y=-(x-a)+(b+5)$ …… ㉠
        이다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        점 $A(a,b)$는 곡선 $y=2^x$ 위의 점이므로 $b=2^a$이고,
        $b+4=2^{(a+1)-1}+4$ …… ㉡
        이다. ㉠에 의하여 점 $P(a+1,b+4)$는 직선 $CD$ 위에 있고, ㉡에 의하여 점 $P$는 곡선 $y=2^{x-1}+4$ 위에 있으므로, 점 $P$는 직선 $CD$와 곡선 $y=2^{x-1}+4$의 교점이다.
      criteria: [1.R1, 1.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: (공식) 점 $P$가 직선 $CD$ 위에 있음을 보였다.
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.R2
      mark_type: R
      points: 5
      evidence: (공식) 점 $P$가 곡선 $y=2^{x-1}+4$ 위에 있음을 보였다.
      depends_on: []
      steps: [1b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-5417}
  misconceptions:
  - id: MC-ALG-5417
    outcome_code: '70'
    wrong_work: '$y$절편 조건을 거꾸로 적용해 $CD$를 $y=-(x-a)+(b-5)$로 둠'
    detect_cue: '$CD$ 식의 상수가 $b-5$'
    feedback: '($AB$의 $y$절편)$=$($CD$의 $y$절편)$-5$이므로 $CD$의 절편이 5 더 큽니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    (2-2) 점 $A$의 좌표가 $(3,8)$일 때, 두 선분 $AC$와 $BD$의 길이를 구하시오. [10점]
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '\overline{AC}=\sqrt{97},\ \overline{BD}=5', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$C$는 $P$의 대칭점 $(b+4,a+1)=(12,4)$, $D=\left(\frac{a+b+5}2,\frac{a+b+5}2\right)=(8,8)$, $B=(8,3)$.'
    steps:
    - {id: 2a, content: '$\sqrt{97}$, $5$', criteria: [2.A4, 2.A5]}
    hint_ladder:
    - $y=2^{x-1}+4$와 $y=\log_2(x-4)+1$은 서로 역함수이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오후-의예과 문항카드 p.18 예시답안(2-2), 채점기준 p.18
    steps:
    - id: 2b-1
      content: |
        $y=2^{x-1}+4$의 그래프와 $y=\log_2(x-4)+1$의 그래프는 직선 $y=x$에 의하여 대칭이므로, 점 $C$는 점 $P$를 대칭이동한 점이다. (2-1)에 의하여, 점 $A$의 좌표가 $(a,b)$이면 점 $P$의 좌표는 $(a+1,b+4)$이고 점 $C$는 $C(b+4,a+1)$이다.
      criteria: [2.B2]
    - id: 2b-2
      content: |
        점 $B$는 점 $A(a,b)$를 직선 $y=x$에 의하여 대칭이동한 점이므로 $B(b,a)$이고, 점 $D$는 점 $C(b+4,a+1)$에서 직선 $y=x$에 내린 수선의 발이므로 $D\left(\dfrac{a+b+5}{2},\dfrac{a+b+5}{2}\right)$이다.
      criteria: [2.B1, 2.B3]
    - id: 2b-3
      content: |
        따라서 $A$의 좌표가 $(3,8)$이면 $a=3$, $b=8$이므로 $B(8,3)$, $C(12,4)$, $D(8,8)$이고,
        $\overline{AC}=\sqrt{(12-3)^2+(4-8)^2}=\sqrt{97}$, $\overline{BD}=\sqrt{(8-8)^2+(8-3)^2}=5$
        이다.
      criteria: [2.A4, 2.A5]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: (공식) 점 $B(8,3)$의 좌표를 구하였다.
      depends_on: []
      steps: [2b-2]
    - id: 2.B2
      mark_type: B
      points: 2
      evidence: (공식) 점 $C(12,4)$의 좌표를 구하였다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B3
      mark_type: B
      points: 2
      evidence: (공식) 점 $D(8,8)$의 좌표를 구하였다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A4
      mark_type: B
      points: 2
      evidence: (공식) 선분 $AC$의 길이 $\sqrt{97}$을 구하였다.
      depends_on: []
      steps: [2b-3]
    - id: 2.A5
      mark_type: B
      points: 2
      evidence: (공식) 선분 $BD$의 길이 $5$를 구하였다.
      depends_on: []
      steps: [2b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-5418}
  misconceptions:
  - id: MC-ALG-5418
    outcome_code: '70'
    wrong_work: '$C$를 $P$와 같은 점으로 보거나 $C=(a+1,b+4)$로 둠'
    detect_cue: '$C$의 좌표가 $(4,12)$'
    feedback: '$P$는 $y=2^{x-1}+4$ 위, $C$는 그 역함수 그래프 위의 점입니다. $y=x$ 대칭이동하면 좌표가 바뀝니다.'
    remedy: [RL-2]
- id: '3'
  stem: |
    (2-3) 사각형 $ABCD$가 평행사변형일 때, 사각형 $ABCD$의 넓이를 구하시오. [15점]
  points: 15
  depends_on: ['2']
  answer: {kind: value, value: '15', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '대각선 중점 일치 ⇒ $b-a=3$, $\overline{AB}=3\sqrt2$, 평행선 거리 $\frac{5}{\sqrt2}$ ⇒ 넓이 15.'
    steps:
    - {id: 3a, content: '$3\sqrt2\times\frac52\sqrt2=15$', criteria: [3.M1, 3.A1, 3.A2]}
    hint_ladder:
    - 평행사변형의 두 대각선은 서로를 이등분한다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오후-의예과 문항카드 p.18~19 예시답안(2-3), 채점기준 p.18
    steps:
    - id: 3b-1
      content: |
        사각형 $ABCD$가 평행사변형이므로 사각형의 두 대각선 $AC$와 $BD$의 중점은 서로 같다.
        $\left(\dfrac{a+b+4}{2},\dfrac{a+b+1}{2}\right)=\left(\dfrac{a+3b+5}{4},\dfrac{3a+b+5}{4}\right)$
        그러므로 $b-a=3$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        선분 $AB$의 길이는 $\overline{AB}=\sqrt{(a-b)^2+(b-a)^2}=|b-a|\times\sqrt2=3\sqrt2$이고,
      criteria: [3.A1]
    - id: 3b-3
      content: |
        두 직선 $AB$와 $CD$ 사이의 거리는 $\left|(\text{직선 }AB\text{의 }y\text{절편})-(\text{직선 }CD\text{의 }y\text{절편})\right|\times\dfrac{\sqrt2}{2}=5\times\dfrac{\sqrt2}{2}=\dfrac52\sqrt2$
        이므로, 사각형 $ABCD$의 넓이는 $3\sqrt2\times\dfrac52\sqrt2=15$이다.
        참고. 주어진 조건을 만족하는 사각형 $ABCD$는 두 가지가 있고, 두 경우 모두 넓이는 15이다.
        [그림: 좌표평면에 $y=2^x$(초록), $y=\log_2x$(빨강), $y=\log_2(x-4)+1$(파랑), 직선 $y=x$와 기울기 $-1$인 두 직선. 제1사분면 쪽 평행사변형 $ABCD$와 원점 근처의 평행사변형 $A'B'C'D'$가 음영으로 표시됨.]
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: (공식) 평행사변형일 조건인 $b-a=3$을 구하였다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: (공식) 선분 $AB$의 길이(또는 선분 $CD$의 길이) $3\sqrt2$를 구하였다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: B
      points: 5
      evidence: (공식) 두 직선 $AB$와 $CD$ 사이의 거리 $\frac52\sqrt2$를 구하였다.
      depends_on: []
      steps: [3b-3]
    deductions:
    - code: D3-1
      condition: 사각형 $ABCD$의 넓이를 구하지 못함(공식 채점기준)
      effect: minus
      value: 3
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-5419}
  misconceptions:
  - id: MC-GEO-5419
    outcome_code: '70'
    wrong_work: '$b=2^a$와 $b-a=3$을 연립해 $a$를 구하려다 막히거나, 넓이를 $\overline{AB}\times5$로 계산'
    detect_cue: '답이 $15\sqrt2$이거나 $a$의 값을 구하려는 시도에서 멈춤'
    feedback: '넓이는 $a$의 값 없이 $|b-a|$와 절편 차만으로 정해집니다. 평행선 사이 거리는 절편 차 $\times\frac{1}{\sqrt2}$입니다.'
    remedy: [RL-3]

