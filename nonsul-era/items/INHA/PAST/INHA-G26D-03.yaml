intent: |
  주어진 사차함수로부터 최대, 최소를 포함한 표현으로 함수가 정의되었을 때, 함수의 증가, 감소와 미분가능성 등을 포함한 성질을 파악할 수 있는지 평가한다.
  (3-1) 함수 $g(t)$의 식으로부터 사차함수 $p(x)$의 개형을 파악할 수 있는지 평가한다.
  (3-2) 함수 $q(x)$에 대하여 정의된 함수 $h(t)$의 성질로부터 사차함수 $q(x)$를 구할 수 있는지 평가한다.
key_idea: '(3-1) $g$의 식에서 $p$는 $x=0$, $x=3$에서 극소이고 $p(0)=p(2)$. (3-2) $(q\circ h)$의 미분가능성에서 $q''(0)=0$, 최고차항 음수, 양쪽 최댓값이 모두 4임을 귀류로 보이고 $q''=cx(x-\alpha)(x-\beta)$, $q(\alpha)=q(\beta)$에서 $\alpha=-\beta$.'
stuck: '$h(t)$가 상수가 되는 구간의 경계에서 $q''=0$이 필요하다는 관찰과, 최댓값 $M\ne4$이면 사이값 정리로 미분값 0인 점이 4개 이상 생긴다는 귀류'
idea_tags: [IDEA-ARGMIN-FUNCTION-SHAPE, IDEA-COMPOSITE-DIFFERENTIABLE-CRITICAL, IDEA-QUARTIC-SYMMETRIC-MAX]
