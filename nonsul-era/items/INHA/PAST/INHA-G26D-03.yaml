stimuli:
- label: 가
  body: |
    함수 $f(x)$에 대하여 좌극한 $\displaystyle\lim_{x\to a-}\dfrac{f(x)-f(a)}{x-a}$와 우극한 $\displaystyle\lim_{x\to a+}\dfrac{f(x)-f(a)}{x-a}$가 각각 존재하고, 그 값이 서로 같다면 $f(x)$는 $x=a$에서 미분가능하다고 한다.

stem: |
  [문제 3] (30점) 다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    (3-1) 사차함수 $p(x)$의 최고차항의 계수가 1이다. 실수 $t$에 대하여 다음 조건을 만족하는 실수 $\alpha$의 최댓값을 $g(t)$라 하자.
    【구간 $(-\infty,t]$에서 $p(x)$는 $x=\alpha$일 때 최솟값을 갖는다. (단, $\alpha\le t$)】
    함수 $g(t)$가
    $$g(t)=\begin{cases}t & (t<0)\\ 0 & (0\le t<2)\\ t & (2\le t<3)\\ 3 & (t\ge3)\end{cases}$$
    이 되도록 하는 $p(x)$에 대하여, $p(1)-p(0)$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac{13}{5}', equivalents: ['2.6'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$p$는 $x=0$, $3$에서 극소, $p(0)=p(2)$ ⇒ $p''=4x(x-a)(x-3)$, $\frac{40}{3}a-16=0$.'
    steps:
    - {id: 1a, content: '$a=\frac65$, $p(1)-p(0)=1-\frac{28}{5}+\frac{36}{5}=\frac{13}{5}$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $g(t)$가 $t$와 같은 구간에서는 $p$가 감소한다.
    - '$g$가 0에서 2로 뛰는 순간의 의미는?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오후-의예과 문항카드 p.22 예시답안(3-1), 채점기준 p.22
    steps:
    - id: 1b-1
      content: |
        $g(t)$의 식으로부터 사차함수 $p(x)$의 그래프의 개형을 보면 $x=0$과 $x=3$에서 극솟값을 갖고, $p(0)=p(2)$임을 알 수 있다. 특히, $p(x)$는 $x=3$에서 최소이다.
        $p'(x)=4x(x-a)(x-3)$ (단, $0<a<3$)이라고 놓을 수 있고,
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $p(x)=x^4-\left(4+\dfrac{4a}{3}\right)x^3+6ax^2+C$이다. $p(0)=p(2)$이므로 $\dfrac{40}{3}a-16=0$이다.
        그러므로 $a=\dfrac65$이고 $p(x)=x^4-\dfrac{28}{5}x^3+\dfrac{36}{5}x^2+C$이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 $p(1)-p(0)=\dfrac{13}{5}$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: (공식) $p'(x)=4x(x-a)(x-3)$ (단, $0<a<3$)이라고 놓았다(또는 $p(x)$가 $x=0$과 $x=3$에서 극솟값을 갖는 것을 파악하였다).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: (공식) $p(0)=p(2)$로부터 $p(x)=x^4-\frac{28}{5}x^3+\frac{36}{5}x^2+C$임을 구하였다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: (공식) $p(1)-p(0)=\frac{13}{5}$임을 구하였다.
      depends_on: [1.M2]
      steps: [1b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5420}
  misconceptions:
  - id: MC-CAL-5420
    outcome_code: '70'
    wrong_work: '$g(t)=0$ 구간 때문에 $p$가 $[0,2)$에서 상수라고 보거나, $x=2$를 극소점으로 둠'
    detect_cue: '$p''(2)=0$을 조건으로 사용'
    feedback: '$g$가 $0$에서 $2$로 뛰는 것은 $p(2)=p(0)$이 되는 순간이지 $x=2$가 극점이라는 뜻이 아닙니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    (3-2) 사차함수 $q(x)$는 $q(0)=2$, $q(1)=\dfrac{23}{8}$을 만족하고, 함수 $f(x)$는
    $$f(x)=-\cos\dfrac{\pi q(x)}{4}$$
    이다. 함수 $h(t)$는 실수 전체의 집합에서 다음과 같이 정의한다.
    【(ⅰ) $h(0)=0$
    (ⅱ) $t>0$이면, 구간 $[0,t]$에서 $f(x)$가 $x=\alpha$일 때 최댓값을 갖도록 하는 $\alpha$ 중 최솟값이 $h(t)$이다. (단, $0\le\alpha\le t$)
    (ⅲ) $t<0$이면, 구간 $[t,0]$에서 $f(x)$가 $x=\alpha$일 때 최댓값을 갖도록 하는 $\alpha$ 중 최댓값이 $h(t)$이다. (단, $t\le\alpha\le0$)】
    합성함수 $(q\circ h)(t)$가 실수 전체의 집합에서 미분가능하도록 하는 사차함수 $q(x)$를 모두 구하시오. [20점]
  points: 20
  depends_on: []
  answer: {kind: set, value: 'q(x)=-\dfrac{x^4}{8}+x^2+2,\ q(x)=-\dfrac{49}{8}x^4+7x^2+2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$q''(0)=0$, 최고차항 음수, 양쪽 최댓값 4 ⇒ $q''=cx(x-\alpha)(x-\beta)$, $q(\alpha)=q(\beta)=4$에서 $\alpha=-\beta$, $q=c\left(\frac{x^4}4-\frac{\beta^2}2x^2\right)+2$.'
    steps:
    - {id: 2a, content: '$(\beta^2-4)(7\beta^2-4)=0$', criteria: [2.R4, 2.A1]}
    hint_ladder:
    - '$q''(0)>0$이면 $t<0$에서 $h(t)=0$이 된다.'
    - '$f$가 최대인 것은 $q=4$일 때이다. $h$가 상수가 되는 경계에서 $q''$은?'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2026 자연오후-의예과 문항카드 p.22~23 예시답안(3-2), 채점기준 p.22
    steps:
    - id: 2b-1
      content: |
        $q'(0)>0$이면 $\displaystyle\lim_{x\to0+}h'(x)=1$, $\lim_{x\to0-}h'(x)=0$이므로 좌극한
        $\displaystyle\lim_{x\to0-}\dfrac{(q\circ h)(x)-q(0)}{x}=\lim_{x\to0-}\dfrac{q(0)-q(0)}{x}=0$
        과 우극한
        $\displaystyle\lim_{x\to0+}\dfrac{(q\circ h)(x)-q(0)}{x}=\lim_{x\to0+}\dfrac{q(x)-q(0)}{x}=q'(0)$
        이 같지 않아서 함수 $(q\circ h)(x)$는 $x=0$에서 미분가능하지 않다. 마찬가지로 $q'(0)<0$이면 함수 $(q\circ h)(x)$는 $x=0$에서 미분가능하지 않다. 따라서 $q'(0)=0$이다.
      criteria: [2.R1]
    - id: 2b-2
      content: |
        먼저 사차함수 $q(x)$의 최고차항의 계수가 양수라고 가정하자. 사잇값의 정리에 의하여 $q(a)=q(b)=4$인 가장 큰 음수 $a$와 가장 작은 양수 $b$가 존재한다. $x\le a$ 또는 $x\ge b$이면 $(q\circ h)(x)=4$이므로, $x=a$와 $x=b$에서 $(q\circ h)(x)$가 미분가능하려면 $q'(a)=q'(b)=0$이어야 한다. 사차함수의 그래프의 개형으로부터 이는 가능하지 않다. 따라서 사차함수 $q(x)$의 최고차항의 계수는 음수이다.
      criteria: [2.R2]
    - id: 2b-3
      content: |
        구간 $[0,\infty)$에서 $q(x)$의 최댓값을 $M$이라 하자. 문제의 조건에서 $M\ge q(1)>q(0)$이고 $q(b)=M$인 양수 $b$에 대하여 $q'(b)=0$이다. 마찬가지로 구간 $(-\infty,0]$에서 $q(x)$가 $x=a$일 때 최대이면 $q'(a)=0$이다. $M<4$이면 사잇값의 정리에 의하여 $q(\gamma)=-4$인 가장 작은 양수 $\gamma$가 존재하고 $x\ge\gamma$이면 $(q\circ h)(x)=-4$이므로, $x=\gamma$에서 $(q\circ h)(x)$가 미분가능하려면 $q'(\gamma)=0$이어야 한다. 사차함수는 4개의 서로 다른 점에서 미분값이 0이 될 수 없으므로 이는 가능하지 않다. 마찬가지로 $M>4$이면 $q(\gamma)=-4$ 또는 $q(\gamma)=4$인 가장 작은 양수 $\gamma$에 대하여 $q'(\gamma)=0$이어야 하고 이는 가능하지 않으므로 $M=4$이다. 같은 방법으로 구간 $(-\infty,0]$에서 $q(x)$의 최댓값도 4임을 알 수 있다.
      criteria: [2.R3]
    - id: 2b-4
      content: |
        따라서 음수 $\alpha$와 양수 $\beta$가 존재하여, $q'(x)=cx(x-\alpha)(x-\beta)$이고, $q(\alpha)=q(\beta)=4$이다. (단, $c<0$은 상수)
        $q'(x)$를 적분하면 $q(0)=2$이므로, $q(x)=c\left(\dfrac14x^4-\dfrac{\alpha+\beta}{3}x^3+\dfrac{\alpha\beta}{2}x^2\right)+2$이다.
        $q(\alpha)-q(\beta)=c\left\{\dfrac14(\alpha^4-\beta^4)-\dfrac{\alpha+\beta}{3}(\alpha^3-\beta^3)+\dfrac{\alpha\beta}{2}(\alpha^2-\beta^2)\right\}$
        $=\dfrac{c}{12}(\alpha-\beta)\{3(\alpha+\beta)(\alpha^2+\beta^2)-4(\alpha+\beta)(\alpha^2+\alpha\beta+\beta^2)+6\alpha\beta(\alpha+\beta)\}$
        $=\dfrac{c}{12}(\alpha-\beta)(\alpha+\beta)\{3(\alpha^2+\beta^2)-4(\alpha^2+\alpha\beta+\beta^2)+6\alpha\beta\}$
        $=-\dfrac{c}{12}(\alpha-\beta)(\alpha+\beta)^3=0$ [판독확인: 원문 표기 그대로 — 바로 윗줄 식을 정리하면 $-\dfrac{c}{12}(\alpha-\beta)^3(\alpha+\beta)$가 맞음(검산 확인). $\alpha\ne\beta$이므로 결론 $\alpha=-\beta$는 같음]
        이므로, $\alpha=-\beta$이고, $q(x)=c\left(\dfrac{x^4}{4}-\dfrac{\beta^2}{2}x^2\right)+2$이다.
      criteria: [2.R4]
    - id: 2b-5
      content: |
        $q(\beta)=-\dfrac{\beta^4c}{4}+2=4$이므로, $c=-\dfrac{8}{\beta^4}$이다. $q(1)=\dfrac{23}{8}$이므로, $-\dfrac{8}{\beta^4}\left(\dfrac14-\dfrac{\beta^2}{2}\right)+2=\dfrac{23}{8}$이고, 이를 정리하면
        $7\beta^4-32\beta^2+16=(\beta^2-4)(7\beta^2-4)=0$이므로, $\beta^2=4$ 또는 $\beta^2=\dfrac47$이다.
        각각의 경우 $q(x)=-\dfrac{x^4}{8}+x^2+2$ 또는 $q(x)=-\dfrac{49}{8}x^4+7x^2+2$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: (공식) $q'(0)=0$임을 보였다.
      depends_on: []
      steps: [2b-1]
    - id: 2.R2
      mark_type: R
      points: 4
      evidence: (공식) $q(x)$의 최고차항의 계수가 음수임을 증명하였다.
      depends_on: []
      steps: [2b-2]
    - id: 2.R3
      mark_type: R
      points: 3
      evidence: (공식) $q(x)$가 $x>0$일 때와 $x<0$일 때 최댓값이 모두 4임을 보였다.
      depends_on: []
      steps: [2b-3]
    - id: 2.R4
      mark_type: M
      points: 4
      evidence: (공식) $q'(x)=cx(x-\alpha)(x-\beta)$라고 놓았을 때 $\alpha=-\beta$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-4]
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: (공식) $q(x)$의 식을 모두 구하였다($-\frac{x^4}{8}+x^2+2$, $-\frac{49}{8}x^4+7x^2+2$).
      depends_on: [2.R4]
      steps: [2b-5]
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-5421}
  misconceptions:
  - id: MC-CAL-5421
    outcome_code: '70'
    wrong_work: '$q$가 우함수라고 처음부터 가정하거나 $\beta^2$ 두 값 중 하나만 답함'
    detect_cue: '$\alpha=-\beta$의 근거가 없거나 답이 하나'
