  concepts: [접선의 방정식, 함수의 증가와 감소, 합성함수의 미분법, 역함수의 미분]
  tools: [인수분해로 삼차방정식 풀기, 관계식 양변 미분, 도함수 부호 판정, 역함수 대입 후 합성함수 미분]
