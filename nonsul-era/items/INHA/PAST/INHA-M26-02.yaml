  concepts: [미분계수의 정의, 사인함수의 도함수, 역함수를 가질 조건, 역함수의 미분법]
  tools: [좌·우 미분계수 비교, '$\lvert\cos\rvert\le1$로 도함수 부호 조건', 이차식 완전제곱으로 최소, 역상 찾기 후 역함수 미분]
