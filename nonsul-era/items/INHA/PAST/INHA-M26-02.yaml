intent: 주어진 함수가 미분가능한 함수가 되는 조건과 역함수를 가지는 조건을 이해하고, 사인함수의 미분과 역함수의 미분법으로 역함수의 미분계수를 구할 수 있는지 평가한다.
key_idea: '미분가능 조건 $1+a\pi=2+2b\pi$와 증가 조건 $\lvert a\rvert\le\dfrac1\pi$, $\lvert b\rvert\le\dfrac1\pi$를 결합하고, 정수 $n$에서 $f(n)=n$, $f\left(\dfrac m2\right)=m$을 이용해 $g''$을 구한다.'
stuck: '역함수 존재 ⇔ 증가함수(감소 불가)임을 밝히고 $f''(x)\ge0$ 조건을 $a$, $b$의 범위로 바꾸는 단계'
