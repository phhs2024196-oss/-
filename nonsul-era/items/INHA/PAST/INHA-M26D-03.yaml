        [그림: 해설지 p.15 (a) — 꺾은선 $(0,0)\to(1,0)\to(2,2)\to(3,0)\to(4,0)\to(5,2)\to(6,2)\to(7,0)\to(8,0)$]
        [그림: 해설지 p.15 (b) — 꺾은선 $(0,0)\to(1,0)\to(2,1)\to(3,0)\to(4,-1)\to(5,1)\to(6,1)\to(7,-1)\to(8,-3)$]
        (참고: 이때 $\displaystyle\int_0^8f(x)dx$의 값은 (a) $6$, (b) $-\dfrac12$)
