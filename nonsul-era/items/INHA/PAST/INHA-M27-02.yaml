stimuli:
- label: 가
  body: |
    (정적분과 급수의 합 사이의 관계)
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)dx=\lim_{n\to\infty}\sum_{k=1}^nf(x_k)\Delta x\quad\left(\text{단, }\Delta x=\frac{b-a}{n},\ x_k=a+k\Delta x\right)$$
- label: 나
  body: |
    (수열의 극한의 대소 관계)
    두 수열 $\{a_n\}$, $\{b_n\}$이 각각 수렴하고 $\displaystyle\lim_{n\to\infty}a_n=\alpha$, $\displaystyle\lim_{n\to\infty}b_n=\beta$일 때,
    수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $\alpha=\beta$이면 $\displaystyle\lim_{n\to\infty}c_n=\alpha$이다.
- label: 다
  body: |
    수열 $\{c_n\}$과 자연수 $n$에 대해 $a_n=e^{c_n}$이라 하자.
    수열 $\{c_n\}$이 수렴하고 $\displaystyle\lim_{n\to\infty}c_n=c$일 때, 수열 $\{a_n\}$도 수렴하고 $\displaystyle\lim_{n\to\infty}a_n=e^c$이다.

stem: |
  (※) 자연수 $n$에 대하여
  $$P_n=\left(1+\frac1n\sin\frac{\pi}{2n}\right)\times\left(1+\frac1n\sin\frac{2\pi}{2n}\right)\times\cdots\times\left(1+\frac1n\sin\frac{n\pi}{2n}\right)$$
  라 하자.

subparts:
- id: '1'
  stem: |
    (2-1) $x\ge0$일 때 다음 부등식이 성립함을 증명하시오. [10점]
    $$x-x^2\le\ln(1+x)\le x$$
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '두 차함수 $x-\ln(1+x)$, $\ln(1+x)-x+x^2$가 $x\ge0$에서 증가하고 $0$에서 값이 $0$.'
    steps:
    - {id: 1a, content: '도함수 $\dfrac{x}{1+x}$, $\dfrac{x+2x^2}{1+x}$가 $x>0$에서 양수', criteria: [1.R1, 1.R2]}
    hint_ladder:
    - 양변의 차를 함수로 두고 미분하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 2027 자연 모의 해설지(문항카드) p.6 예시 답안 (2-1), 채점기준 p.5
    steps:
    - id: 1b-1
      content: |
        $f(x)=x-\ln(1+x)$라고 하면 $f'(x)=1-\dfrac{1}{1+x}=\dfrac{x}{1+x}$이다. $x>0$일 때 $f'(x)>0$이므로 $f(x)$는 $x\ge0$에서 증가함수이다. 또한 $f(0)=0-\ln(1+0)=0$이므로 $x\ge0$일 때 $f(x)=x-\ln(1+x)\ge0$이 성립한다.
      criteria: [1.R2]
    - id: 1b-2
      content: |
        다음으로 $g(x)=\ln(1+x)-x+x^2$이라고 하면 $g'(x)=\dfrac{1}{1+x}-1+2x=\dfrac{x+2x^2}{1+x}$이므로 $x>0$일 때 $g'(x)>0$이다. 따라서 $g(x)$는 $x\ge0$에서 증가함수이다. 또한 $g(0)=\ln(1+0)-0=0$이므로 $x\ge0$일 때 $g(x)=\ln(1+x)-x+x^2\ge0$이 성립한다. 따라서 $x\ge0$일 때 부등식 $x-x^2\le\ln(1+x)\le x$가 성립한다.
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: '첫 번째 부등식 $x-x^2\le\ln(1+x)$를 도함수의 부호와 $g(0)=0$으로 증명했다.'
      depends_on: []
      steps: [1b-2]
    - id: 1.R2
      mark_type: R
      points: 5
      evidence: '두 번째 부등식 $\ln(1+x)\le x$를 도함수의 부호와 $f(0)=0$으로 증명했다.'
      depends_on: []
      steps: [1b-1]
    deductions:
    - code: D1-1
      condition: 미분 등의 계산 실수가 있는 경우 최대(공식 채점기준)
      effect: minus
      value: 4
    - code: D1-2
      condition: 부등식에 등호가 빠진 경우 각 부등식마다(공식 채점기준)
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRF-5515}
  misconceptions:
  - id: MC-PRF-5515
    outcome_code: '70'
    wrong_work: '$f''(x)>0$만 보이고 $f(0)=0$을 확인하지 않은 채 $f(x)\ge0$이라 결론'
    detect_cue: 시작점 값 $f(0)=0$ 언급이 없다
    feedback: 증가함수라는 사실만으로는 부호가 정해지지 않습니다. 출발점의 값이 0임을 함께 밝히세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    (2-2) 다음 극한값을 구하시오. [10점]
    $$\lim_{n\to\infty}\left(\frac1n\sum_{k=1}^n\sin\frac{k\pi}{2n}-\frac{1}{n^2}\sum_{k=1}^n\sin^2\frac{k\pi}{2n}\right)$$
  points: 10
  depends_on: []
  answer: {kind: value, value: '\dfrac2\pi', equivalents: ['2/π'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '앞 항은 $\int_0^1\sin\dfrac{\pi x}{2}dx$, 뒤 항은 $0\le\cdot\le\dfrac1n$.'
    steps:
    - {id: 2a, content: '$\dfrac2\pi-0$', criteria: [2.A1, 2.A2]}
    hint_ladder:
    - '$\dfrac kn=x_k$로 보고 제시문 (가)를 쓰자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 2027 자연 모의 해설지(문항카드) p.6 예시 답안 (2-2), 채점기준 p.5
    steps:
    - id: 2b-1
      content: |
        제시문 (가)에 $f(x)=\sin\left(\dfrac{\pi x}{2}\right)$, $a=0$, $b=1$을 대입하면 다음과 같이 극한값을 구할 수 있다.
        $$\lim_{n\to\infty}\frac1n\sum_{k=1}^n\sin\frac{k\pi}{2n}=\int_0^1\sin\left(\frac{\pi x}{2}\right)dx=\frac2\pi\left[-\cos\left(\frac{\pi x}{2}\right)\right]_0^1=\frac2\pi$$
      criteria: [2.A1]
    - id: 2b-2
      content: |
        한편 $0\le\sin^2\dfrac{k\pi}{2n}\le1$이므로 $0\le\dfrac{1}{n^2}\displaystyle\sum_{k=1}^n\sin^2\frac{k\pi}{2n}\le\frac{n}{n^2}=\frac1n$이다. $\displaystyle\lim_{n\to\infty}\frac1n=0$이므로, 제시문 (나)에 의해 $\displaystyle\lim_{n\to\infty}\frac{1}{n^2}\sum_{k=1}^n\sin^2\frac{k\pi}{2n}=0$이다. 따라서 수렴하는 수열의 성질에 의해 구하고자 하는 극한값은 $\dfrac2\pi-0=\dfrac2\pi$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.A1
      mark_type: B
      points: 5
      evidence: '제시문 (가)를 활용해 $\displaystyle\lim_{n\to\infty}\frac1n\sum_{k=1}^n\sin\frac{k\pi}{2n}=\frac2\pi$를 구했다.'
      depends_on: []
      steps: [2b-1]
    - id: 2.A2
      mark_type: B
      points: 5
      evidence: '제시문 (나)를 활용해 $\displaystyle\lim_{n\to\infty}\frac{1}{n^2}\sum_{k=1}^n\sin^2\frac{k\pi}{2n}=0$을 구했다.'
      depends_on: []
      steps: [2b-2]
    deductions:
    - code: D2-1
      condition: 적분 등의 계산 실수가 있는 경우 최대(공식 채점기준)
      effect: minus
      value: 4
    - code: D2-2
      condition: 피적분 함수가 틀린 경우 최대(공식 채점기준)
      effect: minus
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-5516}
  misconceptions:
  - id: MC-CAL-5516
    outcome_code: '71'
    wrong_work: '피적분 함수를 $\sin\pi x$ 또는 구간을 $[0,\dfrac\pi2]$로 잡아 $\displaystyle\int_0^{\pi/2}\sin x\,dx=1$로 답함'
    detect_cue: '답이 $1$ 또는 $\dfrac{2}{\pi}$가 아닌 값'
    feedback: '$x_k=\dfrac kn$이 $[0,1]$을 나누므로 피적분 함수는 $\sin\dfrac{\pi x}{2}$입니다.'
    remedy: [RL-2]
- id: '3'
  stem: |
    (2-3) $\displaystyle\lim_{n\to\infty}P_n$의 값을 구하시오. [15점]
  points: 15
  depends_on: ['1', '2']
  answer: {kind: value, value: 'e^{\frac2\pi}', equivalents: ['e^(2/π)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '(2-1)에 $x=\dfrac1n\sin\dfrac{k\pi}{2n}$ 대입 후 합, 로그의 성질로 가운데가 $\ln P_n$.'
    steps:
    - {id: 3a, content: '$\ln P_n\to\dfrac2\pi$, $P_n\to e^{2/\pi}$', criteria: [3.A1, 3.A2]}
    hint_ladder:
    - 곱은 로그를 취하면 합이 된다.
    - (2-1)의 $x$에 무엇을 넣으면 (2-2)의 식이 나오는가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 2027 자연 모의 해설지(문항카드) p.6~7 예시 답안 (2-3), 채점기준 p.6
    steps:
    - id: 3b-1
      content: |
        (2-1)의 부등식에 $x=\dfrac1n\sin\dfrac{k\pi}{2n}$를 대입하면 다음 부등식을 얻는다.
        $$\frac1n\sin\frac{k\pi}{2n}-\frac{1}{n^2}\sin^2\frac{k\pi}{2n}\le\ln\left(1+\frac1n\sin\frac{k\pi}{2n}\right)\le\frac1n\sin\frac{k\pi}{2n}$$
        이 부등식을 $k=1$부터 $k=n$까지 더하고, 로그함수의 성질에 의해 가운데 항은 $\displaystyle\sum_{k=1}^n\ln\left(1+\frac1n\sin\frac{k\pi}{2n}\right)=\ln P_n$으로 나타낼 수 있으므로 부등식
        $$\frac1n\sum_{k=1}^n\sin\frac{k\pi}{2n}-\frac{1}{n^2}\sum_{k=1}^n\sin^2\frac{k\pi}{2n}\le\ln P_n\le\frac1n\sum_{k=1}^n\sin\frac{k\pi}{2n}$$
        이 성립한다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        여기서 (2-2)에 의해 좌변은 $\dfrac2\pi$로 수렴하고, (2-2)의 풀이 과정에 의해 우변도 $\dfrac2\pi$로 수렴하므로, 제시문 (나)에 의해 $\displaystyle\lim_{n\to\infty}\ln P_n=\frac2\pi$이다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        마지막으로 제시문 (다)에 의해 $\displaystyle\lim_{n\to\infty}P_n=\lim_{n\to\infty}e^{\ln P_n}=e^{2/\pi}$이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: '(2-1)의 부등식과 로그함수의 성질로 $\ln P_n$을 위아래로 조이는 부등식을 도출했다.'
      depends_on: []
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 7
      evidence: '(2-2)와 제시문 (나)를 활용해 $\displaystyle\lim_{n\to\infty}\ln P_n=\frac2\pi$를 구했다.'
      depends_on: [3.M1]
      ft: {allowed: true, from: [2.A1], max_points: 7}
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 3
      evidence: '제시문 (다)를 활용해 $\displaystyle\lim_{n\to\infty}P_n=e^{2/\pi}$를 구했다.'
      depends_on: [3.M1]
      steps: [3b-3]
    deductions:
    - code: D3-1
      condition: 계산 실수가 있는 경우 최대(공식 채점기준)
      effect: minus
      value: 6
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-5517}
  misconceptions:
  - id: MC-CAL-5517
    outcome_code: '72'
    wrong_work: '$\ln P_n$의 극한 $\dfrac2\pi$를 그대로 $P_n$의 극한으로 답함'
    detect_cue: '최종 답이 $\dfrac2\pi$'
    feedback: '로그를 취해 구한 극한은 $\ln P_n$의 극한입니다. 제시문 (다)로 $e^{2/\pi}$로 되돌리세요.'
    remedy: [RL-3]

