  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-5519}
  misconceptions:
  - id: MC-CAL-5519
    outcome_code: '72'
    wrong_work: '$-g(x)$의 부호를 놓쳐 우극한을 $f''(a)-8$로 계산($6a^2+6a-16=0$ 꼴)'
    detect_cue: '$a$가 무리수로 나오거나 $f''(a)=-4$ 등'
    feedback: '$x>0$에서 $-g(x)=+8x$이므로 우극한에 $+8$이 더해집니다. 부호를 차근차근 확인하세요.'
