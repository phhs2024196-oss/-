      depends_on: []
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: '미분가능할 조건 $-f''(a)-16=f''(a)+8$, 즉 $f''(a)=-12$를 찾았다.'
      depends_on: []
      steps: [3b-3]
    - id: 3.A3
      mark_type: A
      points: 4
      evidence: '$a=0$, $a=-1$을 모두 구했다.'
      depends_on: [3.R1]
      steps: [3b-3]
    deductions:
    - code: D3-1
      condition: 미분의 정의가 아닌 도함수의 연속성을 가정하고 계산하는 경우 최대(공식 채점기준)
      effect: minus
      value: 5
