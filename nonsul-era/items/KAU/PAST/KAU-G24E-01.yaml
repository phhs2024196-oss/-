- id: '4'
  stem: |
    [문제 1-4] $x$에 대한 이차방정식 $x^2+2(\sin\theta+1)x+\sin^2\theta=0$의 두 실근을 $\alpha,\ \beta\ (\alpha\le\beta)$라 하자. $\beta-\alpha\le2\sqrt{2}$일 때, $\theta$의 값의 범위를 구하시오. (단, $0\le\theta\le2\pi$)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 0<=theta<=pi/6; 5*pi/6<=theta<=7*pi/6; 11*pi/6<=theta<=2*pi
    equivalents:
    - $0\le\theta\le\dfrac{\pi}{6},\ \dfrac{5\pi}{6}\le\theta\le\dfrac{7\pi}{6},\ \dfrac{11\pi}{6}\le\theta\le2\pi$
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        방정식이 두 실근을 가지려면 $D/4=(\sin\theta+1)^2-\sin^2\theta=2\sin\theta+1\ge0$
        따라서, $\sin\theta\ge-\dfrac{1}{2}$
      source_flow: 예시답안 p.6
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        근과 계수의 관계에서 $\alpha+\beta=2(\sin\theta+1)$, $\alpha\beta=\sin^2\theta$이고,
        $(\alpha-\beta)^2=(\alpha+\beta)^2-4\alpha\beta=8\sin\theta+4$이므로 $\beta-\alpha=\sqrt{8\sin\theta+4}\le2\sqrt{2}$
        따라서, $\sin\theta\le\dfrac{1}{2}$
      source_flow: 예시답안 p.6
      criteria:
      - 4.M2
    - id: 4b-3
      content: |
        이를 정리하면, $0\le\theta\le\dfrac{\pi}{6},\ \dfrac{5\pi}{6}\le\theta\le\dfrac{7\pi}{6},\ \dfrac{11\pi}{6}\le\theta\le2\pi$
      source_flow: 예시답안 p.7
      criteria:
      - 4.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: 판별식으로 $\sin\theta\ge-\dfrac{1}{2}$를 구했다.
      steps:
      - 4b-1
    - id: 4.M2
      mark_type: M
      points: 3
      evidence: 근과 계수의 관계로 $(\beta-\alpha)^2=8\sin\theta+4$를 세우고 $\sin\theta\le\dfrac{1}{2}$를 구했다.
      steps:
      - 4b-2
    - id: 4.A1
      mark_type: A
      points: 4
      evidence: $-\dfrac{1}{2}\le\sin\theta\le\dfrac{1}{2}$의 해를 $0\le\theta\le2\pi$에서 구간으로 바르게 나타냈다.
      depends_on:
      - 4.M1
      - 4.M2
      steps:
      - 4b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
