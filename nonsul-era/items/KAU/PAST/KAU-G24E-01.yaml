- id: '5'
  stem: |
    [문제 1-5] $0$이 아닌 네 개의 실수 $a,\ b,\ c,\ d$가 다음의 조건을 만족한다.

    (가) $a,\ b,\ c$가 이 순서대로 등비수열을 이룬다.
    (나) $b,\ c,\ d$가 이 순서대로 등차수열을 이룬다.

    $\dfrac{d}{a}$의 최솟값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: -1/8
    equivalents:
    - $-\dfrac{1}{8}$
    tolerance: null
  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        공비를 $r$라 하자. $a,b,c$가 등비수열이므로 $b=ar,\ c=ar^2$
      source_flow: 예시답안 p.7
      criteria:
      - 5.M1
    - id: 5b-2
      content: |
        또한, $b,c,d$는 등차수열이므로 $d-c=c-b$에서
      source_flow: 예시답안 p.7
      criteria:
      - 5.M2
    - id: 5b-3
      content: |
        $d=2c-b=a(2r^2-r)$이다.
      source_flow: 예시답안 p.7
      criteria:
      - 5.A1
    - id: 5b-4
      content: |
        $\dfrac{d}{a}=2r^2-r=2\left(r^2-\dfrac{1}{2}r+\dfrac{1}{16}\right)-\dfrac{1}{8}=2\left(r-\dfrac{1}{4}\right)^2-\dfrac{1}{8}$이므로, $r=\dfrac{1}{4}$일 때, 최솟값은 $-\dfrac{1}{8}$이다.
      source_flow: 예시답안 p.7
      criteria:
      - 5.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 5.M1
      mark_type: M
      points: 2
      evidence: 등비수열의 정의로 $b=ar,\ c=ar^2$를 세웠다.
      steps:
      - 5b-1
    - id: 5.M2
      mark_type: M
      points: 2
      evidence: 등차수열의 정의로 $d-c=c-b$를 세웠다.
      steps:
      - 5b-2
    - id: 5.A1
      mark_type: A
      points: 3
      evidence: $\dfrac{d}{a}=2r^2-r$ ($d=a(2r^2-r)$)를 구했다.
      depends_on:
      - 5.M1
      - 5.M2
      steps:
      - 5b-3
    - id: 5.A2
      mark_type: A
      points: 3
      evidence: 완전제곱식(또는 꼭짓점)으로 최솟값 $-\dfrac{1}{8}$을 구했다.
      depends_on:
      - 5.M1
      - 5.A1
      steps:
      - 5b-4
