stimuli:
- label: 가
  body: |
    $x$에 대한 다항식 $f(x)$와 일차식 $x-\alpha$에 대해서
    (1) $f(\alpha)=0$이면 $f(x)$는 $x-\alpha$로 나누어떨어진다.
    (2) $f(x)$가 $x-\alpha$로 나누어떨어지면 $f(\alpha)=0$이다.
- label: 나
  body: |
    로그는 다음의 성질이 성립한다.
    $a>0,\ a\neq1,\ M>0,\ N>0$일 때,
    (1) $\log_aMN=\log_aM+\log_aN$
    (2) $\log_a\dfrac{M}{N}=\log_aM-\log_aN$
- label: 다
  body: |
    이차방정식 $ax^2+bx+c=0\ (a\neq0)$에서 판별식 $D=b^2-4ac$일 때
    (1) $D>0$이면 서로 다른 두 실근을 가진다.
    (2) $D=0$이면 서로 같은 두 실근(중근)을 가진다.
    (3) $D<0$이면 서로 다른 두 허근을 가진다.
- label: 라
  body: |
    이차방정식 $ax^2+bx+c=0\ (a\neq0)$의 두 근을 $\alpha,\beta$라고 하면,
    $$\alpha+\beta=-\dfrac{b}{a},\ \alpha\beta=\dfrac{c}{a}$$
- label: 마
  body: |
    첫째항이 $a$, 공차가 $d$인 등차수열 $\{a_n\}$의 일반항 $a_n$은
    $$a_n=a+(n-1)d\ (\text{단},\ n=1,2,3,\cdots),$$
    첫째항이 $b$, 공비가 $r$인 등비수열 $\{b_n\}$의 일반항 $b_n$은
    $$b_n=br^{n-1}\ (\text{단},\ n=1,2,3,\cdots)$$
stem: ''
subparts:
- id: '1'
  stem: |
    [문제 1-1] 사차함수 $y=f(x)$에 대하여 두 방정식 $f(x)=0$과 $f'(x)=0$은 모두 $20$과 $23$을 근으로 갖는다. $f(21)=21$일 때, $f(24)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '84'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=0$이 $x=a$에서 근을 갖는 경우 $f(x)=(x-a)g(x)$와 같이 쓸 수 있으므로, $f'(x)=(x-a)g'(x)+g(x)$가 된다.
        또한 $f'(a)=0$에서 $g(a)=0$임을 알 수 있다. 따라서 $g(x)=(x-a)h(x)$와 같이 쓸 수 있다.
        이를 정리하면 $f(x)=(x-a)^2h(x)$로 표현할 수 있다.
        $a=20$과 $a=23$을 적용하면 $f(x)=(x-20)^2(x-23)^2r(x)$와 같이 나타낼 수 있다.
        $f(x)$가 사차 다항식이므로 $r(x)=k$($k$는 상수)이다. 따라서 $f(x)=k(x-20)^2(x-23)^2$
      source_flow: 예시답안 p.5
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(21)=21$을 적용하면 $21=k(21-20)^2(21-23)^2$이므로 $k=\dfrac{21}{4}$
      source_flow: 예시답안 p.5
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $f(x)=\dfrac{21}{4}(x-20)^2(x-23)^2$
        $f(24)=\dfrac{21}{4}\cdot4^2\cdot1^2=84$
      source_flow: 예시답안 p.5
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 나머지정리(제시문 가)를 이용해 $f(x)=k(x-20)^2(x-23)^2$ 꼴로 나타냈다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $f(21)=21$을 대입해 $k=\dfrac{21}{4}$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $f(24)=84$를 구했다.
      depends_on:
      - 1.M1
      - 1.A1
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [문제 1-2] $1$보다 큰 자연수 $k$에 대하여 방정식 $4^x-2^{x+1}+1-\dfrac{1}{k^2}=0$의 두 실근을 $\alpha_k,\ \beta_k$라 하자. $N=\displaystyle\sum_{k=2}^{2024}(\alpha_k+\beta_k)$일 때, $2^N$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 2025/4048
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $y=2^x$라고 하자.
      source_flow: 예시답안 p.5
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        방정식은 $y^2-2y+1-\dfrac{1}{k^2}=0$과 같다.
        이 식을 인수분해하면 $\left\{y-\left(1-\dfrac{1}{k}\right)\right\}\left\{y-\left(1+\dfrac{1}{k}\right)\right\}=0$이므로 $y=1\pm\dfrac{1}{k}$가 된다.
      source_flow: 예시답안 p.5
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        즉, $2^x=1\pm\dfrac{1}{k}$이므로, $x=\log_2\left(1\pm\dfrac{1}{k}\right)$이다.
      source_flow: 예시답안 p.5
      criteria:
      - 2.A2
    - id: 2b-4
      content: |
        주어진 $k$에 대해서 두 근의 합 $\alpha_k+\beta_k$는
        $\log_2\left(1+\dfrac{1}{k}\right)+\log_2\left(1-\dfrac{1}{k}\right)=\log_2\left(1-\dfrac{1}{k^2}\right)=\log_2\left\{\dfrac{(k-1)(k+1)}{k^2}\right\}$과 같다.
      source_flow: 예시답안 p.5
      criteria:
      - 2.M2
    - id: 2b-5
      content: |
        따라서 합은
        $N=\log_2\left(\dfrac{1\cdot3}{2^2}\right)+\log_2\left(\dfrac{2\cdot4}{3^2}\right)+\cdots+\log_2\left(\dfrac{2022\cdot2024}{2023^2}\right)+\log_2\left(\dfrac{2023\cdot2025}{2024^2}\right)=\log_2\left(\dfrac{2025}{2\cdot2024}\right)$와 같다.
      source_flow: 예시답안 p.6
      criteria:
      - 2.A3
    - id: 2b-6
      content: |
        즉, $2^N=\dfrac{2025}{4048}$
      source_flow: 예시답안 p.6
      criteria:
      - 2.A4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 1
      evidence: $2^x=y$로 치환해 $y$에 대한 이차방정식으로 바꿨다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: $y=1\pm\dfrac{1}{k}$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: 로그를 적용해 $x=\log_2\left(1\pm\dfrac{1}{k}\right)$를 구했다.
      depends_on:
      - 2.M1
      - 2.A1
      steps:
      - 2b-3
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: 로그의 성질(제시문 나)로 $\alpha_k+\beta_k=\log_2\dfrac{(k-1)(k+1)}{k^2}$를 구했다.
      steps:
      - 2b-4
    - id: 2.A3
      mark_type: A
      points: 2
      evidence: 합을 약분해 $N=\log_2\dfrac{2025}{2\cdot2024}$를 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-5
    - id: 2.A4
      mark_type: A
      points: 1
      evidence: $2^N=\dfrac{2025}{4048}$을 구했다.
      depends_on:
      - 2.M2
      - 2.A3
      steps:
      - 2b-6
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [문제 1-3] 이차함수 $y=kx^2-2x+k-3$의 그래프의 꼭짓점 $\mathrm{P}$의 좌표를 $(x_k,\ y_k)$라 하자. $0<x_k<1,\ 0<y_k<1$일 때, 실수 $k$의 값의 범위를 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: (3+sqrt(13))/2<k<2+sqrt(5)
    equivalents:
    - $\dfrac{3+\sqrt{13}}{2}<k<2+\sqrt{5}$
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $y=k\left(x-\dfrac{1}{k}\right)^2+k-\dfrac{1}{k}-3$이므로 꼭짓점의 좌표는 $\left(\dfrac{1}{k},\ k-\dfrac{1}{k}-3\right)$가 된다.
      source_flow: 예시답안 p.6
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        꼭짓점의 좌표가 $0<x_k<1,\ 0<y_k<1$을 만족해야 한다. 따라서, $0<\dfrac{1}{k}<1,\ 0<k-\dfrac{1}{k}-3<1$
      source_flow: 예시답안 p.6
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $0<\dfrac{1}{k}<1$이므로 $k>1$ ……①
      source_flow: 예시답안 p.6
      criteria:
      - 3.A1
    - id: 3b-4
      content: |
        $0<k-\dfrac{1}{k}-3<1$의 양변에 $k$를 곱하면 $0<k^2-3k-1<k$
        이를 정리하면 다음의 두 부등식을 얻는다. $0<k^2-3k-1$이고 $k^2-4k-1<0$
        이 연립부등식을 풀면 $k<\dfrac{3-\sqrt{13}}{2}$ 또는 $k>\dfrac{3+\sqrt{13}}{2}$이고 $2-\sqrt{5}<k<2+\sqrt{5}$ ……②
      source_flow: 예시답안 p.6
      criteria:
      - 3.A2
    - id: 3b-5
      content: |
        ①과 ②에 의하여 $\dfrac{3+\sqrt{13}}{2}<k<2+\sqrt{5}$
      source_flow: 예시답안 p.6
      criteria:
      - 3.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: 꼭짓점의 좌표 $\left(\dfrac{1}{k},\ k-\dfrac{1}{k}-3\right)$를 구했다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 2
      evidence: 조건에서 $0<\dfrac{1}{k}<1,\ 0<k-\dfrac{1}{k}-3<1$을 세웠다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 1
      evidence: $0<\dfrac{1}{k}<1$에서 $k>1$을 구했다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: $0<k-\dfrac{1}{k}-3<1$에서 $k<\dfrac{3-\sqrt{13}}{2}$ 또는 $k>\dfrac{3+\sqrt{13}}{2}$이고 $2-\sqrt{5}<k<2+\sqrt{5}$를 구했다.
      depends_on:
      - 3.M2
      steps:
      - 3b-4
    - id: 3.A3
      mark_type: A
      points: 2
      evidence: 두 범위의 공통부분 $\dfrac{3+\sqrt{13}}{2}<k<2+\sqrt{5}$를 구했다.
      depends_on:
      - 3.M2
      - 3.A1
      - 3.A2
      steps:
      - 3b-5
