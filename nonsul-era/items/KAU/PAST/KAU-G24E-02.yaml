- id: '4'
  stem: |
    [문제 2-4] 구간 $(\sqrt{2},\ \infty)$에서 정의된 함수 $f(x)=x+\dfrac{2}{x}$와 구간 $(1,\ \infty)$에서 정의된 함수 $g(x)=\ln x$가 있다. 곡선 $y=f(x)$ 위에서 움직이는 점 $\mathrm{P}(t,\ f(t))$에서의 접선을 $l$이라 할 때, 직선 $l$과 평행하고 곡선 $y=g(x)$에 접하는 직선을 $m$, 직선 $m$이 곡선 $y=g(x)$에 접하는 점을 $\mathrm{Q}(s,\ g(s))$라 하자. 다음 물음에 답하시오.
    (1) $s$를 $t$에 대한 식으로 나타내시오.
    (2) 접선 $l$이 $y$축과 만나는 점을 $\mathrm{L}$, 접선 $m$이 $y$축과 만나는 점을 $\mathrm{M}$이라 할 때, $\overline{\mathrm{LM}}$의 최댓값을 구하시오.
  points: 20
  depends_on: []
  answer:
    kind: value
    value: s=t**2/(t**2-2); max=3-log(2)
    equivalents:
    - (1) $s=\dfrac{t^2}{t^2-2}$ (2) $3-\ln2$
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        미분을 통해 접선 $l$과 $m$의 기울기를 구하면 다음과 같다.
        $f'(x)=\dfrac{x^2-2}{x^2}$ (또는 $f'(x)=1-\dfrac{2}{x^2}$)
        $g'(x)=\dfrac{1}{x}$
      source_flow: 예시답안 p.15
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        두 접선 $l$과 $m$이 평행하므로 $f'(t)=g'(s)$
        $\dfrac{1}{s}=\dfrac{t^2-2}{t^2}$이므로, $s=\dfrac{t^2}{t^2-2}$의 관계가 성립한다.
      source_flow: 예시답안 p.15
      criteria:
      - 4.A1
    - id: 4b-3
      content: |
        접선의 방정식으로부터,
        $l:y=f'(t)(x-t)+f(t)=\left(\dfrac{t^2-2}{t^2}\right)(x-t)+\left(\dfrac{t^2+2}{t}\right)=\left(\dfrac{t^2-2}{t^2}\right)x-\left(\dfrac{t^2-2}{t}\right)+\left(\dfrac{t^2+2}{t}\right)=\left(\dfrac{t^2-2}{t^2}\right)x+\dfrac{4}{t}$
        (또는 $l:y=\left(1-\dfrac{2}{t^2}\right)x+\dfrac{4}{t}$)
      source_flow: 예시답안 p.15
      criteria:
      - 4.M2
    - id: 4b-4
      content: |
        $m:y=g'(s)(x-s)+g(s)=\dfrac{1}{s}(x-s)+\ln(s)=\left(\dfrac{t^2-2}{t^2}\right)\left(x-\dfrac{t^2}{t^2-2}\right)+\ln\left(\dfrac{t^2}{t^2-2}\right)=\left(\dfrac{t^2-2}{t^2}\right)x-1+\ln\left(\dfrac{t^2}{t^2-2}\right)$
        (또는 $m:y=\left(1-\dfrac{2}{t^2}\right)x-1+\ln\left(\dfrac{t^2}{t^2-2}\right)$)
      source_flow: 예시답안 p.15
      criteria:
      - 4.M3
    - id: 4b-5
      content: |
        두 접선 $l$과 $m$이 평행하므로 $\overline{\mathrm{LM}}$을 $t$에 대한 함수 $h(t)$로 나타내면
        $\overline{\mathrm{LM}}=h(t)=\dfrac{4}{t}+1-\ln\left(\dfrac{t^2}{t^2-2}\right)$ (함수의 개형에서 점 $\mathrm{L}$의 $y$좌표가 점 $\mathrm{M}$의 $y$좌표보다 큼)
        (또는) $\overline{\mathrm{LM}}=\dfrac{4}{t}+1-2\ln t+\ln(t+\sqrt{2})+\ln(t-\sqrt{2})$
      source_flow: 예시답안 p.15-16
      criteria:
      - 4.M4
    - id: 4b-6
      content: |
        $h(t)$의 최댓값을 구하기 위해 $t$에 대한 도함수를 구하면,
        $h'(t)=-\dfrac{4}{t^2}-\dfrac{\dfrac{2t(t^2-2)-2t^3}{(t^2-2)^2}}{\left(\dfrac{t^2}{t^2-2}\right)}=-\dfrac{4}{t^2}+\dfrac{4t}{t^2(t^2-2)}=\dfrac{-4t^2+4t+8}{t^2(t^2-2)}$ (또는 $h'(t)=\dfrac{-4(t+1)(t-2)}{t^2(t^2-2)}$)
        $t=-1,\ t=2$일 때 $\overline{\mathrm{LM}}$이 극값을 가짐.
        (또는) $h'(t)=-\dfrac{4}{t^2}-\dfrac{2}{t}+\dfrac{1}{t+\sqrt{2}}+\dfrac{1}{t-\sqrt{2}}=-\dfrac{4(t^2-2)}{t^2(t^2-2)}-\dfrac{2t(t^2-2)}{t^2(t^2-2)}+\dfrac{2t^3}{t^2(t^2-2)}=\dfrac{-4t^2+4t+8}{t^2(t^2-2)}$
      source_flow: 예시답안 p.16
      criteria:
      - 4.M5
    - id: 4b-7
      content: |
        함수 $f(x)$의 정의역의 범위로부터 $t=2$ 주변에서 $h(t)$의 증가와 감소를 조사하면
        $t=\sqrt{3}$에서 $h'(t)>0$, $2$ 직전 $+$(증가), $t=2$에서 $0$, $2$ 직후 $-$(감소), $t=3$에서 $-$ ($\overline{\mathrm{LM}}$의 값은 $t=\sqrt{3}$에서 $\dfrac{3+4\sqrt{3}}{3}-\ln3$, $t=2$에서 $3-\ln2$, $t=3$에서 $\dfrac{7}{3}-\ln\left(\dfrac{9}{7}\right)$)
        $t=2$일 때, $h(t)=\overline{\mathrm{LM}}$이 극댓값을 갖고 극점은 하나이다. 그때의 $\overline{\mathrm{LM}}$ 값은 $3-\ln2$.
      source_flow: 예시답안 p.16-17
      criteria:
      - 4.A2
