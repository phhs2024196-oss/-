stimuli:
- label: 가
  body: |
    좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 위치 $(x,\ y)$가 $x=f(t),\ y=g(t)$일 때, $t=a$에서 $t=b$까지 점 $\mathrm{P}$가 움직인 거리 $s$는 다음과 같다.
    $$s=\int_a^b\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}\,dt=\int_a^b\sqrt{\{f'(t)\}^2+\{g'(t)\}^2}\,dt$$
- label: 나
  body: |
    두 함수 $y=f(x),\ y=g(x)$가 닫힌구간 $[a,\ b]$에서 연속일 때, 두 곡선 $y=f(x),\ y=g(x)$ 및 두 직선 $x=a,\ x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b\lvert f(x)-g(x)\rvert\,dx$$
- label: 다
  body: |
    탄젠트함수의 덧셈정리는 다음과 같다.
    $$\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta},\quad \tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$$
- label: 라
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(a,\ f(a))$에서의 접선의 방정식은 다음과 같다.
    $$y-f(a)=f'(a)(x-a)$$
stem: |
  【문제 2】 (50점)

  ※ 다음 제시문을 읽고 물음에 대한 풀이 과정과 답을 작성하시오.(답만 기재하면 0점 처리)
subparts:
- id: '1'
  stem: |
    [문제 2-1] 좌표평면 위에서 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 위치 $(x,\ y)$가
    $$x(t)=t^2\sin t,\quad y(t)=t^2\cos t$$
    이다. $t=0$에서 $t=a$까지 점 $\mathrm{P}$가 움직인 거리가 $\dfrac{19}{3}$일 때, $a$의 값을 구하시오. (단, $a>0$)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: sqrt(5)
    equivalents:
    - $\sqrt{5}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        매개변수 $t$에 대하여 위치 $x(t),\ y(t)$를 미분하면
        $\dfrac{dx}{dt}=t(2\sin t+t\cos t)$
        $\dfrac{dy}{dt}=t(2\cos t-t\sin t)$
      source_flow: 예시답안 p.11
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        시각 $t=0$에서 $t=a$까지 점 $\mathrm{P}$가 움직인 거리 $s$는 다음과 같다.
        $s=\displaystyle\int_0^a\sqrt{\{x'(t)\}^2+\{y'(t)\}^2}\,dt$
        $=\displaystyle\int_0^a\sqrt{t^2(4\sin^2t+4t\sin t\cos t+t^2\cos^2t)+t^2(4\cos^2t-4t\sin t\cos t+t^2\sin^2t)}\,dt$
        $=\displaystyle\int_0^at\sqrt{4(\sin^2t+\cos^2t)+t^2(\sin^2t+\cos^2t)}\,dt$
        $\sin^2x+\cos^2x=1$이므로, $s=\displaystyle\int_0^at\sqrt{4+t^2}\,dt$
      source_flow: 예시답안 p.11
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        시각 $t=0$일 때 점 $(0,\ 0)$을 출발하여 움직인 거리가 $\dfrac{19}{3}$가 될 때의 양의 시각 $a$는
        $\displaystyle\int_0^at\sqrt{4+t^2}\,dt=\left[\dfrac{1}{3}(t^2+4)^{\frac{3}{2}}\right]_0^a$
      source_flow: 예시답안 p.12
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $\dfrac{1}{3}(a^2+4)^{\frac{3}{2}}-\dfrac{8}{3}=\dfrac{19}{3}$
        따라서 $a=\sqrt{5}$
      source_flow: 예시답안 p.12
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 매개변수로 나타낸 함수를 미분해 $x'(t)=t(2\sin t+t\cos t),\ y'(t)=t(2\cos t-t\sin t)$를 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 제시문 가)의 거리 공식을 세우고 $\sin^2t+\cos^2t=1$로 정리해 $s=\displaystyle\int_0^at\sqrt{4+t^2}\,dt$를 얻었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: 치환적분(또는 동치 방법)으로 $\left[\dfrac{1}{3}(t^2+4)^{\frac{3}{2}}\right]_0^a$를 구했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: $a=\sqrt{5}$를 구했다.
      depends_on:
      - 1.M2
      - 1.A1
      steps:
      - 1b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [문제 2-2] 구간 $[0,\ \pi]$에서 정의된 두 함수 $f(x)=\cos x$와 $g(x)=ax\sin x$가 있다. 두 곡선 $y=f(x),\ y=g(x)$ 및 $y$축으로 둘러싸인 도형의 넓이를 $S_1$, 두 곡선 $y=f(x),\ y=g(x)$ 및 직선 $x=\pi$로 둘러싸인 도형의 넓이를 $S_2$라 할 때, $S_2-S_1$의 값을 구하시오. (단, $a>0$)
  points: 11
  depends_on: []
  answer:
    kind: value
    value: a*pi
    equivalents:
    - $a\pi$
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 함수 $f(x)$와 $g(x)$가 연속인 도함수를 가지므로 닫힌구간 $[c,\ d]$에서
        $\displaystyle\int_c^df(x)\,dx=\left[\sin x\right]_c^d$ (또는) $\displaystyle\int f(x)\,dx=\sin x$라면 적분상수를 포함해야 함
      source_flow: 예시답안 p.12
      criteria:
      - 2.B1
    - id: 2b-2
      content: |
        부분적분법을 이용하면,
        $\displaystyle\int_c^dg(x)\,dx=a\left(\left[-x\cos x\right]_c^d-\int_c^d-\cos x\,dx\right)=\left[a(\sin x-x\cos x)\right]_c^d$
      source_flow: 예시답안 p.12
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        두 곡선 $y=f(x)$와 $y=g(x)$가 점 $\mathrm{P}(x_1,\ f(x_1))$에서 만날 때,
        $S_1=\displaystyle\int_0^{x_1}(\cos x-ax\sin x)\,dx=\left[\sin x-a\sin x+ax\cos x\right]_0^{x_1}=\sin x_1-a\sin x_1+ax_1\cos x_1$
        $S_2=\displaystyle\int_{x_1}^{\pi}(ax\sin x-\cos x)\,dx=\left[a\sin x-ax\cos x-\sin x\right]_{x_1}^{\pi}=a\pi-(a\sin x_1-ax_1\cos x_1-\sin x_1)$
      source_flow: 예시답안 p.12-13
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        $S_2-S_1=a\pi$
      source_flow: 예시답안 p.13
      criteria:
      - 2.A1
  - id: S2-ALT1
    audience: ALT
    method_no: 2
    steps:
    - id: 2a-1
      content: |
        두 곡선 $y=f(x)$와 $y=g(x)$가 점 $\mathrm{P}(x_1,\ f(x_1))$에서 만날 때,
        $S_2-S_1=\displaystyle\int_{x_1}^{\pi}(ax\sin x-\cos x)\,dx-\int_0^{x_1}(\cos x-ax\sin x)\,dx$
        $=\displaystyle\int_{x_1}^{\pi}(ax\sin x-\cos x)\,dx+\int_0^{x_1}(ax\sin x+\cos x)\,dx$
      source_flow: 예시답안 p.13
      criteria:
      - 2.M2
    - id: 2a-2
      content: |
        $=\displaystyle\int_0^{\pi}(ax\sin x-\cos x)\,dx=\left[a\sin x-ax\cos x-\sin x\right]_0^{\pi}$
        $S_2-S_1=a\pi$
      source_flow: 예시답안 p.13
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: $\displaystyle\int f(x)\,dx=\sin x$(정적분이면 $[\sin x]_c^d$)를 구했다.
      steps:
      - 2b-1
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: 부분적분법으로 $\displaystyle\int g(x)\,dx=a(\sin x-x\cos x)$를 구했다.
      steps:
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: 두 곡선의 교점 $x_1$을 경계로 $S_1=\displaystyle\int_0^{x_1}(f-g)\,dx,\ S_2=\displaystyle\int_{x_1}^{\pi}(g-f)\,dx$를 세워 계산했다.
      depends_on:
      - 2.B1
      - 2.M1
      steps:
      - 2b-3
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: $S_2-S_1=a\pi$를 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [문제 2-3] 두 함수 $f(x)=e^x,\ g(x)=e^{ax-1}$의 그래프가 점 $\mathrm{P}$에서 만날 때, 점 $\mathrm{P}$에서 곡선 $y=f(x)$의 접선이 $x$축과 만나는 점을 $\mathrm{A}$, 점 $\mathrm{P}$에서 곡선 $y=g(x)$의 접선이 $x$축과 만나는 점을 $\mathrm{B}$라 하자. $\tan(\angle\mathrm{APB})$를 $a$에 대한 식으로 나타내시오. (단, $a>1$)
  points: 11
  depends_on: []
  answer:
    kind: value
    value: (a-1)*exp(1/(a-1))/(a*exp(2/(a-1))+1)
    equivalents:
    - $\dfrac{(a-1)e^{\frac{1}{a-1}}}{ae^{\frac{2}{a-1}}+1}$
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        두 곡선 $y=f(x)$와 $y=g(x)$가 점 $\mathrm{P}(x_1,\ f(x_1))$에서 만난다고 할 때,
        $f(x_1)=e^{x_1}=g(x_1)=e^{ax_1-1}$이므로 $x_1=\dfrac{1}{a-1}$ (이때, $f(x_1)=e^{\frac{1}{a-1}}$)
      source_flow: 예시답안 p.13
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $f'(x_1)=e^{x_1}=e^{\frac{1}{a-1}}$
        $g'(x_1)=ae^{ax_1-1}=ae^{\frac{1}{a-1}}$
      source_flow: 예시답안 p.13
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $\tan(\angle\mathrm{APB})$는 점 $\mathrm{P}$에서 두 곡선 $y=f(x),\ y=g(x)$의 접선으로부터 $\tan(\angle\mathrm{APB})=\tan(g'(x_1)-f'(x_1))$
        탄젠트함수의 덧셈정리로부터
        $\tan(\angle\mathrm{APB})=\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$이므로,
        $\tan(\angle\mathrm{APB})=\dfrac{ae^{ax_1-1}-e^{x_1}}{1+e^{x_1}ae^{ax_1-1}}$
      source_flow: 예시답안 p.13-14
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        $x_1=\dfrac{1}{a-1}$이므로,
        $\tan(\angle\mathrm{APB})=\dfrac{(a-1)e^{\frac{1}{a-1}}}{ae^{\frac{2}{a-1}}+1}$
      source_flow: 예시답안 p.14
      criteria:
      - 3.A1
  - id: S3-ALT1
    audience: ALT
    method_no: 2
    steps:
    - id: 3a-1
      content: |
        점 $\mathrm{Q}$에서 $x$축에 내린 수선의 발을 점 $\mathrm{H}$라 하자. $\angle\mathrm{APH}=\alpha,\ \angle\mathrm{BPH}=\beta$라 하면
        $\tan\alpha=\dfrac{1}{f'(x_1)}=\dfrac{1}{e^{x_1}}$
        $\tan\beta=\dfrac{1}{g'(x_1)}=\dfrac{1}{ae^{ax_1-1}}$
      source_flow: 예시답안 p.14
      criteria:
      - 3.M3
    - id: 3a-2
      content: |
        탄젠트함수의 덧셈정리로부터 $\tan(\angle\mathrm{APB})=\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$이므로,
        $\tan(\angle\mathrm{APB})=\dfrac{\dfrac{1}{e^{x_1}}-\dfrac{1}{ae^{ax_1-1}}}{1+\dfrac{1}{e^{x_1}}\cdot\dfrac{1}{ae^{ax_1-1}}}=\dfrac{ae^{ax_1-1}-e^{x_1}}{e^{x_1}ae^{ax_1-1}+1}$
        $x_1=\dfrac{1}{a-1}$이므로, $\tan(\angle\mathrm{APB})=\dfrac{(a-1)e^{\frac{1}{a-1}}}{ae^{\frac{2}{a-1}}+1}$
      source_flow: 예시답안 p.14
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: 두 곡선이 만나는 점의 $x$좌표 $x_1=\dfrac{1}{a-1}$을 구했다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: $x_1$에서 $f'(x_1)=e^{\frac{1}{a-1}},\ g'(x_1)=ae^{\frac{1}{a-1}}$를 구했다(지수함수의 미분, 접선의 기울기).
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.M3
      mark_type: M
      points: 3
      evidence: 탄젠트함수의 덧셈정리(제시문 다)를 접선의 기울기에 적용해 $\tan(\angle\mathrm{APB})$의 식을 세웠다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: $\tan(\angle\mathrm{APB})=\dfrac{(a-1)e^{\frac{1}{a-1}}}{ae^{\frac{2}{a-1}}+1}$를 구했다.
      depends_on:
      - 3.M3
      steps:
      - 3b-4
