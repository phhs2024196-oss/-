stimuli:
- label: 가
  body: |
    복소수 $a+bi$ ($a,\ b$는 실수)의 허수부분의 부호를 바꾼 복소수 $a-bi$를 $a+bi$의 켤레복소수라 하고, 이것을 기호로
    $$\overline{a+bi}$$
    로 나타낸다. 즉, $\overline{a+bi}=a-bi$이다. (단, $i=\sqrt{-1}$)
- label: 나
  body: |
    두 함수 $f:X\to Y,\ g:Y\to Z$의 합성함수는
    $$g\circ f:X\to Z,\quad (g\circ f)(x)=g(f(x))$$
    이다.
- label: 다
  body: |
    자연수 $n$에 대한 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.
    (i) $n=1$일 때 명제 $p(n)$이 성립한다.
    (ii) $n=k$일 때 명제 $p(n)$이 성립한다고 가정하면, $n=k+1$일 때도 명제 $p(n)$이 성립한다.
- label: 라
  body: |
    첫째항부터 차례대로 일정한 수를 곱하여 만든 수열을 등비수열이라 하고, 곱하는 일정한 수를 공비라고 한다. 공비가 $r$인 등비수열 $\{a_n\}$에서 제 $n$항에 공비 $r$를 곱하면 제 $(n+1)$항이 되므로
    $$a_{n+1}=ra_n\ (n=1,\ 2,\ 3,\ \cdots)$$
    이 성립한다.
stem: |
  【문제 1】 (50점)

  ※ 다음 제시문을 읽고 물음에 대한 풀이 과정과 답을 작성하시오.(답만 기재하면 0점 처리)
subparts:
- id: '1'
  stem: |
    [문제 1-1] 이차방정식 $x^2+px+q=0$의 한 근 $z=a+bi$가
    $$z^2=-\dfrac{\bar{z}}{2},\quad \dfrac{b}{a}=-\sqrt{3}$$
    을 만족할 때, 두 실수 $p$와 $q$를 구하시오. (단, $a,\ b$는 실수이고 $a\neq0$)
  points: 7
  depends_on: []
  answer:
    kind: value
    value: p=-1/2; q=1/4
    equivalents:
    - $p=-\dfrac{1}{2},\ q=\dfrac{1}{4}$ (예시답안은 $\alpha=-\dfrac{1}{2},\ \beta=\dfrac{1}{4}$로 표기)
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        예시) $z=a(1-\sqrt{3}\,i)$이므로 $z^2=a^2(-2-2\sqrt{3}\,i),\ \bar{z}=a(1+\sqrt{3}\,i)$ 즉, $-2a^2=\dfrac{a}{-2},\ a=\dfrac{1}{4}$
        그 외 논리적인 방법인 경우
      source_flow: 예시답안 p.6
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\alpha=-2a=-\dfrac{1}{2}$
      source_flow: 예시답안 p.6
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\beta=\left(-\dfrac{1}{4}+\dfrac{\sqrt{3}}{4}i\right)\left(-\dfrac{1}{4}-\dfrac{\sqrt{3}}{4}i\right)=\dfrac{1}{4}$
        $\alpha=-\dfrac{1}{2},\ \beta=\dfrac{1}{4}$
      source_flow: 예시답안 p.7
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 켤레복소수의 성질(제시문 가)을 이용해 논리적으로 $a=\dfrac{1}{4}$ 등 근을 결정했다(여러 방법 가능).
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $p=-\dfrac{1}{2}$(예시답안의 $\alpha$)을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $q=\dfrac{1}{4}$(예시답안의 $\beta$)을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [문제 1-2] 두 함수 $f(x)=\begin{cases}x&(x\ge0)\\0&(x<0)\end{cases},\ g(x)=-(x-k)^2+4$에 대하여 정적분 $\displaystyle\int_{-5}^{4}(f\circ g)(x)\,dx$의 값을 $h(k)$라고 하자. 다음 물음에 답하시오. (단, $k$는 실수)
    (1) $h(k)$가 최대가 되도록 하는 $k$의 값의 범위를 구하시오.
    (2) $h(k)$의 최댓값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: range=-3<=k<=2; max=32/3
    equivalents:
    - (1) $-3\le k\le2$ (2) $\dfrac{32}{3}$
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1) 예시1) 합성함수의 그래프를 그려 이를 바탕으로 $k$값의 범위를 찾는 경우 [그림 2: $x$축 위의 세 점 $(k-2,\ 0),\ (k,\ 0),\ (k+2,\ 0)$과 구간 $[k-2,\ k+2]$ 위의 위로 볼록한 곡선]
        예시2) 합성함수의 적분을 하는 경우
        그 외 논리적 설명이 있는 경우
      source_flow: 예시답안 p.7
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        한 쪽 또는 두 쪽의 부등호에 같다가 없는 경우 -1점 예시) $-3<k\le2$
        정답) $-3\le k\le2$
      source_flow: 예시답안 p.7
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        (2) $k$는 $-3\le k\le2$ 사이의 어느 숫자도 가능함.
        예시 과정) $\displaystyle\int_{-5}^{-1}(f\circ g)(x)\,dx=\int_{2}^{-2}g(x)\,dx\ (\because k=0)$
      source_flow: 예시답안 p.7
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        $\dfrac{32}{3}$  정답) $\dfrac{32}{3}$
      source_flow: 예시답안 p.7
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
