    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: $f(g(x))$의 그래프를 그리거나 영역을 나누어 적분하는 식으로 $h(k)$의 구조를 밝혔다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
