    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [문제 1-3] $h>0$일 때, 자연수 $n$에 대하여 두 수열 $\{a_n\},\ \{b_n\}$이
    $$a_1=1,\ a_{n+1}=a_n+h,$$
    $$b_1=1,\ b_{n+1}=b_n(1+h)$$
    이다. 수학적 귀납법을 이용하여 $n\ge3$일 때, $a_n$과 $b_n$의 대소관계를 비교하려고 한다. 다음 물음에 답하시오.
    (1) $n=3$일 때 $b_3-a_3>0$임을 보이시오.
    (2) $n=k\ (k\ge3)$일 때 $b_k-a_k>0$이 성립한다고 가정하면, $b_{k+1}-a_{k+1}>0$임을 보이시오.
    (3) (1)과 (2)를 통하여 알 수 있는 결론을 쓰시오.
  points: 16
  depends_on: []
  answer:
    kind: value
    value: b3-a3=h**2
    equivalents:
    - (1) $b_3-a_3=h^2>0$ (2) $b_{k+1}-a_{k+1}>a_k h>0$ (3) $n\ge3$인 모든 자연수 $n$에 대하여 $b_n>a_n$
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1) $b_3=b_2(1+h)=b_1(1+h)^2=(1+h)^2$
        $a_3=a_2+h=a_1+2h=1+2h$
        $b_3-a_3=(1+h)^2-(1+2h)=1+2h+h^2-(1+2h)=h^2>0$
      source_flow: 예시답안 p.8
      criteria:
      - 3.B1
      - 3.B2
      - 3.A1
    - id: 3b-2
      content: |
        (2) $b_{k+1}=b_k(1+h)>a_k(1+h)=a_k+ha_k>a_k+h=a_{k+1}$
      source_flow: 예시답안 p.8
      criteria:
      - 3.R1
    - id: 3b-3
      content: |
        (3) (1)과 (2)에 의하여 $n\ge3$인 모든 자연수 $n$에 대하여 $b_n>a_n$이 성립한다.
        또는 (1)과 (2)에 의하여 $n\ge1$인 모든 자연수 $n$에 대하여 $b_n\ge a_n$이 성립한다.
      source_flow: 예시답안 p.8
      criteria:
      - 3.R2
      - 3.R3
      - 3.R4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.B1
      mark_type: M
      points: 2
      evidence: $a_3=1+2h$를 맞게 구했다.
      steps:
      - 3b-1
    - id: 3.B2
      mark_type: M
      points: 2
      evidence: $b_3=(1+h)^2$를 맞게 구했다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: 계산해 $b_3-a_3=h^2>0$임을 보였다(작은 계산 실수가 있으면 $-3$점).
      depends_on:
      - 3.B1
      - 3.B2
      steps:
      - 3b-1
    - id: 3.R1
      mark_type: R
      points: 5
      evidence: $b_k-a_k>0$의 가정으로 $b_{k+1}-a_{k+1}>0$임을 계산해 보였다.
      steps:
      - 3b-2
    - id: 3.R2
      mark_type: R
      points: 2
      evidence: 결론에 $n\ge3$ 조건이 있다.
      steps:
      - 3b-3
    - id: 3.R3
      mark_type: R
      points: 1
      evidence: 결론에 모든 자연수 $n$ 조건이 있다.
      steps:
      - 3b-3
    - id: 3.R4
      mark_type: R
      points: 2
      evidence: 결론으로 $b_n>a_n$을 썼다.
      depends_on:
      - 3.R2
      - 3.R3
      steps:
      - 3b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '4'
  stem: |
    [문제 1-4] 아래 그림과 같이 좌표평면 위의 네 점 $\mathrm{A}_1(0,\ 0),\ \mathrm{A}_2(4,\ 0),\ \mathrm{B}_1(4,\ 4),\ \mathrm{C}_1(0,\ 4)$를 꼭짓점으로 하는 정사각형을 $R_1$이라 하자. 정사각형 $R_1$의 네 변 $\mathrm{A}_1\mathrm{A}_2,\ \mathrm{A}_2\mathrm{B}_1,\ \mathrm{B}_1\mathrm{C}_1,\ \mathrm{C}_1\mathrm{A}_1$의 중점을 각각 $\mathrm{C}_2,\ \mathrm{D}_1,\ \mathrm{E}_1,\ \mathrm{F}_1$이라 하고, 두 선분 $\mathrm{C}_2\mathrm{E}_1$와 $\mathrm{D}_1\mathrm{F}_1$의 교점을 $\mathrm{G}_1$이라 할 때, 정사각형 $\mathrm{G}_1\mathrm{C}_2\mathrm{B}_1\mathrm{D}_1$에 내접하는 원 $O_1$을 그린다.

    선분 $\mathrm{A}_2\mathrm{C}_2$을 한 변으로 하는 정사각형 중 오른쪽 정사각형을 $R_2$라 하고, $x$축 위의 꼭짓점 중 오른쪽 점을 $\mathrm{A}_3$라 하자. 정사각형 $R_2$의 네 변의 중점을 각각 $\mathrm{C}_3,\ \mathrm{D}_2,\ \mathrm{E}_2,\ \mathrm{F}_2$라 하고, 두 선분 $\mathrm{C}_3\mathrm{E}_2$와 $\mathrm{D}_2\mathrm{F}_2$의 교점을 $\mathrm{G}_2$라 할 때, 정사각형 $\mathrm{G}_2\mathrm{C}_3\mathrm{B}_2\mathrm{D}_2$에 내접하는 원 $O_2$를 그린다. 이와 같은 과정을 계속하여 $n$번째 그린 원을 $O_n$이라 하자.

