stimuli:
- label: 가
  body: |
    방정식 $f(x)=g(x)$의 실근은 두 함수 $y=f(x),\ y=g(x)$의 그래프의 교점의 $x$좌표와 같다. 따라서 방정식 $f(x)=g(x)$의 서로 다른 실근의 개수는 두 함수 $y=f(x),\ y=g(x)$의 그래프의 교점의 개수와 같다.
- label: 나
  body: |
    계수가 실수인 이차방정식 $ax^2+bx+c=0\ (a\neq0)$에서 판별식 $D=b^2-4ac$일 때
    (1) $D>0$이면 서로 다른 두 실근을 가진다.
    (2) $D=0$이면 서로 같은 두 실근(중근)을 가진다.
    (3) $D<0$이면 서로 다른 두 허근을 가진다.
- label: 다
  body: |
    첫째항부터 차례로 일정한 수를 더하여 만든 수열을 등차수열이라 하고, 더하는 일정한 수를 공차라고 한다.
- label: 라
  body: |
    이차방정식 $ax^2+bx+c=0\ (a\neq0)$의 두 근을 $\alpha,\ \beta$라고 하면, 다음 등식이 성립한다.
    $$\alpha+\beta=-\dfrac{b}{a},\ \alpha\beta=\dfrac{c}{a}$$
- label: 마
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 $f(x)$의 부정적분 중의 하나를 $F(x)$라고 하면, $f(x)$의 $a$부터 $b$까지의 정적분은 $\displaystyle\int_a^bf(x)dx=\left[F(x)\right]_a^b=F(b)-F(a)$이다.
stem: |
  【문제 2】 (50점)

  ※ 다음 제시문을 읽고 물음에 대한 풀이 과정과 답을 제시하시오.(답만 기재하면 0점 처리)
subparts:
- id: '1'
  stem: |
    [문제 2-1] 삼차함수 $f(x)=-x^3+6x$가 $x=a$에서 극솟값을 가지고 $x=b$에서 극댓값을 가질 때, 두 점 $(a,\ f(a)),\ (b,\ f(b))$를 지나는 직선의 기울기를 $m$이라고 하자. 다음 물음에 답하시오.
    (1) $m$의 값을 구하시오.
    (2) 직선 $y=mx+k$와 곡선 $y=f(x)$가 만나는 점의 개수가 3이 되도록 하는 실수 $k$의 값의 범위를 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: m=4; range=-4*sqrt(6)/9<k<4*sqrt(6)/9
    equivalents:
    - (1) $m=4$ (2) $-\dfrac{4\sqrt{6}}{9}<k<\dfrac{4\sqrt{6}}{9}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (1) $f'(x)=-3x^2+6$이므로 $x=\pm\sqrt{2}$일 때, $f'(x)=0$.
        $x=\pm\sqrt{2}$에서 $f(x)$의 증가와 감소를 조사하면 $x=-\sqrt{2}$에서 극소($f'(x)$의 부호 $-,\ 0,\ +$), $x=\sqrt{2}$에서 극대($+,\ 0,\ -$)
        따라서 $x=-\sqrt{2}$에서 극솟값 $-4\sqrt{2}$를 갖고 $x=\sqrt{2}$에서 극댓값 $4\sqrt{2}$를 갖는다.
      source_flow: 예시답안 p.14
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        그러므로 $(-\sqrt{2},-4\sqrt{2})$와 $(\sqrt{2},4\sqrt{2})$를 지나는 직선의 기울기는 $m=\dfrac{4\sqrt{2}-(-4\sqrt{2})}{\sqrt{2}-(-\sqrt{2})}=4$이다.
      source_flow: 예시답안 p.14
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        (2) 직선 $y=4x+k$와 $y=f(x)$가 만나는 점은 $4x+k=f(x)$가 만나는 점의 개수이므로, $y=k$와 $y=-x^3+2x$의 교점의 개수를 구하자. 즉,
        $g(x)=-x^3+2x$라 할 때, $g'(x)=-3x^2+2$이므로, $x=\pm\sqrt{\dfrac{2}{3}}$일 때 $g'(x)=0$이다.
        $g(x)$의 증가와 감소를 조사하면 $x=-\sqrt{\dfrac{2}{3}}$에서 극솟값 $-\dfrac{4\sqrt{6}}{9}$ ($g'(x)$의 부호 $-,\ 0,\ +$), $x=\sqrt{\dfrac{2}{3}}$에서 극댓값 $\dfrac{4\sqrt{6}}{9}$ ($+,\ 0,\ -$)
      source_flow: 예시답안 p.14
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        따라서 $y=f(x)$는 $-\dfrac{4\sqrt{6}}{9}<k<\dfrac{4\sqrt{6}}{9}$일 때 $y=4x+k$와 서로 다른 세 점에서 만난다.
      source_flow: 예시답안 p.14
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 미분해 증감표(또는 그래프 개형)로 극솟값 $-4\sqrt{2}$, 극댓값 $4\sqrt{2}$를 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: 두 점을 지나는 직선의 기울기 $m=4$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 교점의 개수를 $y=k$와 $g(x)=-x^3+2x$의 교점 개수로 바꿔 증감표(개형)로 극값 $\mp\dfrac{4\sqrt{6}}{9}$를 구했다.
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: 교점이 3개가 되는 $k$의 범위 $-\dfrac{4\sqrt{6}}{9}<k<\dfrac{4\sqrt{6}}{9}$를 구했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [문제 2-2] $x$에 대한 이차방정식 $3x^2-5(a+1)x+3a^2=0$이 서로 다른 양의 실근 $\alpha,\ \beta\ (\alpha<\beta)$를 가질 때, 다음 물음에 답하시오. (단, $a$는 실수)
    (1) $a$의 값의 범위를 구하시오.
    (2) $-\sqrt{\beta},\ -\sqrt{\alpha},\ \sqrt{\alpha},\ \sqrt{\beta}$가 이 순서대로 등차수열이 되도록 하는 $a$의 값을 모두 구하시오.
  points: 13
  depends_on: []
  answer:
    kind: value
    value: range1=-5/11<a<0; range2=0<a<5; avals=1,-1/3
    equivalents:
    - (1) $-\dfrac{5}{11}<a<0,\ 0<a<5$ (2) $a=1,\ -\dfrac{1}{3}$
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1) $3x^2-5(a+1)x+3a^2=0$이 서로 다른 두 실근을 가지려면 $D>0$이어야 하므로
        $D=\{5(a+1)\}^2-36a^2=-11a^2+50a+25>0$
        따라서 $-\dfrac{5}{11}<a<5$이다. ……①
      source_flow: 예시답안 p.14
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        그런데 두 근이 모두 양수이려면 두 근의 합과 곱이 0 보다 커야 하므로 $a>-1$과 $a\neq0$을 만족해야 한다. ……②
      source_flow: 예시답안 p.14
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        따라서 ①과 ②에 의해 $-\dfrac{5}{11}<a<0,\ 0<a<5$이다.
      source_flow: 예시답안 p.14
      criteria:
      - 2.A1
    - id: 2b-4
      content: |
        (2) $-\sqrt{\beta},-\sqrt{\alpha},\sqrt{\alpha},\sqrt{\beta}$의 순서로 등차수열을 이루고 있으므로, 등차수열의 성질에 의해 $2\sqrt{\alpha}=-\sqrt{\alpha}+\sqrt{\beta}$이므로 $3\sqrt{\alpha}=\sqrt{\beta}$, 즉 $\beta=9\alpha$이다.
        또한 근과 계수의 관계에 의해 $\alpha+\beta=\alpha+9\alpha=\dfrac{5}{3}(a+1)$ ……①이고 $\alpha\beta=9\alpha^2=a^2$ ……②이므로,
      source_flow: 예시답안 p.15
      criteria:
      - 2.M3
    - id: 2b-5
      content: |
        ①에서 $\alpha=\dfrac{1}{6}(a+1)$를 ②에 대입하면, $\dfrac{1}{4}(a+1)^2=a^2$.
        $a$에 대한 이차방정식을 풀면 $a$의 값은 $1,\ -\dfrac{1}{3}$.
      source_flow: 예시답안 p.15
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 서로 다른 두 실근의 조건 $D>0$으로 $-\dfrac{5}{11}<a<5$를 구했다.
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 1
      evidence: 두 근이 모두 양수일 조건(합·곱이 양수)에서 $a>-1,\ a\neq0$을 구했다.
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: 두 범위의 교집합 $-\dfrac{5}{11}<a<0,\ 0<a<5$를 구했다.
      depends_on:
      - 2.M1
      - 2.M2
      steps:
      - 2b-3
    - id: 2.M3
      mark_type: M
      points: 6
      evidence: 등차수열의 성질과 근과 계수의 관계로 $\beta=9\alpha$, $\alpha+\beta=\dfrac{5}{3}(a+1)$, $\alpha\beta=a^2$ 등 $a$에 대한 조건을 구했다.
      steps:
      - 2b-4
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: $a=1,\ -\dfrac{1}{3}$을 구했다.
      depends_on:
      - 2.M3
      steps:
      - 2b-5
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [문제 2-3] 함수 $f(x)=\begin{cases}\sqrt{x}&(x\ge0)\\x^2&(x<0)\end{cases}$의 그래프와 직선 $y=k$가 서로 다른 두 점 $\mathrm{A}_k,\ \mathrm{B}_k$에서 만날 때, 함수 $h(k)=\cos(\angle\mathrm{A}_k\mathrm{OB}_k)$라 하자. 다음 물음에 답하시오. (단, $\mathrm{O}$는 원점)
    (1) 함수 $h(k)$를 $k$에 대한 식으로 나타내시오.
    (2) $\displaystyle\lim_{k\to\infty}\sqrt{k}\,h(k)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: h=sqrt(k)*(1-sqrt(k))/(sqrt(1+k)*sqrt(1+k**2)); limit=-1
    equivalents:
    - (1) $h(k)=\dfrac{\sqrt{k}(1-\sqrt{k})}{\sqrt{1+k}\sqrt{1+k^2}}$ (2) $-1$
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1) 함수 $f(x)$의 그래프와 직선 $y=k$가 만나는 서로 다른 두 점의 좌표를 구하면 $\mathrm{A}_k(k^2,k),\ \mathrm{B}_k(-\sqrt{k},k)$이다.
      source_flow: 예시답안 p.15
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        코사인법칙에 의하여 $\cos(\angle\mathrm{A}_k\mathrm{OB}_k)=\dfrac{\overline{\mathrm{OA}_k}^2+\overline{\mathrm{OB}_k}^2-\overline{\mathrm{A}_k\mathrm{B}_k}^2}{2\,\overline{\mathrm{OA}_k}\,\overline{\mathrm{OB}_k}}$에서
        $\overline{\mathrm{A}_k\mathrm{B}_k}=\lvert k^2+\sqrt{k}\rvert$이므로, $\overline{\mathrm{OA}_k}=\sqrt{k^2+k^4},\ \overline{\mathrm{OB}_k}=\sqrt{k+k^2},\ \overline{\mathrm{A}_k\mathrm{B}_k}=\sqrt{k^4+2k^2\sqrt{k}+k}$.
        따라서 $\cos(\angle\mathrm{A}_k\mathrm{OB}_k)=\dfrac{\sqrt{k}(1-\sqrt{k})}{\sqrt{1+k}\sqrt{1+k^2}}$.
      source_flow: 예시답안 p.15
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        (2) $\displaystyle\lim_{k\to\infty}\sqrt{k}\,h(k)=\lim_{k\to\infty}\dfrac{k(1-\sqrt{k})}{\sqrt{1+k}\sqrt{1+k^2}}=\lim_{k\to\infty}\dfrac{\dfrac{1}{\sqrt{k}}-1}{\sqrt{\dfrac{1}{k}+1}\sqrt{\dfrac{1}{k^2}+1}}=-1$.
      source_flow: 예시답안 p.15
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: $f(x)$의 그래프와 직선 $y=k$의 교점 $\mathrm{A}_k(k^2,k),\ \mathrm{B}_k(-\sqrt{k},k)$를 구했다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: 코사인법칙으로 $h(k)=\dfrac{\sqrt{k}(1-\sqrt{k})}{\sqrt{1+k}\sqrt{1+k^2}}$를 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: 극한 $\displaystyle\lim_{k\to\infty}\sqrt{k}\,h(k)=-1$을 구했다.
      depends_on:
      - 3.M2
