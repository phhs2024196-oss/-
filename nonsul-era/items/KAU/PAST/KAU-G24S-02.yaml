- id: '4'
  stem: |
    [문제 2-4] 이차함수 $f(x)=x^2-(\alpha+\beta)x+\alpha\beta$가 $\displaystyle\int_0^1f(x)dx=\dfrac{1}{3}$을 만족할 때, 함수
    $$S(\alpha)=\int_{-\alpha}^{\alpha}(2\alpha-1)f(x)dx$$
    는 $\alpha=\alpha_1$에서 최솟값 $m$을 갖는다. 두 상수 $\alpha_1$과 $m$의 값을 각각 구하시오. (단, $\alpha\neq\dfrac{1}{2}$)
  points: 15
  depends_on: []
  answer:
    kind: value
    value: alpha1=-3/4; m=-9/64
    equivalents:
    - $\alpha_1=-\dfrac{3}{4},\ m=-\dfrac{9}{64}$
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $\displaystyle\int_0^1(x^2-(\alpha+\beta)x+\alpha\beta)dx=\dfrac{1}{3}-\dfrac{\alpha+\beta}{2}+\alpha\beta=\dfrac{1}{3}$이므로 $\alpha+\beta=2\alpha\beta$ ……①을 만족한다.
      source_flow: 예시답안 p.15
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        정적분 $S(\alpha)=\displaystyle\int_{-\alpha}^{\alpha}(2\alpha-1)f(x)dx=(2\alpha-1)\left[\dfrac{1}{3}x^3-\dfrac{\alpha+\beta}{2}x^2+\alpha\beta x\right]_{-\alpha}^{\alpha}=(2\alpha-1)\left(\dfrac{2}{3}\alpha^3+2\alpha^2\beta\right)$ ……②
      source_flow: 예시답안 p.15
      criteria:
      - 4.M2
    - id: 4b-3
      content: |
        ②에 ①을 대입하여 정리하면 $S(\alpha)=\dfrac{4}{3}\alpha^4+\dfrac{4}{3}\alpha^3$이므로,
      source_flow: 예시답안 p.15
      criteria:
      - 4.A1
    - id: 4b-4
      content: |
        $S(\alpha)$를 미분하면 $S(\alpha)'=\dfrac{16}{3}\alpha^3+4\alpha^2=\dfrac{4}{3}\alpha^2(4\alpha+3)$이고, $S(\alpha)$의 증가와 감소를 구하면 다음과 같다.
        $x$가 $-\dfrac{3}{4}$, $0$인 곳에서 $S'(\alpha)=0$이고 부호는 $-,\ 0,\ +,\ 0,\ -$ (원문 표 그대로), $S(\alpha)$는 $\searrow$, $-\dfrac{9}{64}$, $\nearrow$, $0$, $\nearrow$
        따라서 $S(\alpha)$는 $\alpha_1=-\dfrac{3}{4}$에서 최솟값 $m=-\dfrac{9}{64}$를 갖는다.
      source_flow: 예시답안 p.16
      criteria:
      - 4.A2
