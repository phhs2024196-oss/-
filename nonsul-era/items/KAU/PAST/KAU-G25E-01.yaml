- id: '4'
  stem: |
    [문제 1-4] 다음 물음에 답하시오.
    (1) 함수의 그래프의 개형을 이용하여 두 함수 $y=\ln x$와 $y=\dfrac{1}{2x}$의 그래프의 교점의 개수를 구하시오.
    (2) 양의 실수 $t$에 대하여 두 함수 $f(x)=(4t^4+3t^2+1)\ln(x-t)$, $g(x)=3e^{2x-a}$의 그래프가
    오직 한 점 A에서 만나고 점 A에서 두 그래프에 동시에 접하는 접선이 존재하도록 하는
    실수 $a$의 값을 $h(t)$라 하자. $h'(2)$의 값을 구하시오.
  points: 18
  depends_on: []
  answer:
    kind: expression
    value: '(1)=1; (2)=2/11'
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        (1) 교점의 개수: 1
      source_flow: 예시답안 p.7
      criteria: [4.B1]
    - id: 4b-2
      content: |
        (2) 점 A의 $x$좌표를 $k$라 하면 두 곡선이 점 A에서 만나고 접선이 일치하므로
        $(4t^4+3t^2+1)\ln(k-t)=3e^{2k-a}$ ……㉠
        $\dfrac{4t^4+3t^2+1}{k-t}=6e^{2k-a}$ ……㉡
      source_flow: 예시답안 p.8
      criteria: [4.M1]
    - id: 4b-3
      content: |
        ㉠, ㉡에서 $(4t^4+3t^2+1)\ln(k-t)=\dfrac{4t^4+3t^2+1}{2(k-t)}$이고 $t>0$이므로 $\ln(k-t)=\dfrac{1}{2(k-t)}$
      source_flow: 예시답안 p.8
      criteria: [4.M2]
    - id: 4b-4
      content: |
        $\ln x=\dfrac{1}{2x}$의 해를 $\alpha$라 하면 $k-t=\alpha$를 만족한다. $k=t+\alpha$ ……㉢
        ㉢을 ㉡에 대입하면 $\dfrac{4t^4+3t^2+1}{\alpha}=6e^{2(t+\alpha)-a}$, $e^{2(t+\alpha)-a}=\dfrac{4t^4+3t^2+1}{6\alpha}$
        $2(t+\alpha)-a=\ln\left(\dfrac{4t^4+3t^2+1}{6\alpha}\right)$이므로 $a=2(t+\alpha)-\ln\left(\dfrac{4t^4+3t^2+1}{6\alpha}\right)$
      source_flow: 예시답안 p.8
      criteria: [4.A1]
    - id: 4b-5
      content: |
        $h(t)=2(t+\alpha)-\ln\left(\dfrac{4t^4+3t^2+1}{6\alpha}\right)$
        $h'(t)=2-\dfrac{\dfrac{16t^3+6t}{6\alpha}}{\dfrac{4t^4+3t^2+1}{6\alpha}}=2-\dfrac{16t^3+6t}{4t^4+3t^2+1}$
        $h'(2)=2-\dfrac{140}{77}=\dfrac{14}{77}=\dfrac{2}{11}$
      source_flow: 예시답안 p.8
      criteria: [4.A2]
  - id: S4-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 4c-1
      content: |
        (2) 위와 같이 ㉠, ㉡을 세운 뒤 ㉡에서 $\ln\left(\dfrac{4t^4+3t^2+1}{6(k-t)}\right)=2k-a$이므로
        $a=2k-\ln\left(\dfrac{4t^4+3t^2+1}{6(k-t)}\right)$ ……㉣
      source_flow: 예시답안 p.8-9
      criteria: [4.M1]
    - id: 4c-2
      content: |
        $\ln x=\dfrac{1}{2x}$의 해를 $\alpha$라 하면 $k-t=\alpha$를 만족한다. $k=t+\alpha$ ……㉤
        ㉤을 ㉣에 대입하면 $a=2(t+\alpha)-\ln\left(\dfrac{4t^4+3t^2+1}{6\alpha}\right)$이고
        $h'(2)=2-\dfrac{140}{77}=\dfrac{2}{11}$
      source_flow: 예시답안 p.9
      criteria: [4.M2, 4.A1, 4.A2]
