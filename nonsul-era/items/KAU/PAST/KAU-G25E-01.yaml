stimuli:
- label: 가
  body: |
    수렴하는 두 수열 $\{a_n\}$, $\{b_n\}$에 대하여 $\displaystyle\lim_{n\to\infty}a_n=\alpha$, $\displaystyle\lim_{n\to\infty}b_n=\beta$일 때,
    수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $\alpha=\beta$이면 수열 $\{c_n\}$은 수렴하고
    $\displaystyle\lim_{n\to\infty}c_n=\alpha$이다.
- label: 나
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(a,\,f(a))$에서의 접선의 방정식은 다음과 같다.
    $$y-f(a)=f'(a)(x-a)$$
- label: 다
  body: |
    함수 $f(x)$가 닫힌구간 $[a,\,b]$에서 연속이면
    $$\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x=\int_a^b f(x)\,dx\quad\left(\text{단, }\Delta x=\dfrac{b-a}{n},\ x_k=a+k\Delta x\right)$$
stem: |
  【문제 1】 (50점)
  ※ 다음 제시문을 읽고 물음에 대한 풀이 과정과 답을 작성하시오.(답만 기재하면 0점 처리)
subparts:
- id: '1'
  stem: |
    [문제 1-1] 수열 $\{a_n\}$에 대하여 이차함수 $y=2x^2-5(n+2)x+3a_n$의 그래프는 $x$축과 만나고,
    이차함수 $y=2x^2-5nx+3a_n$의 그래프는 $x$축과 만나지 않는다고 할 때, $\displaystyle\lim_{n\to\infty}\dfrac{a_n}{n^2}$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 25/24
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=2x^2-5(n+2)x+3a_n$의 그래프가 $x$축과 만나므로 이차방정식 $2x^2-5(n+2)x+3a_n=0$의 판별식 $D_1$에 대하여
        $D_1=25(n+2)^2-24a_n\ge 0$, 즉 $a_n\le\dfrac{25(n+2)^2}{24}$ ……①
      source_flow: 예시답안 p.5
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $y=2x^2-5nx+3a_n$의 그래프가 $x$축과 만나지 않으므로 판별식 $D_2=25n^2-24a_n<0$, 즉 $a_n>\dfrac{25n^2}{24}$ ……②
      source_flow: 예시답안 p.5
      criteria: [1.M2]
    - id: 1b-3
      content: |
        ①, ②에서 $\dfrac{25n^2}{24}<a_n\le\dfrac{25(n+2)^2}{24}$
      source_flow: 예시답안 p.5
      criteria: [1.M3]
    - id: 1b-4
      content: |
        각 변을 $n^2$으로 나누면 $\dfrac{25}{24}<\dfrac{a_n}{n^2}\le\dfrac{25(n+2)^2}{24n^2}$이고
        $\displaystyle\lim_{n\to\infty}\dfrac{25}{24}=\dfrac{25}{24}$, $\displaystyle\lim_{n\to\infty}\dfrac{25(n+2)^2}{24n^2}=\dfrac{25}{24}$이므로
        수열의 극한의 대소 관계에 의하여 $\displaystyle\lim_{n\to\infty}\dfrac{a_n}{n^2}=\dfrac{25}{24}$이다.
      source_flow: 예시답안 p.5
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 그래프가 $x$축과 만난다는 조건으로 판별식 $D_1\ge 0$ 부등식($a_n\le\dfrac{25(n+2)^2}{24}$)을 세웠다.
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: 그래프가 $x$축과 만나지 않는다는 조건으로 판별식 $D_2<0$ 부등식($a_n>\dfrac{25n^2}{24}$)을 세웠다.
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: 두 부등식을 합쳐 $a_n$의 범위 $\dfrac{25n^2}{24}<a_n\le\dfrac{25(n+2)^2}{24}$를 적었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: 수열의 극한의 대소 관계(조임정리)를 이용하여 극한값 $\dfrac{25}{24}$를 구했다.
      depends_on: [1.M3]
      steps: [1b-4]
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    [문제 1-2] 함수 $f(x)=(x-5)e^x$에 대하여 다음 물음에 답하시오.
    (1) 곡선 $y=f(x)$ 위의 점 $(k,\,f(k))$에서의 접선의 방정식을 구하시오.
    (2) 함수 $f(x)$의 증가와 감소를 표로 나타내고, 이를 이용하여 $f(x)$의 극값을 구하시오.
    (3) 점 $(a,\,0)$에서 곡선 $y=f(x)$에 서로 다른 두 개의 접선을 그을 수 있을 때, $a$의 값의 범위를 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: '(1)=y=(k-4)e^k(x-k)+(k-5)e^k; (2)=극솟값 -e^4 (x=4), 극댓값 없음; (3)=a<1 또는 a>5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1) $f'(x)=e^x+(x-5)e^x=(x-4)e^x$이므로 점 $(k,\,(k-5)e^k)$에서의 접선의 방정식은
        $y=(k-4)e^k(x-k)+(k-5)e^k$
      source_flow: 예시답안 p.5
      criteria: [2.M1, 2.A1]
    - id: 2b-2
      content: |
        (2) $f'(x)=(x-4)e^x$이므로 $f'(x)=0$에서 $x=4$. $f'(x)$의 부호를 조사하여 증가와 감소를 표로 나타내면 다음과 같다.
        $$\begin{array}{c|ccc}x&\cdots&4&\cdots\\\hline f'(x)&-&0&+\\\hline f(x)&\searrow&-e^4&\nearrow\end{array}$$
        따라서 $f(x)$는 $x=4$에서 극소이고 극솟값은 $f(4)=-e^4$이다.
      source_flow: 예시답안 p.5-6
      criteria: [2.B1]
    - id: 2b-3
      content: |
        (3) 이 접선이 점 $(a,\,0)$을 지나므로 $-(k-5)e^k=(k-4)e^k(a-k)$.
        방정식을 정리하면 $k^2-(a+5)k+4a+5=0$ ……①
        이차방정식 ①이 서로 다른 두 개의 실근을 가질 때 서로 다른 두 개의 접선을 그을 수 있으므로 ①의 판별식을 $D$라 하면
        $D=(a+5)^2-4(4a+5)=a^2-6a+5=(a-1)(a-5)>0$에서 $a<1$ 또는 $a>5$
      source_flow: 예시답안 p.6
      criteria: [2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 채점기준표: 도함수·기울기 3 / 접선의 방정식 3 / 증감표·극값 2 / 판별식 2. (예시답안 본문 표기는 (1)3, (2)3, (3)2+2 로 달라 문항카드 기준표를 따름)
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: $f'(x)=(x-4)e^x$를 구하고 접점에서의 기울기 $f'(k)=(k-4)e^k$를 적었다.
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 접선의 방정식 $y=(k-4)e^k(x-k)+(k-5)e^k$를 바르게 적었다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: $f'(x)$의 부호를 분석하여 증가·감소를 표로 나타내고 극솟값 $-e^4$를 구했다.
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: 접점의 $x$좌표 $k$에 대한 이차방정식 $k^2-(a+5)k+4a+5=0$이 서로 다른 두 실근을 가질 조건(판별식)으로 $a<1$ 또는 $a>5$를 구했다.
      steps: [2b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    [문제 1-3] 제시문 다)를 이용하여 함수 $f(x)=\ln 3x$에 대하여 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\left(\dfrac{2}{3n+2k}\right)f\left(3+\dfrac{2k}{n}\right)$의
    값을 구하시오.
  points: 14
  depends_on: []
  answer:
    kind: expression
    value: ((ln(15))^2-(ln(9))^2)/2
    equivalents: ['\dfrac{(\ln 15)^2-(\ln 9)^2}{2}', '\dfrac{(\ln 5)^2+2\ln 5\ln 3-3(\ln 3)^2}{2}']
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac{2}{3n+2k}f\left(3+\dfrac{2k}{n}\right)=\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac{1}{3+\dfrac{2k}{n}}f\left(3+\dfrac{2k}{n}\right)\dfrac{2}{n}$
      source_flow: 예시답안 p.6
      criteria: [3.M1]
    - id: 3b-2
      content: |
        제시문 다)에서 $3+\dfrac{2k}{n}=x_k$라 하면 $\dfrac{2}{n}=\Delta x$, $a=3$, $b=5$이므로
        $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac{1}{x_k}f(x_k)\Delta x=\int_3^5\dfrac{1}{x}f(x)\,dx=\int_3^5\dfrac{\ln 3x}{x}\,dx$
      source_flow: 예시답안 p.6
      criteria: [3.M1]
    - id: 3b-3
      content: |
        $t=\ln 3x$라 하면 $\dfrac{dt}{dx}=\dfrac{1}{x}$이고, $x=3$일 때 $t=\ln 9$, $x=5$일 때 $t=\ln 15$이다.
      source_flow: 예시답안 p.6
      criteria: [3.M2]
    - id: 3b-4
      content: |
        따라서 $\displaystyle\int_{\ln 9}^{\ln 15}t\,dt=\left[\dfrac{1}{2}t^2\right]_{\ln 9}^{\ln 15}=\dfrac{(\ln 15)^2-(\ln 9)^2}{2}$
        [참고] 이 값은 $\dfrac{(\ln 15+\ln 9)(\ln 15-\ln 9)}{2}=\dfrac{(\ln 5+3\ln 3)(\ln 5-\ln 3)}{2}=\dfrac{(\ln 5)^2+2\ln 5\ln 3-3(\ln 3)^2}{2}$ 등 다양한 형태로도 나타낼 수 있다.
      source_flow: 예시답안 p.6
      criteria: [3.A1]
  - id: S3-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 3c-1
      content: |
        $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac{2}{3+\dfrac{2k}{n}}f\left(3+\dfrac{2k}{n}\right)\dfrac{1}{n}$으로 변형하고,
        $\dfrac{k}{n}=x_k$라 하면 $\dfrac{1}{n}=\Delta x$, $a=0$, $b=1$이므로
        $\displaystyle\int_0^1\dfrac{2}{3+2x}\ln(9+6x)\,dx$
      source_flow: 예시답안 p.7
      criteria: [3.M1]
    - id: 3c-2
      content: |
        $3+2x=y$라 하면 $2\,dx=dy$이고 $x=0$일 때 $y=3$, $x=1$일 때 $y=5$이므로 $\displaystyle\int_3^5\dfrac{\ln 3y}{y}\,dy$
      source_flow: 예시답안 p.7
      criteria: [3.M1]
    - id: 3c-3
      content: |
        $\ln 3y=t$라 하면 $\dfrac{1}{y}dy=dt$이고 $y=3$일 때 $t=\ln 9$, $y=5$일 때 $t=\ln 15$이므로
        $\displaystyle\int_{\ln 9}^{\ln 15}t\,dt=\left[\dfrac{1}{2}t^2\right]_{\ln 9}^{\ln 15}=\dfrac{(\ln 15)^2-(\ln 9)^2}{2}$
      source_flow: 예시답안 p.7
      criteria: [3.M2, 3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 채점기준표: 정적분과 급수의 관계로 정적분 표현 4 / 치환적분 과정 5 / 정적분 계산 5. (예시답안 본문 표기는 4, 5, 5 로 끊는 위치가 다름 — 기준표를 따름)
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: 제시문 다)를 이용하여 주어진 급수를 정적분(예 $\displaystyle\int_3^5\dfrac{\ln 3x}{x}\,dx$)으로 나타냈다($\Delta x$, $a$, $b$, $x_k$ 대응이 바르다).
      steps: [3b-1, 3b-2, 3c-1, 3c-2]
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: 치환($t=\ln 3x$ 등)과 $dt=\dfrac{1}{x}dx$, 적분 구간 $\ln 9$~$\ln 15$로의 변환을 논리적으로 수행했다.
      depends_on: [3.M1]
      steps: [3b-3, 3c-3]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: 치환한 함수의 정적분을 계산하여 $\dfrac{(\ln 15)^2-(\ln 9)^2}{2}$(또는 동치인 값)를 구했다.
      depends_on: [3.M2]
      steps: [3b-4, 3c-3]
