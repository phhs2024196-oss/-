stimuli:
- label: 가
  body: |
    복소수 $a+bi$ ($a,\,b$는 실수)의 허수부분의 부호를 바꾼 복소수 $a-bi$를 $a+bi$의 켤레복소수라 하고, 이것을 기호로
    $$\overline{a+bi}$$
    로 나타낸다. 즉, $\overline{a+bi}=a-bi$이다. (단, $i=\sqrt{-1}$)
- label: 나
  body: |
    함수 $y=f(x)$에서 $x$의 값이 $a$에서 $a+\Delta x$까지 변할 때, 평균변화율은
    $$\dfrac{\Delta y}{\Delta x}=\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$$
    이다. 여기서 $\Delta x\to 0$일 때, 평균변화율의 극한값
    $$\lim_{\Delta x\to 0}\dfrac{\Delta y}{\Delta x}=\lim_{\Delta x\to 0}\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$$
    가 존재할 때, 함수 $y=f(x)$는 $x=a$에서 미분가능하다고 한다.
- label: 다
  body: |
    첫째항부터 차례대로 일정한 수를 곱하여 만든 수열을 등비수열이라 하고, 곱하는 일정한 수를 공비라고 한다. 공비가 $r$인 등비수열 $\{a_n\}$에서 제$n$항에 공비 $r$을 곱하면 제$(n+1)$항이 되므로
    $$a_{n+1}=ra_n\ (n=1,\,2,\,3,\,\cdots)$$
    이 성립한다.
stem: |
  【문제 1】 (50점)
  ※ 다음 제시문을 읽고 물음에 대한 풀이 과정과 답을 제시하시오.(답만 기재하면 0점 처리)
subparts:
- id: '1'
  stem: |
    [문제 1-1] 집합 $A=\{z\mid z\overline{z}=2,\ z\text{는 복소수}\}$이고 집합 $B=\{z\mid z=k(2+2i),\ k\text{는 실수}\}$일 때,
    집합 $A\cap B$를 원소나열법으로 나타내시오.
  points: 10
  depends_on: []
  answer:
    kind: set
    value: '{1+i,-1-i}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        집합 $B$의 조건에 따르면 $z=2k+2ki$이고 집합 $A$의 조건에 따라 $(2k)^2+(2k)^2=2$임. $k=\pm\dfrac{1}{2}$.
        따라서 $A\cap B=\{1+i,\,-1-i\}$임.
      source_flow: 예시답안 p.6
      criteria: [1.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 문항카드: 원소가 모두 맞으면 10점, 원소 중 일부가 맞으면 부분점수.
    # 예시답안 채점기준: {1+i,-1-i} 10점 / 집합기호 없이 1+i,-1-i 8.2점 / 원소 1개만 맞음 4.2점 / 원소 1개만 맞고 집합 기호 없음 3.2점
    criteria:
    - id: 1.B1
      mark_type: B
      points: 10
      evidence: 집합 $A\cap B=\{1+i,\,-1-i\}$를 원소나열법으로 바르게 적었다(원소가 모두 맞음).
      steps: [1b-1]
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    [문제 1-2] 실수 전체의 집합에서 정의된 함수 $f(x)$는 $x\ge 0$일 때 $f(x)=\lvert(x+2)(x-3)(x-4)\rvert$이고, 임의의 실수 $x$에 대하여 $f(-x)=f(x)$가 성립한다. 다음 물음에 답하시오.
    (1) 제시문 나)를 이용하여 $x=4$에서 $f(x)$가 미분가능하지 않음을 보이시오.
    (2) $x=a$에서 $f(x)$가 미분가능하지 않을 때, $a$의 값을 모두 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: '(1)=x=4에서 좌미분계수 -6, 우미분계수 6 (극한값이 존재하지 않음); (2)=-4, -3, 0, 3, 4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1) $\displaystyle\lim_{\Delta x\to 0-}\dfrac{(4+\Delta x+2)(4+\Delta x-3)(4-4-\Delta x)}{\Delta x}=-6$
        $\displaystyle\lim_{\Delta x\to 0+}\dfrac{(4+\Delta x+2)(4+\Delta x-3)(4-4+\Delta x)}{\Delta x}=6$
        즉, $\displaystyle\lim_{\Delta x\to 0}\dfrac{f(4+\Delta x)-f(4)}{\Delta x}$의 값이 존재하지 않으므로 함수 $f(x)$는 $x=4$에서 미분가능하지 않다.
      source_flow: 예시답안 p.6
      criteria: [2.R1]
    - id: 2b-2
      content: |
        (2) 미분가능하지 않은 $a$의 값은 $-4,\,-3,\,0,\,3,\,4$
        (근거 예시 1) 그래프를 그리고 찾기, 근거 예시 2) 각 점에서 미분계수를 계산한 경우)
      source_flow: 예시답안 p.6
      criteria: [2.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 문항카드: (1) 주어진 점에서 미분계수가 존재하지 않음을 보인 경우 6점 / (2) 미분불가능한 점 모두 맞으면 6점, 일부 맞으면 부분점수.
    # 예시답안 채점기준표(2): 답과 근거 6점 / 답만 모두 5.1점 / 하나 이상 빠짐 3.2점 / 틀린 점 포함 3.2점 / 정답 없음 0점
    criteria:
    - id: 2.R1
      mark_type: R
      points: 6
      evidence: $x=4$에서 좌극한 $-6$과 우극한 $6$을 구하여 미분계수가 존재하지 않음을 보였다.
      steps: [2b-1]
    - id: 2.B1
      mark_type: B
      points: 6
      evidence: 미분가능하지 않은 $a=-4,\,-3,\,0,\,3,\,4$를 모두 구했다(그래프 또는 각 점의 미분계수 계산을 근거로 제시).
      steps: [2b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    [문제 1-3] 수열 $\{a_n\}$은 첫째항이 $2$이고 공비가 $\dfrac{1}{3}$인 등비수열이고, 수열 $\{b_n\}$은 첫째항이 $9$이고
    공비가 $\dfrac{1}{27}$인 등비수열이다. 점 $\mathrm{R}_n$의 좌표를 $(a_n,\,b_n)$이라 하고, 선분 $\mathrm{R}_n\mathrm{R}_{n+1}$을 지름으로
    하는 원을 $C_n$이라 하자. 원 $C_n$의 중심을 $\mathrm{O}_n$이라 할 때, 다음 물음에 답하시오.
    (1) 점 $\mathrm{R}_1$, 점 $\mathrm{R}_2$, 점 $\mathrm{R}_3$과 점 $\mathrm{O}_1$, 점 $\mathrm{O}_2$의 좌표를 각각 구하시오.
    (2) 점 $\mathrm{O}_n$의 좌표를 $n$에 대한 식으로 나타내시오.
    (3) 삼차함수 $f(x)=ax^3+bx^2$의 그래프가 점 $\mathrm{O}_1$과 점 $\mathrm{O}_2$를 지날 때, 두 상수 $a$, $b$의 값을 구하시오.
    (4) (3)에서 구한 함수 $y=f(x)$의 그래프 위의 점 $\mathrm{P}(t,\,f(t))\ \left(\dfrac{1}{2}\le t\le 1\right)$에 대하여 점
    $\mathrm{P}$와 직선 $\mathrm{O}_1\mathrm{O}_2$ 사이의 거리가 $t=\alpha$에서 최대일 때 $\alpha^2$의 값을 구하시오.
  points: 28
  depends_on: []
  answer:
    kind: expression
    value: '(1)=R1=(2,9), R2=(2/3,1/3), R3=(2/9,1/81), O1=(4/3,14/3), O2=(4/9,14/81); (2)=On=(4/3^n,126/27^n); (3)=a=63/32, b=0; (4)=208/243'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1) $\mathrm{R}_1=(2,\,9)$, $\mathrm{R}_2=\left(\dfrac{2}{3},\,\dfrac{1}{3}\right)$, $\mathrm{R}_3=\left(\dfrac{2}{9},\,\dfrac{1}{81}\right)$,
        $\mathrm{O}_1=\left(\dfrac{4}{3},\,\dfrac{14}{3}\right)$, $\mathrm{O}_2=\left(\dfrac{4}{9},\,\dfrac{14}{81}\right)$ (각 좌표당 1점)
      source_flow: 예시답안 p.7
      criteria: [3.B1, 3.B2, 3.B3, 3.B4, 3.B5]
    - id: 3b-2
      content: |
        (2) 점 $\mathrm{O}_n$의 좌표는 $\mathrm{O}_n=\left(\dfrac{a_n+a_{n+1}}{2},\,\dfrac{b_n+b_{n+1}}{2}\right)$으로 계산할 수 있음.
        $\mathrm{O}_n=\left(\dfrac{4}{3^n},\,\dfrac{126}{27^n}\right)$
      source_flow: 예시답안 p.7
      criteria: [3.B6]
    - id: 3b-3
      content: |
        (3) $f\left(\dfrac{4}{3}\right)=a\left(\dfrac{4}{3}\right)^3+b\left(\dfrac{4}{3}\right)^2=\dfrac{14}{3}$,
        $f\left(\dfrac{4}{9}\right)=a\left(\dfrac{4}{9}\right)^3+b\left(\dfrac{4}{9}\right)^2=\dfrac{14}{81}$
        $a=\dfrac{63}{32},\ b=0$
      source_flow: 예시답안 p.7
      criteria: [3.B7]
    - id: 3b-4
      content: |
        (4) 직선 $\mathrm{O}_1\mathrm{O}_2$의 기울기는 $\dfrac{\dfrac{14}{81}-\dfrac{14}{3}}{\dfrac{4}{9}-\dfrac{4}{3}}=\dfrac{91}{18}$
        가장 먼 거리에 있는 점은 기울기가 $\dfrac{91}{18}$인 접선과 만나는 접점이므로 $\dfrac{91}{18}=\dfrac{63}{32}(3x^2)$,
        $\alpha=\sqrt{\dfrac{208}{243}}$이므로 $\alpha^2=\dfrac{208}{243}$ (또는 $\dfrac{1456}{1701}=\dfrac{2912}{3402}$)
      source_flow: 예시답안 p.7-8
      criteria: [3.B8]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 문항카드 배점: (1) 5(좌표당 1) / O_n 일반항 6 / 삼차함수 계수 8 / 점 P와 접선 사이의 거리 9.
    # (예시답안 본문은 (2)를 3+3, (4)를 3(기울기 91/18)+6(α^2)으로 표기 — 카드의 합과 같음)
    criteria:
    - id: 3.B1
      mark_type: B
      points: 1
      evidence: $\mathrm{R}_1=(2,\,9)$를 구했다.
      steps: [3b-1]
    - id: 3.B2
      mark_type: B
      points: 1
      evidence: $\mathrm{R}_2=\left(\dfrac{2}{3},\,\dfrac{1}{3}\right)$를 구했다.
      steps: [3b-1]
    - id: 3.B3
      mark_type: B
      points: 1
      evidence: $\mathrm{R}_3=\left(\dfrac{2}{9},\,\dfrac{1}{81}\right)$를 구했다.
      steps: [3b-1]
    - id: 3.B4
      mark_type: B
      points: 1
      evidence: $\mathrm{O}_1=\left(\dfrac{4}{3},\,\dfrac{14}{3}\right)$를 구했다.
      steps: [3b-1]
    - id: 3.B5
      mark_type: B
      points: 1
      evidence: $\mathrm{O}_2=\left(\dfrac{4}{9},\,\dfrac{14}{81}\right)$를 구했다.
      steps: [3b-1]
    - id: 3.B6
      mark_type: B
      points: 6
      evidence: 등비수열의 일반항을 이용해 $\mathrm{O}_n=\left(\dfrac{4}{3^n},\,\dfrac{126}{27^n}\right)$를 나타냈다(중심 좌표 $\left(\dfrac{a_n+a_{n+1}}{2},\,\dfrac{b_n+b_{n+1}}{2}\right)$ 포함).
      steps: [3b-2]
    - id: 3.B7
      mark_type: B
      points: 8
      evidence: 삼차함수가 $\mathrm{O}_1$, $\mathrm{O}_2$를 지나는 조건으로 $a=\dfrac{63}{32}$, $b=0$을 구했다.
      steps: [3b-3]
    - id: 3.B8
      mark_type: B
      points: 9
      evidence: 직선 $\mathrm{O}_1\mathrm{O}_2$의 기울기 $\dfrac{91}{18}$와 같은 기울기의 접선의 접점으로 $\alpha^2=\dfrac{208}{243}$를 구했다.
      steps: [3b-4]
