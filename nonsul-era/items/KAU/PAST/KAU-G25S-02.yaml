- id: '3'
  stem: |
    [문제 2-3] 자연수 $n$에 대하여 함수 $y=\sin(20\pi x)$의 그래프와 직선 $y=\dfrac{n-1}{10}$의 교점 중
    $x$좌표가 $(n+1)^2$ 이상이고 $2(n+1)^2$ 이하인 점의 개수를 $a_n$이라 하자. $\displaystyle\sum_{n=1}^{20}a_n$의 값을 구하시오.
  points: 13
  depends_on: []
  answer:
    kind: value
    value: '11541'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $y=\sin(20\pi x)$는 주기가 $\dfrac{1}{10}$인 주기함수이다.
      source_flow: 예시답안 p.15
      criteria: [3.M1]
    - id: 3b-2
      content: |
        따라서 $y=\sin(20\pi x)$와 $y=\dfrac{n-1}{10}$의 교점의 $x$좌표가 $(n+1)^2$ 이상이고 $2(n+1)^2$ 이하인 교점의 개수는
        $x$좌표가 $0$ 이상이고 $(n+1)^2$ 이하인 교점의 개수와 같다.
        이때 $y=\sin(20\pi x)$와 $y=\dfrac{n-1}{10}$이 만나는 점의 개수인 $a_n$을 구하면,
        i) $n=1$일 때, $20(n+1)^2+1=81$
        ii) $n=2,\,\cdots,\,10$일 때, $20(n+1)^2$
        iii) $n=11$일 때, $10(n+1)^2=1440$
        iv) $12\le n\le 20$일 때, $0$
      source_flow: 예시답안 p.15
      criteria: [3.A1]
    - id: 3b-3
      content: |
        그러므로 $\displaystyle\sum_{n=1}^{20}a_n=81+\sum_{n=2}^{10}\{20(n+1)^2\}+10\times 12^2=11541$
      source_flow: 예시답안 p.15
      criteria: [3.A2]
