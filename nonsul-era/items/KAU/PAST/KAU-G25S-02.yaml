- id: '4'
  stem: |
    [문제 2-4] 두 함수 $f(x)=x^2-2x+\lvert x^2-2x\rvert$, $g(x)=-x+12$가 있다. $a>2$인 실수 $a$에 대하여
    함수 $h(a)=\displaystyle\int_{-a}^{a}\{f(x)-g(x)\}\,dx$라 할 때, $h(a)$의 증가와 감소를 표로 나타내고, 이를 이용하여 $h(a)$의 극값을 구하시오.
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: 'min=-16sqrt(6)+8/3; at=sqrt(6); max=없음'
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $f(x)$는 $x<0$ 또는 $x\ge 2$일 때 $f(x)=2x^2-4x$, $0\le x<2$일 때 $f(x)=0$이다.
        $a>2$이므로
        $h(a)=\displaystyle\int_{-a}^{0}\{f(x)-g(x)\}\,dx+\int_{0}^{2}\{f(x)-g(x)\}\,dx+\int_{2}^{a}\{f(x)-g(x)\}\,dx$
