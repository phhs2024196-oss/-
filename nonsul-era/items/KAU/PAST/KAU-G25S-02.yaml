stimuli:
- label: 가
  body: |
    점 $(x_1,\,y_1)$과 직선 $ax+by+c=0$ 사이의 거리는 $\dfrac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$이다.
- label: 나
  body: |
    사인함수 $y=\sin x$는 다음과 같은 성질을 갖는다.
    (1) 정의역이 실수 전체의 집합이고, 치역은 $\{y\mid -1\le y\le 1\}$이다.
    (2) 주기가 $2\pi$인 주기함수이다. 즉, $\sin(x+2n\pi)=\sin x$ (단, $n$은 정수)
- label: 다
  body: |
    닫힌구간 $[a,\,b]$에서 연속인 함수 $f(x)$의 한 부정적분을 $F(x)$라 하면
    $$\int_a^b f(x)\,dx=\left[F(x)\right]_a^b=F(b)-F(a)$$
- label: 라
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$일 때, $x=a$의 좌우에서
    (1) $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고, 극댓값 $f(a)$를 갖는다.
    (2) $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고, 극솟값 $f(a)$를 갖는다.
stem: |
  【문제 2】 (50점)
  ※ 다음 제시문을 읽고 물음에 대한 풀이 과정과 답을 제시하시오.(답만 기재하면 0점 처리)
subparts:
- id: '1'
  stem: |
    [문제 2-1] 원 $(x-a)^2+(y-a^2)^2=b^2$이 두 직선 $y=-x+4$와 $y=x+2$에 동시에 접하도록
    하는 두 실수 $a$, $b$의 순서쌍 $(a,\,b)$를 모두 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: set
    value: '(sqrt(3),(sqrt(3)-1)/sqrt(2)); (sqrt(3),-(sqrt(3)-1)/sqrt(2)); (-sqrt(3),(sqrt(3)+1)/sqrt(2)); (-sqrt(3),-(sqrt(3)+1)/sqrt(2)); (1,sqrt(2)); (1,-sqrt(2))'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        중심 $(a,\,a^2)$에서 두 직선까지의 거리가 같으므로
        $d=\dfrac{\lvert a+a^2-4\rvert}{\sqrt{2}}=\dfrac{\lvert a-a^2+2\rvert}{\sqrt{2}}$. 즉, $\lvert a+a^2-4\rvert=\lvert a-a^2+2\rvert$이다.
        i) $a+a^2-4=a-a^2+2$일 때, $a=\pm\sqrt{3}$
        ii) $a+a^2-4=-(a-a^2+2)$일 때, $a=1$.
      source_flow: 예시답안 p.13
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\lvert b\rvert=d$이므로 $a$와 $b$의 값을 모두 구하면
        $a=\sqrt{3}$일 때 $b=\pm\dfrac{\sqrt{3}-1}{\sqrt{2}}$, $a=-\sqrt{3}$일 때 $b=\pm\dfrac{\sqrt{3}+1}{\sqrt{2}}$, $a=1$일 때 $b=\pm\sqrt{2}$이다.
        따라서 순서쌍 $(a,\,b)$는
        $\left(\sqrt{3},\,\dfrac{\sqrt{3}-1}{\sqrt{2}}\right)$, $\left(\sqrt{3},\,-\dfrac{\sqrt{3}-1}{\sqrt{2}}\right)$, $\left(-\sqrt{3},\,\dfrac{\sqrt{3}+1}{\sqrt{2}}\right)$, $\left(-\sqrt{3},\,-\dfrac{\sqrt{3}+1}{\sqrt{2}}\right)$, $(1,\,\sqrt{2})$, $(1,\,-\sqrt{2})$이다.
      source_flow: 예시답안 p.13
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 중심 $(a,\,a^2)$에서 두 직선까지의 거리가 같다는 식을 세워 $a=\pm\sqrt{3},\,1$을 구했다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: 구한 $a$에 대해 반지름 $\lvert b\rvert$를 구하고 순서쌍 6개를 모두 적었다.
      depends_on: [1.M1]
      steps: [1b-2]
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    [문제 2-2] 자연수 $n$과 $0\le a<1$인 실수 $a$에 대하여 $n+a$는 $x$에 대한 방정식
    $x^3+6x^2+12x-k+8=0$의 한 근이다. $n^2-2na<0$이 성립할 때, 실수 $k$의 값의 범위를 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: 343/8<k<64
    equivalents: ['(7/2)^3<k<4^3']
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $n^2-2na<0$ ……①
        이므로 $n^2<2na$이다. $0\le a<1$이므로 $n^2<2na<2n$이다.
        따라서 $n^2-2n<0$을 만족하는 자연수 $n=1$이다.
      source_flow: 예시답안 p.14
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $n=1$을 ①에 대입하면 $\dfrac{1}{2}<a$ ……②
        따라서 ②와 $0\le a<1$을 동시에 만족하는 $a$의 값의 범위는 $\dfrac{1}{2}<a<1$이다. ……③
      source_flow: 예시답안 p.14
      criteria: [2.A1]
    - id: 2b-3
      content: |
        $f(x)=x^3+6x^2+12x+8$이라 하면, 주어진 방정식의 해는 함수 $y=f(x)$의 그래프와 직선 $y=k$의 교점의 $x$좌표이다.
        다항식 $f(x)$를 정리하면 $f(x)=(x+2)^3$이고 $n+a$가 방정식 $f(x)=k$의 한 근이므로,
        $(n+a+2)^3=k$ ($n$은 자연수, $0\le a<1$)를 만족한다. $n=1$과 ③에 의해 $\dfrac{7}{2}<n+a+2<4$이다.
      source_flow: 예시답안 p.14
      criteria: [2.A2]
    - id: 2b-4
      content: |
        그러므로 실수 $k$의 값의 범위는 $\left(\dfrac{7}{2}\right)^3<k<4^3$ (또는 $\dfrac{343}{8}<k<64$).
      source_flow: 예시답안 p.14
      criteria: [2.A2]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 2c-1
      content: |
        조건에 의해 $n^2-2na<0$ ……① 이므로 $n^2<2na$이다. $0\le a<1$이므로 $n^2<2na<2n$이다.
        그러므로 $n^2-2n<0$을 만족하는 자연수 $n=1$이다.
      source_flow: 예시답안 p.14
      criteria: [2.M1]
    - id: 2c-2
      content: |
        $n=1$을 ②에 대입하면 $\dfrac{1}{2}<a$를 만족한다. ……②
        따라서 ②와 $0\le a<1$을 동시에 만족하는 $a$의 값의 범위는 $\dfrac{1}{2}<a<1$이다. ……③
      source_flow: 예시답안 p.14
      criteria: [2.A1]
    - id: 2c-3
      content: |
        $n+a$는 $x$에 대한 방정식 $x^3+6x^2+12x-k+8=0$의 한 근이고 $\dfrac{3}{2}<n+a<2$를 만족한다.
        $f(x)=x^3+6x^2+12x+8$이라 하면, 주어진 방정식의 해는 함수 $y=f(x)$의 그래프와 직선 $y=k$의 교점의 $x$좌표이다.
        $f(x)$는 모든 실수에서 연속이고, $f\left(\dfrac{3}{2}\right)=\dfrac{343}{8}\ne f(2)=64$이므로,
        사잇값의 정리에 의해 $f\left(\dfrac{3}{2}\right)$과 $f(2)$ 사이에 $f(x)=k$인 $x$가 열린구간 $\left(\dfrac{3}{2},\,2\right)$에서 적어도 하나 존재한다.
        즉, $\left(f\left(\dfrac{3}{2}\right)-k\right)\times(f(2)-k)<0$
        그러므로 실수 $k$의 값의 범위는 $\left(\dfrac{7}{2}\right)^3<k<4^3$ (또는 $\dfrac{343}{8}<k<64$)이다.
      source_flow: 예시답안 p.14-15
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 문항카드: 조건으로 n 3 / 연립부등식으로 a 범위 3 / 인수분해(풀이1) 또는 연속함수의 성질·이차부등식(풀이2)으로 k 범위 6
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: $n^2-2na<0$과 $0\le a<1$로부터 $n^2<2n$을 이끌어 $n=1$을 구했다.
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $n=1$을 대입한 부등식과 $0\le a<1$을 연립하여 $\dfrac{1}{2}<a<1$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-2]
    - id: 2.A2
      mark_type: A
      points: 6
      evidence: 인수분해 $x^3+6x^2+12x+8=(x+2)^3$(풀이1) 또는 사잇값의 정리·이차부등식(풀이2)을 이용해 $\dfrac{343}{8}<k<64$를 구했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3, 2b-4, 2c-3]
  outcome_codes:
