  solutions:
  - id: S9-B
    audience: B
    method_no: 1
    steps:
    - id: 9b-1
      content: |
        $I(x)=\dfrac{\ln(x+1)}{x}$의 증감을 조사한다. $x>0$에서 $I'(x)>0$이면 증가, $I'(x)<0$이면 감소한다.
        $$I'(x)=-\dfrac{\ln(x+1)}{x^2}+\dfrac1x\cdot\dfrac1{x+1}=\dfrac{x-(x+1)\ln(x+1)}{x^2(x+1)}$$
      source_flow: 예시답안 p.10-11
      criteria:
      - 9.M1
    - id: 9b-2
      content: |
        $I'(x)$의 분자를 $N(x)$, 분모를 $D(x)$라 하자. 분모 $D(x)=x^2(x+1)>0$이므로 $I'(x)$의 부호와 $N(x)$의 부호는 같다.
        $N(x)=x-(x+1)\ln(x+1)$, $N(0)=0$, $N'(x)=1-\ln(x+1)-1=-\ln(x+1)$이므로 $x>0$일 때 $N'(x)<0$이다. 즉 $x>0$에서 $N(x)<0$이다.
      source_flow: 예시답안 p.10-11
      criteria:
      - 9.R1
    - id: 9b-3
      content: |
        $x>0$일 때 $I'(x)<0$이므로 $I(x)$는 감소한다. $x\ge0$일 때 $I(x)$는 연속이고, $x>0$일 때 $I(x)$는 미분가능하므로 $x\ge0$일 때 $I(x)$는 감소한다.
      source_flow: 예시답안 p.10-11
      criteria:
      - 9.R2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 9.M1
      mark_type: M
      points: 3
      evidence: $I'(x)=\dfrac{x-(x+1)\ln(x+1)}{x^2(x+1)}$을 구하고 분자 $N(x)=x-(x+1)\ln(x+1)$의 부호를 판별하는 식을 세웠다.
      steps:
      - 9b-1
    - id: 9.R1
      mark_type: R
      points: 3
      evidence: $N(0)=0$, $N'(x)=-\ln(x+1)<0$으로 $x>0$에서 $N(x)<0$, 즉 $I'(x)<0$임을 보였다.
      depends_on:
      - 9.M1
      steps:
      - 9b-2
    - id: 9.R2
      mark_type: R
      points: 2
      evidence: $I(x)$의 연속성과 $x>0$에서의 $I'(x)<0$으로부터 $x\ge0$에서 감소함을 논리적으로 설명했다.
      depends_on:
      - 9.R1
      steps:
      - 9b-3
