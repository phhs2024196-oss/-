    method_no: 1
    steps:
    - id: 7b-1
      content: |
        $u=1+2\cos\theta$로 치환하면 $\dfrac{du}{d\theta}=-2\sin\theta$이고, $\theta=0$일 때 $u=3$, $\theta=\dfrac{\pi}{2}$일 때 $u=1$이다.
      source_flow: 예시답안 p.9
      criteria:
      - 7.M1
    - id: 7b-2
      content: |
        $$I(2)=\int_0^{\frac{\pi}{2}}\dfrac{\sin\theta}{1+2\cos\theta}d\theta=\int_3^1\dfrac{-1}{2u}du=\dfrac12\int_1^3\dfrac1udu=\dfrac12\Big[\ln\lvert u\rvert\Big]_1^3=\dfrac{\ln3}{2}$$
        따라서 $I(2)=\dfrac{\ln3}{2}$
      source_flow: 예시답안 p.9
      criteria:
      - 7.A1
