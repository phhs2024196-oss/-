        점 P가 움직인 거리를 $s$라 하면
        $$s=\int_{\frac{\pi}{2}}^{\frac{3\pi}{2}}\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}dt=4\int_{\frac{\pi}{2}}^{\frac{3\pi}{2}}\lvert\cos t\rvert dt$$
        $\dfrac{\pi}{2}\le t\le\dfrac{3\pi}{2}$이므로 $\lvert\cos t\rvert=-\cos t$이고 $s=4\int_{\frac{\pi}{2}}^{\frac{3\pi}{2}}(-\cos t)dt$
