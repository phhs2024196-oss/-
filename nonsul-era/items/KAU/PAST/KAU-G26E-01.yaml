stimuli:
- label: 가
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능할 때, $(a,b)$의 모든 $x$에 대하여
    (1) $f'(x)>0$이면 $f(x)$는 $[a,b]$에서 증가한다.
    (2) $f'(x)<0$이면 $f(x)$는 $[a,b]$에서 감소한다.
- label: 나
  body: |
    삼각함수의 덧셈정리
    $$\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$$
    $$\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$$
- label: 다
  body: |
    좌표평면 위를 움직이는 점 P의 시각 $t$에서 위치 $(x,y)$가 $x=f(t)$, $y=g(t)$일 때, 시각 $t=a$에서 $t=b$까지 점 P가 움직인 거리 $s$는
    $$s=\int_a^b\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}dt=\int_a^b\sqrt{\{f'(t)\}^2+\{g'(t)\}^2}dt$$
- label: 라
  body: |
    함수 $f(x)$가 어떤 구간에 속하는 모든 실수에서 연속일 때, $f(x)$는 그 구간에서 연속 또는 그 구간에서 연속함수라고 한다.
    특히 함수 $f(x)$가 다음 조건을 모두 만족시킬 때, $f(x)$는 닫힌구간 $[a,b]$에서 연속이라 한다.
    (i) 열린구간 $(a,b)$에서 연속이다.
    (ii) $\lim_{x\to a+}f(x)=f(a)$, $\lim_{x\to b-}f(x)=f(b)$
stem: |
  【문제 1】 (50점)
  ※ 다음 제시문을 읽고 물음에 대한 풀이 과정과 답을 제시하시오. (답만 기재하면 0점 처리)
subparts:
- id: '1'
  stem: |
    [문제 1-1] 양의 실수에서 정의된 함수 $f(x)=\begin{cases}\dfrac{x^3-4x^2+5x-2}{x^2-1}&(x\neq1)\\a&(x=1)\end{cases}$이 $x=1$에서 미분가능할 때, 다음 물음에 답하시오. (단, $a$는 상수이다.)
    (1) $a$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x\neq1$에서 분자와 분모를 인수분해하면 $x^3-4x^2+5x-2=(x-1)^2(x-2)$, $x^2-1=(x-1)(x+1)$이므로
        $$f(x)=\dfrac{(x-1)^2(x-2)}{(x-1)(x+1)}=\dfrac{(x-1)(x-2)}{x+1}=\dfrac{x^2-3x+2}{x+1}$$
      source_flow: 예시답안 p.5-6
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(x)$가 $x=1$에서 미분가능하므로 연속이다. 따라서 $a=\lim_{x\to1}f(x)=\lim_{x\to1}\dfrac{(x-1)(x-2)}{x+1}=0$, 즉 $a=0$이다.
      source_flow: 예시답안 p.5-6
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 분모와 분자를 인수분해하여 $x\neq1$에서 $f(x)=\dfrac{(x-1)(x-2)}{x+1}$ 꼴로 정리했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: 미분가능하면 연속임을 이용해 $a=\lim_{x\to1}f(x)=0$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) $f'(1)$의 값을 구하시오.
  points: 5
  depends_on:
  - '1'
  answer:
    kind: value
    value: -1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1)에 의해 $x>0$일 때 $f(x)=\dfrac{x^2-3x+2}{x+1}$이다. 분자를 $N(x)=x^2-3x+2$, 분모를 $D(x)=x+1$이라 하면
        $$f'(x)=\dfrac{N'(x)D(x)-N(x)D'(x)}{\{D(x)\}^2}=\dfrac{(2x-3)(x+1)-(x^2-3x+2)}{(x+1)^2}=\dfrac{x^2+2x-5}{(x+1)^2}$$
      source_flow: 예시답안 p.6-7
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서 $f'(1)=\dfrac{1+2-5}{(1+1)^2}=\dfrac{-2}{4}=-\dfrac12$
      source_flow: 예시답안 p.6-7
      criteria:
      - 2.A1
  - id: S2-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 2alt-1
      content: |
        $x\neq1$일 때 $f'(x)=\dfrac{x^2+2x-5}{(x+1)^2}$이다. 미분계수의 정의를 이용하면 $f'(a)=\lim_{\Delta x\to0}\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$이므로
        $$f'(1)=\lim_{\Delta x\to0}\dfrac{f(1+\Delta x)-f(1)}{\Delta x}=\lim_{\Delta x\to0}\dfrac{f(1+\Delta x)}{\Delta x}=\lim_{\Delta x\to0}\dfrac{\dfrac{\Delta x(\Delta x-1)}{\Delta x+2}}{\Delta x}=\lim_{\Delta x\to0}\dfrac{\Delta x-1}{\Delta x+2}=-\dfrac12$$
      source_flow: 예시답안 p.6-7
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 몫의 미분법으로 $f'(x)=\dfrac{x^2+2x-5}{(x+1)^2}$ 또는 동치식을 구했다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: $f'(1)=-\dfrac12$을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (3) 제시문 가)를 이용하여 함수 $f(x)$가 증가하는 구간을 모두 구하시오.
  points: 5
  depends_on:
  - '2'
  answer:
    kind: value
    value: x >= sqrt(6)-1
    equivalents:
    - '[sqrt(6)-1, oo)'
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        도함수 $f'(x)=\dfrac{x^2+2x-5}{(x+1)^2}$에서 $f'(x)=0$이면 $x=\sqrt6-1\ (x>0)$
      source_flow: 예시답안 p.7
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        함수 $f(x)$의 증가와 감소를 나타내는 표를 만들면 $0<x<\sqrt6-1$에서 $f'(x)<0$ (감소), $x=\sqrt6-1$에서 $f'(x)=0$ (극솟값 $2\sqrt6-5$), $x>\sqrt6-1$에서 $f'(x)>0$ (증가)이다. 따라서 제시문 가)에 의해 함수 $f(x)$는 구간 $[\sqrt6-1,\infty)$에서 증가한다.
      source_flow: 예시답안 p.7
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: $f'(x)=0$인 $x=\sqrt6-1$을 구하고 그 앞뒤의 $f'(x)$ 부호를 조사했다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: 증감표를 통해 증가하는 구간 $[\sqrt6-1,\infty)$를 정확히 서술했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '4'
  stem: |
    [문제 1-2] 좌표평면 위를 움직이는 점 P의 시각 $t$에서 위치 $(x,y)$가
    $$x=(1+\cos2t)\cos2t,\ y=(1+\cos2t)\sin2t$$
    일 때, 제시문 나)와 다)를 이용하여 다음 물음에 답하시오.
    (1) $\dfrac{dy}{dx}$를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: -(cos(2*t)+cos(4*t))/(sin(2*t)+sin(4*t))
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $x=\cos2t+\cos^22t$, $y=\sin2t+\cos2t\sin2t$를 $t$로 미분하면
        $$\dfrac{dx}{dt}=-2\sin2t-2\sin2t\cos2t-2\cos2t\sin2t=-2\sin2t-2\sin4t$$
        $$\dfrac{dy}{dt}=2\cos2t-2\sin2t\sin2t+2\cos2t\cos2t=2\cos2t+2\cos4t$$
      source_flow: 예시답안 p.7-8
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        따라서 $\dfrac{dy}{dx}=\dfrac{dy/dt}{dx/dt}=\dfrac{2\cos2t+2\cos4t}{-2\sin2t-2\sin4t}=-\dfrac{\cos2t+\cos4t}{\sin2t+\sin4t}$
      source_flow: 예시답안 p.7-8
      criteria:
      - 4.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: $\dfrac{dx}{dt}=-2\sin2t-2\sin4t$, $\dfrac{dy}{dt}=2\cos2t+2\cos4t$를 각각 구했다.
      steps:
      - 4b-1
    - id: 4.A1
      mark_type: A
      points: 2
      evidence: $\dfrac{dy}{dx}=-\dfrac{\cos2t+\cos4t}{\sin2t+\sin4t}$를 $t$에 대한 식으로 표현했다.
      depends_on:
      - 4.M1
      steps:
      - 4b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '5'
  stem: |
    (2) 시각 $t=\dfrac{\pi}{2}$에서 $t=\dfrac{3\pi}{2}$까지 점 P가 움직일 때, 점 P의 속력이 최대가 되는 시각 $t$를 구하고 이때의 점 P의 위치를 구하시오.
  points: 6
  depends_on:
  - '4'
  answer:
    kind: value
    value: t = pi; P = (2,0)
    equivalents: []
    tolerance: null
  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        점 P의 속력 $v$는
        $$v=\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}=\sqrt{4\sin^22t+8\sin2t\sin4t+4\sin^24t+4\cos^22t+8\cos2t\cos4t+4\cos^24t}$$
        $$=2\sqrt{2+2(\sin2t\sin4t+\cos2t\cos4t)}=2\sqrt{2+2\cos2t}=2\sqrt2\sqrt{1+(2\cos^2t-1)}=2\sqrt2\sqrt{2\cos^2t}=-4\cos t\ \left(\dfrac{\pi}{2}\le t\le\dfrac{3\pi}{2}\right)$$
      source_flow: 예시답안 p.8
      criteria:
      - 5.M1
    - id: 5b-2
      content: |
        $v=-4\cos t$가 최대인 시각은 $t=\pi$이다.
      source_flow: 예시답안 p.8
      criteria:
      - 5.A1
    - id: 5b-3
      content: |
        $t=\pi$일 때 $x=(1+\cos2\pi)\cos2\pi=2$, $y=(1+\cos2\pi)\sin2\pi=0$이므로 점 P의 위치는 $(2,0)$이다.
      source_flow: 예시답안 p.8
      criteria:
      - 5.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 5.M1
      mark_type: M
      points: 3
      evidence: 덧셈정리 등을 활용하여 속력을 $v=-4\cos t$ 꼴로 정리했다.
      steps:
      - 5b-1
    - id: 5.A1
      mark_type: A
      points: 2
      evidence: 속력이 최대가 되는 시각 $t=\pi$를 구했다.
      depends_on:
      - 5.M1
      steps:
      - 5b-2
    - id: 5.A2
      mark_type: A
      points: 1
      evidence: 그때의 점 P의 위치 $(2,0)$을 구했다.
      depends_on:
      - 5.M1
      - 5.A1
      steps:
      - 5b-3
