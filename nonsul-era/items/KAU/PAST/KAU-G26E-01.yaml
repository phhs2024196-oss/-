  - id: S8-B
    audience: B
    method_no: 1
    steps:
    - id: 8b-1
      content: |
        $x=0$일 때 $I(0)=\int_0^{\frac{\pi}{2}}\sin\theta d\theta=\Big[-\cos\theta\Big]_0^{\frac{\pi}{2}}=1$
      source_flow: 예시답안 p.9-10
      criteria:
      - 8.B1
    - id: 8b-2
      content: |
        $x>0$일 때 $u=1+x\cos\theta$로 치환하면 $\dfrac{du}{d\theta}=-x\sin\theta$이고, $\theta=0$일 때 $u=x+1$, $\theta=\dfrac{\pi}{2}$일 때 $u=1$이므로
        $$I(x)=\int_0^{\frac{\pi}{2}}\dfrac{\sin\theta}{1+x\cos\theta}d\theta=-\dfrac1x\int_{x+1}^1\dfrac1udu=\dfrac1x\Big[\ln\lvert u\rvert\Big]_1^{x+1}=\dfrac{\ln(x+1)}{x}\ (x>0)$$
      source_flow: 예시답안 p.9-10
      criteria:
      - 8.M1
    - id: 8b-3
      content: |
        따라서 $I(x)=\begin{cases}1&(x=0)\\\dfrac{\ln(x+1)}{x}&(x>0)\end{cases}$이고, $x>0$이면 $\ln(x+1)$과 $\dfrac1x$는 연속이므로 $I(x)$는 연속이다.
      source_flow: 예시답안 p.9-10
      criteria:
      - 8.R1
    - id: 8b-4
      content: |
        $x=0$일 때 $\lim_{x\to0+}I(x)=\lim_{x\to0+}\dfrac{\ln(1+x)}{x}=1$이고 $I(0)=\lim_{x\to0+}I(x)=1$이다. 따라서 제시문 라)에 의해 $I(x)$는 $x\ge0$에서 연속이다.
      source_flow: 예시답안 p.9-10
      criteria:
      - 8.A1
