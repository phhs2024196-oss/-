      depends_on:
      - 5.M1
      steps:
      - 5b-1
    - id: 5.M3
      mark_type: M
      points: 3
      evidence: (1)~(4)의 결과를 대입하고 $\sin A\neq0$으로 양변을 나누어 $r$에 대한 식을 얻었다.
      depends_on:
      - 5.M2
      steps:
      - 5b-2
    - id: 5.A1
      mark_type: A
      points: 2
      evidence: $r^4-r^2-1=0$을 얻었다.
      depends_on:
      - 5.M3
      steps:
      - 5b-3
    - id: 5.A2
      mark_type: A
      points: 4
      evidence: $r^2>0$임을 이용해 $r^2=\dfrac{1+\sqrt5}{2}$를 구했다.
      depends_on:
      - 5.M3
      - 5.A1
      steps:
      - 5b-4
