stimuli:
- label: 가
  body: |
    삼각형 ABC에 대하여 다음이 성립한다.
    $$\dfrac{\overline{BC}}{\sin A}=\dfrac{\overline{CA}}{\sin B}=\dfrac{\overline{AB}}{\sin C}$$
- label: 나
  body: |
    삼각형 ABC에 대하여 다음이 성립한다.
    $$\overline{AB}^2=\overline{BC}^2+\overline{CA}^2-2\overline{BC}\times\overline{CA}\times\cos C$$
    $$\overline{BC}^2=\overline{CA}^2+\overline{AB}^2-2\overline{CA}\times\overline{AB}\times\cos A$$
    $$\overline{CA}^2=\overline{AB}^2+\overline{BC}^2-2\overline{AB}\times\overline{BC}\times\cos B$$
- label: 다
  body: |
    삼각함수의 덧셈정리
    $$\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$$
    $$\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$$
- label: 라
  body: |
    세 수 $a$, $b$, $c$가 이 순서대로 등차수열을 이룰 때, $b$를 $a$와 $c$의 등차중항이라고 한다. 이때 $b=\dfrac{a+c}{2}$임을 알 수 있다.
- label: 마
  body: |
    첫째항부터 차례대로 일정한 수를 곱하여 만든 수열을 등비수열이라고 하고, 그 일정한 수를 공비라고 한다.
stem: |
  【문제 2】 (50점)
  ※ 다음 제시문을 읽고 물음에 대한 풀이 과정과 답을 제시하시오. (답만 기재하면 0점 처리)
subparts:
- id: '1'
  stem: |
    [문제 2-1] 삼각형 ABC에서 각 변의 길이를 $\overline{BC}=a$, $\overline{CA}=b$, $\overline{AB}=c$라 하자. $a$, $b$, $c$는 이 순서대로 공비가 $r$인 등비수열을 이룬다. $\sin(B-A)$, $\sin A$, $\sin C$는 이 순서대로 등차수열을 이룬다. 다음의 (1)~(4)를 $r$에 대한 식으로 나타내고, (1)~(4)를 이용하여 (5)의 물음에 답하시오.
    (1) $\cos A$
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: (r**4+r**2-1)/(2*r**3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        코사인법칙에 의해 $\cos A=\dfrac{b^2+c^2-a^2}{2bc}=\dfrac{(ar)^2+(ar^2)^2-a^2}{2\cdot ar\cdot ar^2}=\dfrac{r^4+r^2-1}{2r^3}$
      source_flow: 예시답안 p.16
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 코사인법칙 $\cos A=\dfrac{b^2+c^2-a^2}{2bc}$에 $b=ar$, $c=ar^2$을 대입했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $\cos A=\dfrac{r^4+r^2-1}{2r^3}$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
