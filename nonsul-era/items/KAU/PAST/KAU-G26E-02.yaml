- id: '5'
  stem: |
    (5) $r^2$의 값을 구하시오.
  points: 13
  depends_on:
  - '1'
  - '2'
  - '3'
  - '4'
  answer:
    kind: value
    value: (1+sqrt(5))/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        $\sin(B-A)$, $\sin A$, $\sin C$는 이 순서대로 등차수열을 이루므로 $2\sin A=\sin(B-A)+\sin C$이다. 삼각함수의 덧셈정리를 적용하면
        $$2\sin A=\sin B\cos A-\sin A\cos B+\sin C$$
      source_flow: 예시답안 p.16
      criteria:
      - 5.M1
      - 5.M2
    - id: 5b-2
      content: |
        (1)~(4)의 결과를 적용하면
        $$2\sin A=r\sin A\cdot\dfrac{r^4+r^2-1}{2r^3}-\sin A\cdot\dfrac{r^4-r^2+1}{2r^2}+r^2\sin A$$
        삼각형을 이루는 경우 $\sin A\neq0$이므로 양변을 $\sin A$로 나누면
        $$2=r\cdot\dfrac{r^4+r^2-1}{2r^3}-\dfrac{r^4-r^2+1}{2r^2}+r^2=\dfrac{r^4+r^2-1}{2r^2}-\dfrac{r^4-r^2+1}{2r^2}+r^2=1-\dfrac1{r^2}+r^2$$
      source_flow: 예시답안 p.16
      criteria:
      - 5.M3
    - id: 5b-3
      content: |
        이 식을 정리하면 $r^4-r^2-1=0$이다.
      source_flow: 예시답안 p.16
      criteria:
      - 5.A1
    - id: 5b-4
      content: |
        $r^2=\dfrac{1\pm\sqrt5}{2}$인데 $r^2>0$이므로 $r^2=\dfrac{1+\sqrt5}{2}$이다.
      source_flow: 예시답안 p.16
      criteria:
      - 5.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
