        $\overline{QC}=\overline{PA}=5$이므로 삼각형 CPQ에 코사인법칙을 적용하면
        $$\cos(\angle CPQ)=\dfrac{\overline{PC}^2+\overline{PQ}^2-\overline{QC}^2}{2\cdot\overline{PC}\cdot\overline{PQ}}=\dfrac{13^2+(8\sqrt2)^2-5^2}{2\cdot13\cdot8\sqrt2}=\dfrac{136}{104\sqrt2}=\dfrac{17}{13\sqrt2}=\dfrac{17\sqrt2}{26}$$
      source_flow: 예시답안 p.17
