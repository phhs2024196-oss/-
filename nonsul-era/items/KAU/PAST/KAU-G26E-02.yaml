- id: '6'
  stem: |
    [문제 2-2] 그림과 같이 정사각형 ABCD의 내부에 점 P가 있다. $\overline{PA}=5$, $\overline{PB}=8$, $\overline{PC}=13$이다. $\triangle PAB$를 점 B를 중심으로 시계 방향으로 $90^\circ$ 회전시킨 삼각형을 $\triangle QCB$라 하자.
    [그림 1: 정사각형 ABCD(왼쪽 위 D, 오른쪽 위 C, 왼쪽 아래 A, 오른쪽 아래 B)의 내부에 점 P가 있고 선분 PA, PB, PC가 그려져 있으며, 변 BC의 오른쪽 바깥에 점 Q가 있어 선분 CQ, BQ가 그려져 있다.]
    다음을 구하시오.
    (1) $\overline{PQ}$
  points: 4
  depends_on: []
  answer:
    kind: value
    value: 8*sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S6-B
    audience: B
    method_no: 1
    steps:
    - id: 6b-1
      content: |
        $\triangle PAB\equiv\triangle QCB$이므로 $\overline{PB}=\overline{QB}$이고, $90^\circ$ 회전이므로 $\angle PBQ=90^\circ$이다. 삼각형 PBQ는 직각이등변삼각형이므로 $\overline{PQ}=\sqrt2\cdot\overline{PB}=8\sqrt2$
      source_flow: 예시답안 p.16
      criteria:
      - 6.M1
      - 6.A1
  rubric:
