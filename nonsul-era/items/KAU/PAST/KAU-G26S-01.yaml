- id: '4'
  stem: |
    [문제 1-3] $\dfrac1{32}\le x\le1$에서 정의된 함수 $f(x)=\sin\left(\pi\log_2x+\dfrac{\pi}{4}\right)+\dfrac{\sqrt2}{2}$에 대하여 함수 $y=f(x)$의 그래프와 $x$축의 모든 교점의 $x$좌표의 합을 구하시오.
  points: 13
  depends_on: []
  answer:
    kind: value
    value: 21*(1+sqrt(2))/32
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $\dfrac1{32}\le x\le1$이므로 $-5\le\log_2x\le0$, 즉 $-\dfrac{19\pi}{4}\le\pi\log_2x+\dfrac\pi4\le\dfrac\pi4$
      source_flow: 예시답안 p.7-8
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        $f(x)=0$에서 $\sin\left(\pi\log_2x+\dfrac\pi4\right)=-\dfrac{\sqrt2}{2}$이므로
        $\pi\log_2x+\dfrac\pi4=-\dfrac34\pi$ 또는 $\pi\log_2x+\dfrac\pi4=-\dfrac14\pi$,
        $\pi\log_2x+\dfrac\pi4=-\dfrac{11}{4}\pi$ 또는 $\pi\log_2x+\dfrac\pi4=-\dfrac94\pi$,
        $\pi\log_2x+\dfrac\pi4=-\dfrac{19}{4}\pi$ 또는 $\pi\log_2x+\dfrac\pi4=-\dfrac{17}{4}\pi$
      source_flow: 예시답안 p.7-8
      criteria:
      - 4.M2
    - id: 4b-3
      content: |
        따라서 $x$는 $x=\dfrac12$ 또는 $x=\dfrac{\sqrt2}{2}$, $x=\dfrac18$ 또는 $x=\dfrac{\sqrt2}{8}$, $x=\dfrac1{32}$ 또는 $x=\dfrac{\sqrt2}{32}$이다.
      source_flow: 예시답안 p.7-8
      criteria:
      - 4.A1
    - id: 4b-4
      content: |
        구하는 합은 $\dfrac{21}{32}(1+\sqrt2)$이다.
      source_flow: 예시답안 p.7-8
      criteria:
      - 4.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: 정의역에서 $\pi\log_2x+\dfrac\pi4$의 범위 $-\dfrac{19\pi}{4}\le\cdot\le\dfrac\pi4$를 바르게 설정했다.
      steps:
      - 4b-1
    - id: 4.M2
      mark_type: M
      points: 4
      evidence: $\sin\theta=-\dfrac{\sqrt2}{2}$를 범위 안에서 풀어 $\theta$의 값 6개를 모두 구했다.
      depends_on:
      - 4.M1
      steps:
      - 4b-2
    - id: 4.A1
      mark_type: A
      points: 4
      evidence: $\theta$를 $x$로 환원하여 $x$의 값 6개를 구했다.
      depends_on:
