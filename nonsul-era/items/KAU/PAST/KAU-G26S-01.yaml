      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: $g'(1)=6$을 올바르게 계산했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [문제 1-2] 이차방정식 $4x^2-2x+1=0$의 두 근을 $\alpha$, $\beta$라 하자. $a_n=\alpha^n+\beta^n$일 때, $\sum_{n=1}^{100}a_n$의 값을 구하시오.
  points: 13
  depends_on: []
  answer:
    kind: value
    value: -1/2**100
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        근과 계수와의 관계에 따라 $\alpha+\beta=\dfrac12$, $\alpha\beta=\dfrac14$이므로
        $$\alpha^2+\beta^2=(\alpha+\beta)^2-2\alpha\beta=\dfrac14-2\times\dfrac14=-\dfrac14$$
        $$\alpha^3+\beta^3=(\alpha+\beta)^3-3\alpha\beta(\alpha+\beta)=\dfrac18-\dfrac34\times\dfrac12=-\dfrac14$$
        즉 $a_1=\dfrac12$, $a_2=a_3=-\dfrac14$이므로 $a_1+a_2+a_3=0$이다.
      source_flow: 예시답안 p.7
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $(2x+1)(4x^2-2x+1)=0$이므로 $\alpha^3=\beta^3=-\dfrac18$이다. 따라서 $a_4+a_5+a_6=-\dfrac18(a_1+a_2+a_3)$이고, 자연수 $n$에 대하여
        $$a_{3n+1}+a_{3n+2}+a_{3n+3}=-\dfrac18(a_{3n-2}+a_{3n-1}+a_{3n})$$
      source_flow: 예시답안 p.7
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $a_1+a_2+a_3=0$이므로 $a_{3n+1}+a_{3n+2}+a_{3n+3}=0$이고 $\sum_{n=1}^{99}a_n=0$이다. 따라서 $\sum_{n=1}^{100}a_n=a_{100}$이다.
      source_flow: 예시답안 p.7
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        $$\sum_{n=1}^{100}a_n=a_{100}=\alpha^{100}+\beta^{100}=(\alpha^{3})^{33}\alpha+(\beta^{3})^{33}\beta=(\alpha^3)^{33}(\alpha+\beta)=\left(-\dfrac18\right)^{33}\times\dfrac12=-\dfrac1{2^{100}}$$
      source_flow: 예시답안 p.7
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: 근과 계수의 관계로 $\alpha+\beta$, $\alpha\beta$를 구하고 $a_1+a_2+a_3=0$을 보였다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: $\alpha^3=\beta^3=-\dfrac18$ 또는 이에 해당하는 수열의 규칙(세 항씩의 합의 관계)을 찾았다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.M3
      mark_type: M
      points: 3
      evidence: 세 항씩 묶은 합이 $0$임을 이용해 $\sum_{n=1}^{100}a_n=a_{100}$으로 줄였다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: $a_{100}=-\dfrac1{2^{100}}$을 구했다.
      depends_on:
      - 3.M3
      steps:
      - 3b-4
    deductions:
    - code: D3-1
      condition: 풀이 과정 중 마지막에 간단한 계산 실수가 있는 경우(공식 채점기준 9점)
      effect: cap
      value: 9
    - code: D3-2
      condition: 풀이 과정은 이해하기 어렵거나 불완전하나 최종 답이 맞는 경우(공식 채점기준 6점)
      effect: cap
      value: 6
  outcome_codes:
  - code: '20'
    meaning: 만점
