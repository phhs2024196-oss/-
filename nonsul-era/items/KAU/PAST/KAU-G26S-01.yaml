- id: '5'
  stem: |
    [문제 1-4] 첫째항이 $a$, 공비가 $r$인 등비수열 $\{a_n\}$이 있다. $a_3=100$일 때, 다음 물음에 답하시오. (단, $1\le a\le100$, $r>0$)
    (1) $-(\log a)^3+(\log a_2)^2$을 $a$에 대한 식으로 나타내시오.
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: f = -L**3+(1+L/2)**2; L = log a
    equivalents: []
    tolerance: null
  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        $a_1=a$, $a_3=ar^2=100$이므로 $\log ar^2=\log100$, 즉 $\log a+2\log r=2$이다.
      source_flow: 예시답안 p.8
