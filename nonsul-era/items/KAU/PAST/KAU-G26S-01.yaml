stimuli:
- label: 가
  body: |
    미분가능한 함수 $y=f(x)$의 도함수는
    $$f'(x)=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}$$
- label: 나
  body: |
    이차방정식 $ax^2+bx+c=0$의 두 근을 $\alpha$, $\beta$라고 하면
    $$\alpha+\beta=-\dfrac ba,\ \alpha\beta=\dfrac ca$$
- label: 다
  body: |
    첫째항부터 차례대로 일정한 수를 곱하여 만든 수열을 등비수열이라 하고, 곱하는 일정한 수를 공비라고 한다. 첫째항이 $a$, 공비가 $r$인 등비수열의 첫째항부터 제 $n$항까지의 합을 $S_n$이라고 하면
    $r\neq1$일 때, $S_n=\dfrac{a(1-r^n)}{1-r}$
    $r=1$일 때, $S_n=na$
- label: 라
  body: |
    함수 $y=\sin x$는 주기가 $2\pi$인 주기 함수이다.
stem: ''
subparts:
- id: '1'
  stem: |
    [문제 1-1] 두 함수 $f(x)$, $g(x)$가 미분가능할 때, 다음 물음에 답하시오.
    (1) 제시문 가)를 이용하여 다음이 성립함을 보이시오.
    $$\{f(x)g(x)\}'=f'(x)g(x)+f(x)g'(x)$$
  points: 8
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $$\{f(x)g(x)\}'=\lim_{h\to0}\dfrac{f(x+h)g(x+h)-f(x)g(x)}{h}$$
        $$=\lim_{h\to0}\dfrac{f(x+h)g(x+h)-f(x)g(x+h)+f(x)g(x+h)-f(x)g(x)}{h}$$
      source_flow: 예시답안 p.6
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $$=\lim_{h\to0}\dfrac{\{f(x+h)-f(x)\}g(x+h)+f(x)\{g(x+h)-g(x)\}}{h}$$
        $$=\lim_{h\to0}\dfrac{\{f(x+h)-f(x)\}g(x+h)}{h}+\lim_{h\to0}\dfrac{f(x)\{g(x+h)-g(x)\}}{h}$$
      source_flow: 예시답안 p.6
      criteria:
      - 1.M2
      - 1.M3
    - id: 1b-3
      content: |
        $$=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}\times\lim_{h\to0}g(x+h)+\lim_{h\to0}f(x)\times\lim_{h\to0}\dfrac{g(x+h)-g(x)}{h}=f'(x)g(x)+f(x)g'(x)$$
      source_flow: 예시답안 p.6
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 미분의 정의를 쓰고 중간항 $-f(x)g(x+h)+f(x)g(x+h)$를 더하고 뺐다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $\lim_{h\to0}\dfrac{\{f(x+h)-f(x)\}g(x+h)}{h}$ 꼴의 항으로 분리했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: $\lim_{h\to0}\dfrac{f(x)\{g(x+h)-g(x)\}}{h}$ 꼴의 항으로 분리했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: 극한의 성질로 $f'(x)g(x)+f(x)g'(x)$를 얻었다.
      depends_on:
      - 1.M2
      - 1.M3
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) 함수 $g(x)=(x^2+1)f(x)$에 대하여 $g'(1)$의 값을 구하시오. (단, $f(1)=2$, $f'(1)=1$)
  points: 3
  depends_on:
  - '1'
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g'(x)=\dfrac{d}{dx}\{(x^2+1)f(x)\}=\{(x^2+1)f(x)\}'=\{x^2+1\}'f(x)+(x^2+1)f'(x)=2xf(x)+(x^2+1)f'(x)$
      source_flow: 예시답안 p.6-7
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $g'(1)=(2\times1)f(1)+(1^2+1)f'(1)=2f(1)+2f'(1)=6$
      source_flow: 예시답안 p.6-7
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
