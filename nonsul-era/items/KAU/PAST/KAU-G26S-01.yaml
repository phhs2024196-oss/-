      - 4b-3
    - id: 4.A2
      mark_type: A
      points: 2
      evidence: 교점의 $x$좌표의 합 $\dfrac{21}{32}(1+\sqrt2)$를 구했다.
      depends_on:
      - 4.M2
      - 4.A1
      steps:
      - 4b-4
    deductions:
    - code: D4-1
      condition: 6개의 해 중 하나를 틀릴 때마다(공식 채점기준 −2)
      effect: minus
      value: 2
