- id: '5'
  stem: |
    [문제 2-3] 다항함수 $f(x)$에 대하여 $f(x)=-4x^3+\left\{\dfrac32x\int_0^1tf'(t)dt\right\}^2-2x+\int_0^2f(t)dt$가 성립할 때, 함수 $f(x)$를 모두 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: set
    value: f1 = -4*x**3+4*x**2-2*x+28/3; f2 = -4*x**3+9*x**2-2*x-4
    equivalents: []
    tolerance: null
  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        $a=\left(\dfrac32\int_0^1tf'(t)dt\right)^2$이고 $b=\int_0^2f(t)dt$라 하면 $f(x)=-4x^3+ax^2-2x+b$이다.
      source_flow: 예시답안 p.16-17
      criteria:
      - 5.M1
    - id: 5b-2
      content: |
        $f'(x)=-12x^2+2ax-2$이다.
        $$a=\left(\dfrac32\int_0^1tf'(t)dt\right)^2=\left(\dfrac32\int_0^1(-12t^3+2at^2-2t)dt\right)^2=\left(\dfrac32\left[-3t^4+\dfrac{2a}{3}t^3-t^2\right]_0^1\right)^2=(a-6)^2$$
        이 식을 정리하면 $a^2-13a+36=0$이므로 $a=4$ 또는 $a=9$이다.
      source_flow: 예시답안 p.16-17
      criteria:
      - 5.M2
    - id: 5b-3
      content: |
        이때 $b=\int_0^2f(t)dt=\int_0^2(-4t^3+at^2-2t+b)dt=-20+\dfrac83a+2b$이므로 $b=20-\dfrac83a$이다.
      source_flow: 예시답안 p.16-17
      criteria:
      - 5.M3
    - id: 5b-4
      content: |
        따라서 $a=4$일 때 $b=\dfrac{28}{3}$ 또는 $a=9$일 때 $b=-4$이다. 그러므로 $f(x)=-4x^3+4x^2-2x+\dfrac{28}{3}$ 또는 $f(x)=-4x^3+9x^2-2x-4$이다.
      source_flow: 예시답안 p.16-17
      criteria:
      - 5.A1
