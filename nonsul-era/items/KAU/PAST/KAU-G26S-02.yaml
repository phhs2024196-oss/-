key_idea: $f(x)=x\lvert(x-1)(x+1)\rvert$를 구간별로 나누어 증감표를 만들고 그래프와 직선의 교점의 수를 따진다. 이차함수의 꼭짓점 $a+\dfrac1a$를 절대부등식으로 평가해 $a$의 부호별로 최솟값 $f(1)=1$을 보이고, 정적분을 상수로 놓아 다항함수를 정하며, 도형의 넓이를 정적분과 삼각형으로 구한다.
stuck: (2-2)(2)에서 꼭짓점의 위치를 $a+\dfrac1a$로 놓고 $a>0$, $a<0$으로 나누어 (1)을 적용하는 것, (2-3)에서 $\int_0^1tf'(t)dt$와 $\int_0^2f(t)dt$를 상수로 놓는 것
