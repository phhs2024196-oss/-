    method_no: 1
    steps:
    - id: 7b-1
      content: |
        $k=1$일 때 $\alpha=-2$이므로, 점 $(-2,4)$를 지나고 $B_1$의 넓이를 이등분하는 직선을 $l$이라 하자. 직선 $l$의 기울기를 $m$이라 할 때 직선의 방정식은 $y-4=m(x+2)$ ①이다. 직선 $l$과 $y=x$의 교점은 ①에 $y=x$를 대입하여 $x-4=m(x+2)$이므로 교점의 $x$좌표는 $x=\dfrac{2m+4}{1-m}$ ②이다.
      source_flow: 예시답안 p.17-18
      criteria:
      - 7.M1
    - id: 7b-2
      content: |
        $k=1$일 때 $B_1$의 넓이는 $1$이므로 $\dfrac12=\dfrac12\times(2m+4)\times\dfrac{2m+4}{1-m}$이다. 이를 정리하면 $4m^2+17m+15=0$이다. 이때 $m=-3$, $m=-\dfrac54$이다.
      source_flow: 예시답안 p.17-18
      criteria:
      - 7.M2
    - id: 7b-3
      content: |
        그런데 이 직선의 기울기는 $-2<m<-1$이므로 직선 $l$의 기울기는 $m=-\dfrac54$이다.
      source_flow: 예시답안 p.17-18
      criteria:
      - 7.A1
