stimuli:
- label: 가
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능할 때, $(a,b)$의 모든 $x$에 대하여
    (1) $f'(x)>0$이면 $f(x)$는 $[a,b]$에서 증가한다.
    (2) $f'(x)<0$이면 $f(x)$는 $[a,b]$에서 감소한다.
- label: 나
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 $f(x)$의 부정적분 중의 하나를 $F(x)$라고 하면 $f(x)$의 $a$부터 $b$까지의 정적분은
    $$\int_a^bf(x)dx=\Big[F(x)\Big]_a^b=F(b)-F(a)$$
- label: 다
  body: |
    함수의 극한의 성질
    $\lim_{x\to a}f(x)=L$, $\lim_{x\to a}g(x)=M$ ($L$, $M$은 실수)일 때,
    (1) $\lim_{x\to a}cf(x)=cL$ ($c$는 상수)
    (2) $\lim_{x\to a}\{f(x)+g(x)\}=L+M$
    (3) $\lim_{x\to a}\{f(x)-g(x)\}=L-M$
    (4) $\lim_{x\to a}f(x)g(x)=LM$
    (5) $\lim_{x\to a}\dfrac{f(x)}{g(x)}=\dfrac LM$ ($M\neq0$)
    ※ 함수의 극한의 성질은 $x\to a-$, $x\to a+$, $x\to\infty$, $x\to-\infty$일 때도 성립한다.
stem: |
  【문제 2】 (50점)
  ※ 다음 제시문을 읽고 물음에 대한 풀이 과정과 답을 제시하시오.(답만 기재하면 0점 처리)
subparts:
- id: '1'
  stem: |
    [문제 2-1] 함수 $f(x)=x\lvert(x-1)(x+1)\rvert$에 대하여 다음 물음에 답하시오.
    (1) 제시문 가)를 이용하여 함수 $f(x)$의 증가와 감소를 조사하시오.
  points: 9
  depends_on: []
  answer:
    kind: set
    value: inc = (-oo,-1]|[-sqrt(3)/3,sqrt(3)/3]|[1,oo); dec = [-1,-sqrt(3)/3]|[sqrt(3)/3,1]
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x<-1$일 때 $f(x)=x(x-1)(x+1)=x^3-x$이므로 $f'(x)=3x^2-1=3\left(x-\dfrac1{\sqrt3}\right)\left(x+\dfrac1{\sqrt3}\right)$이다. 이때 $x<-1$의 구간에서 $f'(x)>0$이므로 $f(x)$는 증가하고 $f(-1)=0$이다.
      source_flow: 예시답안 p.15
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $-1\le x<1$일 때 $f(x)=-x(x-1)(x+1)=-x^3+x$이므로 $f'(x)=-3x^2+1=-3\left(x-\dfrac1{\sqrt3}\right)\left(x+\dfrac1{\sqrt3}\right)$이다. 증감표는 $-1<x<-\dfrac1{\sqrt3}$에서 $f'(x)<0$ (감소), $-\dfrac1{\sqrt3}<x<\dfrac1{\sqrt3}$에서 $f'(x)>0$ (증가), $\dfrac1{\sqrt3}<x<1$에서 $f'(x)<0$ (감소)이고 $f(-1)=0$, $f\left(-\dfrac1{\sqrt3}\right)=-\dfrac{2\sqrt3}{9}$, $f\left(\dfrac1{\sqrt3}\right)=\dfrac{2\sqrt3}{9}$, $f(1)=0$이다.
      source_flow: 예시답안 p.15
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $x\ge1$일 때 $f(x)=x(x-1)(x+1)=x^3-x$이므로 $f'(x)=3x^2-1=3\left(x-\dfrac1{\sqrt3}\right)\left(x+\dfrac1{\sqrt3}\right)$이다. 이때 $x\ge1$의 구간에서 $f'(x)>0$이므로 $f(x)$는 증가하고 $f(1)=0$이다.
      source_flow: 예시답안 p.15
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서 증가하는 구간은 $(-\infty,-1]$, $\left[-\dfrac{\sqrt3}{3},\dfrac{\sqrt3}{3}\right]$, $[1,\infty)$이고, 감소하는 구간은 $\left[-1,-\dfrac{\sqrt3}{3}\right]$, $\left[\dfrac{\sqrt3}{3},1\right]$이다. (증감표 대신 그래프를 그린 경우 인정)
      source_flow: 예시답안 p.15
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $x<-1$에서 $f(x)=x^3-x$, $f'(x)>0$임을 보여 증가함을 밝혔다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $-1\le x<1$에서 $f(x)=-x^3+x$의 증감표(극값 $\pm\dfrac{2\sqrt3}{9}$)를 구했다.
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: $x\ge1$에서 $f(x)=x^3-x$, $f'(x)>0$임을 보여 증가함을 밝혔다.
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 증가하는 구간과 감소하는 구간을 정확히 서술했다.
      depends_on:
      - 1.M1
      - 1.M2
      - 1.M3
      steps:
      - 1b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) 함수 $y=f(x)$의 그래프와 직선 $y=k$가 만나는 점의 개수가 $2$일 때, 실수 $k$의 값을 모두 구하시오.
  points: 3
  depends_on:
  - '1'
  answer:
    kind: set
    value: k = -2*sqrt(3)/9|2*sqrt(3)/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        그래프의 개형에서 직선 $y=k$와 $y=f(x)$가 만나는 점의 개수를 따진다.
      source_flow: 예시답안 p.15
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        직선 $y=k$와 $y=f(x)$가 만나는 점의 개수가 $2$이므로 $k=-\dfrac{2\sqrt3}{9}$, $k=\dfrac{2\sqrt3}{9}$이다.
      source_flow: 예시답안 p.15
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 1
      evidence: 증감표(또는 그래프 개형)를 활용하여 직선 $y=k$와의 교점의 개수를 따졌다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: $k=-\dfrac{2\sqrt3}{9}$, $k=\dfrac{2\sqrt3}{9}$를 모두 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [문제 2-2] $-3\le x\le1$에서 정의된 함수 $f(x)=ax^2-2(a^2+1)x+2a^2-a+3$ ($a$는 실수)에 대하여 다음 물음에 답하시오.
    (1) $s>0$, $t>0$일 때, 부등식 $\dfrac{s+t}{2}\ge\sqrt{st}$가 성립함을 보이시오.
  points: 3
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $s>0$, $t>0$일 때, $\dfrac{s+t}{2}-\sqrt{st}=\dfrac{(\sqrt s)^2-2\sqrt{st}+(\sqrt t)^2}{2}=\dfrac{(\sqrt s-\sqrt t)^2}{2}\ge0$이다.
      source_flow: 예시답안 p.16
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        따라서 $\dfrac{s+t}{2}\ge\sqrt{st}$가 성립한다.
      source_flow: 예시답안 p.16
      criteria:
      - 3.R1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: $\dfrac{s+t}{2}-\sqrt{st}=\dfrac{(\sqrt s-\sqrt t)^2}{2}$로 변형했다.
      steps:
      - 3b-1
    - id: 3.R1
      mark_type: R
      points: 1
      evidence: $(\sqrt s-\sqrt t)^2\ge0$임을 근거로 부등식이 성립함을 결론지었다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '4'
  stem: |
    (2) (1)의 부등식을 이용하여 실수 $a$의 값에 관계없이 함수 $f(x)$의 최솟값이 일정함을 보이시오.
  points: 10
  depends_on:
  - '3'
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        i) $a=0$일 때, $y=-2x+3$은 $-3\le x\le1$에서 감소하므로 $x=1$에서 최솟값 $1$이다.
      source_flow: 예시답안 p.16
      criteria:
      - 4.B1
    - id: 4b-2
      content: |
        ii) $a>0$일 때, $y=a\left\{x-\left(a+\dfrac1a\right)\right\}^2-\dfrac{(a^2+1)^2}{a}+2a^2-a+3$이므로 꼭짓점의 $x$좌표는 $a+\dfrac1a$이다. $a>0$이고 $\dfrac1a>0$이므로 (1)에 의해 $a+\dfrac1a\ge2$이다.
      source_flow: 예시답안 p.16
      criteria:
      - 4.M1
    - id: 4b-3
      content: |
        즉 꼭짓점의 $x$좌표가 $2$보다 크거나 같으므로 아래로 볼록한 이차함수 $f(x)$는 $-3\le x\le1$의 범위에서 꼭짓점의 $x$좌표에서 가장 가까이 있는 $x=1$에서 최솟값을 갖고, 이때 최솟값은 $f(1)=1$이다.
      source_flow: 예시답안 p.16
      criteria:
      - 4.R1
    - id: 4b-4
      content: |
        iii) $a<0$일 때, $y=a\left\{x-\left(a+\dfrac1a\right)\right\}^2-\dfrac{(a^2+1)^2}{a}+2a^2-a+3$이므로 꼭짓점의 $x$좌표는 $a+\dfrac1a$이다. $b=-a$라 하면 $b>0$이고 $\dfrac1b>0$이므로 (1)에 의해 $b+\dfrac1b\ge2$이다. 따라서 $a+\dfrac1a=-\left(b+\dfrac1b\right)\le-2$이므로 꼭짓점의 $x$좌표가 $-2$보다 작거나 같다.
      source_flow: 예시답안 p.16
      criteria:
      - 4.M2
    - id: 4b-5
      content: |
        꼭짓점의 $x$좌표가 $-2$보다 작거나 같으므로 위로 볼록한 이차함수 $f(x)$는 $-3\le x\le1$의 범위에서 꼭짓점의 $x$좌표에서 가장 멀리 있는 $x=1$에서 최솟값을 갖고, 이때 최솟값은 $f(1)=1$이다. i), ii), iii)에 의해 최솟값은 $1$로 일정하다.
      source_flow: 예시답안 p.16
      criteria:
      - 4.R2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
