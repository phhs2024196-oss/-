- id: '6'
  stem: |
    [문제 2-4] 함수 $f(x)=\begin{cases}x&(x\ge0)\\x^2&(x<0)\end{cases}$과 함수 $g(x)=-kx+2k^2$ ($k>0$)이 있다.
    두 함수 $y=f(x)$, $y=g(x)$의 그래프가 만나는 두 교점의 $x$좌표는 각각 $\alpha$, $\beta$($\alpha<\beta$)이고 두 함수 $y=f(x)$, $y=g(x)$의 그래프로 둘러싸인 영역은 $y$축에 의해 그림과 같이 $A_k$와 $B_k$의 두 부분으로 나뉜다. 다음 물음에 답하시오.
    [그림 1: 좌표평면에서 $y=f(x)$와 $y=g(x)$의 그래프. $x<0$에서 아래로 볼록한 포물선 부분과 $x\ge0$에서 오른쪽 위로 향하는 직선 $y=f(x)$, 왼쪽 위에서 오른쪽 아래로 향하는 직선 $y=g(x)$가 그려져 있다. 두 그래프의 교점의 $x$좌표 $\alpha$, $\beta$가 $x$축에 표시되어 있고, 둘러싸인 영역 중 $y$축 왼쪽 부분이 $A_k$(회색), $y$축 오른쪽 부분이 $B_k$(빨간색)이다.]
    (1) 도형 $A_k$의 넓이를 $S(k)$, 도형 $B_k$의 넓이를 $T(k)$라 할 때, $\lim_{k\to\infty}\dfrac{S(k)}{T(k)}$의 값을 구하시오.
  points: 7
  depends_on: []
  answer:
    kind: value
    value: 5/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S6-B
    audience: B
    method_no: 1
    steps:
    - id: 6b-1
      content: |
        $x<0$일 때, $y=x^2$과 $y=-kx+2k^2$의 교점의 $x$좌표는 $x=-2k$이다. 따라서 $A_k$의 넓이를 구하면 $S(k)=\int_{-2k}^0(-x^2-kx+2k^2)dx=\dfrac{10}{3}k^3$이다.
      source_flow: 예시답안 p.17
      criteria:
      - 6.M1
    - id: 6b-2
      content: |
        $x>0$일 때, $y=x$와 $y=-kx+2k^2$의 교점의 $x$좌표는 $x=\dfrac{2k^2}{k+1}$이다. $B_k$는 $y$절편이 밑변이고 높이가 교점의 $x$좌표인 삼각형의 넓이이므로 $T(k)=\dfrac{2k^4}{k+1}$이다.
      source_flow: 예시답안 p.17
      criteria:
      - 6.M2
    - id: 6b-3
      content: |
        따라서 $\lim_{k\to\infty}\dfrac{S(k)}{T(k)}=\lim_{k\to\infty}\left(\dfrac{10}{3}k^3\times\dfrac{k+1}{2k^4}\right)=\lim_{k\to\infty}\dfrac{5(k+1)}{3k}=\dfrac53$이다.
      source_flow: 예시답안 p.17
      criteria:
      - 6.A1
