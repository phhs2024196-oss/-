      isw: true
    criteria:
    - id: 4.B1
      mark_type: B
      points: 2
      evidence: $a=0$일 때 최솟값 $f(1)=1$을 구했다.
      steps:
      - 4b-1
    - id: 4.M1
      mark_type: M
      points: 2
      evidence: $a>0$일 때 꼭짓점의 $x$좌표 $a+\dfrac1a$를 구하고 (1)로 $a+\dfrac1a\ge2$임을 보였다.
      steps:
      - 4b-2
    - id: 4.R1
      mark_type: R
      points: 2
      evidence: $a>0$일 때 아래로 볼록하고 꼭짓점이 $x\ge2$이므로 $x=1$에서 최소이며 $f(1)=1$임을 밝혔다.
      depends_on:
