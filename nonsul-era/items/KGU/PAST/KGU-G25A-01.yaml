intent: |
  도형(삼각형)의 높이·밑변·넓이에 나타나는 특징을 수열과 연계하여 문제 해결에 적용할 수 있는지 평가한다. 로그함수 연산의 특징을 이용해 등차수열과 등비수열을 구별하고, 수열의 합을 구하는 방법을 알고 있는지 본다.
key_idea: |
  $a_n=3^n$이면 $f(a_n)=\log_3 3^n=n$이므로 높이는 등차수열 $n$, 밑변 $a_{n+1}-a_{n-1}=8\times3^{n-1}$은 등비수열이 된다.
stuck: |
