stimuli:
- label: 가
  body: |
    우리 주변에서 일어나는 현상 중 많은 것이 지수함수나 로그함수의 그래프 형태로 나타난다.
    『고등학교 수학 Ⅰ』
- label: 나
  body: |
    수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합 $a_1+a_2+a_3+\cdots+a_n$을 합의 기호 $\sum$를 사용하여 다음과 같이 나타낸다.
    $$a_1+a_2+a_3+\cdots+a_n=\sum_{k=1}^{n}a_k$$
    『고등학교 수학 Ⅰ』

stem: |
  [문항 1] 가와 나에 근거하여 논제에 답하시오.

  논제 1. 함수 $f(x)$가 $f(x)=\log_3x$이고, 수열 $\{a_n\}$을 첫째항이 3이고 공비가 3인 등비수열이라 하자. $n$은 $n\ge2$인 자연수이고, 세 점 $(a_n,f(a_n))$, $(a_{n-1},0)$, $(a_{n+1},0)$을 꼭짓점으로 하는 삼각형을 $T_n$이라 하자.

subparts:
- id: '1'
  stem: |
    삼각형 $T_n$의 밑변을 두 점 $(a_{n-1},0)$과 $(a_{n+1},0)$을 잇는 선분으로 선택할 때의 높이를 $h_n$이라 하자. 이때 $\displaystyle\sum_{k=2}^{n}h_k^2$을 구하시오. [15점]
  points: 15
  depends_on: []
  answer: {kind: expression, value: '(2*n**3 + 3*n**2 + n - 6)/6', equivalents: ['n*(n+1)*(2*n+1)/6 - 1'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 밑변이 $x$축 위에 있으므로 높이는 꼭짓점의 $y$좌표 $f(a_n)=\log_33^n=n$이다.
    steps:
    - {id: 1a, content: '$h_k=k$이므로 $\sum_{k=2}^n k^2=\tfrac{n(n+1)(2n+1)}{6}-1$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 밑변이 $x$축 위에 있으면 높이는 무엇인가?
    - $f(3^n)$을 계산해 보자.
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북 p.66 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        첫째항이 3이고 공비가 3인 등비수열 $a_n$은 $a_n=3^n$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $f(a_n)=\log_33^n=n$이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        삼각형 $T_n$의 높이는 $h_n=f(a_n)=n$이므로
        $$\sum_{k=2}^{n}h_k^2=\sum_{k=2}^{n}k^2=\sum_{k=1}^{n}k^2-1^2=\frac{n(n+1)(2n+1)}{6}-1=\frac{2n^3+3n^2+n-6}{6}$$
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: |
        첫째항이 3이고 공비가 3인 등비수열의 일반항 $a_n=3^n$을 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: |
        $f(a_n)=\log_33^n=n$을 적었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: |
        높이 $h_n=f(a_n)=n$을 밝히고 $\sum_{k=2}^{n}h_k^2=\sum_{k=1}^{n}k^2-1^2=\dfrac{2n^3+3n^2+n-6}{6}$을 구했다.
      depends_on: []
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

- id: '2'
  stem: |
    삼각형 $T_n$의 넓이를 $A_n$이라 할 때, $\displaystyle\sum_{k=2}^{n}\frac{A_k}{k}$을 구하시오. [20점]
  points: 20
  depends_on: ['1']
  answer: {kind: expression, value: '6*(3**(n-1) - 1)', equivalents: ['2*3**n - 6'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 밑변 $a_{n+1}-a_{n-1}=8\times3^{n-1}$, 높이 $n$이므로 $\tfrac{A_k}{k}=4\cdot3^{k-1}$은 등비수열이다.
    steps:
    - {id: 2a, content: '$\sum_{k=2}^n 4\cdot3^{k-1}=6(3^{n-1}-1)$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - 밑변의 길이를 $3^{n-1}$로 묶어 보자.
    - $A_k$를 $k$로 나누면 어떤 수열이 남는가?
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북 p.66 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        삼각형 $T_n$의 밑변의 길이는 $a_{n+1}-a_{n-1}=3^{n+1}-3^{n-1}=8\times3^{n-1}$이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        삼각형의 넓이는
        $$A_n=\frac12\times n\times(3^{n+1}-3^{n-1})=4\times n\times3^{n-1}$$
      criteria: [2.B2]
    - id: 2b-3
      content: |
        따라서
        $$\sum_{k=2}^{n}\frac{A_k}{k}=\sum_{k=2}^{n}4\cdot3^{k-1}=\frac{12(3^{n-1}-1)}{3-1}=6(3^{n-1}-1)$$
        (보충) 첫째항 $4\cdot3=12$, 공비 3, 항수 $n-1$인 등비수열의 합이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: |
        삼각형 $T_n$의 밑변의 길이 $a_{n+1}-a_{n-1}=3^{n+1}-3^{n-1}=8\times3^{n-1}$을 구했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 5
      evidence: |
        넓이 $A_n=\dfrac12\times n\times(3^{n+1}-3^{n-1})=4\times n\times3^{n-1}$을 구했다.
      depends_on: []
      ft: {allowed: true, from: [1.B3], max_points: 5}
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 10
      evidence: |
        $\sum_{k=2}^{n}\dfrac{A_k}{k}=\sum_{k=2}^{n}4\cdot3^{k-1}=\dfrac{12(3^{n-1}-1)}{3-1}=6(3^{n-1}-1)$을 구했다.
      depends_on: []
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

