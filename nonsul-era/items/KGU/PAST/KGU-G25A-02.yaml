stimuli:
- label: 가
  body: |
    오른쪽 그림과 같이 삼각형 $ABC$의 넓이를 $S$라고 하면
    $$S=\frac12bc\sin A=\frac12ca\sin B=\frac12ab\sin C$$
    이다.
    [그림: 삼각형 ABC. 꼭짓점 A의 각 $A$, B의 각 $B$, C의 각 $C$가 표시되어 있고, 변 $\mathrm{BC}=a$, $\mathrm{CA}=b$, $\mathrm{AB}=c$가 점선 호로 표시되어 있다.]
    『고등학교 수학 Ⅰ』

stem: |
  [문항 2] 가에 근거하여 논제에 답하시오.

  논제 2. 시계판 위에 시침과 분침을 핀으로 고정하여 만든 원형의 아날로그 시계가 있다. 이 시계의 시침과 분침은 일정한 속도로 시계판 위를 회전하는데, 시침은 12시간마다, 분침은 1시간마다 시계판 위를 한 바퀴 회전한다. 고정핀으로부터 시침과 분침의 끝부분까지의 길이는 각각 $10cm$, $20cm$이다.

subparts:
- id: '1'
  stem: |
    시침을 기준으로 분침이 시계방향으로 이루는 각을 $\theta$라 할 때, 고정핀과 시침의 끝부분, 분침의 끝부분이 이루는 삼각형의 넓이가 $50cm^2$ 이상이 되는 $\theta$의 범위를 $0\le\theta\le4\pi$에서 구하시오. [25점]
  points: 25
  depends_on: []
  answer: {kind: set, value: 'Union(Interval(pi/6, 5*pi/6), Interval(7*pi/6, 11*pi/6), Interval(13*pi/6, 17*pi/6), Interval(19*pi/6, 23*pi/6))', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 넓이는 $100\lvert\sin\theta\rvert$이고, $0\le\theta\le\pi$의 해 $\tfrac{\pi}{6}\le\theta\le\tfrac{5\pi}{6}$를 $\pi$ 간격으로 옮긴다.
    steps:
    - {id: 1a, content: '$100\sin\theta\ge50\iff\tfrac{\pi}{6}\le\theta\le\tfrac{5\pi}{6}$ → $[0,4\pi]$에서 네 구간', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - 두 변의 길이와 끼인각으로 넓이를 나타내 보자.
    - 끼인각이 $\pi$보다 크면 실제 끼인각은 무엇인가?
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북 p.70 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        시침과 분침이 시계방향으로 이루는 각을 $\theta\ (0\le\theta\le\pi)$라 하면 삼각형의 넓이는
        $$\frac12\times10\times20\times\sin\theta=100\sin\theta\ (cm^2)$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        그러므로 삼각형의 넓이가 $50cm^2$보다 커지려면
        $$100\sin\theta\ge50\Rightarrow\sin\theta\ge\frac12\Rightarrow\frac{\pi}{6}\le\theta\le\frac{5\pi}{6}$$
      criteria: [1.A1]
    - id: 1b-3
      content: |
        따라서 시침을 기준으로 분침이 시계방향으로 한 바퀴 회전하며 이루는 각을 $\theta$라 할 때, $0\le\theta\le4\pi$ 사이에 있는 $\theta$의 범위는
        $$\frac{\pi}{6}\le\theta\le\frac{5\pi}{6}\ \text{또는}\ \frac{7\pi}{6}\le\theta\le\frac{11\pi}{6}\ \text{또는}\ \frac{13\pi}{6}\le\theta\le\frac{17\pi}{6}\ \text{또는}\ \frac{19\pi}{6}\le\theta\le\frac{23\pi}{6}$$
        이다. (보충) $\pi<\theta<2\pi$이면 실제 끼인각은 $2\pi-\theta$이므로 넓이는 $100\lvert\sin\theta\rvert$이고, 주기 $\pi$로 같은 조건이 반복된다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        시침과 분침이 시계방향으로 이루는 각을 $\theta\ (0\le\theta\le\pi)$라 하고 삼각형의 넓이를 $\dfrac12\times10\times20\times\sin\theta=100\sin\theta$로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $100\sin\theta\ge50\Rightarrow\sin\theta\ge\dfrac12\Rightarrow\dfrac{\pi}{6}\le\theta\le\dfrac{5\pi}{6}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 10
      evidence: |
        $0\le\theta\le4\pi$에서 $\dfrac{\pi}{6}\le\theta\le\dfrac{5\pi}{6}$ 또는 $\dfrac{7\pi}{6}\le\theta\le\dfrac{11\pi}{6}$ 또는 $\dfrac{13\pi}{6}\le\theta\le\dfrac{17\pi}{6}$ 또는 $\dfrac{19\pi}{6}\le\theta\le\dfrac{23\pi}{6}$을 적었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

- id: '2'
  stem: |
    오후 1시부터 오후 6시까지 5시간 동안 시계를 관찰할 때, 고정핀과 시침의 끝부분, 분침의 끝부분이 이루는 삼각형의 넓이가 $50cm^2$ 이상이 되는 총 시간은 얼마인지 설명하시오. [40점]
  points: 40
  depends_on: ['1']
  answer: {kind: value, value: '36/11', equivalents: ['3 + 3/11'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 5시간 동안 상대각은 $-\tfrac{\pi}{6}$에서 $9\pi$까지 $\tfrac{55}{6}\pi$ 회전하고, 그중 조건을 만족하는 각은 $\pi$마다 $\tfrac{4}{6}\pi$씩 9번이다.
    steps:
    - {id: 2a, content: '$9\times\tfrac46\pi=6\pi$, $5\times\dfrac{6\pi}{\frac{55}{6}\pi}=\tfrac{36}{11}$시간', criteria: [2.M1, 2.A1, 2.A2]}
    hint_ladder:
    - 1시 정각과 6시 정각에 시침에 대한 분침의 각은 각각 얼마인가?
    - 회전한 전체 각 중 조건을 만족하는 각의 비율은?
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북 p.70 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        시침을 기준으로 분침은 1시 정각에 시계방향으로 $\theta=-\dfrac{\pi}{6}$에 위치한다고 하면, 1시부터 6시 사이에 시침과 분침의 방향이 일치할 때가 총 5번 있고, 6시 정각에 시침과 분침이 이루는 각은 $\pi$이므로 5시간 동안 $\theta$의 범위는 $-\dfrac{\pi}{6}\le\theta\le9\pi$이고, 따라서 회전한 각의 크기는 $\dfrac{55}{6}\pi$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        이 중에서 삼각형의 넓이가 $50cm^2$보다 큰 $\theta$의 크기는 $9\times\dfrac46\pi=6\pi$이다.
        (보충) $0\le\theta\le9\pi$의 길이 $\pi$인 구간 9개마다 (1)의 조건을 만족하는 길이 $\dfrac{4\pi}{6}$이 있고, $-\dfrac{\pi}{6}\le\theta<0$에서는 넓이가 $50cm^2$ 미만(끝점 제외)이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        상대 회전 속도가 일정하므로 시간은 각에 비례하여
        $$5\times\frac{6\pi}{\frac{55}{6}\pi}=5\times\frac{6}{\frac{55}{6}}=\frac{36}{11}\ (\text{시간})$$
        이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        5시간 동안 $\theta$의 범위가 $-\dfrac{\pi}{6}\le\theta\le9\pi$임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        이 중에서 삼각형의 넓이가 $50cm^2$보다 큰 $\theta$의 크기가 $9\times\dfrac46\pi=6\pi$임을 구했다.
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A1], max_points: 15}
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 15
      evidence: |
        삼각형의 넓이가 $50cm^2$보다 큰 시간이 $5\times\dfrac{6}{\frac{55}{6}}=\dfrac{36}{11}$(시간)임을 구했다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

