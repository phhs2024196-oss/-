intent: |
  시간과 공간에 대한 이해를 바탕으로, 생각하는 개념(시침·분침의 원운동)을 삼각함수로 표현하고 적절한 연산 과정을 문제 해결에 적용할 수 있는지 평가한다. (1)은 제한된 범위에서 삼각함수의 특징을, (2)는 범위를 넓혀 일반화하는 과정을 본다.
key_idea: |
  넓이 $\tfrac12\times10\times20\times\sin\theta=100\sin\theta$이므로 $\lvert\sin\theta\rvert\ge\tfrac12$인 각의 범위를 주기적으로 세고, 분침이 시침에 대해 도는 상대 각속도로 각을 시간으로 바꾼다.
stuck: |
