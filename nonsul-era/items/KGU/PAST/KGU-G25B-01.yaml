intent: |
  직교 좌표계로 현상을 직선의 방정식으로 표현하고, 등비·등차수열이 아닌 수열의 특징(부분분수 분해)을 이용해 일정한 길이의 수열의 합을 구하는 능력을 본다.
key_idea: |
  $A$지점을 $x=1$, $B$지점을 $x=0$에 두면 $n$번째 파편은 두 점 $(0,1)$, $(1,(n+1)^2)$을 지나는 직선을 따라 움직이므로 기울기 $\tan\theta_n=n(n+2)$, $x$절편 $-\dfrac{1}{n(n+2)}$이다.
stuck: |
  상황을 좌표평면에 옮겨 파편의 궤적을 두 높이 점을 지나는 직선으로 보는 단계, 그리고 $\dfrac{1}{n(n+2)}$을 부분분수로 나누어 소거되는 항을 정리하는 단계
