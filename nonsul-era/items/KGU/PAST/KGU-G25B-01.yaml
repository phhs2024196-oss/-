stimuli:
- label: 가
  body: |
    오른쪽 그림에서 동경 $OP$가 나타내는 각의 크기를 $\theta$라고 할 때
    $\sin\theta=\dfrac{y}{r}$, $\cos\theta=\dfrac{x}{r}$, $\tan\theta=\dfrac{y}{x}\ (x\ne0)$
    이다.

    [그림: 원점 $O$를 중심으로 하고 반지름이 $r$인 원과 좌표축. 원 위의 제1사분면 점 $P(x,y)$, 양의 $x$축에서 동경 $OP$까지의 각 $\theta$, $P$에서 두 축에 내린 수선과 $x$, $y$ 눈금, 축 위의 $r$, $-r$ 표시]
    『고등학교 수학 Ⅰ』
- label: 나
  body: |
    수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합 $a_1+a_2+a_3+\cdots+a_n$을 합의 기호 $\sum$를 사용하여 다음과 같이 나타낸다.
    $$a_1+a_2+a_3+\cdots+a_n=\sum_{k=1}^{n}a_k$$
    『고등학교 수학 Ⅰ』

stem: |
  [문항 1] (가)와 (나)에 근거하여 논제에 답하시오.

  [논제 1] 인공위성을 궤도에 올리는 데 사용된 우주발사체가 파괴되어 8개의 파편이 순차적으로 평평한 지면 위의 두 지점 $A$와 $B$의 상공을 통과하여 추락하였다. $A$지점의 상공을 $n$번째로 지나간 파편은 지면으로부터 $(n+1)^2km$의 높이로 통과하였으며, $B$지점의 상공에서는 모든 파편이 지면으로부터 $1km$의 높이로 통과하였다. 파편은 모두 직선을 따라 지면에 도달하였고, 두 지점 $A$와 $B$ 사이의 거리는 $1km$라고 하자.

subparts:
- id: '1'
  stem: |
    $A$지점의 상공을 $n$번째 지나간 파편이 지면에 도달할 때, 지면과 이루는 각을 $\theta_n$이라 하면, $\displaystyle\sum_{n=1}^{8}\tan\theta_n$은 얼마인지 설명하시오 (단, $0<\theta_n<\dfrac{\pi}{2}$이다). [15점]
  points: 15
  depends_on: []
  answer: {kind: value, value: '276', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $A$를 $x=1$, $B$를 $x=0$에 두면 파편은 $(0,1)$과 $(1,(n+1)^2)$을 지나는 직선 위를 움직이고, $\tan\theta_n$은 그 직선의 기울기 $n(n+2)$이다.
    steps:
    - {id: 1a, content: '$\tan\theta_n=\dfrac{(n+1)^2-1}{1-0}=n^2+2n$, $\displaystyle\sum_{n=1}^{8}(n^2+2n)=204+72=276$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 두 지점을 좌표축 위에 놓아 보자.
    - 파편이 지나는 두 점을 알면 직선의 기울기는?
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북 p.74 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $A$지점을 $x=1$, $B$지점을 $x=0$이라 하자. 그러면 $A$지점을 $n$번째로 지나간 파편은 두 점 $(0,1)$과 $(1,(n+1)^2)$을 지나는 직선의 궤적을 따른다. $\tan\theta_n$은 직선의 양의 기울기를 나타내므로
        $$\tan\theta_n=\dfrac{(n+1)^2-1}{1-0}=n(n+2)$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이고 따라서
        $$\sum_{n=1}^{8}\tan\theta_n=\sum_{n=1}^{8}(n^2+2n)=\dfrac{8\times9\times17}{6}+2\times\dfrac{8\times9}{2}=276$$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        $\tan\theta_n=n^2+2n$을 구했다(파편의 궤적 직선의 기울기로).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $\displaystyle\sum_{n=1}^{8}\tan\theta_n=\sum_{n=1}^{8}(n^2+2n)=276$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

- id: '2'
  stem: |
    $A$지점의 상공을 $n$번째로 지나간 파편이 지면에 도달한 지점에서 $B$지점까지의 거리를 $a_n km$라 하면, $\displaystyle\sum_{n=1}^{8}a_n$은 얼마인지 설명하시오. [25점]
  points: 25
  depends_on: ['1']
  answer: {kind: value, value: '29/45', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 직선 $y=n(n+2)x+1$의 $x$절편이 $-\dfrac{1}{n(n+2)}$이므로 $a_n=\dfrac{1}{n(n+2)}$이고, 부분분수로 소거한다.
    steps:
    - {id: 2a, content: '$\displaystyle\sum_{n=1}^{8}\dfrac{1}{n(n+2)}=\dfrac12\left(1+\dfrac12-\dfrac19-\dfrac1{10}\right)=\dfrac{29}{45}$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - 파편이 지면에 닿는 점은 직선의 무엇인가?
    - $\dfrac{1}{n(n+2)}$을 두 분수의 차로 나타내 보자.
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북 p.74 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        직선의 방정식은 $y=n(n+2)x+1$이고, 이 방정식의 $x$절편은 $x=-\dfrac{1}{n(n+2)}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 $a_n=\dfrac{1}{n(n+2)}$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $$\sum_{n=1}^{8}a_n=\dfrac{1}{1\cdot3}+\dfrac{1}{2\cdot4}+\dfrac{1}{3\cdot5}+\cdots+\dfrac{1}{8\cdot10}$$
        $$=\dfrac12\left\{\left(1-\dfrac13\right)+\left(\dfrac12-\dfrac14\right)+\left(\dfrac13-\dfrac15\right)+\cdots+\left(\dfrac18-\dfrac1{10}\right)\right\}$$
        $$=\dfrac12\left(1+\dfrac12-\dfrac19-\dfrac1{10}\right)=\dfrac{29}{45}$$
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        두 점 $(0,1)$과 $(1,(n+1)^2)$을 지나는 직선의 방정식 $y=n(n+2)x+1$을 세우고 $x$절편 $x=-\dfrac{1}{n(n+2)}$을 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 5}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $a_n=\dfrac{1}{n(n+2)}$을 적었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 15
      evidence: |
        $\displaystyle\sum_{n=1}^{8}a_n$을 $\dfrac12\left(\dfrac1n-\dfrac1{n+2}\right)$ 꼴로 나누어 소거하고 $\dfrac12\left(1+\dfrac12-\dfrac19-\dfrac1{10}\right)=\dfrac{29}{45}$를 얻었다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

