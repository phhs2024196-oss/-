intent: |
  현실 상황(드론의 비행경로)을 다항함수로 모형화하고, 극대·극소에서 도함수가 0이라는 특징과 접선의 방정식을 활용하여 문제를 해결하는 기본 지식과 활용 능력을 본다.
key_idea: |
  $A$를 $x=0$, $B$를 $x=4$로 두면 하강 시작·상승 시작 지점에서 $f'(0)=f'(4)=0$이므로 $f'(x)=ax(x-4)$이고, $f(0)=2$, $f(4)=1$로 $f$를 정한 뒤 $x=2$에서의 접선의 $x$절편을 구한다.
stuck: |
  「하강을 시작」「다시 상승」을 극대·극소, 즉 $f'(x)=0$인 지점으로 옮기는 단계와, 직선으로 움직인 경로를 접선으로 보는 단계
