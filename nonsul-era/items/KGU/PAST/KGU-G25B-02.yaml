stimuli:
- label: 가
  body: |
    함수 $y=f(x)$의 그래프 개형은 도함수를 활용하여 함수의 증가와 감소, 극대와 극소를 조사하고, $x$축, $y$축과의 교점을 구하면 그릴 수 있다.
    『고등학교 수학 Ⅱ』
- label: 나
  body: |
    함수 $y=f(x)$의 $x=a$에서의 미분계수 $f\,'(a)$가 존재할 때, $f\,'(a)$는 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 기울기와 같다.
    『고등학교 수학 Ⅱ』

stem: |
  [문항 1] (가)와 (나)에 근거하여 논제에 답하시오.

  [논제 2] 드론이 평지에 직선으로 뻗어있는 도로를 따라 시험 비행을 하였다. 시험 비행에서 드론의 비행경로는 3차 함수의 그래프 개형을 따르기로 하였으며, 도로의 $O$지점에서 이륙하여 도로의 $A$지점 상공을 지날 때 하강을 시작하고 도로의 $B$지점 상공을 지날 때부터 다시 상승하기로 계획하였다. 이때 $A$지점에서는 $2km$의 높이로, $B$지점에서는 $1km$의 높이로 비행하기로 계획하였고, $A$지점부터 $B$지점까지의 거리는 $4km$이다. 그런데 시험 비행 도중 드론이 $A$지점으로부터 도로를 따라 $2km$ 지난 지점의 상공을 지나는 순간 드론 조종에 문제가 발생하였다. 드론 조종에 문제가 발생한 시점부터 드론이 그 순간의 진행 방향으로 직선을 따라 움직여 도로 위에 충돌하였다. 드론이 지면에 충돌한 지점은 도로의 $A$지점에서 몇 $km$ 지난 지점인지 설명하시오(단, 비행 중 드론의 속력은 항상 0보다 크다). [60점]

subparts:
- id: '1'
  stem: |
    드론이 지면에 충돌한 지점은 도로의 $A$지점에서 몇 $km$ 지난 지점인지 설명하시오.
  points: 60
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f\,'(0)=f\,'(4)=0$, $f(0)=2$, $f(4)=1$로 삼차함수를 정하고 $x=2$에서의 접선의 $x$절편을 구한다.
    steps:
    - {id: 1a, content: '$f(x)=\dfrac{1}{32}x^3-\dfrac{3}{16}x^2+2$, 접선 $y-\dfrac32=-\dfrac38(x-2)$의 $x$절편 $6$', criteria: ['1.M1', '1.M2', '1.A1', '1.M3', '1.A2']}
    hint_ladder:
    - 하강을 시작하는 지점과 다시 상승하는 지점에서 도함수의 값은?
    - 문제 발생 순간의 진행 방향은 곡선의 무엇인가?
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북 p.78 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $A$지점으로부터의 거리를 $x$라 하자. 그러면 $A$지점에서 $x=0$이고, $B$지점에서 $x=4$이다. 드론의 비행경로가 3차 함수 $f(x)$를 따른다고 하면, $f\,'(x)$는 2차 함수이고 $x=0$과 $x=4$에서 $f\,'(x)=0$이므로
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $$f\,'(x)=ax(x-4)=ax^2-4ax\ \Rightarrow\ f(x)=\dfrac{a}{3}x^3-2ax^2+b$$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        또한 $f(0)=2$이고 $f(4)=1$이므로
        $$f(0)=b=2\text{이고 }f(4)=\dfrac{64}{3}a-32a+2=-\dfrac{32}{3}a+2=1\ \Rightarrow\ a=\dfrac{3}{32}$$
        따라서 $f(x)=\dfrac{1}{32}x^3-\dfrac{3}{16}x^2+2$이고 $f\,'(x)=\dfrac{3}{32}x(x-4)$
        $$\Rightarrow f(2)=\dfrac{1}{32}2^3-\dfrac{3}{16}2^2+2=\dfrac32\text{이고 }f\,'(2)=\dfrac{3}{32}2(2-4)=-\dfrac38$$
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        점 $(2,f(2))$에서 접선의 방정식은
        $$y-f(2)=f\,'(2)(x-2)\iff y-\dfrac32=-\dfrac38(x-2)$$
      criteria: ['1.M3']
    - id: 1b-5
      content: |
        이고 접선의 $x$절편은 $x=6$이다. 따라서 드론은 $A$에서 $6km$ 지난 지점에 추락하였다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        $A$지점과 $B$지점에서 $f\,'(x)=0$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 10
      evidence: |
        $f(x)=\dfrac{a}{3}x^3-2ax^2+b$의 꼴을 얻었다($x^2$의 계수가 $x^3$의 계수의 $-6$배이면 됨).
      depends_on: []
      implied_ok: false
      accept:
      - $x^2$의 계수가 $x^3$의 계수의 $-6$배인 삼차식
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $f(x)=\dfrac{1}{32}x^3-\dfrac{3}{16}x^2+2$이고 $f\,'(x)=\dfrac{3}{32}x(x-4)$를 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 15
      evidence: |
        점 $(2,f(2))$에서 접선의 방정식 $y-f(2)=f\,'(2)(x-2)\iff y-\dfrac32=-\dfrac38(x-2)$를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $x$절편이 $x=6$이고, 따라서 드론은 $A$에서 $6km$ 지난 지점에 추락하였다고 결론지었다.
      depends_on: [1.M3]
      steps: [1b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

