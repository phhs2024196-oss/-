stimuli:
- label: 가
  body: |
    다양한 상황에서 경우의 수를 구하는 체계적인 방법이 존재한다. 경우의 수를 세는 방법을 통해 사건이 일어날 수 있는 모든 경우를 분류하고 체계화하는 수학적 사고를 경험할 수 있으며, 이는 합리적인 의사 결정의 중요한 도구가 된다.
    【출처: 「고등학교 수학」】
- label: 나
  body: |
    수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합을 합의 기호 $\sum$를 사용하여
    $$a_1+a_2+a_3+\cdots+a_n=\sum_{k=1}^{n}a_k$$
    와 같이 나타낸다.
    【출처: 「고등학교 수학 Ⅰ」】

stem: |
  가와 나에 근거하여 논제에 답하시오.

  임의의 자연수 $m$이 소수 $p_1$, $p_2$, $\cdots$, $p_n$의 곱 $p_1\times p_2\times\cdots\times p_n$으로 나타낼 수 있을 때 $f(m)=n$이라고 하자. 예를 들면, $12=2\times2\times3$이므로 $f(12)=3$이다. 단, $f(1)=0$이다.

subparts:
- id: '1'
  stem: |
    210 으로 나누어지고 $f(m)=6$인 10000이하의 자연수 $m$의 개수를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '16', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $m=210pq$($p\le q$ 소수)이고 $pq\le47$이므로 곱이 47 이하인 소수 쌍을 모두 센다.
    steps:
    - {id: 1a, content: '$m=2\times3\times5\times7\times p\times q$, $pq\le47$ → 소수 쌍 16개', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 210을 소인수분해하면 소인수가 몇 개인가?
    - $f(m)=6$이면 210 말고 소수가 몇 개 더 곱해져 있는가?
  - id: S1-B
    audience: B
    source_flow: '2027 논술가이드북 p.82 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $210=2\times3\times5\times7$이므로 $m$이 $f(m)=6$이고 210으로 나누어지면 적당한 소수 $p$, $q$에 대하여 $m=2\times3\times5\times7\times p\times q$로 인수분해된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $m\le10000$이므로 다음과 같은 범위를 구할 수 있다.
        $$210pq\le10000\Rightarrow pq\le\dfrac{10000}{210}=47.\times\times\cdots$$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        그러므로 곱이 47보다 작거나 같은 소수의 쌍은 $(2,2)$, $(2,3)$, $(2,5)$, $(2,7)$, $(2,11)$, $(2,13)$, $(2,17)$, $(2,19)$, $(2,23)$, $(3,3)$, $(3,5)$, $(3,7)$, $(3,11)$, $(3,13)$, $(5,5)$, $(5,7)$이다.
        따라서 210으로 나누어지고 $f(m)=6$인 10000이하의 자연수 $m$의 개수는 총 16개다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        문제에서 제시한 조건에 맞도록 소인수분해 결과 $m=2\times3\times5\times7\times p\times q$($p$, $q$는 소수)를 제시했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 10
      evidence: |
        파악해야 할 두 개의 소수를 추가해 값의 범위 $210pq\le10000$, 즉 $pq\le47$을 설정했다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        범위 내의 소수를 이용해 가능한 모든 쌍($p\le q$) 16개를 빠짐없이 구하고 개수 16을 답했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

- id: '2'
  stem: |
    자연수 $a$와 $b$에 대하여 $f(a)=5$이고 $f(b)=3$일 때, $\displaystyle\sum_{n=1}^{10}f(nab^n)$의 값을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '230', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(nab^n)=f(n)+f(a)+nf(b)$로 나누어 $\sum f(n)=15$, $\sum f(a)=50$, $\sum nf(b)=165$를 더한다.
    steps:
    - {id: 2a, content: '$\sum_{n=1}^{10}f(nab^n)=15+50+165=230$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - 두 자연수의 곱의 소인수 개수는 각각의 소인수 개수와 어떤 관계인가?
    - $f(b^n)$은 $f(b)$로 어떻게 나타나는가?
  - id: S2-B
    audience: B
    source_flow: '2027 논술가이드북 p.82 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        임의의 자연수 $k$, $m$에 대하여 $km$의 소인수의 개수는 $k$의 소인수의 개수와 $m$의 소인수의 개수의 합과 같으므로
        $$\sum_{n=1}^{10}f(nab^n)=\sum_{n=1}^{10}\{f(n)+f(a)+nf(b)\}=\sum_{n=1}^{10}f(n)+\sum_{n=1}^{10}f(a)+\sum_{n=1}^{10}nf(b)$$
        이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $f(1)=0$이고 $f(2)=f(3)=f(5)=f(7)=1$, $f(4)=f(6)=f(9)=f(10)=2$, $f(8)=3$이므로 $\displaystyle\sum_{n=1}^{10}f(n)=15$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        또한 $f(a)=5$이고 $f(b)=3$이므로 $\displaystyle\sum_{n=1}^{10}f(a)=10\times5=50$이고 $\displaystyle\sum_{n=1}^{10}nf(b)=\dfrac{10\times11}{2}\times3=165$이다.
        그러므로 $\displaystyle\sum_{n=1}^{10}f(nab^n)=230$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        문제에서 정의한 함수를 이용해 소인수의 개수의 합에 대한 함수의 합 $\sum\{f(n)+f(a)+nf(b)\}$로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        앞에서 구한 관계식을 이용해 합 $\sum_{n=1}^{10}f(n)=15$를 계산했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 10
      evidence: |
        각 단계의 계산 결과($50$, $165$)를 모두 이용해 최종 결과 $230$을 계산했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

