  소수에 대한 기본 개념을 올바로 파악하고 있는가를 평가하고, 소수의 범위와 곱셈 등의 기본 연산과 활용 능력을 확인한다(가이드북 「출제 의도」 요지).
key_idea: |
  (1) $m=2\times3\times5\times7\times p\times q$로 두면 $pq\le\dfrac{10000}{210}$이므로 곱이 47 이하인 소수 쌍을 센다. (2) $f(kl)=f(k)+f(l)$이므로 $f(nab^n)=f(n)+f(a)+nf(b)$로 나누어 합한다.
stuck: |
  (1) 210의 소인수 네 개를 빼고 남은 두 소수의 곱의 범위로 바꾸는 발상, (2) $f$가 곱을 합으로 바꾸는 성질($f(b^n)=nf(b)$)
