intent: |
  다항식으로 이루어진 함수의 기본적인 특징을 미분과 연관하여 정확히 이해하고 있는지 파악한다. 특히 대칭점인 변곡점을 갖는 가장 간단한 함수인 삼차함수에서 특정 기울기의 접선과 그 접선들에 접하는 원을 다룬다(가이드북 「출제 의도」 요지).
key_idea: |
  $f(x)+f(-x)=2$에서 $b=0$, $d=1$, 접선 개수 조건에서 $f'(x)=3ax^2+c$의 최솟값이 $-1$이므로 $c=-1$. 기울기 $m$인 두 접선은 평행하므로 그 사이 거리의 절반이 원의 반지름이다.
stuck: |
  기울기가 $m$인 접선의 개수 조건을 「$f'(x)$의 최솟값이 $-1$」로 바꾸는 것, 그리고 두 평행한 접선에 동시에 접하는 원의 지름이 두 접선 사이의 거리라는 것
