stimuli:
- label: 가
  body: |
    점 $(x_1,y_1)$과 직선 $ax+by+c=0$사이의 거리 $d$는 다음과 같다.
    $$d=\dfrac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$$
    【출처: 「고등학교 수학」】
- label: 나
  body: |
    일반적으로 함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 기울기는 $x=a$에서의 미분계수 $f^{\prime}(a)$이다.
    【출처: 「고등학교 수학 Ⅱ」】

stem: |
  가와 나에 근거하여 논제에 답하시오.

  $f(x)$는 삼차함수이다. 곡선 $y=f(x)$의 기울기가 $m$인 접선이 $m>-1$일 때 두 개, $m=-1$일 때 한 개 존재하고, $m<-1$이면 존재하지 않는다고 하자. 또한 모든 실수 $x$에 대하여 $f(x)+f(-x)=2$이다. $m>-1$일 때 $m$을 기울기로 갖는 $f(x)$의 두 접선에 동시에 접하는 원의 넓이를 $g(m)$이라고 하며, $g(0)=4\pi$이다.

subparts:
- id: '1'
  stem: |
    함수 $f(x)$를 구하시오.
  points: 25
  depends_on: []
  answer: {kind: expression, value: 'x**3/27 - x + 1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 항등식으로 $b=0$, $d=1$, 접선 개수 조건으로 $c=-1$을 얻고, 기울기 0인 두 접선 사이 거리의 절반을 반지름으로 하여 $g(0)=4\pi$에서 $a$를 정한다.
    steps:
    - {id: 1a, content: '$f(x)=ax^3-x+1$, 반지름 $\tfrac{2}{3\sqrt{3a}}$, $\tfrac{4\pi}{27a}=4\pi\Rightarrow a=\tfrac1{27}$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $f(x)+f(-x)=2$에 $f(x)=ax^3+bx^2+cx+d$를 대입해 보자.
    - 기울기가 $m$인 접선의 개수는 방정식 $f^{\prime}(x)=m$의 실근의 개수이다.
    - 기울기가 같은 두 접선은 평행하다. 두 평행선에 동시에 접하는 원의 지름은?
  - id: S1-B
    audience: B
    source_flow: '2027 논술가이드북 p.85 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$가 삼차함수이므로 $f(x)=ax^3+bx^2+cx+d$라 둘 수 있다. 모든 실수 $x$에 대하여 $f(x)+f(-x)=2$이므로
        $$f(x)+f(-x)=2bx^2+2d=2\Rightarrow b=0,\ d=1$$
        가정으로부터 $f^{\prime}(x)=3ax^2+c$은 최솟값이 $-1$이므로 $c=-1$이다. 따라서 $f(x)=ax^3-x+1$이다.
        (보충) 기울기 $m$인 접선의 개수는 $3ax^2+c=m$의 실근의 개수이므로, $m>-1$일 때 2개, $m=-1$일 때 1개, $m<-1$일 때 0개이려면 $a>0$이고 $c=-1$이어야 한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이제 $(x,f(x))$에서의 접선의 기울기가 $m=0$이라 하면
        $$f^{\prime}(x)=3ax^2-1=0\Rightarrow x=\pm\dfrac{1}{\sqrt{3a}}\Rightarrow f\left(\pm\dfrac{1}{\sqrt{3a}}\right)=a\left(\pm\dfrac{1}{3a\sqrt{3a}}\right)-\left(\pm\dfrac{1}{\sqrt{3a}}\right)+1=\mp\dfrac{2}{3\sqrt{3a}}+1$$
        그러므로 기울기가 $m=0$인 두 접선의 방정식은 $y=\pm\dfrac{2}{3\sqrt{3a}}+1$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        두 접선에 동시에 접하는 원의 반지름이 $\dfrac{2}{3\sqrt{3a}}$이므로 원의 넓이는
        $$g(0)=4\pi=\dfrac{4}{27a}\pi\Rightarrow a=\dfrac{1}{27}$$
        이다. 따라서 $f(x)=\dfrac{1}{27}x^3-x+1$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        삼차함수의 일반식 $ax^3+bx^2+cx+d$에 문제에서 주어진 조건($f(x)+f(-x)=2$, 접선 개수 조건)을 적용해 $b=0$, $d=1$, $c=-1$, 즉 $f(x)=ax^3-x+1$을 제시했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        접선의 기울기가 0인 경우의 모든 접선의 방정식 $y=\pm\dfrac{2}{3\sqrt{3a}}+1$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: |
        두 접선에 접하는 원의 넓이 $\dfrac{4\pi}{27a}$를 계산하고 $g(0)=4\pi$를 반영해 $f(x)=\dfrac{1}{27}x^3-x+1$을 제시했다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

- id: '2'
  stem: |
    $\displaystyle\lim_{m\to\infty}[g(m)-h(m)]=0$을 만족하는 다항함수 $h(m)$를 구하시오.
  points: 30
  depends_on: ['1']
  answer: {kind: expression, value: '4*pi*(m + 3)', equivalents: ['4*pi*m + 12*pi'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 기울기 $m$인 두 접선 $y=mx\pm2(m+1)^{3/2}+1$ 사이 거리의 절반이 반지름이므로 $g(m)=\dfrac{4\pi(m+1)^3}{m^2+1}$이고, 나눗셈의 몫이 $h(m)$이다.
    steps:
    - {id: 2a, content: '$g(m)=\tfrac{4\pi(m+1)^3}{m^2+1}=4\pi(m+3)+\tfrac{8\pi(m-1)}{m^2+1}$, $h(m)=4\pi(m+3)$', criteria: ['2.M1', '2.A1', '2.A2', '2.A3']}
    hint_ladder:
    - 접점의 $x$좌표를 $\alpha$라 하고 $f^{\prime}(\alpha)=m$을 풀어 보자.
    - 두 평행한 접선 사이의 거리를 가에 근거해 구해 보자.
    - $(m+1)^3$을 $m^2+1$로 나눈 몫과 나머지를 생각해 보자.
  - id: S2-B
    audience: B
    source_flow: '2027 논술가이드북 p.85 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f^{\prime}(x)=\dfrac{1}{9}x^2-1$이므로 점 $(\alpha,f(\alpha))$에서 접선의 방정식은 $y=\left(\dfrac{1}{9}\alpha^2-1\right)x-\dfrac{2}{27}\alpha^3+1$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\dfrac{1}{9}\alpha^2-1=m$라 하면 $\dfrac{\alpha}{3}=\pm\sqrt{m+1}$이므로 기울기가 $m$인 두 접선의 방정식은 $y=mx\pm2(m+1)^{3/2}+1$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        가에 근거하여 접선 사이의 거리는 $\dfrac{4(m+1)^{3/2}}{\sqrt{m^2+1}}$이므로 두 접선에 동시에 접하는 원의 반지름은 $\dfrac{2(m+1)^{3/2}}{\sqrt{m^2+1}}$이고 원의 넓이는 $\dfrac{4\pi(m+1)^3}{m^2+1}$이다.
      criteria: ['2.A2']
    - id: 2b-4
      content: |
        결국,
        $$g(m)=\dfrac{4\pi(m+1)^3}{m^2+1}=4\pi(m+3)+\dfrac{8\pi(m-1)}{m^2+1}$$
        이므로, $h(m)=4\pi(m+3)$라 하면, 문제에서 요구하는 결과를 다음과 같이 구할 수 있다.
        $$g(m)-h(m)=\dfrac{8\pi(m-1)}{m^2+1}\Rightarrow\lim_{m\to\infty}[g(m)-h(m)]=0$$
        (보충) 다항함수 $h$에 대하여 $g-h\to0$이면 $h(m)-4\pi(m+3)$은 0으로 수렴하는 다항함수이므로 영다항식이고, $h$는 유일하다.
      criteria: ['2.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        이전 단계에서 구한 함수로부터 점 $(\alpha,f(\alpha))$에서의 접선의 방정식 $y=\left(\dfrac19\alpha^2-1\right)x-\dfrac{2}{27}\alpha^3+1$을 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 5}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        문제에서 제시한 조건(기울기 $m$)을 만족하는 접선의 방정식 $y=mx\pm2(m+1)^{3/2}+1$을 모두 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: |
        원의 반지름 $\dfrac{2(m+1)^{3/2}}{\sqrt{m^2+1}}$을 구하고 이를 이용해 원의 넓이 $g(m)=\dfrac{4\pi(m+1)^3}{m^2+1}$을 계산했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    - id: 2.A3
      mark_type: A
      points: 10
      evidence: |
        $g(m)=4\pi(m+3)+\dfrac{8\pi(m-1)}{m^2+1}$로 나누어 $h(m)=4\pi(m+3)$을 구하고 극한값이 0임을 계산했다.
      depends_on: [2.M1, 2.A2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

