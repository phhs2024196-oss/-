stimuli:
- label: 가
  body: |
    차례로 늘어놓은 수의 열을 수열이라 하고, 수열을 이루고 있는 각각의 수를 그 수열의 항이라 한다.
    【출처: 「고등학교 수학 Ⅰ」】
- label: 나
  body: |
    10을 밑으로 하는 로그를 상용로그라 하고, 상용로그 $\log_{10}N$은 보통 밑 10을 생략하여 $\log N$과 같이 나타낸다.
    【출처: 「고등학교 수학 Ⅰ」】

stem: |
  가와 나에 근거하여 논제에 답하시오.

  어떤 질병에 걸린 환자 $a\,(a>0)$명의 집단이 있다. A와 B의 치료법 중 하나를 날마다 선택하여 이 집단의 모든 환자에게 일괄 적용하려 한다. 치료법 A를 처음 적용할 때 남아 있는 환자의 $\dfrac{2}{3}$가 다음날 질병으로부터 회복되고, 치료법 A를 두 번째부터 적용하면 남아 있는 환자의 $\dfrac{1}{3}$이 다음날 질병으로부터 회복된다. 치료법 B를 적용하면 남아 있는 환자의 $\dfrac{1}{2}$이 다음날 질병으로부터 회복된다. 치료법의 적용 비용은 환자 수와 관계없이 회당 A는 10만 원이며, B는 15만 원이다. 단, $\log2=0.30$, $\log3=0.48$로 계산한다.

subparts:
- id: '1'
  stem: |
    치료법을 총 $n$번 적용했으며 이 중 A를 $k$번 적용했다. 치료법을 마지막으로 적용한 다음 날의 환자 수를 구하시오.
  points: 20
  depends_on: []
  # k=0 이면 a(1/2)^n, 1<=k<=n 이면 (a/3)(2/3)^(k-1)(1/2)^(n-k)
  answer: {kind: expression, value: 'Piecewise((a*(1/2)**n, Eq(k, 0)), (a/3*(2/3)**(k - 1)*(1/2)**(n - k), True))', equivalents: ['a*2**(2*k - 1 - n)*3**(-k) (1<=k<=n)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 남은 환자 비율은 A 첫 적용 $\tfrac13$, 이후 A $\tfrac23$, B $\tfrac12$이고 순서와 무관하게 곱해진다.
    steps:
    - {id: 1a, content: '$k=0$: $a\left(\tfrac12\right)^n$, $k\ge1$: $\tfrac a3\left(\tfrac23\right)^{k-1}\left(\tfrac12\right)^{n-k}$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 하루가 지나면 남은 환자 수는 전날의 몇 배인가? 치료법별로 정리해 보자.
    - 곱하는 순서가 바뀌어도 결과가 같은가?
    - A를 한 번도 쓰지 않은 경우를 따로 생각하자.
  - id: S1-B
    audience: B
    source_flow: '2027 논술가이드북 p.88 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        치료법을 $n$번 적용하는 동안 A를 $k\,(0\le k\le n)$번 적용하였다면 B는 $n-k$번 적용되었다. A를 처음 적용 후 남아 있는 환자 수는 전일 대비 $\dfrac{1}{3}$이고, 2일째 이후는 전일 대비 남아 있는 환자 수는 $\dfrac{2}{3}$이다. 같은 방법으로 B를 적용하면 남아 있는 환자 수는 전일 대비 $\dfrac{1}{2}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $n$번 적용 후 남아 있는 환자 수를 $a_n$이라 하자. $k=0$이면 B만 적용하였으므로 가에 의하여 $a_n=a\left(\dfrac{1}{2}\right)^n$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        결국 $1\le k\le n$이면 $a_n=\dfrac{a}{3}\cdot\left(\dfrac{2}{3}\right)^{k-1}\left(\dfrac{1}{2}\right)^{n-k}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        문제에서 제시한 상황을 반영하여 각각의 경우에 대한 남은 환자의 비율(A 첫 적용 $\tfrac13$, A 두 번째부터 $\tfrac23$, B $\tfrac12$)을 정의했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        특정 치료법을 선택해 각각의 경우($k=0$과 $1\le k\le n$)를 나누어 비율을 계산했다($k=0$이면 $a\left(\tfrac12\right)^n$).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        위의 결과들을 이용해 $1\le k\le n$일 때 $a_n=\dfrac a3\left(\dfrac23\right)^{k-1}\left(\dfrac12\right)^{n-k}$을 계산했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

- id: '2'
  stem: |
    치료법을 모두 적용 후 남은 환자 수가 처음 환자 수의 $\dfrac{1}{27}$ 이하가 되도록 하려고 할 때 드는 최소 비용을 구하시오.
  points: 30
  depends_on: ['1']
  # 단위: 만 원 (A 3번, B 2번)
  answer: {kind: value, value: '60', equivalents: ['600000 (원)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $k\ge1$이면 상용로그로 $n\ge0.4k+3.8$이고, $k$별로 최소 $n$과 비용 $10k+15(n-k)$을 비교하면 $k=3$, $n=5$에서 60만 원이 최소이다.
    steps:
    - {id: 2a, content: '$k=0$: 75, $k=1$: 70, $k=2$: 65, $k=3$: 60, $k=4$: 70, $k=5$: 65, $k=6$: 75, $k\ge7$: $\ge70$(만 원)', criteria: ['2.M1', '2.M2', '2.A1', '2.A2']}
    hint_ladder:
    - (1)의 $a_n$에 $a_n\le\dfrac{a}{27}$을 적용해 보자.
    - 양변에 상용로그를 취하면 $n$과 $k$의 관계가 일차부등식이 된다.
    - $k$를 0부터 차례로 늘려 가며 비용을 비교하자.
  - id: S2-B
    audience: B
    source_flow: '2027 논술가이드북 p.88 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        주어진 조건으로부터 $a_n\le a\times3^{-3}$일 때 최소 비용을 구하여야 한다.
        $k=0$인 경우, $\left(\dfrac12\right)^n\le\left(\dfrac13\right)^3$이어야 하고 따라서 나에 의하여 $-n\log2\le-3\log3$. 즉, $n\ge\dfrac{3\log3}{\log2}=\dfrac{3\times0.48}{0.3}=4.8$이어야 한다.
        $n$은 정수이어야 하고 $n=5$일 때, 최소 비용 $15\times5=75$(만원)이 발생한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $k\ge1$인 경우, $2^{2k-1-n}3^{-k}\le3^{-3}$즉, $2^{2k-1-n}\le3^{k-3}$이어야 한다.
        따라서 $2k-1-n\le(k-3)\dfrac{\log3}{\log2}$이고, 나에 의하여 $n-2k+1\ge1.6(-k+3)$. 즉, $n\ge0.4k+3.8$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $k=1$인 경우, $n\ge4.2$즉, $n\ge5$이어야 하고, 이때 최소 비용은 $15\times4+10=70$만원이다.
        $k=2$인 경우, $n\ge4.6$즉, $n\ge5$이어야 하고, 이때 최소 비용은 $15\times3+10\times2=65$만원이다.
        $k=3$인 경우, $n\ge5$이어야 하고, 이때 최소 비용은 $15\times2+10\times3=60$만원이다.
        $k=4$인 경우, $n\ge5.4$ 즉, $n\ge6$ 이어야 하고, 이때 최소 비용은 $15\times2+10\times4=70$만원이다.
        $k=5$인 경우, $n\ge5.8$ 즉, $n\ge6$이어야 하고, 이때 최소 비용은 $15\times1+10\times5=65$만원이다.
        $k=6$인 경우, $n\ge6.2$ 즉, $n\ge7$ 이어야 하고, 이때 최소 비용은 $15\times1+10\times6=75$만원이다.
        $k\ge7$인 경우, $n\ge k\ge7$이어야 하므로 최소 비용은 $10k\ge70$만원 이상이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        따라서 구하는 최소 비용은 A를 3번, B를 2번 적용할 때, $15\times2+10\times3=60$만원이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        문제에서 제시한 조건 $a_n\le\dfrac{a}{27}$을 이용해 최소 비용을 계산했다($k=0$이면 $n\ge4.8$, 즉 $n=5$에서 75만 원).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 10}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: |
        앞의 결과와 상용로그를 이용해 각각의 경우의 수에 따른 범위 $n\ge0.4k+3.8$($k\ge1$)을 계산했다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        특정 치료법을 선택해 각 발생 횟수($k=1,2,\cdots,6$, $k\ge7$)에 따라 최소 $n$과 비용을 계산했다.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: |
        앞의 결과들을 이용해 문제에서 요구한 해답(A 3번, B 2번일 때 최소 비용 60만 원)을 제시했다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

