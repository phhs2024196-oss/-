intent: |
  일련의 변화 발생 비율의 변화를 수열로 표현해 다루고, 로그함수의 특성을 이용해 조건을 단순하게 표현하는 능력, 즉 기본적인 수열과 로그함수에 대한 개념을 얼마나 이해하고 활용할 수 있는가를 평가한다(가이드북 「출제 의도」 요지).
key_idea: |
  각 치료법은 남은 환자 수에 일정 비율을 곱하므로 순서와 상관없이 적용 횟수만으로 $a_n$이 정해진다. $a_n\le\dfrac{a}{27}$을 상용로그로 $n\ge0.4k+3.8$($k\ge1$)로 바꾸고 $k$별 최소 비용을 비교한다.
stuck: |
  A의 첫 적용만 비율이 다르므로 $k=0$과 $k\ge1$을 나누는 것, 그리고 로그 부등식을 $k$에 대한 $n$의 하한으로 바꾼 뒤 경우별 비용을 비교하는 것
