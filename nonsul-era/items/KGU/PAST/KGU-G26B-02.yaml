stimuli:
- label: 가
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(x)\ge0$일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^bf(x)dx$$
    【출처: 「고등학교 수학 Ⅱ」】

stem: |
  가에 근거하여 논제에 답하시오.

  곡선 $y=x^2$과 직선 $y=k$ $\left(k>\dfrac23\right)$에 의해 둘러싸인 영역의 경계선 위에 점 $\mathrm{A_1}$부터 $\mathrm{A_9}$까지 9개의 점이 순서대로 반시계 방향으로 놓여있다. 점 $\mathrm{P}\left(0,\dfrac23\right)$와 $\mathrm{A_1}$부터 $\mathrm{A_9}$까지 9개의 점을 각각 잇는 선분들로 이 영역의 넓이를 9등분하고자 한다. $\mathrm{A_1}$은 원점이고 $\mathrm{A_2}$의 좌표는 $(1,1)$이다.

subparts:
- id: '1'
  stem: |
    $k$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '9/4', equivalents: ['2.25'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 도형 $\mathrm{PA_1A_2}$의 넓이 $\tfrac12$의 9배 $=\tfrac43k\sqrt k$.
    steps:
    - {id: 1a, content: '$\tfrac43k\sqrt k=\tfrac92\Rightarrow k=\tfrac94$', criteria: ['1.M1', '1.M2', '1.M3', '1.A1']}
    hint_ladder:
    - 도형 $\mathrm{PA_1A_2}$의 넓이를 사다리꼴과 정적분으로 구해 보자.
    - 전체 영역의 넓이는 그 몇 배인가?
  - id: S1-B
    audience: B
    source_flow: '2027 논술가이드북 p.91 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{PA_1A_2}$도형 의 넓이는 다음과 같이 구할 수 있다.
        $$\dfrac12\left(\dfrac23+1\right)-\int_0^1x^2dx=\dfrac56-\dfrac13=\dfrac12$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $y=x^2$과 $y=k$에 의해 둘러싸인 영역의 넓이는 도형 $\mathrm{PA_1A_2}$의 넓이의 9배이므로 $\dfrac12\times9=\dfrac92$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        한편 $y=x^2$와 $y=k$의 교점은 $(\pm\sqrt k,k)$이므로 두 곡선에 의해 둘러싸인 영역의 넓이는
        $$2k\sqrt k-\int_{-\sqrt k}^{\sqrt k}x^2dx=2k\sqrt k-\dfrac23k\sqrt k=\dfrac43k\sqrt k$$
        이다.
      criteria: ['1.M3']
    - id: 1b-4
      content: |
        그러므로 $\dfrac43k\sqrt k=\dfrac92\Rightarrow k^{3/2}=\dfrac{27}{8}\Rightarrow k=\dfrac94$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        문제에서 요구하는 도형 $\mathrm{PA_1A_2}$의 면적 $\dfrac12$을 계산했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        앞선 계산 결과에 문제 요구 사항(9등분)을 반영해 전체 넓이가 $\dfrac92$임을 적었다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 5
      evidence: |
        적분을 이용해 영역의 넓이 $\dfrac43k\sqrt k$를 계산했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        문제에서 요구하는 최종 결과 $k=\dfrac94$를 산출했다.
      depends_on: [1.M2, 1.M3]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

- id: '2'
  stem: |
    주어진 경계선 위의 9개의 점 중에서 직선 $y=k$위에 있는 점의 좌표를 모두 구하시오.
  points: 30
  depends_on: ['1']
  answer: {kind: set, value: '{(-18/19, 9/4), (-6/19, 9/4), (6/19, 9/4), (18/19, 9/4)}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 9가 홀수이므로 대칭성에 의해 $\mathrm{A_5}$, $\mathrm{A_6}$이 $y$축 대칭, 높이 $\tfrac{19}{12}$인 삼각형 넓이 $\tfrac12$에서 밑변 $\tfrac{12}{19}$씩 이동한다.
    steps:
    - {id: 2a, content: '$\left(\pm\tfrac{6}{19},\tfrac94\right)$, $\left(\pm\tfrac{18}{19},\tfrac94\right)$; $\pm\tfrac{30}{19}$은 $\lvert x\rvert>\tfrac32$이므로 제외', criteria: ['2.R1', '2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - 점이 9개이고 $\mathrm{A_1}$이 $y$축 위에 있다. 어떤 두 점이 $y$축에 대칭인가?
    - 직선 $y=k$ 위의 두 점과 $\mathrm{P}$가 만드는 삼각형의 높이는?
    - 구한 점이 실제로 경계선(선분) 위에 있는지 $x$좌표 범위로 확인하자.
  - id: S2-B
    audience: B
    source_flow: '2027 논술가이드북 p.91 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        직선 $y=k=\dfrac94$ 위에 주어진 점이 있다고 가정하면 전체 점의 개수가 홀수이므로 대칭성에 의하여 $\mathrm{A_5}$와 $\mathrm{A_6}$가 $y$축에 가장 가까운 점이고 각각의 좌표를 $\left(a,\dfrac94\right)$, $\left(-a,\dfrac94\right)$라 둘 수 있다.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        삼각형 $\mathrm{PA_5A_6}$의 넓이는 $\dfrac12$이고 점 $\mathrm{P}$에서 직선 $y=\dfrac94$까지의 거리는 $\dfrac94-\dfrac23=\dfrac{19}{12}$이므로 삼각형의 높이는 $\dfrac{19}{12}$이다. 그러므로 밑변 $\overline{\mathrm{A_5A_6}}$의 길이는 다음과 같이 구할 수 있다.
        $$2a=\dfrac{12}{19}\Rightarrow a=\dfrac{6}{19}$$
        그러므로 $\mathrm{A_5}$의 좌표는 $\left(\dfrac{6}{19},\dfrac94\right)$, $\mathrm{A_6}$의 좌표는 $\left(-\dfrac{6}{19},\dfrac94\right)$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        곡선 $y=x^2$과 $y=\dfrac94$의 교점은 $\left(\pm\dfrac32,\dfrac94\right)$이고 위 두 점의 $x$좌표는 $-\dfrac32\le x\le\dfrac32$이므로 경계면 위에 있는 점이다. $\mathrm{A_4}$와 $\mathrm{A_7}$이 직선 $y=\dfrac94$위의 점이라고 하면 삼각형 $\mathrm{PA_4A_5}$와 $\mathrm{PA_6A_7}$의 밑변의 길이도 $\dfrac{12}{19}$이므로 $\mathrm{A_4}$의 좌표는 $\left(\dfrac{18}{19},\dfrac94\right)$, $\mathrm{A_7}$의 좌표는 $\left(-\dfrac{18}{19},\dfrac94\right)$이어야 하고 두 점의 $x$좌표는 $-\dfrac32\le x\le\dfrac32$를 만족한다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        $\mathrm{A_3}$와 $\mathrm{A_8}$이 직선 $y=\dfrac94$위의 점이라고 하면 삼각형 $\mathrm{PA_3A_4}$와 $\mathrm{PA_7A_8}$의 밑변의 길이도 $\dfrac{12}{19}$이므로 $\mathrm{A_3}$의 좌표는 $\left(\dfrac{30}{19},\dfrac94\right)$, $\mathrm{A_8}$의 좌표는 $\left(-\dfrac{30}{19},\dfrac94\right)$이어야 하고 두 점의 $x$좌표는 $-\dfrac32\le x\le\dfrac32$를 만족하지 못하므로 $\mathrm{A_3}$와 $\mathrm{A_8}$이 직선 $y=\dfrac94$위의 점이 아니다.
        그러므로 직선 $y=\dfrac94$위의 모든 점의 좌표는 $\left(\pm\dfrac{6}{19},\dfrac94\right)$, $\left(\pm\dfrac{18}{19},\dfrac94\right)$이다.
        (보충) 경계선 위 넓이를 누적하면 $\mathrm{A_3}$은 곡선 $y=x^2$ 위의 점으로 $x$좌표는 $x^3+2x-6=0$의 실근(약 $1.456$)이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: |
        점의 개수가 홀수이므로 대칭성에 의해 $\mathrm{A_5}$, $\mathrm{A_6}$이 $y$축에 대칭임을 언급했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        삼각형 $\mathrm{PA_5A_6}$의 넓이 $\dfrac12$와 높이 $\dfrac{19}{12}$로 $\mathrm{A_5}\left(\dfrac{6}{19},\dfrac94\right)$, $\mathrm{A_6}\left(-\dfrac{6}{19},\dfrac94\right)$를 산출했다.
      depends_on: [2.R1]
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 10}
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        앞에서 구한 좌표를 이용해 다른 점 $\mathrm{A_4}\left(\dfrac{18}{19},\dfrac94\right)$, $\mathrm{A_7}\left(-\dfrac{18}{19},\dfrac94\right)$의 좌표를 식별했다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 10
      evidence: |
        특정 점의 좌표($\pm\dfrac{18}{19}$는 $\lvert x\rvert\le\dfrac32$, $\pm\dfrac{30}{19}$은 아님)를 이용해 문제에서 지정한 평행선 $y=\dfrac94$ 위에 존재하고 있음(또는 아님)을 보이고 네 점을 모두 제시했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

