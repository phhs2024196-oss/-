  적분의 역할과 방법을 이해하고, 넓이를 구하는 활용 과정과 절차를 정확하게 적용할 수 있는가를 평가한다(가이드북 「출제 의도」 요지).
key_idea: |
  도형 $\mathrm{PA_1A_2}$의 넓이 $\dfrac12$의 9배가 전체 영역의 넓이 $\dfrac43k\sqrt k$이므로 $k=\dfrac94$. 대칭성으로 $\mathrm{A_5}$, $\mathrm{A_6}$이 $y$축에 대칭이고, 높이 $\dfrac{19}{12}$인 삼각형의 넓이 $\dfrac12$로 직선 $y=k$ 위의 밑변 길이 $\dfrac{12}{19}$를 얻는다.
stuck: |
  각 부분의 넓이가 모두 $\dfrac12$임을 이용해, 직선 $y=k$ 위에서는 밑변 $\dfrac{12}{19}$인 삼각형으로 점을 차례로 찾고 $x$좌표가 $\lvert x\rvert\le\dfrac32$인지 확인하는 것
