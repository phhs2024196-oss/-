stimuli:
- label: 가
  body: |
    최근 지구 온난화의 영향으로 북극의 해수면에서 빙하의 단면이 차지하는 부분의 넓이가 빠르게 줄어들고 있다. 북극해의 빙하가 줄어들면 해수면에서 빙하의 단면이 차지하던 넓이를 바다가 차지하게 되고, 바다가 차지하는 넓이가 커질수록 지구가 흡수하는 태양빛의 양이 늘어나기 때문에 지구 온난화는 가속될 수밖에 없다. 이때 빙하의 단면이 차지하는 부분의 넓이는 해안선을 함수의 그래프로 보고 정적분을 활용하여 구할 수 있다.
    『고등학교 수학 Ⅰ』
- label: 나
  body: |
    페르마는 미분계수를 이용하여 함수의 극값을 찾는 방법을 발견하였다.
    『고등학교 수학 Ⅱ』

stem: |
  [문항 1] 다음 제시문을 읽고 논제에 답하시오.

  논제 1. 해안가에 오른쪽 그림과 같은 포물선 모양의 해안선을 가지는 곶이 있다. 해안선 주변의 바다를 간척하고 곶과 간척지 위에 밑면의 가로가 $200m$인 직육면체모양의 해양시설을 건설하여 이익을 얻고자 한다. 이로부터 얻는 이익이 최대가 되도록 하려면 해양시설의 세로는 얼마가 되어야 하는지 가와 나에 근거하여 설명하여라. 단,
  (1) 간척은 바다를 메워 육지를 만드는 것을 의미한다.
  (2) 그림에서 격자 한 칸의 가로와 세로의 길이는 각각 $50m$이다.
  (3) 해양시설은 곶과 간척지 위에만 건설할 수 있으며 포물선의 대칭축을 축으로 대칭이 되도록 건설한다.
  (4) 해양시설로부터 벌어들일 것으로 예상되는 금액(예상수익)과 간척에 필요한 비용은 각각 A원/㎡과 B원/㎡(B>A>0)이고, 이외의 비용은 생각하지 않는다.

  [그림: 가로 4칸·세로 2칸의 격자(한 칸 50 m) 위에 아래로 볼록한 포물선이 있다. 포물선의 꼭짓점은 격자 맨 아래 가로선의 가운데 점이고, 꼭짓점에서 좌우로 2칸(100 m), 위로 2칸(100 m) 떨어진 격자 맨 위 가로선의 양 끝 점을 지나며(중간 세로선에서는 높이 반 칸), 그 두 점에서 바깥쪽으로 해안선이 수평으로 이어진다. 포물선 안쪽(위쪽)에 「육지」, 포물선 바깥 오른쪽 아래에 「바다」라고 적혀 있다.]

subparts:
- id: '1'
  stem: |
    이익이 최대가 되도록 하는 해양시설의 세로의 길이를 구하고, 그 근거를 설명하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: '100*A*(2*B - A)/B**2', equivalents: ['100*(1 - (1 - A/B)**2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 해안선 $y=\tfrac{x^2}{100}$, 시설 윗변을 $y=100$에 두고 세로 $h$일 때 간척 면적을 정적분으로 나타내 $P^\prime(h)=0$을 푼다.
    steps:
    - {id: 1a, content: '$P^\prime(h)=200A-B\left(200-20\sqrt{100-h}\right)=0\Rightarrow h=100\left\{1-\left(\tfrac{B-A}{B}\right)^2\right\}$', criteria: [1.M1, 1.M2, 1.M3, 1.A1]}
    hint_ladder:
    - 포물선의 꼭짓점을 원점으로 잡고 식을 세워 보자.
    - 시설을 어디에 두어야 간척할 바다가 가장 적은가?
    - 세로 $h$에 대한 이익 함수를 미분해 보자.
  - id: S1-B
    audience: B
    source_flow: '자체 작성(공식 해설은 영상으로만 공개)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        포물선의 꼭짓점을 원점, 대칭축을 $y$축으로 잡고 단위를 m로 하면, 해안선은 $(\pm100,100)$을 지나므로 $y=\dfrac{x^2}{100}\ (-100\le x\le100)$이고 곶은 $\dfrac{x^2}{100}\le y\le100$인 부분이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        시설은 대칭축에 대칭이고 가로가 $200$이므로 $-100\le x\le100$을 차지한다. 곶과 간척지 위에만 지으므로 윗변은 $y=100$ 이하이고, 세로가 $h$로 같으면 윗변이 $y=100$일 때 간척할 바다가 가장 적다. 따라서 시설을 $100-h\le y\le100$에 둔다.
        $0<h\le100$일 때 시설 안의 곶 넓이는 $\displaystyle\int_{100-h}^{100}20\sqrt y\,dy$이므로 간척 면적은 $S(h)=200h-\displaystyle\int_{100-h}^{100}20\sqrt y\,dy$이고, 이익은
        $$P(h)=200Ah-B\,S(h)$$
        이다. $h>100$이면 늘어난 부분은 모두 간척해야 하므로 $P^\prime(h)=200(A-B)<0$이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        제시문 나에 따라 미분하면 $0<h<100$에서
        $$P^\prime(h)=200A-B\left(200-20\sqrt{100-h}\right)$$
        이고 $P^\prime(h)=0$에서 $\sqrt{100-h}=\dfrac{10(B-A)}{B}$, 즉 $h=100\left\{1-\left(\dfrac{B-A}{B}\right)^2\right\}$이다. $P^\prime(h)$는 $h$에 대해 감소하므로 이 값의 좌우에서 $P^\prime$의 부호가 양에서 음으로 바뀐다.
      criteria: [1.M3]
    - id: 1b-4
      content: |
        따라서 이익이 최대가 되는 세로는
        $$h=\frac{100A(2B-A)}{B^2}\ (m)$$
        이다. $0<A<B$이므로 $0<h<100$으로 조건에 맞는다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        격자에서 해안선을 $y=\dfrac{x^2}{100}$(꼭짓점 원점, 단위 m) 또는 동치식으로 나타냈다. (자체 구성)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        시설의 윗변을 $y=100$에 두는 근거를 밝히고, 세로 $h$에 대한 간척 면적 $200h-\displaystyle\int_{100-h}^{100}20\sqrt y\,dy$와 이익 $P(h)=200Ah-B\cdot(\text{간척 면적})$을 세웠다. (자체 구성)
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 15
      evidence: |
        $P^\prime(h)=200A-B(200-20\sqrt{100-h})$를 구하고 $P^\prime(h)=0$의 해와 그 좌우의 부호 변화(최대 판정)를 적었다. (자체 구성)
      depends_on: [1.M2]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        세로 $h=\dfrac{100A(2B-A)}{B^2}\,m$ (또는 $100\{1-(\tfrac{B-A}{B})^2\}$)를 답으로 적었다. (자체 구성)
      depends_on: [1.M3]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

