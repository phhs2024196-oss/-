intent: |
  (자체 요약, 공식 출제의도 미수록) 해안선을 함수의 그래프로 보고 간척 면적을 정적분으로 나타낸 뒤, 미분계수를 이용해 이익이 최대가 되는 시설의 세로 길이를 찾는 능력을 본다.
