  꼭짓점을 원점으로 해안선을 $y=\tfrac{x^2}{100}$로 두고, 시설을 $-100\le x\le100$, $100-h\le y\le100$에 놓으면 이익 $P(h)=200Ah-B\cdot(\text{간척 면적})$의 도함수가 $0$이 되는 $h$를 찾는다.
stuck: |
