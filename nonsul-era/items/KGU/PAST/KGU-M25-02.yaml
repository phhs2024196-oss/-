- label: 가
  body: |
    움직이는 물체의 시간에 따른 위치가 미분가능한 함수로 표현될 때, 도함수를 이용하여 물체의 속도를 알 수 있고 여러 가지 자연의 변화를 이해할 수 있다. 또 도함수는 최대 이익이나 최소 비용 등 사회 현상의 문제를 해결하는 데도 유용하다.
