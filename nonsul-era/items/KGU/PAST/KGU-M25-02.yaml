stem: |
  [문항 2] 다음 제시문을 읽고 논제에 답하시오.

  논제 2. 박경기 학생은 한 변의 길이가 $a$㎝인 정사각형 모양의 철판 1장을 가지고 있다. 이 철판의 네 귀퉁이에서 모두 같은 크기의 정사각형 모양을 잘라낸 후 접어서 뚜껑이 없는 직육면체 모양의 물품 보관함을 1개 만들어 이익을 내려고 한다. 보관함의 수입은 1원/㎤이며, 철판 1㎝를 자를 때 드는 비용은 $\dfrac{5}{96}a^2$ 원이다. 보관함의 이익이 최대가 되는 경우와 이때의 이익을 가와 나에 근거하여 설명하여라. 단, 철판을 자르는 비용 외 다른 모든 비용과 철판의 두께는 무시한다.

subparts:
- id: '1'
  stem: |
    이익이 최대가 되는 경우(잘라낼 정사각형의 한 변의 길이)와 그때의 이익을 구하고 근거를 설명하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'Tuple(a/12, 5*a**3/216)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $P(x)=x(a-2x)^2-\tfrac{5}{12}a^2x$의 도함수 $12x^2-8ax+\tfrac{7}{12}a^2=0$에서 $x=\tfrac a{12}$.
    steps:
    - {id: 1a, content: '$x=\tfrac a{12}$일 때 최대 이익 $P=\tfrac{5a^3}{216}$원', criteria: [1.M1, 1.M2, 1.A1, 1.A2]}
    hint_ladder:
    - 잘라낸 정사각형의 한 변을 $x$로 두고, 자르는 선의 총 길이를 세어 보자.
    - 이익 함수를 미분해 극값을 찾자. 정의역을 잊지 말자.
  - id: S1-B
    audience: B
    source_flow: '자체 작성(공식 해설은 영상으로만 공개)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        잘라낼 정사각형의 한 변을 $x$㎝ $\left(0<x<\dfrac a2\right)$라 하면 보관함은 밑면이 한 변 $a-2x$인 정사각형, 높이 $x$이므로 부피는 $x(a-2x)^2$㎤이다. 귀퉁이마다 길이 $x$인 두 번의 자르기가 필요하므로 자르는 길이는 $8x$㎝, 비용은 $8x\cdot\dfrac{5}{96}a^2=\dfrac{5}{12}a^2x$원이다. 따라서 이익은
        $$P(x)=x(a-2x)^2-\frac{5}{12}a^2x$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        제시문 가·나에 따라 미분하면
        $$P^\prime(x)=(a-2x)(a-6x)-\frac{5}{12}a^2=12x^2-8ax+\frac{7}{12}a^2=\frac{1}{12}(12x-a)(12x-7a)$$
        이므로 $P^\prime(x)=0$에서 $x=\dfrac a{12}$ 또는 $x=\dfrac{7a}{12}$이고, $0<x<\dfrac a2$에서는 $x=\dfrac a{12}$뿐이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $0<x<\dfrac a{12}$에서 $P^\prime(x)>0$, $\dfrac a{12}<x<\dfrac a2$에서 $P^\prime(x)<0$이므로 $P(x)$는 $x=\dfrac a{12}$에서 극대이면서 최대이다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        최대 이익은
        $$P\!\left(\frac a{12}\right)=\frac a{12}\left(\frac{5a}{6}\right)^2-\frac{5}{12}a^2\cdot\frac a{12}=\frac{25a^3}{432}-\frac{15a^3}{432}=\frac{5a^3}{216}\ (\text{원})$$
        이다. 즉 네 귀퉁이에서 한 변이 $\dfrac a{12}$㎝인 정사각형을 잘라낼 때 이익이 최대이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        부피 $x(a-2x)^2$와 자르는 비용 $8x\cdot\dfrac{5}{96}a^2$로 이익 $P(x)=x(a-2x)^2-\dfrac{5}{12}a^2x$ $\left(0<x<\dfrac a2\right)$를 세웠다. (자체 구성)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        $P^\prime(x)=12x^2-8ax+\dfrac{7}{12}a^2$를 구하고 정의역 안의 해 $x=\dfrac a{12}$를 골랐다($x=\dfrac{7a}{12}$ 제외). (자체 구성)
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $x=\dfrac a{12}$ 좌우의 $P^\prime$ 부호(증감표)로 최대임을 밝혔다. (자체 구성)
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 10
      evidence: |
        최대 이익 $\dfrac{5a^3}{216}$원을 구했다. (자체 구성)
      depends_on: [1.M2]
      steps: [1b-4]
    deductions: []
