stimuli:
- label: 가
  body: |
    실수 $a$와 자연수 $n$에 대하여 $a$를 $n$번 곱한 것을 $a$의 $n$제곱이라 하고, $a^n$으로 나타낸다. 또 $a$, $a^2$, $a^3$, $a^4$, $\cdots$을 통틀어 $a$의 거듭제곱이라 하고, $a^n$에서 $a$를 거듭제곱의 밑, $n$을 거듭제곱의 지수라고 한다.
    『고등학교 수학 Ⅰ』
- label: 나
  body: |
    일반적으로 $a>0$, $a\ne1$, $N>0$일 때, $a^x=N$을 만족시키는 실수 $x$는 오직 하나만 존재한다. 이 실수 $x$를
    $$x=\log_aN$$
    과 같이 나타내고, $a$를 밑으로 하는 $N$의 로그라고 한다.
    『고등학교 수학 Ⅰ』

stem: |
  [문항 3] 다음 제시문을 읽고 논제에 답하시오.

  논제 3. A시에서는 매년 인구에 관한 통계를 발표한다. 이 발표자료에 의하면 2020년 한 해 동안 A시의 전입 인구는 $a$명이고 전출 인구는 $b$명이다 (단, $b>a>0$). 2020년 이후부터 연도별 A시의 전입 인구수는 전년 전입 인구수 대비 21%씩 증가하였고, 전출 인구수는 전년 전출 인구수 대비 10%씩 증가하였을 때, 발표자료를 바탕으로 A시의 인구수가 2020년 이후 가장 적은 해는 언제인지 가와 나에 근거하여 설명하여라. 단, A시의 인구는 전입과 전출을 통해서만 변화한다고 가정한다.

subparts:
- id: '1'
  stem: |
    A시의 인구수가 2020년 이후 가장 적은 해를 $a$, $b$로 나타내고 근거를 설명하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: '2020 + ceiling(log(b/a, 11/10)) - 1', equivalents: ['2020 + floor(log(b/a, 11/10))'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $(2020+n)$년의 순증가량 $a(1.1)^{2n}-b(1.1)^n=(1.1)^n\{a(1.1)^n-b\}$는 $n<\log_{1.1}\tfrac ba$에서 음수, 그 뒤 양수이므로 마지막으로 음수인 해에 인구가 최소.
    steps:
    - {id: 1a, content: '$L=\log_{1.1}\tfrac ba$, 최소인 해 $=2020+\lceil L\rceil-1$ ($L$이 자연수이면 그 해와 다음 해가 같음)', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $n$년 뒤의 전입·전출 인구를 지수로 써 보자. $1.21$은 무엇의 제곱인가?
    - 인구가 줄어드는 해와 늘어나는 해의 경계를 로그로 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: '자체 작성(공식 해설은 영상으로만 공개)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        제시문 가에 따라 $(2020+n)$년 $(n=0,1,2,\cdots)$의 전입 인구는 $a(1.21)^n=a(1.1)^{2n}$, 전출 인구는 $b(1.1)^n$이다. 그 해의 인구 변화량은
        $$d_n=a(1.1)^{2n}-b(1.1)^n=(1.1)^n\{a(1.1)^n-b\}$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $(1.1)^n>0$이므로 $d_n<0\iff(1.1)^n<\dfrac ba$이다. 제시문 나에 따라 $L=\log_{1.1}\dfrac ba$라 하면 $(1.1)^L=\dfrac ba$이고, $b>a$이므로 $L>0$이다. $y=(1.1)^x$는 증가함수이므로 $n<L$이면 $d_n<0$(인구 감소), $n>L$이면 $d_n>0$(인구 증가), $n=L$이면 $d_n=0$이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 인구(연말 기준)는 $n<L$인 동안 줄다가 그 뒤로 늘어나므로, $n<L$을 만족하는 가장 큰 정수 $n=\lceil L\rceil-1$인 해, 즉
        $$2020+\left\lceil\log_{1.1}\frac ba\right\rceil-1\ \text{년}$$
        에 가장 적다. $\log_{1.1}\dfrac ba$가 자연수가 아니면 이는 $2020+\left[\log_{1.1}\dfrac ba\right]$년이고($[\ ]$는 가우스 기호), 자연수이면 그 해($d_n=0$)와 바로 전 해의 인구가 같아 두 해 모두 가장 적다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        $(2020+n)$년의 전입 $a(1.21)^n$, 전출 $b(1.1)^n$을 쓰고 인구 변화량 $a(1.21)^n-b(1.1)^n$을 세웠다. (자체 구성)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 20
      evidence: |
        $1.21=1.1^2$을 써서 감소 조건을 $(1.1)^n<\dfrac ba$로 바꾸고, 경계를 $\log_{1.1}\dfrac ba$로 나타내며 그 전에는 감소·그 뒤에는 증가함을 밝혔다. (자체 구성)
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        인구가 가장 적은 해를 $2020+\left\lceil\log_{1.1}\dfrac ba\right\rceil-1$년(자연수가 아니면 $2020+\left[\log_{1.1}\dfrac ba\right]$년)으로 적었다. (자체 구성)
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

