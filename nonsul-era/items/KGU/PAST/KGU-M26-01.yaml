  (자체 요약 — 가이드북에 출제 의도 지면 없음) 포물선에 내접하는 사다리꼴의 넓이를 한 변수의 함수로 나타내고 도함수로 최댓값을 찾은 뒤, 원의 지름에 대한 원주각의 성질로 선분 길이의 곱을 구하는 능력을 본다.
key_idea: |
  포물선은 $y=a^2-x^2$이고, 대칭성으로 $C(t,a^2-t^2)$, $D(-t,a^2-t^2)$ $(0<t<a)$라 두면 넓이 $S(t)=(a+t)(a^2-t^2)$이며 $S'(t)=(a+t)(a-3t)=0$에서 $t=\dfrac a3$이다.
stuck: |
