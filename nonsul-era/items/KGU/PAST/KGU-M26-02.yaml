intent: |
  (자체 요약 — 가이드북에 출제 의도 지면 없음) 함수방정식 $v(t+1)=-\tfrac12v(t)$와 미분가능성 조건(미분계수의 정의)으로 삼차함수를 결정하고, 구간마다 공비 $-\tfrac12$로 줄어드는 속도에서 움직인 거리를 등비수열의 합으로 구하는 능력을 본다.
key_idea: |
  $v(t)=t^3+pt^2+qt$로 두고, $t=1$에서의 연속($v(1)=-\tfrac12v(0)=0$)과 미분가능(좌미분계수 $3+2p+q$ = 우미분계수 $-\tfrac12q$)에서 $p=-3$, $q=2$를 얻는다. 구간 $[n,n+1]$에서의 거리는 $\left(\tfrac12\right)^n\cdot\tfrac14$이다.
stuck: |
  d)의 「모든 양의 실수에서 미분가능」을 $t=1$에서 좌·우 미분계수가 같다는 식으로 옮기는 단계, 그리고 $t=1$에서의 연속성으로 $v(1)=0$을 끌어내는 단계
