stuck: 현 $ET$, $FT$의 수직이등분선이 중심을 지난다는 사실로 중심 사이의 세로 거리를 $\dfrac{\overline{EF}}{2}$로 바꾸는 단계, (2)에서 원이 사각형 안에 있을 조건 $r_i\le50$으로 범위를 정하는 단계
