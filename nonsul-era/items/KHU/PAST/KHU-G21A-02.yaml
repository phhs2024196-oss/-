intent: 반원에 접하는 직선이 정사각형과 만나는 선분의 길이를 접선이 지나는 변에 따라 나누어 θ의 함수로 표현하고, 구간을 나누어 삼각함수를 적분한 뒤 특수한 각의 삼각비로 사인값을 계산하는 능력을 본다.
key_idea: '좌표를 놓으면 접선은 $y=(\tan\theta)x+\sec\theta$이고, 점 B를 지나는 각 $\alpha$($\sin\alpha=\dfrac35$)를 경계로 $f(\theta)=2\sec\theta$ 또는 $2\csc\theta+\sec\theta-\csc\theta\sec\theta$이다. 적분하면 $J=\alpha-\dfrac{\pi}{4}$가 된다.'
stuck: (2)에서 접선이 변 BC와 만나는지 변 AB와 만나는지를 (1)의 $\alpha$로 나누는 단계, (3)에서 $0\le\alpha\le\dfrac{\pi}{4}$를 확인하고 적분구간을 $[0,\alpha]$, $[\alpha,\dfrac{\pi}{4}]$로 나누는 단계
idea_tags: [IDEA-TANGENT-LINE-SEC-FORM, IDEA-PIECEWISE-BY-CONTACT-SIDE, IDEA-INTEGRAL-SPLIT-AT-BREAKPOINT]
