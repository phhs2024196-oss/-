stimuli:
- label: 가
  body: |
    $n$번의 독립시행에서 사건 $A$가 일어나는 횟수를 $X$라고 하면 $X$는 $0,1,\cdots,n$의 값을 갖는 확률변수이다. 한 번의 시행에서 사건 $A$가 일어날 확률을 $p$라고 하면 $X$의 확률질량함수는 독립시행의 확률에 의하여
    $$\mathrm{P}(X=k)={}_n\mathrm{C}_k\,p^kq^{n-k}\quad(q=1-p,\ k=0,1,\cdots,n)$$
    이다.
- label: 나
  body: |
    미분가능한 두 함수 $y=f(u)$와 $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는
    $$\dfrac{dy}{dx}=\dfrac{dy}{du}\times\dfrac{du}{dx}\ \text{또는}\ \{f(g(x))\}'=f'(g(x))g'(x)$$
    이다.
- label: 다
  body: |
    미분가능한 함수 $f(x)$의 도함수는
    $$f'(x)=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}$$
- label: 라
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능하고 $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^b f(x)g'(x)dx=\left[f(x)g(x)\right]_a^b-\int_a^b f'(x)g(x)dx$$
- label: 마
  body: |
    함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\dfrac{d}{dx}\int_a^x f(t)dt=f(x)\quad(\text{단, }a<x<b)$$

stem: |
  [논제 I] 제시문 [가]~[마]를 읽고 다음 질문에 답하시오.
  [논제 I-1]
  자연수 $n$과 확률 $p$에 대하여 이산확률변수 $X$가 가질 수 있는 값은 0부터 $n$까지 음이 아닌 정수이며, $X$의 확률질량함수는
  $$\mathrm{P}(X=k)={}_n\mathrm{C}_k\,p^kq^{n-k}\quad(q=1-p,\ k=0,1,\cdots,n)$$
  이다. $X$의 평균과 표준편차를 각각 $m$과 $\sigma$라 할 때, 다음 조건들이 성립한다.
  (ㄱ) $n\ge60$, $0.1\le p\le0.5$ (ㄴ) $m\sigma=80$ (ㄷ) $\mathrm{P}\left(\lvert X-m\rvert\ge\dfrac25m\right)=0.0456$.
  이때, $n$과 $p$를 구하고, 그 근거를 논술하시오. (단, $Z$가 표준정규분포를 따르는 확률변수일 때, $\mathrm{P}(0\le Z\le1)=0.3413$, $\mathrm{P}(0\le Z\le2)=0.4772$, $\mathrm{P}(0\le Z\le3)=0.4987$로 계산한다.) (10점)

subparts:
- id: '1'
  stem: |
    위 논제의 $n$과 $p$를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'n=100,\ p=0.2', equivalents: ['p=1/5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $X\sim B(n,p)$, 정규근사 후 표준화하면 $\dfrac{2m}{5\sigma}=2$, 즉 $m=5\sigma$이다.
    steps:
    - {id: 1a, content: '$m=5\sigma$, $m\sigma=80$ ⇒ $m=20$, $\sigma=4$ ⇒ $np=20$, $np(1-p)=16$', criteria: [1.A1]}
    hint_ladder:
    - 확률질량함수를 보면 어떤 분포인가?
    - $n$이 충분히 크면 어떤 분포로 근사할 수 있는가?
    - 0.0456을 표의 값으로 나타내 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 5 2021학년도 논술고사 기출문제(자연계)_1206 오전.pdf 예시답안 p.9
    steps:
    - id: 1b-1
      content: |
        주어진 확률질량함수로부터 $X$는 이항분포 $B(n,p)$를 따른다(제시문 [가]). 따라서 $X$의 평균은 $m=np$이고 표준편차는 $\sigma=\sqrt{np(1-p)}$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $n\ge60$, $0.1\le p\le0.5$에서 $np\ge5$, $n(1-p)\ge5$이므로 $X$는 근사적으로 정규분포 $N(np,\ np(1-p))$를 따른다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        따라서 $\mathrm{P}\left(\lvert X-m\rvert\ge\dfrac25m\right)=\mathrm{P}\left(\dfrac{\lvert X-m\rvert}{\sigma}\ge\dfrac{2m}{5\sigma}\right)=\mathrm{P}\left(\lvert Z\rvert\ge\dfrac{2m}{5\sigma}\right)=0.0456$이고, $\mathrm{P}(\lvert Z\rvert\ge2)=1-2\mathrm{P}(0\le Z\le2)=0.0456$에서 $\dfrac{2m}{5\sigma}=2$이다.
        따라서 $m=5\sigma$이고 $m\sigma=80$에서 $m=20$, $\sigma=4$이므로 $np=20$, $np(1-p)=16$이다. 따라서 $n=100$, $p=0.2$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 이산확률변수 $X$의 평균과 분산(표준편차)을 $n$과 $p$로 표현했다($m=np$, $\sigma=\sqrt{np(1-p)}$).
      depends_on: []
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: $np\ge5$, $n(1-p)\ge5$에서 이산확률변수 $X$의 분포가 근사적으로 정규분포를 따름을 설명했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 주어진 표준정규분포에 대한 확률을 이용하여 $\dfrac{2m}{5\sigma}=2$를 얻고 $n=100$, $p=0.2$를 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6806}
  misconceptions:
  - id: MC-PRB-6806
    outcome_code: '70'
    wrong_work: '표준화에서 분산 $np(1-p)$로 나누거나 $\sigma=np(1-p)$로 두어 $m\sigma=80$을 $np\cdot np(1-p)=80$으로 풂'
    detect_cue: 답의 $n$, $p$가 $np=20$, $np(1-p)=16$을 만족하지 않음
    feedback: 표준편차는 분산의 양의 제곱근 $\sqrt{np(1-p)}$입니다. 표준화 $Z=\dfrac{X-m}{\sigma}$에도 표준편차를 씁니다.
    remedy: [RL-1]

