stimuli:
- label: 가
  body: |
    $n$번의 독립시행에서 사건 $A$가 일어나는 횟수를 $X$라고 하면 $X$는 $0,1,\cdots,n$의 값을 갖는 확률변수이다. 한 번의 시행에서 사건 $A$가 일어날 확률을 $p$라고 하면 $X$의 확률질량함수는 독립시행의 확률에 의하여
    $$\mathrm{P}(X=k)={}_n\mathrm{C}_k\,p^kq^{n-k}\quad(q=1-p,\ k=0,1,\cdots,n)$$
    이다.
- label: 나
  body: |
    미분가능한 두 함수 $y=f(u)$와 $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는
    $$\dfrac{dy}{dx}=\dfrac{dy}{du}\times\dfrac{du}{dx}\ \text{또는}\ \{f(g(x))\}'=f'(g(x))g'(x)$$
    이다.
- label: 다
  body: |
    미분가능한 함수 $f(x)$의 도함수는
    $$f'(x)=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}$$
- label: 라
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능하고 $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^b f(x)g'(x)dx=\left[f(x)g(x)\right]_a^b-\int_a^b f'(x)g(x)dx$$
- label: 마
  body: |
    함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\dfrac{d}{dx}\int_a^x f(t)dt=f(x)\quad(\text{단, }a<x<b)$$

stem: |
  [논제 I] 제시문 [가]~[마]를 읽고 다음 질문에 답하시오.
  [논제 I-2]
  [그림 1]과 같이 점 O에서 시작하는 세 반직선 $l$, $m$, $n$이 있다. 두 반직선 $m$과 $n$이 이루는 각의 크기는 $\theta$, 두 반직선 $l$과 $m$이 이루는 각의 크기는 $2\theta$, 두 반직선 $l$과 $n$이 이루는 각의 크기는 $3\theta$이다. 원 $\mathrm{C_1}$은 반직선 $l$과 점 P에서 접하고 반직선 $m$과 점 Q에서 접한다. 선분 OP의 길이는 1이며 원 $\mathrm{C_1}$의 중심 $\mathrm{O_1}$과 점 Q를 지나는 직선은 반직선 $n$과 점 R에서 만난다. 삼각형 $\mathrm{O_1PR}$의 넓이를 $S(\theta)$라 할 때, $\displaystyle\int_{\frac{\pi}{6}}^{\frac{\pi}{4}}S(\theta)d\theta$의 값을 구하고, 그 과정을 논술하시오. $\left(\text{단, }0<\theta<\dfrac{\pi}{3}\right)$ (15점)
  [그림 1 설명: 반직선 $l$은 O에서 오른쪽 수평 방향, $m$은 $l$과 각 $2\theta$, $n$은 $m$ 위쪽으로 각 $\theta$. 원 $\mathrm{C_1}$은 $l$ 위의 P와 $m$ 위의 Q에서 접하고(접점에 직각 표시), 중심 $\mathrm{O_1}$에서 Q를 지나 연장한 직선이 $n$과 R에서 만난다. 삼각형 $\mathrm{O_1PR}$에 빗금.]

subparts:
- id: '1'
  stem: |
    위 논제의 정적분 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '\ln\dfrac32-\dfrac14', equivalents: ['\ln3-\ln2-\dfrac14'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 합동으로 $\overline{O_1P}=\tan\theta$, $\overline{O_1R}=2\tan\theta$, 끼인각 $\pi-2\theta$를 얻어 $S=\tan^2\theta\sin2\theta$, $t=\cos\theta$로 치환한다.
    steps:
    - {id: 1a, content: '$\displaystyle\int S\,d\theta=-2\int_{\frac{\sqrt3}{2}}^{\frac{\sqrt2}{2}}\dfrac{1-t^2}{t}dt=\ln\dfrac32-\dfrac14$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $OO_1$은 각 $2\theta$의 이등분선이다.
    - 삼각형 $OO_1Q$와 $ORQ$를 비교하자.
    - $\tan^2\theta\sin2\theta$를 $\cos\theta$의 식과 $\sin\theta$의 곱으로 바꾸자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 5 2021학년도 논술고사 기출문제(자연계)_1206 오전.pdf 예시답안 p.9
    steps:
    - id: 1b-1
      content: |
        $\triangle OO_1P$와 $\triangle OO_1Q$는 합동이므로 $\angle O_1OP=\angle O_1OQ=\theta$이고 $\overline{PO_1}=\overline{QO_1}=\tan\theta$이다.
        또한 $\triangle OO_1Q$와 $\triangle ORQ$는 선분 OQ를 공유하고 $\angle O_1OQ=\angle ROQ=\theta$, $\angle OQO_1=\angle OQR=\dfrac{\pi}{2}$이므로 합동이다. $\overline{O_1Q}=\overline{RQ}=\tan\theta$에서 $\overline{O_1R}=2\tan\theta$이고 $\angle OO_1P=\angle OO_1Q=\dfrac{\pi}{2}-\theta$이다. 즉, $\angle PO_1R=\pi-2\theta$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        두 변과 끼인각에 의한 넓이 공식(예시답안 표현: 사인법칙)에 의해 $S(\theta)=\dfrac12\overline{O_1P}\cdot\overline{O_1R}\cdot\sin(\angle PO_1R)=\tan^2\theta\sin2\theta$.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $\sin^2\theta+\cos^2\theta=1$, $\sin2\theta=2\sin\theta\cos\theta$이므로
        $$\int_{\frac{\pi}{6}}^{\frac{\pi}{4}}S(\theta)d\theta=\int_{\frac{\pi}{6}}^{\frac{\pi}{4}}\tan^2\theta\sin2\theta\,d\theta=2\int_{\frac{\pi}{6}}^{\frac{\pi}{4}}\dfrac{\sin^2\theta}{\cos^2\theta}\sin\theta\cos\theta\,d\theta=2\int_{\frac{\pi}{6}}^{\frac{\pi}{4}}\dfrac{1-\cos^2\theta}{\cos\theta}\sin\theta\,d\theta$$
      criteria: [1.M2]
    - id: 1b-4
      content: |
        $t=\cos\theta$로 치환하면
        $$\int_{\frac{\pi}{6}}^{\frac{\pi}{4}}S(\theta)d\theta=-2\int_{\frac{\sqrt3}{2}}^{\frac{\sqrt2}{2}}\dfrac{1-t^2}{t}dt=-2\left[\ln t-\dfrac{t^2}{2}\right]_{\frac{\sqrt3}{2}}^{\frac{\sqrt2}{2}}=\ln3-\ln2-\dfrac14=\ln\dfrac32-\dfrac14$$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: 삼각형의 합동을 이용하여 삼각형 $\mathrm{O_1PR}$의 넓이를 $S(\theta)=\tan^2\theta\sin2\theta$(또는 동치식)로 표현했다.
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 삼각함수의 공식으로 피적분함수를 $2\dfrac{1-\cos^2\theta}{\cos\theta}\sin\theta$ 꼴로 바꾸어 치환할 수 있게 정리했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $t=\cos\theta$ 치환(적분구간 변환 포함)으로 $\ln\dfrac32-\dfrac14$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-4]
    deductions: []
