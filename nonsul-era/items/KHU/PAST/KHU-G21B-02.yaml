  misconceptions:
  - id: MC-GEO-6807
    outcome_code: '70'
    wrong_work: '$\angle PO_1R$를 $2\theta$로 잡거나 $\overline{O_1R}=\tan\theta$로 두어 $S(\theta)=\dfrac12\tan^2\theta\sin2\theta$ 등을 얻음'
    detect_cue: $S(\theta)$의 계수가 $\dfrac12$이거나 $\sin\theta$ 등 다른 각이 들어감
    feedback: $O_1R=O_1Q+QR$이고 두 삼각형의 합동에서 $QR=O_1Q$입니다. 사각형 $OPO_1Q$의 각의 합으로 $\angle PO_1Q=\pi-2\theta$를 확인하세요.
    remedy: [RL-1]
  - id: MC-CAL-6808
    outcome_code: '71'
    wrong_work: '$t=\cos\theta$로 치환하고 적분구간을 $\dfrac{\pi}{6}$, $\dfrac{\pi}{4}$ 그대로 두거나 $-$부호를 빠뜨려 $-\ln\dfrac32+\dfrac14$를 얻음'
    detect_cue: 답이 음수이거나 $\ln$ 안에 $\pi$가 들어감
    feedback: 치환하면 $dt=-\sin\theta d\theta$이고 적분구간은 $\cos\dfrac{\pi}{6}=\dfrac{\sqrt3}{2}$에서 $\cos\dfrac{\pi}{4}=\dfrac{\sqrt2}{2}$까지로 바뀝니다.
    remedy: [RL-2]

