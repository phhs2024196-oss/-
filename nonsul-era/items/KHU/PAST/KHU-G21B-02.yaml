key_idea: '$\triangle OO_1Q\equiv\triangle ORQ$에서 $\overline{O_1R}=2\tan\theta$, $\angle PO_1R=\pi-2\theta$이므로 $S(\theta)=\tan^2\theta\sin2\theta=2\dfrac{1-\cos^2\theta}{\cos\theta}\sin\theta$이고 $t=\cos\theta$로 치환한다.'
