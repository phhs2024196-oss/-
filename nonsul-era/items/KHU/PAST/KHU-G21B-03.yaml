stimuli:
- label: 가
  body: |
    $n$번의 독립시행에서 사건 $A$가 일어나는 횟수를 $X$라고 하면 $X$는 $0,1,\cdots,n$의 값을 갖는 확률변수이다. 한 번의 시행에서 사건 $A$가 일어날 확률을 $p$라고 하면 $X$의 확률질량함수는 독립시행의 확률에 의하여
    $$\mathrm{P}(X=k)={}_n\mathrm{C}_k\,p^kq^{n-k}\quad(q=1-p,\ k=0,1,\cdots,n)$$
    이다.
- label: 나
  body: |
    미분가능한 두 함수 $y=f(u)$와 $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는
    $$\dfrac{dy}{dx}=\dfrac{dy}{du}\times\dfrac{du}{dx}\ \text{또는}\ \{f(g(x))\}'=f'(g(x))g'(x)$$
    이다.
- label: 다
  body: |
    미분가능한 함수 $f(x)$의 도함수는
    $$f'(x)=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}$$
- label: 라
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능하고 $f'(x)$, $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^b f(x)g'(x)dx=\left[f(x)g(x)\right]_a^b-\int_a^b f'(x)g(x)dx$$
- label: 마
  body: |
    함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\dfrac{d}{dx}\int_a^x f(t)dt=f(x)\quad(\text{단, }a<x<b)$$

stem: |
  [논제 I] 제시문 [가]~[마]를 읽고 다음 질문에 답하시오.
  [논제 I-3]
  실수 전체의 집합에서 미분가능하며 양의 값을 가지는 함수 $f(x)$가 모든 실수 $x$, $y$에 대하여
  $$f(x+y)=f(x)f(y)e^{2xy},\quad f'(0)=0$$
  을 만족시킬 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    (1) $f(x)$을 구하고, 그 근거를 논술하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'f(x)=e^{x^2}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $P(x)=\ln f(x)$로 두면 $P(x+y)=P(x)+P(y)+2xy$, 도함수의 정의에서 $P'(x)=2x+P'(0)=2x$.
    steps:
    - {id: 1a, content: '$P(0)=0$이므로 $P(x)=x^2$, $f(x)=e^{x^2}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $x=y=0$을 대입해 보자.
    - 곱의 꼴을 합의 꼴로 바꾸려면?
    - $y=h$를 대입해 도함수의 정의를 써 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 5 2021학년도 논술고사 기출문제(자연계)_1206 오전.pdf 예시답안 p.10
    steps:
    - id: 1b-1
      content: |
        $f(x)$가 양의 값을 가지므로 $x=y=0$을 대입하면 $f(0)=f(0)^2$에서 $f(0)=1$이다.
        식 $f(x+y)=f(x)f(y)e^{2xy}$ 양변에 $\ln$을 취하고 $P(x)=\ln f(x)$라 하면 $P(x)$는 $P(x+y)=P(x)+P(y)+2xy$ …… ①과 $P'(0)=\dfrac{f'(0)}{f(0)}=0$, $P(0)=\ln f(0)=0$을 만족한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        ①에 $y=h$를 대입하면 $\dfrac{P(x+h)-P(x)}{h}=2x+\dfrac{P(h)}{h}$이고, $P(x)$가 미분가능하고 $P'(0)=0$이므로 $h\to0$인 극한을 생각하면(제시문 [다])
        $$\lim_{h\to0}\dfrac{P(x+h)-P(x)}{h}=2x+\lim_{h\to0}\dfrac{P(h)-P(0)}{h-0}=2x+P'(0)=2x$$
        에서 $P'(x)=2x$이고 $P(0)=0$이므로 $P(x)=\ln f(x)=x^2$, 따라서 $f(x)=e^{x^2}$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $\ln f(x)$에 관한 함수방정식 $P(x+y)=P(x)+P(y)+2xy$를 도출했다($f(0)=1$, $P(0)=0$, $P'(0)=0$ 포함).
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 도함수의 정의를 이용하여 $P'(x)=2x$를 얻고 $\ln f(x)=x^2$, 즉 $f(x)=e^{x^2}$임을 보였다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6809}
  misconceptions:
  - id: MC-CAL-6809
    outcome_code: '70'
    wrong_work: '$P''(x)=2x$에서 $P(x)=x^2+C$로 두고 상수를 정하지 않거나 $f(x)=Ce^{x^2}$로 답함'
    detect_cue: 답에 임의 상수가 남거나 $f(0)$을 구하지 않음
    feedback: $x=y=0$을 대입하면 $f(0)=1$, 즉 $P(0)=0$이므로 상수가 정해집니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    (2) 양의 실수 전체의 집합에서 미분가능한 함수 $g(x)$가 모든 실수 $x$에 대하여
    $$g'(f(x))f'(x)=2x(1+2x^2)f(\sqrt2x),\quad g(1)=0$$
    을 만족시킨다. 이때 $g(e)$의 값을 구하고, 그 근거를 논술하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: 'e^2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(f(x))-g(f(0))=\int_0^x g'(f(t))f'(t)dt$이고 $f(1)=e$이므로 $g(e)=2\int_0^1t(1+2t^2)e^{2t^2}dt$, $y=e^{t^2}$로 치환하면 $\int_1^e y(1+2\ln y)dy$.
    steps:
    - {id: 2a, content: '$\int_1^e y(1+2\ln y)dy=\left[y^2\ln y\right]_1^e=e^2$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - 좌변은 어떤 함수의 도함수인가?
    - $f(0)=1$, $f(1)=e$를 이용해 $g(e)$를 정적분으로 쓰자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 5 2021학년도 논술고사 기출문제(자연계)_1206 오전.pdf 예시답안 p.10
    steps:
    - id: 2b-1
      content: |
        $f(x)=e^{x^2}$이므로 $g'(f(x))f'(x)=2x(1+2x^2)e^{2x^2}$이다. 치환적분을 이용한 정적분(제시문 [나])에 의해 $f(0)=1$, $g(1)=0$에서
        $$g(f(x))=g(f(x))-g(f(0))=\int_0^x g'(f(t))f'(t)dt=2\int_0^x t(1+2t^2)e^{2t^2}dt$$
        이다. $f(1)=e$이므로 $g(e)=2\int_0^1t(1+2t^2)e^{2t^2}dt$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $y=f(t)=e^{t^2}$으로 치환하면 $1+2t^2=1+2\ln y$, $\dfrac{dy}{dt}=2te^{t^2}$이므로
        $$g(e)=2\int_0^1t(1+2t^2)e^{2t^2}dt=\int_0^1e^{t^2}(1+2t^2)2te^{t^2}dt=\int_1^e y(1+2\ln y)dy$$
        를 얻는다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        부분적분법(제시문 [라])에 의해 $\int_1^e y\ln y\,dy=\left[\dfrac{y^2}{2}\ln y\right]_1^e-\int_1^e\dfrac{y}{2}dy$이므로
        $g(e)=2\int_1^e y\ln y\,dy+\int_1^e y\,dy=2\left[\dfrac{y^2}{2}\ln y\right]_1^e-\int_1^e y\,dy+\int_1^e y\,dy=e^2$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $g(e)$의 값을 정적분 $2\int_0^1t(1+2t^2)e^{2t^2}dt$(또는 동치식)로 표현했다.
      depends_on: []
      ft: {from: [1.A1], max_points: 5}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: 치환적분과 부분적분을 이용하여 $g(e)=e^2$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2, 2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6810}
  misconceptions:
  - id: MC-CAL-6810
    outcome_code: '70'
    wrong_work: '$g(e)=\int_0^e g''(f(t))f''(t)dt$처럼 $t$의 상한을 $e$로 둠'
    detect_cue: 적분 상한이 $e$인데 피적분함수가 $t$의 식임
    feedback: $g(f(x))$에서 $f(x)=e$가 되는 $x$는 1입니다. 정의역과 공역의 대응을 확인하세요.
    remedy: [RL-2]
- id: '3'
  stem: |
    (3) 실수 전체의 집합에서 연속인 함수 $h(x)$가 $\displaystyle\int_0^x tf(x-t)h(x-t)dt=f(x)-1$을 만족시킨다. 곡선 $y=h(x)$ 위의 점 $(a,h(a))$에서의 접선과 수직이며 점 $(a,h(a))$를 지나는 직선이 $x$축과 만나는 점을 $(49,0)$이라 할 때 $a$의 값을 구하고, 그 근거를 논술하시오. (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '1', equivalents: ['a=1'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $s=x-t$로 바꾸면 $\int_0^x(x-s)e^{s^2}h(s)ds=e^{x^2}-1$, 두 번 미분해 $h(x)=4x^2+2$. 법선 $y=-\dfrac{1}{8a}(x-a)+4a^2+2$에 $(49,0)$ 대입.
    steps:
    - {id: 3a, content: '$32a^3+17a-49=(a-1)(32a^2+32a+49)=0$ ⇒ $a=1$', criteria: [3.M1, 3.A1, 3.A2]}
    hint_ladder:
    - 적분 안의 $x-t$를 하나의 변수로 바꾸자.
    - $x$를 적분 밖으로 꺼낸 뒤 미분하자.
    - 법선의 기울기는 $-\dfrac{1}{h'(a)}$이다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 5 2021학년도 논술고사 기출문제(자연계)_1206 오전.pdf 예시답안 p.10~11
    steps:
    - id: 3b-1
      content: |
        $s=x-t$라고 하면 $\int_0^x tf(x-t)h(x-t)dt=\int_0^x(x-s)f(s)h(s)ds=f(x)-1$에서 $f(x)=e^{x^2}$이므로
        $$\int_0^x(x-t)e^{t^2}h(t)dt=e^{x^2}-1\ \cdots\cdots②$$
        이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $\int_0^x(x-t)e^{t^2}h(t)dt=x\int_0^xe^{t^2}h(t)dt-\int_0^xte^{t^2}h(t)dt$에서 ②의 양변을 $x$로 미분하면(제시문 [마]) $\int_0^xe^{t^2}h(t)dt=2xe^{x^2}$이고, 이 식을 다시 $x$로 미분하면 $e^{x^2}h(x)=(4x^2+2)e^{x^2}$에서 $h(x)=4x^2+2$이다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        $y=h(x)$ 위의 점 $(a,h(a))$에서 접선의 기울기는 $h'(a)=8a$이므로 이 접선에 수직인 직선의 기울기는 $-\dfrac{1}{8a}$이다($a=0$이면 수직인 직선은 $x=0$이 되어 $(49,0)$을 지나지 않음). 기울기가 $-\dfrac{1}{8a}$이며 점 $(a,4a^2+2)$를 지나는 직선은 $y=-\dfrac{1}{8a}(x-a)+4a^2+2=-\dfrac{1}{8a}x+4a^2+\dfrac{17}{8}$이고, 이 직선이 $x$축과 만나는 점이 $(49,0)$이므로 $a$는 $32a^3+17a-49=0$을 만족한다.
      criteria: [3.M2]
    - id: 3b-4
      content: |
        $32a^3+17a-49=(a-1)(32a^2+32a+49)$, $32a^2+32a+49=32\left(a+\dfrac12\right)^2+41>0$에서 $a=1$이다.
      criteria: [3.A2]
