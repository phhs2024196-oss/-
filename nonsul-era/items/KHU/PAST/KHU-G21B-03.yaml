intent: 함수방정식에 로그를 취해 도함수의 정의로 함수를 결정하고, 합성함수의 미분을 거꾸로 적분해 치환·부분적분으로 값을 구하며, 정적분으로 정의된 함수를 치환과 두 번의 미분으로 풀어 법선 조건으로 미지수를 결정하는 능력을 본다.
key_idea: '$P=\ln f$이면 $P(x+y)=P(x)+P(y)+2xy$이고 도함수의 정의로 $P''(x)=2x$, $f(x)=e^{x^2}$. (2)는 $g(f(x))=\int_0^x g''(f(t))f''(t)dt$, (3)은 $s=x-t$로 바꿔 $x$를 적분 밖으로 꺼낸 뒤 두 번 미분해 $h(x)=4x^2+2$.'
stuck: (1)에서 $\dfrac{P(x+h)-P(x)}{h}=2x+\dfrac{P(h)}{h}$로 정리하는 단계, (3)에서 $\int_0^x(x-t)e^{t^2}h(t)dt$의 $x$를 적분 밖으로 빼고 미분하는 단계
idea_tags: [IDEA-LOG-FUNCTIONAL-EQUATION, IDEA-DERIV-DEF-FUNC-EQ, IDEA-CHAIN-RULE-INTEGRATE, IDEA-INTEGRAL-EQ-DIFFERENTIATE-TWICE]
tags: [함수방정식, 정적분으로 정의된 함수, 법선, 경희 실전]
elements:
  materials:
  - '$f(x+y)=f(x)f(y)e^{2xy}$, $f''(0)=0$인 양의 함수 $f$'
  - '$g''(f(x))f''(x)=2x(1+2x^2)f(\sqrt2x)$, $g(1)=0$인 함수 $g$'
  - 정적분 관계식을 만족하는 연속함수 h
  - '점 $(a,h(a))$에서 접선에 수직인 직선과 x축의 교점 $(49,0)$'
  concepts: [도함수의 정의, 로그함수의 성질, 합성함수의 미분법, 치환적분법, 부분적분법, 정적분으로 정의된 함수의 미분, 접선과 수직인 직선, 삼차방정식의 인수분해]
  tools:
  - x=y=0 대입으로 f(0)=1
  - P=ln f 로 곱을 합으로
  - 도함수 정의로 P'(x)=2x
  - 합성함수 미분의 역으로 g(f(x)) 표현
  - '$y=e^{t^2}$ 치환과 $y\ln y$ 부분적분'
  - s=x-t 치환 후 두 번 미분
  - 법선 방정식에 (49,0) 대입, 인수정리
  conditions:
  - '$f>0$ ⇒ $\ln f$ 정의, $f(0)^2=f(0)$에서 $f(0)=1$'
  - '$f''(0)=0$ ⇒ $P''(0)=0$'
  - '$g(1)=0$, $f(0)=1$, $f(1)=e$ ⇒ $g(e)=\int_0^1\cdots$'
  - '$32a^2+32a+49>0$ ⇒ 실근은 $a=1$뿐'
  stimuli_used: [나, 다, 라, 마]
  subpart_links: (2)는 (1)의 $f(x)=e^{x^2}$을, (3)도 (1)의 $f(x)=e^{x^2}$을 사용

