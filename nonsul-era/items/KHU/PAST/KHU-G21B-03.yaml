    원문 (2)의 함수 $g$는 '양의 실수 전체의 집합에서 미분가능한 함수'로 적혀 있으나 조건식은 '모든 실수 $x$에 대하여'(f(x)>0 이므로 문제없음) — 원문 그대로.
