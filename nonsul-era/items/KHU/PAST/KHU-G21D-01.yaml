stimuli:
- label: 가
  body: |
    이차함수 $y=ax^2+bx+c\ (a>0)$의 그래프가 $x$축과 한 점에서 만나면 이차방정식 $ax^2+bx+c=0$은 중근을 갖는다. 이때 중근을 $\alpha$라고 하면 이차부등식의 해는 다음과 같다.
    (1) $ax^2+bx+c>0$의 해는 $x\neq\alpha$인 모든 실수
    (2) $ax^2+bx+c<0$의 해는 없다.
    (3) $ax^2+bx+c\ge0$의 해는 모든 실수
    (4) $ax^2+bx+c\le0$의 해는 $x=\alpha$
- label: 나
  body: |
    삼각함수의 덧셈정리
    (1) $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$, $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$
    (2) $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$, $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$
    (3) $\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$, $\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$
- label: 다
  body: |
    두 변수 $x$, $y$ 사이의 관계가 변수 $t$를 매개로 하여
    $$x=f(t),\ y=g(t)$$
    와 같이 나타내어질 때, 변수 $t$를 $x$, $y$의 매개변수라 하고, 두 함수 $x=f(t)$, $y=g(t)$를 매개변수로 나타낸 함수라고 한다.
- label: 라
  body: |
    첫째항부터 차례대로 일정한 수를 곱하여 만든 수열을 등비수열이라 하고, 곱하는 일정한 수를 공비라고 한다.
    공비가 $r$인 등비수열 $\{a_n\}$에서 제 $n$항에 공비 $r$을 곱하면 제 $(n+1)$항이 되므로
    $$a_{n+1}=ra_n\ (n=1,2,3,\cdots)$$
    이 성립한다.
- label: 마
  body: |
    등비급수 $\displaystyle\sum_{n=1}^{\infty}ar^{n-1}=a+ar+ar^2+\cdots+ar^{n-1}+\cdots\ (a\neq0)$은
    (1) $\lvert r\rvert<1$일 때, 수렴하고 그 합은 $\dfrac{a}{1-r}$이다.
    (2) $\lvert r\rvert\ge1$일 때, 발산한다.

stem: |
  [논제 I] 제시문 [가]~[마]를 읽고 다음 질문에 답하시오.
  [논제 I-1] 두 실수 $\theta$와 $k$에 대하여 아래와 같이 매개변수 $t$로 나타낸 함수를 생각하자.
  $$x=(\cos\theta)t,\ y=t^2-(\sin(\theta+k))t\ \cdots\cdots①$$
  [그림 1 설명: 원점 O를 지나고 아래로 볼록한 포물선 하나가 원점과 $x$축의 양의 부분에서 $x$축과 만난다.]
  [그림 2 설명: 원점을 지나는 아래로 볼록한 여러 포물선이 겹쳐 그려져 있다(꼭짓점이 $y$축 좌우에 있음).]

subparts:
- id: '1'
  stem: |
    (1) $k$를 $\dfrac{\pi}{5}$라 할 때, $0<\theta<\dfrac{\pi}{2}$인 $\theta$에 대하여 함수 ①은 [그림 1]과 같이 $x$축과 만난다. 이때 원점이 아닌 교점의 $x$좌표를 $\theta$에 대한 함수 $g(\theta)$로 나타낸 다음, $g(\theta)$가 최댓값을 가지는 $\theta$의 값을 구하고, 그 근거를 논술하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '\theta=\dfrac{3\pi}{20}', equivalents: ['3\pi/20'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $y=0$, $t\neq0$에서 $t=\sin\left(\theta+\dfrac{\pi}{5}\right)$, $g(\theta)=\cos\theta\sin\left(\theta+\dfrac{\pi}{5}\right)$, $g'(\theta)=\cos\left(2\theta+\dfrac{\pi}{5}\right)$.
    steps:
    - {id: 1a, content: '$2\theta+\dfrac{\pi}{5}=\dfrac{\pi}{2}$ ⇒ $\theta=\dfrac{3\pi}{20}$에서 극대이자 최대', criteria: [1.B1, 1.B2]}
    hint_ladder:
    - $y=0$인 $t$를 구하자.
    - 미분한 결과를 덧셈정리로 하나의 코사인으로 묶자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 6 2021학년도 논술고사 기출문제(의학계)_1207 오전.pdf 예시답안 p.10
    steps:
    - id: 1b-1
      content: |
        매개변수 $t$로 나타낸 함수 $x=(\cos\theta)t$, $y=t^2-\left(\sin\left(\theta+\dfrac{\pi}{5}\right)\right)t$가 $x$축을 만날 때 $y=0$, 즉 $0=t^2-\left(\sin\left(\theta+\dfrac{\pi}{5}\right)\right)t$이므로 $t=0$ 또는 $t=\sin\left(\theta+\dfrac{\pi}{5}\right)$이다.
        $t=0$일 때 $x=0$으로 원점이 교점이므로 $t\neq0$이다. 그래서 $t=\sin\left(\theta+\dfrac{\pi}{5}\right)$일 때 $g(\theta)=x=\cos\theta\sin\left(\theta+\dfrac{\pi}{5}\right)$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        이를 미분하면 $g'(\theta)=(-\sin\theta)\sin\left(\theta+\dfrac{\pi}{5}\right)+\cos\theta\cos\left(\theta+\dfrac{\pi}{5}\right)=\cos\left(2\theta+\dfrac{\pi}{5}\right)$이다(제시문 [나]).
        $0<\theta<\dfrac{\pi}{2}$이므로 $\dfrac{\pi}{5}<2\theta+\dfrac{\pi}{5}<\dfrac{6\pi}{5}$이고, $\theta=\dfrac{3\pi}{20}$에서만 $g'(\theta)=0$이다.
        $\theta=\dfrac{3\pi}{20}$에서 $g'(\theta)$의 부호가 양에서 음으로 바뀌어 $g(\theta)$가 극댓값을 가지므로, $g(\theta)$는 $\theta=\dfrac{3\pi}{20}$에서 최댓값을 가진다.
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: 함수 $g(\theta)=\cos\theta\sin\left(\theta+\dfrac{\pi}{5}\right)$를 찾았다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 6
      evidence: $g'(\theta)=\cos\left(2\theta+\dfrac{\pi}{5}\right)$의 부호 변화로 $g(\theta)$가 최댓값을 가지는 $\theta=\dfrac{3\pi}{20}$을 찾았다.
      depends_on: []
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6813}
  misconceptions:
  - id: MC-CAL-6813
    outcome_code: '70'
    wrong_work: '$g''(\theta)=0$을 풀지 못해 $\theta=\dfrac{\pi}{4}$ 등으로 추측하거나 부호 변화 확인 없이 답함'
    detect_cue: 답이 $\dfrac{3\pi}{20}$이 아니거나 최대 판정 근거가 없음
    feedback: $-\sin\theta\sin\beta+\cos\theta\cos\beta=\cos(\theta+\beta)$로 묶으면 $g'(\theta)=\cos\left(2\theta+\dfrac{\pi}{5}\right)$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    (2) $k$를 0이라 할 때, 다음 두 조건을 만족하는 두 실수 $a$, $c$를 구하고, 이 두 조건이 성립함을 논술하시오. (20점)
    (ㄱ) $0\le\theta\le\pi$인 모든 $\theta$에 대하여 함수 ① 위의 점 $(x,y)$가 $y\ge ax^2+c$를 만족한다.
    (ㄴ) $q\ge ap^2+c$인 점 $(p,q)$마다 $0\le\theta\le\pi$인 어떤 $\theta$가 존재하여 점 $(p,q)$가 함수 ①의 한 점이 된다.
  points: 20
  depends_on: []
  answer: {kind: value, value: 'a=1,\ c=-\dfrac14', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $t$를 소거한 $y=(\sec^2\theta)x^2-(\tan\theta)x$가 $y=ax^2+c$에 접하도록(판별식 $=(4c+1)\tan^2\theta+4c(1-a)=0$) $a=1$, $c=-\dfrac14$. 실제로 $y-x^2+\dfrac14=\left(t\sin\theta-\dfrac12\right)^2\ge0$.
    steps:
    - {id: 2a, content: '(ㄴ): $p\neq0$이면 $p^2z^2-pz+p^2-q=0$의 판별식 $4p^2\left(\dfrac14-p^2+q\right)\ge0$, 근 $\beta=\tan\alpha$', criteria: [2.M1, 2.R1, 2.R2]}
    hint_ladder:
    - $\theta\neq\dfrac{\pi}{2}$일 때 $t$를 소거해 $x$, $y$의 관계식을 만들자.
    - 판별식이 $\theta$와 관계없이 0이 되게 하려면?
    - (ㄴ)은 주어진 $(p,q)$에 대해 $\tan\theta$가 만족할 방정식을 세우자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 6 2021학년도 논술고사 기출문제(의학계)_1207 오전.pdf 예시답안 p.10~11
    steps:
    - id: 2b-1
      content: |
        조건 (ㄱ)을 만족하는 두 실수 $a$와 $c$를 찾기 위하여, 먼저 $\theta\neq\dfrac{\pi}{2}$라 하자. 이때 $\cos\theta\neq0$이다. 매개변수 함수 $x=(\cos\theta)t$, $y=t^2-(\sin\theta)t$ …… ①에서 $t=\dfrac{x}{\cos\theta}$이고
        $y=\left(\dfrac{x}{\cos\theta}\right)^2-(\sin\theta)\dfrac{x}{\cos\theta}=(\sec^2\theta)x^2-(\tan\theta)x$이다(제시문 [다]).
        이 점이 부등식 $y\ge ax^2+c$를 만족해야 하므로 모든 실수 $x$에 대하여 $(\sec^2\theta-a)x^2-(\tan\theta)x-c\ge0$ …… ②이어야 한다. 만약 $\sec^2\theta-a\le0$이면 ②가 성립하지 않는 $x$가 항상 있기에, $a$는 $0\le\theta\le\pi$이고 $\theta\neq\dfrac{\pi}{2}$인 모든 $\theta$에 대하여 $\sec^2\theta-a>0$을 만족해야 한다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        이때 방정식 $(\sec^2\theta-a)x^2-(\tan\theta)x-c=0$이 중근을 가지면 부등식 ②가 성립하므로(제시문 [가]) 판별식
        $(\tan\theta)^2+4c(\sec^2\theta-a)=\tan^2\theta+4c(\tan^2\theta+1)-4ac=(4c+1)\tan^2\theta+4c(1-a)$
        가 0이 되는 $a$, $c$를 찾는다. 여기서 $\tan\theta$에 대한 계수가 모두 0이면 이 조건을 항상 만족시킨다. $a=1$, $c=-\dfrac14$라 하자.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        이때 계수가 0이 되어 위에서 고려된 $\theta=\dfrac{\pi}{2}$ 또는 $\sec^2\theta-a\le0$인 경우를 제외하면 부등식 $y\ge x^2-\dfrac14$가 항상 성립한다.
        $\theta=\dfrac{\pi}{2}$일 때 $x=0$, $y=t^2-t\ge-\dfrac14$가 되어 부등식 $y\ge x^2-\dfrac14$를 만족한다.
        $\sec^2\theta\le1$일 때 $\theta=0$ 또는 $\theta=\pi$이고 $\tan\theta=0$이다. 부등식 ②가 $\dfrac14=-c\ge0$, 즉 부등식 $y\ge x^2-\dfrac14$를 만족한다.
        결론적으로, 모든 $\theta\ (0\le\theta\le\pi)$에 대하여 매개변수 함수 ①은 부등식 $y\ge x^2-\dfrac14$를 만족함을 알 수 있다.
      criteria: [2.R1]
    - id: 2b-4
      content: |
        (ㄴ) 조건이 성립함을 보이기 위하여 $q\ge p^2-\dfrac14$ …… ③인 점 $(p,q)$를 생각하자.
        만약 $p=0$이면 $q\ge-\dfrac14$이므로 이차방정식 $t^2-t-q=0$의 해 $t=\alpha$가 존재한다. 이때 $\theta=\dfrac{\pi}{2}$, $t=\alpha$로 하면 점 $(p,q)$는 매개변수 함수의 점이 된다.
        이제 $p\neq0$이라 하자. 변수 $z$에 대한 이차방정식 $p^2z^2-pz+p^2-q=0$은 부등식 ③에 의하여 판별식 $p^2-4p^2(p^2-q)=4p^2\left(\dfrac14-p^2+q\right)\ge0$이 되어 해 $z=\beta$를 가진다.
        방정식 $\tan\theta=\beta$의 해인 $\theta=\alpha$가 구간 $0\le\theta\le\pi$에 존재한다. 이로부터 $p^2\tan^2\alpha-p\tan\alpha+p^2-q=0$이고
        $q=p^2(\tan^2\alpha+1)-p\tan\alpha=p^2\sec^2\alpha-p\tan\alpha=\left(\dfrac{p}{\cos\alpha}\right)^2-\sin\alpha\left(\dfrac{p}{\cos\alpha}\right)$이다.
        이로부터 $t=\dfrac{p}{\cos\alpha}$라 할 때, $p=(\cos\alpha)t$, $q=t^2-(\sin\alpha)t$가 성립하므로 점 $(p,q)$가 어떤 $\theta=\alpha$에 대하여 함수 ①의 한 점이 된다. 그래서 $a=1$, $c=-\dfrac14$일 때, 조건 (ㄴ)이 성립함을 알 수 있다.
      criteria: [2.R2]
