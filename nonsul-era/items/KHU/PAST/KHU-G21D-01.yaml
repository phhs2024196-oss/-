intent: 매개변수로 나타낸 포물선의 $x$절편을 θ의 함수로 나타내 덧셈정리와 도함수로 최대를 판정하고, θ가 변할 때 포물선들이 채우는 영역이 $y\ge x^2-\dfrac14$임을 판별식(이차부등식의 해)과 존재성(역으로 θ를 찾음)의 두 방향으로 논증하는 능력을 본다.
key_idea: '$k=0$이면 $y=(\sec^2\theta)x^2-(\tan\theta)x$이고 $(\sec^2\theta-a)x^2-(\tan\theta)x-c\ge0$의 판별식 $(4c+1)\tan^2\theta+4c(1-a)$가 $\theta$와 무관하게 0이 되도록 $a=1$, $c=-\dfrac14$. 역으로 $p^2z^2-pz+p^2-q=0$의 실근 $\beta$로 $\tan\alpha=\beta$인 $\alpha$를 잡는다.'
stuck: (2)에서 모든 θ에 대해 부등식이 성립하도록 판별식의 $\tan^2\theta$ 계수와 상수항을 함께 0으로 만드는 발상, 조건 (ㄴ)을 $\tan\theta$에 대한 이차방정식의 실근 존재로 바꾸는 단계
