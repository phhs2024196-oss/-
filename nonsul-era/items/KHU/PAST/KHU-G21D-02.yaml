stimuli:
- label: 가
  body: |
    이차함수 $y=ax^2+bx+c\ (a>0)$의 그래프가 $x$축과 한 점에서 만나면 이차방정식 $ax^2+bx+c=0$은 중근을 갖는다. 이때 중근을 $\alpha$라고 하면 이차부등식의 해는 다음과 같다.
    (1) $ax^2+bx+c>0$의 해는 $x\neq\alpha$인 모든 실수
    (2) $ax^2+bx+c<0$의 해는 없다.
    (3) $ax^2+bx+c\ge0$의 해는 모든 실수
    (4) $ax^2+bx+c\le0$의 해는 $x=\alpha$
- label: 나
  body: |
    삼각함수의 덧셈정리
    (1) $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$, $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$
    (2) $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$, $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$
    (3) $\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$, $\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$
- label: 다
  body: |
    두 변수 $x$, $y$ 사이의 관계가 변수 $t$를 매개로 하여
    $$x=f(t),\ y=g(t)$$
    와 같이 나타내어질 때, 변수 $t$를 $x$, $y$의 매개변수라 하고, 두 함수 $x=f(t)$, $y=g(t)$를 매개변수로 나타낸 함수라고 한다.
- label: 라
  body: |
    첫째항부터 차례대로 일정한 수를 곱하여 만든 수열을 등비수열이라 하고, 곱하는 일정한 수를 공비라고 한다.
    공비가 $r$인 등비수열 $\{a_n\}$에서 제 $n$항에 공비 $r$을 곱하면 제 $(n+1)$항이 되므로
    $$a_{n+1}=ra_n\ (n=1,2,3,\cdots)$$
    이 성립한다.
- label: 마
  body: |
    등비급수 $\displaystyle\sum_{n=1}^{\infty}ar^{n-1}=a+ar+ar^2+\cdots+ar^{n-1}+\cdots\ (a\neq0)$은
    (1) $\lvert r\rvert<1$일 때, 수렴하고 그 합은 $\dfrac{a}{1-r}$이다.
    (2) $\lvert r\rvert\ge1$일 때, 발산한다.

stem: |
  [논제 I] 제시문 [가]~[마]를 읽고 다음 질문에 답하시오.
  [논제 I-2] 각 원의 중심은 다른 원의 내부에 포함되지 않는다고 할 때, 다음 질문에 답하시오.
  [그림 3 설명: 직선 $l$ 위에 큰 원 $\mathrm{C_1}$(반지름 $x$, 접점 X), 중간 원 $\mathrm{C_2}$(반지름 $y$, 접점 Y)가 서로 접해 있고, 두 원 사이 아래쪽 틈에 작은 원 $\mathrm{C_3}$(접점 Z)이 두 원과 $l$에 접한다. 접점은 왼쪽부터 X, Z, Y.]
  [그림 4 설명: 좌표평면에서 원 $\mathrm{O_1}$(반지름 $a_1$)은 원점 O에서 $x$축에 접하고, 그 오른쪽에 원 $\mathrm{O_2}$(반지름 $a_2$)가 $\mathrm{O_1}$과 접하며 $x$축에 접한다. 두 원 사이에 작은 원 $\mathrm{O_3}$, 그 오른쪽(O3과 O2 사이)에 더 작은 원 $\mathrm{O_4}$가 있고, $x$축 위 접점의 $x$좌표 표시는 O, $\mathrm{O_3}$, $\mathrm{O_4}$ 순.]

subparts:
- id: '1'
  stem: |
    (1) [그림 3]과 같이 반지름의 길이가 각각 $x$와 $y$인 원 $\mathrm{C_1}$과 원 $\mathrm{C_2}$가 서로 한 점에서 만나고, 동시에 직선 $l$에 점 X와 점 Y에서 각각 접한다. 반지름의 길이가 $z$인 원 $\mathrm{C_3}$가 원 $\mathrm{C_1}$과 원 $\mathrm{C_2}$에 각각 한 점에서 만나고, 동시에 점 Z에서 직선 $l$에 접한다. 이때 선분 YZ의 길이와 원 $\mathrm{C_3}$의 반지름의 길이를 $x$와 $y$에 관한 식으로 나타내고, 그 근거를 논술하시오. (단, $x>y>z$) (15점)
  points: 15
  depends_on: []
  answer: {kind: expression, value: '\overline{YZ}=\dfrac{2y\sqrt x}{\sqrt x+\sqrt y},\ z=\dfrac{xy}{(\sqrt x+\sqrt y)^2}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 중심을 잇는 빗변과 반지름의 차로 직각삼각형을 만들면 접점 사이 거리는 $2\sqrt{xy}$, $2\sqrt{xz}$, $2\sqrt{yz}$이고 $\overline{XY}=\overline{XZ}+\overline{ZY}$.
    steps:
    - {id: 1a, content: '$\sqrt{xy}=\sqrt z(\sqrt x+\sqrt y)$ ⇒ $z=\dfrac{xy}{(\sqrt x+\sqrt y)^2}$, $\overline{YZ}=2\sqrt{yz}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $\mathrm{C_2}$에서 $\mathrm{C_1X}$에 수선을 내려 보자.
    - 빗변은 $x+y$, 한 변은 $x-y$이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 6 2021학년도 논술고사 기출문제(의학계)_1207 오전.pdf 예시답안 p.12
    steps:
    - id: 1b-1
      content: |
        $\mathrm{C_2}$에서 직선 $\mathrm{C_1X}$에 내린 수선의 발을 F라 할 때, 사각형 $\mathrm{YXFC_2}$는 직사각형, 삼각형 $\mathrm{C_1FC_2}$는 직각삼각형이므로 피타고라스 정리에 의하여
        $\overline{XY}=\overline{FC_2}=\sqrt{\overline{C_1C_2}^2-\overline{C_1F}^2}=\sqrt{(x+y)^2-(x-y)^2}=2\sqrt{xy}$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\mathrm{C_3}$을 지나고 $l$에 평행한 직선이 $\mathrm{C_1X}$, $\mathrm{C_2Y}$와 만나는 점을 $\mathrm{X'}$, $\mathrm{Y'}$이라 하면 사각형 $\mathrm{ZXX'C_3}$, $\mathrm{YZC_3Y'}$이 모두 직사각형이고, 삼각형 $\mathrm{C_3X'C_1}$, $\mathrm{C_2Y'C_3}$가 모두 직각삼각형이므로
        $\overline{XZ}=\overline{X'C_3}=\sqrt{(x+z)^2-(x-z)^2}=2\sqrt{xz}$, $\overline{YZ}=\overline{Y'C_3}=\sqrt{(y+z)^2-(y-z)^2}=2\sqrt{yz}$이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        이로부터 $2\sqrt{xy}=\overline{XY}=\overline{XZ}+\overline{YZ}=2\sqrt{xz}+2\sqrt{yz}=2\sqrt z(\sqrt x+\sqrt y)$를 얻는다. 이를 $z$에 대하여 풀면 원 $\mathrm{C_3}$의 반지름 $z=\dfrac{xy}{(\sqrt x+\sqrt y)^2}$이고, $\overline{YZ}=2\sqrt{yz}=\dfrac{2y\sqrt x}{\sqrt x+\sqrt y}$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: 선분 XY의 길이를 $x$, $y$로 표현했다($\overline{XY}=2\sqrt{xy}$, 피타고라스 정리 근거 포함).
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: $\overline{XZ}=2\sqrt{xz}$, $\overline{YZ}=2\sqrt{yz}$와 $\overline{XY}=\overline{XZ}+\overline{ZY}$로 $z=\dfrac{xy}{(\sqrt x+\sqrt y)^2}$, $\overline{YZ}=\dfrac{2y\sqrt x}{\sqrt x+\sqrt y}$를 찾았다.
      depends_on: [1.M1]
      steps: [1b-2, 1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6816}
  misconceptions:
  - id: MC-GEO-6816
    outcome_code: '70'
    wrong_work: '접점 사이 거리를 $x+y$(중심거리) 또는 $x-y$로 두어 $z=\dfrac{xy}{x+y}$ 등을 얻음'
    detect_cue: 답에 근호가 없음
    feedback: 접점 사이 거리는 빗변 $x+y$, 높이 차 $x-y$인 직각삼각형의 밑변 $\sqrt{(x+y)^2-(x-y)^2}=2\sqrt{xy}$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    (2) 좌표평면에서 원 $\mathrm{O_1}$은 반지름의 길이가 1이고 원점 O에서 $x$축에 접한다. [그림 4]와 같이 반지름의 길이가 $\dfrac{(\sqrt5-1)^2}{4}$인 원 $\mathrm{O_2}$는 원 $\mathrm{O_1}$과 한 점에서 만나고 동시에 $x$축에 접한다. 원 $\mathrm{O_3}$는 원 $\mathrm{O_1}$, 원 $\mathrm{O_2}$와 각각 한 점에서 만나고 동시에 $x$축에 접한다. 원 $\mathrm{O_4}$는 원 $\mathrm{O_2}$, 원 $\mathrm{O_3}$와 각각 한 점에서 만나고 동시에 $x$축에 접한다. 이와 같은 과정을 계속하여 $n$번째로 얻은 원 $\mathrm{O_n}$의 반지름의 길이를 $a_n$, 중심의 $x$좌표를 $x_n$이라 하자. 이때 $a_n$과 $\lim\limits_{n\to\infty}x_n$을 구하고, 그 근거를 논술하시오. (단, $x_n\ge0$이고 $a_1>a_2>a_3>\cdots>a_n>\cdots$) (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: expression, value: 'a_n=\left(\dfrac{(\sqrt5-1)^2}{4}\right)^{n-1}=\dfrac{(\sqrt5-1)^{2n-2}}{4^{n-1}},\ \lim_{n\to\infty}x_n=\dfrac{2\sqrt5}{5}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $r=\dfrac{(\sqrt5-1)^2}{4}$이면 $\sqrt r=\dfrac{\sqrt5-1}{2}=\dfrac{1}{1+\sqrt r}$이라 (1)에서 $a_3=r^2$, 닮음으로 $a_n=r^{n-1}$. 접점 사이 거리 $(\sqrt5-1)r^{n-1}$을 부호 교대로 더한다.
    steps:
    - {id: 2a, content: '$\lim x_n=\dfrac{\sqrt5-1}{1-(-r)}=\dfrac{2\sqrt5}{5}$', criteria: [2.B1, 2.B2]}
    hint_ladder:
    - (1)의 결과에 $x=1$, $y=r$을 넣어 $a_3$을 구하자.
    - 원 $\mathrm{O_2}$, $\mathrm{O_3}$, $\mathrm{O_4}$의 배치는 $\mathrm{O_1}$, $\mathrm{O_2}$, $\mathrm{O_3}$의 배치와 닮았다.
    - 새 원은 직전 원의 왼쪽과 오른쪽 중 어디에 생기는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 6 2021학년도 논술고사 기출문제(의학계)_1207 오전.pdf 예시답안 p.12~13
    steps:
    - id: 2b-1
      content: |
        주어진 조건으로부터 $a_1=1$, $a_2=r$이다. 여기서 $r=\dfrac{(\sqrt5-1)^2}{4}$이라 하자. (1)의 결과를 적용하여
        $$a_3=\dfrac{1\cdot r}{(\sqrt1+\sqrt r)^2}=\dfrac{\frac{(\sqrt5-1)^2}{4}}{\left(1+\frac{\sqrt5-1}{2}\right)^2}=\dfrac{(\sqrt5-1)^2}{(\sqrt5+1)^2}=\left(\dfrac{(\sqrt5-1)^2}{4}\right)^2=r^2$$
        임을 알 수 있다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        원 $\mathrm{O_3}$와 원 $\mathrm{O_2}$의 반지름의 길이의 비 $\dfrac{a_3}{a_2}$는 원 $\mathrm{O_2}$와 원 $\mathrm{O_1}$의 반지름의 길이의 비 $\dfrac{a_2}{a_1}$와 $r$로 서로 같다. 원 $\mathrm{O_2}$와 원 $\mathrm{O_3}$가 서로 한 점에서 만나고 동시에 $x$축에 접하는 관계는 원 $\mathrm{O_1}$과 원 $\mathrm{O_2}$의 관계와 닮았고 그 닮음비가 $r$이다. 그래서 원 $\mathrm{O_4}$와 원 $\mathrm{O_3}$의 닮음비가 $r$이 되고, $a_4=ra_3=r^3$이다. 이와 같은 닮은 관계가 계속되므로 $a_{n+1}=ra_n$이 되어 $a_n$은 공비 $r$을 가지는 등비수열이다(제시문 [라]). 그래서 $a_n=r^{n-1}=\dfrac{(\sqrt5-1)^{2n-2}}{4^{n-1}}$이다.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        모든 자연수 $n$에 대하여 원 $\mathrm{O_n}$과 $x$축과의 교점을 $\mathrm{X_n}$이라 하자. 원 $\mathrm{O_{n+1}}$은 $n$이 짝수일 때 원 $\mathrm{O_n}$의 왼쪽, $n$이 홀수일 때 원 $\mathrm{O_n}$의 오른쪽에 위치하므로 $x_{n+1}=x_n+(-1)^{n-1}\overline{X_nX_{n+1}}$이다.
        $\overline{X_nX_{n+1}}$은 (1)의 결과로부터(원 $\mathrm{O_{n+1}}$은 $\mathrm{O_{n-1}}$, $\mathrm{O_n}$에 접함)
        $\overline{X_nX_{n+1}}=\dfrac{2r^{n-1}\sqrt{r^{n-2}}}{\sqrt{r^{n-2}}+\sqrt{r^{n-1}}}=\dfrac{2r^{n-1}}{1+\sqrt r}=\dfrac{4}{\sqrt5+1}r^{n-1}=(\sqrt5-1)r^{n-1}$이다.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        $x_1=0$이므로 $x_{n+1}=\sum_{i=1}^{n}(-1)^{i-1}\overline{X_iX_{i+1}}=\sum_{i=1}^{n}(\sqrt5-1)(-r)^{i-1}$이다. $\lvert-r\rvert<1$이므로(제시문 [마])
        $$\lim_{n\to\infty}x_n=\dfrac{\sqrt5-1}{1-(-r)}=\dfrac{\sqrt5-1}{1+\frac{3-\sqrt5}{2}}=\dfrac{2(\sqrt5-1)}{5-\sqrt5}=\dfrac{2}{\sqrt5}=\dfrac{2\sqrt5}{5}$$
        이다.
      criteria: [2.B2]
