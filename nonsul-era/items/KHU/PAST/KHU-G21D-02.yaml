    [판독확인] 예시답안 p.13 '$x_{n+1}=\sum_{i=1}^{n}(-1)^{n-1}\overline{X_nX_{n+1}}=\sum_{i=1}^{n}(\sqrt5-1)(-r)^{n-1}$'은 합의 첨자 오기($n$ 대신 $i$) — B 해설에서 $\sum_{i=1}^{n}(-1)^{i-1}\overline{X_iX_{i+1}}=\sum_{i=1}^{n}(\sqrt5-1)(-r)^{i-1}$로 바로잡음(극한값은 같음).
