intent: 직선에 접하며 서로 외접하는 세 원의 관계를 피타고라스 정리로 구해 일반식을 얻고, 이를 반복 적용해 반지름이 등비수열을 이룸을 보인 뒤, 중심이 좌우로 번갈아 놓이는 것을 반영한 등비급수로 중심의 극한 위치를 구하는 능력을 본다.
key_idea: '접점 사이 거리 $\overline{XY}=2\sqrt{xy}$에서 $2\sqrt{xy}=2\sqrt{xz}+2\sqrt{yz}$, $z=\dfrac{xy}{(\sqrt x+\sqrt y)^2}$. (2)는 $r=\dfrac{(\sqrt5-1)^2}{4}$이면 $\sqrt r=\dfrac{1}{1+\sqrt r}$이라 $a_3=r^2$이고 닮음으로 $a_n=r^{n-1}$, $x_{n+1}=x_n+(-1)^{n-1}(\sqrt5-1)r^{n-1}$.'
stuck: (2)에서 $a_3=r^2$을 확인한 뒤 닮음비 $r$로 일반화하는 단계, 새 원이 직전 원의 왼쪽·오른쪽에 번갈아 놓여 공비가 $-r$이 되는 것을 보는 단계
