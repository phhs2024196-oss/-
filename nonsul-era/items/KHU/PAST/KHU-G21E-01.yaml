stimuli:
- label: 가
  body: |
    두 수열 $\{a_n\}$과 $\{b_n\}$이 수렴하고 $\lim\limits_{n\to\infty}a_n=\alpha$, $\lim\limits_{n\to\infty}b_n=\beta$ ($\alpha,\beta$는 실수)일 때,
    (1) 모든 자연수 $n$에 대하여 $a_n\le b_n$이면 $\alpha\le\beta$이다.
    (2) 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $\alpha=\beta$이면, 수열 $\{c_n\}$은 수렴하고 $\lim\limits_{n\to\infty}c_n=\alpha$이다.
- label: 나
  body: |
    좌표평면 위의 두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$ 사이의 거리는
    $$\overline{\mathrm{AB}}=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$$
- label: 다
  body: |
    점 $(x_1,y_1)$과 직선 $ax+by+c=0$ 사이의 거리 $d$는
    $$d=\dfrac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$$
- label: 라
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b\lvert f(x)\rvert dx$$
- label: 마
  body: |
    닫힌구간 $[a,b]$에서 $x$좌표가 $x$인 점을 지나고 $x$축에 수직인 평면으로 자른 단면의 넓이가 $S(x)$인 입체도형의 부피 $V$는
    $$V=\int_a^b S(x)dx$$
- label: 바
  body: |
    두 함수 $f(x)$와 $g(x)$가 미분가능하고, $f'(x)$와 $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^b f(x)g'(x)dx=\left[f(x)g(x)\right]_a^b-\int_a^b f'(x)g(x)dx$$

stem: |
  [논제 I] 제시문 [가]~[바]를 읽고 다음 질문에 답하시오.
  [논제 I-1]
  [그림 1 설명: 좌표평면에 꼭짓점 A(0,1), B(1,0), C(0,-1), D(-1,0)인 마름모가 있고, 원점 O를 둘러싼 회색 도형(네 꼭짓점이 각각 두 좌표축 위에 있고 변이 원점 쪽으로 오목하게 휜 곡선인 도형)이 마름모 안에 그려져 있다.]
  [그림 1]과 같이 좌표평면 위에 네 점 A(0,1)A(0,1), B(1,0), C(0,−1), D(−1,0)을 꼭짓점으로 하는 마름모가 있다. 이 마름모 내부의 점들 중에서, 그 점과 원점 O 사이의 거리가 그 점과 가장 가까운 마름모의 변까지 거리의 $\sqrt2$배가 되는 점들이 나타내는 곡선으로 둘러싸인 도형을 R이라 하자.

subparts:
- id: '1'
  stem: |
    (1) R의 넓이를 구하고, 그 근거를 논술하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: value, value: '2(1-\ln2)', equivalents: ['2-2\ln2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 제1사분면에서 $\sqrt{x^2+y^2}=\sqrt2\cdot\dfrac{\lvert x+y-1\rvert}{\sqrt2}$를 정리하면 $y=\dfrac{1}{2(x-1)}+1$.
    steps:
    - {id: 1a, content: '$4\displaystyle\int_0^{\frac12}\left(\dfrac{1}{2(x-1)}+1\right)dx=2(1-\ln2)$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 대칭성을 이용해 한 사분면만 보자.
    - 삼각형 OAB 안의 점에서 가장 가까운 변은 어느 것인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 7 2021학년도 논술고사 기출문제(의학계)_1207 오후.pdf 예시답안 p.9
    steps:
    - id: 1b-1
      content: |
        세 점 $O(0,0)$, $A(0,1)$, $B(1,0)$을 꼭짓점으로 하는 삼각형을 생각하자. 한 점 P가 삼각형 OAB 내부에 있으면 P에서 선분 AB까지 거리는 다른 세 변들까지의 거리보다 짧거나 같다. 삼각형 내부의 점들 중 원점까지 거리가 선분 AB까지 거리의 $\sqrt2$배가 되는 점들의 집합을 S라고 하고 곡선 S와 $x$축, $y$축으로 둘러싸인 도형을 T라고 하자. 그러면 T는 도형 R이 1사분면에 속하는 부분이 된다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        삼각형 OAB의 내부의 한 점 $(x,y)$에서 원점까지 거리와 그 점에서 선분 AB까지 거리는 각각 $\sqrt{x^2+y^2}$, $\dfrac{\lvert x+y-1\rvert}{\sqrt2}$이므로(제시문 [나], [다]) S는 $\sqrt{x^2+y^2}=\lvert x+y-1\rvert$를 만족하는 점들의 집합이다. 양변을 제곱하면 $x^2+y^2=x^2+y^2+2xy-2x-2y+1$이고, 정리하면 $2xy-2x-2y+1=0$을 얻는다. $x\neq1$이므로 위 식을 $y$에 관하여 정리하면 $y=\dfrac{1}{2(x-1)}+1$을 얻는다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        따라서 T는 유리함수의 그래프 $y=\dfrac{1}{2(x-1)}+1$과 $x$축, $y$축으로 둘러싸인 도형이고, 그 넓이는(제시문 [라])
        $$\int_0^{\frac12}\left(\dfrac{1}{2(x-1)}+1\right)dx=\left[\dfrac12\ln\lvert x-1\rvert+x\right]_0^{\frac12}=\dfrac12(1-\ln2)$$
        이다. 구하고자 하는 R의 넓이는 T의 넓이의 4배이므로 $2(1-\ln2)$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: R이 좌표축들에 대해 대칭이므로 제1사분면만 고려해도 충분함을 관찰하고, 곡선 S가 만족하는 식 $y=\dfrac{1}{2(x-1)}+1$을 찾았다.
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: R의 넓이를 적분 $4\int_0^{\frac12}\left(\dfrac{1}{2(x-1)}+1\right)dx$로 표현하고 적분값 $2(1-\ln2)$를 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6818}
  misconceptions:
  - id: MC-GEO-6818
    outcome_code: '70'
    wrong_work: '$\lvert x+y-1\rvert$를 $x+y-1$로 벗기거나 $\sqrt2$배 조건을 거리 식 분모와 상쇄하지 않아 $x^2+y^2=\dfrac{(x+y-1)^2}{2}$ 등을 씀'
    detect_cue: 곡선 식이 $y=\dfrac{1}{2(x-1)}+1$과 다르거나 원·타원 꼴이 나옴
    feedback: 원점까지 거리 $=\sqrt2\times\dfrac{\lvert x+y-1\rvert}{\sqrt2}$이므로 $\sqrt{x^2+y^2}=\lvert x+y-1\rvert$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    (2) R을 밑면으로 하고, $x$축에 수직인 평면으로 자른 단면이 반원이 되는 입체도형이 있다. 이 입체도형의 부피를 구하고, 그 근거를 논술하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '\pi\left(\dfrac34-\ln2\right)', equivalents: ['\dfrac{3\pi}{4}-\pi\ln2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 단면은 지름 $2y$인 반원이므로 넓이 $\dfrac{\pi}{2}y^2$, $y$축 대칭으로 2배.
    steps:
    - {id: 2a, content: '$2\displaystyle\int_0^{\frac12}\dfrac{\pi}{2}\left(\dfrac{1}{2(x-1)}+1\right)^2dx=\pi\left(\dfrac34-\ln2\right)$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - $x$를 고정했을 때 R의 단면(선분)의 길이는?
    - 그 선분을 지름으로 하는 반원의 넓이를 쓰자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 7 2021학년도 논술고사 기출문제(의학계)_1207 오후.pdf 예시답안 p.10
    steps:
    - id: 2b-1
      content: |
        $x$가 0보다 크고 $\dfrac12$보다 작을 때, $x$를 지나고 $y$축과 나란한 직선이 S와 만나는 점의 $y$좌표가 $y=\dfrac{1}{2(x-1)}+1$이다. 따라서 문제의 입체도형을 $x$축에 수직인 평면으로 잘랐을 때 그 단면의 넓이는 $\dfrac{\pi}{2}\left(\dfrac{1}{2(x-1)}+1\right)^2$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        R이 $y$축에 대하여 대칭이므로, 구하는 입체의 부피는(제시문 [마])
        $$2\int_0^{\frac12}\dfrac{\pi}{2}\left(\dfrac{1}{2(x-1)}+1\right)^2dx=\pi\left[-\dfrac14\cdot\dfrac{1}{x-1}+\ln\lvert x-1\rvert+x\right]_0^{\frac12}=\pi\left(\dfrac34-\ln2\right)$$
        이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 단면의 넓이가 $\dfrac{\pi}{2}\left(\dfrac{1}{2(x-1)}+1\right)^2$이 됨을 관찰했다.
      depends_on: []
      ft: {from: [1.M1], max_points: 5}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: 부피를 정적분으로 나타내 $\pi\left(\dfrac34-\ln2\right)$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6819}
  misconceptions:
  - id: MC-CAL-6819
    outcome_code: '70'
    wrong_work: '단면 반원의 반지름을 $2y$로 두어 넓이 $2\pi y^2$로 계산하거나 대칭 2배를 빠뜨림'
    detect_cue: 답이 $\pi\left(\dfrac34-\ln2\right)$의 4배 또는 $\dfrac12$배
    feedback: $x$에서 R의 단면은 길이 $2y$인 선분이고, 이것이 반원의 지름입니다. 반원 넓이는 $\dfrac{\pi}{2}y^2$입니다.
    remedy: [RL-2]

