intent: 정적분으로 정의된 수열의 절댓값을 음이 아닌 함수의 적분으로 위에서 누르고 극한의 대소 관계로 극한을 구하며, 부분적분을 두 번 적용해 $a_n$의 점화식을 세워 $a_1$~$a_4$를 구하는 능력을 본다.
key_idea: '$0\le x(k-x)\le\dfrac{k^2}{4}\le1$이므로 $0\le\lvert a_n\rvert\le\dfrac{e^k-1}{n!}$. $u_n=\dfrac{x^n(x-k)^n}{n!}$이면 $u_n(0)=u_n(k)=u_n''(0)=u_n''(k)=0$이라 $a_n=\int_0^ku_n''''e^xdx$, $u_n''''=(4n-2)u_{n-1}+k^2u_{n-2}$.'
stuck: (2)에서 $u_n''$을 $(2x-k)^2=4x(x-k)+k^2$로 바꾸어 $u_{n-1}$, $u_{n-2}$로 나타내는 단계
idea_tags: [IDEA-INTEGRAL-BOUND-SQUEEZE, IDEA-PARTS-TWICE-RECURRENCE]
tags: [정적분으로 정의된 수열, 부분적분 점화식, 경희 실전]
elements:
  materials: [실수 k(0≤k≤2)와 자연수 n에 대한 수열 a_n=∫_0^k x^n(x-k)^n/n!·e^x dx]
  concepts: [수열의 극한의 대소 관계, 정적분과 넓이(음이 아닌 함수의 적분), 이차함수의 최댓값, 부분적분법, 귀납적으로 정의된 수열]
  tools:
  - (x-k)^n=(-1)^n(k-x)^n으로 절댓값 처리
  - x(k-x)≤k^2/4≤1 로 피적분함수 상한
  - 샌드위치 정리
  - 부분적분 두 번(경계항 0)
  - '$u_n''''$ 정리로 점화식 $a_n=(4n-2)a_{n-1}+k^2a_{n-2}$'
  conditions:
  - '$0\le k\le2$ ⇒ $\dfrac{k^2}{4}\le1$, $e^k-1\le e^2-1\le8$'
  - '$n\ge2$이면 $u_n(0)=u_n(k)=0$, $u_n''(0)=u_n''(k)=0$ ⇒ 부분적분 경계항 0'
  stimuli_used: [가, 라, 바]
  subpart_links: null

