stimuli:
- label: 가
  body: |
    두 수열 $\{a_n\}$과 $\{b_n\}$이 수렴하고 $\lim\limits_{n\to\infty}a_n=\alpha$, $\lim\limits_{n\to\infty}b_n=\beta$ ($\alpha,\beta$는 실수)일 때,
    (1) 모든 자연수 $n$에 대하여 $a_n\le b_n$이면 $\alpha\le\beta$이다.
    (2) 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $\alpha=\beta$이면, 수열 $\{c_n\}$은 수렴하고 $\lim\limits_{n\to\infty}c_n=\alpha$이다.
- label: 나
  body: |
    좌표평면 위의 두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$ 사이의 거리는
    $$\overline{\mathrm{AB}}=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$$
- label: 다
  body: |
    점 $(x_1,y_1)$과 직선 $ax+by+c=0$ 사이의 거리 $d$는
    $$d=\dfrac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$$
- label: 라
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b\lvert f(x)\rvert dx$$
- label: 마
  body: |
    닫힌구간 $[a,b]$에서 $x$좌표가 $x$인 점을 지나고 $x$축에 수직인 평면으로 자른 단면의 넓이가 $S(x)$인 입체도형의 부피 $V$는
    $$V=\int_a^b S(x)dx$$
- label: 바
  body: |
    두 함수 $f(x)$와 $g(x)$가 미분가능하고, $f'(x)$와 $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^b f(x)g'(x)dx=\left[f(x)g(x)\right]_a^b-\int_a^b f'(x)g(x)dx$$

stem: |
  [논제 I] 제시문 [가]~[바]를 읽고 다음 질문에 답하시오.
  [논제 I-2] 실수 $k\ (0\le k\le2)$와 자연수 $n$에 대하여 아래와 같은 수열 $\{a_n\}$이 있다.
  $$a_n=\int_0^k\dfrac{x^n(x-k)^n}{n!}e^xdx$$
  (단, $n!=n(n-1)(n-2)\times\cdots\times3\times2\times1$)

subparts:
- id: '1'
  stem: |
    (1) 극한 $\lim\limits_{n\to\infty}\lvert a_n\rvert$을 구하고, 그 근거를 논술하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\lvert a_n\rvert=\int_0^k\dfrac{x^n(k-x)^n}{n!}e^xdx$이고 $x^n(k-x)^n\le1$이므로 $\lvert a_n\rvert\le\dfrac{e^k-1}{n!}\to0$.
    steps:
    - {id: 1a, content: '$0\le\lvert a_n\rvert\le\dfrac{8}{n!}$, 제시문 [가]로 $\lim\lvert a_n\rvert=0$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $[0,k]$에서 $(x-k)^n$의 부호를 정리하자.
    - $x(k-x)$의 최댓값은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 7 2021학년도 논술고사 기출문제(의학계)_1207 오후.pdf 예시답안 p.10
    steps:
    - id: 1b-1
      content: |
        구간 $[0,k]$에 속하는 $x$에 대하여 $(x-k)^n=(-1)^n(k-x)^n$이므로
        $\lvert a_n\rvert=\left\lvert(-1)^n\int_0^k\dfrac{x^n(k-x)^n}{n!}e^xdx\right\rvert=\int_0^k\dfrac{x^n(k-x)^n}{n!}e^xdx$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이차함수 $y=x(k-x)$는 최댓값 $\dfrac{k^2}{4}$을 가지므로 $(x(k-x))^n\le\left(\dfrac{k^2}{4}\right)^n\le1$이다. 따라서 구간 $[0,k]$에 속하는 모든 $x$에 대해 $\left(1-x^n(k-x)^n\right)\dfrac{e^x}{n!}=\left(\dfrac{1}{n!}\right)e^x-\dfrac{x^n(k-x)^n}{n!}e^x$은 0보다 크거나 같다. 그러므로 이 함수를 구간 $[0,k]$에서 적분하면 그 값이 0보다 크거나 같다(제시문 [라]).
        이제 $\displaystyle\int_0^k\left(\dfrac{1}{n!}e^x-\dfrac{x^n(k-x)^n}{n!}e^x\right)dx=\dfrac{1}{n!}(e^k-1)-\lvert a_n\rvert$이므로 $0\le\lvert a_n\rvert\le\dfrac{1}{n!}(e^k-1)$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $0\le k\le2$이고 $e^2-1\le8$이므로 $\lim\limits_{n\to\infty}\dfrac{1}{n!}(e^k-1)\le\lim\limits_{n\to\infty}\dfrac{8}{n!}=0$이다. 그러므로 제시문 [가]에 의해 $\lim\limits_{n\to\infty}\lvert a_n\rvert=0$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: $\lvert a_n\rvert=\int_0^k\dfrac{x^n(k-x)^n}{n!}e^xdx$가 됨을 관찰하고, $\left(\dfrac{1}{n!}\right)e^x-\dfrac{x^n(k-x)^n}{n!}e^x\ge0$임을 보였다.
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 극한의 대소 관계를 비교하여 $\lim\limits_{n\to\infty}\lvert a_n\rvert=0$을 도출했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6820}
  misconceptions:
  - id: MC-CAL-6820
    outcome_code: '70'
    wrong_work: '$\dfrac{1}{n!}\to0$이므로 $a_n\to0$이라고만 쓰고 피적분함수의 크기($x^n(k-x)^n\le1$)를 평가하지 않음'
    detect_cue: 위에서 누르는 부등식 $\lvert a_n\rvert\le\dfrac{C}{n!}$의 근거가 없음
    feedback: $x^n(x-k)^n$도 $n$에 따라 변하므로, $[0,k]$에서 $x(k-x)\le\dfrac{k^2}{4}\le1$로 상한을 정한 뒤 대소 관계를 쓰세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    (2) $a_1$, $a_2$, $a_3$, $a_4$를 구하고, 그 근거를 논술하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: expression, value: 'a_1=(2-k)e^k-(k+2),\ a_2=(k^2-6k+12)e^k-(k^2+6k+12),\ a_3=(-k^3+12k^2-60k+120)e^k-(k^3+12k^2+60k+120),\ a_4=(k^4-20k^3+180k^2-840k+1680)e^k-(k^4+20k^3+180k^2+840k+1680)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 부분적분을 두 번 적용하면 경계항이 사라져 $a_n=\int_0^ku_n''(x)e^xdx=(4n-2)a_{n-1}+k^2a_{n-2}$.
    steps:
    - {id: 2a, content: '$a_3=10a_2+k^2a_1$, $a_4=14a_3+k^2a_2$', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - $a_1$은 $x(x-k)$와 $e^x$의 부분적분이다.
    - $u_n=\dfrac{x^n(x-k)^n}{n!}$을 두 번 미분해 보자.
    - $(2x-k)^2=4x(x-k)+k^2$을 이용하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 7 2021학년도 논술고사 기출문제(의학계)_1207 오후.pdf 예시답안 p.10~11
    steps:
    - id: 2b-1
      content: |
        $a_1$에서 $f(x)=x(x-k)$, $g'(x)=e^x$로 놓으면 $f'(x)=2x-k$, $g(x)=e^x$이므로 부분적분법(제시문 [바])을 적용하면
        $a_1=\left[x(x-k)e^x\right]_0^k-\int_0^k(2x-k)e^xdx=-\int_0^k(2x-k)e^xdx$이다. 다시 부분적분법을 적용하면
        $a_1=\left[-(2x-k)e^x\right]_0^k+\int_0^k2e^xdx=(-k+2)e^k-(k+2)$를 얻는다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $a_2$에서 $f(x)=\dfrac{x^2(x-k)^2}{2}$, $g'(x)=e^x$로 놓으면 $a_2=-\int_0^k(2x-k)x(x-k)e^xdx$이고, 다시 부분적분법을 적용하면
        $a_2=\left[-(2x-k)x(x-k)e^x\right]_0^k+\int_0^k\left(2x(x-k)+(2x-k)^2\right)e^xdx=\int_0^k\left(6x(x-k)+k^2\right)e^xdx$
        $=6a_1+k^2(e^k-1)=(k^2-6k+12)e^k-(k^2+6k+12)$이다. (예시답안의 '$k^2(e-1)$'은 '$k^2(e^k-1)$'의 오기)
      criteria: [2.M1]
    - id: 2b-3
      content: |
        이제 3보다 크거나 같은 $n$에 대하여 $u_n(x)=\dfrac{x^n(x-k)^n}{n!}$이라고 하자. 미분하면 $u_n'(x)=(2x-k)\dfrac{x^{n-1}(x-k)^{n-1}}{(n-1)!}$이고, 한 번 더 미분하면
        $u_n''(x)=2\dfrac{x^{n-1}(x-k)^{n-1}}{(n-1)!}+(2x-k)^2\dfrac{x^{n-2}(x-k)^{n-2}}{(n-2)!}$이다.
        이때 $(2x-k)^2=4x(x-k)+k^2$이고 $(4x(x-k)+k^2)\dfrac{x^{n-2}(x-k)^{n-2}}{(n-2)!}=(4n-4)\dfrac{x^{n-1}(x-k)^{n-1}}{(n-1)!}+k^2\dfrac{x^{n-2}(x-k)^{n-2}}{(n-2)!}$이므로
        $u_n''(x)=(4n-2)\dfrac{x^{n-1}(x-k)^{n-1}}{(n-1)!}+k^2\dfrac{x^{n-2}(x-k)^{n-2}}{(n-2)!}$이다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        $a_n$에서 $f(x)=u_n(x)$, $g'(x)=e^x$로 놓고 부분적분법을 적용하면 $u_n(0)=u_n(k)=0$이므로 $a_n=\left[u_ne^x\right]_0^k-\int_0^ku_n'(x)e^xdx=-\int_0^ku_n'(x)e^xdx$이다. 이 식에서 $f(x)=u_n'(x)$로 놓고 부분적분법을 적용하면 $u_n'(0)=u_n'(k)=0$이므로
        $a_n=\left[-u_n'(x)e^x\right]_0^k+\int_0^ku_n''(x)e^xdx=\int_0^ku_n''(x)e^xdx$이다. 앞서 구한 $u_n''(x)$를 대입하면
        $$a_n=(4n-2)\int_0^ku_{n-1}(x)e^xdx+k^2\int_0^ku_{n-2}(x)e^xdx=(4n-2)a_{n-1}+k^2a_{n-2}\ \cdots\cdots①$$
        를 얻는다.
      criteria: [2.M2]
    - id: 2b-5
      content: |
        앞서 구한 $a_1$, $a_2$에 ①을 차례대로 적용하면
        $a_3=10a_2+k^2a_1=(-k^3+12k^2-60k+120)e^k-(k^3+12k^2+60k+120)$,
        $a_4=14a_3+k^2a_2=(k^4-20k^3+180k^2-840k+1680)e^k-(k^4+20k^3+180k^2+840k+1680)$을 얻는다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 부분적분법을 적용하여 $a_1=(2-k)e^k-(k+2)$, $a_2=(k^2-6k+12)e^k-(k^2+6k+12)$를 구했다.
      depends_on: []
      steps: [2b-1, 2b-2]
    - id: 2.M2
      mark_type: M
      points: 10
      evidence: 부분적분법을 적용하여 $a_n=(4n-2)a_{n-1}+k^2a_{n-2}$처럼 $a_n$을 $a_{n-1}$, $a_{n-2}$로 표현했다(경계항이 0인 근거 포함).
      depends_on: []
      steps: [2b-3, 2b-4]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: $a_1$, $a_2$와 점화식으로부터 $a_3$, $a_4$를 정확히 구했다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6821}
  misconceptions:
  - id: MC-CAL-6821
    outcome_code: '70'
    wrong_work: '$\int_0^ke^xdx$를 $e-1$로 계산해 $a_2=6a_1+k^2(e-1)$로 둠(공식 예시답안의 오기와 같은 실수)'
    detect_cue: $a_2$ 이후 식에 $e$가 $e^k$와 따로 등장함
