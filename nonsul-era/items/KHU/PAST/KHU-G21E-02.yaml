  note: |
    시험 = 2020.12.7.(월) 오후 실시 의학계. 문제 = 7 2021학년도 논술고사 기출문제(의학계)_1207 오후.pdf p.3, 원 번호 [논제 I-2] (1)(2), 해설 = 같은 파일 p.10~11(예시답안), p.17(채점 기준), p.20(출제 의도), p.22(문항 해설).
    [판독확인] 예시답안 p.10 (1)의 '$\left(1-\dfrac{x^n(k-x)^n}{n!}\right)\dfrac{e^x}{n!}=\left(\dfrac{1}{n!}\right)e^x-\dfrac{x^n(k-x)^n}{n!}e^x$'는 좌변의 $n!$ 위치가 맞지 않는 표기 — B 해설에서 $\left(1-x^n(k-x)^n\right)\dfrac{e^x}{n!}$로 바로잡음(결론 같음).
    [판독확인] 예시답안 p.11 '$a_2=6a_1+k^2(e-1)$'은 $k^2(e^k-1)$의 오기(최종식 $(k^2-6k+12)e^k-(k^2+6k+12)$은 맞음) — B 해설에서 바로잡음, sympy로 확인.
    예시답안은 점화식을 '3보다 크거나 같은 $n$'에 대해 세움(그대로 따름). 공식 답 $a_1$~$a_4$와 sympy 검산 일치.

