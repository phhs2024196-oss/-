stimuli:
- label: 나
  body: |
    $\displaystyle\lim_{n\to\infty}a_n=L$, $\displaystyle\lim_{n\to\infty}b_n=M$ ($L$, $M$은 실수)일 때, 모든 자연수 $n$에 대하여
    ① $a_n\le b_n$이면 $L\le M$
    ② $a_n\le c_n\le b_n$이고 $L=M$이면 $\displaystyle\lim_{n\to\infty}c_n=L$

stem: |
  [논제 III]
  점 $\mathrm{A}\left(a,\dfrac1a\right)\ (a>0)$을 지나고 기울기가 음수인 직선이 곡선 $y=\dfrac1x$과 접하지 않는다. 이 직선이 $y$축과 만나는 점을 P, $x$축과 만나는 점을 Q, 곡선 $y=\dfrac1x$과 만나는 점 중 A가 아닌 점을 B라 하고, 원점을 O라 하자.

subparts:
- id: '1'
  stem: |
    $\overline{\mathrm{AB}}=\dfrac12\overline{\mathrm{PQ}}$일 때, 삼각형 OPQ의 넓이 $S(a)$를 구하고, 그 근거를 논술하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: 'S(a)=\dfrac83', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 공통인수 $\dfrac{\sqrt{1+a^2b^2}}{ab}$가 약분되어 $|a-b|=\dfrac12(a+b)$, 즉 $b=\dfrac a3$ 또는 $3a$.
    steps:
    - {id: 1a, content: '$S=\dfrac{(a+b)^2}{2ab}$에 $b=3a$ 또는 $\dfrac a3$을 넣으면 $\dfrac83$', criteria: [1.M1, 1.A2]}
    hint_ladder:
    - 점 B를 $\left(b,\dfrac1b\right)$로 두고 직선의 방정식을 세우자.
    - 두 길이에 공통으로 들어가는 인수를 찾자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 4. 2022학년도 논술고사 기출문제(자연계)_11.20 오후.pdf 예시답안 p.11
    steps:
    - id: 1b-1
      content: |
        점 B의 좌표를 $\mathrm{B}\left(b,\dfrac1b\right)$라 하자. 점 A와 B를 지나는 직선의 방정식은 $y=-\dfrac{1}{ab}x+\dfrac1a+\dfrac1b$이다.
        따라서 점들의 좌표 $\mathrm{P}\left(0,\dfrac1a+\dfrac1b\right)$와 $\mathrm{Q}(a+b,0)$을 얻을 수 있다. 따라서
        $\overline{\mathrm{AB}}=\sqrt{(a-b)^2+\left(\dfrac1a-\dfrac1b\right)^2}=\dfrac{|a-b|}{ab}\sqrt{1+a^2b^2}$, $\overline{\mathrm{PQ}}=\sqrt{(a+b)^2+\left(\dfrac1a+\dfrac1b\right)^2}=\dfrac{a+b}{ab}\sqrt{1+a^2b^2}$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        점 B가 $\overline{\mathrm{AB}}=\dfrac12\overline{\mathrm{PQ}}$를 만족하는 경우, $|a-b|=\dfrac12(a+b)$를 얻는다. 이때, $a>b$이면 $b=\dfrac13a$이고, $a<b$이면 $b=3a$이다.
        삼각형 OPQ의 넓이는 $S(a)=\dfrac12\left(\dfrac1a+\dfrac1b\right)(a+b)=\dfrac{(a+b)^2}{2ab}$이므로, $a>b$인 경우와 $a<b$인 경우 모두 $S(a)=\dfrac83$을 얻는다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 직선 AB의 방정식 $y=-\dfrac{1}{ab}x+\dfrac1a+\dfrac1b$을 구하고 $\mathrm{P}\left(0,\dfrac1a+\dfrac1b\right)$, $\mathrm{Q}(a+b,0)$의 좌표를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: $|a-b|=\dfrac12(a+b)$에서 $b=\dfrac a3$ 또는 $3a$를 얻고 $S(a)=\dfrac{(a+b)^2}{2ab}=\dfrac83$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-6707}
  misconceptions:
  - id: MC-ALG-6707
    outcome_code: '70'
    wrong_work: '$a-b=\dfrac12(a+b)$만 풀어 $b=\dfrac a3$ 한 경우만 다룸'
    detect_cue: $b=3a$ 경우에 대한 언급이 없다
    feedback: '$|a-b|$는 $a>b$, $a<b$ 두 경우로 나누어야 합니다. 두 경우 모두 넓이가 같은지 확인하세요.'
    remedy: [RL-1]

- id: '2'
  stem: |
    $\overline{\mathrm{AB}}=1$일 때, 삼각형 OPQ의 넓이 $S(a)$에 대하여 $\displaystyle\lim_{a\to\infty}S(a)$와 $\displaystyle\lim_{a\to0}S(a)$의 값을 구하고, 그 근거를 논술하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: value, value: '\lim_{a\to\infty}S(a)=2,\ \lim_{a\to0}S(a)=2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\dfrac ba=1\mp\dfrac{b}{\sqrt{1+a^2b^2}}$이고 $0<\dfrac{b}{\sqrt{1+a^2b^2}}<\dfrac1a$이므로 $a\to\infty$에서 $\dfrac ba\to1$. $a\to0$은 $\dfrac ab=1\pm\dfrac{a}{\sqrt{1+a^2b^2}}$로 같은 방법.'
    steps:
    - {id: 2a, content: '$S=\dfrac{(1+b/a)^2}{2b/a}\to\dfrac{4}{2}=2$', criteria: [2.R1, 2.A3]}
    hint_ladder:
    - '$S=\dfrac{(a+b)^2}{2ab}$를 $\dfrac ba$만의 식으로 쓰자.'
    - '$\overline{\mathrm{AB}}=1$을 $\dfrac ba$에 대한 식으로 바꾸고, 남은 항을 부등식으로 묶자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 4. 2022학년도 논술고사 기출문제(자연계)_11.20 오후.pdf 예시답안 p.11~12
    steps:
    - id: 2b-1
      content: |
        점 B가 $\overline{\mathrm{AB}}=1$을 만족하는 경우, $|a-b|=\dfrac{ab}{\sqrt{1+a^2b^2}}$를 얻는다. 이때 $a>b$이면 $a=b+\dfrac{ab}{\sqrt{1+a^2b^2}}$이고, $a<b$이면 $b=a+\dfrac{ab}{\sqrt{1+a^2b^2}}$이므로, 이를 다시 쓰면
        $\dfrac ba=1-\dfrac{b}{\sqrt{1+a^2b^2}}\ (a>b)$, $\dfrac ba=1+\dfrac{b}{\sqrt{1+a^2b^2}}\ (a<b)$이다.
      criteria: [2.M2]
    - id: 2b-2
      content: |
        여기서 $0<\dfrac{ab}{\sqrt{1+a^2b^2}}<1$이므로 $0<\dfrac{b}{\sqrt{1+a^2b^2}}<\dfrac1a$이고, 제시문 [나]의 대소 관계에 의해 극한값 $\displaystyle\lim_{a\to\infty}\dfrac{b}{\sqrt{1+a^2b^2}}=0$을 얻는다. 따라서 극한값 $\displaystyle\lim_{a\to\infty}\dfrac ba=1$을 얻을 수 있고, 이를 이용하면
        $$\lim_{a\to\infty}S(a)=\lim_{a\to\infty}\dfrac{\left(1+\dfrac ba\right)^2}{2\dfrac ba}=2$$
      criteria: [2.R1, 2.A3]
    - id: 2b-3
      content: |
        위 식을 $\dfrac ab$에 대해서 정리하면 $\dfrac ab=1+\dfrac{a}{\sqrt{1+a^2b^2}}\ (a>b)$, $\dfrac ab=1-\dfrac{a}{\sqrt{1+a^2b^2}}\ (a<b)$이다.
        여기서 $0<\dfrac{1}{\sqrt{1+a^2b^2}}<1$이므로 $0<\dfrac{a}{\sqrt{1+a^2b^2}}<a$이고, 극한값 $\displaystyle\lim_{a\to0}\dfrac{a}{\sqrt{1+a^2b^2}}=0$을 얻는다. 따라서 극한값 $\displaystyle\lim_{a\to0}\dfrac ab=1$을 얻을 수 있고(공식 예시답안의 '$a\to\infty$'는 $a\to0$의 오기), 이를 이용하면
        $$\lim_{a\to0}S(a)=\lim_{a\to0}\dfrac{\left(1+\dfrac ab\right)^2}{2\dfrac ab}=2$$
      criteria: [2.R1, 2.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: '$0<\dfrac{b}{\sqrt{1+a^2b^2}}<\dfrac1a$, $0<\dfrac{a}{\sqrt{1+a^2b^2}}<a$ 같은 부등식과 극한의 대소 관계(제시문 [나])로 남은 항의 극한이 0임을 밝혔다.'
      depends_on: []
      steps: [2b-2, 2b-3]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: '$|a-b|=\dfrac{ab}{\sqrt{1+a^2b^2}}$를 얻고 $a>b$, $a<b$로 나누어 $\dfrac ba$(또는 $\dfrac ab$)에 대한 관계식으로 바꿨다.'
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A3
      mark_type: A
      points: 5
      evidence: '$\dfrac ba\to1$, $\dfrac ab\to1$을 이용해 $\displaystyle\lim_{a\to\infty}S(a)=2$, $\displaystyle\lim_{a\to0}S(a)=2$를 구했다.'
      depends_on: [2.M2, 2.R1]
      steps: [2b-2, 2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6708}
  - {code: '71', misconception: MC-ALG-6707}
  misconceptions:
  - id: MC-CAL-6708
    outcome_code: '70'
    wrong_work: '$b$를 고정된 상수로 보고 $S=\dfrac{(a+b)^2}{2ab}\to\infty$ 라고 결론'
    detect_cue: 답이 $\infty$ 또는 $\dfrac a{2b}$ 꼴의 극한
    feedback: '$\overline{\mathrm{AB}}=1$ 때문에 $b$는 $a$에 따라 정해집니다. $a$와 $b$의 관계식으로 비 $\dfrac ba$의 극한을 먼저 구하세요.'
    remedy: [RL-2]
  - id: MC-ALG-6707
    outcome_code: '71'
    wrong_work: '$a-b=\dfrac{ab}{\sqrt{1+a^2b^2}}$ 한 경우만 다룸'
    detect_cue: $a<b$ 경우에 대한 언급이 없다
    feedback: 점 B는 A의 양쪽에 하나씩 있을 수 있습니다. 두 경우 모두 극한이 같음을 보이세요.
    remedy: [RL-1]

