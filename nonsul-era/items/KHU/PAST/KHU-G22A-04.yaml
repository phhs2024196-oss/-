key_idea: '$f_1=r\cos t$, $g_1=r\sin t$, $f_2=r\cos(t+\theta)$, $g_2=r\sin(t+\theta)$로 두고 $\dfrac{g_1''}{f_1''}=$ 직선 $\mathrm{P_1P_2}$의 기울기에서 $\dfrac{r''}{r}=-\dfrac{1-\cos\theta}{\sin\theta}=-\alpha$.'
stuck: 대칭성(모든 점이 같은 반지름·같은 각 간격 유지)을 써서 $\mathrm{P_2}$를 $\mathrm{P_1}$의 회전으로 표현하고 기울기 조건을 $r$, $r'$의 식으로 바꾸는 단계
