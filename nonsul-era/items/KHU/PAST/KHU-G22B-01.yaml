stimuli:
- label: 가
  body: |
    좌표평면의 원점 O와 점 $\mathrm{P}(x,y)$에 대하여, 동경 OP가 나타내는 각의 크기를 $\theta$, $\overline{\mathrm{OP}}$를 $r$이라 하면
    $\sin\theta=\dfrac yr$, $\cos\theta=\dfrac xr$, $\tan\theta=\dfrac yx\ (x\ne0)$, $\csc\theta=\dfrac ry\ (y\ne0)$, $\sec\theta=\dfrac rx\ (x\ne0)$, $\cot\theta=\dfrac xy\ (y\ne0)$

stem: |
  [논제 I]
  $\overline{\mathrm{AB}}=\overline{\mathrm{AC}}$인 이등변삼각형 ABC의 내접원 $O$의 반지름을 1이라 하고 <그림 1>과 같이 두 변과 내접원 $O$에 모두 접하는 원을 각각 $P_1$, $Q_1$, $R_1$이라 하자. 자연수 $n$에 대하여 원 $P_{n+1}$은 원 $P_n$과 두 변 AB, AC에 접하고, 원 $P_{n+1}$의 반지름은 원 $P_n$의 반지름보다 작다. 원 $Q_{n+1}$은 원 $Q_n$과 두 변 AB, BC에 접하고, 원 $Q_{n+1}$의 반지름은 원 $Q_n$의 반지름보다 작다. 원 $R_{n+1}$은 원 $R_n$과 두 변 BC, AC에 접하고, 원 $R_{n+1}$의 반지름은 원 $R_n$의 반지름보다 작다. 각 B의 크기를 $\theta$라고 할 때, 다음 물음에 답하시오.
  [그림 1 설명: 꼭짓점 A가 위, 밑변 BC가 아래인 이등변삼각형. 가운데 내접원 $O$, 그 위(A 쪽)에 원 $P_1$과 더 작은 원, B 쪽 구석에 원 $Q_1$과 더 작은 원, C 쪽 구석에 원 $R_1$과 더 작은 원이 각각 두 변과 이웃 원에 접해 있음.]

subparts:
- id: '1'
  stem: |
    모든 원의 둘레의 합을 $f(\theta)=c_1\sec d_1\theta+c_2\csc d_2\theta+c_3$의 꼴로 나타내고, 그 근거를 논술하시오. (단, $c_1$, $c_2$, $c_3$, $d_1$, $d_2$는 실수이다.) (15점)
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'f(\theta)=\pi\sec\theta+2\pi\csc\dfrac{\theta}{2}-\pi', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 세 사슬 각각 내접원부터 시작하는 등비급수 $\dfrac{2\pi}{1-k}$를 더하고 중복된 내접원 둘레 $2\times2\pi$를 뺀다.
    steps:
    - {id: 1a, content: '$f=\dfrac{\pi(1+\cos\theta)}{\cos\theta}+\dfrac{2\pi(1+\sin\frac\theta2)}{\sin\frac\theta2}-4\pi$', criteria: [1.M1, 1.M2, 1.A3]}
    hint_ladder:
    - 원 $P_1$의 중심과 내접원의 중심은 모두 각 A의 이등분선 위에 있다.
    - 꼭짓점에서 중심까지의 거리를 반지름과 반각의 사인으로 나타내 보자.
    - 원의 사슬마다 반지름의 비가 일정하다면 등비급수이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 5. 2022학년도 논술고사 기출문제(자연계)_11.21 오전.pdf 예시답안 p.7
    steps:
    - id: 1b-1
      content: |
        각 B와 각 C의 크기를 $\theta$라 하면, 각 A의 크기는 $\pi-2\theta$이다.
        (보충) 꼭짓점 A에서 각의 이등분선 위의 두 중심까지 거리는 $\dfrac{1}{\sin(\frac\pi2-\theta)}$, $\dfrac{p_1}{\sin(\frac\pi2-\theta)}$이고 그 차가 $1+p_1$이므로
        원 $P_1$의 반지름 $p_1$은 $\dfrac{1-p_1}{1+p_1}=\sin\left(\dfrac\pi2-\theta\right)=\cos\theta$에서 $p_1=\dfrac{1-\cos\theta}{1+\cos\theta}$이므로, 일반적으로 원 $P_n$의 반지름 $p_n$은 공비가 $\dfrac{1-\cos\theta}{1+\cos\theta}$인 등비수열이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        마찬가지로 원 $Q_1$의 반지름 $q_1$은 $\sin\dfrac\theta2=\dfrac{1-q_1}{1+q_1}$에서 $q_1=\dfrac{1-\sin\frac\theta2}{1+\sin\frac\theta2}$이므로, 일반적으로 원 $Q_n$의 반지름 $q_n$은 공비가 $\dfrac{1-\sin\frac\theta2}{1+\sin\frac\theta2}$인 등비수열이다. 원 $R_n$의 반지름 $r_n$은 $q_n$과 같다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서, 모든 원의 둘레의 합은 내접원 $O$의 둘레를 첫째항으로 하는 등비급수의 합을 이용하여 계산하면
        $$f(\theta)=\dfrac{2\pi}{1-\frac{1-\cos\theta}{1+\cos\theta}}+2\cdot\dfrac{2\pi}{1-\frac{1-\sin\frac\theta2}{1+\sin\frac\theta2}}-4\pi=\dfrac{\pi(1+\cos\theta)}{\cos\theta}+\dfrac{2\pi\left(1+\sin\frac\theta2\right)}{\sin\frac\theta2}-4\pi$$
        $$=\pi\sec\theta+2\pi\csc\dfrac\theta2-\pi$$
        이다(제시문 [가]).
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: '$\dfrac{1-p_1}{1+p_1}=\cos\theta$에서 $p_1=\dfrac{1-\cos\theta}{1+\cos\theta}$를 구하고 원 $P_n$의 반지름(둘레)이 이 공비의 등비수열임을 밝혔다.'
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: '$\dfrac{1-q_1}{1+q_1}=\sin\dfrac\theta2$에서 원 $Q_n$(또는 $R_n$)의 반지름이 공비 $\dfrac{1-\sin\frac\theta2}{1+\sin\frac\theta2}$의 등비수열임을 밝혔다.'
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A3
      mark_type: A
      points: 5
      evidence: '내접원 중복을 빼고 등비급수를 합해 $f(\theta)=\pi\sec\theta+2\pi\csc\dfrac\theta2-\pi$ 꼴로 나타냈다.'
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-6711}
  - {code: '71', misconception: MC-CAL-6712}
  misconceptions:
  - id: MC-ALG-6711
    outcome_code: '70'
    wrong_work: '$\dfrac{1-q_1}{1+q_1}=\sin\theta$(전각) 또는 $\tan\dfrac\theta2$로 둠'
    detect_cue: 결과에 $\csc\theta$나 $\cot$이 나옴
    feedback: 원의 중심은 각의 이등분선 위에 있으므로 꼭짓점에서 중심까지 거리는 $\dfrac{r}{\sin(\text{반각})}$입니다.
    remedy: [RL-1]
  - id: MC-CAL-6712
    outcome_code: '71'
    wrong_work: '세 사슬의 등비급수 합 $\dfrac{2\pi}{1-k}$를 그대로 더해 내접원 둘레를 세 번 셈'
    detect_cue: 상수항이 $-\pi$가 아니라 $3\pi$ 또는 $+\pi$
    feedback: 세 급수 모두 첫째항이 내접원 $O$의 둘레입니다. 중복된 $2\times2\pi$를 빼세요.
    remedy: [RL-2]

- id: '2'
  stem: |
    삼각형 ABC의 세 변의 길이의 합 $g(\theta)$와 극한값 $\displaystyle\lim_{\theta\to0}\dfrac{f(\theta)}{g(\theta)}$, $\displaystyle\lim_{\theta\to\frac\pi2}\dfrac{f(\theta)}{g(\theta)}$를 구하시오. 그리고 그 근거를 논술하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: 'g(\theta)=2\tan\theta+4\cot\dfrac\theta2,\ \lim_{\theta\to0}\dfrac{f}{g}=\dfrac\pi2,\ \lim_{\theta\to\frac\pi2}\dfrac fg=\dfrac\pi2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 꼭짓점에서 접점까지 길이는 $\cot(\text{반각})$. $\theta\to0$은 분자·분모에 $\sin\dfrac\theta2$를, $\theta\to\dfrac\pi2$는 $\cos\theta$를 곱한다.
    steps:
    - {id: 2a, content: '$g=2\tan\theta+4\cot\dfrac\theta2$, 두 극한 모두 $\dfrac\pi2$', criteria: [2.M1, 2.A2]}
    hint_ladder:
    - 내접원의 중심에서 각 변에 수선을 내리면 꼭짓점에서 접점까지의 길이가 보인다.
    - 발산하는 항을 없애도록 분자·분모에 같은 식을 곱하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 5. 2022학년도 논술고사 기출문제(자연계)_11.21 오전.pdf 예시답안 p.7
    steps:
    - id: 2b-1
      content: |
        삼각형의 세 변의 길이의 합은 내접원의 중심에서 각 변에 수선의 발을 내려, 꼭짓점에서 그 수선의 발까지의 거리의 합을 이용하여 계산할 수 있다.
        (보충) 꼭짓점 A에서 접점까지 $\cot\left(\dfrac\pi2-\theta\right)=\tan\theta$가 2개, B·C에서 접점까지 $\cot\dfrac\theta2$가 4개이므로 $g(\theta)=2\tan\theta+4\cot\dfrac\theta2$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $\dfrac{f(\theta)}{g(\theta)}=\dfrac{\pi\sec\theta+2\pi\csc\frac\theta2-\pi}{2\tan\theta+4\cot\frac\theta2}=\dfrac{\pi\sin\frac\theta2\sec\theta+2\pi-\pi\sin\frac\theta2}{2\sin\frac\theta2\tan\theta+4\cos\frac\theta2}$이고, $\theta\to0$이면 $\to\dfrac{0+2\pi-0}{0+4}=\dfrac\pi2$이므로 $\displaystyle\lim_{\theta\to0}\dfrac{f(\theta)}{g(\theta)}=\dfrac\pi2$이다.
        또한, $\dfrac{f(\theta)}{g(\theta)}=\dfrac{\pi+2\pi\cos\theta\csc\frac\theta2-\pi\cos\theta}{2\sin\theta+4\cos\theta\cot\frac\theta2}$이고, $\theta\to\dfrac\pi2$이면 $\to\dfrac{\pi+0-0}{2+0}=\dfrac\pi2$이므로 $\displaystyle\lim_{\theta\to\frac\pi2}\dfrac{f(\theta)}{g(\theta)}=\dfrac\pi2$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: '삼각형 세 변의 길이의 합을 $g(\theta)=2\tan\theta+4\cot\dfrac\theta2$로 $\theta$에 대해 표현했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: '분자·분모에 $\sin\dfrac\theta2$(또는 $\cos\theta$)를 곱해 정리하고 두 극한값 $\dfrac\pi2$, $\dfrac\pi2$를 계산했다.'
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A3], max_points: 5}
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-6713}
  misconceptions:
  - id: MC-ALG-6713
    outcome_code: '70'
    wrong_work: '꼭짓점 A에서 접점까지 길이를 $\cot\theta$ 또는 $\cot(\pi-2\theta)$로 둠'
    detect_cue: $g(\theta)$에 $\tan\theta$ 대신 $\cot\theta$ 항이 있음
    feedback: 접선 길이는 $r\cot(\text{반각})$입니다. 각 A의 반각은 $\dfrac\pi2-\theta$이므로 $\cot\left(\dfrac\pi2-\theta\right)=\tan\theta$입니다.
    remedy: [RL-3]

