    예시답안 p.17 의 도함수 중간식 $\dfrac{(p+aq-a)(-2p^2+ap-a^2q+a^2)}{2ap^2q^3}$과 최종식 $\dfrac{(p-a)(q-1)(aq-p)}{p^2q^3}$은 모두 sympy로 원래 도함수와 같음을 확인(수치 대조).
    예시답안은 $p=\dfrac{a}{\sqrt2}$ 좌우 부호 변화만 언급 — 최대 판정은 그 흐름 그대로.

