intent: 타원의 접선의 방정식으로 두 교점의 좌표를 구해 직각삼각형의 넓이를 접점 좌표로 나타내고, 접점이 타원 위에 있다는 조건(음함수 미분)을 써서 넓이를 미분해 최댓값을 구하는 능력을 본다.
key_idea: '$S=\dfrac{(p+aq-a)^2}{2pq}$를 $p$로 미분할 때 $\dfrac{dq}{dp}=-\dfrac{p}{a^2q}$를 쓰면 $\dfrac{dS}{dp}=\dfrac{(p-a)(q-1)(aq-p)}{p^2q^3}$이고, 부호를 바꾸는 인수는 $aq-p$뿐이다.'
stuck: 넓이를 미분할 때 $q$를 $p$의 함수로 보고 $\dfrac{dq}{dp}$를 넣어 인수분해하는 단계
idea_tags: [IDEA-ELLIPSE-TANGENT-INTERCEPTS, IDEA-IMPLICIT-DIFF-CONSTRAINED-MAX]
tags: [타원의 접선, 삼각형 넓이의 최대, 음함수 미분, 경희 실전]
elements:
  materials: [타원 x^2/a^2+y^2=1, 제1사분면의 접점 (p,q), 직선 x=a 와의 교점 A, 직선 y=1 과의 교점 B, 점 C(a,1), 직각삼각형 ABC]
  concepts: [타원의 접선의 방정식, 직각삼각형의 넓이, 음함수의 미분법, 몫의 미분법, 극대와 최대]
  tools: [접선 px/a^2+qy=1 에 x=a, y=1 대입, AC·BC 로 넓이, dq/dp=-p/(a^2q) 대입 후 인수분해, 부호 변화로 최대 판정]
  conditions:
  - '접점이 제1사분면 ⇒ $0<p<a$, $0<q<1$'
  - '$\dfrac{p^2}{a^2}+q^2=1$ ⇒ $\dfrac{dq}{dp}=-\dfrac{p}{a^2q}$'
  - '$aq=p$ ⇔ $p=\dfrac{a}{\sqrt2}$, $q=\dfrac{1}{\sqrt2}$'
  stimuli_used: [다, 사]
  subpart_links: (2)는 (1)에서 구한 $S=\dfrac{(p+aq-a)^2}{2pq}$를 미분

