key_idea: '두 장의 통과 비율 $q_1,q_2$를 한 장으로 보면 $\dfrac{1}{r}=\dfrac1{q_1}+\dfrac1{q_2}-1$. $q_1=\dfrac23$이면 $\dfrac1{r_n}=\dfrac12+\dfrac1{r_{n-1}}$.'
