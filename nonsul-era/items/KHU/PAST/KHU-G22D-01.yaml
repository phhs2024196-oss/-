stimuli:
- label: 가
  body: |
    등비급수 $\displaystyle\sum_{n=1}^{\infty}ar^{n-1}=a+ar+ar^2+\cdots+ar^{n-1}+\cdots\ (a\ne0)$은 $|r|<1$일 때, 수렴하고 그 합은 $\dfrac{a}{1-r}$이다.

stem: |
  [논제 I-1] 들어오는 빛의 양 $a$ 중에서 $ra$만 통과시키고 나머지는 모두 반사시키는 유리창이 있다. (단, $0<r<1$이고, 다른 조건은 고려하지 않는다.)
  [그림 1 설명: 왼쪽에서 화살표 4개로 표시된 빛의 양 $a$가 나란히 선 두 장의 유리창으로 들어가고, 오른쪽으로 화살표 4개로 표시된 빛의 양 $\dfrac12a$가 나옴.]

subparts:
- id: '1'
  stem: |
    <그림 1>과 같이 빛의 양 $a$가 이러한 유리창 두 장을 통과하여 $\dfrac12a$가 되었다. 이때, 유리창 한 장이 빛을 통과시키는 비율 $r$의 값을 구하고, 그 근거를 논술하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: 'r=\dfrac23', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 창 사이를 왕복할 때마다 $(1-r)^2$배 — B로 나가는 양은 $\dfrac{r^2a}{1-(1-r)^2}=\dfrac{ra}{2-r}$.
    steps:
    - {id: 1a, content: '$\dfrac{r}{2-r}=\dfrac12\Rightarrow r=\dfrac23$', criteria: [1.M1, 1.A2]}
    hint_ladder:
    - 유리창 2에서 반사된 빛은 다시 유리창 1에서 반사되어 돌아온다.
    - 오른쪽으로 나가는 양들이 이루는 수열을 찾자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 6. 2022학년도 논술고사 기출문제(의학계)_11.20 오후.pdf 예시답안 p.11~12
    steps:
    - id: 1b-1
      content: |
        유리창 1로 빛이 들어오는 구역을 A, 유리창 2에서 빛이 통과하여 나가는 구역을 B라 두자. 유리창 1로 들어오는 빛의 양 $a$는 $(1-r)a$는 A로 반사되고, $ra$는 유리창 1을 통과한다. 유리창 2에 $ra$가 들어가면 $(1-r)ra$는 반사되고, $r^2a$는 통과하여 B쪽으로 간다.
        유리창 2에서 반사된 $(1-r)ra$는 다시 유리창 1로 들어가고, $(1-r)r^2a$는 유리창 1을 통과하여 A쪽으로 가고, $(1-r)^2ra$는 반사된다. 반사된 $(1-r)^2ra$는 다시 유리창 2로 들어가고, $(1-r)^2r^2a$는 유리창 2를 통과하여 B쪽으로 가고, $(1-r)^3ra$는 반사된다.
        이 과정을 계속 반복하면, 유리창 2를 통과한 빛의 양은 첫째항이 $r^2a$이고 공비가 $(1-r)^2$인 등비급수의 합이 된다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $0<(1-r)^2<1$이므로 제시문 [가]에 의해 B에서 빛의 양 $S$는 $S=\dfrac{r^2a}{1-(1-r)^2}$이고 $S=\dfrac12a$를 풀면($\dfrac{r}{2-r}=\dfrac12$), $r=\dfrac23$이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 반사·투과 과정을 추적해 B로 나가는 빛의 양이 첫째항 $r^2a$, 공비 $(1-r)^2$인 등비급수임을 찾았다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: '$\dfrac{r^2a}{1-(1-r)^2}=\dfrac12a$를 풀어 조건에 맞는 $r=\dfrac23$을 구했다.'
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6723}
  misconceptions:
  - id: MC-CAL-6723
    outcome_code: '70'
    wrong_work: '두 장을 한 번씩만 통과한다고 보고 $r^2=\dfrac12$, $r=\dfrac{1}{\sqrt2}$'
    detect_cue: 답이 $\dfrac{\sqrt2}{2}$
    feedback: 반사된 빛도 창 사이를 오가며 일부가 다시 통과합니다. 통과량을 모두 더한 등비급수를 세우세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    빛의 양 $a$가 이러한 유리창 $n$장을 통과하여 $p_n$이 되었다. $p_n$을 구하고, 그 근거를 논술하시오. (20점)
  points: 20
  depends_on: ['1']
  answer: {kind: expression, value: 'p_n=\dfrac{2}{n+2}a', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '두 장 합성 $\dfrac1r=\dfrac1{q_1}+\dfrac1{q_2}-1$, 첫 장 $q_1=\dfrac23$과 나머지 $n-1$장 $r_{n-1}$을 합치면 $\dfrac1{r_n}=\dfrac1{r_{n-1}}+\dfrac12$.'
    steps:
    - {id: 2a, content: '$\dfrac1{r_n}=\dfrac32+\dfrac{n-1}{2}=\dfrac{n+2}{2}$, $p_n=\dfrac{2a}{n+2}$', criteria: [2.M1, 2.M2, 2.A3]}
    hint_ladder:
    - 통과 비율이 $q_1$, $q_2$인 두 장을 한 장으로 보면 통과 비율은?
    - $n$장 = 첫 장 + (나머지 $n-1$장을 합친 한 장)으로 보자.
    - 역수를 취하면 어떤 수열이 되는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 6. 2022학년도 논술고사 기출문제(의학계)_11.20 오후.pdf 예시답안 p.12
    steps:
    - id: 2b-1
      content: |
        빛을 통과시키는 비율이 $q_1$, $q_2$인 유리창 2개가 있다고 하자. ([논제 I-1]에서와 같은 방법을 적용하여 빛의 양 $a$가 빛을 통과시키는 비율이 $q_1$, $q_2$인 유리창을 통과하여, B에 도달하는 양을 구할 수 있다.) 즉, B에 도달하는 빛의 양 $S$는 첫째항이 $q_1q_2a$, 공비가 $(1-q_1)(1-q_2)$인 등비급수의 합이 된다.
        $$S=\dfrac{q_1q_2}{1-(1-q_1)(1-q_2)}a=\dfrac{q_1q_2}{q_1+q_2-q_1q_2}a=\dfrac{1}{\frac1{q_1}+\frac1{q_2}-1}a$$
        즉, 빛을 통과시키는 비율이 $q_1$, $q_2$인 두 개의 유리창을 하나로 보았을 때, 이 유리창이 빛을 통과시키는 비율 $r$은 $r=\dfrac{1}{\frac1{q_1}+\frac1{q_2}-1}$이 된다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $n$개의 유리창이 있을 때, 첫 번째 유리창이 빛을 통과시키는 비율을 $q_1$이라 두고, 두 번째에서 $n$번째까지 $n-1$개의 유리창을 하나로 보고 빛을 통과시키는 비율을 $q_2$로 둘 수 있다. $q_1=\dfrac23$이고 $q_2=r_{n-1}$이므로($r_{n-1}$을 유리창 $n-1$개를 하나로 보았을 때 빛을 통과시키는 비율이라 하자.) 위에서 계산한 식에 $q_1$, $q_2$를 대입하여 $r_n$을 구하면
        $$r_n=\dfrac{1}{\frac32+\frac1{r_{n-1}}-1}=\dfrac{1}{\frac12+\frac1{r_{n-1}}}$$
        이다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        이 식을 이용하면, $\dfrac1{r_n}=\dfrac12+\dfrac1{r_{n-1}}$이고, $a_n=\dfrac1{r_n}$은 첫째항이 $a_1=\dfrac32$이고 공차가 $\dfrac12$인 등차수열이다. 즉, $a_n=\dfrac{n+2}{2}$이고 $r_n=\dfrac{2}{n+2}$이다.
        $r_n$은 $n$개의 유리창을 하나로 보았을 때 빛을 통과시키는 비율이므로, 빛의 양 $a$가 $n$개의 유리창을 통과한 후의 양 $p_n=r_na=\dfrac{2}{n+2}a$이다.
        (주의: 여기의 $a_n$은 보조 수열이며 빛의 양 $a$와 다름 — 예시답안 표기 그대로.)
      criteria: [2.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: '통과 비율이 $q_1$, $q_2$인 두 장을 한 장으로 보았을 때의 통과 비율 $\dfrac{1}{\frac1{q_1}+\frac1{q_2}-1}$을 등비급수로 구했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 6
      evidence: '$n$장을 첫 장과 나머지 $n-1$장(한 장으로 봄)으로 나누어 $r_n=\dfrac{1}{\frac12+\frac1{r_{n-1}}}$의 규칙을 구했다.'
      depends_on: [2.M1]
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 6}
      steps: [2b-2]
    - id: 2.A3
      mark_type: A
      points: 8
      evidence: '$\dfrac1{r_n}$이 첫째항 $\dfrac32$, 공차 $\dfrac12$인 등차수열임을 이용해 일반항을 구하고 $p_n=\dfrac{2}{n+2}a$를 답했다.'
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-6724}
  misconceptions:
  - id: MC-ALG-6724
    outcome_code: '70'
    wrong_work: '$n$장의 통과량을 $\left(\dfrac23\right)^na$ 또는 $\left(\dfrac12\right)^{n/2}a$처럼 곱으로 둠'
    detect_cue: 답이 지수 꼴($n$이 지수에 있음)
    feedback: 창 사이의 다중 반사 때문에 통과 비율은 단순히 곱해지지 않습니다. 두 장을 한 장으로 합치는 규칙을 먼저 구하세요.
    remedy: [RL-2]

