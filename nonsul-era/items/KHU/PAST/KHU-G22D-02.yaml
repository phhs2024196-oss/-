stimuli:
- label: 나
  body: |
    좌표평면의 원점 O와 점 $\mathrm{P}(x,y)$에 대하여, 동경 OP가 나타내는 각의 크기를 $\theta$, $\overline{\mathrm{OP}}$를 $r$이라 하면
    $\sin\theta=\dfrac yr$, $\cos\theta=\dfrac xr$, $\tan\theta=\dfrac yx\ (x\ne0)$, $\csc\theta=\dfrac ry\ (y\ne0)$, $\sec\theta=\dfrac rx\ (x\ne0)$, $\cot\theta=\dfrac xy\ (y\ne0)$
- label: 다
  body: |
    삼각함수의 덧셈정리
    $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$, $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$,
    $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$, $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$
- label: 라
  body: |
    매개변수 $t$로 나타낸 함수 $x=f(t)$, $y=g(t)$가 $t$에 대하여 미분가능하고 $f'(t)\ne0$이면 $\dfrac{dy}{dx}=\dfrac{\frac{dy}{dt}}{\frac{dx}{dt}}=\dfrac{g'(t)}{f'(t)}$이다.
- label: 마
  body: |
    좌표평면 위를 움직이는 점 $\mathrm{P}(x,y)$의 위치를 매개변수 $t$에 관한 함수 $x=f(t)$, $y=g(t)$로 나타내면, $t=a$에서 $t=b$까지 점 P가 움직인 거리는 $\displaystyle\int_a^b\sqrt{\{f'(t)\}^2+\{g'(t)\}^2}dt$이다.
- label: 바
  body: |
    $\displaystyle\lim_{n\to\infty}a_n=L$, $\displaystyle\lim_{n\to\infty}b_n=M$ ($L$, $M$은 실수)일 때, 모든 자연수 $n$에 대하여
    ① $a_n\le b_n$이면 $L\le M$
    ② $a_n\le c_n\le b_n$이고 $L=M$이면 $\displaystyle\lim_{n\to\infty}c_n=L$

stem: |
  [논제 I-2]

subparts:
- id: '1'
  stem: |
    <그림 2>와 같이 중심이 원점 O이고 반지름이 1인 원 위에 같은 간격으로 놓여 있는 세 개 이상의 점 $\mathrm{P}_1,\cdots,\mathrm{P}_n$이 있다. 매순간 점 $\mathrm{P}_k\ (k<n)$는 점 $\mathrm{P}_{k+1}$을 향하여 움직이고, 점 $\mathrm{P}_n$은 점 $\mathrm{P}_1$을 향하여 움직인다. $\overline{\mathrm{OP_1}}=\overline{\mathrm{OP_2}}=\cdots=\overline{\mathrm{OP}_n}>0$와 $\angle\mathrm{P_1OP_2}=\cdots=\angle\mathrm{P}_{n-1}\mathrm{OP}_n=\angle\mathrm{P}_n\mathrm{OP_1}$는 항상 성립한다고 할 때, 점 $\mathrm{P_1}$이 점 $(1,0)$에서 출발하여 처음으로 $y$축을 만날 때까지 움직인 거리를 $\alpha=\dfrac{1-\cos\dfrac{2\pi}{n}}{\sin\dfrac{2\pi}{n}}$를 이용하여 나타내고, 그 근거를 논술하시오. (15점)
    [그림 2 설명: $n=3$인 경우. 원점 중심 반지름 1인 원(축 눈금 $\pm1$)에 $\mathrm{P_1}(1,0)$, 제2사분면의 $\mathrm{P_2}$, 제3사분면의 $\mathrm{P_3}$이 찍혀 있고, $\mathrm{P_1}$에서 왼쪽 위, $\mathrm{P_2}$에서 아래, $\mathrm{P_3}$에서 오른쪽 위로 점선 화살표.]
  points: 15
  depends_on: []
  answer: {kind: expression, value: '\dfrac{\sqrt{\alpha^2+1}}{\alpha}\left(1-e^{-\frac{\pi\alpha}{2}}\right)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$r=e^{-\alpha t}$, 속력 $\sqrt{\alpha^2+1}e^{-\alpha t}$을 $0$부터 $\dfrac\pi2$까지 적분.'
    steps:
    - {id: 1a, content: '$\displaystyle\int_0^{\pi/2}\sqrt{\alpha^2+1}e^{-\alpha t}dt=\dfrac{\sqrt{\alpha^2+1}}{\alpha}\left(1-e^{-\frac{\pi\alpha}2}\right)$', criteria: [1.M1, 1.M2, 1.A3]}
    hint_ladder:
    - $\mathrm{P_2}$는 $\mathrm{P_1}$을 원점 중심으로 $\dfrac{2\pi}{n}$만큼 회전한 점이다.
    - $\mathrm{P_1}$의 접선 기울기와 직선 $\mathrm{P_1P_2}$의 기울기를 같게 놓자.
    - $y$축을 처음 만나는 순간 동경의 각은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 6. 2022학년도 논술고사 기출문제(의학계)_11.20 오후.pdf 예시답안 p.15~16
    steps:
    - id: 1b-1
      content: |
        $\theta=\dfrac{2\pi}{n}=\angle\mathrm{P_1OP_2}=\cdots=\angle\mathrm{P}_{n-1}\mathrm{OP}_n=\angle\mathrm{P}_n\mathrm{OP_1}$이라 하자. 매개변수 $t$가 동경 $\mathrm{OP_1}$이 나타내는 각의 크기일 때, 점 $\mathrm{P_1}$의 좌표 $(x_1,y_1)$을 나타내는 함수는 $x_1=f_1(t)$, $y_1=g_1(t)$이고, 점 $\mathrm{P_2}$의 좌표 $(x_2,y_2)$를 나타내는 함수는 $x_2=f_2(t)$, $y_2=g_2(t)$이다.
        그림과 같이 $r=\overline{\mathrm{OP_1}}=\overline{\mathrm{OP_2}}$라 하면 $f_1(t)=r\cos t$, $g_1(t)=r\sin t$, $f_2(t)=r\cos(t+\theta)$, $g_2(t)=r\sin(t+\theta)$이다. 삼각함수의 덧셈정리에 의해,
        $f_2=r\cos t\cos\theta-r\sin t\sin\theta=f_1\cos\theta-g_1\sin\theta$, $g_2=r\sin t\cos\theta+r\cos t\sin\theta=g_1\cos\theta+f_1\sin\theta$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\dfrac{dy_1}{dx_1}=\dfrac{g_1'}{f_1'}$이 직선 $\mathrm{P_1P_2}$의 기울기 $\dfrac{-g_1(1-\cos\theta)+f_1\sin\theta}{-f_1(1-\cos\theta)-g_1\sin\theta}$와 같으므로, $(f_1'g_1-f_1g_1')(1-\cos\theta)=(f_1'f_1+g_1'g_1)\sin\theta$이다.
        $f_1'(t)=r'\cos t-r\sin t$, $g_1'(t)=r'\sin t+r\cos t$이므로 $f_1'g_1-f_1g_1'=-r^2$이고 $f_1'f_1+g_1'g_1=r'r$이므로, $-r^2(1-\cos\theta)=r'r\sin\theta$이다.
        $r>0$이므로, $\dfrac{r'}{r}=-\dfrac{1-\cos\theta}{\sin\theta}$이고, $\dfrac{1-\cos\theta}{\sin\theta}=\alpha$이므로 양변을 치환적분하면 $r=ke^{-\alpha t}$이고, $t=0$일 때 $r=1$이므로 $k=1$이다. 따라서 $f_1(t)=e^{-\alpha t}\cos t$, $g_1(t)=e^{-\alpha t}\sin t$이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        점 $\mathrm{P_1}$이 $y$축과 처음으로 만날 때는 $t=\dfrac\pi2$일 때이므로, 점 $\mathrm{P_1}$이 움직인 거리는 제시문 [마]에 의해
        $$\int_0^{\frac\pi2}\sqrt{\{f_1'(t)\}^2+\{g_1'(t)\}^2}dt=\int_0^{\frac\pi2}\sqrt{\alpha^2+1}\,e^{-\alpha t}dt=\dfrac{\sqrt{\alpha^2+1}}{\alpha}\left(1-e^{-\frac{\pi\alpha}{2}}\right)$$
        이다.
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: '같은 반지름·같은 각 간격 조건으로 $\mathrm{P_1}$, $\mathrm{P_2}$의 좌표를 $r\cos t$, $r\cos(t+\theta)$ 등으로 놓고 덧셈정리로 연결하는 등 점 $\mathrm{P_1}$이 만족하는 조건을 찾았다.'
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: '기울기 조건에서 $\dfrac{r''}{r}=-\alpha$를 얻어 $f_1(t)=e^{-\alpha t}\cos t$, $g_1(t)=e^{-\alpha t}\sin t$로 점 $\mathrm{P_1}$의 위치를 매개변수로 나타냈다.'
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A3
      mark_type: A
      points: 5
      evidence: '$t=\dfrac\pi2$까지 속력을 적분해 움직인 거리 $\dfrac{\sqrt{\alpha^2+1}}{\alpha}\left(1-e^{-\frac{\pi\alpha}2}\right)$를 구했다.'
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6709}
  - {code: '71', misconception: MC-CAL-6725}
  - {code: '72', misconception: MC-CAL-6710}
  misconceptions:
  - id: MC-CAL-6709
    outcome_code: '70'
    wrong_work: '$\mathrm{P_1}$이 원 위를 돈다고 보고 거리를 호의 길이 $\dfrac\pi2$로 답함'
    detect_cue: 답에 $\alpha$가 없거나 $\dfrac\pi2$
    feedback: 점들은 서로를 향해 원 안쪽으로 움직입니다. $r$을 $t$의 함수로 두고 기울기 조건을 세우세요.
    remedy: [RL-1]
  - id: MC-CAL-6725
    outcome_code: '71'
    wrong_work: '적분 구간을 $0$부터 $\infty$(또는 $\pi$, $\dfrac{2\pi}n$)까지로 잡음'
    detect_cue: 답이 $\dfrac{\sqrt{\alpha^2+1}}{\alpha}$ 또는 지수에 $\pi\alpha$, $\dfrac{2\pi\alpha}{n}$
    feedback: 동경의 각이 $t$이므로 $x_1=e^{-\alpha t}\cos t=0$이 처음 되는 때는 $t=\dfrac\pi2$입니다.
    remedy: [RL-2]
  - id: MC-CAL-6710
    outcome_code: '72'
    wrong_work: '움직인 거리를 반지름 감소량 $1-e^{-\frac{\pi\alpha}2}$로 계산'
    detect_cue: 답에 $\sqrt{\alpha^2+1}$이 없다
    feedback: 제시문 [마]대로 $\sqrt{f_1'^2+g_1'^2}$를 적분해야 경로의 길이가 됩니다.
    remedy: [RL-2]

- id: '2'
  stem: |
    점 $\mathrm{A}\left(a,\dfrac1a\right)\ (a>0)$을 지나고 기울기가 음수인 직선이 곡선 $y=\dfrac1x$과 접하지 않는다. 이 직선이 $y$축과 만나는 점을 P, $x$축과 만나는 점을 Q, 곡선 $y=\dfrac1x$과 만나는 점 중 A가 아닌 점을 B라 하고, 원점을 O라 하자. $\overline{\mathrm{AB}}=1$일 때, 삼각형 OPQ의 넓이 $S(a)$에 대하여 $\displaystyle\lim_{a\to\infty}S(a)$와 $\displaystyle\lim_{a\to0}S(a)$의 값을 구하고, 그 근거를 논술하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: value, value: '\lim_{a\to\infty}S(a)=2,\ \lim_{a\to0}S(a)=2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$S=\dfrac{(a+b)^2}{2ab}$, $\dfrac ba=1\mp\dfrac{b}{\sqrt{1+a^2b^2}}$, $0<\dfrac{b}{\sqrt{1+a^2b^2}}<\dfrac1a$.'
    steps:
    - {id: 2a, content: '$\dfrac ba\to1$ ($a\to\infty$), $\dfrac ab\to1$ ($a\to0$) ⇒ 두 극한 모두 2', criteria: [2.M1, 2.A2]}
    hint_ladder:
    - 점 B를 $\left(b,\dfrac1b\right)$로 두고 P, Q 좌표와 $\overline{\mathrm{AB}}$를 구하자.
    - '$S$를 비 $\dfrac ba$만의 식으로 쓰자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 6. 2022학년도 논술고사 기출문제(의학계)_11.20 오후.pdf 예시답안 p.16~17
    steps:
    - id: 2b-1
      content: |
        점 B의 좌표를 $\mathrm{B}\left(b,\dfrac1b\right)$라 하자. 점 A와 B를 지나는 직선의 방정식은 $y=-\dfrac{1}{ab}x+\dfrac1a+\dfrac1b$이다. 따라서 점들의 좌표 $\mathrm{P}\left(0,\dfrac1a+\dfrac1b\right)$와 $\mathrm{Q}(a+b,0)$을 얻을 수 있다. 따라서
        $\overline{\mathrm{AB}}=\sqrt{(a-b)^2+\left(\dfrac1a-\dfrac1b\right)^2}=\dfrac{|a-b|}{ab}\sqrt{1+a^2b^2}$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        점 B가 $\overline{\mathrm{AB}}=1$을 만족하는 경우, $|a-b|=\dfrac{ab}{\sqrt{1+a^2b^2}}$를 얻는다. 이때 $a>b$이면 $a=b+\dfrac{ab}{\sqrt{1+a^2b^2}}$이고, $a<b$이면 $b=a+\dfrac{ab}{\sqrt{1+a^2b^2}}$이므로, 이를 다시 쓰면
        $\dfrac ba=1-\dfrac{b}{\sqrt{1+a^2b^2}}\ (a>b)$, $\dfrac ba=1+\dfrac{b}{\sqrt{1+a^2b^2}}\ (a<b)$이다.
        여기서 $0<\dfrac{ab}{\sqrt{1+a^2b^2}}<1$이므로, $0<\dfrac{b}{\sqrt{1+a^2b^2}}<\dfrac1a$이고, 제시문 [바]의 대소 관계에 의해 극한값 $\displaystyle\lim_{a\to\infty}\dfrac{b}{\sqrt{1+a^2b^2}}=0$을 얻는다. 따라서 극한값 $\displaystyle\lim_{a\to\infty}\dfrac ba=1$을 얻고, 삼각형 OPQ의 넓이는
        $S(a)=\dfrac12\left(\dfrac1a+\dfrac1b\right)(a+b)=\dfrac{(a+b)^2}{2ab}=\dfrac{\left(1+\frac ba\right)^2}{2\frac ba}$
        이므로, 극한값 $\displaystyle\lim_{a\to\infty}S(a)=2$를 얻는다.
      criteria: [2.A2]
    - id: 2b-3
      content: |
        위 식을 $\dfrac ab$에 대해서 정리하면 $\dfrac ab=1+\dfrac{a}{\sqrt{1+a^2b^2}}\ (a>b)$, $\dfrac ab=1-\dfrac{a}{\sqrt{1+a^2b^2}}\ (a<b)$이다.
        여기서 $0<\dfrac{1}{\sqrt{1+a^2b^2}}<1$이므로, $0<\dfrac{a}{\sqrt{1+a^2b^2}}<a$이고, 극한값 $\displaystyle\lim_{a\to0}\dfrac{a}{\sqrt{1+a^2b^2}}=0$을 얻는다. 따라서 극한값 $\displaystyle\lim_{a\to0}\dfrac ab=1$을 얻을 수 있고(공식 예시답안의 '$a\to\infty$'는 $a\to0$의 오기), 이를 이용하면
        $$\lim_{a\to0}S(a)=\lim_{a\to0}\dfrac{\left(1+\frac ab\right)^2}{2\frac ab}=2$$
        를 얻는다.
      criteria: [2.A2]
