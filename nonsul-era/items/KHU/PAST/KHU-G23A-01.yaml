stimuli:
- label: 가
  body: |
    타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ 위의 점 $(x_1,\ y_1)$에서의 접선의 방정식은
    $$\dfrac{x_1x}{a^2}+\dfrac{y_1y}{b^2}=1$$

stem: |
  $a>b>0$인 두 상수 $a$, $b$에 대하여 타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$의 두 초점을 F, F$'$이라 하자.

subparts:
- id: '1'
  stem: |
    $k>a$인 상수 $k$에 대하여 점 $\mathrm{A}(k,\ 0)$에서 타원에 그은 접선 중 접점의 $y$좌표가 양수인 접선을 $l$이라 할 때, 그 접점을 P라고 하자. 이때 P의 좌표를 $a$, $b$, $k$를 이용하여 나타내고, 그 근거를 논술하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: expression, value: '\left(\dfrac{a^2}{k},\ b\sqrt{1-\dfrac{a^2}{k^2}}\right)', equivalents: ['\left(\dfrac{a^2}{k},\ \dfrac{b\sqrt{k^2-a^2}}{k}\right)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접점을 $(x_1,y_1)$로 두면 접선이 $(k,0)$을 지나므로 $x_1=\dfrac{a^2}{k}$, 타원 방정식에서 $y_1>0$을 구한다.
    steps:
    - {id: 1a, content: '$\dfrac{x_1k}{a^2}=1\Rightarrow x_1=\dfrac{a^2}{k}$, $y_1=b\sqrt{1-\dfrac{x_1^2}{a^2}}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 접점을 미지수로 두고 제시문 [가]의 접선을 써 보자.
    - 그 접선이 A를 지난다는 조건은 무엇인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.5
    steps:
    - id: 1b-1
      content: |
        접점 P의 좌표를 $(x_1,y_1)$이라고 하면, 제시문 [가]에 의해 점 P에서의 접선 $l$의 방정식은 $\dfrac{x_1x}{a^2}+\dfrac{y_1y}{b^2}=1$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        이 직선이 $\mathrm{A}(k,0)$을 지나므로 $\dfrac{x_1k}{a^2}=1$, 즉 $x_1=\dfrac{a^2}{k}$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        또한 P가 타원 위의 점이므로 $\dfrac{x_1^2}{a^2}+\dfrac{y_1^2}{b^2}=1$이다. $y_1$은 양수이므로
        $y_1=\sqrt{b^2-\dfrac{a^2b^2}{k^2}}=b\sqrt{1-\dfrac{a^2}{k^2}}$이다($k>a$이므로 근호 안은 양수).
        따라서 접점 P의 좌표는 $\left(\dfrac{a^2}{k},\ b\sqrt{1-\dfrac{a^2}{k^2}}\right)$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: 점 P$(x_1,y_1)$에서의 접선의 방정식 $\dfrac{x_1x}{a^2}+\dfrac{y_1y}{b^2}=1$을 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 접선이 점 A$(k,0)$을 지나는 조건을 대입해 $x_1=\dfrac{a^2}{k}$를 얻었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: P가 타원 위의 점임을 이용하고 $y_1>0$을 골라 P$\left(\dfrac{a^2}{k},\ b\sqrt{1-\dfrac{a^2}{k^2}}\right)$을 적었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: $y_1>0$인 근을 고르는 근거 없이 $\pm$를 남기거나 음의 근을 답함
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6501}
  misconceptions:
  - id: MC-GEO-6501
    outcome_code: '70'
    wrong_work: '접선을 $\dfrac{kx}{a^2}=1$처럼 외부의 점 A를 접점 자리에 넣어 세우거나 $\dfrac{x_1x}{b^2}+\dfrac{y_1y}{a^2}=1$로 씀'
    detect_cue: 접선 식에 $k$가 접점 좌표 자리에 들어가 있거나 $x=\dfrac{a^2}{k}$가 접선이라고 결론
    feedback: 제시문 [가]의 공식은 타원 위의 점(접점)에서만 성립합니다. 접점을 미지수로 두고 A를 지나는 조건을 대입하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    (1)에서 $a=5$, $b=4$, $k=13$이라고 하자. 접점 P를 지나고 접선 $l$에 수직인 직선 $l'$이 $x$축과 만나는 점을 Q라고 하자. 이때 $\dfrac{\overline{\mathrm{PF}}}{\overline{\mathrm{QF}}}+\dfrac{\overline{\mathrm{PF'}}}{\overline{\mathrm{QF'}}}$의 값을 구하여 기약분수로 나타내고, 그 근거를 논술하시오. (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{10}{3}', equivalents: ['10/3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: P$\left(\dfrac{25}{13},\dfrac{48}{13}\right)$, 법선 기울기 3에서 Q$\left(\dfrac{9}{13},0\right)$, 초점 $(\pm3,0)$으로 네 길이를 구한다.
    steps:
    - id: 2a
      content: |
        $\overline{\mathrm{PF}}:\overline{\mathrm{QF}}=\dfrac{80}{13}:\dfrac{48}{13}$, $\overline{\mathrm{PF'}}:\overline{\mathrm{QF'}}=\dfrac{50}{13}:\dfrac{30}{13}$, 합 $\dfrac{10}{3}$
      criteria: [2.M2, 2.A2]
    hint_ladder:
    - (1)의 결과에 값을 넣어 P를 구하자.
    - 접선의 기울기를 구하면 수직인 직선의 기울기는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.5
    steps:
    - id: 2b-1
      content: |
        $a=5$, $b=4$, $k=13$일 때 (1)에 의해 $x_1=\dfrac{25}{13}$, $y_1=\dfrac{48}{13}$이다. 따라서 접선 $l$의 기울기는 $-\dfrac{b^2x_1}{a^2y_1}=-\dfrac13$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        그러므로 직선 $l'$은 기울기가 3이며 점 P$\left(\dfrac{25}{13},\dfrac{48}{13}\right)$을 지나는 직선이고, 방정식은 $y=3x-\dfrac{27}{13}$이다. 따라서 점 Q의 좌표는 $\left(\dfrac{9}{13},0\right)$이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        두 초점의 좌표를 $(-c,0)$, $(c,0)$ $(c>0)$이라 하면 $c=\sqrt{5^2-4^2}=3$이므로 F$(-3,0)$, F$'(3,0)$이다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        각 선분의 길이는 $\overline{\mathrm{PF}}=\sqrt{\dfrac{64^2+48^2}{13^2}}=\dfrac{80}{13}$, $\overline{\mathrm{PF'}}=\sqrt{\dfrac{14^2+48^2}{13^2}}=\dfrac{50}{13}$, $\overline{\mathrm{QF}}=\dfrac{9}{13}+3=\dfrac{48}{13}$, $\overline{\mathrm{QF'}}=3-\dfrac{9}{13}=\dfrac{30}{13}$이다.
        따라서 $\dfrac{\overline{\mathrm{PF}}}{\overline{\mathrm{QF}}}+\dfrac{\overline{\mathrm{PF'}}}{\overline{\mathrm{QF'}}}=\dfrac53+\dfrac53=\dfrac{10}{3}$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: 접점 P$\left(\dfrac{25}{13},\dfrac{48}{13}\right)$과 접선의 기울기 $-\dfrac13$을 구했다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 2, condition: (1)의 접점 좌표 오류를 이어 쓴 경우}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 직선 $l'$의 방정식 $y=3x-\dfrac{27}{13}$과 점 Q$\left(\dfrac{9}{13},0\right)$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: 두 초점의 좌표 $(\pm3,0)$을 $c=\sqrt{a^2-b^2}$로 구했다.
      depends_on: []
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 6
      evidence: 네 선분의 길이 $\dfrac{80}{13}$, $\dfrac{50}{13}$, $\dfrac{48}{13}$, $\dfrac{30}{13}$을 구하고 비의 합 $\dfrac{10}{3}$을 적었다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 기약분수로 나타내지 않음
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-6502}
  - {code: '72', misconception: MC-GEO-6503}
  misconceptions:
  - id: MC-GEO-6502
    outcome_code: '71'
    wrong_work: '$l''$의 기울기를 $-3$ 또는 $-\dfrac13$으로 잡음'
    detect_cue: Q의 $x$좌표가 $\dfrac{9}{13}$이 아니다(예 $\dfrac{61}{13}$, 13)
    feedback: 수직인 두 직선은 기울기의 곱이 $-1$입니다. 접선 기울기 $-\dfrac13$이면 수직선 기울기는 3입니다.
    remedy: [RL-2]
  - id: MC-GEO-6503
    outcome_code: '72'
    wrong_work: '초점을 $c=\sqrt{5^2+4^2}=\sqrt{41}$로 잡음'
    detect_cue: 초점 좌표에 $\sqrt{41}$이 등장
    feedback: 타원은 $c^2=a^2-b^2$, 쌍곡선이 $c^2=a^2+b^2$입니다.
    remedy: [RL-3]

