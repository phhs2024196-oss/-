stimuli:
- label: 바
  body: |
    사건 $A$가 일어났을 때의 사건 $B$의 조건부확률은
    $$\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}\ (\text{단, }\mathrm{P}(A)>0)$$
- label: 사
  body: |
    어떤 시행에서 사건 $A$가 일어날 확률이 $p\ (0<p<1)$일 때, 이 시행을 $n$회 반복하는 독립시행에서 사건 $A$가 $r$회 일어날 확률은
    $${}_n\mathrm{C}_r\,p^r(1-p)^{n-r}\ (\text{단, }r=0,\ 1,\ 2,\ \cdots,\ n)$$

stem: |
  어느 불꽃놀이에서 불꽃을 쏘아 올리면 불꽃이 지면에서 출발한다. 이 불꽃은 지면에서 수직 방향으로 20 m를 이동한 후 네 갈래 또는 여섯 갈래로 갈라지면서 이동한다. 이 갈라지는 지점을 '첫 번째 분기점'이라고 한다. 첫 번째 분기점에서 갈라진 불꽃들은 각각 10 m씩 이동하여 다시 네 갈래 또는 여섯 갈래로 갈라지면서 이동한다. 두 번째 갈라지는 지점을 '두 번째 분기점'이라고 한다. 두 번째 분기점들에서 갈라진 불꽃들은 각각 $2t$ m씩 이동한 후 사라진다. (단, $0<t<\dfrac52$)
  <그림 1>은 첫 번째 분기점에서 네 갈래로 갈라지고 두 번째 분기점에서 각각 4, 6, 4, 6 갈래로 갈라진 경우의 예시이다.
  <그림 2>는 점선을 따라 이동한 불꽃이 분기점에서 네 갈래 또는 여섯 갈래로 갈라지는 모양을 나타낸 것이다. 점선의 화살표 방향을 따라 이동한 불꽃은 <그림 2>와 같은 각도로만 갈라진다.
  [그림 1 설명: 지면에서 수직으로 20 m 올라간 점이 '분기점'(지면과 직각 표시). ⇒ 그 점에서 수평 왼쪽·오른쪽, 그리고 위쪽으로 두 방향(네 갈래), 각 갈래 길이 10 m. ⇒ 네 개의 두 번째 분기점에서 각각 4, 6, 4, 6 갈래로 짧게(2t m) 갈라진 모양.]
  [그림 2 설명: 왼쪽(네 갈래) — 아래에서 위로 올라온 점선 화살표가 분기점에서 수평 왼쪽, 수평 오른쪽, 그리고 수평과 각각 60°를 이루는 위쪽 두 방향으로 갈라지며, 위쪽 두 갈래 사이 각도 60°, 진행 방향(점선)과 수평 갈래는 직각. 오른쪽(여섯 갈래) — 같은 방향에서 온 불꽃이 수평 왼쪽·오른쪽, 위쪽 두 방향, 아래쪽 두 방향으로 인접한 갈래끼리 60°씩 갈라지고, 아래쪽 갈래와 들어온 점선 사이 각이 30°.]
  다음 조건을 만족할 때 아래 물음에 답하시오.
  (가) 각 분기점에서 불꽃이 갈라지는 시행은 독립시행이다.
  (나) 각 분기점에서 불꽃이 네 갈래로 갈라질 확률은 $\dfrac12$이다.
  (다) 불꽃은 한 평면 위에서 움직인다.
  (라) 불꽃은 동일한 속력으로 움직이고, 직선으로 이동한다. (단, 분기점은 제외한다.)

subparts:
- id: '1'
  stem: |
    두 번째 분기점에서 생기는 불꽃의 개수를 확률변수 $X$라고 하자. $22\le X\le26$인 사건 $A$가 일어났을 때, 첫 번째 분기점에서 불꽃이 여섯 갈래로 갈라진 사건 $B$의 조건부확률 $\mathrm{P}(B\mid A)$를 구하고, 그 근거를 논술하시오. (18점)
  points: 18
  depends_on: []
  answer: {kind: value, value: '\dfrac{7}{27}', equivalents: ['7/27'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 첫 분기 네 갈래 → $X=16+2m$ ($m$=여섯 갈래 수, $0\le m\le4$), 여섯 갈래 → $X=24+2m$. $A$에 드는 경우만 골라 더한다.
    steps:
    - {id: 1a, content: '$\mathrm{P}(A)=\dfrac18+\dfrac1{32}+\dfrac1{128}+\dfrac3{64}=\dfrac{27}{128}$, $\mathrm{P}(A\cap B)=\dfrac7{128}$', criteria: [1.B1, 1.B2, 1.A1]}
    hint_ladder:
    - 첫 번째 분기점에서 네 갈래인 경우와 여섯 갈래인 경우를 나누자.
    - 각 경우 $X$가 될 수 있는 값을 모두 나열하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.12
    steps:
    - id: 1b-1
      content: |
        $X=22$인 경우: 첫 번째 분기점에서 네 갈래, 두 번째 분기점에서 4, 6, 6, 6 갈래로 갈라지는 경우의 확률은 제시문 [사]에 의해 $\dfrac12\times{}_4\mathrm{C}_1\left(\dfrac12\right)^4=\dfrac18$.
        $X=24$인 경우 (i): 첫 번째 분기점에서 네 갈래, 두 번째 분기점에서 6, 6, 6, 6 갈래로 갈라지는 경우의 확률은 $\dfrac12\times\left(\dfrac12\right)^4=\dfrac1{32}$.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $X=24$인 경우 (ii): 첫 번째 분기점에서 여섯 갈래, 두 번째 분기점에서 4, 4, 4, 4, 4, 4 갈래로 갈라지는 경우의 확률은 $\dfrac12\times\left(\dfrac12\right)^6=\dfrac1{128}$.
        $X=26$인 경우: 첫 번째 분기점에서 여섯 갈래, 두 번째 분기점에서 4, 4, 4, 4, 4, 6 갈래로 갈라지는 경우의 확률은 $\dfrac12\times{}_6\mathrm{C}_1\left(\dfrac12\right)^6=\dfrac3{64}$.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        따라서 $\mathrm{P}(A\cap B)=\dfrac1{128}+\dfrac3{64}=\dfrac7{128}$이고 $\mathrm{P}(A)=\dfrac18+\dfrac1{32}+\dfrac1{128}+\dfrac3{64}=\dfrac{27}{128}$이므로 제시문 [바]에 의해 $\mathrm{P}(B\mid A)=\dfrac7{27}$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 6
      evidence: 첫 번째 분기점에서 네 갈래인 경우 $X=22$, $X=24$의 확률 $\dfrac18$, $\dfrac1{32}$을 독립시행의 확률로 계산했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 6
      evidence: 첫 번째 분기점에서 여섯 갈래인 경우 $X=24$, $X=26$의 확률 $\dfrac1{128}$, $\dfrac3{64}$을 독립시행의 확률로 계산했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: $\mathrm{P}(A)=\dfrac{27}{128}$, $\mathrm{P}(A\cap B)=\dfrac7{128}$로 조건부확률 $\dfrac7{27}$을 구했다.
      depends_on: []
      implied_ok: true
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6508}
  - {code: '71', misconception: MC-PRB-6509}
  misconceptions:
  - id: MC-PRB-6508
    outcome_code: '70'
    wrong_work: '$X=24$를 첫 분기 네 갈래(6,6,6,6)인 경우만 세어 $\mathrm{P}(A)=\dfrac{26}{128}$, 답 $\dfrac6{26}$'
    detect_cue: 답이 $\dfrac3{13}$ 또는 $\mathrm{P}(A)\ne\dfrac{27}{128}$
    feedback: 같은 $X$라도 첫 분기에서 네 갈래·여섯 갈래 양쪽에서 나올 수 있는지 모두 확인하세요.
    remedy: [RL-1]
  - id: MC-PRB-6509
    outcome_code: '71'
    wrong_work: '$\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(B)}=\dfrac{7/128}{1/2}=\dfrac7{64}$'
    detect_cue: 답이 $\dfrac7{64}$ 또는 $\dfrac7{128}$
    feedback: 조건부확률의 분모는 '이미 일어난 사건' $A$의 확률입니다(제시문 [바]).
    remedy: [RL-2]
- id: '2'
  stem: |
    <그림 3>과 같이 모든 분기점에서 불꽃이 여섯 갈래로 갈라진 경우를 생각하자. 36개로 갈라진 불꽃의 마지막 위치를 점으로 나타낼 때, 이 점들 사이의 거리의 최솟값을 $f(t)$라고 하자. $0<t<\dfrac52$일 때, 함수 $y=f(t)$가 미분가능하지 않은 $t$의 값을 구하고, 그 근거를 논술하시오. (19점)
    [그림 3 설명: 지면에서 수직으로 올라간 점선 끝(첫 번째 분기점)에서 여섯 방향(수평 좌우, 위쪽 두 방향, 아래쪽 두 방향, 인접 60°)으로 점선이 뻗어 정육각형 꼴로 놓인 여섯 개의 두 번째 분기점에 닿고, 각 두 번째 분기점에서 짧은 실선 여섯 갈래(끝점 표시)가 퍼져 있다.]
  points: 19
  depends_on: []
  answer: {kind: value, value: '\dfrac{5(\sqrt3-1)}{2}', equivalents: ['\dfrac{5}{\sqrt3+1}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$f(t)=\min(2t,\ 10-2\sqrt3t)$이고 두 일차식이 같아지는 $t_0$에서 기울기가 2에서 $-2\sqrt3$으로 바뀐다.'
    steps:
    - {id: 2a, content: '$2t=10-2\sqrt3t\iff t=\dfrac5{\sqrt3+1}=\dfrac{5(\sqrt3-1)}2$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - 같은 분기점에서 나온 두 끝점의 최소 거리는?
    - 이웃한 두 번째 분기점(거리 10)의 끝점 중 서로를 향하는 것끼리의 거리는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.12
    steps:
    - id: 2b-1
      content: |
        한 분기점에서 갈라지는 두 점 사이의 최소 거리는 $2t$이다(이웃한 두 갈래가 60°를 이루고 길이가 $2t$인 정삼각형).
        서로 다른 분기점에서 갈라지는 두 점 사이의 최소 거리는 $10-2\sqrt3t$이다. [보충: 두 번째 분기점들은 한 변이 10인 정육각형의 꼭짓점이고, 이웃한 두 분기점에서 서로 쪽으로 각각 선분과 30°를 이루며 뻗은 두 끝점은 선분 방향으로 각각 $2t\cos30^\circ=\sqrt3t$씩 다가가고 수직 방향 성분은 같아, 거리 $10-2\sqrt3t$.]
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $2t\le10-2\sqrt3t$이면 $2(\sqrt3+1)t\le10$이므로 $t\le\dfrac5{\sqrt3+1}=\dfrac{5(\sqrt3-1)}2$이다. 또한 $2t>10-2\sqrt3t$이면 $t>\dfrac{5(\sqrt3-1)}2$이다.
        $t_0=\dfrac{5(\sqrt3-1)}2$라고 하면 $f(t)=\begin{cases}2t & (0<t\le t_0)\\ 10-2\sqrt3t & \left(t_0<t<\dfrac52\right)\end{cases}$이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        따라서 $\displaystyle\lim_{t\to t_0-}\dfrac{f(t)-f(t_0)}{t-t_0}=2$, $\displaystyle\lim_{t\to t_0+}\dfrac{f(t)-f(t_0)}{t-t_0}=-2\sqrt3$이므로 $f'(t_0)$가 존재하지 않는다. 즉, 함수 $f(t)$는 $t=t_0=\dfrac{5(\sqrt3-1)}2$에서 미분가능하지 않다.
      criteria: [2.R1, 2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 같은 분기점 끝점 사이 최소 거리 $2t$와 다른 분기점 끝점 사이 최소 거리 $10-2\sqrt3t$를 구했다.
      depends_on: []
