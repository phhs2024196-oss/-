key_idea: '수직인 두 접선의 교점 C는 항상 준선 $y=-\dfrac14$ 위에 있고 $x(t)=\dfrac t2-\dfrac1{8t}$이므로 움직인 거리는 $\int_1^2\lvert x''(t)\rvert\,dt$. (2)는 $\triangle ABC$가 C에서 직각이므로 $\dfrac12\overline{AC}\cdot\overline{BC}$.'
stuck: 수직 조건으로 B의 $x$좌표 $-\dfrac1{4t}$를 구하고, 직각삼각형 넓이를 두 변 길이로 쓴 뒤 최고차항으로 나누는 단계
