stimuli:
- label: 바
  body: |
    어떤 시행에서 사건 $A$가 일어날 확률이 $p\ (0<p<1)$일 때, 이 시행을 $n$회 반복하는 독립시행에서 사건 $A$가 $r$회 일어날 확률은
    $${}_n\mathrm{C}_r\,p^r(1-p)^{n-r}\ (\text{단, }r=0,\ 1,\ 2,\ \cdots,\ n)$$
- label: 사
  body: |
    사건 $A$가 일어났을 때의 사건 $B$의 조건부확률은
    $$\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}\ (\text{단, }\mathrm{P}(A)>0)$$

stem: |
  아래 그림과 같이 운동장 안에 $(n+1)$개의 연결된 방이 있다. 모든 $i=1,\ 2,\ \cdots,\ n$에 대하여 방 $i$에는 두 개의 출구가 있어서, 그 중 하나만 방 $(i+1)$과 연결되어 있고 다른 하나는 운동장으로 나오는 출구이다. 방 $(n+1)$에는 운동장으로 나오는 출구만 있다.
  [그림 설명: 방 1, 방 2, …, 방 $(i-1)$, 방 $i$, …, 방 $n$, 방 $(n+1)$[상품]이 가로로 늘어서 있다. 방 $i$에는 왼쪽에서 방 $(i-1)$로부터 들어오는 통로(화살표)가 있고, 오른쪽에 방 $(i+1)$로 가는 출구(화살표)와 아래 '운동장'으로 나가는 출구(화살표)가 있다. 방 1 아래에 '출발' 통로와 달리는 사람·위쪽 화살표, 방 $(n+1)$ 아래에 운동장으로 나가는 통로와 아래쪽 화살표가 있고, 가운데에 '운 동 장'이라고 쓰여 있다.]
  각각 1, 2, $\cdots$, $n$번 조끼를 입은 학생들이 운동장에 모여 있고 아래와 같은 규칙으로 방을 통과하는 게임에 참여한다.
  (가) 1번 조끼를 입은 학생부터 조끼 번호의 오름차순으로 한 명씩 방 1로 들어간다.
  (나) 모든 $i=1,\ 2,\ \cdots,\ n$에 대하여 방 $i$에 처음으로 도착한 학생은 두 개의 출구 중 하나를 선택한다. 이때 다음 방으로 연결된 출구를 선택하면 이 학생은 다음 방으로 가고, 그렇지 않으면 운동장으로 나온다. 방 $(n+1)$에 도착한 모든 학생은 상품을 받고 출구를 통해 운동장으로 나온다. (단, 지나온 길을 되돌아가지는 않는다.)
  (다) 먼저 출발한 학생이 운동장으로 나오면, 그 다음 학생은 방 1로 들어간다. 먼저 출발한 학생이 방 $i$의 출구($i=1,\ 2,\ \cdots,\ n$)에서 운동장으로 나오면, 그 다음에 출발하는 학생은 방 1부터 연결된 출구들을 통해 방 $(i+1)$로 간다. 먼저 출발한 학생이 방 $(n+1)$에서 나오면, 그 다음 학생은 항상 방 $(n+1)$까지 간다.
  (라) $n$번 조끼를 입은 학생이 방 1로 들어가서, 운동장으로 다시 나오면 게임은 끝난다.
  모든 $i=1,\ 2,\ \cdots,\ n$에 대하여 방 $i$의 두 개의 출구 중에서 운동장으로 나오는 출구를 선택할 확률은 $\dfrac12$이며, 각각의 선택은 독립이라고 할 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $n=7$이라고 하자. 6번 조끼를 입은 학생이 상품을 받을 때, 3번 조끼를 입은 학생이 상품을 받지 못하였을 확률을 구하고, 그 근거를 논술하시오. (17점)
  points: 17
  depends_on: []
  answer: {kind: value, value: '\dfrac{91}{120}', equivalents: ['91/120'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 낙첨자 수 $Y\sim\mathrm{B}\left(7,\dfrac12\right)$. $C=\{Y\le5\}$, $C\cap D=\{3\le Y\le5\}$.
    steps:
    - {id: 1a, content: '$\dfrac{{}_7\mathrm{C}_3+{}_7\mathrm{C}_4+{}_7\mathrm{C}_5}{2^7-{}_7\mathrm{C}_6-{}_7\mathrm{C}_7}=\dfrac{91}{120}$', criteria: [1.M1, 1.A2]}
    hint_ladder:
    - 상품을 받지 못한 학생 수는 무엇과 같은가?
    - 6번이 상품을 받으려면 앞에서 몇 명 이하가 떨어져야 하나?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.11
    steps:
    - id: 1b-1
      content: |
        6번 조끼를 입은 학생이 상품을 받은 사건을 $C$, 3번 조끼를 입은 학생이 상품을 받지 못하였을 사건을 $D$라 하자. 6번 학생이 상품을 받는 경우는 상품을 받지 못한 학생의 수가 0, 1, 2, 3, 4, 5명일 때이다. 3번 학생이 상품을 받지 못하는 경우는 상품을 받지 못한 학생의 수가 3, 4, 5, 6, 7명일 때이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 사건 $C$의 확률은 두 출구 중 하나를 선택하는 시행을 7회 반복할 때 운동장으로 나오는 출구를 0, 1, 2, 3, 4, 5개 선택하는 경우의 확률과 같고, 사건 $C\cap D$의 확률은 운동장 출구를 3, 4, 5개 선택하는 경우의 확률과 같다. 제시문 [바]에 의하여 $p=\dfrac12$이므로
        $\mathrm{P}(C)=\displaystyle\sum_{r=0}^{5}{}_7\mathrm{C}_r\left(\dfrac12\right)^7=\dfrac{120}{128}$, $\mathrm{P}(C\cap D)=\left({}_7\mathrm{C}_3+{}_7\mathrm{C}_4+{}_7\mathrm{C}_5\right)\left(\dfrac12\right)^7=\dfrac{91}{128}$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        따라서 6번 학생이 상품을 받을 때 3번 학생이 상품을 받지 못하였을 확률은 제시문 [사]의 조건부확률의 정의에 의해 $\dfrac{91/128}{120/128}=\dfrac{91}{120}$이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: 사건 $C$, $D$를 상품을 받지 못한 학생 수(운동장 출구 선택 횟수)의 범위(0~5명, 3~7명)로 바꾸었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: 독립시행의 확률로 $\mathrm{P}(C)=\dfrac{120}{128}$, $\mathrm{P}(C\cap D)=\dfrac{91}{128}$을 계산했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: 조건부확률의 정의로 $\dfrac{91}{120}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
