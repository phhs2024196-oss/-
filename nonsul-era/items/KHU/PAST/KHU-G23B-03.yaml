  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6518}
  - {code: '71', misconception: MC-PRB-6509}
  misconceptions:
  - id: MC-PRB-6518
    outcome_code: '70'
    wrong_work: '학생마다 상품을 받을 확률을 따로 구해 $\mathrm{P}(D)\times\mathrm{P}(C)$처럼 독립으로 곱함'
    detect_cue: 계산에 '낙첨자 수' 대신 학생별 확률의 곱이 등장
    feedback: 앞 학생들의 결과가 뒤 학생의 경로를 정하므로 학생들의 수상 여부는 독립이 아닙니다. 낙첨자 수 하나로 두 사건을 표현하세요.
    remedy: [RL-1]
  - id: MC-PRB-6509
    outcome_code: '71'
    wrong_work: '$\mathrm{P}(C\cap D)$만 답하거나 $\dfrac{\mathrm{P}(C\cap D)}{\mathrm{P}(D)}=\dfrac{91}{99}$로 계산'
    detect_cue: 답이 $\dfrac{91}{128}$ 또는 $\dfrac{91}{99}$
    feedback: '"6번이 상품을 받을 때"가 조건이므로 분모는 $\mathrm{P}(C)$입니다.'
    remedy: [RL-2]
- id: '2'
  stem: |
    $n=400$일 때 상품을 받은 학생이 190명 이상일 사건을 $A$라 하고, $n=72$일 때 상품을 받은 학생이 $k$명 이상일 사건을 $B$라고 하자. 이때, $\mathrm{P}(A)\le\mathrm{P}(B)$를 만족하는 자연수 $k$의 최댓값을 구하고, 그 근거를 논술하시오. (20점)
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: '31', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$X_A\sim\mathrm{B}\left(400,\dfrac12\right)\approx\mathrm{N}(200,10^2)$, $X_B\sim\mathrm{B}\left(72,\dfrac12\right)\approx\mathrm{N}(36,18)$. $\mathrm{P}(Z\le1)\le\mathrm{P}\left(Z\le\dfrac{36-k}{\sqrt{18}}\right)$.'
    steps:
    - {id: 2a, content: '$\dfrac{36-k}{3\sqrt2}\ge1\iff k\le36-3\sqrt2\approx31.76$', criteria: [2.M2, 2.A2]}
    hint_ladder:
    - 상품을 받은 학생 수 조건을 받지 못한 학생 수 조건으로 바꾸자.
    - 두 확률을 표준정규분포로 나타내면 비교는 $z$값 비교가 된다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.11
    steps:
    - id: 2b-1
      content: |
        400명의 학생이 게임에 참가할 때 상품을 받지 못한 학생 수를 확률변수 $X_A$라고 하면 $X_A$는 운동장으로 나가는 출구를 선택한 횟수와 같다. 따라서 $X_A$는 이항분포 $\mathrm{B}\left(400,\dfrac12\right)$을 따르므로 평균 $m_A=400\times\dfrac12=200$, 표준편차 $\sigma_A=\sqrt{400\times\dfrac12\times\dfrac12}=10$이다.
        이때 학생 수 400과 평균 200이 충분히 크므로 $X_A$는 정규분포 $\mathrm{N}(200,10^2)$을 따른다. $Z=\dfrac{X_A-200}{10}$은 표준정규분포를 따르므로
        $\mathrm{P}(A)=\mathrm{P}(X_A\le210)=\mathrm{P}\left(Z\le\dfrac{210-200}{10}\right)=\mathrm{P}(Z\le1)$ ⋯ ①
      criteria: [2.M1]
    - id: 2b-2
      content: |
        72명의 학생이 게임에 참가할 때 상품을 받지 못한 학생 수를 확률변수 $X_B$라고 하면 $X_B$는 이항분포 $\mathrm{B}\left(72,\dfrac12\right)$을 따르므로 평균 $m_B=36$, 표준편차 $\sigma_B=\sqrt{72\times\dfrac12\times\dfrac12}=\sqrt{18}$이다. 학생 수 72와 평균 36이 충분히 크므로 $X_B$는 정규분포 $\mathrm{N}(36,18)$을 따르고, $Z=\dfrac{X_B-36}{\sqrt{18}}$에 대해
        $\mathrm{P}(B)=\mathrm{P}(X_B\le72-k)=\mathrm{P}\left(Z\le\dfrac{36-k}{\sqrt{18}}\right)$ ⋯ ②
      criteria: [2.A1]
    - id: 2b-3
      content: |
        ①과 ②에서 $1\le\dfrac{36-k}{\sqrt{18}}$일 때만 $\mathrm{P}(Z\le1)\le\mathrm{P}\left(Z\le\dfrac{36-k}{\sqrt{18}}\right)$이다. 즉 $k\le36-\sqrt{18}=36-3\sqrt2$ ($3\sqrt2\approx4.24$).
      criteria: [2.M2]
    - id: 2b-4
      content: |
        따라서 $\mathrm{P}(A)\le\mathrm{P}(B)$를 만족하는 가장 큰 자연수 $k$는 31이다.
