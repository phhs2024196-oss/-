    outcome_code: '72'
    wrong_work: '$S(a)$를 미분할 때 $(2a-5)f(a)$의 곱의 미분에서 $2f(a)$ 항을 빠뜨림'
    detect_cue: $S'(a)$가 $-(2a-5)f'(a)$ 꼴이 아니고 답이 $\dfrac52$가 아님
    feedback: 곱 $(2a-5)f(a)$는 곱의 미분으로, $\int_2^af$는 제시문 [라]로 미분합니다.
    remedy: [RL-3]
  - id: MC-CAL-6507
    outcome_code: '73'
