  concepts: [공간좌표의 내분점, 구의 방정식, 정사영의 넓이(S'=S cosθ), 피타고라스 정리, 직각삼각형의 넓이]
  tools: [내분점 공식으로 Q의 좌표 표현, 구의 방정식에 대입해 a 결정, R에서 xy평면에 내린 수선의 발 R', 정사영 넓이 최대 조건(R'이 단위원 위에서 OQ에 수직), 세 변의 길이로 직각삼각형 판정, cosθ=정사영 넓이/원래 넓이]
  conditions:
  - '$a$, $b$는 양수 ⇒ $a=\dfrac{2\sqrt2}{5}$ 하나'
  - 'P가 AQ를 $1:4$로 내분 ⇒ P의 $z$좌표 $\dfrac85$'
