stimuli:
- label: 마
  body: |
    좌표공간의 두 점 $\mathrm{A}(x_1,\ y_1,\ z_1)$, $\mathrm{B}(x_2,\ y_2,\ z_2)$에 대하여 선분 AB를 $m:n\ (m>0,\ n>0)$으로 내분하는 점 P의 좌표는
    $$\left(\dfrac{mx_2+nx_1}{m+n},\ \dfrac{my_2+ny_1}{m+n},\ \dfrac{mz_2+nz_1}{m+n}\right)$$
- label: 바
  body: |
    평면 $\beta$ 위의 도형의 넓이를 $S$, 이 도형의 평면 $\alpha$ 위로의 정사영의 넓이를 $S'$이라고 할 때, 두 평면 $\alpha$, $\beta$가 이루는 각의 크기를 $\theta\ (0^\circ\le\theta\le90^\circ)$라고 하면
    $$S'=S\cos\theta$$

stem: |
  구 $x^2+y^2+(z-1)^2=1$ 위에 두 점 $\mathrm{A}(0,\ 0,\ 2)$, $\mathrm{P}(a,\ a,\ b)$가 있다. $xy$평면 위의 점 Q에 대하여 점 P가 선분 AQ를 $1:4$로 내분할 때, 다음 물음에 답하시오. (단, $a$, $b$는 양수이다.)

subparts:
- id: '1'
  stem: |
    점 P와 점 Q의 좌표를 구하고, 그 근거를 논술하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '\mathrm{P}\left(\dfrac{2\sqrt2}{5},\ \dfrac{2\sqrt2}{5},\ \dfrac85\right),\ \mathrm{Q}(2\sqrt2,\ 2\sqrt2,\ 0)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 내분점의 $z$좌표에서 $b=\dfrac85$, 구에 대입해 $a$를 얻는다.
    steps:
    - {id: 1a, content: '$2a^2+\left(\dfrac35\right)^2=1\Rightarrow a=\dfrac{2\sqrt2}{5}$, $\mathrm{Q}=(5a,5a,0)$', criteria: [1.B1, 1.B2]}
    hint_ladder:
    - Q의 좌표를 $(x_1,y_1,0)$으로 두고 내분점 공식을 쓰자.
    - P가 구 위에 있다는 조건을 쓰자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 3. 2024 논술고사 기출문제(자연계).pdf 예시답안 p.10
    steps:
    - id: 1b-1
      content: |
        점 Q의 좌표를 $(x_1,\ y_1,\ 0)$이라 두면 점 P는 선분 AQ를 $1:4$로 내분하는 점이므로 제시문 [마]에 의해
        $$\mathrm{P}\left(\dfrac{1\times x_1+4\times0}{5},\ \dfrac{1\times y_1+4\times0}{5},\ \dfrac{1\times0+4\times2}{5}\right)=\left(\dfrac{x_1}{5},\ \dfrac{y_1}{5},\ \dfrac85\right)$$
        점 P의 좌표는 $(a,\ a,\ b)$이므로, $x_1=y_1=5a$이고 $b=\dfrac85$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        한편 점 P는 구 위의 점이므로 $a^2+a^2+(b-1)^2=1$이고 이를 풀면, $a=\dfrac{2\sqrt2}{5}$, $x_1=y_1=2\sqrt2$가 된다. 따라서 점 P의 좌표와 점 Q의 좌표는 각각 $\left(\dfrac{2\sqrt2}{5},\ \dfrac{2\sqrt2}{5},\ \dfrac85\right)$, $(2\sqrt2,\ 2\sqrt2,\ 0)$이다.
      criteria: [1.B1, 1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: 내분점 공식과 구의 방정식으로 점 P의 좌표 $\left(\dfrac{2\sqrt2}{5},\dfrac{2\sqrt2}{5},\dfrac85\right)$를 구했다(공식 <5점>).
      depends_on: []
      steps: [1b-1, 1b-2]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: 점 Q의 좌표 $(2\sqrt2,2\sqrt2,0)$을 구했다(공식 <5점>).
      depends_on: []
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6407}
  misconceptions:
  - id: MC-GEO-6407
    outcome_code: '70'
    wrong_work: 'P를 $\left(\dfrac{4x_1}{5},\dfrac{4y_1}{5},\dfrac25\right)$로 써서 $b=\dfrac25$'
    detect_cue: $b=\dfrac25$ 또는 Q의 좌표가 $\dfrac54a$ 꼴
    feedback: '$m:n$ 내분점은 $\dfrac{m\cdot(\text{뒤 끝점})+n\cdot(\text{앞 끝점})}{m+n}$입니다(제시문 [마]).'
    remedy: [RL-1]
- id: '2'
  stem: |
    점 A와 점 P가 아닌 구 위의 점 R에 대하여 삼각형 ARQ의 $xy$평면 위로의 정사영을 $F$라 하고 삼각형 ARQ와 $xy$평면이 이루는 각의 크기를 $\theta$라 하자. $F$의 넓이가 최대가 될 때, 삼각형 ARQ의 세 변의 길이와 $\cos\theta$의 값을 구하고, 그 근거를 논술하시오. (27점)
  points: 27
  depends_on: ['1']
  answer: {kind: value, value: '\overline{\mathrm{AQ}}=2\sqrt5,\ \overline{\mathrm{AR}}=\sqrt2,\ \overline{\mathrm{RQ}}=3\sqrt2,\ \cos\theta=\dfrac23', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $F=\triangle\mathrm{OR'Q}$, 넓이 최대는 $\mathrm{R'}$이 단위원 위에서 $\mathrm{OR'}\perp\mathrm{OQ}$일 때로 $F=2$, $\triangle\mathrm{ARQ}=3$.
    steps:
    - {id: 2a, content: '$\cos\theta=\dfrac{2}{3}$', criteria: [2.M1, 2.B1, 2.A1]}
    hint_ladder:
    - A와 Q의 정사영은 각각 어디인가?
    - 밑변 OQ가 고정이면 넓이는 무엇으로 결정되는가?
    - 제시문 [바]를 쓰자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 3. 2024 논술고사 기출문제(자연계).pdf 예시답안 p.10
    steps:
    - id: 2b-1
      content: |
        구 위의 점 R에서 $xy$평면에 내린 수선의 발을 $\mathrm{R'}$이라 하면, 삼각형 ARQ의 $xy$평면 위로의 정사영 $F$는 삼각형 $\mathrm{OR'Q}$이다. 이때, $F$의 넓이가 최대가 되려면 점 $\mathrm{R'}$은 원 $x^2+y^2=1$ 위에 있는 점들 중 선분 $\mathrm{OR'}$이 선분 OQ와 수직인 점이며, 점 R의 $z$좌표는 1이어야 한다. (그림에서와는 달리 반대편에도 R이 위치할 수 있다.) 또한 $\overline{\mathrm{R'Q}}=\sqrt{17}$이 된다.
        [그림 1 설명: $z$축 위에 A(꼭대기)와 구의 중심 C$(0,0,1)$, 원점 O. R은 구의 적도 높이($z=1$)에 있고 R에서 $xy$평면에 내린 수선의 발 $\mathrm{R'}$, R에서 $z$축에 내린 수선의 발 C. Q는 $xy$평면 위, P는 선분 AQ 위. 삼각형 ARQ와 그 정사영 삼각형 $\mathrm{OR'Q}$가 그려져 있다.]
      criteria: [2.M1]
    - id: 2b-2
      content: |
        점 R에서 $z$축에 내린 수선의 발을 C라 하면,
        $$\overline{\mathrm{AQ}}=\sqrt{\overline{\mathrm{AO}}^2+\overline{\mathrm{OQ}}^2}=2\sqrt5,\quad \overline{\mathrm{AR}}=\sqrt{\overline{\mathrm{AC}}^2+\overline{\mathrm{CR}}^2}=\sqrt2,\quad \overline{\mathrm{RQ}}=\sqrt{\overline{\mathrm{RR'}}^2+\overline{\mathrm{R'Q}}^2}=3\sqrt2$$
      criteria: [2.B1]
    - id: 2b-3
      content: |
        이때 $\overline{\mathrm{AQ}}^2=\overline{\mathrm{AR}}^2+\overline{\mathrm{RQ}}^2$이므로 삼각형 ARQ는 직각삼각형이고, 넓이는 $\dfrac12\overline{\mathrm{AR}}\times\overline{\mathrm{RQ}}=3$이다. 한편 삼각형 ARQ의 $xy$평면 위로의 정사영의 넓이는 삼각형 $\mathrm{OR'Q}$의 넓이 $\dfrac12\overline{\mathrm{OQ}}\times\overline{\mathrm{OR'}}=2$이다. 따라서 제시문 [바]에 의해 $\cos\theta=\dfrac{\triangle\mathrm{OR'Q}}{\triangle\mathrm{ARQ}}=\dfrac23$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 9
      evidence: '정사영이 삼각형 $\mathrm{OR''Q}$이고 넓이가 최대인 상황($\mathrm{R''}$이 단위원 위에서 $\mathrm{OR''}\perp\mathrm{OQ}$, R의 $z$좌표 1)을 설명했다(공식 <9점>).'
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.B1
      mark_type: B
      points: 9
      evidence: 삼각형 ARQ의 세 변의 길이 $2\sqrt5$, $\sqrt2$, $3\sqrt2$를 구했다(공식 <9점>).
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 9
      evidence: 삼각형 ARQ의 넓이 3과 정사영 넓이 2로 $\cos\theta=\dfrac23$을 구했다(공식 <9점>).
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
