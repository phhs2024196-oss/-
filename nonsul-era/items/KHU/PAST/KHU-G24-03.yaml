key_idea: |
  삼각형 ARQ의 $xy$평면 위로의 정사영은 삼각형 $\mathrm{OR'Q}$이므로, $\mathrm{R'}$이 원 $x^2+y^2=1$ 위에서 $\mathrm{OR'}\perp\mathrm{OQ}$이고 R의 $z$좌표가 1일 때 넓이가 최대이다.
stuck: 정사영 F가 삼각형 $\mathrm{OR'Q}$이고 그 넓이 최대 조건이 $\mathrm{R'}$의 위치 문제로 바뀐다는 것을 파악하는 단계
