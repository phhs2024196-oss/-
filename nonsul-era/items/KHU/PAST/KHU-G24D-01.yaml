stimuli:
- label: 가
  body: |
    두 벡터 $\vec a$, $\vec b$의 크기와 방향이 각각 같을 때, 두 벡터 $\vec a$, $\vec b$는 서로 같다고 하며, 이것을 기호로 $\vec a=\vec b$와 같이 나타낸다.
- label: 나
  body: |
    두 평면벡터 $\vec a$, $\vec b$가 이루는 각의 크기가 $\theta\ (0^\circ\le\theta\le180^\circ)$일 때, 두 벡터의 내적 $\vec a\cdot\vec b$를 다음과 같이 정의한다.
    $$\vec a\cdot\vec b=\lvert\vec a\rvert\lvert\vec b\rvert\cos\theta$$
- label: 다
  body: |
    좌표평면 위의 두 점 $\mathrm{A}(x_1,\ y_1)$, $\mathrm{B}(x_2,\ y_2)$ 사이의 거리는
    $$\overline{\mathrm{AB}}=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$$

stem: |
  아래 그림과 같이 중심이 $\mathrm{O_1}$이고 선분 AB를 지름으로 하는 반원과 중심이 $\mathrm{O_2}$이고 선분 CD를 지름으로 하는 반원이 있다. 선분 AB와 선분 CD는 수직이고, $\overline{\mathrm{AB}}=\overline{\mathrm{CD}}=2$이다. 호 AP와 호 QP 위에서 각각 움직이고 있는 점 M과 점 N에 대하여 $\lvert\overrightarrow{\mathrm{O_1M}}+\overrightarrow{\mathrm{O_2N}}\rvert$의 최솟값이 $\dfrac{2\sqrt3}{3}$이다. 다음 물음에 답하시오. (단, 점 $\mathrm{O_2}$는 선분 AB 위에 있다.)

  [그림 1 설명: 수평 선분 AB 위에 왼쪽부터 A, Q, $\mathrm{O_1}$, $\mathrm{O_2}$, B가 놓여 있다. 지름 AB 위쪽의 반원(중심 $\mathrm{O_1}$)과, $\mathrm{O_2}$를 지나 AB에 수직인 지름 CD(C는 위, D는 아래)의 왼쪽 반원(중심 $\mathrm{O_2}$)이 그려져 있다. 두 반원은 위쪽에서 점 P에서 만나고, 왼쪽 반원은 AB와 점 Q에서 만난다. AB 위쪽 반원은 선분 $\mathrm{O_2C}$와 점 R에서 만난다. $\mathrm{O_2}$에 직각 표시.]

subparts:
- id: '1'
  stem: |
    선분 $\mathrm{O_1O_2}$의 길이를 구하고, 그 근거를 논술하시오. (16점)
  points: 16
  depends_on: []
  answer: {kind: value, value: '\dfrac23', equivalents: ['2/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 최소일 때 M=P, N=Q이고 $\cos\angle\mathrm{PO_1A}=-\dfrac13$, $\mathrm{O_1H}=\mathrm{HO_2}=\dfrac13$.
    steps:
    - {id: 1a, content: '$2+2\cos\theta=\dfrac43\Rightarrow\cos\theta=-\dfrac13$, $\overline{\mathrm{O_1O_2}}=2\cdot\dfrac13$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 크기 대신 크기의 제곱을 생각하자.
    - 두 벡터의 시점을 같게 옮겨 보자.
    - P에서 AB에 수선을 내려 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 4. 2024 논술고사 기출문제(의약학계).pdf 예시답안 p.10~11
    steps:
    - id: 1b-1
      content: |
        $\lvert\overrightarrow{\mathrm{O_1M}}+\overrightarrow{\mathrm{O_2N}}\rvert$의 최솟값 $\dfrac{2\sqrt3}{3}$은 $\lvert\overrightarrow{\mathrm{O_1M}}+\overrightarrow{\mathrm{O_2N}}\rvert^2$의 값이 최소일 때 구할 수 있다. 따라서 다음의 식에 따라
        $$\lvert\overrightarrow{\mathrm{O_1M}}+\overrightarrow{\mathrm{O_2N}}\rvert^2=\lvert\overrightarrow{\mathrm{O_1M}}\rvert^2+2(\overrightarrow{\mathrm{O_1M}}\cdot\overrightarrow{\mathrm{O_2N}})+\lvert\overrightarrow{\mathrm{O_2N}}\rvert^2=\dfrac43$$
        두 벡터의 내적 $\overrightarrow{\mathrm{O_1M}}\cdot\overrightarrow{\mathrm{O_2N}}$의 최솟값이 $-\dfrac13$이 되도록 하는 점 M과 점 N의 위치를 찾도록 한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        벡터 $\overrightarrow{\mathrm{O_2N}}$을 점 $\mathrm{O_1}$이 시점이 되도록 평행이동한 벡터를 $\overrightarrow{\mathrm{O_1N'}}$이라고 하면 $\overrightarrow{\mathrm{O_2N}}=\overrightarrow{\mathrm{O_1N'}}$이고(제시문 [가]), 두 벡터 $\overrightarrow{\mathrm{O_1M}}$과 $\overrightarrow{\mathrm{O_1N'}}$이 이루는 각을 $\theta$라고 할 때 제시문 [나]에 의해
        $$\overrightarrow{\mathrm{O_1M}}\cdot\overrightarrow{\mathrm{O_2N}}=\overrightarrow{\mathrm{O_1M}}\cdot\overrightarrow{\mathrm{O_1N'}}=\lvert\overrightarrow{\mathrm{O_1M}}\rvert\lvert\overrightarrow{\mathrm{O_1N'}}\rvert\cos\theta=\cos\theta$$
        $\overrightarrow{\mathrm{O_1M}}\cdot\overrightarrow{\mathrm{O_2N}}$의 최솟값 $-\dfrac13$은 $\cos\theta$가 최소일 때 구할 수 있다. 이는 $\theta$가 최대일 때이므로, 점 M이 점 P와 일치하고, 점 $\mathrm{N'}$이 점 A와 일치할 때(즉, 점 N이 점 Q와 일치할 때) 얻을 수 있다. 따라서 두 벡터 $\overrightarrow{\mathrm{O_1P}}$와 $\overrightarrow{\mathrm{O_1A}}$가 이루는 각이 $\theta$가 되고, $\cos\theta=-\dfrac13$을 만족한다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        이때, 점 P로부터 선분 AB에 내린 수선의 발을 H라고 하면 $\angle\mathrm{PO_1H}=\pi-\theta$이므로 선분 $\mathrm{O_1H}$의 길이는
        $$\overline{\mathrm{O_1H}}=\cos(\pi-\theta)=-\cos\theta=\dfrac13$$
        (보충: P는 두 원 $\mathrm{O_1}$, $\mathrm{O_2}$(반지름 모두 1)의 교점이므로 $\overline{\mathrm{PO_1}}=\overline{\mathrm{PO_2}}$이고 H는 $\mathrm{O_1O_2}$의 중점이다.) 따라서 $\overline{\mathrm{O_1H}}=\overline{\mathrm{HO_2}}$이므로
        $$\overline{\mathrm{O_1O_2}}=\overline{\mathrm{O_1H}}+\overline{\mathrm{HO_2}}=\dfrac23$$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: '$\lvert\overrightarrow{\mathrm{O_1M}}+\overrightarrow{\mathrm{O_2N}}\rvert$이 최소가 되는 점 M과 점 N의 위치(M=P, N=Q)를 파악했다(공식 <8점>).'
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 8
      evidence: '$\overline{\mathrm{O_1O_2}}=\dfrac23$을 구했다(공식 <8점>).'
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6409}
  misconceptions:
  - id: MC-GEO-6409
    outcome_code: '70'
    wrong_work: '두 벡터의 합의 크기가 최소인 때를 M과 N이 가장 가까울 때(M=N=P)로 판단'
    detect_cue: M=N=P로 두고 계산하거나 $\overline{\mathrm{O_1O_2}}$가 $\dfrac23$이 아님
    feedback: 두 벡터의 시점을 $\mathrm{O_1}$으로 모아 사잇각이 가장 클 때를 찾으세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    $\lvert\overrightarrow{\mathrm{O_1M}}+\overrightarrow{\mathrm{O_2N}}\rvert$이 최소일 때 $\overline{\mathrm{MR}}^2$의 값을 구하고, 그 근거를 논술하시오. (12점)
  points: 12
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{14}{9}-\dfrac{4\sqrt{10}}{9}', equivalents: ['\dfrac{14-4\sqrt{10}}{9}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\mathrm{O_2}$를 원점으로 두면 $\mathrm{M}=\mathrm{P}\left(-\dfrac13,\dfrac{2\sqrt2}{3}\right)$, $\mathrm{R}\left(0,\dfrac{\sqrt5}{3}\right)$.'
    steps:
    - {id: 2a, content: '$\overline{\mathrm{MR}}^2=\dfrac19+\left(\dfrac{\sqrt5-2\sqrt2}{3}\right)^2$', criteria: [2.M1, 2.B1, 2.A1]}
    hint_ladder:
    - AB를 $x$축, CD를 $y$축으로 놓자.
    - R은 원 $\mathrm{O_1}$ 위의 점이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 4. 2024 논술고사 기출문제(의약학계).pdf 예시답안 p.11
    steps:
    - id: 2b-1
      content: |
        아래 그림과 같이 선분 AB를 $x$축, 선분 CD를 $y$축으로 하는 좌표평면을 잡으면 점 $\mathrm{O_2}$는 원점이다.
        [그림 2 설명: 그림 1에 좌표축을 넣은 것. $\mathrm{N'}=\mathrm{A}$, $\mathrm{N}=\mathrm{Q}$, $\mathrm{M}=\mathrm{P}$로 표시되고, P에서 $x$축에 내린 수선의 발 H, $\angle\mathrm{PO_1A}=\theta$ 표시.]
      criteria: [2.M1]
    - id: 2b-2
      content: |
        (1)에 의해 직각삼각형 $\mathrm{O_1O_2R}$에서 $\mathrm{O_1}\left(-\dfrac23,\ 0\right)$, $\mathrm{O_2}(0,\ 0)$이고, 선분 $\mathrm{O_2R}$의 길이는 $\overline{\mathrm{O_2R}}=\sqrt{1-\overline{\mathrm{O_1O_2}}^2}=\dfrac{\sqrt5}{3}$이므로 $\mathrm{R}\left(0,\ \dfrac{\sqrt5}{3}\right)$이다.
        또한 (1)에서 점 M은 점 P와 일치하고, $\overline{\mathrm{O_1H}}=\overline{\mathrm{HO_2}}=\dfrac13$이므로 $\mathrm{H}\left(-\dfrac13,\ 0\right)$이다. 선분 MH의 길이는 $\overline{\mathrm{MH}}=\sin(\pi-\theta)=\sqrt{1-\cos^2(\pi-\theta)}=\dfrac{2\sqrt2}{3}$이므로 $\mathrm{M}\left(-\dfrac13,\ \dfrac{2\sqrt2}{3}\right)$이다.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        따라서 제시문 [다]에 의해 $\overline{\mathrm{MR}}^2=\left(\dfrac13\right)^2+\left(\dfrac{\sqrt5}{3}-\dfrac{2\sqrt2}{3}\right)^2=\dfrac{14}{9}-\dfrac{4\sqrt{10}}{9}$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: 주어진 도형을 좌표평면 위에 놓았다(AB를 $x$축, CD를 $y$축 등)(공식 <2점>).
      depends_on: []
      implied_ok: true
      steps: [2b-1]
    - id: 2.B1
      mark_type: B
      points: 6
      evidence: '점 M$\left(-\dfrac13,\dfrac{2\sqrt2}{3}\right)$과 점 R$\left(0,\dfrac{\sqrt5}{3}\right)$의 좌표를 구했다(공식 <6점>).'
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: '$\overline{\mathrm{MR}}^2=\dfrac{14}{9}-\dfrac{4\sqrt{10}}{9}$을 구했다(공식 <4점>).'
      depends_on: [2.M1, 2.B1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-6410}
  misconceptions:
  - id: MC-GEO-6410
    outcome_code: '71'
    wrong_work: 'R을 원 $\mathrm{O_2}$ 위의 점 C$(0,1)$로 착각하거나 $\overline{\mathrm{O_2R}}=\sqrt{1+\overline{\mathrm{O_1O_2}}^2}$로 계산'
    detect_cue: R의 $y$좌표가 $\dfrac{\sqrt5}{3}$이 아님
    feedback: R은 중심 $\mathrm{O_1}$, 반지름 1인 반원 위의 점이므로 직각삼각형 $\mathrm{O_1O_2R}$에서 빗변이 1입니다.
    remedy: [RL-2]

