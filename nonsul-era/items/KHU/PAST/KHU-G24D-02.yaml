stimuli:
- label: 라
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능하면 $f(x)$는 $x=a$에서 연속이다.
- label: 마
  body: |
    함수 $f(x)$의 $x=a$에서의 극한값이 $L$이면 $x=a$에서의 우극한과 좌극한이 모두 존재하고 그 값은 모두 $L$과 같다. 또 그 역도 성립하므로 다음이 성립한다.
    $$\lim_{x\to a}f(x)=L\iff\lim_{x\to a+}f(x)=\lim_{x\to a-}f(x)=L$$
- label: 바
  body: |
    미분가능한 함수 $f(x)$의 도함수는
    $$f'(x)=\lim_{\Delta x\to0}\dfrac{f(x+\Delta x)-f(x)}{\Delta x}$$
- label: 사
  body: |
    곡선 $y=f(x)$ 위의 점 $(a,\ f(a))$에서 접하는 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: 아
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,\ b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$와 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b\lvert f(x)-g(x)\rvert dx$$

stem: |
  실수 전체에서 정의된 함수 $f(x)$가 아래 조건들을 모두 만족할 때, 다음 물음에 답하시오.

  (가) $f(x)$는 각 구간 $(-\infty,\ 1)$, $(1,\ \infty)$에서 이차함수이다.
  (나) $f(x)$는 미분가능한 함수이다.
  (다) $f(0)=f'(0)=f(2)=f'(2)=1$이다.

subparts:
- id: '1'
  stem: |
    $f'(1)$의 값을 구하고, 그 근거를 논술하시오. (12점)
  points: 12
  depends_on: []
  answer: {kind: value, value: '-1', equivalents: ["f'(1)=-1"], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g=\dfrac b2x^2+x+1$, $h=\dfrac c2(x-2)^2+(x-2)+1$에 $x=1$에서 연속·미분계수 일치를 적용한다.
    steps:
    - {id: 1a, content: '$\dfrac b2+2=\dfrac c2$, $b+1=-c+1$에서 $b=-2$, $c=2$, $f''(1)=-1$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 조건 (다)로 각 이차식을 미지수 하나로 나타내자.
    - $x=1$에서 연속이고 미분계수가 존재한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 4. 2024 논술고사 기출문제(의약학계).pdf 예시답안 p.13~14
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$를 구간 $(-\infty,\ 1)$에서 이차함수 $g(x)$, 구간 $(1,\ \infty)$에서 이차함수 $h(x)$라 두자. 이때, $g(x)$는 $f(0)=f'(0)=1$을 만족하는 이차함수이므로, $g'(x)=bx+1$, $g(x)=\dfrac12bx^2+x+1$이다.
        같은 방법으로, $f(2)=f'(2)=1$이므로 $h'(x)=c(x-2)+1$, $h(x)=\dfrac c2(x-2)^2+(x-2)+1$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $f(x)$가 미분가능한 함수이므로, $f(x)$는 $x=1$에서 연속이고 미분계수가 존재한다(제시문 [라]).
        즉, $f(x)$는 $x=1$에서 연속이므로 $g(1)=\displaystyle\lim_{x\to1-}f(x)=f(1)=\lim_{x\to1+}f(x)=h(1)$이다(제시문 [마]). 이를 이용하면, $\dfrac12b+2=\dfrac12c$이고,
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $f(x)$의 $x=1$에서 미분계수의 존재성으로부터 $\displaystyle\lim_{\Delta x\to0-}\dfrac{f(1+\Delta x)-f(1)}{\Delta x}=f'(1)=\lim_{\Delta x\to0+}\dfrac{f(1+\Delta x)-f(1)}{\Delta x}$이므로(제시문 [바]),
        $$\lim_{\Delta x\to0-}\dfrac{g(1+\Delta x)-g(1)}{\Delta x}=\lim_{\Delta x\to0-}\dfrac{\frac12b(1+\Delta x)^2+(1+\Delta x)+1-\left(\frac12b+1+1\right)}{\Delta x}=\lim_{\Delta x\to0-}\left(b+1+\dfrac12b\cdot\Delta x\right)=b+1$$
        $$\lim_{\Delta x\to0+}\dfrac{h(1+\Delta x)-h(1)}{\Delta x}=\lim_{\Delta x\to0+}\dfrac{\frac c2(1+\Delta x-2)^2+(1+\Delta x-2)+1-\left(\frac c2-1+1\right)}{\Delta x}=\lim_{\Delta x\to0+}\left(\dfrac c2\cdot\Delta x-c+1\right)=-c+1$$
        에 의해, $b+1=-c+1$이고, $b=-2$, $c=2$이다.
      criteria: [1.M1]
    - id: 1b-4
      content: |
        $g(x)=-x^2+x+1$, $h(x)=x^2-3x+3$이므로 각 구간에서 $f(x)=\begin{cases}g(x)&(x\le1)\\h(x)&(x\ge1)\end{cases}$이다.
        따라서 $f'(1)=b+1=-1$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: '주어진 조건에 맞는 각 구간별 이차함수 $g(x)=-x^2+x+1$, $h(x)=x^2-3x+3$을 구했다(연속·미분계수 일치 조건 사용)(공식 <8점>).'
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $f'(1)=-1$을 구했다(공식 <4점>).
      depends_on: [1.M1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6411}
  misconceptions:
  - id: MC-CAL-6411
    outcome_code: '70'
    wrong_work: '연속 조건 $\dfrac b2+2=\dfrac c2$ 하나만 쓰고 $b$, $c$를 정하지 못하거나 임의로 정함'
    detect_cue: 미분계수 일치식 $b+1=-c+1$이 없다
    feedback: 미분가능하려면 연속에 더해 좌·우 미분계수가 같아야 합니다(제시문 [바]).
    remedy: [RL-1]
- id: '2'
  stem: |
    상수 $a$에 대하여 $x_1=a$, $x_2=a+\dfrac12$이라 하자. 함수 $y=f(x)$의 그래프 위의 두 점 $(x_1,\ f(x_1))$, $(x_2,\ f(x_2))$에서의 접선을 각각 $l$, $m$이라 할 때, $l$과 $m$은 만나지 않는다. 곡선 $y=f(x)$와 두 직선 $l$, $x=x_2$로 둘러싸인 도형의 넓이를 $S$라고 할 때, $a$의 값과 $48S$를 구하고, 그 근거를 논술하시오. (20점)
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: 'a=\dfrac34,\ 48S=\dfrac32', equivalents: ['a=3/4'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 같은 이차식 위의 두 점의 접선은 평행할 수 없으므로 $\frac12<a<1$이고, $g'(a)=h'\!\left(a+\frac12\right)$.
    steps:
    - {id: 2a, content: '$-2a+1=2\left(a+\dfrac12\right)-3\Rightarrow a=\dfrac34$', criteria: [2.R1, 2.A1]}
    hint_ladder:
    - 두 접선이 만나지 않으려면 기울기가 어떠해야 하는가?
    - 한 이차함수에서 기울기가 같은 서로 다른 두 접점이 있을 수 있는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 4. 2024 논술고사 기출문제(의약학계).pdf 예시답안 p.14 (넓이 단계는 예시답안에 없어 보충)
    steps:
    - id: 2b-1
      content: |
        $x_1=a$, $x_2=a+\dfrac12$에서 $f(x_1)$과 $f(x_2)$는 $a$의 값의 범위에 따라 다음과 같다.
        $a\le\dfrac12$일 때 $f(x_1)=g(x_1)$, $f(x_2)=g(x_2)$
        $\dfrac12<a<1$일 때 $f(x_1)=g(x_1)$, $f(x_2)=h(x_2)$
        $a\ge1$일 때 $f(x_1)=h(x_1)$, $f(x_2)=h(x_2)$
        두 직선 $l$과 $m$이 만나지 않으려면 두 직선의 기울기가 같아야 하므로, $x_1$과 $x_2$는 각각 이차함수 $g$와 $h$가 정의되는 구간에 속해야 한다. 따라서 $\dfrac12<a<1$이다.
      criteria: [2.R1]
    - id: 2b-2
      content: |
        두 직선의 기울기가 같은 조건을 이용하여 $-2a+1=2\left(a+\dfrac12\right)-3$, 즉 $a=\dfrac34$이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        (보충 — 공식 예시답안에는 없음, 공식 채점은 문제 오류로 전원 10점) $l:\ y=-\dfrac12x+\dfrac{25}{16}$이고 $g(x)-l=-\left(x-\dfrac34\right)^2\le0$, $1\le x\le\dfrac54$에서 $h(x)-l=x^2-\dfrac52x+\dfrac{23}{16}<0$이므로 접점 $x=\dfrac34$부터 $x=\dfrac54$까지의 영역의 넓이는 제시문 [아]에 의해
        $$S=\int_{3/4}^{1}\left(x-\dfrac34\right)^2dx+\int_1^{5/4}\left(-x^2+\dfrac52x-\dfrac{23}{16}\right)dx=\dfrac{1}{192}+\dfrac{5}{192}=\dfrac{1}{32},\quad 48S=\dfrac32$$
        (단, $x=\dfrac54$의 오른쪽에도 $l$과 곡선이 $x=\dfrac{5+\sqrt2}{4}$에서 다시 만나 둘러싸인 영역($48S=\sqrt2$)이 있어 문제의 도형이 유일하지 않다.)
      criteria: [2.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: '$a$의 범위를 나누어 $l$과 $m$이 만나지 않으려면 $\dfrac12<a<1$임을 밝혔다(공식 <5점>).'
      depends_on: []
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: '기울기가 같은 조건으로 $a=\dfrac34$를 구했다(공식 <5점>).'
      depends_on: [2.R1]
      steps: [2b-2]
    - id: 2.B1
      mark_type: B
      points: 10
      evidence: '둘러싸인 도형의 넓이를 구한다(공식 <10점>). 공식 채점: 문제 오류로 인해 전원 10점 부여.'
      depends_on: []
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-6412}
  misconceptions:
  - id: MC-CAL-6412
    outcome_code: '71'
    wrong_work: '$g''(a)=g''\left(a+\dfrac12\right)$ 또는 $h''(a)=h''\left(a+\dfrac12\right)$를 풀어 해가 없다고 하거나 범위 밖의 $a$를 답함'
    detect_cue: $a$의 범위 분류 없이 하나의 이차식만으로 기울기를 같게 둠
    feedback: 한 이차함수 위의 서로 다른 두 점에서의 접선은 기울기가 다릅니다. 두 점이 서로 다른 구간에 있어야 합니다.
    remedy: [RL-2]

