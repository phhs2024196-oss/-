intent: |
  평면벡터의 기본 개념을 종합적으로 이해하고, 벡터의 뜻과 연산, 평면벡터의 성분과 내적을 응용할 수 있는지 파악한다. 주어진 평면도형을 이해하고 벡터를 활용하여 문제 해결을 위한 논리적인 방향을 제시하고 합리적으로 해결하는 능력을 평가한다(경희대 출제 의도 요지).
key_idea: '$\overrightarrow{PX}=\overrightarrow{QX}-\overrightarrow{QP}$로 분해하면 $\overrightarrow{QR}\cdot\overrightarrow{QX}$는 $\overrightarrow{QX}$의 $\overrightarrow{QR}$ 방향 정사영 길이에 비례하므로, 원 $O_2$에서 변 CD 에 접하는 점이 최대.'
stuck: (1)에서 원 $O_2$의 중심이 ∠DPR의 이등분선 위에 있어 $\overline{PD}=r(\sqrt3+1)$이 되는 것, (2)에서 내적을 정사영 길이로 바꾸는 것
idea_tags: [IDEA-TANGENT-CIRCLE-BISECTOR, IDEA-DOT-PROJECTION-MAX]
tags: [경희 실전, 평면벡터, 원과 정삼각형]
elements:
  materials: [한 변의 길이 4인 정사각형 ABCD, 정사각형에 내접하는 원 O1, 원 O1에 내접하는 정삼각형 PQR, 세 선분 PR·PD·CD에 접하는 원 O2, 원 O2 위를 움직이는 점 X]
  concepts: [원의 접선과 중심의 위치, 정삼각형의 성질, 직각이등변삼각형, 평면벡터의 연산, 평면벡터의 내적, 정사영]
  tools: [접선 두 개에 접하는 원의 중심은 각의 이등분선 위, 대각선 O1D 위에서 길이 빼기, 벡터 분해 PX = QX - QP, 내적 = |QR|×(QX의 QR 방향 정사영 길이)]
  conditions:
  - '점 P 는 변 AD 위 ⇒ 원 $O_1$과 AD 의 접점 = AD 의 중점, $\overline{PD}=2$'
  - '원 $O_2$가 PD·CD 에 접함 ⇒ 중심 $O_2$는 대각선 $O_1D$ 위'
  - '원 $O_2$가 PR·PD 에 접함 ⇒ $\angle DPO_2=\dfrac{\pi}{6}$'
  - '$\overrightarrow{QR}$이 변 BC 와 평행 ⇒ 정사영이 최대인 X 는 변 CD 와의 접점'
