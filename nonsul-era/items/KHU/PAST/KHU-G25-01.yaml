stimuli:
- label: 가
  body: |
    평면벡터의 내적
    두 평면벡터 $\vec{a}$, $\vec{b}$가 이루는 각의 크기가 $\theta(0^\circ\le\theta\le180^\circ)$일 때,
    $$\vec{a}\cdot\vec{b}=|\vec{a}||\vec{b}|\cos\theta$$

stem: |
  <그림 1>과 같이 중심을 각각 점 $\mathrm{O}_1$, 점 $\mathrm{O}_2$로 하는 두 원 $O_1$, $O_2$가 있다. 이때, 원 $O_1$은 정사각형 ABCD에 내접하고, 정삼각형 PQR는 원 $O_1$에 내접한다. 또한 원 $O_2$는 세 선분 PR, PD, CD와 모두 접한다. 정사각형 ABCD의 한 변의 길이가 4라고 할 때, 다음 물음에 답하시오. (단, 점 P는 변 AD 위에 있다.)
  [그림 1 설명: 정사각형 ABCD(왼쪽 위 A, 오른쪽 위 D, 왼쪽 아래 B, 오른쪽 아래 C). 원 $O_1$은 정사각형에 내접하고 중심 $\mathrm{O}_1$은 정사각형의 중심. 꼭짓점 P 는 변 AD 의 중점(원 $O_1$과 AD 의 접점), Q 는 왼쪽 아래, R 는 오른쪽 아래에 있으며 변 QR 는 BC 와 평행. 작은 원 $O_2$는 오른쪽 위 모서리 D 근처에서 변 AD(선분 PD), 변 CD, 선분 PR 에 접한다. 선분 $\mathrm{O}_1\mathrm{O}_2$가 그려져 있다.]

subparts:
- id: '1'
  stem: |
    선분 $\mathrm{O}_1\mathrm{O}_2$의 길이를 구하고 그 근거를 논술하시오. (14점)
  points: 14
  depends_on: []
  answer: {kind: value, value: '3\sqrt{2}-\sqrt{6}', equivalents: ['\sqrt2(3-\sqrt3)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 원 $O_2$의 중심은 ∠DPR의 이등분선과 대각선 $O_1D$ 위에 있으므로 $\overline{PD}=r\sqrt3+r$에서 $r$을 구하고 $\overline{O_1D}-\overline{O_2D}$를 계산한다.
    steps:
    - {id: 1a, content: '$r(\sqrt3+1)=2\Rightarrow r=\sqrt3-1$, $\overline{O_1O_2}=2\sqrt2-r\sqrt2=3\sqrt2-\sqrt6$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - P 는 변 AD 의 어디에 있는가?
    - 두 선분 PD, PR 에 접하는 원의 중심은 어떤 선 위에 있는가?
    - 원 $O_2$의 중심과 $O_1$, D 의 위치 관계를 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 3. 2025 논술고사 기출문제(자연계).pdf 예시 답안 p.5
    steps:
    - id: 1b-1
      content: |
        정사각형 ABCD의 한 변의 길이가 4이고, 점 P는 변 AD의 중점이므로 선분 PD의 길이는 2이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        원 $O_2$의 반지름을 $r$이라고 할 때, $\angle DPR=\dfrac{\pi}{3}$, $\angle DPO_2=\dfrac{\pi}{6}$이므로(원 $O_2$는 두 선분 PD, PR 에 접하므로 중심은 ∠DPR의 이등분선 위), 선분 PD의 길이는 $r\sqrt3+r=r(\sqrt3+1)$이고, 따라서 $r=\dfrac{2}{\sqrt3+1}=\sqrt3-1$.
      criteria: [1.M1, 1.A1]
    - id: 1b-3
      content: |
        또한 세 점 $\mathrm{O}_1$, $\mathrm{O}_2$, D는 모두 한 직선 위에 있으므로 $\overline{O_1O_2}=\overline{O_1D}-\overline{O_2D}$이고, $\overline{O_1P}=\overline{PD}=2$로부터 직각이등변삼각형 $\mathrm{PO_1D}$에서 $\overline{O_1D}=2\sqrt2$, $\overline{O_2D}=r\sqrt2=(\sqrt3-1)\sqrt2$이고
        $\overline{O_1O_2}=2\sqrt2-(\sqrt3-1)\sqrt2=3\sqrt2-\sqrt6$.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $\overline{PD}=2$와 $\angle DPO_2=\dfrac{\pi}{6}$(중심이 각의 이등분선 위)을 이용해 $\overline{PD}$를 $r$로 나타낸 식이 있다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        (공식 <6점> 도형의 위치 관계를 이해하여 원 $O_2$의 반지름 $r=\sqrt3-1$을 구한다 — M1과 나눔) $r=\sqrt3-1$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 8
      evidence: |
        (공식 <8점>) 세 점 $\mathrm{O}_1$, $\mathrm{O}_2$, D 가 한 직선 위에 있음을 근거로 $\overline{O_1O_2}=\overline{O_1D}-\overline{O_2D}=3\sqrt2-\sqrt6$을 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6301}
  - {code: '71', misconception: MC-GEO-6302}
  misconceptions:
  - id: MC-GEO-6301
    outcome_code: '70'
    wrong_work: '$\overline{PD}=r\sqrt3$ 또는 $\overline{PD}=r$로 두어 $r=\dfrac{2}{\sqrt3}$, $r=2$ 등을 얻음'
    detect_cue: $r$이 $\sqrt3-1$이 아니고 $\dfrac{\pi}{6}$ 각을 쓴 흔적이 없다
    feedback: 두 접선에 접하는 원의 중심은 두 접선이 이루는 각의 이등분선 위에 있습니다. P 에서 접점까지는 $r\cot\dfrac{\pi}{6}$, 접점에서 D 까지는 $r$입니다.
    remedy: [RL-1]
  - id: MC-GEO-6302
    outcome_code: '71'
    wrong_work: '$\overline{O_1O_2}=\overline{O_1D}+\overline{O_2D}=2\sqrt2+(\sqrt3-1)\sqrt2$'
    detect_cue: 답이 $\sqrt2+\sqrt6$
    feedback: $\mathrm{O}_2$는 선분 $\mathrm{O_1D}$ 위(D 쪽)에 있습니다. 길이를 빼야 합니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    원 $O_2$ 위를 움직이는 점 X에 대하여 $\overrightarrow{QR}\cdot\overrightarrow{PX}$의 최댓값을 구하고 그 근거를 논술하시오. (16점)
  points: 16
  depends_on: ['1']
  answer: {kind: value, value: '4\sqrt{3}', equivalents: ['4\sqrt3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{QR}\cdot\overrightarrow{PX}=\overrightarrow{QR}\cdot\overrightarrow{QX}-\overrightarrow{QR}\cdot\overrightarrow{QP}$에서 앞 항은 $2\sqrt3\times$(정사영 길이)이므로 X 가 변 CD 와의 접점일 때 최대.
    steps:
    - {id: 2a, content: '$2\sqrt3(2+\sqrt3)-6=4\sqrt3$', criteria: [2.R1, 2.A1]}
    hint_ladder:
    - $\overrightarrow{PX}$를 Q 를 시점으로 하는 두 벡터의 차로 써 보자.
    - $|\overrightarrow{QX}|\cos\theta$는 무엇의 길이인가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 3. 2025 논술고사 기출문제(자연계).pdf 예시 답안 p.6
    steps:
    - id: 2b-1
      content: |
        $\overrightarrow{QR}\cdot\overrightarrow{PX}=\overrightarrow{QR}\cdot(\overrightarrow{QX}-\overrightarrow{QP})=\overrightarrow{QR}\cdot\overrightarrow{QX}-\overrightarrow{QR}\cdot\overrightarrow{QP}$이다. 이때, 정삼각형 PQR에서 $|\overrightarrow{QR}|=|\overrightarrow{QP}|=2\sqrt3$이고, 두 벡터 $\overrightarrow{QR}$와 $\overrightarrow{QP}$가 이루는 각은 $\dfrac{\pi}{3}$이므로 $\overrightarrow{QR}\cdot\overrightarrow{QP}=|\overrightarrow{QR}||\overrightarrow{QP}|\cos\dfrac{\pi}{3}=6$이다(제시문 [가]).
      criteria: [2.A1]
    - id: 2b-2
      content: |
        또한 두 벡터 $\overrightarrow{QR}$와 $\overrightarrow{QX}$가 이루는 각을 $\theta$라 하면 $\overrightarrow{QR}\cdot\overrightarrow{QX}=|\overrightarrow{QR}||\overrightarrow{QX}|\cos\theta=2\sqrt3|\overrightarrow{QX}|\cos\theta$이다. 점 X를 직선 QR에 내린 수선의 발을 점 X′이라고 하면 $|\overrightarrow{QX}|\cos\theta$의 값은 선분 QX′의 길이이므로, 이 값이 최대가 되도록 하는 점 X는 원 $O_2$와 변 CD가 접하는 점이면 된다.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        따라서 $|\overrightarrow{QX}|\cos\theta=\overline{QX'}=2+\sqrt3$(Q 에서 변 CD 까지의 거리: $\sqrt3+2$). 따라서 $\overrightarrow{QR}\cdot\overrightarrow{PX}$의 최댓값은
        $\overrightarrow{QR}\cdot\overrightarrow{PX}=\overrightarrow{QR}\cdot\overrightarrow{QX}-\overrightarrow{QR}\cdot\overrightarrow{QP}=2\sqrt3(2+\sqrt3)-6=4\sqrt3$.
      criteria: [2.A1]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    key_idea: 좌표로 $\mathrm{O}_1(0,0)$, $P(0,2)$, $Q(-\sqrt3,-1)$, $R(\sqrt3,-1)$로 두면 $\overrightarrow{QR}=(2\sqrt3,0)$이므로 $\overrightarrow{QR}\cdot\overrightarrow{PX}=2\sqrt3\,x_X$이고, 원 $O_2$ 위에서 $x_X$의 최댓값은 2(변 CD).
    steps:
    - {id: 2c-1, content: '$2\sqrt3\times2=4\sqrt3$', criteria: [2.R1, 2.A1]}
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 8
      evidence: |
        (공식 <8점>) 주어진 식이 최대가 되도록 하는 점 X 의 위치(원 $O_2$와 변 CD 가 접하는 점)를 정사영 길이 등의 근거와 함께 설명했다.
      depends_on: []
      steps: [2b-2, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 8
      evidence: |
        (공식 <8점>) 평면벡터를 이해하여 $\overrightarrow{QR}\cdot\overrightarrow{PX}$의 최댓값 $4\sqrt3$을 구했다.
      depends_on: [2.R1]
      steps: [2b-1, 2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6303}
  misconceptions:
  - id: MC-GEO-6303
    outcome_code: '70'
    wrong_work: 'X 를 원의 중심 $\mathrm{O}_2$로 두어 $2\sqrt3(2-r)=6\sqrt3-6$을 최댓값으로 답함'
    detect_cue: 답이 $6\sqrt3-6$ 또는 반지름 $r$을 더하지 않은 값
    feedback: 내적은 $\overrightarrow{QR}$ 방향 정사영 길이에 비례합니다. 원 위에서 그 길이가 가장 긴 점(중심에서 $r$만큼 더 간 점)을 찾으세요.
    remedy: [RL-2]

