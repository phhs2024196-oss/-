intent: |
  선분의 내분점과 외분점, 매개변수로 나타낸 함수, 이차곡선 등을 종합적으로 이해하고 응용할 수 있는지 파악한다. 주어진 조건으로부터 수학적으로 추론하고, 상황을 수학적으로 표현하여 합리적으로 해결하는 능력을 평가한다(경희대 출제 의도 요지).
key_idea: '$\overline{PQ}=\overline{OQ}=2$에서 $Q\left(\dfrac t2,\sqrt{4-\dfrac{t^2}{4}}\right)$, R 은 PQ 를 5:3 으로 외분하는 점 → $y=5\sqrt{1-x^2}$. 교점은 $(y-5)(y-25a+5)=0$.'
