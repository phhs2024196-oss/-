  concepts: [사인법칙, 직각삼각형의 삼각비, 삼각함수의 덧셈정리, 닮음, 등비급수, 도함수의 부호와 증감표]
  tools: [사인법칙으로 OP2 를 OP1 로 표현, 수선의 발로 OP3 = sinα·OP2, α 를 π/2-β 로 바꾸어 같은 과정 반복, 사인·코사인 변환, 닮음비 = 공비, 등비급수 합 공식, 곱의 미분 후 덧셈정리로 f′ 정리, 증감표]
