intent: |
  사인법칙, 등비급수, 삼각함수의 덧셈정리, 함수의 미분 등을 이해하여 주어진 상황을 수학적으로 표현하고 문제 해결을 위한 논리적인 방향을 제시하여 합리적으로 해결할 수 있는 능력을 평가한다(경희대 출제 의도 요지).
key_idea: '삼각형 $\mathrm{OP_1P_2}$에서 사인법칙으로 $\overline{OP_2}=\dfrac{2}{\sqrt3}\sin\left(\alpha+\dfrac\pi3\right)\overline{OP_1}$, 수선의 발로 $\overline{OP_3}=\sin\alpha\,\overline{OP_2}$, 같은 과정을 α 대신 $\dfrac\pi2-\beta$로 반복 → 한 바퀴마다 같은 비율의 등비급수.'
stuck: 삼각형 $\mathrm{OP_1P_2}$에서 ∠$\mathrm{OP_1P_2}=\pi-\left(\alpha+\dfrac\pi3\right)$를 찾는 것, 직선 m 에서 각을 $\dfrac\pi2-\beta$로 바꾸는 것
idea_tags: [IDEA-SINE-LAW-CHAIN, IDEA-SIMILAR-RATIO-GEOM-SERIES, IDEA-TRIG-PRODUCT-TO-SUM-MAX]
tags: [경희 실전, 사인법칙, 등비급수, 덧셈정리]
