intent: |
  이차곡선의 기본 개념들을 종합적으로 이해하고, 수열의 극한에 대한 성질들을 활용할 수 있는지 파악한다. 이차곡선이 좌표평면에서 방정식으로 표현되어 대수적으로 다룰 수 있음을 인식하고, 수열과 그 극한의 성질들을 바르게 이해하여 문제를 논리적으로 해결할 수 있는지 평가한다(경희대 출제 의도 요지).
key_idea: '원점을 지나고 초점이 $(p,0)$, $(t,0)$인 타원은 중심 $\left(\dfrac{t+p}2,0\right)$, $a=\dfrac{t+p}2$, $b^2=pt$. 접선 기울기는 평행이동으로 원점 중심 타원의 접선 공식에 맡긴다.'
stuck: 원점이 장축의 한 끝점이라 $a=\dfrac{t+p}{2}$가 되는 것, (2)에서 평행이동한 타원의 접선 기울기를 [나]로 구하는 것
idea_tags: [IDEA-ELLIPSE-THROUGH-ORIGIN-AXES, IDEA-TRANSLATE-THEN-TANGENT, IDEA-LIMIT-DOMINANT-TERM]
tags: [경희 실전, 의약학, 타원, 수열의 극한]
elements:
  materials: [x축 위에 두 초점이 있고 원점을 지나는 타원, 타원의 네 꼭짓점을 꼭짓점으로 하는 마름모, 초점 (p,0)·(n,0) 인 타원 위 x좌표 k 인 점의 접선 기울기 a_n]
  concepts: [타원의 정의와 표준형(제시문 가), 타원의 접선의 방정식(제시문 나), 도형의 평행이동(제시문 다), 수열의 극한(제시문 라), 마름모의 닮음]
  tools: [중심 = 두 초점의 중점, 원점이 꼭짓점이므로 a = 중심의 x좌표, b² = a² - c² = pt, 마름모 닮음 ⇔ 장축·단축 비 같음, 이차방정식 풀기, 원점 중심 타원으로 평행이동 후 접선 공식, 분자·분모 최고차항 비교]
  conditions:
  - '$t\neq3p$ ⇒ 두 근 중 $t=\dfrac p3$만 남음'
  - '$k<p$ ⇒ x좌표 k 인 점이 타원 위에 있고 $a-k>0$'
  - '$y$좌표가 0보다 큼 ⇒ $m=\dfrac ba\sqrt{2ak-k^2}>0$'
  stimuli_used: [가, 나, 다, 라]
  subpart_links: (2)는 (1)에서 구한 a=(t+p)/2, b=√(pt) 를 t=n 으로 사용

