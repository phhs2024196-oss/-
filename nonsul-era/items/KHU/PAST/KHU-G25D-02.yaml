stimuli:
- label: 마
  body: |
    사건 $A$가 일어났을 때의 사건 $B$의 조건부확률은
    $$\mathrm{P}(B|A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}\ (\text{단, }\mathrm{P}(A)>0)$$

stem: |
  원점 O를 출발하여 좌표평면 위를 움직이는 점이 있다. 한 개의 동전과 한 개의 주사위를 각각 던져, 동전의 앞면이 나오면 $x$축의 양의 방향으로, 뒷면이 나오면 $y$축의 양의 방향으로 주사위에서 나온 눈의 수만큼 이동한다. 이와 같은 시행을 한 번 하여 이동한 점을 $\mathrm{P}_1$, 점 $\mathrm{P}_1$에서 이 시행을 다시 하여 이동한 점을 $\mathrm{P}_2$, 점 $\mathrm{P}_2$에서 이 시행을 다시 하여 이동한 점을 $\mathrm{P}_3$이라 하자. 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    세 선분 $\mathrm{OP}_1$, $\mathrm{P_1P_2}$, $\mathrm{P_2O}$로 둘러싸인 도형의 넓이가 6 이상일 확률을 구하고 그 근거를 논술하시오. (단, 세 점 O, $\mathrm{P}_1$, $\mathrm{P}_2$가 일직선 위에 있을 때는 도형의 넓이를 0으로 한다.) (8점)
  points: 8
  depends_on: []
  answer: {kind: value, value: '\dfrac{17}{72}', equivalents: ['17/72'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 삼각형이 되려면 HT 또는 TH(확률 $\dfrac12$), 넓이 $\dfrac{ab}{2}\ge6\iff ab\ge12$(17쌍).
    steps:
    - {id: 1a, content: '$\dfrac12\times\dfrac{17}{36}=\dfrac{17}{72}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 동전이 두 번 모두 같은 면이면 세 점은 어떻게 놓이는가?
    - HT 일 때 세 점의 좌표를 써 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 4. 2025 논술고사 기출문제(의약학계).pdf 예시 답안 p.13
    steps:
    - id: 1b-1
      content: |
        동전의 앞면이 나오는 것을 H, 동전의 뒷면이 나오는 것을 T로 나타내자. 세 선분 $\mathrm{OP}_1$, $\mathrm{P_1P_2}$, $\mathrm{P_2O}$로 둘러싸인 도형의 넓이가 6 이상이 되려면, 세 점 O, $\mathrm{P}_1$, $\mathrm{P}_2$가 삼각형을 이뤄야 하며, 따라서 첫 번째 시행과 두 번째 시행에서 동전이 HT나 TH로 나와야 한다. 이 조건을 만족할 확률은 $\dfrac12$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        또한, 첫 번째 시행과 두 번째 시행에서 나온 주사위의 눈의 수를 각각 $a$, $b$라 하면 (넓이가 $\dfrac{ab}{2}$이므로) $ab\ge12$여야 한다. 이를 만족하는 $(a,b)$ 순서쌍은 총 17개이며, 따라서 이 확률은 $\dfrac{17}{36}$이다. 그러므로 구하는 확률은
        $$\dfrac12\times\dfrac{17}{36}=\dfrac{17}{72}$$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: (공식 <3점>) 동전이 HT 또는 TH 로 나와야 삼각형이 됨(확률 $\dfrac12$)을 파악했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: (공식 <5점>) $ab\ge12$인 순서쌍 17개를 세어 넓이가 6 이상일 확률 $\dfrac{17}{72}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6312}
  misconceptions:
  - id: MC-PRB-6312
    outcome_code: '70'
    wrong_work: '동전 조건을 빼고 $\dfrac{17}{36}$으로 답하거나, HT 만 세어 $\dfrac14\times\dfrac{17}{36}$으로 답함'
    detect_cue: 답이 $\dfrac{17}{36}$ 또는 $\dfrac{17}{144}$
    feedback: 동전이 HT, TH 두 경우 모두 삼각형이 되고, 각 경우 넓이는 $\dfrac{ab}{2}$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    세 선분 $\mathrm{OP}_2$, $\mathrm{P_2P_3}$, $\mathrm{P_3O}$로 둘러싸인 도형의 넓이가 18 이상일 때, 세 번째 시행에서 던진 주사위에서 나온 눈의 수가 6일 확률을 구하고 그 근거를 논술하시오. (단, 세 점 O, $\mathrm{P}_2$, $\mathrm{P}_3$이 일직선 위에 있을 때는 도형의 넓이를 0으로 한다.) (24점)
  points: 24
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{19}{32}', equivalents: ['19/32'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: HTT·HTH·THH·THT 는 각각 한 순서쌍(6,6)뿐, HHT·TTH 는 $(a+b)c\ge36$인 52개. $\mathrm{P}(A)=\dfrac{2}{27}$, $\mathrm{P}(A\cap B)=\dfrac{19}{432}$.
    steps:
    - {id: 2a, content: '$\mathrm{P}(B|A)=\dfrac{19/432}{2/27}=\dfrac{19}{32}$', criteria: [2.M1, 2.A1, 2.A2]}
    hint_ladder:
    - 세 번의 동전 결과 중 삼각형이 되는 경우를 모두 나열하자.
    - HHT 일 때 $\mathrm{P}_2$, $\mathrm{P}_3$의 좌표와 넓이는?
    - 조건부확률의 분모와 분자를 따로 구하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 4. 2025 논술고사 기출문제(의약학계).pdf 예시 답안 p.13~14
    steps:
    - id: 2b-1
      content: |
        세 선분 $\mathrm{OP}_2$, $\mathrm{P_2P_3}$, $\mathrm{P_3O}$로 둘러싸인 도형의 넓이가 18 이상이 되려면, 세 점 O, $\mathrm{P}_2$, $\mathrm{P}_3$이 삼각형을 이뤄야 한다. 세 점 O, $\mathrm{P}_2$, $\mathrm{P}_3$이 삼각형을 이루려면, 세 번의 시행에서 동전이 HTT, HTH, HHT, THH, THT, TTH로 나와야 한다. 넓이가 18 이상인 사건을 $A$, 세 번째 시행에서 던진 주사위에서 나온 눈의 수가 6인 사건을 $B$라 하자.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        1) HTT 인 경우: 동전이 HTT로 나올 확률은 $\dfrac18$이며, 이때 각 시행에서 나온 주사위의 눈의 수를 차례대로 $a$, $b$, $c$라 하면 $ac\ge36$이어야 하며, 이를 만족하는 $(a,c)$ 순서쌍은 1개이다. 따라서, 이때의 확률은 $\dfrac18\times\dfrac1{36}=\dfrac1{288}$.
        2) HTH 인 경우: 동전이 HTH로 나올 확률은 $\dfrac18$이며, $bc\ge36$이어야 하며, 이를 만족하는 $(b,c)$ 순서쌍은 1개이다. 따라서, 이때의 확률은 $\dfrac18\times\dfrac1{36}=\dfrac1{288}$.
        3) HHT 인 경우: 동전이 HHT로 나올 확률은 $\dfrac18$이며, $(a+b)c\ge36$이어야 한다. 이를 만족하는 $(a,b,c)$ 순서쌍의 개수는 $c=6$일 때 $a+b\ge6$인 순서쌍 26개, $c=5$일 때 $a+b\ge8$인 순서쌍 15개, $c=4$일 때 $a+b\ge9$인 순서쌍 10개, $c=3$일 때 $a+b\ge12$인 순서쌍 1개로 총 52개이다. 따라서, 이때의 확률은 $\dfrac18\times\dfrac{52}{216}=\dfrac{52}{1728}=\dfrac{13}{432}$.
        4) THH인 경우는 1) HTT인 경우와 동일하므로, 확률은 $\dfrac1{288}$이다.
        5) THT인 경우는 2) HTH인 경우와 동일하므로, 확률은 $\dfrac1{288}$이다.
        6) TTH인 경우는 3) HHT인 경우와 동일하므로, 확률은 $\dfrac{13}{432}$이다.
        따라서, $\mathrm{P}(A)=\dfrac1{288}+\dfrac1{288}+\dfrac{13}{432}+\dfrac1{288}+\dfrac1{288}+\dfrac{13}{432}=\dfrac{32}{432}=\dfrac2{27}$
      criteria: [2.A1]
    - id: 2b-3
      content: |
        한편, 넓이가 18 이상이면서 세 번째 시행에서 던진 주사위에서 나온 눈의 수가 6일 확률을 비슷한 방법으로 구하면, 1) HTT인 경우 $\dfrac1{288}$ 2) HTH인 경우 $\dfrac1{288}$ 3) HHT인 경우 $\dfrac{13}{864}$ 4) THT인 경우 $\dfrac1{288}$ 5) THH인 경우 $\dfrac1{288}$ 6) TTH인 경우 $\dfrac{13}{864}$이므로
        $\mathrm{P}(A\cap B)=\dfrac1{288}+\dfrac1{288}+\dfrac{13}{864}+\dfrac1{288}+\dfrac1{288}+\dfrac{13}{864}=\dfrac{19}{432}$
        따라서, 구하는 확률은 (제시문 [마])
        $$\mathrm{P}(B|A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}=\dfrac{\dfrac{19}{432}}{\dfrac2{27}}=\dfrac{19}{32}$$
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: (공식 <5점>) 삼각형이 되는 동전 결과 6가지(HTT, HTH, HHT, THH, THT, TTH)를 파악했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: (공식 <10점>) 경우별 넓이 조건과 순서쌍 개수로 넓이가 18 이상일 확률 $\mathrm{P}(A)=\dfrac2{27}$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 9
      evidence: (공식 <9점>) $\mathrm{P}(A\cap B)=\dfrac{19}{432}$를 구하고 조건부확률 $\dfrac{19}{32}$를 구했다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6313}
  - {code: '71', misconception: MC-PRB-6312}
  misconceptions:
  - id: MC-PRB-6313
    outcome_code: '70'
    wrong_work: '$\mathrm{P}(A\cap B)=\dfrac{19}{432}$을 답으로 씀(조건부확률의 분모 누락)'
    detect_cue: 최종 답이 $\dfrac{19}{432}$
    feedback: '「넓이가 18 이상일 때」는 조건입니다. $\mathrm{P}(A)$로 나누어야 합니다.'
    remedy: [RL-2]
  - id: MC-PRB-6312
    outcome_code: '71'
    wrong_work: 'HHT 에서 넓이를 $\dfrac{abc}{2}$ 등으로 세우거나 HTT·THH 대칭 경우를 빠뜨림'
    detect_cue: $\mathrm{P}(A)$가 $\dfrac2{27}$이 아니고 경우가 6가지보다 적다
    feedback: 각 동전 결과마다 $\mathrm{P}_2$, $\mathrm{P}_3$의 좌표를 써서 넓이를 구하세요. HHT 이면 $\mathrm{P}_2(a+b,0)$, $\mathrm{P}_3(a+b,c)$입니다.
    remedy: [RL-1]

