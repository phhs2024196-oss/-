intent: |
  확률 및 조건부확률을 구하는 방법을 이해하며, 주어진 조건으로부터 경우를 나누어 수학적으로 추론하고, 단순한 공식의 적용보다는 주어진 상황을 올바르게 이해하여 논리적인 방향을 제시하고 합리적으로 해결할 수 있는 능력을 평가한다(경희대 출제 의도 요지).
key_idea: 'O 와 두 점이 삼각형을 이루려면 동전 결과가 섞여야 하고, 넓이는 직각삼각형·사다리꼴 꼴의 단순한 곱 $\dfrac{ab}{2}$, $\dfrac{(a+b)c}{2}$ 등으로 정리된다.'
