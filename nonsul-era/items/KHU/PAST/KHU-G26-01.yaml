key_idea: '$u=t^{\frac{2n+1}{2}}$로 두면 $\dfrac{dy}{dx}=\dfrac12\left(u-\dfrac1u\right)$이고, 속력 $\sqrt{x''^2+y''^2}$은 완전제곱 $t^{2n}+\dfrac1t$로 정리된다.'
