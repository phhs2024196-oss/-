  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6204}
  misconceptions:
  - id: MC-PRB-6204
    outcome_code: '70'
    wrong_work: '$g(p)=g_1(p)+g_2(p)$ 또는 $\dfrac12\{g_1(p)+g_2(p)\}$로 돌림판 확률 $\dfrac45$, $\dfrac15$를 반영하지 않음'
    detect_cue: $g(p)$ 식에 $\dfrac45$, $\dfrac15$가 없다
    feedback: 각 경우가 일어날 확률을 곱해서 더해야 합니다(곱셈정리). 영역 1~4가 나올 확률은 $\dfrac45$입니다.
    remedy: [RL-2]

