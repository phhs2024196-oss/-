stimuli:
- label: 다
  body: |
    두 사건 $A$, $B$에 대하여 $\mathrm{P}(A\cap B)=\mathrm{P}(A)\mathrm{P}(B\mid A)=\mathrm{P}(B)\mathrm{P}(A\mid B)$이다. (단, $\mathrm{P}(A)>0$, $\mathrm{P}(B)>0$)

stem: |
  <그림 1>의 말판에서 처음에 말은 맨 왼쪽 점에서 출발한다. 그리고 앞면(둥근 면)이 나올 확률이 $p\ (0<p<1)$이고 뒷면(평평한 면)이 나올 확률이 $1-p$인 윷짝 한 개를 계속해서 던진다. 앞면이 나오면 말은 오른쪽으로 한 칸 이동하고, 뒷면이 나오면 말은 이동하지 않는다. 다음 물음에 답하시오.
  [그림 1 설명: 가로 선분 위에 같은 간격으로 점 4개가 있고, 맨 왼쪽 점 옆에 '출발'과 오른쪽 화살표가 표시되어 있다. 즉 맨 오른쪽 점까지 3칸.]

subparts:
- id: '1'
  stem: |
    처음 윷짝을 던진 결과가 앞면이 나왔을 때, 뒷면이 세 번 나오기 전에 말이 맨 오른쪽 점까지 도달할 확률 $f(p)$를 구하고, 그 근거를 논술하시오. (12점)
  points: 12
  depends_on: []
  answer: {kind: expression, value: 'p^2(3p^2-8p+6)', equivalents: ['3p^4-8p^3+6p^2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '남은 2칸: 뒷면 $k$번($k=0,1,2$), 마지막은 앞면 ⇒ 배열 $k+1$가지, $f=p^2\sum(k+1)(1-p)^k$.'
    steps:
    - {id: 1a, content: '$f(p)=p^2\{1+2(1-p)+3(1-p)^2\}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 첫 앞면 뒤 말은 두 번째 점에 있다. 앞면이 몇 번 더 필요한가?
    - 마지막 던짐은 반드시 앞면이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 3. 2026 논술고사 기출문제(자연계).pdf 예시 답안 p.7
    steps:
    - id: 1b-1
      content: |
        윷짝을 던진 첫 결과가 앞면이면 말은 왼쪽에서 두 번째 점(현재위치)에 있다. 다음에 앞면은 두 번 나와야 하고, 뒷면은 최대 두 번 나와야 하며, 마지막은 앞면으로 끝나야 한다. 뒷면의 개수로 경우를 나누면
        뒷면 0번: 앞앞 ⇒ 확률 $p^2$
        뒷면 1번: 앞뒤앞, 뒤앞앞 ⇒ 확률 $2p^2(1-p)$
        뒷면 2번: 앞뒤뒤앞, 뒤앞뒤앞, 뒤뒤앞앞 ⇒ 확률 $3p^2(1-p)^2$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 $f(p)=p^2\{1+2(1-p)+3(1-p)^2\}=p^2(3p^2-8p+6)$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 9
      evidence: '뒷면의 개수(0, 1, 2번)에 따른 각각의 확률 $p^2$, $2p^2(1-p)$, $3p^2(1-p)^2$을 구했다.'
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: '확률을 합쳐 $f(p)=p^2(3p^2-8p+6)$으로 정리했다.'
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6203}
  misconceptions:
  - id: MC-PRB-6203
    outcome_code: '70'
    wrong_work: '뒷면 2번인 경우를 ${}_4\mathrm{C}_2=6$가지로 세어 $6p^2(1-p)^2$으로 계산'
    detect_cue: 계수가 1, 3, 6 처럼 조합 전체 수로 되어 있다
    feedback: 오른쪽 끝에 도달하면 던지기가 끝나므로 마지막은 반드시 앞면입니다. 마지막을 고정하고 앞의 배열만 세세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    $1,2,3,4,5$라는 다섯 개의 영역이 있는 돌림판이 있고, 각 영역이 나올 확률은 동일하다. 돌림판을 돌려서 영역 $1,2,3,4$ 중 하나가 나오면 말을 왼쪽에서 세 번째 점에 두고, 반면에 영역 $5$가 나오면 말을 왼쪽에서 두 번째 점에 둔다. 그 후에 윷짝을 계속해서 던져서 뒷면이 두 번 나오기 전에 말이 맨 오른쪽 점까지 도달할 확률을 $g(p)$라고 하자. (1)에서 구한 $f(p)$에 대하여 $f(p)=g(p)$인 $p$의 값을 구하고, 그 근거를 논술하시오. (단, $0<p<1$) (21점)
  points: 21
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{8}{15}', equivalents: ['8/15'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$g=\dfrac45p(2-p)+\dfrac15p^2(3-2p)$, $f=g$ ⇒ $(p-1)^2(15p-8)=0$.'
    steps:
    - {id: 2a, content: '$15p^3-38p^2+31p-8=(p-1)^2(15p-8)=0$, $p<1$ ⇒ $p=\dfrac{8}{15}$', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - 돌림판 결과에 따라 남은 칸 수가 다르다. 두 경우로 나누자.
    - 제시문 [다]의 곱셈정리로 두 경우를 합친다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 3. 2026 논술고사 기출문제(자연계).pdf 예시 답안 p.7~8
    steps:
    - id: 2b-1
      content: |
        ① 경우 1(영역 1, 2, 3, 4가 나온 경우): 말은 왼쪽에서 세 번째 점에 있다. 다음에 앞면은 한 번 나와야 하고, 뒷면은 최대 한 번 나와야 하며, 마지막은 앞면으로 끝나야 한다.
        뒷면 0번: 앞 ⇒ 확률 $p$, 뒷면 1번: 뒤앞 ⇒ 확률 $p(1-p)$.
        따라서 경우 1일 때 맨 오른쪽 점까지 도달할 확률은 $g_1(p)=p(2-p)$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        ② 경우 2(영역 5가 나온 경우): 말은 왼쪽에서 두 번째 점에 있다. 다음에 앞면은 두 번 나와야 하고, 뒷면은 최대 한 번 나와야 하며, 마지막은 앞면으로 끝나야 한다.
        뒷면 0번: 앞앞 ⇒ 확률 $p^2$, 뒷면 1번: 앞뒤앞, 뒤앞앞 ⇒ 확률 $2p^2(1-p)$.
        따라서 경우 2일 때 확률은 $g_2(p)=p^2(3-2p)$.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        ③ 함께 계산하기: 확률의 곱셈정리(제시문 [다])에 의하여
        $g(p)=\dfrac45g_1(p)+\dfrac15g_2(p)=\dfrac45p(2-p)+\dfrac15p^2(3-2p)=\dfrac15p(-2p^2-p+8)$.
        $f(p)=g(p)$이므로 $p^2(3p^2-8p+6)=\dfrac15p(-2p^2-p+8)$이다. $p>0$이므로 양변을 $p$로 나누고 다시 정리하면 $15p^3-38p^2+31p-8=0$이고, 인수분해하면 $(p-1)^2(15p-8)=0$.
        $p<1$이므로 $p=\dfrac{8}{15}$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 7
      evidence: '영역이 1, 2, 3, 4가 나올 경우의 확률 $g_1(p)=p(2-p)$를 구했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 7
      evidence: '영역 5가 나올 경우의 확률 $g_2(p)=p^2(3-2p)$를 구했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 7
      evidence: '$g(p)=\dfrac45g_1+\dfrac15g_2$로 함께 계산하여 $f(p)=g(p)$에서 $p=\dfrac{8}{15}$을 구했다.'
      depends_on: [2.M1, 2.M2]
      ft: {allowed: true, from: [1.A1], max_points: 7}
      steps: [2b-3]
    deductions: []
