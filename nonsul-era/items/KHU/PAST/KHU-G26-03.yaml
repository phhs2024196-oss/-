stimuli:
- label: 라
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: 마
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능할 때, 그 열린구간에 속하는 모든 $x$에 대하여
    (1) $f'(x)>0$이면 $f(x)$는 그 열린구간에서 증가한다.
    (2) $f'(x)<0$이면 $f(x)$는 그 열린구간에서 감소한다.

stem: |
  좌표평면에서 $x$축 위에 점 $\mathrm{A}(4,0)$이 있다. <그림 2>와 같이 제1사분면 위의 점 P와 $y$축 사이의 거리를 $d$라고 할 때, $d=\overline{\mathrm{AP}}-4$를 만족하는 점 P가 이루는 곡선을 $C$라고 하자. $\angle\mathrm{OAP}=\theta\ \left(0<\theta<\dfrac{\pi}{2}\right)$라고 할 때, 다음 물음에 답하시오.
  [그림 2 설명: 원점 O에서 시작해 오른쪽 위로 볼록하게 올라가는 곡선 $C$, 곡선 위의 점 P에서 $y$축까지의 수평 점선과 선분 PA에 같은 길이 표시(∥), 점 P를 지나고 중심이 A(4,0)인 점선 반원, ∠OAP=θ 표시.]
  [그림 3 설명: 곡선 $C$ 위의 점 P에서의 접선 $l$, 직선 $x=4$(점 A에서 수직), $y$축이 그려져 있고, 접선 $l$과 곡선 $C$ 사이의 빗금 친 두 부분(접점 P의 왼쪽: $y$축과 접선·곡선 사이, 오른쪽: 직선 $x=4$와 접선·곡선 사이)을 화살표로 가리켜 $S$로 표시, P에서 A로 점선, ∠θ 표시.]

subparts:
- id: '1'
  stem: |
    곡선 $C$ 위의 점들 중 $\sin\theta=\dfrac45$인 점을 $\mathrm{P_1}$, $\sin\theta=\dfrac{2\sqrt2}{3}$인 점을 $\mathrm{P_2}$라고 하자. 이때 두 선분 $\mathrm{AP_1}$, $\mathrm{AP_2}$와 곡선 $C$로 둘러싸인 도형의 넓이를 구하고, 그 근거를 논술하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac23(14\sqrt2-13)', equivalents: ['(28\sqrt2-26)/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$C:y=4\sqrt x$, $\mathrm{P_1}$, $\mathrm{P_2}$의 $x$좌표 1, 2. 넓이 $=\int_1^2 4\sqrt x\,dx+\triangle\mathrm{AP_2Q_2}-\triangle\mathrm{AP_1Q_1}$.'
    steps:
    - {id: 1a, content: '$\dfrac83(2\sqrt2-1)+4\sqrt2-6=\dfrac23(14\sqrt2-13)$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - P에서 $x$축에 수선을 내리면 $\overline{AP}$와 $\overline{AQ}$를 $x$로 나타낼 수 있다.
    - $\cos\theta$를 이용해 곡선의 방정식과 P의 $x$좌표를 구하자.
    - 구하는 도형을 곡선 아래 넓이와 두 직각삼각형으로 나누자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 3. 2026 논술고사 기출문제(자연계).pdf 예시 답안 p.11
    steps:
    - id: 1b-1
      content: |
        점 P의 좌표를 $(x,y)$라고 하고, 점 P에서 $x$축에 내린 수선의 발을 Q라고 하면 Q의 좌표는 $(x,0)$이다. $\overline{AP}=4+x$이며 $\overline{AQ}=4-x$이다.
        $0<\theta<\dfrac{\pi}{2}$에서 $\cos\theta=\dfrac{4-x}{4+x}$, $\dfrac{y}{4+x}=\sin\theta=\sqrt{1-\cos^2\theta}=\dfrac{4\sqrt x}{4+x}$이므로 곡선 $C$의 방정식은 $y=4\sqrt x\ (0<x<4)$이다. $f(x)=4\sqrt x$라 하자.
        또한 위의 계산으로부터 $x=\dfrac{4(1-\cos\theta)}{1+\cos\theta}$ …(*)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\sin\theta=\dfrac45$인 $\theta$를 $\alpha$, $\sin\theta=\dfrac{2\sqrt2}{3}$인 $\theta$를 $\beta$라 하고, 점 $\mathrm{P_1}$, $\mathrm{P_2}$에서 $x$축에 내린 수선의 발을 각각 $\mathrm{Q_1}$, $\mathrm{Q_2}$라 하자. 구하는 넓이를 $B$라 하면
        $B=(\text{도형 }\mathrm{P_2P_1Q_1Q_2}\text{의 넓이})+(\triangle\mathrm{AP_2Q_2})-(\triangle\mathrm{AP_1Q_1})$ …(**)
        $0<\theta<\dfrac{\pi}{2}$에서 $\sin\theta$는 증가함수이므로 $\alpha<\beta$이고, $\cos\alpha=\dfrac35$, $\cos\beta=\dfrac13$이며 (*)로부터 $\mathrm{Q_1}$, $\mathrm{Q_2}$의 $x$좌표는 각각 1과 2이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        (도형 $\mathrm{P_2P_1Q_1Q_2}$의 넓이) $=\int_1^2 4\sqrt x\,dx=\dfrac83(2\sqrt2-1)$.
        $\overline{AQ_2}=2$, $\overline{P_2Q_2}=f(2)=4\sqrt2$에서 $\triangle\mathrm{AP_2Q_2}=4\sqrt2$, $\overline{AQ_1}=3$, $\overline{P_1Q_1}=f(1)=4$에서 $\triangle\mathrm{AP_1Q_1}=6$.
        따라서 (**)에 의해 $B=\dfrac83(2\sqrt2-1)+4\sqrt2-6=\dfrac23(14\sqrt2-13)$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: '곡선 $C$의 방정식 $y=4\sqrt x$를 근거와 함께 구했다.'
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 7
      evidence: '도형의 넓이를 (곡선 아래 넓이)+(삼각형 $\mathrm{AP_2Q_2}$)-(삼각형 $\mathrm{AP_1Q_1}$) 등으로 규명하고 $\mathrm{P_1}$, $\mathrm{P_2}$의 $x$좌표 1, 2를 구했다.'
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: '도형의 넓이 $\dfrac23(14\sqrt2-13)$을 계산했다.'
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6205}
  misconceptions:
  - id: MC-CAL-6205
    outcome_code: '70'
    wrong_work: '넓이를 $\int_1^2 4\sqrt x\,dx=\dfrac83(2\sqrt2-1)$만으로 답함'
    detect_cue: 답에 삼각형 넓이($4\sqrt2$, $6$)가 반영되지 않았다
    feedback: 경계가 선분 $\mathrm{AP_1}$, $\mathrm{AP_2}$이므로 곡선 아래 넓이에 두 직각삼각형 넓이를 더하고 빼야 합니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    곡선 $C$ 위의 한 점 $\mathrm{P}(a,b)$에서의 접선을 $l$이라고 할 때, <그림 3>과 같이 접선 $l$, 곡선 $C$, 직선 $x=4$와 $y$축으로 둘러싸인 도형을 $S$라고 하자. 도형 $S$의 넓이의 최솟값을 구하고, 그 근거를 논술하시오. (17점)
  points: 17
  depends_on: ['1']
  answer: {kind: value, value: '16\left(\sqrt2-\dfrac43\right)', equivalents: ['16\sqrt2-64/3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$l:y=\dfrac{2}{\sqrt a}x+2\sqrt a$, $g(a)=\int_0^4\{l-4\sqrt x\}dx=8\sqrt a+\dfrac{16}{\sqrt a}-\dfrac{64}{3}$, $a=2$에서 최소.'
    steps:
    - {id: 2a, content: '$g''(a)=\dfrac{4}{a\sqrt a}(a-2)$ ⇒ 최솟값 $g(2)=16\left(\sqrt2-\dfrac43\right)$', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - 제시문 [라]로 접선의 방정식을 구하자.
    - $S$는 (접선 아래 사다리꼴)-(곡선 아래 넓이)이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 3. 2026 논술고사 기출문제(자연계).pdf 예시 답안 p.11~12
    steps:
    - id: 2b-1
      content: |
        곡선 $C$의 방정식 $y=f(x)=4\sqrt x$에 의하여 $f'(x)=\dfrac{2}{\sqrt x}$이므로, 곡선 위의 점 $\mathrm{P}(a,4\sqrt a)$에서 곡선에 접하는 접선 $l$의 방정식은 제시문 [라]에 의해 $y=\dfrac{2}{\sqrt a}x+2\sqrt a$이다. $h(x)=\dfrac{2}{\sqrt a}x+2\sqrt a$라고 하자.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        접선 $l$이 $y$축과 만나는 점을 L, 직선 $x=4$와 만나는 점을 M, 곡선 $C$가 직선 $x=4$와 만나는 점을 N이라 하자. 도형 $S$의 넓이를 $g(a)$라 하면
        $g(a)=(\text{사다리꼴 LOAM의 넓이})-(\text{도형 OAN의 넓이})$.
        (사다리꼴 LOAM) $=\int_0^4h(x)\,dx=8\sqrt a+\dfrac{16}{\sqrt a}$, (도형 OAN) $=\int_0^4 4\sqrt x\,dx=\dfrac{64}{3}$이므로
        $g(a)=8\sqrt a+\dfrac{16}{\sqrt a}-\dfrac{64}{3}$.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        따라서 도형 $S$의 넓이의 최솟값은 $0<a<4$에서 함수 $g(a)$의 최솟값이다. $g'(a)=\dfrac{4}{a\sqrt a}(a-2)$이며 $g'(a)=0$인 경우는 $a=2$이다.
        $a<2$이면 $g'(a)<0$이고 $a>2$이면 $g'(a)>0$이므로(제시문 [마]) $g(a)$는 $a=2$일 때 최솟값을 가진다.
        도형 $S$의 넓이의 최솟값은 $g(2)=16\left(\sqrt2-\dfrac43\right)$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: '접선의 방정식 $y=\dfrac{2}{\sqrt a}x+2\sqrt a$를 구했다.'
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 5}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: '도형의 넓이 $g(a)=8\sqrt a+\dfrac{16}{\sqrt a}-\dfrac{64}{3}$을 구했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 7
      evidence: '$g''(a)$의 부호 변화로 $a=2$에서 최소임을 밝히고 넓이의 최솟값 $g(2)=16\left(\sqrt2-\dfrac43\right)$을 구했다.'
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
