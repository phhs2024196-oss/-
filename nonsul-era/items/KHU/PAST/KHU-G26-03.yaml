  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6206}
  misconceptions:
  - id: MC-CAL-6206
    outcome_code: '70'
    wrong_work: '$S=\int_0^4\{4\sqrt x-h(x)\}dx$로 놓아 음수 넓이 $\dfrac{64}{3}-8\sqrt a-\dfrac{16}{\sqrt a}$을 최대화'
    detect_cue: 넓이 식의 부호가 반대이거나 최솟값이 음수이다
    feedback: 곡선 $y=4\sqrt x$는 위로 볼록이므로 접선이 항상 곡선 위에 있습니다. (위쪽 함수)-(아래쪽 함수)로 적분하세요.
    remedy: [RL-2]

