stimuli:
- label: 가
  body: |
    평면 $\alpha$ 위에 있지 않은 한 점 P, 평면 $\alpha$ 위의 한 점 O, 점 O를 지나지 않고 평면 $\alpha$ 위에 있는 한 직선 $l$, 직선 $l$ 위의 한 점 H에 대하여
    (1) $\overline{\mathrm{PO}}\perp\alpha$, $\overline{\mathrm{OH}}\perp l$이면 $\overline{\mathrm{PH}}\perp l$
    (2) $\overline{\mathrm{PO}}\perp\alpha$, $\overline{\mathrm{PH}}\perp l$이면 $\overline{\mathrm{OH}}\perp l$
    (3) $\overline{\mathrm{PH}}\perp l$, $\overline{\mathrm{OH}}\perp l$, $\overline{\mathrm{PO}}\perp\overline{\mathrm{OH}}$이면 $\overline{\mathrm{PO}}\perp\alpha$

stem: |
  제시문 [가]를 참고하여 다음 논제에 답하시오.
  직사각형 모양의 종이의 네 꼭짓점 $\mathrm{A,B,C,D}$에 대하여 $\overline{\mathrm{AB}}=2$, $\overline{\mathrm{AD}}=2\sqrt3$이다. 다음 그림과 같이 선분 AD의 중점을 E라고 하고, 선분 EB와 선분 EC를 접어서 두 선분 AE와 DE가 맞닿도록 하자. 두 점 A와 D가 만나는 점을 P라고 할 때, 다음 물음에 답하시오. (단, 종이의 두께는 생각하지 않는다.)
  [그림 설명: 점선으로 그린 직사각형 ABCD(A 왼쪽 위, B 왼쪽 아래, C 오른쪽 아래, D 오른쪽 위)와 AD 위의 점 E. 삼각형 EBP와 ECP(회색)가 접혀 올라가 꼭짓점 P에서 만나고, 실선 EB, EC, BC, PB, PC, PE가 그려져 있다.]

subparts:
- id: '1'
  stem: |
    평면 PEB와 평면 EBC가 이루는 각의 크기를 $\theta$라 하자. $\cos\theta$의 값을 구하고, 그 근거를 논술하시오. (14점)
  points: 14
  depends_on: []
  answer: {kind: value, value: '\dfrac34', equivalents: ['3/4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '삼수선의 정리로 $\cos\theta=\dfrac{\overline{HO}}{\overline{PH}}=\dfrac{\overline{HO}}{\overline{AH}}$, 평면 닮음으로 $\dfrac{\overline{HO}}{\overline{AH}}=\dfrac{\overline{EO}}{\overline{AB}}=\dfrac34$.'
    steps:
    - {id: 1a, content: '$\overline{EO}=\dfrac{\overline{AE}^2}{\overline{AB}}=\dfrac32$, $\dfrac{\overline{HO}}{\overline{AH}}=\dfrac{\overline{EO}}{\overline{AB}}=\dfrac34$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - P에서 선분 EB와 평면 EBC에 수선을 내려 보자.
    - 접기 전의 평면 그림에서 A에서 EB에 내린 수선을 생각하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 4. 2026 논술고사 기출문제(의약학계).pdf 예시 답안 p.10~11
    steps:
    - id: 1b-1
      content: |
        점 E는 선분 AD의 중점이므로 $\overline{AE}=\overline{ED}=\sqrt3$이고, 직각삼각형 ABE에서 $\overline{BE}=\sqrt7$이다. 또한 직사각형 ABCD를 접은 이후 점 A=D=P이므로 $\overline{PB}=\overline{PC}=2$이고 $\overline{PE}=\sqrt3$이다.
        점 P에서 선분 EB와 평면 EBC에 내린 수선의 발을 각각 H와 O라고 하자. $\overline{PH}\perp\overline{EB}$이고, 선분 PO와 평면 EBC는 수직이므로 삼수선의 정리(제시문 [가] (2))에 따라 $\overline{HO}\perp\overline{EB}$이다. 직각삼각형 POH에서 $\cos\theta=\dfrac{\overline{HO}}{\overline{PH}}$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        한편, (접기 전 평면에서) 삼각형 AEO와 삼각형 BAE는 서로 닮음이므로 $\overline{AE}:\overline{EO}=\overline{BA}:\overline{AE}$에서 $\overline{EO}=\dfrac32$이고, 삼각형 AHB와 삼각형 OHE는 서로 닮음이므로 $\overline{AB}:\overline{AH}=\overline{EO}:\overline{HO}$에서 $\dfrac{\overline{HO}}{\overline{AH}}=\dfrac34$이다.
        이때 $\cos\theta=\dfrac{\overline{HO}}{\overline{PH}}$에서 $\overline{PH}=\overline{AH}$이므로 $\cos\theta=\dfrac34$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: '점 P에서 선분 EB와 평면 EBC에 내린 수선의 발을 각각 H와 O라 할 때, (삼수선의 정리로) $\cos\theta=\dfrac{\overline{HO}}{\overline{PH}}$임을 확인했다.'
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 8
      evidence: '닮음 등으로 길이를 구해 $\cos\theta=\dfrac34$을 계산했다.'
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6207}
  misconceptions:
  - id: MC-GEO-6207
    outcome_code: '70'
    wrong_work: '이면각을 $\angle\mathrm{PEO}$나 $\angle\mathrm{PBO}$ 등 교선 EB에 수직이 아닌 선분 사이의 각으로 보고 $\cos\theta=\dfrac{\overline{EO}}{\overline{PE}}$ 등으로 계산'
    detect_cue: 수선의 발 H(교선 위)를 잡지 않고 꼭짓점 E 또는 B에서 각을 쟀다
    feedback: 두 평면이 이루는 각은 교선 위의 한 점에서 교선에 수직인 두 직선이 이루는 각입니다. 삼수선의 정리로 H를 잡으세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    삼각형 PBC의 넓이와 사면체 PEBC의 부피를 구하고, 그 근거를 논술하시오. (14점)
  points: 14
  depends_on: ['1']
  answer: {kind: value, value: '\triangle\mathrm{PBC}=\sqrt3,\ V=1', equivalents: ['넓이 √3, 부피 1'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 'PBC는 $\overline{PB}=\overline{PC}=2$, $\overline{BC}=2\sqrt3$인 이등변삼각형(높이 1). $\overline{PO}=\overline{PH}\sin\theta=\dfrac{\sqrt3}{2}$, $V=\dfrac13\cdot2\sqrt3\cdot\dfrac{\sqrt3}{2}=1$.'
    steps:
    - {id: 2a, content: '$\triangle\mathrm{PBC}=\sqrt3$, $V=\dfrac13\times\triangle\mathrm{EBC}\times\overline{PO}=1$', criteria: [2.B1, 2.B2]}
    hint_ladder:
    - BC의 중점에서 P까지의 거리를 구하자.
    - (1)의 $\cos\theta$로 $\overline{PO}$를 구할 수 있다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 4. 2026 논술고사 기출문제(의약학계).pdf 예시 답안 p.11
    steps:
    - id: 2b-1
      content: |
        삼각형 PBC의 넓이: 선분 BC의 중점을 E'이라고 하면 $\overline{E'C}=\sqrt3$이고, 점 E'은 점 P에서 선분 BC에 내린 수선의 발이다. $\overline{PC}=2$이므로 직각삼각형 PE'C에서 $\overline{PE'}=1$이다. 따라서 $\triangle\mathrm{PBC}=\dfrac12\overline{BC}\times\overline{PE'}=\sqrt3$.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        사면체 PEBC의 부피: 직각삼각형 ABE에서 $\overline{AB}\times\overline{AE}=\overline{AH}\times\overline{BE}$이므로 $\overline{AH}=\overline{PH}=\dfrac{2\sqrt3}{\sqrt7}$이고, (1)의 결과를 이용하여 $\sin\theta=\sqrt{1-\cos^2\theta}=\dfrac{\sqrt7}{4}$로부터 $\overline{PO}=\overline{PH}\sin\theta=\dfrac{\sqrt3}{2}$이다. $\triangle\mathrm{EBC}=2\sqrt3$이므로 사면체 PEBC의 부피 $V$는
        $V=\dfrac13\times\triangle\mathrm{EBC}\times\overline{PO}=1$.
      criteria: [2.B2]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 4. 2026 논술고사 기출문제(의약학계).pdf 예시 답안 p.11 (다른 답안)
    steps:
    - id: 2c-1
      content: |
        $\overline{EP}\perp\overline{BP}$이고 $\overline{EP}\perp\overline{PC}$이므로(원래 직사각형의 직각 $\angle A$, $\angle D$), 선분 EP와 평면 PBC는 수직이다. 따라서 사면체 PEBC는 삼각형 PBC를 밑면으로 하고 선분 EP를 높이로 하는 삼각뿔이다. $\triangle\mathrm{PBC}=\sqrt3$, $\overline{EP}=\sqrt3$이므로 $V=\dfrac13\times\triangle\mathrm{PBC}\times\overline{EP}=1$.
      criteria: [2.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 7
      evidence: '삼각형 PBC의 넓이 $\sqrt3$을 구했다(높이 $\overline{PE''}=1$ 등 근거 포함).'
      depends_on: []
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 7
      evidence: '사면체 PEBC의 부피 1을 구했다(높이 $\overline{PO}=\dfrac{\sqrt3}{2}$ 또는 $\overline{EP}\perp$ 평면 PBC 근거 포함).'
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 7}
      steps: [2b-2, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6208}
  misconceptions:
  - id: MC-GEO-6208
    outcome_code: '70'
    wrong_work: '사면체의 높이로 $\overline{PH}=\dfrac{2\sqrt3}{\sqrt7}$을 써서 $V=\dfrac13\cdot2\sqrt3\cdot\dfrac{2\sqrt3}{\sqrt7}$로 계산'
    detect_cue: 부피에 $\sqrt7$이 남아 있다
    feedback: 삼각뿔의 높이는 밑면(평면 EBC)에 수직인 선분 PO입니다. $\overline{PO}=\overline{PH}\sin\theta$를 쓰세요.
    remedy: [RL-2]

