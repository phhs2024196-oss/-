stimuli:
- label: 나
  body: |
    연속확률변수 $X$의 확률밀도함수 $f(x)\ (\alpha\le x\le\beta)$에 대하여
    (1) $f(x)\ge0$
    (2) $f(x)$의 그래프와 $x$축 및 두 직선 $x=\alpha$, $x=\beta$로 둘러싸인 부분의 넓이는 1이다.
    (3) 두 상수 $a,b\ (\alpha\le a\le b\le\beta)$에 대하여 $\mathrm{P}(a\le X\le b)$는 $f(x)$의 그래프와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 부분의 넓이이다.

stem: |
  제시문 [나]를 참고하여 다음 논제에 답하시오.
  상수 $a,b$에 대하여 함수 $f(x)=\begin{cases}a(bx+1) & (0\le x\le1)\\ -a(b+1)(x-2) & (1<x\le2)\end{cases}$가 연속확률변수 $X$의 확률밀도함수일 때, 다음 물음에 답하시오. (단, $a>0$)

subparts:
- id: '1'
  stem: |
    $a$를 $b$에 대한 식으로 나타낸 후, 이를 이용하여 $c=\int_0^2x^2f(x)\,dx$의 범위를 구하고, 그 근거를 논술하시오. (16점)
  points: 16
  depends_on: []
  answer: {kind: set, value: 'a=\dfrac{2}{2b+3},\ \dfrac16\le c<\dfrac76', equivalents: ['1/6 ≤ c < 7/6'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '넓이 $a\dfrac{2b+3}{2}=1$, $f(1)\ge0$에서 $b\ge-1$, $c=\dfrac76-\dfrac{1}{2b+3}$.'
    steps:
    - {id: 1a, content: '$2b+3\ge1$ ⇒ $0<\dfrac{1}{2b+3}\le1$ ⇒ $\dfrac16\le c<\dfrac76$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 각 구간에서 일차함수이므로 끝점의 함숫값만 보면 $f\ge0$을 판정할 수 있다.
    - $c$를 $\dfrac{1}{2b+3}$에 대한 식으로 정리하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 4. 2026 논술고사 기출문제(의약학계).pdf 예시 답안 p.13
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$가 확률밀도함수가 되려면 구간 $[0,2]$에서 $f(x)\ge0$이고 $\mathrm{P}(0\le X\le2)=1$이다(제시문 [나]). $f(x)$가 구간 $[0,1]$ 및 $(1,2]$에서 각각 일차함수이므로 첫 번째 조건을 만족하려면 $f(0)=a\ge0$, $f(1)=a(1+b)\ge0$, $f(2)=0\ge0$.
        그런데 $a>0$이므로 이를 만족하는 $b$의 범위는 $b\ge-1$이다.
      criteria: [1.M2]
    - id: 1b-2
      content: |
        두 번째 조건을 만족하려면 $\mathrm{P}(0\le X\le2)=\dfrac12\times(a+a(b+1))\times1+\dfrac12\times a(b+1)\times1=a\dfrac{2b+3}{2}=1$. 따라서 $a=\dfrac{2}{2b+3}$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        한편 $c=\int_0^1a(bx^3+x^2)\,dx+\int_1^2\{-a(b+1)(x^3-2x^2)\}\,dx=\dfrac{a(3b+4)}{12}+\dfrac{11a(b+1)}{12}=\dfrac{14b+15}{12b+18}=-\dfrac{1}{2b+3}+\dfrac76$.
        따라서 주어진 범위 $b\ge-1$에서 $c$의 값의 범위는 $\dfrac16\le c<\dfrac76$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: '$a$를 $b$에 대한 식 $a=\dfrac{2}{2b+3}$으로 표현했다.'
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.M2
      mark_type: R
      points: 5
      evidence: '$f(x)\ge0$ 조건으로 $b$의 범위 $b\ge-1$을 구했다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: '$b$의 범위를 이용하여 $c$의 범위 $\dfrac16\le c<\dfrac76$을 계산했다.'
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6209}
  misconceptions:
  - id: MC-PRB-6209
    outcome_code: '70'
    wrong_work: '$f(x)\ge0$ 조건을 쓰지 않고 $2b+3>0$(즉 $b>-\dfrac32$)만으로 $c<\dfrac76$이라 하거나 하한을 구하지 못함'
    detect_cue: 범위의 하한이 없거나 $b>-\dfrac32$를 사용했다
    feedback: 확률밀도함수는 모든 $x$에서 $f(x)\ge0$이어야 합니다(제시문 [나] (1)). $f(1)=a(1+b)\ge0$에서 $b\ge-1$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    $b>0$일 때, $\mathrm{P}(0\le X\le d)=\dfrac35$이 되는 $d$를 $b$에 대한 식 $d=g(b)$로 나타낸 후, 이를 이용하여 $g\left(\dfrac12\right)+g(39)$의 값을 구하고, 그 근거를 논술하시오. (16점)
  points: 16
  depends_on: ['1']
  answer: {kind: value, value: '2\sqrt{\dfrac{11}{5}}-\dfrac{9}{10}', equivalents: ['\dfrac{2\sqrt{55}}{5}-\dfrac{9}{10}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\mathrm{P}(0\le X\le1)=\dfrac{b+2}{2b+3}$이 $\dfrac35$ 이상 ⇔ $b\le1$. $b\le1$이면 $bd^2+2d-\dfrac{6b+9}{5}=0$, $b>1$이면 $\mathrm{P}(d\le X\le2)=\dfrac25$.'
    steps:
    - {id: 2a, content: '$g\left(\dfrac12\right)=2\sqrt{\dfrac{11}{5}}-2$, $g(39)=2-\dfrac{9}{10}$', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - 먼저 $\mathrm{P}(0\le X\le1)$을 $b$로 나타내 $\dfrac35$과 비교하자.
    - $d>1$이면 오른쪽 삼각형 넓이 $\mathrm{P}(d\le X\le2)=\dfrac25$을 쓰는 것이 편하다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 4. 2026 논술고사 기출문제(의약학계).pdf 예시 답안 p.13~14
    steps:
    - id: 2b-0
      content: |
        $\mathrm{P}(0\le X\le1)=\dfrac12\times(a+a(b+1))\times1=\dfrac a2(b+2)=\dfrac{b+2}{2b+3}$이므로 $\dfrac{b+2}{2b+3}=\dfrac35$, 즉 $b=1$을 기준으로 구간을 나누어 생각하자.
      criteria: [2.M1]
    - id: 2b-1
      content: |
        (i) $0<b\le1$인 경우: $\dfrac{b+2}{2b+3}\ge\dfrac35$이므로 $\mathrm{P}(0\le X\le d)=\dfrac35$인 $d$는 구간 $(0,1]$에 존재한다. 이때
        $\mathrm{P}(0\le X\le d)=\dfrac12\times(a+a(bd+1))\times d=a\left(\dfrac b2d^2+d\right)=\dfrac35$.
        따라서 $d$는 이차방정식 $bd^2+2d-\dfrac{6b+9}{5}=0$을 만족하며, $d$는 구간 $(0,1]$에 존재해야 하므로 $d=\dfrac1b\left(-1+\sqrt{1+\dfrac{b(6b+9)}{5}}\right)$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        (ii) $b>1$인 경우: $\dfrac{b+2}{2b+3}<\dfrac35$이므로 $d$는 구간 $(1,2)$에 존재한다. 이때
        $\mathrm{P}(d\le X\le2)=\dfrac12\times(2-d)\times a(b+1)(2-d)=\dfrac{b+1}{2b+3}(d^2-4d+4)=\dfrac25$.
        따라서 $d$는 $d^2-4d+\dfrac{16b+14}{5b+5}=0$을 만족하며, $d\in(1,2)$이므로 $d=2-\sqrt{\dfrac{4b+6}{5b+5}}$.
        구하는 $g(b)=\begin{cases}\dfrac1b\left(-1+\sqrt{1+\dfrac{b(6b+9)}{5}}\right) & (0<b\le1)\\ 2-\sqrt{\dfrac{4b+6}{5b+5}} & (b>1)\end{cases}$
      criteria: [2.M2]
    - id: 2b-3
      content: |
        그러므로 $g\left(\dfrac12\right)=2\sqrt{\dfrac{11}{5}}-2$, $g(39)=2-\sqrt{\dfrac{81}{100}}=2-\dfrac{9}{10}$이다. 따라서 $g\left(\dfrac12\right)+g(39)=2\sqrt{\dfrac{11}{5}}-\dfrac{9}{10}$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 7
      evidence: '$0<b\le1$일 때 $d=\dfrac1b\left(-1+\sqrt{1+\dfrac{b(6b+9)}{5}}\right)$을 계산했다($b=1$ 기준 판단 포함).'
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 7}
      steps: [2b-0, 2b-1]
    - id: 2.M2
      mark_type: M
      points: 7
      evidence: '$b>1$일 때 $d=2-\sqrt{\dfrac{4b+6}{5b+5}}$을 계산했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: '$g\left(\dfrac12\right)+g(39)=2\sqrt{\dfrac{11}{5}}-\dfrac{9}{10}$을 계산했다.'
      depends_on: [2.M1, 2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6210}
  misconceptions:
  - id: MC-PRB-6210
    outcome_code: '70'
    wrong_work: '$b=39$에도 $(0,1]$의 식 $d=\dfrac1b\left(-1+\sqrt{1+\dfrac{b(6b+9)}{5}}\right)$을 그대로 적용'
    detect_cue: '$g(39)$가 1보다 큰데도 $(0,1]$의 식으로 계산했거나 $b=1$ 기준 분류가 없다'
    feedback: '$\mathrm{P}(0\le X\le1)$과 $\dfrac35$을 비교해 $d$가 어느 구간에 있는지 먼저 정하세요. $b>1$이면 $d>1$입니다.'
    remedy: [RL-2]

