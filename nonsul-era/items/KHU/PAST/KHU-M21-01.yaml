key_idea: '원의 반지름은 중심 $C(0,b)$와 곡선 위의 점 사이 거리의 최솟값이므로 $f(x)=x^2+(x^2-b)^2$의 최솟값을 $b$의 범위에 따라 나누어 구한다.'
