  concepts: [합의 법칙, 같은 것이 있는 순열, 조합, 수학적 확률]
  tools: [가로 거리 m·세로 거리 n으로 경우 분류, 최단 경로의 수 (m+n)!/(m!n!), A를 지나는 경로 빼기, 표본공간 15C2=105]
  conditions:
