intent: 합의 법칙과 같은 것이 있는 순열로 격자 도로망의 최단 경로의 수를 빠짐없이 구하고, 통과 금지 지점이 있을 때 조건에 맞는 경우를 세어 확률을 구하는 능력을 본다.
key_idea: '두 지점의 가로·세로 거리 $(m,n)$에 대해 최단 경로의 수는 $\dfrac{(m+n)!}{m!\,n!}$이고, 지점 A를 지나는 경로는 A가 직사각형의 다른 꼭짓점일 때 1가지뿐이다.'
stuck: (2)에서 A가 두 지점이 만드는 직사각형의 꼭짓점이 되는 경우만 경로 수가 1 줄어든다는 것을 찾아 (2,2), (2,3), (3,3) 쌍을 하나씩 확인하는 단계
