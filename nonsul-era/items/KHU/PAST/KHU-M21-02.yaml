  - '(2) A를 지날 수 없음 ⇒ A가 직사각형의 꼭짓점인 쌍은 경로 수 $-1$'
  - '(2) A를 제외한 15개 지점에서 두 지점 선택 ⇒ $\binom{15}{2}=105$'
  stimuli_used: [라, 마]
  subpart_links: (2)는 (1)의 표에서 최단 경로의 수가 6 이상인 거리 쌍 (2,2), (2,3), (3,2), (3,3)을 골라 이용

