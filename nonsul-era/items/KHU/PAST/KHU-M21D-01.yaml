stimuli:
- label: 가
  body: |
    두 변수 $x,y$사이의 관계를 변수 $t$를 매개로 하여 $\begin{cases}x=f(t)\\y=g(t)\end{cases}$의 꼴로 나타낼 때, 변수 $t$를 매개변수라고 하며, 이 함수를 매개변수로 나타낸 함수라고 한다.
- label: 나
  body: |
    매개변수로 나타낸 두 함수 $x=f(t)$와 $y=g(t)$가 $t$에 대하여 미분가능하고 $f'(t)\ne0$이면, $\dfrac{dy}{dx}=\dfrac{\frac{dy}{dt}}{\frac{dx}{dt}}=\dfrac{g'(t)}{f'(t)}$이다.
- label: 다
  body: |
    두 함수 $f(x),g(x)\ (g(x)\ne0)$가 미분가능할 때,
    $y=\dfrac{1}{g(x)}$이면 $y'=-\dfrac{g'(x)}{g(x)^2}$이고, $y=\dfrac{f(x)}{g(x)}$이면 $y'=\dfrac{f'(x)g(x)-f(x)g'(x)}{g(x)^2}$이다.
- label: 라
  body: |
    삼각함수의 덧셈정리
    $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$, $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$
    $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$, $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$
    $\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$, $\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$
- label: 마
  body: |
    삼각형 $ABC$의 넓이를 $S$라고 하면, $S=\dfrac12\overline{AB}\,\overline{AC}\sin A=\dfrac12\overline{BA}\,\overline{BC}\sin B=\dfrac12\overline{CA}\,\overline{CB}\sin C$ 이다.
- label: 바
  body: |
    두 수열 $\{a_n\}$과 $\{b_n\}$이 수렴하고, $\lim\limits_{n\to\infty}a_n=\alpha$, $\lim\limits_{n\to\infty}b_n=\beta$ ($\alpha,\beta$는 실수) 일 때, 1) 모든 자연수 $n$에 대하여 $a_n\le b_n$ 이면 $\alpha\le\beta$이다. 2) 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $\alpha=\beta$이면, 수열 $\{c_n\}$은 수렴하고, $\lim\limits_{n\to\infty}c_n=\alpha$ 이다.
- label: 사
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때. $\displaystyle\int_a^b f(x)\,dx=\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x$ (단, $\Delta x=\dfrac{b-a}{n}$, $x_k=a+k\Delta x$) 이다.

stem: |
  Ⅰ. 다음 제시문을 읽고 논제에 답하시오.(60점)
  [그림 1 설명: 원점 $O$를 중심으로 하는 단위원과 점 $P(-1,0)$. $P$와 $y$축 위의 점 $(0,t)$를 지나는 직선이 원과 제1사분면에서 다시 만나는 점이 $Q$이다.]
  [그림 2 설명: 같은 단위원에서 $P$를 지나는 두 직선이 $y$축과 각각 $t_1$(아래), $t_2$(위)에서 만나고, 원과 다시 만나는 점이 각각 $Q_1$, $Q_2$이다($Q_2$가 $Q_1$보다 위쪽).]
  [그림 3 설명: 같은 단위원에서 $P$를 지나는 여러 직선이 원과 $Q_0(1,0)$, …, $Q_{k-1}$, $Q_k$, $Q_{k+1}$, …에서 만나고, 맨 위 직선은 원과 $y$축 위의 점 $(0,1)$에서 만난다(그림에는 이 점에 '$Q_1$'로 표기됨). 원점 부근에 $t_0$가 표기되어 있고, $P$, $Q_k$, $Q_{k+1}$을 잇는 삼각형과 이웃한 점을 잇는 현이 그려져 있다.]
  [논제 I-1] 실수 $t$가 $0\le t\le1$을 만족한다고 하자. [그림 1]과 같이 좌표평면 위의 점 $P(-1,0)$과 점 $(0,t)$를 지나는 직선이 원점을 중심으로 갖는 단위원과 만나는 다른 한 점을 $Q$라고 하자. 이때 점 $Q$의 $x$좌표와 $y$좌표를 각각 $t$에 관한 식으로 나타내시오. (10점)

subparts:
- id: '1'
  stem: |
    위 논제의 점 $Q$의 좌표를 $t$에 관한 식으로 나타내시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'Q\left(\dfrac{1-t^2}{1+t^2},\ \dfrac{2t}{1+t^2}\right)', equivalents: ['x=(1-t^2)/(1+t^2), y=2t/(1+t^2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 직선 $y=t(x+1)$과 단위원의 교점 중 $P$가 아닌 것을 구한다.
    steps:
    - {id: 1a, content: '$x^2+t^2(x+1)^2=1$ ⇒ $(x+1)\{(1+t^2)x-(1-t^2)\}=0$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - 두 점을 지나는 직선의 방정식을 원의 방정식에 대입해 보자.
    - $x=-1$은 이미 알고 있는 근이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 예시답안(의학계) p.1
    steps:
    - id: 1b-1
      content: |
        점 $P(-1,0)$와 점 $(0,t)$를 지나는 직선의 방정식은 $y=t(x+1)$이므로, 단위원의 방정식 $x^2+y^2=1$에 $y$ 대신 $t(x+1)$을 대입하면, $x^2+t^2(x+1)^2=1$, 즉 $(1+t^2)x^2+2t^2x+t^2-1=0$을 얻는다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이차방정식의 근의 공식에 의해 $x=-1$ 또는 $x=\dfrac{1-t^2}{1+t^2}$을 얻는다. 이 때, $Q$는 $P$가 아닌 원 위의 점이므로, $x=\dfrac{1-t^2}{1+t^2}$가 원하는 해가 된다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        다시 $y^2=1-x^2$이므로, $y^2=\dfrac{4t^2}{(1+t^2)^2}$을 얻고, $t$가 음이 아닌 실수이므로(직선 $y=t(x+1)$에서 $x>-1$이면 $y\ge0$), $y=\dfrac{2t}{1+t^2}$이 된다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 직선 $y=t(x+1)$을 단위원의 방정식에 대입한 이차방정식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $x=-1$(점 $P$)을 제외하고 $x=\dfrac{1-t^2}{1+t^2}$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $t\ge0$을 근거로 $y=\dfrac{2t}{1+t^2}$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 그림만 보고 좌표를 추측해 근거 없이 적음
      effect: cap
      value: 3
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6907}
  misconceptions:
  - id: MC-CAL-6907
    outcome_code: '70'
    wrong_work: '$y^2=\dfrac{4t^2}{(1+t^2)^2}$에서 $y=\pm\dfrac{2t}{1+t^2}$로 남김'
    detect_cue: 답의 $y$좌표에 $\pm$가 있거나 부호 근거가 없다
    feedback: $0\le t\le1$이고 $Q$는 직선 $y=t(x+1)$ 위에서 $x>-1$인 점이므로 $y\ge0$입니다.
    remedy: [RL-1]

