    wrong_work: '$\dfrac{dy}{dx}=\dfrac{dx/dt}{dy/dt}=\dfrac{2t}{t^2-1}$로 뒤집어 씀'
    detect_cue: 접선 기울기가 $\dfrac{2t}{t^2-1}$이다(이는 반지름 $OQ$의 기울기)
