    공식 예시답안의 접선 $y=\left(\frac{t^2-1}{2t}\right)\left(x-\frac{1-t^2}{1+t^2}\right)+\frac{2t}{1+t^2}$은 $t=0$에서 정의되지 않음 — B 해설에 $t=0$일 때 $x=1$, 동치식 $(1-t^2)x+2ty=1+t^2$를 보충.

