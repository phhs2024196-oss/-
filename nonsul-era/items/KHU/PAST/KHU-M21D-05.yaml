stimuli:
- label: 가
  body: |
    두 변수 $x,y$사이의 관계를 변수 $t$를 매개로 하여 $\begin{cases}x=f(t)\\y=g(t)\end{cases}$의 꼴로 나타낼 때, 변수 $t$를 매개변수라고 하며, 이 함수를 매개변수로 나타낸 함수라고 한다.
- label: 나
  body: |
    매개변수로 나타낸 두 함수 $x=f(t)$와 $y=g(t)$가 $t$에 대하여 미분가능하고 $f'(t)\ne0$이면, $\dfrac{dy}{dx}=\dfrac{\frac{dy}{dt}}{\frac{dx}{dt}}=\dfrac{g'(t)}{f'(t)}$이다.
- label: 다
  body: |
    두 함수 $f(x),g(x)\ (g(x)\ne0)$가 미분가능할 때,
    $y=\dfrac{1}{g(x)}$이면 $y'=-\dfrac{g'(x)}{g(x)^2}$이고, $y=\dfrac{f(x)}{g(x)}$이면 $y'=\dfrac{f'(x)g(x)-f(x)g'(x)}{g(x)^2}$이다.
- label: 라
  body: |
    삼각함수의 덧셈정리
    $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$, $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$
    $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$, $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$
    $\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$, $\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$
- label: 마
  body: |
    삼각형 $ABC$의 넓이를 $S$라고 하면, $S=\dfrac12\overline{AB}\,\overline{AC}\sin A=\dfrac12\overline{BA}\,\overline{BC}\sin B=\dfrac12\overline{CA}\,\overline{CB}\sin C$ 이다.
- label: 바
  body: |
    두 수열 $\{a_n\}$과 $\{b_n\}$이 수렴하고, $\lim\limits_{n\to\infty}a_n=\alpha$, $\lim\limits_{n\to\infty}b_n=\beta$ ($\alpha,\beta$는 실수) 일 때, 1) 모든 자연수 $n$에 대하여 $a_n\le b_n$ 이면 $\alpha\le\beta$이다. 2) 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $\alpha=\beta$이면, 수열 $\{c_n\}$은 수렴하고, $\lim\limits_{n\to\infty}c_n=\alpha$ 이다.
- label: 사
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때. $\displaystyle\int_a^b f(x)\,dx=\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x$ (단, $\Delta x=\dfrac{b-a}{n}$, $x_k=a+k\Delta x$) 이다.

stem: |
  Ⅰ. 다음 제시문을 읽고 논제에 답하시오.(60점)
  [그림 1 설명: 원점 $O$를 중심으로 하는 단위원과 점 $P(-1,0)$. $P$와 $y$축 위의 점 $(0,t)$를 지나는 직선이 원과 제1사분면에서 다시 만나는 점이 $Q$이다.]
  [그림 2 설명: 같은 단위원에서 $P$를 지나는 두 직선이 $y$축과 각각 $t_1$(아래), $t_2$(위)에서 만나고, 원과 다시 만나는 점이 각각 $Q_1$, $Q_2$이다($Q_2$가 $Q_1$보다 위쪽).]
  [그림 3 설명: 같은 단위원에서 $P$를 지나는 여러 직선이 원과 $Q_0(1,0)$, …, $Q_{k-1}$, $Q_k$, $Q_{k+1}$, …에서 만나고, 맨 위 직선은 원과 $y$축 위의 점 $(0,1)$에서 만난다(그림에는 이 점에 '$Q_1$'로 표기됨). 원점 부근에 $t_0$가 표기되어 있고, $P$, $Q_k$, $Q_{k+1}$을 잇는 삼각형과 이웃한 점을 잇는 현이 그려져 있다.]
  [논제 I-5] 정적분 $\displaystyle\int_0^1\dfrac{2\,dx}{(x^2+1)^2}$ 을 급수의 합 $\lim\limits_{n\to\infty}T_n$으로 표현하시오. 이 때 수열 $T_n$과 [논제 I-4]의 수열 $S_n$의 차이를 구하고, 그 차이의 극한값 $\lim\limits_{n\to\infty}(T_n-S_n)$을 구하시오. 이를 통해 정적분 $\displaystyle\int_0^1\dfrac{2\,dx}{(x^2+1)^2}$ 의 값에 대하여 알 수 있는 사실을 논하시오 (15점).
  ([논제 I-4]: 주어진 자연수 $n$과 $0\le k\le n$인 정수 $k$에 대하여 $t_k=\dfrac{k}{n}$라고 하자. 각각의 $t_k$마다 [논제 1-1]과 같은 방법으로 얻어지는 원 위의 점을 $Q_k$라고 하자. [그림 3]의 삼각형 $PQ_kQ_{k+1}$의 넓이 $a_k$를 구하시오. $S_n$을 $\sum\limits_{k=0}^{n-1}a_k$라고 할 때, 극한값 $\lim\limits_{n\to\infty}S_n$을 추측하고, 그 근거를 논하시오.)

subparts:
- id: '1'
  stem: |
    정적분을 $\lim\limits_{n\to\infty}T_n$으로 표현하고, $T_n-S_n$과 $\lim\limits_{n\to\infty}(T_n-S_n)$을 구하여 정적분의 값에 대해 알 수 있는 사실을 논하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'T_n=\sum_{k=0}^{n-1}\dfrac{\frac2n}{\left(\left(\frac kn\right)^2+1\right)^2},\ \lim_{n\to\infty}(T_n-S_n)=0,\ \int_0^1\dfrac{2\,dx}{(x^2+1)^2}=\dfrac12+\dfrac{\pi}{4}', equivalents: ['lim(T_n-S_n)=0, integral = 1/2+pi/4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 같은 $\dfrac2n$을 곱한 두 합의 차를 통분하면 분자가 $\dfrac{2k+1}{n^2}$이 되어 $T_n-S_n\le\dfrac2n\to0$이다.
    steps:
    - {id: 1a, content: '$0\le T_n-S_n\le\dfrac{2}{n^3}\sum_{k=0}^{n-1}(2k+1)=\dfrac2n$ ⇒ $\int_0^1=\lim T_n=\lim S_n=\dfrac12+\dfrac{\pi}{4}$', criteria: [1.M1, 1.A1, 1.M2, 1.R1, 1.A2]}
    hint_ladder:
    - 제시문 [사]로 정적분을 급수로 바꾸자. 끝점을 $S_n$과 같은 모양으로 고르면 비교가 쉽다.
    - $T_n-S_n$의 각 항을 통분해 보자.
    - 분모가 1 이상이라는 사실로 위로 묶고, 제시문 [바]를 쓰자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 예시답안(의학계) p.2
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=\dfrac{2}{(x^2+1)^2}$은 닫힌구간 $[0,1]$에서 연속이므로, 정적분 $\displaystyle\int_0^1\dfrac{2\,dx}{(x^2+1)^2}$은(제시문 [사], 구간의 왼쪽 끝점을 택하여)
        $\lim\limits_{n\to\infty}\sum\limits_{k=0}^{n-1}f(x_k)\Delta x=\lim\limits_{n\to\infty}\sum\limits_{k=0}^{n-1}\dfrac{\frac2n}{\left(\left(\frac kn\right)^2+1\right)^2}$이 된다. 이제 $T_n=\sum\limits_{k=0}^{n-1}\dfrac{\frac2n}{\left(\left(\frac kn\right)^2+1\right)^2}$이라고 하면,
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        $T_n-S_n=\dfrac2n\sum\limits_{k=0}^{n-1}\dfrac{\left(\left(\frac{k+1}{n}\right)^2+1\right)-\left(\left(\frac kn\right)^2+1\right)}{\left(\left(\frac kn\right)^2+1\right)^2\left(\left(\frac{k+1}{n}\right)^2+1\right)}=\dfrac2n\sum\limits_{k=0}^{n-1}\dfrac{\frac{2k+1}{n^2}}{\left(\left(\frac kn\right)^2+1\right)^2\left(\left(\frac{k+1}{n}\right)^2+1\right)}\le\dfrac{2}{n^3}\sum\limits_{k=0}^{n-1}(2k+1)$
        (분모가 1 이상이므로). 또한 각 항이 양수이므로 $T_n-S_n>0$이다(보충).
      criteria: [1.M2]
    - id: 1b-3
      content: |
        이고 $\lim\limits_{n\to\infty}\dfrac{2}{n^3}\sum\limits_{k=0}^{n-1}(2k+1)=\lim\limits_{n\to\infty}\dfrac{2}{n^3}(n^2)=0$이므로 (제시문 [바]에 의해) $\lim\limits_{n\to\infty}(T_n-S_n)=0$을 얻는다.
      criteria: [1.R1]
    - id: 1b-4
      content: |
        이제 [논제 I-4]에서 추측한 것과 합하면 $\displaystyle\int_0^1\dfrac{2\,dx}{(x^2+1)^2}=\lim_{n\to\infty}T_n=\lim_{n\to\infty}S_n=\dfrac12+\dfrac{\pi}{4}$를 얻는다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $f(x)=\dfrac{2}{(x^2+1)^2}$이 $[0,1]$에서 연속임을 근거로 제시문 [사]를 적용했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $T_n=\sum\limits_{k=0}^{n-1}\dfrac{\frac2n}{\left(\left(\frac kn\right)^2+1\right)^2}$(또는 $k=1$부터 $n$까지의 합)으로 정적분을 급수로 나타냈다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $T_n-S_n$을 통분해 분자 $\dfrac{2k+1}{n^2}$을 얻고 $\dfrac{2}{n^3}\sum(2k+1)$로 위에서 평가했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: $\dfrac{2}{n^3}\cdot n^2\to0$과 수열 극한의 대소 관계(제시문 [바])로 $\lim(T_n-S_n)=0$을 이끌었다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: 정적분의 값이 $\lim S_n$과 같아 $\dfrac12+\dfrac{\pi}{4}$임을 적었다.
      depends_on: [1.R1]
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 정적분을 직접(치환·부분적분 등) 계산해 값만 제시하고 $T_n-S_n$ 비교가 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6914}
  - {code: '71', misconception: MC-CAL-6915}
  misconceptions:
  - id: MC-CAL-6914
    outcome_code: '70'
    wrong_work: '$T_n=\sum\dfrac{2}{\left(\left(\frac kn\right)^2+1\right)^2}$처럼 $\Delta x=\dfrac1n$을 빠뜨리거나 $\dfrac2n$의 2를 이중으로 곱함'
    detect_cue: $T_n$의 각 항에 $\dfrac1n$ 인수가 없거나 $\dfrac4n$이 있다
    feedback: $f(x_k)\Delta x$에서 $\Delta x=\dfrac{1-0}{n}$이고 $f$의 분자 2는 그대로 둡니다.
    remedy: [RL-1]
  - id: MC-CAL-6915
    outcome_code: '71'
    wrong_work: '$T_n-S_n\le\dfrac2n$만 보이고 $T_n-S_n\to0$이라 결론(아래로의 평가 없음)'
    detect_cue: $T_n-S_n\ge0$ 또는 각 항이 양수라는 언급이 없다
    feedback: 샌드위치 정리에는 양쪽 평가가 필요합니다. 각 항이 양수이므로 $0\le T_n-S_n$임을 함께 쓰세요.
    remedy: [RL-2]

