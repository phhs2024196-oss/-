key_idea: '$T_n=\sum\limits_{k=0}^{n-1}\dfrac{\frac2n}{\left(\left(\frac kn\right)^2+1\right)^2}$과 $S_n$의 차를 $0\le T_n-S_n\le\dfrac{2}{n^3}\sum(2k+1)=\dfrac2n$으로 묶어 $\lim T_n=\lim S_n$을 얻는다.'
