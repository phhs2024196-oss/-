key_idea: (1)은 $a$의 값별로 $x^2-ax+bc$가 정수 계수 일차식의 곱으로 인수분해되는 경우를 나열하고, (2)는 $b$가 소수이므로 $bc=\pm p$이고 $(x-1)(x-p)$, $(x+1)(x-p)$ 꼴만 가능함을 이용한다.
stuck: (2)에서 $bc=\pm p$($p$ 소수)이므로 가능한 인수분해가 4가지뿐이고 $x$의 계수 부호로 2가지로 줄어드는 것을 보는 단계
