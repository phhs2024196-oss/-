stimuli:
- label: 가
  body: |
    하나의 다항식을 두 개 이상의 다항식의 곱으로 나타내는 인수분해는 다항식의 전개 과정을 거꾸로 생각한 것이다. 다음 인수분해 공식은 곱셈 공식에서 얻은 것이다.
    (1) $a^2+2ab+b^2=(a+b)^2$
    (2) $a^2-2ab+b^2=(a-b)^2$
    (3) $a^2-b^2=(a+b)(a-b)$
    (4) $x^2+(a+b)x+ab=(x+a)(x+b)$
    (5) $acx^2+(ad+bc)x+bd=(ax+b)(cx+d)$
- label: 나
  body: |
    함수 $f(x)$가 어떤 구간에 속하는 임의의 두 수 $x_1$, $x_2$에 대하여 $x_1<x_2$일 때 $f(x_1)<f(x_2)$이면 함수 $f(x)$는 그 구간에서 증가한다고 한다. 또, $x_1<x_2$일 때 $f(x_1)>f(x_2)$이면 $f(x)$는 그 구간에서 감소한다고 한다. 함수 $f(x)$가 어떤 열린구간에서 미분이 가능할 때, 그 열린구간에 속하는 모든 $x$에 대하여
    (1) $f'(x)>0$이면 $f(x)$는 그 열린구간에서 증가한다.
    (2) $f'(x)<0$이면 $f(x)$는 그 열린구간에서 감소한다.
- label: 다
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고 $x=a$의 좌우에서
    (1) $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.
    (2) $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.
- label: 라
  body: |
    함수 $f(x)$에서 $x$의 값이 음수이면서 그 절댓값이 한없이 커질 때, $f(x)$의 값이 일정한 값 $L$에 한없이 가까워지면 이것을 기호로
    $$\lim_{x\to-\infty}f(x)=L\quad\text{또는}\quad x\to-\infty\text{일 때 }f(x)\to L$$
    과 같이 나타낸다.
- label: 마
  body: |
    어떤 시행에서 사건 $A$가 일어날 가능성을 수로 나타낸 것을 사건 $A$의 확률이라 하며, 이것을 기호로 $\mathrm{P}(A)$와 같이 나타낸다. 표본공간이 $S$인 어떤 시행에서 각 근원사건이 일어날 가능성이 모두 같은 정도로 기대될 때, 사건 $A$가 일어날 확률 $\mathrm{P}(A)$를 $\mathrm{P}(A)=\dfrac{n(A)}{n(S)}$로 정의하고, 이것을 표본공간 $S$에서 사건 $A$가 일어날 수학적 확률이라고 한다.
- label: 바
  body: |
    사인법칙
    삼각형ABC에서 $\angle\mathrm{A}$, $\angle\mathrm{B}$, $\angle\mathrm{C}$의 크기를 $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$로 나타내고, 이들의 대변의 길이를 각각 $a$, $b$, $c$로 나타내기로 한다. 이때, 삼각형ABC의 외접원의 반지름의 길이를 $R$라 하면 다음 법칙이 성립한다.
    $$\dfrac{a}{\sin A}=\dfrac{b}{\sin B}=\dfrac{c}{\sin C}=2R$$
- label: 사
  body: |
    삼각함수의 덧셈정리
    (1) $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$, $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$,
    (2) $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$, $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$,
    (3) $\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$, $\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$.

stem: |
  제시문 [가]~[사]를 읽고 다음 질문에 답하시오.
  [논제 2]
  정수가 적힌 공이 여러 개 들어있는 세 개의 상자 A, B, C가 있다. 상자 A, B, C에서 각각 임의로 1개씩의 공을 꺼냈을 때, 상자 A에서 꺼낸 공에 적힌 수를 $a$, 상자 B에서 꺼낸 공에 적힌 수를 $b$, 상자 C에서 꺼낸 공에 적힌 수를 $c$라 하자.

subparts:
- id: '1'
  stem: |
    상자 A에 0, 1, 2, 3, 4, 5가 각각 적힌 공 6개가, 상자 B에 1, 2, 3, 4, 5가 각각 적힌 공 5개가, 상자 C에 1, $-1$이 각각 적힌 공 2개가 들어있는 경우, 이차방정식 $x^2-ax+bc=0$이 서로 다른 2개의 정수해를 갖는 경우의 수를 구하여라. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '9', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a=0,1,\dots,5$ 각각에 대해 $x^2-ax+bc$가 서로 다른 정수근으로 인수분해되는 $bc$를 찾는다($bc\in\{\pm1,\dots,\pm5\}$).
    steps:
    - {id: 1a, content: '$a=0$: 2, $a=1$: 1, $a=2$: 1, $a=3$: 2, $a=4$: 2, $a=5$: 1 ⇒ 9', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $bc$가 가질 수 있는 값을 먼저 정리하자.
    - $a$의 값마다 인수분해를 시도해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.3
    steps:
    - id: 1b-1
      content: |
        $a$의 값에 따라 서로 다른 2개의 정수해를 갖는 경우는 다음과 같다(제시문 [가]).
        가) $a=0$: $x^2-1=(x-1)(x+1)=0$, $x^2-4=(x-2)(x+2)=0$
        나) $a=1$: $x^2-x-2=(x-2)(x+1)=0$
        다) $a=2$: $x^2-2x-3=(x-3)(x+1)=0$
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        라) $a=3$: $x^2-3x+2=(x-1)(x-2)=0$, $x^2-3x-4=(x-4)(x+1)=0$
        마) $a=4$: $x^2-4x+3=(x-1)(x-3)=0$, $x^2-4x-5=(x-5)(x+1)=0$
        바) $a=5$: $x^2-5x+4=(x-1)(x-4)=0$
      criteria: [1.A1]
    - id: 1b-3
      content: |
        각 방정식의 $bc$ 값은 $(b,c)$ 한 쌍으로만 만들어지므로($bc\in\{-1,-4,-2,-3,2,-4,3,-5,4\}$, $b\in\{1,\dots,5\}$, $c=\pm1$) 서로 다른 2개의 정수해를 갖는 경우의 수는 9이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $a$의 값에 따라 경우를 나누어 인수분해로 정수해를 찾았다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $a=0,\dots,5$ 각각의 경우(2, 1, 1, 2, 2, 1가지)를 빠짐없이 찾았다.
      depends_on: [1.M1]
      steps: [1b-1, 1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: 경우의 수 9를 답했다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CNT-6614}
  misconceptions:
  - id: MC-CNT-6614
    outcome_code: '70'
    wrong_work: '중근($x^2-2x+1$, $x^2-4x+4$)까지 포함하거나 $a=0$의 $x^2-4$를 빠뜨려 11, 8 등으로 답함'
    detect_cue: 중근인 방정식이 목록에 있거나 $a=0$에서 한 가지만 셌다
    feedback: 서로 다른 두 정수해이므로 중근은 제외하고, $bc$가 될 수 있는 값($\pm1$~$\pm5$)을 모두 점검하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    상자 A에 2부터 16까지 자연수가 각각 하나씩 적힌 15개의 공이, 상자 B에 2, 3, 5, 7, 11, 13, 17, 19가 각각 적힌 8개의 공이, 상자 C에 1, $-1$이 각각 적힌 2개의 공이 들어있는 경우를 생각하자. 이차방정식 $x^2-ax+bc=0$이 서로 다른 2개의 정수해를 가질 확률을 구하여라. (15점)
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{1}{20}', equivalents: ['1/20'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $bc=\pm p$이므로 근은 $\{1,p\}$ 또는 $\{-1,p\}$, 즉 $a=p+1$ 또는 $a=p-1$이 상자 A에 있어야 한다.
    steps:
    - {id: 2a, content: '$p=2$: 1, $p=3,5,7,11,13$: 각 2, $p=17$: 1, $p=19$: 0 ⇒ $\dfrac{12}{240}=\dfrac{1}{20}$', criteria: [2.M1, 2.R1, 2.A1, 2.A2]}
    hint_ladder:
    - 상자 B의 수의 공통점은?
    - $bc=\pm p$일 때 $x^2-ax+bc$를 인수분해하는 방법은 몇 가지인가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.3
    steps:
    - id: 2b-1
      content: |
        상자 B에 들어있는 수는 모두 소수이다. 따라서 $bc=p$ 또는 $bc=-p$라고 할 수 있다. 이때 이차방정식을 인수분해하여 나타낼 수 있는 경우는 다음 4가지가 있다.
        $(x-1)(x-p)=x^2-(p+1)x+p=0$, $(x+1)(x+p)=x^2+(p+1)x+p=0$,
        $(x-1)(x+p)=x^2-(1-p)x-p=0$, $(x+1)(x-p)=x^2-(p-1)x-p=0$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $x$의 계수 $-a$가 음수이므로 가능한 경우는 다음 2가지이다.
        $(x-1)(x-p)=x^2-(p+1)x+p=0$, $x=1$ 또는 $x=p$; $(x+1)(x-p)=x^2-(p-1)x-p=0$, $x=-1$ 또는 $x=p$.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        상자 B의 3 이상 13 이하의 소수 $p$에 대해 상자 A에 $p-1$, $p+1$이 있고, 2에 대해 3은 있고 1은 없고, 17에 대해 16은 있고 18은 없으며, 19에 대해 18, 20 모두 없다. 그러므로 서로 다른 2개의 정수해를 갖는 경우의 수는 $1+5\times2+1=12$이다.
      criteria: [2.A1]
    - id: 2b-4
      content: |
        상자 A, B, C에서 공을 각각 임의로 1개씩의 공을 꺼내는 경우의 수는 $15\times8\times2=240$이다. 따라서 서로 다른 2개의 정수해를 가질 확률은 제시문 [마]에 의해 $\dfrac{1+5\times2+1}{15\times8\times2}=\dfrac{1}{20}$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: $b$가 소수이므로 $bc=\pm p$이고 가능한 인수분해 4가지를 제시했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: $a>0$(계수 부호)로 $(x-1)(x-p)$, $(x+1)(x-p)$ 두 경우로 줄였다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: 각 소수에 대해 $p\pm1$이 상자 A에 있는지 확인해 경우의 수 12를 구했다.
      depends_on: [2.R1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: 전체 경우의 수 240과 확률 $\dfrac{1}{20}$을 구했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-6615}
  misconceptions:
  - id: MC-CNT-6615
    outcome_code: '71'
    wrong_work: '모든 소수에 대해 2가지씩 있다고 보아 $\dfrac{16}{240}=\dfrac{1}{15}$로 답함'
    detect_cue: 경우의 수가 16이거나 $p=2,17,19$를 따로 확인하지 않았다
    feedback: $a=p\pm1$이 상자 A(2~16)에 실제로 있는지 경계의 소수 2, 17, 19에서 확인하세요.
    remedy: [RL-2]

