  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6620}
  - {code: '71', misconception: MC-GEO-6621}
  misconceptions:
  - id: MC-CAL-6620
    outcome_code: '70'
    wrong_work: '원이 항상 AD에 접한다고 보고 $r_1=\dfrac{\sin\theta}{2(3\cos\theta+\sin\theta+1)}$만 최대화해 $\theta\to\dfrac{\pi}{2}$ 쪽 값($\dfrac14$ 등)을 답함'
    detect_cue: $r_2$(CD에 접하는 경우)가 없다
    feedback: θ가 크면 원은 빗변 CD에 먼저 닿습니다. 두 제약 중 작은 반지름이 실제 반지름입니다.
    remedy: [RL-1]
  - id: MC-GEO-6621
    outcome_code: '71'
