stimuli:
- label: 가
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고 $x=a$의 좌우에서
    (1) $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.
    (2) $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.
- label: 나
  body: |
    함수 $f(x)$에서 $x$의 값이 음수이면서 그 절댓값이 한없이 커질 때, $f(x)$의 값이 일정한 값 $L$에 한없이 가까워지면 이것을 기호로
    $$\lim_{x\to-\infty}f(x)=L\quad\text{또는}\quad x\to-\infty\text{일 때 }f(x)\to L$$
    과 같이 나타낸다.
- label: 다
  body: |
    사인함수와 코사인함수의 도함수
    (1) $y=\sin x$이면 $y'=\cos x$
    (2) $y=\cos x$이면 $y'=-\sin x$
- label: 라
  body: |
    서로 다른 $n$개에서 $r\ (0\le r\le n)$개를 택하는 조합의 수는
    $${}_nC_r=\dfrac{n!}{r!(n-r)!}$$

stem: |
  Ⅰ. 다음 제시문을 읽고 논제에 답하시오. (60점)
  [논제 I] 제시문 [가]~[라]를 읽고 다음 질문에 답하시오.
  [논제 I-3]
  대한과 민국 모두 현재 1원을 가지고 있다. 대한은 1원을 위험자산에 투자하고 민국은 1원을 은행에 예금한다. 대한과 민국의 $n$일 후의 재산을 각각 $A_n$과 $B_n$이라 하자. (단, $A_0=B_0=1$, $n=1,2,\ldots$) 대한의 $n+1$일 후 재산은 $p$의 확률로 $uA_n$, $q$의 확률로 $dA_n$이 되고 민국의 $n+1$일 후의 재산은 항상 $rB_n$이 된다. (단, $p+q=1$, $p>0$, $q>0$이고 $u>r>1>d>0$)
  $n$일 후의 대한의 재산은 각 $n$마다 서로 독립적으로 결정된다고 할 때, 다음 질문에 답하시오.

subparts:
- id: '1'
  stem: |
    $P_k$을 $k$일 동안 대한의 재산이 정확히 $m$번 상승할 확률이라고 정의하자. 다음 식의 값이 $a_1$, $a_2$, $a_3$, $a_4$에 대하여 다음과 같이 표현될 때 $a_1+a_2+a_3$의 값을 구하시오. (단, $m$은 2022보다 작은 자연수) (15점)
    $$\sum_{k=m}^{2022}P_k\times q^{-k}=p^{a_1}\times q^{a_2}\times{}_{a_3}C_{a_4}$$
  points: 15
  depends_on: []
  answer: {kind: value, value: '2023', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $P_k={}_kC_mp^mq^{k-m}$, $\sum_{k=m}^{2022}{}_kC_m={}_{2023}C_{m+1}$ ⇒ $a_1=m$, $a_2=-m$, $a_3=2023$.
    steps:
    - {id: 1a, content: '$p^mq^{-m}\,{}_{2023}C_{m+1}$ ⇒ $a_1+a_2+a_3=2023$', criteria: [1.M1, 1.A1, 1.M2, 1.A2]}
    hint_ladder:
    - $k$일 동안 상승 횟수는 어떤 분포를 따르는가?
    - ${}_kC_m$은 $(1+x)^k$에서 $x^m$의 계수이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.3
    steps:
    - id: 1b-1
      content: |
        $X$를 $k$일 동안 대한이의 재산이 상승한 횟수라고 정의하면 $X$는 이항분포 $B(k,p)$를 따른다. 따라서 확률 $P_k$는 $P_k=P(X=m)={}_kC_mp^mq^{k-m}$이다(제시문 [라]).
      criteria: [1.M1]
    - id: 1b-2
      content: |
        구하려는 값은 $\displaystyle\sum_{k=m}^{2022}P_k\times q^{-k}=\sum_{k=m}^{2022}{}_kC_m\left(\dfrac pq\right)^m=\left(\dfrac pq\right)^m\sum_{k=m}^{2022}{}_kC_m$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        여기서 ${}_mC_m$은 $(x+1)^m$에서 $x^m$의 계수, ${}_{m+1}C_m$은 $(x+1)^{m+1}$에서 $x^m$의 계수, $\cdots$, ${}_{2022}C_m$은 $(x+1)^{2022}$에서 $x^m$의 계수이므로 $\displaystyle\sum_{k=m}^{2022}{}_kC_m$은
        $(1+x)^m+(1+x)^{m+1}+\cdots+(1+x)^{2022}=(1+x)^m\times\dfrac{(1+x)^{2023-m}-1}{x}=\dfrac{(1+x)^{2023}-(1+x)^m}{x}$의 $x^m$의 계수이다. 즉, $(1+x)^{2023}-(1+x)^m$의 $x^{m+1}$의 계수와 같고 ${}_{2023}C_{m+1}$이다.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        즉, $\displaystyle\sum_{k=m}^{2022}P_k\times q^{-k}=p^mq^{-m}\,{}_{2023}C_{m+1}$이다. 따라서 $a_1=m$, $a_2=-m$, $a_3=2023$이고 $a_1+a_2+a_3=2023$이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 상승 횟수가 이항분포 $B(k,p)$를 따름을 밝히고 $P_k={}_kC_mp^mq^{k-m}$을 썼다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 합을 $\left(\dfrac pq\right)^m\sum_{k=m}^{2022}{}_kC_m$으로 정리했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 계수 비교(또는 파스칼 삼각형의 성질)로 $\sum_{k=m}^{2022}{}_kC_m={}_{2023}C_{m+1}$을 보였다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: $a_1=m$, $a_2=-m$, $a_3=2023$으로 $a_1+a_2+a_3=2023$을 답했다.
      depends_on: [1.A1, 1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6622}
  misconceptions:
  - id: MC-PRB-6622
    outcome_code: '70'
    wrong_work: '$\sum_{k=m}^{2022}{}_kC_m={}_{2022}C_{m}$ 또는 ${}_{2023}C_m$으로 두어 $a_3=2022$ 등으로 답함'
    detect_cue: 아래첨자가 $m+1$이 아니거나 합의 근거가 없다
    feedback: ${}_mC_m+{}_{m+1}C_m+\cdots+{}_NC_m={}_{N+1}C_{m+1}$입니다. $(1+x)^k$의 계수 합이나 파스칼 삼각형으로 확인하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    $r^4=ud^3$일 때, 64일 후의 대한이의 재산이 민국의 재산보다 크거나 같을 확률이 0.1587이라고 한다. $p$와 $q$의 값을 구하시오. (단, $0.1<p<0.9$이며 $Z$가 표준정규분포를 따르는 확률변수일 때, $P(0\le Z\le1)=0.3413$, $P(0\le Z\le2)=0.4772$. $P(0\le Z\le3)=0.4987$로 계산한다.) (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: 'p=\dfrac15,\ q=\dfrac45', equivalents: ['p=0.2, q=0.8'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $A_{64}\ge B_{64}\iff X\ge16$, 정규근사로 $\dfrac{16-64p}{8\sqrt{pq}}=1$.
    steps:
    - {id: 2a, content: '$2-8p=\sqrt{p(1-p)}$, $p<\dfrac14$ ⇒ $p=\dfrac15$', criteria: [2.M1, 2.A1, 2.M2, 2.A2]}
    hint_ladder:
    - $r^{64}$을 $u$, $d$로 나타내 보자.
    - $X\ge16$의 확률을 표준화하면 0.1587은 $P(Z\ge?)$인가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.3~4
    steps:
    - id: 2b-1
      content: |
        $X$를 64일 동안 대한이의 재산의 상승 횟수라고 하면 $A_{64}=u^Xd^{(64-X)}$이고 $B_{64}=r^{64}$이다. 따라서 64일 후의 대한이의 재산이 민국의 재산보다 크거나 같을 확률은
        $P(A_{64}\ge B_{64})=P(u^Xd^{(64-X)}\ge r^{64})=P(u^Xd^{(64-X)}\ge u^{16}d^{48})=P(X\ge16)$
        ($r^{64}=(ud^3)^{16}$이고 $u^Xd^{64-X}\div u^{16}d^{48}=\left(\dfrac ud\right)^{X-16}$, $\dfrac ud>1$).
      criteria: [2.M1, 2.A1]
    - id: 2b-2
      content: |
        $X$는 이항분포 $B(64,p)$를 따르고 $64p$, $64(1-p)\ge5$이므로 정규분포 $N(64p,64pq)$로 근사할 수 있다.
        $P(X\ge16)=P\left(\dfrac{X-64p}{\sqrt{64pq}}\ge\dfrac{16-64p}{\sqrt{64pq}}\right)=P\left(Z\ge\dfrac{16-64p}{\sqrt{64pq}}\right)$. 여기서 $Z$는 표준정규분포이다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        즉, $0.1587=P(A_{64}\ge B_{64})=P\left(Z\ge\dfrac{16-64p}{\sqrt{64pq}}\right)$이고 $P(Z\ge1)=0.5-0.3413=0.1587$이므로 $\dfrac{16-64p}{\sqrt{64pq}}=1$이다.
        (보충) $2-8p=\sqrt{p(1-p)}$에서 $2-8p>0$, 즉 $p<\dfrac14$이고, 제곱하면 $65p^2-33p+4=(5p-1)(13p-4)=0$이므로 $p=\dfrac15$ ($p=\dfrac{4}{13}>\dfrac14$는 제외). $p+q=1$에서 $p=\dfrac15$, $q=\dfrac45$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: $A_{64}=u^Xd^{64-X}$, $B_{64}=r^{64}=u^{16}d^{48}$으로 나타냈다.
      depends_on: []
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: $P(A_{64}\ge B_{64})=P(X\ge16)$을 이끌었다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: $B(64,p)$를 $N(64p,64pq)$로 근사하고 표준화했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: $\dfrac{16-64p}{\sqrt{64pq}}=1$에서 $p=\dfrac15$, $q=\dfrac45$를 구했다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRB-6623}
  misconceptions:
  - id: MC-PRB-6623
    outcome_code: '71'
    wrong_work: '제곱해서 얻은 $p=\dfrac{4}{13}$도 답에 포함하거나 $p=\dfrac{4}{13}$을 답함'
    detect_cue: 답에 $\dfrac{4}{13}$이 있다
    feedback: $\dfrac{16-64p}{\sqrt{64pq}}=1>0$이므로 $16-64p>0$, 즉 $p<\dfrac14$이어야 합니다.
    remedy: [RL-2]

