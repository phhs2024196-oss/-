stimuli:
- label: 가
  body: |
    평면 $\alpha$ 위에 있는 도형의 넓이를 $\mathrm{S}$, 이 도형의 평면 $\beta$ 위로의 정사영의 넓이를 $\mathrm{S'}$이라 할 때, 두 평면 $\alpha$와 $\beta$가 이루는 각의 크기를 $\theta\ (0^\circ\le\theta\le90^\circ)$라 하면
    $$\mathrm{S'}=\mathrm{S}\cos\theta.$$
- label: 나
  body: |
    등비급수 $\displaystyle\sum_{n=1}^{\infty}ar^{n-1}=a+ar+ar^2+\cdots+ar^{n-1}+\cdots\ (a\neq0)$은
    (1) $|r|<1$일 때, 수렴하고 그 합은 $\dfrac{a}{1-r}$이다.
    (2) $|r|\ge1$일 때, 발산한다.
- label: 다
  body: |
    미분가능한 두 함수 $f(x)$와 $g(x)\ (g(x)\neq0)$에 대하여
    (1) $\left\{\dfrac{1}{g(x)}\right\}'=-\dfrac{g'(x)}{\{g(x)\}^2}$
    (2) $\left\{\dfrac{f(x)}{g(x)}\right\}'=\dfrac{f'(x)g(x)-f(x)g'(x)}{\{g(x)\}^2}$
- label: 라
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고, $x=a$의 좌우에서
    (1) $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.
    (2) $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.

stem: |
  Ⅰ. 다음 제시문을 읽고 논제에 답하시오. (60점)
  [논제 I-1] 가로가 3, 세로가 2인 직사각형을 밑면으로 하는 투명한 직육면체 안에 반지름의 길이가 1인 공 3개가 들어 있다. 각각의 공은 직육면체에 내접하고, 가운데 공은 아래의 그림과 같이 나머지 두 공과 외접하고 있다. 단, 투명한 직육면체의 두께는 무시할 수 있고, 지면은 직육면체의 밑면과 평행하다.
  [그림 설명: 지면 위에 세워진 직육면체(밑면 가로 3, 세로 2). 안에 공 3개가 세로로 쌓여 있다. 아래 공과 위 공은 왼쪽 옆면 쪽에, 가운데 공은 오른쪽 옆면 쪽에 붙어 있고 가운데 공이 위·아래 공과 각각 외접한다. 오른쪽에서 붉은 화살표(햇빛)가 왼쪽 아래 방향으로 직육면체의 우측 옆면을 향해 비추며, 오른쪽 지면에 햇빛과 지면이 이루는 각 30°가 두 군데 표시되어 있다.]

subparts:
- id: '1'
  stem: |
    맨 위의 공이 직육면체의 위쪽 밑면에 내접할 때, 직육면체의 높이를 구하고, 그 근거를 논술하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '2+2\sqrt3', equivalents: ['2+2√3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 이웃한 두 공의 중심 거리 2, 가로 차 1 ⇒ 세로 차 $\sqrt3$, 높이 $1+2\sqrt3+1$.
    steps:
    - {id: 1a, content: '높이 $=2+2\sqrt3$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 공의 중심을 지나고 가로 3인 면에 평행한 단면을 보자.
    - 외접하는 두 공의 중심 사이 거리는 얼마인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.1
    steps:
    - id: 1b-1
      content: |
        직육면체를 정면에서 바라본 단면(그림 1)에서 아래 공과 가운데 공의 중심을 잇는 선분(빗변)의 길이는 $1+1=2$이고, 두 중심의 가로 차(밑변)는 $3-1-1=1$이다. 이 직각삼각형에서 빗변 2, 밑변 1이므로 밑변과 빗변이 이루는 각 $\theta$는 $60^\circ$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        두 중심의 높이 차는 $2\sin60^\circ=\sqrt3$이고, 위 공과 가운데 공도 같다. 따라서 직육면체의 높이는 $1+\sqrt3+\sqrt3+1=2+2\sqrt3$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 중심 사이 거리 2, 가로 차 1인 직각삼각형(각 $60^\circ$ 또는 세로 차 $\sqrt3$)을 제시했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 높이 $2+2\sqrt3$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6607}
  misconceptions:
  - id: MC-GEO-6607
    outcome_code: '70'
    wrong_work: '공이 수직으로 쌓였다고 보고 높이를 $6$으로 답함'
    detect_cue: 답이 6이거나 가로 차 1을 쓰지 않았다
    feedback: 가운데 공은 옆으로 비켜 있으므로 중심 사이의 세로 차는 지름 2보다 작습니다. 가로 차와 피타고라스 정리를 쓰세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    그림과 같이 태양광선이 지면과 $30^\circ$의 각을 이루며 직육면체의 우측 옆면을 정면으로 비추고 있을 때, 좌측의 지면에 드리워진 그림자의 넓이를 구하고, 그 근거를 논술하시오. (20점)
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{14}{3}\pi+\sqrt3', equivalents: ['14π/3+√3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 광선 방향에서 보면 세 단위원이 일렬로, 한 쌍은 중심각 $120^\circ$로 겹치고 다른 한 쌍은 접한다. 단면 넓이 $\dfrac73\pi+\dfrac{\sqrt3}{2}$를 $\cos60^\circ$로 나눈다.
    steps:
    - {id: 2a, content: '$\left(\dfrac73\pi+\dfrac{\sqrt3}{2}\right)\div\cos\dfrac{\pi}{3}=\dfrac{14}{3}\pi+\sqrt3$', criteria: [2.M1, 2.A1, 2.M2, 2.A2]}
    hint_ladder:
    - 햇빛 방향에서 공 세 개가 어떻게 보이는지 그려 보자.
    - 그림자는 햇빛에 수직인 단면의 정사영이다. 두 평면이 이루는 각은?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.1
    steps:
    - id: 2b-1
      content: |
        태양광선 방향에서 본 공의 모양(그림 2)은 반지름 1인 원 세 개이다. 그림 1에서 광선이 지면과 $30^\circ$를 이루므로, 아래 공과 가운데 공의 중심을 잇는 선분은 광선과 $30^\circ$를 이루어 광선 방향에서 보면 두 원이 겹치고, 겹친 부분의 부채꼴 중심각은 $\theta'=2\theta=120^\circ$이다. 가운데 공과 위 공의 중심을 잇는 선분은 광선에 수직이어서 두 원은 접한다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        겹친 부분(주황색)의 절반은 반지름 1, 중심각 $120^\circ$인 부채꼴에서 두 변 1, 끼인각 $120^\circ$인 삼각형을 뺀 것이므로 $\dfrac13\pi-\dfrac12\sin\dfrac{2\pi}{3}=\dfrac13\pi-\dfrac{\sqrt3}{4}$. 따라서 단면의 넓이는 $3\pi-2\left(\dfrac13\pi-\dfrac{\sqrt3}{4}\right)=\dfrac73\pi+\dfrac{\sqrt3}{2}$.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        이 단면(광선에 수직인 평면)과 지면이 이루는 각은 $60^\circ$(그림 3)이고, 그림자는 단면을 지면에 광선 방향으로 투영한 것이므로 제시문 [가]에 의해 (단면 넓이) $=$ (그림자 넓이)$\times\cos60^\circ$.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        그림자의 넓이 $=\left(\dfrac73\pi+\dfrac{\sqrt3}{2}\right)\div\cos\dfrac{\pi}{3}=\dfrac{14}{3}\pi+\sqrt3$.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 광선 방향에서 본 세 원의 배치(겹침의 중심각 $120^\circ$, 나머지 두 원은 접함)를 밝혔다.
      depends_on: []
      ft: {allowed: true, from: [1.M1], max_points: 5}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: 단면의 넓이 $\dfrac73\pi+\dfrac{\sqrt3}{2}$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: 단면과 지면이 이루는 각 $60^\circ$와 정사영 관계(그림자 $=$ 단면 $\div\cos60^\circ$)를 제시했다.
      depends_on: []
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: 그림자의 넓이 $\dfrac{14}{3}\pi+\sqrt3$을 구했다.
      depends_on: [2.A1, 2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-6608}
  misconceptions:
  - id: MC-GEO-6608
    outcome_code: '71'
    wrong_work: '그림자 넓이를 $\left(\dfrac73\pi+\dfrac{\sqrt3}{2}\right)\cos60^\circ=\dfrac76\pi+\dfrac{\sqrt3}{4}$로 계산'
    detect_cue: 그림자 넓이가 단면 넓이보다 작다
    feedback: 지면 위의 그림자를 광선에 수직인 평면에 정사영한 것이 단면입니다. 그림자 $=$ 단면 $\div\cos60^\circ$.
    remedy: [RL-2]

