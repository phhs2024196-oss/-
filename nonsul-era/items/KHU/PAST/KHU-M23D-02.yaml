stimuli:
- label: 가
  body: |
    평면 $\alpha$ 위에 있는 도형의 넓이를 $\mathrm{S}$, 이 도형의 평면 $\beta$ 위로의 정사영의 넓이를 $\mathrm{S'}$이라 할 때, 두 평면 $\alpha$와 $\beta$가 이루는 각의 크기를 $\theta\ (0^\circ\le\theta\le90^\circ)$라 하면
    $$\mathrm{S'}=\mathrm{S}\cos\theta.$$
- label: 나
  body: |
    등비급수 $\displaystyle\sum_{n=1}^{\infty}ar^{n-1}=a+ar+ar^2+\cdots+ar^{n-1}+\cdots\ (a\neq0)$은
    (1) $|r|<1$일 때, 수렴하고 그 합은 $\dfrac{a}{1-r}$이다.
    (2) $|r|\ge1$일 때, 발산한다.
- label: 다
  body: |
    미분가능한 두 함수 $f(x)$와 $g(x)\ (g(x)\neq0)$에 대하여
    (1) $\left\{\dfrac{1}{g(x)}\right\}'=-\dfrac{g'(x)}{\{g(x)\}^2}$
    (2) $\left\{\dfrac{f(x)}{g(x)}\right\}'=\dfrac{f'(x)g(x)-f(x)g'(x)}{\{g(x)\}^2}$
- label: 라
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고, $x=a$의 좌우에서
    (1) $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.
    (2) $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.

stem: |
  Ⅰ. 다음 제시문을 읽고 논제에 답하시오. (60점)
  [논제 I-2] 원점이 O이고 점 B가 $x$축에 있다고 하자. $\overline{\mathrm{OA}}=1$이고, 중심각이 $\angle\mathrm{AOB}=2\theta$인 부채꼴 OAB 안에 그림과 같이 내접하는 원을 그리고, 그 중심을 $\mathrm{C_1}$이라 하자. 선분 OA, 선분 OB와 중심이 $\mathrm{C_1}$인 원과 그림과 같이 접하는 두 번째 원의 중심을 $\mathrm{C_2}$라 하자. 같은 방법으로 그림과 같이 인접하는 원들끼리 서로 접하는 원들을 무한히 그리고, 각각의 중심을 $\mathrm{C_3},\mathrm{C_4},\cdots$라고 하자. 이때, 중심이 $\mathrm{C}_n$인 원의 반지름을 $r_n$이라 하자. 단, $0<\theta<\dfrac{\pi}{2}$이다.
  [그림 설명: 좌표평면에서 O를 꼭짓점으로 하고 B는 x축 위, A는 제1사분면에 있는 부채꼴 OAB. 호 AB와 선분 OA, OB에 접하는 가장 큰 원(중심 C₁)이 있고, 호와의 접점이 D이다. 각 AOB의 이등분선(O와 D를 잇는 선분) 위에 C₁, C₂, C₃, C₄가 O 쪽으로 차례로 놓이며, 원들은 점점 작아지면서 OA, OB에 접하고 이웃한 원과 외접한다.]

subparts:
- id: '1'
  stem: |
    부채꼴 OAB 안에 접하는 모든 원들의 넓이의 합을 구하고, 그 근거를 논술하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: expression, value: '\dfrac{\pi}{4}\sin\theta', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $r_1=\dfrac{\sin\theta}{1+\sin\theta}$, 반지름 공비 $\dfrac{1-\sin\theta}{1+\sin\theta}$, 넓이 공비는 그 제곱.
    steps:
    - {id: 1a, content: '$\displaystyle\sum A_n=\dfrac{\pi r_1^2}{1-\left(\frac{1-\sin\theta}{1+\sin\theta}\right)^2}=\dfrac{\pi}{4}\sin\theta$', criteria: [1.M1, 1.A1, 1.M2, 1.A2]}
    hint_ladder:
    - 첫 번째 원의 중심에서 OB에 수선을 내려 보자.
    - 이웃한 두 원의 중심을 잇고 작은 원의 중심에서 큰 원 쪽 수선을 생각하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.2
    steps:
    - id: 1b-1
      content: |
        중심이 $\mathrm{C_1}$인 원이 부채꼴과 접하는 점을 D(호), E(OA), F(OB)라 하면 선분 $\mathrm{OC_1}$의 연장선과 호 AB가 D에서 만난다. $\overline{\mathrm{C_1D}}=\overline{\mathrm{C_1F}}=r_1$이고 $\angle\mathrm{BOD}=\theta$이므로 삼각형 $\mathrm{C_1OF}$에서 $\sin\theta=\dfrac{\overline{\mathrm{C_1F}}}{\overline{\mathrm{OC_1}}}=\dfrac{r_1}{1-r_1}$, 따라서 $r_1=\dfrac{\sin\theta}{1+\sin\theta}$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        자연수 $n$에 대해 중심이 $\mathrm{C}_{n+1}$인 원은 중심이 $\mathrm{C}_n$인 원과 접하므로 $\sin\theta=\dfrac{r_n-r_{n+1}}{r_n+r_{n+1}}$이고, $r_{n+1}=\dfrac{1-\sin\theta}{1+\sin\theta}r_n$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        중심이 $\mathrm{C}_n$인 원의 넓이를 $A_n$이라 하면 $\{A_n\}$은 첫째항 $\pi r_1^2=\pi\left(\dfrac{\sin\theta}{1+\sin\theta}\right)^2$, 공비 $\left(\dfrac{1-\sin\theta}{1+\sin\theta}\right)^2$인 등비수열이다(공비는 0과 1 사이).
      criteria: [1.M2]
    - id: 1b-4
      content: |
        제시문 [나]에 의해 $\displaystyle\sum_{n=1}^{\infty}A_n=\dfrac{\pi\left(\frac{\sin\theta}{1+\sin\theta}\right)^2}{1-\left(\frac{1-\sin\theta}{1+\sin\theta}\right)^2}=\dfrac{\pi\sin^2\theta}{4\sin\theta}=\dfrac{\pi}{4}\sin\theta$.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 삼각형 $\mathrm{C_1OF}$에서 $\sin\theta=\dfrac{r_1}{1-r_1}$로 $r_1=\dfrac{\sin\theta}{1+\sin\theta}$를 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $r_{n+1}=\dfrac{1-\sin\theta}{1+\sin\theta}r_n$을 근거와 함께 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 넓이가 첫째항 $\pi r_1^2$, 공비 $\left(\dfrac{1-\sin\theta}{1+\sin\theta}\right)^2$인 등비수열임을 밝히고 등비급수 합 공식을 적용했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 넓이의 합 $\dfrac{\pi}{4}\sin\theta$를 구했다.
      depends_on: [1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6609}
  misconceptions:
  - id: MC-CAL-6609
    outcome_code: '70'
    wrong_work: '넓이의 공비를 $\dfrac{1-\sin\theta}{1+\sin\theta}$로 두어 합을 $\dfrac{\pi\sin\theta}{2(1+\sin\theta)}$로 계산'
    detect_cue: 넓이 급수의 공비가 제곱되어 있지 않다
    feedback: 반지름이 $k$배이면 넓이는 $k^2$배입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    $0<\theta<\dfrac{\pi}{2}$에서 $\theta$의 값이 변하면, 모든 원들의 크기가 변한다. $r_{100}=f(\theta)$라 할 때, $f(\theta)$가 최대가 되는 경우의 $\theta$에 대해서 $r_1$의 값을 구하고, 그 근거를 논술하시오. (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{1}{200}', equivalents: ['1/200'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x=\sin\theta$, $g(x)=\dfrac{x(1-x)^{99}}{(1+x)^{100}}$, $g'(x)=\dfrac{(1-x)^{98}(1-199x)}{(1+x)^{101}}$ ⇒ $\sin\theta=\dfrac{1}{199}$.
    steps:
    - {id: 2a, content: '$r_1=\dfrac{1/199}{1+1/199}=\dfrac{1}{200}$', criteria: [2.M1, 2.M2, 2.A1, 2.R1, 2.A2]}
    hint_ladder:
    - $r_{100}$을 $\sin\theta$만의 식으로 나타내 보자.
    - $\sin\theta=x$로 치환하면 미분이 쉬워진다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.2~3
    steps:
    - id: 2b-1
      content: |
        (1)에서 $\{r_n\}$은 첫째항 $r_1$, 공비 $\dfrac{1-\sin\theta}{1+\sin\theta}$인 등비수열이므로 $r_n=\dfrac{\sin\theta(1-\sin\theta)^{n-1}}{(1+\sin\theta)^n}$, 따라서 $r_{100}=\dfrac{\sin\theta(1-\sin\theta)^{99}}{(1+\sin\theta)^{100}}=f(\theta)$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $x=\sin\theta$, $g(x)=\dfrac{x(1-x)^{99}}{(1+x)^{100}}$라 하면 $f(\theta)=g(\sin\theta)$, $f'(\theta)=g'(\sin\theta)\cos\theta$이고 $0<\theta<\dfrac{\pi}{2}$에서 $\cos\theta>0$, $0<x<1$이므로 $g'(x)=0$인 $x$를 찾으면 된다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        제시문 [다]에 의해 $g'(x)=\dfrac{\{(1-x)^{99}-99x(1-x)^{98}\}(1+x)^{100}-100x(1-x)^{99}(1+x)^{99}}{(1+x)^{200}}$이고 정리하면
        $g'(x)=\dfrac{(1-x)^{98}\{(1+x)(1-100x)-100x(1-x)\}}{(1+x)^{101}}=\dfrac{(1-x)^{98}(1-199x)}{(1+x)^{101}}$.
      criteria: [2.A1]
    - id: 2b-4
      content: |
        $\sin\theta=\dfrac{1}{199}$을 만족하는 $0<\theta<\dfrac{\pi}{2}$는 $\sin\theta$가 증가함수이므로 유일하게 존재하고, 이를 $\theta_0$이라 하자. $\theta<\theta_0$이면 $f'(\theta)>0$, $\theta>\theta_0$이면 $f'(\theta)<0$이므로 제시문 [라]에 의해 $f(\theta)$는 $\theta=\theta_0$에서 극댓값을 갖고 이는 최댓값이다.
      criteria: [2.R1]
    - id: 2b-5
      content: |
        즉, $r_{100}$은 $\sin\theta=\dfrac{1}{199}$일 때 최대가 된다. 이때 $r_1=\dfrac{\sin\theta}{1+\sin\theta}=\dfrac{\frac{1}{199}}{1+\frac{1}{199}}=\dfrac{1}{200}$.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: $r_{100}=\dfrac{\sin\theta(1-\sin\theta)^{99}}{(1+\sin\theta)^{100}}$을 구했다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: '$x=\sin\theta$ 치환(또는 직접 미분)으로 $f\,''(\theta)=g\,''(\sin\theta)\cos\theta$, $\cos\theta>0$을 밝혔다.'
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $g'(x)=\dfrac{(1-x)^{98}(1-199x)}{(1+x)^{101}}$을 구했다.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: $\sin\theta=\dfrac{1}{199}$의 좌우에서 도함수 부호가 양에서 음으로 바뀌어 최대임을 밝혔다.
      depends_on: [2.A1]
      steps: [2b-4]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: $r_1=\dfrac{1}{200}$을 구했다.
      depends_on: [2.R1]
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-6610}
  misconceptions:
  - id: MC-CAL-6610
    outcome_code: '71'
    wrong_work: '$g''(x)=0$의 해로 $x=1$도 후보로 두거나 부호 변화 확인 없이 $\sin\theta=\dfrac{1}{199}$을 최대로 단정'
    detect_cue: 극대 판정(부호 변화) 또는 $0<x<1$ 범위 언급이 없다
    feedback: 치환한 변수의 범위 $0<x<1$을 확인하고, 도함수의 부호 변화로 최대임을 밝히세요.
    remedy: [RL-2]

