stimuli:
- label: 다
  body: |
    부정적분
    $F'(x)=f(x)$ 일 때,
    $$\int f(x)dx=F(x)+C\ (\text{단, }C\text{는 적분상수})$$
- label: 라
  body: |
    부분적분법
    두 함수 $f(x)$, $g(x)$가 미분가능할 때
    $$\int f(x)g'(x)dx=f(x)g(x)-\int f'(x)g(x)dx$$
- label: 마
  body: |
    함수의 증가와 감소의 판정
    함수 $f(x)$가 어떤 구간에서 미분가능하고, 이 구간의 모든 $x$에 대하여
    ① $f'(x)>0$이면 $f(x)$는 이 구간에서 증가한다.
    ② $f'(x)<0$이면 $f(x)$는 이 구간에서 감소한다.

