subparts:
- id: '1'
  stem: |
    다음 부정적분 $\displaystyle\int x\sin x\,dx$ 과 $\displaystyle\int x\cos x\,dx$ 를 구하시오. (8점)
  points: 8
  depends_on: []
  answer: {kind: expression, value: '-x\cos x+\sin x+C,\ x\sin x+\cos x+C', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 다항식 쪽을 미분, 삼각함수 쪽을 적분하는 부분적분.
    steps:
    - {id: 1a, content: '$\int x\sin x\,dx=-x\cos x+\sin x+C$, $\int x\cos x\,dx=x\sin x+\cos x+C$', criteria: [1.B1, 1.B2]}
    hint_ladder:
    - 제시문 [라]에서 $f(x)=x$로 두자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 3-2. [자연계] 2024 예시답안 및 문항해설_최종.pdf 예시답안 p.1
    steps:
    - id: 1b-1
      content: |
        부분적분법을 이용하면(제시문 [라]),
        $$\int x\sin x\,dx=x(-\cos x)-\int(-\cos x)\,dx=-x\cos x+\sin x+C$$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $$\int x\cos x\,dx=x\sin x-\int\sin x\,dx=x\sin x+\cos x+C$$
      criteria: [1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: '$\int x\sin x\,dx=-x\cos x+\sin x+C$를 부분적분으로 구했다.'
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: '$\int x\cos x\,dx=x\sin x+\cos x+C$를 부분적분으로 구했다.'
      depends_on: []
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: 적분상수 $C$ 누락
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6415}
  misconceptions:
  - id: MC-CAL-6415
    outcome_code: '70'
    wrong_work: '$\int x\sin x\,dx=-x\cos x-\sin x+C$ (부호 오류)'
    detect_cue: 미분해 보면 $x\sin x$가 나오지 않는다
    feedback: '$-\int(-\cos x)dx=+\sin x$입니다. 결과를 미분해 확인하세요.'
    remedy: [RL-1]
- id: '2'
  stem: |
    위의 결과를 이용하여, $\displaystyle\int x^2\sin x\,dx$의 부정적분을 구하고, 이 부정적분 중 닫힌구간 $[0,\ 2\pi]$에서 $x$축과 만나지 않는 함수들을 증가와 감소의 표를 이용하여 모두 구하시오. (25점)
  points: 25
  depends_on: ['1']
  answer: {kind: set, value: 'G(x)=(2-x^2)\cos x+2x\sin x+C,\ C<2-\pi^2\ \text{또는}\ C>4\pi^2-2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$G$는 $[0,\pi]$에서 증가, $[\pi,2\pi]$에서 감소해 최댓값 $\pi^2-2+C$, 최솟값 $2-4\pi^2+C$.'
    steps:
    - {id: 2a, content: '$(\pi^2-2+C)(2-4\pi^2+C)>0\iff C<2-\pi^2$ 또는 $C>4\pi^2-2$', criteria: [2.M2, 2.A2]}
    hint_ladder:
    - '$x\sin x$의 부정적분 하나를 $F(x)$로 두고 $\int xF''(x)dx$로 생각하자.'
    - $G'(x)=x^2\sin x$의 부호를 보자.
    - 그래프가 $x$축과 만나지 않으려면 최댓값과 최솟값이 어떠해야 하는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 3-2. [자연계] 2024 예시답안 및 문항해설_최종.pdf 예시답안 p.1~2
    steps:
    - id: 2b-1
      content: |
        $f(x)=x\sin x$라 두고, 이 함수의 부정적분 중 하나를 $F(x)=-x\cos x+\sin x$라 하면, $F'(x)=f(x)$이다. 이를 이용하면, 다음과 같이 부분적분법으로 계산할 수 있다.
        $$\int x^2\sin x\,dx=\int xf(x)\,dx=\int xF'(x)\,dx=xF(x)-\int F(x)\,dx$$
        위에서 $F(x)$의 부정적분은 $x\cos x$의 부정적분의 결과를 이용하여,
        $$\int F(x)\,dx=\int(-x\cos x+\sin x)\,dx=-x\sin x-\cos x-\cos x+C$$
        이다. 따라서, $\displaystyle\int x^2\sin x\,dx=(2-x^2)\cos x+2x\sin x+C$
      criteria: [2.M1, 2.A1]
    - id: 2b-2
      content: |
        위의 함수를 $G(x)=(2-x^2)\cos x+2x\sin x+C$라 두고 이 중에서 닫힌구간 $[0,\ 2\pi]$에서 $x$축과 만나지 않는 함수들을 구하기 위하여, 함수의 그래프의 개형을 증가와 감소의 표를 이용하여 구해보면($G'(x)=x^2\sin x$, 제시문 [마]),

        | $x$ | $0$ | | $\pi$ | | $2\pi$ |
        |---|---|---|---|---|---|
        | $G'(x)$ | $0$ | $+$ | $0$ | $-$ | $0$ |
        | $G(x)$ | $2+C$ | ↗ | $(\pi^2-2)+C$ | ↘ | $(2-4\pi^2)+C$ |
      criteria: [2.M2]
    - id: 2b-3
      content: |
        함수의 그래프가 닫힌구간 $[0,\ 2\pi]$에서 $x$축과 만나지 않기 위해서는 최댓값과 최솟값의 부호가 같아야 한다.
        따라서 $(\pi^2-2+C)(2-4\pi^2+C)>0$인 다음 부정적분 함수들에 대하여 $x$축과 만나지 않는다.
        $$G(x)=(2-x^2)\cos x+2x\sin x+C,\quad C<2-\pi^2\ \text{혹은}\ C>4\pi^2-2.$$
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: '(1)의 결과를 이용해 $\int x^2\sin x\,dx=xF(x)-\int F(x)dx$ 꼴로 부분적분했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: '$\int x^2\sin x\,dx=(2-x^2)\cos x+2x\sin x+C$를 구했다.'
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 8
      evidence: '$G''(x)=x^2\sin x$의 부호로 증가와 감소의 표를 작성하고 $x=0,\pi,2\pi$에서의 값을 구했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 7
      evidence: '최댓값과 최솟값의 부호가 같을 조건으로 $C<2-\pi^2$ 또는 $C>4\pi^2-2$를 구했다.'
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-6416}
  misconceptions:
  - id: MC-CAL-6416
    outcome_code: '71'
    wrong_work: '양 끝값 $G(0)$, $G(2\pi)$만 비교해 $(2+C)(2-4\pi^2+C)>0$으로 답하거나 $C>4\pi^2-2$ 한쪽만 답함'
