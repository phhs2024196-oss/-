  - '$a>b>0$ ⇒ 충분히 큰 $q$에서 A의 $y$좌표가 P보다 큼, $\angle\mathrm{PAO}$ 예각'
  stimuli_used: [바, 사]
  subpart_links: '(2)는 (1)의 $l=\dfrac{c^2q^2-b^4}{2b^2q}$와 $q>\dfrac{b^2}{c}$의 경우를 사용'

