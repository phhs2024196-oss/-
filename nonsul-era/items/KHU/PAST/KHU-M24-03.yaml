key_idea: |
  외접원의 중심 A는 $y$축 위의 $(0,l)$이고 $l=\dfrac{c^2q^2-b^4}{2b^2q}$이다. 원주각과 중심각의 성질로 $\angle\mathrm{PAO}=2\alpha+\beta$이므로 $\cos(2\alpha+\beta)$를 A와 P의 $y$좌표 차와 $\overline{\mathrm{AP}}$로 나타내 극한을 구한다.
stuck: '$2\alpha+\beta$가 외접원의 중심 A에서 본 각 $\angle\mathrm{PAO}$임을 원주각·중심각으로 알아내는 단계'
