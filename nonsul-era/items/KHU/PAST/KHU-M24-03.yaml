  concepts: [쌍곡선의 방정식과 초점(b²=c²−a² 관계), 외접원의 중심(수직이등분선의 교점), 원주각과 중심각, 무한대에서의 극한, 부정적분]
  tools: ['A는 FF''의 수직이등분선(y축) 위 ⇒ k=0', 'AF=AP 를 p²=a²(1+q²/b²)로 정리해 l 구하기', '∠FAO=β, ∠PAF=2α ⇒ ∠PAO=2α+β', 'cos(∠PAO)=(A와 P의 y좌표 차)/AP', '최고차항 비교로 극한', 't(1−2/(t²+1)) 로 바꿔 적분']
  conditions:
