  concepts: [곡선과 직선의 교점, 직각이등변삼각형의 넓이, 1/x 의 정적분과 자연로그, 함수의 극한, 도함수와 최댓값]
  tools: [교점의 x좌표를 근의 공식으로, 영역을 삼각형 PQT와 곡선 아래 영역으로 분할, 로그의 성질로 정리, 우극한 계산, 도함수 부호로 증가 판정 후 끝점값]
