key_idea: |
  교점 Q의 $x$좌표가 $\dfrac{-b+\sqrt{b^2+4}}{2}=\dfrac1t$이므로 넓이를 직각이등변삼각형과 $\int\frac1x dx$로 나누면 $B(b)=\dfrac12t^2+\ln\dfrac tb$이고, $s=\dfrac tb$로 두면 $B(b)-\dfrac12b^2=\dfrac12+\dfrac1{2s}+\ln s$이다.
stuck: '$\dfrac{b\sqrt{b^2+4}-b^2}{4}=\dfrac{b}{2t}$로 정리해 $s$만의 식으로 바꾸는 단계'
