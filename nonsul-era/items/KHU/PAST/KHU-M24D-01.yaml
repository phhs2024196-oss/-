stimuli:
- label: 가
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 $S=\displaystyle\int_a^b\lvert f(x)\rvert dx$이다.
- label: 나
  body: |
    함수 $y=f(x)$가 닫힌구간 $[a,b]$에서 연속이면, 최대·최소 정리에 따라 함수 $f(x)$는 이 구간에서 최댓값과 최솟값을 가진다. 이때 이 구간에서 $f(x)$의 극댓값, 극솟값, $f(a)$, $f(b)$ 중에서 가장 큰 값이 최댓값, 가장 작은 값이 최솟값이 된다.

stem: |
  좌표평면 위에 세 개의 직선 $y=x+b$, $x=\dfrac1b$, $y=0$과 곡선 $y=\dfrac1x$로 둘러싸인 영역이 있다. 이 영역의 넓이를 $B(b)$라 할 때, 다음 물음에 답하시오. (단, $b>0$) [배점 28점]

subparts:
- id: '1'
  stem: |
    넓이 $B(b)$를 구하고, $t=\dfrac{b+\sqrt{b^2+4}}{2}$일 때, $B(b)+\ln b$를 $t$에 관한 식으로 구하시오. 이 식을 $f(t)$라 할 때, 극한 $\displaystyle\lim_{t\to1+}f(t)$를 구하고, 그 근거를 논술하시오. (18점)
  points: 18
  depends_on: []
  answer: {kind: expression, value: 'B(b)=\dfrac12\left(\dfrac{b+\sqrt{b^2+4}}{2}\right)^2+\ln\dfrac{b+\sqrt{b^2+4}}{2b},\ f(t)=\dfrac12t^2+\ln t,\ \lim_{t\to1+}f(t)=\dfrac12', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 영역 = 직각이등변삼각형 PQT + 곡선 $y=\frac1x$ 아래 넓이.
    steps:
    - {id: 1a, content: '$B(b)+\ln b=\dfrac12t^2+\ln t\to\dfrac12$', criteria: [1.M1, 1.A1, 1.A2, 1.A3]}
    hint_ladder:
    - 영역의 경계가 직선에서 곡선으로 바뀌는 점 Q를 구하자.
    - 삼각형과 곡선 아래 부분으로 나누자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 4-2. [의약학계_수학] 2024 예시답안 및 문항해설_최종.pdf 예시답안 p.1
    steps:
    - id: 1b-1
      content: |
        좌표평면 위에 세 개의 직선 $y=x+b$, $x=\dfrac1b$, $y=0$과 곡선 $y=\dfrac1x$을 그리고, 둘러싸인 영역을 생각하면 이 영역은 점 P, Q, R, S를 잇는 선분 및 곡선으로 둘러싸여 있다.
        [그림 1 설명: 직선 $y=x+b$가 $x$축과 P$(-b,0)$, $y$축과 $(0,b)$에서 만나고, 곡선 $y=\frac1x$와 Q에서 만난다. Q에서 $x$축에 내린 수선의 발 T. 직선 $x=\frac1b$가 곡선과 R, $x$축과 S에서 만난다. 영역은 P→Q(직선), Q→R(곡선), R→S(수직선), S→P($x$축)로 둘러싸임.]
        (1) 삼각형 PQT의 넓이를 구하기 위해 점 Q의 $x$좌표를 구하면, $x+b=\dfrac1x$로부터 $x=\dfrac{-b+\sqrt{b^2+4}}{2}$를 얻는다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        삼각형 PQT는 직각이등변삼각형이므로 넓이는 $\dfrac12\left(\dfrac{-b+\sqrt{b^2+4}}{2}+b\right)^2=\dfrac12\left(\dfrac{b+\sqrt{b^2+4}}{2}\right)^2$이다. 점 Q와 R을 잇는 곡선 아래 영역의 넓이를 구하기 위해 함수 $f(x)=\dfrac1x$를 적분하면(제시문 [가]),
        $$\int_{\frac{-b+\sqrt{b^2+4}}{2}}^{\frac1b}\dfrac1x\,dx=\ln\dfrac1b-\ln\dfrac{-b+\sqrt{b^2+4}}{2}=\ln\dfrac{b+\sqrt{b^2+4}}{2b}$$
        를 얻는다. 따라서, 넓이 $B(b)$는 $B(b)=\dfrac12\left(\dfrac{b+\sqrt{b^2+4}}{2}\right)^2+\ln\dfrac{b+\sqrt{b^2+4}}{2b}$이고,
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $$B(b)+\ln b=\dfrac12\left(\dfrac{b+\sqrt{b^2+4}}{2}\right)^2+\ln\dfrac{b+\sqrt{b^2+4}}{2b}+\ln b=\dfrac12\left(\dfrac{b+\sqrt{b^2+4}}{2}\right)^2+\ln\dfrac{b+\sqrt{b^2+4}}{2}=\dfrac12t^2+\ln t$$
        이다.
      criteria: [1.A2]
    - id: 1b-4
      content: |
        따라서, $f(t)=\dfrac12t^2+\ln t$이고, $\displaystyle\lim_{t\to1+}f(t)=\dfrac12$이다.
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 교점 Q의 $x$좌표 $\dfrac{-b+\sqrt{b^2+4}}{2}$를 구하고 영역을 삼각형과 곡선 아래 부분으로 나눴다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: '삼각형 넓이와 $\int\frac1x dx$로 $B(b)=\dfrac12\left(\dfrac{b+\sqrt{b^2+4}}{2}\right)^2+\ln\dfrac{b+\sqrt{b^2+4}}{2b}$를 구했다.'
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: '$B(b)+\ln b=\dfrac12t^2+\ln t$로 정리했다.'
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: '$\displaystyle\lim_{t\to1+}f(t)=\dfrac12$을 구했다.'
      depends_on: [1.M1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6419}
  misconceptions:
  - id: MC-CAL-6419
    outcome_code: '70'
    wrong_work: '교점의 $x$좌표를 $\dfrac{-b-\sqrt{b^2+4}}{2}$로 잡거나 영역을 $x=0$부터 적분해 $\int_0\frac1x dx$를 씀'
    detect_cue: 넓이 식에 음수 근이나 발산하는 적분이 나타남
    feedback: 영역은 $x>0$에서 직선과 곡선이 만나는 점 Q에서 경계가 바뀝니다. 그림을 그려 경계를 확인하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    $s=\dfrac{b+\sqrt{b^2+4}}{2b}$일 때, $B(b)-\dfrac12b^2$을 $s$에 관한 식으로 구하시오. 이 식을 $g(s)$라 할 때, 극한 $\displaystyle\lim_{s\to1+}g(s)$를 구하고, 그 근거를 논술하시오. $2\le s\le3$일 때, $g(s)$의 최댓값을 구하고, 그 근거를 논술하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'g(s)=\dfrac12+\dfrac1{2s}+\ln s,\ \lim_{s\to1+}g(s)=1,\ \text{최댓값 }g(3)=\dfrac23+\ln3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\dfrac{b\sqrt{b^2+4}-b^2}{4}=\dfrac{b}{2t}=\dfrac1{2s}$, $g''(s)=\dfrac{2s-1}{2s^2}>0$.'
    steps:
    - {id: 2a, content: '$g(s)=\dfrac12+\dfrac1{2s}+\ln s$, 증가함수이므로 최댓값 $g(3)$', criteria: [2.M1, 2.A1, 2.A2]}
    hint_ladder:
    - (1)의 $B(b)$에서 $\frac12b^2$을 빼고 $t$와 $b$로 나타내자.
    - '$s=\dfrac tb$이다.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 4-2. [의약학계_수학] 2024 예시답안 및 문항해설_최종.pdf 예시답안 p.1
    steps:
    - id: 2b-1
      content: |
        (1)에서 구한 $B(b)$를 이용하면,
        $$B(b)-\dfrac12b^2=\dfrac12+\dfrac{b\sqrt{b^2+4}-b^2}{4}+\ln\dfrac tb=\dfrac12+\dfrac{b}{2t}+\ln\dfrac tb=\dfrac12+\dfrac1{2s}+\ln s$$
        이다. (보충: $\dfrac{b\sqrt{b^2+4}-b^2}{4}=\dfrac{b(\sqrt{b^2+4}-b)}{4}=\dfrac{b}{\sqrt{b^2+4}+b}=\dfrac{b}{2t}$, $s=\dfrac tb$)
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서, $g(s)=\dfrac12+\dfrac1{2s}+\ln s$이고, $\displaystyle\lim_{s\to1+}g(s)=1$이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        $2\le s\le3$에서 $g(s)$의 최댓값을 구하기 위해 극댓값 또는 극솟값을 조사하면, $g'(s)=-\dfrac1{2s^2}+\dfrac1s=\dfrac{-1+2s}{2s^2}>0$이므로 $2\le s\le3$에서 극값을 가지지 않는다. 또한, $2\le s\le3$에서 함수 $g(s)$는 증가하므로, 최댓값은 $g(3)=\dfrac23+\ln3$이다(제시문 [나]).
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: '$B(b)-\dfrac12b^2=\dfrac12+\dfrac1{2s}+\ln s$로 정리했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: '$\displaystyle\lim_{s\to1+}g(s)=1$을 구했다.'
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: '$g''(s)>0$으로 증가함을 보이고 최댓값 $g(3)=\dfrac23+\ln3$을 구했다.'
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-6420}
  misconceptions:
  - id: MC-CAL-6420
    outcome_code: '71'
    wrong_work: '$g''(s)=0$인 $s=\dfrac12$에서 극솟값을 찾고 그 값을 최댓값으로 답하거나 $g(2)$를 답함'
    detect_cue: 최댓값이 $\dfrac32-\ln2$ 또는 $\dfrac34+\ln2$
    feedback: 임계점이 구간 밖이면 끝점값을 비교해야 합니다(제시문 [나]).
    remedy: [RL-2]

