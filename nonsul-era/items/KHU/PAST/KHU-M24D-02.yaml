  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-6422}
  misconceptions:
  - id: MC-GEO-6422
    outcome_code: '71'
    wrong_work: '$\triangle\mathrm{ABC}=\dfrac18\triangle\mathrm{OBC}$ ($\overline{\mathrm{AP}}:\overline{\mathrm{OA}}$를 넓이비로 씀)'
    detect_cue: 답이 $\dfrac{\sqrt{55}}{128}$
    feedback: 밑변 BC가 같으므로 넓이비는 BC까지의 높이 비, 즉 $\overline{\mathrm{AP}}:\overline{\mathrm{OP}}=1:7$입니다.
    remedy: [RL-2]

