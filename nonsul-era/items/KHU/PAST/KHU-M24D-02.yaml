stimuli:
- label: 다
  body: |
    삼각형 ABC에서 $\angle\mathrm{A},\angle\mathrm{B},\angle\mathrm{C}$의 크기를 각각 $A,B,C$라 하고, 꼭짓점 $\mathrm{A,B,C}$와 마주 보는 변 $\mathrm{BC,CA,AB}$의 길이를 각각 $a,b,c$로 나타내기로 한다. 삼각형 ABC의 넓이를 $S$라고 하면
    $$S=\dfrac12ab\sin C=\dfrac12bc\sin A=\dfrac12ca\sin B$$
- label: 라
  body: |
    영벡터가 아닌 두 평면벡터 $\vec a=\overrightarrow{\mathrm{OA}}$, $\vec b=\overrightarrow{\mathrm{OB}}$에 대하여 두 벡터가 이루는 각의 크기를 $\theta=\angle\mathrm{AOB}$ 라고 할 때, 두 벡터의 내적 $\vec a\cdot\vec b$를 다음과 같이 정의한다.
    $$\begin{cases}0^\circ\le\theta\le90^\circ\text{이면} & \vec a\cdot\vec b=\lvert\vec a\rvert\lvert\vec b\rvert\cos\theta\\90^\circ<\theta\le180^\circ\text{이면} & \vec a\cdot\vec b=-\lvert\vec a\rvert\lvert\vec b\rvert\cos(180^\circ-\theta)\end{cases}$$

stem: |
  중심이 O이고 반지름의 길이가 1인 원 위에 서로 다른 세 점 $\mathrm{A,B,C}$가 있고, 점 O와 점 A를 잇는 선분의 중점을 $\mathrm{O'}$이라고 하자. 점 $\mathrm{O'}$으로부터 세 점 $\mathrm{A,B,C}$로의 세 벡터가 상수 $-3\le k\le3$에 대해 다음의 식을 만족한다고 할 때, 다음 물음에 답하시오. [배점 32점]
  $$k\overrightarrow{\mathrm{O'A}}=\overrightarrow{\mathrm{O'B}}+3\overrightarrow{\mathrm{O'C}}$$

subparts:
- id: '1'
  stem: |
    점 O로부터 두 점 $\mathrm{B,C}$로의 두 벡터의 내적 $\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OC}}$의 최댓값을 구하고, 그 근거를 논술하시오. (12점)
  points: 12
  depends_on: []
  answer: {kind: value, value: '\dfrac38', equivalents: ['3/8'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\dfrac14(k+4)^2=1+6\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OC}}+9$에서 $k=3$일 때 최대.'
    steps:
    - {id: 1a, content: '$\dfrac{49}{24}-\dfrac53=\dfrac38$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 벡터의 시점을 원의 중심 O로 바꾸자.
    - 크기가 1인 벡터들이므로 양변을 제곱해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 4-2. [의약학계_수학] 2024 예시답안 및 문항해설_최종.pdf 예시답안 p.2
    steps:
    - id: 1b-1
      content: |
        주어진 식 $k\overrightarrow{\mathrm{O'A}}=\overrightarrow{\mathrm{O'B}}+3\overrightarrow{\mathrm{O'C}}$는 다음과 같이 쓸 수 있고,
        $$k(\overrightarrow{\mathrm{O'O}}+\overrightarrow{\mathrm{OA}})=(\overrightarrow{\mathrm{O'O}}+\overrightarrow{\mathrm{OB}})+3(\overrightarrow{\mathrm{O'O}}+\overrightarrow{\mathrm{OC}})$$
        위의 식에 $\overrightarrow{\mathrm{O'O}}=-\dfrac12\overrightarrow{\mathrm{OA}}$을 대입하면 다음의 식을 얻을 수 있다.
        $$\left(\dfrac k2+2\right)\overrightarrow{\mathrm{OA}}=\overrightarrow{\mathrm{OB}}+3\overrightarrow{\mathrm{OC}}\quad\cdots(\text{가})$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        식 (가)의 양변을 제곱하면 다음과 같다.
        $$\dfrac14(k+4)^2\lvert\overrightarrow{\mathrm{OA}}\rvert^2=\lvert\overrightarrow{\mathrm{OB}}\rvert^2+6(\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OC}})+9\lvert\overrightarrow{\mathrm{OC}}\rvert^2$$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 $\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OC}}=\dfrac1{24}(k+4)^2-\dfrac53$이고, $-3\le k\le3$의 범위에 따라 $\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OC}}$의 최댓값은 $k=3$일 때 $\dfrac{49}{24}-\dfrac53=\dfrac38$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: '시점을 O로 바꿔 $\left(\dfrac k2+2\right)\overrightarrow{\mathrm{OA}}=\overrightarrow{\mathrm{OB}}+3\overrightarrow{\mathrm{OC}}$를 얻었다.'
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 양변을 제곱해 내적 $\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OC}}$를 $k$로 나타냈다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: '$k=3$일 때 최댓값 $\dfrac38$을 구했다.'
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6421}
  misconceptions:
  - id: MC-GEO-6421
    outcome_code: '70'
    wrong_work: '제곱할 때 $6(\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OC}})$ 대신 $3(\cdots)$로 쓰거나 교차항을 빠뜨림'
    detect_cue: 내적 식의 계수가 $\dfrac1{24}$이 아님, 최댓값이 $\dfrac38$이 아님
    feedback: '$\lvert\vec u+3\vec v\rvert^2=\lvert\vec u\rvert^2+6\vec u\cdot\vec v+9\lvert\vec v\rvert^2$입니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    (1)에서 $\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OC}}$의 값이 최대일 때, 삼각형 ABC의 넓이를 구하고, 그 근거를 논술하시오. (20점)
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{\sqrt{55}}{112}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\triangle\mathrm{OBC}=\dfrac{\sqrt{55}}{16}$, $\dfrac78\overrightarrow{\mathrm{OA}}$가 선분 CB의 $1:3$ 내분점이므로 $\triangle\mathrm{ABC}=\dfrac17\triangle\mathrm{OBC}$.'
    steps:
    - {id: 2a, content: '$\dfrac17\cdot\dfrac{\sqrt{55}}{16}=\dfrac{\sqrt{55}}{112}$', criteria: [2.M1, 2.A1, 2.M2, 2.A2]}
    hint_ladder:
    - $\cos\theta=\dfrac38$에서 삼각형 OBC의 넓이를 구하자.
    - '$k=3$일 때 $\dfrac78\overrightarrow{\mathrm{OA}}$는 어떤 점의 위치벡터인가?'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 4-2. [의약학계_수학] 2024 예시답안 및 문항해설_최종.pdf 예시답안 p.2
    steps:
    - id: 2b-1
      content: |
        두 벡터 $\overrightarrow{\mathrm{OB}}$와 $\overrightarrow{\mathrm{OC}}$가 이루는 각을 $\theta$라 하자. 다음의 식 $\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OC}}=\lvert\overrightarrow{\mathrm{OB}}\rvert\lvert\overrightarrow{\mathrm{OC}}\rvert\cos\theta$에 위에서 구한 $\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OC}}$의 최댓값 $\dfrac38$을 대입하면 다음의 값을 얻을 수 있다.
        $$\cos\theta=\dfrac38,\quad \sin\theta=\sqrt{1-\cos^2\theta}=\dfrac{\sqrt{55}}{8}$$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 삼각형 OBC의 넓이는 $\triangle\mathrm{OBC}=\dfrac12\lvert\overrightarrow{\mathrm{OB}}\rvert\lvert\overrightarrow{\mathrm{OC}}\rvert\sin\theta=\dfrac{\sqrt{55}}{16}$이다(제시문 [다]).
      criteria: [2.A1]
    - id: 2b-3
      content: |
        위에서 구한 $k=3$을 식 (가)에 대입하면 $\dfrac72\overrightarrow{\mathrm{OA}}=\overrightarrow{\mathrm{OB}}+3\overrightarrow{\mathrm{OC}}$ (즉, $\dfrac78\overrightarrow{\mathrm{OA}}=\dfrac14\overrightarrow{\mathrm{OB}}+\dfrac34\overrightarrow{\mathrm{OC}}$)이므로, 선분 CB 위의 한 점 P를 $\lvert\overrightarrow{\mathrm{CP}}\rvert:\lvert\overrightarrow{\mathrm{PB}}\rvert=1:3$을 만족하도록 찾을 수 있다. 즉, $\overrightarrow{\mathrm{OP}}=\dfrac14\overrightarrow{\mathrm{OB}}+\dfrac34\overrightarrow{\mathrm{OC}}$이기 때문에 $\overrightarrow{\mathrm{OP}}=\dfrac78\overrightarrow{\mathrm{OA}}$임을 알 수 있다.
        [그림 1 설명: 중심 O, 반지름 1인 원. 원 위의 점 B(오른쪽 아래), C(아래), 그 사이 원 위의 점 A. 선분 CB 위의 점 P와 선분 OA(주황색)가 그려져 있고 P는 OA 위에서 A에 가까이 있음.]
      criteria: [2.M2]
    - id: 2b-4
      content: |
        따라서 $\lvert\overrightarrow{\mathrm{AP}}\rvert=\dfrac17\lvert\overrightarrow{\mathrm{OP}}\rvert$이고, (보충: A와 O는 직선 OP 위에서 직선 BC의 반대쪽에 있어 두 삼각형의 높이 비가 $\overline{\mathrm{AP}}:\overline{\mathrm{OP}}=1:7$)
        $$\triangle\mathrm{ABC}=\dfrac17\triangle\mathrm{OBC}=\dfrac{\sqrt{55}}{112}$$
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: '$\cos\theta=\dfrac38$에서 $\sin\theta=\dfrac{\sqrt{55}}{8}$을 구했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: '$\triangle\mathrm{OBC}=\dfrac{\sqrt{55}}{16}$을 구했다.'
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 6
      evidence: '$k=3$을 대입해 $\dfrac78\overrightarrow{\mathrm{OA}}=\dfrac14\overrightarrow{\mathrm{OB}}+\dfrac34\overrightarrow{\mathrm{OC}}$, 즉 선분 CB의 $1:3$ 내분점 P가 직선 OA 위에 있음을 밝혔다.'
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 6
      evidence: '$\overline{\mathrm{AP}}=\dfrac17\overline{\mathrm{OP}}$로 $\triangle\mathrm{ABC}=\dfrac17\triangle\mathrm{OBC}=\dfrac{\sqrt{55}}{112}$를 구했다.'
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
