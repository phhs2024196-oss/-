intent: |
  점과 직선 사이 거리를 이용하여 삼각형의 넓이를 구하고, 넓이의 비에 대한 극한값을 구하여 기하학적인 상황을 잘 이해하고 이를 활용할 수 있는지를 평가한다(경희대 문항 해설 요지).
key_idea: '$\triangle\mathrm{PQF}=\dfrac12\overline{QF}\times(\text{P 에서 직선 QF 까지 거리})=\dfrac12|x_1y_2-x_2y_1+c(y_1-y_2)|$, (2)는 $x_1\sim\dfrac abt$를 써서 $t\to\infty$ 극한.'
stuck: 직선 QF 의 방정식과 점-직선 거리로 넓이를 일반 좌표로 정리하는 것, $x_1=\sqrt{a^2+\dfrac{a^2}{b^2}t^2}$의 증가 속도
idea_tags: [IDEA-AREA-BY-POINT-LINE-DIST, IDEA-LIMIT-RATIO-DOMINANT]
tags: [경희 모의, 쌍곡선, 넓이의 비 극한]
elements:
  materials: [쌍곡선 x²/a²-y²/b²=1, 제1사분면의 점 P(x1,y1), 제2사분면의 점 Q(x2,y2), 초점 F(c,0)·F′(-c,0), 삼각형 QFF′·PQF·PFF′, 넓이의 비 R(t)]
  concepts: [쌍곡선의 방정식과 초점(제시문 가), 점과 직선 사이의 거리(제시문 나), 삼각형의 넓이, 함수의 극한]
  tools: [밑변 FF′ 와 높이 y2, 직선 QF 의 방정식, 점과 직선 거리로 높이, 쌍곡선 식에서 x1·x2 를 y 로 표현, 분자·분모를 t 로 나누어 극한]
  conditions:
  - 'P 는 제1사분면, Q 는 제2사분면 ⇒ $x_1>0$, $x_2<0$, $y_1,y_2>0$'
  - '$y_1=t$, $y_2=1$ ⇒ $x_1=\sqrt{a^2+\dfrac{a^2}{b^2}t^2}$, $x_2=-\sqrt{a^2+\dfrac{a^2}{b^2}}$'
  - '$t>1$이면 절댓값 안이 양수'
  stimuli_used: [가, 나]
  subpart_links: (2)는 (1)에서 구한 삼각형 PQF 의 넓이 공식을 사용

