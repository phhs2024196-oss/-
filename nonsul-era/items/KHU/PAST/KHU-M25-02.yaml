intent: |
  공간도형과 공간좌표의 기본 개념을 종합적으로 이해하고, 직선과 평면의 위치 관계와 구의 성질을 응용할 수 있는지 파악한다(경희대 문항 해설 요지).
key_idea: '삼수선의 정리로 $\angle\mathrm{AMH}=\theta$(M 은 BC 의 중점), $\overline{AM}=\dfrac{\overline{HM}}{\cos\theta}=5$. 외접구 중심은 직선 AH 위에 있어 $\overline{BH}^2+(R-\overline{AH})^2=R^2$.'
stuck: 이면각 θ 를 ∠AMH 로 잡는 것(삼수선), 외접구 중심이 수선 AH 위에 있음을 아는 것
