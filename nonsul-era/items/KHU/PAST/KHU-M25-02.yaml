  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6317}
  misconceptions:
  - id: MC-GEO-6317
    outcome_code: '70'
    wrong_work: '외접구 중심을 H 로 보고 반지름을 $\overline{BH}=\dfrac{10\sqrt3}{3}$ 또는 $\overline{AH}$로 답함'
    detect_cue: 답이 $\dfrac{10\sqrt3}{3}$ 또는 $\dfrac{5\sqrt6}{3}$
    feedback: H 는 B, C, D 에서 같은 거리이지만 A 까지 거리는 다릅니다. 중심은 직선 AH 위에서 $\overline{AP}=\overline{BP}$인 점입니다.
    remedy: [RL-2]

