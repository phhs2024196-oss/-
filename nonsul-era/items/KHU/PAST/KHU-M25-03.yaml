  tools: [접선 y=2ax-a², 기울기 곱 -1 로 수직인 직선, 이차방정식에서 알려진 근 x=a 를 빼고 다른 근, 곡선 아래 넓이에서 삼각형 부분 빼기, 극한 대입, b·c 가 같은 이차방정식 2x²+2ax+1=0 의 두 근, 내적 성분 계산 후 인수분해]
