stimuli:
- label: 마
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: 바
  body: |
    두 직선 $l:y=mx+n$, $l':y=m'x+n'$에서
    1. $l$과 $l'$이 서로 수직이면 $mm'=-1$이다.
    2. $mm'=-1$이면 $l$과 $l'$은 서로 수직이다.

stem: |
  곡선 $y=x^2$ 위의 한 점 $\mathrm{P}_1(a,a^2)$ $(a>0)$과 그 점에서의 접선 $l_1$을 생각하자. 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    점 $\mathrm{P}_1$을 지나고 직선 $l_1$에 수직인 직선 $m$을 생각하자. 직선 $m$이 곡선 $y=x^2$과 만나는 점 중 $\mathrm{P}_1$이 아닌 점을 $\mathrm{P}_2$라 하고, 점 $\mathrm{P}_2$에서의 접선 $l_2$를 생각하자. 곡선 $y=x^2$과 직선 $l_1$과 $x$축으로 둘러싸인 영역의 넓이를 $A$, 곡선 $y=x^2$과 직선 $l_2$와 $x$축으로 둘러싸인 영역의 넓이를 $B$라 하자. 이때, 극한 $\displaystyle\lim_{a\to0}AB$를 구하고, 그 근거를 논술하시오. (18점)
  points: 18
  depends_on: []
  answer: {kind: value, value: '\dfrac{1}{1152}', equivalents: ['1/1152'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $A=\dfrac{a^3}{12}$, $\mathrm{P}_2$의 x좌표 $-\left(a+\dfrac1{2a}\right)$이므로 $B=\dfrac1{12}\left(a+\dfrac1{2a}\right)^3$, $AB=\dfrac1{144}\left(a^2+\dfrac12\right)^3$.
    steps:
    - {id: 1a, content: '$\displaystyle\lim_{a\to0}\dfrac1{144}\left(a^2+\dfrac12\right)^3=\dfrac1{1152}$', criteria: [1.A1]}
    hint_ladder:
    - 접선의 x절편은 접점 x좌표의 절반이다.
    - 넓이 = 곡선 아래 넓이 − 접선 아래 삼각형.
    - $AB$를 곱해 $a$의 거듭제곱을 정리하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 3-2. [자연계] 2025 모의논술고사 예시답안 및 채점기준_최종.pdf p.2
    steps:
    - id: 1b-1
      content: |
        직선 $l_1$의 방정식은 $y=2ax-a^2$이고, 직선 $l_1$의 $x$절편은 $\mathrm{Q}_1\left(\dfrac a2,0\right)$이다.
        직선 $m$의 방정식은 $y=-\dfrac1{2a}x+a^2+\dfrac12$이고(제시문 [바]), 점 $\mathrm{P}_2$의 좌표를 구하기 위해 $-\dfrac1{2a}x+a^2+\dfrac12=x^2$을 풀면 $x=-a-\dfrac1{2a}$이고, 따라서 $\mathrm{P}_2\left(-a-\dfrac1{2a},\ \left(a+\dfrac1{2a}\right)^2\right)$이다. 직선 $l_2$의 방정식은 $y=-2\left(a+\dfrac1{2a}\right)x-\left(a+\dfrac1{2a}\right)^2$이고, $x$절편은 $\mathrm{Q}_2\left(-\dfrac a2-\dfrac1{4a},0\right)$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 넓이 $A$는
        $$A=\int_0^a x^2dx-\int_{\frac a2}^a(2ax-a^2)dx=\dfrac{a^3}{12}$$
        넓이 $B$는
        $$B=\int_{-a-\frac1{2a}}^0x^2dx-\int_{-a-\frac1{2a}}^{-\frac a2-\frac1{4a}}\left(-2\left(a+\dfrac1{2a}\right)x-\left(a+\dfrac1{2a}\right)^2\right)dx=\dfrac1{12}\left(a+\dfrac1{2a}\right)^3$$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 극한은 $\displaystyle\lim_{a\to0}AB=\lim_{a\to0}\dfrac1{144}\left(a^2+\dfrac12\right)^3=\dfrac1{1152}$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: (공식 6점) 접선 $l_1$($y=2ax-a^2$)을 구하고, 그것에 수직인 직선 $m$과 $\mathrm{P}_2$, $l_2$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: (공식 6점) 정적분을 활용하여 넓이 $A=\dfrac{a^3}{12}$, $B=\dfrac1{12}\left(a+\dfrac1{2a}\right)^3$을 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: (공식 6점) 극한 $\displaystyle\lim_{a\to0}AB=\dfrac1{1152}$을 계산했다.
      depends_on: [1.M2]
      steps: [1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6318}
  misconceptions:
  - id: MC-CAL-6318
    outcome_code: '70'
    wrong_work: '$A=\displaystyle\int_0^ax^2dx=\dfrac{a^3}{3}$처럼 접선 아래 삼각형을 빼지 않음'
    detect_cue: $A=\dfrac{a^3}{3}$ 또는 극한이 $\dfrac1{72}$
    feedback: 영역은 곡선·접선·x축으로 둘러싸여 있으므로 x절편부터 접점까지 접선 아래 부분을 빼야 합니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    곡선 $y=x^2$ 위의 점 $\mathrm{P}_3(b,b^2)$ $(b<0)$과 $\mathrm{P}_4(c,c^2)$ $(c<0)$을 생각하자. 점 $\mathrm{P}_3$을 지나고 점 $\mathrm{P}_3$에서의 접선에 수직인 직선을 $l_3$이라 하자. 점 $\mathrm{P}_4$를 지나고 점 $\mathrm{P}_4$에서의 접선에 수직인 직선을 $l_4$라 하자. 직선 $l_3$과 $l_4$가 모두 점 $\mathrm{P}_1$을 지나고, 점 $\mathrm{P}_3$과 $\mathrm{P}_4$가 $\overrightarrow{\mathrm{P_1P_3}}\cdot\overrightarrow{\mathrm{P_1P_4}}=\dfrac{51}{4}$을 만족할 때, $b+c$를 구하고 그 근거를 논술하시오. (19점)
  points: 19
  depends_on: ['1']
  answer: {kind: value, value: '-2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: b, c 는 $2x^2+2ax+1=0$의 두 근, 내적 $=\left(a^2-(b+c)a+bc\right)\left(1+a^2+(b+c)a+bc\right)=3a^2+\dfrac34$.
    steps:
    - {id: 2a, content: '$3a^2+\dfrac34=\dfrac{51}4\Rightarrow a=2$, $b+c=-a=-2$', criteria: [2.A2]}
    hint_ladder:
    - 법선 $l_3$이 $\mathrm{P}_1$을 지날 조건을 $a$, $b$의 식으로 쓰자.
    - 같은 조건이 $c$에도 성립한다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 3-2. [자연계] 2025 모의논술고사 예시답안 및 채점기준_최종.pdf p.2
    steps:
    - id: 2b-1
      content: |
        직선 $l_3$의 방정식은 $y=-\dfrac1{2b}x+b^2+\dfrac12$이고, 이 직선이 $\mathrm{P}_1(a,a^2)$을 지나므로, $a^2=-\dfrac a{2b}+b^2+\dfrac12$를 풀면, $a=b$ 또는 $a=-b-\dfrac1{2b}$이다. 이때 $a>0$이고 $b<0$이므로, $a=-b-\dfrac1{2b}$이고, 이를 정리하면 $2b^2+2ab+1=0$을 얻는다. 직선 $l_4$에 대해서도 같은 방법으로 $2c^2+2ac+1=0$을 얻는다. 따라서 $b$와 $c$는 이차방정식 $2x^2+2ax+1=0$의 두 실근이고, 근과 계수의 관계에 의해 $b+c=-a$, $bc=\dfrac12$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        벡터 $\overrightarrow{P_1P_3}=(b-a,\ b^2-a^2)$와 $\overrightarrow{P_1P_4}=(c-a,\ c^2-a^2)$의 내적은
        $\overrightarrow{P_1P_3}\cdot\overrightarrow{P_1P_4}=(b-a)(c-a)+(b^2-a^2)(c^2-a^2)=\left(a^2-(b+c)a+bc\right)\left\{1+a^2+(b+c)a+bc\right\}$
        따라서 근과 계수의 관계에 의해 $\overrightarrow{P_1P_3}\cdot\overrightarrow{P_1P_4}=3a^2+\dfrac34$이고,
      criteria: [2.A1]
    - id: 2b-3
      content: |
        주어진 조건에 의해 ($3a^2+\dfrac34=\dfrac{51}4$, $a^2=4$, $a>0$) $a=2$이다. 따라서 $b+c=-2$이다.
        (보충: 이때 $2x^2+4x+1=0$의 판별식이 양수이고 두 근 $-1\pm\dfrac{\sqrt2}{2}$가 모두 음수이므로 조건에 맞다.)
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 9
      evidence: (공식 9점) 주어진 조건으로부터 $a$, $b$, $c$의 관계($2b^2+2ab+1=0$, $2c^2+2ac+1=0$, $b+c=-a$, $bc=\dfrac12$)를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: (공식 6점) 내적 $\overrightarrow{P_1P_3}\cdot\overrightarrow{P_1P_4}=3a^2+\dfrac34$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: (공식 4점) $a=2$를 찾고, 이를 이용하여 $b+c=-2$를 구했다.
      depends_on: [2.M1]
      steps: [2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-ALG-6319}
  misconceptions:
  - id: MC-ALG-6319
    outcome_code: '70'
    wrong_work: '$2b^3+(1-2a^2)b+a=0$ 같은 삼차식을 그대로 두고 b, c 를 개별로 풀려다 막히거나, $b=a$ 근을 남겨 $b+c=a-\cdots$로 계산'
    detect_cue: $(b-a)$ 인수를 나누지 않았거나 $b+c$가 $-a$가 아니다
    feedback: $b=a$는 $\mathrm{P}_1$ 자신이므로 인수 $(b-a)$로 나누면 $2b^2+2ab+1=0$이 남고, $c$도 같은 식을 만족합니다.
    remedy: [RL-2]

