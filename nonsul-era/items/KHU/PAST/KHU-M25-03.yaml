  곡선의 접선과 두 직선이 수직이기 위한 조건 등을 이용하여 주어진 영역을 수학적으로 표현하고, 적분을 활용하여 그 영역의 넓이를 구할 수 있는지, 그리고 이러한 상황에서 극한과 벡터 등의 개념을 종합적으로 응용할 수 있는지를 평가한다(경희대 문항 해설 요지).
