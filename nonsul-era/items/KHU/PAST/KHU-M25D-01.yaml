intent: |
  타원과 직선의 위치 관계를 이해하고 접선의 방정식을 구할 수 있는지, 도형의 평행이동과 대칭이동의 기본 개념을 종합적으로 응용할 수 있는지를 평가한다(경희대 문항 해설 요지).
key_idea: '$C_3$은 $C_1$을 $(u+v,u+v)$만큼 평행이동한 타원. 직선 $y=x$ 위 접점 $(k,k)$, $k=\dfrac{ab}{\sqrt{a^2+b^2}}$에서 원래 타원과 $2k$만큼 옮긴 타원이 접하므로 $u+v\le\dfrac{24}{5}$.'
stuck: 대칭이동·평행이동을 두 번 하면 결국 $(u+v,u+v)$ 평행이동이 됨을 보는 것, 접하는 이동 거리가 $2k$임을 (1)의 평행한 두 접선으로 보는 것
