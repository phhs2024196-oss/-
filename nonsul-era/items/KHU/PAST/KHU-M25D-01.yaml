stimuli:
- label: 가
  body: |
    방정식 $f(x,y)=0$이 나타내는 도형을 $x$축 방향으로 $a$만큼, $y$축 방향으로 $b$만큼 평행이동한 도형의 방정식은 $f(x-a,y-b)=0$이다.
- label: 나
  body: |
    방정식 $f(x,y)=0$이 나타내는 도형을 직선 $y=x$에 대하여 대칭이동한 도형의 방정식은 $f(y,x)=0$이다.
- label: 다
  body: |
    타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ 위의 점 $P(x_1,y_1)$에서의 접선의 방정식은 $\dfrac{x_1x}{a^2}+\dfrac{y_1y}{b^2}=1$ 이다.
- label: 라
  body: |
    두 사건 $A$, $B$가 동시에 일어나지 않을 때, 사건 $A$, $B$가 일어나는 경우의 수를 각각 $m$, $n$이라고 하면 사건 $A$ 또는 사건 $B$가 일어나는 경우의 수는 $m+n$이다.

stem: ''   # 원문 [논제 I-1]은 공통 발문 없이 (1)(2)로 바로 시작

subparts:
- id: '1'
  stem: |
    타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ 와 직선 $y=mx$가 만나는 두 점에서 타원에 접하는 접선을 각각 $l_1$, $l_2$라고 하자. 이때 두 직선 $l_1$과 $l_2$ 사이의 거리를 구하고, 그 근거를 논술하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: '2ab\sqrt{\dfrac{a^2m^2+b^2}{a^4m^2+b^4}}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 교점은 원점 대칭이고 두 접선은 평행. $(x_1,y_1)$에서의 접선과 점 $(-x_1,-y_1)$ 사이의 거리를 구한다.
    steps:
    - {id: 1a, content: '$d=\dfrac{2}{\lvert x_1\rvert\sqrt{\frac1{a^4}+\frac{m^2}{b^4}}}$, $x_1^2=\dfrac{a^2b^2}{b^2+m^2a^2}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 두 교점은 어떤 대칭 관계인가?
    - 평행한 두 직선 사이 거리 = 한 직선 위의 점에서 다른 직선까지의 거리.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 4-2. [의약학계_수학] 2025 모의논술고사 예시답안 및 채점기준_최종.pdf p.1
    steps:
    - id: 1b-1
      content: |
        타원과 직선의 교점 중 하나를 $(x_1,y_1)$이라고 하면, 다른 교점은 $(-x_1,-y_1)$이다. 점 $(x_1,y_1)$에서의 접선의 방정식은 $\dfrac{x_1x}{a^2}+\dfrac{y_1y}{b^2}-1=0$ 이므로(제시문 [다]),
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이 접선과 점 $(-x_1,-y_1)$ 사이의 거리는 ($y_1=mx_1$, $x_1^2=\dfrac{a^2b^2}{b^2+m^2a^2}$)
        $$\dfrac{\left\lvert\dfrac{x_1(-x_1)}{a^2}+\dfrac{y_1(-y_1)}{b^2}-1\right\rvert}{\sqrt{\left(\dfrac{x_1}{a^2}\right)^2+\left(\dfrac{y_1}{b^2}\right)^2}}=\dfrac{2}{\sqrt{\left(\dfrac1{a^4}+\dfrac{m^2}{b^4}\right)x_1^2}}=\dfrac{2}{\sqrt{\left(\dfrac1{a^4}+\dfrac{m^2}{b^4}\right)\left(\dfrac{a^2b^2}{b^2+m^2a^2}\right)}}=2ab\sqrt{\dfrac{a^2m^2+b^2}{a^4m^2+b^4}}$$
        이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: (공식 5점) 접선 $l_1$과 $l_2$ 중 하나 이상의 방정식을 찾았다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: (공식 5점) 점과 직선 사이의 거리를 이용하여 두 접선 사이의 거리 $2ab\sqrt{\dfrac{a^2m^2+b^2}{a^4m^2+b^4}}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6324}
  misconceptions:
  - id: MC-GEO-6324
    outcome_code: '70'
    wrong_work: '원점에서 접선 $l_1$까지의 거리 $\dfrac1{\sqrt{\frac{x_1^2}{a^4}+\frac{y_1^2}{b^4}}}$만 구하고 2배를 하지 않음'
    detect_cue: 답이 $ab\sqrt{\dfrac{a^2m^2+b^2}{a^4m^2+b^4}}$
    feedback: 두 접선 사이 거리는 $l_1$에서 다른 교점 $(-x_1,-y_1)$까지의 거리이며, 원점까지 거리의 2배입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    $u$와 $v$를 음이 아닌 정수라고 하자. 좌표평면 위에 방정식 $\dfrac{(x-10)^2}{9}+\dfrac{(y-20)^2}{16}=1$ 로 주어진 타원 $C_1$을 직선 $y=x$에 대하여 대칭이동 한 후, $x$축 방향으로 $u$만큼, $y$축 방향으로 $v$만큼 평행이동하여 얻은 타원을 $C_2$라고 하자. 이제 $C_2$를 다시 직선 $y=x$에 대하여 대칭이동 한 후, $x$축의 방향으로 $u$만큼, $y$축 방향으로 $v$만큼 평행이동하여 얻은 타원을 $C_3$라고 하자. 이 때 $C_3$와 $C_1$이 서로 만나게 되는 음이 아닌 정수의 쌍 $(u,v)$의 개수를 구하고, 그 근거를 논술하시오. (18점)
  points: 18
  depends_on: ['1']
  answer: {kind: value, value: '15', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $C_3$은 $C_1$을 $(u+v,u+v)$ 평행이동한 것. 타원 $\dfrac{x^2}9+\dfrac{y^2}{16}=1$ 위 $(k,k)$, $k=\dfrac{12}5$에서의 접선은 $(-k,-k)$에서의 접선을 $(2k,2k)$ 옮긴 것과 같으므로 이동량 $\le\dfrac{24}5$.
    steps:
    - {id: 2a, content: '$u+v\le4$인 음이 아닌 정수 쌍: $1+2+3+4+5=15$', criteria: [2.A2]}
    hint_ladder:
    - $C_3$의 방정식을 $C_1$과 비교해 보자.
    - (1)에서 $m=1$인 경우를 떠올리자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 4-2. [의약학계_수학] 2025 모의논술고사 예시답안 및 채점기준_최종.pdf p.1
    steps:
    - id: 2b-1
      content: |
        $C_2$의 방정식은 $\dfrac{(y-10-v)^2}{9}+\dfrac{(x-20-u)^2}{16}=1$ 이고, $C_3$의 방정식은 $\dfrac{(x-10-(u+v))^2}{9}+\dfrac{(y-20-(u+v))^2}{16}=1$ 이다(제시문 [가], [나]). 따라서 $C_3$는 $C_1$을 $x$축 방향으로 $u+v$만큼, $y$축 방향으로 $u+v$만큼 평행이동하여 얻은 타원이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        한편 타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ 와 직선 $y=x$가 제1사분면에서 만나는 점을 $P(k,k)$라 하면, $P$가 타원 위의 점이므로, $\dfrac{k^2}{a^2}+\dfrac{k^2}{b^2}=1$이고, $k$가 양수이므로, $k=\dfrac{ab}{\sqrt{a^2+b^2}}$ 이다. 점 $P(k,k)$에서 타원에 접하는 접선을 $l_1$이라고 하면 그 방정식은 $\dfrac{kx}{a^2}+\dfrac{ky}{b^2}=1$ 이고, 점 $Q(-k,-k)$에서 타원에 접하는 접선 $l_2$의 방정식은 $\dfrac{-kx}{a^2}+\dfrac{-ky}{b^2}=1$ 이다. 이제 $l_2$를 $x$축 방향으로 $2k$, $y$축 방향으로 $2k$만큼 평행이동한 직선의 방정식은 $\dfrac{-k(x-2k)}{a^2}+\dfrac{-k(y-2k)}{b^2}=1$로서, $l_1$의 방정식과 같다. 따라서 타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ 과 $\dfrac{(x-2k)^2}{a^2}+\dfrac{(y-2k)^2}{b^2}=1$ 은 $P(k,k)$에서 공통인 접선을 가지고 결국 서로 한 점에서 만난다.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        그러므로 $u+v=2\times\dfrac{3\times4}{\sqrt{3^2+4^2}}=\dfrac{24}{5}$ 일 때, $C_3$와 $C_1$이 접하게 된다. 따라서 $C_3$와 $C_1$이 서로 만나기 위해서는 $u+v\le\dfrac{24}{5}$을 만족하여야 한다. 이를 만족하는 음이 아닌 정수의 쌍 $(u,v)$는
        $(0,0)$, $(0,1)$, $(0,2)$, $(0,3)$, $(0,4)$, $(1,0)$, $(1,1)$, $(1,2)$, $(1,3)$, $(2,0)$, $(2,1)$, $(2,2)$, $(3,0)$, $(3,1)$, $(4,0)$ 이므로 그 개수는 모두 15개이다(제시문 [라]).
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: (공식 8점) $C_3$가 $C_1$을 $x$축 방향으로 $u+v$만큼, $y$축 방향으로 $u+v$만큼 평행이동한 것임을 파악했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 6
      evidence: (공식 6점) $x$축·$y$축 방향으로 같은 양만큼 평행이동한 타원이 원래의 타원과 접하려면 이동량이 $\dfrac{24}{5}$여야 함을 보였다.
      depends_on: []
      steps: [2b-2, 2b-3]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: (공식 4점) 조건을 만족하는 $(u,v)$가 15개임을 찾았다.
      depends_on: [2.M1, 2.R1]
      steps: [2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6320}
  - {code: '71', misconception: MC-GEO-6321}
  misconceptions:
  - id: MC-GEO-6320
    outcome_code: '70'
    wrong_work: '$C_3$를 $C_1$의 $(2u,2v)$ 평행이동으로 보거나, 대칭이동 후 $f(y-u,x-v)$처럼 순서를 바꿔 씀'
    detect_cue: $u+v$ 대신 $2u$, $2v$ 또는 $u-v$가 나온다
    feedback: 대칭이동하면 앞서 한 평행이동의 $x$, $y$ 성분도 서로 바뀝니다. 두 번 합치면 $(u+v,u+v)$입니다.
    remedy: [RL-2]
  - id: MC-GEO-6321
    outcome_code: '71'
    wrong_work: '접점의 좌표 $k=\dfrac{12}5$를 이동량으로 써서 $u+v\le2$, 6개로 답함'
    detect_cue: 답이 6
    feedback: 원래 타원의 $(-k,-k)$가 옮겨져 $(k,k)$에 닿아야 하므로 이동량은 $2k$입니다.
    remedy: [RL-3]

