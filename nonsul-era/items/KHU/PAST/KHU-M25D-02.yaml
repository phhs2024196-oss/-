stimuli:
- label: 라
  body: |
    두 사건 $A$, $B$가 동시에 일어나지 않을 때, 사건 $A$, $B$가 일어나는 경우의 수를 각각 $m$, $n$이라고 하면 사건 $A$ 또는 사건 $B$가 일어나는 경우의 수는 $m+n$이다.

stem: |
  다음과 같은 조건을 생각하자.
  (조건) 임의로 주어진 $n$개의 자연수 중에 합이 $m(m<n)$으로 나누어떨어지는 $m$개의 자연수를 항상 찾을 수 있다.

subparts:
- id: '1'
  stem: |
    $m=3$일 때, 위의 조건을 만족하는 최소의 자연수 $n$을 구하고, 그 근거를 논술하시오. (14점)
  points: 14
  depends_on: []
  answer: {kind: value, value: '5', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '1, 1, 2, 2 는 반례. 5개면 나머지 종류가 1·2·3가지인 경우로 나누어 같은 나머지 3개 또는 0·1·2 각 1개를 고른다.'
    steps:
    - {id: 1a, content: '반례 $\{1,1,2,2\}$ + 5개 충분성 ⇒ $n=5$', criteria: [1.B1, 1.R1]}
    hint_ladder:
    - 4개로 반례를 만들어 보자.
    - 3으로 나눈 나머지로 분류하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 4-2. [의약학계_수학] 2025 모의논술고사 예시답안 및 채점기준_최종.pdf p.2
    steps:
    - id: 1b-1
      content: |
        주어진 자연수가 1, 1, 2, 2이면 이 중 어떠한 3개의 수를 선택해도 합이 3으로 나누어떨어지지 않는다. 따라서 $n\ge5$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $n=5$인 경우를 생각하자. 임의의 자연수를 3으로 나눈 나머지를 생각하면 0, 1, 2이다.
        (i) 5개의 자연수를 3으로 나눈 나머지가 0, 1, 2중에 하나만 나타나는 경우: 이때는 5개의 자연수 중 임의의 3개를 선택하면 항상 합이 3으로 나누어떨어진다.
        (ii) 5개의 자연수를 3으로 나눈 나머지가 0, 1, 2중에 두 개만 나타나는 경우: 두 종류의 나머지 중 적어도 하나는 3번 이상 나타난다. 따라서 이 3개의 수를 더하면 3으로 나누어떨어진다.
        (iii) 5개의 자연수를 3으로 나눈 나머지가 0, 1, 2 모두 나타나는 경우: 이 경우에는 나머지가 0, 1, 2인 세 개의 수를 더하면 3으로 나누어떨어진다. (원문 번호 '(ii)' 중복 → (iii))
        따라서 $n=5$일 때는 항상 합이 3으로 나누어떨어지는 3개의 수를 찾을 수 있으므로 $n$의 최솟값은 5이다.
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 6
      evidence: (공식 6점) $n=4$일 때 반례(예 1, 1, 2, 2)를 제시했다.
      depends_on: []
      steps: [1b-1, 1a]
    - id: 1.R1
      mark_type: R
      points: 8
      evidence: (공식 8점) 나머지가 나타나는 종류 수로 경우를 나누어 $n=5$일 때 문제의 조건을 만족함을 보였다.
      depends_on: []
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CNT-6322}
  misconceptions:
  - id: MC-CNT-6322
    outcome_code: '70'
    wrong_work: '5개면 성립함만 보이고 4개 반례를 제시하지 않음(또는 3, 4개에서 성립한다고 주장)'
    detect_cue: 반례가 없다 또는 답이 3·4
    feedback: '「최소의 n」은 n 개면 항상 성립하고, n−1 개에서는 성립하지 않는 예가 있음을 함께 보여야 합니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    $m=9$일 때, 위의 조건을 만족하는 최소의 자연수 $n$을 구하고, 그 근거를 논술하시오. (18점)
  points: 18
  depends_on: ['1']
  answer: {kind: value, value: '17', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 1 여덟 개·2 여덟 개는 반례(합 $18-x$, $1\le x\le8$). 17개에서는 (1)을 다섯 번 적용해 $3k_1,\dots,3k_5$를 얻고, $k_1,\dots,k_5$에 (1)을 적용.
    steps:
    - {id: 2a, content: '$3(k_1+k_2+k_3)$이 9의 배수 ⇒ $n=17$', criteria: [2.B1, 2.R1]}
    hint_ladder:
    - 16개로 반례를 만들어 보자(1과 2만 써서).
    - 5개 중 3개를 고르는 (1)의 결과를 여러 번 쓰자.
    - 고른 묶음의 합을 $3k_i$로 쓰면 $k_i$들은?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 4-2. [의약학계_수학] 2025 모의논술고사 예시답안 및 채점기준_최종.pdf p.2
    steps:
    - id: 2b-1
      content: |
        1이 8개, 2가 8개 있다고 하자. 이들 중에서 9개를 임의로 선택했을 때 1이 $x$개가 선택되었다면 이 9개의 수의 합은 $x+2(9-x)=18-x$이다. $1\le x\le8$이므로 어떤 경우든지 합이 9로 나누어떨어지지 않는다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        (1)에 의해서 5개의 자연수 중에는 항상 합이 3으로 나누어떨어지는 3개의 자연수를 찾을 수 있다. 즉 17개의 자연수 중에는 합이 3으로 나누어떨어지는 세 자연수 $a_1,a_2,a_3$을 찾을 수 있다. $a_1+a_2+a_3=3k_1$이라고 하자. 남은 14개의 자연수 중에는 합이 3으로 나누어떨어지는 세 자연수 $a_4,a_5,a_6$을 찾을 수 있다. $a_4+a_5+a_6=3k_2$라고 하자. 반복적으로 하면, $a_7+a_8+a_9=3k_3$, $a_{10}+a_{11}+a_{12}=3k_4$, $a_{13}+a_{14}+a_{15}=3k_5$인 자연수 $a_7,a_8,\dots,a_{15}$을 찾을 수 있다.
      criteria: [2.R1]
    - id: 2b-3
      content: |
        마지막으로 $k_1,k_2,k_3,k_4,k_5$ 중에 합이 3으로 나누어떨어지는 3개의 자연수를 찾을 수 있다. 편의상 $k_1$, $k_2$, $k_3$라고 하면 $a_1+a_2+\cdots+a_9$는 9로 나누어떨어진다.
        따라서 $n=17$일 때는 항상 합이 9로 나누어떨어지는 9개의 수를 찾을 수 있으므로 $n$의 최솟값은 17이다.
      criteria: [2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 8
      evidence: (공식 8점) $n=16$일 때 반례(예 1 여덟 개, 2 여덟 개)를 제시하고 합 $18-x$가 9의 배수가 아님을 보였다.
      depends_on: []
      steps: [2b-1, 2a]
    - id: 2.R1
      mark_type: R
      points: 10
      evidence: (공식 10점) (1)의 결과를 반복 적용해 $3k_1,\dots,3k_5$를 만들고 $k_i$ 중 세 개를 골라 $n=17$일 때 조건을 만족함을 보였다.
      depends_on: []
      ft: {allowed: true, from: [1.R1], max_points: 10}
      steps: [2b-2, 2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CNT-6323}
  - {code: '71', misconception: MC-CNT-6322}
  misconceptions:
  - id: MC-CNT-6323
    outcome_code: '70'
    wrong_work: '17개에서 3개씩 묶음을 만들 때 남은 수가 5개 이상인지 확인하지 않고 묶음 수를 3개 또는 6개로 잘못 셈'
    detect_cue: $k_i$가 5개가 아니거나 (1)을 2개 이하에 적용
    feedback: (1)은 5개 이상일 때만 쓸 수 있습니다. 17→14→11→8→5 까지 다섯 번 뽑아 $k_1,\dots,k_5$ 다섯 개를 얻어야 다시 (1)을 쓸 수 있습니다.
    remedy: [RL-2]
  - id: MC-CNT-6322
    outcome_code: '71'
    wrong_work: '17개면 성립함만 보이고 16개 반례를 제시하지 않음'
    detect_cue: 반례가 없다
    feedback: 최솟값이 17임을 보이려면 16개에서 실패하는 예가 필요합니다.
    remedy: [RL-1]

