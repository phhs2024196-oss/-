intent: |
  고등학교 교육과정의 경우의 수의 기본 개념을 잘 이해하고 이를 활용할 수 있는지를 평가한다(경희대 문항 해설 요지).
key_idea: '최솟값은 「n−1 개 반례 + n 개면 항상 가능」 두 단계. m=3 은 나머지 0,1,2 로 분류, m=9 는 (1)의 결과를 반복 적용해 3의 배수 합 다섯 묶음을 만들고 그 몫 다섯 개에 다시 (1)을 적용.'
stuck: (2)에서 (1)을 두 층으로 반복 적용(17→14→11→8→5→2 로 다섯 묶음, 몫 k_i 다섯 개에 다시 적용)하는 구성
