  concepts: [나머지에 따른 분류, 비둘기집 원리, 합의 법칙(제시문 라), 최솟값의 두 조건(반례와 충분성)]
  tools: [반례 구성(1,1,2,2 / 1 여덟 개·2 여덟 개), 나머지 종류 수로 경우 나누기, 같은 나머지 3개 또는 나머지 0·1·2 각 1개, (1)의 결과를 반복 적용해 3의 배수 합 묶음 만들기, 몫 k1~k5 에 다시 (1) 적용]
  conditions:
  - '최소의 n ⇒ $n-1$개에서는 반례가 존재, $n$개에서는 항상 성립을 모두 보여야 함'
