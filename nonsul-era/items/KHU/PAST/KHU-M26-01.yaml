stimuli:
- label: 가
  body: |
    연속확률변수 $X$의 확률밀도함수 $f(x)\ (\alpha\le x\le\beta)$에 대하여
    (1) $f(x)\ge0$
    (2) $f(x)$의 그래프와 $x$축 및 두 직선 $x=\alpha$, $x=\beta$로 둘러싸인 부분의 넓이는 1이다.
    (3) 두 상수 $a,b\ (\alpha\le a\le b\le\beta)$에 대하여 $\mathrm{P}(a\le X\le b)$는 $f(x)$의 그래프와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 부분의 넓이이다.

stem: |
  상수 $a$와 $m$에 대하여, 연속확률변수 $X$의 확률밀도함수 $f(x)\ (0\le x\le1)$가
  $$f(x)=\begin{cases}mx, & 0\le x\le a,\\ \dfrac{am}{1-2a}(x-a)+am, & a<x\le1-a,\\ -2m(x-1), & 1-a<x\le1\end{cases}$$
  로 주어지고, $\mathrm{P}\left(0\le X\le\dfrac12\right)=\dfrac38$이라고 할 때, 다음 물음에 답하시오. $\left(\text{단},\ a<\dfrac12\right)$

subparts:
- id: '1'
  stem: |
    상수 $a$와 $m$의 값을 구하고, 그 근거를 논술하시오. (14점)
  points: 14
  depends_on: []
  answer: {kind: value, value: 'a=\dfrac13,\ m=3', equivalents: ['a=1/3, m=3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '넓이 $\dfrac32m(a-a^2)=1$, $\mathrm{P}\left(0\le X\le\dfrac12\right)=ma\left(\dfrac58-\dfrac34a\right)=\dfrac38$를 연립.'
    steps:
    - {id: 1a, content: '$\dfrac{2}{3(1-a)}\left(\dfrac58-\dfrac34a\right)=\dfrac38$ ⇒ $a=\dfrac13$, $m=3$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 세 구간의 넓이를 삼각형·사다리꼴로 나누어 더하자.
    - $f\left(\dfrac12\right)$는 중간 구간의 식에서 구한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 3-2. [자연계] 2026 모의논술고사 예시답안 및 채점기준_fv.pdf p.2
    steps:
    - id: 1b-1
      content: |
        $f(x)$는 연속확률변수 $X$의 확률밀도함수이므로 $f(x)$의 그래프, $x$축 및 직선 $x=0$, $x=1$로 둘러싸인 영역의 넓이는 1이다(제시문 [가]). 이 영역의 넓이를 $0\le x\le a$, $a\le x\le1-a$, $1-a\le x\le1$의 세 영역으로 나누어 계산하면
        $\dfrac12\times a\times am+\dfrac12\times(am+2am)\times(1-2a)+\dfrac12\times a\times2am=\dfrac32m(a-a^2)$.
        따라서 $\dfrac32m(a-a^2)=1$이고 $m=\dfrac{2}{3a(1-a)}$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        한편 $\mathrm{P}\left(0\le X\le\dfrac12\right)=\dfrac38$이고 $0<a<\dfrac12$이므로
        $\dfrac12a\times am+\dfrac12\times\left(am+\dfrac32am\right)\times\left(\dfrac12-a\right)=ma\left(\dfrac58-\dfrac34a\right)=\dfrac38$.
        $m=\dfrac{2}{3a(1-a)}$를 대입하면 $\dfrac{2}{3(1-a)}\left(\dfrac58-\dfrac34a\right)=\dfrac38$이고, 정리하면 $\dfrac58-\dfrac34a=\dfrac{9}{16}-\dfrac{9}{16}a$, 즉 $a=\dfrac13$이고 따라서 $m=3$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: '넓이 조건에서 $a$와 $m$ 사이의 관계식 $\dfrac32m(a-a^2)=1$을 구했다.'
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 8
      evidence: '$\mathrm{P}\left(0\le X\le\dfrac12\right)=\dfrac38$을 이용해 $a=\dfrac13$, $m=3$을 구했다.'
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6211}
  misconceptions:
  - id: MC-PRB-6211
    outcome_code: '70'
    wrong_work: '$f\left(\dfrac12\right)$을 $2am$ 또는 $\dfrac m2$로 잡아 $\mathrm{P}\left(0\le X\le\dfrac12\right)$ 식을 세움'
    detect_cue: '$\mathrm{P}\left(0\le X\le\dfrac12\right)$ 식에 $\dfrac32am$이 없다'
    feedback: '$\dfrac12$은 중간 구간 $a<x\le1-a$에 있으므로 $f\left(\dfrac12\right)=\dfrac{am}{1-2a}\left(\dfrac12-a\right)+am=\dfrac32am$입니다.'
    remedy: [RL-1]
- id: '2'
  stem: |
    $\mathrm{P}(0\le X\le x)\times\mathrm{P}(x\le X\le1)$의 값이 최대가 되도록 하는 $x$의 값을 구하고, 그 근거를 논술하시오. (16점)
  points: 16
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{1}{\sqrt3}', equivalents: ['\dfrac{\sqrt3}{3}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$t=\mathrm{P}(0\le X\le x)$이면 값은 $t(1-t)$, $t=\dfrac12$에서 최대. $x<\dfrac23$에서 $\dfrac32x^2=\dfrac12$.'
    steps:
    - {id: 2a, content: '$\dfrac32x^2=\dfrac12$ ⇒ $x=\dfrac{1}{\sqrt3}$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - $\mathrm{P}(x\le X\le1)=1-\mathrm{P}(0\le X\le x)$이다.
    - $t(1-t)$의 최댓값은?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 3-2. [자연계] 2026 모의논술고사 예시답안 및 채점기준_fv.pdf p.2
    steps:
    - id: 2b-1
      content: |
        $\mathrm{P}(x\le X\le1)=1-\mathrm{P}(0\le X\le x)$이므로 구하는 값은 $\mathrm{P}(0\le X\le x)(1-\mathrm{P}(0\le X\le x))$의 값과 같다. $\mathrm{P}(0\le X\le x)$의 값을 $t$라 두면 최대로 하고자 하는 값은 $t(1-t)$로 표현할 수 있으며, 이는 $t=\dfrac12$일 때 최대가 된다. 따라서 값이 최대가 되는 $x$는 $\mathrm{P}(0\le X\le x)=\dfrac12$인 $x$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        (1)에서 구한 $a$와 $m$의 값에 의해 $f(x)=\begin{cases}3x, & 0\le x\le\dfrac23\\ 6-6x, & \dfrac23<x\le1\end{cases}$.
        그런데 $\mathrm{P}\left(0\le X\le\dfrac23\right)=\dfrac23$이므로 $\mathrm{P}(0\le X\le x)=\dfrac12$이 성립하려면 $x<\dfrac23$이고, 이때 $\mathrm{P}(0\le X\le x)=\dfrac12\times x\times3x=\dfrac32x^2$이다. 따라서 주어진 값을 최대로 하는 $x$는 $x=\dfrac{1}{\sqrt3}$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: '주어진 값을 $t(1-t)$로 보아 최대가 되는 조건 $\mathrm{P}(0\le X\le x)=\dfrac12$을 구했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 8
      evidence: '$x$에 대한 조건을 이용하여 $x=\dfrac{1}{\sqrt3}$을 구했다($x<\dfrac23$ 판단 포함).'
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A1], max_points: 8}
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6212}
  misconceptions:
  - id: MC-PRB-6212
    outcome_code: '70'
    wrong_work: '$\mathrm{P}(0\le X\le x)=\dfrac12$인 $x$를 구간의 가운데 $x=\dfrac12$로 답함'
    detect_cue: 답이 $\dfrac12$이다
    feedback: 밀도함수가 대칭이 아니므로 중앙값은 $\dfrac12$이 아닙니다. 넓이 $\dfrac32x^2=\dfrac12$을 풀어야 합니다.
    remedy: [RL-2]

