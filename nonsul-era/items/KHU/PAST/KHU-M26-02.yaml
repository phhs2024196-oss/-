stimuli:
- label: 나
  body: |
    삼각함수의 덧셈정리
    ① $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$, $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$
    ② $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$, $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$
    ③ $\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$, $\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$
- label: 다
  body: |
    평면 $\beta$ 위에 있는 도형의 넓이를 $S$, 이 도형의 평면 $\alpha$ 위로의 정사영의 넓이를 $S'$이라고 할 때, 두 평면 $\alpha$, $\beta$가 이루는 각의 크기를 $\theta\ (0^\circ\le\theta\le90^\circ)$라고 하면
    $$S'=S\cos\theta.$$

stem: |
  반지름의 길이가 2인 원 $O$ 위에 서로 다른 네 점 $\mathrm{A,B,C,D}$가 순서대로 시계 반대 방향으로 놓여있다. $\overline{\mathrm{AB}}=\overline{\mathrm{CD}}=2$이고, 두 직선 AB와 CD가 이루는 예각의 크기가 $\dfrac{\pi}{6}$일 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $\overline{\mathrm{BC}}>\overline{\mathrm{AD}}$일 때, 선분 BC의 길이와 사각형 ABCD의 넓이를 구하고, 그 근거를 논술하시오. (16점)
  points: 16
  depends_on: []
  answer: {kind: value, value: '\overline{BC}=\sqrt2+\sqrt6,\ \square ABCD=3+2\sqrt3', equivalents: ['BC=√2+√6, 넓이 3+2√3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '등변사다리꼴, $\angle\mathrm{ABC}=\dfrac{5}{12}\pi$, $\overline{AD}=2\sqrt2$, 높이 $y=2\sin\dfrac{5}{12}\pi$, $\overline{BC}=\overline{AD}+4\cos\dfrac{5}{12}\pi$.'
    steps:
    - {id: 1a, content: '$\overline{BC}=\sqrt2+\sqrt6$, 넓이 $=\dfrac12(\overline{AD}+\overline{BC})y=3+2\sqrt3$', criteria: [1.R1, 1.A1]}
    hint_ladder:
    - 같은 길이의 현에 대한 원주각을 비교해 AD와 BC의 관계를 찾자.
    - 두 직선의 교점을 I라 하고 삼각형 IBC의 각을 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 3-2. [자연계] 2026 모의논술고사 예시답안 및 채점기준_fv.pdf p.4
    steps:
    - id: 1b-1
      content: |
        $\widehat{AB}=\widehat{DC}$이므로 두 원주각은 $\angle\mathrm{ADB}=\angle\mathrm{DBC}$이고, 이에 따라 선분 AD와 BC는 평행이므로 사각형 ABCD는 $\overline{AB}=\overline{DC}$인 사다리꼴이다. 따라서 $\angle\mathrm{ABC}=\angle\mathrm{DCB}$.
        직선 AB와 직선 CD가 점 I에서 만난다고 하면, $\overline{BC}>\overline{AD}$이므로 두 직선의 교점이 점 A와 점 D에 가까운 곳에 생기고(<그림 1>: 원 위쪽 바깥의 점 I), $\angle\mathrm{AID}=\dfrac{\pi}{6}$이므로 $\angle\mathrm{ABC}=\angle\mathrm{DCB}=\dfrac{5}{12}\pi$.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        원 $O$의 중심을 O라고 할 때, 삼각형 AOB와 DOC가 정삼각형이므로 $\angle\mathrm{OBC}=\angle\mathrm{OCB}=\dfrac{\pi}{12}$이고, 따라서 $\angle\mathrm{BOC}=\dfrac56\pi$, $\angle\mathrm{AOD}=\dfrac{\pi}{2}$이므로 직각삼각형 AOD로부터 $\overline{AD}=2\sqrt2$.
        또한 사다리꼴의 높이 $y$에 대해 $\dfrac y2=\sin\dfrac{5}{12}\pi$, $x=\dfrac12(\overline{BC}-\overline{AD})$라 하면 $\dfrac x2=\cos\dfrac{5}{12}\pi$. 이때 $\dfrac{5}{12}\pi=\dfrac{\pi}{6}+\dfrac{\pi}{4}$이므로 삼각함수의 덧셈정리(제시문 [나])에 의해 $y=\dfrac{\sqrt2}{2}(1+\sqrt3)$, $x=\dfrac{\sqrt2}{2}(\sqrt3-1)$.
        따라서 $\overline{BC}=\overline{AD}+2x=\sqrt2+\sqrt6$이고, 사각형 ABCD의 넓이는 $\dfrac12(\overline{AD}+\overline{BC})y=3+2\sqrt3$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: '$\angle\mathrm{ABC}=\angle\mathrm{DCB}=\dfrac{5}{12}\pi$임을 확인했다(평행·교점 위치 근거).'
      depends_on: []
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 12
      evidence: '선분 BC의 길이 $\sqrt2+\sqrt6$과 사각형 ABCD의 넓이 $3+2\sqrt3$을 구했다.'
      depends_on: [1.R1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6213}
  misconceptions:
  - id: MC-GEO-6213
    outcome_code: '70'
    wrong_work: '두 직선의 각을 $\dfrac12(\widehat{BC}+\widehat{AD})=\dfrac{\pi}{6}$으로 놓아 호의 크기를 잘못 정함'
    detect_cue: 호 BC와 호 AD의 합이 $\dfrac{\pi}{3}$이 되는 식이 있다
    feedback: '두 직선은 원 밖의 점 I에서 만나므로 각의 크기는 두 호의 차의 절반입니다. 또는 $\angle\mathrm{ABC}=\dfrac{\pi}{2}-\dfrac{\pi}{12}$처럼 삼각형 IBC에서 직접 구하세요.'
    remedy: [RL-1]
- id: '2'
  stem: |
    원 $O$를 밑면으로 하고 높이가 3인 원기둥을 생각하고, 이때 다른 밑면인 원의 중심을 P라 하자. 원기둥을 선분 AB와 점 P를 지나는 평면으로 자를 때 생기는 단면의 넓이를 구하고, 그 근거를 논술하시오. (17점)
  points: 17
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac83\pi+2\sqrt3', equivalents: ['8π/3+2√3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '정사영 넓이 $S=$(반원)-(부채꼴 AOB)+(삼각형 AOB)$=\dfrac43\pi+\sqrt3$, $\cos\theta=\dfrac{\sqrt3}{\sqrt{3+9}}=\dfrac12$, 단면 $=S\div\cos\theta$.'
    steps:
    - {id: 2a, content: '$S=2\pi-\dfrac23\pi+\sqrt3$, 단면 $=2S=\dfrac83\pi+2\sqrt3$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - 단면을 아래 밑면으로 정사영하면 어떤 영역이 되는가?
    - 단면과 밑면이 이루는 각은 O에서 AB까지의 거리와 높이로 정해진다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 3-2. [자연계] 2026 모의논술고사 예시답안 및 채점기준_fv.pdf p.4
    steps:
    - id: 2b-1
      content: |
        원 $O$를 아래 밑면으로 하는 원기둥을 생각하고(<그림 2>: 단면은 AB에서 위로 올라가 윗면의 중심 P를 지나는 지름에서 윗면과 만남), 구하고자 하는 단면을 원기둥의 밑면으로 정사영한 영역의 넓이를 $S$라고 하자. $S$는 (반지름이 2인 반원의 넓이)-(부채꼴 AOB의 넓이)+(삼각형 AOB의 넓이)이다. 삼각형 AOB는 한 변의 길이가 2인 정삼각형이므로 $S=\dfrac43\pi+\sqrt3$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        한편, 선분 AB를 포함하는 밑면과 구하고자 하는 단면 사이의 이면각을 $\theta$라 하면, $\overline{OP}=3$이고 점 O로부터 선분 AB까지의 길이는 $\sqrt3$이므로 $\cos\theta=\dfrac12$이다. 따라서 제시문 [다]에 의해 구하고자 하는 단면의 넓이는 정사영된 단면의 넓이 $S$로부터 $S\div\cos\theta=\dfrac83\pi+2\sqrt3$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: '구하고자 하는 단면의 정사영된 영역의 넓이 $S=\dfrac43\pi+\sqrt3$을 구했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 9
      evidence: '단면과 밑면 사이의 이면각($\cos\theta=\dfrac12$)을 활용하여 단면의 넓이 $\dfrac83\pi+2\sqrt3$을 구했다.'
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6214}
  misconceptions:
  - id: MC-GEO-6214
    outcome_code: '70'
    wrong_work: '단면의 넓이를 $S\cos\theta=\dfrac23\pi+\dfrac{\sqrt3}{2}$로 계산'
    detect_cue: 답이 정사영 넓이보다 작다
    feedback: '제시문 [다]에서 $S''=S\cos\theta$의 $S''$은 정사영(밑면 위)의 넓이입니다. 단면의 넓이는 정사영 넓이를 $\cos\theta$로 나눈 값입니다.'
    remedy: [RL-2]

