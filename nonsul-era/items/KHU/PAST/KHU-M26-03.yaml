key_idea: '원의 중심들은 Q에서 나온 각의 이등분선 위에 있고, 닮음과 피타고라스 정리로 $r_1=\dfrac{\sqrt{k^2+1}-1}{\sqrt{k^2+1}+1}$ $\left(k=\dfrac{y_0+1}{x_0}\right)$. 인접한 원의 닮음비가 일정하므로 넓이는 공비 $r_1^2$인 등비급수.'
