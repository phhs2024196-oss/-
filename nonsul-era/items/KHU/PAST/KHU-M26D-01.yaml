stimuli:
- label: 가
  body: |
    두 사건 $A,B$가 서로 독립이기 위한 필요충분조건은
    $$\mathrm{P}(A\cap B)=\mathrm{P}(A)\mathrm{P}(B)\quad(\text{단, }P(A)>0,\ P(B)>0)$$

stem: |
  다음 그림과 같이 6개의 스위치 1, 2, 3, 4, 5, 6이 있는 전기 회로가 있다. 스위치가 켜져 있을 때만 스위치의 좌우로 전류가 흐른다. 각 스위치가 켜져 있을 확률은 $p\ (0<p<1)$이고, 각 스위치는 독립적으로 작동한다고 할 때 다음 물음에 답하시오.
  [그림 설명: 왼쪽 화살표(입력)에서 두 갈래로 나뉘는 병렬 회로. 위 줄에 스위치 1, 2, 3이 차례로 직렬로 있고 1과 2 사이의 점을 P로 표시. 아래 줄에 스위치 4, 5, 6이 차례로 직렬로 있고 4와 5 사이의 점을 A, 5와 6 사이의 점을 B로 표시. 두 줄이 오른쪽에서 합쳐져 오른쪽 화살표(출력)로 나간다.]

subparts:
- id: '1'
  stem: |
    위 그림의 왼쪽 끝에서 오른쪽 끝으로 전류가 흐를 확률을 두가지 방법 (a) 확률의 덧셈정리를 이용한 방법과 (b) 여사건의 확률을 이용한 방법으로 각각 구하고, 그 근거를 논술하시오. (13점)
  points: 13
  depends_on: []
  answer: {kind: expression, value: '2p^3-p^6', equivalents: ['1-(1-p^3)^2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '위·아래 줄이 각각 연결될 확률 $p^3$, 독립. (a) $p^3+p^3-p^6$, (b) $1-(1-p^3)^2$.'
    steps:
    - {id: 1a, content: '$2p^3-p^6$', criteria: [1.M1, 1.M2]}
    hint_ladder:
    - 위 줄 전체가 연결될 확률은?
    - 두 줄이 모두 끊길 확률을 생각하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 4-2. [의약학계_수학] 2026 모의논술고사 예시답안및채점기준_fv.pdf p.2
    steps:
    - id: 1b-1
      content: |
        (a) 확률의 덧셈정리를 이용하면
        P(위가 연결되거나 아래가 연결됨) $=$ P(위가 연결됨) $+$ P(아래가 연결됨) $-$ P(위, 아래가 모두 연결됨) $=p^3+p^3-p^6=2p^3-p^6$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (b) P(위가 연결 안 됨) $=$ P(아래가 연결 안 됨) $=1-p^3$. 위가 연결 안 되는 사건과 아래가 연결이 안 되는 사건이 독립이므로(제시문 [가]) P(위, 아래가 모두 연결 안 됨) $=(1-p^3)^2$.
        여사건을 생각하면 P(위가 연결되거나 아래가 연결됨) $=1-(1-p^3)^2=1-(1-2p^3+p^6)=2p^3-p^6$.
      criteria: [1.M2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: '확률의 덧셈정리를 이용하여 전류가 흐를 확률 $p^3+p^3-p^6=2p^3-p^6$을 구했다.'
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 8
      evidence: '여사건의 확률(두 줄이 모두 끊길 확률 $(1-p^3)^2$, 독립 근거)을 이용하여 $1-(1-p^3)^2=2p^3-p^6$을 구했다.'
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6217}
  misconceptions:
  - id: MC-PRB-6217
    outcome_code: '70'
    wrong_work: '(a)에서 $\mathrm{P}(\text{위})+\mathrm{P}(\text{아래})=2p^3$으로 끝냄'
    detect_cue: (a)의 답이 $2p^3$이고 (b)와 다르다
    feedback: 두 사건은 동시에 일어날 수 있으므로 덧셈정리에서 $\mathrm{P}(\text{위}\cap\text{아래})=p^6$을 빼야 합니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    위 그림에 전기 회로의 다른 부분에 닿지 않으면서 점 P와 점 A를 추가로 연결할 때 왼쪽에서 오른쪽으로 전류가 흐를 확률을 $f(p)$라 하자. 반면에, 위 그림에 전기 회로의 다른 부분에 닿지 않으면서 점 P와 점 B를 추가로 연결할 때 왼쪽에서 오른쪽으로 전류가 흐를 확률을 $g(p)$라 하자. $f(p)<g(p)$인 $p$의 범위를 구하고, 그 근거를 논술하시오. (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: set, value: '0<p<1', equivalents: ['(0,1) 전체'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$f=(2p-p^2)(2p^2-p^4)$, $g=(p+p^2-p^3)^2$, $f-g=-p^2(1-p)^2<0$.'
    steps:
    - {id: 2a, content: '$f(p)-g(p)=-p^2(1-p)^2<0$ ⇒ $0<p<1$ 전체', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - 연결선을 넣으면 회로가 왼쪽 부분과 오른쪽 부분으로 나뉜다.
    - 각 부분은 병렬 회로이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 4-2. [의약학계_수학] 2026 모의논술고사 예시답안및채점기준_fv.pdf p.2
    steps:
    - id: 2b-1
      content: |
        먼저 P와 A가 연결된 경우를 생각하자. 왼쪽 끝부터 선분 PA까지 전류가 흐를 확률은 $2p-p^2$이고(스위치 1, 4 병렬), 선분 PA부터 오른쪽 끝까지 전류가 흐를 확률은 $2p^2-p^4$이다(2·3과 5·6 병렬). 두 사건이 독립이므로 $f(p)=(2p-p^2)(2p^2-p^4)=p^3(2-p)(2-p^2)$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        다음으로 P와 B가 연결된 경우를 생각하자. 왼쪽 끝부터 선분 PB까지 전류가 흐를 확률은 $p+p^2-p^3$이고(1과 4·5 병렬), 선분 PB부터 오른쪽 끝까지 전류가 흐를 확률도 $p+p^2-p^3$이다(2·3과 6 병렬). 두 사건이 독립이므로 $g(p)=(p+p^2-p^3)^2=p^2(1+p-p^2)^2$.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        따라서 $f(p)-g(p)=p^2(-1+2p-p^2)=-p^2(1-p)^2$이다. 그러므로 $0<p<1$에서 $f(p)-g(p)<0$, 즉 $f(p)<g(p)$이다. 답: $0<p<1$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: '확률의 곱셈정리와 독립을 이용하여 $f(p)=(2p-p^2)(2p^2-p^4)$를 구했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: '확률의 곱셈정리와 독립을 이용하여 $g(p)=(p+p^2-p^3)^2$을 구했다.'
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: '$f(p)-g(p)=-p^2(1-p)^2$으로 $f(p)<g(p)$인 $p$의 범위 $0<p<1$을 구했다.'
      depends_on: [2.M1, 2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6218}
  misconceptions:
  - id: MC-PRB-6218
    outcome_code: '70'
    wrong_work: 'PA 연결 후에도 전류 경로(1-2-3, 4-5-6, 1-A-5-6, 4-P-2-3)의 확률을 그대로 더해 $f(p)=2p^3+2p^4$ 처럼 계산'
    detect_cue: $f(p)$가 1을 넘을 수 있는 식이거나 경로 확률의 단순 합이다
    feedback: 연결선이 생기면 회로는 「왼쪽 병렬부」와 「오른쪽 병렬부」의 직렬입니다. 각 부분의 확률을 구해 곱하세요.
    remedy: [RL-2]

