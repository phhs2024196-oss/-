subparts:
- id: '1'
  stem: |
    $n$이 자연수일 때, 실수에서 정의된 최고차항의 계수가 각각 1인 삼차함수 $f(x)$와 이차함수 $g(x)$에 대하여 $f(x)=0$의 근이 $0,-n$을 포함하고, $g(x)=0$의 근이 $0,n$이라 하자. 함수 $h(x)=\begin{cases}f(x), & x\le0\\ g(x), & x>0\end{cases}$가 원점에서 미분가능할 때, $y=\lvert h(x)\rvert$의 그래프와 직선 $y=0$으로 둘러싸인 두 영역 중에서 $y$축 왼쪽의 내부 영역(경계 제외)을 $A_n$, $y$축 오른쪽의 내부 영역(경계 제외)을 $B_n$이라 하자. $A_n$ 및 $B_n$의 원소 중에서 $x$좌표와 $y$좌표가 모두 정수인 점의 개수를 각각 $a_n$, $b_n$이라 할 때, $\displaystyle\lim_{n\to\infty}\dfrac{a_n}{nb_n}$의 값을 구하고, 그 근거를 논술하시오. (13점)
  points: 13
  depends_on: []
  answer: {kind: value, value: '\dfrac{1}{2}', equivalents: ['1/2', '0.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 미분가능 조건으로 $f(x)=x(x+n)(x-1)$을 정하고, 세로선마다 격자점을 세어 $a_n\sim\dfrac{n^4}{12}$, $b_n\sim\dfrac{n^3}{6}$을 얻는다.
    steps:
    - {id: 1a, content: '$a_n=\sum_{k=1}^{n-1}(f(-k)-1)$, $b_n=\sum_{k=1}^{n-1}(-g(k)-1)$, 최고차항 비 $\dfrac{1/12}{1/6}=\dfrac12$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $h$가 원점에서 미분가능하려면 $f'(0)$과 $g'(0)$은 어떤 관계여야 하는가?
    - 직선 $x=-k$ 위에 있는 $A_n$의 격자점은 몇 개인가?
    - $a_n$, $b_n$은 각각 $n$의 몇 차식인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.2 (3-2. [자연계] 예시답안및채점기준 PDF)
    steps:
    - id: 1b-1
      content: |
        $f(x)=0$의 두 근이 $0,-n$이므로 $f(x)=x(x+n)(x-c)$로 놓을 수 있다. $g(x)=x(x-n)$이고, $h(x)$가 원점에서 미분가능하므로 $-cn=f'(0)=g'(0)=-n$, 즉 $c=1$이다. 따라서 $f(x)=x(x+n)(x-1)$.
        (보충) $-n<x<0$에서 $f(x)>0$, $0<x<n$에서 $g(x)<0$이므로 $A_n$은 $-n<x<0$, $0<y<f(x)$, $B_n$은 $0<x<n$, $0<y<-g(x)$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        (보충) 직선 $x=-k\ (k=1,\cdots,n-1)$ 위의 $A_n$의 격자점은 $y=1,2,\cdots,f(-k)-1$이므로
        $$a_n=\sum_{k=1}^{n-1}(f(-k)-1)=\sum_{k=1}^{n-1}(-k^3+(n-1)k^2+nk-1)=-\left(\dfrac{n(n-1)}{2}\right)^2+\dfrac{n(n-1)^2(2n-1)}{6}+\dfrac{n^2(n-1)}{2}-n+1$$
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $$b_n=\sum_{k=1}^{n-1}(-g(k)-1)=\sum_{k=1}^{n-1}(-k^2+nk-1)=-\dfrac{n(n-1)(2n-1)}{6}+\dfrac{n^2(n-1)}{2}-n+1$$
      criteria: [1.M2]
    - id: 1b-4
      content: |
        $a_n$의 $n^4$의 계수는 $-\dfrac14+\dfrac13$, $nb_n$의 $n^4$의 계수는 $-\dfrac13+\dfrac12=\dfrac16$이므로 분자·분모를 $n^4$으로 나누고 제시문 [나]를 쓰면
        $$\lim_{n\to\infty}\dfrac{a_n}{nb_n}=\left(-\dfrac14+\dfrac13\right)\div\dfrac16=\dfrac12$$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $f'(0)=g'(0)$(원점에서의 미분가능성)으로 $c=1$을 얻어 $f(x)=x(x+n)(x-1)$을 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $a_n=\sum_{k=1}^{n-1}(f(-k)-1)$로 놓고 거듭제곱의 합 공식으로 $a_n$의 값($n$에 관한 식)을 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $b_n=\sum_{k=1}^{n-1}(-g(k)-1)$로 놓고 $b_n$의 값($n$에 관한 식)을 구했다.
      depends_on: []
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 최고차항의 계수를 비교해 $\lim_{n\to\infty}\dfrac{a_n}{nb_n}=\dfrac12$을 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-CAL-6101}
  - {code: '71', misconception: MC-CNT-6102}
  misconceptions:
  - id: MC-CAL-6101
    outcome_code: '70'
    wrong_work: '$f(x)=x(x+n)(x-c)$에서 $c$를 정하지 않거나 $f(x)=x^2(x+n)$ 등으로 임의로 정함'
    detect_cue: $f'(0)=g'(0)$ 식이 없고 $f(x)$의 셋째 인수가 $x-1$이 아니다
    feedback: 이음점에서 미분가능하려면 두 식의 함숫값과 미분계수가 모두 같아야 합니다. $f'(0)=g'(0)$을 세워 보세요.
    remedy: [RL-1]
  - id: MC-CNT-6102
    outcome_code: '71'
    wrong_work: '$x=-k$ 위의 격자점을 $f(-k)$개 또는 $f(-k)+1$개로 세어 $a_n=\sum f(-k)$로 씀'
    detect_cue: 합의 일반항에 $-1$이 없다(극한값은 같아도 $a_n$ 식이 다름)
    feedback: 경계를 제외한 내부이므로 $0<y<f(-k)$인 정수 $y$만 셉니다. 개수는 $f(-k)-1$입니다.
    remedy: [RL-2]
- id: '2'
  stem: |
    점 $(-n,0)$을 지나고 기울기가 양수인 직선이 곡선 $y=\lvert h(x)\rvert$와 만나는 점의 개수를 직선의 기울기에 따라 분류하고, 그 근거를 논술하시오. (17점)
  points: 17
  depends_on: ['1']
  answer: {kind: set, value: '0<a<(3-2\sqrt2)n: 5개, a=(3-2\sqrt2)n: 4개, (3-2\sqrt2)n<a<n^2+n: 3개, a\ge n^2+n: 2개', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 교점은 항상 $(-n,0)$과 $x>n$의 1개, $(-n,0)$ 구간에서는 $a<f'(-n)$일 때 1개, $(0,n)$에서는 $-g$의 접선 기울기 $a_1$보다 작을 때 2개이다.
    steps:
    - {id: 2a, content: '$a_1=(3-2\sqrt2)n$, $a_2=f''(-n)=n^2+n$을 경계로 5, 4, 3, 2개', criteria: [2.R1, 2.M1, 2.A1, 2.B1]}
    hint_ladder:
    - 직선 $y=a(x+n)$이 각 구간 $(-n,0)$, $(0,n)$, $x>n$에서 $\lvert h\rvert$와 몇 번 만나는지 따로 보자.
    - 기울기가 변하며 교점 수가 바뀌는 순간은 직선이 곡선에 접할 때이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.2 (3-2. [자연계] 예시답안및채점기준 PDF)
    steps:
    - id: 2b-1
      content: |
        점 $(-n,0)$을 지나는 직선의 방정식은 $y=a(x+n)$이다. 이 직선이 곡선 $y=-g(x)$와 1사분면에서 접할 때 직선의 기울기를 $a_1$, 곡선 $y=f(x)$와 $(-n,0)$에서 접할 때 직선의 기울기를 $a_2$라 하자.
        (보충) 점 $(-n,0)$은 항상 교점이고, $x<-n$에서는 직선이 음수, $\lvert h\rvert$가 양수라 교점이 없으며, $x>n$에서는 $g(x)-a(x+n)$이 $x=n$에서 음수이고 이차함수이므로 교점이 정확히 1개이다. $-n<x<0$에서는 $f(x)=a(x+n)\iff x^2-x-a=0$이므로 음의 근 $\dfrac{1-\sqrt{1+4a}}{2}$가 $-n$보다 클 때, 즉 $a<a_2$일 때 1개이다. $0<x<n$에서는 $y=-g(x)$(위로 볼록)와 접할 때까지 2개, 접할 때 1개, 그 뒤로 0개이다.
        $a$값에 따라 직선과 곡선 $y=\lvert h(x)\rvert$가 만나는 점의 개수는 다음과 같다.
        $0<a<a_1$: 5개, $a=a_1$: 4개, $a_1<a<a_2$: 3개, $a\ge a_2$: 2개.
      criteria: [2.R1]
    - id: 2b-2
      content: |
        조건으로부터 $a_2=f'(-n)=n^2+n$이다. (제시문 [가]: $(-n,0)$에서의 접선의 기울기)
      criteria: [2.B1]
    - id: 2b-3
      content: |
        $a=a_1$이면 직선과 곡선 $y=-g(x)$가 1사분면의 한 점에서 접해야 한다. 접점의 $x$좌표를 $\alpha$라 하면 접선의 방정식은 $y=(n-2\alpha)(x-\alpha)-\alpha^2+n\alpha$이다. 이 직선이 점 $(-n,0)$을 지나므로 $\alpha^2+2n\alpha-n^2=0$이다.
      criteria: [2.M1]
    - id: 2b-4
      content: |
        이 방정식을 풀면 $\alpha>0$이므로 $\alpha=(\sqrt2-1)n$이다. 따라서 $a_1=n-2\alpha=(3-2\sqrt2)n$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 8
      evidence: 직선의 기울기를 $0<a<a_1$, $a=a_1$, $a_1<a<a_2$, $a\ge a_2$로 분류하고 각각 교점 5, 4, 3, 2개를 근거와 함께 제시했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: $y=-g(x)$ 위의 접점 $\alpha$에서의 접선이 $(-n,0)$을 지난다는 조건으로 $\alpha^2+2n\alpha-n^2=0$을 세웠다.
      depends_on: []
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $\alpha=(\sqrt2-1)n$, 기울기 $a_1=(3-2\sqrt2)n$을 구했다.
      depends_on: [2.M1]
      steps: [2b-4]
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: 기울기 $a_2=f'(-n)=n^2+n$을 구했다.
      depends_on: []
      steps: [2b-2]
    deductions: []
  outcome_codes:
