key_idea: '$f''(0)=g''(0)$에서 $f(x)=x(x+n)(x-1)$, 격자점 수는 $\sum(f(-k)-1)$, $\sum(-g(k)-1)$이고, 교점 개수는 $-g$에 그은 접선 기울기 $a_1=(3-2\sqrt2)n$과 $f''(-n)=n^2+n$을 경계로 바뀐다.'
