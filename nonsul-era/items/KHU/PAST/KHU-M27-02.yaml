stimuli:
- label: 가
  body: |
    접선의 방정식
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: 나
  body: |
    수렴하는 두 수열 $\{a_n\}$, $\{b_n\}$에 대하여 다음 성질이 성립한다.
    $$\lim_{n\to\infty}(a_n+b_n)=\lim_{n\to\infty}a_n+\lim_{n\to\infty}b_n,\quad \lim_{n\to\infty}\dfrac{a_n}{b_n}=\dfrac{\lim_{n\to\infty}a_n}{\lim_{n\to\infty}b_n}\quad(\text{단, }b_n\neq0,\ \lim_{n\to\infty}b_n\neq0)$$
- label: 다
  body: |
    이산확률변수의 기댓값(평균)
    이산확률변수 $X$의 확률질량함수가 $\mathrm{P}(X=x_i)=p_i\ (i=1,2,\cdots,n)$일 때, 확률변수 $X$의 기댓값(평균) $\mathrm{E}(X)$는
    $$\mathrm{E}(X)=x_1p_1+x_2p_2+\cdots+x_np_n$$
- label: 라
  body: |
    평면 $\beta$ 위에 있는 도형의 넓이를 $S$, 이 도형의 평면 $\alpha$ 위로의 정사영의 넓이를 $S'$이라고 할 때, 두 평면 $\alpha,\beta$가 이루는 각의 크기를 $\theta\ (0^\circ\le\theta\le90^\circ)$라고 하면
    $$S'=S\cos\theta$$

stem: |
  [논제 Ⅱ] [배점 33점]
  어느 학교 과학 동아리는 식물의 성장 상태를 나타내는 성장 지수를 관찰하고 있다. 현재 성장 지수는 16이며, 성장 지수는 한 달이 지날 때마다 확률 $\dfrac12$로 이전 달의 2배가 되고 확률 $\dfrac12$로 이전 달의 $\dfrac12$배가 되며, 각 달의 변화는 서로 독립이다. 동아리는 3개월 뒤, 3개월 후 성장 지수가 관찰 기간 동안 매월 말에 기록한 세 성장 지수, 즉 1개월 후, 2개월 후, 3개월 후 성장 지수의 산술평균보다 크면 그 차이
  [상자] 3개월 후 성장 지수 – 1개월 후, 2개월 후, 3개월 후 성장 지수의 산술평균
  를 성장 보너스로 받고, 3개월 후 성장 지수가 그 산술평균보다 작거나 같으면 성장 보너스를 0으로 받는다. 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    동아리가 받을 성장 보너스의 기댓값을 구하고, 그 근거를 논술하시오. (16점)
  points: 16
  depends_on: []
  answer: {kind: value, value: '\dfrac{55}{6}', equivalents: ['55/6'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 보너스가 양수인 경우는 UUU, UDU, DUU, DDU 네 가지뿐이고 보너스는 각각 $\frac{160}{3},\frac{16}{3},\frac{40}{3},\frac43$이다.
    steps:
    - {id: 1a, content: '$\frac18\left(\frac{160}{3}+\frac{16}{3}+\frac{40}{3}+\frac43\right)=\frac{55}{6}$', criteria: [1.B1, 1.M1, 1.A1]}
    hint_ladder:
    - 3개월 동안 일어날 수 있는 변화를 모두 나열해 보자.
    - 3개월 후 지수가 평균보다 큰 경우는 마지막 달에 2배가 된 경우뿐인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.4 (3-2. [자연계] 예시답안및채점기준 PDF)
    steps:
    - id: 1b-1
      content: |
        성장 지수가 2배가 되는 경우를 U, 성장 지수가 $\dfrac12$배가 되는 경우를 D라고 하자. 3개월 동안의 경우는 UUU, UUD, UDU, UDD, DUU, DUD, DDU, DDD의 8가지이고 각 확률은 $\dfrac18$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        각 경우의 (1개월 후, 2개월 후, 3개월 후; 평균; 보너스)는
        UUU (32, 64, 128; $\frac{224}{3}$; $\frac{160}{3}$), UUD (32, 64, 32; $\frac{128}{3}$; 0), UDU (32, 16, 32; $\frac{80}{3}$; $\frac{16}{3}$), UDD (32, 16, 8; $\frac{56}{3}$; 0),
        DUU (8, 16, 32; $\frac{56}{3}$; $\frac{40}{3}$), DUD (8, 16, 8; $\frac{32}{3}$; 0), DDU (8, 4, 8; $\frac{20}{3}$; $\frac43$), DDD (8, 4, 2; $\frac{14}{3}$; 0).
      criteria: [1.M1]
    - id: 1b-3
      content: |
        따라서 성장 보너스의 기댓값은 (제시문 [다])
        $$\dfrac18\cdot\dfrac{160}{3}+\dfrac18\cdot\dfrac{16}{3}+\dfrac18\cdot\dfrac{40}{3}+\dfrac18\cdot\dfrac43=\dfrac{55}{6}$$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: 3개월 동안 가능한 8가지 변화 경우와 각 확률 $\frac18$을 올바르게 정리했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: 각 경우의 1개월 후, 2개월 후, 3개월 후 성장 지수와 성장 보너스를 올바르게 계산했다(평균 이하이면 0).
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: 성장 보너스의 기댓값을 계산해 $\frac{55}{6}$을 답으로 적었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-PRB-6105}
  misconceptions:
  - id: MC-PRB-6105
    outcome_code: '70'
    wrong_work: '보너스를 0으로 처리해야 할 경우의 음수 차이를 그대로 평균해 기댓값을 $\frac{35}{6}$으로 구함'
    detect_cue: 표의 보너스 열에 음수가 있거나 답이 $\frac{35}{6}$
    feedback: 3개월 후 지수가 평균 이하이면 보너스는 0입니다. 음수 차이는 0으로 바꾼 뒤 기댓값을 계산하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    이번에는 동아리가 두 식물을 관찰한다고 하자. 두 식물의 현재 성장 지수는 모두 16이며, 각 식물의 성장 지수는 위와 같은 규칙에 따라 변한다. 또한 두 식물에서 일어나는 성장 지수의 변화도 서로 독립이다. 동아리는 3개월 뒤 각 식물의 성장 보너스를 계산한 후, 둘 중 더 큰 값을 최종 성장 보너스로 받는다. 이때 최종 성장 보너스의 기댓값을 구하고, 그 근거를 논술하시오. (17점)
  points: 17
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{261}{16}', equivalents: ['261/16', '16.3125'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 한 식물의 보너스 누적확률 $\frac48,\frac58,\frac68,\frac78,1$을 제곱해 차를 취하면 최댓값의 분포가 된다.
    steps:
    - {id: 2a, content: '$\frac43\cdot\frac{9}{64}+\frac{16}{3}\cdot\frac{11}{64}+\frac{40}{3}\cdot\frac{13}{64}+\frac{160}{3}\cdot\frac{15}{64}=\frac{261}{16}$', criteria: [2.B1, 2.M1, 2.A1]}
    hint_ladder:
    - 두 보너스가 모두 어떤 값 이하일 확률은 어떻게 구할까?
    - 최종 보너스가 정확히 $b$일 확률은 두 누적확률의 차이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.4~5 (3-2. [자연계] 예시답안및채점기준 PDF)
    steps:
    - id: 2b-1
      content: |
        문제 (1)에서 한 식물의 성장 보너스는 0, $\frac43$, $\frac{16}{3}$, $\frac{40}{3}$, $\frac{160}{3}$의 값을 각각 확률 $\frac48$, $\frac18$, $\frac18$, $\frac18$, $\frac18$로 가진다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        두 식물은 서로 독립적으로 자라므로 두 식물의 성장 보너스도 서로 독립이다. 먼저 한 식물의 성장 보너스가 어떤 값 이하일 확률은
        $P(\le0)=\frac48$, $P(\le\frac43)=\frac58$, $P(\le\frac{16}{3})=\frac68$, $P(\le\frac{40}{3})=\frac78$, $P(\le\frac{160}{3})=1$.
        두 식물의 보너스가 모두 어떤 값 이하일 확률은 각각의 확률을 곱하면 된다. 따라서 최종 보너스가
        0일 확률 $\left(\frac48\right)^2=\frac{16}{64}$, $\frac43$일 확률 $\left(\frac58\right)^2-\left(\frac48\right)^2=\frac{9}{64}$, $\frac{16}{3}$일 확률 $\left(\frac68\right)^2-\left(\frac58\right)^2=\frac{11}{64}$, $\frac{40}{3}$일 확률 $\left(\frac78\right)^2-\left(\frac68\right)^2=\frac{13}{64}$, $\frac{160}{3}$일 확률 $1-\left(\frac78\right)^2=\frac{15}{64}$.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        따라서 $\dfrac43\cdot\dfrac{9}{64}+\dfrac{16}{3}\cdot\dfrac{11}{64}+\dfrac{40}{3}\cdot\dfrac{13}{64}+\dfrac{160}{3}\cdot\dfrac{15}{64}=\dfrac{261}{16}$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: 한 식물의 성장 보너스 값과 그 확률분포(0이 $\frac48$, 나머지 각 $\frac18$)를 올바르게 정리했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 7
      evidence: 두 식물이 독립임을 이용해 두 보너스 중 더 큰 값의 확률분포($\frac{16}{64},\frac{9}{64},\frac{11}{64},\frac{13}{64},\frac{15}{64}$)를 구했다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: 최종 보너스의 기댓값 $\frac{261}{16}$을 계산했다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
