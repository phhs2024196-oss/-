    wrong_work: '두 식물의 보너스 기댓값이 같으므로 최종 보너스의 기댓값도 $\frac{55}{6}$(또는 $2\times\frac{55}{6}$)라고 씀'
    detect_cue: 답이 $\frac{55}{6}$ 또는 $\frac{55}{3}$
