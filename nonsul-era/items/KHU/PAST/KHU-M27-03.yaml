      evidence: $\triangle\mathrm{P_3AP_2}=2\sqrt{23}$, $\overline{\mathrm{AP_3}}=4$를 구해 $\overline{\mathrm{P_2H'}}=\sqrt{23}$을 얻었다.
      depends_on: []
