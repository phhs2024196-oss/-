      evidence: 삼수선의 정리로 $\overline{\mathrm{O_2H'}}\perp\overline{\mathrm{AP_3}}$임을 밝히고 $\overline{\mathrm{O_2H'}}=3\sqrt3$을 구했다.
      depends_on: []
      steps: [2b-4]
    - id: 2.A2
