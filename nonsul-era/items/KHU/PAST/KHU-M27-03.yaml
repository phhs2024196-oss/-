stimuli:
- label: 가
  body: |
    접선의 방정식
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: 나
  body: |
    수렴하는 두 수열 $\{a_n\}$, $\{b_n\}$에 대하여 다음 성질이 성립한다.
    $$\lim_{n\to\infty}(a_n+b_n)=\lim_{n\to\infty}a_n+\lim_{n\to\infty}b_n,\quad \lim_{n\to\infty}\dfrac{a_n}{b_n}=\dfrac{\lim_{n\to\infty}a_n}{\lim_{n\to\infty}b_n}\quad(\text{단, }b_n\neq0,\ \lim_{n\to\infty}b_n\neq0)$$
- label: 다
  body: |
    이산확률변수의 기댓값(평균)
    이산확률변수 $X$의 확률질량함수가 $\mathrm{P}(X=x_i)=p_i\ (i=1,2,\cdots,n)$일 때, 확률변수 $X$의 기댓값(평균) $\mathrm{E}(X)$는
    $$\mathrm{E}(X)=x_1p_1+x_2p_2+\cdots+x_np_n$$
- label: 라
  body: |
    평면 $\beta$ 위에 있는 도형의 넓이를 $S$, 이 도형의 평면 $\alpha$ 위로의 정사영의 넓이를 $S'$이라고 할 때, 두 평면 $\alpha,\beta$가 이루는 각의 크기를 $\theta\ (0^\circ\le\theta\le90^\circ)$라고 하면
    $$S'=S\cos\theta$$

stem: |
  [논제 Ⅲ] [배점 37점]
  아래 그림과 같이 평면 $\alpha$위에 반지름이 각각 1, 2, 3이고, 중심이 각각 $\mathrm{O_1}$, $\mathrm{O_2}$, $\mathrm{O_3}$인 구가 서로 접해있다. 다음 물음에 답하시오.
  [그림 1 설명: 평행사변형으로 그린 평면 $\alpha$ 위에 세 구가 놓여 있다. 가장 작은 구(중심 $\mathrm{O_1}$, 반지름 1)가 앞쪽 가운데, 중간 구(중심 $\mathrm{O_2}$, 반지름 2)가 오른쪽, 가장 큰 구(중심 $\mathrm{O_3}$, 반지름 3)가 왼쪽 뒤에 있으며 세 구는 서로 접하고 모두 평면 $\alpha$에 접한다. 그림에는 중심 $\mathrm{O_1}$, $\mathrm{O_2}$, $\mathrm{O_3}$과 평면 이름 $\alpha$만 표시되어 있다.]

subparts:
- id: '1'
  stem: |
    점 $\mathrm{O_1}$, $\mathrm{O_2}$, $\mathrm{O_3}$가 이루는 평면을 $\beta$라 하자. 평면 $\alpha$와 평면 $\beta$의 이면각을 $\theta$라 할 때, $\cos\theta$의 값을 구하고, 그 근거를 논술하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: value, value: '\dfrac{\sqrt{23}}{6}', equivalents: ['sqrt(23)/6'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\triangle\mathrm{O_1O_2O_3}$의 넓이 6, 그 정사영 $\triangle\mathrm{P_1P_2P_3}$의 넓이 $\sqrt{23}$의 비가 $\cos\theta$이다.
    steps:
    - {id: 1a, content: '$\overline{\mathrm{P_1P_2}}=2\sqrt2$, $\overline{\mathrm{P_2P_3}}=2\sqrt6$, $\overline{\mathrm{P_1P_3}}=2\sqrt3$ ⇒ 넓이 $\sqrt{23}$, $\cos\theta=\dfrac{\sqrt{23}}{6}$', criteria: [1.M1, 1.B1, 1.M2, 1.A1]}
    hint_ladder:
    - 서로 접하는 두 구의 중심 사이 거리는 반지름의 합이다.
    - 세 중심을 평면 $\alpha$에 정사영한 삼각형의 넓이를 구해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.7 (3-2. [자연계] 예시답안및채점기준 PDF)
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{O_1O_2}}=3$, $\overline{\mathrm{O_1O_3}}=4$, $\overline{\mathrm{O_2O_3}}=5$이므로 삼각형 $\mathrm{O_1O_2O_3}$는 직각삼각형이다. 따라서 $\triangle\mathrm{O_1O_2O_3}=\dfrac12\times3\times4=6$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        점 $\mathrm{O_1,O_2,O_3}$에서 평면 $\alpha$에 내린 수선의 발을 각각 $\mathrm{P_1,P_2,P_3}$라 하면, $\overline{\mathrm{P_1P_2}}=2\sqrt2$, $\overline{\mathrm{P_2P_3}}=2\sqrt6$, $\overline{\mathrm{P_1P_3}}=2\sqrt3$이다. (보충: 예를 들어 $\overline{\mathrm{P_1P_2}}=\sqrt{3^2-(2-1)^2}$)
      criteria: [1.M2]
    - id: 1b-3
      content: |
        한편, 코사인법칙에 의해
        $$\cos\angle\mathrm{P_2P_1P_3}=\dfrac{8+12-24}{2\times2\sqrt2\times2\sqrt3}=-\dfrac{1}{2\sqrt6}$$
        따라서 $\sin\angle\mathrm{P_2P_1P_3}=\dfrac{\sqrt{23}}{2\sqrt6}$이며, 그러므로 $\triangle\mathrm{P_1P_2P_3}=\dfrac12\times2\sqrt2\times2\sqrt3\times\dfrac{\sqrt{23}}{2\sqrt6}=\sqrt{23}$이다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        제시문 [라]의 정사영의 성질에 의해 $\cos\theta=\dfrac{\triangle\mathrm{P_1P_2P_3}}{\triangle\mathrm{O_1O_2O_3}}=\dfrac{\sqrt{23}}{6}$이다.
      criteria: [1.M1, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 정사영의 성질을 이용하여 $\cos\theta=\dfrac{\triangle\mathrm{P_1P_2P_3}}{\triangle\mathrm{O_1O_2O_3}}$임을 적었다.
      depends_on: []
      steps: [1b-4]
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: 삼각형 $\mathrm{O_1O_2O_3}$이 직각삼각형임을 밝히고 넓이 6을 구했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 수선의 발 사이 거리 $2\sqrt2$, $2\sqrt6$, $2\sqrt3$을 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 코사인법칙 등으로 $\triangle\mathrm{P_1P_2P_3}=\sqrt{23}$을 구하고 $\cos\theta=\dfrac{\sqrt{23}}{6}$을 적었다.
      depends_on: [1.M2]
      steps: [1b-3, 1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '70', misconception: MC-GEO-6108}
  - {code: '71', misconception: MC-GEO-6109}
  misconceptions:
  - id: MC-GEO-6108
    outcome_code: '70'
    wrong_work: '$\overline{\mathrm{P_1P_2}}=3$, $\overline{\mathrm{P_2P_3}}=5$처럼 중심 사이 거리를 그대로 수선의 발 사이 거리로 씀'
    detect_cue: 정사영 삼각형이 원래 삼각형과 합동(넓이 6)으로 계산됨
    feedback: 두 중심의 높이가 반지름만큼 다르므로 수평 거리는 $\sqrt{(\text{중심거리})^2-(\text{높이차})^2}$입니다.
    remedy: [RL-1]
  - id: MC-GEO-6109
    outcome_code: '71'
    wrong_work: '$\cos\theta=\dfrac{6}{\sqrt{23}}$처럼 넓이비를 거꾸로 씀'
    detect_cue: $\cos\theta>1$인 값
    feedback: 정사영의 넓이가 원래 넓이보다 작으므로 $\cos\theta=\dfrac{S'}{S}$입니다.
    remedy: [RL-2]
- id: '2'
  stem: |
    점 $\mathrm{O_1}$과 $\mathrm{O_2}$를 지나는 직선이 평면 $\alpha$와 만나는 점을 $\mathrm{A}$, 점 $\mathrm{O_2}$와 점 $\mathrm{O_3}$를 지나는 직선이 평면 $\alpha$와 만나는 점을 $\mathrm{B}$, 점 $\mathrm{O_3}$에서 $\alpha$에 내린 수선의 발을 $\mathrm{P_3}$라 하자. 이때, 삼각형 $\mathrm{O_3AB}$의 넓이를 $S_1$, 삼각형 $\mathrm{P_3AO_2}$의 넓이를 $S_2$라 할 때 $\dfrac{S_2}{S_1}$의 값을 구하고, 그 근거를 논술하시오. (22점)
  points: 22
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{\sqrt3}{6}', equivalents: ['sqrt(3)/6'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 닮음으로 $\overline{\mathrm{AO_2}}=6$, $\overline{\mathrm{BO_2}}=10$, $\overline{\mathrm{AB}}=4\sqrt{13}$이고 $S_1=\dfrac12\cdot4\sqrt{13}\cdot\dfrac{3}{\sin\theta}=36$, 삼수선의 정리로 $S_2=6\sqrt3$.
    steps:
    - {id: 2a, content: '$S_1=36$, $S_2=6\sqrt3$, $\dfrac{S_2}{S_1}=\dfrac{\sqrt3}{6}$', criteria: [2.M1, 2.A1, 2.M2, 2.R1, 2.A2]}
    hint_ladder:
    - 점 A, B는 평면 $\beta$ 위에 있다.
    - $\mathrm{O_3}$에서 직선 AB까지의 거리를 이면각으로 나타내 보자.
    - $\mathrm{P_2}$에서 $\mathrm{AP_3}$에 내린 수선과 삼수선의 정리를 떠올리자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 예시답안 p.7 (3-2. [자연계] 예시답안및채점기준 PDF)
    steps:
    - id: 2b-1
      content: |
        삼각형 $\mathrm{O_2P_2A}$와 삼각형 $\mathrm{O_1P_1A}$는 서로 닮음이고, 닮음비가 $2:1$이며, $\overline{\mathrm{O_1O_2}}=3$이므로 $\overline{\mathrm{AO_2}}=6$이다. 또한, 삼각형 $\mathrm{O_3P_3B}$과 삼각형 $\mathrm{O_2P_2B}$은 서로 닮음이고, 닮음비가 $3:2$이며, $\overline{\mathrm{O_3O_2}}=5$이므로 $\overline{\mathrm{BO_2}}=10$이다. 삼각형 $\mathrm{O_1O_2O_3}$는 직각삼각형이므로
        $\cos\angle\mathrm{AO_2B}=\cos(\pi-\angle\mathrm{O_3O_2O_1})=-\dfrac35$이고, $\overline{\mathrm{AB}}^2=100+36-2\times10\times6\times\left(-\dfrac35\right)=208$, 즉 $\overline{\mathrm{AB}}=4\sqrt{13}$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        한편, $\mathrm{O_3}$에서 선분 AB에 내린 수선의 발을 H라 하면 $\sin\theta=\dfrac{\overline{\mathrm{O_3P_3}}}{\overline{\mathrm{O_3H}}}$이고, $\sin\theta=\sqrt{1-\cos^2\theta}=\dfrac{\sqrt{13}}{6}$이므로 $\overline{\mathrm{O_3H}}=\dfrac{18}{\sqrt{13}}$이다. 따라서 $S_1=\triangle\mathrm{O_3AB}=\dfrac12\times4\sqrt{13}\times\dfrac{18}{\sqrt{13}}=36$이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        한편, 삼각형 $\mathrm{P_1P_2P_3}$의 넓이가 $\sqrt{23}$이고 $\overline{\mathrm{P_1P_2}}=2\sqrt2$이므로 $\mathrm{P_3}$에서 선분 $\mathrm{AP_2}$까지의 거리는 $\dfrac{\sqrt{46}}{2}$이다. 또한 $\overline{\mathrm{AP_2}}=\sqrt{\overline{\mathrm{AO_2}}^2-\overline{\mathrm{O_2P_2}}^2}=\sqrt{36-4}=4\sqrt2$이므로 $\triangle\mathrm{P_3AP_2}=\dfrac12\times4\sqrt2\times\dfrac{\sqrt{46}}{2}=2\sqrt{23}$이다.
        한편, 삼각형 $\mathrm{O_3AO_2}$에서 $\overline{\mathrm{AO_2}}=6$, $\overline{\mathrm{O_3O_2}}=5$, $\cos\angle\mathrm{O_3O_2A}=\dfrac35$이므로 $\overline{\mathrm{AO_3}}^2=25+36-2\times5\times6\times\dfrac35=25$, 즉 $\overline{\mathrm{AO_3}}=5$이고, 피타고라스 정리에 의해 $\overline{\mathrm{AP_3}}=4$이다.
        그러므로 점 $\mathrm{P_2}$에서 선분 $\mathrm{AP_3}$에 내린 수선의 발을 $\mathrm{H'}$이라 하면 $\dfrac12\times\overline{\mathrm{P_2H'}}\times4=2\sqrt{23}$이고, 따라서 $\overline{\mathrm{P_2H'}}=\sqrt{23}$이다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        이제, 삼수선의 정리에 따라 $\overline{\mathrm{O_2H'}}\perp\overline{\mathrm{AP_3}}$이므로 $\overline{\mathrm{O_2H'}}=\sqrt{\overline{\mathrm{O_2P_2}}^2+\overline{\mathrm{P_2H'}}^2}=\sqrt{4+23}=3\sqrt3$이다.
      criteria: [2.R1]
    - id: 2b-5
      content: |
        따라서 $S_2=\triangle\mathrm{P_3AO_2}=\dfrac12\times4\times3\sqrt3=6\sqrt3$이다. 그러므로 $\dfrac{S_2}{S_1}=\dfrac{6\sqrt3}{36}=\dfrac{\sqrt3}{6}$.
      criteria: [2.A2]
