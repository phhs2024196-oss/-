  $0<\alpha<\beta<1$이고, $f''(x)=0\iff\left(\dfrac{x-\alpha}{\beta-x}\right)^3=\left(\dfrac{\alpha}{\beta}\right)^n$; $f(x)>k$의 해는 $(\alpha,a)\cup(\beta,b)$이고 $a+b$를 근과 계수의 관계로 구해 $L_n=\dfrac{\alpha^n+\beta^n}{k}$.
