stimuli:
- label: 가
  body: |
    함수 $f(x)$에서 $x$의 값이 한없이 커질 때, $f(x)$의 값이 일정한 값 $L$에 한없이 가까워지면 함수 $f(x)$는 $L$에 수렴한다고 하고, 이것을 기호로 $\displaystyle\lim_{x\to\infty}f(x)=L$과 같이 나타낸다.
- label: 나
  body: |
    $n$이 자연수일 때, 다음 식이 성립한다.
    $$(a+b)^n={}_n\mathrm{C}_0a^n+{}_n\mathrm{C}_1a^{n-1}b+{}_n\mathrm{C}_2a^{n-2}b^2+\cdots+{}_n\mathrm{C}_ka^{n-k}b^k+\cdots+{}_n\mathrm{C}_nb^n$$
- label: 다
  body: |
    [그림 1]은 반지름이 같은 원 $O_1$과 $O_2$를 나타낸 것이다. 평행한 직선 $l_1$과 $l_2$는 각각 점 $A_1$, $A_2$에서 원 $O_1$, $O_2$에 접한다

    [그림: [그림 1] 왼쪽에 중심 $O_1$인 원, 오른쪽에 중심 $O_2$인 같은 크기의 원이 있다. 두 원 사이에 오른쪽 위로 기울어진 평행한 두 직선 $l_1$(왼쪽), $l_2$(오른쪽)가 그어져 있다. $l_1$은 왼쪽 원의 오른쪽 아래 점 $A_1$에서, $l_2$는 오른쪽 원의 왼쪽 위 점 $A_2$에서 접한다. 두 직선 모두 두 원 사이를 지난다.]
- label: 라
  body: |
    $(5+2x)^{60}$을 전개했을 때 $x^k$의 계수를 $a_k$라 하자. 즉,
    $$(5+2x)^{60}=a_0+a_1x+a_2x^2+\cdots+a_kx^k+\cdots+a_{60}x^{60}$$

stem: |
  제시문 1

subparts:
- id: '1'
  stem: |
    문제 1-1

    제시문 1의 (다)에서 직선 $l_1$과 $l_2$ 사이의 거리는 1로 일정하며, 두 원의 반지름은 $r$이고 $\overline{O_1O_2}=3r$이다.

    극한값 $\displaystyle\lim_{r\to\infty}\dfrac{\overline{A_1A_2}}{\overline{O_1O_2}}$를 구하고 풀이 과정을 쓰시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'sqrt(5)/3', equivalents: ['\dfrac{\sqrt5}{3}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 법선 방향으로 $\overline{O_1O_2}$를 나누면 법선 성분 $2r+1$, 직선 방향 성분 $\sqrt{5r^2-4r-1}$이고 $\overline{A_1A_2}^2=5r^2-4r$.
    steps:
    - {id: 1a, content: '$\overline{A_1A_2}=\sqrt{5r^2-4r}$, 극한 $\dfrac{\sqrt5}{3}$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $O_1A_1$, $O_2A_2$는 두 직선에 수직이고 서로 평행하다.
    - 직선에 수직인 방향으로 $O_1$에서 $O_2$까지 얼마나 이동하는가?
  - id: S1-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        접선은 접점에서 반지름에 수직이므로 $O_1A_1\perp l_1$, $O_2A_2\perp l_2$이고, $l_1\parallel l_2$이므로 $O_1A_1\parallel O_2A_2$이다. 두 직선에 수직인 방향을 법선 방향이라 하면 [그림 1]처럼 두 직선이 두 원 사이에 있을 때 $O_1$에서 $O_2$까지의 법선 방향 거리는 $r+1+r=2r+1$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\overline{O_1O_2}=3r$이므로 직선 방향 거리는 $\sqrt{9r^2-(2r+1)^2}=\sqrt{5r^2-4r-1}$이다. $A_1$과 $A_2$는 직선 방향으로 $\sqrt{5r^2-4r-1}$, 법선 방향으로 $1$ 떨어져 있으므로
        $$\overline{A_1A_2}^2=(5r^2-4r-1)+1=5r^2-4r.$$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        제시문 (가)에 따라
        $$\lim_{r\to\infty}\dfrac{\overline{A_1A_2}}{\overline{O_1O_2}}=\lim_{r\to\infty}\dfrac{\sqrt{5r^2-4r}}{3r}=\lim_{r\to\infty}\dfrac{\sqrt{5-\frac4r}}{3}=\dfrac{\sqrt5}{3}.$$
      criteria: ['1.A1']
  # 채점표: 공식 채점기준 미확보로 입력자가 설계(공식 아님) — tags: 공식해설미확보
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        반지름과 접선의 수직을 근거로 두 중심의 법선 방향 거리가 $2r+1$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        $\overline{A_1A_2}=\sqrt{5r^2-4r}$ 또는 동치식을 구했다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        극한값 $\dfrac{\sqrt5}{3}$을 구했다.
      depends_on: [1.M2]
      steps: [1b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '2'
  stem: |
    문제 1-2

    제시문 1의 (라)에서 계수 $a_k\ (0\le k\le60)$ 중 가장 큰 것을 $a_p$, 두 번째로 큰 것을 $a_q$라 하자. $p$와 $q$를 구하고 풀이 과정을 쓰시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '(17, 16)', equivalents: ['p=17, q=16'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{a_{k+1}}{a_k}=\dfrac{2(60-k)}{5(k+1)}>1\iff k\le16$이므로 $a_{17}$이 최대이고, 두 번째 후보 $a_{16}$, $a_{18}$을 비교한다.
    steps:
    - {id: 2a, content: '$p=17$, $\dfrac{a_{18}}{a_{16}}=\dfrac{88}{85}\cdot\dfrac{43}{45}<1$이므로 $q=16$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - 이웃한 두 계수의 비를 계산해 보자.
    - 가장 큰 계수 바로 양옆의 두 계수 중 어느 것이 더 큰가?
  - id: S2-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        제시문 (나)에 의해 $a_k={}_{60}\mathrm{C}_k\,5^{60-k}2^k\ (0\le k\le60)$이다. $0\le k\le59$에서
        $$\dfrac{a_{k+1}}{a_k}=\dfrac{{}_{60}\mathrm{C}_{k+1}}{{}_{60}\mathrm{C}_k}\cdot\dfrac25=\dfrac{2(60-k)}{5(k+1)}.$$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\dfrac{a_{k+1}}{a_k}>1\iff 120-2k>5k+5\iff k<\dfrac{115}{7}=16.4\cdots$ 이고 비가 $1$이 되는 정수 $k$는 없다. 따라서
        $$a_0<a_1<\cdots<a_{16}<a_{17},\qquad a_{17}>a_{18}>\cdots>a_{60}$$
        이므로 가장 큰 계수는 $a_{17}$, 즉 $p=17$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        두 번째로 큰 계수는 $a_{16}$ 또는 $a_{18}$이다.
        $$\dfrac{a_{17}}{a_{16}}=\dfrac{2\cdot44}{5\cdot17}=\dfrac{88}{85},\qquad \dfrac{a_{18}}{a_{17}}=\dfrac{2\cdot43}{5\cdot18}=\dfrac{43}{45}$$
        이므로 $\dfrac{a_{18}}{a_{16}}=\dfrac{88}{85}\cdot\dfrac{43}{45}=\dfrac{3784}{3825}<1$, 즉 $a_{16}>a_{18}$이다. 따라서 $q=16$이다.
      criteria: ['2.M2', '2.A2']
  # 채점표: 공식 채점기준 미확보로 입력자가 설계(공식 아님) — tags: 공식해설미확보
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $a_k={}_{60}\mathrm{C}_k5^{60-k}2^k$와 이웃 계수의 비 $\dfrac{2(60-k)}{5(k+1)}$(또는 동치인 대소 비교식)를 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        비와 $1$의 대소로 증가·감소 구간을 밝히고 $p=17$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        두 번째로 큰 계수의 후보가 $a_{16}$, $a_{18}$뿐임을 밝히고 둘을 비교하는 식을 세웠다.
      depends_on: [2.A1]
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $a_{16}>a_{18}$을 보이고 $q=16$을 구했다.
      depends_on: [2.M2]
      steps: [2b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}

