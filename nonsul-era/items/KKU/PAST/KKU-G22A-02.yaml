stimuli:
- label: 가
  body: |
    점 $(x_1,y_1)$을 지나고 기울기가 $m$인 직선의 방정식은 $y-y_1=m(x-x_1)$이다.
- label: 나
  body: |
    다음 그림에서 동경 $OP$가 나타내는 각의 크기를 $\theta$라고 할 때, $\sin\theta=\dfrac{y}{r}$, $\cos\theta=\dfrac{x}{r}$, $\tan\theta=\dfrac{y}{x}\ (x\ne0)$ 이다.

    [그림: 원점 $O$를 중심으로 하고 반지름이 $r$인 원과 좌표축($x$축 위 $-r$, $r$, $y$축 위 $r$, $-r$ 표시). 제2사분면의 원 위 점 $P$에서 $x$축과 $y$축에 수선(점선)이 그어져 있고 그 발이 각각 $x$, $y$로 표시되어 있다. 동경 $OP$(화살표)와 $x$축의 양의 방향이 이루는 각 $\theta$가 호로 표시되어 있다.]
- label: 다
  body: |
    [그림 2]는 곡선 $y=x^2$과 점 $(-1,0)$을 지나는 직선 $l$을 나타낸 것이다. 곡선 $y=x^2$과 직선 $l$은 두 점 $A$와 $B$에서 만난다. 점 $O$는 원점이다.

    [그림: [그림 2] 포물선 $y=x^2$과 $x$축 위 점 $-1$을 지나 오른쪽 위로 올라가는 직선 $l$. 직선과 포물선의 교점 중 $y$축 왼쪽(제2사분면)의 점이 $A$, 오른쪽(제1사분면)의 점이 $B$이다. 원점 $O$ 표시.]
- label: 라
  body: |
    [그림 3]은 반지름이 2인 원과 그 원에 내접하는 사각형 $CDEF$를 나타낸 것이다. 대각선 $CE$와 $DF$의 교점이 $P$이다.

    [그림: [그림 3] 원 위에 왼쪽부터 $C$(왼쪽 위), $D$(왼쪽 아래), $E$(오른쪽 위), $F$(위쪽) 순의 점이 있고, 사각형 $CDEF$의 변 $CD$, $DE$, $EF$, $FC$와 대각선 $CE$, $DF$가 그어져 있다. 두 대각선의 교점 $P$는 원 안쪽 위쪽에 있다.]

stem: |
  제시문 2

subparts:
- id: '1'
  stem: |
    문제 2-1

    제시문 2의 (다)에서 직선 $l$의 기울기가 $t$일 때 $\angle AOB$의 크기를 $\theta(t)$라 하자. 미분계수 $\theta^{\prime}(2)$의 값을 구하고 풀이 과정을 쓰시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-4*sqrt(3)/39', equivalents: ['-\dfrac{4\sqrt3}{39}', '-\dfrac{4}{13\sqrt3}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x_1+x_2=t$, $x_1x_2=-t$에서 $\tan\theta=\dfrac{\sqrt{t^2+4t}}{t-1}$, 양변을 미분해 $t=2$ 대입($\sec^2\theta=13$).
    steps:
    - {id: 1a, content: '$13\,\theta^{\prime}(2)=-\dfrac{4}{\sqrt3}$, $\theta^{\prime}(2)=-\dfrac{4\sqrt3}{39}$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 두 교점의 $x$좌표 $x_1$, $x_2$는 어떤 이차방정식의 근인가?
    - 동경 $OA$, $OB$의 탄젠트는 각각 무엇인가?
    - $\theta(t)$ 대신 $\tan\theta(t)$를 $t$에 대해 미분해 보자.
  - id: S1-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        제시문 (가)에 의해 $l:\ y=t(x+1)$이다. $x^2=t(x+1)$, 즉 $x^2-tx-t=0$의 두 근을 $x_1<x_2$라 하면 $A(x_1,x_1^2)$, $B(x_2,x_2^2)$이고
        $$x_1+x_2=t,\quad x_1x_2=-t,\quad x_2-x_1=\sqrt{t^2+4t}.$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        동경 $OB$, $OA$가 나타내는 각을 각각 $\alpha$, $\beta$라 하면 제시문 (나)에 의해 $\tan\alpha=\dfrac{x_2^2}{x_2}=x_2$, $\tan\beta=x_1$이고 $\theta=\beta-\alpha$이다. 탄젠트의 덧셈정리에 의해
        $$\tan\theta=\dfrac{\tan\beta-\tan\alpha}{1+\tan\alpha\tan\beta}=\dfrac{x_1-x_2}{1+x_1x_2}=\dfrac{\sqrt{t^2+4t}}{t-1}.$$
        $t=2$ 근방($t>1$)에서 $\overrightarrow{OA}\cdot\overrightarrow{OB}=x_1x_2+x_1^2x_2^2=t^2-t>0$이므로 $\theta$는 예각이고 위 식이 성립한다. $t=2$일 때 $\tan\theta=\sqrt{12}=2\sqrt3$.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        양변을 $t$에 대해 미분하면 $g(t)=\sqrt{t^2+4t}$에 대해
        $$\sec^2\theta\cdot\theta^{\prime}(t)=\dfrac{g^{\prime}(t)(t-1)-g(t)}{(t-1)^2},\quad g^{\prime}(t)=\dfrac{t+2}{\sqrt{t^2+4t}}.$$
        $t=2$에서 $\sec^2\theta=1+\tan^2\theta=13$, $g(2)=2\sqrt3$, $g^{\prime}(2)=\dfrac{2}{\sqrt3}$이므로
        $$13\,\theta^{\prime}(2)=\dfrac{2}{\sqrt3}-2\sqrt3=-\dfrac{4}{\sqrt3},\qquad \theta^{\prime}(2)=-\dfrac{4\sqrt3}{39}.$$
      criteria: ['1.A1']
  # 채점표: 공식 채점기준 미확보로 입력자가 설계(공식 아님) — tags: 공식해설미확보
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        직선 $y=t(x+1)$과 $x^2-tx-t=0$, 근과 계수의 관계(또는 두 근의 식)를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        덧셈정리 등으로 $\tan\theta(t)=\dfrac{\sqrt{t^2+4t}}{t-1}$(또는 동치인 $\theta(t)$의 식)를 구했다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        미분하여 $\theta^{\prime}(2)=-\dfrac{4\sqrt3}{39}$을 구했다.
      depends_on: [1.M2]
      steps: [1b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '2'
  stem: |
    문제 2-2

    제시문 2의 (라)에서 $\angle CPD=\dfrac{\pi}{3}$일 때 $\overline{CD}+\overline{EF}$의 값 중 가장 큰 것을 구하고 풀이 과정을 쓰시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 외각으로 $\angle CED+\angle FDE=\dfrac{\pi}{3}$, 사인법칙으로 $\overline{CD}+\overline{EF}=4(\sin a+\sin b)=4\sin\left(a+\dfrac{\pi}{3}\right)\le4$.
    steps:
    - {id: 2a, content: '$a=b=\dfrac{\pi}{6}$일 때 최댓값 $4$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 삼각형 $PDE$에서 $\angle CPD$는 어떤 두 각의 합인가?
    - 그 두 각은 각각 어떤 현에 대한 원주각인가?
  - id: S2-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a=\angle CED$, $b=\angle FDE$라 하자. 삼각형 $PDE$에서 $\angle CPD$는 꼭짓점 $P$의 외각이므로
        $$\angle CPD=\angle PED+\angle PDE=a+b=\dfrac{\pi}{3}.$$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $a$는 현 $CD$에 대한 원주각, $b$는 현 $EF$에 대한 원주각이므로 삼각형 $CDE$, $DEF$에 사인법칙(외접원 반지름 2)을 쓰면
        $$\overline{CD}=4\sin a,\qquad \overline{EF}=4\sin b.$$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $b=\dfrac{\pi}{3}-a\ \left(0<a<\dfrac{\pi}{3}\right)$이므로 덧셈정리에 의해
        $$\overline{CD}+\overline{EF}=4\left\{\sin a+\sin\left(\dfrac{\pi}{3}-a\right)\right\}=4\left(\dfrac12\sin a+\dfrac{\sqrt3}{2}\cos a\right)=4\sin\left(a+\dfrac{\pi}{3}\right)\le4.$$
        등호는 $a=\dfrac{\pi}{6}$($\overline{CD}=\overline{EF}=2$)일 때 성립하고 이때 사각형 $CDEF$가 실제로 존재하므로 가장 큰 값은 $4$이다.
      criteria: ['2.A1']
  # 채점표: 공식 채점기준 미확보로 입력자가 설계(공식 아님) — tags: 공식해설미확보
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $\angle CPD$를 두 원주각의 합(또는 호 $CD$, $EF$에 대한 중심각 합 $\dfrac{2\pi}{3}$)으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        사인법칙(또는 중심각)으로 $\overline{CD}$, $\overline{EF}$를 각의 사인으로 나타냈다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        합을 한 각의 함수로 정리하여 최댓값 $4$와 그때의 조건을 밝혔다.
      depends_on: [2.M2]
      steps: [2b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}

