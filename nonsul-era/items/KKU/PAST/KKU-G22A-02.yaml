intent: |
  (공식 출제의도 미확보, 입력자 요지) 직선과 포물선의 교점, 삼각함수의 정의와 덧셈정리로 각의 크기를 매개변수의 함수로 나타내 미분계수를 구하고, 원에 내접하는 사각형에서 원주각과 사인법칙을 이용해 길이의 합의 최댓값을 구하는 능력을 본다.
key_idea: |
  2-1: $\tan\theta=\dfrac{x_1-x_2}{1+x_1x_2}=\dfrac{\sqrt{t^2+4t}}{t-1}$을 $t$에 대해 미분($\sec^2\theta\cdot\theta'$). 2-2: $\angle CPD=\angle CED+\angle FDE$, $\overline{CD}+\overline{EF}=4(\sin a+\sin b)$, $a+b=\dfrac{\pi}{3}$.
stuck: |
  2-1: $\theta(t)$를 직접 쓰지 않고 $\tan\theta(t)$를 $t$의 식으로 나타낸 뒤 양변을 미분하는 발상. 2-2: 대각선이 이루는 각을 두 원주각의 합으로 바꾸는 것.
