stuck: |
  1-1: 두 외접원의 중심이 $BD$의 서로 반대쪽에 있을 때 중심 거리가 최대임을 보는 것. 1-2: $\cos\dfrac{n\pi}{2}$의 주기 4로 넓이를 네 경우로 나누어 계산하는 것.
