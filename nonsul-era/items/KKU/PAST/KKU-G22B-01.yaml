      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        두 중심이 $BD$의 수직이등분선 위에 있음과 중심 거리의 최댓값 $\sqrt3+2\sqrt2$를 밝혔다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\overline{PQ}\le R_1+\overline{O_1O_2}+R_2$와 등호 조건을 밝히고 $5+\sqrt3+2\sqrt2$를 구했다.
      depends_on: [1.M2]
      steps: [1b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '2'
  stem: |
    문제 1-2

    제시문 1의 (라)에 주어진 점들에 대하여 삼각형 $BA_{n-1}A_n$의 넓이가 $a_n$일 때 $\displaystyle\sum_{n=1}^{100}a_n^2$을 구하고 풀이 과정을 쓰시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '83300', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 네 경우 모두 $a_n=2k+1\ (n=4k+1,\dots,4k+4)$이므로 $\sum a_n^2=4\sum_{k=1}^{25}(2k-1)^2$.
    steps:
    - {id: 2a, content: '$4\cdot\dfrac{25\cdot49\cdot51}{3}=83300$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $\cos\dfrac{n\pi}{2}$는 $n$에 따라 어떤 값을 반복하는가?
    - $n=1,2,3,4,5,\dots$에 대해 넓이를 몇 개 계산해 규칙을 찾아보자.
  - id: S2-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\cos\dfrac{n\pi}{2}$는 $n=4k,4k+1,4k+2,4k+3$일 때 각각 $1,0,-1,0$이다. 세 점 $B(0,-1)$, $A_{n-1}(n-1,y_{n-1})$, $A_n(n,y_n)$에 대해
        $$a_n=\dfrac12\left\lvert(n-1)(y_n+1)-n(y_{n-1}+1)\right\rvert.$$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $k\ (0\le k\le24)$에 대해
        - $n=4k+1$: $\dfrac12\lvert4k\cdot1-(4k+1)\cdot2\rvert=2k+1$
        - $n=4k+2$: $\dfrac12\lvert(4k+1)\cdot0-(4k+2)\cdot1\rvert=2k+1$
        - $n=4k+3$: $\dfrac12\lvert(4k+2)\cdot1-(4k+3)\cdot0\rvert=2k+1$
        - $n=4k+4$: $\dfrac12\lvert(4k+3)\cdot2-(4k+4)\cdot1\rvert=2k+1$

        즉 $a_{4k+1}=a_{4k+2}=a_{4k+3}=a_{4k+4}=2k+1$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        제시문 (나)의 기호로
        $$\sum_{n=1}^{100}a_n^2=4\sum_{k=0}^{24}(2k+1)^2=4\sum_{m=1}^{25}(4m^2-4m+1)=4\left(4\cdot\dfrac{25\cdot26\cdot51}{6}-4\cdot\dfrac{25\cdot26}{2}+25\right)=4\cdot20825=83300.$$
      criteria: ['2.A2']
