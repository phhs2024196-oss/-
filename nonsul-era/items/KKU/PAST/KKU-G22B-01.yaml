  (공식 출제의도 미확보, 입력자 요지) 사인법칙으로 외접원의 반지름을 구해 두 원 위의 점 사이 거리의 최댓값을 구하고, 좌표로 주어진 점들로 만든 삼각형의 넓이를 규칙적으로 나타내 수열의 합을 구하는 능력을 본다.
