stimuli:
- label: 가
  body: |
    사인법칙과 코사인법칙을 활용하여 삼각형을 포함한 여러 가지 도형의 문제를 해결할 수 있다.
- label: 나
  body: |
    수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합 $a_1+a_2+a_3+\cdots+a_n$을 기호 $\sum$를 사용하여 $\displaystyle\sum_{k=1}^{n}a_k$와 같이 나타낼 수 있다.

    즉, $a_1+a_2+a_3+\cdots+a_n=\displaystyle\sum_{k=1}^{n}a_k$ 이다.
- label: 다
  body: |
    [그림 1]에서 점 $P$는 삼각형 $ABD$의 외접원 위에 있고 점 $Q$는 삼각형 $BCD$의 외접원 위에 있다.

    [그림: [그림 1] 두 원이 두 점 $D$(위), $B$(아래)에서 만난다. 왼쪽의 작은 원 위에 $A$(왼쪽), $P$(아래쪽)가, 오른쪽의 큰 원 위에 $C$(오른쪽), $Q$(위쪽)가 있다. 선분 $AD$, $AB$, $BD$, $DC$, $BC$가 그어져 있어 삼각형 $ABD$와 $BCD$가 $BD$를 공유하며 $A$와 $C$는 $BD$의 서로 반대쪽에 있다.]
- label: 라
  body: |
    [그림 2]는 점 $A_0,A_1,A_2,\dots,A_{100},B$를 나타낸 것이다. 점 $A_n$의 좌표는 $\left(n,\cos\dfrac{n\pi}{2}\right)$이고 점 $B$의 좌표는 $(0,-1)$이다.

    [그림: [그림 2] 좌표평면에 $A_0(0,1)$, $A_1$, $A_2$(아래), $A_3$, $A_4$(위), $A_5$, $A_6$(아래), $\cdots$, $A_{98}$(아래), $A_{99}$, $A_{100}$(위)이 차례로 선분으로 이어진 지그재그 꺾은선이 있고 $A_{\text{홀수}}$는 $x$축 위에 있다. $y$축 위에 점 $B$가 원점 $O$ 아래에 표시되어 있다.]

stem: |
  제시문 1

subparts:
- id: '1'
  stem: |
    문제 1-1

    제시문 1의 (다)에서 $\overline{BD}=2$, $\sin\angle BAD=\dfrac12$, $\sin\angle BCD=\dfrac13$일 때 $\overline{PQ}$의 값 중 가장 큰 것을 구하고 풀이 과정을 쓰시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '5 + sqrt(3) + 2*sqrt(2)', equivalents: ['5+\sqrt3+2\sqrt2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 사인법칙으로 $R_1=2$, $R_2=3$. 중심 거리 최대 $\sqrt3+2\sqrt2$, $\overline{PQ}\le R_1+\overline{O_1O_2}+R_2$.
    steps:
    - {id: 1a, content: '$\overline{PQ}_{\max}=5+\sqrt3+2\sqrt2$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 사인법칙으로 두 외접원의 반지름을 구해 보자.
    - 두 외접원의 중심은 어떤 직선 위에 있는가?
    - 두 원 위의 두 점 사이 거리는 언제 가장 큰가?
  - id: S1-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각형 $ABD$, $BCD$의 외접원의 중심과 반지름을 $O_1,R_1$, $O_2,R_2$라 하자. 사인법칙에 의해
        $$2R_1=\dfrac{\overline{BD}}{\sin\angle BAD}=4,\qquad 2R_2=\dfrac{\overline{BD}}{\sin\angle BCD}=6$$
        이므로 $R_1=2$, $R_2=3$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        두 원 모두 현 $BD$를 가지므로 $O_1$, $O_2$는 $BD$의 수직이등분선 위에 있고, $BD$의 중점 $M$에 대해
        $$\overline{O_1M}=\sqrt{2^2-1^2}=\sqrt3,\qquad \overline{O_2M}=\sqrt{3^2-1^2}=2\sqrt2.$$
        따라서 $\overline{O_1O_2}\le\sqrt3+2\sqrt2$이고, 등호는 두 중심이 $BD$의 서로 반대쪽에 있을 때(예: [그림 1]처럼 $A$, $C$가 $BD$의 반대쪽에 있고 $\angle BAD$, $\angle BCD$가 모두 예각일 때) 성립한다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        삼각형의 성질에 의해
        $$\overline{PQ}\le\overline{PO_1}+\overline{O_1O_2}+\overline{O_2Q}\le2+(\sqrt3+2\sqrt2)+3$$
        이고, 직선 $O_1O_2$와 두 원의 교점 중 서로 가장 먼 두 점을 $P$, $Q$로 잡으면 등호가 성립한다. 따라서 가장 큰 값은 $5+\sqrt3+2\sqrt2$이다.
      criteria: ['1.A1']
  # 채점표: 공식 채점기준 미확보로 입력자가 설계(공식 아님) — tags: 공식해설미확보
