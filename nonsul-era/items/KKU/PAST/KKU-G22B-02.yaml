stimuli:
- label: 가
  body: |
    일반적으로 함수 $y=f(x)$가 정의역에 속하는 모든 $x$에서 미분가능할 때, 정의역의 각 원소 $x$에 미분계수 $f^{\prime}(x)$를 대응시키면 새로운 함수를 얻는다. 이 함수를 함수 $y=f(x)$의 도함수라 한다.
- label: 나
  body: |
    다음은 사인함수와 코사인 함수의 덧셈정리이다.
    $$\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$$
    $$\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$$
- label: 다
  body: |
    [그림 3]은 곡선 $y=x^2$과 점 $A(0,3)$을 나타낸 것이다. 두 점 $B$와 $C$는 이 곡선 위의 점이고 직선 $BC$는 $x$축에 평행하다. 색칠한 도형은 직선 $BC$와 곡선 $y=x^2$으로 둘러싸인 도형이다.

    [그림: [그림 3] 포물선 $y=x^2$과 $y$축 위의 점 $A$. 포물선 위의 점 $B$(왼쪽)와 $C$(오른쪽)는 같은 높이에 있고 $A$보다 아래에 있다. 선분 $AB$, $AC$, $BC$가 그어져 있고, 선분 $BC$와 포물선 사이(원점 $O$ 포함 아래쪽)가 색칠되어 있다.]
- label: 라
  body: |
    [그림 4]는 중심이 원점 $O$이고 반지름이 2인 원을 나타낸 것이다. 원 위에 점 $A(-\sqrt2,\sqrt2)$와 $B(\sqrt2,\sqrt2)$가 있다. 원 밖의 점 $P$에 대하여 선분 $AP$와 원의 교점이 $C$, 선분 $BP$와 원의 교점이 $D$이다.

    [그림: [그림 4] 원점 중심의 원 위 왼쪽 위에 $A$, 오른쪽 위에 $B$가 있고 선분 $AB$가 그어져 있다. 원 밖 오른쪽 아래에 점 $P$가 있다. 선분 $AP$는 원점 근처를 지나 원의 오른쪽 아래 점 $C$에서 원과 만나고, 선분 $BP$는 원의 오른쪽 점 $D$($x$축 근처)에서 원과 만난다. 선분 $CD$도 그어져 있다.]

stem: |
  제시문 2

subparts:
- id: '1'
  stem: |
    문제 2-1

    제시문 2의 (다)에서 $\angle BAC$의 크기가 $\theta$일 때 색칠한 도형의 넓이를 $S(\theta)$라 하자. $\overline{BC}=2$일 때 $\dfrac{dS}{d\theta}$의 값을 구하고 풀이 과정을 쓰시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '5/2', equivalents: ['\dfrac52', '2.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S=\dfrac43s^3$, $\tan\dfrac{\theta}{2}=\dfrac{s}{3-s^2}$. $s=1$에서 $\dfrac{dS}{ds}=4$, $\dfrac{d\theta}{ds}=\dfrac85$.
    steps:
    - {id: 1a, content: '$\dfrac{dS}{d\theta}=\dfrac{4}{8/5}=\dfrac52$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $C(s,s^2)$로 두고 넓이와 각을 모두 $s$로 나타내 보자.
    - $\dfrac{\theta}{2}=\angle OAC$의 탄젠트는?
  - id: S1-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $C(s,s^2)$, $B(-s,s^2)$ $(0<s<\sqrt3)$이라 하면
        $$S=\int_{-s}^{s}(s^2-x^2)\,dx=\dfrac43s^3,\qquad \dfrac{dS}{ds}=4s^2.$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $y$축은 $\angle BAC$를 이등분하므로 $\angle OAC=\dfrac{\theta}{2}$이고 $\tan\dfrac{\theta}{2}=\dfrac{s}{3-s^2}$이다. 양변을 $s$에 대해 미분하면
        $$\dfrac12\sec^2\dfrac{\theta}{2}\cdot\dfrac{d\theta}{ds}=\dfrac{(3-s^2)+2s^2}{(3-s^2)^2}=\dfrac{3+s^2}{(3-s^2)^2}.$$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\overline{BC}=2s=2$에서 $s=1$이고 $\tan\dfrac{\theta}{2}=\dfrac12$, $\sec^2\dfrac{\theta}{2}=\dfrac54$이므로 $\dfrac58\cdot\dfrac{d\theta}{ds}=1$, $\dfrac{d\theta}{ds}=\dfrac85$. 따라서
        $$\dfrac{dS}{d\theta}=\dfrac{dS/ds}{d\theta/ds}=\dfrac{4}{8/5}=\dfrac52.$$
      criteria: ['1.A1']
  # 채점표: 공식 채점기준 미확보로 입력자가 설계(공식 아님) — tags: 공식해설미확보
