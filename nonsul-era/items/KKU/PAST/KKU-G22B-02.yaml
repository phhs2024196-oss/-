      evidence: |
        원주각·외각으로 $\angle APB=\dfrac{\pi}{12}$(일정)를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        사인법칙으로 $\overline{AP}=\dfrac{2\sqrt2\sin\angle ABP}{\sin\frac{\pi}{12}}$를 세우고 $\sin\dfrac{\pi}{12}$를 덧셈정리로 구했다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\angle ABP=\dfrac{\pi}{2}$일 때 최대이고 그 배치가 가능함을 밝혀 $4+4\sqrt3$을 구했다.
      depends_on: [2.M2]
      steps: [2b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}

