    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        넓이를 매개변수로 $S=\dfrac43s^3$(또는 동치)로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        $\theta$와 $s$의 관계식($\tan\dfrac{\theta}{2}=\dfrac{s}{3-s^2}$ 등)을 세우고 미분했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $s=1$에서 $\dfrac{dS}{d\theta}=\dfrac52$를 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '2'
  stem: |
    문제 2-2

    제시문 2의 (라)에서 $\overline{CD}=2$일 때 $\overline{AP}$의 값 중 가장 큰 것을 구하고 풀이 과정을 쓰시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '4 + 4*sqrt(3)', equivalents: ['4+4\sqrt3', '4(\sqrt3+1)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\angle APB=\dfrac{\pi}{12}$로 일정, 사인법칙 $\overline{AP}=\dfrac{2\sqrt2\sin\angle ABP}{\sin\frac{\pi}{12}}\le4+4\sqrt3$.
    steps:
    - {id: 2a, content: '$\angle ABP=\dfrac{\pi}{2}$일 때 최댓값 $4+4\sqrt3$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 중심각 $\angle AOB$, $\angle COD$는 각각 얼마인가?
    - 삼각형 $ADP$에서 $\angle ADB$는 어떤 두 각의 합인가?
    - 삼각형 $ABP$에서 사인법칙을 써 보자.
  - id: S2-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\overline{AB}=2\sqrt2$이므로 $\angle AOB=\dfrac{\pi}{2}$, $\overline{CD}=2$이므로 삼각형 $OCD$는 정삼각형이고 $\angle COD=\dfrac{\pi}{3}$이다. [그림 4]처럼 $P$가 직선 $AB$ 아래쪽에 있을 때 원주각에 의해 $\angle ADB=\dfrac{\pi}{4}$, $\angle CAD=\dfrac{\pi}{6}$이고, 삼각형 $ADP$에서 $\angle ADB$는 외각이므로
        $$\angle APB=\angle ADB-\angle DAP=\dfrac{\pi}{4}-\dfrac{\pi}{6}=\dfrac{\pi}{12}.$$
        ($C$, $D$가 짧은 호 $AB$ 위에 있도록 $P$가 위쪽에 놓이면 $\angle APB=\dfrac{7\pi}{12}$이고 이때 $\overline{AP}\le\dfrac{2\sqrt2}{\sin\frac{7\pi}{12}}<4$이므로 최댓값에 영향이 없다.)
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        삼각형 $ABP$에서 사인법칙에 의해
        $$\overline{AP}=\dfrac{\overline{AB}\sin\angle ABP}{\sin\angle APB}\le\dfrac{2\sqrt2}{\sin\frac{\pi}{12}},$$
        제시문 (나)에 의해 $\sin\dfrac{\pi}{12}=\sin\left(\dfrac{\pi}{4}-\dfrac{\pi}{6}\right)=\dfrac{\sqrt2}{2}\cdot\dfrac{\sqrt3}{2}-\dfrac{\sqrt2}{2}\cdot\dfrac12=\dfrac{\sqrt6-\sqrt2}{4}$.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $$\dfrac{2\sqrt2}{\sin\frac{\pi}{12}}=\dfrac{8\sqrt2}{\sqrt6-\sqrt2}=\dfrac{8\sqrt2(\sqrt6+\sqrt2)}{4}=4\sqrt3+4.$$
        등호는 $\angle ABP=\dfrac{\pi}{2}$, 즉 $P$가 $B$의 바로 아래에 있어 $D(\sqrt2,-\sqrt2)$이고 $C$가 $D$에서 시계 방향으로 중심각 $\dfrac{\pi}{3}$만큼 떨어진 점일 때 성립하며, 이때 $C$는 선분 $AP$ 위, $D$는 선분 $BP$ 위에 있고 $P$는 원 밖에 있다. 따라서 가장 큰 값은 $4+4\sqrt3$이다.
      criteria: ['2.A1']
  # 채점표: 공식 채점기준 미확보로 입력자가 설계(공식 아님) — tags: 공식해설미확보
