stimuli:
- label: 가
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능하고 $x=a$에서 극값을 가지면 $f^{\prime}(a)=0$이다.
- label: 나
  body: |
    그림에서 점 $\mathrm{A}$는 원 $x^2+6x+y^2-8y=0$과 원 $x^2-2x+y^2=0$의 교점이다. 점 $\mathrm{A}$를 지나는 직선이 두 원과 만나는 점이 각각 $\mathrm{X},\mathrm{Y}$이다. (단, $\mathrm{X},\mathrm{Y}$는 $\mathrm{A}$가 아닌 점이다.)

    [그림: 큰 원과 그 오른쪽 아래에 걸친 작은 원이 두 점에서 만난다(좌표축은 그려져 있지 않음). 두 교점 중 아래쪽 교점이 A이다. A를 지나는 직선이 그어져 큰 원과 왼쪽 위의 점 X에서, 작은 원과 오른쪽 아래의 점 Y에서 만나며, X와 Y는 A의 양쪽에 있다.]

stem: |
  [문제 1] (나)에서 $\overline{\mathrm{XY}}$의 최댓값을 구하고 풀이 과정을 쓰시오. [10점]

subparts:
- id: '1'
  stem: |
    (나)에서 $\overline{\mathrm{XY}}$의 최댓값을 구하고 풀이 과정을 쓰시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '8*sqrt(2)', equivalents: ['8\sqrt{2}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: A는 원점. 방향각 $\theta$로 $\overline{\mathrm{XY}}=\lvert8\sin\theta-8\cos\theta\rvert$, 미분해 최댓값 $8\sqrt2$.
    steps:
    - {id: 1a, content: '$s_{\mathrm X}=8\sin\theta-6\cos\theta$, $s_{\mathrm Y}=2\cos\theta$, $\overline{\mathrm{XY}}=8\lvert\sin\theta-\cos\theta\rvert\le8\sqrt2$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 두 원의 방정식을 빼서 교점을 구해 보자.
    - A를 지나는 직선 위의 점을 $(s\cos\theta,\,s\sin\theta)$로 놓아 보자.
  - id: S1-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 식을 빼면 $8x-8y=0$, 즉 $y=x$이고 $x^2-2x+x^2=0$에서 $x=0$ 또는 $x=1$이다. 그림에서 A는 아래쪽 교점이므로 $\mathrm{A}(0,0)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        A를 지나는 직선 위의 점을 $(s\cos\theta,\,s\sin\theta)$ $(0\le\theta<\pi)$로 놓는다. 첫째 원에 대입하면 $s^2+s(6\cos\theta-8\sin\theta)=0$이므로 $\mathrm X$는 $s_{\mathrm X}=8\sin\theta-6\cos\theta$, 둘째 원에 대입하면 $s^2-2s\cos\theta=0$이므로 $\mathrm Y$는 $s_{\mathrm Y}=2\cos\theta$에 대응한다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\overline{\mathrm{XY}}=\lvert s_{\mathrm X}-s_{\mathrm Y}\rvert=\lvert f(\theta)\rvert$, $f(\theta)=8\sin\theta-8\cos\theta$. 제시문 (가)에 의해 극값에서 $f^{\prime}(\theta)=8\cos\theta+8\sin\theta=0$, 즉 $\theta=\dfrac{3\pi}{4}$이고 $f\!\left(\dfrac{3\pi}{4}\right)=8\sqrt2$. 구간 끝 $f(0)=-8$이므로 $\lvert f(\theta)\rvert$의 최댓값은 $8\sqrt2$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        이때 $s_{\mathrm X}=7\sqrt2\ne0$, $s_{\mathrm Y}=-\sqrt2\ne0$이므로 X, Y는 A가 아닌 점이다. 따라서 $\overline{\mathrm{XY}}$의 최댓값은 $8\sqrt2$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 1c-1
      content: |
        중심 $\mathrm{O_1}(-3,4)$, $\mathrm{O_2}(1,0)$에서 직선에 내린 수선의 발을 $\mathrm{H_1}$, $\mathrm{H_2}$라 하면 $\mathrm{H_1}$, $\mathrm{H_2}$는 각각 현 $\mathrm{AX}$, $\mathrm{AY}$의 중점이므로 $\overline{\mathrm{XY}}=2\overline{\mathrm{H_1H_2}}\le2\overline{\mathrm{O_1O_2}}=8\sqrt2$. 직선이 $\mathrm{O_1O_2}$와 평행할 때 등호.
      criteria: ['1.M2', '1.A1']
  rubric:
    # 채점표는 자체 설계(공식 채점기준 미확보)
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 두 원의 교점을 구해 $\mathrm{A}(0,0)$을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 직선의 방향(각 또는 기울기)을 변수로 하여 $\overline{\mathrm{AX}}$, $\overline{\mathrm{AY}}$ 또는 $\overline{\mathrm{XY}}$를 식으로 나타냈다($\lvert8\sin\theta-8\cos\theta\rvert$ 또는 동치).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 미분(또는 삼각함수 합성·기하적 근거)으로 최댓값 $8\sqrt2$를 구하고 X, Y가 A가 아님을 확인했다.
      depends_on: [1.M2]
      steps: [1b-3, 1b-4, 1c-1]
    deductions:
    - code: D1-1
      condition: 사소한 계산 실수
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}

