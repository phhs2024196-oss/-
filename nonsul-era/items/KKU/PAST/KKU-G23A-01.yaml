intent: |
  (자체 추정, 공식 출제의도 미확보) 원의 방정식과 두 원의 교점을 구하고, 점 A를 지나는 직선의 방향을 매개변수로 하여 현의 길이를 함수로 나타낸 뒤 미분을 이용해 최댓값을 구할 수 있는지 알아본다.
key_idea: |
  두 원의 교점은 $\mathrm{A}(0,0)$이다. 방향각 $\theta$인 직선 위의 점 $(s\cos\theta,s\sin\theta)$을 두 원에 대입하면 $s_{\mathrm X}=8\sin\theta-6\cos\theta$, $s_{\mathrm Y}=2\cos\theta$이므로 $\overline{\mathrm{XY}}=\lvert 8\sin\theta-8\cos\theta\rvert$이고 최댓값은 $8\sqrt2$이다.
stuck: |
  점 A가 원점임을 확인하고, 직선의 방향각으로 두 교점까지의 (부호 있는) 거리를 한 변수 함수로 나타내는 단계
