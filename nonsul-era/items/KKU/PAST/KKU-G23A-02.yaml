intent: |
  (자체 추정, 공식 출제의도 미확보) 부채꼴의 넓이를 이용하여 두 원의 공통 부분의 넓이를 중심 사이 거리의 함수로 나타내고, 치환적분 또는 부분적분으로 정적분의 값을 구할 수 있는지 알아본다.
key_idea: |
  $\cos\alpha=\dfrac x2$인 $\alpha$에 대해 $A(x)=2\alpha-\sin2\alpha$. $x=2\cos\alpha$로 치환하면 $\displaystyle\int_0^2A(x)\,dx=\int_0^{\pi/2}(2\alpha-\sin2\alpha)\,2\sin\alpha\,d\alpha=4-\dfrac43=\dfrac83$.
stuck: |
