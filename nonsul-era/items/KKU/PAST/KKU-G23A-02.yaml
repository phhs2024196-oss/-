stimuli:
- label: 가
  body: |
    반지름의 길이가 $r$이고 중심각의 크기가 $\theta$인 부채꼴의 넓이는 $S=\dfrac12r^2\theta$이다.
- label: 나
  body: |
    그림에서 두 원의 반지름의 길이는 1이고 중심 사이의 거리는 $x$이다. 두 원 내부의 공통 부분의 넓이를 $A(x)$라고 하자.

    [그림: 크기가 같은 두 원이 좌우로 겹쳐 있다. 두 중심이 점으로 표시되고 선분으로 이어져 있으며, 그 위에 점선 호와 함께 거리 $x$가 표시되어 있다. 두 원의 공통 부분(렌즈 모양)이 회색으로 칠해져 있다.]

stem: |
  [문제 2] (나)에서 정적분 $\displaystyle\int_0^2A(x)\,dx$의 값을 구하고 풀이 과정을 쓰시오. [15점]

subparts:
- id: '1'
  stem: |
    (나)에서 정적분 $\displaystyle\int_0^2A(x)\,dx$의 값을 구하고 풀이 과정을 쓰시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '8/3', equivalents: ['\dfrac{8}{3}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $A(x)=2\alpha-\sin2\alpha$ ($\cos\alpha=x/2$), $x=2\cos\alpha$ 치환 후 부분적분으로 $\dfrac83$.
    steps:
    - {id: 1a, content: '$\int_0^{\pi/2}(4\alpha\sin\alpha-2\sin2\alpha\sin\alpha)\,d\alpha=4-\tfrac43=\tfrac83$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 두 원의 교점과 한 중심을 이어 만든 부채꼴을 생각해 보자.
    - 공통 부분은 (부채꼴 − 삼각형)의 몇 배인가?
    - 적분변수를 부채꼴 중심각의 절반 $\alpha$로 바꿔 보자.
  - id: S1-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        한 중심에서 두 교점을 바라본 중심각을 $2\alpha$ $\left(0\le\alpha\le\dfrac\pi2\right)$라 하면 $\cos\alpha=\dfrac x2$이다. 공통 부분은 공통현에 대해 대칭이므로, 제시문 (가)에 의해
        $$A(x)=2\left(\frac12\cdot1^2\cdot2\alpha-\frac12\cdot1^2\sin2\alpha\right)=2\alpha-\sin2\alpha.$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $x=2\cos\alpha$로 치환하면 $dx=-2\sin\alpha\,d\alpha$, $x:0\to2$일 때 $\alpha:\dfrac\pi2\to0$이므로
        $$\int_0^2A(x)\,dx=\int_0^{\pi/2}(2\alpha-\sin2\alpha)\,2\sin\alpha\,d\alpha=4\int_0^{\pi/2}\alpha\sin\alpha\,d\alpha-4\int_0^{\pi/2}\sin^2\alpha\cos\alpha\,d\alpha.$$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        부분적분으로 $\displaystyle\int_0^{\pi/2}\alpha\sin\alpha\,d\alpha=\Big[-\alpha\cos\alpha+\sin\alpha\Big]_0^{\pi/2}=1$, 또 $\displaystyle\int_0^{\pi/2}\sin^2\alpha\cos\alpha\,d\alpha=\Big[\frac{\sin^3\alpha}{3}\Big]_0^{\pi/2}=\frac13$. 따라서 값은 $4-\dfrac43=\dfrac83$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 1c-1
      content: |
        $\cos\alpha=\dfrac x2$로 정해지는 $\alpha$를 $x$의 함수로 보면 $A(x)=2\alpha-\dfrac x2\sqrt{4-x^2}$이고, 음함수 미분 $-\sin\alpha\,\dfrac{d\alpha}{dx}=\dfrac12$와 $\sin\alpha=\dfrac{\sqrt{4-x^2}}{2}$에서 $A^{\prime}(x)=-\sqrt{4-x^2}$, $A(2)=0$이다. 부분적분으로 $\displaystyle\int_0^2A\,dx=\Big[xA(x)\Big]_0^2-\int_0^2xA^{\prime}(x)\,dx=\int_0^2x\sqrt{4-x^2}\,dx=\frac83$.
      criteria: ['1.M2', '1.A1']
  rubric:
    # 채점표는 자체 설계(공식 채점기준 미확보)
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: 부채꼴과 삼각형의 넓이로 $A(x)=2\alpha-\sin2\alpha$($\cos\alpha=\dfrac x2$) 또는 동치식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 치환($x=2\cos\alpha$ 등)으로 적분 구간·$dx$를 바르게 바꾼 적분식을 세웠다(또는 부분적분으로 $\int x\sqrt{4-x^2}\,dx$로 바꿨다).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 적분을 계산해 $\dfrac83$을 얻었다.
      depends_on: [1.M2]
      steps: [1b-3, 1c-1]
    deductions:
    - code: D1-1
      condition: 사소한 계산 실수
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}

