intent: |
  (자체 추정, 공식 출제의도 미확보) 사인법칙으로 $\sin\angle\mathrm{AXB}$를 삼각형 $\mathrm{AXB}$의 외접원의 반지름으로 바꾸고, 외접원이 곡선에 접할 때(접선의 기울기 = 미분계수) 최대가 됨을 미분으로 찾을 수 있는지 알아본다.
key_idea: |
  사인법칙 $\sin\angle\mathrm{AXB}=\dfrac{\overline{\mathrm{AB}}}{2\rho}=\dfrac1\rho$. 외접원의 중심은 $(3,k)$, $\rho^2=1+k^2$이므로 $k$가 최소일 때 최대. $k(a)=\sqrt2\left(1-\dfrac6a+\dfrac8{a^2}+\dfrac{a^2}8\right)$의 최솟값 $\dfrac{\sqrt2}2$ ($a=2$, 이때 외접원이 곡선에 접함) → $\dfrac{\sqrt6}3$.
stuck: |
  각의 사인을 외접원의 반지름으로 바꾸고, 외접원의 중심이 선분 AB의 수직이등분선 $x=3$ 위에 있음을 이용해 한 변수 $k$의 최소 문제로 바꾸는 발상
