intent: |
  (자체 추정, 공식 출제의도 미확보) 각 $\theta$와 시각 $t$ 사이의 관계를 삼각함수로 나타내고, 합성함수의 미분법(음함수 미분)을 이용하여 $\dfrac{d\theta}{dt}$를 구할 수 있는지 알아본다.
key_idea: |
  $\mathrm{P}(0,r)$, $\mathrm{S}(4r\cos t,4r\sin t)$이므로 $\tan\theta=\dfrac{4\sin t-1}{4\cos t}$. 양변을 $t$로 미분하면 $\dfrac{d\theta}{dt}=\dfrac{4(4-\sin t)}{17-8\sin t}$. $\theta=0\iff\sin t=\dfrac14$ → $1$, $\theta=\dfrac\pi2\iff t=\dfrac\pi2$ → $\dfrac43$.
stuck: |
  $\theta$를 $t$의 식으로 쓰는 단계($\tan\theta$ 또는 $\cot\theta$)와, $\theta=\dfrac\pi2$에서 $\tan$이 정의되지 않아 $\cot\theta$(또는 일반식)로 바꾸는 단계
