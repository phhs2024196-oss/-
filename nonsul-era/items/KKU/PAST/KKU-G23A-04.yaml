stimuli:
- label: 가
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는 $y^{\prime}=f^{\prime}(g(x))g^{\prime}(x)$이다.
- label: 나
  body: |
    그림에서 $\mathrm{C}_1$, $\mathrm{C}_2$는 중심이 $\mathrm{O}$인 동심원이고 $\mathrm{C}_1$의 반지름은 $r$, $\mathrm{C}_2$의 반지름은 $R$이다. 직선 $l_1$은 원 $\mathrm{C}_1$과 점 $\mathrm{P}$에서 접한다. 직선 $l_2$는 점 $\mathrm{O}$를 지나고 $l_1$과 평행하다. 점 $\mathrm{S}$는 원 $\mathrm{C}_2$를 따라 돌고 있다. 시각 $t$일 때 직선 $l_2$와 직선 $\mathrm{OS}$가 이루는 각의 크기가 $t$이고, $\theta$는 직선 $l_1$과 직선 $\mathrm{PS}$가 이루는 각의 크기이다.

    [그림: 중심 O인 작은 원 $\mathrm C_1$과 큰 원 $\mathrm C_2$. O를 지나는 수평선 $l_2$와, 작은 원의 맨 위 점 P에서 접하는 수평선 $l_1$. 큰 원 위 오른쪽 위(제1사분면 쪽)에 점 S가 있고, 선분 OS와 선분 PS가 그어져 있다. O에서 $l_2$의 오른쪽 방향과 OS 사이의 각에 $t$, P에서 $l_1$의 오른쪽 방향과 PS 사이의 각에 $\theta$가 표시되어 있다.]

stem: |
  [문제 4] (나)에서 $R=4r$라고 하자. $\theta=0$일 때의 $\dfrac{d\theta}{dt}$와 $\theta=\dfrac\pi2$일 때의 $\dfrac{d\theta}{dt}$를 모두 구하고 풀이 과정을 쓰시오. [25점]

subparts:
- id: '1'
  stem: |
    $R=4r$일 때, $\theta=0$일 때의 $\dfrac{d\theta}{dt}$와 $\theta=\dfrac\pi2$일 때의 $\dfrac{d\theta}{dt}$를 모두 구하고 풀이 과정을 쓰시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '(1, 4/3)', equivalents: ['θ=0: 1, θ=π/2: 4/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\tan\theta=\dfrac{4\sin t-1}{4\cos t}$를 $t$로 미분 → $\dfrac{d\theta}{dt}=\dfrac{4(4-\sin t)}{17-8\sin t}$; $\sin t=\dfrac14$에서 1, $\sin t=1$에서 $\dfrac43$.
    steps:
    - {id: 1a, content: '$\theta=0$: $\dfrac{d\theta}{dt}=1$, $\theta=\dfrac\pi2$: $\dfrac{d\theta}{dt}=\dfrac43$', criteria: ['1.M1', '1.M2', '1.A1', '1.A2']}
    hint_ladder:
    - O를 원점, $l_2$를 $x$축으로 하는 좌표를 잡아 P, S의 좌표를 써 보자.
    - 직선 PS의 기울기는 $\tan\theta$이다.
    - $\theta=\dfrac\pi2$에서는 $\tan$ 대신 무엇을 쓰면 좋을까?
  - id: S1-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        O를 원점, $l_2$를 $x$축으로 잡으면 $\mathrm P(0,r)$, $\mathrm S(4r\cos t,\,4r\sin t)$이다. 직선 PS의 기울기가 $\tan\theta$이므로
        $$\tan\theta=\frac{4r\sin t-r}{4r\cos t}=\frac{4\sin t-1}{4\cos t}.$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        제시문 (가)에 의해 양변을 $t$로 미분하면
        $$\sec^2\theta\,\frac{d\theta}{dt}=\frac{16\cos^2t+4\sin t(4\sin t-1)}{16\cos^2t}=\frac{4-\sin t}{4\cos^2t}.$$
        $\sec^2\theta=1+\tan^2\theta=\dfrac{16\cos^2t+(4\sin t-1)^2}{16\cos^2t}=\dfrac{17-8\sin t}{16\cos^2t}$이므로 $\dfrac{d\theta}{dt}=\dfrac{4(4-\sin t)}{17-8\sin t}$.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\theta=0$이면 S가 $l_1$ 위에 있으므로 $4\sin t=1$, $\sin t=\dfrac14$이다. 따라서 $\dfrac{d\theta}{dt}=\dfrac{4\cdot\frac{15}4}{15}=1$.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $\theta=\dfrac\pi2$이면 $\tan\theta$가 정의되지 않으므로 $\cot\theta=\dfrac{4\cos t}{4\sin t-1}$를 미분한다: $-\csc^2\theta\,\dfrac{d\theta}{dt}=\dfrac{4\sin t-16}{(4\sin t-1)^2}$. 이때 S는 P의 바로 위, 즉 $t=\dfrac\pi2$($\sin t=1$)이고 $\csc^2\theta=1$이므로 $\dfrac{d\theta}{dt}=\dfrac{12}{9}=\dfrac43$.
      criteria: ['1.A2']
