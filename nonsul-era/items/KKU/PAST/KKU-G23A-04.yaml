# 건국대 2023학년도 KU논술우수자 자연계 A [문제 4] — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 원본은 문제지뿐(공식 출제의도·해설·채점기준 미확보). intent·해설·채점표는 입력자 자체 작성(tags: 공식해설미확보).
# 해석 주의: θ 를 그림처럼 'P에서 l1 의 오른쪽 방향으로부터 반직선 PS 까지 잰 각'으로 읽으면 θ=π/2 는 t=π/2 하나뿐(답 4/3).
#   '두 직선이 이루는 각(기울기각, 0≤θ<π)'으로 읽으면 S 가 P 바로 아래(t=3π/2)일 때도 θ=π/2 이고 그때 dθ/dt=4/5 이다.
