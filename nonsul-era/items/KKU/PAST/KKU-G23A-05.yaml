stimuli:
- label: 가
  body: |
    실수 $x$에 대하여 $x$보다 크지 않은 최대의 정수를 $[x]$로 나타내자. 예를 들어 $[4]=4$이고 $\left[\dfrac{21}5\right]=4$이다.
- label: 나
  body: |
    자연수 $n$에 대하여 함수 $f(n)$은 다음과 같이 정의한다.
    $$f(n)=\sum_{k=1}^{\infty}\left[\frac{n}{10^k}\right]$$
    예를 들어, $f(123)=\left[\dfrac{123}{10}\right]+\left[\dfrac{123}{10^2}\right]+\left[\dfrac{123}{10^3}\right]+\cdots=12+1+0+\cdots=13$이다.

stem: |
  [문제 5] (나)에서 정의된 함수 $f(n)$을 이용하여 함수 $g(n)$을 다음과 같이 정의한다.
  $$g(n)=f(10n)-10f(n)$$
  다음을 만족하는 자연수 $n$의 개수를 구하고 풀이 과정을 쓰시오.
  $$g(n)=8,\quad 1\le n\le6200$$
  [30점]

subparts:
- id: '1'
  stem: |
    $g(n)=f(10n)-10f(n)$일 때, $g(n)=8$, $1\le n\le6200$을 만족하는 자연수 $n$의 개수를 구하고 풀이 과정을 쓰시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: '161', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $g(n)$은 $n$의 자릿수의 합. 네 자리(앞자리 0 허용) 합 8, 천의 자리 $\le5$인 것 ${}_{11}\mathrm C_3-{}_5\mathrm C_3=155$개, 천의 자리 6인 것 6개 → 161.
    steps:
    - {id: 1a, content: '$g(n)=n-9f(n)=$ 자릿수 합, $155+6=161$', criteria: ['1.M1', '1.R1', '1.M2', '1.A1']}
    hint_ladder:
    - $f(10n)$과 $f(n)$을 비교해 보자.
    - $g(n)$을 작은 $n$ 몇 개에 대해 계산해 보자. 어떤 값이 나오는가?
    - 자릿수의 합이 8인 네 자리 이하의 수는 몇 개인가?
  - id: S1-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\left[\dfrac{10n}{10^k}\right]=\left[\dfrac{n}{10^{k-1}}\right]$이므로 $f(10n)=\left[n\right]+\sum_{k=1}^{\infty}\left[\dfrac{n}{10^k}\right]=n+f(n)$이고, $g(n)=n-9f(n)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $n=d_m10^m+\cdots+d_110+d_0$ ($0\le d_i\le9$)이라 하면 $\left[\dfrac{n}{10^k}\right]=\sum_{i\ge k}d_i10^{i-k}$이므로
        $$f(n)=\sum_{i}d_i\left(10^{i-1}+\cdots+10+1\right)=\sum_i d_i\frac{10^i-1}{9}.$$
        따라서 $g(n)=n-9f(n)=\sum_i d_i$, 즉 $g(n)$은 $n$의 각 자리 숫자의 합이다. (예: $g(123)=123-9\cdot13=6$)
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        $1\le n\le5999$: $n$을 네 자리 $abcd$(앞자리 0 허용, $0\le a\le5$)로 보면 $a+b+c+d=8$의 음이 아닌 정수해의 개수 ${}_4\mathrm H_8={}_{11}\mathrm C_3=165$에서 $a\ge6$인 해 ${}_4\mathrm H_2={}_5\mathrm C_3=10$을 빼면 155개($n=0$은 합이 0이라 포함 안 됨, 각 자리는 8 이하라 9 초과 제약 없음).
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $6000\le n\le6200$: 천의 자리 6, 나머지 세 자리의 합이 2이고 $n\le6200$인 수는 $6002,6011,6020,6101,6110,6200$의 6개. 따라서 구하는 개수는 $155+6=161$이다.
      criteria: ['1.A1']
