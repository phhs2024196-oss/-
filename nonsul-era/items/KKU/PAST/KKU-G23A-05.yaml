intent: |
  (자체 추정, 공식 출제의도 미확보) 가우스 기호와 급수로 정의된 함수의 성질을 파악하여 $g(n)$이 $n$의 각 자리 숫자의 합임을 밝히고, 조건을 만족하는 자연수의 개수를 경우를 나누어 셀 수 있는지 알아본다.
key_idea: |
  $\left[\dfrac{10n}{10^k}\right]=\left[\dfrac{n}{10^{k-1}}\right]$이므로 $f(10n)=n+f(n)$, $g(n)=n-9f(n)$. $n=\sum d_i10^i$이면 $f(n)=\sum d_i\dfrac{10^i-1}9$이므로 $g(n)=\sum d_i$(자릿수의 합). 자릿수 합이 8인 $1\le n\le6200$의 개수 $=155+6=161$.
stuck: |
  $g(n)$이 자릿수의 합이라는 것을 알아차리는 단계와, 천의 자리가 6인 경우($n\le6200$)를 따로 세는 단계
