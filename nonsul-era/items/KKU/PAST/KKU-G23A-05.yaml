      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 8
      evidence: $1\le n\le5999$에서 자릿수 합이 8인 수의 개수 155를 중복조합 등으로 셌다.
      depends_on: [1.R1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: $6000\le n\le6200$의 6개를 더해 161을 구했다.
      depends_on: [1.M2]
      steps: [1b-4]
