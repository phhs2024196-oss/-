  (공식 출제의도 미확보 — 입력자 추정) 홀짝·배수 조건이 붙은 분배 문제를 변수 치환으로 음이 아닌 정수해의 개수 문제로 바꾸고, 경우를 나누어 중복조합으로 셀 수 있는지 본다.
