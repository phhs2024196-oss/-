stimuli:
- label: 가
  body: |
    평면 위를 움직이는 점 P의 시각 $t$에서의 위치를 $t$의 함수 $x=f(t),\,y=g(t)$로 나타내었을 때, 시각 $t$에서 점 P의 속도는 $(f'(t),\,g'(t))$로 나타내며, 속력은 $\sqrt{f'(t)^2+g'(t)^2}$이다.
- label: 나
  body: |
    그림에서 두 점 $\mathrm{A},\,\mathrm{B}$ 사이의 거리가 1이고 평면 위를 움직이는 점 P에 대해, 시각 $t$에서 $\angle\mathrm{PAB}=\theta_1$, $\angle\mathrm{PBA}=\theta_2$이다.

    [그림: 수평 선분 AB(A 왼쪽, B 오른쪽)와 A의 약간 오른쪽 위에 있는 점 P로 이루어진 삼각형 PAB. 꼭짓점 A의 각에 $\theta_1$(거의 직각), 꼭짓점 B의 각에 $\theta_2$(예각)가 호로 표시되어 있다.]

stem: |
  [문제 3] (나)에서 $t=0$일 때 $\theta_1=\dfrac{\pi}{2}$, $\theta_2=\dfrac{\pi}{4}$, $\dfrac{d\theta_1}{dt}=\dfrac13$, $\dfrac{d\theta_2}{dt}=0$이라고 하자. $t=0$에서 P의 속력을 구하고 풀이 과정을 쓰시오. [20점]

subparts:
- id: '1'
  stem: |
    $t=0$에서 P의 속력을 구하고 풀이 과정을 쓰시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: 'sqrt(2)/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: A를 원점, B를 $(1,0)$으로 두고 P의 좌표를 $\theta_1,\theta_2$로 나타내 미분하면 $t=0$에서 속도 $\left(-\tfrac13,\tfrac13\right)$.
    steps:
    - {id: 1a, content: '속력 $=\sqrt{\left(-\tfrac13\right)^2+\left(\tfrac13\right)^2}=\dfrac{\sqrt2}{3}$', criteria: ['1.M1', '1.M2', '1.A1', '1.A2']}
    hint_ladder:
    - 사인법칙으로 $\overline{\mathrm{AP}}$를 $\theta_1,\theta_2$로 나타내 보자.
    - $\theta_2$는 $t=0$에서 변하지 않으므로 $\theta_1$에 대한 미분만 필요하다.
  - id: S1-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{A}(0,0)$, $\mathrm{B}(1,0)$, P를 위쪽 반평면에 둔다. 삼각형 PAB에서 $\angle\mathrm{APB}=\pi-\theta_1-\theta_2$이므로 사인법칙에 의해
        $$\overline{\mathrm{AP}}=\frac{\sin\theta_2}{\sin(\theta_1+\theta_2)}.$$
        따라서 $\mathrm{P}(x,y)$는
        $$x=\frac{\cos\theta_1\sin\theta_2}{\sin(\theta_1+\theta_2)},\qquad y=\frac{\sin\theta_1\sin\theta_2}{\sin(\theta_1+\theta_2)}.$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\theta_1,\theta_2$는 $t$의 함수이므로 $s=\theta_1+\theta_2$라 하고 몫의 미분법·합성함수의 미분법으로 $x,y$를 $t$에 대해 미분하면 ($'$는 $\tfrac{d}{dt}$)
        $$\frac{dx}{dt}=\frac{(-\sin\theta_1\sin\theta_2\,\theta_1'+\cos\theta_1\cos\theta_2\,\theta_2')\sin s-\cos\theta_1\sin\theta_2\cos s\,(\theta_1'+\theta_2')}{\sin^2 s},$$
        $$\frac{dy}{dt}=\frac{(\cos\theta_1\sin\theta_2\,\theta_1'+\sin\theta_1\cos\theta_2\,\theta_2')\sin s-\sin\theta_1\sin\theta_2\cos s\,(\theta_1'+\theta_2')}{\sin^2 s}.$$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $t=0$에서 $\theta_1=\tfrac\pi2$, $\theta_2=\tfrac\pi4$, $s=\tfrac{3\pi}4$, $\theta_1'=\tfrac13$, $\theta_2'=0$이므로 $\cos\theta_1=0$, $\sin\theta_1=1$, $\sin\theta_2=\cos\theta_2=\tfrac{\sqrt2}2$, $\sin s=\tfrac{\sqrt2}2$, $\cos s=-\tfrac{\sqrt2}2$를 대입하면
        $$\frac{dx}{dt}=\frac{-\tfrac{\sqrt2}{2}\cdot\tfrac13\cdot\tfrac{\sqrt2}{2}}{\tfrac12}=-\frac13,\qquad \frac{dy}{dt}=\frac{-\tfrac{\sqrt2}{2}\cdot\left(-\tfrac{\sqrt2}{2}\right)\cdot\tfrac13}{\tfrac12}=\frac13.$$
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        제시문 (가)에 의해 $t=0$에서 P의 속력은
        $$\sqrt{\left(-\frac13\right)^2+\left(\frac13\right)^2}=\frac{\sqrt2}{3}.$$
      criteria: ['1.A2']
  - id: S1-ALT
    audience: ALT
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 2
    steps:
    - id: 1c-1
      content: |
        $t=0$에서 $\dfrac{d\theta_2}{dt}=0$이므로 그 순간 P는 B를 지나는 직선($\theta_2=\tfrac\pi4$) 위에서 움직인다. 사인법칙 $\overline{\mathrm{BP}}=\dfrac{\sin\theta_1}{\sin(\theta_1+\theta_2)}$를 $\theta_1$로 미분하면 $\dfrac{\sin\theta_2}{\sin^2(\theta_1+\theta_2)}=\sqrt2$이고, 속력은 $\sqrt2\cdot\tfrac13=\tfrac{\sqrt2}{3}$이다(이 순간 속도 방향이 직선 BP 방향이므로 $\lvert d\overline{\mathrm{BP}}/dt\rvert$가 속력).
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
  rubric:
    # 공식 채점기준 미확보 — 아래 마크·배점은 입력자 자체 설계(tags: 공식해설미확보)
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: |
        점 P의 좌표(또는 $\overline{\mathrm{AP}}$, $\overline{\mathrm{BP}}$)를 $\theta_1,\theta_2$의 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: |
        합성함수의 미분법으로 $\dfrac{dx}{dt}$, $\dfrac{dy}{dt}$(또는 이에 해당하는 변화율)를 $\dfrac{d\theta_1}{dt}$, $\dfrac{d\theta_2}{dt}$를 써서 나타냈다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $t=0$에서 속도 $\left(-\tfrac13,\tfrac13\right)$ 또는 이에 해당하는 값을 구했다.
      depends_on: [1.M2]
      steps: [1b-3, 1c-1]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        속력 $\dfrac{\sqrt2}{3}$을 구했다.
      depends_on: [1.M2]
      steps: [1b-4, 1c-1]
  outcome_codes:
  - {code: '20', meaning: 만점}

