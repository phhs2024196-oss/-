stimuli:
- label: 가
  body: |
    삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이가 $R$라고 하면 다음이 성립한다.
    $$\frac{a}{\sin\mathrm{A}}=\frac{b}{\sin\mathrm{B}}=\frac{c}{\sin\mathrm{C}}=2R$$
    $$a^2=b^2+c^2-2bc\cos\mathrm{A}$$
- label: 나
  body: |
    그림에서 점 $\mathrm{D},\mathrm{E},\mathrm{F}$는 각각 변 $\mathrm{BC},\mathrm{AB},\mathrm{AC}$ 위의 점으로 직선 $\mathrm{DE}$는 변 $\mathrm{AC}$에 평행하고 직선 $\mathrm{DF}$는 변 $\mathrm{AB}$에 평행하다. 점 $\mathrm{O},\mathrm{O}_1,\mathrm{O}_2$는 각각 삼각형 $\mathrm{ABC},\mathrm{BDE},\mathrm{DCF}$의 외접원의 중심이다.

    [그림: 밑변 BC가 수평인 삼각형 ABC(A 위, B 왼쪽 아래, C 오른쪽 아래). 변 BC 위 B 쪽에 점 D, 변 AB 위에 점 E, 변 AC 위에 점 F. 선분 DE(AC와 평행)와 선분 DF(AB와 평행)가 그려져 있다. 삼각형 내부 아래쪽에 점 $\mathrm{O}_1$(B 근처), O(가운데), $\mathrm{O}_2$(O의 오른쪽 아래)가 있고 선분으로 이어진 삼각형 $\mathrm{OO}_1\mathrm{O}_2$가 그려져 있다.]

stem: |
  [문제 4] (나)에서 $\overline{\mathrm{AB}}=4$, $\overline{\mathrm{AC}}=5$, $\overline{\mathrm{BC}}=6$이고 $\overline{\mathrm{BD}}:\overline{\mathrm{DC}}=1:2$일 때 삼각형 $\mathrm{OO}_1\mathrm{O}_2$의 넓이를 구하고 풀이 과정을 쓰시오. [25점]

subparts:
- id: '1'
  stem: |
    삼각형 $\mathrm{OO}_1\mathrm{O}_2$의 넓이를 구하고 풀이 과정을 쓰시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '2*sqrt(7)/21', equivalents: ['2/(3*sqrt(7))'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{O}_1\in\overline{\mathrm{BO}}$, $\mathrm{O}_2\in\overline{\mathrm{CO}}$이고 $\overline{\mathrm{OO}_1}=\tfrac23R$, $\overline{\mathrm{OO}_2}=\tfrac13R$, $\angle\mathrm{O}_1\mathrm{OO}_2=2A$.
    steps:
    - {id: 1a, content: '넓이 $=\tfrac29\cdot\triangle\mathrm{OBC}=\tfrac29\cdot\tfrac{3\sqrt7}{7}=\tfrac{2\sqrt7}{21}$', criteria: ['1.M1', '1.R1', '1.M2', '1.A1', '1.A2']}
    hint_ladder:
    - 삼각형 BDE와 삼각형 BCA는 어떤 관계인가?
    - 닮음의 중심 B에서 보면 외심 $\mathrm{O}_1$은 어디에 있는가?
  - id: S1-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a=\overline{\mathrm{BC}}=6$, $b=\overline{\mathrm{CA}}=5$, $c=\overline{\mathrm{AB}}=4$이므로 코사인법칙에 의해 $\cos\mathrm{A}=\dfrac{25+16-36}{2\cdot5\cdot4}=\dfrac18$, $\sin\mathrm{A}=\dfrac{3\sqrt7}{8}$이고, 사인법칙에 의해 $R=\dfrac{a}{2\sin\mathrm{A}}=\dfrac{8}{\sqrt7}$이다. $36<16+25$이므로 삼각형 ABC는 예각삼각형이고 O는 내부에 있다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\mathrm{DE}\parallel\mathrm{AC}$이므로 삼각형 BDE와 삼각형 BCA는 닮음이고 닮음비는 $\overline{\mathrm{BD}}:\overline{\mathrm{BC}}=1:3$이다. 같은 방법으로 $\mathrm{DF}\parallel\mathrm{AB}$이므로 삼각형 DCF와 삼각형 BCA는 닮음비 $2:3$으로 닮음이다. 두 삼각형은 각각 B, C를 공유하고 대응변이 같은 직선(또는 평행선) 위에 놓이므로, B를 중심으로 삼각형 ABC를 $\tfrac13$로 축소하면 삼각형 EBD가, C를 중심으로 $\tfrac23$로 축소하면 삼각형 FDC가 된다. 외심도 이 축소로 대응하므로 $\mathrm{O}_1$은 선분 $\mathrm{BO}$ 위에서 $\overline{\mathrm{BO}_1}=\tfrac13R$, $\mathrm{O}_2$는 선분 $\mathrm{CO}$ 위에서 $\overline{\mathrm{CO}_2}=\tfrac23R$인 점이다.
        (근거: 외접원의 반지름은 사인법칙으로 $\tfrac{\overline{\mathrm{DE}}}{2\sin\mathrm{B}}$ 등에서 $\tfrac13R$, $\tfrac23R$이고, 이등변삼각형 $\mathrm{O}_1\mathrm{BD}$와 $\mathrm{OBC}$의 밑각이 모두 $90^\circ-\mathrm{A}$로 같아 $\angle\mathrm{O}_1\mathrm{BD}=\angle\mathrm{OBC}$이다.)
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        따라서 $\overline{\mathrm{OO}_1}=R-\tfrac13R=\tfrac23R$, $\overline{\mathrm{OO}_2}=R-\tfrac23R=\tfrac13R$이고, $\angle\mathrm{O}_1\mathrm{OO}_2=\angle\mathrm{BOC}=2\mathrm{A}$(중심각)이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $\sin2\mathrm{A}=2\sin\mathrm{A}\cos\mathrm{A}=2\cdot\dfrac{3\sqrt7}{8}\cdot\dfrac18=\dfrac{3\sqrt7}{32}$, $R^2=\dfrac{64}{7}$이다.
      criteria: ['1.A1']
    - id: 1b-5
      content: |
        $$\triangle\mathrm{OO}_1\mathrm{O}_2=\frac12\cdot\frac23R\cdot\frac13R\cdot\sin2\mathrm{A}=\frac19\cdot\frac{64}{7}\cdot\frac{3\sqrt7}{32}=\frac{2\sqrt7}{21}.$$
      criteria: ['1.A2']
  rubric:
    # 공식 채점기준 미확보 — 아래 마크·배점은 입력자 자체 설계(tags: 공식해설미확보)
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        코사인법칙·사인법칙으로 $\cos\mathrm{A}=\tfrac18$(또는 다른 각)과 외접원의 반지름 $R=\tfrac{8}{\sqrt7}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 8
      evidence: |
        닮음(닮음비 $\tfrac13$, $\tfrac23$)을 근거로 $\mathrm{O}_1$이 선분 BO 위, $\mathrm{O}_2$가 선분 CO 위에 있음과 $\overline{\mathrm{BO}_1}=\tfrac13R$, $\overline{\mathrm{CO}_2}=\tfrac23R$를 밝혔다(또는 좌표로 $\mathrm{O}_1$, $\mathrm{O}_2$를 구했다).
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        $\overline{\mathrm{OO}_1}=\tfrac23R$, $\overline{\mathrm{OO}_2}=\tfrac13R$, 끼인각 $2\mathrm{A}$(또는 동치 자료)로 넓이 식을 세웠다.
      depends_on: [1.R1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\sin2\mathrm{A}=\tfrac{3\sqrt7}{32}$ 등 넓이 계산에 필요한 값을 바르게 구했다.
      depends_on: [1.M2]
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        넓이 $\dfrac{2\sqrt7}{21}$을 구했다.
      depends_on: [1.M2]
      steps: [1b-5]
  outcome_codes:
  - {code: '20', meaning: 만점}

