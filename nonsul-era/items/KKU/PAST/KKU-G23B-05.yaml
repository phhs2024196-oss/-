# 건국대 2023학년도 수시 논술 자연계 B [문제 5] — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 원본은 문제지뿐(공식 출제의도·해설·채점기준 미확보). 해설 B는 자체 풀이, 채점표는 입력자 자체 설계(공식 아님).
# 주의: 원문에 $\overline{\mathrm{AB}}$ 값이 주어지지 않는다. 계산하면 비 f(x)는 AB 에 무관하다(검산 파일에서 기호 확인).
