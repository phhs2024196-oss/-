stimuli:
- label: 가
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능하고 $x=a$에서 극값을 가지면 $f'(a)=0$이다.
- label: 나
  body: |
    그림에서 직선 $l_1$과 $l_2$는 평행하다. $\mathrm{A},\mathrm{B},\mathrm{C}$는 $l_1$ 위의 세 점이고, 점 O는 점 B에서 직선 $l_2$에 내린 수선의 발이다. 직선 $l_2$ 위의 점 P는 점 O의 아래쪽에 있다. 직선 BP와 수직인 직선 $l_3$가 선분 AP, BP, CP와 각각 $\mathrm{A}',\mathrm{B}',\mathrm{C}'$에서 만난다. $\overline{\mathrm{BC}}=1$이고 $\overline{\mathrm{BO}}=2$이다.

    [그림: 왼쪽 수직선 $l_1$과 오른쪽 수직선 $l_2$. $l_1$ 위에 위에서부터 A, B, C가 있고 B와 C 사이에 점선 호로 길이 1 표시. $l_2$ 위에 O(B와 같은 높이, 직각 표시)와 그 아래 P가 있고 O와 P 사이에 점선 호로 $x$ 표시. 선분 BO(양 끝 직각 표시), 선분 AP, BP, CP가 그려져 있다. 두 직선 사이 폭은 2로 표시. 약간 기울어진 직선 $l_3$가 AP, BP, CP와 각각 $\mathrm{A}'$, $\mathrm{B}'$(BP와 직각 표시), $\mathrm{C}'$에서 만난다. $\overline{\mathrm{AB}}$의 길이는 표시되어 있지 않다.]

stem: |
  [문제 5] (나)에서 $\overline{\mathrm{OP}}=x$일 때 $\dfrac{\overline{\mathrm{A}'\mathrm{B}'}}{\overline{\mathrm{A}'\mathrm{C}'}}$와 $\dfrac{\overline{\mathrm{AB}}}{\overline{\mathrm{AC}}}$의 비 $\dfrac{\;\dfrac{\overline{\mathrm{A}'\mathrm{B}'}}{\overline{\mathrm{A}'\mathrm{C}'}}\;}{\;\dfrac{\overline{\mathrm{AB}}}{\overline{\mathrm{AC}}}\;}$는 $x$에 대한 식으로 표현된다. 이 식을 $f(x)$라 할 때 $f(x)$가 최소가 되는 $x$의 값을 구하고 풀이 과정을 쓰시오. [30점]

subparts:
- id: '1'
  stem: |
    $f(x)$가 최소가 되는 $x$의 값을 구하고 풀이 과정을 쓰시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{A}'\mathrm{B}'}:\overline{\mathrm{B}'\mathrm{C}'}=\tan\alpha:\tan\beta$로 바꾸면 $f(x)=\dfrac{x^2-x+4}{x^2+4}$, $f'(x)=0\Rightarrow x=2$.
    steps:
    - {id: 1a, content: '$f(x)=1-\dfrac{x}{x^2+4}$, $f^{\prime}(x)=\dfrac{x^2-4}{(x^2+4)^2}$이므로 $x=2$에서 최소', criteria: ['1.M1', '1.M2', '1.A1', '1.M3', '1.A2']}
    hint_ladder:
    - $\overline{\mathrm{PB}'}=h$로 두면 $\overline{\mathrm{A}'\mathrm{B}'}$는 $h$와 어떤 각으로 표현되는가?
    - 직선 PA, PB, PC의 기울기로 각의 탄젠트를 구해 보자.
    - $\overline{\mathrm{AB}}$를 문자로 두고 계산하면 어떻게 되는가?
  - id: S1-B
    audience: B
    source_flow: 자체 풀이(공식 해설 미확보)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        B를 원점, $l_1$을 $y$축, $l_2$를 직선 $x=2$로 놓으면 $\mathrm{O}(2,0)$, $\mathrm{P}(2,-x)$ ($x>0$), $\mathrm{C}(0,-1)$이고, $\overline{\mathrm{AB}}=k\,(k>0)$라 하면 $\mathrm{A}(0,k)$이다. $\alpha=\angle\mathrm{APB}$, $\beta=\angle\mathrm{BPC}$, $h=\overline{\mathrm{PB}'}$라 하자. $l_3\perp\mathrm{BP}$이므로 직각삼각형 $\mathrm{PB}'\mathrm{A}'$, $\mathrm{PB}'\mathrm{C}'$에서
        $$\overline{\mathrm{A}'\mathrm{B}'}=h\tan\alpha,\qquad \overline{\mathrm{B}'\mathrm{C}'}=h\tan\beta,\qquad \overline{\mathrm{A}'\mathrm{C}'}=h(\tan\alpha+\tan\beta).$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        직선 PA, PB, PC의 기울기는 각각 $-\dfrac{k+x}{2}$, $-\dfrac{x}{2}$, $\dfrac{1-x}{2}$이므로 탄젠트의 덧셈정리에 의해
        $$\tan\alpha=\frac{-\tfrac{x}{2}+\tfrac{k+x}{2}}{1+\tfrac{x(k+x)}{4}}=\frac{2k}{x^2+kx+4},\qquad \tan\beta=\frac{\tfrac{1-x}{2}+\tfrac{x}{2}}{1-\tfrac{x(1-x)}{4}}=\frac{2}{x^2-x+4}.$$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\dfrac{\overline{\mathrm{AB}}}{\overline{\mathrm{AC}}}=\dfrac{k}{k+1}$이므로
        $$f(x)=\frac{\tan\alpha}{\tan\alpha+\tan\beta}\cdot\frac{k+1}{k}=\frac{\tfrac{2}{x^2+kx+4}}{\tfrac{2k}{x^2+kx+4}+\tfrac{2}{x^2-x+4}}\cdot(k+1)=\frac{(k+1)(x^2-x+4)}{k(x^2-x+4)+x^2+kx+4}=\frac{x^2-x+4}{x^2+4}.$$
        즉 $f(x)$는 $k$에 관계없이 $x$만의 식이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $f(x)=1-\dfrac{x}{x^2+4}$이고 몫의 미분법으로 $f^{\prime}(x)=-\dfrac{(x^2+4)-2x^2}{(x^2+4)^2}=\dfrac{x^2-4}{(x^2+4)^2}$이다. 제시문 (가)에 의해 극값을 갖는 점에서 $f^{\prime}(x)=0$이므로 $x=2$ ($x>0$)이다.
      criteria: ['1.M3']
    - id: 1b-5
      content: |
        $0<x<2$에서 $f^{\prime}(x)<0$, $x>2$에서 $f^{\prime}(x)>0$이므로 $f$는 $x=2$에서 극소이자 최소이고 최솟값은 $f(2)=\tfrac34$이다. 따라서 구하는 값은 $x=2$이다.
      criteria: ['1.A2']
  rubric:
    # 공식 채점기준 미확보 — 아래 마크·배점은 입력자 자체 설계(tags: 공식해설미확보)
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: |
        $l_3$ 위의 선분 $\overline{\mathrm{A}'\mathrm{B}'}$, $\overline{\mathrm{A}'\mathrm{C}'}$를 $\overline{\mathrm{PB}'}$와 각의 탄젠트(또는 좌표)로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 7
      evidence: |
        $\tan\angle\mathrm{APB}$, $\tan\angle\mathrm{BPC}$(또는 동치량)를 $x$와 $\overline{\mathrm{AB}}$로 구했다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: |
        $f(x)=\dfrac{x^2-x+4}{x^2+4}$ 또는 동치식을 구했다($\overline{\mathrm{AB}}$가 약분됨을 보임).
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 5
      evidence: |
        $f^{\prime}(x)$를 구하고 $f^{\prime}(x)=0$에서 $x=2$를 얻었다.
      depends_on: [1.A1]
      implied_ok: false
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: |
        증감(부호 변화)으로 $x=2$에서 최소임을 확인하고 답 $x=2$를 적었다.
      depends_on: [1.M3]
      steps: [1b-5]
