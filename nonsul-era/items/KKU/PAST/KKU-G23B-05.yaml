  (공식 출제의도 미확보 — 입력자 추정) 한 점에서 뻗은 세 직선과 그에 수직인 직선이 만드는 선분의 비를 탄젠트(덧셈정리)로 표현하고, 미분하여 최솟값을 주는 $x$를 구할 수 있는지 본다.
key_idea: |
  $\overline{\mathrm{PB}'}=h$라 하면 $\overline{\mathrm{A}'\mathrm{B}'}=h\tan\alpha$, $\overline{\mathrm{B}'\mathrm{C}'}=h\tan\beta$ ($\alpha=\angle\mathrm{APB}$, $\beta=\angle\mathrm{BPC}$)이고, 기울기의 탄젠트 덧셈정리로 계산하면 $\overline{\mathrm{AB}}=k$에 관계없이 $f(x)=\dfrac{x^2-x+4}{x^2+4}$이므로 $x=2$에서 최소.
stuck: |
