stimuli:
- label: 가
  body: |
    (제시문 1) $x=a$에서 $x=b$까지의 곡선 $y=f(x)$의 길이 $l$은
    $$l=\int_a^b\sqrt{1+\{f^{\prime}(x)\}^2}\,dx$$
- label: 나
  body: |
    그림에서 $\mathrm{S}$는 중심이 점 $\left(0,\dfrac{\sqrt{13}}{3}\right)$이고 반지름이 $1$인 원이다. 원점에서 바라볼 때 점 $\mathrm{A}$, $\mathrm{B}$는 원 $\mathrm{S}$에 가려져서 보이지 않고 점 $\mathrm{C}$, $\mathrm{D}$는 보인다.

    [그림: 좌표축과 원점 $\mathrm{O}$. $y$축 위쪽에 중심이 있는 색칠된 원 $\mathrm{S}$가 있고 원의 아래쪽은 원점보다 조금 위에 있다. 원점에서 오른쪽 위로 가파르게 그은 점선 위에 원 안의 점 $\mathrm{B}$와 원 너머 위쪽의 점 $\mathrm{A}$가 있고, 원점과 원 사이 점선 위의 점 $\mathrm{C}$가 있다. 원점에서 오른쪽 위로 완만하게 그은 실선 끝에 점 $\mathrm{D}$가 있다.]

stem: |
  [문제 1] (나)에서 원점에서 제 1사분면의 곡선 $y=\dfrac16x^3+\dfrac1{2x}$ 위에 있는 점들을 바라볼 때, 원 $\mathrm{S}$에 의해서 가려지지 않고 보이는 점들로 이루어진 곡선 $y=\dfrac16x^3+\dfrac1{2x}$의 부분의 길이를 구하고 풀이 과정을 쓰시오. [15점]

subparts:
- id: '1'
  stem: |
    원 $\mathrm{S}$에 가려지지 않고 보이는 곡선 부분의 길이를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '(1 + sqrt(3))/3', equivalents: ['1/3 + sqrt(3)/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 원점에서의 접선 $y=\tfrac23x$와 곡선의 교점 $x=1,\sqrt3$ 사이가 보이며, 길이 $\int_1^{\sqrt3}\left(\tfrac12x^2+\tfrac1{2x^2}\right)dx=\tfrac{1+\sqrt3}{3}$.
    steps:
    - {id: 1a, content: '접선 $m=\tfrac23$ → 교점 $x=1,\sqrt3$ → $(1,\tfrac23)$은 원 밖 → $1\le x\le\sqrt3$ → 길이 $\tfrac{1+\sqrt3}{3}$', criteria: ['1.M1', '1.M2', '1.R1', '1.M3', '1.A1']}
    hint_ladder:
    - 원점에서 원에 그은 접선이 '보이는 점'과 '가려진 점'의 경계가 된다.
    - $1+(y^{\prime})^2$을 전개해 완전제곱이 되는지 보자.
  - id: S1-B
    audience: B
    source_flow: 2024학년도 논술(KU논술우수자) 기출문제_자연A.pdf p.3-4 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        원의 접선 $y=mx$에서 원의 중심 $\left(0,\dfrac{\sqrt{13}}{3}\right)$까지의 거리는 원의 반지름과 같으므로 $\dfrac{\left\lvert\frac{\sqrt{13}}{3}\right\rvert}{\sqrt{m^2+1}}=1$이고 제 1사분면에서 만나므로 $m=\dfrac23$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        접선과 곡선의 교점은 $\dfrac23x=\dfrac16x^3+\dfrac1{2x}$로부터 $x^2=1$ 또는 $3$이다. 교점은 제 1사분면에 있으므로 2개이고, 두 교점의 $x$좌표는 각각 $1$, $\sqrt3$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        곡선 $y=\dfrac16x^3+\dfrac1{2x}$에서 $y^{\prime}=\dfrac12x^2-\dfrac1{2x^2}$이다. 따라서 $x=1$에서 극값을 갖고, $0<x<1$에서 $y^{\prime}<0$, $x>1$에서 $y^{\prime}>0$이다. 따라서 제 1사분면에서 곡선은 $0<x<1$에서 감소하고 $x>1$에서 증가하며 $x=1$에서 최솟값 $\dfrac23$을 갖는다.
        원 위의 점의 $x$좌표의 최댓값은 $1$이고 $x=1$일 때 원 위의 점의 좌표는 $\left(1,\dfrac{\sqrt{13}}{3}\right)$이다. 따라서 점 $\left(1,\dfrac23\right)$는 원 밖의 점이다.
        [그림: 원 $\mathrm{S}$, 곡선, 직선 $y=\tfrac23x$를 함께 그린 것. 직선은 원에 접하고 곡선과 $x=1$, $x=\sqrt3$에서 만난다. 점 $\left(1,\tfrac{\sqrt{13}}{3}\right)$까지 점선 표시.]
        따라서 $1\le x\le\sqrt3$일 때 곡선이 보인다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        곡선의 길이는
        $$\int_1^{\sqrt3}\sqrt{1+\left(\frac12x^2-\frac1{2x^2}\right)^2}\,dx=\int_1^{\sqrt3}\left(\frac12x^2+\frac1{2x^2}\right)dx$$
      criteria: ['1.M3']
    - id: 1b-5
      content: |
        $$=\left[\frac16x^3-\frac1{2x}\right]_1^{\sqrt3}=\frac{1+\sqrt3}{3}$$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 원본에 채점기준 없음 — 예시답안 단계(접선 → 교점 → 보이는 구간 판정 → 길이 적분 → 값)를 따라 입력자가 배분한 자체 설계.
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        점과 직선 사이 거리(또는 판별식)로 원점에서 원에 그은 접선의 기울기 $m=\dfrac23$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        접선과 곡선의 교점 방정식에서 $x=1$, $x=\sqrt3$을 얻었다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        보이는 부분이 $1\le x\le\sqrt3$임을 근거(곡선의 증감 또는 점 $\left(1,\tfrac23\right)$이 원 밖이라는 확인 등)와 함께 적었다.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: |
        곡선의 길이 공식을 적용하고 $1+(y^{\prime})^2=\left(\tfrac12x^2+\tfrac1{2x^2}\right)^2$으로 정리한 적분식을 썼다.
      depends_on: []
      implied_ok: false
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        길이 $\dfrac{1+\sqrt3}{3}$을 얻었다.
      depends_on: [1.R1, 1.M3]
      steps: [1b-5]
    deductions: []
