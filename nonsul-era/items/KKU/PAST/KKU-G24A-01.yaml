intent: |
  원에 대한 접선을 구하고 곡선의 길이를 적분을 이용하여 구할 수 있는지 알아본다.
key_idea: |
  원점에서 원 $\mathrm{S}$에 그은 접선 $y=\dfrac23x$가 보이는 부분의 경계이고, 접선과 곡선의 교점 $x=1,\sqrt3$ 사이가 보이는 부분이다. $1+(y')^2$이 완전제곱이 되어 길이 적분이 바로 계산된다.
stuck: |
  "원에 가려지지 않고 보인다"를 원점에서 그은 접선(기울기 $\tfrac23$)과 곡선의 위치 관계로 바꾸는 것, 그리고 $x=1$에서의 곡선 위 점 $\left(1,\tfrac23\right)$이 원 밖에 있음을 확인하는 것.
