      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        7자리 중 가장 왼쪽에 A를 고정하고 나머지에 A 2개·B 4개를 배치하는 수 $\dfrac{6!}{2!4!}$을 썼다(또는 첫 문자가 A일 비율 $\tfrac37$ 사용).
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2c-1]
    - id: 2.M3
      mark_type: M
      points: 2
      evidence: |
        남은 5자리에 C 3개·D 2개를 배치하는 수 $\dfrac{5!}{3!2!}$을 썼다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        답 $118800$을 얻었다.
      depends_on: [2.M1, 2.M2, 2.M3]
      steps: [2b-4, 2c-1]
    deductions: []
