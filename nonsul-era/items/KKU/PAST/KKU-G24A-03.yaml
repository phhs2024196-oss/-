intent: |
  곡선 사이의 넓이를 적분을 이용하여 표현하고, 합성함수 미분법을 활용하여 문제를 해결할 수 있는지 알아본다.
key_idea: |
  교점의 $x$좌표 $a(t)$를 두고 $S(t)=\int_0^{a}\left(e^{-(x-t)}+1-e^{2x}\right)dx$를 $t$로 미분하면 $\dfrac{da}{dt}$의 계수가 교점 조건으로 $0$이 되어 $S^{\prime}(t)=-e^{-(a-t)}+e^t$. $t=\ln6$이면 $b=e^a$가 $b^3-b-6=0$의 근 $2$.
stuck: |
  $a$가 $t$의 함수임을 인식하고 합성함수 미분에서 $\dfrac{da}{dt}$ 항이 교점 조건으로 사라짐을 보는 것, 그리고 $e^{3a}-e^a-6=0$을 $b=e^a$로 치환해 인수분해하는 것.
