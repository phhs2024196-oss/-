stimuli:
- label: 가
  body: |
    (제시문 3) 두 함수 $y=f(x)$, $y=g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$와 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $\mathrm{S}$는
    $$\mathrm{S}=\int_a^b\lvert f(x)-g(x)\rvert\,dx$$
    이다.
- label: 나
  body: |
    그림에서 색칠된 도형은 두 곡선 $y=e^{2x}$, $y=e^{-(x-t)}+1$과 $y$축으로 둘러싸인 도형이고, $S(t)$는 이 도형의 넓이이다. ($t$는 양의 실수)

    [그림: 좌표축과 원점 $\mathrm{O}$. 오른쪽으로 갈수록 가파르게 증가하는 곡선 $y=e^{2x}$와 왼쪽 위에서 내려와 오른쪽으로 갈수록 완만해지는 감소 곡선 $y=e^{-(x-t)}+1$이 제1사분면에서 한 점에서 만난다. $y$축과 두 곡선 사이(교점 왼쪽)의 영역이 색칠되어 있다.]

stem: |
  [문제 3] (나)에서 $t=\ln6$에서의 미분계수 $S^{\prime}(\ln6)$을 구하고 풀이 과정을 쓰시오. [30점]

subparts:
- id: '1'
  stem: |
    $S^{\prime}(\ln6)$을 구하시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S^{\prime}(t)=e^t-e^{-(a-t)}$, $t=\ln6$에서 $e^a=2$이므로 $S^{\prime}(\ln6)=6-3=3$.
    steps:
    - {id: 1a, content: '교점 $a$로 $S(t)$ 표현 → $t$로 미분, $\tfrac{da}{dt}$ 항 소거 → $e^a=2$ → $3$', criteria: ['1.M1', '1.M2', '1.R1', '1.M3', '1.A1']}
    hint_ladder:
    - 교점의 $x$좌표 $a$도 $t$에 따라 변한다. $S(t)$를 $a$와 $t$로 나타내 보자.
    - 미분한 식에서 $\dfrac{da}{dt}$의 계수가 교점 조건으로 어떻게 되는가?
  - id: S1-B
    audience: B
    source_flow: 2024학년도 논술(KU논술우수자) 기출문제_자연A.pdf p.5-6 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        [그림: 색칠된 영역 $S(t)$와 교점의 $x$좌표 $a$를 점선으로 표시]
        두 곡선의 교점의 $x$좌표를 $a$라 하자. 즉, $e^{2a}=e^{-(a-t)}+1$이다.
        그러면,
        $$S(t)=\int_0^a\left(e^{-(x-t)}+1-e^{2x}\right)dx=-e^{-(a-t)}+a-\frac12e^{2a}+e^t+\frac12$$
        이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $t$에 대해 미분하면,
        $$S^{\prime}(t)=-e^{-(a-t)}\left(1-\frac{da}{dt}\right)+\frac{da}{dt}-e^{2a}\frac{da}{dt}+e^t=\left(e^{-(a-t)}+1-e^{2a}\right)\frac{da}{dt}-e^{-(a-t)}+e^t$$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $e^{2a}=e^{-(a-t)}+1$이므로, $S^{\prime}(t)=-e^{-(a-t)}+e^t$이다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        $t=\ln6$일 때 $e^{2a}=6e^{-a}+1$이고, 따라서 $e^{3a}-e^a-6=0$이다. $b=e^a$라 하면, $b^3-b-6=0$이다. 따라서 $(b-2)(b^2+2b+3)=0$이고, $b=2$를 얻는다. $e^a=b=2$이므로, $t=\ln6$일 때 $a=\ln2$이다.
      criteria: ['1.M3']
    - id: 1b-5
      content: |
        따라서 $S^{\prime}(\ln6)=-e^te^{-a}+e^t=-6\times\dfrac12+6=3$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 원본에 채점기준 없음 — 예시답안 단계 기준 자체 설계.
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        교점의 $x$좌표 $a$($e^{2a}=e^{-(a-t)}+1$)를 두고 $S(t)$를 $\displaystyle\int_0^a\left(e^{-(x-t)}+1-e^{2x}\right)dx$로 표현해 계산했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: |
        $a$를 $t$의 함수로 보고 합성함수의 미분(또는 정적분 미분)으로 $S^{\prime}(t)$를 $\dfrac{da}{dt}$를 포함한 식으로 썼다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 6
      evidence: |
        교점 조건으로 $\dfrac{da}{dt}$의 계수가 $0$임을 밝혀 $S^{\prime}(t)=e^t-e^{-(a-t)}$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 6
      evidence: |
        $t=\ln6$에서 $e^{3a}-e^a-6=0$을 세우고 $b=e^a$로 인수분해하여 $e^a=2$(나머지 인수는 양수)임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: |
        $S^{\prime}(\ln6)=3$을 얻었다.
      depends_on: [1.R1, 1.M3]
      steps: [1b-5]
    deductions: []
