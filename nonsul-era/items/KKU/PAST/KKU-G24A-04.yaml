stimuli:
- label: 가
  body: |
    (제시문 4) 좌표평면 위에서 $x$축의 양의 방향을 시초선으로 잡았을 때, 일반각 $\theta$를 나타내는 동경과 원점 $\mathrm{O}$를 중심으로 하고 반지름의 길이가 $r$인 원의 교점을 $\mathrm{P}(x,y)$라 하면 $\dfrac yr$, $\dfrac xr$, $\dfrac yx\ (x\ne0)$의 값은 $r$의 값과 관계없이 $\theta$의 값에 따라 각각 하나로 정해진다. 이 함수를 차례로 $\theta$에 대한 사인함수, 코사인함수, 탄젠트함수라 하고, 기호를 각각 $\sin\theta=\dfrac yr$, $\cos\theta=\dfrac xr$, $\tan\theta=\dfrac yx\ (x\ne0)$로 정의하고, 이 함수들을 통틀어 $\theta$에 대한 삼각함수라 한다.
- label: 나
  body: |
    그림에서 도형 $\mathrm{A}$는 네 점 $(0,0),(1,0),(1,1),(0,1)$이 꼭짓점인 정사각형이다. 점 $\mathrm{P}$는 제 2사분면의 점으로 중심이 원점이고 반지름이 $3$인 원 위에 있다. $\alpha$는 점 $\mathrm{P}$에서 $\mathrm{A}$를 바라본 각의 크기이다.

    [그림: 좌표축, 원점 $\mathrm{O}$, $x$축 위 $1$, $y$축 위 $3$ 표시. 색칠된 단위 정사각형 $\mathrm{A}$. 제2사분면의 점 $\mathrm{P}$에서 원점 $\mathrm{O}$와 꼭짓점 $(1,1)$로 선분이 그어져 있고 $\mathrm{P}$에서 두 선분 사이의 각이 $\alpha$로 표시되어 있다.]

stem: |
  [문제 4] (나)에서 $\cos\alpha$가 최소가 될 때의 점 $\mathrm{P}$의 좌표와 $\cos\alpha$를 구하고 풀이 과정을 쓰시오. [35점]

subparts:
- id: '1'
  stem: |
    $\cos\alpha$가 최소가 될 때의 점 $\mathrm{P}$의 좌표와 $\cos\alpha$를 구하시오.
  points: 35
  depends_on: []
  answer: {kind: expression, value: 'cos_alpha = sqrt(7)/3; Px = 1 - sqrt(14)/2; Py = 1 + sqrt(14)/2', equivalents: ['cos α = √7/3, P(1-√14/2, 1+√14/2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 경우의 코사인법칙 + 산술·기하 평균으로 최솟값 $\tfrac{\sqrt7}{3}$($d=\sqrt7$), $\theta=\angle\mathrm{POQ}$의 덧셈정리로 $\mathrm{P}$.
    steps:
    - {id: 1a, content: '$y\le1$: $\cos\alpha\ge\tfrac{2\sqrt2}{3}$; $y>1$: $\cos\alpha\ge\tfrac{\sqrt7}{3}$ → 최솟값 $\tfrac{\sqrt7}{3}$ → $\cos\theta=\tfrac{\sqrt2}{3}$ → $\mathrm{P}\left(1-\tfrac{\sqrt{14}}2,1+\tfrac{\sqrt{14}}2\right)$', criteria: ['1.M1', '1.M2', '1.R1', '1.A1', '1.M3', '1.A2']}
    hint_ladder:
    - $\mathrm{P}$에서 정사각형을 볼 때 시야의 양 끝이 되는 꼭짓점은 $\mathrm{P}$의 높이에 따라 어떻게 바뀌는가?
    - 삼각형 $\mathrm{OPQ}$에서 $\mathrm{OP}$, $\mathrm{OQ}$는 고정이다. $\cos\alpha$를 $\mathrm{PQ}=d$의 식으로 써 보자.
  - id: S1-B
    audience: B
    source_flow: 2024학년도 논술(KU논술우수자) 기출문제_자연A.pdf p.6-8 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        다음의 두 가지 경우로 나누어서 푼다.
        (1) 점 $\mathrm{P}$의 $y$좌표가 $1$보다 작거나 같을 때: 점 $\mathrm{P}$에서 점 $(0,1)$까지의 거리를 $d$라 하자. (단, $d>0$) 코사인법칙을 이용하면
        $$\cos\alpha=\frac{9+d^2-1}{6d}=\frac{4}{3d}+\frac d6\ge\frac{2\sqrt2}{3}$$
        [그림: $\mathrm{P}$가 $y=1$보다 아래에 있을 때 $\mathrm{P}$에서 $\mathrm{O}$와 $(0,1)$로 그은 선분 사이 각 $\alpha$]
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (2) 점 $\mathrm{P}$의 $y$좌표가 $1$보다 클 때: 점 $\mathrm{P}$에서 점 $(1,1)$까지의 거리를 $d$라 하자. (단, $d>0$) 코사인법칙을 이용하면
        $$\cos\alpha=\frac{9+d^2-2}{6d}=\frac{7}{6d}+\frac d6\ge\frac{\sqrt7}{3}$$
        [그림: $\mathrm{P}$가 $y=1$보다 위에 있을 때 $\mathrm{P}$에서 $\mathrm{O}$와 $(1,1)$로 그은 선분 사이 각 $\alpha$, 정사각형의 대각선 $\mathrm{O}(1,1)$ 표시]
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        (1), (2)에 의하여 $\cos\alpha$의 최솟값은 $\dfrac{\sqrt7}{3}$이다.
      criteria: ['1.R1', '1.A1']
    - id: 1b-4
      content: |
        등호는 $\dfrac{7}{6d}=\dfrac d6$일 때 성립하고, 이때 $d=\sqrt7$이다. 점 $(1,1)$을 $\mathrm{Q}$라 하고 $d=\sqrt7$일 때 각 $\mathrm{POQ}$의 크기를 $\theta$라 하자.
        $$\cos\theta=\frac{9+2-7}{6\sqrt2}=\frac{\sqrt2}{3}$$
        이고, $0\le\theta\le\dfrac{\pi}{2}$이므로 $\sin\theta=\dfrac{\sqrt7}{3}$이다.
        [그림: $\mathrm{OP}=3$, $\mathrm{OQ}=\sqrt2$, $\mathrm{PQ}=\sqrt7$, $\angle\mathrm{POQ}=\theta$ 표시]
      criteria: ['1.M3']
    - id: 1b-5
      content: |
        점 $\mathrm{P}$의 $x$좌표는
        $$3\cos\left(\theta+\frac{\pi}{4}\right)=3\left(\cos\theta\cos\frac{\pi}{4}-\sin\theta\sin\frac{\pi}{4}\right)=1-\frac{\sqrt{14}}{2}$$
        이다. 점 $\mathrm{P}$의 $y$좌표는
        $$3\sin\left(\theta+\frac{\pi}{4}\right)=3\left(\sin\theta\cos\frac{\pi}{4}+\cos\theta\sin\frac{\pi}{4}\right)=1+\frac{\sqrt{14}}{2}$$
        이다.
      criteria: ['1.A2']
