        등호 조건 $d=\sqrt7$에서 $\angle\mathrm{POQ}=\theta$의 $\cos\theta=\dfrac{\sqrt2}{3}$, $\sin\theta=\dfrac{\sqrt7}{3}$을 구했다.
      depends_on: [1.M2]
      implied_ok: false
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 6
      evidence: |
        덧셈정리로 $\mathrm{P}\left(1-\dfrac{\sqrt{14}}{2},\ 1+\dfrac{\sqrt{14}}{2}\right)$를 얻었다.
      depends_on: [1.M3]
