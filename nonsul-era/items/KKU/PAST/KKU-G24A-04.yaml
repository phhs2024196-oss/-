  코사인법칙과 삼각함수의 덧셈정리를 활용하여 주어진 문제를 해결할 수 있는지 알아본다.
key_idea: |
  $\mathrm{P}$의 $y$좌표가 $1$ 이하이면 $\alpha=\angle\mathrm{OP}(0,1)$, $1$보다 크면 $\alpha=\angle\mathrm{OP}(1,1)$. 코사인법칙으로 $\cos\alpha=\dfrac{c}{6d}+\dfrac d6$ 꼴을 만들고 산술·기하 평균으로 최솟값 비교. 최소일 때 $\angle\mathrm{POQ}=\theta$를 구해 $\theta+\tfrac{\pi}{4}$의 덧셈정리로 좌표.
stuck: |
  $\mathrm{P}$에서 정사각형을 바라보는 양 끝 꼭짓점이 $\mathrm{P}$의 높이에 따라 달라짐(경우 분류), 그리고 $\cos\alpha$를 한 변수 $d$의 식으로 만드는 것.
