stimuli:
- label: 가
  body: |
    (제시문 1) 함수 $f(x)$가 $x=a$에서 극값을 갖고 $a$를 포함하는 어떤 열린구간에서 미분가능하면 $f^{\prime}(a)=0$이 성립한다.
- label: 나
  body: |
    그림에서 색칠된 도형 $\mathrm{R}$는 제 1사분면에 있고 다음 곡선들로 둘러싸여 있다.
    $$x=t,\quad x^2+y^2=1,\quad(x-t)^2+y^2=(1-t)^2$$

    [그림: 좌표축, 원점 $\mathrm{O}$, $x$축 위의 $t$와 $1$. $x=t$ 위치의 점선 세로선 위쪽 구간과, 그 오른쪽에서 $(1,0)$으로 내려오는 바깥 호(큰 원)와 안쪽 호(작은 원) 사이가 색칠된 초승달 모양 도형 $\mathrm{R}$. 두 호는 $(1,0)$에서 만난다.]

stem: |
  [문제 1] (나)에서 $t=\dfrac12$일 때의 도형 $\mathrm{R}$의 넓이를 구하고, 도형 $\mathrm{R}$의 넓이가 최대가 될 때의 $t$의 값을 구하시오. 풀이 과정도 쓰시오. [15점]

subparts:
- id: '1'
  stem: |
    $t=\dfrac12$일 때 $\mathrm{R}$의 넓이와, 넓이가 최대가 되는 $t$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'area_half = 5*pi/48 - sqrt(3)/8; t_max = (pi**2 - 4)/(pi**2 + 4)', equivalents: ['5π/48 − √3/8, t = (π²−4)/(π²+4)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(t)=\int_t^1\sqrt{1-x^2}dx-\tfrac{\pi}{4}(1-t)^2$, $f(\tfrac12)=\tfrac{5\pi}{48}-\tfrac{\sqrt3}{8}$, $f^{\prime}=0$에서 $t=\tfrac{\pi^2-4}{\pi^2+4}$.
    steps:
    - {id: 1a, content: '넓이 = 큰 원 조각 − 작은 사분원 → $t=\tfrac12$ 대입 → $f^{\prime}(t)=0$ 풀이 → 증감으로 최대 확인', criteria: ['1.M1', '1.A1', '1.M2', '1.R1', '1.A2']}
    hint_ladder:
    - 작은 원은 중심이 $(t,0)$, 반지름이 $1-t$이다. $x\ge t$, $y\ge0$ 부분의 넓이는?
    - 넓이를 $t$의 함수로 두고 미분해 보자.
  - id: S1-B
    audience: B
    source_flow: 2024학년도 논술(KU논술우수자) 기출문제_자연B.pdf p.3-4 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        [그림: 사분원 위에 $\mathrm{A}(t,0)$, $\mathrm{B}(1,0)$, 직선 $x=t$가 큰 원과 만나는 점 $\mathrm{C}$, 작은 원과 만나는 점 $\mathrm{D}$, $\angle\mathrm{AOC}=\theta$ 표시]
        $\mathrm{A}(t,0)$, $\mathrm{B}(1,0)$이라 하고 $x=t$가 큰 원 및 작은 원과 만나는 점을 각각 $\mathrm{C}$, $\mathrm{D}$라 하자. 각 $\mathrm{AOC}$의 크기를 $\theta$라 하자. 도형 $\mathrm{R}$의 넓이를 $f(t)$라 하자.
        $\mathrm{R}$의 넓이를 적분으로 표현하면
        $$f(t)=\int_t^1\sqrt{1-x^2}\,dx-\frac{\pi}{4}(1-t)^2=-\int_1^t\sqrt{1-x^2}\,dx-\frac{\pi}{4}(1-t)^2\qquad(1)$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $x=\cos\theta$로 치환하여 적분을 풀어서 $f(t)=\dfrac12\theta-\dfrac12t\sqrt{1-t^2}-\dfrac{\pi}{4}(1-t)^2$를 얻는다.
        $t=\dfrac12$일 때, $\theta=\dfrac{\pi}{3}$이므로
        $$f\left(\frac12\right)=\frac12\cdot\frac{\pi}{3}-\frac12\cdot\frac12\cdot\frac{\sqrt3}{2}-\frac{\pi}{4}\cdot\frac14=\frac{5\pi}{48}-\frac{\sqrt3}{8}$$
        따라서 $t=\dfrac12$일 때 $\mathrm{R}$의 넓이는 $\dfrac{5\pi}{48}-\dfrac{\sqrt3}{8}$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        (1)을 미분하여 $f^{\prime}(t)=-\sqrt{1-t^2}+\dfrac{\pi}{2}(1-t)$.
        $f^{\prime}(t)=0$으로부터 $\sqrt{1-t^2}=\dfrac{\pi}{2}(1-t)$.
        양변을 제곱하여 얻은 $1+t=\dfrac{\pi^2}{4}(1-t)$을 풀면 $t=\dfrac{\pi^2-4}{\pi^2+4}$에서 극값을 가진다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $0\le t\le\dfrac{\pi^2-4}{\pi^2+4}$일 때 $f^{\prime}(t)\ge0$이므로 $f(t)$는 증가, $\dfrac{\pi^2-4}{\pi^2+4}\le t\le1$일 때 $f^{\prime}(t)\le0$이므로 $f(t)$는 감소. 그러므로 $t=\dfrac{\pi^2-4}{\pi^2+4}$에서 $\mathrm{R}$의 넓이가 최대가 된다.
      criteria: ['1.R1', '1.A2']
