# 건국대 2024학년도 KU논술우수자 자연계 B [문제 1] — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 채점: 원본에 채점기준 없음. 아래 마크는 예시답안 단계를 따라 입력자가 나눈 자체 설계(공식 아님, 확인필요).
