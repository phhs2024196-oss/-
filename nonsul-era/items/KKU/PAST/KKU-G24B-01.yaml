intent: |
  주어진 상황을 함수로 표현하고, 극값을 활용하여 최댓값을 찾을 수 있는지 알아본다.
key_idea: |
  $f(t)=\displaystyle\int_t^1\sqrt{1-x^2}\,dx-\frac{\pi}{4}(1-t)^2$ (큰 원 조각 − 작은 사분원). 미분하면 $f^{\prime}(t)=-\sqrt{1-t^2}+\dfrac{\pi}{2}(1-t)$, $f^{\prime}(t)=0$에서 $t=\dfrac{\pi^2-4}{\pi^2+4}$.
stuck: |
  작은 원 $(x-t)^2+y^2=(1-t)^2$의 $x\ge t$, $y\ge0$ 부분이 사분원(넓이 $\tfrac{\pi}{4}(1-t)^2$)임을 보는 것, 그리고 넓이를 적분 상한이 $t$인 함수로 두어 바로 미분하는 것.
