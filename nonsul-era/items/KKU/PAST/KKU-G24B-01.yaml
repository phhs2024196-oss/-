    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 원본에 채점기준 없음 — 예시답안 단계 기준 자체 설계.
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\mathrm{R}$의 넓이를 $\displaystyle\int_t^1\sqrt{1-x^2}\,dx-\frac{\pi}{4}(1-t)^2$ (또는 동등한 부채꼴·삼각형 식)로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $t=\dfrac12$일 때 넓이 $\dfrac{5\pi}{48}-\dfrac{\sqrt3}{8}$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        $f^{\prime}(t)=-\sqrt{1-t^2}+\dfrac{\pi}{2}(1-t)$를 구하고 $f^{\prime}(t)=0$을 풀어 $t=\dfrac{\pi^2-4}{\pi^2+4}$를 얻었다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: |
        $f^{\prime}(t)$의 부호 변화(증가 → 감소)로 그 점에서 최대임을 밝혔다.
      depends_on: [1.M2]
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        최대가 되는 $t=\dfrac{\pi^2-4}{\pi^2+4}$를 답으로 적었다.
      depends_on: [1.M2]
      steps: [1b-4]
