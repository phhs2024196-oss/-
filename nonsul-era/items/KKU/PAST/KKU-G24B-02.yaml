    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        7개의 틈 중 A 바로 다음 틈 3개를 제외하고 B가 들어갈 수 있는 틈이 4개임을 밝혔다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.M3
      mark_type: M
      points: 3
      evidence: |
        4개의 틈에 B 5개를 넣는 수를 $x_1+x_2+x_3+x_4=5$의 음이 아닌 정수해 ${}_4\mathrm{H}_5={}_8\mathrm{C}_5$로 셌다.
      depends_on: [2.M2]
      implied_ok: false
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        답 $1120$을 얻었다.
      depends_on: [2.M1, 2.M3]
      steps: [2b-4]
    deductions: []
