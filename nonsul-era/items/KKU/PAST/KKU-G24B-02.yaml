stimuli:
- label: 가
  body: |
    (제시문 2) $n$개 중에서 서로 같은 것이 각각 $p$개, $q$개, $\cdots$, $r$개씩 있을 때, $n$개를 일렬로 나열하는 순열의 수는
    $$\frac{n!}{p!\times q!\times\cdots\times r!}\quad(\text{단, }p+q+\cdots+r=n)$$
- label: 나
  body: |
    [조건 1] 또는 [조건 2]를 만족하도록 문자 A 3개, B 5개, C 3개로 이루어진 11개의 문자 A, A, A, B, B, B, B, B, C, C, C를 왼쪽부터 일렬로 나열하자.

    [조건 1] 문자 C 바로 다음에는 항상 문자 B가 이웃하여 나온다.
    예를 들어, ACBBCBCBABA는 [조건 1]을 만족하고, ACBBCBCABBA는 [조건 1]을 만족하지 않는다.

    [조건 2] 문자 A 바로 다음에는 문자 B가 이웃하여 나오지 않는다.
    예를 들어, BACBACBBCBA는 [조건 2]를 만족하고, BACBACABBCB는 [조건 2]를 만족하지 않는다.

stem: |
