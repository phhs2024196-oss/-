- id: '2'
  stem: |
    (2) (나)에서 [조건 2]를 만족하도록 나열하는 방법의 수를 구하고 풀이 과정을 쓰시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1120', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: A·C 배열 $\dfrac{6!}{3!3!}=20$, A 바로 뒤 틈 3개를 뺀 4개 틈에 B 5개 ${}_4\mathrm{H}_5=56$ → $1120$.
    steps:
    - {id: 2a, content: '$20\times56=1120$', criteria: ['2.M1', '2.M2', '2.M3', '2.A1']}
    hint_ladder:
    - B를 빼고 A, C만 먼저 나열해 보자. B가 들어갈 수 있는 틈은 몇 개인가?
  - id: S2-B
    audience: B
    source_flow: 2024학년도 논술(KU논술우수자) 기출문제_자연B.pdf p.5 예시답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        1단계: A 3개와 C 3개를 일렬로 나열한 다음, 조건2를 만족하도록 B를 배치할 위치를 결정하면 된다. 먼저 [A][C][A][C][C][A] 처럼 A 3개와 C 3개를 일렬로 나열하는 방법의 수는 $\dfrac{6!}{3!3!}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        2단계: 이제, 아래와 같은 7개의 $*$ 위치에 조건을 만족하도록 5개의 B의 위치를 결정해야 한다.
        $$*\,\mathrm{A}\,*\,\mathrm{C}\,*\,\mathrm{A}\,*\,\mathrm{C}\,*\,\mathrm{C}\,*\,\mathrm{A}\,*$$
        7개의 $*$가 표시된 자리 중, A 바로 다음 자리 3자리는 제외하고 남은 4개의 $*$ 자리에 B 5개를 배치한다.
        $$*\,\mathrm{A}\ \mathrm{C}\,*\,\mathrm{A}\ \mathrm{C}\,*\,\mathrm{C}\,*\,\mathrm{A}$$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        첫 번째 $*$ 자리에 들어가는 B의 개수를 $x_1$, 두 번째 $*$ 자리에 들어가는 B의 개수를 $x_2$, 세 번째 $*$ 자리에 들어가는 B의 개수를 $x_3$, 네 번째 $*$ 자리에 들어가는 B의 개수를 $x_4$라고 할 때 B의 개수가 5개이므로 다음 방정식을 만족한다.
        $$x_1+x_2+x_3+x_4=5,\quad x_i\ge0\ (i=1,2,3,4)$$
        따라서 방정식의 음이 아닌 정수 해의 개수는 ${}_4\mathrm{H}_5={}_{4+5-1}\mathrm{C}_5={}_8\mathrm{C}_5$이므로
      criteria: ['2.M3']
    - id: 2b-4
      content: |
        조건을 만족하는 방법의 수는
        $$\frac{6!}{3!3!}\times{}_8\mathrm{C}_5=\frac{6!}{3!3!}\times\frac{8!}{3!5!}=1120$$
        이다.
      criteria: ['2.A1']
