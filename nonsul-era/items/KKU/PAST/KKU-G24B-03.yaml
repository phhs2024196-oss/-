key_idea: |
  교점 $\mathrm{C}$에 대해 $\angle\mathrm{AOC}=\alpha$, 이등변삼각형 $\mathrm{OAC}$에서 $\angle\mathrm{OAC}=\pi-2\alpha$. 부채꼴 두 개에서 삼각형을 빼 $S(t)=\alpha+t^2(\pi-2\alpha)-t\sin\alpha$, $\cos\alpha=\dfrac1{2t}$를 미분해 $\dfrac{d\alpha}{dt}$를 얻는다.
stuck: |
  공통 부분을 (부채꼴 $\mathrm{OBC}$ + 부채꼴 $\mathrm{AOC}$ − 삼각형 $\mathrm{OAC}$)의 2배로 나누는 것, 그리고 $\alpha$를 $t$의 함수로 보고 $\cos\alpha=\tfrac1{2t}$를 음함수처럼 미분하는 것.
