    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 원본에 채점기준 없음 — 예시답안 단계 기준 자체 설계.
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        근과 계수의 관계로 $a+b=2$, $ab=-t$와 $a^2+b^2$, $a^4+b^4$을 $t$로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 9
      evidence: |
        $\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2=2(x-1)^2+2(y-t-2)^2+10(t+1)$, 즉 $2\overline{\mathrm{MP}}^2+10(t+1)$ ($\mathrm{M}(1,t+2)$)로 정리했다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 8
      evidence: |
        $\mathrm{M}$과 원의 중심이 $x=1$ 위에 있음을 이용해 $\overline{\mathrm{MP}}$의 최솟값을 $t$의 범위에 따라($\lvert t-5\rvert$, $\lvert t-7\rvert$) 구했다.
      depends_on: [1.M2]
      implied_ok: false
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 7
      evidence: |
        두 범위의 이차함수를 비교하여 $t=\dfrac52$에서 최소임을 보였다.
      depends_on: [1.M3]
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        제2사분면 조건으로 근을 골라 $\mathrm{A}\left(\dfrac{2-\sqrt{14}}{2},\dfrac{9-2\sqrt{14}}{2}\right)$를 얻었다.
      depends_on: [1.R1]
      steps: [1b-5]
    deductions: []
