stimuli:
- label: 가
  body: |
    (제시문 4) 좌표평면 위의 두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$ 사이의 거리는 $\overline{\mathrm{AB}}=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$
- label: 나
  body: |
    그림에서 점 $\mathrm{P}$는 중심이 점 $(1,8)$이고 반지름이 $1$인 원 위에 있다. 점 $\mathrm{A}$와 점 $\mathrm{B}$는 포물선 $y=x^2$과 직선 $y=2x+t$의 교점으로 점 $\mathrm{A}$는 제 2사분면에 점 $\mathrm{B}$는 제 1사분면에 있다. ($t$는 양의 실수)

    [그림: 좌표축과 원점 $O$. 포물선 $y=x^2$과 직선 $y=2x+t$가 제2사분면의 점 $A$(원점 근처 왼쪽)와 제1사분면의 점 $B$에서 만난다. $y$축 오른쪽 위에 작은 원이 있고 그 위에 점 $P$가 표시되어 있다.]

stem: |
  [문제 4] (나)에서 $\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2$의 값이 최소가 될 때의 점 $\mathrm{A}$의 좌표를 구하고 풀이 과정을 쓰시오. [35점]

subparts:
- id: '1'
  stem: |
    $\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2$이 최소가 될 때의 점 $\mathrm{A}$의 좌표를 구하시오.
  points: 35
  depends_on: []
  answer: {kind: expression, value: 'Ax = (2 - sqrt(14))/2; Ay = (9 - 2*sqrt(14))/2', equivalents: ['A((2-√14)/2, (9-2√14)/2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2=2\overline{\mathrm{MP}}^2+10(t+1)$, $\min_{\mathrm{P}}$ 후 $t$의 이차함수 최소 $t=\tfrac52$, $x^2-2x-\tfrac52=0$의 음근.
    steps:
    - {id: 1a, content: '근과 계수 → $2\overline{\mathrm{MP}}^2+10(t+1)$ → $\overline{\mathrm{MP}}$ 최소 경우 분류 → $t=\tfrac52$ → $\mathrm{A}$', criteria: ['1.M1', '1.M2', '1.M3', '1.R1', '1.A1']}
    hint_ladder:
    - $a$, $b$는 $x^2-2x-t=0$의 두 근이다. 거리 제곱의 합을 $a+b$, $ab$로 정리해 보자.
    - 식을 $(x-1)^2$, $(y-\square)^2$의 꼴로 묶으면 어떤 점과 $\mathrm{P}$ 사이 거리가 보이는가?
  - id: S1-B
    audience: B
    source_flow: 2024학년도 논술(KU논술우수자) 기출문제_자연B.pdf p.6-7 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        좌표를 $\mathrm{A}(a,a^2)$, $\mathrm{B}(b,b^2)$, $\mathrm{P}(x,y)$라 하자. $a$와 $b$는 $x^2=2x+t$ 즉 $x^2-2x-t=0$의 근이므로 근과 계수의 관계에서 다음이 성립한다.
        $$a+b=2,\quad ab=-t$$
        $$a^2+b^2=(a+b)^2-2ab=4+2t=2(t+2)$$
        $$a^4+b^4=(a^2+b^2)^2-2a^2b^2=4(t+2)^2-2t^2=2t^2+16t+16$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이를 이용하여 $\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2$을 계산하면 다음을 얻을 수 있다.
        $$\begin{aligned}\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2&=(x-a)^2+(y-a^2)^2+(x-b)^2+(y-b^2)^2\\&=2x^2-2(a+b)x+(a^2+b^2)+2y^2-2(a^2+b^2)y+(a^4+b^4)\\&=2x^2-4x+2(t+2)+2y^2-4(t+2)y+(2t^2+16t+16)\\&=2x^2-4x+2+2y^2-4(t+2)y+2(t+2)^2+2(t+1)+(8t+8)\\&=2(x-1)^2+2(y-t-2)^2+10(t+1)\end{aligned}$$
        $\mathrm{M}(1,t+2)$에 대하여 $\overline{\mathrm{MP}}^2=(x-1)^2+(y-t-2)^2$이므로 $\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2=2\overline{\mathrm{MP}}^2+10(t+1)$.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        또한 $\overline{\mathrm{MP}}$는 $\mathrm{M}$에서 원 $(x-1)^2+(y-8)^2=1$ 위의 점 $\mathrm{P}$에 이르는 거리이다. 그런데 점 $\mathrm{M}(1,t+2)$와 원의 중심이 모두 $x=1$ 위에 있으므로 $\mathrm{M}$에 가장 가까운 원 위의 점은 $t+2\le8$일 때는 $\mathrm{P}(1,7)$이고, $t+2\ge8$일 때는 $\mathrm{P}(1,9)$이다.
        이때 $\overline{\mathrm{MP}}=\begin{cases}\lvert(t+2)-7\rvert=\lvert t-5\rvert & (0<t\le6)\\\lvert(t+2)-9\rvert=\lvert t-7\rvert & (t\ge6)\end{cases}$
      criteria: ['1.M3']
    - id: 1b-4
      content: |
        $\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2=2\overline{\mathrm{MP}}^2+10(t+1)$로부터
        $0<t\le6$일 때,
        $$\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2=2(t-5)^2+10(t+1)=2t^2-10t+60=2\left(t-\frac52\right)^2+60-\frac{25}{2}$$
        $t\ge6$일 때,
        $$\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2=2(t-7)^2+10(t+1)=2t^2-18t+108=2\left(t-\frac92\right)^2+108-\frac{81}{2}$$
        따라서 $t=\dfrac52$일 때 $\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2$이 최소가 된다.
      criteria: ['1.R1']
    - id: 1b-5
      content: |
        이때 $\mathrm{A}$의 좌표는 $x^2-2x-\dfrac52=0$으로부터 $x=\dfrac{2\pm\sqrt{14}}{2}$, $y=2x+\dfrac52=\dfrac{9\pm2\sqrt{14}}{2}$이다. 점 $\mathrm{A}$는 제 2사분면의 점이므로 $\left(\dfrac{2-\sqrt{14}}{2},\dfrac{9-2\sqrt{14}}{2}\right)$이다.
      criteria: ['1.A1']
