  직선과 포물선의 교점과 근과 계수와의 관계를 활용할 수 있는지 알아본다.
key_idea: |
  근과 계수의 관계($a+b=2$, $ab=-t$)로 $\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2=2\overline{\mathrm{MP}}^2+10(t+1)$, $\mathrm{M}(1,t+2)$. $\mathrm{M}$과 원의 중심이 모두 $x=1$ 위에 있으므로 $\overline{\mathrm{MP}}$의 최솟값을 $t$로 나타내고, $t$에 대한 이차함수를 최소화($t=\tfrac52$).
stuck: |
  $\mathrm{P}$와 $t$ 두 변수의 최소를 "고정한 $t$에서 $\mathrm{P}$에 대한 최소 → $t$에 대한 최소"의 두 단계로 나누는 것, 그리고 식을 $2(x-1)^2+2(y-t-2)^2+10(t+1)$로 완전제곱하는 것.
