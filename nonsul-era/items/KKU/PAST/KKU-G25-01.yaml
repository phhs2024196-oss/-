stimuli:
- label: 가
  body: |
    두 각 $\alpha$, $\beta$의 삼각함수를 이용하여 $\alpha+\beta$, $\alpha-\beta$의 코사인함수를 나타내면 다음과 같고, 이를 코사인함수의 덧셈정리라고 한다.
    $$\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$$
    $$\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$$
- label: 나
  body: |
    좌표평면 위에서 점 $\mathrm{A}$는 중심이 원점 $\mathrm{O}$이고 반지름이 $3$인 원 $C$를 따라 움직이고, 점 $\mathrm{B}$는 중심이 $(7,0)$이고 반지름이 $1$인 원을 따라 움직인다. 점 $\mathrm{A}$의 시각 $t$에서의 위치 $(x,y)$가
    $$x=3\cos t,\ y=3\sin t$$
    이고, 점 $\mathrm{B}$의 시각 $t$에서의 위치 $(x,y)$가
    $$x=7+\cos3t,\ y=\sin3t$$
    이다.

    [그림: 좌표축과 원점 $\mathrm{O}$를 중심으로 하는 큰 원(원 $C$), 그리고 $x$축 위의 점 $(7,0)$을 중심으로 하는 작은 원이 그려져 있다. 큰 원 위 제2사분면 쪽($y$축 가까이 위쪽)에 점 $\mathrm{A}$가 있고 선분 $\mathrm{OA}$ 옆에 점선 호와 길이 $3$이 표시되어 있다. 작은 원의 중심에 $(7,0)$이 적혀 있고, 중심에서 작은 원의 아래쪽 점 $\mathrm{B}$까지 선분이 그어져 길이 $1$이 표시되어 있다.]

stem: |
  [문제 1] (20점)
  (나)에서 $t=0$부터 $t=2\pi$까지 점 $\mathrm{A}$와 $\mathrm{B}$가 움직이는 동안 선분 $\mathrm{AB}$와 원 $C$가 서로 다른 두 점에서 만나는 $t$의 범위를 구하고 풀이과정을 쓰시오.

subparts:
- id: '1'
  stem: |
    선분 $\mathrm{AB}$와 원 $C$가 서로 다른 두 점에서 만나는 $t$의 범위를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: set, value: 'Interval.open(pi/3, 5*pi/3)', equivalents: ['pi/3 < t < 5*pi/3'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 점에서 만남 $\iff\angle\mathrm{OAB}$ 예각 $\iff 2\cos^2t+7\cos t-1<3\iff\cos t<\tfrac12$.
    steps:
    - {id: 1a, content: '$\overline{\mathrm{AB}}^2+9>\overline{\mathrm{OB}}^2\iff 7\cos t+\cos2t<3\iff(2\cos t-1)(\cos t+4)<0$, 따라서 $\tfrac{\pi}{3}<t<\tfrac{5\pi}{3}$', criteria: ['1.M1', '1.M2', '1.M3', '1.R1', '1.A1']}
    hint_ladder:
    - 점 $\mathrm{A}$는 이미 원 $C$ 위에 있다. 선분이 원과 한 번 더 만나려면 $\angle\mathrm{OAB}$는 어때야 하는가?
    - $\cos t\cos3t+\sin t\sin3t$를 덧셈정리로 묶어 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2025 p.105 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        문제의 조건을 만족시키기 위해서는 각 $\mathrm{OAB}$가 예각이 되어야 하므로
        $$\overline{\mathrm{AB}}^2+3^2>\overline{\mathrm{OB}}^2$$
        에 해당한다. 이 식에 좌표를 대입하여 쓰면
        $$\{3\cos t-(7+\cos3t)\}^2+(3\sin t-\sin3t)^2+9>(7+\cos3t)^2+(\sin3t)^2$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이 식을 정리하면 $7\cos t+\cos t\cos3t+\sin t\sin3t<3$이고, 이 부등식의 좌변은 코사인함수의 덧셈정리에 의하여 $7\cos t+\cos2t$와 같으며,
        $$\cos2t=\cos(t+t)=\cos^2t-\sin^2t=2\cos^2t-1$$
        이므로 $7\cos t+\cos2t=2\cos^2t+7\cos t-1$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        부등식 $2\cos^2t+7\cos t-1<3$으로부터 $(2\cos t-1)(\cos t+4)<0$을 얻는다. $\cos t+4>0$이므로 $\cos t<\dfrac12$이다.
      criteria: ['1.M3', '1.R1']
    - id: 1b-4
      content: |
        따라서 $t$의 범위는 $\dfrac{\pi}{3}<t<\dfrac{5\pi}{3}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 공식 등급 → 마크: C=1.M1, B=+1.M2, B+=+1.M3, A(사소한 계산 실수 외 풀이 맞음)=+1.R1, A+(답과 풀이 맞음)=+1.A1.
    # D(의미 있는 시도)·F(공란·무관)는 마크 없음. 등급별 점수는 보고서에 없어 배점은 추정 분할.
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        (공식 C) 부등식 $\overline{\mathrm{AB}}^2+3^2>\overline{\mathrm{OB}}^2$ 또는 방정식 $\overline{\mathrm{AB}}^2+3^2=\overline{\mathrm{OB}}^2$을 $t$에 대한 식으로 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        (공식 B) 삼각함수의 덧셈정리를 이용하여 부등식 $2\cos^2t+7\cos t-1<3$ 또는 방정식 $2\cos^2t+7\cos t-1=3$을 얻었다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: |
        (공식 B+) $\cos t=u$라 두고 풀어 부등식 $u<\dfrac12$ 또는 접하는 경우의 방정식 $u=\dfrac12$을 얻었다.
      depends_on: [1.M2]
      implied_ok: false
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: |
        (공식 A) 풀이 전체(예각 조건 → 덧셈정리 → $\cos t<\tfrac12$ → $t$의 범위)가 맞다. 사소한 계산 실수는 이 단계까지 인정.
      depends_on: [1.M3]
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        (공식 A+) 답 $\dfrac{\pi}{3}<t<\dfrac{5\pi}{3}$(양 끝 제외)을 계산 실수 없이 얻었다.
      depends_on: [1.M3, 1.R1]
      steps: [1b-4]
    deductions: []
