intent: |
  좌표평면 위를 움직이는 점에 대하여 선분의 길이를 이용하여 문제를 해결할 수 있는지, 삼각함수의 덧셈정리를 이용할 수 있는지 알아본다.
key_idea: |
  점 $\mathrm{A}$가 원 $C$ 위에 있으므로 선분 $\mathrm{AB}$가 원 $C$와 두 점에서 만날 조건은 $\angle\mathrm{OAB}$가 예각, 즉 $\overline{\mathrm{AB}}^2+3^2>\overline{\mathrm{OB}}^2$이다.
