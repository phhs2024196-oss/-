stimuli:
- label: 가
  body: |
    두 반평면 $\alpha$, $\beta$의 교선을 $l$이라고 할 때, 두 반평면 $\alpha$, $\beta$로 이루어진 도형을 이면각이라고 한다. 또 직선 $l$을 이면각의 변, 두 반평면 $\alpha$, $\beta$를 각각 이면각의 면이라고 한다.
    직선 $l$ 위의 한 점 $\mathrm{O}$를 지나고 $l$에 수직인 두 반직선 $\mathrm{OA}$, $\mathrm{OB}$를 두 반평면 $\alpha$, $\beta$ 위에 각각 그을 때, $\angle\mathrm{AOB}$의 크기는 점 $\mathrm{O}$의 위치에 관계없이 일정하다.
    이 각의 크기를 이면각의 크기라고 한다. 서로 다른 두 평면이 만나서 생기는 이면각 중에서 그 크기가 크지 않은 쪽의 각을 두 평면이 이루는 각이라고 한다.
- label: 나
  body: |
    그림에서 사면체 $\mathrm{ABCD}$는 한 모서리의 길이가 $6$인 정사면체이고, 점 $\mathrm{E}$는 모서리 $\mathrm{BD}$ 위에 있는 점으로 $\overline{\mathrm{DE}}=2$이다. 일정한 길이를 가지는 선분 $\mathrm{PQ}$는 평면 $\mathrm{ABC}$ 위에 있으며 점 $\mathrm{A}$를 지난다.

    [그림: 정사면체 $\mathrm{ABCD}$가 그려져 있다. 꼭짓점 $\mathrm{D}$가 위, $\mathrm{A}$가 왼쪽, $\mathrm{B}$가 오른쪽 아래, $\mathrm{C}$가 오른쪽에 있고 모서리 $\mathrm{AC}$는 점선(뒤쪽)이다. 모서리 $\mathrm{BD}$ 위, $\mathrm{D}$에 가까운 쪽에 점 $\mathrm{E}$가 찍혀 있다. 점 $\mathrm{A}$를 지나는 짧은 선분 $\mathrm{PQ}$가 있어 $\mathrm{P}$는 $\mathrm{A}$의 왼쪽 위, $\mathrm{Q}$는 $\mathrm{A}$의 오른쪽 아래에 있다.]

stem: |
  [문제 2] (23점)
  (나)에서 사면체 $\mathrm{DEPQ}$의 부피가 최대일 때, 평면 $\mathrm{EPQ}$와 평면 $\mathrm{ABC}$가 이루는 각의 크기를 $\theta$라 하자. $\cos\theta$의 값을 구하고 풀이과정을 쓰시오.

subparts:
- id: '1'
  stem: |
    사면체 $\mathrm{DEPQ}$의 부피가 최대일 때 $\cos\theta$의 값을 구하시오.
  points: 23
  depends_on: []
  answer: {kind: value, value: 'sqrt(15)/5', equivalents: ['3/sqrt(15)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 부피를 $\tfrac13V(\mathrm{BDPQ})$로 바꾸면 $\triangle\mathrm{BPQ}$ 최대 $\iff\mathrm{PQ}\perp\mathrm{AB}$. $\mathrm{E}$의 정사영 $\mathrm{F}$에서 $\overline{\mathrm{FG}}=4$, $\overline{\mathrm{EF}}=\tfrac{4\sqrt6}{3}$.
    steps:
    - {id: 1a, content: '$\cos\theta=\dfrac{\overline{\mathrm{FG}}}{\overline{\mathrm{EG}}}=\dfrac{4}{\sqrt{16+\frac{32}{3}}}=\dfrac{\sqrt{15}}{5}$', criteria: ['1.M1', '1.B1', '1.B2', '1.A1']}
    hint_ladder:
    - 사면체 $\mathrm{DEPQ}$와 사면체 $\mathrm{BDPQ}$의 부피 사이에는 어떤 관계가 있는가?
    - 밑면을 평면 $\mathrm{ABC}$ 위의 $\triangle\mathrm{BPQ}$로 보면, 넓이가 최대가 되는 것은 언제인가?
    - 점 $\mathrm{E}$에서 평면 $\mathrm{ABC}$와 직선 $\mathrm{PQ}$에 수선을 내리고 삼수선의 정리를 쓰자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2025 p.105~106 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각형 $\mathrm{PDE}$의 넓이는 삼각형 $\mathrm{PDB}$의 넓이의 $\dfrac13$이므로 사면체 $\mathrm{DEPQ}$의 부피는 사면체 $\mathrm{BDPQ}$의 부피의 $\dfrac13$이다. 따라서 사면체 $\mathrm{DEPQ}$의 부피가 최대이기 위해서는 사면체 $\mathrm{BDPQ}$의 부피가 최대이어야 한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        점 $\mathrm{D}$에서 평면 $\mathrm{ABC}$에 내린 수선의 발을 $\mathrm{H}$라 하자. 점 $\mathrm{H}$는 삼각형 $\mathrm{ABC}$의 무게중심이다. 사면체 $\mathrm{BDPQ}$의 부피는 $\dfrac13\times$(삼각형 $\mathrm{BPQ}$의 넓이)$\times\overline{\mathrm{DH}}$이므로 삼각형 $\mathrm{BPQ}$의 넓이가 최대이어야 한다. 이때는 선분 $\mathrm{PQ}$와 선분 $\mathrm{AB}$가 수직일 때이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        [그림: 평면 $\mathrm{ABC}$를 위에서 본 정삼각형 $\mathrm{ABC}$. $\mathrm{AB}$가 밑변, $\mathrm{C}$가 위. $\mathrm{A}$를 지나고 $\mathrm{AB}$에 수직인 선분 $\mathrm{PQ}$($\mathrm{P}$ 위, $\mathrm{Q}$ 아래). $\mathrm{BC}$의 중점 $\mathrm{M}$, 무게중심 $\mathrm{H}$, 선분 $\mathrm{HB}$ 위의 점 $\mathrm{F}$, $\mathrm{F}$에서 $\mathrm{PQ}$에 내린 수선의 발 $\mathrm{G}$, $\mathrm{AB}$에 내린 수선의 발 $\mathrm{F'}$.]
        선분 $\mathrm{PQ}$와 선분 $\mathrm{AB}$가 수직이라고 하자. 점 $\mathrm{E}$에서 평면 $\mathrm{ABC}$에 내린 수선의 발을 $\mathrm{F}$, 점 $\mathrm{F}$에서 직선 $\mathrm{PQ}$에 내린 수선의 발을 $\mathrm{G}$라 하면, 삼수선의 정리에 의해 직선 $\mathrm{EG}$와 직선 $\mathrm{PQ}$는 수직으로 만난다. 직각삼각형 $\mathrm{EFG}$에서 $\theta$는 각 $\mathrm{EGF}$의 크기와 같으므로 $\cos\theta=\dfrac{\overline{\mathrm{FG}}}{\overline{\mathrm{EG}}}$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $\overline{\mathrm{FG}}$를 구하자. 점 $\mathrm{F}$에서 선분 $\mathrm{AB}$에 내린 수선의 발을 $\mathrm{F'}$이라 하면 $\overline{\mathrm{FG}}=\overline{\mathrm{AF'}}=\overline{\mathrm{AB}}-\overline{\mathrm{BF'}}=6-3\times\dfrac23=4$이다.
      criteria: ['1.B1']
    - id: 1b-5
      content: |
        $\overline{\mathrm{DH}}$와 $\overline{\mathrm{EF}}$를 구하자. 삼각형 $\mathrm{AHD}$는 직각삼각형이고 $\overline{\mathrm{AD}}=6$이다. 선분 $\mathrm{BC}$의 중점을 $\mathrm{M}$이라고 하면 선분 $\mathrm{AM}$은 점 $\mathrm{H}$를 지나고 $\overline{\mathrm{AH}}=\dfrac23\times\overline{\mathrm{AM}}=\dfrac23\times3\sqrt3=2\sqrt3$이다.
        따라서 $\overline{\mathrm{DH}}=\sqrt{\overline{\mathrm{AD}}^2-\overline{\mathrm{AH}}^2}=\sqrt{36-12}=\sqrt{24}=2\sqrt6$이고, $\overline{\mathrm{EF}}=\dfrac23\times\overline{\mathrm{DH}}=\dfrac23\times2\sqrt6=\dfrac{4\sqrt6}{3}$이다.
      criteria: ['1.B2']
    - id: 1b-6
      content: |
        $\overline{\mathrm{EG}}$를 구하자. 직각삼각형 $\mathrm{EFG}$에서 $\overline{\mathrm{EG}}=\sqrt{\overline{\mathrm{EF}}^2+\overline{\mathrm{FG}}^2}=\sqrt{\dfrac{32}{3}+16}=\sqrt{\dfrac{80}{3}}=\dfrac{4\sqrt{15}}{3}$.
        따라서 $\cos\theta=\dfrac{\overline{\mathrm{FG}}}{\overline{\mathrm{EG}}}=\dfrac{4}{\frac{4\sqrt{15}}{3}}=\dfrac{3}{\sqrt{15}}=\dfrac{3\sqrt{15}}{15}=\dfrac{\sqrt{15}}{5}$이다.
      criteria: ['1.B2', '1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 공식 등급 → 마크: C(EG 또는 FG 하나)=1.B1 또는 1.B2 중 하나, B(PQ⊥AB 최대)=1.M1,
    # B+=1.M1+길이 하나, A=1.M1+1.B1+1.B2, A+(답과 풀이)=+1.A1. D·F 는 마크 없음. 배점은 추정 분할.
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: |
        (공식 B) 선분 $\mathrm{PQ}$와 선분 $\mathrm{AB}$가 수직일 때 사면체 $\mathrm{DEPQ}$의 부피가 최대임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: |
        (공식 C 의 한 갈래) $\overline{\mathrm{FG}}=4$를 구했다.
      depends_on: []
      steps: [1b-4]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: |
        (공식 C 의 다른 갈래) $\overline{\mathrm{EF}}=\dfrac{4\sqrt6}{3}$를 거쳐 $\overline{\mathrm{EG}}=\dfrac{4\sqrt{15}}{3}$를 구했다.
      depends_on: []
      steps: [1b-5, 1b-6]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: |
        (공식 A+) 삼수선의 정리로 $\cos\theta=\dfrac{\overline{\mathrm{FG}}}{\overline{\mathrm{EG}}}$임을 밝히고 $\cos\theta=\dfrac{\sqrt{15}}{5}$를 얻었다.
      depends_on: [1.M1, 1.B1, 1.B2]
      steps: [1b-3, 1b-6]
    deductions: []
