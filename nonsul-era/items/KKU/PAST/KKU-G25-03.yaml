intent: |
  삼각함수의 미분과 합성함수의 미분을 이용하여, 각의 변화에 대한 길이의 변화율을 구할 수 있는지 알아본다. 네 변의 길이가 정해진 사각형의 대각선의 길이와 각의 관계를 이용한다.
