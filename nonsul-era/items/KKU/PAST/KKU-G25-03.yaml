stimuli:
- label: 가
  body: |
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는
    $$\frac{dy}{dx}=\frac{dy}{du}\times\frac{du}{dx}\quad\text{또는}\quad\{f(g(x))\}'=f'(g(x))g'(x)$$
- label: 나
  body: |
    그림에서 사각형 $\mathrm{ABCD}$의 각 변의 길이가 각각 $\overline{\mathrm{AB}}=\sqrt3$, $\overline{\mathrm{BC}}=2$, $\overline{\mathrm{CD}}=2$, $\overline{\mathrm{DA}}=1$이다. $\angle\mathrm{BAD}$의 크기가 $\theta$일 때 대각선 $\mathrm{AC}$의 길이는 $\theta$의 함수 $f(\theta)$이다.

    [그림: 사각형 $\mathrm{ABCD}$. $\mathrm{A}$는 왼쪽 아래, $\mathrm{B}$는 오른쪽 아래로 $\mathrm{AB}$가 수평이고, $\mathrm{C}$는 오른쪽 위, $\mathrm{D}$는 왼쪽($\mathrm{A}$의 약간 왼쪽 위)에 있다. 꼭짓점 $\mathrm{A}$에서 $\mathrm{AB}$와 $\mathrm{AD}$ 사이의 각에 호와 $\theta$가 표시되어 있고, 대각선 $\mathrm{AC}$가 그어져 있으며 그 옆 점선 호에 $f(\theta)$가 적혀 있다.]

stem: |
  [문제 3] (27점)
  (나)에서 미분계수 $f'\!\left(\dfrac{\pi}{2}\right)$를 구하고 풀이과정을 쓰시오.

subparts:
- id: '1'
  stem: |
    미분계수 $f'\!\left(\dfrac{\pi}{2}\right)$를 구하시오.
  points: 27
  depends_on: []
  answer: {kind: value, value: '-sqrt(21)/7', equivalents: ['-sqrt(3)/sqrt(7)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\phi=\angle\mathrm{ABC}$를 두고 $\overline{\mathrm{CD}}=2$ 관계식을 미분해 $\phi'(\tfrac{\pi}{2})=-\tfrac12$, 코사인법칙 $f^2=7-4\sqrt3\cos\phi$를 미분.
    steps:
    - {id: 1a, content: '$2f f\prime=4\sqrt3\phi\prime\sin\phi$에서 $\theta=\tfrac{\pi}{2}$: $2\sqrt7f\prime=4\sqrt3\cdot(-\tfrac12)$, $f\prime(\tfrac{\pi}{2})=-\tfrac{\sqrt{21}}{7}$', criteria: ['1.M1', '1.M2', '1.A1', '1.A2']}
    hint_ladder:
    - $f(\theta)$를 바로 쓰기 어렵다면 $\angle\mathrm{ABC}$를 새 변수로 두어 보자.
    - $\overline{\mathrm{CD}}=2$라는 조건을 좌표로 나타내면 $\theta$와 $\phi$ 사이의 관계식이 된다.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2025 p.107 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        [그림: 사각형 $\mathrm{ABCD}$에서 $\mathrm{D}$를 지나는 수평선과 $\mathrm{C}$에서 내린 수직선이 만나는 점 $\mathrm{H}$(직각 표시), $\mathrm{C}$에서 $\mathrm{AB}$의 연장선 방향으로 내린 수직선(직각 표시).]
        $\angle\mathrm{ABC}$를 $\phi$라고 하자. 그림의 직각삼각형 $\mathrm{CDH}$에서 $\overline{\mathrm{DH}}=\lvert\sqrt3-\cos\theta-2\cos\phi\rvert$, $\overline{\mathrm{CH}}=\lvert2\sin\phi-\sin\theta\rvert$이므로
        $$(1)\quad 4=(\sqrt3-\cos\theta-2\cos\phi)^2+(2\sin\phi-\sin\theta)^2$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\phi$를 $\theta$의 함수로 보고 $\theta$에 대해 미분하면
        $$(2)\quad 0=(\sqrt3-\cos\theta-2\cos\phi)(\sin\theta+2\phi'\sin\phi)+(2\sin\phi-\sin\theta)(2\phi'\cos\phi-\cos\theta)$$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\theta=\dfrac{\pi}{2}$이면 $\phi=\dfrac{\pi}{2}$, $f(\theta)=\sqrt7$이고 식 (2)는 $0=\sqrt3\left(1+2\phi'\!\left(\dfrac{\pi}{2}\right)\right)$이 된다.
      criteria: ['1.B1']
    - id: 1b-4
      content: |
        따라서 $\phi'\!\left(\dfrac{\pi}{2}\right)=-\dfrac12$.
      criteria: ['1.A1']
    - id: 1b-5
      content: |
        코사인법칙에 따라 $f(\theta)^2=4+3-4\sqrt3\cos\phi$. 이 식을 $\theta$에 대해 미분하면 $2f(\theta)f'(\theta)=4\sqrt3\phi'(\theta)\sin\phi$.
        $\theta=\dfrac{\pi}{2}$일 때 $f'(\theta)=-\dfrac{\sqrt3}{\sqrt7}=-\dfrac{\sqrt{21}}{7}$.
      criteria: ['1.A2']
