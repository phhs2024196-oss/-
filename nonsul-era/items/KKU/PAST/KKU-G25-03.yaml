  $\angle\mathrm{ABC}=\phi$를 $\theta$의 함수로 두고, 변 $\mathrm{CD}=2$를 좌표(직각삼각형 $\mathrm{CDH}$)로 나타낸 관계식을 $\theta$로 미분해 $\phi'\!\left(\tfrac{\pi}{2}\right)=-\tfrac12$을 얻은 뒤, 코사인법칙 $f(\theta)^2=7-4\sqrt3\cos\phi$를 미분한다.
