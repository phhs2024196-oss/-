# 건국대 2025학년도 KU논술우수자 자연계 [문제 3] — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 채점: 보고서 채점기준은 등급(A+·A·B+·B·C·D·F)만 있고 등급별 점수는 없다. 아래 마크 배점은 등급 단계를 마크로 옮긴 추정 분할이다.
# 보고서 예시답안의 (답) 줄은 「f'(θ)=-√21/7」로 인쇄되어 있으나 문맥상 f'(π/2) 의 값이다.
