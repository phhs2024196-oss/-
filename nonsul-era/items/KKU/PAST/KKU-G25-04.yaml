stimuli:
- label: 가
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(x)\ge0$일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^bf(x)dx$$
- label: 나
  body: |
    [그림 1], [그림 2]와 같이 좌표평면 위에 곡선 $y=x^2\ (x\ge0)$과 점 $\mathrm{P}(0,10)$이 있다. 점 $\mathrm{A}$와 $\mathrm{B}$는 곡선 위에 있고 $\angle\mathrm{OPA}=\theta$이다.
    [그림 1]에서 곡선과 선분 $\mathrm{OP}$, 선분 $\mathrm{PA}$로 둘러싸인 도형의 넓이가 $f(\theta)$이다. (단, $\mathrm{O}$는 원점이고 $0<\theta<\pi$이다.)
    [그림 2]에서 $\angle\mathrm{APB}=\dfrac{\pi}{2}$이고 곡선과 선분 $\mathrm{PA}$, 선분 $\mathrm{PB}$로 둘러싸인 도형의 넓이가 $g(\theta)$이다.
    $0<\theta<\dfrac{\pi}{2}$일 때, 두 함수 $f(\theta)$와 $g(\theta)$ 사이에는 다음과 같은 관계가 있다.
    $$g(\theta)=f\left(\theta+\frac{\pi}{2}\right)-f(\theta)$$

    [그림: [그림 1] 좌표평면에 곡선 $y=x^2\ (x\ge0)$, $y$축 위의 점 $\mathrm{P}$, 곡선 위의 점 $\mathrm{A}$가 있고, $\mathrm{P}$에서 선분 $\mathrm{PO}$(아래 방향)와 선분 $\mathrm{PA}$ 사이의 각에 $\theta$가 표시되어 있다. $y$축(선분 $\mathrm{OP}$), 선분 $\mathrm{PA}$, 곡선으로 둘러싸인 부분이 회색으로 칠해져 있다. [그림 2] 같은 곡선과 점 $\mathrm{P}$, 곡선 위의 점 $\mathrm{A}$(아래쪽)와 $\mathrm{B}$(위쪽)가 있고, $\mathrm{P}$에서 $\mathrm{PA}$와 $\mathrm{PB}$ 사이에 직각 표시, $\mathrm{PO}$와 $\mathrm{PA}$ 사이에 $\theta$가 표시되어 있다. 선분 $\mathrm{PA}$, 선분 $\mathrm{PB}$, 곡선으로 둘러싸인 부분이 회색으로 칠해져 있다.]

