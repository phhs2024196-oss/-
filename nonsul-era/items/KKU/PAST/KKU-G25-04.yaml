  - '$\angle\mathrm{OPA}=\theta$일 때 곡선·선분 $\mathrm{OP}$·선분 $\mathrm{PA}$로 둘러싸인 넓이 $f(\theta)$'
  - '$\angle\mathrm{APB}=\tfrac{\pi}{2}$일 때 곡선·선분 $\mathrm{PA}$·선분 $\mathrm{PB}$로 둘러싸인 넓이 $g(\theta)=f(\theta+\tfrac{\pi}{2})-f(\theta)$'
  concepts:
  - '곡선과 축 사이의 넓이(정적분)'
  - '사다리꼴의 넓이'
  - '탄젠트함수의 미분, $\sec^2\theta=1+\tan^2\theta$'
  - '합성함수의 미분법(매개변수 $t$를 통한 미분)'
  - '두 직선의 수직 조건(기울기의 곱 $-1$)'
  - '대칭식 $a^2+b^2$, $ab$와 $b^3-a^3$'
  tools:
  - '$f=$사다리꼴 $\mathrm{OPAQ}-\int_0^tx^2dx$'
  - '$\tan\theta=\dfrac{t}{10-t^2}$을 $\theta$로 미분해 $\dfrac{dt}{d\theta}$ 구하기'
  - '$f\prime(\theta)=\dfrac{df}{dt}\cdot\dfrac{dt}{d\theta}$'
  - '$(a^2-b^2)(a^2+b^2-19)=0$, $(ab-9)(ab+10)=0$ 인수분해'
  conditions:
  - '$0<\theta<\pi$, $0<\theta<\tfrac{\pi}{2}$에서 $g$ 정의'
  - '$a\ne b$이므로 $a^2\ne b^2$; $a,b>0$이므로 $ab>0$'
  stimuli_used: [가, 나]
  subpart_links: '(2)는 (1)의 $f\prime(\theta)$ 식을 $t=a$, $t=b$에 적용'

