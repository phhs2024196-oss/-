intent: |
  곡선 사이의 넓이를 적분을 이용하여 구할 수 있는지, 합성함수를 미분할 수 있는지, 삼각함수를 미분할 수 있는지 알아본다. 제시된 조건으로부터 넓이를 정적분으로 표현하고 삼각함수·합성함수의 미분으로 주어진 식을 미분한다.
key_idea: |
  $f(\theta)=\dfrac{t}{2}(10+t^2)-\displaystyle\int_0^tx^2dx=\dfrac16t^3+5t$와 $\tan\theta=\dfrac{t}{10-t^2}$에서 $\dfrac{dt}{d\theta}$를 구해 $f'(\theta)=\dfrac{(10-t^2)^2+t^2}{2}$. $g'(\theta)=0\iff f'(\theta)=f'\!\left(\theta+\tfrac{\pi}{2}\right)$에서 $a^2+b^2=19$, 수직 조건에서 $ab=9$.
stuck: |
  넓이를 $\theta$ 대신 $t$로 표현하고 $t$를 $\theta$의 함수로 보아 미분하는 것, 그리고 $g'(\theta)=0$을 $f'$ 값이 같다는 대칭식으로 바꿔 $a^2\ne b^2$로 인수를 나누는 단계
idea_tags: [IDEA-PARAM-CHANGE-AREA-DIFF, IDEA-SYMMETRIC-FUNCTIONS-AB]
tags: [넓이 함수, 매개변수 미분, 수직 조건, 대칭식]
