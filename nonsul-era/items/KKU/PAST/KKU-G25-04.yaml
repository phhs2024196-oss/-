  [문제 4] (30점)

subparts:
- id: '1'
  stem: |
    (나)에서 점 $\mathrm{A}$의 $x$좌표가 $t$일 때, $f'(\theta)$를 $t$의 식으로 표현하시오.
  points: 8
  depends_on: []
  answer: {kind: expression, value: '((10 - t**2)**2 + t**2)/2', equivalents: ['(t**4 - 19*t**2 + 100)/2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f=\tfrac16t^3+5t$, $\tan\theta=\tfrac{t}{10-t^2}$을 미분해 $\tfrac{dt}{d\theta}=\tfrac{(10-t^2)^2+t^2}{10+t^2}$.
    steps:
    - {id: 1a, content: '$f\prime(\theta)=\left(\tfrac12t^2+5\right)\dfrac{dt}{d\theta}=\dfrac{(10-t^2)^2+t^2}{2}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 넓이를 $t$로 나타내 보자. 사다리꼴에서 무엇을 빼면 되는가?
    - $\theta$와 $t$의 관계를 탄젠트로 쓰고 양변을 $\theta$로 미분하자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2025 p.108 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{A}$에서 $x$축에 내린 수선의 발을 $\mathrm{Q}$라 하면 사다리꼴 $\mathrm{OPAQ}$의 넓이 $\dfrac{t}{2}(10+t^2)$에서 $x$축과 곡선 사이의 넓이를 뺀 값이 $f(\theta)$이다. 따라서
        $$f(\theta)=\frac{t}{2}(10+t^2)-\int_0^tx^2dx=\frac16t^3+5t.$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\mathrm{A}$에서 $y$축에 내린 수선의 발을 $\mathrm{H}$라 하면 직각삼각형 $\mathrm{APH}$에서 $\tan\theta=\dfrac{t}{10-t^2}$이다. $t$가 $\theta$의 함수이므로, 양변을 $\theta$에 대하여 미분하면 $\sec^2\theta=\dfrac{10+t^2}{(10-t^2)^2}\dfrac{dt}{d\theta}$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $\sec^2\theta=1+\tan^2\theta=1+\left(\dfrac{t}{10-t^2}\right)^2=\dfrac{(10-t^2)^2+t^2}{(10-t^2)^2}$이므로
        $$\frac{dt}{d\theta}=\frac{(10-t^2)^2+t^2}{10+t^2},\qquad f'(\theta)=\left(\frac12t^2+5\right)\frac{dt}{d\theta}=\frac{(10-t^2)^2+t^2}{2}.$$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 공식 C(문제 (1)의 답이 맞음) = 1.M1+1.A1. 배점은 추정 분할.
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $f(\theta)=\dfrac16t^3+5t$와 $\tan\theta=\dfrac{t}{10-t^2}$(또는 $\theta$와 $t$의 동치 관계)를 세우고 $\theta$에 대해 미분하는 식을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        (공식 C) $f'(\theta)=\dfrac{dt}{d\theta}\cdot\left(\dfrac12t^2+5\right)=\dfrac{(10-t^2)^2+t^2}{2}$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    (나)에서 $g'(\theta)=0$일 때 점 $\mathrm{A}$, $\mathrm{B}$의 $x$좌표를 각각 $a$, $b$라 하자. 이때 $a^2+b^2$, $ab$, $g(\theta)$의 값을 모두 구하고 풀이과정을 쓰시오.
  points: 22
  depends_on: ['1']
  answer: {kind: value, value: 'a**2+b**2 = 19; a*b = 9; g = 29/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(\theta)=f'(\theta+\tfrac{\pi}{2})$에서 $(a^2-b^2)(a^2+b^2-19)=0$, 수직 조건 $(a^2-10)(b^2-10)+ab=0$에서 $ab=9$, $b-a=1$.
    steps:
    - {id: 2a, content: '$a^2+b^2=19$, $ab=9$, $g=\tfrac16(b^3-a^3)+5(b-a)=\tfrac{28}{6}+5=\tfrac{29}{3}$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $g'(\theta)=0$은 $f'$의 두 값이 같다는 뜻이다.
    - $\overline{\mathrm{PA}}\perp\overline{\mathrm{PB}}$를 기울기로 쓰고 $a^2+b^2=19$를 대입하자.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2025 p.108~109 예시답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f'(\theta)=\dfrac{(10-a^2)^2+a^2}{2}$이고 같은 방법으로 $f'\!\left(\theta+\dfrac{\pi}{2}\right)=\dfrac{(10-b^2)^2+b^2}{2}$이다.
        $g'(\theta)=0$일 때 $f'(\theta)=f'\!\left(\theta+\dfrac{\pi}{2}\right)$이므로 다음이 성립한다.
        $$(*)\quad \frac{(10-b^2)^2+b^2}{2}=\frac{(10-a^2)^2+a^2}{2}$$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서
        $$\{a^2+(a^2-10)^2\}-\{b^2+(b^2-10)^2\}=a^2-b^2+(a^2-10)^2-(b^2-10)^2=(a^2-b^2)+(a^2-b^2)(a^2+b^2-20)=(a^2-b^2)(a^2+b^2-19)=0$$
        $a^2\ne b^2$이어야 하므로 $a^2+b^2=19$를 얻는다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        또한 $\overline{\mathrm{AP}}$와 $\overline{\mathrm{BP}}$가 수직이므로
        $$(**)\quad \frac{a^2-10}{a}\cdot\frac{b^2-10}{b}=-1$$
        이고 $(a^2-10)(b^2-10)+ab=0$.
        $$(a^2-10)(b^2-10)+ab=a^2b^2-10(a^2+b^2)+100+ab=(ab)^2-10\cdot19+100+ab=(ab)^2+ab-90=(ab-9)(ab+10)$$
        이로부터 $ab=9$를 얻는다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $a^2+b^2=19$와 $ab=9$를 연립하여 풀면 $a+b=\sqrt{37}$이고,
        $$a=\frac{\sqrt{37}-1}{2},\qquad b=\frac{\sqrt{37}+1}{2}.$$
        이때 $b-a=1$이고 $b^3-a^3=(b-a)(b^2+ba+a^2)=19+9=28$이다.
        이때 $g(\theta)$의 값은
        $$g(\theta)=\left(\frac16b^3+5b\right)-\left(\frac16a^3+5a\right)=\frac16(b^3-a^3)+5(b-a)=\frac{28}{6}+5=\frac{29}{3}.$$
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 공식 B+ = (*)·(**) 중 하나, A = (*)와 (**) 모두, A+ = 답과 풀이. D·F 는 마크 없음. 배점은 추정 분할.
    criteria:
    - id: 2.M1
      mark_type: M
      points: 7
      evidence: |
        (공식 B+/A) $g'(\theta)=0$에서 $f'(\theta)=f'\!\left(\theta+\dfrac{\pi}{2}\right)$인 관계식 (*)을 세우고 $a^2+b^2=19$를 이끌었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 7}
      steps: [2b-1, 2b-2]
    - id: 2.M2
      mark_type: M
      points: 7
      evidence: |
        (공식 B+/A) $\overline{\mathrm{AP}}\perp\overline{\mathrm{BP}}$에서 관계식 (**) $\dfrac{a^2-10}{a}\cdot\dfrac{b^2-10}{b}=-1$을 세우고 $ab=9$를 이끌었다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 8
      evidence: |
        (공식 A+) $a^2+b^2=19$, $ab=9$, $g(\theta)=\dfrac{29}{3}$을 모두 바르게 구했다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

