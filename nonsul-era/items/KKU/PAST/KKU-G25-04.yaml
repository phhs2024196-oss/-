# 채점: 보고서 채점기준은 문제 전체(30점)에 대한 등급(A+·A·B+·B·C·D·F)만 있고 등급별 점수·소문항별 배점이 없다.
# 아래 소문항 배점 (1) 8 / (2) 22 와 마크 배점은 등급 단계를 마크로 옮긴 추정 분할이다(공식 B 등급은 표에 없음).
