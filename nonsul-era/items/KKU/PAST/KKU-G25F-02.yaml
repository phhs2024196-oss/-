stimuli:
- label: 2-1(가)
  body: |
    제시문 2-1
    (가) 미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고 $x=a$의 좌우에서
    (1) $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고,
    (2) $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.
- label: 2-1(나)
  body: |
    (나) 그림에서 점 $\mathrm{A}$는 곡선 $y=x^3+x+3\ (x\ge0)$ 위에 있고, 점 $\mathrm{B}$는 직선 $y=4x-2$ 위에 있다. 선분 $\mathrm{AB}$는 원점 $\mathrm{O}$를 지난다.
    [그림: 좌표평면($x$축, $y$축, 원점 $\mathrm{O}$). 곡선 $y=x^3+x+3$은 $y$축 위의 점 $(0,3)$에서 시작해 제1사분면에서 오른쪽 위로 올라가고, 직선 $y=4x-2$는 제3사분면에서 제1사분면으로 비스듬히 지나며 곡선의 오른쪽 아래에 그려져 있다. 점 $\mathrm{A}$는 $y$축 가까이 제1사분면의 곡선 위에, 점 $\mathrm{B}$는 제3사분면의 직선 $y=4x-2$ 위에 있고, 선분 $\mathrm{AB}$가 원점 $\mathrm{O}$를 지난다. 라벨: $y=x^3+x+3$, $y=4x-2$, $\mathrm{A}$, $\mathrm{B}$, $\mathrm{O}$, $x$, $y$]
- label: 2-2(가)
  body: |
    제시문 2-2
    (가) 두 사건 $A,B$가 동시에 일어나지 않을 때, 사건 $A,B$가 일어나는 경우의 수가 각각 $m,n$이면 사건 $A$ 또는 사건 $B$가 일어나는 경우의 수는 $m+n$이다.
- label: 2-3(가)
  body: |
    제시문 2-3
    (가) 원의 중심과 직선 사이의 거리를 $d$, 원의 반지름의 길이를 $r$라고 하면 원과 직선의 위치 관계는 다음과 같다.
    (1) $d<r$이면 서로 다른 두 점에서 만난다.
    (2) $d=r$이면 한 점에서 만난다.(접한다.)
    (3) $d>r$이면 만나지 않는다.
- label: 2-3(나)
  body: |
    (나) 그림에서 원 $\mathrm{T}$는 반지름이 $1$이고 선분 $\mathrm{AB}$와 점 $\mathrm{P}$에서 접한다. $\overline{\mathrm{AB}}=4$이고 $\overline{\mathrm{AP}}=t$이다.
    [그림: 가로로 놓인 선분 $\mathrm{AB}$(왼쪽 끝 $\mathrm{A}$, 오른쪽 끝 $\mathrm{B}$) 위에 원 $\mathrm{T}$가 놓여 선분과 점 $\mathrm{P}$에서 접한다. $\mathrm{P}$는 $\mathrm{A}$와 $\mathrm{B}$ 사이, $\mathrm{A}$ 쪽에 더 가깝게 그려져 있다. 원의 중심(점)에서 원의 오른쪽 아래 둘레까지 반지름이 그어져 있고 길이 $1$이 표시되어 있다. 원 오른쪽 위에 라벨 $\mathrm{T}$. 라벨: $\mathrm{A}$, $\mathrm{P}$, $\mathrm{B}$, $\mathrm{T}$, $1$]

