- id: '3'
  stem: |
    [문제 2-3] (25점)
    (1) (나)에서 $t=\dfrac12$일 때 원 $\mathrm{T}$가 내접원인 삼각형 $\mathrm{ABC}$의 넓이를 구하고 풀이과정을 쓰시오.
    (2) (나)에서 원 $\mathrm{T}$가 내접원인 삼각형 $\mathrm{ABC}$가 존재할 $t$의 범위를 구하고 풀이과정을 쓰시오.
  points: 25
  depends_on: []
  answer: {kind: expression, value: 'area = 28/3; range = (2 - sqrt(3), 2 + sqrt(3))', equivalents: ['(1) 28/3, (2) 2-sqrt(3)<t<2+sqrt(3)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: (1) $\mathrm{A}(0,0)$, $\mathrm{B}(4,0)$, 중심 $\mathrm{E}(t,1)$로 두고 거리 $=1$ 조건으로 두 접선을 구해 교점 $\mathrm{C}$를 얻는다. (2) $\tan\dfrac{\mathrm{A}}{2}=\dfrac1t$, $\tan\dfrac{\mathrm{B}}{2}=\dfrac{1}{4-t}$이고 $\mathrm{A}+\mathrm{B}<\pi\iff\tan\dfrac{\mathrm{A}}{2}\tan\dfrac{\mathrm{B}}{2}<1$.
    steps:
    - {id: 3a-1, content: '(1) $\mathrm{C}\left(-\dfrac72,\dfrac{14}{3}\right)$, 넓이 $\dfrac12\cdot4\cdot\dfrac{14}{3}=\dfrac{28}{3}$', criteria: ['3.M1', '3.A1']}
    - {id: 3a-2, content: '(2) $t(4-t)>1\iff t^2-4t+1<0\iff 2-\sqrt3<t<2+\sqrt3$', criteria: ['3.M2', '3.A2', '3.A3']}
    hint_ladder:
    - 내접원의 중심에서 각 변까지의 거리는 모두 반지름과 같다.
    - 내접원의 중심과 꼭짓점 $\mathrm{A}$를 이은 선분은 각 $\mathrm{A}$를 이등분한다.
    - 삼각형이 만들어지려면 두 밑각의 합이 얼마보다 작아야 하는가?
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2025 p.123-124 예시답안
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1) $\mathrm{A}(0,0)$, $\mathrm{B}(4,0)$, 원의 중심을 $\mathrm{E}(t,1)$이라 하자(예시답안 [그림 1]: 원이 변 $\mathrm{AC}$에 접하는 점을 $\mathrm{Q}$라 하면 $\overline{\mathrm{AQ}}=\overline{\mathrm{AP}}=t$).
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        직선 $\mathrm{AC}$의 기울기를 $m$이라 하면, 직선 $\mathrm{AC}$의 방정식은 $y=mx\ (m\ne0)$이다. 직선 $\mathrm{AC}$와 점 $\mathrm{E}$ 사이의 거리가 내접원의 반지름 $1$과 같으므로 $\dfrac{\left\lvert1-m\cdot\frac12\right\rvert}{\sqrt{m^2+1}}=1$, 따라서 $m=-\dfrac43$이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        직선 $\mathrm{BC}$의 기울기를 $n$이라 하면, 직선 $\mathrm{BC}$의 방정식은 $y=n(x-4)\ (n\ne0)$이다. 직선 $\mathrm{BC}$와 점 $\mathrm{E}$ 사이의 거리가 내접원의 반지름 $1$과 같으므로 $\dfrac{\left\lvert n\cdot\frac12-1-4n\right\rvert}{\sqrt{n^2+1}}=1$이다. 그러므로 $n=-\dfrac{28}{45}$이다.
      criteria: ['3.M1']
    - id: 3b-4
      content: |
        직선 $\mathrm{AC}$ $y=-\dfrac43x$와 직선 $\mathrm{BC}$ $y=-\dfrac{28}{45}(x-4)$의 교점을 구하면 $\mathrm{C}\left(-\dfrac72,\,\dfrac{14}{3}\right)$이다(예시답안 [그림 2]: $\mathrm{C}$는 $\mathrm{A}$의 왼쪽 위에 있어 각 $\mathrm{A}$가 둔각).
      criteria: ['3.M1']
    - id: 3b-5
      content: |
        따라서 삼각형의 넓이는 $\dfrac12\times\overline{\mathrm{AB}}\times(\mathrm{C}$의 $y$좌표$)=\dfrac{28}{3}$이다.
      criteria: ['3.A1']
    - id: 3b-6
      content: |
        (2) 삼각형 $\mathrm{ABC}$가 만들어지려면 $\mathrm{A}+\mathrm{B}<\pi$이어야 한다. 즉 $\pi-\mathrm{A}>\mathrm{B}$이므로 $\dfrac{\pi}{2}-\dfrac{\mathrm{A}}{2}>\dfrac{\mathrm{B}}{2}$, 따라서 $\tan\left(\dfrac{\pi}{2}-\dfrac{\mathrm{A}}{2}\right)>\tan\dfrac{\mathrm{B}}{2}$이다.
      criteria: ['3.M2']
    - id: 3b-7
      content: |
        그런데, $\tan\left(\dfrac{\pi}{2}-\dfrac{\mathrm{A}}{2}\right)=\dfrac{\sin\left(\frac{\pi}{2}-\frac{\mathrm{A}}{2}\right)}{\cos\left(\frac{\pi}{2}-\frac{\mathrm{A}}{2}\right)}=\dfrac{\cos\frac{\mathrm{A}}{2}}{\sin\frac{\mathrm{A}}{2}}=\dfrac{1}{\tan\frac{\mathrm{A}}{2}}$이므로 $\tan\dfrac{\mathrm{A}}{2}\tan\dfrac{\mathrm{B}}{2}<1$이다.
      criteria: ['3.M2']
    - id: 3b-8
      content: |
        $\tan\dfrac{\mathrm{A}}{2}=\dfrac1t$, $\tan\dfrac{\mathrm{B}}{2}=\dfrac{1}{4-t}$이고 $t(4-t)>1$ 즉 $t^2-4t+1<0$이므로
      criteria: ['3.A2']
    - id: 3b-9
      content: |
        $2-\sqrt3<t<2+\sqrt3$이다.
      criteria: ['3.A3']
