intent: |
  [문제2-1] 두 직선의 교점을 구하고 두 점 사이의 거리를 구하며 미분을 이용하여 함수의 최솟값을 구할 수 있는지 알아본다.
  [문제2-2] 두 사건이 동시에 일어나지 않을 때 각각의 사건이 일어나는 경우의 수를 합하여 빠짐없이 셀 수 있는지 알아본다.
  [문제2-3] 좌표평면에서 원과 직선의 위치 관계를 이해하고 점과 직선의 거리와 두 직선의 평행조건을 삼각함수를 응용하여 구할 수 있는지 알아본다(문항해설: 원의 접선을 이용하여 주어진 원을 내접원으로 갖는 삼각형을 찾고 그 넓이를 구할 수 있는지 알아본다).
key_idea: |
  (2-1) 비 $\dfrac{\overline{\mathrm{OA}}}{\overline{\mathrm{OB}}}$를 $\mathrm{A}$의 $x$좌표 $a$의 식 $\dfrac{\lvert a^3-3a+3\rvert}{2}$로 바꿔 미분으로 최소를 찾는다. (2-2) 합 $k=12,16,20,24,28$로 나눠 센다. (2-3) 내접원의 중심과 꼭짓점을 잇는 선이 각의 이등분선이므로 $\tan\dfrac{\mathrm{A}}{2}=\dfrac1t$, $\tan\dfrac{\mathrm{B}}{2}=\dfrac{1}{4-t}$이고 삼각형 존재 조건은 $\mathrm{A}+\mathrm{B}<\pi$이다.
stuck: |
  (2-1) 두 길이의 비를 한 변수의 함수로 정리하는 단계, (2-3)(2) 삼각형이 존재할 조건을 $\mathrm{A}+\mathrm{B}<\pi$로 세우고 반각의 탄젠트로 바꾸는 발상
