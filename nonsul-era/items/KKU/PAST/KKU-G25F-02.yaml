subparts:
- id: '1'
  stem: |
    [문제 2-1] (나)에서 $\dfrac{\overline{\mathrm{OA}}}{\overline{\mathrm{OB}}}$의 최솟값을 구하고 풀이과정을 쓰시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: ['0.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{A}(a,a^3+a+3)$로 두고 직선 $\mathrm{OA}$와 $y=4x-2$의 교점 $\mathrm{B}$를 구하면 비는 $\dfrac{\lvert a^3-3a+3\rvert}{2}$이고, $a^3-3a+3$은 $a=1$에서 최솟값 $1$을 갖는다.
    steps:
    - {id: 1a, content: '$\dfrac{\overline{\mathrm{OA}}}{\overline{\mathrm{OB}}}=\dfrac{\lvert a^3-3a+3\rvert}{2}\ge\dfrac12$ (등호 $a=1$)', criteria: ['1.A2', '1.A3']}
    hint_ladder:
    - 점 $\mathrm{A}$의 $x$좌표를 $a$로 두면 직선 $\mathrm{OA}$의 기울기는?
    - $\mathrm{O}$, $\mathrm{A}$, $\mathrm{B}$가 한 직선 위에 있으므로 길이의 비는 $x$좌표의 비와 같다.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2025 p.121-122 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{A}(a,\,a^3+a+3)$이라 하자. 1) $a=0$일 때 점 $\mathrm{A}$의 좌표는 $(0,3)$이고 선분 $\mathrm{AB}$는 $\mathrm{O}$를 지나므로 점 $\mathrm{B}$의 좌표는 $(0,-2)$이다. 따라서 $\dfrac{\overline{\mathrm{OA}}}{\overline{\mathrm{OB}}}=\dfrac32$이다.
      criteria: ['1.A3']
    - id: 1b-2
      content: |
        2) $a\ne0$일 때 직선 $\mathrm{OA}$의 방정식은 $y=\dfrac{a^3+a+3}{a}x$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $\dfrac{a^3+a+3}{a}x=4x-2$에서 $x=\dfrac{2a}{4a-(a^3+a+3)}$이고, 점 $\mathrm{B}$의 좌표는 $\left(\dfrac{2a}{4a-(a^3+a+3)},\,\dfrac{2(a^3+a+3)}{4a-(a^3+a+3)}\right)$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $\overline{\mathrm{OA}}=\sqrt{a^2+(a^3+a+3)^2}$이고, $\overline{\mathrm{OB}}=\sqrt{\dfrac{4(a^2+(a^3+a+3)^2)}{(4a-(a^3+a+3))^2}}=\dfrac{2\sqrt{a^2+(a^3+a+3)^2}}{\lvert a^3-3a+3\rvert}$이다. 따라서 $\dfrac{\overline{\mathrm{OA}}}{\overline{\mathrm{OB}}}=\dfrac{\lvert a^3-3a+3\rvert}{2}$이다.
      criteria: ['1.A2']
    - id: 1b-5
      content: |
        $f(x)=x^3-3x+3\ (x\ge0)$이라 하자. $f'(x)=3x^2-3=3(x-1)(x+1)$이다. $f'(1)=0$이고 $f'(x)$는 $x=1$의 좌우에서 부호가 음에서 양으로 바뀐다. 따라서 $x\ge0$일 때 $f(x)$는 $x=1$의 좌우에서 감소하다가 증가한다. 그러므로 $x\ge0$일 때 $f(x)$의 최솟값은 $f(1)=1$이고 $f(x)\ge0$이다. 따라서 $x\ge0$일 때 $\lvert f(x)\rvert$의 최솟값은 $f(1)=1$이다.
      criteria: ['1.A3']
    - id: 1b-6
      content: |
        $\dfrac{\overline{\mathrm{OA}}}{\overline{\mathrm{OB}}}$의 최솟값은 $\dfrac{f(1)}{2}=\dfrac12$이다. 1)과 2)에서 $\dfrac{\overline{\mathrm{OA}}}{\overline{\mathrm{OB}}}$의 최솟값은 $\dfrac12$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 공식 채점기준(보고서 p.120)은 등급형(A+·A·B+·B·C·D·F)이고 등급별 점수는 공개되지 않음.
    # 아래 마크는 공식 등급 항목(C→B→A→A+)을 그대로 한 행씩 옮긴 것이며, 점수 배분(3·3·4·5)은 입력자 추정.
    official_grades:
    - 'A+: 답과 풀이가 맞음.'
    - 'A: $\dfrac{\overline{\mathrm{OA}}}{\overline{\mathrm{OB}}}=\dfrac{\lvert a^3-3a+3\rvert}{2}$를 구함'
    - 'B+: 점 B의 좌표 $\left(\dfrac{2a}{4a-(a^3+a+3)},\,\dfrac{2(a^3+a+3)}{4a-(a^3+a+3)}\right)$를 구함. 그리고, $\dfrac{\overline{\mathrm{OA}}}{\overline{\mathrm{OB}}}$를 $a$에 대하여 구하였으나 사소한 계산 실수가 있음.'
    - 'B: 점 B의 좌표 $\left(\dfrac{2a}{4a-(a^3+a+3)},\,\dfrac{2(a^3+a+3)}{4a-(a^3+a+3)}\right)$를 구함.'
    - 'C: 직선 OA의 방정식 $y=\dfrac{a^3+a+3}{a}x$을 구함.'
    - 'D: 풀이와 관계있는 의미있는 시도를 함.'
    - 'F: 답안이 공란이거나 문제와 관련 없는 내용을 적음.'
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        (공식 C) 직선 $\mathrm{OA}$의 방정식 $y=\dfrac{a^3+a+3}{a}x$를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        (공식 B) 점 $\mathrm{B}$의 좌표 $\left(\dfrac{2a}{4a-(a^3+a+3)},\,\dfrac{2(a^3+a+3)}{4a-(a^3+a+3)}\right)$를 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        (공식 A) $\dfrac{\overline{\mathrm{OA}}}{\overline{\mathrm{OB}}}=\dfrac{\lvert a^3-3a+3\rvert}{2}$를 구했다. (공식 B+: 비를 $a$의 식으로 구했으나 사소한 계산 실수가 있으면 이 마크 일부)
      depends_on: [1.M1, 1.A1]
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 5
      evidence: |
        (공식 A+) 도함수의 부호 변화로 $x\ge0$에서 $a^3-3a+3$의 최솟값 $1$($a=1$)을 밝히고($a=0$인 경우 포함) 최솟값 $\dfrac12$를 답했다.
      depends_on: [1.M1, 1.A2]
      steps: [1b-1, 1b-5, 1b-6]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

- id: '2'
  stem: |
    [문제 2-2]
    9장의 카드에 1부터 9까지의 자연수가 각각 하나씩 적혀있고, 각 카드에 적혀있는 숫자는 서로 다르다. 이 중에서 $4$장의 카드를 동시에 뽑았을 때 카드에 적힌 수의 합이 $4$의 배수가 되는 경우의 수를 구하고 풀이과정을 쓰시오. [20점]
  points: 20
  depends_on: []
  answer: {kind: value, value: '32', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 네 수의 합은 $10$ 이상 $30$ 이하이므로 합이 $12,16,20,24,28$인 경우로 나누어(합의 법칙) 각각 센다.
    steps:
    - {id: 2a, content: '$2+8+12+8+2=32$', criteria: ['2.M1', '2.A4']}
    hint_ladder:
    - 네 수의 합이 가질 수 있는 최솟값과 최댓값은?
