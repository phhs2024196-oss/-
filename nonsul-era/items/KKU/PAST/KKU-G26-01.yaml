stimuli:
- label: 가
  body: |
    좌표평면 위의 점 $(x,\,y)$를 원점에 대하여 대칭이동한 점의 좌표는 $(-x,\,-y)$이다.
- label: 나
  body: |
    그림에서 점 $\mathrm{A}$는 제1사분면 위의 점으로 곡선 $y=e^x$ 위에 있다. 점 $\mathrm{B}$는 곡선 $y=\ln x$ 위의 점으로 직선 $\mathrm{AB}$의 기울기는 $-1$이다. 점 $\mathrm{C}$는 점 $\mathrm{A}$를 원점에 대하여 대칭이동한 점이다.

    [그림: 좌표축과 원점 O. 곡선 $y=e^x$(왼쪽 위로 가파르게 올라감)와 곡선 $y=\ln x$(오른쪽으로 완만하게 올라감)가 그려져 있다. 점 A는 $y=e^x$ 위의 제1사분면 점($y$축 가까이), 점 B는 $y=\ln x$ 위의 제1사분면 점으로 A의 오른쪽 아래에 있고 선분 AB가 그어져 있다. 점 C는 제3사분면에 있고, 선분 AC(원점 O를 지남)와 선분 CB가 그어져 삼각형 ACB를 이룬다.]

stem: |
  [문제 1] (17점)

  (나)에서 $\angle\mathrm{ACB}$의 크기가 최소일 때 점 $\mathrm{A}$의 좌표를 구하고 풀이과정을 쓰시오.

subparts:
- id: '1'
  stem: |
    (나)에서 $\angle\mathrm{ACB}$의 크기가 최소일 때 점 $\mathrm{A}$의 좌표를 구하고 풀이과정을 쓰시오.
  points: 17
  depends_on: []
  answer: {kind: value, value: '(1, e)', equivalents: ['(1, E)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: B는 A의 $y=x$ 대칭점, C는 원점 대칭점이므로 $\angle\mathrm{AOB}=2\angle\mathrm{ACB}$. 원점에서 그은 접선일 때 $\angle\mathrm{AOB}$ 최소 → $a=1$.
    steps:
    - {id: 1a, content: '$\angle\mathrm{ACB}=\tfrac12\angle\mathrm{AOB}$, 접선 $y=e^ax$가 $(a,e^a)$를 지나므로 $a=1$, $\mathrm{A}(1,e)$', criteria: ['1.M1', '1.R1', '1.M2', '1.A1']}
    hint_ladder:
    - 기울기가 $-1$인 직선은 직선 $y=x$와 어떤 관계인가?
    - 세 점 A, B, C에서 원점까지의 거리를 비교해 보자.
    - $\angle\mathrm{AOB}$가 가장 작아지는 것은 직선 OA가 어떤 직선일 때인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2026 p.97 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{A}$의 좌표를 $(a,e^a)$이라 하자. 점 $\mathrm{A}$와 점 $\mathrm{B}$는 직선 $y=x$에 대하여 대칭이고 점 $\mathrm{A}$와 점 $\mathrm{C}$는 원점에 대하여 대칭이므로 $\overline{\mathrm{OA}}=\overline{\mathrm{OB}}=\overline{\mathrm{OC}}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        삼각형 $\mathrm{OBC}$는 이등변삼각형이고
        $$\angle\mathrm{AOB}=\angle\mathrm{OCB}+\angle\mathrm{OBC}=2\angle\mathrm{OCB}=2\angle\mathrm{ACB}.$$
        따라서 $\angle\mathrm{AOB}$의 크기가 최소일 때 $\angle\mathrm{ACB}$의 크기가 최소이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $y=e^x$의 그래프와 $y=\ln x$의 그래프가 직선 $y=x$에 대하여 대칭이고 점 $\mathrm{A}$와 점 $\mathrm{B}$가 직선 $y=x$에 대하여 대칭이므로, 직선 $\mathrm{OA}$가 곡선 $y=e^x$의 접선일 때 직선 $\mathrm{OB}$도 곡선 $y=\ln x$의 접선이고 이때 $\angle\mathrm{AOB}$의 크기가 최소이다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        직선 $\mathrm{OA}$가 곡선 $y=e^x$의 점 $\mathrm{A}$에서의 접선이라고 하자. $\dfrac{d}{dx}(e^x)=e^x$이므로 직선 $\mathrm{OA}$의 기울기는 $e^a$이고, 직선 $\mathrm{OA}$의 방정식은 $y=e^ax$이다.
      criteria: ['1.M2']
    - id: 1b-5
      content: |
        이 직선이 점 $\mathrm{A}(a,e^a)$를 지나므로 $e^a=e^a\times a$이다. 따라서 $a=1$이고 답은 $(1,e)$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        (공식 등급 C) $\angle\mathrm{AOB}$의 크기가 최소일 때 $\angle\mathrm{ACB}$의 크기가 최소임을 적었다($\overline{\mathrm{OA}}=\overline{\mathrm{OB}}=\overline{\mathrm{OC}}$, $\angle\mathrm{AOB}=2\angle\mathrm{ACB}$ 등 근거).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: |
        (공식 등급 B) 직선 $\mathrm{OA}$가 곡선 $y=e^x$의 접선일 때 $\angle\mathrm{ACB}$의 크기가 최소임을 적었다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        (공식 등급 B+) 직선 $\mathrm{OA}$의 방정식 $y=e^ax$를 구했다.
      depends_on: [1.R1]
      implied_ok: false
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        (공식 등급 A+) $a=1$, 점 $\mathrm{A}$의 좌표 $(1,e)$를 구했다.
      depends_on: [1.M2]
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 풀이가 맞았으나 사소한 계산 실수가 있음(공식 등급 A)
      effect: minus
      value: 2
