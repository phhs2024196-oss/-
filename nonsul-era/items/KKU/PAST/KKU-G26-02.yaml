stimuli:
- label: 가
  body: |
    자연수의 거듭제곱의 합에 대하여 다음이 성립한다.
    $$\sum_{k=1}^{n}k=\frac{n(n+1)}{2},\qquad \sum_{k=1}^{n}k^2=\frac{n(n+1)(2n+1)}{6},\qquad \sum_{k=1}^{n}k^3=\left\{\frac{n(n+1)}{2}\right\}^2$$
- label: 나
  body: |
    이산확률변수 $X$의 확률질량함수가 $\mathrm{P}(X=x_i)=p_i\ (i=1,\,2,\,\cdots,\,n)$일 때, $X$의 기댓값 $\mathrm{E}(X)$는
    $\mathrm{E}(X)=x_1p_1+x_2p_2+\cdots+x_np_n$

stem: |
  [문제 2] (23점)

  $n$장의 카드가 들어 있는 상자가 있다. 각각의 카드에는 $1$부터 $n$까지 자연수 중 한 개가 적혀 있고, 서로 다른 카드에 적혀 있는 자연수는 서로 다르다. 이 상자에서 임의로 카드 3장을 동시에 꺼낼 때, 꺼낸 카드에 적혀 있는 세 수 중 가장 큰 수에서 가장 작은 수를 뺀 값을 확률변수 $X$라 하자. (단, $n$은 $3$ 이상의 자연수)

subparts:
- id: '1'
  stem: |
    $n=10$일 때, $\mathrm{P}(X=9)$를 구하고 풀이과정을 쓰시오.
  points: 6
  depends_on: []
  answer: {kind: value, value: '1/15', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 차가 9이면 가장 작은 수 1, 가장 큰 수 10으로 고정되고 가운데 수만 8가지.
    steps:
    - {id: 1a, content: '$\mathrm{P}(X=9)=\dfrac{8}{{}_{10}\mathrm{C}_3}=\dfrac{1}{15}$', criteria: ['1.B1']}
    hint_ladder:
    - 1부터 10까지에서 차가 9인 두 수는 무엇뿐인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2026 p.97 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        10장의 카드가 들어 있는 상자에서 세 장의 카드를 꺼내는 방법의 수는 ${}_{10}\mathrm{C}_3$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        카드에 적힌 수 중 가장 큰 수와 가장 작은 수의 차가 9이면, 가장 큰 수는 10, 가장 작은 수는 1이다. 나머지 수는 $2,3,\cdots,9$의 8가지 경우가 가능하다. 따라서
        $$\mathrm{P}(X=9)=\frac{8}{{}_{10}\mathrm{C}_3}=\frac{1}{15}$$
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 6
      evidence: |
        (공식 등급 C) $\mathrm{P}(X=9)=\dfrac{1}{15}$을 구했다(전체 ${}_{10}\mathrm{C}_3$, 최소 1·최대 10 고정, 가운데 수 8가지).
      depends_on: []
      steps: [1b-1, 1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

- id: '2'
  stem: |
    $\mathrm{E}(X)=30$일 때, $n$을 구하고 풀이과정을 쓰시오.
  points: 17
  depends_on: ['1']
  answer: {kind: value, value: '59', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}(X=k)=\dfrac{(n-k)(k-1)}{{}_n\mathrm{C}_3}$, 거듭제곱의 합으로 $\mathrm{E}(X)=\dfrac{n+1}{2}=30$.
    steps:
    - {id: 2a, content: '$\mathrm{E}(X)=\dfrac{1}{{}_n\mathrm{C}_3}\sum_{k=1}^{n}k(n-k)(k-1)=\dfrac{n+1}{2}$, $n=59$', criteria: ['2.M1', '2.M2', '2.A1', '2.A2']}
    hint_ladder:
    - 가장 작은 수를 $a$라 하면 가장 큰 수는 무엇인가? 가운데 수는 몇 가지인가?
    - $k(n-k)(k-1)$을 전개해 제시문 (가)의 공식을 쓰자.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2026 p.97~98 예시답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\mathrm{P}(X=k)$를 구하자. (단, $2\le k\le n-1$)
        $n$장의 카드가 들어 있는 상자에서 세 장의 카드를 꺼내는 방법의 수는 ${}_n\mathrm{C}_3$이다. 세 장의 카드에 적힌 수 중 가장 큰 수와 가장 작은 수의 차가 $k$이므로, 세 장의 카드에 적힌 수를 크기순으로 $a$, $b$, $c$라 하면 $c=a+k$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $a+k\le n$이므로 $a\le n-k$이다. 따라서 $a$가 될 수 있는 수는 $1,2,\cdots,n-k$로 $n-k$가지이다. 각각의 $a$에 대하여 $a<b<a+k$이므로 $b$는 $a+1$부터 $a+k-1$까지의 수 중 하나이다. 따라서 각각의 $a$에 대하여 $b$가 될 수 있는 수는 $k-1$가지이다. 따라서 카드에 적힌 세 개의 수 중 가장 큰 수에서 가장 작은 수를 뺀 값이 $k$인 것은 총 $(n-k)\times(k-1)$가지가 있다.
        따라서 $\mathrm{P}(X=k)=\dfrac{(n-k)(k-1)}{{}_n\mathrm{C}_3}$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        기댓값은
        $$\mathrm{E}(X)=\frac{1}{{}_n\mathrm{C}_3}\sum_{k=2}^{n-1}k(n-k)(k-1)=\frac{1}{{}_n\mathrm{C}_3}\sum_{k=1}^{n}k(n-k)(k-1)=\frac{1}{{}_n\mathrm{C}_3}\sum_{k=1}^{n}\left(-k^3+(n+1)k^2-nk\right)$$
        $$=\frac{6}{n(n-1)(n-2)}\left\{-\frac{n^2(n+1)^2}{4}+\frac{n(n+1)^2(2n+1)}{6}-\frac{n^2(n+1)}{2}\right\}$$
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $$=\frac{n+1}{2}$$
      criteria: ['2.A1']
    - id: 2b-5
      content: |
        $\mathrm{E}(X)=30$이므로 $\dfrac{n+1}{2}=30$이고, $n=59$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: |
        (공식 등급 B) $\mathrm{P}(X=k)=\dfrac{(n-k)(k-1)}{{}_n\mathrm{C}_3}$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: |
        (공식 등급 B+) $\mathrm{E}(X)$를 $n$에 관한 식으로 나타냈다(간단히 정리하지 못해도 인정).
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        (공식 등급 A 의 둘째 경우) $\mathrm{E}(X)=\dfrac{n+1}{2}$을 구했다.
      depends_on: [2.M2]
      steps: [2b-4]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        (공식 등급 A+) $\dfrac{n+1}{2}=30$에서 $n=59$를 구했다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-5]
    deductions:
    - code: D2-1
      condition: 풀이가 맞았으나 사소한 계산 실수가 있음(공식 등급 A 의 첫째 경우)
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}

