intent: |
  조합, 이산확률변수, 확률변수의 기댓값을 이해하고 이를 활용하여 문제를 해결할 수 있는지 알아본다. 거듭제곱의 합을 구할 수 있는지 알아본다.
key_idea: |
  가장 작은 수 $a$를 정하면 가장 큰 수는 $a+k$, 가운데 수는 $k-1$가지이므로 $\mathrm{P}(X=k)=\dfrac{(n-k)(k-1)}{{}_n\mathrm{C}_3}$이고, 거듭제곱의 합으로 $\mathrm{E}(X)=\dfrac{n+1}{2}$.
stuck: |
  최댓값과 최솟값의 차가 $k$인 세 수의 조합 수를 「최솟값 선택 × 가운데 수 선택」으로 세는 것, 그리고 $\sum k(n-k)(k-1)$을 거듭제곱의 합 공식으로 정리하는 계산
