key_idea: |
  $\mathrm{P}(b,b^2+1)$로 두면 $l_1\parallel l_2$에서 $\mathrm{Q}(a-b,-b^2)$, 수직 조건에서 $a=4b^3+4b$. $L$을 $b$의 함수로 쓰고 $\dfrac{dL}{da}=\dfrac{dL}{db}\times\dfrac{db}{da}$(역함수의 미분)로 계산한다.
stuck: |
