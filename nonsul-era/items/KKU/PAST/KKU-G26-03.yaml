stimuli:
- label: 가
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는
    $$\frac{dy}{dx}=\frac{dy}{du}\times\frac{du}{dx}\quad\text{또는}\quad y'=f'(g(x))g'(x)$$
- label: 나
  body: |
    그림에서 직선 $l_1$은 곡선 $y=x^2+1$ 위의 점 $\mathrm{P}$에서의 접선이고, 직선 $l_2$는 곡선 $y=-(x-a)^2$ 위의 점 $\mathrm{Q}$에서의 접선이다. 직선 $\mathrm{PQ}$는 직선 $l_1$, $l_2$와 각각 수직이다.

    [그림: 좌표축과 원점 O. 아래로 볼록한 포물선 $y=x^2+1$이 $y$축 위 $(0,1)$에서 최소이고, 그 오른쪽 가지 위 제1사분면에 점 P가 있으며 P에서 접선 $l_1$(오른쪽 위로 올라감)이 그어져 있다. 위로 볼록한 포물선 $y=-(x-a)^2$은 $x$축 위의 점 $a$(꼭짓점, $x$축에 표시 $a$)에서 $x$축에 접하고, 그 왼쪽 가지 위 제4사분면에 점 Q가 있으며 Q에서 접선 $l_2$(오른쪽 위로 올라감, $l_1$과 평행하게 보임)가 그어져 있다. 선분 PQ가 오른쪽 아래로 그어져 있고, P와 Q에 각각 직각 표시가 있다.]

stem: |
  [문제 3] (29점)

subparts:
- id: '1'
  stem: |
    (나)에서 $a=8$일 때, 점 $\mathrm{P}$의 좌표를 구하고 풀이과정을 쓰시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '(1, 2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $l_1\parallel l_2$에서 $c=8-b$, PQ ⊥ $l_1$에서 $b^3+b-2=0$, $b=1$.
    steps:
    - {id: 1a, content: '$2b\times\dfrac{-2b^2-1}{8-2b}=-1\Rightarrow(b-1)(b^2+b+2)=0$, $\mathrm{P}(1,2)$', criteria: ['1.B1']}
    hint_ladder:
    - $l_1$과 $l_2$가 모두 직선 PQ에 수직이면 $l_1$과 $l_2$는 어떤 관계인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2026 p.98 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P}$의 좌표를 $(b,b^2+1)$이라고 하자. 점 $\mathrm{P}$에서의 접선 $l_1$의 기울기는 $2b$이다.
        점 $\mathrm{Q}$의 좌표를 $(c,-(c-8)^2)$이라고 하자. 점 $\mathrm{Q}$에서의 접선 $l_2$의 기울기는 $-2(c-8)$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        직선 $l_1$과 $l_2$가 평행하므로 $2b=-2(c-8)$이고 정리하면 $c=8-b$이다.
        직선 $\mathrm{PQ}$의 기울기는 $\dfrac{-(c-8)^2-(b^2+1)}{c-b}=\dfrac{-2b^2-1}{8-2b}$이다.
      criteria: ['1.B1']
    - id: 1b-3
      content: |
        직선 $\mathrm{PQ}$가 직선 $l_1$과 수직이므로 $2b\times\left(\dfrac{-2b^2-1}{8-2b}\right)=-1$이다. 따라서 $b^3+b-2=0$이다.
        $(b-1)(b^2+b+2)=0$이고, $b=1$이다. 따라서 점 $\mathrm{P}$의 좌표는 $(1,2)$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 8
      evidence: |
        (공식 등급 C) $\mathrm{P}(1,2)$를 정확히 구했다.
      depends_on: []
      steps: [1b-1, 1b-2, 1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}

- id: '2'
  stem: |
    (나)에서 선분 $\mathrm{PQ}$의 길이를 $L$이라 하자. $a=8$일 때, $\dfrac{dL}{da}$의 값을 구하고 풀이과정을 쓰시오.
  points: 21
  depends_on: ['1']
  answer: {kind: value, value: '2*sqrt(5)/5', equivalents: ['2/sqrt(5)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a=4b^3+4b$, $L=(2b^2+1)\sqrt{4b^2+1}$이므로 $\dfrac{dL}{da}=\dfrac{dL}{db}\cdot\dfrac{1}{12b^2+4}$, $b=1$ 대입.
    steps:
    - {id: 2a, content: '$\dfrac{dL}{db}\Big|_{b=1}=\dfrac{32}{\sqrt5}$, $\dfrac{db}{da}\Big|_{b=1}=\dfrac1{16}$, $\dfrac{dL}{da}=\dfrac{2\sqrt5}{5}$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $L$을 $a$가 아니라 접점의 $x$좌표 $b$로 나타내 보자.
    - $a$와 $b$ 사이의 관계식에서 $\dfrac{db}{da}$는 어떻게 구하는가?
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2026 p.98 예시답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{P}$의 좌표를 $(b,b^2+1)$, 점 $\mathrm{Q}$의 좌표를 $(c,-(c-a)^2)$라고 하자.
        접선 $l_1$의 기울기는 $2b$이고, 접선 $l_2$의 기울기는 $-2(c-a)$이다.
        직선 $l_1$과 $l_2$가 평행하므로 $2b=-2(c-a)$이고 정리하면 $c=a-b$이다. 따라서 점 $\mathrm{Q}$의 좌표는 $(a-b,-b^2)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        직선 $\mathrm{PQ}$의 기울기는 $\dfrac{-b^2-(b^2+1)}{(a-b)-b}=\dfrac{-2b^2-1}{a-2b}$이다.
        직선 $\mathrm{PQ}$가 직선 $l_1$과 수직이므로 $2b\times\left(\dfrac{-2b^2-1}{a-2b}\right)=-1$이다. 따라서
        $$a=4b^3+4b\quad\cdots\cdots\ (*)$$
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        또한 점 $\mathrm{Q}$의 좌표는 $(4b^3+3b,-b^2)$이다. 점 $\mathrm{P}$의 좌표가 $(b,b^2+1)$이므로
        $$L=\sqrt{(4b^3+2b)^2+(2b^2+1)^2}=\sqrt{4b^2(2b^2+1)^2+(2b^2+1)^2}=(2b^2+1)\sqrt{4b^2+1}$$
        $$\frac{dL}{db}=4b\sqrt{4b^2+1}+(2b^2+1)\times\frac{8b}{2\sqrt{4b^2+1}}=\frac{8b(3b^2+1)}{\sqrt{4b^2+1}}$$
        $a=8$일 때 $(*)$에 의해 $b=1$이고, $\dfrac{dL}{db}=\dfrac{32}{\sqrt5}$.
      criteria: ['2.M1']
    - id: 2b-4
      content: |
        $(*)$에서 $\dfrac{da}{db}=12b^2+4$이고, 역함수의 미분법에 의하여 $\dfrac{db}{da}=\dfrac{1}{12b^2+4}$이다. $b=1$일 때, $\dfrac{db}{da}=\dfrac{1}{16}$이다.
      criteria: ['2.M2']
    - id: 2b-5
      content: |
        따라서 $a=8$일 때 $\dfrac{dL}{da}=\dfrac{dL}{db}\times\dfrac{db}{da}=\dfrac{32}{\sqrt5}\times\dfrac{1}{16}=\dfrac{2}{\sqrt5}=\dfrac{2}{5}\sqrt5$
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: |
        (공식 등급 B) $L$을 $b$에 대한 식으로 표현하고, $\dfrac{dL}{db}=\dfrac{8b(3b^2+1)}{\sqrt{4b^2+1}}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2, 2b-3]
    - id: 2.M2
      mark_type: M
      points: 7
      evidence: |
        (공식 등급 B+) $\dfrac{db}{da}=\dfrac{1}{12b^2+4}$를 구했다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-4]
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: |
        (공식 등급 A+) $a=8$일 때 $\dfrac{dL}{da}=\dfrac{2\sqrt5}{5}$를 구했다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-5]
    deductions:
    - code: D2-1
      condition: 풀이가 맞았으나 사소한 계산 실수가 있음(공식 등급 A)
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}

