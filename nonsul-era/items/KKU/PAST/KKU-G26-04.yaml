stimuli:
- label: 가
  body: |
    함수 $y=f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(a,\,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: 나
  body: |
    [그림]에서 세 점 $\mathrm{P}_1$, $\mathrm{P}_2$, $\mathrm{P}_3$은 곡선 $y=\dfrac12x^2$ 위에 있고, 점 $\mathrm{A}$는 곡선 위에 있지 않다. 세 직선 $\mathrm{AP}_1$, $\mathrm{AP}_2$, $\mathrm{AP}_3$은 각각 점 $\mathrm{P}_1$, $\mathrm{P}_2$, $\mathrm{P}_3$에서 곡선 $y=\dfrac12x^2$의 접선과 수직이다.

    [그림: 좌표축과 원점 O. 원점에서 $x$축에 접하는 아래로 볼록한 포물선 $y=\dfrac12x^2$. 점 A는 제1사분면에서 곡선의 오른쪽 가지 바깥(오른쪽 아래)에 있다. $\mathrm{P}_1$은 오른쪽 가지 위의 점으로 A 바로 왼쪽 위에 있고, $\mathrm{P}_2$는 원점 가까운 왼쪽 가지 위의 점, $\mathrm{P}_3$은 $\mathrm{P}_2$보다 위쪽의 왼쪽 가지 위의 점이다. 각 $\mathrm{P}_i$에서 접선이 짧게 그어져 있고, 선분 $\mathrm{AP}_1$, $\mathrm{AP}_2$, $\mathrm{AP}_3$이 그어져 각 $\mathrm{P}_i$에 직각 표시가 있다. 그림 아래에 [그림] 캡션.]

stem: |
  [문제 4] (31점)
  다음 조건 (1), (2)를 모두 만족시키는 점 $\mathrm{A}(a,b)$의 개수를 구하고 풀이과정을 쓰시오.

  > (1) $a$와 $b$는 모두 자연수이고 $4\le a\le20$, $5\le b\le7$이다.
  > (2) [그림]처럼 곡선 $y=\dfrac12x^2$ 위의 점 $\mathrm{P}\left(t,\,\dfrac12t^2\right)$에서의 접선과 직선 $\mathrm{AP}$가 수직이 되는 점 $\mathrm{P}$가 3개 있다.

subparts:
- id: '1'
  stem: |
    조건 (1), (2)를 모두 만족시키는 점 $\mathrm{A}(a,b)$의 개수를 구하고 풀이과정을 쓰시오.
  points: 31
  depends_on: []
  answer: {kind: value, value: '8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 수직 조건 $t^3-2(b-1)t-2a=0$이 서로 다른 세 실근 ⇔ 극값의 곱 $<0$ ⇔ $a^2<\dfrac{8(b-1)^3}{27}$. $b=5,6,7$에서 $a$는 각각 1, 3, 4개.
    steps:
    - {id: 1a, content: '$b=5$: $a^2<\tfrac{512}{27}$ → $a=4$; $b=6$: $a^2<\tfrac{1000}{27}$ → $a=4,5,6$; $b=7$: $a^2<64$ → $a=4,\dots,7$. 합 8', criteria: ['1.M1', '1.M2', '1.R1', '1.A1']}
    hint_ladder:
    - 접선의 기울기 $t$와 직선 AP의 기울기의 곱이 $-1$인 식을 세우자.
    - 그 식은 $t$에 대한 몇 차 방정식인가? 서로 다른 실근이 3개일 조건은?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2026 p.99 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P}$에서의 접선이 기울기가 $t$이고 직선 $\mathrm{AP}$와 수직이므로 $t\times\dfrac{\frac12t^2-b}{t-a}=\dfrac{t^3-2bt}{2(t-a)}=-1$이다. 정리하면
        $$t^3-2(b-1)t-2a=0.$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f(t)=t^3-2(b-1)t-2a$라 하면 $f'(t)=3t^2-2(b-1)$이다. $f'(t)=0$일 때 $t=\pm\sqrt{\dfrac{2(b-1)}{3}}$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        조건 (2)를 만족시키려면 $f(t)=0$이 서로 다른 세 실근을 가져야 한다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        (i) $b=5$일 때
        $\sqrt{\dfrac{2(b-1)}{3}}=\sqrt{\dfrac83}$이다. $f(t)=0$이 서로 다른 세 실근을 가질 조건은 $f\left(\sqrt{\dfrac83}\right)\times f\left(-\sqrt{\dfrac83}\right)<0$이다.
        따라서 $\left(\dfrac83\sqrt{\dfrac83}-8\sqrt{\dfrac83}-2a\right)\left(-\dfrac83\sqrt{\dfrac83}+8\sqrt{\dfrac83}-2a\right)<0$이고, $\left(a+\dfrac83\sqrt{\dfrac83}\right)\left(a-\dfrac83\sqrt{\dfrac83}\right)<0$이다.
        $-\dfrac83\sqrt{\dfrac83}<a<\dfrac83\sqrt{\dfrac83}$이고, $a^2<\dfrac{512}{27}=18+\dfrac{26}{27}$이므로 $a\le4$이다. 조건 (1)에 의해 $a=4$이다.
      criteria: ['1.R1']
    - id: 1b-5
      content: |
        (ii) $b=6$일 때
        $\sqrt{\dfrac{2(b-1)}{3}}=\sqrt{\dfrac{10}{3}}$이다. $f(t)=0$이 서로 다른 세 실근을 가질 조건은 $f\left(\sqrt{\dfrac{10}{3}}\right)\times f\left(-\sqrt{\dfrac{10}{3}}\right)<0$이다.
        (i)과 같이 풀면 $-\dfrac{10}{3}\sqrt{\dfrac{10}{3}}<a<\dfrac{10}{3}\sqrt{\dfrac{10}{3}}$을 얻는다.
        $a^2<\dfrac{1000}{27}=37+\dfrac{1}{27}$이므로 $a\le6$이다. 조건 (1)에 의해 $a=4,5,6$이다.
      criteria: ['1.R1']
    - id: 1b-6
      content: |
        (iii) $b=7$일 때
        $\sqrt{\dfrac{2(b-1)}{3}}=2$이다. $f(t)=0$이 서로 다른 세 실근을 가질 조건은 $f(2)\times f(-2)<0$이다.
        (i)과 같이 풀면 $-8<a<8$을 얻는다. 조건 (1)에 의해 $a=4,5,6,7$이다.
        따라서 조건 (1), (2)를 모두 만족시키는 점 $\mathrm{A}(a,b)$의 개수는 $1+3+4=8$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: |
        (공식 등급 C) P에서의 접선과 직선 AP의 수직 조건 $f(t)=t^3-2(b-1)t-2a=0$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: |
        (공식 등급 B) $f'(t)=0$을 풀어 $t=\pm\sqrt{\dfrac{2(b-1)}{3}}$을 구했다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 9
      evidence: |
        (공식 등급 B+) $f\left(\sqrt{\dfrac{2(b-1)}{3}}\right)\times f\left(-\sqrt{\dfrac{2(b-1)}{3}}\right)<0$일 때 $f(t)=0$이 서로 다른 세 실근을 가짐을 적었다.
      depends_on: [1.M2]
      steps: [1b-3, 1b-4, 1b-5]
    - id: 1.A1
      mark_type: A
      points: 8
      evidence: |
        (공식 등급 A+) $b=5,6,7$ 각각에서 $a$의 개수 1, 3, 4를 구해 점 A의 개수 8을 얻었다.
      depends_on: [1.R1]
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 풀이가 맞았으나 사소한 계산 실수가 있음(공식 등급 A)
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}

