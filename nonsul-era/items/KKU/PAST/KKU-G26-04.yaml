# 건국대 2026학년도 KU논술우수자 자연계 [문제 4] — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 채점표: 보고서 채점기준은 등급(A+·A·B+·B·C·D·F)만 있고 점수 배분이 없다. 마크는 공식 등급 항목 단위로 나누고
# 점수 배분은 입력자가 정함(공식 아님). A(사소한 계산 실수)는 감점으로, D(의미 있는 시도)·F(공란)는 마크로 만들지 않음.
