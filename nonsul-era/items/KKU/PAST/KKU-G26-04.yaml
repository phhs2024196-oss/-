  서로 수직인 두 직선의 기울기 사이의 관계, 삼차함수의 극대와 극소를 이해하고 이를 활용하여 문제를 해결할 수 있는지 알아본다.
key_idea: |
  수직 조건을 $t$에 대한 삼차방정식 $f(t)=t^3-2(b-1)t-2a=0$으로 바꾸고, 서로 다른 세 실근 조건 (극댓값)×(극솟값)$<0$을 $b=5,6,7$별로 풀어 $a$를 센다.
