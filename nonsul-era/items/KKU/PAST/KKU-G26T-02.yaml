intent: |
  [문제 2-1] 미분으로 접선의 방정식을 구하고, 정적분으로 두 곡선으로 둘러싸인 도형의 넓이를 구할 수 있는지 본다.
  [문제 2-2] 조합의 수를 이용하여 조건에 맞는 함수의 개수를 셀 수 있는지 본다.
  [문제 2-3] 주어진 조건과 도함수를 활용하여 삼차방정식을 해결할 수 있는지 본다.
key_idea: |
  (2-1) 원의 중심에서 접선까지의 거리 = 반지름, 넓이는 (포물선·현·$y$축 영역) − (부채꼴). (2-2) $f(a)>2a$ 는 곱의 법칙, 증가함수는 ${}_n\mathrm{C}_3$. (2-3) 넓이 최대 ⇔ $\mathrm{P}$에서의 접선이 $y=4x$와 평행, $f(x)-4x=x(x-3)(x-b)$.
stuck: |
  (2-1) 원과 곡선이 공통접선을 가진다는 조건을 '중심과 접선 사이 거리 = 반지름'으로 바꾸는 것과 넓이를 부채꼴로 빼는 분할. (2-2) $p-q$를 $n$의 다항식으로 만들어 부호를 판정하는 것. (2-3) 삼각형 넓이의 최대를 접선 기울기 조건 $f'(4/3)=4$로 바꾸는 것.
