stimuli:
- label: 2-1(가)
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$와 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b\lvert f(x)-g(x)\rvert\,dx$$
- label: 2-1(나)
  body: |
    그림에서 곡선 $y=x^2$ 위에 두 점 $\mathrm{A}(t,t^2)$, $\mathrm{B}(-t,t^2)$가 있다. 원 $T$는 $y$축 위의 점 $\mathrm{C}$를 중심으로 하고 점 $\mathrm{A}$와 점 $\mathrm{B}$를 지난다. 점 $\mathrm{A}$에서 원 $T$의 접선과 곡선 $y=x^2$의 접선이 같다. (단, $t>0$)
    [그림: 좌표평면에 곡선 $y=x^2$(오른쪽 위에 라벨 $y=x^2$)과 원 $T$가 그려져 있다. 원 $T$의 중심 $\mathrm{C}$는 $y$축 위(원점 위쪽)에 있고, 원은 곡선 위의 두 점 $\mathrm{B}$(왼쪽)·$\mathrm{A}$(오른쪽)에서 곡선에 접한다. 선분 $\mathrm{CA}$, $\mathrm{CB}$, $\mathrm{BA}$가 그어져 삼각형 $\mathrm{ABC}$를 이룬다. 원의 아래쪽 호와 곡선 $y=x^2$ 사이, $\mathrm{B}$에서 $\mathrm{A}$까지의 초승달 모양 영역이 회색으로 칠해져 있다. 원점 $\mathrm{O}$, $x$축·$y$축 라벨이 있다.]
- label: 2-2(가)
  body: |
    서로 다른 $n$개에서 $r$개를 택하는 조합의 수는
    $${}_n\mathrm{C}_r=\dfrac{{}_n\mathrm{P}_r}{r!}=\dfrac{n!}{r!\,(n-r)!}\quad(\text{단, }0\le r\le n)$$
- label: 2-2(나)
  body: |
    집합 $X=\{1,2,3\}$이고 집합 $Y=\{y\mid y\text{는 }n\text{ 이하의 자연수}\}$이다. (단, $n$은 $7$ 이상의 자연수)
    - $X$에서 $Y$로의 함수 $f$ 중 다음 조건을 만족시키는 함수는 $p$개이다.
      $X$의 임의의 원소 $a$에 대하여 $f(a)>2a$
    - $X$에서 $Y$로의 함수 $g$ 중 다음 조건을 만족시키는 함수는 $q$개이다.
      $X$의 임의의 두 원소 $a$, $b$에 대하여 $a<b$이면 $g(a)<g(b)$
- label: 2-3(가)
  body: |
    미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면 $f'(a)=0$이다.
- label: 2-3(나)
  body: |
    그림은 직선 $y=ax\ (a>0)$와 최고차항의 계수가 양수 $b$인 삼차함수 $f(x)$의 그래프를 나타낸 것이다. 방정식 $f(x)=0$은 서로 다른 세 근을 갖는데, 한 근은 $0$이고, 다른 두 근은 $3$보다 크다. 점 $\mathrm{A}(3,3a)$와 점 $\mathrm{P}(t,f(t))$는 곡선 $y=f(x)$ 위에 있다. (단, $0<t<3$)
    [그림: 원점 $\mathrm{O}$를 지나는 직선 $y=ax$(오른쪽 위로 올라감)와 삼차함수 $y=f(x)$의 그래프. 곡선은 원점을 지나 가파르게 올라가 직선 위쪽에서 극대가 된 뒤 내려오며 점 $\mathrm{A}$에서 직선과 만나고, 계속 내려가 $x$축을 지나 $x$축 아래에서 극소가 된 뒤 다시 올라가 $x$축을 지난다. 점 $\mathrm{P}$는 원점과 극대점 사이의 곡선 위(직선 위쪽)에 표시되어 있다. 라벨: $y=ax$, $y=f(x)$, $\mathrm{P}$, $\mathrm{A}$, $\mathrm{O}$, $x$, $y$.]

stem: |
  [문제 2] 다음 제시문 2-1, 2-2, 2-3을 읽고 [문제 2-1]~[문제 2-3]에 각각 답하시오. (입력자 요약 — 원문에는 공통 발문 없음)

subparts:
- id: '1'
  stem: |
    [문제 2-1] (13점)
    (나)에서 삼각형 $\mathrm{ABC}$의 넓이가 $\dfrac14$일 때, 다음을 구하고 풀이과정을 쓰시오.
    (1) 점 $\mathrm{A}$의 좌표
    (2) 원 $T$와 곡선 $y=x^2$으로 둘러싸인 도형의 넓이
  points: 13
  depends_on: []
  answer: {kind: expression, value: 'A = (1/2, 1/4); S = 5/12 - pi/8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 넓이 조건으로 $\mathrm{C}(0,t^2+\tfrac{1}{4t})$, 중심과 접선 사이 거리 = 반지름으로 $t=\tfrac12$. 넓이는 $2(S_1-S_2)$.
    steps:
    - {id: 1a, content: '$c=t^2+\tfrac{1}{4t}$, $(t-\tfrac12)^2=0$, $\mathrm{A}(\tfrac12,\tfrac14)$; $2\left(\tfrac{5}{24}-\tfrac{\pi}{16}\right)=\tfrac{5}{12}-\tfrac{\pi}{8}$', criteria: ['1.M1', '1.A1', '1.A2', '1.M2', '1.A3']}
    hint_ladder:
    - 삼각형 $\mathrm{ABC}$의 밑변 $\mathrm{AB}$와 높이를 $c$로 나타내 보자.
    - 원의 접선은 중심에서 반지름만큼 떨어져 있다.
    - 구하는 넓이를 $y$축으로 반 나누고, 부채꼴을 빼 보자.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2026 p.86 예시답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{C}$의 좌표를 $(0,c)$라 하면 선분 $\mathrm{AB}$의 길이는 $2t$이고 $\mathrm{C}$에서 선분 $\mathrm{AB}$에 이르는 거리는 $\lvert c-t^2\rvert$이다. 삼각형 $\mathrm{ABC}$의 넓이가 $\dfrac14$이므로 $\dfrac12\times2t\times\lvert c-t^2\rvert=\dfrac14$에서 $c=t^2\pm\dfrac{1}{4t}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $c=t^2-\dfrac{1}{4t}$이면 원 $T$가 곡선에 접할 수 없으므로 $c=t^2+\dfrac{1}{4t}$이고 $\mathrm{C}$의 좌표는 $\left(0,t^2+\dfrac{1}{4t}\right)$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        점 $\mathrm{A}$에서 $y=x^2$에 접하는 직선은 $y=2tx-t^2$이다. 점 $\mathrm{C}$에서 이 직선까지의 거리가 원 $T$의 반지름인 선분 $\mathrm{AC}$의 길이와 같아야 하므로
        $$\dfrac{\left\lvert t^2+\dfrac{1}{4t}+t^2\right\rvert}{\sqrt{1+4t^2}}=\sqrt{t^2+\dfrac{1}{16t^2}}$$
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        이를 풀면 $t^2-t+\dfrac14=0$이므로 점 $\mathrm{A}$의 좌표는 $\left(\dfrac12,\dfrac14\right)$이다.
      criteria: ['1.A2']
    - id: 1b-5
      content: |
        곡선 $y=x^2$과 직선 $\mathrm{AC}$, 그리고 $y$축으로 둘러싸인 도형의 넓이를 $S_1$이라 하고, 원 $T$의 내부를 선분 $\mathrm{AC}$와 선분 $\mathrm{CO}$로 잘라서 만들어지는 부채꼴 중 작은 것의 넓이를 $S_2$라 하면 구하는 넓이는 $2(S_1-S_2)$이다.
      criteria: ['1.M2']
    - id: 1b-6
      content: |
        직선 $\mathrm{AC}$의 방정식이 $y=-x+\dfrac34$이므로 $S_1=\displaystyle\int_0^{\frac12}\left(-x^2-x+\dfrac34\right)dx=\dfrac{5}{24}$이다. $S_2$는 반지름이 $\dfrac{1}{\sqrt2}$이고 중심각이 $\dfrac{\pi}{4}$인 부채꼴의 넓이이므로 $S_2=\dfrac{\pi}{16}$이다.
      criteria: ['1.M2']
    - id: 1b-7
      content: |
        구하는 도형의 넓이는 $2(S_1-S_2)=2\left(\dfrac{5}{24}-\dfrac{\pi}{16}\right)=\dfrac{5}{12}-\dfrac{\pi}{8}$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        [공식 D] 풀이와 관계있는 의미 있는 시도: 중심을 $(0,c)$로 두고 삼각형 $\mathrm{ABC}$의 넓이 식 $\dfrac12\cdot2t\cdot\lvert c-t^2\rvert=\dfrac14$ 등을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        [공식 C] $\mathrm{C}\left(0,t^2+\dfrac{1}{4t}\right)$를 정확히 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        [공식 B] $\mathrm{A}\left(\dfrac12,\dfrac14\right)$를 정확히 구했다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3, 1b-4]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        [공식 B+] 넓이 $S_1=\dfrac{5}{24}$, $S_2=\dfrac{\pi}{16}$ 중 하나를 정확히 구했다.
      depends_on: [1.A2]
      implied_ok: false
      steps: [1b-5, 1b-6]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        [공식 A+] 답과 풀이가 맞음: 넓이 $\dfrac{5}{12}-\dfrac{\pi}{8}$을 얻었다.
      depends_on: [1.M2]
      steps: [1b-7]
    deductions:
    - code: D1-1
      condition: '[공식 A] 풀이가 맞았으나 사소한 계산 실수가 있음'
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}

- id: '2'
  stem: |
    [문제 2-2] (17점)
    (1) (나)에서 $n=7$일 때 $p-q$의 값을 구하고 풀이과정을 쓰시오.
    (2) (나)에서 $p-q>0$이 성립하도록 하는 자연수 $n$의 최솟값을 구하고 풀이과정을 쓰시오.
  points: 17
  depends_on: []
  answer: {kind: value, value: '(1) -20; (2) 9', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
