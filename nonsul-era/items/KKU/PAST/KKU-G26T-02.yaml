  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2026 p.86~87 예시답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1) $f(a)>2a$인 함수 $f$의 개수: $f(1)>2$이어야 하므로 $f(1)$은 $3,4,5,6,7$의 $5$가지, $f(2)>4$이어야 하므로 $f(2)$는 $5,6,7$의 $3$가지, $f(3)>6$이어야 하므로 $f(3)$은 $7$의 $1$가지가 가능하다. 따라서 $p=5\times3\times1=15$.
      criteria: ['2.M1', '2.A1']
    - id: 2b-2
      content: |
        $a<b$이면 $f(a)<f(b)$인 함수 $f$를 만들려면 $1,2,\cdots,n$에서 서로 다른 세 개의 숫자를 골라서 크기 순서로 $f(1)$, $f(2)$, $f(3)$으로 두면 된다. 따라서 $q={}_7\mathrm{C}_3=\dfrac{7\times6\times5}{3\times2\times1}=35$이고 $p-q=15-35=-20$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        (2) $f(a)>2a$인 함수 $f$의 개수는 $p=(n-2)(n-4)(n-6)$이고, $a<b$이면 $f(a)<f(b)$인 함수 $f$의 개수는 $q={}_n\mathrm{C}_3=\dfrac{n(n-1)(n-2)}{6}$이다. 따라서
        $$p-q=(n-2)(n-4)(n-6)-\dfrac{n(n-1)(n-2)}{6}=\dfrac{(n-2)(5n^2-59n+144)}{6}.$$
      criteria: ['2.M2', '2.A2']
    - id: 2b-4
      content: |
        $n$이 $7$보다 크므로 $n-2>0$이다. 또한 $5n^2-59n+144=5\left(n-\dfrac{59}{10}\right)^2-5\left(\dfrac{59}{10}\right)^2+144$이므로 $n>\dfrac{59}{10}$일 때 이차식 $5n^2-59n+144$는 $n$이 커짐에 따라 증가한다. 문제의 조건에서 $n\ge7$이므로 $5n^2-59n+144$는 $n$이 커짐에 따라 증가한다.
      criteria: ['2.A3']
    - id: 2b-5
      content: |
        $n=9$일 때 $5n^2-59n+144=18>0$이므로 $n\ge9$이면 $5n^2-59n+144>0$이다. $n=8$일 때 $5n^2-59n+144=-8<0$이므로 $p-q>0$을 만족하도록 하는 $n$의 최솟값은 $9$이다.
      criteria: ['2.A3']
