- id: '3'
  stem: |
    [문제 2-3] (20점)
    (나)에서 $a=4$, $b=1$이라고 하자. 삼각형 $\mathrm{OAP}$의 넓이가 $t=\dfrac43$에서 최대가 될 때, 방정식 $f(x)=0$의 $0$이 아닌 두 근을 모두 구하고 풀이과정을 쓰시오.
  points: 20
  depends_on: []
  answer: {kind: set, value: '{4, 7}', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 밑변 $\mathrm{OA}$ 고정이므로 넓이 최대 ⇔ $\mathrm{P}$에서의 접선이 $y=4x$와 평행, 즉 $f'(\tfrac43)=4$. $f(x)-4x=x(x-3)(x-k)$.
    steps:
    - {id: 3a, content: '$f(x)=x(x-3)(x-k)+4x$, $f''(\tfrac43)=4\Rightarrow k=8$, $f(x)=x(x-4)(x-7)$', criteria: ['3.M1', '3.M2', '3.M3', '3.A1', '3.A2']}
    hint_ladder:
    - 밑변 $\mathrm{OA}$가 고정되면 넓이는 무엇에 따라 달라지는가?
    - $f(x)-4x$는 어떤 두 근을 반드시 가지는가?
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 2026 p.87 예시답안
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        삼각형 $\mathrm{OAP}$에서 밑변 $\mathrm{OA}$의 길이가 일정하므로 삼각형의 넓이가 최댓값을 갖는 것은 점 $\mathrm{P}$에서 직선 $y=4x$에 이르는 거리가 최대일 때이다. 또한 이것은 점 $\mathrm{P}$에서의 접선이 직선 $y=4x$와 평행할 때이다. 따라서 $f'\left(\dfrac43\right)=4$이다.
      criteria: ['3.M1', '3.M2']
    - id: 3b-2
      content: |
        $g(x)=f(x)-4x$라 하자. $g(x)$는 최고차항의 계수가 $1$인 삼차함수이다. $0$과 $3$이 방정식 $g(x)=0$의 근이므로 $g(x)=x(x-3)(x-b)$ 꼴이다. (원 해설은 여기서 문자 $b$를 셋째 근으로 다시 씀 — 최고차항 계수 $b=1$과 다른 문자)
      criteria: ['3.M3']
    - id: 3b-3
      content: |
        따라서 $f(x)=g(x)+4x=x(x-3)(x-b)+4x=x^3-(b+3)x^2+(3b+4)x$이고 $f'(x)=3x^2-2(b+3)x+(3b+4)$이다.
      criteria: ['3.M3']
    - id: 3b-4
      content: |
        $f'\left(\dfrac43\right)=4$이므로 $3\times\dfrac{16}{9}-2(b+3)\times\dfrac43+(3b+4)=4$이다. 따라서 $b=8$이고, $f(x)=x(x-3)(x-8)+4x=x^3-11x^2+28x=x(x-4)(x-7)$이다.
      criteria: ['3.A1']
    - id: 3b-5
      content: |
        $f(x)=0$의 근이 $0$, $4$, $7$이므로 $f(x)=0$의 $0$이 아닌 두 근은 $4$, $7$이다.
      criteria: ['3.A2']
