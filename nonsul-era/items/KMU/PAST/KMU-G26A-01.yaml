stimuli: []

stem: |
  최고차항의 계수가 $1$인 두 이차함수 $f(x)$와 $g(x)$가 아래 조건을 만족할 때, 다음 물음에 답하시오.

  가) $\{x\mid -x+3\le 4x-1\}$과 $\{x\mid 2x-3\le 2-x\}$를 동시에 만족하는 집합 내의 자연수에서 $\lvert f(x)\rvert$가 극댓값 $\dfrac34$을 갖는다.

  나) $h(x)=\displaystyle\int_0^{\frac{x}{2}}g(t)\,dt$일 때, $x\ge2$인 모든 실수에 대하여 $h(x)\ge h(6)$이고, $\lvert h(x)\rvert\ge\lvert h(4)\rvert$이다.

subparts:
- id: '1'
  stem: |
    $f(2)$의 값을 구하시오.
  points: 42
  depends_on: []
  answer: {kind: value, value: '1/4', equivalents: ['0.25'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 공통 자연수는 $1$이고, $\lvert f\rvert$의 극대는 $f$의 극소에서 생기므로 $f\prime(1)=0$, $f(1)=-\tfrac34$.
    steps:
    - {id: 1a, content: '$f(x)=(x-1)^2-\tfrac34=x^2-2x+\tfrac14$, $f(2)=\tfrac14$', criteria: ['1.B1']}
    hint_ladder:
    - 두 부등식의 해를 각각 구해 공통 자연수를 찾아라.
    - 위로 볼록하지 않은 이차함수 $f$에서 $\lvert f\rvert$가 극대가 되는 곳은 어디인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.164
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\{x\mid -x+3\le4x-1\}=\left\{x\;\middle|\;\dfrac45\le x\right\}$이고, $\{x\mid 2x-3\le2-x\}=\left\{x\;\middle|\;x\le\dfrac53\right\}$이므로 동시에 만족하는 집합 내의 자연수는 $1$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        최고차항의 계수가 $1$인 이차함수는 극솟값을 갖는데, $\lvert f(x)\rvert$가 $x=a$에서 극댓값을 갖는다면 $f(x)$는 $x=a$에서 극솟값 $-f(a)$를 갖는다. 따라서 $f\prime(1)=0$이고 $f(1)=-\dfrac34$이다.
      criteria: ['1.B1']
    - id: 1b-3
      content: |
        결국 $f(x)=x^2-2x+\dfrac14$이므로 $f(2)=\dfrac14$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 42
      evidence: |
        정답 $\dfrac14$($0.25$도 정답)을 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $g(3)$의 값을 구하시오.
  points: 32
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $h$는 최고차항의 계수가 양수인 삼차함수이고 $x\ge2$에서 $x=6$이 최소이므로 극소점, $h\prime(6)=\tfrac12g(3)=0$.
    steps:
    - {id: 2a, content: '$h\prime(x)=\tfrac12g\left(\tfrac{x}{2}\right)$, $h\prime(6)=0\Rightarrow g(3)=0$', criteria: ['2.B1']}
    hint_ladder:
    - 위끝이 $\tfrac{x}{2}$인 정적분을 미분하면?
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.164
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        함수 $g(x)$는 최고차항의 계수가 $1$인 이차함수이므로 $h(x)$는 최고차항의 계수가 $\dfrac{1}{24}$인 삼차함수이다. $x\ge2$인 모든 실수에서 $h(x)\ge h(6)$을 만족하기 위해서는 $h(x)$는 $x=6$에서 극솟값을 갖는다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        따라서 $h\prime(x)=\dfrac12g\left(\dfrac{x}{2}\right)$이므로 $g(3)=h\prime(6)=0$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 32
      evidence: |
        정답 $0$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $g(6)$의 값을 구하시오.
  points: 46
  depends_on: ['2']
  answer: {kind: value, value: '31/2', equivalents: ['15.5'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h(6)\ge0$이면 $h(6)=h(4)$가 되어 극소가 두 번 생기므로 모순, 따라서 $h(4)=0$. $g(x)=(x-3)(x-\alpha)$로 두고 $h(4)=0$에서 $\alpha$를 구한다.
    steps:
    - {id: 3a, content: '$h(4)=4\alpha-\tfrac{10}{3}=0\Rightarrow\alpha=\tfrac56$, $g(6)=3\cdot\tfrac{31}{6}=\tfrac{31}{2}$', criteria: ['3.B1']}
    hint_ladder:
    - $h(6)$의 부호로 경우를 나누어 보아라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.164
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        만약 $h(6)\ge0$인 경우, $h(x)\ge0$이므로 $x\ge2$에서 $\lvert h(x)\rvert\ge\lvert h(4)\rvert$은 $h(x)\ge h(4)$이므로 $h(6)\ge h(4)$인데, $x\ge2$에서 $h(x)\ge h(6)$이므로 $h(6)=h(4)$이다. 이는 극소가 $2$개 이상으로 삼차함수의 극소에 대하여 모순된다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        $h(6)<0$이고, $\lvert h(6)\rvert\ge\lvert h(4)\rvert$를 만족하므로 $h(4)=0$이다.
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        $g(x)=(x-3)(x-\alpha)$라고 하면
        $$h(x)=\int_0^{\frac{x}{2}}\left\{t^2-(3+\alpha)t+3\alpha\right\}dt=\left[\dfrac13t^3-\dfrac{3+\alpha}{2}t^2+3\alpha t\right]_0^{\frac{x}{2}}=\dfrac{x^3}{24}-\dfrac{3+\alpha}{8}x^2+\dfrac{3\alpha}{2}x$$
        이고 $h(4)=4\alpha-\dfrac{10}{3}=0$이므로 $\alpha=\dfrac56$이다.
      criteria: ['3.B1']
    - id: 3b-4
      content: |
        따라서 $g(x)=(x-3)\left(x-\dfrac56\right)$이므로 $g(6)=\dfrac{31}{2}$이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 46
      evidence: |
        정답 $\dfrac{31}{2}$($15.5$도 정답)을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3b-3, 3b-4, 3a]
    deductions: []
