  함수의 극대와 극소의 개념을 이해하고, 그래프 및 적분과 미분의 관계를 활용하여 이차함수를 구할 수 있는지 판단함.
key_idea: |
  $\lvert f(x)\rvert$의 극댓값은 $f$의 극솟값의 부호를 바꾼 것이고, $h(x)\ge h(6)$ $(x\ge2)$에서 $h$는 $x=6$에서 극소, $\lvert h(6)\rvert\ge\lvert h(4)\rvert$에서 $h(4)=0$이다.
stuck: |
  (3)에서 $h(6)\ge0$이면 $h(6)=h(4)$가 되어 삼차함수의 극소가 두 번 생기는 모순을 찾아 $h(6)<0$, $h(4)=0$으로 좁히는 단계
