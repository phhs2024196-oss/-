intent: |
  미분계수의 정의를 이해하고 이를 바탕으로 합성함수의 미분을 계산할 수 있는지 평가함.
key_idea: |
  가)의 극한은 $k(x)=e^{2x^2+3x}+\cos\left(\dfrac{x-1}{2}\pi\right)$에 대한 합성함수 $f(k(x))$의 미분계수의 정의이므로 $g(x)=f\prime(k(x))k\prime(x)$이고, $g\prime(x)=f\prime\prime(k(x))\{k\prime(x)\}^2+f\prime(k(x))k\prime\prime(x)$이다.
stuck: |
  (3)에서 $g$를 한 번 더 미분할 때 곱의 미분과 합성함수의 미분을 함께 적용해 $f\prime\prime(1)$을 $f\prime(1)$로 나타내는 단계
idea_tags: [IDEA-LIMIT-AS-DERIVATIVE-OF-COMPOSITE, IDEA-COMPOSITE-SECOND-DERIVATIVE]
tags: [미분계수의 정의, 합성함수의 미분법, 이계도함수]
