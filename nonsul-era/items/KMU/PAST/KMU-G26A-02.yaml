  materials:
  - '실수 전체에서 미분가능한 함수 $f(x)$'
  - '차분몫의 극한으로 정의된 함수 $g(x)$(안쪽 함수 $e^{2x^2+3x}+\cos\left(\dfrac{\pi x-\pi}{2}\right)$)'
  - '$h(x)=f\prime(x)$'
  - '정수 $A$, $B$, $C$를 포함한 $\pi$의 식 꼴로 주어진 답 형식'
  concepts:
  - '미분계수의 정의'
  - '합성함수의 미분법'
  - '지수함수·삼각함수의 미분'
  - '이계도함수'
  tools:
  - '$g(x)=\{f(k(x))\}\prime=f\prime(k(x))k\prime(x)$'
  - '$k(0)=1$, $k\prime(0)=3+\tfrac{\pi}{2}$, $k(1)=e^5+1$, $k\prime(1)=7e^5$'
  - '$g\prime(x)=f\prime\prime(k(x))\{k\prime(x)\}^2+f\prime(k(x))k\prime\prime(x)$'
  - '분모의 유리화로 $72+C\pi^2$ 꼴 만들기'
  conditions:
  - '가) $g$는 $f\circ k$의 도함수'
  - '나) $h=f\prime$이므로 $h\prime(1)=f\prime\prime(1)$'
  - '(1)(3) $g(0)=\tfrac14$, (2) $g(1)=7$, (3) $g\prime(0)=0$'
  stimuli_used: []
  subpart_links: '(1)~(3) 모두 조건 가)의 $g=f\prime(k)k\prime$을 사용하고, (3)은 (1)과 같은 조건 $g(0)=\tfrac14$에서 얻는 $f\prime(1)$을 다시 사용'

