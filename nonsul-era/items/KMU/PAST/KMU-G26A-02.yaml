stimuli: []

stem: |
  실수 전체의 집합에서 미분가능한 함수 $f(x)$에 대하여 함수 $g(x)$와 $h(x)$를 다음과 같이 정의한다.

  가) $g(x)=\displaystyle\lim_{h\to0}\dfrac{f\left(e^{2(x+h)^2+3(x+h)}+\cos\left(\dfrac{\pi(x+h)-\pi}{2}\right)\right)-f\left(e^{2x^2+3x}+\cos\left(\dfrac{\pi x-\pi}{2}\right)\right)}{h}$

  나) $h(x)=f\prime(x)$

subparts:
- id: '1'
  stem: |
    $g(0)=\dfrac14$일 때, $f\prime(1)=\dfrac{A+B\pi}{72+C\pi^2}$이다. 이때, $ABC$의 값을 구하시오. (단, $A,B,C$는 정수)
  points: 42
  depends_on: []
  answer: {kind: value, value: '12', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(0)=f\prime(k(0))k\prime(0)=f\prime(1)\left(3+\tfrac{\pi}{2}\right)=\tfrac14$에서 $f\prime(1)$을 구하고 분모를 유리화한다.
    steps:
    - {id: 1a, content: '$f\prime(1)=\dfrac{1}{2(6+\pi)}=\dfrac{6-\pi}{72-2\pi^2}$, $(A,B,C)=(6,-1,-2)$, $ABC=12$', criteria: ['1.B1']}
    hint_ladder:
    - 가)의 극한은 어떤 함수의 미분계수의 정의인가?
    - $k(0)$과 $k\prime(0)$을 구하라.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.167
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $k(x)=e^{2x^2+3x}+\cos\left(\dfrac{(x-1)}{2}\pi\right)$라고 하면 합성함수의 미분법에 의해
        $$g(x)=\lim_{h\to0}\dfrac{f(k(x+h))-f(k(x))}{h}=\{f(k(x))\}\prime=f\prime(k(x))k\prime(x)$$
        이고 $k\prime(x)=(4x+3)e^{2x^2+3x}-\dfrac{\pi}{2}\sin\left(\dfrac{(x-1)}{2}\pi\right)$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $g(0)=\dfrac14=f\prime(k(0))k\prime(0)$, $k(0)=1$, $k\prime(0)=3+\dfrac{\pi}{2}$이므로
        $$f\prime(1)=\dfrac{1}{4k\prime(0)}=\dfrac{1}{2(6+\pi)}=\dfrac{6-\pi}{2(6+\pi)(6-\pi)}=\dfrac{6-\pi}{72-2\pi^2}$$
        가 되어 $A=6$, $B=-1$, $C=-2$이다. 따라서 $ABC=12$.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 42
      evidence: |
        정답 $12$를 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $g(1)=7$일 때, $f\prime(e^5+1)$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: 'exp(-5)', equivalents: ['1/e^5', 'e^{-5}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $k(1)=e^5+1$, $k\prime(1)=7e^5$이므로 $7=f\prime(e^5+1)\cdot7e^5$.
    steps:
    - {id: 2a, content: '$f\prime(e^5+1)=\dfrac{1}{e^5}$', criteria: ['2.B1']}
    hint_ladder:
    - $k(1)$과 $k\prime(1)$을 계산하라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.167
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문제 (1)에 의해 $k(1)=e^5+1$, $k\prime(1)=7e^5$이므로
        $g(1)=7=f\prime(k(1))k\prime(1)=f\prime(e^5+1)\cdot7e^5$으로부터 $f\prime(e^5+1)=\dfrac{1}{e^5}$
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 20
      evidence: |
        정답 $\dfrac{1}{e^5}$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $g(0)=\dfrac14$이고 $g\prime(0)=0$일 때, $h\prime(1)=\dfrac{-A}{(6-B\pi)^C}$이다. 이때, $ABC$의 값을 구하시오. (단, $A,B,C$는 정수)
  points: 58
  depends_on: ['1']
  answer: {kind: value, value: '-78', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h\prime(1)=f\prime\prime(1)$이고, $g\prime(0)=f\prime\prime(1)\{k\prime(0)\}^2+f\prime(1)k\prime\prime(0)=0$에 (1)의 $f\prime(1)$을 넣는다.
    steps:
    - {id: 3a, content: '$k\prime\prime(0)=\tfrac{13}{4}$, $f\prime\prime(1)=-\tfrac{13}{4}\left(3+\tfrac{\pi}{2}\right)^{-3}=\dfrac{-26}{(6+\pi)^3}$, $(A,B,C)=(26,-1,3)$, $ABC=-78$', criteria: ['3.B1']}
    hint_ladder:
    - $g(x)=f\prime(k(x))k\prime(x)$를 곱의 미분법으로 한 번 더 미분하라.
    - $h\prime(1)$은 $f$의 무엇인가?
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.167
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        합성함수의 미분법에 의해 $g\prime(x)=[f\prime(k(x))k\prime(x)]\prime=f\prime\prime(k(x))\{k\prime(x)\}^2+f\prime(k(x))k\prime\prime(x)$이고
        $k\prime\prime(x)=4e^{2x^2+3x}+(4x+3)^2e^{2x^2+3x}-\dfrac{\pi^2}{4}\cos\left(\dfrac{(x-1)}{2}\pi\right)$이므로
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        $g\prime(0)=0=f\prime\prime(k(0))\{k\prime(0)\}^2+f\prime(k(0))k\prime\prime(0)=f\prime\prime(1)\left(3+\dfrac{\pi}{2}\right)^2+\dfrac{13}{4}\left(3+\dfrac{\pi}{2}\right)^{-1}$을 풀면
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        $f\prime\prime(1)=-\dfrac{13}{4}\left(3+\dfrac{\pi}{2}\right)^{-3}=\dfrac{-26}{(6+\pi)^3}$이므로 $A=26$, $B=-1$, $C=3$이 되어 $ABC=-78$
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 58
      evidence: |
        정답 $-78$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

