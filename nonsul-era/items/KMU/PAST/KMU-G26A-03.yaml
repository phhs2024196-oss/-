  - 예상 소요 시간 9분.
  - 원문 유의: 함수들은 $x>0$에서 정의되는데 가)·다)의 적분 구간이 $0$부터 시작(원문 그대로). 공식 해설은 (3)의 단순 미분을 "음함수 미분"이라 부름.
  - 2027 논술가이드북(pp.44~61) 수록 문제 1~8에는 이 문항이 없음.

