  - 공식 채점 기준: 하위 문항별 "정답을 정확히 기재하면 1.3점 / 3.1점 / 3.8점 / 1.8점"(약술형, 부분 점수 없음).
  - 공식 정답의 허용 표현: (2) $\tfrac12$, $0.5$, $A=\tfrac12$, $A=0.5$ 모두 정답. (3) $f\prime(1)=\tfrac{2}{e+1}$도 정답. (4) 식을 풀어서 쓴 $y=\tfrac{2}{e+1}x-\tfrac{2}{e+1}+1$, $y=\tfrac{2}{e+1}x-\tfrac{1-e}{e+1}$, $y=\tfrac{2}{e+1}x+\tfrac{e-1}{e+1}$, $y=\tfrac{2x+e-1}{e+1}$ 등 이런 형식은 모두 정답.
