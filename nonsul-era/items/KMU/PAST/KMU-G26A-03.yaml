stimuli: []

stem: |
  $x>0$에서 미분가능한 세 함수 $f(x)$, $g(x)$, $h(x)$가 아래 조건을 만족할 때, 다음 물음에 답하시오.

  가) $\displaystyle\int_0^1x^2h(x)\,dx=1$

  나) $g(x)=x\displaystyle\int_x^1h(t)\,dt$

  다) $A=\displaystyle\int_0^1g(x)\,dx$

  라) $\displaystyle\int_1^{x^2}Ae^{\sqrt t}f\prime(\sqrt t)\,dt+\int_1^xtf\prime(t)\,dt+f(1)=x^2$

subparts:
- id: '1'
  stem: |
    $\dfrac{d}{dx}\displaystyle\int_x^1h(t)\,dt$를 구하시오.
  points: 13
  depends_on: []
  answer: {kind: expression, value: '-h(x)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\int_x^1h(t)\,dt=-\int_1^xh(t)\,dt$이므로 미분하면 $-h(x)$.
    steps:
    - {id: 1a, content: '$\dfrac{d}{dx}\int_x^1h(t)\,dt=-h(x)$', criteria: ['1.B1']}
    hint_ladder:
    - 적분 구간의 위끝과 아래끝을 바꾸어 보아라.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.170
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        정적분과 미분의 관계를 이용하면 $\dfrac{d}{dx}\displaystyle\int_x^1h(t)\,dt=-h(x)$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 13
      evidence: |
        정답 $-h(x)$를 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    문제 (1)을 이용하여 $A$의 값을 구하시오.
  points: 31
  depends_on: ['1']
  answer: {kind: value, value: '1/2', equivalents: ['0.5', 'A=1/2', 'A=0.5'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $k(x)=\int_x^1h(t)\,dt$로 두고 $\int_0^1xk(x)\,dx$를 부분적분($k(1)=0$)하면 $\tfrac12\int_0^1x^2h(x)\,dx$.
    steps:
    - {id: 2a, content: '$A=\tfrac12\int_0^1x^2h(x)\,dx=\tfrac12$', criteria: ['2.B1']}
    hint_ladder:
    - $x$를 적분하고 $\int_x^1h(t)\,dt$를 미분하는 부분적분을 하라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.170
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문제의 조건 (나)에 주어진 $\displaystyle\int_x^1h(t)\,dt$을 $k(x)$라 하자.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        그리고 조건 (다)와 부분적분을 이용하여 아래와 같이 $A$를 구하면
        $$A=\int_0^1g(x)\,dx=\int_0^1x\,k(x)\,dx=\left[\dfrac12x^2k(x)\right]_0^1+\dfrac12\int_0^1x^2h(x)\,dx=\dfrac12\int_0^1x^2h(x)\,dx$$
        이고, 조건 (가)에서 $\displaystyle\int_0^1x^2h(x)\,dx=1$이므로 $A=\dfrac12$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 31
      evidence: |
        정답 $\dfrac12$($0.5$ 또는 $A=\dfrac12$ 또는 $A=0.5$ 모두 정답)을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $f\prime(1)$의 값을 구하시오.
  points: 38
  depends_on: ['2']
  answer: {kind: value, value: '2/(exp(1)+1)', equivalents: ['\dfrac{2}{e+1}', "f'(1)=2/(e+1)"], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 라)의 양변을 미분하면 $2xAe^xf\prime(x)+xf\prime(x)=2x$, $A=\tfrac12$이므로 $f\prime(x)=\dfrac{2}{e^x+1}$.
    steps:
    - {id: 3a, content: '$f\prime(1)=\dfrac{2}{e+1}$', criteria: ['3.B1']}
    hint_ladder:
    - 위끝이 $x^2$인 정적분의 미분은 $2x\times$(피적분함수에 $x^2$ 대입)이다.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 pp.170~171
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        문제의 조건 (라)를 음함수 미분하면,
        $$\dfrac{d}{dx}\left\{\int_1^{x^2}Ae^{\sqrt t}f\prime(\sqrt t)\,dt+\int_1^xtf\prime(t)\,dt+f(1)\right\}=\dfrac{d}{dx}(x^2)$$
        이고, $\left\{\dfrac12e^xf\prime(x)\right\}2x+xf\prime(x)=2x$이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        위의 식을 정리하면 $f\prime(x)=\dfrac{2}{e^x+1}$이므로 $f\prime(1)=\dfrac{2}{e+1}$이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 38
      evidence: |
        정답 $\dfrac{2}{e+1}$($f\prime(1)=\dfrac{2}{e+1}$도 정답)을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    곡선 $y=f(x)$ 위의 점 $(1,f(1))$에서의 접선의 방정식을 구하시오.
  points: 18
  depends_on: ['3']
  answer: {kind: expression, value: 'y=2*(x-1)/(exp(1)+1)+1', equivalents: ['y=\dfrac{2}{e+1}(x-1)+1', 'y=\dfrac{2}{e+1}x-\dfrac{2}{e+1}+1', 'y=\dfrac{2}{e+1}x-\dfrac{1-e}{e+1}', 'y=\dfrac{2}{e+1}x+\dfrac{e-1}{e+1}', 'y=\dfrac{2x+e-1}{e+1}'], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 라)에 $x=1$을 넣으면 두 적분이 $0$이 되어 $f(1)=1$.
    steps:
    - {id: 4a, content: '$y=\dfrac{2}{e+1}(x-1)+1$', criteria: ['4.B1']}
    hint_ladder:
    - 위끝과 아래끝이 같아지는 $x$ 값을 대입하라.
  - id: S4-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.171
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        문제(3)의 결과로 $f\prime(1)=\dfrac{2}{e+1}$임을 알고, 조건 (라)의 식에 $x=1$을 대입하면 $f(1)=1$임을 알 수 있다. 따라서 곡선 $y=f(x)$ 위의 점 $(1,f(1))$에서의 접선의 방정식은 $y=\dfrac{2}{e+1}(x-1)+1$이다.
      criteria: ['4.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 4.B1
      mark_type: B
      points: 18
      evidence: |
        정답 $y=\dfrac{2}{e+1}(x-1)+1$ 또는 이를 정리한 동치인 식($y=\dfrac{2}{e+1}x+\dfrac{e-1}{e+1}$, $y=\dfrac{2x+e-1}{e+1}$ 등)을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [4b-1, 4a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

