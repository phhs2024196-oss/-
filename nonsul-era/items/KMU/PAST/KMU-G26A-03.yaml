intent: |
  정적분과 미분의 관계를 이해하여 함수의 접선의 방정식을 계산할 수 있음을 확인하고, 평가 과정에서 다양한 함수의 적분법인 음함수의 미분, 부분적분법을 이용한 적분 계산 과정을 평가한다.
key_idea: |
  $k(x)=\int_x^1h(t)\,dt$로 두면 $k\prime(x)=-h(x)$, $k(1)=0$이므로 $A=\int_0^1xk(x)\,dx$를 부분적분하면 $\tfrac12\int_0^1x^2h(x)\,dx=\tfrac12$이고, 라)를 미분하면 $f\prime(x)$가 직접 구해진다.
stuck: |
  (2)에서 $g$를 직접 적분할 수 없으므로 $x$를 미분할 쪽이 아닌 적분할 쪽으로 보고 부분적분해 가)의 적분으로 바꾸는 단계
