stimuli: []

stem: |
  $\left\{x\;\middle|\;0\le x\le\dfrac{\pi}{2}\right\}$에서 정의된 세 곡선 $y=\sin x+\cos x$, $y=\sin x$, $y=\cos x$로 둘러싸인 영역을 $D$라 할 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    구간 $\left[0,\dfrac{\pi}{2}\right]$에서 $y=\sin x$와 $y=\cos x$의 교점을 구하시오.
  points: 16
  depends_on: []
  answer: {kind: expression, value: '(pi/4, sqrt(2)/2)', equivalents: ['\left(\dfrac{\pi}{4},\dfrac{1}{\sqrt2}\right)', 'x=\dfrac{\pi}{4},y=\dfrac{\sqrt2}{2}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\sin x=\cos x\iff\tan x=1$, 구간 안의 해는 $x=\tfrac{\pi}{4}$.
    steps:
    - {id: 1a, content: '교점 $\left(\dfrac{\pi}{4},\dfrac{\sqrt2}{2}\right)$', criteria: ['1.B1']}
    hint_ladder:
    - 양변을 $\cos x$로 나누어 보아라.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.173
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 곡선 $y=\sin x$와 $y=\cos x$의 교점을 구하면 $\sin x=\cos x$이고, $0\le x\le\dfrac{\pi}{2}$인 범위에서 $\tan x=1$인 $x$를 구하면 $x=\dfrac{\pi}{4}$이고 $y=\dfrac{\sqrt2}{2}$이다. 따라서 교점은 $\left(\dfrac{\pi}{4},\dfrac{\sqrt2}{2}\right)$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 16
      evidence: |
        정답 $\left(\dfrac{\pi}{4},\dfrac{\sqrt2}{2}\right)$($\left(\dfrac{\pi}{4},\dfrac{1}{\sqrt2}\right)$ 또는 $x=\dfrac{\pi}{4}$, $y=\dfrac{\sqrt2}{2}$ 모두 정답)을 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    영역 $D$의 넓이를 구하시오.
  points: 43
  depends_on: ['1']
  answer: {kind: value, value: '2-sqrt(2)', equivalents: ['2-\sqrt2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 위 곡선은 $\sin x+\cos x$, 아래 곡선은 $\left[0,\tfrac{\pi}{4}\right]$에서 $\cos x$, $\left[\tfrac{\pi}{4},\tfrac{\pi}{2}\right]$에서 $\sin x$.
    steps:
    - {id: 2a, content: '$\int_0^{\frac{\pi}{4}}\sin x\,dx+\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\cos x\,dx=2-\sqrt2$', criteria: ['2.B1']}
    hint_ladder:
    - 세 곡선을 함께 그리고, 교점에서 아래쪽 경계가 어떻게 바뀌는지 보아라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.173
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        영역 $D$의 넓이를 구하는 식은 아래와 같고,
        $$\int_0^{\frac{\pi}{4}}((\sin x+\cos x)-\cos x)\,dx+\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}((\sin x+\cos x)-\sin x)\,dx=\int_0^{\frac{\pi}{4}}\sin x\,dx+\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\cos x\,dx=2-\sqrt2$$
        계산식은 위와 같으므로 영역 $D$의 넓이는 $2-\sqrt2$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 43
      evidence: |
        정답 $2-\sqrt2$를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $\displaystyle\int_0^{\frac{\pi}{2}}\sqrt{1-\cos x\sin x}\,dx=\dfrac65$일 때, 구간 $\left[0,\dfrac{\pi}{2}\right]$에서 곡선 $y=\sin x+\cos x$의 길이를 구하시오.
  points: 41
  depends_on: []
  answer: {kind: value, value: '6*sqrt(2)/5', equivalents: ['\sqrt2\left(\dfrac65\right)', '\dfrac65\sqrt2'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\sqrt{1+(\cos x-\sin x)^2}=\sqrt2\sqrt{1-\cos x\sin x}$이므로 길이 $=\sqrt2\cdot\tfrac65$.
    steps:
    - {id: 3a, content: '길이 $=\sqrt2\left(\dfrac65\right)=\dfrac{6\sqrt2}{5}$', criteria: ['3.B1']}
    hint_ladder:
    - 곡선의 길이 공식의 근호 안을 전개해 주어진 적분과 비교하라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.173
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        곡선 $y=\sin x+\cos x$를 $C$라 하면 곡선 $C$를 매개변수로 나타낸 함수는 $x=t$, $y=\sin t+\cos t$이고, 이 함수를 $t$에 대해 미분한 도함수는 $x\prime(t)=1$, $y\prime(t)=\cos t-\sin t$이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        곡선 $C$의 길이를 구하는 식은 아래와 같고,
        $$\int_0^{\frac{\pi}{2}}\sqrt{x\prime(t)^2+y\prime(t)^2}\,dt=\int_0^{\frac{\pi}{2}}\sqrt{1+(\cos t-\sin t)^2}\,dt=\sqrt2\int\sqrt{1-\cos t\sin t}\,dt$$
        이고, 문제(3)에 주어진 조건 $\displaystyle\int_0^{\frac{\pi}{2}}\sqrt{1-\cos x\sin x}\,dx=\dfrac65$을 이용하면 곡선 $C$의 길이는 $\sqrt2\left(\dfrac65\right)$이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 41
      evidence: |
        정답 $\sqrt2\left(\dfrac65\right)$($\dfrac65\sqrt2$도 정답)을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

