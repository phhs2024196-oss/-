memo: |
  - 공식 채점 기준: 하위 문항별 "정답을 정확히 기재하면 1.6점 / 4.3점 / 4.1점"(약술형, 부분 점수 없음).
  - 공식 정답의 허용 표현: (1) $\left(\tfrac{\pi}{4},\tfrac{\sqrt2}{2}\right)$, $\left(\tfrac{\pi}{4},\tfrac{1}{\sqrt2}\right)$, $x=\tfrac{\pi}{4}$, $y=\tfrac{\sqrt2}{2}$ 모두 정답. (3) $\sqrt2\left(\tfrac65\right)$, $\tfrac65\sqrt2$ 정답.
  - 자료 출처(문항카드): 수학Ⅱ 홍성복 외(지학사, 2025) 145쪽, 수학Ⅱ 박교식 외(동아출판, 2025) 141쪽, 미적분 이준열 외(천재교육, 2025) 177쪽, 미적분 김원경 외(비상, 2025) 155쪽.
  - 성취기준(문항카드): 성취기준 2와 4가 같은 [12미적03-03](원문 중복 기재).
  - 예상 소요 시간 9분.
  - 원문 유의(검산): (3)의 가정 $\int_0^{\frac{\pi}{2}}\sqrt{1-\cos x\sin x}\,dx=\tfrac65$는 실제 값(약 $1.28890$)과 다르다. 문제는 이 값을 주어진 조건으로 쓰게 하므로 공식 정답 $\tfrac{6\sqrt2}{5}$를 유지. 공식 해설 p.173 넓이 식의 "$(\sin x+\cos)$"는 $\cos x$의 오식이라 바로잡아 옮김.
  - 2027 논술가이드북(pp.44~61) 수록 문제 1~8에는 이 문항이 없음.

