key_idea: |
  $\left[0,\tfrac{\pi}{2}\right]$에서 $\sin x+\cos x$가 항상 위에 있고, 아래 경계는 $x=\tfrac{\pi}{4}$를 기준으로 $\cos x$에서 $\sin x$로 바뀐다. 길이는 $1+(\cos x-\sin x)^2=2(1-\cos x\sin x)$로 주어진 적분에 맞춘다.
