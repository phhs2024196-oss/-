memo: |
  - 공식 채점 기준: 하위 문항별 "정답을 정확히 기재하면 3.2점 / 4.8점 / 2점"(약술형, 부분 점수 없음).
  - 공식 정답의 허용 표현: (1) $f(0)=4$도 정답, (2) $f\prime(0)=-5$도 정답.
  - 자료 출처(문항카드): 수학 권오남 외(교학사, 2025) 116쪽, 수학 배종숙 외(금성출판사, 2025) 126쪽, 수학Ⅱ 홍성복 외(지학사, 2025) 129쪽, 수학Ⅱ 박교식 외(동아출판, 2025) 130쪽, 미적분 이준열 외(천재교육, 2025) 97쪽, 미적분 김원경 외(비상, 2025) 87쪽.
  - 예상 소요 시간 9분.
  - 원문 유의: 문항카드 핵심개념은 "음함수의 미분"이나 실제로는 적분식에서 $f$를 직접 풀 수 있다($f(x)=3+e^{4-6x+\sin3x-4\tan\frac{x+\pi}{4}}$, 검산에서 사용).
  - 2027 논술가이드북(pp.44~61) 수록 문제 1~8에는 이 문항이 없음.

