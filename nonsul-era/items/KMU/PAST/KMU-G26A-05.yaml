intent: |
  정적분과 미분의 관계를 이해하고, 음함수의 미분을 이용하여 직선의 방정식을 유도할 수 있는지 평가한다.
key_idea: |
  $x=0$을 대입하면 첫 적분이 $0$이 되어 $f(0)$이 나오고, 양변을 $x$에 대해 미분하면 $3(2-\cos3x)+\sec^2\left(\dfrac{x+\pi}{4}\right)+\dfrac{f\prime(x)}{f(x)-3}=0$이다.
stuck: |
  위끝이 $3x$, $x+\pi$인 정적분을 미분할 때 위끝의 도함수(3, 1)를 곱하는 단계
