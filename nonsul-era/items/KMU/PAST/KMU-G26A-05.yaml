stimuli: []

stem: |
  구간 $-\dfrac{\pi}{2}<x<\dfrac{\pi}{2}$에서 미분가능한 함수 $f(x)$가
  $$\int_0^{3x}(2-\cos t)\,dt+\int_0^{x+\pi}\sec^2\left(\dfrac{s}{4}\right)ds+\ln(f(x)-3)=4$$
  를 만족할 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $f(0)$의 값을 구하시오.
  points: 32
  depends_on: []
  answer: {kind: value, value: '4', equivalents: ['f(0)=4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=0$ 대입, $\int_0^{\pi}\sec^2\left(\tfrac{s}{4}\right)ds=4\tan\tfrac{\pi}{4}=4$이므로 $\ln(f(0)-3)=0$.
    steps:
    - {id: 1a, content: '$f(0)-3=1$, $f(0)=4$', criteria: ['1.B1']}
    hint_ladder:
    - 첫 번째 적분이 사라지는 $x$ 값을 넣어 보아라.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.176
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 음함수에 $x=0$을 대입하면 $\displaystyle\int_0^{\pi}\sec^2\left(\dfrac{s}{4}\right)ds+\ln(f(0)-3)=4$이므로 적분을 계산하면 $\left[4\tan\left(\dfrac{s}{4}\right)\right]_0^{\pi}+\ln(f(0)-3)=4$이고, 따라서 $f(0)=4$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 32
      evidence: |
        정답 $4$($f(0)=4$도 정답)를 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $f\prime(0)$의 값을 구하시오.
  points: 48
  depends_on: ['1']
  answer: {kind: value, value: '-5', equivalents: ["f'(0)=-5"], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 양변을 미분해 $x=0$ 대입하면 $3+2+\dfrac{f\prime(0)}{f(0)-3}=0$.
    steps:
    - {id: 2a, content: '$f\prime(0)=-5$', criteria: ['2.B1']}
    hint_ladder:
    - 위끝이 $3x$인 정적분을 미분하면 앞에 $3$이 곱해진다.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.176
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        주어진 음함수를 미분하면
        $$\dfrac{d}{dx}\left\{\int_0^{3x}(2-\cos t)\,dt+\int_0^{x+\pi}\sec^2\left(\dfrac{s}{4}\right)ds+\ln(f(x)-3)\right\}=\dfrac{d}{dx}(4),$$
        $(2-\cos(3x))3+\sec^2\left(\dfrac{x+\pi}{4}\right)+\dfrac{f\prime(x)}{f(x)-3}=0$이고, 이 식에 $x=0$을 대입하면
        $(2-\cos(0))3+\sec^2\left(\dfrac{\pi}{4}\right)+\dfrac{f\prime(0)}{f(0)-3}=0$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        따라서 (1)에 의해 $f(0)=4$이므로 $f\prime(0)=-5$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 48
      evidence: |
        정답 $-5$($f\prime(0)=-5$도 정답)를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    기울기가 $-\dfrac{1}{f\prime(0)}$이고, 점 $(0,f(0))$을 지나는 직선의 방정식을 구하시오.
  points: 20
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'y=x/5+4', equivalents: ['y=\dfrac15x+4'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 기울기 $\tfrac15$, $y$절편 $4$.
    steps:
    - {id: 3a, content: '$y=\dfrac15x+4$', criteria: ['3.B1']}
    hint_ladder:
    - (1)(2)의 값을 넣어 기울기와 $y$절편을 정하라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.176
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(0)=4$이고 $f\prime(0)=-5$이므로 기울기가 $-\dfrac{1}{f\prime(0)}$이고, 점 $(0,f(0))$을 지나는 직선의 방정식은 $y=\dfrac15x+4$이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 20
      evidence: |
        정답 $y=\dfrac15x+4$를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

