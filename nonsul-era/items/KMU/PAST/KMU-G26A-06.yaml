  - 자료 출처(문항카드): 수학 김성복 외 10인(지학사, 2024) 198·181쪽, 수학 이준열 외 9인(천재교육, 2024) 194·186쪽.
  - 예상 소요 시간 9분.
  - 원문 유의: 공식 해설 (2)의 결론 "따라서 $r$은 $s$이기 위한 필요충분조건이다."는 "$s$는 $t$이기 위한"의 오식으로 보여 바로잡아 옮김(정답 "필요충분조건"은 동일). (3) 공식 해설은 $a\le-4$, $b\ge6$의 근거($P\subset Q\Rightarrow a<-3$, $R\subset P\Rightarrow b>5$)를 생략.
  - 2027 논술가이드북(pp.44~61) 수록 문제 1~8에는 이 문항이 없음.

