stimuli: []

stem: |
  전체집합 $U$에 대하여 조건 $p,q,r$의 진리집합을 각각 $P,Q,R$ (단, $Q\ne\varnothing$)라고 할 때, 다음 물음에 답하시오.

  가) $P\cup Q^c=U$, $P\ne Q$

  나) $s$ : 명제 "$p$이면 $\sim q$이다."가 참이다. $t$ : $P\cap Q=\varnothing$이다.

  다) $P=\{x\mid -3\le x\le1$ 또는 $x>5\}$, $Q=\{x\mid x>a\}$, $R=\{x\mid x\ge b\}$일 때, $p$는 $q$이기 위한 충분조건이고 $p$는 $r$이기 위한 필요조건이다. (단, $a,b$는 정수)

subparts:
- id: '1'
  stem: |
    가)에서 $p$는 $q$이기 위한 무슨 조건인지 답하시오.
  points: 30
  depends_on: []
  answer: {kind: choice, value: '필요조건', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $P\cup Q^c=U$이면 $Q\subset P$이므로 $q\Rightarrow p$, $P\ne Q$이므로 역은 성립하지 않는다.
    steps:
    - {id: 1a, content: '$p$는 $q$이기 위한 필요조건', criteria: ['1.B1']}
    hint_ladder:
    - 벤 다이어그램에서 $P\cup Q^c$가 전체가 되려면 $Q$는 어디에 있어야 하는가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.179
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 조건 $p$, $q$에 대하여 명제 $p\to q$가 참일 때, 이것을 기호로 $p\Rightarrow q$로 나타낸다. 이때 $p$는 $q$이기 위한 충분조건, $q$는 $p$이기 위한 필요조건이라고 한다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $P\cup Q^c=U$, $P\ne Q$이므로 $Q\subset P$가 성립한다. 그러므로 $q\to p$가 참이 되고 따라서 $p$는 $q$이기 위한 필요조건이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 30
      evidence: |
        정답 "필요조건"을 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    나)에서 $s$는 $t$이기 위한 무슨 조건인지 답하시오.
  points: 30
  depends_on: []
  answer: {kind: choice, value: '필요충분조건', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '"$p$이면 $\sim q$"가 참 $\iff P\subset Q^c\iff P\cap Q=\varnothing$.'
    steps:
    - {id: 2a, content: '$s$는 $t$이기 위한 필요충분조건', criteria: ['2.B1']}
    hint_ladder:
    - $\sim q$의 진리집합은 $Q^c$이다.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.179
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        명제 '$p$이면 $\sim q$이다.'가 참이면 $P\subseteq Q^c$가 되어 $P\cap Q=\varnothing$은 참이 된다. 또한 $P\cap Q=\varnothing$이면 $P\subseteq Q^c$이 되고 $P$는 $p$의 진리집합이고 $Q$는 $q$의 진리집합이므로 '$p$이면 $\sim q$이다.'가 참이 된다. 따라서 $s$는 $t$이기 위한 필요충분조건이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 30
      evidence: |
        정답 "필요충분조건"을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    다)에서 $a$의 최댓값과 $b$의 최솟값의 곱을 구하시오.
  points: 40
  depends_on: []
  answer: {kind: value, value: '-24', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $P\subset Q$에서 $a<-3$, $R\subset P$에서 $b>5$, 정수이므로 $a\le-4$, $b\ge6$.
    steps:
    - {id: 3a, content: '$(-4)\times6=-24$', criteria: ['3.B1']}
    hint_ladder:
    - $p\Rightarrow q$, $r\Rightarrow p$를 집합의 포함 관계로 바꾸어 수직선에 그려라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.179
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $a\le-4$, $b\ge6$, $a$와 $b$는 정수, 따라서 $a$의 최댓값은 $-4$, $b$의 최솟값은 $6$이므로 $ab=-24$.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 40
      evidence: |
        정답 $-24$를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

