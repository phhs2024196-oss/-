intent: |
  명제와 조건의 뜻을 알고 있는지 그리고 충분조건과 필요조건을 이해하고 구별할 수 있는지를 평가함. 두 집합 사이의 포함 관계를 이해하고 있는지를 평가함.
key_idea: |
  $p\Rightarrow q\iff P\subset Q$. 가) $P\cup Q^c=U$이면 $Q\subset P$, 나) $P\subset Q^c\iff P\cap Q=\varnothing$, 다) $P\subset Q$, $R\subset P$를 수직선에서 정수 조건으로 푼다.
stuck: |
  (3)에서 $R=\{x\mid x\ge b\}\subset P$가 되려면 $[b,\infty)$가 $x>5$ 부분에 들어가야 하므로 $b>5$, 정수라 $b\ge6$임을 끝점 포함 여부까지 따지는 단계
