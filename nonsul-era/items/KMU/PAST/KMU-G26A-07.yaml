intent: |
  이차방정식의 판별식을 이용하여 두 곡선의 만나는 점을 찾을 수 있고, 이를 활용하여 두 곡선 사이의 넓이와 삼각형 넓이의 극한을 계산할 수 있는지 판단함
key_idea: |
  교점의 $x$좌표는 $2x^2-2nx-n=0$의 두 근이고, 두 포물선 사이 넓이는 $\dfrac{2(\beta_n-\alpha_n)^3}{6}=\dfrac{(\beta_n-\alpha_n)^3}{3}$, 삼각형 $OA_nB_n$은 직선 $A_nB_n$의 $y$절편 $-\alpha_n\beta_n=\tfrac{n}{2}$로 넓이를 구한다.
