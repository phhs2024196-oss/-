stimuli: []

stem: |
  자연수 $n$에 대하여 $y=x^2$과 $y=-x^2+2nx+n$이 만나는 교점을 각각 $\mathrm{A}_n(\alpha_n,\alpha_n^2)$, $\mathrm{B}_n(\beta_n,\beta_n^2)$라 하고 점 $\mathrm{O}$는 원점일 때, 다음 물음에 답하시오. (단, $\alpha_n<\beta_n$)

subparts:
- id: '1'
  stem: |
    $\beta_n-\alpha_n=\sqrt{f(n)}$일 때, $f(5)$의 값을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '35', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $2x^2-2nx-n=0$에서 $(\beta_n-\alpha_n)^2=(\alpha_n+\beta_n)^2-4\alpha_n\beta_n=n^2+2n$.
    steps:
    - {id: 1a, content: '$f(n)=n^2+2n$, $f(5)=35$', criteria: ['1.B1']}
    hint_ladder:
    - 두 식을 같게 놓은 이차방정식의 두 근이 $\alpha_n$, $\beta_n$이다.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.181
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 교점은 $2x^2-2nx-n=0$을 만족하므로 근의 공식에 의해
        $$\alpha_n=\dfrac{n-\sqrt{n^2+2n}}{2},\qquad\beta_n=\dfrac{n+\sqrt{n^2+2n}}{2}$$
        이다. 따라서 $\beta_n-\alpha_n=\sqrt{n^2+2n}$으로 $f(n)=n^2+2n$이고, $f(5)=35$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 25
      evidence: |
        정답 $35$를 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $y=x^2$과 $y=-x^2+2nx+n$로 둘러싸인 부분의 넓이를 $S_n$이라 할 때, $S_2=C\sqrt2$를 만족한다. 이때, 유리수 $C$의 값을 구하시오.
  points: 27
  depends_on: ['1']
  answer: {kind: value, value: '16/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $S_n=\dfrac{(\beta_n-\alpha_n)^3}{3}=\dfrac{(\sqrt{n^2+2n})^3}{3}$, $n=2$이면 $\dfrac{(2\sqrt2)^3}{3}$.
    steps:
    - {id: 2a, content: '$S_2=\dfrac{16\sqrt2}{3}$, $C=\dfrac{16}{3}$', criteria: ['2.B1']}
    hint_ladder:
    - 두 포물선의 차 $-2(x-\alpha_n)(x-\beta_n)$을 적분하라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.181
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 곡선 사이의 넓이는
        $$S_n=\int_{\alpha_n}^{\beta_n}-2(x-\beta_n)(x-\alpha_n)\,dx=\left[-(x-\beta_n)^2(x-\alpha_n)\right]_{\alpha_n}^{\beta_n}+\int_{\alpha_n}^{\beta_n}(x-\alpha_n)^2\,dx\ \ (\text{부분적분})=\dfrac{(\beta_n-\alpha_n)^3}{3}=\dfrac{(\sqrt{n^2+2n})^3}{3}$$
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        이므로 $S_2=\dfrac{(2\sqrt2)^3}{3}=\dfrac{16\sqrt2}{3}$이고 $C=\dfrac{16}{3}$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 27
      evidence: |
        정답 $\dfrac{16}{3}$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    삼각형 $\mathrm{OA}_n\mathrm{B}_n$의 넓이를 $T_n$이라고 할 때, $\displaystyle\lim_{n\to\infty}\dfrac{S_n}{nT_n}=D$인 실수 $D$의 값을 구하시오.
  points: 28
  depends_on: ['1', '2']
  answer: {kind: value, value: '4/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $T_n=\tfrac12\cdot\tfrac{n}{2}\cdot(\beta_n-\alpha_n)$이므로 $\dfrac{S_n}{nT_n}=\dfrac43\cdot\dfrac{n^2+2n}{n^2}$.
    steps:
    - {id: 3a, content: '$T_n=\dfrac{n}{4}\sqrt{n^2+2n}$, $D=\dfrac43$', criteria: ['3.B1']}
    hint_ladder:
    - 직선 $A_nB_n$이 $y$축과 만나는 점을 기준으로 삼각형을 둘로 나누어라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.181
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        삼각형 $OA_nB_n$의 넓이는 점 $A_n$과 $B_n$을 잇는 직선의 $y$절편과 $\beta_n-\alpha_n$에 의해 결정되는데, 두 점을 잇는 직선 $L$의 방정식은
        $y=\dfrac{\beta_n^2-\alpha_n^2}{\beta_n-\alpha_n}(x-\alpha_n)+\alpha_n^2$으로 $y=(\alpha_n+\beta_n)(x-\alpha_n)+\alpha_n^2$이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        직선 $L$과 $y$축이 만나는 점은 $(0,-\alpha_n\beta_n)=\left(0,\dfrac{n}{2}\right)$이다. 따라서 $T_n=\dfrac12\times\dfrac{n}{2}\times(\beta_n-\alpha_n)=\dfrac{n}{4}\sqrt{n^2+2n}$이므로
        $$\lim_{n\to\infty}\dfrac{S_n}{nT_n}=\lim_{n\to\infty}\dfrac{\dfrac{(\sqrt{n^2+2n})^3}{3}}{\dfrac{n^2\sqrt{n^2+2n}}{4}}=\lim_{n\to\infty}\dfrac43\times\dfrac{n^2+2n}{n^2}=\dfrac43$$
        이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 28
      evidence: |
        정답 $\dfrac43$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

