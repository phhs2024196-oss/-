memo: |
  - 공식 채점 기준: (1) "정답을 정확히 기입 하면 5.6점, $M=0$만 맞으면 1.8점, $m=-1$만 맞으면 3.8점"(부분 점수 → 마크 1.B1 18 + 1.B2 38로 분리), (2) "정답을 정확히 기입 하면 2.4점".
  - 자료 출처(문항카드): 수학 배종숙 외(금성출판사, 2025) 74·157쪽, 수학 홍성복 외(지학사, 2025) 73·156쪽, 수학Ⅰ 배종숙 외(금성출판사, 2022) 65쪽, 수학Ⅰ 권오남 외(교학사, 2025) 64쪽.
  - 예상 소요 시간 5분.
  - 그림 판독(-r 250 확대): $f$는 $(-8,0)$, $(-2,0)$, $(0,3)$을 지나고 $g$는 $(-2,0)$, $(7,0)$, $(0,-3)$을 지난다. 따라서 $f(x)=\tfrac{3}{16}(x+8)(x+2)$, $g(x)=\tfrac{3}{14}(x+2)(x-7)$로 확정되며 $f(x)+g(-x)=\tfrac{5}{112}x(3x+22)$이므로 해집합 $(-2,0]$(검산에서 사용).
  - 원문 유의: 공식 해설의 "$g(x)$은 $y$축 대칭, $x$축 대칭을 한다. 즉, 원점 대칭이다."는 $y=-g(-x)$가 $y=g(x)$의 원점 대칭이라는 뜻.
  - 2027 논술가이드북(pp.44~61) 수록 문제 1~8에는 이 문항이 없음.

