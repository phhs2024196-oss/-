  함수의 $x$축 대칭, $y$축 대칭, 원점 대칭을 이해하고 로그의 연산을 이용한 문제 해결 능력을 평가한다.
key_idea: |
  $\log_{\frac13}\left\{-\dfrac{1}{g(-x)}\right\}=\log_3\{-g(-x)\}$이므로 부등식은 $0<f(x)\le-g(-x)$이고, $y=-g(-x)$는 $y=g(x)$를 원점 대칭한 그래프이다.
