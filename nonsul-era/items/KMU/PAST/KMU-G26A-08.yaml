stimuli: []

stem: |
  두 이차함수 $y=f(x)$, $y=g(x)$의 그래프가 오른쪽 그림과 같고, 부등식 $\log_3f(x)\le\log_{\frac13}\left\{-\dfrac{1}{g(-x)}\right\}$을 만족할 때, 다음 물음에 답하시오.

  [그림] 좌표평면에 아래로 볼록한 두 포물선. $y=f(x)$는 $x$축과 점 $(-8,0)$, $(-2,0)$에서 만나고 $y$축과 점 $(0,3)$에서 만난다. $y=g(x)$는 $x$축과 점 $(-2,0)$, $(7,0)$에서 만나고 $y$축과 점 $(0,-3)$에서 만난다. (표시된 점: $-8$, $-2$, $7$, $3$, $-3$, 원점 $0$)

subparts:
- id: '1'
  stem: |
    위 부등식을 만족하는 해의 구간에 속하는 정수 중 최댓값 $M$과 최솟값 $m$을 구하시오.
  points: 56
  depends_on: []
  answer: {kind: expression, value: 'M=0, m=-1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 부등식은 $0<f(x)\le-g(-x)$, $y=-g(-x)$는 $x$절편 $-7,2$, $y$절편 $3$인 위로 볼록한 포물선이라 해는 $-2<x\le0$.
    steps:
    - {id: 1a, content: '정수 $-1$, $0$ → $M=0$, $m=-1$', criteria: ['1.B1', '1.B2']}
    hint_ladder:
    - 밑이 $\tfrac13$인 로그를 밑이 $3$인 로그로 바꾸어라.
    - $y=-g(-x)$의 그래프는 $y=g(x)$를 어떻게 옮긴 것인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.184
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        준식 $\log_3f(x)\le\log_{\frac13}\left\{-\dfrac{1}{g(-x)}\right\}$에서
        $$\log_{\frac13}\left\{-\dfrac{1}{g(-x)}\right\}=-\log_3\left\{-\dfrac{1}{g(-x)}\right\}=\log_3\left\{-\dfrac{1}{g(-x)}\right\}^{-1}=\log_3\{-g(-x)\}$$
        준식 $\log_3f(x)\le\log_3\{-g(-x)\}$이다. 진수 $f(x)>0$이고, $0<f(x)\le-g(-x)$ ---------(*) 이다.
      criteria: ['1.B1', '1.B2']
    - id: 1b-2
      content: |
        여기서 $g(x)$은 $y$축 대칭, $x$축 대칭을 한다. 즉, 원점 대칭이다. 부등식 (*)을 만족하는 구간은 $-2<x\le0$이다.
      criteria: ['1.B1', '1.B2']
    - id: 1b-3
      content: |
        그러므로, 구간에 속하는 정수 중 최댓값 $M=0$, 최솟값 $m=-1$이다.
      criteria: ['1.B1', '1.B2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 18
      evidence: |
        최댓값 $M=0$을 정확히 기재했다(공식 기준: $M=0$만 맞으면 1.8점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1b-3, 1a]
    - id: 1.B2
      mark_type: B
      points: 38
      evidence: |
        최솟값 $m=-1$을 정확히 기재했다(공식 기준: $m=-1$만 맞으면 3.8점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    최댓값 $M$과 최솟값 $m$에 대하여 $m\log_3f(M)\times\log_{\frac13}\left\{-\dfrac{1}{g(m+1)}\right\}$의 값을 구하시오.
  points: 24
  depends_on: ['1']
  answer: {kind: value, value: '-1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $M=0$, $m+1=0$이므로 $-\log_3f(0)\times\log_{\frac13}\left(-\dfrac{1}{g(0)}\right)=-\log_33\times\log_{\frac13}\dfrac13$.
    steps:
    - {id: 2a, content: '$-1\times1\times1=-1$', criteria: ['2.B1']}
    hint_ladder:
    - 그림에서 $f(0)$과 $g(0)$을 읽어라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.184
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $$m\log_3f(M)\times\log_{\frac13}\left\{-\dfrac{1}{g(m+1)}\right\}=-\log_3f(0)\times\log_{\frac13}\left\{-\dfrac{1}{g(0)}\right\}=-\log_33\times\log_{\frac13}\left\{-\dfrac{1}{-3}\right\}=-1$$
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 24
      evidence: |
        정답 $-1$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

