intent: |
  수렴하는 등비급수를 이용하여 등비수열의 일반항을 구할 수 있고, 급수의 수렴성으로부터 수열의 극한값과 다른 급수의 수렴을 판단할 수 있는지 평가함
key_idea: |
  $\sum a_n$이 수렴하면 $a_n\to0$이고, $\sum_{k=1}^n\left(a_k+b_k-\tfrac13\right)$를 주어진 수렴 급수와 망원급수 $\sum\left(\tfrac{3n^2-n}{9n^2-3n-2}-\tfrac13\right)$의 합으로 쪼갠다.
stuck: |
  (3)에서 $\tfrac13$을 빼는 급수를 주어진 급수(합 $28$)와 $\tfrac{2}{3(3n-2)(3n+1)}$의 부분분수 망원급수로 나누어 쓰는 단계
idea_tags: [IDEA-SERIES-CONV-TERM-TO-ZERO, IDEA-TELESCOPING-PARTIAL-FRACTION]
tags: [등비급수, 급수의 수렴과 일반항의 극한, 부분분수 망원급수]
elements:
  materials:
  - '첫째항부터 제$3$항까지의 합이 $26$, 무한합이 $27$인 등비수열 $\{a_n\}$'
  - '$\sum_{n=1}^{\infty}\left(a_n+b_n-\dfrac{3n^2-n}{9n^2-3n-2}\right)=28$을 만족하는 수열 $\{b_n\}$'
  - '유리식 일반항 $\dfrac{3n^2-n}{9n^2-3n-2}$ (극한 $\tfrac13$)'
  concepts:
  - '등비수열의 일반항과 합'
  - '등비급수의 합 $\tfrac{a}{1-r}$ ($\lvert r\rvert<1$)'
  - '급수가 수렴하면 일반항은 $0$으로 수렴'
  - '수열의 극한의 성질'
  - '급수의 합의 성질(수렴하는 급수의 합·차)'
  tools:
  - '두 식을 나누어 $1-r^3=\tfrac{26}{27}$'
  - '$\lim(a_n+b_n-c_n)=0$에서 $\lim b_n=\lim c_n$'
  - '$\dfrac{3n^2-n}{9n^2-3n-2}-\dfrac13=\dfrac{2}{3(3n-2)(3n+1)}$ 부분분수 분해와 망원합'
  conditions:
  - '$\sum_{n=1}^{3}a_n=26$, $\sum_{n=1}^{\infty}a_n=27$ → $r=\tfrac13$, $a_1=18$'
  - '$\sum_{n=1}^{\infty}\left(a_n+b_n-\tfrac{3n^2-n}{9n^2-3n-2}\right)=28$ → 일반항 $\to0$'
  stimuli_used: []
  subpart_links: '(1)의 $a_n\to0$과 (2)의 $\lim b_n=\tfrac13$을 (3)의 극한에 그대로 쓰고, (3)은 발문의 급수 합 $28$을 다시 사용'

