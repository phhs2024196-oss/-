stimuli: []

stem: |
  등비수열 $\{a_n\}$과 수열 $\{b_n\}$이 $\displaystyle\sum_{n=1}^{3}a_n=26$, $\displaystyle\sum_{n=1}^{\infty}a_n=27$, $\displaystyle\sum_{n=1}^{\infty}\left(a_n+b_n-\dfrac{3n^2-n}{9n^2-3n-2}\right)=28$을 만족할 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $a_4$의 값을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '2/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 합을 나누면 $1-r^3=\tfrac{26}{27}$이므로 $r=\tfrac13$, $a=18$.
    steps:
    - {id: 1a, content: '$a_n=18\left(\tfrac13\right)^{n-1}$, $a_4=\tfrac{18}{27}=\tfrac23$', criteria: ['1.B1']}
    hint_ladder:
    - 첫째항 $a$, 공비 $r$로 두 조건을 식으로 써라.
    - 두 식을 나누면 $(1+r+r^2)(1-r)$이 나온다.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.186
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        첫째항을 $a$, 공비를 $r$이라고 하면 $\displaystyle\sum_{n=1}^{3}a_n=a(1+r+r^2)=26$이고, $\displaystyle\sum_{n=1}^{\infty}a_n=\dfrac{a}{1-r}=27$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        두 식을 나누면 $(1+r+r^2)(1-r)=\dfrac{26}{27}$으로 $r^3=\dfrac{1}{27}$이다.
      criteria: ['1.B1']
    - id: 1b-3
      content: |
        따라서 공비 $r=\dfrac13$이고, 첫째항 $a=18$으로 일반항 $a_n=18\times\left(\dfrac13\right)^{n-1}$이다. 결국, $a_4=\dfrac23$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 25
      evidence: |
        정답 $\dfrac23$을 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $\displaystyle\lim_{n\to\infty}b_n$의 값을 구하시오.
  points: 40
  depends_on: []
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 수렴하는 급수의 일반항은 $0$으로 가므로 $\lim a_n=0$, $\lim\left(a_n+b_n-\tfrac{3n^2-n}{9n^2-3n-2}\right)=0$.
    steps:
    - {id: 2a, content: '$\lim b_n=\lim\dfrac{3n^2-n}{9n^2-3n-2}=\tfrac13$', criteria: ['2.B1']}
    hint_ladder:
    - 급수 $\sum c_n$이 수렴하면 $\lim c_n$은?
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.186
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\displaystyle\sum_{n=1}^{\infty}a_n$과 $\displaystyle\sum_{n=1}^{\infty}\left(a_n+b_n-\dfrac{3n^2-n}{9n^2-3n-2}\right)$이 각각 수렴하므로 $\displaystyle\lim_{n\to\infty}a_n=0$이고, $\displaystyle\lim_{n\to\infty}\left(a_n+b_n-\dfrac{3n^2-n}{9n^2-3n-2}\right)=0$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}b_n=\dfrac13$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 40
      evidence: |
        정답 $\dfrac13$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $\displaystyle\lim_{n\to\infty}\left\{a_n+b_n+\sum_{k=1}^{n}\left(a_k+b_k-\dfrac13\right)\right\}=29+A$일 때, 유리수 $A$를 구하시오.
  points: 55
  depends_on: ['1', '2']
  answer: {kind: value, value: '-4/9', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a_n+b_n\to\tfrac13$이고, $\sum\left(a_n+b_n-\tfrac13\right)=28+\sum\dfrac{2}{3(3n-2)(3n+1)}=28+\tfrac29$.
    steps:
    - {id: 3a, content: '$\tfrac13+28+\tfrac29=29+A\Rightarrow A=-\tfrac49$', criteria: ['3.B1']}
    hint_ladder:
    - $a_k+b_k-\tfrac13$에 $\tfrac{3k^2-k}{9k^2-3k-2}$를 빼고 더해 보아라.
    - $9k^2-3k-2=(3k-2)(3k+1)$이다.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.186
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $$\lim_{n\to\infty}\left\{a_n+b_n+\sum_{k=1}^{n}\left(a_k+b_k-\dfrac13\right)\right\}=0+\dfrac13+\sum_{n=1}^{\infty}\left(a_n+b_n-\dfrac13\right)$$
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        $$=0+\dfrac13+\sum_{n=1}^{\infty}\left(a_n+b_n-\dfrac{3n^2-n}{9n^2-3n-2}\right)+\sum_{n=1}^{\infty}\left(\dfrac{3n^2-n}{9n^2-3n-2}-\dfrac13\right)$$
        $$=0+\dfrac13+\sum_{n=1}^{\infty}\left(a_n+b_n-\dfrac{3n^2-n}{9n^2-3n-2}\right)+\dfrac13\sum_{n=1}^{\infty}\left(\dfrac{2}{9n^2-3n-2}\right)$$
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        $$=0+\dfrac13+\sum_{n=1}^{\infty}\left(a_n+b_n-\dfrac{3n^2-n}{9n^2-3n-2}\right)+\dfrac29\sum_{n=1}^{\infty}\left(\dfrac{1}{3n-2}-\dfrac{1}{3n+1}\right)$$
        $$=0+\dfrac13+28+\dfrac29=28+\dfrac59=29+A$$
        이므로 $A=-\dfrac49$이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 55
      evidence: |
        정답 $-\dfrac49$를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

