intent: |
  정적분과 급수의 합 사이의 관계를 이해하고, 미분계수와 접선의 기울기와의 관계, 음함수의 미분법과 삼각함수의 극한을 이용하여 문제를 해결할 수 있는지 평가함.
key_idea: |
  단위원 위 $P_k$에서의 접선의 절편은 $\tfrac{1}{\cos\theta_k}$, $\tfrac{1}{\sin\theta_k}$이므로 $A_k=\dfrac{1}{\sin2\theta_k}$이고, $\tfrac{1}{A_k}=\sin\tfrac{k\pi}{n}$의 합을 구분구적법으로 정적분에 연결한다.
stuck: |
  (3)에서 $\tfrac{1}{A_n}=\sin\pi=0$을 이용해 합을 $k=n$까지 늘린 뒤 $x_k=\tfrac{k\pi}{n}$, $\Delta x=\tfrac{\pi}{n}$인 리만합으로 보는 단계
