stimuli: []

stem: |
  $k$가 자연수일 때, 중심이 원점이고 반지름이 $1$인 원 위의 점 $\mathrm{P}_k(\cos\theta_k,\sin\theta_k)$에 대하여 다음 물음에 답하시오. (단, $\theta_k=\dfrac{k\pi}{2n}$, $1\le k\le n-1$이고, $n$은 $2$이상의 자연수)

subparts:
- id: '1'
  stem: |
    점 $\mathrm{P}_k$에서의 접선과 $x$축 및 $y$축으로 둘러싸인 부분의 넓이를 $A_k$라 할 때, $A_k=\dfrac{1}{\sin\alpha_k}$를 만족한다. 이때, $\dfrac{\alpha_k}{\theta_k}$의 값을 구하시오.
  points: 33
  depends_on: []
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선의 $x$절편 $\tfrac{1}{\cos\theta_k}$, $y$절편 $\tfrac{1}{\sin\theta_k}$이므로 $A_k=\dfrac{1}{2\sin\theta_k\cos\theta_k}=\dfrac{1}{\sin2\theta_k}$.
    steps:
    - {id: 1a, content: '$\alpha_k=2\theta_k=\tfrac{k\pi}{n}$, $\tfrac{\alpha_k}{\theta_k}=2$', criteria: ['1.B1']}
    hint_ladder:
    - 원 위의 점에서의 접선은 반지름과 수직이다.
    - 두 절편을 곱해 반으로 나누고 배각 공식을 떠올려라.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.189
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $1\le k\le n-1$이므로 $P_k$는 $1$사분면 위의 점이다. 중심이 원점이고 반지름이 $1$인 원은 $x^2+y^2=1$이므로 음함수 미분법에 의하여 $2x+2yy\prime=0$을 이용하면 $P_k$에서 접선의 기울기가 $y\prime=-\dfrac{x}{y}=-\dfrac{\cos\theta_k}{\sin\theta_k}$로 주어진다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        따라서, 접선의 식은 $y-\sin\theta_k=-\dfrac{\cos\theta_k}{\sin\theta_k}(x-\cos\theta_k)$이 되어
        $x$절편은 $-\sin\theta_k=-\dfrac{\cos\theta_k}{\sin\theta_k}(x-\cos\theta_k)$에서 $x=\cos\theta_k+\dfrac{\sin^2\theta_k}{\cos\theta_k}=\dfrac{1}{\cos\theta_k}$,
        $y$절편은 $y-\sin\theta_k=-\dfrac{\cos\theta_k}{\sin\theta_k}(-\cos\theta_k)$에서 $y=\sin\theta_k+\dfrac{\cos^2\theta_k}{\sin\theta_k}=\dfrac{1}{\sin\theta_k}$.
      criteria: ['1.B1']
    - id: 1b-3
      content: |
        따라서, $A_k=\dfrac{1}{\sin\alpha_k}=\dfrac{1}{\sin\left(\dfrac{k\pi}{n}\right)}$이므로 $\alpha_k=\dfrac{k\pi}{n}$가 되어 $\dfrac{\alpha_k}{\theta_k}=2$.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 33
      evidence: |
        정답 $2$를 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    점 $\mathrm{P}_k$를 지나는 접선의 기울기가 $m_k$일 때, 이 접선과 $x$축이 만나는 점을 $\mathrm{Q}_k$라 하고, 점 $\mathrm{P}_k$를 지나고 기울기가 $-\dfrac{1}{m_k}$인 직선과 $x$축이 만나는 점을 $\mathrm{R}_k$라 하자. 삼각형 $\mathrm{P}_k\mathrm{Q}_k\mathrm{R}_k$의 넓이를 $\dfrac12f(\theta_k)$라 할 때, $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x}$의 값을 구하시오.
  points: 33
  depends_on: ['1']
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 접선에 수직인 직선은 반지름 방향이라 원점을 지나므로 $R_k=O$, 넓이 $=\tfrac12\cdot\tfrac{1}{\cos\theta}\cdot\sin\theta$.
    steps:
    - {id: 2a, content: '$f(x)=\tan x$, $\lim_{x\to0}\tfrac{\tan x}{x}=1$', criteria: ['2.B1']}
    hint_ladder:
    - 접선에 수직이고 $P_k$를 지나는 직선은 어떤 점을 지나는가?
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.189
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $P_k$에서의 접선에 대한 식으로부터 $Q_k=\left(\dfrac{1}{\cos\theta_k},0\right)$, 점 $P_k$를 지나고 기울기가 $-\dfrac{1}{m_k}$인 직선의 식은 $y-\sin\theta_k=\dfrac{\sin\theta_k}{\cos\theta_k}(x-\cos\theta_k)$이므로 $R_k=(0,0)$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        따라서 구하는 삼각형의 넓이는 $\dfrac12\cdot\dfrac{1}{\cos\theta_k}\cdot\sin\theta_k=\dfrac12\tan\theta_k=f(\theta_k)$이고 $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x}=\lim_{x\to0}\dfrac{\sin x}{x}\cdot\dfrac{1}{\cos x}=1$.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 33
      evidence: |
        정답 $1$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    문제 (1)에서 구한 $A_k$에 대하여 $S_n=\displaystyle\sum_{k=1}^{n-1}\dfrac{1}{A_k}$일 때, $\displaystyle\lim_{n\to\infty}\dfrac{S_n}{n}$의 값을 구하시오.
  points: 54
  depends_on: ['1']
  answer: {kind: value, value: '2/pi', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\tfrac{1}{A_k}=\sin\tfrac{k\pi}{n}$이므로 $\tfrac{S_n}{n}=\tfrac1\pi\sum\sin\left(\tfrac{k\pi}{n}\right)\tfrac{\pi}{n}\to\tfrac1\pi\int_0^\pi\sin x\,dx$.
    steps:
    - {id: 3a, content: '$\lim\tfrac{S_n}{n}=\tfrac1\pi\cdot2=\tfrac2\pi$', criteria: ['3.B1']}
    hint_ladder:
    - $\tfrac{1}{A_k}$을 $k$, $n$의 식으로 써라.
    - $\Delta x=\tfrac{\pi}{n}$으로 두면 어떤 정적분이 되는가?
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.189
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\dfrac{1}{A_n}=\sin\pi=0$이므로 $S_n=\displaystyle\sum_{k=1}^{n-1}\dfrac{1}{A_k}=\sum_{k=1}^{n}\dfrac{1}{A_k}=\sum_{k=1}^{n}\sin\left(\dfrac{k\pi}{n}\right)$이다. $x_k=\dfrac{k\pi}{n}$, $\Delta x=\dfrac{\pi}{n}$이라고 하면
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        $$\lim_{n\to\infty}\dfrac{S_n}{n}=\lim_{n\to\infty}\dfrac1n\sum_{k=1}^{n}\sin\left(\dfrac{k\pi}{n}\right)=\dfrac1\pi\lim_{n\to\infty}\sum_{k=1}^{n}\sin(x_k)\Delta x=\dfrac1\pi\int_0^\pi\sin x\,dx=\dfrac2\pi.$$
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 54
      evidence: |
        정답 $\dfrac{2}{\pi}$를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

