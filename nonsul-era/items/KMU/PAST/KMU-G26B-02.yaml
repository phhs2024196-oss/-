  - '$\tfrac{1}{\cos\theta_k}\cdot\tfrac{1}{\sin\theta_k}\cdot\tfrac12=\tfrac{1}{\sin2\theta_k}$에서 $\alpha_k=2\theta_k$'
  - '수직인 직선은 원점을 지나므로 $R_k=(0,0)$'
  - '$\lim\tfrac1n\sum\sin\tfrac{k\pi}{n}=\tfrac1\pi\int_0^\pi\sin x\,dx$'
