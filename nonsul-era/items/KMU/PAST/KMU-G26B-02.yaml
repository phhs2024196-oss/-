memo: |
  - 공식 채점 기준: 하위 문항별 "정답을 정확하게 기재하면 3.3점 / 3.3점 / 5.4점"(약술형, 부분 점수 없음).
  - 자료 출처(문항카드): 미적분 김원경 외(비상, 2025) 67·87·96·146쪽, 미적분 권오남 외(교학사, 2025) 71·96·108·170쪽.
  - 예상 소요 시간 12분.
  - 원문 해설 오식: p.189 (3) 둘째 줄 "$\lim\tfrac1n\sum4\sin\left(\tfrac{k\pi}{n}\right)$"의 계수 $4$는 오식(앞 줄 $S_n=\sum\sin\left(\tfrac{k\pi}{n}\right)$, 최종값 $\tfrac2\pi$와 맞지 않음) → S3-B 에서 $4$를 빼고 옮김. 가이드북 p.40 에도 같은 오식.
  - (2) 원문 해설은 넓이 $\tfrac12\tan\theta_k$를 "$=f(\theta_k)$"로 적었으나 발문은 넓이 $=\tfrac12f(\theta_k)$이므로 $f(\theta)=\tan\theta$(답 $1$은 동일). 해설 표기 그대로 옮김.
  - 2027 논술가이드북 문제 2(p.39~40, PDF 46~47쪽) 수록, 배점/표현 차이: 배점 동일(12점: 3.3/3.3/5.4), 발문·해설·정답 동일. 다른 풀이 없음.

