stimuli: []

stem: |
  곡선 $f(x)=\dfrac{1}{x^4}$과 두 직선 $y=f(k)$, $x=1$로 둘러싸인 영역의 넓이를 $A(k)$이라 할 때, 다음 물음에 답하시오. (단, $k>1$)

subparts:
- id: '1'
  stem: |
    넓이가 $A(k)=\dfrac1B+\dfrac{1}{k^B}\left(\dfrac1k+C\right)$일 때, $BC$의 값을 구하시오. (단, $B$, $C$는 상수)
  points: 39
  depends_on: []
  answer: {kind: value, value: '-4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $A(k)=\int_1^k(x^{-4}-k^{-4})dx=\tfrac13-\tfrac{1}{3k^3}-\tfrac{k-1}{k^4}=\tfrac13+\tfrac{1}{k^3}\left(\tfrac1k-\tfrac43\right)$.
    steps:
    - {id: 1a, content: '$B=3$, $C=-\tfrac43$, $BC=-4$', criteria: ['1.B1']}
    hint_ladder:
    - 영역은 $1\le x\le k$에서 곡선과 직선 $y=f(k)$ 사이이다.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.192
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $f(x)=\dfrac{1}{x^4}$과 두 직선 $y=f(k)$, $x=1$로 둘러싸인 영역의 넓이 $A(k)$를 구하는 식은 아래와 같다.
        $$A(k)=\int_1^k\left[\left(\dfrac1x\right)^4-\left(\dfrac1k\right)^4\right]dx=\dfrac13+\dfrac{1}{k^3}\left(\dfrac1k-\dfrac43\right)$$
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        이므로 문제에서 요구하는 답의 형태인 $\dfrac1B+\dfrac{1}{k^B}\left(\dfrac1k+C\right)$로 정리하면 $B=3$, $C=-\dfrac43$이다. 따라서 $BC=-4$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 39
      evidence: |
        정답 $-4$를 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $\displaystyle\lim_{k\to\infty}A(k)$의 값을 구하시오.
  points: 25
  depends_on: ['1']
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\tfrac{1}{k^3}\left(\tfrac1k-\tfrac43\right)\to0$.
    steps:
    - {id: 2a, content: '$\lim_{k\to\infty}A(k)=\tfrac13$', criteria: ['2.B1']}
    hint_ladder:
    - (1)의 식에서 $k\to\infty$로 보내라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.192
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문제(1)에서 $A(k)=\dfrac13+\dfrac{1}{k^3}\left(\dfrac1k-\dfrac43\right)$이므로 $k>1$인 경우, $\displaystyle\lim_{k\to\infty}A(k)=\lim_{k\to\infty}\left\{\dfrac13+\dfrac{1}{k^3}\left(\dfrac1k-\dfrac43\right)\right\}=\dfrac13$이므로 $\displaystyle\lim_{k\to\infty}A(k)=\dfrac13$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 25
      evidence: |
        정답 $\dfrac13$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\left\{f\left(1+\dfrac kn\right)-f\left(1+\dfrac{k+1}{n}\right)\right\}\dfrac kn$의 값을 구하시오.
  points: 36
  depends_on: ['1']
  answer: {kind: value, value: '11/48', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 합 $=\sum f(1+\tfrac kn)\tfrac1n-f(2+\tfrac1n)\to\int_1^2f(x)\,dx-f(2)=\int_1^2(f(x)-f(2))\,dx=A(2)$.
    steps:
    - {id: 3a, content: '$A(2)=\tfrac13+\tfrac18\left(\tfrac12-\tfrac43\right)=\tfrac{11}{48}$', criteria: ['3.B1']}
    hint_ladder:
    - 합을 $k=1,2,3,\dots$ 순서로 풀어 써 보아라.
    - $\int_1^2f(x)\,dx-f(2)$는 어떤 영역의 넓이인가?
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.192
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        문제에 주어진 급수를 정리하면
        $$\lim_{n\to\infty}\sum_{k=1}^{n}\left\{f\left(1+\dfrac kn\right)-f\left(1+\dfrac{k+1}{n}\right)\right\}\dfrac kn$$
        $$=\lim_{n\to\infty}\left\{f\left(1+\dfrac1n\right)\dfrac1n+f\left(1+\dfrac2n\right)\dfrac1n+f\left(1+\dfrac3n\right)\dfrac1n+\cdots+f(2)\dfrac1n-f\left(2+\dfrac1n\right)\right\}$$
        $$=\lim_{n\to\infty}\left\{\sum_{k=1}^{n}f\left(1+\dfrac kn\right)\dfrac1n-f\left(2+\dfrac1n\right)\right\}=\lim_{n\to\infty}\sum_{k=1}^{n}f\left(1+\dfrac kn\right)\dfrac1n-\lim_{n\to\infty}f\left(2+\dfrac1n\right)=\lim_{n\to\infty}\sum_{k=1}^{n}f\left(1+\dfrac kn\right)\dfrac1n-f(2)$$
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        이고, $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}f\left(1+\dfrac kn\right)\dfrac1n-f(2)$는 정적분과 급수의 합 사이의 관계를 이용하면, $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}f\left(1+\dfrac kn\right)\dfrac1n-f(2)=\int_1^2f(x)\,dx-f(2)$이다.
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        그리고 $\displaystyle\int_1^2f(x)\,dx-f(2)=\int_1^2(f(x)-f(2))\,dx=\int_1^2\left[\left(\dfrac1x\right)^4-\left(\dfrac12\right)^4\right]dx$이므로 $k=2$인 경우의 넓이 $A(2)$와 같다. 따라서 $A(2)=\dfrac13+\dfrac{1}{2^3}\left(\dfrac12-\dfrac43\right)=\dfrac{11}{48}$이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 36
      evidence: |
        정답 $\dfrac{11}{48}$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3b-3, 3a]
    deductions: []
