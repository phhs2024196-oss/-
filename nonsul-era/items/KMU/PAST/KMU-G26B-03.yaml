intent: |
  정적분을 활용하여 곡선으로 둘러싸인 도형의 넓이를 구하고, 도형의 넓이를 임의의 독립변수에 대한 함수로 이해하여 함수의 극한을 계산할 수 있음을 확인한다. 또한 정적분과 급수의 합 사이의 관계를 이해하고 있음을 평가한다.
key_idea: |
  $A(k)=\int_1^k\left(x^{-4}-k^{-4}\right)dx$이고, (3)의 합은 $\sum_{k=1}^n k(f_k-f_{k+1})=\sum_{k=1}^n f_k-nf_{n+1}$로 정리되어 $\int_1^2f(x)\,dx-f(2)=A(2)$가 된다.
stuck: |
  (3)에서 $\{f(1+\tfrac kn)-f(1+\tfrac{k+1}{n})\}\tfrac kn$의 합을 풀어 써서 $\sum f(1+\tfrac kn)\tfrac1n-f(2+\tfrac1n)$로 바꾸고, 그 극한이 (1)의 넓이 $A(2)$임을 알아보는 단계
idea_tags: [IDEA-SUMMATION-BY-PARTS-TELESCOPE, IDEA-RIEMANN-SUM-TO-INTEGRAL]
tags: [곡선과 직선 사이의 넓이, 넓이 함수의 극한, 정적분과 급수의 합, 합의 재배열]
