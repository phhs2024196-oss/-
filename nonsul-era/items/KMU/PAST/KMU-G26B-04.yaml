intent: |
  단면의 넓이와 입체도형의 부피 사이의 관계를 이해하고, 다항함수의 적분법을 이용하여 입체도형의 부피를 계산할 수 있음을 평가한다.
key_idea: |
  밑면의 아래 경계가 $0\le x\le1$에서는 $y=-x$, $1\le x\le2$에서는 $y=-1$이므로 정사각형 단면의 한 변은 각각 $\sqrt x+x$, $\sqrt x+1$이고, 부피는 두 구간의 적분을 더한다.
stuck: |
  밑면의 아래 경계가 $x=1$에서 $y=-x$에서 $y=-1$로 바뀌는 것을 보고 구간을 나누는 단계
