stimuli: []

stem: |
  $S$는 곡선 $y=\sqrt x$와 세 직선 $x=2$, $y=-1$, $y=-x$로 둘러싸인 부분을 밑면으로 하는 입체도형이다. 이 입체도형을 $x$축에 수직인 평면으로 자른 단면들이 모두 정사각형일 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $\dfrac14\le x\le\dfrac13$인 실수 $x$에 대하여 단면의 넓이에 대한 식 $A(x)$를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '(sqrt(x)+x)**2', equivalents: ['x+2*x*sqrt(x)+x**2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $0\le x\le1$에서 아래 경계는 $y=-x$이므로 한 변은 $\sqrt x-(-x)$.
    steps:
    - {id: 1a, content: '$A(x)=(\sqrt x+x)^2=x+2x\sqrt x+x^2$', criteria: ['1.B1']}
    hint_ladder:
    - $x=\tfrac14$ 부근에서 밑면의 위·아래 경계는 각각 무엇인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.195
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=\sqrt x$와 세 직선 $x=2$, $y=-1$, $y=-x$로 둘러싸인 부분을 밑면으로 하는 입체도형 $S$는 $0\le x\le1$과 $1\le x\le2$의 각각의 영역에서 단면의 넓이가 다르다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        따라서 $\dfrac14\le x\le\dfrac13$인 경우, 한 변의 길이가 $\sqrt x+x$이므로 정사각형인 단면의 넓이는 $A(x)=(\sqrt x+x)^2=x+2x\sqrt x+x^2$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 15
      evidence: |
        정답 $(\sqrt x+x)^2$($x+2x\sqrt x+x^2$도 정답)을 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $\dfrac65\le x\le\dfrac{11}{6}$인 실수 $x$에 대하여 단면의 넓이에 대한 식 $B(x)$를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '(sqrt(x)+1)**2', equivalents: ['x+2*sqrt(x)+1'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $1\le x\le2$에서 아래 경계는 $y=-1$이므로 한 변은 $\sqrt x+1$.
    steps:
    - {id: 2a, content: '$B(x)=(\sqrt x+1)^2=x+2\sqrt x+1$', criteria: ['2.B1']}
    hint_ladder:
    - $y=-x$와 $y=-1$은 $x=1$에서 만난다.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.195
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문제(1)과 같은 이유로 $\dfrac65\le x\le\dfrac{11}{6}$인 경우, 한 변의 길이가 $\sqrt x+1$이므로 정사각형인 단면의 넓이는 $B(x)=(\sqrt x+1)^2=x+2\sqrt x+1$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 15
      evidence: |
        정답 $(\sqrt x+1)^2$($x+2\sqrt x+1$도 정답)을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    입체도형 $S$의 전체 부피를 구하시오.
  points: 70
  depends_on: ['1', '2']
  answer: {kind: value, value: '14/5+8*sqrt(2)/3', equivalents: ['42/15+8*sqrt(2)/3', '84/30+8*sqrt(2)/3', '14/5+4/3*2**(3/2)', '42/15+4/3*2**(3/2)', '84/30+4/3*2**(3/2)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $V=\int_0^1(x+2x^{\frac32}+x^2)\,dx+\int_1^2(x+2x^{\frac12}+1)\,dx=\tfrac{49}{30}+\left(\tfrac76+\tfrac43 2^{\frac32}\right)$.
    steps:
    - {id: 3a, content: '$V=\tfrac{84}{30}+\tfrac43 2^{\frac32}=\tfrac{14}{5}+\tfrac83\sqrt2$', criteria: ['3.B1']}
    hint_ladder:
    - (1)(2)의 식은 각각 어느 구간 전체에서 성립하는가?
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.195
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        입체도형 $S$의 전체 부피는 $0\le x\le1$과 $1\le x\le2$의 각각의 영역에서 단면의 넓이가 다르므로 각각의 영역으로 나누어 부피를 구한다. $S$의 전체 부피는 아래와 같다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        $$\int_0^1A(x)\,dx+\int_1^2B(x)\,dx=\int_0^1(\sqrt x+x)^2dx+\int_1^2(\sqrt x+1)^2dx=\int_0^1(x+2x\sqrt x+x^2)\,dx+\int_1^2(x+2\sqrt x+1)\,dx$$
        $$=\left[\dfrac12x^2+\dfrac45x^{\frac52}+\dfrac13x^3\right]_0^1+\left[\dfrac12x^2+\dfrac43x^{\frac32}+x\right]_1^2=\left(\dfrac{49}{30}\right)+\left(\dfrac76+\dfrac43 2^{\frac32}\right)=\dfrac{84}{30}+\dfrac43 2^{\frac32}$$
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        따라서 $S$의 전체 부피는 $\dfrac{84}{30}+\dfrac43 2^{\frac32}$ 또는 $\dfrac{14}{5}+\dfrac83\sqrt2$이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 70
      evidence: |
        정답 $\dfrac{14}{5}+\dfrac83\sqrt2$($\dfrac{42}{15}+\dfrac83\sqrt2$, $\dfrac{84}{30}+\dfrac83\sqrt2$, $\dfrac{14}{5}+\dfrac43 2^{\frac32}$, $\dfrac{42}{15}+\dfrac43 2^{\frac32}$, $\dfrac{84}{30}+\dfrac43 2^{\frac32}$ 모두 정답)을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

