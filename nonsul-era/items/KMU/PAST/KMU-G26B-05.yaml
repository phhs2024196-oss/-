stimuli: []

stem: |
  공차가 $2$인 등차수열 $\{a_n\}$이 아래 조건을 만족한다. 다음 물음에 답하시오. (단, $k\ge2$인 자연수)

  가) $a_k=0$

  나) $a_1+a_2+a_3+\cdots+a_m=120$

  다) $\lvert a_1\rvert+\lvert a_2\rvert+\lvert a_3\rvert+\cdots+\lvert a_m\rvert=144$

subparts:
- id: '1'
  stem: |
    $a_1+a_2+\cdots+a_{k-1}$의 값을 구하시오.
  points: 43
  depends_on: []
  answer: {kind: value, value: '-12', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 음수항은 $a_1\sim a_{k-1}$뿐이므로 (다)$-$(나)$=-2(a_1+\cdots+a_{k-1})=24$.
    steps:
    - {id: 1a, content: '$a_1+\cdots+a_{k-1}=-12$', criteria: ['1.B1']}
    hint_ladder:
    - 모든 항의 부호가 같다면 나)와 다)는 어떤 관계인가?
    - 공차가 양수이고 $a_k=0$이면 어떤 항이 음수인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.198
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_1=0$ 또는 $a_m\le0$이면 $\lvert a_1\rvert+\lvert a_2\rvert+\lvert a_3\rvert+\cdots+\lvert a_m\rvert=\lvert a_1+a_2+a_3+\cdots+a_m\rvert$이므로 두 조건 나), 다)를 동시에 만족시킬 수 없다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        따라서 $a_1\ne0$, $a_m>0$이므로 조건 가)에서 $1<k<m$이다. $a_k=0$이고 공차 $2$가 양수이므로 $a_l<0$ $(l=1,2,3,\cdots,k-1)$ …… ① 이어야 한다.
      criteria: ['1.B1']
    - id: 1b-3
      content: |
        $\lvert a_1\rvert+\lvert a_2\rvert+\lvert a_3\rvert+\cdots+\lvert a_m\rvert=(-a_1)+(-a_2)+\cdots+(-a_{k-1})+a_k+a_{k+1}+\cdots+a_m=144$ …… ②이고 조건 나)에서 ②를 빼면 $2(a_1+a_2+\cdots+a_{k-1})=-24$가 되고 따라서 $a_1+a_2+\cdots+a_{k-1}=-12$ ((1)번 답)을 얻는다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 43
      evidence: |
        정답 $-12$를 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $a_1=Ak+2$일 때, 상수 $A$의 값을 구하시오.
  points: 32
  depends_on: []
  answer: {kind: value, value: '-2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a_k=a_1+2(k-1)=0$.
    steps:
    - {id: 2a, content: '$a_1=2-2k$이므로 $A=-2$', criteria: ['2.B1']}
    hint_ladder:
    - 일반항 $a_n=a_1+2(n-1)$에 $n=k$를 넣어라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.198
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a_n=a_1+(n-1)\cdot2=2n-2+a_1$이고 $a_k=2k-2+a_1=0$이므로 $a_1=2-2k$이다. 따라서 (2)번 답은 $-2$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 32
      evidence: |
        정답 $-2$를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $m$의 값을 구하시오.
  points: 25
  depends_on: ['1', '2']
  answer: {kind: value, value: '15', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a_{k-1}=-2$, $\tfrac{(k-1)(a_1+a_{k-1})}{2}=-12$에 $a_1=2-2k$를 넣으면 $k=4$, $a_1=-6$.
    steps:
    - {id: 3a, content: '$\tfrac{m(-12+2(m-1))}{2}=120\Rightarrow m^2-7m-120=0\Rightarrow m=15$', criteria: ['3.B1']}
    hint_ladder:
    - (1)의 합을 등차수열의 합 공식으로 써서 $k$를 구하라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.198
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        또한 $a_1+a_2+\cdots+a_{k-1}=\dfrac{(k-1)(a_1+a_{k-1})}{2}=-12$ …… ③ 한 편, $a_k=0$이고 공차가 $2$이므로 $a_{k-1}=-2$
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        $\dfrac{(k-1)(2-2k-2)}{2}=-12$이고, 이 식을 풀어 $(k-1)(-k)=-12$를 얻는다. $k^2-k-12=0$이고, $(k-4)(k+3)=0$이다. $k$는 자연수이므로 $k=4$ 따라서 $a_1=2-2k$이므로 $a_1=-6$이 된다.
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        $a_1+a_2+\cdots+a_m=120$이므로 $\dfrac{m(2a_1+2(m-1))}{2}=120$, $m^2-7m-120=0$ $\therefore m=15$
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 25
      evidence: |
        정답 $15$를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

