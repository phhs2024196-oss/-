intent: |
  등차수열의 뜻을 알고 있는지와 등차수열의 합의 공식을 이해하고 이를 이용해 문제를 해결할 수 있는지를 평가함.
key_idea: |
  공차가 양수이고 $a_k=0$이므로 $a_1,\dots,a_{k-1}<0$, $a_{k+1},\dots>0$. 절댓값 합과 그냥 합의 차가 $-2(a_1+\cdots+a_{k-1})$이므로 $144-120=-2(a_1+\cdots+a_{k-1})$.
stuck: |
  $a_1=0$ 또는 $a_m\le0$이면 절댓값 합이 합의 절댓값과 같아져 나)·다)가 동시에 성립할 수 없음을 보고 $1<k<m$, 음수항이 $a_1\sim a_{k-1}$임을 확정하는 단계
