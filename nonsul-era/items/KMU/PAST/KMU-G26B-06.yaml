stimuli: []

stem: |
  다항식 $f(x)$를 $x-3$으로 나누면 나머지가 $5$이고, $x+2$로 나누면 나머지가 $-7$이며, $x+1$과 $x-1$로 나누면 나머지가 모두 $0$일 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $f(x)$의 가능한 최소 차수 $n$의 값을 구하시오.
  points: 24
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f=(x^2-1)Q$이고 $Q$가 상수면 $8Q=5$, $3Q=-7$이 모순이므로 $Q$는 일차 이상.
    steps:
    - {id: 1a, content: '$Q(x)=ax+b$로 가능하므로 최소 차수 $n=3$', criteria: ['1.B1']}
    hint_ladder:
    - $x+1$, $x-1$로 나누어떨어지면 $f(x)$는 무엇의 배수인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.200
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=(x^2-1)Q(x)+R(x)=(x^2-1)Q(x)$이고 $Q(x)=ax+b$로 쓸 수 있으므로 최소 차수는 $3$차가 되어 $n=3$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 24
      evidence: |
        정답 $3$을 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    문제 (1)에서 구한 최소 차수 $n$에 대하여 $f(x)=a_nx^n+a_{n-1}x^{n-1}+\cdots+a_2x^2+a_1x+a_0$이고 $a_2=-\dfrac{23}{20}$일 때, $\dfrac{a_1}{a_0}$의 값을 구하시오.
  points: 54
  depends_on: ['1']
  answer: {kind: value, value: '-71/138', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $8(3a+b)=5$, $3(-2a+b)=-7$에서 $a=\tfrac{71}{120}$, $b=-\tfrac{23}{20}$; $f=(x^2-1)(ax+b)$의 $a_1=-a$, $a_0=-b$.
    steps:
    - {id: 2a, content: '$\tfrac{a_1}{a_0}=\tfrac{a}{b}=-\tfrac{71}{138}$', criteria: ['2.B1']}
    hint_ladder:
    - $f(3)$, $f(-2)$를 $a$, $b$로 써라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.200
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)=(x^2-1)(ax+b)$라고 하면 $f(3)=5$이므로 $8(3a+b)=5$, $f(-2)=-7$이므로 $3(-2a+b)=-7$이 되어 $a=\dfrac{71}{120}$, $b=-\dfrac{23}{20}$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        따라서 $f(x)=(x^2-1)\left(\dfrac{71}{120}x-\dfrac{23}{20}\right)=\dfrac{71}{120}x^3-\dfrac{23}{20}x^2-\dfrac{71}{120}x+\dfrac{23}{20}$이므로 $a_2=-\dfrac{23}{20}$, $a_1=-\dfrac{71}{120}$, $a_0=\dfrac{23}{20}$가 되어 $\dfrac{a_1}{a_0}=-\dfrac{71}{138}$.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 54
      evidence: |
        정답 $-\dfrac{71}{138}$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    두 자연수 $a$, $b$의 최대공약수를 $\gcd(a,b)$라고 하자. 문제(2)에서 구한 $a_0$, $a_1$에 대하여 $\lvert a_0\rvert=\dfrac{A_0}{B_0}$, $\lvert a_1\rvert=\dfrac{A_1}{B_1}$이고 $\gcd(A_0,B_0)=1$, $\gcd(A_1,B_1)=1$일 때, $\gcd(B_0,B_1)$의 값을 구하시오.
  points: 22
  depends_on: ['2']
  answer: {kind: value, value: '20', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\lvert a_0\rvert=\tfrac{23}{20}$, $\lvert a_1\rvert=\tfrac{71}{120}$은 기약분수.
    steps:
    - {id: 3a, content: '$\gcd(20,120)=20$', criteria: ['3.B1']}
    hint_ladder:
    - (2)에서 구한 $a_0$, $a_1$이 이미 기약분수인지 확인하라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.200
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $B_0=20$, $B_1=120$이므로 $\gcd(B_0,B_1)=20$
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 22
      evidence: |
        정답 $20$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

