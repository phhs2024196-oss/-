  다항식의 연산과 나머지정리의 의미를 이해하고, 이를 활용하여 문제를 해결할 수 있는지 평가함.
key_idea: |
  $f(\pm1)=0$이므로 $f(x)=(x^2-1)Q(x)$이고, 나머지 조건 두 개를 맞추려면 $Q(x)=ax+b$(일차)가 최소이다. $f(3)=5$, $f(-2)=-7$로 $a$, $b$를 정한다.
stuck: |
  (1)에서 $Q$가 상수이면 $f(3)=8Q=5$, $f(-2)=3Q=-7$이 동시에 성립할 수 없으므로 $Q$가 일차여야 함을 확인하는 단계
