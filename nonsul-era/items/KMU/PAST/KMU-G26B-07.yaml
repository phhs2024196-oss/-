  $a(1)=v\prime(1)=0$과 $\int_1^3v(t)\,dt=0$(변위 $0$)의 연립으로 $A$, $B$를 구하고, $[0,1]$에서 $v\ge0$이므로 거리는 $\int_0^1v(t)\,dt$.
