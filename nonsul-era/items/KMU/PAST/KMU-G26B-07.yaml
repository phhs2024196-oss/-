stimuli: []

stem: |
  원점을 출발하여 수직선 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서 속도 $v(t)$가 아래 조건을 만족할 때, 다음 물음에 답하시오.

  가) $v(t)=t^3-At^2+Bt$이다.

  나) $t=1$일 때, 가속도는 $0$이다.

  다) $t=1$일 때와 $t=3$일 때, 점 $\mathrm{P}$의 위치가 같다.

subparts:
- id: '1'
  stem: |
    상수 $A$의 값을 구하시오.
  points: 26
  depends_on: []
  answer: {kind: value, value: '12', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $3-2A+B=0$, $20-\tfrac{26A}{3}+4B=0$ 연립.
    steps:
    - {id: 1a, content: '$2A-B=3$, $13A-6B=30$에서 $A=12$', criteria: ['1.B1']}
    hint_ladder:
    - 두 시각의 위치가 같다는 것은 그 사이 변위가 얼마라는 뜻인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.202
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        가속도 함수 $a(t)=v\prime(t)=3t^2-2At+B$이므로 $a(1)=3-2A+B=0$이고,
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $t=1$와 $t=3$의 위치가 같기 때문에 변위량이 $0$이다. 즉
        $$\text{변위량}=\int_1^3v(t)\,dt=\int_1^3t^3-At^2+Bt\,dt=\left[\dfrac14t^4-\dfrac13At^3+\dfrac12Bt^2\right]_1^3=20-\dfrac{26A}{3}+4B=0$$
        이다.
      criteria: ['1.B1']
    - id: 1b-3
      content: |
        따라서 $2A-B=3$과 $13A-6B=30$을 모두 만족해야 하므로 $A=12$이고, $B=21$이다. (1) $A=12$
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 26
      evidence: |
        정답 $12$를 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1b-3, 1a]
    deductions: []
  outcome_codes:
