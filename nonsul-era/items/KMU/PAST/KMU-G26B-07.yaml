- id: '3'
  stem: |
    $t=0$에서 $t=1$까지 점 $\mathrm{P}$가 움직인 거리를 구하시오.
  points: 28
  depends_on: ['1', '2']
  answer: {kind: value, value: '27/4', equivalents: ['6.75'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $v(t)=t(t^2-12t+21)$이고 $[0,1]$에서 $t^2-12t+21\ge10>0$이므로 $\lvert v\rvert=v$.
    steps:
    - {id: 3a, content: '$\int_0^1(t^3-12t^2+21t)\,dt=\tfrac14-4+\tfrac{21}{2}=\tfrac{27}{4}$', criteria: ['3.B1']}
    hint_ladder:
    - 거리는 $\int\lvert v(t)\rvert\,dt$이다. $[0,1]$에서 $v$의 부호는?
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.202
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        시각 $t=0$에서 시각 $t=1$까지 원점에서 출발하여 움직이는 거리식은
        $$s=\int_0^1\lvert v(t)\rvert\,dt=\int_0^1t(t^2-12t+21)\,dt\quad(0\le t\le1\text{에서 }t^2-12t+21\ge0\text{이므로})$$
        $$=\int_0^1(t^3-12t^2+21t)\,dt=\dfrac{27}{4}$$
        이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 28
      evidence: |
        정답 $\dfrac{27}{4}$를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

