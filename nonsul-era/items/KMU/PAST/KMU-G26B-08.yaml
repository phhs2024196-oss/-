stem: |
  점 $(1,0)$은 두 곡선 $Axe^{xy}=2$과 $x-x\sin y=Bx^2+C$ 위의 점이다. 점 $(1,0)$에서 두 곡선이 같은 접선을 가질 때, 다음 물음에 답하시오. (단, $A$, $B$, $C$는 상수)

subparts:
- id: '1'
  stem: |
    $A$의 값을 구하시오.
  points: 18
  depends_on: []
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $(1,0)$을 $Axe^{xy}=2$에 대입.
    steps:
    - {id: 1a, content: '$A\cdot1\cdot e^0=2\Rightarrow A=2$', criteria: ['1.B1']}
    hint_ladder:
    - 점이 곡선 위에 있다는 것을 식으로 써라.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.204
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $(1,0)$은 두 곡선 $Axe^{xy}=2$과 $x-x\sin y=Bx^2+C$ 위의 점이므로, 주어진 두 음함수에 $(1,0)$을 대입하면, $A=2$, $1=B+C$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 18
      evidence: |
        정답 $2$를 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $B$의 값을 구하시오.
  points: 31
  depends_on: ['1']
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 두 곡선의 $(1,0)$에서의 기울기는 각각 $-1$, $1-2B$.
    steps:
    - {id: 2a, content: '$1-2B=-1\Rightarrow B=1$', criteria: ['2.B1']}
    hint_ladder:
    - 두 식을 $x$에 대해 음함수 미분한 뒤 $(1,0)$을 대입하라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.204
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        음함수 $x-x\sin y=Bx^2+C$를 음함수 미분하고 $(1,0)$을 대입하면 기울기가 $1-2B$이다. 음함수 $Axe^{xy}=2$에 대하여 같은 방법을 적용하면 기울기는 $-1$이라는 걸 알 수 있다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        두 곡선은 같은 접선을 가지므로 점 $(1,0)$에서 두 미분계수가 같으므로 $1-2B=-1$이고, 문제(1)의 결과인 $1=B+C$를 이용하면 $B=1$, $C=0$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 31
      evidence: |
        정답 $1$을 정확히 기재했다.
      depends_on: []
