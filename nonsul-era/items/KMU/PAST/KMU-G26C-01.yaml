stimuli: []

stem: |
  수열 $\{a_n\}$이 $a_1=3$, $a_2=-2$이고, 모든 자연수 $n$에 대해 $S_n=\displaystyle\sum_{k=1}^{n}a_k$일 때, $S_{n+2}=\sqrt3S_n$을 만족한다.

subparts:
- id: '1'
  stem: |
    $S_{2n}=3^{f(n)}$일 때, $f(n)$을 구하시오.
  points: 43
  depends_on: []
  answer: {kind: expression, value: '(n-1)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S_2=1$이고 짝수 번째 합은 공비 $\sqrt3$인 등비수열이므로 $S_{2n}=(\sqrt3)^{n-1}=3^{\frac{n-1}{2}}$.
    steps:
    - {id: 1a, content: '$S_{2n}=1\cdot(\sqrt3)^{n-1}=3^{\frac{n-1}{2}}$, $f(n)=\tfrac{n-1}{2}$', criteria: ['1.B1']}
    hint_ladder:
    - $S_2$, $S_4$, $S_6$, …을 차례로 계산해 보아라.
    - $S_{n+2}=\sqrt3S_n$에서 $n$이 짝수인 경우만 모아라.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.206
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $S_1=a_1=3$, $S_2=a_1+a_2=3-2=1$
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        $S_2=1$, $\dfrac{S_{n+2}}{S_n}=\sqrt3$이므로 $S_2=1$, $S_4=\sqrt3$, $S_6=(\sqrt3)^2$, $S_8=(\sqrt3)^3$, $S_{10}=(\sqrt3)^4$, $\cdots$ 따라서 $S_{2n}=(\sqrt3)^{n-1}$, $f(n)=\dfrac{n-1}{2}$(1번 답)이 된다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 43
      evidence: |
        정답 $f(n)=\dfrac{n-1}{2}$을 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $S_{2n+1}=3^{g(n)}$일 때, $g(n)$을 구하시오.
  points: 43
  depends_on: []
  answer: {kind: expression, value: '1+n/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $S_1=3$이고 홀수 번째 합도 공비 $\sqrt3$인 등비수열이므로 $S_{2n+1}=3(\sqrt3)^n=3^{1+\frac{n}{2}}$.
    steps:
    - {id: 2a, content: '$S_{2n+1}=3\cdot(\sqrt3)^{n}=3^{1+\frac{n}{2}}$, $g(n)=1+\tfrac{n}{2}$', criteria: ['2.B1']}
    hint_ladder:
    - $S_1$, $S_3$, $S_5$, …을 차례로 계산해 보아라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.206
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        또한 $S_1=3$, $\dfrac{S_{n+2}}{S_n}=\sqrt3$이므로 즉, $S_1=3$, $S_3=3\sqrt3$, $S_5=3(\sqrt3)^2$, $S_7=3(\sqrt3)^3$, $\cdots$
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        따라서 $S_{2n+1}=3(\sqrt3)^n=3^{1+\frac{n}{2}}$, $g(n)=1+\dfrac{n}{2}$(2번 답)이 된다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 43
      evidence: |
        정답 $g(n)=1+\dfrac{n}{2}$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $a_{16}+a_{17}+a_{18}$의 값을 구하시오.
  points: 34
  depends_on: ['1', '2']
  answer: {kind: value, value: '81-81*sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 연속한 세 항의 합은 부분합의 차 $S_{18}-S_{15}$이고, (1)(2)에서 $S_{18}=(\sqrt3)^8$, $S_{15}=3(\sqrt3)^7$.
    steps:
    - {id: 3a, content: '$a_{16}+a_{17}+a_{18}=S_{18}-S_{15}=81-81\sqrt3$', criteria: ['3.B1']}
    hint_ladder:
    - $a_{16}+a_{17}+a_{18}$을 두 부분합의 차로 써 보아라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.206
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        그러므로 3번 답은 $a_{16}+a_{17}+a_{18}=S_{18}-S_{15}=(\sqrt3)^8-3(\sqrt3)^7=81-81\sqrt3$
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 34
      evidence: |
        정답 $81-81\sqrt3$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

