intent: |
  등비수열의 뜻을 알고 주어진 수열로부터 일반항을 구할 수 있는지를 평가함. 또한 수열의 합 $S_n$에서 $S_k$를 뺀 값의 의미 즉, 예를 들어 $S_{18}-S_{15}=a_{16}+a_{17}+a_{18}$를 이해하는지에 대한 평가임.
key_idea: |
  $S_{n+2}=\sqrt3S_n$은 짝수 번째 합끼리, 홀수 번째 합끼리 공비 $\sqrt3$인 등비수열을 이룬다는 뜻이다. $S_2=1$, $S_1=3$에서 출발하면 $S_{2n}=(\sqrt3)^{n-1}$, $S_{2n+1}=3(\sqrt3)^n$이고, 연속한 항의 합은 $S_{18}-S_{15}$로 구한다.
stuck: |
  $S_{n+2}=\sqrt3S_n$을 $a_n$의 점화식으로 착각해 일반항 $a_n$을 직접 구하려는 단계(합 $S_n$을 홀짝으로 나누어 등비수열로 보아야 한다)
idea_tags: [IDEA-SUM-RECURRENCE-PARITY-SPLIT, IDEA-PARTIAL-SUM-DIFFERENCE]
tags: [등비수열, 수열의 합과 일반항, 홀짝 분리]
