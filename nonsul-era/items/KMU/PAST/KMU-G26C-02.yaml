stimuli: []

stem: |
  수열 $\{a_n\}$이 아래 조건을 만족할 때, 다음 물음에 답하시오.

  가) $a_1=\dfrac13$

  나) $a_n=\log_{27}\left\{\dfrac{3(n+25)}{n+26}\right\}$ (단, $n\ge2$)

subparts:
- id: '1'
  stem: |
    수열 $\{a_n\}$의 극한값을 구하시오.
  points: 24
  depends_on: []
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{3(n+25)}{n+26}\to3$이므로 $a_n\to\log_{27}3=\tfrac13$.
    steps:
    - {id: 1a, content: '$\lim a_n=\log_{27}3=\tfrac13$', criteria: ['1.B1']}
    hint_ladder:
    - 로그 안의 분수식의 극한을 먼저 구하라.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.208
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $$\lim_{n\to\infty}a_n=\lim_{n\to\infty}\log_{27}\left\{\dfrac{3(n+25)}{n+26}\right\}=\lim_{n\to\infty}\dfrac13\log_3\left\{\dfrac{3(n+25)}{n+26}\right\}=\dfrac13\log_3\{3\}=\dfrac13$$
        이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 24
      evidence: |
        정답 $\dfrac13$을 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $\displaystyle\sum_{k=1}^{m}a_k=N$일 때, $N$이 자연수가 되는 $m$의 최솟값을 구하시오.
  points: 48
  depends_on: []
  answer: {kind: value, value: '55', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 망원 합으로 $N=\tfrac13\{m+3-\log_3(m+26)\}$, 즉 $m+26=3^{m+3-3N}$이므로 $m+26=27,81,\dots$를 차례로 확인한다.
    steps:
    - {id: 2a, content: '$m+26=27$이면 $N=\tfrac13$(모순), $m+26=81$이면 $m=55$, $N=18$', criteria: ['2.B1']}
    hint_ladder:
    - $\log_{27}\dfrac{3(n+25)}{n+26}$을 세 개의 로그로 쪼개 합해 보아라.
    - $N$이 자연수가 되려면 $\log_3(m+26)$은 어떤 수여야 하는가?
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.208
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a_n=\dfrac13\{\log_33+\log_3(n+25)-\log_3(n+26)\}$이므로
        $$\sum_{n=1}^{m}a_n=a_1+\sum_{n=2}^{m}a_n=\dfrac13+\dfrac13\sum_{n=2}^{m}\{1+\log_3(n+25)-\log_3(n+26)\}=\dfrac13+\dfrac13\{m-1+\log_327-\log_3(m+26)\}$$
        $$=\dfrac13+\dfrac13\{m+2-\log_3(m+26)\}=\dfrac13\{m+3-\log_3(m+26)\}=N$$
        이라고 하면 $m+3-\log_3(m+26)=3N$으로 $m+26=3^{m+3-3N}$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        따라서 $m+26$이 $3$의 거듭제곱이어야 한다.
      criteria: ['2.B1']
    - id: 2b-3
      content: |
        case i) $m+26=27=3^3$이면 $m=1$이고, $N=a_1=\dfrac13$으로 모순

        case ii) $m+26=81=3^4$이면 $m=55$이고, $3^4=55+26=3^{55+3-3N}$으로 $N=18$이다.
      criteria: ['2.B1']
    - id: 2b-4
      content: |
        결국, $\displaystyle\sum_{k=1}^{m}a_k$이 자연수가 되는 $m$의 최솟값은 $55$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 48
      evidence: |
        정답 $55$를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2b-2, 2b-3, 2b-4, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $\displaystyle\sum_{k=1}^{m}a_k=N$일 때, $2026$보다 작은 자연수 $N$을 모두 합한 값을 구하시오.
  points: 48
  depends_on: ['2']
  answer: {kind: value, value: '737', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $m+26=3^j$이면 $N=\tfrac{3^j-23-j}{3}$이고, 이것이 자연수인 것은 $j\equiv1\pmod3$, $j\ge4$일 때뿐이다. $j=4,7$에서 $N=18,719$, $j=10$이면 $2026$ 초과.
    steps:
    - {id: 3a, content: '$j=3k+1$일 때 $N=3^{3k}-8-k$: $k=1,2$에서 $18$, $719$, 합 $737$', criteria: ['3.B1']}
    hint_ladder:
    - $m+26=3^j$로 두고 $N$을 $j$로 나타내 보아라.
    - $j$를 $3$으로 나눈 나머지로 경우를 나누어라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 pp.208~209
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        case iii) $m+26=3^5=243$이면 $m=217$이고, $3^5=217+26=3^{217+3-3N}$으로 $N=\dfrac{215}{3}$으로 모순이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        일반화를 하면 $m+26=3^{3k+\alpha}$ ($k$는 자연수, $\alpha=0,1,2$)이면 $m=3^{3k+\alpha}-26$이고, $3^{3k+\alpha}=3^{3^{3k+\alpha}-26+3-3N}$으로 $3k+\alpha=3^{3k+\alpha}-23-3N$인데, $3k+\alpha\ne0$이므로 $23+\alpha$가 $3$의 배수인 $\alpha=1$일 때, $\displaystyle\sum_{k=1}^{m}a_k$은 자연수가 될 수 있다.
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        따라서 $m+26=3^{3k+1}$ ($k$는 자연수)이면 $m=3^{3k+1}-26$이고, $3^{3k+1}=3^{3^{3k+1}-26+3-3N}$으로 거듭제곱이 같아야 하므로 $N=3^{3k}-8-k$으로 자연수이다.
      criteria: ['3.B1']
    - id: 3b-4
      content: |
        결국, $k=2$이면 $N=719$이고, $k=3$이면 $N=3^9-11>2026$이므로 $\displaystyle\sum_{k=1}^{m}a_k$가 $2026$보다 작은 자연수 $N$을 모두 합은 $737$이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 48
      evidence: |
        정답 $737$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3b-3, 3b-4, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

