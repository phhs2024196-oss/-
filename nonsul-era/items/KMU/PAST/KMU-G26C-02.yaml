intent: |
  수열의 극한을 이해하고, 로그의 성질을 이용하여 수열의 합을 계산할 수 있는지 평가함
key_idea: |
  $a_n=\dfrac13\{1+\log_3(n+25)-\log_3(n+26)\}$ $(n\ge2)$로 쪼개면 합이 망원(telescoping)되어 $\sum_{k=1}^{m}a_k=\dfrac13\{m+3-\log_3(m+26)\}$이다. $N$이 자연수이려면 $m+26=3^j$이고 $j+23\equiv0\pmod3$이어야 한다.
stuck: |
  $m+26$이 $3$의 거듭제곱이라는 필요조건만으로 끝내지 않고, $m+26=3^{3k+\alpha}$에서 $3k+\alpha-23-3N$이 $3$의 배수가 되는 $\alpha=1$만 남기는 경우 분류 단계
idea_tags: [IDEA-LOG-TELESCOPING-SUM, IDEA-POWER-OF-3-RESIDUE-CASES]
tags: [로그의 성질, 망원급수, 수열의 극한, 정수 조건]
