  - '여러 가지 수열의 합(망원 합)'
  - '거듭제곱과 나머지'
  tools:
  - '$\log_{27}X=\tfrac13\log_3X$'
  - '$\log_3\tfrac{3(n+25)}{n+26}=1+\log_3(n+25)-\log_3(n+26)$로 분해 후 망원 합'
  - '$m+26=3^{m+3-3N}$ → $m+26$은 $3$의 거듭제곱'
