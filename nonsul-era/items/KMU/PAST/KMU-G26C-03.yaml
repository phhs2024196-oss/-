stimuli: []

stem: |
  오른쪽 그림과 같이 중심이 원점 $\mathrm{O}$이고 반지름이 $r$인 원의 둘레 위에 서로 다른 $2n$개의 점 $\mathrm{A}_1$, $\mathrm{A}_2$, $\cdots$, $\mathrm{A}_{2n-1}$, $\mathrm{A}_{2n}$이 있다. $n\ge2$이고 $\angle\mathrm{A}_i\mathrm{O}\mathrm{A}_{i+1}=\dfrac{\pi}{n}$ $(i=1,2,\cdots,2n-1)$을 만족할 때, 다음 물음에 답하시오.

  [그림] 원점 $\mathrm{O}$를 중심으로 하는 원(점선) 위에 12개의 점이 같은 간격으로 찍혀 있고, 이웃한 두 점 $\mathrm{A}_i$, $\mathrm{A}_{i+1}$을 $\mathrm{O}$와 이은 두 반지름 사이의 각에 $\dfrac{\pi}{n}$이 표시되어 있다.

subparts:
- id: '1'
  stem: |
    $n=5$일 때, 원 위의 서로 다른 세 점을 이어서 만들 수 있는 삼각형 중 직각삼각형이 아닌 것들의 개수를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '80', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 전체 ${}_{10}\mathrm{C}_3=120$, 직각삼각형은 지름 $5$개 $\times$ 나머지 $8$점 $=40$.
    steps:
    - {id: 1a, content: '$120-5\times8=80$', criteria: ['1.B1']}
    hint_ladder:
    - 원에 내접하는 삼각형이 직각삼각형이 되는 조건은?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.211
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $n=5$일 때, 점의 개수는 $10$개이므로 만들 수 있는 삼각형의 개수는 ${}_{10}\mathrm{C}_3=\dfrac{10!}{3!7!}=\dfrac{10\cdot9\cdot8}{3\cdot2\cdot1}=120$.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        원주각의 성질에 의해 직각삼각형이 되기 위해서는 삼각형의 한 변이 원의 지름이어야 하므로 원의 지름을 결정하는 두 점을 고르는 경우의 수$=5$가지이고 나머지 $8$개의 점 중에서 $1$개를 고르는 경우의 수는 ${}_8\mathrm{C}_1=8$가지이므로 직각삼각형을 고르는 경우의 수는 $40$가지. 따라서, 직각삼각형이 아닌 삼각형의 개수는 $120-40=80$가지.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 20
      evidence: |
        정답 $80$을 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $n=10$일 때, 원 위의 서로 다른 세 점을 이어서 만들 수 있는 삼각형 중 직각삼각형이 아닌 것들의 개수를 구하시오.
  points: 24
  depends_on: []
  answer: {kind: value, value: '960', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 전체 ${}_{20}\mathrm{C}_3=1140$, 직각삼각형 $10\times18=180$.
    steps:
    - {id: 2a, content: '$1140-180=960$', criteria: ['2.B1']}
    hint_ladder:
    - (1)과 같은 방법으로 세어라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.211
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $n=10$일 때, 점의 개수는 $20$개이므로 만들 수 있는 삼각형의 개수는 ${}_{20}\mathrm{C}_3=\dfrac{20!}{3!17!}=\dfrac{20\cdot19\cdot18}{3\cdot2\cdot1}=1140$.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        원주각의 성질에 의해 직각삼각형이 되기 위해서는 삼각형의 한 변이 원의 지름이어야 하므로 원의 지름을 결정하는 두 점을 고르는 경우의 수$=10$가지이고 나머지 $18$개의 점 중에서 $1$개를 고르는 경우의 수는 ${}_{18}\mathrm{C}_1=18$가지이므로 직각삼각형을 고르는 경우의 수는 $180$가지. 따라서, 직각삼각형이 아닌 삼각형의 개수는 $1140-180=960$가지.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 24
      evidence: |
        정답 $960$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    자연수 $k$에 대하여 $n=k$일 때, 원 위의 서로 다른 세 점을 이어서 만들 수 있는 삼각형 중 직각삼각형이 아닌 것들의 개수는 $\dfrac13(Ak^3+Bk^2+Ck+D)$이다. 이때, $A-B+C-D$의 값을 구하시오. (단, $A,B,C,D$는 실수)
  points: 56
  depends_on: []
  answer: {kind: value, value: '24', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: ${}_{2k}\mathrm{C}_3-k(2k-2)=\tfrac13(4k^3-12k^2+8k)$이므로 $(A,B,C,D)=(4,-12,8,0)$.
    steps:
    - {id: 3a, content: '$A-B+C-D=4+12+8-0=24$', criteria: ['3.B1']}
    hint_ladder:
    - (1)(2)의 셈을 $n=k$로 일반화해 $k$의 다항식으로 정리하라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.211
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $n=k$일 때, 점의 개수는 $2k$개이므로 만들 수 있는 삼각형의 개수는 ${}_{2k}\mathrm{C}_3=\dfrac{(2k)!}{3!(2k-3)!}=\dfrac{2k(2k-1)(2k-2)}{6}$.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        원주각의 성질에 의해 직각삼각형이 되기 위해서는 삼각형의 한 변이 원의 지름이어야 하므로 원의 지름을 결정하는 두 점을 고르는 경우의 수$=k$가지이고 나머지 $2k-2$개의 점 중에서 $1$개를 고르는 경우의 수는 ${}_{2k-2}\mathrm{C}_1=2k-2$가지이므로 직각삼각형을 고르는 경우의 수는 $k(2k-2)$가지.
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        따라서, 직각삼각형이 아닌 삼각형의 개수는 $\dfrac{2k(2k-1)(2k-2)}{6}-k(2k-2)=\dfrac13(4k^3-12k^2+8k)$이므로 $A=4$, $B=-12$, $C=8$, $D=0$이 되어 $A-B+C-D=4-(-12)+8=24$.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 56
      evidence: |
        정답 $24$를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

