intent: |
  조합의 의미를 이해하고, 조합의 수를 구할 수 있는지 평가한다.
key_idea: |
  원에 내접하는 삼각형이 직각삼각형일 필요충분조건은 한 변이 지름인 것(원주각의 성질)이다. $2n$개의 점이 등간격이므로 지름은 $n$개, 각 지름마다 나머지 $2n-2$개 점 중 하나를 고르면 직각삼각형이고, 이를 전체 ${}_{2n}\mathrm{C}_3$에서 뺀다.
stuck: |
  (3)에서 전체 삼각형 수 ${}_{2k}\mathrm{C}_3$에서 직각삼각형 수 $k(2k-2)$를 뺀 식을 $k$에 대한 삼차식으로 정리해 계수를 비교하는 단계
