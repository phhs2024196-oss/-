intent: |
  단면의 넓이와 입체도형의 부피 사이의 관계를 이해하고, 치환적분법과 부분적분법을 이용하여 입체도형의 부피를 계산할 수 있음을 평가한다.
key_idea: |
  단면은 지름이 $\sec x$인 반원이므로 $A(x)=\dfrac{\pi}{8}\sec^2x$. (3)의 적분은 $\displaystyle\int_0^{\frac{\pi}{4}}x\sec^4x\,dx$이고, $\sec^4x$의 부정적분 $\tan x+\tfrac13\tan^3x$로 부분적분한 뒤 $\int\tan^3x\,dx$를 $u=\cos x$로 치환한다.
stuck: |
  (3)에서 $x\sec^4x$를 부분적분할 때 $\sec^4x=\sec^2x(1+\tan^2x)$의 부정적분 $\tan x+\tfrac13\tan^3x$를 찾고, 남은 $\int\tan^3x\,dx$를 치환적분으로 처리하는 단계
