stem: |
  곡선 $y=\sec x$와 직선 $x=0$, $y=0$ 그리고 $x=\dfrac{\pi}{4}$로 둘러싸인 부분을 밑면으로 하는 입체도형을 $S$라 하자. 이 입체도형 $S$를 $x$축에 수직인 평면으로 자른 단면이 모두 반원일 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    단면의 넓이 $A(x)$를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'pi*sec(x)**2/8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 반원의 지름이 $\sec x$이므로 $A(x)=\tfrac12\pi\left(\tfrac{\sec x}{2}\right)^2$.
    steps:
    - {id: 1a, content: '$A(x)=\tfrac{\pi}{8}\sec^2x$', criteria: ['1.B1']}
    hint_ladder:
    - 단면 반원의 지름은 밑면의 어느 선분인가?
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.214
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=\sec x$와 직선 $x=0$, $y=0$ 그리고 $x=\dfrac{\pi}{4}$로 둘러싸인 부분을 밑면으로 하는 입체도형 $S$는 $x$축에 수직인 평면으로 자른 단면은 반지름이 $\dfrac{\sec x}{2}$ 반원이므로 단면의 넓이 $A(x)$는 $A(x)=\dfrac12\left(\pi\left(\dfrac{\sec x}{2}\right)^2\right)=\dfrac{\sec^2x}{8}\pi$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 15
      evidence: |
        정답 $\dfrac{\sec^2x}{8}\pi$를 정확히 기재했다($A(x)=\dfrac{\sec^2x}{8}\pi$로 써도 정답).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $A(x)$를 이용하여 입체도형 $S$의 부피를 구하시오.
  points: 25
  depends_on: ['1']
  answer: {kind: value, value: 'pi/8', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $V=\int_0^{\frac{\pi}{4}}\tfrac{\pi}{8}\sec^2x\,dx=\tfrac{\pi}{8}\left[\tan x\right]_0^{\frac{\pi}{4}}$.
    steps:
    - {id: 2a, content: '$V=\tfrac{\pi}{8}$', criteria: ['2.B1']}
    hint_ladder:
    - $\sec^2x$의 부정적분은?
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.214
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문제(1)에서 계산한 단면의 넓이 $A(x)$를 이용하여 입체도형 $S$의 부피를 계산하면
        $$\int_0^{\frac{\pi}{4}}A(x)\,dx=\dfrac{\pi}{8}\int_0^{\frac{\pi}{4}}\sec^2x\,dx=\dfrac{\pi}{8}\left[\tan x\right]_0^{\frac{\pi}{4}}=\dfrac{\pi}{8}$$
        이다. 따라서 입체도형 $S$의 부피는 $\dfrac{\pi}{8}$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 25
      evidence: |
        정답 $\dfrac{\pi}{8}$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $\displaystyle\int_0^{\frac{\pi}{4}}x\left\{\dfrac{8}{\pi}A(x)\right\}^2dx=B\pi+C\ln2+D$일 때, $B+C+D$의 값을 구하시오. (단, $B,C,D$는 유리수)
  points: 60
  depends_on: ['1']
  answer: {kind: value, value: '-1/6', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\int_0^{\frac{\pi}{4}}x\sec^4x\,dx=\tfrac{\pi}{3}-\tfrac13\ln2-\tfrac16$이므로 $B=\tfrac13$, $C=-\tfrac13$, $D=-\tfrac16$.
    steps:
    - {id: 3a, content: '$B+C+D=\tfrac13-\tfrac13-\tfrac16=-\tfrac16$', criteria: ['3.B1']}
    hint_ladder:
    - $\left\{\tfrac{8}{\pi}A(x)\right\}^2=\sec^4x$이다.
    - $\sec^4x=\sec^2x(1+\tan^2x)$의 부정적분을 구해 부분적분하라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 pp.214~215
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        문제의 적분 식을 부분적분을 이용하여 계산하면 아래와 같다.
        $$\int_0^{\frac{\pi}{4}}x\left\{\dfrac{8}{\pi}A(x)\right\}^2dx=\int_0^{\frac{\pi}{4}}x\sec^4x\,dx=\left[x\tan x+\dfrac13x\tan^3x\right]_0^{\frac{\pi}{4}}-\int_0^{\frac{\pi}{4}}\left(\tan x+\dfrac13\tan^3x\right)dx$$
        $$=\dfrac{\pi}{3}-\int_0^{\frac{\pi}{4}}\tan x\,dx-\dfrac13\int_0^{\frac{\pi}{4}}\tan^3x\,dx=\dfrac{\pi}{3}+\ln\left(\dfrac{\sqrt2}{2}\right)-\dfrac13\int_0^{\frac{\pi}{4}}\tan^3x\,dx$$
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        그리고 $\cos x=u$로 두고 $\int\tan^3x\,dx$를 치환적분하면
        $$\int\tan^3x\,dx=\int\dfrac{\sin^3x}{\cos^3x}dx=\int\dfrac{u^2-1}{u^3}du=\int\left\{\dfrac1u-\dfrac1{u^3}\right\}du=\ln\lvert u\rvert+\dfrac{1}{2u^2}=\ln\lvert\cos x\rvert+\dfrac{1}{2\cos^2x}$$
      criteria: ['3.B1']
    - id: 3b-3
      content: |
        이므로
        $$\int_0^{\frac{\pi}{4}}x\left\{\dfrac{8}{\pi}A(x)\right\}^2dx=\dfrac{\pi}{3}+\ln\left(\dfrac{\sqrt2}{2}\right)-\dfrac13\left[\ln(\cos x)+\dfrac12\sec^2x\right]_0^{\frac{\pi}{4}}=\dfrac{\pi}{3}+\dfrac23\ln\left(\dfrac{\sqrt2}{2}\right)-\dfrac16=\dfrac{\pi}{3}-\dfrac13\ln2-\dfrac16$$
        이다.
      criteria: ['3.B1']
    - id: 3b-4
      content: |
        문제에서 요구하는 답의 형태인 $\displaystyle\int_0^{\frac{\pi}{4}}x\left\{\dfrac{8}{\pi}A(x)\right\}^2dx=B\pi+C\ln2+D$로 정리하면, $B=\dfrac13$, $C=-\dfrac13$ 그리고 $D=-\dfrac16$이므로 $B+C+D=-\dfrac16$이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 60
      evidence: |
        정답 $-\dfrac16$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3b-3, 3b-4, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

