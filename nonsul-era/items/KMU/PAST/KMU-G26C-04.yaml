  - 발문은 "단면이 모두 반원"이라고만 하고, 반원의 지름이 밑면의 세로 선분($\sec x$)이라는 것은 공식 해설에서 정함.
  - 2027 논술가이드북 문제 4(p.44, 단면이 정사각형인 입체도형)와는 다른 문항이며, 이 문항은 가이드북에 수록되지 않음.

