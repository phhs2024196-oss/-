  - 공식 채점 기준: 하위 문항별 "정답을 정확히 기재하면 1.5점 / 2.5점 / 6점"(약술형, 부분 점수 없음). 공식 정답 (1)은 "$\dfrac{\sec^2x}{8}\pi$ ($A(x)=\dfrac{\sec^2x}{8}\pi$도 정답)".
  - 자료 출처(문항카드): 미적분 김원경(비상, 2025) 151·147·155쪽, 미적분 이준열(천재교육, 2025) 173·126·131쪽.
