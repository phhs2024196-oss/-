intent: |
  삼각함수의 덧셈정리를 이용해 식을 정리하고 이를 활용하여 삼각함수와 로그함수의 극한을 계산 할 수 있는지 평가함. 또한 음함수 미분법을 활용하여 접선의 기울기를 찾을 수 있는지 평가함
key_idea: |
  $\cos\left(\tfrac{\pi}{2}+x^2\right)=-\sin x^2$, $\sin\left(\tfrac{\pi}{2}-x^2\right)=\cos x^2$로 바꾸면 덧셈정리에 의해 $f(x)=\sin\{(x^2+2x)-x^2\}=\sin2x$이다. 이후 극한과 음함수 미분은 $f(x)=\sin2x$로 계산한다.
stuck: |
  복잡해 보이는 $f(x)$를 $\tfrac{\pi}{2}\pm\theta$ 변환 후 사인의 덧셈정리 $\sin(\alpha-\beta)$ 꼴로 인식해 $\sin2x$로 단순화하는 단계
idea_tags: [IDEA-TRIG-ADDITION-COLLAPSE, IDEA-IMPLICIT-DIFF-SLOPE]
tags: [삼각함수의 덧셈정리, 함수의 극한, 음함수의 미분]
