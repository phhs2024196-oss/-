stimuli: []

stem: |
  함수 $f(x)=\cos(x^2+2x)\cos\left(\dfrac{\pi}{2}+x^2\right)+\sin(x^2+2x)\sin\left(\dfrac{\pi}{2}-x^2\right)$에 대하여, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $f\left(\dfrac{\pi}{3}\right)$의 값을 구하시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: 'sqrt(3)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=\sin(x^2+2x)\cos x^2-\cos(x^2+2x)\sin x^2=\sin2x$.
    steps:
    - {id: 1a, content: '$f\left(\tfrac{\pi}{3}\right)=\sin\tfrac{2\pi}{3}=\tfrac{\sqrt3}{2}$', criteria: ['1.B1']}
    hint_ladder:
    - $\cos\left(\tfrac{\pi}{2}+\theta\right)$, $\sin\left(\tfrac{\pi}{2}-\theta\right)$를 간단히 하라.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.217
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각함수의 덧셈법칙에 의해
        $$f(x)=\cos(x^2+2x)\cos\left(\dfrac{\pi}{2}+x^2\right)+\sin(x^2+2x)\sin\left(\dfrac{\pi}{2}-x^2\right)=-\cos(x^2+2x)\sin(x^2)+\sin(x^2+2x)\cos(x^2)=\sin(x^2+2x-x^2)=\sin(2x)$$
        이므로 $f\left(\dfrac{\pi}{3}\right)=\sin\left(\dfrac{2\pi}{3}\right)=\dfrac{\sqrt3}{2}$이다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 30
      evidence: |
        정답 $\dfrac{\sqrt3}{2}$를 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $\displaystyle\lim_{x\to0}\dfrac{f(-4x)}{\ln(1+2x)}$의 값을 구하시오.
  points: 33
  depends_on: ['1']
  answer: {kind: value, value: '-4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(-4x)=\sin(-8x)$이므로 $\tfrac{\sin(-8x)}{-8x}\cdot\tfrac{2x}{\ln(1+2x)}\cdot\tfrac{-8x}{2x}\to-4$.
    steps:
    - {id: 2a, content: '극한값 $=1\cdot1\cdot(-4)=-4$', criteria: ['2.B1']}
    hint_ladder:
    - 분자와 분모를 각각 기본 극한 꼴로 맞추어라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.217
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $$\lim_{x\to0}\dfrac{f(-4x)}{\ln(1+2x)}=\lim_{x\to0}\dfrac{\sin(-8x)}{-8x}\times\dfrac{2x}{\ln(1+2x)}\times\dfrac{-8x}{2x}=-4$$
        이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 33
      evidence: |
        정답 $-4$를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    곡선 $x^3+f(y^3)=xy+e^y$ 위의 점 $(a,0)$에서 접선의 기울기가 $m$일 때, $m-a$의 값을 구하시오.
  points: 37
  depends_on: ['1']
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $x^3+\sin(2y^3)=xy+e^y$에 $(a,0)$을 대입하면 $a=1$, 양변을 미분해 $(1,0)$을 대입하면 $3=2\dfrac{dy}{dx}$.
    steps:
    - {id: 3a, content: '$m=\tfrac32$, $m-a=\tfrac12$', criteria: ['3.B1']}
    hint_ladder:
    - $f(y^3)=\sin(2y^3)$로 바꾸고 점의 좌표부터 구하라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.217
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        음함수식 $x^3+\sin(2y^3)=xy+e^y$에 $(a,0)$을 대입하면 $a^3=1$이므로 $a=1$이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        음함수 미분법에 의해 $3x^2+6y^2\cos(2y^3)\dfrac{dy}{dx}=y+x\dfrac{dy}{dx}+e^y\dfrac{dy}{dx}$이므로 $f\prime(1)=m=\dfrac32$이다. 따라서 $m-a=\dfrac12$이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 37
      evidence: |
        정답 $\dfrac12$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

