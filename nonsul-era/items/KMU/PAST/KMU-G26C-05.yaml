  - 공식 해설 (3)의 "$f\prime(1)=m$"은 원문 표기 그대로(문제의 $f$와 무관하게 점 $(1,0)$에서의 $\tfrac{dy}{dx}$를 뜻함).
  - 2027 논술가이드북(2026 자연계 문제 1~8)에는 이 문항이 수록되지 않음.

