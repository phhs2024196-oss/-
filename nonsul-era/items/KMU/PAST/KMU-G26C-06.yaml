stem: |
  두 자연수 $A$, $B$가 $A<B$를 만족할 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $A+B=100$을 만족하는 순서쌍 $(A,B)$의 개수를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '49', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $A<100-A$에서 $A<50$이므로 $A=1,\dots,49$.
    steps:
    - {id: 1a, content: '순서쌍 $49$개', criteria: ['1.B1']}
    hint_ladder:
    - $B=100-A$를 $A<B$에 대입하라.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.219
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $A$는 자연수이므로 $A\ge1$이고 $A<B=100-A$에서 $A<50$이 되어 $A=1,2,\cdots,49$이다. 따라서 순서쌍은 $(1,99),(2,98),\cdots,(48,52),(49,51)$이 되어 $49$개가 된다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 20
      evidence: |
        정답 $49$(개)를 정확히 기재했다(약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $A+B=2026$을 만족하는 순서쌍 $(A,B)$의 개수를 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '1012', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $A<2026-A$에서 $A<1013$이므로 $A=1,\dots,1012$.
    steps:
    - {id: 2a, content: '순서쌍 $1012$개', criteria: ['2.B1']}
    hint_ladder:
    - (1)과 같은 방법으로 $A$의 범위를 구하라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.219
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $A$는 자연수이므로 $A\ge1$이고 $A<B=2026-A$에서 $A<1013$이 되어 $A=1,2,\cdots,1012$이다. 따라서 순서쌍은 $(1,2025),(2,2024),\cdots,(1011,1015),(1012,1014)$이 되어 $1012$개가 된다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 25
      evidence: |
        정답 $1012$(개)를 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    자연수 $n$에 대하여 $A+B=2n$을 만족하는 순서쌍 $(A,B)$의 개수를 $a_n$이라고 할 때, 서로 다른 세 소수 $p$, $q$, $r$에 대하여 $\displaystyle\sum_{n=1}^{2026}a_n=p^4\times q^2\times r$이다. 이때, $p+q+r$의 값을 구하시오.
  points: 55
  depends_on: []
  answer: {kind: value, value: '1021', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a_n=n-1$이고 $\sum_{n=1}^{2026}(n-1)=\tfrac{2025\cdot2026}{2}=1013\cdot2025=3^4\cdot5^2\cdot1013$.
    steps:
    - {id: 3a, content: '$p=3$, $q=5$, $r=1013$, $p+q+r=1021$', criteria: ['3.B1']}
    hint_ladder:
    - (1)(2)를 일반화해 $a_n$을 $n$으로 나타내라.
    - $2025$를 소인수분해하라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.219
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $A$는 자연수이므로 $A\ge1$이고 $A<B=2n-A$에서 $A<n$이 되어 $A=1,2,\cdots,n-1$이다. 따라서 순서쌍은 $(1,n-1),(2,n-2),\cdots,(n-2,n-1),(n-1,n)$이 되어 $n-1$개가 된다. [원문 표기 그대로 — 실제 순서쌍은 $(1,2n-1),(2,2n-2),\cdots,(n-1,n+1)$]
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        $a_n=n-1$이므로
        $$\sum_{n=1}^{2026}(n-1)=\dfrac{2026\cdot2027}{2}-2026=\dfrac{2026\cdot(2027-2)}{2}=1013\cdot2025=3^4\times5^2\times1013$$
        이 되어 $p+q+r=1021$.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 55
      evidence: |
        정답 $1021$을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

