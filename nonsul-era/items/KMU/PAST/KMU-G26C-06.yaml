intent: |
  합의 법칙을 이해하고, 이를 이용하여 경우의 수를 구할 수 있는지 평가함.
key_idea: |
  $A<B$, $A+B=2n$이면 $A<n$이므로 $A=1,\dots,n-1$, 즉 $a_n=n-1$. $\sum_{n=1}^{2026}(n-1)=1013\cdot2025=3^4\times5^2\times1013$로 소인수분해한다.
stuck: |
  (3)에서 합 $1013\cdot2025$를 소인수분해해 $2025=3^4\cdot5^2$, $1013$이 소수임을 확인하는 단계
