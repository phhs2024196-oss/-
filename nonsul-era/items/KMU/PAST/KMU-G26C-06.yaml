  - 자료 출처(문항카드): 수학 류준열 외(천재교과서, 2025) 259쪽(저자명 원문 표기 그대로), 수학 권오남 외(교학사, 2025) 256쪽, 수학Ⅰ 고성은 외(좋은책 신사고, 2025) 137쪽, 수학Ⅰ 배종숙 외(금성출판사, 2025) 148쪽.
  - 문항카드 성취기준 칸 1~3에 10수학05-01이 반복되고 3번 칸에 12수학Ⅰ03-05가 추가됨.
  - 공식 해설 (3)의 순서쌍 나열 "$(1,n-1),\cdots,(n-1,n)$"은 원문 오기(합이 $2n$이 아님). 개수 $n-1$과 정답에는 영향 없음.
  - 문항카드 핵심개념: 경우의 수, 수열의 합. 예상 소요 시간 9분.
  - 2027 논술가이드북(2026 자연계 문제 1~8)에는 이 문항이 수록되지 않음.

