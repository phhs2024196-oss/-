intent: |
  주어진 구간에서 $t=\log_2x$로 치환하여 함수 $f(x)$를 이차함수로 나타내어 함수의 최솟값을 구할 수 있다.
key_idea: |
  $\log_{\frac14}x=-\tfrac12\log_2x$이므로 $t=\log_2x$로 두면 $g(t)=t^2-\tfrac{A}{2}t$ $(0\le t\le3)$. 꼭짓점 $t=\tfrac{A}{4}$가 구간 안($A\le12$)인지 밖($A>12$)인지로 나누어 최솟값 $-15$를 맞춘다.
stuck: |
  (3)에서 꼭짓점이 구간 안에 있다고 가정해 얻은 $A=4\sqrt{15}$가 $A\le12$에 모순임을 확인하고, 꼭짓점이 구간 밖인 경우 끝점 $t=3$에서 최솟값을 잡는 단계
idea_tags: [IDEA-LOG-SUBSTITUTION-QUADRATIC, IDEA-VERTEX-IN-INTERVAL-CASES]
tags: [로그의 성질, 치환, 이차함수의 최대와 최소, 경우 분류]
elements:
  materials:
  - '$\{x\mid1\le x\le8\}$에서 정의된 $f(x)=(\log_2x)^2+A\log_{\frac14}x$'
  - '치환 $t=\log_2x$와 그 범위 $\alpha\le t\le\beta$'
  - '최솟값이 $-15$라는 조건, 양수 $A$'
  concepts:
  - '로그의 성질(밑 변환)'
  - '로그함수의 증가'
  - '제한된 범위에서 이차함수의 최대와 최소'
  tools:
  - '$\log_{\frac14}x=-\tfrac12\log_2x$'
  - '완전제곱식 $g(t)=\left(t-\tfrac{A}{4}\right)^2-\tfrac{A^2}{16}$'
  - '꼭짓점의 위치에 따른 경우 분류'
  conditions:
  - '$1\le x\le8$ → $0\le t\le3$'
  - '$A>0$ → 꼭짓점 $t=\tfrac{A}{4}>0$'
  - '최솟값 $-15$ → $\tfrac{A}{4}\le3$이면 $-\tfrac{A^2}{16}=-15$, $\tfrac{A}{4}>3$이면 $g(3)=-15$'
  stimuli_used: []
  subpart_links: '(1)의 $g(t)$와 (2)의 $t$의 범위를 결합해 (3)의 최솟값 조건을 푼다'

