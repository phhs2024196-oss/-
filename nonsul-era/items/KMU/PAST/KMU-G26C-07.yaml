stimuli: []

stem: |
  $\{x\mid1\le x\le8\}$에서 정의된 함수 $f(x)=(\log_2x)^2+A\log_{\frac14}x$에 대하여, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $t=\log_2x$일 때, $f(x)$를 $t$에 대한 식으로 표현하시오.
  points: 20
  depends_on: []
  answer: {kind: expression, value: 't**2-A*t/2', equivalents: ['t**2-(1/2)*A*t', '(2*t**2-A*t)/2', '(1/2)*(2*t**2-A*t)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\log_{\frac14}x=\dfrac{\log_2x}{\log_2\frac14}=-\tfrac12\log_2x$.
    steps:
    - {id: 1a, content: '$f(x)=t^2-\tfrac{A}{2}t$', criteria: ['1.B1']}
    hint_ladder:
    - $\log_{\frac14}x$를 밑이 $2$인 로그로 바꾸어라.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.221
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=(\log_2x)^2+A\log_{\frac14}x=(\log_2x)^2-\dfrac12A\log_2x$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        준식을 $\log_2x=t$로 치환하면 $x=2^t>0$이고 준식은 $t^2-\dfrac{A}{2}t$이 된다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 20
      evidence: |
        정답 $t^2-\dfrac{A}{2}t$을 정확히 기입했다($t^2-\dfrac12At$ 또는 $\dfrac{2t^2-At}{2}$ 또는 $\dfrac12(2t^2-At)$ 모두 정답).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $t=\log_2x$일 때, $1\le x\le8$이 $\alpha\le t\le\beta$로 변한다. 이때 $\alpha+\beta$의 값을 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\log_2$는 증가함수이므로 $\log_21=0\le t\le\log_28=3$.
    steps:
    - {id: 2a, content: '$\alpha+\beta=0+3=3$', criteria: ['2.B1']}
    hint_ladder:
    - $\log_21$, $\log_28$의 값은?
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.221
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(t)=t^2-\dfrac{A}{2}t=\left(t-\dfrac{A}{4}\right)^2-\dfrac{A^2}{16}$

        구간 $1\le x\le8$은 $\alpha=0\le t\le3=\beta$이고 $\alpha+\beta=3$이다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 12
      evidence: |
        정답 $3$을 정확히 기입했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $f(x)$의 최솟값이 $-15$일 때, 양수 $A$의 값을 구하시오.
  points: 48
  depends_on: ['1', '2']
  answer: {kind: value, value: '16', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 꼭짓점 $\tfrac{A}{4}\le3$이면 $-\tfrac{A^2}{16}=-15$에서 $A=4\sqrt{15}>12$로 모순, 따라서 $\tfrac{A}{4}>3$이고 $g(3)=9-\tfrac{3A}{2}=-15$.
    steps:
    - {id: 3a, content: '$A=16$', criteria: ['3.B1']}
    hint_ladder:
    - 꼭짓점 $t=\tfrac{A}{4}$가 $[0,3]$ 안에 있는지로 경우를 나누어라.
  - id: S3-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.221
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(x)$의 최솟값 $-15$이고

        (i) $t=\dfrac{A}{4}\le3$일 때, $0<A\le12$ ------(＊)

        $g\left(\dfrac{A}{4}\right)=-\dfrac{A^2}{16}=-15$, 양수 $A=4\sqrt{15}$는 (＊)에 모순이다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        (ii) $t=\dfrac{A}{4}>3$일 때, $A>12$ ------(＊＊)

        $g(3)=9-\dfrac{3A}{2}=-15$, $A=16>12$이므로 $A=16$이다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 48
      evidence: |
        정답 $16$을 정확히 기입했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [3b-1, 3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

