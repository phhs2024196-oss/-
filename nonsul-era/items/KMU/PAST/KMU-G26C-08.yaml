intent: |
  일반각과 호도법의 뜻을 알고 삼각함수의 미분과 적분을 활용하여 문제를 해결할 수 있는지 평가함.
key_idea: |
  $x^\circ=\dfrac{\pi}{180}x$(라디안)이므로 $f(x)=\cos\left(\dfrac{\pi}{180}x\right)$이고, 합성함수의 미분·적분에서 계수 $\dfrac{\pi}{180}$, $\dfrac{180}{\pi}$이 나온다.
stuck: |
  육십분법 $x^\circ$를 호도법으로 바꾸지 않고 $(\cos x)\prime=-\sin x$를 그대로 적용해 계수 $\dfrac{\pi}{180}$을 빠뜨리는 단계
