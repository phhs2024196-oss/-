stimuli: []

stem: |
  함수 $f(x)=\cos(x^\circ)$에 대하여, 다음 물음에 답하시오. (단, $1^\circ=\dfrac{\pi}{180}$, $A,B,C,D,E,F$는 상수)

subparts:
- id: '1'
  stem: |
    $f\prime(x)=A\sin(Bx)$일 때, $\cos(45A+60B)=\dfrac{C}{4}$를 만족하는 실수 $C$의 값을 구하시오. (단, $0<B<\dfrac{1}{10}$)
  points: 39
  depends_on: []
  answer: {kind: value, value: 'sqrt(6)+sqrt(2)', equivalents: ['4/(sqrt(6)-sqrt(2))'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f\prime(x)=-\tfrac{\pi}{180}\sin\left(\tfrac{\pi}{180}x\right)$이므로 $45A+60B=-\tfrac{\pi}{4}+\tfrac{\pi}{3}=\tfrac{\pi}{12}$.
    steps:
    - {id: 1a, content: '$C=4\cos\tfrac{\pi}{12}=\sqrt6+\sqrt2$', criteria: ['1.B1']}
    hint_ladder:
    - $\cos(x^\circ)$를 라디안으로 바꾸어 미분하라.
  - id: S1-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.223
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $1^\circ=\dfrac{\pi}{180}$이므로 $x^\circ=\dfrac{\pi}{180}x$를 이용하면 삼각함수와 합성함수의 미분법에 의해
        $$f\prime(x)=\dfrac{d}{dx}\cos\left(\dfrac{\pi}{180}x\right)=-\dfrac{\pi}{180}\sin\left(\dfrac{\pi}{180}x\right)=A\sin(Bx)$$
        이므로 $A=-\dfrac{\pi}{180}$, $B=\dfrac{\pi}{180}$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        따라서 $\cos(45A+60B)=\cos\left(\dfrac{\pi}{3}-\dfrac{\pi}{4}\right)=\dfrac{\sqrt6+\sqrt2}{4}=\dfrac{C}{4}$이므로 $C=\sqrt6+\sqrt2$.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 39
      evidence: |
        정답 $\sqrt6+\sqrt2$를 정확히 기재했다($\dfrac{4}{\sqrt6-\sqrt2}$도 정답, 약술형: 정답만 채점).
      depends_on: []
      implied_ok: false
      cao: true
      steps: [1b-1, 1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $g(x)=\displaystyle\int f(x)\,dx$, $g(30)=0$을 만족하는 $g(x)$가 $g(x)=D\sin(Ex)+F$일 때, $(D+F)E$의 값을 구하시오. (단, $0<E<\dfrac{1}{10}$)
  points: 41
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: ['0.5'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(x)=\tfrac{180}{\pi}\sin\left(\tfrac{\pi}{180}x\right)+C_0$, $g(30)=\tfrac{90}{\pi}+C_0=0$.
    steps:
    - {id: 2a, content: '$D=\tfrac{180}{\pi}$, $E=\tfrac{\pi}{180}$, $F=-\tfrac{90}{\pi}$, $(D+F)E=\tfrac{90}{\pi}\cdot\tfrac{\pi}{180}=\tfrac12$', criteria: ['2.B1']}
    hint_ladder:
    - $\int\cos(kx)\,dx$를 구하고 $g(30)=0$으로 적분상수를 정하라.
  - id: S2-B
    audience: B
    source_flow: 선행학습 영향평가 보고서 문항 해설 p.223
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(x)=\displaystyle\int\cos\left(\dfrac{\pi}{180}x\right)dx=\dfrac{180}{\pi}\sin\left(\dfrac{\pi}{180}x\right)+C$이고 $g(30)=\dfrac{180}{\pi}\sin\dfrac{\pi}{6}+C=\dfrac{90}{\pi}+C=0$이므로 $C=-\dfrac{90}{\pi}$가 되어
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        $g(x)=\dfrac{180}{\pi}\sin\left(\dfrac{\pi}{180}x\right)-\dfrac{90}{\pi}=D\sin(Ex)+F$. 따라서 $(D+F)E=\left(\dfrac{180}{\pi}-\dfrac{90}{\pi}\right)\dfrac{\pi}{180}=\dfrac12$
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: false, a_requires_m: false, misread_penalty: 0, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 41
      evidence: |
        정답 $\dfrac12$($0.5$도 정답)을 정확히 기재했다.
      depends_on: []
      implied_ok: false
      cao: true
      steps: [2b-1, 2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

