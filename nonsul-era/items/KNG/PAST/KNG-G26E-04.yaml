stimuli: []
stem: |
  양수 $a(a\neq1)$에 대하여 함수 $f(x)=a^{-x}+2a$가 닫힌구간 $[-1,0]$에서 최솟값 2를 갖는다. $a>1$과 $0<a<1$로 나누어서 $a$의 값을 구하는 과정을 서술하시오.

  만약, $a$의 값이 존재하지 않으면 그 이유를 간단히 서술하시오. [8점]
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: a=2/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a>1$일 때, $f(x)$가 감소하므로 $x=0$에서 최솟값을 가진다. 따라서 $f(0)=a^{-0}+2a=2$이고 $a=\dfrac12$이므로 $a>1$에 모순이다. 즉 $a>1$일 때 $a$는 존재하지 않는다.
      source_flow: 예시답안 p.47
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $0<a<1$일 때, $f(x)$가 증가하므로 $x=-1$에서 최솟값을 가진다. 따라서 $f(-1)=a^{-(-1)}+2a=2$이고 $a=\dfrac23$이다.
      source_flow: 예시답안 p.47
      criteria:
      - 1.B2
