stem: |
  [단답형] 다음 상자 안의 (1), (2), (3)에 알맞은 값 또는 점의 좌표를 쓰시오. [8점]

  함수 $f(x)=4\tan(\pi+4x)-1$의 주기는 (1)이고, $f\left(\dfrac{\pi}{4}\right)=$ (2)이다.

  열린구간 $\left(-\dfrac{\pi}{8},\dfrac{\pi}{8}\right)$에서 함수 $y=f(x)$의 그래프는 점 (3)에 대하여 대칭이다.
