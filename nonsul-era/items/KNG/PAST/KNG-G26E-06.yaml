stimuli: []
stem: |
  도함수의 정의를 이용하여 함수 $f(x)=x^2-6x$의 도함수 $f'(x)$를 구하는 과정을 서술하고, 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선과 두 점 $(1,f(1))$, $(6,f(6))$을 지나는 직선이 서로 수직일 때, 상수 $a$의 값을 구하는 과정을 서술하시오. [10점]
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: fprime=2*x-6; slope=1; a=5/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=x^2-6x$의 도함수는
        $$f'(x)=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}=\lim_{h\to0}\dfrac{(x+h)^2-6(x+h)-(x^2-6x)}{h}=\lim_{h\to0}\dfrac{2hx+h^2-6h}{h}=\lim_{h\to0}(2x+h-6)=2x-6$$이다. ($h$ 대신 $\Delta x$로 기술해도 가능)
      source_flow: 예시답안 p.49
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $f(1)=-5$, $f(6)=0$이므로 두 점 $(1,-5)$, $(6,0)$을 지나는 직선의 방정식은 $y=x-6$이다. (또는 기울기 1)
      source_flow: 예시답안 p.49
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선과 $y=x-6$이 수직이므로 $f'(a)=-1$이다. 따라서 $2a-6=-1$이고 $a=\dfrac52$이다.
      source_flow: 예시답안 p.49
      criteria:
      - 1.B3
