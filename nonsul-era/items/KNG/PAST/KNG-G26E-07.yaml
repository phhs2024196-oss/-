stimuli: []
stem: |
  공차가 $d(d\neq0)$인 등차수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하자.

  $$S_5=85,\ \lvert a_{15}\rvert=\lvert a_{25}\rvert$$

  일 때,

  첫째항과 공차를 구하는 과정을 서술하시오. [10점]
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a1=19; d=-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $S_5=\dfrac{5(a_1+a_5)}{2}=85$이고 $a_3=\dfrac{a_1+a_5}{2}$이므로 $a_3=a_1+2d=17$이다.
      source_flow: 예시답안 p.50
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $d>0$이면 $0<a_3<a_{15}<a_{25}$이므로 $\lvert a_{15}\rvert=\lvert a_{25}\rvert$ 조건을 만족할 수 없고, 따라서 $d<0$이다. $a_{15}>a_{25}$이며 $\lvert a_{15}\rvert=\lvert a_{25}\rvert$이다. 따라서 $a_{15}>0>a_{25}$이다.
      source_flow: 예시답안 p.50
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        $a_{15}=-a_{25}$이므로 $(a_1+14d)+(a_1+24d)=2a_1+38d=0$이고 $a_1+19d=0$이다. (또는 $a_{15}+a_{25}=2a_{20}=0$이므로 $a_{20}=a_1+19d=0$이다.)
      source_flow: 예시답안 p.50
      criteria:
      - 1.B2
    - id: 1b-4
      content: |
        $a_1+2d=17$과 $2a_1+38d=0$을 연립하여 계산하면 $a_1=19$이고 $d=-1$이다.
      source_flow: 예시답안 p.50
      criteria:
      - 1.B3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: $a_1+2d=17$을 구했다.
      accept:
      - '〈예시 2〉로 풀 때: $S_5=85$에서 $d=-1$, $a_1=19$를 구한 부분(6점)은 1.B1과 1.B3의 합으로 본다'
      steps:
      - 1b-1
    - id: 1.B2
      mark_type: B
      points: 4
      evidence: $a_1+19d=0$을 구했다.
      accept:
      - '〈예시 2〉로 풀 때: $\lvert a_{15}\rvert=\lvert a_{25}\rvert$로부터 $a_1=-19d$를 구하면 4점'
      steps:
      - 1b-2
      - 1b-3
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: $a_1=19$, $d=-1$을 구했다.
      steps:
      - 1b-4
