  depends_on: []
  answer:
    kind: value
    value: lim=0,2; cont=0
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 함수 $f(x)$, $g(x)$는 $x\neq a$에서 연속이므로 $x=a$일 때만 확인하면 된다.
        $$\lim_{x\to a-}\{f(x)+g(x)\}=\lim_{x\to a-}(x^2+a)=a^2+a,\quad \lim_{x\to a+}\{f(x)+g(x)\}=\lim_{x\to a+}(x-x+3a)=3a$$
      source_flow: 예시답안 p.51
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        우극한과 좌극한이 같아야 극한값이 존재하므로 $a^2+a=3a$이고 $a(a-2)=0$이며 $a=0,\,2$이다.
      source_flow: 예시답안 p.51
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        극한값과 함숫값이 같아야 연속이므로 $f(a)+g(a)=a^2+(-a+3a)=a^2+2a$이고 $a^2+a=3a=a^2+2a$이다. 따라서 $a=2$일 때 만족하지 않고, $a=0$일 때만 만족한다.
      source_flow: 예시답안 p.51
      criteria:
      - 1.B3
