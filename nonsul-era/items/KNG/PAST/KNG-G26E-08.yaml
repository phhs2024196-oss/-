stimuli: []
stem: |
  두 함수

  $$f(x)=\begin{cases}x^2&(x\le a)\\x&(x>a)\end{cases},\quad g(x)=\begin{cases}a&(x<a)\\-x+3a&(x\ge a)\end{cases}$$

  가 있다. 함수 $f(x)+g(x)$가 실수 전체의 집합에서 극한값을 갖도록 하는 모든 상수 $a$의 값과, 실수 전체의 집합에서 연속이 되도록 하는 상수 $a$의 값을 구하는 과정을 서술하시오. [10점]
subparts:
- id: '1'
  stem: ''
