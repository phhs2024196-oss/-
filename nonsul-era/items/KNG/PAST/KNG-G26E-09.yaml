stimuli: []
stem: |
  최고차항의 계수가 1인 이차함수 $f(x)$에 대하여 함수 $f(x)$는 $\displaystyle\int_{-1}^{1}f'(t)\,dt=0$을 만족시킨다.

  함수

  $$g(x)=\int_0^xf(t)\,dt$$

  가 $x=1$에서 극소일 때, 함수 $g(x)$는 닫힌구간 $[1,2]$에서 최댓값 $M$과 최솟값 $m$을 갖는다. 두 함수 $f(x)$와 $g(x)$ 그리고 $M$과 $m$을 구하는 과정을 서술하시오. [12점]
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: f=x**2-1; g=x**3/3-x; M=2/3; m=-2/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=x^2+ax+b$라 하자. $\displaystyle\int_{-1}^{1}f'(t)\,dt=f(1)-f(-1)=0$이므로 $1+a+b-(1-a+b)=2a=0$이고 $a=0$이다.
      source_flow: 예시답안 p.52
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $g(x)$가 $x=1$에서 극값을 가지므로 $g'(1)=f(1)=0$, $f(1)=1+b=0$이고 $b=-1$이다. 그러므로 $f(x)=x^2-1$이다.
      source_flow: 예시답안 p.52
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        따라서 $g(x)=\displaystyle\int_0^xf(t)\,dt=\int_0^x(t^2-1)\,dt=\dfrac{x^3}{3}-x$이다.
      source_flow: 예시답안 p.52
      criteria:
      - 1.B3
    - id: 1b-4
      content: |
        이 삼차함수 $g(x)$는 닫힌구간 $[1,2]$에서 $x=1$일 때 최솟값을 갖고 $x=2$일 때 최댓값을 갖는다. 따라서 최솟값 $m=g(1)=\dfrac13-1=-\dfrac23$이고, 최댓값 $M=g(2)=\dfrac83-2=\dfrac23$이다.
      source_flow: 예시답안 p.52
      criteria:
      - 1.B4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $f(x)$의 일차항의 계수가 0임을 구했다.
      steps:
      - 1b-1
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: $f(x)$의 상수항이 $-1$임을 구했다.
      steps:
      - 1b-2
    - id: 1.B3
      mark_type: B
      points: 2
      evidence: $g(x)=\dfrac{x^3}{3}-x$임을 구했다.
      steps:
      - 1b-3
    - id: 1.B4
      mark_type: B
      points: 4
      evidence: $M=\dfrac23$, $m=-\dfrac23$임을 구했다.
      steps:
      - 1b-4
