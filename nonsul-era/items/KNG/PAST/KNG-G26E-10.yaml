stimuli: []
stem: |
  최고차항의 계수가 1인 삼차함수 $f(x)$와 양수 $k$가 다음 조건을 만족시킨다.

  (가) 방정식 $f(x)=0$의 실근은 $k$와 $2k$뿐이다.

  (나) $\displaystyle\lim_{x\to k}\dfrac{f(x)}{x-k}=9$

  $f(4)$의 값을 구하는 과정을 서술하시오. [12점]
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: f=(x-3)*(x-6)**2; k=3; f4=4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        최고차항의 계수가 1인 삼차함수 중 (가)를 만족하는 함수는 2가지가 존재한다. $f(x)=(x-k)^2(x-2k)$ 또는 $f(x)=(x-k)(x-2k)^2$이다.
      source_flow: 예시답안 p.53
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $f(x)=(x-k)^2(x-2k)$일 때, 조건 (나)에 대입하여 정리하면
        $$\lim_{x\to k}\dfrac{f(x)}{x-k}=\lim_{x\to k}\dfrac{(x-k)^2(x-2k)}{x-k}=\lim_{x\to k}(x-k)(x-2k)=0\neq9$$이므로 $f(x)=(x-k)^2(x-2k)$는 조건 (나)를 만족하지 않는다.
      source_flow: 예시답안 p.53
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        $f(x)=(x-k)(x-2k)^2$일 때, 조건 (나)에 대입하여 정리하면
        $$\lim_{x\to k}\dfrac{f(x)}{x-k}=\lim_{x\to k}\dfrac{(x-k)(x-2k)^2}{x-k}=\lim_{x\to k}(x-2k)^2=k^2=9$$이고 $k=3$이다. (또는 $f(k)=0$이므로 $\displaystyle\lim_{x\to k}\dfrac{f(x)-f(k)}{x-k}=f'(k)$임을 알 수 있고 계산하면 $k=3$이다.)
      source_flow: 예시답안 p.53
      criteria:
      - 1.B2
    - id: 1b-4
      content: |
        따라서 $f(x)=(x-3)(x-6)^2$이고 $f(4)=4$이다.
      source_flow: 예시답안 p.53
      criteria:
      - 1.B3
