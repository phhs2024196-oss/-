stimuli: []
stem: |
  양수 $k$에 대하여 함수 $y=\log_2(x+k)$가 닫힌구간 $[0,k]$에서 최댓값 $M$, 최솟값 $m$을 갖는다. $M-m$의 값을 구하는 과정을 서술하시오. [8점]
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $y=\log_2(x+k)$는 증가하는 로그함수이다. $x=0$일 때 최솟값 $m=\log_2 k$를 갖는다.
      source_flow: 예시답안 p.23
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x=k$일 때 최댓값 $M=\log_2 2k=1+\log_2 k$를 갖는다.
      source_flow: 예시답안 p.23
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        따라서 $M-m=\log_2 2k-\log_2 k=\log_2 2=1$이다.
      source_flow: 예시답안 p.23
      criteria:
      - 1.A1
