      criteria:
      - 2.B1
    - id: 2b-2
      content: |
        그러므로 $x=-1$일 때 극댓값 $f(-1)=\dfrac23$이다.
      source_flow: 예시답안 p.24
      criteria:
      - 2.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
