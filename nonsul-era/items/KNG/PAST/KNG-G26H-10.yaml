      mark_type: B
      points: 3
      evidence: $f'(x)=0$의 해 $x=\pm1$을 구하고 $x=-1$에서 극댓값 $f(-1)=\dfrac23$임을 보였다.
      steps:
      - 2b-1
      - 2b-2
  outcome_codes:
