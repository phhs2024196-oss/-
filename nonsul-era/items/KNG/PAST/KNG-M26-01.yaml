stimuli: []
stem: |
  양수 $a(a\ne1)$에 대하여 함수 $y=a^{(x+2)}-1$이 닫힌구간 $[-1,1]$에서 최댓값 $3$가질 때,
subparts:
- id: '1'
  stem: |
    $a>1$와 $0<a<1$로 나누어서 $a$값을 구하는 과정을 서술하시오. 만약, $a$값이 존재하지 않으면 그 이유를 서술하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=4**(1/3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a>1$일 때, $y=a^{(x+2)}-1$는 증가하므로 $x=1$에서 최댓값을 가진다.
      source_flow: 예시답안 p.30
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a>1$일 때, $a^3=4$를 만족하므로 $a=4^{\frac13}$이다.
      source_flow: 예시답안 p.30
      criteria:
      - 1.A2
    - id: 1b-3
      content: |
        $0<a<1$일 때, $y=a^{(x+2)}-1$는 감소하므로 $x=-1$에서 최댓값을 가진다.
      source_flow: 예시답안 p.30
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $0<a<1$일 때, $a=4$ 그러므로 만족하는 $a$가 존재하지 않는다.
      source_flow: 예시답안 p.30
      criteria:
      - 1.A4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $a>1$일 때 증가함수이므로 $x=1$에서 최댓값을 가진다고 썼다.
      steps:
      - 1b-1
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $a^3-1=3$에서 $a^3=4$, $a=4^{\frac13}$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: $0<a<1$일 때 감소함수이므로 $x=-1$에서 최댓값을 가진다고 썼다.
      steps:
      - 1b-3
    - id: 1.A4
      mark_type: A
      points: 3
      evidence: $a-1=3$에서 $a=4$가 되어 $0<a<1$에 모순이므로 $a$가 존재하지 않는다고 썼다.
      depends_on:
      - 1.M3
      steps:
      - 1b-4
