stimuli: []
stem: |
  $x$에 대한 이차방정식 $x^2+6x\tan\left(\dfrac\pi2-\theta\right)+\tan(\pi+\theta)=0$의 두 근을 $\alpha$, $\beta$라 하자.
subparts:
- id: '1'
  stem: |
    $(3\alpha+1)(3\beta+1)=1$일 때, $\tan^2\theta$의 값을 구하는 과정을 서술하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: tan2=2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\alpha+\beta=-6\tan\left(\dfrac\pi2-\theta\right)$, $\alpha\beta=\tan(\pi+\theta)$
      source_flow: 예시답안 p.31
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\alpha+\beta=-6\tan\left(\dfrac\pi2-\theta\right)=-6\times\dfrac{\sin\left(\frac\pi2-\theta\right)}{\cos\left(\frac\pi2-\theta\right)}=-6\times\dfrac{\cos\theta}{\sin\theta}=-\dfrac6{\tan\theta}$
        $\alpha\beta=\tan\theta$
      source_flow: 예시답안 p.31
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        주어진 식 $(3\alpha+1)(3\beta+1)=1$을 정리하고 대입하면
        $9\times\tan\theta=-3\times\left(-\dfrac6{\tan\theta}\right)$이고 $\tan^2\theta=2$ 이다.
      source_flow: 예시답안 p.31
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 근과 계수의 관계로 $\alpha+\beta=-6\tan(\frac\pi2-\theta)$, $\alpha\beta=\tan(\pi+\theta)$를 썼다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $\alpha+\beta=-\frac6{\tan\theta}$, $\alpha\beta=\tan\theta$로 바꾸었다.
      steps:
      - 1b-2
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: $(3\alpha+1)(3\beta+1)=1$을 정리해 대입한 식 $9\tan\theta=-3\times\left(-\frac6{\tan\theta}\right)$에서 $\tan^2\theta=2$를 구했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
