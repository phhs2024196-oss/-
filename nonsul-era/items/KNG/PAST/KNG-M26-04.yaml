stem: 곡선 $f(x)=-x^3+a$와 $x$축, $y$축 및 직선 $x=1$로 둘러싸인 영역의 넓이가 직선 $y=1$에 의하여 이등분될 때,
subparts:
- id: '1'
  stem: |
    상수 $a$의 값을 구하는 과정을 서술하시오. (단, $a>2$) [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=9/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $f(x)=-x^3+a$와 $x$축, $y$축, $x=1$로 둘러싸인 부분의 넓이는 $\displaystyle\int_0^1(a-x^3)dx=\left[ax-\dfrac{x^4}4\right]_0^1=a-\dfrac14$
      source_flow: 예시답안 p.33
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        둘러싸인 부분의 넓이는 직선 $y=1$에 의하여 이등분된다.
        $f(1)=-1+a>1\ (a>2)$이므로 이등분되는 넓이의 한 부분은 $x$축, $y$축, $x=1$, $y=1$로 둘러싸인 변의 길이가 $1$인 정사각형 넓이이다.
      source_flow: 예시답안 p.33
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $2=a-\dfrac14$ 따라서 $a=\dfrac94$이다.
      source_flow: 예시답안 p.33
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
