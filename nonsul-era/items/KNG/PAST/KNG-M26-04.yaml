      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $f(1)=a-1>1$이므로 이등분되는 한 부분이 한 변의 길이가 $1$인 정사각형임을 밝혔다.
      steps:
      - 1b-2
    - id: 1.A3
      mark_type: A
      points: 3
      evidence: $2=a-\frac14$로부터 $a=\frac94$를 구했다.
