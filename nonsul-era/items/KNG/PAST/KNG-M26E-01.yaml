stimuli: []
stem: |
  양수 $a(a\ne1)$에 대하여 함수 $y=\log_a(x+3)-1$이 닫힌구간 $[0,3]$에서 최솟값 $-\dfrac32$ 가질 때,
subparts:
- id: '1'
  stem: |
    $a>1$와 $0<a<1$로 나누어서 $a$값을 구하는 과정을 서술하시오. 만약, 주어진 구간에서 $a$값이 없다면 그 이유를 서술하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=1/36
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a>1$일 때, $y=\log_a(x+3)-1$은 증가하므로 $x=0$에서 최솟값을 가진다.
      source_flow: 예시답안 p.13
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a>1$일 때, $\log_a3=-\dfrac12$을 만족하므로 $a=3^{-2}=\dfrac19$가 되어야하나 $a>1$ 때문에 만족하는 $a$가 존재하지 않는다.
      source_flow: 예시답안 p.13
      criteria:
      - 1.A2
    - id: 1b-3
      content: |
        $0<a<1$일 때, $y=\log_a(x+3)-1$은 감소하므로 $x=3$에서 최솟값을 가진다.
      source_flow: 예시답안 p.13
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $0<a<1$일 때, $\log_a6=-\dfrac12$을 만족하므로 $a=6^{-2}=\dfrac1{36}$이다. 따라서 $a=\dfrac1{36}$이다.
      source_flow: 예시답안 p.13
      criteria:
      - 1.A4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $a>1$일 때 $y=\log_a(x+3)-1$이 증가함수이므로 $x=0$에서 최솟값을 가진다고 썼다.
      steps:
      - 1b-1
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $\log_a3-1=-\frac32$로부터 $a=3^{-2}=\frac19$를 얻고 $a>1$에 모순이어서 $a$가 존재하지 않는다고 썼다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: $0<a<1$일 때 감소함수이므로 $x=3$에서 최솟값을 가진다고 썼다.
      steps:
      - 1b-3
    - id: 1.A4
      mark_type: A
      points: 3
      evidence: $\log_a6=-\frac12$에서 $a=6^{-2}=\frac1{36}$을 얻고 $0<a<1$을 만족함을 확인하여 $a=\frac1{36}$이라고 썼다.
      depends_on:
      - 1.M3
      steps:
      - 1b-4
