      points: 2
      evidence: $\frac{t^2+1}{t}=2$, $t^2-2t+1=(t-1)^2=0$에서 $\tan\theta=1$을 얻었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
