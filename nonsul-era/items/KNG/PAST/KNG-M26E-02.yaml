stimuli: []
stem: |
  $\pi<\theta<\dfrac32\pi$인 $\theta$에 대하여 $\tan\theta+\dfrac{1}{\tan\theta}=2$일 때, $\theta$를 찾는 과정을 서술하고 찾은 $\theta$에 대해 $\sin\theta+\cos\theta$의 값을 구하시오. [10점]
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: sum=-sqrt(2);theta=5*pi/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\tan\theta=t$라면 $\tan\theta+\dfrac1{\tan\theta}=t+\dfrac1t=2$
      source_flow: 예시답안 p.14
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\dfrac{t^2+1}{t}=2$, $t^2-2t+1=(t-1)^2=0$ 이므로 $\tan\theta=1$이다.
      source_flow: 예시답안 p.14
      criteria:
      - 1.A2
    - id: 1b-3
      content: |
        $\pi<\theta<\dfrac32\pi$ 이므로 $\theta=\dfrac54\pi$이다.
      source_flow: 예시답안 p.14
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $\sin\theta=-\dfrac{\sqrt2}2$, $\cos\theta=-\dfrac{\sqrt2}2$
      source_flow: 예시답안 p.14
      criteria:
      - 1.A4
    - id: 1b-5
      content: |
        $\sin\theta+\cos\theta=-\dfrac{\sqrt2}2-\dfrac{\sqrt2}2=-\sqrt2$
      source_flow: 예시답안 p.14
      criteria:
      - 1.A5
  rubric:
