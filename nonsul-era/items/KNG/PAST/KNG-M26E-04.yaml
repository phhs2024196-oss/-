stimuli: []
stem: |-
  상수 $a$와 두 함수
  $$f(x)=\begin{cases}x-1&(x<2)\\x-4&(x\ge2)\end{cases},\quad g(x)=2x+a$$
  가 있다.
subparts:
- id: '1'
  stem: |
    함수 $f(x)g(x)$가 $x=2$에서 연속이 되도록, 상수 $a$의 값을 구하는 과정을 서술하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=-4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)g(x)$가 $x=2$에서 연속이므로, $f(2)g(2)=-8-2a$
      source_flow: 예시답안 p.16
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to2+}f(x)g(x)=\lim_{x\to2+}(x-4)(2x+a)=-8-2a$
      source_flow: 예시답안 p.16
      criteria:
      - 1.A2
    - id: 1b-3
      content: |
        $\displaystyle\lim_{x\to2-}f(x)g(x)=\lim_{x\to2-}(x-1)(2x+a)=4+a$
      source_flow: 예시답안 p.16
      criteria:
      - 1.A3
    - id: 1b-4
      content: |
        $\displaystyle\lim_{x\to2}f(x)g(x)=f(2)g(2)$이므로 $-8-2a=4+a$이고 $a=-4$이다.
      source_flow: 예시답안 p.16
      criteria:
      - 1.A4
  rubric:
