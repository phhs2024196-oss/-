subparts:
- id: '1'
  stem: |
    등식
    $$4^{\log_2 x}+\log_{\sqrt2}\left(\dfrac14\right)^x+2^{\log_2 y}=0$$
    을 만족시키는 두 양수 $x$, $y$에 대하여 $x=\alpha$일 때, $y$가 최댓값 $\beta$를 갖는다.
    이때, $\log_\alpha\beta$의 값을 구하는 과정을 서술하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: alpha = 2; beta = 4; ans = 2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $4^{\log_2 x}=(2^2)^{\log_2 x}=2^{2\log_2 x}=2^{\log_2 x^2}=x^2$ (또는 $4^{\log_2 x}=x^{\log_2 4}=x^{\log_2 2^2}=x^{2\log_2 2}=x^2$)이다.
        $\log_{\sqrt2}\left(\dfrac14\right)^x=\log_{2^{\frac12}}(2)^{-2x}=-4x$이고, $2^{\log_2 y}=y$이다.
        이므로 주어진 등식은 $x^2-4x+y=0$이다.
      source_flow: 해설 p.15
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $y=-x^2+4x=-(x-2)^2+4$이며 $x=2$일 때, 최댓값 $4$를 가진다.
      source_flow: 해설 p.15
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        그러므로 $\alpha=2$, $\beta=4$이고 따라서 $\log_\alpha\beta=\log_2 4=2$이다.
      source_flow: 해설 p.15
      criteria:
      - 1.A1
      - 1.A2
  rubric:
