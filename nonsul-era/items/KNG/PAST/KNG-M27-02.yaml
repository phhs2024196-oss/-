subparts:
- id: '1'
  stem: |
    등비수열 $\{a_n\}$이
    $$2(a_1+a_5)=(a_5+a_9)=8$$
    을 만족할 때, $a_9$의 값을 구하는 과정을 서술하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: r4 = 2; a = 4/3; a9 = 16/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        등비수열 $\{a_n\}$의 첫째항을 $a$, 공비를 $r$라고 하면, $a_5=ar^4$, $a_9=ar^8$이다.
        $2(a_1+a_5)=8$이므로 $(a_1+a_5)=(a+ar^4)=4$이다.
        $a_5+a_9=8$이므로 $ar^4+ar^8=8$이고 $r^4(a+ar^4)=8$이다.
      source_flow: 해설 p.16
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $(a+ar^4)=4$를 $r^4(a+ar^4)=8$에 대입하면 $r^4=2$이다.
      source_flow: 해설 p.16
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $(a+ar^4)=a(1+r^4)=a(1+2)=4$ 이므로 $a=\dfrac43$이다.
      source_flow: 해설 p.16
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        따라서 $a_9=ar^8=a(r^4)^2=\dfrac43\times2^2=\dfrac{16}{3}$이다.
      source_flow: 해설 p.16
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
