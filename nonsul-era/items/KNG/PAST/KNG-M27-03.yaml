subparts:
- id: '1'
  stem: |
    함수 $f(x)=x^3+|x|$의 극댓값과 극솟값을 구하는 과정을 서술하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: max = 2*sqrt(3)/9; min = 0
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        ① $x\ge0$일 때, $f(x)=x^3+x$이고, $x>0$일 때 $f'(x)=3x^2+1$이고 $x>0$인 모든 실수 $x$에 대하여 $f'(x)>0$이므로 $(0,+\infty)$에서 증가한다.
        ② $x<0$일 때, $f(x)=x^3-x$이고 $f'(x)=3x^2-1$이므로 $x=-\dfrac{\sqrt3}{3}$에서 $f'(x)=0$이다.
      source_flow: 해설 p.17~18
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        증감표는 다음과 같다.

        | $x$ | $\cdots$ | $-\dfrac{\sqrt3}{3}$ | $\cdots$ | $0$ | $\cdots$ |
        |---|---|---|---|---|---|
        | $f'(x)$ | $+$ | $0$ | $-$ | 존재 안 함 | $+$ |
        | $f(x)$ | ↗ | $\dfrac{2\sqrt3}{9}$ | ↘ | $0$ | ↗ |

        (또는, 증감표가 아닌 그래프 개형으로 설명 가능)
        [그림 1: $y=f(x)$의 그래프 개형. $x=-\dfrac{\sqrt3}{3}$에서 극대(값 $\dfrac{2\sqrt3}{9}$), 원점에서 꺾이며 극소(값 $0$)이고 $x>0$에서 증가]
      source_flow: 해설 p.17~18
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        위 증감표에 의해, $x=-\dfrac{\sqrt3}{3}$에서 $f'(x)$ 값이 양에서 음으로 바뀌므로 극댓값은 $\dfrac{2\sqrt3}{9}$이고, $x=0$에서 연속이고 $f'(x)$ 값이 음에서 양으로 바뀌므로 극솟값은 $0$이다.
      source_flow: 해설 p.17~18
      criteria:
      - 1.A1
