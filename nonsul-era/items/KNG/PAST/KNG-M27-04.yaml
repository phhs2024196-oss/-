subparts:
- id: '1'
  stem: |
    최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.

    (가) $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x}$의 값이 존재한다.
    (나) $\displaystyle\int_0^2 f(x)dx=16+\int_0^{-2}f(x)dx$


    $f(-1)=6$일 때, $f'(1)$의 값을 구하는 과정을 서술하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a = 3; b = -4; ans = 5
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^3+ax^2+bx+c$이다.
        조건 (가)에 의해, $c=0$이고 $f(x)=x^3+ax^2+bx$이다.
      source_flow: 해설 p.19
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        조건 (나)에 의해, $\displaystyle\int_0^2 f(x)dx-\int_0^{-2}f(x)dx=\int_0^2 f(x)dx+\int_{-2}^0 f(x)dx=\int_{-2}^2 f(x)dx=16$이고 $\displaystyle\int_{-2}^2(x^3+ax^2+bx)dx=2\int_0^2 ax^2dx=\dfrac{16}{3}a=16$이다.
        그러므로 $a=3$이고 $f(x)=x^3+3x^2+bx$이다.
      source_flow: 해설 p.19
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $f(-1)=-1+3-b=6$이므로 $b=-4$이고 $f(x)=x^3+3x^2-4x$이다.
      source_flow: 해설 p.19
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $f'(x)=3x^2+6x-4$이므로 $f'(1)=5$이다.
      source_flow: 해설 p.19
      criteria:
      - 1.A2
