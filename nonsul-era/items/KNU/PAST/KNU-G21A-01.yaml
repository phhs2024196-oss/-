  - id: MC-PRB-42103
    outcome_code: '71'
    wrong_work: '$g(M)=2$일 때 직선 $y=x$ 위쪽 활꼴의 넓이를 $\frac{\pi}{4}+\frac12$(큰 쪽)로 계산'
    detect_cue: $S$ 값 중 $\frac{\pi}{4}+\frac12$ 또는 $\frac{3\pi}{4}+\frac12$가 등장한다
    feedback: 직선 $y=x$는 원 위의 점 $(1,1)$, $(2,2)$를 지나며 $y\ge x$인 쪽은 중심 $(2,1)$의 반대쪽 작은 활꼴입니다.
    remedy: [RL-4]

