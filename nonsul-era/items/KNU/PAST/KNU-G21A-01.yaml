    outcome_code: '71'
    wrong_work: '조건부확률 대신 $\mathrm{P}(A\cap B)=\frac{18}{49}$을 답으로 하여 $m+n=67$'
    detect_cue: '"만날 때"라는 조건을 무시하고 $\mathrm{P}(A)$로 나누지 않았다'
    feedback: '"서로 다른 두 점에서 만날 때"는 사건 $A$가 일어났다는 조건입니다. 제시문 (마)의 조건부확률을 쓰세요.'
    remedy: [RL-3]

- id: '4'
  stem: |
    【1-4】 함수

    $$g(x)=\begin{cases}0 & (x\le0)\\1 & (0<x\le1)\\2 & (1<x\le2)\\3 & (x>2)\end{cases}$$

    와 확률변수 $M$에 대하여 부등식 $y\ge\dfrac{g(M)}{2}x$가 나타내는 영역과 부등식 $(x-2)^2+(y-1)^2\le1$이 나타내는 영역의 공통부분의 넓이를 확률변수 $S$라 할 때, $\mathrm{E}(S)$의 값은 $a\pi+b$이다. $192(a+b)$의 값을 구하시오. (단, 두 영역의 공통부분이 없을 때 $S=0$이고, $a$와 $b$는 유리수이다.) (30점)
  points: 30
  depends_on: ['2']
  answer: {kind: value, value: '71', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $g(M)$의 네 값에 대해 직선 $y=0,\frac x2,x,\frac32x$와 원판의 공통부분 넓이를 구해 이산확률분포로 기댓값 계산.
    steps:
    - {id: 4a, content: '$S\in\{\pi,\frac{\pi}{2},\frac{\pi}{4}-\frac12,0\}$, 확률 $\frac13,\frac{9}{48},\frac{11}{48},\frac14$, $\mathrm{E}(S)=\frac{31}{64}\pi-\frac{11}{96}$, $192(a+b)=71$', criteria: [4.B1, 4.M1, 4.A1]}
    hint_ladder:
    - $g(M)$이 가질 수 있는 값은 몇 개인가? 그때마다 직선은 원의 어디를 지나는가?
  - id: S4-B
    audience: B
    source_flow: rep2021.pdf p.109
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        함수 $g(x)$는 $0,1,2,3$의 값을 가지므로, 넓이 $S$는 $g(M)=0$일 때 $S=\pi$, $g(M)=1$일 때 $S=\dfrac{\pi}{2}$, $g(M)=2$일 때 $S=\dfrac{\pi}{4}-\dfrac12$, 그리고 $g(M)=3$일 때 $S=0$을 갖는다. 즉, 넓이 $S$는 $0,\ \dfrac{\pi}{4}-\dfrac12,\ \dfrac{\pi}{2},\ \pi$를 갖는 이산확률변수가 된다.
      criteria: [4.B1]
    - id: 4b-2
      content: |
        이때 각각의 확률은
        $\mathrm{P}(S=0)=\mathrm{P}(g(M)=3)=\mathrm{P}(M>2)=\mathrm{P}(M\ge2)=\dfrac14$,
        $\mathrm{P}\left(S=\dfrac{\pi}{4}-\dfrac12\right)=\mathrm{P}(g(M)=2)=\mathrm{P}(1<M\le2)=\mathrm{P}(1\le M\le2)=\dfrac{11}{48}$,
        $\mathrm{P}\left(S=\dfrac{\pi}{2}\right)=\mathrm{P}(g(M)=1)=\mathrm{P}(0<M\le1)=\mathrm{P}(0\le M\le1)=\dfrac{9}{48}$,
        $\mathrm{P}(S=\pi)=\mathrm{P}(g(M)=0)=\mathrm{P}(M\le0)=\dfrac13$이다.
      criteria: [4.M1]
    - id: 4b-3
      content: |
        따라서 $\mathrm{E}(S)=0\times\dfrac14+\left(\dfrac{\pi}{4}-\dfrac12\right)\times\dfrac{11}{48}+\dfrac{\pi}{2}\times\dfrac{9}{48}+\pi\times\dfrac13=\dfrac{31}{64}\pi-\dfrac{11}{96}$이므로 $a=\dfrac{31}{64}$, $b=-\dfrac{11}{96}$이다. 따라서 $192(a+b)$의 값은 $71$이다.
      criteria: [4.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.B1
      mark_type: B
      points: 15
      evidence: |
        $S$는 $0,\ \frac{\pi}{4}-\frac12,\ \frac{\pi}{2},\ \pi$를 갖는 이산확률변수임을 보였다.
      steps: [4b-1]
    - id: 4.M1
      mark_type: M
      points: 10
      evidence: |
        네 값의 확률 $\frac14,\ \frac{11}{48},\ \frac{9}{48},\ \frac13$을 보였다.
      depends_on: []
      implied_ok: false
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 5
      evidence: |
        $\mathrm{E}(S)=\frac{31}{64}\pi-\frac{11}{96}$을 구했다(답 $71$).
      depends_on: [4.B1, 4.M1]
      steps: [4b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRB-42103}
