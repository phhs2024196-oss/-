intent: |
  점과 직선 사이의 거리를 구할 수 있는지(1-1), 연속확률변수와 관련된 사건의 확률을 확률밀도함수로 나타내고 함수의 최대·최소를 구할 수 있는지(1-2), 조건부확률의 뜻을 이해하고 조건부확률을 구할 수 있는지(1-3), 이산확률변수와 확률분포의 뜻을 이해하고 기댓값을 구할 수 있는지(1-4) 평가한다.
key_idea: |
  직선과 원이 두 점에서 만날 조건은 중심 $(2,1)$과 직선 사이 거리 $<1$, 즉 $0<M<\frac83$이다. 확률 $h(k)=\mathrm{P}\left(0\le M\le\frac83\right)$을 $k$의 함수로 쓰고 미분해 최대를 찾고($c=2$), 둔각(또는 일직선) 조건은 거리 $<\frac{\sqrt2}{2}$, 공통부분 넓이는 $g(M)$의 값에 따라 네 가지로 나뉘는 이산확률변수가 된다.
stuck: |
  1-2에서 $k$가 $\frac83$보다 큰지 작은지에 따라 $h(k)$의 식이 달라지는 것, 1-4에서 넓이 $S$가 $g(M)\in\{0,1,2,3\}$에 따라 네 값만 갖는 이산확률변수임을 파악하는 것
