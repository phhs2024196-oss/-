stimuli:
- label: (가)
  body: |
    점 $(x_1,y_1)$과 직선 $ax+by+c=0$ 사이의 거리 $d$는

    $$d=\frac{|ax_1+by_1+c|}{\sqrt{a^2+b^2}}$$

    이다. (단, $a,b,c$는 상수이고, $a^2+b^2\ne0$이다.)
- label: (나)
  body: |
    $a\le x\le b$에서 정의된 함수 $f(x)$가 다음 세 가지 성질을 만족할 때, 함수 $f(x)$를 연속확률변수 $X$의 확률밀도함수라고 한다.

    (a) $f(x)\ge0$

    (b) $y=f(x)$의 그래프와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 부분의 넓이가 $1$이다.

    (c) $\mathrm{P}(\alpha\le X\le\beta)$는 $y=f(x)$의 그래프와 $x$축 및 두 직선 $x=\alpha$, $x=\beta$로 둘러싸인 부분의 넓이와 같다. (단, $a\le\alpha\le\beta\le b$)
- label: (다)
  body: |
    연속확률변수 $X$가 특정한 값을 가질 확률은 $0$이므로

    $$\begin{aligned}\mathrm{P}(a\le X\le b)&=\mathrm{P}(a\le X<b)\\&=\mathrm{P}(a<X\le b)=\mathrm{P}(a<X<b)\end{aligned}$$

    가 성립한다.
- label: (라)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이면 최대·최소 정리에 의하여 이 구간에서 함수 $f(x)$는 최댓값과 최솟값을 가진다. 이때 이 구간에서 $f(x)$의 극댓값과 극솟값, $f(a)$, $f(b)$ 중에서 가장 큰 값이 최댓값이고, 가장 작은 값이 최솟값이다.
- label: (마)
  body: |
    두 사건 $A$와 $B$에 대하여 사건 $A$가 일어났을 때의 사건 $B$의 조건부확률은

    $$\mathrm{P}(B\mid A)=\frac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}$$

    이다. (단, $\mathrm{P}(A)>0$)
- label: (바)
  body: |
    이산확률변수 $X$의 확률분포가 다음 표와 같을 때

    | $X$ | $x_1$ | $x_2$ | $\cdots$ | $x_n$ | 합계 |
    |---|---|---|---|---|---|
    | $\mathrm{P}(X=x_i)$ | $p_1$ | $p_2$ | $\cdots$ | $p_n$ | $1$ |

    확률변수 $X$의 기댓값은

    $$\mathrm{E}(X)=\sum_{i=1}^{n}x_ip_i$$

    이다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  $0\le k\le3$인 실수 $k$에 대하여 연속확률변수 $M$이 갖는 값의 범위는 $-4\le M\le4$이고, $M$의 확률밀도함수 $f(x)$는

  $$f(x)=\begin{cases}\dfrac{x+4}{4(k+4)} & (-4\le x\le k)\\[2mm]\dfrac{x-4}{4(k-4)} & (k<x\le4)\end{cases}$$

  이다. 직선 $y=\dfrac{M}{2}x$와 원 $C:(x-2)^2+(y-1)^2=1$이 서로 다른 두 점에서 만날 확률이 최대가 되도록 하는 $k$의 값은 $c$이다. $k=c$일 때 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【1-1】 직선 $y=\dfrac{M}{2}x$와 원 $C$가 서로 다른 두 점에서 만나기 위한 $M$의 값의 범위는 $\alpha<M<\beta$이다. $3(\beta-\alpha)$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: value, value: '8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 원의 중심 $(2,1)$과 직선 사이 거리가 반지름 $1$보다 작을 조건.
    steps:
    - {id: 1a, content: '$\frac{|1-M|}{\sqrt{1+\frac{M^2}{4}}}<1\iff\frac34M^2-2M<0\iff0<M<\frac83$, $3(\beta-\alpha)=8$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 원과 직선이 두 점에서 만날 조건을 거리로 표현해 보자.
  - id: S1-B
    audience: B
    source_flow: rep2021.pdf p.108
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직선 $y=\dfrac{M}{2}x$와 원 $C$가 서로 다른 두 점에서 만나기 위해서는 직선과 원 $C$의 중심 $(2,1)$과의 거리가 반지름의 길이 $1$보다 작아야 한다. 즉, 제시문 (가)에 의하여 $\dfrac{|1-M|}{\sqrt{1+\frac{M^2}{4}}}<1$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이 부등식을 풀면 $0<M<\dfrac83$을 얻는다. 따라서 $\beta-\alpha=\dfrac83$이므로 구하는 값은 $8$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        $\dfrac{|1-M|}{\sqrt{1+\frac{M^2}{4}}}<1$을 유도했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $0<M<\dfrac83$을 구했다(답 $8$).
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42101}
  misconceptions:
  - id: MC-GEO-42101
    outcome_code: '71'
    wrong_work: '직선을 $Mx-2y=0$으로 두고 분자를 $|2M-1|$ 또는 분모를 $\sqrt{M^2+1}$로 잘못 계산'
    detect_cue: 정리한 이차부등식이 $3M^2-8M<0$과 다르다
    feedback: $Mx-2y=0$이면 거리는 $\frac{|2M-2|}{\sqrt{M^2+4}}$이고, 이것은 $\frac{|1-M|}{\sqrt{1+M^2/4}}$와 같습니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    【1-2】 $c=2$임을 증명하시오. (40점)
  points: 40
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $h(k)=\mathrm{P}\left(0\le M\le\frac83\right)$를 $k\le\frac83$, $k>\frac83$로 나눠 구하고 미분해 최대를 찾는다.
    steps:
    - {id: 2a, content: '$h(k)=1-\frac{2}{4+k}-\frac{2}{9(4-k)}\ (0\le k\le\frac83)$, $\frac{32}{9(k+4)}\ (\frac83<k\le3)$, $h^{\prime}(k)=\frac{16(k-2)(k-8)}{9(k-4)^2(k+4)^2}$이므로 $k=2$에서 최대', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - $\mathrm{P}(M<0)$과 $\mathrm{P}\left(M>\frac83\right)$을 삼각형 넓이로 구해 1에서 빼 보자.
    - $k=\frac83$을 기준으로 $\frac83$이 꼭짓점의 왼쪽인지 오른쪽인지 나누자.
  - id: S2-B
    audience: B
    source_flow: rep2021.pdf p.108
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        직선 $y=\dfrac{M}{2}x$와 원 $C$가 서로 다른 두 점에서 만날 확률은 $\mathrm{P}\left(0<M<\dfrac83\right)=\mathrm{P}\left(0\le M\le\dfrac83\right)$이다. 이 확률을 $h(k)$라 하면

        $$h(k)=\begin{cases}1-\left(\dfrac{2}{4+k}+\dfrac{2}{9(4-k)}\right) & \left(0\le k\le\dfrac83\right)\\[2mm]\dfrac{32}{9(k+4)} & \left(\dfrac83<k\le3\right)\end{cases}$$

        이다. (참고: 두 사다리꼴의 합으로 구하면 $0\le k\le\frac83$에서 $h(k)=\dfrac13+\dfrac{k}{2(k+4)}+\dfrac{8-3k}{18(4-k)}$)
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $0<k<\dfrac83$에서 함수 $h(k)$의 도함수는 $h^{\prime}(k)=\dfrac{16(k-2)(k-8)}{9(k-4)^2(k+4)^2}$이다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        닫힌구간 $\left[0,\dfrac83\right]$에서 함수 $h(k)$는 $k=2$에서 극댓값을 갖는다. 또한 $\dfrac83<k\le3$에서 함수 $h(k)$는 감소하므로, 함수 $h(k)$는 $k=2$에서 최댓값을 갖는다. 따라서 $c=2$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
