      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 10
      evidence: |
        $h^{\prime}(k)=\dfrac{16(k-2)(k-8)}{9(k-4)^2(k+4)^2}$를 유도했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        그래프의 개형을 이용하여 $c=2$임을 보였다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRB-42101}
  misconceptions:
  - id: MC-PRB-42101
    outcome_code: '71'
    wrong_work: '$k$의 위치와 무관하게 $\mathrm{P}\left(M>\frac83\right)=\frac{(4-\frac83)^2}{8(4-k)}$ 한 식만 써서 $\frac83<k\le3$ 구간을 빠뜨림'
    detect_cue: $h(k)$를 한 가지 식으로만 쓰고 $k>\frac83$에서의 감소를 확인하지 않았다
    feedback: $k>\frac83$이면 $x=\frac83$이 꼭짓점의 왼쪽에 있어 넓이 식이 달라집니다. 구간별로 확률밀도함수의 식을 확인하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    【1-3】 직선 $y=\dfrac{M}{2}x$와 원 $C$가 서로 다른 두 점에서 만날 때, 만나는 두 점과 원 $C$의 중심이 한 직선 위에 있거나 만나는 두 점과 원 $C$의 중심을 꼭짓점으로 하는 삼각형이 둔각삼각형이 될 확률은 $\dfrac{n}{m}$이다. $m+n$의 값을 구하시오.

    (단, $m,n$은 서로소인 자연수) (30점)
  points: 30
  depends_on: ['1', '2']
  answer: {kind: value, value: '407', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 두 변이 반지름 1인 이등변삼각형이 둔각(또는 퇴화)일 조건은 중심과 직선 사이 거리 $<\frac{\sqrt2}{2}$, 즉 $\frac27<M<2$.
    steps:
    - {id: 3a, content: '$\mathrm{P}(A)=h(2)=\frac59$, $\mathrm{P}(A\cap B)=\mathrm{P}\left(\frac27\le M\le2\right)=\frac{18}{49}$, $\mathrm{P}(B\mid A)=\frac{162}{245}$, $m+n=407$', criteria: [3.B1, 3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - 꼭짓각이 직각이 되는 경계에서 중심과 현 사이 거리는 얼마인가?
  - id: S3-B
    audience: B
    source_flow: rep2021.pdf p.108~109
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        직선 $y=\dfrac{M}{2}x$와 원 $C$가 서로 다른 두 점에서 만나는 사건을 $A$, 두 교점과 점 $(2,1)$이 한 직선 위에 있거나 이 세 점을 꼭짓점으로 하는 삼각형이 둔각삼각형이 되는 사건을 $B$라 하자. 사건 $A$가 일어날 확률은 $0<M<\dfrac83$일 확률과 같으므로 $\mathrm{P}(A)=h(2)=\dfrac59$이다.
      criteria: [3.B1]
    - id: 3b-2
      content: |
        세 점이 삼각형을 이루는 경우 이 삼각형은 두 변의 길이가 $1$인 이등변삼각형이다. 직선과 점 $(2,1)$과의 거리가 $\dfrac{\sqrt2}{2}$일 때 직각삼각형이 되므로, 거리가 $\dfrac{\sqrt2}{2}$보다 작으면 사건 $B$가 일어난다. 즉, $\dfrac{|1-M|}{\sqrt{1+\frac{M^2}{4}}}<\dfrac{\sqrt2}{2}$이다.
      criteria: [3.M1]
    - id: 3b-3
      content: |
        이 부등식을 풀면 $\dfrac27<M<2$를 얻는다. 따라서 $\mathrm{P}(A\cap B)=\mathrm{P}\left(\dfrac27<M<2\right)=\mathrm{P}\left(\dfrac27\le M\le2\right)=\dfrac{18}{49}$이다.
      criteria: [3.M2]
    - id: 3b-4
      content: |
        구하는 확률은 조건부확률 $\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}=\dfrac{162}{245}$이다. 따라서 $m=245$, $n=162$이므로 $m+n=407$이다. (참고: 두 교점 사이 거리가 $\sqrt2$보다 크다는 조건 $\left(\frac{M^2}{4}+1\right)(\alpha-\beta)^2>2$를 근과 계수의 관계로 풀어도 $\frac27<M<2$를 얻는다.)
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 5
      evidence: |
        직선과 원 $C$가 서로 다른 두 점에서 만나는 사건의 확률 $\mathrm{P}(A)=\frac59$를 구했다.
      steps: [3b-1]
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        $\dfrac{|1-M|}{\sqrt{1+\frac{M^2}{4}}}<\dfrac{\sqrt2}{2}$을 유도했다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 10
      evidence: |
        $\mathrm{P}(A\cap B)=\mathrm{P}\left(\frac27\le M\le2\right)=\frac{18}{49}$을 구했다.
      depends_on: [3.M1]
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        $\mathrm{P}(B\mid A)=\frac{162}{245}$을 구했다(답 $407$).
      depends_on: [3.B1, 3.M2]
      steps: [3b-4]
    deductions: []
