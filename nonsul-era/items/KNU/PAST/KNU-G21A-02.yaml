stimuli:
- label: (가)
  body: |
    명제 $p\to q$의 참, 거짓과 그 대우 $\sim q\to\sim p$의 참, 거짓은 일치한다.
- label: (나)
  body: |
    $x=a$에서 함수 $f(x)$의 좌극한과 우극한이 모두 존재하고 그 값이 $\alpha$로 같으면 $\displaystyle\lim_{x\to a}f(x)$가 존재하고 그 값은 $\alpha$이다. 또한, 그 역도 성립한다.
- label: (다)
  body: |
    함수 $f(x)$에 대하여 극한값

    $$\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$$

    가 존재하면, 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  실수 $a$에 대하여 최고차항의 계수가 $1$인 삼차함수 $f(x)$는 다음 조건을 만족시킨다. (단, $a<4$)

  (ㄱ) 모든 실수 $x$에 대하여, $f(a+x)\ne0$이면

  $$f(a+x)f(a-x)<0$$

  이다.

  (ㄴ) $f(4)=0$

  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【2-1】 집합 $\{x\mid x>0\text{이고 }f(x)=0\}$의 원소의 개수를 $n(a)$라 할 때, $\displaystyle\lim_{a\to2+}n(a)$와 $\displaystyle\lim_{a\to2-}n(a)$의 값을 각각 구하시오. (40점)
  points: 40
  depends_on: []
  answer: {kind: value, value: '3; 2', equivalents: ['lim_{a→2+} n(a)=3, lim_{a→2-} n(a)=2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (ㄱ)에서 $f(a)=0$, 대우로 $f(2a-4)=0$. 근 $2a-4<a<4$ 중 양수의 개수.
    steps:
    - {id: 1a, content: '$f(x)=\{x-(2a-4)\}(x-a)(x-4)$, $n(a)=1\ (a\le0),\ 2\ (0<a\le2),\ 3\ (2<a<4)$이므로 $3$, $2$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - (ㄱ)에 $x=0$을 넣으면 무엇을 알 수 있는가?
    - $a+x=4$가 되도록 $x$를 골라 대우를 써 보자.
  - id: S1-B
    audience: B
    source_flow: rep2021.pdf p.113
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (ㄱ)에서 $x=0$이고 $f(a)\ne0$이면 $\{f(a)\}^2<0$이므로 모순이다. 즉 $f(a)=0$이다. 조건 (ㄱ)에서 $x=a-4$이면 조건 (ㄴ)에 의하여 $f(a+x)f(a-x)=f(2a-4)f(4)=0$이므로 대우 명제에 의하여 $f(2a-4)=f(a+x)=0$이다. 따라서 $f(x)=\{x-(2a-4)\}(x-a)(x-4)$이고 $2a-4<a<4$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $n(a)=\begin{cases}1 & (a\le0)\\2 & (0<a\le2)\\3 & (2<a<4)\end{cases}$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        이므로 $\displaystyle\lim_{a\to2+}n(a)=3$, $\displaystyle\lim_{a\to2-}n(a)=2$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $f(x)=\{x-(2a-4)\}(x-a)(x-4)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 14
      evidence: |
        $n(a)$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: |
        $\displaystyle\lim_{a\to2+}n(a)=3$, $\displaystyle\lim_{a\to2-}n(a)=2$를 구했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRF-42101}
  misconceptions:
  - id: MC-PRF-42101
    outcome_code: '71'
    wrong_work: '(ㄱ)에서 "$f(a+x)f(a-x)<0$"만 보고 $f$가 점 $(a,0)$에 대해 대칭이라 단정해 세 번째 근을 $2a-4$ 대신 임의로 둠'
    detect_cue: $f(2a-4)=0$을 대우로 정당화하지 않고 근을 가정했다
    feedback: $f(4)=0$이므로 $x=a-4$일 때 $f(a+x)f(a-x)=0$입니다. 이것이 $<0$이 아니므로 대우에 의해 $f(a+x)=f(2a-4)=0$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    【2-2】 $\displaystyle\int_0^2f(x)\,dx$가 최대일 때, $3a$의 값을 구하시오. (30점)
  points: 30
  depends_on: ['1']
  answer: {kind: value, value: '5', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 적분값이 $a$에 대한 이차식 $-12a^2+40a-28$.
    steps:
    - {id: 2a, content: '$\int_0^2f(x)dx=-12\left(a-\frac53\right)^2+\frac{16}{3}$, $3a=5$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - $f(x)$를 전개해 $0$부터 $2$까지 적분하면 $a$에 대한 몇 차식인가?
  - id: S2-B
    audience: B
    source_flow: rep2021.pdf p.113
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $$\begin{aligned}\int_0^2f(x)dx&=\int_0^2\{x-(2a-4)\}\{x^2-(a+4)x+4a\}dx\\&=4-\frac83(a+4)+8a-\frac83(2a-4)+2(2a-4)(a+4)-8a(2a-4)\\&=-12a^2+40a-28=-12\left(a-\frac53\right)^2+\frac{16}{3}\end{aligned}$$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        이므로 $a=\dfrac53$일 때 최대이므로 $3a=5$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 25
      evidence: |
        $\displaystyle\int_0^2f(x)dx=-12\left(a-\frac53\right)^2+\frac{16}{3}$를 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 25}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $3a=5$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42101}
  misconceptions:
  - id: MC-CAL-42101
    outcome_code: '71'
    wrong_work: '$\int_0^2|f(x)|dx$(넓이)로 착각하거나 전개 중 $(2a-4)(a+4)$ 항의 부호를 틀려 다른 꼭짓점을 얻음'
    detect_cue: 이차식의 꼭짓점이 $a=\frac53$이 아니다
    feedback: 정적분은 부호를 포함한 값입니다. 전개는 $x^3-(3a)x^2+\cdots$ 꼴로 계수를 하나씩 확인하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    【2-3】 함수 $g(x)=|f(x)f(-x)|$에 대하여 다음 물음에 답하시오.

    (1) $a=2$일 때, 함수 $g(x)$가 $x=b$에서 미분가능하지 않은 모든 $b$의 값을 구하시오. (20점)

    (2) $a=0$이고, 실수 $k$에 대하여 방정식

    $$\frac{g(x)}{(x+4)^2}=kx\quad(x\ne-4)$$

    의 서로 다른 실근의 개수가 $3$일 때, $\dfrac{27}{16}k$의 값을 구하시오. (20점)
  points: 40
  depends_on: ['1']
  answer: {kind: value, value: '{-4, -2, 2, 4}; 16', equivalents: ['(1) b=4,2,-2,-4 (2) 16'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: (1) $g=x^2|x-4||x-2||x+2||x+4|$의 홑근에서 꺾임. (2) $x^2(x-4)^2=kx$에서 $x=0$ 외에 $x(x-4)^2=k$가 서로 다른 두 근(0, $-4$ 아님) → 극댓값 $k=\frac{256}{27}$.
    steps:
    - {id: 3a, content: '(1) $b=4,2,-2,-4$ (2) $k=\frac{256}{27}$, $\frac{27}{16}k=16$', criteria: [3.M1, 3.A1, 3.M2, 3.M3, 3.M4, 3.A2]}
    hint_ladder:
    - $|x-p|$ 꼴 인수가 홑으로 있으면 $x=p$에서 미분가능한가? $x^2$은?
    - $x=0$은 항상 근이다. 나머지는 $x(x-4)^2=k$의 근이다.
  - id: S3-B
    audience: B
    source_flow: rep2021.pdf p.113~114
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $g(x)=|f(x)f(-x)|=|\{x-(2a-4)\}(x-a)(x-4)\{x+(2a-4)\}(x+a)(x+4)|$이고 $2a-4<a<4$, $-4<-a<-(2a-4)$이다. (1) $a=2$이면 $g(x)=|f(x)f(-x)|=x^2|x-4||x-2||x+2||x+4|$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        이므로 $g(x)$는 $x=b=4,2,-2,-4$에서 미분가능하지 않다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        (2) $a=0$이므로 $g(x)=x^2(x-4)^2(x+4)^2$이다. 방정식 $\dfrac{g(x)}{(x+4)^2}=kx\ (x\ne-4)$가 $x=0$을 포함한 서로 다른 실근의 개수가 $3$이므로 $k\ne0$이고 방정식 $x(x-4)^2=k$는 $0,-4$가 아닌 서로 다른 실근의 개수는 $2$이다. 여기서 $h(x)=x(x-4)^2$이라 두면, 곡선 $y=h(x)$와 직선 $y=k$는 오직 두 점에서 만나고, 이 두 점의 $x$좌표는 $0,-4$가 아니다. 즉 $h(x_0)=x_0(x_0-4)^2-k=0$이다.
      criteria: [3.M2]
    - id: 3b-4
      content: |
        $h^{\prime}(x)=(x-4)(3x-4)$이므로 접점에서 $h^{\prime}(x_0)=2x_0(x_0-4)+(x_0-4)^2=0$이다.
      criteria: [3.M3]
    # [그림: y=x(x-4)^2 의 그래프(0≤x≤6)와 수평선 y=256/27]
    - id: 3b-5
      content: |
        $h(x)$는 $x=\dfrac43$에서 극댓값 $\dfrac{256}{27}$, $x=4$에서 극솟값 $0$을 가지므로 $x_0=\dfrac43$이다.
      criteria: [3.M4]
    - id: 3b-6
      content: |
        따라서 $k=\dfrac{256}{27}$이고, $\dfrac{27}{16}k=16$이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 12
      evidence: |
        (1) $g(x)=|f(x)f(-x)|=x^2|x-4||x-2||x+2||x+4|$를 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 12}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 8
      evidence: |
        (1) $b=4,2,-2,-4$를 구했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: |
        (2) $h(x_0)=x_0(x_0-4)^2-k=0$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [3b-3]
    - id: 3.M3
      mark_type: M
      points: 5
      evidence: |
        (2) $h^{\prime}(x_0)=2x_0(x_0-4)+(x_0-4)^2=0$을 구했다.
      depends_on: [3.M2]
      steps: [3b-4]
    - id: 3.M4
      mark_type: M
      points: 5
      evidence: |
        (2) $x_0=\dfrac43$을 구했다.
      depends_on: [3.M3]
      steps: [3b-5]
    - id: 3.A2
      mark_type: A
      points: 5
      evidence: |
        (2) $\dfrac{27}{16}k=16$을 구했다.
      depends_on: [3.M4]
      steps: [3b-6]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42102}
  - {code: '72', misconception: MC-ALG-42101}
  misconceptions:
