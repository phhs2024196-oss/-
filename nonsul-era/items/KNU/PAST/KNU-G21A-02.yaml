intent: |
  명제와 그 대우 사이의 관계를 이용하여 삼차함수의 성질을 파악하고 함수의 극한을 계산할 수 있는지(2-1), 다항함수의 정적분을 구하고 이차함수의 최대·최소를 구할 수 있는지(2-2), 미분가능성을 판단하고 방정식과 부등식에 대한 문제를 해결할 수 있는지(2-3) 평가한다.
key_idea: |
  조건 (ㄱ)에 $x=0$을 넣으면 $f(a)=0$, $x=a-4$를 넣으면 $f(2a-4)f(4)=0$이므로 대우에 의해 $f(2a-4)=0$. 따라서 $f(x)=\{x-(2a-4)\}(x-a)(x-4)$이고 근의 위치로 $n(a)$, 적분값, $g(x)$의 꺾이는 점이 모두 정해진다.
stuck: |
  조건 (ㄱ)의 대우 "$f(a+x)f(a-x)\ge0$이면 $f(a+x)=0$"을 $x=a-4$에 적용해 세 번째 근 $2a-4$를 찾는 단계
