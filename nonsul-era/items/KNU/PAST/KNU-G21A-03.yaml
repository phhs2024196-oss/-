intent: |
  적분과 미분의 관계를 이용하여 주어진 함수의 특징을 파악할 수 있는지, 주기함수의 성질을 이해하고 이를 활용하여 정적분을 계산할 수 있는지, 치환적분을 이해하고 이를 활용하여 정적분을 계산할 수 있는지를 평가한다.
key_idea: |
  $x-t=u$로 치환하고 주기성(3-2)으로 적분 구간을 $[0,2\pi]$로 옮기면 $\int_0^{2\pi}f^{\prime}(x-t)\cos t\,dt=A\cos x+B\sin x$($A,B$는 상수)이므로 $f(x)=(A\cos x+B\sin x)^2-\cos x+\alpha$. 이를 미분해 $A,B$의 정의식에 다시 넣으면 홀수 차수 삼각 적분이 $0$이 되어 $B=\pi$, $A=0$.
stuck: |
  3-3에서 적분 구간 $[x-2\pi,x]$를 3-2의 결과로 $[0,2\pi]$로 바꾸고, 미지의 상수 $A,B$를 두어 자기참조 방정식을 푸는 단계
idea_tags: [IDEA-PERIODIC-INTEGRAL-SHIFT, IDEA-SELF-REFERENTIAL-INTEGRAL-CONSTANTS]
