stimuli:
- label: (가)
  body: |
    두 함수 $f(x),g(x)$가 미분가능하고, $f^{\prime}(x),g^{\prime}(x)$가 닫힌구간 $[a,b]$에서 연속일 때

    $$\int_a^bf(x)g^{\prime}(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf^{\prime}(x)g(x)\,dx$$

    이다.
- label: (나)
  body: |
    함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때

    $$\frac{d}{dx}\int_a^xf(t)\,dt=f(x)\quad(\text{단, }a<x<b)$$

    이다.
- label: (다)
  body: |
    $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$

    $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$

    $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$

    $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$
- label: (라)
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g^{\prime}(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때, $\alpha,\beta$를 포함하는 구간에서 연속이면

    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g^{\prime}(t)\,dt$$

    이다.

