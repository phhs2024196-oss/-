subparts:
- id: '1'
  stem: |
    【3-1】 $\displaystyle\int_0^{2\pi}\sin^2x\,dx$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: value, value: 'pi', equivalents: ['π'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 부분적분으로 $\int\sin^2=\int\cos^2=2\pi-\int\sin^2$.
    steps:
    - {id: 1a, content: '$\int_0^{2\pi}\sin^2x\,dx=2\pi-\int_0^{2\pi}\sin^2x\,dx\Rightarrow\pi$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $\sin^2x=\sin x\cdot\sin x$로 보고 부분적분해 보자.
  - id: S1-B
    audience: B
    source_flow: rep2021.pdf p.118
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\int_0^{2\pi}\sin^2x\,dx=\Big[-\sin x\cos x\Big]_0^{2\pi}+\int_0^{2\pi}\cos^2x\,dx=\int_0^{2\pi}(1-\sin^2x)\,dx$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이므로 $\displaystyle\int_0^{2\pi}\sin^2x\,dx=\pi$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        $\displaystyle\int_0^{2\pi}\sin^2x\,dx=2\pi-\int_0^{2\pi}\sin^2x\,dx$임을 유도했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $\displaystyle\int_0^{2\pi}\sin^2x\,dx=\pi$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42103}
  misconceptions:
  - id: MC-CAL-42103
    outcome_code: '71'
    wrong_work: '$\int\sin^2x\,dx=\frac{\sin^3x}{3}$으로 적분해 $0$을 답함'
    detect_cue: 답이 $0$이거나 합성함수 미분의 역을 잘못 적용했다
    feedback: $\sin^3x/3$을 미분하면 $\sin^2x\cos x$입니다. 부분적분(또는 반각공식)을 쓰세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    【3-2】 연속함수 $g(x)$가 모든 실수 $x$에 대하여

    $$g(x)=g(x+2\pi)$$

    를 만족시킬 때, 함수 $h(x)=\displaystyle\int_{x-2\pi}^{x}g(t)\,dt$가 상수함수임을 증명하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 상수 $c$로 구간을 나눠 미분하면 $h^{\prime}(x)=g(x)-g(x-2\pi)=0$.
    steps:
    - {id: 2a, content: '$h(x)=\int_c^xg-\int_c^{x-2\pi}g$, $h^{\prime}(x)=g(x)-g(x-2\pi)=0$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - 아래끝에도 $x$가 있다. 고정된 점 $c$로 적분을 둘로 나누자.
  - id: S2-B
    audience: B
    source_flow: rep2021.pdf p.118
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        구간 $[x-2\pi,x]$에 속하는 상수 $c$에 대하여 $h(x)=\displaystyle\int_{x-2\pi}^{x}g(t)\,dt=\int_c^xg(t)\,dt+\int_{x-2\pi}^{c}g(t)\,dt=\int_c^xg(t)\,dt-\int_c^{x-2\pi}g(t)\,dt$이다. 이 등식의 양변을 $x$에 대하여 미분하면 $h^{\prime}(x)=g(x)-g(x-2\pi)$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $g(x-2\pi)=g(x)$이므로 $h^{\prime}(x)=0$이다. 따라서 함수 $h(x)$는 상수함수이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $h^{\prime}(x)=g(x)-g(x-2\pi)$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        $h^{\prime}(x)=0$임을 증명했다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42104}
  misconceptions:
  - id: MC-CAL-42104
    outcome_code: '71'
    wrong_work: '$\frac{d}{dx}\int_{x-2\pi}^{x}g(t)\,dt=g(x)$로 아래끝의 변화를 무시'
    detect_cue: $h^{\prime}(x)$에 $g(x-2\pi)$ 항이 없다
    feedback: 아래끝도 $x$에 따라 움직입니다. 고정된 상수 $c$로 나눈 뒤 제시문 (나)를 각각 적용하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    【3-3】 함수 $f(x)$는 실수 전체의 집합에서 미분가능하고 도함수 $f^{\prime}(x)$는 연속함수이다. 함수 $f(x)$가 다음 조건을 만족시킨다.

    모든 실수 $x$에 대하여

    (ㄱ) $f^{\prime}(x)=f^{\prime}(x+2\pi)$

    (ㄴ) $f(x)=\left(\displaystyle\int_0^{2\pi}f^{\prime}(x-t)\cos t\,dt\right)^2-\cos x+\alpha$ (단, $\alpha$는 상수)

    다음 물음에 답하시오.

    (1) $\displaystyle\int_0^{2\pi}f^{\prime}(t)\sin t\,dt$의 값을 구하시오. (40점)

    (2) $f(0)=1$일 때, 상수 $\alpha$의 값을 구하시오. (40점)
  points: 80
  depends_on: ['1', '2']
  answer: {kind: value, value: 'pi; 2', equivalents: ['(1) π (2) α=2'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $A=\int_0^{2\pi}f^{\prime}\cos$, $B=\int_0^{2\pi}f^{\prime}\sin$로 두면 $f=(A\cos x+B\sin x)^2-\cos x+\alpha$이고 홀수 차수 삼각 적분이 모두 $0$.
    steps:
    - {id: 3a, content: '$B=\int_0^{2\pi}\sin^2t\,dt=\pi$, $A=0$, $f(x)=(\pi\sin x)^2-\cos x+\alpha$, $f(0)=-1+\alpha=1\Rightarrow\alpha=2$', criteria: [3.M1, 3.M2, 3.M3, 3.A1, 3.M4, 3.M5, 3.M6, 3.A2]}
    hint_ladder:
    - $x-t=u$로 치환한 뒤 3-2를 이용해 적분 구간을 $[0,2\pi]$로 바꾸자.
    - $\int_0^{2\pi}f^{\prime}(u)\cos u\,du$와 $\int_0^{2\pi}f^{\prime}(u)\sin u\,du$는 상수다.
  - id: S3-B
    audience: B
    source_flow: rep2021.pdf p.119
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1) 정적분 $\displaystyle\int_0^{2\pi}f^{\prime}(x-t)\cos t\,dt$에서 $x-t=u$로 놓으면 $(-1)\dfrac{dt}{du}=1$이고, $t=0$일 때 $u=x$, $t=2\pi$일 때 $u=x-2\pi$이므로 $\displaystyle\int_0^{2\pi}f^{\prime}(x-t)\cos t\,dt=-\int_x^{x-2\pi}f^{\prime}(u)\cos(x-u)\,du=\int_0^{2\pi}f^{\prime}(u)\cos(x-u)\,du$이다. (3-2에 의해 주기 $2\pi$인 함수의 길이 $2\pi$ 구간 적분은 일정)
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $\displaystyle=\int_0^{2\pi}f^{\prime}(u)(\cos x\cos u+\sin x\sin u)\,du=\cos x\int_0^{2\pi}f^{\prime}(u)\cos u\,du+\sin x\int_0^{2\pi}f^{\prime}(u)\sin u\,du$이다. 이 두 정적분은 상수이므로 각각 $A$, $B$라 두자.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        그러면 조건 (ㄴ)으로부터 $f(x)=(A\cos x+B\sin x)^2-\cos x+\alpha$이고, 양변을 미분하면 $f^{\prime}(x)=2(A\cos x+B\sin x)(-A\sin x+B\cos x)+\sin x=-2AB\sin^2x+2(B^2-A^2)\sin x\cos x+2AB\cos^2x+\sin x$이다.
      criteria: [3.M3]
    - id: 3b-4
      content: |
        따라서 $B=\displaystyle\int_0^{2\pi}f^{\prime}(t)\sin t\,dt=-2AB\int_0^{2\pi}\sin^3t\,dt+2(B^2-A^2)\int_0^{2\pi}\sin^2t\cos t\,dt+2AB\int_0^{2\pi}\sin t\cos^2t\,dt+\int_0^{2\pi}\sin^2t\,dt$이고, 치환적분법을 이용하면 $\displaystyle\int_0^{2\pi}\sin^3t\,dt=\int_0^{2\pi}\sin^2t\cos t\,dt=\int_0^{2\pi}\sin t\cos^2t\,dt=0$이다. 따라서 $B=\displaystyle\int_0^{2\pi}\sin^2t\,dt=\pi$이다.
      criteria: [3.A1]
    - id: 3b-5
      content: |
        (2) $A=\displaystyle\int_0^{2\pi}f^{\prime}(t)\cos t\,dt=-2AB\int_0^{2\pi}\sin^2t\cos t\,dt+2(B^2-A^2)\int_0^{2\pi}\sin t\cos^2t\,dt+2AB\int_0^{2\pi}\cos^3t\,dt+\int_0^{2\pi}\sin t\cos t\,dt$이다.
      criteria: [3.M4]
    - id: 3b-6
      content: |
        치환적분법을 이용하면 네 정적분이 모두 $0$이다. 즉, $A=0$이다.
      criteria: [3.M5]
    - id: 3b-7
      content: |
        따라서 $f(x)=(\pi\sin x)^2-\cos x+\alpha$이다.
      criteria: [3.M6]
    - id: 3b-8
      content: |
        이때 $f(0)=1$이므로 $\alpha=2$이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        (1) $\displaystyle\int_0^{2\pi}f^{\prime}(x-t)\cos t\,dt=\int_0^{2\pi}f^{\prime}(u)\cos(x-u)\,du$임을 유도했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: |
        (1) $=\cos x\displaystyle\int_0^{2\pi}f^{\prime}(u)\cos u\,du+\sin x\int_0^{2\pi}f^{\prime}(u)\sin u\,du$임을 유도했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M3
      mark_type: M
      points: 10
      evidence: |
        (1) $f^{\prime}(x)=-2AB\sin^2x+2(B^2-A^2)\sin x\cos x+2AB\cos^2x+\sin x$를 구했다.
      depends_on: [3.M2]
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        (1) $\displaystyle\int_0^{2\pi}f^{\prime}(t)\sin t\,dt=\pi$를 구했다.
      depends_on: [3.M3]
      steps: [3b-4]
    - id: 3.M4
      mark_type: M
      points: 10
      evidence: |
        (2) $\displaystyle\int_0^{2\pi}f^{\prime}(t)\cos t\,dt$를 네 정적분의 합으로 나타냈다.
      depends_on: [3.M3]
      steps: [3b-5]
    - id: 3.M5
      mark_type: M
      points: 10
      evidence: |
        (2) $A=0$을 구했다.
      depends_on: [3.M4]
      steps: [3b-6]
    - id: 3.M6
      mark_type: M
      points: 10
      evidence: |
        (2) $f(x)=(\pi\sin x)^2-\cos x+\alpha$임을 구했다.
      depends_on: [3.M5, 3.A1]
      steps: [3b-7]
    - id: 3.A2
      mark_type: A
      points: 10
      evidence: |
        (2) $\alpha=2$를 구했다.
      depends_on: [3.M6]
      steps: [3b-8]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42105}
  misconceptions:
