stimuli:
- label: (가)
  body: |
    $x=a$에서 함수 $f(x)$의 좌극한과 우극한이 모두 존재하고 그 값이 $\alpha$로 같으면 $\displaystyle\lim_{x\to a}f(x)$가 존재하고 그 값은 $\alpha$이다. 또한, 그 역도 성립한다.
- label: (나)
  body: |
    함수 $f(x)$에 대하여 극한값

    $$\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$$

    가 존재하면, 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다. 이때 이 극한값을 함수 $f(x)$의 $x=a$에서의 미분계수라고 하며, 이것을 기호로 $f^{\prime}(a)$와 같이 나타낸다.
- label: (다)
  body: |
    미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면

    $$f^{\prime}(a)=0$$

    이다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  함수

  $$f(x)=\begin{cases}\left(x-\dfrac23\right)(x-2)^3 & (x<2)\\[2mm]\left(x+\dfrac23\right)(x-2)^3+(2-k)(x-2)^2 & (x\ge2)\end{cases}$$

  에 대하여 다음 물음에 답하시오. (단, $k$는 실수)

subparts:
- id: '1'
  stem: |
    【1-1】 미분계수의 정의를 이용하여 $f^{\prime}(2)$가 존재함을 보이고, 그 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 좌·우 미분계수가 모두 $0$.
    steps:
    - {id: 1a, content: '$\lim_{h\to0-}\left(h+\frac43\right)h^2=0$, $\lim_{h\to0+}\left\{\left(h+\frac83\right)h^2+(2-k)h\right\}=0$, $f^{\prime}(2)=0$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $f(2)=0$이다. $h<0$, $h>0$일 때 $f(2+h)$를 각각 써 보자.
  - id: S1-B
    audience: B
    source_flow: rep2021.pdf p.123
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(2)=0$이고, $\displaystyle\lim_{h\to0-}\frac{f(2+h)-f(2)}{h}=\lim_{h\to0-}\frac{\left(h+\frac43\right)h^3}{h}=\lim_{h\to0-}\left\{\left(h+\frac43\right)h^2\right\}=0$,
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\displaystyle\lim_{h\to0+}\frac{f(2+h)-f(2)}{h}=\lim_{h\to0+}\frac{\left(h+\frac83\right)h^3+(2-k)h^2}{h}=\lim_{h\to0+}\left\{\left(h+\frac83\right)h^2+(2-k)h\right\}=0$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        이 모두 존재하고 그 값이 같다. 따라서 함수 $f(x)$는 $x=2$에서 미분가능하고, $f^{\prime}(2)=0$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        좌극한 $\displaystyle\lim_{h\to0-}\frac{f(2+h)-f(2)}{h}=0$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        우극한 $\displaystyle\lim_{h\to0+}\frac{f(2+h)-f(2)}{h}=0$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $f^{\prime}(2)=0$을 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42106}
  misconceptions:
  - id: MC-CAL-42106
    outcome_code: '71'
    wrong_work: '정의 대신 두 식의 도함수를 각각 구해 $x=2$를 대입하는 것으로 존재를 주장'
    detect_cue: $\frac{f(2+h)-f(2)}{h}$의 한쪽 극한이 없다
    feedback: 문제는 미분계수의 정의를 요구합니다. 도함수의 좌우 극한이 같다는 것만으로는 정의에 의한 존재 증명이 아닙니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    【1-2】 함수 $f(x)$가 극댓값을 갖도록 하는 $k$의 값의 범위는 $k>\alpha$이다. $\alpha$의 값을 구하시오. (30점)
  points: 30
  depends_on: ['1']
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x<2$에서 $f^{\prime}\ge0$ 근처 $x=2$ 왼쪽은 양수이므로 $x=2$ 오른쪽에서 음수가 되어야 함 → $1+\sqrt{k/2}>2$.
    steps:
    - {id: 2a, content: '$(x-1)^2-\frac k2=0$의 큰 근이 $2$보다 커야 하므로 $k>2$, $\alpha=2$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - $x<2$에서 $f^{\prime}(x)=4(x-1)(x-2)^2$의 부호로는 극대가 생기는가?
  - id: S2-B
    audience: B
    source_flow: rep2021.pdf p.123
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        함수 $f(x)$를 범위 $x<2$ 및 $x>2$에서 각각 미분하면 $f^{\prime}(x)=\begin{cases}4(x-1)(x-2)^2 & (x<2)\\4(x-2)\left\{(x-1)^2-\dfrac k2\right\} & (x\ge2)\end{cases}$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 함수 $f(x)$가 극댓값을 갖기 위해서는 구간 $(2,\infty)$에서 $(x-1)^2-\dfrac k2$의 값의 부호가 음에서 양으로 바뀌어야 한다(이때 함수 $f(x)$는 $x=2$에서 극댓값을 가지게 된다). 즉, 방정식 $(x-1)^2-\dfrac k2=0$이 두 개의 서로 다른 실근을 갖고 그 중 큰 해가 $2$보다 커야 하므로 $k>0$ 및 $1+\sqrt{\dfrac k2}>2$가 성립해야 한다. 이로부터 $k>2$일 때만 함수 $f(x)$가 극댓값을 가짐을 알 수 있다. 따라서 $\alpha=2$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        구간별 $f^{\prime}(x)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $\alpha=2$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42107}
  misconceptions:
  - id: MC-CAL-42107
    outcome_code: '71'
    wrong_work: '$(x-1)^2=\frac k2$가 서로 다른 두 실근을 가질 조건 $k>0$만으로 $\alpha=0$'
    detect_cue: 답이 $0$이다
    feedback: 근 $1\pm\sqrt{k/2}$는 $x\ge2$ 구간 안에 있어야 의미가 있습니다. 큰 근이 $2$보다 커야 $x=2$ 오른쪽에서 $f^{\prime}<0$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    【1-3】 실수 $t$에 대하여, $x$에 대한 방정식 $f(x)=t\ (0\le x\le3)$의 서로 다른 실근의 개수를 $g(t)$라 하자. 닫힌구간 $[0,3]$에서 함수 $f(x)$의 최솟값을 $c$라 할 때, 두 식

    $$\lim_{t\to\left(-\frac13\right)+}g(t)-\lim_{t\to\left(-\frac13\right)-}g(t)=g\left(-\frac13\right),$$

    $$\lim_{t\to c+}g(t)-\lim_{t\to c-}g(t)>g(c)$$

    를 만족시키는 $k$의 값의 범위는 $\beta<k<\gamma$이다. $\beta$와 $\gamma$의 값을 각각 구하시오. (50점)
  points: 50
  depends_on: ['2']
  answer: {kind: value, value: '6; 8', equivalents: ['β=6, γ=8'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 극솟값은 $f(1)=-\frac13$과 ($k>2$일 때) $f\left(1+\sqrt{k/2}\right)$. ①은 $g\left(-\frac13\right)=2$를 요구하고 이는 $k>6$에서만, ②는 최솟점이 열린구간 안($k<8$)일 때만.
    steps:
    - {id: 3a, content: '$f(1)=-\frac13$, $f(3)=\frac{17}{3}-k$; ①$\iff k>6$, ②$\iff k<8$ → $\beta=6$, $\gamma=8$', criteria: [3.B1, 3.A1, 3.A2]}
    hint_ladder:
    - $y=-\frac13$ 근처의 수평선이 그래프와 몇 번 만나는지 $k$에 따라 분류하자.
    - 최솟값이 끝점 $x=3$에서 생기면 $t\to c+$에서 교점이 몇 개 늘어나는가?
  - id: S3-B
    audience: B
    source_flow: rep2021.pdf p.123~124
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        식 $f^{\prime}(x)$로부터, 함수 $f(x)$의 극솟값은 $k\le2$일 때 $x=1$뿐이고, $k>2$일 때 $x=1$과 $x=1+\sqrt{\dfrac k2}$뿐임을 알 수 있다. 또한, $f(0)=\dfrac{16}{3}$, $f(1)=-\dfrac13$, $f(3)=\dfrac{17}{3}-k$이다.
      criteria: [3.B1]
    - id: 3b-2
      content: |
        함수 $f(x)$는 $x=1$일 때 극솟값을 가지고 $f(1)=-\dfrac13$이므로 $\displaystyle\lim_{t\to(-\frac13)+}g(t)-\lim_{t\to(-\frac13)-}g(t)$의 값은 다음과 같다.
        ▷ $2<k<8$이고 $f\left(1+\sqrt{\dfrac k2}\right)=-\dfrac13$일 때 $4$
        ▷ $f(3)=\dfrac{17}{3}-k=-\dfrac13$일 때(즉, $k=6$일 때) $1$
        ▷ 그 외의 경우 $2$
        $2<k<8$이고 $f\left(1+\sqrt{\dfrac k2}\right)=-\dfrac13$일 때는 $g\left(-\dfrac13\right)=2$이고, $k=6$일 때는 $g\left(-\dfrac13\right)=3$이므로, 이들 경우는 식 ①을 만족시키지 않는다. 따라서 식 ①을 만족시키기 위해서는 $g\left(-\dfrac13\right)=2$이어야만 한다.
        $k<6$인 경우는 $f(3)=\dfrac{17}{3}-k>-\dfrac13$이므로, $g\left(-\dfrac13\right)=2$가 되기 위해서는 $f\left(1+\sqrt{\dfrac k2}\right)=-\dfrac13$이어야만 한다. 그러나 이 경우는 위에서 식 ①을 만족시키지 않음을 보였으므로, $k<6$인 경우는 식 ①을 만족시키지 않는다. $k>6$인 경우는 $f(3)=\dfrac{17}{3}-k<-\dfrac13$이므로, $g\left(-\dfrac13\right)=2$이다. 따라서 식 ①을 만족시키기 위해서는 $k>6$이어야 한다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        또한, $k>6$인 경우 $g(c)=1$이며, $1+\sqrt{\dfrac k2}<3$일 때 $\displaystyle\lim_{t\to c+}g(t)-\lim_{t\to c-}g(t)=2$이고, $1+\sqrt{\dfrac k2}\ge3$일 때 $\displaystyle\lim_{t\to c+}g(t)-\lim_{t\to c-}g(t)=1$이다. 따라서 $k>6$인 경우 식 ②를 만족시키기 위해서는 $k<8$이어야 한다. 종합하면, 두 식 ①, ②를 만족시키는 $k$의 값의 범위는 $6<k<8$이다. 따라서 $\beta=6$, $\gamma=8$이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 10
      evidence: |
        함숫값 $f(1)=-\dfrac13$, $f(3)=\dfrac{17}{3}-k$를 모두 구했다.
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $\beta=6$을 구했다.
      depends_on: [3.B1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        $\gamma=8$을 구했다.
      depends_on: [3.B1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42108}
  misconceptions:
  - id: MC-CAL-42108
    outcome_code: '71'
