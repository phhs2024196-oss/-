intent: |
  미분계수의 정의를 알고 함수의 미분계수를 구할 수 있는지(1-1), 함수의 극값을 활용하여 함수의 그래프의 개형을 그릴 수 있는지(1-2), 도함수를 활용하여 함수의 그래프의 개형을 그릴 수 있고 함수의 최솟값을 구할 수 있는지(1-3) 평가한다.
key_idea: |
  $f^{\prime}(x)=4(x-1)(x-2)^2\ (x<2)$, $4(x-2)\left\{(x-1)^2-\frac k2\right\}\ (x\ge2)$. 극댓값은 $x=2$에서 $f^{\prime}$의 부호가 $+\to-$로 바뀔 때, 즉 $1+\sqrt{k/2}>2$일 때. 1-3은 수평선 $y=t$와 그래프의 교점 개수 $g(t)$의 점프를 $t=-\frac13$($=f(1)$)과 $t=c$(최솟값)에서 비교한다.
stuck: |
  1-3에서 $f(3)=\frac{17}{3}-k$와 극솟값 $f\left(1+\sqrt{\frac k2}\right)$가 $-\frac13$과 어떤 대소 관계인지에 따라 $g$의 점프 크기가 달라지는 경우 분류
