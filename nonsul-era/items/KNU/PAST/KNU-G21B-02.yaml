stimuli:
- label: (가)
  body: |
    $\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$

    $\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$
- label: (나)
  body: |
    두 함수 $f(x),g(x)$가 미분가능하고, $f^{\prime}(x),g^{\prime}(x)$가 닫힌구간 $[a,b]$에서 연속일 때

    $$\int_a^bf(x)g^{\prime}(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf^{\prime}(x)g(x)\,dx$$

    이다.
- label: (다)
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 그 구간의 모든 $x$에 대하여

    (a) $f^{\prime}(x)>0$이면 $f(x)$는 그 구간에서 증가한다.

    (b) $f^{\prime}(x)<0$이면 $f(x)$는 그 구간에서 감소한다.
- label: (라)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면 $f(a)$와 $f(b)$ 사이의 임의의 값 $k$에 대하여

    $$f(c)=k$$

    인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: (마)
  body: |
    수렴하는 두 수열 $\{a_n\}$, $\{b_n\}$에 대하여

    $$\lim_{n\to\infty}a_n=\lim_{n\to\infty}b_n=\alpha\quad(\alpha\text{는 실수})$$

    일 때, 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이면

    $$\lim_{n\to\infty}c_n=\alpha$$

    이다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  곡선 $y=\ln x$와 직선 $y=tx$가 서로 다른 두 점에서 만나도록 하는 실수 $t$의 값의 범위는 $0<t<\beta$이다. 곡선 $y=\ln x$와 직선 $y=tx$가 서로 다른 두 점에서 만날 때, 만나는 두 점을 각각 $\mathrm{P_1},\mathrm{P_2}$라 하고 두 점 $\mathrm{P_1},\mathrm{P_2}$의 $x$좌표를 각각 $a_1,a_2$라 하자. (단, $a_1<a_2$) 이때 곡선 $y=\ln x$ 위의 두 점 $\mathrm{P_1},\mathrm{P_2}$에서의 두 접선이 만나는 점을 $\mathrm R$라 하자.

  $0<t<\beta$일 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【2-1】 $\beta$의 값을 구하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: value, value: 'exp(-1)', equivalents: ['1/e'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 원점을 지나는 접선의 기울기.
    steps:
    - {id: 1a, content: '접점 $(\alpha,\ln\alpha)$에서 $\frac1\alpha=t$, $\ln\alpha=1$ → $\alpha=e$, $\beta=\frac1e$', criteria: [1.A1]}
    hint_ladder:
    - $y=tx$가 $y=\ln x$에 접할 때의 $t$를 구하자.
  - id: S1-B
    audience: B
    source_flow: rep2021.pdf p.128
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직선 $y=tx$와 곡선 $y=\ln x$가 접한다고 하자. 접점을 $(\alpha,t\alpha)=(\alpha,\ln\alpha)$라고 하면 접선의 기울기는 $\dfrac1\alpha=t$이다. 따라서 $\ln\alpha=1$이므로 $\alpha=e$이다. 즉 직선 $y=tx$와 곡선 $y=\ln x$가 두 점에서 만날 $t$의 범위는 $0<t<\dfrac1e$이고 $\beta$는 $\dfrac1e$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        $\beta=\dfrac1e$를 구했다.
      depends_on: []
      steps: [1b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42109}
  misconceptions:
  - id: MC-CAL-42109
    outcome_code: '71'
    wrong_work: '접점의 $x$좌표 $e$를 $\beta$로 답함'
    detect_cue: 답이 $e$이다
    feedback: $\beta$는 접선의 기울기 $t=\frac1\alpha$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    【2-2】 선분 $\mathrm{RP_1}$, 선분 $\mathrm{RP_2}$ 및 곡선 $y=\ln x$로 둘러싸인 부분의 넓이를 $S_t$라 하고 $\angle\mathrm{P_1RP_2}$를 $\theta_t$라 하자. 다음 물음에 답하시오.

    (1) $|\tan\theta_t|$를 $a_1$과 $a_2$로 나타내면 $\dfrac{a_2-a_1}{k+\ell a_1a_2}$이다. $k+\ell$의 값을 구하시오. (단, $k,\ell$은 실수) (20점)

    (2) $S_t$를 $a_1,a_2,t$로 나타내면 $\dfrac12(a_2-a_1)(m+nt^2a_1a_2)$이다. $m\times n$의 값을 구하시오. (단, $m,n$은 실수) (25점)
  points: 45
  depends_on: ['1']
  answer: {kind: value, value: '2; -1', equivalents: ['(1) k+ℓ=2 (2) m×n=-1'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 접선 기울기 $\frac{1}{a_1}$, $\frac{1}{a_2}$의 각으로 탄젠트 덧셈정리, 넓이는 두 접선 아래 넓이에서 $\int\ln x$를 뺀다.
    steps:
    - {id: 2a, content: '$|\tan\theta_t|=\frac{a_2-a_1}{1+a_1a_2}$, $S_t=\frac12(a_2-a_1)(1-t^2a_1a_2)$ → $k+\ell=2$, $m\times n=-1$', criteria: [2.M1, 2.M2, 2.M3, 2.A1, 2.M4, 2.M5, 2.A2]}
    hint_ladder:
    - $\ln a_i=ta_i$를 써서 접선의 $y$절편을 정리하자.
  - id: S2-B
    audience: B
    source_flow: rep2021.pdf p.128~129
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1) 직선 $y=tx$와 곡선 $y=\ln x$가 만나는 두 점은 각각 $(a_1,ta_1)=(a_1,\ln a_1)$, $(a_2,ta_2)=(a_2,\ln a_2)$이다. $\mathrm{P_1}$에서 접하는 접선의 방정식은 $y=\dfrac{1}{a_1}x+ta_1-1$이고 $\mathrm{P_2}$에서 접하는 접선의 방정식은 $y=\dfrac{1}{a_2}x+ta_2-1$이기 때문에 두 접선이 만나는 점 $\mathrm R$의 좌표는 $(ta_1a_2,\ t(a_1+a_2)-1)$이다. 점 $\mathrm{Q_1}(ta_1a_2,ta_1)$과 점 $\mathrm{Q_2}(a_2,t(a_1+a_2)-1)$에 대하여 $\theta_1=\angle\mathrm{P_1RQ_1}$, $\theta_2=\angle\mathrm{P_2RQ_2}$라 두면 $\tan\theta_t=\tan\left(\theta_1+\theta_2+\dfrac{\pi}{2}\right)$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        그러면 $\tan\theta_1=a_1$이고
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $\tan\theta_2=\dfrac{1}{a_2}$이다.
      criteria: [2.M3]
    - id: 2b-4
      content: |
        따라서 $|\tan\theta_t|=\left|\dfrac{\tan\theta_1\tan\theta_2-1}{\tan\theta_1+\tan\theta_2}\right|=\dfrac{a_2-a_1}{1+a_1a_2}$이므로 $k=1$, $\ell=1$이고 $k+\ell=2$이다.
      criteria: [2.A1]
    - id: 2b-5
      content: |
        (2) 접선의 방정식이 각각 $y=\dfrac{1}{a_1}x+ta_1-1$, $y=\dfrac{1}{a_2}x+ta_2-1$이고 두 접선이 만나는 점 $\mathrm R$의 좌표는 $(ta_1a_2,\ t(a_1+a_2)-1)$이므로
      criteria: [2.M4]
    - id: 2b-6
      content: |
        $S_t=\displaystyle\int_{a_1}^{ta_1a_2}\left(\frac{1}{a_1}x+ta_1-1\right)dx+\int_{ta_1a_2}^{a_2}\left(\frac{1}{a_2}x+ta_2-1\right)dx-\int_{a_1}^{a_2}\ln x\,dx$
      criteria: [2.M5]
    - id: 2b-7
      content: |
        $=\dfrac12(a_2-a_1)(1-t^2a_1a_2)$이다. 따라서 $m=1$, $n=-1$이므로 $m\times n=-1$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        (1) $\tan\theta_t=\tan\left(\theta_1+\theta_2+\dfrac{\pi}{2}\right)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: |
        (1) $\tan\theta_1=a_1$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.M3
      mark_type: M
      points: 5
      evidence: |
        (1) $\tan\theta_2=\dfrac{1}{a_2}$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        (1) $k+\ell=2$를 구했다.
      depends_on: [2.M1, 2.M2, 2.M3]
      steps: [2b-4]
    - id: 2.M4
      mark_type: M
      points: 5
      evidence: |
        (2) 접선의 방정식이 각각 $y=\dfrac{1}{a_1}x+ta_1-1$, $y=\dfrac{1}{a_2}x+ta_2-1$임을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-5]
    - id: 2.M5
      mark_type: M
      points: 5
      evidence: |
        (2) $S_t$를 세 정적분의 합·차로 나타냈다.
      depends_on: [2.M4]
      steps: [2b-6]
    - id: 2.A2
      mark_type: A
      points: 15
      evidence: |
        (2) $m\times n=-1$을 구했다.
      depends_on: [2.M5]
      steps: [2b-7]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42110}
  misconceptions:
  - id: MC-CAL-42110
    outcome_code: '71'
    wrong_work: '$\theta_t$를 두 접선의 기울기 각의 차로 보아 $|\tan\theta_t|=\left|\frac{\frac1{a_1}-\frac1{a_2}}{1+\frac{1}{a_1a_2}}\right|$로 쓰고 분모를 $1+a_1a_2$로 정리하지 못함'
    detect_cue: $k,\ell$을 $a_1,a_2$에 대한 식으로 남겼다
    feedback: $\frac{\frac{a_2-a_1}{a_1a_2}}{\frac{a_1a_2+1}{a_1a_2}}=\frac{a_2-a_1}{1+a_1a_2}$로 분모·분자에 $a_1a_2$를 곱해 정리하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    【2-3】 (1) $t^{-1}<a_2<t^{-\frac53}$임을 증명하시오. (단, $e=2.718\cdots$) (35점)

    (2) 점 $\mathrm R$의 $x$좌표 $x_t$와 【2-2】에서 구한 $S_t,\theta_t$에 대하여

    $$\lim_{t\to0+}\frac{x_t|\tan\theta_t|}{tS_t}$$

    의 값을 구하시오. (25점)
  points: 60
  depends_on: ['2']
  answer: {kind: value, value: '2', equivalents: ['(1) 증명 (2) 2'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f(x)=\ln x-tx$는 $x=\frac1t$에서 최대(양수), $f(t^{-5/3})<0$이므로 사잇값 정리로 $a_2\in(t^{-1},t^{-5/3})$. 비는 $\frac{2a_1a_2}{(1+a_1a_2)(1-t^2a_1a_2)}\to2$.
    steps:
    - {id: 3a, content: '(1) $f(t^{-1})=-\ln t-1>0$, $f(t^{-5/3})=-t^{-2/3}\left(\frac53t^{2/3}\ln t+1\right)<0$ (2) $t^{-1}<a_1a_2<et^{-5/3}$이므로 극한 $2$', criteria: [3.M1, 3.M2, 3.A1, 3.M3, 3.M4, 3.A2]}
    hint_ladder:
    - $f(x)=\ln x-tx$의 최댓점과 그 오른쪽 한 점에서의 부호를 비교하자.
    - $\frac53s^{2/3}\ln s+1$의 최솟값은?
  - id: S3-B
    audience: B
    source_flow: rep2021.pdf p.129
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1) 함수 $f(x)=\ln x-tx$를 미분하면 $f^{\prime}(x)=\dfrac1x-t$이기 때문에 $f$는 $x=\dfrac1t$에서 최댓값을 갖고 이때 함숫값은 $f(t^{-1})=-\ln t-1>0$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $t^{-1}<t^{-\frac53}$이고 $f\left(t^{-\frac53}\right)=-t^{-\frac23}\left(\dfrac53t^{\frac23}\ln t+1\right)$이다. $g(s)=\dfrac53s^{\frac23}\ln s+1$이라 두면 $g^{\prime}(s)=\dfrac53s^{-\frac13}\left(\dfrac23\ln s+1\right)$이기 때문에 $s=e^{-\frac32}$에서 최솟값을 갖는다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        $g\left(e^{-\frac32}\right)=-\dfrac{5}{2e}+1>0$이기 때문에 모든 $s>0$에 대하여 $g(s)>0$이다. 즉 $f\left(t^{-\frac53}\right)<0$이고 사잇값 정리에 의해 $t^{-1}<a_2<t^{-\frac53}$이다.
      criteria: [3.A1]
    - id: 3b-4
      content: |
        (2) 함수 $f(x)=\ln x-tx$는 $a_1$과 $a_2$에서 근을 갖고 $1<a_1<e$이다. 【2-2】의 (1), (2)에 의해 $\dfrac{x_t|\tan\theta_t|}{tS_t}=\dfrac{2a_1a_2}{(1-t^2a_1a_2)(1+a_1a_2)}$이다.
      criteria: [3.M3]
    - id: 3b-5
      content: |
        $1<a_1<e$이고 $t^{-1}<a_2<t^{-\frac53}$이기 때문에 $t^{-1}<a_1a_2<et^{-\frac53}$이다.
      criteria: [3.M4]
    - id: 3b-6
      content: |
        즉 $\displaystyle\lim_{t\to0+}t^2a_1a_2=0$이고 $\displaystyle\lim_{t\to0+}a_1a_2=\infty$이므로 $\displaystyle\lim_{t\to0+}\frac{x_t|\tan\theta_t|}{tS_t}=2$이다.
      criteria: [3.A2]
