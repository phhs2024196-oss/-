intent: |
  접선의 방정식을 이해하고 구할 수 있는지(2-1), 삼각함수의 덧셈정리를 활용하고 정적분을 이용하여 그래프로 둘러싸인 부분의 넓이를 구할 수 있는지(2-2), 사잇값 정리를 이용하여 방정식의 근을 근사하고 극한의 대소관계를 이용하여 함수의 극한을 구할 수 있는지(2-3) 평가한다.
key_idea: |
  교점 조건 $\ln a_i=ta_i$를 이용하면 두 접선은 $y=\frac{1}{a_i}x+ta_i-1$이고 교점 $\mathrm R=(ta_1a_2,\ t(a_1+a_2)-1)$. 접선의 기울기 각으로 $|\tan\theta_t|=\frac{a_2-a_1}{1+a_1a_2}$, 넓이 $S_t=\frac12(a_2-a_1)(1-t^2a_1a_2)$. 극한은 $t^{-1}<a_2<t^{-5/3}$으로 $a_1a_2$를 조여 $t^2a_1a_2\to0$, $a_1a_2\to\infty$.
stuck: |
  2-3(1)에서 상한 $t^{-5/3}$에서의 부호 $f(t^{-5/3})<0$을 보조함수 $\frac53s^{2/3}\ln s+1>0$으로 보이는 단계
