stimuli:
- label: (가)
  body: |
    임의의 세 실수 $a,b,c$를 포함하는 구간에서 연속인 함수 $f(x)$에 대하여

    $$\int_a^bf(x)\,dx=\int_a^cf(x)\,dx+\int_c^bf(x)\,dx$$

    이다.
- label: (나)
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g^{\prime}(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때, $\alpha,\beta$를 포함하는 구간에서 연속이면

    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g^{\prime}(t)\,dt$$

    이다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  $x\ge0$에서 연속인 함수 $f(x)$가 $x>0$에서 미분가능하고, 음이 아닌 모든 실수 $a,b$에 대하여 다음 조건 (Ⅰ)을 만족시킨다.

  (Ⅰ): $m\ge0$, $n\ge0$, $m+n>0$인 모든 실수 $m,n$에 대하여

  $$f\left(\frac{mb+na}{m+n}\right)\ \le\ \frac{mf(b)+nf(a)}{m+n}$$

  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【3-1】 (1) $0\le a\le x\le b$일 때

    $$f(x)\le\frac{x-a}{b-a}f(b)+\frac{b-x}{b-a}f(a)$$

    임을 증명하시오. (단, $a<b$) (15점)

    (2) 양의 상수 $L$에 대하여 $t\ge L$일 때

    $$f(t)\le\frac{1}{2L}\int_{t-L}^{t+L}f(x)\,dx\le\frac14\{f(t-L)+f(t+L)+2f(t)\}$$

    임을 증명하시오. (40점)
  points: 55
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (1) $n=\frac{b-x}{b-a}$, $m=\frac{x-a}{b-a}$. (2) 상한은 (1)을 두 구간에서 적분, 하한은 $m=n=1$인 중점 부등식을 적분 후 치환.
    steps:
    - {id: 1a, content: '(1) $\frac{mb+na}{m+n}=x$이므로 (Ⅰ)이 곧 부등식. (2) $\int_{t-L}^{t}f\le\frac L2\{f(t)+f(t-L)\}$, $\int_t^{t+L}f\le\frac L2\{f(t+L)+f(t)\}$; $f(t)\le\frac12\{f(t-x)+f(t+x)\}$를 $[0,L]$에서 적분', criteria: [1.M1, 1.M2, 1.A1, 1.A2, 1.A3]}
    hint_ladder:
    - $x=\frac{mb+na}{m+n}$이 되는 $m,n$을 찾자.
    - $a=t-x$, $b=t+x$, $m=n=1$이면 (Ⅰ)은 무엇을 말하는가?
  - id: S1-B
    audience: B
    source_flow: rep2021.pdf p.134
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (1) $0\le a\le x\le b$이므로 $n=\dfrac{b-x}{b-a}$,
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $m=\dfrac{x-a}{b-a}$로 두면
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $m\ge0$, $n\ge0$, $m+n=1>0$이다. 조건 (Ⅰ)로부터 $f(x)\le\dfrac{b-x}{b-a}f(a)+\dfrac{x-a}{b-a}f(b)$이다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        (2) $t-L\le x\le t$에 대하여, $a=t-L$, $b=t$, $n=\dfrac{b-x}{b-a}$, $m=\dfrac{x-a}{b-a}$로 두면 【3-1】(1)의 결과로부터 $f(x)\le\left\{\dfrac{b-x}{b-a}f(a)+\dfrac{x-a}{b-a}f(b)\right\}$이므로 $\displaystyle\int_{t-L}^{t}f(x)\,dx\le\int_{t-L}^{t}\left\{\frac{b-x}{b-a}f(a)+\frac{x-a}{b-a}f(b)\right\}dx$이다. 즉, $\displaystyle\int_{t-L}^{t}f(x)\,dx\le\frac L2\{f(t)+f(t-L)\}$이다. 한편, $t\le x\le t+L$에 대하여 $a=t$, $b=t+L$, $n=\dfrac{b-x}{b-a}$, $m=\dfrac{x-a}{b-a}$로 두면 $\displaystyle\int_t^{t+L}f(x)\,dx\le\frac L2\{f(t+L)+f(t)\}$이다. 따라서 $\displaystyle\frac{1}{2L}\int_{t-L}^{t+L}f(x)\,dx\le\frac14\{f(t-L)+f(t+L)+2f(t)\}$이다.
      criteria: [1.A2]
    - id: 1b-5
      content: |
        $0\le x\le L$인 실수 $x$에 대하여 조건 (Ⅰ)로부터 $f(t)\le\dfrac12\{f(t-x)+f(t+x)\}$이므로 $f(t)=\displaystyle\frac1L\int_0^Lf(t)\,dx\le\frac{1}{2L}\int_0^L\{f(t-x)+f(t+x)\}\,dx$이고 치환적분을 이용하면 $\displaystyle\frac{1}{2L}\int_0^L\{f(t-x)+f(t+x)\}\,dx=\frac{1}{2L}\int_{t-L}^{t+L}f(x)\,dx$이다.
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        (1) $n=\dfrac{b-x}{b-a}$ 또는 그의 양의 상수배 $n=k(b-x)$로 두었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        (1) $m=\dfrac{x-a}{b-a}$ 또는 그의 양의 상수배 $m=k(x-a)$로 두었다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        (1) $m\ge0$, $n\ge0$을 확인하였다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 20
      evidence: |
        (2) $\dfrac{1}{2L}\displaystyle\int_{t-L}^{t+L}f(x)\,dx\le\dfrac14\{f(t-L)+f(t+L)+2f(t)\}$의 증명이 올바르다.
      depends_on: []
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 20
      evidence: |
        (2) $f(t)\le\dfrac{1}{2L}\displaystyle\int_{t-L}^{t+L}f(x)\,dx$의 증명이 올바르다.
      depends_on: []
      steps: [1b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42112}
  misconceptions:
  - id: MC-CAL-42112
    outcome_code: '71'
    wrong_work: '$m,n$을 $m=b-x$, $n=x-a$로 바꿔 넣어 $\frac{mb+na}{m+n}\ne x$인 식을 씀'
    detect_cue: 대입 후 좌변의 인자가 $x$가 아닌 $a+b-x$이다
    feedback: $\frac{mb+na}{m+n}=x$가 되려면 $b$의 가중치 $m$은 $x-a$에 비례해야 합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    【3-2】 (1) 다음은 함수 $h(x)=\dfrac{1}{1+(1+x)^2}$이 음이 아닌 모든 실수 $a,b$에 대하여 조건 (Ⅰ)을 만족시키는 것을 보이는 과정이다.

    > $m\ge0$, $n\ge0$, $m+n>0$인 실수 $m,n$에 대하여 $\dfrac{n}{m+n}=s$로 두면 $0\le s\le1$이다.
    >
    > $$p(s)=sh(a)+(1-s)h(b)-h(sa+(1-s)b)$$
    >
    > 라 하면, $p(0)=\boxed{(\text{ㄱ})}$이고 $p(1)=\boxed{(\text{ㄴ})}$이다. 또한
    >
    > $$p(s)=\frac{s}{1+(1+a)^2}+\frac{1-s}{1+(1+b)^2}-\frac{1}{1+\{1+sa+(1-s)b\}^2}$$
    >
    > 이므로 $1+a=A$, $1+b=B$로 두면
    >
    > $$p(s)=\frac{s}{1+A^2}+\frac{1-s}{1+B^2}-\frac{1}{1+\{sA+(1+\boxed{(\text{ㄷ})}\times s)B\}^2}$$
    >
    > 이다.
    >
    > $$q(s)=p(s)\times(1+A^2)(1+B^2)\left[1+\{sA+(1+\boxed{(\text{ㄷ})}\times s)B\}^2\right]$$
    >
    > 이라 하면, $q(s)$는 $s$에 대한 다항식이다. $q(s)$를 인수분해하여 정리하면
    >
    > $$q(s)=(B-A)^2s(1-s)\{sA^2+(1-s)B^2+2AB-1\}$$
    >
    > 이다. $A\ge1$, $B\ge1$이므로, $q(s)\ge0$이고 $p(s)\ge0$이다.

    위의 (ㄱ), (ㄴ), (ㄷ)에 알맞은 값을 각각 구하시오. (15점)

    (2) $\dfrac{\ell}{25}\le\displaystyle\int_0^2\frac{1}{1+(1+x)^2}\,dx<\frac{\ell+1}{25}$을 만족시키는 자연수 $\ell$의 값을 구하시오. (30점)
  points: 45
  depends_on: ['1']
  answer: {kind: value, value: '0; 0; -1; 11', equivalents: ['(1) (ㄱ)=0, (ㄴ)=0, (ㄷ)=-1 (2) ℓ=11'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (1) 끝값 대입과 $1+sa+(1-s)b=sA+(1-s)B$. (2) 3-1(2)를 $t=\frac12,\frac32$, $L=\frac12$로 적용.
    steps:
    - {id: 2a, content: '(1) $0,0,-1$ (2) $\frac{11}{25}\le h(\frac12)+h(\frac32)\le\int_0^2h\le\frac14\{h(0)+2h(\frac12)+2h(1)+2h(\frac32)+h(2)\}<\frac{12}{25}$, $\ell=11$', criteria: [2.B1, 2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - $[0,2]$를 $[0,1]$, $[1,2]$로 나누어 3-1(2)를 $L=\frac12$로 쓰자.
  - id: S2-B
    audience: B
    source_flow: rep2021.pdf p.134
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1) (ㄱ)$=0$, (ㄴ)$=0$, (ㄷ)$=-1$
      criteria: [2.B1]
    - id: 2b-2
      content: |
        (2) $\displaystyle\int_0^2\frac{1}{1+(1+x)^2}dx=\int_0^1\frac{1}{1+(1+x)^2}dx+\int_1^2\frac{1}{1+(1+x)^2}dx$이다. $h\left(\dfrac12\right)\le\displaystyle\int_0^1\frac{1}{1+(1+x)^2}dx\le\frac14\left\{h(0)+h(1)+2h\left(\frac12\right)\right\}$이고, $h\left(\dfrac32\right)\le\displaystyle\int_1^2\frac{1}{1+(1+x)^2}dx\le\frac14\left\{h(1)+h(2)+2h\left(\frac32\right)\right\}$이므로
      criteria: [2.M1, 2.M2]
    # [공식해설 확인필요] 예시답안 원문은 마지막 줄을 "따라서 m=11이다"로 적음(ℓ의 오기로 보임). 값은 같음.
    - id: 2b-3
      content: |
        $\dfrac{11}{25}\le h\left(\dfrac12\right)+h\left(\dfrac32\right)\le\displaystyle\int_0^2\frac{1}{1+(1+x)^2}dx\le\frac14\left\{h(0)+2h\left(\frac12\right)+2h(1)+2h\left(\frac32\right)+h(2)\right\}<\frac{12}{25}$이다. 따라서 $\ell=11$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 15
      evidence: |
        (1) (ㄱ)$=0$, (ㄴ)$=0$, (ㄷ)$=-1$이 맞으면 각 5점.
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        (2) $\displaystyle\int_0^2\frac{1}{1+(1+x)^2}dx<B_1$인 $B_1$을 $\dfrac{12}{25}$보다 작거나 같게 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 10
      evidence: |
        (2) $\displaystyle\int_0^2\frac{1}{1+(1+x)^2}dx\ge B_2$인 $B_2$를 $\dfrac{11}{25}$보다 크거나 같게 구했다.
      depends_on: []
