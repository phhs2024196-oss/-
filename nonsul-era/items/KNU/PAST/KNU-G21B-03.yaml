    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42113}
  misconceptions:
  - id: MC-CAL-42113
    outcome_code: '71'
    wrong_work: '3-1(2)를 $[0,2]$ 전체에 한 번($t=1$, $L=1$)만 적용해 하한 $2h(1)=\frac{2}{5}$, 상한 $\frac{1}{2}\{\frac12+\frac1{10}+\frac25\}=\frac{1}{2}$의 넓은 범위로 $\ell$을 결정하지 못함'
    detect_cue: 상한과 하한 사이에 $\frac{1}{25}$ 간격의 경계가 두 개 이상 있다
    feedback: 구간을 $[0,1]$, $[1,2]$로 나누어 각각 적용하면 오차가 줄어 $\frac{11}{25}$과 $\frac{12}{25}$ 사이로 좁혀집니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    【3-3】 두 양수 $L,t$에 대하여 수열 $\{c_k\}$의 일반항이

    $$c_k=\frac{2^{k-1}}{L}\int_{t-\frac{L}{2^k}}^{t+\frac{L}{2^k}}f(x)\,dx$$

