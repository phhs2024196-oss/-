intent: |
  주어진 조건을 만족하는 함수(아래로 볼록한 함수)의 성질을 파악하여 정적분에 활용할 수 있는지, 치환적분법을 활용하여 정적분과 관련된 명제를 증명할 수 있는지를 평가한다.
key_idea: |
  조건 (Ⅰ)은 볼록성: 현이 그래프 위에 있다($f(x)\le\frac{x-a}{b-a}f(b)+\frac{b-x}{b-a}f(a)$)와 중점 부등식 $f(t)\le\frac12\{f(t-x)+f(t+x)\}$. 현 아래 적분 = 사다리꼴 공식 상한, 중점 부등식 적분 = 평균값 하한. 3-2는 $h(x)=\frac{1}{1+(1+x)^2}$이 (Ⅰ)을 만족함을 보이고 $[0,1],[1,2]$에서 상·하한을 계산, 3-3은 중점 부등식을 길이 반으로 줄여 적용.
stuck: |
  3-1(2)의 왼쪽 부등식에서 $m=n=1$로 둔 중점 부등식을 $x\in[0,L]$에 대해 적분하고 치환으로 $\frac{1}{2L}\int_{t-L}^{t+L}f$로 바꾸는 단계
idea_tags: [IDEA-CONVEXITY-TRAPEZOID-MIDPOINT-BOUNDS, IDEA-INTEGRAL-SQUEEZE-ESTIMATE]
tags: [볼록함수, 정적분의 부등식, 치환적분, 사다리꼴 근사, 중점 근사, 정적분의 근삿값]
elements:
  materials:
  - '조건 (Ⅰ): $m,n\ge0$, $m+n>0$이면 $f\left(\frac{mb+na}{m+n}\right)\le\frac{mf(b)+nf(a)}{m+n}$'
  - '$h(x)=\frac{1}{1+(1+x)^2}$, $p(s)=sh(a)+(1-s)h(b)-h(sa+(1-s)b)$, $q(s)=(B-A)^2s(1-s)\{sA^2+(1-s)B^2+2AB-1\}$'
  - '$\int_0^2\frac{1}{1+(1+x)^2}dx$의 자연수 범위 $\ell$'
  - '$c_k=\frac{2^{k-1}}{L}\int_{t-L/2^k}^{t+L/2^k}f(x)dx$ (구간 평균값) 수열의 단조성'
  concepts:
  - '정적분의 구간 분할(제시문 (가))'
  - '치환적분(제시문 (나))'
  - '볼록함수의 현과 중점 부등식'
  tools:
  - '$n=\frac{b-x}{b-a}$, $m=\frac{x-a}{b-a}$ 대입'
  - '정적분의 대소: $\int_{t-L}^tf\le\frac L2\{f(t)+f(t-L)\}$'
  - '$x\mapsto t\pm x$ 치환으로 $\int_0^L\{f(t-x)+f(t+x)\}dx=\int_{t-L}^{t+L}f$'
  - '$h(\frac12)+h(\frac32)=\frac{4}{13}+\frac{4}{29}$, 사다리꼴 합 상한 $<\frac{12}{25}$'
  conditions:
  - '$x\ge0$에서 연속, $x>0$에서 미분가능'
  - '$t\ge L$(3-1(2)), $t\ge\frac L2$(3-3)'
  - '$A=1+a\ge1$, $B=1+b\ge1$'
  stimuli_used: ['(가)', '(나)']
  subpart_links: '3-2(2)는 3-1(2)의 부등식을 $h$에 적용, 3-3은 3-1의 중점 부등식을 사용'

