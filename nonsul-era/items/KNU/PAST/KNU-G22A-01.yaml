intent: |
  이차함수의 그래프와 직선의 위치 관계를 이해하고 이차방정식이 해를 가지지 않을 조건을 구할 수 있는지(1-1), 점과 직선의 거리를 구할 수 있는지(1-2), 직선과 곡선으로 둘러싸인 부분의 넓이를 구할 수 있는지(1-3) 평가한다.
key_idea: |
  접선 $\ell_c:y=2cx-c^2$이 $y=-x^2+4x-3$과 만나지 않을 조건은 판별식 $<0$이고, 곡선 위 점과 $\ell_c$ 사이 거리의 최솟값은 기울기 $2c$인 접점 $(2-c,-c^2+1)$에서 생긴다. 접선들이 지나는 점의 집합은 $y=x^2$ 아래, 양 끝 접선 $\ell_\alpha$, $\ell_\beta$ 중 낮은 쪽 위의 영역이다.
stuck: |
  1-3에서 「접선 $\ell_c$($\alpha\le c\le\beta$)가 지나는 모든 점」을 고정된 $x$에서 $2cx-c^2$의 $c$에 대한 최대·최소로 바꿔 영역을 그리는 단계
