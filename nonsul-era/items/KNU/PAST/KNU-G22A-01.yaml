stimuli:
- label: (가)
  body: |
    점 $(x_1,y_1)$과 직선 $ax+by+c=0$ 사이의 거리 $d$는
    $$d=\dfrac{|ax_1+by_1+c|}{\sqrt{a^2+b^2}}$$
- label: (나)
  body: |
    곡선 $y=f(x)$와 직선 $\ell$ 사이의 거리는 곡선 $y=f(x)$ 위의 임의의 점과 직선 $\ell$ 사이의 거리 중 최솟값이다.
- label: (다)
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: (라)
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$와 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b|f(x)-g(x)|dx$$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  모든 실수 $c$에 대하여 곡선 $y=x^2$ 위의 점 $(c,c^2)$에서의 접선을 $\ell_c$라 하자. 직선 $\ell_c$와 곡선 $y=-x^2+4x-3$이 만나지 않도록 하는 모든 실수 $c$의 값의 범위는 $\alpha<c<\beta$이다.

subparts:
- id: '1-1'
  stem: |
    $\alpha$와 $\beta$의 값을 각각 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: value, value: '(2 - sqrt(2))/2; (2 + sqrt(2))/2', equivalents: ['α=(2-√2)/2, β=(2+√2)/2'], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: $2cx-c^2=-x^2+4x-3$이 실근을 갖지 않을 조건(판별식 $<0$)
    steps:
    - {id: 1-1a, content: '$x^2+(2c-4)x+(3-c^2)=0$에서 $D/4=(c-2)^2-(3-c^2)=2c^2-4c+1<0$, $\tfrac{2-\sqrt2}{2}<c<\tfrac{2+\sqrt2}{2}$', criteria: [1-1.M1, 1-1.M2, 1-1.A1]}
    hint_ladder:
    - 접선의 방정식을 먼저 $c$로 나타내 보자.
    - 직선과 포물선이 만나지 않는다는 것을 이차방정식의 언어로 바꾸면?
  - id: S1-1-B
    audience: B
    source_flow: rep2022.pdf p.80(인쇄 76)
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        곡선 $y=x^2$ 위의 점 $(c,c^2)$에서의 접선의 방정식은 $y=2cx-c^2$이다.
      criteria: [1-1.M1]
    - id: 1-1b-2
      content: |
        직선 $y=2cx-c^2$과 곡선 $y=-x^2+4x-3$이 만나지 않을 조건은 이차방정식 $2cx-c^2=-x^2+4x-3$의 해가 존재하지 않을 조건과 같다. $\dfrac D4=(c-2)^2-(-c^2+3)<0$.
      criteria: [1-1.M2]
    - id: 1-1b-3
      content: |
        $2c^2-4c+1<0$이므로 $\alpha=\dfrac{2-\sqrt2}{2}<c<\dfrac{2+\sqrt2}{2}=\beta$이다.
      criteria: [1-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 10
      evidence: 곡선 $y=x^2$ 위의 점 $(c,c^2)$에서의 접선의 방정식 $y=2cx-c^2$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.M2
      mark_type: M
      points: 10
      evidence: $\dfrac D4=(c-2)^2-(-c^2+3)<0$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-2]
    - id: 1-1.A1
      mark_type: A
      points: 10
      evidence: $\alpha=\dfrac{2-\sqrt2}{2}$, $\beta=\dfrac{2+\sqrt2}{2}$를 구했다.
      depends_on: [1-1.M2]
      cao: true
      steps: [1-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42201}
  misconceptions:
  - id: MC-ALG-42201
    outcome_code: '71'
    wrong_work: '$D/4=(c-2)^2-(c^2+3)$처럼 상수항 부호를 틀려 $c>\tfrac{1}{4}$ 등 일차부등식으로 답함'
    detect_cue: '판별식에서 $c^2$이 소거되어 일차부등식이 나옴'
    feedback: 이항한 뒤 $x^2+(2c-4)x+(3-c^2)=0$의 상수항이 $3-c^2$임을 확인하세요.
    remedy: [RL-1]

- id: '1-2'
  stem: |
    $\alpha<c<\beta$인 실수 $c$에 대하여 곡선 $y=-x^2+4x-3$과 직선 $\ell_c$ 사이의 거리를 $f(c)$라 할 때, $f(c)$를 구하시오. (30점)
  points: 30
  depends_on: ['1-1']
  answer: {kind: expression, value: '(-2*c**2 + 4*c - 1)/sqrt(4*c**2 + 1)', equivalents: ['f(c)=(-2c^2+4c-1)/√(4c^2+1)'], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: 최소 거리는 곡선의 접선 기울기가 $2c$인 점 $(2-c,-c^2+1)$에서 생긴다.
    steps:
    - {id: 1-2a, content: '$-2b+4=2c\Rightarrow b=2-c$, $f(c)=\dfrac{|2c(2-c)-(-c^2+1)-c^2|}{\sqrt{4c^2+1}}=\dfrac{-2c^2+4c-1}{\sqrt{4c^2+1}}$', criteria: [1-2.M1, 1-2.A1]}
    hint_ladder:
    - 곡선 위의 점 $(b,-b^2+4b-3)$과 $\ell_c$ 사이의 거리를 $b$의 함수로 써 보자.
    - 그 거리가 최소가 되는 점에서 곡선의 접선은 $\ell_c$와 어떤 관계인가?
  - id: S1-2-B
    audience: B
    source_flow: rep2022.pdf p.81(인쇄 77)
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        곡선 $y=-x^2+4x-3$ 위의 점 $(b,-b^2+4b-3)$에서 접선 $y=2cx-c^2$까지의 거리 중 최솟값은 점 $(b,-b^2+4b-3)$에서의 접선의 기울기가 $2c$일 때이므로 $-2b+4=2c$이고 $b=2-c$이다. $(b,-b^2+4b-3)=(2-c,-c^2+1)$.
      criteria: [1-2.M1]
    - id: 1-2b-2
      content: |
        제시문 (가)에 의해 $f(c)=\dfrac{|2c(2-c)-(-c^2+1)-c^2|}{\sqrt{4c^2+1}}=\dfrac{|-2c^2+4c-1|}{\sqrt{4c^2+1}}$이고 $\alpha<c<\beta$에서 $-2c^2+4c-1>0$이므로 $f(c)=\dfrac{-2c^2+4c-1}{\sqrt{4c^2+1}}$이다.
      criteria: [1-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 15
      evidence: $(b,-b^2+4b-3)=(2-c,-c^2+1)$일 때 최솟값을 가진다는 것을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-1]
    - id: 1-2.A1
      mark_type: A
      points: 15
      evidence: $f(c)=\dfrac{-2c^2+4c-1}{\sqrt{4c^2+1}}$을 구했다.
      depends_on: [1-2.M1]
      cao: true
      steps: [1-2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42201}
  misconceptions:
  - id: MC-GEO-42201
    outcome_code: '71'
    wrong_work: '절댓값을 풀 때 부호를 확인하지 않아 $f(c)=\dfrac{2c^2-4c+1}{\sqrt{4c^2+1}}$(음수)로 답함'
    detect_cue: 답의 분자가 $2c^2-4c+1$
    feedback: $\alpha<c<\beta$에서 $2c^2-4c+1<0$입니다. 거리는 항상 양수가 되도록 부호를 정리하세요.
    remedy: [RL-2]

- id: '1-3'
  stem: |
    두 곡선 $y=x^2$, $y=-x^2+4x-3$과 두 직선 $x=\alpha$, $x=\beta$로 둘러싸인 영역 중 곡선 $y=x^2$ 위를 움직이는 점 $(c,c^2)$ $(\alpha\le c\le\beta)$에서의 접선 $\ell_c$가 지나는 모든 점의 집합을 $S$라 하자. 집합 $S$가 나타내는 도형의 넓이를 구하시오. (50점)
  points: 50
  depends_on: ['1-1']
  answer: {kind: value, value: '7*sqrt(2)/6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: 고정된 $x\in[\alpha,\beta]$에서 $2cx-c^2$은 $c=x$일 때 최대 $x^2$, 최소는 $\min(\ell_\alpha(x),\ell_\beta(x))$. $S$는 $y=x^2$과 두 끝 접선 사이의 영역.
    steps:
    - {id: 1-3a, content: '넓이 $=\int_\alpha^{\frac{\alpha+\beta}2}(x-\beta)^2dx+\int_{\frac{\alpha+\beta}2}^\beta(x-\alpha)^2dx=\tfrac{7}{12}(\beta-\alpha)^3=\tfrac76\sqrt2$', criteria: [1-3.M1, 1-3.M2, 1-3.A1]}
    hint_ladder:
    - 세로선 $x=t$ 위에서 접선들이 지나는 $y$값의 범위를 구해 보자.
    - $c\mapsto 2ct-c^2$은 $c$에 대한 이차함수이다.
  - id: S1-3-B
    audience: B
    source_flow: rep2022.pdf p.81(인쇄 77)
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        $S$가 나타내는 도형은 곡선 $y=x^2$과 양 끝 접선 $\ell_\alpha$, $\ell_\beta$, 직선 $x=\alpha$, $x=\beta$로 둘러싸인 부분이다(공식 해설 [그림 1]).
      criteria: [1-3.M1]
      # [그림: 공식 해설 그림 1 — y=x^2 와 y=-x^2+4x-3, x=α, x=β 사이에서 접선 ℓ_α, ℓ_β 와 y=x^2 사이 영역을 음영]
    - id: 1-3b-2
      content: |
        따라서 넓이 $A$는
        $$A=\int_\alpha^\beta\{x^2-(2\beta x-\beta^2)\}dx+\dfrac14(\beta-\alpha)^3$$
      criteria: [1-3.M2]
    - id: 1-3b-3
      content: |
        $$A=\int_\alpha^\beta(x-\beta)^2dx+\dfrac14(\beta-\alpha)^3=-\dfrac13(\alpha-\beta)^3+\dfrac14(\beta-\alpha)^3=\dfrac76\sqrt2.$$
      criteria: [1-3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 20
      evidence: $S$가 나타내는 도형을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-3b-1]
    - id: 1-3.M2
      mark_type: M
      points: 20
      evidence: 넓이가 $\displaystyle\int_\alpha^\beta\{x^2-(2\beta x-\beta^2)\}dx+\dfrac14(\beta-\alpha)^3$임을 구했다.
      depends_on: [1-3.M1]
      implied_ok: false
      steps: [1-3b-2]
    - id: 1-3.A1
      mark_type: A
      points: 10
      evidence: 넓이가 $\dfrac76\sqrt2$임을 구했다.
      depends_on: [1-3.M2]
      cao: true
      steps: [1-3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42201}
  misconceptions:
  - id: MC-CAL-42201
    outcome_code: '71'
    wrong_work: '집합 $S$를 두 곡선 사이 영역 전체로 보아 $\int_\alpha^\beta\{x^2-(-x^2+4x-3)\}dx$를 답으로 함'
    detect_cue: 답에 접선 $\ell_\alpha$, $\ell_\beta$가 쓰이지 않음
    feedback: 접선들은 $y=x^2$ 아래에 있지만 아래쪽 포물선까지 다 덮지는 않습니다. 세로선 위에서 $2cx-c^2$의 최솟값을 확인하세요.
    remedy: [RL-3]

