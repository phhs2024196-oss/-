intent: |
  조합의 수를 활용하여 경우의 수를 구할 수 있는지(2-1), 수열의 뜻을 알고 로그의 성질을 이용하여 주어진 조건을 만족하는 값을 구할 수 있는지(2-2) 평가한다.
key_idea: |
  $S_n$의 점은 모두 $2^{n+1}$개이고 그중 지름 위의 $2^n+1$개만 한 직선 위에 있으므로 $a_n={}_{2^{n+1}}\mathrm{C}_2-{}_{2^n+1}\mathrm{C}_2+1$, $b_n={}_{2^{n+1}}\mathrm{C}_3-{}_{2^n+1}\mathrm{C}_3$. 이로부터 $c_n=2^n$이 되고, 넓이 이등분 조건 $\tfrac12\cdot2^{n+2}(q_n-p_n)=2^{2n}$과 두 교점이 같은 원점 직선 위에 있다는 조건 $p_nq_n=2^{2n}$을 연립한다.
stuck: |
  2-2에서 $a_n$, $b_n$의 일반항을 정리해 $c_n=2^n$으로 단순화하는 단계, 그리고 삼각형 $\mathrm{P}_n\mathrm{Q}_n\mathrm{C}_n$의 넓이를 $\triangle\mathrm{OQ}_n\mathrm{C}_n-\triangle\mathrm{OP}_n\mathrm{C}_n$으로 써서 $q_n-p_n$을 얻는 단계
