  - '$S_n$의 점으로 만드는 직선의 개수 $a_n$, 삼각형의 개수 $b_n$'
  - '세 점 $\mathrm{A}_n(c_n,0)$, $\mathrm{B}_n(c_{n+1},0)$, $\mathrm{C}_n(0,c_{n+2})$가 만드는 삼각형과 원점을 지나는 넓이 이등분 직선 $y=d_nx$'
