stimuli:
- label: (가)
  body: |
    서로 다른 $n$개에서 $r$ $(0\le r\le n)$개를 택하는 조합의 수는
    $${}_n\mathrm{C}_r=\dfrac{{}_n\mathrm{P}_r}{r!}=\dfrac{n!}{r!(n-r)!}$$
- label: (나)
  body: |
    점 $(x_1,y_1)$을 지나고 기울기가 $m$인 직선의 방정식은
    $$y-y_1=m(x-x_1)$$
- label: (다)
  body: |
    $a>0$, $a\ne1$, $b>0$일 때,
    (a) $\log_ab^k=k\log_ab$ (단, $k$는 실수)
    (b) $\log_ab=\dfrac{\log_cb}{\log_ca}$ (단, $c>0$, $c\ne1$)

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  모든 자연수 $n$에 대하여 선분 $\mathrm{XY}$를 지름으로 하는 반원에서 선분 $\mathrm{XY}$를 $2^n$등분한 각 분점($\mathrm{X}$와 $\mathrm{Y}$도 포함)과 호 $\mathrm{XY}$를 $2^n$등분한 각 분점으로 이루어진 집합을 $S_n$이라 하자. 예를 들어, 두 집합 $S_1$과 $S_2$의 원소는 각각 아래 [그림1], [그림2]의 점과 같다.
  # [그림1: 반원, 지름 위 X·중점·Y 3점과 호의 중점 1점 — S_1 은 4점]
  # [그림2: 반원, 지름 위 X·3개 분점·Y 5점과 호 위 3점 — S_2 는 8점]

  집합 $S_n$의 원소인 점을 2개 이상 지나는 서로 다른 직선의 개수를 $a_n$, 집합 $S_n$의 원소인 점 3개를 꼭짓점으로 하는 삼각형의 개수를 $b_n$이라 하자.

subparts:
- id: '2-1'
  stem: |
    $a_3$과 $b_3$의 값을 각각 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: value, value: '85; 476', equivalents: ['a_3=85, b_3=476'], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: 공선인 것은 지름 위 $9$개 점뿐이므로 $a_3={}_{16}\mathrm{C}_2-{}_9\mathrm{C}_2+1$, $b_3={}_{16}\mathrm{C}_3-{}_9\mathrm{C}_3$.
    steps:
    - {id: 2-1a, content: '$a_3=120-36+1=85$, $b_3=560-84=476$', criteria: [2-1.B1, 2-1.B2]}
    hint_ladder:
    - $S_3$의 점은 모두 몇 개이고, 그중 한 직선 위에 있는 점은 어느 것인가?
    - 한 직선 위의 점들끼리 고른 경우를 어떻게 보정해야 하는가?
  - id: S2-1-B
    audience: B
    source_flow: rep2022.pdf p.84(인쇄 80)
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        $S_n$에 포함된 점의 총 개수는 $2^{n+1}$이고, $S_n$에 포함된 점 중에서 선분 $\mathrm{XY}$ 위에 있는 점의 총 개수는 $2^n+1$이다. $a_n$과 $b_n$은 아래와 같다.
        $$a_n={}_{2^{n+1}}\mathrm{C}_2-{}_{(2^n+1)}\mathrm{C}_2+1=3\times2^{n-1}(2^n-1)+1,$$
        $$b_n={}_{2^{n+1}}\mathrm{C}_3-{}_{(2^n+1)}\mathrm{C}_3=\dfrac{2^{n-1}(2^n-1)(7\times2^n-5)}{3}.$$
      criteria: [2-1.B1, 2-1.B2]
    - id: 2-1b-2
      content: |
        $a_3={}_{16}\mathrm{C}_2-{}_9\mathrm{C}_2+1=85$, $b_3={}_{16}\mathrm{C}_3-{}_9\mathrm{C}_3=476$.
      criteria: [2-1.B1, 2-1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.B1
      mark_type: B
      points: 15
      evidence: $a_3={}_{16}\mathrm{C}_2-{}_9\mathrm{C}_2+1=85$를 구했다.
      steps: [2-1b-1, 2-1b-2]
    - id: 2-1.B2
      mark_type: B
      points: 15
      evidence: $b_3={}_{16}\mathrm{C}_3-{}_9\mathrm{C}_3=476$을 구했다.
      steps: [2-1b-1, 2-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-42201}
  misconceptions:
  - id: MC-CNT-42201
    outcome_code: '71'
    wrong_work: '$a_3={}_{16}\mathrm{C}_2-{}_9\mathrm{C}_2=84$로 지름 자체가 만드는 직선 1개를 빠뜨리거나, 보정 없이 $a_3=120$'
    detect_cue: 답이 $84$ 또는 $120$
    feedback: 지름 위 점끼리 고른 ${}_9\mathrm{C}_2$개의 선택은 모두 같은 직선 하나입니다. 빼고 나서 $1$을 다시 더하세요.
    remedy: [RL-1]

- id: '2-2(1)'
  stem: |
    수열 $\{c_n\}$의 일반항을 $c_n=\dfrac{9b_n}{7(a_n-1)}+\dfrac57$라 하자. 좌표평면 위의 세 점 $\mathrm{A}_n(c_n,0)$, $\mathrm{B}_n(c_{n+1},0)$, $\mathrm{C}_n(0,c_{n+2})$에 대하여 직선 $y=d_nx$가 삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$의 넓이를 이등분한다. 직선 $y=d_nx$와 두 선분 $\mathrm{A}_n\mathrm{C}_n$과 $\mathrm{B}_n\mathrm{C}_n$의 교점의 $x$좌표를 각각 $p_n$과 $q_n$이라 하자.
    (1) $\log_8(q_{100}-p_{100})$의 값을 구하시오. (40점)
  points: 40
  depends_on: ['2-1']
  answer: {kind: value, value: '33', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-1-A
    audience: A
    method_no: 1
    key_idea: $c_n=2^n$이고 넓이 이등분에서 $\tfrac12\cdot2^{n+2}(q_n-p_n)=2^{2n}$.
    steps:
    - {id: 2-2-1a, content: '$q_n-p_n=2^{n-1}$, $\log_8 2^{99}=33$', criteria: [2-2(1).M1, 2-2(1).A1]}
    hint_ladder:
    - 2-1의 일반항을 대입해 $c_n$을 간단히 해 보자.
    - 삼각형 $\mathrm{P}_n\mathrm{Q}_n\mathrm{C}_n$의 넓이를 원점을 꼭짓점으로 하는 두 삼각형의 차로 써 보자.
  - id: S2-2-1-B
    audience: B
    source_flow: rep2022.pdf pp.84–85(인쇄 80–81)
    method_no: 1
    steps:
    - id: 2-2-1b-1
      content: |
        $c_n=\dfrac{9b_n}{7(a_n-1)}+\dfrac57=2^n$이다. 직선 $y=d_nx$와 두 선분 $\mathrm{A}_n\mathrm{C}_n$과 $\mathrm{B}_n\mathrm{C}_n$의 교점을 각각 $\mathrm{P}_n$과 $\mathrm{Q}_n$이라 하자. 원점을 $\mathrm{O}(0,0)$이라 하자.
      criteria: [2-2(1).M1]
    - id: 2-2-1b-2
      content: |
        (삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$의 넓이) $=\dfrac12\times(2^{n+1}-2^n)\times2^{n+2}=2^{2n+1}$이므로 (삼각형 $\mathrm{P}_n\mathrm{Q}_n\mathrm{C}_n$의 넓이) $=\dfrac12\times$(삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$의 넓이) $=2^{2n}$이다.
        또한 (삼각형 $\mathrm{P}_n\mathrm{Q}_n\mathrm{C}_n$의 넓이) $=$ (삼각형 $\mathrm{OQ}_n\mathrm{C}_n$의 넓이) $-$ (삼각형 $\mathrm{OP}_n\mathrm{C}_n$의 넓이) $=\dfrac12\times2^{n+2}\times q_n-\dfrac12\times2^{n+2}\times p_n=\dfrac12\times2^{n+2}\times(q_n-p_n)$이므로
        $q_n-p_n=2^{n-1}$이고 $\log_8(q_{100}-p_{100})=33$이다.
      criteria: [2-2(1).A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2(1).M1
      mark_type: M
      points: 20
      evidence: $c_n=\dfrac{9b_n}{7(a_n-1)}+\dfrac57=2^n$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2-2-1b-1]
    - id: 2-2(1).A1
      mark_type: A
      points: 20
      evidence: $\log_8(q_{100}-p_{100})=33$을 구했다.
      depends_on: [2-2(1).M1]
      cao: true
      steps: [2-2-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42202}
  misconceptions:
  - id: MC-GEO-42202
    outcome_code: '71'
    wrong_work: '원점 쪽 사각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{Q}_n\mathrm{P}_n$의 넓이를 $\tfrac12\cdot2^{n+2}(q_n-p_n)$으로 놓음'
    detect_cue: 넓이 식에 원점 $\mathrm{O}$를 꼭짓점으로 하는 두 삼각형의 차가 없음
    feedback: 직선 $y=d_nx$는 원점을 지나므로 $\triangle\mathrm{OQ}_n\mathrm{C}_n-\triangle\mathrm{OP}_n\mathrm{C}_n$가 꼭짓점 $\mathrm{C}_n$ 쪽 삼각형의 넓이입니다.
    remedy: [RL-2]

- id: '2-2(2)'
  stem: |
    (2) $d_{100}$의 값을 구하시오. (50점)
  points: 50
  depends_on: ['2-2(1)']
  answer: {kind: value, value: 'sqrt(17) - 3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}_n$, $\mathrm{Q}_n$이 같은 원점 직선 위에 있으므로 기울기 등식에서 $p_nq_n=2^{2n}$; (1)의 $q_n-p_n=2^{n-1}$과 연립.
    steps:
    - {id: 2-2-2a, content: '$p_n=(\sqrt{17}-1)2^{n-2}$, $d_n=\dfrac{-4p_n+2^{n+2}}{p_n}=\sqrt{17}-3$', criteria: [2-2(2).M1, 2-2(2).A1]}
    hint_ladder:
    - 직선 $\mathrm{A}_n\mathrm{C}_n$, $\mathrm{B}_n\mathrm{C}_n$의 방정식을 세워 $\mathrm{P}_n$, $\mathrm{Q}_n$의 $y$좌표를 써 보자.
    - 두 점의 기울기 $y/x$가 같다는 식을 정리하면?
  - id: S2-2-2-B
    audience: B
    source_flow: rep2022.pdf p.85(인쇄 81)
    method_no: 1
    steps:
    - id: 2-2-2b-1
      content: |
        두 점 $\mathrm{A}_n$, $\mathrm{C}_n$을 지나는 직선의 방정식은 $y=-4x+2^{n+2}$이고, 두 점 $\mathrm{B}_n$, $\mathrm{C}_n$을 지나는 직선의 방정식은 $y=-2x+2^{n+2}$이므로 $\mathrm{P}_n(p_n,-4p_n+2^{n+2})$, $\mathrm{Q}_n(q_n,-2q_n+2^{n+2})$이다.
        두 점 $\mathrm{P}_n$과 $\mathrm{Q}_n$이 모두 직선 $y=d_nx$ 위에 있으므로 $d_n=\dfrac{-4p_n+2^{n+2}}{p_n}=\dfrac{-2q_n+2^{n+2}}{q_n}$이고 $p_nq_n=2^{2n}$이다.
      criteria: [2-2(2).M1]
    - id: 2-2-2b-2
      content: |
        $q_n-p_n=2^{n-1}$이고 $p_nq_n=2^{2n}$이므로 $p_n=(\sqrt{17}-1)2^{n-2}$이다($\because p_n>0$).
        $d_n=\dfrac{-4p_n+2^{n+2}}{p_n}=\sqrt{17}-3$이므로 $d_{100}=\sqrt{17}-3$이다.
      criteria: [2-2(2).A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2(2).M1
      mark_type: M
      points: 20
      evidence: $p_nq_n=2^{2n}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2-2-2b-1]
    - id: 2-2(2).A1
      mark_type: A
      points: 30
      evidence: $d_{100}=\sqrt{17}-3$을 구했다.
      depends_on: [2-2(2).M1]
      cao: true
      steps: [2-2-2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42202}
  misconceptions:
  - id: MC-ALG-42202
    outcome_code: '71'
    wrong_work: '$q_n-p_n=2^{n-1}$, $p_nq_n=2^{2n}$을 풀 때 음의 근 $p_n=-(\sqrt{17}+1)2^{n-2}$을 택해 $d_n=-\sqrt{17}-3$ 등으로 답함'
    detect_cue: 답에 $-\sqrt{17}$이 나타남
    feedback: $\mathrm{P}_n$은 선분 $\mathrm{A}_n\mathrm{C}_n$ 위의 점이므로 $0<p_n<2^n$입니다.
    remedy: [RL-4]

