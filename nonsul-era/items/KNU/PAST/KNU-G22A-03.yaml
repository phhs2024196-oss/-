  - '경우 (i) $2\alpha=\beta+\gamma$ (ii) $\alpha=\beta$ (iii) $\alpha=\gamma$'
  - '$x=k$에서 좌·우극한 비교로 $f(\alpha)=f(2\alpha)$'
