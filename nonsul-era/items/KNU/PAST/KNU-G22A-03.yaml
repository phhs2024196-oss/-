intent: |
  다항식의 나눗셈과 미분을 이용하여 주어진 식을 증명할 수 있는지(3-1), 미분을 이용하여 극값들의 관계를 구할 수 있는지(3-2), 연속을 이해하여 조건을 만족하는 값을 찾을 수 있는지(3-3) 평가한다.
key_idea: |
  $f'(x)=(x-\alpha)(x-\beta)(x-\gamma)$이므로 $f(x)=\tfrac14(x-\alpha)(x-\beta)(x-\gamma)\bigl(x-\tfrac{\alpha+\beta+\gamma}3\bigr)-\tfrac13(x-\alpha)^2+2$. 이를 미분해 $x=\alpha$를 넣으면 $f'(\alpha)=0$에서 경우가 나뉘고, $\alpha=\beta$를 넣은 뒤 $f'(\gamma)=0$에서 $\gamma-\alpha=2$. 계단함수 $g$와의 합성은 $f(\alpha)=f(2\alpha)$, $f(x)\ge k$ 조건으로 바뀐다.
stuck: |
  3-1에서 나눗셈 식 $f=Qf'+R$을 미분해 $f'(\alpha)$를 계산하고, $2\alpha=\beta+\gamma$나 $\alpha=\gamma$ 경우를 나머지가 상수가 되는 모순으로 배제하는 단계
idea_tags: [IDEA-DIVISION-IDENTITY-DIFFERENTIATE, IDEA-CASE-ELIMINATION-BY-CONTRADICTION, IDEA-STEP-FUNCTION-COMPOSITE-CONTINUITY]
tags: [다항식의 나눗셈, 항등식, 극값, 합성함수의 연속, 계단함수]
