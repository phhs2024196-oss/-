stimuli:
- label: (가)
  body: |
    다항식 $A$를 다항식 $B$ $(B\ne0)$로 나누었을 때의 몫을 $Q$, 나머지를 $R$라 하면
    $$A=BQ+R$$
    가 성립한다. 이때 $R$의 차수는 $B$의 차수보다 낮다.
- label: (나)
  body: |
    함수 $f(x)$가 실수 $a$에 대하여 다음 세 조건을 모두 만족시킬 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다.
    (ⅰ) 함수 $f(x)$는 $x=a$에서 정의되어 있다.
    (ⅱ) 극한값 $\lim_{x\to a}f(x)$가 존재한다.
    (ⅲ) $\lim_{x\to a}f(x)=f(a)$
- label: (다)
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능할 때,
    $$\{f(x)g(x)\}'=f'(x)g(x)+f(x)g'(x)$$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  최고차항의 계수가 $\dfrac14$인 사차함수 $f(x)$와 도함수 $f'(x)$가 다음 조건을 모두 만족시킨다.

  (1) 방정식 $f'(x)=0$은 세 실근 $\alpha,\beta,\gamma$ $(\alpha\le\beta\le\gamma)$를 가진다.
  (2) 사차다항식 $f(x)$를 삼차다항식 $f'(x)$로 나누었을 때의 몫은 $\dfrac14\left(x-\dfrac{\alpha+\beta+\gamma}3\right)$, 나머지는 $-\dfrac13(x-\alpha)^2+2$이다.

subparts:
- id: '3-1'
  stem: |
    $\alpha=\beta$이고 $\beta\ne\gamma$가 성립함을 증명하시오. (40점)
  points: 40
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-1-A
    audience: A
    method_no: 1
    key_idea: 나눗셈 식을 미분해 $x=\alpha$ 대입 → $f'(\alpha)=\tfrac1{12}(2\alpha-\beta-\gamma)(\alpha-\beta)(\alpha-\gamma)=0$. $2\alpha=\beta+\gamma$나 $\alpha=\gamma$이면 $\alpha=\beta=\gamma$라 나머지가 상수가 되어 모순.
    steps:
    - {id: 3-1a, content: '$f''(\alpha)=\tfrac1{12}(2\alpha-\beta-\gamma)(\alpha-\beta)(\alpha-\gamma)=0$, (i)(iii)은 $\alpha=\beta=\gamma$로 모순 ⇒ $\alpha=\beta\ne\gamma$', criteria: [3-1.M1, 3-1.M2, 3-1.R1]}
    hint_ladder:
    - $f'(x)$를 근 $\alpha,\beta,\gamma$로 인수분해한 식으로 $f(x)$를 써 보자.
    - 그 식을 미분해 $x=\alpha$를 대입하면 무엇이 $0$이어야 하는가?
  - id: S3-1-B
    audience: B
    source_flow: rep2022.pdf p.89(인쇄 85)
    method_no: 1
    steps:
    - id: 3-1b-1
      content: |
        조건에 의해
        $$f(x)=\dfrac14(x-\alpha)(x-\beta)(x-\gamma)\left(x-\dfrac{\alpha+\beta+\gamma}3\right)-\dfrac13(x-\alpha)^2+2$$
      criteria: [3-1.M1]
    - id: 3-1b-2
      content: |
        $f'(\alpha)=\dfrac1{12}(2\alpha-\beta-\gamma)(\alpha-\beta)(\alpha-\gamma)=0$이다. 그러므로 (i) $2\alpha=\beta+\gamma$ 또는 (ii) $\alpha=\beta$ 또는 (iii) $\alpha=\gamma$이다.
      criteria: [3-1.M2]
    - id: 3-1b-3
      content: |
        (i) 또는 (iii)이면 $\alpha=\beta=\gamma$이므로 $f'(x)=(x-\alpha)^3$, $f(x)=\dfrac14(x-\alpha)^4+2$ $(\because f(\alpha)=2)$.
        이 경우 $f(x)$를 $f'(x)$로 나누었을 때 나머지가 상수이므로 성립하지 않는다. 그러므로 $\alpha=\beta$, $\beta\ne\gamma$이다.
      criteria: [3-1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 10
      evidence: $f(x)=\dfrac14(x-\alpha)(x-\beta)(x-\gamma)\left(x-\dfrac{\alpha+\beta+\gamma}3\right)-\dfrac13(x-\alpha)^2+2$가 성립함을 보였다.
      depends_on: []
      implied_ok: false
      steps: [3-1b-1]
    - id: 3-1.M2
      mark_type: M
      points: 10
      evidence: $f'(\alpha)=\dfrac1{12}(2\alpha-\beta-\gamma)(\alpha-\beta)(\alpha-\gamma)=0$임을 보였다.
      depends_on: [3-1.M1]
      implied_ok: false
      steps: [3-1b-2]
    - id: 3-1.R1
      mark_type: R
      points: 20
      evidence: $2\alpha=\beta+\gamma$ 또는 $\alpha=\gamma$인 경우 성립하지 않음을 보였다.
      depends_on: [3-1.M2]
      steps: [3-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42203}
  misconceptions:
  - id: MC-ALG-42203
    outcome_code: '71'
    wrong_work: '$f''(\alpha)=0$에서 바로 $\alpha=\beta$라 결론짓고 $2\alpha=\beta+\gamma$, $\alpha=\gamma$ 경우를 배제하지 않음'
    detect_cue: 세 인수 중 $(\alpha-\beta)$만 언급
    feedback: 곱이 $0$이면 세 경우를 모두 따져야 합니다. 나머지 두 경우가 $\alpha=\beta=\gamma$로 이어져 조건 (2)와 모순임을 보이세요.
    remedy: [RL-1]

- id: '3-2'
  stem: |
    $\gamma-\alpha$의 값을 구하시오. (40점)
  points: 40
  depends_on: ['3-1']
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-2-A
    audience: A
    method_no: 1
    key_idea: $\alpha=\beta$를 넣은 $f$를 미분해 $x=\gamma$ 대입, $f'(\gamma)=\tfrac16(\gamma-\alpha)^3-\tfrac23(\gamma-\alpha)=0$.
    steps:
    - {id: 3-2a, content: '$(\gamma-\alpha)^2=4$, $\gamma>\alpha$이므로 $\gamma-\alpha=2$', criteria: [3-2.M1, 3-2.M2, 3-2.A1]}
    hint_ladder:
    - 3-1의 결과를 $f(x)$의 식에 넣어 보자.
    - $f'(\gamma)=0$을 이용하자.
  - id: S3-2-B
    audience: B
    source_flow: rep2022.pdf p.89(인쇄 85)
    method_no: 1
    steps:
    - id: 3-2b-1
      content: |
        $\alpha=\beta$, $\beta\ne\gamma$이므로 $f(x)$는 다음과 같이 나타낼 수 있다.
        $$f(x)=\dfrac14(x-\alpha)^2(x-\gamma)\left(x-\dfrac{2\alpha+\gamma}3\right)-\dfrac13(x-\alpha)^2+2$$
        $$f'(x)=\dfrac12(x-\alpha)(x-\gamma)\left(x-\dfrac{2\alpha+\gamma}3\right)+\dfrac14(x-\alpha)^2\left(x-\dfrac{2\alpha+\gamma}3\right)+\dfrac14(x-\alpha)^2(x-\gamma)-\dfrac23(x-\alpha)$$
      criteria: [3-2.M1]
    - id: 3-2b-2
      content: |
        $x=\gamma$를 대입하면 $f'(\gamma)=\dfrac16(\gamma-\alpha)^3-\dfrac23(\gamma-\alpha)=0$이다.
      criteria: [3-2.M2]
    - id: 3-2b-3
      content: |
        그러므로 $\gamma-\alpha=2$이다.
      criteria: [3-2.A1]
      # [공식해설 표기] 예시답안·채점기준 원문은 「r-α=2」로 표기 — γ-α 의 오식(그대로 의미 반영)
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 10
      evidence: $f'(x)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [3-2b-1]
    - id: 3-2.M2
      mark_type: M
      points: 20
      evidence: $x=\gamma$를 대입하여 $f'(\gamma)=\dfrac16(\gamma-\alpha)^3-\dfrac23(\gamma-\alpha)=0$을 구했다.
      depends_on: [3-2.M1]
      implied_ok: false
      steps: [3-2b-2]
    - id: 3-2.A1
      mark_type: A
      points: 10
      evidence: $\gamma-\alpha=2$를 구했다.
      depends_on: [3-2.M2]
      cao: true
      steps: [3-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42202}
  misconceptions:
  - id: MC-CAL-42202
    outcome_code: '71'
    wrong_work: '곱의 미분에서 네 인수 중 일부 항을 빠뜨려 $f''(\gamma)=\tfrac14(\gamma-\alpha)^3-\tfrac23(\gamma-\alpha)$ 등으로 계산, $\gamma-\alpha=\tfrac{4}{\sqrt6}$ 등'
    detect_cue: 답이 $2$가 아닌 무리수
    feedback: $x=\gamma$에서 $(x-\gamma)$를 포함한 항은 사라지고, $(x-\gamma)$를 미분한 항만 남습니다. 곱의 미분을 인수마다 적용하세요.
    remedy: [RL-2]

- id: '3-3(1)'
  stem: |
    실수 전체의 집합에서 정의된 함수 $g(x)$를
    $$g(x)=\begin{cases}\alpha & (x<k)\\ 2\alpha & (x\ge k)\end{cases}$$
    라 할 때, $g(x)$는 $x=k$에서 불연속이다.
    (1) 함수 $(f\circ g)(x)$가 실수 전체의 집합에서 연속이 되도록 하는 $\alpha$의 값을 구하시오. (20점)
  points: 20
  depends_on: ['3-2']
  answer: {kind: value, value: '8/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-3-1-A
    audience: A
    method_no: 1
    key_idea: $f\circ g$는 $x=k$에서만 문제 → $f(\alpha)=f(2\alpha)$.
    steps:
    - {id: 3-3-1a, content: '$2=\tfrac14\alpha^2(\alpha-2)(\alpha-\tfrac23)-\tfrac13\alpha^2+2$, $\alpha\ne0$ ⇒ $\alpha=\tfrac83$', criteria: [3-3(1).M1, 3-3(1).A1]}
    hint_ladder:
    - $f\circ g$는 두 값만 가진다. 어디서 연속성이 깨질 수 있는가?
  - id: S3-3-1-B
    audience: B
    source_flow: rep2022.pdf p.89(인쇄 85)
    method_no: 1
    steps:
    - id: 3-3-1b-1
      content: |
        $\gamma-\alpha=2$이므로 $f(x)=\dfrac14(x-\alpha)^2(x-\alpha-2)\left(x-\alpha-\dfrac23\right)-\dfrac13(x-\alpha)^2+2$이다.
        함수 $g(x)$는 $x=k$에서 불연속이므로 $\alpha\ne0$이다. 함수 $(f\circ g)(x)$가 연속이므로
        $f(g(k))=f(2\alpha)$, $\lim_{x\to k-}f(g(x))=f(\alpha)$, $\lim_{x\to k+}f(g(x))=f(2\alpha)$.
      criteria: [3-3(1).M1]
    - id: 3-3-1b-2
      content: |
        $2=f(\alpha)=f(2\alpha)=\dfrac14\alpha^2(\alpha-2)\left(\alpha-\dfrac23\right)-\dfrac13\alpha^2+2$이다. 그러므로 $\alpha=\dfrac83$이다.
      criteria: [3-3(1).A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-3(1).M1
      mark_type: M
      points: 10
      evidence: $(f\circ g)(x)$가 연속이므로 $f(\alpha)=f(2\alpha)$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [3-3-1b-1]
    - id: 3-3(1).A1
      mark_type: A
      points: 10
      evidence: $f(\alpha)=f(2\alpha)$의 방정식을 풀어서 $\alpha=\dfrac83$을 구했다.
      depends_on: [3-3(1).M1]
      cao: true
      steps: [3-3-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42203}
  misconceptions:
  - id: MC-CAL-42203
    outcome_code: '71'
    wrong_work: '$\alpha=0$도 답에 포함(또는 $\alpha=0$만 답)'
    detect_cue: 답에 $0$이 있음
    feedback: $\alpha=0$이면 $g$가 상수함수가 되어 $x=k$에서 불연속이라는 조건에 어긋납니다.
    remedy: [RL-3]

- id: '3-3(2)'
  stem: |
    (2) 함수 $(g\circ f)(x)$가 실수 전체의 집합에서 연속이 되도록 하는 $k$의 최댓값을 구하시오. (20점)
  points: 20
  depends_on: ['3-2']
  answer: {kind: value, value: '2/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-3-2-A
    audience: A
    method_no: 1
    key_idea: $g\circ f$가 연속이려면 $f(x)$가 $k$를 가로지르지 않아야 하고, 사차함수는 위로 무한히 커지므로 모든 $x$에서 $f(x)\ge k$. $k$의 최댓값 = $f$의 최솟값 $=f(\gamma)$.
    steps:
    - {id: 3-3-2a, content: '$f(\alpha+2)=-\tfrac43+2=\tfrac23$', criteria: [3-3(2).M1, 3-3(2).A1]}
    hint_ladder:
    - $g$의 불연속점 $k$를 $f(x)$가 지나가면 어떻게 되는가?
  - id: S3-3-2-B
    audience: B
    source_flow: rep2022.pdf p.89(인쇄 85)
    method_no: 1
    steps:
    - id: 3-3-2b-1
      content: |
