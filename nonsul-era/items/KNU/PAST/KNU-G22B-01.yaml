stimuli:
- label: (가)
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는
    $$\{f(g(x))\}'=f'(g(x))g'(x)$$
- label: (나)
  body: |
    미분가능한 함수 $t=g(x)$의 도함수 $g'(x)$가 닫힌구간 $[\alpha,\beta]$에서 연속이고, 함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때, $g(\alpha)=a$, $g(\beta)=b$이면
    $$\int_a^bf(t)\,dt=\int_\alpha^\beta f(g(x))g'(x)\,dx$$
- label: (다)
  body: |
    닫힌구간 $[a,b]$에서 연속인 도함수를 갖는 두 함수 $f(x)$, $g(x)$에 대하여
    $$\int_a^bf(x)g'(x)\,dx=[f(x)g(x)]_a^b-\int_a^bf'(x)g(x)\,dx$$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  두 함수 $f(x)$와 $g(x)$는 실수 전체의 집합에서 도함수가 연속이고 다음 조건을 모두 만족시킨다.

  (1) 모든 실수 $x$에 대하여 $\left\{f\left(x+\dfrac14\right)\right\}^2+\left\{f\left(x-\dfrac14\right)\right\}^2=1$
  (2) 모든 실수 $x$에 대하여 $f(x)f\left(x+\dfrac12\right)=3g(x)-16\{g(x)\}^3$
  (3) 열린구간 $\left(-\dfrac14,0\right)$에서 $-\dfrac12<g(x)<0$
  (4) $f\left(\dfrac5{12}\right)=-\dfrac{\sqrt2}2$, $g(0)=0$

subparts:
- id: '1-1'
  stem: |
    모든 정수 $n$에 대하여 $|f'(n)|=|f'(0)|$이 성립함을 증명하시오. (단, $f(0)\ne0$) (20점)
  points: 20
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: (1)에서 $f(x)^2=f(x+1)^2$, 미분해 $f(x)f'(x)=f(x+1)f'(x+1)$, $|f(n)|=|f(0)|\ne0$으로 나눔.
    steps:
    - {id: 1-1a, content: '$|f(n)||f''(n)|=|f(n+1)||f''(n+1)|$, $|f(n)|=|f(n+1)|\ne0$ ⇒ $|f''(n)|=|f''(n+1)|$', criteria: [1-1.M1, 1-1.R1]}
    hint_ladder:
    - 조건 (1)의 $x$ 자리에 $x+\tfrac14$, $x+\tfrac34$를 넣어 보자.
  - id: S1-1-B
    audience: B
    source_flow: rep2022.pdf p.92(인쇄 88)
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        조건 (1)로부터 $f(x+1/2)^2+f(x)^2=1\Rightarrow f(x+1)^2+f(x+1/2)^2=1$이므로 $f(x)^2=f(x+1)^2$이다. 그러므로 정수 $n$에 대하여 $|f(n)|=|f(0)|\ne0$이다.
      criteria: [1-1.M1]
    - id: 1-1b-2
      content: |
        한편, $2f(x)f'(x)=2f(x+1)f'(x+1)$이므로
        $$|f(n)||f'(n)|=|f(n+1)||f'(n+1)|\Rightarrow|f'(n)|=|f'(n+1)|.$$
        따라서 $|f'(n)|=|f'(0)|$.
      criteria: [1-1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: 조건을 이용하여 $|f(n)|=|f(0)|$임을 확인했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.R1
      mark_type: R
      points: 15
      evidence: $|f'(n)|=|f'(n+1)|$임을 증명했다.
      depends_on: [1-1.M1]
      steps: [1-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42205}
  misconceptions:
  - id: MC-CAL-42205
    outcome_code: '71'
    wrong_work: '$f(x)^2=f(x+1)^2$에서 곧바로 $f(x)=f(x+1)$(주기 1)이라 두고 $f''(n)=f''(0)$을 주장'
    detect_cue: 절댓값 없이 $f(x+1)=f(x)$를 사용
    feedback: 제곱이 같다는 것은 부호까지 같다는 뜻이 아닙니다. $2f(x)f'(x)=2f(x+1)f'(x+1)$에 절댓값을 씌우고 $|f(n)|\ne0$으로 나누세요.
    remedy: [RL-1]

- id: '1-2'
  stem: |
    $g\left(-\dfrac1{12}\right)$의 값을 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: value, value: '-1/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: $a=g(-\tfrac1{12})$에 대해 $f(-\tfrac1{12})f(\tfrac5{12})=3a-16a^3=\mp\tfrac12$. $16a^3-3a\pm\tfrac12=(2a\pm1)(4a\mp1)^2$, $-\tfrac12<a<0$에서 $a=-\tfrac14$.
    steps:
    - {id: 1-2a, content: '$16a^3-3a\pm\tfrac12=0$, 조건 (3)으로 $a=-\tfrac14$', criteria: [1-2.M1, 1-2.A1]}
    hint_ladder:
    - $-\tfrac1{12}$과 $\tfrac5{12}$는 $\tfrac12$ 차이이다. 조건 (2)를 $x=-\tfrac1{12}$에서 써 보자.
    - $f(-\tfrac1{12})$의 크기는 조건 (1)의 어느 $x$에서 얻어지는가?
  - id: S1-2-B
    audience: B
    source_flow: rep2022.pdf p.93(인쇄 89)
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        $g(-1/12)=a$. $f(-1/12)f(5/12)=3a-16a^3$이고 $f(-1/12)^2+f(5/12)^2=1\Rightarrow f(-1/12)=\pm\sqrt2/2$이므로 $16a^3-3a\pm1/2=0$이다.
      criteria: [1-2.M1]
    - id: 1-2b-2
      content: |
        조건 (3)에 의해 $a=-1/4$이다.
      criteria: [1-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 20
      evidence: 방정식 $16a^3-3a\pm1/2=0$을 유도했다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-1]
    - id: 1-2.A1
      mark_type: A
      points: 10
      evidence: $a$의 값($-\tfrac14$)을 구했다.
      depends_on: [1-2.M1]
      cao: true
      steps: [1-2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42204}
  misconceptions:
  - id: MC-ALG-42204
    outcome_code: '71'
    wrong_work: '$f(-\tfrac1{12})$의 부호를 한쪽만 고려해 $16a^3-3a+\tfrac12=0$만 풀어 $a=-\tfrac12$ 또는 $\tfrac14$로 답함'
    detect_cue: 답이 $-\tfrac12$ 또는 $\tfrac14$
    feedback: $f(-\tfrac1{12})=\pm\tfrac{\sqrt2}2$ 두 경우의 삼차방정식을 모두 풀고, 조건 (3)의 열린 범위 $-\tfrac12<a<0$로 근을 고르세요.
    remedy: [RL-2]

- id: '1-3'
  stem: |
    $\displaystyle\int_{-\frac1{12}}^0f'(x)g(x)[f(x)-2\{f(x)\}^3]\,dx=\dfrac qp$라 할 때, $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수) (60점)
  points: 60
  depends_on: ['1-2']
  answer: {kind: value, value: '569', equivalents: ['적분값 9/560'], tolerance: null}
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: $h=\tfrac12f^2-\tfrac12f^4$로 부분적분 → 경계항 $-g(-\tfrac1{12})h(-\tfrac1{12})=\tfrac1{32}$, 남은 적분은 (2)로 $u=g$ 치환해 $\tfrac12\int_{-1/4}^0(3u-16u^3)^2du=\tfrac{17}{1120}$.
    steps:
    - {id: 1-3a, content: '$\tfrac1{32}-\tfrac12\cdot\tfrac{17}{560}=\tfrac9{560}$, $p+q=569$', criteria: [1-3.M1, 1-3.A1, 1-3.A2]}
    hint_ladder:
    - $f'(x)\{f(x)-2f(x)^3\}$은 어떤 함수의 도함수인가?
    - 그 함수를 조건 (1)로 $f(x)^2f(x+\tfrac12)^2$ 꼴로 바꿔 보자.
  - id: S1-3-B
    audience: B
    source_flow: rep2022.pdf p.93(인쇄 89)
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        $h(x)=1/2f(x)^2-1/2f(x)^4=1/2f(x)^2f(x+1/2)^2$ (조건 (1)).
        $$\text{준적분}=\int_{-1/12}^0g(x)h'(x)dx=[g(x)h(x)]_{-1/12}^0-\int_{-1/12}^0g'(x)h(x)dx$$
        $$=-g(-1/12)h(-1/12)-1/2\int_{-1/12}^0(f(x)f(x+1/2))^2g'(x)dx$$
        $$=-g(-1/12)h(-1/12)-1/2\int_{-1/12}^0(3g(x)-16g(x)^3)^2g'(x)dx$$
        $$=-g(-1/12)h(-1/12)-1/2\int_{-1/4}^0(3u-16u^3)^2du$$
      criteria: [1-3.M1]
    - id: 1-3b-2
      content: |
        $=1/32-1/2\times17/560=9/560$
      criteria: [1-3.A1]
    - id: 1-3b-3
      content: |
        $p+q=569$.
      criteria: [1-3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 40
      evidence: 부분적분법을 활용하여 구하는 정적분을 $-g(-1/12)h(-1/12)-1/2\int_{-1/4}^0(3u-16u^3)^2du$로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [1-3b-1]
    - id: 1-3.A1
      mark_type: A
      points: 15
      evidence: 정적분의 값을 유리수 $\dfrac qp$($=\tfrac9{560}$)로 표현했다.
      depends_on: [1-3.M1]
      cao: true
      steps: [1-3b-2]
    - id: 1-3.A2
      mark_type: A
      points: 5
      evidence: $p+q$의 값($569$)을 구했다.
      depends_on: [1-3.M1]
      cao: true
      steps: [1-3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42206}
  misconceptions:
  - id: MC-CAL-42206
    outcome_code: '71'
    wrong_work: '부분적분의 경계항 $[g(x)h(x)]_{-1/12}^0$을 빠뜨리거나 $g(0)=0$을 잊고 두 끝을 모두 계산해 부호를 틀림'
    detect_cue: 적분값이 $-\tfrac{17}{1120}$ 또는 $\tfrac1{32}+\tfrac{17}{1120}$
    feedback: $g(0)=0$이라 위끝 항은 사라지고 아래끝 항 $-g(-\tfrac1{12})h(-\tfrac1{12})=+\tfrac1{32}$만 남습니다.
    remedy: [RL-3]

