  materials:
  - '도함수가 연속인 두 함수 $f$, $g$가 만족하는 함수방정식 (1) $\{f(x+\tfrac14)\}^2+\{f(x-\tfrac14)\}^2=1$, (2) $f(x)f(x+\tfrac12)=3g(x)-16\{g(x)\}^3$'
  - '함숫값 조건 $f(\tfrac5{12})=-\tfrac{\sqrt2}2$, $g(0)=0$, 구간 조건 $-\tfrac12<g(x)<0$'
  - '정적분 $\int_{-1/12}^0f''(x)g(x)[f(x)-2\{f(x)\}^3]dx$'
  concepts:
  - '합성함수의 미분(제시문 (가))'
  - '치환적분(제시문 (나))'
  - '부분적분(제시문 (다))'
  - '삼차방정식의 인수분해와 근의 선택'
  tools:
  - '(1)에서 $x\to x+\tfrac14$, $x\to x+\tfrac34$로 바꿔 $f(x)^2=f(x+1)^2$'
  - '$h(x)=\tfrac12f(x)^2-\tfrac12f(x)^4=\tfrac12f(x)^2f(x+\tfrac12)^2$ (조건 (1))'
  - '$u=g(x)$ 치환, $u:-\tfrac14\to0$'
  conditions:
  - '$f(0)\ne0$ (1-1 단서)'
  - '$-\tfrac14<-\tfrac1{12}<0$이므로 $-\tfrac12<g(-\tfrac1{12})<0$'
  - '$f(-\tfrac1{12})^2+f(\tfrac5{12})^2=1$ ((1)에서 $x=\tfrac16$)'
  stimuli_used: ['(가)', '(나)', '(다)']
  subpart_links: '1-3은 1-2의 $g(-\tfrac1{12})=-\tfrac14$와 $f(-\tfrac1{12})^2=\tfrac12$를 경계값으로 사용'

