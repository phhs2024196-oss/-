intent: |
  합성함수 미분법을 이용하여 미분계수를 구할 수 있는지(1-1), 삼차방정식을 이용하여 조건을 만족하는 함숫값을 결정할 수 있는지(1-2), 치환적분법과 부분적분법을 이용하여 정적분을 계산할 수 있는지(1-3) 평가한다.
key_idea: |
  조건 (1)을 $x$를 옮겨 두 번 쓰면 $f(x)^2=f(x+1)^2$, 미분하면 $f(x)f'(x)=f(x+1)f'(x+1)$. $x=\tfrac16$에서 (1)과 $x=-\tfrac1{12}$에서 (2)를 쓰면 $a=g(-\tfrac1{12})$가 $16a^3-3a\pm\tfrac12=0$을 만족. 적분은 $h=\tfrac12f^2-\tfrac12f^4=\tfrac12f(x)^2f(x+\tfrac12)^2$로 부분적분한 뒤 (2)로 $u=g(x)$ 치환.
stuck: |
  1-3에서 피적분함수의 $f'(f-2f^3)$를 $h'(x)$로 보고 $h=\tfrac12\{f(x)f(x+\tfrac12)\}^2$로 바꿔 조건 (2)와 연결하는 단계
idea_tags: [IDEA-SHIFT-FUNCTIONAL-EQUATION, IDEA-CUBIC-TRIPLE-ANGLE-ROOTS, IDEA-PARTS-THEN-SUBSTITUTE-VIA-IDENTITY]
tags: [함수방정식, 합성함수의 미분, 삼차방정식, 부분적분, 치환적분]
