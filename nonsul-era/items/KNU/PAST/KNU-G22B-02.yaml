intent: |
  곡선의 접선과 직선이 이루는 각이 만족하는 관계식을 삼각함수로 표현할 수 있는지(2-1), 절대부등식과 수열의 성질을 이용하여 주어진 수열의 극한값을 계산할 수 있는지(2-2, 2-3), 정적분을 이용하여 주어진 도형의 넓이를 계산하고 수열의 성질을 이용하여 극한값을 계산할 수 있는지(2-4) 평가한다.
key_idea: |
  할선 $\mathrm{A}_n\mathrm{A}_{n+1}$의 기울기는 $a_n+a_{n+1}$, 접선의 기울기는 $2a_{n+1}$이고, 두 예각이 같다는 것은 $\alpha_n+\alpha_{n+1}=2\beta_{n+1}$(기울기각). 탄젠트 덧셈정리로 점화식을 얻고, $s_n=\tfrac{1+4a_{n+1}^2}{1+4a_na_{n+1}}>1$에서 차분이 증가하므로 $a_n\to\infty$. $r_n-s_n=\tfrac{a_{n+1}-a_n}{a_n(1+4a_na_{n+1})}\to0$이므로 $r_n\to3$.
stuck: |
  2-1에서 「두 직선과 이루는 예각이 같다」를 기울기각의 관계 $\alpha_n+\alpha_{n+1}=2\beta_{n+1}$로 바꾸는 단계, 2-2에서 $s_n>1$을 차분의 증가로 읽어 일차 하한을 만드는 단계
idea_tags: [IDEA-EQUAL-ANGLE-TANGENT-BISECTOR, IDEA-INCREASING-DIFFERENCES-LINEAR-LOWER-BOUND, IDEA-RATIO-LIMIT-FROM-DIFFERENCE-RATIO]
tags: [접선, 탄젠트 덧셈정리, 점화식, 수열의 극한, 넓이의 비]
