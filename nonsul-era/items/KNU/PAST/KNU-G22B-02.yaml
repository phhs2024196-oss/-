stimuli:
- label: (가)
  body: |
    곡선 $y=x^2$ 위의 점 $(x_0,y_0)$에서의 접선의 방정식은
    $$y-y_0=2x_0(x-x_0)$$
- label: (나)
  body: |
    $$\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$$
    $$\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$$
- label: (다)
  body: |
    수렴하는 두 수열 $\{a_n\}$, $\{b_n\}$에 대하여
    $$\lim_{n\to\infty}a_n=\alpha,\quad\lim_{n\to\infty}b_n=\beta\quad(\alpha,\ \beta\text{는 실수})$$
    일 때,
    (a) 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $\alpha=\beta$이면 $\lim_{n\to\infty}c_n=\alpha$
    (b) $\lim_{n\to\infty}(a_n+b_n)=\alpha+\beta$, $\lim_{n\to\infty}(a_n-b_n)=\alpha-\beta$
    (c) $\lim_{n\to\infty}a_nb_n=\alpha\beta$, $\lim_{n\to\infty}\dfrac{a_n}{b_n}=\dfrac\alpha\beta$ (단, $b_n\ne0$, $\beta\ne0$)

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  수열 $\{a_n\}$이 모든 자연수 $n$에 대하여 다음 조건을 모두 만족시킨다.

  (1) $0<a_n<a_{n+1}$
  (2) 점 $\mathrm{A}_n(a_n,{a_n}^2)$은 곡선 $P:y=x^2$ 위의 점이다.
  (3) 곡선 $P$ 위의 점 $\mathrm{A}_{n+1}$에서의 접선이 두 직선 $\mathrm{A}_n\mathrm{A}_{n+1}$, $\mathrm{A}_{n+1}\mathrm{A}_{n+2}$와 이루는 예각의 크기가 서로 같다.

  모든 자연수 $n$에 대하여
  $$r_n=\dfrac{a_{n+1}}{a_n},\quad s_n=\dfrac{a_{n+2}-a_{n+1}}{a_{n+1}-a_n}$$
  이라 하자.

subparts:
- id: '2-1'
  stem: |
    모든 자연수 $n$에 대하여 등식
    $$a_{n+2}=\dfrac{4{a_{n+1}}^3+qa_{n+1}-a_n}{1+pa_na_{n+1}}$$
    이 항상 성립할 때, 실수 $p$와 $q$의 값을 각각 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: value, value: '4; 2', equivalents: ['p=4, q=2'], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: 할선 두 개의 기울기각 합이 접선 기울기각의 두 배.
    steps:
    - {id: 2-1a, content: '$\dfrac{(a_{n+1}+a_n)+(a_{n+2}+a_{n+1})}{1-(a_{n+1}+a_n)(a_{n+2}+a_{n+1})}=\dfrac{4a_{n+1}}{1-4a_{n+1}^2}$ 정리 → $p=4$, $q=2$', criteria: [2-1.M1, 2-1.M2, 2-1.A1]}
    hint_ladder:
    - 두 할선과 접선의 기울기를 각각 $\tan$ 값으로 두자.
    - 접선이 두 할선이 이루는 각을 이등분한다는 것은 기울기각으로 어떻게 쓰이는가?
  - id: S2-1-B
    audience: B
    source_flow: rep2022.pdf p.97(인쇄 93)
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        직선 $\mathrm{A}_n\mathrm{A}_{n+1}$의 기울기를 $\tan\alpha_n$이라 하고 $P:y=x^2$ 위의 점 $\mathrm{A}_{n+1}$에서의 접선의 기울기를 $\tan\beta_{n+1}$이라 하자(단, $0<\alpha_n,\beta_{n+1}<\dfrac\pi2$). $\tan\alpha_n=a_{n+1}+a_n$이고, 제시문 (가)에 의해 $\tan\beta_{n+1}=2a_{n+1}$.
      criteria: [2-1.M1]
    - id: 2-1b-2
      content: |
        조건 (3)에 의해 $\alpha_n+\alpha_{n+1}=2\beta_{n+1}$이므로 제시문 (나)에 의해
        $$\tan(\alpha_n+\alpha_{n+1})=\dfrac{(a_{n+1}+a_n)+(a_{n+2}+a_{n+1})}{1-(a_{n+1}+a_n)(a_{n+2}+a_{n+1})}=\dfrac{4a_{n+1}}{1-4a_{n+1}^2}=\tan2\beta_{n+1}.$$
      criteria: [2-1.M2]
    - id: 2-1b-3
      content: |
        $a_{n+2}$에 대하여 정리하면 $a_{n+2}=\dfrac{4a_{n+1}^3+2a_{n+1}-a_n}{1+4a_na_{n+1}}$이므로 $p=4$, $q=2$이다.
      criteria: [2-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 5
      evidence: 직선 $\mathrm{A}_n\mathrm{A}_{n+1}$과 $\mathrm{A}_{n+1}\mathrm{A}_{n+2}$, 그리고 $\mathrm{A}_{n+1}$에서 접선의 기울기를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2-1b-1]
    - id: 2-1.M2
      mark_type: M
      points: 10
      evidence: 위 직선들이 이루는 예각에 대해 삼각함수(tan)의 합 또는 차를 이용하여 관계를 표현했다.
      depends_on: [2-1.M1]
      implied_ok: false
      steps: [2-1b-2]
    - id: 2-1.A1
      mark_type: A
      points: 15
      evidence: $a_{n+2}$를 $a_n$과 $a_{n+1}$로 올바르게 표현했다($p=4$, $q=2$).
      depends_on: [2-1.M2]
      cao: true
      steps: [2-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42207}
  misconceptions:
  - id: MC-CAL-42207
    outcome_code: '71'
    wrong_work: '두 예각이 같다는 조건을 $\alpha_n=\alpha_{n+1}$(두 할선이 평행) 또는 $\beta_{n+1}-\alpha_n=\beta_{n+1}-\alpha_{n+1}$로 세움'
    detect_cue: 식에 $\tan2\beta_{n+1}$이 없음
    feedback: 접선은 두 할선 사이에 놓이므로 $\beta_{n+1}-\alpha_n=\alpha_{n+1}-\beta_{n+1}$, 즉 $\alpha_n+\alpha_{n+1}=2\beta_{n+1}$입니다.
    remedy: [RL-1]

- id: '2-2'
  stem: |
    모든 자연수 $n$에 대하여 $s_n>1$이 성립함을 보이고, 이를 이용하여 $\displaystyle\lim_{n\to\infty}\dfrac1{a_n}=0$이 성립함을 증명하시오. (30점)
  points: 30
  depends_on: ['2-1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $s_n=\tfrac{1+4a_{n+1}^2}{1+4a_na_{n+1}}>1$ → 차분 증가 → $a_n$이 일차 이상으로 증가.
    steps:
    - {id: 2-2a, content: '$a_{n+2}>a_1+(n+1)d$, $0<\tfrac1{a_{n+2}}<\tfrac1{a_1+(n+1)d}\to0$', criteria: [2-2.M1, 2-2.R1, 2-2.R2]}
    hint_ladder:
    - 2-1의 점화식을 $s_n$에 대입해 정리해 보자.
    - $s_n>1$은 차분 $a_{n+1}-a_n$에 대해 무엇을 말하는가?
  - id: S2-2-B
    audience: B
    source_flow: rep2022.pdf p.97(인쇄 93)
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        $s_n=\dfrac{a_{n+2}-a_{n+1}}{a_{n+1}-a_n}$에서 $a_{n+2}$에 【2-1】에서 구한 식을 대입하면 $s_n=\dfrac{1+4a_{n+1}^2}{1+4a_na_{n+1}}$이다.
      criteria: [2-2.M1]
    - id: 2-2b-2
      content: |
        조건 (1)에 의해 $s_n>1$이다.
      criteria: [2-2.R1]
    - id: 2-2b-3
      content: |
        따라서 $a_{n+2}-a_{n+1}>a_{n+1}-a_n>\cdots>a_2-a_1>0$이다. $d=a_2-a_1$이라 하면 $a_{n+2}>a_{n+1}+d>\cdots>a_1+(n+1)d$이고 $0<\dfrac1{a_{n+2}}<\dfrac1{a_1+(n+1)d}$. 제시문 (다)에 의해 $\lim_{n\to\infty}\dfrac1{a_{n+2}}=0$.
      criteria: [2-2.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 5
      evidence: $s_n$을 변형하여 $\dfrac{1+4a_{n+1}^2}{1+4a_na_{n+1}}$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2-2b-1]
    - id: 2-2.R1
      mark_type: R
      points: 10
      evidence: $a_n<a_{n+1}$을 이용하여 $s_n>1$을 증명했다.
      depends_on: [2-2.M1]
      steps: [2-2b-2]
    - id: 2-2.R2
      mark_type: R
      points: 15
      evidence: 모든 자연수 $n$에 대하여 $a_{n+1}>a_1+n(a_2-a_1)$(혹은 유사한 절대 부등식)을 증명하고, 이를 이용하여 $\dfrac1{a_n}\to0$임을 보였다.
      depends_on: [2-2.R1]
      steps: [2-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-SEQ-42201}
  misconceptions:
  - id: MC-SEQ-42201
    outcome_code: '71'
    wrong_work: '$a_n$이 증가수열이므로 $a_n\to\infty$라고 단정'
    detect_cue: 차분의 하한이나 일차 하한 없이 「증가하므로 발산」
    feedback: 증가하는 수열도 수렴할 수 있습니다(예 $1-\tfrac1n$). $s_n>1$로 차분이 $d>0$ 이상임을 보여 $a_n\ge a_1+(n-1)d$를 만드세요.
    remedy: [RL-2]

- id: '2-3'
  stem: |
    $\displaystyle\lim_{n\to\infty}(r_n-s_n)=0$이 성립함을 증명하시오. (20점)
  points: 20
  depends_on: ['2-2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-3-A
    audience: A
    method_no: 1
    key_idea: $r_n-s_n=\dfrac{a_{n+1}-a_n}{a_n(1+4a_na_{n+1})}$, 분자·분모를 $a_na_{n+1}$로 나누고 $\tfrac1{a_n}\to0$.
    steps:
    - {id: 2-3a, content: '$r_n-s_n=\dfrac{\frac1{a_n}-\frac1{a_{n+1}}}{\frac1{a_{n+1}}+4a_n}\to0$', criteria: [2-3.M1, 2-3.R1]}
    hint_ladder:
    - $r_n-s_n$을 통분하고 2-1의 점화식을 대입해 보자.
  - id: S2-3-B
    audience: B
    source_flow: rep2022.pdf p.98(인쇄 94)
    method_no: 1
    steps:
    - id: 2-3b-1
      content: |
        $r_n-s_n=\dfrac{a_{n+1}^2-a_na_{n+2}}{a_n(a_{n+1}-a_n)}=\dfrac{a_{n+1}-a_n}{a_n(1+4a_na_{n+1})}$이다.
      criteria: [2-3.M1]
    - id: 2-3b-2
      content: |
        분자와 분모를 $a_na_{n+1}$로 나누면 $\lim_{n\to\infty}\dfrac1{a_n}=0$이므로 제시문 (다)에 의해
        $$\lim_{n\to\infty}(r_n-s_n)=\lim_{n\to\infty}\dfrac{\dfrac1{a_n}-\dfrac1{a_{n+1}}}{\dfrac1{a_{n+1}}+4a_n}=0.$$
      criteria: [2-3.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-3.M1
      mark_type: M
      points: 10
      evidence: $r_n-s_n$을 변형하여 $\dfrac{a_{n+1}-a_n}{a_n(1+4a_na_{n+1})}$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2-3b-1]
    - id: 2-3.R1
      mark_type: R
      points: 10
      evidence: $\dfrac1{a_n}\to0$을 이용하여 극한값이 $0$임을 보였다.
      depends_on: [2-3.M1]
      steps: [2-3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-SEQ-42202}
  misconceptions:
  - id: MC-SEQ-42202
    outcome_code: '71'
    wrong_work: '$\lim r_n$, $\lim s_n$이 존재한다고 가정하고 각각의 극한을 따로 구해 빼기'
    detect_cue: 수렴성 근거 없이 $\lim r_n-\lim s_n$을 사용
    feedback: 극한의 차 성질은 두 수열이 수렴할 때만 쓸 수 있습니다. 차 $r_n-s_n$을 한 식으로 정리한 뒤 극한을 구하세요.
    remedy: [RL-3]

- id: '2-4'
  stem: |
    모든 자연수 $n$에 대하여 점 $\mathrm{A}_n$에서 $x$축에 내린 수선의 발을 $\mathrm{H}_n$이라 하자. 사각형 $\mathrm{A}_n\mathrm{H}_n\mathrm{H}_{n+1}\mathrm{A}_{n+1}$에서 곡선 $P$에 의해 나누어진 영역 중 윗부분의 넓이를 $U_n$, 아랫부분의 넓이를 $D_n$이라 하자. $\displaystyle\lim_{n\to\infty}s_n=3$일 때, $\displaystyle\lim_{n\to\infty}\dfrac{U_n}{D_n}$의 값을 구하시오. (40점)
  points: 40
  depends_on: ['2-3']
  answer: {kind: value, value: '2/13', equivalents: [], tolerance: null}
  solutions:
  - id: S2-4-A
    audience: A
    method_no: 1
    key_idea: $\lim r_n=3$, $\dfrac{U_n}{D_n}=\dfrac{(r_n-1)^2}{2(r_n^2+r_n+1)}$.
    steps:
    - {id: 2-4a, content: '$\dfrac{(3-1)^2}{2(9+3+1)}=\dfrac2{13}$', criteria: [2-4.M1, 2-4.M2, 2-4.M3, 2-4.A1]}
    hint_ladder:
    - 2-3으로부터 $\lim r_n$을 구하자.
    - 사다리꼴 넓이에서 포물선 아래 넓이를 빼면 $U_n$.
  - id: S2-4-B
    audience: B
    source_flow: rep2022.pdf p.98(인쇄 94)
    method_no: 1
    steps:
    - id: 2-4b-1
      content: |
        $\lim_{n\to\infty}(r_n-s_n)=0$, $\lim_{n\to\infty}s_n=3$이므로, 제시문 (다)에 의해 $\lim_{n\to\infty}\dfrac{a_{n+1}}{a_n}=\lim_{n\to\infty}r_n=3$.
      criteria: [2-4.M3]
    - id: 2-4b-2
      content: |
        사각형 $\mathrm{A}_n\mathrm{H}_n\mathrm{H}_{n+1}\mathrm{A}_{n+1}$의 넓이 $R_n$, 곡선 $P$의 아랫부분의 넓이 $D_n$와 윗부분의 넓이 $U_n$은
        $$R_n=\dfrac{(a_{n+1}^2+a_n^2)(a_{n+1}-a_n)}2,\quad D_n=\int_{a_n}^{a_{n+1}}x^2dx=\dfrac{a_{n+1}^3-a_n^3}3,\quad U_n=R_n-D_n=\dfrac{(a_{n+1}-a_n)^3}6$$
        이다.
      criteria: [2-4.M1, 2-4.M2]
      # [그림: 없음 — 사다리꼴 A_nH_nH_{n+1}A_{n+1} 을 y=x^2 가 위(현과 곡선 사이)·아래로 나눔]
    - id: 2-4b-3
      content: |
        $\lim_{n\to\infty}\dfrac{a_{n+1}}{a_n}=3$이므로 제시문 (다)에 의해
        $$\lim_{n\to\infty}\dfrac{U_n}{D_n}=\lim_{n\to\infty}\dfrac{(a_{n+1}-a_n)^2}{2(a_{n+1}^2+a_na_{n+1}+a_n^2)}=\dfrac{\left(\lim\frac{a_{n+1}}{a_n}-1\right)^2}{2\left(\left(\lim\frac{a_{n+1}}{a_n}\right)^2+\lim\frac{a_{n+1}}{a_n}+1\right)}=\dfrac2{13}.$$
      criteria: [2-4.A1]
