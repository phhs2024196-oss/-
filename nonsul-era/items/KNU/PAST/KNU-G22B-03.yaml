- id: '3-3(2)'
  stem: |
    (2) 집합 $S$의 원소 중 양수인 것을 작은 수부터 크기순으로 모두 나열할 때, $n$번째 수를 $c_n$이라 하자. $\displaystyle\lim_{n\to\infty}(c_{2n}-c_{2n-1})=\pi$가 성립함을 증명하시오. (40점)
  points: 40
  depends_on: ['3-3(1)']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-3-2-A
    audience: A
    method_no: 1
    key_idea: $c_{2n-1}\in(2n\pi,(2n+\tfrac12)\pi)$, $c_{2n}\in((2n+\tfrac12)\pi,(2n+1)\pi)$이고 $|w'|\ge4n\pi$인 구간에서 $w(2n\pi+\tfrac1n)>0$, $w((2n+1)\pi-\tfrac1n)>0$.
    steps:
    - {id: 3-3-2a, content: '$\pi-\tfrac2n<c_{2n}-c_{2n-1}<\pi$, 조임 정리', criteria: [3-3(2).R1, 3-3(2).R2, 3-3(2).R3]}
    hint_ladder:
    - 3-3(1)의 구간 분할을 일반 $n$에 대해 쓰면 $c_{2n-1}$, $c_{2n}$은 어느 구간에 있는가?
    - $w(2n\pi)$는 얼마인가? 그 근처에서 $w'$은 얼마나 큰가?
  - id: S3-3-2-B
    audience: B
    source_flow: rep2022.pdf p.103(인쇄 99)
    method_no: 1
    steps:
    - id: 3-3-2b-1
      content: |
        모든 자연수 $n$에 대하여 닫힌구간 $\left[2n\pi,\left(2n+\dfrac13\right)\pi\right]$에서 $w'(x)=4x\cos x\ge8n\pi\times\dfrac12=4n\pi$이므로 $w\left(2n\pi+\dfrac1n\right)\ge w(2n\pi)+\dfrac1n\times4n\pi>0$이다.
      criteria: [3-3(2).R1]
    - id: 3-3-2b-2
      content: |
        닫힌구간 $\left[\left(2n+\dfrac23\right)\pi,(2n+1)\pi\right]$에서 $w'(x)=4x\cos x\le-8n\pi\times\dfrac12=-4n\pi$이므로 $w\left((2n+1)\pi-\dfrac1n\right)\ge w((2n+1)\pi)+\dfrac1n\times4n\pi>0$이다.
      criteria: [3-3(2).R2]
    - id: 3-3-2b-3
      content: |
        따라서 $2n\pi<c_{2n-1}<2n\pi+\dfrac1n$, $(2n+1)\pi-\dfrac1n<c_{2n}<(2n+1)\pi$이므로, $\pi-\dfrac2n<c_{2n}-c_{2n-1}<\pi$이다. 제시문 (마)에 의해 $\lim_{n\to\infty}(c_{2n}-c_{2n-1})=\pi$가 성립한다.
      criteria: [3-3(2).R3]
      # [메모] w(2nπ)=2-2π 이므로 w(2nπ)+4π=2+2π>0; 1/n<π/3 (n≥1) 이라 2nπ+1/n 은 하한 구간 안
