intent: |
  도함수를 구하고 함수의 증가를 판정할 수 있는지(3-1), 함수 및 역함수의 성질을 이해하고 음함수를 미분할 수 있는지(3-2), 사잇값 정리 및 함수의 증가와 감소를 이용하여 함수의 그래프의 개형을 그릴 수 있는지(3-3(1)), 함수의 그래프의 개형, 도함수, 사잇값 정리를 활용하여 수열의 극한을 구할 수 있는지(3-3(2)) 평가한다.
key_idea: |
  $x\ge0$에서 $f'(x)=(7-a)-4\sin x>0\iff a<3$, $x<0$에서 $f'(x)=-2(a+1)x+\tfrac{7-a}{1-x}>0\iff-1\le a<7$. $h(a)$는 $f(h)=0$인 양수이므로 음함수 미분. 원점을 지나는 접선 조건은 보조함수 $w(x)=f(x)-xf'(x)$의 영점이고, $w'(x)=-xf''(x)$의 부호로 증감을 나눠 사잇값 정리로 영점을 센다.
stuck: |
  3-3에서 접점 조건을 $w(t)=f(t)-tf'(t)=0$으로 바꾸고, $w'(x)=4x\cos x$($x\ge0$)의 부호가 바뀌는 $(2n\pm\tfrac12)\pi$를 기준으로 구간을 나누는 단계, 그리고 (2)에서 $w'$의 하한 $4n\pi$로 근을 $\tfrac1n$ 폭에 가두는 단계
