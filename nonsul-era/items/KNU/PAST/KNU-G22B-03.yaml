stimuli:
- label: (가)
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 그 구간의 모든 $x$에 대하여
    (a) $f'(x)>0$이면 $f(x)$는 그 구간에서 증가한다.
    (b) $f'(x)<0$이면 $f(x)$는 그 구간에서 감소한다.
- label: (나)
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는
    $$\{f(g(x))\}'=f'(g(x))g'(x)$$
- label: (다)
  body: |
    함수 $f(x)$가 $x=x_0$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(x_0,f(x_0))$에서의 접선의 방정식은
    $$y-f(x_0)=f'(x_0)(x-x_0)$$
- label: (라)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면 $f(a)$와 $f(b)$ 사이에 있는 임의의 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: (마)
  body: |
    수렴하는 두 수열 $\{a_n\}$, $\{b_n\}$에 대하여
    $$\lim_{n\to\infty}a_n=\lim_{n\to\infty}b_n=\alpha\quad(\alpha\text{는 실수})$$
    일 때, 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이면
    $$\lim_{n\to\infty}c_n=\alpha$$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  실수 $a$에 대하여 실수 전체의 집합에서 미분가능한 함수 $f(x)$를
  $$f(x)=\begin{cases}(7-a)x+4\cos x-2(\pi+1) & (x\ge0)\\ -(a+1)x^2-(7-a)\ln(1-x)-2(\pi-1) & (x<0)\end{cases}$$
  이라 하자. 모든 실수 $x$에 대하여 $f'(x)>0$이 되기 위한 모든 $a$의 값의 범위는 $k_1\le a<k_2$이다.

subparts:
- id: '3-1'
  stem: |
    $k_1$과 $k_2$의 값을 각각 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: value, value: '-1; 3', equivalents: ['k_1=-1, k_2=3'], tolerance: null}
  solutions:
  - id: S3-1-A
    audience: A
    method_no: 1
    key_idea: |
      $x\ge0$에서 $7-a>4\ge4\sin x$가 필요충분 → $a<3$. $x<0$에서 $x\to-\infty$일 때 $-2(a+1)x$가 지배 → $a\ge-1$, 그리고 $7-a>0$.
    steps:
    - {id: 3-1a, content: '$-1\le a<3$이므로 $k_1=-1$, $k_2=3$', criteria: [3-1.B1, 3-1.B2]}
    hint_ladder:
    - 두 구간에서 각각 $f'(x)$를 구해 보자.
  - id: S3-1-B
    audience: B
    source_flow: rep2022.pdf p.102(인쇄 98)
    method_no: 1
    steps:
    - id: 3-1b-1
      content: |
        $$f'(x)=\begin{cases}(7-a)-4\sin x & (x\ge0)\\ -2(a+1)x+\dfrac{7-a}{1-x} & (x<0)\end{cases}$$
        이다. $x\ge0$일 때 $a<3$이다. $x<0$일 때 $-1\le a<7$이다. 따라서 $k_1=-1$, $k_2=3$이다.
      criteria: [3-1.B1, 3-1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-1.B1
      mark_type: B
      points: 10
      evidence: $k_1=-1$을 구했다.
      steps: [3-1b-1]
    - id: 3-1.B2
      mark_type: B
      points: 10
      evidence: $k_2=3$을 구했다.
      steps: [3-1b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42209}
  misconceptions:
  - id: MC-CAL-42209
    outcome_code: '71'
    wrong_work: '$x<0$ 구간을 $x=0$ 근처만 보고 $a<7$만 얻어 $k_1$을 구하지 못하거나 $a>-1$(등호 제외)로 답함'
    detect_cue: $k_1$ 없음 또는 $-1<a$
    feedback: $x\to-\infty$에서 $-2(a+1)x$가 지배하므로 $a+1\ge0$이 필요하고, $a=-1$이면 $f'(x)=\tfrac{8}{1-x}>0$으로 성립합니다.
    remedy: [RL-1]

- id: '3-2'
  stem: |
    $k_1<a<k_2$일 때, 함수 $f(x)$는 역함수 $g(x)$를 가진다. 곡선 $y=g(x)$의 $y$절편을 $h(a)$라 할 때, 함수 $h(a)$는 미분가능하다. $h'(1)$의 값을 구하시오. (단, $h(1)=\dfrac\pi3$) (25점)
  points: 25
  depends_on: ['3-1']
  answer: {kind: value, value: '(3 + sqrt(3))*pi/36', equivalents: [], tolerance: null}
  solutions:
  - id: S3-2-A
    audience: A
    method_no: 1
    key_idea: $h(a)>0$이 $(7-a)h+4\cos h-2(\pi+1)=0$을 만족, $a$로 미분.
    steps:
    - {id: 3-2a, content: '$h''(1)=\dfrac{h}{7-a-4\sin h}\Big|_{a=1}=\dfrac{\pi/3}{6-2\sqrt3}=\dfrac{(3+\sqrt3)\pi}{36}$', criteria: [3-2.M1, 3-2.A1]}
    hint_ladder:
    - $g(0)=h(a)$이면 $f(h(a))$는 얼마인가? $h(a)$의 부호는?
  - id: S3-2-B
    audience: B
    source_flow: rep2022.pdf p.102(인쇄 98)
    method_no: 1
    steps:
    - id: 3-2b-1
      content: |
        $h(a)=g(0)$이므로 $f(h(a))=f(g(0))=0$이다. $f(0)=-2(\pi-1)<0$이고 $f'(x)>0$이므로 $h(a)>0$이고,
        $$f(h(a))=(7-a)h(a)+4\cos(h(a))-2(\pi+1)$$
        이다. 따라서 $(7-a)h(a)+4\cos(h(a))-2(\pi+1)=0$이다.
      criteria: [3-2.M1]
    - id: 3-2b-2
      content: |
        양변을 미분하면 $-h(a)+(7-a)h'(a)-4\sin(h(a))h'(a)=0$이고, $h(1)=\dfrac\pi3$이므로 $h'(1)=\dfrac{(3+\sqrt3)\pi}{36}$이다.
      criteria: [3-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 10
      evidence: $(7-a)h(a)+4\cos(h(a))-2(\pi+1)=0$이 성립함을 보였다.
      depends_on: []
      implied_ok: false
      steps: [3-2b-1]
    - id: 3-2.A1
      mark_type: A
      points: 15
      evidence: $h'(1)=\dfrac{(3+\sqrt3)\pi}{36}$를 구했다.
      depends_on: [3-2.M1]
      cao: true
      steps: [3-2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42210}
  misconceptions:
  - id: MC-CAL-42210
    outcome_code: '71'
    wrong_work: '$h(a)<0$으로 보고 $x<0$ 쪽 식을 사용하거나, $a$에 대해 미분할 때 $(7-a)$의 미분 $-h(a)$ 항을 빠뜨림'
    detect_cue: 분자에 $h(1)=\tfrac\pi3$이 없음(답이 $0$ 등)
    feedback: $f(0)<0$이고 $f$가 증가하므로 $f$의 영점은 양수입니다. $(7-a)h(a)$는 곱이므로 $a$에 대한 미분이 $-h(a)+(7-a)h'(a)$입니다.
    remedy: [RL-2]

- id: '3-3(1)'
  stem: |
    $a=1$일 때, 곡선 $y=f(x)$ 위의 점 $(t,f(t))$에서의 접선이 원점을 지나도록 하는 모든 실수 $t$의 집합을 $S$라 하자.
    (1) 집합 $S$의 원소 중 열린구간 $(-2,6\pi)$에 속하는 원소의 개수가 $5$임을 증명하시오. (단, $6\ln3+2\pi<14$) (35점)
  points: 35
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-3-1-A
    audience: A
    method_no: 1
    key_idea: $w(x)=f(x)-xf'(x)$의 영점 개수. $w'=4x\cos x$($x\ge0$), $4x-\tfrac{6x}{(1-x)^2}$($x<0$)로 증감 구간을 나누고 각 구간 끝값 부호로 사잇값 정리.
    steps:
    - {id: 3-3-1a, content: '$(-2,0)$, $(2\pi,\tfrac52\pi)$, $(\tfrac52\pi,3\pi)$, $(4\pi,\tfrac92\pi)$, $(\tfrac92\pi,5\pi)$에 하나씩, 나머지 구간엔 없음 → $5$개', criteria: [3-3(1).R1, 3-3(1).R2]}
    hint_ladder:
    - 접선이 원점을 지날 조건을 $t$에 대한 방정식으로 쓰자.
    - 그 방정식의 좌변을 함수 $w(x)$로 보고 미분하면 무엇이 남는가?
  - id: S3-3-1-B
    audience: B
    source_flow: rep2022.pdf pp.102–103(인쇄 98–99)
    method_no: 1
    steps:
    - id: 3-3-1b-1
      content: |
        $a=1$일 때, 곡선 $y=f(x)$ 위의 점 $(t,f(t))$에서의 접선의 방정식은 $y-f(t)=f'(t)(x-t)$이고, 이 접선이 원점을 지나면 $f(t)-tf'(t)=0$이다. $w(x)=f(x)-xf'(x)$라 하면
        $$w(x)=\begin{cases}4\cos x+4x\sin x-2(\pi+1) & (x\ge0)\\ 2x^2-6\ln(1-x)-\dfrac{6x}{1-x}-2(\pi-1) & (x<0)\end{cases}$$
        이다. $w(-2)=14-6\ln3-2\pi>0$, $w(0)=-2(\pi-1)<0$, $w\left(\dfrac\pi2\right)<0$, $w(2n\pi)<0$, $w\left(\left(2n+\dfrac12\right)\pi\right)>0$, $w((2n+1)\pi)<0$, $w\left(\left(2n+\dfrac32\right)\pi\right)<0$이다. (단, $n$은 자연수)
      criteria: [3-3(1).R1]
    - id: 3-3-1b-2
      content: |
        $$w'(x)=\begin{cases}4x\cos x & (x\ge0)\\ 4x-\dfrac{6x}{(1-x)^2} & (x<0)\end{cases}$$
        이므로 열린구간 $\left(-2,-\dfrac{\sqrt6}2+1\right)$, $\left(\left(2n+\dfrac12\right)\pi,\left(2n+\dfrac32\right)\pi\right)$에서 $w'(x)<0$이고 열린구간 $\left(-\dfrac{\sqrt6}2+1,0\right)$, $\left(2n\pi,\left(2n+\dfrac12\right)\pi\right)$, $\left(\left(2n+\dfrac32\right)\pi,(2n+2)\pi\right)$에서 $w'(x)>0$이다. (단, $n$은 음이 아닌 정수)
      criteria: [3-3(1).R1]
    - id: 3-3-1b-3
      content: |
        사잇값 정리 및 함수 $w(x)$의 증감에 의해 열린구간 $(-2,0)$, $\left(2\pi,\dfrac52\pi\right)$, $\left(\dfrac52\pi,3\pi\right)$, $\left(4\pi,\dfrac92\pi\right)$, $\left(\dfrac92\pi,5\pi\right)$에서 $S$의 원소가 오직 하나씩 존재하며, 구간 $[0,2\pi]$, $[3\pi,4\pi]$, $[5\pi,6\pi)$에서 $S$의 원소는 존재하지 않고, $\dfrac52\pi$ 및 $\dfrac92\pi$ 역시 $S$의 원소가 아니다. 따라서 열린구간 $(-2,6\pi)$에 속하는 $S$의 원소의 개수가 $5$이다.
      criteria: [3-3(1).R2]
      # [메모] (-2,0) 에서 w 는 감소 후 증가 — 감소 구간 (-2,1-√6/2) 에서 한 번만 0 을 지나고 증가 구간은 w<0 에서 w(0)<0 까지라 근 없음(검산 수치 확인)
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-3(1).R1
      mark_type: R
      points: 30
      evidence: 열린구간 $(-2,0)$, $\left(2\pi,\tfrac52\pi\right)$, $\left(\tfrac52\pi,3\pi\right)$, $\left(4\pi,\tfrac92\pi\right)$, $\left(\tfrac92\pi,5\pi\right)$에서 $S$의 원소가 오직 하나씩 존재함을 보였다.
      depends_on: []
