stimuli:
- label: (가)
  body: |
    함수 $f(x)$가 어떤 열린구간에 속하는 모든 실수 $x$에서 연속일 때, $f(x)$는 그 구간에서 연속이라고 한다. 또한, 닫힌구간 $[a,b]$에서 정의된 함수 $f(x)$가 열린구간 $(a,b)$에서 연속이고
    $$\lim_{x\to a+}f(x)=f(a),\quad\lim_{x\to b-}f(x)=f(b)$$
    일 때, $f(x)$는 닫힌구간 $[a,b]$에서 연속이라고 한다.
- label: (나)
  body: |
    함수 $y=f(x)$의 $x=a$에서의 미분계수는
    $$f'(a)=\lim_{x\to a}\dfrac{f(x)-f(a)}{x-a}$$
- label: (다)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때 도함수 $g'(t)$가 $\alpha,\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
- label: (라)
  body: |
    함수 $f(x)$가 두 실수 $a,b$를 포함하는 구간에서 연속일 때, $f(x)$의 한 부정적분을 $F(x)$라고 하면 $f(x)$의 $a$에서 $b$까지의 정적분은
    $$\int_a^bf(x)\,dx=\bigl[F(x)\bigr]_a^b=F(b)-F(a)$$

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  두 실수 $a,b$에 대하여, 닫힌구간 $[0,1]$에서 연속인 두 함수 $f(x)$, $g(x)$가 다음 조건을 만족시킨다.

  〈조건〉
  $0<x<1$인 모든 실수 $x$에 대하여
  $$\dfrac{f(x)-(1-x)^2}{x(1-x)}=a,\qquad\dfrac{g(x)-x^2}{x(1-x)}=b$$
  이다.

  다음 물음에 답하시오.

subparts:
- id: '1-1'
  stem: |
    $f(0)-g(0)$과 $f(1)-g(1)$의 값을 각각 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: expression, value: '(1, -1)', equivalents: ['f(0)-g(0)=1, f(1)-g(1)=-1'], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: $(0,1)$에서 $f$, $g$를 다항식으로 풀어 쓰고 연속성으로 끝점 값을 한쪽 극한으로 구한다.
    steps:
    - {id: 1-1a, content: '$f(0)=1$, $f(1)=0$, $g(0)=0$, $g(1)=1$이므로 $1$, $-1$', criteria: [1-1.M1, 1-1.A1]}
    hint_ladder:
    - 조건식의 분모를 넘겨 $f(x)$를 직접 쓰자.
    - $x=0$에서의 값은 조건식에 대입할 수 없다. 무엇을 써야 하나?
  - id: S1-1-B
    audience: B
    source_flow: rep2023.pdf p.38(인쇄 71)
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        $0<x<1$인 모든 실수 $x$에 대해서 $\dfrac{f(x)-(1-x)^2}{x(1-x)}=a$이고 $\dfrac{g(x)-x^2}{x(1-x)}=b$이므로 $f(x)=(1-x)^2+ax(1-x)$이고 $g(x)=x^2+bx(1-x)$이다.
      criteria: [1-1.M1]
    - id: 1-1b-2
      content: |
        두 함수 $f(x)$와 $g(x)$가 닫힌구간 $[0,1]$에서 연속이므로
        $f(0)=\lim_{x\to0+}f(x)=1$, $f(1)=\lim_{x\to1-}f(x)=0$, $g(0)=\lim_{x\to0+}g(x)=0$, $g(1)=\lim_{x\to1-}g(x)=1$이다. 그러므로 $f(0)-g(0)=1$, $f(1)-g(1)=-1$이다.
      criteria: [1-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 10
      evidence: |
        $f(x)=(1-x)^2+ax(1-x)$이고 $g(x)=x^2+bx(1-x)$임을 보였다.
      depends_on: []
      implied_ok: true
      steps: [1-1b-1]
    - id: 1-1.A1
      mark_type: A
      points: 10
      evidence: |
        두 함수가 닫힌구간 $[0,1]$에서 연속인 것을 이용하여 $f(0)-g(0)=1$, $f(1)-g(1)=-1$을 구했다.
      depends_on: [1-1.M1]
      cao: true
      steps: [1-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42301}
  misconceptions:
  - id: MC-CAL-42301
    outcome_code: '71'
    wrong_work: '$x=0$, $x=1$을 조건식에 그대로 대입하려다 분모가 0이라 값을 정할 수 없다고 하거나, 연속성 언급 없이 다항식에 대입만 함'
    detect_cue: 끝점 값의 근거로 연속(한쪽 극한)이 없음
    feedback: 조건은 $0<x<1$에서만 주어집니다. 끝점 값은 제시문 (가)의 연속 정의 $f(0)=\lim_{x\to0+}f(x)$로 정해야 합니다.
    remedy: [RL-1]

- id: '1-2(1)'
  stem: |
    $t=a-b$일 때, $x$에 대한 방정식 $f(x)-g(x)=0$의 근 중 열린구간 $(0,1)$에 속하는 근을 $h(t)$라 하자.
    (1) $h(t)=\begin{cases}\dfrac12&(t=0)\\[4pt]\dfrac{t-2+\sqrt{t^2+4}}{2t}&(t\ne0)\end{cases}$
    임을 보이시오. (40점)
  points: 40
  depends_on: ['1-1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-21-A
    audience: A
    method_no: 1
    key_idea: $f(x)-g(x)=-tx^2+(t-2)x+1$. $t=0$이면 일차, $t\ne0$이면 $p(0)=1>0$, $p(1)=-1<0$이라 $(0,1)$에 근이 꼭 하나 있고, 근과 계수의 관계로 다른 근은 $(0,1)$ 밖임을 보인 뒤 근의 공식에서 해당 근을 고른다.
    steps:
    - {id: 1-21a, content: '$tx^2-(t-2)x-1=0$의 근 $\dfrac{t-2\pm\sqrt{t^2+4}}{2t}$ 중 $(0,1)$에 있는 것은 $+$ 부호', criteria: [1-2(1).M1, 1-2(1).B1, 1-2(1).R1, 1-2(1).R2]}
    hint_ladder:
    - $f(x)-g(x)$를 $t$로 정리해 보자.
    - $t>0$일 때 두 근의 곱 $-\tfrac1t$의 부호는?
  - id: S1-21-B
    audience: B
    source_flow: rep2023.pdf p.38(인쇄 71)
    method_no: 1
    steps:
    - id: 1-21b-1
      content: |
        $f(x)-g(x)=(1-x)^2+ax(1-x)-x^2-bx(1-x)=-(a-b)x^2+(a-b-2)x+1=0$이므로 $tx^2-(t-2)x-1=0$의 $0<x<1$인 근을 구한다.
      criteria: [1-2(1).M1]
    - id: 1-21b-2
      content: |
        (i) $t=a-b=0$일 때 $x$에 대한 일차방정식 $f(x)-g(x)=-2x+1=0$의 근은 $x=\dfrac12$이다.
      criteria: [1-2(1).B1]
    - id: 1-21b-3
      content: |
        (ii) $t=a-b>0$일 때 근과 계수의 관계를 이용하여(두 근의 곱 $-\dfrac1t<0$, $p(x)=-tx^2+(t-2)x+1$에서 $p(0)=1>0$, $p(1)=-1<0$) $x$에 대한 이차방정식 $f(x)-g(x)=0$의 근이 구간 $(-\infty,0)$과 열린구간 $(0,1)$에서 각각 한 개씩 존재함을 보일 수 있다. 큰 근 $\dfrac{t-2+\sqrt{t^2+4}}{2t}$이 $(0,1)$의 근이다.
      criteria: [1-2(1).R1]
    - id: 1-21b-4
      content: |
        (iii) $t=a-b<0$일 때 근과 계수의 관계를 이용하여(두 근의 곱 $-\dfrac1t>0$, 두 근의 합 $\dfrac{t-2}{t}>1$, $p(0)=1>0$, $p(1)=-1<0$) $x$에 대한 이차방정식 $f(x)-g(x)=0$의 근이 열린구간 $(0,1)$과 구간 $(1,\infty)$에서 각각 한 개씩 존재함을 보일 수 있다. $t<0$이면 작은 근이 $\dfrac{t-2+\sqrt{t^2+4}}{2t}$이다.
        그러므로 이차방정식의 근의 공식을 이용하면 함수 $h(t)$는 $h(t)=\begin{cases}\dfrac12&(t=0)\\ \dfrac{t-2+\sqrt{t^2+4}}{2t}&(t\ne0)\end{cases}$이다.
      criteria: [1-2(1).R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2(1).M1
      mark_type: M
      points: 10
      evidence: |
        $f(x)-g(x)=-tx^2+(t-2)x+1$임을 보였다.
      depends_on: []
      implied_ok: true
      steps: [1-21b-1]
    - id: 1-2(1).B1
      mark_type: B
      points: 10
      evidence: |
        $t=0$일 때 $h(t)=\dfrac12$임을 보였다.
      steps: [1-21b-2]
    - id: 1-2(1).R1
      mark_type: R
      points: 10
      evidence: |
        $t>0$일 때 $h(t)=\dfrac{t-2+\sqrt{t^2+4}}{2t}$이고 $0<h(t)<1$임을 보였다.
      depends_on: [1-2(1).M1]
      steps: [1-21b-3]
    - id: 1-2(1).R2
      mark_type: R
      points: 10
      evidence: |
        $t<0$일 때 $h(t)=\dfrac{t-2+\sqrt{t^2+4}}{2t}$이고 $0<h(t)<1$임을 보였다.
      depends_on: [1-2(1).M1]
      steps: [1-21b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42301}
  misconceptions:
  - id: MC-ALG-42301
    outcome_code: '71'
    wrong_work: '$t<0$일 때도 큰 근을 고르기 위해 $\dfrac{t-2-\sqrt{t^2+4}}{2t}$를 택함(분모 $2t<0$에서 부호에 따른 대소가 뒤바뀌는 것을 놓침), 또는 $(0,1)$ 안에 있음을 확인하지 않음'
    detect_cue: $t<0$ 경우에 $-\sqrt{\ }$ 부호, 근의 위치 판정 없음
    feedback: $t<0$이면 분모가 음수라 $+\sqrt{\ }$ 쪽이 작은 근입니다. $p(0)>0>p(1)$로 $(0,1)$의 근이 하나임을 먼저 확인하세요.
    remedy: [RL-2]

- id: '1-2(2)'
  stem: |
    (2) $h'(0)$의 값을 구하시오. (20점)
  points: 20
  depends_on: ['1-2(1)']
  answer: {kind: value, value: '1/8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-22-A
    audience: A
    method_no: 1
    key_idea: 미분계수의 정의에 넣고 분자를 유리화한다.
    steps:
    - {id: 1-22a, content: '$\lim_{t\to0}\dfrac{-2+\sqrt{t^2+4}}{2t^2}=\lim\dfrac{1}{2(\sqrt{t^2+4}+2)}=\dfrac18$', criteria: [1-2(2).M1, 1-2(2).A1]}
    hint_ladder:
    - $h(t)-\tfrac12$를 통분해 보자.
    - 분자 $\sqrt{t^2+4}-2$를 유리화하자.
  - id: S1-22-B
    audience: B
    source_flow: rep2023.pdf p.38(인쇄 71)
    method_no: 1
    steps:
    - id: 1-22b-1
      content: |
        미분계수의 정의에 의해 $h'(0)=\lim_{t\to0}\dfrac{h(t)-h(0)}{t}=\lim_{t\to0}\dfrac{-2+\sqrt{t^2+4}}{2t^2}$
      criteria: [1-2(2).M1]
    - id: 1-22b-2
      content: |
        $=\lim_{t\to0}\dfrac{1}{2(\sqrt{t^2+4}+2)}=\dfrac18$
      criteria: [1-2(2).A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2(2).M1
      mark_type: M
      points: 10
      evidence: |
        미분계수의 정의에 의해 $h'(0)=\lim_{t\to0}\dfrac{h(t)-h(0)}{t}=\lim_{t\to0}\dfrac{-2+\sqrt{t^2+4}}{2t^2}$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1-22b-1]
    - id: 1-2(2).A1
      mark_type: A
      points: 10
      evidence: |
        $\lim_{t\to0}\dfrac{-2+\sqrt{t^2+4}}{2t^2}=\lim_{t\to0}\dfrac{1}{2(\sqrt{t^2+4}+2)}=\dfrac18$을 구했다.
      depends_on: [1-2(2).M1]
