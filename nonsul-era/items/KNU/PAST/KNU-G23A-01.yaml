intent: |
  함수의 연속의 뜻을 이해하고 함숫값을 구할 수 있는지(1-1), 이차방정식의 근을 구하고 특정 구간의 근을 구할 수 있는지, 미분계수의 정의를 활용하여 미분계수를 구할 수 있는지, 정적분의 정의와 치환적분법을 활용하여 정적분을 구할 수 있는지(1-2) 평가한다.
key_idea: |
  조건식을 $f(x)=(1-x)^2+ax(1-x)$, $g(x)=x^2+bx(1-x)$로 풀어 쓰고 연속성으로 끝점 값을 정한다. $f(x)-g(x)=-tx^2+(t-2)x+1$이므로 $t$의 부호에 따라 근의 위치를 근과 계수의 관계로 판정해 $(0,1)$ 안의 근을 고른다.
stuck: |
  $t>0$, $t<0$ 각각에서 두 근 중 어느 근이 $(0,1)$에 속하는지 판정하는 단계(근과 계수의 관계 또는 $p(0)=1>0$, $p(1)=-1<0$ 이용), 그리고 $t\to0$에서 $\dfrac{-2+\sqrt{t^2+4}}{2t^2}$ 꼴 극한의 유리화
idea_tags: [IDEA-CONTINUITY-ENDPOINT-VALUE, IDEA-ROOT-LOCATION-BY-SIGN, IDEA-RATIONALIZE-LIMIT]
tags: [연속성, 이차방정식 근의 위치, 미분계수의 정의, 치환적분]
