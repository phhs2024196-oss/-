  - '이차방정식의 근의 공식, 근과 계수의 관계'
  - '미분계수의 정의'
  - '치환적분법'
  tools:
  - '$x=0$, $x=1$에서 한쪽 극한으로 함숫값 결정'
  - '$p(x)=-tx^2+(t-2)x+1$의 $p(0)=1$, $p(1)=-1$ 부호 변화(또는 두 근의 곱 $-\tfrac1t$, 합)'
  - '분자 유리화: $\dfrac{-2+\sqrt{t^2+4}}{2t^2}=\dfrac{1}{2(\sqrt{t^2+4}+2)}$'
  - '$u=t^2+4$ 치환으로 $\int t\sqrt{t^2+4}\,dt=\tfrac13(t^2+4)^{3/2}$'
