intent: |
  두 직선의 교점과 원점을 지나는 직선의 기울기를 계산할 수 있는지(2-1), 두 직선의 기울기 비교를 통한 관계식을 찾고 극한을 계산할 수 있는지(2-2), 두 직선의 교점 및 점과 직선 사이의 거리를 통해 삼각형의 넓이를 함수로 찾고, 함수의 최댓값을 구할 수 있는지(2-3) 평가한다.
key_idea: |
  제시문 (나)의 기울기 공식을 두 번 쓴다. $\mathrm{O}$, $\mathrm{E}_n$, $\mathrm{F}_n$이 한 직선 위에 있으므로 직선 $\mathrm{OE}_n$과 $\mathrm{OF}_n$의 기울기가 같다는 등식에서 $\mathrm{G}_n$의 $x$좌표 $g_n=\dfrac{a_nb_n}{2b_n-a_n}$이 $d_n$과 무관하게 정해진다. 2-3은 넓이를 $d_1$의 분수함수로 놓고 몫의 미분법으로 최댓값을 찾는다.
stuck: |
  $\mathrm{F}_n$의 좌표를 직접 구하지 않고 「$\mathrm{F}_n$이 직선 $\mathrm{OE}_n$ 위」라는 사실을 기울기 등식으로 바꾸는 단계, 그리고 2-3에서 넓이를 밑변 $\overline{\mathrm{D}_1\mathrm{E}_1}$과 $\mathrm{G}_1$에서 직선 $\mathrm{B}_1\mathrm{D}_1$까지의 거리로 나누어 잡는 단계
idea_tags: [IDEA-INTERCEPT-FORM-SLOPE, IDEA-COLLINEAR-SLOPE-EQUATION, IDEA-AREA-AS-FUNCTION-OPTIMIZE]
tags: [직선의 절편식, 두 직선의 교점, 점과 직선 사이의 거리, 수열의 극한, 분수함수 최대]
