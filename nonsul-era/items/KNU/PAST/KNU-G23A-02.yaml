stimuli:
- label: (가)
  body: |
    서로 다른 두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$를 지나는 직선의 방정식은 $x_1\ne x_2$일 때,
    $$y-y_1=\dfrac{y_2-y_1}{x_2-x_1}(x-x_1)$$
- label: (나)
  body: |
    두 점 $(a,0)$, $(0,b)$를 지나는 직선의 방정식은
    $$\dfrac xa+\dfrac yb=1$$
    이다. 또한, 두 직선 $\dfrac xa+\dfrac yb=1$, $\dfrac xc+\dfrac yd=1$의 교점과 원점을 지나는 직선의 기울기는
    $$\dfrac{\dfrac1a-\dfrac1c}{\dfrac1d-\dfrac1b}$$
    (단, $0<a<c$이고 $0<d<b$)
- label: (다)
  body: |
    점 $(x_1,y_1)$과 직선 $ax+by+c=0$ ($a\ne0$ 또는 $b\ne0$) 사이의 거리는
    $$\dfrac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$$
- label: (라)
  body: |
    미분가능한 두 함수 $f(x)$와 $g(x)$ $(g(x)\ne0)$에 대하여
    $$\left\{\dfrac{f(x)}{g(x)}\right\}'=\dfrac{f'(x)g(x)-f(x)g'(x)}{\{g(x)\}^2}$$
- label: (마)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이면 최대·최소 정리에 의하여 함수 $f(x)$는 이 닫힌구간에서 반드시 최댓값과 최솟값을 갖는다. 이때 함수 $f(x)$가 열린구간 $(a,b)$에서 극값을 가지면
    $$f(x)\text{의 극값, }f(a),\ f(b)$$
    중에서 가장 큰 값이 $f(x)$의 최댓값이고, 가장 작은 값이 $f(x)$의 최솟값이다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  네 수열 $\{a_n\}$, $\{b_n\}$, $\{c_n\}$, $\{d_n\}$이 다음 조건을 만족시킨다.

  〈조건〉
  모든 자연수 $n$에 대하여,
  (Ⅰ) $a_n=2n+8$, $b_n=5n+10$, $c_n=n+9$
  (Ⅱ) $d_n$은 $0<d_n<c_n$인 실수이다.

  자연수 $n$에 대하여, 좌표평면 위에 원점 $\mathrm{O}$와 네 점 $\mathrm{A}_n(a_n,0)$, $\mathrm{B}_n(b_n,0)$, $\mathrm{C}_n(0,c_n)$, $\mathrm{D}_n(0,d_n)$이 있다. 두 직선 $\mathrm{A}_n\mathrm{C}_n$, $\mathrm{B}_n\mathrm{D}_n$의 교점을 $\mathrm{E}_n$, 두 직선 $\mathrm{OE}_n$, $\mathrm{A}_n\mathrm{D}_n$의 교점을 $\mathrm{F}_n$, 직선 $\mathrm{C}_n\mathrm{F}_n$과 $x$축과의 교점을 $\mathrm{G}_n$이라 하자.
  다음 물음에 답하시오.

subparts:
- id: '2-1'
  stem: |
    직선 $\mathrm{OE}_n$의 기울기는
    $$\dfrac{(\boxed{(\text{ㄱ})}\,n+\boxed{(\text{ㄴ})})(n+9)d_n}{10(n+2)(n+4)(n+9-d_n)}$$
    이다. (ㄱ)과 (ㄴ)에 알맞은 자연수를 각각 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: expression, value: '(3, 2)', equivalents: ['(ㄱ)=3, (ㄴ)=2'], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: 제시문 (나)에 $a=a_n$, $b=c_n$, $c=b_n$, $d=d_n$을 넣으면 기울기는 $\dfrac{(b_n-a_n)c_nd_n}{(c_n-d_n)a_nb_n}$.
    steps:
    - {id: 2-1a, content: '$b_n-a_n=3n+2$, $a_nb_n=10(n+2)(n+4)$이므로 (ㄱ)$=3$, (ㄴ)$=2$', criteria: [2-1.M1, 2-1.B1, 2-1.B2]}
    hint_ladder:
    - 직선 $\mathrm{A}_n\mathrm{C}_n$, $\mathrm{B}_n\mathrm{D}_n$을 절편식으로 쓰자.
    - 제시문 (나)의 조건 $0<a<c$, $0<d<b$에 맞게 대응시키자.
  - id: S2-1-B
    audience: B
    source_flow: rep2023.pdf p.40(인쇄 76)
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        제시문 (나)에 의하여 직선 $\mathrm{OE}_n$의 기울기는
        $$\dfrac{(b_n-a_n)c_nd_n}{(c_n-d_n)a_nb_n}=\dfrac{(3n+2)(n+9)d_n}{10(n+2)(n+4)(n+9-d_n)}$$
        이다.
      criteria: [2-1.M1]
    - id: 2-1b-2
      content: |
        따라서 (ㄱ)$=3$, (ㄴ)$=2$이다.
      criteria: [2-1.B1, 2-1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 10
      evidence: |
        제시문 (나)를 이용하여 직선 $\mathrm{OE}_n$의 기울기가 $\dfrac{(b_n-a_n)c_nd_n}{(c_n-d_n)a_nb_n}$임을 구했다.
      depends_on: []
      implied_ok: true
      steps: [2-1b-1]
    - id: 2-1.B1
      mark_type: B
      points: 10
      evidence: |
        $\dfrac{(b_n-a_n)c_nd_n}{(c_n-d_n)a_nb_n}=\dfrac{(3n+2)(n+9)d_n}{10(n+2)(n+4)(n+9-d_n)}$임을 이용하여 (ㄱ)$=3$을 구했다(각 10점).
      steps: [2-1b-2]
    - id: 2-1.B2
      mark_type: B
      points: 10
      evidence: |
        같은 식으로 (ㄴ)$=2$를 구했다(각 10점).
      steps: [2-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42301}
  misconceptions:
  - id: MC-GEO-42301
    outcome_code: '71'
    wrong_work: '제시문 (나)에 대입할 때 $c$와 $b$ 자리를 바꿔(직선 $\mathrm{A}_n\mathrm{C}_n$의 $y$절편을 $d$에 넣음) 기울기의 역수·부호가 뒤집힌 식을 얻음'
    detect_cue: (ㄱ)(ㄴ)가 자연수가 아니거나 분자에 $a_n-b_n$
    feedback: 제시문 (나)는 $\dfrac xa+\dfrac yb=1$과 $\dfrac xc+\dfrac yd=1$의 절편을 짝지어 쓴 공식입니다. 조건 $0<a<c$, $0<d<b$를 만족하도록 대응시키세요.
    remedy: [RL-1]

- id: '2-2'
  stem: |
    $\displaystyle\lim_{n\to\infty}\dfrac{\overline{\mathrm{A}_n\mathrm{G}_n}}{\overline{\mathrm{OG}_n}}$의 값을 구하시오. (40점)
  points: 40
  depends_on: ['2-1']
  answer: {kind: value, value: '3/5', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: 직선 $\mathrm{OF}_n$($=\mathrm{OE}_n$)의 기울기를 직선 $\mathrm{A}_n\mathrm{D}_n$과 $\mathrm{G}_n\mathrm{C}_n$으로 다시 계산해 같다고 놓으면 $\dfrac1{g_n}=\dfrac2{a_n}-\dfrac1{b_n}$.
    steps:
    - {id: 2-2a, content: '$g_n=\dfrac{a_nb_n}{2b_n-a_n}$, $\dfrac{\overline{\mathrm{A}_n\mathrm{G}_n}}{\overline{\mathrm{OG}_n}}=\dfrac{b_n-a_n}{b_n}\to\dfrac35$', criteria: [2-2.M1, 2-2.M2, 2-2.A1]}
    hint_ladder:
    - $\mathrm{F}_n$은 직선 $\mathrm{A}_n\mathrm{D}_n$과 직선 $\mathrm{G}_n\mathrm{C}_n$의 교점이기도 하다.
    - 같은 직선 $\mathrm{OE}_n$의 기울기를 두 가지로 표현하자.
  - id: S2-2-B
    audience: B
    source_flow: rep2023.pdf p.40(인쇄 76)
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        점 $\mathrm{G}_n$의 좌표를 $(g_n,0)$이라 하면, 제시문 (나)에 의하여 직선 $\mathrm{OF}_n$의 기울기는 $\dfrac{(a_n-g_n)c_nd_n}{(c_n-d_n)a_ng_n}$이다.
      criteria: [2-2.M1]
    - id: 2-2b-2
      content: |
        직선 $\mathrm{OE}_n$과 직선 $\mathrm{OF}_n$의 기울기는 같으므로 $\dfrac{(b_n-a_n)c_nd_n}{(c_n-d_n)a_nb_n}=\dfrac{(a_n-g_n)c_nd_n}{(c_n-d_n)a_ng_n}$이고
        $$g_n=\dfrac{a_nb_n}{2b_n-a_n}=\dfrac{5(n+2)(n+4)}{4n+6}$$
        이다.
      criteria: [2-2.M2]
    - id: 2-2b-3
      content: |
        $\mathrm{A}_n(2n+8,0)$, $\mathrm{B}_n(5n+10,0)$, $\mathrm{G}_n\left(\dfrac{5(n+2)(n+4)}{4n+6},0\right)$이므로
        $$\lim_{n\to\infty}\dfrac{\overline{\mathrm{A}_n\mathrm{G}_n}}{\overline{\mathrm{OG}_n}}=\lim_{n\to\infty}\dfrac{3n+2}{5n+10}=\dfrac35$$
        이다.
      criteria: [2-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 15
      evidence: |
        제시문 (나)를 이용하여 직선 $\mathrm{OF}_n$의 기울기가 $\dfrac{(a_n-g_n)c_nd_n}{(c_n-d_n)a_ng_n}$임을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2-2b-1]
    - id: 2-2.M2
      mark_type: M
      points: 15
      evidence: |
        $\dfrac{(b_n-a_n)c_nd_n}{(c_n-d_n)a_nb_n}=\dfrac{(a_n-g_n)c_nd_n}{(c_n-d_n)a_ng_n}$을 이용하여 $g_n=\dfrac{a_nb_n}{2b_n-a_n}=\dfrac{5(n+2)(n+4)}{4n+6}$을 구했다.
      depends_on: [2-2.M1]
      implied_ok: false
      steps: [2-2b-2]
    - id: 2-2.A1
      mark_type: A
      points: 10
      evidence: |
        $\lim_{n\to\infty}\dfrac{\overline{\mathrm{A}_n\mathrm{G}_n}}{\overline{\mathrm{OG}_n}}=\lim_{n\to\infty}\dfrac{3n+2}{5n+10}=\dfrac35$을 구했다.
      depends_on: [2-2.M2]
      cao: true
      steps: [2-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42302}
  misconceptions:
  - id: MC-GEO-42302
    outcome_code: '71'
    wrong_work: '$\mathrm{F}_n$의 좌표를 $d_n$으로 직접 구하다가 $g_n$이 $d_n$에 의존한다고 보고 극한을 $d_n$이 남은 식으로 답함'
    detect_cue: 답에 $d_n$ 또는 $\lim d_n$이 남음
    feedback: $\mathrm{O}$, $\mathrm{E}_n$, $\mathrm{F}_n$이 한 직선 위에 있다는 기울기 등식에서 $c_nd_n/(c_n-d_n)$이 약분되어 $g_n$은 $d_n$과 무관합니다.
    remedy: [RL-2]

- id: '2-3'
  stem: |
    삼각형 $\mathrm{D}_1\mathrm{E}_1\mathrm{G}_1$의 넓이가 최대가 되도록 하는 $d_1$의 값을 구하시오. (단, $1\le d_1\le9$) (50점)
  points: 50
  depends_on: ['2-2']
  answer: {kind: value, value: '15-5*sqrt(3)', equivalents: ['$15-5\sqrt3$'], tolerance: null}
  solutions:
  - id: S2-3-A
    audience: A
    method_no: 1
    key_idea: 넓이 $f(d_1)=\dfrac{15d_1(10-d_1)}{4(15-d_1)}$, $f'=0$의 근 중 구간 안의 $15-5\sqrt3$에서 극대이자 최대.
    steps:
    - {id: 2-3a, content: '$d_1^2-30d_1+150=0$의 $[1,9]$ 안의 근 $d_1=15-5\sqrt3$', criteria: [2-3.B1, 2-3.B2, 2-3.M1, 2-3.M2, 2-3.M3, 2-3.A1]}
    hint_ladder:
    - $n=1$이면 $\mathrm{A}_1(10,0)$, $\mathrm{B}_1(15,0)$, $\mathrm{C}_1(0,10)$, $\mathrm{G}_1\left(\tfrac{15}{2},0\right)$.
