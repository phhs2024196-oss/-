        $\lim\sin\theta_n=\lim\tan\theta_n=0$으로부터 $\lim\theta_n=0$을 구했다.
      depends_on: [3-3.M2]
      implied_ok: false
      steps: [3-3b-4]
    - id: 3-3.A1
      mark_type: A
      points: 5
      evidence: |
        $\lim_{n\to\infty}\dfrac{S_n}{n^2}=\dfrac{\pi}{12}$을 구했다.
      depends_on: [3-3.M3]
