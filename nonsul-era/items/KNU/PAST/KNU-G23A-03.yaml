intent: |
  도함수를 활용하여 함수의 그래프의 개형을 파악할 수 있는지(3-1), 도함수를 활용하여 부등식의 성립 여부를 확인할 수 있는지(3-2), 수열의 극한에 대한 기본 성질을 이해하고 이를 이용하여 수열의 극한을 구할 수 있는지(3-3) 평가한다.
key_idea: |
  $f'(x)=\dfrac{-(x+1)^2+(n+1)^2}{n(x+1)^2}$로 $x=n$에서 극댓값 $n+1$, 이후 감소하여 $-\infty$로 가므로 $f(k)$가 자연수인 가장 큰 $k$는 $f(k)=1$의 해 $n^2+2n$. 3-2는 $l(x)=f(x)-g(x)$의 증감표, 3-3은 곡선이 수평선 $y=n+1$과 할선 $y=g(x)$ 사이에 있음을 이용해 $S_n$을 두 부채꼴 넓이로 끼운다.
stuck: |
  3-1에서 「자연수가 되는 가장 큰 $k$」를 $f(x)=1$의 해로 바꾸는 단계, 3-3에서 곡선 대신 직선 $y=n+1$과 $y=g(x)$로 영역을 위·아래에서 끼워 $\dfrac{\pi}{12}n^2-T_n\le S_n\le\dfrac{\pi}{12}n^2$를 세우고 $\theta_n\to0$을 제시문 (마)(바)로 보이는 단계
idea_tags: [IDEA-LARGEST-NATURAL-VALUE-BY-MONOTONE, IDEA-DIFFERENCE-FUNCTION-SIGN, IDEA-SANDWICH-BY-SECTORS]
tags: [증감표, 극값, 부등식 증명, 부채꼴 넓이, 샌드위치 정리, 수열의 극한]
elements:
  materials:
  - '$(-1,\infty)$에서 정의된 분수함수 $f(x)=\dfrac{-x^2+n(n+3)x+n}{n(x+1)}$'
  - '$f(k)$가 자연수가 되는 가장 큰 자연수 $a_n$, 극대점 $b_n$'
  - '두 점 $(a_n,f(a_n))$, $(b_n,f(b_n))$을 지나는 직선 $y=g(x)$'
  - '중심 $\mathrm{P}(b_n,f(b_n))$이고 $y$축에 접하는 원 $C$, 기울기 $-\tfrac{1}{\sqrt3}$인 직선과의 교점 $\mathrm{D}$, 곡선과의 교점 $\mathrm{E}$로 둘러싸인 넓이 $S_n$'
  concepts:
  - '몫의 미분법, 증감표와 극값'
  - '$\sum k$, $\sum k^2$ 공식'
  - '차함수의 증감으로 부등식 증명'
  - '부채꼴의 넓이'
  - '$\sin\theta\le\theta\le\tan\theta$와 수열의 극한의 대소 관계(샌드위치)'
  tools:
  - '$f''(x)=0\iff x=n$ (정의역 안)'
  - '$f(x)=1\iff x=n^2+2n$'
  - '$l(x)=f(x)-g(x)$, $l''(x)=\dfrac{-(x+1)^2+(n+1)^3}{n(n+1)(x+1)^2}$, $l(n)=l(n^2+2n)=0$'
  - '직선 $\mathrm{PD}$의 기울기 $-\tfrac1{\sqrt3}$ → 중심각 $\tfrac{\pi}{6}$인 부채꼴(넓이 $\tfrac{\pi}{12}n^2$)'
  - '부채꼴 $\mathrm{PFG}$($\mathrm{F}$: 원과 $y=g(x)$, $\mathrm{G}$: 원과 $y=n+1$)의 넓이 $T_n=\tfrac12n^2\theta_n$, $\tan\theta_n=\tfrac{1}{n+1}$'
  conditions:
  - '$n$은 자연수, 정의역 $x>-1$'
  - '부채꼴 $\mathrm{PDE}$의 중심각은 $\tfrac{\pi}{2}$보다 작다'
  - '3-2는 닫힌구간 $[b_n,a_n]$에서'
  stimuli_used: ['(가)', '(나)', '(다)', '(라)', '(마)', '(바)']
  subpart_links: '3-1의 증감표에서 $b_n=n$, $a_n=n^2+2n$을 3-2에 사용, 3-2의 $f\ge g$를 3-3의 아래쪽 끼움에 사용'

