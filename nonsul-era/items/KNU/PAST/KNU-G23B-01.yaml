    wrong_work: '$t=\dfrac1{2^k}$일 때 봉우리에 접하는 점(극대점)도 미분불가능점으로 세어 $m(t)=2k+1$로 두거나, 극솟값 $-1$ 쪽 교점까지 세어 개수를 두 배로 셈'
    detect_cue: $m(t)$가 홀수이거나 답이 $-4$
    feedback: $f(x)=t$인 점 중 $f'(x)\ne0$인 교차점에서만 $\lvert f-t\rvert$가 꺾입니다. 접하는 극대점에서는 미분가능합니다.
    remedy: [RL-3]

