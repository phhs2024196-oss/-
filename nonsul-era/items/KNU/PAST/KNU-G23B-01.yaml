- id: '1-3(2)'
  stem: |
    (2) 양수 $t$에 대하여, 함수 $g(x)=\lvert f(x)-t\rvert$가 구간 $(0,\infty)$에서 미분가능하지 않은 모든 점의 개수를 $m(t)$라 하자.
    $$\lim_{t\to0+}\dfrac{m(t)}{\log_2t}$$
    의 값을 구하시오. (35점)
  points: 35
  depends_on: ['1-3(1)']
  answer: {kind: value, value: '-2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-32-A
    audience: A
    method_no: 1
    key_idea: 극댓값은 $f(2n-1)=\dfrac1{2^{n-1}}$, 극솟값은 $f(2n)=-1$. $\dfrac1{2^k}\le t<\dfrac1{2^{k-1}}$이면 $t$보다 큰 봉우리 $k$개가 각각 두 번 교차하여 $m(t)=2k$.
    steps:
    - {id: 1-32a, content: '$2\left(-1+\dfrac1{\log_2t}\right)<\dfrac{m(t)}{\log_2t}\le-2$ → $-2$', criteria: [1-3(2).M1, 1-3(2).M2, 1-3(2).A1]}
    hint_ladder:
    - 1-3(1)에서 $a_n$의 점화 관계(연속 조건)로 $f(2n)$을 계산해 보자.
    - $f(x)=t$의 해 중 $f'\ne0$인 점에서 $g$가 꺾인다.
  - id: S1-32-B
    audience: B
    source_flow: rep2023.pdf p.47(인쇄 89)
    method_no: 1
    steps:
    - id: 1-32b-1
      content: |
        우선, $m(t)$를 구하자. $t\ge1$이면, $m(t)=0$이다. 또한, 자연수 $k$에 대하여 $\dfrac1{2^k}\le t<\dfrac1{2^{k-1}}$이면, $m(t)=2k$임을 알 수 있다.
      criteria: [1-3(2).M1]
    - id: 1-32b-2
      content: |
        한편, 부등식 $\dfrac1{2^k}\le t<\dfrac1{2^{k-1}}$은 $-\log_2t\le k<-\log_2t+1$로 쓸 수 있다. 따라서, $0<t<1$일 때, $-2\log_2t\le m(t)<2(-\log_2t+1)$이다. 이로부터 $0<t<1$일 때,
        $$2\left(-1+\dfrac1{\log_2t}\right)<\dfrac{m(t)}{\log_2t}\le-2$$
        가 성립함을 알 수 있다.
      criteria: [1-3(2).M2]
    - id: 1-32b-3
      content: |
        $\lim_{t\to0+}2\left(-1+\dfrac1{\log_2t}\right)=-2$이므로, 함수의 극한의 대소관계에 의해 $\lim_{t\to0+}\dfrac{m(t)}{\log_2t}=-2$이다.
      criteria: [1-3(2).A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3(2).M1
