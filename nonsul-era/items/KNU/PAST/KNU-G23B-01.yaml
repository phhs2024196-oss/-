stimuli:
- label: (가)
  body: |
    함수 $y=f(x)$의 $x=a$에서의 미분계수는
    $$f'(a)=\lim_{h\to0}\dfrac{f(a+h)-f(a)}{h}$$
- label: (나)
  body: |
    $x=a$에서 함수 $f(x)$의 우극한과 좌극한이 모두 존재하고, 그 값이 모두 $L$이면
    $$\lim_{x\to a}f(x)=L$$
- label: (다)
  body: |
    함수 $f(x)$가 세 실수 $a,b,c$를 포함하는 닫힌구간에서 연속일 때,
    $$\int_a^bf(x)\,dx+\int_b^cf(x)\,dx=\int_a^cf(x)\,dx$$
- label: (라)
  body: |
    첫째항이 $a$, 공비가 $r$ $(r\ne1)$인 등비수열의 첫째항부터 제$n$항까지의 합은
    $$\dfrac{a(1-r^n)}{1-r}$$
- label: (마)
  body: |
    세 함수 $f(x)$, $g(x)$, $h(x)$에 대하여 $f(x)\le h(x)\le g(x)$이고
    $$\lim_{x\to0+}f(x)=\lim_{x\to0+}g(x)=\alpha\quad(\alpha\text{는 실수})$$
    이면
    $$\lim_{x\to0+}h(x)=\alpha$$

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  세 수열 $\{a_n\}$, $\{b_n\}$, $\{c_n\}$과 구간 $(0,\infty)$에서 미분가능한 함수 $f(x)$가 모든 자연수 $n$에 대하여 다음 조건을 만족시킨다.

  〈조건〉
  (Ⅰ) $2n-1\le x\le2n$인 모든 실수 $x$에 대하여
  $$f(x)=a_n(x-2n+1)^4+b_n(x-2n+1)^2+c_n(x-2n+1)+\dfrac{1}{2^{n-1}}$$
  이다.
  (Ⅱ) $2n-2<x<2n-1$인 모든 실수 $x$에 대하여
  $$f(x)=f(4n-2-x)$$
  이다.

  다음 물음에 답하시오.

subparts:
- id: '1-1'
  stem: |
    $c_{2023}$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: 대칭축 $x=2n-1$에서 우미분계수 $c_n$, 좌미분계수 $-c_n$이 같아야 하므로 $c_n=0$.
    steps:
    - {id: 1-1a, content: '$c_n=-c_n$ → $c_{2023}=0$', criteria: [1-1.M1, 1-1.M2, 1-1.A1]}
    hint_ladder:
    - 조건 (Ⅱ)는 어떤 직선에 대한 대칭인가?
    - $x=2n-1$에서 좌미분계수를 우미분계수로 바꿔 보자.
  - id: S1-1-B
    audience: B
    source_flow: rep2023.pdf p.46(인쇄 88)
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        함수 $f(x)$는 $x=2n-1$에서 미분가능하므로 (단, $n$은 자연수), $\lim_{h\to0+}\dfrac{f(2n-1+h)-f(2n-1)}{h}=\lim_{h\to0-}\dfrac{f(2n-1+h)-f(2n-1)}{h}$임을 알 수 있다. 한편, 문제의 조건 (Ⅰ)과 (Ⅱ)를 이용하면,
        $$\lim_{h\to0+}\dfrac{f(2n-1+h)-f(2n-1)}{h}=\lim_{h\to0+}(a_nh^3+b_nh+c_n)=c_n$$
      criteria: [1-1.M1]
    - id: 1-1b-2
      content: |
        $$\lim_{h\to0-}\dfrac{f(2n-1+h)-f(2n-1)}{h}=\lim_{h\to0-}\dfrac{f(2n-1-h)-f(2n-1)}{h}=\lim_{h\to0+}\dfrac{f(2n-1+h)-f(2n-1)}{-h}=-c_n$$
      criteria: [1-1.M2]
    - id: 1-1b-3
      content: |
        이므로, $c_n=-c_n$, 즉, $c_n=0$임을 알 수 있다. 따라서, $c_{2023}=0$이다.
      criteria: [1-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: |
        $\lim_{h\to0+}\dfrac{f(2n-1+h)-f(2n-1)}{h}=c_n$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.M2
      mark_type: M
      points: 5
      evidence: |
        $\lim_{h\to0-}\dfrac{f(2n-1+h)-f(2n-1)}{h}=-c_n$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-2]
    - id: 1-1.A1
      mark_type: A
      points: 10
      evidence: |
        $c_{2023}=0$을 구했다.
      depends_on: [1-1.M1, 1-1.M2]
      cao: true
      steps: [1-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42308}
  misconceptions:
  - id: MC-CAL-42308
    outcome_code: '71'
    wrong_work: '조건 (Ⅰ)의 식만 미분해 $f''(2n-1)=c_n$이라 하고 $c_n$을 결정하지 못하거나, 좌미분계수도 $c_n$이라 둠'
    detect_cue: 좌미분계수 계산에서 대칭 $f(2n-1-h)$ 사용이 없음
    feedback: 왼쪽 구간의 $f$는 조건 (Ⅱ)로 오른쪽 조각을 뒤집은 것입니다. 뒤집으면 기울기의 부호가 바뀝니다.
    remedy: [RL-1]

- id: '1-2'
  stem: |
    모든 자연수 $n$에 대하여,
    $$(2a_n+b_n)(2a_{n+1}+b_{n+1})\le0$$
    임을 증명하시오. (30점)
  points: 30
  depends_on: ['1-1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: $x=2n$에서 좌미분계수 $4a_n+2b_n$, 우미분계수 $-(4a_{n+1}+2b_{n+1})$이 같으므로 곱은 $-(2a_n+b_n)^2\le0$.
    steps:
    - {id: 1-2a, content: '$2a_{n+1}+b_{n+1}=-(2a_n+b_n)$', criteria: [1-2.M1, 1-2.M2, 1-2.M3, 1-2.R1]}
    hint_ladder:
    - $x=2n$ 바로 오른쪽은 조건 (Ⅱ)의 $n+1$번째 구간이다.
    - $f(2n+h)=f(2n+2-h)$를 이용하자.
  - id: S1-2-B
    audience: B
    source_flow: rep2023.pdf p.46(인쇄 88)
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        함수 $f(x)$는 $x=2n$에서 미분가능하므로 (단, $n$은 자연수), $\lim_{h\to0+}\dfrac{f(2n+h)-f(2n)}{h}=\lim_{h\to0-}\dfrac{f(2n+h)-f(2n)}{h}$임을 알 수 있다. 한편, 문제의 조건 (Ⅰ)과 (Ⅱ)를 이용하면,
        $$\lim_{h\to0+}\dfrac{f(2n+h)-f(2n)}{h}=\lim_{h\to0+}\dfrac{f(2n+2-h)-f(2n+2)}{h}=-(4a_{n+1}+2b_{n+1})$$
      criteria: [1-2.M1]
    - id: 1-2b-2
      content: |
        $$\lim_{h\to0-}\dfrac{f(2n+h)-f(2n)}{h}=4a_n+2b_n$$
      criteria: [1-2.M2]
    - id: 1-2b-3
      content: |
        이므로, $-(2a_{n+1}+b_{n+1})=2a_n+b_n$임을 알 수 있다.
      criteria: [1-2.M3]
    - id: 1-2b-4
      content: |
        따라서, $(2a_n+b_n)(2a_{n+1}+b_{n+1})=-(2a_n+b_n)^2\le0$이다.
      criteria: [1-2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 5
      evidence: |
        $\lim_{h\to0+}\dfrac{f(2n+h)-f(2n)}{h}=-(4a_{n+1}+2b_{n+1})$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-1]
    - id: 1-2.M2
      mark_type: M
      points: 5
      evidence: |
        $\lim_{h\to0-}\dfrac{f(2n+h)-f(2n)}{h}=4a_n+2b_n$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-2]
    - id: 1-2.M3
      mark_type: M
      points: 10
      evidence: |
        $-(2a_{n+1}+b_{n+1})=2a_n+b_n$임을 보였다.
      depends_on: [1-2.M1, 1-2.M2]
      implied_ok: false
      steps: [1-2b-3]
    - id: 1-2.R1
      mark_type: R
      points: 10
      evidence: |
        $(2a_n+b_n)(2a_{n+1}+b_{n+1})=-(2a_n+b_n)^2\le0$임을 보였다.
      depends_on: [1-2.M3]
      steps: [1-2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42309}
  misconceptions:
  - id: MC-CAL-42309
    outcome_code: '71'
    wrong_work: '$x=2n$의 우미분계수를 $n$번째 식으로 계산하거나, 변환 $f(2n+h)=f(2n+2-h)$ 후 $-h$로 나누는 부호를 놓쳐 $4a_{n+1}+2b_{n+1}$로 둠'
    detect_cue: 관계식이 $2a_{n+1}+b_{n+1}=2a_n+b_n$(부호 없음)
    feedback: 오른쪽 조각은 대칭으로 뒤집힌 $n+1$번째 식입니다. 뒤집으면 미분계수의 부호가 바뀝니다.
    remedy: [RL-1]

- id: '1-3(1)'
  stem: |
    $b_1=-4$, $\lim_{x\to0+}f(x)=-1$이라고 하자.
    (1) $\displaystyle\int_2^{10}\lvert f'(x)\rvert\,dx=\dfrac qp$라 할 때, $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수) (35점)
  points: 35
  depends_on: ['1-1', '1-2']
  answer: {kind: value, value: '87', equivalents: [], tolerance: null}
  solutions:
  - id: S1-31-A
    audience: A
    method_no: 1
    key_idea: $a_1=2$로 $2a_n+b_n=0$이 되어 $f'(x)=4a_nu(u^2-1)$ ($u=x-2n+1$)이므로 $[2n-1,2n]$에서 감소, 대칭으로 $[2n-2,2n-1]$에서 증가. $\lvert f'\rvert$의 적분은 높이차의 합.
    steps:
    - {id: 1-31a, content: '$\sum_{n=1}^{4}2\left(\dfrac1{2^n}+1\right)=\dfrac{79}{8}$, $p+q=87$', criteria: [1-3(1).B1, 1-3(1).M1, 1-3(1).M2, 1-3(1).A1]}
    hint_ladder:
    - $\lim_{x\to0+}f(x)=\lim_{x\to0+}f(2-x)=f(2)$.
    - 1-2의 관계식으로 모든 $n$에서 $2a_n+b_n$의 값을 정하자.
  - id: S1-31-B
    audience: B
    source_flow: rep2023.pdf p.46(인쇄 88)
    method_no: 1
    steps:
    - id: 1-31b-1
      content: |
        문제의 조건에 의해, $\lim_{x\to0+}f(x)=\lim_{x\to0+}f(2-x)=f(2)=a_1+b_1+1=-1$이므로, $a_1=2$임을 알 수 있다. 따라서, $2a_1+b_1=0$이다.
      criteria: [1-3(1).B1]
    - id: 1-31b-2
      content: |
        【1-2】에 의하여, 자연수 $n$에 대하여 $2a_n+b_n=0$임을 알 수 있다. 이로부터 $2n-1\le x\le2n$인 실수 $x$에 대하여 (단, $n$은 자연수),
        $f(x)=a_n(x-2n+1)^4-2a_n(x-2n+1)^2+\dfrac{1}{2^{n-1}}$,
        $f'(x)=4a_n(x-2n+1)^3-4a_n(x-2n+1)=4a_n(x-2n+1)\{(x-2n+1)^2-1\}$이다.
      criteria: [1-3(1).M1]
    - id: 1-31b-3
      content: |
        그러므로,
        $$\int_2^{10}\lvert f'(x)\rvert dx=\int_2^3\lvert f'(x)\rvert dx+\int_3^4\lvert f'(x)\rvert dx+\cdots+\int_8^9\lvert f'(x)\rvert dx+\int_9^{10}\lvert f'(x)\rvert dx=\int_2^3f'(x)\,dx-\int_3^4f'(x)\,dx+\cdots+\int_8^9f'(x)\,dx-\int_9^{10}f'(x)\,dx$$
      criteria: [1-3(1).M2]
    - id: 1-31b-4
      content: |
        $=\{f(3)-f(2)\}-\{f(4)-f(3)\}+\cdots+\{f(9)-f(8)\}-\{f(10)-f(9)\}=\displaystyle\sum_{n=1}^{4}2\left(\dfrac1{2^n}+1\right)=\dfrac{79}{8}$이다. 따라서, $p+q=8+79=87$이다.
      criteria: [1-3(1).A1]
