      evidence: |
        자연수 $k$에 대하여 $\dfrac1{2^k}\le t<\dfrac1{2^{k-1}}$이면 $m(t)=2k$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1-32b-1]
    - id: 1-3(2).M2
      mark_type: M
      points: 10
      evidence: |
        $0<t<1$일 때, $2\left(-1+\dfrac1{\log_2t}\right)<\dfrac{m(t)}{\log_2t}\le-2$가 성립함을 보였다.
      depends_on: [1-3(2).M1]
      implied_ok: false
      steps: [1-32b-2]
    - id: 1-3(2).A1
      mark_type: A
      points: 15
      evidence: |
        $\lim_{t\to0+}\dfrac{m(t)}{\log_2t}=-2$를 구했다.
      depends_on: [1-3(2).M2]
      cao: true
      steps: [1-32b-3]
    deductions: []
