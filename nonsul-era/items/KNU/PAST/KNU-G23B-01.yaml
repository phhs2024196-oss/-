intent: |
  미분계수의 정의를 이해하고 함수의 성질을 활용하여 미분계수를 구할 수 있는지(1-1), 미분계수를 구하고 수열의 관계를 구할 수 있는지(1-2), 함수의 그래프의 개형을 이해하고 정적분을 구할 수 있는지(1-3(1)), 함수의 극한의 대소 관계를 이해하고 함수의 극한을 구할 수 있는지(1-3(2)) 평가한다.
key_idea: |
  조건 (Ⅱ)는 $f$의 그래프가 직선 $x=2n-1$에 대하여 대칭이라는 뜻이다. 대칭축 $x=2n-1$에서 좌·우미분계수가 $c_n$, $-c_n$이므로 $c_n=0$. 이음점 $x=2n$에서 좌미분계수 $4a_n+2b_n$, 우미분계수 $-(4a_{n+1}+2b_{n+1})$이 같아 $2a_{n+1}+b_{n+1}=-(2a_n+b_n)$. 1-3은 $2a_n+b_n=0$이 되어 $f$가 홀수점에서 극대, 짝수점에서 극소인 진동 그래프가 된다.
stuck: |
  조건 (Ⅱ)를 대칭으로 읽고 $x=2n-1$, $x=2n$에서 좌·우미분계수를 $h\to0\pm$로 나누어 계산하는 단계, 1-3(1)에서 $|f'|$의 적분을 증감에 따라 구간별 부호로 나누는 단계, 1-3(2)에서 $t$가 $\tfrac1{2^k}\le t<\tfrac1{2^{k-1}}$일 때 교점 수 $2k$를 세고 $\log_2t$로 끼우는 단계
