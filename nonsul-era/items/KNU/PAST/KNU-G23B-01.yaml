  - '조건 (Ⅱ) $2n-2<x<2n-1$에서 $f(x)=f(4n-2-x)$ (직선 $x=2n-1$에 대한 대칭)'
  - '$b_1=-4$, $\lim_{x\to0+}f(x)=-1$'
  - '$g(x)=\lvert f(x)-t\rvert$의 미분불가능한 점의 개수 $m(t)$'
  concepts:
  - '미분계수의 정의와 좌·우미분계수'
  - '함수의 극한(좌극한·우극한)'
  - '등비수열의 합'
  - '정적분의 구간 분할'
  - '함수의 극한의 대소 관계'
  tools:
  - '$\lim_{h\to0-}\dfrac{f(2n-1+h)-f(2n-1)}{h}=\lim_{h\to0+}\dfrac{f(2n-1+h)-f(2n-1)}{-h}$ (대칭)'
  - '$x=2n$의 우미분계수를 $f(2n+h)=f(2n+2-h)$로 다음 조각의 좌미분으로 변환'
  - '$f''(x)=4a_n(x-2n+1)\{(x-2n+1)^2-1\}$로 각 단위구간에서 단조'
  - '$\int_2^{10}\lvert f''\rvert dx$를 $f$의 증감 구간별 차로 망원합'
  - '$-\log_2t\le k<-\log_2t+1$로 $\dfrac{m(t)}{\log_2t}$를 끼움'
  conditions:
  - '$f$는 $(0,\infty)$에서 미분가능(따라서 $x=2n-1$, $x=2n$에서 좌·우미분계수 일치)'
  - '1-3(1)의 $p$, $q$는 서로소인 자연수'
  - '$t>0$'
