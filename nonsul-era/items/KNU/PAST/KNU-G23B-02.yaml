stimuli:
- label: (가)
  body: |
    미분가능한 함수 $f(x)$의 도함수 $f'(x)$는
    $$f'(x)=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}$$
- label: (나)
  body: |
    $y=a^x$ $(a>0,\ a\ne1)$이면,
    $$y'=a^x\ln a$$
    이다. 또한,
    $$\lim_{h\to0}\dfrac{a^h-1}{h}=\ln a$$
- label: (다)
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능할 때,
    $$\{f(x)g(x)\}'=f'(x)g(x)+f(x)g'(x)$$
- label: (라)
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는
    $$y'=f'(g(x))g'(x)$$
- label: (마)
  body: |
    함수 $f(x)$가 두 실수 $a,b$를 포함하는 구간에서 연속일 때, $f(x)$의 한 부정적분을 $F(x)$라고 하면 $f(x)$의 $a$에서 $b$까지의 정적분은
    $$\int_a^bf(x)\,dx=\bigl[F(x)\bigr]_a^b=F(b)-F(a)$$

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  실수 전체의 집합에서 미분가능한 두 함수 $f(x)$, $g(x)$가 모든 실수 $x$, $y$에 대하여 다음 조건을 만족시킨다.

  〈조건〉
  (Ⅰ) $f(x+y)=2023^yf(x)+2023^xf(y)$
  (Ⅱ) $g(x+y)=2023^{xy(2x^2+3xy+2y^2)}g(x)g(y)$
  (Ⅲ) $g(x)>0$

  다음 물음에 답하시오.

subparts:
- id: '2-1'
  stem: |
    모든 실수 $x$에 대하여,
    $$f'(x)-f(x)\ln2023=f'(0)2023^x$$
    임을 증명하시오. (25점)
  points: 25
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: $f(0)=0$을 얻고 $y=h$를 대입한 차분몫을 $\dfrac{2023^h-1}{h}f(x)+2023^x\dfrac{f(h)-f(0)}{h}$로 나눠 극한.
    steps:
    - {id: 2-1a, content: '$f''(x)=f(x)\ln2023+2023^xf''(0)$', criteria: [2-1.B1, 2-1.M1, 2-1.R1]}
    hint_ladder:
    - $x=y=0$을 대입해 보자.
    - $f(x+h)-f(x)$를 조건 (Ⅰ)로 정리하자.
  - id: S2-1-B
    audience: B
    source_flow: rep2023.pdf p.49(인쇄 93)
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        $f(x+y)=2023^yf(x)+2023^xf(y)$에 $x=y=0$을 대입하면, $f(0)=0$을 얻을 수 있다.
      criteria: [2-1.B1]
    - id: 2-1b-2
      content: |
        $f(x+y)=2023^yf(x)+2023^xf(y)$에 $y=h$를 대입하면, $f(x+h)=2023^hf(x)+2023^xf(h)$이다. 양변에서 $f(x)$를 빼고 $h\ne0$인 $h$로 나누면 $f(0)=0$이므로
        $$\dfrac{f(x+h)-f(x)}{h}=\dfrac{2023^h-1}{h}f(x)+2023^x\dfrac{f(h)-f(0)}{h}$$
        을 얻는다.
      criteria: [2-1.M1]
    - id: 2-1b-3
      content: |
        $h$를 $0$으로 보내는 극한을 취하면,
        $$\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}=\lim_{h\to0}\dfrac{2023^h-1}{h}f(x)+2023^x\lim_{h\to0}\dfrac{f(h)-f(0)}{h}$$
        을 얻고 미분계수 및 도함수의 정의에 의해 $f'(x)=\ln2023f(x)+2023^xf'(0)$을 얻는다. 정리하면 $f'(x)-f(x)\ln2023=2023^xf'(0)$이다.
      criteria: [2-1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.B1
      mark_type: B
      points: 5
      evidence: |
        $x=y=0$을 대입하여 $f(0)=0$을 얻었다.
      steps: [2-1b-1]
    - id: 2-1.M1
      mark_type: M
      points: 10
      evidence: |
        $f(0)=0$으로부터 $\dfrac{f(x+h)-f(x)}{h}=\dfrac{2023^h-1}{h}f(x)+2023^x\dfrac{f(h)-f(0)}{h}$을 얻었다.
      depends_on: [2-1.B1]
      implied_ok: false
      steps: [2-1b-2]
    - id: 2-1.R1
      mark_type: R
      points: 10
      evidence: |
        $h$를 $0$으로 보내는 극한으로부터 $f'(x)-f(x)\ln2023=2023^xf'(0)$을 얻었다.
      depends_on: [2-1.M1]
      steps: [2-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42312}
  misconceptions:
  - id: MC-CAL-42312
    outcome_code: '71'
    wrong_work: '조건 (Ⅰ)의 양변을 $y$에 대해 미분하고 $y=0$을 대입하면서 $f(0)=0$을 쓰지 않거나, $f''(0)$을 $\lim\dfrac{f(h)}{h}$로 바꾸는 근거(f(0)=0)를 생략'
    detect_cue: $f(0)=0$ 언급 없음
    feedback: $\dfrac{f(h)}{h}\to f'(0)$이 되려면 $f(0)=0$이어야 합니다. 먼저 $x=y=0$을 대입하세요.
    remedy: [RL-1]

- id: '2-2'
  stem: |
    $f(2023)=2023$일 때, 함수 $f(x)$를 구하시오. (40점)
  points: 40
  depends_on: ['2-1']
  answer: {kind: expression, value: 'x*2023**(x-2023)', equivalents: ['$f(x)=x2023^{x-2023}$'], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $\{2023^{-x}f(x)\}'=f'(0)$이므로 $f(x)=f'(0)x2023^x$, $f(2023)=2023$으로 $f'(0)=2023^{-2023}$.
    steps:
    - {id: 2-2a, content: '$f(x)=x2023^{x-2023}$', criteria: [2-2.M1, 2-2.M2, 2-2.M3, 2-2.A1]}
    hint_ladder:
    - 2-1의 식 양변에 $2023^{-x}$를 곱해 보자.
    - 좌변이 어떤 함수의 도함수인가?
  - id: S2-2-B
    audience: B
    source_flow: rep2023.pdf p.49(인쇄 94)
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        곱의 미분법에 의해 $\{2023^{-x}f(x)\}'=-2023^{-x}\ln2023f(x)+2023^{-x}f'(x)$이다. 【2-1】에 의해 $f'(x)-f(x)\ln2023=2023^xf'(0)$이므로 $\{2023^{-x}f(x)\}'=-2023^{-x}\ln2023f(x)+2023^{-x}f'(x)=f'(0)$이다.
      criteria: [2-2.M1]
    - id: 2-2b-2
      content: |
        $h(x)=2023^{-x}f(x)$이라 하면, 모든 실수 $x$에 대해 함수 $h'(x)=f'(0)$은 상수이므로 $h(x)=f'(0)x+C$이다. ($C$는 적분상수)
      criteria: [2-2.M2]
    - id: 2-2b-3
      content: |
        $h(0)=f(0)=0$이므로 $C=0$이다. 따라서 $2023^{-x}f(x)=h(x)=f'(0)x$이고 $f(x)=f'(0)x2023^x$이다.
      criteria: [2-2.M3]
    - id: 2-2b-4
      content: |
        $f(2023)=2023$이므로 $f'(0)=2023^{-2023}$이다. 따라서 $f(x)=x2023^{x-2023}$이다.
      criteria: [2-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 15
      evidence: |
        함수의 곱의 미분법과 문항 1의 결과로부터 $\{2023^{-x}f(x)\}'=-2023^{-x}\ln2023f(x)+2023^{-x}f'(x)=f'(0)$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2-2b-1]
    - id: 2-2.M2
      mark_type: M
      points: 10
      evidence: |
        $h(x)=2023^{-x}f(x)$이라 하면 도함수 $h'(x)=f'(0)$이 상수함수임을 관찰하여 $h(x)=f'(0)x+C$를 얻었다. ($C$는 적분상수)
      depends_on: [2-2.M1]
      implied_ok: false
      steps: [2-2b-2]
    - id: 2-2.M3
      mark_type: M
      points: 5
      evidence: |
        $h(0)=f(0)=0$으로부터 $C=0$을 관찰하여 $f(x)=f'(0)x2023^x$임을 얻었다.
      depends_on: [2-2.M2]
      implied_ok: false
      steps: [2-2b-3]
    - id: 2-2.A1
      mark_type: A
      points: 10
      evidence: |
        $f(2023)=2023$으로부터 $f(x)=x2023^{x-2023}$을 얻었다.
      depends_on: [2-2.M3]
      cao: true
      steps: [2-2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42313}
  misconceptions:
  - id: MC-CAL-42313
    outcome_code: '71'
    wrong_work: '$f''=f\ln2023+\cdots$를 보고 $f(x)=C2023^x$ 꼴만 가정해 $f(x)=2023^{x-2022}$ 등으로 답함(우변 $f''(0)2023^x$ 항 무시)'
    detect_cue: 답에 인수 $x$가 없음, $f(0)=0$과 모순
    feedback: 우변 $f'(0)2023^x$ 때문에 $2023^{-x}f(x)$의 도함수가 0이 아닌 상수입니다. 일차함수 $f'(0)x+C$가 됩니다.
    remedy: [RL-2]

- id: '2-3'
  stem: |
    $g(2023)=2023$일 때, 함수 $g(x)$를 구하시오. (45점)
  points: 45
  depends_on: ['2-1']
  answer: {kind: expression, value: '2023**((x**4-2023**3*x)/2+x/2023)', equivalents: ['$g(x)=2023^{\frac{x^4-2023^3x}{2}+\frac{x}{2023}}$'], tolerance: null}
  solutions:
  - id: S2-3-A
    audience: A
    method_no: 1
    key_idea: $xy(2x^2+3xy+2y^2)=\dfrac{(x+y)^4-x^4-y^4}{2}$이므로 $k(x)=\log_{2023}\left(2023^{-\frac{x^4}{2}}g(x)\right)$는 $k(x+y)=k(x)+k(y)$, $k(0)=0$, 미분가능 → $k(x)=cx$.
    steps:
    - {id: 2-3a, content: '$g(x)=2023^{\frac{x^4}{2}+cx}$, $c=-\dfrac{2023^3}{2}+\dfrac1{2023}$', criteria: [2-3.B1, 2-3.M1, 2-3.M2, 2-3.M3, 2-3.A1]}
    hint_ladder:
    - $(x+y)^4$을 전개해 지수와 비교하자.
    - 양변에 $2023^{-\frac{(x+y)^4}{2}}$을 곱하고 로그를 취하자.
  - id: S2-3-B
    audience: B
    source_flow: rep2023.pdf p.49(인쇄 94)
    method_no: 1
    steps:
    - id: 2-3b-1
      content: |
        $g(x+y)=2023^{xy(2x^2+3xy+2y^2)}g(x)g(y)$에 $x=y=0$을 대입하면, $g(0)=g(0)g(0)$이고 모든 실수 $x$에 대해서 함숫값 $g(x)$는 양의 실수이므로 $g(0)=1$이다.
      criteria: [2-3.B1]
    - id: 2-3b-2
      content: |
        $2023^{xy(2x^2+3xy+2y^2)}=2023^{\frac{(x+y)^4}{2}-\frac{x^4}{2}-\frac{y^4}{2}}$이므로 조건 (Ⅱ)에 의해,
        $$2023^{-\frac{(x+y)^4}{2}}g(x+y)=2023^{-\frac{x^4}{2}}g(x)2023^{-\frac{y^4}{2}}g(y)$$
        임을 알 수 있다.
      criteria: [2-3.M1]
    - id: 2-3b-3
      content: |
        $k(x)=\log_{2023}\left(2023^{-\frac{x^4}{2}}g(x)\right)$라 하면, $k(x+y)=k(x)+k(y)$가 모든 실수 $x,y$에 대해 성립한다.
      criteria: [2-3.M2]
    - id: 2-3b-4
      content: |
        $g(0)=1$이므로 $k(0)=\log_{2023}g(0)=0$이다. $k(x+h)-k(x)=k(h)-k(0)$이므로 $k'(x)=\lim_{h\to0}\dfrac{k(x+h)-k(x)}{h}$에서 $k'(x)=k'(0)$을 얻고 $k(0)=0$이므로 $k(x)=cx$인 상수 $c$가 존재한다.
      criteria: [2-3.M3]
    - id: 2-3b-5
      content: |
        $g(x)=2023^{\frac{x^4}{2}+cx}$이고 $g(2023)=2023$이므로 $c=-\dfrac{2023^3}{2}+\dfrac{1}{2023}$이다. $g(x)=2023^{\frac{x^4-2023^3x}{2}+\frac{x}{2023}}$이다.
