intent: |
  도함수와 미분계수의 정의를 이해하고 있는지, 지수함수·합성함수 및 함수의 곱의 미분을 구할 수 있는지, 여러 가지 함수의 부정적분을 구할 수 있는지 평가한다. (2-1 증명, 2-2·2-3 함수방정식으로부터 함수 결정)
key_idea: |
  (Ⅰ)에서 $y=h$로 두고 미분계수의 정의로 $f'(x)=f(x)\ln2023+2023^xf'(0)$을 얻고, $\{2023^{-x}f(x)\}'=f'(0)$이 상수이므로 $f(x)=f'(0)x2023^x$. (Ⅱ)는 지수 $xy(2x^2+3xy+2y^2)=\dfrac{(x+y)^4-x^4-y^4}{2}$로 보고 $k(x)=\log_{2023}\left(2023^{-\frac{x^4}{2}}g(x)\right)$가 덧셈적 함수 $k(x+y)=k(x)+k(y)$임을 이용해 $k(x)=cx$.
stuck: |
  2-2에서 $2023^{-x}$를 곱해 도함수가 상수인 보조함수를 만드는 단계, 2-3에서 지수 $xy(2x^2+3xy+2y^2)$를 $\dfrac{(x+y)^4-x^4-y^4}{2}$로 알아보고 로그를 취해 덧셈 함수방정식으로 바꾸는 단계
