intent: |
  치환적분법과 평균값 정리를 이해하고 정적분에 대한 간단한 성질을 증명할 수 있는지(3-1), '정적분과 급수의 합 사이의 관계'를 이해하고 정적분을 근사할 수 있는지(3-2), '정적분과 급수의 합 사이의 관계'와 수열의 극한의 대소 관계를 이해하고 수열의 극한을 구할 수 있는지(3-3) 평가한다.
key_idea: |
  감소함수 $h(x)=f(g(x))g'(x)$의 부정적분 $F$에 평균값 정리를 쓰면 $h(i+1)<F(i+1)-F(i)<h(i)$이고, 치환적분으로 $F(n+1)-F(m)=\int_{g(m)}^{g(n+1)}f(u)\,du$. 3-2·3-3은 주어진 적분/합이 $h=f(g)g'$ 꼴이 되도록 $f$, $g$를 스스로 찾는 것이 핵심 — 3-2는 $f(x)=2^{\frac1x}$, $g(x)=\dfrac1{x+3}$, 3-3은 $f(x)=-\ln x$, $g(x)=\dfrac{x^2+1}{x+1}$.
stuck: |
  3-2에서 적분 구간 $\left[\tfrac17,\tfrac14\right]$을 $g(4)$, $g(1)$로 읽어 $g(x)=\dfrac1{x+3}$을 찾는 단계, 3-3에서 합의 일반항 $\dfrac{k^2+2k-1}{(k+1)^2}\ln\dfrac{k+1}{k^2+1}$이 $\left(-\ln\dfrac{k^2+1}{k+1}\right)\left(\dfrac{k^2+1}{k+1}\right)'$임을 알아보는 단계, 그리고 $a_n$을 위·아래 적분으로 끼워 두 극한을 각각 $-4$로 계산하는 단계
