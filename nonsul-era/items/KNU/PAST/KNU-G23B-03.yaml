  tools:
  - '$F''=h$에 평균값 정리: $h(c_i)=F(i+1)-F(i)$, $h(i+1)<h(c_i)<h(i)$'
  - '3-2: $f(x)=2^{\frac1x}$, $g(x)=\dfrac1{x+3}$, $h(x)=\dfrac{-2^{x+3}}{(x+3)^2}$, $m=1$, $n=3$'
  - '3-3: $f(x)=-\ln x$, $g(x)=\dfrac{x^2+1}{x+1}$, $h(x)=-\ln\dfrac{x^2+1}{x+1}\cdot\dfrac{x^2+2x-1}{(x+1)^2}$, $h(1)=0$'
