stimuli:
- label: (가)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능하면,
    $$\dfrac{f(b)-f(a)}{b-a}=f'(c)$$
    인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: (나)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때 도함수 $g'(t)$가 $\alpha,\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
- label: (다)
  body: |
    두 수열 $\{a_n\}$, $\{b_n\}$이 각각 수렴하고
    $$\lim_{n\to\infty}a_n=\alpha,\quad\lim_{n\to\infty}b_n=\beta$$
    일 때,
    (1) 모든 자연수 $n$에 대하여 $a_n\le b_n$이면 $\alpha\le\beta$이다.
    (2) 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $\alpha=\beta$이면 $\lim_{n\to\infty}c_n=\alpha$이다.
- label: (라)
  body: |
    닫힌구간 $[a,b]$에서 두 함수 $f(x)$, $g(x)$가 미분가능하고, $f'(x)$, $g'(x)$가 연속일 때,
    $$\int_a^bf(x)g'(x)\,dx=\bigl[f(x)g(x)\bigr]_a^b-\int_a^bf'(x)g(x)\,dx$$

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  자연수 $m$에 대하여, 구간 $(0,\infty)$에서 연속인 두 함수 $f(x)$, $g(x)$가 다음 조건을 만족시킨다.

  〈조건〉
  (Ⅰ) 구간 $(0,\infty)$에서 함수 $g(x)$는 미분가능하고 도함수 $g'(x)$는 연속이다.
  (Ⅱ) 모든 양수 $x$에 대하여 $g(x)>0$이다.
  (Ⅲ) 함수 $h(x)=f(g(x))g'(x)$는 구간 $[m,\infty)$에서 감소한다.

  다음 물음에 답하시오.

subparts:
- id: '3-1'
  stem: |
    $n\ge m$인 모든 자연수 $n$에 대하여 부등식
    $$\sum_{i=m+1}^{n+1}h(i)<\int_{g(m)}^{g(n+1)}f(x)\,dx<\sum_{i=m}^{n}h(i)$$
    를 증명하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-1-A
    audience: A
    method_no: 1
    key_idea: $h$의 부정적분 $F$에 대해 평균값 정리와 감소성으로 $h(i+1)<F(i+1)-F(i)<h(i)$를 $i=m,\dots,n$에서 더하고, 치환적분으로 $F(n+1)-F(m)=\int_{g(m)}^{g(n+1)}f$.
    steps:
    - {id: 3-1a, content: '$\sum_{i=m+1}^{n+1}h(i)<F(n+1)-F(m)<\sum_{i=m}^nh(i)$, $F(n+1)-F(m)=\int_{g(m)}^{g(n+1)}f(u)du$', criteria: [3-1.M1, 3-1.M2, 3-1.M3, 3-1.M4]}
    hint_ladder:
    - 구간 $[i,i+1]$에서 $h$의 적분을 위·아래로 평가해 보자.
    - $\int_m^{n+1}f(g(x))g'(x)\,dx$는 무엇과 같은가?
  - id: S3-1-B
    audience: B
    source_flow: rep2023.pdf p.52(인쇄 99)
    method_no: 1
    steps:
    - id: 3-1b-1
      content: |
        함수 $h(x)$의 부정적분을 $F(x)$라 하자. 각각의 자연수 $i$에 대하여, 평균값 정리에 의해 $h(c_i)=\dfrac{F(i+1)-F(i)}{(i+1)-i}=F(i+1)-F(i)$를 만족하는 $c_i$가 열린구간 $(i,i+1)$에 존재한다.
      criteria: [3-1.M1]
    - id: 3-1b-2
      content: |
        함수 $h(x)$는 구간 $[m,\infty)$에서 감소하므로 각각의 자연수 $i$ $(i\ge m)$에 대하여 $h(i+1)<h(c_i)<h(i)$가 성립한다.
      criteria: [3-1.M2]
    - id: 3-1b-3
      content: |
        따라서 $\displaystyle\sum_{i=m+1}^{n+1}h(i)<F(n+1)-F(m)<\sum_{i=m}^{n}h(i)$이다.
      criteria: [3-1.M3]
    - id: 3-1b-4
      content: |
        한편, 치환적분법에 의해 $F(n+1)-F(m)=\displaystyle\int_m^{n+1}f(g(x))g'(x)\,dx=\int_{g(m)}^{g(n+1)}f(u)\,du$이다. 따라서, $\displaystyle\sum_{i=m+1}^{n+1}h(i)<\int_{g(m)}^{g(n+1)}f(x)\,dx<\sum_{i=m}^{n}h(i)$이다.
      criteria: [3-1.M4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 5
      evidence: |
        평균값 정리를 활용하여 $h(c_i)=F(i+1)-F(i)$를 만족하는 $c_i$가 열린구간 $(i,i+1)$에 존재함을 보였다.
      depends_on: []
      implied_ok: false
      steps: [3-1b-1]
    - id: 3-1.M2
      mark_type: M
      points: 5
      evidence: |
        자연수 $i$ $(i\ge m)$에 대하여 $h(i+1)<h(c_i)<h(i)$가 성립함을 보였다.
      depends_on: [3-1.M1]
      implied_ok: false
      steps: [3-1b-2]
    - id: 3-1.M3
      mark_type: M
      points: 10
      evidence: |
        $\sum_{i=m+1}^{n+1}h(i)<F(n+1)-F(m)<\sum_{i=m}^{n}h(i)$을 유도했다.
      depends_on: [3-1.M2]
      implied_ok: false
      steps: [3-1b-3]
    - id: 3-1.M4
      mark_type: M
      points: 10
      evidence: |
        $F(n+1)-F(m)=\int_{g(m)}^{g(n+1)}f(u)\,du$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [3-1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42315}
  misconceptions:
  - id: MC-CAL-42315
    outcome_code: '71'
    wrong_work: '감소함수에서 $h(i)<\int_i^{i+1}h<h(i+1)$로 부등호 방향을 뒤집거나, 합의 첨자 범위($m+1\sim n+1$ 과 $m\sim n$)를 바꿔 씀'
    detect_cue: 부등식 좌우의 합 범위가 뒤바뀜
    feedback: 감소함수는 왼쪽 끝값이 가장 큽니다. 구간 $[i,i+1]$의 적분은 $h(i+1)$과 $h(i)$ 사이입니다.
    remedy: [RL-1]

- id: '3-2'
  stem: |
    정적분
    $$\dfrac12\int_{\frac17}^{\frac14}2^{\frac1x}dx$$
    의 값의 정수부분을 구하시오. (40점)
  points: 40
  depends_on: ['3-1']
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=2^{\frac1x}$, $g(x)=\dfrac1{x+3}$로 두면 $g(1)=\tfrac14$, $g(4)=\tfrac17$, $h(x)=-\dfrac{2^{x+3}}{(x+3)^2}$이 $[1,\infty)$에서 감소하므로 3-1($m=1$, $n=3$) 적용.
    steps:
    - {id: 3-2a, content: '$2.03\approx\dfrac{2^3}{4^2}+\dfrac{2^4}{5^2}+\dfrac{2^5}{6^2}<\dfrac12\int<\dfrac{2^4}{5^2}+\dfrac{2^5}{6^2}+\dfrac{2^6}{7^2}\approx2.84$', criteria: [3-2.B1, 3-2.M1, 3-2.M2, 3-2.M3, 3-2.A1]}
    hint_ladder:
    - 적분 구간의 끝 $\tfrac14$, $\tfrac17$을 $\tfrac1{1+3}$, $\tfrac1{4+3}$으로 보자.
    - $f(g(x))g'(x)$를 계산하고 감소함을 확인하자.
  - id: S3-2-B
    audience: B
    source_flow: rep2023.pdf p.52(인쇄 99)
    method_no: 1
    steps:
    - id: 3-2b-1
      content: |
        $f(x)=2^{\frac1x}$, $g(x)=\dfrac1{x+3}$이라 두자. 그러면 $h(x)=f(g(x))g'(x)=\dfrac{-2^{x+3}}{(x+3)^2}$이고 $\sum_{i=1}^{n}h(i)=\sum_{i=1}^{n}\dfrac{-2^{i+3}}{(i+3)^2}$이다. 한편, $\sum_{i=1}^{1}h(i)=-\dfrac{2^4}{4^2}$, $\sum_{i=1}^{3}h(i)=-\left(\dfrac{2^4}{4^2}+\dfrac{2^5}{5^2}+\dfrac{2^6}{6^2}\right)$, $\sum_{i=1}^{4}h(i)=-\left(\dfrac{2^4}{4^2}+\dfrac{2^5}{5^2}+\dfrac{2^6}{6^2}+\dfrac{2^7}{7^2}\right)$이다.
      criteria: [3-2.B1]
    - id: 3-2b-2
      content: |
        구간 $(0,\infty)$에서 함수 $f(x)$는 연속이며 함수 $g(x)$는 미분가능하며 $g'(x)$는 연속이다. 또한, $x>1$일 때 $h'(x)=-\dfrac{2^{x+3}\{(x+3)\ln2-2\}}{(x+3)^3}<0$이므로 함수 $h(x)$는 구간 $[1,\infty)$에서 감소한다.
      criteria: [3-2.M1]
    - id: 3-2b-3
      content: |
        따라서, 【3-1】에 의해 $-\left(\dfrac{2^5}{5^2}+\dfrac{2^6}{6^2}+\dfrac{2^7}{7^2}\right)=\sum_{i=2}^{4}h(i)<\int_{\frac14}^{\frac17}f(x)\,dx<\sum_{i=1}^{3}h(i)=-\left(\dfrac{2^4}{4^2}+\dfrac{2^5}{5^2}+\dfrac{2^6}{6^2}\right)$이므로
        $$2.03\approx\dfrac{2^3}{4^2}+\dfrac{2^4}{5^2}+\dfrac{2^5}{6^2}<\dfrac12\int_{\frac17}^{\frac14}2^{\frac1x}dx<\dfrac{2^4}{5^2}+\dfrac{2^5}{6^2}+\dfrac{2^6}{7^2}\approx2.84$$
        이다.
      criteria: [3-2.M2, 3-2.M3]
    - id: 3-2b-4
      content: |
        따라서, 정답은 $2$이다.
      criteria: [3-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-2.B1
      mark_type: B
      points: 5
      evidence: |
        문제의 조건을 만족시키는 두 함수 $f(x)$, $g(x)$를 구했다. 예) $f(x)=2^{\frac1x}$, $g(x)=\dfrac1{x+3}$
      steps: [3-2b-1]
    - id: 3-2.M1
      mark_type: M
      points: 10
      evidence: |
        함수 $h(x)$가 구간 $[m,\infty)$에서 감소함을 보였다. 예) $h(x)=f(g(x))g'(x)=\dfrac{-2^{x+3}}{(x+3)^2}$는 구간 $[1,\infty)$에서 감소
      depends_on: [3-2.B1]
      implied_ok: false
      steps: [3-2b-2]
    - id: 3-2.M2
      mark_type: M
      points: 10
      evidence: |
        $2<\dfrac12\int_{\frac17}^{\frac14}2^{\frac1x}dx$임을 보였다. (각 10점)
      depends_on: [3-2.M1]
      implied_ok: false
      steps: [3-2b-3]
    - id: 3-2.M3
      mark_type: M
      points: 10
      evidence: |
        $\dfrac12\int_{\frac17}^{\frac14}2^{\frac1x}dx<3$임을 보였다. (각 10점)
      depends_on: [3-2.M1]
      implied_ok: false
      steps: [3-2b-3]
    - id: 3-2.A1
      mark_type: A
      points: 5
      evidence: |
        정수부분 $2$를 구했다.
      depends_on: [3-2.M2, 3-2.M3]
      cao: true
      steps: [3-2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42316}
  misconceptions:
  - id: MC-CAL-42316
    outcome_code: '71'
    wrong_work: '$g(x)=\dfrac1x$로 잡아 $m=4$, $n=6$에서 끼우거나($h$의 감소 확인 없이), 치환 후 적분 구간의 위·아래가 바뀌는 부호($\int_{1/4}^{1/7}$은 음수)를 놓침'
    detect_cue: 상·하한이 음수로 나오거나 정수부분 판정에 쓸 수 없는 넓은 범위
    feedback: $g$는 감소함수라 $g(1)=\tfrac14>g(4)=\tfrac17$입니다. 부호를 정리하고, $h$가 감소함을 $h'$로 반드시 확인하세요.
    remedy: [RL-2]

- id: '3-3'
  stem: |
    자연수 $n$에 대하여
    $$a_n=\dfrac{4}{(n+1)\ln(n+1)}\sum_{k=1}^{n+1}\left\{\dfrac{k^2+2k-1}{(k+1)^2}\ln\dfrac{k+1}{k^2+1}\right\}$$
    일 때, $\displaystyle\lim_{n\to\infty}a_n$의 값을 구하시오. (50점)
  points: 50
  depends_on: ['3-1']
  answer: {kind: value, value: '-4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-3-A
    audience: A
    method_no: 1
    key_idea: $f(x)=-\ln x$, $g(x)=\dfrac{x^2+1}{x+1}$로 두면 합의 일반항이 $h(k)$이고 $h(1)=0$. 3-1로 합을 $\int_1^{g(n+1)}(-\ln x)dx$로 위·아래에서 끼우면 양쪽 극한이 $-4$.
    steps:
    - {id: 3-3a, content: '$c_n<a_n<b_n$, $b_n,c_n\to-4$ 이므로 $\lim a_n=-4$', criteria: [3-3.B1, 3-3.M1, 3-3.M2, 3-3.M3, 3-3.M4, 3-3.A1]}
    hint_ladder:
    - $\left(\dfrac{x^2+1}{x+1}\right)'=\dfrac{x^2+2x-1}{(x+1)^2}$이다.
    - $\ln\dfrac{k+1}{k^2+1}=-\ln g(k)$로 보자.
  - id: S3-3-B
    audience: B
    source_flow: rep2023.pdf p.52(인쇄 100)
    method_no: 1
    steps:
    - id: 3-3b-1
      content: |
        $f(x)=-\ln x$, $g(x)=\dfrac{x^2+1}{x+1}$라 두자. 그러면 $h(x)=f(g(x))g'(x)=\left\{-\ln\left(\dfrac{x^2+1}{x+1}\right)\right\}\left\{\dfrac{x^2+2x-1}{(x+1)^2}\right\}$이고 $\displaystyle\sum_{i=1}^{n}h(i)=-\sum_{i=1}^{n}\left[\left\{\ln\left(\dfrac{i^2+1}{i+1}\right)\right\}\left\{\dfrac{i^2+2i-1}{(i+1)^2}\right\}\right]$이다.
      criteria: [3-3.B1]
    - id: 3-3b-2
      content: |
        구간 $(0,\infty)$에서 함수 $f(x)$는 연속이며 함수 $g(x)$는 미분가능하며 $g'(x)$는 연속이다. $x>1$일 때
        $h'(x)=-\left[\left(\dfrac{x+1}{x^2+1}\right)\left\{\dfrac{x^2+2x-1}{(x+1)^2}\right\}^2+\left(\ln\dfrac{x^2+1}{x+1}\right)\left\{\dfrac{4}{(x+1)^3}\right\}\right]<0$이므로 함수 $h(x)$는 구간 $[1,\infty)$에서 감소한다.
      criteria: [3-3.M1]
    - id: 3-3b-3
      content: |
        $h(1)=0$이며 문제 【3-1】에 의해 $n\ge1$일 때 아래의 부등식을 얻을 수 있다.
        $$-\sum_{i=1}^{n+1}\left[\left\{\ln\left(\dfrac{i^2+1}{i+1}\right)\right\}\left\{\dfrac{i^2+2i-1}{(i+1)^2}\right\}\right]<\int_1^{\frac{n^2+2n+2}{n+2}}(-\ln x)\,dx<-\sum_{i=1}^{n}\left[\left\{\ln\left(\dfrac{i^2+1}{i+1}\right)\right\}\left\{\dfrac{i^2+2i-1}{(i+1)^2}\right\}\right]$$
        따라서, $n\ge1$일 때 $a_n<\dfrac{4}{(n+1)\ln(n+1)}\displaystyle\int_1^{\frac{n^2+2n+2}{n+2}}(-\ln x)\,dx$이고 $n\ge2$일 때 $\dfrac{4}{n\ln n}\displaystyle\int_1^{\frac{n^2+2n+2}{n+2}}(-\ln x)\,dx<a_{n-1}$이다. 한편, 부분적분법에 의해 $\int(-\ln x)\,dx=-x\ln x+\int1\,dx=-x(\ln x-1)+C$이다. ($C$는 적분상수) 따라서, $\displaystyle\int_1^{\frac{n^2+2n+2}{n+2}}(-\ln x)\,dx=-\dfrac{n^2+2n+2}{n+2}\left(\ln\dfrac{n^2+2n+2}{n+2}-1\right)-1$이다.
        $c_{n-1}=-\dfrac{4}{n\ln n}\left\{\dfrac{n^2+2n+2}{n+2}\left(\ln\dfrac{n^2+2n+2}{n+2}-1\right)+1\right\}$ $(n\ge2)$이라 하면 모든 자연수 $n$에 대하여 $c_n<a_n$이 성립한다.
      criteria: [3-3.M2]
    - id: 3-3b-4
      content: |
        $b_n=-\dfrac{4}{(n+1)\ln(n+1)}\left\{\dfrac{n^2+2n+2}{n+2}\left(\ln\dfrac{n^2+2n+2}{n+2}-1\right)+1\right\}$ $(n\ge1)$이라 하면 모든 자연수 $n$에 대하여 $a_n<b_n$이 성립한다.
      criteria: [3-3.M3]
    - id: 3-3b-5
      content: |
        이때, $\lim_{n\to\infty}b_n=(-4)\lim_{n\to\infty}\left\{\dfrac{n^2+2n+2}{(n+1)(n+2)}\left(\dfrac{\ln\frac{n^2+2n+2}{(n+2)(n+1)}(n+1)}{\ln(n+1)}-\dfrac{1}{\ln(n+1)}\right)+\dfrac{1}{(n+1)\ln(n+1)}\right\}=(-4)\lim_{n\to\infty}\left\{\dfrac{n^2+2n+2}{(n+1)(n+2)}\left(\dfrac{\ln\frac{n^2+2n+2}{(n+2)(n+1)}}{\ln(n+1)}+1-\dfrac{1}{\ln(n+1)}\right)+\dfrac{1}{(n+1)\ln(n+1)}\right\}=-4$이고, 같은 방법으로 $\lim_{n\to\infty}c_n=-4$이다.
      criteria: [3-3.M4]
    - id: 3-3b-6
      content: |
        따라서, 수열의 극한의 대소관계에 의해 $\lim_{n\to\infty}a_n=-4$이다.
      criteria: [3-3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-3.B1
