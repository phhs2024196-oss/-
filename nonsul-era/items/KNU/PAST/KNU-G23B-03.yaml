  - '정적분 $\dfrac12\int_{\frac17}^{\frac14}2^{\frac1x}dx$'
  - '수열 $a_n=\dfrac{4}{(n+1)\ln(n+1)}\sum_{k=1}^{n+1}\left\{\dfrac{k^2+2k-1}{(k+1)^2}\ln\dfrac{k+1}{k^2+1}\right\}$'
  concepts:
