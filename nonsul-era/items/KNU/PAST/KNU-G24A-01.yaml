stimuli:
- label: (가)
  body: |
    선분 $\mathrm{AB}$ 위의 점 $\mathrm{P}$에 대하여
    $$\overline{\mathrm{AP}}:\overline{\mathrm{PB}}=m:n\ (m>0,\ n>0)$$
    일 때, 점 $\mathrm{P}$는 선분 $\mathrm{AB}$를 $m:n$으로 내분한다고 하고, 점 $\mathrm{P}$를 선분 $\mathrm{AB}$의 내분점이라고 한다.
- label: (나)
  body: |
    세 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$, $\mathrm{C}(x_3,y_3)$을 꼭짓점으로 하는 삼각형 $\mathrm{ABC}$의 세 중선은 한 점에서 만나고 이 점을 무게중심이라고 한다. 무게중심의 좌표는
    $$\left(\dfrac{x_1+x_2+x_3}{3},\dfrac{y_1+y_2+y_3}{3}\right)$$
    이다.
- label: (다)
  body: |
    자연수 $n$에 대한 명제 $p(n)$이 모든 자연수에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.

    (ⅰ) $n=1$일 때 명제 $p(n)$이 성립한다.

    (ⅱ) $n=k$일 때 명제 $p(n)$이 성립한다고 가정하면 $n=k+1$일 때에도 명제 $p(n)$이 성립한다.
- label: (라)
  body: |
    삼각형 $\mathrm{ABC}$에서
    $$a^2=b^2+c^2-2bc\cos A$$
    $$b^2=c^2+a^2-2ca\cos B$$
    $$c^2=a^2+b^2-2ab\cos C$$
    이다.

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  좌표평면 위에 한 변의 길이가 $1$이고 무게중심이 원점인 정삼각형 $\mathrm{A_1B_1C_1}$이 있다. 꼭짓점 $\mathrm{A_1}$은 $y$축 위의 점이고 $y$좌표는 양수이다. 꼭짓점 $\mathrm{B_1}$은 제3사분면 위의 점이고, 꼭짓점 $\mathrm{C_1}$은 제4사분면 위의 점이다. 자연수 $n$에 대하여 좌표평면 위의 점 $\mathrm{A}_n$, $\mathrm{B}_n$, $\mathrm{C}_n$이 아래의 조건을 만족시킨다. (단, $m$은 고정된 자연수이다.)

  > 자연수 $n$에 대하여
  > (ㄱ) 점 $\mathrm{A}_{n+1}$은 선분 $\mathrm{A}_n\mathrm{B}_n$을 $1:m$으로 내분하는 점이다.
  > (ㄴ) 점 $\mathrm{B}_{n+1}$은 선분 $\mathrm{B}_n\mathrm{C}_n$을 $1:m$으로 내분하는 점이다.
  > (ㄷ) 점 $\mathrm{C}_{n+1}$은 선분 $\mathrm{C}_n\mathrm{A}_n$을 $1:m$으로 내분하는 점이다.

subparts:
- id: 1-1
  stem: |
    【1-1】 삼각형 $\mathrm{A_{2024}B_{2024}C_{2024}}$의 무게중심의 좌표를 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: value, value: '(0, 0)', equivalents: ['원점'], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 내분점 공식을 세 꼭짓점에 대해 더하면 좌표의 합이 그대로 보존된다.
    steps:
    - {id: 11a, content: '$p_{n+1}+q_{n+1}+r_{n+1}=\frac{(m+1)(p_n+q_n+r_n)}{m+1}$ ⇒ 무게중심 불변 ⇒ $(0,0)$', criteria: [1-1.B1, 1-1.R1, 1-1.A1]}
    hint_ladder:
    - 꼭짓점 좌표를 문자로 두고 $\mathrm{A}_{n+1}$, $\mathrm{B}_{n+1}$, $\mathrm{C}_{n+1}$의 좌표를 써 보자.
    - 세 $x$좌표를 더하면 무엇이 남는가?
  - id: S11-B
    audience: B
    source_flow: rep2024.pdf p.82(인쇄 p.78)
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$의 꼭짓점의 좌표를 $\mathrm{A}_n(p_n,u_n)$, $\mathrm{B}_n(q_n,v_n)$, $\mathrm{C}_n(r_n,w_n)$이라 하면 조건에 의해
        $p_{n+1}=\dfrac{mp_n+q_n}{m+1}$, $q_{n+1}=\dfrac{mq_n+r_n}{m+1}$, $r_{n+1}=\dfrac{mr_n+p_n}{m+1}$, $u_{n+1}=\dfrac{mu_n+v_n}{m+1}$, $v_{n+1}=\dfrac{mv_n+w_n}{m+1}$, $w_{n+1}=\dfrac{mw_n+u_n}{m+1}$이다.
      criteria: [1-1.B1]
    - id: 11b-2
      content: |
        각 자연수 $n$에 대해 $\dfrac{p_{n+1}+q_{n+1}+r_{n+1}}{3}=\dfrac{p_n+q_n+r_n}{3}$, $\dfrac{u_{n+1}+v_{n+1}+w_{n+1}}{3}=\dfrac{u_n+v_n+w_n}{3}$이므로 삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$과 $\mathrm{A}_{n+1}\mathrm{B}_{n+1}\mathrm{C}_{n+1}$의 무게중심이 일치한다.
      criteria: [1-1.R1]
    - id: 11b-3
      content: |
        삼각형 $\mathrm{A_1B_1C_1}$의 무게중심은 원점이므로 삼각형 $\mathrm{A_{2024}B_{2024}C_{2024}}$의 무게중심의 좌표도 $(0,0)$이다.
      criteria: [1-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.B1
      mark_type: B
      points: 5
      evidence: |
        삼각형의 무게중심의 좌표를 올바르게 나타냈다.
      steps: [11b-1]
    - id: 1-1.R1
      mark_type: R
      points: 20
      evidence: |
        $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$과 $\mathrm{A}_{n+1}\mathrm{B}_{n+1}\mathrm{C}_{n+1}$의 무게중심이 일치함을 보였다. ("각 변을 같은 비율로 내분하므로 무게중심이 같다"는 논리는 인정하지 않음)
      steps: [11b-2]
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: |
        $\mathrm{A_{2024}B_{2024}C_{2024}}$의 무게중심이 원점 $(0,0)$임을 보였다.
      depends_on: [1-1.R1]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42401}
  misconceptions:
  - id: MC-GEO-42401
    outcome_code: '71'
    wrong_work: |
      "각 변을 같은 비율로 내분하므로 무게중심이 같다"고만 쓰고 좌표 계산 없이 $(0,0)$이라 답함
    detect_cue: 내분점 좌표식·좌표의 합 계산이 없음
    feedback: 직관적 주장은 채점기준에서 인정되지 않습니다. 내분점 좌표를 써서 세 좌표의 합이 보존됨을 보이세요.
    remedy: [RL-1]
- id: 1-2
  stem: |
    【1-2】 모든 자연수 $n$에 대하여 삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$은 정삼각형임을 수학적 귀납법으로 증명하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 정삼각형의 세 꼭짓점에서 잘려 나가는 세 삼각형은 두 변(길이 $\frac{L_n}{m+1}$, $\frac{mL_n}{m+1}$)과 끼인각 $\frac{\pi}{3}$이 같아 합동.
    steps:
    - {id: 12a, content: '$p(1)$ 자명, $p(k)$ 가정 → 세 귀퉁이 삼각형 SAS합동 → 새 세 변이 같음 → $p(k+1)$', criteria: [1-2.R1, 1-2.B1, 1-2.R2]}
    hint_ladder:
    - $n=k$에서 정삼각형이면 각 꼭짓점 근처에 잘려 나가는 삼각형의 두 변과 끼인각은?
  - id: S12-B
    audience: B
    source_flow: rep2024.pdf p.82~83(인쇄 p.78~79)
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        명제 "$p(n)$: 삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$은 정삼각형이다."를 수학적 귀납법으로 증명하자.
      criteria: [1-2.R1]
    - id: 12b-2
      content: |
        $n=1$일 때, $p(1)$은 주어진 조건에 의해 자명하다.
      criteria: [1-2.B1]
    - id: 12b-3
      content: |
        $n=k$일 때 $p(n)$이 성립한다고 가정하자. 즉, 삼각형 $\mathrm{A}_k\mathrm{B}_k\mathrm{C}_k$는 정삼각형이다. 그 변의 길이를 $\mathrm{L}_k$라 하면, 조건에 의해
        $\overline{\mathrm{A}_k\mathrm{A}_{k+1}}=\overline{\mathrm{B}_k\mathrm{B}_{k+1}}=\overline{\mathrm{C}_k\mathrm{C}_{k+1}}=\dfrac{\mathrm{L}_k}{m+1}$, $\overline{\mathrm{A}_k\mathrm{C}_{k+1}}=\overline{\mathrm{B}_k\mathrm{A}_{k+1}}=\overline{\mathrm{C}_k\mathrm{B}_{k+1}}=\dfrac{m\mathrm{L}_k}{m+1}$,
        $\angle\mathrm{C}_{k+1}\mathrm{A}_k\mathrm{A}_{k+1}=\angle\mathrm{A}_{k+1}\mathrm{B}_k\mathrm{B}_{k+1}=\angle\mathrm{B}_{k+1}\mathrm{C}_k\mathrm{C}_{k+1}=\dfrac{\pi}{3}$이다.
        따라서 삼각형 $\mathrm{C}_{k+1}\mathrm{A}_k\mathrm{A}_{k+1}$, $\mathrm{A}_{k+1}\mathrm{B}_k\mathrm{B}_{k+1}$, $\mathrm{B}_{k+1}\mathrm{C}_k\mathrm{C}_{k+1}$은 모두 SAS합동이므로 $\overline{\mathrm{A}_{k+1}\mathrm{B}_{k+1}}=\overline{\mathrm{B}_{k+1}\mathrm{C}_{k+1}}=\overline{\mathrm{C}_{k+1}\mathrm{A}_{k+1}}$이고 삼각형 $\mathrm{A}_{k+1}\mathrm{B}_{k+1}\mathrm{C}_{k+1}$은 정삼각형이다. 따라서 $n=k+1$일 때 $p(n)$이 성립한다. ■
      criteria: [1-2.R2]
  - id: S12-ALT
    audience: B
    source_flow: rep2024.pdf p.83(인쇄 p.79) [별해]
    method_no: 2
    steps:
    - id: 12alt-1
      content: |
        (귀납 단계) 세 삼각형에 제2코사인법칙을 쓰면 $\overline{\mathrm{C}_{k+1}\mathrm{A}_{k+1}}^2=\overline{\mathrm{A}_{k+1}\mathrm{B}_{k+1}}^2=\overline{\mathrm{B}_{k+1}\mathrm{C}_{k+1}}^2=\dfrac{1-m+m^2}{(1+m)^2}\mathrm{L}_k^2$이므로 세 변의 길이가 모두 $\dfrac{\sqrt{1-m+m^2}}{1+m}\mathrm{L}_k$로 같아 정삼각형이다.
      criteria: [1-2.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.R1
      mark_type: R
      points: 10
      evidence: |
        수학적 귀납법을 올바르게 제시했다.
      steps: [12b-1]
    - id: 1-2.B1
      mark_type: B
      points: 5
      evidence: |
        수학적 귀납법의 초기 조건($n=1$)을 확인했다.
      steps: [12b-2]
    - id: 1-2.R2
      mark_type: R
      points: 15
      evidence: |
        기하적 증명(SAS합동 등)이나 제2코사인법칙을 이용하여 귀납 단계를 증명했다. ("각 변을 같은 비율로 내분하므로 정삼각형이다"는 논리는 인정하지 않음)
      steps: [12b-3, 12alt-1]
