    method_no: 1
    steps:
    - id: 132b-1
      content: |
        삼각형 $\mathrm{OA}_n\mathrm{A}_{n+1}$은 한 밑각이 $\dfrac{\pi}{6}$인 이등변삼각형이므로 시초선 $\mathrm{OA_1}$과 동경 $\mathrm{OA}_n$이 나타내는 각은 $n$이 $1$씩 커질 때마다 $\dfrac{\pi}{6}$만큼 증가한다.
      criteria: [1-3-2.R1]
    - id: 132b-2
      content: |
