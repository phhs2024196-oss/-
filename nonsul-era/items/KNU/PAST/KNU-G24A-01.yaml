  solutions:
  - id: S131-A
    audience: A
    method_no: 1
    key_idea: $m=2$이면 $\triangle\mathrm{C}_{n+1}\mathrm{A}_n\mathrm{A}_{n+1}$에서 $\mathrm{L}_{n+1}^2=\frac{\mathrm{L}_n^2}{3}$, 공비 $\frac13$인 등비급수.
    steps:
    - {id: 131a, content: '$s_1=\frac{\sqrt3}{4}$, $s_{n+1}=\frac{s_n}{3}$ ⇒ $\sum s_n=\frac{\sqrt3/4}{1-1/3}=\frac{3\sqrt3}{8}$', criteria: [1-3-1.B1, 1-3-1.R1, 1-3-1.R2, 1-3-1.A1]}
    hint_ladder:
    - $m=2$일 때 $\overline{\mathrm{A}_n\mathrm{A}_{n+1}}$과 $\overline{\mathrm{A}_n\mathrm{C}_{n+1}}$의 길이는 $\mathrm{L}_n$의 몇 배인가?
    - 코사인법칙으로 $\mathrm{L}_{n+1}^2$을 $\mathrm{L}_n^2$으로 나타내 보자.
  - id: S131-B
    audience: B
    source_flow: rep2024.pdf p.83(인쇄 p.79)
    method_no: 1
    steps:
    - id: 131b-1
      content: |
        정삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$의 변의 길이를 $\mathrm{L}_n$이라 하면 넓이 $s_n=\dfrac{\sqrt3\mathrm{L}_n^2}{4}$이다. 정삼각형 $\mathrm{A_1B_1C_1}$은 변의 길이가 $1$이므로 $s_1=\dfrac{\sqrt3}{4}$이다.
      criteria: [1-3-1.B1]
    - id: 131b-2
      content: |
        $m=2$이므로 $\overline{\mathrm{A}_n\mathrm{A}_{n+1}}=\dfrac{\mathrm{L}_n}{3}$, $\overline{\mathrm{A}_n\mathrm{C}_{n+1}}=\dfrac{2\mathrm{L}_n}{3}$이다. 삼각형 $\mathrm{C}_{n+1}\mathrm{A}_n\mathrm{A}_{n+1}$에 제2코사인법칙을 쓰면
        $$\mathrm{L}_{n+1}^2=\overline{\mathrm{A}_{n+1}\mathrm{C}_{n+1}}^2=\dfrac{\mathrm{L}_n^2}{9}+\dfrac{4\mathrm{L}_n^2}{9}-\dfrac{2\mathrm{L}_n^2}{9}=\dfrac{\mathrm{L}_n^2}{3}$$
        이다. 따라서 $s_{n+1}=\dfrac{\sqrt3\mathrm{L}_{n+1}^2}{4}=\dfrac{\sqrt3\mathrm{L}_n^2}{12}=\dfrac{s_n}{3}$이므로 수열 $\{s_n\}$은 초항이 $\dfrac{\sqrt3}{4}$이고 공비가 $\dfrac13$인 등비수열이다.
      criteria: [1-3-1.R1]
    - id: 131b-3
      content: |
        공비가 $1$보다 작으므로 급수 $\displaystyle\sum_{n=1}^{\infty}s_n$은 수렴하고
      criteria: [1-3-1.R2]
    - id: 131b-4
      content: |
        급수의 합은 $\displaystyle\sum_{n=1}^{\infty}s_n=\dfrac{\frac{\sqrt3}{4}}{1-\frac13}=\dfrac{3\sqrt3}{8}$이다.
      criteria: [1-3-1.A1]
  - id: S131-ALT
    audience: B
    source_flow: rep2024.pdf p.84(인쇄 p.80) [별해]
    method_no: 2
    steps:
    - id: 131alt-1
      content: |
        $\angle\mathrm{C}_{n+1}\mathrm{A}_n\mathrm{A}_{n+1}=\dfrac{\pi}{3}$이고 $\overline{\mathrm{A}_n\mathrm{C}_{n+1}}=2\overline{\mathrm{A}_n\mathrm{A}_{n+1}}$이므로 삼각형 $\mathrm{C}_{n+1}\mathrm{A}_n\mathrm{A}_{n+1}$은 직각삼각형이고 $\overline{\mathrm{B}_{n+1}\mathrm{C}_{n+1}}=\dfrac{\sqrt3}{3}\mathrm{L}_n$이다. 따라서 $s_{n+1}=\dfrac{s_n}{3}$.
      criteria: [1-3-1.R1]
