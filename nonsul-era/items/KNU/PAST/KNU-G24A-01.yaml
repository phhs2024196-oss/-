    method_no: 1
    key_idea: $\triangle\mathrm{OA}_n\mathrm{A}_{n+1}$은 밑각 $\frac{\pi}{6}$인 이등변삼각형이라 $\angle\mathrm{A}_n\mathrm{OA}_{n+1}=\frac{\pi}{6}$, 동경은 $\frac{\pi}{2}+(n-1)\frac{\pi}{6}$.
    steps:
    - {id: 132a, content: '$x$축 위: $n=6d-2$ ($1\le d\le337$) ⇒ $k=337$; $2023\cdot\frac{\pi}{6}=168\cdot2\pi+\frac{7\pi}{6}$ ⇒ 동경 $\frac{5\pi}{3}$, $\ell=4$', criteria: [1-3-2.R1, 1-3-2.R2, 1-3-2.A1]}
    hint_ladder:
    - 원점은 모든 삼각형의 외심이다. $\mathrm{OA}_n$과 $\mathrm{OA}_{n+1}$ 사이의 각은?
    - $\mathrm{A_1}$의 동경은 $\frac{\pi}{2}$이다. $n$번째 동경을 식으로 써 보자.
