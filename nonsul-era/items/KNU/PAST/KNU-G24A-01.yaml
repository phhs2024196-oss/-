      criteria: [1-3-2.R2]
    - id: 132b-3
      content: |
        시초선 $\mathrm{OA_1}$과 동경 $\mathrm{OA_{2024}}$가 나타내는 각은 $2023\times\dfrac{\pi}{6}=168\times2\pi+\dfrac{7\pi}{6}$이므로 $\mathrm{A_{2024}}$는 제4사분면의 점이다. 따라서 $\ell=4$.
      criteria: [1-3-2.A1]
