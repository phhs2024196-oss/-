intent: |
  좌표평면 위의 선분의 내분점을 이해하고 삼각형의 무게중심을 구할 수 있는지(1-1), 수학적 귀납법을 올바르게 사용할 수 있는지(1-2), 등비수열의 급수의 합을 올바르게 계산할 수 있는지(1-3(1)), 좌표평면 위의 점의 위치(일반각)를 올바르게 이해하고 있는지(1-3(2)) 평가한다.
key_idea: |
  내분점 좌표를 세 개 더하면 $p_{n+1}+q_{n+1}+r_{n+1}=p_n+q_n+r_n$이므로 무게중심은 항상 원점이다. 각 단계에서 잘려 나가는 세 삼각형이 SAS합동이라 새 삼각형도 정삼각형이고, $m=2$이면 $\triangle\mathrm{C_{n+1}A_nA_{n+1}}$이 직각삼각형이 되어 넓이의 공비 $\frac13$, $\angle\mathrm{A}_n\mathrm{OA}_{n+1}=\frac{\pi}{6}$이다.
stuck: |
  1-3(2)에서 $\mathrm{A}_n$의 동경이 $n$이 1 커질 때마다 $\frac{\pi}{6}$씩 (시계 반대 방향으로) 회전함을 알아내는 단계
