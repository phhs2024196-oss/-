    (1) 삼각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n$의 넓이를 $s_n$이라 하자. 급수 $\displaystyle\sum_{n=1}^{\infty}s_n$의 수렴과 발산을 조사하고, 수렴하면 그 합을 구하시오. (40점)
  points: 40
