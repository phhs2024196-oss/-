  선분의 내분점과 삼각형의 성질로 좌표평면에서 선분의 길이를 구할 수 있는지(2-1), 항등식의 성질로 조건에 맞는 다항함수를 구할 수 있는지(2-2), 도함수를 활용하여 극대와 극소를 판정할 수 있는지(2-3), 치환적분법을 활용하여 속도와 거리에 대한 문제를 해결할 수 있는지(2-4) 평가한다.
key_idea: |
  $\angle\mathrm{AOB}=\frac{\pi}{2}$이므로 $\mathrm{AB}$는 외접원의 지름, $\angle\mathrm{ACB}=\frac{\pi}{2}$이고 닮음으로 $\overline{\mathrm{AC}}=15$, $\overline{\mathrm{BC}}=15\sqrt3$. 차수 비교 $m(m+2)=m(2m+1)$에서 $p$는 일차식, 계수 비교로 $p(x)=11x$. 수학이가 이동한 거리 $\int_0^T\frac{11n^3t}{(t^2+n^2)^2}dt=\frac{11nT^2}{2(n^2+T^2)}$를 $15$로 두고 폭탄의 도착 시각 $\frac{15\sqrt3}{n}$과 비교한다.
stuck: |
  2-2에서 양변의 차수를 $m(m+2)$, $m(2m+1)$로 비교해 $p$가 일차식임을 끌어내는 단계, 2-4에서 도착 시각 $T$를 거리 적분 식으로부터 구해 부등식 $2n^4-495n+1350<0$으로 바꾸는 단계
