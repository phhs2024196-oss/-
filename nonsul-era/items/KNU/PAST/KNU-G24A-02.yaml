- id: 2-4
  stem: |
    【2-4】 수학이가 폭탄보다 먼저 점 $\mathrm{C}$에 도착하였다. 수학이가 선택한 $n$의 값을 구하시오. (50점)
  points: 50
  depends_on: [2-1, 2-2]
  answer: {kind: value, value: '4', equivalents: ['n=4'], tolerance: null}
  solutions:
  - id: S24-A
    audience: A
    method_no: 1
    key_idea: 도착 시각 $T$에 대해 $15=\frac{11nT^2}{2(n^2+T^2)}$ → $T^2=\frac{30n^2}{11n-30}$, 폭탄 도착 $\frac{15\sqrt3}{n}$보다 작아야 함.
    steps:
    - {id: 24a, content: '$(11n-30)T^2=30n^2$ ⇒ $n\ge3$, $\frac{30n^2}{11n-30}<\frac{675}{n^2}$ ⇔ $2n^4-495n+1350<0$ ⇒ $n=4$', criteria: [2-4.M1, 2-4.M2, 2-4.R1, 2-4.A1, 2-4.R2]}
    hint_ladder:
    - 수학이가 $\mathrm{C}$에 도착한 시각을 $T$라 하면 $\int_0^T(\text{속력})\,dt$는 얼마인가?
    - $t^2+n^2=u$로 치환해 보자.
    - $n=3,4,5,\dots$에 대해 부등식을 확인하자. $n\ge5$에서는 함수의 증가를 이용하라.
  - id: S24-B
    audience: B
    source_flow: rep2024.pdf p.89(인쇄 p.85)
    method_no: 1
    steps:
    - id: 24b-1
      content: |
        수학이가 선택한 $n$에 대하여 폭탄이 점 $\mathrm{C}$에 도착한 시각을 $T_1$, 수학이가 점 $\mathrm{C}$에 도착한 시각을 $T$라고 하면 $T_1=\dfrac{15\sqrt3}{n}$이고 등식 $15=\displaystyle\int_0^T\dfrac{11n^3t}{(t^2+n^2)^2}\,dt$이 성립한다.
      criteria: [2-4.M1]
    - id: 24b-2
      content: |
        치환적분법($t^2+n^2=u$)을 활용하면 $15=\dfrac{11n^3}{2}\left(\dfrac{1}{n^2}-\dfrac{1}{n^2+T^2}\right)=\dfrac{11nT^2}{2(n^2+T^2)}$이다. 등식으로부터 $(11n-30)T^2=30n^2$이다.
      criteria: [2-4.M2]
    - id: 24b-3
      content: |
        $T^2\ge0$이므로 수학이가 선택한 $n$은 $3$ 이상이다. 수학이가 점 $\mathrm{C}$에 먼저 도착하였으므로 수학이가 선택한 $n$에 대하여 $\dfrac{30n^2}{11n-30}<\left(\dfrac{15\sqrt3}{n}\right)^2$이다. 즉, $2n^4-495n+1350<0$이다.
      criteria: [2-4.R1]
    - id: 24b-4
      content: |
        $h(x)=2x^4-495x+1350$이라고 하면 $h(3)\ge0$, $h(4)<0$, $h(5)\ge0$이다. 모든 $x\ge5$에 대하여 $h'(x)=8x^3-495\ge0$이므로, $h(n)<0$을 만족하는 자연수 $n$은 $4$뿐이다. 답: $n=4$
      criteria: [2-4.A1, 2-4.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
