stimuli:
- label: (가)
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고 $x=a$의 좌우에서

    (ⅰ) $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.

    (ⅱ) $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.
- label: (나)
  body: |
    좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 위치가 $x=f(t)$, $y=g(t)$일 때, 점 $\mathrm{P}$의 시각 $t$에서의 속력 $h(t)$는
    $$h(t)=\sqrt{\{f'(t)\}^2+\{g'(t)\}^2}$$
    이고, 시각 $t=a$에서 $t=b$까지 점 $\mathrm{P}$가 움직인 거리 $s$는
    $$s=\int_a^bh(t)\,dt$$
    이다.

# [그림: 정사각형 게임 화면. 위쪽 왼편 대포(점 B)에서 폭탄이 오른쪽 아래 우주선(점 C) 쪽으로 점선을 따라 이동하고, 아래쪽 변 위의 점(점 A)에서 수학이가 위쪽 우주선 쪽으로 점선을 따라 이동 — 장식용 삽화]
stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  수학이가 좌표평면 위에서 진행되는 혹성탈출게임을 한다. 수학이는 점 $\mathrm{A}(18,0)$에서 아래의 단서를 찾았다.

  > 단서
  > (ㄱ) 폭탄의 위치는 점 $\mathrm{B}(0,24)$이다.
  > (ㄴ) 탈출을 위한 우주선의 위치는 제1사분면 위의 점 $\mathrm{C}$이다.
  > (ㄷ) 점 $\mathrm{C}$에서 선분 $\mathrm{AB}$에 내린 수선의 발은 선분 $\mathrm{AB}$를 $1:3$으로 내분한다.
  > (ㄹ) 네 점 $\mathrm{O}$, $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$가 한 원 위에 있다. (단, $\mathrm{O}$는 원점이다.)

subparts:
- id: 2-1
  stem: |
    【2-1】 선분 $\mathrm{AC}$와 선분 $\mathrm{BC}$의 길이를 각각 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: value, value: '(15, 15*sqrt(3))', equivalents: ['AC=15, BC=15√3'], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{AB}$가 지름이라 $\angle\mathrm{ACB}$가 직각, 직각삼각형의 닮음.
    steps:
    - {id: 21a, content: '$\overline{\mathrm{AB}}=30$, $\overline{\mathrm{AH}}=\frac{15}{2}$, $\overline{\mathrm{AC}}^2=\overline{\mathrm{AH}}\cdot\overline{\mathrm{AB}}=225$, $\overline{\mathrm{BC}}^2=\frac{45}{2}\cdot30=675$', criteria: [2-1.A1, 2-1.A2]}
    hint_ladder:
    - $\angle\mathrm{AOB}$는 몇 도인가? 그러면 선분 $\mathrm{AB}$는 원에서 무엇인가?
  - id: S21-B
    audience: B
    source_flow: rep2024.pdf p.89(인쇄 p.85)
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        점 $\mathrm{A}(18,0)$과 점 $\mathrm{B}(0,24)$의 좌표를 이용하면 $\overline{\mathrm{AB}}=30$이다. 점 $\mathrm{C}$에서 선분 $\mathrm{AB}$로 내린 수선의 발을 $\mathrm{H}$라 하자. 조건에 따라 $\overline{\mathrm{AH}}:\overline{\mathrm{BH}}=1:3$이므로 $\overline{\mathrm{AH}}=\dfrac{15}{2}$, $\overline{\mathrm{BH}}=\dfrac{45}{2}$이다.
      criteria: [2-1.A1]
    - id: 21b-2
      content: |
        삼각형 $\mathrm{OAB}$는 $\angle\mathrm{AOB}$가 직각인 직각삼각형이므로 선분 $\mathrm{AB}$는 삼각형 $\mathrm{OAB}$의 외접원의 지름이다. 조건에 따라 점 $\mathrm{C}$도 같은 원 위에 있으므로 $\angle\mathrm{ACB}$ 또한 직각이다. 따라서 삼각형 $\mathrm{CAH}$, $\mathrm{BCH}$, $\mathrm{BAC}$가 닮음이다.
      criteria: [2-1.A1, 2-1.A2]
    - id: 21b-3
      content: |
        삼각형의 닮음과 $\overline{\mathrm{AH}}=\dfrac{15}{2}$, $\overline{\mathrm{BH}}=\dfrac{45}{2}$를 이용하면 $\overline{\mathrm{AC}}=15$, $\overline{\mathrm{BC}}=15\sqrt3$이다.
      criteria: [2-1.A1, 2-1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: false, misread_penalty: 2, isw: true}   # 학교 채점기준이 답 점수를 과정 점수와 독립 배정
    criteria:
    - id: 2-1.A1
      mark_type: A
      points: 15
      evidence: |
        답 $\overline{\mathrm{AC}}=15$가 맞았다.
      steps: [21b-1, 21b-2, 21b-3]
    - id: 2-1.A2
      mark_type: A
      points: 15
      evidence: |
        답 $\overline{\mathrm{BC}}=15\sqrt3$이 맞았다.
      steps: [21b-2, 21b-3]
    deductions:
    - code: D21-1
      condition: 답만 쓰고 과정 없음(모든 문항에서 풀이 과정 기술 요구)
      effect: cap
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42402}
  misconceptions:
  - id: MC-GEO-42402
    outcome_code: '71'
    wrong_work: |
      내분 비율을 $\mathrm{B}$ 쪽부터 잡아 $\overline{\mathrm{AH}}=\frac{45}{2}$로 두고 $\overline{\mathrm{AC}}=15\sqrt3$, $\overline{\mathrm{BC}}=15$로 뒤바꿔 답함
    detect_cue: $\overline{\mathrm{AH}}$와 $\overline{\mathrm{BH}}$ 값이 서로 바뀌어 있음
    feedback: 「선분 $\mathrm{AB}$를 $1:3$으로 내분」은 $\mathrm{A}$에서부터 $1:3$입니다. $\overline{\mathrm{AH}}=\frac14\overline{\mathrm{AB}}$.
    remedy: [RL-1]
- id: 2-2
  stem: |
    아래 규칙에 따라 수학이가 우주선의 위치로 이동한다.

    > (ㄱ) 수학이는 $10$보다 작은 자연수 $n$을 선택한다.
    > (ㄴ) 선택이 끝난 후, 시각 $t=0$일 때 수학이와 폭탄이 각각 점 $\mathrm{A}$와 점 $\mathrm{B}$에서 출발하여 점 $\mathrm{C}$를 향한 방향으로 선분 $\mathrm{AC}$와 선분 $\mathrm{BC}$를 따라 이동한다. (단, 수학이와 폭탄의 운동 방향은 바뀌지 않는다.)
    > (ㄷ) 수학이가 선택한 $n$에 대하여, 시각 $t\,(t\ge0)$에서의 폭탄의 속력은 $n$이고, 수학이의 속력은 $\dfrac{n^3p(t)}{(t^2+n^2)^2}$이다.
    > (ㄹ) 함수 $p(x)$는 최고차항의 계수가 양수인 다항함수이고, 모든 실수 $t$에 대하여 $p(t^2p(2t))=p(t\,p(t^2))+121t^3$이다.

    다음 물음에 답하시오.

    【2-2】 $p(x)$를 구하시오. (40점)
  points: 40
  depends_on: []
  answer: {kind: expression, value: '11*x', equivalents: ['p(x)=11x'], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: 차수 $m$이면 좌변 $m(m+2)$차, 우변 $m(2m+1)$차 → $m=1$; $p(t)=\beta t+C$ 대입 후 계수 비교.
    steps:
    - {id: 22a, content: '$m(m+2)=m(2m+1)$, $m\ge1$ ⇒ $m=1$; $(\beta^2-121)t^3+\beta Ct^2-\beta Ct=0$ ⇒ $C=0$, $\beta=11$', criteria: [2-2.A1]}
    hint_ladder:
    - $p$의 차수를 $m$이라 하고 양변의 차수를 비교해 보자.
    - $m=0$이면 $121t^3$이 상수여야 한다. 가능한가?
  - id: S22-B
    audience: B
    source_flow: rep2024.pdf p.89(인쇄 p.85)
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $p(t)$의 차수를 $m$이라 하면 $p(t^2p(2t))$는 $t$에 대한 $m(m+2)$차식, $p(tp(t^2))$은 $m(2m+1)$차식, $121t^3$은 $3$차식이다. $m=0$이라면 모든 $t$에 대하여 $121t^3$이 상수여야 하므로 모순이다. 따라서 $m\ge1$이고, 따라서 $m=1$이다.
      criteria: [2-2.A1]
    - id: 22b-2
      content: |
        $p(t)=\beta t+C$라고 하자. 조건에 따라 $\beta>0$이다. 모든 $t$에 대하여
        $$p(t^2p(2t))-p(tp(t^2))-121t^3=(\beta^2-121)t^3+\beta Ct^2-\beta Ct=0$$
        이고 $\beta>0$이므로 $C=0$이고 $\beta=11$이다. 따라서 $p(x)=11x$이다.
      criteria: [2-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: false, misread_penalty: 2, isw: true}   # 학교 채점기준이 답 점수를 과정 점수와 독립 배정
    criteria:
    - id: 2-2.A1
      mark_type: A
      points: 40
      evidence: |
        $p(x)=11x$를 맞게 구했다.
      steps: [22b-1, 22b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42402}
  misconceptions:
  - id: MC-ALG-42402
    outcome_code: '71'
    wrong_work: |
      처음부터 $p(x)=ax$로 두고 $a=11$을 얻어(또는 $a=\pm11$) 차수 결정과 상수항 $C=0$의 근거 없이 답함
    detect_cue: 차수 비교 $m(m+2)=m(2m+1)$가 없음, 상수항을 두지 않음
    feedback: $p$의 꼴을 가정하기 전에 양변 차수를 비교해 일차식임을 보이고, 일반형 $\beta t+C$로 계수를 비교하세요.
    remedy: [RL-2]
- id: 2-3
  stem: |
    【2-3】 실수 전체의 집합에서 정의된 함수 $f(x)=\dfrac{p(x)}{(x^2+1)^2}$는 $x=c_1$에서 극소이고 $x=c_2$에서 극대이다. 두 실수 $c_1$과 $c_2$를 각각 구하시오. (20점)
  points: 20
  depends_on: [2-2]
  answer: {kind: value, value: '(-sqrt(3)/3, sqrt(3)/3)', equivalents: ['c_1=-1/√3, c_2=1/√3'], tolerance: null}
  solutions:
  - id: S23-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=\frac{11(1-3x^2)}{(x^2+1)^3}$의 부호 변화.
    steps:
    - {id: 23a, content: '$f''=0\iff x=\pm\frac{1}{\sqrt3}$, $-\frac1{\sqrt3}$에서 음→양(극소), $\frac1{\sqrt3}$에서 양→음(극대)', criteria: [2-3.A1, 2-3.A2, 2-3.A3]}
    hint_ladder:
    - 몫의 미분법으로 $f'(x)$를 구하고 분자를 인수분해하자.
  - id: S23-B
    audience: B
    source_flow: rep2024.pdf p.89(인쇄 p.85)
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        $f'(x)=\dfrac{11(-3x^2+1)}{(x^2+1)^3}$이므로 $f'(x)=0$인 $x$는 $-\dfrac{1}{\sqrt3}$, $\dfrac{1}{\sqrt3}$뿐이다.
      criteria: [2-3.A1, 2-3.A2]
    - id: 23b-2
      content: |
