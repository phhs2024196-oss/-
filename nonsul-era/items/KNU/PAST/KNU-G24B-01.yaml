    outcome_code: '71'
    wrong_work: |
      1-3의 구간 정보만으로 $p'$의 근을 구간의 중점(예 $\frac12$, $4$, $10$) 등으로 임의로 정하고, 집합 $A$의 경계($k=1,2,9$)로 근을 확정하는 논증을 생략
    detect_cue: $\gamma=8$, $\beta=4$, $\alpha=0$의 근거(경계값과 $A$의 비교)가 없음
    feedback: $A$에 $9$가 속하고 $9$보다 작은 $k$는 속하지 않는다는 사실이 $\gamma=8$을 강제합니다. 각 근을 $A$의 경계와 비교해 확정하세요.
    remedy: [RL-5]
  - id: MC-CAL-42409
    outcome_code: '72'
    wrong_work: |
      $h(m)$의 불연속점을 $q(x)$의 극솟값 $q(8)=0$만으로 보거나, $x=0$ 근을 빼먹어 교점 개수와 $h(m)$을 같게 둠
    detect_cue: $p(x)-mx-4$의 인수 $x$를 놓침, 극댓값 $q(8/3)$를 고려하지 않음
    feedback: $x=0$은 항상 근이므로 $h(m)=(\text{교점 개수})+1$ (단 $m=0$ 주의). 극댓값 $q(8/3)$에서 교점 개수가 바뀝니다.
    remedy: [RL-6]

