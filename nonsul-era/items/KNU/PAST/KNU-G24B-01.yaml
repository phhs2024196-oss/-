  misconceptions:
  - id: MC-CAL-42407
    outcome_code: '71'
    wrong_work: |
      $f'(x)=0$인 $x$가 있다는 데서 $p'(x)=0$의 근이 바로 그 $x$라고 쓰고, 근이 $g(x)$ (치역 구간 안의 값)임을 놓침
    detect_cue: $f'(x)=p'(g(x))g'(x)$ 합성함수 미분과 $g'(x)>0$ 언급이 없음
    feedback: $f'(x_0)=0$이고 $g'(x_0)>0$이면 $p'(g(x_0))=0$이므로 $p'$의 근은 $g(x_0)\in(k-1,U)$입니다.
    remedy: [RL-3]
  - id: MC-PRF-42401
    outcome_code: '72'
    wrong_work: |
      1-1의 역("일대일이면 $f'\ne0$")을 사용하거나, $k\in A$인 값(예 $k=1$)을 대입해 근의 존재를 주장
    detect_cue: $k\notin A$인 값을 고르지 않음, 대우가 아닌 역을 씀
    feedback: 1-1의 대우는 「일대일이 아니면 $f'(x)=0$인 $x$가 있다」입니다. $A$에 속하지 않는 $k$를 써야 합니다.
    remedy: [RL-4]
- id: 1-4
  stem: |
    【1-4】 실수 $m$에 대하여 $x$에 대한 방정식 $p(x)-mx-4=0$의 서로 다른 실근의 개수를 $h(m)$이라 하자. 함수 $h(m)$이 $m=64$에서 불연속일 때, $p(x)$의 최고차항의 계수를 구하시오. (50점)
  points: 50
  depends_on: [1-2, 1-3]
  answer: {kind: value, value: '27/32', equivalents: ['a=27/32'], tolerance: null}
  solutions:
  - id: S14-A
    audience: A
    method_no: 1
    key_idea: $A$의 경계 때문에 $p'$의 세 근은 정확히 $0,4,8$ → $p(x)=ax^2(x-8)^2+4$; $q(x)=ax(x-8)^2$의 극댓값 $q(8/3)=\frac{2048}{27}a=64$.
    steps:
    - {id: 14a, content: '$\gamma=8$, $\beta=4$, $\alpha=0$ ⇒ $p''=4ax(x-4)(x-8)$ ⇒ $h$ 불연속점 $m=0$, $q(8/3)$ ⇒ $a=\frac{27}{32}$', criteria: [1-4.R1, 1-4.M1, 1-4.R2, 1-4.A1]}
    hint_ladder:
    - 1-3에서 $p'$의 세 근이 각각 $(-1,2)$, $(2,6)$, $(6,14)$에 있다. $A$의 경계 $k=1,2,9$가 무엇을 뜻하는지 생각하자.
    - 가장 큰 근 $\gamma$가 $8$보다 작으면 $k$가 $9$보다 조금 작을 때도 $f$가 일대일이 된다.
    - $p(x)-mx-4$에서 $x$를 묶어 내자.
  - id: S14-B
    audience: B
    source_flow: rep2024.pdf p.103(인쇄 p.99)
    method_no: 1
    steps:
    - id: 14b-1
      content: |
        삼차 방정식 $p'(x)=0$의 서로 다른 세 실근을 $\alpha,\beta,\gamma\ (\alpha<\beta<\gamma)$라 하자. $\gamma<8$이면, 실수 $\gamma'\ (\gamma<\gamma'<8)$에 대하여 열린구간 $(\gamma',\infty)$에서 $p(x)$는 증가하며 일대일함수가 되므로, $\gamma'+1\in A$이다. 하지만, $2<\gamma'+1<9$이므로 $\gamma'+1\notin A$이다. 그러므로 $\gamma\ge8$이다. 비슷하게, $\gamma>8$이면 $9\notin A$이므로 $\gamma=8$이다.
      criteria: [1-4.R1]
    - id: 14b-2
      content: |
        만약 $\beta\in\{x\mid0<x<4\}$이면, 열린구간 $(\beta_1,\beta)$에서 $p(x)$는 증가하고 열린구간 $(\beta,\beta_2)$에서 $p(x)$는 감소하는 실수 $\beta_1,\beta_2\ (0<\beta_1<\beta<\beta_2<4)$가 존재하여 열린구간 $(0,4)$에서 $p(x)$는 일대일함수가 아니고 $1\notin A$이다. 하지만, $1\in A$이므로, $\beta\notin(0,4)$이고 $\beta\ge4$이다. 비슷하게, $\alpha\notin\{x\mid0<x<4\}$이고 $\alpha\le0$을 구할 수 있다.
      criteria: [1-4.R1]
    - id: 14b-3
      content: |
        $\beta>4$이면, $\beta'\left(0<\beta'<\dfrac{\beta-4}{2}\right)$에 대하여 열린구간 $(0,4+2\beta')$[또는 $(1+\beta',4+2\beta')$]에서 $p(x)$는 증가하며 일대일함수가 되므로, $2+\beta'\in A$이다. $\beta<\gamma=8$이므로 $2<2+\beta'<4$이다. 즉, $2+\beta'\notin A$이다. 그러므로, $\beta=4$이다. 비슷하게, $\alpha=0$을 구할 수 있으며 $p'(x)=4ax(x-4)(x-8)=4ax^3-48ax^2+128ax$이다.
      criteria: [1-4.R1]
    - id: 14b-4
      content: |
        한편, $p(x)=ax^4+bx^3+cx^2+dx+4\ (a>0)$이므로 $p'(x)=4ax^3+3bx^2+2cx+d$이다. 그러므로 $p(x)=ax^4-16ax^3+64ax^2+4$이다. $p(x)-mx-4=x(ax^3-16ax^2+64ax-m)$이므로 $h(m)$의 값은 함수 $q(x)=ax^3-16ax^2+64ax$의 그래프와 직선 $y=m$의 교점의 개수보다 $1$ 크다.
      criteria: [1-4.M1]
    - id: 14b-5
      content: |
        $q(x)=ax(x-8)^2$이고 $q'(x)=a(x-8)(3x-8)$이므로 함수 $h(m)$은 $m=0$ 또는 $m=q\left(\dfrac83\right)$에서 불연속이다.
      criteria: [1-4.R2]
    - id: 14b-6
      content: |
        함수 $h(m)$이 $m=64$에서 불연속이므로 $64=q\left(\dfrac83\right)=\dfrac{2048}{27}a$를 만족한다. 그러므로 $a=\dfrac{27}{32}$이다.
      criteria: [1-4.A1]
