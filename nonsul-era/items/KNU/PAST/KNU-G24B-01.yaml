stimuli:
- label: (가)
  body: |
    함수 $f:X\to Y$에서 정의역 $X$의 임의의 두 원소 $x_1$, $x_2$에 대하여
    $$x_1\ne x_2\text{이면 }f(x_1)\ne f(x_2)$$
    가 성립할 때, 이 함수 $f$를 일대일함수라고 한다.
- label: (나)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능하면
    $$\dfrac{f(b)-f(a)}{b-a}=f'(c)$$
    인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: (다)
  body: |
    $\displaystyle\lim_{x\to a}f(x)=\alpha$, $\displaystyle\lim_{x\to a}g(x)=\beta$ ($\alpha$, $\beta$는 실수)일 때,

    (ⅰ) $\displaystyle\lim_{x\to a}\{f(x)+g(x)\}=\lim_{x\to a}f(x)+\lim_{x\to a}g(x)=\alpha+\beta$

    (ⅱ) $\displaystyle\lim_{x\to a}\{f(x)-g(x)\}=\lim_{x\to a}f(x)-\lim_{x\to a}g(x)=\alpha-\beta$

    (ⅲ) $\displaystyle\lim_{x\to a}cf(x)=c\lim_{x\to a}f(x)=c\alpha$ ($c$는 상수)

    (ⅳ) $\displaystyle\lim_{x\to a}f(x)g(x)=\lim_{x\to a}f(x)\times\lim_{x\to a}g(x)=\alpha\beta$

    이다.
- label: (라)
  body: |
    명제 $p\to q$와 그 대우 $\sim q\to\sim p$의 참, 거짓은 일치한다.
- label: (마)
  body: |
    미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면
    $$f'(a)=0$$
    이다.
- label: (바)
  body: |
    함수 $f(x)$가 실수 $a$에 대하여 다음 세 조건을 만족시킬 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다.

    (ⅰ) $f(x)$가 $x=a$에서 정의되어 있다.

    (ⅱ) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재한다.

    (ⅲ) $\displaystyle\lim_{x\to a}f(x)=f(a)$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

subparts:
- id: 1-1
  stem: |
    【1-1】 함수 $f(x)$가 실수 전체의 집합에서 미분가능하고, 모든 실수 $x$에 대하여 $f'(x)\ne0$이면 함수 $f(x)$가 일대일함수임을 제시문 (나)를 이용하여 보이시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 귀류 — $f(a)=f(b)$, $a<b$이면 평균값 정리로 $f'(c)=0$.
    steps:
    - {id: 11a, content: '일대일이 아니라 가정 → $f(a)=f(b)$ ($a<b$) → $f''(c)=\frac{f(b)-f(a)}{b-a}=0$ → 모순', criteria: [1-1.R1, 1-1.R2, 1-1.R3]}
    hint_ladder:
    - 일대일함수가 아니라고 가정하면 무엇이 존재하는가?
  - id: S11-B
    audience: B
    source_flow: rep2024.pdf p.102(인쇄 p.98)
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        함수 $f(x)$가 일대일 함수가 아니라고 가정하면, $f(a)=f(b)$를 만족하는 서로 다른 두 실수 $a,b\ (a<b)$가 존재한다.
      criteria: [1-1.R1]
    - id: 11b-2
      content: |
        제시문 (나)에 의하여, $0=\dfrac{f(b)-f(a)}{b-a}=f'(c)$를 만족하는 $c$가 열린구간 $(a,b)$에 적어도 하나 존재하므로
      criteria: [1-1.R2]
    - id: 11b-3
      content: |
        가정에 모순이 되어 함수 $f(x)$는 일대일 함수이다. ■
      criteria: [1-1.R3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.R1
      mark_type: R
      points: 10
      evidence: |
        $f(a)=f(b)$를 만족하는 서로 다른 두 실수 $a,b\ (a<b)$가 존재함을 찾았다(귀류 가정).
      steps: [11b-1]
    - id: 1-1.R2
      mark_type: R
      points: 10
      evidence: |
        제시문 (나)에 의하여 $0=\dfrac{f(b)-f(a)}{b-a}=f'(c)$를 만족하는 $c$가 열린구간 $(a,b)$에 적어도 하나 존재함을 찾았다.
      steps: [11b-2]
    - id: 1-1.R3
      mark_type: R
      points: 10
      evidence: |
        가정에 모순이 되어 함수 $f(x)$는 일대일 함수임을 보였다.
      depends_on: [1-1.R2]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42405}
  misconceptions:
  - id: MC-CAL-42405
    outcome_code: '71'
    wrong_work: |
      "$f'(x)\ne0$이므로 $f$는 증가하거나 감소한다"고 바로 결론(도함수의 사잇값 성질을 근거 없이 사용, 평균값 정리 미사용)
    detect_cue: 제시문 (나)가 인용되지 않음, $f'$의 부호가 일정하다는 근거 없음
    feedback: $f'\ne0$에서 부호가 일정하다는 것은 바로 쓸 수 없습니다. $f(a)=f(b)$를 가정하고 평균값 정리로 모순을 이끄세요.
    remedy: [RL-1]
- id: 1-2
  stem: |
    최고차항의 계수가 양수인 사차함수 $p(x)$가 다음 조건을 만족시킨다.

    > (ㄱ) 실수 전체의 집합에서 정의된 함수
    > $$f(x)=p\left(\dfrac{(k-1)e^{-x}+2|k|-|k-1|+|k-2|+1}{e^{-x}+1}\right)$$
    > 이 일대일함수가 되도록 하는 모든 실수 $k$의 집합 $A$는
    > $$A=\{k\mid1\le k\le2\text{ 또는 }k\ge9\}$$
    > 이다.
    > (ㄴ) $k=1$일 때, $\displaystyle\lim_{x\to-\infty}f(x)=4$이다.

    다음 물음에 답하시오.

    【1-2】 $p(0)$의 값을 구하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: value, value: '4', equivalents: ['p(0)=4'], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $k=1$이면 내부함수가 $\frac{4}{e^{-x}+1}\to0$ ($x\to-\infty$).
    steps:
    - {id: 12a, content: '$f(x)=p\left(\frac{4}{e^{-x}+1}\right)$, $x\to-\infty$에서 안쪽 $\to0$이므로 $4=p(0)$', criteria: [1-2.B1, 1-2.R1]}
    hint_ladder:
    - $k=1$을 대입해 안쪽 식을 정리하자.
  - id: S12-B
    audience: B
    source_flow: rep2024.pdf p.102(인쇄 p.98)
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $k=1$일 때, $f(x)=p\left(\dfrac{4}{e^{-x}+1}\right)$이다.
      criteria: [1-2.B1]
    - id: 12b-2
      content: |
        사차함수 $p(x)=ax^4+bx^3+cx^2+dx+e\ (a>0)$라 하면, $f(x)=a\left(\dfrac{4}{e^{-x}+1}\right)^4+b\left(\dfrac{4}{e^{-x}+1}\right)^3+c\left(\dfrac{4}{e^{-x}+1}\right)^2+d\left(\dfrac{4}{e^{-x}+1}\right)+e$이다. $\displaystyle\lim_{x\to-\infty}\left(\dfrac{4}{e^{-x}+1}\right)=0$이므로 (제시문 (다)) $4=\displaystyle\lim_{x\to-\infty}f(x)=e=p(0)$이다.
      criteria: [1-2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.B1
      mark_type: B
      points: 5
      evidence: |
        $k=1$일 때, $f(x)=p\left(\dfrac{4}{e^{-x}+1}\right)$임을 찾았다.
      steps: [12b-1]
    - id: 1-2.R1
      mark_type: R
      points: 10
      evidence: |
        $\displaystyle\lim_{x\to-\infty}\left(\dfrac{4}{e^{-x}+1}\right)=0$을 이용하여 $4=\displaystyle\lim_{x\to-\infty}f(x)=e=p(0)$임을 찾았다.
      depends_on: [1-2.B1]
      steps: [12b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42406}
  misconceptions:
  - id: MC-CAL-42406
    outcome_code: '71'
    wrong_work: |
      $x\to-\infty$일 때 $e^{-x}\to0$으로 착각하여 안쪽 식이 $4$로 간다고 보고 $p(4)=4$로 답함
    detect_cue: $e^{-x}$의 $x\to-\infty$ 극한을 $0$으로 씀
    feedback: $x\to-\infty$이면 $-x\to+\infty$이므로 $e^{-x}\to\infty$, 따라서 $\frac{4}{e^{-x}+1}\to0$입니다.
    remedy: [RL-2]
- id: 1-3
  stem: |
    【1-3】 방정식 $p'(x)=0$의 실근이 각각의 열린구간 $(-1,2)$, $(2,6)$, $(6,14)$에 적어도 하나씩 존재함을 보이시오. (45점)
  points: 45
  depends_on: [1-1]
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 내부함수 $g$는 증가, 치역 $(k-1,U(k))$; $k=0,3,7\notin A$에서 $f$가 일대일이 아니므로 1-1의 대우로 $p'=0$인 점이 그 치역 안에.
    steps:
    - {id: 13a, content: '$g''>0$, 치역 $(k-1,U)$; $f$ 일대일 아님 ⇒ $f''(x)=p''(g(x))g''(x)=0$인 $x$ 존재 ⇒ $p''=0$의 근 $\in(k-1,U)$; $k=0,3,7$', criteria: [1-3.R1, 1-3.R2, 1-3.R3, 1-3.R4]}
    hint_ladder:
    - 안쪽 함수를 $g(x)$로 두고 증가함수인지, 치역이 무엇인지 조사하자.
    - 1-1의 대우는 무엇인가? $f'(x)=p'(g(x))g'(x)$이다.
    - $k=0$, $3$, $7$일 때 치역 구간을 계산해 보자.
  - id: S13-B
    audience: B
    source_flow: rep2024.pdf p.102~103(인쇄 p.98~99)
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        실수 $k$에 대하여 $g(x)=\dfrac{(k-1)e^{-x}+2|k|-|k-1|+|k-2|+1}{e^{-x}+1}$라 하자. 모든 실수 $x$에 대하여 $g'(x)=\dfrac{(2|k|-|k-1|+|k-2|-k+2)e^{-x}}{(e^{-x}+1)^2}>0$이므로 함수 $g(x)$는 증가하며 일대일함수가 된다.
      criteria: [1-3.R1]
    - id: 13b-2
      content: |
        $\displaystyle\lim_{x\to\infty}g(x)=2|k|-|k-1|+|k-2|+1$이고 $g(x)<2|k|-|k-1|+|k-2|+1$이다. 또한, $\displaystyle\lim_{x\to-\infty}g(x)=k-1$이고 $g(x)>k-1$이다. 그러므로, 함수 $y=g(x)$의 치역은 $\{y\mid k-1<y<2|k|-|k-1|+|k-2|+1\}$이다.
      criteria: [1-3.R2]
    - id: 13b-3
      content: |
        $f(x)=p(g(x))$가 일대일함수가 아니면, 【1-1】에 의하여(대우, 제시문 (라)) $f'(x)=p'(g(x))g'(x)=0$을 만족하는 실수 $x$가 적어도 하나 존재하므로, $p'(x)=0$을 만족하는 실수 $x$가 열린구간 $(k-1,\ 2|k|-|k-1|+|k-2|+1)$에 적어도 하나 존재한다.
      criteria: [1-3.R3]
    - id: 13b-4
      content: |
        $k=0$일 때, $f(x)$는 일대일함수가 아니므로($0\notin A$), $p'(x)=0$을 만족하는 실수 $x$가 열린구간 $(-1,2)$에 적어도 하나 존재한다. $k=3$ 또는 $k=7$일 때, 비슷하게 $p'(x)=0$을 만족하는 실수 $x$가 열린구간 $(2,6)$과 $(6,14)$에 각각 적어도 하나 존재한다. ■
      criteria: [1-3.R4]
