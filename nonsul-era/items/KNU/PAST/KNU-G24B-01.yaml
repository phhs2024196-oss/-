intent: |
  평균값 정리를 이용하여 일대일함수를 보일 수 있는지(1-1), 함수의 극한에 대한 성질을 이해하고 극한값을 계산할 수 있는지(1-2), 명제와 그 대우의 참·거짓과 합성함수의 미분을 이용하여 방정식의 실근이 존재함을 보일 수 있는지(1-3), 극값과 미분계수 사이의 관계로 다항함수 $p(x)$의 개형을 찾고 함수의 연속을 이용하여 $h(m)$이 $m=64$에서 불연속이 되도록 하는 최고차항의 계수를 구할 수 있는지(1-4) 평가한다.
key_idea: |
  $g(x)=\dfrac{(k-1)e^{-x}+U}{e^{-x}+1}$ ($U=2|k|-|k-1|+|k-2|+1$)는 증가함수이고 치역이 $(k-1,U)$이므로 $f=p\circ g$가 일대일 ⇔ $p$가 $(k-1,U)$에서 일대일. $k=0,3,7\notin A$이면 대우(1-1)로 $p'=0$의 근이 $(-1,2)$, $(2,6)$, $(6,14)$에 존재. 집합 $A$의 경계로 $p'$의 세 근이 정확히 $0,4,8$임을 결정 → $p(x)=ax^2(x-8)^2+4$, $q(x)=ax(x-8)^2$의 극댓값 $q(8/3)=64$.
stuck: |
  1-3에서 $f$가 일대일이 아니면 1-1의 대우로 $p'(g(x))g'(x)=0$인 $x$가 있다는 연결, 1-4에서 $A$의 경계값($k=2$, $k=9$ 등)으로부터 $p'$의 근 $\alpha,\beta,\gamma$를 $0,4,8$로 확정하는 귀류 논증
