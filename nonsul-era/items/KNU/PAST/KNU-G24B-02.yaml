intent: |
  정삼각형의 성질 및 삼각함수의 덧셈정리를 활용하여 점의 좌표를 구할 수 있는지(2-1(1)), 덧셈정리로 식을 정리하여 함수를 구할 수 있는지(2-1(2)), 삼각함수의 성질을 활용하여 점의 좌표를 구할 수 있는지(2-2), 함수의 그래프의 개형을 이해하고 정적분을 활용하여 도형의 넓이를 구할 수 있는지(2-3) 평가한다.
key_idea: |
  $\angle\mathrm{PQO}=\theta$ ($\sin\theta=a$)로 두면 $\mathrm{R}=\left(\sin\left(\theta+\frac{\pi}{6}\right),\sin\left(\theta+\frac{\pi}{3}\right)\right)$. $\varphi=\theta+\frac{\pi}{6}$으로 보면 $y=\frac{\sqrt3}{2}x+\frac12\sqrt{1-x^2}$. R의 자취는 정사각형의 $90^\circ$ 회전 대칭으로 같은 모양 4개가 이어진 닫힌 곡선이고, 넓이는 $1-8S_1-4S_2$.
stuck: |
  2-3에서 R의 자취가 만드는 도형의 바깥 부분(정사각형 모서리 근처)을 대칭성으로 $8S_1+4S_2$로 분해하는 단계
