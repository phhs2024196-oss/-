  - '정삼각형 $\mathrm{PQR}$의 꼭짓점 $\mathrm{R}$(정사각형 내부 또는 변 위)의 자취'
  - '곡선 $y=\frac{\sqrt3}{2}x+\frac12\sqrt{1-x^2}$'
