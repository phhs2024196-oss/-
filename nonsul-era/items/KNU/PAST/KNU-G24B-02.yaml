  tools:
  - '각 $\theta=\angle\mathrm{PQO}$ 매개화: $\mathrm{Q}(\cos\theta,0)$, $\mathrm{R}=(\sin(\theta+\frac{\pi}{6}),\sin(\theta+\frac{\pi}{3}))$'
  - '$y=\sin\left(\left(\theta+\frac{\pi}{6}\right)+\frac{\pi}{6}\right)$로 다시 덧셈정리 → $x$만의 식'
  - '$\cos\left(\theta+\frac{\pi}{6}\right)\ge0$ 이므로 $\cos=\sqrt{1-x^2}$'
