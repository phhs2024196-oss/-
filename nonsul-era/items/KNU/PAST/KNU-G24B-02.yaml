stimuli:
- label: (가)
  body: |
    삼각함수의 덧셈정리

    $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$

    $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$

    $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$

    $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$

    $\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$

    $\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$
- label: (나)
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b|f(x)-g(x)|\,dx$$
- label: (다)
  body: |
    함수 $f(x)$가 세 실수 $a$, $b$, $c$를 포함하는 닫힌구간에서 연속일 때,
    $$\int_a^bf(x)\,dx+\int_b^cf(x)\,dx=\int_a^cf(x)\,dx$$
    이다.
- label: (라)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때, 도함수 $g'(t)$가 $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
    이다.

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  좌표평면 위에 원점 $\mathrm{O}(0,0)$과 세 점 $\mathrm{A}(0,1)$, $\mathrm{B}(1,1)$, $\mathrm{C}(1,0)$이 있다. 세 점 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$는 다음과 같은 규칙으로 움직인다.

  > (ㄱ) 선분 $\mathrm{PQ}$의 길이는 항상 $1$이다.
  > (ㄴ) 두 점 $\mathrm{P}$와 $\mathrm{Q}$는 각각 점 $\mathrm{O}$와 점 $\mathrm{C}$에서 출발하여 정사각형 $\mathrm{OABC}$의 변을 따라 시계 방향으로 움직인다.
  > (ㄷ) 점 $\mathrm{R}$는 정사각형 $\mathrm{OABC}$의 내부 또는 변 위에 있고, 삼각형 $\mathrm{PQR}$가 정삼각형이 되도록 움직인다.

subparts:
- id: 2-1-1
  stem: |
    【2-1】 두 점 $\mathrm{P}$와 $\mathrm{Q}$가 각각 정사각형 $\mathrm{OABC}$의 변 $\mathrm{OA}$와 변 $\mathrm{OC}$ 위에 있을 때, 점 $\mathrm{P}$의 $y$좌표를 $a$라 하자. 아래 물음에 답하시오.

    (1) 점 $\mathrm{R}$의 좌표 $(x,y)$를 $a$를 이용하여 나타내시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: expression, value: '((sqrt(3)*a + sqrt(1 - a**2))/2, (a + sqrt(3*(1 - a**2)))/2)', equivalents: ['x=(√3a+√(1-a²))/2, y=(a+√(3(1-a²)))/2'], tolerance: null}
  solutions:
  - id: S211-A
    audience: A
    method_no: 1
    key_idea: $\theta=\angle\mathrm{PQO}$이면 $\mathrm{QR}$이 $x$축과 이루는 각은 $\theta+\frac{\pi}{3}$, R은 Q에서 길이 1.
    steps:
    - {id: 211a, content: '$x=\sin(\theta+\frac{\pi}{6})$, $y=\sin(\theta+\frac{\pi}{3})$, $\sin\theta=a$, $\cos\theta=\sqrt{1-a^2}$ 대입', criteria: [2-1-1.M1, 2-1-1.A1, 2-1-1.A2]}
    hint_ladder:
    - $\mathrm{Q}$의 좌표를 $a$로 나타내고 $\angle\mathrm{PQO}=\theta$로 두자.
    - $\mathrm{R}$은 $\mathrm{Q}$에서 어떤 방향으로 길이 $1$만큼 떨어져 있는가?
  - id: S211-B
    audience: B
    source_flow: rep2024.pdf p.108(인쇄 p.104)
    method_no: 1
    steps:
    - id: 211b-1
      content: |
        정삼각형 $\mathrm{PQR}$의 한 변의 길이가 $1$이므로 점 $\mathrm{Q}$의 좌표는 $(\sqrt{1-a^2},0)$이다. 각 $\mathrm{PQO}$의 크기를 $\theta$라고 두면, 정삼각형 $\mathrm{PQR}$의 한 변의 길이가 $1$이므로 $x=\sin\left(\theta+\dfrac{\pi}{6}\right)$, $y=\sin\left(\theta+\dfrac{\pi}{3}\right)$임을 알 수 있다. 또한, $\sin\theta=a$, $\cos\theta=\sqrt{1-a^2}$이 성립한다.
      criteria: [2-1-1.M1]
    - id: 211b-2
      content: |
        삼각함수의 덧셈정리를 이용하면
        $$x=\sin\left(\theta+\dfrac{\pi}{6}\right)=\sin\theta\cos\dfrac{\pi}{6}+\cos\theta\sin\dfrac{\pi}{6}=\dfrac{\sqrt3a+\sqrt{1-a^2}}{2}$$
      criteria: [2-1-1.A1]
    - id: 211b-3
      content: |
        $$y=\sin\left(\theta+\dfrac{\pi}{3}\right)=\sin\theta\cos\dfrac{\pi}{3}+\cos\theta\sin\dfrac{\pi}{3}=\dfrac{a+\sqrt{3(1-a^2)}}{2}$$
        이다.
      criteria: [2-1-1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1-1.M1
      mark_type: M
      points: 10
      evidence: |
        각 $\mathrm{PQO}$의 크기를 $\theta$라고 두었을 때, $x=\sin\left(\theta+\dfrac{\pi}{6}\right)$, $y=\sin\left(\theta+\dfrac{\pi}{3}\right)$임을 구했다.
      steps: [211b-1]
    - id: 2-1-1.A1
      mark_type: A
      points: 10
      evidence: |
        $x=\dfrac{\sqrt3a+\sqrt{1-a^2}}{2}$을 구했다.
      depends_on: [2-1-1.M1]
      steps: [211b-2]
    - id: 2-1-1.A2
      mark_type: A
      points: 10
      evidence: |
        $y=\dfrac{a+\sqrt{3(1-a^2)}}{2}$을 구했다.
      depends_on: [2-1-1.M1]
      steps: [211b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42410}
  misconceptions:
  - id: MC-CAL-42410
    outcome_code: '71'
    wrong_work: |
      $\mathrm{QR}$의 방향각을 $\pi-\theta-\frac{\pi}{3}$ 등으로 잡아 R을 정사각형 바깥(아래쪽)에 두거나 $x=\cos(\theta+\frac{\pi}{3})$처럼 사인·코사인을 혼동
    detect_cue: $a=0$일 때 R이 $\left(\frac12,\frac{\sqrt3}{2}\right)$가 아닌 값이 나옴
    feedback: $a=0$이면 $\mathrm{P}=\mathrm{O}$, $\mathrm{Q}=\mathrm{C}$이고 R은 $\left(\frac12,\frac{\sqrt3}{2}\right)$이어야 합니다. 특수한 경우로 방향을 검증하세요.
    remedy: [RL-1]
- id: 2-1-2
  stem: |
    (2) $0\le a\le\dfrac{\sqrt3}{2}$일 때, 점 $\mathrm{R}$의 좌표 $(x,y)$에 대하여
    $$y=c_1x+c_2\sqrt{c_3-x^2}$$
    이 성립한다. 세 실수 $c_1$, $c_2$, $c_3$을 각각 구하시오. (40점)
  points: 40
  depends_on: [2-1-1]
  answer: {kind: value, value: '(sqrt(3)/2, 1/2, 1)', equivalents: ['c_1=√3/2, c_2=1/2, c_3=1'], tolerance: null}
  solutions:
  - id: S212-A
    audience: A
    method_no: 1
    key_idea: $y=\sin\left(\left(\theta+\frac{\pi}{6}\right)+\frac{\pi}{6}\right)$, $\cos\left(\theta+\frac{\pi}{6}\right)=\sqrt{1-x^2}\ (\ge0)$.
    steps:
    - {id: 212a, content: '$0\le\theta\le\frac{\pi}{3}$ ⇒ $\cos(\theta+\frac{\pi}{6})\ge0$ ⇒ $y=\frac{\sqrt3}{2}x+\frac12\sqrt{1-x^2}$', criteria: [2-1-2.R1, 2-1-2.A1, 2-1-2.A2, 2-1-2.A3]}
    hint_ladder:
    - $\theta+\frac{\pi}{3}=\left(\theta+\frac{\pi}{6}\right)+\frac{\pi}{6}$로 보자.
    - $\cos\left(\theta+\frac{\pi}{6}\right)$을 $x$로 나타낼 때 부호를 확인하자.
  - id: S212-B
    audience: B
    source_flow: rep2024.pdf p.108(인쇄 p.104)
    method_no: 1
    steps:
    - id: 212b-1
      content: |
        문제 (1)에서 $y=\sin\left(\theta+\dfrac{\pi}{3}\right)=\sin\left(\left(\theta+\dfrac{\pi}{6}\right)+\dfrac{\pi}{6}\right)$이므로, 삼각함수의 덧셈정리를 이용하면 $y=\sin\left(\theta+\dfrac{\pi}{6}\right)\cos\dfrac{\pi}{6}+\cos\left(\theta+\dfrac{\pi}{6}\right)\sin\dfrac{\pi}{6}$이다.
      criteria: [2-1-2.R1]
    - id: 212b-2
      content: |
        한편, $0\le a\le\dfrac{\sqrt3}{2}$이면 $0\le\theta\le\dfrac{\pi}{3}$이므로 $\dfrac{\pi}{6}\le\theta+\dfrac{\pi}{6}\le\dfrac{\pi}{2}$이고, 따라서 $\cos\left(\theta+\dfrac{\pi}{6}\right)\ge0$이다. $x=\sin\left(\theta+\dfrac{\pi}{6}\right)$, $\sin^2\left(\theta+\dfrac{\pi}{6}\right)+\cos^2\left(\theta+\dfrac{\pi}{6}\right)=1$이므로,
        $$y=\sin\left(\theta+\dfrac{\pi}{6}\right)\cos\dfrac{\pi}{6}+\cos\left(\theta+\dfrac{\pi}{6}\right)\sin\dfrac{\pi}{6}=\dfrac{\sqrt3}{2}x+\dfrac12\sqrt{1-x^2}$$
        이다.
      criteria: [2-1-2.R1]
    - id: 212b-3
      content: |
        그러므로 $c_1=\dfrac{\sqrt3}{2}$, $c_2=\dfrac12$, $c_3=1$이다.
      criteria: [2-1-2.A1, 2-1-2.A2, 2-1-2.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1-2.R1
      mark_type: R
      points: 10
      evidence: |
        $0\le a\le\dfrac{\sqrt3}{2}$일 때, $\theta$의 범위 $0\le\theta\le\dfrac{\pi}{3}$를 구했다.
      steps: [212b-1, 212b-2]
    - id: 2-1-2.A1
      mark_type: A
      points: 10
      evidence: |
        $c_1=\dfrac{\sqrt3}{2}$을 구했다.
      depends_on: [2-1-2.R1]
      steps: [212b-3]
    - id: 2-1-2.A2
      mark_type: A
      points: 10
      evidence: |
        $c_2=\dfrac12$을 구했다.
      depends_on: [2-1-2.R1]
      steps: [212b-3]
    - id: 2-1-2.A3
      mark_type: A
      points: 10
      evidence: |
        $c_3=1$을 구했다.
      depends_on: [2-1-2.R1]
      steps: [212b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42411}
  misconceptions:
  - id: MC-CAL-42411
    outcome_code: '71'
    wrong_work: |
      $\cos\left(\theta+\frac{\pi}{6}\right)=\pm\sqrt{1-x^2}$에서 부호를 정하지 않거나, (1)의 식에서 $a$를 직접 소거하려다 $\sqrt{1-a^2}$을 잘못 제곱해 $c_2$·$c_3$이 틀림
    detect_cue: $\theta$ 범위 확인이 없음, $c_2=-\frac12$ 또는 $c_3\ne1$
    feedback: $0\le\theta\le\frac{\pi}{3}$이면 $\theta+\frac{\pi}{6}\in\left[\frac{\pi}{6},\frac{\pi}{2}\right]$라 코사인이 음이 아닙니다.
    remedy: [RL-1]
- id: 2-2
  stem: |
    【2-2】 세 점 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$가 모두 정사각형 $\mathrm{OABC}$의 변 위에 있을 때, 가능한 점 $\mathrm{R}$의 좌표를 모두 구하시오. (25점)
  points: 25
  depends_on: [2-1-1]
  answer:
    kind: set
    value: '{(1, sqrt(3)/2), (sqrt(3)/2, 1), (1, 1 - sqrt(3)/2), (sqrt(3)/2, 0), (1 - sqrt(3)/2, 0), (0, 1 - sqrt(3)/2), (0, sqrt(3)/2), (1 - sqrt(3)/2, 1)}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: P가 OA 위이면 R이 변 위 ⇔ $x=1$ 또는 $y=1$ ⇔ $\theta=\frac{\pi}{3}$ 또는 $\frac{\pi}{6}$; 나머지는 $90^\circ$ 회전 대칭.
    steps:
    - {id: 22a, content: '$\theta=\frac{\pi}{3}$: $(1,\frac{\sqrt3}{2})$, $\theta=\frac{\pi}{6}$: $(\frac{\sqrt3}{2},1)$, 회전으로 8개', criteria: [2-2.R1, 2-2.A1]}
    hint_ladder:
    - P가 변 OA 위에 있을 때, R이 변 위에 있으려면 $x$ 또는 $y$가 얼마여야 하는가?
    - 정사각형을 중심에 대해 $90^\circ$ 돌리면 P가 다음 변으로 옮겨 간다.
  - id: S22-B
