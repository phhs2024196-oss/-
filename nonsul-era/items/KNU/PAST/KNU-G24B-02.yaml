  conditions:
  - '$0\le a\le\frac{\sqrt3}{2}$ ⇔ $0\le\theta\le\frac{\pi}{3}$'
  - '$\mathrm{R}$은 정사각형 내부 또는 변 위'
  - 'P가 변 OA 위에 있을 때 $0\le\theta\le\frac{\pi}{2}$'
