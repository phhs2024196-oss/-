        따라서, 구하고자 하는 점 $\mathrm{R}$의 좌표를 모두 구하면 $\left(1,\dfrac{\sqrt3}{2}\right)$, $\left(\dfrac{\sqrt3}{2},1\right)$, $\left(1,1-\dfrac{\sqrt3}{2}\right)$, $\left(\dfrac{\sqrt3}{2},0\right)$, $\left(1-\dfrac{\sqrt3}{2},0\right)$, $\left(0,1-\dfrac{\sqrt3}{2}\right)$, $\left(0,\dfrac{\sqrt3}{2}\right)$, $\left(1-\dfrac{\sqrt3}{2},1\right)$이다.
