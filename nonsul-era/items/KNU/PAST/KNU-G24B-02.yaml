    key_idea: 넓이 $=1-8S_1-4S_2$, $S_1$·$S_2$는 곡선 $y=\frac{\sqrt3}{2}x+\frac12\sqrt{1-x^2}$ 위쪽과 $y=1$ 사이.
    steps:
    - {id: 23a, content: '$S_1=\frac{3\sqrt3}{8}-\frac12-\frac{\pi}{24}$, $S_2=1-\frac{\sqrt3}{2}-\frac{\pi}{24}$ ⇒ $S=1+\frac{\pi}{2}-\sqrt3$', criteria: [2-3.R1, 2-3.M1, 2-3.M2, 2-3.A1]}
    hint_ladder:
    - R의 자취를 정사각형 안에 그리고, 바깥(모서리) 부분이 몇 개의 합동 조각으로 나뉘는지 보자.
    - $\int\sqrt{1-x^2}\,dx$는 $x=\sin\theta$로 치환한다.
  - id: S23-B
    audience: B
    source_flow: rep2024.pdf p.108~109(인쇄 p.104~105)
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        정사각형 $\mathrm{OABC}$에서 점 $\mathrm{R}$가 그리는 도형의 바깥 부분의 면적을 계산하자. 직선 $x=\dfrac12$, $y=1$과 곡선 $y=\dfrac{\sqrt3}{2}x+\dfrac{\sqrt{1-x^2}}{2}$으로 둘러싸인 영역의 넓이를 $S_1$이라 하고, 직선 $x=1$, $y=1$과 곡선 $y=\dfrac{\sqrt3}{2}x+\dfrac{\sqrt{1-x^2}}{2}$으로 둘러싸인 영역의 넓이를 $S_2$라 하자. 점 $\mathrm{P}$가 정사각형 $\mathrm{OABC}$의 변을 따라 한 바퀴 돌 때, 점 $\mathrm{R}$가 나타내는 도형의 넓이 $S$는 $1-8S_1-4S_2$이다.
      criteria: [2-3.R1]
    - id: 23b-2
      content: |
        $$S_1=\int_{\frac12}^{\frac{\sqrt3}{2}}\left\{1-\left(\dfrac{\sqrt3}{2}x+\dfrac{\sqrt{1-x^2}}{2}\right)\right\}dx=\dfrac{3\sqrt3}{8}-\dfrac12-\dfrac12\int_{\frac{\pi}{6}}^{\frac{\pi}{3}}\cos^2\theta\,d\theta=\dfrac{3\sqrt3}{8}-\dfrac12-\dfrac12\int_{\frac{\pi}{6}}^{\frac{\pi}{3}}\dfrac{\cos2\theta+1}{2}\,d\theta=\dfrac{3\sqrt3}{8}-\dfrac12-\dfrac{\pi}{24}$$
      criteria: [2-3.M1]
    - id: 23b-3
      content: |
        $$S_2=\int_{\frac{\sqrt3}{2}}^{1}\left\{1-\left(\dfrac{\sqrt3}{2}x+\dfrac{\sqrt{1-x^2}}{2}\right)\right\}dx=1-\dfrac{\sqrt3}{2}-\dfrac{\sqrt3}{16}-\dfrac12\int_{\frac{\pi}{3}}^{\frac{\pi}{2}}\cos^2\theta\,d\theta=1-\dfrac{9\sqrt3}{16}-\dfrac12\int_{\frac{\pi}{3}}^{\frac{\pi}{2}}\dfrac{\cos2\theta+1}{2}\,d\theta=1-\dfrac{\sqrt3}{2}-\dfrac{\pi}{24}$$
      criteria: [2-3.M2]
    - id: 23b-4
      content: |
        $$\therefore S=1-8S_1-4S_2=1-8\left(\dfrac{3\sqrt3}{8}-\dfrac12-\dfrac{\pi}{24}\right)-4\left(1-\dfrac{\sqrt3}{2}-\dfrac{\pi}{24}\right)=1+\dfrac{\pi}{2}-\sqrt3$$
      criteria: [2-3.A1]
