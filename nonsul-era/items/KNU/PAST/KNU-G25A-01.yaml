intent: |
  등비급수의 합을 시각적으로 이해하고 그 합을 구할 수 있는지, 삼각함수의 덧셈정리로 삼각함수의 값을 구할 수 있는지(1-1), 수학적 귀납법의 원리를 이해하고 명제를 증명할 수 있는지(1-2), 정적분을 이용하여 급수의 합을 구할 수 있는지(1-3) 평가한다.
key_idea: |
  수선의 발을 두 번 내릴 때마다 길이가 $\cos^2\theta$배가 되므로 $h_k=j^2\sin\theta\cos^{2k-2}\theta$이고 $\sqrt{h_k}$는 공비 $\cos\theta$인 등비수열이다. $S_j=jS_1$이므로 교대합이 $\frac{2}{S_1}\left(1-\frac12+\cdots-\frac1{2n}\right)=\frac{2}{S_1}\sum_{i=1}^n\frac{1}{n+i}$이 되어 구분구적법으로 $\ln2$가 된다.
stuck: |
  1-3에서 $\sum(-1)^{j+1}\dfrac{2}{S_j}$를 1-2의 교대 조화합과 연결하는 단계
