stimuli:
- label: (가)
  body: |
    등비급수 $\displaystyle\sum_{n=1}^{\infty}ar^{n-1}\ (a\ne0)$은

    (ⅰ) $\lvert r\rvert<1$일 때 수렴하고, 그 합은 $\dfrac{a}{1-r}$이다.

    (ⅱ) $\lvert r\rvert\ge1$일 때 발산한다.
- label: (나)
  body: |
    삼각함수의 덧셈정리

    $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$

    $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$

    $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$

    $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$
- label: (다)
  body: |
    자연수 $n$에 대하여 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.

    (ⅰ) $n=1$일 때, 명제 $p(n)$이 성립한다.

    (ⅱ) $n=k$일 때, 명제 $p(n)$이 성립한다고 가정하면 $n=k+1$일 때에도 명제 $p(n)$이 성립한다.
- label: (라)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때

    $$\int_a^bf(x)\,dx=\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\varDelta x$$

    (단, $\varDelta x=\dfrac{b-a}{n}$, $x_k=a+k\varDelta x$)

# [그림: O에서 시작하는 두 반직선 OA₁(수평)과 OB₁ 사이의 각 θ. A₁B₁⊥OA₁(높이 h₁), A₁→OB₁ 수선의 발 B₂, B₂→OA₁ 수선의 발 A₂(높이 h₂), … 로 A₃, B₃, B₄ 가 O 쪽으로 반복]
stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  그림과 같이 $\angle\mathrm{A_1OB_1}=\theta$이고 $\angle\mathrm{OA_1B_1}=\dfrac{\pi}{2}$인 삼각형 $\mathrm{OA_1B_1}$이 있다. 선분 $\mathrm{A_1B_1}$의 길이를 $h_1$이라 하자. 점 $\mathrm{A_1}$에서 선분 $\mathrm{OB_1}$에 내린 수선의 발을 $\mathrm{B_2}$, 점 $\mathrm{B_2}$에서 선분 $\mathrm{OA_1}$에 내린 수선의 발을 $\mathrm{A_2}$라 하고, 이때 선분 $\mathrm{A_2B_2}$의 길이를 $h_2$라 하자. 점 $\mathrm{A_2}$에서 선분 $\mathrm{OB_1}$에 내린 수선의 발을 $\mathrm{B_3}$, 점 $\mathrm{B_3}$에서 선분 $\mathrm{OA_1}$에 내린 수선의 발을 $\mathrm{A_3}$이라 하고, 이때 선분 $\mathrm{A_3B_3}$의 길이를 $h_3$이라 하자. 이와 같은 과정을 계속하여 얻은 $k$ 번째 선분 $\mathrm{A}_k\mathrm{B}_k$의 길이를 $h_k$라 하자.

  선분 $\mathrm{OB_1}$의 길이가 $j^2$이고 $\theta$가 $\cos\left(\theta+\dfrac{\pi}{6}\right)=\dfrac{3\sqrt5-1}{8}$을 만족할 때, $\displaystyle\sum_{k=1}^{\infty}\sqrt{h_k}$의 값을 $S_j$라 하자. (단, $j$는 자연수)

  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【1-1】 $S_1=\boxed{(\text{ㄱ})}+\boxed{(\text{ㄴ})}\sqrt{15}$이다. (ㄱ)과 (ㄴ)에 알맞은 자연수를 각각 구하시오. (40점)
  points: 40
  depends_on: []
  answer: {kind: value, value: '8; 2', equivalents: ['(ㄱ)=8, (ㄴ)=2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $h_k=\sin\theta\cos^{2k-2}\theta$이므로 $S_1=\dfrac{\sqrt{\sin\theta}}{1-\cos\theta}$, 덧셈정리로 $\sin\theta=\frac14$.
    steps:
    - {id: 1a, content: '$S_1=\dfrac{\sqrt{\sin\theta}}{1-\cos\theta}$, $\sin\theta=\frac14$, $\cos\theta=\frac{\sqrt{15}}{4}$ $\Rightarrow S_1=8+2\sqrt{15}$', criteria: [1.M1, 1.B1, 1.A1]}
    hint_ladder:
    - $h_1$과 $h_2$의 비는 수선을 몇 번 내린 결과인가?
    - $\cos\theta$를 $\sin\theta$로 나타내 $\sin^2\theta+\cos^2\theta=1$에 대입해 보자.
  - id: S1-B
    audience: B
    source_flow: rep2025.pdf p.82
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{OB_1}}=1$일 때 수열 $h_k=(\sin\theta)(\cos^{2k-2}\theta)$는 초항이 $\sin\theta$, 공비가 $\cos^2\theta$인 등비수열이므로 제시문 (가)에 의해 $\displaystyle\sum_{k=1}^{\infty}\sqrt{h_k}=\dfrac{\sqrt{\sin\theta}}{1-\cos\theta}$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\cos\left(\theta+\dfrac{\pi}{6}\right)=\dfrac{3\sqrt5-1}{8}$이고 $\cos\left(\theta+\dfrac{\pi}{6}\right)=\dfrac{\sqrt3}{2}\cos\theta-\dfrac12\sin\theta$이므로 $\cos\theta=\dfrac{1}{\sqrt3}\sin\theta+\dfrac{3\sqrt5-1}{4\sqrt3}$이다. $\sin^2\theta+\cos^2\theta=1$과 연립하여 정리하면 $32\sin^2\theta+(12\sqrt5-4)\sin\theta-(1+3\sqrt5)=0$이고, 인수분해하면 $(4\sin\theta-1)(8\sin\theta+1+3\sqrt5)=0$이다. $0<\theta<\dfrac{\pi}{2}$이므로 $\sin\theta=\dfrac14$, $\cos\theta=\dfrac{\sqrt{15}}{4}$이다.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        따라서 $\displaystyle\sum_{k=1}^{\infty}\sqrt{h_k}=\dfrac{\frac12}{1-\frac{\sqrt{15}}{4}}=\dfrac{2}{4-\sqrt{15}}=8+2\sqrt{15}$이다. 즉, (ㄱ)은 $8$, (ㄴ)은 $2$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $j=1$일 때 $S_1=\displaystyle\sum_{k=1}^{\infty}\sqrt{h_k}=\dfrac{\sqrt{\sin\theta}}{1-\cos\theta}$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 10
      evidence: |
        $\sin\theta=\dfrac14$, $\cos\theta=\dfrac{\sqrt{15}}{4}$임을 구했다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        (ㄱ)$=8$, (ㄴ)$=2$를 구했다.
      depends_on: [1.M1, 1.B1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42501}
  - {code: '72', misconception: MC-CAL-42502}
  misconceptions:
  - id: MC-CAL-42501
    outcome_code: '71'
    wrong_work: '$\sqrt{h_k}$의 공비를 $\cos^2\theta$로 두어 $S_1=\dfrac{\sqrt{\sin\theta}}{1-\cos^2\theta}=8$'
    detect_cue: 분모가 $1-\cos^2\theta$ 또는 $\sin^2\theta$이다
    feedback: $h_k$의 공비가 $\cos^2\theta$이면 $\sqrt{h_k}$의 공비는 $\cos\theta$입니다.
    remedy: [RL-1]
  - id: MC-CAL-42502
    outcome_code: '72'
    wrong_work: '$8\sin\theta+1+3\sqrt5=0$의 근까지 후보로 남기거나 $\cos\theta=-\frac{\sqrt{15}}{4}$를 택함'
    detect_cue: 음수 $\sin\theta$ 또는 음수 $\cos\theta$가 계산에 쓰였다
    feedback: 그림의 삼각형에서 $\theta$는 예각이므로 $\sin\theta>0$, $\cos\theta>0$입니다.
    remedy: [RL-2]

- id: '2'
  stem: |
    【1-2】 다음은 모든 자연수 $n$에 대하여 등식

    $$1-\frac12+\frac13-\frac14+\cdots+\frac{1}{2n-1}-\frac{1}{2n}=\sum_{i=1}^{n}\frac{1}{n+i}$$

    이 성립함을 수학적 귀납법으로 증명한 것이다.

    <증명>

    (1) $n=1$일 때, (좌변)$=\boxed{(\text{ㄷ})}=$(우변)이므로 주어진 등식은 성립한다.

    (2) $n=k$일 때, 주어진 등식이 성립한다고 가정하면

    $$1-\frac12+\frac13-\frac14+\cdots+\frac{1}{2k-1}-\frac{1}{2k}=\sum_{i=1}^{k}\frac{1}{k+i}$$

    이다. $n=k+1$일 때 성립함을 보이자.

    $$\begin{aligned}&1-\frac12+\frac13-\frac14+\cdots+\frac{1}{2k-1}-\frac{1}{2k}+\frac{1}{2k+1}-\frac{1}{2k+2}\\&=\sum_{i=1}^{k}\frac{1}{k+i}+\frac{1}{2k+1}-\frac{1}{2k+2}\\&=\sum_{i=2}^{k+1}\frac{1}{k+i}+\frac{1}{\boxed{(\text{ㄹ})}}\\&=\sum_{i=1}^{k+1}\frac{1}{\boxed{(\text{ㅁ})}}\end{aligned}$$

    따라서 $n=k+1$일 때도 성립한다.

    (1), (2)에 의하여 주어진 등식은 모든 자연수 $n$에 대하여 성립한다.

    위의 (ㄷ)에 알맞은 수, (ㄹ)에 알맞은 $k$에 관한 식, (ㅁ)에 알맞은 $i$와 $k$에 관한 식을 각각 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: expression, value: '1/2; 2*k+2; k+i+1', equivalents: ['(ㄷ)=1/2, (ㄹ)=2k+2, (ㅁ)=k+i+1'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\frac{1}{2k+1}=\frac{1}{k+(k+1)}$로 합에 흡수하고, 남은 $\frac{1}{k+1}-\frac{1}{2k+2}=\frac{1}{2k+2}$를 첨자 이동으로 정리한다.
    steps:
    - {id: 2a, content: '(ㄷ)$=\frac12$, (ㄹ)$=2k+2$, (ㅁ)$=k+i+1$', criteria: [2.B1, 2.B2, 2.B3]}
    hint_ladder:
    - $\sum_{i=1}^{k}\frac1{k+i}$의 첫 항 $\frac1{k+1}$과 $-\frac{1}{2k+2}$를 묶어 보자.
  - id: S2-B
    audience: B
    source_flow: rep2025.pdf p.83
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1) $n=1$일 때, (좌변)$=1-\dfrac12=\dfrac12=$(우변)이므로 주어진 등식은 성립한다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        (2) $n=k$일 때 성립한다고 가정하면 $n=k+1$일 때 (좌변)$=\displaystyle\sum_{i=1}^{k}\frac{1}{k+i}+\frac{1}{2k+1}-\frac{1}{2k+2}$이고, $\dfrac{1}{k+1}-\dfrac{1}{2k+2}=\dfrac{1}{2k+2}$이므로 $=\displaystyle\sum_{i=2}^{k+1}\frac{1}{k+i}+\frac{1}{2k+2}$이다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        $\displaystyle\sum_{i=2}^{k+1}\frac{1}{k+i}+\frac{1}{2k+2}=\sum_{i=1}^{k+1}\frac{1}{(k+1)+i}$이므로 $n=k+1$일 때도 성립한다. 그러므로 (ㄷ)은 $\dfrac12$, (ㄹ)은 $2k+2$, (ㅁ)은 $k+i+1$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 10
      evidence: |
        (ㄷ)$=\dfrac12$을 구했다.
      steps: [2b-1]
    - id: 2.B2
      mark_type: B
      points: 10
      evidence: |
        (ㄹ)$=2k+2$를 구했다.
      steps: [2b-2]
    - id: 2.B3
      mark_type: B
      points: 10
      evidence: |
        (ㅁ)$=k+i+1$을 구했다.
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-SEQ-42501}
  misconceptions:
  - id: MC-SEQ-42501
    outcome_code: '71'
    wrong_work: '(ㄹ)$=2k+1$, (ㅁ)$=k+i$'
    detect_cue: 첨자를 옮긴 뒤 남는 항과 $n=k+1$에서의 일반항 $\frac{1}{(k+1)+i}$을 맞추지 않았다
    feedback: $i=1$ 항 $\frac1{k+1}$이 $-\frac1{2k+2}$와 합쳐져 $\frac1{2k+2}$가 남습니다. $n=k+1$일 때 우변의 일반항은 $\frac{1}{(k+1)+i}$입니다.
    remedy: [RL-3]

- id: '3'
  stem: |
    【1-3】 극한값

    $$\lim_{n\to\infty}\sum_{j=1}^{2n}(-1)^{j+1}\frac{2}{S_j}+\sqrt{15}\ln2=\ln\boxed{(\text{ㅂ})}$$

    이다. (ㅂ)에 알맞은 자연수를 구하시오. (50점)
  points: 50
  depends_on: ['1', '2']
  answer: {kind: value, value: '16', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $S_j=jS_1$이므로 교대합이 $\frac{2}{S_1}\sum_{i=1}^n\frac{1}{n+i}\to\frac{2\ln2}{S_1}=(4-\sqrt{15})\ln2$.
    steps:
    - {id: 3a, content: '$(4-\sqrt{15})\ln2+\sqrt{15}\ln2=4\ln2=\ln16$', criteria: [3.M1, 3.M2, 3.M3, 3.A1]}
    hint_ladder:
    - $S_j$와 $S_1$의 관계는? ($\overline{\mathrm{OB_1}}=j^2$이면 $\sqrt{h_k}$는 몇 배?)
    - 1-2의 등식을 쓰면 교대합이 어떤 리만 합이 되는가?
  - id: S3-B
    audience: B
    source_flow: rep2025.pdf p.83
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $S_j=\dfrac{j\sqrt{\sin\theta}}{1-\cos\theta}=j(8+2\sqrt{15})$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        【1-2】에 의해 $\displaystyle\sum_{j=1}^{2n}(-1)^{j+1}\frac{2}{S_j}=2\left(\frac{1}{S_1}-\frac{1}{S_2}+\cdots+\frac{1}{S_{2n-1}}-\frac{1}{S_{2n}}\right)=\frac{1}{4+\sqrt{15}}\left(1-\frac12+\frac13-\cdots+\frac{1}{2n-1}-\frac{1}{2n}\right)=\frac{1}{4+\sqrt{15}}\sum_{i=1}^{n}\frac{1}{n+i}$이다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        제시문 (라)에 의해 $\displaystyle\lim_{n\to\infty}\sum_{i=1}^{n}\frac{1}{n+i}=\lim_{n\to\infty}\sum_{i=1}^{n}\frac{1}{1+\frac{i}{n}}\cdot\frac1n=\int_0^1\frac{1}{1+x}dx=\Big[\ln\lvert1+x\rvert\Big]_0^1=\ln2$이므로 극한은 $\dfrac{\ln2}{4+\sqrt{15}}=(4-\sqrt{15})\ln2$이다.
      criteria: [3.M3]
    - id: 3b-4
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}\sum_{j=1}^{2n}(-1)^{j+1}\frac{2}{S_j}+\sqrt{15}\ln2=4\ln2=\ln16$이다. 즉, (ㅂ)은 $16$이다.
      criteria: [3.A1]
