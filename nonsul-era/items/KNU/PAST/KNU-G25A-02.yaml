stimuli:
- label: (가)
  body: |
    탄젠트함수의 덧셈정리

    $\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$

    $\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$
- label: (나)
  body: |
    점 $(x_1,y_1)$과 직선 $ax+by+c=0$ ($a\ne0$ 또는 $b\ne0$) 사이의 거리 $d$는

    $$d=\frac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$$
- label: (다)
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능할 때,

    $\{f(x)g(x)\}'=f'(x)g(x)+f(x)g'(x)$
- label: (라)
  body: |
    두 함수 $f(x)$, $g(x)$ ($g(x)\ne0$)가 미분가능할 때,

    $y=\dfrac{f(x)}{g(x)}$이면 $y'=\dfrac{f'(x)g(x)-f(x)g'(x)}{\{g(x)\}^2}$
- label: (마)
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는

    $\{f(g(x))\}'=f'(g(x))g'(x)$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  곡선 $y=\sqrt{8x+16}$ 위의 점 $\mathrm{B}(t,\sqrt{8t+16})$에 대하여 $x$축 위의 세 점 $\mathrm{A_1}(a_1,0)$, $\mathrm{A_2}(a_2,0)$, $\mathrm{A_3}(a_3,0)$이 다음 조건을 만족한다. (단, $t\ge-1$)

  (Ⅰ) $0<a_1<a_2<a_3$

  (Ⅱ) 삼각형 $\mathrm{OA_1B}$, $\mathrm{A_1A_2B}$, $\mathrm{A_2A_3B}$의 내접원의 반지름의 길이는 모두 $1$이다. (단, $\mathrm{O}$는 원점)

  실수 $t\ge-1$에서 정의된 함수

  $$f(t)=\tan\left(\frac{\angle\mathrm{OA_1B}}{2}\right),\quad g(t)=\tan\left(\frac{\angle\mathrm{OA_2B}}{2}\right),\quad h(t)=\tan\left(\frac{\angle\mathrm{OA_3B}}{2}\right)$$

  에 대하여 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【2-1】 내접원의 반지름의 길이가 $r$, 높이가 $q$이고 양 밑각이 $\alpha$, $\beta$인 삼각형의 넓이 $S$에 대하여 다음이 각각 성립함을 보이시오. (40점)

    (1) $S=\dfrac{rq}{2}\left\{\cot\left(\dfrac{\alpha}{2}\right)+\cot\left(\dfrac{\beta}{2}\right)\right\}$

    (2) $S=r^2\left\{\cot\left(\dfrac{\alpha}{2}\right)+\cot\left(\dfrac{\beta}{2}\right)+\dfrac{\cot\left(\frac{\alpha}{2}\right)+\cot\left(\frac{\beta}{2}\right)}{\cot\left(\frac{\alpha}{2}\right)\cot\left(\frac{\beta}{2}\right)-1}\right\}$
  points: 40
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선의 길이 $r\cot\frac{\alpha}{2}$로 밑변을 나타내고, 넓이 $=\frac12(\text{둘레})r$에서 $\cot\frac\gamma2=\tan\frac{\alpha+\beta}2$를 덧셈정리로 바꾼다.
    steps:
    - {id: 1a, content: '$\overline{\mathrm{AB}}=r(\cot\frac\alpha2+\cot\frac\beta2)$, $S=\frac12\overline{\mathrm{AB}}q$; $S=r^2\sum\cot\frac{\cdot}{2}$, $\cot\frac\gamma2=\frac{\cot\frac\alpha2+\cot\frac\beta2}{\cot\frac\alpha2\cot\frac\beta2-1}$', criteria: [1.R1, 1.R2]}
    hint_ladder:
    - 내심에서 밑변에 내린 수선의 발이 밑변을 어떻게 나누는가?
    - $\gamma=\pi-(\alpha+\beta)$이면 $\cot\frac{\gamma}{2}$는?
  - id: S1-B
    audience: B
    source_flow: rep2025.pdf p.87
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        선분 $\mathrm{AB}$를 밑변으로 가지고 높이가 $q$인 삼각형 $\mathrm{ABC}$에 내접하는 원의 중심을 $\mathrm{D}$라 하고 $\mathrm{D}$에서 $\mathrm{AB}$, $\mathrm{BC}$, $\mathrm{CA}$에 내린 수선의 발을 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$이라 하자. $\angle\mathrm{A}=\alpha$, $\angle\mathrm{B}=\beta$, $\angle\mathrm{C}=\gamma$라 하면 $\tan\dfrac{\alpha}{2}=\dfrac{\overline{\mathrm{DP}}}{\overline{\mathrm{AP}}}$, $\tan\dfrac{\beta}{2}=\dfrac{\overline{\mathrm{DP}}}{\overline{\mathrm{BP}}}$이므로 $\overline{\mathrm{AP}}=r\cot\dfrac{\alpha}{2}$, $\overline{\mathrm{BP}}=r\cot\dfrac{\beta}{2}$이고 $\overline{\mathrm{AB}}=r\left\{\cot\dfrac{\alpha}{2}+\cot\dfrac{\beta}{2}\right\}$ ⋯ (*). 따라서 $S=\dfrac12\times\overline{\mathrm{AB}}\times q=\dfrac{rq}{2}\left\{\cot\dfrac{\alpha}{2}+\cot\dfrac{\beta}{2}\right\}$이다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        (*)에 의해 $\overline{\mathrm{AB}}+\overline{\mathrm{BC}}+\overline{\mathrm{CA}}=2r\left\{\cot\dfrac{\alpha}{2}+\cot\dfrac{\beta}{2}+\cot\dfrac{\gamma}{2}\right\}$이므로 $S=\dfrac12(\overline{\mathrm{AB}}+\overline{\mathrm{BC}}+\overline{\mathrm{CA}})r=r^2\left\{\cot\dfrac{\alpha}{2}+\cot\dfrac{\beta}{2}+\cot\dfrac{\gamma}{2}\right\}$ ⋯ (**). $\gamma=\pi-(\alpha+\beta)$이므로 제시문 (가)에 의해 $\cot\dfrac{\gamma}{2}=\tan\dfrac{\alpha+\beta}{2}=\dfrac{\tan\frac\alpha2+\tan\frac\beta2}{1-\tan\frac\alpha2\tan\frac\beta2}$이고, 분모·분자를 $\tan\frac\alpha2\tan\frac\beta2$로 나누면 $\cot\dfrac{\gamma}{2}=\dfrac{\cot\frac\alpha2+\cot\frac\beta2}{\cot\frac\alpha2\cot\frac\beta2-1}$이므로 (**)에 대입하면 (2)가 성립한다.
      criteria: [1.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 20
      evidence: |
        탄젠트 정의로 접선의 길이 $r\cot\frac{\alpha}{2}$, $r\cot\frac\beta2$를 얻어 (1)의 넓이를 올바르게 유도했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.R2
      mark_type: R
      points: 20
      evidence: |
        세 변의 합과 내접원의 반지름으로 $S=r^2\sum\cot$을 쓰고 $\cot\frac\gamma2$를 덧셈정리로 바꾸어 (2)를 올바르게 유도했다.
      depends_on: []
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42501}
  misconceptions:
  - id: MC-GEO-42501
    outcome_code: '71'
    wrong_work: '$\overline{\mathrm{AP}}=r\tan\frac{\alpha}{2}$'
    detect_cue: 밑변 길이가 $\tan$의 합으로 적혀 있다
    feedback: 직각삼각형 $\mathrm{ADP}$에서 $\tan\frac\alpha2=\frac{r}{\overline{\mathrm{AP}}}$이므로 $\overline{\mathrm{AP}}=r\cot\frac\alpha2$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    【2-2】 $-1$ 이상인 모든 실수 $t$에 대하여 $\dfrac{g(t)}{f(t)}=\dfrac{h(t)}{g(t)}$임을 보이시오. (40점)
  points: 40
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: ['g/f = h/g = 1 - 2/sqrt(8*t+16)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 2-1의 (1)=(2)에서 $\tan\frac\alpha2\tan\frac\beta2=1-\frac{2r}{q}$; 이웃 삼각형의 왼쪽 밑각은 $\pi-\angle\mathrm{OA}_i\mathrm{B}$.
    steps:
    - {id: 2a, content: '$\cot\frac{\angle\mathrm{OA_1B}}{2}\tan\frac{\angle\mathrm{OA_2B}}{2}=\cot\frac{\angle\mathrm{OA_2B}}{2}\tan\frac{\angle\mathrm{OA_3B}}{2}=1-\frac{2}{\sqrt{8t+16}}$', criteria: [2.R1, 2.R2]}
    hint_ladder:
    - 2-1의 두 넓이 식을 같다고 놓으면 $\tan\frac\alpha2\tan\frac\beta2$에 대해 무엇을 알 수 있는가?
    - 삼각형 $\mathrm{A_1A_2B}$의 꼭짓점 $\mathrm{A_1}$에서의 내각은?
  - id: S2-B
    audience: B
    source_flow: rep2025.pdf p.88
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1)과 (2)에 의해 $\dfrac{rq}{2}\left\{\cot\frac\alpha2+\cot\frac\beta2\right\}=r^2\left\{\cot\frac\alpha2+\cot\frac\beta2+\dfrac{\cot\frac\alpha2+\cot\frac\beta2}{\cot\frac\alpha2\cot\frac\beta2-1}\right\}$이다. $r\left\{\cot\frac\alpha2+\cot\frac\beta2\right\}\ne0$으로 양변을 나누면 $\dfrac q2=r\left\{1+\dfrac{1}{\cot\frac\alpha2\cot\frac\beta2-1}\right\}$이므로 $\tan\dfrac{\alpha}{2}\tan\dfrac{\beta}{2}=1-\dfrac{2r}{q}$ ⋯ (***).
      criteria: [2.R1]
    - id: 2b-2
      content: |
        삼각형 $\mathrm{A_1A_2B}$와 $\mathrm{A_2A_3B}$는 높이가 $\sqrt{8t+16}$, 내접원의 반지름이 $1$이므로 (***)에 의해 $\tan\left(\dfrac{\pi-\angle\mathrm{OA_1B}}{2}\right)\tan\left(\dfrac{\angle\mathrm{OA_2B}}{2}\right)=\tan\left(\dfrac{\pi-\angle\mathrm{OA_2B}}{2}\right)\tan\left(\dfrac{\angle\mathrm{OA_3B}}{2}\right)=1-\dfrac{2}{\sqrt{8t+16}}$. 그러면 $\cot\left(\dfrac{\angle\mathrm{OA_1B}}{2}\right)\tan\left(\dfrac{\angle\mathrm{OA_2B}}{2}\right)=\cot\left(\dfrac{\angle\mathrm{OA_2B}}{2}\right)\tan\left(\dfrac{\angle\mathrm{OA_3B}}{2}\right)$, 즉 $\dfrac{g(t)}{f(t)}=\dfrac{h(t)}{g(t)}=1-\dfrac{2}{\sqrt{8t+16}}$ ⋯ (****).
      criteria: [2.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 20
      evidence: |
        【2-1】 넓이 공식을 이용하여 양 끝각과 내접원의 반지름 및 높이에 관한 등식 $\tan\frac\alpha2\tan\frac\beta2=1-\frac{2r}{q}$(또는 동치)을 올바르게 유도했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.R2
      mark_type: R
      points: 20
      evidence: |
        3개의 내접원에 대하여 등식을 세워 $\dfrac{g(t)}{f(t)}$와 $\dfrac{h(t)}{g(t)}$를 올바르게 유도했다.
      depends_on: [2.R1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42504}
  misconceptions:
  - id: MC-CAL-42504
    outcome_code: '71'
    wrong_work: '삼각형 $\mathrm{A_1A_2B}$의 밑각을 $\angle\mathrm{OA_1B}$로 두어 $f(t)g(t)=1-\frac{2}{q}$'
    detect_cue: $f$와 $g$의 곱으로 관계식을 썼다
    feedback: 꼭짓점 $\mathrm{A_1}$에서 삼각형 $\mathrm{A_1A_2B}$의 내각은 $\pi-\angle\mathrm{OA_1B}$이고, 반각의 탄젠트는 $\cot\frac{\angle\mathrm{OA_1B}}{2}=\frac1{f(t)}$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    【2-3】 $h'(0)$의 값을 구하시오. (50점)
  points: 50
  depends_on: ['2']
  answer: {kind: value, value: '1/8', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 내심 $(m,1)$에서 $\tan\frac{\angle\mathrm{A_1OB}}{2}=\sqrt{\frac{2}{t+2}}$, (***)와 (****)로 $h(t)=\sqrt{\frac{t+2}{2}}\left(1-\frac{2}{\sqrt{8t+16}}\right)^3$.
    steps:
    - {id: 3a, content: '$h(t)=\sqrt{\frac{t+2}{2}}\left(1-\frac{2}{\sqrt{8t+16}}\right)^3$, $h''(0)=\frac1{32}+\frac3{32}=\frac18$', criteria: [3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - 삼각형 $\mathrm{OA_1B}$의 내심의 $y$좌표는?
    - $f(t)$를 $\tan\frac{\angle\mathrm{A_1OB}}{2}$로 나타내면 (***)가 쓰인다.
  - id: S3-B
    audience: B
    source_flow: rep2025.pdf p.88
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        원점 $\mathrm{O}$와 $\mathrm{B}(t,\sqrt{8t+16})$을 지나는 직선의 방정식은 $\sqrt{8t+16}\,x-ty=0$이다. 삼각형 $\mathrm{OA_1B}$에 내접하는 원의 중심을 $(m,1)$이라 하면 제시문 (나)에 의해 $\dfrac{\lvert m\sqrt{8t+16}-t\rvert}{\sqrt{t^2+8t+16}}=1$이고, 내접원의 중심은 1사분면에 있으므로 $m=\dfrac{2t+4}{\sqrt{8t+16}}=\sqrt{\dfrac{t+2}{2}}$이다. 그러면 $\tan\left(\dfrac{\angle\mathrm{A_1OB}}{2}\right)=\dfrac1m=\sqrt{\dfrac{2}{t+2}}$.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        (***)에 의해 $\tan\left(\dfrac{\angle\mathrm{A_1OB}}{2}\right)f(t)=1-\dfrac{2}{\sqrt{8t+16}}$이고 (****)에 의해 $h(t)=\cot\left(\dfrac{\angle\mathrm{A_1OB}}{2}\right)\left(1-\dfrac{2}{\sqrt{8t+16}}\right)^3=\sqrt{\dfrac{t+2}{2}}\left(1-\dfrac{2}{\sqrt{8t+16}}\right)^3$.
      criteria: [3.M2]
    - id: 3b-3
      content: |
