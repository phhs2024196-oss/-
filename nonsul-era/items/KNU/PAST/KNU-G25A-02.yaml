intent: |
  삼각형과 내접원의 관계를 이해하고 삼각형의 넓이를 구할 수 있는지(2-1), 삼각형의 넓이를 이용하여 삼각함수의 관계식을 도출할 수 있는지(2-2), 관계식을 이용하여 삼각함수를 도출하고 미분값을 계산할 수 있는지(2-3) 평가한다.
key_idea: |
  내접원의 접선 길이 $r\cot\frac{\alpha}{2}$로 넓이를 두 가지로 나타내면 $\tan\frac\alpha2\tan\frac\beta2=1-\frac{2r}{q}$가 된다. 세 삼각형의 높이가 모두 $\sqrt{8t+16}$이고 이웃 삼각형의 밑각이 $\pi-\angle\mathrm{OA}_i\mathrm{B}$이므로 $\frac{g}{f}=\frac{h}{g}=1-\frac{2}{\sqrt{8t+16}}$이다.
