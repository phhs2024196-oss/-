- id: '4'
  stem: |
    (2) 함수 $q(x)=10f(f(x))+nx$가 실수 전체의 집합에서 증가하도록 하는 자연수 $n$의 최솟값을 구하시오. (40점)
  points: 40
  depends_on: ['3']
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $\{f(f(x))\}'<0$인 곳은 $f'(x)>0$이면서 $f(x)\ge9a$인 $(a,3a)$와 $f'(x)<0$이면서 $f(x)\in(a,3a)$인 $(11a,15a)$뿐이고, 최솟값은 $-\frac12f'(2a)=-\frac38$.
    steps:
    - {id: 4a, content: '$\min\{f(f(x))\}''=-\frac38$, $q''\ge-\frac{15}{4}+n>0\iff n\ge4$', criteria: [4.M1, 4.M2, 4.A1, 4.A2]}
    hint_ladder:
    - $f'(f(x))$와 $f'(x)$의 부호가 다른 구간은 어디인가?
    - $(a,3a)$에서 $f(x)$의 값은 어느 구간에 있는가?
  - id: S4-B
    audience: B
    source_flow: rep2025.pdf p.104
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        조건 (Ⅵ)으로부터 함수 $q(x)$는 실수 전체의 집합에서 미분가능함을 알 수 있다. 어떤 열린구간에서 $\{f(f(x))\}'\ge0$이면 $q'(x)=10\{f(f(x))\}'+n>0$이므로 $q(x)$는 그 구간에서 증가한다. 따라서 $\{f(f(x))\}'<0$인 구간만 조사하자. $a<x<3a$일 때 $f'(x)>0$이고 $9a=f(a)<f(x)<f(3a)=10a$이므로 $\{f(f(x))\}'=f'(f(x))f'(x)=cf'(x)=-\dfrac12f'(x)$이다.
      criteria: [4.M1]
    - id: 4b-2
      content: |
        $11a<x<15a$일 때 $a=f(15a)<f(x)<f(11a)=3a$이고 $f'(x)=c=-\dfrac12$이므로 $\{f(f(x))\}'=f'(f(x))f'(x)=-\dfrac12f'(f(x))$이다.
      criteria: [4.M2]
    - id: 4b-3
      content: |
        한편 $a<x<3a$일 때 $f'(x)\le f'(2a)=\dfrac34$이므로 $\{f(f(x))\}'$의 최솟값은 $-\dfrac12f'(2a)=-\dfrac38$임을 알 수 있다. 따라서 $q'(x)=10\{f(f(x))\}'+n$의 최솟값은 $-\dfrac{15}{4}+n$이고,
      criteria: [4.A1]
    - id: 4b-4
      content: |
        이로부터 함수 $q(x)$가 실수 전체의 집합에서 증가하도록 하는 자연수 $n$의 최솟값은 $4$임을 알 수 있다.
      criteria: [4.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 10
      evidence: |
        $a<x<3a$일 때 $\{f(f(x))\}'$의 최솟값을 계산했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [3.A1], max_points: 10}
      steps: [4b-1]
    - id: 4.M2
      mark_type: M
      points: 10
      evidence: |
        $11a<x<15a$일 때 $\{f(f(x))\}'$의 최솟값을 계산했다.
      depends_on: []
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 10
      evidence: |
        $q'(x)=10\{f(f(x))\}'+n$의 최솟값이 $-\dfrac{15}{4}+n$임을 구했다(또는 $\{f(f(x))\}'$의 최솟값이 $-\dfrac38$임을 구했다).
      depends_on: [4.M1, 4.M2]
      steps: [4b-3]
    - id: 4.A2
      mark_type: A
      points: 10
      evidence: |
        자연수 $n$의 최솟값 $4$를 구했다.
      depends_on: [4.M1, 4.M2, 4.A1]
      steps: [4b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42511}
  misconceptions:
  - id: MC-CAL-42511
    outcome_code: '71'
    wrong_work: '$\{f(f(x))\}''$ 대신 $f''(x)$의 최솟값 $-6$을 써서 $n\ge60$, $n=61$'
    detect_cue: $f'(f(x))$ 인수 없이 $f'$의 최솟값만 사용했다
    feedback: 합성함수의 도함수는 $f'(f(x))f'(x)$이고, 두 인수의 부호가 서로 다른 구간에서만 음수가 됩니다.
    remedy: [RL-6]

