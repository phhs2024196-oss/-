      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        $f(7a)-f(5a)=-\dfrac{4}{25}a^2$을 구했다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $c=f'(9a)=-\dfrac{4}{25}a$를 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: |
        $\dfrac{f(5a)-f(10a)}{a^2}=\dfrac{12}{25}$를 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-4]
    - id: 1.R1
      mark_type: R
      points: 10
      evidence: |
        $f(5a)=5a$를 구했다.
      depends_on: []
      steps: [1b-5]
    - id: 1.A3
      mark_type: A
      points: 10
      evidence: |
        $ka^2=\dfrac14$을 구했다.
      depends_on: [1.R1]
      steps: [1b-6]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42506}
  - {code: '72', misconception: MC-CAL-42507}
  misconceptions:
  - id: MC-CAL-42506
    outcome_code: '71'
    wrong_work: '$g(x)=\frac{x^2}{81}$을 택해 $f(9a)-f(7a)=-\frac{4}{81}a^2$'
    detect_cue: (Ⅳ)를 확인하지 않았거나 분모 81이 쓰였다
    feedback: $\lvert f(9a)-f(5a)\rvert$는 많아야 $\frac{8}{25}a^2$ 또는 그보다 작으므로 (Ⅳ)의 $\frac{3}{10}a^2$보다 크려면 두 구간 모두 $\frac{1}{25}$이고 같은 방향(감소)이어야 합니다.
    remedy: [RL-1]
  - id: MC-CAL-42507
    outcome_code: '72'
    wrong_work: '(Ⅵ)을 쓰지 않고 $ka^2$를 미정으로 남기거나 $f(5a)=7a$로 둠'
    detect_cue: $f(5a)$의 값을 결정하는 근거로 합성함수의 미분가능성을 쓰지 않았다
    feedback: $f$가 미분불가능한 점은 $5a$뿐이므로 $f(f(x))$가 $x=5a$에서 미분가능하려면 $f(5a)$가 어디로 가야 하는지 생각해 보세요.
    remedy: [RL-2]

- id: '2'
  stem: |
    【1-2】 닫힌구간 $[0,5a]$에서 정의된 함수

    $$p(x)=-\lim_{h\to0}\frac{f(x-\lvert h\rvert)-f(x)}{\lvert h\rvert}$$

    의 최댓값과 최솟값을 각각 구하시오. (20점)
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: '3/4; -6', equivalents: ['최댓값 3/4, 최솟값 -6'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $t=-\lvert h\rvert$로 두면 $p(x)$는 좌미분계수, 즉 $(0,5a]$에서 $-3k(x^2-4ax+3a^2)$.
    steps:
    - {id: 2a, content: '$p(x)=-3k(x^2-4ax+3a^2)$, 최댓값 $p(2a)=3ka^2=\frac34$, 최솟값 $p(5a)=-24ka^2=-6$', criteria: [2.M1, 2.A1, 2.A2]}
    hint_ladder:
    - $-\lvert h\rvert$를 하나의 문자로 두면 어느 쪽 극한인가?
  - id: S2-B
    audience: B
    source_flow: rep2025.pdf p.103
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $p(x)=-\displaystyle\lim_{h\to0}\frac{f(x-\lvert h\rvert)-f(x)}{\lvert h\rvert}=\lim_{t\to0-}\frac{f(x+t)-f(x)}{t}$ ($t=-\lvert h\rvert$)이므로, 조건 (Ⅰ)로부터 $p(x)=-3k(x^2-4ax+3a^2)$임을 알 수 있다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 닫힌구간 $[0,5a]$에서 함수 $p(x)$의 최댓값은 $p(2a)=3ka^2=\dfrac34$이고,
      criteria: [2.A1]
    - id: 2b-3
      content: |
        최솟값은 $p(5a)=-24ka^2=-6$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $p(x)=-3k(x^2-4ax+3a^2)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        함수 $p(x)$의 최댓값 $\dfrac34$을 구했다.
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A3], max_points: 5}
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: |
        함수 $p(x)$의 최솟값 $-6$을 구했다.
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A3], max_points: 5}
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42508}
  - {code: '72', misconception: MC-CAL-42509}
  misconceptions:
  - id: MC-CAL-42508
    outcome_code: '71'
    wrong_work: '$p(x)=-f''(x)=3k(x^2-4ax+3a^2)$로 두어 최댓값 6, 최솟값 $-\frac34$'
