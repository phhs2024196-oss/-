key_idea: |
  (Ⅲ)을 인수분해하면 $g(x)=\frac{x^2}{25}$ 또는 $\frac{x^2}{81}$이고, (Ⅱ)·(Ⅴ)로 $[5a,9a]$에서 $f$가 $7a$를 중심으로 한 반쪽 포물선 두 개로 감소함을, (Ⅳ)로 $\frac{1}{25}$만 가능함을 얻는다. (Ⅵ)에서 $f$가 $x=5a$에서만 미분불가능하므로 $f(5a)=5a$이어야 한다.
stuck: |
  (Ⅵ) 「$f(f(x))$가 미분가능」을 $f(5a)=5a$로 번역하는 단계, 그리고 (Ⅳ)로 $\frac{x^2}{81}$ 경우와 부호 조합을 배제하는 단계
