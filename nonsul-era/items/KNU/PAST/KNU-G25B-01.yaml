stimuli:
- label: (가)
  body: |
    함수 $f(x)$가 실수 $a$에 대하여 다음 세 조건을 만족시킬 때, $f(x)$는 $x=a$에서 연속이라고 한다.

    (ⅰ) $f(x)$가 $x=a$에서 정의되어 있다.

    (ⅱ) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재한다.

    (ⅲ) $\displaystyle\lim_{x\to a}f(x)=f(a)$
- label: (나)
  body: |
    함수 $f(x)$에 대하여 극한값

    $$\lim_{x\to a}\frac{f(x)-f(a)}{x-a}$$

    가 존재하면 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다.
- label: (다)
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는

    $\{f(g(x))\}'=f'(g(x))g'(x)$
- label: (라)
  body: |
    두 함수 $f(x)$, $g(x)$에 대하여 $\displaystyle\lim_{x\to a}f(x)=\alpha$, $\displaystyle\lim_{x\to a}g(x)=\beta$ ($\alpha$, $\beta$는 실수)일 때,

    (ⅰ) $\displaystyle\lim_{x\to a}cf(x)=c\alpha$ (단, $c$는 상수)

    (ⅱ) $\displaystyle\lim_{x\to a}\{f(x)+g(x)\}=\alpha+\beta$

    (ⅲ) $\displaystyle\lim_{x\to a}\{f(x)g(x)\}=\alpha\beta$

    (ⅳ) $\displaystyle\lim_{x\to a}\frac{f(x)}{g(x)}=\frac{\alpha}{\beta}$ (단, $\beta\ne0$)
- label: (마)
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 그 구간의 모든 $x$에 대하여

    (ⅰ) $f'(x)>0$이면 $f(x)$는 그 구간에서 증가한다.

    (ⅱ) $f'(x)<0$이면 $f(x)$는 그 구간에서 감소한다.

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  실수 전체의 집합에서 연속인 함수 $f(x)$가 다음 조건을 만족시킨다. (단, $a>0$, $k>0$)

  (Ⅰ) $x\le5a$일 때, $f(x)=-kx(x-3a)^2+10a$이다.

  (Ⅱ) 함수 $f(x)$는 $x=5a$에서만 미분가능하지 않고, $3a<f(5a)<7a$이다.

  (Ⅲ) $-2a\le x\le2a$인 실수 $x$에 대하여 함수 $g(x)$를 $g(x)=\lvert f(x+7a)-f(7a)\rvert$라 하면, $2025\{g(x)\}^2-106x^2g(x)+x^4=0$이다.

  (Ⅳ) $\lvert f(9a)-f(5a)\rvert>\dfrac{3}{10}a^2$

  (Ⅴ) $x\ge9a$인 모든 실수 $x$에 대하여 $f'(x)=c$이다. (단, $c$는 $c<0$인 상수)

  (Ⅵ) 함수 $y=f(f(x))$는 실수 전체의 집합에서 미분가능하다.

  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【1-1】 $\dfrac{f(5a)-f(10a)}{a^2}$와 $ka^2$의 값을 각각 구하시오. (40점)
  points: 40
  depends_on: []
  answer: {kind: value, value: '12/25; 1/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (Ⅲ) 인수분해 → $g=\frac{x^2}{25}$ 또는 $\frac{x^2}{81}$, (Ⅴ)·(Ⅳ)로 $f(x)=f(7a)\mp\frac{(x-7a)^2}{25}$ 결정, (Ⅵ)로 $f(5a)=5a$.
    steps:
    - {id: 1a, content: '$f(9a)-f(7a)=f(7a)-f(5a)=-\frac{4}{25}a^2$, $c=-\frac{4}{25}a$, $\frac{f(5a)-f(10a)}{a^2}=\frac{12}{25}$, $f(5a)=5a\Rightarrow ka^2=\frac14$', criteria: [1.M1, 1.M2, 1.A1, 1.A2, 1.R1, 1.A3]}
    hint_ladder:
    - (Ⅲ)의 좌변을 $g(x)$에 대한 이차식으로 보고 인수분해해 보자.
    - $f$가 $x=5a$에서 미분불가능할 때 $f(f(x))$가 $f(x)=5a$인 점에서 미분가능하려면?
  - id: S1-B
    audience: B
    source_flow: rep2025.pdf p.103
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (Ⅲ)에서 $2025\{g(x)\}^2-106x^2g(x)+x^4=\{25g(x)-x^2\}\{81g(x)-x^2\}=0$이므로 $-2a\le x\le2a$인 실수 $x$에 대하여 $g(x)=\dfrac{x^2}{25}$ 또는 $g(x)=\dfrac{x^2}{81}$이다. 조건 (Ⅴ)에서 $f'(9a)=c<0$이고 $g(x)=\lvert f(x+7a)-f(7a)\rvert$이므로, 조건 (Ⅱ)에 의하여 $7a\le x\le9a$인 실수 $x$에 대하여 $f(x)=f(7a)-\dfrac{(x-7a)^2}{25}$ 또는 $f(x)=f(7a)-\dfrac{(x-7a)^2}{81}$임을 알 수 있다. 따라서 $f(9a)-f(7a)=-\dfrac{4}{25}a^2$ 또는 $-\dfrac{4}{81}a^2$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        또한 $f(7a)-f(5a)=\pm\dfrac{4}{25}a^2$ 또는 $\pm\dfrac{4}{81}a^2$이므로 조건 (Ⅳ)를 만족하기 위해서는 $f(9a)-f(7a)=-\dfrac{4}{25}a^2$, $f(7a)-f(5a)=-\dfrac{4}{25}a^2$이어야 한다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        이 경우 $c=f'(9a)=-\dfrac{4}{25}a$임을 알 수 있다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        조건 (Ⅴ)로부터 $f(10a)=ca+f(9a)=-\dfrac{4}{25}a^2+f(9a)$이므로 $f(5a)-f(10a)=\{f(5a)-f(7a)\}+\{f(7a)-f(9a)\}+\{f(9a)-f(10a)\}=\dfrac{4}{25}a^2+\dfrac{4}{25}a^2+\dfrac{4}{25}a^2=\dfrac{12}{25}a^2$. 따라서 $\dfrac{f(5a)-f(10a)}{a^2}=\dfrac{12}{25}$이다.
      criteria: [1.A2]
    - id: 1b-5
      content: |
        또한 조건 (Ⅱ), (Ⅵ)에 의하여 $f(5a)=5a$임을 알 수 있다. (보충: $f$는 $x=5a$에서만 미분불가능하므로 $f(f(x))$가 $x=5a$에서 미분가능하려면 $f'(f(5a))=0$이거나 $f(5a)=5a$이어야 하는데, $f'$이 0인 점 $a$, $3a$, $7a$는 $3a<f(5a)<7a$에 들지 않는다.)
      criteria: [1.R1]
    - id: 1b-6
      content: |
        따라서 조건 (Ⅰ)에 의하여 $f(5a)=-20ka^3+10a=5a$이므로 $ka^2=\dfrac14$이다.
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
