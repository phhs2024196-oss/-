intent: |
  정적분을 활용하여 입체도형의 부피를 구할 수 있는지(2-1), 정적분으로 정의된 함수의 극한을 구할 수 있는지(2-2) 평가한다.
key_idea: |
  (Ⅲ)의 단면에서 높이 $y$인 점은 $\mathrm{R}$로부터 $a\sqrt{2y}$ 이상 떨어져 있으므로 높이 $y$의 단면은 밑면을 $\mathrm{P}$ 중심으로 $1-\sqrt{2y}$배 축소한 것이다. 2-2는 $s=f(t)$로 치환해 곡선의 길이 피적분함수로 바꾸고, 삼각치환으로 적분한다.
stuck: |
  입체 $D$의 수평 단면이 밑면과 닮음(닮음비 $1-\sqrt{2y}$)임을 (Ⅲ)의 곡선에서 읽어 내는 단계, 2-2에서 $s=f(t)$ 치환으로 역함수를 없애는 단계
