- id: '5'
  stem: |
    (3) $1\le i\le n$인 자연수 $i$에 대하여 점 $\mathrm{P}$와 직선 $\mathrm{A}_i\mathrm{A}_{i+1}$ 사이의 거리를 $a_i$라 하고, $T_n=\displaystyle\sum_{i=1}^nS(a_i)$라 하자. $\mathrm{P}$가 원 $C$의 중심일 때, $\displaystyle\lim_{n\to\infty}T_n$의 값을 구하시오. (단, $\mathrm{A}_{n+1}$은 $\mathrm{A}_1$) (20점)
  points: 20
  depends_on: ['3']
  answer: {kind: value, value: 'pi*(log(1+sqrt(2)) - sqrt(2)/3 + 2/3)', equivalents: [], tolerance: null}
  solutions:
  - id: S5-A
    audience: A
    method_no: 1
    key_idea: $a_i=\cos\frac\pi n\to1$이고 $n\sin\frac\pi n\to\pi$.
    steps:
    - {id: 5a, content: '$T_n=n\sin\frac\pi n\cdot G(\cos\frac\pi n)\to\pi G(1)=\pi\left(\ln(1+\sqrt2)-\frac{\sqrt2}3+\frac23\right)$', criteria: [5.M1, 5.M2, 5.A1]}
    hint_ladder:
    - 원의 중심에서 정$n$각형의 변까지의 거리는?
  - id: S5-B
    audience: B
    source_flow: rep2025.pdf p.109
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        $r=0$이므로 $a_1=\cdots=a_n=\cos\dfrac\pi n$이므로 $a=\cos\dfrac\pi n$이라 하면 $T_n=nS(a)=n\sin\dfrac\pi n\left(a^2\ln\left(\dfrac{1+\sqrt{1+a^2}}{a}\right)+\sqrt{1+a^2}-\dfrac{2(1+a^2)^{\frac32}}{3}+\dfrac{2a^3}{3}\right)$.
      criteria: [5.M1]
    - id: 5b-2
      content: |
        또한 $n\to\infty$일 때 $a\to1$이므로
      criteria: [5.M2]
    - id: 5b-3
      content: |
        $\displaystyle\lim_{n\to\infty}T_n=\left(\lim_{n\to\infty}n\sin\frac\pi n\right)\times\left(\ln(1+\sqrt2)-\frac{\sqrt2}{3}+\frac23\right)=\pi\left(\ln(1+\sqrt2)-\frac{\sqrt2}{3}+\frac23\right)$.
      criteria: [5.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 5.M1
      mark_type: M
      points: 5
      evidence: |
        $a_1=a_2=\cdots=a_n=\cos\dfrac\pi n$임을 관찰했다.
      depends_on: []
      implied_ok: false
      steps: [5b-1]
    - id: 5.M2
      mark_type: M
      points: 5
      evidence: |
