stimuli:
- label: (가)
  body: |
    닫힌구간 $[a,b]$에서 $x$좌표가 $x$인 점을 지나고 $x$축에 수직인 평면으로 잘랐을 때의 단면의 넓이가 $S(x)$인 입체도형의 부피 $V$는

    $$V=\int_a^bS(x)\,dx$$
- label: (나)
  body: |
    두 함수 $f(x)$와 $g(x)$가 미분가능하고, $f'(x)$와 $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,

    $$\int_a^bf(x)g'(x)dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf'(x)g(x)dx$$
- label: (다)
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때, $\alpha$, $\beta$를 포함하는 구간에서 연속이면

    $$\int_a^bf(x)dx=\int_\alpha^\beta f(g(t))g'(t)dt$$
- label: (라)
  body: |
    함수 $f(x)$의 도함수 $f'(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 곡선 $y=f(x)$의 길이 $l$은

    $$l=\int_a^b\sqrt{1+\{f'(x)\}^2}dx$$

# [그림: (Ⅲ)의 좌표평면 — R 원점, P(a,0), Q(a,1/2). 곡선 y=x²/(2a²)가 R에서 Q까지 올라가고, 곡선·x축·직선 x=a 로 둘러싸인 부분이 회색으로 칠해짐]
stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  $3$ 이상인 자연수 $n$에 대하여 밑면은 꼭짓점이 $\mathrm{A}_1$, $\mathrm{A}_2$, $\cdots$, $\mathrm{A}_n$인 정$n$각형이고 밑면에 놓여 있지 않은 점 $\mathrm{Q}$를 꼭짓점으로 가지는 입체도형 $D$가 아래 조건을 만족시킨다.

  (Ⅰ) 밑면은 반지름의 길이가 $1$인 원 $C$에 내접하고, 밑면에 놓여 있지 않은 입체도형 $D$의 꼭짓점은 점 $\mathrm{Q}$가 유일하다.

  (Ⅱ) 밑면 내부에 고정된 한 점 $\mathrm{P}$에 대해, 선분 $\mathrm{PQ}$는 밑면에 수직이고, 그 길이는 $\dfrac12$이다.

  (Ⅲ) 밑면의 변 위의 임의의 점 $\mathrm{R}$에 대해 선분 $\mathrm{RP}$의 길이를 $a$라 하면, 삼각형 $\mathrm{PQR}$과 입체도형 $D$가 만나는 도형은 직선 $\mathrm{RP}$를 $x$축으로 하고, $\mathrm{R}$을 지나고 직선 $\mathrm{PQ}$와 평행한 직선을 $y$축으로 할 때, $x$축, 직선 $x=a$, 곡선 $y=\dfrac{x^2}{2a^2}$에 둘러싸인 도형과 같다.

  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【2-1】 선분 $\mathrm{PQ}$ 위의 점 $\mathrm{H}$를 지나고 선분 $\mathrm{PQ}$에 수직인 평면으로 입체도형 $D$를 잘라내어 얻은 두 개의 입체도형 중, 점 $\mathrm{P}$를 포함하는 입체도형의 부피를 $V$라 하자. (단, 선분 $\mathrm{PH}$의 길이는 $h$이고 $0<h<\dfrac12$)

    (1) $V$를 $n$과 $h$에 관한 식으로 나타내시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: expression, value: 'n/2*sin(2*pi/n)*(h + h**2 - 4*sqrt(2)*h**(3/2)/3)', equivalents: ['n*sin(2*pi/n)*(h/2 + h**2/2 - 2*sqrt(2)*h**(3/2)/3)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 높이 $y$의 단면은 밑면의 $1-\sqrt{2y}$배 닮은꼴이므로 $V=\int_0^h(1-\sqrt{2y})^2\frac n2\sin\frac{2\pi}{n}dy$.
    steps:
    - {id: 1a, content: '$V=\frac n2\sin\frac{2\pi}{n}\left(h+h^2-\frac{4\sqrt2}{3}h^{\frac32}\right)$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - (Ⅲ)의 곡선에서 높이 $y$인 점의 $x$좌표는? $\mathrm{P}$로부터의 거리는 $a$의 몇 배인가?
  - id: S1-B
    audience: B
    source_flow: rep2025.pdf p.108
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        선분 $\mathrm{PQ}$ 위에 있고 점 $\mathrm{P}$에서의 거리가 $y$인 점을 $\mathrm{H}$라 하자. $\mathrm{H}$를 지나고 선분 $\mathrm{PQ}$에 수직인 평면과 곡선 $\mathrm{QA}_i$와의 교점을 $\mathrm{B}_i$라 하면, 삼각형 $\mathrm{PA}_i\mathrm{A}_{i+1}$과 삼각형 $\mathrm{HB}_i\mathrm{B}_{i+1}$은 닮음비 $1:(1-\sqrt{2y})$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        ($\mathrm{HB}_i\mathrm{B}_{i+1}$의 넓이)$=(1-\sqrt{2y})^2\times$($\mathrm{PA}_i\mathrm{A}_{i+1}$의 넓이)이므로 (단면의 넓이)$=(1-\sqrt{2y})^2\times$(밑면의 넓이)$=(1-\sqrt{2y})^2\dfrac n2\sin\dfrac{2\pi}{n}$이고, 제시문 (가)에 의해 $V=\displaystyle\int_0^h\left\{(1-\sqrt{2y})^2\frac n2\sin\frac{2\pi}{n}\right\}dy$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $V=\dfrac n2\sin\dfrac{2\pi}{n}\left(h+h^2-\dfrac{4\sqrt2h^{\frac32}}{3}\right)=n\sin\dfrac{2\pi}{n}\left(\dfrac h2+\dfrac{h^2}{2}-\dfrac{2\sqrt2h^{\frac32}}{3}\right)$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        높이가 $t$인 단면과 밑면의 닮음비가 $1:1-\sqrt{2t}$임을 관찰했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 10
      evidence: |
        닮음비를 이용하여 부피의 적분식을 올바르게 표현했다(피적분함수만 올바르게 표현한 경우 부분점수 5점).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        부피를 올바르게 계산했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42512}
  - {code: '72', misconception: MC-CAL-42513}
  misconceptions:
  - id: MC-CAL-42512
    outcome_code: '71'
    wrong_work: '닮음비를 $1-2y$로 두어 $V=\frac n2\sin\frac{2\pi}n\left(h-2h^2+\frac43h^3\right)$'
    detect_cue: 결과에 $h^{\frac32}$ 항이 없다
    feedback: 높이 $y$에서 곡선 $y=\frac{x^2}{2a^2}$ 위의 점은 $x=a\sqrt{2y}$이므로 $\mathrm{P}$로부터의 거리는 $a(1-\sqrt{2y})$입니다.
    remedy: [RL-1]
  - id: MC-CAL-42513
    outcome_code: '72'
    wrong_work: '단면 넓이를 $(1-\sqrt{2y})\times$(밑면의 넓이)로 둠'
    detect_cue: 피적분함수에 닮음비가 제곱되지 않았다
    feedback: 닮음비가 $m$이면 넓이의 비는 $m^2$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    (2) $h=\dfrac14$일 때, $\displaystyle\lim_{n\to\infty}V$의 값을 구하시오. (20점)
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: 'pi*(5/16 - sqrt(2)/6)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\lim n\sin\frac{2\pi}{n}=2\pi$.
    steps:
    - {id: 2a, content: '$V=n\sin\frac{2\pi}n\left(\frac5{32}-\frac{\sqrt2}{12}\right)\to\pi\left(\frac5{16}-\frac{\sqrt2}6\right)$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - $n\sin\frac{2\pi}{n}=2\pi\cdot\frac{\sin(2\pi/n)}{2\pi/n}$
  - id: S2-B
    audience: B
    source_flow: rep2025.pdf p.109
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $h=\dfrac14$이면 $V=n\sin\dfrac{2\pi}{n}\left(\dfrac{5}{32}-\dfrac{\sqrt2}{12}\right)$이고, $\displaystyle\lim_{n\to\infty}n\sin\frac{\pi}{n}=\pi$이므로
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $\displaystyle\lim_{n\to\infty}V=\pi\left(\frac{5}{16}-\frac{\sqrt2}{6}\right)$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $\displaystyle\lim_{n\to\infty}n\sin\frac{\pi}{n}=\pi$임을 사용했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        극한값을 올바르게 계산했다(단순 계산 실수의 경우 부분점수 5~10점).
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A1], max_points: 15}
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42514}
  misconceptions:
  - id: MC-CAL-42514
    outcome_code: '71'
    wrong_work: '$\lim n\sin\frac{2\pi}{n}=\pi$로 두어 극한을 $\frac\pi2\left(\frac5{16}-\frac{\sqrt2}6\right)$로 계산'
    detect_cue: 극한값이 정답의 절반 또는 $\frac{1}{\pi}$배이다
    feedback: $n\sin\frac{2\pi}{n}=2\pi\cdot\frac{\sin(2\pi/n)}{2\pi/n}\to2\pi$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    【2-2】 $0\le x\le t$에서 곡선 $y=\dfrac{x^2}{2k^2}$의 길이를 $f(t)$라 할 때,

    $$S(k)=\frac2k\left(\sin\frac\pi n\right)\int_0^{f(k)}\{k-f^{-1}(s)\}ds$$

    라 하자. (단, $k$는 양수)

    (1) $n=6$일 때, $S(\sqrt3)$의 값을 구하시오. (40점)
  points: 40
  depends_on: []
  answer: {kind: value, value: '3*log(3)/4 + sqrt(3) - 5/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $s=f(t)$로 치환하면 $\int_0^{f(k)}\{k-f^{-1}(s)\}ds=\int_0^k(k-t)\sqrt{1+\frac{t^2}{k^4}}dt$, $t=k^2\tan\theta$로 적분.
    steps:
    - {id: 3a, content: '$S(k)=\sin\frac\pi n\left(k^2\ln\frac{1+\sqrt{1+k^2}}{k}+\sqrt{1+k^2}-\frac{2(1+k^2)^{\frac32}}{3}+\frac{2k^3}{3}\right)$, $S(\sqrt3)=\frac{3\ln3}{4}+\sqrt3-\frac53$', criteria: [3.M1, 3.M2, 3.A1, 3.A2]}
    hint_ladder:
    - $f^{-1}(s)$를 직접 구하지 말고 $s=f(t)$로 치환해 보자.
    - $\sqrt{1+\frac{t^2}{k^4}}$에는 어떤 삼각치환이 어울리는가?
  - id: S3-B
    audience: B
    source_flow: rep2025.pdf p.109
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        제시문 (라)에 의해 $f(t)=\displaystyle\int_0^t\sqrt{1+\frac{x^2}{k^4}}dx$이고, 주어진 적분에서 $s=f(t)$로 치환하면 제시문 (다)에 의해 $S(k)=\dfrac2k\sin\dfrac\pi n\displaystyle\int_0^{f(k)}\{k-f^{-1}(s)\}ds=2\sin\frac\pi n\int_0^k\left(1-\frac tk\right)\sqrt{1+\frac{t^2}{k^4}}dt$.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        제시문 (나)와 (다)에 의해 $t$를 $k^2\tan\theta$로 치환하면 $\tan\alpha=\dfrac1k$를 만족시키는 $0<\alpha<\dfrac\pi2$에 대해 $\displaystyle\int_0^k\sqrt{1+\frac{t^2}{k^4}}dt=\int_0^\alpha k^2\sec^3\theta\,d\theta=k^2\left[\frac{\ln\lvert\sec\theta+\tan\theta\rvert+\sec\theta\tan\theta}{2}\right]_0^\alpha=\frac{k^2}{2}\ln\left(\frac{1+\sqrt{1+k^2}}{k}\right)+\frac{\sqrt{1+k^2}}{2}$.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        $\displaystyle\int_0^k\frac tk\sqrt{1+\frac{t^2}{k^4}}dt=\left[\frac{k^3}{3}\left(1+\frac{x^2}{k^4}\right)^{\frac32}\right]_0^k=\frac{(1+k^2)^{\frac32}-k^3}{3}$. 따라서 $S(k)=\sin\dfrac\pi n\left(k^2\ln\left(\dfrac{1+\sqrt{1+k^2}}{k}\right)+\sqrt{1+k^2}-\dfrac{2(1+k^2)^{\frac32}}{3}+\dfrac{2k^3}{3}\right)$.
      criteria: [3.A1]
    - id: 3b-4
      content: |
        $n=6$, $k=\sqrt3$이면 $S(\sqrt3)=\dfrac{3\ln3}{4}+\sqrt3-\dfrac53$.
      criteria: [3.A2]
  rubric:
