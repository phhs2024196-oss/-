      depends_on: []
      steps: [5b-2]
    - id: 5.A1
      mark_type: A
      points: 10
      evidence: |
        답 $\pi\left(\ln(1+\sqrt2)-\dfrac{\sqrt2}{3}+\dfrac23\right)$을 올바르게 계산했다.
      depends_on: [5.M1, 5.M2]
      ft: {allowed: true, from: [3.A1], max_points: 10}
      steps: [5b-3]
    deductions: []
