      evidence: |
        넓이가 최대인 경우의 사각형($\mathrm{AQVR}$: $\mathrm{Q}$, $\mathrm{R}$은 $\mathrm{AB}$, $\mathrm{AC}$의 $2:1$ 내분점, $\mathrm{V}$는 $\mathrm{CQ}$와 $\mathrm{BR}$의 교점)을 구했다. (원문: 「넓이가 최대인 경우의 사각형을 구했으면, 또는 D가」)
      # [판독확인] 채점기준 원문 「또는 D가」 뒤가 잘려 있음(원본 그대로 옮김)
      depends_on: []
