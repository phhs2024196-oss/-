      steps: [1-2b-3]
    - id: 1-2.B3
      mark_type: B
      points: 5
      evidence: (ㄷ)$=7$
      steps: [1-2b-3]
    - id: 1-2.B4
      mark_type: B
      points: 5
      evidence: (ㄹ)$=4$
      steps: [1-2b-3]
    - id: 1-2.B5
      mark_type: B
