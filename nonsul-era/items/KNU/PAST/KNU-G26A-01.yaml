  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42602}
  misconceptions:
  - id: MC-GEO-42602
    outcome_code: '71'
    wrong_work: '$x=a\cdot(-2)+b\cdot7+c\cdot1$처럼 넓이비를 마주 보는 꼭짓점이 아닌 다른 꼭짓점 좌표에 곱함'
    detect_cue: (ㄱ)(ㄴ)(ㄷ)가 $1,-2,7$의 순환 배열
    feedback: $a=S_{\mathrm{BCF}}/S_{\mathrm{ABC}}$는 $\mathrm{F}$가 $\mathrm{A}$에 가까울수록 커집니다. $a$는 꼭짓점 $\mathrm{A}$의 가중치입니다.
    remedy: [RL-2]

- id: '1-3'
  stem: |
    삼각형 $\mathrm{ABC}$의 내부 또는 그 세 변 위의 점 $\mathrm{J},\mathrm{K},\mathrm{L}$에 대하여 점 $\mathrm{A},\mathrm{J},\mathrm{K},\mathrm{L}$이 사각형 $\mathrm{AJKL}$을 이룬다. 점 $\mathrm{F}$가 사각형 $\mathrm{AJKL}$의 내부에 있을 때, 항상 $2a\ge b$, $2a\ge c$를 만족시킨다. 가능한 사각형 $\mathrm{AJKL}$의 넓이의 최댓값이 $rS_{\mathrm{ABC}}$일 때, 실수 $r$의 값을 구하시오. (50점)
  points: 50
  depends_on: ['1-1']
  answer: {kind: value, value: '8/15', equivalents: [], tolerance: null}
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: $2a\ge b$의 경계는 $\mathrm{C}$와 $\mathrm{AB}$의 $2:1$ 내분점 $\mathrm{Q}$를 잇는 선분, $2a\ge c$의 경계는 $\mathrm{B}$와 $\mathrm{AC}$의 $2:1$ 내분점 $\mathrm{R}$을 잇는 선분이고, 두 선분의 교점 $\mathrm{V}$에서 $a=\tfrac15$. 최대 사각형은 $\mathrm{AQVR}$.
    steps:
    - {id: 1-3a, content: '$r=\left(1-\tfrac15\right)\times\tfrac23=\tfrac{8}{15}$', criteria: [1-3.M1, 1-3.A1]}
    hint_ladder:
    - 점 $\mathrm{F}$가 꼭짓점 $\mathrm{C}$를 지나는 한 선분 위를 움직이면 $b:a$는 어떻게 되는가?
    - $b=2a$가 되는 점들은 어떤 선분을 이루는가?
  - id: S1-3-B
    audience: B
    source_flow: rep2026.pdf p.86(인쇄 82)
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        실수 $m,n,k,\ell$이 $m>0$, $n>0$, $k>0$, $\ell>0$을 만족한다. 선분 $\mathrm{AB}$를 $m:n$으로 내분하는 점을 $\mathrm{Q}$라 하면 제시문 (나)에 의해 $\triangle\mathrm{CAQ}$와 $\triangle\mathrm{BCQ}$의 넓이의 비는 $m:n$이고, 1-1의 풀이와 같이 선분 $\mathrm{CQ}$ 위의 임의의 점 $\mathrm{X}$($\mathrm{X}\ne\mathrm{C}$)에 대하여 $\triangle\mathrm{CAX}$와 $\triangle\mathrm{BCX}$의 넓이의 비도 $m:n$이다. 따라서 점 $\mathrm{F}$가 선분 $\mathrm{CQ}$ 위에 있으면($\mathrm{F}\ne\mathrm{C}$) $b:a=m:n$. 마찬가지로 선분 $\mathrm{AC}$를 $k:\ell$로 내분하는 점을 $\mathrm{R}$이라 할 때 점 $\mathrm{F}$가 선분 $\mathrm{BR}$ 위에 있으면($\mathrm{F}\ne\mathrm{B}$) $c:a=k:\ell$.
      criteria: [1-3.M1]
    - id: 1-3b-2
      content: |
        따라서 $\dfrac mn\le2$일 때 점 $\mathrm{F}$가 선분 $\mathrm{CQ}$ 위에 있으면($\mathrm{F}\ne\mathrm{C}$) $b\le2a$이고, $\dfrac mn>2$이면 $b>2a$이다. 마찬가지로 $\dfrac k\ell\le2$일 때 선분 $\mathrm{BR}$ 위에서 $c\le2a$, $\dfrac k\ell>2$이면 $c>2a$.
      criteria: [1-3.M1]
    - id: 1-3b-3
      content: |
        $m:n=2:1$일 때의 점 $\mathrm{Q}$와 $k:\ell=2:1$일 때의 점 $\mathrm{R}$에 대하여 선분 $\mathrm{CQ}$와 선분 $\mathrm{BR}$의 교점을 $\mathrm{V}$라 하자. 점 $\mathrm{F}$가 $\mathrm{V}$일 때 $2a=b=c$이고 $a+b+c=1$이므로 $a=\dfrac15$이다.
      criteria: [1-3.M1]
    - id: 1-3b-4
      content: |
        점 $\mathrm{F}$가 사각형 $\mathrm{AQVR}$ 내부에 있으면 $b\le2a$, $c\le2a$이다. 점 $\mathrm{F}$가 사각형 $\mathrm{AQVR}$ 외부에 있으면 $a=0$일 때 $b>2a$ 또는 $c>2a$임이 자명하고, $a>0$이면 $b>2a$ 또는 $c>2a$이다. 따라서 사각형 $\mathrm{AQVR}$이 사각형 $\mathrm{AJKL}$일 때의 넓이가 최대 넓이이다. 이때 $\mathrm{Q}=\mathrm{J}$, $\mathrm{R}=\mathrm{L}$, $\mathrm{V}=\mathrm{K}$.
      criteria: [1-3.M1]
    - id: 1-3b-5
      content: |
        $\dfrac{\triangle\mathrm{BCK}\text{의 넓이}}{\triangle\mathrm{ABC}\text{의 넓이}}=\dfrac15$, $\dfrac{\triangle\mathrm{AJK}\text{의 넓이}}{\triangle\mathrm{ABK}\text{의 넓이}}=\dfrac23$, $\dfrac{\triangle\mathrm{ALK}\text{의 넓이}}{\triangle\mathrm{ACK}\text{의 넓이}}=\dfrac23$이므로
        $$\dfrac{\text{사각형 AJKL의 넓이}}{\triangle\mathrm{ABC}\text{의 넓이}}=\dfrac{\triangle\mathrm{AJK}+\triangle\mathrm{ALK}}{\triangle\mathrm{ABC}}=\left(1-\dfrac15\right)\times\dfrac23=\dfrac{8}{15}$$
        이다. 따라서 $r=\dfrac{8}{15}$.
      criteria: [1-3.A1]
