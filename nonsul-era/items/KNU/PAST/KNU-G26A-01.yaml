intent: |
  선분의 내분점을 활용하여 간단한 도형에서 선분의 길이비를 구할 수 있는지(1-1), 선분의 길이비와 삼각형의 넓이비 사이의 관계를 활용한 문제를 해결할 수 있는지(1-2, 1-3) 평가한다.
key_idea: |
  $\mathrm{AF}$의 연장선이 $\mathrm{BC}$와 만나는 점 $\mathrm{P}$를 잡으면 $\overline{\mathrm{DF}}:\overline{\mathrm{EF}}=\overline{\mathrm{BP}}:\overline{\mathrm{CP}}=c:b$이고, $\overline{\mathrm{AF}}:\overline{\mathrm{FP}}=(b+c):a$이므로 $\mathrm{F}=a\mathrm{A}+b\mathrm{B}+c\mathrm{C}$(넓이비가 곧 가중치)이다.
stuck: |
  넓이비 $c:b$를 공통변 $\mathrm{AF}$에 대한 높이비 → $\overline{\mathrm{BP}}:\overline{\mathrm{CP}}$로 옮기는 단계, 그리고 1-3에서 조건 $2a\ge b$, $2a\ge c$가 나타내는 영역을 선분 $\mathrm{CQ}$, $\mathrm{BR}$로 경계 짓는 단계
idea_tags: [IDEA-AREA-RATIO-TO-SEGMENT-RATIO, IDEA-BARYCENTRIC-WEIGHTS, IDEA-LINEAR-INEQ-REGION-IN-TRIANGLE]
tags: [넓이비 좌표, 내분점, 닮음비, 삼각형 내부 영역]
