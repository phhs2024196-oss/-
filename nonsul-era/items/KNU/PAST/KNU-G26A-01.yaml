stimuli:
- label: (가)
  body: |
    좌표평면 위의 두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$를 이은 선분 $\mathrm{AB}$를 $m:n$ $(m>0,\ n>0)$으로 내분하는 점 $\mathrm{P}$의 좌표는
    $$\mathrm{P}\left(\dfrac{mx_2+nx_1}{m+n},\ \dfrac{my_2+ny_1}{m+n}\right)$$
- label: (나)
  body: |
    삼각형 $\mathrm{ABC}$와 변 $\mathrm{BC}$위의 점 $\mathrm{D}$에 대하여 $\dfrac{\overline{\mathrm{BD}}}{\overline{\mathrm{CD}}}=\dfrac{m}{n}$ $(m>0,\ n>0)$이면 $\dfrac{\text{삼각형 ABD의 넓이}}{\text{삼각형 ACD의 넓이}}=\dfrac{m}{n}$이다.
  # [그림: 삼각형 ABC, 변 BC 위의 점 D, BD 길이 m, DC 길이 n, 선분 AD]

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  좌표평면 위의 세 점 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$에 대하여 세 점 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$을 꼭짓점으로 하는 삼각형의 넓이를 $S_{\mathrm{PQR}}$이라고 하자. (단, 세 점이 한 직선 위에 있는 경우 $S_{\mathrm{PQR}}=0$으로 정의한다.)

  세 점 $\mathrm{A}(1,4)$, $\mathrm{B}(-2,-3)$, $\mathrm{C}(7,2)$를 꼭짓점으로 하는 삼각형 $\mathrm{ABC}$에 대하여, 점 $\mathrm{F}$가 삼각형 $\mathrm{ABC}$의 내부 또는 세 변 위에 있을 때,
  $$\dfrac{S_{\mathrm{BCF}}}{S_{\mathrm{ABC}}}=a,\quad\dfrac{S_{\mathrm{CAF}}}{S_{\mathrm{ABC}}}=b,\quad\dfrac{S_{\mathrm{ABF}}}{S_{\mathrm{ABC}}}=c$$
  라고 하자.

  점 $\mathrm{F}$를 지나고 변 $\mathrm{BC}$에 평행한 직선이 변 $\mathrm{AB}$, 변 $\mathrm{AC}$와 만나는 점을 각각 점 $\mathrm{D}$, 점 $\mathrm{E}$라 하자.

  다음 물음에 답하시오.

subparts:
- id: '1-1'
  stem: |
    $a=\dfrac13$, $b=\dfrac12$, $c=\dfrac16$일 때, $\dfrac{\overline{\mathrm{DF}}}{\overline{\mathrm{EF}}}$의 값을 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: 직선 $\mathrm{AF}$와 $\mathrm{BC}$의 교점 $\mathrm{P}$에 대해 닮음으로 $\overline{\mathrm{DF}}:\overline{\mathrm{EF}}=\overline{\mathrm{BP}}:\overline{\mathrm{CP}}$이고, 공통변 $\mathrm{AF}$에 대한 높이비로 이것이 $c:b$이다.
    steps:
    - {id: 1-1a, content: '$\overline{\mathrm{DF}}:\overline{\mathrm{EF}}=\overline{\mathrm{BP}}:\overline{\mathrm{CP}}=c:b=\tfrac16:\tfrac12$, 답 $\tfrac13$', criteria: [1-1.M1, 1-1.A1]}
    hint_ladder:
    - $\mathrm{AF}$를 연장해 $\mathrm{BC}$와 만나는 점을 잡아 보자.
    - $\triangle\mathrm{ABF}$와 $\triangle\mathrm{CAF}$는 어떤 변을 공유하는가?
  - id: S1-1-B
    audience: B
    source_flow: rep2026.pdf p.85(인쇄 81)
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        $a\ne0$, $b\ne0$, $c\ne0$이므로 점 $\mathrm{F}$는 세 변 위에 있지 않고 삼각형 내부에 있다. $\mathrm{AF}$가 변 $\mathrm{BC}$와 만나는 점을 $\mathrm{P}$라 하자.
      criteria: [1-1.M1]
    - id: 1-1b-2
      content: |
        $\mathrm{DE}\parallel\mathrm{BC}$이므로 $\triangle\mathrm{ADF}\sim\triangle\mathrm{ABP}$, $\triangle\mathrm{AEF}\sim\triangle\mathrm{ACP}$이고 닮음비는 모두 $\overline{\mathrm{AF}}:\overline{\mathrm{AP}}$이다. 따라서 $\overline{\mathrm{DF}}:\overline{\mathrm{EF}}=\overline{\mathrm{BP}}:\overline{\mathrm{CP}}$.
      criteria: [1-1.M1]
    - id: 1-1b-3
      content: |
        $\triangle\mathrm{ABF}$와 $\triangle\mathrm{CAF}$의 넓이비 $c:b$는 공통변 $\mathrm{AF}$에서 $\mathrm{B}$, $\mathrm{C}$까지의 높이비이고, 이는 $\triangle\mathrm{ABP}$와 $\triangle\mathrm{ACP}$에서 $\mathrm{AP}$를 밑변으로 한 높이비와 같다. 따라서 두 삼각형의 넓이비는 $c:b$이고 제시문 (나)에 의해 $\overline{\mathrm{BP}}:\overline{\mathrm{CP}}=\overline{\mathrm{DF}}:\overline{\mathrm{EF}}=c:b$.
      criteria: [1-1.M1]
    - id: 1-1b-4
      content: |
        $b=\dfrac12$, $c=\dfrac16$이므로 $\dfrac{\overline{\mathrm{DF}}}{\overline{\mathrm{EF}}}=\dfrac{c}{b}=\dfrac13$이다.
      criteria: [1-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 10
      evidence: |
        선분비 $\overline{\mathrm{DF}}:\overline{\mathrm{EF}}$(또는 원문 표기 $\overline{\mathrm{DE}}:\overline{\mathrm{EF}}$)를 넓이비로부터 $1:3$으로 구했다. (공식 채점기준: 「$\overline{\mathrm{DE}}:\overline{\mathrm{EF}}=1:3$까지만 구한 경우 10점」)
      # [판독확인] 채점기준 원문이 DE:EF 로 표기 — DF:EF 의 오기로 보임(문제·예시답안은 DF:EF)
      depends_on: []
      implied_ok: true
      steps: [1-1b-1, 1-1b-2, 1-1b-3]
    - id: 1-1.A1
      mark_type: A
      points: 20
      evidence: |
        답 $\dfrac13$을 맞게 구했다(공식: 답이 맞으면 30점 = 1-1.M1 + 1-1.A1).
      depends_on: [1-1.M1]
      cao: true
      steps: [1-1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42601}
  misconceptions:
  - id: MC-GEO-42601
    outcome_code: '71'
    wrong_work: '$\overline{\mathrm{DF}}:\overline{\mathrm{EF}}=b:c$로 놓아 답 $3$'
    detect_cue: 답이 $3$, $\mathrm{B}$쪽 선분에 $b$를 대응시킴
    feedback: $\overline{\mathrm{BP}}$쪽 삼각형은 $\triangle\mathrm{ABF}$(넓이비 $c$)입니다. 선분과 마주 보는 꼭짓점을 확인하세요.
    remedy: [RL-1]

- id: '1-2'
  stem: |
    점 $\mathrm{F}(x,y)$가 삼각형 $\mathrm{ABC}$의 내부를 움직일 때,
    $$x=\boxed{(\text{ㄱ})}\times a+\boxed{(\text{ㄴ})}\times b+\boxed{(\text{ㄷ})}\times c,$$
    $$y=\boxed{(\text{ㄹ})}\times a+\boxed{(\text{ㅁ})}\times b+\boxed{(\text{ㅂ})}\times c$$
    가 성립한다. 실수 (ㄱ), (ㄴ), (ㄷ), (ㄹ), (ㅁ), (ㅂ)의 값을 구하시오. (40점)
  points: 40
  depends_on: ['1-1']
  answer: {kind: expression, value: '(1, -2, 7, 4, -3, 2)', equivalents: ['(ㄱ)=1, (ㄴ)=-2, (ㄷ)=7, (ㄹ)=4, (ㅁ)=-3, (ㅂ)=2'], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{AF}}:\overline{\mathrm{FP}}=(b+c):a$로 $\mathrm{D}$, $\mathrm{E}$를 내분점으로 쓰고 $\mathrm{F}$를 $\mathrm{DE}$의 $c:b$ 내분점으로 쓰면 $\mathrm{F}=a\mathrm{A}+b\mathrm{B}+c\mathrm{C}$.
    steps:
    - {id: 1-2a, content: '$x=1\cdot a-2b+7c$, $y=4a-3b+2c$', criteria: [1-2.M1, 1-2.B1, 1-2.B2, 1-2.B3, 1-2.B4, 1-2.B5, 1-2.B6]}
    hint_ladder:
    - $\triangle\mathrm{FBC}$와 $\triangle\mathrm{ABC}$의 넓이비 $a$는 어떤 높이의 비인가?
    - 그 높이비로 $\overline{\mathrm{AF}}:\overline{\mathrm{FP}}$를 구해 보자.
  - id: S1-2-B
    audience: B
    source_flow: rep2026.pdf pp.85–86(인쇄 81–82)
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$, $\mathrm{C}(x_3,y_3)$, $\mathrm{D}(x_4,y_4)$, $\mathrm{E}(x_5,y_5)$, $\mathrm{F}(x,y)$라 하고, $\mathrm{P}$는 1-1의 풀이에서와 같이 정의한다. $\triangle\mathrm{ABC}$와 $\triangle\mathrm{FBC}$의 넓이비 $1:a$는 변 $\mathrm{BC}$에서 점 $\mathrm{A}$와 점 $\mathrm{F}$까지의 높이비이고, 이는 $\triangle\mathrm{ABP}$와 $\triangle\mathrm{ADF}$의 닮음비와 연결되어 $\overline{\mathrm{AF}}:\overline{\mathrm{FP}}=(b+c):a$이다.
      criteria: [1-2.M1]
    - id: 1-2b-2
      content: |
        삼각형의 닮음을 이용하면 점 $\mathrm{D}$는 선분 $\mathrm{AB}$를 $(b+c):a$로 내분하는 점, 점 $\mathrm{E}$는 선분 $\mathrm{AC}$를 $(b+c):a$로 내분하는 점, 점 $\mathrm{F}$는 선분 $\mathrm{DE}$를 $c:b$로 내분하는 점이다(1-1). 제시문 (가)와 $a+b+c=1$에 의해
        $\mathrm{D}=\bigl(ax_1+(b+c)x_2,\ ay_1+(b+c)y_2\bigr)$, $\mathrm{E}=\bigl(ax_1+(b+c)x_3,\ ay_1+(b+c)y_3\bigr)$,
        $\mathrm{F}=(ax_1+bx_2+cx_3,\ ay_1+by_2+cy_3)$.
      criteria: [1-2.M1]
    - id: 1-2b-3
      content: |
        $\mathrm{A}(1,4)$, $\mathrm{B}(-2,-3)$, $\mathrm{C}(7,2)$를 대입하면 $x=1\cdot a+(-2)\cdot b+7\cdot c$, $y=4a+(-3)b+2c$. 따라서 (ㄱ)$=1$, (ㄴ)$=-2$, (ㄷ)$=7$, (ㄹ)$=4$, (ㅁ)$=-3$, (ㅂ)$=2$.
      criteria: [1-2.B1, 1-2.B2, 1-2.B3, 1-2.B4, 1-2.B5, 1-2.B6]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 10
      evidence: |
        답을 구하기 위한 과정 설명이 있고 타당하다 — 경우 1: 직선의 방정식 이용, 또는 경우 2: 점 $\mathrm{D}$는 선분 $\mathrm{AB}$를 $b+c:a$로, 점 $\mathrm{E}$는 선분 $\mathrm{AC}$를 $b+c:a$로, 점 $\mathrm{F}$는 선분 $\mathrm{DE}$를 $c:b$로 내분하는 점임을 밝힘.
      depends_on: []
      implied_ok: false
      steps: [1-2b-1, 1-2b-2]
