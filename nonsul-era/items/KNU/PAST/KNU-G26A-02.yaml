    audience: A
    method_no: 1
    key_idea: (*)의 세 구간으로 나눠 $0+\dfrac3{10}+\dfrac34=\dfrac{21}{20}$.
    steps:
    - {id: 2-4a, content: '$\int_0^{1/4}(-64x^4+160x^3-120x^2+25x)dx=\tfrac3{10}$, $\int_{1/4}^1 1\,dx=\tfrac34$, 합 $\tfrac{21}{20}$, $p+q=41$', criteria: [2-4.M1, 2-4.B1, 2-4.A1, 2-4.A2]}
    hint_ladder:
    - 2-2의 구간식 (*)를 그대로 쓰자.
  - id: S2-4-B
    audience: B
    source_flow: rep2026.pdf p.92(인쇄 88)
    method_no: 1
    steps:
    - id: 2-4b-1
      content: |
        (*)와 제시문 (마)에 의해 $\displaystyle\int_{-1}^{1}(f\circ f)(x)\,dx=\int_{-1}^{0}0\,dx+\int_0^{\frac14}f(f(x))\,dx+\int_{\frac14}^{1}1\,dx$.
      criteria: [2-4.M1]
    - id: 2-4b-2
      content: |
        $\displaystyle\int_{-1}^{0}0\,dx+\int_{\frac14}^{1}1\,dx=\dfrac34$.
      criteria: [2-4.B1]
    - id: 2-4b-3
      content: |
        $\displaystyle\int_0^{\frac14}f(f(x))\,dx=\int_0^{\frac14}(-64x^4+160x^3-120x^2+25x)\,dx=\dfrac3{10}$.
      criteria: [2-4.A1]
    - id: 2-4b-4
      content: |
        $\displaystyle\int_{-1}^{1}(f\circ f)(x)\,dx=0+\dfrac3{10}+\dfrac34=\dfrac{21}{20}$이므로 $p=20$, $q=21$이고 $p+q=41$이다.
      criteria: [2-4.A2]
