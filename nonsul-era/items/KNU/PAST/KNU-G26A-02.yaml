stimuli:
- label: (가)
  body: |
    $x=a$에서 함수 $f(x)$의 우극한과 좌극한이 각각 존재하고 그 값이 모두 $L$이면 $\displaystyle\lim_{x\to a}f(x)=L$이다. 또한 그 역도 성립한다.
- label: (나)
  body: |
    함수 $f(x)$와 실수 $a$에 대하여
    ① 함수 $f(x)$가 $x=a$에서 정의되어 있고
    ② 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재하며
    ③ $\displaystyle\lim_{x\to a}f(x)=f(a)$
    일 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다.
- label: (다)
  body: |
    함수 $f(x)$에 대하여 극한값
    $$\lim_{h\to0}\dfrac{f(a+h)-f(a)}{h}$$
    가 존재하면 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다.
- label: (라)
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능할 때, 그 구간의 모든 $x$에 대하여
    ① $f'(x)>0$이면 $f(x)$는 그 구간에서 증가한다.
    ② $f'(x)<0$이면 $f(x)$는 그 구간에서 감소한다.
- label: (마)
  body: |
    함수 $f(x)$가 임의의 세 실수 $a$, $b$, $c$를 포함하는 닫힌구간에서 연속일 때,
    $$\int_a^bf(x)\,dx+\int_b^cf(x)\,dx=\int_a^cf(x)\,dx$$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  실수 $a$, $b$, $c$에 대하여 함수
  $$f(x)=\begin{cases}0&(x\le0)\\ax^2+bx+c&(0<x\le1)\\1&(x>1)\end{cases}$$
  는 실수 전체의 집합에서 연속이다. (단, $a\le-2$)

  함수 $f(x)$의 최댓값이 $\dfrac{25}{16}$일 때, 다음 물음에 답하시오.

subparts:
- id: '2-1'
  stem: |
    상수 $a$, $b$, $c$의 값을 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: expression, value: '(-4, 5, 0)', equivalents: ['a=-4, b=5, c=0'], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: $x=0$, $x=1$에서의 연속으로 $c=0$, $a+b=1$; 최댓값은 $(0,1)$의 꼭짓점에서 나므로 $\dfrac{(a-1)^2}{-4a}=\dfrac{25}{16}$.
    steps:
    - {id: 2-1a, content: '$c=0$, $a+b=1$, $4a^2+17a+4=0$, $a\le-2\Rightarrow a=-4$, $b=5$', criteria: [2-1.M1, 2-1.M2, 2-1.A1]}
    hint_ladder:
    - $x=0$과 $x=1$에서 연속이려면 어떤 식이 필요한가?
    - $x\le0$, $x>1$에서 함숫값은 $\tfrac{25}{16}$보다 작다. 최댓값은 어디서 생기는가?
  - id: S2-1-B
    audience: B
    source_flow: rep2026.pdf p.91(인쇄 87)
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        $0<x\le1$에서 $f(x)=g(x)$를 만족하는 실수 전체에서 정의된 이차함수를 $g(x)=ax^2+bx+c$라 하자. $f(x)$가 연속함수이므로 제시문 (가), (나)에 의해
        $0=f(0)=\displaystyle\lim_{x\to0+}f(x)=\lim_{x\to0+}g(x)=c$이고 $1=\displaystyle\lim_{x\to1+}f(x)=f(1)=a+b+c$.
      criteria: [2-1.M1]
    - id: 2-1b-2
      content: |
        두 등식에 의해 $g(x)=ax^2+(1-a)x=a\left(x-\dfrac{a-1}{2a}\right)^2+\dfrac{(a-1)^2}{-4a}$이다. $x\le0$ 또는 $x\ge1$일 때는 $f(x)<\dfrac{25}{16}$이므로, $0<x<1$에서 함수 $f(x)$는 최댓값 $\dfrac{25}{16}$을 가진다. 그러므로 $\dfrac{(a-1)^2}{-4a}=\dfrac{25}{16}$이다.
      criteria: [2-1.M2]
    - id: 2-1b-3
      content: |
        $4a^2+17a+4=0$에서 $a=-4$ 또는 $a=-\dfrac14$이고 $a\le-2$이므로 $a=-4$이다. $c=0$이므로 $a+b=1$이고 $b=1-a=5$이다.
      criteria: [2-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 10
      evidence: |
        $c=0$을 구하고 $a+b=1$을 도출했다(각각 5점).
      depends_on: []
      implied_ok: false
      steps: [2-1b-1]
    - id: 2-1.M2
      mark_type: M
      points: 10
      evidence: |
        $\dfrac{(a-1)^2}{-4a}=\dfrac{25}{16}$을 도출했다.
      depends_on: []
      implied_ok: false
      steps: [2-1b-2]
    - id: 2-1.A1
      mark_type: A
      points: 10
      evidence: |
        $a=-4$, $b=5$를 구했다(각각 5점).
      depends_on: [2-1.M1, 2-1.M2]
      steps: [2-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42601}
  misconceptions:
  - id: MC-ALG-42601
    outcome_code: '71'
    wrong_work: '$a=-\tfrac14$도 답으로 남기거나, 꼭짓점 $x=\tfrac{a-1}{2a}$가 $(0,1)$ 안인지 확인 없이 최댓값 식을 세움'
    detect_cue: 답에 $a=-\tfrac14$, $b=\tfrac54$가 있음
    feedback: 조건 $a\le-2$로 근을 고르고, 꼭짓점 $x=\tfrac58$이 $(0,1)$ 안에 있음을 확인하세요.
    remedy: [RL-1]

- id: '2-2'
  stem: |
    제시문 (가), (다)를 이용하여 함수 $(f\circ f)(x)$가 미분가능하지 않은 점을 모두 구하시오. (40점)
  points: 40
  depends_on: ['2-1']
  answer: {kind: set, value: '{0, 1/4}', equivalents: ['x=0, x=1/4'], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $f(x)$의 값이 $0$ 이하, $(0,1]$, $1$ 초과인 $x$의 범위로 $f\circ f$를 세 구간식으로 쓰고, 경계 $x=0$, $x=\tfrac14$에서 좌·우미분계수를 비교한다.
    steps:
    - {id: 2-2a, content: '$x=0$: 우미분계수 $25$, 좌미분계수 $0$; $x=\tfrac14$: 좌 $-9$, 우 $0$', criteria: [2-2.M1, 2-2.R1, 2-2.A1, 2-2.A2]}
    hint_ladder:
    - $f(x)>1$이 되는 $x$의 범위를 먼저 구하자.
    - 경계점에서 좌·우미분계수를 각각 계산해 보자.
  - id: S2-2-B
    audience: B
    source_flow: rep2026.pdf pp.91–92(인쇄 87–88)
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        함수 $(f\circ f)(x)$는 $f(x)\le0$이면 $0$, $0<f(x)\le1$이면 $-4f(x)^2+5f(x)$, $f(x)>1$이면 $1$이다.
        (i) $x\le0$이면 $f(x)\le0$; (ii) $x>\dfrac14$이면 $f(x)\ge1$; (iii) $0<x\le\dfrac14$이면 $0<f(x)\le1$이고, 이를 이용하면
        $$(f\circ f)(x)=\begin{cases}0&(x\le0)\\-4(-4x^2+5x)^2+5(-4x^2+5x)&\left(0<x\le\frac14\right)\\1&\left(x>\frac14\right)\end{cases}\quad\cdots(*)$$
      criteria: [2-2.M1]
    - id: 2-2b-2
      content: |
        그러므로 함수 $(f\circ f)(x)$는 $x\ne0$이고 $x\ne\dfrac14$인 모든 $x$에서 미분가능하다.
      criteria: [2-2.R1]
    - id: 2-2b-3
      content: |
        $\displaystyle\lim_{h\to0+}\dfrac{(f\circ f)(0+h)-(f\circ f)(0)}{h}=\lim_{h\to0+}\dfrac{g(g(h))-0}{h}=25$, $\displaystyle\lim_{h\to0-}\dfrac{(f\circ f)(0+h)-(f\circ f)(0)}{h}=\lim_{h\to0-}\dfrac{0-0}{h}=0$이므로 제시문 (가)와 (다)에 의해 함수 $(f\circ f)(x)$는 $x=0$에서 미분가능하지 않다.
      criteria: [2-2.A1]
    - id: 2-2b-4
      content: |
        $\displaystyle\lim_{h\to0-}\dfrac{(f\circ f)\left(\frac14+h\right)-(f\circ f)\left(\frac14\right)}{h}=\lim_{h\to0-}\dfrac{g\left(g\left(\frac14+h\right)\right)-g\left(g\left(\frac14\right)\right)}{h}=-9$, $\displaystyle\lim_{h\to0+}\dfrac{(f\circ f)\left(\frac14+h\right)-(f\circ f)\left(\frac14\right)}{h}=\lim_{h\to0+}\dfrac{1-1}{h}=0$이므로 제시문 (가)와 (다)에 의해 함수 $(f\circ f)(x)$는 $x=\dfrac14$에서 미분가능하지 않다.
      criteria: [2-2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 15
      evidence: |
        함수 $(f\circ f)(x)$를 3개의 구간별 함수식으로 각각 도출했다(각각 5점).
      depends_on: []
      implied_ok: false
      steps: [2-2b-1]
    - id: 2-2.R1
      mark_type: R
      points: 5
      evidence: |
        오직 $x=0$과 $x=\dfrac14$에서 미분가능하지 않음을 언급했다.
      depends_on: [2-2.M1]
      steps: [2-2b-2]
    - id: 2-2.A1
      mark_type: A
      points: 10
      evidence: |
        함수 $(f\circ f)(x)$가 $x=0$에서 미분가능하지 않음을 (좌·우미분계수 $0$, $25$로) 보였다.
      depends_on: [2-2.M1]
      steps: [2-2b-3]
    - id: 2-2.A2
      mark_type: A
      points: 10
      evidence: |
        함수 $(f\circ f)(x)$가 $x=\dfrac14$에서 미분가능하지 않음을 (좌·우미분계수 $-9$, $0$으로) 보였다.
      depends_on: [2-2.M1]
      steps: [2-2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42601}
  - {code: '72', misconception: MC-CAL-42602}
  misconceptions:
  - id: MC-CAL-42601
    outcome_code: '71'
    wrong_work: '$(f\circ f)(x)$를 $x\le0$, $0<x\le1$, $x>1$로 나눠 $0<x\le1$ 전체에서 $g(g(x))$라 씀'
    detect_cue: 경계로 $x=1$을 쓰고 $x=\tfrac14$가 없음
    feedback: 바깥 $f$의 구간은 $f(x)$의 값으로 정해집니다. $f(x)>1$이 되는 $x$의 범위를 먼저 구하세요.
    remedy: [RL-2]
  - id: MC-CAL-42602
    outcome_code: '72'
    wrong_work: '$x=1$도 미분가능하지 않은 점으로 답함'
    detect_cue: 답에 $x=1$ 포함
    feedback: $x$가 $1$ 근처일 때 $f(x)\ge1$이라 $(f\circ f)(x)=1$로 상수입니다. 후보점마다 좌·우미분계수를 직접 비교하세요.
    remedy: [RL-3]

- id: '2-3'
  stem: |
    열린구간 $(0,m)$에서 함수 $(f\circ f)(x)$가 항상 증가하도록 하는 양수 $m$의 최댓값을 구하시오. (30점)
  points: 30
  depends_on: ['2-1', '2-2']
  answer: {kind: value, value: '(5-sqrt(15))/8', equivalents: [], tolerance: null}
  solutions:
  - id: S2-3-A
    audience: A
    method_no: 1
    key_idea: $0<x<\tfrac14$에서 $(f\circ f)'(x)=(32x^2-40x+5)(-8x+5)$이고 $-8x+5>0$이므로 부호는 $32x^2-40x+5$가 결정한다.
    steps:
    - {id: 2-3a, content: '$32x^2-40x+5>0\iff x<\tfrac{5-\sqrt{15}}8$ (구간 안), $m=\tfrac{5-\sqrt{15}}8$', criteria: [2-3.M1, 2-3.R1, 2-3.A1]}
    hint_ladder:
    - $(f\circ f)'(x)=f'(f(x))f'(x)$를 계산해 보자.
    - $0<x<\tfrac14$에서 $f'(x)$의 부호는?
  - id: S2-3-B
    audience: B
    source_flow: rep2026.pdf p.92(인쇄 88)
    method_no: 1
    steps:
    - id: 2-3b-1
      content: |
        2-1에 의해 $g(x)=-4x^2+5x$이고 $g'(x)=-8x+5$이다. $0<x<\dfrac14$이면 합성함수 미분법에 의해 $(f\circ f)'(x)=(g\circ g)'(x)=g'(g(x))g'(x)=(32x^2-40x+5)(-8x+5)$이다.
      criteria: [2-3.M1]
    - id: 2-3b-2
      content: |
        모든 $0<x<\dfrac14$에서 항상 $-8x+5>0$이고, $32x^2-40x+5=32\left(x-\dfrac{5+\sqrt{15}}8\right)\left(x-\dfrac{5-\sqrt{15}}8\right)<0\iff\dfrac{5-\sqrt{15}}8<x<\dfrac{5+\sqrt{15}}8$. 제시문 (라)에 의해 함수 $(f\circ f)(x)$는 열린구간 $\left(0,\dfrac{5-\sqrt{15}}8\right)$에서 증가하고 열린구간 $\left(\dfrac{5-\sqrt{15}}8,\dfrac14\right)$에서 감소한다.
      criteria: [2-3.R1]
    - id: 2-3b-3
      content: |
        따라서 가능한 $m$의 최댓값은 $\dfrac{5-\sqrt{15}}8$이다.
      criteria: [2-3.A1]
  - id: S2-3-ALT
    audience: ALT
    source_flow: rep2026.pdf p.92(인쇄 88) 별해
    method_no: 2
    key_idea: |
      열린구간 $\left(0,\tfrac58\right)$에서 $f$는 증가하고, $0<x<\tfrac{5-\sqrt{15}}8$이면 $0<f(x)<\tfrac58$이므로 바깥 $f$도 증가 구간에 있어 $f(f(x))$가 증가한다.
    # [공식해설 확인필요] 별해 원문은 「f(x)<5/8 ⇔ (5-√15)/8<x<(5+√15)/8」로 적혀 있으나 실제로는 f(x)>5/8 ⇔ (5-√15)/8<x<(5+√15)/8 (부등호 방향 오기). 결론 m 은 동일.
    steps:
    - id: 2-3c-1
      content: |
        열린구간 $\left(0,\dfrac{5-\sqrt{15}}8\right)$에서 $f(x)$는 증가하고 $0<f(x)<\dfrac58$이므로 $f(f(x))$는 증가한다. 열린구간 $\left(\dfrac{5-\sqrt{15}}8,\dfrac14\right)$에서 $f(f(x))$는 감소한다. 따라서 $m$의 최댓값은 $\dfrac{5-\sqrt{15}}8$이다.
      criteria: [2-3.R1, 2-3.A1]
  rubric:
