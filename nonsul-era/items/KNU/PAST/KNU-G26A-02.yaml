intent: |
  함수의 연속과 이차함수의 최댓값으로 이차함수를 결정하고(2-1), 미분계수의 정의로 미분가능하지 않음을 보이며(2-2), 합성함수의 미분으로 사차함수의 증가·감소를 판정하고(2-3), 다항함수의 정적분과 정적분의 성질로 정적분을 계산할 수 있는지(2-4) 평가한다.
key_idea: |
  연속 조건으로 $c=0$, $a+b=1$, 꼭짓점 값 $\dfrac{(a-1)^2}{-4a}=\dfrac{25}{16}$로 $f(x)=-4x^2+5x$. $f\circ f$는 속함수 값 $f(x)$의 범위($\le0$, $(0,1]$, $>1$)로 $x\le0$, $0<x\le\tfrac14$, $x>\tfrac14$의 세 구간식이 된다.
stuck: |
  $f\circ f$를 구간별로 쓸 때 $x$의 범위가 아니라 $f(x)$의 값의 범위로 나누는 단계(특히 $f(x)>1\iff\tfrac14<x<1$을 찾는 것)
