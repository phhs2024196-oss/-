- id: '2-4'
  stem: |
    $\displaystyle\int_{-1}^{1}(f\circ f)(x)\,dx=\dfrac qp$일 때, $p+q$의 값을 구하시오.
    (단, $p$, $q$는 서로소인 자연수) (30점)
  points: 30
  depends_on: ['2-2']
  answer: {kind: value, value: '41', equivalents: [], tolerance: null}
  solutions:
