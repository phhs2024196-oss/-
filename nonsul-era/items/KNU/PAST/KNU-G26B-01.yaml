stimuli:
- label: (가)
  body: |
    이계도함수를 갖는 함수 $f(x)$에 대하여 $f''(a)=0$이고 $x=a$의 좌우에서 $f''(x)$의 부호가 바뀌면 점 $(a,f(a))$는 곡선 $y=f(x)$의 변곡점이다.
- label: (나)
  body: |
    $x=a$에서 함수 $f(x)$의 우극한과 좌극한이 각각 존재하고 그 값이 모두 $L$이면 $\displaystyle\lim_{x\to a}f(x)=L$이다. 또한 그 역도 성립한다.
- label: (다)
  body: |
    함수 $f(x)$와 실수 $a$에 대하여
    ① 함수 $f(x)$가 $x=a$에서 정의되어 있고
    ② 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재하며
    ③ $\displaystyle\lim_{x\to a}f(x)=f(a)$
    일 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다.
- label: (라)
  body: |
    수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라고 하면
    $$a_1=S_1,\quad a_n=S_n-S_{n-1}\ (\text{단, }n\ge2)$$
- label: (마)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)\,dx=\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x$$
    (단, $\Delta x=\dfrac{b-a}{n}$이고 $x_k=a+k\Delta x$)

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  삼차함수 $g(x)=ax^3+bx^2+2x-15$와 이차함수 $h(x)=x^2+rx+s$에 대하여 함수
  $$f(x)=\begin{cases}g(x)&(x<2)\\h(x)&(x\ge2)\end{cases}$$
  라고 할 때, 함수 $f(x)$와 $g(x)$는 다음 조건을 만족시킨다. (단, $a$는 자연수이고 $b,r,s$는 실수)

  (Ⅰ) 함수 $g(x)$는 $x=-\dfrac23$에서 변곡점을 가진다.
  (Ⅱ) 함수 $f(x)$의 역함수가 존재한다.
  (Ⅲ) 함수 $f(x)$는 실수 전체의 집합에서 연속이다.
  (Ⅳ) $\displaystyle\lim_{h\to0-}\dfrac{f(2+3h)-f(2+h)}{h}=2f'(c)$인 $c$가 구간 $[2,\infty)$에 존재한다.

  다음 물음에 답하시오.

subparts:
- id: '1-1'
  stem: |
    상수 $a$와 $b$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: expression, value: '(1, 2)', equivalents: ['a=1, b=2'], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: (Ⅰ)로 $b=2a$, (Ⅰ)(Ⅱ)로 $g'(x)\ge0$이므로 $b^2-6a\le0$; $a$ 자연수.
    steps:
    - {id: 1-1a, content: '$4a^2-6a\le0\Rightarrow0\le a\le\tfrac32$, $a=1$, $b=2$', criteria: [1-1.M1, 1-1.M2, 1-1.A1]}
    hint_ladder:
    - 변곡점에서 $g''$의 값은?
    - 역함수가 존재하면 $g$는 증가해야 한다. $g'(x)\ge0$을 판별식으로 바꾸자.
  - id: S1-1-B
    audience: B
    source_flow: rep2026.pdf p.108(인쇄 104)
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        $g'(x)=3ax^2+2bx+2$이고 $g''(x)=6ax+2b$이다. 조건 (Ⅰ)에 의해 $g''\!\left(-\dfrac23\right)=0$이므로 $2a=b$이다.
      criteria: [1-1.M1]
    - id: 1-1b-2
      content: |
        또한 조건 (Ⅰ)과 조건 (Ⅱ)에 의해 모든 실수 $x$에 대하여 $g'(x)\ge0$이므로 $b^2-3a\times2\le0$이다.
      criteria: [1-1.M2]
    - id: 1-1b-3
      content: |
        이 부등식을 풀면 $0\le a\le\dfrac32$이다. $a$는 자연수이므로 $a=1$이고 $b=2$이다.
      criteria: [1-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: $2a=b$를 올바르게 제시했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.M2
      mark_type: M
      points: 5
      evidence: |
        $b^2-6a\le0$을 올바르게 제시했다($2a=b$를 이용하여 변형한 식, 예: $4a^2-6a\le0$, $b^2-3b\le0$ 등도 인정).
      depends_on: []
      implied_ok: false
      accept: ['$4a^2-6a\le0$', '$b^2-3b\le0$']
      steps: [1-1b-2]
    - id: 1-1.A1
      mark_type: A
      points: 10
      evidence: |
        $a=1$과 $b=2$를 모두 올바르게 구했다(하나만 맞으면 5점, 그 외 0점).
      depends_on: [1-1.M1, 1-1.M2]
      steps: [1-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42605}
  misconceptions:
  - id: MC-CAL-42605
    outcome_code: '71'
    wrong_work: '$b=2a$만 쓰고 $a$를 정하지 못하거나, 판별식을 $b^2-4\cdot3a\cdot2\le0$으로 잘못 써 $a\le3$에서 $a=1,2,3$을 모두 답함'
    detect_cue: $a$의 후보가 여러 개, 또는 $g'(x)\ge0$ 조건이 없음
    feedback: 역함수가 존재하려면 $g$가 증가함수여야 하므로 $g'(x)=3ax^2+2bx+2\ge0$이 모든 $x$에서 성립해야 합니다(짝수 판별식 $b^2-6a\le0$).
    remedy: [RL-1]

- id: '1-2'
  stem: |
    가능한 모든 실수 $r$의 값의 범위는 $\alpha\le r\le\beta$이다. 상수 $\alpha$와 $\beta$의 값을 구하시오. (20점)
  points: 20
  depends_on: ['1-1']
  answer: {kind: expression, value: '(-4, 18)', equivalents: ['alpha=-4, beta=18'], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: $x=2$에서의 우미분계수 $4+r\ge0$ (증가), (Ⅳ)의 좌극한은 $2g'(2)=44$이므로 $2c+r=22$, $c\ge2$.
    steps:
    - {id: 1-2a, content: '$r\ge-4$, $r=22-2c\le18$', criteria: [1-2.M1, 1-2.M2, 1-2.M3, 1-2.A1]}
    hint_ladder:
    - $h\to0-$이면 $2+3h$와 $2+h$는 어느 쪽 함수에 들어가는가?
    - $f$가 증가하려면 $x\ge2$ 쪽 $h(x)$의 기울기 조건은?
  - id: S1-2-B
    audience: B
    source_flow: rep2026.pdf p.109(인쇄 105)
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        1-1에 의해 $g(x)=x^3+2x^2+2x-15$이다. $x\ge2$에서 $f(x)=h(x)$이므로 조건 (Ⅱ)에 의해
        $0\le\displaystyle\lim_{h\to0+}\dfrac{f(2+h)-f(2)}{h}=4+r$이다. 그러므로 $r\ge-4$이다.
      criteria: [1-2.M1]
    - id: 1-2b-2
      content: |
        또한 $c\ge2$이고 $x<2$에서 $f(x)=g(x)$이므로 조건 (Ⅳ)에 의해
        $2c+r=f'(c)=\displaystyle\lim_{h\to0-}\dfrac{f(2+3h)-f(2+h)}{2h}=22$이다.
      criteria: [1-2.M2, 1-2.M3]
    - id: 1-2b-3
      content: |
        그러므로 $r=22-2c\le18$이다. 따라서 $-4\le r\le18$이고, $\alpha=-4$, $\beta=18$이다.
      criteria: [1-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 4
      evidence: |
        $\displaystyle\lim_{h\to0+}\dfrac{f(2+h)-f(2)}{h}=4+r$을 제시했다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-1]
    - id: 1-2.M2
      mark_type: M
      points: 4
      evidence: |
        $\displaystyle\lim_{h\to0-}\dfrac{f(2+3h)-f(2+h)}{h}=44$ (또는 $\displaystyle\lim_{h\to0-}\dfrac{g(2+3h)-g(2+h)}{h}=44$ 또는 $\displaystyle\lim_{h\to0-}\dfrac{f(2+3h)-f(2+h)}{2h}=22$ 또는 $\displaystyle\lim_{h\to0-}\dfrac{g(2+3h)-g(2+h)}{2h}=22$)를 올바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-2]
    - id: 1-2.M3
      mark_type: M
      points: 4
      evidence: $f'(c)=2c+r$을 제시했다.
      depends_on: []
      implied_ok: true
      steps: [1-2b-2]
    - id: 1-2.A1
      mark_type: A
      points: 8
      evidence: |
        $\alpha=-4$와 $\beta=18$을 올바르게 구했다(하나만 맞으면 4점, 그 외 0점).
      depends_on: [1-2.M1, 1-2.M2]
      steps: [1-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42606}
  misconceptions:
  - id: MC-CAL-42606
    outcome_code: '71'
    wrong_work: '(Ⅳ)의 좌변을 $2h\prime(2)=2(4+r)$로 계산해 $2c+r=4+r$, $c=2$로 처리하고 $\beta$를 구하지 못함'
    detect_cue: 좌변 극한을 $h(x)$로 계산, $44$가 없음
    feedback: $h\to0-$이면 $2+3h<2$, $2+h<2$이므로 $f=g$입니다. 미분계수의 정의로 $3g'(2)-g'(2)=2g'(2)$가 됩니다.
    remedy: [RL-2]

- id: '1-3(1)'
  stem: |
    모든 자연수 $n$과 【1-2】에서 구한 $\beta$에 대하여 $r=\beta$일 때 수열 $\{a_n\}$은
    $$a_n=f(n)\quad(n\ge1)$$
    로 정의된다. 또한 수열 $\{b_n\}$은
    $$a_n=\sum_{k=1}^{n}\dfrac{kb_{n-k+1}}{n+1}\quad(n\ge1)$$
    을 만족시킨다.
    (1) $a_1+a_5$의 값을 구하시오. (10점)
  points: 10
  depends_on: ['1-2']
  answer: {kind: value, value: '70', equivalents: [], tolerance: null}
  solutions:
  - id: S1-31-A
    audience: A
    method_no: 1
    key_idea: (Ⅲ)으로 $h(2)=g(2)=5$에서 $2r+s=1$, $r=18$이면 $s=-35$; $a_1=g(1)$, $a_5=h(5)$.
    steps:
    - {id: 1-31a, content: '$a_1=-10$, $a_5=80$, 합 $70$', criteria: ['1-3(1).M1', '1-3(1).A1', '1-3(1).A2']}
    hint_ladder:
    - $n=1$일 때 $f(1)$은 어느 식으로 계산하는가?
  - id: S1-31-B
    audience: B
    source_flow: rep2026.pdf p.109(인쇄 105)
    method_no: 1
    steps:
    - id: 1-31b-1
      content: |
        조건 (Ⅲ)에 의해 $\displaystyle\lim_{x\to2-}g(x)=h(2)$이므로 $2r+s=1$이다. 【1-2】에 의해 $\beta=18$이므로 $h(x)=x^2+18x-35$이다.
      criteria: ['1-3(1).M1']
    - id: 1-31b-2
      content: |
        그러므로 $a_n=\begin{cases}-10&(n=1)\\n^2+18n-35&(n\ge2)\end{cases}$이다.
      criteria: ['1-3(1).A1']
    - id: 1-31b-3
      content: |
        따라서 $a_1=-10$, $a_5=80$이고 $a_1+a_5=70$이다.
      criteria: ['1-3(1).A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3(1).M1
      mark_type: M
      points: 4
