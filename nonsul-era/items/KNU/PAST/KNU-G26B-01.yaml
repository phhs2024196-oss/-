  - '$g\prime\prime\left(-\tfrac23\right)=0\Rightarrow b=2a$'
  - '$g\prime(x)=3ax^2+2bx+2\ge0$의 판별식 $b^2-6a\le0$'
  - '$\displaystyle\lim_{h\to0-}\dfrac{g(2+3h)-g(2+h)}{2h}=g\prime(2)=22$'
  - '$(n+1)a_n-na_{n-1}=\sum_{k=1}^{n}b_k$'
