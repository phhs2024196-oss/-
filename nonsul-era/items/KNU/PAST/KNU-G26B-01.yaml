    outcome_code: '71'
    wrong_work: '$b_n=6n+32$를 $n=1,2,3$에도 적용해 $b_1=38$, $b_2=44$, $b_3=50$으로 계산'
    detect_cue: $b_1$, $b_2$, $b_3$이 모두 $6n+32$ 꼴
    feedback: $a_1$이 다른 식이라 합의 식은 $n\ge3$, 일반항은 $n\ge4$에서만 성립합니다. 앞 항은 따로 구하세요.
    remedy: [RL-4]

- id: '1-3(3)'
  stem: |
    (3) $\displaystyle\lim_{n\to\infty}\dfrac1{n^6}\sum_{k=1}^{n+3}\left(\dfrac{b_k-44}{12}+\dfrac n2\right)^5=\dfrac qp$일 때, $p$와 $q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수) (40점)
  points: 40
  depends_on: ['1-3(2)']
  answer: {kind: expression, value: '(64, 21)', equivalents: ['p=64, q=21'], tolerance: null}
  solutions:
  - id: S1-33-A
    audience: A
    method_no: 1
    key_idea: $k\ge4$에서 $\dfrac{b_k-44}{12}=\dfrac{k-2}2$이고 앞 세 항은 $\dfrac1{n^6}\cdot O(n^5)\to0$; $t=k-2$로 바꾸면 $\dfrac1{32}\int_1^2x^5dx=\dfrac{21}{64}$.
    steps:
    - {id: 1-33a, content: '$\tfrac1{32}\lim\tfrac1n\sum_{t=1}^{n}\left(\tfrac tn+1\right)^5=\tfrac1{32}\int_1^2x^5dx=\tfrac{21}{64}$', criteria: ['1-3(3).M1', '1-3(3).M2', '1-3(3).A1']}
    hint_ladder:
    - $b_k=6k+32$이면 $\dfrac{b_k-44}{12}$는?
    - $\dfrac{k-2+n}{2}$에서 $t=k-2$로 놓고 $n$으로 묶어 보자.
  - id: S1-33-B
    audience: B
    source_flow: rep2026.pdf pp.109–110(인쇄 105–106)
    method_no: 1
    steps:
    - id: 1-33b-1
      content: |
        (2)에 의해
        $\displaystyle\lim_{n\to\infty}\dfrac1{n^6}\sum_{k=1}^{n+3}\left(\dfrac{b_k-44}{12}+\dfrac n2\right)^5=\lim_{n\to\infty}\dfrac1{n^6}\left\{\left(-\dfrac{16}3+\dfrac n2\right)^5+\left(\dfrac{11}{12}+\dfrac n2\right)^5+\left(\dfrac32+\dfrac n2\right)^5+\sum_{k=4}^{n+3}\left(\dfrac{k-2}2+\dfrac n2\right)^5\right\}$
      criteria: ['1-3(3).M1']
    - id: 1-33b-2
      content: |
        앞 세 항은 $\dfrac1n\left(-\dfrac{16}{3n}+\dfrac12\right)^5$ 등의 꼴로 $0$에 수렴하므로
        $=\dfrac1{32}\displaystyle\lim_{n\to\infty}\dfrac1{n^6}\sum_{t=2}^{n+1}(t+n)^5=\dfrac1{32}\lim_{n\to\infty}\dfrac1{n^6}\left\{\sum_{t=1}^{n}(t+n)^5+(2n+1)^5-(1+n)^5\right\}$
        $=\dfrac1{32}\left[\displaystyle\lim_{n\to\infty}\dfrac1n\sum_{t=1}^{n}\left(\dfrac tn+1\right)^5+\lim_{n\to\infty}\left\{\dfrac1n\left(2+\dfrac1n\right)^5-\dfrac1n\left(\dfrac1n+1\right)^5\right\}\right]$
      criteria: ['1-3(3).M1']
    - id: 1-33b-3
      content: |
        제시문 (마)에 의해 $=\dfrac1{32}\displaystyle\int_1^2x^5\,dx$
      criteria: ['1-3(3).M2']
    - id: 1-33b-4
      content: |
        $=\dfrac1{32}\cdot\dfrac{64-1}{6}=\dfrac{21}{64}$이다. 따라서 $p=64$, $q=21$이다.
      criteria: ['1-3(3).A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3(3).M1
      mark_type: M
      points: 15
      evidence: |
        무한급수의 식을 계산하여 $\dfrac1{32}\displaystyle\lim_{n\to\infty}\dfrac1n\sum_{t=1}^{n}\left(\dfrac tn+1\right)^5$을 올바르게 제시했다(다른 방법으로 $\displaystyle\lim_{n\to\infty}\sum_{t=1}^{n}$ 꼴을 얻어 계산이 맞아도 15점).
      depends_on: []
      implied_ok: false
      steps: [1-33b-1, 1-33b-2]
    - id: 1-3(3).M2
      mark_type: M
      points: 15
      evidence: |
        무한급수의 식을 계산하여 $\dfrac1{32}\displaystyle\int_1^2x^5\,dx$를 올바르게 제시했다(다른 방법으로 적분식을 얻어 계산이 맞아도 15점).
      depends_on: []
      implied_ok: false
      steps: [1-33b-3]
    - id: 1-3(3).A1
      mark_type: A
      points: 10
      evidence: |
        $p=64$와 $q=21$을 올바르게 구했다(하나만 맞으면 5점, 그 외 0점).
      depends_on: ['1-3(3).M2']
      steps: [1-33b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42607}
  misconceptions:
  - id: MC-CAL-42607
    outcome_code: '71'
    wrong_work: '$\left(\tfrac{k-2+n}{2}\right)^5$을 $\tfrac1{32}\int_0^1x^5dx$로 바꿔 $\tfrac1{192}$'
    detect_cue: 적분 구간이 $[0,1]$, 또는 $\tfrac1n$을 묶을 때 $n^5$ 인수 처리 누락
    feedback: $\dfrac{t+n}{n}=1+\dfrac tn$이므로 $x$는 $1$에서 $2$까지 움직입니다.
    remedy: [RL-5]

