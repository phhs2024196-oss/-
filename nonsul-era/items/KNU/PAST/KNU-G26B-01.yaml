- id: '1-3(2)'
  stem: |
    (2) $b_1+3b_2+4b_3-b_{50}$의 값을 구하시오. (30점)
  points: 30
  depends_on: ['1-3(1)']
  answer: {kind: value, value: '61', equivalents: [], tolerance: null}
  solutions:
  - id: S1-32-A
    audience: A
    method_no: 1
    key_idea: $(n+1)a_n=\sum_{k=1}^{n}kb_{n-k+1}$에서 이웃 항의 차가 $\sum_{k=1}^nb_k$이다.
    steps:
    - {id: 1-32a, content: '$\sum_{k=1}^{n}b_k=(n+1)a_n-na_{n-1}$, $b_1=-20$, $b_2=55$, $b_3=62$, $b_{50}=332$', criteria: ['1-3(2).M1', '1-3(2).A1', '1-3(2).A2', '1-3(2).A3']}
    hint_ladder:
    - $(n+1)a_n$과 $na_{n-1}$을 $b$로 각각 펼쳐 빼 보자.
  - id: S1-32-B
    audience: B
    source_flow: rep2026.pdf p.109(인쇄 105)
    method_no: 1
    steps:
    - id: 1-32b-1
      content: |
        수열 $\{b_n\}$의 정의에 의해 $(n+1)a_n=b_n+2b_{n-1}+\cdots+nb_1$ $(n\ge1)$이므로 $b_1=2a_1=-20$이다. $n\ge2$일 때 $na_{n-1}=b_{n-1}+2b_{n-2}+\cdots+(n-1)b_1$이므로 $\displaystyle\sum_{k=1}^{n}b_k=(n+1)a_n-na_{n-1}$ $(n\ge2)$이다.
      criteria: ['1-3(2).M1']
    - id: 1-32b-2
      content: |
        $n=2$일 때 $b_1+b_2=3a_2-2a_1=35$이고 $b_2=55$이다. 또한 $n\ge3$일 때
        $(n+1)a_n-na_{n-1}=(n+1)(n^2+18n-35)-n\{(n-1)^2+18(n-1)-35\}=3n^2+35n-35$
        이므로 $\displaystyle\sum_{k=1}^{n}b_k=3n^2+35n-35$ $(n\ge3)$이다.
      criteria: ['1-3(2).M1']
    - id: 1-32b-3
      content: |
        그러므로 $b_1+b_2+b_3=97$이고 $b_3=62$이다. $n\ge4$일 때 $b_n=\displaystyle\sum_{k=1}^{n}b_k-\sum_{k=1}^{n-1}b_k=(3n^2+35n-35)-\{3(n-1)^2+35(n-1)-35\}=6n+32$이다.
      criteria: ['1-3(2).A1']
    - id: 1-32b-4
      content: |
        그러므로 $b_{50}=332$이다. 따라서 $b_1+3b_2+4b_3-b_{50}=-20+165+248-332=61$이다.
      criteria: ['1-3(2).A2', '1-3(2).A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3(2).M1
      mark_type: M
      points: 10
      evidence: |
        $\displaystyle\sum_{k=1}^{n}b_k(=b_1+b_2+\cdots+b_n)=3n^2+35n-35$ $(n\ge3)$을 올바르게 구했다($n$의 범위를 틀리면 3점, 식을 못 구하면 0점).
      depends_on: []
      implied_ok: false
      steps: [1-32b-1, 1-32b-2]
    - id: 1-3(2).A1
      mark_type: A
      points: 10
      evidence: |
        $b_n=6n+32$ $(n\ge4)$를 올바르게 구했다($n$의 범위를 틀리면 8점, 식을 못 구하면 0점).
      depends_on: ['1-3(2).M1']
      steps: [1-32b-3]
    - id: 1-3(2).A2
      mark_type: A
      points: 8
      evidence: |
        $b_1=-20$, $b_2=55$, $b_3=62$, $b_{50}=332$를 올바르게 구했다(각 2점).
      depends_on: ['1-3(2).M1']
      steps: [1-32b-4]
    - id: 1-3(2).A3
      mark_type: A
      points: 2
      evidence: $b_1+3b_2+4b_3-b_{50}=61$을 올바르게 구했다.
      depends_on: ['1-3(2).M1']
      cao: true
      steps: [1-32b-4]
    deductions: []
