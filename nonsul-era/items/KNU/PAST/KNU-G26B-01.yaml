intent: |
  함수의 증가와 감소 및 곡선의 변곡점을 이해하고 있는지(1-1), 미분계수와 함수의 그래프의 개형을 이해하고 있는지(1-2), 수열의 합의 성질 및 정적분과 급수의 합 사이의 관계를 이해하고 있는지(1-3)를 평가한다.
key_idea: |
  변곡점 조건 $g''\!\left(-\tfrac23\right)=0$으로 $b=2a$, 역함수 존재(증가)로 $g'(x)\ge0$의 판별식 $b^2-6a\le0$. (Ⅳ)의 좌극한은 $x<2$ 쪽이므로 $2g'(2)=44$, 따라서 $h'(c)=2c+r=22$ $(c\ge2)$. 수열 $b_n$은 $(n+1)a_n=\sum_{k=1}^{n}kb_{n-k+1}$의 차로 합 $\sum b_k$를 얻는다.
stuck: |
  (Ⅳ)에서 $h\to0-$이면 $2+3h$, $2+h$가 모두 $2$보다 작아 $g$의 미분계수가 쓰인다는 점, 그리고 1-3(2)에서 $(n+1)a_n-na_{n-1}=\sum_{k=1}^{n}b_k$를 끌어내는 단계
idea_tags: [IDEA-INFLECTION-AND-MONOTONE-DISCRIMINANT, IDEA-ONE-SIDED-DERIV-LIMIT-REWRITE, IDEA-CONVOLUTION-SUM-DIFFERENCE, IDEA-RIEMANN-SUM-SHIFT]
tags: [변곡점, 역함수 존재, 미분계수의 정의, 수열의 합과 일반항, 구분구적법]
