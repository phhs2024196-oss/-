stimuli:
- label: (가)
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가 $a=g(\alpha)$, $b=g(\beta)$이며 $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
- label: (나)
  body: |
    함수 $f(x)$의 도함수 $f'(x)$가 닫힌구간 $[a,b]$에서 연속일 때, $x=a$에서 $x=b$까지의 곡선 $y=f(x)$의 길이 $l$은
    $$l=\int_a^b\sqrt{1+\{f'(x)\}^2}\,dx$$
- label: (다)
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능할 때, 그 구간의 모든 $x$에 대하여
    ① $f'(x)>0$이면 $f(x)$는 그 구간에서 증가한다.
    ② $f'(x)<0$이면 $f(x)$는 그 구간에서 감소한다.
- label: (라)
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(x)\le g(x)$일 때,
    $$\int_a^bf(x)\,dx\le\int_a^bg(x)\,dx$$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

subparts:
- id: '2-1'
  stem: |
    열린구간 $\left(-\dfrac\pi2,\dfrac\pi2\right)$에서 정의된 함수
    $$U(x)=\ln\left(\dfrac{1+\sin x}{\cos x}\right)$$
    에 대하여 $\{U'(x)\}^2-1=(\cos x)^m(\sin x)^n$이다. 정수 $m$, $n$의 값을 구하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: '(-2, 2)', equivalents: ['m=-2, n=2'], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: |
      $U(x)=\ln(\sec x+\tan x)$이므로 $U'(x)=\sec x$, $\sec^2x-1=\tan^2x$.
    steps:
    - {id: 2-1a, content: '$\tan^2x=(\cos x)^{-2}(\sin x)^2$, $m=-2$, $n=2$', criteria: [2-1.B1]}
    hint_ladder:
    - $\dfrac{1+\sin x}{\cos x}$를 두 항으로 나눠 보자.
  - id: S2-1-B
    audience: B
    source_flow: rep2026.pdf p.115(인쇄 111)
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        $U(x)=\ln\left(\dfrac{1+\sin x}{\cos x}\right)=\ln(\sec x+\tan x)$이므로 $U'(x)=\dfrac{(\sec x+\tan x)'}{\sec x+\tan x}=\sec x$. 따라서 $\{U'(x)\}^2-1=\tan^2x=(\cos x)^{-2}(\sin x)^2$이므로 $m=-2$, $n=2$.
      criteria: [2-1.B1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.B1
      mark_type: B
      points: 10
      evidence: 답($m=-2$, $n=2$)을 올바르게 계산했다.
      steps: [2-1b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42608}
  misconceptions:
  - id: MC-CAL-42608
    outcome_code: '71'
    wrong_work: '몫의 미분에서 $\left(\dfrac{1+\sin x}{\cos x}\right)\prime=\dfrac{\cos^2x-(1+\sin x)\sin x}{\cos^2x}$로 부호를 틀려 $U\prime(x)$를 잘못 구함'
    detect_cue: $U'(x)\ne\sec x$, 답에 $m=-1$ 등
    feedback: $(\cos x)'=-\sin x$이므로 분자는 $\cos^2x+(1+\sin x)\sin x=1+\sin x$입니다.
    remedy: [RL-1]

- id: '2-2(1)'
  stem: |
    열린구간 $\left(-\dfrac\pi2,\dfrac\pi2\right)$에서 정의된 함수 $f(x)$는
    $$f(x)=\begin{cases}\ln\cos x-2\ln\cos\dfrac\pi6&\left(-\dfrac\pi2<x<\dfrac\pi6\right)\\-\ln\cos\left(\dfrac\pi3-x\right)&\left(\dfrac\pi6\le x<\dfrac\pi2\right)\end{cases}$$
    이다. 또한 닫힌구간 $\left[0,\dfrac\pi3\right]$에서 정의된 함수 $L(t)$, $a(t)$, $b(t)$, $c(t)$는 $0\le t\le\dfrac\pi3$인 모든 $t$에 대하여 다음 조건을 만족시킨다.

    (Ⅰ) $L(t)$는 $x=t$에서 $x=\dfrac\pi3$까지의 곡선 $y=f(x)$의 길이이다.
    (Ⅱ) 두 점 $(0,c(t))$와 $(a(t),b(t))$를 지나는 직선은 점 $(t,f(t))$에서 곡선 $y=f(x)$에 접하며, $a(t)\ge t$이다.
    (Ⅲ) 두 점 $(t,f(t))$와 $(a(t),b(t))$사이의 거리는 $L(t)$이다.

    다음 물음에 답하시오.

    (1) $e^{L\left(\frac\pi6\right)}$의 값을 구하시오. (10점)
  points: 10
  depends_on: ['2-1']
  answer: {kind: value, value: 'sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-21-A
    audience: A
    method_no: 1
    key_idea: |
      $\tfrac\pi6<x<\tfrac\pi3$에서 $\sqrt{1+f'^2}=\sec\left(\tfrac\pi3-x\right)$, 치환하면 $\int_0^{\pi/6}\sec x\,dx=U\left(\tfrac\pi6\right)-U(0)$.
    steps:
    - {id: 2-21a, content: '$L\left(\tfrac\pi6\right)=\ln\sqrt3$, $e^{L(\pi/6)}=\sqrt3$', criteria: ['2-2(1).M1', '2-2(1).A1']}
    hint_ladder:
    - $f'(x)$를 구간별로 구하고 $1+\tan^2$을 정리하자.
    - 2-1의 $U$가 $\sec x$의 부정적분이다.
  - id: S2-21-B
    audience: B
    source_flow: rep2026.pdf p.115(인쇄 111)
    method_no: 1
    steps:
    - id: 2-21b-1
      content: |
        $f'(x)=\begin{cases}-\tan x&\left(-\frac\pi2<x<\frac\pi6\right)\\-\frac1{\sqrt3}&\left(x=\frac\pi6\right)\\-\tan\left(\frac\pi3-x\right)&\left(\frac\pi6<x<\frac\pi2\right)\end{cases}$이므로 $f'(x)$는 열린구간 $\left(-\frac\pi2,\frac\pi2\right)$에서 연속이다.
      criteria: ['2-2(1).M1']
    - id: 2-21b-2
      content: |
        제시문 (나)로부터 $x=\dfrac\pi6$에서 $x=\dfrac\pi3$까지의 곡선 $y=f(x)$의 길이는 $\displaystyle\int_{\frac\pi6}^{\frac\pi3}\sqrt{1+\{f'(x)\}^2}\,dx=\int_{\frac\pi6}^{\frac\pi3}\sec\left(\dfrac\pi3-x\right)dx=\int_0^{\frac\pi6}\sec x\,dx=[U(x)]_0^{\frac\pi6}=\ln\sqrt3$.
      criteria: ['2-2(1).M1']
    - id: 2-21b-3
      content: |
        따라서 $e^{L\left(\frac\pi6\right)}=e^{\ln\sqrt3}=\sqrt3$.
      criteria: ['2-2(1).A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2(1).M1
      mark_type: M
      points: 5
      evidence: |
        $L\left(\dfrac\pi6\right)=\ln\sqrt3$까지 구했다(공식: $L\left(\frac\pi6\right)$까지만 구했다면 부분점수 5점만).
      depends_on: []
      implied_ok: true
      steps: [2-21b-1, 2-21b-2]
    - id: 2-2(1).A1
      mark_type: A
      points: 5
      evidence: |
        답 $\sqrt3$을 올바르게 계산했다(공식: 답을 올바르게 계산한 경우 10점 = M1 + A1).
      depends_on: ['2-2(1).M1']
      cao: true
      steps: [2-21b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42609}
  misconceptions:
  - id: MC-CAL-42609
    outcome_code: '71'
    wrong_work: '$\tfrac\pi6\le x\le\tfrac\pi3$에서도 $f\prime(x)=-\tan x$로 놓고 $\int_{\pi/6}^{\pi/3}\sec x\,dx$를 계산'
    detect_cue: 결과에 $\ln(2+\sqrt3)-\ln\sqrt3$ 등
    feedback: $x\ge\tfrac\pi6$에서는 둘째 식 $-\ln\cos\left(\tfrac\pi3-x\right)$를 미분해야 합니다.
    remedy: [RL-2]

- id: '2-2(2)'
  stem: |
    (2) 함수 $e^{c(t)}$의 최댓값과 최솟값을 구하시오. (25점)
  points: 25
  depends_on: ['2-2(1)']
  answer: {kind: expression, value: '(2/sqrt(3)*exp(pi/(6*sqrt(3))), 1)', equivalents: ['최댓값 (2/sqrt(3))e^(pi/(6sqrt(3))), 최솟값 1'], tolerance: null}
  solutions:
  - id: S2-22-A
    audience: A
    method_no: 1
    key_idea: |
      접선의 $y$절편 $c(t)=f(t)-tf'(t)$, $c'(t)=-tf''(t)$의 부호로 $t=\tfrac\pi6$에서 최대, 끝점에서 최소.
    steps:
    - {id: 2-22a, content: '$c(0)=\ln\tfrac43$, $c\left(\tfrac\pi3\right)=0$, $c\left(\tfrac\pi6\right)=\ln\tfrac2{\sqrt3}+\tfrac\pi{6\sqrt3}$', criteria: ['2-2(2).M1', '2-2(2).A1', '2-2(2).A2']}
    hint_ladder:
    - 접선 $y=f'(t)(x-t)+f(t)$의 $y$절편은?
    - $c'(t)$를 계산하고 $f''$의 부호를 보자.
  - id: S2-22-B
    audience: B
    source_flow: rep2026.pdf p.115(인쇄 111)
    method_no: 1
    steps:
    - id: 2-22b-1
      content: |
        (1)로부터 $f(x)$, $f'(x)$는 열린구간 $\left(-\frac\pi2,\frac\pi2\right)$에서 연속. 점 $(t,f(t))$에서 $y=f(x)$에 접하는 직선의 방정식은 $y=f'(t)(x-t)+f(t)$이므로 $c(t)=f(t)-tf'(t)$. $c(t)$는 닫힌구간 $\left[0,\frac\pi3\right]$에서 연속.
      criteria: ['2-2(2).M1']
    - id: 2-22b-2
      content: |
        $t$에서 $f$가 두 번 미분가능할 때 $c'(t)=-tf''(t)=\begin{cases}t\sec^2t&\left(0<t<\frac\pi6\right)\\-t\sec^2\left(\frac\pi3-t\right)&\left(\frac\pi6<t<\frac\pi3\right)\end{cases}$이므로 $c'(t)$는 열린구간 $\left(0,\frac\pi6\right)$에서 양수, 열린구간 $\left(\frac\pi6,\frac\pi3\right)$에서 음수.
      criteria: ['2-2(2).M1']
    - id: 2-22b-3
      content: |
        그러므로 모든 $0<t<\frac\pi6$에 대해 $c(0)<c(t)<c\left(\frac\pi6\right)$, 모든 $\frac\pi6<t<\frac\pi3$에 대하여 $c\left(\frac\pi6\right)>c(t)>c\left(\frac\pi3\right)$이고, $c(t)$는 $t=\frac\pi6$에서 최대, $t=0$이나 $t=\frac\pi3$에서 최소. $c(0)=\ln\frac43$, $c\left(\frac\pi3\right)=0$, $c\left(\frac\pi6\right)=\ln\frac2{\sqrt3}+\frac\pi{6\sqrt3}$이므로
      criteria: ['2-2(2).A1', '2-2(2).A2']
    - id: 2-22b-4
      content: |
        $e^{c(t)}$의 최솟값 $1$, 최댓값 $\dfrac2{\sqrt3}e^{\frac\pi{6\sqrt3}}$.
      criteria: ['2-2(2).A1', '2-2(2).A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2(2).M1
      mark_type: M
      points: 5
      evidence: |
        $c'(t)$를 올바르게 계산했다($f$의 개형만 언급했다면 점수를 부여하지 않음).
      depends_on: []
      implied_ok: false
      steps: [2-22b-1, 2-22b-2]
    - id: 2-2(2).A1
      mark_type: A
      points: 10
      evidence: |
        최솟값 $1$을 올바르게 계산했다(exp를 취하지 않았다면 부분점수 5점).
      depends_on: ['2-2(2).M1']
      steps: [2-22b-3, 2-22b-4]
    - id: 2-2(2).A2
      mark_type: A
      points: 10
      evidence: |
        최댓값 $\dfrac2{\sqrt3}e^{\frac\pi{6\sqrt3}}$을 올바르게 계산했다(exp를 취하지 않았다면 부분점수 5점).
      depends_on: ['2-2(2).M1']
      steps: [2-22b-3, 2-22b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42610}
  misconceptions:
  - id: MC-CAL-42610
    outcome_code: '71'
    wrong_work: '$c(t)$의 최댓값 $\ln\tfrac2{\sqrt3}+\tfrac\pi{6\sqrt3}$, 최솟값 $0$을 그대로 답으로 씀'
    detect_cue: 최솟값 $0$
    feedback: 묻는 것은 $e^{c(t)}$입니다. $e^x$는 증가함수이므로 같은 $t$에서 최대·최소이고 값은 지수를 취해야 합니다.
    remedy: [RL-3]

- id: '2-2(3)'
  stem: |
    (3) $0<t<\dfrac\pi3$이고 $t\ne\dfrac\pi6$일 때, 함수 $\dfrac{a'(t)}{b'(t)}$를 구하시오. (40점)
  points: 40
  depends_on: ['2-2(2)']
  answer: {kind: expression, value: 'Piecewise((tan(t), t < pi/6), (tan(pi/3 - t), True))', equivalents: ['-f''(t)'], tolerance: null}
  solutions:
  - id: S2-23-A
    audience: A
    method_no: 1
    key_idea: |
      $(a,b)=(t,f(t))+\dfrac{L(t)}{\sqrt{1+f'^2}}(1,f'(t))$, $L'=-\sqrt{1+f'^2}$이면 $a'=-\dfrac{Lf'f''}{(\sqrt{1+f'^2})^3}$, $b'=\dfrac{Lf''}{(\sqrt{1+f'^2})^3}$.
    steps:
    - {id: 2-23a, content: '$\dfrac{a\prime}{b\prime}=-f\prime(t)$: $\tan t$ $\left(0<t<\tfrac\pi6\right)$, $\tan\left(\tfrac\pi3-t\right)$ $\left(\tfrac\pi6<t<\tfrac\pi3\right)$', criteria: ['2-2(3).M1', '2-2(3).A1']}
    hint_ladder:
    - 접선의 방향의 단위벡터 대신 $\dfrac{1}{\sqrt{1+f'^2}}$, $\dfrac{f'}{\sqrt{1+f'^2}}$을 써 보자.
    - $L(t)=\int_t^{\pi/3}\cdots$이므로 $L'(t)$는?
  - id: S2-23-B
    audience: B
    source_flow: rep2026.pdf p.115(인쇄 111)
    method_no: 1
    steps:
    - id: 2-23b-1
      content: |
        $b(t)-f(t)=f'(t)\{a(t)-t\}$, $\sqrt{\{a(t)-t\}^2+\{b(t)-f(t)\}^2}=L(t)$이므로 ($a(t)\ge t$)
        $a(t)=t+\dfrac{L(t)}{\sqrt{1+\{f'(t)\}^2}}$, $b(t)=f(t)+\dfrac{L(t)f'(t)}{\sqrt{1+\{f'(t)\}^2}}$이고, $L(t)=\displaystyle\int_t^{\frac\pi3}\sqrt{1+\{f'(x)\}^2}\,dx$로부터 $L'(t)=-\sqrt{1+\{f'(t)\}^2}$.
      criteria: ['2-2(3).M1']
    - id: 2-23b-2
      content: |
        따라서 $f''(t)$가 존재하는 $t$에서
        $a'(t)=1+\left[1+\{f'(t)\}^2\right]^{-\frac32}\left[L'(t)\{1+\{f'(t)\}^2\}-L(t)f'(t)f''(t)\right]=-\dfrac{L(t)f'(t)f''(t)}{\left[\sqrt{1+\{f'(t)\}^2}\right]^3}$,
        $b'(t)=f'(t)+\left[1+\{f'(t)\}^2\right]^{-\frac32}\left[L'(t)f'(t)\{1+\{f'(t)\}^2\}+L(t)f''(t)\{1+\{f'(t)\}^2\}-L(t)\{f'(t)\}^2f''(t)\right]=\dfrac{L(t)f''(t)}{\left[\sqrt{1+\{f'(t)\}^2}\right]^3}$.
      criteria: ['2-2(3).A1']
    - id: 2-23b-3
      content: |
        따라서 $\dfrac{a'(t)}{b'(t)}=-f'(t)=\begin{cases}\tan t&\left(0<t<\frac\pi6\right)\\\tan\left(\frac\pi3-t\right)&\left(\frac\pi6<t<\frac\pi3\right)\end{cases}$.
      criteria: ['2-2(3).A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2(3).M1
      mark_type: M
      points: 10
      evidence: |
        $a(t)=t+\dfrac{L(t)}{\sqrt{1+\{f'(t)\}^2}}$, $b(t)=f(t)+\dfrac{L(t)f'(t)}{\sqrt{1+\{f'(t)\}^2}}$ 중 1개 이상을 썼다.
      depends_on: []
      implied_ok: false
      steps: [2-23b-1]
    - id: 2-2(3).A1
      mark_type: A
      points: 30
      evidence: |
        $\dfrac{a'(t)}{b'(t)}=-f'(t)$를 올바르게 계산했다(단, $t=\dfrac\pi6$에서의 값을 썼으면 부분점수 20점).
      depends_on: ['2-2(3).M1']
      steps: [2-23b-2, 2-23b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42611}
  misconceptions:
  - id: MC-CAL-42611
    outcome_code: '71'
    wrong_work: '$a(t)=t-\dfrac{L}{\sqrt{1+f\prime^2}}$로 방향을 반대로 잡거나, $L(t)$를 상수로 보고 $L\prime(t)$ 항을 빠뜨림'
    detect_cue: $a'$에 $L'$ 항이 없음, 또는 $a(t)<t$
    feedback: 조건 $a(t)\ge t$로 방향이 정해지고, $L(t)$는 아래끝이 $t$인 정적분이라 $L'(t)=-\sqrt{1+f'(t)^2}$입니다.
    remedy: [RL-4]

- id: '2-2(4)'
  stem: |
    (4) 닫힌구간 $\left[0,\dfrac\pi3\right]$에서 정의된 함수 $Q(t)=\{a(t)\}^2+\{b(t)\}^2$는 $t=p$와 $t=q$에서 각각 최댓값과 최솟값을 가진다.
    $e^{a(p)}+e^{b(p)}+q$의 값을 구하시오. (45점)
  points: 45
  depends_on: ['2-2(2)', '2-2(3)']
  answer: {kind: value, value: '13/3 + pi/6', equivalents: [], tolerance: null}
  solutions:
  - id: S2-24-A
    audience: A
    method_no: 1
    key_idea: |
      $Q'(t)=2b'(t)c(t)$이고 $c>0$, $b'$의 부호는 $f''$의 부호; $t=\tfrac\pi6$에서 최소, 끝점 비교는 $Q(0)\ge L(0)^2\ge\left(\tfrac\pi3\right)^2=Q\left(\tfrac\pi3\right)$.
    steps:
    - {id: 2-24a, content: '$p=0$, $q=\tfrac\pi6$, $a(0)=\ln3$, $b(0)=\ln\tfrac43$, 값 $\tfrac{13}3+\tfrac\pi6$', criteria: ['2-2(4).R1', '2-2(4).R2', '2-2(4).A1']}
    hint_ladder:
    - $Q'(t)=2(aa'+bb')$에 (3)의 관계 $a'=-f'b'$를 넣어 보자.
    - $Q(0)$과 $Q(\tfrac\pi3)$ 중 어느 것이 큰가? $L(0)$과 $\tfrac\pi3$을 비교하자.
  - id: S2-24-B
    audience: B
    source_flow: rep2026.pdf p.116(인쇄 112)
    method_no: 1
    steps:
    - id: 2-24b-1
      content: |
        (3)으로부터 $a(t)$, $b(t)$가 연속함수이므로 $Q(t)$도 연속함수이고, $t\ne\frac\pi6$일 때
        $Q'(t)=2(a(t)a'(t)+b(t)b'(t))=2b'(t)(b(t)-a(t)f'(t))=2b'(t)(f(t)-tf'(t))=2b'(t)c(t)$.
      criteria: ['2-2(4).R1']
    - id: 2-24b-2
      content: |
        (2)로부터 $0<t<\frac\pi3$일 때 $c(t)>0$, $f''(t)=\begin{cases}-\sec^2t&\left(0<t<\frac\pi6\right)\\\sec^2\left(\frac\pi3-t\right)&\left(\frac\pi6<t<\frac\pi3\right)\end{cases}$이므로 $Q'(t)=2b'(t)c(t)=\dfrac{2L(t)f''(t)c(t)}{\left[\sqrt{1+\{f'(t)\}^2}\right]^3}$는 열린구간 $\left(0,\frac\pi6\right)$에서 음수, 열린구간 $\left(\frac\pi6,\frac\pi3\right)$에서 양수. 그러므로 $Q(t)$는 $t=\frac\pi6$에서 최소, $t=0$ 또는 $t=\frac\pi3$에서 최대.
      criteria: ['2-2(4).R1']
    - id: 2-24b-3
      content: |
        $L\left(\frac\pi3\right)=f\left(\frac\pi3\right)=0$이므로 $Q\left(\frac\pi3\right)=\left\{a\left(\frac\pi3\right)\right\}^2+\left\{b\left(\frac\pi3\right)\right\}^2=\left(\frac\pi3\right)^2$이고, $f$가 $x=\frac\pi6$ 기준 대칭이므로 $L(0)=2L\left(\frac\pi6\right)=\ln3$, $f'(0)=0$이므로 $Q(0)=\{a(0)\}^2+\{b(0)\}^2=\{L(0)\}^2+\{f(0)\}^2=(\ln3)^2+\left(2\ln\frac2{\sqrt3}\right)^2$. 제시문 (라)에서 $L(0)=\displaystyle\int_0^{\frac\pi3}\sqrt{1+\{f'(x)\}^2}\,dx\ge\int_0^{\frac\pi3}1\,dx=\frac\pi3$이므로 $Q(0)>Q\left(\frac\pi3\right)$.
      criteria: ['2-2(4).R2']
    - id: 2-24b-4
      content: |
        그러므로 $p=0$, $q=\dfrac\pi6$, $e^{a(0)}+e^{b(0)}+q=e^{\ln3}+e^{\ln\frac43}+\dfrac\pi6=\dfrac{13}3+\dfrac\pi6$.
      criteria: ['2-2(4).A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2(4).R1
      mark_type: R
      points: 15
      evidence: |
        $Q'(t)$가 열린구간 $\left(0,\dfrac\pi6\right)$에서 음수, 열린구간 $\left(\dfrac\pi6,\dfrac\pi3\right)$에서 양수임을 관찰했다.
      depends_on: []
      steps: [2-24b-1, 2-24b-2]
    - id: 2-2(4).R2
      mark_type: R
      points: 15
      evidence: $L(0)\ge\dfrac\pi3$을 관찰했다.
      depends_on: []
      steps: [2-24b-3]
    - id: 2-2(4).A1
      mark_type: A
      points: 15
      evidence: |
        $e^{a(p)}+e^{b(p)}+q=\dfrac{13}3+\dfrac\pi6$을 올바르게 계산했다.
      depends_on: ['2-2(4).R1', '2-2(4).R2']
      cao: true
      steps: [2-24b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42612}
  misconceptions:
  - id: MC-CAL-42612
    outcome_code: '71'
    wrong_work: '끝점 비교 없이 $p=\tfrac\pi3$으로 놓아 $e^{\pi/3}+1+\tfrac\pi6$으로 답함'
    detect_cue: $p=\tfrac\pi3$, $L(0)$과 $\tfrac\pi3$의 비교가 없음
    feedback: 양 끝점 $Q(0)$, $Q\left(\tfrac\pi3\right)$을 직접 비교해야 합니다. 곡선의 길이는 $x$축 방향 길이 이상입니다(제시문 (라)).
    remedy: [RL-5]

