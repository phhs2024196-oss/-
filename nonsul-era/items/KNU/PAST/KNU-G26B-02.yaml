intent: |
  합성함수의 미분법으로 도함수를 구하고(2-1), 정적분으로 곡선의 길이를 구하며(2-2(1)), 도함수로 함수의 최댓값·최솟값을 구하고(2-2(2), (4)), 곱의 미분법과 몫의 미분법으로 도함수를 구할 수 있는지(2-2(3)) 평가한다.
key_idea: |
  $U'(x)=\sec x$이므로 $\{U'(x)\}^2-1=\tan^2x$. $f'(x)=-\tan x$ 또는 $-\tan\left(\tfrac\pi3-x\right)$이고 $\sqrt{1+\{f'\}^2}=\sec$로 길이가 $U$의 차가 된다. 접선 위에서 접점으로부터 거리 $L(t)$인 점 $(a(t),b(t))$를 쓰면 $\dfrac{a'}{b'}=-f'(t)$, $Q'(t)=2b'(t)c(t)$.
stuck: |
  $(a(t),b(t))$를 접선의 방향벡터 없이 $a(t)=t+\dfrac{L}{\sqrt{1+f'^2}}$, $b(t)=f(t)+\dfrac{Lf'}{\sqrt{1+f'^2}}$로 쓰고 $L'(t)=-\sqrt{1+f'^2}$를 이용해 $a'$, $b'$를 정리하는 단계, 그리고 $Q'(t)=2b'(t)c(t)$로 부호를 판정하는 단계
