intent: |
  치환적분으로 적분 변수를 바꾸어 등식을 증명하고(1-1), 적분으로 정의된 함수의 등식에 특정값을 대입하고 양변을 미분하여 미지수를 결정할 수 있는지(1-2) 평가한다.
key_idea: |
  $x-t=u$로 치환하면 좌변이 $\int_1^xf(t)(x^2-tx)dt=x^2\int_1^xf-x\int_1^xtf$가 된다. $x=1$ 대입으로 $\sin a+\cos b+\sqrt2=0$, 미분 후 $x=1$ 대입으로 $a\cos a-b\sin b=0$, $a+b=-\frac32\pi$에서 $\cos b=\sin a$, $\sin b=\cos a$.
stuck: |
  적분 안의 $x$를 밖으로 꺼낸 뒤 곱의 미분으로 양변을 미분하는 단계
