intent: |
  접선의 방정식으로 접점의 좌표를 수열로 나타내고(2-1), 부분적분으로 곡선과 $x$축 사이의 넓이를 구하며(2-2), 정적분의 구간 합 성질을 이용하여 넓이의 합을 하나의 정적분으로 정리하고 수열의 합을 계산할 수 있는지(2-3) 평가한다.
key_idea: |
  접선의 $y$절편이 $a_n=-x_n$이므로 $x_n=r^{n-1}$. $x\ln x+\frac x2$의 부정적분이 $\frac12x^2\ln x$이므로 $A_n=\frac12\{nr^2-(n-1)\}r^{2n-2}\ln r$이고, $\sum_{n=m}^{20}A_n=\int_{r^{m-1}}^{r^{20}}$으로 합쳐져 $B_m=10r^{40}-\frac{m-1}{2}r^{2m-2}$.
stuck: |
  $\int\left(x\ln x+\frac x2\right)dx=\frac12x^2\ln x$로 깔끔하게 정리됨을 알아채는 단계(부분적분)
