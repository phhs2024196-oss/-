intent: |
  이차방정식의 판별식과 근과 계수의 관계를 확률변수의 사건으로 해석하여 이산확률변수의 기댓값(3-1)과 조건부확률(3-2)을 구하고, 순서쌍의 개수를 자연수의 거듭제곱의 합으로 세어 확률의 극한을 구할 수 있는지(3-3) 평가한다.
key_idea: |
  실근의 개수는 판별식 $P^2-Q$의 부호로, 두 근의 차 $>4$는 $4P^2-4Q>16$으로, 최솟값 $-P^2+Q>n$은 $Q>P^2+n$으로 바꾸어 순서쌍 $(P,Q)$를 센다. 3-3의 개수는 $\sum_{k=1}^{n-1}(n^2-n-k^2)$.
stuck: |
  3-3에서 $P=k$마다 가능한 $Q$의 개수 $n^2-n-k^2$와 $k$의 범위($k\le n-1$)를 정하는 단계
