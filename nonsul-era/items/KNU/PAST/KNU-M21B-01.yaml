intent: |
  두 곡선의 교점을 등차수열로 나타내고(1-1), 정적분과 급수의 합 사이의 관계 및 극한의 대소 관계를 이용해 조화급수형 합의 증가 속도를 구하며(1-2), 정적분의 부등식으로 넓이 합의 극한을 구할 수 있는지(1-3) 평가한다.
key_idea: |
  $\sin x=\cos x$에서 $a_n=\frac{\pi}{4}+(n-1)\pi$. $\sum\frac{1}{a_k}$을 $\frac1\pi\int\frac{dx}{x-\frac34}$로 위·아래에서 끼우면 $\sim\frac{\ln n}{\pi}$. 각 구간에서 $\frac1x$을 $\frac{1}{a_{n+1}}$과 $\frac{1}{a_n}$ 사이로 끼우고 $\left|\int_{a_n}^{a_{n+1}}(\sin x-\cos x)dx\right|=2\sqrt2$.
stuck: |
  1-2에서 합을 적분으로 위·아래 양쪽에서 끼우는 구간 설정(하한 $\int_2^{n+1}$, 상한 $\int_1^n$)
