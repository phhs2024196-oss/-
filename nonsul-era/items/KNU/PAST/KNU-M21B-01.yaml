stimuli:
- label: (가)
  body: |
    두 함수 $f(x),g(x)$가 닫힌구간 $[a,b]$에서 연속일 때,

    (1) $\displaystyle\int_a^bkf(x)\,dx=k\int_a^bf(x)\,dx$ (단, $k$는 상수)

    (2) $\displaystyle\int_a^b\{f(x)\pm g(x)\}\,dx=\int_a^bf(x)\,dx\pm\int_a^bg(x)\,dx$

    (3) $\displaystyle\int_a^bf(x)\,dx=-\int_b^af(x)\,dx$

    (4) 실수 $c$가 닫힌구간 $[a,b]$에 포함될 때, $\displaystyle\int_a^cf(x)\,dx+\int_c^bf(x)\,dx=\int_a^bf(x)\,dx$

    이다.
- label: (나)
  body: |
    정적분과 급수의 합 사이의 관계

    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때,

    $$\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\varDelta x=\int_a^bf(x)\,dx$$

    (단, $\varDelta x=\dfrac{b-a}{n}$, $x_k=a+k\varDelta x$)
- label: (다)
  body: |
    $\displaystyle\int\frac{f^{\prime}(x)}{f(x)}dx$ 꼴의 부정적분

    $$\int\frac{f^{\prime}(x)}{f(x)}dx=\ln|f(x)|+C\quad(\text{단, }C\text{는 적분상수})$$
- label: (라)
  body: |
    수열의 극한의 대소 관계

    두 수열 $\{a_n\}$, $\{b_n\}$이 각각 수렴하고 $\displaystyle\lim_{n\to\infty}a_n=\alpha$, $\displaystyle\lim_{n\to\infty}b_n=\beta$일 때,

    (1) 모든 자연수 $n$에 대하여 $a_n\le b_n$이면 $\alpha\le\beta$이다.

    (2) 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $\alpha=\beta$이면 $\displaystyle\lim_{n\to\infty}c_n=\alpha$이다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  두 함수 $f(x)=\dfrac{\sin x}{x}$, $g(x)=\dfrac{\cos x}{x}$에 대하여 $f(x)=g(x)$를 만족시키는 모든 양의 실수 $x$의 값을 작은 수부터 크기순으로 나열하여 $a_1,a_2,a_3,\cdots$이라 하자. 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【1-1】 $a_{10}-a_2$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: value, value: '8*pi', equivalents: ['8π'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\tan x=1$.
    steps:
    - {id: 1a, content: '$a_n=\frac{\pi}{4}+(n-1)\pi$, $a_{10}-a_2=8\pi$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 양변에 $x$를 곱하면?
  - id: S1-B
    audience: B
    source_flow: M21_N2.pdf p.5
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=g(x)\Rightarrow\sin x=\cos x$이므로 $\tan x=1$이다. 이때 $x=\dfrac{\pi}{4},\dfrac54\pi,\dfrac94\pi,\cdots$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        즉 공차를 $\pi$로 갖고 첫째항이 $\dfrac{\pi}{4}$인 등차수열 $a_n=\dfrac{\pi}{4}+(n-1)\pi$(단, $n$은 자연수이다)에서 두 함수 $f(x)$와 $g(x)$의 그래프는 서로 만난다. 따라서 $a_{10}-a_2=8\pi$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        $x=\dfrac{\pi}{4},\dfrac54\pi,\dfrac94\pi,\cdots$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $a_n=\dfrac{\pi}{4}+(n-1)\pi$를 구하고 $a_{10}-a_2=8\pi$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42102}
  misconceptions:
  - id: MC-ALG-42102
    outcome_code: '71'
    wrong_work: '$\tan x=1$의 해의 주기를 $2\pi$로 보아 $a_{10}-a_2=16\pi$'
    detect_cue: 답이 $16\pi$이다
    feedback: 탄젠트 함수의 주기는 $\pi$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    【1-2】 $\displaystyle\lim_{n\to\infty}\frac{1}{\ln n}\sum_{k=1}^{n}\frac{1}{a_k}$의 값을 구하시오. (40점)
  points: 40
  depends_on: ['1']
  answer: {kind: value, value: '1/pi', equivalents: ['1/π'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\frac{1}{a_k}=\frac1\pi\cdot\frac{1}{k-\frac34}$을 적분으로 위·아래에서 끼운다.
    steps:
    - {id: 2a, content: '$\frac1\pi\left(\ln\left(n+\frac14\right)-\ln\frac54+4\right)\le\sum\frac1{a_k}\le\frac1\pi\left(\ln\left(n-\frac34\right)-\ln\frac14+4\right)$ → $\frac1\pi$', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - $\frac{1}{x-\frac34}$은 감소함수이다. 직사각형 넓이와 적분을 비교하자.
  - id: S2-B
    audience: B
    source_flow: M21_N2.pdf p.5
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a_n=\dfrac{\pi}{4}+(n-1)\pi$이므로 $\displaystyle\sum_{k=1}^{n}\frac{1}{a_k}=\frac{1}{a_1}+\frac1\pi\sum_{k=2}^{n}\frac{1}{k-\frac34}$이다. 따라서 $\displaystyle\frac4\pi+\frac1\pi\int_2^{n+1}\frac{1}{x-\frac34}dx\le\frac{1}{a_1}+\sum_{k=2}^{n}\frac{1}{a_k}=\frac{1}{a_1}+\frac1\pi\sum_{k=2}^{n}\frac{1}{k-\frac34}\le\frac{1}{a_1}+\frac1\pi\int_1^n\frac{1}{x-\frac34}dx$인 것을 알 수 있다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        로그함수의 적분법에 의해 $\displaystyle\frac{1}{a_1}+\frac1\pi\int_1^n\frac{1}{x-\frac34}dx=\frac1\pi\left(\ln\left(n-\frac34\right)-\ln\frac14+4\right)$, $\displaystyle\frac4\pi+\frac1\pi\int_2^{n+1}\frac{1}{x-\frac34}dx=\frac1\pi\left(\ln\left(n+\frac14\right)-\ln\frac54+4\right)$임을 알 수 있다.
      criteria: [2.M2]
    # 원문 그대로(마지막 식의 $\ln\frac14$는 위·아래 어느 쪽이든 극한값 같음)
    - id: 2b-3
      content: |
        즉 $\dfrac1\pi\left(\ln\left(n+\dfrac14\right)-\ln\dfrac54+4\right)\le\displaystyle\sum_{k=1}^{n}\frac{1}{a_k}\le\frac1\pi\left(\ln\left(n-\frac34\right)-\ln\frac14+4\right)$이고 $\displaystyle\frac1\pi\lim_{n\to\infty}\frac{1}{\ln n}\left(\ln\left(n+\frac14\right)-\ln\frac14+4\right)=\frac1\pi$이므로 답은 $\dfrac1\pi$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        $\displaystyle\frac4\pi+\frac1\pi\int_2^{n+1}\frac{dx}{x-\frac34}\le\frac{1}{a_1}+\sum_{k=2}^{n}\frac{1}{a_k}=\frac{1}{a_1}+\frac1\pi\sum_{k=2}^{n}\frac{1}{k-\frac34}\le\frac{1}{a_1}+\frac1\pi\int_1^n\frac{dx}{x-\frac34}$임을 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 15}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        두 적분 경계를 로그로 계산했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        극한값 $\dfrac1\pi$를 구했다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42119}
  misconceptions:
  - id: MC-CAL-42119
    outcome_code: '71'
    wrong_work: '$\sum\frac{1}{a_k}$을 구분구적법 $\int_0^1$ 형태로 바꾸려다 $\frac1n$ 인수가 없어 실패하거나 극한을 $0$으로 답함'
    detect_cue: 정적분 구간이 $[0,1]$이거나 답이 $0$이다
    feedback: 이 합은 발산하므로 구분구적법이 아니라 감소함수의 합과 적분을 위·아래로 비교해 증가 속도($\ln n$)를 구합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    【1-3】 자연수 $n$에 대하여

    $$A_n=\left|\int_{a_n}^{a_{n+1}}\{f(x)-g(x)\}\,dx\right|$$

    라 할 때, $\displaystyle\lim_{n\to\infty}\frac{1}{\ln n}\sum_{k=1}^{n}A_k$의 값을 구하시오. (50점)
  points: 50
  depends_on: ['2']
  answer: {kind: value, value: '2*sqrt(2)/pi', equivalents: ['2√2/π'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 구간마다 $\frac{1}{a_{k+1}}\cdot2\sqrt2\le A_k\le\frac{1}{a_k}\cdot2\sqrt2$, 1-2로 양쪽 극한 $\frac{2\sqrt2}{\pi}$.
    steps:
    - {id: 3a, content: '$2\sqrt2\sum\frac{1}{a_{k+1}}\le\sum A_k\le2\sqrt2\sum\frac{1}{a_k}$ → $\frac{2\sqrt2}{\pi}$', criteria: [3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - 구간 $[a_k,a_{k+1}]$에서 $\sin x-\cos x$의 부호는 일정하다.
  - id: S3-B
    audience: B
    source_flow: M21_N2.pdf p.5
    method_no: 1
    steps:
    # [공식해설 확인필요] 원문은 부호를 따지지 않았음. $n$이 짝수인 구간에서는 $\sin x-\cos x\le0$이므로 절댓값을 취한 형태($A_n$ 기준)로 읽어야 성립
    - id: 3b-1
      content: |
        $\displaystyle\int_{a_n}^{a_{n+1}}\frac{\sin x-\cos x}{a_{n+1}}dx\le\int_{a_n}^{a_{n+1}}\frac{\sin x-\cos x}{x}dx\le\int_{a_n}^{a_{n+1}}\frac{\sin x-\cos x}{a_n}dx$이고
      criteria: [3.M1]
    # [공식해설 확인필요] 실제로는 $(-1)^{n+1}2\sqrt2$(절댓값 $2\sqrt2$)
    - id: 3b-2
      content: |
        $\displaystyle\int_{a_n}^{a_{n+1}}(\sin x-\cos x)\,dx=2\sqrt2$이므로
      criteria: [3.M2]
    - id: 3b-3
      content: |
        $\displaystyle 2\sqrt2\lim_{n\to\infty}\frac{1}{\ln n}\sum_{k=1}^{n}\frac{1}{a_{k+1}}\le\lim_{n\to\infty}\frac{1}{\ln n}\sum_{k=1}^{n}A_k\le2\sqrt2\lim_{n\to\infty}\frac{1}{\ln n}\sum_{k=1}^{n}\frac{1}{a_k}$이다. 【1-2】에 의해 답은 $\dfrac{2\sqrt2}{\pi}$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $\displaystyle\int_{a_n}^{a_{n+1}}\frac{\sin x-\cos x}{a_{n+1}}dx\le\int_{a_n}^{a_{n+1}}\frac1x(\sin x-\cos x)dx\le\int_{a_n}^{a_{n+1}}\frac{\sin x-\cos x}{a_n}dx$임을 안다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 10
      evidence: |
        $\displaystyle\int_{a_n}^{a_{n+1}}(\sin x-\cos x)dx=2\sqrt2$임을 구했다(절댓값).
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        양쪽 극한 부등식을 알고 답 $\dfrac{2\sqrt2}{\pi}$를 구했다.
      depends_on: [3.M1, 3.M2]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42120}
  misconceptions:
  - id: MC-CAL-42120
    outcome_code: '71'
    wrong_work: '절댓값을 무시하고 $\sum\int$을 하나의 적분 $\int_{a_1}^{a_{n+1}}\frac{\sin x-\cos x}{x}dx$로 합쳐 극한을 $0$으로 답함'
    detect_cue: 답이 $0$이다
    feedback: $A_k$는 각 구간 적분의 절댓값이라 부호가 번갈아 상쇄되지 않습니다. 구간별로 $\frac1x$을 끼워 넣으세요.
    remedy: [RL-3]

