intent: |
  극값 조건으로 삼차함수를 결정하고(2-1), 두 곡선 사이 영역의 격자점 개수를 세로선별로 세어 자연수 거듭제곱의 합으로 나타내며(2-2(1)), 격자점 개수와 넓이의 비가 수렴함을 극한의 대소 관계로 증명할 수 있는지(2-2(2)) 평가한다.
key_idea: |
  $f^{\prime}(x)=3a(x+m)(x-m)$이므로 $b=0$, $c=-3am^2$, $f(m)=m^3+n$에서 $a=-\frac12$. $f(x)-(mx^2+n)=-\frac12x(x+3m)(x-m)\ge0$ ($0\le x\le m$). 세로선 $x=i$ 위의 격자점 수 $L_i$는 두 곡선 사이 길이 $+1$(정수일 때)로, 합을 $\sum i,\sum i^2,\sum i^3$로 계산; 일반 $m$에서는 $L_i$를 길이와 길이$+1$ 사이로 끼워 $\frac{B_m}{A_m}\to1$.
stuck: |
  2-2(1)에서 $m$이 홀수일 때 $f(i)$가 항상 정수임($i$의 홀짝에 따라)을 보이는 단계
