stimuli:
- label: (가)
  body: |
    미분가능한 함수 $f(x)$가 $x=a$에서 극값을 가지면

    $$f^{\prime}(a)=0$$

    이다.
- label: (나)
  body: |
    (1) $\displaystyle\sum_{k=1}^{n}k=\frac{n(n+1)}{2}$

    (2) $\displaystyle\sum_{k=1}^{n}k^2=\frac{n(n+1)(2n+1)}{6}$

    (3) $\displaystyle\sum_{k=1}^{n}k^3=\left\{\frac{n(n+1)}{2}\right\}^2$
- label: (다)
  body: |
    두 곡선 사이의 넓이

    두 함수 $y=f(x)$와 $y=g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$와 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는

    $$S=\int_a^b|f(x)-g(x)|\,dx$$

    이다.
- label: (라)
  body: |
    수열의 극한값의 대소 관계

    두 수열 $\{a_n\}$, $\{b_n\}$이 수렴하고 $\displaystyle\lim_{n\to\infty}a_n=\alpha$, $\displaystyle\lim_{n\to\infty}b_n=\beta$일 때, 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $\alpha=\beta$이면 $\{c_n\}$은 수렴하고

    $$\lim_{n\to\infty}c_n=\alpha$$

    이다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  삼차함수 $f(x)=ax^3+bx^2+cx+n$은 다음 조건을 만족시킨다. (단, $n$은 정수)

  함수 $f(x)$는 $x=m$에서 극댓값 $m^3+n$을 갖고, $x=-m$에서 극솟값을 갖는다. (단, $m$은 자연수)

  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【2-1】 $\dfrac{4ac}{m^2}$의 값을 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: value, value: '-3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 도함수의 두 근이 $\pm m$.
    steps:
    - {id: 1a, content: '$b=0$, $c=-3am^2$, $-2am^3=m^3\Rightarrow a=-\frac12$, $\frac{4ac}{m^2}=-3$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $f^{\prime}(x)$는 $x=\pm m$을 근으로 갖는 이차식이다.
  - id: S1-B
    audience: B
    source_flow: M21_N2.pdf p.7
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 조건과 제시문 (가)를 이용하면 $f^{\prime}(x)=3ax^2+2bx+c=3a(x+m)(x-m)=3ax^2-3am^2$이다. 좌변과 우변의 계수를 비교하면 $b=0$, $c=-3am^2$이므로 $f(x)=ax^3-3am^2x+n$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        주어진 조건을 이용하면 $f(m)=-2am^3+n=m^3+n$이므로 $a=-\dfrac12$이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 $f(x)=-\dfrac12x^3+\dfrac32m^2x+n$이고 $\dfrac{4ac}{m^2}=\dfrac{4\times\left(-\frac12\right)\times\frac32m^2}{m^2}=-3$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        $b=0$, $c=-3am^2$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 10
      evidence: |
        $a=-\dfrac12$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $\dfrac{4ac}{m^2}=-3$을 구했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42121}
  misconceptions:
  - id: MC-CAL-42121
    outcome_code: '71'
    wrong_work: '극댓값 조건을 $f(-m)=m^3+n$에 적용해 $a=\frac12$'
    detect_cue: $a>0$ 또는 답이 $3$이다
    feedback: 극댓값은 $x=m$에서입니다. $a<0$이어야 $x=m$이 극대, $x=-m$이 극소가 됩니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    【2-2】 두 곡선 $y=f(x)$, $y=mx^2+n$과 두 직선 $x=0$, $x=m$으로 둘러싸인 도형의 넓이를 $A_m$이라 하고, 이 도형의 내부 또는 경계에 속하는 $x$좌표와 $y$좌표가 모두 정수인 점의 개수를 $B_m$이라 하자.

    (1) 자연수 $k$에 대하여, $m=2k-1$이면

    $$B_m=\frac{k(pk^3+qk^2+rk+s)}{6}$$

    이다. $\dfrac{(p-q)r}{s}$의 값을 구하시오. (단, $p,q,r,s$는 상수) (40점)

    (2) 수열 $\left\{\dfrac{B_m}{A_m}\right\}$이 수렴함을 증명하시오. (50점)
  points: 90
  depends_on: ['1']
  answer: {kind: value, value: '588', equivalents: ['(1) 588 (2) 증명(극한 1)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $L_i=-\frac12i^3-mi^2+\frac32m^2i+1$ ($m$ 홀수), 일반 $m$은 $L_i$를 끼워 $\frac{B_m}{A_m}\to1$, $A_m=\frac{7}{24}m^4$.
    steps:
    - {id: 2a, content: '(1) $B_{2k-1}=\frac{k(28k^3-56k^2+35k+5)}{6}$, $\frac{(28+56)35}{5}=588$ (2) $C_m\le B_m\le D_m$, $\frac{C_m}{A_m},\frac{D_m}{A_m}\to1$', criteria: [2.M1, 2.M2, 2.A1, 2.M3, 2.M4, 2.M5, 2.A2]}
    hint_ladder:
    - 세로선 $x=i$ 위에서 두 곡선 사이에 있는 정수 $y$는 몇 개인가?
    - $m$이 홀수이면 $f(i)$는 왜 정수인가?
  - id: S2-B
    audience: B
    source_flow: M21_N2.pdf p.7~8
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1) 주어진 도형의 내부 또는 경계에서 직선 $x=i$($i$는 $0\le i\le m$인 정수) 위의 $y$좌표가 정수인 점의 개수를 $L_i$라 하자. 자연수 $k$에 대하여, $m=2k-1$이면 $f(i)=-\dfrac12i^3+\dfrac32(2k-1)^2i+n=\dfrac i2\left(-i^2+3(2k-1)^2\right)+n$이다. 여기서 $i$가 짝수이면 $\dfrac i2$가 정수이므로 $-\dfrac12i^3+\dfrac32(2k-1)^2i$는 정수이고, $i$가 홀수이면 $-i^2+3(2k-1)^2$은 짝수이므로 $-\dfrac12i^3+\dfrac32(2k-1)^2i$는 정수이다. 즉, $f(i)$는 정수이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 $L_i=-\dfrac12i^3-(2k-1)i^2+\dfrac32(2k-1)^2i+1$이고
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $B_m=B_{2k-1}=\displaystyle\sum_{i=0}^{2k-1}L_i=-\frac12\left\{\frac{(2k-1)2k}{2}\right\}^2-(2k-1)\times\frac{(2k-1)2k(4k-1)}{6}+\frac32(2k-1)^2\times\frac{(2k-1)2k}{2}+2k=\frac{k(28k^3-56k^2+35k+5)}{6}$이다. 즉 $\dfrac{(p-q)r}{s}=\dfrac{(28+56)35}{5}=588$이다.
      criteria: [2.A1]
    - id: 2b-4
      content: |
        (2) 주어진 도형의 내부 또는 경계에서 직선 $x=i$($0\le i\le m$인 정수) 위의 $y$좌표가 정수인 점의 개수를 $L_i$라 하면 $-\dfrac12i^3-mi^2+\dfrac32m^2i=-\dfrac12i^3+\dfrac32m^2i+n-(mi^2+n)\le L_i\le-\dfrac12i^3+\dfrac32m^2i+n-(mi^2+n)+1=-\dfrac12i^3-mi^2+\dfrac32m^2i+1$이다.
      criteria: [2.M3]
    - id: 2b-5
      content: |
        따라서 $-\dfrac12\left\{\dfrac{m(m+1)}{2}\right\}^2-m\times\dfrac{m(m+1)(2m+1)}{6}+\dfrac32m^2\times\dfrac{m(m+1)}{2}\le B_m=\displaystyle\sum_{i=0}^{m}L_i\le-\frac12\left\{\frac{m(m+1)}{2}\right\}^2-m\times\frac{m(m+1)(2m+1)}{6}+\frac32m^2\times\frac{m(m+1)}{2}+m+1$이고, 이 부등식에서 가장 왼쪽 값을 $C_m$, 가장 오른쪽 값을 $D_m$이라 하자.
      criteria: [2.M4]
    - id: 2b-6
      content: |
        또한 $A_m=\displaystyle\int_0^m\left(-\frac12x^3+\frac32m^2x-mx^2\right)dx=-\frac18m^4+\frac34m^4-\frac13m^4=\frac{-3+18-8}{24}m^4=\frac{7}{24}m^4$이다.
      criteria: [2.M5]
    - id: 2b-7
      content: |
        부등식 $\dfrac{C_m}{A_m}\le\dfrac{B_m}{A_m}\le\dfrac{D_m}{A_m}$에서 $\displaystyle\lim_{m\to\infty}\frac{C_m}{A_m}=\lim_{m\to\infty}\frac{D_m}{A_m}=1$이므로 제시문 (라)에 의하여 수열 $\left\{\dfrac{B_m}{A_m}\right\}$이 $1$로 수렴한다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        (1) $f(i)$가 정수임을 보였다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M2], max_points: 20}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 10
      evidence: |
        (1) $L_i$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        (1) $B_m=B_{2k-1}$을 구하고 $\dfrac{(p-q)r}{s}=588$을 구했다.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.M3
      mark_type: M
      points: 20
      evidence: |
        (2) $L_i$의 부등식을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-4]
    - id: 2.M4
      mark_type: M
      points: 10
      evidence: |
        (2) $B_m$의 범위를 구했다.
      depends_on: [2.M3]
      steps: [2b-5]
    - id: 2.M5
      mark_type: M
      points: 10
      evidence: |
        (2) $A_m$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-6]
    - id: 2.A2
      mark_type: A
      points: 10
      evidence: |
        (2) $\displaystyle\lim_{m\to\infty}\frac{C_m}{A_m}=\lim_{m\to\infty}\frac{D_m}{A_m}=1$을 계산했다.
      depends_on: [2.M4, 2.M5]
      steps: [2b-7]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-42101}
  misconceptions:
  - id: MC-CNT-42101
    outcome_code: '71'
    wrong_work: '세로선 위 격자점 수를 두 곡선 사이 길이 $f(i)-(mi^2+n)$로 두어 양 끝점 $+1$을 빠뜨림'
    detect_cue: $L_i$에 $+1$이 없고 $B_m$의 마지막 항 $2k$가 없다
    feedback: 정수 $p\le y\le q$의 개수는 $q-p+1$입니다. 경계도 포함됩니다.
    remedy: [RL-2]

