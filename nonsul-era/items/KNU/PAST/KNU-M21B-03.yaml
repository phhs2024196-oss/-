stimuli:
- label: (가)
  body: |
    함수 $f(x)$가 실수 $a$에 대하여 다음 조건을 모두 만족시킬 때, $f(x)$는 $x=a$에서 연속이라고 한다.

    (1) 함수 $f(x)$는 $x=a$에서 정의되고

    (2) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재하며

    (3) $\displaystyle\lim_{x\to a}f(x)=f(a)$
- label: (나)
  body: |
    첫째항이 $a$, 공비가 $r\ (r\ne0,1)$인 등비수열의 첫째항부터 제$n$항까지의 합을 $S_n$이라 할 때, $S_n=\dfrac{a(r^n-1)}{r-1}$이다.
- label: (다)
  body: |
    $$\lim_{n\to\infty}\left(1+\frac1n\right)^n=e$$
- label: (라)
  body: |
    함수 $f(x)$가 $x=a$에서 연속일 때, 수열 $\{a_n\}$에 대하여 $\displaystyle\lim_{n\to\infty}a_n=a$이면, $\displaystyle\lim_{n\to\infty}f(a_n)=f(a)$이다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  두 연속함수 $f(x)$와 $g(t)$에 대하여

  $$f(x+t)=f(x)^{g(t)},\quad\ln f(e)=2\ln f(0)$$

  일 때, 다음 물음에 답하시오. (단, 모든 실수 $x$, $t$에 대하여 $f(x)>1$이고 $g(t)>0$)

