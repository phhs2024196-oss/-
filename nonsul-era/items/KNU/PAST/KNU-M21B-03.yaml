- id: '2'
  stem: |
    【3-2】 $\displaystyle\sum_{n=1}^{10}\ln f(ne)=\alpha\ln f(0)$일 때, 정수 $\alpha$의 값을 구하시오. (40점)
  points: 40
  depends_on: ['1']
  answer: {kind: value, value: '2046', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $h(ne)=h(0)\cdot2^n$.
    steps:
    - {id: 2a, content: '$\sum_{n=1}^{10}2^nh(0)=2(2^{10}-1)h(0)$, $\alpha=2046$', criteria: [2.M1, 2.M2, 2.M3, 2.A1]}
    hint_ladder:
    - 로그를 취하고 $x=0$을 넣어 $g$를 $h$로 나타내자.
  - id: S2-B
    audience: B
    source_flow: M21_N2.pdf p.10
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x+t)=f(x)^{g(t)}$에 로그를 취하면 $\ln f(x+t)=g(t)\ln f(x)$이다. $h(t)=\ln f(t)$라 놓으면 $h(x+t)=g(t)h(x)$이다. $h(x+0)=h(0)g(x)$이므로 즉, $h(x+t)=\dfrac{1}{h(0)}h(t)h(x)$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        임의의 정수 $n$에 대해 $h(ne)=\dfrac{1}{h(0)}h(e)h((n-1)e)=\cdots=\{h(0)\}^{1-n}\{h(e)\}^n$이므로
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $\ln f(ne)=\{\ln f(0)\}^{1-n}\{2\ln f(0)\}^n=2^n\ln f(0)$이므로
      criteria: [2.M3]
    - id: 2b-4
      content: |
        $\displaystyle\sum_{n=1}^{10}\ln f(ne)=2(2^{10}-1)\ln f(0)$이다. 따라서 $\alpha=2(2^{10}-1)=2046$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $h(t)=\ln f(t)$일 때, $h(x+t)=\dfrac{1}{h(0)}h(t)h(x)$ 관계식을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 10
      evidence: |
        임의의 정수 $n$에 대해 $h(ne)=\{h(0)\}^{1-n}\{h(e)\}^n$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M3
      mark_type: M
      points: 10
      evidence: |
        $\ln f(ne)=2^n\ln f(0)$임을 구했다.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        $\alpha=2046$을 구했다.
      depends_on: [2.M3]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-SEQ-42102}
  misconceptions:
  - id: MC-SEQ-42102
    outcome_code: '71'
    wrong_work: '$\sum_{n=1}^{10}2^n=2^{10}-1$로 계산해 $\alpha=1023$'
    detect_cue: 답이 $1023$ 또는 $2047$이다
    feedback: 첫째항이 $2$, 공비 $2$이므로 합은 $\frac{2(2^{10}-1)}{2-1}=2046$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    【3-3】 $f(e)=e^4$일 때, 다음 물음에 답하시오.

    (1) $\ln f(1)$의 값을 구하시오. (30점)

    (2) $\displaystyle\lim_{n\to\infty}\frac{\ln f\left(e+\frac en\right)-4}{\frac1n}$의 값을 구하시오. (40점)
  points: 70
  depends_on: ['2']
  answer: {kind: value, value: '2**(1+exp(-1)); 4*log(2)', equivalents: ['(1) 2^{1+1/e} (2) 4ln2'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h(e)=4$, $h(0)=2$이므로 $h(x)=2\cdot2^{x/e}$ 꼴; $h(1)=2^{1+\frac1e}$, 극한 $4\ln2$.
    steps:
    - {id: 3a, content: '$h(e)=h(0)^{1-e}h(1)^e\Rightarrow4=2^{1-e}h(1)^e\Rightarrow h(1)=2^{1+\frac1e}$; $\frac{h(e+\frac en)-h(e)}{1/n}=4\cdot\frac{2^{1/n}-1}{1/n}\to4\ln2$', criteria: [3.M1, 3.M2, 3.M3, 3.M4, 3.A1, 3.M5, 3.M6, 3.M7, 3.A2]}
    hint_ladder:
    - $h(n)$, $h\left(\frac1n\right)$, $h\left(\frac nm\right)$를 $h(0),h(1)$로 차례로 나타내자.
    - 무리수 $e$에서의 값은 연속성으로 얻는다.
  - id: S3-B
    audience: B
    source_flow: M21_N2.pdf p.10~11
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1) 임의의 정수 $n$에 대해 $h(n)=\dfrac{1}{h(0)}h(1)h(n-1)=\cdots=h(0)^{1-n}h(1)^n\ \cdots(*)$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $(*)$를 이용하면 임의의 정수 $n$에 대해 $h(1)=h\left(n\times\dfrac1n\right)=\dfrac{1}{h(0)}h\left(\dfrac1n\right)h\left(\dfrac{n-1}{n}\right)=\cdots=\{h(0)\}^{1-n}\left\{h\left(\dfrac1n\right)\right\}^n\Rightarrow h\left(\dfrac1n\right)=\{h(0)\}^{1-\frac1n}\{h(1)\}^{\frac1n}$이므로
      criteria: [3.M2]
    - id: 3b-3
      content: |
        임의의 두 정수 $m,n$에 대해 $h\left(\dfrac nm\right)=h(0)^{1-n}h\left(\dfrac1m\right)^n=h(0)^{1-\frac nm}h(1)^{\frac nm}\ \cdots(**)$이다.
      criteria: [3.M3]
    - id: 3b-4
      content: |
        또한 $f$와 $\ln x$가 $x>0$에서 연속이므로 $h(x)=\ln f(x)$도 $x>0$에서 연속이다. 그래서 $h(e)$는 $\displaystyle\lim_{n\to\infty}h\left(\left(1+\frac1n\right)^n\right)=\lim_{n\to\infty}h(0)^{1-\left(1+\frac1n\right)^n}h(1)^{\left(1+\frac1n\right)^n}=h(0)^{1-e}h(1)^e$이다.
      criteria: [3.M4]
    - id: 3b-5
      content: |
        $\ln f(e)=2\ln f(0)$이므로 $f(0)=e^2$이고 그래서 $4=h(e)=2^{1-e}h(1)^e$이므로 $\ln f(1)=h(1)=2^{1+\frac1e}$이다.
      criteria: [3.A1]
    - id: 3b-6
      content: |
        (2) $(**)$를 이용하면 $h(e)=h\left(n\times\dfrac en\right)=\dfrac{1}{h(0)}h\left((n-1)\times\dfrac en\right)h\left(\dfrac en\right)=\cdots=h(0)^{1-n}h\left(\dfrac en\right)^n$이므로 $\displaystyle\lim_{n\to\infty}\frac{h\left(e+\frac en\right)-h(e)}{\frac1n}=h(e)\lim_{n\to\infty}\frac{h\left(\frac en\right)\frac{1}{h(0)}-1}{\frac1n}=h(e)\lim_{n\to\infty}\frac{h(0)^{-\frac1n}h(e)^{\frac1n}-1}{\frac1n}$이다.
      criteria: [3.M5]
    - id: 3b-7
      content: |
        $h(0)=2$, $h(e)=4$에서 $\displaystyle\lim_{n\to\infty}\frac{h\left(e+\frac en\right)-h(e)}{\frac1n}=4\lim_{n\to\infty}\frac{2^{\frac1n}-1}{\frac1n}$이고 $\displaystyle\lim_{n\to\infty}\frac{2^{\frac1n}-1}{\frac1n}$을 계산하기 위하여 $t_n=\dfrac{1}{2^{\frac1n}-1}$이라 하자. 그러면 $\dfrac1n=\log_2\left(1+\dfrac{1}{t_n}\right)$이다.
      criteria: [3.M6]
    - id: 3b-8
      content: |
        그래서 $\displaystyle\lim_{n\to\infty}\frac{2^{\frac1n}-1}{\frac1n}=\lim_{t_n\to\infty}\frac{1}{\log_2\left(1+\frac{1}{t_n}\right)^{t_n}}=\frac{1}{\log_2e}=\ln2$이다.
      criteria: [3.M7]
    - id: 3b-9
      content: |
        $\displaystyle\lim_{n\to\infty}\frac{\ln f\left(e+\frac en\right)-\ln f(e)}{\frac1n}=h(e)\ln2=4\ln2$이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        (1) $h(n)=\dfrac{1}{h(0)}h(1)h(n-1)=\cdots=h(0)^{1-n}h(1)^n$을 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.M1], max_points: 5}
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: |
        (1) $h\left(\dfrac1n\right)=\{h(0)\}^{1-\frac1n}\{h(1)\}^{\frac1n}$를 구했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M3
      mark_type: M
      points: 10
      evidence: |
        (1) $h\left(\dfrac nm\right)=h(0)^{1-\frac nm}h(1)^{\frac nm}$를 구했다.
      depends_on: [3.M2]
      steps: [3b-3]
    - id: 3.M4
      mark_type: M
      points: 5
      evidence: |
        (1) $h(e)=h(0)^{1-e}h(1)^e$를 구했다.
      depends_on: [3.M3]
      steps: [3b-4]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        (1) $\ln f(1)=h(1)=2^{1+\frac1e}$임을 구했다.
      depends_on: [3.M4]
      steps: [3b-5]
    - id: 3.M5
      mark_type: M
      points: 10
      evidence: |
        (2) $\displaystyle\lim_{n\to\infty}\frac{h\left(e+\frac en\right)-h(e)}{\frac1n}=h(e)\lim_{n\to\infty}\frac{h(0)^{-\frac1n}h(e)^{\frac1n}-1}{\frac1n}$임을 구했다.
      depends_on: [3.M3]
      steps: [3b-6]
    - id: 3.M6
      mark_type: M
      points: 10
      evidence: |
        (2) 치환했다.
      depends_on: [3.M5]
      steps: [3b-7]
    - id: 3.M7
      mark_type: M
      points: 10
      evidence: |
        (2) $\displaystyle\lim_{n\to\infty}\frac{2^{\frac1n}-1}{\frac1n}=\ln2$임을 구했다.
      depends_on: [3.M6]
      steps: [3b-8]
    - id: 3.A2
      mark_type: A
      points: 10
      evidence: |
        (2) $4\ln2$임을 구했다.
      depends_on: [3.M7]
      steps: [3b-9]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42122}
  misconceptions:
  - id: MC-CAL-42122
    outcome_code: '71'
