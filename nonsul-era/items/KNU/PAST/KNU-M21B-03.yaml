intent: |
  함수방정식에 로그를 취해 지수적 성질 $h(x+t)=\frac{1}{h(0)}h(t)h(x)$을 끌어내고, 등비수열의 합(3-2), 유리수에서의 값과 연속성을 이용한 무리수 $e$에서의 값(3-3(1)), 지수함수의 극한(3-3(2))을 구할 수 있는지 평가한다.
key_idea: |
  $h(x)=\ln f(x)$로 두면 $h(x+t)=g(t)h(x)$, $x=0$ 대입으로 $g(t)=\frac{h(t)}{h(0)}$이므로 $h(x+t)=\frac{h(x)h(t)}{h(0)}$. 정수배·유리수배로 $h\left(\frac nm\right)=h(0)^{1-\frac nm}h(1)^{\frac nm}$, 연속성과 $\left(1+\frac1n\right)^n\to e$로 $h(e)=h(0)^{1-e}h(1)^e$. 극한은 $\lim\frac{2^{1/n}-1}{1/n}=\ln2$.
stuck: |
  3-3(1)에서 유리수에서 얻은 식을 연속성(제시문 (라))과 $\left(1+\frac1n\right)^n\to e$로 $x=e$까지 확장하는 단계
idea_tags: [IDEA-CAUCHY-EXPONENTIAL-FUNCTIONAL-EQ, IDEA-RATIONAL-TO-REAL-BY-CONTINUITY]
tags: [함수방정식, 로그, 등비수열의 합, 연속함수, 자연상수 e, 지수함수의 극한]
