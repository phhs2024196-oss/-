stimuli:
- label: (가)
  body: |
    좌표평면 위의 두 점 $\mathrm{A}(x_1,y_1)$과 $\mathrm{B}(x_2,y_2)$ 사이의 거리는
    $$\overline{\mathrm{AB}}=\sqrt{(x_1-x_2)^2+(y_1-y_2)^2}$$
- label: (나)
  body: |
    중심이 $(a,b)$이고 반지름의 길이가 $r$인 원의 방정식은
    $$(x-a)^2+(y-b)^2=r^2$$
- label: (다)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b|f(x)|dx$$
- label: (라)
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  양의 실수 $t$에 대하여 중심이 $\mathrm{C}(f(t),g(t))$인 원 $R$는 점 $\mathrm{P}(t,t^2)$에서 곡선 $y=x^2$과 접하고 동시에 $x$축과 접한다. 점 $\mathrm{P}$에서 $x$축에 내린 수선과 원 $R$가 만나는 점 중에서 $\mathrm{P}$가 아닌 점을 $\mathrm{Q}$라 하고 $\angle\mathrm{PCQ}$를 $\theta$라 하자. 단, $f(t)>0$, $g(t)>0$이다.

subparts:
- id: '1-1'
  stem: |
    $\displaystyle\lim_{t\to0+}\dfrac{f(t)g(t)}{t^3}$의 값을 구하시오. (50점)
  points: 50
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: 원 위의 점 조건과 법선 조건을 연립해 $f$, $g$를 $t$로 표현하면 $fg=\tfrac{t^3}2\sqrt{4t^2+1}$.
    steps:
    - {id: 1-1a, content: '$fg=\dfrac{t^3}{2}\sqrt{4t^2+1}$이므로 극한 $\dfrac12$', criteria: [1-1.M1, 1-1.M2, 1-1.A1, 1-1.A2, 1-1.A3]}
    hint_ladder:
    - 원이 $x$축에 접하면 반지름은 무엇인가?
    - 원이 곡선과 $\mathrm{P}$에서 접하면 $\mathrm{CP}$는 접선과 어떤 관계인가?
  - id: S1-1-B
    audience: B
    source_flow: M22_N1.pdf p.6~7
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        원 $R$는 곡선 $y=x^2$과 $x$축에 동시에 접하기 때문에 원 $R$는 방정식 $(x-f(t))^2+(y-g(t))^2=g(t)^2$을 만족시킨다. 점 $\mathrm{P}(t,t^2)$은 원 위에 있기 때문에 $(t-f(t))^2+(t^2-g(t))^2=g(t)^2$을 만족시킨다.
      criteria: [1-1.M1]
    - id: 1-1b-2
      content: |
        선분 $\overline{\mathrm{PC}}$는 점 $\mathrm{P}(t,t^2)$에서의 곡선 $y=x^2$의 접선과 수직이기 때문에 $2t\dfrac{g(t)-t^2}{f(t)-t}=-1$을 만족시킨다.
      criteria: [1-1.M2]
    - id: 1-1b-3
      content: |
        따라서 $g(t)=\dfrac14\sqrt{4t^2+1}\left(\sqrt{4t^2+1}-1\right)$,
      criteria: [1-1.A1]
    - id: 1-1b-4
      content: |
        $f(t)=\dfrac t2\left(\sqrt{4t^2+1}+1\right)$
      criteria: [1-1.A2]
    - id: 1-1b-5
      content: |
        이고 $f(t)g(t)=\dfrac{t^3}2\sqrt{4t^2+1}$이므로 $\displaystyle\lim_{t\to0+}\dfrac{f(t)g(t)}{t^3}=\dfrac12$이다.
      criteria: [1-1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 10
      evidence: $(t-f(t))^2+(t^2-g(t))^2=g(t)^2$ 식을 구했다.
      # [공식표기] 채점기준 원문은 「(t-f(a))^2」 — f(t) 의 오식
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.M2
      mark_type: M
      points: 10
      evidence: $2t\dfrac{g(t)-t^2}{f(t)-t}=-1$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-2]
    - id: 1-1.A1
      mark_type: A
      points: 10
      evidence: $g(t)=\dfrac14\sqrt{4t^2+1}\left(\sqrt{4t^2+1}-1\right)$을 구했다.
      depends_on: [1-1.M1, 1-1.M2]
      cao: true
      steps: [1-1b-3]
    - id: 1-1.A2
      mark_type: A
      points: 10
      evidence: $f(t)=\dfrac t2\left(\sqrt{4t^2+1}+1\right)$을 구했다.
      depends_on: [1-1.M1, 1-1.M2]
      cao: true
      steps: [1-1b-4]
    - id: 1-1.A3
      mark_type: A
      points: 10
      evidence: $\displaystyle\lim_{t\to0+}\dfrac{f(t)g(t)}{t^3}=\dfrac12$을 구했다.
      depends_on: [1-1.M1, 1-1.M2]
      cao: true
      steps: [1-1b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42203}
  misconceptions:
  - id: MC-GEO-42203
    outcome_code: '71'
    wrong_work: '$\mathrm{PC}$의 기울기를 접선의 기울기 $2t$와 같게 놓음(수직 대신 평행)'
    detect_cue: 식 $\dfrac{g-t^2}{f-t}=2t$
    feedback: 원과 곡선이 접하면 공통 접선에 대해 중심에서 접점으로 가는 선분은 수직입니다. 기울기의 곱이 $-1$입니다.
    remedy: [RL-1]

- id: '1-2'
  stem: |
    $t=1$일 때, $\dfrac{d}{dt}\left(\dfrac1{\sin^2\left(\frac\theta2\right)}\right)$의 값을 구하시오. (30점)
  points: 30
  depends_on: ['1-1']
  answer: {kind: value, value: '8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: $t^2=g(1+\sin\tfrac\theta2)$에서 $\sin\tfrac\theta2=\tfrac{t^2-g}{g}=\tfrac{1}{\sqrt{4t^2+1}}$이므로 $\tfrac1{\sin^2(\theta/2)}=4t^2+1$.
    steps:
    - {id: 1-2a, content: '$\dfrac{d}{dt}(4t^2+1)=8t$, $t=1$에서 $8$', criteria: [1-2.M1, 1-2.A1]}
    hint_ladder:
    - 이등변삼각형 $\mathrm{PCQ}$에서 꼭짓점 $\mathrm{C}$로부터 $\mathrm{PQ}$에 내린 수선을 생각하자.
  - id: S1-2-B
    audience: B
    source_flow: M22_N1.pdf p.7
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        점 $\mathrm{P}(t,t^2)$의 $y$축 좌표는 원 $R$의 반지름과 $g(t)\sin\left(\dfrac\theta2\right)$의 합이기 때문에 $g(t)+g(t)\sin\left(\dfrac\theta2\right)=t^2$을 만족시킨다.
      criteria: [1-2.M1]
      # [공식표기] 예시답안 원문은 「b+b sin(θ/2)=t^2」 — b 는 g(t) 를 뜻함
    - id: 1-2b-2
      content: |
        따라서 $\dfrac{d}{dt}\dfrac1{\sin^2\left(\frac\theta2\right)}=\dfrac{d}{dt}(4t^2+1)=8t$이고 $t=1$일 때 값은 $8$이다.
      criteria: [1-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 15
      evidence: $g(t)+g(t)\sin\left(\dfrac\theta2\right)=t^2$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1-2b-1]
    - id: 1-2.A1
      mark_type: A
      points: 15
      evidence: $\dfrac{d}{dt}\dfrac1{\sin^2(\theta/2)}=\dfrac{d}{dt}(4t^2+1)=8t$이고 $t=1$일 때 값이 $8$임을 구했다.
      depends_on: [1-2.M1]
      cao: true
      steps: [1-2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42204}
  misconceptions:
  - id: MC-GEO-42204
    outcome_code: '71'
    wrong_work: '$\mathrm{P}$의 높이를 $g+g\cos\tfrac\theta2$ 또는 $g\sin\theta$로 잡음'
    detect_cue: 답이 $8$이 아니고 식에 $\cos\tfrac\theta2$나 $\sin\theta$가 나타남
    feedback: $\mathrm{C}$에서 수직선 $\mathrm{PQ}$까지의 수평거리와 $\tfrac\theta2$의 관계를 그림에서 확인하세요. 중심보다 위에 있는 부분이 $g\sin\tfrac\theta2$입니다.
    remedy: [RL-2]

- id: '1-3'
  stem: |
    점 $\mathrm{A}(f(t),0)$에 대하여 곡선 $y=x^2$과 $x$축 및 부채꼴 $\mathrm{CPA}$의 호 $\mathrm{AP}$로 둘러싸인 부분의 넓이를 $S(t)$라고 할 때, $\displaystyle\lim_{t\to0+}\dfrac{S(t)}{t^3}$의 값을 구하시오. (단, $0<\angle\mathrm{PCA}<\pi$) (30점)
  points: 30
  depends_on: ['1-1']
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: $S=\tfrac{t^3}3+\tfrac12(t^2+g)(f-t)-$부채꼴, $g\sim\tfrac{t^2}2$, $f-t=o(t)$이고 부채꼴은 $O(t^4)$.
    steps:
    - {id: 1-3a, content: '$\dfrac{S}{t^3}\to\dfrac13+\dfrac12\left(1+\dfrac12\right)(1-1)-0=\dfrac13$', criteria: [1-3.M1, 1-3.A1, 1-3.A2, 1-3.A3]}
    hint_ladder:
    - $S(t)$를 곡선 아래 넓이, 사다리꼴, 부채꼴로 나누어 보자.
    - 각 항이 $t\to0+$에서 $t^3$보다 빨리 작아지는지 확인하자.
  - id: S1-3-B
    audience: B
    source_flow: M22_N1.pdf p.7
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        넓이 $S$는 곡선 $y=x^2$과 $x$축 및 점 $\mathrm{P}$와 점 $\mathrm{B}(t,0)$을 연결하는 선분으로 둘러싸인 영역의 넓이와 사다리꼴 $\mathrm{PBAC}$의 넓이에 부채꼴 $\mathrm{CPA}$의 넓이를 뺀 값이다. 따라서
        $$S(t)=\int_0^tx^2dx+\dfrac12(t^2+g(t))(f(t)-t)-\dfrac{g(t)^2}4(\pi+\theta)=\dfrac{t^3}3+\dfrac12(t^2+g(t))(f(t)-t)-\dfrac{g(t)^2}4(\pi+\theta)$$
      criteria: [1-3.M1]
    - id: 1-3b-2
      content: |
        $$\lim_{t\to0+}\dfrac{g(t)}{t^2}=\lim_{t\to0+}\dfrac{\sqrt{4t^2+1}\left(\sqrt{4t^2+1}-1\right)}{4t^2}=\lim_{t\to0+}\dfrac{\sqrt{4t^2+1}}{\sqrt{4t^2+1}+1}=\dfrac12,$$
      criteria: [1-3.A1]
    - id: 1-3b-3
      content: |
        $$\lim_{t\to0+}\dfrac{f(t)}t=\lim_{t\to0+}\dfrac12\left(\sqrt{4t^2+1}+1\right)=1,\qquad\pi\le\pi+\theta\le2\pi$$
      criteria: [1-3.A2]
    - id: 1-3b-4
      content: |
        이므로
        $$\lim_{t\to0+}\dfrac{S(t)}{t^3}=\lim_{t\to0+}\left(\dfrac13+\dfrac12\left(1+\dfrac{g(t)}{t^2}\right)\left(\dfrac{f(t)}t-1\right)-\dfrac{g(t)^2}{4t^3}(\pi+\theta)\right)=\dfrac13+\dfrac12\left(1+\dfrac12\right)(1-1)=\dfrac13$$
        이다.
      criteria: [1-3.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 10
      evidence: $S(t)=\dfrac{t^3}3+\dfrac12(t^2+g(t))(f(t)-t)-\dfrac{g(t)^2}4(\pi+\theta)$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1-3b-1]
    - id: 1-3.A1
      mark_type: A
      points: 5
      evidence: $\displaystyle\lim_{t\to0+}\dfrac{g(t)}{t^2}=\dfrac12$임을 구했다.
      depends_on: [1-3.M1]
      cao: true
      steps: [1-3b-2]
    - id: 1-3.A2
      mark_type: A
      points: 5
      evidence: $\displaystyle\lim_{t\to0+}\dfrac{f(t)}t=1$임을 구했다.
      depends_on: [1-3.M1]
      cao: true
      steps: [1-3b-3]
    - id: 1-3.A3
      mark_type: A
      points: 10
      evidence: $\displaystyle\lim_{t\to0+}\dfrac{S(t)}{t^3}=\dfrac13$임을 구했다.
      depends_on: [1-3.M1]
      cao: true
      steps: [1-3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42212}
  misconceptions:
  - id: MC-CAL-42212
    outcome_code: '71'
