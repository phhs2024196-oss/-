intent: |
  곡선과 $x$축에 동시에 접하는 원의 중심을 접선·법선 조건으로 구하고(1-1), 원의 반지름과 각의 삼각비 관계를 미분하며(1-2), 곡선·선분·부채꼴로 둘러싸인 넓이의 극한을 구할 수 있는지(1-3) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 채점기준으로 요약)
key_idea: |
  원 $R$의 중심 $\mathrm{C}(f,g)$는 $x$축에 접하므로 반지름 $g$, 점 $\mathrm{P}(t,t^2)$에서 곡선에 접하므로 $\overline{\mathrm{PC}}$는 법선: $(t-f)^2+(t^2-g)^2=g^2$, $2t\cdot\dfrac{g-t^2}{f-t}=-1$. 이로부터 $g=\tfrac14\sqrt{4t^2+1}(\sqrt{4t^2+1}-1)$, $f=\tfrac t2(\sqrt{4t^2+1}+1)$. $\mathrm{P}$의 높이 $t^2=g+g\sin\tfrac\theta2$.
stuck: |
  1-2에서 $\angle\mathrm{PCQ}=\theta$와 점 $\mathrm{P}$의 높이를 연결해 $g(1+\sin\tfrac\theta2)=t^2$을 얻는 단계(이등변삼각형 $\mathrm{PCQ}$의 꼭지각 이등분)
