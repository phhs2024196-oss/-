stimuli:
- label: (가)
  body: |
    함수 $f(x)$가 실수 $a$에 대하여 다음 세 조건을 만족시킬 때, $f(x)$는 $x=a$에서 연속이라고 한다.
    (ⅰ) $f(x)$가 $x=a$에서 정의되어 있다.
    (ⅱ) 극한값 $\lim_{x\to a}f(x)$가 존재한다.
    (ⅲ) $\lim_{x\to a}f(x)=f(a)$
- label: (나)
  body: |
    함수 $f(x)$에 대하여 극한값
    $$\lim_{h\to0}\dfrac{f(a+h)-f(a)}h$$
    가 존재하면 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다.
- label: (다)
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고 이 구간의 모든 $x$에서
    (ⅰ) $f'(x)>0$이면 $f(x)$는 이 구간에서 증가한다.
    (ⅱ) $f'(x)<0$이면 $f(x)$는 이 구간에서 감소한다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  최고차항의 계수가 $3$인 사차함수 $f(x)$와 양의 실수 $a$, $b$에 대하여 실수 전체의 집합에서 정의된 함수
  $$g(x)=\begin{cases}-af(x)+(a+b) & (x<5)\\ bf(x) & (x\ge5)\end{cases}$$
  는 $x=5$에서 미분가능하다.
  실수 $t$에 대하여 함수 $k(x)=|t-g(x)|$가 미분가능하지 않은 점의 개수를 $h(t)$라 하면
  $$h(t)=\begin{cases}0 & (t=t_1,t_2)\\ 1 & (t\ne t_1,t_2)\end{cases}$$
  이다. 단, $t_1<t_2$이다.

subparts:
- id: '2-1'
  stem: |
    $f(5)$와 $f'(5)$를 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: value, value: '1; 0', equivalents: ['f(5)=1, f''(5)=0'], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: 연속 $-af(5)+(a+b)=bf(5)$, 미분가능 $-af'(5)=bf'(5)$, $a+b>0$.
    steps:
    - {id: 2-1a, content: '$(a+b)f(5)=a+b\Rightarrow f(5)=1$, $(a+b)f''(5)=0\Rightarrow f''(5)=0$', criteria: [2-1.B1, 2-1.B2]}
    hint_ladder:
    - 미분가능하면 연속이다. $x=5$에서 두 식의 값을 같게 놓자.
  - id: S2-1-B
    audience: B
    source_flow: M22_N1.pdf p.8
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        함수 $g(x)$가 $x=5$에서 미분가능하고 연속이므로 다음이 성립한다.
        $$-af(5)+(a+b)=bf(5),\quad -af'(5)=bf'(5)$$
        그러므로 $a+b>0$이므로 $f(5)=1$, $f'(5)=0$이다.
      criteria: [2-1.B1, 2-1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.B1
      mark_type: B
      points: 15
      evidence: $-af(5)+(a+b)=bf(5)$임을 보이고 $f(5)=1$임을 보였다.
      steps: [2-1b-1]
    - id: 2-1.B2
      mark_type: B
      points: 15
      evidence: $-af'(5)=bf'(5)$임을 보이고 $f'(5)=0$임을 보였다.
      steps: [2-1b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42213}
  misconceptions:
  - id: MC-CAL-42213
    outcome_code: '71'
    wrong_work: '미분가능 조건에서 상수항 $(a+b)$까지 미분해 $-af''(5)+(a+b)=bf''(5)$로 세움'
    detect_cue: $f'(5)$가 $0$이 아님
    feedback: 상수 $(a+b)$의 도함수는 $0$입니다.
    remedy: [RL-1]

- id: '2-2'
  stem: |
    방정식 $f'(x)=0$은 서로 다른 두 실근을 가짐을 보이시오. (40점)
  points: 40
  depends_on: ['2-1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $h(t)\le1$ ⇒ $g'\ge0$; $h(t)=0$이 두 번 ⇒ $g'=0$의 근이 정확히 두 개. $g'(5)=0$, 다른 근 $p$에서 $f'$의 부호가 바뀌지 않으므로 $p$는 $f'=0$의 중근.
    steps:
    - {id: 2-2a, content: '$f''(x)=0$의 해는 $x=5$와 $x=p\ne5$(중근)', criteria: [2-2.R1, 2-2.R2, 2-2.R3]}
    hint_ladder:
    - $k(x)=|t-g(x)|$는 어떤 점에서 꺾이는가?
    - $g$가 감소하는 구간이 있으면 어떤 수평선과 몇 번 만나는가?
  - id: S2-2-B
    audience: B
    source_flow: M22_N1.pdf p.8~9
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        $y=|t-g(x)|=|g(x)-t|$는 $y=g(x)$를 $y=t$의 윗부분은 그대로 $y=t$의 아랫부분은 $y=t$에 대하여 대칭시킨 함수이다. 함수 $g(x)$에 대해서 다음 명제가 참임을 보이자.
        ① 모든 $x$에 대하여 $g'(x)\ge0$이다.
        ② $g'(x)=0$은 오직 $2$개의 실근을 가진다.
        함수 $f(x)$의 최고차항 계수가 양수이므로 $\lim_{x\to\infty}g(x)=\infty$이고 $\lim_{x\to-\infty}g(x)=-\infty$이다. 만일 어떤 $x=m$에서 $g'(x)<0$이면 $y=g(x)$와 직선 $y=g(m)$이 만나는 교점이 $3$개 이상이다. 즉, $t=g(m)$에서 $h(t)\ge3$이므로 $h(t)$의 함숫값이 $1$이하인 조건에 모순이다. 그러므로 ①이 성립한다.
      criteria: [2-2.R1]
    - id: 2-2b-2
      content: |
        $t=t_1$와 $t=t_2$에서 $h(t)=0$이고 두 점을 제외한 모든 점에서 $h(t)=1$를 만족하기 위해서는 ②를 만족해야 한다. $g(x)$의 개형에 따라 $g'(x)=0$은 오직 $2$개의 서로 다른 실근인 해를 가진다.
      criteria: [2-2.R2]
      # [그림: 증가하면서 두 곳에서 수평 접선(정류점)을 갖는 g(x)의 개형]
    - id: 2-2b-3
      content: |
        $g'(5)=bf'(5)=0$이므로 $x=5$는 $g'(x)=0$의 해이다. $x=5$가 아닌 다른 해를 $p$라고 하자.
        (ⅰ) $p<5$인 경우: $g'(p)=-af'(p)=0$이고 $f'(x)$의 부호는 $(-,0,-,0,+)$($x=p$, $x=5$에서 $0$)이므로 $x=p$는 $f'(x)=0$의 중근이다.
        (ⅱ) $p>5$인 경우: $g'(p)=bf'(p)=0$이고 $f'(x)$의 부호는 $(-,0,+,0,+)$($x=5$, $x=p$에서 $0$)이므로 $x=p$는 $f'(x)=0$의 중근이다.
        (ⅰ)과 (ⅱ)에 의해서 $f'(x)=0$의 해는 $x=5$, $x=p\ne5$(중근)이다.
      criteria: [2-2.R3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.R1
      mark_type: R
      points: 10
      evidence: $g(x)$가 증가함수임을 증명했다.
      depends_on: []
      steps: [2-2b-1]
    - id: 2-2.R2
      mark_type: R
      points: 10
      evidence: $g'(x)=0$이 서로 다른 두 실근을 가짐을 증명했다.
      depends_on: [2-2.R1]
      steps: [2-2b-2]
    - id: 2-2.R3
      mark_type: R
      points: 20
      evidence: $f'(x)=0$이 $x=p$ $(p\ne5)$인 중근을 가짐을 증명했다.
      depends_on: [2-2.R2]
      steps: [2-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42214}
  misconceptions:
  - id: MC-CAL-42214
    outcome_code: '71'
    wrong_work: '$|t-g(x)|$는 $g(x)=t$인 모든 점에서 미분가능하지 않다고 보아 정류점에서의 예외($g''=0$이면 꺾이지 않음)를 놓침'
    detect_cue: $h(t)=0$인 $t$를 「$g$의 치역 밖」으로 해석
    feedback: $g$가 증가하고 치역이 실수 전체이므로 모든 $t$에서 $g(x)=t$인 점이 있습니다. $h(t)=0$은 그 점에서 $g'=0$이라 접어도 꺾이지 않는 경우입니다.
    remedy: [RL-2]

- id: '2-3'
  stem: |
    $a=2$, $b=3$이고 $t_1=3$, $t_2=6$일 때, 곡선 $y=f(x)$와 직선 $y=2$의 모든 교점의 $x$좌표들의 합을 구하시오. (50점)
  points: 50
  depends_on: ['2-2']
  answer: {kind: value, value: '32/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-3-A
    audience: A
    method_no: 1
    key_idea: $f(x)-f(p)=(x-p)^3(3x+p-20)$, $f(5)-f(p)=-(5-p)^4$. $p<5$는 $f(5)=2$가 되어 2-1과 모순, $p>5$에서 $f(p)=2$, $f(5)=1$이므로 $p=6$.
    steps:
    - {id: 2-3a, content: '$f(x)=3(x-6)^3\left(x-\tfrac{14}3\right)+2$, 교점 $x=6,\tfrac{14}3$, 합 $\tfrac{32}3$', criteria: [2-3.M1, 2-3.M2, 2-3.R1, 2-3.A1, 2-3.A2]}
    hint_ladder:
    - $h(t)=0$인 $t$ 두 개는 $g$의 어떤 값인가?
    - $p<5$, $p>5$ 각각에서 $g(p)$, $g(5)$를 $f$로 나타내 보자.
  - id: S2-3-B
    audience: B
    source_flow: M22_N1.pdf p.10
    method_no: 1
    steps:
    - id: 2-3b-1
      content: |
        문제 2-2 결과에 의해서 $f'(x)=0$은 $5$와 $p$(중근)인 해를 가진다. 그러므로
        $$f'(x)=12(x-p)^2(x-5)=12(x-p)^2(x-p+p-5)=12(x-p)^3+12(p-5)(x-p)^2$$
        이것을 적분하면 $f(x)=3(x-p)^4+4(p-5)(x-p)^3+C$이다. $x=p$를 대입하면 $C=f(p)$이다. 즉, $f(x)-f(p)=(x-p)^3(3x+p-20)$이다.
      criteria: [2-3.M1]
    - id: 2-3b-2
      content: |
        $x=5$를 양변에 대입하면 $f(5)-f(p)=-(5-p)^4$ $\cdots(*)$. $h(t)=0$인 $t$는 $t=3$, $t=6$이므로 $\{g(p),g(5)\}=\{3,6\}$이다.
      criteria: [2-3.M2]
    - id: 2-3b-3
      content: |
        ① $p<5$인 경우: $g(p)=-2f(p)+5=3$, $g(5)=3f(5)=6$이므로 $f(p)=1$, $f(5)=2$이다. 하지만 문제 2-1에 의해 $f(5)=1$이므로 조건을 만족하는 $f(x)$는 존재하지 않는다.
      criteria: [2-3.R1]
      # [공식표기] 예시답안의 h(t) 경우 나눔 표 첫 줄 「1 (t≤3)」 은 t<3 의 오식
    - id: 2-3b-4
      content: |
        ② $5<p$인 경우: $g(p)=3f(p)=6$, $g(5)=3f(5)=3$이므로 $f(p)=2$, $f(5)=1$이다. $(*)$에 대입 후 $5<p$이므로 $5-p=-1$이다. 즉, $p=6$이다. 그러므로 $f(x)=3(x-6)^3\left(x-\dfrac{14}3\right)+2$이다.
      criteria: [2-3.A1]
    - id: 2-3b-5
      content: |
        곡선 $y=f(x)$와 직선 $y=2$가 만나는 점의 $x$좌표는 $x=6$과 $x=\dfrac{14}3$이고, 그 합은 $\dfrac{32}3$이다.
      criteria: [2-3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-3.M1
      mark_type: M
      points: 10
      evidence: $f(x)-f(p)=(x-p)^3(3x+p-20)$을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2-3b-1]
    - id: 2-3.M2
      mark_type: M
