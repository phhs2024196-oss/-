intent: |
  구간별 함수의 연속·미분가능 조건을 식으로 세우고(2-1), 절댓값 함수가 미분가능하지 않은 점의 개수 조건을 그래프 개형(증가함수, 정류점 2개)으로 해석하며(2-2), 이를 이용해 사차함수를 결정할 수 있는지(2-3) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 채점기준으로 요약)
key_idea: |
  $g$가 $x=5$에서 미분가능하므로 $f(5)=1$, $f'(5)=0$. $k(x)=|t-g(x)|$가 미분가능하지 않은 점은 $g(x)=t$이고 $g'(x)\ne0$인 점이므로 $h(t)\le1$ ⇒ $g$는 증가, $h(t)=0$인 $t$가 두 개 ⇒ $g'=0$인 점이 정확히 두 개. 따라서 $f'(x)=12(x-p)^2(x-5)$, $f(x)-f(p)=(x-p)^3(3x+p-20)$.
stuck: |
  2-2에서 $h(t)\le1$을 「$g$가 감소하는 곳이 있으면 수평선과 3번 이상 만난다」로 바꾸고, $g'=-af'$($x<5$), $bf'$($x\ge5$)의 부호로 $f'$의 근이 중근임을 끌어내는 단계
