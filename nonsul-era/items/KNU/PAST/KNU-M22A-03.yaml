intent: |
  홀짝으로 정의된 점화식의 일반항을 수학적 귀납법으로 증명하고(3-1), 곡선 $y=b_nx^n$ 아래 넓이가 직사각형의 $\tfrac1{n+1}$임을 이용해 닮은 두 삼각형의 넓이비로 교점을 결정하며(3-2), 내분점과 넓이 분할로 점의 좌표를 구할 수 있는지(3-3) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 채점기준으로 요약)
key_idea: |
  $a_{2k+1}=\tfrac12a_{2k}=\tfrac12(a_{2k-1}+2)=\tfrac12a_{2k-1}+1$. 교점 $\mathrm{P}_n(\alpha_n,\beta_n)$에서 $\int_0^{\alpha_n}b_nx^ndx=\tfrac1{n+1}\alpha_n\beta_n$이므로 조건은 삼각형 $\mathrm{C}_n\mathrm{A}_n\mathrm{P}_n$과 $\mathrm{D}_n\mathrm{P}_n\mathrm{B}_n$의 넓이비 $1:n$, 닮음비 $1:\sqrt n$.
stuck: |
  3-2에서 「곡선 아래 넓이 $=\tfrac1{n+1}$×직사각형」을 이용해 남은 조건을 직사각형 밖 두 직각삼각형의 넓이비로 바꾸는 단계
