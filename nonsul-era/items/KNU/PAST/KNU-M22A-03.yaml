stimuli:
- label: (가)
  body: |
    좌표평면 위의 두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$에 대하여 선분 $\mathrm{AB}$를 $m:n$ $(m>0,n>0)$으로 내분하는 점 $\mathrm{P}$의 좌표는
    $$\left(\dfrac{mx_2+nx_1}{m+n},\ \dfrac{my_2+ny_1}{m+n}\right)$$
- label: (나)
  body: |
    좌표평면 위의 점 $(x_1,y_1)$을 지나고 기울기가 $m$인 직선의 방정식은
    $$y-y_1=m(x-x_1)$$
- label: (다)
  body: |
    자연수 $n$에 대한 명제 $p(n)$이 모든 자연수에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.
    (ⅰ) $n=1$일 때 명제 $p(n)$이 성립한다.
    (ⅱ) $n=k$일 때 명제 $p(n)$이 성립한다고 가정하면 $n=k+1$일 때도 명제 $p(n)$이 성립한다.
- label: (라)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(x)\ge0$일 때, 정적분 $\int_a^bf(x)dx$는 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이와 같다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  수열 $\{a_n\}$이
  $$a_1=1,\quad a_{n+1}=\begin{cases}a_n+2 & (n\text{이 홀수인 경우})\\ \dfrac12a_n & (n\text{이 짝수인 경우})\end{cases}\quad(n=1,2,3,\cdots)$$
  으로 정의될 때, 좌표평면 위의 세 점 $\mathrm{O}(0,0)$, $\mathrm{A}_n(a_{2n-1},0)$, $\mathrm{B}_n(0,a_{2n})$에 대하여 삼각형 $\mathrm{OA}_n\mathrm{B}_n$의 넓이를 $S(n)$이라 하자. 자연수 $n$에 대하여 곡선 $y=b_nx^n$과 선분 $\mathrm{A}_n\mathrm{B}_n$의 교점을 $\mathrm{P}_n$이라 하자. 곡선 $y=b_nx^n$과 $x$축 및 선분 $\mathrm{A}_n\mathrm{P}_n$으로 둘러싸인 도형의 넓이가 $\dfrac1{n+1}S(n)$일 때, 다음 물음에 답하시오. 단, $b_n>0$이다.

subparts:
- id: '3-1'
  stem: |
    모든 자연수 $n$에 대하여 $a_{2n-1}=\displaystyle\sum_{k=1}^n\left(\dfrac12\right)^{k-1}$이 성립함을 (다)를 이용하여 증명하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-1-A
    audience: A
    method_no: 1
    key_idea: $a_{2k+1}=\tfrac12a_{2k-1}+1$을 만들고 귀납 가정에 대입.
    steps:
    - {id: 3-1a, content: '$a_{2k+1}=\tfrac12\sum_{i=1}^k(\tfrac12)^{i-1}+1=\sum_{i=1}^{k+1}(\tfrac12)^{i-1}$', criteria: [3-1.R1, 3-1.R2, 3-1.R3]}
    hint_ladder:
    - 홀수 번째 항끼리의 관계 $a_{2k+1}$과 $a_{2k-1}$을 두 단계 점화로 구해 보자.
  - id: S3-1-B
    audience: B
    source_flow: M22_N1.pdf p.11
    method_no: 1
    steps:
    - id: 3-1b-1
      content: |
        $n=1$인 경우, $a_1=1=\left(\dfrac12\right)^0=\displaystyle\sum_{i=1}^1\left(\dfrac12\right)^{i-1}$이 성립한다.
      criteria: [3-1.R1]
    - id: 3-1b-2
      content: |
        $n=k$일 때 $a_{2k-1}=\displaystyle\sum_{i=1}^k\left(\dfrac12\right)^{i-1}$라 가정하자.
      criteria: [3-1.R2]
    - id: 3-1b-3
      content: |
        수열의 규칙으로부터 $a_{2(k+1)-1}=a_{2k+1}=\dfrac12a_{2k}=\dfrac12(a_{2k-1}+2)=\dfrac12a_{2k-1}+1$을 찾을 수 있으며, 가정에 의해 $\dfrac12a_{2k-1}+1=\dfrac12\left(\displaystyle\sum_{i=1}^k\left(\dfrac12\right)^{i-1}\right)+1=\displaystyle\sum_{i=1}^{k+1}\left(\dfrac12\right)^{i-1}$이 되어 $n=k+1$인 경우에도 성립한다. 수학적 귀납법에 의해 $a_{2n-1}=\displaystyle\sum_{k=1}^n\left(\dfrac12\right)^{k-1}$은 모든 자연수 $n$에 대하여 성립한다.
      criteria: [3-1.R3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-1.R1
      mark_type: R
      points: 10
      evidence: $n=1$인 경우 $a_1=1=\sum_{i=1}^1(\tfrac12)^{i-1}$이 성립함을 보였다.
      depends_on: []
      steps: [3-1b-1]
    - id: 3-1.R2
      mark_type: R
      points: 10
      evidence: $n=k$일 때 $a_{2k-1}=\sum_{i=1}^k(\tfrac12)^{i-1}$라 가정했다.
      depends_on: []
      steps: [3-1b-2]
    - id: 3-1.R3
      mark_type: R
      points: 10
      evidence: $n=k+1$인 경우에도 성립함을 보였다.
      depends_on: [3-1.R2]
      steps: [3-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-SEQ-42204}
  misconceptions:
  - id: MC-SEQ-42204
    outcome_code: '71'
    wrong_work: '$n=k+1$ 단계에서 $a_{2k+1}=a_{2k-1}+2$ 또는 $\tfrac12a_{2k-1}$처럼 점화를 한 단계만 적용'
    detect_cue: $a_{2k}$를 거치지 않음
    feedback: $2k-1$은 홀수, $2k$는 짝수이므로 두 규칙을 차례로 적용해야 $a_{2k+1}$이 나옵니다.
    remedy: [RL-1]

- id: '3-2'
  stem: |
    $b_n=c_n\dfrac{a_{2n}}{(a_{2n-1})^n}$을 만족시키는 $c_n$을 구하시오. (50점)
  points: 50
  depends_on: ['3-1']
  answer: {kind: expression, value: '(1 + sqrt(n))**(n - 1)/sqrt(n)**n', equivalents: ['c_n=(1+√n)^(n-1)/(√n)^n'], tolerance: null}
  solutions:
  - id: S3-2-A
    audience: A
    method_no: 1
    key_idea: 곡선 아래 넓이가 직사각형의 $\tfrac1{n+1}$이므로 남은 조건은 $\triangle\mathrm{C}_n\mathrm{A}_n\mathrm{P}_n:\triangle\mathrm{D}_n\mathrm{P}_n\mathrm{B}_n=1:n$, 닮음비 $1:\sqrt n$.
    steps:
    - {id: 3-2a, content: '$\alpha_n=\tfrac{\sqrt n}{1+\sqrt n}a_{2n-1}$, $\beta_n=\tfrac1{1+\sqrt n}a_{2n}$, $b_n=\beta_n/\alpha_n^n$', criteria: [3-2.M1, 3-2.M2, 3-2.A1]}
    hint_ladder:
    - $\int_0^{\alpha}bx^ndx$와 직사각형 $\alpha\cdot b\alpha^n$을 비교해 보자.
    - $S(n)$에서 직사각형을 빼면 어떤 두 도형이 남는가?
  - id: S3-2-B
    audience: B
    source_flow: M22_N1.pdf p.11~12
    method_no: 1
    steps:
    - id: 3-2b-1
      content: |
        점 $\mathrm{P}_n$에서 $x$축과 $y$축에 내린 수선의 발을 각각 점 $\mathrm{C}_n(\alpha_n,0)$, 점 $\mathrm{D}_n(0,\beta_n)$이라 하자. $\beta_n=b_n(\alpha_n)^n$이므로 사각형 $\mathrm{OC}_n\mathrm{P}_n\mathrm{D}_n$의 넓이는 $\alpha_n\beta_n=b_n(\alpha_n)^{n+1}$이다.
        $\displaystyle\int_0^{\alpha_n}b_nx^ndx=\dfrac1{n+1}b_n(\alpha_n)^{n+1}$이므로 곡선 $y=b_nx^n$과 $x$축 및 선분 $\mathrm{P}_n\mathrm{C}_n$으로 둘러싸인 영역의 넓이는 사각형 $\mathrm{OC}_n\mathrm{P}_n\mathrm{D}_n$ 넓이의 $\dfrac1{n+1}$이다.
      criteria: [3-2.M1]
      # [공식표기] 예시답안 「D_n(β_n,0)」 은 (0,β_n) 의 오식
    - id: 3-2b-2
      content: |
        즉, 삼각형 $\mathrm{C}_n\mathrm{A}_n\mathrm{P}_n$과 삼각형 $\mathrm{D}_n\mathrm{P}_n\mathrm{B}_n$의 넓이의 비는 $1:n$이 되어야 한다.
      criteria: [3-2.M2]
    - id: 3-2b-3
      content: |
        두 삼각형은 닮음이므로 닮음비는 $1:\sqrt n$이고, $\alpha_n=\dfrac{\sqrt n}{1+\sqrt n}a_{2n-1}$, $\beta_n=\dfrac1{1+\sqrt n}a_{2n}$이다.
        $\beta_n=b_n(\alpha_n)^n$이므로 $b_n=\dfrac{(1+\sqrt n)^{n-1}}{(\sqrt n)^n}\dfrac{a_{2n}}{(a_{2n-1})^n}$이고, $c_n=\dfrac{(1+\sqrt n)^{n-1}}{(\sqrt n)^n}$이다.
      criteria: [3-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 20
      evidence: $\int_0^{\alpha_n}b_nx^ndx=\dfrac1{n+1}b_n(\alpha_n)^{n+1}$이므로 곡선 $y=b_nx^n$과 $x$축 및 선분 $\mathrm{P}_n\mathrm{C}_n$으로 둘러싸인 영역의 넓이는 사각형 $\mathrm{OC}_n\mathrm{P}_n\mathrm{D}_n$ 넓이의 $\dfrac1{n+1}$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [3-2b-1]
    - id: 3-2.M2
      mark_type: M
      points: 10
      evidence: 삼각형 $\mathrm{C}_n\mathrm{A}_n\mathrm{P}_n$과 삼각형 $\mathrm{D}_n\mathrm{P}_n\mathrm{B}_n$의 넓이의 비가 $1:n$임을 보였다.
      depends_on: [3-2.M1]
      implied_ok: false
      steps: [3-2b-2]
    - id: 3-2.A1
      mark_type: A
      points: 20
      evidence: $c_n=\dfrac{(1+\sqrt n)^{n-1}}{(\sqrt n)^n}$을 구했다.
      depends_on: [3-2.M2]
      cao: true
      steps: [3-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42205}
  misconceptions:
  - id: MC-GEO-42205
    outcome_code: '71'
    wrong_work: '넓이비 $1:n$을 그대로 닮음비로 써서 $\alpha_n=\tfrac{n}{1+n}a_{2n-1}$로 계산'
    detect_cue: 답에 $\sqrt n$이 없고 $(1+n)^{n-1}/n^n$ 꼴
    feedback: 닮은 도형의 넓이비는 닮음비의 제곱입니다. 넓이비 $1:n$이면 닮음비는 $1:\sqrt n$입니다.
    remedy: [RL-2]

- id: '3-3'
  stem: |
    선분 $\mathrm{A}_8\mathrm{B}_8$ 위의 한 점 $\mathrm{Q}$에 대하여 선분 $\mathrm{QP}_9$가 사각형 $\mathrm{A}_8\mathrm{A}_9\mathrm{B}_9\mathrm{B}_8$의 넓이를 이등분할 때, 점 $\mathrm{Q}$의 $x$좌표를 구하시오. (40점)
  points: 40
  depends_on: ['3-2']
  answer: {kind: value, value: '130305/152576', equivalents: [], tolerance: null}
  solutions:
  - id: S3-3-A
    audience: A
    method_no: 1
    key_idea: $a=a_{15}$로 두면 $\mathrm{A}_9(\tfrac12a+1,0)$, $\mathrm{B}_9(0,\tfrac12a+3)$, $\mathrm{B}_8(0,a+2)$, $\mathrm{P}_9$는 $\mathrm{A}_9\mathrm{B}_9$의 $1:3$ 내분점. 넓이 분할식을 $q$의 일차식으로 풀기.
    steps:
    - {id: 3-3a, content: '$q=\dfrac{3a(a+2)}{4(2a+3)}$, $a=2-(\tfrac12)^7$ 대입 → $\dfrac{130305}{152576}$', criteria: [3-3.M1, 3-3.M2, 3-3.A1]}
    hint_ladder:
    - $\mathrm{A}_9$, $\mathrm{B}_9$, $\mathrm{B}_8$의 좌표를 $a=a_{15}$로 나타내 보자.
    - 3-2에서 $n=9$이면 $\mathrm{P}_9$는 선분 $\mathrm{A}_9\mathrm{B}_9$를 어떤 비로 내분하는가?
  - id: S3-3-B
    audience: B
    source_flow: M22_N1.pdf p.12
    method_no: 1
    steps:
    - id: 3-3b-1
      content: |
        점 $\mathrm{A}_8$의 $x$좌표를 $a$라 하면 수열의 규칙성에 의해 $\mathrm{B}_8(0,a+2)$, $\mathrm{A}_9\left(\dfrac12a+1,0\right)$, $\mathrm{B}_9\left(0,\dfrac12a+3\right)$을 구할 수 있다. 점 $\mathrm{P}_9$는 선분 $\mathrm{A}_9\mathrm{B}_9$를 $1:3$으로 내분하는 점이므로 $\left(\dfrac38a+\dfrac34,\ \dfrac18a+\dfrac34\right)$이다. 점 $\mathrm{Q}$의 $x$좌표를 $q$라 하고, $\mathrm{Q}$에서 $x$축과 $y$축에 내린 수선의 발을 각각 $\mathrm{H}_1$, $\mathrm{H}_2$라 하자. 점 $\mathrm{P}_9$에서 $x$축에 내린 수선의 발을 $\mathrm{H}_3$라 하자.
        두 점 $\mathrm{A}_8$과 $\mathrm{B}_8$을 지나는 직선의 방정식이 $y=-\dfrac{a+2}ax+a+2$이므로 $\mathrm{Q}\left(q,-\dfrac{a+2}aq+a+2\right)$, $\mathrm{H}_1(q,0)$, $\mathrm{H}_2\left(0,-\dfrac{a+2}aq+a+2\right)$임을 알 수 있다.
      criteria: [3-3.M1]
    - id: 3-3b-2
      content: |
        (사각형 $\mathrm{A}_8\mathrm{A}_9\mathrm{B}_9\mathrm{B}_8$의 넓이) $=$ (삼각형 $\mathrm{OA}_9\mathrm{B}_9$의 넓이) $-$ (삼각형 $\mathrm{OA}_8\mathrm{B}_8$의 넓이) $=-\dfrac{3(a+2)(a-2)}8$이므로 사각형 $\mathrm{A}_8\mathrm{A}_9\mathrm{P}_9\mathrm{Q}$의 넓이는 $-\dfrac{3(a+2)(a-2)}{16}$이다.
      criteria: [3-3.M1]
    - id: 3-3b-3
      content: |
        한편, (사각형 $\mathrm{A}_8\mathrm{A}_9\mathrm{P}_9\mathrm{Q}$의 넓이) $=$ (삼각형 $\mathrm{H}_3\mathrm{A}_9\mathrm{P}_9$의 넓이) $+$ (사각형 $\mathrm{H}_1\mathrm{H}_3\mathrm{P}_9\mathrm{Q}$의 넓이) $-$ (삼각형 $\mathrm{H}_1\mathrm{A}_8\mathrm{Q}$의 넓이)이므로 $-\dfrac{3(a+2)(a-2)}{32}=-\dfrac{(a-2)(2a+3)}{8a}q$을 얻을 수 있다.
      criteria: [3-3.M2]
    - id: 3-3b-4
      content: |
        즉, 점 $\mathrm{Q}$의 $x$좌표는 $\dfrac{3a(a+2)}{4(2a+3)}$이다. $a=\displaystyle\sum_{i=1}^8\left(\dfrac12\right)^{i-1}=2-\left(\dfrac12\right)^7$이므로 $\dfrac{3a(a+2)}{4(2a+3)}=\dfrac{130305}{152576}$이다.
      criteria: [3-3.A1]
