stimuli:
- label: (가)
  body: |
    $x=a$에서 함수 $f(x)$의 우극한과 좌극한이 모두 존재하고, 그 값이 모두 $L$이면 $\lim_{x\to a}f(x)=L$이다.
- label: (나)
  body: |
    함수 $y=f(x)$의 $x=a$에서의 미분계수는
    $$f'(a)=\lim_{x\to a}\dfrac{f(x)-f(a)}{x-a}$$
- label: (다)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면 $f(a)$와 $f(b)$ 사이에 있는 임의의 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: (라)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능하면
    $$\dfrac{f(b)-f(a)}{b-a}=f'(c)$$
    인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: (마)
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는
    $$\{f(g(x))\}'=f'(g(x))g'(x)$$

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  양의 실수 $a$, $b$와 음의 실수 $c$, $d$에 대하여 실수 전체의 집합에서 정의된 함수
  $$f(x)=\begin{cases}-(ax+b)^2+c & \left(x<-\dfrac ba\right)\\ \dfrac a3x^3+\dfrac b2x^2+d & \left(-\dfrac ba\le x<1\right)\\ -(x-1)(3x-11)e^{-x+1} & (x\ge1)\end{cases}$$
  과 함수
  $$g(x)=f(x)-(f\circ f)(x)$$
  가 다음 조건을 만족시킨다.

  (ㄱ) 함수 $f(x)$는 실수 전체 집합에서 미분가능하다.
  (ㄴ) $x<1$에서 함수 $g(x)$는 극대 또는 극소가 되는 양의 실수 $x$와 음의 실수 $x$가 오직 한 개씩 존재하고, 두 극값은 동일하다.

subparts:
- id: '1-1'
  stem: |
    $b+6d$의 값을 구하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '-16', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: $x=1$에서 연속·미분가능.
    steps:
    - {id: 1-1a, content: '$a+b=8$, $d=-\tfrac a3-\tfrac b2$ ⇒ $b+6d=-2(a+b)=-16$', criteria: [1-1.M1, 1-1.A1]}
    hint_ladder:
    - $x=1$에서 가운데 식과 오른쪽 식의 값·미분계수를 맞추자.
  - id: S1-1-B
    audience: B
    source_flow: M22_N2.pdf p.6
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        $x=1$에서 함수 $f(x)$는 미분가능하므로,
        $\dfrac a3+\dfrac b2+d=0\Rightarrow d=-\dfrac a3-\dfrac b2$, $a+b=-(-3x^2+20x-25)e^{-x+1}\big|_{x=1}=8$
      criteria: [1-1.M1]
    - id: 1-1b-2
      content: |
        $\therefore b+6d=(8-a)+(-2a-3b)=-16$.
      criteria: [1-1.A1]
      # [공식표기] 예시답안의 중간식 (8-a)+(-2a-3b) 는 b+6d=b-2a-3b 를 a+b=8 로 정리하는 과정의 표기(값 -16 일치)
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: $a+b$의 값 또는 미분값 $-(-3x^2+20x-25)e^{-x+1}\big|_{x=1}$을 정확히 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: $b+6d$의 값($-16$)을 정확히 구했다.
      depends_on: [1-1.M1]
      cao: true
      steps: [1-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42216}
  misconceptions:
  - id: MC-CAL-42216
    outcome_code: '71'
    wrong_work: '$x\ge1$ 식의 미분에서 $e^{-x+1}$의 미분 $-e^{-x+1}$ 항을 빠뜨려 $a+b=-(6x-14)|_{x=1}=8$은 맞지만 일반식을 틀리거나, 부호를 틀려 $a+b=-8$'
    detect_cue: $a+b=-8$ 또는 $b+6d=16$
    feedback: 곱의 미분 $\{-(x-1)(3x-11)\}'e^{-x+1}+\{-(x-1)(3x-11)\}(-e^{-x+1})$를 정리하면 $-(-3x^2+20x-25)e^{-x+1}$입니다.
    remedy: [RL-1]

- id: '1-2(1)'
  stem: |
    다음 물음에 답하시오. 단, $(1.1)^3<e^2<8$이다.
    (1) $x=\alpha$에서 함수 $f(x)$는 극값을 가질 때, $\alpha<f(\alpha)<\dfrac{11}3$임을 보이시오. 단, $1<\alpha<\dfrac{11}3$이다. (20점)
  points: 20
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-1-A
    audience: A
    method_no: 1
    key_idea: $x\ge1$에서 $f'(x)=(3x-5)(x-5)e^{-x+1}$이므로 $\alpha=\tfrac53$, $f(\tfrac53)=4e^{-2/3}$를 $e^2$의 범위로 평가.
    steps:
    - {id: 1-2-1a, content: '$(\tfrac{12}{11})^3<e^2<(\tfrac{12}5)^3\iff\tfrac53<4e^{-2/3}<\tfrac{11}3$', criteria: [1-2(1).R1, 1-2(1).R2]}
    hint_ladder:
    - $x\ge1$에서 $f'(x)$를 인수분해해 극값점을 찾자.
    - $f(\tfrac53)<\tfrac{11}3$은 $e^2$에 대한 어떤 부등식과 같은가?
  - id: S1-2-1-B
    audience: B
    source_flow: M22_N2.pdf p.6
    method_no: 1
    steps:
    - id: 1-2-1b-1
      content: |
        $\left(-(x-1)(3x-11)e^{-x+1}\right)'=(3x-5)(x-5)e^{-x+1}$이므로 $\alpha=\dfrac53$.
      criteria: [1-2(1).R1]
      # [공식해설 확인필요] 예시답안 원문은 「=−(3x−5)(x−5)e^{−x+1}」 — 부호 오식으로 보임(1-1 의 −(−3x²+20x−25)e^{−x+1} 및 f'(1)=8 과 일치하려면 부호 +). α=5/3 결론은 동일
    - id: 1-2-1b-2
      content: |
        $\therefore\left(\dfrac{12}{11}\right)^3<\left(\dfrac{11}{10}\right)^3<e^2<2^3<\left(\dfrac{12}5\right)^3\Rightarrow\left(\dfrac{12}{11}\right)^3<e^2<\left(\dfrac{12}5\right)^3\iff\dfrac53<f\left(\dfrac53\right)<\dfrac{11}3$.
      criteria: [1-2(1).R1, 1-2(1).R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2(1).R1
      mark_type: R
      points: 10
      evidence: 부등식 $\dfrac53<f\left(\dfrac53\right)$을 정확히 보였다.
      depends_on: []
      steps: [1-2-1b-1, 1-2-1b-2]
    - id: 1-2(1).R2
      mark_type: R
      points: 10
      evidence: 부등식 $f\left(\dfrac53\right)<\dfrac{11}3$을 정확히 보였다.
      depends_on: []
      steps: [1-2-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42217}
  misconceptions:
  - id: MC-CAL-42217
    outcome_code: '71'
    wrong_work: '$f(\tfrac53)=4e^{-2/3}$을 $e\approx2.7$ 근삿값으로만 비교(주어진 부등식 $(1.1)^3<e^2<8$ 미사용)'
    detect_cue: 소수 근삿값만으로 결론
    feedback: 논증형 문항에서는 주어진 부등식 $(1.1)^3<e^2<8$을 세제곱 형태로 바꿔 엄밀히 비교해야 합니다.
    remedy: [RL-2]

- id: '1-2(2)'
  stem: |
    (2) $1<x<\dfrac{11}3$에서 함수 $g(x)$가 극값을 가지는 서로 다른 실수 $x$가 다섯 개 존재함을 보이시오. (20점)
  points: 20
  depends_on: ['1-2(1)']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-2-2-A
    audience: A
    method_no: 1
    key_idea: $g'=(1-f'(f(x)))f'(x)$; $x=\tfrac53$ 하나 + $f(x)=y_1$, $f(x)=y_2$가 각각 두 개($\ne\tfrac53$) + $f(x)=y_3$은 없음.
    steps:
    - {id: 1-2-2a, content: '$1+2+2=5$개', criteria: [1-2(2).R1, 1-2(2).R2]}
    hint_ladder:
    - $g'(x)=0$이 되는 두 가지 경우를 나누자.
    - $f'(y)=1$인 $y$는 몇 개이고 각각 어느 범위에 있는가?
  - id: S1-2-2-B
    audience: B
    source_flow: M22_N2.pdf p.6~7
    method_no: 1
    steps:
    - id: 1-2-2b-1
      content: |
        조건으로부터 $x<0$이면 $f(x)<0$이다. $g'(x)=(1-f'(f(x)))f'(x)\Rightarrow f'(f(x))=1$ 또는 $f'(x)=0$로부터 $f(x)=y_1,y_2,y_3$, $f'(y_i)=1$, $0<y_1<1$, $1<y_2<\dfrac53$, $5<y_3$인 $x$와 $x=\dfrac53$에서 극대 또는 극소가 된다.
      criteria: [1-2(2).R1]
    - id: 1-2-2b-2
      content: |
        함숫값 $y_1$, $y_2$에 대하여 각각 두 개씩의 실수 $x$ $(\ne\tfrac53)$가 존재하지만, $f\left(\dfrac53\right)<\dfrac{11}3$이므로 함숫값이 $y_3$인 $x$는 존재하지 않는다. 그러므로, $5$개 존재한다.
      criteria: [1-2(2).R1, 1-2(2).R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2(2).R1
      mark_type: R
      points: 10
      evidence: 함숫값 $y_1$, $y_2$에 대하여 각각 두 개씩의 실수 $x$ $(\ne\tfrac53)$가 존재함을 보이거나 함숫값이 $y_3$인 $x$가 존재하지 않음을 설명했다.
      depends_on: []
      steps: [1-2-2b-1, 1-2-2b-2]
    - id: 1-2(2).R2
      mark_type: R
      points: 10
      evidence: 모두 다섯 개 점이 존재함을 설명했다.
      depends_on: [1-2(2).R1]
      steps: [1-2-2b-2]
    deductions: []
