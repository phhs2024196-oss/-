    wrong_work: '$g''(x)=0$을 $f''(x)=0$인 점($x=\tfrac53$)만으로 보고 $f''(f(x))=1$인 경우를 놓침'
    detect_cue: 극값점 개수를 1개 또는 3개로 답함
    feedback: 합성함수의 미분 $g'=(1-f'(f(x)))f'(x)$에서 앞 인수가 $0$인 경우도 극값점 후보입니다.
    remedy: [RL-3]

- id: '1-3'
  stem: |
    실수 $b$는 등식 $b^2+pb+\dfrac{1021}6=0$을 만족시킨다. 정수 $p$를 구하시오. (60점)
  points: 60
  depends_on: ['1-1']
  answer: {kind: value, value: '-40', equivalents: [], tolerance: null}
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: 극값이 같다는 조건과 유일성으로 $f(t)=f(-\tfrac ba)$ ⇒ $f'(f(-\tfrac ba))=1$ ⇒ $2a(ac+b)+1=0$; 연속 조건 $c=-\tfrac{b^3}{3a^2}+\tfrac{b^3}{2a^2}+d$와 1-1을 연립.
    steps:
    - {id: 1-3a, content: '$b^2-40b+\tfrac{1021}6=0$ ⇒ $p=-40$', criteria: [1-3.M1, 1-3.A1]}
    hint_ladder:
    - $x<1$에서 $g$의 음의 극값점은 어디인가? ($f'=0$인 점)
    - 양의 극값점 $t$에서 $f'(f(t))=1$이다. $f(t)$와 $f(-\tfrac ba)$의 대소를 나눠 모순을 찾자.
  - id: S1-3-B
    audience: B
    source_flow: M22_N2.pdf p.7
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        $g'(x)=(1-f'(f(x)))f'(x)$로부터 $x=-\dfrac ba$에서 함수 $g(x)$는 극값을 가지고 조건으로부터 $x=t$, $t\in(0,1)$에서 유일한 극값을 갖는다. 그런데, $f'(x)\ne0$, $0<x<1$이므로, $1-f'(f(t))=0$.
        ① $f(t)<f\left(-\dfrac ba\right)$이면 $f(t)=f(c)$, $c\in\left(-\infty,-\dfrac ba\right)$인 $c$가 존재하여 조건에 모순이다.
        ② $f(t)>f\left(-\dfrac ba\right)$이라 하자. 조건으로부터 $g(t)=g\left(-\dfrac ba\right)\Rightarrow\dfrac{f(f(t))-f\left(f\left(-\frac ba\right)\right)}{f(t)-f\left(-\frac ba\right)}=1$이므로 평균값 정리에 의해 $f'(s)=1$, $s\in\left(f\left(-\dfrac ba\right),f(t)\right)$인 $s$가 존재한다. 사잇값 정리에 의해 $s=f(s')$, $s'\in(0,t)$인 $s'$이 존재한다. 이는 조건에 모순이다.
      criteria: [1-3.M1]
      # [공식표기] ① 의 「f(t)=f(c), c∈(−∞,−b/a)」 에서 c 는 문제의 상수 c 와 다른 임시 변수(원문 그대로)
    - id: 1-3b-2
      content: |
        ①과 ②로부터, $f(t)=f\left(-\dfrac ba\right)\Rightarrow2a\left(af\left(-\dfrac ba\right)+b\right)+1=0\Rightarrow2a(ac+b)+1=0$.
        그리고, $x=-\dfrac ba$에서 함수 $f(x)$는 연속이므로, $c=-\dfrac{b^3}{3a^2}+\dfrac{b^3}{2a^2}+d$.
        두 식을 $a+b=8$, $d=-\dfrac16b-\dfrac83$과 연립하면, $b$에 대한 이차 방정식 $b^2-40b+\dfrac{1021}6=0$. $p=-40$.
      criteria: [1-3.A1]
