intent: |
  구간별로 정의된 함수의 미분가능 조건으로 계수 관계를 구하고(1-1), 지수함수가 포함된 함수의 극값을 부등식으로 평가하며(1-2(1)), 합성함수 $g=f-f\circ f$의 극값점 개수를 사잇값 정리로 세고(1-2(2)), 극값 조건과 평균값 정리를 이용한 귀류로 계수를 결정할 수 있는지(1-3) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 채점기준으로 요약)
key_idea: |
  $x=1$에서 미분가능: $a+b=8$, 연속: $\tfrac a3+\tfrac b2+d=0$ ⇒ $b+6d=-16$. $g'(x)=(1-f'(f(x)))f'(x)$이므로 극값점은 $f'(x)=0$ 또는 $f'(f(x))=1$인 점. $x<1$의 음의 극값점은 $x=-\tfrac ba$, 양의 극값점 $t\in(0,1)$은 $f'(f(t))=1$. 두 극값이 같다는 조건에서 $f(t)=f(-\tfrac ba)$를 귀류로 보이면 $2a(ac+b)+1=0$.
stuck: |
  1-3에서 $f(t)>f(-\tfrac ba)$이면 $g(t)=g(-\tfrac ba)$로부터 $\dfrac{f(f(t))-f(f(-b/a))}{f(t)-f(-b/a)}=1$, 평균값 정리로 $f'(s)=1$인 $s$, 다시 사잇값 정리로 $s=f(s')$ $(s'\in(0,t))$가 생겨 극값점 유일성에 모순이 되는 고리
