stimuli:
- label: (가)
  body: |
    미분가능한 함수 $f(x)$의 역함수 $f^{-1}(x)$가 존재하고 미분가능할 때, $y=f^{-1}(x)$의 도함수는
    $$(f^{-1})'(x)=\dfrac1{f'(y)}\quad(\text{단, }f'(y)\ne0)$$
- label: (나)
  body: |
    미분가능한 함수 $t=g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$에서 연속이고, 함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때, $g(\alpha)=a$, $g(\beta)=b$이면
    $$\int_a^bf(t)\,dt=\int_\alpha^\beta f(g(x))g'(x)\,dx$$
- label: (다)
  body: |
    함수 $f(x)$가 임의의 세 실수 $a$, $b$, $c$를 포함하는 닫힌구간에서 연속일 때,
    $$\int_a^bf(x)\,dx+\int_b^cf(x)\,dx=\int_a^cf(x)\,dx$$
- label: (라)
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(x)\le g(x)$일 때,
    $$\int_a^bf(x)\,dx\le\int_a^bg(x)\,dx$$
- label: (마)
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는
    $$\{f(g(x))\}'=f'(g(x))g'(x)$$
- label: (바)
  body: |
    세 함수 $f(x)$, $g(x)$, $h(x)$에 대하여 $f(x)\le h(x)\le g(x)$이고
    $$\lim_{x\to\infty}f(x)=\lim_{x\to\infty}g(x)=\alpha\quad(\alpha\text{는 실수})$$
    이면
    $$\lim_{x\to\infty}h(x)=\alpha$$

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  실수 전체 집합에서 정의된 함수 $f(x)$는 이계도함수를 갖는 증가함수이고, $f(0)=0$이다. $f(x)$의 역함수를 $g(x)$라고 할 때, $g(x)$는 실수 전체 집합에서 정의되고 이계도함수를 갖는다. 실수 전체 집합에서 정의된 함수
  $$h(x)=\int_0^x\{1+(g'(t))^4\}^{\frac14}dt-\int_0^x\{1+(f'(t))^4\}^{\frac14}dt$$
  에 대하여 다음 물음에 답하시오.

subparts:
- id: '2-1'
  stem: |
    $h(\alpha)=0$을 만족하는 양의 실수 $\alpha$에 대하여 $f(\alpha)=\alpha$임을 증명하시오. (50점)
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: 치환 $t=g(s)$로 $h(x)=\int_{f(x)}^x\{1+(g')^4\}^{1/4}dt$, 피적분함수 $\ge1$로 귀류.
    steps:
    - {id: 2-1a, content: '$f(\alpha)<\alpha$이면 $h(\alpha)\ge\alpha-f(\alpha)>0$, $f(\alpha)>\alpha$이면 $h(\alpha)\le-(f(\alpha)-\alpha)<0$', criteria: [2-1.M1, 2-1.R1]}
    hint_ladder:
    - 두 번째 적분에서 $t=g(s)$로 치환해 보자.
    - 피적분함수 $\{1+u^4\}^{1/4}$의 최솟값은?
  - id: S2-1-B
    audience: B
    source_flow: M22_N2.pdf p.8
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        두번째 항인 $\int_0^x\{1+(f'(t))^4\}^{\frac14}dt$에 대해 치환적분 $t=g(s)$를 적용하자. $f(x)$가 증가함수이므로 역함수 $g(x)$도 증가함수이고, 따라서 $g'(x)>0$이다. 또한, $f(0)=0$이므로,
        $$\int_0^x\{1+(f'(t))^4\}^{\frac14}dt=\int_0^{f(x)}\left\{1+\left(\dfrac1{g'(s)}\right)^4\right\}^{\frac14}g'(s)ds=\int_0^{f(x)}\{1+(g'(s))^4\}^{\frac14}ds$$
        를 얻는다. 따라서,
        $$h(x)=\int_0^x\{1+(g'(t))^4\}^{\frac14}dt-\int_0^{f(x)}\{1+(g'(t))^4\}^{\frac14}dt=\int_{f(x)}^x\{1+(g'(t))^4\}^{\frac14}dt$$
        임을 알 수 있다.
      criteria: [2-1.M1]
    - id: 2-1b-2
      content: |
        $h(\alpha)=0$을 만족하는 양의 실수 $\alpha$에 대하여, 만약 $f(\alpha)<\alpha$이면,
        $$h(\alpha)=\int_{f(\alpha)}^\alpha\{1+(g'(t))^4\}^{\frac14}dt\ge\int_{f(\alpha)}^\alpha1\,dt=\alpha-f(\alpha)>0$$
        이므로 모순이다. 만약 $f(\alpha)>\alpha$이면,
        $$h(\alpha)=-\int_\alpha^{f(\alpha)}\{1+(g'(t))^4\}^{\frac14}dt\le-\int_\alpha^{f(\alpha)}1\,dt=-(f(\alpha)-\alpha)<0$$
        이므로 모순이다. 따라서 $f(\alpha)=\alpha$임을 알 수 있다.
      criteria: [2-1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 30
      evidence: $h(x)=\displaystyle\int_{f(x)}^x\{1+(g'(t))^4\}^{\frac14}dt$를 유도했다.
      depends_on: []
      implied_ok: false
      steps: [2-1b-1]
    - id: 2-1.R1
      mark_type: R
      points: 20
      evidence: $f(\alpha)=\alpha$임을 보였다.
      depends_on: [2-1.M1]
      steps: [2-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42220}
  misconceptions:
  - id: MC-CAL-42220
    outcome_code: '71'
    wrong_work: '치환 $t=g(s)$에서 적분 구간을 $0$부터 $x$ 그대로 두거나 $dt=g''(s)ds$를 빠뜨림'
    detect_cue: 적분 끝이 $f(x)$로 바뀌지 않음
    feedback: $t=g(s)$이면 $t=x$일 때 $s=f(x)$입니다. 끝값과 $dt=g'(s)ds$를 함께 바꾸세요.
    remedy: [RL-1]

- id: '2-2'
  stem: |
    $h(\beta)=0$, $h'(\beta)=0$, $h''(\beta)=-2^{\frac94}$을 만족하는 양의 실수 $\beta$에 대하여 $f''(\beta)$의 값을 구하시오. (30점)
  points: 30
  depends_on: ['2-1']
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $f(\beta)=\beta=g(\beta)$, $h'(\beta)=0$에서 $f'(\beta)=g'(\beta)=1$, $g''(\beta)=-f''(\beta)$이므로 $h''(\beta)=-2\cdot2^{-3/4}f''(\beta)$.
    steps:
    - {id: 2-2a, content: '$-2^{9/4}=-2^{1/4}f''''(\beta)$ ⇒ $f''''(\beta)=4$', criteria: [2-2.M1, 2-2.A1]}
    hint_ladder:
    - $h'(\beta)=0$이면 $f'(\beta)$와 $g'(\beta)$는 어떤 관계인가? 역함수 관계까지 쓰면?
    - $f(g(x))=x$를 두 번 미분해 $g''$을 $f''$로 나타내자.
  - id: S2-2-B
    audience: B
    source_flow: M22_N2.pdf p.9
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        $h(x)=\int_0^x\{1+(g'(t))^4\}^{\frac14}dt-\int_0^x\{1+(f'(t))^4\}^{\frac14}dt$이므로 $h'(x)=\{1+(g'(x))^4\}^{\frac14}-\{1+(f'(x))^4\}^{\frac14}$이고,
        $$h''(x)=\{1+(g'(x))^4\}^{-\frac34}(g'(x))^3g''(x)-\{1+(f'(x))^4\}^{-\frac34}(f'(x))^3f''(x)$$
        이다. 우선, $h(\beta)=0$으로부터 $f(\beta)=\beta=g(\beta)$임을 알 수 있다.
        $h'(\beta)=0$으로부터 $f'(\beta)=g'(\beta)$를 알 수 있고, 역함수의 도함수 성질로부터 $g'(\beta)=\dfrac1{f'(\beta)}$임을 알 수 있다. 따라서 $f'(\beta)=g'(\beta)=1$을 얻는다.
      criteria: [2-2.M1]
    - id: 2-2b-2
      content: |
        또한, $g(x)$는 $f(x)$의 역함수이므로 모든 실수 $x$에 대해 $f(g(x))=x$가 성립하고, 양변의 이계도함수를 계산하면 $f''(g(x))(g'(x))^2+f'(g(x))g''(x)=0$을 얻는다. 여기에 $x=\beta$를 대입하면 $g''(\beta)=-f''(\beta)$를 얻을 수 있다. 한편 $h''(\beta)=-2^{\frac94}$이므로,
        $$-2^{\frac94}=h''(\beta)=\{1+(g'(\beta))^4\}^{-\frac34}(g'(\beta))^3g''(\beta)-\{1+(f'(\beta))^4\}^{-\frac34}(f'(\beta))^3f''(\beta)=-2\times2^{-\frac34}f''(\beta)$$
        임을 알 수 있다. 이로부터 $f''(\beta)=4$를 얻는다.
      criteria: [2-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 10
      evidence: $f'(\beta)=g'(\beta)=1$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2-2b-1]
    - id: 2-2.A1
      mark_type: A
      points: 20
      evidence: $f''(\beta)=4$를 구했다.
      depends_on: [2-2.M1]
      cao: true
      steps: [2-2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42221}
  misconceptions:
  - id: MC-CAL-42221
    outcome_code: '71'
    wrong_work: '$g''''(\beta)=f''''(\beta)$ 또는 $g''''=\tfrac1{f''''}$로 두어 $h''''(\beta)=0$ 등 모순, 혹은 $f''''(\beta)=2$'
    detect_cue: $g''$을 $f''$로 바꾸는 근거가 역함수 관계의 이계 미분이 아님
    feedback: $f(g(x))=x$를 두 번 미분하면 $f''(g)(g')^2+f'(g)g''=0$이므로 $f'=g'=1$인 점에서 $g''=-f''$입니다.
    remedy: [RL-2]

- id: '2-3'
  stem: |
    $\displaystyle\lim_{x\to\infty}\dfrac{f(x)}x=1$일 때, $\displaystyle\lim_{x\to\infty}\dfrac{h(x)}x=0$임을 보이시오. (40점)
  points: 40
  depends_on: ['2-1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-3-A
    audience: A
    method_no: 1
    key_idea: $g'\le\{1+(g')^4\}^{1/4}\le1+g'$를 $f(x)$부터 $x$까지 적분 → $0\le|h-g+x|\le|x-f|$, 그리고 $\tfrac{g(x)}x\to1$.
    steps:
    - {id: 2-3a, content: '$\left|\tfrac hx-\tfrac gx+1\right|\le\left|1-\tfrac fx\right|\to0$, $\tfrac gx\to1$ ⇒ $\tfrac hx\to0$', criteria: [2-3.M1, 2-3.M2, 2-3.R1]}
    hint_ladder:
    - 양수 $u$에 대해 $\{1+u^4\}^{1/4}$를 $u$와 $1+u$ 사이에 끼워 보자.
    - $\int_{f(x)}^xg'(t)dt$는 무엇인가?
  - id: S2-3-B
    audience: B
    source_flow: M22_N2.pdf p.9~10
    method_no: 1
    steps:
    - id: 2-3b-1
      content: |
        위에서 구한 식 $h(x)=\int_{f(x)}^x\{1+(g'(t))^4\}^{\frac14}dt$를 이용하자. 임의의 실수 $t$에 대해 $g'(t)>0$이므로, $(g'(t))^4\le1+(g'(t))^4\le(1+g'(t))^4$가 성립한다. 따라서 임의의 실수 $t$에 대해 $g'(t)\le\{1+(g'(t))^4\}^{\frac14}\le1+g'(t)$가 성립한다.
      criteria: [2-3.M1]
    - id: 2-3b-2
      content: |
        이로부터 $x\ge f(x)$인 경우
        $$\int_{f(x)}^xg'(t)dt\le h(x)=\int_{f(x)}^x\{1+(g'(t))^4\}^{\frac14}dt\le\int_{f(x)}^x(1+g'(t))dt$$
        이다. 한편, $\int_{f(x)}^xg'(t)dt=g(x)-g(f(x))=g(x)-x$, $\int_{f(x)}^x(1+g'(t))dt=(x-f(x))+(g(x)-g(f(x)))=g(x)-f(x)$이므로, 부등식 $0\le h(x)-g(x)+x\le x-f(x)$ $\cdots(*)$가 성립한다. $x<f(x)$인 경우는
        $$-\int_x^{f(x)}(1+g'(t))dt\le h(x)=-\int_x^{f(x)}\{1+(g'(t))^4\}^{\frac14}dt\le-\int_x^{f(x)}g'(t)dt$$
        로부터, 부등식 $x-f(x)\le h(x)-g(x)+x\le0$ $\cdots(**)$가 성립한다.
      criteria: [2-3.M2]
      # [공식표기] 예시답안 「g(x)−g(f(x))=g(x)−, x」 는 g(x)−x 의 조판 오류
    - id: 2-3b-3
      content: |
        그러므로, 부등식 $(*)$, $(**)$로부터 임의의 양의 실수 $x$에 대해 $0\le\left|\dfrac{h(x)}x-\dfrac{g(x)}x+1\right|\le\left|1-\dfrac{f(x)}x\right|$를 얻고, 문제 조건의 $\lim_{x\to\infty}\dfrac{f(x)}x=1$로부터 $\lim_{x\to\infty}\left(\dfrac{h(x)}x-\dfrac{g(x)}x+1\right)=0$임을 알 수 있다.
        한편, $\lim_{x\to\infty}f(x)=\lim_{x\to\infty}\dfrac{f(x)}x\,x=\infty$를 이용하면 $\lim_{x\to\infty}\dfrac{g(x)}x=\lim_{s\to\infty}\dfrac s{f(s)}=1$이므로,
        $$\lim_{x\to\infty}\dfrac{h(x)}x=\lim_{x\to\infty}\left(\dfrac{g(x)}x-1\right)=0$$
        임을 알 수 있다.
      criteria: [2-3.R1]
  rubric:
