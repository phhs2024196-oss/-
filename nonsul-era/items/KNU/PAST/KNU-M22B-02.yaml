intent: |
  역함수의 도함수와 치환적분으로 두 적분을 하나로 합치고(2-1), 이계도함수 계산으로 함수값을 결정하며(2-2), 적분 부등식과 극한의 대소 관계로 극한을 증명할 수 있는지(2-3) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 채점기준으로 요약)
key_idea: |
  $t=g(s)$로 치환하면 $\int_0^x\{1+(f')^4\}^{1/4}dt=\int_0^{f(x)}\{1+(g')^4\}^{1/4}ds$이므로 $h(x)=\int_{f(x)}^x\{1+(g'(t))^4\}^{1/4}dt$. 피적분함수 $\ge1$이므로 $h(\alpha)=0$이면 $f(\alpha)=\alpha$. 또한 $g'\le\{1+(g')^4\}^{1/4}\le1+g'$로 $h(x)$를 $g(x)-x$ 근방에 가둔다.
stuck: |
  2-1에서 $\{1+(f'(g(s)))^4\}^{1/4}g'(s)=\{1+(g'(s))^4\}^{1/4}$($f'(g(s))=1/g'(s)$)로 두 적분을 같은 피적분함수로 바꾸는 단계
idea_tags: [IDEA-INVERSE-SUBSTITUTION-MERGE-INTEGRALS, IDEA-INTEGRAND-LOWER-BOUND-ONE, IDEA-SQUEEZE-INTEGRAND-BOUNDS]
