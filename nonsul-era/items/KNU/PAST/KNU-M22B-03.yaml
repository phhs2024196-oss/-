- label: (가)
  body: |
    좌표평면 위의 두 점 $\mathrm{A}(x_1,y_1)$과 $\mathrm{B}(x_2,y_2)$ 사이의 거리는
    $$\overline{\mathrm{AB}}=\sqrt{(x_1-x_2)^2+(y_1-y_2)^2}$$
- label: (나)
  body: |
    $0<\theta<\dfrac\pi2$일 때, 그림으로부터 삼각형 $\mathrm{OBC}$, 부채꼴 $\mathrm{OCD}$, 삼각형 $\mathrm{ODE}$의 넓이 사이에 다음 관계가 성립한다.
    (△OBC의 넓이)$\le$(부채꼴 OCD의 넓이)$\le$(△ODE의 넓이)
  # [그림: 중심 O, 반지름 OD 인 부채꼴 OCD(중심각 θ), C 에서 OD 에 내린 수선의 발 B, D 에서의 접선과 OC 연장선의 교점 E]

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  임의의 실수 $a$에 대하여 $y$축 위의 점 $(0,a)$와 이차곡선 $P:y=x^2$ 위의 점 사이의 거리의 최솟값을 $r(a)$라고 하자.

subparts:
- id: '3-1'
  stem: |
    다음 정적분을 구하시오. (40점)
    $$\int_{-1}^1\{r(a)\}^2da$$
  points: 40
  depends_on: []
  answer: {kind: value, value: '5/8', equivalents: [], tolerance: null}
  solutions:
  - id: S3-1-A
    audience: A
    method_no: 1
    key_idea: $\{r(a)\}^2=a^2$ ($a<\tfrac12$), $a-\tfrac14$ ($a\ge\tfrac12$).
    steps:
    - {id: 3-1a, content: '$\int_{-1}^{1/2}a^2da+\int_{1/2}^1(a-\tfrac14)da=\tfrac38+\tfrac14=\tfrac58$', criteria: [3-1.M1, 3-1.M2, 3-1.A1]}
    hint_ladder:
    - 거리의 제곱을 $x^2$에 대한 이차식으로 보자.
    - 꼭짓점 $x^2=a-\tfrac12$가 $0$ 이상인지에 따라 경우를 나누자.
  - id: S3-1-B
    audience: B
    source_flow: M22_N2.pdf p.11~12
    method_no: 1
    steps:
    - id: 3-1b-1
      content: |
        점 $(0,a)$에서 곡선 $P$위의 점 $(x,x^2)$까지의 거리 $\sqrt{x^2+(x^2-a)^2}$가 최솟값 $r(a)$일 때, 함수 $f(x)=x^2+(x^2-a)^2=x^4+(1-2a)x^2+a^2$가 최솟값 $\{r(a)\}^2$을 가진다.
      criteria: [3-1.M1]
    - id: 3-1b-2
      content: |
        $a\ge\dfrac12$이면 $x^2=-\dfrac{1-2a}2=a-\dfrac12\ge0\iff x=\pm\sqrt{a-\dfrac12}$에서 $f(x)$는 최솟값 $a-\dfrac14$을 갖고, $a<\dfrac12$이면 $x=0$에서 $f(x)$는 최솟값 $a^2$을 가진다. 따라서,
        $$r(a)=\begin{cases}\sqrt{a-\dfrac14} & \left(a\ge\dfrac12\right)\\ |a| & \left(a<\dfrac12\right)\end{cases}$$
      criteria: [3-1.M2]
    - id: 3-1b-3
      content: |
        이고, 주어진 정적분은
        $$\int_{-1}^1\{r(a)\}^2da=\int_{-1}^{\frac12}a^2da+\int_{\frac12}^1\left\{a-\dfrac14\right\}da=\dfrac58$$
      criteria: [3-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 10
      evidence: 점 $(0,a)$에서 곡선 $y=x^2$의 한 점까지의 거리를 함수로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [3-1b-1]
    - id: 3-1.M2
      mark_type: M
      points: 15
      evidence: $a<\dfrac12$, $a\ge\dfrac12$로 경우를 나누었다.
      depends_on: [3-1.M1]
      implied_ok: false
      steps: [3-1b-2]
    - id: 3-1.A1
      mark_type: A
      points: 15
      evidence: 각 경우에 대해 $r(a)$를 올바르게 구하고 적분값($\tfrac58$)을 계산했다.
      depends_on: [3-1.M2]
      cao: true
      steps: [3-1b-2, 3-1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42205}
  misconceptions:
  - id: MC-ALG-42205
    outcome_code: '71'
    wrong_work: '$x^2=a-\tfrac12$을 모든 $a$에 적용해 $\{r(a)\}^2=a-\tfrac14$로 $\int_{-1}^1(a-\tfrac14)da=-\tfrac12$'
    detect_cue: 답이 음수이거나 경우 나눔이 없음
    feedback: $x^2\ge0$이므로 꼭짓점 $a-\tfrac12$가 음수이면 최솟값은 $x=0$에서 생깁니다.
    remedy: [RL-1]

- id: '3-2'
  stem: |
    원 $C_a:x^2+(y-a)^2=\{r(a)\}^2$과 이차곡선 $P$의 각 교점에서 원 $C_a$의 접선과 곡선 $P$의 접선이 일치함을 보이시오. (30점)
  points: 30
  depends_on: ['3-1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-2-A
    audience: A
    method_no: 1
    key_idea: $a<\tfrac12$이면 교점은 원점뿐이고 두 접선이 $y=0$; $a\ge\tfrac12$이면 교점 $y_0=a-\tfrac12$(중근)에서 두 접선이 $y=\pm2\sqrt{a-\tfrac12}x-(a-\tfrac12)$.
    steps:
    - {id: 3-2a, content: '두 경우 모두 원의 접선 = 포물선의 접선', criteria: [3-2.M1, 3-2.R1, 3-2.R2]}
    hint_ladder:
    - $x^2=y$를 원의 방정식에 대입해 $y$에 대한 이차방정식을 보자.
  - id: S3-2-B
    audience: B
    source_flow: M22_N2.pdf p.12
    method_no: 1
    steps:
    - id: 3-2b-1
      content: |
        원 $C_a$와 곡선 $P$와의 교점을 $(x_0,y_0)$라 두면, $y_0=x_0^2\ge0$이다.
      criteria: [3-2.M1]
    - id: 3-2b-2
      content: |
        $a<\dfrac12$이면 원 $C_a$의 방정식은 $x^2+(y-a)^2=r(a)^2=a^2\iff x^2+y^2-2ay=0$이고, $x^2=y$를 대입하면 $y_0^2+(1-2a)y_0=0$. 따라서 $y_0=0$이거나 $y_0=2a-1<0$. 그런데 $y_0=x_0^2\ge0$이므로, 유일한 교점은 $(x_0,y_0)=(0,0)$이다. 이때 원 $C_a$와 곡선 $P$는 원점 $(0,0)$에서 $x$축에 접하므로, 접선의 방정식은 둘 다 $y=0$으로 일치한다.
      criteria: [3-2.R1]
    - id: 3-2b-3
      content: |
        $a\ge\dfrac12$이면 원 $C_a$의 방정식은 $x^2+(y-a)^2=r(a)^2=a-\dfrac14\iff x^2+y^2-2ay+\left(a-\dfrac12\right)^2=0$이고, $x^2=y$를 대입하면 $y_0+y_0^2-2ay_0+\left(a-\dfrac12\right)^2=0\iff y_0^2+(1-2a)y_0+\left(a-\dfrac12\right)^2=0\iff y_0=a-\dfrac12$에서 중근을 갖는다.
        따라서 교점은 $(x_0,y_0)=\left(\pm\sqrt{a-\dfrac12},\ a-\dfrac12\right)$. 각 교점에서 원 $C_a$의 접선과 곡선 $P$의 접선의 방정식은
        $x_0(x-x_0)+(y_0-a)(y-y_0)=\pm\sqrt{a-\dfrac12}\left(x\mp\sqrt{a-\dfrac12}\right)+\left(a-\dfrac12-a\right)\left(y-a+\dfrac12\right)=0$과
        $y-y_0=2x_0(x-x_0)\iff y-a+\dfrac12=\pm2\sqrt{a-\dfrac12}\left(x\mp\sqrt{a-\dfrac12}\right)$이고, 이를 정리하면 두 접선의 방정식은 $y=\pm2\sqrt{a-\dfrac12}\,x-\left(a-\dfrac12\right)$으로 일치한다.
      criteria: [3-2.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 5
      evidence: $a<\dfrac12$, $a\ge\dfrac12$로 경우를 나누었다.
      depends_on: []
      implied_ok: false
      steps: [3-2b-1, 3-2b-2, 3-2b-3]
    - id: 3-2.R1
      mark_type: R
      points: 10
      evidence: $a<\dfrac12$일 때 접선이 일치함을 보였다.
      depends_on: [3-2.M1]
      steps: [3-2b-2]
    - id: 3-2.R2
      mark_type: R
      points: 15
      evidence: $a\ge\dfrac12$일 때 접선이 일치함을 보였다.
      depends_on: [3-2.M1]
      steps: [3-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42206}
  misconceptions:
  - id: MC-GEO-42206
    outcome_code: '71'
    wrong_work: '교점의 $y$좌표만 구하고 접선 비교 없이 「중근이므로 접한다」로 끝내거나, $a<\tfrac12$의 음수 근 $y_0=2a-1$을 교점으로 포함'
    detect_cue: 접선의 방정식을 쓰지 않음, 또는 교점에 $y_0<0$ 포함
    feedback: $y_0=x_0^2\ge0$ 조건으로 교점을 거르고, 각 교점에서 두 곡선의 접선 방정식을 직접 비교하세요.
    remedy: [RL-2]

- id: '3-3'
  stem: |
    $a>\dfrac12$일 때, 원 $C_a:x^2+(y-a)^2=\{r(a)\}^2$과 이차곡선 $P$로 둘러싸인 부분 중 원의 바깥쪽 부분의 넓이를 $S(a)$라고 하자.
    $$\lim_{a\to\infty}\left\{S(a)-F\left(\sqrt{a-\dfrac12}\right)\right\}=0$$
    을 만족시키는 삼차다항식 $F(x)$를 구하시오. (50점)
  points: 50
  depends_on: ['3-2']
  answer: {kind: expression, value: '4*x**3/3 - pi*x**2/2 + x - pi/8', equivalents: ['F(x)=4/3x^3-π/2x^2+x-π/8'], tolerance: null}
  solutions:
  - id: S3-3-A
    audience: A
    method_no: 1
    key_idea: $X=\sqrt{a-\tfrac12}$로 $S=\tfrac43X^3+\tfrac12X+2\cdot$부채꼴$-\tfrac\pi2X^2-\tfrac\pi8$, 부채꼴 $=\tfrac14X+O(\tfrac1X)$.
    steps:
    - {id: 3-3a, content: '$F(X)\le S(a)\le F(X)+\tfrac1{8X}$ ⇒ $F(x)=\tfrac43x^3-\tfrac\pi2x^2+x-\tfrac\pi8$', criteria: [3-3.M1, 3-3.M2, 3-3.M3, 3-3.A1, 3-3.R1]}
    hint_ladder:
    - 접점 $\mathrm{C}$, $\mathrm{D}$와 원의 중심 $\mathrm{A}$를 잇고 영역을 쪼개 보자.
    - 부채꼴 넓이를 정확히 못 구하면 제시문 (나)로 위아래를 가두자.
  - id: S3-3-B
    audience: B
    source_flow: M22_N2.pdf p.12~13
    method_no: 1
    steps:
    - id: 3-3b-1
      content: |
        왼쪽 그림에서, 주어진 영역은 곡선 $P$와 원호 $\mathrm{CFD}$로 둘러쌓인 영역 $\mathrm{CODF}$가 된다. 곡선 $\mathrm{COD}$와 선분 $\mathrm{CD}$로 둘러싸인 영역을 영역 $\mathrm{COD}$라고 나타내면,
        $S(a)=$(영역 $\mathrm{COD}$의 넓이)$+$(삼각형 $\mathrm{ACD}$의 넓이)$+$(부채꼴 $\mathrm{ABC}$의 넓이)$+$(부채꼴 $\mathrm{ADE}$의 넓이)$-$(반원 $\mathrm{ABFE}$의 넓이)
      criteria: [3-3.M1]
      # [그림: 포물선 P 안에 원 C_a(중심 A(0,a)), 접점 C·D, 지름 BE(수평), 원 최하점 F, 원점 O; 음영 S(a) 는 원호 CFD 아래·포물선 위]
    - id: 3-3b-2
      content: |
        (영역 $\mathrm{COD}$의 넓이) $=2\sqrt{a-\dfrac12}\left(a-\dfrac12\right)-\displaystyle\int_{-\sqrt{a-\frac12}}^{\sqrt{a-\frac12}}x^2dx=\dfrac43\left(\sqrt{a-\dfrac12}\right)^3$
        (삼각형 $\mathrm{ACD}$의 넓이) $=2\sqrt{a-\dfrac12}\cdot\dfrac12\cdot\dfrac12=\dfrac12\sqrt{a-\dfrac12}$
        (반원 $\mathrm{ABFE}$의 넓이) $=\dfrac\pi2\left(\sqrt{a-\dfrac14}\right)^2=\dfrac\pi2\left(\sqrt{a-\dfrac12}\right)^2+\dfrac\pi8$
      criteria: [3-3.M2]
    - id: 3-3b-3
      content: |
        (부채꼴 $\mathrm{ABC}$의 넓이) $=$ (부채꼴 $\mathrm{ADE}$의 넓이)이고, 이 부채꼴에 대해 (나)에 주어진 부등식을 이용하면,
        $$\dfrac14\sqrt{a-\dfrac12}\le(\text{부채꼴 ABC의 넓이})\le\sqrt{a-\dfrac14}\cdot\dfrac12\left(\dfrac{\sqrt{a-\frac14}}{\sqrt{a-\frac12}}\right)\cdot\dfrac12=\dfrac14\sqrt{a-\dfrac12}+\dfrac1{16\sqrt{a-\frac12}}$$
      criteria: [3-3.M3]
    - id: 3-3b-4
      content: |
        이제 $F(x)=\dfrac43x^3-\dfrac\pi2x^2+x-\dfrac\pi8$라 두면, 아래 부등식을 얻는다.
        $$F\left(\sqrt{a-\dfrac12}\right)\le S(a)\le F\left(\sqrt{a-\dfrac12}\right)+\dfrac1{8\sqrt{a-\frac12}}\iff0\le S(a)-F\left(\sqrt{a-\dfrac12}\right)\le\dfrac1{8\sqrt{a-\frac12}}$$
      criteria: [3-3.A1]
    - id: 3-3b-5
      content: |
        여기서 $\displaystyle\lim_{a\to\infty}\dfrac1{8\sqrt{a-\frac12}}=0$이므로 함수의 극한의 대소관계에 의해, $\displaystyle\lim_{a\to\infty}\left\{S(a)-F\left(\sqrt{a-\dfrac12}\right)\right\}=0$.
      criteria: [3-3.R1]
