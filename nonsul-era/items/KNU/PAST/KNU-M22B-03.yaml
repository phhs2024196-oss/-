intent: |
  점과 포물선 사이의 최소 거리를 경우를 나누어 구해 정적분하고(3-1), 최소 거리 원과 포물선이 교점에서 접함을 보이며(3-2), 포물선과 원 사이 영역의 넓이를 분해한 뒤 부채꼴 넓이 부등식과 극한의 대소 관계로 점근 다항식을 결정할 수 있는지(3-3) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 채점기준으로 요약)
key_idea: |
  거리의 제곱 $x^4+(1-2a)x^2+a^2$를 $x^2$의 이차함수로 보면 $a\ge\tfrac12$일 때 $x^2=a-\tfrac12$에서 최소 $a-\tfrac14$, $a<\tfrac12$이면 $x=0$에서 $a^2$. 원 $C_a$는 그 최소 거리 점에서 포물선에 접하고, $S(a)$는 영역 COD, 삼각형, 두 부채꼴, 반원으로 분해. 부채꼴은 $\triangle\mathrm{OBC}\le$부채꼴$\le\triangle\mathrm{ODE}$로 $\tfrac14X\le\cdot\le\tfrac14X+\tfrac1{16X}$ ($X=\sqrt{a-\tfrac12}$).
stuck: |
  3-3에서 부채꼴 $\mathrm{ABC}$의 넓이를 정확히 구할 수 없으므로 제시문 (나)의 삼각형–부채꼴–삼각형 부등식으로 위아래를 가두고, 오차 $\tfrac1{8X}\to0$으로 $F$를 결정하는 단계
