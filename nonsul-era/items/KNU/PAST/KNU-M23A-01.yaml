stimuli:
- label: (가)
  body: |
    계승 $n!=n(n-1)(n-2)\times\cdots\times3\times2\times1$, $0!=1$
    순열의 수 ${}_n\mathrm{P}_r=\dfrac{n!}{(n-r)!}$
    조합의 수 ${}_n\mathrm{C}_r=\dfrac{n!}{(n-r)!r!}$
- label: (나)
  body: |
    자연수의 거듭제곱의 합
    $$\sum_{k=1}^{n}k=\dfrac{n(n+1)}{2},\quad\sum_{k=1}^{n}k^2=\dfrac{n(n+1)(2n+1)}{6},\quad\sum_{k=1}^{n}k^3=\left\{\dfrac{n(n+1)}{2}\right\}^2$$
- label: (다)
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여
    $$\dfrac{d}{dx}\int_a^xf(t)\,dt=f(x)\quad(\text{단, }a<x<b)$$
- label: (라)
  body: |
    미분가능한 함수 $f(x)$가 $f'(a)=0$이고 $x=a$의 좌우에서 $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고, 극솟값은 $f(a)$이다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

