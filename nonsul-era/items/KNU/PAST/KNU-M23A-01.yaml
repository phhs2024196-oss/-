    (2) 등식 ${}_{n+1}\mathrm{P}_2+{}_n\mathrm{C}_{n-2}=26$을 만족시키는 자연수 $n$에 대하여 $\sin\dfrac{\pi}{n}$의 값을 구하시오. (25점)
