stimuli:
- label: (가)
  body: |
    $x=a$에서 함수 $f(x)$의 우극한과 좌극한이 모두 존재하고, 그 값이 모두 $L$이면 $\lim_{x\to a}f(x)=L$이다.
- label: (나)
  body: |
    함수 $f(x)$가 실수 $a$에 대하여 다음 세 조건을 만족시킬 때, $f(x)$는 $x=a$에서 연속이라고 한다.
    (i) $f(x)$가 $x=a$에서 정의되어 있다.
    (ii) 극한값 $\lim_{x\to a}f(x)$가 존재한다.
    (iii) $\lim_{x\to a}f(x)=f(a)$
- label: (다)
  body: |
    함수 $f(x)$에 대하여 극한값
    $$\lim_{h\to0}\dfrac{f(a+h)-f(a)}{h}$$
    가 존재하면, 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  삼차함수 $f(x)=ax^3+bx^2+cx+d$와 실수 전체의 집합에서 미분가능한 함수 $g(x)$가 다음 조건을 만족시킨다.

  〈조건〉
  (가) $a,b,c,d$는 $4$ 이하인 자연수
  (나) 모든 실수 $x$에 대하여
  $$f(x)g(x)=(x-m)(x+1)\quad(\text{단, }m>0)$$
  (다) $f'(1)=10$

  다음 물음에 답하시오.

subparts:
- id: '2-1'
  stem: |
    $f(2)$의 값을 모두 구하시오. (50점)
  points: 50
  depends_on: []
  answer: {kind: set, value: '{24, 27}', equivalents: ['27 또는 24'], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: $f(-1)=0$(연속성 귀류)과 $f'(1)=10$으로 $(a,b,c,d)=(2,1,2,3)$ 또는 $(1,2,3,2)$.
    steps:
    - {id: 2-1a, content: '$f(x)=(x+1)(2x^2-x+3)$ 또는 $(x+1)(x^2+x+2)$; $f(2)=27$ 또는 $24$', criteria: [2-1.B1, 2-1.R1, 2-1.M1, 2-1.A1]}
    hint_ladder:
    - $x=m$을 대입하면 $g(m)$은?
    - $f$의 실근에서 $g=\dfrac{(x-m)(x+1)}{f(x)}$는 어떻게 되는가?
  - id: S2-1-B
    audience: B
    source_flow: M23_N1.pdf p.6(인쇄 3)
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        $f(x)=ax^3+bx^2+cx+d$라 하자. $m$이 양수이므로 조건 (가)에 의해 $f(m)>0$이고 조건 (나)에 의해 $g(m)=0$이다.
      criteria: [2-1.B1]
    - id: 2-1b-2
      content: |
        조건 (나)에 의해 $f(x)=0$의 근이 아닌 실수 $x$에 대하여 $g(x)=\dfrac{(x-m)(x+1)}{f(x)}$이다.
        만약 $f(-1)\ne0$이라고 가정하면 삼차식 $f(x)$는 $x-m$과 $x+1$을 인수로 가지지 않는다. 한편, $f(x)=0$은 삼차방정식이므로 적어도 실근 1개를 항상 가진다. 그 실근을 $x=\alpha$라고 하면 $\lim_{x\to\alpha+}g(x)=\infty$ 또는 $\lim_{x\to\alpha+}g(x)=-\infty$이므로 $g(x)$는 $x=\alpha$에서 불연속이고 $g(x)$는 연속함수라는 조건에 모순이다. 그러므로 $f(-1)=0$이다.
      criteria: [2-1.R1]
    - id: 2-1b-3
      content: |
        조건 (다)에 의해 $3a+2b+c=10$이고 $1\le a,b,c,d\le4$인 자연수이므로 다음 두 가지 경우가 존재한다. (i) $a=2,b=1,c=2,d=3$; (ii) $a=1,b=2,c=3,d=2$.
        $f(-1)=0$을 이용하면 $f(x)$와 $g(x)$를 각각 다음과 같이 구할 수 있다.
        (i) $f(x)=2x^3+x^2+2x+3=(x+1)(2x^2-x+3)$이고 $g(x)=\dfrac{x-m}{2x^2-x+3}$
        (ii) $f(x)=x^3+2x^2+3x+2=(x+1)(x^2+x+2)$이고 $g(x)=\dfrac{x-m}{x^2+x+2}$
        (i)과 (ii)는 모두 $g(x)$의 분모가 $0$인 실수 $x$가 존재하지 않으므로 $g(x)$는 연속함수이다. 즉, 조건을 만족하는 $f(x)$와 $g(x)$는 (i)와 (ii) 경우 모두 성립한다.
      criteria: [2-1.M1]
    - id: 2-1b-4
      content: |
        그러므로 $f(2)$의 값은 $27$ 또는 $24$이다.
      criteria: [2-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.B1
      mark_type: B
      points: 10
      evidence: |
        $g(m)=0$임을 보였다.
      steps: [2-1b-1]
    - id: 2-1.R1
      mark_type: R
      points: 10
      evidence: |
        $f(-1)=0$임을 보였다.
      depends_on: []
      steps: [2-1b-2]
    - id: 2-1.M1
      mark_type: M
      points: 20
      evidence: |
        조건을 모두 만족하는 $f(x)$와 $g(x)$가 각각 (i) $f(x)=2x^3+x^2+2x+3=(x+1)(2x^2-x+3)$, $g(x)=\dfrac{x-m}{2x^2-x+3}$, (ii) $f(x)=x^3+2x^2+3x+2=(x+1)(x^2+x+2)$, $g(x)=\dfrac{x-m}{x^2+x+2}$임을 보였다.
      depends_on: [2-1.R1]
      implied_ok: false
      steps: [2-1b-3]
    - id: 2-1.A1
      mark_type: A
      points: 10
      evidence: |
        $f(2)$의 값이 $27$ 또는 $24$임을 보였다.
      depends_on: [2-1.M1]
      cao: true
      steps: [2-1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42304}
  misconceptions:
  - id: MC-ALG-42304
    outcome_code: '71'
    wrong_work: '$f(-1)=0$을 근거 없이 가정하거나, $3a+2b+c=10$의 해를 한 쌍만 찾아 $f(2)$를 하나만 답함'
    detect_cue: 답이 $27$ 또는 $24$ 중 하나뿐, 또는 $f(-1)=0$의 이유 없음
    feedback: $g$가 연속이려면 $f$의 실근이 분자 $(x-m)(x+1)$의 근이어야 합니다. 계수 조건은 $a,b,c,d\le4$ 범위에서 빠짐없이 조사하세요.
    remedy: [RL-1]

- id: '2-2'
  stem: |
    $\displaystyle\lim_{x\to-1}\dfrac{f(x)}{x+1}=6$일 때, 두 함수 $g(x)$와 $\dfrac{4}{g(x)}$의 그래프의 교점의 개수가 $1$이 되도록 하는 $m$의 값을 구하시오. (30점)
  points: 30
  depends_on: ['2-1']
  answer: {kind: value, value: '95/16', equivalents: [], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: 경우 (i)만 극한 $6$. $g=\pm2$ 중 $g=2$는 $m>0$에서 실근 없음, $g=-2$가 중근이 되도록.
    steps:
    - {id: 2-2a, content: '$4x^2-x+6-m=0$의 판별식 $0$ → $m=\tfrac{95}{16}$', criteria: [2-2.M1, 2-2.A1]}
    hint_ladder:
    - $g(x)=\dfrac{4}{g(x)}$이면 $\{g(x)\}^2=4$.
  - id: S2-2-B
    audience: B
    source_flow: M23_N1.pdf p.6(인쇄 3)
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        $\lim_{x\to-1}\dfrac{f(x)}{x+1}=6$을 만족하는 경우는 오직 (i) 경우이다. 그러므로 $g(x)=\dfrac{x-m}{2x^2-x+3}$이다.
      criteria: [2-2.M1]
    - id: 2-2b-2
      content: |
        $g(x)=\dfrac{4}{g(x)}$에서 $\{g(x)\}^2=4$이므로, $g(x)=2$ 또는 $g(x)=-2$이다.
        ① $g(x)=2$이면 $4x^2-3x+6+m=0$이고 $m=-\dfrac{87}{16}$이다. 그러나 $m>0$이라는 조건에 모순이다.
        ② $g(x)=-2$이면 $4x^2-x+6-m=0$이고 $m=\dfrac{95}{16}$이다.
      criteria: [2-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 10
      evidence: |
        $\lim_{x\to-1}\dfrac{f(x)}{x+1}=6$을 만족하는 경우 $g(x)=\dfrac{x-m}{2x^2-x+3}$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2-2b-1]
    - id: 2-2.A1
      mark_type: A
      points: 20
      evidence: |
        조건을 만족하는 경우는 오직 $g(x)=-2$일 때이고 그때 $m=\dfrac{95}{16}$임을 보였다.
      # [공식해설 확인필요] 채점기준 원문은 「오직 g(x)=2일때」로 적혀 있으나 예시답안은 g(x)=-2 에서 m=95/16 — 채점기준 쪽 부호 오기로 보임(정답 95/16 은 공식 그대로)
      depends_on: [2-2.M1]
      cao: true
      steps: [2-2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42305}
  misconceptions:
  - id: MC-ALG-42305
    outcome_code: '71'
    wrong_work: '$g(x)=2$인 경우만 조사하여 $m=-\tfrac{87}{16}$을 얻고 조건 $m>0$을 확인하지 않음, 또는 두 경우의 교점 수를 합하지 않음'
    detect_cue: 답 $-\tfrac{87}{16}$
    feedback: 교점은 $g=2$와 $g=-2$의 해를 합한 것입니다. $m>0$이면 $g=2$는 해가 없으므로 $g=-2$가 중근이어야 합니다.
    remedy: [RL-2]

- id: '2-3'
  stem: |
    $f(0)=3$일 때, 함수
    $$h(x)=\begin{cases}k-g(x-m)&(x<m)\\(x-m)g(x)&(x\ge m)\end{cases}$$
    가 실수 전체의 집합에서 미분가능하도록 하는 상수 $k$의 값을 구하시오. (40점)
  points: 40
  depends_on: ['2-1']
  answer: {kind: value, value: '-1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-3-A
    audience: A
    method_no: 1
    key_idea: $f(0)=3$이면 경우 (i). $x=m$에서 좌미분 $-g'(0)$, 우미분 $g(m)=0$이므로 $g'(0)=\dfrac{3-m}{9}=0$, $m=3$; 연속에서 $k=g(0)=-\tfrac m3$.
    steps:
    - {id: 2-3a, content: '$m=3$, $k=-1$', criteria: [2-3.M1, 2-3.M2, 2-3.A1]}
    hint_ladder:
    - $x=m$에서 왼쪽 식의 미분계수는 $-g'(0)$이다.
  - id: S2-3-B
    audience: B
    source_flow: M23_N1.pdf p.6(인쇄 3–4)
    method_no: 1
    steps:
    - id: 2-3b-1
      content: |
        $f(0)=3$을 만족하는 경우는 오직 (i) 경우이다. 따라서 $g(x)=\dfrac{x-m}{2x^2-x+3}$이다.
      criteria: [2-3.M1]
    - id: 2-3b-2
      content: |
        함수 $h(x)$가 $x=m$에서 미분가능하므로 $\lim_{x\to m-}\dfrac{h(x)-h(m)}{x-m}=\lim_{x\to m+}\dfrac{h(x)-h(m)}{x-m}$에서 $\lim_{x\to m-}\dfrac{\{k-g(x-m)\}-k}{x-m}=\lim_{x\to m+}\dfrac{(x-m)g(x)-0}{x-m}$이고 $-g'(0)=g(m)$. 따라서 $m=3$이다.
      criteria: [2-3.M2]
    - id: 2-3b-3
      content: |
        함수 $h(x)$가 $x=m$에서 연속이므로 $\lim_{x\to m-}\{k-g(x-m)\}=\lim_{x\to m+}(x-m)g(x)=h(m)$에서 $k=g(0)$이다. 그러므로 $k=-\dfrac m3=-1$이다.
      criteria: [2-3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-3.M1
      mark_type: M
      points: 10
      evidence: |
