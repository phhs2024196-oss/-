intent: |
  함수의 연속·미분가능성의 정의를 이용하여 함수의 곱으로 주어진 조건에서 삼차함수를 결정할 수 있는지(2-1), 극한 조건과 그래프의 교점 개수 조건으로 미정계수를 구할 수 있는지(2-2), 구간별로 정의된 함수가 미분가능하도록 하는 상수를 구할 수 있는지(2-3) 평가한다. (모의고사 자료에 출제 의도 문항 없음 — 채점기준으로부터 요약)
key_idea: |
  $f(m)>0$이라 $g(m)=0$. $f(-1)\ne0$이면 $f$의 실근 $\alpha$에서 $g=\dfrac{(x-m)(x+1)}{f(x)}$가 발산해 $g$의 연속성에 모순이므로 $f(-1)=0$. $-a+b-c+d=0$, $3a+2b+c=10$, $1\le a,b,c,d\le4$에서 두 경우를 찾는다.
stuck: |
  $f(-1)=0$을 귀류(삼차방정식은 실근을 가짐 → $g$ 불연속)로 보이는 단계, 그리고 2-3에서 $g(m)=0$을 이용해 $x=m$의 좌·우미분계수 $-g'(0)=g(m)$을 세우는 단계
idea_tags: [IDEA-CONTINUITY-FORCES-COMMON-FACTOR, IDEA-FINITE-CASE-ENUMERATION, IDEA-PIECEWISE-DIFFERENTIABILITY-MATCH]
tags: [삼차함수 결정, 연속성, 귀류, 경우 분류, 교점 개수, 미분가능성]
