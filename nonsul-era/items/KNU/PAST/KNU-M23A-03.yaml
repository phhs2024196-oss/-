intent: |
  매개변수로 나타낸 점의 이동 거리를 정적분으로 구할 수 있는지(3-1), 치환적분으로 두 정적분이 같음을 보일 수 있는지(3-2), 부등식과 정적분의 대소 관계로 이동 거리를 끼워 수열의 극한을 구할 수 있는지(3-3) 평가한다. (모의고사 자료에 출제 의도 문항 없음 — 채점기준으로부터 요약)
key_idea: |
  $s_n=n\int_0^{\frac{\pi}{2}}\sin t\cos t\sqrt{\cos^{2n-4}t+\sin^{2n-4}t}\,dt$. $t\mapsto\tfrac{\pi}{2}-t$ 대칭으로 $a_n=b_n$, $s_n=2a_n$. $[0,\tfrac{\pi}{4}]$에서 $\cos^{n-2}t-\sin^{n-2}t\le\sqrt{\cos^{2n-4}t+\sin^{2n-4}t}\le\cos^{n-2}t+\sin^{n-2}t$로 끼우면 양쪽 적분이 정확히 계산된다.
stuck: |
  3-3에서 $(\alpha-\beta)^2\le\alpha^2+\beta^2\le(\alpha+\beta)^2$에 $\alpha=\cos^{n-2}t$, $\beta=\sin^{n-2}t$를 넣어 제곱근을 끼우는 단계와, 아래쪽 경계가 음이 되지 않도록 적분 구간을 $[0,\tfrac{\pi}{4}]$로 줄이기 위해 3-2의 $a_n=b_n$을 쓰는 단계
idea_tags: [IDEA-SYMMETRY-SUBSTITUTION-HALF-INTERVAL, IDEA-SANDWICH-BY-INTEGRALS]
tags: [매개변수 곡선, 이동 거리, 치환적분, 정적분의 대소, 샌드위치 정리]
