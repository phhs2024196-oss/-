stimuli:
- label: (가)
  body: |
    좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 위치 $(x,y)$가 $x=f(t)$, $y=g(t)$일 때, 시각 $t=a$에서 $t=b$까지 점 $\mathrm{P}$가 움직인 거리 $s$는
    $$s=\int_a^b\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}\,dt=\int_a^b\sqrt{\{f'(t)\}^2+\{g'(t)\}^2}\,dt$$
- label: (나)
  body: |
    미분가능한 함수 $t=g(x)$의 도함수 $g'(x)$가 닫힌구간 $[\alpha,\beta]$에서 연속이고, 함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때, $g(\alpha)=a$, $g(\beta)=b$이면
    $$\int_a^bf(t)\,dt=\int_\alpha^\beta f(g(x))g'(x)\,dx$$
- label: (다)
  body: |
    함수 $f(x)$가 임의의 세 실수 $a,b,c$를 포함하는 닫힌구간에서 연속일 때,
    $$\int_a^bf(x)\,dx+\int_b^cf(x)\,dx=\int_a^cf(x)\,dx$$
- label: (라)
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(x)\le g(x)$일 때,
    $$\int_a^bf(x)\,dx\le\int_a^bg(x)\,dx$$
- label: (마)
  body: |
    $\lvert r\rvert<1$일 때, $\displaystyle\lim_{n\to\infty}r^n=0$
- label: (바)
  body: |
    수렴하는 두 수열 $\{a_n\}$, $\{b_n\}$에 대하여
    $$\lim_{n\to\infty}a_n=\lim_{n\to\infty}b_n=\alpha\quad(\alpha\text{는 실수})$$
    일 때, 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이면
    $$\lim_{n\to\infty}c_n=\alpha$$

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 위치 $(x,y)$가
  $$x=\cos^nt,\quad y=\sin^nt$$
  이다. 점 $\mathrm{P}$가 $t=0$에서 $t=\dfrac{\pi}{2}$까지 움직인 거리를 $s_n$, 점 $\mathrm{P}$가 $t=0$에서 $t=\dfrac{\pi}{4}$까지 움직인 거리를 $a_n$, 점 $\mathrm{P}$가 $t=\dfrac{\pi}{4}$에서 $t=\dfrac{\pi}{2}$까지 움직인 거리를 $b_n$이라 하자. (단, $n$은 2 이상의 자연수)
  다음 물음에 답하시오.

subparts:
- id: '3-1'
  stem: |
    $s_2$의 값과 $s_3$의 값을 각각 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: expression, value: '(sqrt(2), 3/2)', equivalents: ['$s_2=\sqrt2$, $s_3=\dfrac32$'], tolerance: null}
  solutions:
  - id: S3-1-A
    audience: A
    method_no: 1
    key_idea: $s_n=n\int_0^{\frac{\pi}{2}}\sin t\cos t\sqrt{\cos^{2n-4}t+\sin^{2n-4}t}\,dt$; $n=2$이면 근호 $\sqrt2$, $n=3$이면 $1$.
    steps:
    - {id: 3-1a, content: '$s_2=2\sqrt2\cdot\tfrac12=\sqrt2$, $s_3=3\cdot\tfrac12=\tfrac32$', criteria: [3-1.B1, 3-1.B2]}
    hint_ladder:
    - $\int_0^{\frac{\pi}{2}}\sin t\cos t\,dt=\tfrac12$.
  - id: S3-1-B
    audience: B
    source_flow: M23_N1.pdf p.7(인쇄 5)
    method_no: 1
    steps:
    - id: 3-1b-1
      content: |
        $\dfrac{dx}{dt}=-n\cos^{n-1}t\sin t$, $\dfrac{dy}{dt}=n\sin^{n-1}t\cos t$이므로
        $$s_n=\int_0^{\frac{\pi}{2}}\sqrt{(-n\cos^{n-1}t\sin t)^2+(n\sin^{n-1}t\cos t)^2}\,dt=n\int_0^{\frac{\pi}{2}}\sin t\cos t\sqrt{\cos^{2n-4}t+\sin^{2n-4}t}\,dt$$
        임을 알 수 있다. 따라서, $s_2=2\displaystyle\int_0^{\frac{\pi}{2}}\sin t\cos t\sqrt{1+1}\,dt=2\sqrt2\int_0^{\frac{\pi}{2}}\sin t\cos t\,dt=\sqrt2$,
      criteria: [3-1.B1]
    - id: 3-1b-2
      content: |
        $s_3=3\displaystyle\int_0^{\frac{\pi}{2}}\sin t\cos t\sqrt{\cos^2t+\sin^2t}\,dt=3\int_0^{\frac{\pi}{2}}\sin t\cos t\,dt=\dfrac32$이다.
      criteria: [3-1.B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-1.B1
      mark_type: B
      points: 15
      evidence: |
        $s_2=\sqrt2$를 구했다.
      steps: [3-1b-1]
    - id: 3-1.B2
      mark_type: B
      points: 15
      evidence: |
        $s_3=\dfrac32$를 구했다.
      steps: [3-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42321}
  misconceptions:
  - id: MC-CAL-42321
    outcome_code: '71'
    wrong_work: '$s_2$를 선분 길이로 보고 근호 계산을 생략하거나, $\sqrt{\ }$ 밖으로 $\sin t\cos t$를 꺼낼 때 $n$을 빠뜨려 $s_2=\tfrac{\sqrt2}{2}$'
    detect_cue: $s_2=\tfrac{\sqrt2}{2}$ 또는 $s_3=\tfrac12$
    feedback: 속도 성분에 각각 계수 $n$이 붙습니다. 근호 밖으로 $n\sin t\cos t$가 나옵니다.
    remedy: [RL-1]

- id: '3-2'
  stem: |
    $a_n=b_n$임을 증명하시오. (30점)
  points: 30
  depends_on: ['3-1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-2-A
    audience: A
    method_no: 1
    key_idea: $u=\tfrac{\pi}{2}-t$로 치환하면 $\sin$과 $\cos$가 바뀌고 피적분함수는 대칭.
    steps:
    - {id: 3-2a, content: '$a_n=n\int_0^{\frac{\pi}{4}}\cdots dt=n\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\cdots du=b_n$', criteria: [3-2.M1, 3-2.R1]}
    hint_ladder:
    - $\sin\left(\tfrac{\pi}{2}-t\right)=\cos t$.
  - id: S3-2-B
    audience: B
    source_flow: M23_N1.pdf p.7(인쇄 5)
    method_no: 1
    steps:
    - id: 3-2b-1
      content: |
        임의의 실수 $t$에 대하여 $\sin\left(\dfrac{\pi}{2}-t\right)=\cos t$, $\cos\left(\dfrac{\pi}{2}-t\right)=\sin t$가 성립하므로, $\dfrac{\pi}{2}-t=u$라 두고 치환적분을 이용하면
      criteria: [3-2.M1]
    - id: 3-2b-2
      content: |
        $$a_n=n\int_0^{\frac{\pi}{4}}\sin t\cos t\sqrt{\cos^{2n-4}t+\sin^{2n-4}t}\,dt=n\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}\cos u\sin u\sqrt{\sin^{2n-4}u+\cos^{2n-4}u}\,du=b_n$$
        임을 알 수 있다.
      criteria: [3-2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 15
      evidence: |
        $\dfrac{\pi}{2}-t=u$라 두고 치환적분을 이용했다.
      depends_on: []
      implied_ok: false
      steps: [3-2b-1]
    - id: 3-2.R1
      mark_type: R
      points: 15
      evidence: |
        $a_n=b_n$임을 보였다.
      depends_on: [3-2.M1]
      steps: [3-2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42322}
  misconceptions:
  - id: MC-CAL-42322
    outcome_code: '71'
    wrong_work: '곡선이 직선 $y=x$에 대해 대칭이라는 그림 설명만으로 결론(치환적분 근거 없음), 또는 치환 시 $du=-dt$의 부호와 구간 뒤집기를 놓침'
    detect_cue: 적분 구간 변환·$du=-dt$ 처리가 없음
    feedback: $u=\tfrac{\pi}{2}-t$이면 $t:0\to\tfrac{\pi}{4}$일 때 $u:\tfrac{\pi}{2}\to\tfrac{\pi}{4}$이고 $dt=-du$입니다. 부호가 구간 뒤집기와 상쇄됩니다.
    remedy: [RL-2]

- id: '3-3'
  stem: |
    음이 아닌 모든 실수 $\alpha,\beta$에 대하여 성립하는 부등식
    $$(\alpha-\beta)^2\le\alpha^2+\beta^2\le(\alpha+\beta)^2$$
    을 이용하여 $\displaystyle\lim_{n\to\infty}s_n$의 값을 구하시오. (60점)
  points: 60
  depends_on: ['3-2']
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-3-A
    audience: A
    method_no: 1
    key_idea: $s_n=2a_n$, $[0,\tfrac{\pi}{4}]$에서 근호를 $\cos^{n-2}t\pm\sin^{n-2}t$로 끼우면 $1-2\left(\tfrac{\sqrt2}{2}\right)^n\le a_n\le1$.
    steps:
    - {id: 3-3a, content: '$2-4\left(\tfrac{\sqrt2}{2}\right)^n\le s_n\le2$ → $2$', criteria: [3-3.M1, 3-3.M2, 3-3.A1]}
    hint_ladder:
    - $\alpha=\cos^{n-2}t$, $\beta=\sin^{n-2}t$로 두자.
    - 아래쪽 경계가 음이 되지 않는 구간에서만 끼우자.
  - id: S3-3-B
    audience: B
    source_flow: M23_N1.pdf p.7(인쇄 5–6)
    method_no: 1
    steps:
    - id: 3-3b-1
      content: |
        $s_n=n\displaystyle\int_0^{\frac{\pi}{2}}\sin t\cos t\sqrt{\cos^{2n-4}t+\sin^{2n-4}t}\,dt=n\int_0^{\frac{\pi}{4}}(\cdots)\,dt+n\int_{\frac{\pi}{4}}^{\frac{\pi}{2}}(\cdots)\,dt=a_n+b_n$이고 $a_n=b_n$이므로, $s_n=2a_n$이 성립함을 알 수 있다.
        한편, $0\le t\le\dfrac{\pi}{4}$인 실수 $t$에 대하여, $\cos^{n-2}t-\sin^{n-2}t\le\sqrt{\cos^{2n-4}t+\sin^{2n-4}t}\le\cos^{n-2}t+\sin^{n-2}t$가 성립하므로,
        $$n\int_0^{\frac{\pi}{4}}\sin t\cos t(\cos^{n-2}t-\sin^{n-2}t)\,dt\le a_n=n\int_0^{\frac{\pi}{4}}\sin t\cos t\sqrt{\cos^{2n-4}t+\sin^{2n-4}t}\,dt\le n\int_0^{\frac{\pi}{4}}\sin t\cos t(\cos^{n-2}t+\sin^{n-2}t)\,dt$$
        임을 알 수 있다.
      criteria: [3-3.M1]
    - id: 3-3b-2
      content: |
        여기서 $n\displaystyle\int_0^{\frac{\pi}{4}}\sin t\cos t(\cos^{n-2}t-\sin^{n-2}t)\,dt=\left[-\cos^nt-\sin^nt\right]_0^{\frac{\pi}{4}}=1-2\left(\dfrac{\sqrt2}{2}\right)^n$, $n\displaystyle\int_0^{\frac{\pi}{4}}\sin t\cos t(\cos^{n-2}t+\sin^{n-2}t)\,dt=\left[-\cos^nt+\sin^nt\right]_0^{\frac{\pi}{4}}=1$이므로, $1-2\left(\dfrac{\sqrt2}{2}\right)^n\le a_n\le1$이 성립함을 알 수 있다. 따라서, $2-4\left(\dfrac{\sqrt2}{2}\right)^n\le s_n\le2$가 성립하므로
      criteria: [3-3.M2]
    - id: 3-3b-3
      content: |
        $\displaystyle\lim_{n\to\infty}s_n=2$이다.
      criteria: [3-3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-3.M1
      mark_type: M
      points: 20
      evidence: |
        부등식 $n\int_0^{\frac{\pi}{4}}\sin t\cos t(\cos^{n-2}t-\sin^{n-2}t)\,dt\le a_n\le n\int_0^{\frac{\pi}{4}}\sin t\cos t(\cos^{n-2}t+\sin^{n-2}t)\,dt$를 보였다.
      depends_on: []
      implied_ok: false
      steps: [3-3b-1]
    - id: 3-3.M2
      mark_type: M
      points: 20
      evidence: |
        부등식 $2-4\left(\dfrac{\sqrt2}{2}\right)^n\le s_n\le2$를 보였다.
      depends_on: [3-3.M1]
      implied_ok: false
      steps: [3-3b-2]
    - id: 3-3.A1
      mark_type: A
      points: 20
      evidence: |
        $\lim_{n\to\infty}s_n=2$를 구했다.
      depends_on: [3-3.M2]
      cao: true
      steps: [3-3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42323}
  misconceptions:
  - id: MC-CAL-42323
    outcome_code: '71'
    wrong_work: '$[0,\tfrac{\pi}{2}]$ 전체에서 $\lvert\cos^{n-2}t-\sin^{n-2}t\rvert$ 대신 $\cos^{n-2}t-\sin^{n-2}t$로 아래를 끼워 하한이 $0$이 되어 극한을 정하지 못하거나, 근호를 $\cos^{n-2}t$로 근사해 답 $1$'
    detect_cue: 답 $1$, 또는 하한 $0$
    feedback: 3-2의 $a_n=b_n$으로 구간을 $[0,\tfrac{\pi}{4}]$로 줄이면 $\cos t\ge\sin t$라 아래쪽 경계가 의미를 가집니다. $s_n=2a_n$을 잊지 마세요.
    remedy: [RL-3]

