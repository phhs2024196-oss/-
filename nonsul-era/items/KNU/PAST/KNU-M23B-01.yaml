intent: |
  두 원의 교점을 원의 방정식으로 구할 수 있는지(1-1), 교점 좌표의 일반항으로 기울기의 극한을 구할 수 있는지(1-2), 접선·점과 직선 사이의 거리로 삼각형 넓이를 구하고 곡선으로 둘러싸인 넓이의 비에 대한 부등식을 해결할 수 있는지(1-3) 평가한다. (모의고사 자료에 출제 의도 문항 없음 — 채점기준으로부터 요약)
key_idea: |
  두 원의 방정식을 빼면 $x_n=(9\times2^{n-3}-2)r$, $y_n=\sqrt{15}\times2^{n-3}r$로 모든 $\mathrm{P}_n$이 한 직선 $\sqrt{15}x-9y+2\sqrt{15}r=0$ 위에 있다. $a_{n+1}-a_n=b_{n+1}$이라 $C_n$의 중심이 $C_{n+1}$ 위에 있고, 접선 $\ell_n$은 반지름 $(a_n,0)\mathrm{P}_n$에 수직이므로 $\mathrm{Q}_n$은 $C_{n+1}$의 지름 반대쪽 끝 $(a_{n+1}+b_{n+1},0)$.
stuck: |
  $\mathrm{Q}_n$의 좌표를 「$C_n$의 중심이 $C_{n+1}$ 위에 있다 → 지름에 대한 원주각」으로 바로 얻는 단계, 그리고 $s_{n+1}=4s_n$을 써서 $A_n$을 두 구간 적분으로 나누고 $\dfrac{A_{n+1}}{A_n}>3$을 $2n+6>(6-n)4^n$으로 정리하는 단계
