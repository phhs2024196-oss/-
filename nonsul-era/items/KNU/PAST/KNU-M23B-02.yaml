intent: |
  합성함수의 반복으로 정의된 수열의 수렴·발산을 경우를 나누어 판정하고 수렴하도록 하는 초항을 구할 수 있는지(2-1), 함수방정식에서 합성함수·곱의 미분으로 함수를 결정하고 최솟값을 구할 수 있는지(2-2) 평가한다. (모의고사 자료에 출제 의도 문항 없음 — 채점기준으로부터 요약)
key_idea: |
  $f^2(x)=c+\sqrt{(c-x)^2}=c+\lvert x-c\rvert$이므로 수열은 두 항마다 같은 값으로 돌아오는 꼴이 되고, 수렴하려면 $a_2=a_1$ 또는 $a_3=a_2$(고정점)가 필요하다. 2-2는 $x\to\dfrac1x$로 바꾼 식으로 $g'(x)=0$을 보이고 $\dfrac{f'(x)}{f(x)}=\dfrac{1}{tx}$를 적분한다.
stuck: |
  2-1에서 $f\circ f$를 근호 안 완전제곱으로 정리해 $c+\lvert x-c\rvert$를 얻는 단계, $c$의 부호와 $a_1$의 위치에 따른 경우 분류, 2-2에서 조건식의 $x$에 $\tfrac1x$를 대입한 식을 $g'$ 계산에 쓰는 단계
idea_tags: [IDEA-ITERATE-COMPOSITE-PERIOD-2, IDEA-FIXED-POINT-CONVERGENCE, IDEA-FUNC-EQ-RECIPROCAL-SUBSTITUTION, IDEA-LOG-DERIVATIVE-INTEGRATE]
tags: [합성함수 반복, 수열의 수렴·발산, 고정점, 함수방정식, 로그미분, 최솟값]
elements:
  materials:
  - '$f(x)=c+\sqrt{2cx-x^2}$ ($c\ne0$)와 반복 합성 $f^{n+1}=f^n\circ f$, 수열 $a_{n+1}=f^n(a_1)$'
  - '정의역·공역이 $(0,\infty)$이고 $f(x)f''\left(\tfrac1x\right)=x$인 함수 $f$, $g(x)=f(x)f\left(\tfrac1x\right)$'
  - '$t=g(1)$, $h(t)=f(e)$, 닫힌구간 $[1,3]$'
  concepts:
  - '수열의 수렴과 발산(제시문 (가))'
  - '합성함수의 미분법, 곱의 미분법'
  - '도함수가 0인 함수는 상수함수'
  - '로그함수의 미분과 적분'
  - '닫힌구간에서의 최대·최소(제시문 (라))'
  tools:
  - '$f^2(x)=c+\lvert x-c\rvert$'
  - '경우 분류: $c>0$($0\le a_1<c$, $c<a_1\le2c$), $c<0$($2c\le a_1<c$, $c<a_1\le0$)'
  - '고정점 방정식 $c+\sqrt{2cx-x^2}=x$ → $x=\dfrac{c(2\pm\sqrt2)}{2}$'
  - '$f\left(\tfrac1x\right)f''(x)=\tfrac1x$, $g''(x)=0$'
  - '$\ln f(x)=\tfrac1t\ln x+C$, $f(x)=e^Cx^{\frac1t}$, $t=(e^C)^2$'
  - '$h(t)=\sqrt te^{\frac1t}$, $h''(t)=\dfrac{e^{\frac1t}(t-2)}{2\sqrt{t^3}}$'
  conditions:
  - '$c\ne0$, $a_1$은 $f$의 정의역($2cx-x^2\ge0$)에 속함'
  - '2-2의 $f$는 $(0,\infty)$에서 양수·미분가능'
  stimuli_used: ['(가)', '(나)', '(다)', '(라)']
  subpart_links: '2-1(1)은 2-1(2)의 특수한 경우($a_1=c$), 2-2(2)는 2-2(1)의 $g$가 상수임을 사용'

