stimuli:
- label: (가)
  body: |
    수열 $\{a_n\}$에서 $n$이 한없이 커질 때, 일반항 $a_n$의 값이 일정한 값 $L$에 한없이 가까워지면 수열 $\{a_n\}$은 $L$에 수렴한다고 한다. 수열 $\{a_n\}$이 수렴하지 않을 경우, 수열 $\{a_n\}$은 발산한다고 한다.
- label: (나)
  body: |
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는
    $$\dfrac{dy}{dx}=\dfrac{dy}{du}\times\dfrac{du}{dx}\quad\text{또는}\quad y'=f'(g(x))g'(x)$$
- label: (다)
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능할 때
    $$\{f(x)g(x)\}'=f'(x)g(x)+f(x)g'(x)$$
- label: (라)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이면 최대·최소 정리에 의하여 $f(x)$는 닫힌구간 $[a,b]$에서 반드시 최댓값과 최솟값을 갖는다. 이때 이 구간에서 극댓값, 극솟값, $f(a)$, $f(b)$의 값 중 가장 큰 값이 최댓값, 가장 작은 값이 최솟값이 된다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

subparts:
- id: '2-1(1)'
  stem: |
    【2-1】 함수 $f(x)=c+\sqrt{2cx-x^2}$에 대하여
    $$f^1=f,\quad f^{n+1}=f^n\circ f\quad(n\text{은 자연수})$$
    로 정의할 때, 수열 $\{a_n\}$의 첫째항 $a_1$이 함수 $f(x)$의 정의역에 속하고 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
    $$a_{n+1}=f^n(a_1)$$
    을 만족시킨다고 하자. (단, $c$는 $0$이 아닌 실수) 다음 물음에 답하시오.
    (1) $a_1=c$일 때, 수열 $\{a_n\}$의 수렴, 발산을 조사하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: expression, value: '발산', equivalents: ['c>0: c,2c,c,2c,… 발산; c<0: c,0,c,0,… 발산'], tolerance: null}
  solutions:
  - id: S2-11-A
    audience: A
    method_no: 1
    key_idea: $f(c)=c+\lvert c\rvert$, $f(2c)=c$, $f(0)=c$로 두 값이 번갈아 나온다.
    steps:
    - {id: 2-11a, content: '$c>0$: $c,2c,c,2c,\dots$; $c<0$: $c,0,c,0,\dots$ — 모두 발산', criteria: [2-1(1).B1, 2-1(1).B2]}
    hint_ladder:
    - $f(c)=c+\sqrt{c^2}$이다. $c$의 부호를 나누자.
  - id: S2-11-B
    audience: B
    source_flow: M23_N2.pdf p.6(인쇄 3)
    method_no: 1
    steps:
    - id: 2-11b-1
      content: |
        (i) $c$가 양수일 경우 $a_1=c$이므로, $a_2=2c$, $a_3=c$, $a_4=2c$, $\dots$ 즉, $a_n=\begin{cases}c&(n\text{은 홀수})\\2c&(n\text{은 짝수})\end{cases}$임을 알 수 있다. 따라서, 수열 $\{a_n\}$은 발산한다.
      criteria: [2-1(1).B1]
    - id: 2-11b-2
      content: |
        (ii) $c$가 음수일 경우 $a_1=c$이므로, $a_2=0$, $a_3=c$, $a_4=0$, $\dots$ 즉, $a_n=\begin{cases}c&(n\text{은 홀수})\\0&(n\text{은 짝수})\end{cases}$임을 알 수 있다. 따라서, 수열 $\{a_n\}$은 발산한다.
      criteria: [2-1(1).B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1(1).B1
      mark_type: B
      points: 10
      evidence: |
        $c$가 양수일 경우 수열 $\{a_n\}$은 발산함을 보였다.
      steps: [2-11b-1]
    - id: 2-1(1).B2
      mark_type: B
      points: 10
      evidence: |
        $c$가 음수일 경우 수열 $\{a_n\}$은 발산함을 보였다.
      steps: [2-11b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-SEQ-42301}
  misconceptions:
  - id: MC-SEQ-42301
    outcome_code: '71'
    wrong_work: '$\sqrt{c^2}=c$로 두어 $c<0$일 때 $a_2=2c$로 계산하거나, $c$의 부호를 나누지 않음'
    detect_cue: $c<0$ 경우에 $a_2=2c$
    feedback: $\sqrt{c^2}=\lvert c\rvert$입니다. $c<0$이면 $f(c)=c-c=0$입니다.
    remedy: [RL-1]

- id: '2-1(2)'
  stem: |
    (2) 수열 $\{a_n\}$이 수렴하도록 하는 $a_1$의 값을 모두 구하시오. (40점)
  points: 40
  depends_on: ['2-1(1)']
  answer: {kind: set, value: '{c*(2+sqrt(2))/2, c*(2-sqrt(2))/2}', equivalents: ['$a_1=\dfrac{c(2\pm\sqrt2)}{2}$'], tolerance: null}
  solutions:
  - id: S2-12-A
    audience: A
    method_no: 1
    key_idea: $f^2(x)=c+\lvert x-c\rvert$라 $a_3$부터 $a_1$ 또는 $2c-a_1$이 반복된다. 수렴하려면 연속 두 항이 같아야 하고, 이는 고정점 $c+\sqrt{2cx-x^2}=x$로 귀결.
    steps:
    - {id: 2-12a, content: '$2x^2-4cx+c^2=0$ → $a_1=\dfrac{c(2\pm\sqrt2)}{2}$', criteria: [2-1(2).M1, 2-1(2).M2, 2-1(2).M3, 2-1(2).B1, 2-1(2).B2]}
    hint_ladder:
    - $f(f(x))$를 계산하면 근호 안이 완전제곱이 된다.
  - id: S2-12-B
    audience: B
    source_flow: M23_N2.pdf p.6(인쇄 3)
    method_no: 1
    steps:
    - id: 2-12b-1
      content: |
        $f^2(x)=(f\circ f)(x)=f(c+\sqrt{2cx-x^2})=c+\sqrt{2c(c+\sqrt{2cx-x^2})-(c+\sqrt{2cx-x^2})^2}=c+\sqrt{(c-x)^2}=c+\lvert x-c\rvert$
      criteria: [2-1(2).M1]
    - id: 2-12b-2
      content: |
        위의 식으로부터 (i) $c$가 양수일 경우 $0\le a_1<c$이면 $a_n=\begin{cases}a_1&(n=1)\\a_2&(n\text{은 짝수})\\2c-a_1&(n\text{은 홀수},n>1)\end{cases}$이고 $c<a_1\le2c$이면 $a_n=\begin{cases}a_1&(n\text{은 홀수})\\a_2&(n\text{은 짝수})\end{cases}$이다. 따라서, 수열 $\{a_n\}$이 수렴하기 위해 $0\le a_1<c$이면 $a_2=2c-a_1$이고, $c<a_1\le2c$이면 $a_1=a_2$가 성립해야 한다. 즉, $0\le a_1<c$이면 $2c-a_1=a_2=f(a_1)=c+\sqrt{2ca_1-a_1^2}$이고 $a_1=\dfrac{2c-\sqrt{2c^2}}{2}=\dfrac{c(2-\sqrt2)}{2}$이며, $c<a_1\le2c$이면 $a_1=a_2=f(a_1)=c+\sqrt{2ca_1-a_1^2}$이고 $a_1=\dfrac{2c+\sqrt{2c^2}}{2}=\dfrac{c(2+\sqrt2)}{2}$이다.
      criteria: [2-1(2).M2]
    - id: 2-12b-3
      content: |
        (ii) $c$가 음수일 경우 $2c\le a_1<c$이면 $a_n=\begin{cases}a_1&(n=1)\\a_2&(n\text{은 짝수})\\2c-a_1&(n\text{은 홀수},n>1)\end{cases}$이고 $c<a_1\le0$이면 $a_n=\begin{cases}a_1&(n\text{은 홀수})\\a_2&(n\text{은 짝수})\end{cases}$이다. 따라서, 수열 $\{a_n\}$이 수렴하기 위해 $2c\le a_1<c$이면 $a_2=2c-a_1$이고 $c<a_1\le0$이면 $a_1=a_2$가 성립해야 한다. 즉, $2c\le a_1<c$이면 $2c-a_1=a_2=f(a_1)=c+\sqrt{2ca_1-a_1^2}$이고 $a_1=\dfrac{2c-\sqrt{2c^2}}{2}=\dfrac{c(2+\sqrt2)}{2}$이며, $c<a_1\le0$이면 $a_1=a_2=f(a_1)=c+\sqrt{2ca_1-a_1^2}$이고 $a_1=\dfrac{2c+\sqrt{2c^2}}{2}=\dfrac{c(2-\sqrt2)}{2}$이다.
      criteria: [2-1(2).M3]
    - id: 2-12b-4
      content: |
        따라서, 답은 $\dfrac{c(2\pm\sqrt2)}{2}$이다.
      criteria: [2-1(2).B1, 2-1(2).B2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1(2).M1
      mark_type: M
      points: 10
      evidence: |
        $f^2(x)=c+\lvert x-c\rvert$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2-12b-1]
    - id: 2-1(2).M2
      mark_type: M
      points: 10
      evidence: |
        $c$가 양수일 경우 수열 $\{a_n\}$의 일반항을 구했다.
      depends_on: [2-1(2).M1]
      implied_ok: false
      steps: [2-12b-2]
    - id: 2-1(2).M3
      mark_type: M
      points: 10
      evidence: |
        $c$가 음수일 경우 수열 $\{a_n\}$의 일반항을 구했다.
      depends_on: [2-1(2).M1]
      implied_ok: false
      steps: [2-12b-3]
    - id: 2-1(2).B1
      mark_type: B
      points: 5
      evidence: |
        답 $a_1=\dfrac{c(2+\sqrt2)}{2}$를 구했다(각 5점).
      steps: [2-12b-4]
    - id: 2-1(2).B2
      mark_type: B
      points: 5
      evidence: |
        답 $a_1=\dfrac{c(2-\sqrt2)}{2}$를 구했다(각 5점).
      steps: [2-12b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-SEQ-42302}
  misconceptions:
  - id: MC-SEQ-42302
    outcome_code: '71'
    wrong_work: '고정점 $f(a_1)=a_1$만 풀어 $c>0$일 때 $\tfrac{c(2+\sqrt2)}{2}$ 하나만 답함(한 번 이동 후 고정점에 도달하는 초항을 놓침)'
    detect_cue: 답이 한 개
    feedback: $a_2$가 고정점이어도 수열은 수렴합니다. $f(a_1)$이 고정점이 되는 $a_1$도 찾으세요.
    remedy: [RL-2]

- id: '2-2(1)'
  stem: |
    【2-2】 정의역과 공역이 모두 열린구간 $(0,\infty)$인 미분가능한 함수 $f(x)$가 모든 양수 $x$에 대하여
    $$f(x)f'\left(\dfrac1x\right)=x$$
    를 만족시킨다. 함수 $g(x)=f(x)f\left(\dfrac1x\right)$에 대하여 다음 물음에 답하시오.
    (1) $\dfrac{g(2023)}{g(2022)}$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-21-A
    audience: A
    method_no: 1
    key_idea: $x\to\tfrac1x$로 바꾼 식 $f\left(\tfrac1x\right)f'(x)=\tfrac1x$를 쓰면 $g'(x)=\tfrac1x-\tfrac1x=0$.
    steps:
    - {id: 2-21a, content: '$g$ 상수 → $1$', criteria: [2-2(1).R1, 2-2(1).A1]}
    hint_ladder:
    - $g'(x)$를 곱의 미분과 합성함수의 미분으로 계산하자.
  - id: S2-21-B
    audience: B
    source_flow: M23_N2.pdf p.6(인쇄 3–4)
    method_no: 1
    steps:
    - id: 2-21b-1
      content: |
        문제의 조건으로부터 $f\left(\dfrac1x\right)f'(x)=\dfrac1x$임을 알 수 있다. 한편, $g'(x)=f'(x)f\left(\dfrac1x\right)+f(x)f'\left(\dfrac1x\right)\left(-\dfrac1{x^2}\right)=\dfrac1x+x\left(-\dfrac1{x^2}\right)=0$. 즉, $g(x)$는 상수함수이다.
      criteria: [2-2(1).R1]
    - id: 2-21b-2
      content: |
        따라서, $\dfrac{g(2023)}{g(2022)}=1$이다.
      criteria: [2-2(1).A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2(1).R1
      mark_type: R
      points: 10
      evidence: |
