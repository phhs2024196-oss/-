- id: '2-2(2)'
  stem: |
    (2) $t=g(1)$일 때, $f(e)$의 값을 $h(t)$라 하자. 닫힌구간 $[1,3]$에서 함수 $h(t)$의 최솟값을 구하시오. (40점)
  points: 40
  depends_on: ['2-2(1)']
  answer: {kind: value, value: 'sqrt(2*E)', equivalents: ['$\sqrt{2e}$'], tolerance: null}
  solutions:
  - id: S2-22-A
    audience: A
    method_no: 1
    key_idea: $g\equiv t$이므로 $f\left(\tfrac1x\right)=\tfrac{t}{f(x)}$, 조건과 합쳐 $\dfrac{f'(x)}{f(x)}=\dfrac1{tx}$, $f(x)=\sqrt tx^{\frac1t}$.
    steps:
    - {id: 2-22a, content: '$h(t)=\sqrt te^{\frac1t}$, $t=2$에서 최소 $\sqrt{2e}$', criteria: [2-2(2).M1, 2-2(2).M2, 2-2(2).A1]}
    hint_ladder:
    - $f\left(\tfrac1x\right)f'(x)=\tfrac1x$에 $f\left(\tfrac1x\right)=\tfrac{t}{f(x)}$를 넣자.
  - id: S2-22-B
    audience: B
    source_flow: M23_N2.pdf p.6(인쇄 4)
    method_no: 1
    steps:
    - id: 2-22b-1
      content: |
        (1)에 의해 $g(x)$는 상수함수이므로 모든 $x$에 대하여 $g(x)=g(1)=t$이다. 즉, $f(x)f\left(\dfrac1x\right)=g(x)=t$이다. 한편, $f\left(\dfrac1x\right)f'(x)=\dfrac1x$이므로 $\dfrac{f'(x)}{f(x)}=\dfrac1{tx}$이다.
      criteria: [2-2(2).M1]
    - id: 2-22b-2
      content: |
        따라서 $\displaystyle\int\dfrac{f'(x)}{f(x)}dx=\int\dfrac{1}{tx}dx$이고 $\ln f(x)=\dfrac1t\ln x+C=\ln x^{\frac1t}+\ln e^C=\ln e^Cx^{\frac1t}$, 즉, $f(x)=e^Cx^{\frac1t}$이다. ($C$는 적분상수)
      criteria: [2-2(2).M2]
    - id: 2-22b-3
      content: |
        그러므로 $t=f(x)f\left(\dfrac1x\right)=\left(e^Cx^{\frac1t}\right)\left(e^Cx^{-\frac1t}\right)=(e^C)^2$이고 $f(x)=\sqrt tx^{\frac1t}$이다. 함수 $h(t)=f(e)=\sqrt te^{\frac1t}$에 대하여 $h'(t)=\dfrac{e^{\frac1t}(t-2)}{2\sqrt{t^3}}$이므로 구간 $1\le t\le3$에서 $h(t)$는 $t=2$일 때 최솟값 $\sqrt{2e}$를 가진다.
      # [판독확인] 원문 h'(t) 분자 표기가 「∜e(t-2)」처럼 보임 — e^{1/t}(t-2) 로 옮김
      criteria: [2-2(2).A1]
