stimuli:
- label: (가)
  body: |
    모든 실수 $\alpha,\beta$에 대하여
    $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$
    $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$
    $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$
    $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$
- label: (나)
  body: |
    삼각함수의 미분법
    $(\sin x)'=\cos x$, $(\cos x)'=-\sin x$
    $(\tan x)'=\sec^2x$, $(\cot x)'=-\csc^2x$
    $(\sec x)'=\sec x\tan x$, $(\csc x)'=-\csc x\cot x$
- label: (다)
  body: |
    삼각함수의 성질
    $\sin^2x+\cos^2x=1$
    $\tan^2x+1=\sec^2x$
    $\cot^2x+1=\csc^2x$
- label: (라)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 미분가능한 함수 $x=g(t)$에 대해서 $a=g(\alpha)$, $b=g(\beta)$일 때 도함수 $g'(t)$가 $\alpha,\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
- label: (마)
  body: |
    닫힌구간 $[a,b]$에서 두 함수 $f(x)$, $g(x)$가 미분가능하고, $f'(x)$, $g'(x)$가 연속일 때,
    $$\int_a^bf(x)g'(x)\,dx=\bigl[f(x)g(x)\bigr]_a^b-\int_a^bf'(x)g(x)\,dx$$

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

subparts:
- id: '3-1'
  stem: |
    【3-1】 모든 실수 $x$에 대하여
    $$\cos\left(x-\dfrac{\pi}{4}\right)=\dfrac{1}{\sqrt2}(\sin x+\cos x)$$
    가 성립함을 보이시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-1-A
    audience: A
    method_no: 1
    key_idea: 덧셈정리 $\cos(\alpha-\beta)$에 $\beta=\tfrac{\pi}{4}$.
    steps:
    - {id: 3-1a, content: '$\cos x\cos\tfrac{\pi}{4}+\sin x\sin\tfrac{\pi}{4}=\tfrac1{\sqrt2}(\sin x+\cos x)$', criteria: [3-1.R1]}
    hint_ladder:
    - 제시문 (가)의 넷째 식.
  - id: S3-1-B
    audience: B
    source_flow: M23_N2.pdf p.7(인쇄 5)
    method_no: 1
    steps:
    - id: 3-1b-1
      content: |
        삼각함수의 덧셈정리에 의해 $\cos\left(x-\dfrac{\pi}{4}\right)=\cos x\cos\dfrac{\pi}{4}+\sin x\sin\dfrac{\pi}{4}=\dfrac{1}{\sqrt2}(\sin x+\cos x)$이다.
      criteria: [3-1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-1.R1
      mark_type: R
      points: 20
      evidence: |
        삼각함수의 덧셈공식을 사용하여 항등식을 보였다.
      depends_on: []
      steps: [3-1b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42327}
  misconceptions:
  - id: MC-CAL-42327
    outcome_code: '71'
    wrong_work: '$\cos(\alpha-\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$로 부호를 틀려 $\tfrac1{\sqrt2}(\cos x-\sin x)$를 얻음'
    detect_cue: 결과에 $\cos x-\sin x$
    feedback: $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$입니다(제시문 (가)).
    remedy: [RL-1]

- id: '3-2'
  stem: |
    【3-2】 $\displaystyle\int_0^{\frac{\pi}{2}}\dfrac{1}{(\sin x+\cos x)^{10}}\,dx$의 값을 구하시오. (50점)
  points: 50
  depends_on: ['3-1']
  answer: {kind: value, value: '83/315', equivalents: [], tolerance: null}
  solutions:
  - id: S3-2-A
    audience: A
    method_no: 1
    key_idea: $I_n=2^{-\frac n2}\int_{-\frac{\pi}{4}}^{\frac{\pi}{4}}\sec^nx\,dx$, 부분적분 점화식 $I_n=\dfrac1{n-1}+\dfrac{n-2}{2n-2}I_{n-2}$.
    steps:
    - {id: 3-2a, content: '$I_2=1\to I_4=\tfrac23\to I_6=\tfrac7{15}\to I_8=\tfrac{12}{35}\to I_{10}=\tfrac{83}{315}$', criteria: [3-2.M1, 3-2.A1]}
    hint_ladder:
    - 3-1로 분모를 $\left(\sqrt2\cos\left(x-\tfrac{\pi}{4}\right)\right)^{10}$로 바꾸자.
    - $\sec^n=\sec^{n-2}\cdot(\tan x)'$로 보고 부분적분.
  - id: S3-2-B
    audience: B
    source_flow: M23_N2.pdf p.7(인쇄 5–6)
    method_no: 1
    steps:
    - id: 3-2b-1
      content: |
        모든 음이 아닌 정수 $n$에 대해, $I_n=\displaystyle\int_0^{\frac{\pi}{2}}\dfrac{1}{(\sin x+\cos x)^n}dx$이라 하면, 3-1과 치환적분에 의해
        $$I_n=\int_0^{\frac{\pi}{2}}\dfrac{1}{\left(\sqrt2\cos\left(x-\frac{\pi}{4}\right)\right)^n}dx=2^{-\frac n2}\int_0^{\frac{\pi}{2}}\sec^n\left(x-\dfrac{\pi}{4}\right)dx=2^{-\frac n2}\int_{-\frac{\pi}{4}}^{\frac{\pi}{4}}\sec^nx\,dx$$
        이다. $2$보다 큰 정수 $n$에 대해, 닫힌구간 $\left[-\dfrac{\pi}{4},\dfrac{\pi}{4}\right]$에서 두 함수 $f(x)=\sec^{n-2}x$와 $g(x)=\tan x$이 미분가능하고 $f'(x)=(n-2)\sec^{n-2}x\tan x$와 $g'(x)=\sec^2x$이 연속이므로, 부분적분법과 삼각함수의 성질에 의해
        $$I_n=2^{-\frac n2}\bigl[\sec^{n-2}x\tan x\bigr]_{-\frac{\pi}{4}}^{\frac{\pi}{4}}-2^{-\frac n2}\int_{-\frac{\pi}{4}}^{\frac{\pi}{4}}(n-2)\sec^{n-2}x\tan^2x\,dx=1-2^{-\frac n2}\int_{-\frac{\pi}{4}}^{\frac{\pi}{4}}(n-2)\sec^nx\,dx+2^{-\frac n2}\int_{-\frac{\pi}{4}}^{\frac{\pi}{4}}(n-2)\sec^{n-2}x\,dx=1-(n-2)I_n+\dfrac{n-2}{2}I_{n-2}$$
        이다. 정리하면, $I_n=\dfrac{1}{n-1}+\dfrac{n-2}{2n-2}I_{n-2}$이고 $I_2=2^{-1}\displaystyle\int_{-\frac{\pi}{4}}^{\frac{\pi}{4}}\sec^2x\,dx=2^{-1}\bigl[\tan x\bigr]_{-\frac{\pi}{4}}^{\frac{\pi}{4}}=1$이다.
      criteria: [3-2.M1]
    - id: 3-2b-2
      content: |
        $I_4=\dfrac13+\dfrac{I_2}{3}=\dfrac23$, $I_6=\dfrac15+\dfrac{2I_4}{5}=\dfrac{7}{15}$, $I_8=\dfrac17+\dfrac{3I_6}{7}=\dfrac{12}{35}$, $I_{10}=\dfrac19+\dfrac{4I_8}{9}=\dfrac{83}{315}$. 따라서 $\displaystyle\int_0^{\frac{\pi}{2}}\dfrac{1}{(\sin x+\cos x)^{10}}dx=\dfrac{83}{315}$이다.
      criteria: [3-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 30
      evidence: |
        삼각함수의 성질과 치환적분법 혹은 부분적분법을 통해 다항식의 적분 형태로 변형하거나 점화식의 형태로 변형했다.
      depends_on: []
      implied_ok: false
      steps: [3-2b-1]
    - id: 3-2.A1
      mark_type: A
      points: 20
      evidence: |
        정확한 답 $\dfrac{83}{315}$를 구했다.
      depends_on: [3-2.M1]
      cao: true
      steps: [3-2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42328}
  misconceptions:
  - id: MC-CAL-42328
    outcome_code: '71'
    wrong_work: '부분적분 후 $\tan^2x=\sec^2x-1$ 대입에서 $(n-2)I_n$ 항의 이항을 빠뜨려 $I_n=1+\dfrac{n-2}{2}I_{n-2}-(n-2)I_n$을 잘못 정리하거나 $2^{-\frac n2}$ 배율을 놓침'
    detect_cue: $I_4\ne\tfrac23$
    feedback: 우변의 $(n-2)I_n$을 좌변으로 옮겨 $(n-1)I_n=1+\dfrac{n-2}{2}I_{n-2}$로 정리하세요. $\sec^{n-2}$ 적분은 $2^{-\frac{n-2}{2}}$ 배율이라 $\tfrac12$이 생깁니다.
    remedy: [RL-2]

- id: '3-3'
  stem: |
    【3-3】 $\displaystyle\int_0^{\frac{\pi}{2}}\dfrac{x}{(\sin x+\cos x)^{10}}\,dx$의 값을 구하시오. (50점)
  points: 50
  depends_on: ['3-2']
  answer: {kind: value, value: '83*pi/1260', equivalents: ['$\dfrac{83\pi}{1260}$'], tolerance: null}
  solutions:
  - id: S3-3-A
    audience: A
    method_no: 1
    key_idea: $x=\tfrac{\pi}{2}-t$ 치환으로 분모 불변, $J=\tfrac{\pi}{2}I_{10}-J$.
    steps:
    - {id: 3-3a, content: '$J=\tfrac{\pi}{4}\cdot\tfrac{83}{315}=\tfrac{83\pi}{1260}$', criteria: [3-3.M1, 3-3.A1]}
    hint_ladder:
    - $\sin\left(\tfrac{\pi}{2}-t\right)+\cos\left(\tfrac{\pi}{2}-t\right)=\cos t+\sin t$.
  - id: S3-3-B
    audience: B
    source_flow: M23_N2.pdf p.7(인쇄 6)
    method_no: 1
    steps:
    - id: 3-3b-1
      content: |
        $x=\dfrac{\pi}{2}-t$에 대해, 치환적분법을 적용하면,
        $$\int_0^{\frac{\pi}{2}}\dfrac{x}{(\sin x+\cos x)^{10}}dx=\int_{\frac{\pi}{2}}^0\dfrac{-\frac{\pi}{2}+t}{\left(\sin\left(\frac{\pi}{2}-t\right)+\cos\left(\frac{\pi}{2}-t\right)\right)^{10}}dt=\int_0^{\frac{\pi}{2}}\dfrac{\frac{\pi}{2}-x}{(\sin x+\cos x)^{10}}dx=\dfrac{\pi}{2}\int_0^{\frac{\pi}{2}}\dfrac{1}{(\sin x+\cos x)^{10}}dx-\int_0^{\frac{\pi}{2}}\dfrac{x}{(\sin x+\cos x)^{10}}dx$$
        이다.
      criteria: [3-3.M1]
    - id: 3-3b-2
      content: |
        따라서 $\displaystyle\int_0^{\frac{\pi}{2}}\dfrac{x}{(\sin x+\cos x)^{10}}dx=\dfrac{\pi}{4}\int_0^{\frac{\pi}{2}}\dfrac{1}{(\sin x+\cos x)^{10}}dx=\dfrac{83\pi}{1260}$이다.
      criteria: [3-3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3-3.M1
      mark_type: M
      points: 30
      evidence: |
        치환적분 등을 통해 우함수, 기함수 성질을 사용하여 특정 항이 0임을 보이거나 모범답안과 같은 치환적분을 적용했다.
      depends_on: []
      implied_ok: false
      steps: [3-3b-1]
    - id: 3-3.A1
      mark_type: A
      points: 20
      evidence: |
        3-2에서 계산한 적분값의 $\dfrac{\pi}{4}$배가 된다는 것을 구했다.
      depends_on: [3-3.M1]
      cao: true
      steps: [3-3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42329}
  misconceptions:
  - id: MC-CAL-42329
    outcome_code: '71'
    wrong_work: '대칭 치환 후 $J=\tfrac{\pi}{2}I_{10}-J$에서 $J=\tfrac{\pi}{2}I_{10}$로 이항을 빠뜨림'
    detect_cue: 답 $\tfrac{83\pi}{630}$
    feedback: 같은 적분 $J$가 양변에 있으므로 $2J=\tfrac{\pi}{2}I_{10}$입니다.
    remedy: [RL-3]

