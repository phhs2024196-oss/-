intent: |
  삼각함수의 덧셈정리를 이용해 항등식을 보일 수 있는지(3-1), 치환적분과 부분적분으로 정적분의 점화식을 세워 값을 구할 수 있는지(3-2), 치환적분으로 대칭성을 이용해 $x$가 곱해진 적분을 앞의 결과로 환원할 수 있는지(3-3) 평가한다. (모의고사 자료에 출제 의도 문항 없음 — 채점기준으로부터 요약)
key_idea: |
  $\sin x+\cos x=\sqrt2\cos\left(x-\tfrac{\pi}{4}\right)$로 $I_n=2^{-\frac n2}\int_{-\frac{\pi}{4}}^{\frac{\pi}{4}}\sec^nx\,dx$. $\sec^n=\sec^{n-2}\cdot\sec^2$로 부분적분하면 $I_n=\dfrac{1}{n-1}+\dfrac{n-2}{2n-2}I_{n-2}$, $I_2=1$. 3-3은 $x\mapsto\tfrac{\pi}{2}-x$로 $\int\dfrac{x}{(\cdots)^{10}}=\dfrac{\pi}{4}I_{10}$.
stuck: |
  3-2에서 분모를 $\sec$의 거듭제곱으로 바꾼 뒤 부분적분으로 $\tan^2=\sec^2-1$을 써서 같은 적분을 이항하는 점화식 단계, 3-3에서 $x$와 $\tfrac{\pi}{2}-x$를 더해 상쇄시키는 대칭 치환 단계
idea_tags: [IDEA-AUXILIARY-ANGLE, IDEA-REDUCTION-FORMULA-BY-PARTS, IDEA-KING-PROPERTY-SYMMETRY]
tags: [삼각함수 합성, 치환적분, 부분적분, 점화식, 대칭 치환]
