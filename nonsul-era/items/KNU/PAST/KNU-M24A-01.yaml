    remedy: [RL-2]
- id: 1-3
  stem: |
    【1-3】 시각 $t=4$에서의 두 점 $\mathrm{A}$와 $\mathrm{B}$ 사이의 거리 $d(A_4,B_4)$를 구하시오. (단, 근삿값 $\dfrac{1}{2\ln2}\approx0.72$, $\dfrac{1}{3\ln3}\approx0.3$, $\sqrt3\approx1.73$을 이용하여 소수점 3번째 자리에서 반올림을 해서 2자리까지의 값을 구하시오) (40점)
  points: 40
  depends_on: [1-2]
  answer: {kind: value, value: '13.44', equivalents: ['d(A_4,B_4)≈13.44'], tolerance: null}   # 문제가 지정한 근삿값 기준 답. 정확한 값은 ≈13.63(1/(3ln3)=0.3034… 등 근삿값 오차가 둘째 자리를 바꿈) [공식해설 확인필요]
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 거리 = 속력의 적분, 두 직선의 사잇각 $\frac{\pi}{6}$에 코사인법칙.
    steps:
    - {id: 13a, content: '$\ell_{\mathrm A}(4)\approx14.8$, $\ell_{\mathrm B}(4)\approx24$, $d^2\approx180.544$, $d\approx13.44$', criteria: [1-3.M1, 1-3.M2, 1-3.M3, 1-3.R1, 1-3.A1]}
    hint_ladder:
    - 원점에서 시각 $t$까지 각 점이 움직인 거리를 적분으로 쓰자.
    - 두 직선이 $x$축과 이루는 각은 각각 $\frac{\pi}{6}$, $\frac{\pi}{3}$이다.
  - id: S13-B
    audience: B
    source_flow: M24_N1.pdf p.5
    method_no: 1
    steps:
