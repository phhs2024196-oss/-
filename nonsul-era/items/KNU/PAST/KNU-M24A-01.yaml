  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  # [메모] 공식 예시답안은 4 이상의 자연수 t에 대해서만 2^t≥t^2를 보인 뒤 실수 t→∞ 극한에 적용함 — 엄밀히는 실수 t로의 확장 보완 필요 [공식해설 확인필요]
  solutions:
  - id: S141-A
    audience: A
    method_no: 1
    key_idea: $2^t\ge t^2$ ($t\ge4$)로 $0\le\frac{t+1}{2^t}\le\frac{t+1}{t^2}\to0$.
    steps:
    - {id: 141a, content: '귀납법 $2^t\ge t^2$ → 조임', criteria: [1-4-1.R1, 1-4-1.A1]}
    hint_ladder:
    - $2^t$와 $t^2$ 중 어느 쪽이 큰지 $t=4,5,6$에서 비교해 보자.
  - id: S141-B
    audience: B
    source_flow: M24_N1.pdf p.6
    method_no: 1
    steps:
    - id: 141b-1
      content: |
        4 이상인 모든 자연수 $t$에 대하여 $2^t\ge t^2$을 먼저 증명하자. $2^4=4^2$이므로 $t=4$일 때, $2^t\ge t^2$은 성립한다. $t=k\ (k\ge4)$일 때, $2^k\ge k^2$이 성립한다고 가정하자. 4 이상인 모든 자연수 $k$에 대하여 $k^2\ge2k+1$은 쉽게 보일 수 있고 $2^{k+1}=2\times2^k\ge2k^2=k^2+k^2\ge k^2+2k+1=(k+1)^2$이므로 $t=k+1$일 때도 $2^t\ge t^2$은 성립한다. 수학적 귀납법에 의해 4 이상인 모든 자연수 $t$에 대하여 $2^t\ge t^2$은 성립한다.
      criteria: [1-4-1.R1]
    - id: 141b-2
      content: |
        4 이상인 모든 자연수 $t$에 대하여 $2^t\ge t^2\,(>0)$이므로, $0\le\dfrac{t+1}{2^t}\le\dfrac{t+1}{t^2}$이 4 이상인 모든 자연수 $t$에 대하여 성립한다. $\displaystyle\lim_{t\to\infty}\dfrac{t+1}{t^2}=0$이므로 제시문 (마)에 의하여 $\displaystyle\lim_{t\to\infty}\dfrac{t+1}{2^t}=0$이다.
      criteria: [1-4-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-4-1.R1
      mark_type: R
      points: 5
      evidence: |
        4 이상인 모든 자연수 $t$에 대하여 $2^t\ge t^2$을 보였다.
      steps: [141b-1]
    - id: 1-4-1.A1
      mark_type: A
      points: 5
      evidence: |
        $0\le\dfrac{t+1}{2^t}\le\dfrac{t+1}{t^2}$이 성립함을 찾고, $\displaystyle\lim_{t\to\infty}\dfrac{t+1}{t^2}=0$이므로 제시문 (마)에 의하여 $\displaystyle\lim_{t\to\infty}\dfrac{t+1}{2^t}=0$임을 보였다.
      depends_on: [1-4-1.R1]
      steps: [141b-2]
    deductions: []
