  - id: MC-ALG-42403
    outcome_code: '71'
    wrong_work: |
      평행이동 방향을 반대로 적용해 $V_{\mathrm A}(x)=a^{x-\alpha_{\mathrm A}}+\beta_{\mathrm A}$로 두고 $\alpha_{\mathrm A}=1$, $\beta_{\mathrm A}=1$을 얻음(합 $6$)
    detect_cue: $\alpha$, $\beta$의 부호가 모두 반대
