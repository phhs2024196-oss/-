- id: 1-4-1
  stem: |
    【1-4】
    (1) 제시문 (마)를 이용하여, 극한값 $\displaystyle\lim_{t\to\infty}\dfrac{t+1}{2^t}$을 구하시오. (10점)
  points: 10
