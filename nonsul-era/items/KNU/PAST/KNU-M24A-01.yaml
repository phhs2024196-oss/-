      $V_{\mathrm A}$의 처음 몇 항($2,3,5,9$)을 나열하고 규칙이 $2^{n-1}+1$이라고만 써서 귀납 단계를 생략
    detect_cue: $n=k\Rightarrow n=k+1$ 단계의 식 변형이 없음
    feedback: 몇 개 항의 확인은 증명이 아닙니다. 가정 $V_{\mathrm A}(k)=2^{k-1}+1$을 점화식에 대입해 $2^k+1$이 됨을 보이세요.
    remedy: [RL-1]
- id: 1-2
  stem: |
    【1-2】 $a+b+\alpha_{\mathrm A}+\alpha_{\mathrm B}+\beta_{\mathrm A}+\beta_{\mathrm B}$의 값을 구하시오. (20점)
  points: 20
  depends_on: [1-1]
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $V_{\mathrm A}(x)=a^{x+\alpha_{\mathrm A}}-\beta_{\mathrm A}$에 세 값 대입.
    steps:
    - {id: 12a, content: '$\alpha_{\mathrm A}=-1$, $a=2$, $\beta_{\mathrm A}=-1$, $\alpha_{\mathrm B}=-1$, $b=3$, $\beta_{\mathrm B}=0$ ⇒ 합 $2$', criteria: [1-2.R1, 1-2.A1]}
    hint_ladder:
    - $y=a^x$를 거꾸로 평행이동하면 $V_{\mathrm A}(x)$가 된다. 식으로 쓰면?
  - id: S12-B
    audience: B
    source_flow: M24_N1.pdf p.5
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $y=a^x$의 그래프를 $x$축으로 $-\alpha_{\mathrm A}$만큼, $y$축으로 $-\beta_{\mathrm A}$만큼 평행이동하면 $y=V_{\mathrm A}(x)$의 그래프이므로, $V_{\mathrm A}(x)=a^{x+\alpha_{\mathrm A}}-\beta_{\mathrm A}$이다. $V_{\mathrm A}(1)=2$, $V_{\mathrm A}(2)=3$, $V_{\mathrm A}(3)=5$이므로 $a^{1+\alpha_{\mathrm A}}-\beta_{\mathrm A}=2$, $a^{2+\alpha_{\mathrm A}}-\beta_{\mathrm A}=3$, $a^{3+\alpha_{\mathrm A}}-\beta_{\mathrm A}=5$이다. 연립하면, $\alpha_{\mathrm A}=-1$, $a=2$, $\beta_{\mathrm A}=-1$임을 알 수 있다. 비슷하게, $\alpha_{\mathrm B}=-1$, $b=3$, $\beta_{\mathrm B}=0$을 구할 수 있으므로
      criteria: [1-2.R1]   # [판독확인] 원문 예시답안 셋째 식에 m_A, n_A 로 인쇄된 곳은 α_A, β_A 의 오식으로 보고 정정
    - id: 12b-2
      content: |
        $a+b+\alpha_{\mathrm A}+\alpha_{\mathrm B}+\beta_{\mathrm A}+\beta_{\mathrm B}=2$이다.
      criteria: [1-2.A1]
