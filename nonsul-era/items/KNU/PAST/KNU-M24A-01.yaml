intent: |
  수학적 귀납법과 등비수열로 수열의 일반항을 보이고(1-1), 지수함수의 그래프의 평행이동을 이해하며(1-2), 속력을 적분하여 움직인 거리를 구하고 코사인법칙으로 두 점 사이의 거리를 근삿값으로 구하며(1-3), 수학적 귀납법과 함수의 극한의 대소 관계로 극한값을 구하고 삼각형의 넓이의 비의 극한을 구할 수 있는지(1-4) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 예시답안 흐름으로 요약)
key_idea: |
  $V_{\mathrm A}(x)=2^{x-1}+1$, $V_{\mathrm B}(x)=3^{x-1}$이므로 움직인 거리 $\ell_{\mathrm A}(t)=\dfrac{2^t-1}{2\ln2}+t$, $\ell_{\mathrm B}(t)=\dfrac{3^t-1}{3\ln3}$. 두 직선이 이루는 각이 $\frac{\pi}{6}$이므로 $d^2=\ell_{\mathrm A}^2+\ell_{\mathrm B}^2-\sqrt3\ell_{\mathrm A}\ell_{\mathrm B}$, 넓이의 비는 $\dfrac{\ell_{\mathrm A}(t)\ell_{\mathrm B}(t+1)}{\ell_{\mathrm A}(t+1)\ell_{\mathrm B}(t)}\to\frac12\cdot3$.
stuck: |
  1-2에서 수열 조건만으로 주어진 $V_{\mathrm A}$를 $a^{x+\alpha_{\mathrm A}}-\beta_{\mathrm A}$ 꼴로 놓고 세 값으로 연립하는 단계, 1-4(1)에서 $2^t\ge t^2$를 귀납법으로 보여 조임 정리에 쓰는 단계
