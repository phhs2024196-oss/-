stimuli:
- label: (가)
  body: |
    직선 $y=mx+n$이 $x$축의 양의 방향과 이루는 각의 크기를 $\theta$라 하면 $\tan\theta$는 직선의 기울기 $m$과 같다.
- label: (나)
  body: |
    자연수 $n$에 대한 명제 $p(n)$이 모든 자연수에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.

    (ⅰ) $n=1$일 때 명제 $p(n)$이 성립한다.

    (ⅱ) $n=k$일 때 명제 $p(n)$이 성립한다고 가정하면 $n=k+1$일 때도 명제 $p(n)$이 성립한다.
- label: (다)
  body: |
    좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 위치 $(x,y)$가 두 함수 $x=f(t)$, $y=g(t)$로 나타내어질 때, 시각 $t$에서의 점 $\mathrm{P}$의 속력은 $\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}$이고, 시각 $t=a$에서 $t=b$까지 점 $\mathrm{P}$가 움직인 거리 $s$는
    $$s=\int_a^b\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}\,dt$$
    이다.
- label: (라)
  body: |
    삼각형 $\mathrm{ABC}$에서
    $$a^2=b^2+c^2-2bc\cos A$$
    $$b^2=c^2+a^2-2ca\cos B$$
    $$c^2=a^2+b^2-2ab\cos C$$
    이다.
- label: (마)
  body: |
    두 함수 $f(x)$, $g(x)$에서 $\displaystyle\lim_{x\to a}f(x)=\alpha$, $\displaystyle\lim_{x\to a}g(x)=\beta$ (단, $\alpha$, $\beta$는 실수)일 때, $a$에 가까운 모든 실수 $x$에서 함수 $h(x)$에 대하여 $f(x)\le h(x)\le g(x)$이고 $\alpha=\beta$이면, $\displaystyle\lim_{x\to a}h(x)=\alpha$이다.

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  실수 전체의 집합에서 미분가능인 두 함수 $y=V_{\mathrm A}(x)$, $y=V_{\mathrm B}(x)$가 다음 조건을 만족시킨다.

  > (Ⅰ) 모든 자연수 $n$에 대하여 두 수열 $\{V_{\mathrm A}(n)\}$와 $\{V_{\mathrm B}(n)\}$는 각각 $V_{\mathrm A}(n+1)=2V_{\mathrm A}(n)-1$과 $V_{\mathrm B}(n+1)=3V_{\mathrm B}(n)$을 만족시키며, $V_{\mathrm A}(1)=2$ 이고 $V_{\mathrm B}(1)=1$ 이다.
  >
  > (Ⅱ) 함수 $y=V_{\mathrm A}(x)$의 그래프를 $x$축의 방향으로 $\alpha_A$만큼, $y$축의 방향으로 $\beta_A$만큼 평행이동 하였더니 지수함수 $y=a^x$의 그래프가 되었고, 함수 $y=V_{\mathrm B}(x)$의 그래프를 $x$축의 방향으로 $\alpha_B$만큼, $y$축의 방향으로 $\beta_B$만큼 평행이동 하였더니 지수함수 $y=b^x$의 그래프가 되었다.
  >
  > (Ⅲ) 좌표평면 위의 두 점 $\mathrm{A}$와 $\mathrm{B}$는 각각 직선 $y=\dfrac{1}{\sqrt3}x$와 $y=\sqrt3x$위를 움직인다. $\mathrm{A}$와 $\mathrm{B}$는 시각 $t=0$일 때 원점 $\mathrm{O}$에서 만난 후 제 1사분면 위를 움직이며, 시각 $t\,(\ge0)$에서의 위치는 각각 $A_t$와 $B_t$이며 그때의 속력은 각각 $V_{\mathrm A}(t)$와 $V_{\mathrm B}(t)$이다.

  다음 물음에 답하시오.

subparts:
- id: 1-1
  stem: |
    【1-1】 모든 자연수 $n$에 대하여 $V_{\mathrm A}(n)=2^{n-1}+1$이고 $V_{\mathrm B}(n)=3^{n-1}$임을 보이시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $V_{\mathrm A}$는 귀납법, $V_{\mathrm B}$는 공비 3인 등비수열.
    steps:
    - {id: 11a, content: '$V_{\mathrm A}(k+1)=2(2^{k-1}+1)-1=2^k+1$; $V_{\mathrm B}(n)=3^{n-1}$', criteria: [1-1.R1, 1-1.R2]}
    hint_ladder:
    - $n=k$에서 식이 성립한다고 가정하고 점화식에 대입하자.
  - id: S11-B
    audience: B
    source_flow: M24_N1.pdf p.5
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $V_{\mathrm A}(1)=2^0+1=2$ 이므로 $n=1$일 때 성립한다. $n=k$일 때, $V_{\mathrm A}(k)=2^{k-1}+1$이라 가정하면, $V_{\mathrm A}(k+1)=2V_{\mathrm A}(k)-1=2(2^{k-1}+1)-1=2^k+1$이므로 $n=k+1$일 때도 성립하여 수학적 귀납법에 의하여 $V_{\mathrm A}(n)=2^{n-1}+1$이다.
      criteria: [1-1.R1]
    - id: 11b-2
      content: |
        $V_{\mathrm B}(n+1)=3V_{\mathrm B}(n)$이므로 $V_{\mathrm B}(n)$은 공비가 $3$인 등비수열이다. 즉, $V_{\mathrm B}(n)=3^{n-1}$이다. ■
      criteria: [1-1.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.R1
      mark_type: R
      points: 15
      evidence: |
        수학적 귀납법에 의하여 $V_{\mathrm A}(n)=2^{n-1}+1$임을 보였다.
      steps: [11b-1]
    - id: 1-1.R2
      mark_type: R
      points: 15
      evidence: |
        $V_{\mathrm B}(n)=3^{n-1}$를 구했다.
      steps: [11b-2]
    deductions: []
