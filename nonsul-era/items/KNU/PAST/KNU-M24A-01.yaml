    remedy: [RL-4]
- id: 1-4-2
  stem: |
    (2) 삼각형 $\mathrm{OA}_t\mathrm{B}_{t+1}$과 삼각형 $\mathrm{OA}_{t+1}\mathrm{B}_t$의 넓이를 각각 $S_t$와 $T_t$라 할 때, $\displaystyle\lim_{t\to\infty}\dfrac{S_t}{T_t}$의 값을 구하시오. (30점)
  points: 30
  depends_on: [1-3, 1-4-1]
  answer: {kind: value, value: '3/2', equivalents: [], tolerance: null}
  solutions:
  - id: S142-A
    audience: A
    method_no: 1
    key_idea: $\frac{S_t}{T_t}=\frac{\ell_{\mathrm A}(t)}{\ell_{\mathrm A}(t+1)}\cdot\frac{\ell_{\mathrm B}(t+1)}{\ell_{\mathrm B}(t)}\to\frac12\cdot3$.
    steps:
    - {id: 142a, content: '넓이 $\frac12\ell\ell\sin\frac{\pi}{6}$, 분자·분모를 $2^t3^t$로 나누고 (1)의 극한 사용 ⇒ $\frac32$', criteria: [1-4-2.M1, 1-4-2.M2, 1-4-2.A1]}
    hint_ladder:
    - 두 삼각형 모두 꼭지각이 $\frac{\pi}{6}$이다.
    - $\ell_{\mathrm A}(t)$에서 가장 빨리 커지는 항은 무엇인가?
  - id: S142-B
    audience: B
    source_flow: M24_N1.pdf p.6
    method_no: 1
    steps:
    - id: 142b-1
      content: |
        $S_t=\dfrac12\ell_{\mathrm A}(t)\ell_{\mathrm B}(t+1)\sin\dfrac{\pi}{6}$, $T_t=\dfrac12\ell_{\mathrm A}(t+1)\ell_{\mathrm B}(t)\sin\dfrac{\pi}{6}$이므로,
      criteria: [1-4-2.M1]
    - id: 142b-2
      content: |
        $$\dfrac{S_t}{T_t}=\dfrac{\ell_{\mathrm A}(t)\ell_{\mathrm B}(t+1)}{\ell_{\mathrm A}(t+1)\ell_{\mathrm B}(t)}=\dfrac{\left(1-\dfrac{1}{2^t}+2\ln2\dfrac{t}{2^t}\right)\left(3-\dfrac{1}{3^t}\right)}{\left(2-\dfrac{1}{2^t}+2\ln2\dfrac{t+1}{2^t}\right)\left(1-\dfrac{1}{3^t}\right)}$$
        이고,
      criteria: [1-4-2.M2]
    - id: 142b-3
      content: |
        (1)에 의해 $\displaystyle\lim_{t\to\infty}\dfrac{S_t}{T_t}=\dfrac32$이다.
      criteria: [1-4-2.A1]
