  materials:
  - '점화식 $V_{\mathrm A}(n+1)=2V_{\mathrm A}(n)-1$, $V_{\mathrm B}(n+1)=3V_{\mathrm B}(n)$, $V_{\mathrm A}(1)=2$, $V_{\mathrm B}(1)=1$'
  - '평행이동하면 지수함수 $y=a^x$, $y=b^x$가 되는 두 함수 $V_{\mathrm A}(x)$, $V_{\mathrm B}(x)$'
  - '직선 $y=\frac{1}{\sqrt3}x$, $y=\sqrt3x$ 위를 원점에서 출발해 속력 $V_{\mathrm A}(t)$, $V_{\mathrm B}(t)$로 움직이는 두 점'
  - '삼각형 $\mathrm{OA}_t\mathrm{B}_{t+1}$, $\mathrm{OA}_{t+1}\mathrm{B}_t$의 넓이의 비'
  concepts:
  - '직선의 기울기와 $\tan\theta$(제시문 (가))'
  - '수학적 귀납법(제시문 (나))'
  - '속력과 움직인 거리(제시문 (다))'
  - '코사인법칙(제시문 (라))'
  - '함수의 극한의 대소 관계(제시문 (마))'
  - '지수함수의 그래프의 평행이동, 지수함수의 적분'
  tools:
  - '귀납법으로 $V_{\mathrm A}(n)=2^{n-1}+1$, 등비수열로 $V_{\mathrm B}(n)=3^{n-1}$'
  - '$V_{\mathrm A}(x)=a^{x+\alpha_{\mathrm A}}-\beta_{\mathrm A}$에 $x=1,2,3$ 대입·연립'
  - '$\int_0^t2^{x-1}dx=\frac{2^t-1}{2\ln2}$'
  - '두 직선의 사잇각 $\frac{\pi}{3}-\frac{\pi}{6}=\frac{\pi}{6}$ → $d^2=\ell_{\mathrm A}^2+\ell_{\mathrm B}^2-\sqrt3\ell_{\mathrm A}\ell_{\mathrm B}$'
  - '귀납법으로 $2^t\ge t^2$ ($t\ge4$) → $0\le\frac{t+1}{2^t}\le\frac{t+1}{t^2}$'
  - '넓이 $\frac12\ell_{\mathrm A}\ell_{\mathrm B}\sin\frac{\pi}{6}$의 비에서 분자·분모를 $2^t$, $3^t$로 나눔'
  conditions:
