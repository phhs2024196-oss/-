      steps: [232b-3]
    - id: 2-3-2.A1
      mark_type: A
      points: 10
      evidence: |
        $\displaystyle\int_{-8}^{2}\left\{f(x)+\dfrac12\right\}g(x)\,dx=2\ln2-2$를 구했다.
      depends_on: [2-3-2.R1, 2-3-2.M1, 2-3-2.M2]
