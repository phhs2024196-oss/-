  - '조건 $\{e^{g(x)}-f(x)\}\{e^{g(x)}-f(x+1)\}\{g(x)-\ln(x^2+x+1)\}g(x)=0$'
  - '$g(-2024)=0$, $g\left(-\frac12\right)g\left(\frac32\right)>0$'
  - '$g(x)=t$ ($-8\le x\le2$)의 실근의 개수 $h(t)$, $h\left(\ln\frac34\right)=5$'
  concepts:
  - '함수의 연속(제시문 (가)), 미분가능(제시문 (나)), 좌·우극한(제시문 (다))'
  - '정적분의 성질(제시문 (라)), 치환적분법(제시문 (마)), 부분적분법(제시문 (바))'
  - '지수·로그함수의 성질, 주기함수'
  tools:
  - '$e^{g}>0$이므로 $f(x)\le0$이면 첫 인수 $\ne0$'
  - '$x<-1$ 또는 $x>0$이면 $\ln(x^2+x+1)>0$이라 (Ⅳ)와 충돌하는 경우 배제'
  - '연속성으로 구간별 식 이어 붙이기, 좌·우미분계수 비교'
  - '$y=t$와의 교점 개수 세기($\ln\frac34>-\ln2$)'
  - '주기 $4$와 평행이동으로 $\int_{-8}^{2}=\int_{-1}^0+2\int_1^2$'
  - '$x+\frac12=u$ 치환 → 홀함수 $u\ln\left(u^2+\frac34\right)$의 대칭 구간 적분 $=0$'
  conditions:
  - '$f$, $g$는 실수 전체에서 연속'
  - '$t\ne0$, $-8\le x\le2$'
