intent: |
  곱이 0인 조건과 연속성으로 구간마다 함수 $g(x)$를 결정하고(2-1, 2-2), 미분가능성을 판정하며(2-2), 실근의 개수 조건으로 남은 구간의 함수를 확정해 극한값을 구하고(2-3(1)), 주기성·대칭성과 치환적분으로 정적분의 값을 구할 수 있는지(2-3(2)) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 예시답안 흐름으로 요약)
key_idea: |
  조건 (Ⅲ)에서 각 $x$마다 $g(x)\in\{\ln f(x),\ \ln f(x+1),\ \ln(x^2+x+1),\ 0\}$ 중 하나(로그는 진수가 양수일 때만). $f\le0$인 곳, $\ln(x^2+x+1)>0$인 곳을 배제하고 (Ⅳ)와 연속성으로 $[-2,2]$에서 $g$를 결정한다. $[-8,-2]$에서는 $h(\ln\frac34)=5$로 $[1,2]$ 모양의 복사본이 한 번만 나타남을 정하고, $\int_{-1}^0$은 $x+\frac12$ 치환 후 홀함수라 $0$.
stuck: |
  2-2에서 $f(x)\le0$인 구간과 $\ln(x^2+x+1)$의 부호로 네 인수 중 어느 것이 $0$인지를 구간별로 확정하고 연속성으로 이어 붙이는 단계, 2-3에서 $h(\ln\frac34)=5$를 이용해 $[-8,-2]$의 $g$를 두 경우로 좁히는 단계
idea_tags: [IDEA-PRODUCT-ZERO-CASEWISE-CONTINUITY, IDEA-ODD-SYMMETRY-INTEGRAL-ZERO]
