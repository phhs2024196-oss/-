stimuli:
- label: (가)
  body: |
    함수 $f(x)$가 실수 $a$에 대하여 다음 세 조건을 만족시킬 때, $f(x)$는 $x=a$에서 연속이라고 한다.

    (ⅰ) $f(x)$가 $x=a$에서 정의되어 있다.

    (ⅱ) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재한다.

    (ⅲ) $\displaystyle\lim_{x\to a}f(x)=f(a)$
- label: (나)
  body: |
    함수 $f(x)$에 대하여 극한값
    $$\lim_{x\to a}\dfrac{f(x)-f(a)}{x-a}$$
    가 존재하면 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다.
- label: (다)
  body: |
    $x=a$에서 함수 $f(x)$의 우극한과 좌극한이 모두 존재하고, 그 값이 모두 $L$이면 $\displaystyle\lim_{x\to a}f(x)=L$이다.
- label: (라)
  body: |
    함수 $f(x)$가 임의의 세 실수 $a,b,c$를 포함하는 닫힌구간에서 연속일 때,
    $$\int_a^bf(x)\,dx+\int_b^cf(x)\,dx=\int_a^cf(x)\,dx$$
    이다.
- label: (마)
  body: |
    미분가능한 함수 $t=g(x)$의 도함수 $g'(x)$가 닫힌구간 $[\alpha,\beta]$에서 연속이고, 함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때, $g(\alpha)=a$, $g(\beta)=b$이면
    $$\int_a^bf(t)\,dt=\int_\alpha^\beta f(g(x))g'(x)\,dx$$
    이다.
- label: (바)
  body: |
    닫힌구간 $[a,b]$에서 연속인 도함수를 갖는 두 함수 $f(x)$, $g(x)$에 대하여
    $$\int_a^bf(x)g'(x)\,dx=[f(x)g(x)]_a^b-\int_a^bf'(x)g(x)\,dx$$
    이다.

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  실수 전체의 집합에서 연속인 두 함수 $f(x)$, $g(x)$가 다음 조건을 만족시킨다.

  > (Ⅰ) 닫힌구간 $[-2,2]$에서 $f(x)=|x|-1$이다.
  > (Ⅱ) 모든 실수 $x$에 대하여 $f(x)=f(x+4)$이다.
  > (Ⅲ) 모든 실수 $x$에 대하여
  > $\{e^{g(x)}-f(x)\}\{e^{g(x)}-f(x+1)\}\{g(x)-\ln(x^2+x+1)\}g(x)=0$
  > 이다.
  > (Ⅳ) $g(-2024)=0$, $g\left(-\dfrac12\right)g\left(\dfrac32\right)>0$이다.

  다음 물음에 답하시오.

subparts:
- id: 2-1
  stem: |
    【2-1】 $g(0)$의 값과 $g\left(\dfrac32\right)$의 값을 각각 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: value, value: '(0, -log(2))', equivalents: ['g(0)=0, g(3/2)=-ln2'], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $x=0$에서 앞 두 인수와 셋째 인수가 겹쳐 $\{g(0)\}^2$ 꼴, $e^{g}\ne-1,0$.
    steps:
    - {id: 21a, content: '$g(0)=0$; $g(-\frac12)=\ln\frac34<0$ ⇒ $g(\frac32)<0$ ⇒ $g(\frac32)=\ln\frac12$', criteria: [2-1.A1, 2-1.R1, 2-1.A2]}
    hint_ladder:
    - $x=0$을 (Ⅲ)에 대입하면 셋째 인수는 무엇이 되는가?
    - $g\left(-\frac12\right)$이 될 수 있는 값을 모두 적고 $0$이 아님을 이용하자.
  - id: S21-B
    audience: B
    source_flow: M24_N1.pdf p.8
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        조건 (Ⅲ)에 의해 $\{e^{g(0)}-f(0)\}\{e^{g(0)}-f(1)\}\{g(0)\}^2=0$이다. 한편, $e^{g(0)}>0$, $f(0)=-1<0$, $f(1)=0$이므로 $e^{g(0)}\ne f(0)$, $e^{g(0)}\ne f(1)$이다. 따라서, $g(0)=0$을 얻는다.
      criteria: [2-1.A1]
    - id: 21b-2
      content: |
        조건 (Ⅳ)에 의해 $g\left(-\dfrac12\right)\ne0$이고, $f\left(-\dfrac12\right)=-\dfrac12$, $f\left(\dfrac12\right)=-\dfrac12$로 부터 조건 (Ⅲ)에서 $g\left(-\dfrac12\right)=\ln\dfrac34<0$임을 알 수 있고, 따라서 조건 (Ⅳ)에 의해 $g\left(\dfrac32\right)<0$이다.
      criteria: [2-1.R1]
    - id: 21b-3
      content: |
        또한, $f\left(\dfrac32\right)=\dfrac12$, $f\left(\dfrac52\right)=f\left(-\dfrac32\right)=\dfrac12$, $\ln\left(\left(\dfrac32\right)^2+\dfrac32+1\right)>0$로 부터 조건 (Ⅲ)에서 $g\left(\dfrac32\right)=\ln\dfrac12=-\ln2$를 얻는다.
      criteria: [2-1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.A1
      mark_type: A
      points: 10
      evidence: |
        $g(0)=0$을 구했다.
      steps: [21b-1]
    - id: 2-1.R1
      mark_type: R
      points: 10
      evidence: |
        $g\left(\dfrac32\right)<0$임을 보였다.
      steps: [21b-2]
    - id: 2-1.A2
      mark_type: A
      points: 10
      evidence: |
        $g\left(\dfrac32\right)=-\ln2$를 구했다.
      depends_on: [2-1.R1]
      steps: [21b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42404}
  misconceptions:
  - id: MC-ALG-42404
    outcome_code: '71'
    wrong_work: |
      (Ⅲ)에서 $e^{g(x)}=f(x)$를 $f(x)\le0$인 곳에도 적용해 $g(x)=\ln f(x)$로 두거나, $g\left(\frac32\right)$의 후보 중 $\ln(x^2+x+1)$ 또는 $0$을 부호 조건 없이 택함
    detect_cue: 로그의 진수가 양수인지 확인하지 않음, (Ⅳ)의 부호 조건 미사용
    feedback: $e^{g}>0$이므로 $f(x)\le0$인 점에서는 첫 두 인수가 $0$이 될 수 없습니다. 후보를 나열한 뒤 (Ⅳ)의 부호로 하나만 남기세요.
    remedy: [RL-1]
- id: 2-2
  stem: |
    【2-2】 열린구간 $(-2,2)$에서 함수 $g(x)$가 $x=a$에서 미분가능하지 않은 모든 $a$의 값을 구하시오. (40점)
  points: 40
  depends_on: [2-1]
  answer: {kind: set, value: '{-1, 0, 1, 3/2}', equivalents: ['a=-1, 0, 1, 3/2'], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: $[-2,2]$에서 $g=0\,(-2\le x\le-1)$, $\ln(x^2+x+1)\,(-1<x<0)$, $0\,(0\le x\le1)$, $\ln(2-x)\,(1<x\le\frac32)$, $\ln(x-1)\,(\frac32<x\le2)$; 꺾이는 점 판정.
    steps:
    - {id: 22a, content: '좌·우미분계수(좌/우): $x=-1$ ($0$/$-1$), $x=0$ ($1$/$0$), $x=1$ ($0$/$-1$), $x=\frac32$ ($-2$/$2$)', criteria: [2-2.R1, 2-2.R2, 2-2.R3, 2-2.R4]}
    hint_ladder:
    - $-1\le x\le1$에서 $f(x)\le0$이다. 그러면 $g(x)$의 후보는?
    - $x<-1$ 또는 $x>0$에서 $\ln(x^2+x+1)>0$이다. 연속성과 (Ⅳ)를 함께 생각하자.
  - id: S22-B
    audience: B
    source_flow: M24_N1.pdf p.8
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        함수 $g(x)$는 연속이고 $-1\le x\le1$일 때 $f(x)\le0$이므로, 조건 (Ⅲ)과 (Ⅳ)에 의해 $-1\le x\le0$일 때 $g(x)=\ln(x^2+x+1)$임을 알 수 있다.
      criteria: [2-2.R1, 2-2.R2]
    - id: 22b-2
      content: |
        또한, 모든 실수 $x$에 대하여 $-1\le f(x)\le1$이고, $x<-1$ 또는 $x>0$일 때 $\ln(x^2+x+1)>0$이므로 조건 (Ⅲ), (Ⅳ) 및 문제【2-1】에 의해 $x<-1$ 또는 $x>0$일 때 $g(x)\ne\ln(x^2+x+1)$이다. 따라서, $x<-1$ 또는 $x>0$일 때 $\{e^{g(x)}-f(x)\}\{e^{g(x)}-f(x+1)\}g(x)=0$이 성립한다.
      criteria: [2-2.R1, 2-2.R2, 2-2.R3, 2-2.R4]
    - id: 22b-3
      content: |
        함수 $f(x)$ 및 $f(x+1)$의 부호와 함수 $g(x)$의 연속성을 고려하면, $-2<x<-1$ 또는 $0<x\le1$일 때 $g(x)=0$임을 알 수 있다. 또한, $1<x\le\dfrac32$일 때 $g(x)=\ln f(x+1)=\ln(2-x)$이고, $\dfrac32<x<2$일 때 $g(x)=\ln f(x)=\ln(x-1)$임을 알 수 있다.
      criteria: [2-2.R3, 2-2.R4]
    - id: 22b-4
      content: |
        이로부터 열린구간 $(-2,2)$에서 함수 $g(x)$가 $x=a$에서 미분가능하지 않은 모든 $a$의 값은 $a=-1,\ 0,\ 1,\ \dfrac32$이다.
      criteria: [2-2.R1, 2-2.R2, 2-2.R3, 2-2.R4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.R1
      mark_type: R
      points: 10
      evidence: |
        함수 $g(x)$가 $x=-1$에서 미분가능하지 않음을 보였다.
      steps: [22b-1, 22b-2, 22b-4]
    - id: 2-2.R2
      mark_type: R
      points: 10
      evidence: |
        함수 $g(x)$가 $x=0$에서 미분가능하지 않음을 보였다.
      steps: [22b-1, 22b-2, 22b-4]
    - id: 2-2.R3
      mark_type: R
      points: 10
      evidence: |
        함수 $g(x)$가 $x=1$에서 미분가능하지 않음을 보였다.
      steps: [22b-2, 22b-3, 22b-4]
    - id: 2-2.R4
      mark_type: R
      points: 10
      evidence: |
        함수 $g(x)$가 $x=\dfrac32$에서 미분가능하지 않음을 보였다.
      steps: [22b-2, 22b-3, 22b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42416}
  misconceptions:
  - id: MC-CAL-42416
    outcome_code: '71'
    wrong_work: |
      식이 바뀌는 점이면 모두 미분불가능하다고 보아 $x=-1$·$0$·$1$·$\frac32$ 외에 경계점을 더 넣거나, $x=1$에서 $\ln(2-x)$의 우미분계수 $-1$과 좌미분계수 $0$을 비교하지 않음
    detect_cue: 좌·우미분계수 계산 없이 「꺾이는 점」으로만 판단
    feedback: 미분가능성은 제시문 (나)의 극한(좌·우미분계수)이 같은지로 판정합니다. 각 경계점에서 두 값을 계산하세요.
    remedy: [RL-2]
- id: 2-3-1
  stem: |
    【2-3】 $0$이 아닌 실수 $t$에 대하여, $x$에 대한 방정식 $g(x)=t\ (-8\le x\le2)$의 서로 다른 실근의 개수를 $h(t)$라 하자. $h\left(\ln\dfrac34\right)=5$일 때, 다음 물음에 답하시오.

    (1) $\displaystyle\lim_{t\to0-}h(t)$의 값을 구하시오. (30점)
  points: 30
  depends_on: [2-2]
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S231-A
    audience: A
    method_no: 1
    key_idea: $[-8,-2]$에서 $g$는 $[1,2]$ 모양 복사본이 한 번(두 경우), 각 오목 부분에서 교점 2개.
    steps:
    - {id: 231a, content: '$\ln\frac34<t<0$이면 $(-1,0)$, $(1,2)$, $[-8,-2]$의 복사본에서 각 2개 ⇒ $h(t)=6$', criteria: [2-3-1.R1, 2-3-1.A1]}
    hint_ladder:
    - $-8\le x\le-2$에서도 $\ln(x^2+x+1)>0$이므로 $g$는 $0$, $\ln f(x)$, $\ln f(x+1)$ 중 하나이다.
    - $h\left(\ln\frac34\right)=5$가 되려면 $[-8,-2]$에 $[1,2]$ 모양이 몇 번 나타나야 하는가?
  - id: S231-B
    audience: B
    source_flow: M24_N1.pdf p.8~9
    method_no: 1
    steps:
    - id: 231b-1
      content: |
        문제【2-2】에 의해 $-2\le x\le2$일 때 $g(x)=0\ (-2\le x\le-1)$, $\ln(x^2+x+1)\ (-1<x<0)$, $0\ (0\le x\le1)$, $\ln(2-x)\ \left(1<x\le\frac32\right)$, $\ln(x-1)\ \left(\frac32<x\le2\right)$이다. 또한, $-8\le x\le-2$일 때 $\{e^{g(x)}-f(x)\}\{e^{g(x)}-f(x+1)\}g(x)=0$이 성립한다.
      criteria: [2-3-1.R1]
    - id: 231b-2
      content: |
        한편, $-1\le x\le0$일 때 $g(x)=\ln(x^2+x+1)$이고, $g\left(-\dfrac12\right)=\ln\dfrac34>\ln\dfrac12=g\left(\dfrac32\right)$이다. $h\left(\ln\dfrac34\right)=5$이므로, 함수 $f(x)$ 및 $f(x+1)$의 부호와 함수 $g(x)$의 연속성을 고려하면 $-8\le x\le-2$일 때
        $g(x)=0\ (-8\le x\le-3)$, $\ln(-2-x)\ \left(-3<x\le-\frac52\right)$, $\ln(x+3)\ \left(-\frac52<x\le-2\right)$ 또는 $g(x)=0\ (-8\le x\le-7)$, $\ln(-6-x)\ \left(-7<x\le-\frac{13}{2}\right)$, $\ln(x+7)\ \left(-\frac{13}{2}<x\le-6\right)$, $0\ (-6<x\le-2)$임을 알 수 있다.
      criteria: [2-3-1.R1]
    - id: 231b-3
      content: |
        위에서 구한 $g(x)$로 부터, $\ln\dfrac34<t<0$일 때 $h(t)=6$임을 알 수 있다. 따라서, $\displaystyle\lim_{t\to0-}h(t)=6$이다.
      criteria: [2-3-1.R1, 2-3-1.A1]
