      $\int_{-1}^0\left(-x-\frac12\right)\ln(x^2+x+1)dx$를 부분적분으로 직접 계산하다 $\arctan$류 항이 나와 막히거나 부호를 틀림
    detect_cue: $x+\frac12$ 평행이동 치환과 홀함수 대칭 언급이 없음
