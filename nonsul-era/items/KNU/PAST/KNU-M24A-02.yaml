- id: 2-3-2
  stem: |
    (2) $\displaystyle\int_{-8}^{2}\left\{f(x)+\dfrac12\right\}g(x)\,dx$의 값을 구하시오. (50점)
  points: 50
  depends_on: [2-3-1]
  answer: {kind: value, value: '2*log(2) - 2', equivalents: ['2ln2-2'], tolerance: null}
  solutions:
  - id: S232-A
    audience: A
    method_no: 1
    key_idea: 주기성으로 $\int_{-8}^2=\int_{-1}^0+2\int_1^2$, $\int_{-1}^0$은 $u=x+\frac12$ 치환 후 홀함수.
    steps:
    - {id: 232a, content: '$\int_{-1}^0=0$, $\int_1^2=\ln2-1$ ⇒ $2\ln2-2$', criteria: [2-3-2.R1, 2-3-2.M1, 2-3-2.M2, 2-3-2.A1]}
    hint_ladder:
    - $g$가 $0$인 구간은 적분에 기여하지 않는다. 남는 구간은 어디인가?
    - $-1\le x\le0$에서 $f(x)+\frac12=-\left(x+\frac12\right)$이다.
  - id: S232-B
    audience: B
    source_flow: M24_N1.pdf p.9
    method_no: 1
    steps:
    - id: 232b-1
      content: |
        위에서 구한 $g(x)$ 및 조건 (Ⅱ)에 의해
        $$\int_{-8}^{2}\left\{f(x)+\dfrac12\right\}g(x)\,dx=\int_{-1}^{0}\left\{f(x)+\dfrac12\right\}g(x)\,dx+2\int_{1}^{2}\left\{f(x)+\dfrac12\right\}g(x)\,dx$$
        임을 알 수 있다.
      criteria: [2-3-2.R1]
    - id: 232b-2
      content: |
        한편,
        $$\int_{-1}^{0}\left\{f(x)+\dfrac12\right\}g(x)\,dx=\int_{-1}^{0}\left(-x-\dfrac12\right)\ln(x^2+x+1)\,dx=-\int_{-1}^{0}\left(x+\dfrac12\right)\ln\left(\left(x+\dfrac12\right)^2+\dfrac34\right)dx=-\int_{-\frac12}^{\frac12}x\ln\left(x^2+\dfrac34\right)dx=0,$$
      criteria: [2-3-2.M1]
    - id: 232b-3
      content: |
        $$\int_{1}^{2}\left\{f(x)+\dfrac12\right\}g(x)\,dx=\int_{1}^{\frac32}\left(x-\dfrac12\right)\ln(2-x)\,dx+\int_{\frac32}^{2}\left(x-\dfrac12\right)\ln(x-1)\,dx=\ln2-1$$
        이므로,
      criteria: [2-3-2.M2]
    - id: 232b-4
      content: |
        $$\int_{-8}^{2}\left\{f(x)+\dfrac12\right\}g(x)\,dx=\int_{-1}^{0}\left\{f(x)+\dfrac12\right\}g(x)\,dx+2\int_{1}^{2}\left\{f(x)+\dfrac12\right\}g(x)\,dx=2\ln2-2$$
        이다.
      criteria: [2-3-2.A1]
  rubric:
