intent: |
  인수정리로 보간 다항식의 차를 인수분해하고(1-1), 롤의 정리를 두 번 써서 보간 오차식의 존재를 증명하며(1-2), 할선법 점화식에 평균값 정리와 1-2의 오차식을 적용해 $|t_{n+2}|\le\frac12|t_{n+1}||t_n|$을 얻어 $|t_6|$을 평가할 수 있는지(1-3) 본다. (모의고사 자료에 출제 의도 별도 기재 없음 — 예시답안 흐름으로 요약)
key_idea: |
  $r=q-p$는 $x_1,x_2$를 근으로 갖고 이차항 계수가 $\frac{b_2}{2}$이므로 $r(x)=\frac{b_2}{2}(x-x_1)(x-x_2)$. $g=f-q$가 세 근을 가지므로 롤의 정리 두 번으로 $f''(c)=b_2$. 할선법 $t_{n+2}$는 $0$에서의 직선 보간값의 근이므로 1-2를 $x_0=0$에 적용하면 $t_{n+2}=-\frac{f''(c_n)}{2f'(d_n)}t_nt_{n+1}$.
stuck: |
  1-3에서 할선법의 다음 항 $t_{n+2}$를 1-2의 보간 오차식에 $x_0=0$을 넣은 형태로 다시 쓰는 단계
