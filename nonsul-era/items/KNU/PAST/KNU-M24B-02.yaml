- id: 2-3-2
  stem: |
    (2) 실수 $m$에 대하여 점 $\mathrm A(a,a^2)$의 $x$좌표인 $a$를 대응시킨 함수 $F:(\alpha,\beta)\to\mathbb R$가 일대일대응임을 증명하시오. (40점)
  points: 40
  depends_on: [2-3-1]
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S232-A
    audience: A
    method_no: 1
    key_idea: $F(m)=\frac{m(7+3m^2)}{2(1-3m^2)}$, 양 끝 $\mp\infty$ + 사잇값 정리(전사), $F'>0$(단사).
    steps:
    - {id: 232a, content: '$F$ 식 → 연속 → 극한 $\pm\infty$ → 치역 $\mathbb R$; $F''=\frac{-9m^4+30m^2+7}{2(1-3m^2)^2}>0$', criteria: [2-3-2.M1, 2-3-2.R1, 2-3-2.R2, 2-3-2.R3]}
    hint_ladder:
    - 2-1의 $a$ 식에 $\ell$, $n$의 $m$ 표현을 대입하자.
    - 일대일대응 = 전사 + 단사. 각각 어떤 정리로 보일까?
  - id: S232-B
    audience: B
    source_flow: M24_N2.pdf p.7
    method_no: 1
    steps:
    - id: 232b-1
      content: |
        【2-1】에서, $F(m)=a=\dfrac{\ell-m+n}{2}=\dfrac12\left\{\dfrac{m+\sqrt3}{1-\sqrt3m}-m+\dfrac{m-\sqrt3}{1+\sqrt3m}\right\}=\dfrac{m(7+3m^2)}{2(1-3m^2)}$.
      criteria: [2-3-2.M1]
    - id: 232b-2
      content: |
        이때 $F(m)$은 $m$에 대한 유리함수이므로 연속이고,
      criteria: [2-3-2.R1]
    - id: 232b-3
      content: |
        $\displaystyle\lim_{m\to-1/\sqrt3}F(m)=-\infty$, $\displaystyle\lim_{m\to1/\sqrt3}F(m)=\infty$이므로 제시문 (다)의 사잇값 정리에 의해 치역은 실수전체.
      criteria: [2-3-2.R2]
    - id: 232b-4
      content: |
        또한 $-\dfrac{1}{\sqrt3}<m<\dfrac{1}{\sqrt3}$에서
        $$\dfrac{dF}{dm}=\dfrac{(7+9m^2)(1-3m^2)-m(7+3m^2)(-6m)}{2(1-3m^2)^2}=\dfrac{-9m^4+30m^2+7}{2(1-3m^2)^2}>0$$
        이므로 제시문 (바)에 의해 $F(m)$이 증가함수이고 일대일대응. ■
      criteria: [2-3-2.R3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
