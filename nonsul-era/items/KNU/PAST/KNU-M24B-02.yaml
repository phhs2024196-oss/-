    【2-1】 $a,b,c$를 $\ell,m,n$으로 나타내시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: expression, value: '((l - m + n)/2, (-l + m + n)/2, (l + m - n)/2)', equivalents: ['a=(ℓ-m+n)/2, b=(-ℓ+m+n)/2, c=(ℓ+m-n)/2'], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: 포물선의 현의 기울기 = 두 $x$좌표의 합.
    steps:
    - {id: 21a, content: '$\ell=a+c$, $m=b+c$, $n=a+b$ 연립', criteria: [2-1.M1, 2-1.A1]}
    hint_ladder:
    - $\frac{a^2-c^2}{a-c}$를 간단히 하자.
  - id: S21-B
    audience: B
    source_flow: M24_N2.pdf p.7
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        제시문 (가)에 의해, $\ell=\dfrac{a^2-c^2}{a-c}=a+c$, $m=\dfrac{b^2-c^2}{b-c}=b+c$, $n=\dfrac{a^2-b^2}{a-b}=a+b$.
      criteria: [2-1.M1]
    - id: 21b-2
      content: |
        따라서 $a=\dfrac{\ell-m+n}{2}$, $b=\dfrac{-\ell+m+n}{2}$, $c=\dfrac{\ell+m-n}{2}$.
      criteria: [2-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 10
      evidence: |
        $\ell=a+c$, $m=b+c$, $n=a+b$임을 구했다.
      steps: [21b-1]
    - id: 2-1.A1
      mark_type: A
      points: 10
      evidence: |
        연립1차방정식을 풀고 $a=\dfrac{\ell-m+n}{2}$, $b=\dfrac{-\ell+m+n}{2}$, $c=\dfrac{\ell+m-n}{2}$를 구했다.
      depends_on: [2-1.M1]
      steps: [21b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42405}
  misconceptions:
