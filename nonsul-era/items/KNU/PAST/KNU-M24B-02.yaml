        $F(m)=a=\dfrac{m(7+3m^2)}{2(1-3m^2)}$을 구했다.
      steps: [232b-1]
    - id: 2-3-2.R1
      mark_type: R
      points: 10
      evidence: |
        $F(m)$이 연속임을 보였다.
      steps: [232b-2]
    - id: 2-3-2.R2
      mark_type: R
      points: 5
      evidence: |
        극한과 사잇값 정리를 이용하여 $F(m)$의 치역이 실수 전체인 것을 보였다.
      steps: [232b-3]
    - id: 2-3-2.R3
      mark_type: R
      points: 15
      evidence: |
        $\dfrac{dF}{dm}=\dfrac{-9m^4+30m^2+7}{2(1-3m^2)^2}>0$이므로 $F(m)$이 증가함수이고 따라서 일대일대응임을 증명했다.
      steps: [232b-4]
