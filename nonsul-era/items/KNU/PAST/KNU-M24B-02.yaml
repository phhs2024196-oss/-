    outcome_code: '71'
    wrong_work: |
      $x=\tan t$ 치환에서 $dx=\sec^2t\,dt$나 적분 구간 $\pm\frac{\pi}{6}$ 변환을 빠뜨림
    detect_cue: 치환 후 구간이 $\pm\frac{1}{\sqrt3}$ 그대로이거나 $\sec^2t$ 인수가 없음
    feedback: $x=\tan t$이면 $x=\pm\frac{1}{\sqrt3}\to t=\pm\frac{\pi}{6}$, $dx=\sec^2t\,dt$입니다.
    remedy: [RL-5]

