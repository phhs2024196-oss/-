stimuli:
- label: (가)
  body: |
    두 점 $(x_1,y_1)$과 $(x_2,y_2)$을 잇는 직선의 기울기 $m$은
    $$m=\dfrac{y_2-y_1}{x_2-x_1}$$
    이다.
- label: (나)
  body: |
    두 점 $(x_1,y_1)$과 $(x_2,y_2)$사이의 거리는
    $$\sqrt{(x_1-x_2)^2+(y_1-y_2)^2}$$
    이다.
- label: (다)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면 $f(a)$와 $f(b)$사이의 임의의 실수 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: (라)
  body: |
    삼각함수의 덧셈정리

    $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$

    $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$

    $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$

    $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$

    $\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$

    $\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$

    이다.
- label: (마)
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b|f(x)-g(x)|\,dx$$
- label: (바)
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 이 구간에 속하는 모든 $x$에 대하여

    (1) $f'(x)>0$이면 함수 $f(x)$는 이 구간에서 증가하고,

    (2) $f'(x)<0$이면 함수 $f(x)$는 이 구간에서 감소한다.
- label: (사)
  body: |
    미분가능한 함수 $t=g(x)$의 도함수 $g'(x)$가 닫힌구간 $[\alpha,\beta]$에서 연속이고, 함수 $f(t)$가 닫힌구간 $[a,b]$에서 연속일 때, $g(\alpha)=a$, $g(\beta)=b$이면
    $$\int_a^bf(t)\,dt=\int_\alpha^\beta f(g(x))g'(x)\,dx$$
    이다.

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  포물선 $P:y=x^2$위의 서로 다른 세 점 $\mathrm A(a,a^2)$, $\mathrm B(b,b^2)$, $\mathrm C(c,c^2)$이 아래 조건을 만족 시킨다.

  > (Ⅰ) $b<a<c$
  > (Ⅱ) 선분 $\mathrm{AC}$, $\mathrm{BC}$, $\mathrm{AB}$의 기울기는 각각 $\ell,m,n$이다

  다음 물음에 답하시오.

subparts:
- id: 2-1
