    outcome_code: '71'
    wrong_work: |
      $\ell$, $m$, $n$이 어느 선분의 기울기인지 뒤섞어($m$을 $\mathrm{AB}$로) 연립해 $a$와 $b$의 식이 바뀜
    detect_cue: $m=a+b$ 등 조건 (Ⅱ)의 대응이 어긋남
    feedback: 조건 (Ⅱ)는 $\mathrm{AC}\to\ell$, $\mathrm{BC}\to m$, $\mathrm{AB}\to n$ 순서입니다.
    remedy: [RL-1]
- id: 2-2
  stem: |
    【2-2】 선분 $\mathrm{AB}$와 포물선 $P$로 둘러싸인 영역의 넓이를 $D_1$, 선분 $\mathrm{AC}$와 포물선 $P$로 둘러싸인 영역의 넓이를 $D_2$라 할 때, $D_1+D_2$의 값을 $\ell,m,n$으로 나타내시오. (30점)
  points: 30
  depends_on: [2-1]
  answer: {kind: expression, value: '((l - m)**3 + (m - n)**3)/6', equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: 현 아래 넓이 $\frac{(x_2-x_1)^3}{6}$, $a-b=\ell-m$, $c-a=m-n$.
    steps:
    - {id: 22a, content: '$D_1=\frac{(a-b)^3}{6}$, $D_2=\frac{(c-a)^3}{6}$', criteria: [2-2.M1, 2-2.M2, 2-2.A1]}
    hint_ladder:
    - 두 점 $(x_1,x_1^2)$, $(x_2,x_2^2)$을 잇는 직선의 방정식은?
  - id: S22-B
    audience: B
    source_flow: M24_N2.pdf p.7
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $x_1<x_2$일 때, 포물선 $y=x^2$위의 두 점 $(x_1,x_1^2)$, $(x_2,x_2^2)$을 잇는 직선은 $y=(x_1+x_2)x-x_1x_2$이다.
      criteria: [2-2.M1]
    - id: 22b-2
      content: |
        직선과 포물선 사이의 영역의 넓이는 제시문 (마)에 의해
        $$\int_{x_1}^{x_2}\{(x_2+x_1)x-x_1x_2-x^2\}\,dx=\left[(x_2+x_1)\dfrac{x^2}{2}-x_1x_2x-\dfrac{x^3}{3}\right]_{x_1}^{x_2}=\dfrac{(x_2-x_1)^3}{6}.$$
      criteria: [2-2.M2]
    - id: 22b-3
      content: |
        따라서 $D_1+D_2=\dfrac{(\ell-m)^3+(m-n)^3}{6}$.
      criteria: [2-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
