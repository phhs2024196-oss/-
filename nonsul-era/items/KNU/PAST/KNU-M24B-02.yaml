  - id: MC-CAL-42422
    outcome_code: '71'
    wrong_work: |
      $F'(m)>0$(단사)만 보이고 치역이 $\mathbb R$ 전체임(전사)을 보이지 않거나, $-9m^4+30m^2+7>0$을 범위 $m^2<\frac13$에서 확인하지 않음
    detect_cue: 끝점 극한·사잇값 정리 언급이 없음
    feedback: 일대일대응은 단사와 전사 둘 다 필요합니다. 양 끝에서 $\mp\infty$로 가는 것과 사잇값 정리로 전사를 보이세요.
    remedy: [RL-4]
- id: 2-3-3
  stem: |
    (3) 정삼각형 $\mathrm{ABC}$의 한 변의 길이를 $R(m)$이라 하자. 실수전체의 집합에서 다음과 같이 정의된 함수 $\overline{R}(x)$에 대하여
    $$\overline{R}(x)=\begin{cases}\displaystyle\lim_{t\to\alpha+}\dfrac{1}{R(t)} & x\leqq\alpha\\ \dfrac{1}{R(x)} & \alpha<x<\beta\\ \displaystyle\lim_{t\to\beta-}\dfrac{1}{R(t)} & x\geqq\beta\end{cases}$$
    정적분
    $$\int_\alpha^\beta\overline{R}(x)\,dx$$
    의 값을 구하시오. (40점)
  points: 40
  depends_on: [2-3-1]
  answer: {kind: value, value: '(4 - 3*log(3))/(2*sqrt(3))', equivalents: ['(4-3ln3)/(2√3)'], tolerance: null}
  solutions:
  - id: S233-A
    audience: A
    method_no: 1
    key_idea: $R(m)=(\ell-n)\sqrt{1+m^2}=\frac{2\sqrt3(1+m^2)^{3/2}}{1-3m^2}$, $x=\tan t$ 치환.
    steps:
    - {id: 233a, content: '$\int_{-1/\sqrt3}^{1/\sqrt3}\frac{1-3x^2}{2\sqrt3(1+x^2)^{3/2}}dx=\frac{1}{2\sqrt3}[4\sin t-3\ln(\sec t+\tan t)]_{-\pi/6}^{\pi/6}$', criteria: [2-3-3.M1, 2-3-3.M2, 2-3-3.M3, 2-3-3.A1]}
    hint_ladder:
    - 한 변 $\mathrm{BC}$의 길이를 $c-b$와 기울기 $m$으로 쓰자.
    - $x=\tan t$로 치환하면 $(1+x^2)^{3/2}=\sec^3t$.
  - id: S233-B
    audience: B
    source_flow: M24_N2.pdf p.7~8
    method_no: 1
    steps:
    - id: 233b-1
      content: |
        정삼각형의 한 변의 길이 $R(m)$은 선분 $\mathrm{BC}$의 길이와 같으므로, 제시문 (나)에 의해,
        $R(m)=\sqrt{(c-b)^2+(c^2-b^2)^2}=(c-b)\sqrt{1+(c+b)^2}=(\ell-n)\sqrt{1+m^2}=\dfrac{2\sqrt3(1+m^2)^{\frac32}}{1-3m^2}$.
      criteria: [2-3-3.M1]
    - id: 233b-2
      content: |
        이 때, $\displaystyle\lim_{t\to-1/\sqrt3}\dfrac{1}{R(t)}=\lim_{t\to1/\sqrt3}\dfrac{1}{R(t)}=0$이므로, $\overline{R}(x)=0\ \left(x\le-\frac{1}{\sqrt3},\ x\ge\frac{1}{\sqrt3}\right)$, $\overline{R}(x)=\dfrac{1-3x^2}{2\sqrt3(1+x^2)^{\frac32}}\ \left(-\frac{1}{\sqrt3}<x<\frac{1}{\sqrt3}\right)$.
      criteria: [2-3-3.M2]
    - id: 233b-3
      content: |
        제시문 (사)를 이용하여 정적분을 계산하면
        $$\int_{-\frac{1}{\sqrt3}}^{\frac{1}{\sqrt3}}\overline{R}(x)\,dx=\int_{-\frac{1}{\sqrt3}}^{\frac{1}{\sqrt3}}\dfrac{1-3x^2}{2\sqrt3(1+x^2)^{\frac32}}\,dx=\dfrac{1}{2\sqrt3}\int_{-\frac{\pi}{6}}^{\frac{\pi}{6}}\dfrac{1-3\tan^2t}{\sec^3t}\sec^2t\,dt$$
      criteria: [2-3-3.M3]
    - id: 233b-4
      content: |
        $$=\dfrac{1}{2\sqrt3}\left(4\sin t-3\ln(\sec t+\tan t)\right)\Big|_{-\pi/6}^{\pi/6}=\dfrac{1}{2\sqrt3}(4-3\ln3).$$
      criteria: [2-3-3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-3-3.M1
      mark_type: M
      points: 10
      evidence: |
        $R(m)=\dfrac{2\sqrt3(1+m^2)^{\frac32}}{1-3m^2}$을 올바르게 계산했다.
      steps: [233b-1]
    - id: 2-3-3.M2
      mark_type: M
      points: 10
      evidence: |
        $\overline{R}(x)$를 올바르게 계산했다(구간 밖에서 $0$).
      steps: [233b-2]
    - id: 2-3-3.M3
      mark_type: M
      points: 10
      evidence: |
        치환적분을 올바르게 사용했다.
      steps: [233b-3]
    - id: 2-3-3.A1
      mark_type: A
      points: 10
      evidence: |
        정적분을 올바르게 계산하여 $\dfrac{1}{2\sqrt3}(4-3\ln3)$을 얻었다.
      depends_on: [2-3-3.M3]
      steps: [233b-4]
    deductions: []
