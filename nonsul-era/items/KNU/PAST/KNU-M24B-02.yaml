intent: |
  포물선 위 두 점을 잇는 직선의 기울기가 $x$좌표의 합임을 이용해 좌표를 기울기로 나타내고(2-1), 포물선과 현 사이의 넓이 공식 $\frac{(x_2-x_1)^3}{6}$을 구하며(2-2), 정삼각형 조건을 덧셈정리로 기울기 관계로 바꾸어 범위를 구하고 사잇값 정리·도함수로 일대일대응을 증명하며, 삼각치환 적분으로 값을 구할 수 있는지(2-3) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 예시답안 흐름으로 요약)
key_idea: |
  $\ell=a+c$, $m=b+c$, $n=a+b$. 정삼각형이면 $m=\tan t$일 때 $\ell=\tan\left(t+\frac{\pi}{3}\right)$, $n=\tan\left(t-\frac{\pi}{3}\right)$이고 $n<m<\ell$에서 $-\frac{1}{\sqrt3}<m<\frac{1}{\sqrt3}$. $F(m)=\frac{m(7+3m^2)}{2(1-3m^2)}$은 증가·전사, $R(m)=(\ell-n)\sqrt{1+m^2}=\frac{2\sqrt3(1+m^2)^{3/2}}{1-3m^2}$, $\int\frac{1}{R}$은 $x=\tan t$ 치환.
stuck: |
  2-3(1)에서 정삼각형 조건을 세 변의 기울기(경사각이 $\frac{\pi}{3}$씩 차이)로 바꾸는 단계와 $n<m<\ell$ 순서를 조건 (Ⅰ)에서 끌어내는 단계
