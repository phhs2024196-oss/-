- id: 2-3-1
  stem: |
    【2-3】 $\mathrm{ABC}$가 정삼각형일 때 $m$의 최솟값을 $\alpha$, 최댓값을 $\beta$라 하자.

    (1) $\alpha$와 $\beta$를 구하시오. (20점)
  points: 20
  depends_on: [2-1]
  answer: {kind: value, value: '(-sqrt(3)/3, sqrt(3)/3)', equivalents: ['α=-1/√3, β=1/√3'], tolerance: null}
  solutions:
  - id: S231-A
    audience: A
    method_no: 1
    key_idea: $m=\tan t$, $\ell=\tan(t+\frac{\pi}{3})$, $n=\tan(t-\frac{\pi}{3})$, $n<m<\ell$.
    steps:
    - {id: 231a, content: '$\frac{m-\sqrt3}{1+\sqrt3m}<m<\frac{m+\sqrt3}{1-\sqrt3m}$ ⇔ $-\frac1{\sqrt3}<m<\frac1{\sqrt3}$', criteria: [2-3-1.M1, 2-3-1.R1, 2-3-1.A1]}
    hint_ladder:
    - 정삼각형의 세 변은 서로 $60^\circ$씩 기울어져 있다.
    - $b<a<c$로부터 $n$, $m$, $\ell$의 크기 순서를 구하자.
  - id: S231-B
    audience: B
    source_flow: M24_N2.pdf p.7
    method_no: 1
    steps:
    - id: 231b-1
      content: |
        $m=\tan(t)$라 할 때 $\ell=\tan\left(t+\dfrac{\pi}{3}\right)$, $n=\tan\left(t-\dfrac{\pi}{3}\right)$이고, 제시문 (라)에 의해
        $\ell=\dfrac{\tan(t)+\tan(\pi/3)}{1-\tan(t)\tan(\pi/3)}=\dfrac{m+\sqrt3}{1-\sqrt3m}$, $n=\dfrac{\tan(t)-\tan(\pi/3)}{1+\tan(t)\tan(\pi/3)}=\dfrac{m-\sqrt3}{1+\sqrt3m}$.
      criteria: [2-3-1.M1]
    - id: 231b-2
      content: |
        조건 (Ⅰ)에 의해 $b<a<c$이므로, $n=a+b<m=b+c<\ell=a+c$이므로
      criteria: [2-3-1.R1]
    - id: 231b-3
      content: |
        $$\dfrac{m-\sqrt3}{1+\sqrt3m}<m<\dfrac{m+\sqrt3}{1-\sqrt3m}\iff\alpha=-\dfrac{1}{\sqrt3}<m<\dfrac{1}{\sqrt3}=\beta.$$
      criteria: [2-3-1.A1]
