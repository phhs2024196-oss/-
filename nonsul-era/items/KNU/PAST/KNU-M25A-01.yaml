      evidence: |
        부등식 $\dfrac{\ln\left(\sqrt{\frac{n!}{3^n}}\right)}{\ln(n!)}\le\dfrac{\ln c_n}{\ln b_n}\le\dfrac{\ln\left(\sqrt{n!3^n}\right)}{\ln(n!)}$을 구했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M3
      mark_type: M
      points: 10
      evidence: |
        부등식 $0\le\dfrac{n\ln3}{2\ln(n!)}\le\dfrac{\ln3}{2\left(\ln n-1+\frac1n\right)}$을 구했다.
      depends_on: []
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        극한값 $\displaystyle\lim_{n\to\infty}\frac{n\ln3}{2\ln(n!)}=0$을 구했다.
      depends_on: [3.M3]
      steps: [3b-4]
    - id: 3.A2
