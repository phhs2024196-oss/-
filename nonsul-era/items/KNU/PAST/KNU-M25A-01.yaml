intent: |
  고정점이 없는 대합(짝 짓기)의 개수를 조합으로 세고(1-1), 직사각형 넓이와 정적분의 비교로 $\ln(n!)$의 하한을 얻은 뒤(1-2), 이를 이용해 로그 비의 극한을 조임 정리로 구할 수 있는지(1-3) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 문항 해설 요지)
key_idea: |
  조건을 만족하는 $f$는 $2n$개의 원소를 2개씩 짝 짓는 방법과 일대일 대응이므로 $a_n=\frac{(2n)!}{2^nn!}$, 따라서 $b_n=n!$. $\ln(n!)\ge\int_1^n\ln x\,dx=n\ln n-n+1$이므로 $\frac{n\ln3}{2\ln(n!)}\to0$이다.
stuck: |
  1-3에서 $b_n=n!$임을 알아채고, $\frac{n\ln3}{\ln(n!)}\to0$을 1-2의 적분 하한으로 보이는 단계
