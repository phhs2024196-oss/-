        $\displaystyle\lim_{n\to\infty}\frac{\ln\left(\sqrt{n!3^n}\right)}{\ln(n!)}=\frac12$을 구했다.
      depends_on: [3.M2, 3.A1]
      steps: [3b-5]
    - id: 3.A4
