stimuli:
- label: (가)
  body: |
    계승 $n!=n\times(n-1)\times(n-2)\times\cdots\times3\times2\times1$, $0!=1$

    (1) 서로 다른 $n$개에서 $r$개를 택하는 순열의 수는

    $${}_n\mathrm{P}_r=\frac{n!}{(n-r)!}\quad(\text{단, }0\le r\le n)$$

    (2) 서로 다른 $n$개에서 $r$개를 택하는 조합의 수는

    $${}_n\mathrm{C}_r=\frac{{}_n\mathrm{P}_r}{r!}=\frac{n!}{r!\,(n-r)!}\quad(\text{단, }0\le r\le n)$$
- label: (나)
  body: |
    $\displaystyle\int\ln x\,dx=x\ln x-x+C$ (단, $C$는 적분상수)
- label: (다)
  body: |
    두 수열 $\{a_n\}$, $\{b_n\}$이 각각 수렴하고

    $$\lim_{n\to\infty}a_n=\alpha,\quad\lim_{n\to\infty}b_n=\beta$$

    일 때, 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $\alpha=\beta$이면 수열 $\{c_n\}$은 수렴하고

    $$\lim_{n\to\infty}c_n=\alpha$$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  자연수 $n$에 대하여 집합 $X=\{x\mid1\le x\le2n,\ x\text{는 자연수}\}$라 할 때, 다음 조건을 만족시키는 일대일 대응 $f:X\to X$의 개수를 $a_n$이라 하자.

  모든 $x\in X$에 대하여, $f(x)\ne x$이고 $f\circ f(x)=x$이다.

  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【1-1】 $a_2$, $a_3$, $a_4$의 값을 각각 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: value, value: '3; 15; 105', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f$는 $2n$개의 원소를 2개씩 짝 짓는 방법과 일대일로 대응한다.
    steps:
    - {id: 1a, content: '$a_2=\frac{{}_4C_2{}_2C_2}{2!}=3$, $a_3=15$, $a_4=105$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - $f(k)=l$이면 $f(l)$은?
  - id: S1-B
    audience: B
    source_flow: M25_N1s.pdf p.1
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        집합 $X=\{1,2,\cdots,2n\}$에 속하는 원소 $k$에 대하여 $f(k)=l$이라 하자. 함수 $f(x)$는 $X$의 모든 원소 $x$에 대하여 $f(x)\ne x$이므로 $k\ne l$이다. 또한 $f\circ f(x)=x$이므로 $f(l)=k$이다. 따라서 $a_n$은 서로 다른 $2n$개의 원소를 2개씩 짝을 짓는 경우의 수와 같다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        따라서 $a_2=\dfrac{{}_4C_2\times{}_2C_2}{2!}=3$, $a_3=\dfrac{{}_6C_2\times{}_4C_2\times{}_2C_2}{3!}=15$,
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $a_4=\dfrac{{}_8C_2\times{}_6C_2\times{}_4C_2\times{}_2C_2}{4!}=105$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 10
      evidence: |
        답 $a_2=3$을 구했다.
      steps: [1b-1, 1b-2]
    - id: 1.B2
      mark_type: B
      points: 10
      evidence: |
        답 $a_3=15$를 구했다.
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 10
      evidence: |
        답 $a_4=105$를 구했다.
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-42501}
  misconceptions:
  - id: MC-CNT-42501
    outcome_code: '71'
    wrong_work: '$a_2={}_4C_2\times{}_2C_2=6$, $a_3=90$'
    detect_cue: 짝의 개수 $n!$로 나누지 않았다
    feedback: 짝 $\{1,2\},\{3,4\}$와 $\{3,4\},\{1,2\}$는 같은 대응입니다. 짝들의 순서 $n!$로 나누세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    【1-2】 모든 자연수 $n$에 대하여, 다음의 부등식이 성립함을 보이시오. (30점)

    $$\int_1^n\ln x\,dx\le\ln(n!)$$
  points: 30
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\ln(n!)=\sum_{k=2}^n\ln k$는 $[k-1,k]$ 위 높이 $\ln k$인 직사각형 넓이의 합이고 $\ln x$는 증가함수이다.
    steps:
    - {id: 2a, content: '$\int_{k-1}^k\ln x\,dx\le\ln k$ ($k=2,\cdots,n$)를 더한다', criteria: [2.R1, 2.R2]}
    hint_ladder:
    - $\ln(n!)$을 합으로 쓰면?
    - $[k-1,k]$에서 $\ln x$와 $\ln k$의 대소는?
  - id: S2-B
    audience: B
    source_flow: M25_N1s.pdf p.1
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\ln(n!)=\displaystyle\sum_{k=1}^n\ln k$이다.
      criteria: [2.R1]
    - id: 2b-2
      content: |
        따라서 아래 그림에서 $\displaystyle\int_1^n\ln x\,dx\le\ln(n!)$가 성립한다. (보충: $\ln x$는 증가함수이므로 $k-1\le x\le k$에서 $\ln x\le\ln k$이고 $\displaystyle\int_{k-1}^k\ln x\,dx\le\ln k$. $k=2,\cdots,n$에 대해 더하면 $\displaystyle\int_1^n\ln x\,dx\le\sum_{k=2}^n\ln k=\ln(n!)$; $n=1$이면 양변 모두 $0$.)
      criteria: [2.R2]
  # [그림: y=ln x 와 x=1,2,3,…,n-1,n 에서 폭 1 직사각형(오른쪽 끝 높이 ln k)들 — 직사각형이 곡선 위로 올라옴]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 15
      evidence: |
        $\ln(n!)=\displaystyle\sum_{k=1}^n\ln k$임을 보였다.
      depends_on: []
      steps: [2b-1]
    - id: 2.R2
      mark_type: R
      points: 15
      evidence: |
        $\displaystyle\int_1^n\ln x\,dx\le\sum_{k=1}^n\ln k$임을 증명했다.
      depends_on: [2.R1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42517}
  misconceptions:
  - id: MC-CAL-42517
    outcome_code: '71'
    wrong_work: '$[k,k+1]$ 위에 높이 $\ln k$인 직사각형을 그려 $\int_1^n\ln x\,dx\le\sum\ln k$라고 함'
    detect_cue: 직사각형의 높이가 구간의 왼쪽 끝 값이다(그 경우 직사각형은 곡선 아래)
    feedback: $\ln x$가 증가하므로 곡선 위에 오는 직사각형은 오른쪽 끝 값 $\ln k$를 높이로 하는 $[k-1,k]$ 위의 직사각형입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    【1-3】 두 수열 $\{b_n\}$과 $\{c_n\}$이 모든 자연수 $n$에 대하여

    $$b_n=\frac{(2n)!}{2^na_n}\ \text{이고}\ \sqrt{\frac{n!}{3^n}}\le c_n\le\sqrt{n!3^n}$$

    일 때, $\displaystyle\lim_{n\to\infty}\frac{\ln c_n}{\ln b_n}$의 값을 구하시오. (60점)
  points: 60
  depends_on: ['1', '2']
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $b_n=n!$이고 $\frac{\ln c_n}{\ln(n!)}$은 $\frac12\pm\frac{n\ln3}{2\ln(n!)}$ 사이에 있으며 1-2로 $\frac{n\ln3}{\ln(n!)}\to0$.
    steps:
    - {id: 3a, content: '$\frac12-\frac{n\ln3}{2\ln(n!)}\le\frac{\ln c_n}{\ln b_n}\le\frac12+\frac{n\ln3}{2\ln(n!)}$, $0\le\frac{n\ln3}{2\ln(n!)}\le\frac{\ln3}{2(\ln n-1+\frac1n)}\to0$', criteria: [3.M1, 3.M2, 3.M3, 3.A1, 3.A2, 3.A3, 3.A4]}
    hint_ladder:
    - 1-1의 방법으로 $a_n$의 일반항을 쓰면 $b_n$은?
    - 1-2와 제시문 (나)로 $\ln(n!)$의 하한을 구해 보자.
  - id: S3-B
    audience: B
    source_flow: M25_N1s.pdf p.1
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        수열 $\{a_n\}$의 일반항은 $a_n=\dfrac{{}_{2n}C_2\times\cdots\times{}_2C_2}{n!}=\dfrac{(2n)!}{2^nn!}$이다. $b_n=\dfrac{(2n)!}{2^na_n}$이므로 따라서 $b_n=n!$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        모든 자연수 $n$에 대하여 $\sqrt{\dfrac{n!}{3^n}}\le c_n\le\sqrt{n!3^n}$이므로 $\dfrac{\ln\left(\sqrt{\frac{n!}{3^n}}\right)}{\ln(n!)}\le\dfrac{\ln c_n}{\ln b_n}\le\dfrac{\ln\left(\sqrt{n!3^n}\right)}{\ln(n!)}$이다. 한편 $\dfrac{\ln\left(\sqrt{\frac{n!}{3^n}}\right)}{\ln(n!)}=\dfrac{\ln(n!)-n\ln3}{2\ln(n!)}=\dfrac12-\dfrac{n\ln3}{2\ln(n!)}$이고 $\dfrac{\ln\left(\sqrt{n!3^n}\right)}{\ln(n!)}=\dfrac{\ln(n!)+n\ln3}{2\ln(n!)}=\dfrac12+\dfrac{n\ln3}{2\ln(n!)}$이다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        이때 【1-2】와 제시문 (나)에 의해 $0\le\dfrac{n\ln3}{2\ln(n!)}\le\dfrac{n\ln3}{2\int_1^n\ln x\,dx}=\dfrac{n\ln3}{2(n\ln n-n+1)}=\dfrac{\ln3}{2\left(\ln n-1+\frac1n\right)}$이고
      criteria: [3.M3]
    - id: 3b-4
      content: |
        제시문 (다)에 의해 $\displaystyle\lim_{n\to\infty}\frac{n\ln3}{2\ln(n!)}=0$이다.
      criteria: [3.A1]
    - id: 3b-5
      content: |
        그러므로 $\displaystyle\lim_{n\to\infty}\frac{\ln\left(\sqrt{\frac{n!}{3^n}}\right)}{\ln(n!)}=\lim_{n\to\infty}\left(\frac12-\frac{n\ln3}{2\ln(n!)}\right)=\frac12$이고 $\displaystyle\lim_{n\to\infty}\frac{\ln\left(\sqrt{n!3^n}\right)}{\ln(n!)}=\lim_{n\to\infty}\left(\frac12+\frac{n\ln3}{2\ln(n!)}\right)=\frac12$이다.
      criteria: [3.A2, 3.A3]
    - id: 3b-6
      content: |
        따라서 제시문 (다)에 의해 $\displaystyle\lim_{n\to\infty}\frac{\ln c_n}{\ln b_n}=\frac12$이다.
      criteria: [3.A4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        수열 $\{a_n\}$의 일반항 $a_n=\dfrac{(2n)!}{2^nn!}$을 구했다.
      depends_on: []
