- id: '1'
  stem: |
    【2-1】 함수 $f'(x)$는 열린구간 $(0,\infty)$에서 증가함을 보이시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f''(x)$의 분자 $w(x)=e^x(x^2-2x+2)-2$는 $w(0)=0$, $w'(x)=e^xx^2>0$.
    steps:
    - {id: 1a, content: '$f''''(x)=\frac{w(x)}{x^3}$, $x>0$에서 $w(x)>0$이므로 $f''''(x)>0$', criteria: [1.M1, 1.R1]}
    hint_ladder:
    - $f''(x)$의 분모의 부호는 $x>0$에서 정해져 있다. 분자를 따로 함수로 두자.
  - id: S1-B
    audience: B
    source_flow: M25_N1s.pdf p.3
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        미분법을 이용하여 계산하면 $f'(x)=\dfrac{e^x(x-1)+1}{x^2}$이고 $f''(x)=\dfrac{e^x(x^2-2x+2)-2}{x^3}$ (단, $x\ne0$)이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $w(x)=e^x(x^2-2x+2)-2$라고 하자. 그러면 $w(0)=0$이고 모든 $x>0$에 대하여 $w'(x)=e^xx^2>0$이다. 그러므로 모든 $x>0$에 대하여 $w(x)>0$이므로 $f''(x)>0$이다. 따라서 제시문 (다)에 의해 $f'(x)$는 $(0,\infty)$에서 증가한다.
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        $f''(x)=\dfrac{e^x(x^2-2x+2)-2}{x^3}$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 20
      evidence: |
        모든 $x>0$에 대하여 $f''(x)>0$임을 보였다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
