stimuli:
- label: (가)
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능할 때,

    $\{f(x)g(x)\}'=f'(x)g(x)+f(x)g'(x)$
- label: (나)
  body: |
    두 함수 $f(x)$, $g(x)$ ($g(x)\ne0$)가 미분가능할 때,

    $y=\dfrac{f(x)}{g(x)}$이면 $y'=\dfrac{f'(x)g(x)-f(x)g'(x)}{\{g(x)\}^2}$
- label: (다)
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 그 구간의 모든 $x$에 대하여

    (1) $f'(x)>0$이면 $f(x)$는 그 구간에서 증가한다.

    (2) $f'(x)<0$이면 $f(x)$는 그 구간에서 감소한다.
- label: (라)
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고 $x=a$의 좌우에서

    (1) $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.

    (2) $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.
- label: (마)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면 $f(a)$와 $f(b)$ 사이의 임의의 값 $k$에 대하여

    $$f(c)=k$$

    인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  실수 전체의 집합에서 미분가능한 함수

  $$f(x)=\begin{cases}\dfrac{e^x-1}{x}&(x\ne0)\\[2mm]1&(x=0)\end{cases}$$

  에 대하여 실수 전체의 집합에서 정의된 함수 $g(x)$와 $h(x)$가 다음 조건을 만족시킨다. (단, $e=\displaystyle\lim_{x\to\infty}\left(1+\frac1x\right)^x$이고 근삿값은 $2.71828\cdots$이다.)

  (Ⅰ) $g(x)=f(x)-xf'(x)$

  (Ⅱ) $h(x)=cf(x)-x$이고 $h'(0)=\dfrac{c-2}{2}$이다. (단, $c$는 상수이고 $0<c<2$)

  다음 물음에 답하시오.

