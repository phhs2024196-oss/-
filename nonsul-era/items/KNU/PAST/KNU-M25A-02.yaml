  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42519}
  misconceptions:
  - id: MC-CAL-42519
    outcome_code: '71'
    wrong_work: '「$x^2-2x+2>0$이므로 분자가 양수」라고 결론'
    detect_cue: 분자의 $-2$를 고려하지 않았다(분자 함수 $w$의 증감 근거가 없다)
    feedback: 분자 $e^x(x^2-2x+2)-2$의 부호는 $w(0)=0$과 $w'(x)=x^2e^x>0$으로 정해야 합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    【2-2】 함수 $h(x)$는 열린구간 $(-\infty,k)$에서 감소하고 열린구간 $(k,\infty)$에서 증가하는 양의 실수 $k$가 존재함을 보이시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $h'(x)$의 분자 $\varphi(x)=c(e^x(x-1)+1)-x^2$는 $\varphi'(x)=x(ce^x-2)$로 $0$에서 극대(값 0), $\ln\frac2c$에서 극소(음수)이다.
    steps:
    - {id: 2a, content: '$\varphi$는 $x=0$과 $x=k>\ln\frac2c$에서만 0, $x<k$에서 $\varphi\le0$, $h''(0)<0$', criteria: [2.M1, 2.R1]}
    hint_ladder:
    - $h'(x)$의 분모 $x^2$는 항상 양수이다. 분자의 개형을 그려 보자.
  - id: S2-B
    audience: B
    source_flow: M25_N1s.pdf p.3
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)$가 미분가능 함수이므로 $h(x)$도 미분가능 함수이고 $h'(x)=cf'(x)-1=\begin{cases}\dfrac{c(e^x(x-1)+1)-x^2}{x^2}&(x\ne0)\\[2mm]\dfrac{c-2}{2}&(x=0)\end{cases}$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $\varphi(x)=c(e^x(x-1)+1)-x^2$의 개형을 보자. $\varphi'(x)=x(ce^x-2)=0$의 해는 $x=0$과 $x=\ln\dfrac2c>0$이다. 증감표: $x<0$에서 $\varphi'>0$(증가), $\varphi(0)=0$, $0<x<\ln\frac2c$에서 감소, $\varphi\left(\ln\frac2c\right)<0$, 그 뒤 증가. 즉 $y=\varphi(x)$는 $x$축과 $(0,0)$과 $(k,0)$인 서로 다른 두 점에서 만난다. 여기서 $k$는 $k>\ln\dfrac2c>0$이다. $x\ne0$인 모든 $x<k$에 대하여 $\varphi(x)<0$이고 $x>k$에 대하여 $\varphi(x)>0$이다. $h'(0)=\dfrac{c-2}{2}<0$이므로 모든 $x<k$에 대하여 $h'(x)<0$이고 $x>k$에 대하여 $h'(x)>0$이다. 즉, 함수 $h(x)$는 열린구간 $(-\infty,k)$에서 감소함수이고 열린구간 $(k,\infty)$에서 증가함수이다. 그러므로 함수 $h(x)$가 $x=k$에서 극소이다.
      criteria: [2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $h'(x)=\dfrac{c(e^x(x-1)+1)-x^2}{x^2}$ ($x\ne0$), $h'(0)=\dfrac{c-2}{2}$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 20
      evidence: |
        모든 $x<k$에 대하여 $h'(x)<0$이고 $x>k$에 대하여 $h'(x)>0$임을 보였다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42520}
  misconceptions:
  - id: MC-CAL-42520
    outcome_code: '71'
    wrong_work: '$\varphi(0)=0$이므로 $h''(0)=0$, $x=0$에서 극소라고 판단'
    detect_cue: $x=0$을 $k$의 후보로 썼거나 $h'(0)=\frac{c-2}{2}$를 쓰지 않았다
    feedback: $x=0$에서는 $h'(x)$의 식이 따로 정의되어 $h'(0)=\frac{c-2}{2}<0$입니다. $\varphi$가 $0$에서 극대값 $0$이라 부호가 바뀌지 않습니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    【2-3】 $g(\alpha)=0$인 실수 $\alpha$가 오직 한 개 존재하며 $1<\alpha<2$임을 보이시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g(x)=\frac{(2-x)e^x-2}{x}$의 분자 $\phi$는 $x=1$에서 극대, $\phi(0)=0$, $\phi(1)>0>\phi(2)$.
    steps:
    - {id: 3a, content: '$\phi$의 근은 $0$과 $(1,2)$의 하나뿐, $g(0)=1\ne0$', criteria: [3.R1, 3.R2]}
    hint_ladder:
    - $g(x)$의 분자를 $\phi(x)$로 두고 $\phi'(x)$를 구해 보자.
  - id: S3-B
    audience: B
    source_flow: M25_N1s.pdf p.3
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        미분법을 이용하여 계산하면 $g(x)=f(x)-xf'(x)=\begin{cases}\dfrac{(2-x)e^x-2}{x}&(x\ne0)\\[2mm]1&(x=0)\end{cases}$이다. 방정식 $g(x)=0$의 실근의 존재성을 보이기 위해 함수 $\phi(x)=(2-x)e^x-2$와 $x$축과의 교점을 알아보자. 모든 $x<1$에 대하여 $\phi'(x)>0$이고 모든 $x>1$에 대하여 $\phi'(x)<0$이므로 함수 $\phi(x)$는 $x=1$에서 극대를 가진다. $\phi(0)=0$, $\phi(1)=e-2>0$, $\phi(2)=-2<0$이므로 사잇값의 정리에 의해 방정식 $\phi(x)=0$의 실근은 $x=0$과 열린구간 $(1,2)$에서 한 개 존재한다.
      criteria: [3.R1]
    - id: 3b-2
      content: |
        $g(0)\ne0$이므로 $x=0$은 방정식 $g(x)=0$의 실근이 아니다. 그러므로 방정식 $g(x)=0$의 실근 $\alpha$는 열린구간 $(1,2)$에서 오직 한 개 존재한다.
      criteria: [3.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.R1
      mark_type: R
      points: 20
      evidence: |
        $g(\alpha)=0$인 실수 $\alpha$가 오직 한 개 존재함을 보였다.
      depends_on: []
      steps: [3b-1, 3b-2]
    - id: 3.R2
      mark_type: R
      points: 10
      evidence: |
        $1<\alpha<2$임을 보였다.
      depends_on: []
      steps: [3b-1, 3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42521}
  misconceptions:
  - id: MC-CAL-42521
    outcome_code: '71'
    wrong_work: '$\phi(0)=0$이므로 $g(x)=0$의 실근이 $0$과 $\alpha$ 두 개라고 씀'
    detect_cue: $g(0)=1$을 확인하지 않았다
    feedback: $g(0)$은 $x=0$에서 따로 정의된 값 $f(0)-0\cdot f'(0)=1$이므로 $x=0$은 근이 아닙니다.
    remedy: [RL-3]

- id: '4'
  stem: |
    【2-4】 $g(\alpha)=0$인 실수 $\alpha$에 대하여 $\beta=\dfrac{1}{f'(\alpha)}$이라고 하자. $0<b<\beta$인 실수 $b$에 대하여 $bf(x)=x$는 서로 다른 두 개의 실근 $x_1$과 $x_2$ ($x_1<x_2$)를 가짐을 보이고 $f'(x_1)<\dfrac1b$이고 $f'(x_2)>\dfrac1b$임을 보이시오. (40점)
  points: 40
  depends_on: ['1', '2', '3']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $q(x)=bf(x)-x$는 2-2의 $h$($c=b$)이므로 $x=k$에서 극소, $b=\frac1{f'(k)}<\frac1{f'(\alpha)}$와 2-1에서 $k>\alpha$, 2-3에서 $g(k)<0$, $g(k)=f'(k)q(k)$이므로 $q(k)<0$.
    steps:
    - {id: 4a, content: '$q(k)<0$ ⇒ $(-\infty,k)$, $(k,\infty)$에 근 하나씩, $q''(x_1)<0<q''(x_2)$', criteria: [4.R1, 4.R2]}
    hint_ladder:
    - $q(x)=bf(x)-x$는 앞의 어느 함수와 같은 꼴인가?
    - 극소점 $k$에서 $bf'(k)=1$이다. $g(k)$를 $q(k)$로 나타내 보자.
  - id: S4-B
    audience: B
    source_flow: M25_N1s.pdf p.3~4
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $f'(1)=1$이고 【2-1】에 의해 함수 $f'(x)$는 열린구간 $(0,\infty)$에서 증가함수이므로 모든 $x>1$에 대하여 $f'(x)>1$이다. 【2-3】에 의해 $1<\alpha<2$이므로 $0<\dfrac{1}{f'(\alpha)}<1$이다. 즉, $0<b<\beta<1$이다. 함수 $q(x)=bf(x)-x$를 고려하자. $0<b<2$이므로 【2-2】에 의해 함수 $q(x)$가 열린구간 $(-\infty,k)$에서 감소하고 열린구간 $(k,\infty)$에서 증가하는 양의 실수 $k$가 존재한다. 함수 $q(x)$가 $x=k$에서 극소이므로 $q'(k)=bf'(k)-1=0$이다. 즉, $b=\dfrac{1}{f'(k)}$이다. $0<b<\beta$이므로 $0<\dfrac{1}{f'(k)}<\dfrac{1}{f'(\alpha)}$이다. 즉, $f'(k)>f'(\alpha)$이다. 그러면 【2-1】에 의해 함수 $f'(x)$는 $(0,\infty)$에서 증가함수이므로 $\alpha<k$이다. $g(1)=e-2>0$이고 $g(2)=-1<0$이므로 【2-3】에 의해 함수 $g(x)$는 모든 $x>\alpha$에 대해서 $g(x)<0$이다. $\alpha<k$이므로 $g(k)<0$이다. 그러면 $g(k)=f(k)-kf'(k)=bf'(k)f(k)-kf'(k)=f'(k)(bf(k)-k)=f'(k)q(k)<0$이 성립한다. 그러므로 $f'(k)>0$이므로 $q(k)<0$이다. 【2-2】에 의해 방정식 $q(x)=0$은 열린구간 $(-\infty,k)$에서 실근 $x_1$과 열린구간 $(k,\infty)$에서 실근 $x_2$를 가진다.
      criteria: [4.R1]
    - id: 4b-2
      content: |
        그리고 $q'(x_1)=bf'(x_1)-1<0$이므로 $f'(x_1)<\dfrac1b$이고, $q'(x_2)=bf'(x_2)-1>0$이므로 $f'(x_2)>\dfrac1b$이다.
      criteria: [4.R2]
