intent: |
  $f(x)=\frac{e^x-1}{x}$의 도함수·이계도함수를 계산해 증감을 판정하고(2-1, 2-2), 사잇값 정리와 단조성으로 방정식의 실근의 존재와 유일성을 보이며(2-3), 앞의 결과를 연결해 방정식 $bf(x)=x$의 두 실근과 그 점에서의 미분계수의 대소를 증명할 수 있는지(2-4) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 문항 해설 요지)
key_idea: |
  분자만 떼어 낸 보조함수 $w(x)=e^x(x^2-2x+2)-2$, $\varphi(x)=c(e^x(x-1)+1)-x^2$, $\phi(x)=(2-x)e^x-2$의 부호를 그 도함수로 판정한다. 2-4는 $q(x)=bf(x)-x$가 2-2의 $h$($c=b$)와 같아 $x=k$에서 극소이고, $g(k)=f'(k)q(k)<0$으로 $q(k)<0$을 얻는다.
stuck: |
  2-4에서 $b=\frac1{f'(k)}<\beta$로부터 $k>\alpha$를 끌어내고, $g(k)=f'(k)\{bf(k)-k\}$로 극솟값의 부호를 정하는 단계
