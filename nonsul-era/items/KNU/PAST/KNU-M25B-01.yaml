intent: |
  함수방정식에 특수값을 대입해 함숫값을 구하고(1-1), 미분계수의 정의와 극한의 성질로 실수 전체에서의 미분가능성과 도함수 $f'(x)=\sqrt{4+\{f(x)\}^2}$를 이끌어 내며(1-2), 이를 부분적분에 활용해 정적분을 계산할 수 있는지(1-3) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 문항 해설 요지)
key_idea: |
  $a=b=0$에서 $f(0)=0$, $b=0$에서 $f(2a)=f(a)\sqrt{4+\{f(a)\}^2}$. $a=h$로 두고 $2h$로 나누면 $\lim\frac{f(b+2h)-f(b)}{2h}=\sqrt{4+\{f(b)\}^2}$. 1-3은 $\{f'\}^2=\sqrt{4+f^2}\,f'$로 바꿔 부분적분하면 같은 적분이 다시 나와 이항한다.
stuck: |
  1-2에서 조건 (Ⅰ)의 $a$를 증분 $h$로 보고 $\frac{f(h)}{h}\to f'(0)$, $f(h)\to0$을 이용해 임의의 점 $b$에서의 미분계수로 바꾸는 단계
