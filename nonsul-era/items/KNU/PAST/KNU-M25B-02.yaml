stimuli:
- label: (가)
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$와 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는

    $$S=\int_a^b\lvert f(x)-g(x)\rvert dx$$
- label: (나)
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때, $\alpha$, $\beta$를 포함하는 구간에서 연속이면

    $$\int_a^bf(x)dx=\int_\alpha^\beta f(g(t))g'(t)dt$$
- label: (다)
  body: |
    삼각함수의 덧셈정리

    $\sin(\alpha\pm\beta)=\sin\alpha\cos\beta\pm\cos\alpha\sin\beta$

    $\cos(\alpha\pm\beta)=\cos\alpha\cos\beta\mp\sin\alpha\sin\beta$

    $\tan(\alpha\pm\beta)=\dfrac{\tan\alpha\pm\tan\beta}{1\mp\tan\alpha\tan\beta}$
- label: (라)
  body: |
    음함수 표현 $f(x,y)=0$에서 $y$를 $x$의 함수로 보고, 양변의 각 항을 $x$에 대하여 미분하여 $\dfrac{dy}{dx}$를 구한다.
- label: (마)
  body: |
    함수 $f(x)$가 임의의 세 실수 $a$, $b$, $c$를 포함하는 닫힌구간 $[a,b]$에서 연속일 때,

    $$\int_a^bf(x)dx=\int_a^cf(x)dx+\int_c^bf(x)dx$$

# [그림: p=π/8 인 예. 직사각형 ABCD(D 왼쪽 아래, A 오른쪽 아래, B 오른쪽 위, C 왼쪽 위; DA 수평 √3, AB 수직 3), E는 AB 위(AE=2), F는 CD 위(DF=2). P는 직선 AD 위 D의 왼쪽. 각 FPD=p, 각 EPD=q, 각 DPD'=r. 부채꼴 PDD'(호 D→D'), 부채꼴 PBB'(호 B→B'), A'는 반직선 PD' 위(PA'=PA). 색칠 영역 S(p) = AB, 호 BB', B'A', A'D', 호 D'D, DA 로 둘러싸인 부분]
stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  $\overline{\mathrm{AB}}=\overline{\mathrm{CD}}=3$이고 $\overline{\mathrm{BC}}=\overline{\mathrm{AD}}=\sqrt3$인 직사각형 $\mathrm{ABCD}$에서 점 $\mathrm{A}$로부터 거리가 $2$인 선분 $\mathrm{AB}$ 위의 점을 $\mathrm{E}$, 점 $\mathrm{D}$로부터 거리가 $2$인 선분 $\mathrm{CD}$ 위의 점을 $\mathrm{F}$라 하자.

  $0<p\le\dfrac\pi3$인 실수 $p$에 대하여 아래를 생각하자.

  (Ⅰ) 각 $\mathrm{FPD}$의 크기가 $p$를 만족시키는 반직선 $\mathrm{AD}$ 위의 점을 $\mathrm{P}$라 하자. (단, $\overline{\mathrm{AD}}<\overline{\mathrm{AP}}$)

  (Ⅱ) 중심이 $\mathrm{P}$이고 반지름의 길이가 $\overline{\mathrm{PD}}$인 원 위의 점 $\mathrm{D'}$에 대하여 부채꼴 $\mathrm{PDD'}$의 호의 길이가 $2$일 때, 부채꼴 $\mathrm{PDD'}$의 중심각의 크기를 $r$(라디안)이라 하자. $\left(\text{단, }0<r<\dfrac{2\pi}{3}\right)$

  (Ⅲ) 중심이 $\mathrm{P}$이고 반지름의 길이가 $\overline{\mathrm{PA}}$인 원과 반직선 $\mathrm{PD'}$의 교점을 점 $\mathrm{A'}$라 하자.

  (Ⅳ) 중심이 $\mathrm{P}$이고 반지름의 길이가 $\overline{\mathrm{PB}}$인 원 위의 점 $\mathrm{B'}$에 대하여 부채꼴 $\mathrm{PBB'}$의 중심각의 크기가 $r$(라디안)일 때, 선분 $\mathrm{AB}$, 부채꼴 $\mathrm{PBB'}$의 호, 선분 $\mathrm{B'A'}$, 선분 $\mathrm{A'D'}$, 부채꼴 $\mathrm{PDD'}$의 호, 선분 $\mathrm{DA}$로 둘러싸인 도형의 넓이를 $S(p)$라 하자.

  예를 들어, 다음은 $p=\dfrac\pi8$일 때의 그림이다.

  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【2-1】 $r$을 $p$의 함수로 나타내시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'tan(p)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{PD}}=2\cot p$, 호의 길이 $\overline{\mathrm{PD}}\,r=2$.
    steps:
    - {id: 1a, content: '$r=\frac{2}{2\cot p}=\tan p$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 직각삼각형 $\mathrm{PDF}$에서 $\overline{\mathrm{PD}}$는?
  - id: S1-B
    audience: B
    source_flow: M25_N2s.pdf p.2
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (호 $\mathrm{DD'}$의 길이)$=\overline{\mathrm{PD}}\,r=2$이므로 $\overline{\mathrm{PD}}=\dfrac2r=\overline{\mathrm{DF}}\cot p=2\cot p$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 $r=\tan p$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $\overline{\mathrm{PD}}$, $\overline{\mathrm{DF}}$, $r$의 관계를 표현했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $r=\tan p$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42501}
  misconceptions:
  - id: MC-ALG-42501
    outcome_code: '71'
    wrong_work: '$\overline{\mathrm{PD}}=2\tan p$로 두어 $r=\cot p$'
    detect_cue: $r$이 $\cot p$ 또는 $\frac1{\tan p}$이다
    feedback: $\angle\mathrm{FPD}=p$에서 $\tan p=\frac{\overline{\mathrm{DF}}}{\overline{\mathrm{PD}}}$이므로 $\overline{\mathrm{PD}}=2\cot p$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    【2-2】 $S(p)$를 $p$의 함수로 나타내시오. (40점)
  points: 40
  depends_on: ['1']
  answer: {kind: expression, value: '2*sqrt(3) + 6*tan(p)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 삼각형 $\mathrm{PA'B'}\equiv\mathrm{PAB}$이므로 $S=\frac r2(\overline{\mathrm{PB}}^2-\overline{\mathrm{PD}}^2)$.
    steps:
    - {id: 2a, content: '$S(p)=\frac{\tan p}{2}\left((2\cot p+\sqrt3)^2+9-4\cot^2p\right)=2\sqrt3+6\tan p$', criteria: [2.M1, 2.M2, 2.A1]}
    hint_ladder:
    - 삼각형 $\mathrm{PAB}$를 $\mathrm{P}$를 중심으로 $r$만큼 돌리면 어디로 가는가?
  - id: S2-B
    audience: B
    source_flow: M25_N2s.pdf p.2~3
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\angle\mathrm{BPA}$를 $w$라 하면 $\overline{\mathrm{PA}}=\overline{\mathrm{PB}}\cos w$이다. 점 $\mathrm{P}$를 원점, 반직선 $\mathrm{PA}$를 양의 $x$축이라 하면 $\mathrm{A}=(\overline{\mathrm{PB}}\cos w,0)$, $\mathrm{B}=(\overline{\mathrm{PB}}\cos w,\overline{\mathrm{PB}}\sin w)$, $\mathrm{D}=(\overline{\mathrm{PD}},0)$, $\mathrm{A'}=(\overline{\mathrm{PB}}\cos w\cos r,\overline{\mathrm{PB}}\cos w\sin r)$, $\mathrm{B'}=(\overline{\mathrm{PB}}\cos(r+w),\overline{\mathrm{PB}}\sin(r+w))$, $\mathrm{D'}=(\overline{\mathrm{PD}}\cos r,\overline{\mathrm{PD}}\sin r)$. 부채꼴 $\mathrm{PBB'}$의 호와 $x$축, 두 직선 $x=\overline{\mathrm{PA}}$, $x=\overline{\mathrm{PB}}\cos(r+w)$로 둘러싸인 도형의 넓이를 $S_1$, 부채꼴 $\mathrm{PDD'}$의 호와 $x$축, 직선 $x=\overline{\mathrm{PD}}\cos r$로 둘러싸인 도형의 넓이를 $S_2$, 선분 $\mathrm{D'A'}$와 $x$축, 두 직선 $x=\overline{\mathrm{PD}}\cos r$, $x=\overline{\mathrm{PA}}\cos r$로 둘러싸인 도형의 넓이를 $S_3$, 선분 $\mathrm{B'A'}$와 $x$축, 두 직선 $x=\overline{\mathrm{PB}}\cos(r+w)$, $x=\overline{\mathrm{PA}}\cos r$로 둘러싸인 도형의 넓이를 $S_4$라 하면 $S(p)=S_1-S_2+S_3-S_4$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        제시문 (가)에 의해 $S_1=\displaystyle\int_{\overline{\mathrm{PB}}\cos(r+w)}^{\overline{\mathrm{PB}}\cos w}\sqrt{\overline{\mathrm{PB}}^2-x^2}dx$, $S_2=\displaystyle\int_{\overline{\mathrm{PD}}\cos r}^{\overline{\mathrm{PD}}}\sqrt{\overline{\mathrm{PD}}^2-x^2}dx$이고, 각각 $x=\overline{\mathrm{PB}}\cos u$, $x=\overline{\mathrm{PD}}\cos u$로 두면 (나), (다)에 의해 $S_1=\dfrac{\overline{\mathrm{PB}}^2}{2}\left(r-\dfrac{\sin(2(r+w))}{2}+\dfrac{\sin(2w)}{2}\right)$, $S_2=\dfrac{\overline{\mathrm{PD}}^2}{2}\left(r-\dfrac{\sin(2r)}{2}\right)$. $S_3$, $S_4$는 사다리꼴의 넓이이므로 $S_3=\dfrac12(\overline{\mathrm{PB}}\cos w\cos r-\overline{\mathrm{PD}}\cos r)(\overline{\mathrm{PB}}\cos w\sin r+\overline{\mathrm{PD}}\sin r)$, $S_4=\dfrac12(\overline{\mathrm{PB}}\cos w\cos r-\overline{\mathrm{PB}}\cos(r+w))(\overline{\mathrm{PB}}\sin(r+w)+\overline{\mathrm{PB}}\cos w\sin r)$.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $S(p)=S_1-S_2+S_3-S_4$이므로 (다)를 이용하여 정리하면 $S(p)=\dfrac r2\left(\overline{\mathrm{PB}}^2-\overline{\mathrm{PD}}^2\right)=\dfrac r2\left((\overline{\mathrm{PD}}+\overline{\mathrm{AD}})^2+\overline{\mathrm{AB}}^2-\overline{\mathrm{PD}}^2\right)=\dfrac{\tan p}{2}(12+4\sqrt3\cot p)=2\sqrt3+6\tan p$.
      criteria: [2.A1]
  - id: S2-ALT
    audience: ALT
    source_flow: M25_N2s.pdf p.3 별해
    method_no: 2
    key_idea: 원 해설 별해 — 삼각형 $\mathrm{PA'B'}$과 삼각형 $\mathrm{PAB}$는 SAS 합동이므로 넓이가 같다.
    steps:
    - id: 2c-1
      content: |
        $S(p)=S(p)+$(삼각형 $\mathrm{PA'B'}$의 넓이)$+$(부채꼴 $\mathrm{PDD'}$의 넓이)$-$(삼각형 $\mathrm{PAB}$의 넓이)$-$(부채꼴 $\mathrm{PDD'}$의 넓이)$=$(부채꼴 $\mathrm{PBB'}$의 넓이)$-$(부채꼴 $\mathrm{PDD'}$의 넓이)$=\dfrac{r}{2}\left(\overline{\mathrm{PB}}^2-\overline{\mathrm{PD}}^2\right)=\dfrac{\tan p}{2}\left(\dfrac{4\sqrt3}{\tan p}+12\right)=2\sqrt3+6\tan p$.
      criteria: [2.M1, 2.M2, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $S(p)$를 각 영역의 넓이의 합으로 나누었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.M2
      mark_type: M
      points: 20
      evidence: |
        각 영역의 넓이를 올바르게 계산했다. (나눈 영역의 개수 $N$에 대해 틀리게 계산한 영역당 $20/N$ 감점)
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        $S(p)=2\sqrt3+6\tan p$를 올바르게 구했다.
      depends_on: [2.M2]
      ft: {allowed: true, from: [1.A1], max_points: 10}
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42502}
  misconceptions:
  - id: MC-ALG-42502
    outcome_code: '71'
    wrong_work: '부채꼴 넓이를 $r\overline{\mathrm{PB}}^2-r\overline{\mathrm{PD}}^2$로 써서 $S(p)=4\sqrt3+12\tan p$'
    detect_cue: 결과가 정답의 2배이다
    feedback: 반지름 $R$, 중심각 $r$인 부채꼴의 넓이는 $\frac12R^2r$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    【2-3】 각 $\mathrm{EPD}$를 $q$라 하자. $p=\dfrac\pi6$일 때 $\dfrac{dq}{dp}$의 값을 구하시오. $\left(\text{단, }0<q<\dfrac\pi3\right)$ (40점)
  points: 40
