intent: |
  호의 길이로 중심각을 $p$의 함수로 나타내고(2-1), 부채꼴·사다리꼴로 나눈 넓이를 정적분·덧셈정리로 계산하며(2-2), 음함수 미분으로 두 각의 변화율을 구하고(2-3), 구간별로 정의된 합성함수의 정적분을 치환으로 계산할 수 있는지(2-4) 평가한다. (모의고사 자료에 출제 의도 별도 기재 없음 — 문항 해설 요지)
key_idea: |
  $\overline{\mathrm{PD}}=2\cot p$이고 호의 길이 $2$에서 $r=\tan p$. 삼각형 $\mathrm{PA'B'}\equiv\mathrm{PAB}$(SAS)이므로 $S(p)=$(부채꼴 $\mathrm{PBB'}$)$-$(부채꼴 $\mathrm{PDD'}$)$=\frac r2(\overline{\mathrm{PB}}^2-\overline{\mathrm{PD}}^2)=2\sqrt3+6\tan p$.
stuck: |
  복잡한 도형의 넓이를 회전 대칭(합동 삼각형 상쇄)으로 두 부채꼴 넓이의 차로 바꾸는 단계
