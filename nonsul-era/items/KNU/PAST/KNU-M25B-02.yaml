- id: '4'
  stem: |
    【2-4】 함수 $p(t)$가

    $$p(t)=\begin{cases}\dfrac\pi3t&\left(\dfrac12\le t<1\right)\\[2mm]\dfrac\pi3&(1\le t<2)\\[2mm]\pi-\dfrac\pi3t&\left(2\le t\le\dfrac52\right)\end{cases}$$

    일 때,

    $$\int_{\frac12}^{\frac52}S(p(t))dt=m\sqrt3+\frac{n\ln3}{\pi}$$

    이다. 자연수 $m$과 $n$의 값을 각각 구하시오. (40점)
  points: 40
  depends_on: ['2']
  answer: {kind: value, value: '10; 18', equivalents: ['m=10, n=18'], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $2\sqrt3$ 부분은 $4\sqrt3$, 가운데 구간은 $6\sqrt3$, 양 끝 구간은 각각 $\frac3\pi\ln\sqrt3\times6$.
    steps:
    - {id: 4a, content: '$10\sqrt3+6\cdot2\cdot\frac3\pi\ln\frac{\cos(\pi/6)}{\cos(\pi/3)}=10\sqrt3+\frac{18\ln3}{\pi}$', criteria: [4.M1, 4.B1, 4.A1, 4.A2]}
    hint_ladder:
    - 적분을 $p(t)$의 세 구간으로 나누자.
    - $\int\tan u\,du=-\ln\lvert\cos u\rvert+C$
  - id: S4-B
    audience: B
    source_flow: M25_N2s.pdf p.4
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        제시문 (마)에 의해 $\displaystyle\int_{\frac12}^{\frac52}S(p(t))dt=\int_{\frac12}^{1}S(p(t))dt+\int_1^2S(p(t))dt+\int_2^{\frac52}S(p(t))dt$
      criteria: [4.M1]
    - id: 4b-2
      content: |
        $\displaystyle=\int_{\frac12}^{1}\left\{2\sqrt3+6\tan\left(\frac\pi3t\right)\right\}dt+\int_1^2\left\{2\sqrt3+6\tan\left(\frac\pi3\right)\right\}dt+\int_2^{\frac52}\left\{2\sqrt3+6\tan\left(\pi-\frac\pi3t\right)\right\}dt=10\sqrt3+6\left\{\int_{\frac12}^{1}\tan\left(\frac\pi3t\right)dt+\int_2^{\frac52}\tan\left(\pi-\frac\pi3t\right)dt\right\}$ (가운데 구간 $\int_1^2(2\sqrt3+6\sqrt3)dt=8\sqrt3$)
      criteria: [4.B1]
    - id: 4b-3
      content: |
        제시문 (나)에 의해 $u=\dfrac\pi3t$, $v=\pi-\dfrac\pi3t$로 치환하면 $\displaystyle\int_{\frac12}^{\frac52}S(p(t))dt=10\sqrt3+\frac{18}{\pi}\left\{\int_{\frac\pi6}^{\frac\pi3}\tan(u)du-\int_{\frac\pi3}^{\frac\pi6}\tan(v)dv\right\}=10\sqrt3+\frac{18\ln3}{\pi}$
      criteria: [4.A1]
    - id: 4b-4
      content: |
        따라서 $m=10$, $n=18$이다.
      criteria: [4.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 5
      evidence: |
        적분식을 $t$에 따라 세 부분으로 나누었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 5}
      steps: [4b-1]
    - id: 4.B1
      mark_type: B
      points: 10
      evidence: |
        가운데 적분구간($1\le t<2$)의 적분값을 올바르게 계산했다.
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 20
      evidence: |
        왼쪽, 오른쪽 적분구간($\frac12\le t<1$, $2\le t\le\frac52$)의 적분값을 올바르게 계산했다(각 10점).
      depends_on: [4.M1]
      steps: [4b-3]
    - id: 4.A2
      mark_type: A
      points: 5
      evidence: |
        $m=10$, $n=18$을 올바르게 구했다.
      depends_on: [4.M1, 4.B1, 4.A1]
      steps: [4b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42527}
  misconceptions:
  - id: MC-CAL-42527
    outcome_code: '71'
    wrong_work: '$\int_{1/2}^1\tan\frac{\pi t}{3}dt=\ln\frac{\cos(\pi/6)}{\cos(\pi/3)}$로 치환 계수 $\frac3\pi$를 빠뜨려 $n=6\pi$꼴'
    detect_cue: $\frac{\ln3}{\pi}$ 꼴이 나오지 않는다
    feedback: $u=\frac\pi3t$이면 $dt=\frac3\pi du$입니다.
    remedy: [RL-4]

