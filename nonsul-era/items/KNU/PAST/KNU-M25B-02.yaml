  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $2\cot q=\overline{\mathrm{PA}}=2\cot p+\sqrt3$를 $p$로 미분.
    steps:
    - {id: 3a, content: '$\frac{dq}{dp}=\frac{\sin^2q}{\sin^2p}$, $\cot q=\frac{3\sqrt3}{2}$, $\sin^2q=\frac4{31}$, 답 $\frac{16}{31}$', criteria: [3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - 직각삼각형 $\mathrm{PAE}$에서 $\overline{\mathrm{PA}}$를 $q$로 나타내 보자.
  - id: S3-B
    audience: B
    source_flow: M25_N2s.pdf p.3
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $2\cot q=\overline{\mathrm{PA}}=\overline{\mathrm{PD}}+\overline{\mathrm{DA}}=2\cot p+\sqrt3$이므로
      criteria: [3.M1]
    - id: 3b-2
      content: |
        제시문 (라)의 음함수 미분법에 의해 $-\dfrac{2}{\sin^2q}\dfrac{dq}{dp}=-\dfrac{2}{\sin^2p}$, $\dfrac{dq}{dp}=\dfrac{\sin^2q}{\sin^2p}$.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        $p=\dfrac\pi6$일 때 $\cot q=\cot\left(\dfrac\pi6\right)+\dfrac{\sqrt3}{2}=\dfrac{3\sqrt3}{2}$이고 $\sin q=\dfrac{2}{\sqrt{31}}$이므로 $\dfrac{dq}{dp}=\dfrac{\frac{4}{31}}{\frac14}=\dfrac{16}{31}$.
      criteria: [3.A1]
  rubric:
