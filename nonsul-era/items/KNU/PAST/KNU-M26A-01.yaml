intent: |
  점화식으로 정의된 두 수열의 관계에서 일반항을 구하고, 넓이(정적분)와 직사각형 넓이의 합 비교로 조화수열의 부분합을 로그로 평가한 뒤, $1+x\le e^x$와 결합해 곱으로 표현된 수열의 증가 속도를 위·아래로 묶어 극한을 판정하는 능력을 본다. (가이드북에 출제 의도 별도 기재 없음 — 해설 흐름에서 요약)
key_idea: |
  $a_{n+1}=r^nb_n\cdots b_1$이고 $b_k=1-\dfrac1{rk}$. 위로는 $b_k\le e^{-\frac1{rk}}$, 아래로는 $b_k\ge\left(1+\dfrac1{r(k-1)}\right)^{-1}\ge e^{-\frac1{r(k-1)}}$; 조화합은 $\int\dfrac1x\,dx=\ln$으로 양쪽에서 묶여 $a_{n+1}\approx r^n n^{-\frac1r}$.
stuck: |
  곱 $b_1b_2\cdots b_n$을 $1+x\le e^x$로 지수의 합(조화합)으로 바꾸고, 그 합을 제시문 (가)의 적분 부등식으로 $\ln n$에 묶는 연결, 그리고 1-4에서 아래쪽 부등식을 1-2의 형태로 만드는 단계
idea_tags: [IDEA-PRODUCT-TO-EXP-SUM, IDEA-HARMONIC-INTEGRAL-BOUND, IDEA-SQUEEZE-GROWTH-RATE]
tags: [곱으로 정의된 수열, 조화급수, 1+x≤e^x, 수열의 극한 판정]
