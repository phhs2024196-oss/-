  - '곱 관계 $a_{n+1}=r^nb_nb_{n-1}\cdots b_1$'
  - '조화수열의 부분합과 $\int_1^k\dfrac1x\,dx$'
  - '수열 $\dfrac{r^n}{a_{n+1}}$, $\dfrac{a_{n+1}n^p}{3^n}$'
  concepts:
  - '수열의 귀납적 정의'
  - '정적분과 넓이(제시문 (나)), 직사각형 넓이의 합과 비교'
  - '부등식 $1+x\le e^x$(제시문 (다))'
  - '지수법칙(제시문 (라))'
  - '$\lim\dfrac{n^p}{r^n}=0$(제시문 (마)), 수열의 극한의 대소 관계'
  tools:
  - '$\dfrac{a_{n+1}}{a_n}=rb_n$ ($n\ge2$), $a_2=rb_1$'
  - '$b_n=\left(1+\dfrac1{rn-1}\right)^{-1}$'
  - '$b_k\le e^{-\frac1{rk}}$, $\left(1+\frac1{r(k-1)}\right)^{-1}\ge e^{-\frac1{r(k-1)}}$'
  - '$\ln(n+1)\le1+\frac12+\cdots+\frac1n$, $\frac12+\cdots+\frac1{n-1}\le\ln(n-1)$'
  - '조임: $C_2n^{p-\frac13}\le\dfrac{a_{n+1}n^p}{3^n}\le C_3n^{p-\frac13}$'
