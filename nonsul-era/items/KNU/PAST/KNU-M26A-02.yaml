stimuli:
- label: (가)
  body: |
    서로 다른 $n$개에서 순서를 생각하지 않고 $r\ (0\le r\le n)$개를 택하는 것을 $n$개에서 $r$개를 택하는 조합이라 하고, 이 조합의 수를 기호로 ${}_nC_r$이라 나타내며
    $${}_nC_r=\dfrac{n!}{r!(n-r)!}\quad(\text{단, }0\le r\le n)$$
- label: (나)
  body: |
    수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라고 하면
    $$a_1=S_1,\quad a_n=S_n-S_{n-1}\ (\text{단, }n\ge2)$$
- label: (다)
  body: |
    삼각함수 사이의 관계
    (1) $\sin^2\theta+\cos^2\theta=1$
    (2) $\sin\left(\dfrac\pi2+\theta\right)=\cos\theta$
    (3) $\cos\left(\dfrac\pi2+\theta\right)=-\sin\theta$
    (4) $\sin(-\theta)=-\sin\theta$
    (5) $\cos(-\theta)=\cos\theta$
- label: (라)
  body: |
    첫째항이 $a$이고 공비가 $r\ (r\ne0)$인 등비수열의 첫째항부터 제$n$항까지의 합 $S_n$은
    (1) $r\ne1$일 때, $S_n=\dfrac{a(1-r^n)}{1-r}=\dfrac{a(r^n-1)}{r-1}$
    (2) $r=1$일 때, $S_n=na$
- label: (마)
  body: |
    함수 $y=f(x)$의 $x=a$에서의 미분계수는
    $$f'(a)=\lim_{x\to a}\dfrac{f(x)-f(a)}{x-a}$$
- label: (바)
  body: |
    미분가능한 두 함수 $f(x)$, $g(x)$ $(g(x)\ne0)$에 대하여 $y=\dfrac{f(x)}{g(x)}$이면
    $$y'=\dfrac{f'(x)g(x)-f(x)g'(x)}{\{g(x)\}^2}$$
- label: (사)
  body: |
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$의 도함수는
    $$y'=f'(g(x))g'(x)$$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  세 수열 $\{a_n\}$, $\{b_n\}$, $\{S_n\}$이 다음 조건을 만족시킬 때, 다음 물음에 답하시오.

  (1) 자연수 $n$에 대하여 집합
  $$A_n=\{x\mid x\text{는 }n\text{ 이상 }2n+1\text{ 이하의 자연수}\}$$
  라고 할 때, 집합 $A_n$의 부분집합 중에서 원소의 개수가 $n$인 부분집합의 개수를 $S_n$이라 한다.
  (2) 수열 $\{b_n\}$은 모든 자연수 $n$에 대하여 $S_n=\displaystyle\sum_{k=1}^{n}b_k$를 만족시킨다.
  (3) $a_1=\displaystyle\sum_{n=1}^{\infty}\dfrac1{b_nb_{n+2}}$이고 $0<\displaystyle\sum_{n=1}^{\infty}a_n<\dfrac12$이다.
  (4) $2$ 이상의 모든 자연수 $n$에 대하여
  $$\dfrac{a_1}{b_n}<\dfrac{a_{n+1}}{a_n}<\dfrac{b_{n+1}}{2b_n}$$
  이다.
  (5) 모든 자연수 $n$에 대하여
  $$\sqrt2\cos^2\left(\dfrac{8a_{n+1}+a_n}{8a_n}\pi\right)+3\cos\left(\dfrac{8a_{n+1}-3a_n}{8a_n}\pi\right)-2\sqrt2=0$$
  이다.

subparts:
- id: '2-1'
  stem: |
    $S_5+b_1$의 값을 구하시오. 또한 $b_n=pn+q\ (n\ge2)$일 때, 상수 $p,q$의 값을 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: expression, value: '(24, 1, 1)', equivalents: ['S_5+b_1=24, p=1, q=1'], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: $n(A_n)=n+2$이므로 $S_n={}_{n+2}C_2=\tfrac{(n+1)(n+2)}2$.
    steps:
    - {id: 2-1a, content: '$S_5=21$, $b_1=3$, $b_n=n+1$ $(n\ge2)$', criteria: [2-1.B1, 2-1.B2, 2-1.B3, 2-1.B4]}
    hint_ladder:
    - $A_n$의 원소는 몇 개인가?
    - ${}_{n+2}C_n={}_{n+2}C_2$
  - id: S2-1-B
    audience: B
    source_flow: GB26.pdf p.71(인쇄 69)
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        조건 (1)에서 $n(A_n)=n+2$이므로 제시문 (가)에 의해 원소의 개수가 $n$인 부분집합의 개수는 $S_n={}_{n+2}C_n={}_{n+2}C_2=\dfrac{(n+2)(n+1)}2=\dfrac12(n^2+3n+2)$이다. 따라서 $S_5=21$이다.
      criteria: [2-1.B1]
    - id: 2-1b-2
      content: |
        또한 조건 (2)와 제시문 (나)에 의해 $b_1=S_1=3$이고 ($S_5+b_1=24$)
      criteria: [2-1.B2]
    - id: 2-1b-3
      content: |
        $n\ge2$일 때, $b_n=S_n-S_{n-1}=\dfrac12(n^2+3n+2)-\dfrac12\{(n-1)^2+3(n-1)+2\}=n+1$이다. 따라서 $p=1$, $q=1$.
      criteria: [2-1.B3, 2-1.B4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.B1
      mark_type: B
      points: 10
      evidence: $S_5=21$을 구했다.
      steps: [2-1b-1]
    - id: 2-1.B2
      mark_type: B
      points: 6
      evidence: |
        $b_1=3$을 구했다. (단, $S_5$와 $b_1$을 정확하게 구하였으나 $S_5+b_1=24$를 틀린 경우 2점 감점하고, $S_5$ 또는 $b_1$의 값을 정확하게 구하지 못한 경우 $S_5+b_1=24$를 적었더라도 $S_5$ 또는 $b_1$의 값에 대한 점수만 부여함)
      steps: [2-1b-2]
    - id: 2-1.B3
      mark_type: B
      points: 7
      evidence: $p=1$을 구했다.
      steps: [2-1b-3]
    - id: 2-1.B4
      mark_type: B
      points: 7
      evidence: $q=1$을 구했다.
      steps: [2-1b-3]
    deductions:
    - code: D2-1-1
      condition: $S_5$와 $b_1$을 정확하게 구하였으나 $S_5+b_1=24$를 틀림
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42602}
  misconceptions:
  - id: MC-ALG-42602
    outcome_code: '71'
    wrong_work: '$A_n$의 원소를 $n+1$개로 세어 $S_n={}_{n+1}C_n=n+1$, $S_5=6$'
    detect_cue: $S_5=6$ 또는 $S_n$이 일차식
    feedback: $n$부터 $2n+1$까지의 자연수는 $(2n+1)-n+1=n+2$개입니다.
    remedy: [RL-1]

- id: '2-2'
  stem: |
    수열 $\{a_n\}$에 대하여 $a_1+a_2$의 값을 구하시오. 또한 $a_n=15\times\alpha^n\ (n\ge3)$일 때, $\alpha$의 값을 구하시오. (60점)
  points: 60
  depends_on: ['2-1']
  answer: {kind: expression, value: '(27/64, 1/8)', equivalents: ['a_1+a_2=27/64, alpha=1/8'], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: 부분분수로 $a_1=\tfrac38$; 조건 (5)에서 $\cos t_n=\tfrac1{\sqrt2}$; $n\ge3$에서 (4)의 범위로 비 $\tfrac18$, $n=2$에서 $\tfrac58$, $n=1$에서는 (3)으로 $\tfrac18$.
    steps:
    - {id: 2-2a, content: '$a_1=\tfrac38$, $a_2=\tfrac3{64}$, $a_3=\tfrac{15}{512}$, $a_n=\tfrac{15}{8^n}$ $(n\ge3)$', criteria: [2-2.B1, 2-2.M1, 2-2.A1, 2-2.A2]}
    hint_ladder:
    - $\dfrac{8a_{n+1}+a_n}{8a_n}\pi$와 $\dfrac{8a_{n+1}-3a_n}{8a_n}\pi$의 차는?
    - 조건 (5)를 $\cos t_n$에 대한 이차방정식으로 만들자.
    - $n=1$의 비는 조건 (4)가 주지 않는다. 조건 (3)을 쓰자.
  - id: S2-2-B
    audience: B
    source_flow: GB26.pdf pp.71–72(인쇄 69–70)
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        2-1에 의해 $b_1=3$이고 $n\ge2$일 때 $b_n=n+1$이므로 조건 (3)에 의해
        $a_1=\dfrac1{b_1b_3}+\displaystyle\sum_{n=2}^{\infty}\dfrac1{b_nb_{n+2}}=\dfrac1{3\cdot4}+\sum_{n=2}^{\infty}\dfrac1{(n+1)(n+3)}=\dfrac1{12}+\dfrac12\lim_{n\to\infty}\sum_{k=2}^{n}\left(\dfrac1{k+1}-\dfrac1{k+3}\right)=\dfrac1{12}+\dfrac12\lim_{n\to\infty}\left(\dfrac13+\dfrac14-\dfrac1{n+2}-\dfrac1{n+3}\right)=\dfrac38$.
      criteria: [2-2.B1]
    - id: 2-2b-2
      content: |
        조건 (4)와 2-1로부터 $n\ge2$일 때 $\dfrac3{8(n+1)}<\dfrac{a_{n+1}}{a_n}<\dfrac{n+2}{2(n+1)}$이다.
        조건 (5)에서 모든 자연수 $n$에 대하여 $t_n=\left(\dfrac{a_{n+1}}{a_n}-\dfrac38\right)\pi$라 두면 제시문 (다)에 의해
        $\sqrt2\cos^2\left(t_n+\dfrac\pi2\right)+3\cos t_n-2\sqrt2=\sqrt2\sin^2t_n+3\cos t_n-2\sqrt2=-\sqrt2\cos^2t_n+3\cos t_n-\sqrt2=-(\sqrt2\cos t_n-1)(\cos t_n-\sqrt2)=0$
        이므로 $\cos t_n=\dfrac1{\sqrt2}$, 즉 $\cos\left\{\left(\dfrac{a_{n+1}}{a_n}-\dfrac38\right)\pi\right\}=\dfrac1{\sqrt2}$이다.
      criteria: [2-2.M1]
    - id: 2-2b-3
      content: |
        $n=2$일 때 $\dfrac18<\dfrac{a_3}{a_2}<\dfrac23$이므로 $-\dfrac14<\dfrac{a_3}{a_2}-\dfrac38<\dfrac7{24}$이다. 그러므로 $\dfrac{a_3}{a_2}=\dfrac58$이다.
        또한 $n\ge3$일 때 $\dfrac{-3n}{8(n+1)}<\dfrac{a_{n+1}}{a_n}-\dfrac38<\dfrac{n+5}{8(n+1)}$이다. $-\dfrac38<\dfrac{-3n}{8(n+1)}\le-\dfrac9{32}$이고 $\dfrac18<\dfrac{n+5}{8(n+1)}\le\dfrac14$이므로 $\dfrac{a_{n+1}}{a_n}=\dfrac18$이다.
      criteria: [2-2.M1]
    - id: 2-2b-4
      content: |
        $\dfrac{a_2}{a_1}=\alpha$라고 두면 제시문 (라)에 의해
        $\displaystyle\sum_{n=1}^{\infty}a_n=\dfrac38+\dfrac38\alpha+\left(\dfrac38\alpha\right)\times\dfrac58+\left(\dfrac38\alpha\right)\times\dfrac58\times\dfrac18+\left(\dfrac38\alpha\right)\times\dfrac58\times\left(\dfrac18\right)^2+\cdots=\dfrac{21+36\alpha}{56}$
        이고 조건 (3)에 의해 $0<\dfrac{21+36\alpha}{56}<\dfrac12$이고, 이 부등식을 풀면 $-\dfrac7{12}<\alpha<\dfrac7{36}$이다. $-\dfrac{23}{24}<\alpha-\dfrac38<-\dfrac{13}{72}$이므로 $\alpha=\dfrac18$이다.
      criteria: [2-2.A1]
    - id: 2-2b-5
      content: |
        따라서 수열 $\{a_n\}$의 일반항은 $a_n=\begin{cases}\frac38&(n=1)\\\frac3{64}&(n=2)\\\frac{15}{8^n}&(n\ge3)\end{cases}$이다. 그러므로 $a_1+a_2=\dfrac{27}{64}$이고, $a_n=15\times\left(\dfrac18\right)^n$ $(n\ge3)$에서 (문제의) $\alpha=\dfrac18$이다.
      criteria: [2-2.A1, 2-2.A2]
  rubric:
