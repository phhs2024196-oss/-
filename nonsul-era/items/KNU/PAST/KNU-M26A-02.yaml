intent: |
  조합의 수로 합 $S_n$을 구해 일반항을 얻고, 부분분수 급수·삼각함수 사이의 관계·부등식 조건으로 이웃 항의 비를 특정해 등비 꼴 수열을 결정하며, 다항식의 나머지 정리 정보와 미분계수의 정의(몫·합성함수의 미분)로 극한값을 계산하는 능력을 본다. (가이드북에 출제 의도 별도 기재 없음 — 해설 흐름에서 요약)
key_idea: |
  $S_n={}_{n+2}C_n=\tfrac{(n+1)(n+2)}2$, $b_n=n+1$ $(n\ge2)$. 조건 (5)는 $t_n=\left(\tfrac{a_{n+1}}{a_n}-\tfrac38\right)\pi$로 놓으면 $-(\sqrt2\cos t_n-1)(\cos t_n-\sqrt2)=0$, 즉 $\cos t_n=\tfrac1{\sqrt2}$이고, 조건 (4)·(3)의 범위가 $t_n$을 하나로 고정한다. 2-3은 $t=\tfrac1x$ 치환으로 $h(x)=\dfrac{f(x)}{e^{g(x)}}$의 $x=2$에서의 미분계수 합이 된다.
stuck: |
  조건 (5)를 $\cos t_n$의 이차방정식으로 바꾸는 삼각변환($\cos^2\left(t_n+\tfrac\pi2\right)=\sin^2t_n$), 그리고 $n=1$의 비 $\alpha=\tfrac{a_2}{a_1}$을 조건 (3)의 급수 범위로 결정하는 단계
