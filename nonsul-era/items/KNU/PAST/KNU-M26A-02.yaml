- id: '2-3'
  stem: |
    두 다항함수 $f(x)$, $g(x)$에 대하여 $f(x)$와 $g(x)-3$은 $x-2$로 나누어떨어지고 $f(x)$를 $(x-2)^2$으로 나누었을 때의 나머지가 $8x-16$일 때, $\displaystyle\lim_{x\to\infty}\sum_{n=1}^{3}\dfrac{xf\left(2+\frac{a_n}x\right)}{e^{g\left(2+\frac{a_n}x\right)}}$의 값을 구하시오. (40점)
  points: 40
  depends_on: ['2-2']
  answer: {kind: value, value: '231/(64*exp(3))', equivalents: ['231/(64e^3)'], tolerance: null}
  solutions:
  - id: S2-3-A
    audience: A
    method_no: 1
    key_idea: $h(x)=\dfrac{f(x)}{e^{g(x)}}$, $h(2)=0$이므로 각 항은 $a_n\cdot\dfrac{h(2+a_nt)-h(2)}{a_nt}\to a_nh'(2)$ ($t=\tfrac1x$).
    steps:
    - {id: 2-3a, content: '$(a_1+a_2+a_3)h\prime(2)=\tfrac{231}{512}\cdot\tfrac8{e^3}=\tfrac{231}{64e^3}$', criteria: [2-3.B1, 2-3.B2, 2-3.B3, 2-3.M1, 2-3.A1]}
    hint_ladder:
    - $x\to\infty$를 $t=\tfrac1x\to0+$로 바꾸자.
    - $f(2)=0$이므로 분자는 어떤 미분계수의 꼴인가?
  - id: S2-3-B
    audience: B
    source_flow: GB26.pdf pp.72–73(인쇄 70–71)
    method_no: 1
    steps:
    - id: 2-3b-1
      content: |
        $f(x)$와 $g(x)-3$이 $x-2$로 나누어떨어지므로 $f(2)=0$이고 $g(2)=3$이다. $f(x)$를 $(x-2)^2$으로 나누었을 때의 나머지가 $8x-16$이므로 $f(x)=(x-2)^2Q(x)+8x-16$이다. 양변을 미분한 후 $x=2$를 대입하면 $f'(2)=8$이다.
      criteria: [2-3.B1, 2-3.B2, 2-3.B3]
    - id: 2-3b-2
      content: |
        문제 2-2에 의해 $a_1=\dfrac38$, $a_2=\dfrac3{64}$, $a_3=\dfrac{15}{512}$이다. $h(x)=\dfrac{f(x)}{e^{g(x)}}$라고 하면 제시문 (바)와 (사)에 의해 $h'(x)=\dfrac{f'(x)-f(x)g'(x)}{e^{g(x)}}$이므로 $h'(2)=\dfrac8{e^3}$이다.
      criteria: [2-3.A1]
    - id: 2-3b-3
      content: |
        따라서 $t=\dfrac1x$로 치환하면 제시문 (마)에 의해
        $\displaystyle\lim_{x\to\infty}\sum_{n=1}^{3}\dfrac{xf\left(2+\frac{a_n}x\right)}{e^{g\left(2+\frac{a_n}x\right)}}=\lim_{t\to0+}\left\{\dfrac{f\left(2+\frac38t\right)}{te^{g\left(2+\frac38t\right)}}+\dfrac{f\left(2+\frac3{64}t\right)}{te^{g\left(2+\frac3{64}t\right)}}+\dfrac{f\left(2+\frac{15}{512}t\right)}{te^{g\left(2+\frac{15}{512}t\right)}}\right\}$
        $=\dfrac38\displaystyle\lim_{t\to0+}\dfrac{\frac{f\left(2+\frac38t\right)}{e^{g\left(2+\frac38t\right)}}-\frac{f(2)}{e^{g(2)}}}{\frac38t}+\dfrac3{64}\lim_{t\to0+}\dfrac{\frac{f\left(2+\frac3{64}t\right)}{e^{g\left(2+\frac3{64}t\right)}}-\frac{f(2)}{e^{g(2)}}}{\frac1{64}t}+\dfrac{15}{512}\lim_{t\to0+}\dfrac{\frac{f\left(2+\frac{15}{512}t\right)}{e^{g\left(2+\frac{15}{512}t\right)}}-\frac{f(2)}{e^{g(2)}}}{\frac{15}{512}t}$
      criteria: [2-3.M1]
    - id: 2-3b-4
      content: |
        $=\dfrac38\times h'(2)+\dfrac3{64}\times h'(2)+\dfrac{15}{512}\times h'(2)=\dfrac{231}{512}\times h'(2)=\dfrac{231}{64e^3}$이다.
      criteria: [2-3.A1]
    # [공식해설 확인필요] 예시답안 p.73 둘째 항 분모가 「(1/64)t」로 인쇄됨(3/64·t 의 오기로 보임, 앞의 계수 3/64 와 짝이 맞지 않음). 최종값 231/(64e^3)에는 영향 없음.
