elements:
  materials:
  - '집합 $A_n=\{n,\ldots,2n+1\}$의 원소 $n$개 부분집합의 개수 $S_n$'
  - '$S_n=\sum_{k=1}^nb_k$인 수열 $b_n$'
  - '$a_1=\sum_{n=1}^{\infty}\dfrac1{b_nb_{n+2}}$, $0<\sum a_n<\tfrac12$'
  - '비 조건 $\dfrac{a_1}{b_n}<\dfrac{a_{n+1}}{a_n}<\dfrac{b_{n+1}}{2b_n}$ $(n\ge2)$'
  - '삼각 등식 $\sqrt2\cos^2\left(\frac{8a_{n+1}+a_n}{8a_n}\pi\right)+3\cos\left(\frac{8a_{n+1}-3a_n}{8a_n}\pi\right)-2\sqrt2=0$'
  - '$f(2)=0$, $g(2)=3$, $f$를 $(x-2)^2$으로 나눈 나머지 $8x-16$인 다항함수'
  concepts:
  - '조합의 수 ${}_nC_r={}_nC_{n-r}$(제시문 (가))'
  - '수열의 합과 일반항(제시문 (나))'
  - '부분분수와 급수의 합'
  - '삼각함수 사이의 관계(제시문 (다))'
  - '등비급수(제시문 (라))'
  - '미분계수의 정의(제시문 (마)), 몫의 미분(제시문 (바)), 합성함수의 미분(제시문 (사))'
  tools:
  - '$\frac1{(n+1)(n+3)}=\frac12\left(\frac1{n+1}-\frac1{n+3}\right)$'
  - '치환 $t_n=\left(\frac{a_{n+1}}{a_n}-\frac38\right)\pi$'
  - '$\sqrt2\cos^2\left(t_n+\frac\pi2\right)=\sqrt2\sin^2t_n$'
  - '$f(x)=(x-2)^2Q(x)+8x-16\Rightarrow f\prime(2)=8$'
  - '$h(x)=\dfrac{f(x)}{e^{g(x)}}$, $h\prime(2)=\dfrac{f\prime(2)-f(2)g\prime(2)}{e^{g(2)}}=\dfrac8{e^3}$'
  - '$t=\dfrac1x$ 치환'
  conditions:
  - '$b_1=3$은 따로, $b_n=n+1$은 $n\ge2$'
  - '$\cos t_n=\sqrt2$는 불가'
  - '$n\ge3$에서 $-\frac38<\frac{t_n}\pi<\frac14$이고 $\cos t_n=\frac1{\sqrt2}$이므로 $\frac{t_n}\pi=-\frac14$, 즉 $\frac{a_{n+1}}{a_n}=\frac18$ ($n=2$이면 $\frac{t_2}\pi=\frac14$, 비 $\frac58$)'
  - '$n=1$의 비 $\alpha$는 조건 (3)의 $0<\sum a_n<\frac12$로 결정'
  - '2-3은 $a_1$, $a_2$, $a_3$만 사용'
  stimuli_used: ['(가)', '(나)', '(다)', '(라)', '(마)', '(바)', '(사)']
  subpart_links: '2-2는 2-1의 b_n, 2-3은 2-2의 a_1, a_2, a_3 을 사용'

