stimuli:
- label: (가)
  body: |
    함수 $f(x)$에서 미분가능할 때, 곡선 $y=f(x)$위의 점 $\mathrm{P}(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: (나)
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는
    $$\{f(g(x))\}'=f'(g(x))g'(x)$$
- label: (다)
  body: |
    이계도함수를 갖는 함수 $f(x)$가 $f'(a)=0$일 때 $f''(a)>0$ $(f''(a)<0)$이면 $f(x)$는 $x=a$에서 극소(극대)이다.
- label: (라)
  body: |
    닫힌구간 $[a,\ b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가, $a=g(\alpha)$, $b=g(\beta)$일 때 $\alpha$와 $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
- label: (마)
  body: |
    닫힌구간 $[a,b]$에서 연속인 도함수를 갖는 두 함수 $f(x)$, $g(x)$에 대하여
    $$\int_a^bf(x)g'(x)\,dx=[f(x)g(x)]_a^b-\int_a^bf'(x)g(x)\,dx$$

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  삼차함수 $f(x)=x^3-ax^2+a$에 대하여 실수 전체의 집합에서 정의된 함수
  $$g(x)=e^{f(x)-x}+b(x-1)^2$$
  이 다음 조건을 만족시킨다.

  (ⅰ) $x=1$에서 곡선 $y=g(x)$의 접선의 방정식은 $y=1$이다.
  (ⅱ) 함수 $g(x)$가 역함수 $h(x)$를 가진다.

  다음 물음에 답하시오. (단, $a,b$는 실수이다.)

subparts:
- id: '1-1'
  stem: |
    실수 $a$의 값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-1-A
    audience: A
    method_no: 1
    key_idea: 접선이 $y=1$이면 $g'(1)=0$; $g'(1)=e^{f(1)-1}(f'(1)-1)$.
    steps:
    - {id: 1-1a, content: '$f\prime(1)=1\Rightarrow3-2a=1$, $a=1$', criteria: [1-1.M1, 1-1.A1]}
    hint_ladder:
    - 접선의 기울기가 0이다.
  - id: S1-1-B
    audience: B
    source_flow: GB26.pdf p.77(인쇄 75)
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        제시문 (가)와 (나)를 이용하면, $x=1$에서 곡선 $y=g(x)$의 접선의 방정식이 $y=1$이므로 $x=1$에서 미분계수는 $g'(1)=0$이다. 따라서 $e^{f(1)-1}(f'(1)-1)=0\Rightarrow f'(1)=1$이다.
      criteria: [1-1.M1]
    - id: 1-1b-2
      content: |
        즉, $3\times(1)^2-2a=1$이므로 $a=1$이다.
      criteria: [1-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 15
      evidence: 미분계수 $f'(1)$의 값($=1$)을 올바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [1-1b-1]
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: $a$의 값($a=1$)을 올바르게 구했다.
      depends_on: [1-1.M1]
      cao: true
      steps: [1-1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42616}
  misconceptions:
  - id: MC-CAL-42616
    outcome_code: '71'
    wrong_work: '$g\prime(1)=e^{f(1)-1}f\prime(1)=0$으로 속미분에서 $-1$을 빠뜨려 $f\prime(1)=0$, $a=\tfrac32$'
    detect_cue: 답 $a=\tfrac32$
    feedback: 지수 $f(x)-x$를 미분하면 $f'(x)-1$입니다.
    remedy: [RL-1]

- id: '1-2'
  stem: |
    $g'(0)=pe+q$라 할 때, 정수 $p,q$의 값을 구하시오. (60점)
  points: 60
  depends_on: ['1-1']
  answer: {kind: expression, value: '(-1, 4)', equivalents: ['p=-1, q=4'], tolerance: null}
  solutions:
  - id: S1-2-A
    audience: A
    method_no: 1
    key_idea: 증가함수의 임계점 $x=1$은 극값이 아니므로 $g''(1)\ne0$이면 모순 → $g''(1)=0$, $f''(1)=4$에서 $b=-2$.
    steps:
    - {id: 1-2a, content: '$g\prime\prime(1)=0+4+2b=0$, $b=-2$, $g\prime(0)=-e+4$', criteria: [1-2.R1, 1-2.A1, 1-2.A2]}
    hint_ladder:
    - 역함수가 있으면 $g$는 단조이다. $g'(1)=0$인 점에서 극값이 생길 수 있는가?
    - 제시문 (다)의 대우를 생각하자.
  - id: S1-2-B
    audience: B
    source_flow: GB26.pdf p.77(인쇄 75)
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        함수 $g(x)$가 역함수를 가지므로 실수 전체 집합에서 단조증가이다. 그리고 조건으로부터 $g'(1)=0$이다. 그러므로 제시문 (다)로부터 $g''(1)=0$이다($g''(1)\ne0$이면 $x=1$에서 극값을 가져 단조성에 모순).
      criteria: [1-2.R1]
    - id: 1-2b-2
      content: |
        제시문 (나)를 이용하면 $g''(x)=e^{f(x)-x}(f'(x)-1)^2+e^{f(x)-x}f''(x)+2b$이다. 따라서 $g''(1)=f'(1)-1+f''(1)+2b=0\Rightarrow b=-2$이다.
      criteria: [1-2.A1]
    - id: 1-2b-3
      content: |
        이로부터 $g'(0)=e^{f(0)}(f'(0)-1)-4\times(0-1)=-e+4$이므로 $p=-1$, $q=4$이다.
      criteria: [1-2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.R1
      mark_type: R
      points: 35
      evidence: 제시문을 이용하여 $g''(1)=0$임을 옳게 설명했다.
      depends_on: []
      steps: [1-2b-1]
    - id: 1-2.A1
      mark_type: A
      points: 15
      evidence: $b$의 값($b=-2$)을 올바르게 구했다.
      depends_on: [1-2.R1]
      steps: [1-2b-2]
    - id: 1-2.A2
      mark_type: A
      points: 10
      evidence: $p,q$의 값($p=-1$, $q=4$)을 올바르게 구했다.
      depends_on: [1-2.R1]
      cao: true
      steps: [1-2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42617}
  misconceptions:
  - id: MC-CAL-42617
    outcome_code: '71'
    wrong_work: '역함수 조건에서 $g\prime(x)>0$만 쓰고 $b$를 정하지 못하거나, $g\prime(1)=0$이 이미 성립하므로 $b$가 임의라고 답함'
    detect_cue: $g''(1)=0$ 조건이 없음, $b$ 미결정
    feedback: 증가함수의 도함수가 0인 점은 극값이 아니어야 합니다. $g''(1)\ne0$이면 제시문 (다)에 의해 극값이 생기므로 $g''(1)=0$입니다.
    remedy: [RL-2]

- id: '1-3'
  stem: |
    $\displaystyle\int_{-1}^{0}\dfrac{g(x)}{e^{g(x)}\times h'(g(x))}dx=(e^2-e^3)e^{-e}+\alpha$일 때, 실수 $\alpha$의 값을 구하시오. (40점)
  points: 40
  depends_on: ['1-2']
  answer: {kind: value, value: '-6*exp(7)', equivalents: [], tolerance: null}
  # [공식해설 수정] 가이드북 공식 답은 α=-8e^{-7}. 독립 재계산: ∫_{-7}^{e-2} te^{-t}dt = -(e-1)e^{2-e} - 6e^{7} 이므로 α=-6e^{7}. 공식 해설이 [-te^{-t}-e^{-t}]_{-7} 대입에서 e^{7} 을 e^{-7} 로, -7 을 7 로 처리한 오기로 보임.
  solutions:
  - id: S1-3-A
    audience: A
    method_no: 1
    key_idea: $h'(g(x))g'(x)=1$이므로 피적분함수는 $g(x)e^{-g(x)}g'(x)$; $t=g(x)$로 치환해 $\int_{-7}^{e-2}te^{-t}dt$를 부분적분.
    steps:
    - {id: 1-3a, content: '$\int_{-7}^{e-2}te^{-t}dt=[-te^{-t}-e^{-t}]_{-7}^{e-2}$', criteria: [1-3.M1, 1-3.A1]}
    hint_ladder:
    - $h(g(x))=x$를 미분해 보자.
    - $g(-1)$, $g(0)$을 계산하자.
  - id: S1-3-B
    audience: B
    source_flow: GB26.pdf p.77(인쇄 75)
    method_no: 1
    steps:
    - id: 1-3b-1
      content: |
        제시문 (라), (마)를 이용하면, $h(x)$는 $g(x)$의 역함수이므로 $h(g(x))=x$이므로 $h'(g(x))g'(x)=1$이다. 따라서
        $\displaystyle\int_{-1}^{0}\dfrac{g(x)}{e^{g(x)}\times h'(g(x))}dx=\int_{-1}^{0}\dfrac{g(x)}{e^{g(x)}}g'(x)\,dx=\int_{-7}^{e-2}te^{-t}\,dt$
      criteria: [1-3.M1]
    - id: 1-3b-2
      content: |
        $=[-te^{-t}-e^{-t}]_{-7}^{e-2}=-(e-1)e^{-e+2}-6e^{7}$이다. 따라서 $\alpha=-6e^{7}$이다. (공식 예시답안은 하한 대입 오기로 $-8e^{-7}$; 하한값 $-(-7)e^{7}-e^{7}=6e^{7}$)
      criteria: [1-3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 30
      evidence: |
        준식$=\displaystyle\int_{-1}^{0}\dfrac{g(x)}{e^{g(x)}\times h'(g(x))}dx=\int_{-1}^{0}\dfrac{g(x)}{e^{g(x)}}g'(x)\,dx=\int_{-7}^{e-2}te^{-t}\,dt$로 올바르게 치환했다.
      depends_on: []
      implied_ok: false
      steps: [1-3b-1]
    - id: 1-3.A1
      mark_type: A
      points: 10
      evidence: |
        $\alpha$의 값을 올바르게 구했다$\alpha=-6e^{7}$ (공식 예시답안의 $-8e^{-7}$은 대입 오기).
      depends_on: [1-3.M1]
      cao: true
      steps: [1-3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42618}
  misconceptions:
  - id: MC-CAL-42618
    outcome_code: '71'
    wrong_work: '$h\prime(g(x))$를 $\dfrac1{h\prime(x)}$ 또는 $g\prime(x)$로 바꾸어 피적분함수를 $\dfrac{g(x)}{e^{g(x)}g\prime(x)}$로 씀'
    detect_cue: 치환 후 $g'(x)$가 분모에 남음
    feedback: $h(g(x))=x$를 미분하면 $h'(g(x))g'(x)=1$, 즉 $\dfrac1{h'(g(x))}=g'(x)$입니다.
    remedy: [RL-3]

