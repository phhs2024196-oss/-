intent: |
  접선 조건으로 미분계수를 구해 미정계수를 정하고, 역함수가 존재하는 증가함수의 도함수가 0인 점에서 이계도함수도 0임을 이끌어 함수를 결정하며, 역함수의 미분과 치환적분·부분적분으로 정적분을 계산하는 능력을 본다. (가이드북에 출제 의도 별도 기재 없음 — 해설 흐름에서 요약)
key_idea: |
  (ⅰ)에서 $g(1)=1$, $g'(1)=0\Rightarrow f'(1)=1\Rightarrow a=1$. (ⅱ) 증가함수에서 $g'(1)=0$이면 $x=1$은 극값이 아니므로 $g''(1)=0$, 이로써 $b=-2$. 1-3은 $h'(g(x))g'(x)=1$로 피적분함수가 $g(x)e^{-g(x)}g'(x)$가 되어 $t=g(x)$ 치환.
stuck: |
  역함수 존재(단조증가)와 $g'(1)=0$에서 $g''(1)=0$을 끌어내는 논리(제시문 (다)의 대우), 그리고 1-3에서 $\dfrac1{h'(g(x))}=g'(x)$로 바꾸는 단계
