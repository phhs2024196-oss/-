  - '$I_n=\int_0^1\{F\prime(x)\}^ndx$'
  - '극한 $\lim n^\alpha I_n=\beta$'
  concepts:
  - '정적분의 대소(제시문 (나))'
  - '부분적분(제시문 (마)), 거듭제곱의 미분(제시문 (가))'
  - '수학적 귀납법(제시문 (다))'
  - '수열의 극한의 대소 관계(제시문 (라))'
  tools:
  - '$0\le\{F\prime\}^n\le\{F\prime\}^{n-1}\le1$'
  - '$f=\{F\prime\}^n$, $g=F$로 부분적분, 경계항 $[\{F\prime\}^nF]_0^1=0$'
  - '$-F(x)F\prime\prime(x)=1-\{F\prime(x)\}^2$'
  - '$I_kI_{k+1}=I_kI_{k-1}\cdot\dfrac{I_{k+1}}{I_{k-1}}$'
  - '$n^{\alpha-\frac12}\sqrt{-F(0)\cdot\frac n{n+1}}\le n^\alpha I_n\le n^{\alpha-\frac12}\sqrt{-F(0)}$'
  conditions:
  - '$I_0=1$, $I_1=F(1)-F(0)=-F(0)$'
  - '조건 (ⅰ)(ⅲ)에서 $F(0)\ne0$, 즉 $-F(0)>0$'
  - '특정 함수 $F$를 대입해 푼 경우 그 문항 0점'
  stimuli_used: ['(가)', '(나)', '(다)', '(라)', '(마)']
  subpart_links: '2-3은 2-2의 점화식, 2-4는 2-1의 부등식과 2-3의 곱 공식을 사용'

