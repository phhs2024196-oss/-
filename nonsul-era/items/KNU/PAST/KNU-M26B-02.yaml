- id: '2-4'
  stem: |
    $\displaystyle\lim_{n\to\infty}n^\alpha\int_0^1\{F'(x)\}^ndx=\beta$가 성립하는 실수 $\alpha,\beta$의 순서쌍 $(\alpha,\beta)$에 대하여 $\alpha$의 최댓값을 구하시오. (50점)
  points: 50
  depends_on: ['2-1', '2-3']
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-4-A
    audience: A
    method_no: 1
    key_idea: 2-1·2-3에서 $\dfrac{-F(0)}{n+1}\le I_n^2\le\dfrac{-F(0)}n$, 즉 $I_n\sim\sqrt{\dfrac{-F(0)}n}$; $\alpha=\tfrac12$에서 $\beta=\sqrt{-F(0)}$, $\alpha>\tfrac12$이면 발산.
    steps:
    - {id: 2-4a, content: '$n^{\alpha-\frac12}\sqrt{-F(0)\tfrac n{n+1}}\le n^\alpha I_n\le n^{\alpha-\frac12}\sqrt{-F(0)}$, 최댓값 $\tfrac12$', criteria: [2-4.M1, 2-4.R1, 2-4.R2]}
    hint_ladder:
    - 2-1의 부등식의 세 변에 2-3의 값을 넣어 보자.
  - id: S2-4-B
    audience: B
    source_flow: GB26.pdf pp.78–79(인쇄 76–77)
    method_no: 1
    steps:
    - id: 2-4b-1
      content: |
        【2-1】과 【2-3】의 결과를 이용하면, 모든 자연수 $n$에 대하여 부등식 $-\dfrac{F(0)}{n+1}\le\left(\displaystyle\int_0^1\{F'(x)\}^ndx\right)^2\le-\dfrac{F(0)}n$이 성립한다. 따라서
        $n^{\alpha-\frac12}\sqrt{\{-F(0)\}\cdot\dfrac n{n+1}}\le n^\alpha\displaystyle\int_0^1\{F'(x)\}^ndx\le n^{\alpha-\frac12}\sqrt{-F(0)}$.
        단, 조건 (ⅰ), (ⅲ)으로부터 $F(0)\ne0$이므로 $\sqrt{-F(0)}>0$이다.
      criteria: [2-4.M1]
    - id: 2-4b-2
      content: |
        제시문 (라)에 의해 $\alpha<\dfrac12$이면 $\beta=0$이고, $\alpha=\dfrac12$이면 $\beta=\sqrt{-F(0)}$이다.
      criteria: [2-4.R1]
    - id: 2-4b-3
      content: |
        $\alpha>\dfrac12$이면 $\displaystyle\lim_{n\to\infty}n^{\alpha-\frac12}=\infty$, $\displaystyle\lim_{n\to\infty}\sqrt{\{-F(0)\}\cdot\dfrac n{n+1}}=\sqrt{-F(0)}$, 그리고 $0\le\dfrac1{n^\alpha\int_0^1\{F'(x)\}^ndx}\le\dfrac1{n^{\alpha-\frac12}\sqrt{\{-F(0)\}\cdot\frac n{n+1}}}$이므로 만약 실수 $\beta$가 존재한다면 제시문 (라)에 의해 $\displaystyle\lim_{n\to\infty}\dfrac1{n^\alpha\int_0^1\{F'(x)\}^ndx}=0\Rightarrow\dfrac1\beta=0$이다. 따라서 실수 $\beta$는 존재하지 않는다. 그러므로 가능한 모든 실수 $\alpha,\beta$의 순서쌍 $(\alpha,\beta)$ 중에서 $\alpha$의 최댓값은 $\dfrac12$이다.
      criteria: [2-4.R2]
