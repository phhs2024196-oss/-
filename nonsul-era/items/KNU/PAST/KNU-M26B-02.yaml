intent: |
  미분방정식 꼴의 조건만으로(함수를 구하지 않고) 정적분의 대소, 부분적분 점화식, 수학적 귀납법, 조임 정리를 연결해 적분값의 수렴 속도를 판정하는 능력을 본다. (가이드북에 출제 의도 별도 기재 없음 — 해설 흐름에서 요약)
key_idea: |
  $I_n=\int_0^1\{F'(x)\}^ndx$라 하면 $0\le F'\le1$로 $I_n\le I_{n-1}$, 부분적분과 $-FF''=1-F'^2$로 $I_{n+1}=\dfrac{n}{n+1}I_{n-1}$, 그러면 $I_{n-1}I_n=\dfrac{-F(0)}n$이 귀납적으로 성립하고 $\dfrac{-F(0)}{n+1}\le I_n^2\le\dfrac{-F(0)}n$.
stuck: |
  2-2에서 $\{F'\}^{n+1}=\{F'\}^n\cdot F'$로 쪼개 $g=F$로 부분적분하는 발상, 그리고 2-4에서 2-1과 2-3을 결합해 $I_n^2$을 위·아래로 묶는 단계
idea_tags: [IDEA-INTEGRAL-POWER-MONOTONE, IDEA-REDUCTION-FORMULA-BY-PARTS, IDEA-PRODUCT-INVARIANT-INDUCTION, IDEA-SQUEEZE-GROWTH-RATE]
tags: [부분적분 점화식, 월리스 적분 구조, 수학적 귀납법, 조임 정리]
