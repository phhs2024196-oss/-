stimuli:
- label: (가)
  body: |
    자연수 $n$에 대하여, 함수 $f(x)=x^n$의 도함수는
    $$f'(x)=nx^{n-1}$$
- label: (나)
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(x)\le g(x)$일 때,
    $$\int_a^bf(x)\,dx\le\int_a^bg(x)\,dx$$
- label: (다)
  body: |
    자연수에 관한 명제 $P(n)$에 대해 다음 두 가지 성질이 성립하면, 명제 $P(n)$은 모든 자연수 $n$에 대하여 참이다.
    (1) $P(1)$은 참이다.
    (2) $P(n)$이 참이면 $P(n+1)$도 참이다.
- label: (라)
  body: |
    두 수열 $\{a_n\}$, $\{b_n\}$이 각각 수렴하고,
    $$\lim_{n\to\infty}a_n=\lim_{n\to\infty}b_n=\alpha$$
    일 때, 만약 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이면 수열 $\{c_n\}$은 수렴하고
    $$\lim_{n\to\infty}c_n=\alpha$$
- label: (마)
  body: |
    닫힌구간 $[a,b]$에서 연속인 도함수를 갖는 두 함수 $f(x)$, $g(x)$에 대하여
    $$\int_a^bf(x)g'(x)\,dx=[f(x)g(x)]_a^b-\int_a^bf'(x)g(x)\,dx$$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  실수 전체에서 연속인 이계도함수를 갖는 함수 $F(x)$가 다음 조건을 만족시킬 때, 물음에 답하시오.

  (ⅰ) $F(1)=F'(0)=0$
  (ⅱ) $0\le x\le1$이면 $0\le F'(x)\le1$이다.
  (ⅲ) 임의의 실수 $x$에 대해 $\{F'(x)\}^2-F''(x)F(x)=1$이다.

subparts:
- id: '2-1'
  stem: |
    모든 자연수 $n$에 대하여
    $$\left[\int_0^1\{F'(x)\}^ndx\right]^2\le\left[\int_0^1\{F'(x)\}^{n-1}dx\right]\left[\int_0^1\{F'(x)\}^ndx\right]\le\left[\int_0^1\{F'(x)\}^{n-1}dx\right]^2$$
    가 성립함을 보이시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-1-A
    audience: A
    method_no: 1
    key_idea: $0\le F'\le1$이면 $0\le\{F'\}^n\le\{F'\}^{n-1}$, 적분하면 $0\le I_n\le I_{n-1}$; 양변에 $I_n$, $I_{n-1}$을 곱한다.
    steps:
    - {id: 2-1a, content: '$0\le I_n\le I_{n-1}\Rightarrow I_n^2\le I_{n-1}I_n\le I_{n-1}^2$', criteria: [2-1.M1, 2-1.R1]}
    hint_ladder:
    - $0\le t\le1$이면 $t^n$과 $t^{n-1}$의 대소는?
  - id: S2-1-B
    audience: B
    source_flow: GB26.pdf p.78(인쇄 76)
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        $0\le x\le1$일 때 $0\le F'(x)\le1$이므로 모든 자연수 $n$에 대하여 $0\le\{F'(x)\}^n\le\{F'(x)\}^{n-1}\le1$이 성립한다.
      criteria: [2-1.M1]
    - id: 2-1b-2
      content: |
        이를 닫힌구간 $[0,1]$에서 적분하면(제시문 (나)) $0\le\displaystyle\int_0^1\{F'(x)\}^ndx\le\int_0^1\{F'(x)\}^{n-1}dx$이다. 이 부등식에 $\displaystyle\int_0^1\{F'(x)\}^ndx$와 $\displaystyle\int_0^1\{F'(x)\}^{n-1}dx$을 곱하면(둘 다 $0$ 이상) 문제의 부등식이 성립한다.
      criteria: [2-1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 5
      evidence: $0\le x\le1$일 때 모든 자연수 $n$에 대하여 $0\le\{F'(x)\}^n\le\{F'(x)\}^{n-1}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2-1b-1]
    - id: 2-1.R1
      mark_type: R
      points: 5
      evidence: |
        $0\le\displaystyle\int_0^1\{F'(x)\}^ndx\le\int_0^1\{F'(x)\}^{n-1}dx$을 구했다.
      depends_on: [2-1.M1]
      steps: [2-1b-2]
    deductions:
    - code: D2-1-1
      condition: 조건을 만족하는 특정 함수 $F$ 하나를 찾아 그 성질을 이용한 경우
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42619}
  misconceptions:
  - id: MC-CAL-42619
    outcome_code: '71'
    wrong_work: '$I_n\le I_{n-1}$만 쓰고 $I_n\ge0$을 확인하지 않은 채 양변에 곱함'
    detect_cue: $0\le I_n$ 언급 없음
    feedback: 부등식의 양변에 곱하는 수가 음이 아님을 먼저 보여야 부등호 방향이 유지됩니다.
    remedy: [RL-1]

- id: '2-2'
  stem: |
    제시문 (가)와 (마)를 이용하여, 모든 자연수 $n$에 대하여
    $$\int_0^1\{F'(x)\}^{n+1}dx=\dfrac{qn+r}{n+p}\int_0^1\{F'(x)\}^{n-1}dx$$
    가 성립하도록 하는 실수 $p,q,r$를 구하시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: expression, value: '(1, 1, 0)', equivalents: ['p=1, q=1, r=0'], tolerance: null}
  solutions:
  - id: S2-2-A
    audience: A
    method_no: 1
    key_idea: $I_{n+1}=\int\{F'\}^n\cdot F'dx$를 $g=F$로 부분적분, 경계항 $0$, $-FF''=1-F'^2$로 $I_{n+1}=n(I_{n-1}-I_{n+1})$.
    steps:
    - {id: 2-2a, content: '$I_{n+1}=\tfrac{n}{n+1}I_{n-1}$, $p=1$, $q=1$, $r=0$', criteria: [2-2.M1, 2-2.M2, 2-2.M3, 2-2.A1]}
    hint_ladder:
    - $\{F'\}^{n+1}=\{F'\}^n\cdot F'$로 보고 $F'$을 $g'$로 두자.
    - 조건 (ⅲ)을 $-F''F$에 대해 정리하자.
  - id: S2-2-B
    audience: B
    source_flow: GB26.pdf p.78(인쇄 76)
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        제시문 (마)에 $f(x)=\{F'(x)\}^n$, $g(x)=F(x)$라 하자. 그러면
        $\displaystyle\int_0^1\{F'(x)\}^n\cdot\{F'(x)\}\,dx=[\{F'(x)\}^nF(x)]_0^1-\int_0^1[n\{F'(x)\}^{n-1}F''(x)]\cdot\{F(x)\}\,dx$.
      criteria: [2-2.M1]
    - id: 2-2b-2
      content: |
        그리고 $F(1)=F'(0)=0\Rightarrow[\{F'(x)\}^nF(x)]_0^1=0$이다.
      criteria: [2-2.M2]
    - id: 2-2b-3
      content: |
        한편, $-F(x)F''(x)=1-\{F'(x)\}^2$을 이용하면
        $-\displaystyle\int_0^1[n\{F'(x)\}^{n-1}F''(x)]\cdot\{F(x)\}\,dx=n\int_0^1\{F'(x)\}^{n-1}[1-\{F'(x)\}^2]\,dx$.
      criteria: [2-2.M3]
    - id: 2-2b-4
      content: |
        이 식을 대입하여 정리하면 $(n+1)\displaystyle\int_0^1\{F'\}^{n+1}dx=n\int_0^1\{F'\}^{n-1}dx$이므로 $p=1$, $q=1$, $r=0$이다.
      criteria: [2-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 10
      evidence: 제시문 (마)에 $f(x)=\{F'(x)\}^n$, $g(x)=F(x)$를 사용했다.
      depends_on: []
      implied_ok: false
      steps: [2-2b-1]
    - id: 2-2.M2
      mark_type: M
      points: 5
      evidence: $F(1)=F'(0)=0$을 사용해 $[\{F'(x)\}^nF(x)]_0^1=0$을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2-2b-2]
    - id: 2-2.M3
      mark_type: M
      points: 10
      evidence: |
        $-F(x)F''(x)=1-\{F'(x)\}^2$을 사용해 $-\displaystyle\int_0^1[n\{F'(x)\}^{n-1}F''(x)]\cdot\{F(x)\}dx=n\int_0^1\{F'(x)\}^{n-1}[1-\{F'(x)\}^2]dx$를 보였다.
      depends_on: []
      implied_ok: false
      steps: [2-2b-3]
    - id: 2-2.A1
      mark_type: A
      points: 5
      evidence: 식을 정리하여 $p,q,r$($p=1$, $q=1$, $r=0$)을 맞게 구했다.
      depends_on: [2-2.M1, 2-2.M3]
      cao: true
      steps: [2-2b-4]
    deductions:
    - code: D2-2-1
      condition: 조건을 만족하는 특정 함수 $F$ 하나를 찾아 그 성질을 이용한 경우
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42620}
  misconceptions:
  - id: MC-CAL-42620
    outcome_code: '71'
    wrong_work: '$f=F\prime$, $g=\{F\prime\}^n$처럼 역할을 바꾸거나 경계항 $[\{F\prime\}^nF]_0^1$을 남겨 점화식을 얻지 못함'
    detect_cue: 경계항 처리 없음, 또는 $F''$이 소거되지 않음
    feedback: $F'$을 $g'$로 보면 $g=F$가 되어 조건 (ⅰ)로 경계항이 0이 되고, 조건 (ⅲ)로 $F''F$를 없앨 수 있습니다.
    remedy: [RL-2]

- id: '2-3'
  stem: |
    제시문 (다)를 이용하여, 모든 자연수 $n$에 대하여
    $$\left[\int_0^1\{F'(x)\}^{n-1}dx\right]\left[\int_0^1\{F'(x)\}^ndx\right]=\dfrac{bn+c}{n+a}\cdot F(0)$$
    가 성립하도록 하는 실수 $a,b,c$를 구하시오. (40점)
  points: 40
  depends_on: ['2-2']
  answer: {kind: expression, value: '(0, 0, -1)', equivalents: ['a=0, b=0, c=-1'], tolerance: null}
  solutions:
  - id: S2-3-A
    audience: A
    method_no: 1
    key_idea: $I_0I_1=-F(0)$, $I_kI_{k+1}=I_{k-1}I_k\cdot\dfrac{I_{k+1}}{I_{k-1}}=\dfrac{-F(0)}k\cdot\dfrac{k}{k+1}$.
    steps:
    - {id: 2-3a, content: '$I_{n-1}I_n=\dfrac{-F(0)}n$, $a=b=0$, $c=-1$', criteria: [2-3.B1, 2-3.R1]}
    hint_ladder:
    - $n=1$일 때 $I_0$, $I_1$을 직접 구하자.
    - 2-2의 비 $\dfrac{I_{k+1}}{I_{k-1}}$을 곱해 보자.
  - id: S2-3-B
    audience: B
    source_flow: GB26.pdf p.78(인쇄 76)
    method_no: 1
    steps:
    - id: 2-3b-1
      content: |
        $\displaystyle\int_0^1\{F'(x)\}^0dx=\int_0^11\,dx=1$이고 $\displaystyle\int_0^1\{F'(x)\}^1dx=F(1)-F(0)=-F(0)$이므로 $n=1$일 때 $\left[\displaystyle\int_0^1\{F'\}^0dx\right]\left[\int_0^1\{F'\}^1dx\right]=-F(0)=\dfrac{-F(0)}1$이 성립한다.
      criteria: [2-3.B1]
    - id: 2-3b-2
      content: |
        만약 $n=k$일 때 $\left[\displaystyle\int_0^1\{F'\}^{k-1}dx\right]\left[\int_0^1\{F'\}^kdx\right]=\dfrac{-F(0)}k$가 성립하면, $n=k+1$일 때는 【2-2】의 등식에 의해
        $\left[\displaystyle\int_0^1\{F'\}^kdx\right]\left[\int_0^1\{F'\}^{k+1}dx\right]=\left[\int_0^1\{F'\}^kdx\right]\left[\int_0^1\{F'\}^{k-1}dx\right]\cdot\dfrac{\int_0^1\{F'\}^{k+1}dx}{\int_0^1\{F'\}^{k-1}dx}=\dfrac{-F(0)}k\cdot\dfrac{k}{k+1}=\dfrac{-F(0)}{k+1}$
        이므로 제시문 (다)에 의해 모든 자연수 $n$에 대해 위 등식이 성립한다. 따라서 $a=b=0$이고 $c=-1$이다.
      criteria: [2-3.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-3.B1
      mark_type: B
      points: 10
      evidence: |
        $\left[\displaystyle\int_0^1\{F'(x)\}^0dx\right]\left[\int_0^1\{F'(x)\}^1dx\right]=-F(0)$을 구했다.
      steps: [2-3b-1]
    - id: 2-3.R1
      mark_type: R
      points: 30
      evidence: |
        $\left[\displaystyle\int_0^1\{F'(x)\}^{n-1}dx\right]\left[\int_0^1\{F'(x)\}^ndx\right]=\dfrac{-F(0)}n$을 유도하여 $a,b,c$를 찾았다(제시문 (다)를 사용하지 않으면 점수 부여하지 않음).
      depends_on: []
      steps: [2-3b-2]
    deductions:
    - code: D2-3-1
      condition: 제시문 (다)(수학적 귀납법)를 사용하지 않음 — 2-3.R1 점수 없음
      effect: minus
      value: 30
