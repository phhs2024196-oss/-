  - '$f(x)=e^x$, $g(x)=\dfrac{c^2}{2}\left(1-\dfrac{1}{x^2}\right)-\ln x$, $h(x)=\dfrac{c^2}{x}+x+(f\circ g)(x)$'
  concepts:
  - '도함수의 부호와 증가·감소'
  - '사잇값 정리'
  - '합성함수의 미분법'
  - '지수·로그함수의 미분'
  - '실근의 존재와 유일성'
  tools:
  - '보조함수 $l(x)=x\{(x-1)^2+1\}e^{-\frac{x^2-1}{2}}$ (부등식을 양수로 나누어 비교)'
  - '증감표'
  - '$h(1)>h(c)\iff c\{(c-1)^2+1\}>e^{\frac{c^2-1}{2}}$ 로 【1-1】에 귀착'
  - '$h''(x)=g''(x)\{f(g(x))-x\}$ 인수분해'
  - '자연로그를 취해 $f(g(x))-x$의 부호를 $g(x)-\ln x$의 부호로 바꾸기'
