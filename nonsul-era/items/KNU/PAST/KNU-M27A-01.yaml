stimuli:
- label: (가)
  body: |
    함수 $f(x)$가 어떤 구간에 속하는 임의의 두 실수 $x_1,x_2$에 대하여
    (1) $x_1<x_2$일 때 $f(x_1)<f(x_2)$이면 $f(x)$는 이 구간에서 증가한다고 하며,
    (2) $x_1<x_2$일 때 $f(x_1)>f(x_2)$이면 $f(x)$는 이 구간에서 감소한다고 한다.
- label: (나)
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 이 구간의 모든 $x$에서
    (1) $f'(x)>0$이면 $f(x)$는 이 구간에서 증가한다.
    (2) $f'(x)<0$이면 $f(x)$는 이 구간에서 감소한다.
- label: (다)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면, $f(a)$와 $f(b)$ 사이의 임의의 실수 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  함수 $p(x)=x\{(x-1)^2+1\}-e^{\frac{x^2-1}{2}}$에 대하여 방정식 $p(x)=0$의 $\sqrt2$보다 큰 실근이 오직 하나 존재한다. 이 실근을 $\alpha$라 하자.

  다음 물음에 답하시오.

subparts:
- id: 1-1-1
  stem: |
    【1-1】
    (1) $p(1)$의 값을 찾고, $k_1<x<\alpha$일 때 부등식 $p(x)>0$을 만족시키는 양의 실수 $k_1$의 최솟값을 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: value, value: '(0, 1)', equivalents: ['p(1)=0, k_1의 최솟값 1'], tolerance: null}   # (p(1), k_1 최솟값)
  solutions:
  - id: S111-A
    audience: A
    method_no: 1
    key_idea: $p(x)>0\iff l(x)=x\{(x-1)^2+1\}e^{-\frac{x^2-1}{2}}>1$, $l$은 $(0,\sqrt2)$에서 증가, $(\sqrt2,\infty)$에서 감소, $l(1)=l(\alpha)=1$.
    steps:
    - {id: 111a, content: '$p(1)=0$, $l(x)>1\iff 1<x<\alpha$이므로 $k_1$의 최솟값은 $1$', criteria: [1-1-1.B1, 1-1-1.R1, 1-1-1.A1]}
    hint_ladder:
    - $p(x)>0$을 그대로 미분하면 지수함수가 남는다. 양변을 $e^{\frac{x^2-1}{2}}$로 나누어 보자.
    - 나눈 함수의 도함수를 인수분해하면 어떤 점에서 부호가 바뀌는가?
  - id: S111-B
    audience: B
    source_flow: GB27.pdf p.68(인쇄 p.66)
    method_no: 1
    steps:
    - id: 111b-1
      content: |
        $p(x)$에 $x=1$을 대입하면 $p(1)=1\cdot1-e^0=0$이다.
      criteria: [1-1-1.B1]
    - id: 111b-2
      content: |
        $l(x)=\dfrac{x\{(x-1)^2+1\}}{e^{\frac{x^2-1}{2}}}$라 하면 $e^{\frac{x^2-1}{2}}>0$이므로 $p(x)>0\iff l(x)>1$이다. $p(1)=0$이므로 $l(1)=1$, $\alpha>\sqrt2$는 $p(\alpha)=0$이므로 $l(\alpha)=1$이다.
      criteria: [1-1-1.R1]
    - id: 111b-3
      content: |
        $l'(x)=\dfrac{-x^4+2x^3+x^2-4x+2}{e^{\frac{x^2-1}{2}}}=\dfrac{(x-1)^2(2-x^2)}{e^{\frac{x^2-1}{2}}}$이므로 $x>0$에서 $l$은 $(0,\sqrt2]$에서 증가, $[\sqrt2,\infty)$에서 감소한다(제시문 (나)). 증감표: $l(0)=0\nearrow l(1)=1\nearrow l(\sqrt2)\searrow l(\alpha)=1\searrow$.
      criteria: [1-1-1.R1]
    - id: 111b-4
      content: |
        따라서 $1<x<\alpha$에서 $l(x)>1$, 즉 $p(x)>0$이고 $0<x\le1$에서는 $l(x)\le1$이다. 그러므로 $k_1<x<\alpha$일 때 $p(x)>0$이 되게 하는 양의 실수 $k_1$의 최솟값은 $1$이다.
      criteria: [1-1-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1-1.B1
      mark_type: B
      points: 5
      evidence: |
        $p(1)=0$을 찾았다.
      steps: [111b-1]
    - id: 1-1-1.R1
      mark_type: R
      points: 10
      evidence: |
        $1<x<\alpha$일 때 부등식 $p(x)>0$이 성립함을 (보조함수의 증감 등으로) 보였다.
      steps: [111b-2, 111b-3]
    - id: 1-1-1.A1
      mark_type: A
      points: 5
      evidence: |
        $k_1<x<\alpha$일 때 $p(x)>0$을 만족시키는 양의 실수 $k_1$의 최솟값이 $1$임을 찾았다.
      depends_on: [1-1-1.R1]
      steps: [111b-4]
    deductions:
    - code: D111-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42701}
  - {code: '72', misconception: MC-CAL-42702}
  misconceptions:
  - id: MC-CAL-42701
    outcome_code: '71'
    wrong_work: |
      $p'(x)=3x^2-4x+2-xe^{\frac{x^2-1}{2}}$을 구한 뒤 부호를 판정하지 못하고 멈춤
    detect_cue: 지수항이 남은 도함수에서 풀이가 끊김, 보조함수 $l(x)$가 없음
    feedback: 양수 $e^{\frac{x^2-1}{2}}$로 나눈 함수를 미분하면 다항식 인수만 남아 부호를 읽을 수 있습니다.
    remedy: [RL-1]
  - id: MC-CAL-42702
    outcome_code: '72'
    wrong_work: |
      $p(1)=0$인데도 $k_1$의 최솟값을 $1$보다 작은 값(예 $0$)으로 답함
    detect_cue: $x=1$에서 $p(x)>0$이 성립하지 않음을 확인하지 않음
    feedback: 구간 $(k_1,\alpha)$가 $x=1$을 포함하면 $p(1)=0$이라 부등식이 깨집니다. 등호가 되는 점을 확인하세요.
    remedy: [RL-2]
- id: 1-1-2
  stem: |
    (2) $x>\alpha$일 때 부등식 $p(x)<0$이 성립함을 보이시오. (10점)
  points: 10
  depends_on: [1-1-1]
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S112-A
    audience: A
    method_no: 1
    key_idea: $l$은 $x>\sqrt2$에서 감소하고 $l(\alpha)=1$이므로 $x>\alpha$에서 $l(x)<1$.
    steps:
    - {id: 112a, content: '$x>\alpha>\sqrt2\Rightarrow l(x)<l(\alpha)=1\Rightarrow p(x)<0$', criteria: [1-1-2.R1]}
    hint_ladder:
    - (1)의 증감표에서 $\alpha$ 오른쪽은 증가인가 감소인가?
  - id: S112-B
    audience: B
    source_flow: GB27.pdf p.68(인쇄 p.66)
    method_no: 1
    steps:
    - id: 112b-1
      content: |
        $l(\alpha)=1$이고 (1)의 증감표에 의하여 $l$은 $[\sqrt2,\infty)$에서 감소하므로 $x>\alpha$일 때 $l(x)<l(\alpha)=1$이다. 따라서 $x>\alpha$일 때 $p(x)=e^{\frac{x^2-1}{2}}\{l(x)-1\}<0$이 성립한다.
      criteria: [1-1-2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1-2.R1
      mark_type: R
      points: 10
      evidence: |
        $x>\alpha$일 때 부등식 $p(x)<0$이 성립함을 ($l$의 감소와 $l(\alpha)=1$ 등의 근거로) 보였다.
      steps: [112b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42701}
  misconceptions:
  - id: MC-CAL-42701
    outcome_code: '71'
    wrong_work: |
      $x\to\infty$일 때 $p(x)\to-\infty$라는 것만으로 $x>\alpha$ 전체에서 $p(x)<0$이라 결론
    detect_cue: 극한만 있고 $(\alpha,\infty)$에서의 단조성·부호 근거가 없음
    feedback: 끝에서 음수라는 것만으로는 중간에 다시 양수가 되지 않는다는 보장이 없습니다. 감소성을 근거로 쓰세요.
    remedy: [RL-1]
- id: 1-2-1
  stem: |
    【1-2】실수 전체에서 미분가능한 함수 $f(x)=e^x$와 열린구간 $(0,\infty)$에서 미분가능한 함수 $g(x)=\dfrac{c^2}{2}\left(1-\dfrac{1}{x^2}\right)-\ln x$에 대하여 함수 $h(x)$를
    $$h(x)=\dfrac{c^2}{x}+x+(f\circ g)(x)$$
    라 하자. (단, $c$는 양의 실수이다.)

    (1) $k_2<c<\alpha$일 때 부등식 $h(1)>h(c)$를 만족시키는 양의 실수 $k_2$의 최솟값을 구하시오. (20점)
  points: 20
  depends_on: [1-1-1]
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S121-A
    audience: A
    method_no: 1
    key_idea: $h(1)>h(c)\iff c\{(c-1)^2+1\}>e^{\frac{c^2-1}{2}}\iff p(c)>0$이므로 【1-1】로 $1<c<\alpha$.
    steps:
    - {id: 121a, content: '$h(1)=c^2+2$, $h(c)=2c+\tfrac1ce^{\frac{c^2-1}{2}}$, $h(1)>h(c)\iff p(c)>0\iff1<c<\alpha$ ⇒ 최솟값 $1$', criteria: [1-2-1.R1, 1-2-1.A1]}
    hint_ladder:
    - $g(1)$과 $g(c)$를 먼저 계산해 보자.
    - $h(1)>h(c)$를 정리하면 【1-1】의 어떤 함수가 나오는가?
  - id: S121-B
    audience: B
    source_flow: GB27.pdf p.68(인쇄 p.66)
    method_no: 1
    steps:
    - id: 121b-1
      content: |
        $g(1)=0$이므로 $h(1)=c^2+1+e^0=c^2+2$이고, $h(c)=c+c+(f\circ g)(c)$이므로 $h(1)>h(c)$는 $c^2+2>2c+(f\circ g)(c)$와 같다.
      criteria: [1-2-1.R1]
    - id: 121b-2
      content: |
        $g(c)=\dfrac{c^2}{2}\left(1-\dfrac{1}{c^2}\right)-\ln c=\dfrac{c^2-1}{2}-\ln c$이므로 $(f\circ g)(c)=e^{\frac{c^2-1}{2}-\ln c}=e^{\frac{c^2-1}{2}}\cdot\dfrac1c$이다. 위 부등식의 양변에 $c>0$을 곱하면 $c\{(c-1)^2+1\}>e^{\frac{c^2-1}{2}}$, 즉 $p(c)>0$이다.
      criteria: [1-2-1.R1]
    - id: 121b-3
      content: |
        【1-1】에 의해 양의 실수 $c$가 $p(c)>0$을 만족할 필요충분조건은 $1<c<\alpha$이므로, $k_2<c<\alpha$일 때 $h(1)>h(c)$를 만족시키는 양의 실수 $k_2$의 최솟값은 $1$이다.
      criteria: [1-2-1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2-1.R1
      mark_type: R
      points: 15
      evidence: |
        $1<c<\alpha$일 때 $h(1)>h(c)$가 성립함을 ($h(1)>h(c)\iff p(c)>0$으로 바꾸어) 보였다.
      steps: [121b-1, 121b-2]
    - id: 1-2-1.A1
      mark_type: A
      points: 5
      evidence: |
        $k_2<c<\alpha$일 때 $h(1)>h(c)$를 만족시키는 양의 실수 $k_2$의 최솟값이 $1$임을 찾았다.
      depends_on: [1-2-1.R1]
      steps: [121b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42702}
  misconceptions:
  - id: MC-CAL-42702
    outcome_code: '71'
    wrong_work: |
      $p(c)>0$으로 바꾼 뒤 $p(c)>0$의 해를 $c>1$ 전체 또는 $0<c<\alpha$로 씀
    detect_cue: 【1-1】의 증감표(경계 $1$과 $\alpha$)를 인용하지 않음
    feedback: 【1-1】에서 $p(x)>0$은 정확히 $1<x<\alpha$에서 성립합니다. 두 경계를 모두 확인하세요.
    remedy: [RL-2]
- id: 1-2-2
  stem: |
    (2) $\sqrt2<c<\alpha$일 때 방정식 $h(1)=h(x)$는 열린구간 $(1,c)$에서 오직 하나의 실근을 가짐을 보이시오. (70점)
  points: 70
  depends_on: [1-2-1]
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S122-A
    audience: A
    method_no: 1
    key_idea: $h'(x)=g'(x)\{f(g(x))-x\}$, $g'$은 $x=c$에서, $f(g(x))-x$는 $x=q$에서 부호가 바뀐다. (1)과의 모순으로 $q<c$이고 $h$는 $(1,q)$ 증가·$(q,c)$ 감소.
    steps:
    - {id: 122a, content: '$h''=g''(f\circ g-x)$, $g''>0\ (x<c)$, $f(g(x))-x>0\iff 1<x<q$, $q<c$, 사잇값 정리 + 감소 ⇒ 유일', criteria: [1-2-2.R1, 1-2-2.R2, 1-2-2.R3, 1-2-2.R4, 1-2-2.R5, 1-2-2.R6]}
    hint_ladder:
    - $h'(x)$를 계산하면 공통인수 $g'(x)$가 보인다.
    - $f(g(x))-x$의 부호는 자연로그를 취하면 어떤 함수의 부호와 같은가?
    - $c\le q$라면 $(1,c)$에서 $h$는 어떻게 되는가? (1)과 비교하라.
  - id: S122-B
    audience: B
    source_flow: GB27.pdf p.68~69(인쇄 p.66~67)
    method_no: 1
    steps:
    - id: 122b-1
      content: |
        $g'(x)=\dfrac{c^2}{x^3}-\dfrac1x$이므로 $h'(x)=-\dfrac{c^2}{x^2}+1+f'(g(x))g'(x)=g'(x)\{f(g(x))-x\}$이다.
      criteria: [1-2-2.R1]
    - id: 122b-2
      content: |
        $g'(x)=\dfrac{c^2-x^2}{x^3}$이므로 $x>0$일 때 $0<x<c$이면 $g'(x)>0$, $x>c$이면 $g'(x)<0$이다.
      criteria: [1-2-2.R2]
    - id: 122b-3
      content: |
        $f(x)$는 지수함수이므로 자연로그를 취하면 $f(g(x))-x>0\iff g(x)-\ln x>0$, $f(g(x))-x<0\iff g(x)-\ln x<0$, $f(g(x))-x=0\iff g(x)-\ln x=0$이다. $\{g(x)-\ln x\}'=\dfrac{c^2}{x^3}-\dfrac2x$이므로 $g(x)-\ln x$는 $\left(0,\dfrac{c}{\sqrt2}\right]$에서 증가, $\left[\dfrac{c}{\sqrt2},\infty\right)$에서 감소한다.
      criteria: [1-2-2.R3]
    - id: 122b-4
      content: |
        $\sqrt2<c$이므로 $1<\dfrac{c}{\sqrt2}$이고, $g(1)-\ln1=0$, $\displaystyle\lim_{x\to\infty}(g(x)-\ln x)=-\infty$이다. 따라서 사잇값 정리와 위의 증감표에 의해 열린구간 $(1,\infty)$에서 방정식 $g(x)-\ln x=0$은 유일한 실근 $q$를 갖는다.
      criteria: [1-2-2.R3]
    - id: 122b-5
      content: |
        그러므로 $1<x<q$일 때 $f(g(x))-x>0$, $x>q$일 때 $f(g(x))-x<0$이다.
      criteria: [1-2-2.R4]
    - id: 122b-6
      content: |
        만약 $c\le q$라면 구간 $(1,c)$에서 $g'(x)>0$, $f(g(x))-x>0$이므로 $h(x)$는 증가하고 $h(1)<h(c)$가 성립하는데, 이는 【1-2】(1)($1<c<\alpha$이면 $h(1)>h(c)$)에 모순이다. 따라서 $q<c$이다.
      criteria: [1-2-2.R5]
    - id: 122b-7
      content: |
        열린구간 $(1,q)$에서 $h'(x)>0$이므로 $h$는 증가하고, 반닫힌구간 $(1,q]$에서 방정식 $h(1)=h(x)$의 근은 존재하지 않는다. 한편 $h(q)>h(1)$이고 【1-2】(1)에 의해 $h(c)<h(1)$이므로 사잇값 정리에 의해 방정식 $h(x)=h(1)$의 근이 열린구간 $(q,c)$에 적어도 하나 존재한다. 이 구간에서 $g'(x)>0$, $f(g(x))-x<0$이므로 $h$는 감소하고, 따라서 근은 $(q,c)$에서 오직 하나만 존재한다. 즉 방정식 $h(1)=h(x)$는 $(1,c)$에서 오직 하나의 실근을 갖는다. ■
      criteria: [1-2-2.R6]
