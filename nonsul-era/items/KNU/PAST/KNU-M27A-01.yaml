intent: |
  보조함수 $l(x)=\dfrac{p(x)}{e^{\frac{x^2-1}{2}}}+1$ 꼴로 부등식을 바꾸어 증감표로 부호를 판정하고, 합성함수의 미분과 사잇값 정리로 방정식의 실근이 오직 하나 존재함을 논증하는 능력을 본다.
key_idea: |
  $p(x)>0\iff l(x)=\dfrac{x\{(x-1)^2+1\}}{e^{\frac{x^2-1}{2}}}>1$이고 $l'(x)=\dfrac{(x-1)^2(2-x^2)}{e^{\frac{x^2-1}{2}}}$이므로 $l$은 $\sqrt2$까지 증가 후 감소, $l(1)=l(\alpha)=1$. 【1-2】는 $h'(x)=g'(x)\{f(g(x))-x\}$로 인수분해하고 $f(g(x))-x$의 부호를 $g(x)-\ln x$로 바꾼다.
stuck: |
  $p(x)>0$을 직접 미분하지 않고 지수함수로 나눈 보조함수 $l(x)$를 세우는 단계, 그리고 $h'(x)$를 $g'(x)(f(g(x))-x)$로 묶어 $q<c$를 【1-2】(1)과의 모순으로 끌어내는 단계
