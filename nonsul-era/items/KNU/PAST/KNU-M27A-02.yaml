intent: |
  접선과 곡선 사이의 차를 적분 꼴(테일러 나머지)로 나타내고 정적분의 대소 관계로 양쪽을 평가하여, 음함수로 정의된 수열 $t_n$의 극한과 관련 극한값을 조임 정리로 구하는 능력을 본다.
key_idea: |
  $e^x-L(x)=\displaystyle\int_x^t(s-x)e^sds$에서 $1\le e^s\le e^t$로 $\dfrac{(t-x)^2}{2}\le e^x-L(x)\le\dfrac{e^t(t-x)^2}{2}$를 얻고, 이를 적분해 $\dfrac{t^3}{6}\le S(t)\le e^t\dfrac{t^3}{6}$, $\dfrac{t^4}{24}\le T(t)\le e^t\dfrac{t^4}{24}$로 조인다.
stuck: |
  $e^x-L(x)$를 $s$에 관한 적분으로 보고 피적분함수의 $e^s$만 상수로 바꿔 끼우는 발상, 그리고 $nt_n^3\to6$을 $6e^{-t_n}\le nt_n^3\le6$으로 끌어내는 단계
idea_tags: [IDEA-TAYLOR-REMAINDER-INTEGRAL, IDEA-SQUEEZE-BY-INTEGRAL-BOUNDS, IDEA-IMPLICIT-SEQUENCE-LIMIT]
tags: [접선과 곡선의 차, 정적분의 대소, 조임 정리, 음함수 수열]
