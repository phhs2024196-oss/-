intent: |
  증가함수의 역함수 존재를 일대일대응으로 논증하고, 역함수 그래프의 대칭과 정적분의 넓이 관계로 미정계수를 정하며, 적분의 평균값 정리와 조임으로 근의 수열의 극한을 구하는 능력을 본다.
key_idea: |
  $g'(1)=2\Rightarrow f(1)=f^{-1}(1)$, 증가함수이므로 $f(1)=1$. $\displaystyle\int_0^1f^{-1}=1-\int_0^1f$로 $g(1)=1+2\int_0^1f$를 얻고, $f^{-1}(x)\ge x\ge f(x)$ $(0\le x\le1)$로 $g'(x)\ge2$를 이용해 $\dfrac1n=d_n\{2-f(t_n)+f^{-1}(t_n)\}$, $t_n\to0$.
stuck: |
  $g'(1)=2$에서 $f(1)=f^{-1}(1)$, 즉 $f(1)=1$을 끌어내는 단계와, $\displaystyle\int_0^1f^{-1}(t)dt$를 그래프의 대칭(넓이)으로 바꾸는 단계
