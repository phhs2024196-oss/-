stimuli:
- label: (가)
  body: |
    함수 $f:X\to Y$가 일대일대응일 때
    (a) 역함수 $f^{-1}:Y\to X$가 존재한다.
    (b) $y=f(x)\iff x=f^{-1}(y)$
- label: (나)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면, $f(a)$와 $f(b)$ 사이의 임의의 실수 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: (다)
  body: |
    닫힌구간 $[a,b]$를 포함하는 열린구간에서 미분가능한 두 함수 $f(x),g(x)$에 대하여 $f'(x),g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)g'(x)dx=[f(x)g(x)]_a^b-\int_a^bf'(x)g(x)dx$$
    이다.
- label: (라)
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 이 구간의 모든 $x$에서
    (1) $f'(x)>0$이면 $f(x)$는 이 구간에서 증가한다.
    (2) $f'(x)<0$이면 $f(x)$는 이 구간에서 감소한다.
- label: (마)
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능할 때,
    $$f'(c)=\frac{f(b)-f(a)}{b-a}$$
    인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.

stem: |
  ※ 모든 문항에서 풀이과정을 반드시 기술하시오.

  두 양수 $a,b$에 대하여 함수 $f(x)=(ax^2+bx)e^x$는 구간 $[0,\infty)$에서 정의되어 있다.

  다음 물음에 답하시오.

subparts:
- id: 1-1
  stem: |
    【1-1】함수 $f$의 역함수 $f^{-1}$이 구간 $[0,\infty)$에서 정의되어 있음을 보이시오. (30점)
  points: 30
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $f'>0$ ($x>0$)이라 일대일, $f(0)=0$·$f\to\infty$와 사잇값 정리로 치역이 $[0,\infty)$.
    steps:
    - {id: 11a, content: '$f''(x)=\{ax^2+(2a+b)x+b\}e^x>0$, $f(0)=0$, $\lim f=\infty$ ⇒ $[0,\infty)\to[0,\infty)$ 일대일대응', criteria: [1-1.R1, 1-1.B1, 1-1.R2]}
    hint_ladder:
    - 역함수가 $[0,\infty)$에서 정의되려면 $f$의 치역이 무엇이어야 하는가?
  - id: S11-B
    audience: B
    source_flow: GB27.pdf p.76(인쇄 p.74)
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $f'(x)=\{ax^2+(2a+b)x+b\}e^x$이고, $ax^2+(2a+b)x+b=0$의 근은 $x=\dfrac{-(2a+b)\pm\sqrt{4a^2+b^2}}{2a}<0$이므로 $x>0$에 대해 $f'(x)>0$이다. 따라서 $f(x)$는 증가함수이므로 일대일이다.
      criteria: [1-1.R1]
    - id: 11b-2
      content: |
        또한 $f(0)=0$이고 $\displaystyle\lim_{x\to\infty}f(x)=\infty$이다.
      criteria: [1-1.B1]
    - id: 11b-3
      content: |
        $f(x)$가 증가함수이므로 사잇값 정리에 의해 $f(x)$는 $[0,\infty)$에서 $[0,\infty)$로 가는 일대일대응이다. 따라서 $f$의 역함수 $f^{-1}$이 구간 $[0,\infty)$에서 정의되어 있다. ■
      criteria: [1-1.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.R1
      mark_type: R
      points: 15
      evidence: |
        $f(x)$가 증가함수임을 보였다.
      steps: [11b-1]
    - id: 1-1.B1
      mark_type: B
      points: 5
      evidence: |
        $f(0)=0$이고 $\displaystyle\lim_{x\to\infty}f(x)=\infty$임을 확인했다.
      steps: [11b-2]
    - id: 1-1.R2
      mark_type: R
      points: 10
      evidence: |
        $f:[0,\infty)\to[0,\infty)$ 위로의 함수(일대일대응)임을 보였다.
      depends_on: [1-1.R1, 1-1.B1]
      steps: [11b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42708}
  misconceptions:
  - id: MC-CAL-42708
    outcome_code: '71'
    wrong_work: |
      $f'(x)>0$이므로 일대일, 따라서 역함수가 $[0,\infty)$에서 정의된다고 바로 결론
    detect_cue: $f(0)=0$, $\lim f=\infty$, 사잇값 정리 언급이 없음
    feedback: 역함수의 정의역은 $f$의 치역입니다. 치역이 $[0,\infty)$ 전체임을 보여야 합니다.
    remedy: [RL-1]
- id: 1-2
  stem: |
    구간 $[0,\infty)$에서 정의된 함수
    $$g(x)=\int_0^x\{2-f^{-1}(t)+f(t)\}dt$$
    에 대해 $g'(1)=2$이고 $g(1)=\dfrac53$이다.

    【1-2】$a,b$의 값을 각각 구하시오. (20점)
  points: 20
  depends_on: [1-1]
  answer: {kind: value, value: '(1/(3*E), 2/(3*E))', equivalents: ['a=1/(3e), b=2/(3e)'], tolerance: null}   # (a, b)
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: $f(1)=f^{-1}(1)\Rightarrow f(1)=1$, $\int_0^1f^{-1}=1-\int_0^1f$로 $g(1)=1+2\int_0^1f=1+2\{a(e-2)+b\}$.
    steps:
    - {id: 12a, content: '$(a+b)e=1$, $1+2a(e-2)+2b=\tfrac53$ ⇒ $a=\tfrac1{3e}$, $b=\tfrac2{3e}$', criteria: [1-2.R1, 1-2.A1]}
    hint_ladder:
    - $g'(1)=2$를 $f$, $f^{-1}$로 써 보자.
    - 증가함수에서 $f(1)=f^{-1}(1)$이면 $f(1)$은?
    - $\int_0^1f^{-1}(t)dt$는 그래프에서 어떤 넓이인가?
  - id: S12-B
    audience: B
    source_flow: GB27.pdf p.76(인쇄 p.74)
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $g'(1)=2-f^{-1}(1)+f(1)=2$이므로 $f(1)=f^{-1}(1)$이다. 함수 $y=f(x)$의 그래프와 함수 $y=f^{-1}(x)$의 그래프는 직선 $y=x$에 대하여 대칭이고, $f(x)$가 증가함수이고 $f(0)=0$, $f(1)=1$이므로 정적분과 넓이의 관계에 의하여
        $$g(1)=\int_0^1\{2-f^{-1}(t)+f(t)\}dt=2-\left(1-\int_0^1f(t)dt\right)+\int_0^1f(t)dt=1+2\int_0^1f(t)dt$$
      criteria: [1-2.R1]
    - id: 12b-2
      content: |
        $\displaystyle\int_0^1f(t)dt=a\int_0^1t^2e^tdt+b\int_0^1te^tdt$에서 부분적분으로 $\displaystyle\int_0^1te^tdt=[e^tt]_0^1-\int_0^1e^tdt=[e^t(t-1)]_0^1=1$이고 $\displaystyle\int_0^1t^2e^tdt=[e^tt^2]_0^1-2\int_0^1te^tdt=[e^t(t^2-2t+2)]_0^1=e-2$이므로 $\displaystyle\int_0^1f(t)dt=a(e-2)+b$이다.
      criteria: [1-2.A1]
    - id: 12b-3
      content: |
        $g(1)=1+2ae-4a+2b=\dfrac53$이고 $f(1)=f^{-1}(1)$로부터 $(a+b)e=1$이다. 그래서 $a=\dfrac{1}{3e}$이고 $b=\dfrac{2}{3e}$이다.
      criteria: [1-2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.R1
      mark_type: R
      points: 10
      evidence: |
        $y=f^{-1}(x)$의 그래프가 직선 $y=x$에 대하여 대칭임을 이용해 $\displaystyle\int_0^1f^{-1}(t)dt=1-\int_0^1f(t)dt$ (또는 $f(1)=1$)를 보였다.
      steps: [12b-1]
    - id: 1-2.A1
      mark_type: A
      points: 10
      evidence: |
        $a=\dfrac{1}{3e}$이고 $b=\dfrac{2}{3e}$를 구했다.
      depends_on: [1-2.R1]
      cao: true
      steps: [12b-2, 12b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42709}
  misconceptions:
  - id: MC-CAL-42709
    outcome_code: '71'
    wrong_work: |
      $f^{-1}(x)$의 식을 직접 구하려다 막히거나, $\displaystyle\int_0^1f^{-1}(t)dt=\int_0^1\dfrac{1}{f(t)}dt$로 잘못 바꿈
    detect_cue: 역함수를 역수로 취급하거나 넓이 대칭 논리가 없음
    feedback: 역함수의 그래프는 $y=x$ 대칭이므로 $\int_0^1f^{-1}$은 단위정사각형에서 $\int_0^1f$를 뺀 넓이입니다($f(0)=0$, $f(1)=1$일 때).
    remedy: [RL-2]
- id: 1-3
  stem: |
    【1-3】구간 $[0,1]$에서 $f^{-1}(x)-f(x)\ge0$임을 보이시오. (30점)
  points: 30
  depends_on: [1-2]
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: $x-f(x)\ge0\iff3-(x+2)e^{x-1}\ge0$ (감소, $x=1$에서 0), 대칭으로 $f^{-1}(x)\ge x$.
    steps:
    - {id: 13a, content: '$x\ge f(x)$ on $[0,1]$ ⇒ $f^{-1}(x)\ge x\ge f(x)$', criteria: [1-3.R1, 1-3.R2]}
    hint_ladder:
    - 직선 $y=x$와 $f$를 먼저 비교해 보자.
  - id: S13-B
    audience: B
    source_flow: GB27.pdf p.76(인쇄 p.74)
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $x-f(x)$를 고려하자. $x-f(x)=x-\dfrac{(x^2+2x)e^x}{3e}\ge0$은 $3-(x+2)e^{x-1}\ge0$과 동치이다. $h(x)=3-(x+2)e^{x-1}$이라 하면 구간 $[0,1]$에서 $h'(x)=-(x+3)e^{x-1}<0$이고 $h(1)=0$이므로 $h(x)\ge0$이다. 따라서 $[0,1]$에서 $x-f(x)\ge0$이다.
      criteria: [1-3.R1]
    - id: 13b-2
      content: |
        $f(0)=0$, $f(1)=1$이기 때문에 $x-f(x)\ge0$이고 $y=f^{-1}(x)$의 그래프는 직선 $y=x$에 대하여 대칭이기 때문에 $f^{-1}(x)-f(x)\ge x-f(x)\ge0$이다. ■
      criteria: [1-3.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.R1
      mark_type: R
      points: 20
      evidence: |
        $[0,1]$에서 $t-f(t)\ge0$임을 보였다.
      steps: [13b-1]
    - id: 1-3.R2
      mark_type: R
      points: 10
      evidence: |
        $f^{-1}(t)-f(t)\ge0$임을 (대칭 또는 $f^{-1}(t)\ge t$로) 보였다.
      depends_on: [1-3.R1]
      steps: [13b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-42701}
  misconceptions:
  - id: MC-CAL-42701
    outcome_code: '71'
    wrong_work: |
      $x-f(x)$를 직접 미분해 $1-\dfrac{(x^2+4x+2)e^x}{3e}$의 부호를 판정하려다 실패
    detect_cue: 양수 $x$로 나눈 보조함수 $3-(x+2)e^{x-1}$이 없음
    feedback: $x>0$으로 묶어 나눈 함수 $3-(x+2)e^{x-1}$은 감소함수라 부호를 바로 읽을 수 있습니다.
    remedy: [RL-3]
- id: 1-4
  stem: |
    【1-4】자연수 $n$에 대하여 구간 $[0,1]$에서 방정식 $g(x)=\dfrac1n$의 실근을 $d_n$이라 할 때, $\displaystyle\lim_{n\to\infty}nd_n$의 값을 구하시오. (40점)
  points: 40
  depends_on: [1-2, 1-3]
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S14-A
    audience: A
    method_no: 1
    key_idea: $g'\ge1$로 근 유일, 평균값 정리로 $\dfrac1n=d_n\{2-f(t_n)+f^{-1}(t_n)\}\ge2d_n$, $t_n\to0$이면 괄호 $\to2$.
    steps:
    - {id: 14a, content: '$nd_n=\dfrac{1}{2-(f(t_n)-f^{-1}(t_n))}\to\tfrac12$', criteria: [1-4.R1, 1-4.R2, 1-4.R3, 1-4.A1]}
    hint_ladder:
    - $g(d_n)=\dfrac1n$에 평균값 정리를 적용해 보자.
    - 1-3을 쓰면 $\dfrac1n$과 $d_n$ 사이의 부등식이 나온다.
  - id: S14-B
    audience: B
    source_flow: GB27.pdf p.76~77(인쇄 p.74~75)
    method_no: 1
    steps:
    - id: 14b-1
      content: |
        구간 $[0,1]$에서 $f(x)$가 증가함수이므로 $f^{-1}(x)\le1$이고 그래서 $g'(x)=2-f^{-1}(x)+f(x)\ge1$이다. 그래서 구간 $[0,1]$에서 $g(x)$는 증가함수이다. 그래서 $c\le\dfrac53$에 대해 $g(x)=c$의 근은 하나이다.
      criteria: [1-4.R1]
    - id: 14b-2
      content: |
        또한 함수 $y=f(x)$이 연속이므로 평균값 정리에 의해 $g(x)=x\{2-f(t)+f^{-1}(t)\}$인 $0<t<x$가 존재한다. 그래서 $\dfrac1n=g(d_n)=d_n\left(2-(f(t_n)-f^{-1}(t_n))\right)$인 $0<t_n<d_n$이 존재한다.
      criteria: [1-4.R2]
    - id: 14b-3
      content: |
        【1-3】에 의해 $\dfrac1n=d_n\left(2-(f(t_n)-f^{-1}(t_n))\right)\ge2d_n$이다. 따라서 $\displaystyle\lim_{n\to\infty}d_n=0$이고 $0<t_n<d_n$이므로 $\displaystyle\lim_{n\to\infty}t_n=0$이다.
      criteria: [1-4.R3]
    - id: 14b-4
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}nd_n=\lim_{n\to\infty}\dfrac{1}{2-(f(t_n)-f^{-1}(t_n))}=\dfrac12$이다.
      criteria: [1-4.A1]
