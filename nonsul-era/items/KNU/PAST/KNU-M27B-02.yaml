    feedback: 접선 위에 있다는 것 자체는 모순이 아닙니다. $\mathrm{A}$·$\mathrm{B}$가 각 접선 위에 있다는 조건으로 $p$, $q$, $\mathrm{R}$을 구체적으로 결정해 (Ⅲ)과 어긋남을 보이세요.
