- id: 2-4
  stem: |
    문제 【2-1】의 세 점 $\mathrm{A},\mathrm{B},\mathrm{R}$를 꼭짓점으로 하는 삼각형의 넓이를 $S_{\Delta\mathrm{ABR}}$라 하자. 또한 곡선 $y=x^2$위의 한 점 $\mathrm{M}(1,1)$에 대하여 선분 $\mathrm{AP}$, 선분 $\mathrm{AM}$과 곡선 $y=x^2$으로 둘러싸인 영역의 넓이를 $S_{\mathrm{APM}}$이라 하고, 선분 $\mathrm{BQ}$, 선분 $\mathrm{BM}$과 곡선 $y=x^2$으로 둘러싸인 영역의 넓이를 $S_{\mathrm{BQM}}$이라 하자.

    다음 물음에 답하시오.

    【2-4】$S_{\mathrm{APM}}=S_{\mathrm{BQM}}$이라면 $p+q=2$임을 보이고, $S_{\mathrm{APM}}=S_{\mathrm{BQM}}=\dfrac13S_{\Delta\mathrm{ABR}}$일 때 점 $\mathrm{R}$의 좌표를 구하시오. (60점)
  points: 60
  depends_on: [2-2, 2-3]
  answer: {kind: expression, value: '(1, (3 + sqrt(3))/2)', equivalents: ['(1, 3/2+sqrt(3)/2)'], tolerance: null}
  solutions:
  - id: S24-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{A}$, $\mathrm{B}$는 $\mathrm{M}$에서의 접선 위. $h(x)=\dfrac{ax^2}{2}-\dfrac{x^3}{6}$이 $(0,2a)$에서 증가하므로 $S_{\mathrm{APM}}=h(1-p)$, $S_{\mathrm{BQM}}=h(q-1)$에서 $1-p=q-1=\beta$; $\mathrm{R}=\left(1,1+\dfrac{a\beta^2}{a-\beta}\right)$, $\dfrac13=\dfrac{(3a-\beta)(a-\beta)}{6a^2}$ ⇒ $\beta=1$.
    steps:
    - {id: 24a, content: '$\beta=(2-\sqrt3)a=1$, $\mathrm{R}=\left(1,1+\tfrac{a}{a-1}\right)=\left(1,\tfrac{3+\sqrt3}{2}\right)$', criteria: [2-4.M1, 2-4.R1, 2-4.R2, 2-4.R3, 2-4.A1]}
    hint_ladder:
    - 점 $\mathrm{A}$, $\mathrm{B}$는 $\mathrm{M}(1,1)$에서의 접선 $y=2x-1$ 위에 있다.
    - $p$가 $1-a$보다 클 때와 작을 때 $S_{\mathrm{APM}}$을 각각 계산·평가해 보자.
    - $1-p=q-1=\beta$로 두면 직선 $\mathrm{AP}$, $\mathrm{BQ}$의 교점이 $\mathrm{R}$이다.
  - id: S24-B
    audience: B
    source_flow: GB27.pdf p.78~79(인쇄 p.76~77)
    method_no: 1
    steps:
    - id: 24b-1
      content: |
        두 점 $\mathrm{A},\mathrm{B}$는 곡선 $y=x^2$의 점 $\mathrm{M}(1,1)$에서의 접선 $y=2(x-1)+1$ 위에 있다. 만약 $1-a<p<1$이면 $S_{\mathrm{APM}}=\dfrac{(p-1+a)\{p^2-(2p-1)\}}{2}+\displaystyle\int_p^1\{x^2-(2x-1)\}dx=\dfrac{a(1-p)^2}{2}-\dfrac{(1-p)^3}{6}$이고, 마찬가지로 만약 $1<q<1+a$이면 $S_{\mathrm{BQM}}=\dfrac{(1+a-q)\{q^2-(2q-1)\}}{2}+\displaystyle\int_1^q\{x^2-(2x-1)\}dx=\dfrac{a(q-1)^2}{2}-\dfrac{(q-1)^3}{6}$이다.
      criteria: [2-4.M1]
    - id: 24b-2
      content: |
        $p\le1-a$이면 $S_{\mathrm{APM}}\ge\displaystyle\int_{1-a}^1\{x^2-(2x-1)\}dx=\dfrac{a^3}{3}$이고, $q\ge1+a$이면 $S_{\mathrm{BQM}}\ge\displaystyle\int_1^{1+a}\{x^2-(2x-1)\}dx=\dfrac{a^3}{3}$이다.
      criteria: [2-4.R1]
    - id: 24b-3
      content: |
        만약 $x_1\le1-a$라면 $p=\dfrac{1-a+r_0x_1}{1+r_0}\le1-a$와 $1<q=\dfrac{1+a+s_0x_1}{1+s_0}<1+a$이므로 $S_{\mathrm{APM}}\ge\dfrac{a^3}{3}$과 $S_{\mathrm{BQM}}=\dfrac{a(q-1)^2}{2}-\dfrac{(q-1)^3}{6}$인데, 함수 $h(x)=\dfrac{ax^2}{2}-\dfrac{x^3}{6}$은 열린구간 $(0,2a)$에서 증가하므로 $S_{\mathrm{BQM}}=h(q-1)<h(a)=\dfrac{a^3}{3}\le S_{\mathrm{APM}}$이다. 마찬가지로 만약 $x_1\ge1+a$이면 $1-a<p<1$과 $q\ge1+a$이므로 $S_{\mathrm{BQM}}\ge\dfrac{a^3}{3}=h(a)>h(1-p)=S_{\mathrm{APM}}$이다. 따라서 $S_{\mathrm{APM}}=S_{\mathrm{BQM}}$이기 위해서는 $1-a<x_1<1+a$이어야만 한다.
      criteria: [2-4.R2]
    - id: 24b-4
      content: |
        이때 $1-a<p=\dfrac{1-a+r_0x_1}{1+r_0}<1<q=\dfrac{1+a+s_0x_1}{1+s_0}<1+a$가 된다. 이때 $h(1-p)=S_{\mathrm{APM}}=S_{\mathrm{BQM}}=h(q-1)$이므로 $1-p=q-1$, 즉 $p+q=2$이다.
      criteria: [2-4.R3]
    - id: 24b-5
      content: |
        이제 $\beta=1-p=q-1$이라 두면 $0<\beta<a$이고 직선 $\mathrm{AP}$의 방정식은 $y=\left(\dfrac{\beta^2}{a-\beta}+2\right)(x-1+a)+(1-2a)$이며, 직선 $\mathrm{BQ}$의 방정식은 $y=\left(\dfrac{-\beta^2}{a-\beta}+2\right)(x-1-a)+(1+2a)$이므로 두 직선의 교점 $\mathrm{R}$의 좌표는 $\left(1,1+\dfrac{a\beta^2}{a-\beta}\right)$이다.
      criteria: [2-4.A1]
    - id: 24b-6
      content: |
        이때 $S_{\Delta\mathrm{ABR}}=\dfrac{a^2\beta^2}{a-\beta}$이고 $S_{\mathrm{APM}}=S_{\mathrm{BQM}}=\dfrac{a\beta^2}{2}-\dfrac{\beta^3}{6}$이므로 $\dfrac13=\dfrac{S_{\mathrm{APM}}}{S_{\Delta\mathrm{ABR}}}=\dfrac{(3a-\beta)(a-\beta)}{6a^2}$이며, 따라서 $\beta=(2-\sqrt3)a=(2-\sqrt3)(2+\sqrt3)=1$이므로 점 $\mathrm{R}$의 좌표는 $\left(1,1+\dfrac{a}{a-1}\right)=\left(1,\dfrac{3+\sqrt3}{2}\right)$이다.
      criteria: [2-4.A1]
