stimuli:
- label: (가)
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$위의 점 $(a,f(a))$에서의 접선의 방정식은
    $$y=f'(a)(x-a)+f(a)$$
- label: (나)
  body: |
    두 함수 $f(x),g(x)$가 닫힌구간 $[\alpha,\beta]$에서 연속이고 $f(x)\ge g(x)$이면, 두 곡선 $y=f(x),y=g(x)$와 두 직선 $x=\alpha,x=\beta$로 둘러싸인 영역의 넓이는
    $$\int_\alpha^\beta\{f(x)-g(x)\}dx$$
- label: (다)
  body: |
    좌표평면의 점 $\mathrm{C}(x_0,y_0)$에서 직선 $\ell:ax+by+c=0$까지의 거리는
    $$\frac{\lvert ax_0+by_0+c\rvert}{\sqrt{a^2+b^2}}$$
- label: (라)
  body: |
    좌표평면 위의 두 점 $\mathrm{X}(a,b),\mathrm{Y}(c,d)$를 이은 선분 $\mathrm{XY}$를 $m:n\ (m>0,n>0)$로 내분하는 점 $\mathrm{Z}$의 좌표는
    $$\mathrm{Z}\left(\frac{mc+na}{m+n},\frac{md+nb}{m+n}\right)$$

stem: |
  ※ 모든 문항에서 풀이 과정을 반드시 기술하시오.

  양의 실수 $a=2+\sqrt3$에 대하여, 좌표평면 위에 서로 다른 세 점 $\mathrm{A}(1-a,1-2a)$, $\mathrm{B}(1+a,1+2a)$, $\mathrm{R}(x_1,y_1)$이 주어져 있다고 하자.

  다음 물음에 답하시오.

subparts:
- id: 2-1
  stem: |
    【2-1】제시문 (라)를 이용하여, 선분 $\mathrm{AR}$위의 점 $\mathrm{C}$와 선분 $\mathrm{BR}$위의 점 $\mathrm{D}$가 주어지면 어떤 양의 실수 $r,s$가 존재하여
    $$\mathrm{C}\left(\frac{1-a+rx_1}{1+r},\frac{1-2a+ry_1}{1+r}\right),\ \mathrm{D}\left(\frac{1+a+sx_1}{1+s},\frac{1+2a+sy_1}{1+s}\right)$$
    로 나타낼 수 있음을 보이시오. (10점)
    (단, 점 $\mathrm{C}$는 두 점 $\mathrm{A},\mathrm{R}$와 다르고 점 $\mathrm{D}$는 두 점 $\mathrm{B},\mathrm{R}$와 다르다.)
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S21-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{AC}}=m$, $\overline{\mathrm{CR}}=n$이면 $\mathrm{C}$는 $m:n$ 내분점, $r=\dfrac mn>0$.
    steps:
    - {id: 21a, content: '$r=\dfrac{\overline{\mathrm{AC}}}{\overline{\mathrm{CR}}}$, $s=\dfrac{\overline{\mathrm{BD}}}{\overline{\mathrm{DR}}}$', criteria: [2-1.R1, 2-1.R2]}
    hint_ladder:
    - $\mathrm{C}$는 선분 $\mathrm{AR}$을 어떤 비로 내분하는가?
  - id: S21-B
    audience: B
    source_flow: GB27.pdf p.77(인쇄 p.75)
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $\overline{\mathrm{AC}}=m$, $\overline{\mathrm{CR}}=n$이라 하면 제시문 (라)로부터 점 $\mathrm{C}$의 좌표는 $\mathrm{C}\left(\dfrac{mx_1+n(1-a)}{m+n},\dfrac{my_1+n(1-2a)}{m+n}\right)$가 된다. 여기서 점 $\mathrm{C}$는 두 점 $\mathrm{A},\mathrm{R}$와 다르므로 $n,m>0$이고, $r=\dfrac mn$이라 하면 $\mathrm{C}\left(\dfrac{1-a+rx_1}{1+r},\dfrac{1-2a+ry_1}{1+r}\right)$이다.
      criteria: [2-1.R1, 2-1.R2]
    - id: 21b-2
      content: |
        또 $\overline{\mathrm{BD}}=l$, $\overline{\mathrm{DR}}=k$라 했을 때 점 $\mathrm{D}$의 좌표는 $\mathrm{D}\left(\dfrac{lx_1+k(1+a)}{l+k},\dfrac{ly_1+k(1+2a)}{l+k}\right)$가 된다. 여기서 점 $\mathrm{D}$는 두 점 $\mathrm{B},\mathrm{R}$와 다르므로 $k,l>0$이고, $s=\dfrac lk$라 하면 $\mathrm{D}\left(\dfrac{1+a+sx_1}{1+s},\dfrac{1+2a+sy_1}{1+s}\right)$이다. ■
      criteria: [2-1.R1, 2-1.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-1.R1
      mark_type: R
      points: 5
      evidence: |
        $r=\dfrac{\overline{\mathrm{AC}}}{\overline{\mathrm{CR}}}$와 $s=\dfrac{\overline{\mathrm{BD}}}{\overline{\mathrm{DR}}}$를 도출했다.
      steps: [21b-1, 21b-2]
    - id: 2-1.R2
      mark_type: R
      points: 5
      evidence: |
        $r,s$가 양의 실수인 이유(점이 양 끝점과 다름)를 올바르게 제시했다.
      steps: [21b-1, 21b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-42701}
  misconceptions:
  - id: MC-GEO-42701
    outcome_code: '71'
    wrong_work: |
      $r=\dfrac{\overline{\mathrm{AC}}}{\overline{\mathrm{CR}}}$로 두고 $r>0$인 이유($\mathrm{C}\ne\mathrm{A},\mathrm{R}$이므로 $m,n>0$)를 쓰지 않음
    detect_cue: 단서 조건(점 C는 A, R와 다름)이 답안에 쓰이지 않음
    feedback: 내분 공식은 $m>0$, $n>0$일 때만 성립합니다. 단서 조건으로 이를 확인하세요.
    remedy: [RL-1]
- id: 2-2
  stem: |
    문제 【2-1】의 세 점 $\mathrm{A},\mathrm{B},\mathrm{R}$와 곡선 $y=x^2$위의 두 점 $\mathrm{P}(p,p^2)$, $\mathrm{Q}(q,q^2)$이 다음과 같은 조건을 만족시킨다고 하자.

    (Ⅰ) $p<1<q$
    (Ⅱ) 곡선 $y=x^2$은 점 $\mathrm{R}$를 지나지 않는다.
    (Ⅲ) 선분 $\mathrm{AR}$는 곡선 $y=x^2$과 오직 하나의 점 $\mathrm{P}$에서 만난다.
    (Ⅳ) 선분 $\mathrm{BR}$는 곡선 $y=x^2$과 오직 하나의 점 $\mathrm{Q}$에서 만난다.

    다음 물음에 답하시오.

    【2-2】함수 $f(r)=(1-a+rx_1)^2-(1+r)(1-2a+ry_1)$과 함수 $g(s)=(1+a+sx_1)^2-(1+s)(1+2a+sy_1)$에 대해 방정식 $f(r)=0$과 $g(s)=0$의 $r>0,s>0$인 실근이 각각 오직 하나 존재함을 보이시오. (10점)
  points: 10
  depends_on: [2-1]
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S22-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}$는 $\mathrm{A},\mathrm{R}$와 다르므로 $r_0>0$으로 매개화되고 $f(r_0)=0$; 다른 양의 근이 있으면 (Ⅲ)에 모순.
    steps:
    - {id: 22a, content: '$f(r)=0$의 양의 근 ⇔ 선분 $\mathrm{AR}$ 위(끝점 제외)의 $y=x^2$ 점', criteria: [2-2.R1, 2-2.R2]}
    hint_ladder:
    - $f(r)=0$은 내분점이 $y=x^2$ 위에 있다는 조건을 $(1+r)^2$을 곱해 정리한 것이다.
  - id: S22-B
    audience: B
    source_flow: GB27.pdf p.78(인쇄 p.76)
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $(1-2a)-(1-a)^2=-a^2\ne0$, $(1+2a)-(1+a)^2=-a^2\ne0$이므로 두 점 $\mathrm{A},\mathrm{B}$는 곡선 $y=x^2$위의 점이 아니다. 또한 조건 (Ⅱ)에 의해 점 $\mathrm{R}$도 곡선 $y=x^2$위의 점이 아니다. 점 $\mathrm{P}$는 곡선 $y=x^2$위의 점이면서 선분 $\mathrm{AR}$위의 점이므로 점 $\mathrm{P}$는 두 점 $\mathrm{A},\mathrm{R}$와 다르다. 마찬가지로 점 $\mathrm{Q}$는 두 점 $\mathrm{B},\mathrm{R}$와 다르다.
      criteria: [2-2.R1]
    - id: 22b-2
      content: |
        따라서 【2-1】에 의해 어떤 $r_0>0$에 대하여 $\mathrm{P}\left(\dfrac{1-a+r_0x_1}{1+r_0},\dfrac{1-2a+r_0y_1}{1+r_0}\right)$, 어떤 $s_0>0$에 대하여 $\mathrm{Q}\left(\dfrac{1+a+s_0x_1}{1+s_0},\dfrac{1+2a+s_0y_1}{1+s_0}\right)$으로 나타낼 수 있다. 두 점 $\mathrm{P},\mathrm{Q}$가 곡선 $y=x^2$위의 점이므로 $r_0$는 $(1-a+r_0x_1)^2-(1+r_0)(1-2a+r_0y_1)=0$, $s_0$는 $(1+a+s_0x_1)^2-(1+s_0)(1+2a+s_0y_1)=0$을 만족한다.
      criteria: [2-2.R2]
    - id: 22b-3
      content: |
        만약 $r_1$이 방정식 $f(r)=0$의 양의 실근이고 $r_0\ne r_1$이면 점 $\left(\dfrac{1-a+r_1x_1}{1+r_1},\dfrac{1-2a+r_1y_1}{1+r_1}\right)$은 선분 $\mathrm{AR}$의 $1:r_1$ 내분점이면서 곡선 $y=x^2$위의 점인, 점 $\mathrm{P}$가 아닌 점이므로 선분 $\mathrm{AR}$와 곡선 $y=x^2$의 교점이 오직 하나 존재함에 모순이며, 마찬가지로 방정식 $g(s)=0$의 서로 다른 두 양의 실근이 존재한다면 선분 $\mathrm{BR}$와 곡선 $y=x^2$의 교점이 오직 하나 존재함에 모순이다. 따라서 방정식 $f(r)=0$과 $g(s)=0$은 각각 양의 실근이 오직 하나 존재한다. ■
      criteria: [2-2.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2-2.R1
      mark_type: R
      points: 5
      evidence: |
        점 $\mathrm{P}$가 두 점 $\mathrm{A},\mathrm{R}$와 다르고, 점 $\mathrm{Q}$가 두 점 $\mathrm{B},\mathrm{R}$과 다르다는 사실을 도출했다.
      steps: [22b-1]
    - id: 2-2.R2
      mark_type: R
      points: 5
      evidence: |
        $\mathrm{P}$, $\mathrm{Q}$를 $r_0,s_0$으로 나타낼 때 $r_0,s_0$가 각각 $f(r)=0$과 $g(s)=0$의 오직 하나의 양의 실근이라는 사실을 도출했다.
      depends_on: [2-2.R1]
      steps: [22b-2, 22b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-42701}
  misconceptions:
  - id: MC-ALG-42701
    outcome_code: '71'
    wrong_work: |
      $f(r)=0$의 판별식이나 근의 공식으로 양의 근의 개수를 직접 세려다 $x_1,y_1$이 미지수라 막힘
    detect_cue: 교점의 유일성 (Ⅲ)·(Ⅳ)를 근의 유일성으로 연결하지 않음
    feedback: 양의 근 하나하나가 선분 위의 교점 하나에 대응합니다. 교점이 하나뿐이라는 조건을 그대로 쓰세요.
    remedy: [RL-2]
- id: 2-3
  stem: |
    【2-3】문제 【2-2】의 결과를 이용하여 $x_1^2<y_1$임을 보이시오. (50점)
  points: 50
  depends_on: [2-2]
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S23-A
    audience: A
    method_no: 1
    key_idea: $x_1^2>y_1$이면 $f$는 $f(0)=a^2>0$인 아래로 볼록 이차함수인데 양의 근이 하나뿐 ⇒ 중근 ⇒ $\mathrm{R}$은 $\mathrm{P}$·$\mathrm{Q}$에서의 접선 위 ⇒ $p=1-2a$, $q=1+2a$, $\mathrm{R}(1,1-4a^2)$ ⇒ $\mathrm{P}$가 선분 $\mathrm{AR}$ 위에 있을 수 없음.
    steps:
    - {id: 23a, content: '귀류: $x_1^2>y_1\Rightarrow f''(r_0)=0\Rightarrow y_1=2px_1-p^2$, $p=1-2a$, $q=1+2a$, $\mathrm{R}=(1,1-4a^2)$ 모순', criteria: [2-3.R1, 2-3.R2, 2-3.R3]}
    hint_ladder:
    - $f(0)$의 값과 $f$의 최고차항 계수를 구해 보자.
    - 아래로 볼록이고 $f(0)>0$인 이차함수가 양의 근을 하나만 가지려면?
    - 중근 조건 $f'(r_0)=0$을 $p$로 정리하면 어떤 직선이 나오는가?
  - id: S23-B
    audience: B
    source_flow: GB27.pdf p.78(인쇄 p.76)
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        (Ⅱ)로부터 $x_1^2\ne y_1$이다.
      criteria: [2-3.R1]
    - id: 23b-2
      content: |
        만약 $x_1^2>y_1$이면 함수 $f(r)$과 함수 $g(s)$는 $f(0)=g(0)=a^2$와 $f(r_0)=g(s_0)=0$을 만족하는, 최고차항의 계수가 $x_1^2-y_1$인 이차함수이다. 그러면 문제 【2-2】로부터 $r_0$는 $f(r)=0$의 중근이다. 점 $\mathrm{P}$의 좌표가 $\mathrm{P}(p,p^2)$이므로 $0=f'(r_0)=2x_1(1-a+r_0x_1)-(1-2a+r_0y_1)-(1+r_0)y_1=(1+r_0)(2px_1-p^2-y_1)$이고, 따라서 $y_1=2px_1-p^2$로부터 점 $\mathrm{R}(x_1,y_1)$은 곡선 $y=x^2$의 점 $\mathrm{P}(p,p^2)$에서의 접선 위에 있다.
      criteria: [2-3.R2]
    - id: 23b-3
      content: |
        점 $\mathrm{A}$는 직선 $\mathrm{PR}$위에 있으므로 $0=1-2a-\{2p(1-a)-p^2\}=(p-1)(p-1+2a)$을 얻고, (Ⅰ)로부터 $p<1$이므로 $p=1-2a$이어야만 한다. 마찬가지로 $0=g'(s_0)=(1+s_0)(2qx_1-q^2-y_1)$으로부터 $y_1=2qx_1-q^2$을 얻고, 따라서 점 $\mathrm{R}(x_1,y_1)$은 곡선 $y=x^2$의 점 $\mathrm{Q}(q,q^2)$에서의 접선 위에 있다. 그러면 점 $\mathrm{B}$ 또한 직선 $\mathrm{QR}$위에 있으므로 $1+2a=2q(1+a)-q^2$으로부터 $(q-1)(q-1-2a)=0$을 얻고, (Ⅰ)로부터 $q>1$이므로 $q=1+2a$이다.
      criteria: [2-3.R3]
    - id: 23b-4
      content: |
        그러나 이 경우 점 $\mathrm{R}$는 직선 $y=2(1-2a)x-(1-2a)^2$과 직선 $y=2(1+2a)x-(1+2a)^2$의 교점인 점 $(1,1-4a^2)$이 되어야만 하는데, 점 $\mathrm{A},\mathrm{P},\mathrm{R}$의 $x$좌표가 각각 $1-a,1-2a,1$이므로 점 $\mathrm{P}$가 선분 $\mathrm{AR}$위에 존재할 수 없어 모순이 발생한다. 따라서 $x_1^2<y_1$이다. ■
      criteria: [2-3.R3]
