intent: |
  선분 위의 점을 내분점으로 매개화하여 선분과 포물선의 교점 조건을 이차방정식의 양의 실근 조건으로 바꾸고, 귀류법으로 점 $\mathrm{R}$의 위치($x_1^2<y_1$)를 판정한 뒤, 넓이 조건으로 점 $\mathrm{R}$의 좌표를 결정하는 능력을 본다.
key_idea: |
  $\mathrm{C}$를 $1:r$ 내분점으로 쓰면 「선분 $\mathrm{AR}$과 $y=x^2$의 교점」 ⇔ $f(r)=0$의 양의 실근. $x_1^2>y_1$이면 $f$의 최고차항 계수 $x_1^2-y_1>0$이고 $f(0)=a^2>0$인데 양의 근이 하나뿐이므로 중근 ⇒ $\mathrm{R}$이 $\mathrm{P}$, $\mathrm{Q}$에서의 접선 위 ⇒ 모순. $S_{\mathrm{APM}}=S_{\mathrm{BQM}}$에서 $1-p=q-1=\beta$로 두고 $\dfrac13=\dfrac{(3a-\beta)(a-\beta)}{6a^2}$.
stuck: |
  교점의 유일성을 $f(r)=0$의 양의 실근의 유일성으로 옮기는 단계와, $x_1^2>y_1$일 때 $f(0)>0$·최고차항 양수·양의 근 하나 ⇒ 중근이라는 관찰
idea_tags: [IDEA-SEGMENT-PARAM-INTERNAL-DIV, IDEA-UNIQUE-POS-ROOT-DOUBLE, IDEA-CONTRADICTION-TANGENT, IDEA-AREA-MONOTONE-EQUAL]
tags: [내분점 매개화, 포물선과 선분의 교점, 귀류법, 넓이 비]
elements:
  materials:
  - '$a=2+\sqrt3$, $\mathrm{A}(1-a,1-2a)$, $\mathrm{B}(1+a,1+2a)$, $\mathrm{R}(x_1,y_1)$'
  - '곡선 $y=x^2$ 위의 $\mathrm{P}(p,p^2)$, $\mathrm{Q}(q,q^2)$, $\mathrm{M}(1,1)$'
  - '$f(r)=(1-a+rx_1)^2-(1+r)(1-2a+ry_1)$, $g(s)=(1+a+sx_1)^2-(1+s)(1+2a+sy_1)$'
  - '넓이 $S_{\Delta\mathrm{ABR}}$, $S_{\mathrm{APM}}$, $S_{\mathrm{BQM}}$'
  concepts:
  - '선분의 내분점'
  - '이차방정식의 근과 중근'
  - '접선의 방정식'
  - '곡선과 직선 사이의 넓이'
  - '귀류법'
  tools:
  - '내분 비 $r=\dfrac{\overline{\mathrm{AC}}}{\overline{\mathrm{CR}}}$로 선분 위의 점 매개화'
  - '$f(0)=g(0)=a^2$과 최고차항 계수 $x_1^2-y_1$'
  - '중근 조건 $f''(r_0)=0$ ⇒ $y_1=2px_1-p^2$ (점 $\mathrm{R}$이 접선 위)'
  - '$\mathrm{A}$, $\mathrm{B}$는 $\mathrm{M}$에서의 접선 $y=2x-1$ 위'
  - '$h(x)=\dfrac{ax^2}{2}-\dfrac{x^3}{6}$의 증가성으로 넓이 비교'
  conditions:
  - '(Ⅰ) $p<1<q$'
  - '(Ⅱ) 곡선 $y=x^2$은 점 $\mathrm{R}$을 지나지 않는다'
  - '(Ⅲ) 선분 $\mathrm{AR}$은 곡선 $y=x^2$과 오직 하나의 점 $\mathrm{P}$에서 만난다'
  - '(Ⅳ) 선분 $\mathrm{BR}$은 곡선 $y=x^2$과 오직 하나의 점 $\mathrm{Q}$에서 만난다'
  - '$S_{\mathrm{APM}}=S_{\mathrm{BQM}}=\dfrac13S_{\Delta\mathrm{ABR}}$'
  stimuli_used: ['(가)', '(나)', '(다)', '(라)']
  subpart_links: '2-1의 내분 매개화를 2-2에서 P·Q에 적용, 2-3은 2-2의 양의 실근 유일성을 사용, 2-4는 2-3의 x1²<y1(R이 포물선 위쪽)과 (Ⅰ)~(Ⅳ)를 사용'

