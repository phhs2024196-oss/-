intent: |
  함수의 그래프 개형을 파악하고 정적분과 급수와의 관계 등을 종합적으로 활용하여 문제를 논리적으로 해결하는 능력을 평가한다(문항카드 출제 의도 1).
key_idea: |
  $g'(x)=1-4f(x)$에서 $f\left(\tfrac12\right)=\tfrac14$를 얻고, 조건 (라)의 부분적분과 (마)의 극값으로 $\int_0^{1/2}f=\tfrac{11}{192}$, $\int_{1/2}^1f=\tfrac{53}{192}$을 구한 뒤, 급수를 $\int_0^1\lvert f(t)-f^{-1}(t)\rvert dt$로 바꿔 $y=x$ 대칭으로 계산한다.
stuck: |
  (1-3) 급수를 정적분으로 바꾼 뒤 $t=f(x)$로 치환하면 $f^{-1}$이 나타나고, $f(x)\le x$와 $y=x$ 대칭으로 $2\int_0^1(x-f(x))dx$가 된다는 발상
idea_tags: [IDEA-FTC-EXTREMUM-VALUE, IDEA-ABS-INTEGRAL-SPLIT-BY-MONOTONE, IDEA-RIEMANN-SUBST-INVERSE-SYMMETRY]
tags: [정적분으로 정의된 함수, 부분적분, 역함수 대칭, 구분구적법]
elements:
  materials:
  - '$[0,1]$에서 증가하고 $f(x)\le x$인 함수 $f$ (구체식 없음, 조건으로만 주어짐)'
  - '정적분으로 정의된 함수 $g(x)=\int_0^x(1-f(t))dt+3\int_x^1f(t)dt$'
  - '합성함수 $f(f(x))$와 절댓값이 들어간 급수의 극한'
  concepts:
  - '정적분으로 정의된 함수의 미분'
  - '극값과 미분계수 0'
  - '부분적분법'
  - '절댓값을 포함한 함수의 정적분'
  - '정적분과 급수의 합 사이의 관계'
  - '치환적분법'
  - '역함수의 그래프와 직선 $y=x$ 대칭'
  tools:
  - '$\dfrac{d}{dx}\int_x^1f(t)dt=-f(x)$'
  - '부분적분 $\int_0^{1/2}xf^{\prime}(x)dx=\left[xf(x)\right]_0^{1/2}-\int_0^{1/2}f(x)dx$'
  - '구분구적법 $\lim\tfrac1n\sum F\left(\tfrac kn\right)=\int_0^1F(x)dx$'
  - '치환 $t=f(x)$, $dt=f^{\prime}(x)dx$'
  - '$y=x$ 대칭으로 $\int_0^1(f^{-1}(t)-t)dt=\int_0^1(t-f(t))dt$'
  conditions:
  - '(가) $f^{\prime}$ 연속 → 정적분·치환적분 가능, 극값에서 $g^{\prime}=0$'
  - '(나)(다) $f(0)=0$, $f(1)=1$, $f^{\prime}>0$ → $f$는 $[0,1]$에서 $[0,1]$로의 증가 일대일대응, 역함수 존재'
  - '(다) $f(x)\le x$ → $f^{-1}(t)\ge t$, 절댓값의 부호 결정'
  - '$f\left(\tfrac12\right)=\tfrac14$ + 증가 → $[0,\tfrac12]$에서 $f\le\tfrac14$, $[\tfrac12,1]$에서 $f\ge\tfrac14$'
  - '(라) → $A=\int_0^{1/2}f=\tfrac{11}{192}$, (마) 극값 $\tfrac{61}{48}$ → $B=\int_{1/2}^1f=\tfrac{53}{192}$'
  stimuli_used: [글]
  subpart_links: '(1-2)는 (1-1)의 $f(1/2)=1/4$를 사용, (1-3)은 (1-2)의 $A+B=\int_0^1f=\tfrac{64}{192}$를 사용'

