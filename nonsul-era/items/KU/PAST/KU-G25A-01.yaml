stimuli:
- label: 글
  body: |
    함수 $f(x)$는 다음 조건을 만족시킨다.
    (가) 함수 $f(x)$의 도함수 $f^{\prime}(x)$가 $[0,1]$에서 연속이다.
    (나) $f(0)=0,\ f(1)=1$
    (다) 구간 $[0,1]$에서 $f^{\prime}(x)>0$이고 $f(x)\le x$이다.
    (라) $\displaystyle\int_0^{\frac12}xf^{\prime}(x)\,dx=\frac{13}{192}$
    (마) 구간 $[0,1]$에서 함수 $g(x)$를 다음과 같이 정의하자.
    $$g(x)=\int_0^x(1-f(t))\,dt+3\int_x^1f(t)dt$$
    이때, 함수 $g(x)$는 $x=\dfrac12$에서 극값 $\dfrac{61}{48}$을 갖는다.

stem: |
  다음 글을 읽고 물음에 답하시오. (35점)

subparts:
- id: '1'
  stem: |
    $f\left(\dfrac12\right)$의 값을 구하고, 그 이유를 설명하시오. (5점)
  points: 5
  depends_on: []
  answer: {kind: value, value: '1/4', equivalents: ['0.25'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$g^{\prime}(x)=1-f(x)-3f(x)=1-4f(x)$이고 극값에서 $g^{\prime}\left(\tfrac12\right)=0$.'
    steps:
    - {id: 1a, content: '$g^{\prime}\left(\tfrac12\right)=1-4f\left(\tfrac12\right)=0\Rightarrow f\left(\tfrac12\right)=\tfrac14$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 미분가능한 함수가 극값을 가지는 점에서 미분계수는 얼마인가?
    - $\int_x^1f(t)dt$를 $x$에 대하여 미분하면?
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.112
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f$가 연속이므로 $\dfrac{d}{dx}\displaystyle\int_0^x(1-f(t))dt=1-f(x)$, $\dfrac{d}{dx}\displaystyle\int_x^1f(t)dt=-f(x)$이다. 따라서 $g^{\prime}(x)=1-f(x)-3f(x)=1-4f(x)$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $g$는 미분가능하고 조건 (마)에서 $x=\dfrac12$에서 극값을 가지므로 $g^{\prime}\left(\dfrac12\right)=1-4f\left(\dfrac12\right)=0$, 즉 $f\left(\dfrac12\right)=\dfrac14$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        정적분으로 정의된 함수의 미분으로 $g^{\prime}(x)=1-4f(x)$(또는 $1-f(x)-3f(x)$)를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        극값 조건 $g^{\prime}\left(\tfrac12\right)=0$을 근거로 $f\left(\tfrac12\right)=\tfrac14$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-7101}
  misconceptions:
  - id: MC-CAL-7101
    outcome_code: '71'
    wrong_work: '$g^{\prime}(x)=1-f(x)+3f(x)=1+2f(x)$로 두어 $f\left(\tfrac12\right)=-\tfrac12$'
    detect_cue: $\int_x^1f(t)dt$의 도함수를 $+f(x)$로 적었다
    feedback: 아래끝이 $x$이면 $\int_x^1f(t)dt=-\int_1^xf(t)dt$이므로 도함수는 $-f(x)$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $\displaystyle\int_0^1\left|f(x)-\frac14\right|dx$의 값을 구하고, 그 이유를 설명하시오. (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '7/32', equivalents: ['42/192'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$f$ 증가, $f\left(\tfrac12\right)=\tfrac14$로 부호를 나누면 답은 $B-A$. (라)의 부분적분으로 $A$, (마)의 $g\left(\tfrac12\right)$로 $B$.'
    steps:
    - {id: 2a, content: '$A=\tfrac18-\tfrac{13}{192}=\tfrac{11}{192}$, $\tfrac12-A+3B=\tfrac{61}{48}\Rightarrow B=\tfrac{53}{192}$, 답 $B-A=\tfrac{7}{32}$', criteria: ['2.R1', '2.M1', '2.A1', '2.M2', '2.A2', '2.A3']}
    hint_ladder:
    - $f(x)-\tfrac14$의 부호는 어디서 바뀌는가?
    - 조건 (라)에 부분적분을 적용해 보자.
    - $g\left(\tfrac12\right)$를 $A=\int_0^{1/2}f$, $B=\int_{1/2}^1f$로 나타내 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.112
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        조건 (가), (나), (다)로부터 $f$는 $[0,1]$에서 증가하고 $f(0)=0$, $f(1)=1$, $f(x)\le x$이므로 $y=f(x)$의 그래프는 $(0,0)$과 $(1,1)$을 잇고 직선 $y=x$ 아래에 있는 증가 곡선이다. [그림] 원점과 $(1,1)$을 잇는 직선 $y=x$(초록) 아래로 볼록하게 처진 증가 곡선 $y=f(x)$(빨강). 1-1)에서 $f\left(\dfrac12\right)=\dfrac14$이므로 $0\le x\le\dfrac12$에서 $f(x)\le\dfrac14$, $\dfrac12\le x\le1$에서 $f(x)\ge\dfrac14$이다.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        $A=\displaystyle\int_0^{\frac12}f(t)dt$, $B=\displaystyle\int_{\frac12}^1f(t)dt$라 놓으면, 조건 (라)로부터 $\displaystyle\int_0^{\frac12}xf^{\prime}(x)dx=\left[xf(x)\right]_0^{\frac12}-\int_0^{\frac12}f(x)dx=\frac{13}{192}$을 얻고
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $A=\displaystyle\int_0^{\frac12}f(x)dx=\frac18-\frac{13}{192}=\frac{11}{192}$을 얻는다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        조건 (마)에서 $g\left(\dfrac12\right)=\displaystyle\int_0^{\frac12}(1-f(t))dt+3\int_{\frac12}^1f(t)dt=\frac12-A+3B=\frac{61}{48}$이다.
      criteria: ['2.M2']
    - id: 2b-5
      content: |
        따라서 $3B=\dfrac{61}{48}-\dfrac12+A=\dfrac{159}{192}$에서 $B=\dfrac{53}{192}$이다.
      criteria: ['2.A2']
    - id: 2b-6
      content: |
        그림으로부터 $\displaystyle\int_0^1\left|f(x)-\frac14\right|dx=\left(\frac18-A\right)+\left(B-\frac18\right)=B-A=\frac{53}{192}-\frac{11}{192}=\frac{42}{192}=\frac{7}{32}$을 얻는다.
      criteria: ['2.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: |
        $f$가 증가하고 $f\left(\tfrac12\right)=\tfrac14$임을 근거로 $\left[0,\tfrac12\right]$에서 $f\le\tfrac14$, $\left[\tfrac12,1\right]$에서 $f\ge\tfrac14$라고 적어 절댓값을 나눴다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        조건 (라)에 부분적분을 적용한 식 $\left[xf(x)\right]_0^{1/2}-\int_0^{1/2}f(x)dx=\tfrac{13}{192}$을 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $\int_0^{1/2}f(x)dx=\tfrac{11}{192}$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $g\left(\tfrac12\right)=\tfrac12-A+3B=\tfrac{61}{48}$ 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-4]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $\int_{1/2}^1f(x)dx=\tfrac{53}{192}$을 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-5]
    - id: 2.A3
      mark_type: A
      points: 2
      evidence: |
        $\int_0^1\left|f(x)-\tfrac14\right|dx=B-A=\tfrac{7}{32}$을 얻었다.
      depends_on: [2.R1, 2.A2]
      steps: [2b-6]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-7102}
  misconceptions:
  - id: MC-CAL-7102
    outcome_code: '72'
    wrong_work: '$\int_0^1\left(f(x)-\tfrac14\right)dx=\tfrac{64}{192}-\tfrac14=\tfrac{1}{12}$'
    detect_cue: 절댓값을 그대로 벗겨 $A+B-\tfrac14$를 답으로 썼다
    feedback: $f$가 증가하고 $f\left(\tfrac12\right)=\tfrac14$이므로 $x=\tfrac12$에서 $f(x)-\tfrac14$의 부호가 바뀝니다. 구간을 나누세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    $\displaystyle\lim_{n\to\infty}\frac1n\sum_{k=1}^n\left|f\left(f\left(\frac kn\right)\right)-\frac kn\right|f^{\prime}\left(\frac kn\right)$의 값을 구하고, 그 이유를 설명하시오. (15점)
  points: 15
  depends_on: ['2']
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '급수 $=\int_0^1\lvert f(f(x))-x\rvert f^{\prime}(x)dx$, $t=f(x)$로 치환하면 $\int_0^1\lvert f(t)-f^{-1}(t)\rvert dt=2\int_0^1(x-f(x))dx=1-2(A+B)$.'
    steps:
    - {id: 3a, content: '$1-2\cdot\tfrac{64}{192}=\tfrac13$', criteria: ['3.M1', '3.M2', '3.R1', '3.A1']}
    hint_ladder:
    - $\tfrac1n\sum F\left(\tfrac kn\right)$ 꼴이다. 어떤 정적분인가?
    - $f^{\prime}(x)dx$가 보이면 무엇으로 치환할까?
    - $y=f(x)$와 $y=f^{-1}(x)$의 그래프는 어떤 직선에 대해 대칭인가?
  - id: S3-B
    audience: B
    source_flow: 문항카드 p.113
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $F(x)=\lvert f(f(x))-x\rvert f^{\prime}(x)$는 $[0,1]$에서 연속이므로 정적분과 급수의 합 사이의 관계에 의해
        $\displaystyle\lim_{n\to\infty}\frac1n\sum_{k=1}^n\left|f\left(f\left(\frac kn\right)\right)-\frac kn\right|f^{\prime}\left(\frac kn\right)=\int_0^1\lvert f(f(x))-x\rvert f^{\prime}(x)dx$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $f(x)=t$로 치환하면($f$는 $[0,1]$에서 $[0,1]$로의 증가함수이므로 역함수 $f^{-1}$가 있고 $x=f^{-1}(t)$, $f(0)=0$, $f(1)=1$)
        $\displaystyle\int_0^1\lvert f(f(x))-x\rvert f^{\prime}(x)dx=\int_0^1\lvert f(t)-f^{-1}(t)\rvert dt$이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $y=f^{-1}(x)$의 그래프와 $y=f(x)$의 그래프는 직선 $y=x$에 대하여 대칭이고, $f(x)\le x$이므로 $f^{-1}(x)\ge x$이다. 따라서
        $\displaystyle\int_0^1\lvert f(t)-f^{-1}(t)\rvert dt=2\int_0^1(x-f(x))dx$.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $\displaystyle=1-2\int_0^1f(x)dx=1-2\left(\frac{64}{192}\right)=\frac13$이다(1-2)의 $A+B=\frac{11}{192}+\frac{53}{192}=\frac{64}{192}$).
      criteria: ['3.A1']
