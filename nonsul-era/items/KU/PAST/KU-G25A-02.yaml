intent: |
  미분과 적분과의 관계, 부분적분 등 주어진 조건을 활용하여 물음에 대한 답을 논리적으로 설명할 수 있는 능력을 평가한다(문항카드 출제 의도 2).
key_idea: |
  (다)에서 $g=f^{\prime}+C$, (가)에서 $f^{\prime}$이 우함수이므로 $g$도 우함수. 적분을 $\int_{-1}^1g(x)h^{\prime}(x)dx$로 모은 뒤 부분적분을 두 번 하여 (나)(라)(마)를 쓴다.
stuck: |
  $\int_0^1g(x)h^{\prime}(-x)dx$를 $x\to-x$로 바꿔 $\int_{-1}^0g(x)h^{\prime}(x)dx$로 만드는 발상과, $\int f^{\prime\prime}h$를 다시 부분적분해 (마)로 연결하는 것
idea_tags: [IDEA-ODD-DERIV-EVEN, IDEA-SAME-DERIV-CONST, IDEA-SYMMETRIC-INTERVAL-MERGE, IDEA-PARTS-TWICE]
tags: [우함수·기함수, 부분적분, 미분과 적분의 관계]
elements:
  materials:
  - '두 번 미분가능한 세 함수 $f,g,h$ (구체식 없음, 조건으로만 주어짐)'
  - '기함수 $f$와 그 도함수'
  - '$\int_0^1g(x)(h^{\prime}(x)+h^{\prime}(-x))dx$'
  concepts:
  - '기함수의 도함수는 우함수'
  - '도함수가 같은 두 함수의 차는 상수'
  - '정적분의 치환($x\to-x$)'
  - '부분적분법'
  tools:
  - '$f(x)+f(-x)=0$을 미분 → $f^{\prime}(x)=f^{\prime}(-x)$'
  - '$(g-f^{\prime})^{\prime}=0$ → $g=f^{\prime}+C$'
  - '$\int_0^1g(x)h^{\prime}(-x)dx=\int_{-1}^0g(-x)h^{\prime}(x)dx$'
  - '부분적분 두 번: $\int g h^{\prime}=[gh]-\int g^{\prime}h$, $\int f^{\prime\prime}h=[f^{\prime}h]-\int f^{\prime}h^{\prime}$'
  conditions:
  - '(가) $f$ 기함수 → $f^{\prime}$ 우함수'
  - '(나) $f^{\prime}(\pm1)=0$ → 경계항 $[f^{\prime}h]_{-1}^1=0$'
  - '(다) $(-1,1)$에서 $f^{\prime\prime}=g^{\prime}$ → $g=f^{\prime}+C$, $g$ 우함수'
  - '(라) $g(1)=\pi$, $h(1)=2\pi$, $h(-1)=1$ → 경계항 $[gh]_{-1}^1=2\pi^2-\pi$ ($g(-1)=g(1)$은 $g$의 연속성과 우함수 성질)'
  - '(마) $\int_{-1}^1f^{\prime}h^{\prime}=\pi$'
  stimuli_used: [글]
  subpart_links: '(2-2)는 (2-1)의 $g(x)=g(-x)$를 사용'

