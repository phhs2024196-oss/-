stimuli:
- label: 글
  body: |
    두 번 미분가능한 세 함수 $y=f(x)$, $y=g(x)$, $y=h(x)$가 다음 조건을 만족시킨다.
    (가) 모든 실수 $x$에 대하여, $f(x)+f(-x)=0$이다.
    (나) $f^{\prime}(-1)=f^{\prime}(1)=0$
    (다) 구간 $(-1,1)$에서, $f^{\prime\prime}(x)=g^{\prime}(x)$이다.
    (라) $g(1)=\pi$, $h(1)=2\pi$, $h(-1)=1$
    (마) $\displaystyle\int_{-1}^1f^{\prime}(x)h^{\prime}(x)dx=\pi$

stem: |
  다음 글을 읽고 물음에 답하시오. (25점)

subparts:
- id: '1'
  stem: |
    구간 $(-1,1)$에서, $g(x)=g(-x)$임을 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$(g-f^{\prime})^{\prime}=0$이므로 $g=f^{\prime}+C$, 기함수 $f$의 도함수 $f^{\prime}$은 우함수.'
    steps:
    - {id: 1a, content: '$g(-x)=f^{\prime}(-x)+C=f^{\prime}(x)+C=g(x)$', criteria: ['1.M1', '1.M2', '1.R1']}
    hint_ladder:
    - $g^{\prime}=f^{\prime\prime}=(f^{\prime})^{\prime}$이다. $g$와 $f^{\prime}$은 어떤 관계인가?
    - $f(x)+f(-x)=0$의 양변을 미분해 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.113
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (다)를 이용하면 구간 $(-1,1)$에서 $(g(x)-f^{\prime}(x))^{\prime}=g^{\prime}(x)-f^{\prime\prime}(x)=0$이므로, 어떤 상수 $C$에 대하여 $g(x)=f^{\prime}(x)+C$가 된다.
      criteria: ['1.M2']
    - id: 1b-2
      content: |
        조건 (가)의 양변을 미분하면 $f^{\prime}(x)-f^{\prime}(-x)=0$이므로 $f^{\prime}(x)=f^{\prime}(-x)$.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $x\in(-1,1)$이면 $-x\in(-1,1)$이므로, 따라서 $g(-x)=f^{\prime}(-x)+C=f^{\prime}(x)+C=g(x)$. ■
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        조건 (가)를 미분해 $f^{\prime}(x)=f^{\prime}(-x)$를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        조건 (다)로부터 $(-1,1)$에서 $g(x)=f^{\prime}(x)+C$($C$는 상수)를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        두 사실을 결합해 $g(-x)=f^{\prime}(-x)+C=f^{\prime}(x)+C=g(x)$로 결론을 적었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 상수 $C$ 없이 $g=f^{\prime}$으로 단정
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '74', misconception: MC-CAL-7104}
  misconceptions:
  - id: MC-CAL-7104
    outcome_code: '74'
    wrong_work: '$f^{\prime\prime}=g^{\prime}$이므로 $g=f^{\prime}$'
    detect_cue: 적분상수 $C$가 없다
    feedback: 도함수가 같은 두 함수는 구간에서 상수만큼 차이 날 수 있습니다. $g=f^{\prime}+C$로 두세요(결론은 같지만 근거가 정확해야 합니다).
    remedy: [RL-1]

- id: '2'
  stem: |
    $\displaystyle\int_0^1g(x)(h^{\prime}(x)+h^{\prime}(-x))dx$의 값을 구하고, 그 이유를 설명하시오. (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '2*pi**2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$g$ 우함수로 적분을 $\int_{-1}^1gh^{\prime}$로 모으고, 부분적분 $\Rightarrow[gh]_{-1}^1-\int f^{\prime\prime}h$, 다시 부분적분 $\int f^{\prime\prime}h=-\int f^{\prime}h^{\prime}=-\pi$.'
    steps:
    - {id: 2a, content: '$\pi(2\pi-1)-(-\pi)=2\pi^2$', criteria: ['2.M1', '2.M2', '2.M3', '2.A1']}
    hint_ladder:
    - $\int_0^1g(x)h^{\prime}(-x)dx$에서 $x$를 $-x$로 바꿔 보자.
    - $\int_{-1}^1g(x)h^{\prime}(x)dx$에 부분적분을 하자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.113
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        2-1)에 의해 $g(x)=g(-x)$이다. 이 사실을 이용하면
        $\displaystyle\int_0^1g(x)h^{\prime}(-x)dx=\int_{-1}^0g(-x)h^{\prime}(x)dx=\int_{-1}^0g(x)h^{\prime}(x)dx$.
        따라서
        $\displaystyle\int_0^1g(x)(h^{\prime}(x)+h^{\prime}(-x))dx=\int_0^1g(x)h^{\prime}(x)dx+\int_{-1}^0g(x)h^{\prime}(x)dx=\int_{-1}^1g(x)h^{\prime}(x)dx$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $g$는 미분가능하므로 연속이고 $(-1,1)$에서 우함수이므로 $g(-1)=g(1)=\pi$이다. 부분적분과 조건 (라)와 (다)를 이용하면
        $\displaystyle\int_{-1}^1g(x)h^{\prime}(x)dx=\left[g(x)h(x)\right]_{-1}^1-\int_{-1}^1g^{\prime}(x)h(x)dx=\pi(2\pi-1)-\int_{-1}^1f^{\prime\prime}(x)h(x)dx$.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        그리고 조건 (나), (마)와 부분적분을 이용하면
        $\displaystyle\int_{-1}^1f^{\prime\prime}(x)h(x)dx=\left[f^{\prime}(x)h(x)\right]_{-1}^1-\int_{-1}^1f^{\prime}(x)h^{\prime}(x)dx=0-\pi=-\pi$.
      criteria: ['2.M3']
    - id: 2b-4
      content: |
        따라서 $\displaystyle\int_0^1g(x)(h^{\prime}(x)+h^{\prime}(-x))dx=\pi(2\pi-1)+\pi=2\pi^2$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $g(x)=g(-x)$와 치환으로 주어진 적분을 $\int_{-1}^1g(x)h^{\prime}(x)dx$로 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.R1], max_points: 4}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        부분적분과 (라)·(다)로 $\pi(2\pi-1)-\int_{-1}^1f^{\prime\prime}(x)h(x)dx$를 적었다($g(-1)=\pi$ 사용).
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.M3
      mark_type: M
      points: 4
      evidence: |
        부분적분과 (나)·(마)로 $\int_{-1}^1f^{\prime\prime}(x)h(x)dx=-\pi$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        값 $2\pi^2$을 얻었다.
      depends_on: [2.M2, 2.M3]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '75', misconception: MC-CAL-7105}
  misconceptions:
  - id: MC-CAL-7105
    outcome_code: '75'
    wrong_work: '$\int_{-1}^1gh^{\prime}=[gh]_{-1}^1-\int f^{\prime\prime}h$에서 $[gh]_{-1}^1=g(1)h(1)=2\pi^2$로만 계산해 답을 $2\pi^2+\pi$로 씀'
    detect_cue: 경계항에서 $g(-1)h(-1)$을 빼지 않았거나 $[f^{\prime}h]$ 경계항 처리가 없다
    feedback: 부분적분의 경계항은 위끝 값에서 아래끝 값을 뺍니다. $g(-1)=g(1)=\pi$, $h(-1)=1$을 모두 대입하세요.
    remedy: [RL-2]

