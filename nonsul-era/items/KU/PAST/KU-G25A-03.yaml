  내분점의 위치벡터로 $\overrightarrow{\mathrm{MN}}=\dfrac{\vec a+\vec b}{3}$, $\overrightarrow{\mathrm{MB^{\prime}}}=-\dfrac13\vec a+\dfrac23\vec b$를 쓰고, $\overline{\mathrm{MH}}$는 $\overrightarrow{\mathrm{MB^{\prime}}}$의 $\overrightarrow{\mathrm{MN}}$ 방향 정사영 길이 $\dfrac{\overrightarrow{\mathrm{MB^{\prime}}}\cdot\overrightarrow{\mathrm{MN}}}{\lvert\overrightarrow{\mathrm{MN}}\rvert}$이다.
stuck: |
