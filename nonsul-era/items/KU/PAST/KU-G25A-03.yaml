stimuli:
- label: 글
  body: |
    아래 그림과 같이 $\overline{\mathrm{OA}}=2$, $\overline{\mathrm{OB}}=3$, $\angle\mathrm{AOB}=\dfrac{\pi}{3}$를 만족시키는 삼각형 $\mathrm{OAB}$에 대하여, 선분 $\mathrm{OA}$를 $1:2$로 내분하는 점을 $\mathrm{M}$, 선분 $\mathrm{AB}$를 $1:2$로 내분하는 점을 $\mathrm{N}$이라 하자.
    [그림] 왼쪽에 O, 오른쪽 아래에 A, 오른쪽 위에 B가 있는 삼각형 OAB. 선분 OA 위의 점 M과 선분 AB 위의 점 N을 지나는 직선 MN이 점선으로 양쪽으로 연장되어 그려져 있다.

stem: |
  다음 글을 읽고 물음에 답하시오. (20점)

subparts:
- id: '1'
  stem: |
    $\vec a=\overrightarrow{\mathrm{OA}}$, $\vec b=\overrightarrow{\mathrm{OB}}$라 할 때, $\overrightarrow{\mathrm{MN}}$을 $\vec a$, $\vec b$로 나타내고, 선분 $\mathrm{MN}$의 길이를 구하고 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'vec=(a+b)/3; len=sqrt(19)/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\overrightarrow{\mathrm{MN}}=\overrightarrow{\mathrm{ON}}-\overrightarrow{\mathrm{OM}}$, $\lvert\overrightarrow{\mathrm{MN}}\rvert^2$은 내적으로.'
    steps:
    - {id: 1a, content: '$\overrightarrow{\mathrm{MN}}=\tfrac{\vec a+\vec b}{3}$, $\lvert\overrightarrow{\mathrm{MN}}\rvert^2=\tfrac{4+9+6}{9}=\tfrac{19}{9}$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 내분점 M, N의 위치벡터를 $\vec a$, $\vec b$로 써 보자.
    - $\lvert\vec a+\vec b\rvert^2$을 내적으로 전개하자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.114
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overrightarrow{\mathrm{OM}}=\dfrac13\vec a$, $\overrightarrow{\mathrm{ON}}=\dfrac{2\vec a+\vec b}{3}$이므로
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\overrightarrow{\mathrm{MN}}=\overrightarrow{\mathrm{MO}}+\overrightarrow{\mathrm{ON}}=-\dfrac13\vec a+\left(\dfrac{2\vec a+\vec b}{3}\right)=\dfrac{\vec a+\vec b}{3}$이고
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\lvert\overrightarrow{\mathrm{MN}}\rvert^2=\left|\dfrac{\vec a+\vec b}{3}\right|^2=\dfrac19\left(\lvert\vec a\rvert^2+\lvert\vec b\rvert^2+2\vec a\cdot\vec b\right)=\dfrac19\left(2^2+3^2+2\times2\times3\cos\dfrac{\pi}{3}\right)=\dfrac{19}{9}$
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        이다. 따라서 $\lvert\overrightarrow{\mathrm{MN}}\rvert=\dfrac{\sqrt{19}}{3}$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        내분점의 위치벡터 $\overrightarrow{\mathrm{OM}}=\tfrac13\vec a$, $\overrightarrow{\mathrm{ON}}=\tfrac{2\vec a+\vec b}{3}$를 적었다.
      depends_on: []
      implied_ok: true
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\overrightarrow{\mathrm{MN}}=\tfrac{\vec a+\vec b}{3}$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $\lvert\overrightarrow{\mathrm{MN}}\rvert^2$을 내적으로 전개하고 $\vec a\cdot\vec b=3$(또는 $2\cdot3\cos\tfrac{\pi}{3}$)을 대입했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $\overline{\mathrm{MN}}=\tfrac{\sqrt{19}}{3}$을 얻었다.
      depends_on: [1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '76', misconception: MC-GEO-7106}
  misconceptions:
  - id: MC-GEO-7106
    outcome_code: '76'
    wrong_work: '$\overrightarrow{\mathrm{ON}}=\tfrac{\vec a+2\vec b}{3}$으로 두어 $\overrightarrow{\mathrm{MN}}=\tfrac23\vec b$, $\overline{\mathrm{MN}}=2$'
    detect_cue: N의 위치벡터에서 $\vec b$의 계수가 $\tfrac23$이다
    feedback: A에서 B 쪽으로 1:2 내분이면 A에 더 가까우므로 $\overrightarrow{\mathrm{ON}}=\tfrac{2\vec a+1\cdot\vec b}{3}$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    선분 $\mathrm{OB}$를 $2:1$로 내분하는 점을 $\mathrm{B^{\prime}}$이라 하고, 점 $\mathrm{B^{\prime}}$에서 직선 $\mathrm{MN}$에 내린 수선의 발을 $\mathrm{H}$라고 하자. 이때, 선분 $\mathrm{MH}$의 길이를 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '17*sqrt(19)/57', equivalents: ['17/(3*sqrt(19))'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\overline{\mathrm{MH}}$는 $\overrightarrow{\mathrm{MB^{\prime}}}$의 $\overrightarrow{\mathrm{MN}}$ 위로의 정사영 길이.'
    steps:
    - {id: 2a, content: '$\overrightarrow{\mathrm{MB^{\prime}}}\cdot\overrightarrow{\mathrm{MN}}=\tfrac{-4+18+3}{9}=\tfrac{17}{9}$, $\overline{\mathrm{MH}}=\tfrac{17/9}{\sqrt{19}/3}=\tfrac{17\sqrt{19}}{57}$', criteria: ['2.M1', '2.M2', '2.A1', '2.A2']}
    hint_ladder:
    - 직각삼각형 $\mathrm{MHB^{\prime}}$에서 $\overline{\mathrm{MH}}=\overline{\mathrm{MB^{\prime}}}\cos\alpha$이다.
    - $\cos\alpha$는 내적으로 구할 수 있다.
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.114
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\overrightarrow{\mathrm{OB^{\prime}}}=\dfrac23\vec b$이므로 두 벡터 $\overrightarrow{\mathrm{MB^{\prime}}}=-\dfrac13\vec a+\dfrac23\vec b$와 $\overrightarrow{\mathrm{MN}}=\dfrac{\vec a+\vec b}{3}$ 사이의 각을 $\alpha$라 하면,
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\overrightarrow{\mathrm{MB^{\prime}}}\cdot\overrightarrow{\mathrm{MN}}=\lvert\overrightarrow{\mathrm{MB^{\prime}}}\rvert\lvert\overrightarrow{\mathrm{MN}}\rvert\cos\alpha$로부터
        $\lvert\overrightarrow{\mathrm{MB^{\prime}}}\rvert\cos\alpha=\dfrac{\overrightarrow{\mathrm{MB^{\prime}}}\cdot\overrightarrow{\mathrm{MN}}}{\lvert\overrightarrow{\mathrm{MN}}\rvert}$이고, 선분 $\mathrm{MH}$의 길이는 $\overline{\mathrm{MB^{\prime}}}\cos\alpha$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $\overrightarrow{\mathrm{MB^{\prime}}}\cdot\overrightarrow{\mathrm{MN}}=\dfrac{-\lvert\vec a\rvert^2+2\lvert\vec b\rvert^2+\vec a\cdot\vec b}{9}=\dfrac{-4+18+3}{9}=\dfrac{17}{9}$.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        $\lvert\overrightarrow{\mathrm{MB^{\prime}}}\rvert\cos\alpha=\dfrac{17/9}{\sqrt{19}/3}=\dfrac{17}{3\sqrt{19}}=\dfrac{17\sqrt{19}}{57}$이므로, 정답은 $\dfrac{17\sqrt{19}}{57}$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $\overrightarrow{\mathrm{MB^{\prime}}}=-\tfrac13\vec a+\tfrac23\vec b$를 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $\overline{\mathrm{MH}}=\dfrac{\overrightarrow{\mathrm{MB^{\prime}}}\cdot\overrightarrow{\mathrm{MN}}}{\lvert\overrightarrow{\mathrm{MN}}\rvert}$(정사영 길이, 또는 $\overline{\mathrm{MB^{\prime}}}\cos\alpha$)로 식을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 1.A2], max_points: 3}
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $\overrightarrow{\mathrm{MB^{\prime}}}\cdot\overrightarrow{\mathrm{MN}}=\tfrac{17}{9}$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $\overline{\mathrm{MH}}=\tfrac{17\sqrt{19}}{57}$(또는 $\tfrac{17}{3\sqrt{19}}$)을 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '77', misconception: MC-GEO-7107}
  misconceptions:
  - id: MC-GEO-7107
    outcome_code: '77'
    wrong_work: '$\overline{\mathrm{MH}}=\overrightarrow{\mathrm{MB^{\prime}}}\cdot\overrightarrow{\mathrm{MN}}=\tfrac{17}{9}$'
    detect_cue: 내적값을 $\lvert\overrightarrow{\mathrm{MN}}\rvert$로 나누지 않았다
    feedback: 정사영 길이는 내적을 투영 방향 벡터의 크기 $\lvert\overrightarrow{\mathrm{MN}}\rvert$로 나눈 값입니다.
    remedy: [RL-2]

