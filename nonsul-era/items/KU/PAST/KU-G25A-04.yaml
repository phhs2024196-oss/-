stimuli:
- label: 글
  body: |
    실수 $x$와 $y$에 대하여, $x\wedge y=\begin{cases}x & (x\le y)\\ y & (x>y)\end{cases}$라고 하자.
    표본공간 $S$의 두 사건 $A$, $B$에 대하여 $\mathrm{P}(A)=\mathrm{P}(A\cap B)+\mathrm{P}(A\cap B^c)$이다.

    대한대학과 민국대학이 이틀에 걸쳐, 첫째 날은 야구 경기와 농구 경기를 하고, 둘째 날은 럭비 경기와 축구 경기를 한다. 대한대학이 야구 경기에서 이기는 사건과 농구 경기에서 이기는 사건은 서로 독립이다. 그리고 모든 경기에서 무승부는 없다.
    첫째 날, 대한대학이 야구 경기에서 이길 확률을 $x$, 그리고 대한대학이 농구 경기에서 이길 확률을 $y$라고 하자.
    둘째 날, 대한대학이 첫째 날 두 경기 중 한 경기 이상 이긴 경우, 럭비 경기에서 이길 확률은 $x$, 축구 경기에서 이길 확률은 $y$이다. 그리고 대한대학이 첫째 날 두 경기 모두 진 경우, 사기가 떨어져서, 럭비 경기와 축구 경기에서 이길 확률은 각각 $x\wedge y$가 된다.

stem: |
  다음 글을 읽고 물음에 답하시오. (20점)

subparts:
- id: '1'
  stem: |
    대한대학이 럭비 경기에서 이길 확률을 $x$와 $y$를 이용해서 표현하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'x*(x+y-x*y) + Min(x,y)*(1-x-y+x*y)', equivalents: ['x*(x+y-x*y) + Min(x,y)*(1-x)*(1-y)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$A$: 첫째 날 한 경기 이상 승. $P(A)=x+y-xy$, $P(B_1)=x\,P(A)+(x\wedge y)P(A^c)$.'
    steps:
    - {id: 1a, content: '$P(B_1)=x(x+y-xy)+(x\wedge y)(1-x-y+xy)$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 둘째 날 승률은 첫째 날의 무엇에 따라 달라지는가?
    - 제시문의 $P(A)=P(A\cap B)+P(A\cap B^c)$를 써 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.114
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        대한대학이 첫째 날 한 경기 이상을 이기는 사건을 $A$라고 하고, 둘째 날 대한대학이 럭비 경기에서 이기는 사건을 $B_1$, 그리고 축구 경기에서 이기는 사건을 $B_2$라 하자. 주어진 조건에 의해 $P(B_1\mid A)=x$, $P(B_1\mid A^c)=x\wedge y$, $P(B_2\mid A)=y$, $P(B_2\mid A^c)=x\wedge y$.
      criteria: ['1.M2']
    - id: 1b-2
      content: |
        사건 $A$가 일어나는 경우는 야구 승, 농구 승, 혹은 야구 승, 농구 패, 혹은 야구 패, 농구 승이고 각각이 독립이므로 $P(A)=xy+x(1-y)+(1-x)y=x+y-xy$.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        따라서, 확률의 곱셈정리에 의해
        $P(B_1)=P(B_1\cap A)+P(B_1\cap A^c)=P(A)P(B_1\mid A)+P(A^c)P(B_1\mid A^c)=x(x+y-xy)+(x\wedge y)(1-x-y+xy)$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        독립을 써서 $P(A)=x+y-xy$(또는 $P(A^c)=(1-x)(1-y)$)를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        $P(B_1)=P(A)P(B_1\mid A)+P(A^c)P(B_1\mid A^c)$로 첫째 날 결과에 따라 나눈 식을 세우고 조건부확률 $x$, $x\wedge y$를 대입했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $x(x+y-xy)+(x\wedge y)(1-x-y+xy)$ 또는 동치식을 얻었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRB-7108}
  - {code: '72', misconception: MC-PRB-7109}
  misconceptions:
  - id: MC-PRB-7108
    outcome_code: '71'
    wrong_work: '$P(A)=x+y$ 또는 $P(A)=xy$'
    detect_cue: 「한 경기 이상」을 합 또는 곱으로 처리했다
    feedback: 한 경기 이상 이길 확률은 여사건(둘 다 짐)을 이용해 $1-(1-x)(1-y)=x+y-xy$입니다.
    remedy: [RL-1]
  - id: MC-PRB-7109
    outcome_code: '72'
    wrong_work: '럭비에서 이길 확률을 $x$라고만 답함'
    detect_cue: $A^c$인 경우($x\wedge y$)가 식에 없다
    feedback: 첫째 날 결과에 따라 럭비 승률이 다르므로 $A$, $A^c$로 나눠 곱셈정리로 더하세요.
    remedy: [RL-2]

- id: '2'
  stem: |
    $x=\dfrac13$이고, $x\le y$일 때, 대한대학이 럭비 경기에서 이길 확률이 대한대학이 축구 경기에서 질 확률보다 작거나 같도록 하는 $y$의 값의 범위를 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: set, value: 'Interval(Rational(1,3), (-1+sqrt(97))/12)', equivalents: ['1/3 <= y <= (-1+sqrt(97))/12'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$x\wedge y=\tfrac13$이므로 $P(B_1)=\tfrac13$, $P(B_2)=\tfrac23y^2+\tfrac19y+\tfrac29$; $P(B_1)\le1-P(B_2)$.'
    steps:
    - {id: 2a, content: '$6y^2+y-4\le0$, $y\ge\tfrac13$ $\Rightarrow\tfrac13\le y\le\tfrac{-1+\sqrt{97}}{12}$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - 축구 경기에서 이길 확률 $P(B_2)$도 4-1)과 같은 방법으로 구하자.
    - 「질 확률」은 무엇의 여사건인가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.114
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        위와 마찬가지로
        $P(B_2)=P(B_2\cap A)+P(B_2\cap A^c)=P(A)P(B_2\mid A)+P(A^c)P(B_2\mid A^c)=y(x+y-xy)+(x\wedge y)(1-x-y+xy)$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $x=\dfrac13$이고 $x\le y$이므로 $x\wedge y=\dfrac13$이고
        $P(B_1)=x(x+y-xy)+(x\wedge y)(1-x-y+xy)=\dfrac13$,
        $P(B_2)=y(x+y-xy)+(x\wedge y)(1-x-y+xy)=\dfrac23y^2+\dfrac19y+\dfrac29$.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $P(B_1)\le1-P(B_2)$을 만족시키기 위해서는 $\dfrac13\le1-\left(\dfrac23y^2+\dfrac19y+\dfrac29\right)$. 즉, $6y^2+y-4\le0$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        이 부등식과 $y\ge x=\dfrac13$을 동시에 만족시키는 $y$의 범위는 $\dfrac13\le y\le\dfrac{-1+\sqrt{97}}{12}$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $P(B_2)=y(x+y-xy)+(x\wedge y)(1-x-y+xy)$를 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M2], max_points: 3}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $x\wedge y=\tfrac13$을 써서 $P(B_1)=\tfrac13$, $P(B_2)=\tfrac23y^2+\tfrac19y+\tfrac29$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        "질 확률"을 $1-P(B_2)$로 두어 $P(B_1)\le1-P(B_2)$, 즉 $6y^2+y-4\le0$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $y\ge\tfrac13$과 함께 $\tfrac13\le y\le\tfrac{-1+\sqrt{97}}{12}$을 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-PRB-7110}
  misconceptions:
  - id: MC-PRB-7110
    outcome_code: '73'
    wrong_work: '$\tfrac13\le\tfrac23y^2+\tfrac19y+\tfrac29$로 놓고 풂'
    detect_cue: 부등식에 $1-P(B_2)$가 아니라 $P(B_2)$가 쓰였다
    feedback: 무승부가 없으므로 축구에서 질 확률은 $1-P(B_2)$입니다.
    remedy: [RL-2]

