stimuli:
- label: 제시문
  body: |
    아래로 볼록인 곡선 $y=f(x)\,(0\le x\le1)$는 매개변수 $t$를 이용하여 다음과 같이 나타낼 수 있다.
    $$x(t)=\cos^3t,\ \ y(t)=2\sin^3t\ \ \left(0\le t\le\dfrac{\pi}{2}\right)$$
    실수 $a\,(0<a<1)$에 대하여 점 $\mathrm{A}(a,0)$를 지나고 이 곡선에 접하는 직선이 단 하나 존재한다. (단, 곡선의 두 끝점은 접점이 아니다.) 이 접선을 $\ell_a$라 하자.

stem: |
  다음 글을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $a=\dfrac{1}{2}$일 때, 접선 $\ell_a$의 방정식을 구하고 그 이유를 설명하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'y = -2*sqrt(3)*x + sqrt(3)', equivalents: ['y = sqrt(3)*(1 - 2*x)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 매개변수 $t$에서의 접선을 세우고 $x$절편이 $\dfrac12$이 되는 $t$를 찾는다.
    steps:
    - {id: 1a, content: '접선 $y=-2\tan t(x-\cos^3t)+2\sin^3t$의 $x$절편 $\cos t=\tfrac12\Rightarrow t=\tfrac{\pi}{3}$, $y=-2\sqrt3x+\sqrt3$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $\dfrac{dy}{dx}=\dfrac{y'(t)}{x'(t)}$를 $t$로 나타내 보자.
    - 접선에 $y=0$을 대입하면 $x$절편이 간단해진다.
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.121
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x'(t)=-3\cos^2t\sin t$, $y'(t)=6\sin^2t\cos t$이므로 $0<t<\dfrac{\pi}{2}$에서 $\dfrac{dy}{dx}=\dfrac{6\sin^2t\cos t}{-3\cos^2t\sin t}=-2\tan t$이다. 따라서 $0<t<\dfrac{\pi}{2}$를 만족시키는 실수 $t$에 대해서 $(x(t),y(t))$를 지나는 접선의 방정식은 $y=-2\tan t\,(x-\cos^3t)+2\sin^3t$가 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $y=0$을 대입하면 $x=\cos^3t+\dfrac{\sin^3t}{\tan t}=\cos^3t+\sin^2t\cos t=\cos t$, 즉 $x$절편은 $\cos t$가 되고, 점 $\left(\dfrac12,0\right)$을 지나므로 $\cos t=\dfrac12$이 된다. 따라서 $t=\dfrac{\pi}{3}$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        기울기는 $-2\tan\dfrac{\pi}{3}=-2\sqrt3$이고 점 $\left(\dfrac12,0\right)$을 지나므로, 구하는 접선의 방정식은 $y=-2\sqrt3x+\sqrt3$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        매개변수 미분으로 기울기 $-2\tan t$를 구하고 접점 $(\cos^3t,2\sin^3t)$에서의 접선의 방정식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        접선의 $x$절편이 $\cos t$임을 보이고 $\cos t=\dfrac12$에서 $t=\dfrac{\pi}{3}$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $y=-2\sqrt3x+\sqrt3$을 적었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-7121}
  misconceptions:
  - id: MC-CAL-7121
    outcome_code: '71'
    wrong_work: '$\dfrac{dy}{dx}=\dfrac{x''(t)}{y''(t)}=-\dfrac{1}{2}\cot t$로 계산해 $t=\dfrac{\pi}{3}$에서 기울기 $-\dfrac{\sqrt3}{6}$을 얻음'
    detect_cue: 접선의 기울기가 $-2\sqrt3$이 아니고 $-\dfrac{1}{2\sqrt3}$ 꼴이거나 $x$절편이 $\cos t$로 정리되지 않는다
    feedback: 매개변수 미분은 $\dfrac{dy}{dx}=\dfrac{dy/dt}{dx/dt}$입니다. 분자가 $y'(t)$인지 확인하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    접선 $\ell_a$가 $x$축과 이루는 예각의 크기를 $g(a)$라 할 때, $a^3\tan(g(a))$의 최댓값을 구하고, 그 이유를 설명하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '4*sqrt(3)/9', equivalents: ['(4/3)*sqrt(1/3)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a=\cos t$, $\tan g(a)=2\tan t$이므로 $a^3\tan(g(a))=2a^2\sqrt{1-a^2}$을 $(0,1)$에서 최대화한다.
    steps:
    - {id: 2a, content: '$2a^2\sqrt{1-a^2}$의 최댓값은 $a=\tfrac{\sqrt6}{3}$에서 $\tfrac{4\sqrt3}{9}$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - 접선의 $x$절편과 $y$절편을 $t$로 나타내 보자.
    - 예각의 탄젠트는 기울기의 절댓값이다.
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.121
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $0<t<\dfrac{\pi}{2}$에 대해 $(x(t),y(t))$를 지나는 접선의 방정식은 $y=-2\tan t\,(x-\cos^3t)+2\sin^3t$이므로, 이 접선의 $x$절편과 $y$절편은 각각 $\cos t$와 $2\sin t$가 된다. 또한 이 직선은 점 $(a,0)$을 지나므로 $a=\cos t$가 된다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이 접선과 $x$축이 이루는 예각의 크기가 $g(a)$이므로 $2\tan t=\tan g(a)$가 된다. 또한 $\cos t=a$와 $\sin t=\sqrt{1-\cos^2t}=\sqrt{1-a^2}$임을 이용하면 $\dfrac{2\sqrt{1-a^2}}{a}=\tan(g(a))$를 얻는다. 따라서 $a^3\tan(g(a))=2a^2\sqrt{1-a^2}$이 된다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $h(a)=2a^2\sqrt{1-a^2}$라 하면 $h'(a)=4a\sqrt{1-a^2}-\dfrac{2a^3}{\sqrt{1-a^2}}=\dfrac{2a(2-3a^2)}{\sqrt{1-a^2}}$이므로 $(0,1)$에서 $h'(a)=0$인 $a$는 $a=\sqrt{\dfrac23}$ 하나이고, 그 앞에서 양, 뒤에서 음이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        따라서 구간 $(0,1)$에서의 최댓값은 $a=\sqrt{\dfrac23}=\dfrac{\sqrt6}{3}$일 때 $\dfrac43\sqrt{\dfrac13}=\dfrac{4\sqrt3}{9}$이 된다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        접선의 $x$절편 $\cos t$, $y$절편 $2\sin t$를 구하고 $a=\cos t$를 적었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 3}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\tan(g(a))=\dfrac{2\sqrt{1-a^2}}{a}$에서 $a^3\tan(g(a))=2a^2\sqrt{1-a^2}$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $2a^2\sqrt{1-a^2}$(또는 $a^4(1-a^2)$)을 미분하여 증감을 조사했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $a=\dfrac{\sqrt6}{3}$일 때 최댓값 $\dfrac{4\sqrt3}{9}$을 적었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-7122}
  misconceptions:
  - id: MC-CAL-7122
    outcome_code: '72'
    wrong_work: '$\tan(g(a))=-2\tan t$로 두어 $a^3\tan(g(a))=-2a^2\sqrt{1-a^2}$의 최댓값을 찾다가 끝점 값 $0$을 답함'
    detect_cue: 식에 음의 부호가 남아 있거나 최댓값이 $0$ 또는 음수로 나온다
    feedback: 예각 $g(a)$의 탄젠트는 양수입니다. 기울기가 음수인 직선이면 $\tan g(a)$는 기울기의 절댓값입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    곡선 $y=f(x)$와 직선 $\ell_a$, 그리고 직선 $y=0$으로 둘러싸인 도형의 넓이를 $S_1(a)$라 하고, 곡선 $y=f(x)$와 직선 $\ell_a$, 그리고 직선 $x=0$으로 둘러싸인 도형의 넓이를 $S_2(a)$라 하자. 이때, $S_1(a)+S_2(a)$가 최소가 되는 $a$의 값을 구하고, 그 이유를 설명하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: 'sqrt(2)/2', equivalents: ['1/sqrt(2)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $S_1+S_2=\displaystyle\int_0^1f(x)dx-\sin t\cos t$이므로 삼각형 넓이 $\tfrac12\sin2t$가 최대인 $t=\tfrac{\pi}{4}$.
    steps:
    - {id: 3a, content: '삼각형 넓이 $\tfrac12\cdot\cos t\cdot2\sin t=\tfrac12\sin2t$ 최대 $\Rightarrow t=\tfrac{\pi}{4}$, $a=\tfrac{\sqrt2}{2}$', criteria: ['3.M1', '3.A1', '3.A2']}
    hint_ladder:
    - 두 넓이를 합치면 어떤 영역이 되는가? 곡선 아래 전체 넓이와 비교해 보자.
    - 접선과 두 좌표축이 만드는 삼각형의 넓이를 $t$로 나타내 보자.
  - id: S3-B
    audience: B
    source_flow: 문항카드 p.121
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        구간 $(0,1)$에 있는 임의의 실수 $a$에 대하여 $\cos t=a$가 되는 $t$가 구간 $\left(0,\dfrac{\pi}{2}\right)$에서 존재한다. 또한 제시문에 의하여 주어진 그래프는 아래로 볼록이므로 접선 $\ell_a$는 곡선의 아래쪽에 있다. 그러므로 $S_1(a)+S_2(a)$의 값은 곡선 $y=f(x)$와 두 좌표축으로 둘러싸인 영역에서 접선 $\ell_a$와 두 좌표축이 만드는 삼각형(꼭짓점 $(0,0)$, $(\cos t,0)$, $(0,2\sin t)$)을 뺀 부분의 넓이가 된다.
        [그림] 제1사분면에서 $(0,2)$에서 $(1,0)$까지 아래로 볼록인 곡선, 접점 $(\cos^3t,2\sin^3t)$에서 접하는 직선이 $y$축과 $(0,2\sin t)$, $x$축과 $(\cos t,0)=(a,0)$에서 만나며, 곡선과 직선 사이의 두 영역($S_2$: 왼쪽 위, $S_1$: 오른쪽 아래)이 색칠되어 있다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        곡선 아래 전체 넓이 $\displaystyle\int_0^1f(x)dx$는 $a$와 무관한 상수이므로, $S_1(a)+S_2(a)$의 최솟값을 구하기 위해서는 위의 삼각형의 넓이가 최대가 되는 $a$를 구하면 된다. 삼각형의 넓이는 $\dfrac12\times2\sin t\cos t$이고 삼각함수의 덧셈정리에 의해
        $$\dfrac12\times2\sin t\cos t=\dfrac12(\sin t\cos t+\cos t\sin t)=\dfrac12\sin(t+t)=\dfrac12\sin2t$$
        이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $0<t<\dfrac{\pi}{2}$에서 $\dfrac12\sin2t$는 $t=\dfrac{\pi}{4}$일 때 최댓값을 가진다. 따라서 $S_1(a)+S_2(a)$ 값이 최소가 되게 하는 $a$의 값은 $\cos t=a$의 관계식에 의해 $a=\dfrac{\sqrt2}{2}$가 된다.
      criteria: ['3.A2']
