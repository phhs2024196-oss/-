intent: |
  매개변수 미분법, 삼각함수의 덧셈정리 또는 삼각함수의 도함수 등을 이용하여 주어진 문제를 논리적으로 해결하는 능력을 평가한다(문항카드 출제 의도 1).
key_idea: |
  접점의 매개변수 $t$에서 접선 $y=-2\tan t\,(x-\cos^3t)+2\sin^3t$의 $x$절편이 $\cos t$, $y$절편이 $2\sin t$이므로 $a=\cos t$이고, $S_1+S_2$는 (곡선 아래 넓이)$-$(삼각형 넓이 $\sin t\cos t$)이다.
stuck: |
  접선의 두 절편이 $\cos t$, $2\sin t$로 깔끔해진다는 것, 그리고 $S_1(a)+S_2(a)$를 직접 적분하지 않고 일정한 넓이에서 삼각형 넓이를 뺀 것으로 보는 발상
