  - '$\displaystyle\lim_{h\to0}\dfrac{\cos h-1}{h}=0$, $\displaystyle\lim_{h\to0}\dfrac{e^{-h}-1}{h}=-1$'
  - '$k=f(t)-tf''(t)=-2at^3+2at^2+2$'
  - '$\displaystyle\int F''(x)e^{F(x)}dx=e^{F(x)}+C$'
  conditions:
  - '(가) 변곡점 $x=\tfrac23$ → $f''''\left(\tfrac23\right)=0$'
  - '(나) $x=0$에서 미분가능 → 연속($f(0)=2$) + 좌·우 미분계수 일치($f''(0)=-1$)'
  - '(다) $k$의 범위 $2<k<\tfrac{62}{27}$ → $\tfrac{8a}{27}=\tfrac{8}{27}$, $a=1$'
  - '$f(x)=(x+1)(x-1)(x-2)$ → $[0,1]$에서 $f\ge0$, $[1,2]$에서 $f\le0$'
  stimuli_used: [제시문]
  subpart_links: '(2-2)는 (2-1)에서 구한 $f(x)$를 사용'

