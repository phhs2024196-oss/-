  - '점 $(0,k)$에서 곡선 $y=f(x)$에 그은 접선'
  - '$F(x)=\displaystyle\int_0^x\lvert f(t)\rvert dt$와 $\displaystyle\int_0^2f(x)e^{F(x)}dx$'
  concepts:
  - '변곡점과 이계도함수'
  - '미분가능성과 연속성'
  - '좌·우 미분계수와 함수의 극한'
  - '접선의 방정식'
  - '삼차방정식의 실근 개수와 극값'
