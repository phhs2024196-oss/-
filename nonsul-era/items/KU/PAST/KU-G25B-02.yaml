intent: |
  주어진 조건이 의미하는 바를 정확히 이해하고 미분가능한 조건, 접선의 방정식, 미분의 방정식에의 활용, 치환적분법 등을 종합적으로 활용하여 물음에 대한 답을 논리적으로 설명할 수 있는 능력을 평가한다(문항카드 출제 의도 2).
key_idea: |
  (나)에서 연속 조건 $f(0)=2$와 좌·우 미분계수 $2f'(0)=-2$를 얻고, (다)는 $\dfrac{k-2}{a}=-2t^3+2t^2$의 서로 다른 실근 3개 조건 $0<\dfrac{k-2}{a}<\dfrac{8}{27}$로 바뀌어 $a=1$. (2-2)는 $F'(x)=\lvert f(x)\rvert$이므로 $f e^{F}=\pm(e^{F})'$.
stuck: |
  $g(x)=xf'(x)+f(x)$의 우미분계수가 $2f'(0)$임을 보는 것, 그리고 (2-2)에서 $f(x)e^{F(x)}$를 구간별로 $\pm F'(x)e^{F(x)}$로 바꾸는 발상
idea_tags: [IDEA-PIECEWISE-DIFFERENTIABILITY-COEFF, IDEA-TANGENT-COUNT-CUBIC-RANGE, IDEA-INTEGRAL-F-PRIME-EXP-F]
tags: [미분가능성, 접선의 개수, 치환적분]
