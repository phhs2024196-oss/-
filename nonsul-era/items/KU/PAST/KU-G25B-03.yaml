stimuli:
- label: 제시문
  body: |
    아래 그림과 같이 좌표평면 위에 두 점 $\mathrm{O}(0,0)$, $\mathrm{A}(3,3)$와 중심이 $\mathrm{B}(5,3)$이고 반지름의 길이가 $1$인 원 $C$가 있다. 점 $\mathrm{O}=\mathrm{A}_0$, $\mathrm{A}_1$, $\mathrm{A}_2$, $\mathrm{A}_3=\mathrm{A}$는 선분 $\mathrm{OA}$를 $\overline{\mathrm{A_0A_1}}=\overline{\mathrm{A_1A_2}}=\overline{\mathrm{A_2A_3}}$이 되도록 삼등분하며, 점 $\mathrm{P}$는 원 $C$ 위를 움직인다.
    [그림] 선분 $\mathrm{OA}$ 위에 원점 쪽부터 $\mathrm{O}=\mathrm{A}_0$, $\mathrm{A}_1$, $\mathrm{A}_2$, $\mathrm{A}=\mathrm{A}_3$이 놓이고, 오른쪽에 중심 $\mathrm{B}$인 원 $C$가 있으며, 원 위의 한 점 $\mathrm{P}$(원의 왼쪽 아래 부분)와 $\mathrm{A}_0$, $\mathrm{A}_1$, $\mathrm{A}_2$, $\mathrm{A}_3$을 각각 잇는 선분이 그려져 있다.

stem: |
  다음 글을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OP}}\rvert^2$의 최솟값과 이때 점 $\mathrm{P}$의 좌표를 구하고, 그 이유를 설명하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'min = 81; P = (21/5, 12/5)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OP}}=(8,6)+\overrightarrow{\mathrm{BP}}$이므로 최솟값은 $(10-1)^2=81$.
    steps:
    - {id: 1a, content: '$\overrightarrow{\mathrm{BP}}=-\tfrac{1}{10}(8,6)$일 때 최소 $81$, $\mathrm{P}\left(\tfrac{21}{5},\tfrac{12}{5}\right)$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $\overrightarrow{\mathrm{OP}}$를 원의 중심 $\mathrm{B}$를 거쳐 나타내 보자.
    - 길이가 정해진 두 벡터의 합의 크기는 언제 가장 작은가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.123
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{P}$의 좌표를 $\mathrm{P}(x,y)$라 하자. 두 벡터 $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}=(8,6)$과 $\overrightarrow{\mathrm{BP}}=(x-5,y-3)$ 사이의 각을 $\theta$라 하면
        $$\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OP}}\rvert^2=\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}+\overrightarrow{\mathrm{BP}}\rvert^2=\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}\rvert^2+\lvert\overrightarrow{\mathrm{BP}}\rvert^2+2\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}\rvert\lvert\overrightarrow{\mathrm{BP}}\rvert\cos\theta$$
        이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OP}}\rvert^2$의 최솟값은 $\cos\theta=-1$일 때 $\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}\rvert^2+\lvert\overrightarrow{\mathrm{BP}}\rvert^2-2\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}\rvert\lvert\overrightarrow{\mathrm{BP}}\rvert=101-20=81$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\cos\theta=-1$이므로 $\overrightarrow{\mathrm{BP}}=-k(\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}})\,(k>0)$이고, $(x,y)=(5,3)-k(8,6)$가 원 $(x-5)^2+(y-3)^2=1$ 위에 있으므로 $k=\dfrac{1}{10}$을 얻고, $\mathrm{P}$의 좌표는 $(x,y)=(5,3)-\dfrac{1}{10}(8,6)=\left(\dfrac{21}{5},\dfrac{12}{5}\right)$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OP}}=\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}+\overrightarrow{\mathrm{BP}}$로 쓰고 내적(사잇각 $\theta$)을 이용해 제곱을 전개했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\cos\theta=-1$일 때 최솟값 $81$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\mathrm{P}\left(\dfrac{21}{5},\dfrac{12}{5}\right)$을 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-7127}
  misconceptions:
  - id: MC-GEO-7127
    outcome_code: '71'
    wrong_work: '$\lvert\overrightarrow{\mathrm{OP}}\rvert$가 최소인 점(직선 $\mathrm{OB}$ 위의 원점 쪽 점)을 $\mathrm{P}$로 잡아 계산함'
    detect_cue: $\mathrm{P}$가 $\mathrm{B}-\dfrac{\overrightarrow{\mathrm{OB}}}{\sqrt{34}}$ 꼴이거나 최솟값이 $81$보다 크다
    feedback: 합 벡터 $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OP}}$의 크기를 줄여야 합니다. 고정 부분 $(8,6)$과 반대 방향으로 $\overrightarrow{\mathrm{BP}}$를 잡으세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $\lvert\overrightarrow{\mathrm{A_1P}}+4\overrightarrow{\mathrm{A_2P}}+\overrightarrow{\mathrm{A_3P}}\rvert^2$의 최솟값은 $a+b\sqrt{10}$이다. (단, $a$와 $b$는 정수)
    이때, 순서쌍 $(a,b)$를 구하고, 그 이유를 설명하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '(396, -72)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{A_1P}}+4\overrightarrow{\mathrm{A_2P}}+\overrightarrow{\mathrm{A_3P}}=-2(2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}-3\overrightarrow{\mathrm{BP}})$로 정리한다.
    steps:
    - {id: 2a, content: '$4\left(\lvert(-9,-3)\rvert-3\right)^2=4(\sqrt{90}-3)^2=396-72\sqrt{10}$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 각 $\overrightarrow{\mathrm{A_kP}}$를 $\overrightarrow{\mathrm{A_kB}}+\overrightarrow{\mathrm{BP}}$로 나누어 보자.
    - $\overrightarrow{\mathrm{A_kB}}$를 $\overrightarrow{\mathrm{OA}}$, $\overrightarrow{\mathrm{OB}}$로 나타내자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.123
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $$\overrightarrow{\mathrm{A_1P}}+4\overrightarrow{\mathrm{A_2P}}+\overrightarrow{\mathrm{A_3P}}=(\overrightarrow{\mathrm{A_1B}}+\overrightarrow{\mathrm{BP}})+4(\overrightarrow{\mathrm{A_2B}}+\overrightarrow{\mathrm{BP}})+(\overrightarrow{\mathrm{A_3B}}+\overrightarrow{\mathrm{BP}})$$
        $$=\left(-\tfrac13\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}+\overrightarrow{\mathrm{BP}}\right)+4\left(-\tfrac23\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}+\overrightarrow{\mathrm{BP}}\right)+\left(-\tfrac33\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}+\overrightarrow{\mathrm{BP}}\right)$$
        $$=-\tfrac{12}{3}\overrightarrow{\mathrm{OA}}+6\overrightarrow{\mathrm{OB}}+6\overrightarrow{\mathrm{BP}}=-4\overrightarrow{\mathrm{OA}}+6\overrightarrow{\mathrm{OB}}+6\overrightarrow{\mathrm{BP}}=-2(2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}-3\overrightarrow{\mathrm{BP}})$$
        이고 $\lvert\overrightarrow{\mathrm{A_1P}}+4\overrightarrow{\mathrm{A_2P}}+\overrightarrow{\mathrm{A_3P}}\rvert^2=4\lvert2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}-3\overrightarrow{\mathrm{BP}}\rvert^2$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $$\lvert2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}-3\overrightarrow{\mathrm{BP}}\rvert^2=\lvert2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}\rvert^2+\lvert3\overrightarrow{\mathrm{BP}}\rvert^2-6\lvert2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}\rvert\lvert\overrightarrow{\mathrm{BP}}\rvert\cos\theta$$
        여기서 $\theta$는 두 벡터 $2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}$와 $\overrightarrow{\mathrm{BP}}$가 이루는 각이다. 따라서 구하는 최솟값은 $\cos\theta=1$일 때 $4\left(\lvert2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}\rvert^2+\lvert3\overrightarrow{\mathrm{BP}}\rvert^2-6\lvert2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}\rvert\lvert\overrightarrow{\mathrm{BP}}\rvert\right)$이 된다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        여기서 $2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}=2(3,3)-3(5,3)=(-9,-3)$이므로 이 벡터의 크기는 $\lvert2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}\rvert=\sqrt{81+9}=\sqrt{90}$이 된다. 반면에 $\lvert\overrightarrow{\mathrm{BP}}\rvert=1$이므로, 위의 식에 다 대입하면 구하는 값은 $4(90+9-18\sqrt{10})=396-72\sqrt{10}$. 따라서 $(a,b)=(396,-72)$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $\overrightarrow{\mathrm{A_1P}}+4\overrightarrow{\mathrm{A_2P}}+\overrightarrow{\mathrm{A_3P}}=-2(2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}-3\overrightarrow{\mathrm{BP}})$(또는 $6\overrightarrow{\mathrm{OP}}-4\overrightarrow{\mathrm{OA}}$ 등 동치식)으로 정리했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        내적(사잇각 $\theta$)으로 제곱을 전개하고 $\cos\theta=1$일 때 최소임을 밝혔다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\lvert2\overrightarrow{\mathrm{OA}}-3\overrightarrow{\mathrm{OB}}\rvert=\sqrt{90}$을 대입해 $396-72\sqrt{10}$, $(a,b)=(396,-72)$를 적었다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-GEO-7128}
  misconceptions:
  - id: MC-GEO-7128
    outcome_code: '72'
    wrong_work: '$\overrightarrow{\mathrm{A_kP}}=\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OA_k}}$로 시점 변환 부호를 틀리거나 계수 합 $6$ 대신 $3$을 써서 기준점을 잘못 잡음'
    detect_cue: 정리한 식의 $\overrightarrow{\mathrm{OP}}$ 계수가 $6$이 아니거나 기준점이 $(2,2)$가 아니다
    feedback: $\overrightarrow{\mathrm{A_kP}}=\overrightarrow{\mathrm{OP}}-\overrightarrow{\mathrm{OA_k}}$입니다. 계수 합은 $1+4+1=6$이므로 $6\overrightarrow{\mathrm{OP}}-(\cdots)$ 꼴이 됩니다.
    remedy: [RL-2]

