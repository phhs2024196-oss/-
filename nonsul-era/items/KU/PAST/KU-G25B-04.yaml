key_idea: |
  제한 없는 중복조합 ${}_3\mathrm{H}_{2n}$에서 일어날 수 없는 경우(파란색 $n+1$개 이상: ${}_3\mathrm{H}_{n-1}$, 노란색 $2n$개: $1$)를 빼 $a_n=\dfrac{3n^2+5n}{2}$, 이어서 $a_n+8n+15=\dfrac32(n+2)(n+5)$로 망원급수.
