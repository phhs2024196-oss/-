stimuli: []

stem: |
  다음을 읽고 물음에 답하시오. (30점)

  모든 항이 양수인 두 수열 $a_n$과 $b_n$은 다음 조건을 만족한다.

  (가) $y=x^2$과 $y=a_nx+1$로 둘러싸인 영역의 넓이는 $\dfrac{n}{6}$이다. (단, $n$은 $10$보다 큰 자연수이다.)

  (나) $y=x^2$과 $y=b_nx+1$의 두 교점 사이의 거리는 $n$이다. (단, $n$은 $10$보다 큰 자연수이다.)

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{n\to\infty}\dfrac{a_n^2}{\sqrt[3]{n^2}}$을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 넓이 $=\dfrac16(\beta_n-\alpha_n)^3=\dfrac n6$이고 $(\beta_n-\alpha_n)^2=a_n^2+4$이므로 $a_n^2=\sqrt[3]{n^2}-4$.
    steps:
    - {id: 1a, content: '$(\beta_n-\alpha_n)^3=n$, $a_n^2+4=\sqrt[3]{n^2}$, $\dfrac{a_n^2}{\sqrt[3]{n^2}}=1-\dfrac{4}{\sqrt[3]{n^2}}\to1$', criteria: ['1.M1', '1.A1', '1.A2', '1.A3']}
    hint_ladder:
    - 두 교점의 $x$좌표를 이차방정식의 두 근으로 보자.
    - 포물선과 직선 사이의 넓이를 $\beta_n-\alpha_n$만의 식으로 정리할 수 있는가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.125
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=x^2$과 $y=a_nx+1$의 교점의 $x$좌표를 $\alpha_n$과 $\beta_n$이라고 하자(단, $\alpha_n<\beta_n$). $\alpha_n$과 $\beta_n$은 이차방정식 $x^2-a_nx-1=0$의 두 근이므로, 근과 계수의 관계에 의해 $\alpha_n+\beta_n=a_n$와 $\alpha_n\beta_n=-1$을 얻는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (가)의 조건으로부터 $\displaystyle\int_{\alpha_n}^{\beta_n}(a_nx+1-x^2)\,dx=\dfrac n6$이므로
        $\dfrac{a_n}{2}(\beta_n^2-\alpha_n^2)+(\beta_n-\alpha_n)-\dfrac13(\beta_n^3-\alpha_n^3)=\dfrac n6$.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        인수분해하면 $\dfrac{a_n}{2}(\beta_n-\alpha_n)(\beta_n+\alpha_n)+(\beta_n-\alpha_n)-\dfrac13(\beta_n-\alpha_n)(\beta_n^2+\beta_n\alpha_n+\alpha_n^2)=\dfrac n6$, 근과 계수의 관계를 대입하면 $\dfrac16(\beta_n-\alpha_n)^3=\dfrac n6$을 얻는다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $\alpha_n+\beta_n=a_n$과 $\alpha_n\beta_n=-1$을 적용하면 $\beta_n-\alpha_n=\sqrt{a_n^2+4}$이고, $a_n^2+4=\sqrt[3]{n^2}$이 된다. 이를 풀면 $a_n=\left(\sqrt[3]{n^2}-4\right)^{1/2}$을 얻는다($a_n>0$, $n>10$).
      criteria: ['1.A2']
    - id: 1b-5
      content: |
        $\dfrac{a_n^2}{\sqrt[3]{n^2}}=\dfrac{\sqrt[3]{n^2}-4}{\sqrt[3]{n^2}}=1-\dfrac{4}{\sqrt[3]{n^2}}$이므로 $\displaystyle\lim_{n\to\infty}\dfrac{a_n^2}{\sqrt[3]{n^2}}=1$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        교점의 $x$좌표를 $x^2-a_nx-1=0$의 두 근으로 두고 근과 계수의 관계($\alpha_n+\beta_n=a_n$, $\alpha_n\beta_n=-1$)와 넓이 정적분 $\int_{\alpha_n}^{\beta_n}(a_nx+1-x^2)dx=\dfrac n6$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        넓이를 정리해 $\dfrac16(\beta_n-\alpha_n)^3=\dfrac n6$(즉 $\beta_n-\alpha_n=\sqrt[3]n$)을 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $\beta_n-\alpha_n=\sqrt{a_n^2+4}$를 이용해 $a_n^2=\sqrt[3]{n^2}-4$(또는 $a_n=(\sqrt[3]{n^2}-4)^{1/2}$)를 구했다.
      depends_on: [1.M1]
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: |
        $\dfrac{a_n^2}{\sqrt[3]{n^2}}=1-\dfrac4{\sqrt[3]{n^2}}$ 등 근거와 함께 극한값 $1$을 적었다.
      depends_on: [1.M1]
      steps: [1b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-7141}
  misconceptions:
  - id: MC-CAL-7141
    outcome_code: '71'
    wrong_work: '넓이를 $\dfrac12(\beta_n-\alpha_n)^2$ 또는 $\dfrac13(\beta_n-\alpha_n)^3$으로 놓아 $a_n^2$을 잘못 구함'
    detect_cue: 넓이 식이 $\dfrac16(\beta_n-\alpha_n)^3$이 아니다
    feedback: 이차항 계수가 $1$인 포물선과 직선 사이의 넓이는 $\dfrac16(\beta-\alpha)^3$입니다. 적분 후 $\beta-\alpha$로 인수분해해 확인하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $\displaystyle\lim_{n\to\infty}\sqrt[3]{n}\times\left(a_{n+1}^2-a_n^2\right)$을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '2/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a_{n+1}^2-a_n^2=\sqrt[3]{(n+1)^2}-\sqrt[3]{n^2}$을 세제곱 차 공식으로 유리화한다.
    steps:
    - {id: 2a, content: '$\sqrt[3]n\,(a_{n+1}^2-a_n^2)=\dfrac{\sqrt[3]n(2n+1)}{(n+1)^{4/3}+(n(n+1))^{2/3}+n^{4/3}}\to\dfrac23$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $a_{n+1}^2-a_n^2$은 세제곱근의 차이다. $\infty\times0$ 꼴은 어떻게 처리하는가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.125-126
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        1-1)에서 구한 $a_n=\left(\sqrt[3]{n^2}-4\right)^{1/2}$와 $b-a=(b^{1/3}-a^{1/3})(b^{2/3}+b^{1/3}a^{1/3}+a^{2/3})$을 이용하면
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $a_{n+1}^2-a_n^2=\sqrt[3]{(n+1)^2}-\sqrt[3]{n^2}=\dfrac{(n+1)^2-n^2}{(n+1)^{4/3}+(n(n+1))^{2/3}+n^{4/3}}$이 된다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}\sqrt[3]n\times\left(a_{n+1}^2-a_n^2\right)=\lim_{n\to\infty}\dfrac{\sqrt[3]n(2n+1)}{(n+1)^{4/3}+(n(n+1))^{2/3}+n^{4/3}}=\dfrac23$.
        (분자·분모를 $n^{4/3}$으로 나누면 분자 $\to2$, 분모 $\to3$.)
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $a_{n+1}^2-a_n^2=\sqrt[3]{(n+1)^2}-\sqrt[3]{n^2}$로 쓰고 세제곱 차 공식(또는 동등한 유리화)을 적용하려 했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 4}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $a_{n+1}^2-a_n^2=\dfrac{2n+1}{(n+1)^{4/3}+(n(n+1))^{2/3}+n^{4/3}}$ 또는 동치식을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        최고차항($n^{4/3}$)으로 나누는 등 근거를 밝혀 극한값 $\dfrac23$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-7142}
  misconceptions:
  - id: MC-CAL-7142
    outcome_code: '72'
    wrong_work: '$a_{n+1}^2-a_n^2\to0$이므로 곱의 극한도 $0$이라고 답함(또는 $\sqrt[3]n\to\infty$라서 발산이라 답함)'
    detect_cue: 유리화 없이 $0$ 또는 발산으로 결론
    feedback: $\infty\times0$ 꼴은 정해진 값이 없습니다. 세제곱근의 차를 $b-a=(b^{1/3}-a^{1/3})(\cdots)$로 유리화한 뒤 최고차항으로 나누세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    $\displaystyle\lim_{n\to\infty}\dfrac{b_n^2}{n}$을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 두 교점은 직선 위에 있으므로 거리$^2=(\beta_n-\alpha_n)^2\{1+(\alpha_n+\beta_n)^2\}=(b_n^2+4)(b_n^2+1)=n^2$.
    steps:
    - {id: 3a, content: '$(b_n^2+4)(b_n^2+1)=n^2\Rightarrow\left(\dfrac{b_n^2}{n}+\dfrac4n\right)\left(\dfrac{b_n^2}{n}+\dfrac1n\right)=1\Rightarrow\dfrac{b_n^2}{n}\to1$', criteria: ['3.M1', '3.A1', '3.A2']}
    hint_ladder:
    - 두 교점의 $y$좌표는 $x$좌표의 제곱이다.
  - id: S3-B
    audience: B
    source_flow: 문항카드 p.126
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $y=x^2$과 $y=b_nx+1$의 교점의 $x$좌표를 $\alpha_n$와 $\beta_n$이라고 하자(단, $\alpha_n<\beta_n$). 그러면 $\alpha_n$과 $\beta_n$은 $x^2-b_nx-1=0$의 두 근이 되므로 근과 계수의 관계에 의해 $\alpha_n+\beta_n=b_n$와 $\alpha_n\beta_n=-1$을 얻는다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (나)의 조건으로부터 $(\beta_n-\alpha_n)^2+(\beta_n^2-\alpha_n^2)^2=n^2$이므로, 인수분해 공식을 활용하여 $(\beta_n-\alpha_n)^2\{1+(\beta_n+\alpha_n)^2\}=n^2$을 얻는다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        이제 $\alpha_n+\beta_n=b_n$과 $\alpha_n\beta_n=-1$을 대입하면 $(b_n^2+4)(b_n^2+1)=n^2$을 얻을 수 있다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}\dfrac{b_n^2}{n}=1$이다.
