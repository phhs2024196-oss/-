intent: |
  주어진 조건(포물선과 직선으로 둘러싸인 넓이, 두 교점 사이의 거리)이 의미하는 바를 이해하고 근과 계수의 관계로 수열의 일반항을 구한 뒤, 수열의 극한을 논리적으로 계산하는 능력을 평가한다(문항카드 '출제 의도': 주어진 조건을 활용하여 답을 논리적으로 설명하는 능력, 수열의 극한 등을 종합적으로 활용하는 능력).
key_idea: |
  두 교점의 $x$좌표 $\alpha_n,\beta_n$에 대해 넓이 $=\dfrac16(\beta_n-\alpha_n)^3$, 거리$^2=(\beta_n-\alpha_n)^2\{1+(\alpha_n+\beta_n)^2\}$이고 $(\beta_n-\alpha_n)^2=a_n^2+4$이다.
stuck: |
  넓이 조건을 $(\beta_n-\alpha_n)^3=n$으로 정리하는 인수분해, 그리고 $\sqrt[3]{(n+1)^2}-\sqrt[3]{n^2}$를 세제곱 차 공식으로 유리화하는 단계
