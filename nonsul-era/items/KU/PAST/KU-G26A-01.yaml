tags: [근과 계수의 관계, 수열의 극한, 포물선과 직선]
elements:
  materials:
  - '포물선 $y=x^2$과 $y$절편이 $1$인 직선 $y=a_nx+1$, $y=b_nx+1$'
  - '둘러싸인 영역의 넓이가 $\dfrac n6$, 두 교점 사이의 거리가 $n$인 두 수열'
  concepts:
  - '이차방정식의 근과 계수의 관계'
  - '정적분과 넓이'
  - '두 점 사이의 거리'
  - '수열의 극한(∞/∞ 꼴, ∞×0 꼴)'
  tools:
  - '$\int_\alpha^\beta(a x+1-x^2)dx=\dfrac16(\beta-\alpha)^3$ (인수분해)'
  - '$(\beta-\alpha)^2=(\alpha+\beta)^2-4\alpha\beta$'
  - '$b-a=(b^{1/3}-a^{1/3})(b^{2/3}+b^{1/3}a^{1/3}+a^{2/3})$'
  - '최고차항으로 분자·분모 나누기'
  conditions:
  - '(가) 넓이 $\dfrac n6$ → $(\beta_n-\alpha_n)^3=n$ → $a_n^2+4=\sqrt[3]{n^2}$'
  - '(나) 거리 $n$ → $(b_n^2+4)(b_n^2+1)=n^2$'
  - '모든 항이 양수 → $a_n=(\sqrt[3]{n^2}-4)^{1/2}$로 유일, $n>10$이면 근호 안이 양수'
  stimuli_used: []
  subpart_links: '(1-2)는 (1-1)에서 구한 $a_n^2=\sqrt[3]{n^2}-4$를 사용, (1-3)은 (1-1)과 같은 근과 계수 관계를 거리 조건에 적용'

