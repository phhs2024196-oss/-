    원문 예시 답안 오기(p.127): 도함수를 "$e^{-x}x(x^2-6x^2+5x)=e^{-x}x(x-1)(x-5)$"로 적었으나 바른 식은 $e^{-x}(x^3-6x^2+5x)=e^{-x}x(x-1)(x-5)$. 결론(극대 $x=1$, 극소 $x=5$, 범위)은 맞음 — B 해설에는 바른 식을 쓰고 여기 기록.
    원문 예시 답안 p.126은 (나)의 극한을 처음에 $x\to0-$로 적었다가 이어서 $x\to0$으로 씀(그대로 둠).
    채점 기준은 소문항별 서술형 기준만 있고 부분점수가 없어 마크 배분은 자체 배분.
    예시 답안에는 곡선 $y=-xf'(x)+f(x)$의 그래프 그림이 있음: 원점을 지나고 $x<0$에서 $-x^2$, $x=1$에서 극대(약 $0.47$), $x=5$에서 극소 $-\dfrac{44}{e^5}-1$, $x\to\infty$에서 아래쪽에서 $y=-1$에 점근.

