- id: '3'
  stem: |
    $g(x)-h(x)=0$의 두 근을 $\alpha$, $\beta$라 하자 (단, $\beta>\alpha$). 함수 $F(x)=\displaystyle\int_x^{x+(\beta-\alpha)}\lvert g(t)-h(t)\rvert\,dt$가 $x=x_0$에서 최솟값을 가질 때, $x_0$와 최솟값 $F(x_0)$를 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: 'x0 = -1/2; F = 9/8', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $F'(x)=\lvert g-h\rvert(x+\beta-\alpha)-\lvert g-h\rvert(x)=2\lvert x-\alpha\rvert(\lvert x+\beta-2\alpha\rvert-\lvert x-\beta\rvert)$의 부호가 $x=\alpha$에서 음에서 양으로 바뀐다.
    steps:
    - {id: 3a, content: '$\alpha=-\dfrac12$, $\beta=1$, $F''(x)=2\lvert x+\tfrac12\rvert(\lvert x+2\rvert-\lvert x-1\rvert)$, $F(\alpha)=\int_{-1/2}^1(-2t^2+t+1)dt=\dfrac98$', criteria: ['3.B1', '3.M1', '3.R1', '3.A1']}
    hint_ladder:
    - 길이가 고정된 구간 위의 적분을 미분하면 두 끝점에서의 값의 차가 된다.
  - id: S3-B
    audience: B
    source_flow: 문항카드 p.127-128
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        2-1)로부터 $h(x)-g(x)=2x^2-x-1=2\left(x+\dfrac12\right)(x-1)$이므로 $\alpha=-\dfrac12$와 $\beta=1$을 얻는다.
      criteria: ['3.B1']
    - id: 3b-2
      content: |
        $G'(x)=\lvert g(x)-h(x)\rvert=2\lvert x-\alpha\rvert\lvert x-\beta\rvert$가 되는 함수 $G$를 생각해 보면, 정적분의 정의에 의해 $F(x)=\displaystyle\int_x^{x+\beta-\alpha}\lvert g(t)-h(t)\rvert dt=G(x+\beta-\alpha)-G(x)$가 된다. 따라서
        $F'(x)=G'(x+\beta-\alpha)-G'(x)=2\lvert x+\beta-2\alpha\rvert\lvert x-\alpha\rvert-2\lvert x-\alpha\rvert\lvert x-\beta\rvert=2\lvert x-\alpha\rvert(\lvert x+\beta-2\alpha\rvert-\lvert x-\beta\rvert)$.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        추가로 $F'(x)$의 증감(부호)을 조사하면 $\lvert x+\beta-2\alpha\rvert-\lvert x-\beta\rvert=\lvert x+2\rvert-\lvert x-1\rvert$는 $x<-\dfrac12$에서 음, $x>-\dfrac12$에서 양이므로 $F(x)$는 $x=\alpha$에서 최솟값 $F(\alpha)=2\displaystyle\int_\alpha^\beta\lvert t-\alpha\rvert\lvert t-\beta\rvert dt$를 갖는다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $F(\alpha)=2\displaystyle\int_\alpha^\beta\lvert t-\alpha\rvert\lvert t-\beta\rvert dt=2\int_\alpha^\beta(t-\alpha)(\beta-t)dt=\int_{-\frac12}^1(-2t^2+t+1)dt=\dfrac98$이다. 즉 $x_0=-\dfrac12$, $F(x_0)=\dfrac98$.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        $\alpha=-\dfrac12$, $\beta=1$을 구했다.
      depends_on: []
      ft: {allowed: true, from: [1.A1, 1.A2], max_points: 2}
      steps: [3b-1]
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $F'(x)=\lvert g-h\rvert(x+\beta-\alpha)-\lvert g-h\rvert(x)$, 즉 $2\lvert x-\alpha\rvert(\lvert x+\beta-2\alpha\rvert-\lvert x-\beta\rvert)$ 또는 동치식을 구했다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
      points: 2
      evidence: |
        $F'(x)$의 부호가 $x=\alpha$ 좌우에서 음에서 양으로 바뀜을 근거로 $x=\alpha$에서 최소임을 밝혔다.
      depends_on: [3.M1]
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $x_0=-\dfrac12$와 $F(x_0)=\dfrac98$을 계산했다.
      depends_on: [3.M1, 3.R1]
      steps: [3b-4]
    deductions: []
