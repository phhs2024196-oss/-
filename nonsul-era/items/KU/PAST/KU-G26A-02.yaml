key_idea: |
  (나)에서 분자 $\to0$과 미분계수의 정의로 $h$를, (가)의 연속·좌우 미분계수로 $g$를 정하고, 점 $(0,k)$를 지나는 접선의 접점 $t$는 $k=-tf'(t)+f(t)$의 해이므로 직선 $y=k$와 곡선 $y=-xf'(x)+f(x)$의 교점 개수로 바꾼다.
stuck: |
  접선의 개수를 함수 $-xf'(x)+f(x)$와 수평선의 교점 개수로 바꾸는 발상, $x\to\infty$에서 $-1$로 수렴함을 파악하는 것, $F'(x)=2\lvert x-\alpha\rvert(\lvert x+\beta-2\alpha\rvert-\lvert x-\beta\rvert)$의 부호 판정
