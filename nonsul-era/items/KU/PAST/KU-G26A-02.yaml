    outcome_code: '76'
    wrong_work: '$F''(x)=\lvert g-h\rvert(x+\beta-\alpha)$로 아래끝 항을 빠뜨리거나, 절댓값을 떼고 $F''(x)=(g-h)(x+\tfrac32)-(g-h)(x)$로 놓아 최소 위치를 잘못 찾음'
    detect_cue: $F'(x)$에 두 항의 차가 없거나 절댓값이 사라졌다
    feedback: 위끝과 아래끝이 모두 $x$의 식이면 $F'(x)=$(위끝에서의 값)$\times$(위끝의 미분)$-$(아래끝에서의 값)$\times$(아래끝의 미분)입니다. 피적분함수의 절댓값도 그대로 두세요.
    remedy: [RL-3]

