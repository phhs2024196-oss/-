stimuli: []

stem: |
  다음을 읽고 물음에 답하시오. (30점)

  두 이차함수 $g(x)=-x^2+ax+b$와 $h(x)=x^2+cx+d$에 대하여, 함수
  $$f(x)=\begin{cases}e^{-x}g(x)-1 & (x\ge0)\\ h(x) & (x<0)\end{cases}$$
  는 다음 조건을 만족한다.

  (가) 함수 $f(x)$는 $x=0$에서 미분가능하다.

  (나) $\displaystyle\lim_{x\to0}\left(\dfrac1x\int_{-1}^{x}f(t)\,dt+\dfrac{1}{6x}\right)=0$

  참고로, 양수 $x$에 대하여 $4e^{\frac x4}\ge x$을 이용하면, $e^x\ge\left(\dfrac x4\right)^4$이므로 $\displaystyle\lim_{x\to\infty}\dfrac{x^3}{e^x}=0$이 된다.

subparts:
- id: '1'
  stem: |
    두 이차함수 $g(x)$와 $h(x)$를 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'g = -x**2 + 2*x + 1; h = x**2 + x', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (나)에서 $\int_{-1}^0h=-\dfrac16$과 $h(0)=0$, (가)에서 $b-1=h(0)$, $a-b=h'(0)$.
    steps:
    - {id: 1a, content: '$\dfrac13-\dfrac c2+d=-\dfrac16$, $d=0\Rightarrow c=1$; $b=1$, $a-b=1\Rightarrow a=2$', criteria: ['1.M1', '1.M2', '1.A1', '1.M3', '1.A2']}
    hint_ladder:
    - $x\to0$일 때 분모 $x\to0$이다. 극한값이 존재하려면 분자는?
    - 남은 극한은 어떤 미분계수의 정의인가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.126-127
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (나)로부터
        $\displaystyle\lim_{x\to0}\left(\dfrac1x\int_{-1}^xf(t)dt+\dfrac1{6x}\right)=\lim_{x\to0}\left(\dfrac1x\int_{-1}^xh(t)dt+\dfrac1{6x}\right)=\lim_{x\to0}\dfrac{\int_{-1}^xh(t)dt+\frac16}{x}=0$을 얻고,
        이 극한의 수렴성으로부터 $0=\displaystyle\lim_{x\to0}\left(\int_{-1}^xh(t)dt+\dfrac16\right)=\int_{-1}^0h(t)dt+\dfrac16$을 얻는다. 이로부터 $\displaystyle\int_{-1}^0h(t)dt=-\dfrac16$, 그리고 $\dfrac13-\dfrac c2+d+\dfrac16=0$이 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        또한 미분계수의 정의에 의해
        $\displaystyle\lim_{x\to0}\left(\dfrac1x\int_{-1}^xh(t)dt+\dfrac1{6x}\right)=\lim_{x\to0}\dfrac{\int_0^xh(t)dt+\int_{-1}^0h(t)dt+\frac16}{x}=\lim_{x\to0}\dfrac{\int_0^xh(t)dt}{x}=h(0)=0$
        을 얻는다. 이로부터 $d=0$을 얻고, 앞에서 구한 식을 이용하면 $c=1$이다. 따라서 $h(x)=x^2+x$.
      criteria: ['1.M2', '1.A1']
    - id: 1b-3
      content: |
        조건 (가)로부터 $f(x)$는 $x=0$에서 연속이고, $0=h(0)=g(0)-1=b-1$이 되어야 하므로 $b=1$.
        또한 $f(x)$는 $x=0$에서 미분가능하므로 $f'(0)=\displaystyle\lim_{t\to0+}\dfrac{f(t)-f(0)}{t}=\lim_{t\to0-}\dfrac{f(t)-f(0)}{t}$. $\dfrac{d}{dx}\left(e^{-x}g(x)\right)=-e^{-x}g(x)+e^{-x}g'(x)$이므로 $\displaystyle\lim_{t\to0+}\dfrac{f(t)-f(0)}{t}=-g(0)+g'(0)=-b+a$.
        한편 $\displaystyle\lim_{t\to0-}\dfrac{f(t)-f(0)}{t}=\lim_{t\to0-}\dfrac{h(t)-h(0)}{t}=h'(0)=1$.
      criteria: ['1.M3']
    - id: 1b-4
      content: |
        따라서 $a-b=1$이므로 $a=2$이고 $g(x)=-x^2+2x+1$. 최종 정답은 $g(x)=-x^2+2x+1$ 그리고 $h(x)=x^2+x$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        (나)의 극한이 수렴하므로 분자 $\to0$임을 써서 $\int_{-1}^0h(t)dt=-\dfrac16$(즉 $\dfrac13-\dfrac c2+d+\dfrac16=0$)을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        남은 극한을 $\displaystyle\lim_{x\to0}\dfrac1x\int_0^xh(t)dt=h(0)$으로 보아 $h(0)=0$(즉 $d=0$)을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $h(x)=x^2+x$를 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: |
        (가)에서 연속 조건 $h(0)=g(0)-1$로 $b=1$, 좌·우 미분계수 $h'(0)=-g(0)+g'(0)$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        $a=2$, $g(x)=-x^2+2x+1$을 구했다.
      depends_on: [1.M3]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '74', misconception: MC-CAL-7144}
  misconceptions:
  - id: MC-CAL-7144
    outcome_code: '74'
    wrong_work: '(나)를 $\displaystyle\lim_{x\to0}\dfrac1x\int_{-1}^xf(t)dt=-\lim_{x\to0}\dfrac1{6x}$처럼 나눠 쓰거나, 분자 $\to0$ 조건 없이 $h(0)=0$만 써서 $c$를 정하지 못함'
    detect_cue: $\int_{-1}^0h(t)dt=-\dfrac16$ 식이 없다
    feedback: 분모가 $0$으로 가는데 극한값이 존재하면 분자도 $0$으로 가야 합니다. 그 조건과 미분계수의 정의를 함께 쓰세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    곡선 $y=f(x)$ 위의 서로 다른 세 점에서의 접선이 점 $(0,k)$를 지나는 $k$값의 범위를 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: set, value: 'Interval.open(-44*exp(-5) - 1, -1)', equivalents: ['-44/e^5-1<k<-1'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 접점 $t$에 대해 $k=-tf'(t)+f(t)$이므로 직선 $y=k$와 곡선 $y=-xf'(x)+f(x)$가 세 점에서 만나는 $k$를 찾는다.
    steps:
    - {id: 2a, content: '$x\ge0$: $e^{-x}(-x^3+3x^2+x+1)-1$ (극대 $x=1$, 극소 $x=5$, $\to-1$), $x<0$: $-x^2$ ⇒ $-\dfrac{44}{e^5}-1<k<-1$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - 접선이 $(0,k)$를 지나는 조건을 접점의 $x$좌표 $t$에 대한 방정식으로 쓰자.
    - 그 방정식의 실근 개수는 어떤 두 그래프의 교점 개수인가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.127
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        곡선 $y=f(x)$의 한 점 $(t,f(t))$에서의 접선의 방정식은 $y=f'(t)(x-t)+f(t)$이고, 이 직선이 $(0,k)$를 지나려면
        $$k=-tf'(t)+f(t)=\begin{cases}e^{-t}(-t^3+3t^2+t+1)-1 & t\ge0\\ -t^2 & t<0\end{cases}$$
        을 만족해야 한다.
      criteria: ['2.M1', '2.A1']
    - id: 2b-2
      content: |
        따라서 직선 $y=k$와 곡선 $y=-xf'(x)+f(x)$가 세 점에서 만나는 $k$의 범위를 구하면 된다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        극대와 극소를 구하기 위해 $x>0$ 범위에서 미분을 해 보면 $e^{-x}(x^3-6x^2+5x)=e^{-x}x(x-1)(x-5)$가 나온다. 여기서 $x=1$일 때 극대, $x=5$에서 극소임을 알 수 있다. $x$가 무한대로 갈 때 $-xf'(x)+f(x)$는 $-1$보다 작으면서 $-1$로 수렴한다(참고 문장). 이때 극솟값을 구하면 $-\dfrac{44}{e^5}-1$이 나온다. ($x<0$에서는 $-x^2$로 증가하며 $(-\infty,0)$의 값을 한 번씩 가진다.)
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        따라서 구하는 $k$값의 범위는 $-\dfrac{44}{e^5}-1<k<-1$이다.
        (이 범위에서 $x<0$, $1<x<5$, $x>5$에서 교점이 하나씩 있고, 그 밖의 $k$에서는 교점이 3개가 아니다.)
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        접점 $(t,f(t))$에서의 접선이 $(0,k)$를 지날 조건 $k=-tf'(t)+f(t)$를 세우고 직선 $y=k$와의 교점 개수 문제로 바꿨다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 1.A2], max_points: 3}
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $t\ge0$에서 $e^{-t}(-t^3+3t^2+t+1)-1$, $t<0$에서 $-t^2$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.M2
