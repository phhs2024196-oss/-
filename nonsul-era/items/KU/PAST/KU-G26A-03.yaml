intent: |
  공간좌표와 공간도형(구의 접선, 정사영, 삼수선의 정리)을 종합적으로 활용하여 선분의 길이, 두 직선이 이루는 각, 구의 부피의 최솟값을 논리적으로 구하는 능력을 평가한다(문항카드 '출제 의도': 공간좌표와 공간도형을 종합적으로 활용하여 주어진 문제를 논리적으로 해결하는 능력).
key_idea: |
  접점에서 반지름과 접선이 수직이므로 $xz$평면·$yz$평면의 직각삼각형 닮음으로 $\mathrm P,\mathrm Q$를 구하고, $\mathrm{RS}$는 $\mathrm{PQ}$의 $xy$평면 위로의 정사영임을 쓴다. $S_2$ 중심에서 $m$까지의 거리는 삼수선의 정리로 $\sqrt{(\sqrt6)^2+(\sqrt{10})^2}$.
stuck: |
  $\overline{\mathrm{RS}}=\overline{\mathrm{PQ}}\cos\theta$(정사영)로 각을 구하는 것, 공간에서 점과 직선 사이 거리를 삼수선의 정리로 구하는 것
