    문제에는 그림이 없고 예시 답안에만 그림이 있음: [그림] 좌표공간에서 $z$축 위 $\mathrm A(0,0,\tfrac{11}3)$, $\mathrm B(0,0,11)$, 구 $S_1$의 단면 호, $\mathrm A$에서 그은 접선의 접점 $\mathrm P(a,0,b)$, $\mathrm B$에서 그은 접선의 접점 $\mathrm Q(0,c,d)$, 직선 $\ell=\mathrm{PQ}$, $xy$평면 위 $\mathrm R(a,0,0)$, $\mathrm S(0,c,0)$을 지나는 직선 $m$. 둘째 [그림] $xz$평면의 단면: $\mathrm O$, $\mathrm A$, $\mathrm P$, $\mathrm R$과 $\overline{\mathrm{OP}}=\sqrt{11}$. 셋째 [그림] $S_2$의 중심 $(\sqrt2,6,\sqrt{10})$, 그 정사영 $(\sqrt2,6,0)$, 직선 $m$에 내린 수선(직각 표시).
    원문 예시 답안 표기 "$\overline{\mathrm{RS}}^2=\sqrt2^2+\sqrt{10}^2=12$"는 $(\sqrt2)^2+(\sqrt{10})^2$의 뜻(그대로 옮기지 않고 B 해설에서 괄호 표기).
    채점 기준은 소문항별 서술형 기준만 있고 부분점수가 없어 마크 배분은 자체 배분.

