stimuli: []

stem: |
  다음을 읽고 물음에 답하시오. (20점)

  좌표공간에서 점 $\mathrm A\left(0,\,0,\,\dfrac{11}{3}\right)$을 지나는 직선이 구 $S_1:x^2+y^2+z^2=11$과 점 $\mathrm P(a,\,0,\,b)$에서 접하고, 점 $\mathrm B(0,\,0,\,11)$을 지나는 직선이 구 $S_1$과 점 $\mathrm Q(0,\,c,\,d)$에서 접한다. 점 $\mathrm P$와 점 $\mathrm Q$에서 $xy$평면에 내린 수선의 발을 각각 $\mathrm R$과 $\mathrm S$라 하자. 또한, 점 $\mathrm P$와 점 $\mathrm Q$를 지나는 직선을 $\ell$이라 하고, 점 $\mathrm R$과 점 $\mathrm S$를 지나는 직선을 $m$이라 하자. (단, $a$와 $c$는 양수이다.)

subparts:
- id: '1'
  stem: |
    선분 $\mathrm{RS}$의 길이와 두 직선 $\ell$과 $m$이 이루는 각을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: 'RS = 2*sqrt(3); theta = pi/6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선 ⊥ 반지름에서 $\overline{\mathrm{OA}}\cdot b=11$, $\overline{\mathrm{OB}}\cdot d=11$; $\mathrm{RS}$는 $\mathrm{PQ}$의 정사영.
    steps:
    - {id: 1a, content: '$b=3$, $a=\sqrt2$, $d=1$, $c=\sqrt{10}$, $\overline{\mathrm{RS}}=2\sqrt3$, $\overline{\mathrm{PQ}}=4$, $\cos\theta=\dfrac{\sqrt3}2$', criteria: ['1.M1', '1.A1', '1.A2', '1.M2', '1.A3']}
    hint_ladder:
    - 접점에서 반지름과 접선은 수직이다. $xz$평면에서 직각삼각형을 찾자.
    - 선분 $\mathrm{RS}$는 선분 $\mathrm{PQ}$의 무엇인가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.128
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $xz$평면에서 두 직각삼각형 $\triangle\mathrm{AOP}$와 $\triangle\mathrm{OPR}$은 닮음이므로 $\dfrac{11}{3}:\sqrt{11}=\sqrt{11}:b$에서 $b=3$. $a^2+b^2=11$이므로 $a=\sqrt2$, 따라서 $\mathrm P(\sqrt2,0,3)$이고 $\mathrm R(\sqrt2,0,0)$.
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        마찬가지로 $yz$평면에서 $11:\sqrt{11}=\sqrt{11}:d$이고 $d=1$. $c^2+d^2=11$이므로 $c=\sqrt{10}$. 따라서 $\mathrm Q(0,\sqrt{10},1)$이고 $\mathrm S(0,\sqrt{10},0)$.
      criteria: ['1.M1', '1.A1']
    - id: 1b-3
      content: |
        $\overline{\mathrm{RS}}^2=(\sqrt2)^2+(\sqrt{10})^2=12$, $\overline{\mathrm{RS}}=2\sqrt3$이다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $\overline{\mathrm{PQ}}^2=(\sqrt2)^2+(\sqrt{10})^2+2^2=16$, $\overline{\mathrm{PQ}}=4$이고, 선분 $\mathrm{PQ}$의 $xy$평면 위로의 정사영이 선분 $\mathrm{RS}$이다. 두 직선이 이루는 각을 $\theta$라 할 때 $\cos\theta=\dfrac{\overline{\mathrm{RS}}}{\overline{\mathrm{PQ}}}=\dfrac{2\sqrt3}{4}=\dfrac{\sqrt3}{2}$이므로 $\theta=\dfrac\pi6$.
      criteria: ['1.M2', '1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        접점에서 반지름 ⊥ 접선(직각삼각형의 닮음 또는 $\overrightarrow{\mathrm{OP}}\perp\overrightarrow{\mathrm{AP}}$)을 이용해 $b$와 $d$를 구하는 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $\mathrm P(\sqrt2,0,3)$, $\mathrm Q(0,\sqrt{10},1)$, $\mathrm R(\sqrt2,0,0)$, $\mathrm S(0,\sqrt{10},0)$을 구했다.
      depends_on: [1.M1]
      steps: [1b-1, 1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $\overline{\mathrm{RS}}=2\sqrt3$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $\overline{\mathrm{PQ}}=4$를 구하고 $\mathrm{RS}$가 $\mathrm{PQ}$의 정사영이므로 $\cos\theta=\dfrac{\overline{\mathrm{RS}}}{\overline{\mathrm{PQ}}}$로 놓았다.
      depends_on: []
      implied_ok: false
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 1
      evidence: |
        $\theta=\dfrac\pi6$을 얻었다.
      depends_on: [1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '77', misconception: MC-GEO-7147}
  misconceptions:
  - id: MC-GEO-7147
    outcome_code: '77'
    wrong_work: '$\cos\theta=\dfrac{\overline{\mathrm{PQ}}}{\overline{\mathrm{RS}}}=\dfrac{2}{\sqrt3}$으로 놓아 모순에 빠지거나 $\theta=\dfrac\pi3$으로 답함'
    detect_cue: 정사영 길이가 원래 길이보다 큰 식이 있다
    feedback: 정사영의 길이는 원래 길이에 $\cos\theta$를 곱한 것이므로 $\cos\theta=\dfrac{\text{정사영 길이}}{\text{원래 길이}}\le1$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    구 $S_2:(x-\sqrt2)^2+(y-6)^2+(z-\sqrt{10})^2=4$와 만나고 중심이 직선 $m$ 위에 있는 구의 부피의 최솟값을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '32*pi/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $S_2$의 중심에서 $m$까지의 거리 $4$(삼수선의 정리)에서 반지름 $2$를 뺀 $2$가 최소 반지름.
    steps:
    - {id: 2a, content: '$m:\sqrt5x+y-\sqrt{10}=0$, $(\sqrt2,6,0)$까지 $\sqrt6$, 중심까지 $\sqrt{6+10}=4$, $r_{\min}=2$, $V=\dfrac{32}3\pi$', criteria: ['2.M1', '2.M2', '2.A1', '2.A2']}
    hint_ladder:
    - 구의 중심과 $m$ 사이의 거리를 먼저 구하자. $S_2$ 중심의 $xy$평면 위 정사영을 이용할 수 있는가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.128-129
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        직선 $m$에서 $S_2$까지의 거리가 최소가 되는 경우는 $m$에 수직이고 $S_2$의 중심을 지나는 직선이 $S_2$와 만날 때 발생한다. $xy$평면에서 $m$의 방정식은 $\sqrt5x+y-\sqrt{10}=0$. $m$에서 $(\sqrt2,6,0)$까지의 거리는 $\dfrac{\lvert\sqrt2\sqrt5+6-\sqrt{10}\rvert}{\sqrt{5+1}}=\sqrt6$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $S_2$의 중심에서 $m$까지의 거리는 삼수선의 정리에 의하여 $\sqrt{6+10}=4$이므로
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $m$에서 $S_2$까지의 최소 거리는 $4-2=2$이다(중심이 $m$ 위에 있는 구가 $S_2$와 만나려면 반지름이 이 값 이상이어야 한다).
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        따라서 구의 부피는 $\dfrac43\pi\times2^3=\dfrac{32}{3}\pi$.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $xy$평면에서 $m$의 방정식 $\sqrt5x+y-\sqrt{10}=0$을 구하고 $(\sqrt2,6,0)$까지의 거리 $\sqrt6$을 계산했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        삼수선의 정리(또는 동등한 공간 거리 계산)로 $S_2$의 중심에서 $m$까지의 거리 $4$를 구했다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        중심이 $m$ 위인 구가 $S_2$와 만날 최소 반지름을 $4-2=2$로 근거와 함께 구했다.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        부피의 최솟값 $\dfrac{32}{3}\pi$를 얻었다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '78', misconception: MC-GEO-7148}
  misconceptions:
  - id: MC-GEO-7148
    outcome_code: '78'
    wrong_work: '중심까지의 거리를 $xy$평면 위 거리 $\sqrt6$으로 보아 반지름 $\sqrt6-2$로 계산하거나, 거리 $4$를 그대로 반지름으로 써서 $\dfrac{256}{3}\pi$로 답함'
    detect_cue: 높이 $\sqrt{10}$이 거리 계산에 없거나 $S_2$의 반지름 $2$를 빼지 않았다
    feedback: 공간의 점에서 평면 위 직선까지의 거리는 정사영까지의 거리와 높이로 삼수선의 정리를 써서 구합니다. 두 구가 만나려면 중심 거리 $\le$ 두 반지름의 합입니다.
    remedy: [RL-2]

