  materials:
  - '구 $S_1:x^2+y^2+z^2=11$과 $z$축 위의 두 점 $\mathrm A\left(0,0,\tfrac{11}3\right)$, $\mathrm B(0,0,11)$'
  - '$xz$평면 위 접점 $\mathrm P(a,0,b)$, $yz$평면 위 접점 $\mathrm Q(0,c,d)$와 그 정사영 $\mathrm R$, $\mathrm S$'
  - '구 $S_2:(x-\sqrt2)^2+(y-6)^2+(z-\sqrt{10})^2=4$'
  concepts:
  - '구의 방정식'
  - '좌표공간에서 두 점 사이의 거리'
  - '정사영과 두 직선이 이루는 각'
  - '삼수선의 정리'
  - '점과 직선 사이의 거리'
  tools:
  - '접선 ⊥ 반지름 → 직각삼각형 $\triangle\mathrm{AOP}\sim\triangle\mathrm{OPR}$'
  - '$\cos\theta=\dfrac{\overline{\mathrm{RS}}}{\overline{\mathrm{PQ}}}$'
  - '평면에서 점과 직선 사이의 거리 공식'
  - '구의 부피 $\dfrac43\pi r^3$'
  conditions:
  - '$a>0$, $c>0$ → $\mathrm P(\sqrt2,0,3)$, $\mathrm Q(0,\sqrt{10},1)$로 유일'
  - '"$S_2$와 만나고" → 반지름 $\ge$ (중심 사이 거리) $-2$'
  - '$S_2$ 중심의 $xy$평면 위 정사영은 $(\sqrt2,6,0)$'
  stimuli_used: []
  subpart_links: '(3-2)는 (3-1)에서 구한 $\mathrm R(\sqrt2,0,0)$, $\mathrm S(0,\sqrt{10},0)$로 직선 $m$을 정한다'

