stimuli: []

stem: |
  다음을 읽고 물음에 답하시오. (20점)

  특수문자 32개, 0부터 9까지의 숫자 10개, 대문자 26개와 소문자 26개의 알파벳을 사용하여 다섯 자리 비밀번호를 만들고자 한다. 단, 비밀번호에서 문자나 숫자의 중복을 허용하며, 알파벳 대문자와 소문자는 서로 다른 글자로 취급한다.

subparts:
- id: '1'
  stem: |
    특수문자 한 개, 알파벳 대문자 한 개, 그리고 숫자와 알파벳 소문자 중에서 세 개를 사용해서 다섯 자리 비밀번호를 만들 수 있는 모든 경우의 수는 두 개의 자연수 $n$과 $k$에 대하여 $n\times k^3$ 꼴로 표현이 된다. 이때, $n-k$의 값을 구하고, 그 이유를 설명하시오. (단, $k$는 $30$보다 크고 $40$보다 작은 자연수이다.) (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '16604', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $32\times5\times26\times4\times36^3=16640\times36^3$.
    steps:
    - {id: 1a, content: '$n=16640$, $k=36$, $n-k=16604$', criteria: ['1.M1', '1.M2', '1.A1', '1.A2']}
    hint_ladder:
    - 특수문자가 들어갈 자리부터 정하자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.129
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        특수문자는 32개 그리고 특수문자가 들어갈 자리를 고르는 방법이 5가지($=32\times5$), 알파벳 대문자는 26개 그리고 알파벳 대문자가 들어가는 방법은 4가지이고($=26\times4$),
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        나머지 세 자리는 숫자와 알파벳 소문자를 중복을 허용하여 3자리에 넣는 방법의 수이다($={}_{36}\Pi_3=36^3$).
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        따라서 구하는 총 경우의 수는 위의 값을 곱해서 얻어지는 숫자 $32\times5\times26\times4\times{}_{36}\Pi_3=16640\times36^3$이 된다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        즉, $n$은 $16640$ 그리고 $k$는 $36$이 되어서 구하는 값 $n-k$는 $16604$가 된다.
      criteria: ['1.A2']
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: $k$의 유일성 보충 — 전체 경우의 수 $=2^{14}\cdot3^6\cdot5\cdot13$이고, $31\le k\le39$ 중 $k^3$이 이를 나누는 것은 $k=36$뿐($32^3=2^{15}$은 안 나눔, 나머지는 $7,11,17,19,13^3$ 등의 인수 때문에 불가).
    steps:
    - id: 1c-1
      content: |
        $16640\times36^3=2^{14}\cdot3^6\cdot5\cdot13$이므로 $k\in\{31,\dots,39\}$ 중 $k^3\mid$ 전체인 것은 $36$뿐이고 $n=16640$, $n-k=16604$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        특수문자의 자리·종류($5\times32$)와 대문자의 자리·종류($4\times26$)를 곱했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        나머지 세 자리를 36종류의 중복순열 $_{36}\Pi_3=36^3$으로 셌다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        총 경우의 수 $16640\times36^3$을 얻었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $n=16640$, $k=36$에서 $n-k=16604$를 답했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-4, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-7149}
  misconceptions:
  - id: MC-CNT-7149
    outcome_code: '71'
    wrong_work: '$32\times26\times36^3$만 계산해 $n=832$, $n-k=796$으로 답함'
    detect_cue: 자리 선택 $5\times4$가 곱해지지 않았다
    feedback: 비밀번호는 순서가 있으므로 특수문자와 대문자가 어느 자리에 오는지도 정해야 합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    숫자만을 사용해서 다섯 자리 비밀번호를 만들 때, 각 자리의 숫자의 합이 38이 되도록 만드는 모든 경우의 수를 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '330', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 각 자리를 $9-$(자리)로 바꾸면 합이 $7$이 되어 상한이 사라진다.
    steps:
    - {id: 2a, content: '$_5\mathrm H_7={}_{11}\mathrm C_7=330$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 합 $38$은 최대 $45$에 가깝다. 각 자리가 $9$보다 얼마나 작은지를 세어 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.129
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        다섯 자리 비밀번호의 각 자리를 $\alpha,\beta,\gamma,\delta,\epsilon$이라고 하자. 숫자는 0부터 9까지의 정수로 구성되어 있으므로 각각은 0 이상 9 이하의 한 자리 정수가 된다. 또한 합이 38이므로 $\alpha+\beta+\gamma+\delta+\epsilon=38$이 된다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        추가로 $\alpha_1=9-\alpha$, $\beta_1=9-\beta$, $\gamma_1=9-\gamma$, $\delta_1=9-\delta$, $\epsilon_1=9-\epsilon$이라고 놓으면, 한 자리 정수인 $\alpha_1,\beta_1,\gamma_1,\delta_1,\epsilon_1$은 $\alpha_1+\beta_1+\gamma_1+\delta_1+\epsilon_1=45-38=7$을 만족한다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        따라서 $\alpha_1,\beta_1,\gamma_1,\delta_1,\epsilon_1$이 될 수 있는 총 경우의 수는 서로 다른 5개에서 7개를 택하는 중복조합의 수와 같으므로 $_5\mathrm H_7={}_{11}\mathrm C_7=\dfrac{11!}{4!\,7!}=11\times10\times3=330$이 된다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $\alpha,\beta,\gamma,\delta,\epsilon$이 될 수 있는 총 경우의 수는 $\alpha_1,\beta_1,\gamma_1,\delta_1,\epsilon_1$이 될 수 있는 총 경우의 수와 같으므로 정답은 $330$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        각 자리를 $9-$(자리)로 치환해 합이 $7$인 음이 아닌 정수해 문제로 바꿨다(또는 상한 $9$를 초과하는 경우를 빼는 동등한 처리).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        중복조합 $_5\mathrm H_7={}_{11}\mathrm C_7$로 셌다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        두 경우의 수가 같다는 대응을 밝히고 $330$을 답했다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CNT-7150}
  misconceptions:
  - id: MC-CNT-7150
    outcome_code: '72'
    wrong_work: '상한을 무시하고 $_5\mathrm H_{38}={}_{42}\mathrm C_{38}=111930$으로 답함'
    detect_cue: 각 자리 $\le9$ 조건이 쓰이지 않았다
    feedback: 각 자리는 $9$ 이하입니다. $9-$(자리)로 바꾸면 합이 $7$이 되어 상한을 자동으로 만족합니다.
    remedy: [RL-2]

