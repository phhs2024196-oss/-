stimuli: []

stem: |
  다음을 읽고 물음에 답하시오. (30점)

  $20$ 이상의 자연수 $n$에 대하여, 이차함수 $y=ax^2+bx+c$는 다음 조건을 만족한다.

  (가) $0<a<1$

  (나) 두 점 $(-1,1)$과 $(0,1)$을 지난다.

  (다) 두 이차함수 $y=ax^2+bx+c$와 $y=x^2$으로 둘러싸인 영역의 넓이는 $n$이다.

  이때, 이차함수 $y=ax^2+bx+c$의 꼭짓점의 $y$좌표를 $y_n$이라 하고, 두 이차함수 $y=ax^2+bx+c$와 $y=x^2$의 교점 중 $(-1,1)$이 아닌 점을 $(d_n,d_n^2)$이라 하자. 참고로, $d_n\ge\sqrt{2n}$이다.

subparts:
- id: '1'
  stem: |
    1-1) $\displaystyle\lim_{n\to\infty}y_n$을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '3/4', equivalents: ['0.75'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $c=1$, $a=b$이고 $(a-1)x^2+ax+1=0$의 두 근이 $-1$, $d_n$이므로 $a=\dfrac{d_n-1}{d_n}$, 꼭짓점의 $y$좌표 $1-\dfrac a4=\dfrac{3d_n+1}{4d_n}\to\dfrac34$.
    steps:
    - {id: 1a, content: '$y_n=1-\dfrac a4=\dfrac{3d_n+1}{4d_n}$, $d_n\ge\sqrt{2n}\to\infty$', criteria: [1.M1, 1.A1, 1.R1]}
    hint_ladder:
    - 두 점을 대입하면 $b$, $c$는 $a$로 어떻게 나타나는가?
    - 교점의 $x$좌표 $-1$, $d_n$을 근으로 하는 이차방정식을 세워 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.135
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        포물선 $y=ax^2+bx+c$가 $(0,1)$을 지나므로 $c=1$이고, $(-1,1)$도 지나므로 $1=a-b+1$이어서 $a=b$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $y=x^2$과 $y=ax^2+ax+1$의 교점은 $(-1,1)$과 $(d_n,d_n^2)$이므로 $ax^2+ax+1=x^2$, 즉 $(a-1)x^2+ax+1=0$의 두 근은 $-1$과 $d_n$이다. 근과 계수의 관계에 의해 $-d_n=\dfrac{1}{a-1}$, 곧 $d_n=\dfrac{-1}{a-1}$이고 $a=\dfrac{d_n-1}{d_n}$이다.
      criteria: [1.M1, 1.A1]
    - id: 1b-3
      content: |
        $y=ax^2+ax+1=a\left(x+\dfrac12\right)^2+1-\dfrac a4$의 꼭짓점은
        $\left(-\dfrac12,\,1-\dfrac a4\right)=\left(-\dfrac12,\,1-\dfrac{d_n-1}{4d_n}\right)=\left(-\dfrac12,\,\dfrac{3d_n+1}{4d_n}\right)$이다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        $d_n\ge\sqrt{2n}$이므로 $n$이 무한대로 갈 때 $d_n$은 무한대로 발산한다. 따라서 $\displaystyle\lim_{n\to\infty}y_n=\lim_{n\to\infty}\dfrac{3d_n+1}{4d_n}=\dfrac34$이다.
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $c=1$, $a=b$를 구하고 $(a-1)x^2+ax+1=0$의 두 근이 $-1$, $d_n$임을 이용해 근과 계수의 관계를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $a=\dfrac{d_n-1}{d_n}$(또는 $d_n=\dfrac1{1-a}$)과 $y_n=\dfrac{3d_n+1}{4d_n}$(또는 $1-\dfrac a4$)을 적었다.
      depends_on: [1.M1]
      steps: [1b-2, 1b-3]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $d_n\ge\sqrt{2n}$에서 $d_n\to\infty$임을 근거로 극한값 $\dfrac34$를 적었다.
      depends_on: [1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-7161}
  misconceptions:
  - id: MC-ALG-7161
    outcome_code: '71'
    wrong_work: '두 근의 곱을 $-d_n=1$로 두어 $d_n=-1$ 또는 $a$와 $d_n$의 관계를 잘못 얻음'
    detect_cue: 근과 계수의 관계 식에 분모 $a-1$이 없다
    feedback: 최고차항의 계수가 $a-1$이므로 두 근의 곱은 $\dfrac{1}{a-1}$, 합은 $-\dfrac{a}{a-1}$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    1-2) $\displaystyle\lim_{n\to\infty}\dfrac{d_n^2}{n}$을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 넓이 $\displaystyle\int_{-1}^{d_n}\{(a-1)x^2+ax+1\}dx=n$에 $a=\dfrac{d_n-1}{d_n}$을 넣으면 $d_n^3+3d_n^2+(3-6n)d_n+1=0$, 양변을 $d_n^3$으로 나누어 극한.
    steps:
    - {id: 2a, content: '$\dfrac{(d_n+1)^3}{6d_n}=n\Rightarrow 1+\dfrac3{d_n}+\dfrac{3-6n}{d_n^2}+\dfrac1{d_n^3}=0\Rightarrow\dfrac{d_n^2}{n}\to6$', criteria: [2.M1, 2.A1, 2.R1]}
    hint_ladder:
    - $0<a<1$이면 $-1\le x\le d_n$에서 어느 그래프가 위에 있는가?
    - 넓이 식을 $d_n$만의 식으로 바꾸어 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.136
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $0<a<1$이므로 $-1\le x\le d_n$에서 $ax^2+ax+1\ge x^2$이다. 조건 (다)에서
        $\displaystyle\int_{-1}^{d_n}(ax^2+ax+1-x^2)\,dx=n$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $\left[\dfrac{(a-1)x^3}{3}+\dfrac{ax^2}{2}+x\right]_{-1}^{d_n}=n$에 $a=\dfrac{d_n-1}{d_n}$을 대입하면
        $-\dfrac{d_n^3+1}{3d_n}+\dfrac{(d_n-1)(d_n^2-1)}{2d_n}+d_n+1=n$이고, 정리하면 $d_n^3+3d_n^2+(3-6n)d_n+1=0$을 얻는다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        양변을 $d_n^3$으로 나누면 $1+\dfrac{3}{d_n}+\dfrac{3-6n}{d_n^2}+\dfrac{1}{d_n^3}=0$이다. $d_n\to\infty$이므로 $\dfrac{3}{d_n}\to0$, $\dfrac{3}{d_n^2}\to0$, $\dfrac1{d_n^3}\to0$이고 따라서 $\dfrac{6n}{d_n^2}\to1$, 즉 $\displaystyle\lim_{n\to\infty}\dfrac{d_n^2}{n}=6$이다.
      criteria: [2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        구간 $[-1,d_n]$에서 (위 함수)$-$(아래 함수)의 정적분이 $n$이라는 식을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $d_n^3+3d_n^2+(3-6n)d_n+1=0$ 또는 $\dfrac{(d_n+1)^3}{6d_n}=n$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        양변을 $d_n^3$(또는 $d_n^2$)으로 나누고 $d_n\to\infty$를 근거로 극한값 $6$을 적었다.
      depends_on: [2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-7162}
  misconceptions:
  - id: MC-CAL-7162
    outcome_code: '72'
    wrong_work: '$\displaystyle\int_{-1}^{d_n}\{x^2-(ax^2+ax+1)\}dx=n$으로 세워 $d_n^3+3d_n^2+(3+6n)d_n+1=0$을 얻음'
    detect_cue: 삼차식의 일차항 계수가 $3+6n$이거나 양의 근이 없다
    feedback: $0<a<1$이면 $(a-1)x^2+ax+1$은 위로 볼록이므로 두 교점 사이에서 $ax^2+ax+1\ge x^2$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    1-3) $\displaystyle\lim_{n\to\infty}d_{n+1}(d_{n+1}-d_n)$을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $n+1$과 $n$에 대한 삼차식을 빼면 $d_{n+1}-d_n=\dfrac{6d_{n+1}}{(d_n^2+d_nd_{n+1}+d_{n+1}^2)+3(d_n+d_{n+1})+(3-6n)}$이고, 분자·분모를 $n$으로 나누면 $\dfrac{36}{18-6}=3$.
    steps:
    - {id: 3a, content: '$d_{n+1}(d_{n+1}-d_n)=\dfrac{6d_{n+1}^2}{(d_n^2+d_nd_{n+1}+d_{n+1}^2)+3(d_n+d_{n+1})+(3-6n)}\to\dfrac{36}{12}=3$', criteria: [3.M1, 3.A1, 3.R1]}
    hint_ladder:
    - 1-2)의 삼차식을 $n$과 $n+1$에 대해 각각 쓰고 빼 보자.
    - $\dfrac{d_nd_{n+1}}{n}$의 극한은 어떻게 구할 수 있는가?
  - id: S3-B
    audience: B
    source_flow: 문항카드 p.136
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $d_{n+1}^3+3d_{n+1}^2+(3-6(n+1))d_{n+1}+1=0$과 $d_n^3+3d_n^2+(3-6n)d_n+1=0$을 빼면
        $(d_{n+1}-d_n)(d_n^2+d_nd_{n+1}+d_{n+1}^2)+3(d_{n+1}-d_n)(d_n+d_{n+1})+(3-6n)(d_{n+1}-d_n)-6d_{n+1}=0$을 얻는다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        따라서 $d_{n+1}-d_n=\dfrac{6d_{n+1}}{(d_n^2+d_nd_{n+1}+d_{n+1}^2)+3(d_n+d_{n+1})+(3-6n)}$이므로
        $d_{n+1}(d_{n+1}-d_n)=\dfrac{6d_{n+1}^2}{(d_n^2+d_nd_{n+1}+d_{n+1}^2)+3(d_n+d_{n+1})+(3-6n)}$이 된다.
      criteria: [3.A1]
    - id: 3b-3
      content: |
        분자와 분모를 $n$으로 나누고 $\displaystyle\lim_{n\to\infty}\dfrac{d_n^2}{n}=6$을 이용하면 $\dfrac{d_{n+1}^2}{n}\to6$, $\dfrac{d_nd_{n+1}}{n}\to6$, $\dfrac{d_n+d_{n+1}}{n}\to0$이므로
        $\displaystyle\lim_{n\to\infty}d_{n+1}(d_{n+1}-d_n)=\dfrac{36}{18-6}=3$을 얻는다.
      criteria: [3.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $n+1$과 $n$에 대한 삼차식을 빼서 $d_{n+1}-d_n$을 인수로 묶은 식을 썼다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 4}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $d_{n+1}(d_{n+1}-d_n)$을 분수식으로 바르게 나타냈다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
