  - '정적분 $\displaystyle\int_{-3}^{3}x(f(x)+1)g(x)\,dx$'
  concepts:
  - '함수의 극한의 성질(분모 → 0이면 분자 → 0)'
  - '역함수의 정의와 역함수의 미분법'
  - '미분계수의 정의'
  - '기함수의 대칭 구간 정적분'
  - '치환적분법, 부분적분(곱의 미분)'
  tools:
  - '$f(x)+f(-x)-2f(0)=2bx^2$'
  - '$f(0)=2g(0)\Rightarrow f\!\left(\tfrac d2\right)=0$'
  - $g'(0)=\dfrac{1}{f'(g(0))}$
  - $x=f(t)$ 치환, $tf(t)f'(t)=t\dfrac{d}{dt}\dfrac{f(t)^2}{2}$
  conditions:
  - (가) $f'(x)>0$ → $f$는 증가, 역함수 존재, $c=f'(0)>0$
