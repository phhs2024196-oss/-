stimuli: []

stem: |
  다음을 읽고 물음에 답하시오. (30점)

  삼차함수 $f(x)=x^3+bx^2+cx+d$가 다음 조건을 만족한다.

  (가) 모든 $x$에 대하여 $f'(x)>0$이다.

  (나) $\displaystyle\lim_{x\to0}\dfrac{f(x)+f(-x)-2f(0)}{x^2}=0$

  (다) 함수 $f(x)$의 역함수를 $g(x)$라 할 때, $\displaystyle\lim_{x\to0}\dfrac{f(x)-2g(x)}{x}=1$이다.

subparts:
- id: '1'
  stem: |
    2-1) $f\!\left(\dfrac d2\right)$의 값을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (다)에서 분모 $\to0$이므로 분자 $f(0)-2g(0)=0$, $g(0)=\dfrac d2$이고 $g$가 $f$의 역함수이므로 $f\!\left(\dfrac d2\right)=0$.
    steps:
    - {id: 1a, content: '$d=f(0)=2g(0)\Rightarrow g(0)=\dfrac d2\Rightarrow f\!\left(\dfrac d2\right)=0$', criteria: [1.M1, 1.R1, 1.A1]}
    hint_ladder:
    - 분모가 $0$으로 가는데 극한값이 존재하면 분자는 어떻게 되어야 하는가?
    - $g(0)=k$는 $f(k)=0$과 같은 뜻이다.
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.136
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가)에서 $f$는 증가하는 연속함수이므로 역함수 $g$가 존재하고 연속이다. 조건 (다)에서 $x\to0$일 때 분모가 $0$으로 가고 극한값이 존재하므로 분자도 $0$으로 가야 한다. 즉 $f(0)-2g(0)=0$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        따라서 $d=f(0)=2g(0)$, 곧 $g(0)=\dfrac d2$이다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        $g$는 $f$의 역함수이므로 $g(0)=\dfrac d2$는 $f\!\left(\dfrac d2\right)=0$을 뜻한다. 즉 $f\!\left(\dfrac d2\right)=g^{-1}\!\left(\dfrac d2\right)=0$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        (다)에서 분모 $\to0$이므로 분자 $f(x)-2g(x)\to0$, 곧 $f(0)-2g(0)=0$이라고 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $f(0)=d$에서 $g(0)=\dfrac d2$를 이끌었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        역함수의 정의로 $f\!\left(\dfrac d2\right)=0$을 적었다.
      depends_on: [1.R1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-7164}
  misconceptions:
  - id: MC-CAL-7164
    outcome_code: '71'
    wrong_work: |
      (다)를 바로 $f'(0)-2g'(0)=1$로만 바꾸고 $f(0)=2g(0)$ 조건을 쓰지 않음
    detect_cue: $f(0)-2g(0)=0$ 또는 $g(0)=\dfrac d2$가 답안에 없다
    feedback: 분모가 $0$으로 가는 분수식의 극한이 존재하려면 먼저 분자가 $0$으로 가야 합니다. 그 조건이 $f(0)=2g(0)$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    2-2) 함수 $f(x)$를 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'x**3 + 2*x', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (나)에서 $b=0$, $f\!\left(\dfrac d2\right)=\dfrac d8(d^2+4c+8)=0$과 $c=f'(0)>0$에서 $d=0$, (다)에서 $f'(0)-\dfrac{2}{f'(0)}=1$이므로 $c=2$.
    steps:
    - {id: 2a, content: '$b=0$, $d=0$, $c-\dfrac2c=1\Rightarrow c=2$, $f(x)=x^3+2x$', criteria: [2.M1, 2.A1, 2.M2, 2.A2]}
    hint_ladder:
    - $f(x)+f(-x)-2f(0)$을 전개해 보자.
    - $g'(0)$은 역함수의 미분법으로 무엇과 같은가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.136
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)+f(-x)-2f(0)=2bx^2$이므로 조건 (나)에서 $2b=\displaystyle\lim_{x\to0}\dfrac{f(x)+f(-x)-2f(0)}{x^2}=0$, 곧 $b=0$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        2-1)로부터 $d=f(0)=2g(0)$이고 $f\!\left(\dfrac d2\right)=0$이다. $b=0$이므로
        $f\!\left(\dfrac d2\right)=\dfrac{d^3}{8}+\dfrac{cd}{2}+d=\dfrac d8\times(d^2+4c+8)=0$이고, 조건 (가)에서 $c=f'(0)>0$이므로 $d^2+4c+8>0$, 따라서 $d=0$이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        이때 $f(0)=g(0)=0$이고, 조건 (다)에 의해
        $\displaystyle\lim_{x\to0}\dfrac{f(x)-2g(x)}{x}=\lim_{x\to0}\dfrac{f(x)-f(0)-2(g(x)-g(0))}{x}=f'(0)-2g'(0)=f'(0)-\dfrac{2}{f'(g(0))}=f'(0)-\dfrac{2}{f'(0)}=1$
        을 얻는다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        이 식을 풀면 $f'(0)=2$ 또는 $f'(0)=-1$이다. 조건 (가)에 의해 $f'(x)>0$이어야 하므로 $c=f'(0)=2$이다. 따라서 $f(x)=x^3+2x$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $f(x)+f(-x)-2f(0)=2bx^2$을 이용해 $b=0$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $f\!\left(\dfrac d2\right)=0$과 $c>0$에서 $d=0$을 근거와 함께 얻었다.
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        (다)를 미분계수로 바꾸어 $f'(0)-2g'(0)=1$, $g'(0)=\dfrac{1}{f'(0)}$을 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $f'(0)=-1$을 (가)로 배제하고 $f(x)=x^3+2x$를 적었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-7165}
  misconceptions:
  - id: MC-CAL-7165
    outcome_code: '72'
    wrong_work: |
      $d$를 정하기 전에 $g'(0)=\dfrac{1}{f'(0)}$을 써서 $c$를 구함
    detect_cue: $g'(0)=\dfrac1{f'(0)}$을 쓰기 전에 $g(0)=0$ 확인이 없다
    feedback: 역함수의 미분법은 $g'(0)=\dfrac{1}{f'(g(0))}$입니다. $g(0)=0$(곧 $d=0$)을 먼저 보여야 $f'(0)$을 쓸 수 있습니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    2-3) $\displaystyle\int_{-3}^{3}x(f(x)+1)g(x)\,dx$의 값을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '706/105', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $xf(x)g(x)$는 기함수라 적분이 $0$, 남은 $\displaystyle\int_{-3}^3xg(x)dx$는 $x=f(t)$로 치환해 $\displaystyle\int_{-1}^{1}tf(t)f'(t)dt$.
    steps:
    - {id: 3a, content: '$\displaystyle\int_{-1}^1 t\dfrac{d}{dt}\dfrac{f(t)^2}{2}dt=9-\int_{-1}^1\dfrac{(t^3+2t)^2}{2}dt=9-\dfrac{239}{105}=\dfrac{706}{105}$', criteria: [3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - $f$와 $g$는 둘 다 원점 대칭이다. $xf(x)g(x)$는?
    - $g(x)=t$로 치환하면 $x=f(t)$이고 적분 구간은?
  - id: S3-B
    audience: B
    source_flow: 문항카드 p.137
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        두 함수 $f(x)$와 $g(x)$는 각각 $f(x)=-f(-x)$와 $g(x)=-g(-x)$를 만족한다. 따라서 $f(x)xg(x)$는 원점 대칭 함수이며 $\displaystyle\int_{-3}^{3}f(x)xg(x)\,dx=0$이 되므로
        $\displaystyle\int_{-3}^{3}x(f(x)+1)g(x)\,dx=\int_{-3}^{3}xg(x)\,dx$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $g(x)=t$로 치환하면 $x=f(t)$, $dx=f'(t)dt$이고 $f(-1)=-3$, $f(1)=3$이므로 적분 구간은 $-1$에서 $1$이다.
        $\displaystyle\int_{-3}^{3}xg(x)\,dx=\int_{-1}^{1}f(t)\,t\,f'(t)\,dt=\int_{-1}^{1}t\,\dfrac{d}{dt}\left(\dfrac{f^2(t)}{2}\right)dt$
      criteria: [3.M2]
    - id: 3b-3
      content: |
        $\displaystyle=\left[t\,\dfrac{f^2(t)}{2}\right]_{-1}^{1}-\int_{-1}^{1}\dfrac{f^2(t)}{2}\,dt=9-\int_{-1}^{1}\dfrac{(t^3+2t)^2}{2}\,dt=9-\dfrac{239}{105}=\dfrac{706}{105}$
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $f$, $g$가 원점 대칭임을 밝히고 $\displaystyle\int_{-3}^{3}xf(x)g(x)\,dx=0$을 적었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A2], max_points: 3}
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: |
        $x=f(t)$(또는 $g(x)=t$)로 치환하고 적분 구간을 $[-1,1]$로 바꾼 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        부분적분(또는 전개)으로 $\dfrac{706}{105}$을 얻었다.
      depends_on: [3.M2]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-CAL-7166}
  misconceptions:
  - id: MC-CAL-7166
    outcome_code: '73'
    wrong_work: '$x=f(t)$로 치환한 뒤 적분 구간을 $-3$에서 $3$ 그대로 둠'
    detect_cue: 치환 후 적분 구간이 $[-3,3]$이다
    feedback: $x=-3,3$에 대응하는 $t$는 $f(t)=\pm3$인 $t=\mp1$입니다. 치환하면 구간도 바꾸어야 합니다.
    remedy: [RL-3]

