intent: |
  주어진 극한 조건들이 의미하는 바를 해석하여 삼차함수의 계수 사이의 관계를 유추하고, 역함수의 정의와 미분법, 원점 대칭 함수의 성질과 치환적분을 활용해 문제를 논리적으로 해결하는 능력을 평가한다(문항카드 '출제 의도'·'채점 기준' 요지).
key_idea: |
  (다)의 극한이 존재하므로 $f(0)=2g(0)$, 곧 $g(0)=\dfrac d2$이고 $f\!\left(\dfrac d2\right)=0$. (나)에서 $b=0$, $f\!\left(\dfrac d2\right)=\dfrac d8(d^2+4c+8)=0$과 $c>0$에서 $d=0$, $f'(0)-\dfrac{2}{f'(0)}=1$에서 $c=2$.
stuck: |
  (다)를 '분모 → 0이면 분자 → 0'으로 읽어 $f(0)=2g(0)$을 얻고, 이를 역함수의 정의로 $f\!\left(\dfrac d2\right)=0$으로 바꾸는 발상
