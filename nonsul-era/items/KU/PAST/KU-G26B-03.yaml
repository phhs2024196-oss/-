stimuli: []

stem: |
  다음을 읽고 물음에 답하시오. (20점)

  세 실수 $a$, $b$, $c$와 세 점 $\mathrm{A}(c,0)$, $\mathrm{B}(-c,0)$, $\mathrm{O}(0,0)$에 대하여, $\lvert\overrightarrow{\mathrm{OP}}-\overrightarrow{\mathrm{OA}}\rvert+\lvert\overrightarrow{\mathrm{OP}}-\overrightarrow{\mathrm{OB}}\rvert=b$를 만족하는 점 $\mathrm{P}$의 집합이 나타내는 곡선 $C$와 직선 $y=\dfrac{1}{\sqrt2}x+a$는 만나지 않는다. 곡선 $C$ 위의 점 $\mathrm{P}$와 직선 $y=\dfrac{1}{\sqrt2}x+a$ 사이의 거리가 최소일 때 점 $\mathrm{P}$의 $x$좌표를 $x_1$이라 하고, 거리가 최대일 때 $x$좌표를 $x_2$라 하자. (단, $b>2c\ge0$이다.)

subparts:
- id: '1'
  stem: |
    3-1) $x_1+x_2$의 값을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 거리가 최소·최대인 점은 직선과 평행한 두 접선의 접점이고, 타원이 원점 대칭이므로 두 접점도 원점 대칭이다.
    steps:
    - {id: 1a, content: '$x_1^2=x_2^2=\dfrac{b^4}{4b^2+32d^2}$, $x_1=-x_2$이므로 $x_1+x_2=0$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $\lvert\overrightarrow{\mathrm{OP}}-\overrightarrow{\mathrm{OA}}\rvert$는 어떤 선분의 길이인가?
    - 곡선 위 점에서 직선까지 거리가 최소·최대인 곳에서 접선의 기울기는?
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.137
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\lvert\overrightarrow{\mathrm{OP}}-\overrightarrow{\mathrm{OA}}\rvert+\lvert\overrightarrow{\mathrm{OP}}-\overrightarrow{\mathrm{OB}}\rvert=\overline{\mathrm{PA}}+\overline{\mathrm{PB}}=b$에서 점 $\mathrm{P}$의 자취는 장축의 길이가 $b$인 타원이 된다. 이때 단축의 길이를 $2d$라고 하면 구하는 방정식은 $\dfrac{4x^2}{b^2}+\dfrac{y^2}{d^2}=1$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        곡선 $C$와 직선은 만나지 않으므로 거리가 최소·최대인 점에서 $C$의 접선은 주어진 직선과 평행하다. 타원 위의 점 $(x_1,y_1)$에서의 접선의 방정식은 $\dfrac{4x_1x}{b^2}+\dfrac{y_1y}{d^2}=1$이고, 주어진 직선의 기울기가 $\dfrac1{\sqrt2}$이므로 기울기가 $\dfrac1{\sqrt2}$인 경우를 생각하면 $y_1=-\dfrac{4\sqrt2\,d^2x_1}{b^2}$을 얻는다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        이를 타원의 방정식에 대입하면 $x_1^2=\dfrac{b^4}{4b^2+32d^2}$을 얻는다. 두 접점의 $x$좌표인 $x_1$과 $x_2$는 이차방정식 $x^2-\dfrac{b^4}{4b^2+32d^2}=0$의 두 근이 되므로, 근과 계수의 관계에 의해 $x_1+x_2=0$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        자취가 장축의 길이 $b$인 타원임을 밝히고 방정식 $\dfrac{4x^2}{b^2}+\dfrac{y^2}{d^2}=1$(또는 동치식)을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        거리가 최소·최대인 점은 기울기 $\dfrac1{\sqrt2}$인 접선의 접점임을 쓰고 접점 좌표의 관계식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $x_1^2=\dfrac{b^4}{4b^2+32d^2}$ 또는 두 접점이 원점 대칭임을 근거로 $x_1+x_2=0$을 적었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-7167}
  - {code: '72', misconception: MC-GEO-7168}
  misconceptions:
  - id: MC-GEO-7167
    outcome_code: '71'
    wrong_work: '장축 길이의 절반을 $b$로 두어 $\dfrac{x^2}{b^2}+\dfrac{y^2}{b^2-c^2}=1$로 씀'
    detect_cue: 타원의 방정식에서 $x^2$의 분모가 $\dfrac{b^2}{4}$가 아니다
    feedback: 두 초점까지 거리의 합은 장축의 길이 $2\times$(장반축)입니다. 합이 $b$이면 장반축은 $\dfrac b2$입니다.
    remedy: [RL-1]
  - id: MC-GEO-7168
    outcome_code: '72'
    wrong_work: '거리가 최소·최대인 점을 장축의 양 끝 $(\pm\tfrac b2,0)$으로 잡음'
    detect_cue: 접선의 기울기 조건 없이 꼭짓점 좌표로 $x_1$, $x_2$를 정함
    feedback: 곡선 위의 점과 직선 사이 거리가 최소·최대인 곳에서는 곡선의 접선이 그 직선과 평행합니다.
    remedy: [RL-2]

- id: '2'
  stem: |
    3-2) $x_1x_2=-\dfrac{b^2}{12}$일 때, 곡선 $C$의 길이를 $\ell$이라 하자. 이때, $\dfrac{\ell}{b}$의 값을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: 'pi', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x_1x_2=-\dfrac{b^4}{4b^2+32d^2}=-\dfrac{b^2}{12}$에서 $d=\dfrac b2$, 곧 $C$는 반지름 $\dfrac b2$인 원이므로 $\ell=\pi b$.
    steps:
    - {id: 2a, content: '$4b^2+32d^2=12b^2\Rightarrow d=\dfrac b2\Rightarrow x^2+y^2=\left(\dfrac b2\right)^2$, $\dfrac{\ell}{b}=\pi$', criteria: [2.M1, 2.A1, 2.R1]}
    hint_ladder:
    - 3-1)의 이차방정식에서 두 근의 곱은?
    - 장반축과 단반축이 같으면 곡선은 무엇인가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.137
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 교점의 $x$좌표의 곱 $x_1x_2$는 3-1)에서 구한 이차방정식 $x^2-\dfrac{b^4}{4b^2+32d^2}=0$의 두 해의 곱이 되므로, 근과 계수의 관계에 의해 $-\dfrac{b^4}{4b^2+32d^2}$이 된다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        문제에서 이 값이 $-\dfrac{b^2}{12}$으로 주어졌으므로 $4b^2+32d^2=12b^2$, 곧 $d=\dfrac b2$를 얻는다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        따라서 타원의 방정식은 원의 방정식 $x^2+y^2=\left(\dfrac b2\right)^2$이 되고, 반지름은 $\dfrac b2$이므로 곡선의 길이 $\ell$은 원의 둘레를 구하는 공식에 의해 $b\pi$가 된다. 따라서 $\dfrac{\ell}{b}=\pi$이다.
      criteria: [2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        3-1)의 결과로 $x_1x_2=-\dfrac{b^4}{4b^2+32d^2}$(또는 $-x_1^2$)을 적었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $d=\dfrac b2$(장축과 단축의 길이가 같음, 또는 $c=0$)를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        곡선 $C$가 반지름 $\dfrac b2$인 원임을 밝히고 $\dfrac{\ell}{b}=\pi$를 적었다.
      depends_on: [2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-7169}
  misconceptions:
  - id: MC-GEO-7169
    outcome_code: '71'
    wrong_work: '$d$를 구한 뒤에도 타원으로 보고 둘레를 근삿값 또는 $\pi(\text{장반축}+\text{단반축})$ 꼴로 씀'
    detect_cue: 원의 방정식 $x^2+y^2=\dfrac{b^2}{4}$가 없다
    feedback: $d=\dfrac b2$이면 장반축과 단반축이 같아 두 초점이 일치($c=0$)하고 곡선은 원입니다.
    remedy: [RL-3]

