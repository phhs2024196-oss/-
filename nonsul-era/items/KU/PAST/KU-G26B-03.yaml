intent: |
  벡터로 표현된 식의 의미를 이해하여 점의 자취가 타원임을 파악하고, 타원과 직선의 관계(기울기가 주어진 접선)를 활용하여 거리의 최대·최소가 되는 점과 곡선의 길이를 논리적으로 구하는 능력을 평가한다(문항카드 '출제 의도'·'채점 기준' 요지).
key_idea: |
  자취는 장축의 길이가 $b$인 타원 $\dfrac{4x^2}{b^2}+\dfrac{y^2}{d^2}=1$이고, 거리가 최소·최대인 점은 기울기 $\dfrac1{\sqrt2}$인 접선의 접점이므로 $x^2=\dfrac{b^4}{4b^2+32d^2}$의 두 근이다.
stuck: |
  직선과 만나지 않는 타원 위 점에서 직선까지 거리의 최대·최소를 '주어진 직선과 평행한 접선의 접점'으로 바꾸는 발상
