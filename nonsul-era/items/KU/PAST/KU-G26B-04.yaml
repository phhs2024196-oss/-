intent: |
  날짜를 나타내는 8자리 숫자의 각 자리 조건을 정확히 해석하여 경우를 판단하고, 순열을 활용하여 조건을 만족하는 경우의 수를 구하는 과정을 평가한다(문항카드 '출제 의도'·'채점 기준' 요지).
key_idea: |
  ⑤는 $0$ 또는 $1$, ⑦은 $0\sim3$이라는 제약이 큰 자리부터 보면 ①$=1$, ⑤$=0$, ⑦$=2$로 고정되고, 나머지 다섯 자리는 $3\sim9$의 일곱 숫자 중 서로 다른 다섯 개를 나열하는 순열 ${}_7\mathrm{P}_5=2520$이다.
stuck: |
  ①, ⑤, ⑦ 세 자리가 모두 $\{0,1,2,3\}$ 안의 서로 다른 숫자여야 하고, ⑦$=3$이면 ⑧이 $0$ 또는 $1$이어야 한다는 충돌을 찾아내는 것
