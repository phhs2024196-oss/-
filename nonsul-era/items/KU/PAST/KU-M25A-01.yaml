    원문 표기 차이: 채점 기준은 $f(x)=x^2+bx+c$에서 $b=2$, $c=0$으로, 예시 답안은 $f(x)=x^2+cx+d$에서 $c=2$, $d=0$으로 문자를 달리 씀(해설 B는 예시 답안 문자를 따름). 예시 답안 1-2의 적분 계산 마지막 줄이 '$=1$'로 적혀 있으나 조건 (나)에 따라 '$=\frac16$'이어야 함(오기, 결론 $\beta-\alpha=1$은 맞음). 예시 답안은 (다)의 포물선을 $h(x)$로 부름.
    채점 기준에 부분점수 배분이 없어 마크 배점은 채점 기준 항목(1-1: 2항목, 1-2: 3항목)을 따라 자체 배분.

