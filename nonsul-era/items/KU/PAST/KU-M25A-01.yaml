  materials:
  - '이차함수 $f(x)$와 로그·정적분을 포함한 극한 조건'
  - '두 점 $(\alpha,f(\alpha))$, $(\beta,f(\beta))$를 지나는 직선 $y=k(x)$'
  - '위로 볼록한 포물선 $y=-(x-a)^2+b$'
  concepts:
  - '함수의 극한($\lim_{h\to\infty}(1+\frac1h)^h=e$, $\lim_{h\to0}\frac{\sin h}{h}=1$)'
  - '다항함수의 정적분'
  - '포물선과 할선 사이의 넓이'
  - '이차방정식의 근과 계수의 관계'
  tools:
  - '$\ln(h+1)-\ln h=\ln\left(1+\frac1h\right)$ 변형'
  - '정적분을 직접 계산해 극한을 구함'
  - '$\int_\alpha^\beta(x-\alpha)(\beta-x)\,dx=\frac{(\beta-\alpha)^3}{6}$'
  - '근과 계수의 관계'
  conditions:
  - '(가)(i) → $\lim_{h\to\infty}\frac{f(h)}{h^2}=1$, 즉 최고차항 계수 1'
  - '(가)(ii) → 상수항 $0$(그렇지 않으면 발산), 일차항 계수 $2$'
  - '(나) → $\beta-\alpha=1$'
  - '(다) → $\alpha$, $\beta$는 $f(x)-\{-(x-a)^2+b\}=0$의 두 근'
  stimuli_used: [가, 나, 다]
  subpart_links: '(1-2)는 (1-1)에서 구한 $f(x)=x^2+2x$를 사용'

