stimuli:
- label: 가
  body: |
    이차함수 $y=f(x)$가 다음 조건을 만족한다.
    (ⅰ) $\displaystyle\lim_{h\to\infty}f(h)\frac{\ln(h+1)-\ln(h)}{h}=1$,　(ⅱ) $\displaystyle\lim_{h\to0}\frac{1}{h^2}\int_h^{h+\sin(h)}f(x)\,dx=3$
- label: 나
  body: |
    두 실수 $\alpha<\beta$에 대하여 두 점 $(\alpha,f(\alpha))$, $(\beta,f(\beta))$를 지나는 직선의 방정식을 $y=k(x)$라 할 때, $\displaystyle\int_\alpha^\beta(k(x)-f(x))\,dx=\frac16$이다.
- label: 다
  body: |
    두 실수 $a,b$에 대하여 포물선 $y=-(x-a)^2+b$가 두 점 $(\alpha,f(\alpha))$, $(\beta,f(\beta))$를 지난다.

stem: |
  다음 글을 읽고 물음에 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    이차함수 $f(x)$를 구하고, 그 근거를 설명하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'x**2 + 2*x', equivalents: ['x*(x+2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      (ⅰ)은 $\lim\frac{f(h)}{h^2}=1$로 바뀌어 최고차항 계수가 1이고, (ⅱ)는 적분을 직접 계산하면 상수항 $d=0$, $\frac{3c}{2}=3$을 준다.
    steps:
    - id: 1a
      content: |
        $f(x)=x^2+cx+d$, $\displaystyle\lim_{h\to0}\frac{\frac c2\{(h+\sin h)^2-h^2\}+d\sin h}{h^2}=3\Rightarrow d=0,\ c=2$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - $\ln(h+1)-\ln(h)$를 하나의 로그로 묶어 보자.
    - 정적분을 $f(x)=x^2+cx+d$로 직접 계산한 뒤 $h^2$으로 나누어 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.9
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가) (ⅰ)로부터
        $$\lim_{h\to\infty}f(h)\frac{\ln(h+1)-\ln(h)}{h}=\lim_{h\to\infty}\left(\frac{f(h)}{h^2}\right)\left(\ln\left(1+\frac1h\right)^h\right)=\lim_{h\to\infty}\left(\frac{f(h)}{h^2}\right)=1$$
        을 얻고($\ln\left(1+\frac1h\right)^h\to\ln e=1$), 이차함수 $f(x)$가 $f(x)=x^2+cx+d$의 형태임을 유도한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        조건 (가) (ⅱ)로부터
        $$\lim_{h\to0}\frac{\int_h^{h+\sin(h)}f(x)\,dx}{h^2}=\lim_{h\to0}\frac{\frac{(h+\sin h)^3-h^3}{3}+\frac c2\{(h+\sin h)^2-h^2\}+d\sin h}{h^2}=\lim_{h\to0}\frac{\frac c2\{(h+\sin h)^2-h^2\}+d\sin h}{h^2}=3$$
        이다. ($\frac{\sin h}{h}\to1$이므로 첫째 항을 $h^2$으로 나눈 것은 $0$으로 수렴하고, $d\ne0$이면 $\frac{d\sin h}{h^2}$이 발산한다.)
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\dfrac{(h+\sin h)^2-h^2}{h^2}=2\dfrac{\sin h}{h}+\left(\dfrac{\sin h}{h}\right)^2\to3$이므로 $\dfrac{3c}{2}=3$, $d=0$을 유도한다. 따라서 구하는 이차함수는 $f(x)=x^2+2x$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        조건 (가)(ⅰ)을 $\lim_{h\to\infty}\frac{f(h)}{h^2}=1$로 바꾸어 $f(x)=x^2+cx+d$ 꼴(최고차항 계수 1)임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        조건 (가)(ⅱ)의 정적분을 $f(x)=x^2+cx+d$로 계산해 극한식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: |
        $d=0$, $c=2$를 근거와 함께 얻어 $f(x)=x^2+2x$를 적었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-7181}
  - {code: '72', misconception: MC-CAL-7182}
  misconceptions:
  - id: MC-CAL-7181
    outcome_code: '71'
    wrong_work: '$\ln(h+1)-\ln h$를 $1$ 정도로 보고 $\frac{f(h)}{h}\to1$이라 하여 $f$를 일차식처럼 처리'
    detect_cue: 최고차항 계수를 1로 정하는 근거에 $\frac{f(h)}{h^2}$이 없다
    feedback: $\ln(h+1)-\ln h=\ln\left(1+\frac1h\right)$은 $h\to\infty$일 때 $\frac1h$처럼 작아집니다. 분모 $h$와 합치면 $h^2$이 됩니다.
    remedy: [RL-1]
  - id: MC-CAL-7182
    outcome_code: '72'
    wrong_work: '$d$를 남긴 채 $\frac{3c}{2}=3$만 구해 $f(x)=x^2+2x+d$로 답함'
    detect_cue: 상수항이 0이라는 근거(발산 방지)가 없다
    feedback: 적분 구간의 길이 $\sin h$가 $h$ 정도이므로 상수항 $d$가 있으면 $\frac{d\sin h}{h^2}$이 발산합니다.
    remedy: [RL-2]

- id: '2'
  stem: |
    $b$를 $a$에 대한 함수($\alpha$, $\beta$가 들어있지 않은 함수)로 표현하고, 그 근거를 설명하시오. (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: expression, value: '(a**2 + 2*a)/2', equivalents: ['a**2/2 + a'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      (나)에서 $\frac{(\beta-\alpha)^3}{6}=\frac16$이므로 $\beta=\alpha+1$이고, (다)에서 $\alpha$, $\beta$는 $2x^2+2(1-a)x+a^2-b=0$의 두 근이다.
    steps:
    - id: 2a
      content: |
        $\alpha+\beta=a-1$, $\alpha\beta=\frac{a^2-b}{2}$, $\beta=\alpha+1\Rightarrow b=\frac{a^2+2a}{2}$
      criteria: ['2.M1', '2.A1', '2.M2', '2.A2']
    hint_ladder:
    - 포물선과 할선 사이 넓이는 두 교점의 $x$좌표 차로만 정해진다.
    - $\alpha$, $\beta$는 두 포물선의 교점의 $x$좌표이다.
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.9
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 점 $(\alpha,f(\alpha))$, $(\beta,f(\beta))$를 지나는 직선의 방정식은
        $$y=k(x)=\frac{f(\beta)-f(\alpha)}{\beta-\alpha}(x-\alpha)+f(\alpha)=(\beta+\alpha+2)(x-\alpha)+\alpha^2+2\alpha=(\beta+\alpha+2)x-\alpha\beta$$
        이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 조건 (나)를 활용하면
        $$\int_\alpha^\beta(k(x)-f(x))\,dx=\int_\alpha^\beta\{(\beta+\alpha)x-\alpha\beta-x^2\}\,dx=\frac{(\beta-\alpha)^3}{6}=\frac16$$
        로부터 $\beta-\alpha=1$을 얻는다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        조건 (다)로부터 포물선 $y=-(x-a)^2+b$가 두 점 $(\alpha,f(\alpha))$, $(\beta,f(\beta))$를 지나므로 $\alpha$, $\beta$는
        $$f(x)-\{-(x-a)^2+b\}=2x^2+2x(1-a)+a^2-b=0$$
        의 두 근이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        근과 계수의 관계로부터 $\alpha+\beta=a-1$, $\alpha\beta=\dfrac{a^2-b}{2}$를 얻고, $\beta=\alpha+1$을 대입하면 $\alpha=\dfrac{a-2}{2}$, $\alpha\beta=\dfrac{a^2-2a}{4}=\dfrac{a^2-b}{2}$이므로 정리하면 $b=\dfrac{a^2+2a}{2}$를 얻는다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        직선 $k(x)$를 구하거나 $k(x)-f(x)=-(x-\alpha)(x-\beta)$로 놓아 (나)의 정적분을 계산하는 식을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\int_\alpha^\beta(k(x)-f(x))\,dx=\frac{(\beta-\alpha)^3}{6}=\frac16$에서 $\beta-\alpha=1$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: |
        (다)에서 $\alpha$, $\beta$가 이차방정식 $f(x)-\{-(x-a)^2+b\}=0$, 즉 $2x^2+2(1-a)x+a^2-b=0$의 두 근임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: |
        근과 계수의 관계와 $\beta=\alpha+1$로 $b=\frac{a^2+2a}{2}$(또는 $\frac{a^2}{2}+a$)를 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '73', misconception: MC-CAL-7183}
  - {code: '74', misconception: MC-ALG-7184}
  misconceptions:
  - id: MC-CAL-7183
    outcome_code: '73'
    wrong_work: '$\frac{(\beta-\alpha)^3}{6}=\frac16$을 $\beta-\alpha=\frac16$ 또는 $(\beta-\alpha)^3=\frac16$으로 정리'
    detect_cue: $\beta-\alpha$의 값이 1이 아니다
    feedback: $\frac{(\beta-\alpha)^3}{6}=\frac16$이면 $(\beta-\alpha)^3=1$이고 실수이므로 $\beta-\alpha=1$입니다.
    remedy: [RL-3]
  - id: MC-ALG-7184
    outcome_code: '74'
    wrong_work: '$2x^2+2(1-a)x+a^2-b=0$에서 $\alpha+\beta=2(a-1)$, $\alpha\beta=a^2-b$로 씀'
    detect_cue: 근과 계수의 관계에서 이차항 계수 2로 나누지 않았다
    feedback: 근과 계수의 관계는 $\alpha+\beta=-\frac{B}{A}$, $\alpha\beta=\frac{C}{A}$입니다. 이차항 계수 $A=2$로 나누세요.
    remedy: [RL-4]

