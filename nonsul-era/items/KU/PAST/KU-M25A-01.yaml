intent: |
  주어진 조건(함수의 극한, 정적분, 포물선과 직선)이 의미하는 바를 정확히 이해하고 활용하여 이차함수를 결정하고, 이차방정식의 근과 계수의 관계로 $a$, $b$ 사이의 관계식을 논리적으로 설명할 수 있는 능력을 평가한다(문항카드 '출제 의도'·'문항 해설' 요지).
key_idea: |
  (가)(i)에서 $f(h)/h^2\to1$로 최고차항 계수 1, (ii)에서 상수항 0과 일차항 계수 2를 얻고, (나)의 넓이 $\dfrac{(\beta-\alpha)^3}{6}=\dfrac16$에서 $\beta=\alpha+1$, (다)에서 $\alpha$, $\beta$가 $f(x)-h(x)=0$의 두 근임을 이용해 근과 계수의 관계로 $b$를 $a$로 나타낸다.
stuck: |
  $\ln(h+1)-\ln h=\ln\left(1+\dfrac1h\right)$를 $\dfrac1h$ 정도의 크기로 보아 $f(h)/h^2$의 극한으로 바꾸는 것, 그리고 $\alpha$, $\beta$를 두 곡선의 교점(이차방정식의 두 근)으로 보는 발상
idea_tags: [IDEA-LIMIT-DEGREE-MATCH, IDEA-INTEGRAL-LIMIT-DERIVATIVE, IDEA-PARABOLA-CHORD-AREA, IDEA-VIETA-INTERSECTION]
