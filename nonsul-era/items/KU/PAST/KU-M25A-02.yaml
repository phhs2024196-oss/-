intent: |
  주어진 조건을 만족하는 일차함수 $g(x)$를 구하고 $f(x)-g(x)$의 그래프(극값의 부호)로 교점의 개수와 위치를 판단하며, 교점의 $x$좌표가 만족하는 방정식에서 극한값을 구하는 과정을 논리적으로 설명할 수 있는 능력을 평가한다(문항카드 '출제 의도'·'문항 해설' 요지: 함수의 극한, 접선의 방정식, 함수의 그래프의 종합적 활용).
key_idea: |
  $k(x)=f(x)-g(x)=x^3-3a^2x+2a^3+a=(x-a)^2(x+2a)+a$의 극값 $k(a)=a$의 부호로 실근이 하나임을 보이고, $k(-a)=4a^3+a$의 부호로 근의 위치를, $\left(\frac{h}{a}\right)^3-3\frac ha+2+\frac1{a^2}=0$의 극한으로 $\lim\frac{h(a)}{a}$를 구한다.
stuck: |
  $g$가 접선을 $a$만큼 평행이동한 직선이라는 점을 보고, 차함수 $k(x)$의 극값이 정확히 $a$가 되어 부호가 $a$의 부호와 같다는 것을 포착하는 것
