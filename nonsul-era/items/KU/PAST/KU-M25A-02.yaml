stimuli:
- label: 가
  body: |
    함수 $f(x)$는 $f(x)=x^3-x$이다.
- label: 나
  body: |
    실수 $a$가 주어질 때, 함수 $g(x)$는 다음 성질을 만족한다.
    (ⅰ) $g(x)$는 일차함수 또는 상수함수이다.
    (ⅱ) $f(a)-g(a)=a$
    (ⅲ) $f^{\prime}(a)-g^{\prime}(a)=0$

stem: |
  다음 글을 읽고 물음에 답하시오. (40점)

subparts:
- id: '1'
  stem: |
    두 그래프 $y=f(x)$와 $y=g(x)$는 한 점에서 만난다. 그 이유를 설명하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $k(x)=f(x)-g(x)=x^3-3a^2x+2a^3+a$의 극값 $k(\pm\lvert a\rvert)$ 중 $k(a)=a$가 $a>0$이면 극솟값(양수), $a<0$이면 극댓값(음수)이다.
    steps:
    - id: 1a
      content: |
        $g(x)=(3a^2-1)x-2a^3-a$, $k(x)=x^3-3a^2x+2a^3+a$, $k(a)=a$
      criteria: ['1.M1', '1.M2', '1.R1']
    hint_ladder:
    - $g$의 기울기와 $g(a)$를 먼저 정하자.
    - $f(x)-g(x)$의 극값을 계산해 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.10
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (ⅰ)~(ⅲ)으로부터 $g^{\prime}(x)=f^{\prime}(a)=3a^2-1$, $g(a)=f(a)-a=a^3-2a$이므로
        $$g(x)=(3a^2-1)x-2a^3-a$$
        이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $k(x)=f(x)-g(x)$라 하면 $k(x)=x^3-3a^2x+2a^3+a$이다. $a=0$일 때와 $a\ne0$인 경우로 나누어 생각해 보면, $a=0$일 때는 $k(x)=x^3$이므로 $k(x)=0$은 하나의 실근을 갖는다. 따라서 $a=0$일 때 두 그래프 $y=f(x)$와 $y=g(x)$는 한 점에서 만난다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        이제 $a\ne0$이라 하자. $k(x)$를 미분하면 $k^{\prime}(x)=3x^2-3a^2$이다. 따라서 $a\ne0$일 때, $k(x)$는 $x=\lvert a\rvert$에서 극솟값, $x=-\lvert a\rvert$에서 극댓값을 갖는다.
        ■ $a>0$인 경우: $k(x)$의 극솟값은 $x=a$일 때 $k(a)=a^3-3a^3+2a^3+a=a>0$이다.
        ■ $a<0$인 경우: $k(x)$의 극댓값은 $x=a$일 때 $k(a)=a^3-3a^3+2a^3+a=a<0$이다.
        두 경우 모두 $y=k(x)$는 $x$축과 한 점에서 만난다. 따라서 $a\ne0$인 경우에도 두 그래프 $y=f(x)$와 $y=g(x)$는 한 점에서 만난다.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        조건 (ⅱ)(ⅲ)으로 $g(x)=(3a^2-1)x-2a^3-a$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $k(x)=f(x)-g(x)=x^3-3a^2x+2a^3+a$로 놓고 $a=0$인 경우 실근이 하나임을 밝혔다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 7
      evidence: |
        $a\ne0$일 때 $k^{\prime}(x)=3x^2-3a^2$로 극값의 위치를 구하고 $a>0$이면 극솟값 $k(a)=a>0$, $a<0$이면 극댓값 $k(a)=a<0$이므로 $x$축과 한 점에서 만남을 설명했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '75', misconception: MC-CAL-7185}
  misconceptions:
  - id: MC-CAL-7185
    outcome_code: '75'
    wrong_work: '$g^{\prime}(a)=f^{\prime}(a)$이므로 $g$는 접선이고, 접선은 접점에서만 만난다고 서술'
    detect_cue: $g(a)\ne f(a)$를 무시했거나 극값의 부호 계산이 없다
    feedback: (ⅱ)에서 $g(a)=f(a)-a$이므로 $g$는 접선이 아닙니다(접선을 아래로 $a$만큼 옮긴 직선). 차함수의 극값 부호로 교점 수를 판단하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    두 그래프 $y=f(x)$와 $y=g(x)$의 교점의 $x$좌표는 $a$가 바뀔 때마다 달라진다. 따라서, 이 교점의 $x$좌표는 $a$에 관한 함수인 $h(a)$라 할 수 있다. 함수 $h(a)$는 다음 성질을 만족한다.
    $$0\text{이 아닌 }a\text{에 대하여 }-ah(a)>a^2\text{이다.}$$
    이 성질이 성립하는 이유를 설명하시오. (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $k(-a)=4a^3+a$의 부호가 $a$의 부호와 같으므로 $a>0$이면 근은 $(-\infty,-a)$에, $a<0$이면 $(-a,\infty)$에 있다.
    steps:
    - id: 2a
      content: |
        $a>0$: $h(a)<-a$, $a<0$: $h(a)>-a$ $\Rightarrow$ $-ah(a)>a^2$
      criteria: ['2.M1', '2.R1', '2.R2']
    hint_ladder:
    - $-ah(a)>a^2$을 $a$의 부호에 따라 $h(a)$와 $-a$의 대소로 바꾸어 보자.
    - $k(-a)$의 부호를 계산해 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.10
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $k(x)=f(x)-g(x)$라 하면, $k(x)=x^3-3a^2x+2a^3+a$이고 $k(-a)=-a^3+3a^3+2a^3+a=4a^3+a$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        ■ $a>0$인 경우: $k(-a)=4a^3+a>0$이고 $\displaystyle\lim_{x\to-\infty}k(x)=-\infty$이므로 $y=k(x)$는 $(-\infty,-a)$에서 $x$축과 만난다. (2-1)에서 교점은 하나뿐이므로 $h(a)<-a$이다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        ■ $a<0$인 경우: $k(-a)=4a^3+a<0$이고 $\displaystyle\lim_{x\to\infty}k(x)=\infty$이므로 $y=k(x)$는 $(-a,\infty)$에서 $x$축과 만난다. 따라서 $h(a)>-a$이다.
        두 경우 양변에 $-a$를 곱하면($a>0$이면 부등호 방향이 바뀜) 모두 $-ah(a)>a^2$이 된다. 따라서 $a\ne0$일 때, $-ah(a)>a^2$이다.
      criteria: ['2.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $k(-a)=4a^3+a$를 계산하고 그 부호가 $a$의 부호와 같음을 적었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 5}
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: |
        $a>0$일 때 $k(-a)>0$과 $\lim_{x\to-\infty}k(x)=-\infty$로 근이 $(-\infty,-a)$에 있어 $h(a)<-a$임을 밝혔다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R2
      mark_type: R
      points: 5
      evidence: |
        $a<0$일 때 $h(a)>-a$임을 같은 방법으로 밝히고, 두 경우를 $-ah(a)>a^2$으로 정리했다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '76', misconception: MC-CAL-7186}
  misconceptions:
  - id: MC-CAL-7186
    outcome_code: '76'
    wrong_work: '그래프 개형만 그리고 "근은 $-a$보다 왼쪽에 있다"고 단정'
    detect_cue: $k(-a)$의 값 또는 양 끝의 극한(부호 변화)이 답안에 없다
    feedback: 근이 어느 구간에 있는지는 구간 끝 함숫값의 부호가 바뀐다는 근거(사잇값 정리)로 보이세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    극한값 $\displaystyle\lim_{a\to\infty}\frac{h(a)}{a}$가 존재할 때, 그 값을 구하고 근거를 설명하시오. (10점)
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '-2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $k(h(a))=0$을 $a^3$으로 나누면 $X=\lim\frac{h(a)}{a}$는 $X^3-3X+2=0$을 만족하고, (2-2)에서 $X\le-1$이다.
    steps:
    - id: 3a
      content: |
        $(X-1)^2(X+2)=0$, $X\le-1\Rightarrow X=-2$
      criteria: ['3.M1', '3.A1', '3.R1']
    hint_ladder:
    - $h(a)$가 만족하는 방정식을 $a^3$으로 나누어 보자.
  - id: S3-B
    audience: B
    source_flow: 문항카드 p.10
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $h(a)$는 $k(x)=0$의 해이므로 $(h(a))^3-3a^2h(a)+2a^3+a=0$을 만족한다. 따라서
        $$\left(\frac{h(a)}{a}\right)^3-3\left(\frac{h(a)}{a}\right)+2+\frac1{a^2}=0$$
        이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        이 식에 $a\to\infty$를 양변에 취하고 $X=\displaystyle\lim_{a\to\infty}\frac{h(a)}{a}$라 놓으면 $X^3-3X+2=(X-1)^2(X+2)=0$을 얻는다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        문제 (2-2)에 의해 $a>0$일 때 $\dfrac{h(a)}{a}<-1$이므로 $X=\displaystyle\lim_{a\to\infty}\frac{h(a)}{a}\le-1$이고, 따라서 $\displaystyle\lim_{a\to\infty}\frac{h(a)}{a}=-2$이다.
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $k(h(a))=0$을 $a^3$으로 나누어 $\frac{h(a)}{a}$에 대한 식을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 4}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $X^3-3X+2=(X-1)^2(X+2)=0$을 얻었다.
      depends_on: [3.M1]
