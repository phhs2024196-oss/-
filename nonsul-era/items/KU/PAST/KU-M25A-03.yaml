stimuli:
- label: 가
  body: |
    다음 그림과 같이 반경이 1인 반원 위에 $\overline{\mathrm{AB_1}}=\overline{\mathrm{B_1B_2}}=\overline{\mathrm{B_2B_3}}=\overline{\mathrm{B_3B_4}}$를 만족시키는 4개의 점 $\mathrm{B_1}$, $\mathrm{B_2}$, $\mathrm{B_3}$, $\mathrm{B_4}$가 순서대로 놓여있다.
    [그림] 반지름 1인 반원. 지름의 왼쪽 끝이 $\mathrm{A}$, 오른쪽 끝이 $\mathrm{B_4}$이고, 호 위에 왼쪽부터 $\mathrm{B_1}$, $\mathrm{B_2}$(맨 위), $\mathrm{B_3}$이 놓여 있다. 반원의 중심에서 $\mathrm{B_1}$, $\mathrm{B_2}$, $\mathrm{B_3}$으로 점선이 그어져 있다(중심을 원점으로 하면 $\mathrm{A}(-1,0)$, $\mathrm{B_1}\left(-\frac{\sqrt2}{2},\frac{\sqrt2}{2}\right)$, $\mathrm{B_2}(0,1)$, $\mathrm{B_3}\left(\frac{\sqrt2}{2},\frac{\sqrt2}{2}\right)$, $\mathrm{B_4}(1,0)$).

stem: |
  다음 글을 읽고 물음에 답하시오. (15점)

subparts:
- id: '1'
  stem: |
    $t$의 범위가 실수 전체일 때 $\left(\lvert\overrightarrow{\mathrm{AB_2}}-t\overrightarrow{\mathrm{AB_1}}\rvert+\lvert\overrightarrow{\mathrm{AB_3}}-t\overrightarrow{\mathrm{AB_1}}\rvert\right)^2$의 최솟값을 구하고, 그 근거를 설명하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '2 + sqrt(2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      직선 $L$ 위의 점에서 $\mathrm{B_2}$, $\mathrm{B_3}$까지의 거리의 합의 최소 → $\mathrm{B_3}$을 $L$에 대해 대칭이동해 $\lvert\overrightarrow{\mathrm{AB_2}}-\overrightarrow{\mathrm{AB_3}^{\prime}}\rvert^2$을 계산한다.
    steps:
    - id: 1a
      content: |
        $\lvert\overrightarrow{\mathrm{AB_2}}-\overrightarrow{\mathrm{AB_3}^{\prime}}\rvert^2=2+(2+\sqrt2)-2\sqrt2\cdot2\cos\frac\pi8\cos\frac{3\pi}8=2+\sqrt2$
      criteria: ['1.M1', '1.M2', '1.A1', '1.A2']
    hint_ladder:
    - $\overrightarrow{\mathrm{AB_2}}-t\overrightarrow{\mathrm{AB_1}}$의 크기는 어떤 두 점 사이의 거리인가?
    - 직선 위의 점에서 같은 쪽의 두 점까지 거리의 합의 최소는 어떻게 구하는가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.11
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{A}$를 지나고 벡터 $\overrightarrow{\mathrm{AB_1}}$에 평행한 직선을 $L$이라 하자. $\mathrm{P}$를 $\overrightarrow{\mathrm{AP}}=t\overrightarrow{\mathrm{AB_1}}$인 $L$ 위의 점이라 하면 주어진 식은 $(\overline{\mathrm{PB_2}}+\overline{\mathrm{PB_3}})^2$이고, $\mathrm{B_2}$, $\mathrm{B_3}$은 $L$의 같은 쪽에 있다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        벡터 $\overrightarrow{\mathrm{AB_3}}$를 직선 $L$에 대하여 대칭 이동한 벡터를 $\overrightarrow{\mathrm{AB_3}^{\prime}}$이라 하면 $\left(\lvert\overrightarrow{\mathrm{AB_2}}-t\overrightarrow{\mathrm{AB_1}}\rvert+\lvert\overrightarrow{\mathrm{AB_3}}-t\overrightarrow{\mathrm{AB_1}}\rvert\right)^2$의 최솟값은 $\lvert\overrightarrow{\mathrm{AB_2}}-\overrightarrow{\mathrm{AB_3}^{\prime}}\rvert^2$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        두 벡터 $\overrightarrow{\mathrm{AB_1}}$와 $\overrightarrow{\mathrm{AB_2}}$가 이루는 각은 $\dfrac\pi8$, 두 벡터 $\overrightarrow{\mathrm{AB_2}}$와 $\overrightarrow{\mathrm{AB_3}}$가 이루는 각은 $\dfrac\pi8$이다(같은 길이의 현에 대한 원주각). 따라서 $\overrightarrow{\mathrm{AB_2}}$와 $\overrightarrow{\mathrm{AB_3}^{\prime}}$이 이루는 각은 $\dfrac{3\pi}{8}$이다. 이때
        $$\lvert\overrightarrow{\mathrm{AB_2}}\rvert=2\sin\frac\pi4=2\cos\frac\pi4=\sqrt2,\quad\lvert\overrightarrow{\mathrm{AB_3}}\rvert=\lvert\overrightarrow{\mathrm{AB_3}^{\prime}}\rvert=2\sin\frac{3\pi}{8}=2\cos\frac\pi8$$
        이고, 반각공식으로부터
        $$\left(\sin\frac\pi8\right)^2=\frac{1-\cos\frac\pi4}{2}=\frac12-\frac{1}{2\sqrt2},\quad\left(\cos\frac\pi8\right)^2=\frac{1+\cos\frac\pi4}{2}=\frac12+\frac1{2\sqrt2}$$
        를 얻는다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        따라서
        $$\lvert\overrightarrow{\mathrm{AB_2}}-\overrightarrow{\mathrm{AB_3}^{\prime}}\rvert^2=\lvert\overrightarrow{\mathrm{AB_2}}\rvert^2+\lvert\overrightarrow{\mathrm{AB_3}^{\prime}}\rvert^2-2\lvert\overrightarrow{\mathrm{AB_2}}\rvert\lvert\overrightarrow{\mathrm{AB_3}^{\prime}}\rvert\cos\frac{3\pi}8=2+(2+\sqrt2)-2(\sqrt2)\left(2\sin\frac{3\pi}8\right)\cos\frac{3\pi}8=2+(2+\sqrt2)-2\sqrt2\left(\sin\frac{3\pi}4\right)=2+\sqrt2$$
        이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        주어진 식을 직선 $L$(점 $\mathrm{A}$를 지나고 $\overrightarrow{\mathrm{AB_1}}$에 평행) 위의 점에서 $\mathrm{B_2}$, $\mathrm{B_3}$까지 거리의 합(의 제곱)으로 해석했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        $\mathrm{B_3}$(또는 $\mathrm{B_2}$)을 $L$에 대해 대칭이동하여 최솟값이 $\lvert\overrightarrow{\mathrm{AB_2}}-\overrightarrow{\mathrm{AB_3}^{\prime}}\rvert^2$임을 밝혔다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\lvert\overrightarrow{\mathrm{AB_2}}\rvert=\sqrt2$, $\lvert\overrightarrow{\mathrm{AB_3}}\rvert=2\cos\frac\pi8$, 사잇각 $\frac{3\pi}8$을 구했다.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        최솟값 $2+\sqrt2$를 얻었다.
      depends_on: [1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
