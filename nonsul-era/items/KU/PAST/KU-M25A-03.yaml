  - id: MC-GEO-7188
    outcome_code: '71'
    wrong_work: '최솟값을 $\lvert\overrightarrow{\mathrm{AB_2}}-\overrightarrow{\mathrm{AB_3}}\rvert^2=\overline{\mathrm{B_2B_3}}^2=2-\sqrt2$로 답함'
    detect_cue: 대칭점 없이 $\overline{\mathrm{B_2B_3}}$를 답으로 썼다
    feedback: $\mathrm{B_2}$, $\mathrm{B_3}$이 직선 $L$의 같은 쪽에 있으면 선분 $\mathrm{B_2B_3}$은 $L$과 만나지 않습니다. 한 점을 대칭이동하세요.
    remedy: [RL-1]
  - id: MC-GEO-7189
    outcome_code: '72'
    wrong_work: '두 항을 각각 최소화(각 점에서 $L$에 내린 수선의 길이)해 더한 뒤 제곱'
    detect_cue: 두 항에 서로 다른 $t$값을 썼다
    feedback: 두 항의 $t$는 같은 값입니다. 하나의 점 $\mathrm{P}$에서 두 점까지 거리의 합으로 보세요.
    remedy: [RL-2]

