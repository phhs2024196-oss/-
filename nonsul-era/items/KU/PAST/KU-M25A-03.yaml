  - '$\mathrm{B_3}$의 $L$에 대한 대칭점 $\mathrm{B_3}^{\prime}$'
  - '$\lvert\vec u-\vec v\rvert^2=\lvert\vec u\rvert^2+\lvert\vec v\rvert^2-2\lvert\vec u\rvert\lvert\vec v\rvert\cos\theta$'
  - '$2\sin\theta\cos\theta=\sin2\theta$, 반각공식'
  conditions:
  - '현의 길이가 같음 → 중심각 $\frac\pi4$씩, $\angle\mathrm{B_1AB_2}=\angle\mathrm{B_2AB_3}=\frac\pi8$'
  - '$\mathrm{B_2}$, $\mathrm{B_3}$는 $L$의 같은 쪽 → 대칭이동 필요'
  - '$\lvert\overrightarrow{\mathrm{AB_2}}\rvert=\sqrt2$, $\lvert\overrightarrow{\mathrm{AB_3}}\rvert=2\cos\frac\pi8$, 사잇각 $\frac{3\pi}{8}$'
