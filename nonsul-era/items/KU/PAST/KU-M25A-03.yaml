intent: |
  벡터의 의미, 벡터의 내적, 삼각함수의 덧셈정리 등을 종합적으로 활용하여, 주어진 식을 "평면 위의 두 점과 한 직선이 있을 때 한 점에서 직선을 거쳐 다른 한 점으로 가는 최단 거리"로 해석하고 논리적으로 해결하는 능력을 평가한다(문항카드 '출제 의도'·'문항 해설' 요지).
key_idea: |
  $t\overrightarrow{\mathrm{AB_1}}$의 종점은 $\mathrm{A}$를 지나고 $\overrightarrow{\mathrm{AB_1}}$에 평행한 직선 $L$ 위를 움직이므로 식은 $L$ 위의 점에서 $\mathrm{B_2}$, $\mathrm{B_3}$까지 거리의 합이고, $\mathrm{B_3}$을 $L$에 대해 대칭이동하면 최솟값은 $\lvert\overrightarrow{\mathrm{AB_2}}-\overrightarrow{\mathrm{AB_3}^{\prime}}\rvert^2$이다.
stuck: |
  벡터 식을 직선 위의 점까지의 거리의 합(최단 경로)으로 해석하고, 같은 쪽에 있는 점을 대칭이동하는 발상
