intent: |
  조건부확률의 의미를 정확히 이해하고, 독립인 부품 불량 사건으로 회로의 작동 여부 확률과 조건부확률을 구하는 과정을 평가한다(문항카드 '출제 의도'·'문항 해설' 요지).
key_idea: |
  작동 사건을 배반사건 $(A\cap C)\cup(A^c\cap B\cap C)$로 나누어 $P(\text{작동 안 함})=\frac{29}{200}$, $P(A^c\cap\text{작동 안 함})=P(A^c)-P(A^c\cap B\cap C)=\frac{13}{200}$을 구해 나눈다.
stuck: |
  "부품 A가 불량이고 회로가 작동하지 않는" 사건을 $A^c-(A^c\cap B\cap C)$로 표현하는 것
