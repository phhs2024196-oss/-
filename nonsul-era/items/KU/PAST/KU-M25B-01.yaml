stimuli:
- label: 글상자
  body: |
    함수 $\sigma(x)$는 다음과 같다.
    $$\sigma(x)=\begin{cases}x & (x\ge0)\\0 & (x<0)\end{cases}$$

stem: |
  다음 글을 읽고 물음에 답하시오. (35점)

subparts:
- id: '1'
  stem: |
    1-1) $b\le c$인 두 실수 $b$, $c$에 대하여 $g(x)=-\sigma(-x+b)+1$, $h(x)=-\sigma(x-c)+2$라 하자.
    $$f(x)=\sigma(g(x))+\sigma(h(x))$$
    일 때, 함수 $f(x)$가 세 점에서만 미분불가능이 되도록 하는 $b$와 $c$의 관계를 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'b = c', equivalents: ['c = b'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f$는 꺾은선이고 꺾인 점 후보는 $b-1,b,c,c+2$이다. $b<c$이면 네 점, $b=c$이면 $x=b$에서 기울기가 $1\to-1$로 바뀌어 세 점이다.
    steps:
    - {id: 1a, content: '$f$의 꺾인 점은 $b-1,b,c,c+2$ → $b=c$일 때만 세 점', criteria: ['1.M1', '1.R1', '1.A2']}
    hint_ladder:
    - $g(x)$, $h(x)$를 먼저 구간별로 풀어 써 보자.
    - $\sigma(g(x))$와 $\sigma(h(x))$는 각각 어디에서 꺾이는가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.8
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x\ge b$이면 $g(x)=1$, $x<b$이면 $g(x)=x-b+1$이고, $x\le c$이면 $h(x)=2$, $x>c$이면 $h(x)=-x+c+2$이므로
        $$\sigma(g(x))=\begin{cases}1 & (x\ge b)\\x-b+1 & (b-1\le x<b)\\0 & (x<b-1)\end{cases},\quad \sigma(h(x))=\begin{cases}0 & (x\ge c+2)\\-x+c+2 & (c\le x<c+2)\\2 & (x<c)\end{cases}$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $b\le c$이므로
        $$f(x)=\begin{cases}1 & (x\ge c+2)\\-x+c+3 & (c\le x<c+2)\\3 & (b\le x<c)\\x-b+3 & (b-1\le x<b)\\2 & (x<b-1)\end{cases}$$
        [그림] $y=f(x)$의 그래프: $y=2$에서 $x=b-1$부터 기울기 $1$로 올라가 $x=b$에서 $y=3$, $x=c$까지 $y=3$, 기울기 $-1$로 내려가 $x=c+2$부터 $y=1$인 꺾은선.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $f$는 연속인 꺾은선이므로 기울기가 바뀌는 점에서만 미분불가능하다. $b<c$이면 $x=b-1,b,c,c+2$의 네 점에서 미분불가능하다. $b=c$이면 구간 $[b,c)$가 없어지고 $x=b$에서 기울기가 $1$에서 $-1$로 바뀌므로 미분불가능한 점은 $x=b-1,\,b,\,b+2$의 세 점이다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        따라서 $b=c$일 때 세 점에서만 미분불가능하다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\sigma(g(x))$와 $\sigma(h(x))$를 구간별 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $f(x)$를 다섯 구간의 식(또는 그래프)으로 바르게 나타냈다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $b<c$이면 네 점, $b=c$이면 $x=b$에서 기울기가 $1\to-1$로 바뀌어 세 점에서 미분불가능함을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        결론 $b=c$를 적었다.
      depends_on: [1.R1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-7201}
  misconceptions:
  - id: MC-CAL-7201
    outcome_code: '71'
    wrong_work: '$b=c$이면 두 꺾인 점이 합쳐져 미분가능해진다고 보고 "$c=b+$(어떤 값)" 또는 "관계 없음"이라 답함'
    detect_cue: $x=b(=c)$에서 좌·우 기울기 $1$, $-1$을 비교한 흔적이 없다
    feedback: 꺾인 점이 겹치면 그 점의 좌·우 기울기를 다시 비교해야 합니다. 여기서는 $1$과 $-1$이므로 여전히 미분불가능합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    1-2) 함수 $g(x)=-\sigma(-x-1)+1$에 대하여 함수 $f(x)$는
    $$f(x)=(x-a)(x-b)\left[\sigma(g(x))+\sigma(g(-x))-1\right]$$
    이다. $f(x)$가 두 점에서만 미분불가능하고, $f(0)>0$인 순서쌍 $(a,b)$를 모두 구하고, 그 이유를 설명하시오. (단 $a$, $b$는 실수이다.) (15점)
  points: 15
  depends_on: []
  answer: {kind: set, value: '{(1,2),(2,1),(-1,-2),(-2,-1)}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 괄호 안 함수 $h$는 $x=\pm1,\pm2$에서 꺾이는 사다리꼴이고, $f=(x-a)(x-b)h$는 꺾인 점 $x_0$에서 $(x_0-a)(x_0-b)=0$일 때만 미분가능하다.
    steps:
    - {id: 2a, content: '$\{a,b\}\subset\{-2,-1,1,2\}$, $a\ne b$, $ab>0$ → 네 순서쌍', criteria: ['2.M1', '2.R1', '2.A2']}
    hint_ladder:
    - 괄호 안의 함수의 그래프를 그려 보자.
    - 꺾인 점 $x_0$에서 $(x-a)(x-b)$의 값이 0이면 좌·우미분계수는 어떻게 되는가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.8-9
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $h(x)=\sigma(g(x))+\sigma(g(-x))-1$이라 두면(1-1)의 $h$와 다른 함수)
        $$h(x)=\begin{cases}0 & (x\ge2)\\-x+2 & (1\le x<2)\\1 & (-1\le x<1)\\x+2 & (-2\le x<-1)\\0 & (x<-2)\end{cases}$$
        [그림] $y=h(x)$의 그래프: $(-2,0)$에서 기울기 $1$로 올라가 $(-1,1)$, $(1,1)$까지 $y=1$, 기울기 $-1$로 내려가 $(2,0)$이고 그 밖에서는 $0$인 사다리꼴.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $f(x)=(x-a)(x-b)h(x)$의 미분가능한 점에서 $f'(x)=(x-a)(x-b)h'(x)+(2x-a-b)h(x)$이다. 즉,
        $$f'(x)=\begin{cases}0 & (x>2)\\(2x-a-b)(-x+2)+(x-a)(x-b)(-1) & (1<x<2)\\2x-a-b & (-1<x<1)\\(2x-a-b)(x+2)+(x-a)(x-b) & (-2<x<-1)\\0 & (x<-2)\end{cases}$$
        따라서 $f(x)$는 $x=-2,-1,1,2$의 네 점에서 미분불가능할 수 있다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        (1) $x=-2$: 좌미분계수 $0$, 우미분계수 $(-2-a)(-2-b)$ → 미분가능할 조건은 $a=-2$ 또는 $b=-2$.
        (2) $x=-1$: 좌미분계수 $(-2-a-b)+(-1-a)(-1-b)$, 우미분계수 $-2-a-b$ → $a=-1$ 또는 $b=-1$.
        (3) $x=1$: 좌미분계수 $2-a-b$, 우미분계수 $2-a-b-(1-a)(1-b)$ → $a=1$ 또는 $b=1$.
        (4) $x=2$: 좌미분계수 $-(2-a)(2-b)$, 우미분계수 $0$ → $a=2$ 또는 $b=2$.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        $f(x)$가 두 점에서만 미분불가능하려면 $(a,b)$가 (1)~(4)의 조건 중 정확히 두 개를 만족해야 하므로
        $(a,b)=(1,-1),(1,-2),(1,2),(-1,1),(-1,-2),(-1,2),(-2,-1),(-2,1),(-2,2),(2,-2),(2,-1),(2,1)$.
      criteria: ['2.R1']
    - id: 2b-5
      content: |
        이 중 $f(0)=ab\cdot h(0)=ab>0$인 것은 $(a,b)=(1,2),\,(-1,-2),\,(-2,-1),\,(2,1)$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
