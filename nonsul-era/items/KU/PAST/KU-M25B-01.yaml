  - id: MC-CAL-7202
    outcome_code: '72'
    wrong_work: '괄호 안 함수가 $x=\pm1,\pm2$에서 꺾이므로 $f$는 $a$, $b$와 관계없이 항상 네 점에서 미분불가능하다고 하여 "없음"이라 답함'
    detect_cue: 꺾인 점에서 좌·우미분계수를 $a$, $b$에 관한 식으로 계산하지 않았다
    feedback: 꺾인 점 $x_0$에서 $(x_0-a)(x_0-b)=0$이면 좌·우미분계수의 차가 0이 되어 미분가능해집니다. 좌·우미분계수를 직접 계산해 보세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    1-3) 함수 $g(x)=-\sigma(-x-1)+1$에 대하여 함수 $f(x)$는
    $$f(x)=\sigma(g(x))+\sigma(g(-x))-1$$
    이다. 두 실수 $a$, $b$에 대하여 직선 $y=ax+b$가 $y=f(x)$의 그래프와 세 점에서 만나기 위한 순서쌍 $(a,b)$가 평면에서 차지하는 영역의 면적을 구하고, 그 이유를 설명하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h(x)=f(x)-ax-b$의 근이 세 개일 조건. $a>0$이면 $h(-2)<0$, $h(-1)>0$, $a<0$이면 $h(1)>0$, $h(2)<0$이고 두 삼각형 영역의 넓이 합은 $1$.
    steps:
    - {id: 3a, content: '$a>0$: $2a<b<a+1$, $a<0$: $-2a<b<-a+1$ → 넓이 $\tfrac12+\tfrac12=1$', criteria: ['3.M2', '3.M3', '3.A1']}
    hint_ladder:
    - $f(x)-ax-b$의 그래프가 $x$축과 세 번 만나는 조건으로 바꾸자.
    - $a>0$이면 어느 구간에서 $f(x)-ax-b$가 감소하는가?
  - id: S3-B
    audience: B
    source_flow: 문항카드 p.9
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $h(x)=f(x)-ax-b$라고 하면(1-1)·1-2)의 $h$와 다른 함수)
        $$h(x)=\begin{cases}-ax-b & (x\ge2)\\-(a+1)x+2-b & (1\le x<2)\\-ax-b+1 & (-1\le x<1)\\(1-a)x+2-b & (-2\le x<-1)\\-ax-b & (x<-2)\end{cases}$$
        이고, $h(x)$의 그래프가 $x$축과 세 점에서 만나면 된다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        우선 $a=0$인 경우, $x$축과 두 번 만나거나 무한히 많은 점에서 만나거나(또는 만나지 않으므로) $a>0$ 혹은 $a<0$이어야 한다.
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        $a>0$인 경우, 구간 $x<-2$ 그리고 $x>-1$에서 $h(x)$는 감소하므로, $h(x)$의 그래프가 $x$축과 세 번 만나기 위해서는 $h(-2)<0$, $h(-1)>0$이어야 한다. 즉, $b<a+1$, $b>2a$이어야 한다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $a<0$인 경우, 구간 $x<1$ 그리고 $x>2$에서 $h(x)$는 증가하므로, $h(x)$의 그래프가 $x$축과 세 번 만나기 위해서는 $h(1)>0$, $h(2)<0$이어야 한다. 즉, $b<-a+1$, $b>-2a$이어야 한다.
      criteria: ['3.M3']
    - id: 3b-5
      content: |
        $a>0$일 때의 영역은 세 점 $(0,0)$, $(1,2)$, $(0,1)$을 꼭짓점으로 하는 삼각형(넓이 $\tfrac12$), $a<0$일 때는 이와 $b$축 대칭인 삼각형(넓이 $\tfrac12$)이다. 따라서 $(a,b)$가 차지하는 영역의 면적은 $1$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $f(x)-ax-b$(또는 $f(x)$)를 구간별 식으로 나타내고 교점 개수를 근의 개수로 바꾸었다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 2
      evidence: |
        $a=0$이면 세 점에서 만날 수 없음을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        $a>0$일 때 감소 구간을 근거로 $h(-2)<0$, $h(-1)>0$, 즉 $2a<b<a+1$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [3b-3]
    - id: 3.M3
      mark_type: M
      points: 1
      evidence: |
        $a<0$일 때 $h(1)>0$, $h(2)<0$, 즉 $-2a<b<-a+1$을 세웠다(대칭성 언급도 인정).
      depends_on: []
      implied_ok: false
      steps: [3b-4]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        두 삼각형 영역의 넓이 합 $1$을 구했다.
      depends_on: [3.M2, 3.M3]
      steps: [3b-5]
    deductions: []
