intent: |
  주어진 조건(함수 $\sigma$로 합성한 구간별 함수)이 의미하는 바를 정확히 이해하고, 좌미분과 우미분으로 미분불가능한 점의 조건을 찾으며, 그래프를 통해 직선과 세 점에서 만나는 조건을 논리적으로 설명하는 능력을 평가한다(문항카드 '출제 의도'·'문항 해설' 요지).
key_idea: |
  $\sigma$를 합성한 함수를 구간별 일차식(꺾은선)으로 풀어 쓴 뒤, 미분불가능한 점은 꺾인 점뿐이고 곱해진 다항식이 그 점에서 0이면 미분가능해진다는 것, 직선과의 교점 개수는 감소(증가) 구간에서의 부호 조건으로 정해진다는 것을 이용한다.
stuck: |
  1-1)에서 $b=c$일 때 두 꺾인 점이 겹쳐도 기울기가 $1$에서 $-1$로 바뀌어 여전히 미분불가능한 점이 된다는 확인, 1-2)에서 $(x-a)(x-b)$가 꺾인 점에서 0이 되면 좌·우미분계수가 같아진다는 발상
idea_tags: [IDEA-PIECEWISE-KINK-COUNT, IDEA-FACTOR-ZERO-SMOOTHS-KINK, IDEA-LINE-POLYLINE-INTERSECT-SIGN]
tags: [합성함수, 꺾은선, 미분가능성, 교점 개수, 범위 논란 문항(1-3)]
