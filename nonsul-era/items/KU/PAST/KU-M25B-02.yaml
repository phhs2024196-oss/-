stimuli:
- label: 글상자
  body: |
    $f(x)=x^3+px^2+qx+r$은 다음 조건들을 만족하는 삼차 다항함수이다.
    (가) $p,q,r$은 정수이고 $p$는 $0$이 아니다.
    (나) $y=f(x)$의 변곡점에서 접선의 방정식은 $y=-x$이다.

stem: |
  다음 글을 읽고 물음에 답하시오. (35점)

subparts:
- id: '1'
  stem: |
    2-1) $pqr$이 최솟값을 가지는 $f(x)$를 모두 찾고, 그 이유를 설명하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: set, value: '{x**3+3*x**2+2*x+1, x**3-3*x**2+2*x-1}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 변곡점 $\alpha=-\tfrac p3$에서 $f(\alpha)=-\alpha$, $f'(\alpha)=-1$ → $(p,q,r)=(3k,3k^2-1,k^3)$, $pqr=3k^4(3k^2-1)\ge6$.
    steps:
    - {id: 1a, content: '$pqr=3k^4(3k^2-1)$은 $k=\pm1$에서 최솟값 $6$', criteria: ['1.M2', '1.A1', '1.A2']}
    hint_ladder:
    - 변곡점의 $x$좌표를 $p$로 나타내자.
    - 접선이 $y=-x$라는 것은 두 조건을 뜻한다.
    - $p^2=3(q+1)$에서 $p$는 어떤 수의 배수인가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.10
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        변곡점의 $x$좌표를 $\alpha$라고 하면, $f''(\alpha)=6\alpha+2p=0$이므로 $\alpha=-\dfrac p3$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        변곡점 $(\alpha,f(\alpha))$에서의 접선이 $y=-x$이므로 $f(\alpha)=-\alpha$와 $f'(\alpha)=-1$을 만족한다. 즉,
        $$f(\alpha)=-\frac{p^3}{27}+p\times\frac{p^2}{9}+q\times\left(-\frac p3\right)+r=\frac p3,\quad f'(\alpha)=3\times\frac{p^2}{9}+2p\times\left(-\frac p3\right)+q=-1$$
        따라서 $2p^3-9pq+27r=9p$이고 $-p^2+3q=-3$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        두 번째 식에서 $p^2=3(q+1)$이므로 $p^2$이 3의 배수이고, 3이 소수이므로 $p$도 3의 배수이다. 따라서 $p=3k$($k$는 0이 아닌 정수)라고 놓을 수 있다. 그러면 $q=3k^2-1$이 성립한다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        첫 번째 식에서 $54k^3-27k(3k^2-1)+27r=27k$가 얻어지므로 $r=k^3$이다. 따라서 $(p,q,r)=(3k,3k^2-1,k^3)$인 0이 아닌 정수 $k$가 존재한다.
      criteria: ['1.A1']
    - id: 1b-5
      content: |
        $pqr=3k^4(3k^2-1)$이고 $|k|\ge1$에서 $k^4\ge1$, $3k^2-1\ge2$이므로 $k=\pm1$일 때 $pqr=6$을 최솟값으로 가진다. 이때 $(p,q,r)=(3,2,1)$과 $(p,q,r)=(-3,2,-1)$이므로 $f(x)=x^3+3x^2+2x+1$과 $f(x)=x^3-3x^2+2x-1$이 답이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f''(x)=0$에서 변곡점의 $x$좌표 $\alpha=-\dfrac p3$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $f(\alpha)=-\alpha$, $f'(\alpha)=-1$의 두 식을 세워 $p,q,r$의 관계식을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $p^2=3(q+1)$과 정수 조건에서 $p=3k$($k\ne0$ 정수)로 둘 수 있는 근거를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $(p,q,r)=(3k,3k^2-1,k^3)$을 얻었다.
      depends_on: [1.M2, 1.R1]
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $pqr=3k^4(3k^2-1)$의 최솟값 $6$($k=\pm1$)과 두 함수 $x^3+3x^2+2x+1$, $x^3-3x^2+2x-1$을 모두 적었다.
      depends_on: [1.M2, 1.R1]
      steps: [1b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-7204}
  - {code: '72', misconception: MC-ALG-7205}
  misconceptions:
  - id: MC-CAL-7204
    outcome_code: '71'
    wrong_work: '$f''(\alpha)=-1$만 써서 $q=\tfrac{p^2}{3}-1$을 얻고 $r$을 정하지 못함'
    detect_cue: $f(\alpha)=-\alpha$(변곡점이 직선 위) 식이 없다
    feedback: 접선이 $y=-x$라는 것은 기울기가 $-1$일 뿐 아니라 변곡점이 그 직선 위에 있다는 뜻입니다.
    remedy: [RL-1]
  - id: MC-ALG-7205
    outcome_code: '72'
    wrong_work: '$k=1$만 대입해 $f(x)=x^3+3x^2+2x+1$ 하나만 답함'
    detect_cue: $k=-1$(또는 $p=-3$) 경우가 없다
    feedback: $pqr=3k^4(3k^2-1)$은 $k$의 짝함수입니다. 음의 정수도 확인하세요.
    remedy: [RL-2]

- id: '2'
  stem: |
    2-2) $\displaystyle\lim_{p\to\infty}\frac{pq}{r}$의 값을 구하고, 그 이유를 설명하시오. (5점)
  points: 5
  depends_on: ['1']
  answer: {kind: value, value: '9', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $p=3k$, $q=3k^2-1$, $r=k^3$을 대입하면 $\dfrac{pq}{r}=\dfrac{3k(3k^2-1)}{k^3}\to9$.
    steps:
    - {id: 2a, content: '$\lim_{k\to\infty}\tfrac{9k^3-3k}{k^3}=9$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $p\to\infty$이면 $k$는 어떻게 되는가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.10
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        2-1)에서 $(p,q,r)=(3k,3k^2-1,k^3)$이므로 $p\to\infty$는 $k\to\infty$와 같고
        $$\lim_{p\to\infty}\frac{pq}{r}=\lim_{k\to\infty}\frac{3k\times(3k^2-1)}{k^3}$$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\dfrac{9k^3-3k}{k^3}=9-\dfrac{3}{k^2}\to9$이므로 극한값은 $9$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        2-1)의 관계식을 대입해 $\dfrac{pq}{r}$를 $k$(또는 $p$)만의 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        극한값 $9$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-7206}
  misconceptions:
  - id: MC-CAL-7206
    outcome_code: '71'
    wrong_work: '$q$, $r$을 상수로 보고 $\lim_{p\to\infty}\tfrac{pq}{r}=\infty$라고 답함'
    detect_cue: $q$, $r$을 $p$(또는 $k$)로 나타낸 식이 없다
    feedback: 조건 때문에 $q$와 $r$도 $p$에 따라 정해집니다. 관계식을 대입해 한 문자의 식으로 바꾸세요.
    remedy: [RL-3]

- id: '3'
  stem: |
    2-3) 점 $(-3,0)$을 지나고 곡선 $y=f(x)$에 접하는 직선이 3개가 되도록 하는 자연수 $p$의 값을 모두 찾고, 그 이유를 설명하시오. (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: set, value: '{3}', equivalents: ['3'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 접점 $t$에 대해 $g(t)=(t+3)f'(t)-f(t)=0$의 서로 다른 실근이 3개일 조건. $g'(t)=6(t+3)(t+k)$이고 $g(-k)=-3<0$이므로 $g(-3)=-(k-3)^3-3>0$ ⇔ $k=1$.
    steps:
    - {id: 3a, content: '$g(-3)g(-k)<0$ ⇔ $k=1$ ⇔ $p=3$', criteria: ['3.M2', '3.A2', '3.R1']}
    hint_ladder:
    - 접점을 $(t,f(t))$로 두고 접선이 $(-3,0)$을 지날 조건을 $t$의 방정식으로 쓰자.
    - 삼차방정식이 서로 다른 세 실근을 가질 조건은?
  - id: S3-B
    audience: B
    source_flow: 문항카드 p.10
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        자연수 $p=3k$에 대하여 $k$는 자연수이고, $f(x)=x^3+3kx^2+(3k^2-1)x+k^3$이다. 점 $(-3,0)$을 지나고 곡선 $y=f(x)$에 접하는 직선이 곡선에 접하는 점을 $(t,f(t))$라고 놓자. 그러면 접선의 방정식은 $y-f(t)=f'(t)(x-t)$이고 $-f(t)=f'(t)(-3-t)$를 만족한다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        따라서
        $$g(t)=(t+3)f'(t)-f(t)=2t^3+(3k+9)t^2+18kt+(9k^2-3-k^3)$$
        가 $0$이 되는 서로 다른 실수 $t$가 세 개 존재하는 조건을 찾으면 된다(삼차함수의 그래프에서 접점이 다르면 접선도 다르다).
      criteria: ['3.A1']
    - id: 3b-3
      content: |
