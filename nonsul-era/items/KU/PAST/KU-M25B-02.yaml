intent: |
  주어진 조건들을 만족하는 삼차 다항식의 계수들 사이의 관계를 유추하고, 함수의 극한·접선의 방정식·함수의 그래프 등을 종합적으로 활용하여 주어진 문제를 논리적으로 해결하는 능력을 평가한다(문항카드 '출제 의도'·'문항 해설' 요지).
key_idea: |
  변곡점 $x=-\tfrac p3$에서 $f(\alpha)=-\alpha$, $f'(\alpha)=-1$을 세우면 $p^2=3(q+1)$에서 $p=3k$이고 $(p,q,r)=(3k,3k^2-1,k^3)$이다. 접선 개수는 접점 $t$에 관한 삼차방정식 $(t+3)f'(t)-f(t)=0$의 서로 다른 실근 개수이다.
stuck: |
  $p^2=3(q+1)$에서 $p$가 3의 배수임을 이끌어 정수 매개변수 $k$로 세 계수를 나타내는 것, 접선 개수를 극값의 부호 조건으로 바꾸는 것
