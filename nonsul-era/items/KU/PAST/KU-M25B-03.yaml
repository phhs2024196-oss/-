stimuli:
- label: 글상자
  body: |
    그림과 같이 반경이 1인 원 위에 $\overline{\mathrm{AB_1}}=\overline{\mathrm{B_1B_2}}=\overline{\mathrm{B_2B_3}}=\cdots=\overline{\mathrm{B_{n-1}B_n}}=\overline{\mathrm{B_nA}}$를 만족시키는 $n$개의 점 $\mathrm{B_1,B_2,\cdots,B_n}$이 순서대로 놓여있다. 벡터 $\overrightarrow{b_i}=\overrightarrow{\mathrm{AB_i}}$ $(1\le i\le n)$라 하자.
    [그림] 두 개의 그림. 왼쪽: 반지름 1인 원의 중심에서 원의 맨 아래 점 $\mathrm{A}$와, $\mathrm{A}$의 오른쪽(시계 반대 방향)으로 차례로 놓인 $\mathrm{B_1,B_2,B_3}$, 왼쪽으로 놓인 $\mathrm{B_n,B_{n-1}}$까지 반지름이 그어져 있다(인접한 점 사이의 중심각이 모두 같음). 오른쪽: 같은 원에서 $\mathrm{A}$를 시점으로 각 점 $\mathrm{B_1,B_2,B_3,\cdots,B_{n-1},B_n}$을 종점으로 하는 벡터 $\overrightarrow{b_1},\overrightarrow{b_2},\overrightarrow{b_3},\cdots,\overrightarrow{b_{n-1}},\overrightarrow{b_n}$이 빨간 화살표로 그려져 있다.

stem: |
  다음 글을 읽고 물음에 답하시오. (15점)

subparts:
- id: '1'
  stem: |
    3-1) $n=7$일 때, 내적 $\overrightarrow{b_2}\cdot\overrightarrow{b_5}$의 값을 구하고, 그 이유를 설명하시오. (6점)
  points: 6
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\lvert\overrightarrow{b_i}\rvert=2\sin\frac{\pi i}{8}$, 사잇각 $\frac{3\pi}{8}$ → $4\sin\frac{\pi}{4}\sin\frac{5\pi}{8}\cos\frac{3\pi}{8}=1$.
    steps:
    - {id: 1a, content: '$(2\sin\frac{\pi}{4})(2\sin\frac{5\pi}{8})\cos\frac{3\pi}{8}=1$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 중심각이 $\theta$인 현의 길이는?
    - 두 현 $\mathrm{AB_i}$, $\mathrm{AB_j}$가 이루는 각은 어떤 호에 대한 원주각인가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.11
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $n+1$개의 현의 길이가 같으므로 인접한 점 사이의 중심각은 $\dfrac{2\pi}{n+1}$이고, $\angle\mathrm{AOB_i}=\dfrac{2\pi i}{n+1}$이므로 $\lvert\overrightarrow{b_i}\rvert=2\sin\dfrac{\pi i}{n+1}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        두 벡터 $\overrightarrow{b_i}$, $\overrightarrow{b_j}$의 사잇각은 호 $\mathrm{B_iB_j}$에 대한 원주각이므로 $\left\lvert\dfrac{\pi(i-j)}{n+1}\right\rvert$이다. 따라서
        $$\overrightarrow{b_i}\cdot\overrightarrow{b_j}=\left(2\sin\frac{\pi}{n+1}i\right)\left(2\sin\frac{\pi}{n+1}j\right)\cos\frac{\pi}{n+1}(i-j)=\left(2\sin\frac{\pi}{n+1}i\right)\left(2\sin\frac{\pi}{n+1}j\right)\left(\cos\frac{\pi}{n+1}i\cos\frac{\pi}{n+1}j+\sin\frac{\pi}{n+1}i\sin\frac{\pi}{n+1}j\right)$$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        따라서 $n=7$일 때
        $$\overrightarrow{b_2}\cdot\overrightarrow{b_5}=\left(2\sin\frac{\pi}{4}\right)\left(2\sin\frac{5\pi}{8}\right)\cos\frac{3\pi}{8}=\left(2\sin\frac{\pi}{4}\right)\left(2\cos\frac{\pi}{8}\right)\sin\frac{\pi}{8}=\left(2\sin\frac{\pi}{4}\right)\sin\frac{\pi}{4}=1$$
        을 얻는다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $\lvert\overrightarrow{b_i}\rvert=2\sin\dfrac{\pi i}{n+1}$(또는 $n=7$에서 $\lvert\overrightarrow{b_2}\rvert$, $\lvert\overrightarrow{b_5}\rvert$)를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        두 벡터의 사잇각을 원주각 $\dfrac{\pi\lvert i-j\rvert}{n+1}$(n=7에서 $\dfrac{3\pi}{8}$)로 구해 내적의 정의에 대입했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        덧셈정리·배각 공식으로 정리해 $\overrightarrow{b_2}\cdot\overrightarrow{b_5}=1$을 얻었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-7208}
  misconceptions:
  - id: MC-GEO-7208
    outcome_code: '71'
    wrong_work: '사잇각을 중심각 $\tfrac{3\pi}{4}$로 두어 $4\sin\tfrac{\pi}{4}\sin\tfrac{5\pi}{8}\cos\tfrac{3\pi}{4}<0$으로 계산'
    detect_cue: 사잇각이 $\tfrac{3\pi}{8}$이 아니고 내적이 음수이다
    feedback: 두 벡터는 모두 원 위의 점 A에서 출발하므로 사잇각은 호 $\mathrm{B_2B_5}$에 대한 원주각, 즉 중심각의 절반입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    3-2) 다음 극한값을 구하고, 그 이유를 설명하시오. (9점)
    $$\lim_{n\to\infty}\overrightarrow{b_1}\cdot\left(\sum_{i=1}^{n}\overrightarrow{b_i}\right)$$
  points: 9
  depends_on: ['1']
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 3-1)의 공식에서 $j=1$로 두고 합을 둘로 나누면, 하나는 $2\pi\int_0^1\sin2\pi x\,dx=0$, 다른 하나는 $n\sin^2\frac{\pi}{n+1}$ 이하이므로 $0$.
    steps:
    - {id: 2a, content: '첫 합 $\to2\pi\int_0^1\sin2\pi x\,dx=0$, 둘째 합 $\le n\sin^2\frac{\pi}{n+1}\to0$', criteria: ['2.M2', '2.R1', '2.A1']}
    hint_ladder:
    - 3-1)의 일반식에서 $j=1$을 대입해 보자.
    - $\sin\frac{2\pi}{n+1}$은 $\frac{2\pi}{n+1}$과 비슷하다.
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.11
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        3-1)에서 얻어진 공식
        $$\overrightarrow{b_1}\cdot\overrightarrow{b_i}=\left(2\sin\frac{\pi}{n+1}\right)\left(2\sin\frac{\pi i}{n+1}\right)\left(\cos\frac{\pi}{n+1}\cos\frac{\pi i}{n+1}+\sin\frac{\pi}{n+1}\sin\frac{\pi i}{n+1}\right)$$
        로부터(배각 공식 $2\sin\theta\cos\theta=\sin2\theta$)
        $$\overrightarrow{b_1}\cdot\left(\sum_{i=1}^{n}\overrightarrow{b_i}\right)=\left(\sum_{i=1}^{n}\left(\sin\frac{2\pi}{n+1}\right)\sin\frac{2\pi i}{n+1}\right)+4\left(\sum_{i=1}^{n}\left(\sin\frac{\pi}{n+1}\right)^2\left(\sin\frac{\pi i}{n+1}\right)^2\right)$$
        를 얻는다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        여기서
        $$\lim_{n\to\infty}\left(\sum_{i=1}^{n}\left(\sin\frac{2\pi}{n+1}\right)\sin\frac{2\pi i}{n+1}\right)=\left(\lim_{n\to\infty}\frac{\sin\frac{2\pi}{n+1}}{\frac{1}{n+1}}\right)\left(\lim_{n\to\infty}\sum_{i=1}^{n}\left(\sin\frac{2\pi i}{n+1}\right)\frac{1}{n+1}\right)=2\pi\int_0^1\sin2\pi x\,dx=0$$
        이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        또한 $\displaystyle\sum_{i=1}^{n}\left(\sin\frac{\pi}{n+1}\right)^2\left(\sin\frac{\pi i}{n+1}\right)^2\le n\left(\sin\frac{\pi}{n+1}\right)^2$이고 $n\left(\sin\frac{\pi}{n+1}\right)^2=\frac{n}{(n+1)^2}\left(\frac{\sin\frac{\pi}{n+1}}{\frac{1}{n+1}}\right)^2\to0\cdot\pi^2=0$이므로 $\displaystyle\lim_{n\to\infty}\sum_{i=1}^{n}\left(\sin\frac{\pi}{n+1}\right)^2\left(\sin\frac{\pi i}{n+1}\right)^2=0$을 얻는다.
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}\overrightarrow{b_1}\cdot\left(\sum_{i=1}^{n}\overrightarrow{b_i}\right)=0$이다.
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    method_no: 2
    key_idea: (자체 별해) 원의 중심을 $\mathrm{O}$라 하면 정$(n+1)$각형의 꼭짓점 위치벡터의 합이 $\vec0$이므로 $\sum\overrightarrow{b_i}=-(n+1)\overrightarrow{\mathrm{OA}}$이고, $\overrightarrow{b_1}\cdot\sum\overrightarrow{b_i}=(n+1)\left(1-\cos\frac{2\pi}{n+1}\right)=2(n+1)\sin^2\frac{\pi}{n+1}\to0$.
    steps:
    - id: 2c-1
      content: |
        $\displaystyle\sum_{i=1}^{n}\overrightarrow{b_i}=\sum_{i=1}^{n}(\overrightarrow{\mathrm{OB_i}}-\overrightarrow{\mathrm{OA}})=-(n+1)\overrightarrow{\mathrm{OA}}$이므로 $\overrightarrow{b_1}\cdot\sum\overrightarrow{b_i}=-(n+1)(\overrightarrow{\mathrm{OB_1}}-\overrightarrow{\mathrm{OA}})\cdot\overrightarrow{\mathrm{OA}}=2(n+1)\sin^2\dfrac{\pi}{n+1}\to0$.
      criteria: ['2.M1', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        3-1)의 공식(또는 동치)으로 $\overrightarrow{b_1}\cdot\sum\overrightarrow{b_i}$를 $i$에 관한 합의 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M2], max_points: 2}
      steps: [2b-1, 2c-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        첫째 합을 정적분과 급수의 관계로 $2\pi\int_0^1\sin2\pi x\,dx=0$으로 계산했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
