  materials:
  - '반지름 1인 원 위의 $n+1$등분점 $\mathrm{A,B_1,\cdots,B_n}$'
  - '한 점 $\mathrm{A}$에서 다른 등분점으로 향하는 벡터 $\overrightarrow{b_i}$'
  - '내적의 합 $\overrightarrow{b_1}\cdot\sum\overrightarrow{b_i}$의 극한'
  concepts:
  - '벡터의 크기와 내적'
  - '원주각과 중심각'
  - '삼각함수의 덧셈정리'
  - '정적분과 급수의 합 사이의 관계'
  - '삼각함수의 극한 $\lim\frac{\sin x}{x}=1$'
  tools:
  - '현의 길이 $2\sin\frac{\theta}{2}$'
  - '$\overrightarrow{b_i}\cdot\overrightarrow{b_j}=\lvert\overrightarrow{b_i}\rvert\lvert\overrightarrow{b_j}\rvert\cos\theta$'
  - '배각·덧셈정리 전개'
  - '구분구적 $\sum\sin\frac{2\pi i}{n+1}\cdot\frac1{n+1}\to\int_0^1\sin2\pi x\,dx$'
  - '부등식 평가 $\sum\le n\sin^2\frac{\pi}{n+1}$'
  conditions:
  - '현의 길이가 모두 같음 → 중심각 $\frac{2\pi}{n+1}$씩 등분'
  - '$\overrightarrow{b_i}$, $\overrightarrow{b_j}$ 사잇각 = 호 $\mathrm{B_iB_j}$에 대한 원주각 $\frac{\pi\lvert i-j\rvert}{n+1}$'
  stimuli_used: [글상자]
  subpart_links: '3-2)는 3-1)에서 얻은 내적 공식을 $j=1$에 적용'

