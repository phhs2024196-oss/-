intent: |
  벡터의 의미, 벡터의 내적, 삼각함수의 덧셈정리 등을 종합적으로 활용하고, 정적분과 급수 사이의 관계를 이해하고 활용하여 문제를 논리적으로 해결하는 능력을 평가한다(문항카드 '출제 의도' 요지).
key_idea: |
  현의 길이 $\lvert\overrightarrow{b_i}\rvert=2\sin\dfrac{\pi i}{n+1}$, 원주각에 의해 사잇각 $\dfrac{\pi\lvert i-j\rvert}{n+1}$이므로 $\overrightarrow{b_i}\cdot\overrightarrow{b_j}=4\sin\dfrac{\pi i}{n+1}\sin\dfrac{\pi j}{n+1}\cos\dfrac{\pi(i-j)}{n+1}$. 합의 극한은 정적분과 급수의 관계로 계산한다.
stuck: |
  두 벡터의 사잇각이 원주각(중심각의 절반)임을 알아채는 것, 덧셈정리로 전개한 합을 구분구적 꼴과 $0$으로 가는 항으로 나누는 것
idea_tags: [IDEA-CHORD-VECTOR-INSCRIBED-ANGLE, IDEA-SUM-LIMIT-RIEMANN-SPLIT]
tags: [원 위의 등분점, 벡터의 내적, 덧셈정리, 정적분과 급수]
