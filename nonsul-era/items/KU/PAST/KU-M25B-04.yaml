stimuli:
- label: 글상자
  body: |
    상금 당첨 행사에서 진홍색 공 $4$개와 파란색 공 $5$개가 든 상자가 준비되어 있다. 네 번의 공을 뽑을 기회가 주어진다. 뽑은 공은 다시 상자에 넣지 않는다.

stem: |
  다음 글을 읽고 물음에 답하시오. (15점)

subparts:
- id: '1'
  stem: |
    4-1) 네 번째 기회에서 진홍색 공을 뽑을 확률을 구하고, 그 이유를 설명하시오. (6점)
  points: 6
  depends_on: []
  answer: {kind: value, value: '4/9', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 네 번째 공을 먼저 정한다고 생각하면 $\frac{8\times7\times6\times4}{9\times8\times7\times6}=\frac49$.
    steps:
    - {id: 1a, content: '$\frac{8\times7\times6\times4}{9\times8\times7\times6}=\frac49$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 공 9개를 모두 구별하고 순서대로 네 번 뽑는 경우의 수를 세어 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 p.12
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        공 9개를 서로 구별하면 네 번 뽑는 전체 경우의 수는 $9\times8\times7\times6$이다. 네 번째 기회에서 진홍색 공을 뽑는 경우의 수는 네 번째 공(진홍색 4가지)을 정한 뒤 나머지 8개에서 앞의 세 번을 순서대로 뽑는 $8\times7\times6\times4$이다. 확률은
        $$\frac{\text{네 번째 기회에서 진홍색 공을 뽑는 경우의 수}}{\text{전체 경우의 수}}$$
        로 계산할 수 있다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $$\frac{8\times7\times6\times4}{9\times8\times7\times6}=\frac49$$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        전체 경우의 수 $9\times8\times7\times6$과 네 번째가 진홍색인 경우의 수 $8\times7\times6\times4$(또는 앞 세 번의 경우를 나눈 확률의 합)를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        확률 $\dfrac49$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRB-7210}
  misconceptions:
  - id: MC-PRB-7210
    outcome_code: '71'
    wrong_work: '앞의 세 번이 모두 파란색이라고 보고 $\tfrac46=\tfrac23$, 또는 앞 세 번이 모두 진홍색이 아닌 경우만 더함'
    detect_cue: 앞 세 번의 결과에 따른 경우를 모두 고려하지 않았다
    feedback: 앞의 결과를 모르는 상태에서 네 번째에 진홍색이 나올 확률은 모든 경우를 더해야 하며, 결과적으로 첫 번째와 같은 $\tfrac49$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    4-2) 첫 번째 기회에서 진홍색 공을 뽑는 경우 100만 원, 네 번째 기회에서 진홍색 공을 뽑는 경우 200만 원의 상금을 준다. 상자에서 공을 네 번 뽑았을 때 얻게 되는 총상금액을 확률변수 $X$라고 하자. 이때 $X$의 기댓값을 구하고, 그 이유를 설명하시오. (예를 들어, 첫 번째와 네 번째 기회 둘 다 진홍색 공을 뽑으면 상금은 300만 원이다.) (9점)
  points: 9
  depends_on: ['1']
  answer: {kind: value, value: '400/3', equivalents: ['400/3 (만 원)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $P(X=100)=\frac{20}{72}$, $P(X=200)=\frac{20}{72}$, $P(X=300)=\frac{12}{72}$ → $E(X)=\frac{400}{3}$(만 원).
    steps:
    - {id: 2a, content: '$100\cdot\frac{20}{72}+200\cdot\frac{20}{72}+300\cdot\frac{12}{72}=\frac{400}{3}$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $X$가 가질 수 있는 값을 모두 적어 보자.
    - 첫 번째와 네 번째가 모두 진홍색인 경우를 빠뜨리지 말자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 p.12
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $X$는 $0,100,200,300$(만 원)의 값을 가지므로 $E[X]=100P(X=100)+200P(X=200)+300P(X=300)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        여기서
        $$P\{X=100\}=P\{\text{첫 번째 진홍색 공, 네 번째 파란색 공}\}=\frac{4\times7\times6\times5}{9\times8\times7\times6}=\frac{20}{72},$$
        $$P\{X=200\}=P\{\text{첫 번째 파란색 공, 네 번째 진홍색 공}\}=\frac{5\times7\times6\times4}{9\times8\times7\times6}=\frac{20}{72},$$
        $$P\{X=300\}=P\{\text{첫 번째 진홍색 공, 네 번째 진홍색 공}\}=\frac{4\times7\times6\times3}{9\times8\times7\times6}=\frac{12}{72}.$$
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        따라서 $E[X]=100\cdot\dfrac{20}{72}+200\cdot\dfrac{20}{72}+300\cdot\dfrac{12}{72}=\dfrac{400}{3}$(만 원)이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $X$의 값 $0,100,200,300$(만 원)을 정하고 $E[X]=\sum x\,P(X=x)$의 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $P(X=100)=\dfrac{20}{72}$, $P(X=200)=\dfrac{20}{72}$, $P(X=300)=\dfrac{12}{72}$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $E[X]=\dfrac{400}{3}$(만 원)을 얻었다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRB-7211}
  misconceptions:
  - id: MC-PRB-7211
    outcome_code: '71'
    wrong_work: '$P(X=100)=\tfrac49$, $P(X=200)=\tfrac49$로 두고 $X=300$ 경우를 따로 세지 않거나 함께 더해 확률 합이 1을 넘음'
    detect_cue: 확률분포의 확률 합이 $1$이 아니거나 $X=300$ 항이 없다
    feedback: 사건 "첫 번째 진홍색"과 "네 번째 진홍색"은 동시에 일어날 수 있습니다. $X$의 각 값에 해당하는 사건이 서로 겹치지 않게 나누세요.
    remedy: [RL-2]

