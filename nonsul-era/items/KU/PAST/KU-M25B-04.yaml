intent: |
  확률과 기댓값의 의미를 정확히 이해하고, 비복원 추출에서의 확률과 이산확률변수의 기댓값(평균)을 구하는 과정을 평가한다(문항카드 '출제 의도'·'문항 해설' 요지).
key_idea: |
  네 번을 순서대로 뽑는 경우의 수를 세면 네 번째에 진홍색이 나올 확률은 첫 번째와 같은 $\frac49$이다. 상금 $X$의 값 $100,200,300$(만 원)에 대한 확률을 각각 구해 기댓값을 계산한다.
stuck: |
  비복원 추출이라도 특정 순서에 특정 색이 나올 확률은 앞의 결과를 모를 때 처음과 같다는 것, $X=300$(두 번 모두 진홍색) 경우를 따로 세는 것
