stimuli: []
stem: |
  다음은 전체집합 $U$의 두 부분집합 $A, B$에 대하여 집합의 연산 법칙을 이용하여

  $$\{(A\cup B)-(A\cap B)\}\cup A=A\cup B$$

  를 증명하는 과정이다.
subparts:
- id: '1'
  stem: |
    각각의 단계에 알맞게 ①∼④를 채우시오. [150점]

    $$\begin{array}{ll}
    \{(A\cup B)-(A\cap B)\}\cup A & \\
    \quad\Downarrow & \text{(차집합의 성질)}\\
    =\{(A\cup B)\cap(A\cap B)^{c}\}\cup A & \\
    \quad\Downarrow & \text{(드 모르간의 법칙)}\\
    =\{\boxed{\text{①}}\}\cup A & \\
    \quad\Downarrow & \text{(분배법칙)}\\
    =\boxed{\text{②}} & \\
    \quad\Downarrow & (\boxed{\text{③}})\\
    =\{(B\cup A)\cup A\}\cap\{(B^{c}\cup A^{c})\cup A\} & \\
    \quad\Downarrow & \text{(결합법칙)}\\
    =\boxed{\text{④}} & \\
    \quad\Downarrow & \text{(여집합의 성질)}\\
    =\{B\cup(A\cup A)\}\cap(B^{c}\cup U) & \\
    \quad\Downarrow & \text{(전체집합의 성질)}\\
    =B\cup A & \\
    \quad\Downarrow & (\boxed{\text{③}})\\
    =A\cup B &
    \end{array}$$
  points: 150
  depends_on: []
  answer:
    kind: value
    value: 1=(A|B)&(Ac|Bc); 2=((A|B)|A)&((Ac|Bc)|A); 3=교환법칙; 4=(B|(A|A))&(Bc|(Ac|A))
    equivalents:
    - ① $(A\cup B)\cap(A^{c}\cup B^{c})$
    - ② $\{(A\cup B)\cup A\}\cap\{(A^{c}\cup B^{c})\cup A\}$
    - ③ 교환법칙
    - ④ $\{B\cup(A\cup A)\}\cap\{B^{c}\cup(A^{c}\cup A)\}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        드 모르간의 법칙에 의하여 $(A\cap B)^{c}=A^{c}\cup B^{c}$이므로 ① $=\{(A\cup B)\cap(A^{c}\cup B^{c})\}$이다.
      source_flow: 모범답안 p.30
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        분배법칙에 의하여 $(A\cap B)\cup C=(A\cup C)\cap(B\cup C)$이므로 ② $=\{(A\cup B)\cup A\}\cap\{(A^{c}\cup B^{c})\cup A\}$이다.
      source_flow: 모범답안 p.30
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        ③에 의하여 $A\cup B=B\cup A$ 연산을 해야 하므로 ③은 교환법칙이다.
      source_flow: 모범답안 p.30
      criteria:
      - 1.B3
    - id: 1b-4
      content: |
        결합법칙에 의하여 $(A\cup B)\cup C=A\cup(B\cup C)$이므로 ④ $=\{B\cup(A\cup A)\}\cap\{B^{c}\cup(A^{c}\cup A)\}$이다.
      source_flow: 모범답안 p.30
      criteria:
      - 1.B4
