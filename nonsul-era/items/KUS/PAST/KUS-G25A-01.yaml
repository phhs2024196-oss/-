    - id: 1.B2
      mark_type: B
      points: 40
      evidence: ② $=\{(A\cup B)\cup A\}\cap\{(A^{c}\cup B^{c})\cup A\}$을 서술하였다.
      steps:
      - 1b-2
    - id: 1.B3
      mark_type: B
      points: 40
      evidence: ③이 교환법칙임을 서술하였다.
      steps:
