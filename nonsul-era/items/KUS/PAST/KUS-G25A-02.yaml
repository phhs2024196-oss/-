stem: |
  $7$개의 숫자 $0, 1, 2, 3, 4, 5, 6$ 중 서로 다른 $5$개의 숫자를 사용하여 $5$의 배수가 아닌 다섯 자리의 자연수를 만들려고 한다. 만들 수 있는 모든 수를 큰 수부터 차례로 나열할 때,
subparts:
- id: '1'
  stem: |
    $105$번째에 오는 수를 구하시오. [150점]
  points: 150
  depends_on: []
  answer:
    kind: value
    value: '63201'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $65\square\square\square$꼴인 자연수의 개수는 ${}_5\mathrm{P}_3=60$이며 이 중 $5$의 배수는 $65\square\square0$꼴이므로 자연수의 개수는 ${}_4\mathrm{P}_2=12$이다. 따라서 $65\square\square\square$꼴인 $5$의 배수가 아닌 자연수의 개수는 $48$개이다.
      source_flow: 모범답안 p.32
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $64\square\square\square$꼴인 자연수의 개수는 ${}_5\mathrm{P}_3=60$이며 이 중 $5$의 배수는 $64\square\square0$, $64\square\square5$꼴이므로 자연수의 개수는 $2\times{}_4\mathrm{P}_2=24$이다. 따라서 $64\square\square\square$꼴인 $5$의 배수가 아닌 자연수의 개수는 $36$개이다.
      source_flow: 모범답안 p.32
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $635\square\square$꼴인 자연수의 개수는 ${}_4\mathrm{P}_2=12$이며 이 중 $5$의 배수는 $635\square0$꼴이므로 자연수의 개수는 $3$개이다. $635\square\square$꼴인 $5$의 배수가 아닌 자연수의 개수는 $9$개이다. $634\square\square$꼴인 자연수의 개수는 ${}_4\mathrm{P}_2=12$이며 이 중 $5$의 배수는 $634\square5$, $634\square0$꼴이므로 자연수의 개수는 $6$개이다. $634\square\square$꼴인 $5$의 배수가 아닌 자연수의 개수는 $6$개다. $632\square\square$꼴인 자연수의 개수는 $634\square\square$꼴인 자연수의 개수와 같으므로 $6$개다. 그러므로 큰 수부터 차례로 나열할 때 $105$번째 자연수는 $632\square\square$꼴인 $5$의 배수가 아닌 자연수 중 가장 작은 자연수인 $63201$이다.
      source_flow: 모범답안 p.32
      criteria:
      - 1.M3
