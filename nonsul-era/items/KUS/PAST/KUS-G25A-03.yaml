stem: |
  곡선 $y=\dfrac{1}{2}x^2$과 한 점 $\mathrm{A}_1(1,0)$이 있다. 점 $\mathrm{A}_1$을 지나며 $x$축과 수직인 직선이 곡선과 만나는 점을 $\mathrm{P}_1$이라 하고, 점 $\mathrm{P}_1$에서의 접선이 $x$축과 만나는 점을 $\mathrm{A}_2$, 접선과 수직인 직선이 $x$축과 만나는 점을 $\mathrm{Q}_1$이라 하자. 점 $\mathrm{A}_2$를 지나며 $x$축과 수직인 직선이 곡선과 만나는 점을 $\mathrm{P}_2$라 하고, 점 $\mathrm{P}_2$에서의 접선이 $x$축과 만나는 점을 $\mathrm{A}_3$, 접선과 수직인 직선이 $x$축과 만나는 점을 $\mathrm{Q}_2$라 하자.

  이와 같은 방법으로 점 $\mathrm{A}_k$를 지나며 $x$축과 수직인 직선이 곡선과 만나는 점을 $\mathrm{P}_k$라 하고, 점 $\mathrm{P}_k$에서의 접선이 $x$축과 만나는 점을 $\mathrm{A}_{k+1}$, 접선과 수직인 직선이 $x$축과 만나는 점을 $\mathrm{Q}_k$라 하자.
subparts:
- id: '1'
  stem: |
    삼각형 $\mathrm{A}_{k+1}\mathrm{P}_k\mathrm{Q}_k$의 넓이를 $S_k$라 할 때, $S_{10}$의 값을 구하시오. [175점]

    [그림 1: 곡선 $y=\frac12x^2$ 위의 점 $\mathrm{P}_1$, $\mathrm{P}_2$와 $x$축 위의 점 $\mathrm{A}_3, \mathrm{A}_2, \mathrm{Q}_2, \mathrm{A}_1, \mathrm{Q}_1$이 차례로 놓이고, $\mathrm{P}_1$, $\mathrm{P}_2$에서의 접선과 이에 수직인 직선, $\mathrm{A}_1$, $\mathrm{A}_2$를 지나는 수직선(직각 표시)이 그려져 있다]
  points: 175
  depends_on: []
  answer:
    kind: value
    value: 1/2**48 + 1/2**30
    equivalents:
    - $\dfrac{1}{2^{48}}+\dfrac{1}{2^{30}}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=\dfrac12x^2$에서 $y'=x$이므로 $\mathrm{P}_k\!\left(x_k,\dfrac12x_k^2\right)$에서의 접선의 방정식은 $y=x_k(x-x_k)+\dfrac12x_k^2$이고, $\cdots$ (1)

        $\mathrm{P}_k$에서의 접선에 수직인 방정식은 $y=-\dfrac{1}{x_k}(x-x_k)+\dfrac12x_k^2$이다. $\cdots$ (2)
      source_flow: 모범답안 p.34-35
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        (1)식에서 $y=0$이면 $x=\dfrac12x_k$이므로 $\mathrm{A}_{k+1}\!\left(\dfrac12x_k,0\right)$이다.

        (2)식에서 $y=0$이면 $x=\dfrac12x_k^3+x_k$이므로 $\mathrm{Q}_k\!\left(\dfrac12x_k^3+x_k,0\right)$이다.

        따라서 각 점들의 좌표는 $\mathrm{A}_{k+1}\!\left(\dfrac12x_k,0\right)$, $\mathrm{P}_k\!\left(x_k,\dfrac12x_k^2\right)$, $\mathrm{Q}_k\!\left(\dfrac12x_k^3+x_k,0\right)$이 된다.
      source_flow: 모범답안 p.34-35
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        밑변 $\overline{\mathrm{A}_{k+1}\mathrm{Q}_k}=\dfrac12(x_k^3+x_k)$, 높이 $\dfrac12x_k^2$이므로 삼각형 $\mathrm{A}_{k+1}\mathrm{P}_k\mathrm{Q}_k$의 넓이 $S_k$는 $S_k=\dfrac12\cdot\dfrac12x_k^2\cdot\dfrac12(x_k^3+x_k)=\dfrac18(x_k^5+x_k^3)$이다.
      source_flow: 모범답안 p.34-35
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        또한, $x_1=1$, $x_{k+1}=\dfrac12x_k$이므로 공비가 $\dfrac12$인 등비수열이다. 따라서 $x_k=\left(\dfrac12\right)^{k-1}$이므로, $x_{10}=\dfrac{1}{2^9}$이고, 삼각형의 넓이는 $S_{10}=\dfrac18(x_{10}^5+x_{10}^3)=\dfrac18\left(\dfrac{1}{2^{45}}+\dfrac{1}{2^{27}}\right)=\dfrac{1}{2^{48}}+\dfrac{1}{2^{30}}$가 된다.
      source_flow: 모범답안 p.34-35
      criteria:
      - 1.A1
