stimuli: []
stem: |
  $r$은 $0$이 아닌 상수이고, 최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.

  <가> 방정식 $f(x)=0$은 서로 다른 세 실근 $a_1, a_2, a_3$ $(a_1<a_2<a_3)$을 갖고 $e^{a_1}, e^{a_2}, e^{a_3}$은 이 순서대로 공비가 $r$인 등비수열이다.

  <나> 함수 $g(x)=f(x+2)$일 때, $y=g(x)$의 그래프는 원점에 대하여 대칭이다.

  $b_1\neq0$이고 공비가 $r$인 등비수열 $\{b_n\}$에 대하여

  $$\dfrac{b_9}{b_6}-\dfrac{4b_5}{b_3}-\dfrac{12b_2}{b_1}=0$$
subparts:
- id: '1'
  stem: |
    일 때, $f(1)\times\lim\limits_{x\to3}\dfrac{\ln(f(x))-\ln(f(3))}{x-3}$의 값을 구하시오. [175점]
  points: 175
  depends_on: []
  answer:
    kind: value
    value: log(6)**2 - 3
    equivalents:
    - $(\ln6)^2-3$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가)에서 $e^{a_1}, e^{a_2}, e^{a_3}$이 등비수열을 이루므로 $e^{a_2-a_1}=e^{a_3-a_2}$이다. 따라서 $a_2-a_1=a_3-a_2=d$라 할 때 $a_2=a_1+d$, $a_3=a_2+d=a_1+2d$이므로 $a_1, a_2, a_3$는 등차수열이 된다.
      source_flow: 모범답안 p.38-39
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        방정식 $f(x)=0$의 서로 다른 세 실근을 작은 것부터 순서대로 나열하면 등차수열을 이루므로 방정식 $g(x)=0$의 서로 다른 세 실근도 순서대로 등차수열을 이룬다. $y=g(x)$의 그래프는 원점대칭인 삼차함수이므로 $g(x)=x(x+d)(x-d)$이다. $y=g(x)$를 $x$축 방향으로 $2$만큼 평행이동하면 $f(x)=(x-2)(x+d-2)(x-d-2)$이다.
      source_flow: 모범답안 p.38-39
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $b_1\neq0$이고 공비가 $r$인 등비수열의 일반항은 $b_n=b_1r^{n-1}$이므로 $\dfrac{b_9}{b_6}-\dfrac{4b_5}{b_3}-\dfrac{12b_2}{b_1}=r^3-4r^2-12r=r(r^2-4r-12)=r(r-6)(r+2)=0$이다. (가)에서 $e^{a_1}, e^{a_2}, e^{a_3}>0$이므로 $r>0$이다. 따라서 $r=6$이다. 그러므로 $a_1, a_2, a_3$는 공차 $d=\ln6$인 등차수열이다.
      source_flow: 모범답안 p.38-39
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서 $f(x)=(x-2)(x+\ln6-2)(x-\ln6-2)$이므로 $f(1)=(\ln6)^2-1$이다.
      source_flow: 모범답안 p.38-39
      criteria:
      - 1.A1
    - id: 1b-5
      content: |
        그리고 $f(x)>0$이면, $(\ln f(x))'=\dfrac{f'(x)}{f(x)}$이므로 $(\ln f(x))'=\dfrac{f'(x)}{f(x)}=\dfrac{3(x-2)^2-(\ln6)^2}{(x-2)(x+\ln6-2)(x-\ln6-2)}$이다. 따라서 $\lim\limits_{x\to3}\dfrac{\ln(f(x))-\ln(f(3))}{x-3}=\dfrac{f'(3)}{f(3)}=\dfrac{3-(\ln6)^2}{1-(\ln6)^2}$이다.
      source_flow: 모범답안 p.38-39
      criteria:
      - 1.M4
    - id: 1b-6
      content: |
        그러므로 $f(1)\times\lim\limits_{x\to3}\dfrac{\ln(f(x))-\ln(f(3))}{x-3}=(\ln6)^2-3$이다.
      source_flow: 모범답안 p.38-39
      criteria:
      - 1.A2
