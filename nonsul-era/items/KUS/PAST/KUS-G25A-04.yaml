    - id: 1.M2
      mark_type: M
      points: 40
      evidence: $g(x)$의 그래프가 원점대칭임을 이용하여 공차 $d$에 대하여 $g(x)=x(x+d)(x-d)$를 구하였다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 40
      evidence: 삼차방정식의 해를 구하고, 공비 $r>0$임을 이용하여 공차 $d$를 구하였다.
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: $f(1)=(\ln6)^2-1$을 구하였다.
      depends_on:
      - 1.M2
      - 1.M3
      implied_ok: true
      steps:
      - 1b-4
    - id: 1.M4
      mark_type: M
      points: 30
      evidence: $\lim\limits_{x\to3}\frac{\ln(f(x))-\ln(f(3))}{x-3}=\frac{f'(3)}{f(3)}=\frac{3-(\ln6)^2}{1-(\ln6)^2}$를 구하였다.
      depends_on:
      - 1.M2
      - 1.M3
      implied_ok: true
      steps:
      - 1b-5
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: $f(1)\times\lim\limits_{x\to3}\frac{\ln(f(x))-\ln(f(3))}{x-3}=(\ln6)^2-3$을 구하였다.
      depends_on:
      - 1.A1
      - 1.M4
      steps:
      - 1b-6
    note: '원본 채점기준 단서: 한번에 이 값을 구한 경우 f(1)=(ln6)^2-1 과 극한값에 대한 부분점수 모두 부여(1.A1·1.M4 implied_ok).'
