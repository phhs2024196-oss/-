stimuli: []
stem: |
  다음 그림과 같이 중심이 $\mathrm{A}(r,0)$이고 반지름의 길이가 $r$인 원 $C$와 $y$축 위의 점 $\mathrm{B}(0,1)$에서 원 $C$에 그은 접선 $l$이 제$1$사분면에서 만나는 점을 $\mathrm{P}$라고 하자. 접선 $l$의 기울기를 $f(r)$, 점 $\mathrm{P}$의 $x$좌표를 $g(r)$이라고 할 때,
subparts:
- id: '1'
  stem: |
    $\lim\limits_{r\to\infty}f(r)g(2r)$의 값을 구하시오. (단, $r>1$이다.) [175점]

    [그림 1: 좌표평면에서 중심 $\mathrm{A}$가 $x$축 위에 있는 원 $C$, $y$축 위의 점 $\mathrm{B}$에서 원에 그은 접선 $l$과 접점 $\mathrm{P}$(제$1$사분면), 원점 $\mathrm{O}$가 표시되어 있다]
  points: 175
  depends_on: []
  answer:
    kind: value
    value: lim=1/2; f=(r**2-1)/(2*r); g=2*r/(r**2+1)
    equivalents:
    - $f(r)=\dfrac{r^2-1}{2r}$
    - $g(r)=\dfrac{2r}{r^2+1}$
    - $\lim\limits_{r\to\infty}f(r)g(2r)=\dfrac12$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        접선 $l$의 기울기가 $m=f(r)$이므로 직선의 방정식은 $y=mx+1$이다. 이를 원 $C$의 방정식 $(x-r)^2+y^2=r^2$에 대입하면 $(m^2+1)x^2+2(m-r)x+1=0$이므로 $\dfrac{D}{4}=(m-r)^2-(m^2+1)=0$을 만족하기 위한 조건은 $m=f(r)=\dfrac{r^2-1}{2r}$이다.
      source_flow: 모범답안 p.41
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이 때 점 $\mathrm{P}$의 $x$좌표는 $g(r)=\dfrac{2r}{r^2+1}$이 된다.
      source_flow: 모범답안 p.41
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 $\lim\limits_{r\to\infty}f(r)g(2r)=\lim\limits_{r\to\infty}\left(\dfrac{r^2-1}{2r}\right)\left\{\dfrac{2\times2r}{((2r)^2+1)}\right\}=\dfrac12$.
      source_flow: 모범답안 p.41
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
