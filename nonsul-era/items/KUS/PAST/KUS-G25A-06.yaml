stimuli: []
stem: |
  실수 전체의 집합에서 미분가능한 함수 $f(x)$가 다음 조건을 만족시킬 때,
subparts:
- id: '1'
  stem: |
    $\displaystyle\int_0^2x^2f(x)f'(x)\,dx$의 값을 구하시오. [175점]

    <가> 모든 실수 $x$에 대하여 $f(x)>0$이고, $2x\{f(x)\}^2+f'(x)=0$이다.

    <나> $f(0)=1$이고, $f'(2)=-\dfrac{4}{25}$이다.
  points: 175
  depends_on: []
  answer:
    kind: value
    value: -8/25
    equivalents:
    - $-\dfrac{8}{25}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $2x\{f(x)\}^2+f'(x)=0$이므로 $f'(x)=-2x\{f(x)\}^2$이고, $x=2$이면 $f'(2)=-2\cdot2\cdot\{f(2)\}^2=-\dfrac4{25}$, $f(2)=\dfrac15$ $(\because f(x)>0)$이다.
      source_flow: 모범답안 p.43
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\int_0^2f'(x)\,dx=\int_0^2-2x\{f(x)\}^2dx=-\left[x^2\{f(x)\}^2\right]_0^2+\int_0^22x^2f(x)f'(x)\,dx=-4\{f(2)\}^2+\int_0^22x^2f(x)f'(x)\,dx$
      source_flow: 모범답안 p.43
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        이므로 $\displaystyle\int_0^2x^2f(x)f'(x)\,dx=\dfrac12\left(4\{f(2)\}^2+f(2)-f(0)\right)=-\dfrac8{25}$이다.
      source_flow: 모범답안 p.43
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
