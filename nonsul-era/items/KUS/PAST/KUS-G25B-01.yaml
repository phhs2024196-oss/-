    meaning: 만점
  misconceptions: []
- id: 1-3
  stem: |
    제시문 <나>에서 정의된 함수 $h(x)$의 $k$가 문제 1-2에서 구한 $k$라 하자. 이때, $b<16a$이면 두 함수 $g(x)$와 $h(x)$는 다음을 만족시킨다.

    (1) $\left\{h\left(\sqrt{\dfrac{a}{2b}}\right)\right\}^2-\left\{g\left(\sqrt{\dfrac{a}{2b}}\right)\right\}^2=\dfrac b3$

    (2) 곡선 $y=h(x)$ 위의 점 $\left(\dfrac14,h\left(\dfrac14\right)\right)$에서의 접선이 원점을 지난다.

    곡선 $y=g(x)$ 위의 점 $\mathrm{P}\left(\dfrac14,g\left(\dfrac14\right)\right)$에서의 접선이 $x$축과 만나는 점을 $\mathrm{Q}(q,0)$라 하자. 원점 $\mathrm{O}$에 대하여 삼각형 $\mathrm{PQO}$의 넓이를 구하고, 그 과정을 논술하시오. [120점]
  points: 120
  depends_on:
  - 1-2
  answer:
    kind: value
    value: a=4; b=32; Py=4/sqrt(3); q=1; S=2*sqrt(3)/3
    equivalents:
    - $a=4$, $b=32$, $\mathrm{P}\left(\frac14,\frac4{\sqrt3}\right)$, $\mathrm{Q}(1,0)$, 넓이 $\dfrac{2\sqrt3}{3}$
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        [1-2]의 결과에 의해 함수 $g(x)=\dfrac{\sqrt b}{\sqrt{a+bx^2}}$이고, $h(x)=\dfrac{\sqrt b}{\sqrt{a-bx^2}}$이다. $\left\{h\left(\sqrt{\dfrac a{2b}}\right)\right\}^2-\left\{g\left(\sqrt{\dfrac a{2b}}\right)\right\}^2=\dfrac{2b}{a}-\dfrac{2b}{3a}=\dfrac{4b}{3a}=\dfrac b3$이므로 $a=4$이다.
      source_flow: 모범답안 p.48-49
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        $h'(x)=\dfrac{b\sqrt b\,x}{(4-bx^2)^{3/2}}$이므로 $\left(\dfrac14,h\left(\dfrac14\right)\right)$에서의 접선의 방정식은 $y=\dfrac{\dfrac{b\sqrt b}{4}}{\left(4-\dfrac b{16}\right)^{3/2}}\left(x-\dfrac14\right)+\dfrac{\sqrt b}{\left(4-\dfrac b{16}\right)^{1/2}}$이다. 이 접선이 원점을 지나므로 $-\dfrac{\dfrac{b\sqrt b}{16}}{\left(4-\dfrac b{16}\right)^{3/2}}+\dfrac{\sqrt b}{\left(4-\dfrac b{16}\right)^{1/2}}=0$이다. 따라서 $b=32$이고 $g(x)=\dfrac{\sqrt{32}}{\sqrt{4+32x^2}}$이다.
      source_flow: 모범답안 p.48-49
      criteria:
      - 1-3.M2
    - id: 13b-3
      content: |
        이때 $g\left(\dfrac14\right)=\dfrac{\sqrt{32}}{\sqrt6}=\dfrac4{\sqrt3}$이므로 점 $\mathrm{P}$는 $\left(\dfrac14,\dfrac4{\sqrt3}\right)$이다.
      source_flow: 모범답안 p.48-49
      criteria:
      - 1-3.A1
    - id: 13b-4
      content: |
        그리고 $g'(x)=-\dfrac{32\sqrt{32}\,x}{(4+32x^2)^{3/2}}$이므로 $g'\left(\dfrac14\right)=-\dfrac{16}{3\sqrt3}$이다. 따라서 접선의 방정식은 $y=-\dfrac{16}{3\sqrt3}\left(x-\dfrac14\right)+\dfrac4{\sqrt3}$이므로 $x$축과 만나는 점의 $x$좌표는 $\dfrac{16}{3\sqrt3}x=\dfrac4{3\sqrt3}+\dfrac4{\sqrt3}=\dfrac{16}{3\sqrt3}\ \Rightarrow\ x=1$이므로 $x$축과 만나는 점 $\mathrm{Q}$는 $(1,0)$이다.
      source_flow: 모범답안 p.48-49
      criteria:
      - 1-3.M3
    - id: 13b-5
      content: |
        따라서 세 점 $\mathrm{P}\left(\dfrac14,\dfrac4{\sqrt3}\right)$, $\mathrm{Q}(1,0)$, $\mathrm{O}(0,0)$로 만들어지는 삼각형 $\mathrm{PQO}$의 넓이는 $\dfrac2{\sqrt3}=\dfrac{2\sqrt3}{3}$이다.
      source_flow: 모범답안 p.48-49
      criteria:
      - 1-3.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 25
      evidence: $\left\{h\left(\sqrt{\frac a{2b}}\right)\right\}^2-\left\{g\left(\sqrt{\frac a{2b}}\right)\right\}^2=\frac{2b}a-\frac{2b}{3a}=\frac{4b}{3a}=\frac b3$을 이용하여 $a=4$를 구하였다.
      steps:
      - 13b-1
    - id: 1-3.M2
      mark_type: M
      points: 25
      evidence: $x=\frac14$에서의 $g(x)$의 접선이 원점을 지난다는 것을 이용하여 $b=32$를 구하였다.
      depends_on:
      - 1-3.M1
      steps:
      - 13b-2
    - id: 1-3.A1
      mark_type: A
      points: 25
      evidence: 점 $\mathrm{P}$의 $y$좌표를 구하였다.
      depends_on:
      - 1-3.M2
      steps:
      - 13b-3
    - id: 1-3.M3
      mark_type: M
      points: 25
      evidence: $g(x)$의 접선의 방정식을 이용하여 $x$축 과의 교점 $\mathrm{Q}$의 $x$좌표가 $1$임을 구하였다.
      depends_on:
      - 1-3.M2
