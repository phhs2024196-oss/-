    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    제시문 <나>에서 정의된 함수 $g(x)$가 정의역의 모든 실수 $x$에 대하여 다음 식을 만족시킨다고 하자.

    $$x\{g(x)\}^3+g'(x)=0$$

    이때, 양의 실수 $k$의 값을 $b$에 관한 식으로 표현하고, 그 과정에 대해 논술하시오. [80점]
  points: 80
  depends_on: []
  answer:
    kind: value
    value: k=sqrt(b)
    equivalents:
    - $k=\sqrt b$
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        함수 $g(x)$에 대하여 $\{g(x)\}^3=\dfrac{k^3}{(a+bx^2)^{3/2}}$이고, $g'(x)=-k\left(\dfrac{bx}{(a+bx^2)^{3/2}}\right)$이다.
      source_flow: 모범답안 p.48
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $\dfrac{k^3x}{(a+bx^2)^{3/2}}-kb\left(\dfrac{x}{(a+bx^2)^{3/2}}\right)=0$을 만족하므로 항등식이므로 $k^3=kb$이다. 따라서 $k^2=b$이다.
      source_flow: 모범답안 p.48
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        따라서 $k=\sqrt b$이다.
      source_flow: 모범답안 p.48
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 30
      evidence: $g'(x)=-k\left(\frac{bx}{(a+bx^2)^{3/2}}\right)$를 구하였다.
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 20
      evidence: $\frac{k^3x}{(a+bx^2)^{3/2}}-kb\left(\frac{x}{(a+bx^2)^{3/2}}\right)=0$이 항등식임을 이용하여 $k^3=kb$임을 구하였다.
      depends_on:
      - 1-2.M1
      steps:
      - 12b-2
    - id: 1-2.A1
