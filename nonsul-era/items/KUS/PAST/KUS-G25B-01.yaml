      points: 25
      evidence: 근의 개수 $n=4m$을 구하였다.
      depends_on:
      - 1-1.M1
      steps:
      - 11b-2
    - id: 1-1.A1
      mark_type: A
      points: 25
      evidence: 등차수열의 공차 $d=\frac1{2m}$를 구하였다.
      depends_on:
      - 1-1.M2
      steps:
      - 11b-3
    - id: 1-1.A2
      mark_type: A
      points: 25
      evidence: $L=\sin\frac\pi4=\frac{\sqrt2}{2}$를 구하였다.
      depends_on:
      - 1-1.A1
      steps:
      - 11b-3
  outcome_codes:
