key_idea: $\lvert\sin\pi mx\rvert=L$의 근이 한 주기에 4개이고 등차수열이 되도록 하는 $L=\sin\frac\pi4$를 구하고, 항등식 $x\{g(x)\}^3+g'(x)=0$에서 $k^2=b$, 이어서 조건 (1), (2)로 $a=4$, $b=32$를 구해 접선과 삼각형의 넓이를 계산한다.
stuck: 근 $b_1, b_2, b_3, b_4$의 대칭성($b_1+b_4=b_2+b_3$)으로 등차수열 조건을 $b_1=\frac1{4m}$, 곧 $L=\sin\frac\pi4$로 바꾸는 일과, 접선이 원점을 지난다는 조건을 $b$에 대한 방정식으로 세우는 일
