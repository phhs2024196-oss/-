stimuli:
- label: 가
  body: |
    수열 $\{a_n\}$이 모든 자연수 $i$에 대하여 $a_{i+1}-a_i$의 값이 일정하면 등차수열이라 하고, $a_{i+1}-a_i$의 값을 공차라 한다. 즉, 등차수열은 첫째항이 $a_1$이고, 공차가 $d$이면

    $$a_n=a_1+(n-1)d$$

    를 일반항으로 하는 수열이다.
- label: 나
  body: |
    양의 실수 $a, b, k$에 대하여 정의역이 $\left\{x\mid \lvert x\rvert<\sqrt{\dfrac ab}\right\}$인 두 함수 $g(x)$와 $h(x)$가

    $$g(x)=\dfrac{k}{\sqrt{a+bx^2}},\ h(x)=\dfrac{k}{\sqrt{a-bx^2}}$$

    라 하자.
stem: |
  1. 다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: 1-1
  stem: |
    함수 $f(x)=\sin\pi x$와 $0<L<1$인 실수 $L$, 양의 정수 $m$에 대하여 $0\le x\le2$에서 $x$에 대한 방정식 $\lvert f(mx)\rvert=L$의 서로 다른 $n$개의 실근

    $$b_1, b_2, b_3, \cdots, b_n\ (b_i<b_{i+1},\ i=1,2,3,\cdots,n-1)$$

    은 이 순서대로 공차가 $d$인 등차수열을 이룬다. 이때 $L$의 값을 구하고, $d$와 $n$을 $m$에 관한 식으로 표현하고, 그 과정에 대해 논술하시오. [100점]
  points: 100
  depends_on: []
  answer:
    kind: value
    value: L=sqrt(2)/2; d=1/(2*m); n=4*m
    equivalents:
    - $L=\dfrac{\sqrt2}{2}$, $d=\dfrac1{2m}$, $n=4m$
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        함수 $f(x)$는 주기가 $2$인 함수이므로 양의 정수 $m$에 대하여 $f(mx)$는 주기가 $\dfrac2m$인 함수이다. 그러므로 $0\le x\le2$인 범위에서 주기가 $\dfrac2m$인 함수의 그래프는 $m$번 반복해서 그려진다.
      source_flow: 모범답안 p.48
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $0<L<1$인 $L$에 대하여 $\lvert f(mx)\rvert=L$의 근의 개수는 한 주기 당 $4$개이므로 $\lvert f(mx)\rvert=L$의 근의 개수는 $n=4m$번이다.
      source_flow: 모범답안 p.48
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        한 주기마다 $4$개의 근이 생기므로 첫 번째 주기의 근을 $b_1, b_2, b_3, b_4$라 할 때, 사인함수의 성질에 의해 $b_1+b_4=b_2+b_3=\dfrac2m$이므로 $2b_1+3d=\dfrac2m$이고, $b_1+b_2=\dfrac1m$이므로 $2b_1+d=\dfrac1m$이다. 따라서 $2d=\dfrac1m$이다. 그러므로 $d=\dfrac1{2m}$이고, $b_1=\dfrac1{4m}$이다. 따라서 $L=\sin\dfrac\pi4=\dfrac{\sqrt2}{2}$이다.
      source_flow: 모범답안 p.48
      criteria:
      - 1-1.A1
      - 1-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 25
      evidence: $f(mx)$ 또는 $\lvert f(mx)\rvert$의 주기 $\frac2m$를 구하였다.
