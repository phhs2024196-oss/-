- id: 2-4
  stem: |
    다른 제약회사 D에서 개발한 신약의 무게는 모평균이 $m_2$이고 모표준편차가 $\sigma_2$인 정규분포를 따른다. 이때 모표준편차 $\sigma_2$는 문제 2-2에서 구한 제약회사 C의 모표준편차인 $\sigma_1$과 같다. 제약회사 D에서 만든 신약 중에서 $n$개를 임의로 추출하여 얻은 표본평균을 이용하여 구한 모평균 $m_2$에 대한 신뢰도 $96\%$의 신뢰구간은 $a\le m_2\le b$이다. 이때, $b-a\le0.4$가 되기 위한 $n$의 최솟값을 구하시오. [80점]
  points: 80
  depends_on:
  - 2-2
  answer:
    kind: value
    value: '100'
    equivalents:
    - $n\ge100$이므로 최솟값 $100$
    tolerance: null
  solutions:
  - id: S24-B
    audience: B
    method_no: 1
    steps:
    - id: 24b-1
      content: |
        $\mathrm{P}(-2\le Z\le2)=0.96$이므로 신뢰도 $96\%$의 신뢰구간에 대응하는 $z$값은 $2$이다.
      source_flow: 모범답안 p.55
      criteria:
      - 2-4.M1
    - id: 24b-2
      content: |
        제약회사 D에서 개발한 알약을 임의로 한 개 선택했을 때 알약의 무게를 $W$라 하면, $W$는 정규분포 $\mathrm{N}(m_2,\sigma_2^{\,2})$을 따른다. 임의로 $n$개의 알약을 선택할 경우 $m_2$에 대한 $96\%$ 신뢰구간을 계산하면 다음과 같다. $\mathrm{P}\left(\overline W-2\dfrac{\sigma_1}{\sqrt n}\le m_2\le\overline W+2\dfrac{\sigma_1}{\sqrt n}\right)=0.96$ 여기서, $\overline W$는 선택된 알약 무게의 평균이다.
      source_flow: 모범답안 p.55
      criteria:
      - 2-4.M2
    - id: 24b-3
      content: |
        즉, $b-a=2\times2\times\dfrac{\sigma_1}{\sqrt n}$이고 $\sigma_1=1$이 주어져 있다. 즉, $b-a=2\times2\times\dfrac1{\sqrt n}$이다. $b-a\le0.4$를 만족하는 $n$값의 범위는 $4\times\dfrac1{\sqrt n}\le0.4$이고, 위 식을 정리하면 $n\ge100$이다. 따라서, $b-a\le0.4$를 만족하기 위해 선택해야 하는 알약의 최소 개수는 $100$개다.
      source_flow: 모범답안 p.55
      criteria:
      - 2-4.A1
