- id: 2-2
  stem: |
    제시문 <나>의 제약회사 C에서 만든 알약 중에서 임의로 선택한 알약 $1$개의 무게가 $4.5$ 이하일 확률이 $0.93$이고, $2$ 이하일 확률이 $0.16$일 때, $m_1$과 $\sigma_1$을 구하시오.
    (단, 알약의 무게의 단위는 g이다.) [70점]
  points: 70
  depends_on: []
  answer:
    kind: value
    value: m1=3; s1=1
    equivalents:
    - $m_1=3,\ \sigma_1=1$
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $Y$를 제약회사 C에서 만든 알약 중에서 임의로 선택한 알약의 무게라고 하자. 그러면, $Y$는 평균이 $m_1$이고 표준편차가 $\sigma_1$인 정규분포를 따른다. 또한, 평균과 표준편차를 이용하여 표준정규분포 $Z=\dfrac{Y-m_1}{\sigma_1}$을 정의할 수 있다. 그러면, 문제에서 주어진 무게가 $4.5$ 이하일 확률 $0.93$에 대응하는 수식을 $\mathrm{P}(Y\le4.5)=\mathrm{P}\left(\dfrac{Y-m_1}{\sigma_1}\le\dfrac{4.5-m_1}{\sigma_1}\right)=\mathrm{P}\left(Z\le\dfrac{4.5-m_1}{\sigma_1}\right)=0.93$과 같이 기술할 수 있다. 무게가 $2$ 이하일 확률이 $0.16$에 대응하는 식 $\mathrm{P}(Y\le2)=0.16$도 같은 방법으로 세운다.
      source_flow: 모범답안 p.54
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        표준정규분포의 누적확률값이 $0.5$보다 크기 때문에 $\dfrac{4.5-m_1}{\sigma_1}>0$을 만족해야 한다. $\mathrm{P}\left(Z\le\dfrac{4.5-m_1}{\sigma_1}\right)=\mathrm{P}(Z\le0)+\mathrm{P}\left(0\le Z\le\dfrac{4.5-m_1}{\sigma_1}\right)$이고 $\mathrm{P}(Z\le0)=0.5$이므로 $\mathrm{P}\left(0\le Z\le\dfrac{4.5-m_1}{\sigma_1}\right)=0.43$이다. 제시문 <다>의 확률분포표를 이용하면 $\dfrac{4.5-m_1}{\sigma_1}=1.5\cdots\cdots(1)$이다. 마찬가지로 $\mathrm{P}\left(Z\le\dfrac{2-m_1}{\sigma_1}\right)=0.16$은 누적확률값이 $0.5$보다 작기 때문에 $\dfrac{2-m_1}{\sigma_1}<0$을 만족해야 한다. 또한 확률의 정의에 의하여 $\mathrm{P}\left(Z\le\dfrac{2-m_1}{\sigma_1}\right)=1-\mathrm{P}\left(Z\ge\dfrac{2-m_1}{\sigma_1}\right)=0.5-\mathrm{P}\left(0\le Z\le\dfrac{m_1-2}{\sigma_1}\right)$ 정리하면, $\mathrm{P}\left(0\le Z\le\dfrac{m_1-2}{\sigma_1}\right)=0.34$이고 확률분포표를 이용하면 $\dfrac{m_1-2}{\sigma_1}=1\cdots\cdots(2)$이다.
      source_flow: 모범답안 p.54
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: |
        따라서, 방정식 (1)과 (2)를 만족하는 해 $m_1=3$과 $\sigma_1=1$이 $Y$의 평균과 표준편차이다.
      source_flow: 모범답안 p.54
      criteria:
      - 2-2.A1
