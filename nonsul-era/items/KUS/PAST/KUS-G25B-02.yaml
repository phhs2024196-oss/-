      evidence: 제약회사 D의 약 무게의 분포 $\mathrm{N}(m_2,\sigma_2^{\,2})$를 정확하게 기술하고, 임의로 추출한 약 무게의 표본의 신뢰도 $96\%$의 신뢰구간에 해당하는 식을 세웠다.
