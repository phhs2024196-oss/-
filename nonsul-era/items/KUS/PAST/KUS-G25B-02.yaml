- id: 2-3
  stem: |
    한 명의 보균자가 매일 오전 $9$시에 제시문 <나>의 제약회사 C에서 만든 알약을 임의로 한 알씩 선택하여 복용하려고 한다. $2024$년 $11$월 $23$일 오전 $9$시에 처음 복용한 후 $2024$년 $11$월 $26$일 오후 $11$시까지 비보균자로 전환될 확률을 구하시오.
    (단, 약에 의한 보균자의 $\beta$-바이러스 소멸상태를 복용 후 1시간 뒤 검사하여 확정하며, 비보균자로 전환된 이후로는 약을 복용하지 않는다.) [80점]
  points: 80
  depends_on: []
  answer:
    kind: value
    value: '0.969'
    equivalents:
    - $0.58\times\dfrac{1-(0.42)^4}{1-0.42}=0.969$
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        [2-2]에서 정의한 $Y$로부터, 제약회사에서 알약을 임의로 선택할 때 정상 알약을 선택할 확률은 다음과 같다. $\mathrm{P}(m_1-2\sigma_1\le X\le m_1+2\sigma_1)=\mathrm{P}(-2\le Z\le2)$ 정규분포를 이용하여, 위 식의 값은 $\mathrm{P}(-2\le Z\le2)=0.96$임을 알 수 있다. 즉, 정상무게를 선택하는 사건을 $A$라고 할 때 $\mathrm{P}(A)=0.96$이다.
      source_flow: 모범답안 p.54-55
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: |
        여기서 한명의 보균자가 약을 복용하고 비보균자로 변환되는 사건을 $B$라고 하면, $\mathrm{P}(B)=\mathrm{P}(B\mid A)\mathrm{P}(A)+\mathrm{P}(B\mid A^{C})\mathrm{P}(A^{C})$이다. 제시문 <나>에서, 알약 한 개를 보균자가 복용 시 보균자가 비보균자로 전환될 확률은 $60\%$이므로 $\mathrm{P}(B\mid A)\mathrm{P}(A)=0.6\times0.96$이다. 마찬가지로, $\mathrm{P}(B\mid A^{C})\mathrm{P}(A^{C})=0.1\times0.04$이므로 $\mathrm{P}(B)=0.58$이다. 제약회사에서 임의로 알약을 한 개 선택해서 보균자가 복용 시, 비보균자로 전환될 확률은 $58\%(0.58)$이므로, 복용 첫 날(2024년 11월 23일)에 비보균자로 전환될 확률은 $0.58$이다.
      source_flow: 모범답안 p.54-55
      criteria:
      - 2-3.M2
    - id: 23b-3
      content: |
        마찬가지로, 한 명의 환자가 복용 첫 날에는 약의 효과가 없고, 다음 날(2024년 11월 24일) 비보균자로 전환될 확률은 $0.42\times0.58$이다. 이 과정을 $k-1$일차까지 전환이 되지 않고 $k$일차에 회복될 확률을 $(0.42)^{k-1}\times0.58$로 계산할 수 있다. 따라서, 2024년 11월 26일 저녁까지 비보균자로 전환될 확률은 첫째항이 $0.58$이고, 공비가 $0.42$인 등비수열의 넷째 항까지의 합과 동일하다. 이는 제시문 <라>를 이용하여 다음과 같이 계산할 수 있다. $0.58+0.42\times0.58+(0.42)^2\times0.58+(0.42)^3\times0.58=0.58\times\dfrac{1-(0.42)^4}{1-0.42}=0.969$ 따라서, 2024년 11월 26일 저녁까지 비보균자로 전환될 확률은 $96.9\%(0.969)$이다.
      source_flow: 모범답안 p.54-55
      criteria:
      - 2-3.A1
