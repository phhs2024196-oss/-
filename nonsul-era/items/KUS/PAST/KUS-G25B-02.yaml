stimuli:
- label: 가
  body: |
    $\beta$-바이러스를 체내에 가지고 있는 경우 ‘$\beta$-바이러스 보균자’(이하 보균자)라 하고, 그렇지 않은 경우 ‘$\beta$-바이러스 비보균자’(이하 비보균자)라고 한다. 보균자의 경우는 질환 $\alpha$가 발현될 수 있는 반면, 비보균자의 경우는 질환 $\alpha$가 발현될 수 없다. 보균자는 질환 $\alpha$의 발현 여부와 관계없이 신체접촉을 통해 비보균자를 즉시 감염시킬 수 있다. 질환 $\alpha$가 발현 중인 보균자가 비보균자를 감염시킬 확률이 $25\%$이다. 또한, 질환 $\alpha$가 발현된다면 감염 즉시 발현되어 $\beta$-바이러스가 유지되는 동안 사라지지 않으며 발현될 확률은 $40\%$이다. 발현 여부는 검사를 통해서만 확인할 수 있다. 보균자 체내의 $\beta$-바이러스는 자연적으로 사라지지 않는다.
- label: 나
  body: |
    제약회사 C는 보균자의 체내 $\beta$-바이러스를 없앨 수 있는 알약을 만들고 있다. 만든 알약 한 개의 무게는 평균이 $m_1$, 표준편차가 $\sigma_1$인 정규분포를 따른다고 한다.
    이 제약회사에서 만든 알약 한 개의 무게가 평균과의 차이가 $2\sigma_1$ 이하이면 정상 알약으로 분류한다. 하루에 정상 알약 한 개를 보균자가 복용 시 비보균자로 전환될 확률은 $60\%$, 정상이 아닌 알약을 복용 시 비보균자로 전환될 확률은 $10\%$이다. 단, 보균자는 매일 같은 시간에 한 알만 복용하는 것으로 가정한다. 또한, 당일 복용한 알약의 효과는 $1$시간 이내로 결정된다. 비보균자로 전환된 사람은 다시 보균자로 전환되지 않는다.
- label: 다
  body: |
    확률변수 $Z$가 평균 $0$, 분산 $1$인 정규분포를 따를 때 $Z$는 표준정규분포 $\mathrm{N}(0,1)$을 따른다고 하고, $Z$의 확률분포표는 다음과 같다.

    | $z$ | $\mathrm{P}(0\le Z\le z)$ |
    |---|---|
    | $1.0$ | $0.34$ |
    | $1.5$ | $0.43$ |
    | $2.0$ | $0.48$ |
- label: 라
  body: |
    일부 숫자들의 거듭제곱에 대한 근삿값 정보는 다음과 같다.

    | $n$ | $0.41^n$ | $0.42^n$ | $0.43^n$ | $0.44^n$ |
    |---|---|---|---|---|
    | $2$ | $0.168$ | $0.176$ | $0.185$ | $0.194$ |
    | $3$ | $0.069$ | $0.074$ | $0.080$ | $0.085$ |
    | $4$ | $0.028$ | $0.031$ | $0.034$ | $0.037$ |
    | $5$ | $0.012$ | $0.013$ | $0.015$ | $0.016$ |
stem: |
  2. 다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: 2-1
  stem: |
    질환 $\alpha$가 발현 중인 한 명의 보균자가 하루 동안 $100$명의 비보균자와 접촉하였다. 다음날 $100$명을 대상으로 질환 $\alpha$의 발현 여부를 검사하였을 때, $16$명 이상 질환 $\alpha$가 발현될 확률을 구하시오.
    (단, 검사시점까지 $100$명의 사람끼리는 서로 접촉하지 않는다.) [70점]
  points: 70
  depends_on: []
  answer:
    kind: value
    value: 1/50
    equivalents:
    - '0.02'
    - 2%
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        질환 $\alpha$가 발현 중인 보균자가 한 명의 비보균자를 감염시킬 확률은 $\dfrac{25}{100}$이고, 감염 후 질환 $\alpha$가 발현될 확률은 $\dfrac{40}{100}$이다. 따라서, 질환 $\alpha$가 발현 중인 한 명의 보균자가 한 명의 비보균자와 접촉했을 때 비보균자가 질환 $\alpha$가 발현될 확률은 $\dfrac{25}{100}\times\dfrac{40}{100}=\dfrac1{10}$이다.
      source_flow: 모범답안 p.53
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        전체 비보균자 $100$명 중 질환 $\alpha$가 발현된 사람의 수를 확률 변수 $X$라 하면, $X$는 시행 횟수 $n=100$과 각 시행에서 사건이 일어날 확률 $p=\dfrac1{10}$인 이항분포 $\mathrm{B}\left(100,\dfrac1{10}\right)$를 따른다. 이때 $100$명은 충분히 큰 수이므로, 확률변수 $X$를 근사적으로 평균이 $10$, 표준편차가 $3$인 정규분포 $\mathrm{N}(10,3^2)$를 따른다고 할 수 있다.
      source_flow: 모범답안 p.53
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        즉, 정규분포를 따르는 확률 변수 $X$가 $16$이상의 값을 가질 확률 $\mathrm{P}(X\ge16)$을 계산하는 문제로 기술할 수 있으며, 아래와 같이 $X$의 표준정규화 $Z=\dfrac{X-10}3$와 제시문 <다>의 정규분포표를 사용하여 계산할 수 있다. $\mathrm{P}(X\ge16)=\mathrm{P}\left(Z\ge\dfrac{16-10}3\right)=\mathrm{P}(Z\ge2)=0.5-0.48=0.02$ 따라서, $100$명의 비보균자 중 $16$명 이상 질환 $\alpha$가 발현될 확률은 $2\%$(혹은 $0.02$)이다.
      source_flow: 모범답안 p.53
      criteria:
      - 2-1.A1
      - 2-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 20
      evidence: 비보균자가 보균자와 접촉 후 질환 $\alpha$가 발현될 확률 $\frac{25}{100}\times\frac{40}{100}=\frac1{10}$을 계산하였다.
      steps:
      - 21b-1
    - id: 2-1.M2
      mark_type: M
      points: 20
      evidence: 이항분포 $\mathrm{B}\left(100,\frac1{10}\right)$를 이용한 정규분포의 평균 $10$과 분산 $9$(표준편차 $3$)를 계산하였다.
      depends_on:
      - 2-1.M1
      steps:
      - 21b-2
    - id: 2-1.A1
      mark_type: A
      points: 20
      evidence: 표준정규분포를 이용하여 $\mathrm{P}(X\ge16)=\mathrm{P}(Z\ge2)=0.5-0.48$을 계산하였다.
      depends_on:
      - 2-1.M2
      steps:
      - 21b-3
    - id: 2-1.A2
      mark_type: A
      points: 10
      evidence: 최종 확률 $0.02$(또는 $2\%$)를 답으로 적었다. [원본 채점기준 행 합계 $20+20+20=60$점이 소문항 배점 $70$점과 맞지 않아 둔 보정행(10점, 배분 미공개)]
      depends_on:
      - 2-1.A1
      steps:
      - 21b-3
    note: 원본 채점기준 2-1 행 배점 합계가 60점이고 소문항 배점은 70점 — 차이 10점은 2-1.A2 보정행(추정). 원본 오류 의심으로 보고.
