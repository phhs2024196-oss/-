stimuli:
- label: 가
  body: |
    반지름이 $r$인 원 $C_1$을 밑면으로 하는 원뿔과 원 $C_1$과 평행인 평면 $\alpha$가 만나는 교선을 $C_2$라 한다.
- label: 나
  body: |
    평면 $\alpha$에 수직인 평면 $\beta$와 원뿔이 만나는 교선 $l$은 이차곡선 $C_3$의 일부이다.
- label: 다
  body: |
    평면 $\gamma$와 원뿔이 만나는 교선 $m$은 이차곡선 $C_4$의 일부이다.
- label: 라
  body: |
    정육면체의 밑면 ABCD는 원 $C_1$에 내접하는 정사각형이고, 윗면 EFGH는 원 $C_2$에 외접하는 정사각형이다. 정육면체의 한 옆면 BCGF는 평면 $\beta$ 위에 있고, 선분 AB와 선분 GH는 평면 $\gamma$ 위에 있다.

    [그림 1: 원뿔과 밑면의 원 $C_1$, 평면 $\alpha$ 위의 교선 $C_2$]

    [그림 2: 평면 $\alpha$에 수직인 평면 $\beta$와 원뿔의 교선 $l$, 원 $C_1$]

    [그림 3: 평면 $\gamma$와 원뿔의 교선 $m$, 원 $C_1$]

    [그림 4: 원뿔과 정육면체(밑면 ABCD는 $C_1$에 내접, 윗면 EFGH는 $C_2$에 외접)와 평면 $\gamma$, 꼭짓점 A, B, C, D, E, F, G, H 표시]
stem: |
  3. 다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: 3-1
  stem: |
    원 $C_1$ 위의 점과 원 $C_2$ 위의 점 사이의 거리의 최솟값을 $p$, 최댓값을 $q$라고 할 때, $\dfrac{p^2+q^2}{r^2}$을 구하시오. [100점]
  points: 100
  depends_on: []
  answer:
    kind: value
    value: '7'
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        두 원 사이의 높이가 $\sqrt2\,r$로 일정하므로, 원 $C_2$를 $xy$평면으로 정사영한 도형 위의 점과 원 $C_1$ 위의 점 사이의 거리가 최소, 최대일 때를 찾으면 된다. 이때 거리의 최소가 $\left(1-\dfrac{\sqrt2}2\right)r$, 최대가 $\left(1+\dfrac{\sqrt2}2\right)r$이므로
      source_flow: 모범답안 p.58
      criteria:
      - 3-1.M1
      - 3-1.M2
    - id: 31b-2
      content: |
        $\dfrac{p^2+q^2}{r^2}=\left\{2+\left(1-\dfrac{\sqrt2}2\right)^2\right\}+\left\{2+\left(1+\dfrac{\sqrt2}2\right)^2\right\}=7$.
      source_flow: 모범답안 p.58
      criteria:
      - 3-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 30
      evidence: 같은 평면 위에 정사영 했을 때, 두 원 사이의 최소거리 $\left(1-\frac{\sqrt2}2\right)r$를 구하였다.
      steps:
      - 31b-1
    - id: 3-1.M2
      mark_type: M
      points: 30
      evidence: 같은 평면 위에 정사영 했을 때, 두 원 사이의 최대거리 $\left(1+\frac{\sqrt2}2\right)r$를 구하였다.
      steps:
      - 31b-1
    - id: 3-1.A1
      mark_type: A
      points: 40
      evidence: $\frac{p^2+q^2}{r^2}=7$를 구하였다.
      depends_on:
      - 3-1.M1
      - 3-1.M2
      steps:
      - 31b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    이차곡선 $C_3$의 두 초점 사이의 거리를 $d$라 할 때, $\left(\dfrac dr\right)^2$을 구하시오. [150점]
  points: 150
  depends_on: []
  answer:
    kind: value
    value: 26+16*sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        원 $C_1$의 중심을 원점 $\mathrm{O}$로 하여 네 번째 그림의 도형들을 $yz$평면에 정사영하면, 이차곡선 $C_3$은 주축의 거리가 $2b$인 쌍곡선을 평행이동한 $2b=2(\overline{\mathrm{OJ}}-\overline{\mathrm{OP}})=2(2+\sqrt2)r$인 쌍곡선을 $z$축 방향으로 원뿔의 높이인 $2(1+\sqrt2)r$만큼 평행이동한 곡선이 된다.
      source_flow: 모범답안 p.58-59
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        따라서 곡선 $C_3$의 방정식은 $\left(\dfrac ya\right)^2-\left(\dfrac{z-2(1+\sqrt2)r}{(2+\sqrt2)r}\right)^2=-1$이 된다. $\left(\dfrac{\sqrt2}2r,0\right)$을 지난다는 것을 이용하여 $a=\dfrac{\sqrt2}2r$임을 구할 수 있다.
      source_flow: 모범답안 p.58-59
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        따라서 $d=2\sqrt{a^2+b^2}$이므로, $d^2=4(a^2+b^2)=(26+16\sqrt2)r^2$가 된다.
      source_flow: 모범답안 p.58-59
      criteria:
      - 3-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 50
      evidence: 주축의 거리가 $2b=2(2+\sqrt2)r$임을 구하였다.
      steps:
      - 32b-1
    - id: 3-2.M2
      mark_type: M
      points: 50
      evidence: $a=\frac{\sqrt2}2r$임을 구하였다.
      depends_on:
      - 3-2.M1
      steps:
      - 32b-2
    - id: 3-2.A1
      mark_type: A
      points: 50
      evidence: $\left(\frac dr\right)^2=4\frac{a^2+b^2}{r^2}=(26+16\sqrt2)$임을 구하였다.
      depends_on:
      - 3-2.M1
      - 3-2.M2
      steps:
      - 32b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-3
  stem: |
    이차곡선 $C_4$의 장축의 길이를 $2a$, 단축의 길이를 $2b$라고 할 때, $\left(\dfrac ab\right)^2$을 구하시오. [150점]
  points: 150
  depends_on: []
  answer:
    kind: value
    value: 8*(2*sqrt(2)-1)/7
    equivalents: []
    tolerance: null
  solutions:
  - id: S33-B
    audience: B
    method_no: 1
    steps:
    - id: 33b-1
      content: |
        주어진 도형들을 $yz$평면에 정사영해서 생각해 보자. $2a=\overline{\mathrm{GK}}$이므로 $\overline{\mathrm{KL}}=\sqrt2\left(a-\dfrac r2\right)$이고 $\overline{\mathrm{OL}}=\sqrt2(a-r)$이다. 삼각형의 닮음에 따라 $\overline{\mathrm{KL}}:\overline{\mathrm{JL}}=\overline{\mathrm{FP}}:\overline{\mathrm{JP}}$를 이용하면 $a=\dfrac27(3+\sqrt2)r$.
      source_flow: 모범답안 p.59
      criteria:
      - 3-3.M1
    - id: 33b-2
      content: |
        한편, 주어진 도형들을 $xy$평면에 정사영해서 생각하면, 곡선 $C_4$의 정사영 $C_4'$은 $\left(\dfrac{\sqrt2}2r,0\right)$, $\left(-\dfrac{\sqrt2}2r,\dfrac{\sqrt2}2r\right)$을 지나며 아래 식을 따른다. $\left(\dfrac{x-k}{a'}\right)^2+\left(\dfrac y{b'}\right)^2=1$. $a'$은 $a$의 정사영임을 이용해서 구하면 $a'=\dfrac17(3\sqrt2+2)r$이다. 첫 번째 점을 대입하면, $k=\dfrac{\sqrt2}2r-a'=\dfrac1{14}(\sqrt2-4)r$임을 구할 수 있다. 두 번째 점을 대입하면 $(b')^2=\dfrac{5+4\sqrt2}{14}r^2$임을 구할 수 있다. $b'$은 정사영해도 변함이 없으므로
      source_flow: 모범답안 p.59
      criteria:
      - 3-3.M2
    - id: 33b-3
      content: |
        $\left(\dfrac ab\right)^2=\dfrac{\left\{\dfrac27(3+\sqrt2)r\right\}^2}{\dfrac{5+4\sqrt2}{14}r^2}=\dfrac87(2\sqrt2-1)$.
      source_flow: 모범답안 p.59
      criteria:
      - 3-3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-3.M1
      mark_type: M
      points: 50
      evidence: $a=\frac27(3+\sqrt2)r$임을 구하였다.
      steps:
      - 33b-1
    - id: 3-3.M2
      mark_type: M
      points: 50
      evidence: $b^2=\frac{5+4\sqrt2}{14}r^2$임을 구하였다.
      depends_on:
      - 3-3.M1
      steps:
      - 33b-2
    - id: 3-3.A1
      mark_type: A
      points: 50
      evidence: $\left(\frac ab\right)^2=\frac87(2\sqrt2-1)$임을 구하였다.
      depends_on:
      - 3-3.M1
      - 3-3.M2
      steps:
      - 33b-3
