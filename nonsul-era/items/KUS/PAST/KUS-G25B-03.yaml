key_idea: 정육면체가 원뿔 안에 놓인 구도(높이 √2 r, 윗원 반지름 √2r/2)에서 원뿔의 높이 2(1+√2)r를 구한 뒤, 수직 단면은 쌍곡선, 비스듬한 단면은 타원임을 이용하고 정사영으로 대수적으로 계산한다.
stuck: 원뿔을 수직으로 자른 단면이 쌍곡선(주축의 거리는 꼭짓점 높이에서, 한 꼭짓점은 단면과 밑면의 교점)임을 알아보고 평행이동으로 방정식을 세우는 일과, 비스듬한 단면의 타원을 정사영해 축의 길이를 구하는 일
