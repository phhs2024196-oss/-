stimuli: []
stem: |2

  <그림 1>과 같이 숫자가 적힌 8장의 카드가 있다.

  [그림 1: 0, 1, 2, 3이 적힌 카드가 윗줄에, 4, 5, 6, 7이 적힌 카드가 아랫줄에 놓여 있다]
  [그림 2: 숫자를 한 개씩 적는 빈칸 5개가 가로로 나열되어 있다]

  이 카드 중에서 5장을 순서대로 뽑아 <그림 2>의 빈칸에 왼쪽부터 차례대로 나열하는 시행을 하려 한다.
subparts:
- id: '1'
  stem: |
    이때, 만들어진 숫자가 홀수이고, 25000보다 작을 경우의 수를 구하시오.
    (단, 0, 3, 1, 5, 7의 순서로 뽑게 되었을 때의 숫자는 3157이다.) [160점]
  points: 160
  depends_on: []
  answer:
    kind: value
    value: '1120'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        홀수이려면 일의 자리 숫자가 홀수이므로 1, 3, 5, 7 중 하나이다. 25000보다 작으려면 만의 자리 숫자는 0, 1, 2 중 하나이다. 만의 자리 숫자에 따라 경우를 나눈다.

        CASE 1) 만의 자리에 0을 뽑은 경우: 나머지 네 자리는 어떤 숫자이든 25000보다 작으므로, 1, 2, 3, 4, 5, 6, 7 중 4개를 뽑아 나열할 때 홀수가 되는 경우의 수만 구하면 된다. 일의 자리부터 정하면 일의 자리에 올 수 있는 수는 1, 3, 5, 7 중 하나이므로 $_4C_1=4$이고, 남은 세 자리는 남은 6장 중 3장을 순서대로 뽑으면 되므로 $_6P_3=120$이다. 따라서 $4\times120=480$이다.
      source_flow: 예시 답안(보고서) p.32
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        CASE 2) 만의 자리에 1을 뽑은 경우: 이때도 나머지 네 자리는 어떤 숫자이든 25000보다 작다. 0, 2, 3, 4, 5, 6, 7 중 4개를 뽑아 나열할 때 일의 자리에 올 수 있는 수는 3, 5, 7 중 하나이므로 $_3C_1=3$이고, 남은 세 자리는 $_6P_3=120$이다. 따라서 $3\times120=360$이다.
      source_flow: 예시 답안(보고서) p.32
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        CASE 3) 만의 자리에 2를 뽑은 경우: 25000보다 작으려면 천의 자리 숫자는 0, 1, 3, 4 중 하나이다.
        CASE 3-1) 천의 자리에 0 또는 4가 뽑힌 경우: 0이 천의 자리에 오든 4가 천의 자리에 오든 나머지 세 자리를 채워 홀수를 만드는 경우의 수가 같으므로 한 경우만 구해 2배 한다. 천의 자리가 0이면 1, 3, 4, 5, 6, 7 중 3개를 뽑아 홀수를 만드는데, 일의 자리에 올 수 있는 수는 1, 3, 5, 7 중 하나이므로 $_4C_1=4$이고, 남은 두 자리는 $_5P_2=20$이다. 따라서 $2\times4\times20=160$이다.
      source_flow: 예시 답안(보고서) p.32
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        CASE 3-2) 천의 자리에 1 또는 3이 뽑힌 경우: 한 경우만 구해 2배 한다. 천의 자리가 1이면 0, 3, 4, 5, 6, 7 중 3개를 뽑아 홀수를 만드는데, 일의 자리에 올 수 있는 수는 3, 5, 7 중 하나이므로 $_3C_1=3$이고, 남은 두 자리는 $_5P_2=20$이다. 따라서 $2\times3\times20=120$이다.
      source_flow: 예시 답안(보고서) p.32
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        따라서 25000보다 작은 홀수가 되는 경우의 수는 $480+360+160+120=1120$이다.
      source_flow: 예시 답안(보고서) p.32
      criteria:
      - 1.A1
