stimuli: []
stem: |2

  이차함수 $f(x)$가 다음 조건을 만족시킨다.

  <가> $f(1)=0$
  <나> $\int_0^4\{f(x)\}^2f'(x)dx=0$

  상수 $a$ ($a\neq0$)에 대하여 $g(x)$를
  $$g(x)=\begin{cases}e^x+a&(x>3)\\f(x)&(x\le3)\end{cases}$$
  이라 하자.
subparts:
- id: '1'
  stem: |
    함수 $g(x)$가 실수 전체의 집합에서 미분가능할 때, $f(\ln(a^2))$의 값을 구하시오. [170점]
  points: 170
  depends_on: []
  answer:
    kind: expression
    value: 15*exp(3)/2
    equivalents:
    - \dfrac{15e^3}{2}
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $t=f(x)$라 하면 $x=0$일 때 $t=f(0)$, $x=4$일 때 $t=f(4)$이고 $\dfrac{dt}{dx}=f'(x)$이다. 따라서
        $$0=\int_0^4\{f(x)\}^2f'(x)dx=\int_{f(0)}^{f(4)}t^2dt=\left[\dfrac13t^3\right]_{f(0)}^{f(4)}=\dfrac13\left(f(4)^3-f(0)^3\right)$$
      source_flow: 예시 답안(보고서) p.35
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(4)^3=f(0)^3$이고 $f(4)$, $f(0)$은 실수이므로 $f(4)-f(0)=0$, 즉 $f(4)=f(0)$이다.
      source_flow: 예시 답안(보고서) p.35
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $g(x)$가 $x=3$에서 미분가능하므로 $h(x)=e^x+a$에 대해 $f(3)=h(3)=e^3+a$이고 $f'(3)=h'(3)=e^3$이다.
      source_flow: 예시 답안(보고서) p.35
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $f(4)=f(0)$이므로 이차함수 $f(x)$는 $x=2$에 대하여 대칭이다. 따라서 $f(1)=f(3)$이고 $f(1)=0$이므로 $f(3)=0$이다. 그러므로 $f(x)=k(x-1)(x-3)=k(x^2-4x+3)$ ($k$는 상수)으로 놓을 수 있다.
      source_flow: 예시 답안(보고서) p.35
      criteria:
      - 1.M3
    - id: 1b-5
      content: |
        $f(3)=0$이고 $f(3)=e^3+a$이므로 $0=e^3+a$, 즉 $a=-e^3$이다.
      source_flow: 예시 답안(보고서) p.35
      criteria:
      - 1.A2
    - id: 1b-6
      content: |
        $f'(x)=k(2x-4)$이므로 $f'(3)=2k$이고 $f'(3)=e^3$이므로 $k=\dfrac{e^3}{2}$이다. 따라서 $f(x)=\dfrac{e^3}{2}(x^2-4x+3)$이다.
      source_flow: 예시 답안(보고서) p.35
      criteria:
      - 1.A3
    - id: 1b-7
      content: |
        $a=-e^3$이므로 $a^2=e^6$, $\ln(a^2)=6$이다. 따라서 $f(\ln(a^2))=f(6)=\dfrac{e^3}{2}(36-24+3)=\dfrac{15}{2}e^3$이다.
      source_flow: 예시 답안(보고서) p.35
      criteria:
      - 1.A4
