      evidence: $f(x)=t$로 치환하여 $\int_{f(0)}^{f(4)}t^2dt=\frac13(f(4)^3-f(0)^3)$ 꼴로 정적분을 계산했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: $f(4)-f(0)=0$ (또는 $f(4)=f(0)$)임을 보였다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 30
      evidence: $g$의 $x=3$에서의 미분가능성으로 $f'(3)=e^3$을 보였다.
      steps:
      - 1b-3
    - id: 1.M3
      mark_type: M
      points: 20
      evidence: $x=2$가 대칭축임을 이용해 $f(x)=k(x-1)(x-3)$을 구했다.
      depends_on:
      - 1.A1
      steps:
      - 1b-4
    - id: 1.A2
      mark_type: A
      points: 30
      evidence: $a=-e^3$을 보였다.
      depends_on:
      - 1.M2
      - 1.M3
      steps:
      - 1b-5
    - id: 1.A3
      mark_type: A
      points: 20
      evidence: $k=\frac{e^3}{2}$을 보였다.
      depends_on:
      - 1.M2
      - 1.M3
      steps:
      - 1b-6
    - id: 1.A4
      mark_type: A
      points: 20
      evidence: $f(\ln(a^2))=\frac{15}{2}e^3$을 구했다.
      depends_on:
      - 1.A2
      - 1.A3
      steps:
      - 1b-7
