stimuli: []
stem: |2

  두 상수 $a$ ($a>0$)과 $b$ ($b>1$)에 대하여 함수 $f(x)=\ln(ax+b)$의 그래프가 $x$축, $y$축과 만나는 점을 각각 A, B라 하고, 이 그래프의 점근선과 $x$축이 만나는 점을 H라 하자.
subparts:
- id: '1'
  stem: |
    원점 O에 대하여 $3\overline{OA}=\overline{OH}$, $\overline{OA}=2\overline{OB}$일 때, $e^{\frac1a}$의 값을 구하시오. [160점]
  points: 160
  depends_on: []
  answer:
    kind: value
    value: 81/16
    equivalents:
    - \dfrac{81}{16}
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=0$이면 $0=\ln(ax+b)$이므로 $ax+b=1$이고, 따라서 $x=\dfrac{1-b}{a}$이다. 그러므로 A의 좌표는 $\left(\dfrac{1-b}{a},0\right)$이다.
      source_flow: 예시 답안(보고서) p.39
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x=0$이면 $y=f(0)=\ln b$이므로 B의 좌표는 $(0,\ln b)$이다. 이때 점근선의 방정식은 $x=-\dfrac{b}{a}$이므로 H의 좌표는 $\left(-\dfrac{b}{a},0\right)$이다.
      source_flow: 예시 답안(보고서) p.39
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\overline{OA}=\left|\dfrac{1-b}{a}\right|=\dfrac{b-1}{a}$ ($b>1$, $a>0$)이다.
      source_flow: 예시 답안(보고서) p.39
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $\overline{OH}=\left|-\dfrac{b}{a}\right|=\dfrac{b}{a}$이다.
      source_flow: 예시 답안(보고서) p.39
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        $3\overline{OA}=\overline{OH}$이므로 $3\cdot\dfrac{b-1}{a}=\dfrac{b}{a}$이고, 따라서 $3(b-1)=b$, 즉 $b=\dfrac32$이다.
      source_flow: 예시 답안(보고서) p.39
      criteria:
      - 1.A1
    - id: 1b-6
      content: |
        $\overline{OB}=\ln b=\ln\dfrac32$이고 $\overline{OA}=2\overline{OB}$이므로 $\dfrac{\frac32-1}{a}=2\ln\dfrac32$이다. 따라서 $\dfrac{1}{2a}=2\ln\dfrac32$, 즉 $\dfrac1a=4\ln\dfrac32$이다.
      source_flow: 예시 답안(보고서) p.39
      criteria:
      - 1.A2
    - id: 1b-7
      content: |
        $e^{\frac1a}=e^{4\ln\frac32}=e^{\ln\left(\frac32\right)^4}=\left(\dfrac32\right)^4=\dfrac{81}{16}$이다.
      source_flow: 예시 답안(보고서) p.39
      criteria:
      - 1.A3
