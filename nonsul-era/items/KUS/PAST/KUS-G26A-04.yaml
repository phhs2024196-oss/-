stimuli:
- label: 가
  body: |
    양의 정수 $k$에 대하여 시각 $t$에서 점 P의 위치는 $f(t)=t^3-\dfrac k2t^2+6$이고, 점 Q의 위치는 $g(t)=\dfrac k2t^2+\dfrac k2$이다.
- label: 나
  body: |
    $f(0)-g(0)>0$이고, 두 점 P와 Q는 만나지 않는다.
- label: 다
  body: |
    $t>0$일 때, 점 P와 Q의 속도가 같으면 그 크기는 양의 정수이다.
stem: |2

  수직선 위를 움직이는 두 점 P와 Q가 다음 조건을 만족시킨다. (단, $t\ge0$이다.)
subparts:
- id: '1'
  stem: |
    이 조건을 만족시키는 $k$를 찾고, 두 점 P와 Q 사이의 최소거리를 구하시오. [170점]
  points: 170
  depends_on: []
  answer:
    kind: value
    value: k=3; d=1/2
    equivalents:
    - k=3,\ \text{최소거리 }\dfrac12
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 P의 속도는 $f'(t)=3t^2-kt$이고 점 Q의 속도는 $g'(t)=kt$이다. 두 점의 속도가 같으면 $3t^2-kt=kt$, 즉 $t(3t-2k)=0$이므로 $t=\dfrac23k$ 또는 $t=0$이다. $t>0$이므로 $t=\dfrac23k$이다.
      source_flow: 예시 답안(보고서) p.42
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        제시문 <다>에 의해 $t=\dfrac23k$에서의 속도의 크기 $g'\!\left(\dfrac23k\right)=\dfrac23k^2$이 양의 정수이어야 한다. $k$가 양의 정수이므로 $\dfrac23k^2$이 정수이려면 $k$는 3의 배수이어야 한다.
      source_flow: 예시 답안(보고서) p.42
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        제시문 <나>에 의해 $f(0)-g(0)=6-\dfrac k2>0$이므로 $k<12$이다.
      source_flow: 예시 답안(보고서) p.42
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        두 점 사이의 거리를 $h(t)=f(t)-g(t)=t^3-kt^2+6-\dfrac k2$라 하면 $h'(t)=3t^2-2kt=t(3t-2k)$이다. $0<t<\dfrac23k$에서 $h'(t)<0$, $t>\dfrac23k$에서 $h'(t)>0$이므로 $h\!\left(\dfrac23k\right)$가 $t\ge0$에서의 최솟값이다.
      source_flow: 예시 답안(보고서) p.42
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        두 점이 만나지 않으므로 $h(t)>0$이고, 따라서 $h\!\left(\dfrac23k\right)=-\dfrac{4}{27}k^3+6-\dfrac k2>0$, 즉 $6>\dfrac{4}{27}k^3+\dfrac k2$이다. $k$는 3의 배수이고 $k<12$이므로 $k=3,6,9$ 중 이 부등식을 만족시키는 것은 $k=3$뿐이다.
      source_flow: 예시 답안(보고서) p.42
      criteria:
      - 1.A1
    - id: 1b-6
      content: |
        $k=3$일 때 최소거리는 $h(2)=8-12+6-\dfrac32=\dfrac12$이다.
      source_flow: 예시 답안(보고서) p.42
      criteria:
      - 1.A2
