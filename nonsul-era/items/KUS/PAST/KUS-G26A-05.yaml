stem: |2

  그림과 같이 양수 $a$에 대하여 함수 $f(x)=x^2-2x+a$의 그래프 위의 한 점 P$(t,f(t))$에서 접하고, 기울기가 2인 직선 $L_1$이 있다. 직선 $L_2$는 점 P에서 직선 $L_1$과 수직으로 만난다. 직선 $L_1$이 $y$축과 만나는 점을 A라 하고, 직선 $L_2$가 $x$축, $y$축과 만나는 점을 각각 B, C라 하자. 직선 AB와 직선 CQ가 평행하도록 하는 직선 $L_1$위의 점을 Q라 하자. 두 삼각형 PAB, PCQ의 넓이를 각각 $S_1$, $S_2$라 하고 $\dfrac{S_1}{S_2}=4$일 때,

  [그림 1: 포물선 $y=f(x)$, 점 P에서의 접선 $L_1$(A를 지남), P에서 $L_1$에 수직인 $L_2$(C와 B를 지남), 직선 $L_1$ 위의 점 Q, 곡선·$y$축·선분 BP·선분 AB로 둘러싸인 부분에 빗금]
subparts:
- id: '1'
  stem: |
    곡선 $y=f(x)$와 $y$축, 선분 BP 및 선분 AB로 둘러싸인 부분의 넓이를 구하시오. [170점]
  points: 170
  depends_on: []
  answer:
    kind: value
    value: 38/3
    equivalents:
    - \dfrac{38}{3}
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(t)=2t-2=2$이므로 $t=2$이고 P$(2,f(2))=(2,a)$이다. 점 P에서의 접선 $L_1$은 $y=2(x-2)+a=2x+a-4$이고, 접선에 수직인 직선 $L_2$는 $y=-\dfrac12(x-2)+a$이다.
      source_flow: 예시 답안(보고서) p.45
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $L_1$의 $y$절편으로부터 A$(0,a-4)$, $L_2$의 $x$절편과 $y$절편으로부터 B$(2a+2,0)$, C$(0,a+1)$이다.
      source_flow: 예시 답안(보고서) p.45
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        점 P는 선분 CB 위의 점이고 $x$좌표가 2이므로 $\overline{CP}:\overline{PB}=2:(2a)=1:a$이다. 직선 AB와 직선 CQ가 평행하므로 두 삼각형 PAB와 PQC는 닮음이고 닮음비는 $\overline{PB}:\overline{PC}=a:1$이다. 따라서 $\dfrac{S_1}{S_2}=a^2=4$이고 $a>0$이므로 $a=2$이다.
      source_flow: 예시 답안(보고서) p.45
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $a=2$이므로 $f(x)=x^2-2x+2$, P$(2,2)$, A$(0,-2)$, B$(6,0)$, C$(0,3)$이고 직선 $L_1$은 $y=2x-2$이다.
      source_flow: 예시 답안(보고서) p.45
      criteria:
      - 1.A1
    - id: 1b-5
      content: |
        구하는 넓이 $S$는 곡선 $y=f(x)$와 직선 $L_1$ 및 $y$축으로 둘러싸인 부분의 넓이 $S_3$과 삼각형 PAB의 넓이 $S_4$의 합이다.
        $$S_3=\int_0^2\{(x^2-2x+2)-(2x-2)\}dx=\int_0^2(x^2-4x+4)dx=\left[\dfrac13x^3-2x^2+4x\right]_0^2=\dfrac83$$
        $\overline{PA}=\overline{PB}=\sqrt{20}$이고 $\angle APB=\dfrac{\pi}{2}$이므로 $S_4=\dfrac12\times\sqrt{20}\times\sqrt{20}=10$이다. 따라서 $S=10+\dfrac83=\dfrac{38}{3}$이다.
      source_flow: 예시 답안(보고서) p.45
      criteria:
      - 1.A2
