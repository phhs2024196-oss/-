stimuli: []
stem: |2

  두 함수 $f(x)=e^x$, $g(x)=e^{x-2}$가 있다. 그림과 같이 두 곡선 $y=f(x)$, $y=g(x)$가 직선 $y=t$ ($1\le t\le2$)와 만나는 점을 각각 A, B라 하고, 이 두 점에서 $x$축 위에 내린 수선의 발을 각각 P, Q라 하자. 곡선 $y=g(x)$ 위의 점 C는 점 A와 $x$좌표가 같다. $x$축 위의 점 D에 대하여 $\angle BDC=\dfrac{\pi}{2}$이다.

  [그림 1: 곡선 $y=f(x)$, $y=g(x)$와 직선 $y=t$, 점 A, B, C, D, P, Q의 위치를 나타낸 그림]
subparts:
- id: '1'
  stem: |
    $\overline{PD}\times\overline{QD}$의 최솟값을 구하시오. [170점]
  points: 170
  depends_on: []
  answer:
    kind: expression
    value: exp(-2)
    equivalents:
    - \dfrac{1}{e^2}
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $e^x=t$에서 $x=\ln t$, $e^{x-2}=t$에서 $x=2+\ln t$이므로 A$(\ln t,t)$, B$(2+\ln t,t)$이고, P$(\ln t,0)$, Q$(2+\ln t,0)$이다. 따라서 $\overline{PQ}=2$이다. 또 C는 $x$좌표가 $\ln t$이고 $y=g(\ln t)=e^{\ln t-2}=\dfrac{t}{e^2}$이므로 C$\left(\ln t,\dfrac{t}{e^2}\right)$이다.
      source_flow: 예시 답안(보고서) p.49
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\overline{PD}=x$ ($0<x<2$)라 하면 D$(\ln t+x,0)$이고 $\overline{QD}=2-x$이므로 $\overline{PD}\times\overline{QD}=x(2-x)$이다.
      source_flow: 예시 답안(보고서) p.49
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\angle BDC=\dfrac{\pi}{2}$이므로 직선 CD와 직선 BD는 서로 수직이고 두 직선의 기울기의 곱은 $-1$이다. 직선 CD의 기울기는 $-\dfrac{t}{e^2x}$, 직선 BD의 기울기는 $\dfrac{t}{2-x}$이므로
        $$-\dfrac{t}{e^2x}\times\dfrac{t}{2-x}=-1\ \Rightarrow\ x(2-x)=\dfrac{t^2}{e^2}$$
        이다. 따라서 $\overline{PD}\times\overline{QD}=\dfrac{t^2}{e^2}$이다.
      source_flow: 예시 답안(보고서) p.49
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $y=\dfrac{t^2}{e^2}$은 $t\ge0$에서 증가하므로 $1\le t\le2$에서 $t=1$일 때 최솟값 $\dfrac{1}{e^2}$을 갖는다.
      source_flow: 예시 답안(보고서) p.49
      criteria:
      - 1.A2
