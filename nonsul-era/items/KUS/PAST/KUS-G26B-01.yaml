- id: 1-2
  stem: |
    $\overrightarrow{OO'}\cdot\overrightarrow{BA}$가 최대일 때, 선분 AB의 길이를 구하시오. [80점]
  points: 80
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        선분 OO′의 중점을 점 H라 하면 $\overrightarrow{BA}=\overrightarrow{BH}+\overrightarrow{HA}$이다.
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $\overrightarrow{OO'}\cdot\overrightarrow{BA}=\overrightarrow{OO'}\cdot(\overrightarrow{BH}+\overrightarrow{HA})=\overrightarrow{OO'}\cdot\overrightarrow{BH}+\overrightarrow{OO'}\cdot\overrightarrow{HA}=2\overrightarrow{HO'}\cdot(-\overrightarrow{HB})+\overrightarrow{OO'}\cdot\overrightarrow{HA}=-2(\overrightarrow{HO'}\cdot\overrightarrow{HB})+\overrightarrow{OO'}\cdot\overrightarrow{HA}$이다.
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        $\overrightarrow{HB}+\overrightarrow{BO'}=\overrightarrow{HO'}$이므로
        $$\overrightarrow{HO'}\cdot\overrightarrow{HB}=\overrightarrow{HO'}\cdot(\overrightarrow{HO'}-\overrightarrow{BO'})=\left(\dfrac32\right)^2-\overrightarrow{O'H}\cdot\overrightarrow{O'B}$$
        이다. 점 B가 원 $C'$ 위에 있으므로 $-2(\overrightarrow{HO'}\cdot\overrightarrow{HB})$는 점 B가 점 O일 때 최댓값을 갖는다.
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-2.M3
    - id: 12b-4
      content: |
        $\overrightarrow{OA}=\overrightarrow{OH}+\overrightarrow{HA}$이며 $|\overrightarrow{OO'}|=3$, $|\overrightarrow{OA}|\le3$, $|\overrightarrow{OH}|=\dfrac32$이므로
        $$\overrightarrow{OO'}\cdot\overrightarrow{HA}=\overrightarrow{OO'}\cdot(\overrightarrow{OA}-\overrightarrow{OH})=\overrightarrow{OO'}\cdot\overrightarrow{OA}-\overrightarrow{OO'}\cdot\overrightarrow{OH}=|\overrightarrow{OO'}||\overrightarrow{OA}|\cos\theta-3\times\dfrac32$$
        이다. ($\theta$는 $\overrightarrow{OO'}$와 $\overrightarrow{OA}$의 사잇각) 따라서 $\theta=0$ (점 A가 점 O′와 같을 때)일 때 $\overrightarrow{OO'}\cdot\overrightarrow{HA}$의 최댓값을 갖는다.
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-2.M4
    - id: 12b-5
      content: |
        그러므로 점 A는 점 O′, 점 B는 점 O일 때 $\overrightarrow{OO'}\cdot\overrightarrow{BA}$가 최대가 되며 이때 $\overline{AB}=3$이다.
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-2.A1
