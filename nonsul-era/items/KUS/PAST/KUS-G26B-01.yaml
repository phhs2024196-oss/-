      evidence: $-2(\overrightarrow{HO'}\cdot\overrightarrow{HB})$가 최댓값이 되는 점 B의 위치(점 O)를 구했다.
      depends_on:
      - 1-2.M2
      steps:
      - 12b-3
    - id: 1-2.M4
      mark_type: M
      points: 20
      evidence: $\overrightarrow{OO'}\cdot\overrightarrow{HA}$가 최댓값이 되는 점 A의 위치(점 O′)를 구했다.
      depends_on:
      - 1-2.M2
      steps:
      - 12b-4
    - id: 1-2.A1
      mark_type: A
      points: 10
      evidence: $\overline{AB}=3$을 구했다.
      depends_on:
      - 1-2.M3
      - 1-2.M4
      steps:
      - 12b-5
