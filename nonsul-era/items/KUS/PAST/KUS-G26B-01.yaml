- id: 1-3
  stem: |
    직선 YO가 원 $C$와 만나는 점을 Q라 하자. $\overline{PY}=2\sqrt{13}$일 때, 삼각형 YQP가 직각삼각형임을 보이시오. (단, 두 점 Y, Q는 서로 다른 점이다.) [80점]
  points: 80
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        점 P에서 원 $C$에 그은 접선의 접점 중 직선 OO′를 기준으로 점 Y와 다른 영역에 있는 점을 F라 하자. 삼각형 OFP는 직각삼각형이고 $\overline{PO}=5$, $\overline{OF}=3$이므로 $\overline{PF}=4$이다.
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        직선 OF가 원 $C$와 만나는 점 중 F가 아닌 점을 G라 하면 $\overline{FG}=6$이고 FG는 지름이므로 삼각형 GFP는 직각삼각형이다. $\overline{PF}=4$, $\overline{FG}=6$이므로 $\overline{PG}=\sqrt{4^2+6^2}=2\sqrt{13}$이다.
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-3.M2
    - id: 13b-3
      content: |
        직선 OO′를 기준으로 점 G와 같은 영역에 있는 원 $C$ 위의 점 중 점 P와의 거리가 $2\sqrt{13}$인 점은 유일하다. 점 G는 점 F의 지름 반대쪽 끝점이므로 점 Y와 같은 영역에 있고 $\overline{PG}=2\sqrt{13}=\overline{PY}$이므로 점 G와 점 Y는 같은 점이다.
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-3.R1
    - id: 13b-4
      content: |
        점 G와 점 Y가 같은 점이므로 직선 YO가 원 $C$와 만나는 다른 점 Q는 점 F이다. 따라서 $\overline{PQ}=\overline{PF}$는 원 $C$의 접선이고 YQ는 지름이므로 $\angle YQP=\dfrac{\pi}{2}$, 즉 삼각형 YQP는 직각삼각형이다. ■
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-3.R2
