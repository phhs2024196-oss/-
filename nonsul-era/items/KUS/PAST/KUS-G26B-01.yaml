- id: 1-4
  stem: |
    $\overline{PY}=2\sqrt{13}$이고 $\sin\angle OPX'=\dfrac{\sqrt{10}}{10}$일 때, 모든 $\overrightarrow{XY}\cdot\overrightarrow{X'Y'}$를 구하시오. [100점]
  points: 100
  depends_on:
  - 1-3
  answer:
    kind: value
    value: i=162*sqrt(26)/65; ii=1026*sqrt(26)/325
    equivalents:
    - \dfrac{162\sqrt{26}}{65},\ \dfrac{1026\sqrt{26}}{325}
    tolerance: null
  solutions:
  - id: S14-B
    audience: B
    method_no: 1
    steps:
    - id: 14b-1
      content: |
        문제 [1-3]의 결과에 의해 $\overline{PQ}=4$이며 직선 PQ는 원 $C$에 접한다. $\overline{PQ}^2=\overline{PX}\times\overline{PY}$에 의해 $\overline{PX}=\dfrac{8}{\sqrt{13}}$이므로 $\overline{XY}=\overline{PY}-\overline{PX}=\dfrac{18\sqrt{13}}{13}$이다.
      source_flow: 예시 답안(보고서) p.55, p.56
      criteria:
      - 1-4.B1
    - id: 14b-2
      content: |
        점 O′에서 선분 X′Y′에 내린 수선의 발을 점 R이라 하면 삼각형 O′RP는 직각삼각형이며 $\sin\angle OPX'=\sin\angle O'PR=\dfrac{\sqrt{10}}{10}$이므로 $\overline{O'R}=\dfrac{8}{\sqrt{10}}$이다. 따라서 $\overline{X'Y'}=2\sqrt{3^2-\dfrac{64}{10}}=\dfrac25\sqrt{65}$이다.
      source_flow: 예시 답안(보고서) p.55, p.56
      criteria:
      - 1-4.B2
    - id: 14b-3
      content: |
        직선 OO′를 기준으로 위, 아래 두 영역이 구분될 때, 같은 영역에 $\overrightarrow{XY}$와 $\overrightarrow{X'Y'}$가 같이 있는 경우와 각 영역에 한 벡터씩 각각 있는 경우는 두 벡터의 사잇각이 다르다.

        (i) $\overrightarrow{XY}$와 $\overrightarrow{X'Y'}$가 위, 아래 영역에 각각 있는 경우: $\alpha=\angle O'PY'$, $\beta=\angle YPQ$, $\gamma=\angle O'PQ$, $\delta=\angle YPO'$이라 하면 $\tan\alpha=\dfrac13$, $\tan\beta=\dfrac32$, $\tan\gamma=\dfrac34$이므로
        $$\tan\delta=\tan(\beta-\gamma)=\dfrac{\frac32-\frac34}{1+\frac32\times\frac34}=\dfrac{6}{17},\qquad\tan\angle YPY'=\tan(\delta+\alpha)=\dfrac{\frac{6}{17}+\frac13}{1-\frac{6}{17}\times\frac13}=\dfrac79$$
