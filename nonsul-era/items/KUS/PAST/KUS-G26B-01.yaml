stimuli:
- label: 가
  body: |
    원의 중심이 각각 O, O′이고, 반지름의 길이가 3인 두 원 $C$, $C'$가 있다. 그림과 같이 점 O는 원 $C'$ 위에 있고, 점 O′는 원 $C$ 위에 있다. 점 A는 두 원 $C$, $C'$의 내부가 겹쳐진 부분의 경계 위에 있고, 점 B는 원 $C'$ 위에 있다. 두 점 A, B는 서로 다른 점이다.
- label: 나
  body: |
    두 원 $C$, $C'$ 외부의 한 점 P는 직선 OO′ 위에 있고, $\overline{PO}=5$이다. 점 P를 지나는 한 직선은 원 $C$와 두 점 X, Y에서 만나고, 점 P를 지나는 다른 한 직선은 원 $C'$와 두 점 X′, Y′에서 만난다. (단, $\overline{PX}<\overline{PY}$, $\overline{PX'}<\overline{PY'}$, 두 점 B, Y′는 서로 다른 점이다.)

    [그림 1: 점 O를 중심으로 하는 원 $C$와 점 O′를 중심으로 하는 원 $C'$가 겹쳐 있고, 왼쪽 점 P에서 그은 두 직선이 각각 원 $C$와 X, Y에서, 원 $C'$와 X′, Y′에서 만나며 점 A, B가 원 $C'$ 위에 표시되어 있다]
stem: |
  다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: 1-1
  stem: |
    $|\overrightarrow{PA}|\le7$, $|\overrightarrow{PB}|\ge\sqrt{73}$, $|\overrightarrow{PY'}|\ge\sqrt{73}$이고 $\angle BAY'$의 크기가 최대일 때, 삼각형 BAY′의 넓이의 최댓값을 구하시오. [80점]
  points: 80
  depends_on: []
  answer:
    kind: value
    value: '9'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        두 원의 교점을 C, D라 하고 선분 OO′의 중점을 H라 하자. 삼각형 CPH는 직각삼각형이며 $\overline{CH}=\dfrac{3\sqrt3}{2}$, $\overline{PH}=\dfrac{13}{2}$이므로 $\overline{PC}=7$이다. 따라서 $|\overrightarrow{PA}|\le7$을 만족시키는 점 A는 원 $C'$ 위에 있다.
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        원 $C'$의 중심 O′를 지나고 선분 OO′에 수직인 지름의 양 끝점을 I, J라 하자. 삼각형 IPO′는 직각삼각형이며 $\overline{IO'}=3$, $\overline{PO'}=8$이므로 $\overline{PI}=\sqrt{73}$이다. 따라서 $|\overrightarrow{PB}|\ge\sqrt{73}$, $|\overrightarrow{PY'}|\ge\sqrt{73}$이므로 두 점 B, Y′는 호 IJ(원의 중심 O를 지나지 않는 호) 위에 있다.
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        $\angle BAY'$는 원 $C'$의 원주각이므로 $\angle BAY'=\dfrac{\pi}{2}$일 때 최대이다. 즉, 선분 BY′는 지름이며 $\overline{BY'}=6$이다.
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-1.M3
    - id: 11b-4
      content: |
        선분 AO′와 선분 BY′가 수직일 때 삼각형 BAY′의 넓이가 최대이다. 그러므로 삼각형 BAY′의 넓이의 최댓값은 $\dfrac12\times6\times3=9$이다.
      source_flow: 예시 답안(보고서) p.54
      criteria:
      - 1-1.A1
