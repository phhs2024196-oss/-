- id: 2-3
  stem: |
    문제 [2-2]에서 구한 함수 $v(x)$와 $\beta$에 대하여 곡선 $y=\ln\left|\dfrac{v(x)}{x-\beta}\right|$와 $x$축 및 두 직선 $x=\beta+1$, $x=2u(\beta+1)$로 둘러싸인 부분을 밑면으로 하고, $x$축에 수직인 평면으로 자른 단면이 정사각형인 입체도형의 부피를 구하시오. [80점]
  points: 80
  depends_on:
  - 2-2
  answer:
    kind: value
    value: 242/5
    equivalents:
    - \dfrac{242}{5}
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        $\beta=-1$이므로 곡선 $y=\ln\left|\dfrac{v(x)}{x-\beta}\right|=\ln\left|-\dfrac{(x+1)e^{(x+1)^2}}{x+1}\right|=(x+1)^2$ (단, $x\neq-1$)와 $x$축 및 두 직선 $x=\beta+1=0$, $x=2u(\beta+1)=2u(0)=2$로 둘러싸인 부분이 밑면이다.
      source_flow: 예시 답안(보고서) p.62
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: |
        $x$축에 수직인 평면으로 자른 단면이 정사각형이므로 한 변의 길이는 $(t+1)^2$이고 단면의 넓이는 $S(t)=(t+1)^4$이다.
      source_flow: 예시 답안(보고서) p.62
      criteria:
      - 2-3.M2
    - id: 23b-3
      content: |
        따라서 입체도형의 부피는 $\displaystyle\int_0^2(t+1)^4dt=\dfrac{242}{5}$이다.
      source_flow: 예시 답안(보고서) p.62
      criteria:
      - 2-3.A1
