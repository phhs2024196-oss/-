stimuli:
- label: 가
  body: |
    실수 전체의 집합에서 미분가능한 함수 $f(x)$와 삼차함수 $g(x)$가 모든 실수 $x$에 대하여 다음을 만족시킨다.

    • $f(g(x))=(x^2+2)e^x$

    • $\dfrac{x(f'(g(x))-e^x)}{f(g(x))}\le0$
- label: 나
  body: |
    최고차항의 계수가 $k$ ($k>0$)이고 $x=\beta$에서 최솟값을 갖는 이차함수 $u(x)$와 함수 $v(x)=(ax+b)e^{u(x)}$ ($a<0$)이 다음을 만족시킨다.

    • 모든 실수 $x$에 대하여 $m(x-\beta)^2-v(x)(x-\beta)\ge0$을 만족시키는 실수 $m$의 최솟값은 $-1$이다. (단, $\beta<0$이다.)

    • $\displaystyle\int_0^2v(x)dx=\int_{-2u(\beta+1)}^2v(x)dx=\dfrac{e^{\beta^2}-e^{(\beta-2)^2}}{2k}$ (단, $u(\beta+1)\neq0$이다.)
stem: |
  다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: 2-1
  stem: |
    모든 실수 $x$에 대하여 항상 $x(x^2+2x+2-g'(x))\ge0$이거나, 모든 실수 $x$에 대하여 항상 $x(x^2+2x+2-g'(x))\le0$임을 보이시오. [80점]
  points: 80
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $f(g(x))=(x^2+2)e^x$를 미분하면 $f'(g(x))g'(x)=2xe^x+(x^2+2)e^x=(x^2+2x+2)e^x$이다.
      source_flow: 예시 답안(보고서) p.60
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $x^2+2x+2=(x+1)^2+1>0$이므로 모든 실수 $x$에 대하여 $(x^2+2x+2)e^x>0$이고, 따라서 $g'(x)\neq0$이다. $g'(x)$는 연속이므로 $g'(x)$의 부호는 일정하다.
      source_flow: 예시 답안(보고서) p.60
      criteria:
      - 2-1.R1
    - id: 21b-3
      content: |
        $\dfrac{f'(g(x))g'(x)}{f(g(x))}=\dfrac{(x^2+2x+2)e^x}{(x^2+2)e^x}=\dfrac{x^2+2x+2}{x^2+2}$이므로 $\dfrac{f'(g(x))}{f(g(x))}=\dfrac{x^2+2x+2}{(x^2+2)g'(x)}$이다. 한편 $\dfrac{e^x}{f(g(x))}=\dfrac{1}{x^2+2}$이므로
        $$\dfrac{f'(g(x))-e^x}{f(g(x))}=\dfrac{x^2+2x+2}{(x^2+2)g'(x)}-\dfrac{1}{x^2+2}=\dfrac{1}{x^2+2}\left(\dfrac{x^2+2x+2}{g'(x)}-1\right)$$
        이다. 따라서 모든 실수 $x$에 대하여
        $$\dfrac{x(x^2+2x+2-g'(x))}{(x^2+2)g'(x)}=\dfrac{x(f'(g(x))-e^x)}{f(g(x))}\le0$$
        이다. $g'(x)>0$이면 모든 실수 $x$에 대하여 $x(x^2+2x+2-g'(x))\le0$이다.
      source_flow: 예시 답안(보고서) p.60
      criteria:
      - 2-1.R2
    - id: 21b-4
      content: |
        $g'(x)<0$이면 같은 부등식에서 모든 실수 $x$에 대하여 $x(x^2+2x+2-g'(x))\ge0$이다. $g'(x)$의 부호는 일정하므로 위의 두 경우 중 하나가 성립한다. (참고: $g'(x)<0$이면 모든 실수 $x$에 대하여 $x^2+2x+2-g'(x)>0$이므로 $x<0$에서 $x(x^2+2x+2-g'(x))<0$이 되어 이 명제는 제시문 <가>의 조건에 맞지 않는다.) ■
      source_flow: 예시 답안(보고서) p.60
      criteria:
      - 2-1.R3
