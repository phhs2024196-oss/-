  misconceptions: []
- id: 2-2
  stem: |
    $u(0)=1$일 때, 제시문 <나>의 조건을 만족시키는 함수 $v(x)$를 구하시오. [100점]
  points: 100
  depends_on: []
  answer:
    kind: expression
    value: -(x+1)*exp(x**2+2*x+1)
    equivalents:
    - v(x)=-(x+1)e^{x^2+2x+1}
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        이차함수 $u(x)$가 $x=\beta$에서 최솟값을 가지므로 $x=\beta$에 대해 대칭이고, $u(0)=1$이므로 $u(x)=kx^2-2\beta kx+1$로 둘 수 있다. 조건 $m(x-\beta)^2-v(x)(x-\beta)\ge0$을 정리하면 $(x-\beta)\{v(x)-m(x-\beta)\}\le0$이므로
        $$\begin{cases}v(x)\le m(x-\beta)&(x\ge\beta)\\v(x)\ge m(x-\beta)&(x<\beta)\end{cases}\cdots(*)$$
        임을 알 수 있다. $v(x)$는 연속함수이므로 $v(\beta)=0$이어서 $v(\beta)=(a\beta+b)e^{u(\beta)}=0$, 즉 $b=-a\beta$이다. 따라서 $v(x)=a(x-\beta)e^{u(x)}$이다. 이를 미분하면 $v'(x)=a(1+2k(x-\beta)^2)e^{kx^2-2\beta kx+1}$은 $k>0$, $a<0$이므로 항상 $v'(x)<0$이다. 또 $v''(x)=2ak(x-\beta)(2k(x-\beta)^2+3)e^{kx^2-2\beta kx+1}$는 $v''(\beta)=0$이고 $x=\beta$에서 부호가 양수에서 음수로 바뀌므로 $x=\beta$에서 변곡점이 된다.
        이때 $(*)$에 의해 $x=\beta$에서 직선 $y=m(x-\beta)$의 기울기가 $v(x)$의 접선의 기울기보다 크거나 같다는 것을 알 수 있다. $v'(\beta)$는 직선 $y=m(x-\beta)$의 기울기 $m$ 중의 하나이고, $m\ge v'(\beta)$로 나타낼 수 있다. $m$의 최솟값이 $-1$이므로 $v'(\beta)=ae^{-k\beta^2+1}=-1$이 된다. 따라서 $a=-e^{k\beta^2-1}$이다.
      source_flow: 예시 답안(보고서) p.61
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        조건을 치환적분하여 계산하면
        $$\int_0^2v(x)dx=\int_0^2a(x-\beta)e^{kx^2-2\beta kx+1}dx=\dfrac{a}{2k}\left[e^{kx^2-2\beta kx+1}\right]_0^2=\dfrac{a}{2k}\left(e^{4k-4\beta k+1}-e\right)=\dfrac{-e^{k(\beta-2)^2}+e^{k\beta^2}}{2k}$$
        이고, 이는 $\dfrac{e^{\beta^2}-e^{(\beta-2)^2}}{2k}$와 같으므로 $k=1$을 구할 수 있다.
      source_flow: 예시 답안(보고서) p.61
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: |
        $\int_0^2v(x)dx=\int_{-2u(\beta+1)}^2v(x)dx$에서
        $$\int_0^2v(x)dx-\int_{-2u(\beta+1)}^2v(x)dx=\int_0^{-2u(\beta+1)}v(x)dx=0$$
        이 된다. 치환적분하면
        $$\int_{-2u(\beta+1)}^0-e^{\beta^2-1}(x-\beta)e^{x^2-2\beta x+1}dx=-\dfrac{e^{\beta^2-1}}{2}\left[e^{x^2-2\beta x+1}\right]_{-2u(\beta+1)}^0$$
        이고, $-\dfrac12e^{\beta^2}\left(1-e^{4(u(\beta+1))^2+4\beta u(\beta+1)}\right)=0$이 되므로 $e^{4(u(\beta+1))^2+4\beta u(\beta+1)}=1$이다. 이는 $0=(u(\beta+1))^2+\beta u(\beta+1)=u(\beta+1)(u(\beta+1)+\beta)$이므로 $u(\beta+1)=-\beta$이다. ($\because u(\beta+1)\neq0$)
      source_flow: 예시 답안(보고서) p.61
      criteria:
      - 2-2.M3
    - id: 22b-4
      content: |
        $u(\beta+1)=(\beta+1)^2-2\beta(\beta+1)+1=-\beta^2+2=-\beta$이고, $\beta^2-\beta-2=0$이므로 $\beta=-1$ ($\because\beta<0$)이다. 따라서 $a=-e^{\beta^2-1}=-1$이고 $b=-a\beta=-1$이고, 함수 $u(x)=x^2+2x+1$과 $v(x)=-(x+1)e^{x^2+2x+1}$이 된다.
      source_flow: 예시 답안(보고서) p.61
      criteria:
      - 2-2.A1
