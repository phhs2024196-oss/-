- id: 3-2
  stem: |
    제시문 <나>의 실험에서 $\alpha=5$이고 $\beta=100$일 때, 함수 $f(t)$를 따르는 환자의 $\displaystyle\lim_{n\to\infty}a_n$과 $\displaystyle\lim_{n\to\infty}b_n$을 구하시오. (단, $e^{-\sqrt{2.2}}$은 0.23으로 계산하고, $\displaystyle\lim_{n\to\infty}a_n$과 $\displaystyle\lim_{n\to\infty}b_n$은 소수점 둘째 자리에서 반올림하시오.) [80점]
  points: 80
  depends_on: []
  answer:
    kind: value
    value: a=70.1; b=16.1
    equivalents:
    - \lim a_n\approx70.1,\ \lim b_n\approx16.1
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        한 주기에서 A의 혈중 농도가 최대가 되는 시기는 약을 복용한 후 2시간이 지났을 때이다. 그리고 한 주기에서 A의 혈중 농도가 최소가 되는 시기는 약을 복용한 직후이다. 첫 번째 약을 복용하기 직전의 치료 성분의 체내 농도가 5ppm이었으므로 $\alpha=5$이다. $\beta=100$이므로 첫 번째 주기에서의 치료 성분의 최대 농도 $a_1$과 최소 농도 $b_1$은 $b_1=5$, $a_1=5+54=59$이다. 두 번째 주기에서의 최대 농도 $a_2$와 최소 농도 $b_2$는 $b_2=59e^{-\sqrt{2.2}}=59\times0.23$, $a_2=59\times0.23+54$이다. 세 번째 주기에서는 $b_3=(59\times0.23+54)\times0.23=59\times(0.23)^2+54\times0.23$, $a_3=59\times(0.23)^2+54\times0.23+54$이다. 이를 반복적으로 적용하면
        $$b_n=59\times(0.23)^{n-1}+54\times(0.23)^{n-2}+\cdots+54\times(0.23)$$
        이다.
      source_flow: 예시 답안(보고서) p.66, p.67
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        같은 방법으로
        $$a_n=59\times(0.23)^{n-1}+54\times(0.23)^{n-2}+\cdots+54$$
        이다. 따라서 $a_n=b_n+54$이다.
      source_flow: 예시 답안(보고서) p.66, p.67
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        $$\lim_{n\to\infty}b_n=\lim_{n\to\infty}\left[59\times(0.23)^{n-1}+\left\{54\times0.23+54\times(0.23)^2+\cdots+54\times(0.23)^{n-2}\right\}\right]=\dfrac{54\times0.23}{1-0.23}=\dfrac{12.42}{0.77}=\dfrac{1242}{77}\approx16.1$$
      source_flow: 예시 답안(보고서) p.66, p.67
      criteria:
      - 3-2.A1
    - id: 32b-4
      content: |
        $$\lim_{n\to\infty}a_n=54+\lim_{n\to\infty}b_n=54+16.1=70.1$$
      source_flow: 예시 답안(보고서) p.66, p.67
      criteria:
      - 3-2.A2
