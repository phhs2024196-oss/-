stimuli:
- label: 가
  body: |
    한 회사에서 출시한 스마트워치는 $\Omega$ 질환 치료제의 치료 성분인 A의 혈중 농도를 채혈하지 않고 측정할 수 있다.
- label: 나
  body: |
    한 제약회사에서 $\Omega$ 질환 치료제 $\mathcal{H}$를 만들었다. 치료제 $\mathcal{H}$ 한 알에 포함된 치료 성분 A의 양은 $\beta$이다. $\Omega$ 질환을 갖고 있는 환자 100명을 모집하여 임상실험을 실시하였다. 약은 24시간마다 주기적으로 한 알씩 복용하였고, 실시간으로 A의 혈중 농도를 측정하여 평균값을 구하였다. 이를 이용하여 시각 $t$에서 A의 혈중 농도를 나타내는 함수 $f(t)$를 구하였다. 복용 직전 A의 혈중 농도 $\alpha$에 대하여 함수 $f(t)$는 다음과 같다.

    $$f(t)=\begin{cases}\alpha+0.27\beta t&(0\le t\le2)\\(\alpha+0.54\beta)e^{-\sqrt{\frac{t-2}{10}}}&(2<t\le24)\end{cases}$$

    $n$번째 복용 주기에서 함수 $f(t)$의 최댓값을 $a_n$, 최솟값을 $b_n$이라 한다. A의 혈중 농도가 10 ppm과 100 ppm 사이일 때 치료 효과가 있고, 100 ppm 이상이 되면 부작용이 발생할 가능성이 있다. (단, 매일 약을 복용하는 시각은 $t=0$이다.)
stem: |
  다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: 3-1
  stem: |
    제시문 <나>의 실험에서 $\alpha=0$이고 $\beta=125$일 때, 함수 $f(t)$를 따르는 환자가 3번째 약을 복용하기 직전 A의 혈중 농도를 구하시오. (단, $e^{-\sqrt{2.2}}$은 0.23으로 계산하고, 소수점 둘째 자리에서 반올림하시오.) [60점]
  points: 60
  depends_on: []
  answer:
    kind: value
    value: '19.1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        첫 번째 약을 복용하기 직전 A의 혈중 농도는 0이고, 이는 첫 번째 주기에서의 최소 농도 $b_1$과 같다. 두 번째 약을 복용하기 직전 A의 혈중 농도는 $\alpha=0$일 때의 $f(24)$의 값과 같으므로
        $$b_2=f(24)=0.54\times125\times e^{-\sqrt{2.2}}=0.54\times125\times0.23$$
        이다.
      source_flow: 예시 답안(보고서) p.66
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        마찬가지로 세 번째 약을 복용하기 직전 A의 혈중 농도는 세 번째 주기에서의 최소 농도 $b_3$이다. 따라서 $\alpha=b_2$일 때의 $f(24)$의 값과 같으므로
        $$b_3=0.54\times125\times0.23+0.54\times125\times0.23^2=\dfrac{76383}{4000}\approx19.1$$
        이다.
      source_flow: 예시 답안(보고서) p.66
      criteria:
      - 3-1.A1
