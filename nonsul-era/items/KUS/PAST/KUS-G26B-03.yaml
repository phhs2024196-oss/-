intent: '[3-1] 구간별로 정의된 함수의 최댓값과 최솟값을 구할 수 있는지 평가한다. [3-2] 주어진 값들을 등비수열의 합의 형태로 표현할 수 있고, 이를 활용해 극한을 계산할 수 있는지를 평가한다. [3-3] 제시문에 주어진 대로 약을 복용한 경우 부작용이 발생할 가능성이 없는 약의 치료 성분의 최대 함량을 구하는 문제로 최대 혈중 농도의 극한값을 활용하여 부등식을 만족하는 최대 정수를 찾을 수 있는지를 평가한다. [3-4] 주어진 조건을 만족하기 위해서는 주어진 정규분포를 표준정규분포로 대응시켜 표준편차의 최댓값을 구할 수 있는지를 평가한다.'
