- id: 3-3
  stem: |
    제시문 <나>의 실험에서 $\alpha=0$일 때, 함수 $f(t)$를 따르는 환자에게서 부작용이 발생할 가능성을 없게 하려 한다. 이때, $\beta$가 될 수 있는 가장 큰 정수를 구하시오. [90점]
  points: 90
  depends_on: []
  answer:
    kind: value
    value: '142'
    equivalents: []
    tolerance: null
  solutions:
  - id: S33-B
    audience: B
    method_no: 1
    steps:
    - id: 33b-1
      content: |
        치료 성분의 함량이 $\beta$인 약을 복용한 경우 $n$번째 주기에서의 최대 농도를 $a_n$이라 하자. $\alpha=0$일 때이므로
        $$a_n=\dfrac{54\beta}{100}+\dfrac{54\beta}{100}\times0.23+\dfrac{54\beta}{100}\times(0.23)^2+\cdots+\dfrac{54\beta}{100}\times(0.23)^{n-1}$$
        이다.
      source_flow: 예시 답안(보고서) p.67
      criteria:
      - 3-3.M1
    - id: 33b-2
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}a_n=\dfrac{0.54\beta}{0.77}=\dfrac{54\beta}{77}<100$이어야 하므로 $\beta<\dfrac{7700}{54}\approx142.6$이다.
      source_flow: 예시 답안(보고서) p.67
      criteria:
      - 3-3.M2
    - id: 33b-3
      content: |
        따라서 최대 정수인 $\beta=142$이다.
      source_flow: 예시 답안(보고서) p.67
      criteria:
      - 3-3.A1
