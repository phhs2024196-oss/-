- id: 3-4
  stem: |
    제시문 <나>에서 $\alpha=0$이고, $\beta=100$이다. 임상실험 참가자의 $n$번째 복용 주기에서 A의 혈중 최대 농도는 정규분포 N$(a_n,\sigma^2)$을 따른다. 부작용이 발생할 가능성이 있는 사람이 1명 이하가 되게 하는 표준편차 $\sigma$ 중 가장 큰 정수를 구하시오. (단, $Z$가 표준정규분포를 따르는 확률변수일 때, P$(|Z|\le2.58)=0.99$, P$(Z\le2.33)=0.99$로 계산한다.) [90점]
  points: 90
  depends_on:
  - 3-2
  answer:
    kind: value
    value: '12'
    equivalents: []
    tolerance: null
  solutions:
  - id: S34-B
    audience: B
    method_no: 1
    steps:
    - id: 34b-1
      content: |
        100명의 임상실험자 중 부작용이 발생하는 사람이 많아야 1명이기 위해서는 99명의 실험자의 A의 혈중 농도의 최댓값이 100ppm보다 작아야 한다. 확률변수 $X$가 정규분포 N$(a_n,\sigma^2)$을 따르면 $Z=\dfrac{X-a_n}{\sigma}$은 표준정규분포 N$(0,1)$을 따른다. 따라서 P$(Z\le2.33)=0.99$이므로 $\dfrac{X-a_n}{\sigma}\le2.33\Rightarrow X\le a_n+2.33\sigma$이다.
      source_flow: 예시 답안(보고서) p.67
      criteria:
      - 3-4.M1
    - id: 34b-2
      content: |
        주기가 반복될 때마다 체내 치료 성분의 농도는 지속적으로 증가하므로 모든 $a_n$에 대하여 $a_n+2.33\sigma<100$이려면 $\displaystyle\lim_{n\to\infty}(a_n+2.33\sigma)<100$을 만족해야 한다.
      source_flow: 예시 답안(보고서) p.67
      criteria:
      - 3-4.M2
    - id: 34b-3
      content: |
        $\beta=100$이므로 $\displaystyle\lim_{n\to\infty}a_n=70.1$이고, $\sigma<12.8$이다. 따라서 정수인 $\sigma$의 최댓값은 $\sigma=12$이다.
      source_flow: 예시 답안(보고서) p.67
      criteria:
      - 3-4.A1
