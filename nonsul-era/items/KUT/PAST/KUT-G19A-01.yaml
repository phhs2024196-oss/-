      mark_type: B
      points: 3
      evidence: 넓이 함수 $G(x)=x\left(80-\dfrac{4}{5}x\right)$ 를 구할 수 있다(다른 문자로 표현해도 정답 인정).
      steps:
      - 12b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-3
  stem: |
    문제 (2)에서 구한 함수의 최댓값을 구하시오. (5점)
  points: 5
  depends_on:
  - 1-2
  answer:
    kind: value
    value: '2000'
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        문제 (2) 풀이에서 구한 함수를 변형하면
        $$G(x)=-\dfrac{4}{5}(x^2-100x)=-\dfrac{4}{5}(x-50)^2+2000$$
        이다. 따라서 구간 $0\le x\le100$에서의 이차함수 $G(x)$의 최댓값은 $x=50$일 때 2000이다.
      source_flow: PDF p.17
      criteria:
      - 1-3.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.B1
      mark_type: B
      points: 5
      evidence: 이차함수 $G(x)$의 최댓값 2000을 구할 수 있다.
      steps:
      - 13b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-4
  stem: |
    울타리 내부의 넓이가 최대가 되는 가로의 길이 $x$와 세로의 길이 $y$를 구하시오. (5점)
  points: 5
  depends_on:
  - 1-3
  answer:
    kind: set
    value: x=50; y=40
    equivalents: []
    tolerance: null
  solutions:
  - id: S14-B
    audience: B
    method_no: 1
    steps:
    - id: 14b-1
      content: |
        문제 (3) 풀이에 의하여 직사각형 $\mathrm{PQRS}$의 넓이가 최대가 되는 경우에 해당하는 선분 $\overline{\mathrm{QR}}$의 길이 $x$와 선분 $\overline{\mathrm{PQ}}$의 길이 $y$를 구하면
        $$x=50,\ y=80-\dfrac{80}{100}x=40$$
        이다. 따라서 울타리의 가로의 길이는 50(m), 세로의 길이는 40(m)이다.
      source_flow: PDF p.17
      criteria:
      - 1-4.B1
  rubric:
