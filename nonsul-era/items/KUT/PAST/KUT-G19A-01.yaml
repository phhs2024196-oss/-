      mark_type: B
      points: 5
      evidence: 최대가 되는 경우의 선분 $\overline{\mathrm{QR}}$ 의 길이 $x=50$ 과 선분 $\overline{\mathrm{PQ}}$ 의 길이 $y=40$ 을 구할 수 있다(또는 가로 50(m), 세로 40(m)).
      steps:
      - 14b-1
