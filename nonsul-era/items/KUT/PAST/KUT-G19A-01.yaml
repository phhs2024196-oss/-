stimuli: []
stem: |
  【(1)~(4)】 축산업을 하고 있는 $K$씨는 밑변이 100(m)이고 높이가 80(m)인 삼각형 모양의 풀밭 내부에 아래 그림과 같이 직사각형 모양의 울타리를 쳐서 가축을 키울 계획을 갖고 있다. 많은 수의 가축을 키우기 위해 울타리 내부의 넓이를 최대로 만들려고 할 때, 다음 물음에 답하시오. (단, 그림에서 삼각형 $\mathrm{ABC}$는 풀밭 영역을 나타낸 것이고, 직사각형 $\mathrm{PQRS}$는 울타리 영역을 나타낸 것이다. 울타리의 두께는 무시한다.) (20점)

  [그림 1: 꼭짓점 A가 위에 있고 밑변 $\mathrm{BC}=100$, A에서 밑변까지의 높이 80인 삼각형 ABC. 변 AB 위의 점 P, 변 AC 위의 점 S, 밑변 BC 위의 점 Q, R를 꼭짓점으로 하는 직사각형 PQRS(빗금 표시)가 삼각형 안에 있다]
subparts:
- id: 1-1
  stem: |
    선분 $\overline{\mathrm{QR}}$의 길이를 $x$, 선분 $\overline{\mathrm{PQ}}$의 길이를 $y$라고 할 때, $x$와 $y$의 관계를 $y=f(x)$의 형태로 나타내시오. (7점)
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: 80-4*x/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        그림에서 삼각형 $\mathrm{APS}$의 밑변의 길이는 $x$이고 높이의 길이는 $80-y$이다. 삼각형 $\mathrm{ABC}$와 삼각형 $\mathrm{APS}$ 사이의 닮음비를 이용하면
        $$\dfrac{x}{100}=\dfrac{80-y}{80}$$
        정리하면 다음과 같이 $y$를 $x$에 대한 함수로 나타낼 수 있다.
        $$\dfrac{80}{100}x=80-y\ \Leftrightarrow\ y=80-\dfrac{4}{5}x$$
      source_flow: PDF p.17
      criteria:
      - 1-1.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.B1
      mark_type: B
      points: 7
      evidence: $y$를 $x$에 대한 함수로 표현할 수 있다. 즉, $y=80-\dfrac{4}{5}x$를 구할 수 있다.
      steps:
      - 11b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    직사각형 $\mathrm{PQRS}$의 넓이를 $x$에 대한 함수로 나타내시오. (3점)
  points: 3
  depends_on:
  - 1-1
  answer:
    kind: expression
    value: x*(80-4*x/5)
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        직사각형 $\mathrm{PQRS}$의 넓이는 $xy$이므로, 구하려는 넓이 함수 $G(x)$는
        $$G(x)=x\left(80-\dfrac{4}{5}x\right),\ 0\le x\le100$$
        이다.
      source_flow: PDF p.17
      criteria:
      - 1-2.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
