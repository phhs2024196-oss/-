- id: 2-2
  stem: |
    함수 $S(a)$가 극값을 가지는 $a$의 값을 구하시오. (4점)
  points: 4
  depends_on:
  - 2-1
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        함수 $S(a)$를 $a$에 대해 미분하면
        $$S'(a)=\dfrac{1}{2}\left(-3a^2+18a-15\right)=-\dfrac{3}{2}(a-1)(a-5)$$
        이다. 구간 $-1\le a\le2$에서 함수 $S(a)$가 극값을 가질 수 있는, 즉 $S'(a)=0$을 만족하는 $a$를 구하면 $a=1$이다.
      source_flow: PDF p.20
      criteria:
      - 2-2.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.B1
      mark_type: B
      points: 4
      evidence: 함수 $S(a)$에 대하여 극값을 가지는 $a$의 값, 즉 $a=1$을 구할 수 있다.
      steps:
      - 22b-1
  outcome_codes:
