stimuli: []
stem: |
  【(1)~(3)】 함수 $y=f(x)$가
  $$f(x)=\begin{cases}(x+1)(x-a)&(-1\le x\le a)\\4(x-a)(2-x)&(a\le x\le2)\end{cases}$$
  일 때, 다음 물음에 답하시오. (단, $-1\le a\le2$) (20점)
subparts:
- id: 2-1
  stem: |
    정적분을 이용하여 곡선 $y=f(x)$와 $x$축으로 둘러싸인 도형의 넓이를 $S(a)$라 할 때, $S(a)$를 구하시오. (단, $S(a)$에 대한 최종 계산 결과는 간결하게 정리하시오.) (10점)
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: (-a**3+9*a**2-15*a+11)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        주어진 함수 $y=f(x)$를 그래프로 나타내면 구간 $[-1,a]$에서는 $x$축 아래, 구간 $[a,2]$에서는 $x$축 위에 있다. 정적분을 이용하여 구하고자 하는 둘러싸인 도형의 넓이 $S(a)$를 나타내면
        $$S(a)=\int_{-1}^{2}\lvert f(x)\rvert dx=-\int_{-1}^{a}(x+1)(x-a)dx+\int_{a}^{2}4(x-a)(2-x)dx$$
        이다.
      source_flow: PDF p.19-20
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        정적분을 구하여 정리하면 다음과 같다.
        $$S(a)=-\int_{-1}^{a}[x^2+(1-a)x-a]dx+4\int_{a}^{2}[-x^2+(a+2)x-2a]dx$$
        $$=-\left[\dfrac{x^3}{3}+(1-a)\dfrac{x^2}{2}-ax\right]_{-1}^{a}+4\left[-\dfrac{x^3}{3}+(a+2)\dfrac{x^2}{2}-2ax\right]_{a}^{2}=\dfrac{1}{2}\left(-a^3+9a^2-15a+11\right)$$
      source_flow: PDF p.20
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 3
      evidence: 정적분을 이용하여 도형의 넓이 $S(a)=-\int_{-1}^{a}(x+1)(x-a)dx+\int_{a}^{2}4(x-a)(2-x)dx$ 를 나타낼 수 있다.
      steps:
      - 21b-1
    - id: 2-1.A1
      mark_type: A
      points: 7
      evidence: $S(a)=\dfrac{1}{2}\left(-a^3+9a^2-15a+11\right)$ 을 구할 수 있다. (넓이를 나타낸 적분식이 틀리면 계산 결과가 맞아도 7점을 부여하지 않으며 2-1 전체 0점)
      steps:
      - 21b-2
      depends_on:
      - 2-1.M1
