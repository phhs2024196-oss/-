    meaning: 만점
  misconceptions: []
- id: 2-3
  stem: |
    함수 $S(a)$의 최댓값과 최솟값을 구하시오. (6점)
  points: 6
  depends_on:
  - 2-1
  answer:
    kind: set
    value: max=18; min=2
    equivalents: []
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        구간 $-1<a<2$에서 $S'(a)=0$의 근에서의 함숫값 $S(1)$과 구간의 양 끝점에서의 함숫값 $S(-1)$, $S(2)$ 중에서 가장 작은 값이 함수 $S(a)$의 최솟값이고, 가장 큰 값이 함수 $S(a)$의 최댓값이 된다. 극값 $S(1)$과 함숫값 $S(-1)$과 $S(2)$를 구하면
        $$S(1)=2,\ S(-1)=18,\ S(2)=\dfrac{9}{2}$$
        이다. 따라서 함수 $S(a)$의 최솟값은 2, 최댓값은 18이다.
      source_flow: PDF p.20
      criteria:
      - 2-3.B1
      - 2-3.B2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-3.B1
      mark_type: B
      points: 3
      evidence: '함수 $S(a)$의 최댓값 18을 구할 수 있다. [판독확인: 원본 채점기준표 2-(3)의 배점 칸이 두 행에 걸쳐 병합되어 "3" 하나만 표기됨(2-(1) 10점+2-(2) 4점+3 = 17점). 문항 배점 6점에 맞춰 3+3으로 분할]'
      steps:
      - 23b-1
    - id: 2-3.B2
      mark_type: B
      points: 3
      evidence: 함수 $S(a)$의 최솟값 2를 구할 수 있다.
      steps:
      - 23b-1
