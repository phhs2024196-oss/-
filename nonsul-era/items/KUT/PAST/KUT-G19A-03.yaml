  - id: S34-B
    audience: B
    method_no: 1
    steps:
    - id: 34b-1
      content: |
        숫자 1을 정확하게 누를 확률은 $\dfrac{6}{8}$, 숫자 0을 정확하게 누를 확률은 $\dfrac{5}{8}$, 숫자 6을 정확하게 누를 확률은 $\dfrac{5}{8}$이다. 따라서 확률의 곱셈정리로부터 106을 정확하게 누를 확률은
        $$\dfrac{6}{8}\times\dfrac{5}{8}\times\dfrac{5}{8}=\dfrac{75}{256}$$
      source_flow: PDF p.23
      criteria:
      - 3-4.M1
    - id: 34b-2
      content: |
        이다. 따라서 106이 아닌 다른 번호로 전화가 걸릴 확률은 여사건의 확률에 의해
        $$1-\dfrac{75}{256}=\dfrac{181}{256}$$
        이다.
      source_flow: PDF p.23
      criteria:
      - 3-4.A1
