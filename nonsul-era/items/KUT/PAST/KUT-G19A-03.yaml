stimuli: []
stem: |
  【(1)~(4)】 아래 그림과 같이 버튼이 구성되어 있는 전화기가 있다.

  [그림 1: 3열 4행 전화기 버튼 배열. 첫째 행 1, 2, 3, 둘째 행 4, 5, 6, 셋째 행 7, 8, 9, 넷째 행 *, 0, #]

  버튼을 누르다 보면 실수로 다른 버튼을 누르는 경우가 있다. 이 전화기는 어떤 버튼을 누르려고 시도할 때 그 버튼의 상하좌우에 있는 다른 버튼을 누를 확률이 모두 $\dfrac{1}{8}$이고, 대각선 방향 또는 그 이외의 다른 버튼을 누르는 경우는 절대 없다고 한다. 예를 들어, 숫자 9를 누르려고 시도할 때, 6, 8, #을 잘못 누를 확률이 각각 $\dfrac{1}{8}$이고 그 외의 숫자를 잘못 누를 확률은 모두 0이다. 다음 물음에 답하시오. (단, 모든 버튼은 동시에 누를 수 없다. 하위문항의 최종 계산 결과는 기약분수로 나타내시오.) (20점)
subparts:
- id: 3-1
  stem: |
    버튼을 한 번 눌러 2를 정확하게 누를 확률을 구하시오. (4점)
  points: 4
  depends_on: []
  answer:
    kind: value
    value: 5/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        숫자 2를 누르려 할 때, 1, 3, 5을 누를 확률이 각각 $\dfrac{1}{8}$이고 그 이외의 다른 버튼을 누를 확률이 0이므로, 2를 정확하게 누를 확률은
        $$1-\left(\dfrac{1}{8}+\dfrac{1}{8}+\dfrac{1}{8}\right)=\dfrac{5}{8}$$
        이다.
      source_flow: PDF p.22-23
      criteria:
      - 3-1.B1
