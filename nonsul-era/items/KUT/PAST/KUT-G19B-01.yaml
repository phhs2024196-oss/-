    meaning: 만점
  misconceptions: []
- id: 1-4
  stem: |
    원점 $\mathrm{O}$와 원 위의 점 $\mathrm{Q}$에 대하여 선분 $\overline{\mathrm{OQ}}$의 길이의 최솟값을 구하시오. (6점)
  points: 6
  depends_on:
  - 1-3
  answer:
    kind: value
    value: sqrt(5)-2
    equivalents: []
    tolerance: null
  solutions:
  - id: S14-B
    audience: B
    method_no: 1
    steps:
    - id: 14b-1
      content: |
        그래프로부터 알 수 있듯이, 선분 $\overline{\mathrm{OQ}}$의 길이의 최솟값은 원점과 원의 중심 사이의 거리에서 반지름의 길이를 뺀 것과 동일하다. 따라서 구하고자 하는 길이의 최솟값은
        $$d=\sqrt{(0+1)^2+(0-2)^2}-2=\sqrt{5}-2$$
        이다.
      source_flow: PDF p.26
      criteria:
      - 1-4.B1
  rubric:
