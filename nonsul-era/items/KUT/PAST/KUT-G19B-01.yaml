stimuli: []
stem: |
  【(1)~(4)】 좌표평면 위의 세 점 $(1,2)$, $(-1,4)$, $(-3,2)$를 지나는 원에 대해 다음 물음에 답하시오. (20점)
subparts:
- id: 1-1
  stem: |
    원의 방정식이 $x^2+y^2+ax+by+c=0$일 때, $a$, $b$, $c$에 대한 연립일차방정식을 세우시오. (4점)
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: a+2*b+c=-5; -a+4*b+c=-17; -3*a+2*b+c=-13
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        세 점 $(1,2)$, $(-1,4)$, $(-3,2)$는 원 위의 점이므로, 원의 방정식에 대입하면 다음과 같이 $a$, $b$, $c$에 대한 연립일차방정식을 세울 수 있다.
        $$a+2b+c=-5\quad\cdots①$$
        $$-a+4b+c=-17\quad\cdots②$$
        $$-3a+2b+c=-13\quad\cdots③$$
      source_flow: PDF p.25
      criteria:
      - 1-1.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.B1
      mark_type: B
      points: 4
      evidence: '$a$, $b$, $c$에 대한 연립일차방정식 ①, ②, ③을 세울 수 있다(양변 모든 항의 부호 차이는 정답으로 인정: $-a+4b+c=-17$ 과 $a-4b-c=17$ 모두 정답).'
      steps:
      - 11b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    연립일차방정식을 풀어 실수 $a$, $b$, $c$의 값을 구하시오. (6점)
  points: 6
  depends_on:
  - 1-1
  answer:
    kind: set
    value: a=2; b=-4; c=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        문제 (1)에서 구한 연립일차방정식을 풀면 다음과 같다. ①$+$②를 하면 $6b+2c=-22\ \cdots④$, $3\times$①$+$③을 하면 $8b+4c=-28\ \cdots⑤$, $-2\times$④$+$⑤를 하면 $-4b=16\Leftrightarrow b=-4$. 구한 $b=-4$를 ④에 대입하면 $-24+2c=-22\Leftrightarrow c=1$. 또한 $b=-4$와 $c=1$를 ①에 대입하면 $a+(-7)=-5\Leftrightarrow a=2$. 따라서 $a=2$, $b=-4$, $c=1$이다.
      source_flow: PDF p.25-26
      criteria:
      - 1-2.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.B1
      mark_type: B
      points: 6
      evidence: 연립일차방정식을 풀어 $a=2$, $b=-4$, $c=1$ 을 구할 수 있다.
      steps:
      - 12b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-3
  stem: |
    원의 중심과 반지름의 길이를 구하시오. (4점)
  points: 4
  depends_on:
  - 1-2
  answer:
    kind: set
    value: center=(-1,2); r=2
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        문제 (1)과 (2) 풀이로부터 원의 방정식은 $x^2+y^2+2x-4y+1=0$이다. 위의 방정식을 변형하면 $(x+1)^2+(y-2)^2=4$이 되고, 따라서 구하려는 원의 중심은 $(-1,2)$이고 반지름의 길이는 2이다.
      source_flow: PDF p.26
      criteria:
      - 1-3.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.B1
      mark_type: B
      points: 4
      evidence: 원의 방정식으로부터 원의 중심 $(-1,2)$ 와 반지름의 길이 2를 구할 수 있다.
      steps:
      - 13b-1
  outcome_codes:
