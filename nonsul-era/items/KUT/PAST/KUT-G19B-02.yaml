stimuli: []
stem: |
  【(1)~(3)】 함수 $f(x)=x^3+2ax^2+3bx+3$이 $x=-1$에서 극솟값 $-1$을 가질 때, 다음 물음에 답하시오. (단, $a$와 $b$는 상수) (20점)
subparts:
- id: 2-1
  stem: |
    상수 $a$와 $b$를 구하시오. (7점)
  points: 7
  depends_on: []
  answer:
    kind: set
    value: a=3; b=3
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        함수 $f(x)$를 미분하면 $f'(x)=3x^2+4ax+3b$이다. 조건에 의하면 함수 $f(x)$는 $x=-1$에서 극솟값 $-1$을 가지므로
        $$f'(-1)=3-4a+3b=0,\ f(-1)=-1+2a-3b+3=-1$$
        을 만족해야 한다. 위의 연립일차방정식을 풀면 $a=3$, $b=3$이다.
      source_flow: PDF p.28
      criteria:
      - 2-1.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.B1
      mark_type: B
      points: 7
      evidence: 상수 $a=3$, $b=3$ 을 구할 수 있다.
      steps:
      - 21b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    함수 $f(x)$의 극댓값을 구하시오. (6점)
  points: 6
  depends_on:
  - 2-1
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        함수 $f(x)=x^3+6x^2+9x+3$을 미분하면 $f'(x)=3x^2+12x+9=3(x+1)(x+3)$이다. 따라서 함수 $f(x)$는 $x=-1$, $x=-3$에서 극값을 가지게 된다. $x=-3$의 좌우에서 $f'(x)$의 부호가 양에서 음으로 바뀌므로 $f(x)$는 $x=-3$에서 극대이고, 극댓값 $f(-3)=3$을 가지게 된다.
      source_flow: PDF p.29
      criteria:
      - 2-2.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.B1
      mark_type: B
      points: 6
      evidence: 극댓값 3을 구할 수 있다.
      steps:
      - 22b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-3
  stem: |
    정적분을 이용하여 곡선 $y=f(x)$와 직선 $y=3$으로 둘러싸인 영역의 넓이를 구하시오. (7점)
  points: 7
  depends_on: []
  answer:
    kind: value
    value: 27/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        위의 그림으로부터 곡선 $y=f(x)$와 직선 $y=3$으로 둘러싸인 영역의 넓이 $S$는
        $$S=\int_{-3}^{0}\{3-(x^3+6x^2+9x+3)\}dx=\dfrac{27}{4}$$
        이다.
      source_flow: PDF p.29
      criteria:
      - 2-3.M1
      - 2-3.A1
