stimuli: []
stem: |
  【(1)~(4)】 크기와 모양이 같은 카드 뒷면에 12의 약수가 하나씩 적힌 6장의 카드에서 임의로 2장을 동시에 뽑으려고 한다. 뽑은 2장의 카드 중에 짝수가 적힌 카드의 개수를 확률변수 $X$라 할 때, 다음 물음에 답하시오.(단, 하위문항의 최종 계산 결과는 기약분수로 나타내시오.) (20점)
subparts:
- id: 3-1
  stem: |
    확률변수 $X$의 확률질량함수를 구하시오. (5점)
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: C(4,x)*C(2,2-x)/C(6,2) (x=0,1,2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        12의 약수, 1, 2, 3, 4, 6, 12 중에 짝수가 적힌 카드의 개수는 4개, 홀수가 적힌 카드의 개수는 2개다. 따라서 확률변수 $X$가 가질 수 있는 값은 0, 1, 2이고, 확률변수 $X$의 확률질량함수는 다음과 같다.
        $$P(X=x)=\dfrac{{}_4\mathrm{C}_x\times{}_2\mathrm{C}_{2-x}}{{}_6\mathrm{C}_2}\quad(x=0,1,2)$$
      source_flow: PDF p.32
      criteria:
      - 3-1.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.B1
      mark_type: B
      points: 5
      evidence: 확률질량함수 $P(X=x)=\dfrac{{}_4\mathrm{C}_x\times{}_2\mathrm{C}_{2-x}}{{}_6\mathrm{C}_2}\ (x=0,1,2)$ 를 구할 수 있다(수식 표현이 일치해야 정답 인정).
      steps:
      - 31b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    아래 표는 확률변수 $X$의 확률분포를 나타낸 것이다. 다음 빈칸을 채우시오. (5점)

    | $X$ | 0 | 1 | 2 | 합계 |
    |---|---|---|---|---|
    | $P(X=x)$ |  |  |  | 1 |
  points: 5
  depends_on:
  - 3-1
  answer:
    kind: set
    value: p0=1/15; p1=8/15; p2=2/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        확률변수 $X$의 확률분포를 표로 나타내면 다음과 같다.

        | $X$ | 0 | 1 | 2 | 합계 |
        |---|---|---|---|---|
        | $P(X=x)$ | $\dfrac{1}{15}$ | $\dfrac{8}{15}$ | $\dfrac{2}{5}$ | 1 |
      source_flow: PDF p.32
      criteria:
      - 3-2.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.B1
      mark_type: B
      points: 5
      evidence: 확률분포표의 빈칸 $\dfrac{1}{15}$, $\dfrac{8}{15}$, $\dfrac{2}{5}$ 를 채울 수 있다.
      steps:
      - 32b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-3
  stem: |
    확률변수 $X$의 평균을 구하시오. (5점)
  points: 5
  depends_on:
  - 3-2
  answer:
    kind: value
    value: 4/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S33-B
    audience: B
    method_no: 1
    steps:
    - id: 33b-1
      content: |
        확률변수 $X$의 평균을 구하면 다음과 같다.
        $$E(X)=0\times\dfrac{1}{15}+1\times\dfrac{8}{15}+2\times\dfrac{2}{5}=\dfrac{4}{3}$$
      source_flow: PDF p.32
      criteria:
      - 3-3.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-3.B1
      mark_type: B
      points: 5
      evidence: 확률변수 $X$의 평균 $\dfrac{4}{3}$ 를 구할 수 있다.
      steps:
      - 33b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-4
  stem: |
    확률변수 $X$의 표준편차를 구하시오. (5점)
  points: 5
  depends_on:
  - 3-3
  answer:
    kind: value
    value: 4*sqrt(5)/15
    equivalents: []
    tolerance: null
  solutions:
  - id: S34-B
    audience: B
    method_no: 1
    steps:
    - id: 34b-1
      content: |
        확률변수 $X^2$의 평균을 구하면 $E(X^2)=0^2\times\dfrac{1}{15}+1^2\times\dfrac{8}{15}+2^2\times\dfrac{2}{5}=\dfrac{32}{15}$이다. 또한 확률변수 $X$의 분산은
        $$V(X)=E(X^2)-\{E(X)\}^2=\dfrac{32}{15}-\left(\dfrac{4}{3}\right)^2=\dfrac{16}{45}$$
      source_flow: PDF p.32
      criteria:
      - 3-4.B1
    - id: 34b-2
      content: |
        이다. 따라서 확률변수 $X$의 표준편차는 $\sigma(X)=\dfrac{4}{3\sqrt{5}}=\dfrac{4\sqrt{5}}{15}$이다.
      source_flow: PDF p.32
      criteria:
      - 3-4.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-4.B1
      mark_type: B
      points: 3
      evidence: 확률변수 $X$의 분산 $\dfrac{16}{45}$ 을 구할 수 있다.
      steps:
      - 34b-1
    - id: 3-4.A1
      mark_type: A
      points: 2
      evidence: 확률변수 $X$의 표준편차 $\dfrac{4}{3\sqrt{5}}$ 또는 $\dfrac{4\sqrt{5}}{15}$ 를 구할 수 있다(분모를 유리화하지 않아도 정답 인정).
      steps:
      - 34b-2
      depends_on:
      - 3-4.B1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
