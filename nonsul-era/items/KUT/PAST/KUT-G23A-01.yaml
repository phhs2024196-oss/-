stem: |
  이차방정식 $x^2-4x+2=0$의 두 근 $\alpha$, $\beta$에 대하여 $A=\alpha^{\frac12}$, $B=\beta^{\frac12}$일 때,
subparts:
- id: '1'
  stem: |
    $\left(A-\dfrac1A\right)^2+\left(B-\dfrac1B\right)^2$의 값을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        근과 계수의 관계에 의해 $\alpha+\beta=4$, $\alpha\beta=2$이다. $A^2=\alpha$, $B^2=\beta$이므로 구하는 값은 $\left(A-\dfrac1A\right)^2+\left(B-\dfrac1B\right)^2=A^2+B^2+\dfrac1{A^2}+\dfrac1{B^2}-4$이다.
      source_flow: PDF p.14
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $=\alpha+\beta+\dfrac{\alpha+\beta}{\alpha\beta}-4=4+\dfrac42-4=2$
      source_flow: PDF p.14
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $\left(A-\frac1A\right)^2+\left(B-\frac1B\right)^2=A^2+B^2+\frac1{A^2}+\frac1{B^2}-4$ 또는 동치식이 있다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        값 $2$가 있다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
