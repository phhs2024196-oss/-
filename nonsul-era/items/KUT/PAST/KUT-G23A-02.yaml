stem: |
  두 함수 $f(x)=\log_8 x-1$, $g(x)=\log_2 x+1$에 대하여
subparts:
- id: '1'
  stem: |
    $\dfrac{g(2^m)}{f(2^m)}-3$의 값이 자연수가 되도록 하는 모든 자연수 $m$의 값의 합을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '46'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(2^m)=\dfrac m3-1$, $g(2^m)=m+1$이므로 $\dfrac{g(2^m)}{f(2^m)}-3=\dfrac{3(m+1)}{m-3}-3=\dfrac{12}{m-3}$이다.
      source_flow: PDF p.16
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\dfrac{12}{m-3}$이 자연수이려면 $m-3$이 $12$의 약수이어야 하므로 $m-3=1,\,2,\,3,\,4,\,6,\,12$, 즉 $m=4,\,5,\,6,\,7,\,9,\,15$이고 구하는 합은 $46$이다.
      source_flow: PDF p.16
      criteria:
      - 1.A1
