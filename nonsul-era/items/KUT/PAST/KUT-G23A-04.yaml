stimuli: []
stem: |
  모든 실수 $x$에 대하여 등식 $\sin x+\sin\left(x-\dfrac nm\pi\right)=0$이
subparts:
- id: '1'
  stem: |
    항상 성립하도록 하는 순서쌍 $(m,\,n)$의 개수를 구하시오. (단, $m$, $n$은 10 이하의 자연수이다.)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '17'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        모든 실수 $x$에 대하여 $\sin x+\sin\left(x-\dfrac nm\pi\right)=0$이 성립하는 경우는 $\dfrac nm$의 값이 홀수인 경우뿐이다. $m$, $n$이 10 이하의 자연수이므로 $\dfrac nm=1,\,3,\,5,\,7,\,9$이다.
      source_flow: PDF p.20
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\dfrac nm=1$이면 $(m,n)=(1,1),(2,2),\cdots,(10,10)$의 10개, $\dfrac nm=3$이면 $(1,3),(2,6),(3,9)$의 3개, $\dfrac nm=5$이면 $(1,5),(2,10)$의 2개, $\dfrac nm=7$이면 $(1,7)$의 1개, $\dfrac nm=9$이면 $(1,9)$의 1개이다. 따라서 구하는 순서쌍의 개수는 $10+3+2+1+1=17$이다.
      source_flow: PDF p.20
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
