stimuli: []
stem: |
  양수 $a$에 대하여 함수 $f(x)=ax^3-4x^2+ax+6$이 실수 전체의 집합에서
subparts:
- id: '1'
  stem: |
    일대일대응일 때, $a$의 최솟값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 4*sqrt(3)/3
    equivalents:
    - 4/sqrt(3)
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$가 실수 전체의 집합에서 일대일대응이려면 모든 실수 $x$에 대하여 $f'(x)\ge0$ 또는 $f'(x)\le0$이어야 한다. $f'(x)=3ax^2-8x+a$이고 이차항의 계수가 양수이므로 모든 실수 $x$에 대하여 $f'(x)\ge0$이어야 한다.
      source_flow: PDF p.22
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이차방정식 $3ax^2-8x+a=0$의 판별식을 $D$라 하면 $\dfrac D4=16-3a^2\le0$이다.
      source_flow: PDF p.22
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $a$가 양수이므로 $a\ge\dfrac4{\sqrt3}$이고, $a$의 최솟값은 $\dfrac4{\sqrt3}\left(=\dfrac{4\sqrt3}3\right)$이다.
      source_flow: PDF p.22
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        모든 실수 $x$에 대하여 $f'(x)\ge0$이라는 조건이 있다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        부등식 $16-3a^2\le0$이 있다.
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $a$의 최솟값 $\frac4{\sqrt3}$ (또는 $\frac{4\sqrt3}3$)이 있다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
