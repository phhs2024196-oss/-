stimuli: []
stem: |
  다항함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $\displaystyle\lim_{x\to\infty}\dfrac{f(x)}{x^3+1}=2$

  (나) $f(2)=0$

  (다) $\displaystyle\lim_{x\to1}\dfrac{f(x)}{4x^2-3x-1}=\dfrac45$
subparts:
- id: '1'
  stem: |
    $f(4)$의 값을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '12'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)를 만족시키려면 $f(x)$는 최고차항의 계수가 $2$인 삼차함수이다.
      source_flow: PDF p.24
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        조건 (나)에서 $f(x)$는 $x-2$를 인수로 갖는다. 조건 (다)에서 $x\to1$일 때 (분모)$\to0$이고 극한값이 존재하므로 (분자)$\to0$이어야 한다. 즉 $\displaystyle\lim_{x\to1}f(x)=f(1)=0$이므로 $f(x)$는 $x-1$을 인수로 갖는다. 따라서 $f(x)=2(x-2)(x-1)(x+a)$ ($a$는 실수)이다.
      source_flow: PDF p.24
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        이를 조건 (다)의 식에 대입하면 $\displaystyle\lim_{x\to1}\dfrac{2(x-2)(x-1)(x+a)}{(x-1)(4x+1)}=\lim_{x\to1}\dfrac{2(x-2)(x+a)}{4x+1}=\dfrac{-2(1+a)}5=\dfrac45$이므로 $a=-3$이고 $f(x)=2(x-2)(x-1)(x-3)$이다.
      source_flow: PDF p.24
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        따라서 $f(4)=12$이다.
      source_flow: PDF p.24
      criteria:
      - 1.A2
