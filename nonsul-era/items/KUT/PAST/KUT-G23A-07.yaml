stimuli: []
stem: |
  모든 실수 $x$에 대하여 다항함수 $f(x)$가 $xf(x)=x^2+\displaystyle\int_0^x(t-1)f'(t)\,dt$를 만족시킬 때,
subparts:
- id: '1'
  stem: |
    $\displaystyle\int_{-1}^{2}f(x)\,dx$의 값을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '-3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $xf(x)=x^2+\displaystyle\int_0^x(t-1)f'(t)\,dt$의 양변을 $x$에 대하여 미분하면 $f(x)+xf'(x)=2x+(x-1)f'(x)$이다.
      source_flow: PDF p.26
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이로부터 $f(x)+f'(x)=2x$이므로 $f(x)$는 일차함수이다. $f(x)=ax+b$ ($a$, $b$는 실수)라 하면 $f(x)+f'(x)=ax+b+a=2x$이고, 모든 실수 $x$에 대하여 성립하므로 $a=2$, $b=-2$, 즉 $f(x)=2x-2$이다.
      source_flow: PDF p.26
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $\displaystyle\int_{-1}^{2}f(x)\,dx=\int_{-1}^{2}(2x-2)\,dx=\Big[x^2-2x\Big]_{-1}^{2}=-3$이다.
      source_flow: PDF p.26
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
