stem: |
  수직선 위를 움직이는 두 점 $P$, $Q$의 시각 $t$에서의 속도를 각각 $f(t)$, $g(t)$라 하면
  $$f(t)=6t-3,\qquad g(t)=3t^2-4t-4$$
  이다. 시각 $t=0$에서의 두 점 $P$, $Q$의 위치는 각각 $0$, $5$이고, $t>0$일 때 두 점 $P$, $Q$는 시각 $t=\alpha$에서 처음으로 만나고 $t=\beta$에서 두 번째로 다시 만난다.
  시각 $t=\alpha$에서 $t=\beta$까지 두 점 $P$, $Q$가 움직인 거리를 각각 $s_1$, $s_2$라 할 때,
subparts:
- id: '1'
  stem: |
    $s_2-s_1$의 값을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        시각 $t$에서 두 점 $P$, $Q$의 위치를 각각 $x_P(t)$, $x_Q(t)$라 하면 $x_P(t)=\displaystyle\int_0^t(6s-3)\,ds=3t^2-3t$이다.
      source_flow: PDF p.28
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x_Q(t)=5+\displaystyle\int_0^t(3s^2-4s-4)\,ds=t^3-2t^2-4t+5$이다.
      source_flow: PDF p.28
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        두 점이 만나려면 $x_P(t)=x_Q(t)$, 즉 $3t^2-3t=t^3-2t^2-4t+5$를 풀면 $t=-1,\,1,\,5$이고 $t>0$이므로 $\alpha=1$, $\beta=5$이다.
      source_flow: PDF p.28
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $s_1=\displaystyle\int_1^5|f(t)|\,dt=\int_1^5(6t-3)\,dt=60$이다.
      source_flow: PDF p.28
      criteria:
      - 1.A2
    - id: 1b-5
      content: |
        $s_2=\displaystyle\int_1^5|g(t)|\,dt=\int_1^2\{-g(t)\}\,dt+\int_2^5g(t)\,dt=\int_1^2(-3t^2+4t+4)\,dt+\int_2^5(3t^2-4t-4)\,dt=66$이다.
      source_flow: PDF p.28
      criteria:
      - 1.A3
    - id: 1b-6
      content: |
        따라서 $s_2-s_1=66-60=6$이다.
      source_flow: PDF p.28
      criteria:
      - 1.A4
