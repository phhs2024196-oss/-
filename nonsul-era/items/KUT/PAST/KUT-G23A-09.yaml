stimuli: []
stem: |
  실수 $t$에 대하여 함수 $f(x)=x^3-6x^2+7x+t$가 있다. 좌표평면 위의 두 점 $A(3,\,0)$, $B(0,\,6)$을 포함하는 선분 $AB$에 대하여 다음 물음에 답하시오.
subparts:
- id: 1-1
  stem: |
    $t>a$인 모든 실수 $t$에 대하여 곡선 $y=f(x)$와 선분 $AB$가 만나지 않을 때, 실수 $a$의 최솟값을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        두 점 $A(3,0)$, $B(0,6)$을 포함하는 선분 $AB$는 $y=-2x+6\ (0\le x\le3)$이다.
      source_flow: PDF p.30
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        곡선 $y=x^3-6x^2+7x+t$와 선분 $AB$가 만나는 점의 개수는 $x$에 대한 방정식 $x^3-6x^2+7x+t=-2x+6\ (0\le x\le3)$을 만족시키는 실근의 개수와 같다. $g(x)=-x^3+6x^2-9x+6$이라 하면 이 방정식은 $g(x)=t\ (0\le x\le3)$이다.
      source_flow: PDF p.30
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        $g'(x)=-3x^2+12x-9=-3(x-1)(x-3)$이므로 $g(x)$는 $x=1$에서 극솟값 $g(1)=2$를 갖고 $g(0)=6$, $g(3)=6$이다(증감표). $y=g(x)$의 그래프로부터 $t>6$인 모든 실수 $t$에 대하여 방정식을 만족시키는 실근이 존재하지 않으므로 $a$의 최솟값은 $6$이다.
      source_flow: PDF p.30
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        선분 $AB$를 $y=-2x+6\ (0\le x\le3)$으로 나타낸 식이 있다.
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 3
      evidence: |
        방정식 $x^3-6x^2+7x+t=-2x+6\ (0\le x\le3)$ 또는 $g(x)=t$가 있다.
      steps:
      - 11b-2
    - id: 1-1.A1
      mark_type: A
      points: 6
      evidence: |
        $a$의 최솟값 $6$이 있다.
      depends_on:
      - 1-1.M2
      steps:
      - 11b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    $t=b$일 때, 곡선 $y=f(x)$와 선분 $AB$가 한 점에서 만난다. 이때, $f(b)$의 값을 구하시오. (단, $b$는 실수이다.)
  points: 4
  depends_on:
  - 1-1
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        (1)의 풀이에서 구한 함수 $y=g(x)$의 그래프로부터 $t=2$일 때 방정식 $g(x)=t$를 만족시키는 실근이 한 개 존재하므로 $b=2$이다.
      source_flow: PDF p.30
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        따라서 $f(b)=f(2)=2^3-6\times2^2+7\times2+2=0$이다.
      source_flow: PDF p.30
      criteria:
      - 1-2.A1
  rubric:
