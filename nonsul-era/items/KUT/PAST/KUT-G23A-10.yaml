    method_no: 1
    steps:
    - id: 12b-1
      content: |
        (1)의 풀이로부터 등차수열 $\{a_n\}$은 첫째항이 $-18$이고 공차가 $3$이므로 $a_n=3n-21$이다.
      source_flow: PDF p.32
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        등차수열 $\{b_n\}$은 첫째항이 $-6$이고 공차가 $4$이므로 $b_n=4n-10$이다.
      source_flow: PDF p.32
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        따라서 $\displaystyle\sum_{n=1}^{10}(b_n-a_n)=\sum_{n=1}^{10}(n+11)=165$이다.
      source_flow: PDF p.32
      criteria:
      - 1-2.A1
