stem: |
  공차가 $3$인 등차수열 $\{a_n\}$과 공차가 $4$인 등차수열 $\{b_n\}$이 다음 조건을 만족시킨다.

  (가) $a_1<b_1$

  (나) $2a_5+b_6=2$

  (다) $\displaystyle\sum_{n=1}^{8}|b_n|=\sum_{n=1}^{8}|a_n|+14$

  $a_k=0$을 만족시키는 $9$보다 작은 자연수 $k$가 존재할 때, 다음 물음에 답하시오.
subparts:
- id: 1-1
  stem: |
    $a_1+b_1$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '-24'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        두 등차수열 $\{a_n\}$, $\{b_n\}$의 공차가 각각 $3$, $4$이므로 $a_5=a_1+4\times3$, $b_6=b_1+5\times4$이다. 이를 이용하면 조건 (가)로부터 $a_5<b_6-8$이다. 조건 (나)에서 $b_6=2-2a_5$이므로 $a_5<-2a_5-6$, 즉 $a_5<-2$이다. $\{a_n\}$의 공차가 $3$이므로 $a_k=0$을 만족시키는 $9$보다 작은 자연수 $k$의 값은 $6,\,7,\,8$뿐이다.
      source_flow: PDF p.32
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        (i) $k=6$이면 $a_6=0$, $a_1=-15$, $a_5=-3$이므로 조건 (나)에 의하여 $b_6=8$, $b_1=-12$이다. 이때 $\displaystyle\sum_{n=1}^{8}|a_n|=54$, $\displaystyle\sum_{n=1}^{8}|b_n|=64$이므로 조건 (다)를 만족시키지 않는다.
      source_flow: PDF p.32
      criteria:
      - 1-1.M1
    - id: 11b-3
      content: |
        (ii) $k=7$이면 $a_7=0$, $a_1=-18$, $a_5=-6$이므로 $b_6=14$, $b_1=-6$이다. 이때 $\displaystyle\sum_{n=1}^{8}|a_n|=66$, $\displaystyle\sum_{n=1}^{8}|b_n|=80$이므로 조건 (다)를 만족시킨다.
      source_flow: PDF p.32
      criteria:
      - 1-1.M1
      - 1-1.A1
      - 1-1.A2
    - id: 11b-4
      content: |
        (iii) $k=8$이면 $a_8=0$, $a_1=-21$, $a_5=-9$이므로 $b_6=20$, $b_1=0$이다. 이때 $\displaystyle\sum_{n=1}^{8}|a_n|=84$, $\displaystyle\sum_{n=1}^{8}|b_n|=112$이므로 조건 (다)를 만족시키지 않는다.
      source_flow: PDF p.32
      criteria:
      - 1-1.M1
    - id: 11b-5
      content: |
        따라서 (ii)의 경우에만 조건을 모두 만족시키는 두 등차수열이 존재하고, $a_1+b_1=-24$이다.
      source_flow: PDF p.32
      criteria:
      - 1-1.A3
