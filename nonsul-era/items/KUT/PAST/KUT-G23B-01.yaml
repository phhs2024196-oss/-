stem: |
  $\left(\sqrt{2\sqrt[4]{8}}\right)^{n}$의 값이 세 자리 자연수가 되도록 하는
subparts:
- id: '1'
  stem: |
    자연수 $n$의 값을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '8'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        지수법칙에 의해 $\left(\sqrt{2\sqrt[4]8}\right)^n=\left(2\times2^{\frac34}\right)^{\frac n2}=\left(2^{\frac74}\right)^{\frac n2}=2^{\frac{7n}8}$이다.
      source_flow: PDF p.36
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이 값이 자연수가 되려면 $n$은 $8$의 배수이어야 한다. (i) $n=8$이면 $2^7=128$로 세 자리 자연수이다. (ii) $n=16$이면 $2^{14}=16384$로 세 자리 자연수가 아니다. 따라서 구하는 자연수 $n$의 값은 $8$이다.
      source_flow: PDF p.36
      criteria:
      - 1.A1
