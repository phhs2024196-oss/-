stem: |
  모든 실수 $x$에 대하여 함수 $f(x)=\log_{|a-2|}(x^2+2ax+5a+36)$가 정의되도록 하는
subparts:
- id: '1'
  stem: |
    모든 정수 $a$의 값의 합을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '24'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수가 정의되려면 밑의 조건 $|a-2|>0$, $|a-2|\ne1$, 즉 $a\ne1,\,2,\,3$을 만족시켜야 한다.
      source_flow: PDF p.38
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        진수의 조건으로부터 모든 실수 $x$에 대하여 $x^2+2ax+5a+36>0$이어야 하므로 이차방정식 $x^2+2ax+5a+36=0$의 판별식 $D$에 대하여 $\dfrac D4=a^2-(5a+36)<0$, 즉 $-4<a<9$이다.
      source_flow: PDF p.38
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        두 조건을 동시에 만족시키는 정수 $a$의 값은 $-3,\,-2,\,-1,\,0,\,4,\,5,\,6,\,7,\,8$이고 구하는 합은 $24$이다.
      source_flow: PDF p.38
      criteria:
      - 1.A1
