stimuli: []
stem: |
  두 다항함수 $f(x)$, $g(x)$가 $\displaystyle\lim_{x\to3}\dfrac{f(x)g(x)-5}{x-3}=10$을 만족시킬 때,
subparts:
- id: '1'
  stem: |
    $\dfrac{f'(3)}{f(3)}+\dfrac{g'(3)}{g(3)}$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x\to3$일 때 (분모)$\to0$이고 극한값이 존재하므로 (분자)$\to0$이어야 한다. 다항함수 $h(x)=f(x)g(x)$는 연속이므로 $\displaystyle\lim_{x\to3}\{h(x)-5\}=h(3)-5=0$, 즉 $f(3)g(3)=5$이다.
      source_flow: PDF p.40
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        미분계수의 정의에 의해 $\displaystyle\lim_{x\to3}\dfrac{f(x)g(x)-5}{x-3}=\lim_{x\to3}\dfrac{h(x)-h(3)}{x-3}=h'(3)=f'(3)g(3)+f(3)g'(3)=10$이다.
      source_flow: PDF p.40
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 $\dfrac{f'(3)}{f(3)}+\dfrac{g'(3)}{g(3)}=\dfrac{f'(3)g(3)+f(3)g'(3)}{f(3)g(3)}=\dfrac{h'(3)}{h(3)}=\dfrac{10}5=2$이다.
      source_flow: PDF p.40
      criteria:
      - 1.A1
