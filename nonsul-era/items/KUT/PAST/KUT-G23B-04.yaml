stimuli: []
stem: |
  $\overline{\mathrm{AB}}=2$이고 $\angle\mathrm{BAC}=120^\circ$인 삼각형 $\mathrm{ABC}$가 있다. $\angle\mathrm{BAC}$의 이등분선이 선분 $\mathrm{BC}$와 만나는 점을 $\mathrm D$라 하고 $\overline{\mathrm{AD}}=\overline{\mathrm{AC}}^{2}$일 때,
subparts:
- id: '1'
  stem: |
    선분 $\mathrm{AC}$의 길이를 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: -1+sqrt(3)
    equivalents:
    - sqrt(3)-1
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{AC}}=x$라 하면 $\overline{\mathrm{AD}}=x^2$이고, $\angle\mathrm{BAD}=\angle\mathrm{CAD}=60^\circ$이다. 삼각형 $\mathrm{ABD}$의 넓이는 $\dfrac12\times2\times x^2\times\sin60^\circ=\dfrac{\sqrt3}2x^2$, 삼각형 $\mathrm{ACD}$의 넓이는 $\dfrac12\times x\times x^2\times\sin60^\circ=\dfrac{\sqrt3}4x^3$, 삼각형 $\mathrm{ABC}$의 넓이는 $\dfrac12\times2\times x\times\sin120^\circ=\dfrac{\sqrt3}2x$이다.
      source_flow: PDF p.42
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        삼각형 $\mathrm{ABC}$의 넓이는 삼각형 $\mathrm{ABD}$와 삼각형 $\mathrm{ACD}$의 넓이의 합과 같으므로 $\dfrac{\sqrt3}2x=\dfrac{\sqrt3}2x^2+\dfrac{\sqrt3}4x^3$이고, 이를 풀면 $x(x^2+2x-2)=0$, 즉 $x=0,\,-1+\sqrt3,\,-1-\sqrt3$이다.
      source_flow: PDF p.42
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $x>0$이므로 $x=-1+\sqrt3$이고, 선분 $\mathrm{AC}$의 길이는 $-1+\sqrt3$이다.
      source_flow: PDF p.42
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
