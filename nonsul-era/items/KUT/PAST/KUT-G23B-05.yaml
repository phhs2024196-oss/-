stimuli: []
stem: |
  모든 실수 $x$에 대하여 다항함수 $f(x)$가 $xf(x)=4x^3+3x^2+\displaystyle\int_{-2}^{x}f(t)\,dt$를 만족시킬 때,
subparts:
- id: '1'
  stem: |
    $f(2)$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '34'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $xf(x)=4x^3+3x^2+\displaystyle\int_{-2}^{x}f(t)\,dt$의 양변을 $x$에 대하여 미분하면 $f(x)+xf'(x)=12x^2+6x+f(x)$이다. 이로부터 $xf'(x)=x(12x+6)$이고 $f(x)$가 다항함수이므로 $f'(x)=12x+6$, $f(x)=\displaystyle\int(12x+6)\,dx=6x^2+6x+C$ ($C$는 적분상수)이다.
      source_flow: PDF p.44
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        처음 식에 $x=-2$를 대입하면 $-2f(-2)=4(-2)^3+3(-2)^2+\displaystyle\int_{-2}^{-2}f(t)\,dt=-20$이므로 $f(-2)=10$이다. 한편 $f(-2)=12+C$이므로 $C=-2$, 즉 $f(x)=6x^2+6x-2$이다.
      source_flow: PDF p.44
      criteria:
      - 1.A1
      - 1.A2
    - id: 1b-3
      content: |
        따라서 $f(2)=6\times2^2+6\times2+(-2)=34$이다.
      source_flow: PDF p.44
      criteria:
      - 1.A3
  rubric:
