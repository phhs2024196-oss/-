stimuli: []
stem: |
  실수 $t$에 대하여 $x$에 대한 이차방정식 $x^2+2x+t=0$의 서로 다른 실근의 개수를 $f(t)$라 하자.
subparts:
- id: '1'
  stem: |
    함수 $(t+a)f(t)$가 모든 실수 $t$에서 연속일 때, 실수 $a$의 값을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '-1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        이차방정식 $x^2+2x+t=0$의 판별식을 $D$라 하면 $\dfrac D4=1-t$이다. 따라서 서로 다른 실근의 개수를 나타내는 함수 $f(t)$는 $f(t)=\begin{cases}2&(t<1)\\1&(t=1)\\0&(t>1)\end{cases}$이다.
      source_flow: PDF p.46
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        함수 $(t+a)f(t)$가 모든 실수 $t$에서 연속이기 위해서는 $t=1$에서만 연속이면 충분하다. $\displaystyle\lim_{t\to1-}(t+a)f(t)=\lim_{t\to1+}(t+a)f(t)$에서 $2(1+a)=0$, 즉 $a=-1$이다. 이 경우 $\displaystyle\lim_{t\to1}(t+a)f(t)=(1+a)f(1)$까지 만족시키므로 $t=1$에서 연속이다. 따라서 $a=-1$이다.
      source_flow: PDF p.46
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
