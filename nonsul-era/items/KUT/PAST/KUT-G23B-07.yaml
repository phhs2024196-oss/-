stimuli: []
stem: |
  최고차항의 계수가 $1$이고 $f(2)=0$인 삼차함수 $f(x)$가 $\displaystyle\lim_{x\to5}\dfrac{f(x)}{(x-5)\{f'(x)\}^2}=\dfrac19$을 만족시킬 때,
subparts:
- id: '1'
  stem: |
    $f(3)$의 값을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '-2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x\to5$일 때 (분모)$\to0$이고 극한값이 존재하므로 (분자)$\to0$이어야 한다. 즉 $\displaystyle\lim_{x\to5}f(x)=f(5)=0$이다.
      source_flow: PDF p.48
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(x)$는 $x-5$를 인수로 갖고, 조건 $f(2)=0$에서 $x-2$도 인수로 갖는다. 최고차항의 계수가 $1$인 삼차함수이므로 $f(x)=(x-2)(x-5)(x+a)$ ($a$는 실수)이다.
      source_flow: PDF p.48
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $f'(x)=(x-5)(x+a)+(x-2)(x+a)+(x-2)(x-5)$이고 $f'(5)\ne0$이므로 $\displaystyle\lim_{x\to5}\dfrac{f(x)}{(x-5)\{f'(x)\}^2}=\lim_{x\to5}\dfrac{(x-2)(x+a)}{\{f'(x)\}^2}=\dfrac{3(5+a)}{\{f'(5)\}^2}=\dfrac1{3(5+a)}=\dfrac19$이다. 이를 풀면 $a=-2$이므로 $f(x)=(x-2)^2(x-5)$이다.
      source_flow: PDF p.48
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        따라서 $f(3)=1^2\times(-2)=-2$이다.
      source_flow: PDF p.48
      criteria:
      - 1.A2
