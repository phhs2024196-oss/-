stimuli: []
stem: |
  함수 $f(x)$가 $f(x)=\displaystyle\int_0^2 3(t+x)(t+x^2)\,dt$이다.
subparts:
- id: '1'
  stem: |
    닫힌구간 $[0,\,2]$에서 함수 $f(x)$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M+m$의 값을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '100'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\displaystyle\int_0^2 3(t+x)(t+x^2)\,dt=\Big[t^3+\dfrac32t^2(x^2+x)+3x^3t\Big]_0^2=6x^3+6x^2+6x+8$이다.
      source_flow: PDF p.50
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f'(x)=6(3x^2+2x+1)$이고, 모든 실수 $x$에 대하여 $f'(x)>0$이므로 $f(x)$는 증가함수이다.
      source_flow: PDF p.50
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 닫힌구간 $[0,\,2]$에서 $f(x)$의 최댓값은 $M=f(2)=92$이고 최솟값은 $m=f(0)=8$이다. 구하는 값은 $M+m=100$이다.
      source_flow: PDF p.50
      criteria:
      - 1.A1
      - 1.A2
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
