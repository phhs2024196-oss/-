stem: |
  두 양수 $a$, $k$에 대하여 좌표평면 위의 네 점 A, B, C, D는 다음을 만족시킨다.

  (가) 점 A는 직선 $y=-x+k$와 $y$축이 만나는 점이다.

  (나) 점 B는 직선 $y=-x+k$와 곡선 $y=\log_2 x+6$이 만나는 점이다.

  (다) 점 C는 직선 $y=-x+k$와 곡선 $y=a\log_9 x$가 만나는 점이다.

  (라) 점 D는 직선 $y=-x+k$와 곡선 $x$축이 만나는 점이다. [판독확인: 원문 오식 — 'x축'이 곡선이 아닌데 '곡선'으로 적혀 있음, 원문 그대로]

  $\overline{\mathrm{AB}}=\sqrt2$이고 $\overline{\mathrm{AB}}$, $\overline{\mathrm{BC}}$, $\overline{\mathrm{CD}}$가 이 순서대로 등비수열을 이룰 때, 다음 물음에 답하시오.
subparts:
- id: 1-1
  stem: |
    $k$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '7'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $\overline{\mathrm{AB}}=\sqrt2$이고 직선 $y=-x+k$의 기울기가 $-1$이므로 점 B의 $x$좌표는 $1$이고, 점 B는 직선 $y=-x+k$ 위의 점이므로 점 B의 좌표는 $(1,\,k-1)$이다.
      source_flow: PDF p.52
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        조건 (나)에서 점 B는 곡선 $y=\log_2x+6$ 위에 있으므로 $k-1=\log_21+6$, 즉 $k=7$이다.
      source_flow: PDF p.52
      criteria:
      - 1-1.A1
