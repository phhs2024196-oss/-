  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $\overline{\mathrm{AB}}=\sqrt2$이고 $\overline{\mathrm{AB}}$, $\overline{\mathrm{BC}}$, $\overline{\mathrm{CD}}$가 이 순서대로 등비수열을 이루므로 $\overline{\mathrm{BC}}=\sqrt2\,r$, $\overline{\mathrm{CD}}=\sqrt2\,r^2$이다 (단, $r$은 공비). 점 A는 $(0,7)$, 점 D는 $(7,0)$이므로 $\overline{\mathrm{AD}}=7\sqrt2$이고, 또한 $\overline{\mathrm{AD}}=\overline{\mathrm{AB}}+\overline{\mathrm{BC}}+\overline{\mathrm{CD}}$이므로 $7\sqrt2=\sqrt2(1+r+r^2)$ ($r>0$)이다. 이를 풀면 $r=2$이다.
      source_flow: PDF p.52
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        따라서 점 C는 $(3,\,4)$이고, 조건 (다)에서 점 C는 곡선 $y=a\log_9x$ 위에 있으므로 $4=a\log_93$, 즉 $a=8$이다.
      source_flow: PDF p.52
      criteria:
      - 1-2.A1
