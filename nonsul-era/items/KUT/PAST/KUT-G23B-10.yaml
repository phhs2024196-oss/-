stimuli: []
stem: |
  $0<k<4$인 실수 $k$에 대하여 곡선 $y=x(x-k)(x-4)$에 접하고 원점을 지나는 두 접선을 $l_1$, $l_2$라 할 때, 다음 물음에 답하시오.
  (단, 접선 $l_1$의 기울기는 접선 $l_2$의 기울기보다 크다.)
subparts:
- id: 1-1
  stem: |
    두 접선 $l_1$, $l_2$의 기울기를 $k$에 관한 식으로 나타내시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: l1 = 4*k; l2 = -(k**2 - 8*k + 16)/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $f(x)=x(x-k)(x-4)$라 하면 $f(0)=0$이므로 원점은 곡선 $y=f(x)$ 위의 점이다. 따라서 접선 $l_1$의 기울기는 $f'(0)$이고 $f'(x)=3x^2-2(k+4)x+4k$이므로 $f'(0)=4k$이다.
      source_flow: PDF p.54
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        접선 $l_2$의 기울기를 구하기 위해 원점이 아닌 점 $(t,\,f(t))$에서의 접선의 방정식 $y-f(t)=f'(t)(x-t)$를 구한다. 이 접선이 원점을 지나므로 $-f(t)=f'(t)(-t)$를 만족시켜야 한다. $f(x)=x^3-(k+4)x^2+4kx$이므로 이를 정리하면 $t^2\{2t-(k+4)\}=0$ ($t\ne0$)이고 $t=\dfrac{k+4}2$이다.
      source_flow: PDF p.54
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        따라서 접선 $l_2$의 기울기는 $f'(t)$이고, 이를 구하면 $f'\!\left(\dfrac{k+4}2\right)=-\dfrac14(k^2-8k+16)$이다.
      source_flow: PDF p.54
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 4
      evidence: |
        접선 $l_1$의 기울기 $4k$가 있다.
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 3
      evidence: |
        접선 $l_2$의 접점의 $x$좌표 $\frac{k+4}2$가 있다.
      steps:
      - 11b-2
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        접선 $l_2$의 기울기 $-\frac14(k^2-8k+16)$이 있다.
      depends_on:
      - 1-1.M2
      steps:
      - 11b-3
  outcome_codes:
