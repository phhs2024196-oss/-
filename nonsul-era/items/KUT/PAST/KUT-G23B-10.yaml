    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    위 (1)에서 구한 두 접선 $l_1$, $l_2$의 기울기의 곱을 $g(k)$라 할 때, $\displaystyle\sum_{k=1}^{3}g(k)$의 값을 구하시오.
  points: 6
  depends_on:
