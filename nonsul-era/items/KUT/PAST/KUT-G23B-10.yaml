    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        (1)의 풀이에서 구한 두 접선의 기울기의 곱은 $g(k)=-k^3+8k^2-16k$이다.
      source_flow: PDF p.54
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        따라서 $\displaystyle\sum_{k=1}^{3}g(k)=\sum_{k=1}^{3}(-k^3+8k^2-16k)=(-9)+(-8)+(-3)=-20$이다.
      source_flow: PDF p.54
      criteria:
      - 1-2.A1
