stem: |
  1이 아닌 두 양수 $a$, $b$에 대하여 이차방정식 $x^2-8x+4=0$의 두 근이
  $\log_2 a$, $\log_2 b$일 때, $\log_a b+\log_b a$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '14'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        근과 계수의 관계에 의하여 $\log_2 a+\log_2 b=8$, $(\log_2 a)(\log_2 b)=4$이다.
      source_flow: PDF p.9
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 문제에서 구하고자 하는 값은 $\log_a b+\log_b a=\dfrac{\log_2 b}{\log_2 a}+\dfrac{\log_2 a}{\log_2 b}=\dfrac{(\log_2 a)^2+(\log_2 b)^2}{(\log_2 a)(\log_2 b)}$
      source_flow: PDF p.9
      criteria:
      - 1.A2
    - id: 1b-3
      content: |
        $=\dfrac{(\log_2 a+\log_2 b)^2-2(\log_2 a)(\log_2 b)}{(\log_2 a)(\log_2 b)}=\dfrac{8^2-2\times4}{4}=14$이다.
      source_flow: PDF p.9
      criteria:
      - 1.A2
