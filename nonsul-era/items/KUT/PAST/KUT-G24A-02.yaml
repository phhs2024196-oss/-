stimuli: []
stem: |
  다항함수 $f(x)$에 대하여
  $$\lim_{x\to\infty}\frac{f(x)-x^3}{2x^2-x}=-\frac12,\quad\lim_{x\to2}\frac{f(x)}{x-2}=10$$
  일 때, $f(1)$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '-6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\lim_{x\to\infty}\dfrac{f(x)-x^3}{2x^2-x}$의 값이 존재하기 위해서는 $f(x)=x^3+ax^2+bx+c$ (단, $a$, $b$, $c$는 상수)이어야 하고, 이를 대입하면 $\lim_{x\to\infty}\dfrac{ax^2+bx+c}{2x^2-x}=\dfrac a2=-\dfrac12$, 즉 $a=-1$이다. 따라서 $f(x)=x^3-x^2+bx+c$이다.
      source_flow: PDF p.11
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        또한 $\lim_{x\to2}\dfrac{f(x)}{x-2}$의 값이 존재하기 위해서는 $f(2)=0$이어야 하므로 $8-4+2b+c=0$, 즉 $c=-4-2b$ … ㉠ 이다. 따라서 $f(x)=(x-2)(x^2+x+2+b)$이고, 이를 대입하면 $\lim_{x\to2}(x^2+x+2+b)=10$, 즉 $b=2$이다.
      source_flow: PDF p.11
      criteria:
      - 1.A2
    - id: 1b-3
      content: |
        식 ㉠으로부터 $c=-8$이므로 정리하면 $f(x)=x^3-x^2+2x-8$이다. 그러므로 문제에서 구하고자 하는 값은 $f(1)=-6$이다.
      source_flow: PDF p.11
      criteria:
      - 1.A2
