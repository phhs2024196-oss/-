stimuli: []
stem: |
  함수 $f(x)=(2x^2+x+3)(3x-2)$이고 다항함수 $g(x)$는
  $$\lim_{x\to-1}\frac{g(x)+2}{x^2+3x+2}=3$$
  을 만족시킬 때, 함수 $h(x)=f(x)g(x)$라 하자. $h'(-1)$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '-114'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=(2x^2+x+3)(3x-2)$이므로 $f(-1)=-20$이고, $f'(x)=(4x+1)(3x-2)+(2x^2+x+3)\times3$이므로 $f'(-1)=27$이다.
      source_flow: PDF p.13
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        또한 문제에서 $\lim_{x\to-1}\dfrac{g(x)+2}{x^2+3x+2}$의 값이 존재하기 위해서는 $g(-1)=-2$이어야 한다. 따라서 $\lim_{x\to-1}\dfrac{g(x)-g(-1)}{\{x-(-1)\}(x+2)}=\lim_{x\to-1}\dfrac1{x+2}\times\lim_{x\to-1}\dfrac{g(x)-g(-1)}{x-(-1)}=3$, 즉 $g'(-1)=3$이다.
      source_flow: PDF p.13
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        그러므로 문제에서 구하고자 하는 값은 $h'(-1)=f'(-1)g(-1)+f(-1)g'(-1)=27\times(-2)+(-20)\times3=-114$이다.
      source_flow: PDF p.13
      criteria:
      - 1.A3
