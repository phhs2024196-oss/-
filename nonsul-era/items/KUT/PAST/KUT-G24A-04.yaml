stimuli: []
stem: |
  다음 조건을 만족시키는 실수 $\alpha$, $\beta$의 값을 구하시오. (단, $\alpha<\beta$)
  (가) $0\le x\le\pi$일 때, 부등식 $\sin(x-\pi)>k$를 만족시키는 모든 $x$의 값의 범위가
  $0\le x<\alpha$ 또는 $\beta<x\le\pi$이다. (단, $-1<k<0$)
  (나) $\tan(\beta-\alpha)=\sqrt{3}$
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: alpha=pi/3; beta=2*pi/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $0\le x\le\pi$에서 함수 $y=\sin(x-\pi)$와 $y=k$ (단, $-1<k<0$)를 그래프로 나타내면, $y=\sin(x-\pi)$의 그래프는 $x=\dfrac\pi2$에서 최솟값 $-1$을 갖고 $x=\dfrac\pi2$에 대하여 대칭이며, $y=k$와 $x=\alpha$, $x=\beta$에서 만난다.
      source_flow: PDF p.15
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        위의 그래프로부터 $\dfrac{\alpha+\beta}2=\dfrac\pi2$, 즉 $\alpha+\beta=\pi$ … ㉠ 이다.
      source_flow: PDF p.15
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        또한 조건 (나)로부터 $\tan(\beta-\alpha)=\sqrt3$, 즉 $\beta-\alpha=\dfrac\pi3$ ($\because0<\beta-\alpha<\pi$) … ㉡ 이다.
      source_flow: PDF p.15
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        따라서 식 ㉠과 ㉡을 연립하면 $\alpha=\dfrac\pi3$, $\beta=\dfrac{2\pi}3$이다.
      source_flow: PDF p.15
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
