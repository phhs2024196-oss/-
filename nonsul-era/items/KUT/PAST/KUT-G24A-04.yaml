key_idea: $y=\sin(x-\pi)=-\sin x$의 그래프가 $x=\dfrac\pi2$에 대칭이므로 $\alpha+\beta=\pi$이고, $\tan(\beta-\alpha)=\sqrt3$에서 $\beta-\alpha=\dfrac\pi3$이다.
