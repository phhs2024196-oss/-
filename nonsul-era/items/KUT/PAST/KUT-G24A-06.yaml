stimuli: []
stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) 모든 실수 $x$에 대하여 $f(-x)=-f(x)$이다.
  (나) $x\ge0$일 때
  $$f(x)=\begin{cases}(x-1)^2+a&(0\le x\le1)\\ \dfrac{x^3-bx^2+cx-5}{x-1}&(x>1)\end{cases}$$
  이다. (단, $a$, $b$, $c$는 상수이다.)
  $f(3)$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '-7'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)로부터 $f(0)=0$이어야 한다. 즉, $a=-1$이다.
      source_flow: PDF p.21
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        한편, 함수 $f(x)$가 실수 전체의 집합에서 연속이므로 $x=1$에서도 연속이다. 따라서 (ⅰ) 극한값 $\lim_{x\to1}f(x)$가 존재하고, (ⅱ) $\lim_{x\to1+}f(x)=\lim_{x\to1-}f(x)=f(1)$ … ㉠ 이어야 한다.
      source_flow: PDF p.21
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        우선, $\lim_{x\to1+}f(x)=\lim_{x\to1+}\dfrac{x^3-bx^2+cx-5}{x-1}$의 값이 존재하기 위해서는 $x\to1+$일 때 (분자)$\to0$이어야 하므로 $1-b+c-5=0$, 즉 $c=b+4$ … ㉡ 이다.
      source_flow: PDF p.21
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $f(1)=a$이므로 식 ㉠으로부터 $\lim_{x\to1+}\dfrac{x^3-bx^2+(b+4)x-5}{x-1}=-1$ ($\because a=-1$, $c=b+4$), $\lim_{x\to1+}\dfrac{(x-1)\{x^2+(1-b)x+5\}}{x-1}=-1$, $1+(1-b)+5=-1$, 즉 $b=8$이다. 식 ㉡으로부터 $c=12$이므로, $x>1$일 때 $f(x)=\dfrac{x^3-8x^2+12x-5}{x-1}$이다.
      source_flow: PDF p.21
      criteria:
      - 1.M2
    - id: 1b-5
      content: |
        그러므로 문제에서 구하고자 하는 값은 $f(3)=\dfrac{27-72+36-5}2=-7$이다.
      source_flow: PDF p.21
      criteria:
      - 1.A3
