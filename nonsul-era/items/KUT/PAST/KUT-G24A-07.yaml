stimuli: []
stem: |
  양수 $a$에 대하여 함수 $f(x)=x^3+ax^2-3$이 다음 조건을 만족시킨다.
  열린구간 $(k,\ k+3)$에서 $k<x_1<x_2<k+3$인 임의의 두 실수 $x_1$, $x_2$에 대하여
  $f(x_1)>f(x_2)$이다. (단, $k$는 실수이다.)
  $f(1)$의 값이 최소가 되도록 하는 $a$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: 9/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=3x^2+2ax=x(3x+2a)$이고 $a>0$이므로 함수 $f(x)$는 열린구간 $\left(-\dfrac{2a}3,\ 0\right)$에서 감소한다.
      source_flow: PDF p.23
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        문제에서의 조건으로부터 실수 $k$는 $-\dfrac{2a}3\le k$이고 $k+3\le0$ … ㉠ 을 만족시켜야 한다.
      source_flow: PDF p.23
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서, 식 ㉠으로부터 $-\dfrac{2a}3\le-3$, 즉 $a\ge\dfrac92$ … ㉡ 이어야 한다.
      source_flow: PDF p.23
      criteria:
      - 1.A3
    - id: 1b-4
      content: |
        식 ㉡으로부터 $f(1)=a-2\ge\dfrac52$이므로, $f(1)$의 값이 최소가 되도록 하는 $a$의 값은 $\dfrac92$이다.
      source_flow: PDF p.23
      criteria:
      - 1.A3
