stimuli: []
stem: |
  다음 조건을 만족시키는 최고차항의 계수가 1인 모든 이차함수 $f(x)$에 대하여
  $$\int_{-2}^{1}f(x)\,dx$$
  의 최댓값과 최솟값의 합을 구하시오.
  (가) $f(2)-f(-2)=8$
  (나) $-2\le\int_0^2f(x)\,dx\le2$
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '-20'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        이차함수 $f(x)=x^2+ax+b$ (단, $a$, $b$는 실수)라 하자. 조건 (가)로부터 $f(2)-f(-2)=8$이므로 $(4+2a+b)-(4-2a+b)=8$, 즉 $a=2$이다. 따라서 $f(x)=x^2+2x+b$이고 $\int_0^2f(x)\,dx=\left[\dfrac13x^3+x^2+bx\right]_0^2=\dfrac83+4+2b$이다.
      source_flow: PDF p.26
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이므로 조건 (나)로부터 $-2\le\dfrac83+4+2b\le2$, 즉 $-\dfrac{13}3\le b\le-\dfrac73$ … ㉠ 이다.
      source_flow: PDF p.26
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        한편, $\int_{-2}^1f(x)\,dx=\left[\dfrac13x^3+x^2+bx\right]_{-2}^1=3b$이다.
      source_flow: PDF p.26
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        식 ㉠으로부터 $\int_{-2}^1f(x)\,dx$의 최댓값은 $3\times\left(-\dfrac73\right)=-7$이고 최솟값은 $3\times\left(-\dfrac{13}3\right)=-13$이다. 그러므로 문제에서 구하고자 하는 최댓값과 최솟값의 합은 $-20$이다.
      source_flow: PDF p.26
      criteria:
      - 1.A4
