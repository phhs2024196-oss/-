stimuli: []
stem: |
  첫째항이 1이고 공차가 3인 등차수열 $\{a_n\}$의 각 항을 원소로 갖는 집합을 $A$라 하고,
  첫째항이 2이고 공차가 4인 등차수열 $\{b_n\}$의 각 항을 원소로 갖는 집합을 $B$라 하자.
  다음 물음에 답하시오.
subparts:
- id: 9-1
  stem: |
    집합 $A\cap B$에 속하는 모든 원소를 작은 것부터 크기순으로 나열한 것을
    $c_1,c_2,c_3,\cdots$라 할 때, $\displaystyle\sum_{k=1}^{10}c_k$의 값을 구하시오. (6점)
  points: 6
  depends_on: []
  answer:
    kind: value
    value: '640'
    equivalents: []
    tolerance: null
  solutions:
  - id: S91-B
    audience: B
    method_no: 1
    steps:
    - id: 91b-1
      content: |
        등차수열 $\{a_n\}$의 일반항은 $a_n=3n-2$이므로 $A=\{1,4,7,10,13,16,19,22,25,\cdots\}$이다. 또한, 등차수열 $\{b_n\}$의 일반항은 $b_n=4n-2$이므로 $B=\{2,6,10,14,18,22,26,30,34,\cdots\}$이다.
      source_flow: PDF p.29
      criteria:
      - 9-1.M1
    - id: 91b-2
      content: |
        따라서 $A\cap B=\{10,22,34,\cdots\}$이다. 즉, $c_k=12k-2$이다.
      source_flow: PDF p.29
      criteria:
      - 9-1.M1
    - id: 91b-3
      content: |
        그러므로 $\displaystyle\sum_{k=1}^{10}c_k=\sum_{k=1}^{10}(12k-2)=12\times\dfrac{10\times11}2-20=640$이다.
      source_flow: PDF p.29
      criteria:
      - 9-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 9-1.M1
      mark_type: M
      points: 3
      evidence: $c_k=12k-2$임을 구했다.
      steps:
      - 91b-1
      - 91b-2
    - id: 9-1.A2
      mark_type: A
      points: 3
      evidence: $\displaystyle\sum_{k=1}^{10}c_k=640$임을 구했다.
      depends_on:
      - 9-1.M1
      steps:
      - 91b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 9-2
  stem: |
    집합 $A-B$에 속하는 모든 원소를 작은 것부터 크기순으로 나열한 것을
    $d_1,d_2,d_3,\cdots$라 할 때, $d_{100}+d_{200}+d_{300}$의 값을 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: d100=397; d200=796; d300=1195; sum=2388
    equivalents: []
    tolerance: null
  solutions:
  - id: S92-B
    audience: B
    method_no: 1
    steps:
    - id: 92b-1
      content: |
        집합 $A-B$의 원소는 수열 $\{a_n\}$의 각 항 중에서 4로 나눈 나머지가 2가 아닌 수이다. 즉, $A-B=\{1,4,7,13,16,19,25,28,31,37,\cdots\}$이다.
      source_flow: PDF p.29
      criteria:
      - 9-2.M1
    - id: 92b-2
      content: |
        이때, $d_1=1$, $d_4=13$, $d_7=25$, $\cdots$이므로 $d_{3k-2}=12k-11$이다. (단, $k$는 자연수) 이와 마찬가지로, $d_{3k-1}=12k-8$, $d_{3k}=12k-5$이고, 따라서,
      source_flow: PDF p.29
      criteria:
      - 9-2.M1
      - 9-2.M2
      - 9-2.M3
    - id: 92b-3
      content: |
        $d_{100}=d_{3\times34-2}=12\times34-11=397$
      source_flow: PDF p.29
      criteria:
      - 9-2.M1
    - id: 92b-4
      content: |
        $d_{200}=d_{3\times67-1}=12\times67-8=796$
      source_flow: PDF p.29
      criteria:
      - 9-2.M2
    - id: 92b-5
      content: |
        $d_{300}=d_{3\times100}=12\times100-5=1195$
      source_flow: PDF p.29
      criteria:
      - 9-2.M3
    - id: 92b-6
      content: |
        이다. 그러므로 문제에서 구하고자 하는 값은 $d_{100}+d_{200}+d_{300}=2388$이다.
      source_flow: PDF p.29
      criteria:
      - 9-2.A4
