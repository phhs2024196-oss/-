stimuli: []
stem: |
  $f(0)=0$이고 최고차항의 계수가 양수인 삼차함수 $y=f(x)$의 그래프가 직선 $y=\dfrac12x$와 제 1 사분면 위의
  점 A에서 접한다. 곡선 $y=f(x)$ 위의 점 중 A가 아닌 점을 B라 하면 두 점 A, B는 다음 조건을 만족시킨다.
  (가) $\overline{OB}=2\sqrt2$
  (나) 직선 OB가 $x$축의 양의 방향과 이루는 예각의 크기는 $\dfrac\pi4$이다.
  (다) 삼각형 AOB의 넓이는 2이다.
  다음 물음에 답하시오. (단, O는 원점이고, B는 제 1 사분면 위의 점이다.)
subparts:
- id: 10-1
  stem: |
    $f(1)$의 값을 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 13/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S101-B
    audience: B
    method_no: 1
    steps:
    - id: 101b-1
      content: |
        점 A의 $x$좌표를 $t$ ($t>0$)라 하면, $f(0)=0$을 만족시키는 삼차함수 $y=f(x)$의 그래프가 직선 $y=\dfrac12x$와 제 1 사분면 위의 점 A에서 접하므로 $f(x)-\dfrac12x=ax(x-t)^2$ (단, $a>0$)이다.
      source_flow: PDF p.32
      criteria:
      - 10-1.M1
    - id: 101b-2
      content: |
        한편, 조건 (가), (나)로부터 B의 좌표는 $(2,\ 2)$이다. 점 B는 곡선 $y=f(x)$ 위의 점이므로 $f(2)=2a(2-t)^2+1=2$ … ㉠ 이다.
      source_flow: PDF p.32
      criteria:
      - 10-1.M1
    - id: 101b-3
      content: |
        점 B에서 직선 $y=\dfrac12x$ (즉, $x-2y=0$)에 내린 수선의 발을 H라 하면 $\overline{BH}=\dfrac{|2-2\times2|}{\sqrt{1^2+(-2)^2}}=\dfrac2{\sqrt5}$이고, 조건 (다)로부터 $\dfrac12\times\sqrt{t^2+\left(\dfrac t2\right)^2}\times\dfrac2{\sqrt5}=2$, $\therefore t=4$ ($\because t>0$)이다.
      source_flow: PDF p.32
      criteria:
      - 10-1.M2
    - id: 101b-4
      content: |
        식 ㉠에 $t=4$를 대입하면 $a=\dfrac18$이고 $f(x)=\dfrac18x(x-4)^2+\dfrac12x=\dfrac18x^3-x^2+\dfrac52x$이다. 그러므로 문제에서 구하고자 하는 값은 $f(1)=\dfrac18-1+\dfrac52=\dfrac{13}8$이다.
      source_flow: PDF p.32
      criteria:
      - 10-1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 10-1.M1
      mark_type: M
      points: 3
      evidence: B의 좌표는 $(2,\ 2)$임을 구했다.
      steps:
      - 101b-1
      - 101b-2
    - id: 10-1.M2
      mark_type: M
      points: 3
      evidence: 점 A의 $x$좌표가 4임을 구했다.
      steps:
      - 101b-3
    - id: 10-1.A3
      mark_type: A
      points: 4
      evidence: $f(1)=\dfrac{13}8$임을 구했다.
      depends_on:
      - 10-1.M1
      - 10-1.M2
      steps:
      - 101b-4
