- id: 10-2
  stem: |
    $x$에 대한 방정식 $8f(x)-4x=k$의 서로 다른 실근의 개수가 3이 되도록 하는
    모든 실수 $k$의 값의 범위가 $\alpha<k<\beta$일 때, $\alpha+\beta$의 값을 구하시오.
    (단, $\alpha$, $\beta$는 상수이다.) (6점)
  points: 6
  depends_on:
  - 10-1
  answer:
    kind: value
    value: alpha=0; beta=256/27; alpha+beta=256/27
    equivalents: []
    tolerance: null
  solutions:
  - id: S102-B
    audience: B
    method_no: 1
    steps:
    - id: 102b-1
      content: |
        함수 $h(x)=8f(x)-4x$라 하면, $h(x)=x^3-8x^2+16x$이다.
      source_flow: PDF p.33
      criteria:
      - 10-2.M1
    - id: 102b-2
      content: |
        $h'(x)=3x^2-16x+16=(3x-4)(x-4)$이므로 함수 $h(x)$는 $x=\dfrac43$에서 극댓값 $\dfrac{256}{27}$, $x=4$에서 극솟값 $0$을 가진다. 함수 $h(x)$로부터 방정식 $h(x)=k$의 서로 다른 실근의 개수가 3이 되도록 하는 모든 실수 $k$의 값의 범위는 $0<k<\dfrac{256}{27}$이다.
      source_flow: PDF p.33
      criteria:
      - 10-2.M1
    - id: 102b-3
      content: |
        따라서, $\alpha=0$, $\beta=\dfrac{256}{27}$이고, 문제에서 구하고자 하는 값은 $\alpha+\beta=\dfrac{256}{27}$이다.
      source_flow: PDF p.33
      criteria:
      - 10-2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 10-2.M1
      mark_type: M
      points: 3
      evidence: $\alpha=0$ (또는 $\beta=\dfrac{256}{27}$)임을 구했다.
      steps:
      - 102b-1
      - 102b-2
    - id: 10-2.A2
      mark_type: A
      points: 3
      evidence: $\alpha+\beta=\dfrac{256}{27}$임을 구했다.
      depends_on:
      - 10-2.M1
      steps:
      - 102b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
