    steps:
    - id: 1b-1
      content: |
        $3^x=6$이므로 $x=\log_3 6$이다.
      source_flow: PDF p.35
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서, 문제에서 구하고자 하는 값은 $6x-2y=\log_3 6^6-\log_3 8^2=\log_3\left(\dfrac{6^6}{8^2}\right)=\log_3\left(\dfrac{3^6\times2^6}{2^6}\right)=\log_3 3^6=6$이다.
      source_flow: PDF p.35
      criteria:
      - 1.A2
