stimuli: []
stem: |
  함수 $f(x)=a^{2x+1}+b$가 닫힌구간 $[-2,\ 1]$에서 최댓값 5, 최솟값 $\dfrac72$을 가질 때, $a^3b$의 값을 구하시오.
  (단, $a$, $b$는 상수이고, $0<a<1$이다.)
subparts:
- id: '1'
  stem: ''
  points: 4
  depends_on: []
  answer:
    kind: value
    value: 3/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=a(a^2)^x+b$이고 $0<a^2<1$이므로, 닫힌구간 $[-2,\ 1]$에서 함수 $f(x)$의 최댓값은 $f(-2)$이고 최솟값은 $f(1)$이다.
      source_flow: PDF p.37
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서, 문제로부터 최댓값이 5이므로 $a^{-3}+b=5$ … ㉠ 이고, 최솟값이 $\dfrac72$이므로 $a^3+b=\dfrac72$ … ㉡ 이다. $A=a^3$이라 하면, 식 ㉠과 ㉡은 $\dfrac1A+b=5$, $A+b=\dfrac72$이고, 두 식을 빼면 $\dfrac1A-A=\dfrac32$ … ㉢ 이다.
      source_flow: PDF p.37
      criteria:
      - 1.A2
    - id: 1b-3
      content: |
        따라서, 식 ㉢으로부터 $A=\dfrac12$ ($\because A=a^3>0$)이고 $b=3$이다. 그러므로 문제에서 구하고자 하는 값은 $a^3b=Ab=\dfrac32$이다.
      source_flow: PDF p.37
      criteria:
      - 1.A2
