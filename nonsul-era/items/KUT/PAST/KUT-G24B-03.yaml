stimuli: []
stem: |
  삼차함수 $f(x)$가
  $$\lim_{x\to0}\frac{f(x)}{x}=-6,\quad\lim_{x\to3}\frac{f(x)}{x-3}=24$$
  를 만족시킬 때, $\displaystyle\lim_{x\to1}\frac{f(x)}{2x^2+3x+1}$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: -4/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\lim_{x\to0}\dfrac{f(x)}x$와 $\lim_{x\to3}\dfrac{f(x)}{x-3}$의 값이 존재하기 위해서는 $f(0)=0$이고 $f(3)=0$이므로 $f(x)=x(x-3)(ax+b)$ (단, $a$, $b$는 상수)이다.
      source_flow: PDF p.40
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이를 문제에서 주어진 식에 대입하면 $\lim_{x\to0}\dfrac{f(x)}x=\lim_{x\to0}(x-3)(ax+b)=-3b=-6$, $\therefore b=2$이고 $\lim_{x\to3}\dfrac{f(x)}{x-3}=\lim_{x\to3}x(ax+b)=3(3a+b)=24$, $\therefore a=2$이다.
      source_flow: PDF p.40
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $f(x)=2x(x-3)(x+1)$이므로, 문제에서 구하고자 하는 값은 $\lim_{x\to1}\dfrac{f(x)}{2x^2+3x+1}=\dfrac{f(1)}6=-\dfrac43$이다.
      source_flow: PDF p.40
      criteria:
      - 1.A3
