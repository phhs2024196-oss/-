stimuli: []
stem: |
  최고차항의 계수가 1인 다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$f(x)f'(x)-f(x)+xf'(x)=2x^3+13x^2+22x+9$$
  를 만족시킬 때, $f(2)$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '15'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)f'(x)-f(x)+xf'(x)=f(x)\{f'(x)-1\}+x\{f'(x)-1\}+x=\{f(x)+x\}\{f'(x)-1\}+x$이므로, 함수 $f(x)$는 $\{f(x)+x\}\{f'(x)-1\}=2x^3+13x^2+21x+9$ … ㉠ 를 만족시킨다.
      source_flow: PDF p.42
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        식 ㉠으로부터 $f(x)$는 이차함수이고, $f(x)$의 최고차항의 계수가 1이므로 $f(x)=x^2+ax+b$라 하자. (단, $a$, $b$는 상수)
      source_flow: PDF p.42
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $f'(x)=2x+a$이므로, 식 ㉠을 정리하면 $\{x^2+(a+1)x+b\}\{2x+(a-1)\}=2x^3+13x^2+21x+9$, $2x^3+(3a+1)x^2+(a^2+2b-1)x+b(a-1)=2x^3+13x^2+21x+9$이다. 계수비교법에 의해 $3a+1=13$, $a^2+2b-1=21$, $b(a-1)=9$이어야 하므로 $a=4$, $b=3$이다. 따라서, $f(x)=x^2+4x+3$이다.
      source_flow: PDF p.42
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        그러므로 문제에서 구하고자 하는 값은 $f(2)=15$이다.
      source_flow: PDF p.42
      criteria:
      - 1.A3
