stimuli: []
stem: |
  한 변의 길이가 9인 정육각형 ABCDEF에 대하여 다섯 꼭짓점 A, B, C, D, E를 각각 중심으로 하는
  다섯 부채꼴 APQ, BQR, CRS, DST, ETU가 모두 정육각형 ABCDEF의 내부에 있다.
  다섯 호 PQ, QR, RS, ST, TU의 길이의 합이 $\dfrac{41}3\pi$일 때, 부채꼴 CRS의 넓이를 구하시오.
  (단, 여섯 점 P, Q, R, S, T, U는 각각 선분 FA, AB, BC, CD, DE, EF 위에 있다.)
  [그림 1: 정육각형 ABCDEF의 꼭짓점 A, B, C, D, E를 중심으로 하는 다섯 부채꼴 APQ, BQR, CRS, DST, ETU를 그린 그림]
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 25*pi/12
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overline{AP}=x$ ($0<x<9$)라 하면, 정육각형 ABCDEF의 한 변의 길이가 9이므로 다섯 부채꼴 APQ, BQR, CRS, DST, ETU의 반지름의 길이는 각각 $x$, $9-x$, $x$, $9-x$, $x$가 된다.
      source_flow: PDF p.45
      criteria:
      - 1.M2
    - id: 1b-2
      content: |
        또한, 각 부채꼴의 중심각의 크기는 모두 $\dfrac{2\pi}3$이므로, 다섯 호 PQ, QR, RS, ST, TU의 길이는 각각 $\dfrac13\times2\pi x$, $\dfrac13\times2\pi(9-x)$, $\dfrac13\times2\pi x$, $\dfrac13\times2\pi(9-x)$, $\dfrac13\times2\pi x$이다.
      source_flow: PDF p.45
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        따라서, 모든 호의 길이의 합이 $\dfrac{41}3\pi$이므로 $2\pi x+\dfrac23\times2\pi(9-x)=\dfrac{41}3\pi$, $2\pi\left(\dfrac13x+6\right)=\dfrac{41}3\pi$, $\therefore x=\dfrac52$이다.
      source_flow: PDF p.45
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        이다. 문제에서 구하고자 하는 부채꼴 CRS의 넓이는 $\dfrac13\times\pi x^2=\dfrac{25}{12}\pi$이다.
      source_flow: PDF p.45
      criteria:
      - 1.A3
