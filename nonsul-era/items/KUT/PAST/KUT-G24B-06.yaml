stimuli: []
stem: |
  최고차항의 계수가 1인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) $f(-1)=0$
  (나) 함수 $g(x)=\begin{cases}\dfrac1{x-2}&(x\ne2)\\ 5&(x=2)\end{cases}$
  에 대하여 함수 $f(x)g(x)$가 $x=2$에서 연속이다.
  $f(3)$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼차함수 $f(x)$에 대하여 함수 $f(x)g(x)$가 $x=2$에서 연속이므로 (ⅰ) 극한값 $\lim_{x\to2}f(x)g(x)$가 존재하고, (ⅱ) $\lim_{x\to2}f(x)g(x)=f(2)g(2)$ … ㉠ 이어야 한다.
      source_flow: PDF p.48
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        우선, $\lim_{x\to2}f(x)g(x)=\lim_{x\to2}\dfrac{f(x)}{x-2}$의 값이 존재하기 위해서는 $f(2)=0$이어야 한다.
      source_flow: PDF p.48
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        이 조건과 $f(-1)=0$, 그리고 삼차함수 $f(x)$의 최고차항의 계수가 1이라는 조건으로부터 $f(x)=(x+1)(x-2)(x+a)$ (단, $a$는 상수)이다.
      source_flow: PDF p.48
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $f(2)g(2)=0\times5=0$이므로, 식 ㉠으로부터 $\lim_{x\to2}\dfrac{(x+1)(x-2)(x+a)}{x-2}=0$, $\lim_{x\to2}(x+1)(x+a)=0$, $3(2+a)=0$, $\therefore a=-2$이다.
      source_flow: PDF p.48
      criteria:
      - 1.A3
    - id: 1b-5
      content: |
        이다. $f(x)=(x+1)(x-2)^2$이므로 문제에서 구하고자 하는 값은 $f(3)=4$이다.
      source_flow: PDF p.48
      criteria:
      - 1.A4
