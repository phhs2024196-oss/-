stimuli: []
stem: |
  자연수 $n$에 대하여 닫힌구간 $[-2,\ n]$에서 정의된 함수 $f(x)=\dfrac12x^3-ax+1$이 있다. 다음 조건을 만족시키는
  모든 자연수 $n$의 값의 합을 구하시오. (단, $a$는 상수이다.)
  (가) 임의의 두 실수 $x_1$, $x_2$에 대하여 $-2<x_1<x_2<n$이면 $f(x_1)>f(x_2)$이다.
  (나) 닫힌구간 $[-2,\ n]$에서 함수 $f(x)$의 최댓값은 48이다.
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '10'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$는 닫힌구간 $[-2,\ n]$에서 연속이고, 조건 (가)로부터 함수 $f(x)$는 열린구간 $(-2,\ n)$에서 감소하므로, 닫힌구간 $[-2,\ n]$에서 함수 $f(x)$는 $x=-2$일 때 최댓값을 갖는다. 따라서, 조건 (나)로부터 $f(-2)=48$, $2a-3=48$, $\therefore a=\dfrac{51}2$이다.
      source_flow: PDF p.50
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이다. $f'(x)=\dfrac32x^2-\dfrac{51}2=\dfrac32(x-\sqrt{17})(x+\sqrt{17})$이므로 함수 $f(x)$는 열린구간 $(-\sqrt{17},\ \sqrt{17})$에서 감소하고, 조건 (가)를 만족시키기 위해서는 $n\le\sqrt{17}$이어야 한다.
      source_flow: PDF p.50
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        그러므로, 문제에서의 조건을 만족시키는 모든 자연수 $n$의 값의 합은 $1+2+3+4=10$이다.
      source_flow: PDF p.50
      criteria:
      - 1.A3
