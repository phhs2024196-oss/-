  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 $f(x)+f(-x)+g(x)+g(-x)=2x^2$이므로, 계수비교법에 의하면 $-8x^2+2bx^2=2x^2$, $\therefore b=5$이다.
      source_flow: PDF p.53
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이다. 따라서, $g(x)=x^3+5x^2+2x$이므로, 조건 (나)로부터 $\displaystyle\int_{-1}^1\{(3x^2-8x+a)+x(3x^2+10x+2)\}dx=\dfrac{38}3$, $2\displaystyle\int_0^1(13x^2+a)dx=\dfrac{38}3$, $2\left(\dfrac{13}3+a\right)=\dfrac{38}3$, $\therefore a=2$이다.
      source_flow: PDF p.53
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        이다. $f(x)=x^3-4x^2+2x$, $g(x)=x^3+5x^2+2x$이므로, 문제에서 구하고자 하는 값은 $\displaystyle\int_{-1}^1\{xf(x)+g(x)\}dx=\int_{-1}^1\{x(x^3-4x^2+2x)+(x^3+5x^2+2x)\}dx=2\int_0^1(x^4+7x^2)dx=2\left[\dfrac15x^5+\dfrac73x^3\right]_0^1=\dfrac{76}{15}$이다.
      source_flow: PDF p.53
      criteria:
      - 1.A3
