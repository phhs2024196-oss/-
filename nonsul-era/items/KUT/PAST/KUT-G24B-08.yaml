stimuli: []
stem: |
  두 함수 $f(x)=x^3-4x^2+ax$, $g(x)=x^3+bx^2+2x$가 다음 조건을 만족시킨다.
  (가) 모든 실수 $x$에 대하여 $f(x)+f(-x)+g(x)+g(-x)=2x^2$이다.
  (나) $\displaystyle\int_{-1}^{1}\{f'(x)+xg'(x)\}dx=\dfrac{38}3$
  $\displaystyle\int_{-1}^{1}\{xf(x)+g(x)\}dx$의 값을 구하시오. (단, $a$, $b$는 상수이다.)
subparts:
- id: '1'
  stem: ''
