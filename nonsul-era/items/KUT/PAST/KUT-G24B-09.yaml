stimuli: []
stem: |
  모든 항이 자연수인 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
  $$a_{n+1}=\begin{cases}a_n+7&(a_n\text{이 홀수인 경우})\\ \dfrac{a_n}2+5&(a_n\text{이 짝수인 경우})\end{cases}$$
  를 만족시킨다. $a_4=20$일 때, 다음 물음에 답하시오.
subparts:
- id: 9-1
  stem: |
    $a_{23}$의 값을 구하시오. (5점)
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '13'
    equivalents: []
    tolerance: null
  solutions:
  - id: S91-B
    audience: B
    method_no: 1
    steps:
    - id: 91b-1
      content: |
        $a_4=20$이므로, $a_5$부터 순서대로 구하면 $a_5=\dfrac{20}2+5=15$, $a_6=15+7=22$, $a_7=\dfrac{22}2+5=16$, $a_8=\dfrac{16}2+5=13$, $a_9=13+7=20=a_4$, $a_{10}=\dfrac{20}2+5=15=a_5$, $\vdots$
      source_flow: PDF p.56
      criteria:
      - 9-1.M1
    - id: 91b-2
      content: |
        이다. 따라서, $a_{23}=a_{18}=a_{13}=a_8=13$이다.
      source_flow: PDF p.56
      criteria:
      - 9-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 9-1.M1
      mark_type: M
      points: 2
      evidence: $a_5=15$, $a_6=22$, $a_7=16$, $a_8=13$, $a_9=20$임을 구했다.
      steps:
      - 91b-1
    - id: 9-1.A2
      mark_type: A
      points: 3
      evidence: $a_{23}=13$임을 구했다.
      depends_on:
      - 9-1.M1
      steps:
      - 91b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 9-2
  stem: |
    $\displaystyle\sum_{k=1}^{3}a_k$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M+m$의 값을 구하시오. (11점)
  points: 11
  depends_on: []
  answer:
    kind: value
    value: M=170; m=38; M+m=208
    equivalents: []
    tolerance: null
  solutions:
  - id: S92-B
    audience: B
    method_no: 1
    steps:
    - id: 92b-1
      content: |
        (ⅰ) 만약 $a_3$이 홀수라면, $a_4=20$이므로 $a_3+7=20$, $\therefore a_3=13$이다. 또한, $a_2$가 홀수라면 $a_3=13$이므로 $a_2+7=13$, 즉 $a_2=6$이어야 한다. 이는 $a_2$가 홀수라는 사실에 모순이므로 $a_2$는 짝수이어야 한다. 따라서, $a_3=13$으로부터 $\dfrac{a_2}2+5=13$, $\therefore a_2=16$이다.
      source_flow: PDF p.56
      criteria:
      - 9-2.M2
    - id: 92b-2
      content: |
        위와 비슷한 방법으로 $a_1$을 구하면 $a_1=9$ ($a_1$이 홀수인 경우), $a_1=22$ ($a_1$이 짝수인 경우)이다. 따라서, (ⅰ)에서 만족하는 순서쌍 $(a_1,\ a_2,\ a_3)$은 $(9,\ 16,\ 13)$, $(22,\ 16,\ 13)$이다.
      source_flow: PDF p.56
      criteria:
      - 9-2.M2
    - id: 92b-3
      content: |
        (ⅱ) 만약 $a_3$이 짝수라면, $a_4=20$이므로 $\dfrac{a_3}2+5=20$, $\therefore a_3=30$이다. (ⅱ-1) 만약 $a_2$가 홀수라면, $a_3=30$이므로 $a_2+7=30$, $\therefore a_2=23$이다. 또한, $a_1$이 홀수라면 $a_2=23$이므로 $a_1+7=23$, 즉 $a_1=16$이어야 한다. 이는 $a_1$이 홀수라는 사실에 모순이므로 $a_1$은 짝수이어야 한다. 따라서, $a_2=23$으로부터 $\dfrac{a_1}2+5=23$, $\therefore a_1=36$이다.
      source_flow: PDF p.57
      criteria:
      - 9-2.M1
    - id: 92b-4
      content: |
        (ⅱ-2) 만약 $a_2$가 짝수라면, $a_3=30$이므로 $\dfrac{a_2}2+5=30$, $\therefore a_2=50$이다. 위와 비슷한 방법으로 $a_1$을 구하면 $a_1=43$ ($a_1$이 홀수인 경우), $a_1=90$ ($a_1$이 짝수인 경우)이다. 따라서, (ⅱ)에서 만족하는 순서쌍 $(a_1,\ a_2,\ a_3)$은 $(36,\ 23,\ 30)$, $(43,\ 50,\ 30)$, $(90,\ 50,\ 30)$이다.
      source_flow: PDF p.57
      criteria:
      - 9-2.M1
    - id: 92b-5
      content: |
        (ⅰ), (ⅱ)에서 만족하는 순서쌍 $(a_1,\ a_2,\ a_3)$으로부터 $\displaystyle\sum_{k=1}^3a_k$의 최댓값과 최솟값을 구하면 최댓값 $M=90+50+30=170$, 최솟값 $m=9+16+13=38$이다.
      source_flow: PDF p.57
      criteria:
      - 9-2.M1
      - 9-2.M2
    - id: 92b-6
      content: |
        이다. 그러므로, 문제에서 구하고자 하는 값은 $M+m=170+38=208$이다.
      source_flow: PDF p.57
      criteria:
      - 9-2.A3
