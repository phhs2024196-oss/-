- id: 10-2
  stem: |
    함수 $h(x)=f(x)+2x$의 극댓값을 $\alpha$, 극솟값을 $\beta$라 할 때, $\alpha+\beta$의 값을 구하시오. (6점)
  points: 6
  depends_on:
  - 10-1
  answer:
    kind: value
    value: alpha=16; beta=12; alpha+beta=28
    equivalents: []
    tolerance: null
  solutions:
  - id: S102-B
    audience: B
    method_no: 1
    steps:
    - id: 102b-1
      content: |
        함수 $h(x)=f(x)+2x=x^3-6x^2+9x+12$이므로 $h'(x)=3x^2-12x+9=3(x-1)(x-3)$이다.
      source_flow: PDF p.61
      criteria:
      - 10-2.M1
    - id: 102b-2
      content: |
        따라서, 함수 $h(x)$는 $x=1$에서 극댓값 $\alpha=h(1)=16$, $x=3$에서 극솟값 $\beta=h(3)=12$를 가진다.
      source_flow: PDF p.61
      criteria:
      - 10-2.M2
      - 10-2.M3
    - id: 102b-3
      content: |
        그러므로, 문제에서 구하고자 하는 값은 $\alpha+\beta=16+12=28$이다.
      source_flow: PDF p.61
      criteria:
      - 10-2.A4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
