stimuli: []
stem: |
  최고차항의 계수가 1인 삼차함수 $f(x)$와 그 도함수 $f'(x)$에 대하여 함수
  $$g(x)=\begin{cases}\dfrac{f'(x+1)-f'(x-3)}{x-3}&(x<3)\\ xf(x)+6&(x\ge3)\end{cases}$$
  가 $x=3$에서 미분가능할 때, 다음 물음에 답하시오.
subparts:
- id: 10-1
  stem: |
    $f(1)$의 값을 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '14'
    equivalents: []
    tolerance: null
  solutions:
  - id: S101-B
    audience: B
    method_no: 1
    steps:
    - id: 101b-1
      content: |
        최고차항의 계수가 1인 삼차함수 $f(x)$를 $f(x)=x^3+ax^2+bx+c$ (단, $a$, $b$, $c$는 상수)라 하면 $f'(x)=3x^2+2ax+b$이다. 함수 $g(x)$가 $x=3$에서 미분가능하면 $x=3$에서 연속이므로 (ⅰ) 극한값 $\lim_{x\to3}g(x)$가 존재하고, (ⅱ) $\lim_{x\to3-}g(x)=\lim_{x\to3+}g(x)=g(3)$ … ㉠ 이어야 한다.
      source_flow: PDF p.60
      criteria:
      - 10-1.M1
    - id: 101b-2
      content: |
        우선, $\lim_{x\to3-}g(x)=\lim_{x\to3-}\dfrac{f'(x+1)-f'(x-3)}{x-3}$의 값이 존재하기 위해서는 $x\to3-$일 때 (분자)$\to0$이어야 하므로 $f'(4)-f'(0)=0$, $(48+8a+b)-b=0$, $\therefore a=-6$이다. 따라서, $f'(x)=3x^2-12x+b$이므로 $f'(x+1)-f'(x-3)=24(x-3)$이고 $\lim_{x\to3-}g(x)=\lim_{x\to3-}\dfrac{24(x-3)}{x-3}=24$이다.
      source_flow: PDF p.60
      criteria:
      - 10-1.M1
    - id: 101b-3
      content: |
        한편, $f(x)=x^3-6x^2+bx+c$이므로 $f(3)=3b+c-27$이고, 식 ㉠으로부터 $24=3f(3)+6$, $24=3(3b+c-27)+6$, $\therefore 3b+c=33$ … ㉡ 이다.
      source_flow: PDF p.60
      criteria:
      - 10-1.M2
    - id: 101b-4
      content: |
        함수 $g(x)$는 $x=3$에서 미분가능해야 하므로 $\displaystyle\lim_{x\to3-}\dfrac{g(x)-g(3)}{x-3}=\lim_{x\to3+}\dfrac{g(x)-g(3)}{x-3}$ … ㉢ 이어야 한다. 식 ㉢의 좌변과 우변을 각각 구하면, $x<3$일 때 $g(x)=24$이므로 (좌변)$=\displaystyle\lim_{x\to3-}\dfrac{24-24}{x-3}=0$이고, $x\ge3$일 때 $g(x)=xf(x)+6$이므로 (우변)$=\displaystyle\lim_{x\to3+}\dfrac{xf(x)+6-\{3f(3)+6\}}{x-3}=\lim_{x\to3+}\dfrac{(x-3)f(x)+3\{f(x)-f(3)\}}{x-3}=\lim_{x\to3+}f(x)+3\lim_{x\to3+}\dfrac{f(x)-f(3)}{x-3}=f(3)+3f'(3)$이다.
      source_flow: PDF p.60
      criteria:
      - 10-1.M2
    - id: 101b-5
      content: |
        이다. 한편, 식 ㉡으로부터 $f(3)=3b+c-27=6$이고, $f'(3)=27-36+b=b-9$이므로 $f(3)+3f'(3)=6+3(b-9)=3b-21$이다. 따라서, 식 ㉢으로부터 $0=3b-21$, $\therefore b=7$이고, 이를 식 ㉡에 대입하면 $c=12$이다. $a=-6$, $b=7$, $c=12$이므로 $f(x)=x^3-6x^2+7x+12$이다.
      source_flow: PDF p.61
      criteria:
      - 10-1.M2
    - id: 101b-6
      content: |
        이고, 문제에서 구하고자 하는 값은 $f(1)=1-6+7+12=14$이다.
      source_flow: PDF p.61
      criteria:
      - 10-1.A3
