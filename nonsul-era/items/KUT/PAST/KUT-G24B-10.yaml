    - id: 10-2.M2
      mark_type: M
      points: 2
      evidence: 극댓값 $\alpha=16$임을 구했다.
      steps:
      - 102b-2
    - id: 10-2.M3
      mark_type: M
      points: 2
      evidence: 극솟값 $\beta=12$임을 구했다.
      steps:
      - 102b-2
    - id: 10-2.A4
      mark_type: A
      points: 1
      evidence: $\alpha+\beta=28$임을 구했다.
      depends_on:
      - 10-2.M1
      - 10-2.M2
      - 10-2.M3
      steps:
      - 102b-3
