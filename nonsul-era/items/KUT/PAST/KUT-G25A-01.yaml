stimuli: []
stem: |
  양수 $a$, $b$, $c$에 대하여 $a^2=5$, $b^4=7$, $c^9=13$일 때, $(abc)^n$이 자연수가 되도록 하는 자연수 $n$의 최솟값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '36'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a^2=5$에서 $a=5^{\frac{1}{2}}$, $b^4=7$에서 $b=7^{\frac{1}{4}}$, $c^9=13$에서 $c=13^{\frac{1}{9}}$이므로
        $$(abc)^n=5^{\frac{n}{2}}\times7^{\frac{n}{4}}\times13^{\frac{n}{9}}$$이다.
      source_flow: PDF p.29
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $(abc)^n$이 자연수가 되기 위해서는 자연수 $n$이 2, 4, 9의 공배수여야 한다. 따라서 $n$의 최솟값은 2, 4, 9의 최소공배수인 36이다.
      source_flow: PDF p.29
      criteria:
      - 1.A1
