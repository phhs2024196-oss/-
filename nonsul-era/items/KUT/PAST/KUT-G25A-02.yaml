  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 직선 $y=(\log_3 2)x$, $y=(\log_4 a)x$가 서로 수직이므로
        $$\log_3 2\times\log_4 a=-1$$이다.
      source_flow: PDF p.31
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        밑의 변환으로 $\log_3 2\times\dfrac{\log_3 a}{\log_3 4}=-1$, 즉 $\log_3 2\times\dfrac{\log_3 a}{2\log_3 2}=-1$이므로 $\log_3 a=-2$이다. 따라서 $a=\dfrac{1}{9}$이다.
      source_flow: PDF p.31
      criteria:
      - 1.A1
