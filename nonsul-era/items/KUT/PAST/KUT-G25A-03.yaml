stimuli: []
stem: |
  함수
  $$f(x)=\begin{cases}ax+b & (x<2)\\ x^3 & (x\ge2)\end{cases}$$
  가 $x=2$에서 미분가능할 때, $a-b$의 값을 구하시오.
subparts:
