    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$는 $x=2$에서 연속이므로 $f(2)=\lim_{x\to2-}f(x)=\lim_{x\to2+}f(x)$가 성립한다. 따라서 $b=8-2a$ ····· ㉠ 이다.
      source_flow: PDF p.33~34
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x=2$에서 미분계수가 존재하므로 $\lim_{x\to2-}\dfrac{f(x)-f(2)}{x-2}=\lim_{x\to2+}\dfrac{f(x)-f(2)}{x-2}$이고, 즉 $\lim_{x\to2-}\dfrac{(ax+b)-8}{x-2}=\lim_{x\to2+}\dfrac{x^3-8}{x-2}$에 ㉠을 대입하면
        $$\lim_{x\to2-}\dfrac{ax-2a}{x-2}=\lim_{x\to2-}\dfrac{a(x-2)}{x-2}=\lim_{x\to2+}\dfrac{(x-2)(x^2+2x+4)}{x-2}$$이고, $a=\lim_{x\to2+}(x^2+2x+4)=4+4+4=12$이다.
      source_flow: PDF p.33~34
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        이 값을 ㉠에 대입하면 $b=8-24=-16$을 얻는다. 따라서 $a-b=12+16=28$이다.
      source_flow: PDF p.33~34
      criteria:
      - 1.A1
