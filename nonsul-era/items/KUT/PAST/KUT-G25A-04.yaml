stimuli: []
stem: |
  함수 $f(x)=4+a\tan\left(\dfrac{3}{2}x\right)$가 닫힌구간 $\left[b,\ \dfrac{2\pi}{9}\right]$에서 최댓값 7, 최솟값 1을 가질 때, $a$와 $b$의 값을 각각 구하시오. (단, $a$, $b$는 상수이고, $a>0$이다.)
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: a = sqrt(3); b = -2*pi/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=4+a\tan\left(\dfrac{3}{2}x\right)$의 그래프의 주기는 $\dfrac{2\pi}{3}$이다. 함수 $f(x)$가 닫힌구간 $\left[b,\ \dfrac{2\pi}{9}\right]$에서 최댓값과 최솟값을 가지므로 $-\dfrac{\pi}{3}<b<\dfrac{2\pi}{9}$이다. 한편, 함수 $f(x)$의 그래프는 닫힌구간 $\left[b,\ \dfrac{2\pi}{9}\right]$에서 증가한다. 따라서 함수 $f(x)$는 $x=\dfrac{2\pi}{9}$일 때 최댓값이 7이고, $x=b$일 때 최솟값이 1이다.
      source_flow: PDF p.36~37
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f\left(\dfrac{2\pi}{9}\right)=4+a\tan\dfrac{\pi}{3}=4+\sqrt{3}a=7$에서 $a=\sqrt{3}$이므로 $f(x)=4+\sqrt{3}\tan\left(\dfrac{3}{2}x\right)$이다.
      source_flow: PDF p.36~37
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $f(b)=4+\sqrt{3}\tan\dfrac{3b}{2}=1$에서 $\tan\dfrac{3b}{2}=-\sqrt{3}$ ····· ㉠ 이 성립한다. 이때 $-\dfrac{\pi}{3}<b<\dfrac{2\pi}{9}$이므로 $-\dfrac{\pi}{2}<\dfrac{3b}{2}<\dfrac{\pi}{3}$ ····· ㉡ 이다. ㉠, ㉡으로부터 $\dfrac{3b}{2}=-\dfrac{\pi}{3}$이므로 $b=-\dfrac{2\pi}{9}$이다.
      source_flow: PDF p.36~37
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
