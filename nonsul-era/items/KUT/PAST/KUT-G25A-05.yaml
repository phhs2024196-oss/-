stimuli: []
stem: |
  삼차함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) $\lim_{x\to0}\dfrac{f(x)}{x}=-12$
  (나) 함수 $y=f'(x)$의 그래프는 점 $(2,\ 0)$에서 $x$축에 접한다.
  $f(2)$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '-8'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=ax^3+bx^2+cx+d$라 하자. 조건 (가)로부터 $f(0)=0$이므로 $d=0$이다.
      source_flow: PDF p.39~40
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        그러므로 $\lim_{x\to0}\dfrac{f(x)}{x}=\lim_{x\to0}\dfrac{f(x)-f(0)}{x-0}=f'(0)$이고, 따라서 $f'(0)=-12$ ····· ㉠ 이다.
      source_flow: PDF p.39~40
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $f'(x)=3ax^2+2bx+c$이므로 조건 (나)로부터 $3ax^2+2bx+c=3a(x-2)^2$ ····· ㉡ 이다. ㉠으로부터 $3a(0-2)^2=-12$이고 $a=-1$이다. ㉡으로부터 $b=6$, $c=-12$이다.
      source_flow: PDF p.39~40
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        그러므로 $f(x)=-x^3+6x^2-12x$이고, $f(2)=-8$이다.
      source_flow: PDF p.39~40
      criteria:
      - 1.A1
