stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$\int_0^x(2t^4+at^2+bt)\,dt=\int_0^x(2t+f(t))\,dt+x^3+a$$
  를 만족시킨다. $f(1)=-2$일 때, $\int_0^1f(x)\,dx$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
