    value: -11/10
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 식 $\int_0^x(2t^4+at^2+bt)\,dt=\int_0^x(2t+f(t))\,dt+x^3+a$ ····· ㉠ 의 양변에 $x=0$을 대입하면 $\int_0^0(2t^4+at^2+bt)\,dt=\int_0^0(2t+f(t))\,dt+0^3+a$이므로 $a=0$이다.
      source_flow: PDF p.42~43
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ㉠의 양변을 $x$에 대하여 미분하면 $2x^4+bx=2x+f(x)+3x^2$이므로 $f(x)=2x^4-3x^2+(b-2)x$이다. $f(1)=2-3+(b-2)=-2$이므로 $b=1$이고 $f(x)=2x^4-3x^2-x$이다.
      source_flow: PDF p.42~43
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 $\int_0^1f(x)\,dx=\int_0^1(2x^4-3x^2-x)\,dx=\left[\dfrac{2}{5}x^5-x^3-\dfrac{1}{2}x^2\right]_0^1=-\dfrac{11}{10}$이다.
      source_flow: PDF p.42~43
      criteria:
      - 1.A1
