stimuli: []
stem: |
  삼차함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) 집합 $\{-2,\ -1,\ 1\}$의 모든 원소 $a$에 대하여 $\lim_{x\to a}\dfrac{xf(x)-a}{x-a}$의 값이 존재한다.
  (나) $\lim_{x\to2}\dfrac{f(x)}{x-1}=25$
  $f(3)$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '81'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)로부터 $x\to a$일 때, $(x-a)\to0$이므로 $x\to a$일 때, $(xf(x)-a)\to0$이다. 즉, $af(a)-a=0$이다. $a\ne0$이므로 $f(a)-1=0$이다.
      source_flow: PDF p.45~46
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        그러므로 $f(x)-1=k(x+2)(x+1)(x-1)$ ($k$는 상수, $k\ne0$)이다. 즉, $f(x)=k(x+2)(x+1)(x-1)+1$이다.
      source_flow: PDF p.45~46
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        조건 (나)로부터 $\lim_{x\to2}\dfrac{k(x+2)(x+1)(x-1)+1}{x-1}=25$, $k\times4\times3\times1+1=25$, $k=2$이다.
      source_flow: PDF p.45~46
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        그러므로 $f(x)=2(x+2)(x+1)(x-1)+1$이고, $f(3)=2\times5\times4\times2+1=81$이다.
      source_flow: PDF p.45~46
      criteria:
      - 1.A1
