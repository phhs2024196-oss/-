stimuli: []
stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$는 모든 실수 $x$에 대하여
  $$(f(x))^3-3(f(x))^2-4x^2f(x)+12x^2=0$$
  을 만족시킨다. 함수 $f(x)$의 최댓값이 3이고 최솟값이 0일 때, $f(-1)+f(0)+f\left(\dfrac{11}{4}\right)$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $(f(x))^3-3(f(x))^2-4x^2f(x)+12x^2=0$에서 $(f(x))^2(f(x)-3)-4x^2(f(x)-3)=(f(x)-3)(f(x)-2x)(f(x)+2x)=0$을 얻을 수 있다. 따라서 $f(x)=3$ 또는 $f(x)=2x$ 또는 $f(x)=-2x$이다.
      source_flow: PDF p.48~50
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        위 식으로부터 $f(0)=3$ 또는 $f(0)=0$이 성립한다.
        (i) $f(0)=3$인 경우: 함수 $f(x)$가 실수 전체의 집합에서 연속이고 최댓값이 3이므로 $f(x)=3$이 된다. 그러나 최솟값이 0이 아니므로 주어진 조건을 만족시키지 못한다.
      source_flow: PDF p.48~50
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        (ii) $f(0)=0$인 경우: 함수 $f(x)$가 실수 전체의 집합에서 연속이고 최솟값이 0, 최댓값이 3이므로
        $$f(x)=\begin{cases}\lvert2x\rvert & \left(\lvert x\rvert\le\dfrac{3}{2}\right)\\ 3 & \left(\lvert x\rvert>\dfrac{3}{2}\right)\end{cases}$$이다. (i), (ii)에서 $f(x)$는 위와 같고, 함수 $y=f(x)$의 그래프는 $x=0$에서 최솟값 0, $\lvert x\rvert\ge\dfrac{3}{2}$에서 상수 3을 갖는 [그림: 원점에서 $\left(\pm\dfrac{3}{2},\ 3\right)$까지 꺾은선, 그 밖은 $y=3$]이다.
      source_flow: PDF p.48~50
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        따라서 $f(-1)=2$, $f(0)=0$, $f\left(\dfrac{11}{4}\right)=3$이므로 $f(-1)+f(0)+f\left(\dfrac{11}{4}\right)=2+0+3=5$이다.
      source_flow: PDF p.48~50
      criteria:
      - 1.A1
      - 1.A2
      - 1.A3
      - 1.A4
