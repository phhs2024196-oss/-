- id: 9-2
  stem: |
    (2) $a_1+a_2$의 최댓값과 최솟값을 각각 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: max = 9/2; min = 67/32
    equivalents: []
    tolerance: null
  solutions:
  - id: S92-B
    audience: B
    method_no: 1
    steps:
    - id: 92b-1
      content: |
        $a_5$가 정수이면, $a_6=\dfrac{5}{a_5}=2$에서 $a_5=\dfrac{5}{2}$이므로 $a_5$가 정수라는 조건에 모순이다. 따라서 $a_5$는 정수가 아니고, $a_6=2a_5-1=2$에서 $a_5=\dfrac{3}{2}$이다. 이와 같은 과정을 반복하면 $a_4=\dfrac{5}{4}$이다.
      source_flow: PDF p.53~54
      criteria:
      - 9-2.M1
    - id: 92b-2
      content: |
        계속해서 $a_3$이 정수이면 $a_4=\dfrac{5}{a_3}=\dfrac{5}{4}$에서 $a_3=4$이다. $a_3$이 정수가 아니면 $a_4=2a_3-1=\dfrac{5}{4}$에서 $a_3=\dfrac{9}{8}$이다. 이와 같은 과정을 반복하면 $a_3=4$일 때 $a_2=\dfrac{5}{2}$이고, $a_3=\dfrac{9}{8}$일 때 $a_2=\dfrac{17}{16}$이다. 그리고 $a_2=\dfrac{5}{2}$일 때, $a_1=2$ 또는 $a_1=\dfrac{7}{4}$이다. 한편, $a_2=\dfrac{17}{16}$일 때, $a_1=\dfrac{33}{32}$이다. 정리하면 [그림: $a_6=2$에서 $a_5=\tfrac{3}{2}$, $a_4=\tfrac{5}{4}$로 이어지고 $a_4$에서 두 갈래로 갈라지는 나무 도형 — $a_3=4,\ a_2=\tfrac{5}{2}$ 에서 $a_1=2$ 또는 $\tfrac{7}{4}$, $a_3=\tfrac{9}{8},\ a_2=\tfrac{17}{16},\ a_1=\tfrac{33}{32}$]
      source_flow: PDF p.53~54
      criteria:
      - 9-2.M1
      - 9-2.M2
      - 9-2.M3
    - id: 92b-3
      content: |
        $(a_1,\ a_2)=\left(2,\ \dfrac{5}{2}\right)$ 또는 $\left(\dfrac{7}{4},\ \dfrac{5}{2}\right)$ 또는 $\left(\dfrac{33}{32},\ \dfrac{17}{16}\right)$이다. 따라서 $a_1+a_2$의 최댓값은 $2+\dfrac{5}{2}=\dfrac{9}{2}$이고, 최솟값은 $\dfrac{33}{32}+\dfrac{17}{16}=\dfrac{67}{32}$이다.
      source_flow: PDF p.53~54
      criteria:
      - 9-2.A1
      - 9-2.A2
