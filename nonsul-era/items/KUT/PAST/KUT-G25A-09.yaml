stimuli: []
stem: |
  수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
  $$a_{n+1}=\begin{cases}\dfrac{5}{a_n} & (a_n\text{이 정수인 경우})\\ 2a_n-1 & (a_n\text{이 정수가 아닌 경우})\end{cases}$$
  를 만족시킨다. $a_6=2$일 때, 다음 물음에 답하시오.
subparts:
- id: 9-1
  stem: |
    (1) $2\sum_{k=6}^{27}a_k$의 값을 구하시오. (6점)
  points: 6
  depends_on: []
  answer:
    kind: value
    value: '99'
    equivalents: []
    tolerance: null
  solutions:
  - id: S91-B
    audience: B
    method_no: 1
    steps:
    - id: 91b-1
      content: |
        $a_6=2$이므로 $a_6=2,\ a_7=\dfrac{5}{2},\ a_8=4,\ a_9=\dfrac{5}{4},\ a_{10}=\dfrac{3}{2},\ a_{11}=2,\ \cdots$이다. 따라서 모든 자연수 $n$에 대하여 $a_{5n+1}=2,\ a_{5n+2}=\dfrac{5}{2},\ a_{5n+3}=4,\ a_{5n+4}=\dfrac{5}{4},\ a_{5n+5}=\dfrac{3}{2}$이므로
      source_flow: PDF p.53~54
      criteria:
      - 9-1.M1
    - id: 91b-2
      content: |
        $$2\sum_{k=6}^{27}a_k=2\times\left\{4\times\left(2+\dfrac{5}{2}+4+\dfrac{5}{4}+\dfrac{3}{2}\right)+2+\dfrac{5}{2}\right\}=99$$이다.
      source_flow: PDF p.53~54
      criteria:
      - 9-1.A1
