stimuli: []
stem: |
  실수 $k$에 대하여 함수 $f(x)$를
  $$f(x)=\begin{cases}-x^2+6x+k & (x<0)\\ x^2-4x+k & (x\ge0)\end{cases}$$
  이라 하자. 실수 $t$에 대하여 함수 $y=\lvert f(x)\rvert$의 그래프와 직선 $y=t$의 교점의 개수를 $g(t)$라 할 때, 다음 물음에 답하시오.
subparts:
- id: 10-1
  stem: |
    (1) $k=2$일 때, $g(1)$의 값을 구하시오. (6점)
  points: 6
  depends_on: []
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S101-B
    audience: B
    method_no: 1
    steps:
    - id: 101b-1
      content: |
        $k=2$일 때 $f(x)=\begin{cases}-x^2+6x+2 & (x<0)\\ x^2-4x+2 & (x\ge0)\end{cases}$이고 $f(0)=2,\ f(2)=-2$이므로 함수 $y=\lvert f(x)\rvert$의 그래프는 [그림: 함수 $y=\lvert f(x)\rvert$의 그래프와 두 직선 $y=2$, $y=1$]과 같다. 따라서 함수 $y=\lvert f(x)\rvert$의 그래프와 직선 $y=1$이 만나는 점의 개수가 6개이므로 $g(1)=6$이다.
      source_flow: PDF p.57~58
      criteria:
      - 10-1.M1
      - 10-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 10-1.M1
      mark_type: M
      points: 3
      evidence: $y=\lvert f(x)\rvert$ 의 그래프의 개형을 그림
      steps:
      - 101b-1
    - id: 10-1.A1
      mark_type: A
      points: 3
      evidence: $g(1)=6$ 임을 구함
      steps:
      - 101b-1
      depends_on:
      - 10-1.M1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 10-2
  stem: |
    (2) $0<k<2$일 때, 함수 $g(t)$가 $t=a$에서 불연속인 모든 실수 $a$의 값의 합을 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S102-B
    audience: B
    method_no: 1
    steps:
    - id: 102b-1
      content: |
        $0<k<2$일 때 $f(x)=\begin{cases}-(x-3)^2+k+9 & (x<0)\\ (x-2)^2+k-4 & (x\ge0)\end{cases}$이고 $f(0)=k<4-k=-f(2)$이므로 함수 $y=\lvert f(x)\rvert$의 그래프는 [그림: 직선 $y=k=f(0)$, $y=4-k=-f(2)$를 기준으로 한 그래프]와 같다.
      source_flow: PDF p.57~58
      criteria:
      - 10-2.M1
      - 10-2.M2
    - id: 102b-2
      content: |
        정리하면 함수 $g(t)$는 $g(t)=0\ (t<0)$, $3\ (t=0)$, $6\ (0<t<k)$, $5\ (t=k)$, $4\ (k<t<4-k)$, $3\ (t=4-k)$, $2\ (t>4-k)$이다. 이때 $g(t)$는 $t=0,\ k,\ 4-k$에서 불연속이다. 따라서 함수 $g(t)$가 $t=a$에서 불연속이 되는 모든 실수 $a$의 값의 합은 4이다.
      source_flow: PDF p.57~58
      criteria:
      - 10-2.M3
      - 10-2.A1
  rubric:
