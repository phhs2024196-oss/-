stem: |
  함수 $y=3^{x-2}+3$의 그래프 위의 점 $(a,\ b)$와 함수 $y=3^{x-2}+3$의 그래프의 점근선 사이의 거리가 3일 때, $a+b$의 값을 구하시오. (단, $a$, $b$는 상수이다.)
