  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $y=3^{x-2}+3$의 그래프는 함수 $y=3^x$의 그래프를 $x$축의 방향으로 2만큼, $y$축의 방향으로 3만큼 평행이동한 것이므로 점근선의 방정식은 $y=3$이다. 점 $(a,\ b)$와 직선 $y=3$ 사이의 거리가 3이고, $b>3$이므로 $b-3=3$에서 $b=6$이다.
      source_flow: PDF p.60
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이때 점 $(a,\ 6)$은 함수 $y=3^{x-2}+3$의 그래프 위에 있으므로 $6=3^{a-2}+3$이다. 따라서 $a=3$이고, $a+b=3+6=9$이다.
      source_flow: PDF p.60
      criteria:
      - 1.A1
