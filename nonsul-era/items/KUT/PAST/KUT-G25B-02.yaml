stem: |
  두 양수 $a$, $b$에 대하여 좌표평면 위의 두 점 $(0,\ \log_2a)$, $(1,\ \log_2b)$를 지나는 직선이 점 $(3,\ 2)$를 지날 때, $\dfrac{b^3}{a^2}$의 값을 구하시오.
