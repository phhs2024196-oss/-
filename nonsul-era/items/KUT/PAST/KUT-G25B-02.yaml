  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 점 $(0,\ \log_2a)$, $(1,\ \log_2b)$를 지나는 직선은 $y=\dfrac{\log_2b-\log_2a}{1-0}(x-0)+\log_2a$이다. 정리하면 $y=(\log_2b-\log_2a)x+\log_2a$이다.
      source_flow: PDF p.62~63
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이 직선이 $(3,\ 2)$를 지나므로 $2=3(\log_2b-\log_2a)+\log_2a$, $2=3\log_2b-2\log_2a$, $2=\log_2\dfrac{b^3}{a^2}$, $\dfrac{b^3}{a^2}=4$이다.
      source_flow: PDF p.62~63
      criteria:
      - 1.A1
