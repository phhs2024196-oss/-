  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g(x)=x^3-12x$라 하면 $g'(x)=3x^2-12=3(x+2)(x-2)$이므로 $g'(x)=0$의 해는 $x=-2$ 또는 $x=2$이다.
      source_flow: PDF p.65~66
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 함수 $g(x)$의 극댓값은 $g(-2)=16$, 극솟값은 $g(2)=-16$이므로 함수 $f(x)=\lvert g(x)\rvert=\lvert x^3-12x\rvert$의 그래프는 [그림: $x=-2,\ 2$에서 극댓값 16을 갖고 $x=0,\ \pm2\sqrt{3}$에서 $x$축과 만나는 W자 모양 그래프와 직선 $y=k$]와 같다.
      source_flow: PDF p.65~66
      criteria:
      - 1.M2
      - 1.M3
    - id: 1b-3
      content: |
        이때 방정식 $f(x)=k$의 서로 다른 실근의 개수가 4가 되기 위해서는 그림과 같이 함수 $y=f(x)$의 그래프와 직선 $y=k$가 서로 다른 네 점에서 만나야 하므로 $k=f(2)=\lvert g(2)\rvert=16$이다.
      source_flow: PDF p.65~66
      criteria:
      - 1.A1
