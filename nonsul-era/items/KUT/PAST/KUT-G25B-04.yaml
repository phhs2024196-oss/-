  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$가 실수 전체의 집합에서 연속이므로 $x=0$에서도 연속이다. 즉, $f(0)=\lim_{x\to0-}f(x)=\lim_{x\to0+}f(x)$가 성립한다. 이때 모든 실수 $x$에 대하여 $f(x+4)=f(x)$이므로 $\lim_{x\to0-}f(x)=\lim_{x\to0-}f(x+4)=\lim_{x\to4-}f(x)$이다. 따라서 $f(0)=4$, $\lim_{x\to4-}f(x)=\lim_{x\to4-}\dfrac{ax+b}{x+2}=\dfrac{4a+b}{6}$, $\lim_{x\to0+}f(x)=\lim_{x\to0+}(2x+4)=4$이므로 $\dfrac{4a+b}{6}=4$가 성립하고 $4a+b=24$ ····· ㉠ 이다.
      source_flow: PDF p.68~69
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b-2
      content: |
        또한 $f(x)$는 $x=2$에서도 연속이므로 $f(2)=\lim_{x\to2-}f(x)=\lim_{x\to2+}f(x)$가 성립한다. 따라서 $f(2)=\dfrac{2a+b}{4}$, $\lim_{x\to2-}f(x)=\lim_{x\to2-}(2x+4)=8$, $\lim_{x\to2+}f(x)=\lim_{x\to2+}\dfrac{ax+b}{x+2}=\dfrac{2a+b}{4}$이므로 $2a+b=32$ ····· ㉡ 이다.
      source_flow: PDF p.68~69
      criteria:
      - 1.M3
    - id: 1b-3
      content: |
        ㉠, ㉡으로부터 $a=-4$, $b=40$이다. 따라서 $f(15)=f(11)=f(7)=f(3)=\dfrac{-12+40}{3+2}=\dfrac{28}{5}$이다.
      source_flow: PDF p.68~69
      criteria:
      - 1.A1
