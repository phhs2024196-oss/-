stimuli: []
stem: |
  함수 $f(x)$가 모든 실수 $x$에 대하여 $f(x+4)=f(x)$이고, $0\le x<4$일 때
  $$f(x)=\begin{cases}2x+4 & (0\le x<2)\\ \dfrac{ax+b}{x+2} & (2\le x<4)\end{cases}$$
  이다. 함수 $f(x)$가 실수 전체의 집합에서 연속일 때, $f(15)$의 값을 구하시오. (단, $a$, $b$는 상수이다.)
