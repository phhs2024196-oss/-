    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $5\sin x=2$에서 $\sin x=\dfrac{2}{5}$임을 알 수 있고, 이 방정식의 해는 $0\le x<\dfrac{5}{2}\pi$에서 함수 $y=\sin x$의 그래프와 직선 $y=\dfrac{2}{5}$의 교점의 $x$좌표와 같다. [그림: $y=\sin x$의 그래프와 직선 $y=\dfrac{2}{5}$가 $x=a,\ b,\ c$에서 만나는 그림]
      source_flow: PDF p.71~72
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이때 두 점 $\left(a,\ \dfrac{2}{5}\right)$, $\left(b,\ \dfrac{2}{5}\right)$는 직선 $x=\dfrac{\pi}{2}$에 대하여 대칭이므로 $\dfrac{a+b}{2}=\dfrac{\pi}{2}$이다. 따라서 $\cos\left(\dfrac{a+b}{2}+c\right)=\cos\left(\dfrac{\pi}{2}+c\right)=-\sin c=-\dfrac{2}{5}$이다.
      source_flow: PDF p.71~72
      criteria:
      - 1.M2
      - 1.A1
