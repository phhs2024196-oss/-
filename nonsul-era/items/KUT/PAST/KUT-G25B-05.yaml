stimuli: []
stem: |
  $0\le x<\dfrac{5}{2}\pi$일 때, 방정식 $5\sin x=2$를 만족하는 $x$의 값을 작은 것부터 차례로 $a$, $b$, $c$라 하자. 이때 $\cos\left(\dfrac{a+b}{2}+c\right)$의 값을 구하시오.
subparts:
