  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)로부터 $f(x)=2x^3-2x^2+ax+b$ ($a$, $b$는 상수) ····· ㉠ 이다. 조건 (나)로부터 $f(x)$는 $(x-1)^k$를 인수로 갖는다. 따라서 $k=2$ 또는 $k=3$이다.
      source_flow: PDF p.74~75
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b-2
      content: |
        (i) $k=2$일 때, $f(x)=2(x-1)^2(x+c)$ ($c$는 상수)이다. 따라서 $f(x)=2x^3+(2c-4)x^2+(2-4c)x+2c$이고, ㉠과 비교하면 $c=1$이다.
        (ii) $k=3$일 때, $f(x)=2(x-1)^3=2x^3-6x^2+6x+2$이다. ㉠과 비교하면, 이것은 모순이다.
      source_flow: PDF p.74~75
      criteria:
      - 1.M2
      - 1.M3
    - id: 1b-3
      content: |
        (i), (ii)에서 $k=2$이고 $f(x)=2(x-1)^2(x+1)$이다. 조건 (나)로부터 $\lim_{x\to1}\dfrac{f(x)}{(x-1)^k}=\lim_{x\to1}2(x+1)=4$이다. 그러므로 $m=4$이다. $f(m)=f(4)=2\times9\times5=90$이다.
      source_flow: PDF p.74~75
      criteria:
      - 1.M3
      - 1.A1
      - 1.A2
