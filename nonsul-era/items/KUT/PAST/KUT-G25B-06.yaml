stimuli: []
stem: |
  다항함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) $\lim_{x\to\infty}\dfrac{f(x)-2x^3}{2x^2+1}=-1$
  (나) $\lim_{x\to1}\dfrac{f(x)}{(x-1)^k}=m$인 자연수 $k$와 상수 $m$이 존재한다. (단, $k\ge2$)
  $f(m)$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
