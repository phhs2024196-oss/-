stimuli: []
stem: |
  최고차항의 계수가 1인 이차함수 $f(x)$에 대하여 함수 $g(x)$를
  $$g(x)=\begin{cases}f(x)-f(x-1) & (x<0)\\ f(x) & (x\ge0)\end{cases}$$
  이라 하자. 함수 $g(x)$가 $x=0$에서 미분가능할 때, $f(3)$의 값을 구하시오.
subparts:
