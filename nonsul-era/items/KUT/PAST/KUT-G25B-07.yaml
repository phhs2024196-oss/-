  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^2+ax+b$ ($a$, $b$는 상수)라 하자. $f(x)-f(x-1)=2x+a-1$이므로 $g(x)=\begin{cases}2x+a-1 & (x<0)\\ x^2+ax+b & (x\ge0)\end{cases}$이다.
      source_flow: PDF p.77~78
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $g(x)$는 $x=0$에서 연속이므로 $\lim_{x\to0-}g(x)=g(0)$으로부터 $a-1=b$ ····· ㉠ 이다.
      source_flow: PDF p.77~78
      criteria:
      - 1.M1
      - 1.M3
    - id: 1b-3
      content: |
        $g(x)$는 $x=0$에서 미분가능이므로 $\lim_{h\to0-}\dfrac{g(h)-g(0)}{h}=\lim_{h\to0+}\dfrac{g(h)-g(0)}{h}$, 즉 $\lim_{h\to0-}\dfrac{(2h+a-1)-b}{h}=\lim_{h\to0+}\dfrac{(h^2+ah+b)-b}{h}$에서 $a=2$이고, ㉠으로부터 $b=1$이다.
      source_flow: PDF p.77~78
      criteria:
      - 1.M2
      - 1.M3
    - id: 1b-4
      content: |
        따라서 $f(x)=x^2+2x+1$이고, $f(3)=16$이다.
      source_flow: PDF p.77~78
      criteria:
      - 1.A1
