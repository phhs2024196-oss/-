stimuli: []
stem: |
  다항함수 $f(x)$가 모든 실수 $x$에 대하여
  $$4x^2-2f(x)=x+1+f(-x)$$
  를 만족시킬 때, $\int_0^1f(x)\,dx$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: -7/18
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        문제에서 주어진 식을 변형하면 $2f(x)+f(-x)=4x^2-x-1$ ····· ㉠ 이다. 위의 식으로부터 $f(x)$는 이차식이다. $f(x)=ax^2+bx+c$ ($a$, $b$, $c$는 상수)라 하자.
      source_flow: PDF p.80~81
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ㉠으로부터 모든 실수 $x$에 대하여 $2(ax^2+bx+c)+(ax^2-bx+c)=4x^2-x-1$, $3ax^2+bx+3c=4x^2-x-1$이다. 그러므로 $3a=4$, $b=-1$, $3c=-1$, $a=\dfrac{4}{3}$, $b=-1$, $c=-\dfrac{1}{3}$이고, $f(x)=\dfrac{4}{3}x^2-x-\dfrac{1}{3}$이다.
      source_flow: PDF p.80~81
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 $\int_0^1f(x)\,dx=\int_0^1\left(\dfrac{4}{3}x^2-x-\dfrac{1}{3}\right)dx=\left[\dfrac{4}{9}x^3-\dfrac{1}{2}x^2-\dfrac{1}{3}x\right]_0^1=\dfrac{4}{9}-\dfrac{1}{2}-\dfrac{1}{3}=-\dfrac{7}{18}$이다.
      source_flow: PDF p.80~81
      criteria:
      - 1.A1
