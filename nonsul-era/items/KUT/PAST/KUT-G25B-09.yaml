stimuli: []
stem: |
  실수 전체의 집합에서 정의된 함수
  $$f(x)=\int_0^xt(t-2)(t-4)\,dt$$
  에 대하여 다음 물음에 답하시오.
subparts:
- id: 9-1
  stem: |
    (1) 함수 $f(x)$의 극댓값을 구하시오. (6점)
  points: 6
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S91-B
    audience: B
    method_no: 1
    steps:
    - id: 91b-1
      content: |
        $f'(x)=x(x-2)(x-4)$이므로 $x=0$ 또는 $x=2$ 또는 $x=4$에서 $f'(x)=0$이다. 따라서 함수 $f(x)$는 $x=2$에서 극대이고 극댓값은 $f(2)=\int_0^2t(t-2)(t-4)\,dt=\left[\dfrac{1}{4}t^4-2t^3+4t^2\right]_0^2=4-16+16=4$이다.
      source_flow: PDF p.84
      criteria:
      - 9-1.M1
      - 9-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 9-1.M1
      mark_type: M
      points: 4
      evidence: $f(x)$ 는 $x=2$ 에서 극대임을 구함
      steps:
      - 91b-1
    - id: 9-1.A1
      mark_type: A
      points: 2
      evidence: 극댓값이 4 임을 구함
      steps:
      - 91b-1
      depends_on:
      - 9-1.M1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 9-2
  stem: |
    (2) 함수 $g(x)$를 $g(x)=f(x+2)-f(x)$라 할 때, 함수 $g(x)$의 극솟값을 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S92-B
    audience: B
    method_no: 1
    steps:
    - id: 92b-1
      content: |
        $g(x)=f(x+2)-f(x)$이므로 $g(x)=\int_0^{x+2}t(t-2)(t-4)\,dt-\int_0^xt(t-2)(t-4)\,dt=2x^3-6x^2+4$이다. 함수 $g(x)$를 $x$에 대하여 미분하면 $g'(x)=6x(x-2)$이므로 $x=0$ 또는 $x=2$에서 $g'(x)=0$이다. 따라서 함수 $g(x)$는 $x=2$에서 극소이고
      source_flow: PDF p.84
      criteria:
      - 9-2.M1
    - id: 92b-2
      content: |
        $f(4)=\int_0^4t(t-2)(t-4)\,dt=\left[\dfrac{1}{4}t^4-2t^3+4t^2\right]_0^4=64-128+64=0$이므로 극솟값은 $g(2)=f(4)-f(2)=0-4=-4$이다.
      source_flow: PDF p.84
      criteria:
      - 9-2.A1
