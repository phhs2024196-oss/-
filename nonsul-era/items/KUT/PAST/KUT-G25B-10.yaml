stimuli: []
stem: |
  모든 항이 0이 아닌 정수이고 공차 $d$가 양수인 등차수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하자. 수열 $\{S_n\}$의 각 항을 작은 수부터 다시 차례로 나열한 수열을 $\{M_n\}$이라 하면, 수열 $\{M_n\}$이
  $$M_2-M_1=M_3-M_2=2$$
  를 만족시킨다. $S_n>0$을 만족시키는 자연수 $n$의 최솟값이 13일 때, 다음 물음에 답하시오. (단, 수열 $\{S_n\}$의 모든 항은 서로 다르다.)
subparts:
- id: 10-1
  stem: |
    (1) 공차 $d$의 값을 구하시오. (8점)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S101-B
    audience: B
    method_no: 1
    steps:
    - id: 101b-1
      content: |
        $a_1>0$이면 $S_1>0$이므로 조건을 만족시키지 않는다. 즉, $a_1<0$이다. 또 $a_2>0$이면 $S_3=3a_2>0$이므로 조건을 만족시키지 않는다. 즉, $a_1<a_2<0$이므로 2 이상의 자연수 $k$에 대하여 $S_k=M_1$이라 하면 $n\le k$일 때 $a_n<0$이고, $n\ge k+1$일 때 $a_n>0$이다.
      source_flow: PDF p.86~88
      criteria:
      - 10-1.M1
    - id: 101b-2
      content: |
        (i) $S_k=M_1$, $S_{k-1}=M_2$, $S_{k+1}=M_3$인 경우: $M_2-M_1=S_{k-1}-S_k=-a_k=2$이므로 $a_k=-2$가 되고, $M_3-M_2=S_{k+1}-S_{k-1}=a_k+a_{k+1}=2$이므로 $a_{k+1}=4$가 된다. 따라서 $d=6$이다.
      source_flow: PDF p.86~88
      criteria:
      - 10-1.M1
      - 10-1.A1
    - id: 101b-3
      content: |
        (ii) $S_k=M_1$, $S_{k+1}=M_2$, $S_{k-1}=M_3$인 경우: $M_2-M_1=S_{k+1}-S_k=a_{k+1}=2$이고 $M_3-M_2=S_{k-1}-S_{k+1}=-a_k-a_{k+1}=2$이므로 $a_k=-4$가 된다. 따라서 $d=6$이다.
      source_flow: PDF p.86~88
      criteria:
      - 10-1.M1
      - 10-1.A1
  rubric:
