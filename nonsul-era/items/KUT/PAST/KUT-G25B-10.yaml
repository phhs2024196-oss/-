- id: 10-2
  stem: |
    (2) 첫째항 $a_1$의 값을 구하시오. (8점)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '-34'
    equivalents: []
    tolerance: null
  solutions:
  - id: S102-B
    audience: B
    method_no: 1
    steps:
    - id: 102b-1
      content: |
        (i)의 경우: $a_1=a_k-6(k-1)=4-6k$이고 $S_n=\dfrac{n\{2a_1+d(n-1)\}}{2}=\dfrac{n\{2(4-6k)+6(n-1)\}}{2}=n(3n-6k+1)$이다. $S_n>0$을 만족시키는 자연수 $n$의 최솟값이 13이므로 $n=12$일 때 $3n-6k+1\le0$, 즉 $6k\ge37$을 만족하고, $n=13$일 때 $3n-6k+1>0$, 즉 $6k<40$을 만족한다. 그러나 $37\le6k<40$을 만족시키는 자연수 $k$는 존재하지 않는다.
      source_flow: PDF p.86~88
      criteria:
      - 10-2.M1
    - id: 102b-2
      content: |
        (ii)의 경우: $a_1=a_k-6(k-1)=2-6k$이고 $S_n=\dfrac{n\{2a_1+d(n-1)\}}{2}=\dfrac{n\{2(2-6k)+6(n-1)\}}{2}=n(3n-6k-1)$이다. $S_n>0$을 만족시키는 자연수 $n$의 최솟값이 13이므로 $n=12$일 때 $3n-6k-1\le0$, 즉 $6k\ge35$를 만족하고, $n=13$일 때 $3n-6k-1>0$, 즉 $6k<38$을 만족한다. 그러면 $35\le6k<38$을 만족시키는 자연수 $k$는 6뿐이다. 따라서 $a_1=2-6k=-34$이다.
      source_flow: PDF p.86~88
      criteria:
      - 10-2.M1
      - 10-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 10-2.M1
      mark_type: M
      points: 4
      evidence: $M_1=S_6$ 임을 구함
      steps:
      - 102b-1
      - 102b-2
    - id: 10-2.A1
      mark_type: A
      points: 4
      evidence: 첫째항 $a_1=-34$ 임을 구함
      steps:
      - 102b-2
      depends_on:
      - 10-2.M1
