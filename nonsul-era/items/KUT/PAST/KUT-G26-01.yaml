  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=\left(\dfrac12\right)^{x}+1$은 정의역 $\{x\mid 0\le x\le2\}$에서 감소하므로 $x=0$에서 최댓값, $x=2$에서 최솟값을 갖는다. 따라서 $M=f(0)=2$, $m=f(2)=\dfrac54$이다. ㉠
      source_flow: PDF p.2
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $a>1$이므로 함수 $g(x)$도 정의역 $\{x\mid 0\le x\le1\}$에서 감소하고, 따라서 $x=0$에서 최댓값, $x=1$에서 최솟값을 갖는다. 즉 $-m=g(0)=-1+b$, $-M=g(1)=-a+b$이다. ㉡
      source_flow: PDF p.2
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        ㉠, ㉡으로부터 $a=\dfrac74$, $b=-\dfrac14$이므로 $a+b=\dfrac64=\dfrac32$이다.
      source_flow: PDF p.2
      criteria:
      - 1.B2
