stimuli: []
stem: |
  정의역이 $\{x\mid 0\le x\le 2\}$인 함수

  $$f(x)=\left(\dfrac12\right)^{x}+1$$

  의 최댓값과 최솟값을 각각 $M$, $m$이라 하자. 정의역이 $\{x\mid 0\le x\le 1\}$인 함수

  $$g(x)=-a^{x}+b$$

  의 최댓값과 최솟값이 각각 $-m$, $-M$일 때, $a+b$의 값을 구하시오.
  (단, $a$, $b$는 상수이고, $a>1$)
