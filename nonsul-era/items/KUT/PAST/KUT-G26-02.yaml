stem: |
  정의역이 $\{x\mid x>0\}$인 함수

  $$f(x)=\log_{5}(10x^{2}+35)$$

  에 대하여 $(f^{-1}\circ f^{-1})(3)$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f^{-1}(3)=a$로 놓으면 역함수의 성질에 따라 $f(a)=3$이므로 $f(a)=\log_{5}(10a^{2}+35)=3$이다. 로그의 정의에 의해 $10a^{2}+35=5^{3}=125$이고, 따라서 $a^{2}=9$, $\therefore a=3$ ($\because x>0$)
      source_flow: PDF p.4
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $f^{-1}(3)=3$이므로 $(f^{-1}\circ f^{-1})(3)=f^{-1}(f^{-1}(3))=f^{-1}(3)=3$이다.
      source_flow: PDF p.4
      criteria:
      - 1.B2
