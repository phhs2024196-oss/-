stimuli: []
stem: |
  함수 $f(x)$가 모든 양의 실수 $x$에 대하여 부등식

  $$f\left(\dfrac{x-3}{5}\right)\le\dfrac15x^{2}\le f\left(\dfrac{x-1}{5}\right)$$

  을 만족시킬 때, $\displaystyle\lim_{x\to\infty}\dfrac{f(x)}{7x^{2}+4}$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 5/7
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        부등식 $f\left(\dfrac{x-3}{5}\right)\le\dfrac15x^{2}$에서 $\dfrac{x-3}{5}=t$로 놓으면 $x=5t+3$이고 $x>0$일 때 $t>-\dfrac35$이므로 $f(t)\le\dfrac15(5t+3)^{2}$ $\left(t>-\dfrac35\right)$이다. ㉠
      source_flow: PDF p.6
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        부등식 $\dfrac15x^{2}\le f\left(\dfrac{x-1}{5}\right)$에서 $\dfrac{x-1}{5}=s$로 놓으면 $x=5s+1$이고 $x>0$일 때 $s>-\dfrac15$이므로 $\dfrac15(5s+1)^{2}\le f(s)$ $\left(s>-\dfrac15\right)$이다. ㉡
      source_flow: PDF p.6
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        ㉠, ㉡으로부터 $x>-\dfrac15$인 모든 실수 $x$에 대하여 $\dfrac15(5x+1)^{2}\le f(x)\le\dfrac15(5x+3)^{2}$이고 각 변을 $7x^{2}+4$로 나누면 $\dfrac{(5x+1)^{2}}{5(7x^{2}+4)}\le\dfrac{f(x)}{7x^{2}+4}\le\dfrac{(5x+3)^{2}}{5(7x^{2}+4)}$이다.
      source_flow: PDF p.6
      criteria:
      - 1.B3
    - id: 1b-4
      content: |
        $\displaystyle\lim_{x\to\infty}\dfrac{(5x+1)^{2}}{5(7x^{2}+4)}=\dfrac57$, $\displaystyle\lim_{x\to\infty}\dfrac{(5x+3)^{2}}{5(7x^{2}+4)}=\dfrac57$이므로
      source_flow: PDF p.6
      criteria:
      - 1.B3
    - id: 1b-5
      content: |
        함수의 극한의 대소 관계에 의해 $\displaystyle\lim_{x\to\infty}\dfrac{f(x)}{7x^{2}+4}=\dfrac57$이다.
      source_flow: PDF p.6
      criteria:
      - 1.B4
