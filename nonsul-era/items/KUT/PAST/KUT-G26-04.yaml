stimuli: []
stem: |
  다항함수 $f(x)$에 대하여 곡선 $y=f(x)$ 위의 점 $(2,f(2))$에서의 접선을 $l$, 함수

  $$g(x)=\dfrac18x^{3}f(x)$$

  에 대하여 곡선 $y=g(x)$ 위의 점 $(2,g(2))$를 지나고 이 점에서의 접선에 수직인 직선을 $m$이라 하자. 직선 $l$의 방정식이 $y=-3x+9$일 때, 두 직선 $l$, $m$과 $x$축으로 둘러싸인 삼각형의 넓이를 구하시오.
subparts:
