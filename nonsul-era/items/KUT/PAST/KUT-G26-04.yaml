  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=f(x)$ 위의 점 $(2,f(2))$에서의 접선의 방정식이 $y=-3x+9$이므로 $f(2)=3$, $f'(2)=-3$이다.
      source_flow: PDF p.8
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $g(x)=\dfrac18x^{3}f(x)$에서 $g'(x)=\dfrac38x^{2}f(x)+\dfrac18x^{3}f'(x)$이므로 $g(2)=\dfrac18\times8\times f(2)=3$, $g'(2)=\dfrac38\times4\times f(2)+\dfrac18\times8\times f'(2)=\dfrac92-3=\dfrac32$이다.
      source_flow: PDF p.8
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        따라서 곡선 $y=g(x)$ 위의 점 $(2,g(2))$를 지나고 이 점에서의 접선에 수직인 직선 $m$의 방정식은 $y=-\dfrac23(x-2)+3=-\dfrac23x+\dfrac{13}{3}$이다.
      source_flow: PDF p.8
      criteria:
      - 1.B3
    - id: 1b-4
      content: |
        직선 $l$의 $x$절편은 $3$, 직선 $m$의 $x$절편은 $\dfrac{13}{2}$, 두 직선 $l$, $m$의 교점의 좌표는 $(2,3)$이므로 두 직선 $l$, $m$과 $x$축으로 둘러싸인 삼각형의 넓이는 $\dfrac12\times\left(\dfrac{13}{2}-3\right)\times3=\dfrac{21}{4}$이다.
      source_flow: PDF p.8
      criteria:
      - 1.B4
