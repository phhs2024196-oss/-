stimuli: []
stem: |
  정의역이 $\{x\mid x\ge0\}$인 함수

  $$f(x)=x^{2}-2(\sin\theta)x+\cos^{2}\theta-\sin\theta+1$$

  의 최솟값이 $1$일 때, 이를 만족시키는 모든 실수 $\theta$의 값의 합을 구하시오. (단, $0\le\theta<2\pi$)
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\cos^{2}\theta=1-\sin^{2}\theta$이므로 $f(x)=(x-\sin\theta)^{2}+\cos^{2}\theta-\sin\theta+1-\sin^{2}\theta=(x-\sin\theta)^{2}-2\sin^{2}\theta-\sin\theta+2$이다.
      source_flow: PDF p.10
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        ① $\sin\theta\ge0$이라면 $x\ge0$일 때 함수 $f(x)$의 최솟값은 $f(\sin\theta)=-2\sin^{2}\theta-\sin\theta+2$이므로 $-2\sin^{2}\theta-\sin\theta+2=1$, $\therefore\sin\theta=\dfrac12$ ($\because\sin\theta\ge0$)이다. 그러므로 실수 $\theta$ $(0\le\theta<2\pi)$는 $\theta=\dfrac\pi6,\ \dfrac{5\pi}{6}$이다.
      source_flow: PDF p.10
      criteria:
      - 1.B1
    - id: 1b-3
      content: |
        ② $\sin\theta<0$이라면 $x\ge0$일 때 함수 $f(x)$의 최솟값은 $f(0)=-\sin^{2}\theta-\sin\theta+2$이므로 $-\sin^{2}\theta-\sin\theta+2=1$, $\therefore\sin\theta=\dfrac{-1\pm\sqrt5}{2}$이다. 그러나 $-1\le\sin\theta<0$이어야 하므로 조건을 만족시키는 실수 $\theta$ $(0\le\theta<2\pi)$는 존재하지 않는다.
      source_flow: PDF p.10
      criteria:
      - 1.B2
    - id: 1b-4
      content: |
        따라서 ①, ②로부터 모든 실수 $\theta$의 값의 합은 $\dfrac\pi6+\dfrac{5\pi}{6}=\pi$이다.
      source_flow: PDF p.10
      criteria:
      - 1.B3
