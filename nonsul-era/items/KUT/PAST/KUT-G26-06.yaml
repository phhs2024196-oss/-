stimuli: []
stem: |
  양수 $a$와 최고차항의 계수가 $1$인 삼차함수 $f(x)$에 대하여 함수 $g(x)$를

  $$g(x)=\begin{cases}2f(\lvert x\rvert)&(\lvert x\rvert\le a)\\-f(2a-\lvert x\rvert)&(\lvert x\rvert>a)\end{cases}$$

  라 할 때, 다음 조건을 만족시키는 양수 $a$의 값을 구하시오.

  (가) $f(a)=-\dfrac{81}{8}$
  (나) 두 함수 $f(x-a)g(x)$와 $f(x)g(x-a)$가 모두 실수 전체의 집합에서 연속이다.
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: 3/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$는 실수 전체의 집합에서 연속이고 조건 (가)에서 $f(a)\ne0$이므로 함수 $g(x)$는 $x=\pm a$에서만 연속이 아니다. 따라서 조건 (나)로부터 함수 $f(x-a)g(x)$는 $x=a$, $x=-a$에서 연속이고 함수 $f(x)g(x-a)$는 $x=2a$, $x=0$에서 연속이어야 한다. 그러므로 $\displaystyle\lim_{x\to a+}f(x-a)g(x)=\lim_{x\to a-}f(x-a)g(x)=f(0)g(a)$ ㉠, $\displaystyle\lim_{x\to-a+}f(x-a)g(x)=\lim_{x\to-a-}f(x-a)g(x)=f(-2a)g(-a)$ ㉡, $\displaystyle\lim_{x\to2a+}f(x)g(x-a)=\lim_{x\to2a-}f(x)g(x-a)=f(2a)g(a)$ ㉢, $\displaystyle\lim_{x\to0+}f(x)g(x-a)=\lim_{x\to0-}f(x)g(x-a)=f(0)g(-a)$ ㉣이다.
      source_flow: PDF p.12~13
      criteria:
      - 1.B1
      - 1.B2
      - 1.B3
    - id: 1b-2
      content: |
        ㉠에서 $f(0)(-f(a))=f(0)(2f(a))$, $3f(0)f(a)=0$, $\therefore f(0)=0$ ($\because f(a)\ne0$)이다. ㉣에서도 같은 방법으로 $f(0)=0$이다.
      source_flow: PDF p.12~13
      criteria:
      - 1.B1
    - id: 1b-3
      content: |
        ㉡에서 $f(-2a)(2f(a))=f(-2a)(-f(a))$, $3f(-2a)f(a)=0$, $\therefore f(-2a)=0$ ($\because f(a)\ne0$)이다.
      source_flow: PDF p.12~13
      criteria:
      - 1.B2
    - id: 1b-4
      content: |
        ㉢에서 $f(2a)(-f(a))=f(2a)(2f(a))$, $3f(2a)f(a)=0$, $\therefore f(2a)=0$ ($\because f(a)\ne0$)이다.
      source_flow: PDF p.12~13
      criteria:
      - 1.B3
    - id: 1b-5
      content: |
        $f(0)=0$, $f(2a)=0$, $f(-2a)=0$을 만족시키는 최고차항의 계수가 $1$인 삼차함수 $f(x)$는 $f(x)=x(x-2a)(x+2a)$이다.
      source_flow: PDF p.12~13
      criteria:
      - 1.B4
    - id: 1b-6
      content: |
        따라서 조건 (가)에 의해 $f(a)=a(-a)(3a)=-3a^{3}=-\dfrac{81}{8}$, $a^{3}=\dfrac{27}{8}$, $\therefore a=\dfrac32$이다.
      source_flow: PDF p.12~13
      criteria:
      - 1.B5
