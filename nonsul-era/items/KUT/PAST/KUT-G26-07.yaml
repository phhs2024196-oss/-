stimuli: []
stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $f(1)=0$
  (나) 모든 실수 $x$에 대하여 부등식 $(x-3)f(x)\ge0$이 성립한다.

  실수 $k$에 대하여 $x$에 대한 방정식 $f(x)-(x-1)f'(k)=0$의 서로 다른 실근의 개수가 $2$가 되도록 하는 모든 실수 $k$의 값의 합을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: 20/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 $f(1)=0$이므로 $f(x)=(x-1)(x^{2}+ax+b)$ ($a$, $b$는 상수) ㉠이다. 조건 (나)와 ㉠으로부터 모든 실수 $x$에 대하여 $(x-3)(x-1)(x^{2}+ax+b)\ge0$이어야 하므로 $x^{2}+ax+b=(x-3)(x-1)$이다. 따라서 $f(x)=(x-1)^{2}(x-3)=x^{3}-5x^{2}+7x-3$이고 $f'(x)=3x^{2}-10x+7$이다.
      source_flow: PDF p.15~16
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        주어진 방정식 $f(x)-(x-1)f'(k)=0$은 $(x-1)(x^{2}-4x+3-f'(k))=0$이므로 서로 다른 실근의 개수가 $2$가 되는 경우는 다음 두 가지뿐이다.
      source_flow: PDF p.15~16
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        ① 방정식 $x^{2}-4x+3-f'(k)=0$이 $1$이 아닌 중근을 갖는 경우: 이차방정식이 중근을 갖기 위해서는 $f'(k)=-1$이어야 하므로 $f'(k)+1=(3k-4)(k-2)=0$, $\therefore k=\dfrac43,\ 2$이다. 이때 중근은 $x=2$이므로 $1$이 아닌 중근을 갖는다.
      source_flow: PDF p.15~16
      criteria:
      - 1.B2
      - 1.B3
    - id: 1b-4
      content: |
        ② 방정식 $x^{2}-4x+3-f'(k)=0$의 한 근이 $1$인 경우: 이차방정식의 한 근이 $1$이기 위해서는 $f'(k)=0$이어야 하므로 $f'(k)=(3k-7)(k-1)=0$, $\therefore k=\dfrac73,\ 1$이다. 이때 방정식 $x^{2}-4x+3-f'(k)=0$의 근은 $x=1,\ 3$이다.
      source_flow: PDF p.15~16
      criteria:
      - 1.B4
      - 1.B5
    - id: 1b-5
      content: |
        따라서 ①, ②로부터 모든 실수 $k$의 값의 합은 $\dfrac43+2+\dfrac73+1=\dfrac{20}{3}$이다.
      source_flow: PDF p.15~16
      criteria:
      - 1.B6
