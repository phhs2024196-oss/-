stem: |
  두 점 P와 Q는 시각 $t=0$일 때 각각 점 A(3)과 점 B(20)에서 출발하여 수직선 위를 움직인다. 두 점 P, Q의 시각 $t$($t\ge0$)에서의 속도는 각각

  $$v_{1}(t)=3t^{2}+4t-20,\qquad v_{2}(t)=2t+9$$

  이다. 출발한 시각부터 두 점 P, Q 사이의 거리가 처음으로 $12$가 될 때까지 점 P가 움직인 거리를 구하시오.
