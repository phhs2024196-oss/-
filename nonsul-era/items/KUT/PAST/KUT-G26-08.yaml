  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 P는 점 A(3)에서 출발하고 속도가 $v_{1}(t)=3t^{2}+4t-20$이므로 시각 $t$에서의 위치를 $s_{1}(t)$라 하면 $s_{1}(t)=3+\displaystyle\int_{0}^{t}(3s^{2}+4s-20)\,ds=t^{3}+2t^{2}-20t+3$ ㉠이다.
      source_flow: PDF p.18~19
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        점 Q는 B(20)에서 출발하고 속도가 $v_{2}(t)=2t+9$이므로 시각 $t$에서의 위치를 $s_{2}(t)$라 하면 $s_{2}(t)=20+\displaystyle\int_{0}^{t}(2s+9)\,ds=t^{2}+9t+20$ ㉡이다.
      source_flow: PDF p.18~19
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        두 점 P, Q 사이의 거리가 $12$가 되는 시각은 $\lvert s_{1}(t)-s_{2}(t)\rvert=12$를 만족시켜야 한다. ㉠, ㉡에서 $\lvert t^{3}+t^{2}-29t-17\rvert=12$, 즉 $t^{3}+t^{2}-29t-17=12$ 또는 $t^{3}+t^{2}-29t-17=-12$이다. ① $t^{3}+t^{2}-29t-29=0$, $(t+1)(t+\sqrt{29})(t-\sqrt{29})=0$, $\therefore t=\sqrt{29}$ ($\because t\ge0$) ② $t^{3}+t^{2}-29t-5=0$, $(t-5)(t^{2}+6t+1)=0$, $\therefore t=5$ ($\because t\ge0$)이다. 따라서 두 점 P, Q 사이의 거리가 처음으로 $12$가 되는 시각은 $t=5$이다.
      source_flow: PDF p.18~19
      criteria:
      - 1.B3
    - id: 1b-4
      content: |
        $v_{1}(t)=3t^{2}+4t-20=(3t+10)(t-2)$이므로 $0\le t<2$일 때 $v_{1}(t)<0$이고, $t\ge2$일 때 $v_{1}(t)\ge0$이다. 그러므로 점 P가 시각 $t=0$에서 $t=5$까지 움직인 거리는 $\displaystyle\int_{0}^{5}\lvert v_{1}(t)\rvert\,dt=-\int_{0}^{2}v_{1}(t)\,dt+\int_{2}^{5}v_{1}(t)\,dt=-\left[t^{3}+2t^{2}-20t\right]_{0}^{2}+\left[t^{3}+2t^{2}-20t\right]_{2}^{5}=123$이다.
      source_flow: PDF p.18~19
      criteria:
      - 1.B4
