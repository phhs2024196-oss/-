- id: 9-2
  stem: |
    $M=5$, $m=-3$을 만족시키는 순서쌍 $(a,b)$를 모두 구하시오. (8점)
  points: 8
  depends_on:
  - 9-1
  answer:
    kind: set
    value: (8, 1/4), (-8, 1/4)
    equivalents: []
    tolerance: null
  solutions:
  - id: S92-B
    audience: B
    method_no: 1
    steps:
    - id: 92b-1
      content: |
        ㉠으로부터 함수 $g(t)=-\left(t+\dfrac a2\right)^{2}+\dfrac{a^{2}}{4}+b+1$ $\left(-\dfrac12\le t\le\dfrac12\right)$이라 하고 대칭축 $t=-\dfrac a2$를 기준으로 경우를 네 가지로 나눈다.
      source_flow: PDF p.21~23
      criteria:
      - 9-2.B1
    - id: 92b-2
      content: |
        ① $-\dfrac a2\le-\dfrac12$ (즉, $a\ge1$)일 때, $M=g\left(-\dfrac12\right)$, $m=g\left(\dfrac12\right)$이므로 $\dfrac a2+b+\dfrac34=5$, $-\dfrac a2+b+\dfrac34=-3$이다. 이를 연립하면 $a=8$, $b=\dfrac14$이다.
      source_flow: PDF p.21~23
      criteria:
      - 9-2.B1
    - id: 92b-3
      content: |
        ② $-\dfrac12<-\dfrac a2\le0$ (즉, $0\le a<1$)일 때, $M=g\left(-\dfrac a2\right)$, $m=g\left(\dfrac12\right)$이므로 $\dfrac{a^{2}}{4}+b+1=5$, $-\dfrac a2+b+\dfrac34=-3$이다. $b$를 소거하면 $a^{2}+2a-31=0$, $\therefore a=-1\pm4\sqrt2$이나 조건 $0\le a<1$을 만족시키지 못한다. ③ $0<-\dfrac a2<\dfrac12$ (즉, $-1<a<0$)일 때, $M=g\left(-\dfrac a2\right)$, $m=g\left(-\dfrac12\right)$이므로 $\dfrac{a^{2}}{4}+b+1=5$, $\dfrac a2+b+\dfrac34=-3$이다. $b$를 소거하면 $a^{2}-2a-31=0$, $\therefore a=1\pm4\sqrt2$이나 조건 $-1<a<0$을 만족시키지 못한다.
      source_flow: PDF p.21~23
      criteria:
      - 9-2.B1
    - id: 92b-4
      content: |
        ④ $-\dfrac a2\ge\dfrac12$ (즉, $a\le-1$)일 때, $M=g\left(\dfrac12\right)$, $m=g\left(-\dfrac12\right)$이므로 $-\dfrac a2+b+\dfrac34=5$, $\dfrac a2+b+\dfrac34=-3$이다. 이를 연립하면 $a=-8$, $b=\dfrac14$이다.
      source_flow: PDF p.21~23
      criteria:
      - 9-2.B2
    - id: 92b-5
      content: |
        따라서 ①, ②, ③, ④에 의해 순서쌍 $(a,b)$는 $\left(8,\dfrac14\right)$, $\left(-8,\dfrac14\right)$이다.
      source_flow: PDF p.21~23
      criteria:
      - 9-2.B2
