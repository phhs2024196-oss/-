stimuli: []
stem: |
  실수 $a$, $b$에 대하여 정의역이 $\left\{x\mid 0\le x\le\dfrac\pi3\right\}$인 함수

  $$f(x)=\cos^{2}\left(x-\dfrac\pi6\right)+a\cos\left(x+\dfrac\pi3\right)+b$$

  의 최댓값을 $M$, 최솟값을 $m$이라 할 때, 다음 물음에 답하시오.
subparts:
- id: 9-1
  stem: |
    $a=\dfrac12$, $b=1$일 때, $M$과 $m$의 값을 각각 구하시오. (8점)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: M = 33/16; m = 3/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S91-B
    audience: B
    method_no: 1
    steps:
    - id: 91b-1
      content: |
        $x-\dfrac\pi6=\theta$ $\left(-\dfrac\pi6\le\theta\le\dfrac\pi6\right)$로 놓으면 $\cos\left(x+\dfrac\pi3\right)=\cos\left(\theta+\dfrac\pi2\right)=-\sin\theta$, $\cos^{2}\left(x-\dfrac\pi6\right)=1-\sin^{2}\theta$이므로 $f(x)=-\sin^{2}\theta-a\sin\theta+b+1$이다. 이때 $\sin\theta=t$ $\left(-\dfrac12\le t\le\dfrac12\right)$로 놓으면 $f(x)=-t^{2}-at+b+1=-\left(t+\dfrac a2\right)^{2}+\dfrac{a^{2}}{4}+b+1$ ㉠이다.
      source_flow: PDF p.21~23
      criteria:
      - 9-1.B1
    - id: 91b-2
      content: |
        $a=\dfrac12$, $b=1$일 때 $f(x)=-t^{2}-\dfrac12t+2=-\left(t+\dfrac14\right)^{2}+\dfrac{33}{16}$이다. 따라서 함수 $f(x)$의 최댓값은 $t=-\dfrac14$일 때 $M=\dfrac{33}{16}$이고, 최솟값은 $t=\dfrac12$일 때 $m=\dfrac32$이다.
      source_flow: PDF p.21~23
      criteria:
      - 9-1.B2
      - 9-1.B3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
