stimuli: []
stem: |
  자연수 $n$과 $0<t<n$인 실수 $t$에 대하여 함수

  $$f(x)=x^{2}-2nx+n^{2}$$

  의 그래프 위의 점 $\mathrm{P}(t,f(t))$에서의 접선을 $l_{n}$이라 하자. 곡선 $y=f(x)$와 접선 $l_{n}$ 및 $y$축으로 둘러싸인 부분의 넓이를 $a_{n}$, 접선 $l_{n}$과 $x$축 및 $y$축으로 둘러싸인 부분의 넓이를 $b_{n}$이라 할 때, 다음 물음에 답하시오.
subparts:
- id: 10-1
  stem: |
    $a_{3}+b_{3}$의 값이 자연수가 되도록 하는 실수 $t$의 개수를 구하시오. (8점)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S101-B
    audience: B
    method_no: 1
    steps:
    - id: 101b-1
      content: |
        $n=3$인 경우에 대하여 $f'(x)=2x-6$이므로 접선 $l_{3}$의 방정식은 $y=(2t-6)(x-t)+f(t)$이다. 따라서 $a_{3}=\displaystyle\int_{0}^{t}\left[f(x)-\{(2t-6)(x-t)+f(t)\}\right]dx=\left[\dfrac{x^{3}}{3}-3x^{2}+9x-(2t-6)\left(\dfrac12x^{2}-tx\right)-(t^{2}-6t+9)x\right]_{0}^{t}=\dfrac13t^{3}$이다.
      source_flow: PDF p.26~28
      criteria:
      - 10-1.B1
    - id: 101b-2
      content: |
        접선 $l_{3}$의 $x$절편은 $(2t-6)(x-t)+f(t)=0$에서 $x=\dfrac{t+3}{2}$, $y$절편은 $y=(2t-6)(-t)+f(t)=9-t^{2}$이므로 $b_{3}=\dfrac12\times(9-t^{2})\times\dfrac{t+3}{2}=\dfrac14(9-t^{2})(t+3)$이다.
      source_flow: PDF p.26~28
      criteria:
      - 10-1.B2
    - id: 101b-3
      content: |
        $g(t)=a_{3}+b_{3}$으로 놓으면 $g(t)=\dfrac1{12}t^{3}-\dfrac34t^{2}+\dfrac94t+\dfrac{27}{4}$이므로 $g'(t)=\dfrac14t^{2}-\dfrac32t+\dfrac94=\dfrac14(t-3)^{2}$이다. 따라서 $0<t<3$인 실수 $t$에 대하여 $g'(t)>0$이므로 함수 $g(t)$는 증가한다. $g(0)=\dfrac{27}{4}$이고 $g(3)=\dfrac{27}{3}=9$이므로 $0<t<3$에서 자연수가 되는 $g(t)$의 값은 $7$, $8$이다. 따라서 $a_{3}+b_{3}$의 값이 자연수가 되도록 하는 실수 $t$의 개수는 $2$이다.
      source_flow: PDF p.26~28
      criteria:
      - 10-1.B3
