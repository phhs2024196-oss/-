- id: 10-2
  stem: |
    $a_{n}+b_{n}$의 값이 자연수가 되도록 하는 실수 $t$의 개수를 $c_{n}$이라 할 때, $c_{5}+c_{6}+c_{7}$의 값을 구하시오. (8점)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '56'
    equivalents: []
    tolerance: null
  solutions:
  - id: S102-B
    audience: B
    method_no: 1
    steps:
    - id: 102b-1
      content: |
        문항 (1)번과 동일한 과정을 거치면 자연수 $n$에 대하여 $f'(x)=2x-2n$이므로 접선 $l_{n}$의 방정식은 $y=(2t-2n)(x-t)+f(t)$이다. 따라서 $a_{n}=\displaystyle\int_{0}^{t}\left[f(x)-\{(2t-2n)(x-t)+f(t)\}\right]dx=\dfrac13t^{3}$이다.
      source_flow: PDF p.26~28
      criteria:
      - 10-2.B1
    - id: 102b-2
      content: |
        접선 $l_{n}$의 $x$절편은 $x=\dfrac{t+n}{2}$, $y$절편은 $y=n^{2}-t^{2}$이므로 $b_{n}=\dfrac12\times(n^{2}-t^{2})\times\dfrac{t+n}{2}$이다. $g_{n}(t)=a_{n}+b_{n}$으로 놓으면 $g_{n}(t)=\dfrac1{12}t^{3}-\dfrac n4t^{2}+\dfrac{n^{2}}{4}t+\dfrac{n^{3}}{4}$이다.
      source_flow: PDF p.26~28
      criteria:
      - 10-2.B1
    - id: 102b-3
      content: |
        $g_{n}'(t)=\dfrac14t^{2}-\dfrac n2t+\dfrac{n^{2}}{4}=\dfrac14(t-n)^{2}$이다. 따라서 $0<t<n$인 실수 $t$에 대하여 $g_{n}'(t)>0$이므로 함수 $g_{n}(t)$는 증가한다.
      source_flow: PDF p.26~28
      criteria:
      - 10-2.B1
    - id: 102b-4
      content: |
        ① $n=5$일 때, $g_{5}(0)=\dfrac{125}{4}$이고 $g_{5}(5)=\dfrac{125}{3}$이므로 $0<t<5$에서 자연수가 되는 $g_{5}(t)$의 값은 $32,\ 33,\ 34,\ \cdots,\ 41$이다. 그러므로 $c_{5}=10$이다.
      source_flow: PDF p.26~28
      criteria:
      - 10-2.B2
    - id: 102b-5
      content: |
        ② $n=6$일 때, $g_{6}(0)=\dfrac{216}{4}=54$이고 $g_{6}(6)=\dfrac{216}{3}=72$이므로 $0<t<6$에서 자연수가 되는 $g_{6}(t)$의 값은 $55,\ 56,\ 57,\ \cdots,\ 71$이다. 그러므로 $c_{6}=17$이다.
      source_flow: PDF p.26~28
      criteria:
      - 10-2.B3
    - id: 102b-6
      content: |
        ③ $n=7$일 때, $g_{7}(0)=\dfrac{343}{4}$이고 $g_{7}(7)=\dfrac{343}{3}$이므로 $0<t<7$에서 자연수가 되는 $g_{7}(t)$의 값은 $86,\ 87,\ 88,\ \cdots,\ 114$이다. 그러므로 $c_{7}=29$이다.
      source_flow: PDF p.26~28
      criteria:
      - 10-2.B4
    - id: 102b-7
      content: |
        따라서 ①, ②, ③으로부터 $c_{5}+c_{6}+c_{7}=10+17+29=56$이다.
      source_flow: PDF p.26~28
      criteria:
      - 10-2.B5
