stimuli:
- label: 제시문
  body: |
    코리아텍 재학중인 A군은 식목일을 맞이하여 2018년 4월 5일에 나무 한 그루를 심었다. 자료에 의하면 심은 나무는 매년 가을에 50개의 열매가 열리며, 그 해 겨울에 열매들은 땅에 떨어져서 대부분 동물들의 먹잇감이 되고 2개만이 살아남는다고 한다. 살아남은 열매는 성장하여 다다음해 가을에 마찬가지로 50개의 열매를 맺게 된다. 이와 같이 나무가 번식해 나갈 때, 다음 물음에 답하여라. (단, 나무의 수명이 다 되어 죽는 일은 없다고 가정하고, 나무를 심은지 $n$년 후 가을에 열매가 열리는 나무의 수를 $a_n$이라고 한다.)
stem: |
  다음 제시문을 읽고 물음에 답하시오. (20점)
subparts:
- id: 1-1
  stem: |
    $a_n$, $a_{n+1}$, $a_{n+2}$ 사이의 관계식을 구하고 풀이과정을 설명하여라. (10점)
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: a_{n+2}=a_{n+1}+2a_n (n>=0)
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $n$년 후 가을에 열매가 열리는 $a_n$그루의 나무들은 그 해 겨울에 2개의 열매를 남기게 된다. 남겨진 열매는 $(n+2)$년 후 가을에 $2a_n$그루의 나무가 된다.
      source_flow: PDF p.11
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $(n+1)$년 후 가을에 열매가 열리는 $a_{n+1}$그루의 나무들은 다음 해에도 그대로 한 그루씩의 나무가 되므로, 이 경우 $(n+2)$년 후 가을에 $a_{n+1}$그루의 나무가 된다. 따라서 $(n+2)$년 후 가을에 열매가 열리는 나무의 수 $a_{n+2}$는
        $$a_{n+2}=a_{n+1}+2a_n\ (\text{단, }n\ge 0)$$
        이다.
      source_flow: PDF p.11
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: '평가항목 1: $n$년 후 열매가 열리는 $a_n$그루가 겨울에 2개씩의 열매를 남기고, 그것이 $(n+2)$년 후 가을에 $2a_n$그루의 나무가 됨을 서술했다.'
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: '평가항목 2: $(n+1)$년 후의 $a_{n+1}$그루가 $(n+2)$년 후에도 $a_{n+1}$그루로 남음을 밝히고 $a_{n+2}=a_{n+1}+2a_n$(단, $n\ge 0$)을 구했다.'
      steps:
      - 11b-2
      depends_on:
      - 1-1.M1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    10년 후 가을에 나무의 수인 $a_{10}$을 구하여라. (10점)
  points: 10
  depends_on:
  - 1-1
  answer:
    kind: value
    value: '683'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        2018년 가을, 즉 0년 후 가을에 나무의 수는 1그루이므로 $a_0=1$이다. 또한 1년 후 가을에 나무의 수도 1그루이므로 $a_1=1$이다.
      source_flow: PDF p.11
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        따라서 $a_0=a_1=1$이므로 (1)에서 구한 관계식을 이용하면,
        $a_2=a_1+2a_0=1+2\times1=3$, $a_3=a_2+2a_1=3+2\times1=5$, $a_4=a_3+2a_2=5+2\times3=11$, $a_5=a_4+2a_3=11+2\times5=21$, $a_6=a_5+2a_4=21+2\times11=43$, $a_7=a_6+2a_5=43+2\times21=85$, $a_8=a_7+2a_6=85+2\times43=171$, $a_9=a_8+2a_7=171+2\times85=341$, $a_{10}=a_9+2a_8=341+2\times171=683$.
      source_flow: PDF p.12
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 5
      evidence: '평가항목 3: $a_0=1$, $a_1=1$ 을 구했다.'
      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 5
      evidence: '평가항목 4: 관계식을 이용해 $a_2$ 부터 차례로 계산하여 $a_{10}=683$ 을 구했다.'
      steps:
      - 12b-2
      depends_on:
      - 1-2.M1
