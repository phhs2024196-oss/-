stimuli:
- label: 제시문
  body: |
    코리아텍 재학중인 A군은 과제 관련된 곡선을 수성펜으로 오른쪽 그림과 같이 그렸다. 어느 날 수성펜으로 그렸다는 사실을 잊은 채 비를 맞아 곡선의 일부분이 지워져 버렸다. 그래서 A군은 다음과 같은 곡선의 성질을 이용하여 지워진 부분을 복구하려고 한다.

    [그림 1: $x$축 위 $-3$과 $5$를 표시한 좌표평면. $x=-3$에서 시작해 아래로 내려가 $x=0$ 부근에서 최저점에 이르는 실선 곡선, $x=0$ 오른쪽에서 위로 올라가 $x=5$에서 $x$축에 닿는 점선(지워진 부분) 곡선]
- label: 제시문
  body: |
    a. 구간 $[-3,0]$에서 곡선을 나타내는 함수는 $y=x^2-9$이다.
    b. 구간 $(0,5]$에서 곡선을 나타내는 함수는 $x$에 관한 2차 다항함수이다.
    c. 곡선을 나타내는 함수와 함수의 도함수 모두 $x=0$에서 연속이다.
    d. 곡선을 나타내는 함수의 그래프는 점 $(5,0)$을 지난다.
stem: |
  다음 제시문을 읽고 물음에 답하시오. (20점)
subparts:
- id: 1-1
  stem: |
    구간 $(0,5]$에서 곡선을 나타내는 함수를 구하여라. (10점)
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 9*x**2/25-9
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        구간 $[-3,0]$에서 곡선을 나타내는 함수를 $y=f(x)$, 구간 $(0,5]$에서 곡선을 나타내는 함수를 $y=g(x)$라 하자. 성질 a에 의하면 $f(x)=x^2-9$임을 알 수 있고, 성질 b에 의하면 $g(x)=ax^2+bx+c$라고 가정할 수 있다. 또한 성질 c를 수식으로 표현하면 다음과 같다.
        $$\lim_{x\to0-}f(x)=\lim_{x\to0+}g(x)\ \Rightarrow\ -9=c$$
        $$\lim_{x\to0-}f'(x)=\lim_{x\to0+}g'(x)\ \Rightarrow\ 0=b$$
      source_flow: PDF p.13
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        마지막으로 성질 d에 의하면, $g(5)=0\Rightarrow 25a+5b+c=0\Rightarrow 25a-9=0\Rightarrow a=\dfrac{9}{25}$이다. 따라서 구간 $(0,5]$에서 곡선을 나타내는 함수는 $y=\dfrac{9}{25}x^2-9$이다.
      source_flow: PDF p.13-14
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: '평가항목 1: 성질 c를 극한식으로 표현하여 $c=-9$, $b=0$ 을 구했다.'
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: '평가항목 2: 성질 d 로 $a=\dfrac{9}{25}$ 를 구하고 $y=\dfrac{9}{25}x^2-9$ 를 얻었다.'
      steps:
      - 11b-2
      depends_on:
      - 1-1.M1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    복구된 부분을 포함한 전체 곡선과 $x$축으로 둘러싸인 영역의 넓이를 구하여라. (10점)
  points: 10
  depends_on:
  - 1-1
  answer:
    kind: value
    value: '48'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        전체 곡선과 $x$축으로 둘러싸인 영역의 넓이 $S$는
        $$S=\int_{-3}^{0}\lvert f(x)\rvert dx+\int_{0}^{5}\lvert g(x)\rvert dx$$
        이다.
      source_flow: PDF p.14
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        정적분을 계산하면 다음과 같다.
        $$S=\int_{-3}^{0}(9-x^2)dx+\int_{0}^{5}\left(9-\dfrac{9}{25}x^2\right)dx=\left[9x-\dfrac{x^3}{3}\right]_{-3}^{0}+\left[9x-\dfrac{3}{25}x^3\right]_{0}^{5}=18+30=48$$
      source_flow: PDF p.14
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 5
      evidence: '평가항목 3: $S=\int_{-3}^{0}\lvert f(x)\rvert dx+\int_{0}^{5}\lvert g(x)\rvert dx$ 로 넓이를 정적분으로 나타냈다.'
      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 5
      evidence: '평가항목 4: 정적분을 계산하여 $18+30=48$ 을 구했다.'
      steps:
      - 12b-2
      depends_on:
      - 1-2.M1
