    method_no: 1
    steps:
    - id: 12b-1
      content: |
        주머니 B에서 뽑은 공이 흰 공일 때, 주머니 A에서 주머니 B로 옮긴 공도 흰 공이었을 확률은 다음의 조건부확률로 표현할 수 있다.
        $$P(A\mid B)=\dfrac{P(A\cap B)}{P(B)}$$
      source_flow: PDF p.16
