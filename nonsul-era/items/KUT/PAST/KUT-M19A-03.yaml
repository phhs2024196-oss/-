stimuli:
- label: 제시문
  body: |
    표본공간 $S$에서 각각의 근원사건이 일어날 가능성이 모두 같을 때, 사건 $A$가 일어날 수학적 확률은 $P(A)=\dfrac{n(A)}{n(S)}$이다.
stem: |
  다음 제시문을 읽고 물음에 답하시오. (20점)

  주머니 A에는 흰 공 2개, 검은 공 3개가 들어 있고, 주머니 B에는 흰 공 3개, 검은 공 5개가 들어 있다. 주머니 A에서 1개의 공을 뽑아 그것을 주머니 B에 넣고, 주머니 B에서 다시 1개를 뽑을 때 다음 확률을 구하여라.
subparts:
- id: 1-1
  stem: |
    주머니 B에서 뽑은 공이 흰 공일 확률 (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 17/45
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        주머니 A에서 흰 공을 뽑는 사건을 $A$라고 하고, 주머니 B에서 흰 공을 뽑는 사건을 $B$라고 하자. 이 때 주머니 B에서 흰 공을 뽑을 확률은 두 가지 경우로 나누어서 생각할 수 있다.
        (i) 주머니 A에서 흰 공을 뽑고 그 공을 주머니 B에 넣은 다음, 주머니 B에서 흰 공을 꺼낼 확률은
        $$P(A\cap B)=P(A)P(B\mid A)=\dfrac{2}{5}\times\dfrac{4}{9}=\dfrac{8}{45}$$
        (ii) 주머니 A에서 검은 공을 뽑고 그 공을 주머니 B에 넣은 다음, 주머니 B에서 흰 공을 꺼낼 확률은
        $$P(A^{C}\cap B)=P(A^{C})P(B\mid A^{C})=\dfrac{3}{5}\times\dfrac{3}{9}=\dfrac{9}{45}$$
      source_flow: PDF p.15
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        따라서 $P(B)=P(A\cap B)+P(A^{C}\cap B)=\dfrac{8}{45}+\dfrac{9}{45}=\dfrac{17}{45}$
      source_flow: PDF p.16
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: '평가항목 1: 처음 뽑은 공의 색으로 경우를 나누어 $P(A\cap B)=\dfrac{8}{45}$, $P(A^{C}\cap B)=\dfrac{9}{45}$ 를 구했다.'
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: '평가항목 2: 두 확률을 더해 $P(B)=\dfrac{17}{45}$ 를 구했다.'
      steps:
      - 11b-2
      depends_on:
      - 1-1.M1
  outcome_codes:
