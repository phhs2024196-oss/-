    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    주머니 B에서 뽑은 공이 흰 공일 때, 주머니 A에서 주머니 B로 옮긴 공도 흰 공이었을 확률 (10점)
  points: 10
