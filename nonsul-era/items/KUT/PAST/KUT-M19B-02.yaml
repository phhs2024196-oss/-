stimuli:
- label: 가
  body: |
    함수 $f(x)$에서 $x=a$를 포함하는 어떤 열린 구간에 속하는 모든 $x$에 대하여 $f(x)\le f(a)$이면 함수 $f(x)$는 $x=a$에서 극대가 된다고 하고, 그 때의 함숫값 $f(a)$를 극댓값이라고 한다. 또한 $x=a$를 포함하는 어떤 열린 구간에 속하는 모든 $x$에 대하여 $f(x)\ge f(a)$이면 함수 $f(x)$는 $x=a$에서 극소가 된다고 하고, 그 때의 함숫값 $f(a)$를 극솟값이라고 한다. 극댓값과 극솟값을 통틀어 극값이라고 한다.
- label: 나
  body: |
    함수 $f(x)$가 닫힌 구간 $[a,b]$에서 연속이면 함수 $f(x)$는 이 구간에서 반드시 최댓값과 최솟값을 가진다.
stem: |
  다음 제시문을 읽고 물음에 답하시오.

  실수 전체의 집합을 정의역으로 하는 함수 $f(x)=x^3-6x^2+ax-1$에 대하여 다음 물음에 답하여라.
subparts:
- id: 1-1
  stem: |
    함수 $f(x)$가 극댓값과 극솟값을 모두 갖도록 하는 실수 $a$의 값의 범위를 구하여라. (10점)
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: a<12
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        함수 $f(x)$가 극댓값과 극솟값을 모두 갖기 위해서는 함수 $f(x)$의 증감이 2번 바뀌어야 한다. 즉, $f'(x)=3x^2-12x+a=0$이 서로 다른 두 실근을 가져야 한다.
      source_flow: PDF p.34
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        따라서
        $$\dfrac{D}{4}=36-3a>0\ \Leftrightarrow\ 12>a$$
        이어야 한다.
      source_flow: PDF p.35
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: '평가항목 1: 극댓값과 극솟값을 모두 가지려면 $f''(x)=3x^2-12x+a=0$ 이 서로 다른 두 실근을 가져야 함을 서술했다.'
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: '평가항목 2: $\dfrac{D}{4}=36-3a>0$ 에서 $a<12$ 를 구했다.'
      steps:
      - 11b-2
      depends_on:
      - 1-1.M1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    $a=9$인 경우, 즉 $f(x)=x^3-6x^2+9x-1$에 대하여 구간 $[0,4]$에서 함수 $f(x)$의 최댓값과 최솟값을 구하여라. (10점)
  points: 10
  depends_on: []
  answer:
    kind: set
    value: max=3; min=-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $f'(x)=3x^2-12x+9=3(x-1)(x-3)=0$이므로 $x=1$과 $x=3$에서 극값을 갖고, 함수 $f(x)$의 극값은 $f(1)=3$, $f(3)=-1$이다.
      source_flow: PDF p.35
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        최댓값과 최솟값을 구하기 위하여 두 개의 극값과 주어진 구간 $[0,4]$에서의 양 끝점의 함숫값 $f(0)=-1$과 $f(4)=3$을 비교한다. 따라서 최솟값은 $-1$이고 최댓값은 $3$이다.
      source_flow: PDF p.35
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 5
      evidence: '평가항목 3: $f''(x)=3(x-1)(x-3)$ 으로 극값 $f(1)=3$, $f(3)=-1$ 을 구했다.'
      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 5
      evidence: '평가항목 4: 극값과 양 끝점의 함숫값 $f(0)=-1$, $f(4)=3$ 을 비교하여 최댓값 3, 최솟값 $-1$ 을 구했다.'
      steps:
      - 12b-2
      depends_on:
      - 1-2.M1
