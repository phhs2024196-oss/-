    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        연착 시간이 10분 이상이면 논술고사를 치르지 못하므로, 논술고사를 치르지 못할 확률은 $P(X\ge10)$이다.
      source_flow: PDF p.37
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        따라서 $X$의 확률밀도함수를 이용하면
        $$P(X\ge10)=\int_{10}^{15}f(x)dx=-\dfrac{a}{15}\left[\dfrac{x^2}{2}-15x\right]_{10}^{15}=-\dfrac{a}{15}\times\left(-\dfrac{25}{2}\right)=\dfrac{1}{12}$$
        이다.
      source_flow: PDF p.37
      criteria:
      - 1-2.A1
