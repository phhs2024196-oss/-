stimuli: []
stem: |
  서울에 거주하는 A군은 코리아텍 논술고사를 치르기 위해 시험 당일 서울역에서 KTX를 타고 천안아산역까지 이동하기로 계획을 잡았다. 최근 5개년 자료를 분석한 결과 오전 9시 정각에 도착 예정인 KTX의 실제 도착 시각은 오전 8시 55분에서 오전 9시 15분 사이였고, 실제 도착 시각에서 도착 예정 시각을 뺀 차를 확률변수 $X$(분)이라 할 때 $X$의 확률밀도함수는
  $$f(x)=\begin{cases}\dfrac{a}{5}(x+5)&(-5\le x\le0)\\-\dfrac{a}{15}(x-15)&(0<x\le15)\end{cases}$$
  이라 한다. (단, $a$는 상수) 다음 물음에 답하여라.
subparts:
- id: 1-1
  stem: |
    확률밀도함수 $f(x)$를 이용하여 확률 $P(X\le0)$를 구하여라. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $f(x)$가 확률밀도함수이므로 $x$축 및 두 직선 $y=\dfrac{a}{5}(x+5)$, $y=-\dfrac{a}{15}(x-15)$로 둘러싸인 도형의 넓이가 1이 되어야 한다. 따라서
        $$\dfrac{1}{2}\times20\times a=1\ \Leftrightarrow\ a=\dfrac{1}{10}$$
      source_flow: PDF p.36
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        또한 확률 $P(X\le0)=P(-5\le X\le0)$는 $x$축 및 두 직선 $y=\dfrac{a}{5}(x+5)$, $x=0$으로 둘러싸인 도형의 넓이이므로, 따라서
        $$P(X\le0)=\int_{-5}^{0}f(x)dx=\dfrac{a}{5}\left[\dfrac{x^2}{2}+5x\right]_{-5}^{0}=\dfrac{a}{5}\times\dfrac{25}{2}=\dfrac{1}{4}$$
      source_flow: PDF p.36
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: '평가항목 1: 확률밀도함수와 $x$축 사이의 넓이가 1임을 이용해 $a=\dfrac{1}{10}$ 을 구했다.'
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: '평가항목 2: $P(X\le0)=\int_{-5}^{0}f(x)dx=\dfrac{1}{4}$ 을 구했다.'
      steps:
      - 11b-2
      depends_on:
      - 1-1.M1
