- id: 1-2
  stem: |
    연착 시간이 10분 이상이면 시험장에 입실할 수 없어 논술고사를 치를 수 없게 된다. 논술고사를 치르지 못할 확률을 구하여라. (10점)
  points: 10
  depends_on:
