stimuli: []
stem: |
  함수 $f(x)=x^3-3ax^2+2a^2x-2a^3$ 위의 점 A$(t,f(t))$에서 접선의 기울기가 최소일 때, 점 A에서 접선 방정식의 $x$절편을 $g(a)$라 하자. $g'(2)$의 값을 구하는 과정을 서술하시오. (단, $a$는 실수)
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 A$(t,t^3-3at^2+2a^2t-2a^3)$이라 하자. $f'(x)=3x^2-6ax+2a^2$이므로 점 A에서 접선의 기울기는 $3t^2-6at+2a^2=3(t-a)^2-a^2$ ㉠이다.
      source_flow: PDF p.3
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ㉠에서 접선의 기울기가 최소일 때는 $t=a$이고, 이때 접선의 방정식은 $y=-a^2(x-a)-2a^3$ ㉡이다.
      source_flow: PDF p.3
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        ㉡에서 접선의 $x$절편은 $g(a)=-a$이고, 따라서 $g'(2)=-1$이다.
      source_flow: PDF p.3
      criteria:
      - 1.M3
