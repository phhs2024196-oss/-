stimuli: []
stem: |
  실수 $a$에 대하여 함수 $f(x)$를

  $$f(x)=\dfrac{x^2+2ax-3a}{x^2+(a-2)x+4}$$

  라 하자. 함수 $f(x)$가 실수 전체에서 연속이 될 때, 실수 $a$의 범위를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: -2 < a < 6
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        실수 전체의 집합에서 $f(x)$가 연속이 되려면 모든 실수 $x$에 대하여 $x^2+(a-2)x+4\ne0$을 만족시켜야 한다.
      source_flow: PDF p.3
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        즉 이차방정식 $x^2+(a-2)x+4=0$의 해가 존재하지 않아야 하므로 $D=(a-2)^2-16<0$이다.
      source_flow: PDF p.3
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        이를 풀면 $-2<a<6$이다.
      source_flow: PDF p.3
      criteria:
      - 1.M3
