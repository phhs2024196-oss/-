stimuli: []
stem: |
  모든 실수 $x$에 대하여 부등식 $-\cos^2x-3\sin x+8\ge k$ (단, $k$는 실수)가 항상 성립할 때, 실수 $k$의 최댓값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=-\cos^2x-3\sin x+8$이라 하자. $\sin^2x+\cos^2x=1$로부터 $y=\sin^2x-3\sin x+7$이다.
      source_flow: PDF p.4
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\sin x=t$ $(-1\le t\le1)$이라 하면 $y=t^2-3t+7=\left(t-\dfrac32\right)^2+\dfrac{19}{4}$이다.
      source_flow: PDF p.4
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $-1\le t\le1$일 때 $y$의 최솟값은 $t=1$일 때의 함숫값 $5$이다. 따라서 부등식이 항상 성립하려면 $k\le5$이어야 하고 $k$의 최댓값은 $5$이다.
      source_flow: PDF p.4
      criteria:
      - 1.M3
  # 채점기준 미공개 — 단계별 추정
