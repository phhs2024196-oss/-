stem: |
  등차수열 $\{a_n\}$과 등비수열 $\{b_n\}$이 다음 조건을 만족시킨다.

  (가) $b_1=2$
  (나) 등비수열 $\{b_n\}$의 공비는 $1$이 아니다.
  (다) $a_1=b_2,\ a_2=b_1,\ a_3=b_3$

  $|a_{10}|+|b_{10}|$의 값을 구하는 과정을 서술하시오.
