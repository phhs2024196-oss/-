  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        등차수열 $\{a_n\}$의 첫째항을 $a$, 공차를 $d$, 등비수열 $\{b_n\}$의 공비를 $r$이라 하자. 조건 (가)에서 $b_n=2\times r^{n-1}$이므로 조건 (다)는 $a=2r$ ㉠, $a+d=2$ ㉡, $a+2d=2r^2$ ㉢이다.
      source_flow: PDF p.4
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ㉠에서 $r=\dfrac a2$, ㉡에서 $d=2-a$이므로 ㉢에 대입하면 $a+2(2-a)=2\left(\dfrac a2\right)^2$, 즉 $-\dfrac12(a+4)(a-2)=0$이므로 $a=-4$ 또는 $a=2$이다. $a=2$이면 $r=1$이어서 조건 (나)에 위배되므로 $a=-4$, $r=-2$, $d=6$이다.
      source_flow: PDF p.4
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $a_n=-4+6(n-1)$, $b_n=2(-2)^{n-1}$이므로 $a_{10}=50$, $b_{10}=-1024$이고 $|a_{10}|+|b_{10}|=1074$이다.
      source_flow: PDF p.4
      criteria:
      - 1.M3
