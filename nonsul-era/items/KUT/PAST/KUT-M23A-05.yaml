stem: |
  두 다항함수 $f(x)$, $g(x)$를

  $$f(x)=x^3+2x\displaystyle\int_0^1g(t)\,dt,\qquad g(x)=3x^2+x\displaystyle\int_0^1f(t)\,dt$$

  라 하자. 방정식 $f(x)=xg(x)$의 모든 실근의 합을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: -5/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a=\displaystyle\int_0^1g(t)\,dt$, $b=\displaystyle\int_0^1f(t)\,dt$라 하면 $f(x)=x^3+2ax$ ㉠, $g(x)=3x^2+bx$ ㉡이다.
      source_flow: PDF p.5
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ㉠, ㉡에서 $a=\displaystyle\int_0^1(3t^2+bt)\,dt=1+\dfrac b2$ ㉢, $b=\displaystyle\int_0^1(t^3+2at)\,dt=\dfrac14+a$ ㉣이다. ㉢, ㉣을 연립하면 $a=\dfrac94$, $b=\dfrac52$이다.
      source_flow: PDF p.5
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $f(x)=x^3+\dfrac92x$, $g(x)=3x^2+\dfrac52x$이고 $f(x)=xg(x)$는 $x\left(-2x^2-\dfrac52x+\dfrac92\right)=0$이다. 따라서 모든 실근의 합은 $-\dfrac54$이다.
      source_flow: PDF p.5
      criteria:
      - 1.M3
