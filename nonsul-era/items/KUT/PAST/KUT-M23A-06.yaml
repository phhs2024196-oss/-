stimuli: []
stem: |
  $3$ 이상의 자연수 $n$에 대하여 $\log_9n+\log_9(3\log_3n)$의 값이 자연수가 되도록 하는 $n$의 값을 작은 것부터 차례로 $a_1$, $a_2$, $a_3$, $\cdots$이라 하자. $\dfrac{81a_1}{a_2}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/81
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        식의 값을 자연수 $m$이라 하면 $\log_9(3n\log_3n)=m$, 즉 $3n\log_3n=9^m$ ㉠이다. $n$과 $m$이 자연수이므로 ㉠에서 $\log_3n$은 유리수이어야 하고, $\log_3n=\dfrac pq$ (단, $p$와 $q$는 서로소인 자연수)라 하면 $n=3^{\frac pq}$이어야 하는데 $n$이 자연수이므로 $q=1$이고 $n=3^p$이다.
      source_flow: PDF p.6
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ㉠을 정리하면 $3\cdot3^p\cdot\log_33^p=9^m$, 즉 $p\cdot3^{p+1}=3^{2m}$ ㉡이다. ㉡에서 $p=3^k$ ($k$는 $0$ 이상의 정수) 꼴이고, $k=0$일 때 $m=1$, $k=1$일 때 $m=\dfrac52$, $k=2$일 때 $m=6$, $k=3$일 때 $m=\dfrac{31}{2}$, $k=4$일 때 $m=43$이므로 $p=3^0,3^2,3^4,\cdots$인 경우에만 $m$이 자연수이다.
      source_flow: PDF p.6
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $n=3^p$이므로 $a_1=3^1$, $a_2=3^9$이고 $\dfrac{81a_1}{a_2}=\dfrac{3^4\cdot3^1}{3^9}=\dfrac1{81}$이다.
      source_flow: PDF p.6
      criteria:
      - 1.M3
