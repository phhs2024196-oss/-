stimuli: []
stem: |
  실수 전체에서 정의된 두 함수

  $$f(x)=x^2+2x+5,\qquad g(x)=2^x$$

  가 있다. 닫힌구간 $[-2,1]$에서 함수 $(g\circ f)(x)$의 최댓값과 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: ''
  points: 4
  depends_on: []
  answer:
    kind: value
    value: max = 256; min = 16
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=(x+1)^2+4$이므로 닫힌구간 $[-2,1]$에서 최솟값은 $f(-1)=4$이다.
      source_flow: PDF p.3-4
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        닫힌구간 $[-2,1]$에서 최댓값은 $f(1)=8$이다. 따라서 $t=f(x)$로 놓으면 $4\le t\le8$이다.
      source_flow: PDF p.3-4
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $(g\circ f)(x)=g(t)=2^t$은 $t$에 대하여 증가함수이므로 최솟값은 $g(4)=16$이다.
      source_flow: PDF p.3-4
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        최댓값은 $g(8)=256$이다.
      source_flow: PDF p.3-4
      criteria:
      - 1.M4
