    - id: 1b-1
      content: |
        $\log_{2^3}(x+10)<2\log_{2^2}5$에서 $\dfrac13\log_2(x+10)<\log_25$, 즉 $\log_2(x+10)<\log_25^3$이므로 $x+10<5^3$, $x<115$이다.
      source_flow: PDF p.6-7
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        로그의 진수는 양수이어야 하므로 $x>-10$이다.
      source_flow: PDF p.6-7
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 $-10<x<115$이고 정수 $x$의 개수는 $124$이다.
      source_flow: PDF p.6-7
      criteria:
      - 1.M3
