stimuli: []
stem: |
  $-\dfrac{\pi}{4}\le x\le\dfrac{\pi}{4}$에서 함수 $y=\sin4x$의 그래프가 직선 $y=\dfrac13$과 만나는 두 점의 $x$좌표를 각각 $a$, $b$라 하고, 직선 $y=-\dfrac13$과 만나는 두 점의 $x$좌표를 각각 $c$, $d$라 하자. $\cos[(a+b+c+d)\pi]$의 값을 구하는 과정을 서술하시오.
