  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        구간 $\left[-\dfrac{\pi}{4},\dfrac{\pi}{4}\right]$에서 $y=\sin4x$와 $y=\dfrac13$의 두 교점의 중점의 $x$좌표는 $\dfrac{\pi}{8}$이므로 $a+b=\dfrac{\pi}{4}$이다.
      source_flow: PDF p.9-10
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        같은 방법으로 $y=\sin4x$와 $y=-\dfrac13$의 두 교점의 중점의 $x$좌표는 $-\dfrac{\pi}{8}$이므로 $c+d=-\dfrac{\pi}{4}$이다.
      source_flow: PDF p.9-10
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $a+b+c+d=0$이므로 $\cos[(a+b+c+d)\pi]=\cos0=1$이다.
      source_flow: PDF p.9-10
      criteria:
      - 1.M3
