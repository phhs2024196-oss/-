stem: |
  다항함수 $f(x)$가

  $$\lim_{x\to5}\dfrac{f(x)-3}{x-5}=-2$$

  을 만족시킨다. 함수 $g(x)=x^3f(x)+2x$에 대하여 $g'(5)$를 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '-23'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x\to5$일 때 (분모)$\to0$이고 극한값이 존재하므로 (분자)$\to0$이어야 한다. 즉 $\lim_{x\to5}\{f(x)-3\}=0$이고 $f(x)$는 연속함수이므로 $f(5)=3$이다.
      source_flow: PDF p.12-13
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\lim_{x\to5}\dfrac{f(x)-3}{x-5}=\lim_{x\to5}\dfrac{f(x)-f(5)}{x-5}=f'(5)=-2$이다.
      source_flow: PDF p.12-13
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $g'(x)=3x^2f(x)+x^3f'(x)+2$이다.
      source_flow: PDF p.12-13
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $g'(5)=75f(5)+125f'(5)+2=225-250+2=-23$이다.
      source_flow: PDF p.12-13
      criteria:
      - 1.M4
