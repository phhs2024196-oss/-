    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\int_0^1f'(x)\,dx=a$ ($a$는 상수)라 하면 $f(x)=4x^3-2ax+3$으로 나타낼 수 있다.
      source_flow: PDF p.15-16
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\int_0^1f'(x)\,dx=\Big[4x^3-2ax+3\Big]_0^1=4-2a$이므로 $4-2a=a$에서 $a=\dfrac43$이고 $f(x)=4x^3-\dfrac83x+3$이다.
      source_flow: PDF p.15-16
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\displaystyle\int_0^3f(x)\,dx=\Big[x^4-\dfrac43x^2+3x\Big]_0^3=81-12+9=78$이다.
      source_flow: PDF p.15-16
      criteria:
      - 1.M3
