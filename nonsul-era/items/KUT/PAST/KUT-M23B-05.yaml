stem: |
  모든 실수 $x$에 대하여 함수 $f(x)$가

  $$f(x)=4x^3-2x\displaystyle\int_0^1f'(t)\,dt+3$$

  를 만족시킬 때, $\displaystyle\int_0^3f(x)\,dx$의 값을 구하는 과정을 서술하시오.
subparts:
