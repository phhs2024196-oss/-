stimuli: []
stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$가 다음과 같다.

  $$f(x)=\begin{cases}0&(x\le0)\\ax^2-bx+c&(0<x<1)\\4&(x\ge1)\end{cases}$$

  $y=f(x)$의 그래프와 직선 $y=\dfrac92$가 오직 한 점에서 만날 때, $f\left(\dfrac12\right)$의 값을 구하는 과정을 서술하시오. (단, $a$, $b$, $c$는 실수)
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x=0$에서 연속이므로 $\lim_{x\to0+}f(x)=c=0$이다.
      source_flow: PDF p.18-19
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x=1$에서 연속이므로 $\lim_{x\to1-}f(x)=a-b+c=4$이다.
      source_flow: PDF p.18-19
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $g(x)=ax^2-bx+c$에서 $g'(x)=2ax-b$이므로 $g(x)$는 $x=\dfrac{b}{2a}$에서 극값을 갖는다. $y=f(x)$의 그래프와 직선 $y=\dfrac92$가 오직 한 점에서 만나려면 $0<\dfrac{b}{2a}<1$이고 $g(x)$가 $x=\dfrac{b}{2a}$에서 극댓값 $\dfrac92$를 가져야 한다. 즉 $g\left(\dfrac{b}{2a}\right)=\dfrac92$에서 $b^2=-18a$ ($a<0$, $2a<b<0$)이다.
      source_flow: PDF p.18-19
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $c=0$, $a-b=4$, $b^2=-18a$를 연립하면 $a=-8$, $b=-12$이다.
      source_flow: PDF p.18-19
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        $f(x)=-8x^2+12x$ $(0<x<1)$이므로 $f\left(\dfrac12\right)=4$이다.
      source_flow: PDF p.18-19
      criteria:
      - 1.M5
