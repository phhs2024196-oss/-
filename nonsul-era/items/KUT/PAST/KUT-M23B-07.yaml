stem: |
  함수 $f(x)=\dfrac43x^3-x+3$일 때, 모든 실수 $x$에 대하여 부등식

  $$f(\sin x)\ge k$$

  를 만족시킨다. 실수 $k$의 최댓값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: ''
