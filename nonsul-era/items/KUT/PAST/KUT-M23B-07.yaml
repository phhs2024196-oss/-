    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $t=\sin x$로 놓으면 모든 실수 $x$에 대하여 $-1\le t\le1$이다.
      source_flow: PDF p.21-22
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(\sin x)=f(t)$이고 $f'(t)=4t^2-1$이므로 $f(t)$는 $t=\pm\dfrac12$에서 극값을 갖는다.
      source_flow: PDF p.21-22
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $f(-1)=\dfrac83$, $f\left(-\dfrac12\right)=\dfrac{10}{3}$, $f\left(\dfrac12\right)=\dfrac83$, $f(1)=\dfrac{10}{3}$이므로 닫힌구간 $[-1,1]$에서 $f(t)$의 최솟값은 $\dfrac83$이다.
      source_flow: PDF p.21-22
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서 $k$의 최댓값은 $\dfrac83$이다.
      source_flow: PDF p.21-22
      criteria:
      - 1.M4
