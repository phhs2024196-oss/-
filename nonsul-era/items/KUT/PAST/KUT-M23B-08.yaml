stimuli: []
stem: |
  함수 $f(x)=6x^2-18x$에 대하여 넓이 $S_1$, $S_2$, $S_3$가 다음과 같다.

  (ⅰ) 곡선 $y=f(x)$ $(x\le0)$와 직선 $x=-1$ 및 $x$축으로 둘러싸인 부분의 넓이를 $S_1$이라 하자.
  (ⅱ) 곡선 $y=f(x)$와 $x$축으로 둘러싸인 부분의 넓이를 $S_2$라 하자.
  (ⅲ) 곡선 $y=f(x)$ $(x\ge3)$와 직선 $x=k$ $(k>3)$ 및 $x$축으로 둘러싸인 부분의 넓이를 $S_3$라 하자.

  $S_1$, $\dfrac{S_2}{3}$, $S_3-20$가 이 순서대로 등차수열을 이룰 때, 실수 $k$의 값을 구하는 과정을 서술하시오.
