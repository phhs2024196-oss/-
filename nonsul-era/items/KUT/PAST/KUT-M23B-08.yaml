  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=f(x)$는 $x$축과 $x=0$, $x=3$에서 만나므로 $S_1=\displaystyle\int_{-1}^{0}(6x^2-18x)\,dx=11$이다.
      source_flow: PDF p.24-25
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $S_2=\displaystyle\int_0^3(18x-6x^2)\,dx=27$이다.
      source_flow: PDF p.24-25
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $S_3=\displaystyle\int_3^k(6x^2-18x)\,dx=2k^3-9k^2+27$이다.
      source_flow: PDF p.24-25
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $S_1$, $\dfrac{S_2}{3}$, $S_3-20$이 등차수열이므로 $S_3-20=7$, 즉 $k^2(2k-9)=0$이고 $k>3$이므로 $k=\dfrac92$이다.
      source_flow: PDF p.24-25
      criteria:
      - 1.M4
