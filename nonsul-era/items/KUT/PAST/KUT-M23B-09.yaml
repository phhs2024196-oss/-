    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $b=a+2$이므로 $f(3)=27-9a+b=29-8a$이다.
      source_flow: PDF p.28
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $a\le\dfrac32$이므로 $f(3)=29-8a\ge17$이고, $f(3)$의 최솟값은 $17$이다.
      source_flow: PDF p.28
      criteria:
