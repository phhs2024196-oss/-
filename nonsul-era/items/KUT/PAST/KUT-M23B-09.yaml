stimuli: []
stem: |
  삼차함수 $f(x)=x^3-ax^2+b$에 대하여 함수 $g(x)$를

  $$g(x)=\begin{cases}2x+1&(x<1)\\f(x)&(x\ge1)\end{cases}$$

  이라 하자. 함수 $g(x)$가 실수 전체의 집합에서 연속이고 역함수가 존재할 때, 다음 물음에 답하시오. (단, $a$, $b$는 실수)
subparts:
- id: 1-1
  stem: |
    $b$를 $a$에 대한 식으로 나타내고, 실수 $a$의 범위를 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: b = a + 2; a <= 3/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $g(x)$가 $x=1$에서 연속이므로 $\lim_{x\to1-}g(x)=f(1)$, 즉 $3=1-a+b$이다. 따라서 $b=a+2$이다.
      source_flow: PDF p.28
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $x<1$에서 $g(x)=2x+1$이 증가하므로 역함수가 존재하려면 $x>1$에서도 증가해야 한다. 즉 $x>1$일 때 $f'(x)=3x\left(x-\dfrac23a\right)\ge0$이어야 한다. (ⅰ) $\dfrac23a\le0$이면 $x>1$에서 항상 $f'(x)>0$이다. (ⅱ) $\dfrac23a>0$이면 $x>1$에서 항상 $f'(x)\ge0$이려면 $\dfrac23a\le1$이어야 한다. (ⅰ), (ⅱ)에서 $\dfrac23a\le1$이므로 $a\le\dfrac32$이다.
      source_flow: PDF p.28
      criteria:
      - 1-1.M2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
