stimuli: []
stem: |
  두 실수 $p$, $q$에 대하여

  $$f(x)=\begin{cases}-\dfrac{3}{x-6}&(x<p\text{ 또는 }x>q)\\a&(p\le x\le q)\end{cases}$$

  이다. 자연수 $m$에 대하여 $q-p=m$이고 함수 $|f(x)|$가 실수 전체의 집합에서 연속이 되도록 하는 양수 $a$의 값을 $a_m$이라 하고, 이 때 $y=|f(x)|$와 $y=|x^2-12x+35|$의 교점의 개수를 $b_m$이라 하자. 다음 물음에 답하시오. (단, $p<6<q$)
subparts:
- id: 1-1
  stem: |
    $a_m$을 $m$에 관한 식으로 나타내시오. (8점)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 6/m
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $|f(x)|$가 $x=p$에서 연속이려면 $\lim_{x\to p-}|f(x)|=\lim_{x\to p+}|f(x)|=|f(p)|$이어야 한다. $\lim_{x\to p-}|f(x)|=\left|-\dfrac{3}{p-6}\right|=-\dfrac{3}{p-6}$, $\lim_{x\to p+}|f(x)|=a$, $|f(p)|=a$이므로 $a=-\dfrac{3}{p-6}$이다.
      source_flow: PDF p.31-34
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $x=q$에서도 같은 방법으로 $\lim_{x\to q-}|f(x)|=a$, $\lim_{x\to q+}|f(x)|=\dfrac{3}{q-6}$, $|f(q)|=a$이므로 $a=\dfrac{3}{q-6}$이다.
      source_flow: PDF p.31-34
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        $-\dfrac{3}{p-6}=\dfrac{3}{q-6}$에서 $q=12-p$이다.
      source_flow: PDF p.31-34
      criteria:
      - 1-1.M3
    - id: 11b-4
      content: |
        $q-p=m$이므로 $(12-p)-p=m$에서 $p=6-\dfrac m2$이고, $a=-\dfrac{3}{6-\frac m2-6}=\dfrac6m$이다. 따라서 $a_m=\dfrac6m$이다.
      source_flow: PDF p.31-34
      criteria:
      - 1-1.M4
