stimuli: []
stem: |
  함수 $f(x)=2^{2x-a}+b$가 다음 조건을 만족시킬 때, $a+b$의 값을 구하시오. (단, $a$, $b$는 상수이다.)

  (가) $y=f(x)$의 그래프가 점 A$(-1,0)$을 지난다.
  (나) $y=f(x)$의 그래프의 점근선과 $x$축 사이의 거리가 $4$이다.
subparts:
- id: '1'
