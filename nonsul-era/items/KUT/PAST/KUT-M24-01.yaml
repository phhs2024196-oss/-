  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 $f(-1)=2^{-2-a}+b=0$이므로 $b=-2^{-2-a}$이고, 따라서 $b$는 음수이다. 함수 $y=2^{2x-a}+b$의 그래프는 $y=2^{2x}$의 그래프를 $x$축의 방향으로 $\dfrac{a}{2}$만큼, $y$축의 방향으로 $b$만큼 평행이동한 것이므로 점근선은 직선 $y=b$이다. 조건 (나)에서 $|b|=4$이고 $b<0$이므로 $b=-4$이다.
      source_flow: PDF p.3-4
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        식 $2^{-2-a}=4$에서 $-2-a=2$이므로 $a=-4$이다. 따라서 $a+b=-8$이다.
      source_flow: PDF p.3-4
      criteria:
      - 1.M2
