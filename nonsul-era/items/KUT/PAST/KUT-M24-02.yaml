  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\log_3\sqrt[3]{72}+\log_3\dfrac{\sqrt[6]{3^k}}{2}=\log_3\left\{(3^2\times 2^3)^{\frac13}\times\dfrac{3^{\frac k6}}{2}\right\}=\log_3 3^{\frac23+\frac k6}=\dfrac23+\dfrac k6=\dfrac{4+k}{6}$이다.
      source_flow: PDF p.6-7
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이 값이 자연수이려면 $4+k$가 $6$의 배수이어야 하므로 $4+k=6,12,18,24,30$, 즉 $k=2,8,14,20,26$이고 그 합은 $70$이다.
      source_flow: PDF p.6-7
      criteria:
      - 1.M2
