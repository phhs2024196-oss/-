stem: |
  $\log_3 \sqrt[3]{72}+\log_3 \dfrac{\sqrt[6]{3^k}}{2}$의 값이 자연수가 되도록 하는 $30$ 이하의 모든 자연수 $k$의 합을 구하시오.
