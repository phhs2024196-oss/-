stimuli: []
stem: |
  $0\le x<2\pi$일 때, 방정식 $\sin^2x+a\cos x-1=0$이 서로 다른 네 실근 $\dfrac{\pi}{3}$, $\alpha$, $\beta$, $\gamma$를 갖는다. $a+\alpha+\beta+\gamma$의 값을 구하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 1/2 + 11*pi/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x=\dfrac{\pi}{3}$이 근이므로 $\sin^2\dfrac{\pi}{3}+a\cos\dfrac{\pi}{3}-1=0$에서 $a=\dfrac12$이다.
      source_flow: PDF p.9-10
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a=\dfrac12$을 대입하면 $2(1-\cos^2x)+\cos x-2=0$, 즉 $\cos x(2\cos x-1)=0$이므로 $\cos x=0$ 또는 $\cos x=\dfrac12$이다.
      source_flow: PDF p.9-10
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $0\le x<2\pi$에서 $\cos x=0$의 근은 $x=\dfrac{\pi}{2},\dfrac{3\pi}{2}$, $\cos x=\dfrac12$의 근은 $x=\dfrac{\pi}{3},\dfrac{5\pi}{3}$이다. 따라서 $\alpha<\beta<\gamma$일 때 $\alpha=\dfrac{\pi}{2}$, $\beta=\dfrac{3\pi}{2}$, $\gamma=\dfrac{5\pi}{3}$이므로 $a+\alpha+\beta+\gamma=\dfrac12+\dfrac{11\pi}{3}$이다.
      source_flow: PDF p.9-10
      criteria:
      - 1.M3
