stimuli: []
stem: |
  다항함수 $f(x)$가

  $$\lim_{x\to\infty}\dfrac{f(x)-x^3}{4x^2+1}=\dfrac12,\qquad \lim_{x\to0}\dfrac{f(x)}{x^2+4x}=2$$

  를 만족시킬 때, $\lim_{x\to1}\dfrac{f(x)-f(1)}{x-1}$의 값을 구하시오.
