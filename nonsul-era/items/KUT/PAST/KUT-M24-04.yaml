  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        첫째 조건에서 $f(x)-x^3$은 최고차항의 계수가 $2$인 이차함수이므로 $f(x)=x^3+2x^2+ax+b$ ($a$, $b$는 상수)로 놓는다.
      source_flow: PDF p.12-13
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        둘째 조건에서 $x\to0$일 때 (분모)$\to0$이고 극한값이 존재하므로 (분자)$\to0$이어야 하여 $f(0)=b=0$이다. 그러면 $\lim_{x\to0}\dfrac{x(x^2+2x+a)}{x(x+4)}=\dfrac a4=2$에서 $a=8$이므로 $f(x)=x^3+2x^2+8x$이다.
      source_flow: PDF p.12-13
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $f'(x)=3x^2+4x+8$이므로 $\lim_{x\to1}\dfrac{f(x)-f(1)}{x-1}=f'(1)=15$이다.
      source_flow: PDF p.12-13
      criteria:
      - 1.M3
