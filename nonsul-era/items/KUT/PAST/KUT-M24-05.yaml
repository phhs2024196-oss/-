stem: |
  두 상수 $a$, $b$에 대하여 이차함수 $f(x)=ax^2+bx+7$이 다음 조건을 만족시킬 때, $f(x)$의 그래프 위의 점 $(1,f(1))$에서의 접선의 기울기를 구하시오.

  (가) $f(-3)=f(-1)$
  (나) 닫힌구간 $[-2,0]$에서 평균값 정리를 만족시키는 상수 $c$의 값은 $-\dfrac a2$이다.
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '12'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(-3)=9a-3b+7$, $f(-1)=a-b+7$이므로 조건 (가)에서 $9a-3b+7=a-b+7$, 즉 $b=4a$이다.
      source_flow: PDF p.15-16
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f'(x)=2ax+b$이고 조건 (나)에서 $\dfrac{f(0)-f(-2)}{0-(-2)}=f'\left(-\dfrac a2\right)$, 즉 $-2a+b=-a^2+b$이므로 $a^2-2a=0$이다. $a\ne0$이므로 $a=2$, $b=8$이고 $f(x)=2x^2+8x+7$이다.
      source_flow: PDF p.15-16
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        점 $(1,f(1))$에서의 접선의 기울기는 $f'(1)=2a+b=12$이다.
      source_flow: PDF p.15-16
      criteria:
      - 1.M3
