stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$가 다음 조건을 만족시킬 때, $f\left(\dfrac72\right)$의 값을 구하시오.

  (가) 모든 실수 $x$에 대하여 $f(x+2)=f(x)$이다.
  (나) $0\le x<2$일 때
  $$f(x)=\begin{cases}-x+3&(0\le x<1)\\\dfrac{ax+b}{x+1}&(1\le x<2)\end{cases}$$
  이다. (단, $a$, $b$는 상수이다.)
subparts:
- id: '1'
  stem: ''
