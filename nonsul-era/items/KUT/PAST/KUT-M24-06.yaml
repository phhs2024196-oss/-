  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x=0$에서 연속이므로 좌극한 $\lim_{x\to0-}f(x)=\lim_{x\to2-}f(x)=\dfrac{2a+b}{3}$ (조건 (가)), 우극한 $\lim_{x\to0+}f(x)=3$, 함숫값 $f(0)=3$이 모두 같아야 하므로 $2a+b=9$ ㉠이다.
      source_flow: PDF p.18-19
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x=1$에서도 연속이므로 좌극한 $\lim_{x\to1-}f(x)=2$, 우극한 $\lim_{x\to1+}f(x)=\dfrac{a+b}{2}$, 함숫값 $f(1)=\dfrac{a+b}{2}$가 모두 같아야 하므로 $a+b=4$ ㉡이다.
      source_flow: PDF p.18-19
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        ㉠, ㉡에서 $a=5$, $b=-1$이다. 조건 (가)에서 $f\left(\dfrac72\right)=f\left(\dfrac32\right)=\dfrac{3a+2b}{5}=\dfrac{13}{5}$이다.
      source_flow: PDF p.18-19
      criteria:
      - 1.M3
