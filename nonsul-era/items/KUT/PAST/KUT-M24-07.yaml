stimuli: []
stem: |
  함수 $f(x)=x^3+ax^2-3ax+1$이 다음 조건을 만족시키도록 하는 모든 정수 $a$의 값의 합을 구하시오.

  임의의 두 실수 $x_1$, $x_2$에 대하여 $x_1<x_2$이면 $f(x_1)<f(x_2)$이다.
