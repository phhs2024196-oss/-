  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 조건을 만족시키는 $f(x)$는 실수 전체의 집합에서 증가하는 함수이므로 모든 실수 $x$에 대하여 $f'(x)\ge0$이어야 한다. $f'(x)=3x^2+2ax-3a$이므로 모든 실수 $x$에 대하여 $3x^2+2ax-3a\ge0$이어야 한다.
      source_flow: PDF p.21-22
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이차방정식 $3x^2+2ax-3a=0$의 판별식을 $D$라 하면 $\dfrac D4=a^2+9a\le0$이므로 $-9\le a\le0$이다.
      source_flow: PDF p.21-22
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 정수 $a$의 값의 합은 $\sum_{k=1}^{9}(-k)=-\dfrac{9\times10}{2}=-45$이다.
      source_flow: PDF p.21-22
      criteria:
      - 1.M3
