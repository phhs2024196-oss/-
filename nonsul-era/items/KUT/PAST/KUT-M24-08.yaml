stimuli: []
stem: |
  다항함수 $f(x)$의 한 부정적분 $F(x)$가 모든 실수 $x$에 대하여

  $$xf(x)=F(x)+x^3-2x^2$$

  를 만족시킨다. $f(0)=1$일 때, $\lim_{h\to0}\dfrac1h\displaystyle\int_{2-h}^{2+h}f(t)\,dt$의 값을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '-2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        양변을 $x$에 대하여 미분하면 $f(x)+xf'(x)=F'(x)+3x^2-4x=f(x)+3x^2-4x$이므로 $f'(x)=3x-4$이다.
      source_flow: PDF p.24-25
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(x)=\dfrac32x^2-4x+C$ ($C$는 상수)이고 $f(0)=1$이므로 $C=1$, 즉 $f(x)=\dfrac32x^2-4x+1$이다.
      source_flow: PDF p.24-25
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\lim_{h\to0}\dfrac1h\displaystyle\int_{2-h}^{2+h}f(t)\,dt=\lim_{h\to0}\dfrac{F(2+h)-F(2-h)}{h}=\lim_{h\to0}\left\{\dfrac{F(2+h)-F(2)}{h}+\dfrac{F(2-h)-F(2)}{-h}\right\}=F'(2)+F'(2)=2f(2)=-2$이다.
      source_flow: PDF p.24-25
      criteria:
      - 1.M3
