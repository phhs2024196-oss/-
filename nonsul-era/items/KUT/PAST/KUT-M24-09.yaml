- id: 1-2
  stem: |
    $\dfrac{S_{2m}}{S_m}$의 값이 정수가 되도록 하는 $50$ 이하의 모든 자연수 $m$의 값의 합을 구하시오. (8점)
  points: 8
  depends_on:
  - 1-1
  answer:
    kind: value
    value: '312'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $\dfrac{S_{2m}}{S_m}=\dfrac{r^{2m}-1}{r^m-1}=\dfrac{(r^m-1)(r^m+1)}{r^m-1}=r^m+1=6^{\frac m4}+1$이므로 이 값이 정수이려면 자연수 $m$이 $4$의 배수이어야 한다.
      source_flow: PDF p.28-29
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $50$ 이하의 $m$은 $4,8,12,\cdots,48$이고 그 합은 $\dfrac{12(4+48)}{2}=312$이다.
      source_flow: PDF p.28-29
      criteria:
      - 1-2.M2
