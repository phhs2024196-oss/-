stem: |
  모든 항이 양수인 등비수열 $\{a_n\}$의 첫째항부터 제 $n$ 항까지의 합을 $S_n$이라 하자.

  $$a_1=1,\qquad S_8=7S_4$$

  일 때, 다음 물음에 답하시오.
subparts:
- id: 1-1
  stem: |
    $a_{13}$의 값을 구하시오. (8점)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '216'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        모든 항이 양수이므로 공비 $r>0$이다. $r=1$이면 $S_4=4$, $S_8=8$이어서 $S_8=7S_4$를 만족시키지 못하므로 $r\ne1$이다. 따라서 $S_4=\dfrac{r^4-1}{r-1}$, $S_8=\dfrac{r^8-1}{r-1}$이고, $\dfrac{S_8}{S_4}=\dfrac{(r^4-1)(r^4+1)}{r^4-1}=r^4+1=7$에서 $r^4=6$이다.
      source_flow: PDF p.28-29
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $r>0$이므로 $r=6^{\frac14}$이고, $a_{13}=a_1r^{12}=6^3=216$이다.
      source_flow: PDF p.28-29
      criteria:
      - 1-1.M2
