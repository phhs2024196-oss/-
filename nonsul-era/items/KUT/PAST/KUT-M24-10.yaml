stimuli: []
stem: |
  삼차함수 $f(x)=x^3-3x^2-24x$와 실수 $t$에 대하여 함수 $g(x)$를

  $$g(x)=\begin{cases}f(x-t)+f(2t)&(x<t)\\f(x+t)&(x\ge t)\end{cases}$$

  라 하자. 함수 $g(x)$가 실수 전체의 집합에서 미분가능할 때, 다음 물음에 답하시오.
subparts:
- id: 1-1
  stem: |
    $0$이 아닌 실수 $t$의 값을 구하시오. (5점)
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $g(x)$가 $x=t$에서 미분가능하려면 $\lim_{h\to0-}\dfrac{g(t+h)-g(t)}{h}=\lim_{h\to0+}\dfrac{g(t+h)-g(t)}{h}$이어야 한다. 좌미분계수는 $\lim_{h\to0-}\dfrac{f(h)}{h}=f'(0)=-24$이다.
      source_flow: PDF p.32-33
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        우미분계수는 $\lim_{h\to0+}\dfrac{f(2t+h)-f(2t)}{h}=f'(2t)=12t^2-12t-24$이다.
      source_flow: PDF p.32-33
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        $12t^2-12t-24=-24$에서 $12t(t-1)=0$이고 $t\ne0$이므로 $t=1$이다.
      source_flow: PDF p.32-33
      criteria:
      - 1-1.M3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: 좌미분계수 $-24$를 구했다.
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 2
      evidence: 우미분계수 $12t^2-12t-24$를 구했다.
      steps:
      - 11b-2
    - id: 1-1.M3
      mark_type: M
      points: 1
      evidence: $t=1$을 구했다.
      steps:
      - 11b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    방정식 $g(x)=k$의 서로 다른 실근의 개수가 $3$개가 되도록 하는 모든 정수 $k$의 개수를 구하시오. (11점)
  points: 11
  depends_on:
  - 1-1
  answer:
    kind: value
    value: '55'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $t=1$이므로 $g(x)=\begin{cases}f(x-1)+f(2)=x^3-6x^2-15x-32&(x<1)\\f(x+1)=x^3-27x-26&(x\ge1)\end{cases}$이고, $g'(x)=\begin{cases}3(x+1)(x-5)&(x<1)\\3(x+3)(x-3)&(x\ge1)\end{cases}$이다. $x=-1$에서 $g'$의 부호가 $+$에서 $-$로 바뀌므로 극댓값 $g(-1)=-24$이다.
      source_flow: PDF p.32-33
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $x<1$에서 $g'(x)<0$이므로 $g$는 $(-1,1)$에서 감소하고, $x\ge1$에서 $g'(x)=0$은 $x=3$이며 $x=3$에서 $g'$의 부호가 $-$에서 $+$로 바뀌므로 극솟값 $g(3)=-80$이다.
      source_flow: PDF p.32-33
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        $g(x)=k$의 서로 다른 실근이 $3$개이려면 $-80<k<-24$이어야 하고, 이 범위의 정수 $k$는 $-79,-78,\cdots,-25$로 $55$개이다.
      source_flow: PDF p.32-33
      criteria:
      - 1-2.M3
