stimuli: []
stem: 함수 $y=-\cos^{2}x+\cos x$의 최댓값을 $M$, 최솟값을 $m$이라 할 때,
subparts:
- id: '1'
  stem: |
    $M+m$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: -7/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\cos x=t$라 하면 $-1\le t\le1$이다. 따라서 주어진 식은 $y=-\cos^{2}x+\cos x=-t^{2}+t=-\left(t-\dfrac{1}{2}\right)^{2}+\dfrac{1}{4}$로 쓸 수 있다.
      source_flow: PDF p.10
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        위 이차함수는 $-1\le t\le1$일 때 $t=\dfrac{1}{2}$에서 최댓값 $M=\dfrac{1}{4}$을 갖고, $t=-1$에서 최솟값 $m=-2$를 갖는다.
      source_flow: PDF p.10
      criteria:
      - 1.A1
      - 1.A2
    - id: 1b-3
      content: |
        따라서 $M+m=-\dfrac{7}{4}$이다.
      source_flow: PDF p.10
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
