stimuli: []
stem: |-
  다항함수 $f(x)$에 대하여
  $$\lim_{x\to\infty}\dfrac{f(x)-2x^{2}}{x-1}=4,\quad \lim_{x\to1}\dfrac{x+2}{f(x)}=\dfrac{3}{5}$$
  을 만족시킬 때,
subparts:
- id: '1'
  stem: |
    $f(2)$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '15'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 $\displaystyle\lim_{x\to\infty}\dfrac{f(x)-2x^{2}}{x-1}=4$로부터 $f(x)-2x^{2}=ax+b$이다.
      source_flow: PDF p.13
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to\infty}\dfrac{ax+b}{x-1}=a$이므로 $a=4$이고, $f(x)=2x^{2}+4x+b$이다.
      source_flow: PDF p.13
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        조건 $\displaystyle\lim_{x\to1}\dfrac{x+2}{f(x)}=\dfrac{3}{5}$으로부터 $\displaystyle\lim_{x\to1}\dfrac{x+2}{f(x)}=\lim_{x\to1}\dfrac{x+2}{2x^{2}+4x+b}=\dfrac{3}{2+4+b}=\dfrac{3}{5}$이다. 그러므로 $b=-1$이고 $f(x)=2x^{2}+4x-1$이다.
      source_flow: PDF p.13
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서 $f(2)=15$이다.
      source_flow: PDF p.13
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $f(x)=2x^{2}+ax+b$ ($a,\ b$는 상수)로 놓았다.
      steps:
