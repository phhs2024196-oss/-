stimuli: []
stem: 함수 $f(x)=x^{3}-3x^{2}+6$이 $x=\alpha$, $x=\beta$에서 각각 극값을 가질 때, 서로 다른 두 점 $\mathrm{A}(\alpha,f(\alpha))$, $\mathrm{B}(\beta,f(\beta))$를 지나는
subparts:
- id: '1'
  stem: |
    직선의 기울기를 구하시오. (단, $\alpha<\beta$)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '-2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        미분가능한 함수 $f(x)$가 $x=\alpha,\ x=\beta$에서 극값을 가지면 $f'(\alpha)=0$이고 $f'(\beta)=0$이다. $f(x)=x^{3}-3x^{2}+6$으로부터 $f'(x)=3x^{2}-6x$이다. $f'(x)=3x^{2}-6x=0$으로부터 $3x(x-2)=0$이고, $x=0$ 또는 $x=2$이다. 그러므로 $\alpha=0$이고 $\beta=2$이다.
      source_flow: PDF p.16
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(0)=6$이고, $f(2)=2$이므로 두 점 $\mathrm{A},\ \mathrm{B}$는 각각 $(0,6)$, $(2,2)$이다.
      source_flow: PDF p.16
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        그러므로 두 점 $\mathrm{A},\ \mathrm{B}$를 지나는 직선의 기울기는 $\dfrac{2-6}{2-0}=-2$이다.
      source_flow: PDF p.16
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
