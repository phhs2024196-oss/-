    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $g(0)=a(a-b)$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: $\displaystyle\lim_{x\to0-}g(x)=36-6b$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
    - id: 1.M4
      mark_type: M
      points: 3
      evidence: $\displaystyle\lim_{x\to0+}g(x)=4+2b$를 구했다.
      depends_on:
      - 1.M1
