stimuli: []
stem: |-
  두 실수 $a$, $b$에 대하여 함수
  $$f(x)=\begin{cases}-5x-6&(x<0)\\a-b&(x=0)\\x+2&(x>0)\end{cases}$$
  일 때, 함수 $g(x)=\{f(x)\}^{2}+bf(x)$라 하자. 함수 $g(x)$가 $x=0$에서 연속일 때,
subparts:
- id: '1'
  stem: |
    $a+b$의 값을 구하시오. (단, $a>0$)
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '10'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $g(x)$는 $x=0$에서 연속이므로 $g(0)=\displaystyle\lim_{x\to0-}g(x)=\lim_{x\to0+}g(x)$이다.
      source_flow: PDF p.19
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ① 함숫값 : $g(0)=\{f(0)\}^{2}+bf(0)=(a-b)^{2}+b(a-b)=a(a-b)$
      source_flow: PDF p.19
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        ② 좌극한 : $\displaystyle\lim_{x\to0-}g(x)=\lim_{x\to0-}\left[(-5x-6)^{2}+b(-5x-6)\right]=(-6)^{2}+b\times(-6)=36-6b$
      source_flow: PDF p.19
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        ③ 우극한 : $\displaystyle\lim_{x\to0+}g(x)=\lim_{x\to0+}\left[(x+2)^{2}+b(x+2)\right]=2^{2}+b\times2=4+2b$ 이므로 $a(a-b)=36-6b=4+2b$ ····· ㉠
      source_flow: PDF p.19
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        $36-6b=4+2b$로부터 $b=4$를 구할 수 있고, $b=4$를 ㉠에 대입하면 $a^{2}-4a-12=(a+2)(a-6)=0$이다. 따라서 $a=6$ ($a>0$)이고, $a+b=10$이다.
      source_flow: PDF p.19
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $g(0)=\displaystyle\lim_{x\to0-}g(x)=\lim_{x\to0+}g(x)$를 세웠다.
      steps:
