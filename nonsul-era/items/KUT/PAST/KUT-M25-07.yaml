stimuli: []
stem: |
  삼차함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) $f(0)=0$
  (나) 곡선 $y=f'(x)$는 세 점 $(-3,0)$, $(-1,0)$, $(0,-3)$을 지난다.
subparts:
- id: '1'
  stem: |
    방정식 $f(x)=k$가 서로 다른 두 실근을 갖도록 하는 모든 실수 $k$의 값의 합을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: 4/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼차함수 $f(x)=ax^{3}+bx^{2}+cx+d$ (단, $a,\ b,\ c,\ d$는 상수)라 하면 $f(0)=0$이므로 $d=0$이다. $f'(x)=3ax^{2}+2bx+c$이고 함수 $f'(x)$가 두 점 $(-3,0)$, $(-1,0)$을 지나므로 $f'(x)=3a(x+3)(x+1)$ ····· ㉠
      source_flow: PDF p.22
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b-2
      content: |
        $f'(x)$가 점 $(0,-3)$을 지나므로 $f'(0)=-3$을 ㉠에 대입하면 $a=-\dfrac{1}{3}$이다. 따라서 $f'(x)=-(x+3)(x+1)=-x^{2}-4x-3$이므로 $b=-2,\ c=-3$을 구할 수 있다. 그러므로 $f(x)=-\dfrac{1}{3}x^{3}-2x^{2}-3x$이다.
      source_flow: PDF p.22
      criteria:
      - 1.M3
    - id: 1b-3
      content: |
        함수 $f'(x)$와 $f(x)$를 이용하여 함수 $f(x)$의 그래프를 그리면 [그림 1: $x=-3$에서 극솟값 0, $x=-1$에서 극댓값 $\frac{4}{3}$를 갖는 삼차함수 $y=f(x)$의 그래프와 직선 $y=k$] 이므로 방정식 $f(x)=k$가 서로 다른 두 실근을 갖도록 하는 $k$의 값은 $k=0$ 또는 $k=\dfrac{4}{3}$이다.
      source_flow: PDF p.22
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        따라서 문제에서 구하고자 하는 모든 실수 $k$의 값의 합은 $\dfrac{4}{3}$이다.
      source_flow: PDF p.22
      criteria: []
