stimuli: []
stem: 시각 $t=0$일 때 동시에 원점을 출발하여 수직선 위를 움직이는 두 점 $\mathrm{P}$, $\mathrm{Q}$의 시각 $t$에서의 속도가 각각 $v_{1}(t)=t^{2}+2t$, $v_{2}(t)=3t^{2}+t$이다.
subparts:
- id: '1'
  stem: |
    출발한 후 두 점 $\mathrm{P}$, $\mathrm{Q}$의 속도가 같아지는 순간 두 점 $\mathrm{P}$, $\mathrm{Q}$ 사이의 거리를 구하시오. (단, $t\ge0$)
  points: 12
  depends_on: []
  answer:
    kind: value
    value: 1/24
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $v_{1}(t)=v_{2}(t)$로부터 $t^{2}+2t=3t^{2}+t$이므로 $t(2t-1)=0$을 만족한다. 그러므로 $t=\dfrac{1}{2}$일 때, 두 점 $\mathrm{P}$, $\mathrm{Q}$의 속도가 같아진다.
      source_flow: PDF p.26
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        시각 $t$에서의 점 $\mathrm{P}$의 위치를 $x_{1}(t)$라 하면 $x_{1}(0)=0$이므로 $x_{1}\left(\dfrac{1}{2}\right)=x_{1}(0)+\displaystyle\int_{0}^{\frac{1}{2}}v_{1}(t)\,dt=0+\int_{0}^{\frac{1}{2}}(t^{2}+2t)\,dt=\left[\dfrac{1}{3}t^{3}+t^{2}\right]_{0}^{\frac{1}{2}}=\dfrac{7}{24}$이다.
      source_flow: PDF p.26
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        시각 $t$에서의 점 $\mathrm{Q}$의 위치를 $x_{2}(t)$라 하면 $x_{2}(0)=0$이므로 $x_{2}\left(\dfrac{1}{2}\right)=x_{2}(0)+\displaystyle\int_{0}^{\frac{1}{2}}v_{2}(t)\,dt=0+\int_{0}^{\frac{1}{2}}(3t^{2}+t)\,dt=\left[t^{3}+\dfrac{1}{2}t^{2}\right]_{0}^{\frac{1}{2}}=\dfrac{1}{4}$이다.
      source_flow: PDF p.26
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        그러므로 두 점 $\mathrm{P}$, $\mathrm{Q}$ 사이의 거리는 $\left|\dfrac{7}{24}-\dfrac{1}{4}\right|=\dfrac{1}{24}$이다.
      source_flow: PDF p.26
      criteria:
      - 1.A1
