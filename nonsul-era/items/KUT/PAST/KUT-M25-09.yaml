stimuli: []
stem: |
  수열 $\{a_{n}\}$의 첫째항부터 제$n$항까지의 합을 $S_{n}$이라 할 때, 모든 자연수 $n$에 대하여
  $$(3n-1)a_{n}+3S_{n}=20$$
  이 성립한다. 다음 물음에 답하시오.
subparts:
- id: 1-1
  stem: |
    (1) $a_{1}$의 값을 구하시오. (4점)
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $n=1$일 때 $S_{1}=a_{1}$이고, $(3n-1)a_{n}+3S_{n}=20$에 $n=1$을 대입하면 $2a_{1}+3S_{1}=2a_{1}+3a_{1}=5a_{1}=20$이므로 $a_{1}=4$이다.
      source_flow: PDF p.29
      criteria:
      - 1-1.M1
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: $S_{1}=a_{1}$임을 안다.
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: $a_{1}=4$임을 구했다.
      depends_on:
      - 1-1.M1
      steps:
      - 11b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) $\dfrac{a_{5}}{a_{11}}$의 값을 구하시오. (12점)
  points: 12
  depends_on: []
  answer:
    kind: value
    value: 80/17
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $(3n-1)a_{n}+3S_{n}=20$ ····· ㉠ ㉠에서 $n$ 대신 $n+1$을 대입하면 $(3n+2)a_{n+1}+3S_{n+1}=20$ ····· ㉡
      source_flow: PDF p.29
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        ㉡$-$㉠을 하면 $(3n+2)a_{n+1}-(3n-1)a_{n}+3(S_{n+1}-S_{n})=0$, $(3n+5)a_{n+1}=(3n-1)a_{n}$이므로 $\dfrac{a_{n}}{a_{n+1}}=\dfrac{3n+5}{3n-1}$ ····· ㉢
      source_flow: PDF p.29
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        ㉢의 $n$에 5, 6, 7, 8, 9, 10을 차례로 대입하여 변끼리 곱하면 $\dfrac{a_{5}}{a_{6}}\times\dfrac{a_{6}}{a_{7}}\times\dfrac{a_{7}}{a_{8}}\times\dfrac{a_{8}}{a_{9}}\times\dfrac{a_{9}}{a_{10}}\times\dfrac{a_{10}}{a_{11}}=\dfrac{20}{14}\times\dfrac{23}{17}\times\dfrac{26}{20}\times\dfrac{29}{23}\times\dfrac{32}{26}\times\dfrac{35}{29}$이다. 따라서 $\dfrac{a_{5}}{a_{11}}=\dfrac{32\times35}{14\times17}=\dfrac{80}{17}$이다.
      source_flow: PDF p.29
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
