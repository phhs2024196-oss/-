stimuli: []
stem: |
  최고차항의 계수가 1인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) $f(0)=0$
  (나) 모든 실수 $x$에 대하여 부등식 $(x-3)f(x)\ge0$이 성립한다.
subparts:
- id: 1-1
  stem: |
    (1) 곡선 $y=f(x)$와 $x$축으로 둘러싸인 부분의 넓이를 구하시오. (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 27/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        조건 (가)에서 $f(0)=0$이므로 $f(x)=x(x^{2}+ax+b)$ ($a,\ b$는 상수)로 놓을 수 있다. 조건 (나)에서 모든 실수 $x$에 대하여 부등식 $(x-3)f(x)\ge0$, 즉 $x(x-3)(x^{2}+ax+b)\ge0$이 성립해야 하므로, 모든 실수 $x$에 대하여 $x^{2}+ax+b=x(x-3)$를 만족시켜야 한다. 즉, $a=-3,\ b=0$이고, 따라서 $f(x)=x^{3}-3x^{2}$이다.
      source_flow: PDF p.32
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        곡선 $y=f(x)=x^{3}-3x^{2}$과 $x$축으로 둘러싸인 부분의 넓이는 $\displaystyle\int_{0}^{3}|f(x)|\,dx=\int_{0}^{3}(3x^{2}-x^{3})\,dx=\left[x^{3}-\dfrac{1}{4}x^{4}\right]_{0}^{3}=\dfrac{27}{4}$이다.
      source_flow: PDF p.32
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: 삼차함수 $f(x)=x^{3}-3x^{2}$을 구했다.
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 5
      evidence: 곡선 $y=f(x)$와 $x$축으로 둘러싸인 부분의 넓이가 $\dfrac{27}{4}$임을 구했다.
      depends_on:
      - 1-1.M1
      steps:
      - 11b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) $x\ge k$인 모든 실수 $x$에 대하여 부등식 $f(x)\ge16$이 성립하도록 하는 실수 $k$의 최솟값을 구하시오. (6점)
  points: 6
  depends_on:
  - 1-1
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $f(x)$의 도함수 $f'(x)=3x^{2}-6x=3x(x-2)$로부터 $f(x)$는 $x\ge2$에서 증가함수이다.
      source_flow: PDF p.32
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $f(4)=4^{3}-3\times4^{2}=16$이므로 $x\ge k$인 모든 실수 $x$에 대하여 부등식 $f(x)\ge16$이 성립하도록 하는 실수 $k$의 최솟값은 4이다.
      source_flow: PDF p.32
      criteria:
      - 1-2.M2
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: $f(x)$는 $x\ge2$ (또는 $x>2$)에서 증가함수임을 구했다.
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 2
      evidence: $f(4)=16$임을 구했다.
      steps:
      - 12b-2
    - id: 1-2.A1
      mark_type: A
      points: 2
      evidence: 조건을 만족하는 실수 $k$의 최솟값이 4임을 구했다.
      depends_on:
      - 1-2.M1
      - 1-2.M2
      steps:
      - 12b-2
