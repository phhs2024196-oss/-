stem: 등식 $\dfrac{1}{3x}+\dfrac{1}{2y}=1$을 만족시키는 실수 $x$, $y$에 대하여 $8^{x}=25^{y}=k$가 성립한다.
subparts:
- id: '1'
  stem: |
    상수 $k$의 값을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '10'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $8^{x}=k$에서 $k^{\frac{1}{x}}=8$, $25^{y}=k$에서 $k^{\frac{1}{y}}=25$이므로 $k^{\frac{1}{3x}}\times k^{\frac{1}{2y}}=\left(k^{\frac{1}{x}}\right)^{\frac{1}{3}}\times\left(k^{\frac{1}{y}}\right)^{\frac{1}{2}}=2\times5=10$이다.
      source_flow: PDF p.2
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        또한 $\dfrac{1}{3x}+\dfrac{1}{2y}=1$이므로 $k^{\frac{1}{3x}}\times k^{\frac{1}{2y}}=k^{\frac{1}{3x}+\frac{1}{2y}}=k$이다. 따라서 $k=10$이다.
      source_flow: PDF p.2
      criteria:
      - 1.A1
