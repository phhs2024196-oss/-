stem: 두 양수 $a$, $b$에 대하여 직선 $y=-2x+4$가 두 점 $\mathrm{A}(0,\log_{3}ab)$, $\mathrm{B}\left(1,\log_{3}\dfrac{b}{a}\right)$를 지날 때,
subparts:
- id: '1'
  stem: |
    $a+b$의 값을 구하시오.
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '30'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{A}(0,\log_{3}ab)$가 직선 $y=-2x+4$ 위에 있으므로 $\log_{3}ab=-2\times0+4=4$이다. 그러므로 $\log_{3}a+\log_{3}b=4$ ····· ㉠
      source_flow: PDF p.3
      criteria: []
    - id: 1b-2
      content: |
        또 점 $\mathrm{B}\left(1,\log_{3}\dfrac{b}{a}\right)$가 직선 $y=-2x+4$ 위에 있으므로 $\log_{3}\dfrac{b}{a}=-2\times1+4=2$이다. 그러므로 $\log_{3}b-\log_{3}a=2$ ····· ㉡
      source_flow: PDF p.3
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        ㉠과 ㉡을 변끼리 더하면 $2\log_{3}b=6$, $\log_{3}b=3$, $b=3^{3}=27$이다. 또 $\log_{3}b=3$을 ㉠에 대입하면 $\log_{3}a=1$, $a=3$이다. 따라서 $a+b=3+27=30$이다.
      source_flow: PDF p.3
      criteria:
      - 1.A1
