stimuli: []
stem: $x$에 대한 이차방정식 $6x^{2}-4ax+a^{2}-3=0$의 두 근이 $\sin\theta$, $\cos\theta$일 때,
subparts:
- id: '1'
  stem: |
    상수 $a$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        이차방정식의 근과 계수의 관계에 의하여 $\sin\theta+\cos\theta=\dfrac{4a}{6}=\dfrac{2a}{3}$ ····· ㉠, $\sin\theta\cos\theta=\dfrac{a^{2}-3}{6}$ ····· ㉡이다.
      source_flow: PDF p.5
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b-2
      content: |
        ㉠의 양변을 제곱하면 $\sin^{2}\theta+2\sin\theta\cos\theta+\cos^{2}\theta=\dfrac{4a^{2}}{9}$, $1+2\sin\theta\cos\theta=\dfrac{4a^{2}}{9}$ ····· ㉢
      source_flow: PDF p.5
      criteria: []
    - id: 1b-3
      content: |
        ㉡를 ㉢에 대입하면 $1+\dfrac{a^{2}-3}{3}=\dfrac{a^{2}}{3}=\dfrac{4a^{2}}{9}$, $a^{2}=0$ 따라서 $a=0$이다.
      source_flow: PDF p.5
      criteria:
      - 1.M3
      - 1.A1
