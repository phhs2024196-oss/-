stimuli: []
stem: |-
  다항함수 $f(x)$가
  $$\lim_{x\to\infty}\dfrac{f(x)+2x^{3}}{x^{2}+1}=2,\quad \lim_{x\to0}\dfrac{f(x)}{x^{2}+x}=4$$
  를 만족시킬 때,
subparts:
- id: '1'
  stem: |
    $f(1)$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$는 다항함수이고 $\displaystyle\lim_{x\to\infty}\dfrac{f(x)+2x^{3}}{x^{2}+1}=2$이므로 $f(x)=-2x^{3}+2x^{2}+ax+b$이다. (단, $a,\ b$는 상수)
      source_flow: PDF p.7
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x^{2}+x}=4$로부터 $\displaystyle\lim_{x\to0}\dfrac{-2x^{3}+2x^{2}+ax+b}{x^{2}+x}=4$이므로 $b=0$이다.
      source_flow: PDF p.7
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        그러므로 $\displaystyle\lim_{x\to0}\dfrac{-2x^{3}+2x^{2}+ax}{x^{2}+x}=4$이고 $\displaystyle\lim_{x\to0}\dfrac{x(-2x^{2}+2x+a)}{x(x+1)}=4$, $\displaystyle\lim_{x\to0}\dfrac{-2x^{2}+2x+a}{x+1}=4$로부터 $a=4$이다. 따라서 $f(x)=-2x^{3}+2x^{2}+4x$이고 $f(1)=4$이다.
      source_flow: PDF p.7
      criteria:
      - 1.M3
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $f(x)=-2x^{3}+2x^{2}+ax+b$임을 구했다. (단, $a,\ b$는 상수)
