stimuli: []
stem: |
  이차함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) $f'(1)=2$
  (나) 이차함수 $y=f(x)$의 그래프 위의 점 $(2,f(2))$에서의 접선의 방정식은 $y=5$이다.
subparts:
- id: '1'
  stem: |
    함수 $g(x)=f(4x)$에 대하여 $g'(-1)$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '48'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=ax^{2}+bx+c$라고 하자. (단, $a,\ b,\ c$는 상수) 이때 $f'(x)=2ax+b$이다. 조건 (가) $f'(1)=2$로부터 $2a+b=2$ ····· ㉠이다.
      source_flow: PDF p.8
      criteria: []
    - id: 1b-2
      content: |
        조건 (나)로부터 $f'(2)=0$이고 $f(2)=5$이다. 그러므로 $4a+b=0$ ····· ㉡, $4a+2b+c=5$ ····· ㉢이다. ㉠과 ㉡으로부터 $a=-1,\ b=4$이고 ㉢으로부터 $c=1$이다. 따라서 $f(x)=-x^{2}+4x+1$이다.
      source_flow: PDF p.8
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b-3
      content: |
        $g(x)=f(4x)=-16x^{2}+16x+1$이므로 $g'(x)=-32x+16$이고 $g'(-1)=32+16=48$이다.
      source_flow: PDF p.8
      criteria:
      - 1.M3
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
