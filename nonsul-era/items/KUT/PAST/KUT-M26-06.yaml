stimuli: []
stem: 함수 $f(x)=\begin{cases}x^{2}-ax&(x<4)\\2x-2a&(x\ge4)\end{cases}$가 실수 전체의 집합에서 연속이다.
subparts:
- id: '1'
  stem: |
    닫힌구간 $[1,5]$에서 함수 $f(x)$의 최댓값과 최솟값을 각각 $M$, $m$이라 할 때, $M+m$의 값을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '-2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$는 $x=4$에서 연속이므로 다음 3개의 값이 모두 같아야 한다. $f(4)=\displaystyle\lim_{x\to4-}f(x)=\lim_{x\to4+}f(x)$
      source_flow: PDF p.10
      criteria: []
    - id: 1b-2
      content: |
        i) 함숫값 : $f(4)=8-2a$
      source_flow: PDF p.10
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        ii) 좌극한 : $\displaystyle\lim_{x\to4-}f(x)=\lim_{x\to4-}(x^{2}-ax)=16-4a$
      source_flow: PDF p.10
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        iii) 우극한 : $\displaystyle\lim_{x\to4+}f(x)=\lim_{x\to4+}(2x-2a)=8-2a$ 이므로 $8-2a=16-4a$이다. 위 식으로부터 $a=4$이므로 $f(x)=\begin{cases}x^{2}-4x&(x<4)\\2x-8&(x\ge4)\end{cases}$이다. [그림 1: 구간 $[1,5]$에서 $y=f(x)$의 그래프. $x=2$에서 최솟값 $-4$, $x=5$에서 값 2]
      source_flow: PDF p.10
      criteria:
      - 1.M3
      - 1.M4
    - id: 1b-5
      content: |
        따라서 $M=f(5)=2,\ m=f(2)=-4$이므로 $M+m=2+(-4)=-2$이다.
      source_flow: PDF p.10
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $f(4)=8-2a$를 구했다.
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $\displaystyle\lim_{x\to4-}f(x)=16-4a$를 구했다.
      steps:
      - 1b-3
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: $\displaystyle\lim_{x\to4+}f(x)=8-2a$를 구했다.
      steps:
      - 1b-4
    - id: 1.M4
      mark_type: M
      points: 2
      evidence: $f(4)=\displaystyle\lim_{x\to4-}f(x)=\lim_{x\to4+}f(x)$를 이용하여 $a=4$를 구했다.
      depends_on:
      - 1.M1
      - 1.M2
      - 1.M3
      steps:
      - 1b-4
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $M=f(5)=2,\ m=f(2)=-4$를 구하고, $M+m=-2$임을 구했다.
      depends_on:
      - 1.M4
      steps:
      - 1b-5
