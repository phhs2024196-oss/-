stimuli: []
stem: 수직선 위를 움직이는 두 점 $\mathrm{P}$, $\mathrm{Q}$의 시각 $t$ ($t\ge0$)에서 위치를 각각 $f(t)$, $g(t)$라 하자. $f(t)-g(t)=t^{3}-9t^{2}+at+b$이고, 시각 $t=1$에서 두 점 $\mathrm{P}$, $\mathrm{Q}$가 만나고 속도가 같다.
subparts:
- id: '1'
  stem: |
    두 점 $\mathrm{P}$, $\mathrm{Q}$의 속도가 다시 같아지는 순간 두 점 $\mathrm{P}$, $\mathrm{Q}$ 사이의 거리를 구하시오. (단, $a$, $b$는 상수이다.)
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '32'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $h(t)=f(t)-g(t)$라 하면 $h'(t)=f'(t)-g'(t)=3t^{2}-18t+a$이다. 시각 $t=1$에서 두 점 $\mathrm{P}$, $\mathrm{Q}$가 만나므로 $h(1)=1-9+a+b=0$ ····· ㉠, 즉 $a+b=8$이 됨을 알 수 있다. 또 시각 $t=1$에서 두 점 $\mathrm{P}$, $\mathrm{Q}$의 속도가 같으므로 $h'(1)=3-18+a=0$, $\therefore a=15$
      source_flow: PDF p.12
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a=15$를 ㉠에 대입하면 $b=-7$이고, 따라서 $h(t)=t^{3}-9t^{2}+15t-7$, $h'(t)=3t^{2}-18t+15=3(t^{2}-6t+5)=3(t-1)(t-5)=0$에서 $t=1$ 또는 $t=5$를 구할 수 있다.
      source_flow: PDF p.12
      criteria:
      - 1.M2
      - 1.M3
    - id: 1b-3
      content: |
        따라서 두 점 $\mathrm{P}$, $\mathrm{Q}$의 속도가 다시 같아지는 시각은 $t=5$이고 이때 $h(5)=125-225+75-7=-32$이므로 두 점 $\mathrm{P}$, $\mathrm{Q}$ 사이의 거리는 32이다.
      source_flow: PDF p.12
      criteria:
      - 1.M4
      - 1.A1
  rubric:
