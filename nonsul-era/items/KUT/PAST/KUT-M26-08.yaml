stimuli: []
stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$가 다음 조건을 만족시킨다.
  (가) 모든 실수 $x$에 대하여 $f(x)=f(x-1)+2$이다.
  (나) $\displaystyle\int_{0}^{2}f(x)\,dx=\dfrac{10}{3}$
subparts:
- id: '1'
  stem: |
    $\displaystyle\int_{2}^{3}f(x)\,dx$의 값을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: 14/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\int_{0}^{2}f(x)\,dx=\int_{0}^{1}f(x)\,dx+\int_{1}^{2}f(x)\,dx=\int_{0}^{1}f(x)\,dx+\int_{1}^{2}\{f(x-1)+2\}\,dx=\int_{0}^{1}f(x)\,dx+\int_{1}^{2}f(x-1)\,dx+\int_{1}^{2}2\,dx$이다.
      source_flow: PDF p.13
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\int_{1}^{2}f(x-1)\,dx=\int_{0}^{1}f(x)\,dx$이므로 $\displaystyle\int_{0}^{2}f(x)\,dx=2\int_{0}^{1}f(x)\,dx+\int_{1}^{2}2\,dx=2\int_{0}^{1}f(x)\,dx+2$이다.
      source_flow: PDF p.13
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\displaystyle\int_{0}^{2}f(x)\,dx=\dfrac{10}{3}$이므로 $\displaystyle\int_{0}^{1}f(x)\,dx=\dfrac{2}{3}$이다.
      source_flow: PDF p.13
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $\displaystyle\int_{2}^{3}f(x)\,dx=\int_{2}^{3}\{f(x-1)+2\}\,dx=\int_{2}^{3}f(x-1)\,dx+\int_{2}^{3}2\,dx=\int_{1}^{2}f(x)\,dx+2=\int_{1}^{2}\{f(x-1)+2\}\,dx+2=\int_{1}^{2}f(x-1)\,dx+\int_{1}^{2}2\,dx+2=\int_{0}^{1}f(x)\,dx+2+2=\dfrac{2}{3}+2+2=\dfrac{14}{3}$이다.
      source_flow: PDF p.13
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $\displaystyle\int_{0}^{2}f(x)\,dx=\int_{0}^{1}f(x)\,dx+\int_{1}^{2}f(x)\,dx$임을 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
