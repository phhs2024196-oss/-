stimuli: []
stem: |
  두 직선 $y=\dfrac{2}{5}x$, $y=-\dfrac{5}{2}x$가 이루는 각을 이등분하는 직선 중에서 제2사분면을 지나는 직선을 $l$이라 하자. 다음 물음에 답하시오.
subparts:
- id: 1-1
  stem: |
    (1) 직선 $l$의 기울기를 구하시오. (8점)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: -3/7
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        직선 $l$ 위의 임의의 점을 $(x,y)$라 하면 점 $(x,y)$에서 두 직선 $y=\dfrac{2}{5}x$, $y=-\dfrac{5}{2}x$에 이르는 거리가 같으므로 $\dfrac{|2x-5y|}{\sqrt{2^{2}+(-5)^{2}}}=\dfrac{|5x+2y|}{\sqrt{5^{2}+2^{2}}}$이다. $2x-5y=5x+2y$ 또는 $2x-5y=-5x-2y$, $y=-\dfrac{3}{7}x$ 또는 $y=\dfrac{7}{3}x$
      source_flow: PDF p.15~16
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        이때 원점과 제2사분면을 지나는 직선의 기울기는 음수이므로 직선 $l$의 기울기는 $-\dfrac{3}{7}$이다.
      source_flow: PDF p.15~16
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 5
      evidence: 직선 $l$ 위의 임의의 점에서 두 직선 $y=\dfrac{2}{5}x,\ y=-\dfrac{5}{2}x$에 이르는 거리가 같다는 사실을 이용하여 식을 세웠다.
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: 직선 $l$의 기울기가 $-\dfrac{3}{7}$임을 구했다.
      depends_on:
      - 1-1.M1
      steps:
      - 11b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) 직선 $l$ 위의 점 $\mathrm{P}$에 대하여 동경 $\mathrm{OP}$가 나타내는 각의 크기를 $\theta$라 할 때, $\sin(\theta+\pi)+\cos(\theta-\pi)$의 값을 구하시오. (단, 점 $\mathrm{O}$는 원점이고, 점 $\mathrm{P}$는 제2사분면 위에 있다.) (8점)
  points: 8
  depends_on:
  - 1-1
  answer:
    kind: value
    value: 2*sqrt(58)/29
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        직선 $l$의 방정식은 $y=-\dfrac{3}{7}x$이다. 즉, $\tan\theta=-\dfrac{3}{7}$이고 점 $\mathrm{P}$가 제2사분면 위에 있으므로 $\sin\theta>0,\ \cos\theta<0$이다.
      source_flow: PDF p.15~16
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $\tan\theta=\dfrac{\sin\theta}{\cos\theta}=-\dfrac{3}{7}$에서 $\sin\theta=-\dfrac{3}{7}\cos\theta$이고, $\sin^{2}\theta+\cos^{2}\theta=1$이므로 $\dfrac{9}{49}\cos^{2}\theta+\cos^{2}\theta=1$이다. 즉, $\cos^{2}\theta=\dfrac{49}{58}$이다. $\cos\theta<0$이므로 $\cos\theta=-\dfrac{7}{\sqrt{58}}$, $\sin\theta=-\dfrac{3}{7}\cos\theta=\dfrac{3}{\sqrt{58}}$이다.
      source_flow: PDF p.15~16
      criteria: []
    - id: 12b-3
      content: |
        따라서 $\sin(\theta+\pi)+\cos(\theta-\pi)=-\sin\theta-\cos\theta=\dfrac{4}{\sqrt{58}}=\dfrac{2\sqrt{58}}{29}$이다.
      source_flow: PDF p.15~16
      criteria:
      - 1-2.A1
