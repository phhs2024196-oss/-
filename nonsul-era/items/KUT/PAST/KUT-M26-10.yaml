- id: 1-2
  stem: |
    (2) 함수 $f(a)$가 $a=m$에서 최솟값을 가질 때, 상수 $m$의 값을 구하시오. (8점)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: (3+3*sqrt(3))/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $0\le a\le3$일 때, $f(a)=-3a^{2}+9a+18=-3\left(a-\dfrac{3}{2}\right)^{2}+\dfrac{99}{4}$이므로 함수 $f(a)$의 최솟값은 $f(0)=f(3)=18$이다.
      source_flow: PDF p.17
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $3<a<6$일 때, $f(a)=\dfrac{2}{3}a^{3}-3a^{2}-9a+54$이므로 $f'(a)=2a^{2}-6a-9$이고, $f'(a)=0$에서 $3<a<6$이므로 $a=\dfrac{3+3\sqrt{3}}{2}$이다. 따라서 함수 $f(a)$는 $a=\dfrac{3+3\sqrt{3}}{2}$에서 극소이고 동시에 최소이므로 함수 $f(a)$의 최솟값은 $f\left(\dfrac{3+3\sqrt{3}}{2}\right)=36-\dfrac{27\sqrt{3}}{2}$이고, $f\left(\dfrac{3+3\sqrt{3}}{2}\right)<f(3)$이다.
      source_flow: PDF p.17
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        $a\ge6$일 때, $f(a)=3a^{2}-9a-18=3\left(a-\dfrac{3}{2}\right)^{2}-\dfrac{99}{4}$이므로 함수 $f(a)$의 최솟값은 $f(6)=36$이다. 이때 $f\left(\dfrac{3+3\sqrt{3}}{2}\right)<f(3)<f(6)$이므로 함수 $f(a)$는 $a=\dfrac{3+3\sqrt{3}}{2}$에서 최솟값을 갖는다. 따라서 $m=\dfrac{3+3\sqrt{3}}{2}$이다.
      source_flow: PDF p.17
      criteria:
      - 1-2.M3
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: $0\le a\le3$일 때 함수 $f(a)$가 $a=0,\ 3$에서 최솟값을 가짐을 구했다.
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 2
      evidence: $3<a<6$일 때, 함수 $f(a)$의 최솟값이 $a=\dfrac{3+3\sqrt{3}}{2}$에서 최솟값을 가짐을 구했다.
      steps:
      - 12b-2
    - id: 1-2.M3
      mark_type: M
      points: 2
      evidence: $a\ge6$일 때, 함수 $f(a)$의 최솟값이 $a=6$에서 최솟값을 가짐을 구했다.
      steps:
      - 12b-3
    - id: 1-2.A1
      mark_type: A
      points: 2
      evidence: $m=\dfrac{3+3\sqrt{3}}{2}$임을 구했다.
      depends_on:
      - 1-2.M1
      - 1-2.M2
      - 1-2.M3
      steps:
      - 12b-3
