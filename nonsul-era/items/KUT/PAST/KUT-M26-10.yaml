stimuli: []
stem: |
  시각 $t=0$일 때 원점을 출발하여 수직선 위를 움직이는 점 $\mathrm{P}$의 시각 $t$ ($t\ge0$)에서의 속도 $v(t)$가 $v(t)=-t^{2}+6t$이다. 음이 아닌 실수 $a$에 대하여 시각 $t=a$에서 $t=a+3$까지 점 $\mathrm{P}$가 움직인 거리를 $f(a)$라 할 때, 다음 물음에 답하시오.
subparts:
- id: 1-1
  stem: |
    (1) $f(1)+\displaystyle\lim_{a\to\infty}\dfrac{f(a)}{a^{2}}$의 값을 구하시오. (8점)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '27'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $0\le t\le6$에서 $v(t)=-t^{2}+6t\ge0$, $t>6$에서 $v(t)=-t^{2}+6t<0$이므로 함수 $f(a)$는 다음과 같이 $a$의 값의 범위에 따라 구할 수 있다. (ⅰ) $0\le a\le3$일 때, $f(a)=\displaystyle\int_{a}^{a+3}|-t^{2}+6t|\,dt=\int_{a}^{a+3}(-t^{2}+6t)\,dt=-3a^{2}+9a+18$
      source_flow: PDF p.17
      criteria: []
    - id: 11b-2
      content: |
        (ⅱ) $3<a<6$일 때, $f(a)=\displaystyle\int_{a}^{a+3}|-t^{2}+6t|\,dt=\int_{a}^{6}(-t^{2}+6t)\,dt+\int_{6}^{a+3}(t^{2}-6t)\,dt=\dfrac{2}{3}a^{3}-3a^{2}-9a+54$ (ⅲ) $a\ge6$일 때, $f(a)=\displaystyle\int_{a}^{a+3}|-t^{2}+6t|\,dt=\int_{a}^{a+3}(t^{2}-6t)\,dt=3a^{2}-9a-18$
      source_flow: PDF p.17
      criteria: []
    - id: 11b-3
      content: |
        (1) $f(1)=-3+9+18=24$, $\displaystyle\lim_{a\to\infty}\dfrac{f(a)}{a^{2}}=\lim_{a\to\infty}\dfrac{3a^{2}-9a-18}{a^{2}}=3$ 따라서 $f(1)+\displaystyle\lim_{a\to\infty}\dfrac{f(a)}{a^{2}}=27$이다.
      source_flow: PDF p.17
      criteria:
      - 1-1.M1
      - 1-1.M2
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
