    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a^{2}=b^{3}=c^{4}=k$라 하면 $a=k^{\frac12}$, $b=k^{\frac13}$, $c=k^{\frac14}$이다.
      source_flow: PDF p.7
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $\log_{a}b+\log_{b}c+\log_{c}a=\log_{k^{1/2}}k^{1/3}+\log_{k^{1/3}}k^{1/4}+\log_{k^{1/4}}k^{1/2}=\dfrac{1/3}{1/2}+\dfrac{1/4}{1/3}+\dfrac{1/2}{1/4}=\dfrac{41}{12}$이다.
      source_flow: PDF p.7
      criteria:
      - 1.B2
