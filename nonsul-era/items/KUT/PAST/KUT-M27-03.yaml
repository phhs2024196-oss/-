stimuli: []
stem: |
  $0\le x\le3\pi$에서 방정식 $\sin^{2}x+2\cos x+2+k=0$의 서로 다른 실근의 개수가 $3$이 되도록 하는 모든 정수 $k$의 값의 합을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '-6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\cos x=t$라 하면 $\sin^{2}x+\cos^{2}x=1$로부터 $\sin^{2}x+2\cos x+2+k=0$, $(1-\cos^{2}x)+2\cos x+2+k=0$, $\therefore-t^{2}+2t+3+k=0$ ㉠이다.
      source_flow: PDF p.11
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $0\le x\le3\pi$에서 방정식의 서로 다른 실근의 개수가 $3$이기 위해서는 반드시 $-1<t<1$에서 이차방정식 ㉠의 근이 한 개만 있어야 한다. $g(t)=t^{2}-2t-3-k$라 할 때, 함수 $g(t)$의 대칭축이 $t=1$이므로 $g(-1)>0$, $g(1)<0$ ㉡이면 $-1<t<1$에서 이차방정식 $g(t)=0$의 근이 한 개만 있게 된다.
      source_flow: PDF p.11
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        부등식 ㉡을 풀면 $g(-1)=-k>0$, $g(1)=-4-k<0$, $\therefore-4<k<0$이다.
      source_flow: PDF p.11
      criteria:
      - 1.B3
    - id: 1b-4
      content: |
        따라서 조건을 만족시키는 모든 정수 $k$의 값의 합은 $(-3)+(-2)+(-1)=-6$이다.
      source_flow: PDF p.11
      criteria:
      - 1.B4
