    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{x\to\infty}\dfrac{f(x)+x^{2}}{x+1}=2$를 만족시키는 다항함수 $f(x)+x^{2}$은 최고차항의 계수가 $2$인 일차함수이므로 $f(x)=-x^{2}+2x+b$ (단, $b$는 상수) ㉠이다.
      source_flow: PDF p.14
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to3}\dfrac{f(x)-1}{x-3}=a$에서 $x\to3$일 때 (분모)$\to0$이고 극한값이 존재하므로 (분자)$\to0$이어야 한다. 즉, $f(3)-1=0$에서 $f(3)=1$이다. 식 ㉠에서 $f(3)=-9+6+b=-3+b$이므로 $-3+b=1$, $\therefore b=4$이다.
      source_flow: PDF p.14
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        따라서 $a=\displaystyle\lim_{x\to3}\dfrac{f(x)-1}{x-3}=\lim_{x\to3}\dfrac{(-x^{2}+2x+4)-1}{x-3}=\lim_{x\to3}\dfrac{-(x-3)(x+1)}{x-3}=\lim_{x\to3}\{-(x+1)\}=-4$이다.
      source_flow: PDF p.14
      criteria:
      - 1.B3
