stem: |
  다항함수 $f(x)$가

  $$\lim_{x\to\infty}\dfrac{f(x)+x^{2}}{x+1}=2,\quad\lim_{x\to3}\dfrac{f(x)-1}{x-3}=a$$

  를 만족시킬 때, 상수 $a$의 값을 구하시오.
subparts:
- id: '1'
