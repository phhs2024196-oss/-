stimuli: []
stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킬 때, $f(4)$의 값을 구하시오.
  (단, $a$는 $0$이 아닌 실수이다.)

  (가) $\{x\mid f(x)=0\}=\{-a,a,2a\}$
  (나) $f(0)>0$, $f'(1)=-2$
