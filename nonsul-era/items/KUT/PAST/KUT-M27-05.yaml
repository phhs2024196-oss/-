  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)의 $\{x\mid f(x)=0\}=\{-a,a,2a\}$에서 $f(-a)=0$, $f(a)=0$, $f(2a)=0$이고, 함수 $f(x)$가 최고차항의 계수가 $1$인 삼차함수이므로 $f(x)=(x+a)(x-a)(x-2a)=x^{3}-2ax^{2}-a^{2}x+2a^{3}$ ㉠이다.
      source_flow: PDF p.18
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        식 ㉠에서 $f'(x)=3x^{2}-4ax-a^{2}$이므로 $f'(1)=-a^{2}-4a+3$이다. 조건 (나)에서 $f'(1)=-2$이므로 $-a^{2}-4a+3=-2$, $(a+5)(a-1)=0$, $\therefore a=-5,\ 1$이다.
      source_flow: PDF p.18
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        식 ㉠에서 $f(0)=2a^{3}$이므로 (ⅰ) $a=-5$이면 $f(0)=-250<0$, (ⅱ) $a=1$이면 $f(0)=2>0$이다. 조건 (나)에서 $f(0)>0$이므로 $a=1$이다.
      source_flow: PDF p.18
      criteria:
      - 1.B2
    - id: 1b-4
      content: |
        따라서 $f(x)=x^{3}-2x^{2}-x+2$이므로 $f(4)=30$이다.
      source_flow: PDF p.18
      criteria:
      - 1.B3
