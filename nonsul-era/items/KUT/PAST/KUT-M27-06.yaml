stimuli: []
stem: |
  함수

  $$f(x)=\begin{cases}x^{2}-4x+3&(x\le a)\\2x-6&(x>a)\end{cases}$$

  에 대하여 함수 $\lvert f(x)\rvert$가 실수 전체의 집합에서 연속이 되도록 하는 모든 상수 $a$의 값의 합을 구하시오.
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $\lvert f(x)\rvert$가 실수 전체의 집합에서 연속이 되려면 $x=a$에서 연속이어야 하므로 $\displaystyle\lim_{x\to a+}\lvert f(x)\rvert=\lim_{x\to a-}\lvert f(x)\rvert=\lvert f(a)\rvert$이어야 한다. 즉, $\lvert a^{2}-4a+3\rvert=\lvert2a-6\rvert$, $\therefore a^{2}-4a+3=\pm(2a-6)$이다.
      source_flow: PDF p.21
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        (ⅰ) $a^{2}-4a+3=2a-6$일 때, $a^{2}-6a+9=0$, $(a-3)^{2}=0$, $\therefore a=3$이다.
      source_flow: PDF p.21
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        (ⅱ) $a^{2}-4a+3=-2a+6$일 때, $a^{2}-2a-3=0$, $(a+1)(a-3)=0$, $\therefore a=-1,\ 3$이다.
      source_flow: PDF p.21
      criteria:
      - 1.B2
    - id: 1b-4
      content: |
        (ⅰ), (ⅱ)로부터 함수 $\lvert f(x)\rvert$가 실수 전체의 집합에서 연속이 되도록 하는 상수 $a$의 값은 $-1$, $3$이므로 그 합은 $(-1)+3=2$이다.
      source_flow: PDF p.21
      criteria:
      - 1.B3
