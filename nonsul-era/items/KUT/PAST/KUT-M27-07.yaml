stimuli: []
stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$에 대하여 함수 $g(x)$를

  $$g(x)=\begin{cases}f(x)-2&(x\le-1)\\\dfrac{(x+1)^{2}}{f(x)+2}&(x>-1)\end{cases}$$

  라 하자. $\displaystyle\lim_{x\to-1+}g(x)=\lim_{x\to-1-}g(x)+2$를 만족시킬 때, 닫힌구간 $\left[-2,-\dfrac34\right]$에서 함수 $f(x)$의 최댓값과 최솟값의 합을 구하시오. (단, $f(-1)\ne0$)
subparts:
- id: '1'
  stem: ''
  points: 12
  depends_on: []
  answer:
    kind: value
    value: -11/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼차함수 $f(x)$는 $x=-1$에서 연속이므로 $\displaystyle\lim_{x\to-1-}g(x)=f(-1)-2$이다. 이로부터 조건을 정리하면 $\displaystyle\lim_{x\to-1+}g(x)=\lim_{x\to-1+}\dfrac{(x+1)^{2}}{f(x)+2}=f(-1)$ ㉠이다. $f(-1)\ne0$이므로 식 ㉠에서 극한값은 $0$이 아니다. 그런데 $x\to-1+$일 때 (분자)$\to0$이므로 (분모)$\to0$이어야 한다. 즉, $\displaystyle\lim_{x\to-1+}\{f(x)+2\}=0$, $\therefore f(-1)+2=0$ ㉡이다.
      source_flow: PDF p.25~26
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        식 ㉡으로부터 삼차식 $f(x)+2$는 $x+1$을 인수로 가지므로 $f(x)+2=(x+1)Q(x)$ (단, $Q(x)$는 이차식)로 놓을 수 있고, 이를 식 ㉠에 대입하면 $\displaystyle\lim_{x\to-1+}\dfrac{x+1}{Q(x)}=f(-1)=-2$ ㉢이다. 식 ㉢에서 극한값이 존재하기 위해서는 $x\to-1+$일 때 (분자)$\to0$이므로 (분모)$\to0$이어야 한다. 즉, $\displaystyle\lim_{x\to-1+}Q(x)=Q(-1)=0$ ㉣이다. 식 ㉣으로부터 이차식 $Q(x)$는 $x+1$을 인수로 가지고, $f(x)$의 최고차항의 계수가 $1$이므로 $f(x)+2=(x+1)^{2}(x-a)$ (단, $a$는 실수)이다.
      source_flow: PDF p.25~26
      criteria:
      - 1.B1
    - id: 1b-3
      content: |
        이를 식 ㉠에 대입하면 $\displaystyle\lim_{x\to-1+}\dfrac{1}{x-a}=-2$, $-1-a=-\dfrac12$, $\therefore a=-\dfrac12$이다. 정리하면 함수 $f(x)$는 $f(x)=(x+1)^{2}\left(x+\dfrac12\right)-2=x^{3}+\dfrac52x^{2}+2x-\dfrac32$이다.
      source_flow: PDF p.25~26
      criteria:
      - 1.B2
    - id: 1b-4
      content: |
        이를 미분하면 $f'(x)=3x^{2}+5x+2=(x+1)(3x+2)$이고, $f'(x)=0$을 만족시키는 해는 $x=-1,\ -\dfrac23$이다.
      source_flow: PDF p.25~26
      criteria:
      - 1.B3
      - 1.B4
    - id: 1b-5
      content: |
        닫힌구간 $\left[-2,-\dfrac34\right]$에서 함수 $f(x)$의 최댓값과 최솟값은 $f(-2)=-\dfrac72$ (최솟값), $f(-1)=-2$ (최댓값), $f\left(-\dfrac34\right)=-\dfrac{129}{64}$이다.
      source_flow: PDF p.25~26
      criteria:
      - 1.B3
      - 1.B4
    - id: 1b-6
      content: |
        따라서 최댓값과 최솟값의 합은 $(-2)+\left(-\dfrac72\right)=-\dfrac{11}{2}$이다.
      source_flow: PDF p.25~26
      criteria:
      - 1.B5
