stimuli: []
stem: |
  다항함수 $f(x)$와 최고차항의 계수가 $1$인 삼차함수 $g(x)$가 모든 실수 $x$에 대하여 다음 조건을 만족시킨다.

  (가) $f(x)+\displaystyle\int_{0}^{x}(x-t)f'(t)\,dt=g(x)$
  (나) $g(x)=-g(-x)$

  $f(1)+g(1)$의 값을 구하시오.
