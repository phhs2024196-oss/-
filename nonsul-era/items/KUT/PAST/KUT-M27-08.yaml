  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        최고차항의 계수가 $1$인 삼차함수 $g(x)$가 모든 실수 $x$에 대하여 $g(x)=-g(-x)$를 만족시키므로 $g(x)=x^{3}+ax$ (단, $a$는 상수)로 놓을 수 있다.
      source_flow: PDF p.30
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $f(x)+\displaystyle\int_{0}^{x}(x-t)f'(t)\,dt=g(x)$에서 $f(x)+x\displaystyle\int_{0}^{x}f'(t)\,dt-\int_{0}^{x}tf'(t)\,dt=x^{3}+ax$ ㉠이다. 식 ㉠의 양변에 $x=0$을 대입하면 $f(0)=0$ ㉡이다.
      source_flow: PDF p.30
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        한편 식 ㉠의 양변을 $x$에 대하여 미분하면 $f'(x)+\displaystyle\int_{0}^{x}f'(t)\,dt+xf'(x)-xf'(x)=3x^{2}+a$, $f'(x)+f(x)-f(0)=3x^{2}+a$, $\therefore f'(x)+f(x)=3x^{2}+a$ ($\because f(0)=0$) ㉢이다.
      source_flow: PDF p.30
      criteria:
      - 1.B2
    - id: 1b-4
      content: |
        식 ㉢으로부터 $f(x)$는 이차함수이다. 식 ㉡을 이용하면 $f(x)=px^{2}+qx$ (단, $p$, $q$는 상수)이고, 식 ㉢으로부터 $2px+q+px^{2}+qx=3x^{2}+a$, $px^{2}+(2p+q)x+q=3x^{2}+a$, $\therefore p=3,\ q=-6,\ a=-6$이다. 따라서 정리하면 $f(x)=3x^{2}-6x$, $g(x)=x^{3}-6x$이다.
      source_flow: PDF p.30
      criteria:
      - 1.B3
      - 1.B4
    - id: 1b-5
      content: |
        $f(1)+g(1)=(-3)+(-5)=-8$이다.
      source_flow: PDF p.30
      criteria:
      - 1.B5
