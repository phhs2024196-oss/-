  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\log_{a}x=t$라 하면 $f(x)=\left\lvert(\log_{a}x)^{2}-5\log_{a}x+5\right\rvert=\lvert t^{2}-5t+5\rvert$이다. 이때 $g(t)=t^{2}-5t+5$라 하자.
      source_flow: PDF p.34~35
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        두 방정식 $g(t)=t^{2}-5t+5=1$ $(\therefore t=1,\ 4)$, $g(t)=t^{2}-5t+5=-1$ $(\therefore t=2,\ 3)$의 근으로부터 $\lvert g(t)\rvert=1$의 근은 $t=1,\ 2,\ 3,\ 4$이다.
      source_flow: PDF p.34~35
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        그래프로부터 부등식 $\lvert g(t)\rvert\ge1$을 풀면 $t\le1,\ 2\le t\le3,\ t\ge4$ ㉠이다.
      source_flow: PDF p.34~35
      criteria:
      - 1.B3
    - id: 1b-4
      content: |
        한편, $a>1$이므로 $2\le x\le4$일 때 $\log_{a}2\le t\le\log_{a}4$ ㉡이다.
      source_flow: PDF p.34~35
      criteria:
      - 1.B4
    - id: 1b-5
      content: |
        부등식 ㉡을 만족시키는 $t$가 항상 부등식 ㉠을 만족시키기 위해서는 다음 세 가지 중에 한 가지가 성립되어야 한다. (ⅰ) $\log_{a}4\le1$, 즉 $a\ge4$ (ⅱ) $2\le\log_{a}2$이고 $\log_{a}4\le3$, 즉 $a\le\sqrt2$이고 $a\ge\sqrt[3]{4}$ (이 경우 $\sqrt2<\sqrt[3]{4}$이므로 만족시키는 $a$가 없다.) (ⅲ) $4\le\log_{a}2$, 즉 $a\le\sqrt[4]{2}$ (이 경우 $\sqrt[4]{2}<2$이므로 만족시키는 $1$보다 큰 자연수 $a$가 없다.) 위의 결과 (ⅰ)~(ⅲ)으로부터 수열 $\{a_{n}\}$은 $a_{n}=3+n$이다.
      source_flow: PDF p.34~35
      criteria:
      - 1.B5
    - id: 1b-6
      content: |
        따라서 구하고자 하는 값은 $\displaystyle\sum_{n=1}^{5}a_{n}=4+5+6+7+8=30$이다.
      source_flow: PDF p.34~35
      criteria:
      - 1.B6
