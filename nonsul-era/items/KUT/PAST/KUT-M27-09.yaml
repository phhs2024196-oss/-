stem: |
  $1$보다 큰 자연수 $a$에 대하여 함수 $f(x)$를

  $$f(x)=\left\lvert(\log_{a}x)^{2}-5\log_{a}x+5\right\rvert$$

  라 하자. $2\le x\le4$인 모든 실수 $x$에 대하여 $f(x)\ge1$이 성립하도록 하는 모든 자연수 $a$의 값을 작은 수부터 크기순으로 나열한 수열을 $\{a_{n}\}$이라 할 때,

  $$\sum_{n=1}^{5}a_{n}$$

  의 값을 구하시오.
