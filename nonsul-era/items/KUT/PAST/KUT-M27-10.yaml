- id: 10-2
  stem: |
    함수 $f(x)$가 $x=\alpha$와 $x=\beta$에서 극값을 가질 때, $\alpha+\beta$의 값을 구하시오. (단, $\alpha<\beta$) (8점)
  points: 8
  depends_on:
  - 10-1
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S102-B
    audience: B
    method_no: 1
    steps:
    - id: 102b-1
      content: |
        식 ㉠으로부터 $f'(x)=Q(x)+xQ'(x)$이므로 $f'(0)=Q(0)$이다. 조건 (다)에서 $f'(0)=1$이므로 $Q(0)=1$ ㉣이다. 따라서 ㉡, ㉢, ㉣을 만족시키는 이차함수 $Q(x)$를 구하면 $Q(x)=\dfrac14x^{2}-\dfrac32x+1$이고, 식 ㉠으로부터 $f(x)=\dfrac14x^{3}-\dfrac32x^{2}+x$이다.
      source_flow: PDF p.39~40
      criteria:
      - 10-2.B1
    - id: 102b-2
      content: |
        함수 $f(x)$가 극값을 갖는 $\alpha$, $\beta$는 $f'(x)=\dfrac34x^{2}-3x+1=0$의 두 근이므로 $\alpha+\beta=-\dfrac{-3}{\frac34}=4$이다.
      source_flow: PDF p.39~40
      criteria:
      - 10-2.B2
