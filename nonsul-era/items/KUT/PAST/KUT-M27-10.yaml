stimuli: []
stem: |
  최고차항의 계수가 양수인 삼차함수 $f(x)$에 대하여 함수 $g(x)$를

  $$g(x)=\int_{0}^{x}(\lvert f(t)\rvert-\lvert t\rvert)\,dt$$

  라 하자. 두 함수 $f(x)$, $g(x)$가 다음 조건을 만족시킨다.

  (가) 함수 $g(x)$는 $x=2$, $x=6$에서 극값을 갖는다.
  (나) $f(2)<0$, $f(6)>0$
  (다) $f(0)=0$, $f'(0)=1$
subparts:
- id: 10-1
  stem: |
    $f(x)=xQ(x)$라 할 때, $Q(2)+Q(6)$의 값을 구하시오. (단, $Q(x)$는 다항식) (8점)
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S101-B
    audience: B
    method_no: 1
    steps:
    - id: 101b-1
      content: |
        $f(0)=0$이고 $f(x)$는 삼차함수이므로 $f(x)=xQ(x)$ (단, $Q(x)$는 이차식) ㉠이다. 한편, $g(x)=\displaystyle\int_{0}^{x}(\lvert f(t)\rvert-\lvert t\rvert)\,dt$이므로 $g'(x)=\lvert f(x)\rvert-\lvert x\rvert$이고, 식 ㉠으로부터 $g'(x)=\lvert xQ(x)\rvert-\lvert x\rvert=\lvert x\rvert(\lvert Q(x)\rvert-1)$이다.
      source_flow: PDF p.39~40
      criteria:
      - 10-1.B1
    - id: 101b-2
      content: |
        조건 (가)로부터 함수 $g(x)$는 $x=2$, $x=6$에서 극값을 가지므로 $g'(2)=0$, $g'(6)=0$이고, 따라서 $\lvert Q(2)\rvert=1$, $\lvert Q(6)\rvert=1$이다.
      source_flow: PDF p.39~40
      criteria:
      - 10-1.B2
    - id: 101b-3
      content: |
        조건 (나)에서 $f(2)<0$을 이용하면 $f(2)=2Q(2)<0$이므로 $Q(2)<0$이고, $\lvert Q(2)\rvert=1$이므로 $Q(2)=-1$ ㉡이다. 또한, 조건 (나)에서 $f(6)>0$을 이용하면 $f(6)=6Q(6)>0$이므로 $Q(6)>0$이고, $\lvert Q(6)\rvert=1$이므로 $Q(6)=1$ ㉢이다. ㉡과 ㉢으로부터 $Q(2)+Q(6)=(-1)+1=0$이다.
      source_flow: PDF p.39~40
      criteria:
      - 10-1.B3
