stimuli:
- label: '1'
  body: 모든 자연수의 집합을 $\mathbb{N}$, 모든 정수의 집합을 $\mathbb{Z}$, 모든 실수의 집합을 $\mathbb{R}$로 나타낸다. 또한 집합 $X$와 $Y$는 $\mathbb{R}$의 부분집합이다.
- label: '2'
  body: |
    집합 $X$에 대하여 집합 $M(X),\ C(X),\ T(X)$를 다음과 같이 정의한다. (단, $E$는 이차 단위행렬이다.)
    $$M(X)=\left\{\left(\begin{matrix}a&b\\c&d\end{matrix}\right)\,\middle|\,a,b,c,d\in X\right\}$$
    $$C(X)=\{A\in M(X)\mid A^2=E\}$$
    $$T(X)=\{A\in M(X)\mid A\text{의 역행렬이 존재한다}\}$$
- label: '3'
  body: |
    함수 $f:X\to Y$에 대하여 (성질 1)과 (성질 2)를 다음과 같이 정의한다.
    (성질 1) 모든 $x_1,x_2\in X$에 대하여 $f(x_1+x_2)=f(x_1)+f(x_2)$이다.
    (성질 2) 모든 $x_1,x_2\in X$에 대하여 $f(x_1x_2)=f(x_1)f(x_2)$이다.
stem: '[문제 1] 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오. (50점)'
subparts:
- id: '1'
  stem: '[1] $ad=bc+1$을 만족시키는 행렬 $A=\left(\begin{matrix}a&b\\c&d\end{matrix}\right)\in C(\mathbb{Z})$를 모두 구하시오. [11점]'
  points: 11
  depends_on: []
  answer:
    kind: set
    value: A1=[[1,0],[0,1]]; A2=[[-1,0],[0,-1]]
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 케일리·해밀턴의 공식에 의하여 $A^2-(a+d)A+(ad-bc)E=O$이다. $A\in C(\mathbb{Z})$이므로 $A^2=E$이고 $ad-bc=1$이므로 $(a+d)A=(ad-bc+1)E=2E$이다. 그런데 $(a+d)A=\left(\begin{matrix}(a+d)a&(a+d)b\\(a+d)c&(a+d)d\end{matrix}\right)$이고 $2E=\left(\begin{matrix}2&0\\0&2\end{matrix}\right)$이므로 $(a+d)b=0$이고 $(a+d)c=0$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        만일 $b\ne0$이라면 $a+d=0$이므로 $O=(a+d)A=2E$이다. 이는 모순이므로 $b=0$이다.
        만일 $c\ne0$이라면 $a+d=0$이므로 $O=(a+d)A=2E$이다. 이는 모순이므로 $c=0$이다.
        따라서 $A=\left(\begin{matrix}a&0\\0&d\end{matrix}\right)$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 1.A2
    - id: 1b-3
      content: $A^2=\left(\begin{matrix}a^2&0\\0&d^2\end{matrix}\right)=E$이므로 $a^2=1,\ d^2=1$이다. 그러므로 $a=\pm1,\ d=\pm1$이다. 그런데 $ad=bc+1$이므로 $A=\left(\begin{matrix}1&0\\0&1\end{matrix}\right)$ 또는 $A=\left(\begin{matrix}-1&0\\0&-1\end{matrix}\right)$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 케일리·해밀턴의 공식을 이용하여 $(a+d)b=0$이고 $(a+d)c=0$인 관계를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $b=0,\ c=0$을 구하고 행렬 $A=\left(\begin{matrix}a&0\\0&d\end{matrix}\right)$를 구했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: $a=\pm1,\ d=\pm1$을 구하고 $ad=bc+1$을 이용하여 $A=\left(\begin{matrix}1&0\\0&1\end{matrix}\right)$ 또는 $A=\left(\begin{matrix}-1&0\\0&-1\end{matrix}\right)$를 구했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [2] 제시문 3에서 주어진 (성질 1)을 만족시키는 함수 $f:\mathbb{R}\to\mathbb{R}$가 다음 성질을 만족한다.
    $$x>0\Leftrightarrow f(x)>0$$
    이때 집합 $W=\{x\in\mathbb{Z}\mid f(x^2)<f(4x-3)\}$에 속하는 원소의 개수를 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $f(0)=f(0)+f(0)$이므로 $f(0)=0$이다. 또한 $f(0)=f(x^2+(-x^2))=f(x^2)+f(-x^2)$이므로 $f(-x^2)=-f(x^2)$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 2.M1
    - id: 2b-2
      content: 그러므로 $f(x^2)<f(4x-3)\Leftrightarrow f(-x^2+4x-3)>0\Leftrightarrow-x^2+4x-3>0\Leftrightarrow1<x<3$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 2.M1
    - id: 2b-3
      content: 따라서 $W=\{x\in\mathbb{Z}\mid f(x^2)<f(4x-3)\}=\{x\in\mathbb{Z}\mid1<x<3\}=\{2\}$이므로 원소의 개수는 $1$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $f(0)=0$과 $f(-x^2)=-f(x^2)$를 이용하여 $f(x^2)<f(4x-3)\Leftrightarrow f(-x^2+4x-3)>0\Leftrightarrow-x^2+4x-3>0\Leftrightarrow1<x<3$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2b-2
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: $W=\{2\}$와 원소의 개수가 $1$임을 구했다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: '[3] 함수 $g:\mathbb{R}\to\mathbb{R}$가 제시문 3에서 주어진 (성질 1)과 (성질 2)를 모두 만족시키는 일대일 함수일 때 $g(\sqrt3)$의 값을 구하시오. [10점]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: sqrt(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $g(0)=g(0)+g(0)$이므로 $g(0)=0$이다. 또한, $g(1)=g(1)g(1)$이므로 $g(1)=0$ 또는 $g(1)=1$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 3.M1
    - id: 3b-2
      content: 그런데 $g$는 일대일 함수이므로 $g(1)=1$이고 $g(3)=g(1)+g(1)+g(1)=3$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 3.M1
    - id: 3b-3
      content: 또한 $3=g(3)=g(\sqrt3\,\sqrt3)=\{g(\sqrt3)\}^2$이므로 $g(\sqrt3)=\pm\sqrt3$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 3.A2
    - id: 3b-4
      content: 그런데 $g(\sqrt3)=g(\sqrt[4]3\,\sqrt[4]3)=\{g(\sqrt[4]3)\}^2\ge0$이므로 $g(\sqrt3)=\sqrt3$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 3.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: $g(0)=0$을 구하고 $g$가 일대일 함수임을 이용하여 $g(1)=1$이고 $g(3)=3$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
      - 3b-2
    - id: 3.A2
      mark_type: A
      points: 5
      evidence: $g(\sqrt3)=\pm\sqrt3$를 구하고 $g(\sqrt3)\ge0$임을 이용하여 $g(\sqrt3)=\sqrt3$를 구했다.
      depends_on:
      - 3.M1
      implied_ok: false
      steps:
      - 3b-3
      - 3b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 4-1
  stem: |
    [4] 함수 $g:\mathbb{Z}\to\mathbb{Z}$는 제시문 3에서 주어진 (성질 1)을 만족시키고 어떤 $t\in\mathbb{Z}$에 대하여 $g(t)\ne0$이다. 또한 함수 $h:M(\mathbb{Z})\to M(\mathbb{Z})$를 다음과 같이 정의하자.
    $$A=\left(\begin{matrix}a&b\\c&d\end{matrix}\right)\in M(\mathbb{Z})\text{에 대하여 }h(A)=\left(\begin{matrix}a&g(b)\\c&g(d)\end{matrix}\right)$$

    (1) 모든 $m\in\mathbb{Z}$에 대하여 $g(m)=mg(1)$이 성립함을 증명하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: (ⅰ) $m=0$이면 $g(0)=g(0)+g(0)$이므로 $g(0)=0$이다. 따라서 $g(0)=0=0g(1)$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 4-1.R1
    - id: 41b-2
      content: (ⅱ) $m>0$이면 $g(m)=g(1+1+\cdots+1)=g(1)+g(1)+\cdots+g(1)=mg(1)$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 4-1.R2
    - id: 41b-3
      content: |
        (ⅲ) $m<0$이면 $g(m)=g((-m)(-1))=g(-1)+g(-1)+\cdots+g(-1)=(-m)g(-1)$이다.
        그런데 $0=g(0)=g(1+(-1))=g(1)+g(-1)$이므로 $g(-1)=-g(1)$이고 $g(m)=(-m)g(-1)=-(-m)g(1)=mg(1)$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 4-1.R3
    - id: 41b-4
      content: 그러므로 모든 $m\in\mathbb{Z}$에 대하여 $g(m)=mg(1)$이 성립한다.
      source_flow: 모범답안 p.7
      criteria:
      - 4-1.R3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4-1.R1
      mark_type: R
      points: 2
      evidence: $m=0$인 경우에 $g(0)=0g(1)$임을 보였다.
      depends_on: []
