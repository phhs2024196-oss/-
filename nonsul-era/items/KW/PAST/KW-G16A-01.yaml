    - id: 4-1.R2
      mark_type: R
      points: 2
      evidence: $m>0$인 경우에 $g(m)=mg(1)$임을 보였다.
      depends_on: []
      implied_ok: false
      steps:
      - 41b-2
    - id: 4-1.R3
      mark_type: R
      points: 5
      evidence: $m<0$인 경우에 $g(-1)=-g(1)$과 $g(m)=(-m)g(-1)$을 이용하여 $g(m)=mg(1)$임을 보였다.
      depends_on: []
      implied_ok: false
      steps:
      - 41b-3
      - 41b-4
