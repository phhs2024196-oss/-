- id: 4-2
  stem: |
    (2) 모든 $n\in\mathbb{N}$에 대하여 다음 등식이 성립함을 수학적 귀납법을 이용하여 증명하시오. (단, $h^1=h$이고 $h^{n+1}=h\circ h^n$이다.) [7점]
    $$h^n(A)=\left(\begin{matrix}a&b\{g(1)\}^n\\c&d\{g(1)\}^n\end{matrix}\right)$$
  points: 7
  depends_on:
  - 4-1
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: $n=1$일 때 $h^1(A)=h(A)=\left(\begin{matrix}a&g(b)\\c&g(d)\end{matrix}\right)=\left(\begin{matrix}a&bg(1)\\c&dg(1)\end{matrix}\right)$이므로 성립한다.
      source_flow: 모범답안 p.7
      criteria:
      - 4-2.R1
    - id: 42b-2
      content: $n=k$일 때 성립한다고 가정하자. 즉, $h^k(A)=\left(\begin{matrix}a&b\{g(1)\}^k\\c&d\{g(1)\}^k\end{matrix}\right)$라 가정하자.
      source_flow: 모범답안 p.7
      criteria:
      - 4-2.R1
    - id: 42b-3
      content: |
        그러면 $h^{k+1}(A)=(h\circ h^k)(A)=h\left(\begin{matrix}a&b\{g(1)\}^k\\c&d\{g(1)\}^k\end{matrix}\right)=\left(\begin{matrix}a&g(b\{g(1)\}^k)\\c&g(d\{g(1)\}^k)\end{matrix}\right)=\left(\begin{matrix}a&b\{g(1)\}^kg(1)\\c&d\{g(1)\}^kg(1)\end{matrix}\right)=\left(\begin{matrix}a&b\{g(1)\}^{k+1}\\c&d\{g(1)\}^{k+1}\end{matrix}\right)$이다.
        즉, $n=k+1$인 경우에도 성립하므로 수학적 귀납법에 의하여 주어진 식이 증명된다.
      source_flow: 모범답안 p.8
      criteria:
      - 4-2.R2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
