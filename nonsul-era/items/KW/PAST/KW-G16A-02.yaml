      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: $\overrightarrow{OP}\cdot\overrightarrow{OQ}=3\cos t(1+\cos t)$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: $\lvert\overrightarrow{OP}\rvert=1+\cos t$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-3
    - id: 2.M3
      mark_type: M
      points: 2
      evidence: $\lvert\overrightarrow{OQ}\rvert=3\lvert\cos t\rvert$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-4
    - id: 2.M4
      mark_type: M
      points: 2
      evidence: $3\cos t(1+\cos t)=3\lvert\cos t\rvert(1+\cos t)\cos\theta$를 세우고 $\cos\theta=\dfrac{\cos t}{\lvert\cos t\rvert}$를 구했다.
      depends_on:
      - 2.M1
      - 2.M2
      - 2.M3
      implied_ok: false
      steps:
      - 2b-5
    - id: 2.A5
      mark_type: A
      points: 2
      evidence: $0<t<\dfrac\pi2$에서 $\cos\theta=1$, $\dfrac\pi2<t<\pi$에서 $\cos\theta=-1$을 구했다.
      depends_on:
      - 2.M4
      implied_ok: false
      steps:
      - 2b-6
    - id: 2.A6
      mark_type: A
      points: 2
      evidence: $0<t<\dfrac\pi2$에서 $\theta=0$, $\dfrac\pi2<t<\pi$에서 $\theta=\pi$를 구했다.
      depends_on:
      - 2.M4
      implied_ok: false
      steps:
      - 2b-7
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-1
  stem: |
    [3] 두 곡선이 $t=t_0$일 때 점 $C$에서 만난다고 하자.
    (1) 점 $C$의 좌표를 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: expression
    value: x=3/4; y=3*sqrt(3)/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        두 곡선이 $t$일 때 만나면 두 점의 대응하는 성분이 각각 같아야 하므로 다음이 성립한다.
        $$\cos t+\cos^2t=3\cos^2t,\quad\sin t+\cos t\sin t=3\cos t\sin t,\quad0\le t\le\pi$$
        이를 정리하면 다음 연립방정식을 얻는다.
        $$\cos t(1-2\cos t)=0,\ \sin t(1-2\cos t)=0,\ 0\le t\le\pi$$
      source_flow: 채점 가이드 p.12
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: 따라서 $\cos t=\dfrac12,\ t=\dfrac\pi3$이다.
      source_flow: 채점 가이드 p.12
      criteria:
      - 3-1.A2
    - id: 31b-3
      content: |
        따라서 점 $C$의 좌표는 다음과 같다.
        $$C\left(\dfrac34,\dfrac{3\sqrt3}4\right)$$
      source_flow: 채점 가이드 p.12
      criteria:
      - 3-1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 2
      evidence: 두 점의 대응하는 성분이 같다는 식을 세워 연립방정식 $\cos t(1-2\cos t)=0,\ \sin t(1-2\cos t)=0$을 얻었다.
      depends_on: []
      implied_ok: false
      steps:
      - 31b-1
    - id: 3-1.A2
      mark_type: A
      points: 2
      evidence: $\cos t=\dfrac12$, $t=\dfrac\pi3$를 구했다.
      depends_on:
