stimuli:
- label: 매개변수로 나타내어진 함수
  body: |
    [매개변수로 나타내어진 함수] 두 변수 $x,\ y$ 사이의 함수 관계가 변수 $t$를 매개로 하여
    $$x=f(t),\ y=g(t)$$
    의 꼴로 나타내어 질 때 변수 $t$를 $x,\ y$의 매개변수라 하고, 이 관계를 매개변수로 나타내어진 함수라고 한다.
- label: 매개변수로 나타내어진 함수의 도함수
  body: |
    [매개변수로 나타내어진 함수의 도함수] 매개변수 $t$로 나타내어진 두 함수 $x=f(t),\ y=g(t)$가 $t$에 대하여 미분가능하고 $\dfrac{dx}{dt}=f^{\prime}(t)\ne0$이면
    $$\dfrac{dy}{dx}=\dfrac{\dfrac{dy}{dt}}{\dfrac{dx}{dt}}=\dfrac{\dfrac{dg}{dt}}{\dfrac{df}{dt}}=\dfrac{g^{\prime}(t)}{f^{\prime}(t)}$$
- label: 매개변수로 나타내어진 곡선의 길이
  body: |
    [매개변수로 나타내어진 곡선의 길이] 두 함수 $f(t),g(t)$의 도함수 $f^{\prime}(t),g^{\prime}(t)$가 모두 구간 $(\alpha,\beta)$에서 연속일 때, 매개변수 $t$로 나타내어진 곡선 $x=f(t),\ y=g(t)\ (\alpha\le t\le\beta)$의 길이 $l$은
    $$l=\int_{\alpha}^{\beta}\sqrt{\{f^{\prime}(t)\}^2+\{g^{\prime}(t)\}^2}\,dt$$
- label: 벡터의 내적
  body: |
    [벡터의 내적] 두 벡터 $\vec{a},\ \vec{b}$가 이루는 각의 크기가 $\theta$일 때,
    $$\vec{a}\cdot\vec{b}=\lvert\vec{a}\rvert\lvert\vec{b}\rvert\cos\theta\quad(0\le\theta\le\pi)$$
- label: 합성함수의 미분법
  body: |
    [합성함수의 미분법] 두 함수 $y=f(u),\ u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는
    $$\dfrac{dy}{dx}=\dfrac{dy}{du}\dfrac{du}{dx}=f^{\prime}(g(x))g^{\prime}(x)$$
- label: 음함수의 미분법
  body: '[음함수의 미분법] 음함수 $f(x,y)=0$의 각 항을 합성함수의 미분법을 이용하여 $x$에 관하여 미분한 후, $\dfrac{dy}{dx}$를 구한다.'
stem: '[문제 2] 다음 제시문을 이용하여 문항 별로 풀이와 함께 답하시오. (50점)'
subparts:
- id: '1'
  stem: |
    ※ ([1]~[5]) 평면 위에서 움직이는 점 $P(x,y)$의 좌표가 매개변수 $t$의 함수로 다음과 같이 주어졌다.
    $$x=\cos t+\cos^2t,\ y=\sin t+\dfrac12\sin2t,\ 0\le t\le\pi$$
    이때 점 $P$가 만드는 곡선을 그리면 [그림 1: 점 $P$가 만드는 곡선. $(2,0)$에서 출발해 위쪽으로 휘어 올라가 $y$축 왼쪽 $x<0$ 부분을 지나 원점으로 돌아오는 곡선]과 같다. 또한 같은 평면 위에서 움직이는 다른 점 $Q(x,y)$는 매개변수 $t$의 함수로 다음과 같이 주어졌다.
    $$x=3\cos^2t,\ y=3\sin t\cos t,\ 0\le t\le\pi$$
    점 $P$와 $Q$가 만드는 평면 위의 두 곡선에 대한 다음 물음에 답하시오.
    [그림 1] 점 $P$가 만드는 곡선

    [1] 점 $Q$를 나타내는 $x=3\cos^2t,\ y=3\sin t\cos t$에서 변수 $t$를 소거하여 점 $Q$가 그리는 곡선을 두 변수 $x$와 $y$만의 관계식으로 나타내고, 그 관계식이 어떤 도형을 나타내는지 서술하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: expression
    value: x**2+y**2=3*x
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 $x,y$를 제곱하면 다음을 얻는다.
        $$x^2=9\cos^4t,\ y^2=9\sin^2t\cos^2t$$
        (또는 $y^2=9\sin^2t\cos^2t=3\sin^2t\,3\cos^2t$)
      source_flow: 채점 가이드 p.10
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이때 $\cos^2t+\sin^2t=1$이고 $x=3\cos^2t$이므로 다음이 성립한다.
        $$x^2+y^2=9\cos^2t(\cos^2t+\sin^2t)=3x$$
        (또는 $y^2=3(1-\cos^2t)x=3x-x^2$)
        이를 정리하면 다음과 같다.
        $$\left(x-\dfrac32\right)^2+y^2=\left(\dfrac32\right)^2\ \text{또는}\ x^2+y^2=3x$$
      source_flow: 채점 가이드 p.10
      criteria:
      - 1.M2
    - id: 1b-3
      content: 따라서 구하는 관계식은 중심이 $\left(\dfrac32,0\right)$이고 반지름이 $\dfrac32$인 원을 나타낸다.
      source_flow: 채점 가이드 p.10
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $x^2=9\cos^4t,\ y^2=9\sin^2t\cos^2t$ (또는 $y^2=3\sin^2t\,3\cos^2t$)를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $\cos^2t+\sin^2t=1$을 이용하여 $x^2+y^2=3x$ (또는 $\left(x-\dfrac32\right)^2+y^2=\left(\dfrac32\right)^2$)를 구했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: 중심이 $\left(\dfrac32,0\right)$이고 반지름이 $\dfrac32$인 원임을 서술했다.
      depends_on:
      - 1.M2
      implied_ok: false
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: '[2] $0<t<\pi$이고 $t\ne\dfrac\pi2$인 $t$에 대응하는 점 $P$와 $Q$에 대하여 두 벡터 $\overrightarrow{OP}$와 $\overrightarrow{OQ}$가 이루는 각 $\theta$의 크기를 구하시오. (단, 점 $O$는 평면의 원점이다.) [12점]'
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: th1=0; th2=pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        먼저 두 벡터를 구하면 다음과 같다.
        $$\overrightarrow{OP}=\left(\cos t+\cos^2t,\ \sin t+\dfrac12\sin2t\right)=(\cos t+\cos^2t,\ \sin t+\sin t\cos t)$$
        $$\overrightarrow{OQ}=(3\cos^2t,\ 3\cos t\sin t)$$
        두 벡터가 이루는 각을 $\theta$라고 하자. 벡터의 내적에 의해 다음이 성립한다.
        $$\overrightarrow{OP}\cdot\overrightarrow{OQ}=\lvert\overrightarrow{OP}\rvert\lvert\overrightarrow{OQ}\rvert\cos\theta$$
      source_flow: 채점 가이드 p.11
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        그런데 삼각함수의 성질을 이용하여 정리하면
        $$\overrightarrow{OP}\cdot\overrightarrow{OQ}=3\cos^3t+3\cos^4t+3\cos t\sin^2t+3\cos^2t\sin^2t$$
        $$=3\cos t(\cos^2t+\sin^2t)+3\cos^2t(\cos^2t+\sin^2t)$$
        $$=3\cos t+3\cos^2t$$
        $$=3\cos t(1+\cos t)$$
      source_flow: 채점 가이드 p.11
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        $$\lvert\overrightarrow{OP}\rvert=\sqrt{\cos^2t+2\cos^3t+\cos^4t+\sin^2t+2\sin^2t\cos t+\sin^2t\cos^2t}$$
        $$=\sqrt{1+2\cos^3t+2\sin^2t\cos t+\cos^4t+\sin^2t\cos^2t}$$
        $$=\sqrt{1+2\cos t(\cos^2t+\sin^2t)+\cos^2t(\cos^2t+\sin^2t)}$$
        $$=1+\cos t$$
      source_flow: 채점 가이드 p.11
      criteria:
      - 2.M2
    - id: 2b-4
      content: $$\lvert\overrightarrow{OQ}\rvert=\sqrt{9\cos^4t+9\cos^2t\sin^2t}=\sqrt{9\cos^2t(\cos^2t+\sin^2t)}=3\lvert\cos t\rvert$$
      source_flow: 채점 가이드 p.11
      criteria:
      - 2.M3
    - id: 2b-5
      content: |
        이므로 $\overrightarrow{OP}\cdot\overrightarrow{OQ}=\lvert\overrightarrow{OP}\rvert\lvert\overrightarrow{OQ}\rvert\cos\theta$에서 다음을 얻는다.
        $$3\cos t(1+\cos t)=3\lvert\cos t\rvert(1+\cos t)\cos\theta$$
        따라서 주어진 $t$에 대해 다음을 얻는다.
        $$\cos\theta=\dfrac{\cos t}{\lvert\cos t\rvert},\quad0<t<\pi,\ t\ne\dfrac\pi2$$
      source_flow: 채점 가이드 p.11
      criteria:
      - 2.M4
    - id: 2b-6
      content: |
        그런데 $\lvert\cos t\rvert=\begin{cases}\cos t,&0<t<\dfrac\pi2\\-\cos t,&\dfrac\pi2<t<\pi\end{cases}$이므로 다음이 성립한다.
        $$\cos\theta=\begin{cases}1,&0<t<\dfrac\pi2\\-1,&\dfrac\pi2<t<\pi\end{cases}$$
      source_flow: 채점 가이드 p.11~12
      criteria:
      - 2.A5
    - id: 2b-7
      content: |
        이로부터 다음을 얻는다.
        $$\theta=\begin{cases}0,&0<t<\dfrac\pi2\\\pi,&\dfrac\pi2<t<\pi\end{cases}$$
      source_flow: 채점 가이드 p.12
      criteria:
      - 2.A6
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
