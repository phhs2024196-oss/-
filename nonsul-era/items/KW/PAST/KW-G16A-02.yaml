      content: |
        문항 [1]에서 점 $Q$가 만드는 곡선은 다음과 같은 원임을 보였다.
        $$\left(x-\dfrac32\right)^2+y^2=\left(\dfrac32\right)^2\ \text{또는}\ x^2+y^2=3x$$
        이로부터 음함수 미분법을 사용하면 다음을 얻는다.
        $$2x+2y\dfrac{dy}{dx}=3\ \text{또는}\ \dfrac{dy}{dx}=\dfrac{3-2x}{2y}$$
      source_flow: 채점 가이드 p.13
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: |
        따라서 점 $C\left(\dfrac34,\dfrac{3\sqrt3}4\right)$에서 접선의 방정식의 기울기는 다음과 같다.
        $$\dfrac{dy}{dx}=\dfrac{3-2\cdot\dfrac34}{2\cdot\dfrac{3\sqrt3}4}=\dfrac{\sqrt3}3$$
      source_flow: 채점 가이드 p.13
      criteria:
      - 4-2.A2
    - id: 42b-3
      content: |
        따라서 구하는 접선의 방정식은 다음과 같다.
        $$y-\dfrac{3\sqrt3}4=\dfrac{\sqrt3}3\left(x-\dfrac34\right)\ \text{또는}\ y=\dfrac{\sqrt3}3x+\dfrac{\sqrt3}2$$
      source_flow: 채점 가이드 p.13
      criteria:
      - 4-2.A3
    - id: 42b-4
      content: |
        [※ 별해] 접선의 기울기를 다음과 같이 구할 수도 있다. (총 4점)
        점 $Q(3\cos^2t,\ 3\cos t\sin t)$에 대하여 $2\sin t\cos t=\sin2t$이므로 다음이 성립한다.
        $$\dfrac{dy}{dx}=\dfrac{\dfrac{dy}{dt}}{\dfrac{dx}{dt}}=\dfrac{3\cos2t}{-6\cos t\sin t}$$
        따라서 $t=\dfrac\pi3$이면 다음을 얻는다.
        $$\dfrac{dy}{dx}=\dfrac{3\cdot\left(-\dfrac12\right)}{(-6)\cdot\dfrac12\cdot\dfrac{\sqrt3}2}=\dfrac{\sqrt3}3$$
      source_flow: 채점 가이드 p.13
      criteria:
