- id: '5'
  stem: |
    [5] $0\le t\le s$의 구간에서 점 $P$가 만드는 곡선의 길이를 $D(s)$, 점 $Q$가 만드는 곡선의 길이를 $L(s)$라고 할 때, 다음 극한값을 구하시오. (단, $s\le\pi$) [11점]
    $$\lim_{s\to+0}\dfrac{D(s)}{L(s)}$$
  points: 11
  depends_on: []
  answer:
    kind: value
    value: 2/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        점 $P$에 대해
        $$\begin{cases}x^{\prime}(t)=-\sin t-2\cos t\sin t=-\sin t-\sin2t\\y^{\prime}(t)=\cos t+\cos2t\end{cases}$$
        이므로 다음을 얻는다.
        $$(x^{\prime}(t))^2+(y^{\prime}(t))^2=\sin^2t+2\sin t\sin2t+\sin^22t+\cos^2t+2\cos t\cos2t+\cos^22t$$
        $$=2+2\{\cos2t\cos t+\sin2t\sin t\}=2(1+\cos t)=4\cos^2\dfrac t2$$
      source_flow: 채점 가이드 p.14
      criteria:
      - 5.M1
    - id: 5b-2
      content: |
        따라서 구간 $0\le t\le s$에 대응하는 구하는 곡선의 길이 $D(s)$는 다음과 같다.
        $$D(s)=\int_0^s\sqrt{(x^{\prime}(t))^2+(y^{\prime}(t))^2}\,dt=\int_0^s2\cos\dfrac t2\,dt=\left[4\sin\dfrac t2\right]_0^s=4\sin\dfrac s2$$
      source_flow: 채점 가이드 p.14
      criteria:
      - 5.M2
    - id: 5b-3
      content: |
        한편, 점 $Q$에 대해
        $$\begin{cases}x^{\prime}(t)=-6\cos t\sin t=-3\sin2t\\y^{\prime}(t)=3\cos2t\end{cases}$$
        이므로 구간 $0\le t\le s$에 대응하는 곡선의 길이 $L(s)$는 다음과 같다.
        $$L(s)=\int_0^s\sqrt{\{x^{\prime}(t)\}^2+\{y^{\prime}(t)\}^2}\,dt=\int_0^s3\sqrt{\sin^22t+\cos^22t}\,dt=[3t]_0^s=3s$$
      source_flow: 채점 가이드 p.14
      criteria:
      - 5.M3
    - id: 5b-4
      content: |
        따라서 $\displaystyle\lim_{x\to0}\dfrac{\sin x}x=1$임을 이용하면 다음을 얻는다.
        $$\lim_{s\to+0}\dfrac{D(s)}{L(s)}=\lim_{s\to+0}\dfrac{4\sin\dfrac s2}{3s}=\lim_{s\to+0}\dfrac{4\sin\dfrac s2}{6\cdot\dfrac s2}=\dfrac23$$
      source_flow: 채점 가이드 p.14
      criteria:
      - 5.A4
