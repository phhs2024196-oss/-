stimuli:
- label: 회전변환
  body: '[회전변환] 원점을 중심으로 각 $\theta$만큼 회전하는 회전변환의 행렬은 $\left(\begin{matrix}\cos\theta&-\sin\theta\\\sin\theta&\cos\theta\end{matrix}\right)$이다.'
- label: 닮음변환
  body: '[닮음변환] 원점을 닮음의 중심으로 하고 닮음비가 $k$인 닮음변환의 행렬은 $\left(\begin{matrix}k&0\\0&k\end{matrix}\right)$이다. (단, $k\ne0$)'
- label: 합성변환
  body: '[합성변환] 두 일차변환 $f$와 $g$의 행렬을 각각 $A,B$라 하면 합성변환 $g\circ f$는 행렬 $BA$로 나타내어지는 일차변환이 된다.'
- label: 역변환
  body: '[역변환] 일차변환 $f$의 행렬 $A$의 역행렬 $A^{-1}$가 존재하면 $f$의 역변환 $f^{-1}$가 존재하고, $f^{-1}$는 행렬 $A^{-1}$로 나타내어지는 일차변환이 된다.'
- label: 점과 직선과의 거리
  body: '[점과 직선과의 거리] 평면 위의 점 $(x_1,y_1)$과 직선 $ax+by+c=0$ 사이의 거리는 $\dfrac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$이다.'
stem: '[문제 1] 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오. (50점)'
subparts:
- id: '1'
  stem: |
    ※ ([1]~[5]) 평면 위에서 원점을 중심으로 각 $\dfrac\pi4$만큼 회전하는 회전변환 $f$와 닮음의 중심이 원점이고 닮음비가 $\dfrac1{\sqrt2}$인 닮음변환 $g$의 합성변환을 $h=g\circ f$라 하고, $h^n=\overbrace{h\circ h\circ\cdots\circ h}^{n\text{번}}$라 하자.

    [1] 변환 $h$와 $h^n$을 나타내는 행렬을 각각 구하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: expression
    value: H=Matrix([[1/2,-1/2],[1/2,1/2]]); Hn=(1/sqrt(2))**n*Matrix([[cos(n*pi/4),-sin(n*pi/4)],[sin(n*pi/4),cos(n*pi/4)]])
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        회전변환 $f$와 닮음변환 $g$를 나타내는 행렬을 각각 $A,\ B$라 하면 합성변환 $h=g\circ f$를 나타내는 행렬은 $H=BA$로 나타낼 수 있다.
        $$A=\left(\begin{matrix}\cos\frac\pi4&-\sin\frac\pi4\\\sin\frac\pi4&\cos\frac\pi4\end{matrix}\right)=\left(\begin{matrix}\frac1{\sqrt2}&-\frac1{\sqrt2}\\\frac1{\sqrt2}&\frac1{\sqrt2}\end{matrix}\right),\quad B=\left(\begin{matrix}\frac1{\sqrt2}&0\\0&\frac1{\sqrt2}\end{matrix}\right)$$
        이므로
        $$H=\left(\begin{matrix}\frac12&-\frac12\\\frac12&\frac12\end{matrix}\right)=\frac12\left(\begin{matrix}1&-1\\1&1\end{matrix}\right)$$
        이다.
      source_flow: 채점 가이드 p.7
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        한편, 원점을 중심으로 각 $\theta$만큼 회전하는 회전변환의 행렬을 $F$, 닮음의 중심이 원점이고 닮음비가 $k$인 닮음변환의 행렬을 $G$라 하면
        $$F=\left(\begin{matrix}\cos\theta&-\sin\theta\\\sin\theta&\cos\theta\end{matrix}\right),\quad G=\left(\begin{matrix}k&0\\0&k\end{matrix}\right)$$
        이므로 $F^n=\left(\begin{matrix}\cos n\theta&-\sin n\theta\\\sin n\theta&\cos n\theta\end{matrix}\right),\ G^n=\left(\begin{matrix}k^n&0\\0&k^n\end{matrix}\right)$이다.
        (단, 회전행렬 $F^n$의 일반항을 구하지 않아도 아래의 합성행렬 $H^n$을 정확히 구하면 정답으로 인정한다.)
      source_flow: 채점 가이드 p.8
      criteria:
      - 1.A2
    - id: 1b-3
      content: |
        따라서 변환 $h$를 $n$번 반복해서 수행한 변환 $h^n$을 나타내는 행렬은 $H^n=(BA)^n=B^nA^n$이므로
        $$H^n=B^nA^n=\left(\begin{matrix}\frac1{\sqrt2}&0\\0&\frac1{\sqrt2}\end{matrix}\right)^n\left(\begin{matrix}\cos\frac\pi4&-\sin\frac\pi4\\\sin\frac\pi4&\cos\frac\pi4\end{matrix}\right)^n=\left(\begin{matrix}\left(\frac1{\sqrt2}\right)^n&0\\0&\left(\frac1{\sqrt2}\right)^n\end{matrix}\right)\left(\begin{matrix}\cos\frac n4\pi&-\sin\frac n4\pi\\\sin\frac n4\pi&\cos\frac n4\pi\end{matrix}\right)$$
        $$=\left(\frac1{\sqrt2}\right)^n\left(\begin{matrix}\cos\frac n4\pi&-\sin\frac n4\pi\\\sin\frac n4\pi&\cos\frac n4\pi\end{matrix}\right)$$
        이 된다.
      source_flow: 채점 가이드 p.8
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        [별해1] 회전변환 행렬 $F^n$을 구할 때, 아래와 같이 수학적 귀납법을 이용해 유도할 수도 있다.
        $n=1$일 때, $F^1=\left(\begin{matrix}\cos\theta&-\sin\theta\\\sin\theta&\cos\theta\end{matrix}\right)=F$이므로 성립한다.
        $n=k$일 때 성립한다고 가정하면, $F^k=\left(\begin{matrix}\cos k\theta&-\sin k\theta\\\sin k\theta&\cos k\theta\end{matrix}\right)$
        $n=k+1$일 때, $F^{k+1}=F^kF=\left(\begin{matrix}\cos k\theta&-\sin k\theta\\\sin k\theta&\cos k\theta\end{matrix}\right)\left(\begin{matrix}\cos\theta&-\sin\theta\\\sin\theta&\cos\theta\end{matrix}\right)$
        $$=\left(\begin{matrix}\cos k\theta\cos\theta-\sin k\theta\sin\theta&-\cos k\theta\sin\theta-\sin k\theta\cos\theta\\\sin k\theta\cos\theta+\cos k\theta\sin\theta&-\sin k\theta\sin\theta+\cos k\theta\cos\theta\end{matrix}\right)$$
        삼각함수의 변환공식에 의해
        $$\cos k\theta\cos\theta-\sin k\theta\sin\theta=\frac12\{\cos(k+1)\theta+\cos(k-1)\theta\}+\frac12\{\cos(k+1)\theta-\cos(k-1)\theta\}=\cos(k+1)\theta$$
        $$\sin k\theta\cos\theta+\cos k\theta\sin\theta=\frac12\{\sin(k+1)\theta+\sin(k-1)\theta\}+\frac12\{\sin(k+1)\theta-\sin(k-1)\theta\}=\sin(k+1)\theta$$
        따라서 $F^{k+1}=\left(\begin{matrix}\cos(k+1)\theta&-\sin(k+1)\theta\\\sin(k+1)\theta&\cos(k+1)\theta\end{matrix}\right)$이므로 성립한다.
        그러므로 $F=\left(\begin{matrix}\cos\theta&-\sin\theta\\\sin\theta&\cos\theta\end{matrix}\right)$일 때, $F^n=\left(\begin{matrix}\cos n\theta&-\sin n\theta\\\sin n\theta&\cos n\theta\end{matrix}\right)$이다.
      source_flow: 채점 가이드 p.8
      criteria:
      - 1.A2
    - id: 1b-5
      content: |
        [별해2] 합성변환 행렬 $H^n$을 구할 때, $H$를 8번 곱하여 $H^1\sim H^8$로 $H^n$ 행렬을 표현한 경우에는 일반항을 정확하게 구하지 못했으므로 부분점수만 인정한다. [최대 3점] (단, 행렬 $H$의 부분점수는 별도)
        $$H=\frac12\left(\begin{matrix}1&-1\\1&1\end{matrix}\right),\quad H^2=\frac12\left(\begin{matrix}0&-1\\1&0\end{matrix}\right),\quad H^3=\frac14\left(\begin{matrix}-1&-1\\1&-1\end{matrix}\right),\quad H^4=\frac14\left(\begin{matrix}-1&0\\0&-1\end{matrix}\right)$$
        $$H^5=\frac18\left(\begin{matrix}-1&1\\-1&-1\end{matrix}\right),\quad H^6=\frac18\left(\begin{matrix}0&1\\-1&0\end{matrix}\right),\quad H^7=\frac1{16}\left(\begin{matrix}1&1\\-1&1\end{matrix}\right),\quad H^8=\frac1{16}\left(\begin{matrix}1&0\\0&1\end{matrix}\right)$$
      source_flow: 채점 가이드 p.8~9
      criteria:
      - 1.A2
