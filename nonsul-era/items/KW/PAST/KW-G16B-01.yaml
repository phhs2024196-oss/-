    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 합성변환 $h=g\circ f$의 행렬 $H=BA=\frac12\left(\begin{matrix}1&-1\\1&1\end{matrix}\right)$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
