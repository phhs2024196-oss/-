        $$h(C)=\left(\begin{matrix}\frac12&-\frac12\\\frac12&\frac12\end{matrix}\right)\left(\begin{matrix}a\\\frac1a\end{matrix}\right)=\left(\begin{matrix}\frac12a-\frac1{2a}\\\frac12a+\frac1{2a}\end{matrix}\right)=\left(\begin{matrix}b\\\frac1b\end{matrix}\right)$$
        이므로 $a$와 $b$의 관계식을 구하면 $a-\frac1a=2b,\ a+\frac1a=\frac2b$가 된다.
