  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: 변환 $h$의 정의에 의해 변환 $h$를 $4k$번 적용하면($180^\circ$씩 회전) 직선 $l_0$와 옮겨진 직선은 서로 평행한 위치 관계가 된다. 따라서 평행한 위치 관계가 되는 최소의 자연수 $m=4$이다.
      source_flow: 채점 가이드 p.11
      criteria:
      - 5.M1
    - id: 5b-2
      content: 이때 변환 $h^4$의 행렬 $H^4=\left(\begin{matrix}\left(\frac1{\sqrt2}\right)^4\cos\frac44\pi&-\left(\frac1{\sqrt2}\right)^4\sin\frac44\pi\\\left(\frac1{\sqrt2}\right)^4\sin\frac44\pi&\left(\frac1{\sqrt2}\right)^4\cos\frac44\pi\end{matrix}\right)=-\frac14\left(\begin{matrix}1&0\\0&1\end{matrix}\right)$이 된다.
      source_flow: 채점 가이드 p.11
      criteria:
      - 5.M1
    - id: 5b-3
      content: |
        따라서 변환 $h^4$에 의하여 직선 $l_0$ 위의 점 $(x,y)$가 직선 $l_4$ 위의 점 $(x',y')$으로 옮겨진다고 하면
        $$\left(\begin{matrix}x'\\y'\end{matrix}\right)=-\frac14\left(\begin{matrix}1&0\\0&1\end{matrix}\right)\left(\begin{matrix}x\\y\end{matrix}\right)=\left(\begin{matrix}-\frac14x\\-\frac14y\end{matrix}\right)$$
        이므로 옮겨진 직선 $l_4$는 $4x'+4y'=-1$이 된다.
      source_flow: 채점 가이드 p.11
      criteria:
      - 5.M2
    - id: 5b-4
      content: |
        원점으로부터 직선 $l_0$까지의 거리 $d_0$는 $d_0=\frac{\lvert-1\rvert}{\sqrt{1^2+1^2}}=\frac1{\sqrt2}=\frac{\sqrt2}2$이고 직선 $l_4$까지의 거리 $d_4$는 $d_4=\frac{\lvert1\rvert}{\sqrt{4^2+4^2}}=\frac1{4\sqrt2}=\frac{\sqrt2}8$이다.
        따라서 두 직선 사이의 거리는 $d_0+d_4=\frac{\sqrt2}2+\frac{\sqrt2}8=\frac{5\sqrt2}8$이 된다.
      source_flow: 채점 가이드 p.12
      criteria:
      - 5.A3
    - id: 5b-5
      content: |
        [별해1] 변환 $h^4$에 의하여 처음으로 평행한 위치 관계가 됨을 설명하고, 옮겨진 직선 $l_4$를 구하는 대신 직선 $l_0$ 상의 한 점만을 변환 $h^4$에 의하여 옮기고 옮겨진 점과 $l_0$간의 거리로 답을 구하는 경우에도 정답으로 인정한다. [최대 11점]
        변환 $h$는 원점을 중심으로 $\frac\pi4$만큼 회전하는 변환이므로 4번 회전하면 원래 직선과 처음으로 평행이 된다.
        변환 $h^4$에 의하여 직선 $l_0$ 위의 한 점 $P(1,0)$이 옮겨진 점 $Q$는 $h^4(P)=-\frac14\left(\begin{matrix}1&0\\0&1\end{matrix}\right)\left(\begin{matrix}1\\0\end{matrix}\right)=\left(\begin{matrix}-\frac14\\0\end{matrix}\right)$이 되므로
        점 $Q\left(-\frac14,0\right)$와 직선 $l_0:x+y=1$간의 거리 $d=\frac{\left\lvert-\frac14-1\right\rvert}{\sqrt{1^2+1^2}}=\frac{\frac54}{\sqrt2}=\frac{5\sqrt2}8$이 된다.
      source_flow: 채점 가이드 p.12
      criteria:
      - 5.M2
      - 5.A3
