    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [2] 평면 위의 점 $Q(1,1)$이 변환 $h$와 역변환 $h^{-1}$에 의하여 옮겨진 점을 각각 $R,\ S$라 하자. 이때 두 벡터 $\overrightarrow{PR},\ \overrightarrow{PS}$의 내적
    $$\overrightarrow{PR}\cdot\overrightarrow{PS}=0$$
    을 만족하는 점 $P(x,y)$가 만드는 곡선의 길이를 구하시오. [11점]
  points: 11
  depends_on:
  - '1'
  answer:
    kind: value
    value: sqrt(5)*pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 역변환 $h^{-1}$의 행렬은 $H^{-1}=\left(\begin{matrix}\frac12&-\frac12\\\frac12&\frac12\end{matrix}\right)^{-1}=\left(\begin{matrix}1&1\\-1&1\end{matrix}\right)$이다.
      source_flow: 채점 가이드 p.9
      criteria:
      - 2.M1
    - id: 2b-2
      content: 점 $Q(1,1)$에 대하여 $h(Q)=\left(\begin{matrix}\frac12&-\frac12\\\frac12&\frac12\end{matrix}\right)\left(\begin{matrix}1\\1\end{matrix}\right)=\left(\begin{matrix}0\\1\end{matrix}\right)$이고, $h^{-1}(Q)=\left(\begin{matrix}1&1\\-1&1\end{matrix}\right)\left(\begin{matrix}1\\1\end{matrix}\right)=\left(\begin{matrix}2\\0\end{matrix}\right)$이므로 변환 $h$와 변환 $h^{-1}$에 의하여 옮겨진 두 점은 각각 $R(0,1),\ S(2,0)$이 된다.
      source_flow: 채점 가이드 p.9
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        따라서, 평면 위의 점 $P(x,y)$에 대하여 두 벡터 $\overrightarrow{PR},\ \overrightarrow{PS}$를 구하면
        $$\overrightarrow{PR}=\overrightarrow{OR}-\overrightarrow{OP}=(-x,1-y),\quad\overrightarrow{PS}=\overrightarrow{OS}-\overrightarrow{OP}=(2-x,-y)$$
        이다.
      source_flow: 채점 가이드 p.9
      criteria:
      - 2.M3
    - id: 2b-4
      content: |
        두 벡터의 내적 $\overrightarrow{PR}\cdot\overrightarrow{PS}=x(x-2)+y(y-1)=0$이므로 $(x-1)^2+\left(y-\frac12\right)^2=\frac54$이 된다.
        따라서 점 $P$는 중심이 $C\left(1,\frac12\right)$이고 반지름이 $\frac{\sqrt5}2$인 원으로 그 길이는 $\sqrt5\pi$이다.
      source_flow: 채점 가이드 p.9
      criteria:
      - 2.A4
