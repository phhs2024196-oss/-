    - id: 1.A2
      mark_type: A
      points: 6
      evidence: $H^n=B^nA^n=\left(\frac1{\sqrt2}\right)^n\left(\begin{matrix}\cos\frac n4\pi&-\sin\frac n4\pi\\\sin\frac n4\pi&\cos\frac n4\pi\end{matrix}\right)$을 구했다. (회전행렬 $F^n$의 일반항은 구하지 않아도 인정. $H^1\sim H^8$만 나열하면 최대 3점)
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
      - 1b-3
      - 1b-4
      - 1b-5
  outcome_codes:
