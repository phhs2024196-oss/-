- id: '5'
  stem: '[5] 변환 $h^n$에 의하여 평면 위의 직선 $l_0:x+y=1$이 옮겨진 직선을 $l_n$이라 하자. $l_0$과 $l_n$이 평행한 위치 관계가 되는 가장 작은 자연수 $m$에 대하여 $l_0$과 $l_m$ 사이의 거리를 구하시오. [11점]'
  points: 11
