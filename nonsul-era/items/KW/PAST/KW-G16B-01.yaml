    - id: 3b-1
      content: |
        변환 $h$는 원점 중심으로 $\frac\pi4$만큼 회전하면서 원점과의 거리가 $\frac1{\sqrt2}$의 비율로 줄어드는 합성변환이다.
        변환 $h$에 의하여 옮겨진 서로 이웃한 두 점 $P_{n-1}$과 $P_n$의 위치벡터를 각각 $\overrightarrow{OP_{n-1}},\ \overrightarrow{OP_n}$이라 하면 위치벡터 $\overrightarrow{OP_n}$의 크기는 $\lvert\overrightarrow{OP_n}\rvert=\frac1{\sqrt2}\lvert\overrightarrow{OP_{n-1}}\rvert$이고, 두 위치벡터 $\overrightarrow{OP_n}$과 $\overrightarrow{OP_{n-1}}$의 사잇각은 $\frac\pi4$이다.
      source_flow: 채점 가이드 p.9~10
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        삼각형 $OP_{n-1}P_n$의 넓이 $S_n=\frac12\lvert\overrightarrow{OP_{n-1}}\rvert\lvert\overrightarrow{OP_n}\rvert\sin\frac\pi4$이고, 삼각형 $OP_nP_{n+1}$의 넓이 $S_{n+1}=\frac12\lvert\overrightarrow{OP_n}\rvert\lvert\overrightarrow{OP_{n+1}}\rvert\sin\frac\pi4$이므로
        $$\frac{S_{n+1}}{S_n}=\frac{\lvert\overrightarrow{OP_{n+1}}\rvert}{\lvert\overrightarrow{OP_{n-1}}\rvert}=\left(\frac1{\sqrt2}\right)^2=\frac12$$
        이다.
      source_flow: 채점 가이드 p.10
      criteria:
      - 3.M2
    - id: 3b-3
      content: 따라서, 수열 $\{S_n\}$은 초항 $S_1=\frac12\lvert\overrightarrow{OP_0}\rvert\lvert\overrightarrow{OP_1}\rvert\sin\frac\pi4=\frac14$이고 공비가 $\frac12$인 등비수열이 되므로 무한급수의 합 $\displaystyle\sum_{n=1}^\infty S_n=\frac{\frac14}{1-\frac12}=\frac12$이다.
      source_flow: 채점 가이드 p.10
      criteria:
      - 3.A3
    - id: 3b-4
      content: |
        [별해1] 처음 몇 개의 점을 변환 $h$의 행렬을 이용해 직접 구하고, 이 점들의 기하학적인 위치를 통해 삼각형의 넓이의 규칙성을 이용해 답을 구하는 경우에는 삼각형 넓이의 수열 $\{S_n\}$의 일반항을 구하지 못하였으므로 부분점수만을 인정한다. [최대 5점]
        변환 $h$에 의하여 점 $P_0(1,0)$이 옮겨진 점을 차례로 계산하면
        $$P_1\left(\frac12,\frac12\right),\quad P_2\left(0,\frac12\right),\quad P_3\left(-\frac14,-\frac14\right),\quad P_4\left(-\frac14,0\right)$$
        이 된다. [판독확인: 원문 표기 $P_3\left(-\frac14,-\frac14\right)$ — 같은 쪽 그림과 $h$의 행렬로 계산하면 $P_3\left(-\frac14,\frac14\right)$]
        이때 원점을 중심으로 만든 삼각형의 넓이는
        $$S_1=\frac14,\quad S_2=\frac18,\quad S_3=\frac1{16},\quad S_4=\frac1{32},\ \cdots$$
        이 되므로 수열 $\{S_n\}$은 초항 $S_1=\frac14$이고 공비가 $\frac12$인 등비수열이다. 따라서 무한급수의 합 $\displaystyle\sum_{n=1}^\infty S_n=\frac{\frac14}{1-\frac12}=\frac12$이다.
      source_flow: 채점 가이드 p.10~11
      criteria:
      - 3.M1
