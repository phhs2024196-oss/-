stimuli:
- label: '1'
  body: |
    [정적분] 함수 $f(x)$가 닫힌 구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)\,dx=\lim_{n\to\infty}\sum_{k=1}^nf(x_k)\Delta x\quad\left(\text{단, }\Delta x=\frac{b-a}n,\ x_k=a+k\Delta x\right)$$
- label: '2'
  body: |
    [정적분의 기본 정리] 함수 $f(x)$가 닫힌 구간 $[a,b]$에서 연속이고, $f(x)$의 한 부정적분을 $F(x)$라고 하면 다음이 성립한다.
    $$\int_a^bf(x)\,dx=\left[F(x)\right]_a^b=F(b)-F(a)$$
- label: '3'
  body: |
    [평균값의 정리] 함수 $y=f(x)$가 닫힌 구간 $[a,b]$에서 연속이고, 열린 구간 $(a,b)$에서 미분가능하면
    $$\frac{f(b)-f(a)}{b-a}=f^{\prime}(c)\quad(a<c<b)$$
    인 $c$가 적어도 하나 존재한다.
- label: '4'
  body: |
    [함수의 증가] 함수 $f(x)$가 어떤 구간의 임의의 두 수 $x_1,x_2$에 대하여 다음 성질을 만족하면 $f(x)$는 그 구간에서 증가한다고 말한다.
    $$x_1<x_2\text{ 일 때},\ f(x_1)<f(x_2)$$
- label: '5'
  body: |
    [부분적분법] 두 함수 $f(x),g(x)$가 각각 연속인 도함수를 가질 때
    $$\int f(x)g^{\prime}(x)\,dx=f(x)g(x)-\int f^{\prime}(x)g(x)\,dx$$
stem: '[문제 2] 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오. (50점)'
subparts:
- id: '1'
  stem: |
    [1] 제시문 1의 정적분을 이용하여 다음 극한값을 구하시오. [9점]
    $$\lim_{n\to\infty}\sum_{k=2n+1}^{3n}\frac{\sqrt{nk}}{n^2}$$
  points: 9
  depends_on: []
  answer:
    kind: expression
    value: 2*sqrt(3)-4*sqrt(2)/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $$\lim_{n\to\infty}\sum_{k=2n+1}^{3n}\frac{\sqrt{nk}}{n^2}=\lim_{n\to\infty}\frac1n\sum_{k=2n+1}^{3n}\left(\sqrt{\frac kn}\right)=\lim_{n\to\infty}\frac1n\left(\sqrt{\frac{2n+1}n}+\sqrt{\frac{2n+2}n}+\cdots+\sqrt{\frac{2n+n}n}\right)$$
        $$=\lim_{n\to\infty}\frac1n\left(\sqrt{2+\frac1n}+\sqrt{2+\frac2n}+\cdots+\sqrt{2+\frac nn}\right)=\lim_{n\to\infty}\frac1n\sum_{k=1}^n\sqrt{2+\frac kn}$$
      source_flow: 채점 가이드 p.16
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $$=\int_0^1\sqrt{2+x}\,dx=\left[\frac23(2+x)^{\frac32}\right]_0^1=2\sqrt3-\frac43\sqrt2\quad\text{또는}$$
        $$=\int_2^3\sqrt x\,dx=\left[\frac23x^{\frac32}\right]_2^3=2\sqrt3-\frac43\sqrt2$$
      source_flow: 채점 가이드 p.16
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 주어진 급수를 $\displaystyle\lim_{n\to\infty}\frac1n\sum_{k=1}^n\sqrt{2+\frac kn}$ 꼴(구간 $[0,1]$ 또는 $[2,3]$의 구분구적)로 바꿨다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 정적분 $\displaystyle\int_0^1\sqrt{2+x}\,dx$ 또는 $\displaystyle\int_2^3\sqrt x\,dx$를 계산하여 $2\sqrt3-\frac43\sqrt2$를 구했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [2] 양의 실수 $t$에 대하여 함수 $L(t)$를 다음과 같이 정의하자.
    $$L(t)=\int_t^{t+1}\sqrt{1+\frac4{x^4}}\,dx$$
    이때 도함수 $L^{\prime}(t)$에 대한 다음 합을 구하시오. [9점]
    $$\sum_{k=1}^nL^{\prime}(k)$$
  points: 9
  depends_on: []
  answer:
    kind: expression
    value: sqrt(1+4/(n+1)**4)-sqrt(5)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $h(x)=\sqrt{1+\frac4{x^4}}$라 놓으면, $L^{\prime}(t)=\frac d{dt}\int_t^{t+1}h(x)\,dx=h(t+1)-h(t)$이다. 따라서,
        $$L^{\prime}(t)=\sqrt{1+\frac4{(t+1)^4}}-\sqrt{1+\frac4{t^4}}$$
        이고,
      source_flow: 채점 가이드 p.16
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $$\sum_{k=1}^nL^{\prime}(k)=(h(2)-h(1))+(h(3)-h(2))+\cdots+(h(n+1)-h(n))$$
        이다. 여기서 상쇄되는 항들을 제거하면 남는 항은 $h(n+1)-h(1)$이므로 정답은 $\sqrt{1+\frac4{(n+1)^4}}-\sqrt5$이다.
      source_flow: 채점 가이드 p.16
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $L^{\prime}(t)=h(t+1)-h(t)=\sqrt{1+\frac4{(t+1)^4}}-\sqrt{1+\frac4{t^4}}$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: 상쇄되는 항을 제거하여 $\displaystyle\sum_{k=1}^nL^{\prime}(k)=\sqrt{1+\frac4{(n+1)^4}}-\sqrt5$를 구했다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [3] 함수 $y=f(x)$가 닫힌 구간 $[t,t+h]$에서 연속이고, 열린 구간 $(t,t+h)$에서 미분가능하면
    $$\frac d{dt}\int_t^{t+h}f(x)\,dx=hf^{\prime}(c)$$
    인 $c$가 구간 $(t,t+h)$에 적어도 하나 존재함을 제시문 2, 3을 이용하여 증명하시오. (단, $h>0$) [11점]
  points: 11
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $F^{\prime}(x)=f(x)$라고 하자. 제시문 2에 의해 $\displaystyle\int_t^{t+h}f(x)\,dx=F(t+h)-F(t)$이다. 이 식의 양변을 $t$에 대해 미분하면
        $$\frac d{dt}\int_t^{t+h}f(x)\,dx=f(t+h)-f(t)$$
      source_flow: 채점 가이드 p.16
      criteria:
      - 3.R1
    - id: 3b-2
      content: |
        우변에 평균값의 정리를 적용하면 다음을 만족하는 $c\ (t<c<t+h)$가 적어도 하나 존재한다.
        $$f(t+h)-f(t)=hf^{\prime}(c)$$
      source_flow: 채점 가이드 p.16
      criteria:
      - 3.R2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.R1
      mark_type: R
      points: 5
      evidence: 제시문 2로 $\displaystyle\int_t^{t+h}f(x)\,dx=F(t+h)-F(t)$를 쓰고 양변을 $t$에 대해 미분하여 $f(t+h)-f(t)$를 얻었다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
    - id: 3.R2
      mark_type: R
      points: 6
      evidence: 우변 $f(t+h)-f(t)$에 평균값의 정리를 적용하여 $f(t+h)-f(t)=hf^{\prime}(c)$인 $c\ (t<c<t+h)$의 존재를 보였다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-2
