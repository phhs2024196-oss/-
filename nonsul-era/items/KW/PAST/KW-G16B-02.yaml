    - id: 5b-5
      content: |
        [별해1]
        $$\int\cos x\{f(x)+g(x)\}\,dx=\int\cos x\{f^{\prime}(x)+g^{\prime}(x)\}\,dx=\cos x\{f(x)+g(x)\}+\int\sin x\{f(x)+g(x)\}\,dx$$
        이 식에서
        $$\int\sin x\{f(x)+g(x)\}\,dx=\int\sin x\{f^{\prime}(x)+g^{\prime}(x)\}\,dx=\sin x\{f(x)+g(x)\}-\int\cos x\{f(x)+g(x)\}\,dx$$
        따라서
        $$2\int\cos x\{f(x)+g(x)\}\,dx=(\sin x+\cos x)\{f(x)+g(x)\}=\sqrt2\left\{\sin x\sin\frac\pi4+\cos x\cos\frac\pi4\right\}\{f(x)+g(x)\}=\sqrt2\cos\left(x-\frac\pi4\right)\{f(x)+g(x)\}$$
        따라서
        $$\int\cos x\{f(x)+g(x)\}\,dx=\frac{\sqrt2}2\cos\left(x-\frac\pi4\right)\{f(x)+g(x)\}+C$$
        이다. (여기서 $C$는 적분 상수.)
