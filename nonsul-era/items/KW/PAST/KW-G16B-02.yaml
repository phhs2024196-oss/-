- id: '5'
  stem: |
    [5] 두 함수 $f(x),g(x)$가 각각 미분가능하고 $f^{\prime}(x)=g(x)$이고 $g^{\prime}(x)=f(x)$라고 하자. 제시문 5의 부분적분법을 이용하여 다음 등식이 성립함을 증명하시오. [11점]
    $$\int\cos x\{f(x)+g(x)\}\,dx=\frac{\sqrt2}2\cos\left(x-\frac\pi4\right)\{f(x)+g(x)\}+C\quad(\text{단, }C\text{는 적분상수})$$
  points: 11
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        (※ 부분적분법을 활용하지 않고 단지 우변을 미분하여 등식을 증명한 경우 최대 3점 부여.)
        $$\int\cos x\{f(x)+g(x)\}\,dx=\int(\sin x)^{\prime}\{f(x)+g(x)\}\,dx=\sin x\{f(x)+g(x)\}-\int\sin x\{f^{\prime}(x)+g^{\prime}(x)\}\,dx$$
      source_flow: 채점 가이드 p.17
      criteria:
      - 5.R1
    - id: 5b-2
      content: |
        이 식에서
        $$-\int\sin x\{f^{\prime}(x)+g^{\prime}(x)\}\,dx=-\int\sin x\{f(x)+g(x)\}\,dx=\int(\cos x)^{\prime}\{f(x)+g(x)\}\,dx$$
        $$=\cos x\{f(x)+g(x)\}-\int\cos x\{f^{\prime}(x)+g^{\prime}(x)\}\,dx=\cos x\{f(x)+g(x)\}-\int\cos x\{f(x)+g(x)\}\,dx$$
        이다.
      source_flow: 채점 가이드 p.17
      criteria:
