- id: 4-2
  stem: |
    (2) 제시문 4와 [그림 1: 곡선 $y=\frac2x$의 그래프와 $x$축의 점 $t,\ t+1$. $x=t$와 $x=t+1$ 사이에서 곡선 위의 점 $x=t$를 지나는 높이의 직사각형(큰 것)과 점 $x=t+1$을 지나는 높이의 직사각형(작은 것)이 곡선을 위아래로 감싸도록 그려져 있다]을 이용하여 다음 부등식을 증명하시오. [7점]
    $$e^{\frac t{t+1}}<\left(1+\frac1t\right)^t<e\quad(t>0)$$
  points: 7
  depends_on:
  - 4-1
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        밑변의 길이가 $1$이고 높이가 $\frac2{t+1}$인 사각형의 넓이 $S_1$은 $\frac2{t+1}$이다.
        곡선 $y=\frac2x$와 $x$축 및 $x=t,\ x=t+1\ (t>0)$로 둘러싸인 도형의 넓이 $S$는
        $$S=\int_t^{t+1}\frac2x\,dx=\left[2\ln\frac x2\right]_t^{t+1}=2\ln\frac{t+1}t=2\ln\left(1+\frac1t\right)$$
        이다. 한편, 밑변의 길이가 $1$이고 높이가 $\frac2t$인 사각형의 넓이 $S_2$는 $\frac2t$이다.
      source_flow: 채점 가이드 p.16
      criteria:
      - 4-2.R1
    - id: 42b-2
      content: |
        [그림 1]에 의해 $S_1<S<S_2$이므로 다음이 성립한다.
        $$\frac2{t+1}<2\ln\left(1+\frac1t\right)<\frac2t\quad(t>0)$$
        이 식들에 $\frac t2$를 곱하면 이 값이 양수이므로
        $$\frac t{t+1}<\ln\left(1+\frac1t\right)^t<1\quad(t>0)$$
        이다.
      source_flow: 채점 가이드 p.16~17
      criteria:
      - 4-2.R1
      - 4-2.R2
    - id: 42b-3
      content: |
        $y=e^x$는 실수 전 구간에서 증가하므로 제시문 4에 의해 다음을 얻는다.
        $$e^{\frac t{t+1}}<\left(1+\frac1t\right)^t<e\quad(t>0)$$
      source_flow: 채점 가이드 p.17
      criteria:
      - 4-2.R2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4-2.R1
      mark_type: R
      points: 3
      evidence: '[그림 1]에서 $S_1<S<S_2$를 이용하여 $\frac2{t+1}<2\ln\left(1+\frac1t\right)<\frac2t$를 얻었다.'
      depends_on: []
      implied_ok: false
      steps:
