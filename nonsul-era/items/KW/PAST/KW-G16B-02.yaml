        $$\int\cos x\{f(x)+g(x)\}\,dx=\frac{\sqrt2}2\cos\left(x-\frac\pi4\right)\{f(x)+g(x)\}+C$$
        이다. (여기서 $C$는 적분 상수.)
      source_flow: 채점 가이드 p.17
