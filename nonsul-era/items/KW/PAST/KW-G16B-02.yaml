      - 42b-2
    - id: 4-2.R2
      mark_type: R
      points: 4
      evidence: $\frac t{t+1}<\ln\left(1+\frac1t\right)^t<1$에서 $y=e^x$가 증가함과 제시문 4를 이용하여 $e^{\frac t{t+1}}<\left(1+\frac1t\right)^t<e$를 보였다.
      depends_on:
