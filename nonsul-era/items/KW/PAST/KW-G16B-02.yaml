    - id: 5b-3
      content: |
        따라서
        $$2\int\cos x\{f(x)+g(x)\}\,dx=(\sin x+\cos x)\{f(x)+g(x)\}=\sqrt2\left\{\sin x\sin\frac\pi4+\cos x\cos\frac\pi4\right\}\{f(x)+g(x)\}$$
        $$=\sqrt2\cos\left(x-\frac\pi4\right)\{f(x)+g(x)\}$$
      source_flow: 채점 가이드 p.17
