  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: 도형은 네 점을 잇는 선분들에 의해 $y$축에 대하여 대칭인 4개의 영역 $a,b,c,d$로 분할된다(8개 영역). 순서에 관계없이 2개를 선택하는 경우의 수는 ${}_8\mathrm{C}_2=\dfrac{{}_8\mathrm{P}_2}{2!}=\dfrac{8\times7}{2\times1}=28$이다.
