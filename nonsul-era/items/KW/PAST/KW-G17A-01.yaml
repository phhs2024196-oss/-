  stem: '[3] 문제 [1], [2]에서 구한 네 점 $A,B,C,D$를 서로 이은 선분들로 도형 내부를 8개의 영역으로 분할하여 서로 다른 두 영역을 선택할 때, 선택된 두 영역이 $y$축에 대하여 대칭이 아닐 확률을 구하시오. (단, 각 영역을 선택할 확률은 동일하다.)[8점]'
  points: 8
