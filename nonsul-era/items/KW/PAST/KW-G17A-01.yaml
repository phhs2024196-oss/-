- id: '4'
  stem: '[4] 도형에 내접하는 직사각형의 넓이를 $S(t)$라 하자. 이때 $S(t)$를 구하고, $S(t)$의 최댓값을 구하시오.[12점]'
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: S=4*sqrt(2)*sin(t)*cos(t); max=2*sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: 내접 직사각형의 한 꼭짓점의 좌표를 $(\sqrt2\cos t,2+\sin t)$라고 하면 (단, $0<t<\pi/2$) 직사각형의 가로 길이는 $2\sqrt2\cos t$이고 세로 길이는 $2\sin t$가 된다. 따라서 넓이는 $S(t)=4\sqrt2\sin t\cos t$이다.
      source_flow: 해설 p.6
      criteria:
      - 4.M1
    - id: 4b-2
      content: '$S^{\prime}(t)=4\sqrt2(\cos^2t-\sin^2t)=4\sqrt2(\cos t+\sin t)(\cos t-\sin t)$이므로 $S^{\prime}(t)=0$을 만족하는 $t$ (단, $0<t<\pi/2$)는 $\dfrac{\pi}{4}$이고 증감은 $S^{\prime}(t)$가 $+$에서 $-$로 바뀌어 $t=\dfrac{\pi}{4}$에서 최대이다(증감표: $S^{\prime}(0)=4\sqrt2$, $S^{\prime}\left(\dfrac{\pi}{2}\right)=-4\sqrt2$, $S(0)=0$, $S\left(\dfrac{\pi}{2}\right)=0$).'
      source_flow: 해설 p.6
      criteria:
      - 4.M2
    - id: 4b-3
      content: $S\left(\dfrac{\pi}{4}\right)=4\sqrt2\sin\dfrac{\pi}{4}\cos\dfrac{\pi}{4}=2\sqrt2$이므로 넓이 $S(t)$의 최댓값은 $2\sqrt2$이다.
      source_flow: 해설 p.6
      criteria:
      - 4.A1
  rubric:
