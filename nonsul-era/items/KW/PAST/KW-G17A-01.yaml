stimuli:
- label: 가
  body: |-
    $x=f(t),\ y=g(t)$가 $t$에 대하여 미분가능하고 $f^{\prime}(t)\ne0$일 때,
    $$\dfrac{dy}{dx}=\dfrac{\dfrac{dy}{dt}}{\dfrac{dx}{dt}}=\dfrac{g^{\prime}(t)}{f^{\prime}(t)}$$
- label: 나
  body: |-
    사건 $A$에 대한 여사건 $A^{c}$의 확률은
    $$\mathrm{P}(A^{c})=1-\mathrm{P}(A)$$
- label: 다
  body: |-
    평면 $\beta$ 위의 도형 $F$의 평면 $\alpha$ 위로의 정사영을 $F^{\prime}$이라 하고, $F,F^{\prime}$의 넓이를 각각 $S,S^{\prime}$이라고 할 때, 두 평면 $\alpha,\beta$가 이루는 각의 크기가 $\theta\left(0\le\theta\le\dfrac{\pi}{2}\right)$이면
    $$S^{\prime}=S\cos\theta$$
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: '1'
  stem: |-
    ※ [1~4] 좌표평면 위를 움직이는 점 $P(x,y)$의 좌표가 매개변수 $t$의 함수

    $x=\sqrt2\cos t$, $y=2+\sin t$ (단, $0\le t<2\pi$)

    로 나타내어진다고 할 때, 점 $P$가 만드는 도형에 대하여 다음 물음에 답하시오.

    [1] 도형을 방정식 $f(x,y)=0$으로 나타내고, $y$축과 만나는 두 점 $A$와 $B$의 좌표를 구하시오.[8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: ellipse=x**2/2+(y-2)**2-1; A=(0,3); B=(0,1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $\cos t=\dfrac{x}{\sqrt2}$, $\sin t=y-2$이므로 $\cos^2t+\sin^2t=1$에서 $\dfrac{x^2}{2}+(y-2)^2=1$이다.
      source_flow: 해설 p.5
      criteria:
      - 1.M1
    - id: 1b-2
      content: $y$축과 만나는 점은 $x=0$에서 $A(0,3)$, $B(0,1)$이다.
      source_flow: 해설 p.5
      criteria:
      - 1.A1
