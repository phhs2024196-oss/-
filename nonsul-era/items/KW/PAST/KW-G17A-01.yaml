intent: '[1] 매개변수로 나타난 이차도형의 관계식을 구하고 특정한 위치관계의 점의 좌표를 계산한다. [2] 이차곡선의 접선의 방정식을 구하고 두 직선이 이루는 각의 크기를 계산한다. [3] 같은 것이 포함된 경우의 수를 구하고 이를 통한 여사건의 확률을 계산한다. [4] 이차도형에 내접하는 도형의 넓이를 함수로 표시하고 이차함수의 최댓값을 구한다. [5] 좌표공간의 평면의 방정식을 구하고 두 평면이 이루는 각을 이해한다. (공식 해설 ''출제의도'' 원문)'
key_idea: $x=\sqrt2\cos t$, $y=2+\sin t$에서 $t$를 소거해 타원 $\dfrac{x^2}{2}+(y-2)^2=1$을 얻고, 원점을 지나는 접선은 접점 조건 $2+\sin t=\dfrac{dy}{dx}\cdot\sqrt2\cos t$에서 $\sin t=-\dfrac12$로 구한다. 8개 영역의 선택은 여사건으로, 내접 직사각형은 $S(t)=4\sqrt2\sin t\cos t$의 최대로, 평면각은 정사영 넓이비 $\cos\theta=\dfrac{S^{\prime}}{S}$로 처리한다.
stuck: '[2]에서 접선의 방정식을 세우지 않고 $\dfrac{dy}{dx}$에 $y=ax$ 조건($y_0=\dfrac{dy}{dx}x_0$)을 대입하는 단계, [5]에서 $\overrightarrow{OR}$가 두 벡터와 모두 수직이어서 $l=m=0$이 되는 단계'
