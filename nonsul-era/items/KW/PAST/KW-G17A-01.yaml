- id: '2'
  stem: '[2] 도형의 접선 중 원점을 지나는 접선은 두 개이다. 이때 두 접점 $C$와 $D$의 좌표를 구하고, 두 접선이 이루는 예각을 $\theta$라고 할 때 $\cos\theta$의 값을 구하시오.[10점]'
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: C=(-sqrt(6)/2,3/2); D=(sqrt(6)/2,3/2); costheta=1/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $\dfrac{dx}{dt}=-\sqrt2\sin t$, $\dfrac{dy}{dt}=\cos t$이므로 매개변수 함수의 미분공식(제시문 (가))에 의하여 $\dfrac{dy}{dx}=\dfrac{\frac{dy}{dt}}{\frac{dx}{dt}}=\dfrac{\cos t}{-\sqrt2\sin t}=-\dfrac{\sqrt2}{2}\dfrac{\cos t}{\sin t}$ (단, $t\ne0$, $t\ne\pi$)이다.
      source_flow: 해설 p.5
      criteria:
      - 2.M1
    - id: 2b-2
      content: 원점 $O(0,0)$을 지나는 접선은 $y=ax$ 꼴이므로 접점에서의 $t$값은 $2+\sin t=-\dfrac{\sqrt2}{2}\dfrac{\cos t}{\sin t}\cdot\sqrt2\cos t$에서 $t=\dfrac{7\pi}{6}$ 또는 $\dfrac{11\pi}{6}$이다. 따라서 두 접점의 좌표는 $C\left(-\dfrac{\sqrt6}{2},\dfrac32\right)$과 $D\left(\dfrac{\sqrt6}{2},\dfrac32\right)$이다.
      source_flow: 해설 p.5
      criteria:
      - 2.A1
    - id: 2b-3
      content: 두 접선이 이루는 각의 코사인값은 위치벡터 내적의 정의에 의하여 $\cos\theta=\dfrac{\overrightarrow{OC}\cdot\overrightarrow{OD}}{|\overrightarrow{OC}||\overrightarrow{OD}|}=\dfrac{\left(-\frac{\sqrt6}{2}\right)\left(\frac{\sqrt6}{2}\right)+\left(\frac32\right)\left(\frac32\right)}{\sqrt{\left(-\frac{\sqrt6}{2}\right)^2+\left(\frac32\right)^2}\sqrt{\left(\frac{\sqrt6}{2}\right)^2+\left(\frac32\right)^2}}=\dfrac15$이다.
      source_flow: 해설 p.5
      criteria:
      - 2.M2
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 매개변수 미분공식으로 $\dfrac{dy}{dx}=-\dfrac{\sqrt2}{2}\dfrac{\cos t}{\sin t}$를 구하고 원점을 지나는 접선 조건($y=ax$)을 세웠다.
      depends_on: []
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 접점의 $t$값을 구해 $C$, $D$의 좌표를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: 위치벡터 $\overrightarrow{OC}$, $\overrightarrow{OD}$의 내적으로 $\cos\theta$를 계산하는 식을 세웠다.
      depends_on:
      - 2.A1
      steps:
      - 2b-3
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: $\cos\theta=\dfrac15$을 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
