- id: '5'
  stem: '[5] 좌표공간의 위치벡터 $\overrightarrow{OR}$은 두 점 $P\left(-\dfrac{\sqrt3}{2},1,0\right),Q\left(\dfrac{\sqrt3}{2},1,0\right)$에 대한 위치벡터 $\overrightarrow{OP},\overrightarrow{OQ}$와 모두 수직이고 크기가 $|\overrightarrow{PQ}|$이다. 이때 세 점 $P,Q,R$을 지나는 평면의 방정식을 구하고, 이 평면이 $xy$평면과 이루는 예각의 크기를 구하시오. (단, $O$는 원점이고 점 $R$의 $z$좌표는 양수이다.)[12점]'
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: plane=3*y+sqrt(3)*z-3; theta=pi/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: $\overrightarrow{PQ}=(\sqrt3,0,0)$이고 $|\overrightarrow{PQ}|=\sqrt3$이다. $\overrightarrow{OR}=(l,m,n)$이라 하면 $\overrightarrow{OP}\cdot\overrightarrow{OR}=-\dfrac{\sqrt3}{2}l+m=0$, $\overrightarrow{OQ}\cdot\overrightarrow{OR}=\dfrac{\sqrt3}{2}l+m=0$이다. 연립하면 $l=m=0$이므로 구하는 위치벡터는 $\overrightarrow{OR}=(0,0,\sqrt3)$이다.
      source_flow: 해설 p.6
      criteria:
      - 5.M1
    - id: 5b-2
      content: '평면의 방정식을 $ax+by+cz+d=0$이라 하면 점 $P$를 지나므로 $-\dfrac{\sqrt3}{2}a+b+d=0$, 점 $Q$를 지나므로 $\dfrac{\sqrt3}{2}a+b+d=0$이다. 점 $R(0,0,\sqrt3)$을 지나므로 $\sqrt3c+d=0$이다. 이들 식을 연립하여 $a,b,c$를 $d$로 나타내면 $a=0$, $b=-d$, $c=-\dfrac{\sqrt3}{3}d$이므로 $-dy-\dfrac{\sqrt3}{3}dz+d=0$이다. [판독확인: 원문 표기 ''직선의 방정식은''(평면의 방정식의 오기로 보임)] $d=0$이면 $a=b=c=0$이므로 평면이 존재하지 않는다. $d\ne0$일 때, 세 점 $P,Q,R$을 지나는 평면의 방정식은 $3y+\sqrt3z-3=0$이 된다.'
      source_flow: 해설 p.6
      criteria:
      - 5.A1
    - id: 5b-3
      content: 세 점을 지나는 평면 위의 $\triangle PQR$의 $xy$평면 위로의 정사영이 $\triangle PQO$이므로 $\triangle PQR$의 넓이를 $S$, $\triangle PQO$의 넓이를 $S^{\prime}$, 두 평면이 이루는 각을 $\theta$라 하면(제시문 (다)) 선분 $PQ$의 중점을 $M$이라 할 때 $\cos\theta=\dfrac{S^{\prime}}{S}=\dfrac{\frac12|\overrightarrow{PQ}||\overrightarrow{MO}|}{\frac12|\overrightarrow{PQ}||\overrightarrow{MR}|}=\dfrac12$이므로 두 평면이 이루는 각 $\theta=\dfrac{\pi}{3}$이다.
      source_flow: 해설 p.6
