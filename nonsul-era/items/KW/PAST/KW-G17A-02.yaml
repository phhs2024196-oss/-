intent: 학생들이 교육과정에서 배워 잘 알고 있는 부정적분과 도함수와의 관계, 도함수의 부호와 함수의 증가 등에 관한 제시문과 함께 주어진 몇 가지 문제를 해결하는 과정에서 수학적인 분석력과 논리력, 계산력, 그리고 교육과정에서 배운 여러 가지 개념과 수학적 원리에 대한 이해와 지식의 활용과 응용하여 제시된 문제를 해결할 수 있는지를 평가하고자 한다. [1] 함수의 로그 함수로 주어지는 합성함수의 도함수와 그의 부정적분과의 관계를 알고, 도함수가 0인 함수가 상수함수임을 활용하여 주어진 문제를 해결할 수 있는지를 평가하는 문제이다. [2] (1) 도함수의 부호를 이용하여 함수의 증가와 감소를 알고, 부등식에 활용할 수 있는지를 평가하는 문제이다. (2) 부등식과 극한의 관계를 이용하여 함수의 극한을 구할 수 있는지를 평가하는 문제이다. [3] (1) 몫의 미분법을 바르게 사용하고 주어진 조건을 이용하여 도함수가 제시된 형태임을 보일 수 있는지 평가하는 문제이다. (2) 주어진 조건을 만족시킬 때, 제시된 등식을 유도할 수 있는지 평가하는 문제이다. [4] 앞에서 해결한 내용을 활용하여 제시된 두 명제가 동치임을 증명할 수 있는지를 평가하는 문제이다. (공식 해설 '출제의도' 원문)
key_idea: $\dfrac{f^{\prime}}{f}=\dfrac{g^{\prime}}{g}$이면 $\ln f-\ln g$가 상수이므로 $f=kg$이다. $P(x)=\dfrac{\int_0^xtf}{\int_0^xf}$는 $0<tf(t)<xf(t)$로 $0<P<x$를 얻고 몫의 미분법으로 $P^{\prime}=\dfrac{f}{\int_0^xf}(x-P)$가 되어, $P=Q$이면 두 식을 비교해 $\dfrac{f}{\int f}=\dfrac{g}{\int g}$, 이를 미분하면 $\dfrac{f^{\prime}}{f}=\dfrac{g^{\prime}}{g}$로 [1]에 연결된다.
stuck: '[4]에서 $f\int_0^xg=g\int_0^xf$의 양변을 미분한 식 $f^{\prime}\int_0^xg=g^{\prime}\int_0^xf$와 원래 식을 변변 나누어 $\dfrac{f^{\prime}}{f}=\dfrac{g^{\prime}}{g}$로 만드는 단계'
