stimuli:
- label: 가
  body: 함수 $f(x)$가 구간 $[a,b]$에서 연속이고 구간 $(a,b)$에서 미분가능할 때, 구간 $(a,b)$에서 $f^{\prime}(x)>0$이면 함수 $f(x)$는 구간 $[a,b]$에서 증가한다.
- label: 나
  body: |-
    함수 $f(t)$가 구간 $[a,b]$에서 연속일 때,
    $$\dfrac{d}{dx}\int_a^xf(t)dt=f(x)\quad(단,\ a<x<b)$$
- label: 다
  body: 함수 $p(t)$가 구간 $[a,b]$에서 연속이고 구간 $(a,b)$에서 $p(t)>0$이면, (나)에 의해 구간 $(a,b)$에서 함수 $F(x)=\displaystyle\int_a^xp(t)dt$의 도함수는 $\dfrac{d}{dx}F(x)=p(x)>0$이다. 따라서 (가)에 의하여 함수 $F(x)$는 구간 $[a,b]$에서 증가한다. 이때 $F(a)=0$이므로 $a<x\le b$이면 $F(x)>0$이다.
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: '1'
  stem: |-
    [1] 함수 $f(x)$, $g(x)$는 구간 $[a,b]$에서 $f(x)>0$, $g(x)>0$이고 연속이며, 구간 $(a,b)$에서 미분가능하고 등식 $\dfrac{f^{\prime}(x)}{f(x)}=\dfrac{g^{\prime}(x)}{g(x)}$를 만족시킨다. 이때 다음 등식이 성립함을 보이시오.[10점]

    $f(x)=kg(x)$ (단, $a\le x\le b$이고 $k$는 양수)
  points: 10
  depends_on: []
  answer:
    kind: proof
    value: proof
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 주어진 조건에 의하면 함수 $\ln f(x)-\ln g(x)$는 구간 $[a,b]$에서 연속이고 구간 $(a,b)$에서 미분가능하며 $\dfrac{f^{\prime}(x)}{f(x)}-\dfrac{g^{\prime}(x)}{g(x)}=0$이므로 $\ln f(x)-\ln g(x)=C$ (단, $a\le x\le b$이고 $C$는 적분상수)가 성립한다.
      source_flow: 모범답안 p.10
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b-2
      content: 한편, $\ln f(x)-\ln g(x)=\ln\dfrac{f(x)}{g(x)}=C$이므로 $\dfrac{f(x)}{g(x)}=e^C=k>0$이다. 따라서 $f(x)=kg(x)$ (단, $a\le x\le b$이고 $k$는 양수)가 성립한다.
      source_flow: 모범답안 p.10
      criteria:
      - 1.M3
      - 1.A1
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $\displaystyle\int\dfrac{f^{\prime}(x)}{f(x)}dx=\ln|f(x)|+C$임을 알았다.
      depends_on: []
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $\dfrac{f^{\prime}(x)}{f(x)}-\dfrac{g^{\prime}(x)}{g(x)}=0$이면 $\ln|f(x)|-\ln|g(x)|=C$임을 밝혔다.
      depends_on:
      - 1.M1
      steps:
      - 1b-1
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: $f(x)>0$, $g(x)>0$ 조건에서 $\ln\dfrac{f(x)}{g(x)}=C$를 얻었다.
      depends_on:
      - 1.M2
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $\dfrac{f(x)}{g(x)}=e^C=k$이고 $k$가 양수임을 보였다.
      depends_on:
      - 1.M3
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: $f(x)=kg(x)$ (단, $a\le x\le b$이고 $k$는 양수)의 표현을 보였다.
      depends_on:
      - 1.M3
      - 1.A1
      steps:
      - 1b-2
