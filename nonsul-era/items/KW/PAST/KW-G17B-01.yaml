stimuli:
- label: 가
  body: |-
    함수 $y=f(x)$의 그래프의 개형은 다음과 같은 사항을 조사하여 그릴 수 있다.

    (1) 함수의 정의역과 치역
    (2) 좌표축과의 교점
    (3) 곡선의 대칭성과 주기
    (4) 함수의 증가와 감소, 극대와 극소
    (5) 곡선의 오목과 볼록, 변곡점
    (6) $\displaystyle\lim_{x\to\infty}f(x)$, $\displaystyle\lim_{x\to-\infty}f(x)$, 점근선
- label: 나
  body: |-
    두 함수 $y=f(x)$와 $y=g(x)$가 구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$와 $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b|f(x)-g(x)|dx$$
- label: 다
  body: 좌표공간에서 점 $A(x_1,y_1,z_1)$을 지나고 벡터 $\overrightarrow{u}=(a,b,c)$에 평행인 직선 $l$ 위의 점 $P(x,y,z)$의 좌표는 $(x_1+at,y_1+bt,z_1+ct)$이다. (단, $t$는 실수)
- label: 라
  body: |-
    함수 $f(x)$가 닫힌 구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면, $f(a)$와 $f(b)$ 사이의 임의의 값 $k$에 대하여
    $$f(c)=k\quad(a<c<b)$$
    인 $c$가 적어도 하나 존재한다.
- label: 마
  body: |-
    미분가능한 두 함수 $f(x),g(x)$에 대하여 $f^{\prime}(x),g^{\prime}(x)$가 구간 $[a,b]$에서 연속이면
    $$\int_a^bf(x)g^{\prime}(x)\,dx=\left[f(x)g(x)\right]_a^b-\int_a^bf^{\prime}(x)g(x)\,dx$$
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: '1'
  stem: '[1] <제시문 (가)>를 이용하여 실수 $x$에 대한 부등식 $\left|\dfrac{x}{1+x^2}\right|\le p$를 만족하는 $p$의 최솟값을 구하시오.[10점]'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)=\left|\dfrac{x}{1+x^2}\right|$라고 하면 이 함수는 $y$축 대칭이다. 따라서 $x>0$에서 함수의 증감표를 그려보자. $x>0$이면 $f(x)=\dfrac{x}{1+x^2}$이고 $f^{\prime}(x)=\dfrac{1-x^2}{(1+x^2)^2}$이므로 $f^{\prime}(1)=0$이다.
      source_flow: 모범답안 p.6
      criteria:
      - 1.M1
    - id: 1b-2
      content: 또 $\displaystyle\lim_{x\to\infty}\dfrac{x}{1+x^2}=0$이고 $f(0)=0$이므로 증감표는 $x>0$에서 $f^{\prime}(x)$가 $x=1$ 앞에서 $+$, 뒤에서 $-$이며 $f(x)$는 증가, $x=1$에서 극대 $\dfrac12$, 감소이다.
      source_flow: 모범답안 p.6
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\left|\dfrac{x}{1+x^2}\right|\le\dfrac12$이므로 $p$의 최솟값은 $\dfrac12$이다.
      source_flow: 모범답안 p.6
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $f^{\prime}(x)$와 $f^{\prime}(1)=0$을 구했다.
      depends_on: []
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $\displaystyle\lim_{x\to\infty}\dfrac{x}{1+x^2}=0$, $f(0)=0$으로 증감표를 완성했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $\left|\dfrac{x}{1+x^2}\right|\le\dfrac12$을 구하고 $p$의 최솟값 $\dfrac12$을 얻었다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |-
    [2] 두 초점 $F(\sqrt3,0),F^{\prime}(-\sqrt3,0)$으로부터의 거리의 합이 $4$인 타원과 두 직선 $x=\sqrt3,x=-\sqrt3$으로 둘러싸여 있는 색칠한 부분의 넓이를 <제시문 (나)>를 이용하여 구하시오.[10점]

    [그림: 가로로 긴 타원. 중심 $O$, $x$축 위에 $F^{\prime}(-\sqrt3,0)$, $F(\sqrt3,0)$이 표시되어 있고 $F^{\prime}$, $F$를 각각 지나는 두 수직선($x=-\sqrt3$, $x=\sqrt3$) 사이의 타원 내부가 색칠되어 있다.]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: S=sqrt(3)+4*pi/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 타원의 방정식은 $\dfrac{x^2}{4}+y^2=1$이다. 따라서 곡선의 식은 $y=\pm\sqrt{1-\dfrac{x^2}{4}}$ $(-2\le x\le2)$이므로 색칠한 부분의 넓이 $S=2\displaystyle\int_{-\sqrt3}^{\sqrt3}\sqrt{1-\dfrac{x^2}{4}}\,dx=4\displaystyle\int_0^{\sqrt3}\sqrt{1-\dfrac{x^2}{4}}\,dx$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 2.M1
    - id: 2b-2
      content: $x=2\cos\theta$ $\left(0\le\theta\le\dfrac{\pi}{2}\right)$로 치환하면 $dx=-2\sin\theta\,d\theta$이다. 또한 적분구간은 $2\cos\theta=0$, $2\cos\theta=\sqrt3$으로부터 $\theta=\dfrac{\pi}{2}$, $\theta=\dfrac{\pi}{6}$이다. 따라서 $S=4\displaystyle\int_{\frac{\pi}{2}}^{\frac{\pi}{6}}(-2\sin^2\theta)\,d\theta=-4\displaystyle\int_{\frac{\pi}{2}}^{\frac{\pi}{6}}(1-\cos2\theta)\,d\theta=\sqrt3+\dfrac43\pi$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 타원의 방정식 $\dfrac{x^2}{4}+y^2=1$과 넓이 $S$의 적분식을 세웠다.
      depends_on: []
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: 치환적분으로 적분값 $\sqrt3+\dfrac43\pi$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: '[3] 좌표공간의 세 점 $O(0,0,0),A(2,3,0),B(-1,2,1)$에 대하여 점 $A$에서 직선 $OB$에 내린 수선의 발을 $H$라고 할 때, $\overline{OH}$의 길이를 <제시문 (다)>를 이용하여 구하시오.[10점]'
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: H=(-2/3,4/3,2/3); OH=2*sqrt(6)/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: 직선 $OB$의 방향 벡터 $\overrightarrow{OB}$는 $(-1,2,1)$이므로 직선 $OB$ 위의 점 $H$의 좌표를 $(-t,2t,t)$라 하자. 직선 $AH$의 방향 벡터 $\overrightarrow{AH}=(-t-2,2t-3,t)$와 $\overrightarrow{OB}$는 수직이어야 하므로 $\overrightarrow{AH}\cdot\overrightarrow{OB}=6t-4=0$이다. 따라서 $t=\dfrac23$이고 점 $H$의 좌표는 $\left(-\dfrac23,\dfrac43,\dfrac23\right)$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 3.M1
    - id: 3b-2
      content: 따라서 선분 $\overline{OH}$의 길이는 $\dfrac{2\sqrt6}{3}$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 3.A1
  rubric:
