intent: '[1] 도함수를 활용해 함수의 최댓값과 최솟값을 구하고 부등식에 활용할 수 있는지 평가한다. [2] 타원의 방정식을 구하고 곡선으로 둘러싸인 도형의 넓이를 정적분을 활용해 구할 수 있는지 평가한다. [3] 좌표공간에서 벡터를 이용하여 직선의 방정식을 구하고 조건을 만족하는 직선 위의 점을 구할 수 있는지 평가한다. [4] 사이값 정리를 활용하여 주어진 구간에서 방정식이 근을 가짐을 보일 수 있는지 평가한다. [5] 부분 적분법을 활용해 정적분 계산을 할 수 있는지 평가한다. (공식 해설 ''출제의도'' 원문)'
key_idea: $\left|\dfrac{x}{1+x^2}\right|$는 $y$축 대칭이므로 $x>0$에서 증감표로 최댓값 $\dfrac12$을 구한다. 타원 넓이는 $2\int\sqrt{1-\frac{x^2}{4}}dx$를 $x=2\cos\theta$로 치환하고, 수선의 발은 $H=(-t,2t,t)$와 $\overrightarrow{AH}\cdot\overrightarrow{OB}=0$으로, 방정식의 근은 보조함수 $g$와 사이값 정리로, $I_n$은 부분적분 두 번의 점화식 $I_n+n(n-1)I_{n-2}=n\left(\dfrac{\pi}{2}\right)^{n-1}$로 처리한다.
stuck: '[5]에서 부분적분을 두 번 적용해 $I_n$과 $I_{n-2}$를 잇는 점화식을 얻고 $n=100$을 대입하는 단계, [4]에서 보조함수 $g(x)=f(x)-x-\cos\left(\dfrac{\pi}{2}x\right)$를 세우는 단계'
