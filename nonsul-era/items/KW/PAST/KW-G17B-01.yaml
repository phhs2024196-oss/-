- id: '5'
  stem: |-
    [5] $I_n$이 다음과 같이 정의되어 있다. <제시문 (마)>를 이용하여 $I_{100}+9900I_{98}$의 값을 구하시오.[10점]

    $$I_n=\int_0^{\frac{\pi}{2}}x^n\sin x\,dx\quad(n\ge0)$$
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 100*(pi/2)**99
    equivalents: []
    tolerance: null
  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: $I_n$에 부분 적분법을 적용하면 $I_n=\displaystyle\int_0^{\frac{\pi}{2}}x^n(-\cos x)^{\prime}dx=-\displaystyle\int_0^{\frac{\pi}{2}}nx^{n-1}(-\cos x)dx-\left[x^n\cos x\right]_0^{\frac{\pi}{2}}=n\displaystyle\int_0^{\frac{\pi}{2}}x^{n-1}\cos x\,dx$이다. (단, $n\ge1$).
      source_flow: 모범답안 p.7
      criteria:
      - 5.M1
    - id: 5b-2
      content: 위 식에 부분 적분법을 적용하면 $I_n=n\displaystyle\int_0^{\frac{\pi}{2}}x^{n-1}(\sin x)^{\prime}dx=-n(n-1)\displaystyle\int_0^{\frac{\pi}{2}}x^{n-2}\sin x\,dx+\left[nx^{n-1}\sin x\right]_0^{\frac{\pi}{2}}$이다. (단, $n\ge2$).
      source_flow: 모범답안 p.7
      criteria:
      - 5.M2
    - id: 5b-3
