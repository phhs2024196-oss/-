- id: '4'
  stem: '[4] 닫힌 구간 $[-1,1]$에서 정의된 연속함수 $f(x)$가 $f(-1)>0$이고 $f(1)<0$이다. <제시문 (라)>를 이용하여 $f(c)=c+\cos\left(\dfrac{\pi}{2}c\right)$가 되는 $c$ (단, $-1<c<1$)가 적어도 하나 존재함을 보이시오.[10점]'
  points: 10
  depends_on: []
  answer:
    kind: proof
    value: proof
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: $g(x)=f(x)-x-\cos\left(\dfrac{\pi}{2}x\right)$로 정의하자.
      source_flow: 모범답안 p.7
      criteria:
      - 4.M1
    - id: 4b-2
      content: $g(-1)=f(-1)+1>0$이고 $g(1)=f(1)-1<0$이므로 사이값 정리에 의해 $g(c)=f(c)-c-\cos\left(\dfrac{\pi}{2}c\right)=0$을 만족하는 $c$가 $(-1,1)$ 사이에 적어도 하나 존재한다. 따라서 $f(c)=c+\cos\left(\dfrac{\pi}{2}c\right)$인 $c$가 $(-1,1)$ 사이에 적어도 하나 존재한다.
      source_flow: 모범답안 p.7
      criteria:
