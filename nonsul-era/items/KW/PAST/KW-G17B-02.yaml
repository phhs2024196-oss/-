      content: (ⅰ) $n=1$일 때 $f(1)=-3$이고 $g(1)=2$이므로 $f(1)<g(1)$이 성립한다.
      source_flow: 모범답안 p.10
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: (ⅱ) $n=k$일 때 $f(n)<g(n)$가 성립한다고 가정하자. 즉 $k^2-k-3<2^k$이라 가정하자. 그런데 $f(k+1)=(k+1)^2-(k+1)-3=(k^2-k-3)+2k$이고 $g(k+1)=2^{k+1}=2^k+2^k$이므로 가정에서 주어진 조건 $2k\le2^k$을 이용하면 $f(k+1)<g(k+1)$이다. 따라서 $n=k+1$일 때에도 명제 $f(n)<g(n)$가 성립하므로 모든 자연수 $n$에 대하여 주어진 명제가 증명된다.
      source_flow: 모범답안 p.10
      criteria:
      - 4-2.M2
      - 4-2.A1
  rubric:
    rules:
