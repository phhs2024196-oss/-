      content: $A=BQ_1+R_1=BQ_2+R_2$이므로 $B(Q_1-Q_2)=R_2-R_1$이다.
      source_flow: 모범답안 p.9
      criteria:
      - 3.M1
    - id: 3b-2
      content: $Q_1\ne Q_2$라고 가정하자. $R_1$과 $R_2$의 차수는 $B$의 차수보다 낮으므로 $R_2-R_1$의 차수는 $B$의 차수보다 낮다. 그런데 $B(Q_1-Q_2)$의 차수는 $B$의 차수보다 낮지 않으므로 $B(Q_1-Q_2)$의 차수와 $R_2-R_1$의 차수는 같지 않다. 이는 모순이므로 $Q_1=Q_2$이다.
