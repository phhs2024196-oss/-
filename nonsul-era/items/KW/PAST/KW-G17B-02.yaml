stimuli:
- label: 가
  body: 두 집합 $X,Y$에 대하여 $X$에는 속하지만 $Y$에는 속하지 않는 모든 원소로 이루어진 집합을 $X$에 대한 $Y$의 차집합이라 하고, $X-Y$로 나타낸다.
- label: 나
  body: 집합 $T$는 $T=\{f(x)\mid f(x)=a_0+a_1x+a_2x^2+a_3x^3,\ a_0,a_1,a_2,a_3$는 정수$\}$이다.
- label: 다
  body: 다항식 $A$를 다항식 $B$ $(B\ne0)$로 나누었을 때의 몫을 $Q$, 나머지를 $R$이라고 하면 $A=BQ+R$이다. 이때 $R$의 차수는 $B$의 차수보다 낮다.
- label: 라
  body: 지수함수 $y=a^x$ $(a>0,\ a\ne1)$의 도함수는 $y^{\prime}=a^x\ln a$이다.
- label: 마
  body: |-
    (수학적 귀납법) 자연수 $n$에 대한 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 증명하려면, 다음 두 가지를 보이면 된다.

    (1) $n=1$일 때 명제 $p(n)$이 성립한다.
    (2) $n=k$일 때 명제 $p(n)$이 성립한다고 가정하면 $n=k+1$일 때에도 명제 $p(n)$이 성립한다.
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: '1'
  stem: '[1] 집합 $S=\{f(x)\in T\mid f(x)=f(x+p),\ p$는 $0$이 아닌 정수$\}$에 대하여 차집합 $T-S$를 구하시오.[10점]'
  points: 10
  depends_on: []
  answer:
    kind: set
    value: T-S={a0+a1*x+a2*x**2+a3*x**3 in T | a1,a2,a3 not all 0}
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |-
        $f(x)=a_0+a_1x+a_2x^2+a_3x^3\in S$라면 $0$이 아닌 정수 $p$가 존재하여 $f(x)=f(x+p)$이다. 따라서 $a_0+a_1x+a_2x^2+a_3x^3=a_0+a_1(x+p)+a_2(x+p)^2+a_3(x+p)^3$이다. 각항의 계수를 비교하면 다음과 같은 식을 얻는다.

        $a_0+a_1p+a_2p^2+a_3p^3=a_0$, $a_1+2a_2p+3a_3p^2=a_1$, $a_2+3a_3p=a_2$

        그런데 $p\ne0$이므로 $a_1=a_2=a_3=0$이다. 즉, $f(x)=a_0$이므로 $S$는 정수 전체의 집합이다.
      source_flow: 모범답안 p.9
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 $T-S=\{a_0+a_1x+a_2x^2+a_3x^3\in T\mid a_1,a_2,a_3$는 동시에 영은 아니다$\}$이다.
      source_flow: 모범답안 p.9
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 집합 $S$(정수 전체의 집합, 즉 상수함수)를 구했다.
      depends_on: []
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 차집합 $T-S$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: '[2] 다항식 $f(x^2)$을 $x$로 나누었을 때의 몫은 $f(x-2)$이고 나머지는 $12$일 때, 다항식 $f(x)$를 구하시오.[12점]'
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: f=6*x+12
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 가정에 의하여 $f(x^2)=xf(x-2)+12$이다.
      source_flow: 모범답안 p.9
      criteria:
      - 2.M1
    - id: 2b-2
      content: 다항식 $f(x)$의 차수를 $m$이라 가정하면 $f(x^2)$의 차수는 $2m$이고 $xf(x-2)$의 차수는 $m+1$이다. 따라서 $2m=m+1$이고 $m=1$이므로 $f(x)$의 차수는 $1$이다. $f(x)=ax+b$라고 놓으면 $f(x^2)=ax^2+b$이고 $xf(x-2)+12=x\{a(x-2)+b\}+12=ax^2+(-2a+b)x+12$이다.
      source_flow: 모범답안 p.9
      criteria:
      - 2.M2
    - id: 2b-3
      content: 그러므로 $ax^2+b=ax^2+(-2a+b)x+12$이고 $(2a-b)x+b-12=0$이다. 따라서 $2a-b=0$, $b-12=0$이고 $a=6$, $b=12$이다. 즉, $f(x)=6x+12$이다.
      source_flow: 모범답안 p.9
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
