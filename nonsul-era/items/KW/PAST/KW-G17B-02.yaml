intent: '[1] 다항식의 항등식에 대한 이해력을 평가하고 두 집합의 차집합을 구체적으로 구할 수 있는지를 평가한다. [2] 나머지 정리를 이해하고 구체적인 함수에 대해 나머지 정리를 적용할 수 있는지를 평가한다. [3] 다항식에 대한 나머지 정리에서 몫과 나머지가 유일하게 존재하는 것을 증명할 수 있는지를 평가한다. [4] (1) 지수함수의 미분법을 이용하여 지수함수가 다항함수가 아님을 증명할 수 있는지를 평가한다. (2) 수학적 귀납법을 이해함으로써 두 함수의 대소 관계를 수학적 귀납법을 이용하여 증명할 수 있는지를 평가한다. (공식 해설 ''출제의도'' 원문)'
key_idea: $f(x)=f(x+p)$의 계수 비교로 $S$는 상수함수 전체임을 얻어 $T-S$를 구한다. $f(x^2)=xf(x-2)+12$는 차수 비교로 $f$가 일차식임을 얻고, 나눗셈의 유일성은 $B(Q_1-Q_2)=R_2-R_1$의 차수 모순으로 증명한다. $2^x\in T$이면 미분하여 $x=0$에서 $a_1=\ln2$가 정수가 되어 모순이고, $f(n)<g(n)$은 $f(k+1)=f(k)+2k$, $g(k+1)=2^k+2^k$와 $2k\le2^k$로 귀납한다.
stuck: '[3]에서 $B(Q_1-Q_2)$의 차수는 $B$의 차수 이상이고 $R_2-R_1$의 차수는 $B$의 차수 미만이라는 차수 비교로 모순을 만드는 단계, [4](2)에서 귀납 가정과 $2k\le2^k$를 함께 쓰는 단계'
