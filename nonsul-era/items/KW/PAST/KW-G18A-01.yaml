      content: 원점 $\mathrm{O}$와 직선 $l$까지의 거리는 $\overline{\mathrm{OP}}$의 최솟값이므로 $t=\dfrac23$일 때 $\dfrac{\sqrt{21}}{3}$이다.
      source_flow: 해설 p.8
      criteria:
      - 1-1.A1
