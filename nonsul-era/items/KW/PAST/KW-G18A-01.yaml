intent: |
  [1] 좌표공간에서 점, 직선, 평면의 위치관계를 이해하고, 공간벡터를 이용하여 직선과 평면의 방정식을 구하고 주어진 문제를 해결하는 과정을 설명할 수 있는 능력을 판단한다. [2] 좌표공간에서 점과 직선, 직선과 평면의 교점을 구하고, 두 점 사이의 거리와 두 평면이 이루는 각의 크기를 구하는 과정을 설명할 수 있는 능력을 판단한다. [3] 좌표공간에서 공간벡터를 이용하여 구의 방정식을 구하고 평면과 구의 위치관계와 기본 도형의 성질을 이해하여 주어진 문제를 해결하는 과정을 설명할 수 있는 능력을 판단한다. (공식 해설 '출제의도' 원문; 원문 번호 [1]~[3]이 문항 구성 [1], [2](1)~(3)과 어긋나 있음)
key_idea: |
  직선을 매개변수 $t$로 놓고 거리 제곱의 최솟값으로 점과 직선 사이의 거리를 구하고, 교점 $\mathrm{A}$의 위치벡터를 법선벡터로 평면을 세운다. 내적 $\overrightarrow{\mathrm{BP}}\cdot\overrightarrow{\mathrm{CP}}=0$은 $\mathrm{BC}$를 지름으로 하는 구이며, 구와 평면의 교선인 원에서 바깥 점까지의 최단거리는 수선의 발과 중심을 잇는 선분 위에서 잡는다.
stuck: |
  [2](3)에서 점 $\mathrm{E}$ 자체가 아니라 $xy$평면에 내린 수선의 발 $\mathrm{E}^{\prime}$과 원의 위치관계를 먼저 비교하여 최소 거리 점 $\mathrm{Q}^{\prime}$을 잡고 높이 $3\sqrt3$를 더해 피타고라스로 잇는 단계
