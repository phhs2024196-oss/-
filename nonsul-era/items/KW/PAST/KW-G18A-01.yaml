    - id: 11b-2
      content: 원점 $\mathrm{O}$와 점 $\mathrm{P}$ 사이의 거리는 $\overline{\mathrm{OP}}=\sqrt{(2t-1)^2+t^2+(2-t)^2}=\sqrt{6\left(t-\dfrac23\right)^2+\dfrac73}$이다.
      source_flow: 해설 p.8
      criteria:
      - 1-1.M2
