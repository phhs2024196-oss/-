    method_no: 1
    steps:
    - id: 11b-1
      content: $\dfrac{x+1}{2}=y=2-z=t$라 하면 직선 위의 점의 좌표는 $\mathrm{P}(2t-1,t,2-t)$이다.
      source_flow: 해설 p.8
      criteria:
