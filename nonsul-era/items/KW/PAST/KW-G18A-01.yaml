      content: 구와 $xy$평면이 만나는 도형은 $z=0$에서 $(x-6)^2+(y-4)^2=4$인 원이다. 점 $\mathrm{Q}$를 원 위의 임의의 점이라고 하고 점 $\mathrm{E}(2,1,3\sqrt3)$에서 $xy$평면에 내린 수선의 발을 $\mathrm{E}^{\prime}(2,1,0)$이라고 하자. 이때 $\overline{\mathrm{E}^{\prime}\mathrm{D}}=\sqrt{(6-2)^2+(4-1)^2+(0-0)^2}=\sqrt{25}=5$이고, 원의 반지름이 $2$이므로 점 $\mathrm{E}^{\prime}$은 원 외부에 있는 점이 된다.
      source_flow: 해설 p.9
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: 따라서 선분 $\mathrm{E}^{\prime}\mathrm{D}$와 원이 만나는 점을 $\mathrm{Q}^{\prime}$이라고 할 때, $\overline{\mathrm{E}^{\prime}\mathrm{Q}^{\prime}}$은 $\overline{\mathrm{E}^{\prime}\mathrm{Q}}$ 중 최소가 되고, 따라서 $\overline{\mathrm{EQ}^{\prime}}$도 $\overline{\mathrm{EQ}}$ 중 최소가 된다. $\overline{\mathrm{E}^{\prime}\mathrm{Q}^{\prime}}=\overline{\mathrm{E}^{\prime}\mathrm{D}}-2=5-2=3$이다.
      source_flow: 해설 p.9
      criteria:
      - 2-3.M2
    - id: 23b-3
      content: 점 $\mathrm{E}$에서 원 위의 점까지 거리의 최솟값은 $\overline{\mathrm{EQ}^{\prime}}=\sqrt{(3\sqrt3)^2+3^2}=\sqrt{36}=6$이다.
      source_flow: 해설 p.9
