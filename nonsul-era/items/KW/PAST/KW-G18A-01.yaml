stimuli:
- label: '1'
  body: |
    공간 벡터의 내적과 성분
    두 공간벡터 $\overrightarrow{a}=(a_1,a_2,a_3)$, $\overrightarrow{b}=(b_1,b_2,b_3)$에 대하여 $\overrightarrow{a}\cdot\overrightarrow{b}=a_1b_1+a_2b_2+a_3b_3$
- label: '2'
  body: |
    일차방정식과 평면
    좌표공간에서 $x,y,z$에 대한 일차방정식 $ax+by+cz+d=0$은 벡터 $\overrightarrow{n}=(a,b,c)$에 수직인 평면을 나타낸다.
- label: '3'
  body: |
    두 평면이 이루는 각의 크기
    두 평면 $\alpha,\beta$의 법선벡터를 각각 $\overrightarrow{n_1},\overrightarrow{n_2}$라 하고, $\alpha,\beta$가 이루는 각의 크기를 $\theta$, $\overrightarrow{n_1}$과 $\overrightarrow{n_2}$가 이루는 각의 크기를 $\theta^{\prime}$이라고 하면 $\theta$는 $\theta^{\prime}$과 $\pi-\theta^{\prime}$ 중 크지 않은 쪽이다. 이때 $\overrightarrow{n_1}\cdot\overrightarrow{n_2}=\lvert\overrightarrow{n_1}\rvert\lvert\overrightarrow{n_2}\rvert\cos\theta^{\prime}$이므로 $\cos\theta=\lvert\cos\theta^{\prime}\rvert=\dfrac{\lvert\overrightarrow{n_1}\cdot\overrightarrow{n_2}\rvert}{\lvert\overrightarrow{n_1}\rvert\lvert\overrightarrow{n_2}\rvert}$이다.
- label: '4'
  body: |
    구의 방정식
    중심이 $\mathrm{C}(a,b,c)$이고 반지름의 길이가 $r$인 구의 방정식은 $(x-a)^2+(y-b)^2+(z-c)^2=r^2$
- label: '5'
  body: |
    두 점 사이의 거리
    두 점 $\mathrm{P}(x_1,y_1,z_1)$, $\mathrm{Q}(x_2,y_2,z_2)$사이의 거리는 $\overline{\mathrm{PQ}}=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2+(z_2-z_1)^2}$
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
