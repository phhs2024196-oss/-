stimuli:
- label: '1'
  body: |
    함수의 증가와 감소
    함수 $f(x)$가 어떤 열린 구간에서 미분가능할 때, 그 구간의 모든 $x$에 대하여
    ㉠ $f^{\prime}(x)>0$이면 $f(x)$는 그 구간에서 증가한다.
    ㉡ $f^{\prime}(x)<0$이면 $f(x)$는 그 구간에서 감소한다.
- label: '2'
  body: |
    미적분의 기본 정리
    함수 $f(t)$가 구간 $[a,b]$에서 연속이고 $f(t)$의 한 부정적분을 $F(t)$라고 하면 $\displaystyle\int_a^bf(t)\,dt=F(b)-F(a)$
- label: '3'
  body: |
    적분과 미분의 관계
    함수 $f(t)$가 구간 $[a,b]$에서 연속일 때, $\dfrac{d}{dx}\displaystyle\int_a^xf(t)\,dt=f(x)$ (단, $a<x<b$)
- label: '4'
  body: |
    사이값 정리
    함수 $f(x)$가 닫힌 구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면, $f(a)$와 $f(b)$ 사이의 임의의 값 $k$에 대하여 $f(c)=k\ (a<c<b)$인 $c$가 적어도 하나 존재한다.
- label: '5'
  body: |
    곡선의 오목과 볼록
    함수 $f(x)$가 어떤 구간에서
    ㉠ $f^{\prime\prime}(x)>0$이면 곡선 $y=f(x)$는 이 구간에서 아래로 볼록(또는 위로 오목)하다.
    ㉡ $f^{\prime\prime}(x)<0$이면 곡선 $y=f(x)$는 이 구간에서 위로 볼록(또는 아래로 오목)하다.
- label: '6'
  body: |
    정적분의 부분적분법
    두 함수 $f(x)$, $g(x)$가 닫힌 구간 $[a,b]$에서 미분가능하고, $f^{\prime}(x)$, $g^{\prime}(x)$가 연속일 때,
    $$\int_a^bf(x)g^{\prime}(x)\,dx=\left[f(x)g(x)\right]_a^b-\int_a^bf^{\prime}(x)g(x)\,dx$$
- label: '7'
  body: |
    치환적분법을 이용한 정적분
    구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g^{\prime}(t)$가 구간 $[\alpha,\beta]$에서 연속이고, $a=g(\alpha)$, $b=g(\beta)$이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g^{\prime}(t)\,dt$$
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
