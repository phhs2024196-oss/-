intent: |
  [1] (1) 정적분의 성질을 이용하여 함수의 값을 구할 수 있는지를 평가하는 문제이다. (2) 정적분 계산, 정적분의 성질, 정적분의 부분적분법, 삼각함수의 특수각을 이용하여 함숫값의 크기를 측정하는 문제이다. (3) 정적분의 성질 및 사이값 정리를 이용하여 방정식의 실근의 존재를 이해하고 있는지를 평가하는 문제이다. (4) 정적분으로 정의된 함수의 도함수를 구할 수 있는지를 평가하고 도함수의 부호를 이용하여 함수의 증가와 감소를 이해하고 있는지를 평가하는 문제이다. (5) 주어진 함수의 이계도함수를 구하고 이계도함수의 부호와 함수의 그래프의 오목, 볼록 과의 관계를 이해하고 있는지를 평가하는 문제이다. [2] (1) 정적분으로 정의된 수열의 첫째항을 구할 수 있는 지를 평가하는 문제이다. (2) 정적분으로 정의된 수열을 정적분의 치환적분법을 이용하여 일반항을 구하고 수열의 합을 계산할 수 있는 지를 평가하는 문제이다. (공식 해설 '출제의도' 원문)
key_idea: |
  $f(x)$는 적분으로 정의되어 있으므로 $f(1)$은 부분적분으로 $1-2\cos1$을 얻고 $\cos$의 단조성으로 범위를 잡는다. 근의 존재는 사이값 정리, 증가·볼록은 $f^{\prime},f^{\prime\prime}$의 부호로 확인한다. 수열은 $nx^2$ 치환으로 $a_n=\dfrac{1}{2n(n+1)}\left(1-\dfrac1e\right)$을 얻어 부분분수로 합한다.
stuck: |
  [1](2)에서 $\int_0^1t\sin t\,dt$를 부분적분하여 $f(1)=1-2\cos1$을 얻은 뒤, $1<\dfrac{\pi}{3}$과 $\dfrac{\pi}{4}<1$로 $\cos1$을 위·아래에서 눌러 부등식을 맞추는 단계
