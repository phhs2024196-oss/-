intent: |
  [1] 원소의 개수가 $2$인 두 집합의 등식에 대한 이해력과 계산능력을 평가한다. [2] 명제를 이해하는 이해력과 명제의 진리집합을 구체적으로 구하는 논리력을 평가한다. [3] (1) 일대일함수에 대한 이해력을 평가한다. (2) 일대일함수, 역함수, 합성함수에 대한 이해력을 평가한다. (3) 함수에 대한 이해력 및 이차함수의 그래프 개형에 대한 이해력 및 계산능력을 평가한다. (공식 해설 '출제의도' 원문)
key_idea: |
  집합의 상등은 원소 대응으로, 조건 (ⅱ)는 $|a|\ge2$인 원소가 있으면 $a^2,a^4,\dots$가 계속 커져 무한집합이 됨을 이용해 $A\subset\{-1,0,1\}$로 좁힌 뒤 전수 확인한다. 일대일함수는 치역이 $X$이므로 순열, 역함수는 대응을 뒤집어 읽고, 판별식 조건은 $\{1,2,3\}$ 안의 $a,b,c$를 전수 조사한다.
stuck: |
  [2]에서 $a\notin\{-1,0,1\}$이면 $a^{2^{n-1}}$이 모두 $A$에 속하고 순증가하여 유한집합에 모순임을 보이는 단계
