stimuli:
- label: '1'
  body: |
    모든 정수의 집합을 $\mathbb{Z}$, 모든 유리수의 집합을 $\mathbb{Q}$, 모든 실수의 집합을 $\mathbb{R}$로 나타낸다.
- label: '2'
  body: |
    원소가 유한개인 집합을 유한집합이라고 한다.
- label: '3'
  body: |
    내용이 참인지 거짓인지를 분명히 판별할 수 있는 문장이나 식을 명제라고 한다.
- label: '4'
  body: |
    $p,q$가 문장이나 식일 때, ‘$p$이면 $q$이다.’꼴의 명제에서 $p$를 가정, $q$를 결론이라 하고, 명제 ‘$p$이면 $q$이다.’를 기호 $p\rightarrow q$로 나타낸다.
- label: '5'
  body: |
    변수를 포함하는 문장이나 식이 변수의 값에 따라 참, 거짓이 정해질 때, 그 문장이나 식을 조건이라고 한다.
- label: '6'
  body: |
    함수 $f:X\rightarrow Y$에서 정의역 $X$의 원소 $x_1,x_2$에 대하여 $x_1\ne x_2$이면 $f(x_1)\ne f(x_2)$가 성립할 때, 이 함수 $f$를 일대일함수라고 한다.
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: '1'
  stem: |
    [1] 두 집합 $A=\{t,3\}$, $B=\{t+1,2t^2-t-4\}$에 대하여 $A=B$를 만족시키는 상수 $t$의 값을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $t\ne t+1$이므로 $t=2t^2-t-4$이다. 따라서 $t=-1$ 또는 $t=2$이다.
      source_flow: 모범답안 p.6
      criteria:
      - 1.M1
    - id: 1b-2
      content: $t=-1$이면 $3=t+1$을 만족하지 않으므로 $t=2$이다. 또한 $t=2$는 $3=t+1$을 만족시킨다. 그러므로 $t=2$이다.
      source_flow: 모범답안 p.6
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $t=2t^2-t-4$인 이유를 설명했다.
      depends_on: []
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $t=2$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [2] 다음 두 조건을 만족시키는 유한집합 $A$를 모두 구하시오. [16점]

    (ⅰ) $A\subset\mathbb{Z}$이고 $A\ne\varnothing$　　(ⅱ) $a\in A\ \rightarrow\ a^2\in A$
  points: 16
  depends_on: []
  answer:
    kind: set
    value: '{0}, {1}, {0,1}, {-1,1}, {-1,0,1}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $a\in A$라고 하자. 만일 $a\notin\{-1,0,1\}$이면 모든 자연수 $n$에 대하여 $a^{2^{n-1}}\in A$이고 $a^{2^n}-a^{2^{n-1}}=a^{2^{n-1}}(a^{2^{n-1}}-1)>0$이므로 $a^{2^{n-1}}<a^{2^n}$이다. 따라서 $A$가 유한집합이 아니므로 가정에 모순이다. 그러므로 $A\subset\{-1,0,1\}$이다.
      source_flow: 모범답안 p.6
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        그런데 집합 $\{-1,0,1\}$의 부분집합은 모두 $8$개이고 그 중 $\varnothing$, $\{-1\}$, $\{-1,0\}$ 등 $3$가지 경우는 주어진 조건을 만족시키지 않으므로 이 경우들을 제외한 다음과 같은 $5$가지의 경우가 주어진 명제를 만족시키는 집합 $A$이다.
        $$A=\{0\},\ A=\{1\},\ A=\{0,1\},\ A=\{-1,1\},\ A=\{-1,0,1\}$$
      source_flow: 모범답안 p.6
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: $A\subset\{-1,0,1\}$인 이유를 설명했다.
      depends_on: []
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 8
      evidence: $5$가지 집합을 모두 구했다(각 경우마다 2점씩 감점).
      depends_on:
      - 2.M1
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-1
  stem: |
    [3] 집합 $X=\{1,2,3\}$에 대하여 다음 물음에 답하시오.

    (1) 집합 $X$에서 $X$로의 일대일함수의 개수를 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: 함수 $f:X\rightarrow X$가 일대일함수이면 (ⅰ) $f(1)=1$일 때 $f(2)=2$ 또는 $f(2)=3$이고 각각의 경우에 $f(3)$은 유일하게 결정되므로 $2$가지 존재한다. (ⅱ) $f(1)=2$일 때 $f(2)=1$ 또는 $f(2)=3$이고 각각의 경우에 $f(3)$은 유일하게 결정되므로 $2$가지 존재한다. (ⅲ) $f(1)=3$일 때 $f(2)=1$ 또는 $f(2)=2$이고 각각의 경우에 $f(3)$은 유일하게 결정되므로 $2$가지 존재한다.
      source_flow: 모범답안 p.6
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: 그러므로 집합 $X$에서 $X$로의 일대일함수는 모두 $6$개 존재한다.
      source_flow: 모범답안 p.6
      criteria:
      - 3-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 4
      evidence: $f(1)=1,2,3$일 때 각각 $2$가지임을 설명했다.
      depends_on: []
      steps:
      - 31b-1
    - id: 3-1.A1
      mark_type: A
      points: 3
      evidence: 개수 $6$을 구했다.
      depends_on:
      - 3-1.M1
      steps:
      - 31b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    (2) 함수 $f:X\rightarrow X$가 일대일함수이고 조건 $f(1)=3$과 $f(2)=1$을 만족시킬 때, $(f^{-1}\circ f^{-1})(2)$를 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: $f(1)=3$이고 $f(2)=1$이므로 $f(3)=2$이다. 따라서 $f^{-1}(2)=3$이고 $f^{-1}(3)=1$이다.
      source_flow: 모범답안 p.6
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: 그러므로 $(f^{-1}\circ f^{-1})(2)=f^{-1}(f^{-1}(2))=f^{-1}(3)=1$이다. 따라서 $(f^{-1}\circ f^{-1})(2)=1$이다.
      source_flow: 모범답안 p.6
      criteria:
      - 3-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 3
      evidence: $f^{-1}(2)=3$과 $f^{-1}(3)=1$을 구했다(한 경우만 구하면 1점 감점).
      depends_on: []
      steps:
      - 32b-1
    - id: 3-2.A1
      mark_type: A
      points: 3
      evidence: $(f^{-1}\circ f^{-1})(2)=1$을 구했다.
      depends_on:
      - 3-2.M1
      steps:
      - 32b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-3
  stem: |
    (3) 함수 $g:X\rightarrow X$는 일대일함수이고 $g(1)=a$, $g(2)=b$, $g(3)=c$이다. 함수 $h:\mathbb{R}\rightarrow\mathbb{R}$, $h(x)=ax^2+bx+c$의 그래프가 $x$축과 서로 다른 두 점에서 만날 때 $b-ac$의 값을 구하시오. [13점]
  points: 13
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S33-B
    audience: B
    method_no: 1
    steps:
    - id: 33b-1
      content: 함수 $h(x)=ax^2+bx+c$의 그래프가 $x$축과 서로 다른 두 점에서 만나므로 $b^2-4ac>0$이다.
      source_flow: 모범답안 p.6
      criteria:
      - 3-3.M1
    - id: 33b-2
      content: 그런데 $a,b,c$는 각각 $1$ 또는 $2$ 또는 $3$이므로 이 부등식을 만족시키는 $a,b,c$의 값은 다음과 같다. $a=1,b=3,c=2$ 또는 $a=2,b=3,c=1$
      source_flow: 모범답안 p.6
      criteria:
      - 3-3.M2
    - id: 33b-3
      content: 두 가지 경우 모두 $b=3$, $ac=2$이므로 $b-ac=1$이다.
      source_flow: 모범답안 p.6
      criteria:
      - 3-3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-3.M1
      mark_type: M
      points: 4
      evidence: $b^2-4ac>0$인 이유를 설명했다.
      depends_on: []
      steps:
      - 33b-1
    - id: 3-3.M2
      mark_type: M
      points: 6
      evidence: $a=1,b=3,c=2$ 또는 $a=2,b=3,c=1$을 구했다(한 경우만 구하면 3점 감점).
      depends_on:
      - 3-3.M1
      steps:
      - 33b-2
    - id: 3-3.A1
      mark_type: A
      points: 3
      evidence: $b-ac=1$을 구했다.
      depends_on:
      - 3-3.M1
      - 3-3.M2
      steps:
      - 33b-3
