intent: |
  본 문제는 함수의 연속과 미분에 관한 정의를 엄밀히 이해하고 주어진 문제에 해당 개념을 적용하여 문제를 해결할 수 있는지를 평가하고자 한다. [1] 미분의 개념을 활용하여 속도에 대한 문제를 해결할 수 있는지 평가하는 문제이다. [2] 좌극한과 우극한을 각각 계산하여 함수의 연속을 판별할 수 있는지 평가하는 문제이다. [3] 적분 구간에 대한 정적분의 성질을 활용하여 주어진 문제를 해결할 수 있는지 평가하는 문제이다. [4] 주어진 조건을 올바르게 활용하여 미분 가능함을 보일 수 있는지 평가하는 문제이다. (공식 해설 '출제의도' 원문)
key_idea: |
  속도는 위치의 도함수로 부호가 바뀌는 시각을 찾고, 연속은 좌극한·우극한·함숫값을 비교한다. $S(k)$는 절댓값 그래프를 $x=\dfrac k2$에서 나눠 적분해 이차식의 최솟값을 구한다. [4]는 $f(x+y)=f(x)+f(y)$와 $\lvert f(x)\rvert\le x^2$으로 $f^{\prime}(0)=0$, 이어 모든 $x$에서 $f^{\prime}=0$을 보인다.
stuck: |
  [4](2)에서 $\lvert f(h)\rvert\le h^2$을 $h$로 나눠 $\left\lvert\dfrac{f(h)}{h}\right\rvert\le\lvert h\rvert$로 만들고 제시문 4(샌드위치)로 극한 $0$을 얻는 단계
