stimuli:
- label: '1'
  body: |
    속도
    수직선 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 좌표가 $x=f(t)$일 때, 점 $\mathrm{P}$의 시각 $t$에서의 속도 $v$는 $v(t)=\dfrac{dx}{dt}=f^{\prime}(t)$이다.
- label: '2'
  body: |
    좌극한과 우극한
    $x$의 값이 $a$보다 작으면서 $a$에 한없이 가까워질 때, $f(x)$의 값이 일정한 값 $p$에 한없이 가까워지면 $p$를 $x=a$에서 함수 $f(x)$의 좌극한이라 하고, 기호로 $\displaystyle\lim_{x\to a-}f(x)=p$와 같이 나타낸다. 또 $x$의 값이 $a$보다 큰 값을 가지면서 $a$에 한없이 가까워질 때, $f(x)$의 값이 일정한 값 $q$에 한없이 가까워지면 $q$를 $x=a$에서 함수 $f(x)$의 우극한이라 하고, 기호로 $\displaystyle\lim_{x\to a+}f(x)=q$와 같이 나타낸다.
- label: '3'
  body: |
    함수의 연속
    함수 $f(x)$가 실수 $a$에 대하여 다음 조건을 만족시킬 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다.
    (1) 함숫값 $f(a)$가 정의되어 있다.
    (2) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재한다.
    (3) $\displaystyle\lim_{x\to a}f(x)=f(a)$이다.
- label: '4'
  body: |
    함수의 극한의 대소 관계
    $\displaystyle\lim_{x\to a}f(x)=p,\ \lim_{x\to a}g(x)=q$ ($p,q$는 실수)일 때, $a$에 가까운 모든 $x$의 값에 대하여
    $f(x)\le h(x)\le g(x)$이고 $p=q$이면 $\displaystyle\lim_{x\to a}h(x)=p$이다.
- label: '5'
  body: |
    미분 가능의 정의
    함수 $y=f(x)$에서 $x$의 값이 $a$에서 $a+h$까지 변할 때, $x$의 증분은 $\Delta x=(a+h)-a=h$이다. 이때 $y$의 증분은 $\Delta y=f(a+h)-f(a)$이므로 이 함수의 평균변화율은
    $$\frac{\Delta y}{\Delta x}=\frac{f(a+h)-f(a)}{h}$$
    이다. 여기서 $\Delta x\to0$일 때, 평균변화율의 극한값
    $$\lim_{\Delta x\to0}\frac{\Delta y}{\Delta x}=\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$$
    가 존재하면 함수 $y=f(x)$는 $x=a$에서 미분가능하다고 한다.
- label: '6'
  body: |
    함수 $f(x)$가 구간 $[a,b]$에서 연속이고 구간 $(a,b)$에서 미분가능하며, 구간 $(a,b)$의 모든 $x$에 대하여 $f^{\prime}(x)=0$이면 $f(x)$는 구간 $[a,b]$에서 상수함수이다.
