stimuli:
- label: '1'
  body: |
    근과 계수와의 관계
    이차방정식 $ax^2+bx+c=0$의 두 근을 $\alpha,\beta$라고 하면 다음이 성립한다.
    $$\alpha+\beta=-\frac{b}{a},\qquad \alpha\beta=\frac{c}{a}$$
- label: '2'
  body: |
    이차함수의 적분
    $y=a(x-\alpha)(x-\beta)$에 대하여 다음을 얻는다. (단, $\alpha<\beta$)
    $$\int_{\alpha}^{\beta}a(x-\alpha)(x-\beta)\,dx=a\int_{\alpha}^{\beta}\{x^2-(\alpha+\beta)x+\alpha\beta\}dx=a\left[\frac13x^3-\frac12(\alpha+\beta)x^2+\alpha\beta x\right]_{\alpha}^{\beta}$$
    $$=-\frac{a(\beta-\alpha)^3}{6}$$
- label: '3'
  body: |
    벡터
    (1) 영벡터 $\vec{0}$는 크기가 $0$이고 그 방향은 생각하지 않는다.
    (2) 양의 실수 $t$와 벡터 $\overrightarrow{\mathrm{AB}}$에 대하여 $t\overrightarrow{\mathrm{AB}}$는 $\overrightarrow{\mathrm{AB}}$와 방향이 같고, 그 크기가 $t\lvert\overrightarrow{\mathrm{AB}}\rvert$인 벡터이다.
    (3) 세 점 $\mathrm{A},\mathrm{B},\mathrm{C}$에 대하여 다음이 성립한다.
    $$\overrightarrow{\mathrm{AB}}+\overrightarrow{\mathrm{BC}}=\overrightarrow{\mathrm{AC}},\qquad \overrightarrow{\mathrm{AB}}-\overrightarrow{\mathrm{AC}}=\overrightarrow{\mathrm{CB}}$$
    (4) 선분 $\mathrm{AB}$를 $m:n$ $(m>0,\ n>0)$으로 내분하는 점을 $\mathrm{P}$라 하면 다음이 성립한다.
    $$\overrightarrow{\mathrm{OP}}=\frac{n}{m+n}\overrightarrow{\mathrm{OA}}+\frac{m}{m+n}\overrightarrow{\mathrm{OB}}\qquad(\text{단, }\mathrm{O}\text{는 원점})$$
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 좌표평면에서 포물선 $y=x^2-4x$와 기울기가 $2a$인 직선 $l$이 두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$에서 만난다. 포물선과 직선 $l$로 둘러싸인 영역의 넓이가 $\dfrac43$일 때, 다음 물음에 답하시오.

    (1) 직선 $l$의 방정식을 구하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: expression
    value: y=2*a*x-(a+1)*(a+3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        직선 $l$의 방정식을 $y=2ax+b$라 하고 포물선의 방정식과 연립하면 다음을 얻는다.
        $$x^2-4x=2ax+b\ \Rightarrow\ x^2-(4+2a)x-b=0$$
        두 점 $\mathrm{A},\mathrm{B}$의 $x$좌표가 $x_1,x_2$ $(x_1<x_2)$라 하면 제시문 2로부터 다음을 얻는다.
        $$\frac43=\int_{x_1}^{x_2}\{(2ax+b)-(x^2-4x)\}dx=\frac{(x_2-x_1)^3}{6}\ \Rightarrow\ x_2-x_1=2$$
      source_flow: 해설 p.8
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        한편, 근과 계수의 관계로부터 다음을 얻는다.
        $$x_1+x_2=4+2a,\qquad x_1x_2=-b$$
      source_flow: 해설 p.8
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        위에서 얻은 식들을 연립하여 계산하면 $x_1,x_2$와 $b$는 다음과 같다.
        $$x_1=a+1,\qquad x_2=a+3,\qquad b=-(a+1)(a+3)$$
      source_flow: 해설 p.8
      criteria:
      - 1-1.A3
    - id: 11b-4
      content: 따라서 직선 $l$의 방정식은 $y=2ax-(a+1)(a+3)$이다.
      source_flow: 해설 p.8
      criteria:
      - 1-1.A4
