    - id: 31b-3
      content: |
        $\triangle\mathrm{ABM}$에서 꼭짓점 $\mathrm{A}$에서 변 $\mathrm{BM}$에 내린 수선의 발을 $\mathrm{H}$라 하자. $x$는 선분 $\mathrm{AH}$의 길이, $\overline{\mathrm{BH}}=b$라 하면 $\overline{\mathrm{MH}}=2-b$(또는 $b-2$)이므로 피타고라스 정리에 의해 다음을 얻는다.
        $$a^2=x^2+b^2,\qquad 1=x^2+(2-b)^2$$
        연립 방정식을 풀면 다음과 같다.
        $$b=\frac{a^2+3}{4},\qquad x^2=\frac{-(a^4-10a^2+9)}{16},\qquad x=\frac{\sqrt{-(a^4-10a^2+9)}}{4}$$
        그러므로 $\triangle\mathrm{ABM}$의 넓이는 다음과 같다.
        $$\frac12\times2\times\frac{\sqrt{-(a^4-10a^2+9)}}{4}=\frac{\sqrt{-(a^4-10a^2+9)}}{4}$$
      source_flow: 해설 p.9
      criteria:
