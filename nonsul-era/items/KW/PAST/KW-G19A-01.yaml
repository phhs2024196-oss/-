  solutions:
  - id: S31-B
    audience: B
    source_flow: 해설 p.9
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $\triangle\mathrm{ACD}$와 $\triangle\mathrm{BCD}$는 이등변 삼각형이다. 그러므로 $\overline{\mathrm{CD}}$의 중점을 $\mathrm{M}$이라 하면 다음을 얻는다.
        $$\overline{\mathrm{AM}}=1,\quad \overline{\mathrm{BM}}=2,\quad \overline{\mathrm{AM}}\perp\overline{\mathrm{CD}},\quad \overline{\mathrm{BM}}\perp\overline{\mathrm{CD}}$$
      source_flow: 해설 p.9
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        이로부터 $\triangle\mathrm{ABM}$을 포함하는 평면은 변 $\mathrm{CD}$에 수직임을 알 수 있다. 그러므로 사면체 $\mathrm{ABCD}$의 부피는 다음과 같이 구할 수 있다.
        $$(\text{사면체 }\mathrm{ABCD}\text{의 부피})=\frac13\times\overline{\mathrm{CD}}\times(\triangle\mathrm{ABM}\text{의 넓이})\ \cdots\cdots\ ①$$
      source_flow: 해설 p.9
