- id: 2-2
  stem: |
    (2) $(1-s)\overrightarrow{\mathrm{PA}}+s\overrightarrow{\mathrm{PB}}+2\overrightarrow{\mathrm{PO}}=\vec{0}$ $(0\le s\le1)$을 만족하고, $\triangle\mathrm{OAB}$의 경계 및 내부에서 움직이는 점 $\mathrm{P}$가 그리는 선분의 길이를 구하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: value
    value: sqrt(5)
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        선분 $\mathrm{AB}$를 $s:(1-s)$로 내분하는 점을 $\mathrm{Q}$라 하면 다음이 성립한다.
        $$\overrightarrow{\mathrm{PQ}}=(1-s)\overrightarrow{\mathrm{PA}}+s\overrightarrow{\mathrm{PB}}$$
        이를 주어진 식에 대입하면 다음을 얻는다.
        $$2\overrightarrow{\mathrm{OP}}=\overrightarrow{\mathrm{PQ}}=\overrightarrow{\mathrm{PO}}+\overrightarrow{\mathrm{OQ}}\ \Rightarrow\ \overrightarrow{\mathrm{OP}}=\frac13\overrightarrow{\mathrm{OQ}}$$
      source_flow: 해설 p.8
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        따라서 세 점 $\mathrm{O},\mathrm{P},\mathrm{Q}$는 동일 직선 위에 있다. 또한 점 $\mathrm{P}$는 선분 $\mathrm{OQ}$를 $1:2$로 내분하는 점임을 알 수 있다. $s$가 $0\le s\le1$이므로 $\mathrm{Q}$는 선분 $\mathrm{AB}$에서 움직이는 점이다. 그러므로 선분 $\mathrm{OA}$를 $1:2$로 내분하는 점을 $\mathrm{A}'$, 선분 $\mathrm{OB}$를 $1:2$로 내분하는 점을 $\mathrm{B}'$이라 하면 점 $\mathrm{P}$가 그리는 선분은 선분 $\mathrm{A}'\mathrm{B}'$이다.
      source_flow: 해설 p.8
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: |
        한편 $\triangle\mathrm{OA}'\mathrm{B}'$과 $\triangle\mathrm{OAB}$의 닮음비로부터 다음을 얻는다.
        $$\frac{\overline{\mathrm{A}'\mathrm{B}'}}{\overline{\mathrm{AB}}}=\frac13$$
        따라서 선분 $\mathrm{A}'\mathrm{B}'$의 길이, 즉 점 $\mathrm{P}$가 그리는 선분의 길이는 다음과 같다.
        $$(\text{점 }\mathrm{P}\text{가 그리는 선분의 길이})=3\sqrt5\times\frac13=\sqrt5$$
      source_flow: 해설 p.8
      criteria:
      - 2-2.A3
