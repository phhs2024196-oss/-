- id: 3-1
  stem: |
    [3] 오른쪽 그림과 같이 사면체 $\mathrm{ABCD}$의 각 변의 길이가 다음과 같을 때 물음에 답하시오.
    $$\overline{\mathrm{AB}}=a,\quad \overline{\mathrm{AC}}=\overline{\mathrm{AD}}=\sqrt2,\quad \overline{\mathrm{BC}}=\overline{\mathrm{BD}}=\sqrt5,\quad \overline{\mathrm{CD}}=2$$
    [그림 1: 사면체 ABCD. 꼭짓점 A가 위, B가 왼쪽, C가 아래, D가 오른쪽에 있고 변 AB=$a$, AC=AD=$\sqrt2$, BC=BD=$\sqrt5$, CD=$2$로 표시되어 있다. 보이지 않는 변 BD는 점선이다]

    (1) 사면체 $\mathrm{ABCD}$의 부피 $V$를 $a$에 관한 식으로 나타내시오. [15점]
  points: 15
