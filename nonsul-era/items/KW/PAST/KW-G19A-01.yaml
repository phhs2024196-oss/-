    - id: 31b-4
      content: |
        이제 식 ①을 이용하면 부피 $V$는 다음과 같다.
        $$V=\frac13\times2\times\frac{\sqrt{-(a^4-10a^2+9)}}{4}=\frac{\sqrt{-(a^4-10a^2+9)}}{6}$$
      source_flow: 해설 p.9
