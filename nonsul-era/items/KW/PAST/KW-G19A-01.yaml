  solutions:
  - id: S12-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        (1)에서 얻은 식들로부터 중점 $\mathrm{M}$의 좌표 $x_0$과 $y_0$은 다음과 같다.
        $$x_0=\frac{x_1+x_2}{2}=a+2,\qquad y_0=2ax_0-(a+1)(a+3)$$
      source_flow: 해설 p.8
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $a=x_0-2$를 위의 두 번째 식에 대입하면 다음을 얻는다.
        $$y_0=2(x_0-2)x_0-(x_0-1)(x_0+1)=2x_0^2-4x_0-(x_0^2-1)=x_0^2-4x_0+1$$
        따라서 도형의 방정식은 $y=x^2-4x+1$이다.
      source_flow: 해설 p.8
      criteria:
      - 1-2.A2
