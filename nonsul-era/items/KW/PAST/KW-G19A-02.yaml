    value: 극소
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    source_flow: 해설 p.13
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $$f^{\prime}(x)=\frac{e^x(x+1)(e^x+1)-(xe^x+1)e^x}{(e^x+1)^2}=\frac{e^x(e^x+x)}{(e^x+1)^2}$$
        이다.
      source_flow: 해설 p.13
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        $p$에서 극값을 가지므로 $f^{\prime}(p)=0$이다. 이로부터 $e^p+p=0$이다.
        $x<p$이면 $e^x+x<0$이므로 $f^{\prime}(x)<0$이다.
        $x>p$이면 $e^x+x>0$이므로 $f^{\prime}(x)>0$이다.
        따라서 $x=p$에서 극소이다.
