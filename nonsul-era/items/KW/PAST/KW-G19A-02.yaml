- id: 2-1
  stem: |
    [2] 다음 두 조건을 만족시키는 이차함수 $f(x)=ax^2+bx+c$에 대하여 물음에 답하시오.

    (ⅰ) 임의의 일차함수 $g(x)$에 대하여 $\displaystyle\int_{-1}^{1}f(x)g(x)\,dx=0$

    (ⅱ) $2f(x)=\displaystyle\int_0^2\{f(x)-3+f(t)\}dt$

    (1) 함수 $f(x)$를 구하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: expression
    value: 3*x**2-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    source_flow: 해설 p.12
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        (ⅰ)로부터 $g(x)=px+q$라 하면
        $$\int_{-1}^1(ax^2+bx+c)(px+q)dx=\int_{-1}^1\{apx^3+(aq+bp)x^2+(bq+cp)x+cq\}dx$$
        $$=\left[\frac{ap}{4}x^4+\frac{aq+bp}{3}x^3+\frac{bq+cp}{2}x^2+cqx\right]_{-1}^1=\frac23(aq+bp)+2cq=\frac{2b}{3}p+2\left(\frac a3+c\right)q=0$$
        이다.
      source_flow: 해설 p.12
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $p,q$에 대한 항등식이므로 $b=0$, $\dfrac a3+c=0$이다.
      source_flow: 해설 p.12
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        이로부터 $f(x)=ax^2-\dfrac a3$이다. 이것을 (ⅱ)에 대입하면
        $$2f(x)=\int_0^2\{f(x)-3+f(t)\}dt=2f(x)-6+\int_0^2\left(at^2-\frac a3\right)dt$$
        이다. $6=a\left(\dfrac83-\dfrac23\right)=2a$이므로 $a=3$이고 $f(x)=3x^2-1$이다.
      source_flow: 해설 p.12
      criteria:
      - 2-1.A3
  rubric:
