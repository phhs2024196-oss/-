stimuli:
- label: '1'
  body: |
    함수의 증가와 감소
    함수 $f(x)$가 어떤 열린 구간에서 미분가능할 때 그 구간의 모든 $x$에 대하여
    (1) $f^{\prime}(x)>0$이면 $f(x)$는 그 구간에서 증가한다.
    (2) $f^{\prime}(x)<0$이면 $f(x)$는 그 구간에서 감소한다.
- label: '2'
  body: |
    극대와 극소의 판정
    미분가능한 함수 $y=f(x)$에서 $f^{\prime}(a)=0$이고, $x=a$의 좌우에서
    (1) $f^{\prime}(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고, 극댓값 $f(a)$를 가진다.
    (2) $f^{\prime}(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고, 극솟값 $f(a)$를 가진다.
- label: '3'
  body: |
    미적분의 기본 정리
    함수 $f(x)$가 구간 $[a,b]$에서 연속이고, $f(x)$의 한 부정적분을 $F(x)$라고 하면
    $$\int_a^bf(x)\,dx=F(b)-F(a)$$
- label: '4'
  body: |
    정적분의 부분적분법
    두 함수 $f(x)$, $g(x)$가 미분가능하고, $f^{\prime}(x)$, $g^{\prime}(x)$가 연속일 때,
    $$\int_a^bf(x)g^{\prime}(x)\,dx=\bigl[f(x)g(x)\bigr]_a^b-\int_a^bf^{\prime}(x)g(x)\,dx$$
- label: '5'
  body: |
    치환적분법을 이용한 정적분
    닫힌 구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g^{\prime}(t)$가 닫힌 구간 $[\alpha,\beta]$에서 연속이고, $a=g(\alpha)$, $b=g(\beta)$이면
    $$\int_a^bf(x)\,dx=\int_{\alpha}^{\beta}f(g(t))g^{\prime}(t)\,dt$$
- label: '6'
  body: |
    합성함수
    두 함수 $f:X\to Z$, $g:Z\to Y$의 합성함수는 $g\circ f:X\to Y$, $(g\circ f)(x)=g(f(x))$이다.
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: '1'
  stem: |
    [1] 함수 $g(x)=\displaystyle\int_1^e(t-x)\left(t-\frac{x}{t}\right)\ln t\,dt$는 $x=a$에서 최솟값을 갖는다. $a$를 구하시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: (exp(2)+5)/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: 해설 p.12
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $$g(x)=\int_1^e(t-x)\left(t-\frac{x}{t}\right)\ln t\,dt=\left(\int_1^e\frac{\ln t}{t}dt\right)x^2-\left(\int_1^e(t+1)\ln t\,dt\right)x+A\quad\left(A=\int_1^et^2\ln t\,dt\right)$$
      source_flow: 해설 p.12
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        2차항의 계수를 계산하면 $\displaystyle\int_1^e\frac{\ln t}{t}dt=\int_0^1u\,du=\frac12$이다. ($\ln t=u$로 치환)
      source_flow: 해설 p.12
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        1차항의 계수를 계산하면
        $$-\int_1^e(t+1)\ln t\,dt=-\left[\left(\frac{t^2}{2}+t\right)\ln t\right]_1^e+\int_1^e\left(\frac t2+1\right)dt=-\frac{e^2}{2}-e+\left[\frac{t^2}{4}+t\right]_1^e=-\frac{e^2+5}{4}$$
        이다.
      source_flow: 해설 p.12
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서 $g(x)=\dfrac12x^2-\dfrac{e^2+5}{4}x+A=\dfrac12\left(x-\dfrac{e^2+5}{4}\right)^2+A-\dfrac12\left(\dfrac{e^2+5}{4}\right)^2$이다.
        $g(x)$가 최솟값을 가지는 $x$는 $\dfrac{e^2+5}{4}$이다.
      source_flow: 해설 p.12
      criteria:
      - 1.A4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $g(x)$를 $x$에 대한 이차함수 $\left(\int_1^e\frac{\ln t}{t}dt\right)x^2-\left(\int_1^e(t+1)\ln t\,dt\right)x+A$로 표현했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: '1차항의 계수에 나타난 정적분을 치환적분법으로 계산했다. [판독확인: 원문 표기 ''1차항의 계수…치환적분법'', ''2차항의 계수…부분적분법'' — 모범답안에서는 2차항 계수 $\int_1^e\frac{\ln t}{t}dt$를 치환적분, 1차항 계수 $-\int_1^e(t+1)\ln t\,dt$를 부분적분으로 계산하여 1차·2차가 뒤바뀐 것으로 보임]'
      depends_on: []
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: '2차항의 계수에 나타난 정적분을 부분적분법으로 계산했다. [판독확인: 위와 같은 1차·2차 표기 뒤바뀜 의심]'
      depends_on: []
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.A4
      mark_type: A
      points: 2
      evidence: 이차함수가 최솟값을 가지는 $x=\dfrac{e^2+5}{4}$를 도출했다.
      depends_on:
      - 1.M1
      - 1.M2
      - 1.M3
      implied_ok: false
      steps:
      - 1b-4
