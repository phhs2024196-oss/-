- id: 2-2
  stem: |
    (2) $0<a<\sqrt3$일 때, 극한값 $\displaystyle\lim_{x\to a}\frac{2[g(x)+x]}{[f(x)+x]+5}$가 존재하는 $a$의 범위를 모두 구하시오. [15점]
  points: 15
  depends_on: []
  answer:
    kind: set
    value: 0<a<1; 1<a<sqrt(2); sqrt(2)<a<sqrt(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    source_flow: 해설 p.9
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $\displaystyle\lim_{x\to a}\frac{2[g(x)+x]}{[f(x)+x]+5}=\lim_{x\to a}\frac{2[x^2]+10}{[x^2]+2}$이다.
      source_flow: 해설 p.9
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        (ⅰ) $0<a<1$이면 $\displaystyle\lim_{x\to a}[x^2]=0$이므로 $\displaystyle\lim_{x\to a}\frac{2[x^2]+10}{[x^2]+2}=5$이다.
      source_flow: 해설 p.9
      criteria:
      - 2-2.B2
    - id: 22b-3
      content: |
        (ⅱ) $a=1$이면 $\displaystyle\lim_{x\to a-}[x^2]=0$이고 $\displaystyle\lim_{x\to a+}[x^2]=1$이다. 따라서 $\displaystyle\lim_{x\to a-}\frac{2[x^2]+10}{[x^2]+2}=5$이고 $\displaystyle\lim_{x\to a+}\frac{2[x^2]+10}{[x^2]+2}=4$이므로 $\displaystyle\lim_{x\to a}\frac{2[x^2]+10}{[x^2]+2}$이 존재하지 않는다.
      source_flow: 해설 p.9
      criteria:
      - 2-2.B3
    - id: 22b-4
      content: |
        (ⅲ) $1<a<\sqrt2$이면 $\displaystyle\lim_{x\to a}[x^2]=1$이므로 $\displaystyle\lim_{x\to a}\frac{2[x^2]+10}{[x^2]+2}=4$이다.
      source_flow: 해설 p.9
      criteria:
      - 2-2.B4
    - id: 22b-5
      content: |
        (ⅳ) $a=\sqrt2$이면 $\displaystyle\lim_{x\to a-}[x^2]=1$이고 $\displaystyle\lim_{x\to a+}[x^2]=2$이다. 따라서 $\displaystyle\lim_{x\to a-}\frac{2[x^2]+10}{[x^2]+2}=4$이고 $\displaystyle\lim_{x\to a+}\frac{2[x^2]+10}{[x^2]+2}=\dfrac72$이므로 $\displaystyle\lim_{x\to a}\frac{2[x^2]+10}{[x^2]+2}$이 존재하지 않는다.
      source_flow: 해설 p.9
      criteria:
      - 2-2.B5
    - id: 22b-6
      content: |
        (ⅴ) $\sqrt2<a<\sqrt3$이면 $\displaystyle\lim_{x\to a}[x^2]=2$이므로 $\displaystyle\lim_{x\to a}\frac{2[x^2]+10}{[x^2]+2}=\dfrac72$이다.
      source_flow: 해설 p.9
      criteria:
      - 2-2.B6
    - id: 22b-7
      content: 따라서 극한값 $\displaystyle\lim_{x\to a}\frac{2[g(x)+x]}{[f(x)+x]+5}$가 존재하는 모든 $a$의 범위는 $0<a<1$, $1<a<\sqrt2$, $\sqrt2<a<\sqrt3$이다.
      source_flow: 해설 p.9
      criteria:
      - 2-2.A7
