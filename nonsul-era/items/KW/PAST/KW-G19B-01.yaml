stimuli:
- label: '1'
  body: 두 함수 $f:X\to Y$, $g:Y\to Z$의 합성함수는 $g\circ f:X\to Z$, $(g\circ f)(x)=g(f(x))$이다.
- label: '2'
  body: 다항식 $P(x)$를 $x-\alpha$로 나누었을 때의 몫을 $Q(x)$, 나머지를 $R$라고 하면 $P(x)=(x-\alpha)Q(x)+R$가 성립한다.
- label: '3'
  body: 다항식 $P(x)$에 대하여 $P(\alpha)=0$이면, $P(x)$는 일차식 $x-\alpha$로 나누어떨어진다.
- label: '4'
  body: $p,q$가 문장이나 식일 때, ‘$p$이면 $q$이다.’ 꼴의 명제에서 $p$를 가정, $q$를 결론이라 하고, 명제 ‘$p$이면 $q$이다.’를 기호 $p\to q$로 나타낸다.
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 함수 $f$를 다음과 같이 정의할 때, 물음에 답하시오.
    $$f(x)=\begin{cases}e^x&(x\ge0)\\2x+1&(x<0)\end{cases}$$

    (1) $(f\circ f)(x)$를 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: p1=exp(exp(x)); p2=exp(2*x+1); p3=4*x+3
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        (ⅰ) $x\ge0$이면 $f(x)=e^x$이고 $e^x\ge0$이므로 $(f\circ f)(x)=f(e^x)=e^{e^x}$이다.
      source_flow: 해설 p.8
      criteria:
      - 1-1.B1
    - id: 11b-2
      content: |
        (ⅱ) $-\dfrac12\le x<0$이면 $f(x)=2x+1\ge0$이므로 $(f\circ f)(x)=f(2x+1)=e^{2x+1}$이다.
      source_flow: 해설 p.8
      criteria:
      - 1-1.B2
    - id: 11b-3
      content: |
        (ⅲ) $x<-\dfrac12$이면 $f(x)=2x+1<0$이므로
        $(f\circ f)(x)=f(2x+1)=2(2x+1)+1=4x+3$이다.
        따라서
        $$(f\circ f)(x)=\begin{cases}e^{e^x}&(x\ge0)\\e^{2x+1}&\left(-\dfrac12\le x<0\right)\\4x+3&\left(x<-\dfrac12\right)\end{cases}$$
        이다.
      source_flow: 해설 p.8
      criteria:
      - 1-1.B3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.B1
      mark_type: B
      points: 2
      evidence: $x\ge0$일 때 $(f\circ f)(x)=f(e^x)=e^{e^x}$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.B2
      mark_type: B
      points: 3
      evidence: $-\dfrac12\le x<0$일 때 $(f\circ f)(x)=f(2x+1)=e^{2x+1}$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-2
    - id: 1-1.B3
      mark_type: B
      points: 2
      evidence: $x<-\dfrac12$일 때 $(f\circ f)(x)=f(2x+1)=4x+3$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-3
