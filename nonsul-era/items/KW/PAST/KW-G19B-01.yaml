- id: 2-1
  stem: |
    [2] 함수 $f(x)=x^2-x-3$과 $g(x)=x^2-x+5$에 대하여 다음 물음에 답하시오. (단, $[x]$는 $x$보다 크지 않은 최대의 정수이다.)

    (1) 부등식 $\lvert2[f(x)]-5\rvert\le[g(x)]+3$의 해를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: set
    value: -4<x<=(1-sqrt(5))/2 or (1+sqrt(5))/2<=x<5
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $-[g(x)]-3\le2[f(x)]-5\le[g(x)]+3$이다.
        $[f(x)]=[x^2-x]-3$이고 $[g(x)]=[x^2-x]+5$이므로
        $-[x^2-x]-8\le2[x^2-x]-11\le[x^2-x]+8$이다.
        따라서 $-[x^2-x]-8\le2[x^2-x]-11$이고 $2[x^2-x]-11\le[x^2-x]+8$이다.
      source_flow: 해설 p.8
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        부등식 $-[x^2-x]-8\le2[x^2-x]-11$로부터 $[x^2-x]\ge1$이고 $x^2-x\ge1$이므로
        $x\le\dfrac{1-\sqrt5}{2}$ 또는 $x\ge\dfrac{1+\sqrt5}{2}$이다.
      source_flow: 해설 p.8
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        부등식 $2[x^2-x]-11\le[x^2-x]+8$로부터 $[x^2-x]\le19$이고 $x^2-x<20$이므로
        $-4<x<5$이다.
      source_flow: 해설 p.8
      criteria:
      - 2-1.M3
    - id: 21b-4
      content: 따라서 부등식의 해는 $-4<x\le\dfrac{1-\sqrt5}{2}$ 또는 $\dfrac{1+\sqrt5}{2}\le x<5$이다.
      source_flow: 해설 p.8
      criteria:
      - 2-1.A4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 2
      evidence: 부등식 $-[x^2-x]-8\le2[x^2-x]-11\le[x^2-x]+8$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 21b-1
    - id: 2-1.M2
      mark_type: M
      points: 3
      evidence: $x\le\dfrac{1-\sqrt5}{2}$ 또는 $x\ge\dfrac{1+\sqrt5}{2}$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 21b-2
    - id: 2-1.M3
      mark_type: M
      points: 3
      evidence: $-4<x<5$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 21b-3
    - id: 2-1.A4
      mark_type: A
      points: 2
      evidence: $-4<x\le\dfrac{1-\sqrt5}{2}$ 또는 $\dfrac{1+\sqrt5}{2}\le x<5$를 구했다.
      depends_on:
