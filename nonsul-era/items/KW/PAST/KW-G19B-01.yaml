  solutions:
  - id: S12-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        주어진 영역은 윗변의 길이가 $\dfrac12$, 아랫변의 길이가 $\dfrac34$, 높이가 $1$인 사다리꼴이다.
        따라서 영역의 넓이는 $\left(\dfrac12+\dfrac34\right)\times1\times\dfrac12=\dfrac58$이다.
      source_flow: 해설 p.8
      criteria:
