key_idea: '[1] 구간별 함수의 정의역을 $f(x)\ge0$ 여부로 나누어 합성하고, 그래프로 사다리꼴 넓이를 구한다. [2] 가우스 기호 안 이차식의 정수 부분을 $[x^2-x]$로 통일해 부등식을 풀고, $[x^2]$의 값이 바뀌는 $a=1,\sqrt2$에서 좌·우극한을 비교한다. [3] 나머지정리·인수정리로 $(x+1)P(x)$의 나머지를 구하고, 귀류법으로 $P(0)=P(1)=P(2)=P(3)=0$이 삼차식과 모순임을 보인다.'
stuck: '[1](1) $f(x)$의 부호에 따라 $x<-\frac12$, $-\frac12\le x<0$, $x\ge0$으로 나누는 단계, [2](2) $[x^2]$가 바뀌는 점 $a=1,\sqrt2$에서 좌우극한이 다름을 확인하는 단계, [3](2) 명제의 부정을 세워 네 점에서 영이 됨을 인수정리로 잇는 단계'
