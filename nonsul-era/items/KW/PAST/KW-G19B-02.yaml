  solutions:
  - id: S21-B
    audience: B
    source_flow: 해설 p.12
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        도형 $A$의 방정식은 $x^2-4y+4=0$, 도형 $B$의 방정식은 $y^2-4x+4=0$이다.
        $y$를 소거하여 정리하면 $x^4+8x^2-64x+80=(x-2)^2(x^2+4x+20)=0$
        $x^2+4x+20=0$의 판별식 $\dfrac D4=4-20<0$이므로 $(x-2)^2(x^2+4x+20)=0$의 해는 $x=2$뿐이다.
        그러므로 도형 $A$와 도형 $B$는 한 점 $(2,2)$에서만 만난다.
      source_flow: 해설 p.12
      criteria:
      - 2-1.B1
