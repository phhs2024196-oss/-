- id: '4'
  stem: |
    [4] $0<x<\dfrac\pi6$에 대하여 부등식 $\tan3x>ax$를 만족하는 $a$의 최댓값을 구하시오. [14점]
  points: 14
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    source_flow: 해설 p.13
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $f(x)=\tan3x-ax$라 하자.
        $f^{\prime}(x)=3\sec^23x-a$
        $f^{\prime\prime}(x)=(18\sec^23x)\tan3x$
        구간 $\left(0,\dfrac\pi6\right)$에서 $f^{\prime\prime}(x)>0$
        제시문 4에 의해 구간 $\left(0,\dfrac\pi6\right)$에서 $f^{\prime}(x)$는 증가한다. ----------㉠
      source_flow: 해설 p.13
      criteria:
      - 4.R1
    - id: 4b-2
      content: |
        만약 $f^{\prime}(0)\ge0$이면 (즉 $f^{\prime}(0)=3-a\ge0$) -----------㉡
        ㉠에 의해 구간 $\left(0,\dfrac\pi6\right)$에서 $f^{\prime}(x)>0$이므로 제시문 4에 의해 $f(x)$는 증가한다.
        그런데 $f(0)=0$이므로 구간 $\left(0,\dfrac\pi6\right)$에서 $f(x)>0$이 되어 조건 $\tan3x>ax$를 만족한다.
      source_flow: 해설 p.13
      criteria:
      - 4.R1
    - id: 4b-3
      content: |
        만약 $f^{\prime}(0)<0$이면 (즉 $f^{\prime}(0)=3-a<0$)
        어떤 $b$에 대해 구간 $(0,b)$에서 $f(x)<0$ 즉 $\tan3x<ax$이 되어 조건을 만족하지 않는다.
        왜냐하면 $\displaystyle\lim_{x\to\frac\pi6+}f^{\prime}(x)=\infty$인데, [판독확인: 원문 표기 $x\to\frac{\pi}{6}+$ — 구간 $\left(0,\frac\pi6\right)$에서 $\sec^23x\to\infty$가 되는 쪽은 $x\to\frac\pi6-$이나 원문 그대로]
        $f^{\prime}(x)$는 연속함수이고 $f^{\prime}(0)<0$이므로
        사이값 정리에 의해 $f^{\prime}(b)=0$인 $b\in\left(0,\dfrac\pi6\right)$가 존재한다.
        그러면 구간 $(0,b)$에서 $f^{\prime}(x)<0$이므로
        제시문 4에 의해 그 구간에서 $f(x)$는 감소한다.
        $f(0)=0$이므로 구간 $(0,b)$에서 $f(x)<0$.
      source_flow: 해설 p.13
      criteria:
      - 4.R2
    - id: 4b-4
      content: 그러므로 ㉡에 의해 $a$의 최댓값은 $3$
      source_flow: 해설 p.13
      criteria:
      - 4.R2
  - id: S4-B2
    audience: B
    source_flow: 해설 p.14
    method_no: 2
    steps:
    - id: 4b2-1
      content: |
        $f(x)=\dfrac{\tan3x}{x}\ \left(0<x<\dfrac\pi6\right)$라 하자.
        $$f^{\prime}(x)=\frac{3x\sec^23x-\tan3x}{x^2}=\frac{\dfrac{3x}{\cos^23x}-\dfrac{\sin3x}{\cos3x}}{x^2}=\frac{3x-\dfrac12\cdot2\sin3x\cos3x}{x^2\cos^23x}=\frac{6x-\sin6x}{2x^2\cos^23x}$$
        이때 구간 $\left(0,\dfrac\pi6\right)$에서 분모는 양수이고 ----------㉠
      source_flow: 해설 p.14
      criteria: []
    - id: 4b2-2
      content: |
        분자도 양수임을 보이기 위해 $g(x)=6x-\sin6x\ \left(0<x<\dfrac\pi6\right)$라 하자.
        $g^{\prime}(x)=6(1-\cos6x)>0$이므로 제시문 4에 의해 $g(x)$는 증가한다.
        $\displaystyle\lim_{x\to0+}g(x)=0$이므로 $g(x)>0\ \left(0<x<\dfrac\pi6\right)$ ----------㉡
      source_flow: 해설 p.14
      criteria: []
    - id: 4b2-3
      content: |-
        ㉠과 ㉡에 의해 $f^{\prime}(x)>0\ \left(0<x<\dfrac\pi6\right)$이므로 제시문 4에 의해 $f(x)$는 증가한다.---------㉢
        $\displaystyle\lim_{x\to0+}f(x)=\lim_{x\to0+}\frac{\tan3x}{x}=\lim_{x\to0+}\frac{\sin3x}{3x}\frac{3}{\cos3x}=3$ ----------㉣
        ㉢과 ㉣으로부터 구간 $\left(0,\dfrac\pi6\right)$에서 $\dfrac{\tan3x}{x}>a$인 $a$의 최댓값은 $3$
        즉 (양변에 $x$를 곱하면) 구간 $\left(0,\dfrac\pi6\right)$에서 $\tan3x>ax$인 $a$의 최댓값은 $3$
      source_flow: 해설 p.14
      criteria: []
