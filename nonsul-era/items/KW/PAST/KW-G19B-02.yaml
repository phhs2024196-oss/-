stimuli:
- label: '1'
  body: |
    도형의 대칭이동
    방정식 $f(x,y)=0$이 나타내는 도형을 직선 $y=x$에 대하여 대칭이동한 도형의 방정식은 $f(y,x)=0$
- label: '2'
  body: |
    입체도형의 부피
    닫힌 구간 $[a,b]$의 임의의 점 $x$에서 $x$축에 수직인 평면으로 자를 때 생기는 단면의 넓이가 $S(x)$인 입체도형의 부피 $V$는
    $$V=\int_a^bS(x)\,dx\qquad(\text{단, }S(x)\text{는 닫힌 구간 }[a,b]\text{에서 연속})$$
- label: '3'
  body: |
    함수의 극대와 극소 판정
    $a$를 포함하는 어떤 열린 구간에서 미분가능한 함수 $f(x)$에 대하여 $f^{\prime}(a)=0$이고 $x$의 값이 $a$보다 작은 값에서 $a$보다 큰 값으로 바뀔 때, $f^{\prime}(x)$의 부호가
    (1) 양에서 음으로 바뀌면 함수 $f(x)$는 $x=a$에서 극댓값을 가진다.
    (2) 음에서 양으로 바뀌면 함수 $f(x)$는 $x=a$에서 극솟값을 가진다.
- label: '4'
  body: |
    함수의 증가와 감소
    함수 $f(x)$가 구간 $[a,b]$에서 연속이고 구간 $(a,b)$에서 미분가능할 때
    (1) 구간 $(a,b)$에서 $f^{\prime}(x)>0$이면 함수 $f(x)$는 구간 $[a,b]$에서 증가한다.
    (2) 구간 $(a,b)$에서 $f^{\prime}(x)<0$이면 함수 $f(x)$는 구간 $[a,b]$에서 감소한다.
- label: '5'
  body: |
    사이값 정리
    함수 $f(x)$가 닫힌 구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$일 때, $f(a)$와 $f(b)$사이의 임의의 $k$에 대하여
    $$f(c)=k\quad(a<c<b)$$
    인 $c$가 적어도 하나 존재한다.
