    method_no: 1
    steps:
    - id: 22b-1
      content: |
        도형 $A$는 함수 $y=\dfrac14x^2+1$의 그래프이고 이 함수의 $x=2$에서 접선의 방정식은 $y=x$이다. 닫힌 구간 $[0,1]$의 임의의 점 $x$에서 $x$축에 수직인 평면으로 자른 단면의 넓이 $S(x)$는 한 변의 길이가 $\dfrac14x^2-x+1$인 정삼각형의 넓이이므로
        $$S(x)=\frac12\left(\frac14x^2-x+1\right)^2\sin\frac\pi3=\frac{\sqrt3}{4}\left(\frac{x^4}{16}-\frac{x^3}{2}+\frac32x^2-2x+1\right)$$
      source_flow: 해설 p.12
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        구하는 입체의 부피 $V$는
        $$V=\frac{\sqrt3}{4}\int_0^1\left(\frac{x^4}{16}-\frac{x^3}{2}+\frac32x^2-2x+1\right)dx=\frac{\sqrt3}{4}\left[\frac{x^5}{80}-\frac{x^4}{8}+\frac{x^3}{2}-x^2+x\right]_0^1=\frac{31\sqrt3}{320}$$
      source_flow: 해설 p.12
      criteria:
      - 2-2.A2
