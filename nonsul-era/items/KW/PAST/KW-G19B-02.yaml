      content: |
        $f^{\prime}(x)=3ax^2+2bx+1=0$의 두 근은 $\cos\theta,\ \sec\theta$이다.
        근과 계수의 관계에 의해 $\cos\theta\sec\theta=1=\dfrac1{3a}$. 따라서 $a=\dfrac13$.
      source_flow: 해설 p.13
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        만약 $f^{\prime}(x)=0$이 중근을 가지면 ($\theta=0$인 경우로 $x=\cos0=\sec0=1$) $f^{\prime}(x)=(x-1)^2\ge0$이다. 이 경우 $f(x)$는 증가하므로 $f(x)$는 극값을 갖지 않는다. 그러므로 방정식 $f^{\prime}(x)=0$이 서로 다른 두 실근을 가져야 한다.
        $\dfrac D4=b^2-3a=b^2-1>0$이므로 $b>1$ 또는 $b<-1$이다. ----------㉠
      source_flow: 해설 p.13
      criteria:
      - 3.R2
    - id: 3b-3
      content: |
        한편 근과 계수의 관계에 의해 $-2b=\cos\theta+\sec\theta$
        주어진 범위 $-\dfrac\pi2<\theta<\dfrac\pi2$에서 $\cos\theta$와 $\sec\theta$ 모두 양수 이므로 산술평균과 기하평균의 관계에 의해
        $-2b=\cos\theta+\sec\theta\ge2\sqrt{\cos\theta\sec\theta}=2$, 즉 $b\le-1$ -----------㉡
      source_flow: 해설 p.13
      criteria:
      - 3.R3
    - id: 3b-4
      content: |
        ㉠과 ㉡에 의해 $b<-1$
        이 경우 $f^{\prime}(x)=(x-\cos\theta)(x-\sec\theta)$이고 구간 $\left(-\dfrac\pi2,\dfrac\pi2\right)$에서 $0<\cos\theta\le1$이고 $1\le\sec\theta$
        따라서 제시문 3에 의해 $f(x)$는 $x=\cos\theta$에서 극댓값을 $x=\sec\theta$에서 극솟값을 갖게 된다.
      source_flow: 해설 p.13
      criteria:
      - 3.A4
