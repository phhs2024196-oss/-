- id: 3-1
  stem: |
    [3] 함수 $y=2^{x+2}+4$의 그래프 위의 두 점 $\mathrm{A},\mathrm{B}$와 함수 $y=2^x$의 그래프 위의 두 점 $\mathrm{C},\mathrm{D}$를 꼭지점으로 하는 사각형 $\mathrm{ABCD}$는 정사각형이다. 점 $\mathrm{A},\mathrm{B},\mathrm{C},\mathrm{D}$의 $x$좌표를 각각 $a,b,c,d$라 할 때, 다음 물음에 답하시오. (단, $b<a$이고 $c<d$이다.)

    (1) $b$를 $c$로 나타내고, 이를 이용하여 정사각형 $\mathrm{ABCD}$의 한 변의 길이를 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: b=c-2; side=2*sqrt(5)
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $\mathrm{A}(a,2^{a+2}+4),\ \mathrm{B}(b,2^{b+2}+4),\ \mathrm{C}(c,2^c),\ \mathrm{D}(d,2^d)$에 대하여 $\overrightarrow{\mathrm{BA}}=\overrightarrow{\mathrm{CD}}$이므로 다음이 성립한다.
        $(a-b,\ 2^{a+2}-2^{b+2})=(d-c,\ 2^d-2^c)$
        $a-b=d-c$ $\cdots\cdots$ ①
        $2^{a+2}-2^{b+2}=2^d-2^c$ $\cdots\cdots$ ②
      source_flow: 모범답안 p.7
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        지수법칙을 사용하여 식 ②를 인수분해하면
        $2^{b+2}(2^{a-b}-1)=2^c(2^{d-c}-1)$
        식 ①에서 $a-b=d-c\ne0$이므로 $2^{a-b}-1=2^{d-c}-1\ne0$이다.
        따라서 $2^{b+2}=2^c$, $b+2=c$이다. 즉 $b=c-2$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 3-1.A2
    - id: 31b-3
      content: |
        위 결과를 이용하여 정사각형 $\mathrm{ABCD}$의 한 변의 길이 $\overline{\mathrm{BC}}$를 구하면 다음과 같다. (제시문 3)
        $\overline{\mathrm{BC}}=\sqrt{(b-c)^2+(2^{b+2}+4-2^c)^2}=\sqrt{(c-2-c)^2+(2^c+4-2^c)^2}=\sqrt{4+16}=2\sqrt5$
      source_flow: 모범답안 p.7
      criteria:
      - 3-1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 2
      evidence: $a-b=d-c$와 $2^{a+2}-2^{b+2}=2^d-2^c$를 유도했다.
      depends_on: []
      implied_ok: false
      steps:
