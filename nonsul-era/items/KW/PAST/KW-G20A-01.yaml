- id: 3-2
  stem: (2) $d$를 $c$로 나타내고, 이를 이용하여 $c$를 구하시오. [10점]
  points: 10
  depends_on:
  - 3-1
  answer:
    kind: expression
    value: d=c+4; c=log(2/15)/log(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        직선 $\mathrm{BC}$의 기울기는 $\dfrac{2^c-2^{b+2}-4}{c-b}=\dfrac{2^c-2^c-4}2=-2$이다.
        그리고 직선 $\mathrm{BC}$와 직선 $\mathrm{CD}$는 서로 수직이므로 직선 $\mathrm{CD}$의 기울기는 $\dfrac12$이다. (제시문 4를 이용)
      source_flow: 모범답안 p.8
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: 따라서 $2^d-2^c=\dfrac{d-c}2$ $\cdots\cdots$ ③
      source_flow: 모범답안 p.8
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        한편 $\overline{\mathrm{BC}}=\overline{\mathrm{CD}}$이므로 $(d-c)^2+\left(\dfrac{d-c}2\right)^2=20$, $(d-c)^2=16$이다.
        여기서 $d-c>0$이므로 $d-c=4$이다. 따라서 $d=c+4$이다.
      source_flow: 모범답안 p.8
