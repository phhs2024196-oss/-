      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        부등식 $S\ge\dfrac{3\sqrt3+2\sqrt6}4$과 넓이의 최솟값 $\dfrac{3\sqrt3+2\sqrt6}4$을 구했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A3
