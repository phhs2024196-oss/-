subparts:
- id: '1'
  stem: |
    [1] 삼각형 $\mathrm{ABC}$가 다음을 만족한다. (단, $x>0$)
    $$\angle\mathrm{ABC}=60^\circ,\qquad \overline{\mathrm{AB}}=\dfrac2x+1,\qquad \overline{\mathrm{BC}}=x+1$$
    삼각형 $\mathrm{ABC}$의 넓이의 최솟값을 구하고, 그 때 $x$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: min=(3*sqrt(3)+2*sqrt(6))/4; x=sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각형의 넓이 공식(제시문 1)으로부터
        $S=\dfrac12\left(\dfrac2x+1\right)(x+1)\sin60^\circ=\dfrac{\sqrt3}4\left(3+x+\dfrac2x\right)$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x>0$이므로 제시문 2로부터 $x+\dfrac2x\ge2\sqrt{x\cdot\dfrac2x}=2\sqrt2$가 성립하므로
        $S\ge\dfrac{\sqrt3}4(3+2\sqrt2)=\dfrac{3\sqrt3+2\sqrt6}4$이다.
        따라서 넓이의 최솟값은 $\dfrac{3\sqrt3+2\sqrt6}4$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 1.A2
    - id: 1b-3
      content: |
        이때 $x$의 값은 제시문 2로부터 $x=\dfrac2x$을 만족한다. $x^2=2$이고, $x>0$이므로 $x=\sqrt2$이다.
      source_flow: 모범답안 p.7
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
