- id: 3-1
  stem: |
    [3] 다음 두 조건을 모두 만족하는 미분가능한 함수 $f(x)$와 $g(x)$에 대하여 다음 물음에 답하시오. (단, $t>0$)

    (가) $f(x)=f(-x)$
    (나) $g'(x)=g'(-x)$, $g(0)=1$

    (1) $\displaystyle\int_{-t}^tf(x)g(x)\,dx=2\int_0^tf(x)\,dx$ 임을 증명하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $\displaystyle\int_{-t}^tf(x)g(x)\,dx=\int_{-t}^0f(x)g(x)\,dx+\int_0^tf(x)g(x)\,dx$이다.
      source_flow: 모범답안 p.12
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        위 식의 우변 중 $\displaystyle\int_{-t}^0f(x)g(x)\,dx$에 대하여 구간 $[-t,0]$에서의 적분을 $x=-s$로 치환하면 $dx=-ds$이고 구간 $[0,t]$에서의 적분으로 바뀐다. (제시문 4) 조건 (가)를 이용하면
        $\displaystyle\int_{-t}^0f(x)g(x)\,dx=-\int_t^0f(-s)g(-s)\,ds=\int_0^tf(s)g(-s)\,ds=\int_0^tf(x)g(-x)\,dx$이다.
        따라서 $\displaystyle\int_{-t}^tf(x)g(x)\,dx=\int_0^tf(x)g(-x)\,dx+\int_0^tf(x)g(x)\,dx=\int_0^tf(x)\{g(-x)+g(x)\}\,dx$이다.
      source_flow: 모범답안 p.12
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        조건 (나)에서 $g'(x)=g'(-x)$를 부정적분하면 $g(x)=-g(-x)+C$이다. ($C$는 상수)
        또한 조건 (나)의 $g(0)=1$로부터 $C=2$이므로 $g(x)+g(-x)=2$이다.
      source_flow: 모범답안 p.12
      criteria:
