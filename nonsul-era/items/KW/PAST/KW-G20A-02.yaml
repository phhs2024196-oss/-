- id: 1-3
  stem: (3) $x<0$에서 두 곡선 $y=P(x)$와 $y=\dfrac1{1+x^2}$의 교점의 개수를 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $P(x)$는 연속함수이다. $x<0$에서 $-x>0$이므로
        $P'(x)=\displaystyle\sum_{k=1}^{2020}[\log k](-k)(-x)^{k-1}<0$이다.
        따라서 제시문 1에 의해 $x<0$에서 함수 $P(x)$는 감소한다.
        그리고 $P(-1)=\displaystyle\sum_{k=1}^{2020}[\log k]=90+2\cdot900+3\cdot1021=4953$, $P(0)=0$이다.
      source_flow: 모범답안 p.11
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        $g(x)=\dfrac1{1+x^2}$라 하자. $g(x)$는 연속함수이다. $x<0$에서
        $g'(x)=\left(\dfrac1{1+x^2}\right)'=\dfrac{-2x}{(1+x^2)^2}>0$이므로 제시문 1에 의해 $g(x)$는 증가한다.
      source_flow: 모범답안 p.11
      criteria:
      - 1-3.M2
    - id: 13b-3
      content: |
        그리고 $g(-1)=\dfrac12<P(-1)$, $g(0)=1>P(0)$이다.
        따라서 오직 하나의 교점을 가지므로 교점의 개수는 한 개다.
      source_flow: 모범답안 p.11
      criteria:
      - 1-3.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 3
      evidence: $x<0$에서 함수 $P(x)$가 감소함을 보였다.
