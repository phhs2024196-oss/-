stimuli:
- label: '1'
  body: |
    함수 $f(x)$가 어떤 구간에서 미분가능하고, 이 구간의 모든 $x$에 대하여
    ㉠ $f'(x)>0$이면 $f(x)$는 이 구간에서 증가한다.
    ㉡ $f'(x)<0$이면 $f(x)$는 이 구간에서 감소한다.
- label: '2'
  body: |
    함수 $f(x)$가 구간 $[a,b]$에서 연속일 때,
    $$\dfrac d{dx}\int_a^xf(t)\,dt=f(x)\qquad(\text{단, }a<x<b)$$
- label: '3'
  body: |
    두 함수 $f(x),\ g(x)$가 미분가능하고 $f'(x),\ g'(x)$가 연속일 때,
    $$\int_a^bf(x)g'(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf'(x)g(x)\,dx$$
- label: '4'
  body: |
    구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여, 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가 구간 $[\alpha,\beta]$에서 연속이고 $a=g(\alpha)$, $b=g(\beta)$이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 다항식 $P(x)=\displaystyle\sum_{k=1}^{2020}[\log k](-x)^k$에 대하여 다음 물음에 답하시오.
    (단, $[x]$는 $x$를 넘지 않는 최대 정수이다.)

    (1) $\displaystyle\int_1^{2020}[\log t]\,dt$를 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: '4950'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $[\log t]=\begin{cases}0,&1\le t<10\\1,&10\le t<10^2\\2,&10^2\le t<10^3\\3,&10^3\le t\le2020\end{cases}$이므로 다음을 얻는다.
        $\displaystyle\int_1^{2020}[\log t]\,dt=\int_1^{10}0\,dx+\int_{10}^{10^2}1\,dx+\int_{10^2}^{10^3}2\,dt+\int_{10^3}^{2020}3\,dt$
      source_flow: 모범답안 p.11
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $=1(10^2-10)+2(10^3-10^2)+3(2020-10^3)=90+2\cdot900+3(2020-10^3)=90+1800+3060=4950$
      source_flow: 모범답안 p.11
      criteria:
      - 1-1.A2
  rubric:
