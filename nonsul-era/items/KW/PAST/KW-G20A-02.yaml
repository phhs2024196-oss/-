- id: 2-2
  stem: (2) 이차곡선의 방정식을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: x**2/4+y**2=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: 제시문 2에 의해 $f(x)f'(x)=-\dfrac x4$ $\cdots\cdots$ ①
      source_flow: 모범답안 p.12
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        조건식으로부터 $f(0)=1$이고 ①식의 좌변을 제시문 3에 의해 부분적분하면
        $\displaystyle\int_0^xf(t)f'(t)\,dt=\Big[\{f(t)\}^2\Big]_0^x-\int_0^xf'(t)f(t)\,dt=\{f(x)\}^2-1-\int_0^xf'(t)f(t)\,dt$이므로
        $\displaystyle\int_0^xf(t)f'(t)\,dt=\dfrac{\{f(x)\}^2}2-\dfrac12$이다.
      source_flow: 모범답안 p.12
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: |
        한편 ①식의 우변을 적분하면 $\displaystyle\int_0^x\left(-\dfrac t4\right)dt=-\dfrac{x^2}8$이다.
      source_flow: 모범답안 p.12
      criteria:
      - 2-2.M2
    - id: 22b-4
      content: |
        따라서 ①식의 양변의 적분 결과가 같으므로 $\dfrac{\{f(x)\}^2}2-\dfrac12=-\dfrac{x^2}8$. 그러므로 $\dfrac{y^2}2=-\dfrac{x^2}8+\dfrac12$이다.
        따라서 이차곡선의 방정식은 $\dfrac{x^2}4+y^2=1$ $\left(\text{또는 }y=\pm\sqrt{1-\dfrac{x^2}4}\right)$이다.
      source_flow: 모범답안 p.12
      criteria:
      - 2-2.A3
  rubric:
