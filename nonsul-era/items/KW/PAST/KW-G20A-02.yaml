    - id: 1-1.A2
      mark_type: A
      points: 3
      evidence: 나눈 구간으로 적분을 계산하여 $4950$을 구했다.
      depends_on:
      - 1-1.M1
      implied_ok: false
      steps:
      - 11b-2
  outcome_codes:
