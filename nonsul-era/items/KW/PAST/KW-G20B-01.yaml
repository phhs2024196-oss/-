- id: 3-1
  stem: |
    [3] 집합 $X=\{t\mid-5\le t<8,\ t\text{는 정수}\}$에 대하여 다음 물음에 답하시오.

    (1) 함수 $f:X\to X$와 $g:X\to X$는 일대일함수이고, $g\circ f=g\circ f\circ g$를 만족한다. 이때 함수 $g$의 역함수 $g^{-1}$가 존재함을 증명하고, $g^{-1}(7)$을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: proof
    value: 증명; ginv7=7
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        모든 $a\in X$에 대하여 $(g\circ f)(a)=(g\circ f\circ g)(a)$이므로 $g(f(a))=g(f(g(a)))$이다.
        그런데 $g$가 일대일함수이므로 $f(a)=f(g(a))$이다.
      source_flow: 모범답안 p.8
