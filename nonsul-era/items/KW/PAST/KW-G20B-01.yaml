- id: 2-1
  stem: |
    [2] 두 집합 $X,\ Y$에 대하여 $X\subset\mathbb R$, $Y=\{t\mid-t^2\le t\le t^2,\ t\text{는 실수}\}\cap\{t\mid0<t\le2,\ t\text{는 실수}\}$일 때, 다음 물음에 답하시오.

    (1) 집합 $X$가 유한집합이면 집합 $\mathbb R-X$는 무한집합임을 증명하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        제시문 3으로부터 $\mathbb N=\{1,2,3,\cdots\}$은 무한집합이고 $\mathbb N\subset\mathbb R$이므로 $\mathbb R$은 무한집합이다.
      source_flow: 모범답안 p.8
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        만일 $\mathbb R-X$가 유한집합이라 가정하면 $\mathbb R=X\cup(\mathbb R-X)$이고 $X$가 유한집합이므로 $\mathbb R$은 유한집합이다.
        그런데 이것은 $\mathbb R$이 무한집합이라는 사실에 모순이다. 따라서 $\mathbb R-X$는 무한집합이다.
      source_flow: 모범답안 p.8
      criteria:
      - 2-1.M2
      - 2-1.R3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 2
      evidence: $\mathbb R$이 무한집합임을 설명했다.
      depends_on: []
      implied_ok: false
      steps:
      - 21b-1
    - id: 2-1.M2
      mark_type: M
      points: 2
      evidence: $\mathbb R-X$가 유한집합이라 가정했다.
      depends_on: []
      implied_ok: false
      steps:
      - 21b-2
    - id: 2-1.R3
      mark_type: R
      points: 2
      evidence: |
        $\mathbb R=X\cup(\mathbb R-X)$이고 $X$가 유한집합이므로 $\mathbb R$은 유한집합임을 유도함으로써 모순을 이끌어냈다.
      depends_on:
      - 2-1.M1
      - 2-1.M2
      implied_ok: false
