    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $Y=\{t\mid-t^2\le t\le t^2,\ t\text{는 실수}\}\cap\{t\mid0<t\le2,\ t\text{는 실수}\}=\{t\mid1\le t\le2,\ t\text{는 실수}\}$이다.
        따라서 $Y\cap\mathbb Z=\{1,2\}$이다.
      source_flow: 모범답안 p.8
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        그러므로 $Y\cap\mathbb Z$는 유한집합이고 (1)의 결과에 의하여 $\mathbb R-(Y\cap\mathbb Z)$는 무한집합이다.
        그런데 $(\mathbb R-Y)\cup(\mathbb R-\mathbb Z)$는 $\mathbb R-(Y\cap\mathbb Z)$이므로 $(\mathbb R-Y)\cup(\mathbb R-\mathbb Z)$는 무한집합이다.
      source_flow: 모범답안 p.8
      criteria:
