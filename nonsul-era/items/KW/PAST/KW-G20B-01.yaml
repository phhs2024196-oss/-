stimuli:
- label: '1'
  body: 모든 정수들의 집합을 $\mathbb Z$, 모든 실수들의 집합을 $\mathbb R$로 나타낸다.
- label: '2'
  body: |
    다항식 $A$를 다항식 $B\ (B\ne0)$로 나누었을 때의 몫을 $Q$, 나머지를 $R$라고 하면 $A=BQ+R$로 나타낼 수 있다. 이때, $R$의 차수는 $B$의 차수보다 낮다. 특히, $R=0$일 때, $A$는 $B$로 나누어떨어진다고 한다.
- label: '3'
  body: |
    원소가 유한개인 집합을 유한집합이라 하고, 원소가 무한히 많은 집합을 무한집합이라고 한다. 자연수의 집합 $\mathbb N=\{1,2,3,\cdots\}$은 무한집합이다.
- label: '4'
  body: |
    두 집합 $A,B$에 대하여 $A$에는 속하지만 $B$에는 속하지 않는 모든 원소로 이루어진 집합을 $A$에 대한 $B$의 차집합이라 하고, 기호 $A-B$로 나타낸다.
- label: '5'
  body: 함수 $f:X\to Y$가 일대일함수이고 치역과 공역이 같으면 함수 $f$를 일대일 대응이라고 한다.
- label: '6'
  body: |
    두 함수 $f:X\to W,\ g:W\to Y$의 합성함수 $g\circ f$는 $g\circ f:X\to Y$, $(g\circ f)(x)=g(f(x))$이다.
- label: '7'
  body: |
    어떤 명제가 참임을 증명할 때, 결론을 부정하면 가정에 모순되거나 이미 참이라고 알려진 사실에 모순됨을 유도하여 주어진 명제가 참임을 증명하는 증명방법을 귀류법이라고 한다.
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 다항식 $f(x)=\displaystyle\sum_{n=1}^{100}a_nx^n$에 대하여 다음 물음에 답하시오. (단, $a_n$은 실수)

    (1) 다항식 $g(x)=\displaystyle\sum_{n=1}^5x^n$에 대하여 $f(x)=\{g(x)\}^{20}$일 때, $\displaystyle\sum_{n=1}^{50}a_{2n}$을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: (5**20+1)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $g(1)=\displaystyle\sum_{n=1}^51^n=5$이고 $f(1)=\displaystyle\sum_{n=1}^{100}a_n1^n=\sum_{n=1}^{100}a_n$이다.
        $f(1)=\{g(1)\}^{20}=5^{20}$이므로 $\displaystyle\sum_{n=1}^{100}a_n=5^{20}$이다.
      source_flow: 모범답안 p.8
      criteria:
      - 1-1.M1
      - 1-1.M2
    - id: 11b-2
      content: |
        한편 $g(-1)=\displaystyle\sum_{n=1}^5(-1)^n=-1$이고 $f(-1)=\displaystyle\sum_{n=1}^{100}a_n(-1)^n$이다.
        $f(-1)=\{g(-1)\}^{20}=1$이므로 $\displaystyle\sum_{n=1}^{100}a_n(-1)^n=1$이다.
      source_flow: 모범답안 p.8
      criteria:
      - 1-1.M1
      - 1-1.M2
    - id: 11b-3
      content: |
        그런데 $2\displaystyle\sum_{n=1}^{50}a_{2n}=\sum_{n=1}^{100}a_n+\sum_{n=1}^{100}a_n(-1)^n=5^{20}+1$이므로 $\displaystyle\sum_{n=1}^{50}a_{2n}=\dfrac12(5^{20}+1)$이다.
      source_flow: 모범답안 p.8
      criteria:
      - 1-1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: $g(1)=5$, $g(-1)=-1$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
      - 11b-2
    - id: 1-1.M2
      mark_type: M
      points: 2
      evidence: $f(1)=5^{20}$, $f(-1)=1$을 구했다.
      depends_on:
      - 1-1.M1
      implied_ok: false
      steps:
      - 11b-1
      - 11b-2
    - id: 1-1.A3
      mark_type: A
      points: 4
      evidence: $\displaystyle\sum_{n=1}^{50}a_{2n}=\dfrac12(5^{20}+1)$을 구했다.
      depends_on:
      - 1-1.M2
      implied_ok: false
      steps:
      - 11b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) 다항식 $f(x)$가 $x^2+x+1$로 나누어떨어지고, 다음을 만족할 때, $a_{100}$을 구하시오. [10점]
    $$\sum_{n=1}^{33}a_{3n}=\sum_{n=1}^{33}a_{3n-2}=\sum_{n=1}^{33}a_{3n-1}$$
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        다항식 $f(x)$가 $x^2+x+1$로 나누어떨어지므로 $f(x)=(x^2+x+1)Q$인 다항식 $Q$가 존재한다.
        $x^2+x+1=0$을 만족하는 한 허근을 $w$라 하면 $w^2+w+1=0$이고 $f(w)=0$이다.
        한편 $w^3-1=(w-1)(w^2+w+1)=0$이므로 $w^3=1$이다.
      source_flow: 모범답안 p.8
      criteria:
      - 1-2.M1
      - 1-2.M2
    - id: 12b-2
      content: |
        따라서 $f(w)=\displaystyle\sum_{n=1}^{100}a_nw^n=(a_3+a_1w+a_2w^2)+(a_6+a_4w+a_5w^2)+\cdots+(a_{99}+a_{97}w+a_{98}w^2)+a_{100}w$
        $=\displaystyle\sum_{n=1}^{33}a_{3n}+\sum_{n=1}^{33}a_{3n-2}w+\sum_{n=1}^{33}a_{3n-1}w^2+a_{100}w$
      source_flow: 모범답안 p.8
      criteria:
      - 1-2.M3
    - id: 12b-3
      content: |
        이고 가정에 의하여 $\displaystyle\sum_{n=1}^{33}a_{3n}=\sum_{n=1}^{33}a_{3n-2}=\sum_{n=1}^{33}a_{3n-1}$이므로
        $f(w)=\displaystyle\sum_{n=1}^{33}a_{3n}(1+w+w^2)+a_{100}w=a_{100}w$이다.
        $f(w)=0$이므로 $a_{100}w=0$이고 $w\ne0$이므로 $a_{100}=0$이다.
      source_flow: 모범답안 p.8
      criteria:
      - 1-2.A4
      - 1-2.A5
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: $f(x)=(x^2+x+1)Q$인 다항식 $Q$가 존재함을 언급했다.
      depends_on: []
      implied_ok: false
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 2
      evidence: $w^3=1$을 구했다.
      depends_on:
      - 1-2.M1
      implied_ok: false
      steps:
      - 12b-1
    - id: 1-2.M3
      mark_type: M
      points: 2
      evidence: |
        $f(w)=\displaystyle\sum_{n=1}^{33}a_{3n}+\sum_{n=1}^{33}a_{3n-2}w+\sum_{n=1}^{33}a_{3n-1}w^2+a_{100}w$를 구했다.
      depends_on:
      - 1-2.M2
      implied_ok: false
      steps:
      - 12b-2
    - id: 1-2.A4
      mark_type: A
      points: 2
      evidence: $f(w)=a_{100}w=0$을 구했다.
      depends_on:
      - 1-2.M3
      implied_ok: false
      steps:
      - 12b-3
    - id: 1-2.A5
      mark_type: A
      points: 2
      evidence: $a_{100}=0$을 구했다.
      depends_on:
      - 1-2.A4
      implied_ok: false
      steps:
      - 12b-3
