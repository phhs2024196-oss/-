      mark_type: M
      points: 2
      evidence: $f'(x)=x\sin x=0$의 해 $x=0,\ \pm\pi,\ \pm2\pi$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 4
