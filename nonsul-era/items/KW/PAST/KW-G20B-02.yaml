    - id: 12b-2
      content: |
        $\pi<x<\dfrac{3\pi}2$일 때 $\sin x<0$, $\cos x<0$이다. 따라서 이 구간에서 항상 $f''(x)<0$이므로 제시문 2에 의하여 변곡점은 존재하지 않는다.
