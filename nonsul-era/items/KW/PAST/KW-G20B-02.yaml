- id: 2-1
  stem: |
    [2] 자연수 $n$에 대하여 곡선 $y=(\ln x)^n$과 $x$축 및 직선 $x=e$로 둘러싸인 도형의 넓이를 $S_n$이라 할 때, 다음 물음에 답하시오.

    (1) $S_1$을 구하시오. [5점]
  points: 5
  depends_on: []
