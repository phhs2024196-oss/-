- id: 2-2
  stem: (2) $S_{n+1}+(n+1)S_n$을 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: e
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        제시문 5의 부분적분으로 적분을 계산하면
        $S_{n+1}=\displaystyle\int_1^e(\ln x)^{n+1}dx=\Big[x(\ln x)^{n+1}\Big]_1^e-\int_1^e(n+1)(\ln x)^n\,dx$
        $=\Big[x(\ln x)^{n+1}\Big]_1^e-(n+1)\displaystyle\int_1^e(\ln x)^n\,dx=e-(n+1)S_n$
        따라서 $S_{n+1}+(n+1)S_n=e$이다.
