    - id: 1-3.A3
      mark_type: A
      points: 2
      evidence: $g'(x)=1$을 만족하는 $x$가 $(\pi,2\pi)$에 존재한다는 것을 보였다.
      depends_on:
      - 1-3.M1
      - 1-3.M2
      implied_ok: false
