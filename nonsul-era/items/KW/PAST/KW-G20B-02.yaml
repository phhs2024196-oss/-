stimuli:
- label: '1'
  body: |
    함수 $f(x)$가 어떤 구간에서 미분가능하고, 이 구간의 모든 $x$에 대하여
    ㉠ $f'(x)>0$이면 곡선 $y=f(x)$는 이 구간에서 증가한다.
    ㉡ $f'(x)<0$이면 곡선 $y=f(x)$는 이 구간에서 감소한다.
- label: '2'
  body: |
    함수 $f(x)$가 어떤 구간에서
    ㉠ $f''(x)>0$이면 곡선 $y=f(x)$는 이 구간에서 아래로 볼록하다.
    ㉡ $f''(x)<0$이면 곡선 $y=f(x)$는 이 구간에서 위로 볼록하다.
    곡선 $y=f(x)$ 위의 점 $(a,f(a))$에 대하여 $x=a$의 좌우에서 곡선의 볼록 상태가 바뀔 때, 이 점을 곡선 $y=f(x)$의 변곡점이라고 한다.
- label: '3'
  body: |
    두 함수 $y=f(u),\ u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$는 미분가능하며, 그 도함수는
    $$\dfrac{dy}{dx}=\dfrac{dy}{du}\cdot\dfrac{du}{dx}\quad\text{또는}\quad y'=f'(g(x))g'(x)$$
- label: '4'
  body: |
    (평균값 정리) 함수 $f(x)$가 닫힌 구간 $[a,b]$에서 연속이고 열린 구간 $(a,b)$에서 미분가능할 때,
    $$\dfrac{f(b)-f(a)}{b-a}=f'(c)\quad(a<c<b)$$
    인 $c$가 적어도 하나 존재한다.
- label: '5'
  body: |
    두 함수 $f(x),\ g(x)$가 미분가능하고, $f'(x),\ g'(x)$가 연속일 때
    $$\int_a^bf(x)g'(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf'(x)g(x)\,dx$$
- label: '6'
  body: |
    구간 $[a,b]$의 임의의 점 $x$에서 $x$축에 수직인 평면으로 자를 때 생기는 단면의 넓이가 $S(x)$인 입체도형의 부피 $V$는
    $$V=\int_a^bS(x)\,dx\quad(\text{단, }S(x)\text{는 구간 }[a,b]\text{에서 연속})$$
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 함수 $f(x)=\sin x-x\cos x\ \ (-2\pi\le x\le2\pi)$에 대하여 다음 물음에 답하시오.

    (1) 함수 $f(x)$의 최댓값과 최솟값을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: min=-2*pi; max=2*pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        함수 $f(x)$는 $(-2\pi,2\pi)$에서 미분가능하며 $f'(x)=x\sin x$이다.
        따라서 $f'(x)=0$의 해는 $x=0,\ \pm\pi,\ \pm2\pi$이다.
      source_flow: 모범답안 p.12
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        제시문 1에 의하여 구간 $[-2\pi,2\pi]$에서 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.
        $x=-2\pi$에서 $f(-2\pi)=2\pi$, $f'<0$ 구간으로 감소하여 $x=-\pi$에서 $f(-\pi)=-\pi$, 이후 $f'>0$ 구간에서 증가하여 $x=0$에서 $f(0)=0$, $x=\pi$에서 $f(\pi)=\pi$, 이후 $f'<0$ 구간에서 감소하여 $x=2\pi$에서 $f(2\pi)=-2\pi$이다.
      source_flow: 모범답안 p.12
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        위의 표로부터 $f(x)$는 $x=-2\pi$일 때 최대이고 최댓값은 $2\pi$, $x=2\pi$일 때 최소이고 최솟값은 $-2\pi$이다.
      source_flow: 모범답안 p.12
      criteria:
      - 1-1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
