    - id: 23b-3
      content: |
        (1)과 (2)에서 $S_1=1$, $S_2+2S_1=e$이므로 $S_2=e-2S_1=e-2$이다. 따라서 입체의 부피는 $V=\dfrac\pi8(e-2)$이다.
      source_flow: 모범답안 p.13
      criteria:
      - 2-3.M2
