  stem: |
    (3) 곡선 $y=\ln x$와 $x$축 및 직선 $x=e$로 둘러싸인 도형을 밑면으로 하는 입체도형을 $x$축에 수직인 평면으로 자른 단면이 반원일 때, 이 입체의 부피 $V$를 구하시오. [8점]
