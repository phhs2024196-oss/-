      depends_on:
      - 1-1.M1
      implied_ok: false
      steps:
      - 11b-2
    - id: 1-1.A3
      mark_type: A
      points: 2
      evidence: 최댓값 $2\pi$, 최솟값 $-2\pi$를 구했다.
      depends_on:
      - 1-1.M2
      implied_ok: false
      steps:
      - 11b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) 구간 $\left(\pi,\dfrac{3\pi}2\right)$에서 곡선 $y=f(x)$의 변곡점이 존재하는지를 판정하고 그 이유를 설명하시오. [6점]
  points: 6
