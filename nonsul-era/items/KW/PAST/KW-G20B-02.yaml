        $S_1=\displaystyle\int_1^e\ln x\,dx=\Big[x\ln x\Big]_1^e-\int_1^ex\left(\dfrac1x\right)dx=e-\Big[x\Big]_1^e=1$
      source_flow: 모범답안 p.12
      criteria:
