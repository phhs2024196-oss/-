- id: 1-3
  stem: |
    (3) 함수 $g(x)=(f\circ f)(x)$에 대하여 $g'(x)=1$을 만족하는 $x$가 구간 $(\pi,2\pi)$에 적어도 하나 존재함을 보이시오. [7점]
  points: 7
  depends_on:
  - 1-1
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        함수 $f(x)$는 미분가능하므로 제시문 3에 의하여 함수 $g(x)$는 미분가능하다.
        $g(x)$는 구간 $[\pi,2\pi]$에서 연속이고 구간 $(\pi,2\pi)$에서 미분가능하므로 평균값 정리(제시문 4)에 의하여
        $\dfrac{g(2\pi)-g(\pi)}{2\pi-\pi}=g'(c),\ \ \pi<c<2\pi$를 만족하는 $c$가 적어도 하나 존재한다.
      source_flow: 모범답안 p.12
      criteria:
      - 1-3.M2
    - id: 13b-2
      content: |
        그런데 $g(2\pi)=f(f(2\pi))=f(-2\pi)=2\pi$, $g(\pi)=f(f(\pi))=f(\pi)=\pi$이므로 $g'(c)=\dfrac{2\pi-\pi}{\pi}=1$을 만족하는 $c$가 구간 $(\pi,2\pi)$에 적어도 하나 존재한다.
        따라서 $g'(x)=1$을 만족하는 $x$가 구간 $(\pi,2\pi)$에 적어도 하나 존재한다.
      source_flow: 모범답안 p.12
      criteria:
      - 1-3.M1
      - 1-3.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 2
      evidence: $g(2\pi)=2\pi$, $g(\pi)=\pi$를 구했다.
      depends_on: []
