  solutions:
  - id: S23-B
    audience: B
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        입체도형의 단면의 넓이를 $S(x)$라고 하면, 단면은 지름이 $\ln x$인 반원이므로 $S(x)=\dfrac12\pi\left(\dfrac{\ln x}2\right)^2$이다.
      source_flow: 모범답안 p.12
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: |
        제시문 6에 의하여 입체도형의 부피 $V$는 다음과 같다.
        $V=\displaystyle\int_1^eS(x)\,dx=\int_1^e\dfrac12\pi\left(\dfrac{\ln x}2\right)^2dx=\dfrac\pi8\int_1^e(\ln x)^2dx=\dfrac\pi8S_2$
