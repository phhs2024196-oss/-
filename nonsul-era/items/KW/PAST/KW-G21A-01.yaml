      mark_type: M
      points: 4
      evidence: 수직 조건 $ab=5$와 평행 조건 $a-b=1$로 $a,b$에 대한 연립방정식을 세웠다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: $a^2+b^2=11$을 구했다.
      depends_on:
      - 1-1.M1
