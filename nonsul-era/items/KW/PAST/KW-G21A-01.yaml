  solutions:
  - id: S22-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $n=1$일 때, $\displaystyle\lim_{t\to\infty}t^nw(t)=\lim_{t\to\infty}\sqrt{1+\dfrac1{t^2}}=1$이다.
        $n=k\ (k\ge2)$일 때, $\displaystyle\lim_{t\to\infty}t^nw(t)=\lim_{t\to\infty}t^{k-1}\sqrt{1+\dfrac1{t^2}}=\infty$이다.
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: 그러므로 구하는 자연수 $n=1$이다.
      criteria:
      - 2-2.A2
