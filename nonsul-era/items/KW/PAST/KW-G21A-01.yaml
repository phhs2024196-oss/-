  solutions:
  - id: S12-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 12b-1
      content: 직선 $ax+2y+4=0$은 $a$의 값에 관계없이 점 $A(0,-2)$를 지나고, 직선 $2bx-5y+10=0$은 $b$의 값에 관계없이 점 $B(0,2)$를 지난다. 그리고 두 직선이 서로 수직으로 만나므로 두 직선의 교점은 $\overline{AB}$를 지름으로 하는 원 위에 놓인다.
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: 두 직선의 교점을 $C$라 하면 삼각형 $ABC$는 문제에서 주어진 삼각형이 된다. $\overline{AB}$를 밑변으로 하는 삼각형 $ABC$의 넓이는 교점 $C$로부터 $\overline{AB}$까지, 즉 $y$축까지의 거리로 결정된다. 교점 $C$의 좌표가 $(2,0)$일 때 $\overline{AB}$까지의 거리가 최대가 되고, 따라서 삼각형 $ABC$의 넓이의 최댓값은 $\dfrac12\times4\times2=4$이다.
      criteria:
      - 1-2.A2
