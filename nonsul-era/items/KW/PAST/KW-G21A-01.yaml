- id: 2-1
  stem: |
    [2] 좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 위치 $(x,y)$가
    $$x=\frac{\cos t}{t},\qquad y=\frac{\sin t}{t}\qquad(t\ge\pi)$$
    이다. 시각 $t$에서의 점 $\mathrm{P}$의 속도를 $v(t)=(v_x,v_y)$, 속도의 크기를 $w(t)$라 할 때, 물음에 답하시오.

    (1) $v(t)$와 $w(t)$를 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: expression
    value: vx=-sin(t)/t-cos(t)/t**2; vy=cos(t)/t-sin(t)/t**2; w=sqrt(1+1/t**2)/t
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $v_x=\dfrac{dx}{dt}=\dfrac{-t\sin t-\cos t}{t^2},\ v_y=\dfrac{dy}{dt}=\dfrac{t\cos t-\sin t}{t^2}$ ……①
        속도는 $v(t)=\left(-\dfrac{\sin t}{t}-\dfrac{\cos t}{t^2},\ \dfrac{\cos t}{t}-\dfrac{\sin t}{t^2}\right)$이다.
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $w(t)^2=v_x^2+v_y^2=\dfrac{t^2\sin^2t+\cos^2t+2t\sin t\cos t}{t^4}+\dfrac{t^2\cos^2t+\sin^2t-2t\sin t\cos t}{t^4}=\dfrac{t^2+1}{t^4}=\dfrac1{t^2}+\dfrac1{t^4}$
        속도의 크기는 $w(t)=\dfrac1t\sqrt{1+\dfrac1{t^2}}$이다.
      criteria:
      - 2-1.A2
