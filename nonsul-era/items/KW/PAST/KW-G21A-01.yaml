stimuli:
- label: '1'
  body: |
    좌표평면 위에서 속도와 속도의 크기
    좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 좌표 $(x,y)$가 $x=f(t),\ y=g(t)$로 나타내어질 때, 점 $\mathrm{P}$의 속도와 속도의 크기는 다음과 같다.
    $$\text{속도: }(f^{\prime}(t),g^{\prime}(t)),\qquad \text{속도의 크기: }\sqrt{\{f^{\prime}(t)\}^2+\{g^{\prime}(t)\}^2}$$
- label: '2'
  body: |
    사잇값의 정리
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면, $f(a)$와 $f(b)$ 사이에 있는 임의의 실수 $k$에 대하여 다음을 만족하는 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
    $$f(c)=k$$
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 직선 $ax+2y+4=0$이 직선 $2bx-5y+10=0$과 수직이고 직선 $(b+1)x+2y-7=0$과 평행일 때, 물음에 답하시오. (단, $a$, $b$는 실수)

    (1) $a^2+b^2$의 값을 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: '11'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    source_flow: 해설 p.7
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $ax+2y+4=0$ ……①, $2bx-5y+10=0$ ……②, $(b+1)x+2y-7=0$ ……③이라 하자.
        ①⊥②이므로 $a\cdot(2b)+2\cdot(-5)=0$, 즉 $ab=5$이다.
        ①//③이므로 $\dfrac a2=\dfrac{b+1}2$, 즉 $a-b=1$이다.
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: 따라서 구하는 값은 $a^2+b^2=(a-b)^2+2ab=1^2+2\cdot5=11$이다.
      criteria:
      - 1-1.A2
  rubric:
