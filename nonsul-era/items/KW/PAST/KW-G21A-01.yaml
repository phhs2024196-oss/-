- id: 2-3
  stem: (3) 점 $\mathrm{P}$에서 $x$축에 내린 수선의 발을 $\mathrm{Q}$라 하면, 점 $\mathrm{Q}$는 $x$축 위를 움직이는 직선 운동을 한다. 이때 시각 $t=\pi$에서 $t=3\pi$까지 점 $\mathrm{Q}$가 움직이는 방향을 최소한 2번 바꿈을 보이시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: proof
    value: $u(\pi)>0>u(2\pi)$, $u(3\pi)>0$이고 $u$가 연속이므로 사잇값의 정리로 $(\pi,2\pi)$, $(2\pi,3\pi)$에서 각각 $u=0$인 시각이 존재하여 방향이 최소 2번 바뀐다.
    equivalents: []
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 23b-1
      content: 시각 $t$에서의 점 $\mathrm{Q}$의 속도를 $u(t)$라 하면 식 ①로부터 $u(t)=v_x=-\dfrac{\sin t}{t}-\dfrac{\cos t}{t^2}$이고 $u(t)$는 $t\ge\pi$에서 연속함수이다.
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: $u(\pi)=\dfrac1{\pi^2}>0$이고 $u(2\pi)=-\dfrac1{4\pi^2}<0$이므로 사잇값의 정리로부터 운동 방향이 바뀌는 $u(t_1)=0$인 시각 $t_1$이 $\pi$와 $2\pi$ 사이에 존재한다.
      criteria:
      - 2-3.M2
    - id: 23b-3
      content: |
        또 $u(3\pi)=\dfrac1{9\pi^2}>0$이므로 사잇값의 정리로부터 운동 방향이 바뀌는 $u(t_2)=0$인 시각 $t_2$가 $2\pi$와 $3\pi$ 사이에 존재한다.
        그러므로 시각 $t=\pi$에서 $t=3\pi$까지 점 $\mathrm{Q}$는 움직이는 방향을 최소한 2번 바꾼다.
      criteria:
      - 2-3.M3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-3.M1
      mark_type: M
      points: 3
      evidence: 사잇값의 정리를 적용했다.
      depends_on: []
