- id: 3-1
  stem: |
    [3] 삼차방정식 $x^3=1$의 한 허근 $\omega$가 다음 식을 만족시킬 때, 물음에 답하시오. (단, $a$, $b$는 실수)
    $$\frac{\omega}{3+\omega}=a+b\omega$$

    (1) 주어진 식을 만족하는 $a$, $b$의 값을 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: a=1/7; b=3/7
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    source_flow: 해설 p.9
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $x^3-1=(x-1)(x^2+x+1)=0$이므로 $\omega$는 $\omega^2+\omega+1=0$ ……①을 만족한다.
        주어진 식의 양변에 $3+\omega$를 곱해 정리하면 $\omega=(a+b\omega)(3+\omega)=3a+(a+3b)\omega+b\omega^2$, 즉 $b\omega^2+(a+3b-1)\omega+3a=0$ ……②이다.
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: 식 ①을 식 ②에 대입하고 정리하면 $b(-\omega-1)+(a+3b-1)\omega+3a=(a+2b-1)\omega+3a-b=0$이다. $\omega$가 허근이므로 $a+2b=1,\ 3a-b=0$이고, 이를 풀면 $a=\dfrac17,\ b=\dfrac37$이다.
      criteria:
      - 3-1.A2
