- id: 2-2
  stem: |
    (2) 다음 이차방정식의 근을 구하시오. (단, $a$, $b$는 (1)에서 구한 상수) [6점]
    $$\left(\int_1^bf(t)\,dt\right)x^2-\frac12x-\frac54\int_a^b\frac{f(t)}{\ln t}\,dt=0$$
  points: 6
  depends_on: []
  answer:
    kind: set
    value: -5/9, 1
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    source_flow: 해설 p.13
    method_no: 1
    steps:
    - id: 22b-1
      content: 정적분 $\displaystyle\int_1^bf(t)\,dt$에서 $\ln t=s$로 치환하면 $\displaystyle\int_1^bf(t)\,dt=\int_1^{e^{\frac32}}\frac{\ln t}t\,dt=\int_0^{\frac32}s\,ds=\left[\frac{s^2}2\right]_0^{\frac32}=\frac98$이다.
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: $\displaystyle\int_a^b\frac{f(t)}{\ln t}\,dt=\int_e^{e^{\frac32}}\frac1t\,dt=\Big[\ln\lvert t\rvert\Big]_e^{e^{\frac32}}=\frac12$이다.
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: 이로부터 $\dfrac98x^2-\dfrac12x-\dfrac58=\dfrac18(9x^2-4x-5)=\dfrac18(x-1)(9x+5)=0$이다. 따라서 이차방정식의 근은 $x=-\dfrac59,\ 1$이다.
      criteria:
      - 2-2.A3
  rubric:
