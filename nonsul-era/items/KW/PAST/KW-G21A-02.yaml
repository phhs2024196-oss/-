- id: 2-1
  stem: |
    [2] 함수 $f(x)=\dfrac{\ln x}{x}$에 대하여 물음에 답하시오.

    (1) 함수 $f(x)$는 $x=a$에서 극대이고, 곡선 $y=f(x)$의 변곡점이 점 $(b,f(b))$일 때, 상수 $a$, $b$를 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: a=e; b=exp(3/2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    source_flow: 해설 p.12~13
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $f(x)=\dfrac{\ln x}x$, $f^{\prime}(x)=\dfrac{1-\ln x}{x^2}$이므로 $f^{\prime}(x)=0$에서 $x=e$이다.
        증감표에서 $x=e$의 좌우에서 $f^{\prime}(x)$의 부호가 $+$에서 $-$로 바뀌므로 $x=e$에서 극대이다.
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $f^{\prime\prime}(x)=\dfrac{-x-2x(1-\ln x)}{x^4}=-\dfrac{3-2\ln x}{x^3}$이므로 $f^{\prime\prime}(x)=0$에서 $x=e^{\frac32}$이다.
        증감표에서 $x=e^{\frac32}$의 좌우에서 $f^{\prime\prime}(x)$의 부호가 $-$에서 $+$로 바뀌므로 곡선 $y=f(x)$의 변곡점은 $\left(e^{\frac32},f\left(e^{\frac32}\right)\right)$이다. 따라서 $a=e,\ b=e^{\frac32}$이다.
      criteria:
      - 2-1.M2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 3
      evidence: $f^{\prime}(x)=0$에서 $x=e$를 구하고 극대임을 설명했다.
      depends_on: []
