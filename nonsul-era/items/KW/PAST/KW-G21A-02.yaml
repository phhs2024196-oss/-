    - id: 2-1.M2
      mark_type: M
      points: 3
      evidence: $f^{\prime\prime}(x)=0$에서 $x=e^{\frac32}$를 구하고 변곡점임을 설명했다.
      depends_on: []
      implied_ok: false
      steps:
      - 21b-2
