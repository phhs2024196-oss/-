  misconceptions: []
- id: 1-2
  stem: (2) 함수 $g(a)$의 최솟값을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: -2*sqrt(6)/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    source_flow: 해설 p.12
    method_no: 1
    steps:
    - id: 12b-1
      content: 함수 $g(a)$는 연속함수이고, $a\le0$에서 감소하고 $a\ge1$에서 증가하므로 $0\le a\le1$에서 최솟값을 갖는다.
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: $g(a)=\dfrac{a^3}2-a$는 $0<a<1$에서 미분가능하고 $g^{\prime}(a)=\dfrac32a^2-1=0$에서 $a=\dfrac{\sqrt6}3$이다. 증감표에서 $a=0$에서 $a=\dfrac{\sqrt6}3$까지 $g^{\prime}(a)<0$(감소), $a=\dfrac{\sqrt6}3$에서 극소, 이후 $g^{\prime}(a)>0$(증가)이고 $g(0)=0$, $g(1)=-\dfrac12$이다.
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: 위의 증감표에 의해 함수 $g(a)$의 최솟값은 $g\left(\dfrac{\sqrt6}3\right)=\dfrac12\cdot\dfrac23\cdot\dfrac{\sqrt6}3-\dfrac{\sqrt6}3=-\dfrac{2\sqrt6}9$이다.
      criteria:
      - 1-2.A3
