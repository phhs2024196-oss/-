  stem: (3) 함수 $f(x)$를 이용하여 $\log_23$과 $\sqrt{1.5}$의 대소를 비교하시오. [11점]
  points: 11
  depends_on: []
  answer:
    kind: value
    value: log2(3) > sqrt(1.5)
    equivalents: []
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    source_flow: 해설 p.13
    method_no: 1
    steps:
    - id: 23b-1
      content: $\log_23-\sqrt{1.5}=\dfrac{\ln3}{\ln2}-\dfrac{\sqrt3}{\sqrt2}=\dfrac{2\sqrt3}{\ln2}\left(\dfrac{\ln\sqrt3}{\sqrt3}-\dfrac{\ln\sqrt2}{\sqrt2}\right)$이다. $\dfrac{2\sqrt3}{\ln2}>0$이므로 대소의 변화는 없다.
      criteria:
      - 2-3.M1
      - 2-3.M2
    - id: 23b-2
      content: (1)로부터 $f(x)$는 $x=e$에서 극대이고 $x<e$에서 증가($f^{\prime}(x)>0$), $x>e$에서 감소하는 증감표를 얻는다. $\sqrt2<\sqrt3<e$이므로 증감표에 의해 $f(\sqrt3)-f(\sqrt2)>0$이다.
      criteria:
      - 2-3.A3
    - id: 23b-3
      content: $f(\sqrt3)-f(\sqrt2)=\dfrac{\ln\sqrt3}{\sqrt3}-\dfrac{\ln\sqrt2}{\sqrt2}=\dfrac{\ln2}{2\sqrt3}(\log_23-\sqrt{1.5})>0$이므로 따라서 $\log_23>\sqrt{1.5}$이다.
      criteria:
      - 2-3.A3
