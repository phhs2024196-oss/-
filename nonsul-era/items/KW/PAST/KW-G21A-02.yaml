stimuli:
- label: '1'
  body: |
    함수의 극대와 극소의 판정
    함수 $f(x)$가 미분가능하고 $f^{\prime}(a)=0$일 때, $x=a$의 좌우에서 $f^{\prime}(x)$의 부호가
    양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고 극댓값 $f(a)$를 갖는다.
    음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고 극솟값 $f(a)$를 갖는다.
- label: '2'
  body: |
    로그의 밑의 변환
    $a>0,\ a\ne1,\ b>0,\ c>0,\ c\ne1$일 때,
    $$\log_ab=\frac{\log_cb}{\log_ca}$$
- label: '3'
  body: |
    변곡점의 판정
    연속인 이계도함수를 갖는 함수 $f(x)$에서 $f^{\prime\prime}(a)=0$이고, $x=a$의 좌우에서 $f^{\prime\prime}(x)$의 부호가 바뀌면 점 $(a,f(a))$는 곡선 $y=f(x)$의 변곡점이다.
- label: '4'
  body: |
    치환적분법을 이용한 정적분
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g^{\prime}(t)$가 $a=g(\alpha),\ b=g(\beta)$일 때 $\alpha,\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g^{\prime}(t)\,dt$$
- label: '5'
  body: |
    부분적분법을 이용한 정적분
    미분가능한 두 함수 $f(x)$, $g(x)$에 대하여 $f^{\prime}(x)$, $g^{\prime}(x)$가 닫힌구간 $[a,b]$에서 연속일 때
    $$\int_a^bf(x)g^{\prime}(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf^{\prime}(x)g(x)\,dx$$
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] $a$는 실수이고 $0\le x\le1$에서 함수 $f(x)=-x^3+\dfrac32ax^2-a$의 최댓값을 $g(a)$라 할 때, 물음에 답하시오.

    (1) 함수 $g(a)$를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: g=Piecewise((-a,a<=0),(a**3/2-a,(a>0)&(a<1)),(a/2-1,a>=1))
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    source_flow: 해설 p.12
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $f^{\prime}(x)=-3x^2+3ax=-3x(x-a)$이다.
        (ⅰ) $a\le0$이면 $0\le x\le1$에서 $f^{\prime}(x)\le0$이다. 따라서 $g(a)=f(0)=-a$이다.
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: (ⅱ) $0<a<1$이면 증감표에서 $x=0$에서 $x=a$까지 $f^{\prime}(x)>0$(증가), $x=a$에서 극대, $x=a$에서 $x=1$까지 $f^{\prime}(x)<0$(감소)이고 $f(0)=-a$, $f(1)=\dfrac a2-1$이다. 따라서 $g(a)=f(a)=\dfrac{a^3}2-a$이다.
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        (ⅲ) $a\ge1$이면 $0\le x\le1$에서 $f^{\prime}(x)\ge0$이다. 따라서 $g(a)=f(1)=\dfrac a2-1$이다.
        (ⅰ), (ⅱ), (ⅲ)에 의하여 $g(a)=\begin{cases}-a&(a\le0)\\ \dfrac{a^3}2-a&(0<a<1)\\ \dfrac a2-1&(a\ge1)\end{cases}$이다.
      criteria:
      - 1-1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: $a\le0$일 때 $g(a)=-a$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 4
      evidence: $0<a<1$일 때 $g(a)=\dfrac{a^3}2-a$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-2
    - id: 1-1.A3
      mark_type: A
      points: 3
      evidence: $a\ge1$일 때 $g(a)=\dfrac a2-1$을 구했다.
      depends_on:
      - 1-1.M1
      - 1-1.M2
      implied_ok: false
      steps:
      - 11b-3
