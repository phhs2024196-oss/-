stimuli:
- label: '1'
  body: |
    사인법칙
    삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이를 $R$라고 하면
    $$\frac a{\sin A}=\frac b{\sin B}=\frac c{\sin C}=2R$$
- label: '2'
  body: |
    코사인법칙
    삼각형 $\mathrm{ABC}$에서
    $$a^2=b^2+c^2-2bc\cos A$$
    $$b^2=c^2+a^2-2ca\cos B$$
    $$c^2=a^2+b^2-2ab\cos C$$
- label: '3'
  body: |
    곡선과 $y$축 사이의 넓이
    함수 $h(y)$가 닫힌구간 $[c,d]$에서 연속일 때, 곡선 $x=h(y)$와 $y$축 및 두 직선 $y=c,\ y=d$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_c^d\lvert h(y)\rvert\,dy$$
- label: '4'
  body: |
    이차방정식의 근의 판별
    계수가 실수인 이차방정식 $ax^2+bx+c=0\ (a\ne0)$에서 $D=b^2-4ac$라고 할 때,
    $D>0$이면 서로 다른 두 실근을 갖고, 서로 다른 두 실근을 가지면 $D>0$이다.
    $D=0$이면 중근을 갖고, 중근을 가지면 $D=0$이다.
    $D<0$이면 서로 다른 두 허근을 갖고, 서로 다른 두 허근을 가지면 $D<0$이다.
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 함수 $f(x)=\sin\pi x$와 $g(x)=\cos\pi x$에 대하여 전체집합 $U$의 두 부분집합 $A,B$를 다음과 같이 정의할 때, 물음에 답하시오.
    $$U=\left\{x\ \Big|\ x=\frac n{24},\ 0\le n\le24\text{인 정수}\right\}$$
    $$A=\{x\mid f(4x)=0,\ 0\le x\le1\},\quad B=\{x\mid g(6x)=0,\ 0\le x\le1\}$$

    (1) $A\cup B$과 $A\cap B$을 각각 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: set
    value: union=0,1/12,1/4,5/12,1/2,7/12,3/4,11/12,1; inter=1/4,3/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    source_flow: 해설 p.7
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $f(4x)=\sin4\pi x=0$에서 $0\le x\le1$이므로 $x=0,\ \dfrac14,\ \dfrac12,\ \dfrac34,\ 1$이고, $g(6x)=\cos6\pi x=0$에서 $0\le x\le1$이므로 $x=\dfrac1{12},\ \dfrac14,\ \dfrac5{12},\ \dfrac7{12},\ \dfrac34,\ \dfrac{11}{12}$이다.
        $A=\left\{0,\ \dfrac14,\ \dfrac12,\ \dfrac34,\ 1\right\}$, $B=\left\{\dfrac1{12},\ \dfrac14,\ \dfrac5{12},\ \dfrac7{12},\ \dfrac34,\ \dfrac{11}{12}\right\}$이다.
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: $A$와 $B$의 합집합과 교집합은 각각 $A\cup B=\left\{0,\ \dfrac1{12},\ \dfrac14,\ \dfrac5{12},\ \dfrac12,\ \dfrac7{12},\ \dfrac34,\ \dfrac{11}{12},\ 1\right\}$, $A\cap B=\left\{\dfrac14,\ \dfrac34\right\}$이다.
      criteria:
      - 1-1.A2
