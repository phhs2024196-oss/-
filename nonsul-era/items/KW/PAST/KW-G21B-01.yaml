- id: 3-1
  stem: |
    [3] 무리함수 $f(x)=\sqrt{-(x+1)}-1$과 함수 $g(x)=kx$에 대하여 물음에 답하시오. (단, $k$는 상수)

    (1) 곡선 $y=f(x)$ 위의 두 점 $\mathrm{P}(a,b)$, $\mathrm{Q}(c,d)$를 지나는 직선에 수직인 직선의 기울기를 구하시오. (단, $b+d=1$, $a<c\le-1$) [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 31b-1
      content: 두 점 $\mathrm{P},\mathrm{Q}$를 지나는 직선의 기울기는 $\dfrac{d-b}{c-a}$이므로 이 직선과 수직인 직선의 기울기는 $-\dfrac{c-a}{d-b}$이다. (여기서 $d-b\ne0$인데 왜냐하면, 만약 $d=b$이라면 $\sqrt{-(c+1)}-1=\sqrt{-(a+1)}-1$이므로 $c=a$가 되지만 문제의 조건에서 $a<c$라고 했기 때문이다.)
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: 점 $\mathrm{P},\mathrm{Q}$가 곡선 $y=f(x)$ 위의 점이므로 $(b+1)^2=-(a+1)$이고 $(d+1)^2=-(c+1)$이다. 두 식의 차는 $(b+1)^2-(d+1)^2=c-a$이므로 $-\dfrac{c-a}{d-b}=\dfrac{(d+1)^2-(b+1)^2}{d-b}=d+b+2=3$이다.
      criteria:
      - 3-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 2
      evidence: 수직인 직선의 기울기의 식 $-\dfrac{c-a}{d-b}$을 얻고 $d-b\ne0$임을 언급하였다.
      depends_on: []
      implied_ok: false
      steps:
      - 31b-1
    - id: 3-1.A2
      mark_type: A
      points: 3
      evidence: $-\dfrac{c-a}{d-b}=\dfrac{(d+1)^2-(b+1)^2}{d-b}=d+b+2=3$을 얻었다.
