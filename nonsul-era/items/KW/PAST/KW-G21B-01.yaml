      content: 구하는 영역의 넓이(위 그림의 $S_1+S_2$)는 곡선 $y=f(x)$와 $y$축 및 두 직선 $y=-1,\ y=\sqrt2$로 둘러싸인 영역의 넓이 $S$와 삼각형 영역의 넓이 $T$(위 그림의 $T_1+T_2$)의 차와 같다. $S=\displaystyle\int_{-1}^{\sqrt2}\lvert h(y)\rvert\,dy=\int_{-1}^{\sqrt2}(y^2+2y+2)\,dy=\left[\frac{y^3}3+y^2+2y\right]_{-1}^{\sqrt2}=\frac{10}3+\frac83\sqrt2$이다.
