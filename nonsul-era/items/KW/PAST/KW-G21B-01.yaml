    (1) $A$가 직각일 때, $\sin A+\sin B+\sin C$의 최댓값을 구하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: value
    value: 1+sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    source_flow: 해설 p.7~8
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $A=\dfrac\pi2$이므로 $B+C=\dfrac\pi2$이다.
        $\sin A+\sin B+\sin C=1+\sin B+\sin\left(\dfrac\pi2-B\right)=1+\sin B+\cos B=1+\sin B+\sqrt{1-\sin^2B}$ ……① ($\because\cos B>0$)
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: $\sin B=x\ (0<x<1)$이라 하면 식 ①의 최댓값은 $f(x)=1+x+\sqrt{1-x^2}$의 최댓값이다. $f^{\prime}(x)=1-\dfrac x{\sqrt{1-x^2}}=0$으로부터 $x=\dfrac{\sqrt2}2$이다. 증감표에서 $x=\dfrac{\sqrt2}2$의 좌우에서 $f^{\prime}(x)$의 부호가 $+$에서 $-$로 바뀌므로 극대이다.
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: 그러므로 $0<x<1$에서 $f(x)$의 최댓값은 $f\left(\dfrac{\sqrt2}2\right)=1+\sqrt2$이므로 식 ①의 최댓값은 $1+\sqrt2$이다.
      criteria:
      - 2-1.A3
