      content: $y=f(x)$와 $y=g(x)$가 접할 때 $k=\dfrac{1-\sqrt2}2$이고 식 ①의 판별식이 $0$이므로 접점의 $x$좌표는 $x=\dfrac{-(2k+1)}{2k^2}=-2(2+\sqrt2)$이다. 접점의 $y$좌표는 $y=kx=\sqrt2$이다. $y=f(x)=\sqrt{-(x+1)}-1$에서 $x$를 $y$에 대해 정리하면 $x=h(y)=-y^2-2y-2$이다.
