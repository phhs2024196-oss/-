    audience: B
    source_flow: 해설 p.13
    method_no: 1
    steps:
    - id: 22b-1
      content: 직선 $y=ax+1$이 곡선 $y=f(x)$와 접하는 경우는 $x\ge0$에서 곡선 $y=(x-2)^2$과 접하는 경우이다. $x^2-(a+4)x+3=0$으로부터 $D=(a+4)^2-12=a^2+8a+4=0$이고 $a=-4\pm2\sqrt3$를 얻는다.
      criteria:
      - 2-2.M1
