stimuli:
- label: '1'
  body: |
    이항정리
    $n$이 자연수일 때
    $$(a+b)^n={}_n\mathrm{C}_0a^n+{}_n\mathrm{C}_1a^{n-1}b+\cdots+{}_n\mathrm{C}_ra^{n-r}b^r+\cdots+{}_n\mathrm{C}_nb^n$$
- label: '2'
  body: |
    두 곡선 사이의 넓이
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$와 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b\lvert f(x)-g(x)\rvert\,dx$$
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
