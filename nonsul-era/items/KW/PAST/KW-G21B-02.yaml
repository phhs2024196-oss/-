  solutions:
  - id: S23-B
    audience: B
    source_flow: 해설 p.13
    method_no: 1
    steps:
    - id: 23b-1
      content: 함수 $h(x)$를 이루는 두 함수에 대해, $f(x)$는 $0$을 제외한 모든 실수에서, $g(x)$는 모든 실수에서 미분가능하므로, 함수 $h(x)$의 미분가능하지 않은 점은 두 함수 $f(x)$와 $g(x)$의 그래프의 교점일 수 있다. 두 함수 $y=g(x)$와 $y=f(x)$가 접하는 범위는 $x\ge0$이다. 그때의 기울기는 (2)로부터 $a=-4+2\sqrt3$이다.
