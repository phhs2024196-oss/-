    steps:
    - id: 13b-1
      content: (2)로부터 $2021^{10}=3a+1$ ($a$는 정수), $2021^{10}=7b+2$ ($b$는 정수)이다. 위의 두 식으로부터 $7b=2021^{10}-2=(3a+1)-2=3(a-1)+2$ ……④이다.
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: 여기서 $b$를 $3$으로 나눈 나머지는 $0,1,2$ 중 하나이다. 나머지가 $0$인 경우, 식 ④의 좌변과 우변을 $3$으로 나눈 나머지가 일치하지 않는다. 나머지가 $1$인 경우 $7(3c+1)=3(7c+2)+1$ ($c$는 정수)이므로 식 ④의 좌변과 우변을 $3$으로 나눈 나머지가 일치하지 않는다. 그러므로 $b$를 $3$으로 나눈 나머지는 $2$이다. 즉, $b=3d+2$ ($d$는 정수)이다.
      criteria:
      - 1-3.M1
    - id: 13b-3
      content: 식 ④로부터 $2021^{10}=7b+2=7(3d+2)+2=21d+16$이다. 그러므로 $2021^{10}$을 $21$로 나눈 나머지는 $16$이다.
      criteria:
      - 1-3.A2
