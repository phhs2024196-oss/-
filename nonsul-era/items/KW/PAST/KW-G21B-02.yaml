- id: 2-1
  stem: |
    [2] 모든 실수 $x$에 대하여 함수 $h(x)$의 함숫값은 다음과 같은 함수 $f(x)$의 값과 함수 $g(x)$의 값 중 크지 않은 값으로 정의한다.
    $$f(x)=\begin{cases}(x-2)^2&(x\ge0)\\3&(x<0)\end{cases},\qquad g(x)=ax+1\ (a\text{는 상수})$$
    예를 들어 $a=1$일 때 $f(3)=1$, $g(3)=4$이고 $f(3)<g(3)$이므로 $h(3)=1$이다. 물음에 답하시오.

    (1) $a=0$일 때, 두 함수 $y=h(x)$와 $y=x^2$의 그래프로 둘러싸인 부분의 넓이를 구하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: value
    value: 4/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    source_flow: 해설 p.13
    method_no: 1
    steps:
    - id: 21b-1
      content: $a=0$일 때, $g(x)=1$이므로 $y=f(x)$의 그래프와 직선 $y=1$의 교점의 $x$좌표를 구하자. $x<0$에서는 $f(x)=3>1$이고, $x\ge0$에서는 $(x-2)^2=1$이므로 구하는 $x=1,3$이다. 함수 $h(x)$의 정의로부터 $h(x)=\begin{cases}1&(x<1)\\(x-2)^2&(1\le x\le3)\\1&(x>3)\end{cases}$이다.
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: 두 함수 $y=x^2$과 $y=h(x)$의 그래프의 교점을 구하면 $x\le1$에서 $x^2=1$이므로 $x=-1,1$이다. 구하는 넓이를 $S$라 하면 $S=\displaystyle\int_{-1}^1(1-x^2)\,dx=\dfrac43$이다.
      criteria:
      - 2-1.A2
