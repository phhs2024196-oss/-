      content: $a=-4-2\sqrt3$일 때는 $y=g(x)$와 곡선 $y=(x-2)^2$이 $x<0$에서 접하는 경우이므로 제외한다. 따라서 $a=-4+2\sqrt3$이다.
      criteria:
      - 2-2.A2
