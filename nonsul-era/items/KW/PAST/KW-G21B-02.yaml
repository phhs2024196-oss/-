  solutions:
  - id: S11-B
    audience: B
    source_flow: 해설 p.12
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $(1+x)^5(1+x)^5=({}_5\mathrm{C}_0+{}_5\mathrm{C}_1x+\cdots+{}_5\mathrm{C}_5x^5)({}_5\mathrm{C}_0+{}_5\mathrm{C}_1x+\cdots+{}_5\mathrm{C}_5x^5)$에서 $x^5$의 계수는 ${}_5\mathrm{C}_0\cdot{}_5\mathrm{C}_5+{}_5\mathrm{C}_1\cdot{}_5\mathrm{C}_4+\cdots+{}_5\mathrm{C}_5\cdot{}_5\mathrm{C}_0$ ……①이다. 여기서 ${}_5\mathrm{C}_k={}_5\mathrm{C}_{5-k}\ (0\le k\le5$인 정수$)$이므로 식 ①을 다시 쓰면 ${}_5\mathrm{C}_0\cdot{}_5\mathrm{C}_5+{}_5\mathrm{C}_1\cdot{}_5\mathrm{C}_4+\cdots+{}_5\mathrm{C}_5\cdot{}_5\mathrm{C}_0=\displaystyle\sum_{i=0}^5({}_5\mathrm{C}_i)^2$ ……②이다.
        한편 $(1+x)^{10}={}_{10}\mathrm{C}_0+{}_{10}\mathrm{C}_1x+\cdots+{}_{10}\mathrm{C}_{10}x^{10}$에서 $x^5$의 계수는 ${}_{10}\mathrm{C}_5$ ……③이다. $(1+x)^{10}$과 $(1+x)^5(1+x)^5$에서 $x^5$의 계수는 같다. 그러므로 ②와 ③으로부터 $\displaystyle\sum_{i=0}^5({}_5\mathrm{C}_i)^2={}_p\mathrm{C}_q={}_{10}\mathrm{C}_5$이다.
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: 또한 $\displaystyle\sum_{i=0}^5({}_5\mathrm{C}_i)^2=252$에서 ${}_{252}\mathrm{C}_1=252$, ${}_{252}\mathrm{C}_{251}=252$이므로 $p+q=15$ 또는 $p+q=253$ 또는 $p+q=503$이다.
      criteria:
      - 1-1.A2
