stimuli:
- label: '1'
  body: |
    코사인법칙
    삼각형 $\mathrm{ABC}$에서
    $$a^2=b^2+c^2-2bc\cos A$$
    $$b^2=c^2+a^2-2ca\cos B$$
    $$c^2=a^2+b^2-2ab\cos C$$
- label: '2'
  body: |
    확률변수
    어떤 시행에서 표본공간 $S$의 각 원소에 단 하나의 실수가 대응되는 함수를 확률변수라 하고,
    확률변수 $X$가 어떤 값 $x$를 가질 확률을 기호로 다음과 같이 나타낸다.
    $$P(X=x)$$
- label: '3'
  body: |
    정적분과 급수의 합 사이의 관계
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 다음이 성립한다.
    $$\lim_{n\to\infty}\sum_{k=1}^nf\left(a+\frac{k(b-a)}n\right)\frac{b-a}n=\int_a^bf(x)\,dx$$
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 이차방정식 $x^2-(a+1)x+2a+1=0$의 한 허근을 $\omega$라고 할 때, 물음에 답하시오.(단, $a$는 실수)

    (1) 두 복소수 $\alpha,\beta$의 켤레복소수 $\overline\alpha,\overline\beta$에 대하여 $\overline{\alpha\beta}=\overline\alpha\,\overline\beta$가 성립함을 보이시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: proof
    value: $\alpha=a+bi$, $\beta=c+di$로 놓으면 $\overline{\alpha\beta}=(ac-bd)-(ad+bc)i=(a-bi)(c-di)=\overline\alpha\,\overline\beta$이다.
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    source_flow: 해설 p.7
    method_no: 1
    steps:
    - id: 11b-1
      content: $\alpha$와 $\beta$를 $\alpha=a+bi,\ \beta=c+di$ ($a,b,c,d$는 임의의 실수)라 하면 $\alpha\beta=(ac-bd)+(ad+bc)i$이므로 $\overline{\alpha\beta}=(ac-bd)-(ad+bc)i$ ……①이다.
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: 그리고 $\overline\alpha=a-bi$와 $\overline\beta=c-di$의 곱은 $\overline\alpha\,\overline\beta=(a-bi)(c-di)=(ac-bd)-(ad+bc)i$ ……②이다. 따라서 ①, ②로부터 $\overline{\alpha\beta}=\overline\alpha\,\overline\beta$가 성립한다.
      criteria:
      - 1-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: $\alpha,\beta$와 이들의 켤레복소수 $\overline\alpha,\overline\beta$를 문자를 사용하여 표현하였다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.A2
      mark_type: A
      points: 4
      evidence: $\overline{\alpha\beta}=\overline\alpha\,\overline\beta$를 정확히 기술하였다.
      depends_on:
      - 1-1.M1
      implied_ok: false
      steps:
      - 11b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: (2) $\omega^4-\overline\omega^4=0$을 만족하는 실수 $a$의 값을 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: values=1+sqrt(2),1-sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        주어진 방정식이 허근을 가지므로 $D=(a+1)^2-4(2a+1)=a^2-6a-3<0$, 즉 $3-2\sqrt3<a<3+2\sqrt3$ ……③이다.
        한편, 주어진 식은 다음과 같이 인수분해된다. $0=\omega^4-\overline\omega^4=(\omega^2-\overline\omega^2)(\omega^2+\overline\omega^2)=(\omega-\overline\omega)(\omega+\overline\omega)(\omega^2+\overline\omega^2)$
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        (ⅰ) $\omega-\overline\omega=0$일 때 $\omega$는 실수가 되어 모순이다. 따라서 $\omega-\overline\omega\ne0$이다.
        (ⅱ) $\omega+\overline\omega=0$일 때 $\omega+\overline\omega=a+1=0$에서 $a=-1$이다. 그런데 $-1<3-2\sqrt3$이므로 ③에 어긋난다. 따라서 $\omega+\overline\omega\ne0$이다.
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: (ⅲ) $\omega^2+\overline\omega^2=0$일 때 $0=(\omega+\overline\omega)^2-2\omega\overline\omega=(a+1)^2-2(2a+1)=a^2-2a-1$이다. 이로부터 $a=1\pm\sqrt2$이다. $1+\sqrt2$과 $1-\sqrt2$ 둘 다 부등식 ③을 만족한다. 따라서 $\omega^4-\overline\omega^4=0$을 만족하는 $a=1\pm\sqrt2$이다.
      criteria:
      - 1-2.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: $\omega^4-\overline\omega^4=0$을 인수분해하여 낮은 차원의 방정식을 얻었다.
      depends_on: []
      implied_ok: false
      steps:
