key_idea: '[1] 허근 조건 $D<0$과 근과 계수의 관계로 $\omega+\overline\omega=a+1$, $\omega\overline\omega=2a+1$을 만들고 $\omega^4-\overline\omega^4$를 인수분해해 경우를 나눈다. [2] 정$2n$각형의 두 꼭지점 사이 거리의 제곱을 중심각으로 $2\left(1-\cos\dfrac{k\pi}n\right)$로 쓰고 $k=n$인 대각선만 $n$번, 나머지는 $2n$번 나타남을 센 뒤, 급수를 구분구적법으로 정적분 $\dfrac2\pi\displaystyle\int_0^\pi(1-\cos x)dx$에 연결한다.'
