  solutions:
  - id: S24-B
    audience: B
    source_flow: 해설 p.10
    method_no: 1
    steps:
    - id: 24b-1
      content: |
        (3)에서 구한 $E(X_n)$은 다음과 같이 나타낼 수 있다.
        $$E(X_n)=\frac4{2n-1}\sum_{k=1}^n\left(1-\cos\frac{k\pi}n\right)-\frac4{2n-1}=\frac{4n}{\pi(2n-1)}\sum_{k=1}^n\left(1-\cos\frac{k\pi}n\right)\cdot\frac\pi n-\frac4{2n-1}$$
      criteria:
      - 2-4.M1
    - id: 24b-2
      content: |
        따라서 다음을 얻는다.
        $$\lim_{n\to\infty}E(X_n)=\lim_{n\to\infty}\left\{\frac{4n}{\pi(2n-1)}\sum_{k=1}^n\left(1-\cos\frac{k\pi}n\right)\cdot\frac\pi n-\frac4{2n-1}\right\}=\left\{\lim_{n\to\infty}\frac{4n}{\pi(2n-1)}\right\}\left\{\lim_{n\to\infty}\sum_{k=1}^n\left(1-\cos\frac{k\pi}n\right)\cdot\frac\pi n\right\}-\lim_{n\to\infty}\frac4{2n-1}=\frac2\pi\int_0^\pi(1-\cos x)\,dx=\frac2\pi\Big[x-\sin x\Big]_0^\pi=2$$
      criteria:
      - 2-4.A2
