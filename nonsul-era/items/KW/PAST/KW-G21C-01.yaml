- id: 1-3
  stem: (3) $\omega^2+\overline\omega^2-2\omega\overline\omega>-8$을 만족하는 실수 $a$의 범위를 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: expression
    value: lo1=3-2*sqrt(3); hi1=1; lo2=5; hi2=3+2*sqrt(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 13b-1
      content: $\omega^2+\overline\omega^2-2\omega\overline\omega=(\omega+\overline\omega)^2-4\omega\overline\omega=(a+1)^2-4(2a+1)=a^2-6a-3$이므로 주어진 부등식은 $a^2-6a-3>-8\Rightarrow a^2-6a+5=(a-1)(a-5)>0\Rightarrow a<1$ 또는 $a>5$이다.
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: 그러므로 ③에 의해 $a$의 범위는 $3-2\sqrt3<a<1,\ 5<a<3+2\sqrt3$이다.
      criteria:
