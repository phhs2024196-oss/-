      points: 2
      evidence: 문제에서 주어진 방정식에 대한 근과 계수의 관계를 활용하였다.
      depends_on: []
      implied_ok: false
      steps:
      - 12b-2
    - id: 1-2.A3
      mark_type: A
      points: 3
      evidence: $a$의 조건을 확인하여 $a$의 값을 정확히 구하였다.
      depends_on:
      - 1-2.M1
      - 1-2.M2
      implied_ok: false
      steps:
      - 12b-3
