- id: 2-1
  stem: |
    [2] 오른쪽 그림과 같이 반지름의 길이가 $1$인 원에 내접하는 정$2n$각형 $A_1A_2\cdots A_{2n}$에서 임의의 두 꼭지점을 택하여 두 꼭지점 사이의 거리의 제곱을 확률변수 $X_n$이라 하자. 물음에 답하시오. (단, $n\ge2$인 자연수)

    [그림 1: 반지름 $1$인 원에 내접하는 정$2n$각형. 꼭대기 꼭지점 $A_1$에서 시계 방향으로 $A_2,A_3,A_4,\dots,A_n$, 맨 아래 $A_{n+1}$, 왼쪽 위 $A_{2n}$ 순서로 놓였고 원의 중심에서 $A_1$까지의 반지름 길이 $1$이 표시되어 있다. 변 $A_1A_2,A_2A_3,A_3A_4,A_nA_{n+1}$과 $A_{2n}A_1$이 굵게 그려져 있다.]

    (1) 확률변수 $X_3$의 확률분포를 표로 나타내고, 확률변수 $X_3$의 기댓값 $E(X_3)$을 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: p1=2/5; p3=2/5; p4=1/5; E=12/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    source_flow: 해설 p.8
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        두 꼭지점 사이의 거리가 작은 것부터 $a_1,a_2,a_3$로 나타내면 확률변수 $X_3$의 값은 다음과 같다.
        $(a_1)^2=2\left(1-\cos\dfrac\pi3\right)=1,\ (a_2)^2=2\left(1-\cos\dfrac{2\pi}3\right)=3,\ (a_3)^2=2^2=4$
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $6$개의 점으로부터 $2$개를 선택하는 방법의 가짓수는 ${}_6\mathrm{C}_2=15$이다. 그리고 $a_1,a_2$가 나타나는 경우의 수가 각각 $6$이고, $a_3$이 나타나는 경우의 수가 $3$이므로 $P(X_3=(a_1)^2)=P(X_3=(a_2)^2)=\dfrac6{15}=\dfrac25,\ P(X_3=(a_3)^2)=\dfrac3{15}=\dfrac15$이다. 따라서 확률변수 $X_3$의 확률분포를 표로 나타내면 다음과 같다.

        | $X_3$ | $1$ | $3$ | $4$ | 합계 |
        |---|---|---|---|---|
        | $P(X_3=(a_i)^2)$ | $\dfrac25$ | $\dfrac25$ | $\dfrac15$ | $1$ |
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: 이로부터 확률변수 $X_3$의 기댓값은 $E(X_3)=1\cdot\dfrac25+3\cdot\dfrac25+4\cdot\dfrac15=\dfrac{12}5$이다.
      criteria:
      - 2-1.A3
