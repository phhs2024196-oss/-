      content: |
        두 꼭지점 사이의 거리가 작은 것부터 $a_1,a_2,a_3,a_4$로 나타내자. 한 변이 이루는 중심각이 $\dfrac\pi4$이므로 코사인법칙으로부터
        $(a_1)^2=1+1-2\cos\dfrac\pi4=2\left(1-\dfrac{\sqrt2}2\right)=2-\sqrt2,\ (a_2)^2=1+1-2\cos\dfrac{2\pi}4=2(1-0)=2,$
        $(a_3)^2=1+1-2\cos\dfrac{3\pi}4=2\left(1+\dfrac{\sqrt2}2\right)=2+\sqrt2,\ (a_4)^2=1+1-2\cos\dfrac{4\pi}4=2(1+1)=4$이다.
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        $8$개의 점으로부터 $2$개를 선택하는 방법의 가짓수는 ${}_8\mathrm{C}_2=28$이다. 그리고 $a_1,a_2,a_3$은 각각 $8$번 얻을 수 있고, $a_4$는 $4$번 얻을 수 있으므로 확률변수 $X_4$의 확률분포를 표로 나타내면 다음과 같다.

        | $X_4$ | $2-\sqrt2$ | $2$ | $2+\sqrt2$ | $4$ | 합계 |
        |---|---|---|---|---|---|
        | $P(X_4=(a_i)^2)$ | $\dfrac27$ | $\dfrac27$ | $\dfrac27$ | $\dfrac17$ | $1$ |
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: 이로부터 $E(X_4)=\left[(2-\sqrt2)+2+(2+\sqrt2)\right]\cdot\dfrac27+4\cdot\dfrac17=\dfrac{16}7$이다.
      criteria:
      - 2-2.A3
