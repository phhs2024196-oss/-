- id: 2-3
  stem: (3) 확률변수 $X_n$의 기댓값 $E(X_n)$을 구하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: expression
    value: E=4/(2*n-1)*Sum(1-cos(k*pi/n),(k,1,n-1))+4/(2*n-1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S23-B
    audience: B
    source_flow: 해설 p.9
    method_no: 1
    steps:
    - id: 23b-1
      content: |
        두 꼭지점 사이의 거리가 작은 것부터 $a_1,a_2,\cdots,a_n$으로 나타내자. 한 변이 이루는 중심각이 $\dfrac\pi n$이므로 코사인법칙으로부터 다음을 얻는다.
        $(a_k)^2=1+1-2\cos\dfrac{k\pi}n=2\left(1-\cos\dfrac{k\pi}n\right)\ (k=1,2,\cdots,n)$
      criteria:
      - 2-3.M1
    - id: 23b-2
      content: |
        $2n$개의 점으로부터 $2$개를 선택하는 방법의 가짓수는 ${}_{2n}\mathrm{C}_2=n(2n-1)$이다. 그리고 $a_1,a_2,\cdots,a_{n-1}$은 각각 $2n$번 얻을 수 있고, $a_n$은 $n$번 얻을 수 있으므로 다음이 성립한다.
        $$P(X_n=(a_k)^2)=\begin{cases}\dfrac2{2n-1}&(k\ne n)\\ \dfrac1{2n-1}&(k=n)\end{cases}$$
      criteria:
      - 2-3.M2
    - id: 23b-3
      content: |
        따라서 $E(X_n)$은 다음과 같다.
        $$E(X_n)=\sum_{k=1}^{n-1}2\left(1-\cos\frac{k\pi}n\right)\cdot\frac2{2n-1}+2\left(1-\cos\frac{n\pi}n\right)\cdot\frac1{2n-1}=\frac4{2n-1}\sum_{k=1}^{n-1}\left(1-\cos\frac{k\pi}n\right)+\frac4{2n-1}$$
      criteria:
      - 2-3.A3
