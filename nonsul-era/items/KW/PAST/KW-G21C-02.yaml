      depends_on: []
      implied_ok: false
      steps:
      - 11b-2
    - id: 1-1.A3
      mark_type: A
      points: 1
      evidence: (ⅰ)과 (ⅱ)로부터 $a\ne0$이고, $k$의 합이 $b+\dfrac2{a^2}$임을 표현하였다.
      depends_on:
      - 1-1.M1
      - 1-1.M2
      implied_ok: false
      steps:
      - 11b-3
