      content: |
        $\lvert\log_2a-\log_210\rvert+\log_2b\le1\Rightarrow\left\lvert\log_2\dfrac a{10}\right\rvert+\log_2b\le1$이다.
        (ⅰ) $\log_2\dfrac a{10}>0$인 경우 ($a>10$인 경우): $\log_2\dfrac a{10}+\log_2b\le\log_22\Rightarrow\log_2\dfrac{ab}{10}\le\log_22\Rightarrow\dfrac{ab}{10}\le2$이므로 $ab\le20$ ……①이다. $a,b$가 자연수이고 $a>10$이므로 ①을 만족하는 경우는 $(11,1),(12,1),\cdots,(19,1),(20,1)$로 모두 $10$가지이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: '(ⅱ) $\log_2\dfrac a{10}<0$인 경우 ($0<a<10$인 경우): $-\log_2\dfrac a{10}+\log_2b\le1\Rightarrow\log_2\dfrac{10}a+\log_2b\le1\Rightarrow\log_2\dfrac{10b}a\le\log_22\Rightarrow\dfrac{10b}a\le2\Rightarrow10b\le2a$이다. 그러므로 $5b\le a$ ……②이다. $a,b$가 자연수이고 $0<a<10$이므로 ②를 만족하는 경우는 $(9,1),(8,1),(7,1),(6,1),(5,1)$로 $5$가지이다.'
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        (ⅲ) $\log_2\dfrac a{10}=0$인 경우 ($a=10$인 경우): $\log_2b\le1\Rightarrow\log_2b\le\log_22$이므로 $b\le2$ ……③이다. $a,b$가 자연수이고 $a=10$이므로 ③을 만족하는 경우는 $(10,1),(10,2)$로 $2$가지이다.
        (ⅰ), (ⅱ), (ⅲ)에 의하여 순서쌍 $(a,b)$의 개수는 모두 $17$가지이다.
      criteria:
      - 2.M3
      - 2.A4
