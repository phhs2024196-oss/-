  solutions:
  - id: S12-B
    audience: B
    source_flow: 해설 p.14
    method_no: 1
    steps:
    - id: 12b-1
      content: '(ⅰ) $k=b$이고 $a=0$일 때: 방정식 ①은 $2=0$이 되어 근이 존재하지 않고 방정식 ②는 중근 $x=0$을 가지므로 두 해집합은 같지 않다.'
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: '(ⅱ) $k=b$이고 $a\ne0$일 때: 방정식 ①의 근은 $x=-\dfrac1{ak}$이고 방정식 ②의 근은 $x=0,\ -ak$이므로 두 해집합은 같지 않다.'
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: '(ⅲ) $k\ne b$이고 $a=0$일 때: 방정식 ①로부터 $x^2=-\dfrac2{k-b}$이고 방정식 ②로부터 $x^2=-\dfrac{k-b}2$이다. 따라서 해집합이 같은 조건은 $k-b=\pm2$이다.'
      criteria:
      - 1-2.M3
    - id: 12b-4
      content: '(ⅳ) $k\ne b$이고 $a\ne0$일 때: 해집합이 같은 이차방정식은 $p(x-\alpha)(x-\beta)=0$의 형태를 가진다. 방정식 ①과 ②는 일차항이 같으므로 나머지 계수도 같아야 한다. 따라서 $k-b=2$이다.'
      criteria:
      - 1-2.M4
    - id: 12b-5
      content: (ⅰ), (ⅱ), (ⅲ), (ⅳ)로부터 해집합이 같은 조건은 $k-b=-2$ (단, $a=0$) 또는 $k-b=2$이다.
      criteria:
      - 1-2.A5
