stimuli:
- label: '1'
  body: |
    이차방정식의 근의 판별
    계수가 실수인 이차방정식 $ax^2+bx+c=0\ (a\ne0)$에서 $D=b^2-4ac$라고 할 때,
    $D>0$이면 서로 다른 두 실근을 갖고, 서로 다른 두 실근을 가지면 $D>0$이다.
    $D=0$이면 중근을 갖고, 중근을 가지면 $D=0$이다.
    $D<0$이면 서로 다른 두 허근을 갖고, 서로 다른 두 허근을 가지면 $D<0$이다.
- label: '2'
  body: |
    $a>0,\ a\ne1,\ x_1>0,\ x_2>0$이고
    $a>1$일 때, $\log_ax_1<\log_ax_2\Leftrightarrow x_1<x_2$
    $0<a<1$일 때, $\log_ax_1<\log_ax_2\Leftrightarrow x_1>x_2$
- label: '3'
  body: |
    함수의 극한의 대소 관계
    $\displaystyle\lim_{x\to a}f(x)=\alpha,\ \lim_{x\to a}g(x)=\beta\ (\alpha,\beta$는 실수$)$일 때, $a$가 아니면서 $a$에 가까운 모든 실수 $x$에 대하여
    $f(x)\le g(x)$이면 $\alpha\le\beta$이다.
    $f(x)\le h(x)\le g(x)$이고 $\alpha=\beta$이면 $\displaystyle\lim_{x\to a}h(x)=\alpha$이다.
- label: '4'
  body: |
    함수의 극대와 극소의 판정
    함수 $f(x)$가 미분가능하고 $f^{\prime}(a)=0$일 때, $x=a$의 좌우에서 $f^{\prime}(x)$의 부호가
    양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고 극댓값 $f(a)$를 갖는다.
    음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고 극솟값 $f(a)$를 갖는다.
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 실수 $a,b$와 $0$이 아닌 실수 $k$에 대하여 $x$에 대한 두 방정식이 다음과 같이 주어질 때, 물음에 답하시오.
    $$(k-b)x^2+2akx+2=0\ \cdots\cdots\ ①$$
    $$2x^2+2akx+k-b=0\ \cdots\cdots\ ②$$

    (1) 방정식 ①이 $1$개의 실근을 가지도록 하는 $a$의 조건과 실수 $k$의 합을 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: cond=a!=0; ksum=b+2/a**2
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    source_flow: 해설 p.14
    method_no: 1
    steps:
    - id: 11b-1
      content: (ⅰ) $k=b$인 경우, 방정식 ①은 $2akx+2=0$이 된다. $a=0$이면 $2=0$이 되므로 근이 존재하지 않는다. $a\ne0$이면 하나의 실근을 가진다.
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: (ⅱ) $k\ne b$인 경우, $1$개의 실근은 중근을 의미하므로 $\dfrac D4=a^2k^2-2(k-b)=0$이다. $a=0$이면 $\dfrac D4\ne0$이 되기 때문에 $a\ne0$이다. $\dfrac D4$는 $k$에 대한 이차식이므로 이차방정식의 근과 계수의 관계에서 $k$의 합은 $\dfrac2{a^2}$이다.
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: (ⅰ), (ⅱ)에 의하여 방정식 ①이 $1$개의 실근을 가지도록 하는 $a$의 조건은 $a\ne0$이고, $k$의 합은 $b+\dfrac2{a^2}$이다.
      criteria:
      - 1-1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
