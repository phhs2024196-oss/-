- id: 3-3
  stem: (3) 함수 $g(x)=xe^{-x}$이 $x=a$에서 극댓값을 가질 때, 두 곡선 $y=f(x)$, $y=g(x)$와 두 직선 $x=0$, $x=a$로 둘러싸인 부분의 넓이를 구하시오. [10점]
