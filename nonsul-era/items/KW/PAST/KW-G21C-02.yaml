  solutions:
  - id: S33-B
    audience: B
    source_flow: 해설 p.15~16
    method_no: 1
    steps:
    - id: 33b-1
      content: $g(x)=xe^{-x}$는 미분가능한 함수이다. $g^{\prime}(x)=e^{-x}(1-x)$이므로 $g^{\prime}(x)=0$에서 $x=1$이다. $g^{\prime}(x)$의 부호를 조사하여 $g(x)$의 증가와 감소를 표로 나타내면, $x=1$의 좌우에서 $g^{\prime}(x)$의 부호가 $+$에서 $-$로 바뀌어 $x=1$에서 극대이다. 제시문 4에 의하여 함수 $g(x)$는 $x=1$에서 극댓값을 가지므로 $a=1$이다.
      criteria:
      - 3-3.M1
    - id: 33b-2
      content: 두 곡선 $y=f(x)$, $y=g(x)$와 두 직선 $x=0$, $x=a$로 둘러싸인 부분의 넓이를 $S$라 하면 $S=\displaystyle\int_0^1\lvert f(x)-g(x)\rvert\,dx=\int_0^1(x^2+x+1-xe^{-x})\,dx$이다.
      criteria:
      - 3-3.M2
    - id: 33b-3
      content: 부분적분법으로 $g(x)=xe^{-x}$의 부정적분을 구하면 $\displaystyle\int xe^{-x}\,dx=-xe^{-x}+\int e^{-x}\,dx=-(x+1)e^{-x}+C$ ($C$는 상수)이다.
      criteria:
      - 3-3.M3
    - id: 33b-4
      content: 따라서 구하는 넓이는 $S=\displaystyle\int_0^1(x^2+x+1-xe^{-x})\,dx=\left[\frac13x^3+\frac12x^2+x+xe^{-x}+e^{-x}\right]_0^1=\frac56+\frac2e$이다.
      criteria:
      - 3-3.A4
