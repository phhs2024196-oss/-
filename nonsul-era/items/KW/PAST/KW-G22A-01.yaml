- id: 4-1
  stem: |
    [4] 태양 $\mathrm{S}$를 한 초점으로 하는 타원 궤도를 따라 행성 $\mathrm{E}$가 공전하고 있다고 하자. 오른쪽 그림과 같이 이 타원을 좌표평면에 나타내어 타원의 중심은 원점 $\mathrm{O}$에 장축 $\mathrm{AB}$는 $x$축에 놓인다고 하자. 태양 $\mathrm{S}$는 원점 $\mathrm{O}$와 꼭짓점 $\mathrm{A}$ 사이에 있다. 선분 $\mathrm{AS}$의 길이가 $2$, 선분 $\mathrm{SB}$의 길이가 $18$이라고 할 때, 다음을 찾으시오.

    [그림: 가로로 긴 타원. 중심 $\mathrm{O}$, 왼쪽 꼭짓점 $\mathrm{A}$, 오른쪽 꼭짓점 $\mathrm{B}$가 $x$축 위에 있고 태양 $\mathrm{S}$는 $\mathrm{A}$와 $\mathrm{O}$ 사이의 $x$축 위. 제1사분면의 타원 위에 행성 $\mathrm{E}(x,y)$가 있고 선분 $\mathrm{OE}$가 $x$축의 양의 방향과 이루는 각이 $\theta$, 점선 $\mathrm{SE}$가 그려져 있음]

    (1) 좌표평면에서 행성 $\mathrm{E}$의 궤도를 나타내는 타원의 방정식 [5점]
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: x**2/100+y**2/36=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        타원의 방정식을 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$이라 하면 장축의 길이($=\overline{\mathrm{AB}}$)가 $2a=20$이므로 $a=10$이다.
      source_flow: 해설 p.9~11
      criteria:
      - 4-1.B1
    - id: 41b-2
      content: |
        $\overline{\mathrm{AO}}=10$이고 $\overline{\mathrm{AS}}=2$이므로 $\overline{\mathrm{SO}}$의 길이는 $8$이다. 양수 $c$에 대해 두 초점을 $(c,0)$과 $(-c,0)$이라고 하면 태양이 초점 $(-c,0)$에 있으므로 $c=8$이다. 그러면 $b^2=a^2-c^2=100-64=36$이다.
      source_flow: 해설 p.9~11
      criteria:
      - 4-1.M1
    - id: 41b-3
      content: |
        따라서 타원의 방정식은 $\dfrac{x^2}{100}+\dfrac{y^2}{36}=1$이다.
      source_flow: 해설 p.9~11
      criteria:
      - 4-1.A1
