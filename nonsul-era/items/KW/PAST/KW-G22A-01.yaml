  - id: S44-B
    audience: B
    method_no: 1
    steps:
    - id: 44b-1
      content: |
        $\dfrac{x^2}{100}+\dfrac{y^2}{36}=1$로부터 $y=\pm6\sqrt{1-\dfrac{x^2}{100}}$이다. $0\le\theta\le\dfrac{\pi}{4}$이므로 $y=6\sqrt{1-\dfrac{x^2}{100}}$이다.
        $x=10\cos\theta$, $y=6\sin\theta$로부터 $\theta=0$일 때 $\mathrm{E}(10,0)$이고, $\theta=\dfrac{\pi}{4}$일 때 $\mathrm{E}(5\sqrt2,3\sqrt2)$이다.
        $\mathrm{H}(5\sqrt2,0)$이라 하고 찾는 넓이를 $T$라고 하면 $T=\displaystyle\int_{5\sqrt2}^{10}6\sqrt{1-\dfrac{x^2}{100}}\,dx+\triangle\mathrm{EOH}$이다.
      source_flow: 해설 p.9~11
      criteria:
      - 4-4.M1
    - id: 44b-2
      content: |
        $x=10\cos\theta$로 치환하면 $\dfrac{dx}{d\theta}=-10\sin\theta$이고 $6\sqrt{1-\dfrac{x^2}{100}}=6\sqrt{1-\cos^2\theta}=6\lvert\sin\theta\rvert=6\sin\theta\ \left(0\le\theta\le\dfrac{\pi}{4}\right)$이므로 다음을 얻는다.
        $T=\displaystyle\int_{\frac{\pi}{4}}^{0}6\sin\theta(-10\sin\theta)\,d\theta+\dfrac{5\sqrt2\times3\sqrt2}{2}=60\int_0^{\frac{\pi}{4}}\sin^2\theta\,d\theta+15=30\int_0^{\frac{\pi}{4}}(1-\cos2\theta)\,d\theta+15$
      source_flow: 해설 p.9~11
      criteria:
      - 4-4.M2
    - id: 44b-3
      content: |
        $=30\left[\theta-\dfrac{\sin2\theta}{2}\right]_0^{\frac{\pi}{4}}+15=15\left(\dfrac{\pi}{2}-1\right)+15=\dfrac{15}{2}\pi$
      source_flow: 해설 p.9~11
      criteria:
      - 4-4.A1
