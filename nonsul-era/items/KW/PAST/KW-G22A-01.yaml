    - id: 32b-1
      content: |
        $h(x)=(x^2+4)(kx+1)=kx^3+x^2+4kx+4$이므로 구간 $(0,\infty)$에서 $h^{\prime}(x)=3kx^2+2x+4k>0$이어야 한다.
        (ⅰ) $k=0$일 때, $h(x)=x^2+4$이므로 $h^{\prime}(x)=2x$이고 구간 $(0,\infty)$에서 $h^{\prime}(x)>0$이므로 조건을 만족시킨다.
        (ⅱ) $k>0$일 때, $h^{\prime}(x)=3k\left(x+\dfrac{1}{3k}\right)^2+4k-\dfrac{1}{3k}$이다. 이차함수 $y=h^{\prime}(x)$의 그래프의 축이 $x=-\dfrac{1}{3k}<0$이고 $h^{\prime}(0)=4k>0$이므로 구간 $(0,\infty)$에서 $h^{\prime}(x)>0$이다. 따라서 $k>0$은 조건을 만족시킨다.
        (ⅲ) $k<0$인 경우, $\displaystyle\lim_{x\to\infty}h^{\prime}(x)<0$이므로 조건을 만족시킬 수 없다.
      source_flow: 해설 p.9~11
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        따라서 (ⅰ), (ⅱ), (ⅲ)에 의해 조건을 만족시키는 $k$의 값의 범위는 $k\ge0$이다.
      source_flow: 해설 p.9~11
