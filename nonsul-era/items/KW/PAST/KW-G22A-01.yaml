# 광운대 2022학년도 논술고사 자연계열(1교시) 문제 1 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 공식 문항 메모: [4](2)는 '선분 OE와 x축의 양의 방향이 이루는 각 θ'를 매개변수 θ와 같은 것으로 보고 x=a cosθ, y=b sinθ 로 둔다.
#   실제 OE의 방위각은 매개변수 θ와 다르다(θ=0, π/2 에서만 일치). 원문·공식 답을 그대로 두고 [4](3)(4)도 매개변수 θ 로 푼다. [문제 결함 — 독립 교차검증 2건 일치(2026-11-23): θ 정의대로면 (2) 접점·(4) 넓이 30·arctan(5/3) 로 달라짐, (3)은 영향 없음]
