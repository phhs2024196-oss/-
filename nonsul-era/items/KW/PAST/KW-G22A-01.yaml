intent: |
  [1] 다항식의 인수분해 능력을 평가하고, 복잡한 형태의 두 자연수의 곱으로 나타나는 자연수의 소인수분해를 위해 다항식의 인수분해를 활용하는 능력을 판단한다. [2] 좌표평면에서 이차곡선의 점과 직선과의 거리를 이해하고 계산할 수 있는 능력과 이를 활용하여 삼각형의 넓이를 찾는 과정을 설명할 수 있는 능력을 판단한다. [3] 이차함수에 있어서 판별식을 이해하고 활용할 수 있는 능력을 판단한다. 삼차함수의 증가, 감소와 관련한 문제에 대해 미분을 활용하여 해결해나가는 과정을 설명할 수 있는 능력을 판단한다. [4] 타원의 정의와 기본 성질을 이해하는 능력을 판단한다. 이를 행성의 궤도라는 응용문제에 적용하여 해결해 나가는 과정과 설명 능력을 판단한다. 타원 안의 일부 면적을 치환적분을 활용하여 해결하고 설명하는 능력을 판단한다. (광운대 공식 '문제 해설' 출제 의도)
key_idea: |
  $11\times13\times15\times17$을 $x=11$의 사차식으로 보고 치환($t=x^2+6x$)으로 인수분해해 두 수의 합을 $(x+3)^2$ 공통인수로 묶는다. 점과 직선 사이의 거리로 삼각형 넓이를 $b$의 이차식으로 쓰고 완전제곱 꼴로 최소를 구한다. 타원의 매개변수 표현 $x=10\cos\theta$, $y=6\sin\theta$로 접선·거리·넓이를 처리한다.
stuck: |
  [4](4)에서 넓이를 '적분 + 삼각형'으로 분해하고 $x=10\cos\theta$ 치환 때 구간 방향($\frac{\pi}{4}\to0$)과 부호를 정리하는 단계
