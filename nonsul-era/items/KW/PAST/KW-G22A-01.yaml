stimuli:
- label: '1'
  body: |
    1. 함수의 증가와 감소
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 그 구간에 속하는 모든 $x$에서
    $f^{\prime}(x)>0$이면 $f(x)$는 그 구간에서 증가한다.
    $f^{\prime}(x)<0$이면 $f(x)$는 그 구간에서 감소한다.
- label: '2'
  body: |
    2. 타원
    평면의 두 점 $\mathrm{F}$와 $\mathrm{F}^{\prime}$로부터 거리의 합이 일정한 점들의 집합을 타원이라고 한다. 이때 두 점 $\mathrm{F}$와 $\mathrm{F}^{\prime}$을 타원의 초점이라고 한다.
- label: '3'
  body: |
    3. 치환적분법을 이용한 정적분
    미분가능한 함수 $g(x)$의 도함수 $g^{\prime}(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속이고, $g(a)=\alpha$와 $g(b)=\beta$에 대하여 함수 $f(x)$가 $\alpha$와 $\beta$를 포함한 구간에서 연속일 때 다음이 성립한다.
    $$\int_a^bf(g(x))g^{\prime}(x)\,dx=\int_\alpha^\beta f(t)\,dt$$
stem: |
  [문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: '1'
  stem: |
    [1] 다항식의 인수분해를 이용하여 자연수 $N=(11\times13\times15\times17-9)+(11^3+5\times11^2+3\times11-9)$를 소인수분해하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: 2**4*7**4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $11=x$라 하자. 자연수 $A=11\times13\times15\times17-9$는 $x(x+2)(x+4)(x+6)-9=(x^2+6x)(x^2+6x+8)-9$로 나타낼 수 있다.
        $x^2+6x=t$라 하면 $t(t+8)-9=t^2+8t-9=(t-1)(t+9)=(x^2+6x-1)(x^2+6x+9)=(x^2+6x-1)(x+3)^2\ (=186\times14^2)\cdots①$
        (다른 풀이) $14=x$라 하면 $A=(x-3)(x-1)(x+1)(x+3)-9=(x^2-1)(x^2-9)-9=x^4-10x^2=x^2(x^2-10)\ (=14^2\times186)$.
      source_flow: 해설 p.9~11
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        자연수 $B=11^3+5\times11^2+3\times11-9$는 $x^3+5x^2+3x-9=(x-1)(x^2+6x+9)=(x-1)(x+3)^2\ (=10\times14^2)\cdots②$로 나타낼 수 있다.
      source_flow: 해설 p.9~11
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        ①과 ②로부터 $N=A+B=(x^2+6x-1)(x+3)^2+(x-1)(x+3)^2=(x^2+7x-2)(x+3)^2\ (=196\times14^2)$이다.
        $x=11$을 대입하면 $N=196\times14^2=2^2\times7^2\times2^2\times7^2=2^4\times7^4$이다.
      source_flow: 해설 p.9~11
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $11\times13\times15\times17-9$로부터 $(x^2+6x-1)(x+3)^2\ (=186\times14^2)$을 보였다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $11^3+5\times11^2+3\times11-9$로부터 $(x-1)(x+3)^2\ (=10\times14^2)$을 보였다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $2^4\times7^4$을 찾았다.
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-1
  stem: |
    [2] 좌표평면에서 점 $\mathrm{A}(-1,3)$과 원점 $\mathrm{O}(0,0)$ 및 포물선 $y=x^2-7x+12$의 점 $\mathrm{B}(b,c)$를 꼭짓점으로 하는 삼각형 $\mathrm{AOB}$에 대하여 다음 물음에 답하시오.

    (1) 점 $\mathrm{B}(b,c)$와 직선 $\mathrm{AO}$ 사이의 거리를 $b$에 관한 식으로 나타내시오. [4점]
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: (b**2-4*b+12)/sqrt(10)
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        직선 $\mathrm{AO}$의 식은 $y=-3x$, 곧 $3x+y=0$이다. $c=b^2-7b+12$이므로 점 $\mathrm{B}(b,c)$와 직선 $3x+y=0$ 사이의 거리는 $\dfrac{\lvert3b+c\rvert}{\sqrt{3^2+1^2}}=\dfrac{\lvert3b+b^2-7b+12\rvert}{\sqrt{10}}=\dfrac{\lvert b^2-4b+12\rvert}{\sqrt{10}}=\dfrac{\lvert(b-2)^2+8\rvert}{\sqrt{10}}$이다.
      source_flow: 해설 p.9~11
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        그런데 $(b-2)^2+8>0$이므로, 찾는 거리는 $\dfrac{(b-2)^2+8}{\sqrt{10}}=\dfrac{b^2-4b+12}{\sqrt{10}}$이다.
      source_flow: 해설 p.9~11
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 3
      evidence: |
        점 $\mathrm{B}(b,c)$와 직선 $3x+y=0$ 사이의 거리 $\dfrac{\lvert3b+c\rvert}{\sqrt{3^2+1^2}}$를 찾았다.
      depends_on: []
      implied_ok: false
      steps:
      - 21b-1
    - id: 2-1.A1
      mark_type: A
      points: 1
      evidence: |
        거리 $\dfrac{b^2-4b+12}{\sqrt{10}}$를 찾았다.
      depends_on:
      - 2-1.M1
      steps:
      - 21b-2
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (2) 삼각형 $\mathrm{AOB}$의 넓이를 $b$에 관한 식으로 나타내고, 삼각형 $\mathrm{AOB}$의 넓이의 최솟값을 찾으시오. [4점]
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: area=(b-2)**2/2+4; min=4
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $\overline{\mathrm{AO}}=\sqrt{(-1)^2+3^2}=\sqrt{10}$이므로, (1)에 의해 삼각형 $\mathrm{AOB}$의 넓이는 다음과 같다.
        $\triangle\mathrm{AOB}=\dfrac12\times\overline{\mathrm{AO}}\times\{\text{점 }\mathrm{B}(b,c)\text{와 직선 }3x+y=0\text{ 사이의 거리}\}=\dfrac12\times\sqrt{10}\times\dfrac{(b-2)^2+8}{\sqrt{10}}=\dfrac{(b-2)^2+8}{2}=\dfrac12(b-2)^2+4$
      source_flow: 해설 p.9~11
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        따라서 삼각형 $\mathrm{AOB}$의 넓이의 최솟값은 $4$이다($b=2$일 때).
        (최소 넓이에 관한 다른 풀이) 직선 $\mathrm{AO}$를 평행이동시켜 포물선과 접하는 점을 구한다. 직선 $\mathrm{AO}$의 기울기는 $-3$이고 $y'=2x-7=-3$에서 $x=2$, 이때 $y=2$이므로 접점은 $(2,2)$이다. 점 $(2,2)$와 직선 $3x+y=0$ 사이의 거리는 $\dfrac{3\times2+2}{\sqrt{10}}=\dfrac{8}{\sqrt{10}}$이고 $\overline{\mathrm{AO}}=\sqrt{10}$이므로 $\triangle\mathrm{AOB}=\dfrac12\times\sqrt{10}\times\dfrac{8}{\sqrt{10}}=4$이다.
      source_flow: 해설 p.9~11
      criteria:
      - 2-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 3
      evidence: |
        $\triangle\mathrm{AOB}=\dfrac12\times\sqrt{10}\times\dfrac{(b-2)^2+8}{\sqrt{10}}$을 찾았다.
      depends_on: []
      implied_ok: false
      steps:
      - 22b-1
    - id: 2-2.A1
      mark_type: A
      points: 1
      evidence: |
        삼각형 $\mathrm{AOB}$의 넓이의 최솟값이 $4$임을 찾았다.
      depends_on:
      - 2-2.M1
      steps:
      - 22b-2
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-1
  stem: |
    [3] 두 함수 $f(x)=x^2+4$와 $g(x)=kx+1$에 대하여 다음을 찾으시오.

    (1) 함수 $\dfrac{1}{f(x)-g(x)}$가 모든 실수 $x$에서 정의되기 위한 상수 $k$의 값의 범위 [4점]
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: -2*sqrt(3)<k<2*sqrt(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        분모 $f(x)-g(x)=x^2-kx+3$이 $0$이 되면 안 되므로, $D=k^2-12<0$이어야 한다.
      source_flow: 해설 p.9~11
      criteria:
      - 3-1.M1
    - id: 31b-2
