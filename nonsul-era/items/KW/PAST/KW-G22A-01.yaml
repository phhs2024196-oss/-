- id: 4-2
  stem: |
    (2) 선분 $\mathrm{OE}$와 $x$축의 양의 방향이 이루는 각의 크기를 $\theta$라고 할 때, 매개변수 $\theta$로 (1)의 타원의 방정식을 $x=a\cos\theta$, $y=b\sin\theta$ $(0\le\theta<2\pi)$로 나타낼 수 있다. 이때, 두 양수 $a$와 $b$의 값과 $\theta=\dfrac{\pi}{3}$에 대응하는 점에서의 타원의 접선의 방정식 [7점]
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: a=10; b=6; tangent_y=-sqrt(3)/5*x+4*sqrt(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        행성의 좌표 $(x,y)=(a\cos\theta,b\sin\theta)$를 타원의 방정식에 대입하면 $\dfrac{x^2}{100}+\dfrac{y^2}{36}=\dfrac{a^2\cos^2\theta}{100}+\dfrac{b^2\sin^2\theta}{36}=1$이다.
        $\theta=0$일 때, $a^2=100$이고 $a>0$이므로 $a=10$이다. $\theta=\dfrac{\pi}{2}$일 때, $b^2=36$이고 $b>0$이므로 $b=6$이다.
      source_flow: 해설 p.9~11
      criteria:
      - 4-2.B1
    - id: 42b-2
      content: |
        $\theta=\dfrac{\pi}{3}$일 때, 접점은 $(x,y)=(5,3\sqrt3)$이다.
      source_flow: 해설 p.9~11
      criteria:
      - 4-2.B2
    - id: 42b-3
      content: |
        매개변수로 나타낸 함수의 미분법을 이용하면 $\dfrac{dy}{dx}=\dfrac{\dfrac{dy}{d\theta}}{\dfrac{dx}{d\theta}}=-\dfrac{6\cos\theta}{10\sin\theta}=-\dfrac{3\cos\theta}{5\sin\theta}$이다. $\theta=\dfrac{\pi}{3}$일 때 기울기는 $-\dfrac{\sqrt3}{5}$이다.
      source_flow: 해설 p.9~11
      criteria:
      - 4-2.M1
    - id: 42b-4
      content: |
        따라서 $\theta=\dfrac{\pi}{3}$일 때, 타원의 접선의 방정식은 $y=-\dfrac{\sqrt3}{5}(x-5)+3\sqrt3=-\dfrac{\sqrt3}{5}x+4\sqrt3$이다.
        (접선의 방정식에 대한 다른 풀이) 접점이 $(5,3\sqrt3)$이므로 타원에 있는 점에서의 접선의 방정식 공식을 사용하면 $\dfrac{5x}{100}+\dfrac{3\sqrt3y}{36}=1$이고 이를 정리하면 $y=-\dfrac{\sqrt3}{5}x+4\sqrt3$이다.
      source_flow: 해설 p.9~11
      criteria:
      - 4-2.A1
