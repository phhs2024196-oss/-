        (1)의 결과로부터 구간 $(0,1)$에서 $-1<\sqrt{x}\ln\lvert x\rvert<0$이 성립한다. 양변에 $\sqrt{x}$를 곱하면 $-\sqrt{x}<x\ln\lvert x\rvert<0$이다. $\displaystyle\lim_{x\to0+}\sqrt{x}=0$이므로, 함수의 극한의 대소 관계에 의해 $\displaystyle\lim_{x\to0+}f(x)=0$이다.
      source_flow: 해설 p.16~18
