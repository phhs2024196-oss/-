    method_no: 1
    steps:
    - id: 33b-1
      content: |
        함수 $f(x)$는 $x=0$을 제외한 모든 실수 $x$에서 미분가능하며, $f^{\prime}(x)=k(\ln\lvert x\rvert+1)$이다.
      source_flow: 해설 p.16~18
      criteria:
      - 3-3.B1
    - id: 33b-2
      content: |
        $f^{\prime}(x)=0$의 근은 $x=\pm e^{-1}$이다. 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.
        $x<-e^{-1}$에서 $f^{\prime}(x)>0$(증가), $x=-e^{-1}$에서 $f(x)=ke^{-1}$(극대), $-e^{-1}<x<0$에서 $f^{\prime}(x)<0$(감소), $x=0$은 정의되지 않고 $f(x)$는 $0$에 수렴, $0<x<e^{-1}$에서 $f^{\prime}(x)<0$(감소), $x=e^{-1}$에서 $f(x)=-ke^{-1}$(극소), $x>e^{-1}$에서 $f^{\prime}(x)>0$(증가)
      source_flow: 해설 p.16~18
      criteria:
      - 3-3.M1
    - id: 33b-3
      content: |
        오른쪽에 있는 함수 $y=f(x)$의 그래프 개형과 직선 $y=t$와의 교점을 헤아려 보면 함수 $g(t)$는 다음과 같다.
        $g(t)=1\ (t<-ke^{-1})$, $2\ (t=-ke^{-1})$, $3\ (-ke^{-1}<t<0)$, $2\ (t=0)$, $3\ (0<t<ke^{-1})$, $2\ (t=ke^{-1})$, $1\ (ke^{-1}<t)$
        따라서 함수 $g(t)$의 불연속인 $t$의 값과 그 함숫값 $g(t)$의 순서쌍들은 $(-ke^{-1},2)$, $(0,2)$, $(ke^{-1},2)$이다.
      source_flow: 해설 p.16~18
      criteria:
      - 3-3.A1
