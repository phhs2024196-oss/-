  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        위의 (1)에 의해 각 자연수 $n$에 대해 다음이 성립한다.
        $\dfrac{n+2}{n!+(n+1)!+(n+2)!}=\dfrac{n+1}{(n+2)!}=\dfrac{1}{(n+1)!}-\dfrac{1}{(n+2)!}$
      source_flow: 해설 p.16~18
      criteria:
      - 2-2.M1
