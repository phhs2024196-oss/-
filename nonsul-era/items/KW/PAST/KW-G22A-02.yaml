  - id: S34-B
    audience: B
    method_no: 1
    steps:
    - id: 34b-1
      content: |
        양수 $k$에 대하여 확률밀도함수 $f(x)=kx\ln\lvert x\rvert$은 위 (3)에서 살펴본 바와 같이 구간 $\left(-1\le x\le-\dfrac{1}{\sqrt{e}}\right)$에서 $f(x)\ge0$이다.
      source_flow: 해설 p.16~18
      criteria:
      - 3-4.R1
    - id: 34b-2
      content: |
        또한 확률밀도함수 $f(x)$는 $\displaystyle\int_{-1}^{-\frac{1}{\sqrt{e}}}f(x)\,dx=1$을 만족시켜야 한다. 부분적분법으로 계산하면 다음을 얻는다.
        $\displaystyle\int_{-1}^{-\frac{1}{\sqrt{e}}}f(x)\,dx=\int_{-1}^{-\frac{1}{\sqrt{e}}}kx\ln(-x)\,dx=k\left[\dfrac12x^2\ln(-x)\right]_{-1}^{-\frac{1}{\sqrt{e}}}-k\int_{-1}^{-\frac{1}{\sqrt{e}}}\dfrac12x\,dx$
      source_flow: 해설 p.16~18
      criteria:
      - 3-4.M1
    - id: 34b-3
      content: |
        $=-\dfrac{k}{4e}-\dfrac{k}{4}\left[x^2\right]_{-1}^{-\frac{1}{\sqrt{e}}}=\dfrac{k}{4}\left(1-\dfrac{2}{e}\right)=\dfrac{k(e-2)}{4e}=1$
        따라서 찾는 값은 $k=\dfrac{4e}{e-2}$이다.
      source_flow: 해설 p.16~18
      criteria:
      - 3-4.A1
  rubric:
