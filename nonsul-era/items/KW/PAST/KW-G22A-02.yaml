intent: |
  [1] 세 실근을 등차수열로 표현하고 이를 이용하여 삼차방정식을 완성할 수 있는 능력과 미정계수법을 활용하여 삼차방정식의 계수와 세 실근을 계산하고 찾는 과정을 설명할 수 있는 능력을 판단한다. [2] 계승으로 주어진 식을 간단한 식으로 변환할 수 있는 능력과 부분분수를 활용하여 급수의 합을 찾는 계산 능력과 그 과정을 설명할 수 있는 능력을 판단한다. [3] 미분을 활용하여 두 함수의 대소 관계를 판정할 수 있는 능력과 그 결과를 바탕으로 원점에서 정의되지 않는 함수에 대해 극한값을 찾는 능력을 판단한다. 함수의 그래프 개형을 미분을 활용하여 해결해나가는 능력을 판단한다. 확률밀도함수에 대한 기본적인 이해를 묻고 실제 함수에 활용하는 능력을 판단한다. (광운대 공식 '문제 해설' 출제 의도)
key_idea: |
  세 실근 $a-d,a,a+d$로 계수비교, 계승식을 $\dfrac{n+1}{(n+2)!}=\dfrac{1}{(n+1)!}-\dfrac{1}{(n+2)!}$로 바꿔 소거합을 구한다. $h(x)=\ln\lvert x\rvert+\dfrac1{\sqrt x}$의 최솟값으로 부등식을 얻고 조임 정리로 $x=0$ 극한을 구한 뒤, 극값 $\pm ke^{-1}$로 수평선과의 교점 개수 $g(t)$를 센다.
stuck: |
  [3](3)에서 $x=0$이 정의되지 않음을 반영해 $t=0$, $t=\pm ke^{-1}$에서의 교점 개수를 각각 세고 불연속점을 판정하는 단계
