    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $h(x)=\ln\lvert x\rvert+\dfrac{1}{\sqrt{x}}$라 하자. 함수 $h(x)$는 구간 $0<x<1$에서 미분가능하고 $h^{\prime}(x)=\dfrac1x-\dfrac{1}{2x\sqrt{x}}=\dfrac{2\sqrt{x}-1}{2x\sqrt{x}}$이다.
      source_flow: 해설 p.16~18
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        주어진 구간에서 $h^{\prime}(x)=0$의 근은 $x=\dfrac14$뿐이다. 함수 $h(x)$의 증가와 감소를 표로 나타내면 $x=\dfrac14$의 좌우에서 $h^{\prime}(x)$의 부호가 $-$에서 $+$로 바뀌어 $0<x<\dfrac14$에서 감소, $\dfrac14<x<1$에서 증가한다.
      source_flow: 해설 p.16~18
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        함수 $h(x)$의 최솟값은 $h\left(\dfrac14\right)=-\ln4+2=\ln\dfrac{e^2}{4}>0$이므로, 구간 $0<x<1$에서 $\ln\lvert x\rvert>-\dfrac{1}{\sqrt{x}}$이다.
      source_flow: 해설 p.16~18
      criteria:
      - 3-1.A1
