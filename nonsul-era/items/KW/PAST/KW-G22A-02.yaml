  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-3
  stem: |
    (3) 주어진 방정식의 세 실근 [4점]
  points: 4
  depends_on: []
  answer:
    kind: set
    value: 3-sqrt(5), 3, 3+sqrt(5)
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        (2)에 의해 $c=22$이므로 주어진 방정식은 $x^3-9x^2+22x-12=0$이다.
        (1)에 의해 $x=3$은 이 방정식의 근이므로, 인수정리에 의해 $x^3-9x^2+22x-12$는 $x-3$에 의해 나누어떨어진다. 실제로 나누거나 조립제법에 의해 $x^3-9x^2+22x-12=(x-3)(x^2-6x+4)$를 얻는다.
      source_flow: 해설 p.16
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        이에 따라 $(x-3)(x^2-6x+4)=0$이므로, 주어진 방정식의 세 근은 $3-\sqrt5$, $3$, $3+\sqrt5$이다.
        (다른 풀이) 위의 (1)에서 구한 $a$와 위 (2)의 다른 풀이의 방법으로 구한 $d=\pm\sqrt5$를 $a-d$, $a$, $a+d$에 대입하여 구할 수도 있다.
      source_flow: 해설 p.16
      criteria:
      - 1-3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 2
      evidence: |
        $x^3-9x^2+22x-12=(x-3)(x^2-6x+4)$를 찾았거나 $d=\pm\sqrt5$를 찾았다.
      depends_on: []
      implied_ok: false
      steps:
      - 13b-1
    - id: 1-3.A1
      mark_type: A
      points: 2
      evidence: |
        세 실근 $3-\sqrt5$, $3$, $3+\sqrt5$를 찾았다.
      depends_on:
      - 1-3.M1
      steps:
      - 13b-2
    deductions: []
