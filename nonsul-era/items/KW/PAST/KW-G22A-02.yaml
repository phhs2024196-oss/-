    - id: 32b-2
      content: |
        극한 $\displaystyle\lim_{x\to0-}f(x)$에서 $x=-t$로 치환하고 $f(-x)=-kx\ln\lvert-x\rvert=-kx\ln\lvert x\rvert=-f(x)$를 이용하면 $\displaystyle\lim_{x\to0-}f(x)=\lim_{t\to0+}f(-t)=-\lim_{t\to0+}f(t)=0$이다.
