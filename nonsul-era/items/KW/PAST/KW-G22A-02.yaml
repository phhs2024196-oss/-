stimuli:
- label: '1'
  body: |
    1. 함수 극한의 대소 관계
    두 함수 $f(x)$와 $g(x)$에 대하여 $\displaystyle\lim_{x\to a}f(x)=L$이고 $\displaystyle\lim_{x\to a}g(x)=M$ ($L$, $M$은 실수)일 때, $a$에 가까운 $x$의 모든 값과 함수 $h(x)$에 대하여 $f(x)\le h(x)\le g(x)$이고 $L=M$이면 $\displaystyle\lim_{x\to a}h(x)=L$이다.
- label: '2'
  body: |
    2. 확률밀도함수의 성질
    연속확률변수 $X$의 확률밀도함수 $f(x)$ $(\alpha\le x\le\beta)$에 대하여
    ① $f(x)\ge0$
    ② $f(x)$의 그래프와 $x$축 및 두 직선 $x=\alpha$와 $x=\beta$로 둘러싸인 부분의 넓이는 $1$이다.
    ③ 두 상수 $a$와 $b$ $(\alpha\le a\le b\le\beta)$에 대하여 $\mathrm{P}(a\le X\le b)$는 $f(x)$의 그래프와 $x$축 및 두 직선 $x=a$와 $x=b$로 둘러싸인 부분의 넓이와 같다.
- label: '3'
  body: |
    3. 부분적분법을 이용한 정적분
    미분가능한 두 함수 $f(x)$와 $g(x)$에 대하여 $f^{\prime}(x)$와 $g^{\prime}(x)$가 닫힌구간 $[a,b]$에서 연속일 때 다음이 성립한다.
    $$\int_a^bf(x)g^{\prime}(x)\,dx=\left[f(x)g(x)\right]_a^b-\int_a^bf^{\prime}(x)g(x)\,dx$$
stem: |
  [문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: 1-1
  stem: |
    [1] 삼차방정식 $x^3-9x^2+cx-12=0$의 세 실근은 등차수열을 이룬다. 이때 다음을 찾으시오.

    (1) 등차수열을 이루는 세 실근의 등차중항 [4점]
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        세 실근을 $a-d$, $a$, $a+d$라고 하자. 그러면 다음을 얻는다.
        $(x-a)(x-a+d)(x-a-d)=(x-a)(x^2-2ax+a^2-d^2)=x^3-3ax^2+(3a^2-d^2)x-a^3+ad^2$
      source_flow: 해설 p.16
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $a-d$, $a$, $a+d$가 주어진 삼차방정식의 세 실근이므로 $x^3-9x^2+cx-12=x^3-3ax^2+(3a^2-d^2)x-a^3+ad^2$이 성립한다. 그러면 계수비교에 의해 $9=3a$이므로 $a=3$이다.
      source_flow: 해설 p.16
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        세 실근을 $a-d$, $a$, $a+d$라고 하고 삼차방정식 $x^3-3ax^2+(3a^2-d^2)x-a^3+ad^2$을 찾았다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        계수비교에 의해 등차중항 $a=3$을 찾았다.
      depends_on:
      - 1-1.M1
      steps:
      - 11b-2
    deductions: []
