  misconceptions: []
- id: 1-2
  stem: |
    (2) 상수 $c$의 값 [3점]
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '22'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $a=3$이 주어진 방정식의 근이므로 다음을 얻는다.
        $3^3-9\times3^2+3c-12=0$, $3c=-27+81+12=66$, $c=22$
        (다른 풀이) 위의 답안에서 두 삼차방정식의 일차항과 상수항의 계수비교에 의해 $a=3$이므로 $c=3a^2-d^2=27-d^2$과 $-12=-a^3+ad^2=-27+3d^2$을 얻는다. 위 두 번째 식으로부터 $d^2=5$를 얻고 위 첫 번째 식으로부터 $c=22$를 얻는다.
      source_flow: 해설 p.16
      criteria:
      - 1-2.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.B1
      mark_type: B
      points: 3
      evidence: |
        $a=3$을 대입하여 $c=22$를 찾았다.
      depends_on: []
      steps:
      - 12b-1
    deductions: []
