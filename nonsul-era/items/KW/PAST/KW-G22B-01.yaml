  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (2) 정적분 $\displaystyle\int_0^{\pi}\dfrac{\sin x}{1+\cos^2x}\,dx$의 값을 찾으시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: pi/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        정적분 $\displaystyle\int_0^{\pi}\dfrac{\sin x}{1+\cos^2x}\,dx$에서 $\cos x=t$로 치환하면 $\dfrac{dt}{dx}=-\sin x$이고 적분의 아래끝은 $1$이며 위끝은 $-1$로 바뀌므로 다음이 성립한다.
        $\displaystyle\int_0^{\pi}\dfrac{\sin x}{1+\cos^2x}\,dx=-\int_1^{-1}\dfrac{1}{1+t^2}\,dt=\int_{-1}^{1}\dfrac{1}{1+t^2}\,dt=2\int_0^1\dfrac{1}{1+t^2}\,dt$
      source_flow: 해설 p.10
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        이제 $t=\tan\theta\ \left(0\le\theta\le\dfrac{\pi}{4}\right)$로 치환하면 $\dfrac{dt}{d\theta}=\sec^2\theta$이고 적분의 아래끝은 $0$이며 위끝은 $\dfrac{\pi}{4}$로 바뀌므로
        $2\displaystyle\int_0^1\dfrac{1}{1+t^2}\,dt=2\int_0^{\frac{\pi}{4}}\dfrac{\sec^2\theta}{\sec^2\theta}\,d\theta=2\int_0^{\frac{\pi}{4}}d\theta=\dfrac{\pi}{2}$이다.
        따라서 $\displaystyle\int_0^{\pi}\dfrac{\sin x}{1+\cos^2x}\,dx=\dfrac{\pi}{2}$이다.
      source_flow: 해설 p.10
      criteria:
      - 2-2.A1
