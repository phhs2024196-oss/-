- id: 3-1
  stem: |
    [3] 오른쪽 그림과 같이 한 변의 길이가 $1$인 정사각형의 두 변이 두 좌표축에 놓여 있다. 이 정사각형의 오른쪽으로 $x$축에 놓이면서 한 변의 길이가 절반인 정사각형들을 계속해서 추가한다. $n$번째 정사각형의 오른쪽 위 꼭짓점을 $\mathrm{P}_n(a_n,b_n)$이라고 할 때, 다음 물음에 답하시오.

    [그림: $x$축과 $y$축이 있고 한 변의 길이가 $1$인 정사각형의 오른쪽 위 꼭짓점이 $\mathrm{P}_1$. 그 오른쪽에 변의 길이 $\dfrac12$, $\dfrac14$인 정사각형이 차례로 이어져 오른쪽 위 꼭짓점이 $\mathrm{P}_2$, $\mathrm{P}_3$. $x$축 눈금 $1$, $\dfrac32$, $\dfrac74$, $y$축 눈금 $1$, 점선과 말줄임표]

    (1) 점 $\mathrm{P}_n$의 좌표 $(a_n,b_n)$을 찾고, 모든 자연수 $n$에 대하여 $\dfrac{a_n}{b_n}$이 홀수임을 증명하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: expression
    value: a_n=2-(1/2)**(n-1); b_n=(1/2)**(n-1); ratio=2**n-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        점 $\mathrm{P}_n$의 $y$좌표는 첫째항이 $1$이고 공비가 $\dfrac12$인 등비수열이므로 $b_n=\left(\dfrac12\right)^{n-1}$이고
      source_flow: 해설 p.10
      criteria:
      - 3-1.B1
    - id: 31b-2
      content: |
        점 $\mathrm{P}_n$의 $x$좌표는 $a_n=\displaystyle\sum_{k=1}^{n}b_k=\sum_{k=1}^{n}\left(\dfrac12\right)^{k-1}=2-\left(\dfrac12\right)^{n-1}$이므로 점 $\mathrm{P}_n$의 좌표는 $\left(2-\left(\dfrac12\right)^{n-1},\left(\dfrac12\right)^{n-1}\right)$이다.
      source_flow: 해설 p.10
      criteria:
      - 3-1.M1
    - id: 31b-3
      content: |
        따라서 $\dfrac{a_n}{b_n}=\dfrac{2-\left(\dfrac12\right)^{n-1}}{\left(\dfrac12\right)^{n-1}}=2^n-1$이고 모든 자연수 $n$에서 $2^n$은 짝수이므로 $\dfrac{a_n}{b_n}=2^n-1$은 홀수이다.
      source_flow: 해설 p.10
      criteria:
      - 3-1.R1
