stimuli:
- label: '1'
  body: |
    1. 이차방정식의 근의 판별
    계수가 실수인 이차방정식 $ax^2+bx+c=0\ (a\ne0)$에서 $D=b^2-4ac$라고 할 때,
    $D>0$이면 서로 다른 두 실근이 있다.
    $D=0$이면 중근이 있다.
    $D<0$이면 서로 다른 두 허근이 있다.
- label: '2'
  body: |
    2. 치환적분법을 이용한 정적분
    미분가능한 함수 $g(x)$의 도함수 $g^{\prime}(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속이고, $g(a)=\alpha$와 $g(b)=\beta$에 대하여 함수 $f(x)$가 $\alpha$와 $\beta$를 포함하는 구간에서 연속일 때 다음이 성립한다.
    $$\int_a^bf(g(x))g^{\prime}(x)\,dx=\int_\alpha^\beta f(t)\,dt$$
stem: |
  [문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: 1-1
  stem: |
    [1] (1) 다음 조건 (i)과 (ii)를 만족시키는 두 실수 $b$와 $c$에 대해 $(b,c)$를 좌표로 하는 점 전체로 이루어진 영역을 그림 또는 식으로 나타내시오. [3점]

    (i) $0\le b\le2$, $0\le c\le2$
    (ii) 이차방정식 $x^2+bx+c=0$의 실근이 있다.
  points: 3
  depends_on: []
  answer:
    kind: expression
    value: 0<=b<=2, 0<=c<=b**2/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        이차방정식 $x^2+bx+c=0$의 실근이 있기 위한 필요충분조건은 $b^2-4c\ge0$이므로 $c\le\dfrac{b^2}{4}$이다.
      source_flow: 해설 p.8~9
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        조건 (i)에서 $0\le b\le2$이고 $0\le c\le2$이므로 $0\le c\le\dfrac{b^2}{4}$이다. 따라서 문제의 조건을 모두 만족시키는 영역은 포물선 $y=\dfrac{x^2}{4}$과 $x$축 및 직선 $x=2$로 둘러싸인 영역이다. 이를 "$0\le x\le2$, $0\le y\le\dfrac{x^2}{4}$" 또는 $\left\{(x,y)\mid0\le x\le2,\ 0\le y\le\dfrac{x^2}{4}\right\}$와 같이 나타낼 수도 있다.
      source_flow: 해설 p.8~9
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 1
      evidence: |
        두 실수 $b$와 $c$ 사이의 관계식 $c\le\dfrac{b^2}{4}$을 얻었다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        조건의 영역 $0\le x\le2$, $0\le y\le\dfrac{x^2}{4}$을 그림이나 식으로 표현했다.
      depends_on:
      - 1-1.M1
      steps:
      - 11b-2
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) 점 $\mathrm{A}(2,0)$을 지나는 직선이 (1)의 영역을 왼쪽과 오른쪽으로 넓이의 비가 $5:11$이 되도록 나눌 때, 그 직선의 방정식을 찾으시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: expression
    value: y=-x/4+1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        (1)의 영역의 넓이는 $S=\displaystyle\int_0^2\dfrac{x^2}{4}\,dx=\left[\dfrac{x^3}{12}\right]_0^2=\dfrac{8}{12}=\dfrac23$이다.
        점 $\mathrm{A}(2,0)$을 지나는 직선이 포물선 $y=\dfrac{x^2}{4}$과 만나는 점의 $x$좌표를 $a$라 하면, 이 직선이 나눈 (1)의 영역의 왼쪽 부분의 넓이는 $S_1=\displaystyle\int_0^a\dfrac{x^2}{4}\,dx+\dfrac12\times(2-a)\times\dfrac{a^2}{4}=\dfrac{a^3}{12}+\dfrac18a^2(2-a)$이다.
      source_flow: 해설 p.8~9
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        이 직선이 영역의 넓이를 $5:11$로 나누므로 $S_1=\dfrac{5}{16}S$에서 다음을 얻는다.
        $\dfrac{a^3}{12}+\dfrac18a^2(2-a)=\dfrac{5}{16}\times\dfrac23=\dfrac{5}{24}$, $-\dfrac{a^3}{24}+\dfrac{a^2}{4}-\dfrac{5}{24}=0$, $a^3-6a^2+5=(a-1)(a^2-5a-5)=0$
        $a$의 값이 될 수 있는 $1$ 또는 $\dfrac{5\pm3\sqrt5}{2}$ 중에서, 조건 $0\le a\le2$를 만족시키는 $a$의 값은 $1$뿐이다.
      source_flow: 해설 p.8~9
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        따라서 직선과 포물선의 교점은 $\left(1,\dfrac14\right)$이므로, 찾는 직선의 방정식은 $y=-\dfrac14x+\dfrac12$이다.
      source_flow: 해설 p.8~9
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: |
        영역의 넓이를 변수를 이용하여 표현했다(예: $S_1=\dfrac{a^3}{12}+\dfrac18a^2(2-a)$).
      depends_on: []
      implied_ok: false
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 3
      evidence: |
        넓이의 비를 이용하여 방정식($a^3-6a^2+5=0$)을 얻고 알맞은 $a=1$을 찾았다.
      depends_on:
      - 1-2.M1
      implied_ok: false
      steps:
      - 12b-2
    - id: 1-2.A1
      mark_type: A
      points: 1
      evidence: |
        직선의 방정식 $y=-\dfrac14x+\dfrac12$을 얻었다.
      depends_on:
      - 1-2.M1
      - 1-2.M2
      steps:
      - 12b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-1
  stem: |
    [2] 함수 $f(x)$가 $0\le x\le\pi$에서 정의된 연속함수일 때, 다음 물음에 답하시오.

    (1) 함수 $y=f(x)$의 그래프를 $y$축에 대하여 대칭이동한 뒤에, $x$축의 방향으로 $\pi$만큼 평행이동한 것이 그래프인 함수를 $g(x)$라고 할 때, $\displaystyle\int_0^{\pi}f(x)\,dx=\int_0^{\pi}g(x)\,dx$임을 증명하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: proof
    value: g(x)=f(pi-x) 이고 치환 pi-x=t 로 int_0^pi f = int_0^pi g
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        함수 $y=f(x)$의 그래프를 $y$축에 대하여 대칭이동한 식은 $y=f(-x)$이다. 이것을 다시 $x$축의 방향으로 $\pi$만큼 평행이동한 식은 $y=f(-(x-\pi))=f(\pi-x)$이다. 따라서 $g(x)=f(\pi-x)$이다.
      source_flow: 해설 p.9
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        여기서 $\pi-x=t$로 치환하면 $\dfrac{dt}{dx}=-1$이므로 다음을 얻는다.
        $\displaystyle\int_0^{\pi}g(x)\,dx=\int_0^{\pi}f(\pi-x)\,dx=-\int_{\pi}^{0}f(t)\,dt=\int_0^{\pi}f(t)\,dt=\int_0^{\pi}f(x)\,dx$
      source_flow: 해설 p.9
      criteria:
      - 2-1.R1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 3
      evidence: |
        대칭이동 후 평행이동된 함수 $g(x)=f(\pi-x)$를 얻었다.
      depends_on: []
      implied_ok: false
      steps:
      - 21b-1
    - id: 2-1.R1
      mark_type: R
      points: 3
      evidence: |
        $\displaystyle\int_0^{\pi}f(x)\,dx=\int_0^{\pi}g(x)\,dx$임을 증명했다.
      depends_on:
      - 2-1.M1
      steps:
      - 21b-2
    deductions: []
