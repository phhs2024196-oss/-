  solutions:
  - id: S33-B
    audience: B
    method_no: 1
    steps:
    - id: 33b-1
      content: |
        원점 $\mathrm{O}$과 $\mathrm{P}_n$ $(n\ge2)$을 지나는 직선이 $x$축의 양의 방향과 이루는 각을 $\theta_n$이라고 하면 $\tan\theta_n=\dfrac{b_n}{a_n}=\dfrac{1}{2^n-1}$이다.
        직선 $y=d_nx$가 $x$축의 양의 방향과 이루는 각을 $\phi_n$이라고 하면 $\tan\phi_n=d_n\ (d_n>0)$이므로 다음을 얻는다.
      source_flow: 해설 p.11
      criteria:
      - 3-3.M1
    - id: 33b-2
      content: |
        $d_n=\tan\phi_n=\tan(45^{\circ}+\theta_n)=\dfrac{\tan45^{\circ}+\tan\theta_n}{1-\tan45^{\circ}\cdot\tan\theta_n}=\dfrac{1+\dfrac{1}{2^n-1}}{1-\dfrac{1}{2^n-1}}=\dfrac{2^n}{2^n-2}=\dfrac{2^{n-1}}{2^{n-1}-1}$
        (다른 풀이) $\tan(\phi_n-\theta_n)=\dfrac{\tan\phi_n-\tan\theta_n}{1+\tan\phi_n\tan\theta_n}=\dfrac{d_n-\dfrac{1}{2^n-1}}{1+\dfrac{d_n}{2^n-1}}=\dfrac{d_n(2^n-1)-1}{(2^n-1)+d_n}=\tan45^{\circ}=1$이므로 $d_n=\dfrac{(2^n-1)+1}{(2^n-1)-1}=\dfrac{2^n}{2^n-2}=\dfrac{2^{n-1}}{2^{n-1}-1}$이다.
      source_flow: 해설 p.11
      criteria:
      - 3-3.A1
