intent: |
  [1] 좌표평면에서 조건을 만족시키는 영역을 이해하고 이를 수식으로 표현할 수 있는 능력을 평가한다. 그리고 직선과 이차곡선의 위치 관계를 이해하고 정적분의 개념을 이용하여 문제를 해결할 수 있는 능력을 평가한다. [2] 연속함수의 대칭이동과 평행이동을 이해하고 이를 수식으로 표현할 수 있는 능력을 평가한다. 그리고 치환적분법을 이용한 정적분의 계산 능력과 주어진 조건을 적용하여 새로운 응용문제를 해결할 수 있는 능력을 평가한다. [3] 수열의 개념을 이해하고 등비수열의 특징을 이용하여 문제의 조건에 맞는 좌표평면의 점의 좌표를 수학적으로 표현할 수 있는 능력과 등비급수의 합을 계산하는 능력을 평가한다. 그리고 좌표평면에서 두 직선 사이의 위치 관계를 이해하고 삼각함수를 이용하여 이를 표현할 수 있는 능력을 평가한다. [4] 규칙성이 있는 수열의 합을 일반적인 식으로 표현하고 이를 계산할 수 있는 능력을 평가한다. (광운대 공식 '문제 해설' 출제 의도)
key_idea: |
  판별식으로 영역을 $0\le c\le\dfrac{b^2}{4}$로 바꾸고 점 $\mathrm{A}$를 지나는 직선이 나누는 넓이를 접점의 $x$좌표 $a$로 표현해 삼차방정식을 푼다. $g(x)=f(\pi-x)$ 치환으로 $\int_0^\pi xh(x)\,dx=\dfrac\pi2\int_0^\pi h(x)\,dx$ 꼴을 만든다. 정사각형 열은 등비수열·등비급수, 각은 $\tan(45^{\circ}+\theta_n)$로 처리하고, $1+n^2+n^4$ 인수분해로 소거합을 구한다.
stuck: |
  [2](3)에서 $x$ 대신 $\pi-x$ 치환을 적용해 구하려는 적분 $I$에 대한 방정식 $I=\pi\int\cdots-I$를 세우는 단계
