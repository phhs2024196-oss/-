      content: |
        모든 자연수 $n$에 대하여 $1+n^2+n^4=(1+n^2)^2-n^2=(1-n+n^2)(1+n+n^2)$이므로 다음이 성립한다.
        $\dfrac{2n}{1+n^2+n^4}=\dfrac{1}{1-n+n^2}-\dfrac{1}{1+n+n^2}=\dfrac{1}{1+(n-1)n}-\dfrac{1}{1+n(n+1)}$
      source_flow: 해설 p.11
      criteria:
