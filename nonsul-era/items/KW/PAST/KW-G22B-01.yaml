    (3) $n\ge2$일 때, 다음을 만족시키는 양수 $d_n$을 찾으시오. [6점]

    원점 $\mathrm{O}$와 점 $\mathrm{P}_n$을 지나는 직선과 직선 $y=d_nx$ 사이의 각의 크기는 $45^{\circ}$이다.
  points: 6
