    - id: 4b-2
      content: |
        그러므로 다음을 얻는다.
        $\dfrac{4}{1+2^2+2^4}+\dfrac{6}{1+3^2+3^4}+\dfrac{8}{1+4^2+4^4}+\cdots+\dfrac{20}{1+10^2+10^4}=\left(\dfrac{1}{1+1\times2}-\dfrac{1}{1+2\times3}\right)+\left(\dfrac{1}{1+2\times3}-\dfrac{1}{1+3\times4}\right)+\cdots+\left(\dfrac{1}{1+9\times10}-\dfrac{1}{1+10\times11}\right)=\dfrac{1}{1+1\times2}-\dfrac{1}{1+10\times11}=\dfrac13-\dfrac{1}{111}=\dfrac{37-1}{111}=\dfrac{36}{111}=\dfrac{12}{37}$
      source_flow: 해설 p.11
      criteria:
      - 4.A1
