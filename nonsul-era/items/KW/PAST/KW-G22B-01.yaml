# 광운대 2022학년도 논술고사 자연계열(2교시) 문제 1 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 공식 채점기준표 [1](2) 표기 메모: 첫 행의 등식 '=-a^3/24+a^2/4-5/24'는 S_1-5/24 를 합쳐 쓴 표기(예시 답안은 '-a^3/24+a^2/4-5/24=0'). 원문 그대로 두고 evidence 에는 S_1 식만 적음.
