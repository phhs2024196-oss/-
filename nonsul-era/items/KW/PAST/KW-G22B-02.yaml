    (1) $a$와 $b$는 실수이고 $n$에 관한 이차식 $g(n)=an^2+bn$이 있어서 모든 자연수 $n$에서 $a_n=g(n)\times n!$이 성립한다고 할 때, 이차식 $g(n)$을 찾으시오. [4점]
