    - id: 42b-2
      content: |
        따라서 삼각함수의 덧셈정리에 따라 다음을 얻는다.
        $\overline{\mathrm{AD}}=2\times2\cos75^{\circ}=4\cos(45^{\circ}+30^{\circ})=4\cos45^{\circ}\cos30^{\circ}-4\sin45^{\circ}\sin30^{\circ}=4\times\dfrac{\sqrt2}{2}\times\dfrac{\sqrt3}{2}-4\times\dfrac{\sqrt2}{2}\times\dfrac12=\sqrt6-\sqrt2$
        (다른 풀이 1) $\angle\mathrm{ACD}=30^{\circ}$이고 사인법칙에 따라 $\dfrac{\overline{\mathrm{AD}}}{\sin30^{\circ}}=\dfrac{\overline{\mathrm{CD}}}{\sin75^{\circ}}=\dfrac{2}{\sin(30^{\circ}+45^{\circ})}=\dfrac{2}{\frac12\times\frac{\sqrt2}{2}+\frac{\sqrt3}{2}\times\frac{\sqrt2}{2}}=\dfrac{8}{\sqrt2+\sqrt6}=2(\sqrt6-\sqrt2)$이므로 $\overline{\mathrm{AD}}=\sqrt6-\sqrt2$이다.
        (다른 풀이 2) $\angle\mathrm{ACD}=30^{\circ}$이고 코사인법칙에 따라 $\overline{\mathrm{AD}}^2=2^2+2^2-2\times2\times2\times\cos30^{\circ}=8-4\sqrt3$이다. 따라서 $\overline{\mathrm{AD}}=\sqrt{8-4\sqrt3}\ (=\sqrt6-\sqrt2)$이다.
      source_flow: 해설 p.18
      criteria:
      - 4-2.A1
