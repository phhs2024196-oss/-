- id: 2-1
  stem: |
    [2] 오른쪽 그림과 같이 합동인 정사각형들을 변끼리 이어붙인 모양의 도로망이 있다. 이 도로를 따라 이동할 때 다음 물음에 답하시오.

    [그림: $5\times5$ 정사각형 격자 모양의 도로망. 왼쪽 아래 꼭짓점이 $A$, 오른쪽 위 꼭짓점이 $B$이고 가운데에 도로가 없는 직사각형 구멍(가로 $2$칸, 세로 $3$칸)이 있다. $A$를 원점으로 하고 한 칸을 $1$로 할 때 $P$는 $(1,4)$, $Q$는 구멍의 왼쪽 변 위의 점 $(2,3)$]

    (1) $A$지점에서 $B$지점까지 최단거리로 가는 경우의 수를 찾으시오. [5점]
  points: 5
