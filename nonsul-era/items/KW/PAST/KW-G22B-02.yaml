  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        모든 자연수 $n$에서 다음이 성립함을 밝히자. $a_n=(n^2+n)\times n!\cdots\cdots①$
        $n=1$일 때, $a_1=(1^2+1)\times1!=2$이므로 ①이 성립한다.
      source_flow: 해설 p.17
      criteria:
      - 3-2.B1
    - id: 32b-2
      content: |
        $n=k$일 때, 식 ①이 성립한다고 하자. 곧 $a_k=(k^2+k)\times k!$이라고 하자. 그러면 $n=k+1$일 때 다음을 얻는다.
        $a_{k+1}=a_k+(k^2+2k+2)\times(k+1)!=(k^2+k)\times k!+(k^2+2k+2)\times(k+1)!=k\times(k+1)!+(k^2+2k+2)\times(k+1)!=(k^2+3k+2)\times(k+1)!=\{(k+1)^2+(k+1)\}\times(k+1)!$
        그러므로 식 ①은 $n=k+1$일 때 성립한다.
      source_flow: 해설 p.17
      criteria:
      - 3-2.M1
    - id: 32b-3
      content: |
        따라서 식 ①은 모든 자연수 $n$에서 성립한다.
      source_flow: 해설 p.17
      criteria:
      - 3-2.R1
