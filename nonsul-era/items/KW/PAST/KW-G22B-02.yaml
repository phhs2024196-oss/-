        $g(n)=an^2+bn$이라고 하면 다음의 식을 얻는다.
        $a_1=(a+b)\times1!=2\ \to\ a+b=2$, $a_2=(4a+2b)\times2!=12\ \to\ 2a+b=3$ 또는 $a_2=(4a+2b)\times2!=12\ \to\ 2a+b=3$, $a_3=(9a+3b)\times3!=72\ \to\ 9a+3b=12$
