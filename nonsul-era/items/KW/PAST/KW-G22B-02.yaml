stimuli:
- label: '1'
  body: |
    1. 타원의 접선의 방정식
    타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$에 있는 점 $\mathrm{P}(x_1,y_1)$에서의 접선의 방정식은 다음과 같다.
    $$\dfrac{x_1x}{a^2}+\dfrac{y_1y}{b^2}=1$$
- label: '2'
  body: |
    2. 합의 법칙
    두 사건 $A$와 $B$가 동시에 일어나지 않을 때, 사건 $A$와 사건 $B$가 일어나는 경우의 수가 각각 $m$과 $n$이면, 사건 $A$ 또는 사건 $B$가 일어나는 경우의 수는 $m+n$이다.
- label: '3'
  body: |
    3. 수학적 확률
    표본공간 $S$에서 각각의 근원사건이 일어날 가능성이 모두 같은 정도로 기대될 때, 사건 $A$가 일어날 확률은 다음과 같다.
    $$\mathrm{P}(A)=\dfrac{n(A)}{n(S)}$$
- label: '4'
  body: |
    4. 수학적 귀납법
    자연수 $n$에 관한 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.
    (i) $n=1$일 때, 명제 $p(n)$이 성립한다.
    (ii) $n=k$일 때, 명제 $p(n)$이 성립한다고 가정하면 $n=k+1$일 때에도 명제 $p(n)$이 성립한다.
stem: |
  [문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: 1-1
  stem: |
    [1] 타원 $\dfrac{x^2}{a}+y^2=1\ (a>0)$의 제1사분면에 있는 점 $\mathrm{P}(x_1,y_1)$에 대하여, 점 $\mathrm{P}$에서의 접선이 $x$축과 점 $\mathrm{A}$에서 만나고 $y$축과 점 $\mathrm{B}$에서 만난다고 하자. 원점 $\mathrm{O}$와 두 점 $\mathrm{A}$와 $\mathrm{B}$가 꼭짓점인 삼각형 $\mathrm{OAB}$가 직각이등변삼각형일 때, 다음 물음에 답하시오.

    (1) 점 $\mathrm{P}$의 좌표를 $a$에 관한 식으로 나타내시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: expression
    value: P=(a/sqrt(a+1), 1/sqrt(a+1))
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        점 $\mathrm{P}(x_1,y_1)$에서의 접선의 방정식은 $\dfrac{x_1x}{a}+y_1y=1$이므로 $\mathrm{A}\left(\dfrac{a}{x_1},0\right)$이고 $\mathrm{B}\left(0,\dfrac{1}{y_1}\right)$이다. 삼각형 $\mathrm{OAB}$가 직각이등변삼각형이므로 $\overline{\mathrm{OA}}=\overline{\mathrm{OB}}$이고 이에 따라 $y_1=\dfrac{x_1}{a}$이다.
      source_flow: 해설 p.15
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        접점 $\mathrm{P}\left(x_1,\dfrac{x_1}{a}\right)$는 타원의 점이므로 $\dfrac{x_1^2}{a}+y_1^2=\dfrac{x_1^2}{a}+\left(\dfrac{x_1}{a}\right)^2=\dfrac{a+1}{a^2}x_1^2=1$이고 제1사분면에 있으므로 $x_1=\dfrac{a}{\sqrt{a+1}}$이고 $y_1=\dfrac{x_1}{a}=\dfrac{1}{\sqrt{a+1}}$이다. 따라서 접점 $\mathrm{P}$의 좌표는 $\left(\dfrac{a}{\sqrt{a+1}},\dfrac{1}{\sqrt{a+1}}\right)$이다.
      source_flow: 해설 p.15
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        접점 $\mathrm{P}$의 좌표를 $a$로 표현했다(예: $\mathrm{P}\left(x_1,\dfrac{x_1}{a}\right)$).
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        직각이등변삼각형 조건을 이용하여 접점 $\mathrm{P}\left(\dfrac{a}{\sqrt{a+1}},\dfrac{1}{\sqrt{a+1}}\right)$을 얻었다.
      depends_on:
      - 1-1.M1
      steps:
      - 11b-2
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) 삼각형 $\mathrm{OAP}$의 넓이가 삼각형 $\mathrm{OBP}$의 넓이의 $2$배가 되는 타원의 방정식을 찾으시오. [4점]
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: 2*x**2+y**2=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        삼각형 $\mathrm{OAP}$의 넓이는 $S_1=\dfrac12\times\overline{\mathrm{OA}}\times\dfrac{1}{\sqrt{a+1}}$이고 삼각형 $\mathrm{OBP}$의 넓이는 $S_2=\dfrac12\times\overline{\mathrm{OB}}\times\dfrac{a}{\sqrt{a+1}}$이다. $\overline{\mathrm{OA}}=\overline{\mathrm{OB}}$이고 $S_1=2\times S_2$이므로 $\dfrac{1}{\sqrt{a+1}}=2\times\dfrac{a}{\sqrt{a+1}}$이고, $a=\dfrac12$이다.
      source_flow: 해설 p.15
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        따라서 타원의 방정식은 $2x^2+y^2=1$이다.
      source_flow: 해설 p.15
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: |
        두 삼각형의 넓이를 이용하여 방정식을 얻었다(예: $\dfrac{1}{\sqrt{a+1}}=2\times\dfrac{a}{\sqrt{a+1}}$).
      depends_on: []
      implied_ok: false
      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 2
      evidence: |
        타원의 방정식 $2x^2+y^2=1$을 얻었다.
      depends_on:
      - 1-2.M1
      steps:
      - 12b-2
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-3
  stem: |
    (3) (2)의 타원의 두 초점 $\mathrm{F}$와 $\mathrm{F}^{\prime}$에 대하여 다음을 만족시키는 타원에 있는 점 $\mathrm{Q}$의 좌표를 모두 찾으시오. [6점]

    $\overrightarrow{\mathrm{FQ}}\cdot\overrightarrow{\mathrm{F^{\prime}Q}}=0$
  points: 6
  depends_on: []
  answer:
    kind: set
    value: (sqrt(2)/2, 0), (-sqrt(2)/2, 0)
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        타원의 두 초점을 $\mathrm{F}(0,c)$와 $\mathrm{F}^{\prime}(0,-c)$라고 하면 $c^2=1-a=\dfrac12$이므로 $\mathrm{F}\left(0,\dfrac{\sqrt2}{2}\right)$와 $\mathrm{F}^{\prime}\left(0,-\dfrac{\sqrt2}{2}\right)$이다. 타원의 점 $\mathrm{Q}$에 대하여 $\overrightarrow{\mathrm{FQ}}\cdot\overrightarrow{\mathrm{F^{\prime}Q}}=0$이므로 $\angle\mathrm{FQF^{\prime}}=90^{\circ}$이다. 따라서 점 $\mathrm{Q}$는 타원의 두 초점을 지름의 양 끝점으로 하는 원 $x^2+y^2=\dfrac12$과 타원의 교점이 된다.
      source_flow: 해설 p.15
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        타원의 식과 원의 식을 연립하여 풀면 찾는 점 $\mathrm{Q}$의 좌표는 $\left(\dfrac{\sqrt2}{2},0\right)$과 $\left(-\dfrac{\sqrt2}{2},0\right)$이다.
      source_flow: 해설 p.15
      criteria:
      - 1-3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 3
      evidence: |
        $\angle\mathrm{FQF^{\prime}}=90^{\circ}$를 이용하여 원의 방정식 $x^2+y^2=\dfrac12$을 얻었다.
      depends_on: []
      implied_ok: false
      steps:
      - 13b-1
    - id: 1-3.A1
      mark_type: A
      points: 3
      evidence: |
        점 $\mathrm{Q}$의 좌표 $\left(\dfrac{\sqrt2}{2},0\right)$과 $\left(-\dfrac{\sqrt2}{2},0\right)$을 모두 얻었다.
      depends_on:
      - 1-3.M1
      steps:
      - 13b-2
    deductions: []
