      content: |
        (1)의 결과에 의하여 삼각형 $\mathrm{ACD}$는 $\overline{\mathrm{AC}}=\overline{\mathrm{CD}}=2$인 이등변삼각형이고 $\angle\mathrm{CDA}=\angle\mathrm{CAD}=75^{\circ}$이다.
