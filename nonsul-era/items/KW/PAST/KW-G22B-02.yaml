intent: |
  [1] 좌표평면에서 타원의 접선의 방정식을 이해하고 조건을 활용하여 타원의 방정식을 결정하는 능력을 평가한다. 그리고 벡터의 내적과 타원의 성질을 이용하여 조건을 만족시키는 점들의 집합을 나타낼 수 있는 능력을 평가한다. [2] 조합의 개념을 이해하여 경우의 수를 계산하고 이를 적용해서 응용 문제를 해결할 수 있는 능력을 평가한다. 그리고 확률의 개념을 이해하고 독립 사건이 일어날 수 있는 경우의 수를 계산하여 사건이 일어날 확률을 계산하는 능력을 평가한다. [3] 귀납적으로 정의된 수열의 특성을 이해하여 항들을 계산할 수 있는 능력과 수학적 귀납법을 이용하여 모든 자연수에 대하여 정의된 응용 문제를 해결할 수 있는 능력을 평가한다. [4] 평면도형의 성질을 이해하고 귀류법을 이용하여 명제를 증명할 수 있는 능력을 평가한다. 그리고 삼각함수의 여러 가지 성질을 이용하여 주어진 도형의 길이를 계산할 수 있는 능력을 평가한다. (광운대 공식 '문제 해설' 출제 의도)
key_idea: |
  타원의 접선으로 $\mathrm{A}$, $\mathrm{B}$를 잡고 $\overline{\mathrm{OA}}=\overline{\mathrm{OB}}$로 $a$를 결정하며, $\overrightarrow{\mathrm{FQ}}\cdot\overrightarrow{\mathrm{F^{\prime}Q}}=0$을 초점을 지름으로 하는 원으로 읽는다. 도로망은 정사각 격자의 최단경로를 구멍 둘레의 다섯 지점 통과로 분류해 센다. $a_n=(n^2+n)n!$을 두 항으로 정하고 귀납법으로 증명한다. $\overline{\mathrm{AC}}=2$는 큰 변과 큰 각의 대응을 이용한 귀류법이다.
stuck: |
  [2](1)에서 구멍 때문에 막힌 길을 피해 $R,P,Q,S,T$ 다섯 지점의 통과 경우로 분류하는 단계와, [2](2)에서 두 사람이 만날 수 있는 지점이 같은 거리의 $P,Q,R,S,T$뿐임을 아는 단계
