- id: 4-2
  stem: |
    (2) $\dfrac34\pi<x<\dfrac54\pi$일 때, 방정식 $f(x)=1$의 근의 개수를 찾으시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        $f(x)=\sin x+\sec2x=1$의 양변에 $\cos2x$를 곱하면 $\sin x\cos2x+1=\cos2x$이다. $\cos2x=1-2\sin^2x$를 대입하면 $\sin x(1-2\sin^2x)+1=(1-2\sin^2x)$이다. 정리하면 $\sin x(2\sin^2x-2\sin x-1)=0$이다.
      source_flow: 해설 p.10~11
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: |
        $\sin x=t$라 하면 $t(2t^2-2t-1)=0$이므로 $t=0$ 또는 $t=\dfrac{1\pm\sqrt3}{2}$이다. 구간 $\left(\dfrac34\pi,\dfrac54\pi\right)$에서 $\sin x$는 감소하는 연속함수이고 (1)에서 $-\dfrac{\sqrt2}{2}<t<\dfrac{\sqrt2}{2}$이므로
        $t=0$인 경우에 $-\dfrac{\sqrt2}{2}<0<\dfrac{\sqrt2}{2}$이므로 $\sin x=0$을 만족시키는 $x$가 구간 $\left(\dfrac34\pi,\dfrac54\pi\right)$에 하나 있다.
        $t=\dfrac{1+\sqrt3}{2}$인 경우에 $\dfrac{1+\sqrt3}{2}>1$이므로 $\sin x=\dfrac{1+\sqrt3}{2}$을 만족시키는 $x$는 없다.
        $t=\dfrac{1-\sqrt3}{2}$인 경우에 $\dfrac{1-\sqrt3}{2}-\left(-\dfrac{\sqrt2}{2}\right)=\dfrac{1+\sqrt2-\sqrt3}{2}>0$이므로 $-\dfrac{\sqrt2}{2}<\dfrac{1-\sqrt3}{2}<0$이다. 그러므로 $\sin x=\dfrac{1-\sqrt3}{2}$를 만족시키는 $x$가 구간 $\left(\dfrac34\pi,\dfrac54\pi\right)$에 하나 있다.
      source_flow: 해설 p.10~11
      criteria:
      - 4-2.R1
    - id: 42b-3
      content: |
        따라서 구간 $\left(\dfrac34\pi,\dfrac54\pi\right)$에 있는 $f(x)=1$의 근의 개수는 $2$개이다.
      source_flow: 해설 p.10~11
      criteria:
      - 4-2.A1
