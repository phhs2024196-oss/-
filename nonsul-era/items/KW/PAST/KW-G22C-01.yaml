intent: |
  [1] 등차수열의 뜻을 알고, 일반항, 첫째항부터 제 $n$항까지의 합을 구할 수 있는지 판단한다. [2] 이차함수의 절대값의 그래프와 직선 $y=k$의 교점이 방정식 $\lvert f(x)\rvert=k$의 실근과 같음을 아는지 판단한다. [3] 함수의 증가와 감소, 극대와 극소를 판정하고 설명할 수 있는지 판단한다. [4] 삼각함수를 포함한 방정식을 삼각함수의 그래프를 이용하여 풀 수 있는지 판단한다. (광운대 공식 '문제 해설' 출제 의도)
key_idea: |
  등차수열은 $a_1+a_n=a_2+a_{n-1}$로 합에서 $n$을, 일반항에서 $d$를 구한다. $\lvert f\rvert=10$이 네 점에서 성립하려면 축이 $c=\dfrac52$이고 $f(1)=10$, $f(2)=-10$이어야 한다. 직사각형 둘레를 $a$의 삼차함수로 두고 미분해 최대를, $\sin x\cos2x$ 정리로 $f(x)=1$의 근을 구한 뒤 직각삼각형의 외접원은 빗변의 절반으로 구한다.
stuck: |
  [2](1)에서 $\lvert f\rvert$의 값이 네 점에서 같으려면 $f(1)=f(4)=10$, $f(2)=f(3)=-10$ 이어야 함을 그래프 모양(그림 A)으로 판단하는 단계
