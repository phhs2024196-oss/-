stimuli:
- label: '1'
  body: |
    1. 수열
    첫째항부터 차례로 일정한 수를 더해 만들어지는 수열을 등차수열이라 하고, 그 일정한 수를 공차라고 한다.
    첫째항부터 차례로 일정한 수를 곱해 만들어지는 수열을 등비수열이라 하고, 그 일정한 수를 공비라고 한다.
- label: '2'
  body: |
    2. 이차함수
    이차함수 $y=ax^2+bx+c\ (a\ne0)$의 그래프와 $x$축의 교점의 $x$좌표는 이차방정식 $ax^2+bx+c=0$의 실근과 같다. 이차함수 $y=ax^2+bx+c$의 그래프는 $a>0$이면 감소하다가 증가하고 $a<0$이면 증가하다가 감소한다. 이에 따라 이 이차함수의 최솟값은 $a>0$일 때 나타나고 최댓값은 $a<0$일 때 나타난다.
stem: |
  [문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
