- id: 2-1
  stem: |
    [2] 이차함수 $f(x)=a(x-c)^2+d\ (a>0)$에 대해 다음 물음에 답하시오. (단, $a$, $c$, $d$는 상수)

    (1) $\lvert f(1)\rvert=\lvert f(2)\rvert=\lvert f(3)\rvert=\lvert f(4)\rvert=10$일 때, 세 상수 $a$, $c$, $d$의 값을 각각 찾으시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: a=10; c=5/2; d=-25/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        최고차항의 계수가 $a>0$이므로 $\lvert f(x)\rvert$의 값이 서로 다른 네 점에서 같은 값을 가지려면 $y=\lvert f(x)\rvert$의 그래프는 그림 B와 같을 수 없고 그림 A와 같은 경우뿐이다. $\lvert f(x)\rvert=\lvert a(x-c)^2+d\rvert$으로부터 축 $x=c$에서 거리가 같으면 함숫값이 같다. 그러므로 $\lvert f(1)\rvert=\lvert f(2)\rvert=\lvert f(3)\rvert=\lvert f(4)\rvert=10$이기 위해서는 $c=\dfrac{2+3}{2}=\dfrac52$이다. 곧, $f(x)=a\left(x-\dfrac52\right)^2+d$이다.
        [그림 A: $y=\lvert f(x)\rvert$의 그래프. 두 점에서 $x$축에 닿고 그 사이에서 위로 볼록한 포물선 모양, 바깥쪽은 증가하는 W자 꼴] [그림 B: $y=f(x)$가 $x$축 위쪽에만 있는 아래로 볼록한 포물선]
      source_flow: 해설 p.9
      criteria:
      - 2-1.B1
    - id: 21b-2
      content: |
        이차방정식 $f(x)=k$의 근은 최대 $2$개 이므로 그림 A에서 $f(1)=f(4)=10$이고 $f(2)=f(3)=-10$이다. 곧 $f(1)=f(4)=\dfrac94a+d=10$이고 $f(2)=f(3)=\dfrac14a+d=-10$이다.
      source_flow: 해설 p.9
      criteria:
      - 2-1.M1
    - id: 21b-3
      content: |
        $\begin{cases}9a+4d=40\\a+4d=-40\end{cases}$으로부터 $a=10$이고 $d=-\dfrac{25}{2}$이다. 따라서 $f(x)=10\left(x-\dfrac52\right)^2-\dfrac{25}{2}$이므로 찾는 값은 $a=10$, $c=\dfrac52$, $d=-\dfrac{25}{2}$이다.
      source_flow: 해설 p.9
      criteria:
      - 2-1.A1
  rubric:
