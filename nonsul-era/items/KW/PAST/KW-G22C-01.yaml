    method_no: 1
    steps:
    - id: 32b-1
      content: |
        직사각형 $\mathrm{ABCD}$의 둘레의 길이를 $f(a)=8a^3-36a$라 하자. $f^{\prime}(a)=24a^2-36=12(2a^2-3)$이고 $a$의 범위가 $-2<a<0$이므로 $f^{\prime}(a)=0$의 근은 $a=-\dfrac{\sqrt6}{2}$이다.
      source_flow: 해설 p.10
      criteria:
      - 3-2.M1
      - 3-2.A1
    - id: 32b-2
      content: |
        그러므로 함수 $f(a)$의 증가와 감소를 표로 나타내면 $-2<a<-\dfrac{\sqrt6}{2}$에서 $f^{\prime}(a)>0$(증가), $a=-\dfrac{\sqrt6}{2}$에서 $f(a)=12\sqrt6$, $-\dfrac{\sqrt6}{2}<a<0$에서 $f^{\prime}(a)<0$(감소)이다. 따라서 $-2<a<0$에서 함수 $f(a)$의 최댓값은 $12\sqrt6$이고 이때 $a=-\dfrac{\sqrt6}{2}$이다.
      source_flow: 해설 p.10
      criteria:
