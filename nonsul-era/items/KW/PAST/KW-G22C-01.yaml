- id: 4-3
  stem: |
    (3) (2)에서 찾은 근 중에서 가장 작은 값과 가장 큰 값을 각각 $\alpha$와 $\beta$라고 하자. 삼각형 $\mathrm{ABC}$에서 $\angle\mathrm{A}=\alpha-\dfrac{\pi}{2}$이고 $\angle\mathrm{B}=\beta-\pi$이며 $\overline{\mathrm{AB}}=\sqrt6$이라고 하자. 이때, 삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이 $R$을 찾으시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: 3**(1/4)
    equivalents: []
    tolerance: null
  solutions:
  - id: S43-B
    audience: B
    method_no: 1
    steps:
    - id: 43b-1
      content: |
        구간 $\left(\dfrac34\pi,\dfrac54\pi\right)$에서 $\sin x$는 감소하므로 (2)로부터 $\alpha=\pi$이고 $\sin\beta=\dfrac{1-\sqrt3}{2}$이다.
      source_flow: 해설 p.11
      criteria:
      - 4-3.B1
      - 4-3.B2
    - id: 43b-2
      content: |
        $\triangle\mathrm{ABC}$는 $\angle\mathrm{A}=\alpha-\dfrac{\pi}{2}=\dfrac{\pi}{2}$인 직각삼각형이다. 사인법칙을 사용하면 $2R=\dfrac{\sqrt6}{\sin C}$이고 $\cos\beta<0$이므로 다음을 얻는다.
        $2R=\dfrac{\sqrt6}{\sin\left(\frac32\pi-\beta\right)}=\dfrac{\sqrt6}{-\cos\beta}=\dfrac{\sqrt6}{\sqrt{1-\sin^2\beta}}=\dfrac{\sqrt6}{\sqrt{1-\frac{4-2\sqrt3}{4}}}=\sqrt6\,\dfrac{\sqrt2}{\sqrt[4]{3}}=2\sqrt[4]{3}$
      source_flow: 해설 p.11
      criteria:
      - 4-3.A1
    - id: 43b-3
      content: |
        따라서 $R=\sqrt[4]{3}$이다.
        (다른 풀이) $\triangle\mathrm{ABC}$는 $\angle\mathrm{A}=\dfrac{\pi}{2}$인 직각삼각형이다. 그러므로 $R$은 빗변의 길이의 $\dfrac12$이고 $\cos\beta<0$이므로 (빗변의 길이)$=\overline{\mathrm{BC}}=\dfrac{\overline{\mathrm{AB}}}{\cos B}=\dfrac{\sqrt6}{\cos(\beta-\pi)}=-\dfrac{\sqrt6}{\cos\beta}=\dfrac{\sqrt6}{\sqrt{1-\sin^2\beta}}=2\sqrt[4]{3}$이므로 $R=\sqrt[4]{3}$이다.
      source_flow: 해설 p.11
      criteria:
      - 4-3.A1
