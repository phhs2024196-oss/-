# 광운대 2022학년도 논술고사 자연계열(3교시) 문제 1 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 공식 문항 메모: [2](1) 해설의 '이차방정식 f(x)=k의 근은 최대 2개'는 |f(x)|=k 가 네 점에서 만나는 상황을 가리키는 서술로 보이며 원문 그대로 둔다.
