    (1) 점 $\mathrm{A}$의 $x$좌표는 $a\ (-2<a<0)$이고 점 $\mathrm{C}$의 $x$좌표는 $-a$라 할 때, 직사각형 $\mathrm{ABCD}$의 둘레의 길이를 $a$에 관한 함수로 나타내시오. [4점]
