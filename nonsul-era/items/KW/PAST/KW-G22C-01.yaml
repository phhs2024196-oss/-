- id: 2-2
  stem: |
    (2) (1)에서 찾은 $f(x)$에 대해 함수 $y=\lvert f(x)\rvert$의 그래프를 그리고, 방정식 $\lvert f(x)\rvert=k$의 근의 개수가 다음과 같을 때 실수 $k$의 값 또는 그 범위를 각각 찾으시오. [7점]

    ① 근이 없음　② 근이 $2$개　③ 근이 $3$개　④ 근이 $4$개
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: 'none: k<0; two: k=0 or k>25/2; three: k=25/2; four: 0<k<25/2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        (1)의 결과와 오른쪽 그림에서 함수 $y=\lvert f(x)\rvert$의 그래프는 $x$축과 $x=\dfrac{5-\sqrt5}{2}$, $x=\dfrac{5+\sqrt5}{2}$에서 만나고 $x=\dfrac52$에서 극댓값 $\dfrac{25}{2}$를 갖는다.
        [그림: 함수 $y=\lvert f(x)\rvert$의 그래프. $x$축과 $x=\dfrac{5-\sqrt5}{2}$, $\dfrac{5+\sqrt5}{2}$에서 만나고 $x=\dfrac52$에서 높이 $\dfrac{25}{2}$인 극대를 갖는 W자 꼴]
      source_flow: 해설 p.9
      criteria:
      - 2-2.B1
    - id: 22b-2
      content: |
        ① 근이 없음: $k<0$이면 근이 없다.
        ② 근의 개수가 $2$개: $k>\dfrac{25}{2}$ 또는 $k=0$이면 근이 $2$개
        ③ 근의 개수가 $3$개: $k=\dfrac{25}{2}$이면 근이 $3$개
        ④ 근의 개수가 $4$개: $0<k<\dfrac{25}{2}$이면 근이 $4$개
      source_flow: 해설 p.9
      criteria:
      - 2-2.A1
      - 2-2.A2
      - 2-2.A3
      - 2-2.A4
