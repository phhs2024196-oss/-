- id: 4-2
  stem: |
    (2) $n\ge2$일 때, 점 $\mathrm{P}_n$이 선분 $\mathrm{P}_{n-1}\mathrm{P}_{n+1}$을 $\alpha:\beta\ (\alpha>0,\beta>0)$로 내분한다고 할 때, $\dfrac{\alpha}{\beta}$의 값을 찾으시오. [5점]
  points: 5
