stimuli:
- label: '1'
  body: |
    1. 정적분과 급수의 합
    도형의 넓이를 구할 때, 주어진 도형을 잘게 나누어 간단한 도형의 넓이의 합으로 어림값을 구하고, 이 어림값의 극한값으로 도형의 넓이를 구할 수 있다.
- label: '2'
  body: |
    2. 중복조합
    서로 다른 $n$개에서 중복을 허용하여 $r$개를 택하는 조합을 서로 다른 $n$개에서 $r$개를 택하는 중복조합이라고 한다. 이 중복조합의 수를 기호로 ${}_n\mathrm{H}_r$와 같이 나타낸다.
- label: '3'
  body: |
    3. 위치벡터
    평면에서 정해진 점 $\mathrm{O}$를 시점으로 하는 벡터 $\overrightarrow{\mathrm{OP}}$를 점 $\mathrm{O}$에 대한 점 $\mathrm{P}$의 위치벡터라고 한다.
