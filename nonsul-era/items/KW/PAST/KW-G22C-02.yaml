intent: |
  [1] 정적분과 급수의 합의 관계를 알고 계산을 할 수 있는지 판단한다. [2] 상용로그함수의 미분을 할 수 있는지 판단한다. [3] 조건부 확률을 이해하고 중복조합을 활용하여 문제를 해결할 수 있는지 판단한다. [4] 선분의 내분을 이해하고 두 평면벡터간의 각의 크기를 구할 수 있는지 판단한다. (광운대 공식 '문제 해설' 출제 의도)
key_idea: |
  구분구적법으로 $\int_0^2x^2dx$를 급수 합의 극한으로 쓴다. 대칭 평균 꼴 극한을 $2L^{\prime}(10^5I_0)$로 바꾼다. 짝수·$6$의 배수 조건을 $x=2a$, $x=6a$ 등으로 치환해 중복조합으로 센 뒤 조건부확률을 구한다. 점열 $\mathrm{P}_n$은 내분점의 좌표 관계로 $\dfrac\alpha\beta$를, 두 위치벡터의 각은 $n=1$일 때 최대임을 이용한다.
stuck: |
  [3](3)에서 '$x$가 $6$의 배수이고 $y,z$가 짝수'를 $x=6a,y=2b,z=2c,w=2d+1$로 두고 $3a+b+c+d=10$의 해를 $a$ 값에 따라 나누어 세는 단계
