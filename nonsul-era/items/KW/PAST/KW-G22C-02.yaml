    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        (1)에서 $\mathrm{P}_n(x_n,y_n)=\left(1-\left(\dfrac12\right)^n,\ 2-\left(\dfrac12\right)^{n-1}\right)$이다. 점 $\mathrm{P}_n$이 선분 $\mathrm{P}_{n-1}\mathrm{P}_{n+1}$을 $\alpha:\beta\ (\alpha>0,\beta>0)$로 내분하면 점 $\mathrm{P}_n$의 $x$좌표 $x_n$은 $x$축의 구간 $[x_{n-1},x_{n+1}]$을 $\alpha:\beta$로 내분하므로 다음이 성립한다.
        $x_n=\dfrac{\alpha x_{n+1}+\beta x_{n-1}}{\alpha+\beta}$
      source_flow: 해설 p.17~18
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: |
        $\dfrac{\alpha\left\{1-\left(\frac12\right)^{n+1}\right\}+\beta\left\{1-\left(\frac12\right)^{n-1}\right\}}{\alpha+\beta}=1-\left(\dfrac12\right)^n$, $\alpha-\alpha\left(\dfrac12\right)^{n+1}+\beta-\beta\left(\dfrac12\right)^{n-1}=\alpha-\alpha\left(\dfrac12\right)^n+\beta-\beta\left(\dfrac12\right)^n$, $\alpha\left(\dfrac12\right)^n\left(-\dfrac12+1\right)=\beta\left(\dfrac12\right)^{n-1}\left(1-\dfrac12\right)$
      source_flow: 해설 p.17~18
      criteria:
      - 4-2.M2
    - id: 42b-3
      content: |
        따라서 $\left(\dfrac12\right)^{n+1}\alpha=\left(\dfrac12\right)^n\beta$이므로 찾는 값은 $\dfrac{\alpha}{\beta}=2$이다.
        [다른 풀이 1] $\dfrac{\alpha}{\beta}=\dfrac{x_n-x_{n-1}}{x_{n+1}-x_n}=\dfrac{\left\{1-\left(\frac12\right)^n\right\}-\left\{1-\left(\frac12\right)^{n-1}\right\}}{\left\{1-\left(\frac12\right)^{n+1}\right\}-\left\{1-\left(\frac12\right)^n\right\}}=\dfrac{\left(\frac12\right)^n}{\left(\frac12\right)^{n+1}}=2$
        [다른 풀이 2] 점 $\mathrm{P}_n$의 $y$좌표 $y_n$이 $y$축의 구간 $[y_{n-1},y_{n+1}]$을 $\alpha:\beta$로 내분하므로 $y_n=\dfrac{\alpha y_{n+1}+\beta y_{n-1}}{\alpha+\beta}$에서 $\left(\dfrac12\right)^n\alpha=\left(\dfrac12\right)^{n-1}\beta$이므로 $\dfrac{\alpha}{\beta}=2$이다.
        [다른 풀이 3] $\dfrac{\alpha}{\beta}=\dfrac{y_n-y_{n-1}}{y_{n+1}-y_n}=\dfrac{\left\{2-\left(\frac12\right)^{n-1}\right\}-\left\{2-\left(\frac12\right)^{n-2}\right\}}{\left\{2-\left(\frac12\right)^n\right\}-\left\{2-\left(\frac12\right)^{n-1}\right\}}=\dfrac{\left(\frac12\right)^{n-1}}{\left(\frac12\right)^n}=2$
      source_flow: 해설 p.17~18
      criteria:
      - 4-2.A1
  rubric:
