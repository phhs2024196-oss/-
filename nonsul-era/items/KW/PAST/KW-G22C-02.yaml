  stem: |
    [4] $n$이 자연수일 때, 좌표평면에서 원점 $\mathrm{O}$를 시점으로 하는 두 점의 위치벡터 $\overrightarrow{a_n}=\left(\left(\dfrac12\right)^n,0\right)$과 $\overrightarrow{b_n}=\left(0,\left(\dfrac12\right)^{n-1}\right)$을 이용하여 벡터 $\overrightarrow{p_n}$을 다음과 같이 정의하자.

    $$\overrightarrow{p_n}=\sum_{k=1}^{n}\left(\overrightarrow{a_k}+\overrightarrow{b_k}\right)$$

    다음 물음에 답하시오.

    (1) 원점 $\mathrm{O}$를 시점으로 하는 위치벡터 $\overrightarrow{p_n}$의 종점을 점 $\mathrm{P}_n$이라고 할 때, $n$의 값이 커짐에 따라 점 $\mathrm{P}_n$이 한없이 가까워지는 점 $\mathrm{P}$의 좌표를 찾으시오. [3점]
  points: 3
  depends_on: []
  answer:
    kind: expression
    value: x=1; y=2
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        $k=1,2,3,\cdots$일 때, $\overrightarrow{a_k}+\overrightarrow{b_k}=\left(\left(\dfrac12\right)^k,\left(\dfrac12\right)^{k-1}\right)$이므로, $\overrightarrow{p_n}=\displaystyle\sum_{k=1}^{n}\left(\overrightarrow{a_k}+\overrightarrow{b_k}\right)=\left(1-\left(\dfrac12\right)^n,\ 2-\left(\dfrac12\right)^{n-1}\right)$이다.
      source_flow: 해설 p.17
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}\left(1-\left(\dfrac12\right)^n\right)=1$이고 $\displaystyle\lim_{n\to\infty}\left(2-\left(\dfrac12\right)^{n-1}\right)=2$이므로 점 $\mathrm{P}_n$은 점 $\mathrm{P}(1,2)$에 한없이 가까워진다.
      source_flow: 해설 p.17
      criteria:
      - 4-1.A1
