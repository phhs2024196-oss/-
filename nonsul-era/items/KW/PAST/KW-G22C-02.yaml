    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) (1)의 정적분을 급수의 합으로 나타내고, 극한을 이용하여 그 급수의 합을 찾으시오. [4점]
  points: 4
  depends_on: []
  answer:
    kind: value
    value: 8/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $\displaystyle\int_0^2x^2\,dx=\lim_{n\to\infty}\sum_{k=1}^{n}x_k^2\Delta x$ (단, $x_k=0+k\Delta x$, $\Delta x=\dfrac{2-0}{n}$),
        $=\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\left(\dfrac{2k}{n}\right)^2\dfrac2n=\lim_{n\to\infty}\dfrac{8}{n^3}\sum_{k=1}^{n}k^2=\lim_{n\to\infty}\dfrac{8}{n^3}\cdot\dfrac{n(n+1)(2n+1)}{6}$
      source_flow: 해설 p.16
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $=\displaystyle\lim_{n\to\infty}\dfrac83\cdot\dfrac{n(n+1)\left(n+\frac12\right)}{n^3}=\dfrac83\lim_{n\to\infty}\left(1+\dfrac1n\right)\left(1+\dfrac{1}{2n}\right)=\dfrac83\cdot1=\dfrac83$
        [다른 풀이] $\displaystyle\int_0^2x^2\,dx=\lim_{n\to\infty}\sum_{k=1}^{n}x_{k-1}^2\Delta x$ (단, $x_k=0+k\Delta x$, $\Delta x=\dfrac{2-0}{n}$)로 두면 $=\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\left(\dfrac{2(k-1)}{n}\right)^2\dfrac2n=\lim_{n\to\infty}\dfrac{8}{n^3}\sum_{k=1}^{n}(k-1)^2=\lim_{n\to\infty}\dfrac{8}{n^3}\cdot\dfrac{(n-1)n(2n-1)}{6}=\dfrac83\lim_{n\to\infty}\left(1-\dfrac1n\right)\left(1-\dfrac{1}{2n}\right)=\dfrac83$
        [참고] 그밖에도 $\displaystyle\int_a^bf(x)\,dx=\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x$ (단, $x_k=a+k\Delta x$, $\Delta x=\dfrac{b-a}{n}$)에서 $f(x_k)$는 구간 $[x_{k-1},x_k]$의 다른 점에서의 함숫값, 이를테면 $f\left(\dfrac{x_{k-1}+x_k}{2}\right)$ 따위로 바꿀 수 있다.
      source_flow: 해설 p.16
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: |
        정적분을 급수의 합 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\left(\dfrac{2k}{n}\right)^2\dfrac2n$ 등으로 올바로 표현했다.
      depends_on: []
      implied_ok: false
      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 2
      evidence: |
        극한 $\dfrac83\displaystyle\lim_{n\to\infty}\left(1+\dfrac1n\right)\left(1+\dfrac1{2n}\right)$(또는 $\left(1-\dfrac1n\right)\left(1-\dfrac1{2n}\right)$)을 이용해 급수의 합 $\dfrac83$을 올바로 찾았다.
      depends_on:
      - 1-2.M1
      steps:
      - 12b-2
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [2] ‘데시벨(dB)’은 소리의 세기를 표준음의 세기와 비교해서 나타내는데, 표준음은 정상적인 청각을 지닌 사람이 겨우 들을 수 있는 소리로 그 세기는 1제곱미터에 $10^{-12}$와트이다. 곧 $10^{-12}\,\mathrm{W/m^2}$이다. 표준음의 세기를 $I_0\,\mathrm{W/m^2}$이라 하고 어떤 소리의 세기를 $I\,\mathrm{W/m^2}$이라고 할 때, 이 소리의 세기 $I\,\mathrm{W/m^2}$을 단위를 바꾸어 $L$데시벨(dB)이라고 하면 이 값 $L$은 상용로그를 이용해서 다음과 같이 계산한다.

    $$L=10\log\dfrac{I}{I_0}$$

    $L$을 변수 $I$의 함수 $L(I)$라고 할 때, 다음 값을 찾으시오. [6점]

    $$\lim_{h\to0}\dfrac{L(10^5I_0+h)-L(10^5I_0-h)}{h}$$
  points: 6
  depends_on: []
  answer:
    kind: value
    value: 2*10**8/log(10)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        분자에 $L(10^5I_0)$를 더하고 빼서 다음과 같이 계산할 수 있다.
        $\displaystyle\lim_{h\to0}\dfrac{L(10^5I_0+h)-L(10^5I_0-h)}{h}=\lim_{h\to0}\dfrac{L(10^5I_0+h)-L(10^5I_0)+L(10^5I_0)-L(10^5I_0-h)}{h}=\lim_{h\to0}\dfrac{L(10^5I_0+h)-L(10^5I_0)}{h}+\lim_{h\to0}\dfrac{L(10^5I_0-h)-L(10^5I_0)}{-h}=L^{\prime}(10^5I_0)+L^{\prime}(10^5I_0)=2L^{\prime}(10^5I_0)$
      source_flow: 해설 p.16
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $L(I)=10\log\dfrac{I}{I_0}$이므로 $L^{\prime}(I)=\dfrac{10}{\ln10}\dfrac{I_0}{I}\dfrac{1}{I_0}=\dfrac{10}{\ln10}\left(\dfrac1I\right)$이다.
      source_flow: 해설 p.16
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        따라서 찾는 값은 $2L^{\prime}(10^5I_0)=\dfrac{20}{\ln10}\left(\dfrac{1}{10^5I_0}\right)$이다. (또는 $2L^{\prime}(10^5I_0)=\dfrac{20}{\ln10}\left(\dfrac{1}{10^{-7}}\right)=\dfrac{2\times10^8}{\ln10}$)
      source_flow: 해설 p.16
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        주어진 극한값이 $2L^{\prime}(10^5I_0)$임을 보였다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $L^{\prime}(I)=\dfrac{10}{\ln10}\left(\dfrac1I\right)$을 올바로 찾았다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        $2L^{\prime}(10^5I_0)=\dfrac{20}{\ln10}\left(\dfrac{1}{10^5I_0}\right)=\dfrac{2\times10^8}{\ln10}$을 올바로 얻었다.
      depends_on:
      - 2.M1
      - 2.M2
      steps:
      - 2b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-1
  stem: |
    [3] 방정식 $x+y+z+w=21$을 만족시키는 음이 아닌 정수 $x,y,z,w$의 순서쌍 $(x,y,z,w)$에 대하여 다음 값을 찾으시오. (단, $0$은 모든 수의 배수이다. 이를테면 $0$은 $2$의 배수이므로 짝수이고, $0$은 $6$의 배수이기도 하다.)

    (1) 주어진 방정식을 만족시키는 음이 아닌 정수 $x,y,z,w$의 순서쌍의 개수 [4점]
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '2024'
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        방정식 $x+y+z+w=21$을 만족시키는 음이 아닌 정수 $x,y,z,w$의 순서쌍 $(x,y,z,w)$의 개수는 $4$개의 문자 $x,y,z,w$ 중에서 $21$개를 택하는 중복조합의 수와 같으므로 다음과 같다.
        ${}_4\mathrm{H}_{21}={}_{4+21-1}\mathrm{C}_{21}={}_{24}\mathrm{C}_{21}={}_{24}\mathrm{C}_{24-21}={}_{24}\mathrm{C}_3=\dfrac{24\times23\times22}{3!}=2024$이다.
      source_flow: 해설 p.17
      criteria:
      - 3-1.M1
      - 3-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
