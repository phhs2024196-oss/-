      content: |
        $n$이 커짐에 따라 두 점 $\mathrm{R}_n$과 $\mathrm{R}_{n+1}$ 사이의 거리가 가까워지므로 그림과 같이 두 위치벡터 $\overrightarrow{\mathrm{OR}_n}$과 $\overrightarrow{\mathrm{OR}_{n+1}}$이 이루는 예각 중에서 $\overrightarrow{\mathrm{OR}_1}$과 $\overrightarrow{\mathrm{OR}_2}$가 이루는 예각이 가장 크다.
        [그림: 원점 $\mathrm{O}$에서 점 $\mathrm{R}_1,\mathrm{R}_2,\mathrm{R}_3,\cdots$ (제4사분면에서 점 $(1,-1)$ 쪽으로 모이는 점들)로 향하는 점선 위치벡터]
      source_flow: 해설 p.19~20
      criteria:
      - 4-4.R1
    - id: 44b-3
      content: |
        $\overrightarrow{\mathrm{OR}_1}=\left(\dfrac12,0\right)$이고 $\overrightarrow{\mathrm{OR}_2}=\left(\dfrac34,-\dfrac12\right)$이므로 $\cos\theta_n$의 최솟값은 다음과 같다.
        $\cos\theta_1=\dfrac{\overrightarrow{\mathrm{OR}_1}\cdot\overrightarrow{\mathrm{OR}_2}}{\lvert\overrightarrow{\mathrm{OR}_1}\rvert\lvert\overrightarrow{\mathrm{OR}_2}\rvert}=\dfrac{\frac12\times\frac34+0\times\left(-\frac12\right)}{\sqrt{\left(\frac12\right)^2+0^2}\sqrt{\left(\frac34\right)^2+\left(-\frac12\right)^2}}=\dfrac{3\sqrt{13}}{13}$
      source_flow: 해설 p.19~20
      criteria:
      - 4-4.A1
    - id: 44b-4
      content: |
        [참고] $\overrightarrow{\mathrm{OR}_1}$과 $\overrightarrow{\mathrm{OR}_2}$가 이루는 예각의 크기가 가장 크다는 사실의 증명: $\overrightarrow{\mathrm{OR}_n}$과 $x$축이 이루는 예각의 크기를 $\phi_n$이라 하면 $\tan\phi_n=\dfrac{1-\left(\frac12\right)^{n-1}}{1-\left(\frac12\right)^n}=\dfrac{2^n-2}{2^n-1}=1-\dfrac{1}{2^n-1}$ ($n$이 커짐에 따라 $\tan\phi_n$도 증가). 그러면 $\overrightarrow{\mathrm{OR}_n}$과 $\overrightarrow{\mathrm{OR}_{n+1}}$이 이루는 예각의 크기 $\theta_n$의 탄젠트 값은 $\tan\theta_n=\tan(\phi_{n+1}-\phi_n)=\dfrac{\tan\phi_{n+1}-\tan\phi_n}{1+\tan\phi_{n+1}\tan\phi_n}$ ($2^n=t$라 하자) $=\dfrac{\frac{2t-2}{2t-1}-\frac{t-2}{t-1}}{1+\frac{2t-2}{2t-1}\cdot\frac{t-2}{t-1}}=\dfrac{(2t-2)(t-1)-(t-2)(2t-1)}{(2t-1)(t-1)+(2t-2)(t-2)}=\dfrac{(2t^2-4t+2)-(2t^2-5t+2)}{(2t^2-3t+1)+(2t^2-6t+4)}=\dfrac{t}{4t^2-9t+5}=\dfrac{1}{4t+\frac5t-9}$. $h(t)=4t+\dfrac5t-9\ (t\ge2)$라 하면, $t\ge2$일 때 $h^{\prime}(t)=4-\dfrac{5}{t^2}>0$이므로 $h(t)$는 증가함수이다. 따라서 $\tan\theta_n$은 감소함수이므로, $\tan\theta_1$이 최대이고 이에 따라 $\theta_1$이 최대이다.
      source_flow: 해설 p.19~20
