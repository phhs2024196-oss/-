- id: 4-1
  stem: |
    [4] 모든 실수 $x$에서 연속인 함수 $f(x)$에 대하여 함수 $g(x)$와 $h(x)$가 아래 조건을 만족할 때, 다음 물음에 답하시오.

    (ⅰ) $f(x)=g(x)+h(x)$
    (ⅱ) $g(-x)=g(x),\ h(-x)=-h(x)$

    (1) 함수 $g(x)$와 $h(x)$를 $f(x)$와 $f(-x)$를 이용하여 나타내고, 위 조건이 만족됨을 보이시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: expression
    value: g(x)=(f(x)+f(-x))/2; h(x)=(f(x)-f(-x))/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        조건 (ⅰ)에 의해 $f(x)=g(x)+h(x)$ …… ①
        조건 (ⅱ)에 의해 $f(-x)=g(-x)+h(-x)=g(x)-h(x)$ …… ②
      source_flow: 해설 p.7~8
      criteria:
      - 4-1.B1
    - id: 41b-2
      content: |
        ①, ②를 연립하여 $g(x)$와 $h(x)$를 구하면 $g(x)=\dfrac{f(x)+f(-x)}{2}$, $h(x)=\dfrac{f(x)-f(-x)}{2}$이다. 따라서 $f(x)=g(x)+h(x)$이다.
      source_flow: 해설 p.7~8
      criteria:
      - 4-1.B1
    - id: 41b-3
      content: |
        $g(-x)=\dfrac{f(-x)+f(x)}{2}=\dfrac{f(x)+f(-x)}{2}=g(x)$
        $h(-x)=\dfrac{f(-x)-f(x)}{2}=-\dfrac{f(x)-f(-x)}{2}=-h(x)$
      source_flow: 해설 p.7~8
      criteria:
      - 4-1.R1
  rubric:
