- id: 3-1
  stem: |
    [3] 어떤 데이터 조사에 따르면 이메일 중 스팸메일이 $25\%$, 스팸메일 중 ‘계좌’라는 단어가 들어가 있을 확률은 $80\%$, 스팸메일이 아닌 이메일 중 ‘계좌’라는 단어가 들어가 있을 확률은 $30\%$라고 한다. 다음 물음에 답하시오.

    (1) 이메일에 ‘계좌’라는 단어가 들어가 있고 스팸메일이 아닐 확률을 구하시오. [4점]
  points: 4
  depends_on: []
  answer:
    kind: value
    value: 9/40
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        이메일이 스팸메일인 사건을 $A$, 스팸메일이 아닌 사건을 $A^{C}$, 이메일에 단어 ‘계좌’가 들어가 있을 사건을 $B$라고 하면 $\mathrm{P}(A)=\dfrac14$, $\mathrm{P}(A^{C})=\dfrac34$, $\mathrm{P}(B\mid A)=\dfrac45$, $\mathrm{P}(B\mid A^{C})=\dfrac{3}{10}$이다.
        $\mathrm{P}(A^{C}\cap B)=\mathrm{P}(A^{C})\mathrm{P}(B\mid A^{C})$
      source_flow: 해설 p.7
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $=\dfrac34\times\dfrac{3}{10}=\dfrac{9}{40}$
        (다른 풀이) $\mathrm{P}(A)=0.25$, $\mathrm{P}(A^{C})=0.75$, $\mathrm{P}(B\mid A)=0.8$, $\mathrm{P}(B\mid A^{C})=0.3$이므로 $\mathrm{P}(A^{C}\cap B)=\mathrm{P}(A^{C})\mathrm{P}(B\mid A^{C})=0.75\times0.3=0.225$
      source_flow: 해설 p.7
      criteria:
      - 3-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 1
      evidence: |
        $\mathrm{P}(A^{C}\cap B)=\mathrm{P}(A^{C})\mathrm{P}(B\mid A^{C})$에 해당하는 수식을 제시했다.
      depends_on: []
      implied_ok: false
      steps:
      - 31b-1
    - id: 3-1.A1
      mark_type: A
      points: 3
      evidence: |
        $\dfrac{9}{40}$ 또는 $0.225$를 얻었다.
      depends_on:
      - 3-1.M1
      implied_ok: false
      steps:
      - 31b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    (2) 이메일에 ‘계좌’라는 단어가 들어가 있을 확률을 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 17/40
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $\mathrm{P}(A\cap B)=\mathrm{P}(A)\mathrm{P}(B\mid A)=\dfrac14\times\dfrac45=\dfrac15$이므로
      source_flow: 해설 p.7
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        $\mathrm{P}(B)=\mathrm{P}(A\cap B)+\mathrm{P}(A^{C}\cap B)=\dfrac15+\dfrac{9}{40}=\dfrac{17}{40}$
        (다른 풀이) $\mathrm{P}(A\cap B)=\mathrm{P}(A)\mathrm{P}(B\mid A)=0.25\times0.8=0.2$이므로 $\mathrm{P}(B)=0.2+0.225=0.425$
      source_flow: 해설 p.7
      criteria:
      - 3-2.M1
      - 3-2.A1
