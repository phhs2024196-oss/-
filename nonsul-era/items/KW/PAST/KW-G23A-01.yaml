- id: 4-2
  stem: |
    (2) (1)을 이용하여 $\displaystyle\int_{-1}^{1}\dfrac{x}{(x+p)^{2}+1}dx=0$이면 $p=0$임을 보이시오. (단, $p$는 실수) [10점]
  points: 10
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        $f(x)=\dfrac{x}{(x+p)^{2}+1}$라고 하자. 조건 (ⅱ)에 의해 $\displaystyle\int_{-1}^{1}g(x)dx=2\int_0^1 g(x)dx$이고 $\displaystyle\int_{-1}^{1}h(x)dx=0$이다.
      source_flow: 해설 p.8
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: |
        그러므로 $f(x)=g(x)+h(x)=\dfrac12\left\{\dfrac{x}{(x+p)^{2}+1}+\dfrac{-x}{(-x+p)^{2}+1}\right\}+h(x)$
        $=\dfrac{x}{2}\cdot\dfrac{\{(-x+p)^{2}+1-(x+p)^{2}-1\}}{\{(x+p)^{2}+1\}\{(-x+p)^{2}+1\}}+h(x)=-2p\dfrac{x^{2}}{\{(x+p)^{2}+1\}\{(-x+p)^{2}+1\}}+h(x)$
      source_flow: 해설 p.8
      criteria:
      - 4-2.M2
    - id: 42b-3
      content: |
        $\displaystyle\int_{-1}^{1}f(x)dx=\int_{-1}^{1}\{g(x)+h(x)\}dx=2\int_0^1 g(x)dx=-4p\int_0^1\dfrac{x^{2}}{\{(x+p)^{2}+1\}\{(-x+p)^{2}+1\}}dx$
      source_flow: 해설 p.8
      criteria:
      - 4-2.R1
    - id: 42b-4
      content: |
        함수 $\dfrac{x^{2}}{\{(x+p)^{2}+1\}\{(-x+p)^{2}+1\}}$는 구간 $(0,1)$에서 양이므로 정적분 값은 $0$이 아니다. 그러므로 $\displaystyle\int_{-1}^{1}f(x)dx=0$이면 $p=0$이다. ■
      source_flow: 해설 p.8
      criteria:
      - 4-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
