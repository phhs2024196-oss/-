- id: '2'
  stem: |
    [2] $-\pi\le x\le\pi$에서 방정식 $\cos^{2}x-\sin x-x=0$을 만족시키는 실근의 개수를 구하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        주어진 방정식의 실근을 두 함수 $f(x)=\cos^2x-\sin x$와 $y=x$의 교점으로 구한다.
        $f(x)=\cos^2x-\sin x=-\sin^2x-\sin x+1$
      source_flow: 해설 p.6~7
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $f^{\prime}(x)=-2\sin x\cos x-\cos x=-\cos x(2\sin x+1)$
        $f^{\prime}(x)=0$을 만족하는 극값을 구하면 $\cos x=0$에서 $x=-\dfrac{\pi}{2},\dfrac{\pi}{2}$, $\sin x=-\dfrac12$에서 $x=-\dfrac{\pi}{6},-\dfrac{5\pi}{6}$이다.
      source_flow: 해설 p.6~7
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        함수의 증가와 감소를 표로 나타내면 다음과 같다.

        $$\begin{array}{c|ccccccccccc}x&-\pi&\cdots&-\frac{5\pi}{6}&\cdots&-\frac{\pi}{2}&\cdots&-\frac{\pi}{6}&\cdots&\frac{\pi}{2}&\cdots&\pi\\\hline f^{\prime}(x)&&+&0&-&0&+&0&-&0&+&\\\hline f(x)&1&\nearrow&\frac54&\searrow&1&\nearrow&\frac54&\searrow&-1&\nearrow&1\end{array}$$
      source_flow: 해설 p.6~7
      criteria:
      - 2.R1
    - id: 2b-4
      content: |
        $-\pi\le x\le\pi$에서 그래프의 개형을 고려하면 두 함수 $f(x)=\cos^2x-\sin x$와 $y=x$는 한 점에서 만난다.
        따라서 $-\pi\le x\le\pi$에서 방정식 $\cos^2x-\sin x-x=0$은 1개의 실근을 갖는다.
      source_flow: 해설 p.6~7
      criteria:
      - 2.A1
    - id: 2b-5
      content: |
        (다른 풀이) 함수 $f(x)=\cos^2x-\sin x-x$로 놓으면 $f(x)=-\sin^2x-\sin x+1-x=-\sin x(1+\sin x)+1-x$이다.
        (ⅰ) $-\pi\le x\le0$에서 $-\sin x(1+\sin x)\ge0$이고 $1-x>0$이므로 $f(x)>0$
        (ⅱ) $x=\dfrac{\pi}{2}$에서 $f\left(\dfrac{\pi}{2}\right)=-1-\dfrac{\pi}{2}<0$이므로 $0<x<\dfrac{\pi}{2}$에서 함수 $f(x)$는 부호가 양에서 음으로 바뀌므로 사잇값 정리에 의해 $0<x<\dfrac{\pi}{2}$에서 $f(x)=0$은 적어도 1개의 실근을 갖는다.
        $0<x<\dfrac{\pi}{2}$에서 $f^{\prime}(x)=-2\sin x\cos x-\cos x-1=-\sin(2x)-\cos x-1<0$이므로 $f(x)$는 $0<x<\dfrac{\pi}{2}$에서 감소하고, $f(x)=0$은 단 1개의 실근을 갖는다.
        (ⅲ) $\dfrac{\pi}{2}\le x\le\pi$에서 $-\sin x(1+\sin x)\le0$이고 $1-x<0$이므로 $f(x)<0$
        따라서 $-\pi\le x\le\pi$에서 방정식 $\cos^2x-\sin x-x=0$은 1개의 실근을 갖는다.
      source_flow: 해설 p.6~7
      criteria:
      - 2.R1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $f(x)=\cos^2x-\sin x=-\sin^2x-\sin x+1$ 또는 $f(x)=\cos^2x-\sin x-x$로 함수를 세웠다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $f^{\prime}(x)=0$을 만족하는 $x=-\dfrac{\pi}{2},\dfrac{\pi}{2},-\dfrac{\pi}{6},-\dfrac{5\pi}{6}$을 얻거나, 일부 구간에서 $f(x)>0$임을 올바로 얻었다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        제시된 주요 구간에서 함수의 증감표나 함숫값의 부호가 모두 올바르다.
      depends_on:
      - 2.M2
      implied_ok: false
      steps:
      - 2b-3
      - 2b-5
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        근의 개수가 1개임을 제시했다.
      depends_on:
      - 2.R1
      implied_ok: false
      steps:
      - 2b-4
