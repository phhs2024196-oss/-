      depends_on:
      - 1-2.M1
      implied_ok: false
      steps:
      - 12b-2
    - id: 1-2.R2
      mark_type: R
      points: 2
      evidence: |
        $3^q$은 홀수이고 $4^p$은 짝수이므로 모순임을 언급했다.
      depends_on:
