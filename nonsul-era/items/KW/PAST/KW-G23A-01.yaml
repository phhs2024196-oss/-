- label: '1'
  body: |
    귀류법
    어떤 명제가 참임을 증명할 때, 주어진 명제의 결론을 부정하여 가정 또는 이미 알려진 수학적 사실 등에 모순됨을 보여 원래의 명제가 참임을 증명하는 방법을 귀류법이라고 한다.
- label: '2'
  body: |
    조건부 확률
    사건 $A$가 일어났을 때의 사건 $B$의 조건부확률은
    $$\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}\ (\text{단, }\mathrm{P}(A)>0)$$
stem: |
  [문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: 1-1
  stem: |
    [1] 다음 물음에 답하시오.

    (1) 실수 $a$에 대하여 $3^{a}=4$일 때, $\left(\dfrac{1}{27}\right)^{\frac{a}{12}}$의 값을 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: sqrt(2)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $\left(\dfrac{1}{27}\right)^{\frac{a}{12}}=3^{-3\times\frac{a}{12}}=(3^{a})^{-\frac14}$
      source_flow: 해설 p.6
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $3^a=4$이므로 $(3^{a})^{-\frac14}=4^{-\frac14}=\dfrac{1}{\sqrt2}=\dfrac{\sqrt2}{2}$이다.
        (다른 풀이) $a=\log_3 4$이므로 $p^{\log_p q}=q$를 이용하면 $\left(\dfrac{1}{27}\right)^{\frac{a}{12}}=3^{-\frac a4}=3^{-\frac14\log_3 4}=3^{\log_3\frac{1}{\sqrt2}}=\dfrac{\sqrt2}{2}$이다.
      source_flow: 해설 p.6
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        $\left(\dfrac{1}{27}\right)^{\frac{a}{12}}=(3^a)^{-\frac14}$ 또는 $3^{-\frac14\log_3 4}$ 꼴로 식을 변형했다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        값 $\dfrac{\sqrt2}{2}$를 얻었다.
      depends_on:
      - 1-1.M1
      implied_ok: false
      steps:
      - 11b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) 귀류법을 이용하여 $\log_{3}4$가 무리수임을 증명하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $\log_3 4$는 유리수라고 가정하자.
      source_flow: 해설 p.6
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $\log_3 4>0$이므로 $\log_3 4=\dfrac{q}{p}$인 자연수 $p,q$가 존재한다.
      source_flow: 해설 p.6
      criteria:
      - 1-2.R1
    - id: 12b-3
      content: |
        $\log_3 4=\dfrac{q}{p}\iff 3^{\frac qp}=4$로부터 $3^q=4^p$를 얻는다.
        $3^q$은 홀수이고 $4^p$은 짝수이므로 모순이다. 따라서 $\log_3 4$는 무리수이다. ■
      source_flow: 해설 p.6
      criteria:
      - 1-2.R2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: |
        $\log_3 4$가 유리수라고 가정하고 $\log_3 4=\dfrac{q}{p}$로 놓았다.
      depends_on: []
      implied_ok: false
      steps:
