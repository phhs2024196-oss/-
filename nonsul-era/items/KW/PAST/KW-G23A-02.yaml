stimuli:
- label: '1'
  body: |
    좌표평면 위의 선분의 내분점
    두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$에 대하여 선분 $\mathrm{AB}$를 $m:n\,(m>0,\ n>0)$으로 내분하는 점 $\mathrm{P}$의 좌표는
    $$\left(\dfrac{mx_2+nx_1}{m+n},\ \dfrac{my_2+ny_1}{m+n}\right)$$
- label: '2'
  body: |
    미분가능
    함수 $y=f(x)$에 대하여
    $$\lim_{\Delta x\to0}\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$$
    가 존재하면 함수 $y=f(x)$는 $x=a$에서 미분가능하다고 한다.
- label: '3'
  body: |
    미분가능한 함수의 극대와 극소의 판정
    미분가능한 함수 $f(x)$에 대하여 $f^{\prime}(a)=0$이고 $x=a$의 좌우에서
    (1) $f^{\prime}(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.
    (2) $f^{\prime}(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.
stem: |
