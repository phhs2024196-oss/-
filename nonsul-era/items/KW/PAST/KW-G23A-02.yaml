        $y^{\prime}(x)=\dfrac{2x^{2}e^{x}}{(x^{2}+2x+2)^{2}}\ge0$이므로 $y(x)$는 열린구간 $(0,\infty)$에서 증가하고 $y(x)>y(0)=1$이다.
      source_flow: 해설 p.16~17
      criteria:
