        $x<0$일 때 $g(x)=0$이므로 $\displaystyle\lim_{x\to0-}\dfrac{g(x)}{x}=\lim_{x\to0-}\dfrac{0}{x}=0$ …… ①
      source_flow: 해설 p.17
