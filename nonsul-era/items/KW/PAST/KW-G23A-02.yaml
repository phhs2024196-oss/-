      points: 2
      evidence: |
        $\alpha=\dfrac{1+\sqrt5}{2}$, $\beta=\dfrac{1-\sqrt5}{2}$이고 $\left\lvert\dfrac{\beta}{\alpha}\right\rvert<1$이므로 $\displaystyle\lim_{n\to\infty}\left(\dfrac{\beta}{\alpha}\right)^{n}=0$을 제시했다.
      depends_on:
