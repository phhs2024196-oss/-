  misconceptions: []
- id: 2-1
  stem: |
    [2] 이차방정식 $x^{2}-x-1=0$의 두 근을 $\alpha,\beta\,(\alpha>\beta)$라고 할 때, 다음 물음에 답하시오.

    (1) $k(\alpha^{5}-\beta^{5})=5$를 만족하는 실수 $k$의 값을 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: sqrt(5)/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        이차방정식 $x^{2}-x-1=0$의 두 근인 $\alpha=\dfrac{1+\sqrt5}{2}$와 $\beta=\dfrac{1-\sqrt5}{2}$는 다음 식들을 만족한다. $\alpha^{2}-\alpha-1=0$, $\beta^{2}-\beta-1=0$, $\alpha-\beta=\sqrt5$
      source_flow: 해설 p.15
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        이를 이용하면 $\alpha^{5}=(\alpha^{2})^{2}\alpha=(\alpha+1)^{2}\alpha=\alpha(\alpha^{2})+2\alpha^{2}+\alpha=\alpha(\alpha+1)+2(\alpha+1)+\alpha=\alpha+1+4\alpha+2=5\alpha+3$이다. 같은 방법으로 $\beta^{5}=5\beta+3$이므로 $k(\alpha^{5}-\beta^{5})=k(5\alpha+3-5\beta-3)=5k(\alpha-\beta)=5k\sqrt5=5$이다.
      source_flow: 해설 p.15
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        따라서 $k=\dfrac{1}{\sqrt5}=\dfrac{\sqrt5}{5}$이다.
        (다른 풀이) $\alpha+\beta=1$, $\alpha\beta=-1$, $\alpha-\beta=\sqrt5$, $\alpha^{2}+\beta^{2}=(\alpha+\beta)^{2}-2\alpha\beta=3$이다. $\alpha^{5}-\beta^{5}=(\alpha^{2}-\beta^{2})(\alpha^{3}+\beta^{3})+\alpha^{2}\beta^{2}(\alpha-\beta)=(\alpha+\beta)(\alpha-\beta)(\alpha+\beta)(\alpha^{2}+\beta^{2}-\alpha\beta)+\alpha^{2}\beta^{2}(\alpha-\beta)=\sqrt5\{3-(-1)\}+\sqrt5=5\sqrt5$이므로 $k(\alpha^{5}-\beta^{5})=5k\sqrt5=5$, $k=\dfrac{\sqrt5}{5}$이다.
      source_flow: 해설 p.15
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 2
      evidence: |
        $\alpha=\dfrac{1+\sqrt5}{2}$, $\beta=\dfrac{1-\sqrt5}{2}$, $\alpha^{2}+\beta^{2}=3$, $\alpha-\beta=\sqrt5$ 등 일부 올바른 계산을 수행했다.
      depends_on: []
      implied_ok: false
      steps:
      - 21b-1
    - id: 2-1.M2
      mark_type: M
      points: 2
      evidence: |
        $\alpha^{5}=5\alpha+3$을 얻거나 $\alpha^{5}-\beta^{5}=5\sqrt5$를 얻었다.
      depends_on:
      - 2-1.M1
      implied_ok: false
      steps:
      - 21b-2
    - id: 2-1.A1
      mark_type: A
      points: 2
      evidence: |
        $k=\dfrac{\sqrt5}{5}$를 얻었다.
      depends_on:
      - 2-1.M2
      implied_ok: false
      steps:
      - 21b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (2) 극한값 $\displaystyle\lim_{n\to\infty}\dfrac{\alpha^{n+4}-\beta^{n+4}}{\alpha^{n}-\beta^{n}}$을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: (7+3*sqrt(5))/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $\dfrac{\alpha^{n+4}-\beta^{n+4}}{\alpha^{n}-\beta^{n}}=\dfrac{\alpha^{4}-\beta^{4}\left(\dfrac{\beta}{\alpha}\right)^{n}}{1-\left(\dfrac{\beta}{\alpha}\right)^{n}}$
      source_flow: 해설 p.16
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        $\alpha=\dfrac{1+\sqrt5}{2}$, $\beta=\dfrac{1-\sqrt5}{2}$이고 $\left\lvert\dfrac{\beta}{\alpha}\right\rvert<1$이므로 $\displaystyle\lim_{n\to\infty}\left(\dfrac{\beta}{\alpha}\right)^{n}=0$이다.
      source_flow: 해설 p.16
      criteria:
      - 2-2.R1
    - id: 22b-3
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}\dfrac{\alpha^{n+4}-\beta^{n+4}}{\alpha^{n}-\beta^{n}}=\alpha^{4}$이다.
      source_flow: 해설 p.16
      criteria:
      - 2-2.M2
    - id: 22b-4
      content: |
        $\alpha^{2}-\alpha-1=0$이므로 $\alpha^{4}=(\alpha+1)^{2}=\alpha+1+2\alpha+1=3\alpha+2=\dfrac{7+3\sqrt5}{2}$이다.
      source_flow: 해설 p.16
      criteria:
      - 2-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
