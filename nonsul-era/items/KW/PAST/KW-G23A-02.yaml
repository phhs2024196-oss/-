    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $k>\dfrac14$일 때 $kx^{2}+x+1>0$이므로 $k\ge\dfrac12$에 대하여 함수 $f(x)$는 모든 실수에서 미분가능하다. 함수의 몫의 미분법을 이용하면 $f^{\prime}(x)=\dfrac{e^{x}x(kx-2k+1)}{(kx^{2}+x+1)^{2}}$이다.
      source_flow: 해설 p.16
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $f^{\prime}(x)=0$에서 $x=0$ 또는 $x=2-\dfrac1k$이다.
      source_flow: 해설 p.16
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        (ⅰ) $k=\dfrac12$일 때 $2-\dfrac1k=0$이므로 $f^{\prime}(x)=\dfrac{2x^{2}e^{x}}{(x^{2}+2x+2)^{2}}$이다. $x=0$의 좌우에서 $f^{\prime}(x)$의 부호가 변하지 않으므로 극값이 없다.
        (ⅱ) $k>\dfrac12$일 때 $f^{\prime}(x)$의 부호를 조사하여 함수 $f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.

        $$\begin{array}{c|ccccc}x&\cdots&0&\cdots&2-\frac1k&\cdots\\\hline f^{\prime}(x)&+&0&-&0&+\\\hline f(x)&\nearrow&1&\searrow&\dfrac{e^{2-\frac1k}}{4k-1}&\nearrow\end{array}$$
      source_flow: 해설 p.16
      criteria:
      - 3-1.R1
    - id: 31b-4
      content: |
        따라서 $f(x)$는 $x=0$에서 극대이고 극댓값은 $1$, $x=2-\dfrac1k$에서 극소이고 극솟값은 $\dfrac{e^{2-\frac1k}}{4k-1}$이다.
      source_flow: 해설 p.16
      criteria:
      - 3-1.A1
