- id: 3-1
  stem: |
    [3] 함수 $f(x)$와 $g(x)$에 대하여 다음 물음에 답하시오. (단, $k\ge\dfrac12$)

    $$f(x)=\dfrac{e^{x}}{kx^{2}+x+1},\qquad g(x)=\begin{cases}e^{-\frac1x}&(x>0)\\0&(x\le0)\end{cases}$$

    (1) 함수 $f(x)$의 극값을 구하시오. [10점]
  points: 10
