      mark_type: M
      points: 2
      evidence: |
        중심 $(a,a)$, 반지름 $a$인 원의 방정식과 점과 직선 사이의 거리 $\dfrac{\lvert7a-6\rvert}{5}=a$를 세워 푸는 과정을 올바로 기술했다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        $a=3$ 또는 $a=\dfrac12$을 얻었다.
      depends_on:
      - 1-1.M1
      implied_ok: false
      steps:
      - 11b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) 직선 $3x+4y-6=0$이 $x$축과 만나는 점을 $\mathrm{A}$, $y$축과 만나는 점을 $\mathrm{B}$라고 할 때, 선분 $\mathrm{AB}$를 $1:2$로 내분하는 점을 $\mathrm{P}$라고 하자. 점 $\mathrm{P}$에서 위 조건을 만족하는 가장 작은 원에 접선을 그었을 때, 두 접선이 이루는 예각 $\theta$에 대하여 $\sin\theta$ 값을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 24/25
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        직선 $3x+4y-6=0$의 $x$절편, $y$절편은 각각 $\mathrm{A}(2,0)$, $\mathrm{B}\left(0,\dfrac32\right)$이다. 선분 $\mathrm{AB}$를 $1:2$로 내분하는 점 $\mathrm{P}$의 좌표는 $\left(\dfrac{1\times0+2\times2}{1+2},\dfrac{1\times\frac32+2\times0}{1+2}\right)=\left(\dfrac43,\dfrac12\right)$이다.
      source_flow: 해설 p.14~15
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        조건을 만족하는 가장 작은 원의 방정식은 $\left(x-\dfrac12\right)^2+\left(y-\dfrac12\right)^2=\dfrac14$이다. 점 $\mathrm{P}$에서의 원에 그은 두 접선 중 하나는 직선 $3x+4y-6=0$이고, 원의 중심 $\mathrm{C}\left(\dfrac12,\dfrac12\right)$과 점 $\mathrm{P}\left(\dfrac43,\dfrac12\right)$이 $x$축과 평행한 직선 위에 있으므로 선분 $\mathrm{CP}$와 직선 $3x+4y-6=0$이 이루는 예각을 $\alpha$라 하면 삼각형 $\mathrm{OAB}$에서 $\sin\alpha=\dfrac35$, $\cos\alpha=\dfrac45$이다.
      source_flow: 해설 p.14~15
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        점 $\mathrm{P}$에서의 원에 그은 또 다른 접선과 선분 $\mathrm{CP}$가 이루는 각도 $\alpha$이므로 두 접선이 이루는 각 $\theta=2\alpha$이다. 따라서 $\sin\theta=\sin2\alpha=2\sin\alpha\cos\alpha=\dfrac{24}{25}$이다.
        (다른 풀이) 원의 중심 $\mathrm{C}\left(\dfrac12,\dfrac12\right)$에서 직선 $3x+4y-6=0$에 내린 수선의 발을 $\mathrm{H}$라 하자. $\overline{\mathrm{CP}}=\sqrt{\left(\dfrac43-\dfrac12\right)^2+0}=\dfrac56$, $\overline{\mathrm{CH}}=\dfrac12$이므로 $\overline{\mathrm{PH}}=\sqrt{\left(\dfrac56\right)^2-\left(\dfrac12\right)^2}=\dfrac23$이다. $\sin\alpha=\dfrac{\overline{\mathrm{CH}}}{\overline{\mathrm{CP}}}=\dfrac35$, $\cos\alpha=\dfrac{\overline{\mathrm{PH}}}{\overline{\mathrm{CP}}}=\dfrac45$이므로 $\sin\theta=\sin2\alpha=2\sin\alpha\cos\alpha=\dfrac{24}{25}$이다.
      source_flow: 해설 p.14~15
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
