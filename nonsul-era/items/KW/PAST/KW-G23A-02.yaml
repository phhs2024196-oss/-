        $x>0$일 때 $t=\dfrac1x$라고 놓으면 $x\to0+$일 때 $t\to\infty$이므로 $\displaystyle\lim_{x\to0+}\dfrac{g(x)}{x}=\lim_{x\to0+}\dfrac{e^{-\frac1x}}{x}=\lim_{t\to\infty}\dfrac{t}{e^{t}}=0$ …… ②
      source_flow: 해설 p.17
      criteria:
      - 3-3.B2
    - id: 33b-3
      content: |
        따라서 ①과 ②로부터 $g^{\prime}(0)=0$이고 함수 $g(x)$는 $x=0$에서 미분가능하다.
      source_flow: 해설 p.17
      criteria:
      - 3-3.R1
