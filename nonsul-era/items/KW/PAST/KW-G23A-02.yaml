subparts:
- id: 1-1
  stem: |
    [1] 아래 조건을 만족시키는 원에 대하여 다음 물음에 답하시오.

    중심이 제1사분면 위에 있고 $x$축과 $y$축에 모두 접한다.
    직선 $3x+4y-6=0$과 한 점에서 만난다.

    (1) 위 조건을 만족시키는 모든 원의 반지름의 길이를 구하시오. [4점]
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: r1=3; r2=1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        원의 방정식을 $(x-a)^2+(y-a)^2=a^2,\ (a>0)$이라고 하면 점 $(a,a)$와 직선 $3x+4y-6=0$ 사이의 거리는 반지름 $a$와 같으므로 $\dfrac{\lvert3a+4a-6\rvert}{\sqrt{3^2+4^2}}=\dfrac{\lvert7a-6\rvert}{5}=a$이다.
      source_flow: 해설 p.14
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        이 식을 풀면 $a=3$ 또는 $a=\dfrac12$이다.
      source_flow: 해설 p.14
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
