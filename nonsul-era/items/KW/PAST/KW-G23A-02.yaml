      content: |
        그러므로 $0<\dfrac{x}{e^{x}}<\dfrac{2}{x}$이고 $\displaystyle\lim_{x\to\infty}\dfrac{2}{x}=0$이므로 함수의 극한의 대소 관계를 이용하면 $\displaystyle\lim_{x\to\infty}\dfrac{x}{e^{x}}=0$이다. ■
      source_flow: 해설 p.16~17
      criteria:
      - 3-2.R2
