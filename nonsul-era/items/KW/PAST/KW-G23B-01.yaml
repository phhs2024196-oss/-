- id: 4-2
  stem: |
    (2) $a\le x\le a+2$에서 함수 $f(x)$의 최댓값을 $g(a)$라고 할 때, 함수 $g(a)$를 구하고 함수 $g(a)$의 극값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: g1=2*a**4-a**2; g2=a**4; g3=(a+2)**2; min=-1/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        (ⅰ) $a+2<a^{2}$일 때, $a^{2}-a-2=(a+1)(a-2)>0$에서 $a<-1$, $a>2$이다. $a$는 양수이므로 $a>2$이다. 최댓값 $g(a)=f(a+2)=(a+2)^{2}$
      source_flow: 해설 p.9~10
      criteria:
      - 4-2.M1
      - 4-2.M2
    - id: 42b-2
      content: |
        (ⅱ) $a\le a^{2}\le a+2$일 때, $a^{2}-a=a(a-1)\ge0$이면 $a\le0$, $a\ge1$ …… ①이고 $a^{2}-a-2=(a+1)(a-2)\le0$이면 $-1\le a\le2$ …… ②이다. $a$는 양수이므로 ①과 ②로부터 $1\le a\le2$이다. 최댓값 $g(a)=f(a^{2})=a^{4}$
      source_flow: 해설 p.9~10
      criteria:
      - 4-2.M1
      - 4-2.M2
    - id: 42b-3
      content: |
        (ⅲ) $a^{2}<a$일 때, $0<a<1$이다. 최댓값 $g(a)=f(a)=2a^{4}-a^{2}$
      source_flow: 해설 p.9~10
      criteria:
      - 4-2.M1
      - 4-2.M2
    - id: 42b-4
      content: |
        (ⅰ), (ⅱ), (ⅲ)으로부터 $g(a)=\begin{cases}2a^{4}-a^{2}&(0<a<1)\\a^{4}&(1\le a\le2)\\(a+2)^{2}&(a>2)\end{cases}$이다. 함수 $g(a)$는 $a>0$에서 연속이고 $a\ge1$에서 증가하므로 $a\ge1$에서 함수 $g(a)$는 극값을 갖지 않는다. $0<a<1$에서 $g^{\prime}(a)=8a^{3}-2a=2a(4a^{2}-1)=0$으로부터 $a=\dfrac12$이다. $a=\dfrac12$의 좌우에서 $g^{\prime}(a)$의 부호가 음에서 양으로 변하므로 함수 $g(a)$의 극솟값은 $g\left(\dfrac12\right)=-\dfrac18$이다.
      source_flow: 해설 p.9~10
      criteria:
      - 4-2.M2
      - 4-2.A1
  rubric:
