stimuli:
- label: '1'
  body: |
    일대일대응
    함수 $f:X\to Y$에서 두 조건
    (1) 일대일함수이다.　(2) 치역과 공역이 같다.
    를 모두 만족시킬 때, 함수 $f$를 일대일대응이라고 한다.
- label: '2'
  body: |
    직선 $y=x$에 대한 도형의 대칭이동
    방정식 $f(x,y)=0$이 나타내는 도형을 직선 $y=x$에 대하여 대칭이동한 도형의 방정식은 $f(y,x)=0$
- label: '3'
  body: |
    미분가능한 함수의 극대와 극소의 판정
    미분가능한 함수 $f(x)$에 대하여 $f^{\prime}(a)=0$이고 $x=a$의 좌우에서
    (1) $f^{\prime}(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.
    (2) $f^{\prime}(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.
stem: |
  [문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: 1-1
  stem: |
    [1] 두 집합 $A=\{x\mid x$는 $6$의 약수$\}$, $B=\{x\mid x$는 $9$ 이하의 소수$\}$에 대하여 다음 물음에 답하시오.

    (1) 집합 $A$에서 집합 $B$로의 일대일대응인 함수 $f(x)$는 $x\in A$에 대하여 $x<f(x)$를 만족시킨다. 함수 $f$의 개수와 $(f^{-1}\circ f\circ f^{-1})(5)$의 값을 구하시오. [4점]
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: count=1; value=3
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $A=\{1,2,3,6\}$, $B=\{2,3,5,7\}$이다. $a<f(a)\ (a\in A)$를 만족하는 함수는 오직 $f(6)=7$, $f(3)=5$, $f(2)=3$, $f(1)=2$이므로 함수 $f$의 개수는 1개이다.
      source_flow: 해설 p.7
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $(f^{-1}\circ f\circ f^{-1})(5)=(f^{-1}\circ f)(f^{-1}(5))=(f^{-1}\circ f)(3)=f^{-1}(f(3))=f^{-1}(5)=3$이다.
        (다른 풀이) $f\circ f^{-1}=I$(항등함수)이므로 $(f^{-1}\circ f\circ f^{-1})(5)=f^{-1}(5)=3$이다.
      source_flow: 해설 p.7
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        $a<f(a)\ (a\in A)$를 만족하는 일대일대응을 모두 찾았다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        $(f^{-1}\circ f\circ f^{-1})(5)=3$의 값을 계산했다.
      depends_on:
      - 1-1.M1
      implied_ok: false
      steps:
      - 11b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) 집합 $A$에서 집합 $B$로의 일대일대응인 함수 $g(x)$는 $x\in A$에 대하여 $x\le g(x)$를 만족시킨다. 함수 $g$의 개수를 구하시오. [6점]
  points: 6
  depends_on: []
