- id: 2-1
  stem: |
    [2] 방정식 $y=-x^{2}+px+q$가 나타내는 도형과 그 도형을 직선 $y=x$에 대하여 대칭이동한 도형이 접할 때, 다음 물음에 답하시오. (단, $p,q$는 실수)

    (1) $p,q$에 대한 관계식을 구하시오. [4점]
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: rel_a=(1-p)**2+4*q; rel_b=p**2-2*p-3+4*q
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        방정식 $y=-x^{2}+px+q$가 나타내는 도형이 직선 $y=x$와 접하는 경우, 방정식 $y=-x^{2}+px+q$가 나타내는 도형과 이 도형을 직선 $y=x$에 대하여 대칭이동한 도형은 서로 접한다. $x=-x^{2}+px+q$라 하면 $x^{2}+(1-p)x-q=0$의 판별식 $D=0$에서 $(1-p)^{2}+4q=0$이다.
      source_flow: 해설 p.7~8
      criteria:
      - 2-1.M1
      - 2-1.A1
    - id: 21b-2
      content: |
        (다른 풀이) 곡선 $y=-x^{2}+px+q$의 접선의 기울기가 $-1$인 점 $\mathrm{A}$가 직선 $y=x$상에 놓이는 경우, 방정식 $y=-x^{2}+px+q$가 나타내는 도형과 이 도형을 직선 $y=x$에 대하여 대칭이동한 도형은 점 $\mathrm{A}$에서 접한다. $\dfrac{dy}{dx}=-2x+p=-1$에서 $x=\dfrac{p+1}{2}$이므로 점 $\mathrm{A}$의 좌표는 $\left(\dfrac{p+1}{2},\dfrac{p+1}{2}\right)$이다. 점 $\mathrm{A}$의 좌표를 방정식 $y=-x^{2}+px+q$에 대입하면 $\dfrac{p+1}{2}=-\left(\dfrac{p+1}{2}\right)^{2}+p\left(\dfrac{p+1}{2}\right)+q$이다. 이를 정리하면 $p^{2}-2p-3+4q=0$이다.
      source_flow: 해설 p.7~8
      criteria:
      - 2-1.M1
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 2
      evidence: |
        도형이 직선 $y=x$와 접하는 것을 이용해 식 $x=-x^{2}+px+q$를 구하거나, 점 $\mathrm{A}$의 좌표 $\left(\dfrac{p+1}{2},\dfrac{p+1}{2}\right)$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 21b-1
      - 21b-2
    - id: 2-1.A1
      mark_type: A
      points: 2
      evidence: |
        $p,q$에 대한 관계식 $(1-p)^{2}+4q=0$이나 $p^{2}-2p-3+4q=0$을 구했다.
      depends_on:
      - 2-1.M1
      implied_ok: false
      steps:
      - 21b-1
      - 21b-2
