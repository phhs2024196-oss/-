    kind: expression
    value: 4*(sqrt(2)-1)*a**6/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        (ⅰ) $x\ge a^{2}$일 때 함수 $f(x)=-x^{2}+2a^{4}$
        (ⅱ) $x<a^{2}$일 때 함수 $f(x)=x^{2}$
        (ⅰ)과 (ⅱ)로부터 $f(x)=\begin{cases}x^{2}&(x<a^{2})\\-x^{2}+2a^{4}&(x\ge a^{2})\end{cases}$이다.
      source_flow: 해설 p.9
      criteria:
      - 4-1.M1
      - 4-1.B1
    - id: 41b-2
      content: |
        곡선 $y=f(x)$와 $x$축으로 둘러싸인 도형의 넓이를 $S$라고 하면
        $S=\displaystyle\int_0^{a^{2}}x^{2}dx+\int_{a^{2}}^{\sqrt2a^{2}}(-x^{2}+2a^{4})dx=\dfrac13a^{6}+\left[-\dfrac13x^{3}+2a^{4}x\right]_{a^{2}}^{\sqrt2a^{2}}=\left\{\dfrac13-\dfrac13(2\sqrt2-1)+2\sqrt2-2\right\}a^{6}=\dfrac43(\sqrt2-1)a^{6}$이다.
      source_flow: 해설 p.9
      criteria:
      - 4-1.A1
