- id: 2-2
  stem: |
    (2) 점 $(p,q)$가 그리는 도형과 그 도형을 직선 $y=x$에 대하여 대칭이동한 도형이 만나는 점의 개수를 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: count_a=1; count_b=2
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        점 $(p,q)$가 그리는 도형의 방정식은 $y=-\dfrac14(1-x)^{2}$ …… ①이다. 이 도형을 직선 $y=x$에 대하여 대칭이동한 도형의 방정식은 $x=-\dfrac14(1-y)^{2}$ …… ②이다.
      source_flow: 해설 p.8
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        ①과 ②의 교점은 두 함수의 그래프를 고려하면 ①과 $y=x$의 교점과 같다. $x=-\dfrac14(1-x)^{2}$라고 하면 $x^{2}+2x+1=(x+1)^{2}=0$에서 $x=-1$이다. 따라서 두 도형이 만나는 점은 1개이다.
      source_flow: 해설 p.8
      criteria:
      - 2-2.M2
      - 2-2.A1
    - id: 22b-3
      content: |
        (다른 풀이) 점 $(p,q)$가 그리는 도형의 방정식은 $y=-\dfrac14(x-1)^{2}+1$ …… ①이다. 이 도형을 직선 $y=x$에 대하여 대칭이동한 도형의 방정식은 $x=-\dfrac14(y-1)^{2}+1$ …… ②이다. ①과 ②의 교점은 두 함수의 그래프를 고려하면 ①과 $y=x$의 교점과 같다. $x=-\dfrac14(x-1)^{2}+1$이라고 하면 $x^{2}+2x-3=(x+3)(x-1)=0$이므로 $x=1$ 또는 $x=-3$이다. 따라서 두 도형이 만나는 점은 2개이다.
      source_flow: 해설 p.8
      criteria:
      - 2-2.M1
      - 2-2.M2
      - 2-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 2
      evidence: |
        점 $(p,q)$가 그리는 도형의 방정식 $y=-\dfrac14(1-x)^{2}$이나 $y=-\dfrac14(x-1)^{2}+1$을 구했다.
      depends_on: []
