  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $a=\dfrac{\pi}{2}$와 $f(x)=\dfrac{\cos^{2023}x}{\sin^{2023}x+\cos^{2023}x}$일 때 (1)의 등식을 이용하면 $\sin\left(\dfrac{\pi}{2}-x\right)=\cos x$, $\cos\left(\dfrac{\pi}{2}-x\right)=\sin x$이므로
        $\displaystyle\int_0^{\frac{\pi}{2}}\dfrac{\cos^{2023}x}{\sin^{2023}x+\cos^{2023}x}dx=\int_0^{\frac{\pi}{2}}\dfrac{\cos^{2023}\left(\frac{\pi}{2}-x\right)}{\sin^{2023}\left(\frac{\pi}{2}-x\right)+\cos^{2023}\left(\frac{\pi}{2}-x\right)}dx=\int_0^{\frac{\pi}{2}}\dfrac{\sin^{2023}x}{\cos^{2023}x+\sin^{2023}x}dx$
      source_flow: 해설 p.8~9
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        위 식으로부터 $\displaystyle2\int_0^{\frac{\pi}{2}}\dfrac{\cos^{2023}x}{\sin^{2023}x+\cos^{2023}x}dx=\int_0^{\frac{\pi}{2}}\dfrac{\cos^{2023}x}{\sin^{2023}x+\cos^{2023}x}dx+\int_0^{\frac{\pi}{2}}\dfrac{\sin^{2023}x}{\sin^{2023}x+\cos^{2023}x}dx=\int_0^{\frac{\pi}{2}}\dfrac{\sin^{2023}x+\cos^{2023}x}{\sin^{2023}x+\cos^{2023}x}dx=\int_0^{\frac{\pi}{2}}1\,dx=\dfrac{\pi}{2}$
      source_flow: 해설 p.8~9
      criteria:
      - 3-2.R1
    - id: 32b-3
      content: |
        따라서 $\displaystyle\int_0^{\frac{\pi}{2}}\dfrac{\cos^{2023}x}{\sin^{2023}x+\cos^{2023}x}dx=\dfrac{\pi}{4}$이다.
      source_flow: 해설 p.8~9
