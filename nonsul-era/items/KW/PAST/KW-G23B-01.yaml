- id: 3-1
  stem: |
    [3] 다음 물음에 답하시오.

    (1) 모든 실수에서 연속인 함수 $f(x)$에 대하여 아래 등식이 성립함을 보이시오. (단, $a$는 실수) [5점]

    $$\int_0^{a}f(x)dx=\int_0^{a}f(a-x)dx$$
  points: 5
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $t=a-x$라고 하면 $\dfrac{dt}{dx}=-1$이고 $x=0$일 때 $t=a$, $x=a$일 때 $t=0$이므로 정적분의 치환적분법을 이용하면
        $\displaystyle\int_0^{a}f(a-x)dx=-\int_a^{0}f(t)dt=\int_0^{a}f(t)dt=\int_0^{a}f(x)dx$이다. ■
      source_flow: 해설 p.8
      criteria:
      - 3-1.M1
      - 3-1.R1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
