      content: |
        $g(6)=7$이다. $g(3)=5$ 또는 $g(3)=3$이므로 2가지이다.
      source_flow: 해설 p.7
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $g(3)$의 각각의 경우에 대하여 $g(2)$는 남은 2개 원소 중 하나를 선택할 수 있다. 따라서 함수 $g$의 개수는 $2\times2=4$이다.
      source_flow: 해설 p.7
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
