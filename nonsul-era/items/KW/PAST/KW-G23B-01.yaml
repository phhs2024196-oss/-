  stem: |
    [4] 함수 $f(x)=-\lvert x-a^{2}\rvert(x+a^{2})+a^{4}$에 대하여 다음 물음에 답하시오. (단, $a>0$)

    (1) 곡선 $y=f(x)$와 $x$축으로 둘러싸인 도형의 넓이를 구하시오. [7점]
  points: 7
