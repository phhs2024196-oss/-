    - id: 41b-3
      content: |
        (ⅱ) $f(x)=rx^{2}+sx+t\ (r\ne0)$라고 하고 조건식에 대입하면 $(4r^{2}-1)x^{3}+4rsx^{2}+s^{2}x=px^{3}+(q+r)x^{2}+sx+t$이다. 계수를 비교하면 $4r^{2}-1=p$, $4rs=q+r$, $s^{2}=s$, $t=0$이다. 여기서 $s(s-1)=0$이므로 $s=0,1$이다.
        ① $s=0$이면 $r=-q\ (q\ne0)$, $p=4q^{2}-1$이다. 따라서 $p=4q^{2}-1\ (q\ne0)$, $f(x)=-qx^{2}$이다.
        ② $s=1$이면 $r=\dfrac q3\ (q\ne0)$, $p=\dfrac49q^{2}-1$이다. 따라서 $p=\dfrac49q^{2}-1\ (q\ne0)$, $f(x)=\dfrac q3x^{2}+x$이다.
      source_flow: 해설 p.17
      criteria:
