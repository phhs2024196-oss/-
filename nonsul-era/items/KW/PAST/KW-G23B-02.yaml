- id: 4-1
  stem: |
    [4] 모든 실수 $x$에 대하여 다항식 $f(x)$는 아래 조건을 만족시킨다. 다음 물음에 답하시오.

    $$x\{f^{\prime}(x)+x\}\{f^{\prime}(x)-x\}=f(x)+px^{3}+qx^{2}\quad(p,q\text{는 실수})$$

    (1) 위 조건을 만족시키는 일차 이상의 다항식 $f(x)$를 구하고, 이때 실수 $p,q$의 값 또는 $p,q$에 대한 관계식을 구하시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: fa=x; pa=-1; qa=0; fb=-q*x**2; pb=4*q**2-1; fc=q*x**2/3+x; pc=4*q**2/9-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        $f(x)$를 $n$차 다항식이라고 하자. (단, $n\ge1$) $n\ge3$이면 조건식 좌변의 차수는 $2n-1$, 우변의 차수는 $n$으로 좌변과 우변의 차수는 같지 않다. 따라서 $f(x)$는 3차 이상의 다항식이 아니다.
      source_flow: 해설 p.17
      criteria:
