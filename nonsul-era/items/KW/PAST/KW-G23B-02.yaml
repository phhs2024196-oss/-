stimuli:
- label: '1'
  body: |
    좌표평면 위의 두 점 사이의 거리
    좌표평면 위의 두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$ 사이의 거리는
    $$\overline{\mathrm{AB}}=\sqrt{(x_1-x_2)^{2}+(y_1-y_2)^{2}}$$
- label: '2'
  body: |
    이산확률변수의 기댓값
    이산확률변수 $X$의 확률분포가 $\mathrm{P}(X=x_i)=p_i\ (i=1,2,3,\cdots,n)$일 때, $X$의 기댓값은
    $$\mathrm{E}(X)=x_1p_1+x_2p_2+x_3p_3+\cdots+x_np_n$$
- label: '3'
  body: |
    나머지정리
    $x$에 대한 다항식 $P(x)$를 일차식 $x-\alpha$로 나누었을 때의 나머지를 $R$라고 하면
    $$R=P(\alpha)$$
