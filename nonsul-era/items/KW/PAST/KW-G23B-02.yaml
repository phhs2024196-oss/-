subparts:
- id: 1-1
  stem: |
    [1] 함수 $f(x)=\log_{\lvert a-2\rvert}(x^{2}+2ax+4a+5)$에 대하여 다음 물음에 답하시오. (단, $a$는 실수)

    (1) 함수 $f(x)$가 정의되기 위한 실수 $a$의 값 중 정수를 모두 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: a1=0; a2=4
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        진수의 조건에서 $x^{2}+2ax+4a+5>0$이므로 판별식 $D=4a^{2}-4(4a+5)=4a^{2}-16a-20=4(a+1)(a-5)<0$에서 $-1<a<5$ …… ①
      source_flow: 해설 p.16
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        밑의 조건에서 $\lvert a-2\rvert>0$, $\lvert a-2\rvert\ne1$이므로 $a\ne1$, $a\ne2$, $a\ne3$ …… ②
      source_flow: 해설 p.16
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        ①과 ②에서 $a=0$ 또는 $a=4$이다.
      source_flow: 해설 p.16
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        진수의 조건에서 $-1<a<5$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 2
      evidence: |
        밑의 조건에서 $a\ne1$, $a\ne2$, $a\ne3$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-2
    - id: 1-1.A1
      mark_type: A
      points: 1
      evidence: |
        두 조건을 만족시키는 정수 $a=0$ 또는 $a=4$를 구했다.
      depends_on:
      - 1-1.M1
      - 1-1.M2
      implied_ok: false
      steps:
      - 11b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) $x\ge0$에서 정의된 두 함수 $g(x)=\log_{2}(x^{2}+5)$, $h(x)=\sqrt{x}$라고 할 때, $(g\circ h)^{-1}(x)>\dfrac{6}{2^{x}}$를 만족하는 $x$값의 범위를 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: lower=log(6)/log(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $(g\circ h)(x)=g(h(x))=g(\sqrt x)=\log_2(x+5)$에서 $(g\circ h)^{-1}(x)=2^{x}-5$이다.
      source_flow: 해설 p.16
      criteria:
      - 1-2.M1
      - 1-2.M2
    - id: 12b-2
      content: |
        $2^{x}-5>6\times2^{-x}$에서 $2^{x}=X$라 하면 $X^{2}-5X-6=(X+1)(X-6)>0$이므로 $X<-1$ 또는 $X>6$이다.
      source_flow: 해설 p.16
      criteria:
      - 1-2.A1
    - id: 12b-3
      content: |
        $X>0$이므로 $X=2^{x}>6$에서 $x>\log_26$이다.
      source_flow: 해설 p.16
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: |
        합성함수 $(g\circ h)(x)=\log_2(x+5)$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 3
      evidence: |
        역함수 $(g\circ h)^{-1}(x)=2^{x}-5$를 구했다.
      depends_on:
      - 1-2.M1
      implied_ok: false
      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 3
      evidence: |
        부등식을 풀어 $x>\log_26$을 구했다.
      depends_on:
      - 1-2.M2
      implied_ok: false
      steps:
      - 12b-2
      - 12b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [2] 극한값 $\displaystyle\lim_{n\to\infty}n^{\frac13}\left\{(n^{2}+n)^{\frac13}-(n^{2}+1)^{\frac13}\right\}$을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 1/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        실수 $a,b$에 대하여 $a^{3}-b^{3}=(a-b)(a^{2}+ab+b^{2})$임을 이용하여 극한값을 구하면
        $\displaystyle\lim_{n\to\infty}n^{\frac13}\left\{(n^{2}+n)^{\frac13}-(n^{2}+1)^{\frac13}\right\}=\lim_{n\to\infty}\dfrac{n^{\frac13}(n-1)}{(n^{2}+n)^{\frac23}+(n^{2}+n)^{\frac13}(n^{2}+1)^{\frac13}+(n^{2}+1)^{\frac23}}$
      source_flow: 해설 p.16
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $=\displaystyle\lim_{n\to\infty}\dfrac{1-\frac1n}{\left(1+\frac1n\right)^{\frac23}+\left(1+\frac1n\right)^{\frac13}\left(1+\frac1{n^{2}}\right)^{\frac13}+\left(1+\frac1{n^{2}}\right)^{\frac23}}=\dfrac13$
      source_flow: 해설 p.16
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        3차 항등식 $a^{3}-b^{3}=(a-b)(a^{2}+ab+b^{2})$을 이용하여 식을 전개했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        극한값 $\displaystyle\lim_{n\to\infty}n^{\frac13}\left\{(n^{2}+n)^{\frac13}-(n^{2}+1)^{\frac13}\right\}=\dfrac13$을 구했다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-1
  stem: |
    [3] 자연수 $n$에 대하여 $x+y=n\ (x\ge0,\ y\ge0)$를 만족시키고, 점 $(x,y)$의 $x$좌표와 $y$좌표가 모두 정수인 점들의 집합을 $A_n$이라고 하자. 집합 $A_n$에서 임의로 택한 한 점과 원점과의 거리의 제곱을 확률변수 $X_n$이라고 할 때, 다음 물음에 답하시오.

    (1) 집합 $A_n$에서 임의로 택한 한 점의 $x$좌표가 $k$일 때, 이 점과 원점과의 거리의 제곱을 구하시오. [4점]
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: 2*k**2-2*n*k+n**2
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $x+y=n$이므로 $x=k$이면 $y=n-k$이다. 따라서 점의 좌표는 $(k,n-k)$이다.
      source_flow: 해설 p.16
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        원점에서 점 $(k,n-k)$까지 거리의 제곱은 $k^{2}+(n-k)^{2}=2k^{2}-2nk+n^{2}$이다.
      source_flow: 해설 p.16
      criteria:
      - 3-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 2
      evidence: |
        점의 좌표 $(k,n-k)$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 31b-1
    - id: 3-1.A1
      mark_type: A
      points: 2
      evidence: |
        원점과의 거리의 제곱 $2k^{2}-2nk+n^{2}$을 구했다.
      depends_on:
      - 3-1.M1
      implied_ok: false
      steps:
      - 31b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    (2) 확률변수 $X_n$의 기댓값을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: n*(2*n+1)/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        집합 $A_n$의 원소의 개수는 $n+1$이고, 각 점이 선택될 확률은 모두 $\dfrac{1}{n+1}$로 같다.
      source_flow: 해설 p.16
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        기댓값 $\mathrm{E}(X_n)=\dfrac{1}{n+1}\displaystyle\sum_{k=0}^{n}(2k^{2}-2nk+n^{2})=\dfrac{n^{2}}{n+1}+\dfrac{1}{n+1}\sum_{k=1}^{n}(2k^{2}-2nk+n^{2})$
      source_flow: 해설 p.16
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: |
        $=\dfrac{n^{2}}{n+1}+\dfrac{1}{n+1}\left\{2\times\dfrac{n(n+1)(2n+1)}{6}-2n\dfrac{n(n+1)}{2}+n^{3}\right\}=\dfrac{n(2n+1)}{3}$
      source_flow: 해설 p.16
      criteria:
      - 3-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 3
      evidence: |
        확률변수 $X_n$의 확률 $\dfrac{1}{n+1}$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 32b-1
    - id: 3-2.M2
      mark_type: M
      points: 2
      evidence: |
        기댓값 $\mathrm{E}(X_n)$의 식을 구했다.
      depends_on:
      - 3-2.M1
      implied_ok: false
      steps:
      - 32b-2
    - id: 3-2.A1
      mark_type: A
      points: 3
      evidence: |
        기댓값 $\mathrm{E}(X_n)=\dfrac{n(2n+1)}{3}$을 구했다.
      depends_on:
      - 3-2.M2
      implied_ok: false
      steps:
      - 32b-3
