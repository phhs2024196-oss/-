key_idea: 로그의 밑·진수 조건, 합성함수의 역함수로 지수부등식을 치환해 푼다. 세제곱근 차를 $a^3-b^3$ 인수분해로 유리화해 극한을 구하고, 점 $(k,n-k)$로 거리의 제곱의 기댓값을 합으로 계산한다. 다항식 조건식은 최고차항의 차수를 비교해 $f$가 1차 또는 2차임을 보이고 계수를 비교한다.
