    - id: 41b-2
      content: |
        (ⅰ) $f(x)=ax+b\ (a\ne0)$라고 하고 조건식에 대입하면 $x(a^{2}-x^{2})=ax+b+px^{3}+qx^{2}$이다. 계수를 비교하면 $p=-1$, $q=0$, $a^{2}=a$, $b=0$이다. 여기서 $a(a-1)=0$이고 $a\ne0$이므로 $a=1$이다. 따라서 $p=-1$, $q=0$이고 $f(x)=x$이다.
      source_flow: 해설 p.17
      criteria:
