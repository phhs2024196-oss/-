stem: |
  [문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: 1-1
  stem: |
    [1] 수열 $\{a_n\}$의 일반항이 $a_n=\ln\left(\dfrac{2n+1}{2n-1}\right)$일 때, 다음 물음에 답하시오.

    (1) 극한값 $\displaystyle\lim_{n\to\infty}(2n+1)a_n$을 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $\displaystyle\lim_{n\to\infty}\left\{(2n+1)\ln\left(\frac{2n+1}{2n-1}\right)\right\}=\lim_{n\to\infty}\left\{(2n+1)\ln\left(1+\frac{2}{2n-1}\right)\right\}$
      source_flow: 예시 답안 p.5
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $\displaystyle=\lim_{n\to\infty}\ln\left[\left\{\left(1+\frac{2}{2n-1}\right)^{\frac{2n-1}{2}}\right\}^2\left(1+\frac{2}{2n-1}\right)^2\right]$
      source_flow: 예시 답안 p.5
      criteria:
      - 1-1.A1
    - id: 11b-3
      content: |
        $\displaystyle=\lim_{n\to\infty}\ln\left\{\left(1+\frac{2}{2n-1}\right)^{\frac{2n-1}{2}}\right\}^2+\lim_{n\to\infty}\ln\left\{\left(1+\frac{2}{2n-1}\right)^2\right\}=2$
      source_flow: 예시 답안 p.5
      criteria:
      - 1-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        $(2n+1)\ln\left(\dfrac{2n+1}{2n-1}\right)=(2n+1)\ln\left(1+\dfrac{2}{2n-1}\right)$로 고쳐 쓰면
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        지수 $\dfrac{2n-1}{2}$를 만들어 $\ln\left[\left\{\left(1+\dfrac{2}{2n-1}\right)^{\frac{2n-1}{2}}\right\}^2\left(1+\dfrac{2}{2n-1}\right)^2\right]$로 정리하면
      depends_on:
      - 1-1.M1
      steps:
      - 11b-2
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: |
        극한값 $2$를 얻으면
      depends_on:
      - 1-1.M1
      steps:
      - 11b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) 수열 $\{b_n\}$의 일반항이 $b_n=-\dfrac{a_n}{2n+1}$일 때, 자연수 $n$에 대하여 $b_n<b_{n+1}$임을 증명하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $b_n=-\dfrac{a_n}{2n+1}=-\dfrac{1}{2n+1}\ln\left(1+\dfrac{2}{2n-1}\right)$에서 자연수 $n$을 실수 $x$로 치환하여 함수 $f(x)$로 표현하면
        $$f(x)=-\frac{1}{2x+1}\ln\left(1+\frac{2}{2x-1}\right)$$
      source_flow: 예시 답안 p.6
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $$f^{\prime}(x)=\frac{2}{(2x+1)^2}\ln\left(1+\frac{2}{2x-1}\right)+\frac{1}{2x+1}\times\dfrac{\dfrac{4}{(2x-1)^2}}{1+\dfrac{2}{2x-1}}$$
      source_flow: 예시 답안 p.6
      criteria:
      - 1-2.A1
    - id: 12b-3
      content: |
        $x\ge1$에서 $\dfrac{2}{(2x+1)^2}\ln\left(1+\dfrac{2}{2x-1}\right)>0$이고 $\dfrac{1}{2x+1}\times\dfrac{\dfrac{4}{(2x-1)^2}}{1+\dfrac{2}{2x-1}}>0$이므로 $f^{\prime}(x)>0$
      source_flow: 예시 답안 p.6
      criteria:
      - 1-2.R1
    - id: 12b-4
      content: |
        $f(x)$는 $x\ge1$에서 증가함수이므로 $f(x)<f(x+1)$이다. 따라서 $f(n)<f(n+1)$이므로 $b_n<b_{n+1}$이다.
      source_flow: 예시 답안 p.6
      criteria:
      - 1-2.A2
    - id: 12b-5
      content: |
        (다른 풀이)
        $n\ge1$일 때 $b_n\ne0$이므로
        $$\frac{b_{n+1}}{b_n}=\frac{2n+1}{2n+3}\cdot\frac{\ln\left(1+\dfrac{2}{2n+1}\right)}{\ln\left(1+\dfrac{2}{2n-1}\right)}$$
        $\dfrac{2n+1}{2n+3}<1$이고 $\dfrac{\ln\left(1+\dfrac{2}{2n+1}\right)}{\ln\left(1+\dfrac{2}{2n-1}\right)}<1$이므로 $\dfrac{b_{n+1}}{b_n}<1$
        양변에 $b_n$을 곱해주면 $b_n<0$이므로 $b_n<b_{n+1}$
      source_flow: 예시 답안 p.6
      criteria: []
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 2
      evidence: |
        $f(x)=-\dfrac{1}{2x+1}\ln\left(1+\dfrac{2}{2x-1}\right)$ 놓으면
      depends_on: []
      implied_ok: false
      steps:
      - 12b-1
    - id: 1-2.A1
      mark_type: A
      points: 2
      evidence: |
        도함수 $f^{\prime}(x)=\dfrac{2}{(2x+1)^2}\ln\left(1+\dfrac{2}{2x-1}\right)+\dfrac{1}{2x+1}\times\dfrac{\dfrac{4}{(2x-1)^2}}{1+\dfrac{2}{2x-1}}$를 계산하면
      depends_on:
      - 1-2.M1
      steps:
      - 12b-2
    - id: 1-2.R1
      mark_type: R
      points: 2
      evidence: |
        $x\ge1$에서 $f^{\prime}(x)>0$임을 근거를 제시하여 진술하면
      depends_on: []
      steps:
      - 12b-3
    - id: 1-2.A2
      mark_type: A
      points: 2
      evidence: |
        앞의 계산을 이용하여 논리적으로 $b_n<b_{n+1}$임을 결론 내리면
      depends_on:
      - 1-2.M1
      - 1-2.R1
      steps:
      - 12b-4
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-1
  stem: |
    [2] 함수 $f(x)=ax(x-2\pi)$가 다음 조건을 만족시킬 때, 물음에 답하시오. (단, $a$는 $0$이 아닌 실수)

    $0\le x\le2\pi$에서 $f(x)$의 최댓값은 $1$이다.

    (1) $0\le x\le2\pi$에서 방정식 $f(x)+\lvert\cos x\rvert=-\dfrac{x}{\pi}$의 실근이 없음을 증명하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $f(0)=f(2\pi)=0$이고 $0\le x\le2\pi$에서 $f(x)$의 최댓값이 $1$이므로 $f^{\prime}(x)=2ax-2\pi a=0$인 $x=\pi$에서 $f(x)$는 최댓값을 갖는다. $f(\pi)=-a\pi^2=1$이므로 $a=-\dfrac{1}{\pi^2}$
      source_flow: 예시 답안 p.6
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        따라서 주어진 방정식은 $-\dfrac{1}{\pi^2}x^2+\dfrac{2}{\pi}x+\lvert\cos x\rvert=-\dfrac{x}{\pi}$
      source_flow: 예시 답안 p.6
      criteria: []
    - id: 21b-3
      content: |
        $0\le x\le2\pi$에서 좌변 $f(x)+\lvert\cos x\rvert>0$이고 우변 $-\dfrac{x}{\pi}\le0$이므로 실근은 존재하지 않는다.
      source_flow: 예시 답안 p.6
      criteria:
      - 2-1.R1
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 2
      evidence: |
        주어진 조건을 활용하여 $a$의 값을 얻으면
      depends_on: []
      implied_ok: false
      steps:
      - 21b-1
    - id: 2-1.R1
      mark_type: R
      points: 4
      evidence: |
        그래프를 그리거나 좌, 우변의 부호를 비교하여 해가 존재하지 않는 근거를 올바로 제시하면
      depends_on: []
      steps:
      - 21b-3
    - id: 2-1.A1
      mark_type: A
      points: 2
      evidence: |
        앞의 근거를 기반으로 올바로 결론을 도출하면
      depends_on:
      - 2-1.M1
      - 2-1.R1
      steps:
      - 21b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (2) 함수 $g(x)=\dfrac{x-p}{x+2p}$에 대하여 $0\le x\le2\pi$에서 합성함수 $(g\circ f)(x)$의 최댓값과 최솟값이 모두 존재하도록 하는 실수 $p$의 범위를 구하시오. (단, $p$는 $0$과 $-\dfrac12$이 아닌 실수) [12점]
  points: 12
  depends_on: []
  answer:
    kind: set
    value: p<-1/2 or p>0
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $0\le x\le2\pi$에서 $f(x)=t$로 치환하면 $0\le t\le1$이고 $(g\circ f)(x)=g(t)$
        $g(t)=1-\dfrac{3p}{t+2p}$의 그래프의 점근선은 $y=1$과 $t=-2p$이다.
      source_flow: 예시 답안 p.6~8
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        (ⅰ) $-2p<0$인 경우, $p>0$
        $-3p<0$이므로 $g(t)$의 그래프는 다음과 같다.

        [그림 1: $t$축과 $y$축에서 점근선 $y=1$과 수직 점근선 $t=-2p$($t<0$)를 가지며, $t=-2p$의 오른쪽에서 증가하여 $y=1$에 가까워지는 $y=g(t)$의 그래프. $0\le t\le1$ 구간은 점근선에서 떨어져 있어 끊김이 없다.]

        $0\le t\le1$에서 $(g\circ f)(x)=g(t)$의 최댓값과 최솟값이 모두 존재한다.
      source_flow: 예시 답안 p.6~8
      criteria:
      - 2-2.A1
    - id: 22b-3
      content: |
        (ⅱ) $0<-2p<1$인 경우, $-\dfrac12<p<0$
