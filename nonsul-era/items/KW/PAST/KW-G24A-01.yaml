# 광운대 2024학년도 논술고사 자연계열 1교시 [문제 1] — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 공식 문서 표기 메모: 채점 기준표의 [3]번 소문항은 "[4](1)·[4](2)"로, 3-2 해설·채점은 b_{1000} 을 a_{1000} 으로 적었다.
#   원문(문제지)은 [3]·b_{1000} — 해설 B 에서는 문제지 기호(b_{1000})로 통일했다. [판독확인: 모범답안 기호 불일치(a_1000→b_1000, [4]→[3])]
# 2-2 해설의 그림은 설명 문장으로 옮김(원본 그림 3개, 각 그래프의 점근선 위치만 설명). [판독확인: 그림 3개 형태는 원본 대조]
