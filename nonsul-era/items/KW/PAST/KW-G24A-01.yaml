stimuli:
- label: '1'
  body: |
    $\lim_{n\to\infty}a_n=\alpha$, $\lim_{n\to\infty}b_n=\beta$ ($\alpha$, $\beta$는 실수)일 때,
    ① $\lim_{n\to\infty}(a_n+b_n)=\lim_{n\to\infty}a_n+\lim_{n\to\infty}b_n=\alpha+\beta$
    ② $\lim_{n\to\infty}a_nb_n=\lim_{n\to\infty}a_n\times\lim_{n\to\infty}b_n=\alpha\beta$
- label: '2'
