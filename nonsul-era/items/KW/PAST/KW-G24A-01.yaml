        앞의 다섯 자리에는 나머지 다섯 개의 숫자를 일렬로 배열하면 되므로
        $5!\times4=480$
      source_flow: 예시 답안 p.8
      criteria:
      - 3-1.A1
    - id: 31b-3
      content: |
        (ⅱ) 끝의 두 자리가 $0$을 포함하지 않는 경우($12,16,24,32,36,52,56,64$)
        백만 자리는 나머지 $5$개의 숫자 중에서 $0$을 제외한 네 가지가 올 수 있고,
        십만, 만, 천, 백의 자리는 이미 사용한 숫자를 제외한 나머지 네 개의 숫자를 일렬로 배열하면 되므로
