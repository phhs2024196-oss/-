      content: |
        $A=\{4n\mid n=1,2,\cdots\}$이므로 $A\cap B$의 원소는 $B$의 원소 중에서 $4$의 배수인 자연수이다.
        $0,1,2,3,4,5,6$으로 만든 일곱 자리 자연수가 $4$의 배수인 경우는 끝의 두 자리 수가 각각 $04,12,16,20,24,32,36,40,52,56,60,64$일 때이다.
