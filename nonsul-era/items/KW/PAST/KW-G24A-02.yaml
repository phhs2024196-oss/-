- id: 4-1
  stem: |
    [4] 함수 $f(x)=\dfrac{\ln x}{x}$에 대하여 다음 물음에 답하시오.

    (1) $n\ge3$인 자연수 $n$에 대하여 $n^{n+1}$과 $(n+1)^n$의 크기를 비교하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: n**(n+1) > (n+1)**n
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        $n^{n+1}$과 $(n+1)^n$의 자연로그를 $n(n+1)$로 각각 나누면 $\dfrac{\ln n}{n}$과 $\dfrac{\ln(n+1)}{n+1}$이다.
      source_flow: 예시 답안 p.16
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        $f(x)=\dfrac{\ln x}{x}$를 미분하면 $f^{\prime}(x)=\dfrac{1-\ln x}{x^2}$이므로 $f^{\prime}(x)=0$이면 $x=e$이다.
        $x>e$이면 $f^{\prime}(x)<0$이므로 $f(x)$는 감소함수이다.
      source_flow: 예시 답안 p.16
      criteria:
      - 4-1.M1
    - id: 41b-3
      content: |
        따라서 $n\ge3>e$이면 $\dfrac{\ln n}{n}>\dfrac{\ln(n+1)}{n+1}$이고, $n^{\frac1n}>(n+1)^{\frac{1}{n+1}}$이므로 $n^{n+1}>(n+1)^n$
      source_flow: 예시 답안 p.16
      criteria:
      - 4-1.A1
      - 4-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
