stimuli:
- label: '1'
  body: |
    어떤 명제가 참임을 증명할 때, 주어진 명제의 결론을 부정하여 가정 또는 이미 알려진 수학적 사실 등에 모순됨을 보여 원래의 명제가 참임을 증명하는 방법을 귀류법이라고 한다.
- label: '2'
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능할 때
    ① 그 구간의 모든 $x$에 대하여 $f^{\prime}(x)>0$이면 $f(x)$는 그 구간에서 증가한다.
    ② 그 구간의 모든 $x$에 대하여 $f^{\prime}(x)<0$이면 $f(x)$는 그 구간에서 감소한다.
- label: '3'
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g^{\prime}(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때, $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)dx=\int_\alpha^\beta f(g(t))g^{\prime}(t)dt$$
- label: '4'
  body: |
    닫힌구간 $[a,b]$에서 연속인 도함수를 갖는 두 함수 $f(x)$, $g(x)$에 대하여
    $$\int_a^bf(x)g^{\prime}(x)dx=\left[f(x)g(x)\right]_a^b-\int_a^bf^{\prime}(x)g(x)dx$$
stem: |
  [문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: '1'
  stem: |
    [1] 다항함수 $f(x)$가 다음 조건을 모두 만족시킬 때, 함수 $f(x)$를 구하시오. [6점]

    (가) $f(0)=1$
    (나) 모든 실수 $x$에서 $f(3x)=f(x)+x^3$이다.
  points: 6
  depends_on: []
  answer:
    kind: expression
    value: x**3/26+1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=a_mx^m+a_{m-1}x^{m-1}+\cdots+a_1x+a_0$ ($m\ge3$)으로 놓으면 조건 (나)에 의하여
        $f(3x)-f(x)=(3^m-1)a_mx^m+\cdots+(3^3-1)a_3x^3+\cdots+(3^1-1)a_1x=x^3$
      source_flow: 예시 답안 p.15
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        항등식의 성질에 의하여 $(3^3-1)a_3=1$, $(3^k-1)a_k=0$ ($1\le k\le m$, $k\ne3$)이므로
        $a_3=\dfrac{1}{26}$, $a_k=0$ ($1\le k\le m$, $k\ne3$)
        그러므로 $f(x)=\dfrac{1}{26}x^3+a_0$
        조건 (가)로부터 $a_0=f(0)=1$이므로 $f(x)=\dfrac{1}{26}x^3+1$
      source_flow: 예시 답안 p.15
      criteria:
      - 1.A1
      - 1.A2
    - id: 1b-3
      content: |
        (다른 풀이) $f(3x)-f(x)=x^3$에서 $x$ 대신 $\dfrac{x}{3},\dfrac{x}{3^2},\dfrac{x}{3^3},\cdots,\dfrac{x}{3^n}$를 차례로 대입하면
        $f(x)-f\left(\dfrac{x}{3}\right)=\left(\dfrac{x}{3}\right)^3$,
        $f\left(\dfrac{x}{3}\right)-f\left(\dfrac{x}{3^2}\right)=\left(\dfrac{x}{3^2}\right)^3$,
        $f\left(\dfrac{x}{3^2}\right)-f\left(\dfrac{x}{3^3}\right)=\left(\dfrac{x}{3^3}\right)^3$,
        $\cdots\cdots$
        $f\left(\dfrac{x}{3^{n-1}}\right)-f\left(\dfrac{x}{3^n}\right)=\left(\dfrac{x}{3^n}\right)^3$
        위 식들의 좌변과 우변을 각각 더하면
        $$f(x)-f\left(\frac{x}{3^n}\right)=\left(\frac{x}{3}\right)^3+\left(\frac{x}{3^2}\right)^3+\cdots+\left(\frac{x}{3^n}\right)^3=\sum_{k=1}^n\left(\frac{x}{3^k}\right)^3=\sum_{k=1}^n\frac{x^3}{(3^3)^k}$$
        $$f(x)=\sum_{k=1}^n\frac{x^3}{(3^3)^k}+f\left(\frac{x}{3^n}\right)$$
        $n$이 한없이 커지면 $\displaystyle f(x)=\lim_{n\to\infty}\sum_{k=1}^n\frac{x^3}{(3^3)^k}+\lim_{n\to\infty}f\left(\frac{x}{3^n}\right)$ $\cdots\cdots$ ㉠
        $t=\dfrac{x}{3^n}$로 놓으면 $n\to\infty$일 때 $t\to0$이고, $f(t)$는 $t=0$에서 연속이므로
        $\displaystyle\lim_{n\to\infty}f\left(\frac{x}{3^n}\right)=\lim_{t\to0}f(t)=f(0)$ $\cdots\cdots$ ㉡
        따라서 ㉠, ㉡과 조건 (가)로부터 $f(x)=\dfrac{\dfrac{x^3}{3^3}}{1-\dfrac{1}{3^3}}+f(0)=\dfrac{1}{26}x^3+1$
      source_flow: 예시 답안 p.15
      criteria: []
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        $f(x)=a_mx^m+a_{m-1}x^{m-1}+\cdots+a_1x+a_0$ ($m\ge3$)으로 나타내면
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $a_3=\dfrac{1}{26}$, $a_k=0$ ($1\le k\le m$, $k\ne3$)을 얻으면
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $f(x)=\dfrac{1}{26}x^3+1$을 얻으면
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [2] 방정식 $8x^3-6x+1=0$의 실근이 유리수가 아님을 증명하시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        귀류법으로 방정식 $8x^3-6x+1=0$의 실근 $x$가 유리수가 아님을 증명하자.
        $x$가 유리수라고 가정하면, $x=\dfrac{a}{b}$ ($b\ne0$, $a,b$는 서로소인 정수)로 쓸 수 있다.
      source_flow: 예시 답안 p.15~16
      criteria:
      - 2.M1
      - 2.A1
    - id: 2b-2
      content: |
        방정식에 대입하여 정리하면 $b^3=2(3ab^2-4a^3)$ $\cdots\cdots$ ㉠
        $b$는 짝수이므로 정수 $k$에 대하여 $b=2k$이고, $a$와 $b$는 서로소이므로 $a$는 홀수이다.
      source_flow: 예시 답안 p.15~16
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        $b=2k$를 식 ㉠에 대입하면 $a^3=3ak^2-k^3=k^2(3a-k)$ $\cdots\cdots$ ㉡
      source_flow: 예시 답안 p.15~16
      criteria:
      - 2.A2
    - id: 2b-4
      content: |
        식 ㉡에서 $k$가 홀수이면 $3a-k$는 짝수이고 $k$가 짝수이면 $k^2$이 짝수이므로 $k^2(3a-k)$는 짝수이다.
        $a^3$은 짝수이므로 $a$도 짝수이며, 이것은 $a$가 홀수임에 모순이다.
        따라서 주어진 방정식의 실근은 유리수가 아니다.
      source_flow: 예시 답안 p.15~16
      criteria:
      - 2.A2
      - 2.R1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        귀류법을 이용하여 실근 $x$가 유리수라고 가정하면
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $x=\dfrac{a}{b}$ ($b\ne0$, $a,b$는 서로소인 정수)로 놓고 $b$는 짝수, $a$는 홀수임을 얻으면
      depends_on:
      - 2.M1
      steps:
      - 2b-1
      - 2b-2
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: |
        $b=2k$로 놓고 $a^3=k^2(3a-k)$가 짝수임을 얻으면
      depends_on:
      - 2.M1
      steps:
      - 2b-3
      - 2b-4
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        $a$가 짝수이고 $a$는 홀수에 모순이라고 표현하면
      depends_on: []
      steps:
      - 2b-4
    deductions: []
