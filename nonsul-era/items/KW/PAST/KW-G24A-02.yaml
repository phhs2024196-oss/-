- id: 4-2
  stem: |
    (2) 함수 $g(x)=\dfrac{f(x+1)}{x+1}$일 때, 곡선 $y=g(x)$와 $x$축 및 두 직선 $x=0$, $x=e^2-1$로 둘러싸인 도형의 넓이를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 1-3/exp(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        $g(x)=\dfrac{f(x+1)}{x+1}=\dfrac{\ln(x+1)}{(x+1)^2}$이므로 $x\ge0$에서 $g(x)\ge0$
        도형의 넓이 $S$는
        $$S=\int_0^{e^2-1}\lvert g(x)\rvert dx=\int_0^{e^2-1}\frac{\ln(x+1)}{(x+1)^2}dx$$
      source_flow: 예시 답안 p.16~17
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: |
        $t=\ln(x+1)$로 놓으면 $dt=\dfrac{1}{x+1}dx$이고 $x=0$일 때 $t=0$, $x=e^2-1$일 때 $t=2$이므로
        $$\int_0^{e^2-1}\frac{\ln(x+1)}{(x+1)^2}dx=\int_0^2te^{-t}dt$$
      source_flow: 예시 답안 p.16~17
      criteria:
      - 4-2.A1
    - id: 42b-3
      content: |
        $$\int_0^2te^{-t}dt=\left[-te^{-t}\right]_0^2-\int_0^2(-e^{-t})dt=\left[-te^{-t}-e^{-t}\right]_0^2=1-\frac{3}{e^2}$$
      source_flow: 예시 답안 p.16~17
      criteria:
      - 4-2.A2
    - id: 42b-4
      content: |
        따라서 도형의 넓이 $S$는 $S=1-\dfrac{3}{e^2}$
      source_flow: 예시 답안 p.16~17
      criteria:
      - 4-2.A3
