- id: 3-2
  stem: |
    (2) (1)에서 구한 값을 $I$라고 할 때, 부등식 $\left\lvert I-\displaystyle\int_0^1\frac{1}{1+x^2}dx\right\rvert\le\dfrac19$이 성립함을 증명하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        정적분 $\displaystyle\int_0^1\frac{1}{1+x^2}dx$를 구하기 위하여 $x=\tan\theta$ $\left(-\dfrac{\pi}{2}<\theta<\dfrac{\pi}{2}\right)$로 놓으면
        $\dfrac{dx}{d\theta}=\sec^2\theta$이고, $x=0$일 때 $\theta=0$, $x=1$일 때 $\theta=\dfrac{\pi}{4}$이므로
        $$\int_0^1\frac{1}{1+x^2}dx=\int_0^{\frac{\pi}{4}}\frac{\sec^2\theta}{\sec^2\theta}d\theta=\frac{\pi}{4}$$
      source_flow: 예시 답안 p.16
      criteria:
      - 3-2.M1
      - 3-2.A1
    - id: 32b-2
      content: |
        따라서 $\left\lvert I-\displaystyle\int_0^1\frac{1}{1+x^2}dx\right\rvert=\left\lvert\dfrac{76}{105}-\dfrac{\pi}{4}\right\rvert\le\dfrac19$
