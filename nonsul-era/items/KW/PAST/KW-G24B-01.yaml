stimuli:
- label: '1'
  body: |
    로그함수 $y=\log_ax$ ($a>0$, $a\ne1$)는
    ① $a>1$일 때 $x$의 값이 커지면 $y$의 값도 커진다.
    ② $0<a<1$일 때 $x$의 값이 커지면 $y$의 값은 작아진다.
- label: '2'
  body: |
    함수 $f:X\to Y$에서 정의역 $X$의 두 원소 $x_1,x_2$에 대하여 $x_1\ne x_2$이면 $f(x_1)\ne f(x_2)$일 때, 함수 $f$를 일대일함수라고 한다.
- label: '3'
  body: |
    함수 $f(x)$에 대하여 $f^1(x)=f(x)$, $f^{n+1}(x)=(f\circ f^n)(x)$ ($n$은 자연수)이다.
stem: |
  [문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: 1-1
  stem: |
    [1] 두 함수 $f(x)=\log_kx$, $g(x)=x+1$에 대하여 다음 물음에 답하시오. (단, $k>1$)

    (1) 두 곡선 $y=f(x)$, $y=f(x^2)$과 직선 $x=k^n$이 만나는 점을 각각 $\mathrm{A}_n,\mathrm{B}_n$이라고 하고 선분 $\mathrm{A}_n\mathrm{B}_n$의 길이를 $a_n$이라고 할 때, 극한값 $\displaystyle\lim_{n\to\infty}\frac{a_n}{a_{n^2}}$을 구하시오. (단, $n$은 자연수) [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $f(x)=\log_kx$이므로 $f(x^2)=\log_kx^2=2\log_kx$이다.
        따라서 $\mathrm{A}_n=(k^n,n)$이고 $\mathrm{B}_n=(k^n,2n)$이다.
      source_flow: 예시 답안 p.6
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        또한 $\mathrm{A}_{n^2}=(k^{n^2},n^2)$이고 $\mathrm{B}_{n^2}=(k^{n^2},2n^2)$이므로 $a_n=n$이고 $a_{n^2}=n^2$이다.
      source_flow: 예시 답안 p.6
      criteria:
      - 1-1.M2
      - 1-1.A1
    - id: 11b-3
      content: |
        그러므로 $\displaystyle\lim_{n\to\infty}\frac{a_n}{a_{n^2}}=\lim_{n\to\infty}\frac{n}{n^2}=\lim_{n\to\infty}\frac1n=0$이다.
      source_flow: 예시 답안 p.6
      criteria:
      - 1-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 2
      evidence: |
        $\mathrm{A}_n=(k^n,n)$과 $\mathrm{B}_n=(k^n,2n)$을 구했으면
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 2
      evidence: |
        $\mathrm{A}_{n^2}=(k^{n^2},n^2)$과 $\mathrm{B}_{n^2}=(k^{n^2},2n^2)$을 구했으면
      depends_on: []
      implied_ok: false
      steps:
      - 11b-2
    - id: 1-1.A1
      mark_type: A
      points: 2
      evidence: |
        $a_n=n$과 $a_{n^2}=n^2$을 구했으면
      depends_on:
      - 1-1.M1
      - 1-1.M2
      steps:
      - 11b-2
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: |
        $\displaystyle\lim_{n\to\infty}\dfrac{a_n}{a_{n^2}}=\lim_{n\to\infty}\dfrac{n}{n^2}=\lim_{n\to\infty}\dfrac1n=0$을 구했으면
      depends_on:
      - 1-1.M1
      - 1-1.M2
      steps:
      - 11b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) $m_1,m_2,\cdots,m_{10}$은 $1$이 아닌 $5^{10}$의 서로 다른 약수들이라고 할 때, $t$에 대한 다음 방정식의 양의 실근의 개수를 구하시오. [12점]

    $f(m_1)+f(m_2)+\cdots+f(m_{10})=f(t^2+3t+4)$
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $f(m_1)+f(m_2)+\cdots+f(m_{10})=\log_km_1+\log_km_2+\cdots+\log_km_{10}=\log_k(m_1m_2\cdots m_{10})$이고 $f(t^2+3t+4)=\log_k(t^2+3t+4)$이다.
      source_flow: 예시 답안 p.6
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        따라서 $\log_k(m_1m_2\cdots m_{10})=\log_k(t^2+3t+4)$이므로 $m_1m_2\cdots m_{10}=t^2+3t+4$이고 $t^2+3t+4-m_1m_2\cdots m_{10}=0$이다.
      source_flow: 예시 답안 p.6
      criteria:
      - 1-2.A1
    - id: 12b-3
      content: |
        그러므로 $t=\dfrac{-3\pm\sqrt{9-4(4-m_1m_2\cdots m_{10})}}{2}$이다.
      source_flow: 예시 답안 p.6
      criteria:
      - 1-2.A2
    - id: 12b-4
      content: |
        그런데 $m_1m_2\cdots m_{10}\ge125$이므로 $9-4(4-m_1m_2\cdots m_{10})=-7+4m_1m_2\cdots m_{10}\ge493$이다.
      source_flow: 예시 답안 p.6
      criteria:
      - 1-2.A3
    - id: 12b-5
      content: |
        따라서 방정식 $t^2+3t+4-m_1m_2\cdots m_{10}=0$의 판별식이 양수이고 $t=0$일 때 $t^2+3t+4-m_1m_2\cdots m_{10}<0$이므로 주어진 방정식의 양의 실근은 $1$개다.
      source_flow: 예시 답안 p.6
      criteria:
      - 1-2.A4
    - id: 12b-6
      content: |
        (다른 풀이) $9-4(4-m_1m_2\cdots m_{10})=-7+4m_1m_2\cdots m_{10}\ge493$를 구하고 다음과 같이 양의 실근의 개수를 구할 수 있다.
        $\sqrt{493}\ge22$이므로 $t=\dfrac{-3+\sqrt{9-4(4-m_1m_2\cdots m_{10})}}{2}\ge9$, $t=\dfrac{-3-\sqrt{9-4(4-m_1m_2\cdots m_{10})}}{2}\le0$
        따라서 주어진 방정식의 양의 실근은 $1$개다.
      source_flow: 예시 답안 p.6
      criteria: []
