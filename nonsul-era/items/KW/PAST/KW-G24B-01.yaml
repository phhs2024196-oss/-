        $m_1m_2\cdots m_{10}=t^2+3t+4$ 또는 $t^2+3t+4-m_1m_2\cdots m_{10}=0$을 구했으면
      depends_on:
      - 1-2.M1
      steps:
      - 12b-2
    - id: 1-2.A2
      mark_type: A
      points: 2
      evidence: |
        $t=\dfrac{-3\pm\sqrt{9-4(4-m_1m_2\cdots m_{10})}}{2}$를 구했으면
      depends_on:
      - 1-2.M1
      steps:
      - 12b-3
    - id: 1-2.A3
      mark_type: A
      points: 2
      evidence: |
        $9-4(4-m_1m_2\cdots m_{10})=-7+4m_1m_2\cdots m_{10}\ge493$을 구했으면
      depends_on:
      - 1-2.M1
      steps:
      - 12b-4
    - id: 1-2.A4
      mark_type: A
      points: 2
      evidence: |
        $t=0$일 때 $t^2+3t+4-m_1m_2\cdots m_{10}<0$이므로 주어진 방정식의 양의 실근은 $1$개라는 설명을 했으면
      depends_on:
      - 1-2.M1
