# 공식 해설 메모: 1-2 풀이의 "m_1 m_2 ... m_10 >= 125" 는 하한이 느슨하다(실제로는 5^1·5^2·...·5^10 = 5^55). 원문 그대로 옮기고 결론(양의 실근 1개)은 같다.
#   1-2(다른 풀이)는 해설 B 의 마지막 단계에 원문 그대로 실었다(채점 연결 없음).
