- id: 1-3
  stem: |
    (3) 함수 $g^{10}(x)$가 일대일함수임을 증명하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        모든 실수 $a$에 대하여
        $g^{10}(a)=g^9(g(a))=g^9(a+1)=g^8((a+1)+1)=g^8(a+2)=\cdots=a+10$이다.
        따라서 $g^{10}(a)=a+10$이다.
      source_flow: 예시 답안 p.6
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        $g^{10}(x)$는 일대일함수임을 증명하기 위해서 실수 $a,b$에 대하여 $g^{10}(a)=g^{10}(b)$이라고 가정하자.
        그러면 $a+10=b+10$이므로 $a=b$이다.
        따라서 $g^{10}(x)$는 일대일함수이다.
      source_flow: 예시 답안 p.6
      criteria:
      - 1-3.R1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 5
      evidence: |
        $g^{10}(a)=g^9(g(a))=g^9(a+1)=g^8((a+1)+1)=g^8(a+2)=\cdots=a+10$ 과정을 통해서 $g^{10}(a)=a+10$을 구했으면 (위의 과정이 없이 $g^{10}(a)=a+10$을 구했으면 $3$점 감점)
      depends_on: []
      implied_ok: false
      steps:
      - 13b-1
    - id: 1-3.R1
      mark_type: R
      points: 5
      evidence: |
        $g^{10}(a)=g^{10}(b)$이라고 가정하여 $a=b$임을 보이면 (또는, $a\ne b$이라고 가정하고 $g^{10}(a)\ne g^{10}(b)$임을 보이면)
      depends_on: []
      steps:
      - 13b-2
    deductions: []
