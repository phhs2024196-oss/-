- id: 4-2
  stem: |
    (2) 정적분 $\displaystyle\int_0^{\frac{\pi}{4}}f(x)\sin2x\,dx$를 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: 2*sqrt(E)-1-E
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        $$\int_0^{\frac{\pi}{4}}f(x)\sin2x\,dx=\int_0^{\frac{\pi}{4}}2\sin x\cos x\,e^{\sin^2x}dx-\int_0^{\frac{\pi}{4}}2\sin x\cos x\,e^{\cos^2x}dx\cdots\cdots①$$
      source_flow: 예시 답안 p.14
      criteria: []
    - id: 42b-2
      content: |
        ①식의 항 $\displaystyle\int_0^{\frac{\pi}{4}}2\sin x\cos x\,e^{\sin^2x}dx$에서
        $\sin x=t$로 놓으면 $\cos x=\dfrac{dt}{dx}$이고, $x=0$일 때 $t=0$, $x=\dfrac{\pi}{4}$일 때 $t=\dfrac{1}{\sqrt2}$이므로
        $$\int_0^{\frac{\pi}{4}}2\sin x\cos x\,e^{\sin^2x}dx=\int_0^{\frac{1}{\sqrt2}}2te^{t^2}dt$$
        $t^2=p$로 놓으면 $2t=\dfrac{dp}{dt}$이고, $t=0$일 때 $p=0$, $t=\dfrac{1}{\sqrt2}$일 때 $p=\dfrac12$이므로
        $$\int_0^{\frac{\pi}{4}}2\sin x\cos x\,e^{\sin^2x}dx=\int_0^{\frac{1}{\sqrt2}}2te^{t^2}dt=\int_0^{\frac12}e^pdp=\sqrt{e}-1\cdots\cdots㉠$$
      source_flow: 예시 답안 p.14
      criteria:
      - 4-2.B1
    - id: 42b-3
      content: |
        ①식의 항 $\displaystyle-\int_0^{\frac{\pi}{4}}2\sin x\cos x\,e^{\cos^2x}dx$에서
        $\cos x=t$로 놓으면 $-\sin x=\dfrac{dt}{dx}$이고, $x=0$일 때 $t=1$, $x=\dfrac{\pi}{4}$일 때 $t=\dfrac{1}{\sqrt2}$이므로
        $$-\int_0^{\frac{\pi}{4}}2\sin x\cos x\,e^{\cos^2x}dx=\int_0^{\frac{1}{\sqrt2}}2te^{t^2}dt$$
        $t^2=p$로 놓으면 $2t=\dfrac{dp}{dt}$이고, $t=1$일 때 $p=1$, $t=\dfrac{1}{\sqrt2}$일 때 $p=\dfrac12$이므로
        $$-\int_0^{\frac{\pi}{4}}2\sin x\cos x\,e^{\cos^2x}dx=\int_0^{\frac{1}{\sqrt2}}2te^{t^2}dt=\int_1^{\frac12}e^pdp=\sqrt{e}-e\cdots\cdots㉡$$
        [판독확인: 원문 두 번째 적분의 하한이 $0$으로 인쇄됨(정확히는 $t=1$). 원문 그대로 옮김]
      source_flow: 예시 답안 p.14
      criteria:
      - 4-2.B2
    - id: 42b-4
      content: |
        ㉠, ㉡으로부터
        $$\int_0^{\frac{\pi}{4}}f(x)\sin2x\,dx=\int_0^{\frac{\pi}{4}}2\sin x\cos x\,e^{\sin^2x}dx-\int_0^{\frac{\pi}{4}}2\sin x\cos x\,e^{\cos^2x}dx=2\sqrt{e}-1-e$$
      source_flow: 예시 답안 p.14
      criteria:
      - 4-2.B2
