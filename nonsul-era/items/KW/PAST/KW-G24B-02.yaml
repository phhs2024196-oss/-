  stem: |
    [4] 함수 $f(x)=e^{\sin^2x}-e^{\cos^2x}$에 대하여 다음 물음에 답하시오.

    (1) $0\le x\le2\pi$에서 함수 $f(x)$의 증가와 감소를 나타내는 표를 작성하고 함수 $f(x)$의 최댓값과 최솟값을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: max=E-1; min=1-E
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        $f^{\prime}(x)=2\sin x\cos x\,e^{\sin^2x}+2\cos x\sin x\,e^{\cos^2x}=2\sin x\cos x\left(e^{\sin^2x}+e^{\cos^2x}\right)$
      source_flow: 예시 답안 p.14
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        $f^{\prime}(x)=0$으로부터 $x=0,\dfrac{\pi}{2},\pi,\dfrac{3\pi}{2},2\pi$를 얻고 이를 이용하여 함수의 증가와 감소를 나타내는 표를 작성하면 아래와 같다.

        | $x$ | $0$ | $\cdots$ | $\dfrac{\pi}{2}$ | $\cdots$ | $\pi$ | $\cdots$ | $\dfrac{3\pi}{2}$ | $\cdots$ | $2\pi$ |
        |---|---|---|---|---|---|---|---|---|---|
        | $f^{\prime}(x)$ | | $+$ | $0$ | $-$ | $0$ | $+$ | $0$ | $-$ | |
        | $f(x)$ | $1-e$ | ↗ | $e-1$ | ↘ | $1-e$ | ↗ | $e-1$ | ↘ | $1-e$ |
      source_flow: 예시 답안 p.14
      criteria:
      - 4-1.A1
    - id: 41b-3
      content: |
        따라서 $f(x)$의 최솟값은 $f(0)=f(\pi)=f(2\pi)=1-e$이고 최댓값은 $f\left(\dfrac{\pi}{2}\right)=f\left(\dfrac{3\pi}{2}\right)=e-1$
      source_flow: 예시 답안 p.14
      criteria:
      - 4-1.A2
