    - id: 2b-2
      content: |
        $\mathrm{E}(4\overline{X}+2)+\mathrm{V}(n\overline{X}+3)=18$에서
        $\mathrm{E}(4\overline{X}+2)+\mathrm{V}(n\overline{X}+3)=4\mathrm{E}(\overline{X})+2+n^2\mathrm{V}(\overline{X})=4p+2+q^2=18$
      source_flow: 예시 답안 p.12~13
