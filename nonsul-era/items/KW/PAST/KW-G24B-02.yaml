- id: '2'
  stem: |
    [2] 모평균이 $p$, 모표준편차가 $q$인 모집단에서 크기가 $n^2$인 표본을 임의추출할 때, 표본평균 $\overline{X}$에 대하여 $\mathrm{E}(4\overline{X}+2)+\mathrm{V}(n\overline{X}+3)=18$을 만족시키는 두 자연수 $p,q$를 구하시오. [8점]
