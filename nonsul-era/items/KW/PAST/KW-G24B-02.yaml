intent: '[1] 무리수 $e$와 관련된 지수함수 혹은 로그함수의 극한을 이해하고 있는지의 여부를 평가한다. 함수의 극한 문제를 해결하기 위해 미분계수의 형태를 구별할 수 있는 능력과 함수의 극한에 관한 성질을 활용하여 극한값을 계산할 수 있는 문제 해결 능력을 평가한다. [2] 모집단의 확률분포와 표본평균의 확률분포의 관계를 이해하고 있는지의 여부를 평가한다. 이산확률변수의 평균, 분산, 표준편차의 성질을 활용하여 표본평균의 분포에 관한 문제 해결 능력을 평가한다. [3] 수학적 귀납법의 올바른 활용으로 자연수에 관한 수학 명제를 증명할 수 있는 능력을 평가한다. 다항식의 사칙연산을 활용한 문제 해결 능력을 평가한다. [4] 미분을 활용하여 함수의 증가와 감소, 극대와 극소를 판정할 수 있는 능력을 평가하고 이를 토대로 함수의 최댓값과 최솟값을 구하는 문제 해결 능력을 평가한다. 다양한 함수의 적분법에 있어서 치환적분법을 이해하고 활용할 수 있는 능력을 평가한다. (광운대 공식 해설 원문)'
