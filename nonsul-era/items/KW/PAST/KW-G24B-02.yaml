subparts:
- id: '1'
  stem: |
    [1] 극한값 $\displaystyle\lim_{x\to0}\left\{\frac{\ln(x+1)}{x^2}\left(e^{2x}\cos\pi x-1\right)\right\}$을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=e^{2x}\cos\pi x$라고 하자.
        $f(x)$는 모든 실수에서 미분가능한 함수이며 $f(0)=1$이므로
        $\displaystyle\lim_{x\to0}\frac1x\left(e^{2x}\cos\pi x-1\right)=\lim_{x\to0}\frac{f(x)-f(0)}{x-0}=f^{\prime}(0)$이다.
      source_flow: 예시 답안 p.12
      criteria:
      - 1.M2
    - id: 1b-2
      content: |
        또한 $f^{\prime}(x)=2e^{2x}\cos\pi x-\pi e^{2x}\sin\pi x$, $f^{\prime}(0)=2$이다.
      source_flow: 예시 답안 p.12
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서
        $$\lim_{x\to0}\frac{\ln(1+x)}{x}\cdot\frac{f(x)-f(0)}{x}=\lim_{x\to0}\ln(1+x)^{\frac1x}\times\lim_{x\to0}\frac{f(x)-f(0)}{x-0}=\ln e\times f^{\prime}(0)=2$$
      source_flow: 예시 답안 p.12
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\displaystyle\lim_{x\to0}\dfrac{\ln(1+x)}{x}=\lim_{x\to0}\ln(1+x)^{\frac1x}=\ln e=1$을 이용하면
      depends_on: []
      implied_ok: false
      steps:
      - 1b-3
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $\displaystyle\lim_{x\to0}\dfrac1x\left(e^{2x}\cos\pi x-1\right)=\lim_{x\to0}\dfrac{f(x)-f(0)}{x-0}=f^{\prime}(0)$과 $f^{\prime}(x)=2e^{2x}\cos\pi x-\pi e^{2x}\sin\pi x$, $f^{\prime}(0)=2$를 얻으면
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
