- id: 3-2
  stem: |
    (2) 다항식 $x^{2024}$을 다항식 $x^3+x^2+x+1$로 나누었을 때의 나머지를 구하시오. [10점]
  points: 10
  depends_on:
  - 3-1
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $x^4-1=(x-1)(x^3+x^2+x+1)$
      source_flow: 예시 답안 p.13
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        $x^4=t$로 놓으면
        $x^{2024}-1=(x^4)^{506}-1=t^{506}-1=(t-1)(t^{505}+t^{504}+\cdots+t+1)$이므로
        $x^{2024}=(x^3+x^2+x+1)\{(x-1)(x^{2020}+x^{2016}+\cdots+x^4+1)\}+1$
      source_flow: 예시 답안 p.13
      criteria:
      - 3-2.A1
    - id: 32b-3
      content: |
        따라서 $x^{2024}$을 다항식 $x^3+x^2+x+1$로 나누었을 때의 나머지는 $1$이다.
      source_flow: 예시 답안 p.13
      criteria:
      - 3-2.A2
    - id: 32b-4
      content: |
        (다른 풀이) $p(x)=x^3+x^2+x+1$로 놓으면
        $x^{2024}-1=(x-1)(x^{2023}+x^{2022}+\cdots+x+1)$
        $=(x-1)\{x^{2020}p(x)+x^{2016}p(x)+\cdots+x^4p(x)+p(x)\}$
        $=p(x)(x-1)(x^{2020}+x^{2016}+\cdots+x^4+1)$
        따라서 다음을 얻는다. $x^{2024}=p(x)Q(x)+1$
      source_flow: 예시 답안 p.13
      criteria: []
    - id: 32b-5
      content: |
        (다른 풀이) $p(x)=x^3+x^2+x+1$로 놓으면
        $x^4-1=(x-1)(x^3+x^2+x+1)=(x-1)p(x)$
        $x^{2024}=(x^4)^{506}=\{(x-1)p(x)+1\}^{506}$ (이항정리 적용)
        $=\displaystyle\sum_{k=1}^{506}{}_{506}\mathrm{C}_k(x-1)^k\{p(x)\}^k+1=p(x)Q(x)+1$
      source_flow: 예시 답안 p.13
      criteria: []
