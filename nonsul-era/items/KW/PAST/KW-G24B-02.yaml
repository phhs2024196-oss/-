- id: 3-1
  stem: |
    [3] 실수 $x$에 대한 다음 등식에 대하여 물음에 답하시오.

    $$x^n-1=(x-1)\sum_{i=0}^{n-1}x^i$$

    (1) 모든 자연수 $n$에 대하여 주어진 등식이 성립함을 수학적 귀납법으로 증명하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        (ⅰ) $n=1$일 때
        (좌변)$=x-1$, (우변)$=x-1$이므로 등식이 성립한다.
      source_flow: 예시 답안 p.13
      criteria:
      - 3-1.B1
    - id: 31b-2
      content: |
        (ⅱ) $n=k$일 때 등식이 성립한다고 가정하자.
        $n=k+1$일 때
        $$x^{k+1}-1=x^{k+1}-x^k+x^k-1=x^k(x-1)+(x-1)\sum_{i=0}^{k-1}x^i=(x-1)\left(x^k+\sum_{i=0}^{k-1}x^i\right)=(x-1)\sum_{i=0}^kx^i$$
        따라서 $n=k+1$일 때도 등식이 성립한다.
        (ⅰ), (ⅱ)로부터 모든 자연수 $n$에 대하여 등식이 성립한다.
      source_flow: 예시 답안 p.13
      criteria:
      - 3-1.M1
      - 3-1.A1
  rubric:
    rules:
