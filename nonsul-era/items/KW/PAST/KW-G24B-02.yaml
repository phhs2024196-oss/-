      content: |
        모평균이 $p$, 모표준편차가 $q$이고 표본의 크기가 $n^2$이므로
        $\mathrm{E}(\overline{X})=p$, $\mathrm{V}(\overline{X})=\dfrac{q^2}{n^2}$
      source_flow: 예시 답안 p.12~13
      criteria:
