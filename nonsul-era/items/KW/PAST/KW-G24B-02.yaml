stimuli:
- label: '1'
  body: |
    자연수 $n$에 대한 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.
    ① $n=1$일 때 명제 $p(n)$이 성립한다.
    ② $n=k$일 때 명제 $p(n)$이 성립한다고 가정하면 $n=k+1$일 때도 명제 $p(n)$이 성립한다.
- label: '2'
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는
    $\dfrac{dy}{dx}=\dfrac{dy}{du}\cdot\dfrac{du}{dx}$ 또는 $\{f(g(x))\}^{\prime}=f^{\prime}(g(x))g^{\prime}(x)$
- label: '3'
  body: |
    미분가능한 함수 $f(x)$에서 $f^{\prime}(a)=0$이고, $x=a$의 좌우에서
    ① $f^{\prime}(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고, 극댓값은 $f(a)$이다.
    ② $f^{\prime}(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고, 극솟값은 $f(a)$이다.
- label: '4'
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g^{\prime}(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때 $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)dx=\int_\alpha^\beta f(g(t))g^{\prime}(t)dt$$
