stimuli:
- label: '1'
  body: |
    점 $\mathrm{P}(x_1,y_1)$와 직선 $ax+by+c=0$ 사이의 거리 $d$는
    $$d=\dfrac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$$
- label: '2'
  body: |
    서로 다른 $n$개에서 $r$개를 선택하는 순열의 수는
    $${}_n\mathrm{P}_r=n(n-1)(n-2)\cdots(n-r+1)=\dfrac{n!}{(n-r)!}\quad(\text{단},\ 0<r\le n)$$
    $$n!=n\times(n-1)\times(n-2)\times\cdots\times2\times1\quad(\text{단},\ 0!=1)$$
- label: '3'
  body: |
    서로 다른 $n$개에서 $r$개를 선택하는 조합의 수는
    $${}_n\mathrm{C}_r=\dfrac{{}_n\mathrm{P}_r}{r!}=\dfrac{n!}{r!(n-r)!}\quad(\text{단},\ 0<r\le n)$$
stem: |
  [문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: 1-1
  stem: |
    [1] 좌표평면 위의 세 점 $\mathrm{O}(0,0)$, $\mathrm{A}(8,0)$, $\mathrm{B}(0,6)$를 꼭짓점으로 하는 삼각형 OAB가 있다.

    [그림: 좌표평면에서 원점 O, $x$축 위의 점 A(8,0), $y$축 위의 점 B(0,6)를 선분으로 이은 직각삼각형 OAB]

    (1) 삼각형 OAB의 외접원과 내접원의 방정식을 각각 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 외접원=(x-4)^2+(y-3)^2=25; 내접원=(x-2)^2+(y-2)^2=4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-1-B
    audience: B
    method_no: 1
    steps:
    - id: 1-1b-1
      content: |
        삼각형 OAB의 외접원은 세 점 $\mathrm{O}(0,0)$, $\mathrm{A}(8,0)$, $\mathrm{B}(0,6)$을 지나고, 삼각형 OAB가 직각삼각형이기 때문에 선분 AB는 외접원의 지름이다.
      source_flow: 문항카드 p.11~12
      criteria:
      - 1-1.M1
    - id: 1-1b-2
      content: |
        따라서 선분 AB의 중점의 좌표가 외접원의 중심(외심)의 좌표이다. 따라서 외접원의 중심(외심)의 좌표는 $\left(\dfrac{8+0}{2},\dfrac{0+6}{2}\right)=(4,3)$이다. 외접원의 반지름은 선분 AB의 길이의 반이기 때문에 $\dfrac{\overline{\mathrm{AB}}}{2}=\dfrac{\sqrt{(8-0)^2+(0-6)^2}}{2}=\dfrac{10}{2}=5$이다.
      source_flow: 문항카드 p.11~12
      criteria:
      - 1-1.A1
      - 1-1.A2
    - id: 1-1b-3
      content: |
        그러므로 삼각형 OAB의 외접원의 방정식은 $(x-4)^2+(y-3)^2=5^2$이다. 이를 전개하면 $x^2+y^2-8x-6y=0$이다.
      source_flow: 문항카드 p.11~12
      criteria:
      - 1-1.A3
    - id: 1-1b-4
      content: |
        두 점 $\mathrm{A}(8,0)$, $\mathrm{B}(0,6)$을 지나는 직선의 방정식은 $y-0=\dfrac{0-6}{8-0}(x-8)$이기 때문에 $y=-\dfrac34x+6$이다. 이를 정리하면 $3x+4y=24$ 또는 $3x+4y-24=0$이다.
      source_flow: 문항카드 p.11~12
      criteria:
      - 1-1.B1
    - id: 1-1b-5
      content: |
        직각삼각형 OAB의 내접원은 서로 수직인 $x$축과 $y$축에 동시에 접하기 때문에, 내접원의 반지름을 $r$이라고 하면 내접원의 중심(내심)의 좌표는 $(r,r)$이기 때문에 내접원의 방정식은 $(x-r)^2+(y-r)^2=r^2$이다.
      source_flow: 문항카드 p.11~12
      criteria:
      - 1-1.M2
      - 1-1.M3
    - id: 1-1b-6
      content: |
        내접원은 두 점 $\mathrm{A}(8,0)$, $\mathrm{B}(0,6)$을 지나는 직선에 접하기 때문에 내접원의 중심(내심) $(r,r)$에서 이 직선까지의 거리는 $\dfrac{\lvert3r+4r-24\rvert}{\sqrt{3^2+4^2}}=r$이다. $\lvert7r-24\rvert=5r$이므로 양변을 제곱하여 전개하면 $(7r-24)^2=49r^2-336r+576=25r^2$이다. 이를 정리하면 $24r^2-336r+576=0$이기 때문에 $r^2-14r+24=(r-2)(r-12)=0$이다. $r<6$이기 때문에 $r=2$이다.
        (다른 풀이) 접점에서 꼭짓점까지의 접선 길이를 이용하면 $(6-r)+(8-r)=10$, 즉 $2r=4$이므로 $r=2$이다.
      source_flow: 문항카드 p.11~12
      criteria:
      - 1-1.M4
      - 1-1.A4
    - id: 1-1b-7
      content: |
        그러므로 삼각형 OAB의 내접원의 방정식은 $(x-2)^2+(y-2)^2=2^2$이다. 이를 전개하면 $x^2+y^2-4x-4y+4=0$이다. ■
      source_flow: 문항카드 p.11~12
      criteria:
      - 1-1.A5
