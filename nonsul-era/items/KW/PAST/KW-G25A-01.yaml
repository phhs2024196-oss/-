      evidence: |
        외접원의 방정식을 $(x-4)^2+(y-3)^2=5^2$ 또는 $x^2+y^2-8x-6y=0$으로 나타냈다.
      depends_on:
      - 1-1.M1
      - 1-1.A1
      - 1-1.A2
      steps:
      - 1-1b-3
    - id: 1-1.B1
      mark_type: B
      points: 1
      evidence: |
        두 점 A, B를 지나는 직선의 방정식을 $3x+4y=24$ 또는 $3x+4y-24=0$으로 구했다.
      depends_on: []
      steps:
      - 1-1b-4
    - id: 1-1.M2
      mark_type: M
      points: 1
      evidence: |
        내접원이 $x$축과 $y$축에 동시에 접하므로 반지름을 $r$이라 하고 중심을 $(r,r)$로 두었다.
      depends_on: []
      implied_ok: false
      steps:
      - 1-1b-5
    - id: 1-1.M3
      mark_type: M
      points: 1
      evidence: |
        내접원의 방정식을 $(x-r)^2+(y-r)^2=r^2$으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps:
      - 1-1b-5
    - id: 1-1.M4
      mark_type: M
      points: 1
      evidence: |
        중심 $(r,r)$에서 직선 AB까지의 거리를 이용하여 $\dfrac{\lvert3r+4r-24\rvert}{\sqrt{3^2+4^2}}=r$로 나타냈다.
      depends_on:
      - 1-1.M2
      implied_ok: false
      steps:
      - 1-1b-6
    - id: 1-1.A4
      mark_type: A
      points: 1
      evidence: |
        방정식 $(r-2)(r-12)=0$에서 $r<6$이므로 $r=2$만이 근임을 구했다.
      depends_on:
      - 1-1.M4
      steps:
      - 1-1b-6
    - id: 1-1.A5
      mark_type: A
      points: 1
      evidence: |
        내접원의 방정식을 $(x-2)^2+(y-2)^2=2^2$ 또는 $x^2+y^2-4x-4y+4=0$으로 나타냈다.
      depends_on:
      - 1-1.M3
      - 1-1.A4
      steps:
      - 1-1b-7
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) 삼각형 OAB의 외접원 위의 점과 내접원 위의 점 사이의 거리의 최솟값과 최댓값을 구하시오. [14점]
  points: 14
  depends_on:
  - 1-1
  answer:
    kind: expression
    value: min=3-sqrt(5); max=7+sqrt(5)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-2-B
    audience: B
    method_no: 1
    steps:
    - id: 1-2b-1
      content: |
        삼각형 OAB의 외심 $(4,3)$과 내심 $(2,2)$를 지나는 직선의 방정식을 구하면 $y-2=\dfrac{3-2}{4-2}(x-2)$이기 때문에 $y=\dfrac12x+1$이다. 삼각형 OAB의 외접원 위의 점과 내접원 위의 점 사이의 거리의 최솟값과 최댓값은 이 직선과 외접원 및 내접원이 만나는 교점 사이의 거리를 이용하여 찾을 수 있다.
      source_flow: 문항카드 p.12~13
      criteria:
      - 1-2.B1
      - 1-2.M1
    - id: 1-2b-2
      content: |
        이 직선과 삼각형 OAB의 외접원과 만나는 두 교점 $\mathrm{P}$, $\mathrm{S}$의 좌표를 구하면 $x^2+y^2-8x-6y=x^2+\left(\dfrac12x+1\right)^2-8x-6\left(\dfrac12x+1\right)=0$에서 $4x^2+(x+2)^2-32x-12(x+2)=5x^2-40x-20=5(x^2-8x-4)=0$이다. $x^2-8x-4=0\Rightarrow x=\dfrac{8\pm\sqrt{64-4\times1\times(-4)}}{2}=4\pm2\sqrt5$이고 $y=\dfrac12x+1=3\pm\sqrt5$이다. 따라서 두 교점의 좌표는 $\mathrm{P}(4-2\sqrt5,\,3-\sqrt5)$, $\mathrm{S}(4+2\sqrt5,\,3+\sqrt5)$이다.
      source_flow: 문항카드 p.12~13
      criteria:
      - 1-2.A1
    - id: 1-2b-3
      content: |
        이 직선과 삼각형 OAB의 내접원과 만나는 두 교점 $\mathrm{Q}$, $\mathrm{R}$의 좌표를 구하면 $x^2+y^2-4x-4y+4=x^2+\left(\dfrac12x+1\right)^2-4x-4\left(\dfrac12x+1\right)+4=0$에서 $4x^2+(x+2)^2-16x-8(x+2)+16=5x^2-20x+4=0$이다. $x=\dfrac{20\pm\sqrt{400-4\times5\times4}}{2\times5}=\dfrac{10\pm4\sqrt5}{5}$, $y=\dfrac12x+1=\dfrac{10\pm2\sqrt5}{5}$이다. 따라서 두 교점의 좌표는 $\mathrm{Q}\left(\dfrac{10-4\sqrt5}{5},\dfrac{10-2\sqrt5}{5}\right)$, $\mathrm{R}\left(\dfrac{10+4\sqrt5}{5},\dfrac{10+2\sqrt5}{5}\right)$이다.
      source_flow: 문항카드 p.12~13
      criteria:
      - 1-2.A2
    - id: 1-2b-4
      content: |
        그러므로 최솟값 $l_1=\overline{\mathrm{PQ}}=\sqrt{\left(4-2\sqrt5-\dfrac{10-4\sqrt5}{5}\right)^2+\left(3-\sqrt5-\dfrac{10-2\sqrt5}{5}\right)^2}=\sqrt{14-6\sqrt5}=\sqrt{(3-\sqrt5)^2}=3-\sqrt5$이다.
      source_flow: 문항카드 p.12~13
      criteria:
      - 1-2.A3
    - id: 1-2b-5
      content: |
        최댓값 $l_2=\overline{\mathrm{QS}}=\sqrt{\left(4+2\sqrt5-\dfrac{10-4\sqrt5}{5}\right)^2+\left(3+\sqrt5-\dfrac{10-2\sqrt5}{5}\right)^2}=\sqrt{54+14\sqrt5}=\sqrt{(7+\sqrt5)^2}=7+\sqrt5$이다.
