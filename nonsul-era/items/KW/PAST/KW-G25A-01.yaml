intent: '[1](1) 직각삼각형의 외접원은 빗변이 지름임을 이용해 외접원을, 좌표축에 접하는 내접원의 중심을 (r,r)로 두고 점과 직선 사이의 거리로 내접원을 구하는 능력을 평가한다. [1](2) 외심과 내심을 지나는 직선과 두 원의 교점으로 두 원 위의 점 사이 거리의 최솟값과 최댓값을 구하는 능력을 평가한다. [2](1)~(3) 일부 학생을 한 사람으로 묶어 배열하고, 조건을 만족시키는 경우를 빠짐없이 나누어 경우의 수를 구하는 능력을 평가한다. (문항카드 출제 의도 요약)'
key_idea: 직각삼각형이므로 외심은 빗변의 중점, 내접원은 두 축에 접하므로 중심이 $(r,r)$이다. 두 원 위 점 사이 거리의 최소·최대는 중심선 위의 교점에서 생긴다. 좌석 배정은 이웃한 학생 묶음을 한 단위로 보고 조건을 만족시키는 배치를 8가지로 나누어 센다.
stuck: '[2](3)에서 3학년·2학년 학생 양옆에 1학년 여·남 한 명씩 두는 배치를 8가지로 빠짐없이 나누고, 두 묶음이 겹쳐 하나의 학생이 공유되는 경우(⑤~⑧)의 선택 수를 따로 세는 단계'
