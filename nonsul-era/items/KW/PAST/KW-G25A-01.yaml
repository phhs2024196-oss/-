        (다른 풀이) 1학년 여학생 3명 중에서 2명을 배열하는 경우의 수는 ${}_3\mathrm{P}_2=\dfrac{3!}{(3-2)!}=3$[판독확인: 모범답안 원문 오기 — $\dfrac{3!}{(3-2)!}=6$이며 아래 곱셈에서는 $6$으로 계산함]이고, 1학년 남학생 2명 중에서 1명을 배열하는 경우의 수는 ${}_2\mathrm{P}_1=\dfrac{2!}{(2-1)!}=2$이다. 따라서 (1여)(3)(1남)(2)(1여)인 경우의 수는 ${}_3\mathrm{P}_3\times{}_3\mathrm{P}_2\times{}_2\mathrm{P}_1=6\times6\times2=72$이다.
