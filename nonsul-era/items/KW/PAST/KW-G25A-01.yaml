    - id: 1-1.A1
      mark_type: A
      points: 1
      evidence: |
        외접원의 중심(외심)을 선분 AB의 중점 $(4,3)$으로 구했다.
      depends_on:
      - 1-1.M1
      steps:
      - 1-1b-2
    - id: 1-1.A2
      mark_type: A
      points: 1
      evidence: |
        외접원의 반지름을 선분 AB의 길이의 반인 $5$로 구했다.
      depends_on:
      - 1-1.M1
