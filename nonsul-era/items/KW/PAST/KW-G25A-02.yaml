- id: 4-2
  stem: |
    (2) $\left\lvert\displaystyle\lim_{x\to a-}f^{-1}(x)+\lim_{x\to a+}f^{-1}(x)\right\rvert=1$을 만족시키는 실수 $a$를 모두 구하시오.(단, $-2<a<2$) [14점]
  points: 14
  depends_on:
  - 4-1
  answer:
    kind: set
    value: -1; 0; 1; 3/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-2-B
    audience: B
    method_no: 1
    steps:
    - id: 4-2b-1
      content: |
        [그림: $y=f^{-1}(x)$ 그래프] $f^{-1}(x)=\begin{cases}\sqrt{x+2}-2&(-2<x\le-1)\\-\dfrac12(x+1)&(-1<x<1)\\2(x-1)^2&(1\le x<2)\end{cases}$
      source_flow: 문항카드 p.24
      criteria:
      - 4-2.M1
    - id: 4-2b-2
      content: |
        (ⅰ) $-2<a<-1$일 때 $\left\lvert\displaystyle\lim_{x\to a-}f^{-1}(x)+\lim_{x\to a+}f^{-1}(x)\right\rvert=\left\lvert2(\sqrt{a+2}-2)\right\rvert=1$, $\sqrt{a+2}=2\pm\dfrac12=\dfrac52,\dfrac32$이므로 $a=\dfrac{17}{4},\dfrac14$이다. 그런데 두 값 모두 구간 $-2<a<-1$에 포함되지 않는다.
      source_flow: 문항카드 p.24
      criteria:
      - 4-2.A1
    - id: 4-2b-3
      content: |
        (ⅱ) $a=-1$일 때 $\left\lvert\displaystyle\lim_{x\to a-}f^{-1}(x)+\lim_{x\to a+}f^{-1}(x)\right\rvert=\lvert-1+0\rvert=1$이다.
        (ⅲ) $-1<a<1$일 때 $\left\lvert-\dfrac12(a+1)-\dfrac12(a+1)\right\rvert=1$, $a+1=\pm1$이므로 $a=0,-2$이다. 그런데 $a=0$만 구간 $-1<a<1$에 포함된다.
        (ⅳ) $a=1$일 때 $\lvert-1+0\rvert=1$이다.
        (ⅴ) $1<a<2$일 때 $\left\lvert2(a-1)^2+2(a-1)^2\right\rvert=1$, $a-1=\pm\dfrac12$이므로 $a=\dfrac32,\dfrac12$이다. 그런데 $a=\dfrac32$만 구간 $1<a<2$에 포함된다.
      source_flow: 문항카드 p.24
      criteria:
      - 4-2.A1
    - id: 4-2b-4
      content: |
        (ⅰ), (ⅱ), (ⅲ), (ⅳ), (ⅴ)로부터 $a=-1,\,0,\,1,\,\dfrac32$이다. ■
      source_flow: 문항카드 p.24
      criteria:
      - 4-2.A1
