intent: '[1] 큰 수의 계산을 다항식의 나눗셈으로 바꾸어 인수분해로 해결하는 능력을 평가한다. [2] 자연수의 거듭제곱의 합과 정적분과 급수의 관계를 이용해 극한을 계산하는 능력을 평가한다. [3] 합성함수를 반복해서 계산하고 넓이 조건으로 자연수를 구하는 능력을 평가한다. [4](1) 연속성과 미분가능성의 개념을 주어진 함수에 적용하는 능력을, (2) 역함수의 그래프를 이해하고 조건을 만족시키는 실수를 찾는 능력을 평가한다. (문항카드 출제 의도 요약)'
key_idea: $x=2025$로 두어 곱을 인수분해하고, 급수의 일반항을 $\dfrac{k}{n^2+k^2}$로 줄여 정적분으로 바꾼다. $f^n=f$, $g^n(x)=(x-1)^{2^n}+1$로 넓이를 $n$의 식으로 나타내고, 역함수는 구간별로 구해 좌·우극한의 합이 $\pm1$이 되는 경우를 나눈다.
stuck: '[4](2)에서 구간 $(-2,-1)$, $\{-1\}$, $(-1,1)$, $\{1\}$, $(1,2)$로 나누어 각 구간의 해가 그 구간에 속하는지 확인하는 단계'
