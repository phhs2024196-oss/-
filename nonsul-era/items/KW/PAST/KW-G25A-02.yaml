stimuli:
- label: '1'
  body: |
    다항식 $A$를 다항식 $B\,(B\neq0)$로 나누었을 때의 몫을 $Q$, 나머지를 $R$이라고 하면
    $$A=BQ+R$$
    가 성립한다. 여기서 $R$은 상수이거나 $R$의 차수는 $B$의 차수보다 낮다.
- label: '2'
  body: |
    자연수의 거듭제곱의 합
    ① $1+2+3+\cdots+n=\displaystyle\sum_{k=1}^{n}k=\dfrac{n(n+1)}{2}$
    ② $1^2+2^2+3^2+\cdots+n^2=\displaystyle\sum_{k=1}^{n}k^2=\dfrac{n(n+1)(2n+1)}{6}$
    ③ $1^3+2^3+3^3+\cdots+n^3=\displaystyle\sum_{k=1}^{n}k^3=\left\{\dfrac{n(n+1)}{2}\right\}^2$
- label: '3'
  body: |
    함수 $f(x)$가 $x=a$에 대하여
    (ⅰ) 함수 $f(x)$가 $x=a$에서 정의되고
    (ⅱ) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재하며
    (ⅲ) $\displaystyle\lim_{x\to a}f(x)=f(a)$
    일 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다.
- label: '4'
  body: |
    함수 $f(x)$에 대하여
    $$\lim_{\Delta x\to0}\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$$
    가 존재하면 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다.
stem: |
  [문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: '1'
  stem: |
    [1] 인수분해를 이용하여 자연수 $2025\cdot2026\cdot2027\cdot2028-24$를 $(2025)^2+3\cdot2023+1$로 나누었을 때의 나머지를 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: '11'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x=2025$라고 두면 $2025\cdot2026\cdot2027\cdot2028-24=x(x+1)(x+2)(x+3)-24=(x^2+3x)(x^2+3x+2)-24=(x^2+3x)^2+2(x^2+3x)-24=(x^2+3x-4)(x^2+3x+6)=(x-1)(x+4)(x^2+3x+6)$이다.
      source_flow: 문항카드 p.22
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $(2025)^2+3\cdot2023+1=x^2+3(x-2)+1=x^2+3x-5$이므로 다음 식을 얻는다. $2025\cdot2026\cdot2027\cdot2028-24=(x-1)(x+4)(x^2+3x+6)=(x-1)(x+4)(x^2+3x-5+11)=(x-1)(x+4)(x^2+3x-5)+11(x-1)(x+4)=(x-1)(x+4)(x^2+3x-5)+11(x^2+3x-5+1)=\{(x-1)(x+4)+11\}(x^2+3x-5)+11$
      source_flow: 문항카드 p.22
      criteria:
      - 1.B1
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $2025\cdot2026\cdot2027\cdot2028-24$를 $(2025)^2+3\cdot2023+1$로 나누었을 때의 나머지는 $11$이다.
      source_flow: 문항카드 p.22
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $x=2025$라고 두고 $2025\cdot2026\cdot2027\cdot2028-24=(x-1)(x+4)(x^2+3x+6)$으로 인수분해했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        $(2025)^2+3\cdot2023+1=x^2+3(x-2)+1=x^2+3x-5$를 구했다.
      depends_on: []
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $2025\cdot2026\cdot2027\cdot2028-24=\{(x-1)(x+4)+11\}(x^2+3x-5)+11$을 보이고 나머지 $11$을 구했다.
      depends_on:
      - 1.M1
      - 1.B1
      steps:
      - 1b-2
      - 1b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [2]
    $$\lim_{n\to\infty}\left\{\dfrac{1}{1\cdot(n^2+1^2)}+\dfrac{1+7}{(1+3)(n^2+2^2)}+\dfrac{1+7+19}{(1+3+5)(n^2+3^2)}+\cdots+\dfrac{1+7+\cdots+(3n^2-3n+1)}{(1+3+\cdots+(2n-1))(n^2+n^2)}\right\}$$
    의 값을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: ln(2)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        주어진 식을 합의 기호로 나타내면 $\displaystyle\lim_{n\to\infty}\left\{\cdots\right\}=\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac{1+7+\cdots+(3k^2-3k+1)}{(1+3+\cdots+(2k-1))(n^2+k^2)}$ ······ ①
      source_flow: 문항카드 p.22
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        ①에서 분자와 분모의 일부를 계산하면 $1+7+\cdots+(3k^2-3k+1)=\displaystyle\sum_{p=1}^{k}(3p^2-3p+1)=\dfrac{k(k+1)(2k+1)}{2}-\dfrac{3k(k+1)}{2}+k=\dfrac k2(2k^2+3k+1-3k-3+2)=k^3$, $1+3+\cdots+(2k-1)=\displaystyle\sum_{p=1}^{k}(2p-1)=k(k+1)-k=k^2$이다.
      source_flow: 문항카드 p.22
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        이로부터 ①식은 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac{k}{n^2+k^2}=\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac{\dfrac kn}{1+\left(\dfrac kn\right)^2}\dfrac1n=\int_0^1\dfrac{x}{1+x^2}\,dx=\left[\dfrac12\ln(1+x^2)\right]_0^1=\dfrac{\ln2}{2}$이다.
      source_flow: 문항카드 p.22
      criteria:
      - 2.M2
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        주어진 식을 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac{k}{n^2+k^2}$ 꼴로 정리했다(분자 $k^3$, 분모의 일부 $k^2$).
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac{\dfrac kn}{1+\left(\dfrac kn\right)^2}\dfrac1n=\int_0^1\dfrac{x}{1+x^2}\,dx$로 나타냈다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-3
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $\displaystyle\int_0^1\dfrac{x}{1+x^2}\,dx=\dfrac{\ln2}{2}$를 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    deductions: []
