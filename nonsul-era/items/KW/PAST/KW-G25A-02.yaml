  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [3] 두 함수 $f(x)=\begin{cases}x&(x\ge1)\\2-x&(x<1)\end{cases}$와 $g(x)=x^2-2x+2$에 대하여 두 곡선 $y=f^n(x)$와 $y=g^n(x)$로 둘러싸인 도형의 넓이가 $\dfrac{15}{17}$일 때의 자연수 $n$을 구하시오. [14점]
    (단, 함수 $f(x)$에 대하여 $f^1(x)=f(x)$, $f^{n+1}(x)=(f\circ f^n)(x)$, $n$은 자연수)
  points: 14
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $x\ge1$일 때 $f(x)=x\ge1$이므로 $(f\circ f)(x)=f(x)=x$이고, $x<1$일 때 $f(x)=2-x\ge1$이므로 $(f\circ f)(x)=f(2-x)=2-x$이다. 따라서 $f^2(x)=f(f(x))=f(x)$이고 모든 자연수 $n$에 대하여 $f^n(x)=f(x)$이다.
        (다른 설명) $f(x)=\begin{cases}x&(x\ge1)\\2-x&(x<1)\end{cases}=\lvert x-1\rvert+1$이므로 $f^2(x)=f(f(x))=\lvert\lvert x-1\rvert+1-1\rvert+1=\lvert x-1\rvert+1=f(x)$
      source_flow: 문항카드 p.22~23
      criteria:
      - 3.B1
    - id: 3b-2
      content: |
        $g(x)=x^2-2x+2=(x-1)^2+1$이므로 $g^2(x)=g(g(x))=\{(x-1)^2+1-1\}^2+1=(x-1)^{2^2}+1$이다. 따라서 모든 자연수 $n$에 대하여 $g^n(x)=g(g^{(n-1)}(x))=\{(x-1)^{2^{n-1}}+1-1\}^2+1=(x-1)^{2^n}+1$을 얻는다.
      source_flow: 문항카드 p.22~23
      criteria:
      - 3.B2
    - id: 3b-3
      content: |
        두 함수 $f^n(x)$와 $g^n(x)$의 교점, 즉 $(x-1)^{2^n}=\lvert x-1\rvert$의 교점을 구하자. (ⅰ) $x>1$일 때 $(x-1)\{(x-1)^{2^n-1}-1\}=0$이므로 $x=2$, (ⅱ) $x<1$일 때 $(x-1)\{(x-1)^{2^n-1}+1\}=0$이므로 $x=0$, (ⅲ) $x=1$일 때 좌변=우변=0이므로 교점이다.
      source_flow: 문항카드 p.22~23
      criteria:
      - 3.M1
    - id: 3b-4
      content: |
        두 곡선 $y=f^n(x)$와 $y=g^n(x)$로 둘러싸인 도형의 넓이를 $S$라고 하면 $S=2\displaystyle\int_0^1\lvert f^n(x)-g^n(x)\rvert\,dx=2\int_0^1\{2-x-(x-1)^{2^n}-1\}\,dx=2\left[x-\dfrac{x^2}{2}-\dfrac{(x-1)^{2^n+1}}{2^n+1}\right]_0^1=1-\dfrac{2}{2^n+1}=\dfrac{15}{17}$이다. 따라서 $n=4$이다.
      source_flow: 문항카드 p.22~23
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.B1
      mark_type: B
      points: 4
      evidence: |
        모든 자연수 $n$에 대하여 $f^n(x)=f(x)$임을 보였다.
      depends_on: []
      steps:
      - 3b-1
    - id: 3.B2
      mark_type: B
      points: 4
      evidence: |
        $g^n(x)=(g\circ g^{n-1})(x)=(x-1)^{2^n}+1$임을 보였다.
      depends_on: []
      steps:
      - 3b-2
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        두 함수 $f^n(x)$와 $g^n(x)$의 교점 $x=0,1,2$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-3
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $2\displaystyle\int_0^1\lvert f^n(x)-g^n(x)\rvert\,dx=1-\dfrac{2}{2^n+1}=\dfrac{15}{17}$로부터 $n=4$를 구했다.
      depends_on:
      - 3.M1
      - 3.B1
      - 3.B2
      steps:
      - 3b-4
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 4-1
  stem: |
    [4] $-2<x<2$에서 다음과 같이 정의된 함수 $f(x)$에 대하여 다음 물음에 답하시오.
    $$f(x)=\begin{cases}(x+2)^2-2&(-2<x\le-1)\\-2x-1&(-1<x<0)\\\sqrt{\dfrac x2}+1&(0\le x<2)\end{cases}$$
    (1) $x=-1$에서 함수 $y=\lvert f(x)\rvert$의 연속성과 미분가능성을 조사하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: continuous=yes; differentiable=yes
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-1-B
    audience: B
    method_no: 1
    steps:
    - id: 4-1b-1
      content: |
        [그림: $y=f(x)$의 그래프와 $y=\lvert f(x)\rvert$의 그래프] $\lvert f(x)\rvert=\begin{cases}2-(x+2)^2&(-2<x\le-1)\\\lvert2x+1\rvert&(-1<x<0)\\\sqrt{\dfrac x2}+1&(0\le x<2)\end{cases}$
      source_flow: 문항카드 p.23~24
      criteria: []
    - id: 4-1b-2
      content: |
        $\displaystyle\lim_{x\to-1-}\{2-(x+2)^2\}=1$, $\lvert f(-1)\rvert=1$, $\displaystyle\lim_{x\to-1+}\lvert2x+1\rvert=1$이므로 $x=-1$에서 $y=\lvert f(x)\rvert$는 연속이다.
      source_flow: 문항카드 p.23~24
      criteria:
      - 4-1.B1
    - id: 4-1b-3
      content: |
        (좌미분계수)$=\displaystyle\lim_{h\to0-}\dfrac{2-(-1+h+2)^2-1}{h}=\lim_{h\to0-}\dfrac{-h^2-2h}{h}=-2$, (우미분계수)$=\displaystyle\lim_{h\to0+}\dfrac{\lvert2(-1+h)+1\rvert-1}{h}=\lim_{h\to0+}\dfrac{1-2h-1}{h}=-2$이므로 $y=\lvert f(x)\rvert$는 $x=-1$에서 미분가능하다.
      source_flow: 문항카드 p.23~24
      criteria:
      - 4-1.B2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4-1.B1
      mark_type: B
      points: 4
      evidence: |
        함숫값, 좌극한값과 우극한값을 각각 구하고 같음을 보여 연속임을 밝혔다.
      depends_on: []
      steps:
      - 4-1b-2
    - id: 4-1.B2
      mark_type: B
      points: 4
      evidence: |
        좌미분계수와 우미분계수를 각각 구하고 같음을 보여 미분가능함을 밝혔다.
      depends_on: []
      steps:
      - 4-1b-3
