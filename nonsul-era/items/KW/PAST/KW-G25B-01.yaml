- id: '4'
  stem: |
    [4] 원 $x^2+y^2=2n$이 곡선 $y=\dfrac{n}{x}$과 만나는 점의 양의 $x$좌표를 $a_n$, 곡선 $y=\sqrt{2nx}$와 만나는 점의 $x$좌표를 $b_n$이라고 하자. 이때, $\displaystyle\lim_{n\to\infty}\dfrac{b_n}{(a_n)^2}$의 값을 구하시오. (단, $n$은 자연수) [10점]
  points: 10
  depends_on: []
  answer:
