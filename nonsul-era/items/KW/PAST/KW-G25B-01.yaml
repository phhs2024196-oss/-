intent: '[1] 함수의 정의를 이해하고 일대일함수의 개수와 조건을 만족시키는 경우의 수를 구하는 능력을 평가한다. [2] 이차함수의 최솟값과 이차방정식의 판별식, 삼각함수의 관계를 이용하는 능력을 평가한다. [3] 이항분포를 정규분포로 근사하고 표준정규분포의 값을 구하는 능력을 평가한다. [4] 유리함수와 무리함수의 그래프의 교점의 좌표를 구하고 수열의 극한을 계산하는 능력을 평가한다. (문항카드 출제 의도 요약)'
key_idea: 일대일함수는 $_5\mathrm{P}_3$개이고 (가)는 크기순 배열로 $_5\mathrm{C}_3$개이다. $f$의 최솟값은 완전제곱식으로 구하고 판별식으로 $\cos\theta$의 범위를 잡는다. 이항분포를 정규분포로 근사하고 표준화하여 표의 값으로 계산한다. 교점의 $x$좌표 $a_n=\sqrt n$, $b_n=\sqrt{n^2+2n}-n$을 구하고 유리화로 극한을 구한다.
stuck: '[2](2)에서 $\cos\theta$가 $0\le\theta\le\pi$에서 감소함수임을 이용해 $\theta$의 최솟값·최댓값을 $\cos\theta$의 최댓값·최솟값에 대응시키는 단계'
