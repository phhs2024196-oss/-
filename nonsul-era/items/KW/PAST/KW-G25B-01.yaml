  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        원 $x^2+y^2=2n$과 곡선 $y=\dfrac nx$가 만나므로 $x^2+\left(\dfrac nx\right)^2=2n$, $x^2+\dfrac{n^2}{x^2}-2n=0$에서 $x^4-2nx^2+n^2=(x^2-n)^2=0$이므로 $x=\pm\sqrt n$이다. 따라서 만나는 점의 양의 $x$좌표 $a_n=\sqrt n$이다.
      source_flow: 문항카드 p.31
      criteria:
      - 4.B1
    - id: 4b-2
      content: |
        원 $x^2+y^2=2n$과 곡선 $y=\sqrt{2nx}$가 만나므로 $x^2+(\sqrt{2nx})^2-2n=x^2+2nx-2n=0$에서 $x=-n\pm\sqrt{n^2+2n}$이다. 따라서 만나는 점의 $x$좌표 $b_n=\sqrt{n^2+2n}-n$이다. (∵ 무리함수의 정의역 $x>0$)
      source_flow: 문항카드 p.31
      criteria:
      - 4.B2
    - id: 4b-3
      content: |
        $\displaystyle\lim_{n\to\infty}\dfrac{b_n}{(a_n)^2}=\lim_{n\to\infty}\dfrac{\sqrt{n^2+2n}-n}{(\sqrt n)^2}=\lim_{n\to\infty}\dfrac{\sqrt{n^2+2n}-n}{n}=\lim_{n\to\infty}\dfrac{(\sqrt{n^2+2n}-n)(\sqrt{n^2+2n}+n)}{n(\sqrt{n^2+2n}+n)}=\lim_{n\to\infty}\dfrac{n^2+2n-n^2}{n(\sqrt{n^2+2n}+n)}=\lim_{n\to\infty}\dfrac{2}{\sqrt{n^2+2n}+n}=0$이다.
      source_flow: 문항카드 p.31
      criteria:
      - 4.M1
