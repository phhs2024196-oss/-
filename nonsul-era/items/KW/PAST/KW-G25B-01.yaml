stimuli:
- label: '1'
  body: |
    함수 $f:X\to Y$에서 정의역 $X$의 두 원소 $x_1,x_2$에 대하여 $x_1\neq x_2$이면 $f(x_1)\neq f(x_2)$일 때, 함수 $f$를 일대일함수라고 한다.
- label: '2'
  body: |
    확률변수 $X$가 정규분포 $\mathrm{N}(m,\sigma^2)$을 따를 때, 확률변수
    $$Z=\dfrac{X-m}{\sigma}$$
    은 표준정규분포 $\mathrm{N}(0,1)$을 따르고 다음이 성립한다.
    $\mathrm{P}(-1\le Z\le1)=0.6826$
    $\mathrm{P}(-2\le Z\le2)=0.9544$
    $\mathrm{P}(-3\le Z\le3)=0.9974$
stem: |
  [문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: '1'
  stem: |
    [1] 집합 $X=\{1,2,3\}$에서 집합 $Y=\{3,4,5,6,7\}$로의 모든 일대일함수 $f$ 중에서 임의로 하나를 선택할 때, 이 함수가 다음 조건을 모두 만족시킬 확률을 구하시오. [8점]

    (가) $f(1)<f(2)<f(3)$이다.
    (나) $f(1)+f(2)+f(3)$은 홀수이다.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 1/15
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        집합 $X=\{1,2,3\}$에서 집합 $Y=\{3,4,5,6,7\}$로의 함수 중 일대일함수는 집합 $Y$에서 3개를 뽑아 일렬로 나열하는 경우이므로 ${}_5\mathrm{P}_3=5\times4\times3=60$이다.
      source_flow: 문항카드 p.30
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        조건 (가)를 만족하는 함수는 집합 $Y$에서 3개를 뽑아 크기순으로 하나씩 대응시키는 경우이므로 ${}_5\mathrm{C}_3={}_5\mathrm{C}_2=\dfrac{5\times4}{2\times1}=10$이다. 이 중 조건 (나)를 만족하려면 치역의 원소가 모두 홀수이거나 하나만 홀수이어야 한다. (ⅰ) 모두 홀수인 경우: $(3,5,7)$ (ⅱ) $3$만 선택된 경우: $(3,4,6)$ (ⅲ) $5$만 선택된 경우: $(4,5,6)$ (ⅳ) $7$만 선택된 경우: $(4,6,7)$
      source_flow: 문항카드 p.30
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        따라서 조건을 만족하는 함수 $f$의 확률은 $\dfrac{4}{60}=\dfrac{1}{15}$이다.
      source_flow: 문항카드 p.30
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        일대일함수의 개수 ${}_5\mathrm{P}_3=5\times4\times3=60$을 구했다.
      depends_on: []
      steps:
      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        조건 (가)와 (나)를 만족하는 경우 $(3,5,7)$, $(3,4,6)$, $(4,5,6)$, $(4,6,7)$을 모두 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        조건을 만족하는 확률 $\dfrac{4}{60}=\dfrac{1}{15}$을 구했다.
      depends_on:
      - 1.M1
      - 1.B1
      steps:
      - 1b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-1
  stem: |
    [2] 함수 $f(x)=x^2+2x\sin\theta+2\cos\theta$에 대하여 다음 물음에 답하시오. (단, $0\le\theta\le\pi$)

    (1) 함수 $f(x)$의 최솟값을 $\theta$에 대한 함수 $m(\theta)$라고 하자. 이때, 함수 $m(\theta)$의 최댓값을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-1-B
    audience: B
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        $f(x)=x^2+2x\sin\theta+\sin^2\theta-\sin^2\theta+2\cos\theta=(x+\sin\theta)^2-\sin^2\theta+2\cos\theta=(x+\sin\theta)^2-(1-\cos^2\theta)+2\cos\theta=(x+\sin\theta)^2+\cos^2\theta+2\cos\theta-1$이다. $x=-\sin\theta$에서 최솟값 $m(\theta)=f(-\sin\theta)=\cos^2\theta+2\cos\theta-1=(\cos\theta+1)^2-2$이다.
      source_flow: 문항카드 p.30
      criteria:
      - 2-1.M1
    - id: 2-1b-2
      content: |
        $0\le\theta\le\pi$에서 $-1\le\cos\theta\le1$이므로 $0\le\cos\theta+1\le2$이고 $0\le(\cos\theta+1)^2\le4$이다. 따라서 $m(\theta)=(\cos\theta+1)^2-2$의 최댓값은 $2$이다.
      source_flow: 문항카드 p.30
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 4
      evidence: |
        $f(x)$의 최솟값 $m(\theta)=\cos^2\theta+2\cos\theta-1$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2-1b-1
    - id: 2-1.A1
      mark_type: A
      points: 4
      evidence: |
        $m(\theta)=(\cos\theta+1)^2-2$의 최댓값 $2$를 구했다.
      depends_on:
      - 2-1.M1
      steps:
      - 2-1b-2
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (2) 방정식 $f(x)=0$이 실근을 갖게 하는 $\theta$의 최솟값을 $\alpha$, 최댓값을 $\beta$라고 할 때, $\sin^2\alpha+\sin^2\beta$의 값을 구하시오. [10점]
  points: 10
  depends_on:
  - 2-1
  answer:
    kind: expression
    value: 2*sqrt(2)-2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-2-B
    audience: B
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        판별식 $D/4=\sin^2\theta-2\cos\theta=1-\cos^2\theta-2\cos\theta\ge0$에서 $\cos^2\theta+2\cos\theta-1\le0$이므로 $-1-\sqrt2\le\cos\theta\le-1+\sqrt2$이다.
      source_flow: 문항카드 p.30
      criteria:
      - 2-2.M1
    - id: 2-2b-2
      content: |
        $0\le\theta\le\pi$에서 $-1\le\cos\theta\le1$이므로 $-1\le\cos\theta\le-1+\sqrt2$이다. 코사인 함수는 $0\le\theta\le\pi$에서 감소함수이므로 $\alpha$에서 최댓값, $\beta$에서 최솟값을 가진다. $\alpha\le\beta$이므로 $\cos\alpha=-1+\sqrt2$, $\cos\beta=-1$이다.
      source_flow: 문항카드 p.30
      criteria:
      - 2-2.M2
    - id: 2-2b-3
      content: |
        $\cos\alpha=-1+\sqrt2$에서 $\sin^2\alpha=1-\cos^2\alpha=2\sqrt2-2$, $\cos\beta=-1$에서 $\sin^2\beta=1-\cos^2\beta=0$이다. 따라서 $\sin^2\alpha+\sin^2\beta=2\sqrt2-2$이다.
      source_flow: 문항카드 p.30
      criteria:
      - 2-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 4
      evidence: |
        판별식 $D/4=\sin^2\theta-2\cos\theta\ge0$에서 $-1-\sqrt2\le\cos\theta\le-1+\sqrt2$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2-2b-1
    - id: 2-2.M2
      mark_type: M
      points: 4
      evidence: |
        $0\le\theta\le\pi$에서 $-1\le\cos\theta\le-1+\sqrt2$이고 $\cos\alpha=-1+\sqrt2$, $\cos\beta=-1$을 구했다.
      depends_on:
      - 2-2.M1
      implied_ok: false
      steps:
      - 2-2b-2
    - id: 2-2.A1
      mark_type: A
      points: 2
      evidence: |
        $\sin^2\alpha+\sin^2\beta=2\sqrt2-2$를 구했다.
      depends_on:
      - 2-2.M2
      steps:
      - 2-2b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [3] 수직선 위의 점 $\mathrm{P}$를 한 개의 주사위를 던져 $6$의 약수가 나올 때만 양의 방향으로 $2$만큼 이동시킨다. 한 개의 주사위를 연속으로 $450$번 던졌을 때, 점 $\mathrm{P}$의 좌표가 $580$ 이상 $640$ 이하에 있을 확률을 구하시오. (단, 점 $\mathrm{P}$의 처음 좌표는 $0$) [14점]
  points: 14
  depends_on: []
  answer:
    kind: value
    value: '0.8185'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        주사위를 $n$번 던져 $6$의 약수의 눈이 나오는 횟수를 확률변수 $K$라고 하면 $6$의 약수의 눈이 나올 확률은 $p=\dfrac23$이므로 $q=1-p=\dfrac13$이다. 확률변수 $K$는 이항분포 $\mathrm{B}(n,p)=\mathrm{B}\!\left(n,\dfrac23\right)$를 따르고 $\mathrm{E}(K)=np=\dfrac23n$, $\mathrm{V}(K)=\sigma^2=npq=\dfrac29n$이다.
      source_flow: 문항카드 p.30~31
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        주사위를 $450$번 던지는 경우 시행 횟수가 충분히 크므로 확률변수 $K$는 근사적으로 정규분포 $\mathrm{N}(np,npq)=\mathrm{N}(300,10^2)$을 따른다.
      source_flow: 문항카드 p.30~31
      criteria:
      - 3.B1
    - id: 3b-3
      content: |
        수직선 위 점 $\mathrm{P}$의 좌표를 확률변수 $X$라고 하면 $X=2K$이고 $\mathrm{E}(X)=\mathrm{E}(2K)=2\mathrm{E}(K)=2\times\dfrac23\times450=600$, $\mathrm{V}(X)=\mathrm{V}(2K)=2^2\mathrm{V}(K)=4\times\dfrac23\times\dfrac13\times450=20^2$이다. 따라서 확률변수 $X$는 정규분포 $\mathrm{N}(600,20^2)$을 따르고 확률변수 $Z=\dfrac{X-600}{20}$은 표준정규분포 $\mathrm{N}(0,1)$을 따른다.
      source_flow: 문항카드 p.30~31
      criteria:
      - 3.M2
      - 3.B2
    - id: 3b-4
      content: |
