stimuli:
- label: '1'
  body: |
    미분가능한 함수 $f(x)$에서 $f'(a)=0$이고, $x=a$의 좌우에서
    ① $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고, 극댓값은 $f(a)$이다.
    ② $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고, 극솟값은 $f(a)$이다.
- label: '2'
  body: |
    삼각형 $\mathrm{ABC}$에서
    $a^2=b^2+c^2-2bc\cos A$
    $b^2=c^2+a^2-2ca\cos B$
    $c^2=a^2+b^2-2ab\cos C$

    [그림: 삼각형 ABC. 꼭짓점 A, B, C와 마주 보는 변의 길이를 각각 $a$, $b$, $c$로 표시]
- label: '3'
  body: |
    $\displaystyle\lim_{x\to0}\dfrac{\sin x}{x}=1$ (단, $x$의 단위는 라디안)
stem: |
  [문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: '1'
  stem: |
    [1] 두 함수 $f(x)=3x^4-4x^3-6x^2-24x$, $g(x)=-x^2-2x+k$가 임의의 두 실수 $x_1,x_2$에 대하여 $f(x_1)\ge g(x_2)$를 만족시킬 때, 상수 $k$의 최댓값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-57'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$의 최솟값이 함수 $g(x)$의 최댓값보다 크거나 같아야 한다. $f'(x)=12(x^3-x^2-x-2)=12(x-2)(x^2+x+1)$이고 $x^2+x+1=\left(x+\dfrac12\right)^2+\dfrac34>0$이므로 $f(x)$는 $x=2$일 때 극솟값이면서 최소이고 최솟값은 $f(2)=-56$이다.
      source_flow: 문항카드 p.36
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $g(x)=-(x+1)^2+k+1$이므로 $g(x)$는 $x=-1$일 때 최댓값 $k+1$을 가진다.
      source_flow: 문항카드 p.36
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        그러므로 $-56\ge k+1$이고 $-57\ge k$이다. 따라서 상수 $k$의 최댓값은 $-57$이다.
      source_flow: 문항카드 p.36
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f(x)$가 $x=2$에서 최솟값 $-56$을 가짐을 보였다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $g(x)$가 $x=-1$에서 최댓값 $k+1$을 가짐을 보였다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $-56\ge k+1$로부터 상수 $k$의 최댓값 $-57$을 구했다.
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-1
  stem: |
    [2] 다음 그림과 같이 반지름의 길이가 $1$인 원 모양의 종이에서 중심각의 크기가 $\theta$인 부채꼴을 잘라내고 남은 부분으로 (밑면이 없는) 원뿔을 만들려고 한다. 다음 물음에 답하시오.

    [그림: 반지름 $1$인 원에서 중심각 $\theta$인 부채꼴(비어 있는 부분)을 잘라낸 도형이 원뿔로 말려, 밑면의 원 $C$와 지름의 양 끝점 $\mathrm{A}$, $\mathrm{A}'$, 모선의 길이 $1$이 표시된 모양]

    (1) 이 원뿔의 부피가 최대가 되기 위한 $\theta$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 2*pi*(1-sqrt(6)/3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-1-B
    audience: B
    method_no: 1
    steps:
    - id: 2-1b-1
      content: |
        원뿔을 만들었을 때 원 $C$의 반지름의 길이를 $x$, 원뿔의 높이를 $h$라고 하면 이 원뿔의 부피 $V(h)=\dfrac13\pi x^2h$이다. 피타고라스 정리로부터 $x^2=1-h^2$이므로 $V(h)=\dfrac13\pi(h-h^3)\ (0<h<1)$에서 $V'(h)=\dfrac\pi3(1-3h^2)=-\pi\left(h+\dfrac{\sqrt3}3\right)\left(h-\dfrac{\sqrt3}3\right)$이다.
      source_flow: 문항카드 p.36
      criteria:
      - 2-1.M1
      - 2-1.M2
    - id: 2-1b-2
      content: |
        $V'(h)=0$에서 $h=\dfrac{\sqrt3}3$일 때 $V$는 극대이고 또한 최대이다. $x^2=1-h^2\ (x>0)$에서 $x=\dfrac{\sqrt6}3$이다.
      source_flow: 문항카드 p.36
      criteria:
      - 2-1.M2
    - id: 2-1b-3
      content: |
        또한 호의 길이 공식으로부터 $2\pi x=2\pi-\theta$이다. 따라서 $\theta=2\pi\left(1-\dfrac{\sqrt6}3\right)$이다.
        (다른 풀이) 원 $C$의 둘레의 길이가 $2\pi-\theta$이므로 $x=\dfrac{2\pi-\theta}{2\pi}$, $h=\sqrt{1-\left(\dfrac{2\pi-\theta}{2\pi}\right)^2}=\dfrac{\sqrt{4\pi\theta-\theta^2}}{2\pi}$, $V=\dfrac13\pi x^2h=\dfrac\pi3\left(\dfrac{2\pi-\theta}{2\pi}\right)^2\dfrac{\sqrt{4\pi\theta-\theta^2}}{2\pi}\ (0<\theta<2\pi)$이다. $\dfrac{dV}{d\theta}=\dfrac1{24\pi^2}\left\{-2(2\pi-\theta)\sqrt{4\pi\theta-\theta^2}+\dfrac{(2\pi-\theta)^2(4\pi-2\theta)}{2\sqrt{4\pi\theta-\theta^2}}\right\}=\dfrac1{24\pi^2}\dfrac{(2\pi-\theta)}{2\sqrt{4\pi\theta-\theta^2}}(6\theta^2-24\pi\theta+8\pi^2)$이고 $\dfrac{dV}{d\theta}=0$에서 근의 공식을 쓰면 $\theta=2\pi\left(1\pm\dfrac{\sqrt6}3\right)$이다. $0<\theta<2\pi$이므로 $\theta=2\pi\left(1-\dfrac{\sqrt6}3\right)$이다.
      source_flow: 문항카드 p.36
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 3
      evidence: |
        원뿔의 부피를 $\theta$에 대한 함수 또는 원뿔의 높이 $h$에 대한 함수로 나타냈다.
      depends_on: []
      implied_ok: false
      steps:
      - 2-1b-1
    - id: 2-1.M2
      mark_type: M
      points: 3
      evidence: |
        부피의 도함수를 이용하여 극대점(최대가 되는 점)을 찾았다.
      depends_on:
      - 2-1.M1
      implied_ok: false
      steps:
      - 2-1b-1
      - 2-1b-2
    - id: 2-1.A1
      mark_type: A
      points: 4
      evidence: |
        $\theta=2\pi\left(1-\dfrac{\sqrt6}3\right)$를 구했다.
      depends_on:
      - 2-1.M1
      - 2-1.M2
      steps:
      - 2-1b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (2) (1)에서 만든 원뿔에 대하여 원 $C$의 지름 $\mathrm{AA}'$의 점 $\mathrm{A}$에서 출발하여 원뿔의 옆면을 따라 점 $\mathrm{A}'$에 이르는 최단 거리를 $l$이라고 할 때, $l^2$의 값을 구하시오. [10점]
  points: 10
  depends_on:
  - 2-1
  answer:
    kind: expression
    value: 2*(1-cos(sqrt(6)*pi/3))
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-2-B
    audience: B
    method_no: 1
    steps:
    - id: 2-2b-1
      content: |
        [그림: 전개도에서 중심각 $\beta$를 이루는 두 점 $\mathrm{A}$와 $\mathrm{A}'$, 최단 경로 $l$] 전개도에서 점 $\mathrm{A}$와 점 $\mathrm{A}'$이 원뿔의 지름이 되려면 다음 그림에서 $\beta=\beta_1+\beta_2$이므로 $\beta=\dfrac{2\pi-\theta}{2}=\dfrac{\sqrt6\pi}3$이다.
      source_flow: 문항카드 p.37
      criteria:
      - 2-2.M1
    - id: 2-2b-2
      content: |
        코사인법칙에 의하여 $l^2=\overline{\mathrm{AA}'}^2=1^2+1^2-2\cos\dfrac{\sqrt6\pi}3=2\left(1-\cos\dfrac{\sqrt6\pi}3\right)$이다.
      source_flow: 문항카드 p.37
      criteria:
      - 2-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
