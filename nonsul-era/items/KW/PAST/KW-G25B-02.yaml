intent: '[1] 도함수를 활용하여 최솟값과 최댓값을 구하고 두 함수의 값의 대소 조건을 해석하는 능력을 평가한다. [2] 도함수로 극댓값·극솟값을 구하는 능력과 코사인법칙을 활용하는 능력을 평가한다. [3] 수열이 수렴할 때 항 사이의 관계식으로 극한값을 구하는 능력, 식을 변형하여 삼각함수의 극한을 구하는 능력을 평가한다. (문항카드 출제 의도 요약)'
key_idea: 모든 $x_1,x_2$에 대해 $f(x_1)\ge g(x_2)$이면 $f$의 최솟값 $\ge$ $g$의 최댓값이다. 원뿔의 부피를 높이 $h$의 함수 $V(h)=\dfrac\pi3(h-h^3)$로 놓아 최대를 구하고, 옆면 위 최단거리는 전개도에서 코사인법칙으로 구한다. 접선의 $x$절편으로 점화식 $a_{n+1}=a_n-\dfrac12\sin2\!\left(a_n-\dfrac\pi2\right)$를 얻고 극한 $\alpha$는 $\sin2(\alpha-\pi/2)=0$에서 구한다.
