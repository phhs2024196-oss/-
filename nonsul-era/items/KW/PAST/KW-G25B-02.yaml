      mark_type: M
      points: 5
      evidence: |
        전개도에서 점 $\mathrm{A}$와 $\mathrm{A}'$의 관계를 올바르게 표시하고 사잇각 $\dfrac{\sqrt6\pi}3$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2-2b-1
    - id: 2-2.A1
      mark_type: A
      points: 5
      evidence: |
        코사인법칙을 사용하여 $l^2=2\left(1-\cos\dfrac{\sqrt6\pi}3\right)$를 구했다.
      depends_on:
      - 2-2.M1
      steps:
      - 2-2b-2
    deductions: []
