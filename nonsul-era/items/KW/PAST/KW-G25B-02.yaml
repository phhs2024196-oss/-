- id: 3-1
  stem: |
    [3] 함수 $f(x)=\tan\left(x-\dfrac\pi2\right)$에 대하여 점 $\mathrm{P}_1\left(\dfrac{2\pi}3,0\right)$을 지나고 $y$축과 평행한 직선이 곡선 $y=f(x)$와 만나는 점을 $\mathrm{Q}_1$, 곡선 $y=f(x)$ 위의 점 $\mathrm{Q}_1$에서의 접선이 $x$축과 만나는 점을 $\mathrm{P}_2$라고 하자. 점 $\mathrm{P}_2$를 지나고 $y$축과 평행한 직선이 곡선 $y=f(x)$와 만나는 점을 $\mathrm{Q}_2$, 곡선 $y=f(x)$ 위의 점 $\mathrm{Q}_2$에서의 접선이 $x$축과 만나는 점을 $\mathrm{P}_3$라고 하자. 이와 같은 과정을 한없이 반복할 때, 점 $\mathrm{P}_n$의 $x$좌표를 $a_n$이라고 하자. 다음 물음에 답하시오. (단, $n$은 자연수)

    (1) $\displaystyle\lim_{n\to\infty}a_n=\alpha$일 때, $\alpha$의 값을 구하시오. $\left(\text{단, }\dfrac\pi4<\alpha<\dfrac{3\pi}4\right)$ [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: pi/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-1-B
    audience: B
    method_no: 1
    steps:
    - id: 3-1b-1
      content: |
        $y=\tan\left(x-\dfrac\pi2\right)$이므로 $y'=\sec^2\left(x-\dfrac\pi2\right)$이다. 점 $\mathrm{P}_n$의 $x$좌표를 $a_n$으로 놓으면 두 점 $\mathrm{P}_n$, $\mathrm{Q}_n$의 좌표는 각각 $(a_n,0)$, $\left(a_n,\tan\left(a_n-\dfrac\pi2\right)\right)$이다. 이때 점 $\mathrm{Q}_n$에서의 접선의 기울기는 $y'=\sec^2\left(a_n-\dfrac\pi2\right)$이므로 점 $\mathrm{Q}_n$에서의 접선의 방정식은 $y-\tan\left(a_n-\dfrac\pi2\right)=\sec^2\left(a_n-\dfrac\pi2\right)(x-a_n)$이다.
      source_flow: 문항카드 p.37
      criteria:
      - 3-1.M1
    - id: 3-1b-2
      content: |
        이 접선과 $x$축과의 교점은 $\left(-\tan\left(a_n-\dfrac\pi2\right)\cos^2\left(a_n-\dfrac\pi2\right)+a_n,\,0\right)$이고 이 점이 $\mathrm{P}_{n+1}(a_{n+1},0)$이므로 $a_{n+1}=-\tan\left(a_n-\dfrac\pi2\right)\cos^2\left(a_n-\dfrac\pi2\right)+a_n=-\sin\left(a_n-\dfrac\pi2\right)\cos\left(a_n-\dfrac\pi2\right)+a_n=-\dfrac12\sin2\left(a_n-\dfrac\pi2\right)+a_n$이다.
      source_flow: 문항카드 p.37
      criteria:
      - 3-1.M1
      - 3-1.A1
    - id: 3-1b-3
      content: |
        이 식의 양변에 극한을 취하면 $\displaystyle\lim_{n\to\infty}a_n=\alpha$이므로 $\alpha=-\dfrac12\sin2\left(\alpha-\dfrac\pi2\right)+\alpha$이므로 $\sin2\left(\alpha-\dfrac\pi2\right)=0$이다. 이때 $\dfrac\pi4<\alpha<\dfrac{3\pi}4$이므로 $-\dfrac\pi2<2\left(\alpha-\dfrac\pi2\right)<\dfrac\pi2$이다. 따라서 $\alpha=\dfrac\pi2$이다.
      source_flow: 문항카드 p.37
      criteria:
      - 3-1.A2
