  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (2) 두 삼각형 중 한 삼각형을 고정하고 다른 삼각형을 $x$축의 양의 방향 또는 음의 방향으로 평행이동할 때, 두 삼각형이 겹치는 영역의 넓이의 최댓값을 구하시오. [14점]
  points: 14
  depends_on: []
  answer:
    kind: value
    value: 5/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        삼각형 $\mathrm{ABC}$를 고정하고, 삼각형 $\mathrm{A}^{\prime}\mathrm{B}^{\prime}\mathrm{C}^{\prime}$을 $x$축 방향으로 평행이동하여 영역의 넓이를 구한다. 점 $\mathrm{A}^{\prime}$의 좌표를 $\mathrm{A}^{\prime}(a,1)$이라 하면, 두 삼각형이 겹치는 경우는 $0<a<3$이므로 구간을 나누어 생각한다.
      source_flow: 예시 답안 p.7~8
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        (ⅰ) $0<a\le1$일 때 그림 (a)에서 평행사변형의 넓이 $S=a\times2\le2$.
        (ⅱ) $1<a\le2$일 때 그림 (b)에서 겹치는 영역의 넓이 $S$는 점 $\mathrm{A}$와 점 $\mathrm{A}^{\prime}$을 대각선 양 끝점으로 하는 평행사변형의 넓이에서 양쪽 모서리 삼각형의 넓이를 뺀 것이므로
        $$S=(a\times2)-2\times\left\{\frac12\times(a-1)\times2\times(a-1)\right\}=-2a^2+6a-2.$$
        (ⅲ) $2<a<3$일 때 그림 (c)에서 직사각형의 넓이 $S=(3-a)\times2\le2$.
      source_flow: 예시 답안 p.7~8
      criteria:
      - 2-2.M2
    - id: 22b-3
      content: |
        (ⅱ)에서 $S^{\prime}=-4a+6=0$에서 $a=\dfrac32$이고, 이때 최댓값은 $S\left(\dfrac32\right)=-2\times\left(\dfrac32\right)^2+6\times\dfrac32-2=\dfrac52$이다. (참고: $S=-2\left(a-\dfrac32\right)^2+\dfrac52$) (ⅰ),(ⅱ),(ⅲ)으로부터 두 삼각형이 겹치는 영역의 넓이의 최댓값은 $\dfrac52$이다. (참고: 삼각형 $\mathrm{A}^{\prime}\mathrm{B}^{\prime}\mathrm{C}^{\prime}$을 고정하고 삼각형 $\mathrm{ABC}$를 평행이동하여 같은 방법으로 구할 수 있다.)
      source_flow: 예시 답안 p.7~8
      criteria:
      - 2-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
