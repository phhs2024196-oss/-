intent: |
  [1] 집합의 정의를 이해하고 원소의 개수와 집합의 포함관계를 적용할 수 있는 능력을 평가한다. 또한 이항정리를 적용하여 조건에 맞는 부분집합의 개수를 구하는 능력을 평가한다. [2] (1) 점의 대칭이동과 주어진 도형의 넓이를 구하는 능력을 평가한다. (2) 도형의 평행이동과 위치관계를 이해하고 주어진 조건을 이용하여 원하는 도형의 넓이를 수식으로 정확하게 구성하는 능력을 평가한다. [3] (1) 정적분의 개념을 이해하고 구간에 따른 정적분을 계산하는 능력을 평가한다. (2) 도함수를 활용하여 주어진 함수의 최솟값을 구하는 능력을 평가한다. (문항카드 원문)
key_idea: |
  [1]은 $n(B)=k$로 나누어 ${}_6\mathrm{C}_k(2^k-1)$을 이항정리로 합산한다. [2]는 평행이동 거리에 따라 겹침 모양이 달라지는 구간을 나눈다. [3]은 $x^3+k$의 근이 $[0,1]$ 안에 드는지로 절댓값을 벗겨 구간별 함수를 만든 뒤 극소를 찾는다.
stuck: |
  [2](2)에서 평행이동 거리 $a$에 따라 겹치는 영역이 세 모양으로 바뀌는 구간을 나누고 가운데 구간의 넓이를 평행사변형에서 두 모서리 삼각형을 빼 식으로 세우는 단계
