        대칭이동한 세 점 $\mathrm{A}^{\prime}(1,1)$, $\mathrm{B}^{\prime}(-1,1)$, $\mathrm{C}^{\prime}(-1,-3)$을 구했다.
      steps:
      - 21b-1
    - id: 2-1.A1
      mark_type: A
      points: 2
      evidence: 겹치는 영역의 넓이 $2$를 구했다.
      depends_on:
