- id: 2-1
  stem: |
    [2] 세 점 $\mathrm{A}(-1,-1)$, $\mathrm{B}(1,-1)$, $\mathrm{C}(1,3)$을 꼭짓점으로 하는 삼각형 $\mathrm{ABC}$와 이 삼각형을 원점에 대하여 대칭이동한 삼각형 $\mathrm{A}^{\prime}\mathrm{B}^{\prime}\mathrm{C}^{\prime}$에 대하여 다음 물음에 답하시오.

    (1) 두 삼각형이 겹치는 영역의 넓이를 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
