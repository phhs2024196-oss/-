    - id: 31b-3
      content: |
        따라서 $S(k)=\begin{cases}-k-\dfrac14&(k\le-1)\\ \dfrac32k\sqrt[3]{k}+k+\dfrac14&(-1<k<0)\\ k+\dfrac14&(k\ge0)\end{cases}$이다.
