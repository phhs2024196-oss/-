  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        원점을 중심으로 대칭이동한 세 점은 $\mathrm{A}^{\prime}(1,1)$, $\mathrm{B}^{\prime}(-1,1)$, $\mathrm{C}^{\prime}(-1,-3)$이다.
      source_flow: 예시 답안 p.7
