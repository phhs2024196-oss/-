stimuli:
- label: '1'
  body: |
    집합 $A$가 유한집합일 때, 집합 $A$의 원소의 개수를 기호로
    $$n(A)$$
    와 같이 나타낸다. 특히 $n(\varnothing)=0$이다.
- label: '2'
  body: |
    $n$이 자연수일 때,
    $$(a+b)^n={}_n\mathrm{C}_0a^n+{}_n\mathrm{C}_1a^{n-1}b+\cdots+{}_n\mathrm{C}_ra^{n-r}b^r+\cdots+{}_n\mathrm{C}_nb^n$$
- label: '3'
  body: 점 $(a,b)$를 원점에 대하여 대칭이동한 점의 좌표는 $(-a,-b)$
- label: '4'
  body: |
    미분가능한 함수 $f(x)$에서 $f^{\prime}(a)=0$이고, $x=a$의 좌우에서
    ① $f^{\prime}(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고, 극댓값은 $f(a)$이다.
    ② $f^{\prime}(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고, 극솟값은 $f(a)$이다.
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: '1'
  stem: |
    [1] 전체집합 $U=\{1,2,3,4,5,6\}$의 두 부분집합 $A,B$가 다음 조건을 만족시키는 경우의 수를 구하시오. [10점]

    (가) $n(A)\times n(B)\ne0$
    (나) $n(B)<n(U)$
    (다) $A\subset B$
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '602'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)와 (나)에 의하여 부분집합 $B$는 공집합과 전체집합을 포함하지 않는다. $n(B)=k\,(1\le k\le5)$일 때, 가능한 집합 $B$의 개수는 ${}_6\mathrm{C}_k$이고, 그 각각에 대하여 집합 $A$의 개수는 조건 (가)와 (다)에 의하여 공집합을 제외한 $2^k-1$이다.
      source_flow: 예시 답안 p.5~6
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b-2
      content: |
        따라서 세 조건을 만족시키는 경우의 수는
        $${}_6\mathrm{C}_1\times(2^1-1)+{}_6\mathrm{C}_2\times(2^2-1)+\cdots+{}_6\mathrm{C}_5\times(2^5-1)=({}_6\mathrm{C}_1\times2^1+{}_6\mathrm{C}_2\times2^2+\cdots+{}_6\mathrm{C}_5\times2^5)-({}_6\mathrm{C}_1+{}_6\mathrm{C}_2+\cdots+{}_6\mathrm{C}_5)$$
      source_flow: 예시 답안 p.5~6
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        이항정리를 이용하면 ${}_6\mathrm{C}_1\times2^1+\cdots+{}_6\mathrm{C}_5\times2^5=(1+2)^6-(1+64)=664$이고 ${}_6\mathrm{C}_1+\cdots+{}_6\mathrm{C}_5=(1+1)^6-(1+1)=62$이다. 따라서 구하는 경우의 수는 $664-62=602$이다.
        (다른 풀이) $n(B)=1,2,3,4,5$일 때 $B$의 개수는 $6,15,20,15,6$이고 $A$의 개수는 $1,3,7,15,31$이므로 $6\times1+15\times3+20\times7+15\times15+6\times31=602$.
      source_flow: 예시 답안 p.5~6
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
