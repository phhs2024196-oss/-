      depends_on:
      - 2-2.M1
      steps:
      - 22b-2
    - id: 2-2.A1
      mark_type: A
      points: 4
      evidence: 겹치는 영역의 최댓값 $\dfrac52$를 구했다(도함수 또는 완전제곱 형태 계산 모두 인정).
      depends_on:
      - 2-2.M1
      - 2-2.M2
      steps:
      - 22b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-1
  stem: |
    [3] 실수 $k$에 대하여 $S(k)=\displaystyle\int_0^1\lvert x^3+k\rvert dx$라 할 때, 다음 물음에 답하시오.

    (1) 함수 $S(k)$를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: low=-k-1/4; mid=3*k*cbrt(k)/2+k+1/4; high=k+1/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $y=x^3+k$의 $x$절편은 $x=\sqrt[3]{-k}=-\sqrt[3]{k}$이므로 $x=-\sqrt[3]{k}$가 적분구간 $[0,1]$에 속하는 경우와 속하지 않는 경우로 나누어 $S(k)$를 구한다.
      source_flow: 예시 답안 p.8
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        (ⅰ) $-\sqrt[3]{k}\le0$에서 $k\ge0$일 때 $S(k)=\displaystyle\int_0^1(x^3+k)dx=\left[\frac14x^4+kx\right]_0^1=k+\frac14$.
        (ⅱ) $0<-\sqrt[3]{k}<1$에서 $-1<k<0$일 때
        $$S(k)=\int_0^{-\sqrt[3]{k}}(-x^3-k)dx+\int_{-\sqrt[3]{k}}^1(x^3+k)dx=\left[-\frac14x^4-kx\right]_0^{-\sqrt[3]{k}}+\left[\frac14x^4+kx\right]_{-\sqrt[3]{k}}^1=\frac32k\sqrt[3]{k}+k+\frac14.$$
        (ⅲ) $-\sqrt[3]{k}\ge1$에서 $k\le-1$일 때 $S(k)=\displaystyle\int_0^1(-x^3-k)dx=\left[-\frac14x^4-kx\right]_0^1=-k-\frac14$.
      source_flow: 예시 답안 p.8
