intent: |
  [1] (1) 코사인함수의 덧셈정리를 증명하기 위하여 제시문에 주어진 코사인법칙을 주어진 그림 속의 삼각형에 적용하고, 이를 토대로 명확한 논리적 추론과 계산력으로 문제를 해결할 수 있는지를 평가한다. (2) 삼각함수의 미분법을 얻기 위해서 미분의 정의를 삼각함수에 적용하고 앞에서 증명한 수학적 사실을 적절하게 적용할 수 있는 능력을 평가한다. [2] 복소수의 사칙연산에 관한 계산력을 평가한다. 복소수가 실수가 되기 위한 조건을 이해하고 있는지를 알아보고자 한다. 로그의 뜻을 이해하고 문제에 적용할 수 있는 능력을 평가한다. [3] (1) 문제의 진술을 토대로 원, 직선과 점의 기하학적인 위치 관계를 제대로 파악하고 있는지를 평가한다. 이를 토대로 요구되는 삼각형의 넓이를 식으로 구성할 수 있는 능력을 평가한다. (2) 미분을 사용하여 함수의 증가와 감소를 판정할 수 있는 계산력과 개념의 이해력을 평가한다. 이를 토대로 함수의 증가와 감소에 대해 종합적인 표로 나타낼 수 있는 표현력과 구성 능력도 평가한다. (문항카드 원문, 원문의 소문항 표기 [4]는 [3]을 가리킴)
key_idea: |
  [1]은 단위원 위 두 점 사이의 거리를 코사인법칙과 거리 공식 두 가지로 써서 $\cos(\alpha-\beta)$를 얻고, 덧셈정리를 미분의 정의에 넣어 $\lim\frac{\cos h-1}{h}=0$을 보인다. [2]는 $(1\pm i)^8=2^4$로 지수를 줄여 $z=2^{1012}(1+i-2ai)$를 얻는다. [3]은 원의 중심과 직선 사이 거리로 현 $\mathrm{OP}$를 구해 넓이를 세우고 절댓값 안 함수의 극값을 본다.
stuck: |
  [1](2)에서 $\frac{\cos h-1}{h}$의 극한이 $0$임을 $\frac{\cos^2h-1}{h(\cos h+1)}$로 바꿔 $\sin h/h$ 극한으로 연결하는 단계, [3](1)에서 현 $\mathrm{OP}$의 길이를 중심-직선 거리와 피타고라스 정리로 구하는 단계
