- id: 3-1
  stem: |
    [3] 직선 $y=ax$와 원 $(x-1)^2+(y+1)^2=2$는 원점과 원점이 아닌 점 $\mathrm{P}$에서 만난다. 점 $\mathrm{Q}\left(-\dfrac12,\dfrac72\right)$에 대하여 다음 물음에 답하시오. (단, $a$는 $-7$과 $1$이 아닌 실수)

    (1) 삼각형 $\mathrm{OPQ}$의 넓이를 $f(a)$라 할 때, 함수 $f(a)$를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: abs((a-1)*(a+7))/(2*(a**2+1))
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        삼각형 $\mathrm{OPQ}$의 넓이 $=\dfrac12\times\overline{\mathrm{OP}}\times$(점 $\mathrm{Q}$와 직선 $y=ax$와의 거리) ······ ①. 원의 중심 $(1,-1)$과 직선 $y=ax$와의 거리는 $\dfrac{\lvert a+1\rvert}{\sqrt{a^2+1}}$이므로 피타고라스 정리를 이용하여 $\overline{\mathrm{OP}}=2\sqrt{2-\dfrac{(a+1)^2}{a^2+1}}=\dfrac{2\lvert a-1\rvert}{\sqrt{a^2+1}}$ ······ ②. (참고: 직선 $y=ax$와 원 $(x-1)^2+(y+1)^2=2$의 교점을 구하여 $\overline{\mathrm{OP}}$의 거리를 구해도 됨)
      source_flow: 예시 답안 p.16
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        점 $\mathrm{Q}\left(-\dfrac12,\dfrac72\right)$와 직선 $y=ax$와의 거리는 $\dfrac{\lvert a+7\rvert}{2\sqrt{a^2+1}}$ ······ ③.
      source_flow: 예시 답안 p.16
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        ②와 ③을 ①에 대입하면 삼각형 $\mathrm{OPQ}$의 넓이, 즉 $f(a)=\dfrac{\lvert(a-1)(a+7)\rvert}{2(a^2+1)}$ (단, $a\ne1,-7$)을 얻는다. (다른 풀이: $\overline{\mathrm{OQ}}=\dfrac{5\sqrt2}2$, $\mathrm{P}\left(\dfrac{-2(a-1)}{a^2+1},\dfrac{-2a(a-1)}{a^2+1}\right)$와 직선 $y=-7x$ 사이의 거리 $\dfrac{2\lvert(a-1)(a+7)\rvert}{5\sqrt2(a^2+1)}$로도 같은 결과)
      source_flow: 예시 답안 p.16
      criteria:
      - 3-1.A1
