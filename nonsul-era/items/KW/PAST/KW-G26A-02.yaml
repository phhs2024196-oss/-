  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $(\cos x)^{\prime}=\displaystyle\lim_{h\to0}\frac{\cos(x+h)-\cos x}{h}$이다.
      source_flow: 예시 답안 p.15
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $=\displaystyle\lim_{h\to0}\frac{\cos x\cos h-\sin x\sin h-\cos x}{h}=\cos x\lim_{h\to0}\frac{\cos h-1}{h}-\sin x\times\lim_{h\to0}\frac{\sin h}{h}$.
      source_flow: 예시 답안 p.15
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        제시문에서 $\displaystyle\lim_{h\to0}\frac{\sin h}{h}=1$이므로 $\displaystyle\lim_{h\to0}\frac{\cos h-1}{h}=\lim_{h\to0}\frac{\cos^2h-1}{h(\cos h+1)}=-\lim_{h\to0}\frac{\sin^2h}{h^2}\times\lim_{h\to0}\frac{h}{\cos h+1}=0$. 따라서 $(\cos x)^{\prime}=-\sin x$이다.
      source_flow: 예시 답안 p.15
      criteria:
      - 1-2.R1
