- id: '2'
  stem: |
    [2] 실수 $a$와 자연수 $b$에 대하여 $z=(1+i)^{2025}+a(i-1)^{2026}$이 실수가 되게 하는 $a$의 값을 구하고, 그때의 $z$에 대하여 $\log_bz$가 자연수가 되게 하는 $b$의 개수를 구하시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: a=1/2; count=12
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $z=(1+i)^{2025}+a(1-i)^{2026}$에서 $\alpha=1+i$, $\beta=1-i$라 하면 $\alpha,\beta$는 $x^2-2x+2=0$의 두 근이다. $x^4=(2x-2)^2=2^2(x^2-2x+1)=-2^2$이므로 $x^8=2^4$이다. (참고: $(1+i)^8=(i-1)^8=2^4$을 직접 계산해도 됨)
        $(1+i)^{2025}=\alpha^{8\times253+1}=2^{1012}\alpha=2^{1012}(1+i)$, $(1-i)^{2026}=\beta^{8\times253+2}=2^{1012}\beta^2=2^{1012}(-2i)$이다. 이로부터 $z=2^{1012}(1+i-2ai)$이다.
      source_flow: 예시 답안 p.15
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $z$가 실수가 되게 하는 $a$는 $\dfrac12$이며 그때 $z=2^{1012}=2^{2^2\times11\times23}$이다.
      source_flow: 예시 답안 p.15
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        $\log_b2^{2^2\times11\times23}=p$로 놓으면 $\log_bz=p\iff b=2^{\frac{2^2\times11\times23}{p}}$이다. $b$가 자연수이면서 $p$도 자연수가 되려면 $p$는 $2^2\times11\times23(=1012)$의 약수이면 된다. $b$의 개수는 $2^2\times11\times23$의 약수의 개수와 같다. (참고: $2^2$의 약수 $1,2,2^2$, $11$의 약수 $1,11$, $23$의 약수 $1,23$을 이용) 따라서 $b$의 개수는 $3\times2\times2=12$개이다.
      source_flow: 예시 답안 p.15
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: $z=2^{1012}(1+i-2ai)$를 구했다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $a=\dfrac12$을 구하고 $z=2^{1012}=2^{2^2\times11\times23}$을 보였다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: |
        두 자연수의 관계 $b=2^{\frac{2^2\times11\times23}{p}}$을 보이고 $b$의 개수 $3\times2\times2=12$개를 구했다.
      depends_on:
      - 2.M1
      - 2.A1
      steps:
      - 2b-3
