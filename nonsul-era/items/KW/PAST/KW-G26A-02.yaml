    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $g(a)=\dfrac{(a-1)(a+7)}{2(a^2+1)}$이라 하면 $g^{\prime}(a)=\dfrac{(2a+6)(a^2+1)-(a^2+6a-7)2a}{2(a^2+1)^2}=\dfrac{-(3a+1)(a-3)}{(a^2+1)^2}$이다.
      source_flow: 예시 답안 p.16~17
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        $f(a)=\lvert g(a)\rvert$이므로 $a=-\dfrac13$에서 $g(a)$는 극소이며 $f(a)$는 극대이고 극댓값은 $4$, $a=3$에서 $g(a)$와 $f(a)$는 극대이고 극댓값은 $1$이다.
      source_flow: 예시 답안 p.16~17
      criteria:
      - 3-2.A1
    - id: 32b-3
      content: |
        함수 $f(a)$의 증가와 감소를 표로 나타내면 다음과 같다.
        $a<-7$에서 $f^{\prime}(a)<0$(감소), $-7<a<-\dfrac13$에서 $f^{\prime}(a)>0$(증가), $a=-\dfrac13$에서 $f^{\prime}(a)=0$이고 극댓값 $4$, $-\dfrac13<a<1$에서 $f^{\prime}(a)<0$(감소), $1<a<3$에서 $f^{\prime}(a)>0$(증가), $a=3$에서 $f^{\prime}(a)=0$이고 극댓값 $1$, $a>3$에서 $f^{\prime}(a)<0$(감소). ($a=-7,1$은 정의되지 않음)
      source_flow: 예시 답안 p.16~17
      criteria:
      - 3-2.A2
