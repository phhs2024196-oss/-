stimuli:
- label: '1'
  body: |
    삼각형 $\mathrm{ABC}$에서
    $$a^2=b^2+c^2-2bc\cos A$$
    $$b^2=c^2+a^2-2ca\cos B$$
    $$c^2=a^2+b^2-2ab\cos C$$
    [그림: 삼각형 ABC. 꼭짓점 A가 위, B가 왼쪽 아래, C가 오른쪽 아래이고 변 BC=a, CA=b, AB=c로 표시되어 있으며 삼각형 주위에 점선 호가 그려져 있다]
- label: '2'
  body: $\displaystyle\lim_{x\to0}\frac{\sin x}{x}=1$ (단, $x$의 단위는 라디안)
- label: '3'
  body: |
    좌표평면 위의 점 $\mathrm{P}(x_1,y_1)$과 직선 $ax+by+c=0$ 사이의 거리 $d$는
    $$d=\frac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$$
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 오른쪽 그림과 같이 두 각 $\alpha,\beta$를 나타내는 동경이 단위원과 만나는 점을 각각 $\mathrm{P}(\cos\alpha,\sin\alpha)$, $\mathrm{Q}(\cos\beta,\sin\beta)$라 하자. 다음 물음에 답하시오.

    [그림: 원점 O를 중심으로 하는 단위원. 제2사분면 쪽의 점 P와 제1사분면 쪽의 점 Q가 있고, x축의 양의 방향에서 OP까지의 각이 $\alpha$, OQ까지의 각이 $\beta$로 표시되어 있으며 선분 OP, OQ, PQ가 그려져 있다]

    (1) 코사인함수의 덧셈정리 $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$를 증명하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: proof
    value: cos(a+b)=cos(a)cos(b)-sin(a)sin(b) 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        삼각형 $\mathrm{POQ}$에서 코사인법칙에 의하여 $\overline{\mathrm{PQ}}^2=\overline{\mathrm{OP}}^2+\overline{\mathrm{OQ}}^2-2\times\overline{\mathrm{OP}}\times\overline{\mathrm{OQ}}\times\cos(\angle\mathrm{POQ})$이고 $\overline{\mathrm{OP}}=\overline{\mathrm{OQ}}=1$, $\angle\mathrm{POQ}=\alpha-\beta$이므로 $\overline{\mathrm{PQ}}^2=1+1-2\times1\times1\times\cos(\alpha-\beta)=2-2\cos(\alpha-\beta)$이다.
      source_flow: 예시 답안 p.14~15
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        또, 좌표평면 위의 두 점 사이의 거리 공식에 의하여 $\overline{\mathrm{PQ}}^2=(\cos\beta-\cos\alpha)^2+(\sin\beta-\sin\alpha)^2=2-2(\cos\alpha\cos\beta+\sin\alpha\sin\beta)$이다.
      source_flow: 예시 답안 p.14~15
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        이므로 $2-2\cos(\alpha-\beta)=2-2(\cos\alpha\cos\beta+\sin\alpha\sin\beta)$이다. 이 식을 정리하면 $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$ ······ ①이 성립한다.
      source_flow: 예시 답안 p.14~15
      criteria:
      - 1-1.A1
    - id: 11b-4
      content: |
        ①에 $\beta$ 대신 $-\beta$를 대입하여 정리하면 $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$이다.
      source_flow: 예시 답안 p.14~15
      criteria:
      - 1-1.A2
