intent: |
  [1] $\sum$의 의미를 이해하고 기본적인 수열의 첫째항부터 제 $n$항까지의 합을 구할 수 있는지 평가한다. [2] 이차함수의 그래프와 직선의 위치 관계를 이해하고 활용할 수 있는지 평가한다. [3] 조합의 의미를 이해하고 조합의 수를 구할 수 있는지 평가한다. [4] 표본평균과 모평균의 관계를 활용하여 간단한 부등식 문제를 풀 수 있는지 평가한다. (문항카드 원문, 일부 오탈자 정리)
key_idea: |
  [1]은 이중합을 $\sum_{m=1}^{9}\left(\sum_{k=1}^{10}k^2-\sum_{k=1}^{m-1}k^2\right)$로 풀어 쓴다. [2]는 $k$의 항등식으로 정점을, 직선 $y=x+2$를 뺀 이차함수 $h$의 양 끝값·판별식·축의 위치로 선분과의 두 교점 조건을 모은다. [3]은 $l$, $m$에서 쓰는 점의 수로 분류한다. [4]는 표본평균을 표준화한다.
stuck: |
  [2](2)에서 선분 $\mathrm{AB}$와 서로 다른 두 점에서 만나는 조건을 $h(-1)\ge0$, $h(3)\ge0$, $D>0$, $-1<$ 축 $<3$ 네 조건으로 바꾸는 단계, [3]에서 한 점에서 여러 선분이 나갈 수 있는 경우까지 빠짐없이 분류하는 단계
