      content: |
        모집단이 정규분포 $\mathrm{N}(150,5^2)$을 따르고 표본의 크기가 $100$이므로 표본평균 $\overline{X}$는 정규분포 $\mathrm{N}\left(150,\dfrac{5^2}{100}\right)$, 즉 $\mathrm{N}\left(150,\left(\dfrac12\right)^2\right)$을 따른다. 이때 $Z=\dfrac{\overline{X}-150}{1/2}$로 나타내면 $Z$는 정규분포 $\mathrm{N}(0,1^2)$을 따른다.
