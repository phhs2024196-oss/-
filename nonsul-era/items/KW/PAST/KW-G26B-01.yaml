      evidence: $-\dfrac{13}{7}\le k<-\dfrac{\sqrt3}2$를 얻었다.
      depends_on:
      - 2-2.M1
      - 2-2.M2
      - 2-2.M3
      steps:
      - 22b-5
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [3] 평행한 두 직선 $l$과 $m$ 위에 각각 5개의 점과 7개의 점이 그림 (a)와 같이 놓여 있다. 직선 $l$ 위의 점과 직선 $m$ 위의 점을 연결하여 서로 다른 세 개의 선분을 그을 때, 선분이 교차하지 않는 경우의 수를 구하시오. (단, 선분의 시작점이나 끝점에서 두 선분이 만나는 경우는 교차하지 않는 것으로 본다. 예를 들어 그림 (b)는 교차하지 않는 경우이고 그림 (c)는 교차하는 경우이다.) [12점]

    [그림: 평행한 두 직선 $l$(위)과 $m$(아래). $l$ 위에 점 5개, $m$ 위에 점 7개가 같은 간격으로 찍혀 있고 연결한 선분은 없다]
    그림 (a)
    [그림: 같은 점 배치. 선분 3개: $l$의 첫째 점-$m$의 첫째 점, $l$의 둘째 점-$m$의 첫째 점, $l$의 넷째 점-$m$의 다섯째 점. 서로 교차하지 않는다]
    그림 (b)
    [그림: 같은 점 배치. 선분 3개: $l$의 첫째 점-$m$의 다섯째 점, $l$의 둘째 점-$m$의 셋째 점, $l$의 넷째 점-$m$의 다섯째 점. 첫째 점-다섯째 점 선분과 둘째 점-셋째 점 선분이 교차한다]
    그림 (c)
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '2135'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        선분 세 개가 서로 다른 선분이면서 교차하지 않는 경우를 $l$ 위에서 고른 점의 개수와 $m$ 위에서 고른 점의 개수에 따라 분류한다. (ⅰ) $l$에서 서로 다른 3개, $m$에서 서로 다른 3개: ${}_5\mathrm{C}_3\times{}_7\mathrm{C}_3=350$. (ⅱ) $l$에서 3개, $m$에서 2개: ${}_5\mathrm{C}_3\times{}_7\mathrm{C}_2\times2=420$. (ⅲ) $l$에서 3개, $m$에서 1개: ${}_5\mathrm{C}_3\times{}_7\mathrm{C}_1=70$. (ⅳ) $l$에서 2개, $m$에서 3개: ${}_5\mathrm{C}_2\times{}_7\mathrm{C}_3\times2=700$. (ⅴ) $l$에서 2개, $m$에서 2개: ${}_5\mathrm{C}_2\times{}_7\mathrm{C}_2\times2=420$. (ⅵ) $l$에서 1개, $m$에서 3개: ${}_5\mathrm{C}_1\times{}_7\mathrm{C}_3=175$.
      source_flow: 예시 답안 p.5~6
      criteria:
      - 3.M1
      - 3.M2
    - id: 3b-2
      content: |
        $\therefore350+420+70+700+420+175=2135$.
