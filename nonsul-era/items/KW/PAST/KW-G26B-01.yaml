  stem: |
    [4] K회사에서 생산하는 향수에 들어 있는 천연 성분의 무게는 평균 $150$㎎, 표준편차 $5$㎎인 정규분포를 따른다고 한다. 이 회사에서 생산한 향수 중에서 임의 추출한 $100$개의 향수에 들어 있는 천연 성분의 무게의 평균을 $\overline{X}$라 할 때, $\mathrm{P}(\overline{X}\ge300-5k)\le0.98$을 만족시키는 자연수 $k$의 최댓값을 구하시오. (단, $\mathrm{P}(-2.05\le Z\le2.05)=0.96$) [10점]
