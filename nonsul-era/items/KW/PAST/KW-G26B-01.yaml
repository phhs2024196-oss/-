stimuli:
- label: '1'
  body: |
    ① $\displaystyle\sum_{k=1}^{n}k=\frac{n(n+1)}{2}$
    ② $\displaystyle\sum_{k=1}^{n}k^2=\frac{n(n+1)(2n+1)}{6}$
    ③ $\displaystyle\sum_{k=1}^{n}k^3=\left\{\frac{n(n+1)}{2}\right\}^2$
- label: '2'
  body: |
    이차함수 $y=ax^2+bx+c$의 그래프와 직선 $y=mx+n$의 교점의 $x$좌표는 이차방정식
    $ax^2+bx+c=mx+n$, 즉 $ax^2+(b-m)x+c-n=0$의 실근과 같다.
- label: '3'
  body: |
    모집단이 정규분포 $\mathrm{N}(m,\sigma^2)$을 따르는 경우, 크기가 $n$인 표본을 임의 추출하면 표본평균 $\overline{X}$는 정규분포 $\mathrm{N}\left(m,\dfrac{\sigma^2}{n}\right)$을 따른다.
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: '1'
  stem: |
    [1] $\displaystyle\sum_{k=1}^{10}k^2+\sum_{k=2}^{10}k^2+\sum_{k=3}^{10}k^2+\cdots+\sum_{k=9}^{10}k^2$의 값을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '2925'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\sum_{k=m}^{10}k^2=\sum_{k=1}^{10}k^2-\sum_{k=1}^{m-1}k^2$이므로
        $$\sum_{k=1}^{10}k^2+\sum_{k=2}^{10}k^2+\cdots+\sum_{k=9}^{10}k^2=\sum_{m=1}^{9}\left(\sum_{k=m}^{10}k^2\right)=\sum_{m=1}^{9}\left(\sum_{k=1}^{10}k^2-\sum_{k=1}^{m-1}k^2\right)=\sum_{m=1}^{9}\left\{\frac{10\times11\times21}{6}-\frac{(m-1)m(2m-1)}{6}\right\}.$$
      source_flow: 예시 답안 p.4~5
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $=\displaystyle\sum_{m=1}^{9}\frac{2310-2m^3+3m^2-m}{6}=\frac16\left\{2310\times9-2\times\left(\frac{9\times10}{2}\right)^2+3\times\frac{9\times10\times19}{6}-\frac{9\times10}{2}\right\}=2925$.
        (다른 풀이) $1^2+2^2+\cdots+9^2+10^2$, $2^2+\cdots+10^2$, …, $9^2+10^2$, $10^2$를 세로로 더하면 $1^2+2\cdot2^2+3\cdot3^2+\cdots+9\cdot9^2+10\cdot10^2$ 꼴로 $\displaystyle\sum_{k=1}^{9}k^3+900=\left(\frac{9\times10}{2}\right)^2+900=2925$.
      source_flow: 예시 답안 p.4~5
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\displaystyle\sum_{k=m}^{10}k^2=\sum_{k=1}^{10}k^2-\sum_{k=1}^{m-1}k^2$를 활용하거나 계산의 상당 부분을 올바르게 계산했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 정답 $2925$를 얻었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-1
  stem: |
    [2] $x$에 대한 이차함수 $f(x)=x^2+2(k+1)x+k+3$에 대하여 다음 물음에 답하시오.

    (1) 실수 $k$값에 관계없이 이차함수 $y=f(x)$의 그래프가 지나는 점의 좌표를 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: x=-1/2; y=9/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: $y=f(x)=x^2+2(k+1)x+k+3$을 $k$에 대하여 정리하면 $(2x+1)k+x^2+2x+3-y=0$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        $k$의 값에 관계없이 성립하려면 $2x+1=0$에서 $x=-\dfrac12$, $x^2+2x+3-y=0$에서 $y=\dfrac94$이다. 따라서 $\left(-\dfrac12,\dfrac94\right)$.
      source_flow: 예시 답안 p.5
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 3
      evidence: 주어진 식을 $k$에 대해 정리하여 $(2x+1)k+x^2+2x+3-y=0$을 얻었다.
      steps:
      - 21b-1
    - id: 2-1.A1
      mark_type: A
      points: 5
      evidence: 정답 $\left(-\dfrac12,\dfrac94\right)$을 올바르게 구했다.
      depends_on:
      - 2-1.M1
      steps:
      - 21b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (2) 이차함수 $y=f(x)$의 그래프가 두 점 $\mathrm{A}(-1,1)$, $\mathrm{B}(3,5)$를 잇는 선분 $\mathrm{AB}$와 서로 다른 두 점에서 만나도록 하는 실수 $k$값의 범위를 구하시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: -13/7 <= k < -sqrt(3)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        두 점 $\mathrm{A},\mathrm{B}$를 지나는 직선의 방정식은 $y=x+2$이다. $g(x)=x+2$, $h(x)=f(x)-g(x)$라 하자. $f(x)$의 그래프가 선분 $\mathrm{AB}$와 서로 다른 두 점에서 만나려면 이차함수 $h(x)=x^2+(2k+1)x+k+1$의 그래프가 $x$축과 구간 $[-1,3]$에서 서로 다른 두 점에서 만나는 개형이어야 한다(그림: 아래로 볼록한 $h(x)$의 그래프가 구간 $[-1,3]$에서 $x$축과 서로 다른 두 점에서 만나는 개형).
      source_flow: 예시 답안 p.5
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        (ⅰ) $h(-1)\ge0$에서 $-k+1\ge0$, $\therefore k\le1$. (ⅱ) $h(3)\ge0$에서 $7k+13\ge0$, $\therefore k\ge-\dfrac{13}{7}$.
      source_flow: 예시 답안 p.5
      criteria:
      - 2-2.M1
    - id: 22b-3
      content: |
        (ⅲ) 이차방정식 $h(x)=0$의 판별식을 $D$라 할 때 $D>0$에서 $D=(2k+1)^2-4(k+1)=4k^2-3>0$, $\therefore k>\dfrac{\sqrt3}2$ 또는 $k<-\dfrac{\sqrt3}2$.
      source_flow: 예시 답안 p.5
      criteria:
      - 2-2.M2
    - id: 22b-4
      content: |
        (ⅳ) $h(x)$의 축의 방정식이 $x=-\dfrac{2k+1}{2}$이므로 $-1<-\dfrac{2k+1}{2}<3$, $\therefore-\dfrac72<k<\dfrac12$.
      source_flow: 예시 답안 p.5
      criteria:
      - 2-2.M3
    - id: 22b-5
      content: |
        (ⅰ),(ⅱ),(ⅲ),(ⅳ)의 공통 범위를 구하면 $-\dfrac{13}{7}\le k<-\dfrac{\sqrt3}{2}$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 2-2.A1
