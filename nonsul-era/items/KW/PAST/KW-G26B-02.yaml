stimuli:
- label: '1'
  body: |
    함수 $f(t)$가 실수 $a$를 포함하는 구간에서 연속이면 이 구간에 속하는 임의의 $x$에 대하여
    $$\frac{d}{dx}\int_a^xf(t)dt=f(x)$$
- label: '2'
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능할 때,
    $$\int f(x)g^{\prime}(x)dx=f(x)g(x)-\int f^{\prime}(x)g(x)dx$$
- label: '3'
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$f(x)\le g(x)\text{이면 }\int_a^bf(x)dx\le\int_a^bg(x)dx$$
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 두 수열 $\{a_n\}$, $\{b_n\}$이 다음 조건을 만족시킬 때, 물음에 답하시오. (단, $a_1=2$)

    $$a_n+b_n\sqrt3=(2+\sqrt3)^n,\quad a_nb_n=\frac{1}{4\sqrt3}\left\{(2+\sqrt3)^{2n}-(2-\sqrt3)^{2n}\right\}$$

    (1) $a_n$과 $b_n$을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: |
      a_n=((2+sqrt(3))**n+(2-sqrt(3))**n)/2; b_n=((2+sqrt(3))**n-(2-sqrt(3))**n)/(2*sqrt(3))
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        이차방정식의 근과 계수의 관계로부터 $a_n$과 $b_n\sqrt3$은 다음 이차방정식의 두 근이다.
        $$x^2-(2+\sqrt3)^nx+\frac14\left\{(2+\sqrt3)^n+(2-\sqrt3)^n\right\}\left\{(2+\sqrt3)^n-(2-\sqrt3)^n\right\}=0$$
      source_flow: 예시 답안 p.13
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        이 식을 인수분해하면 $\left\{x-\dfrac{(2+\sqrt3)^n+(2-\sqrt3)^n}{2}\right\}\left\{x-\dfrac{(2+\sqrt3)^n-(2-\sqrt3)^n}{2}\right\}=0$이다.
      source_flow: 예시 답안 p.13
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        $a_1=2$이므로 $a_n=\dfrac{(2+\sqrt3)^n+(2-\sqrt3)^n}{2}$, $b_n\sqrt3=\dfrac{(2+\sqrt3)^n-(2-\sqrt3)^n}{2}$이다. 따라서 $a_n=\dfrac12\left\{(2+\sqrt3)^n+(2-\sqrt3)^n\right\}$, $b_n=\dfrac1{2\sqrt3}\left\{(2+\sqrt3)^n-(2-\sqrt3)^n\right\}$이다.
      source_flow: 예시 답안 p.13
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 4
      evidence: |
        $x^2-(2+\sqrt3)^nx+\dfrac14\left\{(2+\sqrt3)^n+(2-\sqrt3)^n\right\}\left\{(2+\sqrt3)^n-(2-\sqrt3)^n\right\}=0$의 두 근이 $a_n$과 $b_n\sqrt3$이라는 것을 썼다.
      steps:
      - 11b-1
    - id: 1-1.M2
      mark_type: M
      points: 2
      evidence: 인수분해하여 두 근의 식을 얻었다.
      depends_on:
      - 1-1.M1
      steps:
      - 11b-2
    - id: 1-1.A1
      mark_type: A
      points: 4
      evidence: |
        $a_n=\dfrac12\left\{(2+\sqrt3)^n+(2-\sqrt3)^n\right\}$, $b_n=\dfrac1{2\sqrt3}\left\{(2+\sqrt3)^n-(2-\sqrt3)^n\right\}$을 구했다.
      depends_on:
      - 1-1.M1
      - 1-1.M2
      steps:
      - 11b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: |
    (2) $\displaystyle\lim_{n\to\infty}\frac{b_n(a_n^2-3b_n^2)}{a_n}$의 값을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: sqrt(3)/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        (1)에서 $a_n-b_n\sqrt3=(2-\sqrt3)^n$이므로 $a_n^2-3b_n^2=(a_n+b_n\sqrt3)(a_n-b_n\sqrt3)=(2+\sqrt3)^n(2-\sqrt3)^n=1$이다.
      source_flow: 예시 답안 p.13
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $\left\lvert\dfrac{2-\sqrt3}{2+\sqrt3}\right\rvert<1$이므로 $\displaystyle\lim_{n\to\infty}\left(\frac{2-\sqrt3}{2+\sqrt3}\right)^n=0$이다.
      source_flow: 예시 답안 p.13
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}\frac{b_n(a_n^2-3b_n^2)}{a_n}=\lim_{n\to\infty}\frac1{\sqrt3}\cdot\frac{1-\left(\frac{2-\sqrt3}{2+\sqrt3}\right)^n}{1+\left(\frac{2-\sqrt3}{2+\sqrt3}\right)^n}=\frac1{\sqrt3}=\frac{\sqrt3}3$이다.
      source_flow: 예시 답안 p.13
      criteria:
      - 1-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 4
      evidence: $a_n-b_n\sqrt3=(2-\sqrt3)^n$과 $a_n^2-3b_n^2=1$을 구했다.
      steps:
      - 12b-1
    - id: 1-2.M2
      mark_type: M
      points: 2
      evidence: |
        $\left\lvert\dfrac{2-\sqrt3}{2+\sqrt3}\right\rvert<1$이므로 $\displaystyle\lim_{n\to\infty}\left(\frac{2-\sqrt3}{2+\sqrt3}\right)^n=0$임을 썼다.
      steps:
      - 12b-2
    - id: 1-2.A1
      mark_type: A
      points: 2
      evidence: |
        $\displaystyle\lim_{n\to\infty}\frac{b_n(a_n^2-3b_n^2)}{a_n}=\frac{\sqrt3}3$을 구했다.
      depends_on:
      - 1-2.M1
      - 1-2.M2
      steps:
      - 12b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [2] 미분가능한 함수 $f(x)$가 다음 조건을 만족시킬 때, 방정식 $f(x)-1=0$의 근을 구하시오.
    (단, $0\le x<2\pi$) [14점]

    $$f(x)+\int_0^xf(t)dt=x-\cos x+\frac32$$
  points: 14
  depends_on: []
  answer:
    kind: expression
    value: x1=pi/4; x2=5*pi/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)+\displaystyle\int_0^xf(t)dt=x-\cos x+\dfrac32$ ······ ①의 양변을 미분하면 $f^{\prime}(x)+f(x)=1+\sin x$이다.
      source_flow: 예시 답안 p.13~14
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        이 식의 양변에 $e^x$를 곱하면 $e^x\{f^{\prime}(x)+f(x)\}=e^x(1+\sin x)$ ······ ②. $\{e^xf(x)\}^{\prime}=e^xf^{\prime}(x)+e^xf(x)$이므로 식 ②의 양변을 적분하면 $e^xf(x)=\displaystyle\int(e^x+e^x\sin x)dx=e^x+\int e^x\sin x\,dx$ ······ ③.
      source_flow: 예시 답안 p.13~14
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        부분적분법에 의하여 $\displaystyle\int e^x\sin x\,dx=e^x\sin x-\int e^x\cos x\,dx=e^x\sin x-\left(e^x\cos x+\int e^x\sin x\,dx\right)$이므로 $\displaystyle\int e^x\sin x\,dx=\frac12e^x(\sin x-\cos x)+C$이다. ③에서 $e^xf(x)=e^x+\dfrac12e^x(\sin x-\cos x)+C$ ······ ④.
      source_flow: 예시 답안 p.13~14
      criteria:
      - 2.M3
    - id: 2b-4
      content: |
        식 ①의 양변에 $x=0$을 대입하면 $f(0)=\dfrac12$이므로 $C=0$이다. ④에서 $e^x>0$이므로 $f(x)=1+\dfrac12\sin x-\dfrac12\cos x$이다.
      source_flow: 예시 답안 p.13~14
      criteria:
      - 2.A1
    - id: 2b-5
      content: |
        방정식 $f(x)-1=0$으로부터 $\sin x=\cos x$이고, $0\le x<2\pi$에서 방정식의 근은 $x=\dfrac\pi4,\dfrac{5\pi}4$이다.
      source_flow: 예시 답안 p.13~14
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: $f^{\prime}(x)+f(x)=1+\sin x$를 구했다.
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        적분하면 $e^xf(x)=\displaystyle\int(e^x+e^x\sin x)dx=e^x+\int e^x\sin x\,dx$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.M3
      mark_type: M
      points: 3
      evidence: 부분적분법으로 $e^xf(x)=e^x+\dfrac12e^x(\sin x-\cos x)+C$를 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $f(0)=\dfrac12$과 $f(x)=1+\dfrac12\sin x-\dfrac12\cos x$를 구했다.
      depends_on:
      - 2.M1
      - 2.M2
      - 2.M3
      steps:
      - 2b-4
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: $\sin x=\cos x$와 $x=\dfrac\pi4,\dfrac{5\pi}4$를 구했다.
      depends_on:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
      steps:
      - 2b-5
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-1
  stem: |
    [3] 모든 실수 $x$에서 미분가능한 함수 $f(x)$가 $f(x)>0$이고 다음 조건을 만족시킬 때, 물음에 답하시오.

    (가) $f(0)=1$
    (나) $f(x)\le2f^{\prime}(x)$
    (다) $\{f(x)\}^2\le\displaystyle\int_0^x\{f(t)\}^2dt+1$

    (1) $\displaystyle\int_0^x2f(t)f^{\prime}(t)dt=\{f(x)\}^2-1$이 성립함을 보이시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: proof
    value: int_0^x 2f(t)f(t)\'dt={f(x)}^2-1 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: $\dfrac{d}{dx}\{f(x)\}^2=2f(x)f^{\prime}(x)$이므로
      source_flow: 예시 답안 p.14
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $\displaystyle\int_0^x2f(t)f^{\prime}(t)dt=\int_0^x\frac{d}{dt}\{f(t)\}^2dt=\left[\{f(t)\}^2\right]_0^x=\{f(x)\}^2-\{f(0)\}^2=\{f(x)\}^2-1$이다.
      source_flow: 예시 답안 p.14
      criteria:
      - 3-1.R1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 2
      evidence: $\dfrac{d}{dx}\{f(x)\}^2=2f(x)f^{\prime}(x)$를 썼다.
      steps:
