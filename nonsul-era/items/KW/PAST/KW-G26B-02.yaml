        조건 (나)의 부등식의 양변에 $f(x)$를 곱하면 $f(x)>0$이므로 $\{f(x)\}^2\le2f(x)f^{\prime}(x)$이다. 양변을 적분하면 $\displaystyle\int_0^x\{f(t)\}^2dt\le\int_0^x2f(t)f^{\prime}(t)dt$ ······ ②. ①,②로부터 $\displaystyle\int_0^x\{f(t)\}^2dt=\int_0^x2f(t)f^{\prime}(t)dt$이다.
