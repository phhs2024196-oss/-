intent: |
  [1] (1) 이차방정식의 근과 계수의 관계를 이해하고, 이를 이용하여 주어진 수열의 일반항을 구할 수 있는 능력을 평가한다. (2) 수열의 극한에 대한 기본 성질을 이해하고, 등비수열이 수렴하도록 하는 조건을 확인하여 수열의 극한값을 구할 수 있는 능력을 평가한다. [2] 정적분과 미분의 관계를 이용하여 주어진 방정식의 양변을 미분할 수 있는지를 평가한다. 함수의 곱의 미분법과 여러 가지 적분법을 이해하고, 이를 활용할 수 있는 사실을 적절하게 적용할 수 있는 능력을 평가한다. 또한 삼각함수가 포함된 방정식의 근을 구할 수 있는 능력을 평가한다. [3] (1) 합성함수의 미분법과 정적분의 뜻을 이해하고 이를 이용하여 주어진 등식이 성립함을 증명할 수 있는 능력을 평가한다. (2) 정적분과 부등식에 대한 성질을 이용하여 정적분이 포함된 등식을 구하고, 정적분과 미분의 관계를 이해하고 이를 이용하여 주어진 조건을 만족시키는 함수를 구할 수 있는 능력을 평가한다. (문항카드 원문)
key_idea: |
  [1]은 합과 곱이 주어진 두 수를 근으로 하는 이차방정식으로 $a_n$, $b_n\sqrt3$를 구한다. [2]는 양변을 미분해 $f^{\prime}+f$ 꼴을 만들고 $e^x$를 곱해 적분한다. [3]은 부등식 두 개가 서로 반대 방향이어서 정적분이 같다는 등식으로 바뀌는 것이 열쇠다.
