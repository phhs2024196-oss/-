key_idea: '[1] $\det(A^{2015})=\det(A)^{2015}=0$이므로 $A$는 역행렬이 없다. [2] 케일리·해밀턴과 $\det A=0$에서 $A^2=(\mathrm{tr}A)A$, $A^{2015}=(\mathrm{tr}A)^{2014}A=O$이므로 $\mathrm{tr}A=0$. [3] $A^2=O$이므로 $(A^2+E)(A+E)=A+E=E$. [4] $d=-a$이므로 $f(x)=-x$. [5] $f(n)=\{f(1)\}^n$으로 증가를 보이고 $\det g(A)\ne0$을 확인한다.'
