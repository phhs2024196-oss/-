    tolerance: null
  solutions:
  - id: S51-B
    audience: B
    method_no: 1
    steps:
    - id: 51b-1
      content: $f(0)=f(0+0)=\{f(0)\}^2$이므로 $f(0)\{f(0)-1\}=0$이다. 그런데 $f(0)\ne0$이므로 $f(0)=1$이다.
      source_flow: 풀이예시 p.7
      criteria:
      - 5-1.R1
    - id: 51b-2
      content: 또한 임의의 자연수 $n$에 대하여 $f(n)=f(1+1+\cdots+1)=\{f(1)\}^n$이고
      source_flow: 풀이예시 p.7
      criteria:
      - 5-1.R2
    - id: 51b-3
      content: $1=f(0)=f(n+(-n))=f(n)f(-n)$이므로 $f(-n)=\frac1{f(n)}=\frac1{\{f(1)\}^n}=\{f(1)\}^{-n}$이다.
      source_flow: 풀이예시 p.7
      criteria:
      - 5-1.R3
    - id: 51b-4
      content: 따라서 모든 $n\in\mathbb{Z}$에 대하여 $f(n)=\{f(1)\}^n$이다.
      source_flow: 풀이예시 p.7
      criteria:
      - 5-1.R3
    - id: 51b-5
      content: 그런데 $m<n$이면 $f(0)=1,\ f(1)>1$이므로 $f(n)-f(m)=\{f(1)\}^n-\{f(1)\}^m>0$이다. 즉, $f(m)<f(n)$이다.
      source_flow: 풀이예시 p.7
      criteria:
      - 5-1.R4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
