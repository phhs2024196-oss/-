      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: 구간 $[0,1]$을 $n$등분하여 $f(x_k)=\{e^{1/n}\}^k$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.R2
      mark_type: R
      points: 4
      evidence: 정적분의 정의와 등비급수의 부분합으로 $\displaystyle\lim_{n\to\infty}\left\{e^{1/n}\cdot(e-1)\cdot\frac{1/n}{e^{1/n}-1}\right\}$ 꼴을 얻었다.
      depends_on:
      - 1.R1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.R3
      mark_type: R
