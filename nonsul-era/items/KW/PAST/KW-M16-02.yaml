- id: 5-1
  stem: |
    [5] 함수 $g(x)$는 실수 $c,d\ (c<d)$를 포함하는 구간에서 $g(x)\ge0$이고 미분 가능하며, 그의 도함수 $g^{\prime}(x)$가 연속이다. 이때 구간 $[c,d]$를 $N$등분하고 $w=\dfrac{d-c}N,\ x_k=c+k\cdot w,\ k=0,1,2,\ldots,N$이라 하고, 또한 $M$을 구간 $[c,d]$에서 $\lvert g^{\prime}(x)\rvert$의 최댓값이라 하자.
    이제 각 소구간 $[x_{k-1},x_k],\ k=0,1,2,\ldots,N$에 대해 문항 [4]에서와 같이 높이가 함숫값 $g(x_{k-1})$, 밑변의 길이가 $w=(x_k-x_{k-1})$인 직사각형의 넓이 $w\cdot g(x_{k-1})$을 생각하고 그들을 모두 합하면 다음 식 ③과 같다. [판독확인: 원문 표기 소구간의 $k=0,1,2,\ldots,N$ (식 ③의 합은 $k=1$부터 $N$까지)]
    $$w\sum_{k=1}^Ng(x_{k-1})=w\{g(x_0)+g(x_1)+\cdots+g(x_{N-1})\}\quad\cdots\cdots\cdots\cdots\cdots\cdots\ ③$$
    한편 제시문의 [정적분의 성질2]에 의하면 $\displaystyle\int_c^dg(x)\,dx=\sum_{k=1}^N\int_{x_{k-1}}^{x_k}g(x)\,dx$가 성립한다. 따라서 식 ③의 값을 정적분 $\displaystyle\int_c^dg(x)\,dx$의 근삿값으로 택할 수 있다.
    (1) 이 경우에 발생하는 오차 $\left\lvert\displaystyle\int_c^dg(x)\,dx-w\sum_{k=1}^Ng(x_{k-1})\right\rvert$의 한계에 대해 다음이 성립함을 보이시오.(12점)
    $$\left\lvert\int_c^dg(x)\,dx-w\sum_{k=1}^Ng(x_{k-1})\right\rvert\le\frac M{2N}(d-c)^2\quad\cdots\cdots\cdots\cdots\cdots\cdots\ ④$$
  points: 12
  depends_on:
  - 4-2
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S51-B
    audience: B
    method_no: 1
    steps:
    - id: 51b-1
      content: |
        구간 $[c,d]$를 $N$ 등분하면 $\displaystyle\int_c^dg(x)\,dx=\sum_{k=1}^N\int_{x_{k-1}}^{x_k}g(x)\,dx$ 이 성립하므로 부등식 ④의 왼쪽 항의 절댓값 기호 안을 다음과 같이 쓸 수 있다.
        $$\int_c^dg(x)\,dx-w\sum_{k=1}^Ng(x_{k-1})=\sum_{k=1}^N\left\{\int_{x_{k-1}}^{x_k}g(x)\,dx-w\,g(x_{k-1})\right\}$$
      source_flow: 풀이예시 p.11
      criteria:
      - 5-1.R1
    - id: 51b-2
      content: |
        이제 $M_k$를 소구간 $[x_{k-1},x_k]$ 에서 $\lvert g^{\prime}(x)\rvert$의 최댓값이라 하고 문항 [4]의 식 ②를 적용하고, $M$이 구간 $[c,d]$에서 $\lvert g^{\prime}(x)\rvert$의 최댓값임을 이용하면 다음을 얻는다.
        $$\left\lvert\int_{x_{k-1}}^{x_k}g(x)\,dx-w\,g(x_{k-1})\right\rvert\le\frac{M_k}2w^2\le\frac M2w^2,\quad k=1,2,\ldots,N$$
      source_flow: 풀이예시 p.11
      criteria:
      - 5-1.R2
    - id: 51b-3
      content: |
        이를 제시문의 [실수의 삼각부등식]과 결합하고 $w=\dfrac{d-c}N$임을 이용하여 다음을 얻는다.
        $$\left\lvert\int_c^dg(x)\,dx-w\sum_{k=1}^Ng(x_{k-1})\right\rvert=\left\lvert\sum_{k=1}^N\left\{\int_{x_{k-1}}^{x_k}g(x)\,dx-w\,g(x_{k-1})\right\}\right\rvert$$
        $$\le\sum_{k=1}^N\left\lvert\int_{x_{k-1}}^{x_k}g(x)\,dx-w\,g(x_{k-1})\right\rvert\le\sum_{k=1}^N\frac M2w^2=N\cdot\frac M2\left(\frac{d-c}N\right)^2=\frac M{2N}(d-c)^2$$
      source_flow: 풀이예시 p.11
      criteria:
      - 5-1.R3
      - 5-1.R4
