stimuli:
- label: 정적분의 정의
  body: |
    [정적분의 정의] 함수 $f(x)$가 닫힌 구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)\,dx=\lim_{n\to\infty}\sum_{k=1}^nf(x_k)\Delta x\quad\left(\text{단, }\Delta x=\frac{b-a}n,\ x_k=a+k\Delta x\right)$$
- label: 정적분의 성질1
  body: |
    [정적분의 성질1] 두 함수 $f(x),\ g(x)$가 닫힌 구간 $[a,b]$에서 연속일 때
    $$\int_a^bkf(x)\,dx=k\int_a^bf(x)\,dx\quad(\text{단, }k\text{는 상수})$$
    $$\int_a^b\{f(x)\pm g(x)\}\,dx=\int_a^bf(x)\,dx\pm\int_a^bg(x)\,dx\quad(\text{복부호 동순})$$
- label: 정적분의 성질2
  body: |
    [정적분의 성질2] 임의의 실수 $a,b,c$를 포함하는 구간에서 함수 $f(x)$가 연속일 때
    $$\int_a^bf(x)\,dx=\int_a^cf(x)\,dx+\int_c^bf(x)\,dx$$
    또한, 수학적 귀납법에 의해 임의의 실수 $c_1,c_2,\ldots,c_n$을 포함하는 구간에서 연속인 함수 $f(x)$에 대해 다음이 성립한다.
    $$\int_{c_1}^{c_n}f(x)\,dx=\int_{c_1}^{c_2}f(x)\,dx+\int_{c_2}^{c_3}f(x)\,dx+\cdots+\int_{c_{n-1}}^{c_n}f(x)\,dx=\sum_{k=1}^{n-1}\int_{c_k}^{c_{k+1}}f(x)\,dx$$
- label: 정적분과 부등식
  body: |
    [정적분과 부등식] 두 함수 $f(x),\ g(x)$가 닫힌 구간 $[a,b]$에서 연속이고 $f(x)\le g(x)$일 때
    $$\int_a^bf(x)\,dx\le\int_a^bg(x)\,dx$$
- label: 실수의 삼각 부등식
  body: |
    [실수의 삼각 부등식] 임의의 실수 $a,\ b$에 대하여
    $$\lvert a+b\rvert\le\lvert a\rvert+\lvert b\rvert\quad(\text{단, 등호는 }ab\ge0\text{일 때 성립})$$
    또한, 수학적 귀납법에 의해 임의의 실수 $a_1,a_2,\ldots,a_n$에 대하여 다음 부등식이 성립한다.
    $$\lvert a_1+a_2+\cdots+a_n\rvert\le\lvert a_1\rvert+\lvert a_2\rvert+\cdots+\lvert a_n\rvert\quad\text{또는}\quad\left\lvert\sum_{k=1}^na_k\right\rvert\le\sum_{k=1}^n\lvert a_k\rvert$$
- label: 최대·최소의 정리
  body: '[최대·최소의 정리] 함수 $f(x)$가 닫힌 구간 $[a,b]$에서 연속이면 $f(x)$는 이 구간에서 반드시 최댓값과 최솟값을 갖는다.'
- label: 평균값의 정리
  body: |
    [평균값의 정리] 함수 $y=f(x)$가 닫힌 구간 $[a,b]$에서 연속이고 열린 구간 $(a,b)$에서 미분가능하면
    $$f^{\prime}(c)=\frac{f(b)-f(a)}{b-a}$$
    인 점 $c$가 $a$와 $b$ 사이에 적어도 하나 존재한다.
stem: '[문제 2] 다음 제시문을 이용하여 문항별로 풀이와 함께 답하시오. (50점)'
subparts:
- id: '1'
  stem: '[1] 정적분의 정의에 의하여 $\displaystyle\int_0^1e^x\,dx=e-1$임을 보이시오.(9점)'
  points: 9
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 구간 $[0,1]$을 $n$ 등분하면 $\Delta x=\frac1n,\ x_k=0+k\Delta x=\frac kn,\ k=1,2,\ldots,n$이고 $f(x)=e^x$라고 하면
        $$f(x_k)=e^{x_k}=e^{k/n}=\{e^{1/n}\}^k,\quad k=1,2,\ldots,n$$
      source_flow: 풀이예시 p.10
      criteria:
      - 1.R1
    - id: 1b-2
      content: |
        여기서 정적분의 정의와 무한등비급수의 부분합을 이용하여 다음을 얻는다.
        $$\int_0^1e^x\,dx=\lim_{n\to\infty}\sum_{k=1}^nf(x_k)\Delta x=\lim_{n\to\infty}\frac1n\sum_{k=1}^n\{e^{1/n}\}^k$$
        $$=\lim_{n\to\infty}\left\{\left(e^{1/n}+e^{2/n}+\cdots+e^{k/n}+\cdots+e^{n/n}\right)\left(\frac1n\right)\right\}$$
        $$=\lim_{n\to\infty}\left(\frac{e^{1+1/n}-e^{1/n}}{e^{1/n}-1}\right)\left(\frac1n\right)$$
        $$=\lim_{n\to\infty}\left\{e^{1/n}\cdot(e-1)\cdot\left(\frac{1/n}{e^{1/n}-1}\right)\right\}$$
      source_flow: 풀이예시 p.10
      criteria:
      - 1.R2
    - id: 1b-3
      content: |
        한편 $\displaystyle\lim_{x\to0}\frac{e^x-1}x=\lim_{x\to0}\frac{f(x)-f(0)}{x-0}=f^{\prime}(0)=e^0=1$이므로 다음을 얻는다.
        $$\lim_{n\to\infty}\frac{1/n}{e^{1/n}-1}=\lim_{n\to\infty}\frac1{\dfrac{e^{1/n}-1}{1/n}}=\lim_{n\to\infty}\frac1{\dfrac{f(1/n)-f(0)}{1/n-0}}=1$$
        또 $\displaystyle\lim_{n\to\infty}e^{1/n}=1$이므로 극한의 성질에 의해 $\displaystyle\lim_{n\to\infty}\left\{e^{1/n}\cdot(e-1)\cdot\left(\frac{1/n}{e^{1/n}-1}\right)\right\}=e-1$이다.
        그러므로 $\displaystyle\int_0^1e^x\,dx=e-1$이다.
      source_flow: 풀이예시 p.10
      criteria:
      - 1.R3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
