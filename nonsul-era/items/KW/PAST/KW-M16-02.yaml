- id: '2'
  stem: |
    [2] 다음 극한값을 정적분 $\displaystyle\int_0^1h(x)\,dx$를 이용하여 구한다고 할 때, 함수 $h(x)$와 극한값을 구하시오.(8점)
    $$\lim_{n\to\infty}\left(\frac1{2n+1}+\frac1{2n+2}+\cdots+\frac1{2n+n}\right)$$
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: h=1/(2+x); lim=log(3/2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        주어진 식을 다음과 같이 변형할 수 있다.
        $$\lim_{n\to\infty}\left(\frac1{n+1}+\frac1{n+2}+\cdots+\frac1{n+n}\right)=\lim_{n\to\infty}\frac1n\left(\frac1{2+\frac1n}+\frac1{2+\frac2n}+\cdots+\frac1{2+\frac kn}+\cdots+\frac1{2+\frac nn}\right)$$
        $$=\lim_{n\to\infty}\frac1n\sum_{k=1}^n\left(\frac1{2+\frac kn}\right)$$
        [판독확인: 원문 표기 좌변의 분모가 $n+1,\ n+2,\ n+n$으로 되어 있음. 문제의 합과 우변·마지막 줄은 $2n+1,\ 2n+2,\ 2n+n$ 기준임]
      source_flow: 풀이예시 p.10
      criteria:
      - 2.M1
    - id: 2b-2
      content: 구간을 $[0,1]$, $\Delta x=\frac1n,\ x_k=0+k\cdot\frac1n,\ k=1,2,\ldots,n$이라 하자. 제시문의 [정적분의 정의]에 따르면 구하는 함수는 $h(x)=\frac1{2+x}$이다.
      source_flow: 풀이예시 p.10
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        따라서 함수 $h(x)$의 정적분 $\displaystyle\int_0^1h(x)\,dx$를 이용하면 구하는 극한값은 다음과 같이 $\ln\frac32$이다.
        $$\lim_{n\to\infty}\left(\frac1{2n+1}+\frac1{2n+2}+\cdots+\frac1{2n+n}\right)=\lim_{n\to\infty}\sum_{k=1}^nh(x_k)\Delta x=\int_0^1\frac1{2+x}\,dx=\ln(2+x)\Big]_0^1=\ln\frac32$$
      source_flow: 풀이예시 p.10
      criteria:
      - 2.A3
