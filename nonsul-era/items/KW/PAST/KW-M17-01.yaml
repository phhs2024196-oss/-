intent: 자연수의 약수와 배수에 대한 이해력을 평가하고 몫과 나머지가 유일하게 존재하는 것을 증명할 수 있는지에 대한 논리력을 평가하고자 하였다. [수학I]의 다항식의 나눗셈에 대한 문제해결 능력의 평가를 통해 논리적이고 수리적인 분석 능력을 측정하고자 하였다. 또한 [수학II]의 수학적 귀납법을 이해하고 자연수에 대한 간단한 명제를 수학적 귀납법을 이용해서 증명할 수 있는 논리력을 평가하고자 하였다. 문제의 제시문은 문항들을 이해하기 위해 도움이 되는 내용을 담았다. (공식 해설 '출제 의도' 원문)
key_idea: $2^n\times3^{2n}-1=18^n-1$로 보아 $18^{k+1}-1=18(18^k-1)+17$로 귀납한다. 몫과 나머지의 유일성은 $b(q_1-q_2)=r_2-r_1$과 $0\le r<b$로, 나머지 $0$ 조건은 $x^2+x+1=0$의 허근 $w$($w^3=1$)를 대입해 $a+bw-6=0$에서 $a=6$, $b=0$을 얻는다. $f(2)=g(2)=0$이므로 $f,g$는 $(x-2)$를 공통인수로 가져 $k=\dfrac{s+t}{2}=\dfrac{11}{2}$이다.
stuck: '[4]에서 $x^{2016}$, $x^{523}$을 직접 나누지 않고 $g(w)=0$인 허근 $w$의 성질 $w^3=1$로 지수를 줄이는 단계, [5]에서 $2\in X$와 $2\in Y$로부터 $f(2)=g(2)=0$을 이끄는 단계'
