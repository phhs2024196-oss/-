# 광운대 2017학년도 모의평가 자연계열 [문제 1] — 기출·모의 원문은 내부 분석용(allowed_use: internal_only). 2009 개정 시기 문항(2015 과목명 대응). [문제 조건 결함 — 독립 교차검증 2건 일치(2026-11-23)] [5]는 a,b,c,d∈ℕ이면 f(2)>0 이라 조건을 만족하는 f,g가 없음. 공식 답 11/2는 계수가 정수·실수일 때의 값 — 그대로 둠.
