stimuli:
- label: '1'
  body: 자연수 $a$와 자연수 $b$에 대하여 자연수 $q$가 존재하여 $a=bq$이면 $a$를 $b$의 배수, $b$를 $a$의 약수라 한다.
- label: '2'
  body: 자연수 $a$와 자연수 $b$의 공약수 중에서 가장 큰 수를 자연수 $a$와 자연수 $b$의 최대공약수라 한다.
- label: '3'
  body: 자연수 $a$와 자연수 $b$에 대하여 $a=bq+r$, $0\le r<b$를 만족시키는 $q$와 $r$이 존재한다. 이때 $q$를 $a$를 $b$로 나누었을 때의 몫, $r$를 나머지라고 한다.
- label: '4'
  body: 다항식 $A$를 다항식 $B$ $(B\ne0)$로 나누었을 때의 몫을 $Q$, 나머지를 $R$라 하면 $A=BQ+R$가 성립한다. 이때 $R$의 차수는 $B$의 차수보다 낮다.
- label: '5'
  body: |-
    (수학적 귀납법) 자연수 $n$에 대한 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.

    (1) $n=1$일 때 명제 $p(n)$이 성립한다.
    (2) $n=k$일 때 명제 $p(n)$이 성립한다고 가정하면 $n=k+1$일 때에도 명제 $p(n)$이 성립한다.
