- id: '2'
  stem: '[2] 함수 $y=f(x)$가 구간 $I$에서 미분가능하고 $f^{\prime}(x)\ne0$을 만족시킨다고 할 때, $\tan(\alpha(x)+\beta(x))$와 도함수 $f^{\prime}(x)$의 관계식을 구하시오.(8점)'
