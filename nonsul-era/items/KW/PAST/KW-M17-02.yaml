- id: '5'
  stem: '[5] 함수 $f(x)=\sin x$, $I=[0,2\pi]$에 대해 $g(x)=\dfrac{d}{dx}\alpha(x)$라고 할 때, $g(x)$의 값이 최대가 되는 점 $x_M\in I$와 최소가 되는 점 $x_m\in I$를 찾고, $x_M$과 $x_m$에서의 $\alpha(x)$와 $\dfrac{d}{dx}\alpha(x)$의 값을 구하시오.(12점)'
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: xM=3*pi/2; xm=pi/2; alpha_xM=0; alpha_xm=0; g_xM=1; g_xm=-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: 함수 $f(x)=\sin x$, $I=[0,2\pi]$에 대해 $f^{\prime}(x)=\cos x$, $f^{\prime\prime}(x)=-\sin x$이므로 $g(x)=\dfrac{d}{dx}\alpha(x)=\dfrac{f^{\prime\prime}(x)}{1+\{f^{\prime}(x)\}^2}=-\dfrac{\sin x}{1+\cos^2x}$, $I=[0,2\pi]$이다.
      source_flow: 해설 p.12
      criteria:
      - 5.M1
      - 5.M2
    - id: 5b-2
      content: 함수 $g(x)$의 극값을 구하기 위해 $\cos^2\theta+\sin^2\theta=1$을 이용하여 $g(x)$의 도함수를 구하면 $g^{\prime}(x)=-\dfrac{\cos x(1+\cos^2x)-\sin x(-2\cos x\sin x)}{(1+\cos^2x)^2}=-\dfrac{\cos x(2+\sin^2x)}{(1+\cos^2x)^2}$이다. 따라서 $\cos x=0$에서 $x=\dfrac{\pi}{2},\dfrac{3\pi}{2}$에서 $g^{\prime}(x)=0$이다.
      source_flow: 해설 p.12
      criteria:
      - 5.M3
    - id: 5b-3
      content: |-
        이제 구간 $I=[0,2\pi]$에서 $g^{\prime}(x)$의 부호를 조사하여 함수 $g(x)$의 증가와 감소, 그리고 찾고자 하는 값들을 표로 나타내면 다음과 같다. 여기서 $\alpha(x)$의 값을 구하기 위해 $\tan\alpha(x)=f^{\prime}(x)=\cos x$를 이용한다.

        | $x$ | $0$ | $\cdots$ | $\dfrac{\pi}{2}$ | $\cdots$ | $\dfrac{3\pi}{2}$ | $\cdots$ | $2\pi$ |
        |---|---|---|---|---|---|---|---|
        | $g^{\prime}(x)$ | | $-$ | | $+$ | | $-$ | |
        | $g(x)$ | $0$ | $\searrow$ | $-1$ | $\nearrow$ | $1$ | $\searrow$ | $0$ |
        | $f^{\prime}(x)$ | $1$ | | $0$ | | $0$ | | $1$ |
        | $\alpha(x)$ | $\dfrac{\pi}{4}$ | | $0$ | | $0$ | | $\dfrac{\pi}{4}$ |
        | | | | $x_m$ | | $x_M$ | | |
      source_flow: 해설 p.12
      criteria:
      - 5.M4
    - id: 5b-4
      content: 그러므로 $x_M=\dfrac{3\pi}{2}$, $x_m=\dfrac{\pi}{2}$이고 $\alpha(x_M)=\alpha(x_m)=0$이며 $\dfrac{d}{dx}\alpha(x_M)=1$, $\dfrac{d}{dx}\alpha(x_m)=-1$이다.
      source_flow: 해설 p.12
      criteria:
      - 5.A1
