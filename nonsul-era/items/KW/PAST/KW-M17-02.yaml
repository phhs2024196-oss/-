      content: 그런데 삼각함수에 관한 성질 $1+\tan^2\theta=\sec^2\theta$과 $\tan\alpha(x)=f^{\prime}(x)$임을 이용하면 $\sec^2\alpha(x)=1+\tan^2\alpha(x)=1+\{f^{\prime}(x)\}^2$이다.
      source_flow: 해설 p.9
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: 따라서 $\dfrac{d}{dx}\alpha(x)=\dfrac{f^{\prime\prime}(x)}{1+\{f^{\prime}(x)\}^2}$, $x\in I$가 성립한다.
      source_flow: 해설 p.9
      criteria:
      - 3-1.A1
