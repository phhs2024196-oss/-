stimuli:
- label: 가
  body: |-
    어떤 구간 $I$에서 연속인 함수 $g(x)$에 대하여 $f^{\prime\prime}(x)=g(x)$을 만족시키는 이계도함수를 갖는 함수 $y=f(x)$는 부정적분을 반복적으로 구하여 찾을 수 있다. 먼저, 이계도함수 $f^{\prime\prime}(x)$는 함수 $f^{\prime}(x)$의 도함수, 즉 $\dfrac{d}{dx}f^{\prime}(x)=f^{\prime\prime}(x)$이므로 부정적분의 정의에 의해 $f^{\prime}(x)$는 함수 $f^{\prime\prime}(x)=g(x)$의 부정적분이다. 그리고 또한 함수 $g(x)=f^{\prime\prime}(x)$의 부정적분 $F(x)$는 다음과 같다.
    $$F(x)=\int g(x)dx+C_0,\quad C_0\text{은 적분상수}$$
    여기서 $f^{\prime}(x)$와 $F(x)$의 도함수가 모두 $g(x)=f^{\prime\prime}(x)$로 같으므로 다음이 성립한다.
    $$f^{\prime}(x)=F(x)+C_1,\quad C_1\text{은 상수}$$
    이로부터 함수 $y=f(x)$는 다음 식으로 구할 수 있다.
    $$f(x)=\int\left(F(x)+C_1\right)dx+C_2,\quad C_2\text{는 적분상수}$$
- label: 나
  body: |-
    함수 $y=f(x)$가 구간 $I$에서 미분가능하다고 하자. 곡선 $y=f(x)$ 위의 점 $P(x,f(x))$, $x\in I$에서의 접선 $L$이 $x$축과 만나는 경우, 두 직선의 이루는 각의 크기를 양의 $x$축으로부터 시곗바늘이 도는 방향의 반대 방향으로 재고 $\alpha(x)$ (라디안)라 하자. 또 같은 점 $P(x,f(x))$를 지나고 직선 $L$에 수직인 직선 $L^{\prime}$이 $x$축과 이루는 각의 크기도 같은 방법으로 재고 그 크기를 $\beta(x)$ (라디안)로 나타내기로 하자. 점 $P(x,f(x))$에서의 접선 $L$이 $x$축과 만나지 않는, 즉 평행한 경우에는 $\alpha(x)=0$, $\beta(x)=\dfrac{\pi}{2}$로 정한다. 그러면 $0\le\alpha(x)<\pi$, $\alpha(x)\ne\dfrac{\pi}{2}$이고, 각 $\alpha(x)$가 예각일 경우는 $\beta(x)=\alpha(x)+\dfrac{\pi}{2}$이고, 각 $\alpha(x)$가 둔각이라면 $\alpha(x)=\beta(x)+\dfrac{\pi}{2}$의 관계가 성립한다. <그림 1>은 $\alpha(x)$가 예각인 경우의 한 예를 나타낸 것이다. (※ 함수 $y=f(x)$가 이계도함수를 가지면 함수 $\alpha(x)$는 미분가능하다고 가정한다.)

    [그림 1: 좌표평면에 곡선 $y=f(x)$(위로 증가하는 곡선)와 그 위의 점 $P(x,f(x))$. 점 $P$에서의 접선 $L$(기울기가 양수)은 $x$축과 점 $A$에서 만나며 $A$에서 $\alpha(x)$가 표시되어 있다. 점 $P$를 지나고 $L$에 수직인 직선 $L^{\prime}$(기울기가 음수)은 $x$축과 점 $B$에서 만나며 $B$에서 $\beta(x)$가 표시되어 있고, $P$에 직각 표시가 있다.]
