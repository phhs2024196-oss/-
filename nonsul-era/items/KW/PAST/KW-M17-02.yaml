      content: $\alpha(x)=\dfrac{\pi}{2}$이면 (1)의 식에서 $\tan\alpha(x)=\tan\dfrac{\pi}{2}=\infty$이 되어 $f^{\prime}(x)=\infty$이다. 이는 함수 $y=f(x)$가 점 $x$에서 미분가능하지 않음을 의미하여 함수 $y=f(x)$가 미분가능하다는 데 모순이다. 따라서 $\alpha(x)\ne\dfrac{\pi}{2}$이다. (별해) $x$에서 미분가능하므로 $f^{\prime}(x)$는 실수이다. 그런데 $\tan\alpha(x)=f^{\prime}(x)$이고 $\tan\dfrac{\pi}{2}=\infty$이므로 $\alpha(x)=\dfrac{\pi}{2}$일 수 없다.
