      content: 문항 [1]에서 얻은 관계식 $\tan\alpha(x)=f^{\prime}(x)$의 양변을 변수 $x$에 관해 미분한다. $\dfrac{d}{dx}(\tan\alpha(x))=\dfrac{d}{dx}f^{\prime}(x)$. 좌변을 합성함수의 미분법과 $(\tan\theta)^{\prime}=\sec^2\theta$을 이용하여 정리하면 $\sec^2\alpha(x)\dfrac{d}{dx}\alpha(x)=f^{\prime\prime}(x)$ 또는 $\dfrac{d}{dx}\alpha(x)=\dfrac{f^{\prime\prime}(x)}{\sec^2\alpha(x)}$를 얻는다.
