  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 탄젠트의 덧셈정리에 의해 $\tan(\alpha(x)+\beta(x))=\dfrac{\tan\alpha(x)+\tan\beta(x)}{1-\tan\alpha(x)\tan\beta(x)}$이다.
      source_flow: 해설 p.8
      criteria:
      - 2.M1
    - id: 2b-2
      content: 제시문의 (나)에 의하면 $\beta(x)=\alpha(x)+\dfrac{\pi}{2}$ 또는 $\alpha(x)=\beta(x)+\dfrac{\pi}{2}$이다. 여기서 삼각함수에 관한 성질 $\sin\left(\theta\pm\dfrac{\pi}{2}\right)=\pm\cos\theta$, $\cos\left(\theta\pm\dfrac{\pi}{2}\right)=\mp\sin\theta$ (복부호 동순)를 이용하여 $\tan\beta(x)=\tan\left(\alpha(x)\pm\dfrac{\pi}{2}\right)=\dfrac{\sin\left(\alpha(x)\pm\frac{\pi}{2}\right)}{\cos\left(\alpha(x)\pm\frac{\pi}{2}\right)}=\dfrac{\pm\cos\alpha(x)}{\mp\sin\alpha(x)}=-\cot\alpha(x)$ (복부호 동순)를 얻는다. 따라서 $\tan\alpha(x)\tan\beta(x)=\tan\alpha(x)\{-\cot\alpha(x)\}=-1$이다.
      source_flow: 해설 p.8
      criteria:
      - 2.M2
    - id: 2b-3
      content: 또한 문항 [1]에서 $\tan\alpha(x)=f^{\prime}(x)$이고 문제의 조건에서 $f^{\prime}(x)\ne0$이므로 $\tan\alpha(x)+\tan\beta(x)=\tan\alpha(x)-\cot\alpha(x)=f^{\prime}(x)-\dfrac{1}{f^{\prime}(x)}$를 얻는다.
      source_flow: 해설 p.8
      criteria:
      - 2.M3
    - id: 2b-4
      content: 그러므로 구하는 식은 $\tan(\alpha(x)+\beta(x))=\dfrac{\tan\alpha(x)+\tan\beta(x)}{1-\tan\alpha(x)\tan\beta(x)}=\dfrac{f^{\prime}(x)-\frac{1}{f^{\prime}(x)}}{1-(-1)}=\dfrac{\{f^{\prime}(x)\}^2-1}{2f^{\prime}(x)}$, $f^{\prime}(x)\ne0$이다.
      source_flow: 해설 p.8
      criteria:
      - 2.M4
      - 2.A1
