intent: |
  [1] 주어진 식을 인수분해 하는 계산 능력과 함수에 대한 이해력을 평가한다. [2] (1) 무리수가 포함된 항등식에 대한 이해력과 계산능력을 평가한다. (2) 명제의 진리집합을 구체적으로 구하는 논리력과 응용력을 평가한다. [3] (1) 이차함수의 판별식에 대한 이해력과 계산능력을 평가한다. (2) 이차함수의 그래프 개형에 대한 이해력과 부등식 $f(x)g(x)\le0$의 의미에 대한 이해력 및 계산능력을 평가한다. (공식 해설 '출제 의도' 원문)
key_idea: |
  $f(a)f(b)-1=f(a)+f(b)$는 $(f(a)-1)(f(b)-1)=2$로 인수분해하고 나머지의 범위로 값을 정한다. $a+b\sqrt3+c\sqrt7=0$은 제곱하여 $\sqrt{21}$의 계수를 비교하고, 뺄셈에 닫힌 부분집합은 $0$이 아닌 원소가 있으면 무한집합이 되는 모순으로 $\{0\}$뿐이다. 곱 $f(x)g(x)\le0$의 해는 두 이차함수의 근의 위치로 구간을 나눈다.
stuck: |
  [3](2)에서 $-4<a-\sqrt{a^2-a+2}<a+\sqrt{a^2-a+2}<8$을 확인하여 해집합이 두 구간 $[-4,\alpha]\cup[\beta,8]$이 되는 이유를 부호로 설명하는 단계
