stimuli:
- label: '1'
  body: |
    모든 자연수들의 집합을 $\mathbb{N}$, 모든 정수들의 집합을 $\mathbb{Z}$, 모든 유리수들의 집합을 $\mathbb{Q}$, 모든 실수들의 집합을 $\mathbb{R}$로 나타낸다.
- label: '2'
  body: |
    내용이 참인지 거짓인지를 분명히 판별할 수 있는 문장이나 식을 명제라고 한다.
- label: '3'
  body: |
    $p,q$가 문장이나 식일 때, ‘$p$이면 $q$이다.’꼴의 명제에서 $p$를 가정, $q$를 결론이라 하고, 명제‘$p$이면 $q$이다.’를 기호 $p\rightarrow q$로 나타낸다.
- label: '4'
  body: |
    변수를 포함하는 문장이나 식이 변수의 값에 따라 참, 거짓이 정해질 때, 그 문장이나 식을 조건이라고 한다.
- label: '5'
  body: |
    전체집합의 원소 중에서 조건을 참이 되게 하는 모든 원소의 집합을 그 조건의 진리집합이라고 한다.
- label: '6'
  body: |
    $a,b,m\in\mathbb{Q}$이고 $\sqrt m\in\mathbb{R}-\mathbb{Q}$일 때 $a+b\sqrt m=0$이면 $a=0$이고 $b=0$이다.
- label: '7'
  body: |
    $n\in\mathbb{N}$을 $m\in\mathbb{N}$으로 나누었을 때 몫을 $q$, 나머지를 $r$이라고 하면 $n=mq+r$이다.
- label: '8'
  body: |
    이차함수 $f(x)=ax^2+bx+c$의 그래프가 $x$축과 서로 다른 두 점에서 만나기 위한 필요충분조건은 $b^2-4ac>0$이다.
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: '1'
  stem: |
    [1] 함수 $f:\mathbb{N}\rightarrow\mathbb{Z}$는 $n\in\mathbb{N}$을 $12$로 나눈 나머지를 $f(n)$에 대응시키는 함수이다. 함수 $f$가 $a,b\in\mathbb{N}$에 대하여 다음 조건을 만족시킬 때 $f(2a+b^2)$의 값을 구하시오. [10점]

    $f(a)>f(b)$이고 $f(a)f(b)-1=f(a)+f(b)$.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '10'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(a)f(b)-f(a)-f(b)+1=2$이므로 $(f(a)-1)(f(b)-1)=2$이다. 그런데 $f(a)\ge0$이고 $f(b)\ge0$이므로 다음과 같은 두 가지 경우가 성립한다. (1) $f(a)=2$이고 $f(b)=3$. (2) $f(a)=3$이고 $f(b)=2$. 조건에서 $f(a)>f(b)$이므로 $f(a)=3$이고 $f(b)=2$이다.
      source_flow: 예시 답안
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 $a=12s+3,\ b=12t+2$인 $s,t$가 존재한다. 그런데 $2a+b^2=2(12s+3)+(12t+2)^2=12(2s+12t^2+4t)+10$이므로 $f(2a+b^2)=10$이다.
      source_flow: 예시 답안
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $f(a)=3$, $f(b)=2$를 구했다.
      depends_on: []
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $f(2a+b^2)=10$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-1
  stem: |
    [2] 집합 $X=\{-2,-1,0,1,2\}$에 대하여 다음 물음에 답하시오.

    (1) $a,b,c\in X$에 대하여 $a+b\sqrt3+c\sqrt7=0$일 때 $a+b+c$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: $a+b\sqrt3+c\sqrt7=0$이므로 $a^2=(b\sqrt3+c\sqrt7)^2=3b^2+7c^2+2bc\sqrt{21}$이다. 따라서 $a^2-3b^2-7c^2-2bc\sqrt{21}=0$이므로 $a^2-3b^2-7c^2=0$이고 $2bc=0$이다.
      source_flow: 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: $bc=0$이므로 $b=0$ 또는 $c=0$이다. 만일 $b=0$이면 $a+c\sqrt7=0$이므로 $a=0$이고 $c=0$이다. 만일 $c=0$이면 $a+b\sqrt3=0$이므로 $a=0$이고 $b=0$이다. 그러므로 $a+b+c=0$이다.
      source_flow: 예시 답안
      criteria:
      - 2-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 5
      evidence: $a^2-3b^2-7c^2=0$, $2bc=0$을 구했다.
      depends_on: []
      steps:
      - 21b-1
    - id: 2-1.A1
      mark_type: A
      points: 5
      evidence: $a+b+c=0$을 구했다.
      depends_on:
      - 2-1.M1
      steps:
      - 21b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (2) $A$는 집합 $X$의 공집합이 아닌 부분집합이고 명제 ‘$a,b\in A\rightarrow a-b\in A$.’를 만족시킨다. 이때 집합 $A$를 구하시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: set
    value: '{0}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: $a\in A,\ a\ne0$이라면 $a-a\in A$이므로 $0\in A$이다. 또한 $0-a\in A$이므로 $-a\in A$이고 $a-(-a)\in A$이므로 $2a\in A$이다. 이와 같은 방법으로 모든 $n\in\mathbb{N}$에 대하여 $na\in A$이므로 집합 $A$는 무한집합이다.
      source_flow: 예시 답안
      criteria:
      - 2-2.M1
      - 2-2.M2
    - id: 22b-2
      content: 그런데 $A$는 $X$의 부분집합이므로 모순이 되어 $a\ne0$이면 $a\notin A$이다. 만일 $A=\{0\}$이면 명제 ‘$a,b\in A\rightarrow a-b\in A$.’가 참이므로 $A=\{0\}$이다.
      source_flow: 예시 답안
      criteria:
      - 2-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.M1
      mark_type: M
      points: 3
      evidence: $a\in A,\ a\ne0$에 대하여 $-a\in A$임을 보였다.
      depends_on: []
      steps:
      - 22b-1
    - id: 2-2.M2
      mark_type: M
      points: 5
      evidence: $a\in A,\ a\ne0$일 때 $n\in\mathbb{N}$에 대하여 $na\in A$임을 보였다.
      depends_on:
      - 2-2.M1
      steps:
      - 22b-1
    - id: 2-2.A1
      mark_type: A
      points: 4
      evidence: $A=\{0\}$임을 보였다.
      depends_on:
      - 2-2.M1
      - 2-2.M2
      steps:
      - 22b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-1
  stem: |
    [3] $f(x)$와 $g(x)$를 다음과 같이 정의할 때 물음에 답하시오.

    $f(x)=x^2-4x-32$, $g(x)=x^2-2ax+a-2\quad(1\le a<2)$

    (1) $y=f(x)$의 그래프와 $y=g(x)$의 그래프는 모두 $x$축과 서로 다른 두 점에서 만남을 보이시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: proof
    value: proof
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: $f(x)$의 판별식은 $16+128=144>0$이다. 또한 $g(x)$의 판별식은 $4a^2-4a+8=4\left(a-\dfrac12\right)^2+7>0$이다. 따라서 $y=f(x)$의 그래프와 $y=g(x)$의 그래프는 모두 $x$축과 서로 다른 두 점에서 만난다.
      source_flow: 예시 답안
      criteria:
      - 3-1.R1
      - 3-1.R2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.R1
      mark_type: R
      points: 3
      evidence: $f(x)$의 판별식 $16+128=144>0$을 보였다.
      depends_on: []
      steps:
      - 31b-1
    - id: 3-1.R2
      mark_type: R
      points: 3
      evidence: $g(x)$의 판별식 $4a^2-4a+8>0$을 보였다.
      depends_on: []
      steps:
      - 31b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    (2) 조건 ‘$p:f(x)g(x)\le0$’의 진리집합에 속하는 모든 구간의 길이의 합을 $L$이라 할 때 $L$을 구하시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: L=12-2*sqrt(a^2-a+2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: $f(x)=0$을 만족시키는 $x$값은 $-4,8$이고 $g(x)=0$을 만족시키는 $x$값은 $a-\sqrt{a^2-a+2}$, $a+\sqrt{a^2-a+2}$이다. 그런데 $1\le a<2$이므로 $-4<a-\sqrt{a^2-a+2}<a+\sqrt{a^2-a+2}<8$이다.
      source_flow: 예시 답안
      criteria:
      - 3-2.M1
      - 3-2.M2
    - id: 32b-2
      content: 또한 $f(x)$와 $g(x)$의 이차항의 계수가 양수이고 $f(0)<0,\ g(0)<0$이므로 조건 $p:f(x)g(x)\le0$의 진리집합에 속하는 모든 구간은 $\left[-4,a-\sqrt{a^2-a+2}\right]\cup\left[a+\sqrt{a^2-a+2},8\right]$이다.
      source_flow: 예시 답안
      criteria:
      - 3-2.M3
    - id: 32b-3
      content: 그러므로 $L=8-\left(a+\sqrt{a^2-a+2}\right)+\left(a-\sqrt{a^2-a+2}\right)-(-4)=12-2\sqrt{a^2-a+2}$이다.
      source_flow: 예시 답안
      criteria:
      - 3-2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-2.M1
      mark_type: M
      points: 2
      evidence: $f(x)=0$의 해 $-4,8$을 구했다.
      depends_on: []
      steps:
      - 32b-1
    - id: 3-2.M2
      mark_type: M
      points: 2
      evidence: $g(x)=0$의 해 $a\pm\sqrt{a^2-a+2}$를 구했다.
      depends_on: []
      steps:
      - 32b-1
    - id: 3-2.M3
      mark_type: M
      points: 6
      evidence: 진리집합에 속하는 구간 $\left[-4,a-\sqrt{a^2-a+2}\right]\cup\left[a+\sqrt{a^2-a+2},8\right]$를 구했다.
      depends_on:
