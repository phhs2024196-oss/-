  stem: |
    구간 $(-\infty,\infty)$에서 정의된 두 함수 $F(x),\ G(x)$는 다음과 같다.
    $$F(x)=\int_0^x(t^3+4t+1-\sin t^3)\,dt,\quad G(x)=F(x^2)-1$$
    이 두 함수에 대하여 다음 물음에 답하시오.

    [1]

    (1) $F(1)-F(-1)$의 값을 구하시오. [10점]
