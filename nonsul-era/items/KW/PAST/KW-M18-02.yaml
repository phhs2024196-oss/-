stimuli:
- label: '1'
  body: |
    함수의 증가와 감소
    함수 $f(x)$가 어떤 열린구간에서 미분 가능할 때, 그 구간의 모든 $x$에 대하여
    ㉠ $f^{\prime}(x)>0$이면 $f(x)$는 그 구간에서 증가한다.
    ㉡ $f^{\prime}(x)<0$이면 $f(x)$는 그 구간에서 감소한다.
- label: '2'
  body: |
    미적분의 기본 정리
    함수 $f(t)$가 구간 $[a,b]$에서 연속이고 $f(t)$의 한 부정적분을 $F(t)$라고 하면 $\displaystyle\int_a^bf(t)\,dt=F(b)-F(a)$
- label: '3'
  body: |
    적분과 미분의 관계
    함수 $f(t)$가 구간 $[a,b]$에서 연속일 때, $\dfrac{d}{dx}\displaystyle\int_a^xf(t)\,dt=f(x)$ (단, $a<x<b$)
- label: '4'
  body: |
    사이값 정리
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면, $f(a)$와 $f(b)$ 사이의 임의의 값 $k$에 대하여 $f(c)=k\ (a<c<b)$인 $c$가 적어도 하나 존재한다.
- label: '5'
  body: |
    합성함수의 미분법
    미분 가능한 두 함수 $y=f(u),\ u=g(x)$에 대하여 합성합수 $y=f(g(x))$의 도함수는
    $\dfrac{dy}{dx}=\dfrac{dy}{du}\cdot\dfrac{du}{dx}$ 또는 $y^{\prime}=f^{\prime}(g(x))g^{\prime}(x)$
    [판독확인: 원문 표기 '합성합수'(합성함수의 오기로 보이나 원문 그대로)]
- label: '6'
  body: |
    곡선의 오목과 볼록
    함수 $f(x)$가 어떤 구간에서
    ㉠ $f^{\prime\prime}(x)>0$이면 곡선 $y=f(x)$는 이 구간에서 아래로 볼록(또는 위로 오목)하다.
    ㉡ $f^{\prime\prime}(x)<0$이면 곡선 $y=f(x)$는 이 구간에서 위로 볼록(또는 아래로 오목)하다.
- label: '7'
  body: |
    모든 실수 $t$에 대하여 다음이 성립한다.
    $$\lvert\sin t\rvert\le\lvert t\rvert$$
- label: '8'
  body: |
    함수 $f(x)$와 $g(x)$가 닫힌구간 $[a,b]$에서 연속이고 이 구간에서 $f(x)\le g(x)$일 때, 다음이 성립한다.
    $$\int_a^bf(x)\,dx\le\int_a^bg(x)\,dx$$
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
