intent: |
  [1] (1) 적분의 여러 가지 성질을 이용하여 함수의 값을 구할 수 있는지를 평가하는 문제이다. (2) 정적분 계산 및 정적분의 성질을 이용하여 함수의 크기를 측정하는 문제이다. (3) 정적분의 성질 및 사이값정리를 이용하여 방정식의 근의 존재성을 아는 지를 평가하는 문제이다. [2] (1) 적분형태로 표현된 함수의 도함수 및 합성함수의 도함수를 구할 수 있는지를 평가하고 도함수의 부호를 이용하여 함수의 증가와 감소를 아는 지를 평가하는 문제이다. (2) 함수의 미분 및 증감을 사용하여 극값을 구할 수 있는 지를 평가하는 문제이다. (3) 주어진 함수의 이계도함수를 구하고 이계도함수의 부호와 함수의 그래프의 오목, 볼록과의 관계를 사용할 수 있는 지를 측정하는 문제이다. (공식 해설 '출제 의도' 원문)
key_idea: |
  $F(1)-F(-1)$은 $\int_{-1}^1$로 묶어 홀함수 항을 소거한다. $\lvert\sin t\rvert\le\lvert t\rvert$로 $-t^3\le-\sin t^3\le t^3$을 만들어 $F(1)$을 $3$과 $3.5$ 사이에 넣고 사이값 정리를 쓴다. $G^{\prime}(x)=2xF^{\prime}(x^2)$의 부호는 $x$의 부호와 같고, $G^{\prime\prime}>0$으로 항상 아래로 볼록이다.
stuck: |
  [1](2)에서 $F(1)$을 직접 구할 수 없어 $-\sin t^3$을 $\pm t^3$으로 위아래에서 눌러 적분 부등식을 세우는 단계
