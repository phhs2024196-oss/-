stimuli:
- label: '1'
  body: 실수 $a$에 대하여 $[a]$는 $a$를 넘지 않는 최대의 정수이다.
- label: '2'
  body: 이차방정식 $ax^2+bx+c=0$의 근은 $x=\dfrac{-b\pm\sqrt{b^2-4ac}}{2a}$이다.
- label: '3'
  body: 다항식 $A$를 다항식 $B$로 나누었을 때의 몫을 $Q$, 나머지를 $R$라고 하면 $A=BQ+R$ (단, $R$의 차수는 $B$의 차수보다 낮다.) 특히, $R=0$, 즉, $A=BQ$일 때, $A$는 $B$로 나누어떨어진다고 한다.
- label: '4'
  body: 세 집합 $X,W,Y$에 대하여 두 함수 $f:X\to W,\ g:W\to Y$의 합성함수 $g\circ f$는 $g\circ f:X\to Y,\ (g\circ f)(x)=g(f(x))$이다.
- label: '5'
  body: 집합 $X$와 함수 $f:X\to X$에 대하여 $f\circ f$는 $f$를 두 번 합성한 함수, $f\circ f\circ f$는 $f$를 세 번 합성한 함수를 나타낸다.
