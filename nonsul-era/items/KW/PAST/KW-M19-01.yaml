    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [3] 다항식 $g(x)=x^2+x+1$에 대하여 $g(x)=0$의 하나의 허근을 $w$라고 하자. 다항식 $f(x)=ax^{52}+bx^{27}+1$가 $g(x)$로 나누어떨어진다고 가정할 때, 즉, $f(x)=q(x)g(x)$인 다항식 $q(x)$가 존재할 때, 실수 $a$와 $b$를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=0; b=-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    source_flow: 예시 답안
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(w)=q(w)g(w)=0$이고 $w^3=1$이므로
      source_flow: 예시 답안
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $f(w)=aw^{52}+bw^{27}+1=aw+b+1=0$이다.
      source_flow: 예시 답안
      criteria:
      - 3.M2
    - id: 3b-3
      content: 그런데 $w=\dfrac{-1+\sqrt3i}{2}$ 또는 $w=\dfrac{-1-\sqrt3i}{2}$이고 $a$와 $b$는 실수이므로 $a=0$이고 $b=-1$이다.
      source_flow: 예시 답안
      criteria:
      - 3.A3
