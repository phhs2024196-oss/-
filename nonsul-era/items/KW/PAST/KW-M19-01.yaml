subparts:
- id: '1'
  stem: |
    [1] 모든 자연수에서 정의된 함수 $f(n)=\sqrt{n+2}+\sqrt{n+1}$의 그래프를 $x$축의 방향으로 음의 정수 $k$만큼 평행이동시켰을때 얻는 함수를 $g(n)$이라 하자. 이때 $\displaystyle\sum_{n=1}^{2018}\frac{2}{g(n)}$를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 2*(sqrt(2020-k)-sqrt(2-k))
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g(n)=f(n-k)=\sqrt{n-k+2}+\sqrt{n-k+1}$이다. 그런데
      source_flow: 예시 답안
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $$\frac{2}{g(n)}=\frac{2}{\sqrt{n-k+2}+\sqrt{n-k+1}}=\frac{2(\sqrt{n-k+2}-\sqrt{n-k+1})}{(\sqrt{n-k+2}+\sqrt{n-k+1})(\sqrt{n-k+2}-\sqrt{n-k+1})}=2(\sqrt{n-k+2}-\sqrt{n-k+1})$$
        이므로
      source_flow: 예시 답안
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $$\sum_{n=1}^{2018}\frac{2}{g(n)}=\sum_{n=1}^{2018}2(\sqrt{n-k+2}-\sqrt{n-k+1})=2(\sqrt{2020-k}-\sqrt{2-k})$$
        이다.
      source_flow: 예시 답안
      criteria:
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $g(n)=\sqrt{n-k+2}+\sqrt{n-k+1}$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $\dfrac{2}{g(n)}=2(\sqrt{n-k+2}-\sqrt{n-k+1})$을 구했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: $\sum_{n=1}^{2018}\dfrac{2}{g(n)}=2(\sqrt{2020-k}-\sqrt{2-k})$를 구했다.
      depends_on:
      - 1.M1
      - 1.M2
      implied_ok: false
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-1
  stem: |
    [2] 함수 $f(x)=\dfrac{1}{1-x}$에 대하여 다음 물음에 답하시오.

    (1) $k$가 자연수일 때 $f$를 $3k$번 합성한 함수를 $g(x)$라고 하자. 이때 $\displaystyle\lim_{x\to3}\frac{f(x)}{g(x)}$를 구하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: value
    value: -1/6
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    source_flow: 예시 답안
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $(f\circ f)(x)=1-\dfrac1x$, $(f\circ f\circ f)(x)=x$, $(f\circ f\circ f\circ f)(x)=f(x)$, $\cdots$이므로 $g(x)=x$이다.
      source_flow: 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: 따라서 $\displaystyle\lim_{x\to3}\frac{f(x)}{g(x)}=\lim_{x\to3}\frac{\dfrac1{1-x}}{x}=\lim_{x\to3}\frac{1}{x(1-x)}=-\frac16$이다.
      source_flow: 예시 답안
      criteria:
      - 2-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-1.M1
      mark_type: M
      points: 5
      evidence: $g(x)=x$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 21b-1
    - id: 2-1.A2
      mark_type: A
      points: 4
      evidence: $\lim_{x\to3}\dfrac{f(x)}{g(x)}=-\dfrac16$을 구했다.
      depends_on:
      - 2-1.M1
      implied_ok: false
      steps:
      - 21b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-2
  stem: |
    (2) $n$이 자연수일 때 $f$를 $n$번 합성한 함수를 $h(x)$라고 할 때 $h(x)=1-\dfrac1x$이면 $n=3t+2$인 정수 $t$가 존재함을 설명하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: proof
    value: $n=3t$이면 $h(x)=x$, $n=3t+1$이면 $h(x)=\dfrac1{1-x}$이므로 $h(x)=1-\dfrac1x$이면 $n=3t+2$이다.
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    source_flow: 예시 답안
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $n=3t$ 또는 $n=3t+1$ 또는 $n=3t+2$인 정수 $t$가 존재한다.
      source_flow: 예시 답안
      criteria:
      - 2-2.R1
    - id: 22b-2
      content: 만일 $n=3t$이면 $h(x)=x$이다. 만일 $n=3t+1$이면 $h(x)=\dfrac1{1-x}$이다. 따라서, $n=3t+2$인 정수 $t$가 존재한다.
      source_flow: 예시 답안
      criteria:
      - 2-2.R2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2-2.R1
      mark_type: R
      points: 3
      evidence: $n=3t$ 또는 $n=3t+1$ 또는 $n=3t+2$인 정수 $t$가 존재함을 설명했다.
      depends_on: []
      implied_ok: false
      steps:
      - 22b-1
    - id: 2-2.R2
      mark_type: R
      points: 4
      evidence: $n=3t$이면 $h(x)=x$이고 $n=3t+1$이면 $h(x)=\dfrac1{1-x}$임을 설명했다.
      depends_on:
      - 2-2.R1
      implied_ok: false
      steps:
      - 22b-2
