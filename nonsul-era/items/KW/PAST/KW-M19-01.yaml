- id: '4'
  stem: |
    [4] 두 다항식 $f(x)=x^2-2x-3,\ g(x)=x^2-2x-5$에 대하여 방정식
    $$2[f(x)]+1=[g(x)]-1$$
    을 만족시키는 정수 $x$를 모두 구하시오. [14점]
  points: 14
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    source_flow: 예시 답안
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $[f(x)]=[x^2-2x]-3,\ [g(x)]=[x^2-2x]-5$이므로 $2[x^2-2x]-5=[x^2-2x]-6$이다. 따라서 $[x^2-2x]=-1$이고 $-1\le[x^2-2x]<0$이다. [판독확인: 원문 표기 $-1\le[x^2-2x]<0$ — 가우스 기호 안이 아니라 $-1\le x^2-2x<0$을 뜻하는 것으로 보이나 원문 그대로]
      source_flow: 예시 답안
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        부등식 $-1\le[x^2-2x]$로부터 $[x^2-2x+1]\ge0$이다. 그런데 모든 $x$에 대하여 $x^2-2x+1\ge0$이므로, 부등식 $-1\le[x^2-2x]$은 모든 실수 $x$에 대하여 성립한다.
      source_flow: 예시 답안
      criteria:
      - 4.M2
    - id: 4b-3
      content: |
        또한 $[x^2-2x]<0$으로부터 $x^2-2x<0$이고 $x(x-2)<0$이므로 $0<x<2$이다.
      source_flow: 예시 답안
      criteria:
      - 4.M3
    - id: 4b-4
      content: 그러므로 주어진 방정식을 만족시키는 정수 $x$는 $x=1$이다.
      source_flow: 예시 답안
      criteria:
      - 4.A4
