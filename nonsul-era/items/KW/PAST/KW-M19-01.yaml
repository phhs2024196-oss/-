key_idea: '[1] 평행이동으로 $g(n)=f(n-k)$를 얻고 분모의 유리화로 합을 망원급수로 만든다. [2] $f$의 3번 합성이 항등함수임을 이용해 $g(x)=x$를 얻고 극한을 구하며, $n$을 3으로 나눈 나머지로 분류한다. [3] 허근 $w$가 $w^3=1$임을 이용해 $f(w)=aw+b+1=0$으로 정리하고 $a,b$가 실수임을 쓴다. [4] $[f(x)]=[x^2-2x]-3$으로 정리해 $[x^2-2x]=-1$을 만들고 이차부등식을 푼다.'
stuck: '[2](2) 3번 합성이 항등함수라는 주기성을 $n=3t+r$ 꼴로 정리하는 단계, [3] $w^{52}=w$, $w^{27}=1$로 줄이고 허근이므로 $a=0$임을 추론하는 단계, [4] $[x^2-2x]=-1$을 $-1\le x^2-2x<0$으로 바꾸는 단계'
