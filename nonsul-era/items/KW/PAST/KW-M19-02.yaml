stimuli:
- label: '1'
  body: |
    도형의 평행이동
    방정식 $f(x,y)=0$이 나타내는 도형을 $x$축의 방향으로 $a$만큼, $y$축의 방향으로 $b$만큼 평행이동한 도형의 방정식은
    $$f(x-a,y-b)=0$$
- label: '2'
  body: |
    이계도함수를 이용한 극대와 극소의 판정
    연속인 이계도함수를 갖는 함수 $f(x)$에 대하여 $f^{\prime}(a)=0$일 때
    ㉠ $f^{\prime\prime}(a)<0$이면 $f(x)$는 $x=a$에서 극대이고, 극댓값 $f(a)$를 가진다.
    ㉡ $f^{\prime\prime}(a)>0$이면 $f(x)$는 $x=a$에서 극소이고, 극솟값 $f(a)$를 가진다.
- label: '3'
  body: |
    함수의 곱의 미분법
    미분 가능한 두 함수 $f(x)$, $g(x)$에 대하여
    $$\{f(x)g(x)\}^{\prime}=f^{\prime}(x)g(x)+f(x)g^{\prime}(x)$$
- label: '4'
  body: |
    곡선과 $x$축 사이의 넓이
    함수 $f(x)$가 구간 $[a,b]$에서 연속일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a,\ y=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b\lvert f(x)\rvert\,dx$$
    [판독확인: 원문 표기 '두 직선 $x=a,\ y=b$' — 문맥상 $x=b$로 보이나 원문 그대로]
- label: '5'
  body: |
    합성함수의 미분법
    미분가능한 두 함수 $y=f(u)$, $u=g(x)$에 대하여 합성함수 $y=f(g(x))$를 미분하면
    $$\frac{dy}{dx}=\frac{dy}{du}\cdot\frac{du}{dx}\quad\text{또는}\quad\{f(g(x))\}^{\prime}=f^{\prime}(g(x))g^{\prime}(x)$$
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: '1'
  stem: |
    [1] $y=\log_2x$를 $y$축의 방향으로 평행이동시켜 점 $(3,k)$ ($k$는 자연수)를 지나도록 하는 곡선의 $x$절편을 $a_k$라 하자. 이때 $\displaystyle\sum_{k=1}^{\infty}a_k$의 값을 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    source_flow: 예시 답안
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=\log_2x$를 $y$축의 방향으로 $b$만큼 평행이동시키면 $y=\log_2x+b$이다. 이 곡선이 점 $(3,k)$를 지나기 때문에 $b=\log_2\dfrac{2^k}{3}$이다. 이 곡선의 $x$절편 $a_k=\dfrac3{2^k}$이므로
      source_flow: 예시 답안
      criteria:
      - 1.M1
    - id: 1b-2
      content: $$\sum_{k=1}^{\infty}a_k=\frac{\dfrac32}{1-\dfrac12}=3$$
      source_flow: 예시 답안
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 이 곡선의 $x$절편 $a_k=\dfrac{3}{2^k}$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $\sum_{k=1}^{\infty}a_k=\dfrac{\frac32}{1-\frac12}=3$을 구했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [2] 열린구간 $(0,2\pi)$에서 정의된 함수 $f(x)=\dfrac{\cos x}{e^{3x}}$가 $x=a$에서 극솟값을 갖는다. 이때 $\tan a$와 $\cos a$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: tan=-3; cos=-1/sqrt(10)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    source_flow: 예시 답안
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)=e^{-3x}\cos x$이므로 $f^{\prime}(x)=-e^{-3x}(3\cos x+\sin x)$
        $f^{\prime}(a)=0$이므로 $3\cos a+\sin a=0$. 여기서 $\cos a\ne0$이다. (만약 $\cos a=0$이라면 $a=\dfrac\pi2$ 또는 $a=\dfrac{3\pi}{2}$이다. 이때 $\sin\dfrac\pi2=1$이고 $\sin\dfrac{3\pi}2=-1$이므로 두 경우 모두 $3\cos a+\sin a\ne0$이다.) 따라서 양변을 $\cos a$으로 나눌 수 있고 그렇게 하면 $\tan a=-3$
      source_flow: 예시 답안
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $f^{\prime\prime}(x)=e^{-3x}(8\cos x+6\sin x)$이고 $3\cos a+\sin a=0$으로부터 $f^{\prime\prime}(a)=e^{-3a}(-10\cos a)$이며 제시문 2의 ㉡에 의해 $f^{\prime\prime}(a)>0$이므로 $\cos a<0$이고 $\tan^2a+1=\sec^2a$으로부터
        $$\cos a=-\frac{1}{\sqrt{10}}$$
      source_flow: 예시 답안
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $f^{\prime}(a)=0$이므로 $3\cos a+\sin a=0$을 구한 후 $\cos a\ne0$임을 확인하고 양변을 $\cos a$로 나누어 $\tan a=-3$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: $f^{\prime\prime}(x)=e^{-3x}(8\cos x+6\sin x)$를 올바로 얻고 $f^{\prime\prime}(a)>0$을 이용하여 $\cos a<0$이므로 $\cos a=-\dfrac1{\sqrt{10}}$을 구했다.
      depends_on:
      - 2.M1
      implied_ok: false
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-1
  stem: |
    [3] 자연수 $n$에 대하여 구간 $\left[\left(n-\dfrac14\right)\pi,\ \left(n+\dfrac14\right)\pi\right]$에서 곡선 $y=\left\lvert\left(\dfrac13\right)^n\tan x\right\rvert$와 $x$축, 그리고 직선 $x=\left(n-\dfrac14\right)\pi$와 $x=\left(n+\dfrac14\right)\pi$으로 둘러싸인 부분의 넓이를 $S_n$이라하자. 다음 물음에 답하시오.

    (1) 부정적분 $\displaystyle\int\tan x\,dx$를 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: expression
    value: -log(Abs(cos(x)))+C
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    source_flow: 예시 답안
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $\displaystyle\int\tan x\,dx=\int\frac{\sin x}{\cos x}dx$에서 $t=\cos x$로 치환하면
        $$\int\tan x\,dx=\int\frac{\sin x}{\cos x}dx=-\int\frac1t\,dt=-\ln\lvert t\rvert+C\quad(\text{단, }C\text{는 적분상수})$$
      source_flow: 예시 답안
      criteria:
      - 3-1.M1
      - 3-1.A2
    - id: 31b-2
      content: 구하는 식은 $-\ln\lvert\cos x\rvert+C$ (단, $C$는 적분상수)
      source_flow: 예시 답안
      criteria:
      - 3-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 4
      evidence: 치환적분법을 활용하여 $\int\tan x\,dx=\int\dfrac{\sin x}{\cos x}dx=-\int\dfrac1t\,dt$로 나타냈다.
      depends_on: []
      implied_ok: false
      steps:
      - 31b-1
    - id: 3-1.A2
      mark_type: A
      points: 2
      evidence: $-\ln\lvert t\rvert+C$, 즉 $-\ln\lvert\cos x\rvert+C$를 구했다. (적분상수를 빠트리면 $-2$점)
      depends_on:
      - 3-1.M1
      implied_ok: false
      steps:
      - 31b-1
      - 31b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 3-2
  stem: |
    (2) $S_n$을 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: (1/3)**n*log(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    source_flow: 예시 답안
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $y=\tan x$의 그래프를 통해
        $$\int_{\left(n-\frac14\right)\pi}^{\left(n+\frac14\right)\pi}\lvert\tan x\rvert\,dx=2\int_{n\pi}^{\left(n+\frac14\right)\pi}\tan x\,dx=2\int_0^{\frac\pi4}\tan x\,dx=2\Bigl[-\ln\lvert\cos x\rvert\Bigr]_0^{\frac\pi4}=\ln2$$
        임을 알 수 있다.
      source_flow: 예시 답안
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: 그러므로 $S_n=\left(\dfrac13\right)^n\ln2$
      source_flow: 예시 답안
      criteria:
      - 3-2.A2
  rubric:
