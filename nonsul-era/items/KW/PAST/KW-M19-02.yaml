- id: 4-1
  stem: |
    [4] 양의 실수 $t$에 대하여 좌표평면에서 $x,\ y$에 대한 연립부등식
    $$\begin{cases}y\ge t(x+2)\\(x+2)^2+(y-3)^2\le9\end{cases}$$
    가 나타내는 영역의 넓이를 $f(t)$라 하자. 다음 물음에 답하시오.

    (1) 원 $C:(x+2)^2+(y-3)^2=9$의 중심을 $\mathrm{O}$, 원 $C$와 직선 $l:y=t(x+2)$가 만나는 두 점을 각각 $\mathrm{A},\mathrm{B}$라 하자. 직선 $l$이 $x$축의 양의 방향과 이루는 각의 크기를 $\theta\ \left(0<\theta<\dfrac\pi2\right)$라 할 때 $\angle\mathrm{AOB}$의 크기와 부채꼴 $\mathrm{OAB}$와 삼각형 $\mathrm{OAB}$의 넓이를 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: expression
    value: AOB=2*theta; sector=9*theta; triangle=9*sin(2*theta)/2
    equivalents: []
    tolerance: null
