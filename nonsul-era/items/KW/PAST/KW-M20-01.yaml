      depends_on:
      - 3-1.M1
      implied_ok: false
      steps:
      - 31b-1
    - id: 3-1.R3
      mark_type: R
      points: 2
      evidence: $f\circ f^{-1}$는 항등함수이므로 $a=b$임을 설명하였다.
      depends_on:
      - 3-1.M2
      implied_ok: false
      steps:
      - 31b-1
