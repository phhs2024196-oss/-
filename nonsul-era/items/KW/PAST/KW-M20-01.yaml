    - id: 3-3.M2
      mark_type: M
      points: 3
      evidence: 모든 $c\in X$에 대하여 $(f^{-1}\circ f^{-1})(c)=c$가 성립한다고 가정하였다.
      depends_on: []
      implied_ok: false
      steps:
      - 33b-1
    - id: 3-3.M3
      mark_type: M
      points: 2
      evidence: $f^{-1}(c)=f(c)$임을 보였다.
      depends_on:
      - 3-3.M2
