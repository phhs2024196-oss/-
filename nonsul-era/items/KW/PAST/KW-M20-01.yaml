      content: |
        $t\in B$이면 $t(t-1)>0$이고 $t>0$이다. 따라서 $t\in B$이면 $t>1$이므로 $B=\{t\mid t>1,\ \text{단, }t\text{는 실수}\}$이다.
      source_flow: 예시 답안
      criteria:
      - 2-2.M1
    - id: 22b-2
      content: |
        그런데 $t>1$이면 $t+10>1$이므로 조건 “$t\in B$이면 $t+10\in B$이다”를 만족시킨다. 그러므로 (1)에 의해서 $B$는 무한집합이다.
      source_flow: 예시 답안
      criteria:
      - 2-2.M2
      - 2-2.A3
