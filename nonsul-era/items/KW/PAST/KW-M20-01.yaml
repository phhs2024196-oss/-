- id: 3-3
  stem: |
    (3) 함수 $f$에 대한 다음 명제의 참 또는 거짓을 판정하고 대우를 이용하여 증명하시오. [10점]

    $(f\circ f)(a)\ne a$인 $a\in X$가 존재하면 $(f^{-1}\circ f^{-1})(c)\ne c$인 $c\in X$가 존재한다.
  points: 10
  depends_on:
  - 3-1
  answer:
    kind: proof
    value: 증명; truth=참
    equivalents: []
    tolerance: null
  solutions:
  - id: S33-B
    audience: B
    method_no: 1
    steps:
    - id: 33b-1
      content: |
        모든 $c\in X$에 대하여 $(f^{-1}\circ f^{-1})(c)=c$가 성립한다고 가정하자. 그러면 $f((f^{-1}\circ f^{-1})(c))=f(c)$이다.
        그런데 $f((f^{-1}\circ f^{-1})(c))=(f\circ f^{-1})(f^{-1}(c))=f^{-1}(c)$이므로 $f^{-1}(c)=f(c)$이다.
      source_flow: 예시 답안
      criteria:
      - 3-3.M2
      - 3-3.M3
    - id: 33b-2
      content: |
        따라서 $c=f(f^{-1}(c))=f(f(c))$이므로 모든 $c\in X$에 대하여 $(f\circ f)(c)=c$이다.
        즉, 주어진 명제의 대우는 참이므로 주어진 명제는 참이다.
      source_flow: 예시 답안
      criteria:
      - 3-3.R1
      - 3-3.R4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
