- id: 3-1
  stem: |
    [3] 실수 전체의 집합의 공집합이 아닌 부분집합 $X$를 정의역으로 하는 함수 $f:X\to X$가 일대일 대응일 때 다음 물음에 답하시오.

    (1) 함수 $f$의 역함수 $f^{-1}:X\to X$는 일대일함수임을 증명하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $f^{-1}(a)=f^{-1}(b)$라고 가정하면 $f(f^{-1}(a))=f(f^{-1}(b))$이고 $f\circ f^{-1}$는 항등함수이므로 $a=b$이다. 따라서 $f^{-1}$는 일대일함수이다.
      source_flow: 예시 답안
      criteria:
      - 3-1.M1
      - 3-1.M2
      - 3-1.R3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
