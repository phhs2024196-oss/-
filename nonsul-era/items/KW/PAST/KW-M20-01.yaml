      mark_type: M
      points: 2
      evidence: $A$를 유한집합이라 가정하고 $A$에 속하는 원소 중에 가장 큰 원소가 존재함을 설명하였다.
      depends_on: []
      implied_ok: false
      steps:
      - 21b-1
    - id: 2-1.M2
      mark_type: M
      points: 2
      evidence: $A$에 속하는 원소 중에 가장 큰 원소를 $a$라 놓고 $a+10\in A$을 설명하였다.
      depends_on:
      - 2-1.M1
      implied_ok: false
      steps:
      - 21b-1
    - id: 2-1.R3
      mark_type: R
      points: 2
      evidence: $a<a+10$이므로 $a$가 $A$에 속하는 원소 중에 가장 큰 원소라는 것에 모순임을 보였다.
      depends_on:
      - 2-1.M2
      implied_ok: false
