subparts:
- id: '1'
  stem: |
    [1] 부등식 $kx-|k|x-k^2-k+56\ge0$이 모든 실수 $x$에 대하여 성립할 때 $k$의 최솟값과 최댓값을 구하시오. [13점]
  points: 13
  depends_on: []
  answer:
    kind: expression
    value: min=0; max=7
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        부등식을 정리하면 $(k-|k|)x\ge k^2+k-56$이다. 그런데 $k<0$이면 $k-|k|=2k<0$이고 $x\le\dfrac{k^2+k-56}{2k}$이므로 부등식은 모든 실수 $x$에 대해서 성립하지 않는다.
        그러므로 $k\ge0$이고 $k-|k|=0$이다.
      source_flow: 예시 답안
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b-2
      content: |
        따라서 $k^2+k-56\le0$이므로 $-8\le k\le7$이다. 즉, $k\ge0$이고 $-8\le k\le7$이므로 $0\le k\le7$이다.
        그러므로 $k$의 최솟값은 $0$이고 $k$의 최댓값은 $7$이다.
      source_flow: 예시 답안
      criteria:
      - 1.M3
      - 1.A4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $k\ge0$임을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $k-|k|=0$을 구했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: $-8\le k\le7$를 구했다.
      depends_on:
      - 1.M2
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A4
      mark_type: A
      points: 4
      evidence: $k$의 최솟값 $0$, $k$의 최댓값 $7$을 구했다. (각각 2점씩)
      depends_on:
      - 1.M3
      implied_ok: false
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 2-1
  stem: |
    [2] 실수 전체의 집합의 공집합이 아닌 부분집합 $A$와 집합 $B=\{t\mid0<t<t^2,\ \text{단, }t\text{는 실수}\}$에 대하여 다음 물음에 답하시오.

    (1) $A$가 조건 “$a\in A$이면 $a+10\in A$이다”를 만족시킬 때 $A$는 무한집합임을 증명하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $A$가 유한집합이라 가정하면 $A$에 속하는 원소 중에 가장 큰 원소가 존재한다. 이를 $a$라 놓으면 주어진 조건에 따라서 $a+10\in A$이다.
      source_flow: 예시 답안
      criteria:
      - 2-1.M1
      - 2-1.M2
    - id: 21b-2
      content: |
        그런데 $a<a+10$이므로 $a$가 $A$에 속하는 원소 중에 가장 큰 원소라는 것에 모순이 된다. 따라서 $A$는 무한집합이다.
      source_flow: 예시 답안
      criteria:
      - 2-1.R3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
