- id: 3-2
  stem: |
    (2) 함수 $g:X\to X$, $g(x)=x^3$과 함수 $h:X\to X$에 대하여 $f\circ g=f\circ h$일 때 $h(5)$를 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '125'
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        $f\circ g=f\circ h$이므로 $f(g(x))=f(h(x))$이다. 그런데 $f$는 일대일함수이므로 $g(x)=h(x)$이다.
        그런데 $g(x)=x^3$이므로 $h(x)=x^3$이고 $h(5)=125$이다.
      source_flow: 예시 답안
