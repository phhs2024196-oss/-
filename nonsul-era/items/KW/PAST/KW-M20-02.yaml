        $-3\le x\le0$에서 $g'(x)\ge g(x)$이므로 두 곡선 $y=g(x)$와 $y=g'(x)$로 둘러싸인 도형의 넓이는
        $\displaystyle\int_{-3}^0\left\{3(x+3)^2-(x+3)^3\right\}dx=\left[(x+3)^3-\dfrac{(x+3)^4}4\right]_{-3}^0=\dfrac{27}4$이다.
