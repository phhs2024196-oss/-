stimuli:
- label: '1'
  body: |
    함수 $f(x)$가 구간 $[a,b]$에서 연속일 때, $\dfrac d{dx}\displaystyle\int_a^xf(t)\,dt=f(x)$ (단, $a<x<b$)
- label: '2'
  body: |
    함수 $f(x)$가 구간 $[a,b]$에서 연속이고 $f(x)$의 한 부정적분을 $F(x)$라고 하면 $\displaystyle\int_a^bf(x)\,dx=F(b)-F(a)$
- label: '3'
  body: |
    함수 $f(x)$가 세 실수 $a,\ b,\ c$를 포함하는 닫힌 구간에서 연속일 때, $\displaystyle\int_a^cf(x)\,dx+\int_c^bf(x)\,dx=\int_a^bf(x)\,dx$
- label: '4'
  body: |
    점 $(x_1,\ y_1)$과 직선 $ax+by+c=0$ 사이의 거리 $d$는 $d=\dfrac{|ax_1+by_1+c|}{\sqrt{a^2+b^2}}$
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 모든 실수 $x$에서 정의된 함수 $f(x)=\displaystyle\int_{x-2}^x(t+2|t-2|)\,dt$에 대하여 다음 물음에 답하시오.

    (1) $x\le2$일 때, $\displaystyle\lim_{x\to0}\dfrac{f(2x)-f(\sin x)}x$를 구하시오. [6점] [판독확인: 원문 표기 극한 $x\to0$ 앞에 "$x\le2$일 때"가 붙어 있음]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: '-2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $x\le2$이므로 $f(x)=\displaystyle\int_{x-2}^x(-t+4)\,dt=\left[-\dfrac12t^2+4t\right]_{x-2}^x=-2x+10$이다.
      source_flow: 예시 답안
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        따라서 $\displaystyle\lim_{x\to0}\dfrac{f(2x)-f(\sin x)}x=\lim_{x\to0}\dfrac{-4x+10+2\sin x-10}x=\lim_{x\to0}\left(-4+2\dfrac{\sin x}x\right)=-2$이다.
      source_flow: 예시 답안
      criteria:
      - 1-1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
