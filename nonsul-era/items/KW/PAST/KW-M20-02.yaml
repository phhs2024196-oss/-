- id: 1-3
  stem: |
    (3) $2\le x\le4$일 때, 곡선 $y=f(x)$ 위의 점을 $\mathrm P$라고 하자. 두 정점 $\mathrm A(3,0)$, $\mathrm B(4,2)$와 점 $\mathrm P$가 이루는 삼각형 $\mathrm{PAB}$의 넓이의 최솟값과 그때 점 $\mathrm P$의 좌표를 구하시오. [12점]
  points: 12
  depends_on:
  - 1-2
  answer:
    kind: expression
    value: min=3; P=(3,6)
    equivalents: []
    tolerance: null
  solutions:
  - id: S13-B
    audience: B
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $2\le x\le4$이면 $x-2\le2\le x$가 성립하므로
        $f(x)=\displaystyle\int_{x-2}^x(t+2|t-2|)\,dt=\int_{x-2}^2(-t+4)\,dt+\int_2^x(3t-4)\,dt=\left[-\dfrac12t^2+4t\right]_{x-2}^2+\left[\dfrac32t^2-4t\right]_2^x=2x^2-10x+18$이다.
      source_flow: 예시 답안
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        삼각형 $\mathrm{PAB}$에서 선분 $\mathrm{AB}$를 밑변으로 정하자. 그리고 곡선 $y=f(x)$ 위의 점 $\mathrm P$ 중에서 $y=f(x)$의 접선의 기울기가 직선 $\mathrm{AB}$의 기울기인 $2$와 같게 되는 점을 $\mathrm P_0$라고 하자. $f'(x)=4x-10=2$이므로 점 $\mathrm P_0$의 좌표는 $(3,6)$이다.
        점 $\mathrm P_0$는 곡선 위의 점 $\mathrm P$ 중에서 직선 $\mathrm{AB}$와 최단거리에 있는 점이므로 삼각형 $\mathrm P_0\mathrm{AB}$는 삼각형 $\mathrm{PAB}$의 넓이를 최소로 하는 삼각형이다.
      source_flow: 예시 답안
      criteria:
      - 1-3.M2
    - id: 13b-3
      content: |
        제시문 4를 이용하여 점 $\mathrm P_0$와 직선 $\mathrm{AB}$ 사이의 거리 $d$를 구하면, 직선 $\mathrm{AB}$의 방정식은 $y=2x-6$이므로 $d=\dfrac{|2\times3-6-6|}{\sqrt5}=\dfrac6{\sqrt5}$이다. 그리고 선분 $\mathrm{AB}$의 길이는 $\sqrt5$이다.
        따라서 삼각형 $\mathrm{PAB}$의 넓이의 최솟값인 삼각형 $\mathrm P_0\mathrm{AB}$의 넓이는 $\dfrac12\times\sqrt5\times\dfrac6{\sqrt5}=3$이다.
      source_flow: 예시 답안
      criteria:
      - 1-3.M3
      - 1-3.A4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
