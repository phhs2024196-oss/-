      mark_type: M
      points: 4
      evidence: $x\le2$일 때, $f(x)=-2x+10$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 11b-1
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: 극한값 $-2$를 구했다.
      depends_on:
      - 1-1.M1
      implied_ok: false
      steps:
      - 11b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 1-2
  stem: (2) 도함수 $\dfrac d{dx}f(x)$를 구하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: expression
    value: 2+2*Abs(x-2)-2*Abs(x-4)
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        제시문 1과 3을 이용하면 임의의 실수 $a$에 대해서
        $f(x)=\displaystyle\int_a^x(t+2|t-2|)\,dt+\int_{x-2}^a(t+2|t-2|)\,dt=\int_a^x(t+2|t-2|)\,dt-\int_a^{x-2}(t+2|t-2|)\,dt$이므로
      source_flow: 예시 답안
      criteria:
      - 1-2.M1
      - 1-2.M2
    - id: 12b-2
      content: |
        $\dfrac d{dx}f(x)=\dfrac d{dx}\displaystyle\int_a^x(t+2|t-2|)\,dt-\dfrac d{dx}\int_a^{x-2}(t+2|t-2|)\,dt=x+2|x-2|-(x-2)-2|(x-2)-2|=2+2|x-2|-2|x-4|$이다.
      source_flow: 예시 답안
      criteria:
      - 1-2.M3
      - 1-2.A4
