- id: 1-4
  stem: (4) 모든 실수 $x$에 대하여 $f(x)\ge\dfrac{11}2$임을 보이시오. [10점]
  points: 10
  depends_on:
  - 1-3
  answer:
    kind: proof
    value: 증명; min=11/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S14-B
    audience: B
    method_no: 1
    steps:
    - id: 14b-1
      content: |
        (a) $x\le2$일 때, (1)에서와 같이 $f(x)=-2x+10$이다.
        (b) $2\le x-2$ 즉, $4\le x$일 때, $f(x)=\displaystyle\int_{x-2}^x(3t-4)\,dt=\left[\dfrac32t^2-4t\right]_{x-2}^x=6x-14$이다.
      source_flow: 예시 답안
      criteria:
      - 1-4.M1
    - id: 14b-2
      content: |
        (c) $x-2\le2\le x$ 즉, $2\le x\le4$일 때, (3)에서와 같이 $f(x)=2x^2-10x+18=2\left(x-\dfrac52\right)^2+\dfrac{11}2$이다.
      source_flow: 예시 답안
      criteria:
      - 1-4.R2
      - 1-4.A3
    - id: 14b-3
      content: |
        실수 전체에서 연속인 함수 $f(x)$는 $x\le2$에서 감소이고, $2\le x\le4$에서 $f(x)\ge\dfrac{11}2$이며, $4\le x$에서는 증가이다. 따라서 모든 실수 $x$에 대하여 $f(x)\ge\dfrac{11}2$이다.
      source_flow: 예시 답안
      criteria:
      - 1-4.R2
      - 1-4.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
