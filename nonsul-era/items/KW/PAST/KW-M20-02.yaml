- id: 2-1
  stem: |
    [2] 계수가 실수인 삼차함수 $g(x)$는 다음 조건들을 모두 만족시킨다.

    (ⅰ) $g(x)$의 최고차항의 계수는 1이다.
    (ⅱ) $g(x)$는 도함수 $g'(x)$로 나누어 떨어진다.
    (ⅲ) $g(0)=27$

    (1) 함수 $g(x)$를 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: (x+3)**3
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        조건 (ⅰ)을 이용하여 $g(x)=x^3+ax^2+bx+c$라 하자.
        $g'(x)=3x^2+2ax+b$와 조건 (ⅱ)를 이용하면 $g(x)=\left(\dfrac13x+t\right)(3x^2+2ax+b)$를 얻는다.
      source_flow: 예시 답안
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: $g(x)$를 전개하여 계수를 비교하면 $9t=a$, $3at=b$, $bt=c$이다.
      source_flow: 예시 답안
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: |
        따라서 $g(x)=x^3+9tx^2+27t^2x+27t^3=(x+3t)^3$이다. 조건 (ⅲ)을 이용하면 $t=1$이므로 $g(x)=(x+3)^3$이다.
      source_flow: 예시 답안
      criteria:
      - 2-1.A3
      - 2-1.A4
