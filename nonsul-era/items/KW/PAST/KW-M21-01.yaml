  stem: (2) 원 $(x-2)^2+y^2=1$ 위의 점 $C$에 대하여 $\overline{AC}^2-\overline{BC}^2$의 값의 범위를 구하고 $\overline{AC}^2-\overline{BC}^2$의 값이 최소가 되는 점 $C$의 $y$좌표를 구하시오. [8점]
  points: 8
