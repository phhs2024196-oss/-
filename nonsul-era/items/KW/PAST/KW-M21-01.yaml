    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    source_flow: 해설 p.5
    method_no: 1
    steps:
    - id: 32b-1
      content: 일대일함수의 정의에서 조건 $p$를 $x_1\ne x_2$, 조건 $q$를 $f(x_1)\ne f(x_2)$라고 명제 $p\to q$의 대우는 $f(x_1)=f(x_2)$이면 $x_1=x_2$이다.
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: 이제 정의역 $A_n$의 임의의 두 원소 $x_1,x_2$에 대하여 $f(x_1)=f(x_2)$라고 하면
      criteria:
      - 3-2.M2
    - id: 32b-3
      content: $f(f(x_1))=f(f(x_2))$이고 $f\circ f$는 항등함수이므로 $x_1=x_2$이다. 따라서 조건 $p$를 만족시키는 함수 $f$는 일대일함수이다.
      criteria:
      - 3-2.M3
      - 3-2.A4
