  solutions:
  - id: S12-B
    audience: B
    source_flow: 해설 p.4
    method_no: 1
    steps:
    - id: 12b-1
      content: 점 $C$의 좌표를 $(x,y)$로 놓으면 $\overline{AC}^2-\overline{BC}^2=(x+1)^2+(y+3)^2-(x-5)^2-(y-3)^2=12x-24+12y$이다. $12x-24+12y=12k$라 하면 $x-2+y=k$ ……①이다.
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: 점 $C$는 원 $(x-2)^2+y^2=1$ ……② 위의 점이므로 ①, ②에서 $x$를 소거하면 $2y^2-2ky+k^2-1=0$ ……③이다.
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: 이차방정식 ③의 판별식 $D$가 $D\ge0$이어야 하므로 $\dfrac D4=k^2-2(k^2-1)=-k^2+2\ge0$이고 $-\sqrt2\le k\le\sqrt2$이다. 따라서 $\overline{AC}^2-\overline{BC}^2=12k$의 범위는 $-12\sqrt2\le\overline{AC}^2-\overline{BC}^2\le12\sqrt2$이다.
      criteria:
      - 1-2.M3
    - id: 12b-4
      content: $\overline{AC}^2-\overline{BC}^2=12k$의 최솟값은 $k=-\sqrt2$일 때 $-12\sqrt2$이다. $k=-\sqrt2$를 ③에 대입하면 $(\sqrt2y+1)^2=0$이므로 $y=-\dfrac{\sqrt2}2$이다.
      criteria:
      - 1-2.A4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
