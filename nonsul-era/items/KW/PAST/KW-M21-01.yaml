  stem: |
    [3] 자연수 $n$에 대하여 집합 $A_n$이 $A_n=\{k\mid1\le k\le n,\ k\text{는 자연수}\}$이다. 다음 조건 $p$를 만족시키는 함수의 개수를 $a_n$이라고 할 때, 다음 물음에 답하시오.

    $p$: $A_n$에서 $A_n$으로의 함수 $f$에 대하여 합성함수 $f\circ f$가 집합 $A_n$에서의 항등함수이다.

    (1) $n=1,2$ 각각에 대하여 조건 $p$를 만족시키는 함수를 모두 찾고 $a_1,a_2$를 구하시오. [5점]
