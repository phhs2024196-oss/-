stimuli:
- label: '1'
  body: |
    두 점 $A(x_1,y_1)$, $B(x_2,y_2)$를 이은 선분 $AB$를 $m:n\ (m>0,n>0)$으로 내분하는 점 $P$의 좌표는
    $$\left(\frac{mx_2+nx_1}{m+n},\ \frac{my_2+ny_1}{m+n}\right)$$
- label: '2'
  body: 명제 $p\to q$에 대하여 $\sim q\to\sim p$를 대우라고 한다.
- label: '3'
  body: |
    함수 $f:X\to Y$에서 정의역 $X$의 임의의 두 원소 $x_1,x_2$에 대하여
    $x_1\ne x_2$이면 $f(x_1)\ne f(x_2)$
    일 때, 함수 $f$를 일대일함수라고 한다.
- label: '4'
  body: 두 사건 $A,B$가 동시에 일어나지 않을 때, 사건 $A$와 사건 $B$가 일어나는 경우의 수가 각각 $m,n$이면 사건 $A$ 또는 사건 $B$가 일어나는 경우의 수는 $m+n$
- label: '5'
  body: 사건 $A$가 일어나는 경우의 수가 $m$이고, 그 각각에 대하여 사건 $B$가 일어나는 경우의 수가 $n$일 때, 두 사건 $A,B$가 동시에 일어나는 경우의 수는 $m\times n$
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 두 점 $A(-1,-3)$, $B(5,3)$에 대하여 다음 물음에 답하시오.

    (1) 선분 $AB$를 $m:(3-m)$으로 내분하는 점이 제 $1$사분면 위에 존재할 때, $m$값의 범위를 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: mmin=3/2; mmax=3
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    source_flow: 해설 p.4
    method_no: 1
    steps:
    - id: 11b-1
      content: 선분 $AB$를 $m:(3-m)$으로 내분하는 점의 좌표는 $\left(\dfrac{5m-(3-m)}{m+(3-m)},\ \dfrac{3m-3(3-m)}{m+(3-m)}\right)=(2m-1,\ 2m-3)$이다.
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: 이 점이 제 $1$사분면 위에 존재하므로 $2m-1>0,\ 2m-3>0$이다. 또한 내분하는 점의 정의에 의해 $m:3-m$으로부터 $m>0,\ 3-m>0$이다. 이 부등식들을 동시에 만족하는 $m$의 값의 범위는 $\dfrac23<m<3$이다. [공식 해설 오기 — 올바른 범위는 $\dfrac32<m<3$]
      criteria:
      - 1-1.A2
    note: 공식 모범답안의 결과 "2/3<m<3"을 그대로 기록. 단 $2m-3>0$에서 $m>3/2$이므로 계산상 올바른 범위는 $3/2<m<3$으로 보임(독립 교차검증 2건 일치(2026-11-23)로 answer 를 3/2<m<3 으로 정정).
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
