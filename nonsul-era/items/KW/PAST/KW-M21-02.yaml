    method_no: 1
    steps:
    - id: 12b-1
      content: 삼각함수는 모든 실수에서 미분가능하므로 제시문 1의 합성함수 미분법으로부터 함수 $f(x)$는 모든 실수에서 미분가능하다. $f^{\prime}(x)=-\sin(\sin x)\cos x=0$으로부터 $\sin(\sin x)=0$ 혹은 $\cos x=0$이다.
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: $\sin(\sin x)=0$으로부터 $\sin x=n\pi$ ($n$은 정수)이다. 그런데 $\lvert\sin x\rvert\le1$이므로 $\sin x=0$이다. 이로부터 $x=n\pi$를 얻는다. ……① 한편, $\cos x=0$으로부터 $x=\dfrac\pi2+n\pi$ ($n$은 정수)을 얻는다. ……② ①, ②로부터 가장 작은 양수는 $\dfrac\pi2$이다.
      criteria:
      - 1-2.M2
    - id: 12b-3
      content: 또한 $f^{\prime}\left(\dfrac\pi2-h\right)<0$이고 $f^{\prime}\left(\dfrac\pi2+h\right)>0$ ($h$는 작은 양수)이므로 제시문 3에 의해 $x=\dfrac\pi2$에서 함수 $f(x)$는 극솟값을 가진다.
      criteria:
      - 1-2.A3
