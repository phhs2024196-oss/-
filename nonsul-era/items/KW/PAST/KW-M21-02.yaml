  solutions:
  - id: S21-B
    audience: B
    source_flow: 해설 p.4~5
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        $f(x)=\begin{cases}x^2-a^2&(x<-a)\\ \sqrt{x+a}&(-a\le x<0)\\ \sqrt{a-x}&(0\le x\le a)\\ x^2-a^2&(a<x)\end{cases}$이다. 함수 $f(x)$는 경계점을 제외한 각 구간 안에서는 미분가능하므로 경계점에서 좌우미분계수를 조사한다.
        (ⅰ) $x=-a$의 경우: 우미분계수는 $\displaystyle\lim_{h\to0+}\frac{\sqrt{-a+h+a}-\sqrt{-a+a}}h=\lim_{h\to0+}\frac1{\sqrt h}=\infty$이므로 제시문 4에 의해 미분가능하지 않다.
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: '(ⅱ) $x=0$의 경우: 좌미분계수는 $\displaystyle\lim_{h\to0-}\frac{\sqrt{h+a}-\sqrt{0+a}}h=\lim_{h\to0-}\frac1{\sqrt{h+a}+\sqrt a}=\frac1{2\sqrt a}$이고 우미분계수는 $\displaystyle\lim_{h\to0+}\frac{\sqrt{a-h}-\sqrt{a-0}}h=\lim_{h\to0+}\frac{-1}{\sqrt{a-h}+\sqrt a}=-\frac1{2\sqrt a}$이므로 값이 일치하지 않아 제시문 4에 의해 미분가능하지 않다.'
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: '(ⅲ) $x=a$의 경우: 좌미분계수는 $\displaystyle\lim_{h\to0-}\frac{\sqrt{a-a-h}-\sqrt{a-a}}h=\lim_{h\to0-}\frac{-1}{\sqrt{-h}}=-\infty$이므로 제시문 4에 의해 미분가능하지 않다. 따라서 (ⅰ), (ⅱ), (ⅲ)으로부터 $x=-a,\ 0,\ a$에서 미분가능하지 않다.'
      criteria:
      - 2-1.M3
