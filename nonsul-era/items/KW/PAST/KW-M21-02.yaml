  solutions:
  - id: S13-B
    audience: B
    source_flow: 해설 p.4
    method_no: 1
    steps:
    - id: 13b-1
      content: $f^{\prime}(-h)>0$이고 $f^{\prime}(h)<0$ ($h$는 작은 양수)이므로 제시문 3에 의해 $x=0$에서 함수 $f(x)$는 극댓값을 가진다. 또한 (1)에서 $f(x+\pi)=f(x)$이므로 $x=n\pi$에서 함수 $f(x)$는 극댓값을 가진다. 한편, (2)로부터 $f\left(\dfrac\pi2\right)$는 극솟값이며 함수 $f(x)$의 주기성으로부터 $x=\dfrac\pi2+n\pi$ ($n$은 정수)에서 함수 $f(x)$는 모두 극솟값을 가진다.
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: 이로부터 $f(x)$가 극솟값이 되는 양수 $x$를 작은 값부터 정리하면 $x_k=\dfrac{2k-1}2\pi$ ($k=1,2,3,\cdots$)이다.
      criteria:
      - 1-3.M2
    - id: 13b-3
      content: $\dfrac{\pi^2}{x_kx_{k+1}}=\dfrac4{(2k-1)(2k+1)}=2\left(\dfrac1{2k-1}-\dfrac1{2k+1}\right)$이므로 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^n\dfrac\pi{x_kx_{k+1}}=\lim_{n\to\infty}2\left(\dfrac12-\dfrac13+\dfrac13-\dfrac15+\cdots+\dfrac1{2n-1}+\dfrac1{2n+1}\right)=1$이다.
      criteria:
      - 1-3.A3
    note: 공식 모범답안의 결과 값 $1$을 그대로 기록. 그러나 문제의 분자는 $\pi^2$이고 $x_k=\dfrac{2k-1}2\pi$이면 $\dfrac{\pi^2}{x_kx_{k+1}}=2\left(\dfrac1{2k-1}-\dfrac1{2k+1}\right)$이므로 합의 극한은 $2$이다(모범답안의 마지막 식은 분자를 $\pi$로 적고 합을 $2\left(\dfrac12-\cdots\right)$로 적어 값 1에 이름). 확인 필요, 수정하지 않음.
