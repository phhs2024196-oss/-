- id: 1-1
  stem: |
    [1] 모든 실수 $x$에서 정의된 함수 $f(x)=\cos(\sin x)$에 대하여 다음 물음에 답하시오.

    (1) 모든 실수 $x$에 대하여 $f(x+p)=f(x)$를 만족하는 $2\pi$보다 작은 양수 $p$를 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    source_flow: 해설 p.4
    method_no: 1
    steps:
    - id: 11b-1
      content: 함수 $y=\sin x$는 주기가 $2\pi$이며 원점 대칭이므로 $\sin(-x)=-\sin x$이다. 함수 $y=\cos x$는 $y$축 대칭이므로 $\cos(\sin(-x))=\cos(\sin x)$이다.
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: 이 사실들로부터 $f(x+\pi)=\cos(\sin(x+\pi))=\cos(-\sin x)=\cos(\sin x)=f(x)$를 얻는다. 따라서 $p=\pi$이다.
      criteria:
      - 1-1.A2
