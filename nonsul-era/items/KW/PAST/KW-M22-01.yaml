    (1) 내적을 이용하여 두 벡터 $\overrightarrow{\mathrm{OA}}$와 $\overrightarrow{\mathrm{OB}}$가 이루는 각의 크기를 구하고, 삼각형 $\mathrm{OAB}$의 넓이를 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
