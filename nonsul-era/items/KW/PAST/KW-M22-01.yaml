stimuli:
- label: '1'
  body: (사잇값의 정리) 함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$일 때, $f(a)$와 $f(b)$ 사이의 임의의 값 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: '2'
  body: |
    (평균값 정리) 함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능하면
    $$\frac{f(b)-f(a)}{b-a}=f^{\prime}(c)$$
    인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: '3'
  body: |
    함수 $f(x)$가 어떤 구간에서 미분가능하고, 이 구간의 모든 $x$에 대하여
    (ⅰ) $f^{\prime}(x)>0$이면 $f(x)$는 이 구간에서 증가한다.
    (ⅱ) $f^{\prime}(x)<0$이면 $f(x)$는 이 구간에서 감소한다.
- label: '4'
  body: |
    연속인 이계도함수를 갖는 함수 $f(x)$에 대하여 어떤 구간에서
    (ⅰ) $f^{\prime\prime}(x)>0$이면 곡선 $y=f(x)$는 이 구간에서 아래로 볼록하다.
    (ⅱ) $f^{\prime\prime}(x)<0$이면 곡선 $y=f(x)$는 이 구간에서 위로 볼록하다.
- label: '5'
  body: |
    두 평면벡터 $\vec a,\vec b$가 이루는 각의 크기를 $\theta\ (0^\circ\le\theta\le180^\circ)$라고 할 때,
    $$\vec a\cdot\vec b=\begin{cases}\lvert\vec a\rvert\lvert\vec b\rvert\cos\theta&(0^\circ\le\theta\le90^\circ)\\-\lvert\vec a\rvert\lvert\vec b\rvert\cos(180^\circ-\theta)&(90^\circ<\theta\le180^\circ)\end{cases}$$
- label: '6'
  body: |
    (사인법칙) 삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이를 $R$라고 하면
    $$\frac a{\sin A}=\frac b{\sin B}=\frac c{\sin C}=2R$$
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: 1-1
  stem: |
    [1] 함수 $g(x)$는 닫힌구간 $[a,b]$에서 연속이고 $a\le x\le b$일 때 $a\le g(x)\le b$가 성립한다. 함수 $g(x)$에 대하여 다음 물음에 답하시오.

    (1) 방정식 $g(x)=x$는 닫힌구간 $[a,b]$에서 적어도 하나의 실근을 가짐을 보이시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: proof
    value: $f(x)=g(x)-x$로 놓으면 $f(a)\ge0\ge f(b)$이고 연속이므로, 등호가 아니면 사잇값의 정리로 $f(c)=0$인 $c\in(a,b)$가 존재한다.
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    source_flow: 해설 p.4
    method_no: 1
    steps:
    - id: 11b-1
      content: (ⅰ) $g(a)=a$이면 주어진 방정식의 실근 $x=a$가 존재하고, $g(b)=b$이면 실근 $x=b$가 존재한다.
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: (ⅱ) $g(a)\ne a$이고 $g(b)\ne b$라고 가정하자. 함수 $f(x)=g(x)-x$라고 하면, 연속함수의 차는 연속함수이므로 함수 $f(x)$는 닫힌구간 $[a,b]$에서 연속이다. $a\le x\le b$일 때 $a\le g(x)\le b$이므로 다음이 성립한다. $f(a)=g(a)-a>0,\ f(b)=g(b)-b<0$
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: 따라서 사잇값의 정리에 의하여 $f(c)=0$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다. 즉, $g(c)=c$인 $c$가 $(a,b)$에 적어도 하나 존재한다. (ⅰ), (ⅱ)로부터 방정식 $g(x)=x$는 닫힌구간 $[a,b]$에서 적어도 하나의 실근을 가진다.
      criteria:
      - 1-1.A3
