- id: '2'
  stem: |
    [2] 다음 조건을 모두 만족시키게 하는 실수 $k$의 값의 범위를 구하시오. [10점]

    (a) 모든 실수 $x$에 대하여 $\cos^2x+(k+2)\sin x-2k-1>0$이 성립한다.
    (b) 방정식 $\sqrt{2x+1}-2x+k=0$이 서로 다른 두 실근을 가진다.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: lo=-5/4; hi=-1 (열린구간)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    source_flow: 해설 p.4
    method_no: 1
    steps:
    - id: 2b-1
      content: (a)에서 $\cos^2x+(k+2)\sin x-2k-1>0$은 $\cos^2x=1-\sin^2x$이므로 $\sin^2x-(k+2)\sin x+2k<0$이다. 따라서 $(\sin x-2)(\sin x-k)<0$이다. $\sin x-2<0$이므로 $\sin x-k>0$에서 $k<\sin x$이다. 이것이 모든 실수 $x$에 대하여 성립하려면 $k<-1$ ……①이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: (b)에서 방정식 $\sqrt{2x+1}-2x+k=0$이 서로 다른 두 실근을 가지려면 곡선 $y=\sqrt{2x+1}$과 직선 $y=2x-k$의 그래프가 두 개의 교점을 가져야 한다. 곡선과 직선이 접할 때, $\sqrt{2x+1}=2x-k$를 제곱하여 정리한 이차방정식 $4x^2-2(2k+1)x+k^2-1=0$에서 판별식을 $D$라고 하면 $\dfrac D4=(2k+1)^2-4(k^2-1)=4k+5=0$ 즉, $k=-\dfrac54$이다. 직선이 점 $\left(-\dfrac12,0\right)$을 지날 때 $1+k=0$에서 $k=-1$이다. 그러므로 방정식 $\sqrt{2x+1}-2x+k=0$이 서로 다른 두 실근을 가지는 $k$의 값의 범위는 $-\dfrac54<k\le-1$ ……②이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 ①, ②를 동시에 만족하는 $k$의 값의 범위는 $-\dfrac54<k<-1$이다.
      criteria:
      - 2.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
