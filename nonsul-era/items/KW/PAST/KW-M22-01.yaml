- id: '4'
  stem: |
    [4] 함수 $h(x)=x\ln x-x$에 대하여 다음을 모두 만족시키는 양수 $\alpha$와 $\beta$를 구하고, 닫힌구간 $[\alpha,\beta]$에서 부등식 $px-2\le h(x)\le qx-2$가 성립하도록 하는 실수 $p$의 최댓값과 실수 $q$의 최솟값을 구하시오. [12점]

    (a) 함수 $h(x)$는 $x=\alpha$에서 극소이다.
    (b) 곡선 $y=h(x)$ 위의 점 $(\beta,h(\beta))$에서 접선의 기울기가 $1$이다.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: alpha=1; beta=e; pmax=ln(2); qmin=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    source_flow: 해설 p.5
    method_no: 1
    steps:
    - id: 4b-1
      content: 함수 $h(x)=x\ln x-x$라고 하면 함수 $h(x)$는 미분가능하고 $h^{\prime}(x)=\ln x$이다. $h^{\prime}(x)=0$에서 $x=1$이고 $0<x<1$일 때 $h^{\prime}(x)<0$이므로 $h(x)$는 감소하고, $x>1$일 때 $h^{\prime}(x)>0$이므로 $h(x)$는 증가한다. 그러므로 $x=1$에서 $h(x)$는 극소이다. 따라서 $\alpha=1$이다. 점 $(\beta,h(\beta))$에서 접선의 기울기는 $h^{\prime}(\beta)=\ln\beta=1$이므로 $\beta=e$이다.
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        $(1,e)$에서 $h^{\prime\prime}(x)=\dfrac1x>0$이므로 곡선 $y=h(x)$는 아래로 볼록하다.
        (ⅰ) 직선 $y=kx-2$가 점 $(1,-1)$을 지날 때 $k=1$이다.
      criteria:
      - 4.M2
    - id: 4b-3
      content: (ⅱ) 직선 $y=kx-2$가 곡선 $y=h(x)$와 접할 때, 접점의 $x$좌표를 $t$라고 하면 $\ln t=k$ 즉, $t=e^k$이다. 곡선과 접선의 $y$좌표는 같으므로 $t\ln t-t=kt-2$ 즉, $k=\ln2$이다.
      criteria:
      - 4.M3
    - id: 4b-4
      content: (ⅲ) 직선 $y=kx-2$가 점 $(e,0)$을 지날 때 $k=\dfrac2e$이다. 함수 $h(x)$는 $[1,e]$에서 증가하고 곡선 $y=h(x)$는 아래로 볼록하므로 (ⅰ), (ⅱ), (ⅲ)에서 구한 $k$의 값을 비교하면 $\ln2<\dfrac2e<1$이다. 그러므로 $px-2\le h(x)\le qx-2$가 성립하려면 $p\le\ln2,\ q\ge1$이다. 따라서 $p$의 최댓값은 $\ln2$, $q$의 최솟값은 $1$이다.
      criteria:
      - 4.A4
