  solutions:
  - id: S31-B
    audience: B
    source_flow: 해설 p.4
    method_no: 1
    steps:
    - id: 31b-1
      content: 두 점 $\mathrm{A},\mathrm{B}$의 위치벡터를 $\vec a=\overrightarrow{\mathrm{OA}}=(\sqrt3,1)$, $\vec b=\overrightarrow{\mathrm{OB}}=(-1,-\sqrt3)$라고 하면, 두 벡터 $\vec a$와 $\vec b$의 내적은 $\vec a\cdot\vec b=-2\sqrt3<0$이다.
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: 그러므로 두 벡터가 이루는 각을 $\theta$라고 하면 $90^\circ<\theta\le180^\circ$이다. $\lvert\vec a\rvert=2,\ \lvert\vec b\rvert=2$이고 $\cos(180^\circ-\theta)=-\dfrac{\vec a\cdot\vec b}{\lvert\vec a\rvert\lvert\vec b\rvert}=\dfrac{\sqrt3}2$이므로 $180^\circ-\theta=30^\circ$이다. 따라서 $\theta=150^\circ$이다.
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: $\sin150^\circ=\dfrac12$이므로 삼각형 $\mathrm{OAB}$의 넓이는 $S=\dfrac12\lvert\vec a\rvert\lvert\vec b\rvert\sin\theta=1$이다.
      criteria:
      - 3-1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
