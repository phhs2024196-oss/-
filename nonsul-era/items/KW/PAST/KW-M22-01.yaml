key_idea: '[1] $g(x)-x$에 사잇값의 정리를 적용해 실근의 존재를, 평균값 정리와 귀류법으로 유일성을 보인다. [2] 조건 (a)는 $(\sin x-2)(\sin x-k)<0$으로 정리해 $k<\sin x$ 전체 성립, (b)는 곡선 $y=\sqrt{2x+1}$과 직선 $y=2x-k$의 교점 2개 조건(접할 때와 끝점을 지날 때). [3] 내적으로 각 $150^\circ$, 사인법칙으로 외접원 반지름, $\mathrm{OP}$가 지름일 때 사각형 넓이가 최대. [4] 극소 $\alpha=1$, 접선 기울기 $\beta=e$ 후 직선 $y=kx-2$의 접선과 끝점 통과 기울기를 비교.'
stuck: '[2](b) 곡선과 직선의 교점이 2개가 되는 $k$의 범위를 접하는 경우($k=-\dfrac54$)와 끝점 $\left(-\dfrac12,0\right)$을 지나는 경우($k=-1$)로 결정하는 단계, [4] $px-2\le h(x)\le qx-2$를 $h$의 아래로 볼록성으로 접선·끝점 기울기 비교로 바꾸는 단계'
