    - id: 12b-2
      content: 함수 $g(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능하므로 평균값정리에 의하여 $g^{\prime}(c)=\dfrac{g(\beta)-g(\alpha)}{\beta-\alpha}=1$이 성립하는 $c\in(\alpha,\beta)$가 존재한다. 조건에서 $\lvert g^{\prime}(x)\rvert<1$이므로 모순이다. 따라서 $\alpha=\beta$ 즉, 방정식 $g(x)=x$의 근이 존재하면 오직 하나이다.
