      content: 방정식 $g(x)=x$의 서로 다른 근 $\alpha$와 $\beta\ (\alpha<\beta)$가 $(a,b)$에 존재한다고 가정하자. 그러면 $g(\alpha)=\alpha,\ g(\beta)=\beta$이다.
      criteria:
