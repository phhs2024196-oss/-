  solutions:
  - id: S13-B
    audience: B
    source_flow: 해설 p.4
    method_no: 1
    steps:
    - id: 13b-1
      content: $(f\circ f)^{\prime}(x)=f^{\prime}(f(x))f^{\prime}(x)=0$에서 $f^{\prime}(f(x))=0$ 또는 $f^{\prime}(x)=0$이다. $f^{\prime}(x)=0$인 경우, $x=0,\ 3$이다. $f^{\prime}(f(x))=0$인 경우, $f(x)=0,\ 3$이므로 $x=0$ 또는 $f(x)=x^3e^{-x}=3$인 $x$이다.
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: '(ⅰ) $x=0$일 때: $x=0$의 좌우에서 (2)의 표에서와 같이 $f^{\prime}(x)$의 부호는 바뀌지 않고, $f^{\prime}(f(0))=f^{\prime}(0)$이므로 $(f\circ f)^{\prime}(x)$의 부호는 바뀌지 않는다.'
      criteria:
      - 1-3.M2
    - id: 13b-3
      content: '(ⅱ) $x=3$일 때: $x=3$의 좌우에서 (2)의 표에서와 같이 $f^{\prime}(x)$의 부호가 양에서 음으로 바뀌고, $f^{\prime}(f(3))>0$이므로 $(f\circ f)^{\prime}(x)$의 부호도 양에서 음으로 바뀐다. 따라서 $x=3$에서 극대이다.'
      criteria:
      - 1-3.M3
    - id: 13b-4
      content: '(ⅲ) $f(x)=x^3e^{-x}=3$을 만족하는 $x$일 때: $f(x)=x^3e^{-x}=3$일 때, (2)에서 $f(x)$의 최댓값은 $\left(\dfrac3e\right)^3\approx1.344$(제시문 1 이용)이므로 $f(x)<3$이다. 따라서 $f(x)=x^3e^{-x}=3$인 $x$는 존재하지 않는다. (ⅰ), (ⅱ), (ⅲ)으로부터 함수 $(f\circ f)(x)$가 극값을 갖도록 하는 $x$좌표는 $3$이다.'
      criteria:
      - 1-3.M4
