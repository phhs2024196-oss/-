      content: $x=-t$로 치환하면 $\displaystyle\int_{-e}^ex^{2022}f(x)e^{x^2+x}dx=\int_0^eg(x)dx+\int_{-e}^0g(x)dx=\int_0^eg(x)dx-\int_0^eg(t)dt=0$이다.
      criteria:
      - 1-1.A2
