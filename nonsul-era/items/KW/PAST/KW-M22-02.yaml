stimuli:
- label: '1'
  body: |
    무리수 $e$
    $$e=\lim_{x\to0}(1+x)^{\frac1x}=2.71828182845904\cdots$$
- label: '2'
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는
    $$\frac{dy}{dx}=\frac{dy}{du}\times\frac{du}{dx}\ \text{ 또는 }\ y^{\prime}=f^{\prime}(g(x))g^{\prime}(x)$$
- label: '3'
  body: |
    함수 $f(x)$가 어떤 구간에서 미분가능하고, 이 구간의 모든 $x$에 대하여
    (ⅰ) $f^{\prime}(x)>0$이면 $f(x)$는 이 구간에서 증가한다.
    (ⅱ) $f^{\prime}(x)<0$이면 $f(x)$는 이 구간에서 감소한다.
- label: '4'
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f^{\prime}(a)=0$이고 $x=a$의 좌우에서
    (ⅰ) $f^{\prime}(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.
    (ⅱ) $f^{\prime}(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.
- label: '5'
  body: |
    고정된 실수 $a$를 포함하는 구간에서 연속인 함수 $f(x)$가 있을 때, 그 구간에 속하는 임의의 실수 $x$에 대하여
    $$\frac d{dx}\int_a^xf(t)\,dt=f(x)$$
- label: '6'
  body: |
    미분가능한 두 함수 $f(x)$, $g(x)$에 대하여 $f^{\prime}(x)$, $g^{\prime}(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^bf(x)g^{\prime}(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_0^bf^{\prime}(x)g(x)\,dx$$
stem: '[문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
