      content: 적분되는 함수를 $g(x)$라고 하자. $g(x)=x^{2022}f(x)e^{x^2+x}=x^{2025}e^{x^2}$은 $g(-x)=-g(x)$이므로 원점에 대하여 대칭인 함수이다.
      criteria:
      - 1-1.M1
