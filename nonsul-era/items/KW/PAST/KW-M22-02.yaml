key_idea: '[1] 피적분함수 $x^{2025}e^{x^2}$가 홀함수이므로 대칭구간 적분은 $0$. $f^{\prime}(x)=-x^2(x-3)e^{-x}$로 최댓값 $\left(\dfrac3e\right)^3$. $(f\circ f)^{\prime}=f^{\prime}(f(x))f^{\prime}(x)$의 영점 중 부호가 바뀌는 곳은 $x=3$뿐($f(x)=3$은 해가 없음). [2] $\sin^{2021}x\le-1$로 $\sin x=-1$. [3] $F(x)=f(x)+1-e^x$를 이용해 $\displaystyle\int_0^1F\,dx=3-e$, 부분적분으로 $\displaystyle\int_0^1xf\,dx=e-2$, $\displaystyle\int_0^1F(e^x+F)dx=\dfrac72-e$.'
stuck: '[1](3) $f^{\prime}(f(x))=0$이 되는 $x$ 중 $f(x)=3$이 해가 없음을 $f$의 최댓값 $\left(\dfrac3e\right)^3\approx1.344<3$으로 보이고, $x=0$에서는 $f^{\prime}$이 부호를 바꾸지 않아 극값이 아님을 판정하는 단계, [3](2) $\displaystyle\int F(f+1-e^x)dx$를 $\dfrac{d}{dx}\dfrac{F^2}2$로 바꾸는 단계'
