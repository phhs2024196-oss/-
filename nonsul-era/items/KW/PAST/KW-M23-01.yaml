- id: 3-1
  stem: |
    [3] 함수 $f(x)=x+\dfrac1x$에 대하여 다음을 구하시오.

    (1) $f(x)=\sqrt2$일 때, $x^{2023}+\dfrac{1}{x^{2023}}$의 값 [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $f(x)=\sqrt2\iff x+\dfrac1x=\sqrt2$이다. 이것을 제곱하면 $x^2+\dfrac{1}{x^2}=0$, 즉 $x^4=-1$이다.
      source_flow: 예시 답안 p.5~6
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $x^{2023}=x^{4\times505+3}=(-1)^{505}\cdot x^3=-x^3$이므로 $x^{2023}+\dfrac{1}{x^{2023}}=-\left(x^3+\dfrac{1}{x^3}\right)$이고, $x^3+\dfrac{1}{x^3}=\left(x+\dfrac1x\right)^3-3\left(x+\dfrac1x\right)=-\sqrt2$이므로 $x^{2023}+\dfrac{1}{x^{2023}}=\sqrt2$이다.
        (다른 풀이) $x+\dfrac1x=\sqrt2\iff x^2-\sqrt2x+1=0$으로부터 $x^3=x(\sqrt2x-1)=\sqrt2(\sqrt2x-1)-x=x-\sqrt2$, $x^4=x^2-\sqrt2x=-1$이므로 $x^{2023}+\dfrac{1}{x^{2023}}=-\left(x^3+\dfrac{1}{x^3}\right)=-\left(x-\sqrt2+\dfrac{1}{x-\sqrt2}\right)=\sqrt2$이다.
      source_flow: 예시 답안 p.5~6
      criteria:
      - 3-1.A1
