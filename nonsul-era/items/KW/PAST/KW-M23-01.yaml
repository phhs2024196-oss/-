subparts:
- id: 1-1
  stem: |
    [1] 실수 $x$에 대하여 세 수가 아래와 같이 주어졌을 때, 다음을 구하시오. (단, $0\le x<2\pi$)

    $\cos(2\pi\cos x)-2,\qquad\sin(2\pi\cos x),\qquad-\cos(2\pi\cos x)$

    (1) 세 수가 순서대로 등차수열이 되게 하는 실수 $x$의 개수와 공차 $d$ [4점]
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: count=4; d=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        세 수가 등차수열을 이루면 $2\sin(2\pi\cos x)=\cos(2\pi\cos x)-2-\cos(2\pi\cos x)$, 즉 $\sin(2\pi\cos x)=-1$이다. $\lvert\cos x\rvert\le1$이므로 $-2\pi\le2\pi\cos x\le2\pi$이고 $2\pi\cos x=-\dfrac{\pi}{2},\ \dfrac{3\pi}{2}$, 즉 $\cos x=-\dfrac14,\ \dfrac34$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $0\le x<2\pi$에서 $y=\cos x$의 그래프를 고려하면 $x$의 개수는 $4$개이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 1-1.A1
    - id: 11b-3
      content: |
        $\cos x=-\dfrac14,\ \dfrac34$를 세 수에 대입하면 $-2$, $-1$, $0$이므로 공차는 $1$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 1-1.A2
