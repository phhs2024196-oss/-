  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        세 수가 등비수열을 이루면 $\sin^2(2\pi\cos x)=\{\cos(2\pi\cos x)-2\}\{-\cos(2\pi\cos x)\}$, 정리하면 $\sin^2(2\pi\cos x)+\cos^2(2\pi\cos x)=2\cos(2\pi\cos x)$, 즉 $\cos(2\pi\cos x)=\dfrac12$이다. $\lvert\cos x\rvert\le1$이므로 $-2\pi\le2\pi\cos x\le2\pi$이고 $2\pi\cos x=-\dfrac{5\pi}{3},\ -\dfrac{\pi}{3},\ \dfrac{\pi}{3},\ \dfrac{5\pi}{3}$, 즉 $\cos x=-\dfrac56,\ -\dfrac16,\ \dfrac16,\ \dfrac56$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $0\le x<2\pi$에서 $y=\cos x$의 그래프를 고려하면 $x$의 개수는 $8$개이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 1-2.A1
    - id: 12b-3
      content: |
        $\cos x=-\dfrac56,\ \dfrac16$을 세 수에 대입하면 $-\dfrac32$, $\dfrac{\sqrt3}{2}$, $-\dfrac12$이므로 공비는 $-\dfrac{\sqrt3}{3}$이다. $\cos x=-\dfrac16,\ \dfrac56$을 세 수에 대입하면 $-\dfrac32$, $-\dfrac{\sqrt3}{2}$, $-\dfrac12$이므로 공비는 $\dfrac{\sqrt3}{3}$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 1-2.A2
