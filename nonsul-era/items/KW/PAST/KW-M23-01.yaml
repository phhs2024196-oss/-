stimuli:
- label: '1'
  body: |
    1. 등차수열
    첫째항부터 차례로 일정한 수를 더하여 얻은 수열을 등차수열이라고 하며, 그 일정한 수를 공차라고 한다.
- label: '2'
  body: |
    2. 등비수열
    첫째항부터 차례로 일정한 수를 곱하여 얻은 수열을 등비수열이라고 하며, 그 일정한 수를 공비라고 한다.
- label: '3'
  body: |
    3. 켤레복소수
    복소수 $a+bi$ ($a$, $b$는 실수)에 대하여 허수부분의 부호를 바꾼 복소수 $a-bi$를 $a+bi$의 켤레복소수라고 한다.
- label: '4'
  body: |
    4. 함수의 연속
    함수 $f(x)$가 실수 $a$에 대하여
    (ⅰ) 함수 $f(x)$가 $x=a$에서 정의되고
    (ⅱ) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재하며
    (ⅲ) $\displaystyle\lim_{x\to a}f(x)=f(a)$
    일 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다. 한편 함수 $f(x)$가 $x=a$에서 연속이 아닐 때, 함수 $f(x)$는 $x=a$에서 불연속이라고 한다. 즉, 함수 $f(x)$가 위의 세 조건 중 어느 하나라도 만족시키지 않으면 함수 $f(x)$는 $x=a$에서 불연속이다.
