  stem: |
    (2) 곡선 $y=g(x)$를 $y$축으로 $k$만큼 평행이동한 곡선과 곡선 $y=f(x)$가 서로 다른 네 점에서 만날 때, 실수 $k$의 범위를 구하시오. [6점]
  points: 6
