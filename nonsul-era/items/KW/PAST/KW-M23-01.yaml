- id: '4'
  stem: |
    [4] 다음 두 곡선이 서로 다른 두 점에서 만난다고 할 때, 실수 $a$의 범위를 구하시오. [8점]

    $y=\sqrt{x+2},\qquad y=\lvert x-a\rvert+x$
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: 0<=a<2 or -33/8<a<=-4
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        다음 두 곡선이 서로 다른 두 점에서 만나게 하는 $a$의 범위는 그림을 참고하여 아래와 같이 나눌 수 있다.
        $y=\sqrt{x+2}\cdots\cdots①$, $y=\lvert x-a\rvert+x\cdots\cdots②$
        [그림: 곡선 ①과 직선 $y=x$, $x$축 위 눈금 $-2$, $2$. 곡선 ②는 점 $(a,a)$에서 꺾이고 $x<a$에서는 $x$축에 평행한 반직선, $x\ge a$에서는 기울기 $2$인 반직선]
      source_flow: 예시 답안 p.6
      criteria:
      - 4.B1
    - id: 4b-2
      content: |
        (ⅰ) $a\ge0$일 때, $0\le a<2$
      source_flow: 예시 답안 p.6
      criteria:
      - 4.B2
    - id: 4b-3
      content: |
        (ⅱ) $a<0$이라고 하자. $x\ge a$일 때 ②는 $y=2x-a$이다. 이것이 ①과 접하면 $(2x-a)^2=x+2$, 즉 $4x^2-(4a+1)x+a^2-2=0$은 중근을 가지므로 판별식 $D=16a^2+8a+1-16a^2+32=0$, 즉 $a=-\dfrac{33}{8}\cdots\cdots③$이다. $y=2x-a$가 $(-2,0)$을 지나면 $a=-4\cdots\cdots④$이다. ③과 ④로부터 $-\dfrac{33}{8}<a\le-4$이다.
        (ⅰ)과 (ⅱ)로부터 $-\dfrac{33}{8}<a\le-4$, $0\le a<2$
      source_flow: 예시 답안 p.6
      criteria:
      - 4.B3
