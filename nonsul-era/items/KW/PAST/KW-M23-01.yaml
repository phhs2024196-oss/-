- id: '2'
  stem: |
    [2] $x>0$인 실수 $x$와 실수 $y$에 대하여 복소수 $z=x+yi$가 다음 두 조건을 만족시킬 때, 점 $\mathrm{P}(x,y)$가 좌표평면에 나타내는 곡선을 그리시오. [7점]

    (가) $z+\dfrac1z=\overline{z}+\dfrac1{\overline{z}}$ (단, 복소수 $\overline{z}$는 $z$의 켤레복소수)
    (나) $1\le z+\dfrac1z\le2$
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: x**2+y**2=1, 1/2<=x<=1 (y=0일 때 점 (1,0))
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $z+\dfrac1z=x+yi+\dfrac{1}{x+yi}=\dfrac{x(x^2+y^2+1)}{x^2+y^2}+\dfrac{y(x^2+y^2-1)i}{x^2+y^2}$
        조건 (가)로부터 $z+\dfrac1z$는 실수이므로 $y=0$ 또는 $x^2+y^2=1$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        (ⅰ) $y=0$일 때
        조건 (나)로부터 $1\le\dfrac{x(x^2+1)}{x^2}\le2$이다. $x>0$이므로 $x^2-x+1\ge0\cdots\cdots①$, $x^2-2x+1=(x-1)^2\le0\cdots\cdots②$이다. ①에서 판별식 $D=1-4=-3<0$이므로 모든 실수 $x$가 ①을 만족시킨다. ②로부터 $x=1$이므로 $(x,y)=(1,0)$
      source_flow: 예시 답안 p.5
      criteria:
      - 2.B1
    - id: 2b-3
      content: |
        (ⅱ) $x^2+y^2=1$일 때
        조건 (나)로부터 $1\le2x\le2$이다. 따라서 $\dfrac12\le x\le1$
      source_flow: 예시 답안 p.5
      criteria:
      - 2.B2
    - id: 2b-4
      content: |
        (ⅰ)과 (ⅱ)로부터 점 $\mathrm{P}(x,y)$가 나타내는 곡선은 오른쪽 그림에서 중심각이 $\dfrac{2\pi}{3}$인 호 $\mathrm{AB}$이다.
        [그림: 원점 중심의 단위원. 오른쪽 호 중 $x=\dfrac12$인 두 점 $\mathrm{A}$(제1사분면)와 $\mathrm{B}$(제4사분면)를 잇는 굵은 호가 점 $(1,0)$을 지나며, 각 $\dfrac{\pi}{3}$가 표시되어 있음]
      source_flow: 예시 답안 p.5
      criteria:
      - 2.A1
