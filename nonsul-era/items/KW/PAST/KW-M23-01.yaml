- id: 5-1
  stem: |
    [5] 다음 두 함수에 대하여 물음에 답하시오.

    $f(x)=\displaystyle\lim_{n\to\infty}\dfrac{x^{2n}}{\sin(x^{2n}\pi)+x^{2n}},\qquad g(x)=x^2$

    (1) 함수 $f(x)$의 연속성을 조사하시오. [9점]
  points: 9
  depends_on: []
  answer:
    kind: expression
    value: x=0, x=-1, x=1 에서 불연속, 그 밖의 실수에서 연속
    equivalents: []
    tolerance: null
  solutions:
  - id: S51-B
    audience: B
    method_no: 1
    steps:
    - id: 51b-1
      content: |
        (ⅰ) $x=0$일 때, $f(0)$은 존재하지 않는다.
      source_flow: 예시 답안 p.6~7
      criteria:
      - 5-1.B1
    - id: 51b-2
      content: |
        (ⅱ) $\lvert x\rvert<1$, $x\ne0$일 때, $\displaystyle\lim_{n\to\infty}x^{2n}=0$, $\lim_{x\to0}\dfrac{\sin x}{x}=1$이므로 $f(x)=\displaystyle\lim_{n\to\infty}\dfrac{1}{\dfrac{\sin(x^{2n}\pi)}{x^{2n}\pi}\pi+1}=\dfrac{1}{\pi+1}$
      source_flow: 예시 답안 p.6~7
      criteria:
      - 5-1.M1
    - id: 51b-3
      content: |
        (ⅲ) $\lvert x\rvert>1$일 때, $\displaystyle\lim_{n\to\infty}x^{2n}=\infty$이므로 $f(x)=\lim_{n\to\infty}\dfrac{1}{\dfrac{\sin(x^{2n}\pi)}{x^{2n}}+1}=1$
      source_flow: 예시 답안 p.6~7
      criteria:
      - 5-1.M2
    - id: 51b-4
      content: |
        (ⅳ) $x=\pm1$일 때, $f(\pm1)=1$
      source_flow: 예시 답안 p.6~7
      criteria:
      - 5-1.B2
    - id: 51b-5
      content: |
        (ⅰ)~(ⅳ)로부터 함수 $f(x)$는 $x\ne0$, $x\ne\pm1$인 모든 실수 $x$에서 연속이다.
        [그림: $y=f(x)$의 그래프. $\lvert x\rvert<1$, $x\ne0$에서 높이 $\dfrac{1}{\pi+1}$인 수평선(양 끝점 $x=\pm1$과 $x=0$에서 속이 빈 점), $\lvert x\rvert>1$에서 높이 $1$인 수평선, $x=\pm1$에서 높이 $1$인 속이 찬 점]
      source_flow: 예시 답안 p.6~7
