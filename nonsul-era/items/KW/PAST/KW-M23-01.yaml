intent: |
  [1] (1) 등차수열의 성질을 이해하고 삼각방정식을 해결할 수 있는 능력을 평가한다. (2) 등비수열의 성질을 이해하고 삼각방정식을 해결할 수 있는 능력을 평가한다. [2] 복소수가 실수가 되는 조건을 이해하고 이를 활용하여 부등식 문제를 해결할 수 있는 능력을 평가한다. [3] (1) 방정식의 제곱을 이용하여 고차식의 값을 계산할 수 있는 능력을 평가한다. (2) 합성된 함수식으로부터 이차함수를 찾아내는 수식 활용능력을 평가한다. [4] 무리함수와 절대값이 있는 일차함수의 그래프의 성질을 이해하고 이를 활용할 수 있는 능력을 평가한다. [5] (1) 등비수열의 수렴과 발산을 이해하고 이를 활용하여 함수의 연속성을 조사할 수 있는 능력을 평가한다. (2) 한 곡선의 평행이동으로 두 곡선의 위치 관계를 이해하고 활용하는 기하학적 능력을 평가한다. (광운대 공식 '출제 의도')
key_idea: |
  등차·등비 조건을 $\sin(2\pi\cos x)=-1$, $\cos(2\pi\cos x)=\dfrac12$로 줄이고 $\cos x$의 값마다 $x$의 개수를 센다. 복소수가 실수가 되는 조건 $y=0$ 또는 $x^2+y^2=1$로 곡선을 나눈다. $x+\dfrac1x$의 거듭제곱 관계로 $x^4=-1$과 $g(t)$를 얻는다. $\lvert x-a\rvert+x$를 구간별 직선으로 보고 접하는 경계를 판별식으로 찾으며, $f(x)$는 $\lvert x\rvert$와 $1$의 대소로 나누어 극한을 구한다.
stuck: |
  [4]에서 $a<0$일 때 $y=2x-a$가 $y=\sqrt{x+2}$와 접하는 경계($a=-\dfrac{33}{8}$)와 점 $(-2,0)$을 지나는 경계($a=-4$)를 모두 찾아 구간을 정하는 단계
