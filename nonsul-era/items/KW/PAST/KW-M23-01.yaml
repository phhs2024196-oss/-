    kind: expression
    value: -pi/(pi+1)<k<=0
    equivalents: []
    tolerance: null
  solutions:
  - id: S52-B
    audience: B
    method_no: 1
    steps:
    - id: 52b-1
      content: |
        곡선 $y=g(x)$를 $y$축으로 $k$만큼 평행이동한 곡선을 $y=h(x)$라고 하면 $h(x)=x^2+k$이다.
      source_flow: 예시 답안 p.7
      criteria:
      - 5-2.M1
    - id: 52b-2
      content: |
        곡선 $y=h(x)$가 점 $\left(\pm1,\dfrac{1}{\pi+1}\right)$을 지나면 $h(\pm1)=1+k=\dfrac{1}{\pi+1}$로부터 $k=-\dfrac{\pi}{\pi+1}$이다. 곡선 $y=h(x)$가 점 $(\pm1,1)$을 지나면 $h(\pm1)=1+k=1$, 즉 $k=0$이다.
      source_flow: 예시 답안 p.7
      criteria:
      - 5-2.M2
    - id: 52b-3
      content: |
        두 곡선이 서로 다른 네 점에서 만날 $k$의 범위는 오른쪽 그림으로부터 $-\dfrac{\pi}{\pi+1}<k\le0$이다.
        [그림: 곡선 $y=x^2+k$와 $y=f(x)$의 그래프(높이 $1$, $\dfrac{1}{\pi+1}$인 수평선들)를 함께 그린 것. 꼭짓점의 $y$좌표가 $-\dfrac{\pi}{\pi+1}$인 곡선과 $0$인 곡선이 보임]
      source_flow: 예시 답안 p.7
      criteria:
      - 5-2.A1
