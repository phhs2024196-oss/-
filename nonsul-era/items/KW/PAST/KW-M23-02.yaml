- id: 4-2
  stem: |
    (2) 방정식 $f(x)=0$의 실근을 큰 수부터 차례로 $a_1,a_2,a_3,\cdots,a_n,\cdots$이라 할 때, $\displaystyle\sum_{n=1}^{\infty}a_n$의 합을 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: exp(3*pi/2)/(exp(2*pi)-1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        방정식 $f(x)=0$에서 $\sin(\ln x)=-1\cdots\cdots①$
        $0<x<1$이므로 $\ln x<0$이고, 사인함수는 주기가 $2\pi$인 주기함수이므로 ①로부터 $\ln x=-\dfrac{\pi}{2},-\dfrac{5\pi}{2},\cdots,-\dfrac{(4n-3)\pi}{2},\cdots$
        그러므로 $a_1=e^{-\frac{\pi}{2}}$, $a_2=e^{-\frac{5\pi}{2}}$, $\cdots$, $a_n=e^{-\frac{(4n-3)\pi}{2}}$, $\cdots$이고, $a_n=e^{-\frac{\pi}{2}}(e^{-2\pi})^{n-1}$ ($n$은 자연수)
      source_flow: 예시 답안 p.6
      criteria:
      - 4-2.M1
    - id: 42b-2
      content: |
        따라서 $\displaystyle\sum_{n=1}^{\infty}a_n=\dfrac{e^{-\frac{\pi}{2}}}{1-e^{-2\pi}}=\dfrac{e^{\frac{3\pi}{2}}}{e^{2\pi}-1}$
      source_flow: 예시 답안 p.6
      criteria:
      - 4-2.A1
