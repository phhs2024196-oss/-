- id: 1-2
  stem: |
    (2) 다음 식을 만족시키는 $a$와 $b$를 구하시오. (단, $a\ne b$) [5점]

    $$\lim_{x\to\infty}\dfrac{\sqrt{x+a^4}-\sqrt{x+b^4}}{\sqrt{4x+a}-\sqrt{4x+b}}=10$$
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: a=2; b=-1; a2=-1; b2=2
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $\displaystyle\lim_{x\to\infty}\dfrac{\{(x+a^4)-(x+b^4)\}(\sqrt{4x+a}+\sqrt{4x+b})}{\{(4x+a)-(4x+b)\}(\sqrt{x+a^4}+\sqrt{x+b^4})}=\lim_{x\to\infty}\dfrac{(a^4-b^4)\left(\sqrt{4+\frac{a}{x}}+\sqrt{4+\frac{b}{x}}\right)}{(a-b)\left(\sqrt{1+\frac{a^4}{x}}+\sqrt{1+\frac{b^4}{x}}\right)}$
        $=(a^2+b^2)(a+b)\dfrac{\sqrt4+\sqrt4}{\sqrt1+\sqrt1}=2\{(a+b)^2-2ab\}=2(1-2ab)=10$
      source_flow: 예시 답안 p.5
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        $ab=-2$, $a+b=1$로부터 $a=2$, $b=-1$ 또는 $a=-1$, $b=2$
