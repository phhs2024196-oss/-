    method_no: 1
    steps:
    - id: 41b-1
      content: |
        조건 (가)에서 $f(x)=\displaystyle\int\dfrac1x\cos(\ln x)\,dx$이고 $\ln x=t$라 하면 $\dfrac1x\,dx=dt$이므로 $f(x)=\displaystyle\int\cos t\,dt=\sin t+C=\sin(\ln x)+C$ ($C$는 적분상수)
      source_flow: 예시 답안 p.6
      criteria:
      - 4-1.M1
    - id: 41b-2
      content: |
        조건 (나)에서 $f(e^{-\pi})=1$이므로 $\sin(\ln e^{-\pi})+C=C=1$이다. 따라서 $f(x)=\sin(\ln x)+1$
      source_flow: 예시 답안 p.6
      criteria:
      - 4-1.A1
