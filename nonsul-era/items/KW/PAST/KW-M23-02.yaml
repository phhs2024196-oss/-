- id: 4-1
  stem: |
    [4] 열린구간 $(0,1)$에서 정의된 함수 $f(x)$가 다음 두 조건을 만족시킬 때, 물음에 답하시오.

    (가) $f(x)=\displaystyle\int\dfrac1x\cos(\ln x)\,dx$
    (나) $f(e^{-\pi})=1$

