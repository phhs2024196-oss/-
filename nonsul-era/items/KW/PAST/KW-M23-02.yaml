        $s=2t-\pi$라 하면, $t=\dfrac{s+\pi}{2}$, $dt=\dfrac12ds$, $t=\pi$일 때 $s=\pi$이고 $t=\dfrac{x+\pi}{2}$일 때 $s=x$
        따라서 $\displaystyle\lim_{x\to\pi}\dfrac{1}{x-\pi}\int_{\pi}^{\frac{x+\pi}{2}}f(2t-\pi)\,dt=\lim_{x\to\pi}\dfrac{1}{x-\pi}\int_{\pi}^{x}f(s)\dfrac12\,ds$
