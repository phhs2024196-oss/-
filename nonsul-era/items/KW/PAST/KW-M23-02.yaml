stimuli:
- label: '1'
  body: |
    1. 극대와 극소의 판정
    미분가능한 함수 $f(x)$에 대하여 $f^{\prime}(a)=0$일 때, $x=a$의 좌우에서
    (ⅰ) $f^{\prime}(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고, 극댓값 $f(a)$를 갖는다.
    (ⅱ) $f^{\prime}(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고, 극솟값 $f(a)$를 갖는다.
- label: '2'
  body: |
    2. 미분과 적분의 관계
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\dfrac{d}{dx}\int_a^xf(t)\,dt=f(x)\quad(\text{단, }a<x<b)$$
- label: '3'
  body: |
    3. 치환적분법을 이용한 정적분
    미분가능한 함수 $g(x)$의 도함수 $g^{\prime}(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 연속이고, $g(a)=\alpha$와 $g(b)=\beta$에 대하여 함수 $f(x)$가 $\alpha$와 $\beta$를 포함한 구간에서 연속일 때 다음이 성립한다.
    $$\int_a^bf(g(x))g^{\prime}(x)\,dx=\int_\alpha^\beta f(t)\,dt$$
- label: '4'
  body: |
    4. 수학적 확률
    표본공간 $S$에서 각각의 근원사건이 일어날 가능성이 모두 같은 정도로 기대될 때, 사건 $A$가 일어날 확률은 다음과 같다.
    $$\mathrm{P}(A)=\dfrac{n(A)}{n(S)}$$
stem: |
