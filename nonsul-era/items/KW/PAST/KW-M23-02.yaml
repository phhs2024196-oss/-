- id: 3-1
  stem: |
    [3] 함수 $f(x)=e^{-x}(\sin x+\cos x)$에 대하여 다음 물음에 답하시오.

    (1) $x>0$에서 함수 $f(x)$의 극댓값을 큰 것부터 차례로 $b_1,b_2,b_3,\cdots,b_n,\cdots$이라고 할 때, 자연수 $n$에 대하여 $\ln\dfrac{b_n}{b_{n+1}}$의 값을 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: 2*pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $f^{\prime}(x)=-e^{-x}(\sin x+\cos x)+e^{-x}(\cos x-\sin x)=-2e^{-x}\sin x$
        $f^{\prime}(x)=0$이면 $\sin x=0$이므로 $x=n\pi$ $(n=1,2,3,\cdots)$
        $x=2m\pi$ $(m=1,2,3,\cdots)$의 좌우에서 $f^{\prime}(x)$의 부호가 양에서 음으로 바뀌므로 $f(x)$는 $x=2m\pi$에서 극대이다. (이계도함수를 이용하여 $x=2m\pi$에서 $f^{\prime\prime}(x)=2e^{-x}(\sin x-\cos x)<0$이므로 극대임을 보여도 된다.)
        함수의 극댓값은 $f(2m\pi)=e^{-2m\pi}(\sin2m\pi+\cos2m\pi)=e^{-2m\pi}$이고 $e^{-2m\pi}>e^{-2(m+1)\pi}$ $(m=1,2,3,\cdots)$이므로 $b_m=e^{-2m\pi}$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        따라서 $\ln\dfrac{b_n}{b_{n+1}}=\ln\dfrac{e^{-2n\pi}}{e^{-2(n+1)\pi}}=\ln e^{2\pi}=2\pi$
      source_flow: 예시 답안 p.5
      criteria:
      - 3-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3-1.M1
      mark_type: M
      points: 4
