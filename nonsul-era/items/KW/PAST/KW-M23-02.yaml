intent: |
  [1] (1) 연속함수의 성질을 이해하고 지수함수의 미분을 활용할 수 있는 능력을 평가한다. (2) 함수의 극한에 대한 성질을 이해하고, 무리식의 극한값을 계산할 수 있는 능력을 평가한다. [2] 미분과 적분의 관계를 이해하는 능력과 로그함수와 관련된 적분을 계산하는 능력을 평가한다. [3] (1) 함수의 곱의 미분을 계산하는 능력과 함수의 극대와 극소를 판정하는 추론 능력을 평가한다. (2) 도함수와 정적분의 정의를 이해하고, 극한값을 계산하는 능력을 평가한다. [4] (1) 치환적분법을 이용하여 조건식을 만족시키는 함수를 계산하는 능력을 평가한다. (2) 삼각방정식의 풀이 능력과 등비급수의 합을 계산하는 능력을 평가한다. [5] (1) 확률의 기본 성질을 이해하는 능력과 여러 가지 경우의 수를 계산하는 능력을 평가한다. (2) 확률의 뜻을 이해하는 능력과 이를 활용할 수 있는 능력을 평가한다. (광운대 공식 '출제 의도')
key_idea: |
  $a+b=1$ 아래 $2^a+2^{1-a}$을 극값으로, $\dfrac{\sqrt{x+a^4}-\sqrt{x+b^4}}{\sqrt{4x+a}-\sqrt{4x+b}}$를 유리화해 $ab=-2$를 얻는다. 적분 등식을 미분해 $\dfrac{f^{\prime}}{f}=-\dfrac1{2x}$를 풀고, 극댓값 $e^{-2m\pi}$의 비로 $\ln\dfrac{b_n}{b_{n+1}}$을 구한다. $s=2t-\pi$ 치환과 미분계수의 정의로 극한을 구하고, $\sin(\ln x)=-1$의 근을 등비수열로 보아 급수 합을 구한다. 남은 $4$경기의 $2^4=16$가지 경우로 승률을 센다.
stuck: |
  [2]에서 양변을 미분하기 전에 $x=1$을 대입해 $f(1)=\dfrac12$를 얻어 두고 $\dfrac{f^{\prime}(x)}{f(x)}=-\dfrac{1}{2x}$를 적분해 상수를 정하는 단계
