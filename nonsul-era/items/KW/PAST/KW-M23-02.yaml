- id: '2'
  stem: |
    [2] $x>0$에서 미분가능한 함수 $f(x)$가 다음 등식을 만족시킬 때, $f(9)$의 값을 구하시오. [8점]

    $$2xf(x)-x=\int_1^x\{f(t)-1\}\,dt$$
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 1/6
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $2xf(x)-x=\displaystyle\int_1^x\{f(t)-1\}\,dt\cdots\cdots①$
        ①의 양변에 $x=1$을 대입하면 $2f(1)-1=0$, 즉 $f(1)=\dfrac12\cdots\cdots②$
      source_flow: 예시 답안 p.5
      criteria:
      - 2.B1
    - id: 2b-2
      content: |
        ①의 양변을 $x$에 대하여 미분하면 $2f(x)+2xf^{\prime}(x)-1=f(x)-1$, 즉 $\dfrac{f^{\prime}(x)}{f(x)}=-\dfrac{1}{2x}\cdots\cdots③$
        $\displaystyle\int\dfrac{f^{\prime}(x)}{f(x)}\,dx=\ln\lvert f(x)\rvert$이므로 ③의 양변을 적분하면 $\ln\lvert f(x)\rvert=-\dfrac12\ln x+C\cdots\cdots④$
        양변에 $x=1$을 대입하면 $\ln f(1)=C$이고 ②로부터 $C=\ln\dfrac12$
        ④로부터 $\ln\lvert f(x)\rvert=-\dfrac12\ln x+\ln\dfrac12=\ln\dfrac{1}{2\sqrt x}$
        ②로부터 $f(x)=\dfrac{1}{2\sqrt x}$
      source_flow: 예시 답안 p.5
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        $f(9)=\dfrac16$
      source_flow: 예시 답안 p.5
      criteria:
      - 2.A1
  rubric:
