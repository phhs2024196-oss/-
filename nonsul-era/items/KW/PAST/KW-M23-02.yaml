        (다른 풀이) A의 승리를 a, B의 승리를 b로 표시하면, 4번의 경기가 치러질 때 우승자가 가려지는 경우는 다음과 같은 $16$가지의 경우이다. A가 이기는 경우($11$가지): aaaa, aaab, aaba, abaa, baaa, aabb, abba, bbaa, abab, baba, baab / B가 이기는 경우($5$가지): bbbb, bbba, bbab, babb, abbb
