    - id: 3-1.A1
      mark_type: A
      points: 2
      evidence: |
        $\ln\dfrac{b_n}{b_{n+1}}=2\pi$를 구했다.
      depends_on:
      - 3-1.M1
      steps:
      - 31b-2
    deductions: []
