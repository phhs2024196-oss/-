subparts:
- id: 1-1
  stem: |
    [1] 등식 $a+b=1$을 만족시키는 실수 $a,b$에 대하여 다음 물음에 답하시오.

    (1) $a\ge0$, $b\ge0$일 때, 실수 $2^a+2^b$의 최댓값과 최솟값을 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: max=3; min=2*sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $b=1-a$이므로 $0\le a\le1$일 때 $2^a+2^{1-a}$의 최댓값과 최솟값을 구하면 된다. $f(x)=2^x+2^{1-x}$라 하면, $f^{\prime}(x)=(2^x-2^{1-x})\ln2=0$으로부터 $2^x=2^{1-x}$이므로 $x=\dfrac12$이다. $x=\dfrac12$의 좌우에서 $f^{\prime}(x)$의 부호가 음에서 양으로 바뀌므로 $f(x)$는 극소이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        $0\le x\le1$에서 $x=0$ 또는 $x=1$일 때 최댓값 $3$, $x=\dfrac12$일 때 최솟값 $2\sqrt2$
      source_flow: 예시 답안 p.5
      criteria:
      - 1-1.B1
      - 1-1.A1
