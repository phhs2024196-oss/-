    - id: 22b-2
      content: |
        ②의 등비수열의 항은 양수이므로 $1+\dfrac12+\dfrac1{2^{2}}+\cdots+\dfrac1{2^{n-1}}<\displaystyle\sum_{n=0}^{\infty}\dfrac1{2^{n}}=\dfrac{1}{1-\frac12}=2$ …… ③이다. ②와 ③으로부터 모든 자연수 $n$에 대하여 $1\le a_n<2$이다. 따라서 $-2023\le a_{2024}-2024<-2022$이므로 $m=-2023$이다.
