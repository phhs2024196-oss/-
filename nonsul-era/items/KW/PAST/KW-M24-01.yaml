  stem: |
    (2) 급수 $\displaystyle\sum_{n=1}^{\infty}\dfrac{1}{a_n(a_n+1)(a_n+2)}$의 수렴과 발산을 조사하고 수렴하면 급수의 합을 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 1/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S32-B
    audience: B
    method_no: 1
    steps:
    - id: 32b-1
      content: |
        주어진 급수의 $n$항까지의 부분합을 $S_n$이라고 하자. $\dfrac{1}{a_n(a_n+1)(a_n+2)}=\dfrac{1}{n(n+1)(n+2)}=\dfrac12\left\{\dfrac{1}{n(n+1)}-\dfrac{1}{(n+1)(n+2)}\right\}$이므로
        $S_n=\displaystyle\sum_{k=1}^{n}\dfrac12\left\{\dfrac{1}{k(k+1)}-\dfrac{1}{(k+1)(k+2)}\right\}=\dfrac12\left\{\dfrac12-\dfrac{1}{(n+1)(n+2)}\right\}$이다.
      source_flow: 모범답안 p.5
      criteria:
      - 3-2.M1
    - id: 32b-2
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}S_n=\lim_{n\to\infty}\left\{\dfrac14-\dfrac{1}{2(n+1)(n+2)}\right\}=\dfrac14$이므로 주어진 급수는 수렴하고 그 합은 $\dfrac14$이다.
      source_flow: 모범답안 p.5
      criteria:
      - 3-2.A1
      - 3-2.R1
