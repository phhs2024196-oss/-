stimuli:
- label: '1'
  body: |
    사인법칙
    삼각형 $\mathrm{ABC}$에서 세 각 $\angle\mathrm{A},\angle\mathrm{B},\angle\mathrm{C}$의 크기를 각각 $A,B,C$로 나타내고 이들의 대변 $\mathrm{BC}$, $\mathrm{AC}$, $\mathrm{AB}$의 길이를 각각 $a,b,c$라고 나타낼 때, 삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이를 $R$라고 하면
    $$\dfrac{a}{\sin A}=\dfrac{b}{\sin B}=\dfrac{c}{\sin C}=2R$$
- label: '2'
  body: |
    수학적 귀납법
    자연수 $n$에 대하여 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.
    (ⅰ) $n=1$일 때, 명제 $p(n)$이 성립한다.
    (ⅱ) $n=k$일 때 명제 $p(n)$이 성립한다고 가정하면 $n=k+1$일 때에도 명제 $p(n)$이 성립한다.
