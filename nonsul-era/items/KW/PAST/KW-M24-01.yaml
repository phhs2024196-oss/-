  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        (ⅰ) $n=1$일 때 (좌변)$=1!=1$, (우변)$=2^{0}=1$이므로 $n=1$일 때 주어진 부등식이 성립한다.
      source_flow: 모범답안 p.4
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: |
        (ⅱ) $n=k$일 때 주어진 부등식이 성립한다고 가정하면 $k!\ge2^{k-1}$ …… ①이므로 ①의 양변에 $k+1$을 곱하면 $k\ge1$이므로 $(k+1)!=k!(k+1)\ge2^{k-1}(k+1)\ge2^{k-1}\cdot2=2^{k}$이다. 따라서 $n=k+1$일 때에도 주어진 부등식이 성립한다. 그러므로 주어진 부등식은 모든 자연수 $n$에 대하여 성립한다. ■
      source_flow: 모범답안 p.4
      criteria:
