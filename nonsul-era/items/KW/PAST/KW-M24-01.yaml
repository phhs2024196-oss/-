- id: '4'
  stem: |
    [4] 아래 조건들을 모두 만족시키는 실수 $k$의 범위를 구하시오. [10점]

    (가) 이차방정식 $(\ln k-1)x^{2}-2(\ln k-1)x+1=0$이 실근을 갖는다.
    (나) $2\sin^{2}\left(\dfrac{\pi}{2e}k-\dfrac{\pi}{4}\right)\le1$ (단, $-\dfrac{e}{2}\le k\le\dfrac{3e}{2}$)
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: lower=0; upper=E
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        조건 (가)에서 진수 조건과 이차방정식이라는 사실로부터 $k>0$, $\ln k-1\ne0$, 즉 $0<k$, $k\ne e$ …… ①이다. 이차방정식은 실근을 가지므로 판별식 $D=4(\ln k-1)^{2}-4(\ln k-1)=4(\ln k-1)(\ln k-2)\ge0$으로부터 $\ln k\le1$, $2\le\ln k$ 즉 $k\le e$, $e^{2}\le k$ …… ②이다. ①과 ②로부터 $0<k<e$, $e^{2}\le k$ …… ③이다.
      source_flow: 모범답안 p.5
      criteria:
      - 4.M1
      - 4.M2
    - id: 4b-2
      content: |
        조건 (나)의 부등식에서 $\dfrac{\pi}{2e}k-\dfrac{\pi}{4}=t$로 놓으면 $-\dfrac{e}{2}\le k\le\dfrac{3e}{2}$이므로 $-\dfrac{\pi}{2}\le t\le\dfrac{\pi}{2}$이다. 부등식 $2\sin^{2}t-1=(\sqrt2\sin t-1)(\sqrt2\sin t+1)\le0\iff-\dfrac{1}{\sqrt2}\le\sin t\le\dfrac{1}{\sqrt2}$을 풀면 $-\dfrac{\pi}{4}\le t\le\dfrac{\pi}{4}$이고 $-\dfrac{\pi}{4}\le\dfrac{\pi}{2e}k-\dfrac{\pi}{4}\le\dfrac{\pi}{4}$로부터 $0\le k\le e$ …… ④이다.
      source_flow: 모범답안 p.5
      criteria:
      - 4.M3
    - id: 4b-3
      content: |
        따라서 ③과 ④로부터 $k$의 범위는 $0<k<e$이다.
      source_flow: 모범답안 p.5
      criteria:
      - 4.A1
