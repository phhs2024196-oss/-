- id: 1-2
  stem: |
    (2) 삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이 $R$의 값을 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 3*pi/16
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        삼각형 $\mathrm{ABC}$에서 변 $\mathrm{BC},\mathrm{AC},\mathrm{AB}$의 길이를 각각 $a,b,c$라고 하면 ③에서 $a=\dfrac{\sqrt2\pi}{4}$이고, 변의 길이를 구하면 $b=\dfrac{\sqrt6\pi}{8}$, $c=\dfrac{\sqrt6\pi}{8}$이다.
      source_flow: 모범답안 p.4
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        코사인법칙을 이용하여 $\cos A$를 구하면 $\cos A=\dfrac{b^{2}+c^{2}-a^{2}}{2bc}=\dfrac13$이고 $\sin^{2}A+\cos^{2}A=1$이고 $A$는 삼각형의 한 각의 크기이므로 $\sin A=\sqrt{1-\cos^{2}A}=\dfrac{2\sqrt2}{3}$이다.
      source_flow: 모범답안 p.4
      criteria:
      - 1-2.A1
    - id: 12b-3
      content: |
        사인법칙을 이용하여 삼각형 $\mathrm{ABC}$에서 외접원의 반지름 $R$을 구하면 $R=\dfrac{a}{2\sin A}=\dfrac{\frac{\sqrt2\pi}{4}}{\frac{4\sqrt2}{3}}=\dfrac{3\pi}{16}$이다.
      source_flow: 모범답안 p.4
      criteria:
      - 1-2.A1
