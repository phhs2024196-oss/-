subparts:
- id: 1-1
  stem: |
    [1] 두 곡선 $y=\sin(\pi-x)$와 $y=\sin\left(\dfrac{\pi}{2}+x\right)$의 교점 중 $y$축에 가장 가까운 점을 $\mathrm{A}$라고 하고, 점 $\mathrm{A}$에서 각 곡선의 접선과 $y$축이 만나는 점을 $y$의 값이 큰 것부터 순서대로 $\mathrm{B},\mathrm{C}$라고 할 때 다음 물음에 답하시오.

    (1) 삼각형 $\mathrm{ABC}$의 넓이를 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: sqrt(2)*pi**2/32
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $y=\sin(\pi-x)=\sin\{\pi+(-x)\}=-\sin(-x)=\sin x$, $y=\sin\left(\dfrac{\pi}{2}+x\right)=\cos x$이므로 $\sin x=\cos x$일 때 $\tan x=1$이고, $y$축에 가장 가까운 교점은 $\mathrm{A}\left(\dfrac{\pi}{4},\dfrac{\sqrt2}{2}\right)$이다.
      source_flow: 모범답안 p.4
      criteria:
      - 1-1.M1
      - 1-1.M2
    - id: 11b-2
      content: |
        $f(x)=\sin x$, $g(x)=\cos x$라고 놓으면 $f^{\prime}(x)=\cos x$, $g^{\prime}(x)=-\sin x$이므로 $f^{\prime}\left(\dfrac{\pi}{4}\right)=\dfrac{\sqrt2}{2}$, $g^{\prime}\left(\dfrac{\pi}{4}\right)=-\dfrac{\sqrt2}{2}$이다.
        곡선 $y=\cos x$ 위의 점 $\mathrm{A}$에서 접선은 $y-\dfrac{\sqrt2}{2}=-\dfrac{\sqrt2}{2}\left(x-\dfrac{\pi}{4}\right)$이고, $y$절편은 $\dfrac{\sqrt2(4+\pi)}{8}$ …… ①이다.
        곡선 $y=\sin x$ 위의 점 $\mathrm{A}$에서 접선은 $y-\dfrac{\sqrt2}{2}=\dfrac{\sqrt2}{2}\left(x-\dfrac{\pi}{4}\right)$이고, $y$절편은 $\dfrac{\sqrt2(4-\pi)}{8}$ …… ②이다.
      source_flow: 모범답안 p.4
      criteria:
      - 1-1.M2
    - id: 11b-3
      content: |
        ①에서 ②를 빼면 변 $\mathrm{BC}$의 길이는 $\overline{\mathrm{BC}}=\dfrac{\sqrt2\pi}{4}$ …… ③이다. 따라서 삼각형 $\mathrm{ABC}$의 넓이는 $\dfrac12\times\dfrac{\sqrt2\pi}{4}\times\dfrac{\pi}{4}=\dfrac{\sqrt2\pi^{2}}{32}$이다.
      source_flow: 모범답안 p.4
      criteria:
      - 1-1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
