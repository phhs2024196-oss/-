- id: 3-1
  stem: |
    [3] 자연수 $n$에 대하여 함수 $f(x)=e^{x+1}(x^{2}+nx-n+1)+kx$의 역함수가 존재하도록 하는 실수 $k$의 최솟값을 $a_n$이라고 할 때, 다음 물음에 답하시오.

    (1) $\displaystyle\lim_{x\to\infty}\dfrac{x^{n}}{e^{x}}=0$을 이용하여 $a_n$을 구하시오. [11점]
  points: 11
  depends_on: []
  answer:
    kind: value
    value: n
    equivalents: []
    tolerance: null
  solutions:
  - id: S31-B
    audience: B
    method_no: 1
    steps:
    - id: 31b-1
      content: |
        $f(x)$의 역함수가 존재하려면 함수 $f(x)$는 일대일대응이어야 한다. $\displaystyle\lim_{x\to\infty}f(x)=\infty$이므로 $f(x)$는 증가함수이어야 한다.
      source_flow: 모범답안 p.5
      criteria:
      - 3-1.M1
    - id: 31b-2
      content: |
        $g(x)=f^{\prime}(x)$라고 놓으면 $g(x)=e^{x+1}\{x^{2}+(n+2)x+1\}+k$이다. $\displaystyle\lim_{x\to\infty}x^{2}e^{x}=\lim_{x\to\infty}xe^{x}=\lim_{x\to\infty}e^{x}=\infty$이므로 $\displaystyle\lim_{x\to\infty}g(x)=\infty$이다. $x=-t$라고 놓으면 $\displaystyle\lim_{x\to-\infty}x^{2}e^{x}=\lim_{t\to\infty}\dfrac{t^{2}}{e^{t}}=0$이고, 같은 방법으로 $\displaystyle\lim_{x\to-\infty}xe^{x}=0$이므로 $\displaystyle\lim_{x\to-\infty}g(x)=k$이다.
      source_flow: 모범답안 p.5
      criteria:
      - 3-1.M2
    - id: 31b-3
      content: |
        $g^{\prime}(x)=e^{x+1}\{x^{2}+(n+4)x+n+3\}=e^{x+1}(x+1)(x+n+3)$이므로 $g^{\prime}(x)=0$에서 $x=-n-3$ 또는 $x=-1$이다. 함수 $g(x)$의 증가와 감소를 나타내는 표를 만들면 다음과 같다.

        $$\begin{array}{c|ccccc}x&\cdots&-n-3&\cdots&-1&\cdots\\\hline g^{\prime}(x)&+&0&-&0&+\\\hline g(x)&\nearrow&e^{-n-2}(n+4)+k&\searrow&-n+k&\nearrow\end{array}$$
      source_flow: 모범답안 p.5
      criteria:
      - 3-1.M3
    - id: 31b-4
      content: |
        $x=-1$에서 $g(x)$는 최솟값을 갖는다. $g(-1)=-n+k\ge0$이면 $f^{\prime}(x)=g(x)\ge0$(등호는 $x=-1$일 때만 성립)이므로 $f(x)$는 증가함수이다. 따라서 $f(x)$의 역함수가 존재하는 범위는 $k\ge n$이고, 실수 $k$의 최솟값은 $a_n=n$이다.
      source_flow: 모범답안 p.5
