      content: |
        (1)의 부등식을 이용하면 모든 자연수 $n$에 대하여 $a_n=1+\dfrac1{2!}+\dfrac1{3!}+\cdots+\dfrac1{n!}\le1+\dfrac12+\dfrac1{2^{2}}+\cdots+\dfrac1{2^{n-1}}$ …… ②이다.
      source_flow: 모범답안 p.4
      criteria:
