stimuli:
- label: '1'
  body: |
    함수의 연속
    함수 $f(x)$가 실수 $a$에 대하여
    (ⅰ) 함수 $f(x)$가 $x=a$에서 정의되고
    (ⅱ) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재하며
    (ⅲ) $\displaystyle\lim_{x\to a}f(x)=f(a)$
    일 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다.
- label: '2'
  body: |
    미분가능
    함수 $y=f(x)$에 대하여
    $$\lim_{\Delta x\to0}\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$$
    가 존재하면 함수 $y=f(x)$는 $x=a$에서 미분가능하다고 한다.
stem: |
  [문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: 1-1
  stem: |
    [1] 모든 실수 $x$에서 정의된 함수 $f(x)$에 대하여 다음 물음에 답하시오.

    $$f(x)=\begin{cases}\displaystyle\lim_{n\to\infty}\dfrac{(x+x^{2n})\ln\lvert x\rvert}{x^{2n}+1}&(x\ne0)\\0&(x=0)\end{cases}$$

    (1) $\displaystyle\lim_{x\to\infty}\dfrac{x^{n}}{e^{x}}=0$을 이용하여 함수 $f(x)$의 연속성을 조사하시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: f(x)=x*ln|x| (|x|<1, x!=0); ln|x| (|x|>1); 0 (x=-1,0,1). 모든 실수 x에서 연속
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        (ⅰ) $\lvert x\rvert<1\ (\Leftrightarrow\lvert x^{2}\rvert<1)$, $x\ne0$일 때 $\displaystyle\lim_{n\to\infty}x^{2n}=0$이므로 $f(x)=x\ln\lvert x\rvert$는 연속이다.
      source_flow: 모범답안 p.5
      criteria:
      - 1-1.B1
    - id: 11b-2
      content: |
        (ⅱ) $\lvert x\rvert>1\ (\Leftrightarrow\lvert x^{2}\rvert>1)$일 때 $\displaystyle\lim_{n\to\infty}x^{2n}=\infty$이므로 $f(x)=\displaystyle\lim_{n\to\infty}\dfrac{\left(\frac{x}{x^{2n}}+1\right)\ln\lvert x\rvert}{1+\frac{1}{x^{2n}}}=\ln\lvert x\rvert$는 연속이다.
      source_flow: 모범답안 p.5
      criteria:
      - 1-1.B2
    - id: 11b-3
      content: |
        (ⅲ) $x=-1,0,1$일 때 $f(-1)=f(0)=f(1)=0$이다. (ⅰ), (ⅱ), (ⅲ)으로부터 $f(x)=\begin{cases}x\ln\lvert x\rvert&(\lvert x\rvert<1,\ x\ne0)\\\ln\lvert x\rvert&(\lvert x\rvert>1)\\0&(x=-1,0,1)\end{cases}$이다.
      source_flow: 모범답안 p.5
      criteria:
      - 1-1.R1
      - 1-1.R2
      - 1-1.R3
    - id: 11b-4
      content: |
        (ⅳ) $x=-1,1$에서 연속성을 조사하자. $\displaystyle\lim_{x\to-1-}\ln\lvert x\rvert=\lim_{x\to-1+}x\ln\lvert x\rvert=0=f(-1)$이므로 $x=-1$에서 함수 $f(x)$는 연속이다. $\displaystyle\lim_{x\to1-}x\ln\lvert x\rvert=\lim_{x\to1+}\ln\lvert x\rvert=0=f(1)$이므로 $x=1$에서 함수 $f(x)$는 연속이다.
      source_flow: 모범답안 p.5
      criteria:
      - 1-1.R1
      - 1-1.R2
    - id: 11b-5
      content: |
        (ⅴ) $x=0$에서 연속성을 조사하자. $\ln x=t$라고 놓으면 $\displaystyle\lim_{x\to0+}x\ln\lvert x\rvert=\lim_{t\to-\infty}te^{t}$ …… ①이고, ①에서 $t=-p$라고 놓으면 $\displaystyle\lim_{t\to-\infty}te^{t}=-\lim_{p\to\infty}\dfrac{p}{e^{p}}=0=f(0)$이다. $\ln(-x)=t$라고 놓으면 $\displaystyle\lim_{x\to0-}x\ln\lvert x\rvert=\lim_{t\to-\infty}(-te^{t})$ …… ②이고, ②에서 $t=-p$라고 놓으면 $\displaystyle\lim_{t\to-\infty}(-te^{t})=\lim_{p\to\infty}\dfrac{p}{e^{p}}=0=f(0)$이다. 따라서 $x=0$에서 함수 $f(x)$는 연속이다. (ⅰ), (ⅱ), (ⅳ), (ⅴ)로부터 함수 $f(x)$는 모든 실수에서 연속이다. ■
      source_flow: 모범답안 p.5
      criteria:
      - 1-1.R3
