- id: '2'
  stem: |
    [2] 이차 이상의 다항함수 $f(x)$와 함수 $g(x)=e^{x^{3}+x+1}$가 아래 조건들을 만족시킬 때, 다항식 $R(x)$를 구하시오. [10점]

    (가) $(f\circ g^{-1})(e)=\pi$
    (나) $(f\circ g^{-1})^{\prime}(e)=1$
    (다) $R(x)$는 $f(x)$를 $x^{2}$으로 나눈 나머지다.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: a=E; b=pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        조건 (다)에서 $f(x)$를 $x^{2}$으로 나누었을 때의 몫을 $Q(x)$, 나머지를 $R(x)=ax+b$라고 하면 $f(x)=x^{2}Q(x)+ax+b$ …… ①이다.
      source_flow: 모범답안 p.6
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        조건 (가)에서 $g^{-1}(e)=0$이므로 $f(0)=b=\pi$이다.
      source_flow: 모범답안 p.6
      criteria:
      - 2.B1
    - id: 2b-3
      content: |
        조건 (나)에서 $(f\circ g^{-1})^{\prime}(e)=f^{\prime}(g^{-1}(e))(g^{-1})^{\prime}(e)=f^{\prime}(0)\dfrac{1}{g^{\prime}(0)}$ …… ②이다.
      source_flow: 모범답안 p.6
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        $g^{\prime}(0)=e$이고, ①로부터 $f^{\prime}(x)=2xQ(x)+x^{2}Q^{\prime}(x)+a$이므로 $f^{\prime}(0)=a$이다. 이것들을 ②에 대입하면 $(f\circ g^{-1})^{\prime}(e)=\dfrac{a}{e}=1$, 즉 $a=e$이다. 따라서 $R(x)=ex+\pi$이다.
      source_flow: 모범답안 p.6
      criteria:
      - 2.A1
  rubric:
