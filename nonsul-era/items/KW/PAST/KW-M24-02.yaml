      content: |
        $\displaystyle\int_{\frac1e}^{e}f(x)dx=\int_{\frac1e}^{1}x\ln x\,dx+\int_{1}^{e}\ln x\,dx$
      source_flow: 모범답안 p.6
      criteria:
      - 1-3.M1
    - id: 13b-2
      content: |
        $=\displaystyle\left[\dfrac12x^{2}\ln x\right]_{\frac1e}^{1}-\dfrac12\int_{\frac1e}^{1}x\,dx+\left[x\ln x-x\right]_{1}^{e}$
      source_flow: 모범답안 p.6
      criteria:
