- id: 1-2
  stem: |
    (2) $x=1$에서의 미분가능성을 조사하시오. [4점]
  points: 4
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        $\displaystyle\lim_{h\to0+}\dfrac{f(1+h)-f(1)}{h}=\lim_{h\to0+}\dfrac{\ln(1+h)}{h}=\lim_{h\to0+}\ln(1+h)^{\frac1h}=\ln e=1$
      source_flow: 모범답안 p.5
      criteria:
      - 1-2.B1
    - id: 12b-2
      content: |
        $\displaystyle\lim_{h\to0-}\dfrac{f(1+h)-f(1)}{h}=\lim_{h\to0-}\dfrac{(1+h)\ln(1+h)}{h}=\lim_{h\to0-}(1+h)\ln(1+h)^{\frac1h}=1\cdot\ln e=1$이다. 좌미분계수와 우미분계수가 같으므로 함수 $f(x)$는 $x=1$에서 미분가능하다.
      source_flow: 모범답안 p.5
      criteria:
      - 1-2.B2
