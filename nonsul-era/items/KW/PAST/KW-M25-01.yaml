stimuli:
- label: '1'
  body: |
    서로 다른 $n$개에서 $r$개를 선택하는 순열의 수는
    $${}_n\mathrm{P}_r=n(n-1)(n-2)\cdots(n-(r-1))=\frac{n!}{(n-r)!}\quad(\text{단, }0<r\le n)$$
    $$n!=n\times(n-1)\times(n-2)\times\cdots\times2\times1\quad(\text{단, }0!=1)$$
- label: '2'
  body: |
    서로 다른 $n$개에서 $r$개를 선택하는 조합의 수는
    $${}_n\mathrm{C}_r=\frac{{}_n\mathrm{P}_r}{r!}=\frac{n!}{r!(n-r)!}\quad(\text{단, }0<r\le n)$$
- label: '3'
  body: |
    이차방정식 $ax^2+bx+c=0$의 두 근을 $\alpha$, $\beta$라 하면
    $$\alpha+\beta=-\frac{b}{a},\ \alpha\beta=\frac{c}{a}$$
