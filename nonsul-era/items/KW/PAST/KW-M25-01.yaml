  solutions:
  - id: S12-B
    audience: B
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        K와 G 사이에 $3$개의 문자가 있는 경우는 K$\square\square\square$G와 G$\square\square\square$K 배열의 문자열이 있는 경우이고, 각 경우의 수는 동일하다.
      source_flow: 예시 답안 p.4
      criteria:
      - 1-2.M1
    - id: 12b-2
      content: |
        (ⅰ) K$\square\square\square$G인 경우 W, W, N, N, O, O, A를 서로 다른 문자라고 생각하고, 그 중에서 $3$개를 선택하여 K와 G 사이에 배치하는 경우의 수는 ${}_7\mathrm{P}_3=\dfrac{7!}{(7-3)!}=210$이다.
        그 다음에 K$\square\square\square$G를 하나의 문자라고 생각하고, 나머지 $4$개의 문자와 합쳐 총 $5(=1+4)$개의 문자를 배열하는 경우의 수는 ${}_5\mathrm{P}_5=5!=120$이다.
        그런데, W, W, N, N, O, O, A는 서로 다른 문자가 아니고, W, N, O가 각각 $2$개씩 있다.
        따라서, 앞에서 구한 결과에서 같은 문자끼리 자리를 바꾸는 것은 동일한 문자열로 간주되기 때문에 ${}_2\mathrm{P}_2=2!=2$로 나누어주어야 한다.
        그러므로, 구하고자 하는 경우의 수는 $\dfrac{{}_7\mathrm{P}_3\times{}_5\mathrm{P}_5}{{}_2\mathrm{P}_2\times{}_2\mathrm{P}_2\times{}_2\mathrm{P}_2}=\dfrac{210\times120}{2!\times2!\times2!}=3{,}150$이다.
      source_flow: 예시 답안 p.4
      criteria:
      - 1-2.M2
      - 1-2.M3
      - 1-2.A1
    - id: 12b-3
      content: |
        (ⅱ) G$\square\square\square$K인 경우도 같은 방법으로 경우의 수는 $3{,}150$이다.
        그러므로, K와 G사이에 $3$개의 문자가 있는 경우의 수는 $6{,}300(=2\times3{,}150)$이다.
      source_flow: 예시 답안 p.4
      criteria:
      - 1-2.A1
