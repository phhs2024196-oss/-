subparts:
- id: 1-1
  stem: |
    [1] 다음과 같이 문자가 적힌 $9$장의 카드가 있다. 이 $9$장의 카드를 모두 일렬로 나열해 보자.

    [그림 1: 문자 K, W, A, N, G, W, O, O, N 이 각각 적힌 카드 9장이 왼쪽부터 차례로 한 줄로 놓여 있다]

    (1) $9$장의 카드를 모두 일렬로 나열하는 경우의 수를 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '45360'
    equivalents: []
    tolerance: null
  solutions:
  - id: S11-B
    audience: B
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $9$개의 서로 다른 문자를 배열하는 경우의 수는 ${}_9\mathrm{P}_9=9!$이다.
        W, N, O가 $2$개씩 있어서 같은 문자끼리 자리를 바꾸는 것은 동일한 문자열로 간주되기 때문에 이들 문자 각각에 의해 만들어지는 배열의 경우의 수인 ${}_2\mathrm{P}_2=2!$로 나누어주어야 한다.
      source_flow: 예시 답안 p.4
      criteria:
      - 1-1.M1
    - id: 11b-2
      content: |
        따라서 $2$개씩 같은 문자 $3$개를 포함하는 $9$개의 문자를 배열하여 만들어지는 문자열에 대한 경우의 수는
        $$\frac{{}_9\mathrm{P}_9}{{}_2\mathrm{P}_2\times{}_2\mathrm{P}_2\times{}_2\mathrm{P}_2}=\frac{9!}{2!\times2!\times2!}=\frac{9\times8\times7\times6\times5\times4\times3\times2\times1}{2\times2\times2}=45{,}360$$이다.
      source_flow: 예시 답안 p.4
      criteria:
      - 1-1.A1
