key_idea: '[1] 같은 문자가 있는 순열은 서로 다른 것으로 보고 센 뒤 $2!$로 나누고, 묶음 문자를 하나로 보아 경우의 수를 센다. 알파벳순 순번은 앞 글자별로 개수를 누적한다. [2] 근과 계수의 관계로 $a_n+b_n$, $a_nb_n$을 구해 $a_n^2+b_n^2$과 $\dfrac{1}{a_n}+\dfrac{1}{b_n}$을 $n$의 식으로 쓰고, 부분분수로 소거해 합을 구한다. 최솟값은 완전제곱식으로 구한다.'
