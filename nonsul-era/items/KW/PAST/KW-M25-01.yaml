intent: '[1] (1) 서로 다른 요소만으로 구성된 배열에 대한 경우의 수와 같은 요소가 일부 포함된 배열에 대한 경우의 수를 구별하는 능력을 평가한다. (2) 지정된 구성의 문자열을 반드시 포함하는 것을 하나의 문자로 간주하여 경우의 수를 계산하는 능력을 평가한다. (3) 문자열을 사전식으로 배열했을 때 지정된 문자열의 사전 내에서의 순번을 찾아내는 능력을 평가한다. [2] (1) 이차방정식에서 근과 계수와의 관계를 통해 찾은 근의 합과 곱을 활용하여 제곱 형태로 주어진 일반항을 표현하고, 이 일반항을 이용하여 수열의 합을 계산하는 능력을 평가한다. (2) 이차방정식에서 근과 계수와의 관계를 통해 찾은 근의 합과 곱을 활용하여 분수 형태로 주어진 일반항을 표현하고, 이 일반항을 이용하여 수열의 합을 계산하는 능력을 평가한다. (3) 이차함수를 완전제곱식의 꼴로 고쳐서 주어진 이차함수의 최솟값을 구하는 능력을 평가한다. (광운대 공식 모의논술 해설 원문)'
