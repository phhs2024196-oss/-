    - id: 22b-2
      content: |
        $$\frac{1}{a_n}+\frac{1}{b_n}=\frac{a_n+b_n}{a_nb_n}=\frac{n}{-n^3-3n^2-2n}=\frac{n}{-n(n^2+3n+2)}=-\frac{1}{(n+1)(n+2)}=-\left(\frac{1}{n+1}-\frac{1}{n+2}\right)=\frac{1}{n+2}-\frac{1}{n+1}$$
      source_flow: 예시 답안 p.5
      criteria:
      - 2-2.M1
    - id: 22b-3
      content: |
        $$\sum_{n=1}^{2024}\left(\frac{1}{a_n}+\frac{1}{b_n}\right)=\sum_{n=1}^{2024}\left(\frac{1}{n+2}-\frac{1}{n+1}\right)=\left(\frac{1}{1+2}-\frac{1}{1+1}\right)+\left(\frac{1}{2+2}-\frac{1}{2+1}\right)+\cdots+\left(\frac{1}{2024+2}-\frac{1}{2024+1}\right)$$
        $$=-\frac{1}{1+1}+\frac{1}{2024+2}=\frac{1}{2026}-\frac12=\frac{1-1013}{2026}=-\frac{1012}{2026}=-\frac{506}{1013}$$
      source_flow: 예시 답안 p.5
