      content: |
        이차방정식 $x^2-nx-n^3-3n^2-2n=0$의 근과 계수의 관계에 의하여
        $a_n+b_n=n$이고, $a_nb_n=-n^3-3n^2-2n$이다.
      source_flow: 예시 답안 p.5
      criteria:
