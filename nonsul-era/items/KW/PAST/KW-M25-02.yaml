- id: '2'
  stem: |
    [2] 곡선 $x^3-y^3=\sin xy+1$ 위의 점 $(a,0)$에서의 접선의 기울기가 $b$일 때, $a+b$의 값을 구하시오. [6점]
  points: 6
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $(a,0)$이 곡선 $x^3-y^3=\sin xy+1$ 위의 점이므로
        $a^3=1$, $(a-1)(a^2+a+1)=0$, $a$는 실수이므로
        따라서 $a=1$
      source_flow: 예시 답안 p.5
      criteria:
      - 2.B1
    - id: 2b-2
      content: |
        $x^3-y^3=\sin xy+1$의 양변을 $x$에 대하여 미분하면
        $3x^2-3y^2\dfrac{dy}{dx}=\cos xy\left(y+x\dfrac{dy}{dx}\right)$
        따라서 $\dfrac{dy}{dx}=\dfrac{3x^2-y\cos xy}{3y^2+x\cos xy}$
      source_flow: 예시 답안 p.5
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        점 $(1,0)$에서의 접선의 기울기는 $b=3$
        따라서 $a+b=4$
      source_flow: 예시 답안 p.5
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        $a=1$을 구하면
      depends_on: []
      steps:
      - 2b-1
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        미분하여 $\dfrac{dy}{dx}=\dfrac{3x^2-y\cos xy}{3y^2+x\cos xy}$을 보이면
      depends_on: []
      implied_ok: false
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        점 $(1,0)$에서의 접선의 기울기 $b=3$과 $a+b=4$를 구하면
      depends_on:
      - 2.M1
      steps:
      - 2b-3
    deductions: []
