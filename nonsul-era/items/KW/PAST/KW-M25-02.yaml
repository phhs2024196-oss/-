stimuli:
- label: '1'
  body: |
    자연수 $n$에 대하여 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.
    (ⅰ) $n=1$일 때, 명제 $p(n)$이 성립한다.
    (ⅱ) $n=k$일 때, 명제 $p(n)$이 성립한다고 가정하면 $n=k+1$일 때에도 명제 $p(n)$이 성립한다.
- label: '2'
  body: |
    함수 $f(x)$가 실수 $a$에 대하여
    (ⅰ) 함수 $f(x)$가 $x=a$에서 정의되고
    (ⅱ) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재하며
    (ⅲ) $\displaystyle\lim_{x\to a}f(x)=f(a)$
    일 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다.
- label: '3'
  body: |
    함수 $y=f(x)$에 대하여
    $$\lim_{\Delta x\to0}\frac{f(a+\Delta x)-f(a)}{\Delta x}$$
    가 존재하면 함수 $y=f(x)$는 $x=a$에서 미분가능하다고 한다.
stem: |
  [문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: '1'
  stem: |
    [1] 모든 자연수 $n$에 대하여 $\displaystyle\lim_{x\to0}\frac{\sin nx}{\sin x}=n$이 성립함을 수학적 귀납법으로 증명하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (ⅰ) $n=1$일 때, (좌변)$=\displaystyle\lim_{x\to0}\frac{\sin x}{\sin x}=1$, (우변)$=1$
      source_flow: 예시 답안 p.5
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        (ⅱ) $n=k$일 때, 주어진 식이 성립한다고 가정하면 $\displaystyle\lim_{x\to0}\frac{\sin kx}{\sin x}=k$
      source_flow: 예시 답안 p.5
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        가정과 삼각함수의 덧셈정리를 이용하면
        $$\lim_{x\to0}\frac{\sin(k+1)x}{\sin x}=\lim_{x\to0}\frac{\sin kx\cos x+\cos kx\sin x}{\sin x}=\lim_{x\to0}\frac{\sin kx}{\sin x}\times\lim_{x\to0}\cos x+\lim_{x\to0}\cos kx=k\cdot1+1=k+1$$
        따라서 $n=k+1$일 때에도 주어진 식이 성립한다.
        (ⅰ), (ⅱ)로부터 주어진 식은 모든 자연수 $n$에 대하여 성립한다.
      source_flow: 예시 답안 p.5
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
