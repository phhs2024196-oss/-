- id: 4-2
  stem: |
    (2) $x=0$에서의 함수 $f^{\prime}(x)$의 연속성을 조사하시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: value
    value: 불연속
    equivalents: []
    tolerance: null
  solutions:
  - id: S42-B
    audience: B
    method_no: 1
    steps:
    - id: 42b-1
      content: |
        $x>0$일 때, $f^{\prime}(x)=2x\sin\dfrac1x-\cos\dfrac1x$
        $x<0$일 때, $f^{\prime}(x)=\dfrac{d}{dx}(-x)^{\frac32}=-\dfrac32(-x)^{\frac12}$
        $x=0$일 때, (1)의 결과로부터 $f^{\prime}(0)=0$
      source_flow: 예시 답안 p.6
      criteria:
      - 4-2.M1
      - 4-2.M2
    - id: 42b-2
      content: |
        따라서 다음을 얻는다.
        $$f^{\prime}(x)=\begin{cases}2x\sin\dfrac1x-\cos\dfrac1x&(x>0)\\0&(x=0)\\-\dfrac32(-x)^{\frac12}&(x<0)\end{cases}$$
      source_flow: 예시 답안 p.6
      criteria: []
    - id: 42b-3
      content: |
        $\displaystyle\lim_{x\to0+}f^{\prime}(x)=\lim_{x\to0+}\left(2x\sin\dfrac1x-\cos\dfrac1x\right)$에서 $\displaystyle\lim_{x\to0+}\cos\dfrac1x$의 값이 존재하지 않으므로 $\displaystyle\lim_{x\to0+}f^{\prime}(x)$과 $\displaystyle\lim_{x\to0}f^{\prime}(x)$은 존재하지 않는다.
        따라서 $x=0$에서 함수 $f^{\prime}(x)$는 불연속이다.
      source_flow: 예시 답안 p.6
      criteria:
      - 4-2.A1
