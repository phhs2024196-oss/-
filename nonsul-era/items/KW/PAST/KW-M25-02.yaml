        $\dfrac1x=t$로 놓으면 $dx=-\dfrac{dt}{t^2}$이고,
        $x=\dfrac2\pi$일 때 $t=\dfrac\pi2$, $x=\dfrac6\pi$일 때 $t=\dfrac\pi6$이므로
      source_flow: 예시 답안 p.6
