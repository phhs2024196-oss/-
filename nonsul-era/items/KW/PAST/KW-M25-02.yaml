- id: '3'
  stem: |
    [3] 모든 실수 $x$에서 정의된 함수 $g(x)=\displaystyle\sum_{k=0}^{2024}{}_{2024}\mathrm{C}_k\left(\frac14\right)^k\left(\frac34\right)^{2024-k}e^{\frac{kx}{2}}$에 대하여 방정식 $\dfrac{g^{\prime}(x)}{g(x)}=253$의 해를 $x=a$라고 하자. 실수 $a$의 값과 함수 $g(x)$ 위의 점 $(a,g(a))$에서의 접선의 방정식을 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: a=0; y=253*x+1
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $$g(x)=\sum_{k=0}^{2024}{}_{2024}\mathrm{C}_k\left(\frac14\right)^k\left(\frac34\right)^{2024-k}e^{\frac{kx}{2}}=\sum_{k=0}^{2024}{}_{2024}\mathrm{C}_k\left(\frac14e^{\frac{x}{2}}\right)^k\left(\frac34\right)^{2024-k}=\left(\frac14e^{\frac{x}{2}}+\frac34\right)^{2024}$$
        $$g^{\prime}(x)=2024\left(\frac14e^{\frac{x}{2}}+\frac34\right)^{2023}\frac18e^{\frac{x}{2}}$$
      source_flow: 예시 답안 p.5
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\dfrac{g^{\prime}(x)}{g(x)}=253\dfrac{e^{\frac{x}{2}}}{\frac14e^{\frac{x}{2}}+\frac34}=253$이므로 $e^{\frac{x}{2}}=\dfrac14e^{\frac{x}{2}}+\dfrac34$이고 $x=0$
        따라서 $a=0$
        접점은 $(a,g(a))=(0,1)$이고 접선의 기울기는 $g^{\prime}(0)=253\cdot g(0)=253$
        따라서 구하고자 하는 접선의 방정식은 $y=253x+1$
      source_flow: 예시 답안 p.5
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $g(x)=\left(\dfrac14e^{\frac{x}{2}}+\dfrac34\right)^{2024}$와 $g^{\prime}(x)=2024\left(\dfrac14e^{\frac{x}{2}}+\dfrac34\right)^{2023}\dfrac18e^{\frac{x}{2}}$를 보이면
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        $a=0$와 접선의 방정식 $y=253x+1$을 구하면
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 4-1
  stem: |
    [4] 모든 실수 $x$에서 정의된 함수 $f(x)$에 대하여 다음 물음에 답하시오.

    $$f(x)=\begin{cases}x^2\sin\dfrac1x&(x>0)\\0&(x=0)\\\sqrt{-x^3}&(x<0)\end{cases}$$

    (1) $x=0$에서 함수 $f(x)$의 미분가능성을 조사하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S41-B
    audience: B
    method_no: 1
    steps:
    - id: 41b-1
      content: |
        (ⅰ) $\displaystyle\lim_{h\to0+}\frac{f(0+h)-f(0)}{h}=\lim_{h\to0+}\frac{h^2\sin\dfrac1h-0}{h}=\lim_{h\to0+}h\sin\frac1h$
        $-1\le\sin\dfrac1h\le1$이고 $h>0$이면 $-h\le h\sin\dfrac1h\le h$이다.
        이 부등식에 $h\to0+$과 함수의 극한의 대소 관계를 적용하면 다음을 얻는다.
        $\displaystyle\lim_{h\to0+}\frac{f(0+h)-f(0)}{h}=\lim_{h\to0+}h\sin\frac1h=0$
      source_flow: 예시 답안 p.6
      criteria:
      - 4-1.B1
    - id: 41b-2
      content: |
        (ⅱ) $\displaystyle\lim_{h\to0-}\frac{f(0+h)-f(0)}{h}=\lim_{h\to0-}\frac{\sqrt{-h^3}-0}{h}=\lim_{h\to0-}\frac{\sqrt{(-h)^3}}{-\sqrt{(-h)^2}}=\lim_{h\to0-}\left(-\sqrt{-h}\right)=0$
        (ⅰ)과 (ⅱ)로부터 $f^{\prime}(0)=0$
      source_flow: 예시 답안 p.6
      criteria:
      - 4-1.B2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4-1.B1
      mark_type: B
      points: 4
      evidence: |
        $\displaystyle\lim_{h\to0+}\dfrac{f(0+h)-f(0)}{h}=\lim_{h\to0+}h\sin\dfrac1h=0$임을 보이면
      depends_on: []
      steps:
      - 41b-1
    - id: 4-1.B2
      mark_type: B
      points: 4
      evidence: |
        $\displaystyle\lim_{h\to0-}\dfrac{f(0+h)-f(0)}{h}=\lim_{h\to0-}\left(-\sqrt{-h}\right)=0$임을 보이면
      depends_on: []
      steps:
      - 41b-2
    deductions: []
