stimuli:
- label: '1'
  body: |
    $n$이 자연수일 때,
    $$(a+b)^n={}_n\mathrm{C}_0a^n+{}_n\mathrm{C}_1a^{n-1}b^1+\cdots+{}_n\mathrm{C}_ra^{n-r}b^r+\cdots+{}_n\mathrm{C}_nb^n$$
- label: '2'
  body: |
    함수 $f(x)$에서 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\le f(a)$일 때, 함수 $f(x)$는 $x=a$에서 극대라 하고, $f(a)$를 극댓값이라고 한다. 함수 $f(x)$에서 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\ge f(a)$일 때, 함수 $f(x)$는 $x=a$에서 극소라 하고, $f(a)$를 극솟값이라고 한다. 이때 극댓값과 극솟값을 통틀어 극값이라고 한다.
- label: '3'
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 이 구간의 모든 $x$에 대하여
    ① $f'(x)>0$이면 $f(x)$는 이 구간에서 증가한다.
    ② $f'(x)<0$이면 $f(x)$는 이 구간에서 감소한다.
- label: '4'
  body: |
    함수 $f(x)$ 위의 점 $\mathrm{P}(a,f(a))$에 대하여 $x=a$의 좌우에서 곡선의 모양이 아래로 볼록에서 위로 볼록으로 변하거나 위로 볼록에서 아래로 볼록으로 변할 때, 점 $\mathrm{P}$를 곡선 $y=f(x)$의 변곡점이라고 한다.
stem: |
  [문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: '1'
  stem: |
    [1] 세 직선 $y=3x$, $y=-\dfrac13x$, $y=mx+2\ (m>0)$로 둘러싸인 도형이 이등변삼각형일 때, 이 삼각형의 넓이를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 16/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 직선 $y=3x$와 $y=mx+2$의 교점을 $\mathrm{P}$라 하면 $\mathrm{P}\left(\dfrac{2}{3-m},\dfrac{6}{3-m}\right)$, $m\ne3$이다. 두 직선 $y=-\dfrac13x$와 $y=mx+2$의 교점을 $\mathrm{Q}$라 하면 $\mathrm{Q}\left(\dfrac{-6}{1+3m},\dfrac{2}{1+3m}\right)$, $m\ne-\dfrac13$이다.
      source_flow: 해설 p.5
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $y=3x$와 $y=-\dfrac13x$가 수직이므로 주어진 도형이 이등변삼각형이면 $\overline{\mathrm{OP}}=\overline{\mathrm{OQ}}$이다. $\overline{\mathrm{OP}}=\dfrac{2\sqrt{10}}{\lvert3-m\rvert}$, $\overline{\mathrm{OQ}}=\dfrac{2\sqrt{10}}{\lvert1+3m\rvert}$이므로 $\lvert3-m\rvert=\lvert1+3m\rvert\Rightarrow m=\dfrac12$ ($\because m>0$)
      source_flow: 해설 p.5
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-3
      content: |
        이등변삼각형 $\mathrm{OPQ}$의 넓이를 $S$라고 하면 $S=\dfrac12\times\overline{\mathrm{OP}}\times\overline{\mathrm{OQ}}=\dfrac12\cdot\dfrac{4\sqrt{10}}5\cdot\dfrac{4\sqrt{10}}5=\dfrac{16}5$이다.
        (다른 풀이) $m=\dfrac12$이므로 $\mathrm{P}\left(\dfrac45,\dfrac{12}5\right)$, $\mathrm{Q}\left(-\dfrac{12}5,\dfrac45\right)$이고 $S=\dfrac12\times\overline{\mathrm{PQ}}\times(\text{원점과 직선 }y=\tfrac12x+2\text{와의 거리})=\dfrac12\cdot\dfrac{8\sqrt5}5\cdot\dfrac4{\sqrt5}=\dfrac{16}5$이다.
      source_flow: 해설 p.5
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        삼각형의 꼭짓점 $\mathrm{P}\left(\dfrac{2}{3-m},\dfrac{6}{3-m}\right)$, $\mathrm{Q}\left(\dfrac{-6}{1+3m},\dfrac{2}{1+3m}\right)$를 구했다.
      depends_on: []
      steps:
      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        두 직선이 수직임을 언급하고 $\overline{\mathrm{OP}}$, $\overline{\mathrm{OQ}}$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $m=\dfrac12$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        넓이 $\dfrac{16}5$을 구했다.
      depends_on:
      - 1.M1
      - 1.A1
      steps:
      - 1b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [2] $(1+x)^n$의 전개식을 이용하여 $\displaystyle\sum_{k=0}^{n}\dfrac{4k^2+2k-1}{k+1}{}_n\mathrm{C}_k=\dfrac{a_n}{n+1}$에서 $a_n$을 구하시오.(단, $n$은 자연수) [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: n^2*2^(n+1)-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $(1+x)^n$을 전개하면 $(1+x)^n={}_n\mathrm{C}_0+{}_n\mathrm{C}_1x+{}_n\mathrm{C}_2x^2+\cdots+{}_n\mathrm{C}_rx^r+\cdots+{}_n\mathrm{C}_nx^n$ ······①. $x=1$을 대입하면 $2^n=\displaystyle\sum_{k=0}^{n}{}_n\mathrm{C}_k$ ······②
      source_flow: 해설 p.5
      criteria:
      - 2.B1
    - id: 2b-2
      content: |
        ①의 양변을 미분하면 $n(1+x)^{n-1}={}_n\mathrm{C}_1+2\,{}_n\mathrm{C}_2x+\cdots+r\,{}_n\mathrm{C}_rx^{r-1}+\cdots+n\,{}_n\mathrm{C}_nx^{n-1}=\displaystyle\sum_{k=0}^{n}(k\,{}_n\mathrm{C}_k)x^{k-1}$이고 $x=1$을 대입하면 $n\cdot2^{n-1}=\displaystyle\sum_{k=0}^{n}(k\,{}_n\mathrm{C}_k)$ ······③
      source_flow: 해설 p.5
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        ①의 양변을 $0$에서 $1$까지 적분하면 $\dfrac{2^{n+1}-1}{n+1}={}_n\mathrm{C}_0+\dfrac{{}_n\mathrm{C}_1}{2}+\dfrac{{}_n\mathrm{C}_2}{3}+\cdots+\dfrac{{}_n\mathrm{C}_n}{n+1}=\displaystyle\sum_{k=0}^{n}\dfrac{{}_n\mathrm{C}_k}{k+1}$ ······④
      source_flow: 해설 p.5
      criteria:
      - 2.M1
    - id: 2b-4
      content: |
        ②, ③, ④로부터 $\displaystyle\sum_{k=0}^{n}\dfrac{4k^2+2k-1}{k+1}{}_n\mathrm{C}_k=\sum_{k=0}^{n}\left(4k-2+\dfrac1{k+1}\right){}_n\mathrm{C}_k=4\sum_{k=0}^{n}(k\,{}_n\mathrm{C}_k)-2\sum_{k=0}^{n}{}_n\mathrm{C}_k+\sum_{k=0}^{n}\dfrac{{}_n\mathrm{C}_k}{k+1}=n\cdot2^{n+1}-2^{n+1}+\dfrac{2^{n+1}-1}{n+1}=\dfrac{n^2\cdot2^{n+1}-1}{n+1}$이다. 따라서 $a_n=n^2\cdot2^{n+1}-1$이다.
      source_flow: 해설 p.5
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $\displaystyle\sum_{k=0}^{n}k\,{}_n\mathrm{C}_k=n\cdot2^{n-1}$, $\displaystyle\sum_{k=0}^{n}\dfrac{{}_n\mathrm{C}_k}{k+1}=\dfrac{2^{n+1}-1}{n+1}$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-2
      - 2b-3
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        $\displaystyle\sum_{k=0}^{n}{}_n\mathrm{C}_k=2^n$을 구했다.
      depends_on: []
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $\displaystyle\sum_{k=0}^{n}\dfrac{4k^2+2k-1}{k+1}{}_n\mathrm{C}_k=\dfrac{n^2\cdot2^{n+1}-1}{n+1}$과 $a_n=n^2\cdot2^{n+1}-1$을 구했다.
      depends_on:
      - 2.M1
      - 2.B1
      steps:
      - 2b-4
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [3] $0\le x<2\pi$에서 함수 $f(x)=\cos^2\left(x+\dfrac\pi2\right)-2a\cos(x+\pi)-1$의 최댓값이 $2$일 때, 함수 $f(x)$의 최솟값을 구하시오.(단, $a>0$) [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\cos\left(x+\dfrac\pi2\right)=-\sin x$, $\cos(x+\pi)=-\cos x$, $\sin^2x=1-\cos^2x$이므로 $f(x)=\sin^2x+2a\cos x-1=-\cos^2x+2a\cos x$이다.
      source_flow: 해설 p.6
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\cos x=t$로 놓으면 $f(x)=g(t)$, $-1\le t\le1$이고 $g(t)=-t^2+2at=-(t-a)^2+a^2\ (-1\le t\le1)$이다.
      source_flow: 해설 p.6
      criteria:
      - 3.M1
    - id: 3b-3
      content: |
        (ⅰ) $0<a<1$일 때 $g(t)$는 $t=a$에서 최댓값 $a^2$을 가지므로 $a^2=2$이고 $a=\pm\sqrt2$는 $0<a<1$을 만족시키지 않는다. (ⅱ) $a\ge1$일 때 $g(t)$는 $t=1$에서 최댓값 $-1+2a$를 가지므로 $-1+2a=2$ $\therefore a=\dfrac32$
      source_flow: 해설 p.6
      criteria:
      - 3.A1
    - id: 3b-4
      content: |
        $t=-1$일 때 최소이므로 $x=\pi$일 때 $f(x)$의 최솟값은 $f(\pi)=-4$이다.
      source_flow: 해설 p.6
      criteria:
      - 3.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $f(x)=-\cos^2x+2a\cos x$로 나타냈다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        $a=\dfrac32$를 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-3
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: |
        최솟값 $f(\pi)=-4$를 구했다.
      depends_on:
      - 3.M1
      - 3.A1
      steps:
      - 3b-4
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: 4-1
  stem: |
    [4] 함수 $f(x)=\dfrac35x^{\frac53}-3x^{\frac23}$에 대하여 다음 물음에 답하시오.

    (1) 함수 $f(x)$의 극값을 구하고, 변곡점의 좌표를 구하시오. [14점]
  points: 14
  depends_on: []
  answer:
    kind: expression
    value: max=0; min=-9*4^(1/3)/5; inflx=-1; infly=-18/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-1-B
    audience: B
    method_no: 1
    steps:
    - id: 4-1b-1
      content: |
        $f'(x)=x^{\frac23}-2x^{-\frac13}=\dfrac{x-2}{\sqrt[3]{x}}$이고 $f'(x)=0$에서 $x=2$이다. $f''(x)=\dfrac23x^{-\frac13}+\dfrac23x^{-\frac43}=\dfrac{2(x+1)}{3\sqrt[3]{x^4}}$이고 $f''(x)=0$에서 $x=-1$이다.
      source_flow: 해설 p.6
      criteria:
      - 4-1.B1
      - 4-1.B2
    - id: 4-1b-2
      content: |
        함수 $f(x)$의 증가와 감소, 곡선 $y=f(x)$의 오목과 볼록을 표로 나타내면 $x<-1$에서 $f'(x)>0$, $f''(x)<0$ (위로 볼록하게 증가), $x=-1$에서 $f''(x)=0$이며 $f(-1)=-\dfrac{18}5$(변곡점), $-1<x<0$에서 $f'(x)>0$, $f''(x)>0$ (아래로 볼록하게 증가), $x=0$에서 $f(0)=0$(극대), $0<x<2$에서 $f'(x)<0$, $f''(x)>0$ (아래로 볼록하게 감소), $x=2$에서 $f'(2)=0$이며 $f(2)=-\dfrac{9\sqrt[3]{4}}5$(극소), $x>2$에서 $f'(x)>0$, $f''(x)>0$ (아래로 볼록하게 증가)이다.
      source_flow: 해설 p.6
      criteria:
      - 4-1.M1
