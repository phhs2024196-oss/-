- id: 4-1
  stem: |
    [4] 다음과 같이 주어진 두 함수 $f(x)$와 $g(x)$에 대하여 다음 물음에 답하시오.
    $$f(x)=g(x)\ln x,\qquad g(x)=\begin{cases}e^x&(x>1)\\\pi&(x=1)\\-x&(0<x<1)\end{cases}$$
