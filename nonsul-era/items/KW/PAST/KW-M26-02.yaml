- id: '2'
  stem: |
    [2] 삼차함수 $f(x)=x^3+ax^2+3x$가 다음 조건을 만족시킬 때, 두 곡선 $y=f(x)$와 $y=f^{-1}(x)$로 둘러싸인 도형의 넓이를 구하시오. [12점]

    (가) $a$는 정수이다.
    (나) 역함수 $f^{-1}(x)$가 존재한다.
    (다) 방정식 $f(x)=f^{-1}(x)$는 음이 아닌 서로 다른 세 실근을 가진다.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (ⅰ) 함수 $f(x)$가 조건 (나)를 성립하려면 일대일대응이어야 한다. 증가함수는 일대일대응이므로 모든 $x$에 대하여 $f'(x)=3x^2+2ax+3\ge0$이다. 판별식 $D=4(a^2-9)\le0$, 즉 $-3\le a\le3$이다.
      source_flow: 해설 p.5~6
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        (ⅱ) 조건 (다)에서 방정식 $f(x)=f^{-1}(x)$의 근은 방정식 $f(x)=x$의 근과 일치한다. $f(x)-x=x^3+ax^2+2x=x(x^2+ax+2)$가 음이 아닌 서로 다른 세 실근을 가지려면 방정식 $x^2+ax+2=0$은 서로 다른 양의 근을 가져야 한다. 이를 위해서는 $y$절편이 $2$이므로 대칭축 $-\dfrac a2>0$이고 판별식 $D=a^2-8>0$, 즉 $a<-2\sqrt2$이다.
      source_flow: 해설 p.5~6
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        (ⅰ), (ⅱ) 그리고 조건 (가)로부터 $a=-3$이다. $f(x)-x=x^3-3x^2+2x=x(x-1)(x-2)=0$의 근은 $x=0,1,2$이다.
      source_flow: 해설 p.5~6
      criteria:
      - 2.A1
      - 2.B1
    - id: 2b-4
      content: |
        두 곡선 $y=f(x)$와 $y=f^{-1}(x)$로 둘러싸인 도형의 넓이를 $S$라고 하면 $S=\displaystyle\int_0^1\lvert f(x)-f^{-1}(x)\rvert\,dx+\int_1^2\lvert f(x)-f^{-1}(x)\rvert\,dx=2\int_0^1(f(x)-x)\,dx+2\int_1^2(x-f(x))\,dx=2\int_0^1(x^3-3x^2+2x)\,dx+2\int_1^2(-x^3+3x^2-2x)\,dx=2\left(\left[\dfrac{x^4}4-x^3+x^2\right]_0^1+\left[-\dfrac{x^4}4+x^3-x^2\right]_1^2\right)=2\left(\dfrac14-\dfrac{15}4+7-3\right)=1$이다.
      source_flow: 해설 p.5~6
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        판별식 $D=4(a^2-9)\le0$으로부터 $-3\le a\le3$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $a<-2\sqrt2$와 $a=-3$을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
      - 2b-3
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        $f(x)=f^{-1}(x)$의 근 $x=0,1,2$를 구했다.
      depends_on: []
      steps:
      - 2b-3
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: |
        두 곡선 $y=f(x)$와 $y=f^{-1}(x)$로 둘러싸인 도형의 넓이 $\displaystyle\int_0^1\lvert f(x)-f^{-1}(x)\rvert\,dx+\int_1^2\lvert f(x)-f^{-1}(x)\rvert\,dx=1$을 구했다.
      depends_on:
      - 2.M1
      - 2.A1
      - 2.B1
      steps:
      - 2b-4
    deductions: []
