- id: '3'
  stem: |
    [3] 확률변수 $K$가 정규분표[판독확인: 원문 표기 그대로 — 정규분포의 오기로 보임] $\mathrm{N}(5,9)$를 따를 때, 방정식 $9^x-8\cdot3^x+K+5=0$가 서로 다른 양의 실근을 가질 확률을 구하시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '0.8185'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $3^x=t$, $f(t)=t^2-8t+K+5$라고 하자. 그리고 $x>0$이면 $t>1$이다. 주어진 방정식이 서로 다른 양의 실근을 가진다면 방정식 $f(t)=0$은 $t>1$에서 서로 다른 두 근을 가진다. 이를 위해서 다음 두 조건이 만족되어야 한다. (ⅰ) $f(1)=K-2>0$ (ⅱ) $f(4)=K-11<0$ ($t=4$는 대칭축) (ⅰ)과 (ⅱ)로부터 $2<K<11$
      source_flow: 해설 p.6
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        확률변수 $Z=\dfrac{K-5}3$는 표준정규분포 $\mathrm{N}(0,1)$을 따르므로 $\mathrm{P}(2<K<11)=\mathrm{P}\!\left(\dfrac{2-5}3<Z<\dfrac{11-5}3\right)=\mathrm{P}(-1<Z<2)=\mathrm{P}(-1<Z<0)+\mathrm{P}(0<Z<2)=\mathrm{P}(0\le Z\le1)+\mathrm{P}(0\le Z\le2)=0.3413+0.4772=0.8185$이다.
      source_flow: 해설 p.6
      criteria:
      - 3.M2
      - 3.A1
