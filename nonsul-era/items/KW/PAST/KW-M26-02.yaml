stem: |
  [문제 2] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.
subparts:
- id: '1'
  stem: |
    [1] 수열 $\{a_n\}$은 첫째항이 $a\,(a>0)$이고 공비가 $r\,(r>0)$인 등비수열이다. 이때 $1$보다 큰 정수 $p$에 대하여 다음 수열 $\{b_n\}$의 일반항 $b_n$을 구하고 $\displaystyle\lim_{n\to\infty}b_n$의 값을 구하시오.(단, $\displaystyle\lim_{n\to\infty}\dfrac n{p^n}=0$) [12점]

    $$\sqrt[p]{a_1},\ \sqrt[p]{a_1\sqrt[p]{a_2}},\ \sqrt[p]{a_1\sqrt[p]{a_2\sqrt[p]{a_3}}},\ \sqrt[p]{a_1\sqrt[p]{a_2\sqrt[p]{a_3\sqrt[p]{a_4}}}},\ \cdots$$
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: b=a^((1-(1/p)^n)/(p-1))*r^S; S=(1/p^2)*(1-(1/p)^(n-1))/(1-1/p)^2-(n-1)/((1-1/p)*p^(n+1)); limit=a^(1/(p-1))*r^(1/(p-1)^2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_n=ar^{n-1}$과 $\sqrt[p]{rs}=\sqrt[p]{r}\sqrt[p]{s}$이므로 $b_1=\sqrt[p]{a_1}=a^{\frac1p}$, $b_2=\sqrt[p]{a_1\sqrt[p]{a_2}}=a^{\frac1p}(ar)^{\frac1{p^2}}=a^{\frac1p+\frac1{p^2}}r^{\frac1{p^2}}$, $b_3=a^{\frac1p+\frac1{p^2}+\frac1{p^3}}r^{\frac1{p^2}+\frac2{p^3}}$, ⋯, $b_n=a^{\sum_{k=1}^{n}\frac1{p^k}}r^{\sum_{k=2}^{n}\frac{k-1}{p^k}}\ (n\ge2)$이다.
      source_flow: 해설 p.5
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b-2
      content: |
        $b_n$에서 첫째항 $a$의 지수는 $\displaystyle\sum_{k=1}^{n}\dfrac1{p^k}=\dfrac{\frac1p\left\{1-\left(\frac1p\right)^n\right\}}{1-\frac1p}=\dfrac1{p-1}\left\{1-\left(\dfrac1p\right)^n\right\}$이다.
      source_flow: 해설 p.5
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $b_n$에서 공비 $r$의 지수를 $S_n=\dfrac1{p^2}+\dfrac2{p^3}+\cdots+\dfrac{n-1}{p^n}$이라고 하면 $\dfrac1pS_n=\dfrac1{p^3}+\dfrac2{p^4}+\cdots+\dfrac{n-2}{p^n}+\dfrac{n-1}{p^{n+1}}$이므로 $\left(1-\dfrac1p\right)S_n=\dfrac1{p^2}+\dfrac1{p^3}+\cdots+\dfrac1{p^n}-\dfrac{n-1}{p^{n+1}}=\dfrac{\frac1{p^2}\left\{1-\left(\frac1p\right)^{n-1}\right\}}{1-\frac1p}-\dfrac{n-1}{p^{n+1}}$이다. 즉 $S_n=\dfrac{\frac1{p^2}\left\{1-\left(\frac1p\right)^{n-1}\right\}}{\left(1-\frac1p\right)^2}-\dfrac{n-1}{\left(1-\frac1p\right)p^{n+1}}$이다. 따라서 $b_n=a^{\frac1{p-1}\left\{1-\left(\frac1p\right)^n\right\}}r^{S_n}$이다.
      source_flow: 해설 p.5
      criteria:
      - 1.M2
      - 1.A1
    - id: 1b-4
      content: |
        $\displaystyle\lim_{n\to\infty}\dfrac n{p^n}=0$을 이용하면 $\displaystyle\lim_{n\to\infty}b_n=\lim_{n\to\infty}a^{\frac1{p-1}\left\{1-\left(\frac1p\right)^n\right\}}r^{S_n}=a^{\frac1{p-1}}r^{\frac1{(p-1)^2}}$이다.
      source_flow: 해설 p.5
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $b_n$에서 첫째항 $a$의 지수 $\displaystyle\sum_{k=1}^{n}\dfrac1{p^k}=\dfrac1{p-1}\left\{1-\left(\dfrac1p\right)^n\right\}$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $b_n$에서 공비 $r$의 지수 $S_n=\dfrac1{p^2}+\dfrac2{p^3}+\cdots+\dfrac{n-1}{p^n}$을 세웠다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $S_n$의 닫힌 식을 구하고 $b_n=a^{\frac1{p-1}\left\{1-\left(\frac1p\right)^n\right\}}r^{S_n}$을 구했다.
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        극한값 $a^{\frac1{p-1}}r^{\frac1{(p-1)^2}}$을 구했다.
      depends_on:
      - 1.M1
      - 1.M2
      - 1.A1
      steps:
      - 1b-4
    deductions: []
