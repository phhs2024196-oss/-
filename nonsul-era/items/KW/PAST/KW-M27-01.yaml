intent: |
  [1] 수학적 귀납법의 원리를 이해하고 이를 이용하여 명제를 증명할 수 있는 능력을 평가한다. [2] 도함수를 활용하여 부등식이 성립하는 것을 증명하는 능력을 평가한다. 함수의 그래프와 성질을 이해하고 함수의 증가와 감소를 조사하여 문제를 해결하는 능력을 평가한다. [3] 주어진 조건을 이해하고 활용하는 능력과 정적분의 계산을 통해 조건을 만족시키는 다항함수를 결정할 수 있는 능력을 평가한다. [4] 항등식과 유리함수의 성질을 이해하고 다항식의 곱셈과 인수분해를 활용하여 문제를 해결하는 능력을 평가한다. [5] 조건부확률의 의미를 이해하고 이를 활용하여 확률 계산을 할 수 있는 능력을 평가한다. (모범답안 PDF 출제 의도 원문)
key_idea: |
  [1] $k\ge4$이면 $k^2\ge k+1$로 귀납 단계를 닫는다. [2] $g(x)=x-\sin x$의 증가성으로 $f^{\prime}=2(x-\sin x)$의 부호를 정한다. [3] 짝함수와 $f(0)=0$으로 $f=bx^2$, 치환적분으로 $b$를 정한다. [4] 항등식 계수 비교와 대칭식. [5] 전확률과 조건부확률.
stuck: |
  [2]에서 $\lvert\sin x\rvert\le\lvert x\rvert$을 $g(x)=x-\sin x$의 증가로 보이고 $f^{\prime}(x)$의 부호를 정하는 단계
