stimuli:
- label: '1'
  body: |
    수학적 귀납법
    자연수 $n$에 대한 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 증명하려면 다음 두 가지를 보이면 된다.
    ① $n=1$일 때, 명제 $p(n)$이 성립한다.
    ② $n=k$일 때 명제 $p(n)$이 성립한다고 가정하면 $n=k+1$일 때도 명제 $p(n)$이 성립한다.
- label: '2'
  body: |
    미분가능한 함수 $g(t)$에 대하여 $x=g(t)$로 놓으면
    $$\int f(x)dx=\int f(g(t))g^{\prime}(t)dt$$
- label: '3'
  body: |
    사건 $A$가 일어났을 때의 사건 $B$의 조건부확률은
    $$\mathrm{P}(B\mid A)=\frac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}\quad(\text{단, }\mathrm{P}(A)>0)$$
stem: '[문제 1] (50점) 다음 제시문을 읽고 문항별로 풀이와 함께 답하시오.'
subparts:
- id: '1'
  stem: '[1] $n\ge4$인 모든 자연수 $n$에서 $n!\ge n^2$이 성립함을 수학적 귀납법으로 증명하시오. [8점]'
  points: 8
  depends_on: []
  answer:
    kind: proof
    value: n>=4 에서 n!>=n^2 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $n!\ge n^2$ ······ ①. (ⅰ) $n=4$일 때 (좌변)$=4!=24\ge4^2=16$(우변)이므로 부등식 ①이 성립한다.
      source_flow: 예시 답안 p.5
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        (ⅱ) $n=k\,(k\ge4)$일 때 부등식 ①이 성립한다고 가정하면 $k!\ge k^2$ ······ ②. 부등식 ②의 양변에 $k+1$을 곱하면 $(k+1)!\ge k^2(k+1)$ ······ ③. $k\ge4$이면 $k(k-1)\ge12$이므로 $k^2\ge k+1$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        부등식 ③에서 $(k+1)!\ge k^2(k+1)\ge(k+1)^2$. 따라서 $n=k+1$일 때도 부등식 ①이 성립한다. 그러므로 (ⅰ),(ⅱ)에 따라 $n\ge4$인 모든 자연수 $n$에서 $n!\ge n^2$이 성립한다.
      source_flow: 예시 답안 p.5
      criteria:
      - 1.R1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: $n=4$일 때 $n!\ge n^2$임을 보였다.
      steps:
      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $k\ge4$이므로 $k^2\ge k+1$임을 보였다.
      steps:
      - 1b-2
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: $k\ge4$일 때 $k!\ge k^2$이라고 가정하여 $(k+1)!\ge(k+1)^2$을 보였다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    [2] 모든 실수 $x$에 대하여 $\lvert\sin x\rvert\le\lvert x\rvert$임을 보이고, 닫힌구간 $\left[-\dfrac\pi2,\pi\right]$에서 함수 $f(x)=x^2+2\cos x$의 최댓값과 최솟값을 구하시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: max=pi**2-2; min=2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\sin x$와 $x$의 크기를 비교하기 위해 $g(x)=x-\sin x$로 놓으면 $g^{\prime}(x)=1-\cos x\ge0$이므로 $g(x)$는 증가하고 $g(0)=0$이다. $x<0$일 때 $x<\sin x$이고 $x>0$일 때 $\sin x<x$이다. 그러므로 모든 실수 $x$에 대하여 $\lvert\sin x\rvert\le\lvert x\rvert$ ······ ①.
      source_flow: 예시 답안 p.5
      criteria:
      - 2.R1
    - id: 2b-2
      content: |
        함수 $f(x)=x^2+2\cos x$를 미분하면 $f^{\prime}(x)=2(x-\sin x)$이다. ①에서 $x<0$이면 $f^{\prime}(x)<0$이므로 $f(x)$는 닫힌구간 $\left[-\dfrac\pi2,0\right]$에서 감소하고 $x>0$이면 $f^{\prime}(x)>0$이므로 $f(x)$는 닫힌구간 $[0,\pi]$에서 증가한다.
      source_flow: 예시 답안 p.5
      criteria:
      - 2.M1
    - id: 2b-3
      content: 따라서 $f(x)$는 $x=0$에서 최소이고, 최솟값은 $f(0)=2$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 2.A1
    - id: 2b-4
      content: |
        $f\left(-\dfrac\pi2\right)=\dfrac{\pi^2}4<f(\pi)$이므로 $x=\pi$에서 최대이고, 최댓값은 $f(\pi)=\pi^2-2$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: $\lvert\sin x\rvert\le\lvert x\rvert$임을 보였다.
      steps:
      - 2b-1
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: $f(x)$의 증가와 감소를 조사했다.
      depends_on:
      - 2.R1
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: 최솟값 $f(0)=2$를 구했다.
      depends_on:
      - 2.R1
      - 2.M1
      steps:
      - 2b-3
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: 최댓값 $f(\pi)=\pi^2-2$를 구했다.
      depends_on:
      - 2.R1
      - 2.M1
      steps:
      - 2b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    [3] 다음 조건을 만족시키는 삼차 이하의 다항함수 $f(x)$를 구하시오. [10점]

    (가) $f(0)=0$
    (나) 모든 실수 $x$에 대하여 $f(-x)=f(x)$
    (다) $\displaystyle\int_0^1xe^{f(x)}dx=\frac{e^2-1}{4}$
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 2*x**2
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(x)=ax^3+bx^2+cx+d$로 놓으면 조건 (가)에서 $f(0)=0$이므로 $d=0$. $f(-x)=-ax^3+bx^2-cx$이므로 조건 (나)로부터 $2ax^3+2cx=0$. 따라서 $a=c=0$이므로 $f(x)=bx^2\,(b\ne0)$, 즉 $f(x)$는 이차항만 가지는 함수이다. ($b=0$이면 조건 (다)를 만족시키지 않는다)
      source_flow: 예시 답안 p.5
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        조건 (다)의 정적분을 구하기 위해 $bx^2=t$로 놓으면 $2bx\dfrac{dx}{dt}=1$이므로 $\displaystyle\int_0^1xe^{bx^2}dx=\int_0^b\frac1{2b}e^tdt=\frac1{2b}(e^b-1)$.
      source_flow: 예시 답안 p.5
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        조건 (다)로부터 $\dfrac1{2b}(e^b-1)=\dfrac{e^2-1}4$이므로 $b=2$이다. 따라서 $f(x)=2x^2$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: $f(x)$는 이차항만 있는 다항식임을 보였다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: $\displaystyle\int_0^1xe^{f(x)}dx$의 값을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: $f(x)=2x^2$을 구했다.
      depends_on:
      - 3.M1
      - 3.M2
      steps:
      - 3b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '4'
  stem: |
    [4] $x\ne0,-1$인 모든 실수 $x$에 대하여 다음 등식이 항상 성립할 때, 상수 $a,b$에 대하여 $a^5+b^5$의 값을 구하시오. [10점]

    $$\frac{ax+2}{x}+\frac{bx+b-2}{x+1}=\frac{a^2+b^2-1}{x(x+1)}+2$$
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 29/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        식의 양변에 $x(x+1)$을 곱하여 내림차순으로 정리하면 $(a+b)x^2+(a+b)x+2=2x^2+2x+a^2+b^2-1$.
      source_flow: 예시 답안 p.5~6
      criteria:
      - 4.M1
    - id: 4b-2
      content: 이므로 $a+b=2$, $a^2+b^2=3$.
      source_flow: 예시 답안 p.5~6
      criteria:
      - 4.A1
    - id: 4b-3
      content: $(a+b)^2=a^2+b^2+2ab$이므로 $ab=\dfrac12$.
      source_flow: 예시 답안 p.5~6
      criteria:
      - 4.A2
    - id: 4b-4
      content: |
        $a^3+b^3=(a+b)^3-3ab(a+b)=5$이므로 $a^5+b^5=(a^2+b^2)(a^3+b^3)-a^2b^2(a+b)=\dfrac{29}2$.
      source_flow: 예시 답안 p.5~6
      criteria:
      - 4.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 2
      evidence: 이차방정식으로 정리했다.
      steps:
      - 4b-1
    - id: 4.A1
      mark_type: A
      points: 2
      evidence: $a+b=2$, $a^2+b^2=3$을 구했다.
      depends_on:
      - 4.M1
      steps:
      - 4b-2
    - id: 4.A2
      mark_type: A
      points: 2
      evidence: $ab=\dfrac12$을 구했다.
      depends_on:
      - 4.M1
      - 4.A1
      steps:
      - 4b-3
    - id: 4.A3
      mark_type: A
      points: 4
      evidence: $a^5+b^5=\dfrac{29}2$를 구했다.
      depends_on:
      - 4.M1
      - 4.A1
      - 4.A2
      steps:
      - 4b-4
