- id: '5'
  stem: |
    [5] 어떤 병의 감염 여부를 진단하는 키트로 검사를 할 때, 병에 걸렸는데 양성으로 판정할 확률은 $99\%$, 병에 걸리지 않았는데 양성으로 판정할 확률은 $2\%$라고 한다. 병에 걸린 사람의 비율이 $1\%$인 어느 집단에서 임의로 한 명을 선택하여 이 방법으로 검사를 한 결과 양성으로 판정하였을 때, 그 사람이 실제로 병에 걸렸을 확률을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S5-B
    audience: B
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        병에 걸릴 사건을 $A$, 검사 결과가 양성으로 나오는 사건을 $B$라고 하면 $\mathrm{P}(A)=\dfrac1{100}=10^{-2}$. 양성판정을 받을 확률 $\mathrm{P}(B)$는 병에 걸렸을 경우와 걸리지 않았을 경우로 나누어 구한다.
      source_flow: 예시 답안 p.6
      criteria:
      - 5.M1
    - id: 5b-2
      content: |
        (ⅰ) $\mathrm{P}(A\cap B)=\mathrm{P}(A)\mathrm{P}(B\mid A)=10^{-2}\times0.99=\dfrac{99}{10000}$.
      source_flow: 예시 답안 p.6
      criteria:
      - 5.M1
    - id: 5b-3
      content: |
