intent: |
  [1] 로그 함수와 수열의 합인 $\sum$의 성질을 활용하여 수식을 다루는 능력과 자연상수의 정의를 이해하고 활용할 수 있는 능력을 평가한다. [2] (1) 함수식의 활용을 바탕으로 역함수 유도 능력을 평가한다. (2) 미지수를 포함한 극한 문제를 미분의 정의와 역함수의 미분법을 활용하여 풀이 과정에서 논리적으로 해결할 수 있는지를 평가한다. [3] 함수들의 곱의 미분에 대한 활용도를 평가하고 치환 적분을 이용한 함수의 정적분 계산 능력을 평가한다. [4] 비교 대상의 수식을 기하학적 대상에 투영하여 사고하는 능력과 구하고자 하는 선분의 길이를 계산하는 능력을 평가한다. (모범답안 PDF 출제 의도 원문)
key_idea: |
  [1]은 로그의 합을 곱으로 묶어 telescoping 후 $(1+x)^{1/x}\to e$로 처리한다. [2]는 $e^{g}$에 대한 이차방정식으로 $g$를 얻고, 극한이 존재하려면 분자가 $0$이어야 한다는 사실과 역함수의 미분을 쓴다. [3]은 곱의 미분 꼴 $\left(e^{1-\sqrt x}f\right)^{\prime}$로 읽는다. [4]는 반원의 세 선분 $\mathrm{OD}$, $\mathrm{CD}$, $\mathrm{EC}$가 산술·기하·조화평균임을 보인다.
stuck: |
  [3]에서 조건 (나)의 좌변이 $-\left(e^{1-\sqrt x}f(x)\right)^{\prime}$임을 알아보는 단계, [4]에서 $\mathrm{EC}$가 조화평균임을 닮음으로 보이는 단계
