- id: '4'
  stem: |
    [4] 아래 그림을 이용하여 다음 부등식을 증명하시오. (단, 점 $\mathrm{O}$는 반원의 중심) [12점]

    $$\frac{a+b}2>\sqrt{ab}>\frac{2ab}{a+b}\quad(0<a<b)$$

    [그림: 선분 AB를 지름으로 하는 반원. 지름 위의 점 C에 대하여 선분 AC의 길이가 $a$, 선분 CB의 길이가 $b$이다. 점 C에서 지름에 세운 수선이 반원과 만나는 점을 D라 하고, 점 D에서 반원에 접하는 직선 위에 점 E가 있어 선분 CE가 이 접선에 수직이다(직각 표시 있음). 반원의 중심 O와 D를 잇는 선분이 그려져 있다]
  points: 12
  depends_on: []
  answer:
    kind: proof
    value: (a+b)/2>sqrt(ab)>2ab/(a+b) 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $\overline{\mathrm{OD}}$는 반원의 반지름이므로 $\overline{\mathrm{OD}}=\dfrac{a+b}2$.
      source_flow: 예시 답안 p.7
      criteria:
      - 4.B1
    - id: 4b-2
      content: |
        직각삼각형 $\mathrm{COD}$에서 $\overline{\mathrm{CO}}=\dfrac{b-a}2$이므로 피타고라스 정리를 이용하면 $\overline{\mathrm{CD}}=\sqrt{\overline{\mathrm{OD}}^2-\overline{\mathrm{CO}}^2}=\sqrt{\dfrac{(a+b)^2}4-\dfrac{(b-a)^2}4}=\sqrt{ab}$.
      source_flow: 예시 답안 p.7
      criteria:
      - 4.M1
    - id: 4b-3
      content: |
