- id: 2-2
  stem: |
    (2) 등식 $\displaystyle\lim_{x\to\ln\sqrt2}\frac{f(2x)-a}{x-\ln\sqrt2}=b$가 성립하도록 하는 상수 $a,b$에 대하여 $a+b$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 13/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S22-B
    audience: B
    method_no: 1
    steps:
    - id: 22b-1
      content: |
        $\displaystyle\lim_{x\to\ln\sqrt2}\frac{f(2x)-a}{x-\ln\sqrt2}=b$에서 극한값이 존재하고 $\displaystyle\lim_{x\to\ln\sqrt2}(x-\ln\sqrt2)=0$이므로 $\displaystyle\lim_{x\to\ln\sqrt2}\{f(2x)-a\}=0$, 즉 $f(2\ln\sqrt2)=f(\ln2)=a$. $f(\ln2)=a\iff g(a)=\ln2\iff\ln\left(a+\sqrt{a^2+1}\right)=\ln2\iff\sqrt{a^2+1}=2-a$. 양변을 제곱하여 풀면 $a=\dfrac34$.
      source_flow: 예시 답안 p.5~6
      criteria:
      - 2-2.B1
    - id: 22b-2
      content: |
        함수 $g$를 미분하면 $g^{\prime}(x)=\dfrac{1+\frac{x}{\sqrt{x^2+1}}}{x+\sqrt{x^2+1}}=\dfrac1{\sqrt{x^2+1}}$. 제시문 2로부터 $b=2\displaystyle\lim_{x\to\ln\sqrt2}\frac{f(2x)-\frac34}{2x-2\ln\sqrt2}=2f^{\prime}(\ln2)$이다.
      source_flow: 예시 답안 p.5~6
      criteria:
      - 2-2.M1
    - id: 22b-3
      content: |
        $2f^{\prime}(\ln2)=\dfrac{2}{g^{\prime}\left(\frac34\right)}=\dfrac{2}{\frac{1}{\sqrt{\left(\frac34\right)^2+1}}}=\dfrac52$이므로 $b=\dfrac52$이다. 따라서 $a+b=\dfrac34+\dfrac52=\dfrac{13}4$이다.
        (다른 풀이) $g(x)=\ln\left(x+\sqrt{x^2+1}\right)$로부터 그 역함수 $f(x)$를 구하면 $e^{g(x)}=x+\sqrt{x^2+1}$, $e^{2g(x)}-2xe^{g(x)}-1=0$에서 $x=\dfrac{e^{g(x)}-e^{-g(x)}}2$이므로 $f(x)=\dfrac{e^x-e^{-x}}2$, $a=f(\ln2)=\dfrac34$, $b=2f^{\prime}(\ln2)=2\cdot\dfrac{e^{\ln2}+e^{-\ln2}}2=\dfrac52$.
      source_flow: 예시 답안 p.5~6
      criteria:
      - 2-2.A1
  rubric:
