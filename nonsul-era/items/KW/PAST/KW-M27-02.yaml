- id: '3'
  stem: |
    [3] 양의 실수에서 정의되는 함수 $f(x)$가 다음 조건을 만족시킬 때, 정적분 $\displaystyle\int_1^4f(t)dt$의 값을 구하시오. [10점]

    (가) $f(1)=1$
    (나) $e^{1-\sqrt x}\left(\dfrac1{2\sqrt x}f(x)-f^{\prime}(x)\right)=-\dfrac1{2\sqrt x}$
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 4*e-2
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $e^{1-\sqrt x}\left(\dfrac1{2\sqrt x}f(x)-f^{\prime}(x)\right)=\dfrac{e^{1-\sqrt x}}{2\sqrt x}f(x)-e^{1-\sqrt x}f^{\prime}(x)=-\dfrac{d}{dx}\left(e^{1-\sqrt x}f(x)\right)=-\dfrac1{2\sqrt x}$.
      source_flow: 예시 답안 p.6~7
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        위 식을 적분하면 $e^{1-\sqrt x}f(x)=\sqrt x+C$. 조건 (가)로부터 $f(1)=1$이므로 $C=0$이고 다음을 얻는다. $f(x)=e^{\sqrt x-1}\sqrt x$.
      source_flow: 예시 답안 p.6~7
      criteria:
      - 3.A1
    - id: 3b-3
      content: |
        $\sqrt x-1=t$라고 치환하고 부분적분법을 적용하면 $\displaystyle\int_1^4f(x)dx=\int_1^4e^{\sqrt x-1}\sqrt x\,dx=2\int_0^1e^t(t+1)^2dt=2\left[e^t(t+1)^2\right]_0^1-4\int_0^1e^t(t+1)dt=8e-2-4\left[e^t(t+1)\right]_0^1+4\left[e^t\right]_0^1=4e-2$.
      source_flow: 예시 답안 p.6~7
      criteria:
      - 3.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: $\dfrac{d}{dx}\left(e^{1-\sqrt x}f(x)\right)=\dfrac1{2\sqrt x}$을 구했다.
      steps:
