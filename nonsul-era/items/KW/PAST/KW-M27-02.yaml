subparts:
- id: '1'
  stem: |
    [1] 극한값 $\displaystyle\lim_{n\to\infty}n\sum_{k=0}^{n}\ln\left(1-\frac{1}{(n+k)^2}\right)$을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: -1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{n\to\infty}n\sum_{k=0}^{n}\ln\left(1-\frac1{(n+k)^2}\right)=\lim_{n\to\infty}n\left\{\ln\left(1-\frac1{n^2}\right)+\ln\left(1-\frac1{(n+1)^2}\right)+\cdots+\ln\left(1-\frac1{(2n)^2}\right)\right\}=\lim_{n\to\infty}n\ln\left\{\frac{(n-1)(n+1)}{n^2}\times\frac{n(n+2)}{(n+1)^2}\times\cdots\times\frac{(2n-1)(2n+1)}{(2n)^2}\right\}=\lim_{n\to\infty}\ln\left(\frac{n-1}{n}\times\frac{2n+1}{2n}\right)^n$.
      source_flow: 예시 답안 p.5
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $=\displaystyle\lim_{n\to\infty}\ln\left[\left\{1+\left(-\frac1n\right)\right\}^n\times\left(1+\frac1{2n}\right)^{2n\times\frac12}\right]$. $-\dfrac1n=t$라고 하면 $\displaystyle\lim_{n\to\infty}\left(1-\frac1n\right)^n=\lim_{t\to0}(1+t)^{\frac1t\times(-1)}=\frac1e$이므로
      source_flow: 예시 답안 p.5
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\displaystyle\lim_{n\to\infty}n\sum_{k=0}^{n}\ln\left(1-\frac1{(n+k)^2}\right)=\ln\left(e^{-1}\times e^{\frac12}\right)=-\dfrac12$.
      source_flow: 예시 답안 p.5
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\displaystyle\lim_{n\to\infty}\ln\left(\frac{n-1}{n}\times\frac{2n+1}{2n}\right)^n$을 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $\displaystyle\lim_{n\to\infty}\left(1-\frac1n\right)^n=\frac1e$, $\displaystyle\lim_{n\to\infty}\left(1+\frac1{2n}\right)^n=e^{\frac12}$을 각각 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: 극한값 $-\dfrac12$을 구했다.
      depends_on:
      - 1.M1
      - 1.A1
      steps:
      - 1b-3
