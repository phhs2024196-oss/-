- id: 2-1
  stem: |
    [2] 아래 조건을 만족시키는 두 함수 $f(x)$, $g(x)$에 대하여 다음 물음에 답하시오.

    (가) 함수 $f(x)$는 모든 실수에서 미분가능하며 역함수 $g(x)$를 가진다.
    (나) 모든 실수 $x$에서 $g(x)=\ln\sqrt{2xe^{g(x)}+1}$가 성립한다.

    (1) 함수 $g(x)$를 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: log(x+sqrt(x**2+1))
    equivalents: []
    tolerance: null
  solutions:
  - id: S21-B
    audience: B
    method_no: 1
    steps:
    - id: 21b-1
      content: |
        조건 (나)로부터 $\dfrac12\ln\left(2xe^{g(x)}+1\right)=g(x)$. 이로부터 $e^{g(x)}$에 관한 이차방정식을 얻고 이를 풀면 $e^{2g(x)}-2xe^{g(x)}-1=0$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 2-1.M1
    - id: 21b-2
      content: $e^{g(x)}=x+\sqrt{x^2+1}$.
      source_flow: 예시 답안 p.5
      criteria:
      - 2-1.M2
    - id: 21b-3
      content: 따라서 $g(x)=\ln\left(x+\sqrt{x^2+1}\right)$이다.
      source_flow: 예시 답안 p.5
      criteria:
      - 2-1.A1
