stimuli:
- label: 가
  body: |
    함수 $f:X\to Y$가 일대일대응일 때 역함수 $f^{-1}:Y\to X$가 존재하고, 함수 $y=f(x)$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프는 직선 $y=x$에 대하여 대칭이다.
- label: 나
  body: |
    함수 $f(x)$의 $x=a$에서의 미분계수 $f'(a)$는 곡선 $y=f(x)$ 위의 점 $(a,\,f(a))$에서의 접선의 기울기와 같다.
- label: 다
  body: |
    함수 $f(x)$가 닫힌구간 $[a,\,b]$에서 연속이고 $f(a)\ne f(b)$일 때, $f(a)$와 $f(b)$ 사이의 임의의 값 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,\,b)$에 적어도 하나 존재한다.

stem: |
  다음 제시문을 이용하여 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  삼차함수 $f(x)$가 일대일대응이고 $f(1)=f'(1)=0$일 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    다음 조건을 만족시키는 함수 $f(x)$를 구하시오. (15점)

    (ⅰ) 임의의 두 실수 $x_1$, $x_2$에 대해 $x_1<x_2$이면 $f(x_1)<f(x_2)$이다.

    (ⅱ) 방정식 $f(x)=f^{-1}(x)$의 서로 다른 실근의 개수는 2이다.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '4/27*(x-1)**3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=a(x-1)^3$이고 증가함수이므로 $f=f^{-1}$의 근은 $y=x$와의 교점, 교점이 2개이므로 한 점에서 접한다.
    steps:
    - {id: 1a, content: '$a(t-1)^3=t$, $3a(t-1)^2=1\Rightarrow t=-\tfrac12$, $a=\tfrac{4}{27}$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $f(1)=f'(1)=0$이면 $f(x)$는 어떤 인수를 가지는가? 일대일대응이면 나머지 인수는?
    - 증가함수에서 $f(x)=f^{-1}(x)$의 근은 어느 직선 위의 교점인가?
    - 3차식과 직선의 교점이 정확히 2개이려면?
  - id: S1-B
    audience: B
    source_flow: '2025 논술가이드북(2026학년도 대비) p.86~87 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼차함수 $f(x)$가 $f(1)=f'(1)=0$이므로 $y=f(x)$의 그래프가 $x=1$에서 $x$축에 접하므로 $f(x)=(x-1)^2(ax+b)$의 형태가 된다. 또한 $f(x)$가 일대일대응이므로 $f(x)=a(x-1)^3$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        방정식 $f(x)=f^{-1}(x)$의 서로 다른 실근은 두 함수 $y=f(x)$와 $y=f^{-1}(x)$의 그래프의 교점의 $x$좌표와 같다. $y=f(x)$가 증가함수이므로 두 그래프의 교점은 모두 직선 $y=x$ 위에 있다. 조건 (ⅱ)에 의해 $y=f(x)$의 그래프와 직선 $y=x$가 서로 다른 두 점에서 만나므로 두 점 중 한 점은 접점이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        접점의 좌표를 $(t,\,t)$라 하면 $f(t)=t$에서 $a(t-1)^3=t$ … ①, $f'(t)=1$에서 $3a(t-1)^2=1$ … ②. ①, ②에서 $\dfrac13(t-1)=t$이고 $t=-\dfrac12$이다. 그러므로 $a=\dfrac{4}{27}$이고 $f(x)=\dfrac{4}{27}(x-1)^3$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $f(x)=a(x-1)^3$으로 나타냈다(공식: $f(x)=a(x-1)^3$으로 나타낼 수 있다).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        $y=f(x)$의 그래프와 직선 $y=x$가 접한다는 사실을 적었다(공식: 접한다는 사실을 확인할 수 있다).
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: |
        $f(x)=\dfrac{4}{27}(x-1)^3$을 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    다음 조건을 만족시키는 함수 $f(x)$를 구하고, 이때 방정식 $f(x)=f^{-1}(x)$가 적어도 3개의 서로 다른 실근을 가짐을 보이시오. (15점)

    (ⅰ) 임의의 두 실수 $x_1$, $x_2$에 대해 $x_1<x_2$이면 $f(x_1)>f(x_2)$이다.

    (ⅱ) 함수 $y=f(x)$의 그래프와 직선 $y=x$의 교점에서 두 함수 $y=f(x)$와 $y=f^{-1}(x)$의 그래프의 접선의 기울기가 서로 같다.
  points: 15
  depends_on: ['1']
  answer: {kind: expression, value: '-16/27*(x-1)**3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 교점 $(t,t)$에서 $f$와 $f^{-1}$의 접선은 $y=x$ 대칭이라 기울기가 역수, 같으려면 $\pm1$, 감소이므로 $-1$. 근 $\tfrac14$ 외에 $g=f-f^{-1}$의 부호 변화로 근 $c$, 대칭으로 근 $f(c)$.
    steps:
    - {id: 2a, content: '$f''(t)=-1$, $a(t-1)^3=t\Rightarrow t=\tfrac14$, $a=-\tfrac{16}{27}$; $g(-1)>0>g(0)$', criteria: ['2.B1', '2.A1', '2.R1', '2.R2']}
    hint_ladder:
    - $y=x$에 대해 대칭인 두 접선의 기울기는 어떤 관계인가?
    - $f(x)-f^{-1}(x)$의 값을 $x=-1$, $x=0$에서 비교해 보자.
    - $f(c)=f^{-1}(c)$이면 $q=f(c)$에 대해서는 어떻게 되는가?
  - id: S2-B
    audience: B
    source_flow: '2025 논술가이드북(2026학년도 대비) p.87~88 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        함수 $y=f(x)$의 그래프와 직선 $y=x$의 교점의 좌표를 $(t,\,t)$라 하자. $x=t$에서 $y=f(x)$의 접선의 기울기를 $m_1$이라 하면 접선의 방정식은 $y=m_1(x-t)+t$이고, $y=f^{-1}(x)$의 접선의 기울기를 $m_2$라 하면 접선의 방정식은 $y=m_2(x-t)+t$이다. 조건 (ⅱ)에 의해 $m_1=m_2$ … ①.
        $f$와 $f^{-1}$가 $y=x$에 대해 대칭이므로 $y=m_1(x-t)+t$를 $y=x$에 대해 대칭하면 $x=m_1(y-t)+t$에서 $y=\dfrac{1}{m_1}(x-t)+t$이다. 이 직선의 방정식이 $y=m_2(x-t)+t$와 일치하므로 $\dfrac{1}{m_1}=m_2$이고 $m_1\times m_2=1$ … ②이다.
        ①, ②에 의해 $m_1^{\,2}=1$이고 $m_1=\pm1$이다. 함수 $f$가 감소함수이므로 $m_1=m_2=-1$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        [1-1]에서 $f(x)=a(x-1)^3$이고, $(t,\,t)$를 지나므로 $f(t)=t$에서 $a(t-1)^3=t$ … ③. $x=t$에서 접선의 기울기가 $-1$이므로 $f'(t)=-1$에서 $3a(t-1)^2=-1$ … ④. ③, ④에 의해서 $-\dfrac13(t-1)=t$이고 $t=\dfrac14$이다. 그러므로 $a=-\dfrac{16}{27}$이고 $f(x)=-\dfrac{16}{27}(x-1)^3$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        방정식 $f(x)=f^{-1}(x)$가 적어도 3개의 서로 다른 실근을 가짐을 보이자. 조건 (ⅰ)에 의해 $y=f(x)$는 감소함수이므로 $y=f(x)$의 그래프와 직선 $y=x$의 교점의 개수는 1이고 이 점의 $x$좌표가 $f(x)=f^{-1}(x)$의 실근과 일치하므로 $x=\dfrac14$이 $f(x)=f^{-1}(x)$의 하나의 실근이 된다.
        $g(x)=f(x)-f^{-1}(x)$라 하면, $g(x)$는 실수 전체에서 연속이다.
        $g(-1)=f(-1)-f^{-1}(-1)=\dfrac{128}{27}-\left(1+\dfrac{3}{2\sqrt[3]{2}}\right)>0$이고, $g(0)=f(0)-f^{-1}(0)=\dfrac{16}{27}-1<0$이다. 따라서 제시문 (다)에 의해서 $(-1,\,0)$에서 $g(c)=0$인 $c$가 적어도 하나 존재한다. $f(c)=f^{-1}(c)$이므로 $c$가 $f(x)=f^{-1}(x)$의 하나의 실근이 된다.
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        $f(c)=q$라 하면 $f^{-1}(c)=q$이고, $f$와 $f^{-1}$가 $y=x$에 대해 대칭이므로 $f^{-1}(q)=c$, $f(q)=c$이다. $f(q)=c=f^{-1}(q)$가 되어 $q$가 $f(x)=f^{-1}(x)$의 하나의 실근이 된다. $y=f(x)$와 $y=x$의 교점의 개수는 1이라는 사실에 의해 $c\ne q$이다.
        따라서 $\dfrac14$, $c$, $q$가 $f(x)=f^{-1}(x)$의 서로 다른 세 실근이다.
      criteria: ['2.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: |
        $y=f(x)$와 $y=f^{-1}(x)$의 그래프의 교점에서 접선의 기울기가 $-1$임을 구했다.
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $f(x)=-\dfrac{16}{27}(x-1)^3$을 구했다.
      depends_on: [2.B1, 1.M1]
      ft: {allowed: true, from: [1.M1], max_points: 3}
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: |
        사잇값의 정리를 사용하여 $x\ne\dfrac14$인 실근이 있음을 확인했다($g(x)=f(x)-f^{-1}(x)$의 부호가 바뀌는 구간 제시).
      depends_on: [2.A1]
      steps: [2b-3]
    - id: 2.R2
      mark_type: R
      points: 4
      evidence: |
        직선 $y=x$에 대한 대칭을 이용하여 다른 하나의 실근이 있음을 확인하여 적어도 3개의 서로 다른 실근을 가짐을 보였다($c\ne q$ 근거 포함).
      depends_on: [2.R1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

