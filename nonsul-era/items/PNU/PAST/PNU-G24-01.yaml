intent: |
  역함수의 그래프가 $y=x$에 대해 대칭이라는 사실을 활용하여 조건을 만족하는 삼차함수를 찾을 수 있는지, 특히 증가함수와 감소함수에서 역함수의 특징을 파악할 수 있는지 평가한다. [1-1]은 증가함수에서 $y=f(x)$가 $y=x$에 접한다는 사실을, [1-2]는 감소함수에서 교점의 접선 기울기 조건과 사잇값의 정리로 근의 위치를 파악하는지를 본다(공식 출제 의도 요약).
key_idea: |
  $f(1)=f'(1)=0$과 일대일대응에서 $f(x)=a(x-1)^3$. 증가이면 $f=f^{-1}$의 근은 $y=x$와의 교점이므로 접점 조건, 감소이면 교점에서 두 접선 기울기가 서로 역수이므로 $f'(t)=-1$.
stuck: |
  감소함수일 때 $f$와 $f^{-1}$의 교점이 $y=x$ 밖에도 있을 수 있음을 알고, 사잇값의 정리로 찾은 근 $c$와 대칭점 $q=f(c)$로 세 번째 근을 만드는 단계
