      content: |
        $g'(t)=t-t(t^2+1)^{-\frac32}$이므로 $\displaystyle\int_{\sqrt3}^{2\sqrt2}\dfrac1tf(t)g'(t)\,dt=\int_{\sqrt3}^{2\sqrt2}t\left(1-(t^2+1)^{-\frac12}-(t^2+1)^{-\frac32}+(t^2+1)^{-2}\right)dt$.
        $u=t^2+1$로 치환하면 $\dfrac{du}{dt}=2t$이고 $=\dfrac12\displaystyle\int_4^9\left(1-u^{-\frac12}-u^{-\frac32}+u^{-2}\right)du=\dfrac12\left[u-2\sqrt u+\dfrac{2}{\sqrt u}-\dfrac1u\right]_4^9=\dfrac{101}{72}$.
      criteria: ['3.M1', '3.A1']
