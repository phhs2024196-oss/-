intent: |
  매개변수로 나타낸 함수와 그 미분법을 이해하고, 함수의 극한값 및 치환적분법을 이용한 정적분 값을 구할 수 있는지 평가한다. [2-1]은 도형 위를 움직이는 점의 좌표를 매개변수로 나타내고, [2-2]는 매개변수 미분으로 접선을 구해 선분의 길이의 극한을, [2-3]은 치환적분으로 정적분 값을 구한다(공식 출제 의도 요약).
key_idea: |
  $\mathrm{Q}=\mathrm{P}+\dfrac{(-t,1)}{\sqrt{t^2+1}}$이고 곡선 $D$의 $\mathrm{Q}$에서의 접선 기울기는 $\dfrac{g'(t)}{f'(t)}=t$(점 P에서의 기울기와 같음). 이 관계 $g'(t)=tf'(t)$가 [2-3]의 피적분함수를 $f(t)f'(t)$로 바꾼다.
stuck: |
  $\dfrac{dy}{dx}=t$를 정리해 내는 계산, 그리고 [2-3]에서 $\dfrac1tg'(t)=f'(t)$를 알아채는 단계
