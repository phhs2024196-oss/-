stimuli:
- label: 가
  body: |
    두 변수 $x$, $y$ 사이의 관계를 변수 $t$를 매개로 하여 $x=f(t)$, $y=g(t)$와 같이 나타낼 때, 변수 $t$를 $x$, $y$의 매개변수라 하며, 위 함수를 매개변수로 나타낸 함수라고 한다.
- label: 나
  body: |
    미분가능한 함수 $t=g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,\,b]$에서 연속이고, $g(a)=\alpha$, $g(b)=\beta$에 대하여 함수 $f(t)$가 $\alpha$와 $\beta$를 양 끝점으로 하는 닫힌구간에서 연속일 때,
    $$\int_a^b f(g(x))g'(x)\,dx=\int_\alpha^\beta f(t)\,dt$$

stem: |
  다음 제시문을 이용하여 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  좌표평면 위를 움직이는 점 $\mathrm{Q}$가 다음 조건을 만족시킨다.

  (ⅰ) 곡선 $y=\dfrac12x^2$ 위를 움직이는 점 $\mathrm{P}$가 있다. 점 $\mathrm{Q}$는 곡선 $y=\dfrac12x^2$ 위의 점 $\mathrm{P}$에서의 접선에 수직인 직선 위에 있으면서 점 $\mathrm{P}$와 거리가 1인 점이다.

  (ⅱ) 점 $\mathrm{Q}$의 $y$좌표는 점 $\mathrm{P}$의 $y$좌표보다 항상 크다.

  매개변수 $t$에 대하여 점 $\mathrm{P}$의 좌표를 $\left(t,\,\dfrac{t^2}{2}\right)$이라 할 때, 점 $\mathrm{Q}$의 좌표 $(x,\,y)$는 $x=f(t)$, $y=g(t)$이다. 점 $\mathrm{Q}$가 나타내는 곡선을 $D$라 할 때, 다음 물음에 답하시오.

  [그림: 좌표평면에 원점 O에서 $x$축에 접하는 포물선 $y=\tfrac12x^2$과, 그보다 위쪽에 놓여 $y$축 위의 점 $(0,1)$에서 뾰족하게(꺾여) 만나는 모양의 곡선 $D$가 그려져 있다. 제1사분면의 포물선 위의 점 P에서 그은 접선이 있고, P에서 접선에 수직인 방향(왼쪽 위)으로 길이 1인 선분 끝에 점 Q가 곡선 $D$ 위에 있다. P에 직각 표시, 선분 PQ 옆에 1이 적혀 있고, P를 중심으로 한 점선 호가 표시되어 있다.]

subparts:
- id: '1'
  stem: |
    $f(t)$와 $g(t)$를 $t$에 관한 식으로 나타내시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'f(t) = t - t/sqrt(t**2+1); g(t) = t**2/2 + 1/sqrt(t**2+1)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 수직 조건 $\dfrac{g-t^2/2}{f-t}=-\dfrac1t$와 거리 조건 $(f-t)^2+(g-t^2/2)^2=1$을 연립하고 (ⅱ)로 부호를 정한다.
    steps:
    - {id: 1a, content: '$\left(g-\tfrac{t^2}{2}\right)^2=\tfrac{1}{t^2+1}$, (ⅱ)에서 $g=\tfrac{t^2}{2}+\tfrac{1}{\sqrt{t^2+1}}$, $f=t-\tfrac{t}{\sqrt{t^2+1}}$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - P에서의 접선 기울기는 $t$, 수직인 직선의 기울기는?
    - 거리 1 조건과 연립하면 $g(t)$의 부호가 두 개 나온다. 어느 쪽을 택할까?
  - id: S1-B
    audience: B
    source_flow: '2025 논술가이드북(2026학년도 대비) p.91 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=\dfrac12x^2$ 위의 점 $\mathrm{P}\left(t,\,\dfrac{t^2}{2}\right)$에서의 접선의 기울기가 $t$이므로 점 $\mathrm{P}$에서의 접선에 수직인 직선의 기울기는 $-\dfrac1t$이다. 그러므로 $\dfrac{g(t)-\frac{t^2}{2}}{f(t)-t}=-\dfrac1t$ …… ①
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        또한 선분 $\mathrm{PQ}$의 길이가 1이므로 $\{f(t)-t\}^2+\left\{g(t)-\dfrac{t^2}{2}\right\}^2=1$ …… ②
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        ①과 ②를 연립하면 $\left\{g(t)-\dfrac{t^2}{2}\right\}^2=\dfrac{1}{t^2+1}$이므로 $g(t)=\dfrac{t^2}{2}\pm\dfrac{1}{\sqrt{t^2+1}}$이고 조건 (ⅱ)에 의하여 $g(t)=\dfrac{t^2}{2}+\dfrac{1}{\sqrt{t^2+1}}$이다. 이를 ①에 대입하면 $f(t)=t-\dfrac{t}{\sqrt{t^2+1}}$이다.
        따라서 $f(t)=t-\dfrac{t}{\sqrt{t^2+1}}$, $g(t)=\dfrac{t^2}{2}+\dfrac{1}{\sqrt{t^2+1}}$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    source_flow: '2025 논술가이드북(2026학년도 대비) p.91 다른 풀이'
    method_no: 2
    key_idea: 원 해설 다른 풀이 — 접선 $y=t(x-t)+\tfrac12t^2$과 Q 사이의 거리가 1, Q는 법선 위.
    steps:
    - id: 1c-1
      content: |
        점 $\mathrm{P}$에서의 접선의 방정식은 $y=t(x-t)+\dfrac12t^2$ …… ①. 점 $\mathrm{Q}$는 이 접선에 수직인 직선 위에 있으므로 $g(t)=-\dfrac1t\{f(t)-t\}+\dfrac12t^2$ …… ②
      criteria: ['1.M1']
    - id: 1c-2
      content: |
        점 $\mathrm{Q}$와 ①의 직선과의 거리가 1이므로 $\dfrac{\left\lvert tf(t)-g(t)-\frac12t^2\right\rvert}{\sqrt{t^2+1}}=1$ …… ③
      criteria: ['1.M2']
    - id: 1c-3
      content: |
        ②와 ③을 연립하면 $f(t)=t\pm\dfrac{t}{\sqrt{t^2+1}}$, ②에 대입하면 $g(t)=\dfrac12t^2\mp\dfrac{1}{\sqrt{t^2+1}}$. 조건 (ⅱ)에 의하여 $g(t)=\dfrac{t^2}{2}+\dfrac{1}{\sqrt{t^2+1}}$이므로 $f(t)=t-\dfrac{t}{\sqrt{t^2+1}}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        접선의 기울기를 이용하여 $f(t)$, $g(t)$ 사이의 관계식(수직 조건)을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        주어진 거리 1을 이용하여 $f(t)$, $g(t)$ 사이의 관계식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1c-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        조건 (ⅱ)로 부호를 정해 $f(t)=t-\dfrac{t}{\sqrt{t^2+1}}$, $g(t)=\dfrac{t^2}{2}+\dfrac{1}{\sqrt{t^2+1}}$을 각각 $t$에 관한 식으로 나타냈다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3, 1c-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $x=f(t)$, $y=g(t)$인 점 $\mathrm{Q}(x,\,y)$에서의 곡선 $D$의 접선과 곡선 $y=\dfrac12x^2$이 만나는 두 점을 $\mathrm{A}$, $\mathrm{B}$라 하자. 선분 $\mathrm{AB}$의 길이를 $l(t)$라 할 때, $\displaystyle\lim_{t\to\infty}\dfrac{l(t)}{t\sqrt t}$의 값을 구하시오. (단, $t\ne0$) (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '2*sqrt(2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $D$의 접선 기울기는 $t$. 접선과 포물선을 연립한 이차방정식의 두 근 차로 $l(t)=\sqrt{t^2+1}\,\lvert\alpha-\beta\rvert=2\sqrt2(t^2+1)^{3/4}$.
    steps:
    - {id: 2a, content: '$x^2-2tx+t^2-2\sqrt{t^2+1}=0$, $\lvert\alpha-\beta\rvert=2\sqrt2(t^2+1)^{1/4}$, $l(t)=2\sqrt2(t^2+1)^{3/4}$, 극한 $2\sqrt2$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $\dfrac{dy}{dx}=\dfrac{g'(t)}{f'(t)}$를 정리하면 아주 간단해진다.
    - 두 교점의 $x$좌표 차를 근과 계수의 관계로 구하자.
  - id: S2-B
    audience: B
    source_flow: '2025 논술가이드북(2026학년도 대비) p.92 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{Q}(x,\,y)$에서의 곡선 $D$의 접선의 기울기는
        $$\dfrac{dy}{dx}=\dfrac{\frac{dy}{dt}}{\frac{dx}{dt}}=\dfrac{t-\dfrac{t}{(t^2+1)\sqrt{t^2+1}}}{1-\dfrac{1}{(t^2+1)\sqrt{t^2+1}}}=\dfrac{t\{(t^2+1)\sqrt{t^2+1}-1\}}{(t^2+1)\sqrt{t^2+1}-1}=t$$
        이다. 점 $\mathrm{Q}$에서의 곡선 $D$의 접선의 방정식은 $y-\left(\dfrac{t^2}{2}+\dfrac{1}{\sqrt{t^2+1}}\right)=t\left\{x-\left(t-\dfrac{t}{\sqrt{t^2+1}}\right)\right\}$이다.
        $y=\dfrac{x^2}{2}$과 연립하여 정리하면 $x^2-2tx+t^2-2\sqrt{t^2+1}=0$ …… ①이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        ①의 두 근을 $\alpha$, $\beta$라 하면 $\alpha$, $\beta$는 두 점 $\mathrm{A}$, $\mathrm{B}$의 $x$좌표이다. $l(t)$는 밑변의 길이와 높이가 각각 $\lvert\alpha-\beta\rvert$와 $\lvert t(\alpha-\beta)\rvert$인 직각삼각형의 빗변의 길이이므로 피타고라스의 정리에 의하여 $l(t)=\sqrt{t^2+1}\,\lvert\alpha-\beta\rvert$이다.
        이차방정식의 근과 계수의 관계에 의하여
        $\lvert\alpha-\beta\rvert=\sqrt{(\alpha+\beta)^2-4\alpha\beta}=\sqrt{(2t)^2-4\left(t^2-2\sqrt{t^2+1}\right)}=2\sqrt2\,(t^2+1)^{\frac14}$.
        그러므로 $l(t)=\sqrt{t^2+1}\times2\sqrt2\,(t^2+1)^{\frac14}=2\sqrt2\,(t^2+1)^{\frac34}$.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        따라서 $\displaystyle\lim_{t\to\infty}\dfrac{l(t)}{t\sqrt t}=\lim_{t\to\infty}\dfrac{2\sqrt2\sqrt[4]{(t^2+1)^3}}{\sqrt[4]{t^6}}=2\sqrt2$.
      criteria: ['2.A2']
  - id: S2-ALT
    audience: ALT
    source_flow: '2025 논술가이드북(2026학년도 대비) p.92 다른 풀이'
    method_no: 2
    key_idea: 원 해설 다른 풀이 — ①을 근의 공식으로 풀어 두 점 사이 거리를 직접 계산.
    steps:
    - id: 2c-1
      content: |
        $x^2-2tx+t^2-2\sqrt{t^2+1}=0$의 해는 $x=t\pm\sqrt2\,(t^2+1)^{\frac14}$. $\alpha=t+\sqrt2(t^2+1)^{\frac14}$, $\beta=t-\sqrt2(t^2+1)^{\frac14}$라 하면
        $l(t)=\sqrt{(\alpha-\beta)^2+\left(\dfrac{\alpha^2}{2}-\dfrac{\beta^2}{2}\right)^2}=(\alpha-\beta)\sqrt{1+\dfrac14(\alpha+\beta)^2}=2\sqrt2(t^2+1)^{\frac14}\sqrt{1+\dfrac14\times4t^2}=2\sqrt2(t^2+1)^{\frac34}$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: |
        접선의 기울기 $t$를 구하고, 두 점 $\mathrm{A}$, $\mathrm{B}$의 $x$좌표를 미지수로 하는 이차방정식 $x^2-2tx+t^2-2\sqrt{t^2+1}=0$을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 6}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 7
      evidence: |
        $l(t)=2\sqrt2\,(t^2+1)^{\frac34}$처럼 $l(t)$를 $t$에 관한 식으로 나타냈다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        극한값 $2\sqrt2$를 구했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $\displaystyle\int_{\sqrt3}^{2\sqrt2}\dfrac1tf(t)g'(t)\,dt$의 값을 구하시오. (10점)
  points: 10
  depends_on: ['1', '2']
  answer: {kind: value, value: '101/72', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{g'(t)}{f'(t)}=t$이므로 $\dfrac1tg'(t)=f'(t)$, 적분은 $\left[\tfrac12f(t)^2\right]$.
    steps:
    - {id: 3a, content: '$\int f(t)f''(t)dt=\tfrac12\{f(2\sqrt2)^2-f(\sqrt3)^2\}=\tfrac12\left(\tfrac{32}{9}-\tfrac34\right)=\tfrac{101}{72}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - '[2-2]에서 구한 $\dfrac{g''(t)}{f''(t)}$를 떠올려 보자.'
    - $u=f(t)$로 치환하면?
  - id: S3-B
    audience: B
    source_flow: '2025 논술가이드북(2026학년도 대비) p.93 예시답안'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\dfrac{g'(t)}{f'(t)}=t$에서 $\dfrac{g'(t)}{t}=f'(t)$이다. 그러므로 $\displaystyle\int_{\sqrt3}^{2\sqrt2}\dfrac1tf(t)g'(t)\,dt=\int_{\sqrt3}^{2\sqrt2}f(t)f'(t)\,dt$. $f(t)=u$로 치환하면 $f'(t)=\dfrac{du}{dt}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $f(t)=t-\dfrac{t}{\sqrt{t^2+1}}$에서 $f(\sqrt3)=\sqrt3-\dfrac{\sqrt3}{\sqrt{(\sqrt3)^2+1}}=\dfrac{\sqrt3}{2}$, $f(2\sqrt2)=2\sqrt2-\dfrac{2\sqrt2}{\sqrt{(2\sqrt2)^2+1}}=\dfrac{4\sqrt2}{3}$.
        따라서 $\displaystyle\int_{\sqrt3}^{2\sqrt2}f(t)f'(t)\,dt=\int_{f(\sqrt3)}^{f(2\sqrt2)}u\,du=\left[\dfrac{u^2}{2}\right]_{f(\sqrt3)}^{f(2\sqrt2)}=\dfrac{\{f(2\sqrt2)\}^2-\{f(\sqrt3)\}^2}{2}=\dfrac{\frac{32}{9}-\frac34}{2}=\dfrac{101}{72}$.
      criteria: ['3.A1']
