stimuli:
- label: 가
  body: |
    삼각형 $\mathrm{ABC}$의 세 변의 길이가 $a$, $b$, $c$일 때 다음이 성립한다.
    $$a^2=b^2+c^2-2bc\cos A$$
    $$b^2=c^2+a^2-2ca\cos B$$
    $$c^2=a^2+b^2-2ab\cos C$$
    [그림: 삼각형 ABC에서 꼭짓점 A가 위, B가 왼쪽 아래, C가 오른쪽 아래. 변 BC의 길이 $a$, 변 CA의 길이 $b$, 변 AB의 길이 $c$가 표시되어 있다.]
- label: 나
  body: |
    평면 $\beta$ 위의 도형의 넓이를 $S$, 이 도형의 평면 $\alpha$ 위로의 정사영의 넓이를 $S'$이라 할 때, 두 평면 $\alpha$, $\beta$가 이루는 각의 크기를 $\theta\ (0^\circ\le\theta\le90^\circ)$라 하면 $S'=S\cos\theta$이다.

stem: |
  다음 제시문을 이용하여 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  두 밑면은 한 변의 길이가 4인 정삼각형이고 옆면은 모두 직사각형인 삼각기둥 $\mathrm{DEF-ABC}$가 있다. 이 삼각기둥의 높이는 8이다. 선분 $\mathrm{DF}$ 위에 점 $\mathrm{G}$를 $\overline{\mathrm{FG}}=1$이 되도록 잡고, 선분 $\mathrm{BC}$의 중점을 $\mathrm{H}$, 선분 $\mathrm{AD}$ 위의 한 점을 $\mathrm{I}$라 하자. 선분 $\mathrm{BG}$ 위의 한 점 $\mathrm{P}$와 선분 $\mathrm{HI}$ 위의 한 점 $\mathrm{Q}$에 대하여 직선 $\mathrm{PQ}$는 밑면과 수직이고, $\overline{\mathrm{PQ}}=\dfrac{26}{7}$이다. 다음 물음에 답하시오.

  [그림: 아랫면 A(왼쪽)·B(앞 가운데)·C(오른쪽), 윗면 D(A 위)·E(B 위)·F(C 위)인 세워진 삼각기둥. 윗면 선분 DF 위 F 가까이에 G, 모서리 AD 위쪽에 I. 선분 EG, EI, GI(삼각형 EGI)와 점선 DG가 그려져 있고, 점선 BG와 점선 HI(H는 BC 위)가 있으며, BG 위의 점 P에서 수직으로 내린 선분이 HI 위의 점 Q에 닿아 있다.]

subparts:
- id: '1'
  stem: |
    점 $\mathrm{G}$에서 평면 $\mathrm{ABC}$에 내린 수선의 발을 $\mathrm{G'}$이라 할 때, 직선 $\mathrm{AH}$와 직선 $\mathrm{BG'}$의 교점을 $\mathrm{P'}$이라 하자. $\overline{\mathrm{AP'}}:\overline{\mathrm{P'H}}=t:1$일 때, 양수 $t$의 값을 구하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: G'은 AC 위 $\overline{\mathrm{CG'}}=1$인 점. 삼각형 BCG'에서 코사인법칙으로 $\cos\angle\mathrm{G'BC}$를 구해 직각삼각형 BHP'에서 $\overline{\mathrm{P'H}}$를 얻는다.
    steps:
    - {id: 1a, content: '$\overline{\mathrm{BG''}}=\sqrt{13}$, $\tan\angle\mathrm{P''BH}=\tfrac{\sqrt3}{7}$, $\overline{\mathrm{P''H}}=\tfrac{2\sqrt3}{7}$, $\overline{\mathrm{AP''}}=\tfrac{12\sqrt3}{7}$, $t=6$', criteria: ['1.B1', '1.M1', '1.A1']}
    hint_ladder:
    - 점 G의 정사영 G'은 어느 변 위에 있고 C에서 얼마나 떨어져 있는가?
    - 각 $\angle\mathrm{G'BC}$의 삼각비를 구하면 직각삼각형 BHP'에서 $\overline{\mathrm{P'H}}$가 나온다.
  - id: S1-B
    audience: B
    source_flow: '2025 논술가이드북(2026학년도 대비) p.96 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{G}$에서 평면 $\mathrm{ABC}$에 내린 수선의 발 $\mathrm{G'}$은 선분 $\mathrm{AC}$ 위의 점이다($\overline{\mathrm{CG'}}=1$).
        [그림: 정삼각형 ABC에서 AC 위 C 가까이에 G'($\overline{\mathrm{CG'}}=1$), BC의 중점 H, AH와 BG'의 교점 P'. $\angle\mathrm{AHB}$ 직각 표시, $\overline{\mathrm{BC}}=4$.]
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        삼각형 $\mathrm{BCG'}$에서 코사인법칙에 의해 $\overline{\mathrm{BG'}}^2=4^2+1^2-2\times4\times1\times\cos60^\circ=16+1-4=13$이므로 $\overline{\mathrm{BG'}}=\sqrt{13}$이다.
        $\overline{\mathrm{AP'}}:\overline{\mathrm{P'H}}=t:1\ (t>0)$, $\overline{\mathrm{G'P'}}:\overline{\mathrm{P'B}}=m:1\ (m>0)$이라 하자. $\overline{\mathrm{BG'}}=\sqrt{13}$, $\overline{\mathrm{AH}}=\dfrac{\sqrt3}{2}\times4=2\sqrt3$이므로 $\overline{\mathrm{P'H}}=\dfrac{2\sqrt3}{t+1}$, $\overline{\mathrm{P'B}}=\dfrac{\sqrt{13}}{m+1}$.
        삼각형 $\mathrm{BHP'}$은 $\angle\mathrm{BHP'}=90^\circ$인 직각삼각형이므로 $\cos(\angle\mathrm{P'BH})=\dfrac{2}{\overline{\mathrm{P'B}}}=\dfrac{2\sqrt{13}(m+1)}{13}$.
        삼각형 $\mathrm{BCG'}$에서 $\overline{\mathrm{BG'}}=\sqrt{13}$, $\overline{\mathrm{BC}}=4$, $\overline{\mathrm{CG'}}=1$이므로 코사인법칙에 의해 $\cos(\angle\mathrm{G'BC})=\dfrac{(\sqrt{13})^2+4^2-1^2}{2\times\sqrt{13}\times4}=\dfrac{7\sqrt{13}}{26}$이다.
        $\cos(\angle\mathrm{P'BH})=\cos(\angle\mathrm{G'BC})$이므로 $\dfrac{2\sqrt{13}(m+1)}{13}=\dfrac{7\sqrt{13}}{26}$에서 $m=\dfrac34$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $\sin(\angle\mathrm{P'BH})=\sqrt{1-\left(\dfrac{7\sqrt{13}}{26}\right)^2}=\dfrac{\sqrt{39}}{26}$. 삼각형 $\mathrm{BHP'}$에서 $\sin(\angle\mathrm{P'BH})=\dfrac{\overline{\mathrm{P'H}}}{\overline{\mathrm{P'B}}}=\dfrac{\frac{2\sqrt3}{t+1}}{\frac{4\sqrt{13}}{7}}=\dfrac{7\sqrt{39}}{26(t+1)}$이므로 $\dfrac{\sqrt{39}}{26}=\dfrac{7\sqrt{39}}{26(t+1)}$에서 $t=6$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    source_flow: '2025 논술가이드북(2026학년도 대비) p.97 다른 풀이'
    method_no: 2
    key_idea: 원 해설 다른 풀이 — G'에서 BC에 수선의 발 H'을 내려 닮음비 $\overline{\mathrm{BH'}}:\overline{\mathrm{BH}}=7:4$로 $\overline{\mathrm{P'H}}$를 구한다.
    steps:
    - id: 1c-1
      content: |
        점 $\mathrm{G'}$에서 직선 $\mathrm{BC}$에 내린 수선의 발을 $\mathrm{H'}$이라 하자. $\overline{\mathrm{CH'}}=\overline{\mathrm{CG'}}\times\cos60^\circ=\dfrac12$, 즉 $\overline{\mathrm{BH'}}=4-\dfrac12=\dfrac72$이고, $\overline{\mathrm{BH}}=2$이므로 $\overline{\mathrm{G'H'}}:\overline{\mathrm{P'H}}=\overline{\mathrm{BH'}}:\overline{\mathrm{BH}}=\dfrac72:2=7:4$.
        $\overline{\mathrm{G'H'}}=\overline{\mathrm{CG'}}\times\sin60^\circ=\dfrac{\sqrt3}{2}$이므로 $\overline{\mathrm{P'H}}=\dfrac{\sqrt3}{2}\times\dfrac47=\dfrac{2\sqrt3}{7}$.
        $\overline{\mathrm{AP'}}=2\sqrt3-\dfrac{2\sqrt3}{7}=\dfrac{12\sqrt3}{7}$이므로 $\overline{\mathrm{AP'}}:\overline{\mathrm{P'H}}=6:1$. 따라서 $t=6$이다.
      criteria: ['1.B1', '1.M1', '1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        점 G에서 평면 ABC에 내린 수선의 발 G'이 선분 AC 위에 있음을 서술했다.
      steps: [1b-1, 1c-1]
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        삼각형 ABC에서 $\overline{\mathrm{AP'}}$ 또는 $\overline{\mathrm{P'H}}$의 길이를 구했다(코사인법칙·삼각비 또는 닮음 이용).
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $\overline{\mathrm{AP'}}:\overline{\mathrm{P'H}}$의 비율을 구해 $t=6$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-3, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    삼각형 $\mathrm{EGI}$ 내부의 점 $\mathrm{R}$에 대하여 삼각형 $\mathrm{PQR}$의 넓이가 $\dfrac{13}{7}$이 되도록 하는 모든 점 $\mathrm{R}$이 나타내는 도형과 선분 $\mathrm{EG}$로 둘러싸인 부분의 넓이를 구하시오. (25점)
  points: 25
  depends_on: ['1']
  answer: {kind: value, value: 'sqrt(30)*pi/9', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: R과 직선 PQ 사이 거리 1 → 정사영은 P' 중심 반지름 1인 반원(넓이 $\tfrac{\pi}{2}$). $\overline{\mathrm{AI}}=6$으로 삼각형 EGI 넓이 $2\sqrt{10}$, 정사영 BG'A 넓이 $3\sqrt3$에서 $\cos\theta=\tfrac{3\sqrt{30}}{20}$.
    steps:
    - {id: 2a, content: '$r=1$, 정사영 반원 넓이 $\tfrac{\pi}{2}$, $\cos\theta=\tfrac{3\sqrt3}{2\sqrt{10}}$, $S=\tfrac{\pi}{2}\cdot\tfrac{20}{3\sqrt{30}}=\tfrac{\sqrt{30}\pi}{9}$', criteria: ['2.R1', '2.R2', '2.M1', '2.A1']}
    hint_ladder:
    - 밑변 PQ가 고정되어 있으면 넓이 조건은 무엇에 대한 조건인가?
    - 공간에서 한 직선까지 거리가 일정한 점들은 어떤 곡면 위에 있는가? 그 곡선을 밑면에 정사영해 보자.
    - 평면 EGI와 평면 ABC가 이루는 각의 코사인은 두 삼각형의 넓이 비이다. $\overline{\mathrm{AI}}$는 $\overline{\mathrm{PQ}}=\tfrac{26}{7}$에서 정해진다.
  - id: S2-B
    audience: B
    source_flow: '2025 논술가이드북(2026학년도 대비) p.97~98 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 점 $\mathrm{P}$, $\mathrm{Q}$는 각각 선분 $\mathrm{BG}$, 선분 $\mathrm{HI}$ 위의 점이므로 두 점 $\mathrm{P}$, $\mathrm{Q}$에서 평면 $\mathrm{ABC}$에 내린 수선의 발은 점 $\mathrm{P'}$이다. 즉, 직선 $\mathrm{PQ}$와 평면 $\mathrm{EGI}$의 교점은 선분 $\mathrm{EG}$ 위에 있으므로 삼각형 $\mathrm{EGI}$ 내부의 점 $\mathrm{R}$은 직선 $\mathrm{PQ}$ 위의 점이 아니다.
        삼각형 $\mathrm{EGI}$ 내부의 점 $\mathrm{R}$에서 직선 $\mathrm{PQ}$까지의 거리를 $r\ (r>0)$이라 하면 삼각형 $\mathrm{PQR}$은 밑변의 길이가 $\overline{\mathrm{PQ}}=\dfrac{26}{7}$이고 높이가 $r$인 삼각형이다. 즉, 삼각형 $\mathrm{PQR}$의 넓이는 $\dfrac{26}{7}\times r\times\dfrac12=\dfrac{13}{7}r$이고 $\dfrac{13}{7}r=\dfrac{13}{7}$에서 $r=1$.
        점 $\mathrm{R}$이 나타내는 도형은 삼각형 $\mathrm{EGI}$ 내부의 점 중에서 직선 $\mathrm{PQ}$까지의 거리가 1인 점들이 나타내는 도형이다(직선 $\mathrm{PQ}$를 축으로 하고 반지름이 1인 원기둥 위).
        [그림: 삼각기둥에서 평면 EGI 위에 E·G 쪽으로 열린 반타원 모양의 곡선이 그려져 있고, 확대 그림에서 그 곡선과 직선 PQ의 연장선(점선) 사이 거리 1이 표시되어 있다.]
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        한편 $\overline{\mathrm{AP'}}:\overline{\mathrm{P'H}}=6:1$이므로 $\overline{\mathrm{AP'}}=\dfrac67\times2\sqrt3=\dfrac{12\sqrt3}{7}$이다. 점 $\mathrm{P'}$에서 직선 $\mathrm{AC}$에 내린 수선의 발을 $\mathrm{J}$라 하면 $\angle\mathrm{P'AJ}=30^\circ$이고 직선 $\mathrm{AP'}$은 $\angle\mathrm{CAB}$의 이등분선이므로 점 $\mathrm{P'}$에서 두 직선 $\mathrm{AB}$, $\mathrm{AC}$까지의 거리는 모두 선분 $\mathrm{P'J}$의 길이와 같다.
        $\overline{\mathrm{P'J}}=\overline{\mathrm{AP'}}\times\sin30^\circ=\dfrac{6\sqrt3}{7}$이고 $\dfrac{6\sqrt3}{7}=\dfrac{\sqrt{108}}{7}>\dfrac{\sqrt{49}}{7}=1$이므로, 삼각형 $\mathrm{EGI}$ 내부의 점 $\mathrm{R}$에 대하여 삼각형 $\mathrm{PQR}$의 넓이가 $\dfrac{13}{7}$이 되도록 하는 모든 점 $\mathrm{R}$이 나타내는 도형을 $D$라 하면 도형 $D$의 평면 $\mathrm{ABC}$ 위로의 정사영은 중심이 $\mathrm{P'}$이고 반지름의 길이가 1이며 삼각형 $\mathrm{ABG'}$ 내부에 있는 반원이다.
        [그림: 삼각형 ABG'(정삼각형 ABC의 일부) 안에서 BG' 위의 점 P'을 중심으로 A 쪽에 그린 반지름 1인 반원.]
        도형 $D$와 선분 $\mathrm{EG}$로 둘러싸인 부분의 넓이를 $S$라 하고, 평면 $\mathrm{EGI}$와 평면 $\mathrm{ABC}$가 이루는 각의 크기를 $\theta\ (0^\circ\le\theta\le90^\circ)$라 하면 $S\times\cos\theta=\dfrac{\pi}{2}$이다.
      criteria: ['2.R2']
    - id: 2b-3
      content: |
        한편 삼각형 $\mathrm{PBP'}$과 삼각형 $\mathrm{GBG'}$은 서로 닮음이고 닮음비는 $4:7$이므로 $\overline{\mathrm{PP'}}=8\times\dfrac47=\dfrac{32}{7}$이고, 삼각형 $\mathrm{QHP'}$과 삼각형 $\mathrm{IHA}$는 서로 닮음이고 닮음비는 $1:7$이므로 $\overline{\mathrm{QP'}}=\dfrac17\overline{\mathrm{AI}}$이다. $\overline{\mathrm{PQ}}=\overline{\mathrm{PP'}}-\overline{\mathrm{QP'}}=\dfrac17(32-\overline{\mathrm{AI}})=\dfrac{26}{7}$이므로 $\overline{\mathrm{AI}}=6$이다.
        삼각형 $\mathrm{EGI}$에서 $\overline{\mathrm{GI}}=\sqrt{\overline{\mathrm{DG}}^2+\overline{\mathrm{DI}}^2}=\sqrt{3^2+2^2}=\sqrt{13}$, $\overline{\mathrm{EI}}=\sqrt{\overline{\mathrm{DE}}^2+\overline{\mathrm{DI}}^2}=\sqrt{4^2+2^2}=2\sqrt5$, $\overline{\mathrm{GE}}=\sqrt{13}$이므로 삼각형 $\mathrm{EGI}$는 $\overline{\mathrm{GI}}=\overline{\mathrm{GE}}=\sqrt{13}$인 이등변삼각형이고 선분 $\mathrm{EI}$를 밑변이라 하면 높이는 $\sqrt{(\sqrt{13})^2-(\sqrt5)^2}=2\sqrt2$이므로 삼각형 $\mathrm{EGI}$의 넓이는 $2\sqrt5\times2\sqrt2\times\dfrac12=2\sqrt{10}$이다.
        삼각형 $\mathrm{EGI}$의 평면 $\mathrm{ABC}$ 위로의 정사영은 삼각형 $\mathrm{BG'A}$이고 그 넓이는 $\dfrac{\sqrt3}{4}\times4^2\times\dfrac34=3\sqrt3$이므로 $2\sqrt{10}\times\cos\theta=3\sqrt3$에서 $\cos\theta=\dfrac{3\sqrt{30}}{20}$.
      criteria: ['2.M1']
    - id: 2b-4
      content: |
        따라서 $S\times\dfrac{3\sqrt{30}}{20}=\dfrac{\pi}{2}$에서 $S=\dfrac{\sqrt{30}\pi}{9}$이다.
      criteria: ['2.A1']
