intent: |
  공간도형 위 선분들의 길이를 찾고 코사인법칙으로 주어진 길이를 계산하며, 한 평면 위에 놓이지 않은 도형의 넓이가 일정함을 찾기 위해 정사영 계산 결과를 논리적으로 추론할 수 있는지 평가한다. [3-1]은 삼각기둥에서 코사인법칙으로 길이 비를, [3-2]는 넓이 조건을 만족하는 점들의 정사영이 반원임을 찾고 두 평면이 이루는 각의 코사인을 구해 넓이를 구한다(공식 출제 의도 요약).
key_idea: |
  넓이 $\tfrac{13}{7}=\tfrac12\cdot\tfrac{26}{7}\cdot r$에서 R과 직선 PQ의 거리 $r=1$ → R은 PQ를 축으로 하는 반지름 1인 원기둥 위. 그 정사영은 P' 중심 반지름 1인 반원, 넓이 $\tfrac{\pi}{2}=S\cos\theta$.
stuck: |
  삼각형 PQR의 넓이 조건을 「직선 PQ까지의 거리 1」로 바꾸고, 평면 EGI 위의 곡선을 평면 ABC로 정사영해 반원으로 보는 단계, 그리고 $\overline{\mathrm{AI}}=6$을 PQ 길이 조건에서 역산하는 단계
