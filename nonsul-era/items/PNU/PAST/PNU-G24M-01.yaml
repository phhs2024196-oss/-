stimuli:
- label: 가
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능할 때, 그 구간의 모든 $x$에 대하여 $f'(x)>0$이면 $f(x)$는 그 구간에서 증가한다.
- label: 나
  body: |
    반지름의 길이가 $r$, 중심각의 크기가 $\theta$(라디안)인 부채꼴의 호의 길이를 $l$, 넓이를 $S$라 하면 $l=r\theta$, $S=\dfrac12r^2\theta=\dfrac12rl$이다.
- label: 다
  body: |
    첫째항이 $a$이고 공비가 $r\ (r\ne1)$인 등비수열의 첫째항부터 제$n$항까지의 합은 $\dfrac{a(1-r^n)}{1-r}$이다.

stem: |
  【문항 1】 다음 제시문을 이용하여 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

subparts:
- id: '1'
  stem: |
    [1-1] 열린구간 $(0,1)$에서 부등식 $0<x-\sin x<\dfrac16x^3$이 성립함을 보이시오. (5점)
  points: 5
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 부등식을 각각 보조함수 $x-\sin x$, $\tfrac16x^3-x+\sin x$의 증가성으로 보인다. 둘째는 이계도함수까지 내려간다.
    steps:
    - {id: 1a, content: '$f(x)=x-\sin x$, $g(x)=\tfrac16x^3-x+\sin x$, $f(0)=g(0)=g''(0)=0$, $f''>0$, $g''''>0$', criteria: [1.R1, 1.R2, 1.R3]}
    hint_ladder:
    - 차를 함수로 두고 $x=0$에서의 값과 도함수의 부호를 보자.
    - $g'(x)=\tfrac12x^2-1+\cos x$의 부호가 바로 안 보이면 한 번 더 미분하자.
  - id: S1-B
    audience: B
    source_flow: '2025 논술가이드북 p.101 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x-\sin x$라 두고 $f(x)>0$임을 보이자. 구간 $(0,1)$에서 $f'(x)=1-\cos x>0$이고 $f(0)=0$이므로 제시문 (가)에 의해 $f(x)>0$이다.
      criteria: [1.R1]
    - id: 1b-2
      content: |
        다음으로 $g(x)=\dfrac16x^3-x+\sin x$라 두고 $g(x)>0$임을 보이자. 구간 $(0,1)$에서 $g'(x)=\dfrac12x^2-1+\cos x$이고 $g''(x)=x-\sin x>0$이다. 구간 $(0,1)$에서 $g''(x)>0$이고 $g'(0)=0$이므로 $g'(x)>0$이다.
      criteria: [1.R2]
    - id: 1b-3
      content: |
        또한 $g(0)=0$이므로 구간 $(0,1)$에서 $g(x)>0$이다. 따라서 $0<x-\sin x<\dfrac16x^3$이다. ■
      criteria: [1.R3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: |
        열린구간 $(0,1)$에서 $x-\sin x>0$임을 보였다(공식: 도함수 $1-\cos x>0$과 $f(0)=0$).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R2
      mark_type: R
      points: 2
      evidence: |
        열린구간 $(0,1)$에서 $\dfrac12x^2-1+\cos x>0$임을 보였다(공식: $g''(x)=x-\sin x>0$, $g'(0)=0$).
      depends_on: []
      steps: [1b-2]
    - id: 1.R3
      mark_type: R
      points: 1
      evidence: |
        열린구간 $(0,1)$에서 $\dfrac16x^3-x+\sin x>0$임을 보였다.
      depends_on: [1.R2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [1-2] 반지름의 길이가 $1$이고 호의 길이가 $1$인 부채꼴 $\mathrm{OAB}$가 있다. 호 $\mathrm{AB}$를 $2^n$등분하여 점 $\mathrm{A}$에 가까운 점부터 차례로 $\mathrm{P}_1,\mathrm{P}_2,\cdots,\mathrm{P}_k,\cdots,\mathrm{P}_{2^n-1}\ (1\le k\le2^n-1)$이라 하고, 삼각형 $\mathrm{OBP}_{2^n-1}$의 넓이를 $T_n$이라 하자. $T_1$과 $T_2$는 각각 [그림 1]과 [그림 2]에 색칠된 삼각형의 넓이이다.

    [그림 1: 부채꼴 OAB(O는 왼쪽 아래 꼭짓점, A는 O의 오른쪽, B는 위쪽)에서 호 AB의 중점 $\mathrm{P}_1$을 잡고 삼각형 $\mathrm{OBP}_1$을 색칠한 그림]
    [그림 2: 같은 부채꼴에서 호 AB를 4등분한 점을 A 쪽부터 $\mathrm{P}_1,\mathrm{P}_2,\mathrm{P}_3$으로 잡고 선분 $\mathrm{OP}_1,\mathrm{OP}_2,\mathrm{OP}_3$을 그은 뒤 삼각형 $\mathrm{OBP}_3$을 색칠한 그림]

    수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라 할 때, 모든 자연수 $n$에 대하여 $S_n=2^nT_n$이라 하자. 수열 $\{b_n\}$의 일반항이 $b_n=\displaystyle\sum_{k=1}^{n}2^ka_k$일 때, 모든 자연수 $n$에 대하여 $b_n<\dfrac{13}{12}$임을 보이시오. (25점)
  points: 25
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $S_n<\tfrac12$(부채꼴 넓이)과 $\tfrac12-S_n<\tfrac{1}{12\cdot4^n}$([1-1])을 $b_n=2^nS_n-\sum_{k=1}^{n-1}2^kS_k$에 대입하고 등비수열의 합으로 마무리한다.
    steps:
    - {id: 2a, content: '$b_n<2^{n-1}+\sum_{k=1}^{n-1}\left(\tfrac{1}{12}\cdot\tfrac{1}{2^k}-2^{k-1}\right)<1+\tfrac1{12}=\tfrac{13}{12}$', criteria: [2.M1, 2.M2, 2.M3, 2.R1, 2.M4, 2.R2, 2.A1]}
    hint_ladder:
    - $T_n$을 중심각 $\tfrac{1}{2^n}$으로 나타내 보자. $S_n$은 무엇의 넓이인가?
    - '[1-1]에 $x=\tfrac{1}{2^n}$을 넣으면 $\tfrac12-S_n$에 대한 무엇을 얻는가?'
    - $b_n$을 $a_k$ 대신 $S_k$로 다시 써 보자.
  - id: S2-B
    audience: B
    source_flow: '2025 논술가이드북 p.101 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        삼각형 $\mathrm{OBP}_{2^n-1}$의 중심각은 $\dfrac{1}{2^n}$이므로 $T_n=\dfrac12\sin\dfrac{1}{2^n}$이고, $S_n=2^n\left(\dfrac12\sin\dfrac{1}{2^n}\right)=2^{n-1}\sin\dfrac{1}{2^n}$은 부채꼴 $\mathrm{OAB}$의 내부에 있으므로(제시문 (나)에 의해 부채꼴의 넓이는 $\dfrac12$) 모든 자연수 $n$에 대하여 $S_n<\dfrac12$ ……① 이다.
      criteria: [2.M1, 2.R1]
    - id: 2b-2
      content: |
        그리고 [1-1]에서 $x-\sin x<\dfrac16x^3$이므로 $x$에 $\dfrac{1}{2^n}$을 대입하면 $\dfrac{1}{2^n}-\sin\dfrac{1}{2^n}<\dfrac16\left(\dfrac{1}{2^n}\right)^3$이고 양변에 $2^{n-1}$을 곱하면 $\dfrac12\left(1-2^n\sin\dfrac{1}{2^n}\right)<\dfrac{1}{12}\left(\dfrac{1}{4^n}\right)$이다. 한편 $\dfrac12-S_n=\dfrac12\left(1-2^n\sin\dfrac{1}{2^n}\right)$이므로 $\dfrac12-S_n<\dfrac{1}{12}\left(\dfrac{1}{4^n}\right)$ ……② 이다.
      criteria: [2.M4]
    - id: 2b-3
      content: |
        ②를 이용하여 $-2^kS_k$를 정리하면 $-2^kS_k<\dfrac{1}{12}\left(\dfrac{2^k}{4^k}\right)-\left(\dfrac{2^k}{2}\right)=\dfrac{1}{12}\left(\dfrac{1}{2^k}\right)-2^{k-1}$ ……③ 이다.
      criteria: [2.M4]
    - id: 2b-4
      content: |
        $b_n$을 $S_k$에 대한 식으로 정리하면 ($n\ge2$에서 $a_n=S_n-S_{n-1}$, $a_1=S_1$)
        $$b_n=2^1a_1+2^2a_2+\cdots+2^na_n=2S_1+4(S_2-S_1)+8(S_3-S_2)+\cdots+2^n(S_n-S_{n-1})$$
        $$=2^nS_n-\{(4-2)S_1+(8-4)S_2+\cdots+(2^n-2^{n-1})S_{n-1}\}=2^nS_n-(2S_1+4S_2+\cdots+2^{n-1}S_{n-1})$$
        이다.
      criteria: [2.M2, 2.M3]
    - id: 2b-5
      content: |
        ①에서 $b_n<2^n\left(\dfrac12\right)-(2S_1+4S_2+\cdots+2^{n-1}S_{n-1})$이다. ③에서
        $$b_n<2^{n-1}+\sum_{k=1}^{n-1}\left(\frac{1}{12}\left(\frac{1}{2^k}\right)-2^{k-1}\right)$$
      criteria: [2.R2]
    - id: 2b-6
      content: |
        제시문 (다)에 의해
        $$b_n<2^{n-1}+\frac{1}{12}\left(\frac{\frac12\left(1-\left(\frac12\right)^{n-1}\right)}{1-\frac12}\right)-(2^{n-1}-1)<1+\frac{1}{12}\times\frac{\frac12}{\frac12}=\frac{13}{12}$$
        이다. 그러므로 모든 자연수 $n$에 대하여 $b_n<\dfrac{13}{12}$이다. ■ ($n=1$일 때는 합이 빈 합이 되어 $b_1=2S_1<1$로 그대로 성립)
      criteria: [2.A1]
  - id: S2-ALT
    audience: ALT
    source_flow: '2025 논술가이드북 p.102 다른 풀이'
    method_no: 2
    key_idea: $b_n=2^1S_n+(2^2-2^1)(S_n-S_1)+\cdots+(2^n-2^{n-1})(S_n-S_{n-1})$로 묶고 ①로 $S_n-S_k<\tfrac12-S_k$, ②로 $\tfrac12-S_k<\tfrac{1}{12\cdot4^k}$를 쓴다.
    steps:
    - id: 2c-1
      content: |
        $b_n=2^1(a_1+\cdots+a_n)+(2^2-2^1)(a_2+\cdots+a_n)+\cdots+(2^n-2^{n-1})a_n=2^1S_n+(2^2-2^1)(S_n-S_1)+\cdots+(2^n-2^{n-1})(S_n-S_{n-1})$.
      criteria: [2.M2, 2.M3]
    - id: 2c-2
      content: |
        ①에서 $b_n<2\left(\dfrac12\right)+2\left(\dfrac12-S_1\right)+4\left(\dfrac12-S_2\right)+\cdots+2^{n-1}\left(\dfrac12-S_{n-1}\right)$이고, ②에서
        $$b_n<1+\frac{1}{12}\left(2\cdot\frac14+2^2\cdot\frac{1}{4^2}+\cdots+2^{n-1}\cdot\frac{1}{4^{n-1}}\right)=1+\frac{1}{12}\cdot\frac{\frac12\left(1-\left(\frac12\right)^{n-1}\right)}{1-\frac12}<1+\frac{1}{12}\times\frac{\frac12}{\frac12}=\frac{13}{12}.$$
      criteria: [2.R2, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $S_n=2^n\left(\dfrac12\sin\dfrac{1}{2^n}\right)=2^{n-1}\sin\dfrac{1}{2^n}$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $n\ge2$에서 $a_n=S_n-S_{n-1}$이고 $a_1=S_1=\sin\dfrac12$임을 적었다. (공식 채점 기준 표에는 $a_1=S_1=2\sin\left(\dfrac12\right)$로 인쇄되어 있으나 $S_1=2T_1=\sin\dfrac12$가 맞으므로 고쳐 옮김)
      depends_on: [2.M1]
      steps: [2b-4, 2c-1]
    - id: 2.M3
      mark_type: M
      points: 3
      evidence: |
        $b_n=2S_1+4(S_2-S_1)+8(S_3-S_2)+\cdots+2^n(S_n-S_{n-1})$로 표현했다.
      depends_on: [2.M2]
      steps: [2b-4, 2c-1]
    - id: 2.R1
      mark_type: R
      points: 10
      evidence: |
        $b_n=2^nS_n-(2S_1+4S_2+\cdots+2^{n-1}S_{n-1})$로 표현했다(다른 풀이의 $S_n-S_k$ 묶음도 인정).
      depends_on: [2.M3]
      steps: [2b-4, 2c-1]
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        $S_n<\dfrac12$임을 (부채꼴 넓이와 비교하여) 보였다.
      steps: [2b-1]
    - id: 2.M4
      mark_type: M
      points: 3
      evidence: |
        $\dfrac{1}{2^n}-\sin\dfrac{1}{2^n}<\dfrac16\left(\dfrac{1}{2^n}\right)^3$을 이용하여 $-2^kS_k<\dfrac{1}{12}\left(\dfrac{2^k}{4^k}\right)-\dfrac{2^k}{2}=\dfrac{1}{12}\left(\dfrac{1}{2^k}\right)-2^{k-1}$임을 보였다.
      depends_on: []
      ft: {allowed: true, from: [1.R1, 1.R3], max_points: 3}
      steps: [2b-2, 2b-3]
    - id: 2.R2
      mark_type: R
      points: 1
      evidence: |
        $b_n<2^{n-1}+\displaystyle\sum_{k=1}^{n-1}\left(\dfrac{1}{12}\left(\dfrac{1}{2^k}\right)-2^{k-1}\right)$임을 보였다.
      depends_on: [2.R1, 2.B1, 2.M4]
      steps: [2b-5, 2c-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        등비수열의 합을 이용하여 $b_n<2^{n-1}+\dfrac{1}{12}\left(\dfrac{\frac12\left(1-\left(\frac12\right)^{n-1}\right)}{1-\frac12}\right)-(2^{n-1}-1)<1+\dfrac{1}{12}\times\dfrac{\frac12}{\frac12}=\dfrac{13}{12}$임을 보였다.
      depends_on: [2.R2]
      steps: [2b-6, 2c-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
