  - '부채꼴의 넓이(라디안)'
  - '삼각형의 넓이 $\tfrac12ab\sin\theta$'
  - '수열의 합과 일반항의 관계'
  - '등비수열의 합'
  tools:
  - '보조함수 $x-\sin x$, $\tfrac16x^3-x+\sin x$의 미분(이계도함수까지)'
  - '$x=\tfrac{1}{2^n}$ 대입'
