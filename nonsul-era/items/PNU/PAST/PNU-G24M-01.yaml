intent: |
  도함수의 성질을 부등식 증명에 적용하고, 부채꼴 안 삼각형의 넓이를 라디안으로 표현한 뒤, 정의된 수열의 규칙성과 증명된 부등식을 이용해 주어진 상계를 이끄는 과정을 논리적으로 서술하는 능력을 본다(공식 출제 의도 요지).
key_idea: |
  $S_n=2^{n-1}\sin\dfrac{1}{2^n}$은 부채꼴에 들어가는 $2^n$개 삼각형의 넓이 합이므로 $S_n<\dfrac12$이고, [1-1]에서 $\dfrac12-S_n<\dfrac{1}{12}\cdot\dfrac{1}{4^n}$이다. $b_n=2^nS_n-\sum_{k=1}^{n-1}2^kS_k$로 바꾸어 두 부등식을 대입한다.
stuck: |
  $b_n=\sum2^ka_k$를 $a_k=S_k-S_{k-1}$로 풀어 $S_k$에 대한 식(아벨 합 꼴)으로 바꾸는 단계와, $-2^kS_k$에 [1-1]의 부등식을 쓰는 발상
idea_tags: [IDEA-SIN-CUBIC-BOUND, IDEA-PARTIAL-SUM-ABEL]
tags: [부채꼴 분할, 삼각함수 부등식, 수열의 합 부등식]
