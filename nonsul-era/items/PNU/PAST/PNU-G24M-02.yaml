stimuli:
- label: 가
  body: |
    두 변수 $x$, $y$ 사이의 관계를 변수 $t$를 매개로 하여 $x=f(t)$, $y=g(t)$와 같이 나타낼 때, 변수 $t$를 $x$, $y$의 매개변수라 하며, 위 함수를 매개변수로 나타낸 함수라고 한다.
- label: 나
  body: |
    미분가능한 함수 $t=g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$에서 연속이고, $g(a)=\alpha$, $g(b)=\beta$에 대하여 함수 $f(t)$가 $\alpha$와 $\beta$를 양 끝점으로 하는 닫힌구간에서 연속일 때,
    $$\int_a^bf(g(x))g'(x)\,dx=\int_\alpha^\beta f(t)\,dt$$

stem: |
  【문항 2】 다음 제시문을 이용하여 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  좌표평면 위를 움직이는 점 $\mathrm{Q}$가 다음 조건을 만족시킨다.

  (ⅰ) 곡선 $y=\dfrac12x^2$ 위를 움직이는 점 $\mathrm{P}$가 있다. 점 $\mathrm{Q}$는 곡선 $y=\dfrac12x^2$ 위의 점 $\mathrm{P}$에서의 접선에 수직인 직선 위에 있으면서 점 $\mathrm{P}$와 거리가 $1$인 점이다.

  (ⅱ) 점 $\mathrm{Q}$의 $y$좌표는 점 $\mathrm{P}$의 $y$좌표보다 항상 크다.

  매개변수 $t$에 대하여 점 $\mathrm{P}$의 좌표를 $\left(t,\dfrac{t^2}{2}\right)$이라 할 때, 점 $\mathrm{Q}$의 좌표 $(x,y)$는 $x=f(t)$, $y=g(t)$이다. 점 $\mathrm{Q}$가 나타내는 곡선을 $D$라 할 때, 다음 물음에 답하시오.

  [그림: 좌표평면에 포물선 $y=\tfrac12x^2$과 그 위쪽에 놓인 곡선 $D$(원점 위 $y$축 위의 점 $(0,1)$에서 뾰족하게 꺾여 보이는 모양으로 그려짐)가 있고, 제1사분면의 포물선 위 점 $\mathrm{P}$에서의 접선, 그 접선에 수직인 선분 $\mathrm{PQ}$(길이 1 표시, 직각 표시)와 $D$ 위의 점 $\mathrm{Q}$가 표시된 그림]
subparts:
- id: '1'
  stem: |
    [2-1] $f(t)$와 $g(t)$를 $t$에 관한 식으로 나타내시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'f(t) = t - t/sqrt(t**2 + 1); g(t) = t**2/2 + 1/sqrt(t**2 + 1)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 기울기 조건 $\dfrac{g-\frac{t^2}{2}}{f-t}=-\dfrac1t$과 거리 조건을 연립하고 (ⅱ)로 부호를 고른다.
    steps:
    - {id: 1a, content: '$\left\{g(t)-\tfrac{t^2}{2}\right\}^2=\tfrac{1}{t^2+1}$, (ⅱ)에서 $g(t)=\tfrac{t^2}{2}+\tfrac{1}{\sqrt{t^2+1}}$, $f(t)=t-\tfrac{t}{\sqrt{t^2+1}}$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 접선에 수직인 직선의 기울기는?
    - $\overline{\mathrm{PQ}}=1$을 식으로 쓰고 두 식을 연립하자.
    - $t=0$인 경우를 따로 확인하자.
  - id: S1-B
    audience: B
    source_flow: '2025 논술가이드북 p.105 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=\dfrac12x^2$ 위의 점 $\mathrm{P}\left(t,\dfrac{t^2}{2}\right)$에서의 접선의 기울기가 $t$이므로 $t\,(\ne0)$에 대하여 점 $\mathrm{P}$에서의 접선에 수직인 직선의 기울기는 $-\dfrac1t$이다. 그러므로 $\dfrac{g(t)-\frac{t^2}{2}}{f(t)-t}=-\dfrac1t$ ……①
      criteria: [1.M1]
    - id: 1b-2
      content: |
        또한 선분 $\mathrm{PQ}$의 길이가 $1$이므로 $\{f(t)-t\}^2+\left\{g(t)-\dfrac{t^2}{2}\right\}^2=1$ ……②
      criteria: [1.M2]
    - id: 1b-3
      content: |
        ①과 ②를 연립하면 $\left\{g(t)-\dfrac{t^2}{2}\right\}^2=\dfrac{1}{t^2+1}$이므로 $g(t)=\dfrac{t^2}{2}\pm\dfrac{1}{\sqrt{t^2+1}}$. 조건 (ⅱ)에 의하여 $g(t)=\dfrac{t^2}{2}+\dfrac{1}{\sqrt{t^2+1}}$이고, 이를 ①에 대입하면 $f(t)=t-\dfrac{t}{\sqrt{t^2+1}}$이다.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        또한 $t=0$일 때 $f(0)=0$, $g(0)=1$이므로 모든 실수 $t$에 대하여 $f(t)=t-\dfrac{t}{\sqrt{t^2+1}}$, $g(t)=\dfrac{t^2}{2}+\dfrac{1}{\sqrt{t^2+1}}$이다.
      criteria: [1.A1]
  - id: S1-ALT
    audience: ALT
    source_flow: '2025 논술가이드북 p.105 다른 풀이'
    method_no: 2
    key_idea: 접선 $y=t(x-t)+\tfrac12t^2$ ……①, 법선 위 조건 $g(t)=-\tfrac1t\{f(t)-t\}+\tfrac12t^2$ ……②, 점과 직선 사이의 거리 $\dfrac{\lvert tf(t)-g(t)-\frac12t^2\rvert}{\sqrt{t^2+1}}=1$ ……③을 연립한다.
    steps:
    - id: 1c-1
      content: |
        ②와 ③을 연립하면 $f(t)=t\pm\dfrac{t}{\sqrt{t^2+1}}$이고, 이를 ②에 대입하면 $g(t)=\dfrac12t^2\mp\dfrac{1}{\sqrt{t^2+1}}$. 조건 (ⅱ)에 의하여 $g(t)=\dfrac{t^2}{2}+\dfrac{1}{\sqrt{t^2+1}}$, $f(t)=t-\dfrac{t}{\sqrt{t^2+1}}$이고, $t=0$일 때 $f(0)=0$, $g(0)=1$이므로 모든 실수 $t$에서 성립한다.
      criteria: [1.M1, 1.M2, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        접선의 기울기를 이용하여 $f(t)$, $g(t)$ 사이의 관계식(수직 조건 ①)을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        주어진 거리 $\overline{\mathrm{PQ}}=1$을 이용하여 $f(t)$, $g(t)$ 사이의 관계식을 구했다.
      depends_on: []
      steps: [1b-2, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        조건 (ⅱ)로 부호를 정해 $f(t)=t-\dfrac{t}{\sqrt{t^2+1}}$, $g(t)=\dfrac{t^2}{2}+\dfrac{1}{\sqrt{t^2+1}}$을 각각 $t$에 관한 식으로 나타냈다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3, 1b-4, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [2-2] $x=f(t)$, $y=g(t)$인 점 $\mathrm{Q}(x,y)$에서의 곡선 $D$의 접선과 곡선 $y=\dfrac12x^2$이 만나는 두 점을 $\mathrm{A}$, $\mathrm{B}$라 하자. 선분 $\mathrm{AB}$의 길이를 $l(t)$라 할 때, $\displaystyle\lim_{t\to\infty}\dfrac{l(t)}{t\sqrt t}$의 값을 구하시오. (단, $t\ne0$) (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '2*sqrt(2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{dy}{dx}=t$이므로 접선과 포물선의 교점은 $(x-t)^2=2\sqrt{t^2+1}$의 두 근이고 $l(t)=\sqrt{t^2+1}\,\lvert\alpha-\beta\rvert=2\sqrt2(t^2+1)^{3/4}$.
    steps:
    - {id: 2a, content: '$x^2-2tx+t^2-2\sqrt{t^2+1}=0$, $l(t)=2\sqrt2(t^2+1)^{\frac34}$, 극한 $2\sqrt2$', criteria: [2.M1, 2.A1, 2.A2]}
    hint_ladder:
    - 곡선 $D$의 접선 기울기 $\dfrac{g'(t)}{f'(t)}$를 정리해 보자.
    - 기울기가 $t$인 직선 위 두 점 사이 거리는 $x$좌표 차의 몇 배인가?
  - id: S2-B
    audience: B
    source_flow: '2025 논술가이드북 p.106 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{Q}(x,y)$에서의 곡선 $D$의 접선의 기울기는
        $$\frac{dy}{dx}=\frac{\frac{dy}{dt}}{\frac{dx}{dt}}=\frac{t-\frac{t}{(t^2+1)\sqrt{t^2+1}}}{1-\frac{1}{(t^2+1)\sqrt{t^2+1}}}=\frac{t\{(t^2+1)\sqrt{t^2+1}-1\}}{(t^2+1)\sqrt{t^2+1}-1}=t$$
        이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 점 $\mathrm{Q}$에서의 곡선 $D$의 접선의 방정식은 $y-\left(\dfrac{t^2}{2}+\dfrac{1}{\sqrt{t^2+1}}\right)=t\left\{x-\left(t-\dfrac{t}{\sqrt{t^2+1}}\right)\right\}$이다. $y=\dfrac{x^2}{2}$과 연립하여 정리하면 $x^2-2tx+t^2-2\sqrt{t^2+1}=0$ ……① 이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        ①의 두 근을 $\alpha$, $\beta$라 하면 $\alpha$, $\beta$는 두 점 $\mathrm{A}$, $\mathrm{B}$의 $x$좌표이다. $l(t)$는 밑변의 길이와 높이가 각각 $\lvert\alpha-\beta\rvert$와 $\lvert t(\alpha-\beta)\rvert$인 직각삼각형의 빗변의 길이이므로 피타고라스의 정리에 의하여 $l(t)=\sqrt{t^2+1}\,\lvert\alpha-\beta\rvert$이다.
      criteria: [2.A1]
    - id: 2b-4
      content: |
        식 ①의 해를 근의 공식으로 구하면 $x=t\pm\sqrt2(t^2+1)^{\frac14}$이므로 $\lvert\alpha-\beta\rvert=2\sqrt2(t^2+1)^{\frac14}$이다. 그러므로 $l(t)=\sqrt{t^2+1}\times2\sqrt2(t^2+1)^{\frac14}=2\sqrt2(t^2+1)^{\frac34}$.
      criteria: [2.A1]
    - id: 2b-5
      content: |
        따라서 $\displaystyle\lim_{t\to\infty}\frac{l(t)}{t\sqrt t}=\lim_{t\to\infty}\frac{2\sqrt2\sqrt[4]{(t^2+1)^3}}{\sqrt[4]{t^6}}=2\sqrt2$.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: |
        두 점 $\mathrm{A}$, $\mathrm{B}$의 $x$좌표를 미지수로 하는 이차방정식 $x^2-2tx+t^2-2\sqrt{t^2+1}=0$을 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 6}
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 7
      evidence: |
        $l(t)=2\sqrt2(t^2+1)^{\frac34}$처럼 $l(t)$를 $t$에 관한 식으로 나타냈다.
      depends_on: [2.M1]
      steps: [2b-3, 2b-4]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        극한값 $2\sqrt2$를 구했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [2-3] $\displaystyle\int_{\sqrt3}^{2\sqrt2}\frac1tf(t)g'(t)\,dt$의 값을 구하시오. (10점)
  points: 10
  depends_on: ['1', '2']
  answer: {kind: value, value: '101/72', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{g'(t)}{f'(t)}=t$에서 $\dfrac{g'(t)}{t}=f'(t)$이므로 적분은 $\left[\tfrac12\{f(t)\}^2\right]$.
    steps:
    - {id: 3a, content: '$\int f(t)f''(t)\,dt=\tfrac12\{f(2\sqrt2)\}^2-\tfrac12\{f(\sqrt3)\}^2=\tfrac{101}{72}$', criteria: [3.M1, 3.A1]}
    hint_ladder:
    - '[2-2]에서 구한 $\dfrac{dy}{dx}$를 다시 보자.'
  - id: S3-B
    audience: B
    source_flow: '2025 논술가이드북 p.106 예시답안'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\dfrac{g'(t)}{f'(t)}=t$에서 $\dfrac{g'(t)}{t}=f'(t)$이다. 그러므로 제시문 (나)에 의해
        $$\int_{\sqrt3}^{2\sqrt2}\frac1tf(t)g'(t)\,dt=\int_{\sqrt3}^{2\sqrt2}f(t)f'(t)\,dt=\left[\frac12\{f(t)\}^2\right]_{\sqrt3}^{2\sqrt2}$$
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $f(2\sqrt2)=2\sqrt2-\dfrac{2\sqrt2}{3}=\dfrac{4\sqrt2}{3}$, $f(\sqrt3)=\sqrt3-\dfrac{\sqrt3}{2}=\dfrac{\sqrt3}{2}$이므로
        $$=\frac{\{f(2\sqrt2)\}^2-\{f(\sqrt3)\}^2}{2}=\frac{\frac{32}{9}-\frac34}{2}=\frac{101}{72}.$$
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        치환적분법을 이용할 수 있는 꼴 $\displaystyle\int f(t)f'(t)\,dt$로 피적분함수를 정리했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 2.M1], max_points: 4}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 6
      evidence: |
        정적분의 값 $\dfrac{101}{72}$을 구했다.
      depends_on: [3.M1]
      steps: [3b-2]
