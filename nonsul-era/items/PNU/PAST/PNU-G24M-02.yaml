intent: |
  주어진 조건을 만족하며 움직이는 점의 좌표를 매개변수로 나타내고, 매개변수로 나타낸 함수의 미분법으로 접선을 구해 선분의 길이의 극한값을 구하며, 치환적분법으로 정적분 값을 구하는 능력을 본다(공식 출제 의도 요지).
key_idea: |
  $\mathrm{Q}$는 법선 위에서 $\mathrm{P}$로부터 거리 1이고 위쪽에 있으므로 $\mathrm{Q}=\mathrm{P}+\dfrac{(-t,1)}{\sqrt{t^2+1}}$. 곡선 $D$의 접선 기울기는 $\dfrac{g'(t)}{f'(t)}=t$로 포물선의 접선과 평행하다.
stuck: |
