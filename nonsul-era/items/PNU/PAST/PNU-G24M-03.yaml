intent: |
  삼각기둥에서 선분들의 길이를 찾고 코사인법칙으로 주어진 길이를 구하며, 공간의 삼각형 넓이 조건을 만족하는 점들을 정사영으로 분석해 반원환(두 원 사이 영역)임을 찾고, 두 평면이 이루는 각의 코사인을 구해 도형의 넓이를 구하는 능력을 본다(공식 출제 의도 요지).
key_idea: |
  $\mathrm{PQ}$가 밑면에 수직이므로 그 정사영 $\mathrm{P'}$은 $\mathrm{BG'}$과 $\mathrm{AH}$의 교점이다. $T=\dfrac12\cdot\dfrac{26}{7}\cdot r$ ($r$: R에서 직선 PQ까지 거리)이므로 $1\le r\le\dfrac{\sqrt7}{2}$, 정사영은 중심 $\mathrm{P'}$인 반원환이다.
stuck: |
