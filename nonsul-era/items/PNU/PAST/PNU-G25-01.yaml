stimuli:
- label: Ⅰ
  body: |
    변수를 포함하는 문장이나 식이 변수의 값에 따라 참, 거짓이 판명될 때, 이 문장이나 식을 **조건**이라고 한다. 또 전체집합 $U$의 원소 중에서 어떤 조건을 참이 되게 하는 모든 원소의 집합을 그 조건의 **진리집합**이라고 한다.
- label: Ⅱ
  body: |
    집합 $A$의 원소의 개수를 기호로 $n(A)$와 같이 나타낸다.
- label: Ⅲ
  body: |
    서로 다른 $n$개에서 $r$개를 택하는 순열의 수는 ${}_n\mathrm{P}_r=\dfrac{n!}{(n-r)!}$ (단, $0\le r\le n$)이고,
    서로 다른 $n$개에서 $r$개를 택하는 조합의 수는 ${}_n\mathrm{C}_r=\dfrac{n!}{r!(n-r)!}$ (단, $0\le r\le n$)이다.

stem: |
  【문항 1】 다음 제시문을 이용하여 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  여섯 명의 학생 $\mathrm{A}_1$, $\mathrm{A}_2$, $\mathrm{A}_3$, $\mathrm{A}_4$, $\mathrm{A}_5$, $\mathrm{A}_6$의 수학 점수와 과학 점수가 아래의 표와 같다.

  | | 수학 점수 | 과학 점수 |
  |---|---|---|
  | $\mathrm{A}_1$ | 50 | 70 |
  | $\mathrm{A}_2$ | 60 | 50 |
  | $\mathrm{A}_3$ | 70 | 60 |
  | $\mathrm{A}_4$ | 80 | 70 |
  | $\mathrm{A}_5$ | 90 | 100 |
  | $\mathrm{A}_6$ | 100 | 90 |

subparts:
- id: '1'
  stem: |
    [1-1] 전체집합 $U=\{(i,\,j)\mid i=1,\,2,\,3,\,4,\,5,\,6$이고 $j=1,\,2,\,3,\,4,\,5,\,6\}$에 대하여 두 조건 $p$, $q$를

    $p$: $\mathrm{A}_i$의 수학 점수가 $\mathrm{A}_j$의 수학 점수보다 높다.

    $q$: $\mathrm{A}_i$의 과학 점수가 $\mathrm{A}_j$의 과학 점수보다 낮다.

    라 하자. 두 조건 $p$, $q$의 진리집합을 각각 $P$, $Q$라 할 때, $n(P)$, $n(Q)$, $n(P\cup Q)$의 값을 각각 구하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: value, value: 'n(P)=15; n(Q)=14; n(PUQ)=26', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 서로 다른 두 학생마다 $(i,j)$, $(j,i)$ 중 정확히 하나가 $p$를 참으로 하므로 $n(P)={}_6\mathrm{C}_2$이고, $q$는 과학 점수가 같은 $\mathrm{A}_1,\mathrm{A}_4$ 쌍만 빠진다. $P\cap Q$는 직접 찾는다.
    steps:
    - {id: 1a, content: '$n(P)=15$, $n(Q)=14$, $P\cap Q=\{(2,1),(3,1),(6,5)\}$, $n(P\cup Q)=26$', criteria: [1.B1, 1.B2, 1.B3]}
    hint_ladder:
    - 서로 다른 두 학생을 고를 때마다 순서쌍 두 개 중 몇 개가 $p$를 참으로 하는가?
    - 과학 점수가 같은 학생 쌍이 있는지 표를 보자.
    - $n(P\cup Q)$를 구하려면 $n(P\cap Q)$가 필요하다. 수학은 높고 과학은 낮은 쌍을 찾아보자.
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.86 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        6명의 수학 점수가 모두 다르므로 6명 중 임의로 뽑은 두 명을 $\mathrm{A}_i$와 $\mathrm{A}_j$라고 하면, ($\mathrm{A}_i$의 수학 점수) $<$ ($\mathrm{A}_j$의 수학 점수)인 경우는 순서쌍 $(j,i)$가, ($\mathrm{A}_i$의 수학 점수) $>$ ($\mathrm{A}_j$의 수학 점수)인 경우는 순서쌍 $(i,j)$가 조건 $p$를 참으로 한다. 따라서 6명 중 2명을 택하는 조합의 수와 $n(P)$는 같다. 즉, $n(P)={}_6\mathrm{C}_2=15$이다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $\mathrm{A}_1$과 $\mathrm{A}_4$의 과학 점수만 같고 나머지의 과학 점수는 서로 다르므로 $U-\{(1,4),(4,1)\}$의 원소이면서 $i\ne j$인 $(i,j)$에 대하여, 임의의 두 명을 $\mathrm{A}_i$와 $\mathrm{A}_j$라고 하면 ($\mathrm{A}_i$의 과학 점수) $<$ ($\mathrm{A}_j$의 과학 점수)인 경우는 $(i,j)$가, ($\mathrm{A}_i$의 과학 점수) $>$ ($\mathrm{A}_j$의 과학 점수)인 경우는 $(j,i)$가 조건 $q$를 참으로 한다. 따라서 $n(Q)={}_6\mathrm{C}_2-1=14$이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $i$를 하나로 고정했을 때 조건 $p$와 $q$를 모두 만족시키는 $j$를 찾으면 $P\cap Q=\{(2,1),(3,1),(6,5)\}$이다. 따라서 $n(P\cap Q)=3$이고 $n(P\cup Q)=n(P)+n(Q)-n(P\cap Q)=15+14-3=26$이다.
      criteria: [1.B3]
  - id: S1-ALT
    audience: ALT
    source_flow: '2026 논술가이드북(2027학년도 대비) p.86~87 다른 풀이'
    method_no: 2
    key_idea: 공식 다른 풀이 — 36개 순서쌍을 $i$별로 모두 나열한다.
    steps:
    - id: 1c-1
      content: |
        $i=1$이면 모든 $j$에 대해 $p$는 거짓, $i=2$이면 $j=1$, $i=3$이면 $j=1,2$, $i=4$이면 $j=1,2,3$, $i=5$이면 $j=1,2,3,4$, $i=6$이면 $j=1,2,3,4,5$일 때만 $p$가 참이다. 따라서
        $P=\{(2,1),(3,1),(3,2),(4,1),(4,2),(4,3),(5,1),(5,2),(5,3),(5,4),(6,1),(6,2),(6,3),(6,4),(6,5)\}$, $n(P)=15$.
      criteria: [1.B1]
    - id: 1c-2
      content: |
        $i=1$이면 $j=5,6$, $i=2$이면 $j=1,3,4,5,6$, $i=3$이면 $j=1,4,5,6$, $i=4$이면 $j=5,6$, $i=5$이면 없음, $i=6$이면 $j=5$일 때만 $q$가 참이다. 따라서
        $Q=\{(1,5),(1,6),(2,1),(2,3),(2,4),(2,5),(2,6),(3,1),(3,4),(3,5),(3,6),(4,5),(4,6),(6,5)\}$, $n(Q)=14$.
      criteria: [1.B2]
    - id: 1c-3
      content: |
        $P\cap Q=\{(2,1),(3,1),(6,5)\}$이고 $n(P\cup Q)=15+14-3=26$이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: |
        진리집합 $P$의 원소의 개수 $n(P)=15$를 근거(조합 대응 또는 나열)와 함께 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: |
        진리집합 $Q$의 원소의 개수 $n(Q)=14$를 구했다(과학 점수가 같은 $\mathrm{A}_1,\mathrm{A}_4$ 제외).
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1c-2]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: |
        $P\cap Q=\{(2,1),(3,1),(6,5)\}$을 찾고 합집합 $P\cup Q$의 원소의 개수 26을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3, 1c-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [1-2] 여섯 명의 학생 $\mathrm{A}_1$, $\mathrm{A}_2$, $\mathrm{A}_3$, $\mathrm{A}_4$, $\mathrm{A}_5$, $\mathrm{A}_6$ 중에서 4명을 뽑아 일렬로 나열할 때, 수학 점수가 80점 이상인 학생끼리는 서로 이웃하지 않게 나열하는 경우의 수를 구하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: value, value: '180', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 80점 이상 3명·미만 3명. 뽑힌 80점 이상 학생 수(1명 또는 2명만 가능)로 나눈다.
    steps:
    - {id: 2a, content: '${}_3\mathrm{C}_1\times4!+{}_3\mathrm{P}_2\times{}_3\mathrm{C}_2\times{}_3\mathrm{P}_2=72+108=180$', criteria: [2.B1, 2.B2, 2.B3, 2.B4, 2.B5]}
    hint_ladder:
    - 수학 점수가 80점 이상인 학생은 몇 명인가?
    - 4명 중 80점 이상인 학생이 0명, 3명인 경우는 가능한가?
    - 80점 미만 학생을 먼저 세우고 그 사이와 양 끝에 끼워 넣자.
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.87 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        6명 중 수학 점수가 80점 이상인 학생이 3명($\mathrm{A}_4,\mathrm{A}_5,\mathrm{A}_6$)이고 80점 미만인 학생이 3명이다. 뽑힌 80점 이상 학생이 (ⅰ) 0명, (ⅱ) 1명, (ⅲ) 2명, (ⅳ) 3명인 경우로 나누어 생각한다.
        (ⅰ) 6명 중 4명을 뽑으면 적어도 한 명은 80점 이상이므로 경우의 수는 0이다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        (ⅱ) 뽑힌 4명 중 80점 이상인 학생이 1명인 경우의 수는 ${}_3\mathrm{C}_1=3$이고, 각각에 대하여 80점 이상인 학생이 이웃할 수 없으므로 4명을 자유롭게 나열하는 경우의 수는 $4!=24$이다. 따라서 ${}_3\mathrm{C}_1\times4!=72$이다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        (ⅲ) 뽑힌 4명 중 80점 미만인 학생 2명을 먼저 나열하는 경우의 수는 ${}_3\mathrm{P}_2=6$이고, 80점 이상인 학생 두 명을 뽑아 서로 이웃하지 않도록 이미 나열된 두 사람 옆자리에 한 명씩 나열하는 경우의 수는 ${}_3\mathrm{C}_2\times{}_3\mathrm{P}_2=3\times6=18$이다. 따라서 ${}_3\mathrm{P}_2\times{}_3\mathrm{C}_2\times{}_3\mathrm{P}_2=108$이다.
      criteria: [2.B3]
    - id: 2b-4
      content: |
        (ⅳ) 뽑힌 4명 중 80점 이상인 학생이 3명이면 이웃하지 않게 나열할 수 없으므로 경우의 수는 0이다.
      criteria: [2.B4]
    - id: 2b-5
      content: |
        따라서 구하는 총 경우의 수는 $0+72+108+0=180$이다.
      criteria: [2.B5]
  - id: S2-ALT
    audience: ALT
    source_flow: '2026 논술가이드북(2027학년도 대비) p.87 [1-2-(ⅲ) 다른 풀이]'
    method_no: 2
    key_idea: 공식 다른 풀이 — (ⅲ)에서 80점 이상을 △, 미만을 □로 두면 △가 이웃하지 않는 배열은 △□△□, △□□△, □△□△의 3가지.
    steps:
    - id: 2c-1
      content: |
        각각의 배열에 대하여 ${}_3\mathrm{P}_2\times{}_3\mathrm{P}_2$이므로 (ⅲ)의 경우의 수는 ${}_3\mathrm{P}_2\times{}_3\mathrm{P}_2\times3=108$이다.
      criteria: [2.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
