  집합과 명제 단원의 진리집합을 구성해 원소의 개수를 구하고(합집합의 원소의 개수), 주어진 상황에 맞게 경우를 나누어 순열과 조합으로 경우의 수를 논리적으로 구할 수 있는지 평가한다(공식 출제 의도 요약).
key_idea: |
  수학 점수는 모두 달라 $n(P)={}_6\mathrm{C}_2$, 과학 점수는 $\mathrm{A}_1,\mathrm{A}_4$만 같아 $n(Q)={}_6\mathrm{C}_2-1$이고, [1-2]는 80점 이상인 학생 수로 경우를 나누어 80점 미만 학생 사이·양옆에 끼워 넣는다.
