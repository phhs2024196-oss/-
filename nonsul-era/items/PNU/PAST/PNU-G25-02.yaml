stimuli:
- label: Ⅰ
  body: |
    함수 $f(x)$가 실수 $a$에 대하여 다음 세 조건을 모두 만족시킬 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다.

    (ⅰ) 함수 $f(x)$가 $x=a$에서 정의되어 있고

    (ⅱ) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재하며

    (ⅲ) $\displaystyle\lim_{x\to a}f(x)=f(a)$
- label: Ⅱ
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능할 때,
    그 구간의 모든 $x$에 대하여 $f'(x)>0$이면 $f(x)$는 그 구간에서 증가하고,
    그 구간의 모든 $x$에 대하여 $f'(x)<0$이면 $f(x)$는 그 구간에서 감소한다.
- label: Ⅲ
  body: |
    두 함수 $f(x)$와 $g(x)$가 미분가능하고, $f'(x)$와 $g'(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    $$\int_a^b f(x)g'(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^b f'(x)g(x)\,dx$$

stem: |
  【문항 2】 다음 제시문을 이용하여 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  구간 $[0,\,2\pi]$에서 정의된 연속함수 $f(x)$가 구간 $(0,\,2\pi)$에서 미분가능하고 다음 조건을 만족시킨다.

  (가) $f(0)=2$, $f(2\pi)=1$

  (나) $1\le k\le8$인 각각의 정수 $k$에 대하여

  　(ⅰ) $f'(x)=0$ $\left(\dfrac{k-1}{4}\pi<x<\dfrac{k}{4}\pi\right)$

  　(ⅱ) $f'(x)=\sin2x$ $\left(\dfrac{k-1}{4}\pi<x<\dfrac{k}{4}\pi\right)$

  　중 하나만 성립한다.

  (다) 함수 $f(x)$가 최댓값을 갖도록 하는 $x$ $(0\le x\le2\pi)$의 개수는 1이다.

subparts:
- id: '1'
  stem: |
    [2-1] 함수 $f(x)$를 구하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'Piecewise((-cos(2*x)/2 + 5/2, x < pi), (2, x < 3*pi/2), (-cos(2*x)/2 + 3/2, True))', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 구간 8개에서 형태를 고르되, 미분가능성(짝지은 구간 같은 형태)·최댓값 점 1개·$f(0)=2$, $f(2\pi)=1$을 모두 만족하는 선택은 $[0,\pi)$ 코사인, $[\pi,\tfrac32\pi)$ 상수, $[\tfrac32\pi,2\pi]$ 코사인뿐이다.
    steps:
    - {id: 1a, content: '$f(x)=-\tfrac12\cos2x+\tfrac52\ (0\le x<\pi)$, $2\ (\pi\le x<\tfrac32\pi)$, $-\tfrac12\cos2x+\tfrac32\ (\tfrac32\pi\le x\le2\pi)$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - 각 구간에서 $f$가 가질 수 있는 꼴은 두 가지뿐이다.
    - $x=\tfrac{\pi}{4},\tfrac34\pi,\cdots$에서 $\sin2x$는 0이 아니다. 미분가능하려면 양쪽 구간은 어떤 관계여야 하는가?
    - 최댓값은 $-\tfrac12\cos2x+C$ 꼴의 극대점 $\tfrac{\pi}{2}$ 또는 $\tfrac32\pi$에서 생긴다.
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.90~92 예시답안(〈참고〉 포함)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        여덟 개의 구간을 $I_1=\left(0,\tfrac{\pi}{4}\right)$, $I_2=\left(\tfrac{\pi}{4},\tfrac{\pi}{2}\right)$, $I_3=\left(\tfrac{\pi}{2},\tfrac34\pi\right)$, $I_4=\left(\tfrac34\pi,\pi\right)$, $I_5=\left(\pi,\tfrac54\pi\right)$, $I_6=\left(\tfrac54\pi,\tfrac32\pi\right)$, $I_7=\left(\tfrac32\pi,\tfrac74\pi\right)$, $I_8=\left(\tfrac74\pi,2\pi\right)$라 하자. 각 $I_k$에서 $f'(x)=0$ 또는 $f'(x)=\sin2x$이므로 $f(x)$는 상수함수 또는 $-\tfrac12\cos2x+C$ ($C$는 상수) 꼴이다. 즉 각 구간에서 택할 수 있는 그래프 모양은 2가지이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (〈참고〉) 조건 (다)를 만족시키려면 최댓값은 $f$가 $-\tfrac12\cos2x+C$ 꼴인 구간에서 가져야 하고, 그 꼴이 극댓값을 갖는 $x$는 $\tfrac{\pi}{2}$, $\tfrac32\pi$이다. 따라서 $I_2\cup I_3$ 또는 $I_6\cup I_7$에서 $f$가 $-\tfrac12\cos2x+C$ 꼴이다. 또 연속이고 미분가능하려면 $I_1$과 $I_2$, $I_3$과 $I_4$, $I_5$와 $I_6$, $I_7$과 $I_8$에서 각각 같은 형태여야 한다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        (〈참고〉 계속) 종합하면 구간 $(0,\pi)$에서 $-\tfrac12\cos2x+C$ 꼴 …㉠ 또는 구간 $(\pi,2\pi)$에서 $-\tfrac12\cos2x+C$ 꼴 …㉡이고, 최댓값을 갖는 $x$가 1개이므로 ㉠과 ㉡이 동시에 성립해서는 안 된다. ㉠이면 $(\pi,2\pi)$에서 미분가능하고 그 구간의 최댓값이 $(0,\pi)$의 최댓값보다 작아야 하며, ㉡이면 그 반대이다. 이 중 $f(0)=2$, $f(2\pi)=1$이 되는 그래프를 택하면 $f$의 개형은 $[0,\pi]$에서 $2\to3\to2$인 종 모양, $[\pi,\tfrac32\pi]$에서 높이 2인 수평선, $[\tfrac32\pi,2\pi]$에서 2에서 1로 감소하는 곡선이다.
      criteria: [1.M1]
    - id: 1b-4
      content: |
        따라서 $f(x)=-\tfrac12\cos2x+C_1$ $(0\le x<\pi)$, $C_2$ $\left(\pi\le x<\tfrac32\pi\right)$, $-\tfrac12\cos2x+C_3$ $\left(\tfrac32\pi\le x\le2\pi\right)$ (단, $C_1,C_2,C_3$은 적분상수)이다. $f$는 연속이고 $f(0)=2$, $f(2\pi)=1$이므로 $-\tfrac12+C_1=2$, $-\tfrac12+C_1=C_2$, $-\tfrac12+C_3=1$이다.
      criteria: [1.A1]
    - id: 1b-5
      content: |
        그러므로 $C_1=\tfrac52$, $C_2=2$, $C_3=\tfrac32$이고
        $$f(x)=\begin{cases}-\tfrac12\cos2x+\tfrac52 & (0\le x<\pi)\\ 2 & \left(\pi\le x<\tfrac32\pi\right)\\ -\tfrac12\cos2x+\tfrac32 & \left(\tfrac32\pi\le x\le2\pi\right)\end{cases}$$
        이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        구간별 $f'(x)$로부터 연속·미분가능성·조건 (가)~(다)의 의미를 따져 조건을 만족하는 $y=f(x)$의 그래프(개형)를 그렸다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        적분상수를 결정하여 $f(x)$의 식(세 구간의 식)을 바르게 구했다.
      depends_on: [1.M1]
      steps: [1b-4, 1b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [2-2] $0\le t\le2\pi$인 실수 $t$에 대하여 $f(x)\ge f(t)$를 만족시키는 $x$ $(0\le x\le2\pi)$의 최댓값을 $g(t)$라 할 때, 함수 $g(t)$를 구하시오. (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: expression, value: 'Piecewise((3*pi/2, Eq(t, 0)), (pi - t, t < pi/2), (t, t < pi), (3*pi/2, t <= 3*pi/2), (t, True))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 수평선 $y=f(t)$와 그래프를 비교한다. $f(t)=2$이면 $\tfrac32\pi$, $2<f(t)\le3$이면 종 모양 구간의 오른쪽 끝, $f(t)<2$이면 $t$ 자신.
    steps:
    - {id: 2a, content: '$g(t)=\tfrac32\pi\ (t=0,\ \pi\le t\le\tfrac32\pi)$, $\pi-t\ (0<t<\tfrac{\pi}{2})$, $t\ (\tfrac{\pi}{2}\le t<\pi,\ \tfrac32\pi<t\le2\pi)$', criteria: [2.M1, 2.A1]}
    hint_ladder:
    - $f(t)$의 값이 2와 같은지, 2보다 큰지, 작은지로 나누자.
    - $(0,\pi)$에서 $f$의 그래프는 $x=\tfrac{\pi}{2}$에 대해 대칭이다.
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.92~93 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        [경우 1] $t=0$ 또는 $\pi\le t\le\tfrac32\pi$일 때 $f(t)=2$이다. $f(x)\ge f(t)$인 $x$의 범위는 $0\le x\le\tfrac32\pi$이므로 $g(t)=\tfrac32\pi$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        [경우 2] $0<t<\tfrac{\pi}{2}$일 때 $2<f(t)\le3$이다. $f(x)\ge f(t)$인 $x$의 범위는 $t\le x\le\pi-t$이므로 $g(t)=\pi-t$이다.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        [경우 3] $\tfrac{\pi}{2}\le t<\pi$일 때 $2<f(t)\le3$이다. $f(x)\ge f(t)$인 $x$의 범위는 $\pi-t\le x\le t$이므로 $g(t)=t$이다.
      criteria: [2.M1]
    - id: 2b-4
      content: |
        [경우 4] $\tfrac32\pi<t\le2\pi$일 때 $1\le f(t)<2$이다. $f(x)\ge f(t)$인 $x$의 범위는 $0\le x\le t$이므로 $g(t)=t$이다.
      criteria: [2.M1]
    - id: 2b-5
      content: |
        정리하면
        $$g(t)=\begin{cases}\tfrac32\pi & \left(t=0\ \text{또는}\ \pi\le t\le\tfrac32\pi\right)\\ t & \left(\tfrac{\pi}{2}\le t<\pi\ \text{또는}\ \tfrac32\pi<t\le2\pi\right)\\ \pi-t & \left(0<t<\tfrac{\pi}{2}\right)\end{cases}$$
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 12
      evidence: |
        $t$의 범위를 네 개의 구간으로 나누어 각 경우 $f(x)\ge f(t)$인 $x$의 범위를 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 12}
      steps: [2b-1, 2b-2, 2b-3, 2b-4]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        함수 $g(t)$의 식을 $t$의 구간을 나누어 정확히 나타냈다.
      depends_on: [2.M1]
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [2-3] 구간 $[0,\,2\pi]$에서 연속인 함수 $h(t)=g(t)\sin t$에 대하여 $\displaystyle\int_0^{2\pi}h(t)\,dt$의 값을 구하시오. (10점)
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '-3*pi/2 - 1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g$의 식이 바뀌는 점에서 적분 구간을 4개로 나누고, $t\sin t$는 부분적분한다.
    steps:
    - {id: 3a, content: '$(\pi-1)+(\pi-1)-\tfrac32\pi+(1-2\pi)=-\tfrac32\pi-1$', criteria: [3.M1, 3.A1]}
    hint_ladder:
    - $h(t)$를 네 구간으로 나누어 쓰자.
    - $\int t\sin t\,dt$는 제시문 [Ⅲ]의 부분적분으로 계산한다.
  - id: S3-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.94 예시답안'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        [2-2]의 결과에 의해 연속함수 $h(t)$는 $h(t)=\tfrac32\pi\sin t$ $\left(\pi\le t\le\tfrac32\pi\right)$, $t\sin t$ $\left(\tfrac{\pi}{2}\le t<\pi$ 또는 $\tfrac32\pi<t\le2\pi\right)$, $(\pi-t)\sin t$ $\left(0\le t<\tfrac{\pi}{2}\right)$이다. 따라서
        $$\int_0^{2\pi}h(t)\,dt=\int_0^{\frac{\pi}{2}}(\pi-t)\sin t\,dt+\int_{\frac{\pi}{2}}^{\pi}t\sin t\,dt+\int_{\pi}^{\frac32\pi}\tfrac32\pi\sin t\,dt+\int_{\frac32\pi}^{2\pi}t\sin t\,dt$$
      criteria: [3.M1]
    - id: 3b-2
      content: |
        첫 번째 정적분은
        $$\int_0^{\frac{\pi}{2}}(\pi-t)\sin t\,dt=\pi\Big[-\cos t\Big]_0^{\frac{\pi}{2}}-\left\{\Big[-t\cos t\Big]_0^{\frac{\pi}{2}}+\int_0^{\frac{\pi}{2}}\cos t\,dt\right\}=\pi-\left\{(-0+0)+\Big[\sin t\Big]_0^{\frac{\pi}{2}}\right\}=\pi-1$$
      criteria: [3.A1]
    - id: 3b-3
      content: |
        따라서
        $$\int_0^{2\pi}h(t)\,dt=\pi-1+\left\{\Big[-t\cos t\Big]_{\frac{\pi}{2}}^{\pi}+\int_{\frac{\pi}{2}}^{\pi}\cos t\,dt\right\}-\tfrac32\pi\Big[\cos t\Big]_{\pi}^{\frac32\pi}+\Big[-t\cos t\Big]_{\frac32\pi}^{2\pi}+\int_{\frac32\pi}^{2\pi}\cos t\,dt$$
        $$=\pi-1+\left\{(\pi+0)+\Big[\sin t\Big]_{\frac{\pi}{2}}^{\pi}\right\}-\tfrac32\pi+(-2\pi+0)+\Big[\sin t\Big]_{\frac32\pi}^{2\pi}=2(\pi-1)-\tfrac32\pi-2\pi+1=-\tfrac32\pi-1$$
