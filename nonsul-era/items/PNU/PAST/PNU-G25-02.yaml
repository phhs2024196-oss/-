intent: |
  연속·미분·적분의 핵심 개념을 활용하여, 구간별 도함수로부터 조건을 만족하는 연속함수를 구성하고([2-1]), 그 그래프의 개형으로 최댓값으로 정의된 함수 $g(t)$를 구간을 나누어 구성하며([2-2]), 부분적분으로 정적분을 정확히 계산하는지([2-3]) 평가한다(공식 출제 의도 요약).
key_idea: |
  각 구간 $I_k$에서 $f$는 상수 또는 $-\tfrac12\cos2x+C$. 미분가능성 때문에 $I_1\!=\!I_2$, $I_3\!=\!I_4$, $I_5\!=\!I_6$, $I_7\!=\!I_8$의 형태가 같아야 하고, 최댓값을 갖는 점이 1개이려면 $(0,\pi)$와 $(\pi,2\pi)$ 중 한쪽에서만 코사인 형태여야 한다. $f(0)=2$, $f(2\pi)=1$로 하나가 결정된다.
stuck: |
  $x=\tfrac{k\pi}{4}$ ($k$ 홀수)에서는 $\sin2x=\pm1\ne0$이므로 양쪽 형태가 같아야 미분가능하다는 점, 그리고 조건 (다)로 형태 선택을 좁히는 단계
