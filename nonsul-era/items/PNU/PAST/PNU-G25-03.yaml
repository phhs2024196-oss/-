stimuli:
- label: Ⅰ
  body: |
    오른쪽 그림과 같이 두 벡터 $\vec a$, $\vec b$에 대하여 $\vec a=\overrightarrow{\mathrm{AB}}$, $\vec b=\overrightarrow{\mathrm{BC}}$가 되도록 세 점 $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$를 잡을 때, $\overrightarrow{\mathrm{AC}}$를 두 벡터 $\vec a$와 $\vec b$의 합이라 하며, 이것을 기호로 $\vec a+\vec b$와 같이 나타낸다.

    [그림: 점 A에서 오른쪽 수평으로 점 B까지 화살표 $\vec a$, B에서 오른쪽 위의 점 C까지 화살표 $\vec b$, A에서 C까지 화살표 $\vec a+\vec b$로 이루어진 삼각형]
- label: Ⅱ
  body: |
    영벡터가 아닌 두 벡터 $\vec a$, $\vec b$가 이루는 각의 크기가 $\theta$일 때
    $0^\circ\le\theta\le90^\circ$이면 $\vec a\cdot\vec b=\lvert\vec a\rvert\lvert\vec b\rvert\cos\theta$
    $90^\circ<\theta\le180^\circ$이면 $\vec a\cdot\vec b=-\lvert\vec a\rvert\lvert\vec b\rvert\cos(180^\circ-\theta)$

stem: |
  【문항 3】 다음 제시문을 이용하여 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  좌표평면에서 세 점 $\mathrm{A}(1,\,0)$, $\mathrm{B}(1,\,-1)$, $\mathrm{C}(3,\,0)$에 대하여 두 선분 $\mathrm{AB}$와 $\mathrm{BC}$로 이루어진 도형 위를 움직이는 점 $\mathrm{P}$가 있다.

subparts:
- id: '1'
  stem: |
    [3-1] 점 $\mathrm{D}(2,\,1)$에 대하여 두 선분 $\mathrm{AD}$와 $\mathrm{DC}$로 이루어진 도형 위를 움직이는 점 $\mathrm{Q}$가 있다. $\overrightarrow{\mathrm{OR}}=\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OQ}}$를 만족시키는 점 $\mathrm{R}$이 나타내는 영역의 넓이를 구하시오. (단, $\mathrm{O}$는 원점이다.) (15점)

    [그림: 좌표평면에 원점 O, x축 위의 A(1,0)과 C(3,0), A 바로 아래의 B(1,−1), 위쪽 꼭짓점 D(2,1). 꺾은선 A–D–C(위쪽 삼각형 모양)와 꺾은선 A–B–C(아래쪽)가 그려져 있고, 선분 DC 위의 점 Q와 선분 BC 위의 점 P, 원점에서 Q와 P로 향하는 화살표가 있다.]
  points: 15
  depends_on: []
  answer: {kind: value, value: '14/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{R}$의 영역은 꼭짓점 $(2,0),(3,1),\mathrm{E}(\tfrac{11}{3},\tfrac13),(5,1),(6,0),(4,-1),\mathrm{F}(\tfrac{10}{3},-\tfrac13),(2,-1)$인 다각형이고, 직사각형 $[2,6]\times[-1,1]$에서 삼각형 5개를 뺀다.
    steps:
    - {id: 1a, content: '$8-\tfrac12\left(1+\tfrac43+1+\tfrac43+2\right)=\tfrac{14}{3}$', criteria: [1.M1, 1.A1]}
    hint_ladder:
    - $\mathrm{P}$를 한 점에 고정하면 $\mathrm{R}$은 어떤 도형 위를 움직이는가?
    - $\mathrm{P}$가 $\mathrm{A}\to\mathrm{B}\to\mathrm{C}$로 움직일 때 그 도형을 평행이동해 보자.
    - 바깥쪽 직사각형에서 빈 삼각형들을 빼자.
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.97 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{R}$이 나타내는 영역은 꺾은선 $\mathrm{ADC}$를 $\overrightarrow{\mathrm{OP}}$만큼 평행이동한 도형을 $\mathrm{P}$가 꺾은선 $\mathrm{ABC}$ 위를 움직일 때 모두 모은 것으로, 직사각형 $2\le x\le6$, $-1\le y\le1$ 안에서 꼭짓점이 $(2,0)$, $(3,1)$, $\mathrm{E}$, $(5,1)$, $(6,0)$, $(4,-1)$, $\mathrm{F}$, $(2,-1)$인 색칠된 부분이다.
        [그림: 점선 직사각형 $[2,6]\times[-1,1]$ 안의 회색 다각형. 직사각형에서 빠진 부분은 왼쪽 위 삼각형 $S_1$, 위쪽 가운데 삼각형 $S_2$(꼭짓점 E), 오른쪽 위 삼각형 $S_3$, 아래쪽 가운데 삼각형 $S_4$(꼭짓점 F), 오른쪽 아래 삼각형 $S_5$]
      criteria: [1.M1]
    - id: 1b-2
      content: |
        두 직선 $y=-(x-4)$와 $y=\tfrac12(x-3)$의 교점을 $\mathrm{E}$, 두 직선 $y=\tfrac12(x-2)-1$과 $y=-(x-3)$의 교점을 $\mathrm{F}$라 하면 $\mathrm{E}\left(\tfrac{11}{3},\tfrac13\right)$, $\mathrm{F}\left(\tfrac{10}{3},-\tfrac13\right)$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        구하는 넓이는 바깥쪽 직사각형의 넓이에서 다섯 삼각형의 넓이 $S_1,S_2,S_3,S_4,S_5$를 뺀 것과 같으므로
        $$4\times2-\frac12\left(1\times1+2\times\frac23+1\times1+2\times\frac23+2\times1\right)=8-\frac{10}{3}=\frac{14}{3}$$
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        점 $\mathrm{R}$이 나타내는 영역(꼭짓점 $(2,0),(3,1),\mathrm{E},(5,1),(6,0),(4,-1),\mathrm{F},(2,-1)$인 다각형)을 그림 또는 식으로 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        영역의 넓이 $\tfrac{14}{3}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [3-2] 반원의 호 $(x-2)^2+y^2=1$ $(0\le y\le1)$ 위를 움직이는 점 $\mathrm{S}$가 있다. $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OS}}$의 최댓값과 최솟값을 각각 구하시오. (단, $\mathrm{O}$는 원점이다.) (20점)

    [그림: 중심 (2,0), 반지름 1인 위쪽 반원(A(1,0)에서 C(3,0)까지)과 꺾은선 A–B–C, 원점에서 반원 위의 점 S와 선분 BC 위의 점 P로 향하는 화살표]
  points: 20
  depends_on: []
  answer: {kind: value, value: 'max=9; min=2-sqrt(2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 최댓값은 $\lvert\overrightarrow{\mathrm{OP}}\rvert$, $\lvert\overrightarrow{\mathrm{OS}}\rvert$이 최대이고 $\cos\theta=1$인 $\mathrm{P}=\mathrm{S}=\mathrm{C}$에서 9. 최솟값은 $\mathrm{P}=\mathrm{B}$로 고정한 뒤 $\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OS}}=2+\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{TS}}\ge2-\sqrt2$.
    steps:
    - {id: 2a, content: '최댓값 $3\times3=9$, 최솟값 $2+\lvert\overrightarrow{\mathrm{OB}}\rvert\cos\alpha\ge2-\sqrt2$', criteria: [2.M1, 2.A1, 2.M2, 2.A2]}
    hint_ladder:
    - 내적은 $\lvert\overrightarrow{\mathrm{OS}}\rvert$와 $\overrightarrow{\mathrm{OP}}$의 정사영 길이의 곱이다.
    - $\mathrm{S}$를 고정하면 $\mathrm{P}$가 어디일 때 내적이 가장 작은가?
    - 반원의 중심 $\mathrm{T}(2,0)$을 거쳐 $\overrightarrow{\mathrm{OS}}=\overrightarrow{\mathrm{OT}}+\overrightarrow{\mathrm{TS}}$로 나누자.
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.97~99 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        먼저 최댓값을 구하자. $\overrightarrow{\mathrm{OP}}$와 $\overrightarrow{\mathrm{OS}}$가 이루는 각을 $\theta$라 할 때 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OS}}=\lvert\overrightarrow{\mathrm{OP}}\rvert\lvert\overrightarrow{\mathrm{OS}}\rvert\cos\theta$이다. 따라서 최댓값은 $\lvert\overrightarrow{\mathrm{OP}}\rvert$와 $\lvert\overrightarrow{\mathrm{OS}}\rvert$의 값이 최대이며 $\cos\theta=1$일 때이다. 이러한 조건을 만족시키는 점 $\mathrm{P}$와 $\mathrm{S}$가 모두 $(3,0)$으로 존재하므로 최댓값은 $\lvert\overrightarrow{\mathrm{OP}}\rvert\lvert\overrightarrow{\mathrm{OS}}\rvert=3\times3=9$이다.
      criteria: [2.M1, 2.A1]
    - id: 2b-2
      content: |
        다음으로 최솟값을 구하자. 점 $\mathrm{P}$를 직선 $\mathrm{OS}$ 위에 내린 수선의 발을 $\mathrm{H}$라 하면 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OS}}=\lvert\overrightarrow{\mathrm{OS}}\rvert\lvert\overrightarrow{\mathrm{OH}}\rvert$이다. 임의의 점 $\mathrm{S}$에 대하여 선분 $\mathrm{AB}$ 위의 점을 $\mathrm{P}_1$, 선분 $\mathrm{BC}$ 위의 점을 $\mathrm{P}_2$라 하고 직선 $\mathrm{OS}$에 내린 수선의 발을 각각 $\mathrm{H}_1$, $\mathrm{H}_2$라 하면 $\lvert\overrightarrow{\mathrm{OH}_1}\rvert<\lvert\overrightarrow{\mathrm{OH}_2}\rvert$이므로, 내적이 최소가 되는 $\mathrm{P}$는 선분 $\mathrm{AB}$ 위에 있고 특히 $\mathrm{P}=\mathrm{B}$일 때 최소가 된다. …㉠
      criteria: [2.M2]
    - id: 2b-3
      content: |
        두 점 $\mathrm{A}$와 $\mathrm{C}$의 중점을 $\mathrm{T}$라 하고 두 벡터 $\overrightarrow{\mathrm{OP}}$와 $\overrightarrow{\mathrm{TS}}$가 이루는 각의 크기를 $\alpha$라 하면
        $$\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OS}}=(\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{AB}})\cdot(\overrightarrow{\mathrm{OT}}+\overrightarrow{\mathrm{TS}})=(\overrightarrow{\mathrm{OA}}\cdot\overrightarrow{\mathrm{OT}})+(\overrightarrow{\mathrm{AB}}\cdot\overrightarrow{\mathrm{OT}})+(\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{AB}})\cdot\overrightarrow{\mathrm{TS}}$$
        $$=2+0+\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{TS}}=2+\lvert\overrightarrow{\mathrm{OB}}\rvert\lvert\overrightarrow{\mathrm{TS}}\rvert\cos\alpha=2+\lvert\overrightarrow{\mathrm{OB}}\rvert\cos\alpha$$
      criteria: [2.M2]
    - id: 2b-4
      content: |
        이때 $\cos\alpha=-1$이 되도록 하는 점 $\mathrm{S}$는 벡터 $\overrightarrow{\mathrm{OP}}$와 벡터 $\overrightarrow{\mathrm{TS}}$의 방향이 반대인 경우로 존재하므로 최솟값은 $2+\lvert\overrightarrow{\mathrm{OB}}\rvert\cos\alpha=2-\sqrt2$이다.
      criteria: [2.A2]
  - id: S2-ALT
    audience: ALT
    source_flow: '2026 논술가이드북(2027학년도 대비) p.99 다른 풀이(㉠ 이후)'
    method_no: 2
    key_idea: 공식 다른 풀이 — 점 $\mathrm{S}$에서 직선 $\mathrm{OB}$에 내린 수선의 발 $\mathrm{H}'$에 대해 $\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OS}}=\lvert\overrightarrow{\mathrm{OB}}\rvert\lvert\overrightarrow{\mathrm{OH}'}\rvert$이고, $\lvert\overrightarrow{\mathrm{OH}'}\rvert$이 최소인 $\mathrm{H}'$은 기울기 1인 접선과 직선 $\mathrm{OB}$의 교점이다.
    steps:
    - id: 2c-1
      content: |
        $\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OS}}=\overrightarrow{\mathrm{OB}}\cdot(\overrightarrow{\mathrm{OH}'}+\overrightarrow{\mathrm{H}'\mathrm{S}})=\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OH}'}=\lvert\overrightarrow{\mathrm{OB}}\rvert\lvert\overrightarrow{\mathrm{OH}'}\rvert$이므로 $\lvert\overrightarrow{\mathrm{OH}'}\rvert$이 최소가 되어야 한다. $\mathrm{H}'$은 $y=\sqrt{1-(x-2)^2}$의 그래프에서 접선의 기울기가 1인 직선 $l$과 직선 $\mathrm{OB}$의 교점이다.
      criteria: [2.M2]
    - id: 2c-2
      content: |
        $l$의 방정식은 $y=(x-2)+\sqrt2$이고 직선 $\mathrm{OB}$의 방정식 $y=-x$와 연립하면 $x=1-\tfrac{\sqrt2}{2}$, $y=-\left(1-\tfrac{\sqrt2}{2}\right)$이므로 $\mathrm{H}'\left(1-\tfrac{\sqrt2}{2},\,-\left(1-\tfrac{\sqrt2}{2}\right)\right)$. 따라서 최솟값은 $\lvert\overrightarrow{\mathrm{OB}}\rvert\lvert\overrightarrow{\mathrm{OH}'}\rvert=\sqrt2\times\sqrt2\left(1-\tfrac{\sqrt2}{2}\right)=2-\sqrt2$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OS}}=\lvert\overrightarrow{\mathrm{OP}}\rvert\lvert\overrightarrow{\mathrm{OS}}\rvert\cos\theta$에서 두 크기가 최대이고 $\cos\theta=1$인 경우를 근거로 제시했다. (공식 기준 「최댓값을 구하고 그 근거를 제시」 7점을 근거 3·값 4로 나눔)
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $\mathrm{P}=\mathrm{S}=\mathrm{C}(3,0)$에서 최댓값 9를 구했다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 8
      evidence: |
        임의의 $\mathrm{S}$에 대해 $\mathrm{P}=\mathrm{B}$일 때 최소임을 근거(정사영 비교 등)와 함께 밝히고, $\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OS}}=2+\lvert\overrightarrow{\mathrm{OB}}\rvert\cos\alpha$ 또는 $\lvert\overrightarrow{\mathrm{OB}}\rvert\lvert\overrightarrow{\mathrm{OH}'}\rvert$ 꼴로 나타냈다. (공식 기준 「최솟값을 구하고 그 근거를 제시」 13점을 근거 8·값 5로 나눔)
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2b-3, 2c-1]
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: |
        최솟값 $2-\sqrt2$를 구했다.
      depends_on: [2.M2]
      steps: [2b-4, 2c-2]
    deductions: []
