intent: |
  벡터의 덧셈과 내적의 기하적 의미를 알고, 두 벡터를 더한 벡터의 종점이 나타내는 영역을 파악해 넓이를 구하며([3-1]), 내적이 최대·최소가 되는 상황을 추론하여 최댓값과 최솟값을 구하는지([3-2]) 평가한다(공식 출제 의도 요약).
key_idea: |
  [3-1] $\overrightarrow{\mathrm{OR}}$의 종점은 꺾은선 $\mathrm{ADC}$를 꺾은선 $\mathrm{ABC}$ 위의 점만큼 평행이동한 것들의 합집합이다. [3-2] 최솟값은 먼저 임의의 $\mathrm{S}$에 대해 $\mathrm{P}=\mathrm{B}$일 때 최소임을 보이고, $\overrightarrow{\mathrm{OS}}=\overrightarrow{\mathrm{OT}}+\overrightarrow{\mathrm{TS}}$ ($\mathrm{T}$는 반원의 중심)로 분해한다.
stuck: |
  [3-2] 최솟값에서 두 점이 함께 움직이는 문제를 「$\mathrm{S}$를 고정하고 $\mathrm{P}$ 최소화 → $\mathrm{S}$ 최소화」의 두 단계로 나누는 발상
