  정적분과 미분의 관계와 다항함수의 성질을 활용하여 조건을 만족하는 다항함수를 찾을 수 있는지 평가한다. [1-1] 미분계수의 정의로 미분계수를 구하고 정적분과 미분의 관계·다항함수의 성질로 함숫값을 구한다. [1-2] 조건과 정적분과 미분의 관계로 상수 $a$를 구한다. [1-3] 조건을 만족하는 다항함수를 찾아 함숫값을 구한다.
key_idea: |
  $g$의 미분가능성과 극솟값 조건으로 $f(-1)=-18$, $f'(-1)=0$을 얻고, $f'(x)=kx(x+1)(x-a)$로 놓아 부호에 따라 $\lvert f'\rvert$를 $\pm f'$로 바꾸어 적분한다.
stuck: |
  $x>-1$에서 $g'(x)=\lvert f'(x)\rvert$이므로 $g'(0)=g'(a)=0$에서 $f'(0)=f'(a)=0$을 얻고, $x=-1$에서의 좌미분계수로 $f'(-1)=0$을 끌어내는 단계
