stimuli:
- label: Ⅰ
  body: |
    함수 $f(t)$가 실수 $a$를 포함하는 구간에서 연속이면 이 구간에 속하는 임의의 $x$에 대하여
    $$\dfrac{d}{dx}\int_a^x f(t)\,dt=f(x)$$
- label: Ⅱ
  body: |
    함수 $f(x)$가 임의의 세 실수 $a$, $b$, $c$를 포함하는 구간에서 연속일 때,
    $$\int_a^c f(x)\,dx+\int_c^b f(x)\,dx=\int_a^b f(x)\,dx$$
- label: Ⅲ
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능할 때,
    그 구간의 모든 $x$에 대하여 $f'(x)>0$이면 $f(x)$는 그 구간에서 증가하고,
    그 구간의 모든 $x$에 대하여 $f'(x)<0$이면 $f(x)$는 그 구간에서 감소한다.

stem: |
  【문항 1】 다음 제시문을 이용하여 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  사차함수 $f(x)$에 대하여 실수 전체의 집합에서 미분가능한 함수 $g(x)$가
  $$g(x)=\begin{cases}f(x) & (x<-1)\\ \displaystyle\int_1^x\lvert f'(t)\rvert\,dt & (x\ge-1)\end{cases}$$
  일 때, 함수 $g(x)$는 다음 조건을 만족시킨다.

  (가) 모든 실수 $x$에 대하여 $g(x)\ge-18$이다.

  (나) $g(-1)=-18$

  (다) $g'(0)=0$, $g(0)=-13$

  (라) $g'(a)=0$을 만족시키는 $1$보다 큰 실수 $a$가 존재한다.

subparts:
- id: '1'
  stem: |
    [1-1] $f(0)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-13', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $g$의 연속·미분가능성으로 $f(-1)=-18$, $f'(-1)=0$을 얻고, $f'$의 부호를 정해 $g(0)=g(-1)+\int_{-1}^0 f'(t)dt=f(0)$을 보인다.
    steps:
    - id: 1a
      content: |
        $f(-1)=-18$, $f'(-1)=f'(0)=f'(a)=0$, $f'(x)=kx(x+1)(x-a)$ $(k>0)$, $-1<x<0$에서 $f'>0$이므로 $f(0)=g(0)=-13$.
      criteria: [1.B1, 1.B2, 1.M1, 1.A1]
    hint_ladder:
    - $g$가 $x=-1$에서 미분가능하다는 것은 좌우에서 무엇이 같다는 뜻인가?
    - $x>-1$에서 $g'(x)=\lvert f'(x)\rvert$이다. $g'(0)=0$, $g'(a)=0$은 $f'$에 대해 무엇을 말하는가?
    - $-1<x<0$에서 $f'(x)$의 부호를 알면 $\int_{-1}^0\lvert f'(t)\rvert dt$를 $f$의 값으로 바꿀 수 있다.
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.102 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x>-1$에서 $g'(x)=\lvert f'(x)\rvert\ge0$이므로 $g(x)$는 $x>-1$에서 증가하는 함수이다. 실수 전체의 집합에서 미분가능한 함수 $g(x)$는 $x=-1$에서 연속이므로
        $$f(-1)=\lim_{x\to-1-}f(x)=\lim_{x\to-1-}g(x)=g(-1)=-18$$
        이다. 따라서 $f(-1)=g(-1)=-18$ …… ㉠
      criteria: [1.B1]
    - id: 1b-2
      content: |
        조건 (가), (나)에서 모든 실수 $x$에 대하여 $g(x)\ge-18$, $g(-1)=-18$이므로 $g(x)$는 $x=-1$에서 극솟값을 가지고 $g'(-1)=0$이다. 또한
        $$f'(-1)=\lim_{x\to-1}\dfrac{f(x)-f(-1)}{x-(-1)}=\lim_{x\to-1-}\dfrac{f(x)-f(-1)}{x-(-1)}=\lim_{x\to-1-}\dfrac{g(x)-g(-1)}{x-(-1)}=\lim_{x\to-1}\dfrac{g(x)-g(-1)}{x-(-1)}=g'(-1)$$
        이므로 $g'(-1)=0$에서 $f'(-1)=0$이다.
      criteria: [1.B2]
    - id: 1b-3
      content: |
        $x>-1$에서 $g'(x)=\lvert f'(x)\rvert$이므로 $g'(0)=\lvert f'(0)\rvert=0$, $g'(a)=\lvert f'(a)\rvert=0$이 되어 $f'(0)=f'(a)=0$이다.
        사차함수 $f(x)$는 $x<-1$에서 $f(x)=g(x)\ge-18$이므로 $f(x)$의 최고차항의 계수는 양수이고 $f'(-1)=f'(0)=f'(a)=0$ $(a>1)$에 의하여 함수 $f'(x)$를
        $$f'(x)=kx(x+1)(x-a)\quad(k\text{는 }k>0\text{인 상수})$$
        로 놓을 수 있다.
        $-1<x<0$, $x>a$일 때, $f'(x)>0$ …… ㉡
        $x<-1$, $0<x<a$일 때, $f'(x)<0$ …… ㉢
      criteria: [1.M1]
    - id: 1b-4
      content: |
        제시문 [Ⅱ]와 ㉠, ㉡에 의하여
        $$g(0)=g(-1)+\int_{-1}^0\lvert f'(t)\rvert dt=g(-1)+\int_{-1}^0 f'(t)dt=g(-1)+f(0)-f(-1)=f(0)$$
        조건 (다)에서 $g(0)=-13$이므로 $f(0)=-13$ …… ㉣
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        $g$의 $x=-1$에서의 연속성으로 $f(-1)=g(-1)=-18$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: |
        $g'(-1)=0$과 미분계수의 정의(좌극한)로 $f'(-1)=0$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f'(x)=kx(x+1)(x-a)$ ($k>0$인 상수)임을 이용하여 $-1<x<0$일 때 $f'(x)>0$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $f(0)=-13$임을 보였다.
      depends_on: [1.M1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [1-2] 실수 $a$의 값을 구하시오.
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $g(1)=0$과 $0<x<1$에서 $f'<0$이므로 $f(1)=-26$. $f(x)=f(0)+\int_0^x kt(t+1)(t-a)dt$에 $f(\pm1)$을 넣어 $k$, $a$를 연립한다.
    steps:
    - id: 2a
      content: |
        $\dfrac{k}{12}(-1-2a)=-5$, $\dfrac{k}{12}(7-10a)=-13$에서 $k=12$, $a=2$.
      criteria: [2.M2, 2.M3, 2.A1]
    hint_ladder:
    - $g(1)$의 값은 정의에서 바로 나온다.
    - $0<x<1$에서 $\lvert f'(x)\rvert$는 $f'(x)$와 어떤 관계인가?
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.102~103 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(1)=\int_1^1\lvert f'(t)\rvert dt=0$이고 ㉡, ㉢에 의하여
        $$g(1)=g(0)+\int_0^1\lvert f'(t)\rvert dt=g(0)-\int_0^1 f'(t)dt=g(0)-\{f(1)-f(0)\}=g(0)+f(0)-f(1)=-26-f(1)$$
        에서 $f(1)=-26$ …… ㉤
      criteria: [2.B1]
    - id: 2b-2
      content: |
        이제 위의 사실을 이용하여 $f(x)$를 구하자. $f'(x)=kx(x+1)(x-a)$이고 ㉣에 의하여
        $$f(x)=f(0)+\int_0^x f'(t)dt=-13+\int_0^x kt(t+1)(t-a)dt=k\left\{\dfrac14x^4+\dfrac13(1-a)x^3-\dfrac12ax^2\right\}-13$$
      criteria: [2.M1]
    - id: 2b-3
      content: |
        ㉠, ㉤에 의하여
        $$f(-1)=k\left\{\dfrac14-\dfrac13(1-a)-\dfrac12a\right\}-13=\dfrac{k}{12}(-1-2a)-13=-18$$
      criteria: [2.M2]
    - id: 2b-4
      content: |
        $$f(1)=k\left\{\dfrac14+\dfrac13(1-a)-\dfrac12a\right\}-13=\dfrac{k}{12}(7-10a)-13=-26$$
      criteria: [2.M3]
    - id: 2b-5
      content: |
        이고 $\dfrac{k}{12}(-1-2a)=-5$, $\dfrac{k}{12}(7-10a)=-13$에서 $k=12$, $a=2$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: |
        $g(1)=0$과 $0<x<1$에서 $f'(x)<0$임을 이용해 $f(1)=-26$임을 보였다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $f(0)=-13$을 이용하여 $f(x)=k\left\{\dfrac14x^4+\dfrac13(1-a)x^3-\dfrac12ax^2\right\}-13$의 형태임을 보였다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $f(-1)=-18$을 이용하여 $\dfrac{k}{12}(-1-2a)=-5$의 형태임을 보였다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.M3
      mark_type: M
      points: 3
      evidence: |
        $f(1)=-26$을 이용하여 $\dfrac{k}{12}(7-10a)=-13$의 형태임을 보였다.
      depends_on: [2.M1, 2.B1]
      steps: [2b-4]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $a=2$임을 보였다.
      depends_on: [2.M2, 2.M3]
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [1-3] $g(a+1)-2g(a-1)$의 값을 구하시오.
  points: 5
  depends_on: ['2']
  answer: {kind: value, value: '78', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $f(x)=3x^4-4x^3-12x^2-13$, $g(3)-2g(1)=\int_1^3\lvert f'\rvert dt=-\int_1^2f'+\int_2^3f'=f(1)+f(3)-2f(2)$.
    steps:
    - id: 3a
      content: |
        $f(1)=-26$, $f(2)=-45$, $f(3)=14$이므로 $f(1)+f(3)-2f(2)=78$.
      criteria: [3.B1, 3.A1]
    hint_ladder:
    - $a=2$이면 $g(a+1)$, $g(a-1)$은 각각 $g(3)$, $g(1)$이다.
    - $1<t<2$와 $2<t<3$에서 $f'(t)$의 부호가 다르다.
  - id: S3-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.103 예시답안'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(x)=3x^4-4x^3-12x^2-13$이고 $f(1)=-26$, $f(2)=-45$, $f(3)=14$, $g(1)=\int_1^1\lvert f'(t)\rvert dt=0$이다.
      criteria: [3.B1]
    - id: 3b-2
      content: |
        따라서
        $$\begin{aligned}g(a+1)-2g(a-1)&=g(3)-2g(1)=g(3)-0=\int_1^3\lvert f'(t)\rvert dt=\int_1^2\lvert f'(t)\rvert dt+\int_2^3\lvert f'(t)\rvert dt\\&=-\int_1^2f'(t)dt+\int_2^3f'(t)dt=-\{f(2)-f(1)\}+\{f(3)-f(2)\}\\&=f(1)+f(3)-2f(2)=-26+14-2\times(-45)=78\end{aligned}$$
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        $f(x)=3x^4-4x^3-12x^2-13$임을 보였다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 2}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        구간 $[1,2]$, $[2,3]$으로 나누어 절댓값을 풀고 $g(a+1)-2g(a-1)=78$임을 보였다.
      depends_on: [3.B1]
      implied_ok: true
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

