stimuli:
- label: Ⅰ
  body: |
    삼각함수의 덧셈정리
    $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$, $\quad\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$
    $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$, $\quad\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$
    $\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$, $\quad\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$
- label: Ⅱ
  body: |
    함수 $f(x)$의 $x=a$에서의 극한값이 $L$이면 $x=a$에서의 우극한과 좌극한이 모두 존재하고 그 값은 모두 $L$과 같다. 또 그 역도 성립한다. 즉,
    $$\lim_{x\to a}f(x)=L\iff\lim_{x\to a+}f(x)=\lim_{x\to a-}f(x)=L$$

stem: |
  【문항 2】 다음 제시문을 이용하여 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  좌표평면에서 두 점 $\mathrm{O}(0,0)$과 $\mathrm{A}(1,0)$을 각각 중심으로 하고 반지름의 길이가 $1$인 두 원을 $C_1$, $C_2$라 하자. 점 $\mathrm{B}(2,0)$에 대하여 원 $C_1$ 위의 점 $\mathrm{P}$와 원 $C_2$ 위의 점 $\mathrm{Q}$를 $\angle\mathrm{AOP}=\angle\mathrm{BAQ}=\theta\left(\dfrac{\pi}{9}\le\theta\le\dfrac{\pi}{3}\right)$가 되도록 잡고, 원 $C_1$에 내접하는 정사각형 $\mathrm{PP_1P_2P_3}$과 원 $C_2$에 내접하는 정삼각형 $\mathrm{QQ_1Q_2}$를 그린다. 두 선분 $\mathrm{QQ_1}$, $\mathrm{Q_1Q_2}$가 정사각형 $\mathrm{PP_1P_2P_3}$과 만나는 두 점을 각각 $\mathrm{R}$, $\mathrm{S}$라 하자. 이때 정사각형 $\mathrm{PP_1P_2P_3}$의 내부와 정삼각형 $\mathrm{QQ_1Q_2}$의 내부의 공통부분의 넓이를 $S(\theta)$라 하자.

  [그림1: $\dfrac{\pi}{9}\le\theta<\dfrac{\pi}{6}$인 경우. 두 원 $C_1$(중심 O), $C_2$(중심 A)와 $x$축 위의 O, A, B. 정사각형의 꼭짓점은 P(제1사분면, $C_2$ 내부 쪽), $\mathrm{P_1}$(왼쪽 위), $\mathrm{P_2}$(왼쪽 아래), $\mathrm{P_3}$(아래)의 순서로 시계 반대 방향. 정삼각형의 꼭짓점은 Q(오른쪽 위), $\mathrm{Q_1}$(왼쪽 위, $y$축 근처), $\mathrm{Q_2}$(아래). 선분 $\mathrm{QQ_1}$은 변 $\mathrm{PP_1}$과 점 R에서 만나고 P는 선분 $\mathrm{QQ_1}$보다 아래에 있으며, 선분 $\mathrm{Q_1Q_2}$는 변 $\mathrm{PP_3}$과 점 S에서 만난다. 공통부분 $S(\theta)$는 사각형 $\mathrm{Q_1SPR}$로 회색 표시. $\angle\mathrm{AOP}$, $\angle\mathrm{BAQ}$에 각각 $\theta$ 표시.]

  [그림2: $\dfrac{\pi}{6}<\theta\le\dfrac{\pi}{3}$인 경우. 같은 배치에서 P가 선분 $\mathrm{QQ_1}$보다 위에 있어, 선분 $\mathrm{QQ_1}$은 변 $\mathrm{PP_3}$과 점 R에서, 선분 $\mathrm{Q_1Q_2}$는 변 $\mathrm{PP_3}$과 점 S에서 만난다. 공통부분 $S(\theta)$는 삼각형 $\mathrm{Q_1RS}$로 회색 표시.]

subparts:
- id: '1'
  stem: |
    [2-1] 점 $\mathrm{Q_1}$과 직선 $\mathrm{PP_3}$ 사이의 거리를 $d_1$, 점 $\mathrm{P}$와 직선 $\mathrm{QQ_1}$ 사이의 거리를 $d_2$라 할 때, 다음이 성립함을 보이시오.
    $$d_1=\dfrac{1}{\sqrt2}\left(\dfrac{3+\sqrt3}{2}-\cos\theta-\sin\theta\right),\qquad d_2=\left\lvert\sin\left(\theta-\dfrac{\pi}{6}\right)\right\rvert$$
  points: 20
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $\mathrm{P}(\cos\theta,\sin\theta)$, $\mathrm{P_3}(\sin\theta,-\cos\theta)$로 직선 $\mathrm{PP_3}$을 세우고 $\mathrm{Q_1}$까지 점과 직선 거리 공식을 쓴다. $d_2$는 $\overline{\mathrm{PQ}}=1$과 $\angle\mathrm{PQQ_1}=\left\lvert\theta-\dfrac{\pi}{6}\right\rvert$에서 나온다.
    steps:
    - id: 1a
      content: |
        직선 $\mathrm{PP_3}$: $(\cos\theta+\sin\theta)x-(\cos\theta-\sin\theta)y-1=0$, $d_2=\overline{\mathrm{PQ}}\sin\angle\mathrm{PQQ_1}$.
      criteria: [1.M1, 1.A1, 1.B1]
    hint_ladder:
    - 정사각형의 꼭짓점은 $\mathrm{P}$를 원점 중심으로 $90^\circ$씩 회전한 점이다.
    - 사각형 $\mathrm{OAQP}$는 어떤 도형인가? $\overline{\mathrm{PQ}}$의 길이는?
    - $\angle\mathrm{AQQ_1}$은 정삼각형의 외심과 꼭짓점이 이루는 각이다.
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.106 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        우선 $d_1$을 구하자. 두 점 $\mathrm{P}$와 $\mathrm{P_3}$의 좌표는
        $$\mathrm{P}(\cos\theta,\sin\theta),\quad\mathrm{P_3}\left(\cos\left(\theta-\dfrac{\pi}{2}\right),\sin\left(\theta-\dfrac{\pi}{2}\right)\right)=(\sin\theta,-\cos\theta)$$
        이므로 직선 $\mathrm{PP_3}$의 방정식은 $(\cos\theta+\sin\theta)x-(\cos\theta-\sin\theta)y-1=0$이다.
        한편, 점 $\mathrm{Q_1}$의 좌표가
        $$\left(1+\cos\left(\theta+\dfrac{2\pi}{3}\right),\sin\left(\theta+\dfrac{2\pi}{3}\right)\right)=\left(1-\dfrac12\cos\theta-\dfrac{\sqrt3}{2}\sin\theta,\ -\dfrac12\sin\theta+\dfrac{\sqrt3}{2}\cos\theta\right)$$
        이므로 점 $\mathrm{Q_1}$과 직선 $\mathrm{PP_3}$ 사이의 거리 $d_1$을 구하면
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $$\begin{aligned}d_1&=\dfrac{\left\lvert(\cos\theta+\sin\theta)\left(1-\dfrac12\cos\theta-\dfrac{\sqrt3}{2}\sin\theta\right)-(\cos\theta-\sin\theta)\left(-\dfrac12\sin\theta+\dfrac{\sqrt3}{2}\cos\theta\right)-1\right\rvert}{\sqrt{(\cos\theta+\sin\theta)^2+(\cos\theta-\sin\theta)^2}}\\&=\dfrac{\left\lvert\cos\theta+\sin\theta-\dfrac12\cos^2\theta-\dfrac{\sqrt3}{2}\sin^2\theta-\dfrac12\sin^2\theta-\dfrac{\sqrt3}{2}\cos^2\theta-1\right\rvert}{\sqrt{(\cos^2\theta+2\cos\theta\sin\theta+\sin^2\theta)+(\cos^2\theta-2\cos\theta\sin\theta+\sin^2\theta)}}\\&=\dfrac{1}{\sqrt2}\left\lvert\cos\theta+\sin\theta-\dfrac{3+\sqrt3}{2}\right\rvert=\dfrac{1}{\sqrt2}\left(\dfrac{3+\sqrt3}{2}-\cos\theta-\sin\theta\right)\end{aligned}$$
        이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        다음으로 $d_2$를 구하자. 선분 $\mathrm{PQ}$의 길이는 $1$이고 $\angle\mathrm{AQQ_1}=\dfrac{\pi}{6}$, $\angle\mathrm{AQP}=\theta$이므로 [그림1]의 경우는 $\angle\mathrm{PQQ_1}=\dfrac{\pi}{6}-\theta$이고 [그림2]의 경우는 $\angle\mathrm{PQQ_1}=\theta-\dfrac{\pi}{6}$이다. 따라서 $d_2=\left\lvert\sin\left(\theta-\dfrac{\pi}{6}\right)\right\rvert$이다.
      criteria: [1.B1]
  - id: S1-ALT
    audience: ALT
    source_flow: '2026 논술가이드북(2027학년도 대비) p.108~109 [2-1 다른 풀이]'
    method_no: 2
    key_idea: |
      공식 다른 풀이 — $d_1$은 사인법칙으로 $\overline{\mathrm{TQ_1}}$(또는 $\overline{\mathrm{RQ_1}}$)을 구해 $\cos\dfrac{\pi}{12}$를 곱하고, $d_2$는 $\overline{\mathrm{QQ_1}}$의 중점 $\mathrm{Q'}$을 지나는 직선 $\mathrm{QQ_1}$의 방정식과 점과 직선 거리로 구한다.
    steps:
    - id: 1c-1
      content: |
        [그림1]의 경우 직선 $\mathrm{PP_3}$가 $\overline{\mathrm{QQ_1}}$과 만나는 점을 $\mathrm{T}$라 하면 $\overline{\mathrm{PQ}}=1$, $\angle\mathrm{QTP}=\dfrac{7}{12}\pi$, $\angle\mathrm{TPQ}=\theta+\dfrac{\pi}{4}$, $\overline{\mathrm{QQ_1}}=\sqrt3$이고, $\triangle\mathrm{TPQ}$에서 사인법칙을 적용하면
        $$\overline{\mathrm{TQ}}=\dfrac{\sin\left(\theta+\frac{\pi}{4}\right)}{\sin\frac{7}{12}\pi},\quad\overline{\mathrm{TQ_1}}=\sqrt3-\dfrac{\sin\left(\theta+\frac{\pi}{4}\right)}{\sin\frac{7}{12}\pi}$$
        이므로
        $$\begin{aligned}d_1&=\overline{\mathrm{TQ_1}}\times\cos\dfrac{\pi}{12}=\left(\sqrt3-\dfrac{\sin\left(\theta+\frac{\pi}{4}\right)}{\sin\frac{7}{12}\pi}\right)\times\sin\dfrac{7}{12}\pi=\sqrt3\sin\dfrac{7}{12}\pi-\sin\left(\theta+\dfrac{\pi}{4}\right)\\&=\sqrt3\sin\left(\dfrac{\pi}{3}+\dfrac{\pi}{4}\right)-\sin\left(\theta+\dfrac{\pi}{4}\right)=\sqrt3\left(\sin\dfrac{\pi}{3}\cos\dfrac{\pi}{4}+\cos\dfrac{\pi}{3}\sin\dfrac{\pi}{4}\right)-\left(\sin\theta\cos\dfrac{\pi}{4}+\cos\theta\sin\dfrac{\pi}{4}\right)\\&=\dfrac{\sqrt3}{\sqrt2}\left(\dfrac{\sqrt3}{2}+\dfrac12\right)-\dfrac{1}{\sqrt2}(\sin\theta+\cos\theta)=\dfrac{1}{\sqrt2}\left(\dfrac{3+\sqrt3}{2}-\sin\theta-\cos\theta\right)\end{aligned}$$
      criteria: [1.M1, 1.A1]
    - id: 1c-2
      content: |
        [그림2]의 경우 $\overline{\mathrm{PQ}}=1$, $\angle\mathrm{PRQ}=\dfrac{5}{12}\pi$, $\angle\mathrm{QPR}=\dfrac34\pi-\theta$, $\overline{\mathrm{QQ_1}}=\sqrt3$이고, $\triangle\mathrm{PQR}$에서 사인법칙을 적용하면
        $$\overline{\mathrm{RQ}}=\dfrac{\sin\left(\frac34\pi-\theta\right)}{\sin\frac{5}{12}\pi}=\dfrac{\sin\left(\frac{\pi}{4}+\theta\right)}{\sin\frac{7}{12}\pi},\quad\overline{\mathrm{RQ_1}}=\sqrt3-\dfrac{\sin\left(\frac{\pi}{4}+\theta\right)}{\sin\frac{7}{12}\pi}$$
        이므로 위와 같이 계산하면 $d_1=\overline{\mathrm{RQ_1}}\times\cos\dfrac{\pi}{12}=\dfrac{1}{\sqrt2}\left(\dfrac{3+\sqrt3}{2}-\sin\theta-\cos\theta\right)$.
      criteria: [1.A1]
    - id: 1c-3
      content: |
        다음으로 $d_2$를 구하자. $\overline{\mathrm{QQ_1}}$의 중점을 $\mathrm{Q'}$이라 하면 점 $\mathrm{Q'}$은 점 $\mathrm{A}(1,0)$을 중심으로 하고 반지름의 길이가 $\dfrac12$인 원 위의 점으로 직선 $\mathrm{AQ'}$이 $x$축의 양의 방향과 이루는 각의 크기는 $\theta+\dfrac{\pi}{3}$이다.
        $$\mathrm{Q'}\left(1+\dfrac12\cos\left(\theta+\dfrac{\pi}{3}\right),\ \dfrac12\sin\left(\theta+\dfrac{\pi}{3}\right)\right)$$
        직선 $\mathrm{QQ_1}$은 기울기가 $-\dfrac{1}{\tan\left(\theta+\frac{\pi}{3}\right)}$이고 점 $\mathrm{Q'}$을 지나므로
        $$x+\tan\left(\theta+\dfrac{\pi}{3}\right)\times y-1-\dfrac12\sec\left(\theta+\dfrac{\pi}{3}\right)=0\quad\cdots\cdots㉠$$
        점 $\mathrm{P}(\cos\theta,\sin\theta)$에서 직선 ㉠까지의 거리를 $d_2$라 하면
        $$\begin{aligned}d_2&=\dfrac{\left\lvert\cos\theta+\tan\left(\theta+\frac{\pi}{3}\right)\sin\theta-1-\frac12\sec\left(\theta+\frac{\pi}{3}\right)\right\rvert}{\sqrt{1+\tan^2\left(\theta+\frac{\pi}{3}\right)}}\\&=\left\lvert\cos\theta\cos\left(\theta+\dfrac{\pi}{3}\right)+\sin\theta\sin\left(\theta+\dfrac{\pi}{3}\right)-\cos\left(\theta+\dfrac{\pi}{3}\right)-\dfrac12\right\rvert\\&=\left\lvert\cos\left\{\theta-\left(\theta+\dfrac{\pi}{3}\right)\right\}+\sin\left(\theta-\dfrac{\pi}{6}\right)-\dfrac12\right\rvert=\left\lvert\sin\left(\theta-\dfrac{\pi}{6}\right)\right\rvert\end{aligned}$$
      criteria: [1.B1]
