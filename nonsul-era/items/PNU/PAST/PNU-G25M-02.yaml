intent: |
  원 위의 점을 삼각함수로 나타내고, 내접하는 정사각형과 정삼각형의 공통부분의 넓이 $S(\theta)$를 구하는 과정에서 요구되는 식이 $d_1$, $d_2$임을 알고, 각 경우의 $S(\theta)$를 구한 뒤 극한값의 존재성을 판정할 수 있는지 평가한다. [2-1] $d_1$, $d_2$가 주어진 식과 같음을 삼각함수로 보인다. [2-2] $d_1$, $d_2$로 [그림1], [그림2]의 $S(\theta)$를 $\theta$의 식으로 나타낸 뒤 $\lim_{\theta\to\pi/6}S'(\theta)$의 존재성을 보인다.
key_idea: |
  직선 $\mathrm{PP_3}$와 직선 $\mathrm{Q_1Q_2}$가 이루는 각이 항상 $\dfrac{\pi}{4}$이므로 공통부분은 $\mathrm{Q_1}$에서 내린 수선 길이 $d_1$로 넓이가 $\dfrac12(3-\sqrt3)d_1^2$인 삼각형이 되고, $\theta<\dfrac{\pi}{6}$이면 넓이 $2d_2^2$인 직각삼각형을 뺀다.
stuck: |
  $\theta=\dfrac{\pi}{6}$을 경계로 공통부분이 삼각형↔사각형으로 바뀌는 것을 파악하고, 빼는 직각삼각형 $\mathrm{RPT}$의 넓이를 $d_2$로 나타내는 단계
idea_tags: [IDEA-POLYGON-OVERLAP-CASE-SPLIT, IDEA-ONE-SIDED-DERIV-LIMIT]
tags: [내접 정다각형, 공통부분 넓이, 좌우 극한]
