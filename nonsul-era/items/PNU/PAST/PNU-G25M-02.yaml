- id: '2'
  stem: |
    [2-2] [2-1]을 이용하여 $\displaystyle\lim_{\theta\to\frac{\pi}{6}}S'(\theta)$의 값이 존재함을 보이시오.
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: 'S1 = (3-sqrt(3))/4*((3+sqrt(3))/2-cos(th)-sin(th))**2 - 2*sin(th-pi/6)**2; S2 = (3-sqrt(3))/4*((3+sqrt(3))/2-cos(th)-sin(th))**2; limit = (3-2*sqrt(3))/2', equivalents: ['S1: pi/9<=th<pi/6, S2: pi/6<th<=pi/3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      두 직선이 이루는 각 $\dfrac{\pi}{4}$로 $\triangle\mathrm{Q_1RS}=\dfrac12(3-\sqrt3)d_1^2$, $\theta<\dfrac{\pi}{6}$이면 $\triangle\mathrm{RPT}=2d_2^2$를 뺀다. $d_2^2$ 항의 도함수는 $\theta=\dfrac{\pi}{6}$에서 0이므로 좌우극한이 같다.
    steps:
    - id: 2a
      content: |
        $\displaystyle\lim_{\theta\to\frac{\pi}{6}-}S'(\theta)=\lim_{\theta\to\frac{\pi}{6}+}S'(\theta)=\dfrac{3-2\sqrt3}{2}$.
      criteria: [2.B1, 2.B2, 2.B3, 2.A1]
    hint_ladder:
    - 직선 $\mathrm{PP_3}$과 직선 $\mathrm{Q_1Q_2}$가 $x$축과 이루는 각을 각각 구해 보자.
    - $\mathrm{Q_1}$에서 $\mathrm{PP_3}$에 내린 수선의 발을 H라 하면 $\triangle\mathrm{Q_1HS}$는 어떤 삼각형인가?
    - $\theta<\dfrac{\pi}{6}$일 때 삼각형 $\mathrm{Q_1ST}$에서 무엇을 빼야 공통부분이 되는가?
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.106~108 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        우선 두 개의 그림 모두에서 직선 $\mathrm{PP_3}$이 $x$축의 양의 방향과 이루는 각의 크기가 $\theta+\dfrac{\pi}{4}$이고, 직선 $\mathrm{Q_1Q_2}$가 $x$축의 양의 방향과 이루는 각의 크기가 $\theta+\dfrac{\pi}{2}$이므로
        $$\angle\mathrm{PSQ_1}=\left(\theta+\dfrac{\pi}{2}\right)-\left(\theta+\dfrac{\pi}{4}\right)=\dfrac{\pi}{4}$$
        임을 확인할 수 있다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        (ⅰ) $\dfrac{\pi}{6}<\theta\le\dfrac{\pi}{3}$인 경우 [그림2]에서 $\triangle\mathrm{Q_1RS}$의 넓이 $S(\theta)$를 구하자.
        [그림: [그림2]와 같은 배치에 점 $\mathrm{Q_1}$에서 $\overline{\mathrm{PP_3}}$에 내린 수선의 발 H를 표시하고 $\angle\mathrm{RSQ_1}$, $\angle\mathrm{HQ_1R}$을 표시한 그림]
        $\angle\mathrm{RSQ_1}=\dfrac{\pi}{4}$이고 점 $\mathrm{Q_1}$에서 $\overline{\mathrm{PP_3}}$의 수선의 발을 H라 하면 $\triangle\mathrm{Q_1HS}$는 직각이등변삼각형이다. 그러므로 $\angle\mathrm{HQ_1R}=\dfrac{\pi}{3}-\dfrac{\pi}{4}=\dfrac{\pi}{12}$이고, 제시문 [Ⅰ]에 의해
        $$\tan\dfrac{\pi}{12}=\tan\left(\dfrac{\pi}{3}-\dfrac{\pi}{4}\right)=\dfrac{\sqrt3-1}{1+\sqrt3}=2-\sqrt3$$
        이다. $\overline{\mathrm{Q_1H}}=d_1$이므로
        $$S(\theta)=\dfrac12\times\overline{\mathrm{RS}}\times\overline{\mathrm{Q_1H}}=\dfrac12\times\left(d_1+d_1\tan\dfrac{\pi}{12}\right)\times d_1=\dfrac12(3-\sqrt3)d_1^2$$
        이고, [2-1]의 $d_1$에 의해
        $$S(\theta)=\dfrac{3-\sqrt3}{4}\times\left(\dfrac{3+\sqrt3}{2}-\cos\theta-\sin\theta\right)^2\quad\left(\dfrac{\pi}{6}<\theta\le\dfrac{\pi}{3}\right)$$
        이다.
      criteria: [2.B2]
    - id: 2b-3
      content: |
        (ⅱ) $\dfrac{\pi}{9}\le\theta<\dfrac{\pi}{6}$인 경우 [그림1]에서 사각형 $\mathrm{Q_1SPR}$의 넓이 $S(\theta)$를 구하자.
        [그림: [그림1]과 같은 배치에 직선 $\mathrm{PP_3}$의 연장선이 $\overline{\mathrm{QQ_1}}$과 만나는 점 T를 표시한 그림]
        직선 $\mathrm{PP_3}$가 $\overline{\mathrm{QQ_1}}$와 만나는 점을 T라 하자. 사각형 $\mathrm{Q_1SPR}$의 넓이 $S(\theta)$는 $\triangle\mathrm{Q_1ST}$의 넓이에서 $\triangle\mathrm{RPT}$의 넓이를 뺀 값이다.
        먼저, 직각삼각형 $\mathrm{RPT}$에서 $\angle\mathrm{PRT}=\dfrac{\pi}{12}$, $\angle\mathrm{PTR}=\dfrac{5}{12}\pi$이므로 $\overline{\mathrm{RP}}\times\sin\dfrac{\pi}{12}=d_2$, $\overline{\mathrm{PT}}\times\sin\dfrac{5}{12}\pi=d_2$이고, 제시문 [Ⅰ]에 의해
        $$\cos\dfrac{5}{12}\pi=\cos\left(\dfrac{\pi}{6}+\dfrac{\pi}{4}\right)=\dfrac{\sqrt6-\sqrt2}{4},\quad\cos\dfrac{\pi}{12}=\cos\left(\dfrac{\pi}{3}-\dfrac{\pi}{4}\right)=\dfrac{\sqrt6+\sqrt2}{4}$$
        이므로 [2-1]의 $d_2$를 적용하여 직각삼각형 $\mathrm{RPT}$의 넓이를 구하면
        $$\dfrac12\times\dfrac{d_2}{\cos\frac{5}{12}\pi}\times\dfrac{d_2}{\cos\frac{\pi}{12}}=2d_2^2=2\sin^2\left(\theta-\dfrac{\pi}{6}\right)$$
        이다. 이때 $\triangle\mathrm{Q_1ST}$의 넓이는 (ⅰ)에서 구한 $\triangle\mathrm{Q_1RS}$의 넓이와 같은 식으로 표현되고, $\triangle\mathrm{Q_1ST}$의 넓이는 $\dfrac{3-\sqrt3}{4}\times\left(\dfrac{3+\sqrt3}{2}-\cos\theta-\sin\theta\right)^2$이므로
        $$S(\theta)=\dfrac{3-\sqrt3}{4}\times\left(\dfrac{3+\sqrt3}{2}-\cos\theta-\sin\theta\right)^2-2\sin^2\left(\theta-\dfrac{\pi}{6}\right)\quad\left(\dfrac{\pi}{9}\le\theta<\dfrac{\pi}{6}\right)$$
        이다.
      criteria: [2.B3]
    - id: 2b-4
      content: |
        (ⅰ), (ⅱ)에 의하여
        $$S'(\theta)=\begin{cases}\dfrac{3-\sqrt3}{2}\left(\dfrac{3+\sqrt3}{2}-\cos\theta-\sin\theta\right)(\sin\theta-\cos\theta)-4\sin\left(\theta-\dfrac{\pi}{6}\right)\cos\left(\theta-\dfrac{\pi}{6}\right) & \left(\dfrac{\pi}{9}<\theta<\dfrac{\pi}{6}\right)\\[2mm] \dfrac{3-\sqrt3}{2}\left(\dfrac{3+\sqrt3}{2}-\cos\theta-\sin\theta\right)(\sin\theta-\cos\theta) & \left(\dfrac{\pi}{6}<\theta<\dfrac{\pi}{3}\right)\end{cases}$$
        이고, 따라서 $\displaystyle\lim_{\theta\to\frac{\pi}{6}-}S'(\theta)=\dfrac{3-2\sqrt3}{2}$, $\displaystyle\lim_{\theta\to\frac{\pi}{6}+}S'(\theta)=\dfrac{3-2\sqrt3}{2}$이므로 제시문 [Ⅱ]에 의해 $\displaystyle\lim_{\theta\to\frac{\pi}{6}}S'(\theta)$의 값은 존재하고 그 값은 $\dfrac{3-2\sqrt3}{2}$이다.
      criteria: [2.A1]
