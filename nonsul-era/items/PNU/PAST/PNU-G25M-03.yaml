intent: |
  벡터의 덧셈, 뺄셈, 실수배, 내적 등의 연산을 활용하여 조건을 만족시키는 점의 위치관계를 파악할 수 있는지 평가한다. [3-1] 내적이 0일 때와 실수배일 때의 두 벡터의 위치관계를 파악하고, 이를 만족시키지 않기 위한 점의 좌표를 구한다. [3-2] 조건을 만족시키는 점의 위치를 두 직선의 교점으로 파악한 뒤 점의 위치에 따라 두 벡터의 합이 변함을 파악하고 그 크기의 최솟값을 구한다.
