stimuli:
- label: Ⅰ
  body: |
    영벡터가 아닌 두 벡터 $\vec a$, $\vec b$에 대하여
    $$\vec a\perp\vec b\iff\vec a\cdot\vec b=0$$
- label: Ⅱ
  body: |
    영벡터가 아닌 두 벡터 $\vec a$, $\vec b$에 대하여
    $$\vec a\parallel\vec b\iff\vec b=k\vec a\ (\text{단, }k\text{는 }0\text{이 아닌 실수})$$
- label: Ⅲ
  body: |
    점 $\mathrm{A}(x_1,y_1)$을 지나고 법선벡터가 $\vec n=(a,b)$인 직선의 방정식은
    $$a(x-x_1)+b(y-y_1)=0$$

stem: |
  【문항 3】 다음 제시문을 이용하여 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  좌표평면에서 원점 $\mathrm{O}$와 두 점 $\mathrm{A}(0,3)$, $\mathrm{B}\left(\dfrac{3\sqrt3}{2},-\dfrac32\right)$에 대하여 두 점 $\mathrm{P}$, $\mathrm{Q}$는 다음 조건을 만족시킨다.

  (가) $\lvert\overrightarrow{\mathrm{OP}}\rvert=2$ (단, $\overrightarrow{\mathrm{AP}}\cdot\overrightarrow{\mathrm{BP}}\ne0$)

  (나) $\overrightarrow{\mathrm{AP}}\cdot\overrightarrow{\mathrm{PQ}}=0$

subparts:
- id: '1'
  stem: |
    [3-1] $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}=k\overrightarrow{\mathrm{BQ}}$를 만족시키는 점 $\mathrm{Q}$의 개수가 $0$이 되도록 하는 점 $\mathrm{P}$의 좌표를 모두 구하시오. (단, $k$는 $0$이 아닌 실수이다.)
  points: 15
  depends_on: []
  answer: {kind: set, value: '{((3*sqrt(3)+sqrt(7))/4, (3-sqrt(21))/4), ((3*sqrt(3)-sqrt(7))/4, (3+sqrt(21))/4)}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      Q는 직선 $y=\dfrac{\sqrt3}{3}x-3$ 위에 있어야 하므로, Q가 없으려면 P를 지나고 $\overrightarrow{\mathrm{AP}}$에 수직인 직선이 이 직선과 평행해야 한다. 즉 직선 AP가 $y=-\sqrt3x+3$.
    steps:
    - id: 1a
      content: |
        $b=-\sqrt3a+3$, $a^2+b^2=4$에서 $4a^2-6\sqrt3a+5=0$, $a=\dfrac{3\sqrt3\pm\sqrt7}{4}$.
      criteria: [1.B1, 1.M1, 1.A1]
    hint_ladder:
    - $\overrightarrow{\mathrm{BQ}}$가 $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}$와 평행하면 Q는 어떤 직선 위에 있는가?
    - 조건 (나)를 만족시키는 Q 전체는 어떤 직선인가? 두 직선이 만나지 않을 조건은?
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.112 예시답안'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}=\left(\dfrac{3\sqrt3}{2},\dfrac32\right)$이다. 이때, $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}=k\overrightarrow{\mathrm{BQ}}$ …… ㉠을 만족시키는 점 Q가 존재한다는 것은 $\overrightarrow{\mathrm{BQ}}$가 $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}$와 평행이므로 점 Q는 점 B를 지나고 기울기가 $\dfrac{\sqrt3}{3}$인 직선 위에 존재한다는 것이다. 즉, 점 Q는 직선 $y=\dfrac{\sqrt3}{3}x-3$ 위에 존재한다.
        이때 점 Q가 점 B와 같아지면 $\overrightarrow{\mathrm{AP}}\cdot\overrightarrow{\mathrm{BP}}=0$이 되므로 이러한 조건을 만족시키는 점 P는 존재하지 않으며, 점 Q는 점 B가 아니다.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        또한 ㉠을 만족시키는 점 Q의 개수가 $0$이 되어야 하므로 조건 (나)를 만족시키는 점 Q는 직선 $y=\dfrac{\sqrt3}{3}x-3$ 위에 존재하지 않아야 한다. 따라서 $\overrightarrow{\mathrm{PQ}}$는 직선 $y=\dfrac{\sqrt3}{3}x-3$과 평행하고, 조건 (나)에 의해 $\overrightarrow{\mathrm{AP}}$는 $y=\dfrac{\sqrt3}{3}x-3$과 수직이다. 즉, 두 점 A와 P를 지나는 직선의 방정식은 $y=-\sqrt3x+3$이다.
        [그림: 왼쪽은 「조건을 만족시키는 점 Q가 존재하는 경우」 — 원 $x^2+y^2=4$ 위의 P(제3사분면)에서 AP에 수직인 직선이 직선 $y=\tfrac{\sqrt3}{3}x-3$과 점 Q에서 만나는 그림. 오른쪽은 「조건을 만족시키는 점 Q의 개수가 0인 경우」 — 직선 AP가 $y=-\sqrt3x+3$이고 P를 지나 AP에 수직인 직선이 $y=\tfrac{\sqrt3}{3}x-3$과 평행한 그림. 두 그림 모두 벡터 $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}$가 화살표로 표시됨]
      criteria: [1.M1]
    - id: 1b-3
      content: |
        이때 $\mathrm{P}(a,b)$라 하면, $\overrightarrow{\mathrm{AP}}=(a,b-3)$이므로 $\dfrac{b-3}{a}=-\sqrt3$, $b=-\sqrt3a+3$이고 조건 (가)에 의해 $a^2+b^2=4$이므로
        $$a^2+(-\sqrt3a+3)^2=4,\quad4a^2-6\sqrt3a+5=0,\quad a=\dfrac{3\sqrt3\pm\sqrt{27-20}}{4}=\dfrac{3\sqrt3\pm\sqrt7}{4}$$
        이다. 따라서 점 P는 $\left(\dfrac{3\sqrt3+\sqrt7}{4},\dfrac{3-\sqrt{21}}{4}\right)$ 또는 $\left(\dfrac{3\sqrt3-\sqrt7}{4},\dfrac{3+\sqrt{21}}{4}\right)$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: |
        조건을 만족시키는 점 Q가 존재한다면 점 Q가 직선 $y=\dfrac{\sqrt3}{3}x-3$ 위에 있음을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        점 Q의 개수가 $0$이 되도록 하는 점 P에 대한 직선 AP의 방정식 $y=-\sqrt3x+3$을 구했다.
      depends_on: [1.B1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        점 P의 좌표 $\left(\dfrac{3\sqrt3+\sqrt7}{4},\dfrac{3-\sqrt{21}}{4}\right)$, $\left(\dfrac{3\sqrt3-\sqrt7}{4},\dfrac{3+\sqrt{21}}{4}\right)$를 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [3-2] $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}=k\overrightarrow{\mathrm{BQ}}$를 만족시키는 점 $\mathrm{Q}$가 존재할 때, $\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OQ}}\rvert$의 최솟값을 구하시오. (단, $k$는 $0$이 아닌 실수이다.)
  points: 15
  depends_on: []
  answer: {kind: value, value: '10/7', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      Q의 $x$좌표 $t=\dfrac{5\sqrt3}{3-b-\sqrt3a}$이고 $\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OQ}}\rvert=\dfrac{2\sqrt3}{3}\lvert t\rvert$. 원 위에서 $\lvert3-b-\sqrt3a\rvert$의 최댓값 $7$을 쓴다.
    steps:
    - id: 2a
      content: |
        $\dfrac{2\sqrt3}{3}\times\dfrac{5\sqrt3}{7}=\dfrac{10}{7}$.
      criteria: [2.M1, 2.A1, 2.A2]
    hint_ladder:
    - Q는 두 직선의 교점이다. 각 직선의 방정식을 세워 보자.
    - $a^2+b^2=4$를 쓰면 교점의 $x$좌표가 간단해진다.
    - $\sqrt3a+b$의 범위는 원과 직선이 만날 조건으로 구할 수 있다.
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.113 예시답안'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 Q는 직선 $y=\dfrac{\sqrt3}{3}x-3$ 위에 존재한다. …… ㉡
        이때 점 $\mathrm{P}(a,b)$라 하면, $\overrightarrow{\mathrm{AP}}=(a,b-3)$은 직선 PQ의 법선벡터가 되므로 직선 PQ는
        $$a(x-a)+(b-3)(y-b)=0,\quad y=\dfrac{a}{3-b}(x-a)+b$$
        이다. ㉡에 의해 점 Q는 $y=\dfrac{\sqrt3}{3}x-3$ 위에도 존재하므로 점 Q의 $x$좌표를 $t$라 하면
        $$\dfrac{a}{3-b}(t-a)+b=\dfrac{\sqrt3}{3}t-3$$
        이 성립한다.
        $$\left(\dfrac{1}{\sqrt3}-\dfrac{a}{3-b}\right)t=\dfrac{-a^2}{3-b}+b+3$$
        $$(3-b-\sqrt3a)t=\sqrt3\{-a^2+(b+3)(3-b)\}=\sqrt3\{9-(a^2+b^2)\}=5\sqrt3$$
        $$t=\dfrac{5\sqrt3}{3-b-\sqrt3a}\quad\cdots\cdots㉢$$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        이때, 점 Q는 $\left(t,\dfrac{\sqrt3}{3}t-3\right)$이므로
        $$\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OQ}}\rvert=\left\lvert\left(t,\dfrac{\sqrt3}{3}t\right)\right\rvert=\dfrac{2\sqrt3}{3}\lvert t\rvert$$
        이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        즉, $\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OQ}}\rvert$가 최소가 되도록 하는 점 Q의 좌표는 ㉢에 의해 $\lvert3-b-\sqrt3a\rvert$의 값이 최대일 때이다. $3-b-\sqrt3a=d$라 하면, $a^2+b^2=4$를 만족시키므로 $(0,0)$과 $\sqrt3x+y+d-3=0$ 사이의 거리가 $2$일 때, $d$는 최댓값과 최솟값을 가진다.
        [그림: 원 $x^2+y^2=4$와 이에 접하는 두 직선 $\sqrt3x+y-4=0$(제1사분면 쪽 접점), $\sqrt3x+y+4=0$(제3사분면 쪽 접점 $\mathrm{P}(a,b)$), 원점에서 각 접점으로 그은 반지름과 직각 표시]
        $\dfrac{\lvert d-3\rvert}{\sqrt{3+1}}=2$일 때, $d=-1$ 또는 $d=7$이므로 $\lvert d\rvert$의 최댓값은 $7$이다.
        따라서 $\lvert t\rvert$의 최솟값은 $\dfrac{5\sqrt3}{7}$이고, $\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OQ}}\rvert$의 최솟값은 $\dfrac{2\sqrt3}{3}\times\dfrac{5\sqrt3}{7}=\dfrac{10}{7}$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: |
        조건을 만족시키는 점 $\mathrm{P}(a,b)$에 대해 변수를 사용하여 점 Q의 좌표($t=\dfrac{5\sqrt3}{3-b-\sqrt3a}$)를 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        벡터 $\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OQ}}$의 크기를 $\dfrac{2\sqrt3}{3}\lvert t\rvert$로 나타냈다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 6
      evidence: |
        $\lvert3-b-\sqrt3a\rvert$의 최댓값 $7$을 근거와 함께 구해 $\lvert\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OQ}}\rvert$의 최솟값 $\dfrac{10}{7}$을 구했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

