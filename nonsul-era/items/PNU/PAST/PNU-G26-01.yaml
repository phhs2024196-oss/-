intent: |
  경우의 수 단원의 핵심 개념인 합의 법칙과 곱의 법칙, 조합을 이해하고 적용하여 다양한 문제 상황에서 경우의 수를 구할 수 있는지 평가한다. [1-1]은 적절한 전략을 탐색하고 조합을 활용해 조건을 만족시키는 경우의 수를 찾고 그 과정을 논리적으로 설명하는지, [1-2]는 조건을 만족시키는 경우를 모두 고려하고 분석하여 복잡한 상황에서 조합을 활용하는지 본다(공식 출제 의도 요약).
key_idea: |
  특정 학생(B 또는 C·D)의 조를 먼저 정해 경우를 나누고, 남은 자리를 조합의 곱으로 센다. 조건 「서로 다른 조」는 여사건(같은 조인 경우)을 빼서 처리한다.
stuck: |
  [1-1]에서 (가)의 「B 또는 C와 같은 조」와 (나)를 함께 다루려면 B·C의 조를 먼저 고정해야 한다는 것, [1-2]에서 C·D가 같은 조인 경우를 빠짐없이 빼는 단계
