intent: |
  주어진 조건을 만족시키는 함수(법선의 $x$절편 $g(t)$)를 찾고, $n(A_k)=2$라는 조건이 $g$가 극값을 가질 때임을 파악하는지 평가한다. [2-1]은 극값을 가질 조건과 특정 조건에서의 극값, 삼차함수와 직선의 교점을 찾는지, [2-2]는 방정식의 두 근의 제곱의 합을 이차방정식의 근과 계수의 관계로 나타내고 그 범위를 구하는지 본다(공식 출제 의도 요약).
key_idea: |
  법선의 $x$절편은 $g(t)=t+f(t)f'(t)$인 삼차함수이고, $A_k$는 방정식 $g(t)=g(k)$의 실근의 집합이다. $n(A_k)=2$는 수평선 $y=g(k)$가 극값에서 접할 때, $m_k<k<M_k$는 $g(t)=g(k)$를 $(t-k)$로 나눈 이차식 $h(t)$에 대해 $h(k)<0$일 때이다.
stuck: |
  $n(A_k)=2 \iff g(k)$가 극값이라는 해석, 그리고 [2-2]에서 $m_k,M_k$가 이차방정식 $h(t)=0$의 두 근이 되는 조건을 $h(k)<0$으로 바꾸는 단계
