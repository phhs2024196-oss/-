stimuli:
- label: Ⅰ
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이면
    $$ \lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x=\int_a^b f(x)\,dx\quad\left(\text{단, }\Delta x=\dfrac{b-a}{n},\ x_k=a+k\Delta x\right) $$
- label: Ⅱ
  body: |
    수렴하는 두 수열 $\{a_n\}$, $\{b_n\}$에 대하여 $\displaystyle\lim_{n\to\infty}a_n=L$, $\displaystyle\lim_{n\to\infty}b_n=M$ ($L$, $M$은 상수)일 때, 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $L=M$이면 $\displaystyle\lim_{n\to\infty}c_n=L$

stem: |
  자연수 $n$에 대하여 중심이 원점이고 반지름의 길이가 $1$인 원과 직선 $y=\left(\tan\dfrac{k\pi}{3n}\right)x$ $(k=1,\,2,\,3,\,\cdots,\,n)$이 제$1$사분면에서 만나는 점을 $\mathrm{A}_k$, 두 직선 $x=2$와 $y=\left(\tan\dfrac{k\pi}{3n}\right)x$ $(k=1,\,2,\,3,\,\cdots,\,n)$이 만나는 점을 $\mathrm{B}_k$라 하고, 사각형 $\mathrm{A}_{k-1}\mathrm{A}_k\mathrm{B}_k\mathrm{B}_{k-1}$의 내부 또는 그 경계에 포함되며 선분 $\mathrm{A}_{k-1}\mathrm{A}_k$를 한 변으로 하는 직사각형의 넓이의 최댓값을 $T_k$라 하자. (단, 두 점 $\mathrm{A}_0$, $\mathrm{B}_0$의 좌표는 각각 $(1,0)$, $(2,0)$이다.)

  [그림: $n=3$인 경우. 좌표평면에 원점 $\mathrm{O}$, $x$축 위의 눈금 $1$($\mathrm{A}_0$), $2$($\mathrm{B}_0$), $y$축 위의 눈금 $1$. 제1사분면의 단위원 호(점선) 위에 $\mathrm{A}_1,\mathrm{A}_2,\mathrm{A}_3$($\mathrm{A}_3$은 $y$축 근처, 각 $\tfrac{\pi}{3}$)이 있고, 직선 $x=2$ 위에 아래에서부터 $\mathrm{B}_0,\mathrm{B}_1,\mathrm{B}_2,\mathrm{B}_3$이 있다. 원점에서 $\mathrm{B}_1,\mathrm{B}_2,\mathrm{B}_3$으로 선분이 그어져 있고, 각 사각형 $\mathrm{A}_{k-1}\mathrm{A}_k\mathrm{B}_k\mathrm{B}_{k-1}$ 안에 선분 $\mathrm{A}_{k-1}\mathrm{A}_k$를 한 변으로 하여 바깥쪽(직선 $x=2$ 쪽)으로 길게 뻗은 회색 직사각형 $T_1,T_2,T_3$이 그려져 있다.]

  $S_n=T_1+T_2+\cdots+T_n$이라 할 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $S_1$의 값을 구하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '2*sqrt(3)/3', equivalents: ['2/sqrt(3)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $n=1$이면 $\triangle\mathrm{A}_0\mathrm{OA}_1$은 정삼각형이고, 직사각형은 $\mathrm{A}_0$에서 각 $\tfrac{\pi}{6}$ 방향으로 $x=2$까지 뻗는다.
    steps:
    - {id: 1a, content: '짧은 변 $1$, 긴 변 $\dfrac{1}{\cos\frac{\pi}{6}}=\dfrac{2\sqrt3}{3}$, $S_1=\dfrac{2\sqrt3}{3}$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $\angle\mathrm{A}_0\mathrm{OA}_1$의 크기는? 삼각형 $\mathrm{A}_0\mathrm{OA}_1$은 어떤 삼각형인가?
    - 직사각형의 긴 변은 현 $\mathrm{A}_0\mathrm{A}_1$에 수직, 즉 현의 수직이등분선과 평행하다. 그 방향과 $x$축이 이루는 각은?
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.46(인쇄) 예시답안 — 채점기준 및 예시답안 p.10'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        [그림: 단위원 위의 $\mathrm{A}_0(1,0)$, $\mathrm{A}_1$, 직선 $x=2$ 위의 $\mathrm{B}_0$, $\mathrm{B}_1$. 원점에서 $\mathrm{A}_0\mathrm{A}_1$의 중점 $\mathrm{C}_1$을 지나는 직선 $l$(각 $\tfrac{\pi}{6}$)과, 변 $\mathrm{A}_0\mathrm{A}_1$에서 $l$과 평행하게 뻗어 $\mathrm{B}_0\mathrm{B}_1$ 위의 점 $\mathrm{D}_1$에 닿는 직사각형 $S_1=T_1$]
        $\angle\mathrm{A}_0\mathrm{OA}_1=\dfrac{\pi}{3}$이므로 삼각형 $\mathrm{A}_0\mathrm{OA}_1$은 한 변의 길이가 $1$인 정삼각형이다. 그러므로 $\overline{\mathrm{A}_0\mathrm{A}_1}=1\ \cdots\cdots ①$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        선분 $\mathrm{A}_0\mathrm{A}_1$의 중점을 $\mathrm{C}_1$, 넓이가 $T_1$인 직사각형이 선분 $\mathrm{B}_0\mathrm{B}_1$과 만나는 점을 $\mathrm{D}_1$이라 하면 $\angle\mathrm{A}_0\mathrm{OC}_1=\angle\mathrm{B}_0\mathrm{A}_0\mathrm{D}_1$이므로 $\angle\mathrm{B}_0\mathrm{A}_0\mathrm{D}_1=\dfrac12\times\dfrac{\pi}{3}=\dfrac{\pi}{6}$이다.
        $\overline{\mathrm{A}_0\mathrm{D}_1}\cos\dfrac{\pi}{6}=\overline{\mathrm{A}_0\mathrm{B}_0}$에서 $\overline{\mathrm{A}_0\mathrm{D}_1}=\dfrac{1}{\cos\frac{\pi}{6}}=\dfrac{2}{\sqrt3}=\dfrac{2\sqrt3}{3}\ \cdots\cdots ②$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        ①, ②에 의하여 $S_1=T_1=1\times\dfrac{2\sqrt3}{3}=\dfrac{2\sqrt3}{3}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        직사각형의 짧은 변의 길이 $\overline{\mathrm{A}_0\mathrm{A}_1}=1$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        직사각형의 긴 변의 길이 $\overline{\mathrm{A}_0\mathrm{D}_1}=\dfrac{2\sqrt3}{3}$을 구했다(각 $\tfrac{\pi}{6}$과 $\cos$ 이용).
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $S_1=\dfrac{2\sqrt3}{3}$을 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $\displaystyle\lim_{n\to\infty}S_n=2\int_0^{\frac{\pi}{3}}\sec x\,dx-\dfrac{\pi}{3}$임을 보이시오. (25점)
  points: 25
  depends_on: ['1']
  answer: {kind: proof, value: '2*log(2+sqrt(3)) - pi/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $T_k=2\sin\delta\,(2\sec\theta_k-\cos\delta-\sin\delta\tan\theta_k)$로 쓰고, 세 항의 극한을 각각 $2\int_0^{\pi/3}\sec x\,dx$, $\tfrac{\pi}{3}$, $0$으로 구한다.
    steps:
    - {id: 2a, content: '$S_n=4\sin\delta\sum\sec\theta_k-2n\sin\delta\cos\delta-2\sin^2\delta\sum\tan\theta_k$, 첫 항은 좌·우 리만 합 사이에 끼움', criteria: ['2.M1', '2.M2', '2.M3', '2.R1', '2.B1', '2.R2', '2.A1']}
    hint_ladder:
    - 현 $\mathrm{A}_{k-1}\mathrm{A}_k$의 중점 $\mathrm{C}_k$와 원점을 잇는 직선은 현에 수직이다. 직사각형의 긴 변은 어느 방향인가?
    - 긴 변의 끝이 먼저 닿는 곳은 $\mathrm{A}_{k-1}$쪽인가 $\mathrm{A}_k$쪽인가? $x$좌표로 비교해 보자.
    - $\sec\theta_k$의 합은 제시문 Ⅰ의 꼴이 아니다. $\sec$가 증가함을 이용해 Ⅰ의 꼴인 두 합 사이에 끼워 보자.
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.46~48(인쇄) 예시답안 — 채점기준 및 예시답안 p.10~12'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        [그림: 원점에서 $\mathrm{A}_{k-1}$, $\mathrm{A}_k$를 지나 $\mathrm{B}_{k-1}$, $\mathrm{B}_k$까지의 선분, 현 $\mathrm{A}_{k-1}\mathrm{A}_k$의 중점 $\mathrm{C}_k$, 각 $\theta_k=t_{k-1}+\delta$, $\mathrm{A}_{k-1}$에서 $x$축에 평행한 선과 $\mathrm{B}_0\mathrm{B}_k$의 교점 $\mathrm{E}_k$, 직사각형이 $\mathrm{B}_{k-1}\mathrm{B}_k$와 만나는 점 $\mathrm{D}_k$]
        선분 $\mathrm{A}_{k-1}\mathrm{A}_k$의 중점을 $\mathrm{C}_k$라 하자. $\angle\mathrm{A}_{k-1}\mathrm{OC}_k=\delta$라 하면 $\angle\mathrm{A}_{k-1}\mathrm{OA}_k=\dfrac{\pi}{3n}$이므로 $\delta=\dfrac{\pi}{6n}$이다.
        $\overline{\mathrm{OA}_{k-1}}=1$이므로 $\overline{\mathrm{A}_{k-1}\mathrm{C}_k}=\sin\delta$이다. 그러므로 $\overline{\mathrm{A}_{k-1}\mathrm{A}_k}=2\sin\delta\ \cdots\cdots ③$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\angle\mathrm{A}_0\mathrm{OA}_k=t_k$라 하면 $t_k=\dfrac{k}{3n}\pi$이고, $\angle\mathrm{A}_0\mathrm{OC}_k=\theta_k$라 하면 $t_{k-1}=\theta_k-\delta$이다.
        한편, 넓이가 $T_k$인 직사각형이 선분 $\mathrm{B}_{k-1}\mathrm{B}_k$와 만나는 점을 $\mathrm{D}_k$라 하면 $\overline{\mathrm{A}_{k-1}\mathrm{D}_k}\cos\theta_k=2-\cos t_{k-1}$에서
        $$ \overline{\mathrm{A}_{k-1}\mathrm{D}_k}=\dfrac{2-\cos t_{k-1}}{\cos\theta_k}=\dfrac{2-\cos(\theta_k-\delta)}{\cos\theta_k}=2\sec\theta_k-\dfrac{\cos\theta_k\cos\delta+\sin\theta_k\sin\delta}{\cos\theta_k}\ \cdots\cdots ④ $$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        ③, ④에 의하여 $T_k=2\sin\delta\left(2\sec\theta_k-\dfrac{\cos\theta_k\cos\delta+\sin\theta_k\sin\delta}{\cos\theta_k}\right)=2\sin\delta\,(2\sec\theta_k-\cos\delta-\sin\delta\tan\theta_k)$이므로
        $$ S_n=\sum_{k=1}^{n}\{2\sin\delta\,(2\sec\theta_k-\cos\delta-\sin\delta\tan\theta_k)\}=4\sin\delta\sum_{k=1}^{n}\sec\theta_k-2n\sin\delta\cos\delta-2\sin^2\delta\sum_{k=1}^{n}\tan\theta_k $$
        $\displaystyle\lim_{n\to\infty}S_n$의 값을 항별로 나누어 구하자.
      criteria: ['2.M3']
    - id: 2b-4
      content: |
        (ⅰ) 함수 $y=\sec x$는 $0<x<\dfrac{\pi}{3}$에서 증가하므로 $\displaystyle\sum_{k=1}^{n}\sec\dfrac{(2k-2)\pi}{6n}\le\sum_{k=1}^{n}\sec\dfrac{(2k-1)\pi}{6n}\le\sum_{k=1}^{n}\sec\dfrac{2k\pi}{6n}$에서
        $$ 4\sin\dfrac{\pi}{6n}\sum_{k=1}^{n}\sec\dfrac{(2k-2)\pi}{6n}\le4\sin\dfrac{\pi}{6n}\sum_{k=1}^{n}\sec\dfrac{(2k-1)\pi}{6n}\le4\sin\dfrac{\pi}{6n}\sum_{k=1}^{n}\sec\dfrac{2k\pi}{6n}\ \cdots\cdots ⑤ $$
        그런데 $\displaystyle\lim_{n\to\infty}4\sin\dfrac{\pi}{6n}\sum_{k=1}^{n}\sec\dfrac{(2k-2)\pi}{6n}=\lim_{n\to\infty}2\,\dfrac{\sin\frac{\pi}{6n}}{\frac{\pi}{6n}}\sum_{k=1}^{n}\sec\dfrac{(k-1)\pi}{3n}\times\dfrac{\pi}{3n}$이고, 함수 $y=\sec x$는 닫힌구간 $\left[0,\dfrac{\pi}{3}\right]$에서 연속이므로 $x_k=\dfrac{(k-1)\pi}{3n}$, $\Delta x=\dfrac{\pi}{3n}$으로 놓으면
        $$ \lim_{n\to\infty}\dfrac{2\sin\frac{\pi}{6n}}{\frac{\pi}{6n}}\sum_{k=1}^{n}\sec\dfrac{(k-1)\pi}{3n}\times\dfrac{\pi}{3n}=2\int_0^{\frac{\pi}{3}}\sec x\,dx\ \cdots\cdots ⑥ $$
        또한 $\displaystyle\lim_{n\to\infty}4\sin\dfrac{\pi}{6n}\sum_{k=1}^{n}\sec\dfrac{2k\pi}{6n}=\lim_{n\to\infty}2\,\dfrac{\sin\frac{\pi}{6n}}{\frac{\pi}{6n}}\sum_{k=1}^{n}\sec\dfrac{k\pi}{3n}\times\dfrac{\pi}{3n}$이고, $x_k=\dfrac{k\pi}{3n}$, $\Delta x=\dfrac{\pi}{3n}$으로 놓으면
        $$ \lim_{n\to\infty}2\,\dfrac{\sin\frac{\pi}{6n}}{\frac{\pi}{6n}}\sum_{k=1}^{n}\sec\dfrac{k\pi}{3n}\times\dfrac{\pi}{3n}=2\int_0^{\frac{\pi}{3}}\sec x\,dx\ \cdots\cdots ⑦ $$
        이므로 ⑤, ⑥, ⑦에 의하여(제시문 Ⅱ) $\displaystyle\lim_{n\to\infty}4\sin\dfrac{\pi}{6n}\sum_{k=1}^{n}\sec\dfrac{(2k-1)\pi}{6n}=2\int_0^{\frac{\pi}{3}}\sec x\,dx$
      criteria: ['2.R1']
    - id: 2b-5
      content: |
