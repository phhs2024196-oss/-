intent: |
  삼각함수, 수열의 극한의 대소 관계, 정적분과 급수의 합 사이의 관계를 이해하고 활용하는지 평가한다. [3-1]은 삼각함수로 $S_1$을 구하는지, [3-2]는 $S_n$을 찾고 수열의 극한의 대소 관계와 정적분과 급수의 합 사이의 관계로 $\displaystyle\lim_{n\to\infty}S_n$이 주어진 정적분으로 나타남을 보이는지 본다(공식 출제 의도 요약).
key_idea: |
  직사각형의 짧은 변은 현 $\overline{\mathrm{A}_{k-1}\mathrm{A}_k}=2\sin\dfrac{\pi}{6n}$, 긴 변은 $\mathrm{A}_{k-1}$에서 현의 수직 이등분선 방향($\theta_k=\tfrac{(2k-1)\pi}{6n}$)으로 직선 $x=2$까지의 거리 $\dfrac{2-\cos t_{k-1}}{\cos\theta_k}$이다. 덧셈정리로 $T_k$를 세 항으로 나누고, $\sec$ 항은 증가성을 이용한 두 리만 합 사이에 끼워 정적분으로 보낸다.
stuck: |
  긴 변이 $\mathrm{A}_{k-1}$쪽 꼭짓점에서 결정된다는 것($\mathrm{A}_{k-1}$이 직선 $x=2$에 더 가까움)과, 중점 표본 $\sec\theta_k$의 합을 좌·우 끝점 리만 합 사이에 끼우는 단계
idea_tags: [IDEA-CHORD-2SIN, IDEA-RIEMANN-SQUEEZE-MONOTONE, IDEA-TRIG-ADDITION-SPLIT]
tags: [정적분과 급수, 샌드위치 정리, 시컨트 적분]
