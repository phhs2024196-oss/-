        $\displaystyle\lim_{n\to\infty}\left(2\sqrt3\,n\sin^2\dfrac{\pi}{6n}\right)=\lim_{n\to\infty}2\sqrt3\left(\dfrac{\sin\frac{\pi}{6n}}{\frac{\pi}{6n}}\right)^2\left(\dfrac{\pi}{6n}\right)^2n=0$이므로
        $\displaystyle\lim_{n\to\infty}\left\{2\sin^2\dfrac{\pi}{6n}\sum_{k=1}^{n}\tan\dfrac{(2k-1)\pi}{6n}\right\}=0$
      criteria: ['2.R2']
    - id: 2b-7
