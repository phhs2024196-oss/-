intent: |
  주어진 조건을 만족시키는 함수 $g(t)$를 찾고, $n(A_k)=2$라는 조건이 삼차함수 $g(t)$가 극값을 가질 때임을 파악하는지 평가한다. [1-1]은 극값 조건과 삼차함수·직선의 교점, [1-2]는 두 근의 제곱의 합의 범위를 이차방정식의 근과 계수의 관계로 구하는 능력을 본다(공식 출제 의도 요약).
key_idea: |
  법선의 $x$절편은 $g(t)=t+f(t)f'(t)$인 삼차함수이다. $n(A_k)=2$는 $g(k)$가 극값일 때이고, $g(t)=g(k)$를 $(t-k)h(t)=0$으로 인수분해하면 $m_k,M_k$는 이차방정식 $h(t)=0$의 두 근이다.
stuck: |
  $n(A_k)=2$를 「$g(k)$가 극값」으로 번역하는 단계, 그리고 [1-2]에서 $m_k<k<M_k$ 조건을 $h(k)<0$으로 바꾸는 단계
