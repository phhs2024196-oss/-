stimuli:
- label: Ⅰ
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(a,\,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: Ⅱ
  body: |
    집합 $A$의 원소가 유한개일 때, 집합 $A$의 원소의 개수를 기호로 $n(A)$와 같이 나타낸다.
- label: Ⅲ
  body: |
    함수 $f(x)$가 미분가능하고 $f'(a)=0$일 때, $x=a$의 좌우에서 $f'(x)$의 부호가
    (ⅰ) 양($+$)에서 음($-$)으로 바뀌면 $f(x)$는 $x=a$에서 극대이고 극댓값 $f(a)$를 갖는다.
    (ⅱ) 음($-$)에서 양($+$)으로 바뀌면 $f(x)$는 $x=a$에서 극소이고 극솟값 $f(a)$를 갖는다.

stem: |
  【문항 1】 다음 제시문을 읽고 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  이차함수 $f(x)$에 대하여 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(t,\,f(t))$에서의 접선과 수직이고, 점 $\mathrm{P}$를 지나는 직선의 $x$절편을 $g(t)$라 하자. 실수 $k$에 대하여 집합 $A_k$를 $A_k=\{t\mid g(t)=g(k)\}$라 할 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    [1-1] $f(x)=x^2+px+\dfrac12p-\dfrac12$에 대하여 $n(A_k)=2$를 만족시키는 $k$가 존재하도록 하는 자연수 $p$의 최솟값을 $p_1$이라 하자. 이때 $p_1$을 구하고, $f(x)=x^2+p_1x+\dfrac12p_1-\dfrac12$에 대하여 $n(A_k)=2$를 만족시키는 모든 $k$의 값의 합을 구하시오. (15점)
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'p1 = 3; sum = -6', equivalents: ['k in {-5/2, -2, -1, -1/2}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(t)=t+f(t)f'(t)$는 삼차함수이고, $n(A_k)=2$는 $g(k)$가 극값일 때 생긴다. 극값이 있을 조건($g'=0$이 서로 다른 두 실근)으로 $p_1$, 극값과 같은 함숫값을 갖는 $t$를 모두 찾아 더한다.
    steps:
    - {id: 1a, content: '$g(t)=2t^3+3pt^2+(p^2+p)t+\tfrac12p^2-\tfrac12p$, $\tfrac D4=3p(p-2)>0\Rightarrow p_1=3$, $k=-\tfrac52,-2,-1,-\tfrac12$, 합 $-6$', criteria: ['1.A1', '1.M1', '1.A2']}
    hint_ladder:
    - 법선의 $x$절편을 $t$의 식으로 쓰면 몇 차 함수인가?
    - 삼차함수 $g$에서 방정식 $g(t)=c$의 실근이 정확히 2개가 되는 $c$는 어떤 값인가?
    - 극댓값·극솟값과 같은 값을 갖는 $t$는 중근 인수분해로 찾는다.
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.51 예시답안(채점기준 및 예시답안 p.3)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P}(t,f(t))$를 지나고 점 $\mathrm{P}$에서의 접선과 수직인 직선은, $t=-\dfrac p2$일 때 $x=-\dfrac p2$이므로 $g\!\left(-\dfrac p2\right)=-\dfrac p2$이다. $t\ne-\dfrac p2$일 때 $y=-\dfrac{1}{2t+p}(x-t)+t^2+pt+\dfrac12p-\dfrac12$이고
        $$g(t)=t+(2t+p)\left(t^2+pt+\dfrac12p-\dfrac12\right)=2t^3+3pt^2+(p^2+p)t+\dfrac12p^2-\dfrac12p.$$
        그러므로 모든 실수 $t$에 대하여 $g(t)=2t^3+3pt^2+(p^2+p)t+\dfrac12p^2-\dfrac12p$이다.
      criteria: ['1.A1']
    - id: 1b-2
      content: |
        $n(A_k)=2$를 만족시키는 $k$가 존재하려면 $g(t)$가 극값을 가져야 하고, $g(k)$가 극값이 될 때 $n(A_k)=2$가 된다. $g'(t)=6t^2+6pt+p^2+p$이고 $g(t)$가 극값을 가질 조건은 $g'(t)=0$이 서로 다른 두 실근을 갖는 것이므로
        $$\dfrac D4=9p^2-6(p^2+p)=3p(p-2)>0,\quad p<0\ \text{또는}\ p>2.$$
        $p$는 자연수이므로 $p>2$이고, 최소의 자연수 $p_1$은 $3$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $p=3$일 때 $g(t)=2t^3+9t^2+12t+3$, $g'(t)=6(t+1)(t+2)$이므로 극값은 $g(-1)=-2$, $g(-2)=-1$이다.
        $g(t)=-2$에서 $2t^3+9t^2+12t+5=(t+1)^2(2t+5)=0$이므로 $t=-1$ 또는 $t=-\dfrac52$.
        $g(t)=-1$에서 $2t^3+9t^2+12t+4=(t+2)^2(2t+1)=0$이므로 $t=-2$ 또는 $t=-\dfrac12$.
        따라서 구하는 모든 $k$의 값은 $-\dfrac52,\,-2,\,-1,\,-\dfrac12$이고, 그 합은 $-6$이다.
        [그림: $y=g(t)$의 그래프. $t=-2$에서 극댓값 $-1$, $t=-1$에서 극솟값 $-2$를 갖고, 직선 $y=-1$은 $t=-2,\,-\tfrac12$에서, 직선 $y=-2$는 $t=-\tfrac52,\,-1$에서 그래프와 만난다.]
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.A1
      mark_type: B
      points: 4
      evidence: |
        (공식: 함수 $g(t)$의 식을 구할 수 있다) $g(t)=2t^3+3pt^2+(p^2+p)t+\dfrac12p^2-\dfrac12p$를 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        (공식: $p_1$의 값을 구할 수 있다) $n(A_k)=2$를 $g$가 극값을 가질 조건으로 바꾸고 $g'(t)=0$의 판별식 $3p(p-2)>0$에서 $p_1=3$을 얻었다.
      depends_on: [1.A1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: |
        (공식: $k$의 값의 합을 구할 수 있다) $k=-\dfrac52,-2,-1,-\dfrac12$를 모두 구하고 합 $-6$을 적었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [1-2] $f(x)=x^2+x-7$에 대하여 집합 $A_k$의 원소 중 최댓값을 $M_k$, 최솟값을 $m_k$라 하자. $n(A_k)=2$ 또는 $m_k<k<M_k$를 만족시키는 $k$에 대하여 $M_k^{\,2}+m_k^{\,2}$의 최댓값과 최솟값의 합을 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: value, value: '49/2', equivalents: ['24.5'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(t)=2t^3+3t^2-12t-7$에서 $g(t)-g(k)=(t-k)h(t)$로 묶으면 $m_k,M_k$는 $h(t)=0$의 두 근이다. 가능한 $k$의 범위 $-2\le k\le1$(및 같은 집합을 주는 $-\tfrac72,\tfrac52$)에서 $M_k^2+m_k^2=\tfrac14(-4k^2+57)$.
    steps:
    - {id: 2a, content: '$k\in\{-\tfrac72,\tfrac52\}\cup[-2,1]$, $M_k^2+m_k^2=\tfrac14(57-4k^2)$, 최대 $\tfrac{57}4$, 최소 $\tfrac{41}4$, 합 $\tfrac{49}2$', criteria: ['2.B1', '2.B2', '2.M1', '2.A1']}
    hint_ladder:
    - $g(t)=g(k)$는 $t=k$를 근으로 가지므로 $(t-k)$로 인수분해된다.
    - 남은 이차식 $h(t)$의 두 근 사이에 $k$가 있으려면 $h(k)$의 부호는?
    - 두 근의 제곱의 합은 근과 계수의 관계로 $k$의 식이 된다.
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.52~53 예시답안(채점기준 및 예시답안 p.4~5)'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)=x^2+x-7$에 대하여 $g(t)=2t^3+3t^2-12t-7$이다.
        (ⅰ) $n(A_k)=2$를 만족시키는 $k$의 조건: $g'(t)=6t^2+6t-12$이므로 극값은 $g(1)=-14$, $g(-2)=13$이다.
        ($ⅰ$-1) $g(k)=-14$: $2t^3+3t^2-12t+7=(t-1)^2(2t+7)=0$에서 $t=1$ 또는 $t=-\dfrac72$.
        ($ⅰ$-2) $g(k)=13$: $2t^3+3t^2-12t-20=(t+2)^2(2t-5)=0$에서 $t=-2$ 또는 $t=\dfrac52$.
        따라서 $n(A_k)=2$를 만족시키는 모든 $k$의 값은 $-\dfrac72,\,-2,\,1,\,\dfrac52$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        (ⅱ) $m_k<k<M_k$를 만족시키는 $k$의 범위: $g(t)=g(k)$에서
        $$2(t^3-k^3)+3(t^2-k^2)-12(t-k)=(t-k)\{2t^2+(2k+3)t+2k^2+3k-12\}=0.$$
        $h(t)=2t^2+(2k+3)t+2k^2+3k-12$라 두면 [그림: 아래로 볼록한 포물선 $y=h(t)$가 $t$축과 $m_k,M_k$에서 만나고 그 사이의 $k$에서 음수] 와 같이 $h(k)<0$이 되어야 한다.
        $h(k)=6k^2+6k-12=6(k+2)(k-1)<0$이므로 $-2<k<1$이다.
      criteria: ['2.B2']
    - id: 2b-3
      content: |
        (ⅰ)과 (ⅱ)에 의하여 $k$의 값의 범위는 $k=-\dfrac72,\ k=\dfrac52,\ -2\le k\le1$이다. $k=-\dfrac72$ 또는 $k=\dfrac52$일 경우는 $g\!\left(-\dfrac72\right)=g(1)$, $g\!\left(\dfrac52\right)=g(-2)$에 의하여 $A_{-7/2}=A_1$, $A_{5/2}=A_{-2}$가 성립하므로 $-2\le k\le1$에서 최댓값·최솟값을 구하면 충분하다.
        $-2\le k\le1$일 때 $M_k$와 $m_k$는 $h(t)=0$의 서로 다른 두 근이므로 근과 계수의 관계에 의하여 $M_k+m_k=-\dfrac{2k+3}{2}$, $M_km_k=\dfrac{2k^2+3k-12}{2}$이고
        $$M_k^{\,2}+m_k^{\,2}=\dfrac{(2k+3)^2}{4}-2\times\dfrac{2k^2+3k-12}{2}=\dfrac14(-4k^2+57).$$
      criteria: ['2.M1']
    - id: 2b-4
      content: |
        따라서 $-2\le k\le1$에서 $M_k^{\,2}+m_k^{\,2}$의 최댓값은 $k=0$일 때 $\dfrac{57}{4}$, 최솟값은 $k=-2$일 때 $\dfrac{41}{4}$이므로 최댓값과 최솟값의 합은 $\dfrac{49}{2}$이다.
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    source_flow: '2026 논술가이드북(2027학년도 대비) p.53~54 다른 풀이([1-2] (ⅰ)·(ⅱ)의 다른 풀이)'
    method_no: 2
    key_idea: (ⅰ) $n(A_k)=2$이려면 $h(t)=0$이 중근을 갖거나 $k$를 근으로 가져야 한다. (ⅱ) $m_k<k<M_k$이려면 $g$가 극값을 갖는 두 $t$값 $-2,1$ 사이에 $k$가 있으면 된다.
    steps:
    - id: 2c-1
      content: |
        ($ⅰ$-1) $h(t)=0$이 중근: $\dfrac D4=(2k+3)^2-8(2k^2+3k-12)=-12k^2-12k+105=-3(2k+7)(2k-5)=0$에서 $k=-\dfrac72$ 또는 $\dfrac52$.
        ($ⅰ$-2) $h(t)=0$이 $k$를 근으로 가짐: $h(k)=6(k+2)(k-1)=0$에서 $k=-2$ 또는 $1$.
        따라서 $n(A_k)=2$인 $k$는 $-\dfrac72,-2,1,\dfrac52$이다.
      criteria: ['2.B1']
    - id: 2c-2
      content: |
        (ⅱ) $g'(t)=6t^2+6t-12$이므로 극값은 $t=1$일 때와 $t=-2$일 때 존재하고, $m_k<k<M_k$이려면 $k$가 그 사이에 있어야 하므로 $-2<k<1$이다. [그림: $y=g(t)$의 그래프에서 $t=-2$와 $t=1$ 사이 감소 구간(굵게)에 $k$가 놓이고, 직선 $y=g(k)$가 그래프와 세 점에서 만난다.]
