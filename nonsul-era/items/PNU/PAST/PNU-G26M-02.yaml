intent: |
  합성함수의 미분가능성을 조사하여 조건을 만족시키는 함수의 형태를 찾고, 주어진 함숫값이 최댓값을 가질 때 함수의 그래프와 $x$축에 평행한 직선이 만나는 점의 개수를 파악하는지 평가한다. [2-1]은 $f(\lvert g(x)\rvert)$가 미분가능하도록 하는 $b$를 찾고 $\lvert g(f(-2))\rvert$의 최댓값 $p$를, [2-2]는 $y=\lvert g(f(x))\rvert$의 개형으로 교점 개수의 극한값과 함숫값을 구하게 한다(공식 출제 의도 요약).
key_idea: |
  $\lvert g(x)\rvert$가 꺾이는 $x=-1,2$에서 $f(\lvert g\rvert)$의 좌·우 미분계수 $\mp f'(0)g'$이 같아야 하므로 $f'(0)=b=0$. 그러면 $f(x)=ax^2e^x$이고, (나)는 $f(\alpha)=-1$ 또는 $2$인 $\alpha$가 정확히 하나일 조건이 되어 극값 $4ae^{-2}$의 범위로 $a$가 정해진다. $s=4ae^{-2}$로 치환하면 $\lvert g(s)\rvert$의 최대 문제로 바뀐다.
stuck: |
  (가)에서 $f'(0)=0$을 끌어내는 좌·우 미분계수 비교, (나)에서 접하는 경우($f'(\alpha)=0$)에는 $\lvert g(f(x))\rvert$가 미분가능함을 이용해 등호를 포함시키는 판단, $x\to-\infty$에서 점근선 $y=\lvert g(0)\rvert$를 찾는 단계
