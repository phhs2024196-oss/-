stimuli:
- label: Ⅰ
  body: |
    함수 $y=f(x)$에서 $x$의 값이 $a$에서 $a+\Delta x$까지 변할 때의 평균변화율은
    $$\dfrac{\Delta y}{\Delta x}=\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$$
    이다. 여기서 $\Delta x\to0$일 때 이 평균변화율의 극한값
    $$\lim_{\Delta x\to0}\dfrac{\Delta y}{\Delta x}=\lim_{\Delta x\to0}\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$$
    가 존재하면 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다. 이때 이 극한값을 함수 $f(x)$의 $x=a$에서의 순간변화율 또는 미분계수라고 하며, 이것을 기호로 $f'(a)$와 같이 나타낸다.
- label: Ⅱ
  body: |
    함수 $f(x)$가 어떤 열린구간에 속하는 모든 $x$의 값에서 미분가능하면 함수 $f(x)$는 그 구간에서 미분가능하다고 한다.
- label: Ⅲ
  body: |
    함수 $y=f(x)$의 그래프의 개형은 다음을 조사하여 그릴 수 있다.
    (ⅰ) 함수의 정의역과 치역　(ⅱ) 곡선의 좌표축의 교점
    (ⅲ) 함수의 증가와 감소, 극대와 극소　(ⅳ) $\displaystyle\lim_{x\to\infty}f(x)$, $\displaystyle\lim_{x\to-\infty}f(x)$, 점근선

stem: |
  【문항 2】 다음 제시문을 읽고 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  두 실수 $a\,(a\ne0)$, $b$에 대하여 두 함수 $f(x)=(ax^2+bx)e^x$, $g(x)=(e^x-e^2)\left(e^x-\dfrac1e\right)$이 다음 조건을 만족시킨다.

  (가) 함수 $f(\lvert g(x)\rvert)$는 실수 전체의 집합에서 미분가능하다.

  (나) 함수 $\lvert g(f(x))\rvert$가 $x=\alpha$에서 미분가능하지 않은 실수 $\alpha$의 개수는 $1$이다.

  $\lvert g(f(-2))\rvert$의 최댓값을 $p$라 할 때, 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    [2-1] 주어진 조건을 만족시키는 모든 $a$의 값의 범위를 구하고, 이를 이용하여 $p$를 구하시오. (20점)
  points: 20
  depends_on: []
  answer: {kind: expression, value: 'a: [-exp(2)/4, 0) U (0, exp(2)/2]; p = (exp(2)/2 - exp(-1)/2)**2', equivalents: ['p = (e**2/2 - 1/(2*e))**2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (가)에서 $x=-1,2$의 좌·우 미분계수가 $\mp f'(0)g'$이므로 $b=f'(0)=0$. (나)는 $f(\alpha)=-1$ 또는 $2$인 점이 하나뿐일 조건이고 $f(x)=ax^2e^x$의 극값 $4ae^{-2}$로 $a$의 범위가 정해진다. $s=4ae^{-2}$에서 $\lvert g(s)\rvert$의 최대를 구한다.
    steps:
    - {id: 1a, content: '$b=0$, $-\tfrac{e^2}{4}\le a<0$ 또는 $0<a\le\tfrac{e^2}{2}$, $p=\left(\tfrac{e^2}{2}-\tfrac{1}{2e}\right)^2$', criteria: ['1.B1', '1.B2', '1.B3', '1.B4']}
    hint_ladder:
    - $\lvert g(x)\rvert$가 미분가능하지 않은 점에서 $f(\lvert g(x)\rvert)$의 좌·우 미분계수를 계산해 보라.
    - $\lvert g(f(x))\rvert$가 미분가능하지 않으려면 $g(f(x))=0$이고 그 점에서의 도함수가 $0$이 아니어야 한다.
    - $f(-2)=4ae^{-2}$를 하나의 변수 $s$로 보고 $s$의 범위에서 $\lvert g(s)\rvert$의 최댓값을 구하라.
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.57~58 예시답안(채점기준 및 예시답안 p.7~8)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x$에 대한 방정식 $(e^x-e^2)\left(e^x-\dfrac1e\right)=0$의 해가 $x=-1$ 또는 $x=2$이고, $g'(x)=2e^{2x}-\left(e^2+\dfrac1e\right)e^x$에 대해 $g'(-1)\ne0$, $g'(2)\ne0$이므로 함수 $\lvert g(x)\rvert$는 $x=-1$과 $x=2$에서 미분가능하지 않지만, 조건 (가)에서 $f(\lvert g(x)\rvert)$가 실수 전체의 집합에서 미분가능하므로 $f(\lvert g(x)\rvert)$는 $x=-1$과 $x=2$에서 미분가능하다.
        $f(x)$가 미분가능하고 $g(-1)=g(2)=0$이므로 $x=2$일 때
        $$\lim_{x\to2-}\dfrac{f(\lvert g(x)\rvert)-f(\lvert g(2)\rvert)}{x-2}=\lim_{x\to2-}\left(\dfrac{f(-g(x))-f(0)}{-g(x)+g(2)}\times\dfrac{-g(x)+g(2)}{x-2}\right)=f'(0)\times(-g'(2)),$$
        $$\lim_{x\to2+}\dfrac{f(\lvert g(x)\rvert)-f(\lvert g(2)\rvert)}{x-2}=\lim_{x\to2+}\left(\dfrac{f(g(x))-f(0)}{g(x)-g(2)}\times\dfrac{g(x)-g(2)}{x-2}\right)=f'(0)\times g'(2).$$
        좌극한과 우극한이 같으므로 $f'(0)=0$이다($x=-1$일 때도 같은 방법으로 $f'(0)=0$). $f'(x)=\{ax^2+(2a+b)x+b\}e^x$에서 $f'(0)=b=0$이므로 $f(x)=ax^2e^x$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        한편, $\lvert g(x)\rvert$가 $x=-1$과 $x=2$에서 미분가능하지 않고 $\lvert g(f(x))\rvert$가 $x=\alpha$에서 미분가능하지 않으므로 $f(\alpha)=-1$ 또는 $f(\alpha)=2$이다.
        (ⅰ) $f(\alpha)=-1$일 때, $\alpha^2e^\alpha>0$이므로 $a<0$이다. $f'(x)=a(x^2+2x)e^x$에서 $f'(x)=0$의 해는 $x=-2$ 또는 $x=0$이고 증감표는
        [표: $x<-2$에서 $f'<0$ 감소, $x=-2$에서 극솟값 $4ae^{-2}$, $-2<x<0$에서 증가, $x=0$에서 극댓값 $0$, $x>0$에서 감소]
        실수 전체의 집합에서 $f(x)\le0$이고 $\displaystyle\lim_{x\to-\infty}f(x)=0$, $\displaystyle\lim_{x\to\infty}f(x)=-\infty$이므로 $f(\alpha)=-1$인 양수 $\alpha$가 반드시 존재하고, 그래프 개형에서 $f(\alpha)=2$인 경우는 나타나지 않는다. 그러므로 극솟값의 범위가 $-1\le4ae^{-2}<0$이므로 $-\dfrac{e^2}{4}\le a<0$이다.
      criteria: ['1.B2']
    - id: 1b-3
      content: |
        (ⅱ) $f(\alpha)=2$일 때, $\alpha^2e^\alpha>0$이므로 $a>0$이다. 증감표는
        [표: $x<-2$에서 증가, $x=-2$에서 극댓값 $4ae^{-2}$, $-2<x<0$에서 감소, $x=0$에서 극솟값 $0$, $x>0$에서 증가]
        실수 전체의 집합에서 $f(x)\ge0$이고 $\displaystyle\lim_{x\to-\infty}f(x)=0$, $\displaystyle\lim_{x\to\infty}f(x)=\infty$이므로 $f(\alpha)=2$인 양수 $\alpha$가 반드시 존재하고, $f(\alpha)=-1$인 경우는 나타나지 않는다. 그러므로 극댓값의 범위가 $0<4ae^{-2}\le2$이므로 $0<a\le\dfrac{e^2}{2}$이다.
        (ⅰ), (ⅱ)의 $a$의 값의 범위는 $-\dfrac{e^2}{4}\le a<0$ 또는 $0<a\le\dfrac{e^2}{2}$이다.
      criteria: ['1.B3']
    - id: 1b-4
      content: |
        한편 $\lvert g(f(-2))\rvert=\left\lvert\left(e^{4ae^{-2}}-e^2\right)\left(e^{4ae^{-2}}-\dfrac1e\right)\right\rvert$ $\left(-\dfrac{e^2}{4}\le a<0\ \text{또는}\ 0<a\le\dfrac{e^2}{2}\right)$이므로 $s=f(-2)=4ae^{-2}$라 하면 함수 $g(s)=(e^s-e^2)\left(e^s-\dfrac1e\right)$ $(-1\le s<0$ 또는 $0<s\le2)$에서
        $$g'(s)=2e^{2s}-\left(e^2+\dfrac1e\right)e^s=0,\quad e^s=\dfrac{e^2}{2}+\dfrac{1}{2e}.$$
        [표: $s=-1$에서 $g=0$, $-1<s<0$에서 감소(→ $s\to0$일 때 $e+1-\tfrac1e-e^2$), $0<s<\ln\!\left(\tfrac{e^2}2+\tfrac1{2e}\right)$에서 감소, $s=\ln\!\left(\tfrac{e^2}2+\tfrac1{2e}\right)$에서 극솟값 $-\left(\tfrac{e^2}2-\tfrac1{2e}\right)^2$, 이후 증가하여 $s=2$에서 $0$]
        따라서 $\lvert g(f(-2))\rvert$는 $s=\ln\!\left(\dfrac{e^2}{2}+\dfrac{1}{2e}\right)\ (=4ae^{-2})$에서 최댓값 $p=\left(\dfrac{e^2}{2}-\dfrac{1}{2e}\right)^2$을 갖는다.
      criteria: ['1.B4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: |
        (공식: $b$의 값을 구할 수 있다) $x=2$(또는 $-1$)에서 좌·우 미분계수를 비교해 $f'(0)=0$, $b=0$을 적었다.
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 5
      evidence: |
        (공식: $f(\alpha)=-1$일 때, $a$의 값의 범위를 구할 수 있다) $-\dfrac{e^2}{4}\le a<0$을 극솟값 $4ae^{-2}\ge-1$ 근거와 함께 적었다.
      depends_on: []
      steps: [1b-2]
    - id: 1.B3
      mark_type: B
      points: 5
      evidence: |
        (공식: $f(\alpha)=2$일 때, $a$의 값의 범위를 구할 수 있다) $0<a\le\dfrac{e^2}{2}$를 극댓값 $4ae^{-2}\le2$ 근거와 함께 적었다.
      depends_on: []
      steps: [1b-3]
    - id: 1.B4
      mark_type: B
      points: 5
      evidence: |
        (공식: 최댓값 $p$를 구할 수 있다) $s=4ae^{-2}$의 범위에서 $g(s)$의 증감을 조사해 $p=\left(\dfrac{e^2}{2}-\dfrac{1}{2e}\right)^2$을 얻었다.
      depends_on: []
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [2-2] $\lvert g(f(-2))\rvert=p$일 때, 실수 $t$에 대하여 직선 $y=t$와 함수 $y=\lvert g(f(x))\rvert$의 그래프가 만나는 점의 개수를 $h(t)$라 하자. $\displaystyle\lim_{t\to p+}h(t)+\lim_{t\to p-}h(t)+h(g(0))$의 값을 구하시오. (15점)
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $(g\circ f)'(x)=g'(f(x))f'(x)=0$인 $x$는 $-2,\,0,\,\beta$이고 $g(f(-2))=g(f(\beta))=-p$, $x\to-\infty$에서 점근선 $y=g(0)<0$. 개형에서 $t$가 $p$ 바로 위면 1개, 바로 아래면 5개, $g(0)<0$이면 0개.
    steps:
    - {id: 2a, content: '$h(t)=0\,(t<0),\ 1\,(t=0\ \text{또는}\ t>p),\ 2\,(0<t<\lvert g(0)\rvert),\ 3\,(t=\lvert g(0)\rvert\ \text{또는}\ t=p),\ 5\,(\lvert g(0)\rvert<t<p)$이므로 $1+5+0=6$', criteria: ['2.B1', '2.B2', '2.B3', '2.M1', '2.A1']}
    hint_ladder:
    - $g(f(x))$의 도함수가 $0$이 되는 $x$를 $f'(x)=0$과 $g'(f(x))=0$으로 나누어 찾아라.
    - $x\to-\infty$일 때 $f(x)\to0+$이면 $g(f(x))$는 어디로 가는가?
    - $g(0)$의 부호를 확인하라.
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.58~59 예시답안(채점기준 및 예시답안 p.8~9)'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\lvert g(f(-2))\rvert=p$를 만족시키는 함수 $f(x)$는 $f(x)=ax^2e^x$, $a=\dfrac14e^2\ln\!\left(\dfrac{e^2}{2}+\dfrac{1}{2e}\right)$이다. [2-1]에서 $g'(x)=0$인 $x$에 대해 $e^x=\dfrac{e^2}{2}+\dfrac{1}{2e}$이고, $g'(f(x))f'(x)=0$에서 $f'(x)=0$ 또는 $e^{f(x)}=\dfrac{e^2}{2}+\dfrac{1}{2e}$이므로 구하는 실근은
        $$x=-2\ \text{또는}\ x=0\ \text{또는}\ f(x)=\ln\!\left(\dfrac{e^2}{2}+\dfrac{1}{2e}\right)=4ae^{-2}\ \cdots\cdots ①$$
        이다. 구간 $(-\infty,-2]\cup[0,\infty)$에서 $f(x)$는 증가하고 구간 $[-2,0]$에서 감소하므로 ①을 만족시키는 $x$의 값을 $\beta\,(\beta>0)$라 하면 $f(\beta)=f(-2)=4ae^{-2}$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        $g(f(-2))=g(f(\beta))=-p$이므로 함수 $g(f(x))$의 증감표는 다음과 같다.
        [표: $x<-2$ 감소, $x=-2$에서 $-p$, $-2<x<0$ 증가, $x=0$에서 $g(0)$, $0<x<\beta$ 감소, $x=\beta$에서 $-p$, $x>\beta$ 증가]
      criteria: ['2.B2']
    - id: 2b-3
      content: |
        $x\to-\infty$일 때 $f(x)\to0+$이고, 실수 전체의 집합에서 함수 $g(x)$는 연속이므로
        $$\lim_{x\to-\infty}g(f(x))=\lim_{s\to0+}g(s)=g(0)=(1-e^2)\left(1-\dfrac1e\right)<0.$$
        따라서 직선 $y=g(0)$이 $y=g(f(x))$의 점근선이다.
      criteria: ['2.B3']
    - id: 2b-4
      content: |
        위의 증감표에 따라 함수 $\lvert g(f(x))\rvert$의 그래프의 개형은 [그림: 왼쪽에서 점근선 $y=\lvert g(0)\rvert$ 위쪽에서 시작해 $x=-2$에서 최대 $p$, $x=0$에서 $\lvert g(0)\rvert$로 내려왔다가 $x=\beta$에서 다시 $p$, $x=\alpha$에서 $0$에 닿은 뒤 한없이 증가] 와 같으므로
        $$h(t)=\begin{cases}0 & (t<0)\\ 1 & (t=0\ \text{또는}\ t>p)\\ 2 & (0<t<\lvert g(0)\rvert)\\ 3 & (t=\lvert g(0)\rvert\ \text{또는}\ t=p)\\ 5 & (\lvert g(0)\rvert<t<p)\end{cases}$$
        이다.
      criteria: ['2.M1']
    - id: 2b-5
      content: |
        따라서 $\displaystyle\lim_{t\to p+}h(t)+\lim_{t\to p-}h(t)+h(g(0))=1+5+0=6$이다.
      criteria: ['2.A1']
