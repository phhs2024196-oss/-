intent: |
  정육면체 안의 두 평면이 이루는 각과, 정사영이 특정 조건을 만족시키기 위한 점의 위치를 파악하는지 평가한다. [3-1]은 도형을 확장하거나 평행이동하여 이면각의 크기를, [3-2]는 정사영 조건을 만족시키는 점의 위치를 닮음비와 코사인법칙으로 구하게 한다(공식 출제 의도 요약).
key_idea: |
  육각형 $\mathrm{IJKLMN}$을 넓혀 정삼각뿔 $\mathrm{A-STU}$(옆면 직각이등변삼각형, $\overline{\mathrm{AS}}=\overline{\mathrm{AT}}=\overline{\mathrm{AU}}=7$)의 밑면 $\mathrm{STU}$로 보고, 이와 평행한 평면 $\mathrm{BDE}$로 옮겨 이면각을 잰다. 정사영 $\mathrm{P'Q'R'}$은 무게중심 $\mathrm{A'}$에 대해 $\mathrm{A'U}$, $\mathrm{A'S}$, $\mathrm{A'T}$ 위에 놓이므로, 넓이 최대는 $\mathrm{Q'}$이 $\mathrm{KL}$ 위 또는 $\mathrm{R'}$이 $\mathrm{LN}$ 위일 때이다.
stuck: |
  육각형 평면을 정삼각뿔의 밑면으로 확장하는 발상, 그리고 [3-2]에서 두 경계 조건 중 실제로 먼저 걸리는 것이 $\mathrm{R'}\in\mathrm{LN}$임을 판단하는 단계
