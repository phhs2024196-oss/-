stimuli:
- label: Ⅰ
  body: |
    직선 $l$ 위의 한 점 $\mathrm{O}$를 지나고 $l$에 수직인 두 반직선 $\mathrm{OA}$, $\mathrm{OB}$를 두 반평면 $\alpha$, $\beta$ 위에 각각 그을 때, $\angle\mathrm{AOB}$의 크기는 점 $\mathrm{O}$의 위치에 관계없이 일정하다. 이 각의 크기를 이면각의 크기라 한다. 서로 다른 두 평면이 만나서 생기는 이면각 중에서 그 크기가 크지 않은 쪽의 각을 두 평면이 이루는 각이라 한다.
    [그림: 모서리 $l$을 공유하는 두 반평면 $\alpha$(아래), $\beta$(위). $l$ 위의 점 $\mathrm{O}$에서 $l$에 수직으로 $\alpha$ 위에 반직선 $\mathrm{OA}$, $\beta$ 위에 반직선 $\mathrm{OB}$를 그었고 $\mathrm{O}$에 직각 표시가 있다.]
- label: Ⅱ
  body: |
    삼각형 $\mathrm{ABC}$의 세 변의 길이가 $a$, $b$, $c$일 때 다음이 성립한다.
    $$a^2=b^2+c^2-2bc\cos A$$
    $$b^2=c^2+a^2-2ca\cos B$$
    $$c^2=a^2+b^2-2ab\cos C$$
    [그림: 삼각형 $\mathrm{ABC}$와 외접원(점선). 변 $\mathrm{BC}=a$, $\mathrm{CA}=b$, $\mathrm{AB}=c$로 표시.]

stem: |
  【문항 3】 다음 제시문을 읽고 아래 논제의 풀이 과정과 답을 논리적으로 서술하시오.

  한 변의 길이가 $4$인 정육면체 $\mathrm{ABCD-EFGH}$가 있다. 여섯 개의 선분 $\mathrm{CD}$, $\mathrm{HD}$, $\mathrm{HE}$, $\mathrm{FE}$, $\mathrm{FB}$, $\mathrm{CB}$를 $1:3$으로 내분하는 점을 각각 $\mathrm{I}$, $\mathrm{J}$, $\mathrm{K}$, $\mathrm{L}$, $\mathrm{M}$, $\mathrm{N}$이라 하자. 세 점 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$은 각각 세 선분 $\mathrm{AD}$, $\mathrm{AE}$, $\mathrm{AB}$ 위의 점이고, 세 선분 $\mathrm{AP}$, $\mathrm{AQ}$, $\mathrm{AR}$의 길이의 비가 $1:3:3$일 때, 다음 물음에 답하시오.

  [그림: 윗면 $\mathrm{ABCD}$(앞 왼쪽 $\mathrm{A}$, 앞 오른쪽 $\mathrm{B}$, 뒤 오른쪽 $\mathrm{C}$, 뒤 왼쪽 $\mathrm{D}$), 아랫면 $\mathrm{EFGH}$($\mathrm{E,F,G,H}$가 각각 $\mathrm{A,B,C,D}$ 아래)인 정육면체. 꼭짓점 $\mathrm{A}$ 근처에 $\mathrm{AD}$ 위의 $\mathrm{P}$, $\mathrm{AE}$ 위의 $\mathrm{Q}$, $\mathrm{AB}$ 위의 $\mathrm{R}$로 만든 작은 삼각형 $\mathrm{PQR}$이 음영으로, 정육면체를 비스듬히 자르는 육각형 $\mathrm{IJKLMN}$($\mathrm{I}$는 $\mathrm{CD}$ 위 $\mathrm{C}$ 가까이, $\mathrm{J}$는 $\mathrm{HD}$ 위 $\mathrm{H}$ 가까이, $\mathrm{K}$는 $\mathrm{HE}$ 위 $\mathrm{H}$ 가까이, $\mathrm{L}$은 $\mathrm{FE}$ 위 $\mathrm{F}$ 가까이, $\mathrm{M}$은 $\mathrm{FB}$ 위 $\mathrm{F}$ 가까이, $\mathrm{N}$은 $\mathrm{CB}$ 위 $\mathrm{C}$ 가까이)이 그려져 있고, 그중 사각형 $\mathrm{IKLN}$ 부분이 음영으로 표시되어 있다.]

subparts:
- id: '1'
  stem: |
    [3-1] 평면 $\mathrm{PQR}$과 평면 $\mathrm{IJKLMN}$이 이루는 각의 크기를 $\theta$라 할 때, $\cos\theta$의 값을 구하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '5*sqrt(33)/33', equivalents: ['5/sqrt(33)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 육각형 평면은 평면 $\mathrm{BDE}$와 평행하고, 평면 $\mathrm{PQR}$는 $\mathrm{Q=E}$, $\mathrm{R=B}$, $\mathrm{AP}=\tfrac43$일 때의 평면과 평행하다. $\mathrm{QR}$의 중점 $\mathrm{V}$에서 $\angle\mathrm{PVD}$가 이면각이다.
    steps:
    - {id: 1a, content: '$\overline{\mathrm{PD}}=\tfrac83$, $\overline{\mathrm{DV}}=2\sqrt6$, $\overline{\mathrm{PV}}=\tfrac{2\sqrt{22}}3$, 코사인법칙으로 $\cos\theta=\tfrac{5\sqrt{33}}{33}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 육각형 $\mathrm{IJKLMN}$과 평행한, 정육면체의 꼭짓점 세 개로 된 평면은?
    - 평면 $\mathrm{PQR}$을 평행이동해도 이루는 각은 같다. $\mathrm{Q}$, $\mathrm{R}$을 꼭짓점으로 옮겨 보라.
  - id: S1-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.62~63 예시답안(채점기준 및 예시답안 p.11~12)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직선 $\mathrm{NI}$와 두 직선 $\mathrm{AB}$, $\mathrm{AD}$의 교점을 각각 $\mathrm{S}$, $\mathrm{T}$라 하자. 또한 두 직선 $\mathrm{SL}$과 $\mathrm{TK}$가 만나는 점을 $\mathrm{U}$라 하면 $\overline{\mathrm{AS}}=\overline{\mathrm{AT}}=\overline{\mathrm{AU}}=7$이다. 이때 사각뿔[원문 표기, 삼각뿔] $\mathrm{A-STU}$의 밑면은 한 변의 길이가 $7\sqrt2$인 정삼각형이고, 옆면은 직각이등변삼각형이다.
        사각형 $\mathrm{KLNI}$은 삼각형 $\mathrm{STU}$에 포함되므로 두 평면 $\mathrm{PQR}$과 $\mathrm{KLNI}$가 이루는 각은 두 평면 $\mathrm{PQR}$과 $\mathrm{STU}$가 이루는 각과 같다. 또한 두 평면 $\mathrm{STU}$와 $\mathrm{BDE}$는 서로 평행하고, $\overline{\mathrm{AP}}:\overline{\mathrm{AQ}}:\overline{\mathrm{AR}}=1:3:3$인 조건만 만족하면 되므로 두 점 $\mathrm{R}$, $\mathrm{Q}$가 각각 $\mathrm{B}$, $\mathrm{E}$일 때, 두 평면 $\mathrm{PQR}$과 $\mathrm{DEB}$가 이루는 각을 구하면 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        선분 $\mathrm{QR}$의 중점을 $\mathrm{V}$라 하면 삼각형 $\mathrm{PQR}$과 삼각형 $\mathrm{DEB}$가 모두 이등변삼각형이므로 이면각의 정의에 의하여 두 선분 $\mathrm{PV}$와 $\mathrm{DV}$가 이루는 각의 크기가 $\theta$이다.
        이때 $\overline{\mathrm{AP}}=\dfrac43$이므로 $\overline{\mathrm{PD}}=\dfrac83$이고, 삼각형 $\mathrm{BDE}$는 한 변의 길이가 $4\sqrt2$인 정삼각형이므로 $\overline{\mathrm{DV}}=2\sqrt6$이다. 또한 삼각형 $\mathrm{PAV}$는 직각삼각형이고 $\overline{\mathrm{AV}}=2\sqrt2$이므로 $\overline{\mathrm{PV}}=\dfrac{2\sqrt{22}}{3}$이다.
        따라서 삼각형 $\mathrm{PVD}$에서 코사인법칙에 의하여
        $$\cos\theta=\dfrac{24+\dfrac{88}{9}-\dfrac{64}{9}}{2\times2\sqrt6\times\dfrac{2\sqrt{22}}{3}}=\dfrac{5}{\sqrt{33}}=\dfrac{5\sqrt{33}}{33}.$$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        (공식: 이면각 $\theta$를 찾기 위해 평면 $\mathrm{IJKLMN}$과 평행한 평면을 찾을 수 있다) 평면 $\mathrm{STU}$(또는 $\mathrm{BDE}$)가 육각형 평면과 평행함을 적고 평면 $\mathrm{PQR}$을 $\mathrm{Q=E}$, $\mathrm{R=B}$인 경우로 옮겼다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        (공식: 코사인법칙 등을 이용하여 $\cos\theta$의 값을 구할 수 있다) $\cos\theta=\dfrac{5\sqrt{33}}{33}$을 적었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [3-2] 삼각형 $\mathrm{PQR}$의 평면 $\mathrm{IJKLMN}$ 위로의 정사영이 사각형 $\mathrm{IKLN}$의 내부 또는 그 경계에 포함될 때, 이 정사영의 넓이가 최대가 되도록 하는 점 $\mathrm{P}$에 대하여 선분 $\mathrm{AP}$의 길이를 구하시오. (20점)
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: '13/21', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{AP}=k$가 클수록 정사영이 커진다. 무게중심 $\mathrm{A'}$에서 $\mathrm{Q'}$, $\mathrm{R'}$까지의 거리는 $\sqrt6k$이므로 $\mathrm{Q'}\in\mathrm{KL}$이면 $k=\tfrac56$, $\mathrm{R'}\in\mathrm{LN}$이면 $k=\tfrac{13}{21}$이고 더 작은 쪽이 먼저 걸린다.
    steps:
    - {id: 2a, content: '(ⅰ) $k=\tfrac56$, (ⅱ) $k=\tfrac{13}{21}$; (ⅰ)에서는 $\mathrm{R''}$이 사각형 밖이므로 $\overline{\mathrm{AP}}=\tfrac{13}{21}$', criteria: ['2.M1', '2.M3', '2.A1', '2.B2', '2.M2', '2.A2']}
    hint_ladder:
    - 점 $\mathrm{A}$에서 평면 $\mathrm{STU}$에 내린 수선의 발은 정삼각형 $\mathrm{STU}$의 어떤 점인가?
    - 정사영 $\mathrm{P'Q'R'}$의 세 꼭짓점은 $\mathrm{A'}$에서 각각 어느 꼭짓점 쪽으로 놓이는가?
    - 경계에 닿는 두 경우를 모두 계산하고 둘 다 만족하는 쪽을 고르라.
  - id: S2-B
    audience: B
    source_flow: '2026 논술가이드북(2027학년도 대비) p.63 예시답안 및 채점기준 및 예시답안 p.12~13((ⅱ)는 원본 채점기준 자료에만 있음)'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{A}$에서 삼각형 $\mathrm{STU}$에 내린 수선의 발을 $\mathrm{A'}$이라 하면, 점 $\mathrm{A'}$은 삼각형 $\mathrm{STU}$의 무게중심이다. 이때 삼각형 $\mathrm{PQR}$의 평면 $\mathrm{STU}$ 위로의 정사영을 삼각형 $\mathrm{P'Q'R'}$이라 하면, $\mathrm{Q'}$과 $\mathrm{R'}$은 각각 선분 $\mathrm{A'U}$와 $\mathrm{A'S}$ 위에 위치하며 $\mathrm{A'}$ 사이의 거리가 서로 같다. 또한 $\mathrm{P'}$은 선분 $\mathrm{A'T}$ 위에 위치하며, $\mathrm{A'P'}:\mathrm{A'R'}=1:3$이므로, 조건을 만족하는 삼각형 $\mathrm{PQR}$의 정사영의 넓이가 최대일 때는 선분 $\mathrm{Q'R'}$의 점 $\mathrm{Q'}$이 선분 $\mathrm{KL}$ 위의 점일 때 또는 점 $\mathrm{R'}$이 선분 $\mathrm{LN}$ 위의 점일 때이다.
        [그림: 왼쪽은 삼각뿔 $\mathrm{A-UST}$ 안의 삼각형 $\mathrm{PQR}$과 밑면 위 정사영 $\mathrm{P'Q'R'}$, 사각형 $\mathrm{KLNI}$(파란 선). 오른쪽은 정삼각형 $\mathrm{UST}$ 안에 사각형 $\mathrm{KLNI}$와 무게중심 $\mathrm{A'}$, 작은 삼각형 $\mathrm{P'Q'R'}$.]
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        (ⅰ) 점 $\mathrm{Q'}$이 선분 $\mathrm{KL}$ 위에 있을 때: 직선 $\mathrm{KL}$과 직선 $\mathrm{UA'}$이 수직으로 만나므로 점 $\mathrm{Q}$와 선분 $\mathrm{AA'}$ 사이의 거리는 점 $\mathrm{A'}$과 직선 $\mathrm{KL}$ 사이의 거리와 같다.
        $\overline{\mathrm{UA'}}=7\sqrt2\times\dfrac{\sqrt3}{2}\times\dfrac23=\dfrac{7\sqrt6}{3}$이고, 점 $\mathrm{U}$와 직선 $\mathrm{KL}$ 사이의 거리는 삼각형 $\mathrm{ULK}$가 정삼각형이므로 $3\sqrt2\times\dfrac{\sqrt3}{2}=\dfrac{3\sqrt6}{2}$이다. 그러므로 점 $\mathrm{A'}$과 직선 $\mathrm{KL}$ 사이의 거리는 $\dfrac{7\sqrt6}{3}-\dfrac{3\sqrt6}{2}=\dfrac{5\sqrt6}{6}$이다. $\cdots\cdots①$
      criteria: ['2.M3']
    - id: 2b-3
      content: |
        이때 $\overline{\mathrm{AP}}=k$라 하면 $\overline{\mathrm{AQ}}=3k$이고, 점 $\mathrm{Q}$에서 선분 $\mathrm{AA'}$에 내린 수선의 발을 $\mathrm{Q''}$이라 하면 삼각형 $\mathrm{AQQ''}$은 삼각형 $\mathrm{AUA'}$과 닮음이다. $\overline{\mathrm{AU}}:\overline{\mathrm{UA'}}=7:\dfrac{7\sqrt6}{3}=3:\sqrt6$이므로 $\overline{\mathrm{AQ}}:\overline{\mathrm{QQ''}}=3k:\sqrt6k$, 즉 $\overline{\mathrm{QQ''}}=\sqrt6k$이다. $\cdots\cdots②$
        ①, ②에 의하여 $\overline{\mathrm{QQ''}}=\sqrt6k=\dfrac{5\sqrt6}{6}$이므로 $k=\dfrac56$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        (ⅱ) 점 $\mathrm{R'}$이 선분 $\mathrm{LN}$ 위에 있을 때: 점 $\mathrm{R'}$은 선분 $\mathrm{SA'}$과 선분 $\mathrm{LN}$의 교점이 된다.
        [그림: 삼각형 $\mathrm{NSL}$, $\overline{\mathrm{SN}}=3\sqrt2$, $\overline{\mathrm{SL}}=4\sqrt2$, $\mathrm{R'}$은 $\mathrm{NL}$ 위, $\mathrm{SR'}$은 $\angle\mathrm{NSL}$의 이등분선]
        선분 $\mathrm{SR'}$은 각 $\mathrm{NSL}$의 이등분선이므로 $\overline{\mathrm{NR'}}:\overline{\mathrm{R'L}}=3:4$이다. 또한 $\overline{\mathrm{LF}}=1$, $\overline{\mathrm{FB}}=4$, $\overline{\mathrm{BN}}=3$이므로 피타고라스 정리에 의하여 $\overline{\mathrm{NL}}=\sqrt{1+16+9}=\sqrt{26}$이다.
      criteria: ['2.B2']
    - id: 2b-5
      content: |
        그러므로 두 삼각형 $\mathrm{NSR'}$과 $\mathrm{LSR'}$에서 코사인법칙에 의하여
        $$\dfrac{18+\overline{\mathrm{SR'}}^2-\left(\dfrac{3\sqrt{26}}{7}\right)^2}{2\times3\sqrt2\times\overline{\mathrm{SR'}}}=\dfrac{32+\overline{\mathrm{SR'}}^2-\left(\dfrac{4\sqrt{26}}{7}\right)^2}{2\times4\sqrt2\times\overline{\mathrm{SR'}}}$$
        $$72+4\overline{\mathrm{SR'}}^2-4\times\dfrac{9}{49}\times26=96+3\overline{\mathrm{SR'}}^2-3\times\dfrac{16}{49}\times26,\quad \overline{\mathrm{SR'}}=\dfrac{12\sqrt6}{7}.$$
        그러므로 $\overline{\mathrm{A'R'}}=\dfrac{7\sqrt6}{3}-\dfrac{12\sqrt6}{7}=\dfrac{13}{21}\sqrt6$이다. $\cdots\cdots③$
        이때 점 $\mathrm{R}$에서 직선 $\mathrm{AA'}$에 이르는 거리와 점 $\mathrm{Q}$에서 직선 $\mathrm{AA'}$에 이르는 거리는 같으므로 ②, ③에 의하여 $k=\dfrac{13}{21}$이다.
      criteria: ['2.M2']
    - id: 2b-6
      content: |
        (ⅰ)이 성립하는 경우, (ⅱ)에 의하여 삼각형 $\mathrm{PQR}$의 평면 $\mathrm{IJKLMN}$ 위로의 정사영이 사각형 $\mathrm{KLNI}$을 벗어나므로, 주어진 조건을 만족시키며 정사영의 넓이가 최대가 되게 하는 경우는 (ⅱ)가 된다. 따라서 조건을 만족시키는 선분 $\mathrm{AP}$의 길이는 $\dfrac{13}{21}$이다.
      criteria: ['2.A2']
  - id: S2-ALT
    audience: ALT
    source_flow: '채점기준 및 예시답안 p.13~14 다른 풀이((ⅰ)과 (ⅱ)의 다른 풀이, 좌표평면)'
    method_no: 2
    key_idea: 점 $\mathrm{L}$을 원점, 직선 $\mathrm{US}$를 $x$축으로 하는 좌표평면에서 직선의 교점으로 $\mathrm{Q'}$, $\mathrm{R'}$을 구하고, 닮음비 $\overline{\mathrm{Q'R'}}=3\sqrt2k$로 $k$를 얻는다.
    steps:
    - id: 2c-1
      content: |
        (ⅰ) $\mathrm{K}\left(-\dfrac{3\sqrt2}{2},\dfrac{3\sqrt6}{2}\right)$이므로 직선 $\mathrm{KL}$은 $y=-\sqrt3x$, 직선 $\mathrm{UA'}$은 $y=\dfrac{1}{\sqrt3}(x+3\sqrt2)$이고 교점 $\mathrm{Q'}\left(-\dfrac{3\sqrt2}{4},\dfrac{3\sqrt6}{4}\right)$이다. 삼각형의 닮음비를 이용하면 $\dfrac{\overline{\mathrm{Q'R'}}}{2}:\dfrac{7\sqrt2}{2}=\left(\dfrac{7}{\sqrt6}-\dfrac{3\sqrt6}{4}\right):\dfrac{7}{\sqrt6}$에서 $\overline{\mathrm{Q'R'}}=\dfrac{5\sqrt2}{2}$이다. $\overline{\mathrm{Q'R'}}=\overline{\mathrm{QR}}=3\sqrt2k$이므로 $k=\dfrac56$이다.
      criteria: ['2.M3', '2.A1']
    - id: 2c-2
      content: |
        (ⅱ) $\mathrm{N}\left(\dfrac{5\sqrt2}{2},\dfrac{3\sqrt6}{2}\right)$이므로 직선 $\mathrm{LN}$은 $y=\dfrac{3\sqrt3}{5}x$, 직선 $\mathrm{SA'}$은 $y=-\dfrac{1}{\sqrt3}(x-4\sqrt2)$이고 교점 $\mathrm{R'}\left(\dfrac{10\sqrt2}{7},\dfrac{6\sqrt6}{7}\right)$이다. (ⅰ)과 같이 닮음비를 이용하면 $\overline{\mathrm{Q'R'}}=\dfrac{13\sqrt2}{7}$이므로 $k=\dfrac{13}{21}$이다.
      criteria: ['2.B2', '2.M2']
