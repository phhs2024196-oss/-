intent: |
  함수의 증가·감소의 뜻과 도함수를 이용한 판정, 사잇값 정리, 역함수와 삼각함수의 기본 성질을 이해하고 이를 이용해 부등식을 증명할 수 있는지를 평가한다(공식 출제의도 요지).
key_idea: |
  $f'(x)=1-\cos x>0$로 증가성을 보이고, 사잇값 정리와 증가성으로 역함수 $g$를 정의한 뒤, $f$가 홀함수이므로 $g$도 홀함수이고, $\lvert g(y)\rvert^3\ge6\lvert y\rvert$는 $x=g(y)$로 놓아 $x^3\ge6(x-\sin x)$로 바꾼다.
stuck: |
  역함수에 대한 부등식을 원래 함수 $f$에 대한 부등식 $t^3>6(t-\sin t)$로 바꾸고, 보조함수 $h(t)=\dfrac{t^3}{6}-t+\sin t$를 두 번 미분하는 발상
