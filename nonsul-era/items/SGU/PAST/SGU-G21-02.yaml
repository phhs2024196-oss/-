  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 【2-2】의 값을 $k=2,4,\dots,n-4$에 대해 더하면 $\sum_{i=1}^{m-2}{}_{2i}\mathrm{C}_2$($n=2m$)이고 【2-1】의 합 공식으로 계산한 뒤 【2-3】으로 나눈다.
    steps:
    - {id: 4a, content: '$\dfrac{(n-4)(n-2)(2n-9)/24}{(n-2)(n-3)(n-4)/6}=\dfrac{2n-9}{4(n-3)}$', criteria: ['4.M1', '4.A1', '4.A2']}
    hint_ladder:
    - 가장 작은 수가 $k$인 경우의 수는 이미 【2-2】에서 구했다.
    - 짝수 $k$에 대한 합이 【2-1】의 합과 같은 꼴임을 보자.
  - id: S4-B
    audience: B
    source_flow: '논술가이드북2022 p.59 답안사례 (PDF 30쪽)'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        문항 【2-2】의 풀이에서 연속인 두 수가 포함되지 않고 가장 작은 수가 $k$가 되도록 서로 다른 세 수를 택하는 방법의 수는 ${}_{n-k-2}\mathrm{C}_2$임을 보였다. $k=2,\,4,\,\cdots,\,n-4$에 대하여 이 값을 모두 더하면 연속인 두 수가 포함되지 않고 가장 작은 수가 짝수가 되도록 서로 다른 세 수를 택하는 방법의 수를 구할 수 있다. $n=2m$이라고 놓으면 구하는 방법의 수는
        $$ {}_2\mathrm{C}_2+{}_4\mathrm{C}_2+\cdots+{}_{n-6}\mathrm{C}_2+{}_{n-4}\mathrm{C}_2=\sum_{i=1}^{m-2}{}_{2i}\mathrm{C}_2 $$
        이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        $m'=m-3$이라고 치환하면 $\displaystyle\sum_{i=1}^{m-2}{}_{2i}\mathrm{C}_2=\sum_{i=1}^{m'+1}{}_{2i}\mathrm{C}_2$이므로 【2-1】의 풀이에 의하여 이 값은
        $$ \dfrac{(m'+1)(m'+2)(4m'+3)}{6}=\dfrac{(m-2)(m-1)(4m-9)}{6}=\dfrac{(n-4)(n-2)(2n-9)}{24} $$
      criteria: ['4.A1']
    - id: 4b-3
      content: |
        【2-3】의 결과를 이용하면 구하는 조건부 확률은
        $$ \dfrac{\dfrac{(n-2)(n-4)(2n-9)}{24}}{\dfrac{(n-2)(n-3)(n-4)}{6}}=\dfrac{2n-9}{4(n-3)} $$
      criteria: ['4.A2']
