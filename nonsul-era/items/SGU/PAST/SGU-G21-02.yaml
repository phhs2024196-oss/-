stimuli:
- label: 가
  body: |
    서로 다른 $n$개에서 순서를 생각하지 않고 서로 다른 $r\ (1\le r\le n)$개를 택하는 것을 $n$개에서 $r$개를 택하는 조합이라 하고, 이 조합의 수를 ${}_n\mathrm{C}_r$로 나타낸다. 각각의 조합에 대하여 $r$개를 일렬로 나열하는 순열의 수는 $r!$이므로, ${}_n\mathrm{C}_r\times r!$은 서로 다른 $n$개에서 $r$개를 택하는 순열의 수와 같고 이를 이용하면
    $$ {}_n\mathrm{C}_r=\dfrac{n!}{r!\,(n-r)!} $$
    을 얻을 수 있다. 이때 위의 등식이 $r=0$일 때도 성립하도록 ${}_n\mathrm{C}_0=1$로 정한다.
- label: 나
  body: |
    서로 다른 $n$개에서 중복을 허용하여 $r$개를 택하는 것을 중복조합이라 하고, 이 중복조합의 수를 ${}_n\mathrm{H}_r$로 나타낸다. 서로 다른 $2$개의 숫자 $1,\,2$에서 중복을 허용하여 $3$개를 택하는 경우는 $111,\,112,\,122,\,222$이므로 ${}_2\mathrm{H}_3=4$이다. 이 경우의 수를 조합의 수로 나타내기 위하여 각 경우의 첫 번째, 두 번째, 세 번째 수가 중복되지 않도록 연속인 세 수 $0,\,1,\,2$를 각각 더하면 $123,\,124,\,134,\,234$이다. 이것은 서로 다른 $4$개의 숫자 $1,\,2,\,3,\,4$에서 중복을 허용하지 않고 $3$개를 택하는 모든 조합이므로 ${}_2\mathrm{H}_3={}_4\mathrm{C}_3={}_{2+3-1}\mathrm{C}_3$임을 알 수 있다. 일반적으로 ${}_n\mathrm{H}_r$는 서로 다른 $(n+r-1)$개에서 $r$개를 택하는 조합의 수 ${}_{n+r-1}\mathrm{C}_r$와 같다.
- label: 다
  body: |
    서로 다른 $n$개에서 $r$개를 택하는 중복조합의 수 ${}_n\mathrm{H}_r$는 방정식
    $$ x_1+x_2+\cdots+x_n=r $$
    의 음이 아닌 정수해의 개수와 같다.

stem: |
  제시문 [가], [나], [다]를 참고하여 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【2-1】 $m$이 자연수일 때, 방정식 $2x+y+z+w=2m$의 음이 아닌 정수해의 개수를 구하시오.
  points: 120
  depends_on: []
  answer: {kind: expression, value: '(m+1)*(m+2)*(4*m+3)/6', equivalents: ['Sum(binomial(2*i,2),(i,1,m+1))'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=i$로 고정하면 ${}_3\mathrm{H}_{2m-2i}={}_{2m-2i+2}\mathrm{C}_2$이고, 이를 $i=0,\dots,m$에 대해 더한다.
    steps:
    - {id: 1a, content: '$\displaystyle\sum_{i=1}^{m+1}{}_{2i}\mathrm{C}_2=\sum_{i=1}^{m+1}(2i^2-i)=\dfrac{(m+1)(m+2)(4m+3)}{6}$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 계수가 $2$인 $x$의 값을 먼저 정해 보자.
    - 나머지 세 변수의 방정식은 제시문 [다]로 센다.
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2022 p.58 답안사례 (PDF 30쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        먼저 $x$의 값을 정하자. $x=i\ (0\le i\le m)$일 때, 방정식 $y+z+w=2m-2i$의 음이 아닌 정수해의 개수는 제시문 [다]에 의해 ${}_3\mathrm{H}_{2m-2i}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        제시문 [나]에 의해 ${}_3\mathrm{H}_{2m-2i}={}_{3+(2m-2i)-1}\mathrm{C}_{2m-2i}={}_{2m-2i+2}\mathrm{C}_2$이므로, 구하는 정수해의 개수는
        $$ {}_{2m+2}\mathrm{C}_2+{}_{2m}\mathrm{C}_2+\cdots+{}_4\mathrm{C}_2+{}_2\mathrm{C}_2=\sum_{i=1}^{m+1}{}_{2i}\mathrm{C}_2 $$
        이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        등식 ${}_{2i}\mathrm{C}_2=\dfrac{2i(2i-1)}{2}$을 이용하면 위 합은
        $$ \sum_{i=1}^{m+1}(2i^2-i)=\dfrac{2(m+1)(m+2)(2m+3)}{6}-\dfrac{(m+1)(m+2)}{2}=\dfrac{(m+1)(m+2)(4m+3)}{6} $$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 40
      evidence: |
        $x=i$일 때 주어진 방정식의 음이 아닌 정수해의 개수가 중복조합의 수 ${}_3\mathrm{H}_{2m-2i}$임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 40
      evidence: |
        구하는 답을 중복조합(조합)의 합 $\sum_{i=1}^{m+1}{}_{2i}\mathrm{C}_2$ 등으로 올바르게 표현했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 40
      evidence: |
        합을 정확하게 계산하여 $\dfrac{(m+1)(m+2)(4m+3)}{6}$을 얻었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $n\ge5$인 자연수 $n$에 대하여 $1$부터 $n$까지의 자연수에서 서로 다른 세 수를 택하려고 한다. 문항 【2-2】, 【2-3】, 【2-4】에 답하시오.

    【2-2】 $k$가 $1\le k\le n-4$인 자연수라고 하자. 연속인 두 수가 포함되지 않고 가장 작은 수가 $k$가 되도록 서로 다른 세 수를 택하는 방법의 수를 구하시오. (단, 연속인 두 수란 $a,\,a+1$꼴의 두 정수를 말한다.)
  points: 120
  depends_on: []
  answer: {kind: expression, value: 'binomial(n-k-2,2)', equivalents: ['(n-k-2)*(n-k-3)/2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $k$를 고정하면 $k+2,\dots,n$에서 연속이 아닌 두 수를 택하는 수이고, 이는 $1$부터 $n-k-3$까지의 중복조합 ${}_{n-k-3}\mathrm{H}_2$와 대응한다.
    steps:
    - {id: 2a, content: '${}_{n-k-3}\mathrm{H}_2={}_{n-k-2}\mathrm{C}_2$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $k$를 뽑은 뒤 남은 두 수는 어느 범위에서 고르는가?
    - 제시문 [나]처럼 $0,\,2$를 더하는 대응을 생각하자.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2022 p.58~59 답안사례 (PDF 30쪽)'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        연속인 두 수가 포함되지 않고 가장 작은 수가 $k$가 되도록 세 수를 택하려면, 먼저 $k$를 뽑고 $k+2$부터 $n$까지의 $(n-k-1)$개의 자연수에서 연속이 아닌 서로 다른 두 수를 택하면 된다. 이렇게 택하는 방법의 수는 $1$부터 $(n-k-1)$까지의 자연수에서 연속이 아닌 서로 다른 두 수를 택하는 방법의 수와 같은 것은 자명하다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $1$부터 $(n-k-1)$까지의 자연수에서 연속이 아닌 서로 다른 두 수는 제시문 [나]의 중복조합을 조합으로 변환시키는 방법을 활용하여 쉽게 구할 수 있다. $1$부터 $(n-k-3)$까지의 자연수에서 중복조합 $i,\,j\ (1\le i\le j\le n-k-3)$를 택하는 경우, 연속이 아닌 두 수의 조합으로 나타내기 위하여 첫 번째와 두 번째 수에 각각 $0,\,2$를 더하면 $i,\,(j+2)$를 얻는다. 이것은 $1$부터 $(n-k-1)$까지의 자연수에서 연속이 아닌 두 수를 택한 조합이다. $1$부터 $(n-k-1)$까지의 자연수에서 연속이 아닌 서로 다른 두 수는 모두 이와 같은 방식으로 얻을 수 있다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        그러므로 구하는 방법의 수는 ${}_{n-k-3}\mathrm{H}_2={}_{n-k-2}\mathrm{C}_2$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 40
      evidence: |
        구하는 방법의 수가 $1$부터 $(n-k-1)$까지의 자연수에서 연속이 아닌 서로 다른 두 수를 택하는 조합의 수와 같다고 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 40
      evidence: |
        이 조합의 수가 $1$부터 $(n-k-3)$까지의 자연수에서 $2$개를 택하는 중복조합의 수와 같음을 대응($0,\,2$를 더함)으로 설명했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 40
      evidence: |
        ${}_{n-k-3}\mathrm{H}_2={}_{n-k-2}\mathrm{C}_2$를 정확하게 계산했다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    【2-3】 연속인 두 수가 포함되지 않도록 서로 다른 세 수를 택하는 방법의 수를 구하시오.
  points: 120
  depends_on: ['2']
  answer: {kind: expression, value: 'binomial(n-2,3)', equivalents: ['(n-2)*(n-3)*(n-4)/6'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $1\le a\le b\le c\le n-4$인 중복조합에 $0,2,4$를 더하면 연속하지 않는 세 수와 일대일대응. (또는 【2-2】를 $k$에 대해 합하여 $\sum_{k=1}^{n-4}{}_{n-k-2}\mathrm{C}_2=\sum_{k=2}^{n-3}{}_k\mathrm{C}_2$)
    steps:
    - {id: 3a, content: '${}_{n-4}\mathrm{H}_3={}_{n-2}\mathrm{C}_3$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 【2-2】의 대응을 세 수로 확장해 보자.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2022 p.59 답안사례 (PDF 30쪽)'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        제시문 [나]의 중복조합을 조합으로 변환시키는 방법을 활용하여 $1$부터 $n$까지의 자연수에서 연속인 두 수가 포함되지 않도록 서로 다른 세 수를 택할 수 있다. $1$부터 $n-4$까지의 자연수에서 중복조합 $a,\,b,\,c\ (1\le a\le b\le c\le n-4)$를 택하는 경우, 연속인 두 수를 포함하지 않는 서로 다른 세 수의 조합으로 나타내기 위하여 각 경우의 첫 번째, 두 번째, 세 번째 수에 각각 $0,\,2,\,4$를 더하면 $a,\,(b+2),\,(c+4)$를 얻는다. 이것은 $1$부터 $n$까지의 자연수에서 연속하는 두 수가 포함되지 않도록 $3$개를 택한 조합이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $1$부터 $n$까지의 자연수에서 연속인 두 수를 포함하지 않는 서로 다른 세 수는 이와 같은 방법으로 모두 얻을 수 있으므로 구하는 방법의 수는 ${}_{n-4}\mathrm{H}_3={}_{n-2}\mathrm{C}_3$이다.
      criteria: ['3.A1']
  - id: S3-ALT
    audience: ALT
    source_flow: '논술가이드북2022 p.57 문항해설·출제의도 (PDF 29쪽)'
    method_no: 2
    key_idea: 공식 문항해설의 방법 — 【2-2】의 결과를 $k$에 대해 더하여 $\displaystyle\sum_{k=1}^{n-4}{}_{n-k-2}\mathrm{C}_2=\sum_{k=2}^{n-3}{}_k\mathrm{C}_2$를 $\sum i$, $\sum i^2$로 계산한다.
    steps:
    - id: 3c-1
      content: |
        $\displaystyle\sum_{k=2}^{n-3}\dfrac{k(k-1)}{2}=\dfrac{(n-2)(n-3)(n-4)}{6}$.
      criteria: ['3.M1', '3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 60
      evidence: |
