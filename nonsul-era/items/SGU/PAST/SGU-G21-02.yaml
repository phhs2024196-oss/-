- id: '4'
  stem: |
    【2-4】 $n$이 $n\ge5$인 짝수라고 하자. 연속인 두 수가 포함되지 않도록 서로 다른 세 수를 택했다고 할 때, 이 중에서 가장 작은 수가 짝수일 확률을 구하시오.
