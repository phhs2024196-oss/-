intent: |
  두 사건에 대한 조건부확률과 확률의 곱셈정리를 이해하고, 확률변수의 확률질량함수와 기댓값을 계산하며, 구간에서 아래로 볼록한 함수의 최솟값을 미분법으로 구할 수 있는지를 평가한다(공식 출제의도 요지).
key_idea: |
  감염 여부 $A$와 양성 반응 $B$로 나누어 곱셈정리로 확률을 구하고, $E(X)=r\alpha p+(1-r)\beta q+1$에 조건 $r\alpha=4(1-r)\beta$, $q=\dfrac{p}{Mp-1}$을 넣어 $h(p)=4p+\dfrac{p}{Mp-1}$의 최솟값을 구한다.
stuck: |
  $q$를 소거한 뒤 $p$의 범위 $\dfrac{1}{M-1}<p<1$을 올바르게 찾는 것
