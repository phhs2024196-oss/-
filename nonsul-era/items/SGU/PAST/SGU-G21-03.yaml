stimuli:
- label: 제시문   # 원문에 [가] 등 라벨 없음(발문 아래 단일 제시문)
  body: |
    어느 도시에 신종 바이러스가 확산하여 이 도시에 거주하는 사람의 $100r$ %($r$는 $0<r<1$인 상수)가 감염되었다. 방역당국은 바이러스 감염 여부를 검사하는 기술을 확보하였으나 이 검사 기술에는 다음 두 종류의 오류가 있을 수 있다.

    ① 감염된 사람을 검사했을 때 음성 반응이 나타날 수 있고, 이 확률은 $p$이다. (단, $0<p<1$)
    ② 감염되지 않은 사람을 검사했을 때 양성 반응이 나타날 수 있고, 이 확률은 $q$이다. (단, $0<q<1$)

    바이러스 감염 여부를 한 번 검사하는 데 드는 비용을 $1$이라 하자. 검사 비용 외에 검사의 오류로 인해 추가 비용이 발생할 수 있다. 감염된 사람의 검사에서 음성 반응이 나타나는 경우, 이 사람은 적절한 치료를 받지 못할 뿐만 아니라 타인을 감염시킬 수 있기 때문에 추가 비용 $\alpha$가 발생한다. 감염되지 않은 사람의 검사에서 양성 반응이 나타나는 경우, 경제 활동의 제약 등으로 인해 추가 비용 $\beta$가 발생한다. 검사의 오류가 없다면 추가 비용은 발생하지 않는다. (단, $\alpha,\,\beta$는 양의 상수)

stem: |
  이 도시에 거주하는 사람을 임의로 한 명 선택하여 바이러스 감염 여부를 한 번 검사한다. 제시문을 참고하여 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【3-1】 양성 반응이 나타날 확률을 구하시오.
  points: 60
  depends_on: []
  answer: {kind: expression, value: 'r*(1-p)+(1-r)*q', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 감염($A$)·비감염($A^c$)으로 나누어 곱셈정리.
    steps:
    - {id: 1a, content: '$P(B)=r(1-p)+(1-r)q$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 감염된 경우와 감염되지 않은 경우로 나누자.
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2022 p.63 답안사례 (PDF 32쪽)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        어떤 사람이 바이러스에 감염된 사건을 $A$, 바이러스 검사에서 양성 반응이 나타나는 사건을 $B$라 하자.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        바이러스 검사에서 양성 반응이 나타날 확률은 $P(B)=P(A\cap B)+P(A^c\cap B)=P(A)P(B\mid A)+P(A^c)P(B\mid A^c)$이므로 $P(B)=r(1-p)+(1-r)q$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: |
        제시문의 상황을 두 사건 $A$(감염), $B$(양성)로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 30
      evidence: |
        확률의 덧셈정리와 곱셈정리로 $P(B)=r(1-p)+(1-r)q$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    【3-2】 음성 반응이 나타났을 때, 실제로 감염되었을 확률을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: 'r*p/(r*p+(1-r)*(1-q))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $P(A\mid B^c)=\dfrac{P(A)P(B^c\mid A)}{P(B^c)}$.
    steps:
    - {id: 2a, content: '$\dfrac{rp}{rp+(1-r)(1-q)}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 직접 주어지지 않은 조건부확률은 곱셈정리로 뒤집는다.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2022 p.63 답안사례 (PDF 32쪽)'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        바이러스 검사에서 음성 반응이 나타났을 때, 실제로는 바이러스에 감염되었을 확률은 조건부확률 $P(A\mid B^c)=\dfrac{P(A)P(B^c\mid A)}{P(B^c)}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $P(B^c)=P(A\cap B^c)+P(A^c\cap B^c)=P(A)P(B^c\mid A)+P(A^c)P(B^c\mid A^c)$이므로 $P(A\mid B^c)=\dfrac{rp}{rp+(1-r)(1-q)}$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 40
      evidence: |
        확률의 곱셈정리를 이용하여 $P(A\mid B^c)$를 이미 알고 있는 확률 $P(A)P(B^c\mid A)$와 $P(B^c)$로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 40
      evidence: |
        덧셈정리·곱셈정리로 $P(B^c)$를 구해 $\dfrac{rp}{rp+(1-r)(1-q)}$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    【3-3】 총 비용을 확률변수 $X$라고 할 때, $X$의 기댓값 $E(X)$를 구하시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: 'r*alpha*p+(1-r)*beta*q+1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $X$는 $1$, $\alpha+1$, $\beta+1$의 세 값을 가지며 확률은 각각 $r(1-p)+(1-r)(1-q)$, $rp$, $(1-r)q$.
    steps:
    - {id: 3a, content: '$E(X)=r\alpha p+(1-r)\beta q+1$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 추가 비용이 생기는 경우는 두 가지뿐이다.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2022 p.63 답안사례 (PDF 32쪽)'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        확률변수 $X$가 $1,\,\alpha+1,\,\beta+1$일 확률은 각각 아래와 같다.
        (가) $P(X=1)$은 검사받은 사람이 감염자이고 결과가 양성이거나 검사받은 사람이 비감염자이고 결과가 음성일 확률이므로 $P(X=1)=P(A\cap B)+P(A^c\cap B^c)=P(A)P(B\mid A)+P(A^c)P(B^c\mid A^c)=r(1-p)+(1-r)(1-q)$
        (나) $P(X=\alpha+1)$은 검사받은 사람이 감염자이고 결과가 음성일 확률이므로 $P(X=\alpha+1)=P(A\cap B^c)=P(A)P(B^c\mid A)=rp$
        (다) $P(X=\beta+1)$은 검사받은 사람이 비감염자이고 결과가 양성일 확률이므로 $P(X=\beta+1)=P(A^c\cap B)=P(A^c)P(B\mid A^c)=(1-r)q$
        이를 정리하면 [표: $X$의 값 $1$, $\alpha+1$, $\beta+1$에 대한 $P(X=x)$가 각각 $r(1-p)+(1-r)(1-q)$, $rp$, $(1-r)q$이고 합계 $1$]이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        따라서 $E(X)=\{r(1-p)+(1-r)(1-q)\}+(\alpha+1)rp+(\beta+1)(1-r)q=r\alpha p+(1-r)\beta q+1$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 40
      evidence: |
        확률변수 $X$의 뜻을 이해하여 $X$의 확률질량함수($X=1,\alpha+1,\beta+1$일 확률)를 구했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 40
      evidence: |
        확률질량함수로 $E(X)=r\alpha p+(1-r)\beta q+1$을 계산했다.
      depends_on: [3.M1]
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    【3-4】 $M$은 $3$보다 큰 상수이고 $r\alpha=4(1-r)\beta$라고 가정하자. $\dfrac{1}{p}+\dfrac{1}{q}=M$을 만족하는 $p$와 $q$에 대하여 기댓값 $E(X)$가 최소가 되도록 하는 $p$와 $q$의 값을 구하시오.
  points: 100
  depends_on: ['3']
  answer: {kind: expression, value: 'p = 3/(2*M); q = 3/M', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $E(X)=(1-r)\beta(4p+q)+1$, $q=\dfrac{p}{Mp-1}$, $\dfrac{1}{M-1}<p<1$에서 $h(p)=4p+\dfrac{p}{Mp-1}$을 최소화.
    steps:
    - {id: 4a, content: '$h^{\prime}(p)=4-\dfrac{1}{(Mp-1)^2}=0\Rightarrow p=\dfrac{3}{2M}$, $q=\dfrac{3}{M}$', criteria: ['4.M1', '4.M2', '4.A1']}
    hint_ladder:
    - 조건 $r\alpha=4(1-r)\beta$로 $E(X)$를 정리해 보자.
    - $q$를 $p$로 나타내면 $p$의 범위는?
  - id: S4-B
    audience: B
    source_flow: '논술가이드북2022 p.64 답안사례 (PDF 33쪽)'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $r\alpha=4(1-r)\beta$를 이용하면 $E(X)=(1-r)\beta(4p+q)+1$이다.
        $\dfrac{1}{p}+\dfrac{1}{q}=M$이므로 $0<q=\dfrac{p}{Mp-1}<1$을 대입하여 $E(X)$를 $p$의 함수로 표현하면, $\dfrac{1}{M-1}<p<1$이고 $E(X)=(1-r)\beta\left(4p+\dfrac{p}{Mp-1}\right)+1$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        $(1-r)\beta>0$이므로 $h(p)=4p+\dfrac{p}{Mp-1}$를 최소로 하는 $p$를 구하자. $h'(p)=4-\dfrac{1}{(Mp-1)^2}=0$을 만족하는 $p$를 찾으면 $Mp-1=\pm\dfrac12$이고 $Mp-1>0$이므로 $p=\dfrac{3}{2M}$이다. 이때, $M>3$이므로 $\dfrac{1}{M-1}<p=\dfrac{3}{2M}<1$이다.
      criteria: ['4.M2']
    - id: 4b-3
      content: |
        또한 $h''(p)=\dfrac{2M}{(Mp-1)^3}>0$이므로 함수 $h(p)$는 구간 $\left(\dfrac{1}{M-1},\,1\right)$에서 아래로 볼록하다. 따라서 $p=\dfrac{3}{2M}$에서 함수 $h(p)$가 최소가 된다.
        (또는 $h'(p)=\dfrac{4\left(p-\dfrac{1}{2M}\right)\left(p-\dfrac{3}{2M}\right)}{\left(p-\dfrac1M\right)^2}$이므로 $\left(\dfrac{1}{M-1},\,\dfrac{3}{2M}\right)$에서 $h'(p)<0$이고 $\left(\dfrac{3}{2M},\,1\right)$에서 $h'(p)>0$이다. 따라서 $p=\dfrac{3}{2M}$에서 함수 $h(p)$가 최소가 된다.)
        그러므로 $E(X)$를 최소로 하는 $p$와 $q$는 $p=\dfrac{3}{2M}$, $q=\dfrac{3}{M}$이다.
      criteria: ['4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 40
      evidence: |
        주어진 두 식을 이용하여 $E(X)$를 하나의 변수 $p$의 함수 $(1-r)\beta\left(4p+\dfrac{p}{Mp-1}\right)+1$로 표현했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [3.A1], max_points: 40}
      steps: [4b-1]
    - id: 4.M2
      mark_type: M
      points: 30
      evidence: |
        변수 $p$가 속하는 구간 $\dfrac{1}{M-1}<p<1$을 올바르게 찾고 $h'(p)=0$의 해 $p=\dfrac{3}{2M}$이 그 구간에 있음을 보였다.
      depends_on: [4.M1]
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 30
      evidence: |
        미분법(볼록성 또는 증감표)으로 실제 최소임을 밝히고 $p=\dfrac{3}{2M}$, $q=\dfrac{3}{M}$을 구했다.
      depends_on: [4.M2]
      steps: [4b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

