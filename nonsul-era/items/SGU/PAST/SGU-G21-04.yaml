      criteria: ['4.B1']
    - id: 4b-2
      content: |
        따라서 문항 【4-2】의 결과에 의하여, 모든 자연수 $n$에 대하여
        $$ (-1)+\int_1^n\left(-\dfrac{1}{\sqrt x}\right)dx\le\sum_{k=1}^n\left(-\dfrac{1}{\sqrt k}\right)<\int_1^{n+1}\left(-\dfrac{1}{\sqrt x}\right)dx $$
        이고
        $$ 2(\sqrt{n+1}-1)=\int_1^{n+1}\dfrac{1}{\sqrt x}\,dx<\sum_{k=1}^n\dfrac{1}{\sqrt k}\le1+\int_1^n\dfrac{1}{\sqrt x}\,dx=2\sqrt n-1 $$
        이므로
        $$ 2\left(\sqrt{1+\dfrac1n}-\dfrac{1}{\sqrt n}\right)<\dfrac{1}{\sqrt n}\sum_{k=1}^n\dfrac{1}{\sqrt k}\le2-\dfrac{1}{\sqrt n} $$
        이다.
      criteria: ['4.M1']
    - id: 4b-3
      content: |
        따라서 제시문 [마]에 의하여 $\displaystyle\lim_{n\to\infty}\dfrac{1}{\sqrt n}\sum_{k=1}^n\dfrac{1}{\sqrt k}=2$
      criteria: ['4.R1']
