stimuli:
- label: 가
  body: |
    어떤 시행에서 표본공간 $S$의 각 원소에 단 하나의 실수가 대응되는 함수를 확률변수라 하고, 확률변수 $X$가 어떤 값 $x$를 가질 확률을 기호로 $\mathrm{P}(X=x)$ 와 같이 나타낸다.
- label: 나
  body: |
    이산확률변수 $X$의 확률질량함수가 $\mathrm{P}(X=x_i)=p_i\ \ (i=1,2,\cdots,n)$일 때 확률변수 $X$의 기댓값은 다음과 같다.
    $$\mathrm{E}(X)=x_1p_1+x_2p_2+\cdots+x_np_n=\sum_{i=1}^{n}x_ip_i$$
- label: 다
  body: |
    함수 $f(x)$가 닫힌구간 $[a,\,b]$에서 연속이면 다음 등식이 성립한다.
    $$\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x=\int_a^b f(x)\,dx\ \ \left(\text{단, }\Delta x=\frac{b-a}{n},\ x_k=a+k\Delta x\right)$$

stem: |
  제시문 [가]~[다]를 참고하여 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    어느 봉사 동아리에서 신입 회원을 모집했는데, $20$명의 학생이 지원 서류를 제출하였다. 그중에서 $4$명의 남학생과 $3$명의 여학생은 자신의 성별을 밝혔으나, 나머지 $13$명은 성별을 밝히지 않았다. 그리고 성별을 밝히지 않은 학생이 남학생 또는 여학생일 확률은 각각 $\dfrac12$로 같다. $20$명의 신입회원 신청자들 중에서 여학생의 수를 확률변수 $X$라고 할 때, $X$의 확률질량함수와 분산을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'pmf = binomial(13, x - 3)/2**13 (x = 3..16); V = 13/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 밝히지 않은 13명 중 여학생 수 $Y\sim\mathrm{B}(13,\tfrac12)$이고 $X=Y+3$이다.
    steps:
    - {id: 1a, content: '$\mathrm{P}(X=x)={}_{13}\mathrm{C}_{x-3}\left(\tfrac12\right)^{13}\ (x=3,\cdots,16)$, $\mathrm{V}(X)=\mathrm{V}(Y)=\tfrac{13}{4}$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 성별을 밝힌 여학생 3명은 확률과 무관하게 항상 포함된다.
    - 나머지 13명 중 여학생 수는 어떤 분포를 따르는가?
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2023 p.56'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        성별을 밝히지 않은 13명의 신청자 중에서 여학생의 수를 확률변수 $Y$라고 하면, $Y$는 이항분포 $\mathrm{B}\left(13,\dfrac12\right)$을 따른다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $Y$의 확률질량함수는 $\mathrm{P}(Y=y)={}_{13}\mathrm{C}_y\left(\dfrac12\right)^y\left(\dfrac12\right)^{13-y}={}_{13}\mathrm{C}_y\left(\dfrac12\right)^{13}\ (y=0,1,2,\cdots,13)$이고 분산은 $\mathrm{V}(Y)=13\times\dfrac12\times\dfrac12=\dfrac{13}{4}$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $X=Y+3$이므로 $X$의 확률질량함수는 $\mathrm{P}(X=x)=\mathrm{P}(Y=x-3)={}_{13}\mathrm{C}_{x-3}\left(\dfrac12\right)^{13}\ (x=3,4,5,\cdots,16)$이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $X$의 분산은 $\mathrm{V}(X)=\mathrm{V}(Y+3)=\mathrm{V}(Y)=\dfrac{13}{4}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $X$에서 3을 뺀 확률변수(밝히지 않은 13명 중 여학생 수)가 이항분포 $\mathrm{B}\left(13,\tfrac12\right)$를 따름을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        이항분포의 확률질량함수 ${}_{13}\mathrm{C}_y\left(\tfrac12\right)^{13}$과 분산 $\tfrac{13}{4}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $X=Y+3$ 관계로 $X$의 확률질량함수 ${}_{13}\mathrm{C}_{x-3}\left(\tfrac12\right)^{13}\ (x=3,\cdots,16)$을 적었다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        분산의 성질로 $\mathrm{V}(X)=\mathrm{V}(Y)=\tfrac{13}{4}$을 얻었다.
      depends_on: [1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    이산확률변수 $X$가 자연수들로 이루어진 집합 $\{2n+1,\,2n+2,\,2n+3,\,\cdots,\,4n\}$에서 임의로 선택된 숫자일 때, $\displaystyle\lim_{n\to\infty}2n\,\mathrm{E}\left(\frac1X\right)$을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'log(2)', equivalents: ['ln 2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $2n\mathrm{E}(1/X)=\sum_{k=1}^{2n}\frac{1}{2n+k}$를 두 리만 합으로 나누어 정적분으로 바꾼다.
    steps:
    - {id: 2a, content: '$\displaystyle\int_0^1\frac{dx}{2+x}+\int_0^1\frac{dx}{3+x}=\ln\frac32+\ln\frac43=\ln2$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 각 값이 뽑힐 확률은 $\frac{1}{2n}$이다.
    - 합을 $k=1..n$과 $k=n+1..2n$으로 나누고 $\frac1n$을 묶어 보자.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2023 p.56'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        제시문 [나]에 의하여 $\mathrm{E}\left(\dfrac1X\right)=\displaystyle\sum_{k=1}^{2n}\frac{1}{2n}\cdot\frac{1}{2n+k}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $2n\mathrm{E}\left(\dfrac1X\right)=\dfrac{1}{2n+1}+\dfrac{1}{2n+2}+\cdots+\dfrac{1}{4n}=\displaystyle\sum_{k=1}^{n}\frac{1}{2n+k}+\sum_{k=1}^{n}\frac{1}{3n+k}=\sum_{k=1}^{n}\frac{1}{2+\frac kn}\times\frac1n+\sum_{k=1}^{n}\frac{1}{3+\frac kn}\times\frac1n$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        제시문 [다]에 의하여 $\displaystyle\lim_{n\to\infty}2n\mathrm{E}\left(\frac1X\right)=\int_0^1\frac{1}{2+x}dx+\int_0^1\frac{1}{3+x}dx=\ln3-\ln2+\ln4-\ln3=\ln\frac42=\ln2$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        기댓값 $\mathrm{E}\left(\frac1X\right)=\sum_{k=1}^{2n}\frac{1}{2n}\cdot\frac{1}{2n+k}$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        제시문 [다]를 쓰기 위해 합을 $\frac1n$이 곱해진 리만 합 꼴로 변형했다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        정적분으로 고쳐 계산해 $\ln2$를 얻었다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    한 개의 주사위를 던져 $1,\ 2,\ 3$이 나오면 동전 한 개를 던진다. 이때 앞면이 나오면 주사위에서 얻은 결과에 $1$을 더하고 뒷면이 나오면 2를 더한다. 한편,$4,\ 5,\ 6$이 나오면 금화 $6$개와 은화 $4$개가 들어 있는 주머니에서 임의로 두 개를 동시에 꺼내어 금화 두 개가 나오면 주사위에서 얻은 결과에서 $1$을 빼고 아니면 $2$를 뺀다. 이렇게 해서 얻어진 결과가 $4$ 이상일 때, 처음 던진 주사위의 눈이 짝수일 확률을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '9/17', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 금화 두 개일 확률 $\frac{{}_6\mathrm{C}_2}{{}_{10}\mathrm{C}_2}=\frac13$. 눈·결과별 확률 표를 만들어 $\mathrm{P}(B\mid A)$를 계산한다.
    steps:
    - {id: 3a, content: '$\mathrm{P}(A)=\tfrac{17}{36}$, $\mathrm{P}(A\cap B)=\tfrac1{12}+\tfrac1{18}+\tfrac19=\tfrac14$, $\mathrm{P}(B\mid A)=\tfrac{9}{17}$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2']}
    hint_ladder:
    - 주사위 눈마다 가능한 최종 결과는 두 가지뿐이다.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2023 p.56~57'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        주사위 던지기와 그 이후 실행은 서로 독립이므로 확률의 곱셈정리로 각 사건의 확률을 계산한다(금화 두 개가 나올 확률은 $\frac13$).
        눈 1: 결과 2 $\left(\frac16\times\frac12=\frac1{12}\right)$, 결과 3 $\left(\frac1{12}\right)$ / 눈 2: 결과 3 $\left(\frac1{12}\right)$, 결과 4 $\left(\frac1{12}\right)$ / 눈 3: 결과 4 $\left(\frac1{12}\right)$, 결과 5 $\left(\frac1{12}\right)$
        눈 4: 결과 3 $\left(\frac16\times\frac13=\frac1{18}\right)$, 결과 2 $\left(\frac16\times\left(1-\frac13\right)=\frac19\right)$ / 눈 5: 결과 4 $\left(\frac1{18}\right)$, 결과 3 $\left(\frac19\right)$ / 눈 6: 결과 5 $\left(\frac1{18}\right)$, 결과 4 $\left(\frac19\right)$
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        최종 결과가 $4$ 이상인 사건을 $A$라고 하면 $\mathrm{P}(A)=\dfrac1{12}+\dfrac1{12}+\dfrac1{12}+\dfrac1{18}+\dfrac1{18}+\dfrac19=\dfrac{17}{36}$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        처음 던진 주사위의 눈이 짝수인 사건을 $B$라고 하면 $\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}=\dfrac{\frac1{12}+\frac1{18}+\frac19}{\frac{17}{36}}=\dfrac{9}{17}$이다.
      criteria: ['3.M2', '3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        확률의 곱셈정리로 주사위 눈·최종 결과별 확률을 빠짐없이 계산했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $\mathrm{P}(A)=\frac{17}{36}$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        조건부확률 $\mathrm{P}(B\mid A)=\frac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}$를 세웠다.
