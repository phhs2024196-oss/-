stimuli:
- label: 가
  body: |
    $n$이 자연수일 때, 다항식 $(a+b)^n$을 전개하면 다음과 같은 전개식을 얻을 수 있고, 이것을 이항정리라고 한다.
    $$(a+b)^n={}_n\mathrm{C}_0a^n+{}_n\mathrm{C}_1a^{n-1}b^1+\cdots+{}_n\mathrm{C}_ra^{n-r}b^r+\cdots+{}_n\mathrm{C}_nb^n$$
- label: 나
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고, 이 구간의 모든 $x$에 대하여
    ① $f'(x)>0$이면 $f(x)$는 이 구간에서 증가한다.
    ② $f'(x)<0$이면 $f(x)$는 이 구간에서 감소한다.
- label: 다
  body: |
    ① 세 수열 $\{a_n\},\ \{b_n\},\ \{c_n\}$과 모든 자연수 $n$에 대하여, $a_n\le c_n\le b_n$이고 $\displaystyle\lim_{n\to\infty}a_n=\lim_{n\to\infty}b_n=L$이면 $\displaystyle\lim_{n\to\infty}c_n=L$이다.
    ② 세 함수 $f(x),\ g(x),\ h(x)$와 $a$에 가까운 모든 실수 $x$에 대하여, $f(x)\le h(x)\le g(x)$이고 $\displaystyle\lim_{x\to a}f(x)=\lim_{x\to a}g(x)=L$이면 $\displaystyle\lim_{x\to a}h(x)=L$이다. 또한, 이와 같은 함수의 극한의 관계는 $x\to a+,\ x\to a-,\ x\to\infty,\ x\to-\infty$일 때도 성립한다.
- label: 라
  body: |
    함수 $f(x)$의 그래프의 개형을 그릴 때에는 다음을 고려한다.
    ① 함수의 정의역과 치역
    ② 좌표축과의 교점
    ③ 함수의 증가와 감소, 극대와 극소, 곡선의 오목과 볼록, 변곡점
    ④ 점근선

stem: |
  제시문 [가]~[라]를 참고하여 다음 물음에 답하시오.
  (【2-3】~【2-5】의 공통 조건) 집합 $\{x\mid x>0\}$을 정의역으로 갖는 함수 $f(x)=\left(1+\dfrac1x\right)^x$에 대하여, 문항 【2-3】~【2-5】에 답하시오.

subparts:
- id: '1'
  stem: |
    제시문 [가]를 이용하여, 다음 부등식이 성립함을 보이시오.
    $$(1+n)^{\frac1n}<1+\sqrt{\frac{2}{n-1}}\quad(\text{단, }n\text{은 }1\text{보다 큰 자연수})$$
  points: 12
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 양변을 $n$제곱하고 이항전개의 ${}_n\mathrm{C}_2$ 항만 남기면 $1+\frac{n(n-1)}{2}\cdot\frac{2}{n-1}=1+n$.
    steps:
    - {id: 1a, content: '$\left(1+\sqrt{\tfrac{2}{n-1}}\right)^n>1+{}_n\mathrm{C}_2\cdot\tfrac{2}{n-1}=1+n$', criteria: ['1.M1', '1.R1']}
    hint_ladder:
    - 양변이 양수이므로 $n$제곱해도 대소가 유지된다.
    - 전개식의 어느 항 하나가 정확히 $n$이 되는가?
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2023 p.62'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        1보다 큰 자연수 $n$에 대하여 주어진 부등식의 양변이 양수이므로, 양변을 $n$제곱한 부등식 $1+n<\left(1+\sqrt{\dfrac{2}{n-1}}\right)^n\ \cdots(1)$이 성립함을 보이면 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        제시문 [가]를 이용하여 (1)의 우변을 전개하면
        $\left(1+\sqrt{\dfrac{2}{n-1}}\right)^n={}_n\mathrm{C}_0+{}_n\mathrm{C}_1\left(\sqrt{\dfrac{2}{n-1}}\right)+{}_n\mathrm{C}_2\left(\sqrt{\dfrac{2}{n-1}}\right)^2+\cdots+{}_n\mathrm{C}_n\left(\sqrt{\dfrac{2}{n-1}}\right)^n\ \cdots(2)$
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        (2)의 우변의 각 항이 양수이므로 (2)의 우변 $>{}_n\mathrm{C}_0+{}_n\mathrm{C}_2\left(\sqrt{\dfrac{2}{n-1}}\right)^2=1+\dfrac{n(n-1)}{2}\times\dfrac{2}{n-1}=1+n$이다. 따라서 부등식 $1+n<\left(1+\sqrt{\dfrac{2}{n-1}}\right)^n$이 성립한다.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        우변을 $n$제곱한 식을 제시문 [가]의 이항정리로 전개했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.R1
      mark_type: R
      points: 6
      evidence: |
        각 항이 양수임을 근거로 ${}_n\mathrm{C}_0+{}_n\mathrm{C}_2\cdot\frac{2}{n-1}=1+n$보다 큼을 보여 부등식을 완성했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    제시문 [나]를 이용하여, 다음 부등식이 성립함을 보이시오.
    $$\frac{1}{x+1}<\ln\left(1+\frac1x\right)<\frac{1}{\sqrt{x(x+1)}}\quad(\text{단, }x\text{는 양의 실수})$$
  points: 12
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 두 변의 차 $p(x)$, $q(x)$가 감소하고 $x\to\infty$에서 0으로 가므로 양수.
    steps:
    - {id: 2a, content: '$p''(x)=-\tfrac{1}{x(x+1)^2}<0$, $q''(x)=-\tfrac{(2x+1)-2\sqrt{x(x+1)}}{2x(x+1)\sqrt{x(x+1)}}<0$, $\lim_{x\to\infty}p=\lim_{x\to\infty}q=0$', criteria: ['2.M1', '2.A1', '2.R1']}
    hint_ladder:
    - 한쪽으로 이항한 함수의 도함수 부호를 보자.
    - 감소함수가 $\infty$에서 0으로 가면 그 값의 부호는?
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2023 p.62'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (i) $p(x)=\ln\left(1+\dfrac1x\right)-\dfrac{1}{x+1}$이라 하면
        $p'(x)=\dfrac{-\frac{1}{x^2}}{1+\frac1x}+\dfrac{1}{(x+1)^2}=-\dfrac{1}{x(x+1)}+\dfrac{1}{(x+1)^2}=-\dfrac{1}{x(x+1)^2}<0$
        이므로 제시문 [나]에 의하여 $p(x)$는 $(0,\infty)$에서 감소한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        또한 $\displaystyle\lim_{x\to\infty}p(x)=\lim_{x\to\infty}\ln\left(1+\frac1x\right)-\lim_{x\to\infty}\frac{1}{x+1}=0-0=0$이다. 따라서 $p(x)>0$이다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        (ii) $q(x)=\dfrac{1}{\sqrt{x(x+1)}}-\ln\left(1+\dfrac1x\right)$이라 하면
        $q'(x)=-\dfrac{2x+1}{2x(x+1)\sqrt{x(x+1)}}+\dfrac{1}{x(x+1)}=-\dfrac{(2x+1)-2\sqrt{x(x+1)}}{2x(x+1)\sqrt{x(x+1)}}<0$.
        여기서 $(2x+1)^2-\left(2\sqrt{x(x+1)}\right)^2=1>0$이고 $2x+1>0,\ 2\sqrt{x(x+1)}>0$이므로 분자가 양수이다. 그러므로 제시문 [나]에 의하여 $q(x)$는 $(0,\infty)$에서 감소한다.
      criteria: ['2.M1', '2.A1']
    - id: 2b-4
      content: |
        또한 $\displaystyle\lim_{x\to\infty}q(x)=\lim_{x\to\infty}\frac{1}{\sqrt{x(x+1)}}-\lim_{x\to\infty}\ln\left(1+\frac1x\right)=0-0=0$이므로 $q(x)>0$이다. 그러므로 (i), (ii)에 의하여 주어진 부등식이 성립한다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        두 변의 차로 이루어진 함수 $p(x)$, $q(x)$를 두고 도함수를 계산했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-3]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $p'(x)<0$, $q'(x)<0$의 부호를 근거(분자 $(2x+1)-2\sqrt{x(x+1)}>0$ 등)와 함께 결정했다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: |
        제시문 [나]로 감소함을 밝히고 $x\to\infty$ 극한이 0임을 이용해 $p(x)>0$, $q(x)>0$을 결론지었다.
      depends_on: [2.A1]
      steps: [2b-2, 2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    함수 $f(x)$가 열린구간 $(0,\infty)$에서 증가함을 보이시오.
  points: 12
  depends_on: ['2']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 로그미분하면 $\frac{f'(x)}{f(x)}=p(x)>0$.
    steps:
    - {id: 3a, content: '$f''(x)=p(x)f(x)>0$', criteria: ['3.M1', '3.R1']}
    hint_ladder:
    - 양변에 자연로그를 취해 미분해 보자.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2023 p.63'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $x>0$이면 $f(x)=\left(1+\dfrac1x\right)^x>0$이므로 양변에 자연로그를 취하면 $\ln f(x)=x\ln\left(1+\dfrac1x\right)$이다. 양변을 $x$에 대하여 미분하면
        $\dfrac{f'(x)}{f(x)}=\ln\left(1+\dfrac1x\right)+x\times\left(-\dfrac{1}{x(x+1)}\right)=\ln\left(1+\dfrac1x\right)-\dfrac{1}{x+1}$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        문항 【2-2】에 의하여 $f'(x)=p(x)f(x)>0$이다. 따라서 제시문 [나]에 의하여 $f(x)$는 구간 $(0,\infty)$에서 증가한다.
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 6
      evidence: |
        도함수 $f'(x)=f(x)\left\{\ln\left(1+\frac1x\right)-\frac{1}{x+1}\right\}$을 계산했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 6
      evidence: |
        【2-2】의 결과로 $f'(x)>0$을 결정하고 제시문 [나]로 증가함을 결론지었다.
      depends_on: [3.M1]
      ft: {allowed: true, from: [2.R1], max_points: 6}
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    함수 $g(x)$를 다음과 같이 정의하자.
    $$g(x)=\begin{cases}f\left(\dfrac1n\right)&\left(0<x\le1,\ \text{단, }n\text{은 }\dfrac1x\text{의 정수 부분}\right)\\[2mm]3&(x>1)\end{cases}$$
    임의의 양의 실수 $x$에 대하여 $f(x)\le g(x)$임을 보이시오.
  points: 12
  depends_on: ['3']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $x>1$이면 $f(x)<e<3$, $0<x\le1$이면 $x\le\frac1n$이고 $f$가 증가하므로 $f(x)\le f\left(\frac1n\right)$.
    steps:
    - {id: 4a, content: '$n\le\tfrac1x<n+1\Rightarrow x\le\tfrac1n\le1\Rightarrow f(x)\le f\left(\tfrac1n\right)=g(x)$', criteria: ['4.M1', '4.R1', '4.R2']}
    hint_ladder:
    - $f$가 증가하고 $\lim_{x\to\infty}f(x)=e$이다.
    - $n=\left[\frac1x\right]$과 $x$의 대소를 비교해 보자.
  - id: S4-B
    audience: B
    source_flow: '논술가이드북2023 p.63'
