- id: '5'
  stem: |
    문항 【2-1】~【2-4】를 이용하여, 함수 $y=f(x)$의 그래프의 개형을 그리시오.
  points: 12
  depends_on: ['1', '2', '3', '4']
  answer: {kind: expression, value: 'range = Interval.open(1, E); asymptote = E; concave = down; inflection = none', equivalents: [], tolerance: null}
  solutions:
  - id: S5-A
    audience: A
    method_no: 1
    key_idea: 【2-1】과 조임으로 $\lim_{x\to0+}f=1$, $\lim_{x\to\infty}f=e$, $f''=f(p'+p^2)<0$.
    steps:
    - {id: 5a, content: '치역 $(1,e)$, 증가·위로 볼록·변곡점 없음, 점근선 $y=e$', criteria: ['5.M1', '5.A1', '5.M2', '5.A2', '5.B1']}
    hint_ladder:
    - $\lim_{x\to0+}g(x)$는 수열 $(1+n)^{1/n}$의 극한과 같다.
    - $f'=pf$를 한 번 더 미분해 보자.
  - id: S5-B
    audience: B
    source_flow: '논술가이드북2023 p.63~64'
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        $\displaystyle\lim_{n\to\infty}\left(1+\sqrt{\frac{2}{n-1}}\right)=1$이고 문항 【2-1】로부터 $1<(1+n)^{\frac1n}<1+\sqrt{\dfrac{2}{n-1}}$ ($n$은 1보다 큰 자연수)이므로 제시문 [다]에 의하여 $\displaystyle\lim_{n\to\infty}(1+n)^{\frac1n}=1$이다. 따라서 $\displaystyle\lim_{x\to0+}g(x)=1$이다.
      criteria: ['5.M1']
    - id: 5b-2
      content: |
        또한 $\displaystyle\lim_{x\to0+}g(x)=1$이고 문항 【2-4】로부터 $1<f(x)\le g(x)\ (x>0)$이므로 제시문 [다]에 의하여 $\displaystyle\lim_{x\to0+}f(x)=1$이다. (【2-3】의 증가성과 $\lim_{x\to\infty}f(x)=e$로 치역은 $\{y\mid1<y<e\}$)
      criteria: ['5.A1']
    - id: 5b-3
      content: |
        한편 문항 【2-3】으로부터 $f'(x)=p(x)f(x)$이므로 $f''(x)=p'(x)f(x)+p(x)f'(x)=f(x)\left(p'(x)+p^2(x)\right)$이다. 또한
        $p'(x)+p^2(x)=\dfrac{1}{(x+1)^2}-\dfrac{1}{x(x+1)}+\left\{\ln\left(1+\dfrac1x\right)-\dfrac{1}{x+1}\right\}^2$
        $=\dfrac{2}{(x+1)^2}-\dfrac{1}{x(x+1)}-\dfrac{2}{x+1}\times\ln\left(1+\dfrac1x\right)+\left\{\ln\left(1+\dfrac1x\right)\right\}^2$
        $=\dfrac{2}{x+1}\left\{\dfrac{1}{x+1}-\ln\left(1+\dfrac1x\right)\right\}+\left\{\ln\left(1+\dfrac1x\right)+\dfrac{1}{\sqrt{x(x+1)}}\right\}\left\{\ln\left(1+\dfrac1x\right)-\dfrac{1}{\sqrt{x(x+1)}}\right\}$
        $=-\dfrac{2}{x+1}\times p(x)-\left\{\ln\left(1+\dfrac1x\right)+\dfrac{1}{\sqrt{x(x+1)}}\right\}\times q(x)$
      criteria: ['5.M2']
    - id: 5b-4
      content: |
        문항 【2-2】로부터 $p(x)>0$이고 $q(x)>0$이므로 $p'(x)+p^2(x)<0$이다. 따라서 구간 $(0,\infty)$에서 $f''(x)<0$이므로 곡선 $y=f(x)$는 위로 볼록하며 변곡점은 존재하지 않는다.
      criteria: ['5.A2']
    - id: 5b-5
      content: |
        제시문 [라]의 내용을 확인하면 ① 정의역: $\{x\mid x>0\text{인 실수}\}$, 치역: $\{y\mid1<y<e\text{인 실수}\}$ ② 좌표축과의 교점은 없다. ③ 열린구간 $(0,\infty)$에서 $f(x)$는 증가한다. $f(x)$의 극값은 존재하지 않는다. 곡선 $y=f(x)$는 위로 볼록하며 변곡점은 존재하지 않는다. ④ 점근선: $y=e$.
        [그림: 좌표평면에서 $y$축 위 점 $(0,1)$은 빈 점(○)이고, 곡선이 그 점에서 출발해 가파르게 올라가다가 점점 완만해지며 증가하고, 위로 볼록한 채로 점근선 $y=e$(수평선)에 아래쪽에서 가까워지는 그래프]
      criteria: ['5.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
