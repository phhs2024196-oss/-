      depends_on: [5.M2]
      steps: [5b-4]
    - id: 5.B1
      mark_type: B
      points: 2
      evidence: |
        제시문 [라]의 항목(정의역·치역, 교점, 증감·볼록, 점근선 $y=e$)을 반영한 개형을 그렸다($(0,1)$은 빈 점).
      steps: [5b-5]
