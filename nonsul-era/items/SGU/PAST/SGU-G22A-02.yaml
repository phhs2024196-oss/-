intent: |
  미적분의 기본 내용과 확률과 통계의 이항정리를 이용하여 도함수의 부호에 따른 함수의 증가·감소 판정, 함수의 극한, 이계도함수와 곡선의 오목·볼록 및 변곡점의 관계를 이해하고 활용할 수 있는지 평가한다. 제시문과 앞 문항의 결과를 활용해 그래프의 개형까지 단계적으로 이끌도록 구성하였다.
key_idea: |
  $p(x)=\ln\left(1+\frac1x\right)-\frac{1}{x+1}$, $q(x)=\frac{1}{\sqrt{x(x+1)}}-\ln\left(1+\frac1x\right)$가 감소하며 극한 0으로 가므로 양수. $f'=pf$, $f''=f(p'+p^2)$이고 $p'+p^2=-\frac{2}{x+1}p-\left(\ln\left(1+\frac1x\right)+\frac{1}{\sqrt{x(x+1)}}\right)q<0$. $x\to0+$ 극한은 $g$와 【2-1】의 $(1+n)^{1/n}\to1$로 조임.
stuck: |
  【2-4】에서 $n=\left[\frac1x\right]$이면 $x\le\frac1n$이므로 $f(x)\le f\left(\frac1n\right)$이 되는 것, 【2-5】에서 $p'+p^2$를 $p$와 $q$로 묶어 부호를 정하는 변형
