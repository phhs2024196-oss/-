      content: |
        정의역의 $x$를 $x>1$인 경우와 $0<x\le1$인 경우로 나누어 생각한다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        문항 【2-3】에 의하여 $f(x)$가 $(0,\infty)$에서 증가하고 $\displaystyle\lim_{x\to\infty}f(x)=\lim_{x\to\infty}\left(1+\frac1x\right)^x=e$이므로 $f(x)<e\ (x>0)$이다. 따라서 $x>1$이면 $f(x)<e<3=g(x)$이다.
      criteria: ['4.R1']
    - id: 4b-3
      content: |
        한편 $0<x\le1$이면 $\dfrac1x\ge1$이므로 $\dfrac1x$의 정수 부분인 $n$에 대하여 $1\le n\le\dfrac1x<n+1$을 만족한다. 따라서 $0<x\le\dfrac1n\le1$이므로 문항 【2-3】과 $g(x)$의 정의에 의하여 $f(x)\le f\left(\dfrac1n\right)=g(x)$이다. 그러므로 임의의 양의 실수 $x$에 대하여 $f(x)\le g(x)$이다.
      criteria: ['4.R2']
