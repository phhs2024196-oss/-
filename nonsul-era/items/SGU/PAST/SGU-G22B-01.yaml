intent: |
  확률의 기본 개념과 함수의 여러 가지 성질 및 미분·적분을 이해하고 활용할 수 있는지 평가한다(확률의 정의와 기본성질, 함수의 연속, 역함수, 미분을 이용한 증가·감소 판정, 정적분의 의미, 등비급수의 합).
key_idea: |
  3전2선승($p^2$)과 5전3선승($p^3+3p^3(1-p)$)의 우승 확률을 같게 놓기, 연속 조건을 $X=e^{2p}$의 이차방정식으로 보고 $X>1$인 근 고르기, $f$를 $g(x)=xe^{-x}$의 역함수로 보아 넓이 관계 이용, 함수방정식을 $2^k$배로 반복해 망원합과 등비급수로 $g(x)=f(x)-\frac{24}{7x^4}$ 얻기.
stuck: |
  【3-3】에서 $f(x)=xe^{f(x)}$를 $g(f(x))=x$로 읽어 $f=g^{-1}$임을 알아차리는 것, 【3-4】에서 $x$ 대신 $2x$를 넣고 2를 곱해 망원합을 만드는 것
