- id: '4'
  stem: |
    【3-4】 열린구간 $(0,\,\infty)$에서 연속인 함수 $f(x)$가 $\displaystyle\int_1^2f(x)\,dx=3$을 만족하고
    모든 양의 실수 $x$에 대하여 $f(x)-2f(2x)=\dfrac{3}{x^4}$을 만족한다.
    함수 $g(x)=\displaystyle\lim_{n\to\infty}2^nf(2^nx)$에 대하여, $\displaystyle\int_1^2g(x)\,dx$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $x\to2^{k-1}x$를 넣고 $2^{k-1}$을 곱해 더하면 망원합 $f(x)-2^nf(2^nx)=\sum_{k=1}^n\frac{3}{x^4}\left(\frac18\right)^{k-1}$.
    steps:
    - {id: 4a, content: '$g(x)=f(x)-\tfrac{24}{7x^4}$, $\int_1^2g=3-1=2$', criteria: ['4.M1', '4.A1', '4.A2']}
    hint_ladder:
    - 주어진 식의 $x$ 대신 $2x$를 넣고 양변에 2를 곱해 보자.
  - id: S4-B
    audience: B
    source_flow: '논술가이드북2023 p.69'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        주어진 항등식 $f(x)-2f(2x)=\dfrac{3}{x^4}$의 $x$ 대신 $2x$를 넣어서 얻은 등식에 2를 곱하면 $2f(2x)-2^2f(2^2x)=\dfrac{3}{x^4}\times\dfrac18$을 얻는다. 같은 방식으로 반복하면 $2^{n-1}f(2^{n-1}x)-2^nf(2^nx)=\dfrac{3}{x^4}\times\left(\dfrac18\right)^{n-1}$이므로 좌변과 우변을 각각 더하면
        $f(x)-2^nf(2^nx)=\displaystyle\sum_{k=1}^{n}\frac{3}{x^4}\times\left(\frac18\right)^{k-1}$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        제시문 [다]에 의하여 우변은 수렴하며 이 등비급수의 합은 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\frac{3}{x^4}\times\left(\frac18\right)^{k-1}=\frac{24}{7x^4}$이다. 따라서 $g(x)=\displaystyle\lim_{n\to\infty}2^nf(2^nx)=f(x)-\frac{24}{7x^4}$이다.
      criteria: ['4.A1']
    - id: 4b-3
      content: |
        $\displaystyle\int_1^2g(x)dx=\int_1^2f(x)dx-\int_1^2\frac{24}{7x^4}dx=3+\left[\frac{8}{7x^3}\right]_1^2=3-1=2$이다.
      criteria: ['4.A2']
