  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $x\le t\le3x$에서 $f(3x)\le f(t)<1$이므로 $\left(\frac{\sin3x}{3x}\right)^k\ln3\le\int_x^{3x}\frac{(f(t))^k}{t}dt\le\ln3$.
    steps:
    - {id: 4a, content: '$\lim_{x\to0+}\left(\tfrac{\sin3x}{3x}\right)^k=1$이므로 극한값 $\ln3$', criteria: ['4.M1', '4.M2', '4.A1']}
    hint_ladder:
    - 【4-3】에 의해 구간 $[x,3x]$에서 $f(t)$의 최솟값은?
    - $\int_x^{3x}\frac{dt}{t}$는 $x$와 무관하다.
  - id: S4-B
    audience: B
    source_flow: '논술가이드북2023 p.75'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        제시문 [라]로부터 열린구간 $\left(0,\dfrac\pi2\right)$에서 $f(x)<1$이고 $\displaystyle\lim_{x\to0+}f(x)=1$이다. 열린구간 $\left(0,\dfrac\pi6\right)$에서 임의의 $x$를 택하자. 문항 【4-3】에 의하여 $f(t)=\dfrac{\sin t}{t}$가 구간 $\left(0,\dfrac\pi2\right)$에서 감소하므로 $x\le t\le3x$인 임의의 $t$에 대하여 $\dfrac{\sin3x}{3x}\le\dfrac{\sin t}{t}<1$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        각 변을 $k$제곱하고 $\dfrac1t$를 곱하면 $0<\left(\dfrac{\sin3x}{3x}\right)^k\dfrac1t\le\dfrac{\sin^kt}{t^{k+1}}\le\dfrac1t$이다. 따라서 정적분과 곡선 및 $x$축 사이의 넓이의 관계를 이용하면
        $\displaystyle\left(\frac{\sin3x}{3x}\right)^k\int_x^{3x}\frac1t\,dt=\int_x^{3x}\left(\frac{\sin3x}{3x}\right)^k\frac1t\,dt\le\int_x^{3x}\frac{\sin^kt}{t^{k+1}}dt\le\int_x^{3x}\frac1t\,dt$이다.
      criteria: ['4.M2']
    - id: 4b-3
      content: |
        $\displaystyle\lim_{x\to0+}\left(\frac{\sin3x}{3x}\right)^k=1$이고 $\displaystyle\lim_{x\to0+}\int_x^{3x}\frac1t\,dt=\ln3$이므로 $\displaystyle\lim_{x\to0+}\int_x^{3x}\frac{(f(t))^k}{t}dt=\lim_{x\to0+}\int_x^{3x}\frac{\sin^kt}{t^{k+1}}dt=\ln3$이다.
      criteria: ['4.A1']
