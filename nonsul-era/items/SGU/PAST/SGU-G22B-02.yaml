intent: |
  미적분의 기본 내용(삼각함수와 주기함수의 성질, 평균값 정리, 사잇값 정리, 최대·최소 정리, 적분과 극한값의 계산, 도함수를 이용한 증가·감소 판정)을 이해하고 여러 상황에 적용하여 문제를 해결할 수 있는지 평가한다.
key_idea: |
  평균값 정리로 $f'(r)=0$, $f'(s)=2$인 $r\in(1,2)$, $s\in(2,3)$을 잡고 $f'$에 사잇값 정리·평균값 정리 적용($s-r<2$). 주기 2와 한 주기 적분 1로 $\frac1x\int_{-x}^xf\to1$(나머지는 최대·최소 정리로 유계). $\frac{\sin t}{t}$의 감소성으로 $\left(\frac{\sin3x}{3x}\right)^k\int_x^{3x}\frac{dt}{t}\le\int_x^{3x}\frac{(f(t))^k}{t}dt\le\ln3$.
stuck: |
  【4-1】에서 $f''(b)>1$을 얻으려면 $f'$에 평균값 정리를 한 번 더 쓰고 $s-r<2$를 이용해야 한다는 점, 【4-4】에서 $t\le3x$를 이용해 $f(t)\ge f(3x)$로 아래에서 누르는 발상
