stimuli:
- label: 가
  body: |
    함수 $f(x)$가 닫힌구간 $[a,\,b]$에서 연속이고 $f(a)\ne f(b)$일 때, $f(a)$와 $f(b)$ 사이의 임의의 실수 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,\,b)$에 적어도 하나 존재한다.
- label: 나
  body: |
    함수 $f(x)$가 닫힌구간 $[a,\,b]$에서 연속이고 열린구간 $(a,\,b)$에서 미분가능하면 $\dfrac{f(b)-f(a)}{b-a}=f'(c)$인 $c$가 열린구간 $(a,\,b)$에 적어도 하나 존재한다.
- label: 다
  body: |
    함수 $f(x)$가 닫힌구간 $[a,\,b]$에서 연속이면 $f(x)$는 $[a,\,b]$에서 반드시 최댓값과 최솟값을 갖는다.
- label: 라
  body: |
    $0<x<\dfrac\pi2$일 때 $\sin x<x<\tan x$이 성립한다.

stem: |
  제시문 [가]~[라]를 참고하여 다음 물음에 답하시오.
  (【4-3】·【4-4】의 공통 조건) 함수 $f(x)=\dfrac{\sin x}{x}$에 대하여, 문항 【4-3】과 【4-4】에 답하시오.

subparts:
- id: '1'
  stem: |
    【4-1】 함수 $f(x)$가 실수 전체의 집합에서 이계도함수를 가지며 $f(1)=f(2)=3,\ f(3)=5$일 때,
    $f'(a)=\dfrac32$인 $a$와 $f''(b)>1$인 $b$가 모두 열린구간 $(1,\,3)$에 존재함을 보이시오.
  points: 15
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 평균값 정리로 $f'(r)=0\ (1<r<2)$, $f'(s)=2\ (2<s<3)$. $f'$에 사잇값 정리로 $a$, 평균값 정리로 $f''(b)=\frac{2}{s-r}>1$.
    steps:
    - {id: 1a, content: '$0<\tfrac32<2$이므로 $f''(a)=\tfrac32$인 $a\in(r,s)$, $f''''(b)=\tfrac{2}{s-r}>1$ ($s-r<2$)', criteria: ['1.M1', '1.R1', '1.A1', '1.A2']}
    hint_ladder:
    - 구간 $[1,2]$, $[2,3]$에 각각 평균값 정리를 적용해 보자.
    - $f'$은 연속이므로 사잇값 정리를 쓸 수 있다.
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2023 p.74'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        제시문 [나]의 평균값 정리에 의해서 $f'(r)=\dfrac{f(2)-f(1)}{2-1}=\dfrac{3-3}{2-1}=0$을 만족하는 $r$이 열린구간 $(1,2)$에 존재하며 $f'(s)=\dfrac{f(3)-f(2)}{3-2}=\dfrac{5-3}{3-2}=2$를 만족하는 $s$가 열린구간 $(2,3)$에 존재한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        모든 실수 $x$에 대해서 이계도함수 $f''(x)$가 존재하므로 $f'(x)$는 닫힌구간 $[r,s]$에서 연속이다.
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        $f'(r)=0,\ f'(s)=2,\ 0<\dfrac32<2$이므로 제시문 [가]에 주어진 사잇값 정리에 의하여 $f'(a)=\dfrac32$를 만족하는 $a$가 열린구간 $(r,s)$에 존재한다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        또한 평균값 정리를 닫힌구간 $[r,s]$와 미분가능한 함수 $f'(x)$에 적용하면 $f''(b)=\dfrac{f'(s)-f'(r)}{s-r}=\dfrac{2}{s-r}$을 만족하는 $b$가 열린구간 $(r,s)$에 존재한다. 구간 $(r,s)$는 구간 $(1,3)$에 포함되므로 $s-r<2$가 성립하고 따라서 $f''(b)>1$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        제시문 [나]의 평균값 정리를 $f$에 적용해 $f'(r)=0$, $f'(s)=2$인 $r\in(1,2)$, $s\in(2,3)$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        이계도함수가 존재하므로(미분가능) $f'$이 $[r,s]$에서 연속임을 밝혔다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        제시문 [가]의 사잇값 정리를 $f'$에 적용해 $f'(a)=\frac32$인 $a\in(1,3)$의 존재를 보였다.
      depends_on: [1.M1, 1.R1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        평균값 정리를 $f'$에 적용해 $f''(b)=\frac{2}{s-r}$이고 $s-r<2$로 $f''(b)>1$을 보였다.
      depends_on: [1.M1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    【4-2】 함수 $f(x)$가 실수 전체의 집합에서 연속이고, 모든 $x$에 대하여 $f(x+2)=f(x)$를 만족하며,
    $\displaystyle\int_1^3f(x)\,dx=1$일 때, $\displaystyle\lim_{x\to\infty}\frac1x\int_{-x}^{x}f(t)\,dt$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x=2n+c$로 쓰면 $\int_{-x}^xf=2n+\int_0^cf+\int_{-c}^0f$이고 나머지 두 적분은 $\lvert f\rvert$의 최댓값 $M$으로 $2M$ 이하.
    steps:
    - {id: 2a, content: '$\tfrac{2n}{x}\to1$, $\tfrac1x\int_0^cf\to0$, $\tfrac1x\int_{-c}^0f\to0$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - 길이 2인 구간에서의 적분은 어디서 시작하든 같다.
    - 남는 조각의 적분은 유계이다.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2023 p.74'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        구간 $[2,\infty)$에서 임의의 $x$를 택하자. $x=2n+c$를 만족하는 자연수 $n$과 $0\le c<2$가 존재하므로
        $\displaystyle\int_{-x}^{x}f(t)dt=\int_{-2n-c}^{2n+c}f(t)dt=\int_{-2n-c}^{-2n}f(t)dt+\int_{-2n}^{2n}f(t)dt+\int_{2n}^{2n+c}f(t)dt$이다.
        $f(x+2)=f(x)$이므로 $\displaystyle\int_{-2n}^{2n}f(t)dt=2n\int_0^2f(t)dt$이고 $\displaystyle\int_{2n}^{2n+c}f(t)dt=\int_0^cf(2n+t)dt=\int_0^cf(t)dt$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\displaystyle\int_0^2f(x)dx=\int_0^1f(x)dx+\int_1^2f(x)dx=\int_2^3f(x)dx+\int_1^2f(x)dx=\int_1^3f(x)dx=1$이므로
        $\displaystyle\frac1x\int_{-x}^{x}f(t)dt=\frac{2n}{x}+\frac1x\int_0^cf(t)dt+\frac1x\int_{-c}^0f(t)dt$이다. 이때 $\dfrac{x-2}{x}\le\dfrac{2n}{x}\le1$이고 $\displaystyle\lim_{x\to\infty}\frac{x-2}{x}=1$이므로 $\displaystyle\lim_{x\to\infty}\frac{2n}{x}=1$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        이제 $\displaystyle\lim_{x\to\infty}\frac1x\int_0^cf(t)dt=0$임을 보이자. $c=0$인 경우에는 당연히 성립하므로 $0<c<2$라 가정하자. 함수 $\lvert f(x)\rvert$가 닫힌구간 $[0,2]$에서 연속이므로 제시문 [다]의 최대·최소 정리에 의하여 $\lvert f(x)\rvert$는 최댓값을 갖는다. 최댓값을 $M$이라고 하면 구간 $[0,c]$에 속하는 임의의 $x$에 대하여 $-M\le f(x)\le M$이므로
        $\displaystyle-2M\le-cM=\int_0^c(-M)dt\le\int_0^cf(t)dt\le\int_0^cM\,dt=cM\le2M$이 성립한다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        이때 $\displaystyle-\frac{2M}{x}\le\frac1x\int_0^cf(t)dt\le\frac{2M}{x}$이고 $\displaystyle\lim_{x\to\infty}\frac{2M}{x}=0$이므로 $\displaystyle\lim_{x\to\infty}\frac1x\int_0^cf(t)dt=0$이다. 마찬가지로 $\displaystyle\lim_{x\to\infty}\frac1x\int_{-c}^0f(t)dt=0$이 성립한다. 그러므로 $\displaystyle\lim_{x\to\infty}\frac1x\int_{-x}^{x}f(t)dt=1$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $x=2n+c$로 나누고 주기성으로 $\int_{-2n}^{2n}f=2n\int_0^2f$, $\int_{2n}^{2n+c}f=\int_0^cf$로 바꾸었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $\int_0^2f=\int_1^3f=1$을 보이고 $\frac{2n}{x}\to1$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        제시문 [다]의 최대·최소 정리로 $\lvert f\rvert\le M$을 얻어 나머지 적분을 $\pm2M$으로 눌렀다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        나머지 항이 0으로 수렴함을 보이고 극한값 1을 얻었다.
      depends_on: [2.A1, 2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    【4-3】 함수 $f(x)$가 열린구간 $\left(0,\,\dfrac\pi2\right)$에서 감소함을 보이시오.
  points: 15
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=\frac{x\cos x-\sin x}{x^2}$이고 제시문 [라]의 $x<\tan x$에서 $x\cos x<\sin x$.
    steps:
    - {id: 3a, content: '$x\cos x-\sin x<0\Rightarrow f''(x)<0$', criteria: ['3.M1', '3.A1', '3.R1']}
    hint_ladder:
    - 몫의 미분법으로 도함수를 구하고 분자의 부호를 보자.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2023 p.75'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        제시문 [라]로부터 $0<x<\dfrac\pi2$일 때 $\dfrac{1}{\tan x}<\dfrac1x<\dfrac{1}{\sin x}$이므로 $\dfrac{\cos x}{\sin x}<\dfrac1x$, 즉 $x\cos x-\sin x<0$이다.
      criteria: ['3.A1']
    - id: 3b-2
      content: |
        따라서 $f'(x)=\dfrac{x\cos x-\sin x}{x^2}<0$이 성립하여 $f(x)$는 열린구간 $\left(0,\dfrac\pi2\right)$에서 감소한다.
      criteria: ['3.M1', '3.R1']
  rubric:
