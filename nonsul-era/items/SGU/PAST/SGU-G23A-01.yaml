intent: |
  확률과 통계의 기본 내용인 확률의 기본개념, 이항정리, 확률질량함수, 이항분포, 정규분포를 이해하고 활용할 수 있는지 평가한다. 이항정리와 다항식의 계수 형성 원리, 확률의 기본성질, 확률변수와 확률질량함수의 뜻, 이항분포의 확률질량함수, 이항분포·정규분포·표준정규분포의 관계, 표준정규분포표를 이용한 확률 계산 역량을 본다(공식 출제의도 요지).
key_idea: |
  확률의 합이 1이라는 조건을 이항정리의 계수 비교($(1+x)^{10}(1+x)^{10}=(1+x)^{20}$)나 $\{s+(1-s)\}^{21}$, $\{s-(1-s)\}^{21}$의 전개로 바꾸고, 상금 $g(i)=2^i+(-1)^i$을 이항정리로 합한다.
stuck: |
  $\sum({}_{10}\mathrm{C}_i)^2$을 $x^{10}$의 계수로 보는 발상, 홀수 차수 항만의 합을 두 이항전개의 차로 만드는 발상, 표의 $g(i)$가 $2^i+(-1)^i$임을 알아보는 것
