intent: |
  미적분 내용인 삼각함수의 정의와 활용, 함수의 극한, 삼각함수의 덧셈정리 등을 이용할 수 있는지와 미분계수의 정의, 함수의 미분가능성, 미분계수와 접선의 기울기 등을 이해하고 기하학적 문제에 활용할 수 있는지 평가한다. 이차방정식의 근과 계수의 관계, 접선이 원과 만나는 경우, 두 교점 사이의 거리를 구하는 능력을 본다(공식 출제의도 요지).
key_idea: |
  $\angle\mathrm{POQ}=t^2$이므로 $S(t)=\lvert\sin(t^2)\rvert$이고, 미분가능성은 $\sin(t^2)=0$인 점에서 좌·우미분계수를 비교한다. 접선 $x+a^2y-2a=0$과 원점 사이의 거리를 반지름 $3^{\frac14}$과 비교하고 $a^2=\cot\theta$로 바꾼다.
stuck: |
  두 점의 각의 차 $t^2$이 $\pi$를 넘으면 사잇각이 $2\pi-t^2$이 된다는 점, $4a^2\le\sqrt3(1+a^4)$를 $a^2=\cot\theta$로 바꾸는 것, 현의 길이를 중심과 직선 사이 거리로 구하는 것
