- id: '4'
  stem: |
    위 문항【2-3】의 점 $\mathrm{R}$을 접점으로 하는 곡선 $y=\dfrac1x$의 접선이 원 $x^2+y^2=\sqrt3$과 서로 다른 두점 $\mathrm{A}$, $\mathrm{B}$에서 만난다고 하자. 선분 $\mathrm{AB}$의 길이를 $\theta$의 함수 $l(\theta)$로 나타낼 때, 극한값 $\displaystyle\lim_{\theta\to0+}\frac{l(\theta)^2-4\sqrt3}{\theta}$를 구하시오.
  points: 25
  depends_on: ['3']
  answer: {kind: value, value: '-16', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $\left(\tfrac{l}{2}\right)^2=\sqrt3-\tfrac{4a^2}{1+a^4}$, $a^2=\cot\theta$이므로 $l^2-4\sqrt3=-\tfrac{16\cot\theta}{1+\cot^2\theta}=-16\sin\theta\cos\theta$.
    steps:
    - {id: 4a, content: '$\dfrac{l(\theta)^2-4\sqrt3}{\theta}=-16\dfrac{\sin\theta\cos\theta}{\theta}\to-16$', criteria: ['4.M1', '4.A1']}
    hint_ladder:
    - 원의 중심에서 현에 내린 수선은 현을 이등분한다.
    - '$\dfrac{\cot\theta}{1+\cot^2\theta}$를 $\sin\theta$, $\cos\theta$로 나타내 보시오.'
  - id: S4-B
    audience: B
    source_flow: '논술가이드북2024 p.61 (PDF p.32)'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        문항【2-3】의 풀이에서 접선 $x+a^2y-2a=0$에 대하여 원점 $\mathrm{O}$에서 내린 수선의 발을 $\mathrm{T}$라 하면 선분 $\mathrm{OT}$의 길이는 원점과 접선 사이의 거리 $\dfrac{2a}{\sqrt{1+a^4}}$와 같다. 삼각형 $\mathrm{OTA}$는 직각삼각형이므로 피타고라스 정리에 의해 $\left\{\dfrac{l(\theta)}{2}\right\}^2=\sqrt3-\left(\dfrac{2a}{\sqrt{1+a^4}}\right)^2$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        $$\frac{\{l(\theta)\}^2-4\sqrt3}{\theta}=\frac{-16a^2}{(1+a^4)\theta}=\frac{-16\cot\theta}{(1+\cot^2\theta)\theta}=-16\frac{\sin\theta\cos\theta}{\theta}$$
      criteria: ['4.M1']
    - id: 4b-3
      content: |
        따라서 제시문 [다]에 의해 $\displaystyle\lim_{\theta\to0+}\frac{\{l(\theta)\}^2-4\sqrt3}{\theta}=-16$이다.
      criteria: ['4.A1']
