stimuli:
- label: 가
  body: |
    삼각형 $\mathrm{ABC}$에서 꼭짓점 $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$에 각각 대응하는 대변의 길이를 $a$, $b$, $c$라 하면, 삼각형 $\mathrm{ABC}$의 넓이 $S$는 $S=\dfrac12ab\sin C$
- label: 나
  body: |
    함수 $f(x)$에 대하여 극한값 $\displaystyle\lim_{\Delta x\to0}\frac{f(a+\Delta x)-f(a)}{\Delta x}$이 존재하면, 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다. 이때 이 극한값을 함수 $f(x)$의 $x=a$에서의 순간변화율 또는 미분계수라 하며, 이것을 기호로 $f'(a)$와 같이 나타낸다. 함수 $f(x)$가 어떤 구간에 속하는 모든 $x$서 미분가능하면 함수 $f(x)$는 그 구간에서 미분가능하다고 한다. 함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 방정식은 $y-f(a)=f'(a)(x-a)$이다.
- label: 다
  body: |
    $\displaystyle\lim_{x\to0}\frac{\sin x}{x}=1$ (단, $x$의 단위는 라디안)
- label: 라
  body: |
    좌표평면 위의 한 점 $(x_1,y_1)$과 직선 $ax+by+c=0$ 사이의 거리는 $\dfrac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$이다.

stem: |
  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    원점이 $\mathrm{O}$인 좌표평면 위의 점 $\mathrm{P}$의 좌표가 $(\cos t,\sin t)$이고, 점 $\mathrm{Q}$의 좌표는 $(2\cos(t^2+t),2\sin(t^2+t))$이다. 세 점 $\mathrm{O}$, $\mathrm{P}$, $\mathrm{Q}$가 한 직선 위에 있지 않게 되는 실수 $t$에 대해서 함수 $S(t)$는 삼각형 $\mathrm{OPQ}$의 넓이로 정의하고, 세 점 $\mathrm{O}$, $\mathrm{P}$, $\mathrm{Q}$가 한 직선 위에 있는 $t$에 대해서는 $S(t)=0$이라고 정의한다.
    $-\sqrt{2\pi}<t<\sqrt{2\pi}$ 일 때, $S(t)$를 구하시오.
  points: 25
  depends_on: []
  answer: {kind: expression, value: 'Abs(sin(t**2))', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{OP}=1$, $\mathrm{OQ}=2$, 두 반직선의 각의 차가 $t^2\in[0,2\pi)$이므로 $S(t)=\tfrac12\cdot1\cdot2\lvert\sin t^2\rvert$.
    steps:
    - {id: 1a, content: '$0<t^2<\pi$: $S=\sin(t^2)$, $\pi<t^2<2\pi$: $S=\sin(2\pi-t^2)=-\sin(t^2)$, 따라서 $S(t)=\lvert\sin(t^2)\rvert$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 점 $\mathrm{P}$, $\mathrm{Q}$가 $x$축의 양의 방향과 이루는 각은 각각 얼마인가?
    - 두 각의 차 $t^2$이 $\pi$보다 크면 삼각형의 각 $\mathrm{O}$는 얼마인가?
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2024 p.60 (PDF p.32)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\angle\mathrm{POQ}=t^2$이고 $\overline{\mathrm{OP}}=1$, $\overline{\mathrm{OQ}}=2$이다. $t^2=0$ 또는 $t^2=\pi$이면 $S(t)=0$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $0<t^2<\pi$일 때 삼각형 $\mathrm{OPQ}$의 $\angle\mathrm{O}$의 크기는 $t^2$이므로 제시문 [가]에 의해 $S(t)=\sin(t^2)$이다.
        $\pi<t^2<2\pi$일 때 삼각형 $\mathrm{OPQ}$의 $\angle\mathrm{O}$의 크기는 $2\pi-t^2$이므로 $S(t)=\sin(2\pi-t^2)=-\sin(t^2)$이다.
        [그림: 원점 O에서 각 t 방향의 점 P와 각 t^2+t 방향의 점 Q, 두 반직선 사이의 각 t^2 표시]
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        따라서 $S(t)=\lvert\sin(t^2)\rvert$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 12
      evidence: |
        삼각함수의 정의로 $\angle\mathrm{POQ}$를 $t^2$(또는 $2\pi-t^2$)로 나타내고 제시문 [가]의 넓이 공식을 예각·둔각 경우로 나누어 적용했다(공식 채점기준).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 13
      evidence: |
        $S(t)=\lvert\sin(t^2)\rvert$(세 점이 일직선일 때 0 포함)을 정확히 구했다(공식 채점기준).
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    제시문 [나]를 이용하여, 위 문항【2-1】에서의 함수 $S(t)$가 미분가능하지 않은 실수 $t$의 값을 모두 구하시오. (단, $-\sqrt{2\pi}<t<\sqrt{2\pi}$)
  points: 25
  depends_on: ['1']
  answer: {kind: set, value: '{-sqrt(pi), sqrt(pi)}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\sin(t^2)=0$인 $t=0,\pm\sqrt\pi$만 조사. $t=0$에서는 $\tfrac{\lvert\sin h^2\rvert}{h}\to0$, $t=\sqrt\pi$에서는 좌·우미분계수 $\mp2\sqrt\pi$.
    steps:
    - {id: 2a, content: '$t=0$: 미분계수 0. $t=\pm\sqrt\pi$: 우미분계수 $2\sqrt\pi$, 좌미분계수 $-2\sqrt\pi$(대칭) → 미분불가능', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 절댓값 안이 0이 되는 $t$는 어디인가?
    - 그 점에서 좌미분계수와 우미분계수를 제시문 [다]를 써서 구하시오.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2024 p.60 (PDF p.32)'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $t$가 $-\sqrt\pi<t<0$ 또는 $0<t<\sqrt\pi$일 때 $S(t)=\sin(t^2)$이므로 미분가능한 두 함수 $\sin t$와 $t^2$의 합성함수인 $S(t)$는 미분가능하다. $t$가 $-\sqrt{2\pi}<t<-\sqrt\pi$ 또는 $\sqrt\pi<t<\sqrt{2\pi}$일 때 $S(t)=-\sin(t^2)$이므로 미분가능하다. 제시문 [나]와 [다]를 이용하여 $t=0,\ \pm\sqrt\pi$일 때 미분가능성을 조사한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $t=0$일 때 $\displaystyle\lim_{h\to0}\frac{S(h)-S(0)}{h}=\lim_{h\to0}\frac1h\lvert\sin(h^2)\rvert=\lim_{h\to0}h\frac{\sin(h^2)}{h^2}=0$
        따라서 $S(t)$는 $t=0$에서 미분가능하다.
      criteria: ['2.M1']
      # 메모: 원문 셋째 변은 'lim h·sin(h²)/h²'로 인쇄. h<0 쪽에서는 |h|·sin(h²)/h² 가 정확하나 극한값 0은 같음(원문 그대로 둠)
    - id: 2b-3
      content: |
        $t=\sqrt\pi$일 때 $\displaystyle\lim_{h\to0}\frac{S(\sqrt\pi+h)-S(\sqrt\pi)}{h}=\lim_{h\to0}\frac{\lvert\sin(\pi+2\sqrt\pi h+h^2)\rvert}{h}=\lim_{h\to0}\frac{\lvert\sin(2\sqrt\pi h+h^2)\rvert}{h}$이다.
        $h\to0+$인 경우 $0<h(2\sqrt\pi+h)<\pi$이므로 제시문 [다]에 의해 $\displaystyle\lim_{h\to0+}\frac{\sin(2\sqrt\pi h+h^2)}{h}=\lim_{h\to0+}(2\sqrt\pi+h)\frac{\sin(2\sqrt\pi h+h^2)}{(2\sqrt\pi+h)h}=2\sqrt\pi$.
        $h\to0-$인 경우 $-\pi<h(2\sqrt\pi+h)<0$이므로 $\displaystyle\lim_{h\to0-}\frac{-\sin(2\sqrt\pi h+h^2)}{h}=-\lim_{h\to0-}(2\sqrt\pi+h)\frac{\sin(2\sqrt\pi h+h^2)}{(2\sqrt\pi+h)h}=-2\sqrt\pi$.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        좌극한과 우극한이 다르므로 $S(t)$는 $t=\sqrt\pi$에서 미분가능하지 않다. 그리고 $S(t)=S(-t)$이므로 대칭에 의해 $S(t)$는 $t=-\sqrt\pi$에서 미분가능하지 않다. 답: $t=\pm\sqrt\pi$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 12
      evidence: |
        제시문 [나]의 정의로 후보점 $t=0,\pm\sqrt\pi$에서 미분계수(좌·우극한)를 조사하는 식을 세웠다(공식 채점기준).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 12}
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 13
      evidence: |
        제시문 [다]로 $t=\sqrt\pi$에서 우미분계수 $2\sqrt\pi$, 좌미분계수 $-2\sqrt\pi$를 구하고, $t=0$은 미분가능, 답 $t=\pm\sqrt\pi$를 얻었다(공식 채점기준).
      depends_on: [2.M1]
      steps: [2b-3, 2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $a$가 1보다 큰 실수이고, 원점이 $\mathrm{O}$인 좌표평면에서 곡선 $y=\dfrac1x$ 위의 한 점 $\mathrm{R}\left(a,\dfrac1a\right)$에 대하여 $x$축의 양의 방향과 반직선 $\mathrm{OR}$이 이루는 각의 크기를 $\theta$(라디안)라 하자. 점 $\mathrm{R}$에서의 접선이 원 $x^2+y^2=\sqrt3$과 만날 때 $\theta$의 범위를 구하시오.
  points: 25
  depends_on: []
  answer: {kind: set, value: 'Interval.Lopen(0, pi/6)', equivalents: ['0 < theta <= pi/6'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 접선 $x+a^2y-2a=0$과 원점 사이 거리 $\tfrac{2a}{\sqrt{1+a^4}}\le3^{\frac14}$, $a^2=\cot\theta$로 바꿔 $\cot\theta\ge\sqrt3$.
    steps:
    - {id: 3a, content: '$4a^2\le\sqrt3(1+a^4)\iff(\sqrt3a^2-1)(a^2-\sqrt3)\ge0$, $a>1$이므로 $\cot\theta=a^2\ge\sqrt3$, $0<\theta\le\dfrac{\pi}{6}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 반직선 $\mathrm{OR}$의 기울기로 $a$와 $\theta$의 관계를 구하시오.
    - 접선이 원과 만날 조건을 중심과 직선 사이 거리로 쓰시오.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2024 p.60~61 (PDF p.32)'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        직선 $\mathrm{OR}$의 방정식은 $y=(\tan\theta)x$이고 곡선 $y=\dfrac1x$과의 교점이 $\mathrm{R}\left(a,\dfrac1a\right)$이므로 $a\tan\theta=\dfrac1a$를 만족하고 $a^2=\cot\theta$이다.
        [그림: 원 $x^2+y^2=\sqrt3$, 곡선 $y=\dfrac1x$, 점 R에서의 접선이 원과 A, B에서 만나고 O에서 접선에 내린 수선의 발 T]
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        제시문 [나]에 의해 점 $\mathrm{R}\left(a,\dfrac1a\right)$에서의 접선의 방정식은 $x+a^2y-2a=0$이고 제시문 [라]에 의해 원점과 접선 사이의 거리는 $\dfrac{2a}{\sqrt{1+a^4}}$가 된다. 이 거리가 원의 반지름 $3^{\frac14}$보다 작거나 같으면 접선과 원이 만나므로 $a$는 부등식 $4a^2\le\sqrt3(1+a^4)$을 만족한다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        이 부등식은 $a^2$에 관한 이차부등식이고 인수분해하면 $(\sqrt3a^2-1)(a^2-\sqrt3)\ge0$을 만족하므로 $\cot\theta=a^2\ge\sqrt3$ 또는 $\cot\theta=a^2\le\dfrac{1}{\sqrt3}$이다. $a>1$이므로 $\cot\theta>1$이고 $0<\theta<\dfrac{\pi}{4}$이다. 따라서 $\cot\theta\ge\sqrt3$이고 $0<\theta\le\dfrac{\pi}{6}$이다.
      criteria: ['3.A1']
  rubric:
