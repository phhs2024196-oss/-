intent: |
  원과 직선의 성질을 이해하고 미적분의 기본 내용과 삼각함수를 기하적 상황에 활용할 수 있는지 평가한다. 두 직선의 수직 조건, 원과 직선의 위치 관계와 점과 직선 사이의 거리, 부채꼴의 호의 길이와 넓이, 수열의 합, 삼각함수의 극한을 본다(공식 출제의도 요지).
key_idea: |
  이등변삼각형 $\mathrm{OAB}$의 밑각 $\dfrac{\beta-\alpha}{2}$로 직선 $\mathrm{OB}$의 경사각 $\dfrac{\alpha+\beta}{2}$를 구하고, 같은 구조를 $x$축과 직선 $s$에 적용하면 원의 중심은 $(1,0)$을 지나는 기울기 $-\cot\dfrac{\beta}{2}$의 직선 위에 있다. 반지름은 $r\tan\dfrac{\beta}{2}=1-(\text{P의 }x\text{좌표})$, 중심각 $\angle\mathrm{PCQ}=\beta$.
stuck: |
  【3-1】의 이등변삼각형 구조를 $x$축·직선 $s$·원의 중심에 대응시키는 것, 중심각 $\angle\mathrm{QCP}=\beta$를 알아보는 것
