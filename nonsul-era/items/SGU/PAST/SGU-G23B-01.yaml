stimuli:
- label: 가
  body: |
    좌표평면 위의 한 점 $(x_1,y_1)$과 직선 $ax+by+c=0$ 사이의 거리는 다음과 같다.
    $$\frac{\lvert ax_1+by_1+c\rvert}{\sqrt{a^2+b^2}}$$
- label: 나
  body: |
    반지름의 길이가 $r$, 중심각의 크기가 $\theta$(라디안)인 부채꼴의 호의 길이를 $l$, 넓이를 $S$라고 하면, $l=r\theta$, $S=\dfrac12r^2\theta=\dfrac12rl$ 이다.
- label: 다
  body: |
    $\displaystyle\lim_{x\to0}\frac{\sin x}{x}=1$ (단, $x$의 단위는 라디안)

stem: |
  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    아래 그림에서와 같이 좌표평면 위의 세 점 $\mathrm{O}(0,0)$, $\mathrm{A}$, $\mathrm{B}$가 있고, 두 점 $\mathrm{O}$, $\mathrm{A}$를 지나는 직선과 두 점 $\mathrm{A}$, $\mathrm{B}$를 지나는 직선이 $x$축의 양의 방향과 이루는 각의 크기가 각각 $\alpha=\dfrac{\pi}{12}$, $\beta=\dfrac{\pi}{4}$라고 하자. 선분 $\mathrm{OA}$와 선분 $\mathrm{AB}$의 길이가 모두 1일 때, 두 점 $\mathrm{O}$, $\mathrm{B}$를 지나는 직선에 수직인 직선의 기울기를 구하시오.
    [그림: 원점 O에서 경사각 α인 선분 OA, A에서 경사각 β인 선분 AB(제1사분면), 선분 OB]
  points: 25
  depends_on: []
  answer: {kind: value, value: '-sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 이등변삼각형 $\mathrm{OAB}$의 밑각이 $\dfrac{\beta-\alpha}{2}=\dfrac{\pi}{12}$이므로 직선 $\mathrm{OB}$의 경사각은 $\dfrac{\pi}{6}$.
    steps:
    - {id: 1a, content: '경사각 $\alpha+\dfrac{\beta-\alpha}{2}=\dfrac{\pi}{6}$, 수직인 직선의 기울기 $\tan\left(\dfrac{\pi}{2}+\dfrac{\pi}{6}\right)=-\sqrt3$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 삼각형 $\mathrm{OAB}$는 어떤 삼각형인가?
    - 점 $\mathrm{A}$에서의 외각을 $\alpha$, $\beta$로 나타내 보시오.
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2024 p.65 (PDF p.34)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 점 $\mathrm{O}$, $\mathrm{A}$를 지나는 직선이 두 점 $\mathrm{A}$, $\mathrm{B}$를 지나는 직선과 이루는 각 중 예각의 크기는 $\beta-\alpha$이므로 이등변삼각형 $\mathrm{OAB}$의 두 밑각의 크기는 $\dfrac{\beta-\alpha}{2}=\dfrac{\pi}{12}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 두 점 $\mathrm{O}$, $\mathrm{B}$를 지나는 직선과 $x$축의 양의 방향이 이루는 각의 크기는 $\alpha+\dfrac{\beta-\alpha}{2}=\dfrac{\pi}{12}+\dfrac{\pi}{12}=\dfrac{\pi}{6}$이다.
        [그림: 각 α, β, 밑각 (β−α)/2, 직선 OB의 경사각 (α+β)/2, OB에 수직인 직선]
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        이 직선에 수직인 직선의 기울기는 $\tan\left(\dfrac{\pi}{2}+\dfrac{\pi}{6}\right)=-\cot\dfrac{\pi}{6}$이므로 $-\sqrt3$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 12
      evidence: |
        두 점 $\mathrm{O}$, $\mathrm{B}$를 지나는 직선이 $x$축의 양의 방향과 이루는 각 $\dfrac{\pi}{6}$을 구했다(공식 채점기준).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 13
      evidence: |
        서로 수직인 직선의 기울기 $-\sqrt3$을 구했다(공식 채점기준).
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    아래 그림에서와 같이 점 $(1,0)$을 지나고 $x$축의 양의 방향과 이루는 각의 크기가 $\beta$(라디안)인 직선 $s$가 있다. 이때, 중심이 $\mathrm{C}(a,b)$인 원이 $x$축과 직선 $s$에 동시에 접한다. $x$축과의 접점을 $\mathrm{P}$, 직선 $s$와의 접점을 $\mathrm{Q}$라 하자. 아래 문항【3-2】~【3-4】에 답하시오. (단, $a<1$, $b>0$, $0<\beta\le\dfrac{\pi}{2}$)
    [그림: 중심 C인 원이 x축과 점 P에서, 점 (1,0)을 지나는 경사각 β의 직선 s와 점 Q에서 접함]

    【3-2】 $\beta=\dfrac{\pi}{3}$ 일 때 위의 조건을 만족하는 원들의 중심을 모두 지나는 직선의 방정식을 구하시오. 그리고 이 직선의 방정식과 제시문 [가]를 이용하여 $x$축, 직선 $s$, $y=\dfrac{5}{12}x$로 이루어진 삼각형에 내접하는 원의 반지름을 구하시오.
  points: 25
  depends_on: ['1']
  answer: {kind: expression, value: 'line: y = -sqrt(3)*(x-1); r = (15-sqrt(3))/74', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 【3-1】에서 $\alpha=0$, $\beta=\dfrac{\pi}{3}$인 경우이므로 중심이 지나는 직선의 기울기는 $-\cot\dfrac{\pi}{6}=-\sqrt3$. 중심 $\left(1-\dfrac{b}{\sqrt3},b\right)$에서 $y=\dfrac5{12}x$까지 거리 $=b$.
    steps:
    - {id: 2a, content: '$y=-\sqrt3(x-1)$, $13b=\left\lvert5\left(1-\dfrac{b}{\sqrt3}\right)-12b\right\rvert$, $a<1$인 내접원 조건에서 $r=b=\dfrac{15-\sqrt3}{74}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 【3-1】의 직선 $\mathrm{OA}$, $\mathrm{AB}$를 $x$축과 직선 $s$로 보면 어떻게 대응하는가?
    - 원의 중심을 한 문자로 나타내고 직선 $y=\dfrac{5}{12}x$까지의 거리가 반지름과 같다고 놓으시오.
    - 절댓값을 풀 때 생기는 두 값 중 조건 $a$에 맞는 것을 고르시오.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2024 p.65 (PDF p.34)'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        직선 $s$ 위에 있고 점 $(1,0)$으로부터의 거리가 1인 1사분면 위의 점을 $\mathrm{B}$라 하자. 그러면 두 점 $\mathrm{C}$, $(1,0)$을 지나는 직선과 두 점 $\mathrm{O}$, $\mathrm{B}$를 지나는 직선은 항상 수직임을 알 수 있다. 따라서 원들의 중심을 모두 지나는 직선의 기울기는 문항【3-1】 풀이에서 $\alpha=0$, $\beta=\dfrac{\pi}{3}$인 경우이므로 $-\cot\dfrac{\pi}{6}=-\sqrt3$이다. 그리고 이 직선이 점 $(1,0)$을 지나기 때문에 직선의 방정식은 $y=-\sqrt3(x-1)$이다.
      criteria: ['2.M1']
      # 메모: 원문 답안 사례에는 '문항 【1-1】 풀이에서'로 인쇄됨 — 문맥상 【3-1】의 오식으로 보고 【3-1】로 적음
    - id: 2b-2
      content: |
        원의 중심의 $y$좌표를 $b$라고 하면 원의 중심의 좌표는 $\left(1-\dfrac{b}{\sqrt3},b\right)$이고, 이 원의 중심과 직선 $5x-12y=0$의 거리는 제시문 [가]에 의해 $\dfrac{1}{13}\left\lvert5\left(1-\dfrac{b}{\sqrt3}\right)-12b\right\rvert$이다. 이 거리와 원의 반지름의 길이가 같을 때 직선이 원에 접하므로 $13b=\left\lvert5\left(1-\dfrac{b}{\sqrt3}\right)-12b\right\rvert$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $5\left(1-\dfrac{b}{\sqrt3}\right)-12b<0$이면 $b=\dfrac{25\sqrt3+15}{22}$이고 이때 원의 중심의 $x$좌표가 $a=1-\dfrac{b}{\sqrt3}=1-\dfrac{25\sqrt3+15}{22\sqrt3}<0$이므로 $x$축, 직선 $s$, $y=\dfrac{5}{12}x$로 이루어진 삼각형의 내접원이 될 수 없다.
        $5\left(1-\dfrac{b}{\sqrt3}\right)-12b>0$이면 $b=\dfrac{15-\sqrt3}{74}$이고 반지름의 길이는 $r=\dfrac{15-\sqrt3}{74}$이다. 따라서 구하는 내접원의 반지름의 길이는 $r=\dfrac{15-\sqrt3}{74}$이다.
        [그림: 직선 $y=-\sqrt3(x-1)$ 위의 중심, 직선 $y=\dfrac{5}{12}x$, 직선 s(β=π/3)로 이루어진 삼각형의 내접원]
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 12
      evidence: |
        점 $\mathrm{C}$와 $(1,0)$을 지나는 직선의 기울기 $-\sqrt3$과 방정식 $y=-\sqrt3(x-1)$을 구했다(공식 채점기준).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 12}
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 13
      evidence: |
        제시문 [가]의 점과 직선 사이의 거리로 방정식을 세우고 부적합한 근을 제외하여 반지름 $\dfrac{15-\sqrt3}{74}$을 구했다(공식 채점기준).
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $\beta=\dfrac{\pi}{3}$ 이고 $\mathrm{P}$의 좌표가 $\left(\dfrac{n}{100},0\right)$이라 하자. 중심각의 크기가 $\pi$(라디안)보다 작은 부채꼴 $\mathrm{CPQ}$에서 호 $\mathrm{PQ}$의 길이 $l_n$과 $\displaystyle\sum_{n=1}^{99}l_n$을 구하시오. (단, 자연수 $n$의 범위는 $1\le n\le99$)
  points: 25
  depends_on: ['2']
  answer: {kind: expression, value: 'l_n = sqrt(3)*pi/3*(1-n/100); sum = 33*sqrt(3)*pi/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\triangle\mathrm{CPA}\equiv\triangle\mathrm{CQA}$($\mathrm{A}(1,0)$), $\angle\mathrm{PCQ}=\beta=\dfrac{\pi}{3}$, $r\tan\dfrac{\pi}{6}=1-\dfrac{n}{100}$.
    steps:
    - {id: 3a, content: '$r=\sqrt3\left(1-\dfrac{n}{100}\right)$, $l_n=\dfrac{\sqrt3\pi}{3}\left(1-\dfrac{n}{100}\right)$, $\sum_{n=1}^{99}l_n=\dfrac{33\sqrt3\pi}{2}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 사각형 $\mathrm{CPAQ}$의 네 각을 생각하면 $\angle\mathrm{PCQ}$는 얼마인가?
    - '$\overline{\mathrm{PA}}=1-\dfrac{n}{100}$과 반지름의 관계를 직각삼각형으로 쓰시오.'
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2024 p.66 (PDF p.35)'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        점 $(1,0)$을 $\mathrm{A}$라 하면 두 삼각형 $\mathrm{CPA}$와 $\mathrm{CQA}$는 합동인 직각삼각형이다. 따라서 원의 반지름의 길이를 $r$라 하면 $r\tan\dfrac{\beta}{2}=r\tan\dfrac{\pi}{6}=1-\dfrac{n}{100}$이므로 $r=\sqrt3\left(1-\dfrac{n}{100}\right)$이다.
        [그림: 중심 C, 접점 P, Q, 점 A(1,0), ∠PCA=β/2=π/6, OP=n/100, PA=1−n/100]
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        따라서 호 $\mathrm{PQ}$의 길이는 $l_n=r\theta=\dfrac{\sqrt3\pi}{3}\left(1-\dfrac{n}{100}\right)$이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        $$\sum_{n=1}^{99}l_n=\sum_{n=1}^{99}\frac{\sqrt3\pi}{3}\left(1-\frac{n}{100}\right)=\frac{\sqrt3\pi}{3}\left(99-\sum_{n=1}^{99}\frac{n}{100}\right)=\frac{33\sqrt3\pi}{2}$$
      criteria: ['3.A1']
  rubric:
