      content: |
        문항【3-3】의 풀이에서 원과 $x$축의 접점이 $(1-d,0)$일 때, 원의 반지름의 길이는 $r=\dfrac{d}{\tan\frac{\beta}{2}}$이므로 부채꼴 $\mathrm{CPQ}$의 넓이는 $S(\beta)=\dfrac12r^2\beta=\dfrac{d^2\beta}{2\tan^2\frac{\beta}{2}}$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        따라서 제시문 [다]에 의해
        $$\lim_{\beta\to0+}S(\beta)\tan\beta=\lim_{\beta\to0+}\frac{d^2\beta}{2\tan^2\frac{\beta}{2}}\tan\beta=\lim_{\beta\to0+}\frac{4d^2\left(\frac{\beta}{2}\right)^2}{2\tan^2\frac{\beta}{2}}\cdot\frac{\tan\beta}{\beta}=\lim_{\beta\to0+}\frac{4d^2\left(\frac{\beta}{2}\right)^2\cos^2\frac{\beta}{2}}{2\sin^2\frac{\beta}{2}}\cdot\frac{\sin\beta}{\beta\cos\beta}=2d^2$$
      criteria: ['4.A1']
    - id: 4b-3
      content: |
        $d=\dfrac34$이므로 $\displaystyle\lim_{\beta\to0+}S(\beta)\tan\beta=\dfrac98$이다.
