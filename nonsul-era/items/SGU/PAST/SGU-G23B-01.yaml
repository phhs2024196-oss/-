    steps:
    - {id: 4a, content: '$S(\beta)\tan\beta=\dfrac{d^2\beta\tan\beta}{2\tan^2\frac{\beta}{2}}\to2d^2=\dfrac98$', criteria: ['4.M1', '4.A1']}
    hint_ladder:
    - 【3-3】의 반지름 식을 일반적인 $\beta$에 대해 쓰시오.
    - '$\tan\dfrac{\beta}{2}\approx\dfrac{\beta}{2}$가 되도록 제시문 [다]를 쓰시오.'
