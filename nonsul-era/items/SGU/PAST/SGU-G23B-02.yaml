    key_idea: $S(p)+R(p)=h\left(\tfrac1e\right)$, $S(p)=\dfrac{p(1-p)}{2(p+1)}\left(\tfrac1e\right)^{p+1}$, 비를 $\dfrac{e}{1-p}\left\{p(e-2)+e-2\dfrac{e^p-1}{p}\right\}$로 정리.
