intent: |
  미적분의 기본 내용을 바탕으로 함수의 도함수와 정적분을 이해하고 다양한 상황에 활용할 수 있는지 평가한다. 특히 접선의 방정식, 함수의 증가와 감소, 극대와 극소, 함수의 그래프와 두 곡선 사이의 넓이에 활용할 수 있는지, 다항함수·지수함수의 극한으로 극한값을 구할 수 있는지, 도함수와 이계도함수로 그래프의 개형을 그릴 수 있는지 본다(공식 출제의도 요지).
key_idea: |
  $x^p$($0<p<1$)는 위로 볼록이므로 접선 $l(x)=pc^{p-1}x+(1-p)c^p$이 항상 위에 있고, 넓이 $h(c)=\dfrac{p}{2}c^{p-1}+(1-p)c^p-\dfrac{1}{p+1}$을 $c$로 미분해 $c=\dfrac12$에서 최소. $c=\dfrac1e$이면 $S(p)+R(p)=h\left(\dfrac1e\right)$, $S(p)=\dfrac{p(1-p)}{2(p+1)}\left(\dfrac1e\right)^{p+1}$.
stuck: |
  $\dfrac{d(x)}{x}$의 좌극한에서 근호 밖으로 나오는 부호, 【4-4】에서 $S+R$을 【4-3】의 $h(c)$로 재활용하고 $\dfrac{e^p-1}{p}\to1$ 꼴로 정리하는 것
