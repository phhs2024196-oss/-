    audience: B
    source_flow: '논술가이드북2024 p.71 (PDF p.37)'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        문항【4-2】로부터 $0\le x<\dfrac1e$ 또는 $x>\dfrac1e$일 때 $l(x)>x^p$이므로, $S(p)$와 $R(p)$는 아래 그림의 도형 $\mathrm{A}$와 $\mathrm{B}$의 넓이가 된다.
        [그림: 곡선 $y=x^p$과 $x=\dfrac1e$에서 접하는 직선, $0\le x\le\dfrac1e$ 부분의 도형 A와 $\dfrac1e\le x\le1$ 부분의 도형 B]
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        제시문 [라]에 의해
        $$S(p)=\int_0^{\frac1e}p\left(\frac1e\right)^{p-1}x-(p-1)\left(\frac1e\right)^p-x^pdx=\left\{\frac p2-(p-1)-\frac{1}{p+1}\right\}\left(\frac1e\right)^{p+1}=\frac{p(1-p)}{2(p+1)}\left(\frac1e\right)^{p+1}$$
      criteria: ['4.M1']
    - id: 4b-3
      content: |
        문항【4-3】에 의해 $S(p)+R(p)=h\left(\dfrac1e\right)=\left(\dfrac e2p-p+1\right)\left(\dfrac1e\right)^p-\dfrac{1}{p+1}$이다. 따라서
        $$\frac{S(p)+R(p)}{S(p)}=\frac{e\{p^2(e-2)+ep+2(1-e^p)\}}{p(1-p)}=\frac{e}{1-p}\left\{p(e-2)+e-2\frac{e^p-1}{p}\right\}$$
      criteria: ['4.A1']
    - id: 4b-4
      content: |
        $\displaystyle\lim_{p\to0}\frac{e^p-1}{p}=1$이므로 $\displaystyle\lim_{p\to0+}\frac{S(p)+R(p)}{S(p)}=e^2-2e$이다.
      criteria: ['4.A1']
