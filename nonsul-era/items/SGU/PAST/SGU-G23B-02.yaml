stimuli:
- label: 가
  body: |
    함수 $f(x)$의 $x=a$에서의 극한값이 $L$이면 $x=a$에서의 우극한과 좌극한이 모두 존재하고 그 값은 모두 $L$과 같다. 또 그 역도 성립하므로 다음이 성립한다.
    $$\lim_{x\to a}f(x)=L\iff\lim_{x\to a+}f(x)=\lim_{x\to a-}f(x)=L$$
- label: 나
  body: |
    함수 $f(x)$가 어떤 구간에서 미분가능하고 이 구간의 모든 $x$에서
    (1) $f'(x)>0$ 이면 $f(x)$는 이 구간에서 증가한다.
    (2) $f'(x)<0$ 이면 $f(x)$는 이 구간에서 감소한다.
- label: 다
  body: |
    함수 $y=f(x)$의 그래프의 개형은 다음과 같은 사항을 조사하여 그릴 수 있다.
    (1) 함수의 정의역과 치역 (2) 곡선의 대칭성과 주기 (3) 좌표축과의 교점
    (4) 함수의 증가와 감소, 극대와 극소 (5) 곡선의 볼록과 변곡점
    (6) $\displaystyle\lim_{x\to\infty}f(x)$, $\displaystyle\lim_{x\to-\infty}f(x)$, 점근선
- label: 라
  body: |
    닫힌구간 $[a,b]$에서 연속인 두 함수 $y=f(x)$, $y=g(x)$의 그래프와 두 직선 $x=a$, $x=b$로 둘러싸인 도형 $S$의 넓이는
    $$S=\int_a^b\lvert f(x)-g(x)\rvert dx$$

stem: |
  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    실수 $x$에 대하여 두 점 $(0,1)$, $(x,e^x)$ 사이의 거리를 $d(x)$라 하자. 극한 $\displaystyle\lim_{x\to0}\frac{d(x)}{x}$의 수렴, 발산 여부를 조사하고, 수렴하면 그 극한값을 구하시오. (단, 무리수 $e=\displaystyle\lim_{x\to0}(1+x)^{\frac1x}$)
  points: 25
  depends_on: []
  answer: {kind: expression, value: 'right = sqrt(2); left = -sqrt(2); limit = DNE', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{d(x)}{x}=\pm\sqrt{1+\left(\dfrac{e^x-1}{x}\right)^2}$(부호는 $x$의 부호)이므로 우극한 $\sqrt2$, 좌극한 $-\sqrt2$ → 극한 없음(발산).
    steps:
    - {id: 1a, content: '$\displaystyle\lim_{x\to0+}\frac{d(x)}{x}=\sqrt2$, $\displaystyle\lim_{x\to0-}\frac{d(x)}{x}=-\sqrt2$이므로 극한값은 존재하지 않는다', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - '$x<0$일 때 $x=-\sqrt{x^2}$임에 주의하시오.'
    - '$e$의 정의에서 $\displaystyle\lim_{x\to0}\frac{e^x-1}{x}$를 구하시오.'
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2024 p.70 (PDF p.36)'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $d(x)=\sqrt{x^2+(e^x-1)^2}$이고 무리수 $e$의 정의로부터 $\displaystyle\lim_{x\to0}\frac{e^x-1}{x}=1$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        우극한을 구하면 $\displaystyle\lim_{x\to0+}\frac{\sqrt{x^2+(e^x-1)^2}}{x}=\lim_{x\to0+}\sqrt{\frac{x^2+(e^x-1)^2}{x^2}}=\lim_{x\to0+}\sqrt{1+\left(\frac{e^x-1}{x}\right)^2}=\sqrt2$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $x=-t$로 치환하여 좌극한을 구하면 $\displaystyle\lim_{x\to0-}\frac{d(x)}{x}=\lim_{x\to0-}\frac{\sqrt{x^2+(e^x-1)^2}}{x}=\lim_{t\to0+}\frac{\sqrt{t^2+(e^{-t}-1)^2}}{-t}=-\lim_{t\to0+}\sqrt{1+\left(\frac{e^{-t}-1}{-t}\right)^2}=-\sqrt2$.
        우극한과 좌극한의 값이 다르므로 제시문 [가]에 의해 극한값은 존재하지 않는다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 12
      evidence: |
        두 점 사이의 거리 $d(x)=\sqrt{x^2+(e^x-1)^2}$를 구하고 극한을 표현했다(공식 채점기준).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 13
      evidence: |
        $e$의 정의로 우극한 $\sqrt2$, 좌극한 $-\sqrt2$를 구하고 제시문 [가]로 극한값이 존재하지 않음을 밝혔다(공식 채점기준).
      depends_on: [1.M1]
      steps: [1b-2, 1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    두 실수 $p$, $c$는 $0<p<1$와 $c>0$를 만족하고, 곡선 $y=x^p$ $(x\ge0)$ 위의 점 $(c,c^p)$에서의 접선의 방정식을 $y=l(x)$라 하자. 문항【2-2】~【2-4】에 답하시오.

    【4-2】 $x\ge0$ 일 때 부등식 $l(x)\ge x^p$ 이 성립함을 보이시오. 이 부등식과 제시문 [다]를 이용하여 두 함수 $y=x^p$, $y=l(x)$의 그래프의 개형을 한 평면에 그리시오.
  # 메모: 공통 설정 문단의 '문항【2-2】~【2-4】'는 원문 그대로(문맥상 【4-2】~【4-4】의 오식). 공식 답안 사례도 【4-3】·【4-4】에서 '문항【2-2】','문항【2-3】'으로 인용함.
  points: 25
  depends_on: []
  answer: {kind: proof, value: 'l(x) = p*c**(p-1)*x + (1-p)*c**p; l(x) - x**p >= 0 (equality only at x=c)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=l(x)-x^p$은 $f(c)=f'(c)=0$이고 $f'(x)=p(c^{p-1}-x^{p-1})$의 부호가 $x=c$에서 음→양이므로 최솟값 0. $x^p$은 증가·위로 볼록.
    steps:
    - {id: 2a, content: '$f$는 $(0,c)$에서 감소, $(c,\infty)$에서 증가, $f(c)=0$, $f(0)=(1-p)c^p>0$ → $l(x)\ge x^p$', criteria: ['2.R1', '2.B1']}
    hint_ladder:
    - 접선의 방정식을 구하고 $f(x)=l(x)-x^p$을 정의해 보시오.
    - '$f^{\prime}(x)$의 부호는 $x$와 $c$의 대소로 결정된다.'
    - 그래프는 $y=x^p$의 증감·볼록성과 접선의 $y$절편 $(1-p)c^p$, $x$절편 $-\dfrac{(1-p)c}{p}$를 이용하시오.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2024 p.70 (PDF p.36)'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $x>0$일 때 $\dfrac{d}{dx}x^p=px^{p-1}$이므로 $l(x)=pc^{p-1}(x-c)+c^p=pc^{p-1}x+(1-p)c^p$이다.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        $f(x)=l(x)-x^p\ (x>0)$라 하면 $f'(x)=p(c^{p-1}-x^{p-1})$이고 $f(c)=f'(c)=0$이다. $0<x<c$일 때 $f'(x)<0$이고 $x>c$일 때 $f'(x)>0$이므로, 제시문 [나]에 의해 $f(x)$는 $0<x<c$일 때 감소, $x>c$일 때 증가한다. 따라서 $x>0$에서 $f(x)=l(x)-x^p\ge0$이다. $x=0$일 때 $l(0)=(1-p)c^p>0^p$이므로 $x\ge0$에서 부등식이 성립한다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        제시문 [다]를 바탕으로 함수 $y=x^p$의 정의역 및 치역, 증감, 볼록, 극한을 조사한다. $\displaystyle\lim_{x\to\infty}x^p=\infty$이므로 정의역과 치역은 모두 $[0,\infty)$이다. $x>0$일 때 $\dfrac{d}{dx}x^p=px^{p-1}>0$, $\dfrac{d^2}{dx^2}x^p=p(p-1)x^{p-2}<0$이므로 함수 $y=x^p$의 그래프는 증가하면서 위로 볼록이다. 그리고 $l(x)\ge x^p$이므로 두 함수의 그래프의 개형은 다음과 같다.
        [그림: 원점에서 시작해 증가하며 위로 볼록한 곡선 $y=x^p$과, $x=c$에서 접하고 $y$절편 $(1-p)c^p$, $x$절편 $-\dfrac{(1-p)c}{p}$인 직선 $y=l(x)$가 곡선 위쪽에 놓임]
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 13
      evidence: |
        접선 $l(x)$를 구하고 $f(x)=l(x)-x^p$의 도함수 부호와 제시문 [나]로 $x>0$에서 $f\ge0$, $x=0$에서도 성립함을 보였다(공식 채점기준).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.B1
      mark_type: B
      points: 12
      evidence: |
        제시문 [다]의 방법(정의역·치역, 증감, 볼록, 극한)으로 $y=x^p$(증가·위로 볼록)과 그 위에 놓인 접선 $y=l(x)$의 개형을 한 평면에 그렸다(공식 채점기준).
      depends_on: []
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $c>0$에 대하여 두 함수 $y=x^p$, $y=l(x)$의 그래프와 두 직선 $x=0$, $x=1$로 둘러싸인 도형의 넓이가 최소가 되는 $c$의 값을 구하시오. (단, 여기서 $p$는 부등식 $0<p<1$을 만족하는 고정된 실수)
  points: 25
  depends_on: ['2']
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 【4-2】로 절댓값 없이 $h(c)=\displaystyle\int_0^1\{l(x)-x^p\}dx=\frac p2c^{p-1}+(1-p)c^p-\frac1{p+1}$, $h'(c)=p(p-1)c^{p-2}\left(\tfrac12-c\right)$.
    steps:
    - {id: 3a, content: '$h^{\prime}(c)<0\ (0<c<\tfrac12)$, $h^{\prime}(c)>0\ (c>\tfrac12)$ → $c=\dfrac12$에서 최소', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 【4-2】의 부등식으로 넓이의 절댓값을 없애시오.
    - 넓이를 $c$의 함수로 보고 미분하시오.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2024 p.70 (PDF p.36)'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        제시문 [라]와 문항【4-2】의 부등식으로부터 도형의 넓이는
        $$h(c)=\int_0^1\{pc^{p-1}x-(p-1)c^p-x^p\}dx=\frac p2c^{p-1}-(p-1)c^p-\frac{1}{p+1}$$
        이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $h(c)$의 최솟값을 구하기 위해 함수 $h$를 미분하면 $h'(c)=\dfrac{p(p-1)}{2}c^{p-2}-p(p-1)c^{p-1}=p(p-1)c^{p-2}\left(\dfrac12-c\right)$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $h'\left(\dfrac12\right)=0$이고 $0<c<\dfrac12$일 때 $h'(c)<0$, $c>\dfrac12$일 때 $h'(c)>0$이다. 따라서 제시문 [나]에 의해 $h(c)$는 $0<c<\dfrac12$일 때 감소, $c>\dfrac12$일 때 증가한다. 따라서 $c=\dfrac12$에서 넓이가 최소가 된다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 12
      evidence: |
        제시문 [라]와 【4-2】의 부등식으로 넓이 $h(c)=\dfrac p2c^{p-1}+(1-p)c^p-\dfrac1{p+1}$을 구했다(공식 채점기준).
