- id: '4'
  stem: |
    $c=\dfrac1e$ 일 때 두 함수 $y=x^p$, $y=l(x)$의 그래프와 직선 $x=0$으로 둘러싸인 도형의 넓이를 $S(p)$, 두 함수 $y=x^p$, $y=l(x)$의 그래프와 직선 $x=1$으로 둘러싸인 도형의 넓이를 $R(p)$라 하자. 극한 $\displaystyle\lim_{p\to0+}\frac{S(p)+R(p)}{S(p)}$의 수렴, 발산 여부를 조사하고, 수렴하면 그 극한값을 구하시오.
