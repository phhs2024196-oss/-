stimuli:
- label: 가
  body: |
    함수 $f(x)$가 어떤 구간에 속하는 모든 실수 $x$에서 연속일 때, $f(x)$는 그 구간에서 연속이라고 한다.
- label: 나
  body: |
    함수 $f(x)$가 어떤 구간에 속하는 모든 실수 $x$에서 미분가능하면 $f(x)$는 그 구간에서 미분가능하다고 한다.
- label: 다
  body: |
    함수 $f(x)$가 어떤 구간에 속하는 임의의 두 실수 $x_1,\ x_2$에 대하여 $x_1<x_2$일 때, $f(x_1)<f(x_2)$이면
    그 구간에서 증가한다고 한다.
- label: 라
  # 원문 문장 그대로(‘사건 A가 일어났을 B때의 사건 의’ — 원본 PDF의 어순 오류를 고치지 않음)
  body: |
    사건 A가 일어났을 B때의 사건 의 조건부확률은 $\mathrm{P}(B\mid A)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(A)}$ 이다. (단, $\mathrm{P}(A)>0$)

# 원문에서 둘째 문단(카드 시행)은 【1-2】와 【1-3】 사이에 있음 — 공통 발문에 함께 옮김
stem: |
  자연수 $n$에 대하여 $a,b,c,d$는 각각 $-n$보다 크거나 같고 $n$보다 작거나 같은 정수이다. $-1\le x\le1$에서 $f(x)$를 다음과 같이 정의하자.
  $$f(x)=\begin{cases}x & (-1\le x<0)\\ d & (x=0)\\ \dfrac{a}{2}x^2+bx+c & (0<x\le1)\end{cases}$$

  자연수 $n$에 대하여 $-n$부터 $n$까지 서로 다른 정수가 적힌 $2n+1$장의 카드가 주머니에 들어있다. 주머니에서 임의로 한 장을 뽑아 수를 확인하고 주머니에 다시 넣는다. 이 시행을 4번 반복하여 나온 수를 차례로 위에 정의된 함수 $f(x)$의 $a,b,c,d$라 하자. 문항 【1-3】과 【1-4】에 답하시오.

subparts:
- id: '1-1'
  stem: |
    $f(x)$가 닫힌구간 $[-1,\ 1]$에서 증가하는 함수가 되도록 하는 순서쌍 $(a,\ b)$와 $(c,\ d)$의 개수를 각각 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'ab=n*(3*n+5)/2; cd=(n+1)*(n+2)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: $x=0$에서 $0\le d\le c$, $[0,1]$에서 이차함수의 증가를 $a=0$, $a>0$, $a<0$으로 나눈다.
    steps:
    - {id: 11a, content: '$(a,b)$: $n+n(n+1)+\tfrac{n(n+1)}{2}=\tfrac{n(3n+5)}{2}$, $(c,d)$: ${}_{n+1}\mathrm{H}_2=\tfrac{(n+1)(n+2)}{2}$', criteria: ['1-1.M1', '1-1.A1', '1-1.M2', '1-1.A2']}
    hint_ladder:
    - $x=0$에서 증가하려면 왼쪽 극한, 함숫값, 오른쪽 극한 사이에 어떤 대소가 필요한가?
    - $[0,1]$에서 이차함수가 증가하려면 대칭축은 어디에 있어야 하는가? $a$의 부호로 나누어 보자.
  - id: S11-B
    audience: B
    source_flow: '논술가이드북2025 p.52'
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        구간 $[-1,0)$에서 $f(x)=x$는 증가한다. $x=0$에서 $\displaystyle\lim_{x\to0-}f(x)\le f(0)\le\lim_{x\to0+}f(x)$를 만족해야 하므로 $0\le d\le c\le n$을 얻는다.
      criteria: ['1-1.M1']
    # 원문 ③은 'a>0일 때'로 인쇄됨(그림은 위로 볼록) — 내용상 a<0 이므로 해설에서는 a<0으로 적음
    - id: 11b-2
      content: |
        구간 $[0,1]$에서 $f(x)$가 증가할 조건을 세 경우로 나눈다.
        ① $a=0$일 때, $0<b\le n$이므로 $(a,b)$의 개수는 $n$.
        ② $a>0$일 때, $-\dfrac{b}{a}\le0$이므로 $0\le b\le n$이 되어 $(a,b)$의 개수는 $n(n+1)$.
        ③ $a<0$일 때, $-\dfrac{b}{a}\ge1$이므로 $0<-a\le b\le n$이 되어 $(a,b)$의 개수는 $\dfrac{n(n+1)}{2}$.
      criteria: ['1-1.M1']
    - id: 11b-3
      content: |
        그러므로 $(a,b)$의 개수는 $n+n(n+1)+\dfrac{n(n+1)}{2}=\dfrac{n(3n+5)}{2}$이다.
      criteria: ['1-1.A1']
    - id: 11b-4
      content: |
        한편 $(c,d)$는 $0\le d\le c\le n$을 만족해야 하므로 $(c,d)$의 개수는 ${}_{n+1}\mathrm{H}_2={}_{n+2}\mathrm{C}_2=\dfrac{(n+2)(n+1)}{2}$이다.
      criteria: ['1-1.M2', '1-1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
      mark_type: M
      points: 3
      evidence: |
        증가의 정의([다])를 적용해 $0\le d\le c$와 $[0,1]$에서 이차함수 증가 조건(대칭축 위치)을 경우별로 세웠다.
      depends_on: []
      implied_ok: false
      steps: [11b-1, 11b-2]
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        $(a,b)$의 개수 $\dfrac{n(3n+5)}{2}$를 얻었다.
      depends_on: [1-1.M1]
      steps: [11b-3]
    - id: 1-1.M2
      mark_type: M
      points: 2
      evidence: |
        $0\le d\le c\le n$인 $(c,d)$의 개수를 중복조합으로 세었다.
      depends_on: [1-1.M1]
      implied_ok: false
      steps: [11b-4]
    - id: 1-1.A2
      mark_type: A
      points: 2
      evidence: |
        $(c,d)$의 개수 $\dfrac{(n+1)(n+2)}{2}$를 얻었다.
      depends_on: [1-1.M2]
      steps: [11b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-2'
  stem: |
    $f(x)$가 닫힌구간 $[-1,\ 1]$에서 증가하는 연속함수이고 열린구간 $(-1,\ 1)$에서 미분가능한 함수라 하자.
    $\displaystyle\int_{-1}^{1}f(x)dx\le1$을 만족하는 순서쌍 $(a,\ b)$와 $(c,\ d)$의 개수를 각각 구하시오.
  points: 10
  depends_on: ['1-1']
  answer: {kind: expression, value: 'ab=Piecewise((n+2, n<=5), (8, True)); cd=1', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: 연속이면 $c=d=0$, 미분가능하면 $b=1$, 증가면 $-1\le a$, 적분 조건에서 $a\le6$.
    steps:
    - {id: 12a, content: '$-1\le a\le\min(n,6)$ → $(a,b)$: $1\le n\le5$이면 $n+2$, $n\ge6$이면 $8$; $(c,d)$: $1$', criteria: ['1-2.M1', '1-2.M2', '1-2.M3', '1-2.A1']}
    hint_ladder:
    - $x=0$에서 연속·미분가능하려면 $c,d,b$는 각각 얼마여야 하는가?
    - $\int_{-1}^0x\,dx$를 먼저 계산하면 $\int_0^1$ 쪽에 남는 조건은?
  - id: S12-B
    audience: B
    source_flow: '논술가이드북2025 p.52~53'
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        (연속 조건) $f(x)$는 $[-1,0)$과 $(0,1]$에서 다항함수이므로 연속이다. $x=0$에서 연속일 조건은 $f(0)=d$, $\displaystyle\lim_{x\to0-}f(x)=0$, $\displaystyle\lim_{x\to0+}f(x)=c$가 모두 같은 것이므로 $c=d=0$이다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        (미분가능 조건) $x=0$에서 미분가능할 조건은 $\displaystyle\lim_{h\to0+}\frac{\frac a2h^2+bh-0}{h}=b$와 $\displaystyle\lim_{h\to0-}\frac{h-0}{h}=1$이 같은 것이므로 $b=1$이다.
      criteria: ['1-2.M2']
    - id: 12b-3
      content: |
        (증가하고 미분가능할 조건) $b=1$이므로 【1-1】로부터 $-1\le a\le n$이다.
      criteria: ['1-2.M2']
    - id: 12b-4
      content: |
        (적분 조건) $\displaystyle\int_{-1}^0f(x)dx=\int_{-1}^0x\,dx=-\frac12$이므로 $\displaystyle\int_0^1f(x)dx\le\frac32$이어야 한다. $\dfrac32\ge\displaystyle\int_0^1\left(\frac a2x^2+x\right)dx=\frac a6+\frac12$, 즉 $a\le6$이다.
      criteria: ['1-2.M3']
    - id: 12b-5
      content: |
        그러므로 $n\ge6$일 때 $-1\le a\le6$이고, $1\le n\le5$일 때 $-1\le a\le n$이다. 따라서 $(c,d)$의 개수는 $1$이고, $(a,b)$의 개수는 $1\le n\le5$일 때 $n+2$, $n\ge6$일 때 $8$이다.
      criteria: ['1-2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-2.M1
      mark_type: M
      points: 3
      evidence: |
        연속의 정의([가])로 $x=0$에서 $c=d=0$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [12b-1]
    - id: 1-2.M2
      mark_type: M
      points: 3
      evidence: |
        미분가능의 정의([나])로 좌·우 미분계수를 비교해 $b=1$을 얻고, 【1-1】의 증가 조건에서 $-1\le a\le n$을 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1-1.M1], max_points: 3}
      steps: [12b-2, 12b-3]
    - id: 1-2.M3
      mark_type: M
      points: 2
      evidence: |
        정적분 $\dfrac a6+\dfrac12-\dfrac12\le1$을 계산해 $a\le6$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [12b-4]
    - id: 1-2.A1
      mark_type: A
      points: 2
      evidence: |
        $(c,d)$ 1개, $(a,b)$는 $1\le n\le5$일 때 $n+2$, $n\ge6$일 때 $8$로 $n$에 따라 나누어 답했다.
      depends_on: [1-2.M1, 1-2.M2, 1-2.M3]
      steps: [12b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    위 시행으로부터 얻어진 함수 $f(x)$가 닫힌구간 $[-1,\ 1]$에서 연속일 때, $f(x)$가가 증가하는 함수일 확률을 구하시오.
  # '$f(x)$가가' 원문 그대로
  points: 10
  depends_on: ['1-1', '1-2']
  answer: {kind: expression, value: 'n*(3*n+5)/(2*(2*n+1)**2)', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 연속인 경우 $c=d=0$이므로 $(2n+1)^2$가지, 그중 증가는 【1-1】의 $(a,b)$ 개수.
    steps:
    - {id: 13a, content: '$\dfrac{n(3n+5)/2}{(2n+1)^2}=\dfrac{n(3n+5)}{2(2n+1)^2}$', criteria: ['1-3.M1', '1-3.A1']}
    hint_ladder:
    - 연속이라는 조건에서 $c,d$는 고정된다. 남은 자유도는?
  - id: S13-B
    audience: B
    source_flow: '논술가이드북2025 p.53'
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        정수 $a,b,c,d$는 각각 $-n$ 이상 $n$ 이하이므로 근원사건의 개수는 $(2n+1)^4$이다.
      criteria: ['1-3.M1']
    - id: 13b-2
      content: |
        ($f(x)$가 연속함수일 확률) 【1-2】로부터 $f(x)$가 연속함수일 $a,b,c,d$의 개수는 $(2n+1)^2$이므로 확률은 $\dfrac{(2n+1)^2}{(2n+1)^4}=\dfrac{1}{(2n+1)^2}$이다.
      criteria: ['1-3.M1']
    - id: 13b-3
      content: |
        ($f(x)$가 증가하는 연속함수일 확률) $c=d=0$에서 증가하는 $(a,b)$의 개수는 【1-1】로부터 $\dfrac{n(3n+5)}{2}$이므로 확률은 $\dfrac{n(3n+5)}{2(2n+1)^4}$이다.
      criteria: ['1-3.M1']
