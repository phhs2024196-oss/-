  함수의 연속·미분가능·증가의 정의를 구간별로 정의된 함수에 적용해 조건을 찾고, 중복조합과 정적분으로 순서쌍의 개수를 센 뒤 이를 조건부확률 계산에 활용하는 능력을 본다.
