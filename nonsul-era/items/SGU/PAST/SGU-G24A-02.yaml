    audience: A
    method_no: 1
    key_idea: $t_k=t+k$, $\mathrm{R}_k$의 넓이 $e^{-t-k}$이므로 $A(t)=(t-e^{-1}+S_n)e^{-t}$, $a_n=1+e^{-1}-S_n$.
    steps:
    - {id: 24a, content: '$S_n=\sum_{k=1}^ne^{-k}\to\dfrac{1}{e-1}$, $\lim a_n=1+\dfrac1e-\dfrac1{e-1}$', criteria: ['2-4.M1', '2-4.M2', '2-4.A1']}
    hint_ladder:
    - 【2-3】에서 $x$절편이 접점보다 얼마나 커졌는가? 그것이 반복되면?
  - id: S24-B
    audience: B
    source_flow: '논술가이드북2025 p.59'
    method_no: 1
    steps:
    - id: 24b-1
      content: |
        $\mathrm{R}_0$의 넓이는 $(t-e^{-1})e^{-t}$이다. $k=1,2,\dots,n$일 때 점 $(t+k-1,\ e^{-t-k+1})$에서의 접선은 $y=-e^{-t-k+1}(x-t-k+1)+e^{-t-k+1}$이므로 $x$절편은 $t_k=t+k$가 되어 $\mathrm{R}_k$의 넓이는 $e^{-t-k}$이다.
      criteria: ['2-4.M1']
    - id: 24b-2
      content: |
        넓이의 합을 $A(t)$, $S_n=\displaystyle\sum_{k=1}^ne^{-k}$라 하면 $A(t)=(t-e^{-1})e^{-t}+e^{-t}S_n=(t-e^{-1}+S_n)e^{-t}\ (t>e^{-1})$이고 $A'(t)=(1-t+e^{-1}-S_n)e^{-t}$이다.
      criteria: ['2-4.M1']
    - id: 24b-3
      content: |
        증감표에 의해 $A(t)$는 $t=a_n=1+e^{-1}-S_n$에서 최댓값을 갖는다.
      criteria: ['2-4.M2']
    - id: 24b-4
      content: |
        $\displaystyle\lim_{n\to\infty}S_n=\sum_{n=1}^\infty e^{-n}$은 첫째항이 $e^{-1}$, 공비가 $e^{-1}$인 등비급수이므로 $\dfrac{e^{-1}}{1-e^{-1}}=\dfrac{1}{e-1}$이다. 따라서 $\displaystyle\lim_{n\to\infty}a_n=1+\frac1e-\frac1{e-1}$.
      criteria: ['2-4.A1']
