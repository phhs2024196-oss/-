- id: '2-4'
  stem: |
    $c=\dfrac1e$일 때, $n+1$개의 직사각형 $\mathrm{R}_0,\mathrm{R}_1,\mathrm{R}_2,\dots,\mathrm{R}_n$의 넓이의 합이 최대가 되는 $t$를 $a_n$이라 하자.
