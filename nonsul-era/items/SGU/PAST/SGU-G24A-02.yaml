intent: |
  속도와 정적분으로 평면 위 점의 이동 거리를 구하고 치환적분하며, 도함수로 부등식을 증명해 극한을 구하고 그래프 개형을 그리며, 접선과 직사각형 넓이의 최댓값과 등비급수를 활용하는 능력을 본다.
key_idea: |
  근호 안을 $(2t+e^{2t})(e^{2t}+1)^2$으로 인수분해해 치환적분하고, $y=e^{-x}$의 접선의 $x$절편이 항상 접점보다 $1$ 크다는 사실로 직사각형 넓이 합을 $(t-c+\cdots)e^{-t}$ 꼴로 정리한다.
