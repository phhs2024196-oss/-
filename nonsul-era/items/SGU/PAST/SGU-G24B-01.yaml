  최단 경로·이웃하는 순열 등 경우의 수와 확률을 구하고, 합성함수의 미분으로 평면 운동의 속도·속력을 구하며, 도함수로 넓이가 최대가 되는 점의 유일성을 보이고 그 조건식으로 정적분을 계산하는 능력을 본다.
key_idea: |
  【1-4】 $S'(t)=0\iff\tan t=\dfrac{\pi}{2}-t$이고 이 근 $t_0$에서 $\displaystyle\int_0^{t_0}(1+\sec^2x)dx=t_0+\tan t_0=\frac{\pi}{2}$.
stuck: |
  $t_0$를 구체적으로 구하지 않고 $\tan t_0=\dfrac{\pi}{2}-t_0$ 관계만으로 적분값을 얻는 발상, 그리고 두 사람이 만나지 않는 경로 쌍을 체계적으로 세는 분류
