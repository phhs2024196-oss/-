      depends_on: []
      implied_ok: false
      steps: [11b-2, 11b-3]
    - id: 1-1.A1
      mark_type: A
      points: 3
      evidence: |
        확률 $\dfrac{3}{25}$를 얻었다.
      depends_on: [1-1.M1, 1-1.M2]
      steps: [11b-4]
    deductions: []
