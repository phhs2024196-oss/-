  misconceptions: []

- id: '1-2'
  stem: |
    I♡Sogang의 7개의 문자 I, S, o, g, a, n, g와 1개의 기호 ♡를 일렬로 나열할 때, 기호 ♡와 문자 g가 이웃하도록 나열하는 경우의 수를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '9360', equivalents: [], tolerance: null}
  solutions:
  - id: S12-A
    audience: A
    method_no: 1
    key_idea: ♡ 왼쪽에 g, 오른쪽에 g인 경우를 각각 묶어 세고 양쪽 모두인 경우를 뺀다.
    steps:
    - {id: 12a, content: '$7!+7!-6!=9360$', criteria: ['1-2.M1', '1-2.A1']}
    hint_ladder:
    - ‘g♡’를 한 덩어리로 보면 나머지 g와는 구별되는가?
  - id: S12-B
    audience: B
    source_flow: '논술가이드북2025 p.63'
    method_no: 1
    steps:
    - id: 12b-1
      content: |
        ① g가 ♡의 왼쪽에 이웃하는 경우의 수는 ‘g♡’, ‘I’, ‘S’, ‘o’, ‘a’, ‘n’, ‘g’를 일렬로 나열하는 경우의 수와 같으므로 $7!=5040$이다.
        ② g가 ♡의 오른쪽에 이웃하는 경우도 같은 방법으로 $7!=5040$이다.
      criteria: ['1-2.M1']
    - id: 12b-2
      content: |
        ③ g가 ♡의 왼쪽 및 오른쪽에 각각 이웃하는 경우의 수는 ‘g♡g’, ‘I’, ‘S’, ‘o’, ‘a’, ‘n’을 나열하는 경우의 수와 같으므로 $6!=720$이다.
      criteria: ['1-2.M1']
    - id: 12b-3
      content: |
        따라서 구하는 경우의 수는 $5040+5040-720=9360$이다.
      criteria: ['1-2.A1']
