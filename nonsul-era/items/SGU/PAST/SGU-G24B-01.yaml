  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-3'
  stem: |
    미분가능한 함수 $f(t)$에 대하여 좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서 위치 $(x,\ y)$가 $x=f(t),\ \ y=\sin f(t)$이다.
    $x=\dfrac{\pi}{3}$에서 점 $\mathrm{P}$의 속력이 1일 때, 점 $\mathrm{P}$의 속도로 가능한 것을 모두 구하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '[(2*sqrt(5)/5, sqrt(5)/5), (-2*sqrt(5)/5, -sqrt(5)/5)]', equivalents: [], tolerance: null}
  solutions:
  - id: S13-A
    audience: A
    method_no: 1
    key_idea: 속력 $\lvert f'(t)\rvert\sqrt{1+\cos^2f(t)}$에 $f(t_0)=\dfrac{\pi}{3}$을 대입한다.
    steps:
    - {id: 13a, content: '$\lvert f''(t_0)\rvert\sqrt{\tfrac54}=1\Rightarrow f''(t_0)=\pm\tfrac{2\sqrt5}{5}$, 속도 $\pm\left(\tfrac{2\sqrt5}{5},\tfrac{\sqrt5}{5}\right)$', criteria: ['1-3.M1', '1-3.A1']}
    hint_ladder:
    - $\dfrac{dy}{dt}$는 합성함수의 미분으로 구한다.
  - id: S13-B
    audience: B
    source_flow: '논술가이드북2025 p.63'
    method_no: 1
    steps:
    - id: 13b-1
      content: |
        $\dfrac{dx}{dt}=f'(t)$, $\dfrac{dy}{dt}=f'(t)\cos f(t)$이므로 제시문 [나]에 의해 점 $\mathrm{P}$의 속력은
        $\sqrt{\{f'(t)\}^2+\{f'(t)\cos f(t)\}^2}=\lvert f'(t)\rvert\sqrt{1+\cos^2f(t)}$
      criteria: ['1-3.M1']
    - id: 13b-2
      content: |
        $x=\dfrac{\pi}{3}$일 때의 시각을 $t_0$라 하면 $f(t_0)=\dfrac{\pi}{3}$이고 속력이 1이므로 $\lvert f'(t_0)\rvert\sqrt{1+\dfrac14}=1$.
      criteria: ['1-3.M1']
    - id: 13b-3
      content: |
        따라서 $\dfrac{dx}{dt}=f'(t_0)=\pm\dfrac{2\sqrt5}{5}$이고 $\dfrac{dy}{dt}=f'(t_0)\cos\dfrac{\pi}{3}=\pm\dfrac{\sqrt5}{5}$이다. 가능한 속도는 $\left(\dfrac{2\sqrt5}{5},\dfrac{\sqrt5}{5}\right)$, $\left(-\dfrac{2\sqrt5}{5},-\dfrac{\sqrt5}{5}\right)$이다.
      criteria: ['1-3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-3.M1
      mark_type: M
      points: 5
      evidence: |
        합성함수의 미분으로 속도 $(f'(t),\ f'(t)\cos f(t))$와 속력 $\lvert f'(t)\rvert\sqrt{1+\cos^2f(t)}$을 구하고 $f(t_0)=\dfrac{\pi}{3}$을 대입했다.
      depends_on: []
      implied_ok: false
      steps: [13b-1, 13b-2]
    - id: 1-3.A1
      mark_type: A
      points: 5
      evidence: |
        부호 두 가지를 모두 포함해 속도 $\pm\left(\dfrac{2\sqrt5}{5},\dfrac{\sqrt5}{5}\right)$을 답했다.
      depends_on: [1-3.M1]
      steps: [13b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '1-4'
  stem: |
    다음 그림과 같이 닫힌구간 $[0,\ \pi]$에서 두 곡선 $y=\sin x$와 $y=-\sin x$로 둘러싸인 도형에 내접하는 직사각형이 있다.
    직사각형의 한 꼭짓점의 좌표를 $(t,\ \sin t)$라 할 때, 직사각형의 넓이가 최대가 되는 $t=t_0$가 오직 하나 존재함을 보이시오.
    또한, 정적분 $\displaystyle\int_0^{t_0}(1+\sec^2x)dx$의 값을 구하시오.
    (단, $0<t<\dfrac{\pi}{2}$)

    [그림: $0\le x\le\pi$에서 $y=\sin x$와 $y=-\sin x$로 둘러싸인 렌즈 모양 도형 안에, 네 꼭짓점이 두 곡선 위에 있고 변이 좌표축에 평행한 직사각형. 왼쪽 위 꼭짓점이 $(t,\sin t)$]
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'pi/2', equivalents: [], tolerance: null}
  solutions:
  - id: S14-A
    audience: A
    method_no: 1
    key_idea: $S(t)=4\left(\dfrac{\pi}{2}-t\right)\sin t$, $S'(t)=0\iff\tan t=\dfrac{\pi}{2}-t$(유일근), 적분값 $t_0+\tan t_0=\dfrac{\pi}{2}$.
    steps:
    - {id: 14a, content: '$\displaystyle\int_0^{t_0}(1+\sec^2x)dx=t_0+\tan t_0=\frac{\pi}{2}$', criteria: ['1-4.M1', '1-4.R1', '1-4.A1']}
    hint_ladder:
    - 직사각형의 가로는 대칭성으로 $\pi-2t$이다.
    - $S'(t)=0$을 $\tan t$에 관한 식으로 바꾸고 두 그래프의 교점을 생각하자.
  - id: S14-B
    audience: B
    source_flow: '논술가이드북2025 p.64'
    method_no: 1
    steps:
    - id: 14b-1
      content: |
        직사각형의 넓이를 $S(t)$라 하면 $S(t)=2\left(\dfrac{\pi}{2}-t\right)\times2\sin t=4\left(\dfrac{\pi}{2}-t\right)\sin t\ \left(0<t<\dfrac{\pi}{2}\right)$.
      criteria: ['1-4.M1']
    - id: 14b-2
      content: |
        $S'(t)=-4\left\{\sin t-\left(\dfrac{\pi}{2}-t\right)\cos t\right\}=-4\cos t\left\{\tan t-\left(\dfrac{\pi}{2}-t\right)\right\}$이고 $0<t<\dfrac{\pi}{2}$일 때 $\cos t\ne0$이므로 $S'(t)=0$이기 위해서는 $\tan t=\dfrac{\pi}{2}-t$를 만족해야 한다.
      criteria: ['1-4.M1']
    - id: 14b-3
      content: |
        $f(t)=\tan t$, $g(t)=\dfrac{\pi}{2}-t$라 할 때 $f$는 증가, $g$는 감소하고 $f(0)<g(0)$, $\displaystyle\lim_{t\to\frac{\pi}{2}-}f(t)=\infty$, $g\left(\dfrac{\pi}{2}\right)=0$이므로 방정식 $f(t)=g(t)$는 오직 하나의 실근 $t_0$를 갖는다. $S'(t)$는 $t<t_0$에서 양, $t>t_0$에서 음이므로 $S(t)$는 $t=t_0$일 때만 최대가 된다.
      criteria: ['1-4.R1']
    - id: 14b-4
      content: |
        또한 $\tan t_0=\dfrac{\pi}{2}-t_0$이므로 $\displaystyle\int_0^{t_0}(1+\sec^2x)dx=\Big[x+\tan x\Big]_0^{t_0}=t_0+\tan t_0=\frac{\pi}{2}$.
      criteria: ['1-4.A1']
