stimuli:
- label: 가
  body: |
    서로 다른 $n$개에서 $r$개를 택하는 순열의 수는 ${}_n\mathrm{P}_r=n(n-1)(n-2)\cdots(n-r+1)$ (단, $0<r\le n$)
- label: 나
  body: |
    좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서 위치가 $(x,\ y)$이고, $x,y$가 $t$의 함수일 때, 시각 $t$에서 점 $\mathrm{P}$의
    속도는 $\left(\dfrac{dx}{dt},\ \dfrac{dy}{dt}\right)$, 속력은 $\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}$

stem: ''   # 원문에 공통 발문 없음(제시문 다음 바로 【1-1】)

subparts:
- id: '1-1'
  stem: |
    다음 그림과 같은 도로망이 있다. 서강이와 한국이는 $\mathrm{P}$지점을 동시에 출발하여 같은 속력으로 $\mathrm{Q}$지점까지 최단 경로로 이동한다. 서강이와 한국이가 이동 중에 만나지 않고 $\mathrm{Q}$지점에 도착할 확률을 구하시오.

    [그림: 가로 2칸, 세로 3칸(정사각형 6개)의 격자 도로망. 왼쪽 아래 꼭짓점이 $\mathrm{P}$, 오른쪽 위 꼭짓점이 $\mathrm{Q}$]
  points: 10
  depends_on: []
  answer: {kind: value, value: '3/25', equivalents: [], tolerance: null}
  solutions:
  - id: S11-A
    audience: A
    method_no: 1
    key_idea: 근원사건 $10\times10$; 만나지 않으려면 한 사람은 $\mathrm{P}\to\mathrm{F}$(위), 다른 사람은 $\mathrm{P}\to\mathrm{I}$(오른쪽)로 출발하고 $\mathrm{B}\to\mathrm{Q}$, $\mathrm{E}\to\mathrm{Q}$로 도착해야 한다.
    steps:
    - {id: 11a, content: '경우의 수 $(3+2+1)\times2=12$, 확률 $\dfrac{12}{100}=\dfrac{3}{25}$', criteria: ['1-1.M1', '1-1.M2', '1-1.A1']}
    hint_ladder:
    - 같은 속력으로 동시에 출발하면 두 사람이 만날 수 있는 곳은 어디인가?
    - 첫 걸음과 마지막 걸음이 서로 달라야 함을 확인해 보자.
  - id: S11-B
    audience: B
    source_flow: '논술가이드북2025 p.62~63'
    method_no: 1
    steps:
    - id: 11b-1
      content: |
        $\mathrm{P}$에서 $\mathrm{Q}$까지 최단 경로의 수는 $\dfrac{5!}{3!\,2!}=10$이므로 근원사건의 개수는 $10\times10=100$이다.
      criteria: ['1-1.M1']
    - id: 11b-2
      content: |
        격자점을 위에서부터 $\mathrm{A},\mathrm{B},\mathrm{Q}$ / $\mathrm{C},\mathrm{D},\mathrm{E}$ / $\mathrm{F},\mathrm{G},\mathrm{H}$ / $\mathrm{P},\mathrm{I},\mathrm{J}$라 하자. 만나지 않으려면 ① 서강이가 $\mathrm{F}$와 $\mathrm{B}$를 지나고 한국이가 $\mathrm{I}$와 $\mathrm{E}$를 지나거나, ② 그 반대여야 한다.
      criteria: ['1-1.M2']
    # 원문 그림 4~6 설명은 세 경로 모두 'PFCABQ'로 인쇄됨(그림의 빨간 선은 서로 다른 경로) — 그림 기준으로 서술
    - id: 11b-3
      content: |
        ①에서 서강이의 경로가 $\mathrm{PFCABQ}$이면 한국이는 3가지, $\mathrm{PFCDBQ}$이면 2가지, $\mathrm{PFGDBQ}$이면 1가지 경로로 이동할 수 있으므로 $3+2+1=6$가지이다. ②는 두 사람의 경로를 맞바꾼 것이므로 $6$가지이다.
      criteria: ['1-1.M2']
    - id: 11b-4
      content: |
        그러므로 만나지 않고 이동하는 경우는 $6+6=12$가지이고 구하는 확률은 $\dfrac{12}{100}=\dfrac{3}{25}$이다.
      criteria: ['1-1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1-1.M1
