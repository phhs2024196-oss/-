stimuli:
- label: 가
  body: |
    평면 위의 서로 다른 두 점 $\mathrm{F}$, $\mathrm{F}'$으로부터의 거리의 차가 일정한 점들의 집합을 쌍곡선이라고 하며,
    두 점 $\mathrm{F}$, $\mathrm{F}'$을 쌍곡선의 초점이라고 한다.
- label: 나
  body: |
    두 초점 $\mathrm{F}(c,\,0)$, $\mathrm{F}'(-c,\,0)$으로부터의 거리의 차가 $2a$인 쌍곡선의 방정식은 다음과 같다.
    $$\frac{x^2}{a^2}-\frac{y^2}{b^2}=1\ \ (\text{단, }c>a>0,\ b^2=c^2-a^2)$$
- label: 다
  body: |
    쌍곡선 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$위의 점 $\mathrm{P}(x_1,\,y_1)$에서의 접선의 방정식은 다음과 같다.
    $$\frac{x_1x}{a^2}-\frac{y_1y}{b^2}=1$$

stem: |
  제시문 [가]~[다]를 참고하여 다음 물음에 답하시오.
  좌표평면 위의 두 점 $\mathrm{A}(5,0)$과 $\mathrm{B}(-5,0)$에 대하여 같은 평면 위의 점 $\mathrm{C}$와 점 $\mathrm{P}$는 다음 조건을 동시에 만족시킨다.

  (i) $\overline{\mathrm{AC}}=6$
  (ii) 점 $\mathrm{P}$는 선분 $\mathrm{AC}$ 위에 있다.
  (iii) $\overline{\mathrm{BP}}+\overline{\mathrm{CP}}=8$

subparts:
- id: '1'
  stem: |
    【1-1】 점 $\mathrm{P}$가 그리는 도형이 쌍곡선의 일부가 됨을 보이고, 이 쌍곡선의 방정식을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'x**2 - y**2/24 = 1', equivalents: ['24*x**2 - y**2 = 24'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (i)(ii)에서 $\overline{\mathrm{AP}}+\overline{\mathrm{CP}}=6$, (iii)과 빼면 $\overline{\mathrm{BP}}-\overline{\mathrm{AP}}=2$.
    steps:
    - {id: 1a, content: '$\overline{\mathrm{BP}}-\overline{\mathrm{AP}}=2$, $c=5$, $a=1$, $b^2=24$이므로 $x^2-\dfrac{y^2}{24}=1$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 점 $\mathrm{P}$가 선분 $\mathrm{AC}$ 위에 있으면 $\overline{\mathrm{AP}}+\overline{\mathrm{PC}}$는 얼마인가?
    - 두 거리의 합 식을 빼 보자.
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2026 p.52 (PDF p.54) 답안 사례'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        세 조건에 의하여 $\overline{\mathrm{AP}}+\overline{\mathrm{CP}}=6$이고 $\overline{\mathrm{BP}}+\overline{\mathrm{CP}}=8$이므로 $\overline{\mathrm{BP}}-\overline{\mathrm{AP}}=2$이다. 따라서 점 $\mathrm{P}$는 점 $\mathrm{A}$와 점 $\mathrm{B}$로부터의 거리의 차가 $2$인 쌍곡선 위에 있다(제시문 [가]).
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        점 $\mathrm{A}(5,\,0)$과 점 $\mathrm{B}(-5,\,0)$은 쌍곡선의 두 초점이고 거리의 차는 $2$이므로 제시문 [나]에 의해 쌍곡선의 방정식은 $x^2-\dfrac{y^2}{24}=1$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $\overline{\mathrm{AP}}+\overline{\mathrm{CP}}=6$과 (iii)으로부터 $\overline{\mathrm{BP}}-\overline{\mathrm{AP}}=2$를 이끌고 쌍곡선의 정의와 연결했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $c=5$, $a=1$, $b^2=24$로 $x^2-\dfrac{y^2}{24}=1$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    【1-2】 문항 【1-1】에서 구한 쌍곡선 위의 점 $\mathrm{Q}$에서의 접선이 $y$축과 만나는 점을 $\mathrm{R}$이라고 하자.
    $\overline{\mathrm{QR}}$이 최소가 되는 점 $\mathrm{Q}$에 대하여 $\overline{\mathrm{OQ}}^2$의 값을 구하시오. (단, 점 $\mathrm{Q}$는 제2사분면 위에 있고 $\mathrm{O}$는 원점이다.)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '1 + 10*sqrt(6)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{QR}}^2=49+\dfrac{25}{24}y_2^2+\dfrac{24^2}{y_2^2}$에 산술·기하평균을 쓴다.
    steps:
    - {id: 2a, content: '등호 조건 $y_2^2=\dfrac{48\sqrt6}{5}$, $x_2^2=1+\dfrac{2\sqrt6}{5}$, $\overline{\mathrm{OQ}}^2=1+10\sqrt6$', criteria: ['2.M2', '2.A2']}
    hint_ladder:
    - 제시문 [다]로 접선을 쓰고 $y$절편을 구하자.
    - $x_2^2$을 $y_2^2$으로 바꾸면 합이 일정한 꼴이 아니라 곱이 일정한 꼴이 보인다.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2026 p.52 (PDF p.54) 답안 사례'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        제2사분면에 있는 쌍곡선 위의 한 점 $\mathrm{Q}(x_2,\,y_2)$에서의 접선의 방정식은 $x_2x-\dfrac{y_2y}{24}=1$이다(제시문 [다]).
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        점 $\mathrm{R}$의 좌표는 $\left(0,\,-\dfrac{24}{y_2}\right)$이고, $x_2^2-\dfrac{y_2^2}{24}=1$을 이용하면
        $$\overline{\mathrm{QR}}^2=x_2^2+\left(y_2+\frac{24}{y_2}\right)^2=49+\frac{25}{24}y_2^2+\frac{24^2}{y_2^2}$$
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        산술평균과 기하평균을 이용하여 절대부등식을 적용하면
        $$\overline{\mathrm{QR}}^2=49+\frac{25}{24}y_2^2+\frac{24^2}{y_2^2}\ge49+2\sqrt{\frac{25}{24}y_2^2\times\frac{24^2}{y_2^2}}=49+20\sqrt6$$
        이고, $\dfrac{25}{24}y_2^2=\dfrac{24^2}{y_2^2}$일 때 $\overline{\mathrm{QR}}^2$이 최소이고 $\overline{\mathrm{QR}}$도 최소이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $\dfrac{25}{24}y_2^2=\dfrac{24^2}{y_2^2}$을 풀면 $y_2^2=\dfrac{48\sqrt6}{5}$이고 $x_2^2=1+\dfrac{y_2^2}{24}=1+\dfrac{2\sqrt6}{5}$이므로
        $$\overline{\mathrm{OQ}}^2=x_2^2+y_2^2=1+10\sqrt6$$
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        제시문 [다]로 점 $\mathrm{Q}$에서의 접선 $x_2x-\dfrac{y_2y}{24}=1$을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\mathrm{R}\left(0,-\dfrac{24}{y_2}\right)$과 $\overline{\mathrm{QR}}^2=49+\dfrac{25}{24}y_2^2+\dfrac{24^2}{y_2^2}$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        산술평균과 기하평균의 관계(또는 미분)로 최소 조건 $\dfrac{25}{24}y_2^2=\dfrac{24^2}{y_2^2}$을 세웠다.
      depends_on: [2.A1]
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $\overline{\mathrm{OQ}}^2=1+10\sqrt6$을 얻었다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    【1-3】 점 $\mathrm{C}$와 점 $\mathrm{P}$가 일치할 때, 선분 $\mathrm{BC}$가 $y$축과 만나는 점을 $\mathrm{D}$라고 하자.
    $\angle\mathrm{COD}=\alpha$라고 할 때, $\cos\alpha$의 값을 구하시오. (단, $\mathrm{O}$는 원점이고 $0<\alpha<\dfrac{\pi}{2}$)
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '24/25', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\triangle\mathrm{ABC}$는 $\angle\mathrm{C}=\dfrac{\pi}{2}$인 직각삼각형이고 $\overline{\mathrm{OC}}=5$, $\angle\mathrm{BOC}=\dfrac{\pi}{2}+\alpha$에서 사인법칙.
    steps:
    - {id: 3a, content: '$\cos\alpha=\sin\left(\dfrac{\pi}{2}+\alpha\right)=\overline{\mathrm{BC}}\times\dfrac{\sin\theta}{\overline{\mathrm{OC}}}=8\cdot\dfrac{3/5}{5}=\dfrac{24}{25}$', criteria: ['3.M2', '3.A1']}
    hint_ladder:
    - $\mathrm{C}=\mathrm{P}$이면 $\overline{\mathrm{BC}}$는 얼마인가? 세 변 $10$, $8$, $6$을 보자.
    - 직각삼각형의 빗변의 중점은 외접원의 중심이다.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2026 p.53 (PDF p.55) 답안 사례'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        점 $\mathrm{C}$와 점 $\mathrm{P}$가 일치하면, 삼각형 $\mathrm{ABC}$는 $\overline{\mathrm{AB}}=10$, $\overline{\mathrm{BC}}=8$, $\overline{\mathrm{CA}}=6$이고 $\angle\mathrm{C}=\dfrac{\pi}{2}$인 직각삼각형이다. 원점 $\mathrm{O}$가 빗변 $\mathrm{AB}$의 중점이므로 세 점 $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$는 중심이 원점 $\mathrm{O}$이고 선분 $\mathrm{AB}$가 지름인 원 위에 있다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        직각삼각형 $\mathrm{ABC}$에서 $\angle\mathrm{B}=\theta$라 하면 $\sin\theta=\dfrac35$이다. 또한 $\angle\mathrm{DOC}=\alpha$이므로 $\angle\mathrm{BOC}=\dfrac{\pi}{2}+\alpha$이다. 선분 $\mathrm{OC}$는 원의 반지름이므로 $\overline{\mathrm{OC}}=5$이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        삼각형 $\mathrm{BOC}$에 사인법칙을 적용하면 $\dfrac{\overline{\mathrm{OC}}}{\sin\theta}=\dfrac{\overline{\mathrm{BC}}}{\sin\left(\frac{\pi}{2}+\alpha\right)}$이므로
        $$\cos\alpha=\sin\left(\frac{\pi}{2}+\alpha\right)=\overline{\mathrm{BC}}\times\frac{\sin\theta}{\overline{\mathrm{OC}}}=\frac{24}{25}$$
      criteria: ['3.M2', '3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $\overline{\mathrm{BC}}=8$, $\overline{\mathrm{CA}}=6$에서 $\angle\mathrm{C}=\dfrac{\pi}{2}$, $\overline{\mathrm{OC}}=5$, $\angle\mathrm{BOC}=\dfrac{\pi}{2}+\alpha$를 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3b-2]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        삼각형 $\mathrm{BOC}$에 사인법칙(또는 코사인법칙)을 적용한 식을 세웠다.
      depends_on: [3.M1]
      implied_ok: false
      steps: [3b-3, 3a]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $\cos\alpha=\dfrac{24}{25}$를 얻었다.
      depends_on: [3.M2]
      steps: [3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    【1-4】 삼각형 $\mathrm{ABC}$에서 $\angle\mathrm{A}=\theta$일 때, 삼각형 $\mathrm{BCP}$의 넓이를 $f(\theta)$라고 하자.
    $\cos\beta=\dfrac45$를 만족시키는 $\beta$에 대하여 $f'(\beta)$의 값을 구하시오.
    (단, $0<\beta<\dfrac{\pi}{2}$이고, 점 $\mathrm{C}$는 선분 $\mathrm{AB}$ 위에 있지 않으며 점 $\mathrm{P}$와 일치하지 않는다.
  # 원문 괄호 닫힘 누락(가이드북 2026 원문 그대로)
  points: 10
  depends_on: ['1']
