stimuli:
- label: 가
  body: |
    $x$의 값의 범위가 $\alpha\le x\le\beta$일 때, 이차함수 $f(x)=a(x-p)^2+q$의 최댓값과 최솟값은 다음과 같다.
    ① 꼭짓점의 $x$좌표 $p$가 $x$의 값의 범위 $\alpha\le x\le\beta$에 속하면 $f(\alpha)$, $f(\beta)$, $f(p)$ 중 가장 큰 값이 최댓값,
    가장 작은 값이 최솟값이다.
    ② 꼭짓점의 $x$좌표 $p$가 $x$의 값의 범위에 속하지 않으면 $f(\alpha)$, $f(\beta)$ 중 가장 큰 값이 최댓값, 가장 작은 값이 최솟값이다.
- label: 나
  body: |
    함수 $f(x)$의 $x=a$에서의 극한값이 $L$이면 $x=a$에서의 우극한과 좌극한이 모두 존재하고 그 값은 모두 $L$과 같다.
    또 그 역도 성립한다. 즉, 다음이 성립한다.
    $$\lim_{x\to a}f(x)=L\iff\lim_{x\to a+}f(x)=\lim_{x\to a-}f(x)=L$$
- label: 다
  body: |
    함수 $f(x)$가 $x=a$에서 정의되어 있고 $\displaystyle\lim_{x\to a}f(x)$가 존재하며 $\displaystyle\lim_{x\to a}f(x)=f(a)$일 때,
    함수 $f(x)$는 $x=a$에서 연속이라고 한다.
    함수 $f(x)$가 어떤 구간에 속하는 모든 $x$에서 연속이면 함수 $f(x)$는 그 구간에서 연속이라고 한다.
- label: 라
  body: |
    함수 $f(x)$에서 극한값 $$\lim_{x\to a}\frac{f(x)-f(a)}{x-a}$$
    가 존재하면 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다.
    또한 함수 $f(x)$가 어떤 구간에 속하는 모든 $x$에서 미분가능하면 함수 $f(x)$는 그 구간에서 미분가능하다고 한다.

stem: |
  제시문 [가]~[라]를 참고하여 다음 물음에 답하시오.
  양의 실수 $t$에 대하여 함수 $g(\theta)=\sqrt{(4\cos\theta-3t)^2+4t^2\sin^2\theta}\ \ (0\le\theta<2\pi)$의 최솟값을 $f(t)$라고 하자.

subparts:
- id: '1'
  stem: |
    【2-1】 $f(1)$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=\cos\theta$로 두면 $h(x)=12(x-1)^2+1$, 최솟값 $h(1)=1$.
    steps:
    - {id: 1a, content: '$t=1$이면 $h(x)=12x^2-24x+13=12(x-1)^2+1$, $f(1)=\sqrt1=1$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $\sin^2\theta=1-\cos^2\theta$를 써서 $\cos\theta$만의 식으로 바꾸자.
    - $\cos\theta$의 범위는 $[-1,1]$이다.
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2026 p.56 (PDF p.58) 답안 사례'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x=\cos\theta\ (0\le\theta<2\pi)$, $h(x)=\{g(\theta)\}^2$이라 하면 $-1\le x\le1$이고
        $$h(x)=(4x-3t)^2+4t^2(1-x^2)=4(4-t^2)x^2-24tx+13t^2$$
        이므로 구간 $[-1,\,1]$에서 함수 $h(x)$의 최솟값의 양의 제곱근이 $f(t)$가 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $t=1$이라고 하면 $h(x)=12x^2-24x+13=12(x-1)^2+1$이므로 함수 $h(x)$는 꼭짓점의 $x$좌표가 $1$이고 최고차항의 계수가 양인 이차함수이다. 따라서 구간 $[-1,\,1]$에서 함수 $h(x)$는 최솟값 $h(1)=1$을 가진다(제시문 [가]). 그러므로 $f(1)=\sqrt1=1$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: |
        $x=\cos\theta$로 치환해 $\{g(\theta)\}^2$을 $[-1,1]$에서의 이차함수 $4(4-t^2)x^2-24tx+13t^2$(또는 $t=1$일 때 $12x^2-24x+13$)으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: |
        제시문 [가]로 최솟값 $h(1)=1$을 구하고 $f(1)=1$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    【2-2】 $0<t<1$일 때, $f(t)$를 구하시오.
  points: 15
  depends_on: ['1']
  answer: {kind: expression, value: 't*sqrt(16 - 13*t**2)/sqrt(4 - t**2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 꼭짓점 $\dfrac{3t}{4-t^2}$이 $(0,1)$ 안에 있으므로 최솟값은 꼭짓점에서의 값.
    steps:
    - {id: 2a, content: '$h\left(\dfrac{3t}{4-t^2}\right)=\dfrac{t^2(16-13t^2)}{4-t^2}$, $f(t)=\dfrac{t\sqrt{16-13t^2}}{\sqrt{4-t^2}}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $h(x)$를 완전제곱식으로 바꾸어 꼭짓점을 찾자.
    - 꼭짓점이 $1$보다 작은지는 $t^2+3t-4$의 부호로 판정된다.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2026 p.57 (PDF p.59) 답안 사례'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $0<t<1$이라고 하자. 그러면 $4-t^2>0$이고
        $$h(x)=4(4-t^2)\left(x-\frac{3t}{4-t^2}\right)^2+\frac{t^2(16-13t^2)}{4-t^2}$$
        이므로 함수 $h(x)$는 꼭짓점의 $x$좌표가 $\dfrac{3t}{4-t^2}$이고 최고차항의 계수가 양인 이차함수이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        또한 $t^2+3t-4=(t-1)(t+4)<0$이므로 $0<\dfrac{3t}{4-t^2}<1$이다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        따라서 구간 $[-1,\,1]$에서 함수 $h(x)$의 최솟값은 $h\left(\dfrac{3t}{4-t^2}\right)=\dfrac{t^2(16-13t^2)}{4-t^2}$이고, $f(t)=\dfrac{t\sqrt{16-13t^2}}{\sqrt{4-t^2}}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $h(x)$를 완전제곱식으로 바꿔 꼭짓점 $\dfrac{3t}{4-t^2}$과 최고차항의 계수 부호(양)를 밝혔다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 5}
      steps: [2b-1, 2a]
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: |
        $(t-1)(t+4)<0$ 등으로 꼭짓점이 구간 $[-1,1]$ 안에 있음을 보였다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $f(t)=\dfrac{t\sqrt{16-13t^2}}{\sqrt{4-t^2}}$을 얻었다.
      depends_on: [2.M1, 2.R1]
      steps: [2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    【2-3】 $t>1$일 때, $f(t)$를 구하시오.
  # 2026 가이드북 원문은 '$t>1$일 때, 를 $f(t)$를 구하시오.'(오탈자 '를'). 2027 가이드북 p.98 표기로 전사.
  points: 15
  depends_on: ['1']
  answer: {kind: expression, value: 'Abs(4 - 3*t)', equivalents: ['sqrt((4 - 3*t)**2)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $t>1$이면 꼭짓점이 구간 $[-1,1]$ 밖(또는 일차함수·위로 볼록)이어서 최솟값은 항상 $h(1)=(4-3t)^2$.
    steps:
    - {id: 3a, content: '$t=2$: 일차함수, $1<t<2$: 꼭짓점 $>1$, $t>2$: 계수 음·꼭짓점 $<0$ → 모두 최솟값 $h(1)$, $f(t)=\lvert4-3t\rvert$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $4-t^2$의 부호가 $t=2$에서 바뀐다.
    - 위로 볼록한 이차함수의 구간 최솟값은 꼭짓점에서 먼 끝점에서 나온다.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2026 p.57 (PDF p.59) 답안 사례'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $t>1$이라고 하자. 이때 $t^2+3t-4=(t-1)(t+4)>0$이다.
        (i) $t=2$인 경우: $h(x)=-48x+52$이므로 함수 $h(x)$는 기울기가 $-48$인 일차함수이다. 따라서 구간 $[-1,\,1]$에서의 함수 $h(x)$는 최솟값 $h(1)=4$를 가진다. 따라서 $f(2)=\sqrt4=2$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (ii) $1<t<2$인 경우: $h(x)=4(4-t^2)\left(x-\dfrac{3t}{4-t^2}\right)^2+\dfrac{t^2(16-13t^2)}{4-t^2}$이므로 함수 $h(x)$는 꼭짓점의 좌표 $x$가 $\dfrac{3t}{4-t^2}$이고 최고차항의 계수가 양인 이차함수이다. $\dfrac{3t}{4-t^2}>1$이므로 구간 $[-1,\,1]$에서 함수 $h(x)$의 최솟값은 $h(1)=(4-3t)^2$이다. 따라서 $f(t)=\sqrt{(4-3t)^2}=\lvert4-3t\rvert$.
      criteria: ['3.M1', '3.R1']
    - id: 3b-3
      content: |
        (iii) $t>2$인 경우: 함수 $h(x)$는 꼭짓점의 좌표 $x$가 $\dfrac{3t}{4-t^2}$이고 최고차항의 계수가 음인 이차함수이다. $\dfrac{3t}{4-t^2}<0$이므로 구간 $[-1,\,1]$에서 함수 $h(x)$의 최솟값은 $h(1)=(4-3t)^2$이다. 그러므로 $f(t)=\sqrt{(4-3t)^2}=\lvert4-3t\rvert$.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        (i), (ii), (iii)을 종합하면, $t>1$일 때, $f(t)=\lvert4-3t\rvert$.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        $4-t^2$의 부호에 따라 $t=2$, $1<t<2$, $t>2$로 경우를 나누었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 5}
      steps: [3b-1, 3b-2, 3a]
    - id: 3.R1
      mark_type: R
      points: 6
      evidence: |
        각 경우에 꼭짓점의 위치($\dfrac{3t}{4-t^2}>1$ 또는 $<0$)와 볼록성으로 최솟값이 $h(1)=(4-3t)^2$임을 근거와 함께 밝혔다.
      depends_on: [3.M1]
      steps: [3b-2, 3b-3]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        $t>1$일 때 $f(t)=\lvert4-3t\rvert$를 얻었다.
      depends_on: [3.R1]
      steps: [3b-4, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    【2-4】 함수 $f(t)$의 $t=1$에서의 연속성과 미분가능성을 조사하시오.
  points: 15
  depends_on: ['1', '2', '3']
  answer: {kind: proof, value: '연속; 미분가능; f1(1) = -3', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
