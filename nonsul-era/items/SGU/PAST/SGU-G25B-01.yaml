stimuli:
- label: 가
  body: |
    두 초점 $\mathrm{F}(c,\,0)$, $\mathrm{F}'(-c,\,0)$으로부터의 거리의 합이 $2a$인 타원의 방정식은 다음과 같다.
    $$\frac{x^2}{a^2}+\frac{y^2}{b^2}=1\ \ (\text{단, }a>c>0,\ b^2=a^2-c^2)$$
- label: 나
  body: |
    타원 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$위의 점 $\mathrm{P}(x_1,\,y_1)$에서의 접선의 방정식은 다음과 같다.
    $$\frac{x_1x}{a^2}+\frac{y_1y}{b^2}=1$$
- label: 다
  body: |
    $$\tan(\alpha+\beta)=\frac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta},\quad\tan(\alpha-\beta)=\frac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$$

stem: |
  제시문 [가]~[다]를 참고하여 다음 물음에 답하시오.
  두 초점이 $\mathrm{F}(\sqrt3b,\,0)$, $\mathrm{F}'(-\sqrt3b,\,0)$인 타원 $\dfrac{x^2}{4b^2}+\dfrac{y^2}{b^2}=1$위의 점 $\mathrm{P}(x_1,\,y_1)$이 $\angle\mathrm{F}'\mathrm{PF}=90^\circ$를 만족시킨다. 문항 【1-1】과 【1-2】에 답하시오. (단, $b>0$이고 $x_1>0$, $y_1>0$)

  두 초점이 $\mathrm{F}(\sqrt3b,\,0)$, $\mathrm{F}'(-\sqrt3b,\,0)$인 타원 $\dfrac{x^2}{4b^2}+\dfrac{y^2}{b^2}=1$위의 점 $\mathrm{Q}(x_2,\,y_2)$가 $\angle\mathrm{F}'\mathrm{FQ}=135^\circ$를 만족시킨다. 문항 【1-3】과 【1-4】에 답하시오. (단, $b>0$이고 $x_2>0$, $y_2>0$)

subparts:
- id: '1'
  stem: |
    【1-1】 $\overline{\mathrm{F}'\mathrm{P}}=l_1$이고 $\overline{\mathrm{FP}}=l_2$라고 할 때, $l_1$과 $l_2$의 곱 $l_1l_2$를 구하시오. 또한 $l_1$과 $l_2$를 각각 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'l1*l2 = 2*b**2; l1 = (2 + sqrt(2))*b; l2 = (2 - sqrt(2))*b', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $l_1+l_2=4b$, $l_1^2+l_2^2=12b^2$에서 $l_1l_2=2b^2$, 두 근 $t=2b\pm\sqrt2b$.
    steps:
    - {id: 1a, content: '$l_1l_2=2b^2$, $l_1=(2+\sqrt2)b$, $l_2=(2-\sqrt2)b$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 타원의 정의로 $l_1+l_2$를, 직각삼각형에서 $l_1^2+l_2^2$을 구하자.
    - 합과 곱을 알면 두 수는 어떤 이차방정식의 근인가?
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2026 p.61 (PDF p.63) 답안 사례'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각형 $\mathrm{F}'\mathrm{PF}$가 직각 삼각형이므로 피타고라스 정리에 의하여 $l_1^2+l_2^2=(2\sqrt3b)^2=12b^2$이다. 따라서 $(l_1+l_2)^2-2l_1l_2=l_1^2+l_2^2=12b^2$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        타원의 정의에 의하여 $l_1+l_2=4b$이므로, $(4b)^2-2l_1l_2=12b^2$이고 $l_1l_2=2b^2$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        이차방정식의 근과 계수와의 관계에 의하여 $l_1$과 $l_2$는 $t$에 관한 이차방정식 $t^2-(4b)t+2b^2=0$의 근이다. 이를 풀면, $t=2b\pm\sqrt2b$이고 $l_1>l_2$이므로 $l_1=(2+\sqrt2)b$, $l_2=(2-\sqrt2)b$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        피타고라스 정리로 $l_1^2+l_2^2=12b^2$, 타원의 정의로 $l_1+l_2=4b$를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $l_1l_2=2b^2$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        $t^2-4bt+2b^2=0$을 풀어 $l_1=(2+\sqrt2)b$, $l_2=(2-\sqrt2)b$를 대응시켰다($l_1>l_2$ 근거 포함).
      depends_on: [1.M1]
      steps: [1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    【1-2】 점 $\mathrm{P}(x_1,\,y_1)$의 좌표를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '(2*sqrt(6)*b/3, sqrt(3)*b/3)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 기울기의 곱 $-1$에서 $x_1^2+y_1^2=3b^2$, 타원의 방정식과 연립.
    steps:
    - {id: 2a, content: '$3y_1^2=b^2$, $y_1=\dfrac{\sqrt3}{3}b$, $x_1=\dfrac{2\sqrt6}{3}b$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $\mathrm{F}'\mathrm{P}\perp\mathrm{FP}$를 기울기로 표현하자.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2026 p.61 (PDF p.63) 답안 사례'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{P}(x_1,\,y_1)$가 타원 위에 있으므로 $\dfrac{x_1^2}{4b^2}+\dfrac{y_1^2}{b^2}=1$ --- (a)
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\angle\mathrm{F}'\mathrm{PF}=90^\circ$이므로 두 점 $\mathrm{F}'$와 $\mathrm{P}$를 지나는 직선의 기울기 $\dfrac{y_1}{x_1+\sqrt3b}$과 두 점 $\mathrm{F}$와 $\mathrm{P}$를 지나는 직선의 기울기 $\dfrac{y_1}{x_1-\sqrt3b}$은 $\dfrac{y_1}{x_1+\sqrt3b}\times\dfrac{y_1}{x_1-\sqrt3b}=-1$을 만족시킨다. 따라서 $x_1^2=3b^2-y_1^2$ --- (b)
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        식 (b)를 식 (a)에 대입하면 $\dfrac{3b^2-y_1^2}{4b^2}+\dfrac{y_1^2}{b^2}=1$이므로 $3y_1^2=b^2$이다. $y_1>0$이므로 $y_1=\dfrac{\sqrt3}{3}b$이고 식 (b)에 대입하면 $x_1^2=3b^2-\dfrac13b^2=\dfrac83b^2$이다. $x_1>0$이므로 $x_1=\sqrt{\dfrac83}b=\dfrac{2\sqrt6}{3}b$이다. 따라서 $(x_1,\,y_1)=\left(\dfrac{2\sqrt6}{3}b,\,\dfrac{\sqrt3}{3}b\right)$
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        타원의 방정식과 기울기의 곱 $-1$ 조건(또는 동치 조건)을 연립했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2, 2a]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $(x_1,y_1)=\left(\dfrac{2\sqrt6}{3}b,\dfrac{\sqrt3}{3}b\right)$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-3, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    【1-3】 $\overline{\mathrm{F}'\mathrm{Q}}=l_3$이고 $\overline{\mathrm{FQ}}=l_4$라고 할 때, $l_3$과 $l_4$를 각각 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'l3 = (16 + sqrt(6))*b/5; l4 = (4 - sqrt(6))*b/5', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 삼각형 $\mathrm{QF}'\mathrm{F}$에서 코사인법칙과 $l_3+l_4=4b$를 연립.
    steps:
    - {id: 3a, content: '$(4b-l_4)^2=l_4^2+12b^2+2\sqrt6bl_4\Rightarrow l_4=\dfrac{4-\sqrt6}{5}b$, $l_3=\dfrac{16+\sqrt6}{5}b$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $135^\circ$인 각을 끼고 있는 두 변은 무엇인가?
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2026 p.61 (PDF p.63) 답안 사례'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\angle\mathrm{F}'\mathrm{FQ}=135^\circ$이다. 삼각형 $\mathrm{QF}'\mathrm{F}$에 코사인법칙을 적용하면
        $$l_3^2=l_4^2+(2\sqrt3b)^2-2l_4(2\sqrt3b)\cos135^\circ=l_4^2+12b^2+2\sqrt6\,b\,l_4$$
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $l_3+l_4=4b$이므로 $l_3=4b-l_4$를 위의 식에 대입하면 $(4b-l_4)^2=l_4^2+12b^2+2\sqrt6\,b\,l_4$이고, 좌변을 전개한 후 계산하면 $l_4=\dfrac{4}{8+2\sqrt6}b=\dfrac{4-\sqrt6}{5}b$이고 $l_3=\dfrac{16+\sqrt6}{5}b$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        코사인법칙 $l_3^2=l_4^2+12b^2+2\sqrt6bl_4$와 $l_3+l_4=4b$를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3a]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        $l_4=\dfrac{4-\sqrt6}{5}b$, $l_3=\dfrac{16+\sqrt6}{5}b$를 얻었다.
      depends_on: [3.M1]
      steps: [3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    【1-4】 타원 $\dfrac{x^2}{4b^2}+\dfrac{y^2}{b^2}=1$위의 점 $\mathrm{Q}(x_2,\,y_2)$에서의 접선이 $x$축과 만나는 점을 $\mathrm{R}$이라고 하자.
    $\angle\mathrm{FQR}=\theta$라고 할 때, $\tan\theta$를 구하시오.
  points: 10
  depends_on: ['3']
  answer: {kind: value, value: '(3 + 2*sqrt(6))/3', equivalents: ['1 + 2*sqrt(6)/3'], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 직선 $\mathrm{FQ}$ 곧 $y=x-\sqrt3b$와 타원을 연립해 Q, 접선으로 R을 구하고 $\theta=135^\circ-\angle\mathrm{QRS}$.
    steps:
    - {id: 4a, content: '$\tan\alpha=\dfrac{2+\sqrt6}{2}$, $\tan\theta=\dfrac{-1-\tan\alpha}{1-\tan\alpha}=\dfrac{3+2\sqrt6}{3}$', criteria: ['4.M2', '4.A2']}
    hint_ladder:
    - $\angle\mathrm{F}'\mathrm{FQ}=135^\circ$이면 직선 $\mathrm{FQ}$의 기울기는?
    - 삼각형 $\mathrm{FRQ}$의 외각 관계로 $\theta$를 다른 두 각으로 나타내자.
  - id: S4-B
    audience: B
    source_flow: '논술가이드북2026 p.62 (PDF p.64) 답안 사례'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        두 점 $\mathrm{Q}(x_2,\,y_2)$와 $\mathrm{F}(c,\,0)$을 지나는 직선은 기울기가 $\tan45^\circ=1$이므로 $y=x-\sqrt3b$이다. 따라서 $y_2=x_2-\sqrt3b$ --- (c). 또한 $\mathrm{Q}(x_2,\,y_2)$는 타원 위에 있으므로 $\dfrac{x_2^2}{4b^2}+\dfrac{y_2^2}{b^2}=1$ --- (d)을 만족시킨다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
