intent: |
  타원의 정의와 피타고라스 정리·코사인법칙으로 초점까지의 거리를 구하고, 수직인 두 직선의 기울기의 곱으로 타원 위의 점의 좌표를 구하며, 타원의 접선과 탄젠트의 덧셈정리로 각의 탄젠트 값을 구하는 능력을 평가한다.
key_idea: |
  $l_1+l_2=4b$와 $l_1^2+l_2^2=(2\sqrt3b)^2$에서 $l_1l_2=2b^2$, 즉 $l_1$, $l_2$는 $t^2-4bt+2b^2=0$의 두 근이다.
