        $$\tan\theta=\tan(135^\circ-\alpha)=\frac{\tan135^\circ-\tan\alpha}{1+\tan135^\circ\tan\alpha}=\frac{-1-\tan\alpha}{1-\tan\alpha}=\frac{3+2\sqrt6}{3}$$
