# 서강대 2025학년도 수시 논술(2차: 물리학과·전자공학과·화공생명공학과·인공지능학과) 자연계열 문제 1 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 원본: 2026 논술가이드북 「자연 기출문제 ③」 인쇄 p.59~62 (PDF p.61~64). 교차 확인: 2027 논술가이드북 인쇄 p.103~ (2차 <문제 1 : 40%>).
# 2026 가이드북은 소문항 머리표를 【3-1】~【3-4】로 적었으나 발문 안에서는 '문항 【1-1】과 【1-2】'로 지칭 → 2027 가이드북 표기(【1-1】~【1-4】)로 통일.
# 배점 비공개: <문제 1 : 40%> 에 따라 points 40, 소문항은 10점씩 균등 배분(공식 배점 아님).
