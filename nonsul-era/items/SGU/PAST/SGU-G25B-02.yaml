intent: |
  조건에서 $g(x)=f(x)+\lvert\cos f(x)\rvert$를 이끌어 삼각함수의 주기성으로 정적분을 구하고, 미분계수의 정의로 미분가능성을, 도함수로 증가·감소와 방정식의 실근의 개수를 조사하며, 합성함수의 미분법으로 $f'(a)$가 특정 값이 되는 $a$를 구하는 능력을 평가한다.
key_idea: |
  (i)(ii)에서 $g(x)-f(x)=\sqrt{1-\sin^2f(x)}=\lvert\cos f(x)\rvert$, 즉 $g(x)=f(x)+\lvert\cos f(x)\rvert$이다.
stuck: |
