stimuli:
- label: 가
  body: |
    함수 $f(x)$가 어떤 구간에 속하는 임의의 두 수 $x_1$, $x_2$에 대하여 $x_1<x_2$일 때
    $f(x_1)<f(x_2)$이면 함수 $f(x)$는 이 구간에서 증가한다고 한다.
    또 $x_1<x_2$일 때 $f(x_1)>f(x_2)$이면 함수 $f(x)$는 이 구간에서 감소한다고 한다.
- label: 나
  body: |
    함수 $f(x)$가 닫힌구간 $[a,\,b]$에서 연속이고 열린구간 $(a,\,b)$에서 미분가능할 때
    ① 열린구간 $(a,\,b)$에서 $f'(x)>0$이면 함수 $f(x)$는 닫힌구간 $[a,\,b]$에서 증가한다.
    ② 열린구간 $(a,\,b)$에서 $f'(x)<0$이면 함수 $f(x)$는 닫힌구간 $[a,\,b]$에서 감소한다.
- label: 다
  body: |
    함수 $y=f(x)$에서 $x$의 값이 $a$에서 $a+\varDelta x$까지 변할 때, 평균변화율은
    $$\frac{\varDelta y}{\varDelta x}=\frac{f(a+\varDelta x)-f(a)}{\varDelta x}$$
    이다. 여기서 $\varDelta x\to0$일 때, 평균변화율의 극한값
    $$\lim_{\varDelta x\to0}\frac{\varDelta y}{\varDelta x}=\lim_{\varDelta x\to0}\frac{f(a+\varDelta x)-f(a)}{\varDelta x}$$
    가 존재하면 함수 $y=f(x)$는 $x=a$에서 미분가능하다고 한다.
    또한 함수 $y=f(x)$가 어떤 구간에 속하는 모든 $x$에서 미분가능하면 함수 $y=f(x)$는 그 구간에서 미분가능하다고 한다.

stem: |
  제시문 [가]~[다]를 참고하여 다음 물음에 답하시오.
  두 함수 $f(x)$와 $g(x)$는 모든 실수 $x$에 대하여 다음 조건을 만족시킨다.

  (i) $f(x)\le g(x)$　　　(ii) $\{g(x)-f(x)\}^2+\sin^2f(x)=1$

subparts:
- id: '1'
  stem: |
    【2-1】 함수 $f(x)$가 $f(x)=10x$일 때, 정적분 $\displaystyle\int_0^{\pi}g(x)\,dx$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '5*pi**2 + 2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(x)=10x+\lvert\cos10x\rvert$, $\lvert\cos10x\rvert$의 주기 $\dfrac{\pi}{10}$을 이용.
    steps:
    - {id: 1a, content: '$\displaystyle\int_0^\pi10x\,dx=5\pi^2$, $\displaystyle\int_0^\pi\lvert\cos10x\rvert dx=10\int_0^{\pi/10}\lvert\cos10x\rvert dx=2$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - (i)(ii)에서 $g(x)-f(x)$를 $f(x)$로 나타내자.
    - $\lvert\cos10x\rvert$의 주기는?
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2026 p.65 (PDF p.67) 답안 사례'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 조건에 의해, $g(x)=f(x)+\sqrt{1-\sin^2f(x)}=f(x)+\lvert\cos f(x)\rvert$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f(x)=10x$이므로 $g(x)=10x+\lvert\cos10x\rvert$이고 $\displaystyle\int_0^\pi g(x)\,dx=\int_0^\pi(10x+\lvert\cos10x\rvert)\,dx=5\pi^2+\int_0^\pi\lvert\cos10x\rvert\,dx$. $y=\lvert\cos10x\rvert$는 주기가 $\dfrac{\pi}{10}$인 주기함수이므로
        $$\int_0^\pi\lvert\cos10x\rvert\,dx=10\int_0^{\frac{\pi}{10}}\lvert\cos10x\rvert\,dx=10\left(\int_0^{\frac{\pi}{20}}\cos10x\,dx-\int_{\frac{\pi}{20}}^{\frac{\pi}{10}}\cos10x\,dx\right)=2$$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        따라서 $\displaystyle\int_0^\pi g(x)\,dx=5\pi^2+2$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        조건 (i)(ii)에서 $g(x)=f(x)+\lvert\cos f(x)\rvert$(여기서 $10x+\lvert\cos10x\rvert$)를 이끌었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: |
        주기성(또는 구간 분할)으로 $\displaystyle\int_0^\pi\lvert\cos10x\rvert dx$를 계산할 식을 세웠다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2, 1a]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $\displaystyle\int_0^\pi g(x)\,dx=5\pi^2+2$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    【2-2】 함수 $f(x)$가 $f(x)=x$일 때, 함수 $g(x)$가 열린구간 $(0,\,\pi)$에서 미분가능한지 조사하시오.
    또한 함수 $g(x)$가 닫힌구간 $[0,\,\pi]$에서 증가함을 보이시오.
  points: 15
  depends_on: ['1']
  answer: {kind: proof, value: 'x=pi/2 에서 미분가능하지 않음(좌미분계수 0, 우미분계수 2) → (0, pi)에서 미분가능하지 않음; [0, pi]에서 증가', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(x)=x+\lvert\cos x\rvert$는 $x=\dfrac{\pi}{2}$에서 좌·우미분계수가 $0$, $2$로 달라 미분불가능하고, 두 구간에서 각각 $g'>0$.
    steps:
    - {id: 2a, content: '$x<\dfrac{\pi}{2}$: $g''=1-\sin x>0$, $x>\dfrac{\pi}{2}$: $g''=1+\sin x>0$', criteria: ['2.M2', '2.R1']}
    hint_ladder:
    - $\cos x$의 부호가 바뀌는 점에서 미분계수의 정의를 써 보자.
    - 증가는 두 닫힌구간으로 나누어 제시문 [나]를 쓰자.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2026 p.65 (PDF p.67) 답안 사례'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(x)=x+\lvert\cos x\rvert=\begin{cases}x+\cos x&\left(0\le x\le\dfrac{\pi}{2}\right)\\[2mm]x-\cos x&\left(\dfrac{\pi}{2}<x\le\pi\right)\end{cases}$이므로 함수 $g(x)$는 구간 $\left(0,\,\dfrac{\pi}{2}\right)$와 $\left(\dfrac{\pi}{2},\,\pi\right)$에서 미분가능하다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $x=\dfrac{\pi}{2}$에서의 미분가능성을 조사하면
        $$\lim_{h\to0-}\frac{g\left(\frac{\pi}{2}+h\right)-g\left(\frac{\pi}{2}\right)}{h}=\lim_{h\to0-}\frac{h-\sin h}{h}=0,\qquad\lim_{h\to0+}\frac{g\left(\frac{\pi}{2}+h\right)-g\left(\frac{\pi}{2}\right)}{h}=\lim_{h\to0+}\frac{h+\sin h}{h}=2$$
        이므로 제시문 [다]에 의해 $x=\dfrac{\pi}{2}$에서 미분가능하지 않다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        함수 $g(x)$는 닫힌구간 $\left[0,\,\dfrac{\pi}{2}\right]$에서 연속이고 열린구간 $\left(0,\,\dfrac{\pi}{2}\right)$에서 $g'(x)=1-\sin x>0$이므로 제시문 [나]에 의해 닫힌구간 $\left[0,\,\dfrac{\pi}{2}\right]$에서 증가한다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        또한, $g(x)$는 닫힌구간 $\left[\dfrac{\pi}{2},\,\pi\right]$에서 연속이고 열린구간 $\left(\dfrac{\pi}{2},\,\pi\right)$에서 $g'(x)=1+\sin x>0$이므로, 닫힌구간 $\left[\dfrac{\pi}{2},\,\pi\right]$에서 증가한다. 따라서 $g(x)$는 닫힌구간 $[0,\,\pi]$에서 증가한다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $g(x)=x+\lvert\cos x\rvert$를 $x=\dfrac{\pi}{2}$ 기준 구간별 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 3}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $x=\dfrac{\pi}{2}$에서 좌미분계수 $0$, 우미분계수 $2$를 구해 미분가능하지 않다고 결론지었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $\left(0,\dfrac{\pi}{2}\right)$에서 $g'(x)=1-\sin x>0$을 보이고 제시문 [나]를 적용했다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-3, 2a]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: |
        $\left(\dfrac{\pi}{2},\pi\right)$에서 $g'(x)=1+\sin x>0$과 두 닫힌구간의 연결(연속성)로 $[0,\pi]$ 전체에서 증가함을 밝혔다.
      depends_on: [2.M2]
      steps: [2b-4, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    【2-3】 함수 $f(x)$가 $f(x)=x$일 때, 방정식 $g(x)-kx+\dfrac{\pi}{2}(k-1)=0$이 $0\le x\le\pi$에서
    오직 하나의 실근을 갖도록 하는 양의 실수 $k$의 값의 범위를 구하시오.
  points: 15
  depends_on: ['2']
  answer: {kind: set, value: 'Union(Interval.open(1 - 2/pi, 1 + 2/pi), Interval(2, oo))', equivalents: ['1-2/pi<k<1+2/pi 또는 k>=2'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h(\tfrac{\pi}{2})=0$이므로 $\left[0,\tfrac{\pi}{2}\right)$와 $\left(\tfrac{\pi}{2},\pi\right]$에서 근이 없을 조건을 증감표와 끝값 $h(0)$, $h(\pi)$로 구한다.
    steps:
    - {id: 3a, content: '왼쪽: $k>1-\dfrac{2}{\pi}$, 오른쪽: $0<k<1+\dfrac{2}{\pi}$ 또는 $k\ge2$ → $1-\dfrac{2}{\pi}<k<1+\dfrac{2}{\pi}$ 또는 $k\ge2$', criteria: ['3.M1', '3.A1', '3.A2', '3.A3']}
    hint_ladder:
    - $x=\dfrac{\pi}{2}$를 대입해 보자.
    - 각 구간에서 $h'(x)$의 부호는 $k$와 $1\mp\sin x$의 대소로 정해진다.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2026 p.66~67 (PDF p.68~69) 답안 사례'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $h(x)=g(x)-kx+\dfrac{\pi}{2}(k-1)$이라고 하자. $h\left(\dfrac{\pi}{2}\right)=g\left(\dfrac{\pi}{2}\right)-\dfrac{\pi}{2}=0$이므로 $x=\dfrac{\pi}{2}$는 방정식 $h(x)=0$의 근이다. 따라서 구간 $\left[0,\,\dfrac{\pi}{2}\right)$와 $\left(\dfrac{\pi}{2},\,\pi\right]$에서 방정식 $h(x)=0$의 근이 존재하지 않는 양의 실수 $k$의 범위를 구하면 된다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (1) 구간 $\left[0,\,\dfrac{\pi}{2}\right)$의 경우: $0<x<\dfrac{\pi}{2}$이면 $h'(x)=1-\sin x-k$이다.
        (1-1) $k\ge1$일 때, 구간 $\left(0,\,\dfrac{\pi}{2}\right)$에서 $h'(x)<0$이므로 함수 $h(x)$는 구간 $\left[0,\,\dfrac{\pi}{2}\right]$에서 감소한다. 따라서 $0\le x<\dfrac{\pi}{2}$일 때, $h(x)>h\left(\dfrac{\pi}{2}\right)=0$이므로 근을 갖지 않는다.
        (1-2) $0<k<1$일 때, $h'(\alpha)=1-\sin\alpha-k=0$이 되는 $\alpha$가 구간 $\left(0,\,\dfrac{\pi}{2}\right)$에 존재하고, $h(x)$는 $x=0$에서 $1+\dfrac{\pi}{2}(k-1)$, $[0,\alpha]$에서 증가, $\left[\alpha,\dfrac{\pi}{2}\right]$에서 감소하여 $h\left(\dfrac{\pi}{2}\right)=0$이다. $0<k\le1-\dfrac{2}{\pi}$이면 $h(0)\le0$이므로 구간 $\left[0,\,\dfrac{\pi}{2}\right)$에서 근을 갖고, $1-\dfrac{2}{\pi}<k<1$이면 $h(0)>0$이므로 근을 갖지 않는다.
        따라서 (1-1)과 (1-2)에 의해 $k>1-\dfrac{2}{\pi}$일 때, 방정식 $h(x)=0$은 구간 $\left[0,\,\dfrac{\pi}{2}\right)$에서 근을 갖지 않는다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        (2) 구간 $\left(\dfrac{\pi}{2},\,\pi\right]$의 경우: $\dfrac{\pi}{2}<x<\pi$에서 $h'(x)=1+\sin x-k$이다.
        (2-1) $0<k\le1$일 때, 함수 $h(x)$는 구간 $\left[\dfrac{\pi}{2},\,\pi\right]$에서 증가하므로 근을 갖지 않는다.
        (2-2) $k\ge2$일 때, 함수 $h(x)$는 구간 $\left[\dfrac{\pi}{2},\,\pi\right]$에서 감소하므로 근을 갖지 않는다.
        (2-3) $1<k<2$일 때, $h'(\beta)=1+\sin\beta-k=0$이 되는 $\beta$가 구간 $\left(\dfrac{\pi}{2},\,\pi\right)$에 존재하고, $h(x)$는 $\dfrac{\pi}{2}$에서 $0$, $\left[\dfrac{\pi}{2},\beta\right]$에서 증가, $[\beta,\pi]$에서 감소하여 $h(\pi)=1+\dfrac{\pi}{2}(1-k)$이다. $1+\dfrac{2}{\pi}\le k<2$이면 $h(\pi)\le0$이므로 근을 갖고, $1<k<1+\dfrac{2}{\pi}$이면 $h(\pi)>0$이므로 근을 갖지 않는다.
        따라서 (2-1), (2-2), (2-3)에 의해 $0<k<1+\dfrac{2}{\pi}$ 또는 $k\ge2$일 때, 구간 $\left(\dfrac{\pi}{2},\,\pi\right]$에서 근을 갖지 않는다.
      criteria: ['3.A2']
    - id: 3b-4
      content: |
        경우 (1)과 (2)에 의해 방정식 $h(x)=0$이 구간 $[0,\,\pi]$에서 오직 한 개의 근을 갖는 양의 실수 $k$의 값의 범위는
        $$1-\frac{2}{\pi}<k<1+\frac{2}{\pi}\ \text{또는}\ k\ge2$$
      criteria: ['3.A3']
