- id: '4'
  stem: |
    【2-4】 함수 $g(x)$가 $g(x)=x$일 때, $f'(a)=\dfrac23$를 만족시키는 실수 $a$의 값을 구하시오. (단, $\dfrac{\pi}{2}<a<\pi+1$)
  points: 15
  depends_on: []
  answer: {kind: value, value: '5*pi/6 + sqrt(3)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $x=f(x)+\lvert\cos f(x)\rvert$를 미분하면 $f'(x)=\dfrac{\lvert\cos f\rvert}{\lvert\cos f\rvert-\sin f\cos f}$, $\cos f(a)$의 부호로 경우 분류.
    steps:
    - {id: 4a, content: '$\cos f(a)<0$에서 $\dfrac23=\dfrac{1}{1+\sin f(a)}$, $\sin f(a)=\dfrac12$, $f(a)=\dfrac56\pi$, $a=\dfrac56\pi+\dfrac{\sqrt3}{2}$', criteria: ['4.M2', '4.A1']}
    hint_ladder:
    - $f$를 직접 구하지 말고 관계식 (ii)를 $x$로 미분하자.
    - $\cos f(a)$가 양수, 음수, $0$인 경우를 나누자.
  - id: S4-B
    audience: B
    source_flow: '논술가이드북2026 p.67 (PDF p.69) 답안 사례'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $g(x)=x$이므로 $x=f(x)+\lvert\cos f(x)\rvert$이다. $\{x-f(x)\}^2+\sin^2f(x)=1$의 양변을 $x$로 미분하면
        $$2\{x-f(x)\}\{1-f'(x)\}+2f'(x)\sin f(x)\cos f(x)=0$$
        $x-f(x)=\lvert\cos f(x)\rvert$이므로 $\lvert\cos f(x)\rvert\{1-f'(x)\}+f'(x)\sin f(x)\cos f(x)=0$.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        따라서 $x=a$와 $f'(a)=\dfrac23$를 대입하면 $\lvert\cos f(a)\rvert+2\sin f(a)\cos f(a)=0$이고, 만약 $\cos f(x)$가 $0$이 아니면 $f'(x)=\dfrac{\lvert\cos f(x)\rvert}{\lvert\cos f(x)\rvert-\sin f(x)\cos f(x)}$.
      criteria: ['4.M1']
    - id: 4b-3
      content: |
        (1) $\cos f(a)=0$이면 $f(a)=a-\lvert\cos f(a)\rvert=a$이므로 $\cos a=0$이 된다. 하지만 $\dfrac{\pi}{2}<a<\pi+1$에서 $\cos a=0$이 되는 $a$는 존재하지 않는다.
        (2) $\cos f(a)>0$이면 $\dfrac23=\dfrac{1}{1-\sin f(a)}$이므로 $\sin f(a)=-\dfrac12$이고 $\cos f(a)=\dfrac{\sqrt3}{2}$이다. 한편 $\dfrac{\pi}{2}<a<\pi+1$이고 $f(a)=a-\dfrac{\sqrt3}{2}$이므로 $\dfrac{\pi}{2}-\dfrac{\sqrt3}{2}<f(a)<\pi+1-\dfrac{\sqrt3}{2}$이다. 하지만 이 범위에서 $\sin f(a)=-\dfrac12$과 $\cos f(a)>0$을 모두 만족시키는 $f(a)$는 존재하지 않는다.
      criteria: ['4.M2']
    - id: 4b-4
      content: |
        (3) $\cos f(a)<0$일 때, $\dfrac23=\dfrac{1}{1+\sin f(a)}$이므로 $\sin f(a)=\dfrac12$이고 $\cos f(a)=-\dfrac{\sqrt3}{2}$이다. 한편 $\dfrac{\pi}{2}<a<\pi+1$이고 $f(a)=a-\dfrac{\sqrt3}{2}$이므로 $\dfrac{\pi}{2}-\dfrac{\sqrt3}{2}<f(a)<\pi+1-\dfrac{\sqrt3}{2}$이다. 따라서 $f(a)=\dfrac56\pi$이고 $a=f(a)+\lvert\cos f(a)\rvert=\dfrac56\pi+\dfrac{\sqrt3}{2}$.
      criteria: ['4.A1']
