- id: '4'
  stem: |
    곡선 $y=kx^3+x^2-x\ln x\,(x>0)$의 변곡점의 개수를 실수 $k$의 값에 따라 조사하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '(-oo,-1/6]:0; (-1/6,0):2; [0,oo):1', equivalents: ['k<=-1/6: 0개, -1/6<k<0: 2개, k>=0: 1개'], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $f''(x)=\dfrac{6kx^2+2x-1}{x}$이므로 $6kx^2+2x-1=0$의 양의 근 중 부호가 바뀌는 것의 개수를 판별식과 근과 계수의 관계로 센다.
    steps:
    - {id: 4a, content: '$k=0$: 1개; $k<-\tfrac16$: 0개; $k=-\tfrac16$: 중근(부호 불변) 0개; $-\tfrac16<k<0$: 양근 2개 → 2개; $k>0$: 양근 1개 → 1개', criteria: ['4.M1', '4.M2', '4.A1', '4.A2']}
    hint_ladder:
    - $f''(x)$를 통분하면 분자는 어떤 이차식인가?
    - $k$가 음수일 때 두 근의 합과 곱의 부호를 보자.
  - id: S4-B
    audience: B
    source_flow: '논술가이드북2027 p.74~75'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $f(x)=kx^3+x^2-x\ln x$라고 하면 $f'(x)=3kx^2+2x-\ln x-1$, $f''(x)=6kx+2-\dfrac1x=\dfrac{6kx^2+2x-1}{x}$.
        곡선 $y=f(x)\,(x>0)$의 변곡점의 개수를 구하기 위하여 방정식 $f''(x)=0$, 즉 $6kx^2+2x-1=0$의 $0$보다 큰 해를 조사하자.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        (i) $k=0$일 때, 방정식 $6kx^2+2x-1=0$은 오직 하나의 해 $x=\dfrac12$을 갖는다. $f''\!\left(\dfrac12\right)=0$이고 $f''(x)$의 부호가 $x=\dfrac12$의 좌우에서 바뀌므로 주어진 곡선은 한 개의 변곡점을 갖는다.
      criteria: ['4.A1']
    - id: 4b-3
      content: |
        (ii) $k\ne0$일 때, 이차방정식 $6kx^2+2x-1=0$의 판별식을 $D$라고 하면 $\dfrac{D}{4}=1+6k$이다.
        ① $D<0$, 즉 $k<-\dfrac16$이면 실근이 없으므로 모든 $x>0$에서 $f''(x)<0$이 되어 변곡점을 갖지 않는다.
        ② $D=0$, 즉 $k=-\dfrac16$이면 중근 $x=1$을 가지므로 모든 $x>0$에서 $f''(x)=-\dfrac{(x-1)^2}{x}\le0$이 되어 변곡점을 갖지 않는다.
      criteria: ['4.M2', '4.A1']
    - id: 4b-4
      content: |
        ③ $D>0$, 즉 $-\dfrac16<k<0$ 또는 $k>0$이면 서로 다른 두 실근 $\alpha$, $\beta\,(\alpha<\beta)$를 갖고, 근과 계수의 관계에 의하여 $\alpha+\beta=-\dfrac{2}{6k}$, $\alpha\beta=-\dfrac{1}{6k}$이다.
        ㉠ $-\dfrac16<k<0$이면 $\alpha$와 $\beta$는 모두 $0$보다 큰 실근이다. $f''(x)=\dfrac{6k(x-\alpha)(x-\beta)}{x}$의 부호가 $x=\alpha$, $x=\beta$의 좌우에서 바뀌므로 두 개의 변곡점을 갖는다.
        ㉡ $k>0$이면 $\beta$만 $0$보다 큰 실근이다. $f''(x)$의 부호가 $x=\beta$의 좌우에서 바뀌므로 한 개의 변곡점을 갖는다.
      criteria: ['4.M2', '4.A1']
    - id: 4b-5
      content: |
        따라서 변곡점의 개수는 $k\le-\dfrac16$일 때 $0$, $k\ge0$일 때 $1$, $-\dfrac16<k<0$일 때 $2$이다.
      criteria: ['4.A2']
