intent: |
  점과 직선 사이의 거리를 부등식에 적용하고 등차수열의 합으로 순서쌍의 개수를 세는 능력, 함수의 연속성·미분가능 조건으로 등식을 세워 푸는 능력, 치환적분법과 정적분과 미분의 관계·지수함수의 미분법을 활용하는 능력, 변곡점과 이계도함수의 관계를 이해하고 로그함수의 미분법으로 변곡점의 개수를 구하는 능력을 평가한다.
key_idea: |
  【1-1】 원과 직선이 만날 조건 $\dfrac{5|b|}{\sqrt{a^2+4}}\le5$를 $|b|\le\sqrt{a^2+4}$로 바꾸고 $|a|\ge2$이면 $|b|\le|a|$임을 이용한다. 【1-3】 $s=x-t$ 치환 후 두 번 미분한다. 【1-4】 $f''(x)=\dfrac{6kx^2+2x-1}{x}$의 분자의 양의 근을 판별식으로 분류한다.
stuck: |
  【1-1】 $\sqrt{a^2+4}<|a|+1$이 되는 경계 $|a|>\tfrac32$를 찾아 경우를 나누는 것, 【1-3】 피적분함수의 $f(x-t)$를 치환으로 적분 밖 변수와 분리하는 것, 【1-4】 $k$의 부호에 따라 근 $\alpha,\beta$의 부호를 근과 계수의 관계로 판정하는 것
