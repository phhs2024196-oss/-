stimuli:
- label: 가
  body: |
    점 $(x_1,\,y_1)$과 직선 $ax+by+c=0$ 사이의 거리 $d$는
    $$d=\dfrac{|ax_1+by_1+c|}{\sqrt{a^2+b^2}}$$
- label: 나
  body: |
    함수 $y=f(x)$에서 $x$의 값이 $a$에서 $a+\Delta x$까지 변할 때의 평균변화율은
    $$\dfrac{\Delta y}{\Delta x}=\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$$
    이다. 여기서 $\Delta x\to0$일 때, 평균변화율의 극한값
    $$\lim_{\Delta x\to0}\dfrac{\Delta y}{\Delta x}=\lim_{\Delta x\to0}\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$$
    가 존재하면 함수 $y=f(x)$는 $x=a$에서 미분가능하다고 한다. 이때 이 극한값을 함수 $y=f(x)$의 $x=a$에서의 순간변화율 또는 미분계수라고 하고, 이것을 기호로 $f'(a)$와 같이 나타낸다.
- label: 다
  body: |
    무리수 $e$의 정의
    $$\lim_{x\to0}(1+x)^{\frac{1}{x}}=e$$
- label: 라
  body: |
    곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,\,f(a))$에 대하여 $x=a$의 좌우에서 곡선의 모양이 아래로 볼록에서 위로 볼록으로 바뀌거나 위로 볼록에서 아래로 볼록으로 바뀔 때, 이 점 $\mathrm{P}$를 곡선 $y=f(x)$의 변곡점이라고 한다.

stem: |
  [문제] 제시문 [가]~[라]를 참고하여 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    두 정수 $a$와 $b$에 대하여 직선 $ax+2y+5b=0$이 원 $x^2+y^2=25$와 만나도록 하는 순서쌍 $(a,\,b)$의 개수를 구하시오.
    (단, $-100\le a\le100$, $-100\le b\le100$)
  points: 10
  depends_on: []
  answer: {kind: value, value: '20409', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 만날 조건은 $|b|\le\sqrt{a^2+4}$이고, $|a|\ge2$이면 $\sqrt{a^2+4}<|a|+1$이므로 $|b|\le|a|$이다.
    steps:
    - {id: 1a, content: '$a=0$: 5개, $|a|=1$: 각 5개, $2\le|a|\le100$: $2|a|+1$개 → $5+10+2\sum_{k=2}^{100}(2k+1)=20409$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 원의 중심과 직선 사이의 거리를 반지름과 비교해 보자.
    - $\sqrt{a^2+4}$보다 작거나 같은 정수 $|b|$의 최댓값은 $|a|$가 클 때 무엇인가?
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2027 p.73'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        원 $x^2+y^2=25$의 중심 $(0,\,0)$과 직선 $ax+2y+5b=0$ 사이의 거리는 제시문 [가]에 의하여 $\dfrac{5|b|}{\sqrt{a^2+4}}$이다. 직선이 원과 만나려면 $\dfrac{5|b|}{\sqrt{a^2+4}}\le5$이어야 하므로 $|b|\le\sqrt{a^2+4}$.
      criteria: ['1.M1', '1.A1']
      # 원문 예시답안에는 '직선 ax+y+5b=0'으로 인쇄되어 있음(문제의 ax+2y+5b=0의 오식으로 보임)
    - id: 1b-2
      content: |
        $\sqrt{a^2+4}<|a|+1$이면 $|b|\le\sqrt{a^2+4}<|a|+1$이므로 $|b|\le|a|$이다. $\sqrt{a^2+4}<|a|+1$이려면 $a^2+4<a^2+2|a|+1$이므로 $|a|>\dfrac32$이어야 한다. 따라서 $|a|\ge2$이면 $|b|\le|a|$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        (i) $a=0$이면 $|b|\le2$이므로 $b=-2,-1,0,1,2$.
        (ii) $|a|=1$이면 $|b|\le\sqrt5$이므로 $b=-2,-1,0,1,2$.
        (iii) $2\le|a|\le100$이면 $|b|\le|a|$이므로 $b=-|a|,\,-|a|+1,\,\dots,\,0,\,\dots,\,|a|-1,\,|a|$.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        (i)~(iii)에 의하여 순서쌍 $(a,\,b)$의 개수는
        $$5+2\times5+2\sum_{k=2}^{100}(2k+1)=9+2\sum_{k=1}^{100}(2k+1)=9+4\times\dfrac{100\times101}{2}+200=20409$$
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 배점 비공개 — 공식 채점기준(평가 요소 서술)을 바탕으로 임의 배분
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        제시문 [가]로 중심과 직선 사이의 거리 $\dfrac{5|b|}{\sqrt{a^2+4}}$를 구하고 (거리) $\le$ (반지름) 부등식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $|b|\le\sqrt{a^2+4}$ 또는 $b^2\le a^2+4$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $|a|\ge2$이면 $|b|\le|a|$임을 보이고 $a=0$, $|a|=1$, $2\le|a|\le100$으로 경우를 나누어 $b$의 개수를 셌다.
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        등차수열의 합으로 개수 $20409$를 얻었다.
      depends_on: [1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    함수 $f(x)=\begin{cases}ax+b & (x\le0)\\ \dfrac{1-\sqrt{1+3x^2}}{x} & (0<x<1)\\ cx+d & (x\ge1)\end{cases}$이 모든 실수 $x$에서 미분가능할 때, 상수 $a$, $b$, $c$, $d$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '(-3/2, 0, -1/2, -1/2)', equivalents: ['a=-3/2, b=0, c=-1/2, d=-1/2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 각 경계에서 연속(함숫값)과 좌·우 미분계수 일치를 분자의 유리화로 계산한다.
    steps:
    - {id: 2a, content: '$x=0$: $b=0$, $a=\lim_{x\to0+}\tfrac{1-\sqrt{1+3x^2}}{x^2}=-\tfrac32$; $x=1$: $c+d=-1$, $c=-\tfrac12$, $d=-\tfrac12$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - 미분가능하면 연속이다. 먼저 함숫값을 맞추자.
    - 우미분계수를 구할 때 분자를 유리화해 보자.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2027 p.73~74'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (i) $x=0$일 때, $f(x)$가 $x=0$에서 미분가능하므로 연속이다. 따라서 $f(0)=\displaystyle\lim_{x\to0+}f(x)$이다. $f(0)=b$이고
        $$\lim_{x\to0+}f(x)=\lim_{x\to0+}\dfrac{1-\sqrt{1+3x^2}}{x}=\lim_{x\to0+}\dfrac{-3x^2}{x\left(1+\sqrt{1+3x^2}\right)}=0$$
        이므로 $b=0$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        또한 $f(x)$가 $x=0$에서 미분가능하므로 $\displaystyle\lim_{x\to0-}\dfrac{f(x)-f(0)}{x-0}=\lim_{x\to0+}\dfrac{f(x)-f(0)}{x-0}$이다.
        $\displaystyle\lim_{x\to0-}\dfrac{f(x)-f(0)}{x-0}=\lim_{x\to0-}\dfrac{ax}{x}=a$이고
        $$\lim_{x\to0+}\dfrac{f(x)-f(0)}{x-0}=\lim_{x\to0+}\dfrac{1-\sqrt{1+3x^2}}{x^2}=\lim_{x\to0+}\dfrac{-3x^2}{x^2\left(1+\sqrt{1+3x^2}\right)}=-\dfrac32$$
        이므로 $a=-\dfrac32$이다.
      criteria: ['2.M1', '2.A1']
    - id: 2b-3
      content: |
        (ii) $x=1$일 때, $f(x)$가 $x=1$에서 미분가능하므로 연속이다. 따라서 $f(1)=\displaystyle\lim_{x\to1-}f(x)$이다. $f(1)=c+d$이고 $\displaystyle\lim_{x\to1-}f(x)=\lim_{x\to1-}\dfrac{1-\sqrt{1+3x^2}}{x}=-1$이므로 $c+d=f(1)=-1$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        또한 $\displaystyle\lim_{x\to1+}\dfrac{f(x)-f(1)}{x-1}=\lim_{x\to1+}\dfrac{(cx+d)-(c+d)}{x-1}=c$이고
        $$\lim_{x\to1-}\dfrac{f(x)-f(1)}{x-1}=\lim_{x\to1-}\dfrac{x+1-\sqrt{1+3x^2}}{x(x-1)}=\lim_{x\to1-}\dfrac{(x+1)^2-(1+3x^2)}{x(x-1)\left(x+1+\sqrt{1+3x^2}\right)}$$
        $$=\lim_{x\to1-}\dfrac{-2x^2+2x}{x(x-1)\left(x+1+\sqrt{1+3x^2}\right)}=\lim_{x\to1-}\dfrac{-2}{x+1+\sqrt{1+3x^2}}=-\dfrac12$$
        이므로 $c=-\dfrac12$이고, $c+d=-1$에서 $d=-\dfrac12$이다.
        그러므로 $a=-\dfrac32$, $b=0$, $c=-\dfrac12$, $d=-\dfrac12$이다.
      criteria: ['2.M2', '2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 배점 비공개 — 임의 배분
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $x=0$에서 연속 조건과 좌·우 미분계수 일치 조건(제시문 [나])을 식으로 세우고 분자의 유리화로 극한을 계산했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $b=0$, $a=-\dfrac32$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $x=1$에서 연속 조건 $c+d=-1$과 좌·우 미분계수 일치 조건을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-3, 2b-4]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $c=-\dfrac12$, $d=-\dfrac12$를 얻었다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    실수 전체의 집합에서 연속인 함수 $f(x)$가 모든 실수 $x$에 대하여 $\displaystyle\int_0^x tf(x-t)\,dt=x^2e^{-x^2}$을 만족시킬 때, $f(0)\times\displaystyle\int_{-2}^{3}f(x)\,dx$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-24*exp(-4) - 96*exp(-9)', equivalents: ['-(24*exp(5) + 96)/exp(9)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $s=x-t$로 치환하면 $x\int_0^xf(s)ds-\int_0^xsf(s)ds=x^2e^{-x^2}$이고, 한 번 미분하면 $\int_0^xf(s)ds=(2x-2x^3)e^{-x^2}$이다.
    steps:
    - {id: 3a, content: '$f(x)=(4x^4-10x^2+2)e^{-x^2}$, $f(0)=2$, $\int_{-2}^3f=-12e^{-4}-48e^{-9}$ → $-24e^{-4}-96e^{-9}$', criteria: ['3.M1', '3.M2', '3.A1', '3.A2']}
    hint_ladder:
    - $f(x-t)$의 $x$를 적분 기호 밖으로 빼낼 수 있도록 치환해 보자.
    - $\int_{-2}^3f(x)dx$는 $\int_0^xf(s)ds$를 알면 바로 계산된다.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2027 p.74'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $s=x-t$로 놓으면 $\dfrac{ds}{dt}=-1$이고, $t=0$일 때 $s=x$, $t=x$일 때 $s=0$이다. 그러므로
        $$\int_0^xtf(x-t)\,dt=-\int_x^0(x-s)f(s)\,ds=\int_0^x(x-s)f(s)\,ds=x\int_0^xf(s)\,ds-\int_0^xsf(s)\,ds$$
        이므로 $x\displaystyle\int_0^xf(s)\,ds-\int_0^xsf(s)\,ds=x^2e^{-x^2}$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        양변을 $x$에 대하여 미분하면 $\displaystyle\int_0^xf(s)\,ds+xf(x)-xf(x)=2xe^{-x^2}-2x^3e^{-x^2}$이므로
        $$\int_0^xf(s)\,ds=(2x-2x^3)e^{-x^2}$$
        양변을 다시 $x$에 대하여 미분하면 $f(x)=(4x^4-10x^2+2)e^{-x^2}$이다. 따라서 $f(0)=2$이다.
      criteria: ['3.M2', '3.A1']
    - id: 3b-3
      content: |
        한편 $\displaystyle\int_{-2}^3f(x)\,dx=\int_{-2}^0f(s)\,ds+\int_0^3f(s)\,ds=-\int_0^{-2}f(s)\,ds+\int_0^3f(s)\,ds$이고 $\displaystyle\int_0^xf(s)\,ds=(2x-2x^3)e^{-x^2}$이므로
        $$-\int_0^{-2}f(s)\,ds+\int_0^3f(s)\,ds=-12e^{-4}-48e^{-9}$$
        그러므로 $f(0)\times\displaystyle\int_{-2}^3f(x)\,dx=-24e^{-4}-96e^{-9}=-\dfrac{24e^5+96}{e^9}$.
      criteria: ['3.A2']
