- id: '4'
  stem: |
    곡선 $y=f(x)\left(0<x<\dfrac{2\pi}{3}\right)$와 직선 $y=\dfrac13x+k$의 교점의 개수를 실수 $k$의 값에 따라 조사하시오.
  points: 15
  depends_on: ['1']
  answer: {kind: expression, value: '(-oo,(2-pi)/6):0; {(2-pi)/6}:1; ((2-pi)/6,(3*sqrt(3)-2*pi)/9):2; [(3*sqrt(3)-2*pi)/9,0):1; [0,oo):0', equivalents: ['(2-π)/6<k<(3√3-2π)/9: 2개, k=(2-π)/6 또는 (3√3-2π)/9<=k<0: 1개, k<(2-π)/6 또는 k>=0: 0개'], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $h(x)=f(x)-\dfrac x3$로 놓으면 $h'(x)=-\dfrac{\cos x}{3(1+\cos x)}$이므로 $x=\dfrac{\pi}{2}$에서 최솟값 $\dfrac{2-\pi}{6}$, 양 끝 극한은 $0$과 $\dfrac{3\sqrt3-2\pi}{9}$이다.
    steps:
    - {id: 4a, content: '$\tfrac{2-\pi}{6}<\tfrac{3\sqrt3-2\pi}{9}<0$이므로 개수는 2·1·0으로 분류', criteria: ['4.M1', '4.A1', '4.A2', '4.A3']}
    hint_ladder:
    - 교점의 개수를 $f(x)-\dfrac x3=k$의 실근의 개수로 바꾸자.
    - 양 끝의 극한값 중 어느 쪽이 더 작은가?
  - id: S4-B
    audience: B
    source_flow: '논술가이드북2027 p.80~81'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $h(x)=f(x)-\dfrac x3$라 하자. 그러면 곡선 $y=f(x)\left(0<x<\dfrac{2\pi}{3}\right)$와 직선 $y=\dfrac13x+k$의 교점의 개수는 곡선 $y=h(x)\left(0<x<\dfrac{2\pi}{3}\right)$와 직선 $y=k$의 교점의 개수와 같다. 함수 $h(x)$의 도함수는
        $$h'(x)=\dfrac13\cdot\dfrac{\cos x(1+\cos x)-\sin x(-\sin x)}{(1+\cos x)^2}-\dfrac13=-\dfrac{\cos x}{3(1+\cos x)}$$
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        $x=\dfrac{\pi}{2}$에서 $h'(x)=0$이고, 열린구간 $\left(0,\,\dfrac{2\pi}{3}\right)$에서 $h(x)$는 $\left(0,\,\dfrac{\pi}{2}\right]$에서 감소($h'<0$), $\left[\dfrac{\pi}{2},\,\dfrac{2\pi}{3}\right)$에서 증가($h'>0$)하며 $x=\dfrac{\pi}{2}$에서 극솟값 $h\left(\dfrac{\pi}{2}\right)=\dfrac{2-\pi}{6}$을 갖는다.
        [표: $x$ 0 … $\frac{\pi}{2}$ … $\frac{2\pi}{3}$ / $h'$ − 0 + / $h$ ↘ $\frac{2-\pi}{6}$ ↗]
      criteria: ['4.A1']
    - id: 4b-3
      content: |
        또한 $\displaystyle\lim_{x\to0+}h(x)=0$, $\displaystyle\lim_{x\to\frac{2\pi}{3}-}h(x)=\dfrac{3\sqrt3-2\pi}{9}$이고, $3\sqrt3<3\times2=6$, $2\pi>6$이므로 $\dfrac{2-\pi}{6}<\dfrac{3\sqrt3-2\pi}{9}<0$이다. 따라서 함수 $h(x)$의 그래프의 개형은 다음과 같다.
        [그림: 원점(열린 점)에서 출발해 $x=\frac{\pi}{2}$에서 최솟값 $\frac{2-\pi}{6}$까지 감소한 뒤 $x=\frac{2\pi}{3}$의 열린 점 $\left(\frac{2\pi}{3},\frac{3\sqrt3-2\pi}{9}\right)$까지 증가하는 곡선 $y=h(x)$]
      criteria: ['4.A2']
    - id: 4b-4
      content: |
        그러므로 실수 $k$에 대하여 곡선 $y=h(x)\left(0<x<\dfrac{2\pi}{3}\right)$와 직선 $y=k$의 교점의 개수는 다음과 같다.
        (i) $\dfrac{2-\pi}{6}<k<\dfrac{3\sqrt3-2\pi}{9}$이면 교점의 개수는 $2$개
        (ii) $k=\dfrac{2-\pi}{6}$이거나 $\dfrac{3\sqrt3-2\pi}{9}\le k<0$이면 교점의 개수는 $1$개
        (iii) $k<\dfrac{2-\pi}{6}$이거나 $k\ge0$이면 교점의 개수는 $0$개
      criteria: ['4.A3']
