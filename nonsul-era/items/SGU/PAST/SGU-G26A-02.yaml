stimuli:
- label: 가
  body: |
    임의의 $\theta$에 대하여
    $$\sin(\pi+\theta)=-\sin\theta\qquad\cos(\pi+\theta)=-\cos\theta$$
    $$\sin\left(\dfrac{\pi}{2}+\theta\right)=\cos\theta\qquad\cos\left(\dfrac{\pi}{2}+\theta\right)=-\sin\theta$$
- label: 나
  body: |
    함수 $f(x)$와 실수 $a$에 대하여
    (i) 함수 $f(x)$가 $x=a$에서 정의되고
    (ii) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재하며
    (iii) $\displaystyle\lim_{x\to a}f(x)=f(a)$
    일 때, 함수 $f(x)$는 $x=a$에서 연속이라고 한다.
- label: 다
  body: |
    삼각함수의 덧셈정리
    $$\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta\qquad\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$$
    $$\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta\qquad\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$$
    $$\tan(\alpha+\beta)=\dfrac{\tan\alpha+\tan\beta}{1-\tan\alpha\tan\beta}$$
    $$\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$$

stem: |
  [문제] $0<t<\pi$일 때, 점 $\mathrm{P}(2\cos t,\,2\sin t)$에 대하여 점 $\mathrm{P}$와 점 $(-1,\,0)$을 지나는 직선과 점 $\mathrm{P}$와 점 $(-2,\,0)$을 지나는 직선이 이루는 예각의 크기를 $\theta(t)$라고 하자. 열린구간 $(0,\,\pi)$에서 정의된 함수 $f(t)=\tan\theta(t)$에 대하여 제시문 [가]~[다]를 참고하여 문항 【2-1】~【2-4】에 답하시오. (단, $\theta(t)$의 단위는 라디안)

subparts:
- id: '1'
  stem: |
    함수 $f(t)$가 $t=\dfrac{2\pi}{3}$에서 연속임을 보이시오.
  points: 15
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t\ne\dfrac{2\pi}{3}$에서 $f(t)=\tan(\alpha-\beta)=\dfrac{\sin t}{3(1+\cos t)}$이고, $t=\dfrac{2\pi}{3}$에서는 직각삼각형으로 $f=\dfrac{\sqrt3}{3}$이며 극한값과 같다.
    steps:
    - {id: 1a, content: '$\lim_{t\to2\pi/3}\tfrac{\sin t}{3(1+\cos t)}=\tfrac{\sqrt3/2}{3/2}=\tfrac{\sqrt3}{3}=f\left(\tfrac{2\pi}{3}\right)$', criteria: ['1.M1', '1.A1', '1.M2', '1.R1']}
    hint_ladder:
    - 두 직선이 $x$축과 이루는 각의 차가 $\theta(t)$이다.
    - $t=\dfrac{2\pi}{3}$일 때 점 $\mathrm{P}$의 $x$좌표는 얼마인가?
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2027 p.79'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P}$와 점 $(-1,\,0)$을 지나는 직선을 $l_1$, 점 $\mathrm{P}$와 점 $(-2,\,0)$을 지나는 직선을 $l_2$라고 하자. 두 직선이 $x$축과 이루는 각의 크기를 각각 $\alpha$, $\beta$라고 하면 $\theta(t)=\alpha-\beta$이다.
        [그림: 반원 위의 점 $\mathrm{P}(2\cos t,2\sin t)$에서 $\mathrm{A}(-1,0)$, $\mathrm{B}(-2,0)$으로 그은 두 직선, $\mathrm{A}$에서의 각 $\alpha$, $\mathrm{B}$에서의 각 $\beta$, $\mathrm{P}$에서의 각 $\theta(t)$]
        (i) $t\ne\dfrac{2\pi}{3}$일 때, 직선 $l_1$의 기울기는 $\tan\alpha=\dfrac{2\sin t}{2\cos t+1}$, 직선 $l_2$의 기울기는 $\tan\beta=\dfrac{2\sin t}{2\cos t+2}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        제시문 [다]에 의해
        $$f(t)=\tan\theta(t)=\tan(\alpha-\beta)=\dfrac{\dfrac{2\sin t}{2\cos t+1}-\dfrac{\sin t}{\cos t+1}}{1+\dfrac{2\sin t}{2\cos t+1}\times\dfrac{\sin t}{\cos t+1}}=\dfrac{\sin t}{(2\cos t+1)(\cos t+1)+2\sin^2t}=\dfrac{\sin t}{3(1+\cos t)}$$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        (ii) $t=\dfrac{2\pi}{3}$일 때, 두 점 $(-1,\,0)$, $(-2,\,0)$을 각각 $\mathrm{A}$, $\mathrm{B}$라고 하자. $\mathrm{P}(-1,\,\sqrt3)$이므로 삼각형 $\mathrm{APB}$는 직각삼각형이고
        $$f\left(\dfrac{2\pi}{3}\right)=\tan\theta\left(\dfrac{2\pi}{3}\right)=\dfrac{\overline{\mathrm{AB}}}{\overline{\mathrm{AP}}}=\dfrac{1}{\sqrt3}=\dfrac{\sqrt3}{3}$$
        [그림: $\mathrm{P}(-1,\sqrt3)$, $\mathrm{A}(-1,0)$, $\mathrm{B}(-2,0)$이 이루는 직각삼각형, $\mathrm{P}$에서의 각 $\theta\left(\tfrac{2\pi}{3}\right)$]
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        따라서 (i)과 (ii)에 의해
        $$\lim_{t\to\frac{2\pi}{3}}f(t)=\lim_{t\to\frac{2\pi}{3}}\dfrac{\sin t}{3(1+\cos t)}=\dfrac{\sqrt3}{3}=f\left(\dfrac{2\pi}{3}\right)$$
        이므로 제시문 [나]에 의해 함수 $f(t)$는 $t=\dfrac{2\pi}{3}$에서 연속이다.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 배점 비공개 — 공식 채점기준(평가 요소 서술)을 바탕으로 임의 배분
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\theta(t)=\alpha-\beta$로 놓고 두 직선의 기울기 $\tan\alpha=\dfrac{2\sin t}{2\cos t+1}$, $\tan\beta=\dfrac{2\sin t}{2\cos t+2}$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        덧셈정리로 $t\ne\dfrac{2\pi}{3}$에서 $f(t)=\dfrac{\sin t}{3(1+\cos t)}$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $t=\dfrac{2\pi}{3}$에서 $l_1$이 $x$축에 수직임을 고려해 직각삼각형으로 $f\left(\dfrac{2\pi}{3}\right)=\dfrac{\sqrt3}{3}$을 따로 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        극한값 $\dfrac{\sqrt3}{3}$이 함숫값과 같음을 보이고 제시문 [나]의 연속 정의로 결론을 적었다.
      depends_on: [1.A1, 1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $\sin\alpha=\dfrac{\sqrt2}{4}$일 때, $\displaystyle\int_{2\alpha}^{\frac{2\pi}{3}}f(t)\,dt$의 값을 구하시오. $\left(\text{단, }0<\alpha<\dfrac{\pi}{2}\right)$
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: 'log(7/2)/3', equivalents: ['(1/3)*log(7/2)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $1+\cos t=s$로 치환하면 $\displaystyle\int f\,dt=-\dfrac13\int\dfrac{ds}{s}$이고 $1+\cos2\alpha=2-2\sin^2\alpha=\dfrac74$이다.
    steps:
    - {id: 2a, content: '$-\tfrac13\left(\ln\tfrac12-\ln\tfrac74\right)=\tfrac13\ln\tfrac72$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - 분자 $\sin t$는 분모 $1+\cos t$의 도함수와 부호만 다르다.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2027 p.79'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문항 【2-1】의 풀이로부터 $f(t)=\dfrac{\sin t}{3(1+\cos t)}$이다. $\displaystyle\int_{2\alpha}^{\frac{2\pi}{3}}f(t)\,dt$에서 $1+\cos t=s$라 놓으면 $\dfrac{ds}{dt}=-\sin t$이고, $t=2\alpha$일 때 $s=1+\cos2\alpha$, $t=\dfrac{2\pi}{3}$일 때 $s=\dfrac12$이므로
        $$\int_{2\alpha}^{\frac{2\pi}{3}}f(t)\,dt=-\dfrac13\int_{1+\cos2\alpha}^{\frac12}\dfrac1s\,ds$$
      criteria: ['2.M1']
      # 원문 예시답안은 '문항 [1-1]의 풀이로부터'로 인쇄되어 있음([2-1]의 오식으로 보임). 또 마지막 적분식의 피적분함수를 1/t로 표기
    - id: 2b-2
      content: |
        제시문 [다]에 의해 $1+\cos2\alpha=1+\cos^2\alpha-\sin^2\alpha=2-2\sin^2\alpha=\dfrac74$이므로
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $$\int_{2\alpha}^{\frac{2\pi}{3}}f(t)\,dt=-\dfrac13\Big[\ln s\Big]_{1+\cos2\alpha}^{\frac12}=-\dfrac13\left(\ln\dfrac12-\ln\dfrac74\right)=\dfrac13\ln\dfrac72$$
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 배점 비공개 — 임의 배분
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $1+\cos t=s$ 치환으로 적분을 $-\dfrac13\displaystyle\int\dfrac{1}{s}\,ds$ 꼴로 바꾸고 적분 구간을 바꾸었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 5}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        배각공식(덧셈정리)으로 $1+\cos2\alpha=\dfrac74$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 6
      evidence: |
        $\dfrac13\ln\dfrac72$를 얻었다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    열린구간 $\left(0,\,\dfrac{\pi}{2}\right)$에서 정의된 함수 $g(x)=\dfrac{f(x)}{\{f(2x)\}^3}$에 대하여 $\displaystyle\lim_{x\to0+}\dfrac{g\left(\frac{\pi}{2}-x\right)}{x^n}$가 수렴하는 자연수 $n$을 모두 구하고, 수렴하는 모든 $n$에 대하여 그 극한값을 구하시오.
  points: 15
  depends_on: ['1']
  answer: {kind: expression, value: 'n=1:0; n=2:0; n=3:9', equivalents: ['n=1,2일 때 0, n=3일 때 9, n>=4이면 발산'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g(x)=\dfrac{9\cos^3x}{(1+\cos x)\sin^2x}$이므로 $\dfrac{g\left(\frac{\pi}{2}-x\right)}{x^n}=\dfrac{9}{(1+\sin x)\cos^2x}\left(\dfrac{\sin x}{x}\right)^3x^{3-n}$.
    steps:
    - {id: 3a, content: '$n=1,2$: 극한값 $0$; $n=3$: 극한값 $9$; $n\ge4$: 발산', criteria: ['3.M1', '3.M2', '3.A1', '3.A2']}
    hint_ladder:
    - $f(2x)$를 배각공식으로 정리해 보자.
    - $g\left(\frac{\pi}{2}-x\right)$에서 $\sin x$의 몇 제곱이 남는가?
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2027 p.80'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        문항 【2-1】의 풀이로부터 $f(t)=\dfrac{\sin t}{3(1+\cos t)}$이므로 $g(x)=\dfrac{\sin x}{3(1+\cos x)}\times\dfrac{3^3(1+\cos2x)^3}{\sin^32x}$이다.
        제시문 [다]에 의해 $\sin2x=2\sin x\cos x$이고 $\cos2x=\cos^2x-\sin^2x=2\cos^2x-1$이므로
        $$g(x)=9\times\dfrac{\sin x}{1+\cos x}\times\dfrac{8\cos^6x}{8\sin^3x\cos^3x}=\dfrac{9\cos^3x}{(1+\cos x)\sin^2x}$$
      criteria: ['3.M1']
      # 원문 예시답안은 '문항 [1-1]의 풀이로부터'로 인쇄([2-1]의 오식으로 보임)
    - id: 3b-2
      content: |
        제시문 [가]에 의해 $g\left(\dfrac{\pi}{2}-x\right)=\dfrac{9\sin^3x}{(1+\sin x)\cos^2x}$이고
        $$\dfrac{g\left(\frac{\pi}{2}-x\right)}{x^n}=\dfrac{9}{(1+\sin x)\cos^2x}\times\left(\dfrac{\sin x}{x}\right)^3\times x^{3-n}$$
        $\displaystyle\lim_{x\to0+}\dfrac{9}{(1+\sin x)\cos^2x}=9$, $\displaystyle\lim_{x\to0+}\dfrac{\sin x}{x}=1$이므로, $\displaystyle\lim_{x\to0+}\dfrac{g\left(\frac{\pi}{2}-x\right)}{x^n}$은 수렴할 필요충분조건은 $\displaystyle\lim_{x\to0+}x^{3-n}$이 수렴하는 것이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        (i) $n=1,2$일 때, $\displaystyle\lim_{x\to0+}x^{3-n}=0$이므로 주어진 극한은 수렴하고 그 극한값은 $0$이다.
      criteria: ['3.A1']
