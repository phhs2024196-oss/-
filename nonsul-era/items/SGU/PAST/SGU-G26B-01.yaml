- id: '4'
  stem: |
    $t>0$일 때, 곡선 $y=kx^3$ 위의 점 $\mathrm{P}(t,\,kt^3)$에서의 접선을 $l$이라고 하자. 접선 $l$이 곡선 $y=kx^3$과 만나는 점 중에서 $\mathrm{P}$가 아닌 점을 $\mathrm{A}$, 점 $\mathrm{A}$에서 $y$축에 내린 수선의 발을 $\mathrm{B}$, 접선 $l$이 $y$축과 만나는 점을 $\mathrm{C}$라고 하자. 삼각형 $\mathrm{ABC}$에 내접하는 원의 둘레의 길이를 $L(t)$라고 할 때, $\displaystyle\lim_{t\to\infty}\frac{L(t)}{t}$의 값을 구하시오. (단, $k$는 $0$보다 큰 상수)
  points: 10
  depends_on: ['3']
  answer: {kind: value, value: '2*pi', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $kx^3=3kt^2x-2kt^3\iff(x-t)^2(x+2t)=0$에서 $\mathrm{A}(-2t,-8kt^3)$, 직각삼각형 ABC의 내접원 반지름은 $r=\dfrac{\mathrm{AB}\cdot\mathrm{BC}}{\mathrm{AB}+\mathrm{BC}+\mathrm{CA}}$.
    steps:
    - {id: 4a, content: '$r=\dfrac{6kt^3}{1+3kt^2+\sqrt{1+9k^2t^4}}$, $\dfrac{L}{t}\to\dfrac{12\pi k}{6k}=2\pi$', criteria: ['4.M1', '4.A1', '4.M2', '4.A2']}
    hint_ladder:
    - 접점은 접선과 곡선의 교점 방정식의 중근이다.
    - 직각삼각형에서 넓이를 두 가지로 나타내면 내접원의 반지름을 얻는다.
  - id: S4-B
    audience: B
    source_flow: '논술가이드북2027 p.86'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        문항 [1-3]의 풀이로부터 접선 $l$의 방정식은 $y=3kt^2x-2kt^3$이고 점 $\mathrm{C}$의 좌표는 $(0,\,-2kt^3)$이다. 접선 $l$이 곡선 $y=kx^3$과 만나는 점의 $x$좌표를 구하면
        $$kx^3=3kt^2x-2kt^3,\quad x^3-3t^2x+2t^3=0,\quad(x-t)^2(x+2t)=0$$
        이므로 $x=t$, $x=-2t$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        따라서 점 $\mathrm{A}$의 좌표는 $(-2t,\,-8kt^3)$이고, 점 $\mathrm{B}$의 좌표는 $(0,\,-8kt^3)$이 되어
        $$\overline{\mathrm{AB}}=2t,\quad\overline{\mathrm{BC}}=6kt^3,\quad\overline{\mathrm{CA}}=\sqrt{(2t)^2+(6kt^3)^2}=2t\sqrt{1+9k^2t^4}$$
        [그림: 곡선 $y=kx^3$과 점 $\mathrm{P}$에서의 접선, 제3사분면 쪽의 점 $\mathrm{A}$, $y$축 위의 $\mathrm{B}$·$\mathrm{C}$가 이루는 직각삼각형과 내접원]
      criteria: ['4.A1']
    - id: 4b-3
      content: |
        삼각형 $\mathrm{ABC}$에 내접하는 원의 반지름을 $r$이라 하면, 삼각형 $\mathrm{ABC}$의 넓이로부터
        $$\frac12\times(\overline{\mathrm{AB}}+\overline{\mathrm{BC}}+\overline{\mathrm{CA}})\times r=\frac12\times\overline{\mathrm{AB}}\times\overline{\mathrm{BC}}$$
        이므로
        $$r=\frac{2t\times6kt^3}{2t+6kt^3+2t\sqrt{1+9k^2t^4}}=\frac{6kt^3}{1+3kt^2+\sqrt{1+9k^2t^4}}$$
      criteria: ['4.M2']
    - id: 4b-4
      content: |
        $L(t)=2\pi r$이므로
        $$\lim_{t\to\infty}\frac{L(t)}{t}=\lim_{t\to\infty}\frac{12\pi kt^2}{1+3kt^2+\sqrt{1+9k^2t^4}}=\lim_{t\to\infty}\frac{12\pi k}{\frac1{t^2}+3k+\sqrt{\frac1{t^4}+9k^2}}=\frac{12\pi k}{3k+\sqrt{9k^2}}=2\pi$$
      criteria: ['4.A2']
