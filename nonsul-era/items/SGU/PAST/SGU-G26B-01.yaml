stimuli:
- label: 가
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, 곡선 $y=f(x)$ 위의 점 $\mathrm{P}(a,\,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
- label: 나
  body: |
    급수 $\displaystyle\sum_{n=1}^{\infty}a_n$에서 첫째항부터 제$n$항까지의 합 $S_n$, 즉
    $$S_n=a_1+a_2+a_3+\cdots+a_n=\sum_{k=1}^{n}a_k$$
    를 이 급수의 제$n$항까지의 부분합이라고 한다. 급수 $\displaystyle\sum_{n=1}^{\infty}a_n$의 부분합으로 이루어진 수열 $\{S_n\}$이 일정한 값 $S$에 수렴할 때, 즉
    $$\lim_{n\to\infty}S_n=\lim_{n\to\infty}\sum_{k=1}^{n}a_k=S$$
    일 때, 이 급수는 $S$에 수렴한다고 한다. 이때 $S$를 이 급수의 합이라고 하고,
    $$a_1+a_2+a_3+\cdots+a_n+\cdots=S\quad\text{또는}\quad\sum_{n=1}^{\infty}a_n=S$$
    와 같이 나타낸다. 한편, 급수 $\displaystyle\sum_{n=1}^{\infty}a_n$의 부분합으로 이루어진 수열 $\{S_n\}$이 발산할 때, 이 급수는 발산한다고 한다.

stem: |
  제시문 [가]와 [나]를 참고하여 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    두 정수 $a$와 $b$에 대하여 방정식 $2ax^3-3bx^2+b^2=0$이 서로 다른 세 실근을 갖도록 하는 순서쌍 $(a,\,b)$의 개수를 구하시오.
    (단, $0\le a\le100$, $0\le b\le100$, $a+b>0$)
  points: 10
  depends_on: []
  answer: {kind: value, value: '615', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 삼차방정식($a>0$)이고 극값이 두 개($b>0$)이며 극댓값 $f(0)=b^2>0$, 극솟값 $f\left(\tfrac ba\right)<0$이어야 하므로 $a^2<b\le100$.
    steps:
    - {id: 1a, content: '$b>a^2$, $1\le a\le9$ → $\sum_{k=1}^{9}(100-k^2)=615$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 서로 다른 세 실근을 가지려면 극댓값과 극솟값은 어떤 관계여야 하는가?
    - $f'(x)=6x(ax-b)$의 두 근에서 함숫값을 계산해 보자.
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2027 p.85'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=2ax^3-3bx^2+b^2$이라 하자. 방정식이 서로 다른 세 실근을 갖기 위해서는 ① 삼차방정식이어야 하고, ② $f(x)$가 극대와 극소를 둘 다 가져야 하며, ③ $f(x)$의 극댓값과 극솟값의 부호가 달라야 한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (i) ①에 의하여 $a\ne0$이어야 하므로 $a>0$이다.
        (ii) $f'(x)=6ax^2-6bx=6x(ax-b)$이므로 $x=0$, $x=\dfrac ba$에서 $f'(x)=0$이다. ②에 의하여 $b\ne0$이어야 하므로 $b>0$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        (iii) $f(0)=b^2>0$이므로 ③에 의하여 $f\left(\dfrac ba\right)<0$이어야 한다.
        $$f\left(\frac ba\right)=2a\left(\frac ba\right)^3-3b\left(\frac ba\right)^2+b^2=-\frac{b^3}{a^2}+b^2<0$$
        이므로 $b>a^2$이다. 또한 $b\le100$이므로 $a\le9$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        $k\le9$인 자연수 $k$에 대하여 $a=k$이면 $a^2<b\le100$을 만족하는 $b$의 개수는 $100-k^2$이다. 따라서 구하는 순서쌍의 개수는
        $$\sum_{k=1}^{9}(100-k^2)=100\times9-\frac{9\times10\times19}{6}=615$$
      criteria: ['1.M2', '1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        세 실근 조건을 (삼차방정식, 극대·극소 존재, 극값의 부호가 다름)으로 정리하고 $a>0$, $b>0$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $f\left(\dfrac ba\right)<0$에서 $b>a^2$, 그리고 $a\le9$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $a=k$마다 $b$의 개수 $100-k^2$을 세어 합 $\sum_{k=1}^{9}(100-k^2)$으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        개수 615를 얻었다.
      depends_on: [1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    자연수 $n$에 대하여 $a_n=\displaystyle\int_0^1x^8(1-x^3)^n\,dx$라고 할 때, 급수 $\displaystyle\sum_{n=1}^{\infty}a_n$의 수렴, 발산을 조사하고, 수렴하면 그 합을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1/18', equivalents: [], tolerance: null}   # 수렴하고 합은 1/18
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $1-x^3=t$로 치환하면 $a_n=\dfrac13\left(\dfrac1{n+1}-\dfrac2{n+2}+\dfrac1{n+3}\right)$, 부분합이 망원되어 $\dfrac1{18}$에 수렴한다.
    steps:
    - {id: 2a, content: '$S_n=\tfrac1{18}-\tfrac1{3(n+2)}+\tfrac1{3(n+3)}\to\tfrac1{18}$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - $x^8\,dx=x^6\cdot x^2\,dx$로 보고 $1-x^3$을 치환하자.
    - $\dfrac1{n+1}-\dfrac2{n+2}+\dfrac1{n+3}$을 두 개의 차로 쪼개 보자.
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2027 p.85~86'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $1-x^3=t$로 놓으면 $-3x^2\dfrac{dx}{dt}=1$이고, $x=0$일 때 $t=1$, $x=1$일 때 $t=0$이므로
        $$a_n=\int_0^1x^8(1-x^3)^ndx=-\frac13\int_1^0(1-t)^2t^ndt=\frac13\int_0^1(1-2t+t^2)t^ndt$$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $$a_n=\frac13\int_0^1(t^n-2t^{n+1}+t^{n+2})dt=\frac13\left[\frac{1}{n+1}t^{n+1}-\frac{2}{n+2}t^{n+2}+\frac{1}{n+3}t^{n+3}\right]_0^1=\frac13\left(\frac1{n+1}-\frac2{n+2}+\frac1{n+3}\right)$$
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        제$n$항까지의 부분합을 $S_n$이라 하면
        $$S_n=\frac13\sum_{k=1}^{n}\left(\frac1{k+1}-\frac1{k+2}\right)-\frac13\sum_{k=1}^{n}\left(\frac1{k+2}-\frac1{k+3}\right)=\frac13\left(\frac12-\frac1{n+2}\right)-\frac13\left(\frac13-\frac1{n+3}\right)=\frac1{18}-\frac1{3(n+2)}+\frac1{3(n+3)}$$
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $\displaystyle\lim_{n\to\infty}S_n=\lim_{n\to\infty}\left\{\frac1{18}-\frac1{3(n+2)}+\frac1{3(n+3)}\right\}=\frac1{18}$이므로, 제시문 [나]에 의하여 급수 $\displaystyle\sum_{n=1}^{\infty}a_n$은 수렴하고 그 합은 $\dfrac1{18}$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $1-x^3=t$ 치환으로 $a_n$을 $\dfrac13\displaystyle\int_0^1(1-t)^2t^ndt$ 꼴의 다항함수 적분으로 바꾸었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $a_n=\dfrac13\left(\dfrac1{n+1}-\dfrac2{n+2}+\dfrac1{n+3}\right)$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        부분합 $S_n$을 망원 형태로 정리해 닫힌 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $\lim S_n=\dfrac1{18}$로부터 급수가 수렴하고 합이 $\dfrac1{18}$임을 밝혔다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $1$보다 큰 자연수 $n$에 대하여 곡선 $y=cx^n\,(x\ge0)$ 위의 점 $(a,\,ca^n)$에서의 접선을 $l_n$이라고 하자. 곡선 $y=cx^n\,(x\ge0)$과 접선 $l_n$ 및 $x$축으로 둘러싸인 도형의 넓이를 $A_n$이라 하고 접선 $l_n$과 $x$축 및 $y$축으로 둘러싸인 삼각형의 넓이를 $B_n$이라고 할 때, $\displaystyle\lim_{n\to\infty}\frac{n^2A_n}{B_n}$의 값을 구하시오.
    (단, $a$와 $c$는 $0$보다 큰 상수)
  points: 10
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 접선의 $x$절편 $\tfrac{n-1}{n}a$, $y$절편 $-c(n-1)a^n$으로 $A_n=\tfrac{c(n-1)}{2n(n+1)}a^{n+1}$, $B_n=\tfrac{c(n-1)^2}{2n}a^{n+1}$.
    steps:
    - {id: 3a, content: '$\dfrac{n^2A_n}{B_n}=\dfrac{n^2}{(n+1)(n-1)}\to1$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2']}
    hint_ladder:
    - 접선의 두 절편을 먼저 구하자.
    - $A_n$은 곡선 아래 넓이에서 접선 아래 삼각형 넓이를 뺀 것이다.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2027 p.86'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(x)=cx^n$이라 하면 $f'(x)=cnx^{n-1}$이다. 제시문 [가]에 의하여 점 $(a,\,ca^n)$에서의 접선 $l_n$의 방정식은 $y-ca^n=cna^{n-1}(x-a)$이므로 $y=cna^{n-1}x-c(n-1)a^n$이다. 따라서 $y$절편은 $-c(n-1)a^n$, $x$절편은 $\dfrac{n-1}{n}a$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $$A_n=\int_0^acx^ndx-\frac12\left(a-\frac{n-1}{n}a\right)\times ca^n=\frac{c}{n+1}a^{n+1}-\frac{c}{2n}a^{n+1}=\frac{c(n-1)}{2n(n+1)}a^{n+1}$$
        $$B_n=\frac12c(n-1)a^n\times\frac{n-1}{n}a=\frac{c(n-1)^2}{2n}a^{n+1}$$
        [그림: 제1사분면의 곡선 $y=cx^n$과 접선 $l_n$ 사이, $x$축 위쪽의 영역 $A_n$(파란색), 접선과 $x$축·$y$축이 만드는 원점 아래쪽 삼각형 $B_n$(붉은색)]
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        그러므로
        $$\lim_{n\to\infty}\frac{n^2A_n}{B_n}=\lim_{n\to\infty}n^2\times\frac{c(n-1)}{2n(n+1)}a^{n+1}\times\frac{2n}{c(n-1)^2a^{n+1}}=\lim_{n\to\infty}\frac{n^2}{(n+1)(n-1)}=\lim_{n\to\infty}\frac{1}{\left(1+\frac1n\right)\left(1-\frac1n\right)}=1$$
      criteria: ['3.M2', '3.A2']
