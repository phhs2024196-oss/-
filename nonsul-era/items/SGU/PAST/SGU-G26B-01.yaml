  미분을 활용해 삼차방정식의 실근 개수 조건을 구하고 경우의 수·수열의 합으로 세는 능력, 치환적분으로 정적분을 다항함수의 적분으로 바꾸어 급수의 수렴·발산과 합을 판정하는 능력, 다항함수의 접선과 넓이·수열의 극한, 삼차함수의 그래프와 접선의 교점(삼차방정식)과 함수의 극한을 활용하는 능력을 평가한다.
