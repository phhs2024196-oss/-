- id: '4'
  stem: |
    $-1\le x\le1$일 때, 점 $\mathrm{Q}\left(x,\,\sqrt{1-x^2}\right)$과 두 점 $\mathrm{C}\left(b,\,\sqrt{1-b^2}\right)$, $\mathrm{D}\left(b,\,-\sqrt{1-b^2}\right)$에 대하여 $\overline{\mathrm{QD}}^4-\overline{\mathrm{QC}}^4$을 $q(x)$라고 하자. 닫힌구간 $[-1,\,1]$에서 함수 $q(x)$의 최댓값 $M$이 $\dfrac{M^2}{(1-b^2)\left(3+\sqrt{1+8b^2}\right)^2}=15$를 만족시킬 때, 상수 $b$의 값을 구하시오. (단, $0<b<1$)
  points: 15
  depends_on: ['2', '3']
  answer: {kind: value, value: '2/7', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $q(x)=(\overline{\mathrm{QD}}^2+\overline{\mathrm{QC}}^2)(\overline{\mathrm{QD}}^2-\overline{\mathrm{QC}}^2)=16\sqrt{1-b^2}\sqrt{g(x)}$ ($k=b$), $[-1,1]$에서 $g$의 최댓값은 $x=\frac{1-\sqrt{1+8b^2}}{4b}$에서.
    steps:
    - {id: 4a, content: '$1-\left(\tfrac{1-\sqrt{1+8b^2}}{4b}\right)^2=\tfrac{15}{16}\Rightarrow\sqrt{1+8b^2}=b+1\Rightarrow b=\tfrac27$', criteria: ['4.M1', '4.A1', '4.M2', '4.A2']}
    hint_ladder:
    - 네제곱의 차를 합과 차의 곱으로 쓰고 [2-3]의 계산을 재활용하자.
    - $q(x)$를 [2-2]의 $g(x)$로 나타낼 수 있는가?
  - id: S4-B
    audience: B
    source_flow: '논술가이드북2027 p.91~92'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        문항 [2-3]의 풀이에서 $\overline{\mathrm{PA}}^2$과 $\overline{\mathrm{PB}}^2$를 구한 식을 이용하면
        $$q(x)=\left(\overline{\mathrm{QD}}^2+\overline{\mathrm{QC}}^2\right)\left(\overline{\mathrm{QD}}^2-\overline{\mathrm{QC}}^2\right)=16(1-bx)\sqrt{1-b^2}\sqrt{1-x^2}$$
        이다. $1-bx\ge0$과 문항 [2-2]에서 $k=b$일 때의 함수 $g(x)=(1-bx)^2(1-x^2)$을 이용하면
        $$q(x)=16\sqrt{1-b^2}\sqrt{(1-bx)^2(1-x^2)}=16\sqrt{1-b^2}\sqrt{g(x)}$$
        이다. 따라서 닫힌구간 $[-1,\,1]$에서 함수 $g(x)$가 최대일 때 함수 $q(x)$도 최대가 된다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        문항 [2-2]의 풀이로부터 함수 $g(x)$는 $x=\dfrac{1-\sqrt{1+8b^2}}{4b}$, $x=\dfrac1b$에서 극댓값을 갖는다. $0<b<1$이므로 $\dfrac1b>1$이고
        $$-1=\frac{1-\sqrt{(1+4b)^2}}{4b}<\frac{1-\sqrt{1+8b^2}}{4b}$$
        이다. 따라서 닫힌구간 $[-1,\,1]$에서 함수 $g(x)$는 $x=\dfrac{1-\sqrt{1+8b^2}}{4b}$에서만 극댓값을 가지고 $g(-1)=g(1)=0$이므로, 함수 $g(x)$는 $x=\dfrac{1-\sqrt{1+8b^2}}{4b}$에서 최댓값을 가지고, $q(x)$도 $x=\dfrac{1-\sqrt{1+8b^2}}{4b}$에서 최댓값 $M$을 갖는다.
      criteria: ['4.A1']
    - id: 4b-3
      content: |
        $$M^2=256(1-b^2)\left(1-\frac{1-\sqrt{1+8b^2}}{4}\right)^2\left\{1-\left(\frac{1-\sqrt{1+8b^2}}{4b}\right)^2\right\}=16(1-b^2)\left(3+\sqrt{1+8b^2}\right)^2\left\{1-\left(\frac{1-\sqrt{1+8b^2}}{4b}\right)^2\right\}$$
        이고 $\dfrac{M^2}{(1-b^2)\left(3+\sqrt{1+8b^2}\right)^2}=15$이므로 $1-\left(\dfrac{1-\sqrt{1+8b^2}}{4b}\right)^2=\dfrac{15}{16}$이다.
      criteria: ['4.M2']
    - id: 4b-4
      content: |
        따라서
        $$\frac{1-\sqrt{1+8b^2}}{4b}=-\frac14,\quad\sqrt{1+8b^2}=b+1,\quad1+8b^2=(b+1)^2,\quad b(7b-2)=0$$
        이므로 $b=\dfrac27$이다.
      criteria: ['4.A2']
