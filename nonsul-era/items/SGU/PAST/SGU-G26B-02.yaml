stimuli:
- label: 가
  body: |
    좌표평면 위의 두 점 $\mathrm{A}(x_1,\,y_1)$, $\mathrm{B}(x_2,\,y_2)$ 사이의 거리는
    $$\overline{\mathrm{AB}}=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$$
- label: 나
  body: |
    세 함수 $f(x)$, $g(x)$, $h(x)$와 $a$에 가까운 모든 실수 $x$에 대하여
    ① $f(x)\le g(x)$이고 극한값 $\displaystyle\lim_{x\to a}f(x)$와 $\displaystyle\lim_{x\to a}g(x)$가 존재하면
    $$\lim_{x\to a}f(x)\le\lim_{x\to a}g(x)$$
    ② $f(x)\le h(x)\le g(x)$이고 $\displaystyle\lim_{x\to a}f(x)=\lim_{x\to a}g(x)=L$이면
    $$\lim_{x\to a}h(x)=L$$
- label: 다
  body: |
    함수 $f(x)$가 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(a)\ge f(x)$일 때, 함수 $f(x)$는 $x=a$에서 극대라고 하며 이때의 함숫값 $f(a)$를 극댓값이라고 한다. 또, 함수 $f(x)$가 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(a)\le f(x)$일 때, 함수 $f(x)$는 $x=a$에서 극소라고 하며 이때의 함숫값 $f(a)$를 극솟값이라고 한다.
- label: 라
  body: |
    무리수 $e$의 정의
    $$\lim_{x\to0}(1+x)^{\frac1x}=e$$

stem: |
  [문제]

subparts:
- id: '1'
  stem: |
    함수 $f(x)=\begin{cases}ax+b & (x\le0)\\ x\sqrt x\cos\dfrac1x+e^x & (x>0)\end{cases}$이 $x=0$에서 미분가능할 때, 상수 $a$, $b$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: 'a=1; b=1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 연속에서 $b=\lim_{x\to0+}f(x)=1$, 좌·우 미분계수 일치에서 $a=\lim_{x\to0+}\left(\sqrt x\cos\frac1x+\frac{e^x-1}{x}\right)=1$. 진동항은 조임정리로 0.
    steps:
    - {id: 1a, content: '$b=1$, $a=1$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 미분가능하면 연속이다.
    - $\cos\frac1x$는 극한이 없지만 $\lvert\cos\frac1x\rvert\le1$이다.
  - id: S1-B
    audience: B
    source_flow: '논술가이드북2027 p.90'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$가 $x=0$에서 미분가능하므로 $x=0$에서 연속이다. 따라서
        $$f(0)=\lim_{x\to0+}f(x)=\lim_{x\to0+}\left(x\sqrt x\cos\frac1x+e^x\right)$$
        $x>0$에 대하여 $-x\sqrt x\le x\sqrt x\cos\dfrac1x\le x\sqrt x$이고 $\displaystyle\lim_{x\to0+}x\sqrt x=0$이므로, 제시문 [나]를 이용하면 $\displaystyle\lim_{x\to0+}x\sqrt x\cos\frac1x=0$이다. 또한 $\displaystyle\lim_{x\to0+}e^x=1$이므로 $\displaystyle\lim_{x\to0+}f(x)=1$이다.
      criteria: ['1.M1']
    # 원문 p.90 은 이 줄에서 'lim √x cos(1/x) + lim e^x = 1' 로 x 가 빠진 오식으로 보임 → 바로 앞 문장의 x√x cos(1/x) 로 적음
    - id: 1b-2
      content: |
        $f(0)=b$이므로 $b=1$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        한편, 함수 $f(x)$가 $x=0$에서 미분가능하므로 $\displaystyle\lim_{x\to0-}\frac{f(x)-f(0)}{x-0}=\lim_{x\to0+}\frac{f(x)-f(0)}{x-0}$이다.
        $$\lim_{x\to0-}\frac{f(x)-f(0)}{x-0}=\lim_{x\to0-}\frac{ax}{x}=a$$
        $$\lim_{x\to0+}\frac{f(x)-f(0)}{x-0}=\lim_{x\to0+}\frac{x\sqrt x\cos\frac1x+e^x-1}{x}=\lim_{x\to0+}\left(\sqrt x\cos\frac1x+\frac{e^x-1}{x}\right)$$
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $x>0$에 대하여 $-\sqrt x\le\sqrt x\cos\dfrac1x\le\sqrt x$이고 $\displaystyle\lim_{x\to0+}\sqrt x=0$이므로, 제시문 [나]를 이용하면 $\displaystyle\lim_{x\to0+}\sqrt x\cos\frac1x=0$이다. 또한 $\displaystyle\lim_{x\to0+}\frac{e^x-1}{x}=1$이므로 $a=\displaystyle\lim_{x\to0+}\sqrt x\cos\frac1x+\lim_{x\to0+}\frac{e^x-1}{x}=1$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        미분가능 ⇒ 연속을 써서 $f(0)=\lim_{x\to0+}f(x)$로 두고, 조임정리([나])로 $x\sqrt x\cos\frac1x\to0$을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $b=1$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        좌미분계수 $a$와 우미분계수 $\lim_{x\to0+}\left(\sqrt x\cos\frac1x+\frac{e^x-1}{x}\right)$가 같다는 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: |
        조임정리와 $\lim\frac{e^x-1}{x}=1$로 $a=1$을 얻었다.
      depends_on: [1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    함수 $g(x)=(1-kx)^2(1-x^2)$이 $x=\alpha$, $x=\beta$에서 극댓값을 갖는다. $\alpha\beta=-\dfrac23$일 때, 상수 $k$의 값을 구하시오. (단, $0<k<1$, $\alpha\ne\beta$)
  points: 15
  depends_on: []
  answer: {kind: value, value: 'sqrt(6)/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g'(x)=-4k^2\left(x-\frac1k\right)\left(x-\frac{1-\sqrt{1+8k^2}}{4k}\right)\left(x-\frac{1+\sqrt{1+8k^2}}{4k}\right)$이고 극대점은 가장 작은 근과 $\frac1k$.
    steps:
    - {id: 2a, content: '$\dfrac{1-\sqrt{1+8k^2}}{4k^2}=-\dfrac23\Rightarrow k^2(8k^2-3)=0\Rightarrow k=\dfrac{\sqrt6}{4}$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - $g'(x)$에서 $(1-kx)$를 공통인수로 묶자.
    - 최고차항이 음수인 사차함수에서 극대점은 세 임계점 중 어느 둘인가?
  - id: S2-B
    audience: B
    source_flow: '논술가이드북2027 p.90'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g'(x)=-2k(1-kx)(1-x^2)-2x(1-kx)^2$이므로 이를 인수분해하면
        $$g'(x)=2(1-kx)(2kx^2-x-k)=-4k^2\left(x-\frac1k\right)\left(x-\frac{1-\sqrt{1+8k^2}}{4k}\right)\left(x-\frac{1+\sqrt{1+8k^2}}{4k}\right)$$
        따라서 방정식 $g'(x)=0$은 실근 $x=\dfrac1k$, $x=\dfrac{1+\sqrt{1+8k^2}}{4k}$, $x=\dfrac{1-\sqrt{1+8k^2}}{4k}$을 갖는다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $0<k<1$이므로 $k>0$, $1+\sqrt{1+8k^2}<4$를 이용하면
        $$\frac{1-\sqrt{1+8k^2}}{4k}<\frac{1+\sqrt{1+8k^2}}{4k}<\frac1k$$
        임을 알 수 있다. $x=\dfrac{1-\sqrt{1+8k^2}}{4k}$, $x=\dfrac1k$의 좌우에서 $g'(x)$의 부호가 양(+)에서 음(−)으로 바뀌므로 함수 $g(x)$는 $x=\dfrac{1-\sqrt{1+8k^2}}{4k}$, $x=\dfrac1k$에서 극댓값을 갖는다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $\alpha\beta=-\dfrac23$이므로
        $$\frac{1-\sqrt{1+8k^2}}{4k^2}=-\frac23,\quad3\sqrt{1+8k^2}=8k^2+3,\quad9(1+8k^2)=(8k^2+3)^2,\quad k^2(8k^2-3)=0$$
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $0<k<1$이므로 $k=\dfrac{\sqrt6}{4}$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $g'(x)=2(1-kx)(2kx^2-x-k)$로 인수분해하여 세 임계점을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        세 임계점의 대소를 비교하고 부호 변화로 극대점 $\dfrac{1-\sqrt{1+8k^2}}{4k}$, $\dfrac1k$를 판정했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        $\alpha\beta=\dfrac{1-\sqrt{1+8k^2}}{4k^2}=-\dfrac23$을 세워 $k$에 대한 방정식으로 정리했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $0<k<1$에서 $k=\dfrac{\sqrt6}{4}$를 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $0\le x\le1$일 때, 점 $\mathrm{P}\left(x,\,\sqrt{1-x^2}\right)$과 두 점 $\mathrm{A}\left(a,\,\sqrt{1-a^2}\right)$, $\mathrm{B}\left(a,\,-\sqrt{1-a^2}\right)$에 대하여 $\overline{\mathrm{PA}}\times\overline{\mathrm{PB}}$를 $p(x)$라고 하자. $\displaystyle\int_0^1p(x)\,dx=\frac12$일 때, 상수 $a$의 값을 구하시오. (단, $0<a<1$)
  points: 15
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{PA}}^2\cdot\overline{\mathrm{PB}}^2=4\{(1-ax)^2-(1-x^2)(1-a^2)\}=4(x-a)^2$이므로 $p(x)=2\lvert x-a\rvert$.
    steps:
    - {id: 3a, content: '$\int_0^1 2\lvert x-a\rvert dx=2a^2-2a+1=\tfrac12\Rightarrow a=\tfrac12$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2']}
    hint_ladder:
    - $\overline{\mathrm{PA}}^2$와 $\overline{\mathrm{PB}}^2$를 따로 계산해 곱해 보자.
  - id: S3-B
    audience: B
    source_flow: '논술가이드북2027 p.91'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        제시문 [가]를 이용하여 $\overline{\mathrm{PA}}^2$와 $\overline{\mathrm{PB}}^2$를 구하면
        $$\overline{\mathrm{PA}}^2=(x-a)^2+\left(\sqrt{1-x^2}-\sqrt{1-a^2}\right)^2=2-2ax-2\sqrt{1-a^2}\sqrt{1-x^2}$$
        $$\overline{\mathrm{PB}}^2=(x-a)^2+\left(\sqrt{1-x^2}+\sqrt{1-a^2}\right)^2=2-2ax+2\sqrt{1-a^2}\sqrt{1-x^2}$$
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        이므로
        $$\{p(x)\}^2=\overline{\mathrm{PA}}^2\times\overline{\mathrm{PB}}^2=4\left(1-ax-\sqrt{1-x^2}\sqrt{1-a^2}\right)\left(1-ax+\sqrt{1-x^2}\sqrt{1-a^2}\right)=4\{(1-ax)^2-(1-x^2)(1-a^2)\}=4(x^2-2ax+a^2)=4(x-a)^2$$
        따라서 $p(x)=2\lvert x-a\rvert$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $0<a<1$이므로
        $$\frac12=\int_0^1p(x)dx=2\int_0^a(-x+a)dx+2\int_a^1(x-a)dx=2a^2-2a+1$$
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        이 되어 $(2a-1)^2=0$이다. 그러므로 $a=\dfrac12$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
