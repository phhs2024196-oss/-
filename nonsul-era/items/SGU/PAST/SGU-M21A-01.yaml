intent: |
  이항정리로 수열의 극한 계산에 유용한 부등식을 유도하고, 등비급수의 부분합을 미분·적분하여 $\sum\frac{n}{2^n}$, $\sum\frac{1}{n2^n}$ 같은 급수의 합을 계산하며, 정적분의 대소 관계로 정적분으로 정의된 수열이 $0$으로 수렴함을 보일 수 있는지 평가한다.
key_idea: |
  등비수열의 부분합 $\sum r^k$를 $r$에 대해 미분하면 $\sum kr^{k-1}$, $0$부터 $r$까지 적분하면 $\sum\frac{r^k}{k}$가 되고, 나머지 항은 (1)의 부등식이나 정적분의 대소 관계로 $0$에 수렴함을 보인다.
stuck: |
  등비급수 부분합 공식을 '미분' 또는 '적분'하여 새 급수의 부분합을 얻는 발상과, 나머지 적분항 $\int_0^{1/2}\frac{t^{n+1}}{1-t}dt$를 $\left(\frac12\right)^{n+1}\int_0^{1/2}\frac{1}{1-t}dt$로 위에서 누르는 발상
idea_tags: [IDEA-GEOM-SUM-DIFFERENTIATE, IDEA-GEOM-SUM-INTEGRATE, IDEA-SQUEEZE-INTEGRAL-REMAINDER]
tags: [이항정리 부등식, 급수의 합, 등비급수 미분·적분, 서강대 모의]
