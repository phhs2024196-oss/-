intent: |
  정적분과 급수의 합 사이의 관계로 극한식을 정적분으로 나타내 수면의 넓이 $f(x)$를 구하고, 부분적분법으로 부피 $V(x)$를 계산하며, 합성함수의 미분법으로 수면의 하강 속력을 구하고 도함수로 그 최솟값을 찾을 수 있는지 평가한다.
key_idea: |
  $\sum_{k=1}^n\left(\frac{kh}{n}\right)^2e^{-\frac{kh}{n}}\frac hn\to\int_0^h x^2e^{-x}dx$로 $f(x)=x^2e^{-x}$, 그리고 $\frac{dV}{dt}=f(x)\frac{dx}{dt}=-2x$에서 하강 속력 $\frac{2e^x}{x}$.
stuck: |
  극한식의 일반항 $k^2\left(\frac hn\right)^3e^{-\frac{kh}{n}}$을 $\left(\frac{kh}{n}\right)^2e^{-\frac{kh}{n}}\cdot\frac hn$으로 묶어 구분구적법 꼴로 보는 발상, 그리고 부피의 시간 변화율을 높이의 시간 변화율로 바꾸는 연쇄법칙
