# 서강대 2021학년도 모의논술 2차(자연계열) 문제 1~4 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 원문은 공통 상황(항아리) 아래 네 물음(첫 물음은 번호 없이 '함수 f(x)를 구하시오.', 이어서 2.~4.)이 제시문 [가]~[다]를 공유하는 한 세트(50분) → 한 문항(소문항 1~4)으로 입력.
# 배점: 공식 10점(2·2·4·2), 정수 그대로.
