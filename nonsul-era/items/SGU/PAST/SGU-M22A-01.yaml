stimuli:
- label: 가
  body: |
    삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이를 $R$, 삼각형 $\mathrm{ABC}$의 넓이를 $S$라고 하면
    $$\frac{a}{\sin A}=\frac{b}{\sin B}=\frac{c}{\sin C}=2R$$
    $$a^2=b^2+c^2-2bc\cos A$$
    $$b^2=c^2+a^2-2ca\cos B$$
    $$c^2=a^2+b^2-2ab\cos C$$
    $$S=\frac12ab\sin C=\frac12bc\sin A=\frac12ca\sin B$$
    [그림: 삼각형 ABC와 그 외접원(점선). 꼭짓점 A가 위, B가 왼쪽 아래, C가 오른쪽 아래이고, 변 BC에 $a$, 변 CA에 $b$, 변 AB에 $c$가 표시됨]
- label: 나
  body: |
    수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합
    $$a_1+a_2+a_3+\cdots+a_n$$
    을 기호 $\sum$를 사용하여 $\displaystyle\sum_{k=1}^{n}a_k$와 같이 나타낼 수 있다. 즉
    $$a_1+a_2+a_3+\cdots+a_n=\sum_{k=1}^{n}a_k$$
    이다.
- label: 다
  body: |
    아래 그림과 같이 모선의 길이가 3이고 밑면의 지름의 길이가 2인 직원뿔 모양의 산이 있다. 원뿔의 한 모선이 밑면과 만나는 점을 출발점 $\mathrm{A}=\mathrm{P}_0$, 이 모선 위에서 정상으로부터 1만큼 떨어진 점을 도착점 $\mathrm{B}$라고 하자. 선분 $\mathrm{AB}$를 $n$등분한 점에 $n$개의 전망대 $\mathrm{P}_1,\cdots,\mathrm{P}_n=\mathrm{B}$가 있다(단, $n$은 $1$보다 큰 자연수). 또한, $\mathrm{A}$를 출발하여 전망대 $\mathrm{P}_1,\cdots,\mathrm{P}_{n-1}$을 차례로 거쳐 $\mathrm{B}$에 도착하는 경로가 있다. 이때, 두 지점 $\mathrm{P}_{k-1}$과 $\mathrm{P}_k\ (k=1,\cdots,n)$ 사이의 경로는 산 주위를 한 바퀴 회전하면서 두 지점을 최단 거리로 잇는다.
    [그림: 꼭짓점 O, 모선 길이 3, 밑면 지름 2인 원뿔. 한 모선 위에 아래에서부터 $\mathrm{A}=\mathrm{P}_0$, $\mathrm{P}_1$, …, $\mathrm{B}=\mathrm{P}_n$이 있고 $\mathrm{B}$와 O 사이의 길이는 1. 붉은 곡선이 원뿔을 나선형으로 감아 오르며 전망대를 차례로 잇는다]

stem: |
  (시험시간 50분) 제시문 [가]-[다]를 참고하여 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【1-1】 $n$보다 작거나 같은 자연수 $k$에 대하여, $\mathrm{P}_{k-1}$과 $\mathrm{P}_k$를 잇는 경로의 길이를 $L_k$라 할 때 $L_k=\sqrt{\dfrac{12}{n^2}k^2-\left(\dfrac{36}{n}+\dfrac{12}{n^2}\right)k+27+\dfrac{18}{n}+\dfrac{4}{n^2}}$ 임을 보이시오.
  points: 2
  depends_on: []
  answer: {kind: proof, value: 'L_k**2 = 12*k**2/n**2 - (36/n + 12/n**2)*k + 27 + 18/n + 4/n**2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 전개한 부채꼴(반지름 $3$, 중심각 $\frac{2\pi}{3}$)에서 $\overline{\mathrm{OP}_{k-1}}=3-\frac2n(k-1)$, $\overline{\mathrm{OP}_k}=3-\frac2nk$, 끼인각 $\frac{2\pi}{3}$로 코사인법칙.
    steps:
    - {id: 1a, content: '$L_k^2=\{3-\tfrac2n(k-1)\}^2+(3-\tfrac2nk)^2-2\{3-\tfrac2n(k-1)\}(3-\tfrac2nk)\cos\tfrac{2\pi}{3}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 원뿔의 옆면을 펼치면 어떤 도형이 되는가? 그 중심각은?
    - 한 바퀴 도는 경로는 펼친 부채꼴의 두 반지름 위의 점을 잇는다.
  - id: S1-B
    audience: B
    source_flow: 모의논술자료집 p.4~5
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{P}_{k-1}$과 $\mathrm{P}_k$ 사이의 최단 경로는 원뿔의 옆면을 펼쳐서 생기는 부채꼴에서, 부채꼴을 이루는 서로 다른 반지름 위에 있는 $\mathrm{P}_{k-1}$과 $\mathrm{P}_k$를 선분으로 연결한 것이다. 이때, 부채꼴의 반지름의 길이는 원뿔의 모선의 길이와 같으므로 $3$이고, 호의 길이가 밑면의 원주인 $2\pi$와 같으므로 중심각은 $\dfrac{2\pi}{3}$이다. [그림: 중심 O, 중심각 $\frac{2\pi}{3}$, 반지름 3인 부채꼴. 왼쪽 반지름 위 $\mathrm{P}_{k-1}$(호에서 $\frac2n(k-1)$ 떨어짐), 오른쪽 반지름 위 $\mathrm{P}_k$(호에서 $\frac2nk$ 떨어짐)를 잇는 붉은 선분 $L_k$]
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\triangle\mathrm{OP}_{k-1}\mathrm{P}_k$에서 코사인법칙을 이용하면,
        $$L_k^2=\left\{3-\frac2n(k-1)\right\}^2+\left(3-\frac2nk\right)^2-2\left\{3-\frac2n(k-1)\right\}\left(3-\frac2nk\right)\cos\left(\frac{2\pi}{3}\right)=\frac{12}{n^2}k^2-\left(\frac{36}{n}+\frac{12}{n^2}\right)k+27+\frac{18}{n}+\frac{4}{n^2}$$
        이므로 $L_k=\sqrt{\dfrac{12}{n^2}k^2-\left(\dfrac{36}{n}+\dfrac{12}{n^2}\right)k+27+\dfrac{18}{n}+\dfrac{4}{n^2}}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        $\triangle\mathrm{OP}_{k-1}\mathrm{P}_k$에서 두 변의 길이 $\overline{\mathrm{OP}_{k-1}}$, $\overline{\mathrm{OP}_k}$와 그 사잇각($\frac{2\pi}{3}$)의 크기를 구했다(공식 1점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        코사인법칙을 사용하여 $L_k$를 구했다(공식 1점).
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    【1-2】 문항 【1-1】에서 정의한 $L_k$에 대하여, 극한값 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\frac{L_k^2}{n}$을 구하시오.
  points: 2
  depends_on: ['1']
  answer: {kind: value, value: '13', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\sum k^2$, $\sum k$ 공식으로 전개하면 극한은 $4-18+27$.
    steps:
    - {id: 2a, content: '$\lim\sum\tfrac{L_k^2}{n}=4-18+27=13$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $\sum_{k=1}^nk^2=\frac{n(n+1)(2n+1)}{6}$.
  - id: S2-B
    audience: B
    source_flow: 모의논술자료집 p.5
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $$\sum_{k=1}^{n}\frac{L_k^2}{n}=\frac{12}{n^3}\times\frac{n(n+1)(2n+1)}{6}-\left(\frac{36}{n^2}+\frac{12}{n^3}\right)\frac{n(n+1)}{2}+27+\frac{18}{n}+\frac{4}{n^2}$$
        이므로
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\frac{L_k^2}{n}=4-18+27=13$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 1
      evidence: |
        $\displaystyle\sum_{k=1}^n\frac{L_k^2}{n}$을 전개하여 $n$에 대한 식으로 나타냈다(공식 1점).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 1}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        극한값 $13$을 구했다(공식 1점).
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    【1-3】 두 점 $\mathrm{P}_0$와 $\mathrm{P}_1$을 잇는 경로 위의 점 중에서 밑면으로부터의 높이가 최대인 점을 $\mathrm{Q}_n$이라고 하고, 점 $\mathrm{Q}_n$의 밑면으로부터의 높이를 $h_n$이라고 하자. $h_n$을 $n$에 대한 식으로 나타내고, 극한값 $\displaystyle\lim_{n\to\infty}h_n$을 구하시오.
  points: 2
  depends_on: ['1']
  answer: {kind: expression, value: 'h_n = 2*sqrt(2)/3*(3 - 3*sqrt(3)/2*(3 - 2/n)*n/sqrt(27*n**2 - 18*n + 4)); limit = sqrt(2)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 높이 $=\frac{2\sqrt2}{3}(3-\overline{\mathrm{OQ}})$이므로 $\mathrm{Q}_n$은 O에서 $\mathrm{P}_0\mathrm{P}_1$에 내린 수선의 발이고, $b_n=\overline{\mathrm{OQ}_n}$은 넓이로 구한다.
    steps:
    - {id: 3a, content: '$b_n=\tfrac{3\sqrt3}{2}(3-\tfrac2n)\tfrac{n}{\sqrt{27n^2-18n+4}}$, $h_n=\tfrac{2\sqrt2}{3}(3-b_n)\to\sqrt2$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 모선 위에서 꼭짓점에 가까울수록 높다.
    - 꼭짓점에서 선분까지 가장 가까운 점은?
  - id: S3-B
    audience: B
    source_flow: 모의논술자료집 p.5
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        부채꼴의 호 위의 임의의 점 $\mathrm{R}$에 대하여 두 선분 $\mathrm{OR}$과 $\mathrm{P}_0\mathrm{P}_1$의 교점을 $\mathrm{Q}$라고 하자. 밑면으로부터의 높이는 $\dfrac{2\sqrt2}{3}\overline{\mathrm{QR}}$이므로 $\overline{\mathrm{QR}}$이 최대일 때, 즉, $\overline{\mathrm{OQ}}$가 최소일 때, 높이가 최대가 된다. 따라서, 높이가 최대가 되게 하는 점 $\mathrm{Q}_n$은 $\mathrm{O}$에서 선분 $\mathrm{P}_0\mathrm{P}_1$에 내린 수선의 발이다. [그림: 펼친 부채꼴에서 O에서 선분 $\mathrm{P}_0\mathrm{P}_1$에 내린 수선의 발 $\mathrm{Q}_n$, 반지름 OR과 선분의 교점 Q / 원뿔 그림에서 높이 $2\sqrt2$, 경로 위 점 Q와 그 아래 밑면 위 점 R]
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\overline{\mathrm{OQ}_n}=b_n$이라고 놓자. 삼각형 $\mathrm{OP}_0\mathrm{P}_1$의 넓이로부터 $\dfrac12L_1b_n=\dfrac12\times3\left(3-\dfrac2n\right)\times\sin\dfrac{2\pi}{3}$를 얻게 되어
        $$b_n=\frac{3\sqrt3}{2L_1}\left(3-\frac2n\right)=\frac{3\sqrt3}{2}\left(3-\frac2n\right)\frac{n}{\sqrt{27n^2-18n+4}}$$
        이다. 따라서,
        $$h_n=\frac{2\sqrt2}{3}(3-b_n)=\frac{2\sqrt2}{3}\left\{3-\frac{3\sqrt3}{2}\left(3-\frac2n\right)\frac{n}{\sqrt{27n^2-18n+4}}\right\}$$
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        이고 $\displaystyle\lim_{n\to\infty}h_n=\frac{2\sqrt2}{3}\left(3-\frac{3\sqrt3}{2}\times\frac{3}{\sqrt{27}}\right)=\sqrt2$이다. (원문 해설은 극한 기호 아래를 $h\to\infty$로 표기 — 오식으로 보고 $n\to\infty$로 옮김)
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 1
      evidence: |
        $\mathrm{Q}_n$을 O에서 선분 $\mathrm{P}_0\mathrm{P}_1$에 내린 수선의 발로 잡아 $h_n$을 $n$에 대한 식으로 나타냈다(공식 1점; 식 없이 극한값만 적으면 0점 — 공식 유의사항).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 1}
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
      points: 1
      evidence: |
        극한값 $\displaystyle\lim_{n\to\infty}h_n=\sqrt2$를 구했다(공식 1점).
      depends_on: [3.M1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    【1-4】 원뿔의 꼭짓점을 $\mathrm{O}$라고 하고 문항 【1-3】에서 정의한 점 $\mathrm{Q}_n$과 높이 $h_n$에 대하여 $a_n=\overline{\mathrm{OQ}_n}\times h_n^2$이라고 할 때, $n\ge2$인 모든 자연수 $n$에 대하여 $a_n>a_{n+1}$임을 보이시오.
  points: 2
  depends_on: ['3']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $a_n=\frac89b_n(3-b_n)^2=\frac89f(b_n)$, $f(x)=x(3-x)^2$는 $(1,3)$에서 감소, $b_n$은 $(1,\frac32)$에서 증가.
    steps:
    - {id: 4a, content: '$b_n\uparrow$, $b_n\in(1,\tfrac32)$, $f\prime(x)=3(x-1)(x-3)<0$ $\Rightarrow a_n>a_{n+1}$', criteria: ['4.R1', '4.A1']}
    hint_ladder:
    - $a_n$을 $b_n$만의 함수로 나타내 보자.
    - $b_n$은 $n$에 대해 증가하는가? 그 범위는?
  - id: S4-B
    audience: B
    source_flow: 모의논술자료집 p.6
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $n$이 커지면, $\overline{\mathrm{OP}_1}$가 길어지므로 $\angle\mathrm{OP}_0\mathrm{P}_1$이 커진다. 선분 $\mathrm{AB}$를 $n$등분했을 때 $\mathrm{P}_1$을 $\mathrm{P}_1^{(n)}$으로 나타내면, $b_n=3\sin(\angle\mathrm{OP}_0\mathrm{P}_1^{(n)})$이다. $n\ge2$인 모든 자연수 $n$에 대하여, $0<\angle\mathrm{OP}_0\mathrm{P}_1^{(n)}<\dfrac{\pi}{6}$이고 사인함수는 구간 $\left(0,\dfrac{\pi}{6}\right)$에서 증가한다. 따라서, $b_n<b_{n+1}$이다. 또한, $b_2=\dfrac{3\sqrt3}{\sqrt{19}}>1$이고 $\displaystyle\lim_{n\to\infty}b_n=\frac32$이므로, $n\ge2$인 모든 자연수 $n$에 대하여, $b_n\in\left(1,\dfrac32\right)$이다. [그림: 펼친 부채꼴에서 $n$일 때와 $n+1$일 때의 선분 $\mathrm{P}_0\mathrm{P}_1^{(n)}$, $\mathrm{P}_0\mathrm{P}_1^{(n+1)}$과 수선 $b_n$, $b_{n+1}$]
      criteria: ['4.R1']
    - id: 4b-2
      content: |
        한편, $a_n=\dfrac89b_n(3-b_n)^2$이므로, $f(x)=x(3-x)^2$이라고 하면 $a_n=\dfrac89f(b_n)$이다. $f'(x)=3(x-1)(x-3)$이므로, 구간 $\left(1,\dfrac32\right)$에서 $f'(x)<0$가 되어 $f$는 감소한다. 따라서, $a_n>a_{n+1}$이다.
      criteria: ['4.A1']
