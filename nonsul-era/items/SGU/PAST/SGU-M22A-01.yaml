intent: |
  원뿔의 옆면을 펼친 부채꼴에서 코사인법칙으로 경로의 길이를 구하고, $\sum$의 뜻과 수열의 극한의 기본 성질로 극한값을 구하며, 삼각형의 넓이 공식으로 높이를 나타내고, 삼각함수의 그래프와 도함수로 수열의 증감을 판정할 수 있는지 평가한다.
key_idea: |
  원뿔의 옆면을 펼치면 반지름 $3$, 중심각 $\frac{2\pi}{3}$인 부채꼴이 되고, $\mathrm{P}_{k-1}$, $\mathrm{P}_k$는 부채꼴의 두 반지름 위에 있어 최단 경로는 두 점을 잇는 선분이다. 높이는 꼭짓점까지 거리 $\overline{\mathrm{OQ}}$가 최소일 때 최대이다.
stuck: |
