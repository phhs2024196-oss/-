stimuli:
- label: 가
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능하면
    $\dfrac{f(b)-f(a)}{b-a}=f'(c)$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: 나
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌 구간 $[a,b]$에서 미분가능하고, $f'(x)$, $g'(x)$가 연속일 때, 다음 등식이 성립한다.
    $$\int_a^b f(x)g'(x)\,dx=\Big[f(x)g(x)\Big]_a^b-\int_a^b f'(x)g(x)\,dx$$
- label: 다
  body: |
    수열 $\{a_n\}$, $\{b_n\}$이 수렴하고 $\displaystyle\lim_{n\to\infty}a_n=\lim_{n\to\infty}b_n=\alpha$일 때, 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$을 만족하면 $\displaystyle\lim_{n\to\infty}c_n=\alpha$이다.
- label: 라
  body: |
    함수 $f(x)$가 닫힌 구간 $[a,b]$에서 연속이면 다음 등식이 성립한다.
    $$\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x=\int_a^b f(x)\,dx\quad\left(\text{단, }\Delta x=\frac{b-a}{n},\ x_k=a+k\Delta x\right)$$

stem: |
  (시험시간 50분) 제시문 [가]-[라]를 참고하여 다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    【1-1】 함수 $f(x)=\sqrt{1+x}$에 제시문 [가]를 적용하여 $-1<x<0$ 일 때 부등식 $\sqrt{1+x}<1+\dfrac x2$이 성립함을 보이시오.
  points: 2
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $[x,0]$에서 평균변화율 $=\frac{1}{2\sqrt{1+c}}>\frac12$ ($x<c<0$).
    steps:
    - {id: 1a, content: '$\tfrac{1-\sqrt{1+x}}{-x}=\tfrac{1}{2\sqrt{1+c}}>\tfrac12\Rightarrow\sqrt{1+x}<1+\tfrac x2$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 구간 $[x,0]$에서 평균값 정리를 쓴다.
    - $c<0$이면 $\sqrt{1+c}<1$이다.
  - id: S1-B
    audience: B
    source_flow: 모의논술자료집 p.5
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\sqrt{1+x}$에 대하여 닫힌구간 $[x,0]$에 제시문 [가]의 평균값 정리를 적용하면 $x<c<0$인 적당한 $c$가 존재하여
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $$\frac{1-\sqrt{1+x}}{-x}=\frac{f(0)-f(x)}{0-x}=f'(c)=\frac{1}{2\sqrt{1+c}}>\frac12$$
        가 성립하므로 ($-x>0$을 곱하면) $\sqrt{1+x}<1+\dfrac x2$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        $f(x)=\sqrt{1+x}$에 대하여 닫힌구간 $[x,0]$에 평균값 정리를 적용했다(공식 1점).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $f'(c)=\dfrac{1}{2\sqrt{1+c}}>\dfrac12$을 근거로 $\sqrt{1+x}<1+\dfrac x2$를 증명했다(공식 1점).
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    【1-2】 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능한 함수 $f(x)$가 모든 $x\in(a,b)$에 대하여 $f(x)>0$을 만족할 때, $\dfrac{1}{a-c}+\dfrac{1}{b-c}=\dfrac{f'(c)}{f(c)}$ 인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재함을 보이시오.
  points: 2
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(x)=(x-a)(x-b)f(x)$는 $g(a)=g(b)=0$이므로 $g'(c)=0$인 $c$가 있고, $(c-a)(c-b)f(c)\ne0$으로 나눈다.
    steps:
    - {id: 2a, content: '$g\prime(c)=0\Rightarrow\tfrac{1}{c-a}+\tfrac{1}{c-b}+\tfrac{f\prime(c)}{f(c)}=0$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 결론을 $\frac{f'}{f}$의 꼴로 정리하면 어떤 함수의 로그미분처럼 보이는가?
  - id: S2-B
    audience: B
    source_flow: 모의논술자료집 p.5
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(x)=(x-a)(x-b)f(x)$라 놓으면 $g(x)$는 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능하며 $g(a)=g(b)=0$이다. 따라서 제시문 [가]의 평균값정리에 의하여 $g'(c)=0$인 $c$가 열린구간 $(a,b)$에 존재한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $$g'(x)=(x-a)f(x)+(x-b)f(x)+(x-a)(x-b)f'(x)$$
        로부터 $0=(c-a)f(c)+(c-b)f(c)+(c-a)(c-b)f'(c)$를 얻는다. 등식의 양변을 $(c-a)(c-b)f(c)$로 나누면
        $$\frac{1}{c-a}+\frac{1}{c-b}+\frac{f'(c)}{f(c)}=0$$
        이 성립하여 $\dfrac{1}{a-c}+\dfrac{1}{b-c}=\dfrac{f'(c)}{f(c)}$을 얻는다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 1
      evidence: |
        $g(x)=(x-a)(x-b)f(x)$라 놓고 시작했다(공식 1점).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        $g'(c)=0$에서 $(c-a)(c-b)f(c)\ne0$으로 나누어 결론까지 증명을 완성했다(공식 1점).
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    【1-3】 적당한 다항함수 $g(x)$에 대하여 $f(x)=g(x)(\sin^2x+2\sin x)$로 표현되며 $\displaystyle\int_0^{2\pi}f(x)\,dx=-3$을 만족하는 임의의 함수 $f(x)$에 대하여 정적분 $\displaystyle\int_0^{2\pi}x(2\pi-x)f''(x)\,dx$의 값을 구하시오.
  points: 2
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 부분적분 두 번이면 경계항이 모두 $0$($x(2\pi-x)$와 $f$가 양 끝에서 $0$)이 되어 $-2\int_0^{2\pi}f\,dx=6$.
    steps:
    - {id: 3a, content: '$\int_0^{2\pi}x(2\pi-x)f\prime\prime dx=-\int_0^{2\pi}(2\pi-2x)f\prime dx=-2\int_0^{2\pi}f dx=6$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $x(2\pi-x)$는 양 끝에서 $0$이다.
    - $f(0)$, $f(2\pi)$는?
  - id: S3-B
    audience: B
    source_flow: 모의논술자료집 p.5
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $u=x(2\pi-x)$, $v'=f''$이라 놓고 제시문 [나]의 부분적분을 사용하면
        $$\int_0^{2\pi}x(2\pi-x)f''(x)\,dx=\Big[x(2\pi-x)f'(x)\Big]_0^{2\pi}-\int_0^{2\pi}(2\pi-2x)f'(x)\,dx=-\int_0^{2\pi}(2\pi-2x)f'(x)\,dx$$
        이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        다시한번 부분적분을 하고 $f(0)=f(2\pi)=0$을 사용하면
        $$-\int_0^{2\pi}(2\pi-2x)f'(x)\,dx=-\Big[(2\pi-2x)f(x)\Big]_0^{2\pi}-2\int_0^{2\pi}f(x)\,dx=-2\int_0^{2\pi}f(x)\,dx=6$$
        이다. 그러므로 $\displaystyle\int_0^{2\pi}x(2\pi-x)f''(x)\,dx=6$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 1
      evidence: |
        $u=x(2\pi-x)$, $v'=f''$이라 놓고 부분적분을 사용했다(공식 1점).
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 1
      evidence: |
        다시 한번 부분적분하고 $f(0)=f(2\pi)=0$을 써서 $6$을 구했다(공식 1점; 조건을 만족하는 특정 함수를 대입해 답을 구하면 0점 — 공식 유의사항).
      depends_on: [3.M1]
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    【1-4】 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여 $a_n>0$이고 $\displaystyle\lim_{n\to\infty}a_n=0$일 때 극한값
    $$\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}\sqrt{\frac kn+a_n}$$
    를 구하시오.
  points: 2
  depends_on: []
  answer: {kind: value, value: '2/3', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $\sqrt{\frac kn}\le\sqrt{\frac kn+a_n}\le\sqrt{\frac kn}+\sqrt{a_n}$로 끼우고 양쪽 극한 $\int_0^1\sqrt x\,dx=\frac23$.
    steps:
    - {id: 4a, content: '양변 극한 $\tfrac23$, $\tfrac23+0$ $\Rightarrow$ $\tfrac23$', criteria: ['4.M1', '4.A1']}
    hint_ladder:
    - $a_n$이 $k$와 무관하므로 $\sqrt{a_n}$을 따로 떼어 내 보자.
  - id: S4-B
    audience: B
    source_flow: 모의논술자료집 p.6
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $x,y>0$에 대하여 $\sqrt{x+y}<\sqrt x+\sqrt y$ 이므로 주어진 자연수 $n$에 대하여
        $$\frac1n\sum_{k=1}^{n}\sqrt{\frac kn}\le\frac1n\sum_{k=1}^{n}\sqrt{\frac kn+a_n}\le\frac1n\left[\sum_{k=1}^{n}\left(\sqrt{\frac kn}+\sqrt{a_n}\right)\right]$$
        이 성립한다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        제시문 [라]에 의하여 $\displaystyle\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}\sqrt{\frac kn}=\int_0^1\sqrt x\,dx=\frac23$ 이고 $\displaystyle\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}\sqrt{a_n}=\lim_{n\to\infty}\sqrt{a_n}=0$ 이므로
        $\displaystyle\lim_{n\to\infty}\frac1n\left[\sum_{k=1}^{n}\left(\sqrt{\frac kn}+\sqrt{a_n}\right)\right]=\frac23+0=\frac23$이다. 따라서 제시문 [다]에 의하여 $\displaystyle\lim_{n\to\infty}\frac1n\sum_{k=1}^{n}\sqrt{\frac kn+a_n}=\frac23$이다.
      criteria: ['4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 1
      evidence: |
        부등식 $\frac1n\sum\sqrt{\frac kn}\le\frac1n\sum\sqrt{\frac kn+a_n}\le\frac1n\sum\left(\sqrt{\frac kn}+\sqrt{a_n}\right)$을 얻었다(공식 1점).
      depends_on: []
      implied_ok: false
      steps: [4b-1]
    - id: 4.A1
      mark_type: A
      points: 1
      evidence: |
        양변에 극한을 취하여(정적분 $\int_0^1\sqrt x\,dx$, $\sqrt{a_n}\to0$) 극한값 $\dfrac23$을 얻었다(공식 1점; $a_n=0$을 대입해 답을 구하면 0점 — 공식 유의사항).
      depends_on: [4.M1]
      steps: [4b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

