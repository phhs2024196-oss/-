intent: |
  평균값 정리를 주어진 상황에 단순 적용하고, 결론의 형태로부터 보조함수를 스스로 찾아 창의적으로 활용하며, 부분적분을 두 번 이용해 적분값을 구하고, 정적분과 급수의 합 사이의 관계와 수열의 극한의 대소 관계로 급수의 극한값을 구하는 능력을 평가한다.
key_idea: |
  【1-2】는 $g(x)=(x-a)(x-b)f(x)$에 평균값 정리(롤의 정리)를 적용하고, 【1-3】은 $u=x(2\pi-x)$, $v'=f''$로 부분적분을 두 번 하여 $-2\int_0^{2\pi}f(x)dx$로 바꾸며, 【1-4】는 $\sqrt{x+y}<\sqrt x+\sqrt y$로 끼운다.
stuck: |
  결론 $\frac{1}{a-c}+\frac{1}{b-c}=\frac{f'(c)}{f(c)}$를 로그미분 꼴로 읽어 보조함수 $(x-a)(x-b)f(x)$를 만드는 발상, 그리고 $f(0)=f(2\pi)=0$이 저절로 성립함을 알아차리는 것
