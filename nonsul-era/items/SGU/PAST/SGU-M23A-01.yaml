intent: |
  접선의 방정식을 구하고 직선과 원의 접선의 기본 성질, 삼각함수의 덧셈정리(배각)를 활용해 접원의 반지름을 구하며, 함수의 극한값을 구하고, 함수의 증가·감소와 사잇값의 정리로 치역을 구할 수 있는지 평가한다.
key_idea: |
  접선 $l$과 $x$축(또는 $y$축)의 교점에서 원의 중심은 두 접선이 이루는 각의 이등분선 위에 있으므로 반지름 $=$ (접점까지 거리)$\times\tan\frac{\theta}{2}$이고, $\tan\theta$에서 배각 공식으로 $\tan\frac{\theta}{2}$를 구한다.
