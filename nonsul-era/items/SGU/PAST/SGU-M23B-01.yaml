stimuli:
- label: 가
  body: |
    독립
    두 사건 $A$, $B$에 대하여 한 사건이 일어나는 것이 다른 사건이 일어날 확률에 아무런 영향을 주지 않을 때, 즉 $P(B\mid A)=P(B)$일 때, 두 사건 $A$, $B$는 서로 독립이라 한다.
- label: 나
  body: |
    이항분포
    1회의 시행에서 사건 $A$가 일어날 확률이 $p$일 때, $n$회의 독립시행에서 사건 $A$가 일어나는 횟수를 확률변수 $X$라 하자. 확률변수 $X$가 가지는 값은 $0,1,\dots,n$ 이며, 그 확률질량함수는
    $x=0$ 일 때, $P(X=0)=(1-p)^n$,
    $x=1,\cdots,n-1$일 때, $P(X=x)={}_n\mathrm{C}_x\,p^x(1-p)^{n-x}$
    $x=n$ 일 때, $P(X=n)=p^n$ 이다.
- label: 다
  body: |
    기댓값
    이산확률 변수 $X$의 확률분포가 아래 표와 같을 때,
    [표: 첫 행 $X$: $x_1$, $x_2$, $\dots$, $x_n$, 합계 / 둘째 행 $P(X=x_i)$: $p_1$, $p_2$, $\dots$, $p_n$, $1$]
    $x_1p_1+x_2p_2+\cdots+x_np_n$을 이산확률변수 $X$의 기댓값 또는 평균이라 하고, 이것을 기호로 $E(X)$와 같이 나타낸다.

stem: |
  (시험시간 50분) 제시문 [가]-[다]를 참고하여 다음 물음에 답하시오.

  [그림: 위쪽에 강사 한 명, 아래에 사람 1, 사람 2, 사람 3, ……, 사람 $n-2$, 사람 $n-1$, 사람 $n$이 옆으로 일렬로 앉아 강사를 보고 있다]

  $n$명의 사람이 옆으로 일렬로 앉아서 레크리에이션 강사를 보고 있다. ($n\ge2$) 강사는 사람들을 서로 인사시키기 위해 말한다. "양 옆 사람에게 한 번씩 인사하세요. 제가 하나! 하면 왼쪽 또는 오른쪽으로 인사하고 둘! 하면 처음과 반대쪽으로 인사하세요." 사람들은 왼쪽 또는 오른쪽 중 임의의 방향으로 인사를 시작한다. 이 때, 양 끝의 두 사람(사람 1과 사람 $n$)은 사람이 있는 한쪽 방향으로만 인사를 두 번 반복한다.
   인접한 두 사람이 마주보고 인사를 하게 되면 '인사가 성공했다'라고 인사에 성공한 쌍이라 한다. 예를 들어, $n=3$일 때 인사를 하는 방법은 아래와 같이 두 가지 경우가 있고, 각각의 경우 인사에 성공한 쌍의 수는 2이다.

  [표: 경우 1 — 하나!: R L L(앞의 R L에 밑줄), 둘!: R R L(뒤의 R L에 밑줄), 인사에 성공한 쌍의 수 2 / 경우 2 — 하나!: R R L(뒤의 R L에 밑줄), 둘!: R L L(앞의 R L에 밑줄), 인사에 성공한 쌍의 수 2]

  (R은 오른쪽으로 인사를, L은 왼쪽으로 인사를 나타내고, 인접한 두 사람이 R L로 표시될 때 두 사람은 인사가 성공하는 쌍이 된다.)

subparts:
- id: '1'
  stem: |
    【1-1】. $n=4$일 때, 인사에 성공한 쌍의 수의 기댓값을 구하시오.
  points: 4
  depends_on: []
  answer: {kind: value, value: '5/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 사람 2, 3의 처음 방향 4가지를 모두 나열하면 성공 쌍 수는 $2,3,3,2$.
    steps:
    - {id: 1a, content: '$\tfrac{2+3+3+2}{4}=\tfrac52$', criteria: ['1.B1', '1.B2', '1.B3', '1.B4']}
    hint_ladder:
    - 방향을 고를 수 있는 사람은 사람 2와 사람 3뿐이다.
  - id: S1-B
    audience: B
    source_flow: 모의논술자료집 p.3
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $n=4$일 인사를 하는 방법은 4가지 경우가 있고, 각각의 경우 인사에 성공한 쌍의 수는 다음과 같다.
        [표: 경우 1 — 하나! R L L L, 둘! R R R L → 2 / 경우 2 — 하나! R L R L, 둘! R R L L → 3 / 경우 3 — 하나! R R L L, 둘! R L R L → 3 / 경우 4 — 하나! R R R L, 둘! R L L L → 2]
      criteria: ['1.B1', '1.B2', '1.B3', '1.B4']
    - id: 1b-2
      content: |
        따라서 인사에 성공한 쌍의 수의 기댓값은 $\dfrac{2+3+3+2}{4}=\dfrac52$이다.
      criteria: []
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: |
        경우 1(하나! R L L L)의 성공 쌍 수 $2$를 정확히 기술했다(공식 0.5점).
      depends_on: []
      steps: [1b-1]
    - id: 1.B2
      mark_type: B
      points: 1
      evidence: |
        경우 2(하나! R L R L)의 성공 쌍 수 $3$을 정확히 기술했다(공식 0.5점).
      depends_on: []
      steps: [1b-1]
    - id: 1.B3
      mark_type: B
      points: 1
      evidence: |
        경우 3(하나! R R L L)의 성공 쌍 수 $3$을 정확히 기술했다(공식 0.5점).
      depends_on: []
      steps: [1b-1]
    - id: 1.B4
      mark_type: B
      points: 1
      evidence: |
        경우 4(하나! R R R L)의 성공 쌍 수 $2$를 정확히 기술했다(공식 0.5점). (기댓값 $\frac52$ 자체에 대한 별도 배점은 공식 채점기준에 없음)
      depends_on: []
      steps: [1b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    【1-2】. $n\ge3$일 때, 인사에 성공한 쌍의 수의 기댓값을 구하시오.
  points: 6
  depends_on: ['1']
  answer: {kind: expression, value: '(n + 1)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 끝의 두 인사 쌍은 항상 1회 성공, 가운데 $n-3$개 쌍은 각각 확률 $\frac12$로 1회 성공.
    steps:
    - {id: 2a, content: '$2+\sum_{i=2}^{n-2}\tfrac12=\tfrac{n+1}{2}$', criteria: ['2.M1', '2.A1', '2.A2', '2.A3', '2.A4']}
    hint_ladder:
    - 인접한 두 사람의 '하나!' 방향 조합은 4가지뿐이다.
    - 기댓값은 쌍별 성공 확률의 합이다.
  - id: S2-B
    audience: B
    source_flow: 모의논술자료집 p.4
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $n\ge3$인 일반적인 경우에 인접한 두 사람이 인사에 성공하는 경우는 인접한 두 사람의 '하나!'에서의 인사 방향이 서로 반대인 경우(R L 또는 L R)이다. $n$명의 사람일 때 총 $n-1$개의 "인사 쌍"이 있다. $1$번째와 $n-1$번째의 인사 쌍에서는 항상 $1$회 인사가 성공한다. $2$번째부터 $n-2$번째 까지 인사 쌍에서의 인사 성공 여부를 조사하면 다음과 같다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        [표: ($i=2,\cdots,n-2$) 사람 $i$, 사람 $i+1$의 하나!/둘! 방향과 $i$번째 인사 쌍의 성공 여부 — 경우 1: 하나! R R, 둘! L L → 실패 / 경우 2: 하나! R L, 둘! L R → 1회 성공 / 경우 3: 하나! L R, 둘! R L → 1회 성공 / 경우 4: 하나! L L, 둘! R R → 실패]
      criteria: ['2.A1', '2.A2', '2.A3', '2.A4']
    - id: 2b-3
      content: |
        따라서 $i$번째 인사 쌍에서는 인사가 실패하거나 1회 성공하고, 성공할 확률은 $\dfrac12$이다. 따라서 인사에 성공한 쌍의 개수의 기댓값은 $2+\displaystyle\sum_{i=2}^{n-2}1\cdot\frac12=2+\frac{n-3}{2}=\frac{n+1}{2}$이다.
      criteria: []
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $i$번째 인사 쌍과 $i+1$번째 사람(사람 $i$, $i+1$)의 방향으로 나누어 총 4가지 경우로 구분했다(공식 1점).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        경우 1(R R → L L)이 실패임을 맞혔다(공식 0.5점).
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: |
        경우 2(R L → L R)가 1회 성공임을 맞혔다(공식 0.5점).
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A3
      mark_type: A
      points: 1
      evidence: |
        경우 3(L R → R L)이 1회 성공임을 맞혔다(공식 0.5점).
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A4
      mark_type: A
      points: 1
      evidence: |
        경우 4(L L → R R)가 실패임을 맞혔다(공식 0.5점). (기댓값 $\frac{n+1}{2}$ 자체에 대한 별도 배점은 공식 채점기준에 없음)
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    【1-3】. 모든 쌍이 인사에 성공할 확률을 구하시오.
  points: 2
  depends_on: ['2']
  # 공식 답 (1/2)^(n-3)은 n>=3에서 성립. 발문은 n>=2를 허용하는데 n=2이면 확률 1(공식 식으로는 2) — 사람 확인 필요.
  answer: {kind: expression, value: '(1/2)**(n - 3)', equivalents: ['2**(3 - n)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 가운데 $n-3$개 쌍이 모두 성공해야 하고, 각 쌍의 성공은 독립이며 확률 $\frac12$.
    steps:
    - {id: 3a, content: '$\left(\tfrac12\right)^{n-3}$', criteria: ['3.M1']}
    hint_ladder:
    - 끝의 두 쌍은 항상 성공한다.
  - id: S3-B
    audience: B
    source_flow: 모의논술자료집 p.4
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        모든 사람이 서로 인사하려면 모든 인사 쌍에서 인사가 성공해야 한다. 각각의 인사 쌍에서 인사에 성공하는 사건은 독립이므로, 각각의 인사 쌍에서 인사에 성공할 확률을 모두 곱하면 $\left(\dfrac12\right)^{n-3}$이다.
      criteria: ['3.M1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $n-3$개의 인사 쌍에 대해서 인사 성공 여부가 독립사건임을 적용하여 $\left(\dfrac12\right)^{n-3}$을 구했다(공식 1점).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.M1], max_points: 2}
      steps: [3b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    【1-4】. $n\ge4$일 때, 인사에 성공한 쌍의 수의 최댓값 $m$과 인사에 성공한 쌍의 수가 $k$일 확률을 구하시오. (단, $2\le k\le m$)
  points: 4
  depends_on: ['2']
  answer: {kind: expression, value: 'm = n - 1; P = binomial(n - 3, k - 2)*(1/2)**(n - 3)', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $m=n-1$, 가운데 $n-3$개 쌍 중 $k-2$개가 성공할 확률(이항분포 $B\left(n-3,\frac12\right)$).
    steps:
    - {id: 4a, content: '$m=n-1$, ${}_{n-3}\mathrm{C}_{k-2}\left(\tfrac12\right)^{n-3}$', criteria: ['4.B1', '4.M1']}
    hint_ladder:
