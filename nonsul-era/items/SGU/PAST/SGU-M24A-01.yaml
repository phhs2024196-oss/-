stimuli:
- label: 가
  body: |
    한 기차 회사가 $A$역과 $B$역을 오가는 열차를 운영하고자 한다. 이 회사는 하루에 총 2번의 열차 운행을 계획하고 있다. 그리고 역의 수와 운행 열차의 수를 확장하고자 한다. 각 역마다 다량의 열차가 항상 대기하고 있으며 출발 시각 순서대로 표를 만들려고 한다.
- label: 나
  body: |
    실수에서 정의된 함수 $f$에 대해 적당한 $L$이 존재하여 모든 실수 $x$가 $f(x+L)=f(x)$을 만족할 때 함수 $f$는 주기 $L$을 갖는 주기함수라고 한다. 다음처럼 정의된 함수 $f(x)$는 주기함수로서 실수 집합 전체로 확장 정의되어 있다:
    $$f(x)=\begin{cases}2/3\ (0\le x<1/3)\\ 1\quad\ (1/3\le x<2/3)\\ 4/3\ (2/3\le x<1)\end{cases}.$$
    함수 $f(x)$를 $n$번 합성한 함수를 $f^{(n)}(x)$라고 정의 한다.

stem: |
  제시문 [가]를 참조하여 문제 [1-1]과 [1-2]에 답하시오. 제시문 [나]를 참조하여 문제 [1-3]과 [1-4]에 답하시오.

subparts:
- id: '1'
  stem: |
    한 기차 회사가 $A$역과 $B$역을 오가는 열차를 운영하고자 한다. 이 회사는 하루에 총 2번의 열차 운행을 계획하고 있다. 각 열차는 $A$역 또는 $B$역을 출발하여 다른 역에 도착한다. 이 회사는 $A$역에서 출발하는 열차와 $B$역에서 출발하는 열차의 출발시각표를 만들려고 한다. 각 역마다 다량의 열차가 대기하고 있으며, 출발 시각 순서로 표를 만들려고 한다. 하루에 2번의 열차 운행을 할 때 가능한 모든 시각표의 경우의 수를 구하시오.
  points: 4
  depends_on: []
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 각 운행의 출발역을 순서대로 고르는 중복순열 $2^2=4$.
    steps:
    - {id: 1a, content: '$A$역 출발 횟수 $k=0,1,2$ 별로 BB, AB·BA, AA 이므로 $1+2+1=4$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 시각표는 운행 순서대로 출발역을 나열한 것이다.
    - 출발역을 정하면 도착역은 자동으로 정해진다.
  - id: S1-B
    audience: B
    source_flow: '모의논술자료집 p.5'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $A$역에서 출발하는 열차의 횟수를 $k$번이라 하면 $B$역에서 출발하는 열차는 $(2-k)$번이다($k=0,1,2$). 시각표는 출발 순서대로의 배열(순열)이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $k=0$: BB, $k=1$: AB, BA, $k=2$: AA. 따라서 가능한 모든 출발시각표는 $1+2+1=4$가지이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        출발시각표를 출발역의 순열(순서 있는 배열)로 보았다(원 기준 1점).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        경우의 수 4를 정확히 구했다(원 기준 1점).
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    deductions:
    - {code: D1, effect: zero, description: '출발시각표를 순열이라는 것을 이해하지 못하는 경우 0점(원 유의사항)'}
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    한 기차 회사가 $A$역, $B$역, $C$역 운행을 목표로 한다. $A$역과 $C$역 사이에 $B$역이 있으며, 하루에 총 3번의 열차 운행을 계획하고 있다. 각 열차는 $A$역 또는 $B$역 또는 $C$역을 출발하여 다른 역에 도착한다. $A$역에서 출발하면 $B$역에 도착해야하고 $C$역에서 출발하면 $B$역에 도착해야 한다. 그리고 $B$역에서 출발하면 $A$역 또는 $C$역에 도착해야 하다. 이 회사는 $A$역에서 출발하는 열차와 $B$역에서 출발하는 열차 그리고 $C$역에서 출발하는 열차의 출발시각표를 만들려고 한다. 각 역마다 다량의 열차가 대기하고 있으며, 출발 시각 순서로 표를 만들려고 한다. 하루에 3번의 열차 운행을 할 때 가능한 모든 시각표의 경우의 수를 구하시오.
  points: 4
  depends_on: ['1']
  answer: {kind: value, value: '64', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 한 번의 운행은 A, B(A), B(C), C 네 가지이므로 $4^3=64$.
    steps:
    - {id: 2a, content: '운행 종류 $\{A,\ B(A),\ B(C),\ C\}$ 에서 3번 중복순열: $4^3=64$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $B$역 출발 열차는 도착역에 따라 두 종류로 구별된다.
    - 각 운행마다 고를 수 있는 종류는 몇 가지인가?
  - id: S2-B
    audience: B
    source_flow: '모의논술자료집 p.5-6'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $A$역 출발 $k$번(도착 B), $B$역 출발 $\ell$번(도착 A 또는 C, B(A)·B(C)로 표기), $C$역 출발 $m$번(도착 B), $k+\ell+m=3$ 으로 놓고 시각표를 구성한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $(k,\ell,m)$별 순열의 수: $(0,1,2)$: $3+3$, $(0,2,1)$: $3+3+6$, $(1,0,2)$: $3$, $(1,2,0)$: $3+3+6$, $(2,0,1)$: $3$, $(2,1,0)$: $3+3$, $(3,0,0)$: $1$, $(0,3,0)$: $1+3+3+1$, $(0,0,3)$: $1$, $(1,1,1)$: $6+6$.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        모두 더하면 $(3+3)+(3+3+6)+3+(3+3+6)+3+(3+3)+1+(1+3+3+1)+1+(6+6)=64$가지이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 1
      evidence: |
        가능한 출발시각표를 구성했다(출발역별 횟수 설정 등, 원 기준 0.5점).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        순열 계산에서 $B$역 출발의 두 도착역을 포함해 가능한 경우의 수를 모두 고려했다(원 기준 1점).
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2, 2a]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: |
        모든 경우의 수를 합하여 64를 얻었다(원 기준 0.5점).
      depends_on: [2.M2]
      steps: [2b-3, 2a]
    deductions:
    - {code: D1, effect: minus, points: 2, description: '방법이 모두 맞는데 합산 과정에서 누락한 경우 원 기준 1점 감점(DB 환산 2점)'}
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    정의된 함수 $f(x)$에 대하여 함수 $f(x)$를 $n$번 합성한 함수를 $f^{(n)}(x)$라고 하면 $f^{(n)}(x)$은 주기 1인 주기함수임을 보이고 $f^{(n)}(1/2)=1$을 만족하는 모든 $n$을 찾으시오.
  points: 4
  depends_on: []
  answer: {kind: set, value: 'n = 3*m + 1 (m = 0, 1, 2, ...)', equivalents: ['n % 3 == 1'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f(x+1)=f(x)$ 를 가장 안쪽에 적용하고, $1/2\to1\to2/3\to4/3\to1$ 의 순환을 본다.
    steps:
    - {id: 3a, content: '$f^{(n)}(x+1)=f^{(n-1)}(f(x+1))=f^{(n)}(x)$; $f^{(n)}(1/2)$ 는 $1,2/3,4/3$ 순환 → $n=3m+1$', criteria: ['3.R1', '3.M1', '3.A1']}
    hint_ladder:
    - $f^{(n)}(x+1)$ 의 가장 안쪽 함수에 주기성을 적용하라.
    - $f(1)$, $f(2/3)$, $f(4/3)$ 을 차례로 계산해 보라.
  - id: S3-B
    audience: B
    source_flow: '모의논술자료집 p.6'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        실수 $x$에 대해 $f^{(n)}(x+1)=f^{(n)}(x)$를 보이면 된다. 정의에 의해 $f(x+1)=f(x)$이므로 $f^{(n)}(x+1)=f^{(n-1)}(f(x+1))=f^{(n-1)}(f(x))=f^{(n)}(x)$이다. 따라서 $f^{(n)}(x)$는 주기 1인 함수이다.
      criteria: ['3.R1']
    - id: 3b-2
      content: |
        구간 $0\le x<1/3$, $1/3\le x<2/3$, $2/3\le x<1$ 에서 $f$ 는 $2/3,\,1,\,4/3$, $f^{(2)}$ 는 $4/3,\,2/3,\,1$, $f^{(3)}$ 은 $1,\,4/3,\,2/3$, $f^{(4)}$ 는 다시 $2/3,\,1,\,4/3$ 이다(표).
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        따라서 $f^{(n)}(1/2)=1$이 되는 자연수 $n$은 $1,4,7,10,\dots$, 즉 3으로 나눈 나머지가 1인 자연수 $3m+1$ ($m=0,1,2,3,\dots$)이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.R1
      mark_type: R
      points: 2
      evidence: |
        $f^{(n)}(x+1)=f^{(n)}(x)$ 를 주기성 $f(x+1)=f(x)$ 로부터 증명했다(원 기준 1점).
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3a]
    - id: 3.M1
      mark_type: M
      points: 1
      evidence: |
        $f^{(2)},f^{(3)},\dots$ 의 값을 구간별로 계산해 순환을 보였다.
      depends_on: []
      implied_ok: true
      steps: [3b-2, 3a]
    - id: 3.A1
      mark_type: A
      points: 1
      evidence: |
        $n=3m+1$ ($m\ge0$)을 정확히 찾았다(원 기준 1점 중 결과 부분).
      depends_on: [3.M1]
      steps: [3b-3, 3a]
    deductions:
    - {code: D1, effect: minus, points: 2, description: '계산과정이 모두 맞는데 단순 산술 연산 오류인 경우 원 기준 1점 감점(DB 환산 2점)'}
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    정의된 함수 $f(x)$에 대하여
    $$a_{3n+1}=\int_{n+1/3}^{n+2/3}(n+1)f^{(3n+1)}(x)(x-n)^n dx$$
    이라 할 때, $\displaystyle\sum_{n=0}^{\infty}a_{3n+1}$을 계산하시오.
  points: 4
  depends_on: ['3']
  answer: {kind: value, value: '3/2', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $f^{(3n+1)}=f$ 이고 구간 $[n+1/3,n+2/3)$ 에서 값 1이므로 $a_{3n+1}=(2/3)^{n+1}-(1/3)^{n+1}$.
    steps:
    - {id: 4a, content: '$\sum\{(2/3)^{n+1}-(1/3)^{n+1}\}=2-\tfrac12=\tfrac32$', criteria: ['4.M1', '4.A1']}
    hint_ladder:
    - "[1-3]의 표에서 $f^{(3n+1)}$ 은 무엇과 같은가?"
    - $\int_{n+1/3}^{n+2/3}(n+1)(x-n)^n dx$ 를 계산하라.
  - id: S4-B
    audience: B
    source_flow: '모의논술자료집 p.7'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        자연수 $n$에 대하여 구간 $[n+1/3,\,n+2/3]$에서 $f^{(3n+1)}(x)$는 항상 1이다([1-3]의 순환·주기성; 원 해설에는 $f^{(2n+1)}$ 로 인쇄됨). 따라서
        $$a_{3n+1}=\int_{n+1/3}^{n+2/3}(n+1)(x-n)^n dx=(2/3)^{n+1}-(1/3)^{n+1}.$$
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        그러므로 $\displaystyle\sum_{n=0}^{\infty}a_{3n+1}=\sum_{n=0}^{\infty}(2/3)^{n+1}-\sum_{n=0}^{\infty}(1/3)^{n+1}=\frac{2/3}{1-2/3}-\frac{1/3}{1-1/3}=2-1/2=3/2.$
      criteria: ['4.A1']
