stimuli:
- label: 가
  body: |
    함수 $y=f(x)$의 그래프의 개형은 다음과 같은 사항을 조사하여 그릴 수 있다
    ① 함수의 정의역과 치역　② 곡선과 좌표축의 교점　③ 곡선의 대칭성과 주기　④ 함수의 증가와 감소　⑤ 곡선의 오목과 볼록, 변곡점　⑥ $\displaystyle\lim_{x\to\infty}f(x)$, $\displaystyle\lim_{x\to-\infty}f(x)$, 점근선
- label: 나
  body: |
    사인함수와 코사인함수의 덧셈정리
    ① $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$, $\sin(\alpha-\beta)=\sin\alpha\cos\beta-\cos\alpha\sin\beta$
    ② $\cos(\alpha+\beta)=\cos\alpha\cos\beta-\sin\alpha\sin\beta$, $\cos(\alpha-\beta)=\cos\alpha\cos\beta+\sin\alpha\sin\beta$
- label: 다
  body: |
    무리수 $e$
    $$\lim_{x\to0}(1+x)^{\frac1x}=e$$

stem: |
  제시문을 참고하여 문항 【1-1】~【1-4】에 답하시오.

subparts:
- id: '1'
  stem: |
    함수 $f(x)=2x+\sin2x$ $(0\le x\le\pi)$의 그래프의 개형을 그리시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  # 정답 요지: 증가함수, (0,π/2) 위로 볼록·(π/2,π) 아래로 볼록, 변곡점 (π/2, π), f(0)=0, f(π)=2π, f'(π/2)=0
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'=2(1+\cos2x)\ge0$, $f''=-4\sin2x$ 의 부호로 증감·오목볼록을 판정.
    steps:
    - {id: 1a, content: '증가, $(\tfrac{\pi}{2},\pi)$ 변곡점(접선 기울기 0), $(0,0)$ 에서 $(\pi,2\pi)$ 까지', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $1+\cos2x$ 의 부호를 생각하라.
  - id: S1-B
    audience: B
    source_flow: '모의논술자료집 p.5'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=2(1+\cos2x)$ 이고 $f''(x)=-4\sin2x$ 이므로 증감표는 $x=0$: $f'=4$, $f''=-4$, $f=0$ / $x=\dfrac{\pi}{2}$: $f'=0$, $f''=0$, $f=\pi$ / $x=\pi$: $f'=4$, $f''=-4$, $f=2\pi$ 이고, $\left(0,\dfrac{\pi}{2}\right)$ 에서 $f'>0$, $f''<0$, $\left(\dfrac{\pi}{2},\pi\right)$ 에서 $f'>0$, $f''>0$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $f(x)$는 증가함수이고 $0<x<\dfrac{\pi}{2}$일 때 위로 볼록, $\dfrac{\pi}{2}<x<\pi$일 때 아래로 볼록이다.
        [그림: 원점에서 출발해 위로 볼록하게 증가하여 변곡점 $\left(\dfrac{\pi}{2},\pi\right)$ 에서 접선이 수평이 되고, 다시 아래로 볼록하게 증가하여 $(\pi,2\pi)$ 에 이르는 곡선]
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $f'(x)=2(1+\cos2x)$, $f''(x)=-4\sin2x$ 를 구하고 부호표(증감·오목볼록)를 작성했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        증가함수, 변곡점 $\left(\dfrac{\pi}{2},\pi\right)$, 끝점 $(0,0)$·$(\pi,2\pi)$ 가 반영된 개형을 그렸다.
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $\mathrm{A}=\left(\dfrac{\pi}{2},0\right)$이고, 곡선 $y=\tan x$ $\left(0\le x<\dfrac{\pi}{2}\right)$ 위의 점 $(t,\tan t)$에서 접하는 접선이 $x$축과 만나는 점을 $\mathrm{B}$, 직선 $x=\dfrac{\pi}{2}$와 만나는 점을 $\mathrm{C}$라 하자. 삼각형 $\mathrm{ABC}$의 넓이를 $S(t)$라 할 때, 함수 $S(t)$가 구간 $\left[0,\dfrac{\pi}{2}\right)$에서 최대값과 최솟값을 갖는지 조사하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'min = pi**2/8; max = none', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $S=\tfrac12\sec^2t\left(\tfrac{\pi}{2}+\sin t\cos t-t\right)^2$, $p'(t)=\tfrac12\sin t\sec^2t(\pi-\sin2t-2t)>0$.
    steps:
    - {id: 2a, content: '$S$ 증가 → 최솟값 $S(0)=\tfrac{\pi^2}{8}$, 최댓값 없음', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - $\pi-\sin2t-2t$ 는 [1-1]의 함수와 어떤 관계인가?
  - id: S2-B
    audience: B
    source_flow: '모의논술자료집 p.5-6'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $(t,\tan t)$에서 접선의 방정식은 $y=\sec^2t\,(x-t)+\tan t$이다. $\mathrm{B}=(t-\sin t\cos t,\,0)$이므로 $\overline{\mathrm{AB}}=\dfrac{\pi}{2}+\sin t\cos t-t$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        삼각형 $\mathrm{ABC}$는 각 $\mathrm{A}$가 직각인 직각삼각형이고 접선의 기울기가 $\sec^2t$이므로 $\overline{\mathrm{AC}}=\sec^2t\times\overline{\mathrm{AB}}$이다(원 예시답안에는 $\overline{\mathrm{BC}}$ 로 인쇄됨 — 높이는 $\overline{\mathrm{AC}}$). 따라서
        $$S(t)=\frac12\sec^2t\left(\frac{\pi}{2}+\sin t\cos t-t\right)^2,\quad 0\le t<\frac{\pi}{2}.$$
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $p(t)=\sec t\left(\dfrac{\pi}{2}+\sin t\cos t-t\right)$라 하면 $p'(t)=\sin t\sec^2t\left(\dfrac{\pi}{2}-\sin t\cos t-t\right)=\dfrac12\sin t\sec^2t\,(\pi-\sin2t-2t)$이다. 문항 【1-1】에 의해 $2t+\sin2t<\pi$ $\left(0<t<\dfrac{\pi}{2}\right)$이므로 모든 $0<t<\dfrac{\pi}{2}$에서 $p'(t)>0$이고 $p(t)$는 증가함수이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $S(t)=\dfrac12\{p(t)\}^2$이므로 $S(t)$도 $0\le t<\dfrac{\pi}{2}$에서 증가함수이다. 따라서 $S(t)$의 최솟값은 $S(0)=\dfrac{\pi^2}{8}$이고, 최댓값은 존재하지 않는다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        접선의 방정식으로 $\mathrm{B}$ 의 좌표(또는 $\overline{\mathrm{AB}}$)를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $S(t)=\dfrac12\sec^2t\left(\dfrac{\pi}{2}+\sin t\cos t-t\right)^2$ 을 $t$ 로 나타냈다.
      depends_on: [2.M1]
      steps: [2b-2, 2a]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        도함수의 부호를 [1-1]의 결과로 판정해 $S$ 가 증가함을 보였다.
      depends_on: [2.A1]
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-3, 2a]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        최솟값 $\dfrac{\pi^2}{8}$, 최댓값은 존재하지 않음을 결론지었다.
      depends_on: [2.M2]
      steps: [2b-4, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    $\mathrm{A}=(a,0)$이고, 곡선 $y=\tan x$ $(0<x<a)$ 위를 움직이는 점 $\mathrm{C}(t,\tan t)$에 대하여 $\mathrm{B}=(t,0)$, $\mathrm{D}=(a,\tan t)$라 할 때, 사각형 $\mathrm{ABCD}$의 넓이의 최댓값을 $g(a)$라 하자. 문항 【1-3】과 【1-4】에 답하시오. (단, $0<a<\dfrac{\pi}{2}$)

    사각형 $\mathrm{ABCD}$의 넓이가 최대가 되는 $t$가 유일함을 보이고, $g(a)=\dfrac12$일 때 $a$의 값을 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: 'pi/4 + 1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $S'(t)=\tfrac12\sec^2t\,(2a-2t-\sin2t)$ 이고 $2t+\sin2t$ 가 증가하므로 영점 유일.
    steps:
    - {id: 3a, content: '$a-t_0=\sin t_0\cos t_0$, $g(a)=\sin^2t_0=\tfrac12\Rightarrow t_0=\tfrac{\pi}{4}$, $a=\tfrac{\pi}{4}+\tfrac12$', criteria: ['3.R1', '3.M1', '3.A1']}
    hint_ladder:
    - 넓이를 $S(t)=(a-t)\tan t$ 로 쓰고 미분하라.
    - $S'(t_0)=0$ 에서 얻는 관계를 $S(t_0)$ 에 대입하라.
  - id: S3-B
    audience: B
    source_flow: '모의논술자료집 p.6'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        사각형 $\mathrm{ABCD}$의 넓이를 점 $\mathrm{B}$의 좌표 $t$로 표현하면 $S(t)=(a-t)\tan t$이다. $S'(t)=\sec^2t\,(a-t-\sin t\cos t)=\dfrac12\sec^2t\,(2a-2t-\sin2t)$이므로, 문항 【1-1】에 의해 함수 $2a-2x-\sin2x$는 구간 $\left(0,\dfrac{\pi}{2}\right)$의 오직 한 점에서만 0이 된다. 따라서 $S'(t)$는 구간 $\left(0,\dfrac{\pi}{2}\right)$의 오직 한 점 $t=t_0$에서 0이고, $t=t_0$일 때 $S(t)$의 값이 최대가 된다.
      criteria: ['3.R1']
    - id: 3b-2
      content: |
        $S'(t_0)=0$으로부터 $a-t_0=\dfrac12\sin2t_0=\cos t_0\sin t_0$이므로 $g(a)=S(t_0)=\sin^2t_0$이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        따라서 $g(a)=\dfrac12$이면 $t_0=\dfrac{\pi}{4}$이고 $a=t_0+\sin t_0\cos t_0=\dfrac{\pi}{4}+\dfrac12$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.R1
      mark_type: R
      points: 5
      evidence: |
        $S'(t)$ 의 영점이 [1-1]의 단조성에 의해 유일하고 그 점에서 최대임을 보였다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 5}
      steps: [3b-1, 3a]
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $a-t_0=\sin t_0\cos t_0$ 로 $g(a)=\sin^2t_0$ 를 $t_0$ 로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [3b-2, 3a]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $a=\dfrac{\pi}{4}+\dfrac12$ 를 구했다.
      depends_on: [3.M1]
      steps: [3b-3, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    사각형 $\mathrm{ABCD}$의 넓이가 최대가 되는 $t$의 값을 $t_0$라 하자. 곡선 $y=\tan x$ $\left(0\le x<\dfrac{\pi}{2}\right)$와 $x$축 및 직선 $x=t_0$로 둘러싸인 도형의 넓이를 $h(a)$라 할 때, 극한 $\displaystyle\lim_{a\to0^+}\frac{h(a)}{g(a)}$을 조사하시오.
  points: 10
  depends_on: ['3']
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $h=-\ln\cos t_0$, $g=\sin^2t_0$, $t_0\to0^+$ 에서 $\cos t_0-1=k$ 로 치환.
    steps:
    - {id: 4a, content: '$\dfrac{\ln(1+k)}{(2+k)k}\to\dfrac12$', criteria: ['4.M1', '4.A1']}
    hint_ladder:
    - $a\to0^+$ 일 때 $t_0$ 는 어디로 가는가?
  - id: S4-B
    audience: B
    source_flow: '모의논술자료집 p.6'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        문제 3의 풀이에 의해 $g(a)=\sin^2t_0$이고 $h(a)=\displaystyle\int_0^{t_0}\tan x\,dx=-\ln(\cos t_0)$이다. $0<t_0<a$이므로 $a\to0^+$ 이면 $t_0\to0^+$ 이고
        $$\lim_{a\to0^+}\frac{h(a)}{g(a)}=\lim_{t_0\to0^+}\frac{-\ln(\cos t_0)}{\sin^2t_0}=\lim_{t_0\to0^+}\frac{\ln(\cos t_0)}{(1+\cos t_0)(\cos t_0-1)}.$$
      criteria: ['4.M1']
    - id: 4b-2
      content: |
