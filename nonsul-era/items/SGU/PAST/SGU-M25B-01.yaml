  $|\cos^3|\le1$ 과 [1-1]의 적분 대소관계로 $\left|\int_0^x t^2\cos^3(x-t)dt\right|\le\frac13x^3$, 홀함수성으로 음수 $x$ 에 확장, $t=x-u$ 치환으로 피적분함수에서 $x$ 를 분리해 미분.
