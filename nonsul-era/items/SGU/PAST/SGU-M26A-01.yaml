stimuli:
- label: 가
  body: |
    코사인법칙
    삼각형 $\mathrm{ABC}$에서
    $$a^2=b^2+c^2-2bc\cos A$$
- label: 나
  body: |
    삼각형의 넓이
    삼각형 $\mathrm{ABC}$의 넓이를 $S$라고 하면
    $$S=\frac12ab\sin C=\frac12bc\sin A=\frac12ca\sin B$$
- label: 다
  body: |
    합성함수의 미분
    두 함수 $y=f(u)$, $u=g(x)$가 미분가능할 때, 합성함수 $y=f(g(x))$의 도함수는
    $$\{f(g(x))\}'=f'(g(x))g'(x)$$
- label: 라
  body: |
    좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 위치가 $x=f(t)$, $y=g(t)$일 때, 점 $\mathrm{P}$의 시각 $t$에서의 속력은
    $$\sqrt{\{f'(t)\}^2+\{g'(t)\}^2}$$

stem: |
  좌표평면 위를 움직이는 두 점 $\mathrm{P}$와 $\mathrm{Q}$는 다음 조건을 만족한다. (단, $\mathrm{O}$는 원점)
  (i) $\overline{\mathrm{OP}}=1$이고 점 $\mathrm{P}$의 $y$좌표는 양수이다.
  (ii) 점 $\mathrm{Q}$는 $x$축 위에 있고 $x$좌표는 양수이다.
  (iii) $\overline{\mathrm{PQ}}=\dfrac{\sqrt6}{2}$

subparts:
- id: '1'
  stem: |
    점 $\mathrm{P}$에서 $x$축에 내린 수선의 발을 $\mathrm{H}$라고 하자. 삼각형 $\mathrm{PHQ}$의 넓이의 최댓값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3/8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 넓이 $=\tfrac12\sqrt{\tfrac{9}{16}-\left(h^2-\tfrac34\right)^2}$ 의 최대.
    steps:
    - {id: 1a, content: '$h^2=\tfrac34$ 일 때 최댓값 $\tfrac38$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $\overline{\mathrm{PH}}=h$ 로 두고 $\overline{\mathrm{HQ}}$ 를 $h$ 로 나타내라.
  - id: S1-B
    audience: B
    source_flow: '모의논술자료집 p.5'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{PH}}=h$라 하면, $0<h\le1$이고 $\overline{\mathrm{HQ}}=\sqrt{\dfrac32-h^2}$이 된다. 따라서 삼각형 $\mathrm{PHQ}$의 넓이는
        $$\frac h2\sqrt{\frac32-h^2}=\frac12\sqrt{\frac32h^2-h^4}=\frac12\sqrt{\frac{9}{16}-\left(h^2-\frac34\right)^2}$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이므로 최댓값은 $\dfrac38$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        삼각형 $\mathrm{PHQ}$ 의 넓이를 변수($h$ 등)로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        이차함수의 최대로 최댓값 $\dfrac38$ 을 구했다.
      depends_on: [1.M1]
      steps: [1b-2, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $\angle\mathrm{POQ}=\theta$일 때, 삼각형 $\mathrm{POQ}$의 넓이를 $f(\theta)$라 하자. $\displaystyle\int_{\frac{\pi}{4}}^{\frac{\pi}{3}}f(\theta)\cos\theta\,d\theta$의 값을 구하시오. (단, $\theta$는 라디안이고 $0<\theta<\pi$)
  points: 10
  depends_on: []
  answer: {kind: value, value: '(7 + 2*sqrt(2) - 3*sqrt(3))/48', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{OQ}}=\cos\theta+\sqrt{\cos^2\theta+\tfrac12}$, $f=\tfrac12\overline{\mathrm{OQ}}\sin\theta$ 후 두 적분을 각각 치환.
    steps:
    - {id: 2a, content: '$\tfrac12\left(\int_{1/2}^{\sqrt2/2}u^2du+\int_{3/4}^1\tfrac{\sqrt u}{2}du\right)=\tfrac{7+2\sqrt2-3\sqrt3}{48}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 코사인법칙으로 $\overline{\mathrm{OQ}}$ 를 $\theta$ 로 나타내라.
  - id: S2-B
    audience: B
    source_flow: '모의논술자료집 p.5'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        삼각형 $\mathrm{POQ}$에서 코사인법칙에 의해 $\dfrac32=\overline{\mathrm{OQ}}^2+1-2\times\overline{\mathrm{OQ}}\times\cos\theta$이므로, $\overline{\mathrm{OQ}}=\cos\theta+\sqrt{\cos^2\theta+\dfrac12}$이고 제시문 [나]에 의해
        $$f(\theta)=\frac12\left(\cos\theta+\sqrt{\cos^2\theta+\frac12}\right)\sin\theta.$$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 $\displaystyle\int_{\frac{\pi}{4}}^{\frac{\pi}{3}}f(\theta)\cos\theta\,d\theta=\frac12\left(\int_{\frac{\pi}{4}}^{\frac{\pi}{3}}\sin\theta\cos^2\theta\,d\theta+\int_{\frac{\pi}{4}}^{\frac{\pi}{3}}\sin\theta\cos\theta\sqrt{\cos^2\theta+\frac12}\,d\theta\right)$. 첫 번째 적분에서 $\cos\theta=u$, 두 번째 적분에서 $\cos^2\theta+\dfrac12=u$라 두면
        $$\frac12\left(\int_{\frac12}^{\frac{\sqrt2}{2}}u^2\,du+\int_{\frac34}^{1}\frac{\sqrt u}{2}\,du\right)=\frac16\left(\frac{2\sqrt2}{8}-\frac18\right)+\frac16\left(1-\frac{3\sqrt3}{8}\right)=\frac{7+2\sqrt2-3\sqrt3}{48}.$$
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        코사인법칙으로 $f(\theta)=\dfrac12\left(\cos\theta+\sqrt{\cos^2\theta+\frac12}\right)\sin\theta$ 를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        치환적분으로 $\dfrac{7+2\sqrt2-3\sqrt3}{48}$ 을 구했다.
      depends_on: [2.M1]
      steps: [2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    문항 【1-2】에서 구한 함수 $f(\theta)$는 열린구간 $(0,\pi)$에서 $\theta=\alpha$일 때 최댓값을 가진다. $\cos\alpha$의 값을 구하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: 'sqrt(10)/5', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\angle\mathrm{OPQ}=\beta$ 로 넓이 $\tfrac{\sqrt6}{4}\sin\beta$, $\beta=\tfrac{\pi}{2}$ 에서 최대.
    steps:
    - {id: 3a, content: '직각삼각형에서 $\overline{\mathrm{OQ}}=\sqrt{5/2}$, $\cos\alpha=\tfrac{\sqrt{10}}{5}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 길이가 고정된 두 변 $\overline{\mathrm{OP}}$, $\overline{\mathrm{PQ}}$ 의 끼인각으로 넓이를 표현하라.
  - id: S3-B
    audience: B
    source_flow: '모의논술자료집 p.5'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        함수 $f(\theta)$는 $\angle\mathrm{POQ}=\theta$일 때, 삼각형 $\mathrm{POQ}$의 넓이이다. $\angle\mathrm{OPQ}=\beta$라 하면 삼각형 $\mathrm{POQ}$의 넓이는 $\dfrac{\sqrt6}{4}\sin\beta$이고, $\beta=\dfrac{\pi}{2}$일 때 삼각형 $\mathrm{POQ}$의 넓이가 최대가 된다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        이 경우 삼각형 $\mathrm{POQ}$는 $\angle\mathrm{P}=\dfrac{\pi}{2}$, $\angle\mathrm{O}=\alpha$, $\overline{\mathrm{OP}}=1$, $\overline{\mathrm{PQ}}=\dfrac{\sqrt6}{2}$인 직각삼각형이므로, $\cos\alpha=\dfrac{\sqrt{10}}{5}$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        $f(\theta)$ 의 기하학적 의미(넓이 $\frac{\sqrt6}{4}\sin\beta$)로 최대 조건 $\beta=\frac{\pi}{2}$ 를 찾았다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3a]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        직각삼각형에서 $\cos\alpha=\dfrac{\sqrt{10}}{5}$ 를 구했다.
      depends_on: [3.M1]
      steps: [3b-2, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    점 $\mathrm{Q}$의 시각 $t$에서의 위치가 $x=t$, $y=0$이라고 하자. 점 $\mathrm{P}$의 시각 $t=a$에서의 위치가 $x=\dfrac12$, $y=\dfrac{\sqrt3}{2}$일 때, 점 $\mathrm{P}$의 시각 $t=a$에서의 속력을 구하시오. (단, $\dfrac{\sqrt6}{2}-1<t<\dfrac{\sqrt6}{2}+1$)
  points: 10
  depends_on: []
  answer: {kind: value, value: 'sqrt(3) - 1', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: P$=(\cos\theta(t),\sin\theta(t))$ 이므로 속력 $=|\theta'(t)|$, $\cos\theta(t)=\tfrac t2-\tfrac{1}{4t}$ 를 미분.
    steps:
    - {id: 4a, content: '$a=\tfrac{1+\sqrt3}{2}$, $\theta''(a)=1-\sqrt3$, 속력 $\sqrt3-1$', criteria: ['4.M1', '4.M2', '4.A1']}
    hint_ladder:
    - 점 P 는 단위원 위에 있으므로 각 $\theta(t)$ 하나로 위치가 정해진다.
  - id: S4-B
    audience: B
    source_flow: '모의논술자료집 p.5-6'
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        시각 $t$에서 $\angle\mathrm{POQ}=\theta(t)$라 하면 점 $\mathrm{P}$의 위치는 $x=\cos\theta(t)$, $y=\sin\theta(t)$이다. 따라서 제시문 [라]에 의해 점 $\mathrm{P}$의 시각 $t$에서의 속력은 $\sqrt{\{-\theta'(t)\sin\theta(t)\}^2+\{\theta'(t)\cos\theta(t)\}^2}=|\theta'(t)|$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        $\overline{\mathrm{OQ}}=t$이므로 삼각형 $\mathrm{POQ}$에서 코사인법칙에 의해 $\dfrac32=t^2+1-2t\cos\theta(t)$ …… (1). $t=a$일 때 $\cos\theta(a)=\dfrac12$이므로 식 (1)에 대입하면 $a^2-a-\dfrac12=0$이고 $a=\dfrac{1+\sqrt3}{2}$이다.
      criteria: ['4.M2']
    - id: 4b-3
      content: |
        식 (1)을 정리하면 $\cos\theta(t)=\dfrac t2-\dfrac{1}{4t}$이고 양변을 $t$로 미분하면 $-\theta'(t)\sin\theta(t)=\dfrac12+\dfrac{1}{4t^2}$이 된다. $t=a$일 때 $\sin\theta(a)=\dfrac{\sqrt3}{2}$이므로
        $$\theta'(a)=-\frac{1}{\sin\theta(a)}\left(\frac12+\frac{1}{4a^2}\right)=-\frac{2}{\sqrt3}\left(\frac12+\frac{1}{4+2\sqrt3}\right)=1-\sqrt3.$$
        따라서 점 $\mathrm{P}$의 시각 $t=a$에서의 속력은 $\sqrt3-1$이다.
      criteria: ['4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: |
        점 P 의 위치를 $\angle\mathrm{POQ}=\theta(t)$ 로 나타내고 속력을 $|\theta'(t)|$ 로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [4b-1, 4a]
    - id: 4.M2
      mark_type: M
      points: 3
      evidence: |
        코사인법칙으로 $t$ 와 $\angle\mathrm{POQ}$ 의 관계식 $\frac32=t^2+1-2t\cos\theta(t)$ 를 세우고 $a=\frac{1+\sqrt3}{2}$ 를 구했다.
      depends_on: []
      implied_ok: false
      steps: [4b-2, 4a]
    - id: 4.A1
      mark_type: A
      points: 4
      evidence: |
        합성함수 미분으로 $\theta'(a)=1-\sqrt3$ 을 얻어 속력 $\sqrt3-1$ 을 구했다.
      depends_on: [4.M1, 4.M2]
      steps: [4b-3, 4a]
    deductions: []
