intent: |
  함수의 그래프 개형을 그리고 정적분으로 넓이를 구하며, 조건을 만족하는 순서쌍의 개수를 $\Sigma$ 로 나타내 계산하고, 이계도함수와 변곡점의 관계로 사차함수와 상수 $m$ 을 결정하며, 도함수로 곡선과 직선의 교점의 개수를 구할 수 있는지 평가한다(출제의도 요지).
key_idea: |
  $|f|$ 가 $x=m$ 에서 미분불가능 ⇔ $f(m)=0$, $f'(m)\ne0$. $f'(x)=0$ 의 근 구조를 $c$ 의 범위로 나눠 $f=(x+3)^3(x-3)$ 을 얻고, 교점 문제는 $x=0$ 을 뺀 $x^3+6x^2-54=k$ 로 줄인다.
