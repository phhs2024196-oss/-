stimuli:
- label: 가
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b\lvert f(x)-g(x)\rvert\,dx$$
- label: 나
  body: |
    곡선 $y=f(x)$위의 점 $\mathrm{P}(a,f(a))$에 대하여 $x=a$의 좌우에서 곡선의 모양이 아래로 볼록에서 위로 볼록으로 변하거나 위로 볼록에서 아래로 볼록으로 변할 때, 점 $\mathrm{P}$를 곡선 $y=f(x)$의 변곡점이라고 한다.

stem: |
  문항 【1-1】~【1-4】에 답하시오.

subparts:
- id: '1'
  stem: |
    두 곡선 $y=x-\sqrt x$, $y=\sin\left(\dfrac{\pi}{2}x+\dfrac{\pi}{2}\right)$ 및 두 직선 $x=0$, $x=4$로 둘러싸인 도형의 넓이를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '4/pi + 3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g=\cos\tfrac{\pi}{2}x$ 이고 $[0,1]$ 에서 $f\le g$, $[1,4]$ 에서 $f\ge g$.
    steps:
    - {id: 1a, content: '$\int_0^1(g-f)+\int_1^4(f-g)=\tfrac4\pi+3$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $\sin\left(\tfrac{\pi}{2}x+\tfrac{\pi}{2}\right)$ 을 코사인으로 바꿔 보라.
    - 두 곡선은 $x=1$ 에서 만난다.
  - id: S1-B
    audience: B
    source_flow: '모의논술자료집 p.5'
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x-\sqrt x$라고 하면 $f(0)=f(1)=0$이다. $f'(x)=1-\dfrac{1}{2\sqrt x}=\dfrac{2\sqrt x-1}{2\sqrt x}$이므로 방정식 $f'(x)=0$의 해는 $x=\dfrac14$이다. 증감표: $x=0$에서 $0$, $\left(0,\dfrac14\right)$ 감소, $x=\dfrac14$에서 극솟값 $-\dfrac14$, 이후 증가.
        [그림: $y=x-\sqrt x$ 는 원점에서 출발해 $x=\tfrac14$ 에서 최솟값 $-\tfrac14$, $x=1$ 에서 $x$축과 만나고 이후 증가]
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $g(x)=\sin\left(\dfrac{\pi}{2}x+\dfrac{\pi}{2}\right)=\cos\left(\dfrac{\pi}{2}x\right)$라고 하면 $g(x)$의 주기는 4이고, 치역은 $\{y\mid-1\le y\le1\}$이다. 제시문 [가]에 의하여 구하는 넓이는 $\displaystyle\int_0^4\lvert f(x)-g(x)\rvert\,dx$이다. 그래프로부터 닫힌구간 $[0,1]$에서는 $f(x)\le g(x)$이고, 닫힌구간 $[1,3]$에서는 $f(x)\ge g(x)$임을 알 수 있다. 또한, 닫힌구간 $[3,4]$에서는 $f(x)$가 증가하므로 $f(x)\ge f(3)=3-\sqrt3>1\ge g(x)$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        따라서 구하는 넓이 $S$는
        $$S=\int_0^1\left\{\cos\left(\frac{\pi}{2}x\right)-x+\sqrt x\right\}dx+\int_1^4\left\{x-\sqrt x-\cos\left(\frac{\pi}{2}x\right)\right\}dx=\left[\frac2\pi\sin\left(\frac{\pi}{2}x\right)-\frac12x^2+\frac23x^{\frac32}\right]_0^1+\left[\frac12x^2-\frac23x^{\frac32}-\frac2\pi\sin\left(\frac{\pi}{2}x\right)\right]_1^4=\frac4\pi+3.$$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        도함수로 $y=x-\sqrt x$ 의 증감(극솟값 $-\frac14$, $x=1$ 에서 0)을 조사해 개형을 그렸다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1a]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $y=\cos\frac{\pi}{2}x$ (주기 4, 치역 $[-1,1]$)의 그래프를 그리고 구간별 대소 $[0,1]$: $f\le g$, $[1,4]$: $f\ge g$ 를 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1a]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        정적분으로 넓이 $\dfrac4\pi+3$ 을 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3, 1a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    두 정수 $a$, $b$에 대하여, 곡선 $y=x-\sqrt x$ $(1\le x\le100)$과 두 직선 $y=0$, $x=100$으로 둘러싸인 도형에 포함되는 순서쌍 $(a,b)$의 개수를 구하시오. (단, 도형은 둘레를 포함한다.)
  points: 10
  depends_on: []
  answer: {kind: value, value: '4435', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $n^2<a\le(n+1)^2$ 이면 $b=0,\dots,a-n-1$ 로 $a-n$ 개.
    steps:
    - {id: 2a, content: '$\sum_{k=1}^{100}k-\sum_{n=1}^{9}n\{(n+1)^2-n^2\}=5050-615=4435$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $\sqrt a$ 의 정수 부분이 같은 $a$ 끼리 묶어라.
  - id: S2-B
    audience: B
    source_flow: '모의논술자료집 p.5-6'
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        구하는 순서쌍 $(a,b)$의 개수는 100이하의 자연수 $a$에 대하여 $0\le b\le a-\sqrt a$를 만족하는 정수 $b$의 개수를 모두 구해서 더한 것과 같다.
        (a) $a=1$인 경우: $b=0$만 가능하므로 순서쌍 $(a,b)$의 개수는 1개다.
        (b) $n=1,2,\cdots,9$에 대하여, $a$가 $n^2<a\le(n+1)^2$인 정수인 경우: $n<\sqrt a\le n+1$이므로 $a-n-1\le a-\sqrt a<a-n$이다. 따라서 $b=0,1,\cdots,a-n-1$이므로 순서쌍 $(a,b)$의 개수는 $(a-n)$개이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        그러므로 구하는 순서쌍 $(a,b)$의 개수는
        $$1+\sum_{k=1^2+1}^{2^2}(k-1)+\sum_{k=2^2+1}^{3^2}(k-2)+\cdots+\sum_{k=9^2+1}^{10^2}(k-9)=\sum_{k=1}^{100}k-\{(2^2-1^2)+2\times(3^2-2^2)+\cdots+9\times(10^2-9^2)\}$$
        $$=\frac{100\times101}{2}-\sum_{n=1}^{9}n\{(n+1)^2-n^2\}=5050-\sum_{n=1}^{9}(2n^2+n)=5050-2\times\frac{9\times10\times19}{6}-\frac{9\times10}{2}=4435.$$
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        조건을 만족하는 순서쌍의 개수를 $\Sigma$ 로 나타냈다($n^2<a\le(n+1)^2$ 에서 $a-n$ 개).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2a]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $\sum k$, $\sum k^2$ 공식으로 4435 를 계산했다.
      depends_on: [2.M1]
      steps: [2b-2, 2a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    최고차항의 계수가 1인 사차함수 $f(x)$가 다음 조건을 만족한다.
    (가) 곡선 $y=f(x)$는 $x=-3$과 $x=0$에서 변곡점을 갖는다.
    (나) 함수 $g(x)=\lvert f(x)\rvert$는 $x=m$에서만 미분가능하지 않다. (단, $m$은 $0$보다 큰 상수)
    상수 $m$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f=x^4+6x^3+cx+d$, (나) ⇔ $f(m)=0$, $f'(m)\ne0$ 인 $m$ 이 유일·양수. $c=-54$, $f(-3)=0$ 일 때만 가능.
    steps:
    - {id: 3a, content: '$f(x)=x^4+6x^3-54x-81=(x+3)^3(x-3)$, $m=3$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - $\lvert f\rvert$ 가 미분가능하지 않은 점은 $f$ 의 어떤 근인가?
    - $f'(x)=0$ 의 실근 개수를 $c$ 의 범위로 나눠라.
  - id: S3-B
    audience: B
    source_flow: '모의논술자료집 p.6-7'
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(x)=x^4+ax^3+bx^2+cx+d$라고 하면 $f''(x)=12x^2+6ax+2b$. 조건 (가)에 의해 $f''(x)=12x(x+3)$이므로 $a=6$, $b=0$이고 $f(x)=x^4+6x^3+cx+d$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        한편, $g(x_0)=0$일 때 함수 $g(x)$가 $x=x_0$에서 미분가능할 필요충분조건은 $f'(x_0)=0$이다. 따라서 조건 (나)는 다음 조건 ㉠과 필요충분조건이다: "$f(m)=0$, $f'(m)\ne0$을 만족하는 실수 $m$은 오직 하나 존재하고, 이때 $m>0$이다." …… ㉠
        방정식 $f'(x)=0$, 즉 $-4x^3-18x^2=c$의 서로 다른 실근의 개수에 따라 경우를 나눈다. $h(x)=-4x^3-18x^2$이라 하면 $h'(x)=-12x(x+3)$이므로 $h$는 $x=-3$에서 극솟값 $-54$, $x=0$에서 극댓값 $0$.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        (a) $-54<c<0$: $f'(x)=0$은 서로 다른 세 실근 $\alpha<\beta<\gamma$를 가지고 $f$는 $\alpha,\gamma$에서 극소, $\beta$에서 극대. 극솟값과 극댓값의 부호에 따라 ㉠의 $m$의 개수는 0, 2, 4, 2개이므로 어느 경우에도 ㉠을 만족하지 않는다.
        (b) $c=-54$: $f'(x)=2(x+3)^2(2x-3)$이므로 $f$는 $x=\dfrac32$에서 극소. ① $f\left(\dfrac32\right)\ge0$: 0개 ② $f\left(\dfrac32\right)<0<f(-3)$: 2개 ③ $f(-3)=0$: 1개이고 $m>0$ ④ $f(-3)<0$: 2개. ③인 경우에만 ㉠을 만족한다.
        (c) $c=0$: $f'(x)=2x^2(2x+9)$, $x=-\dfrac92$에서 극소. ①0개 ②2개 ③ $f(0)=0$: 1개이고 $m<0$ ④2개. 어느 경우에도 ㉠을 만족하지 않는다.
        (d) $c<-54$ 또는 $c>0$: $f'(x)=0$이 오직 하나의 실근 $\alpha$를 갖고 $f$는 $\alpha$에서 극소이므로 ㉠을 만족하지 않는다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        따라서 (b)의 ③인 경우에만 조건 ㉠을 만족하며, 이 경우 $f(-3)=0$이므로 $d=-81$이다. 그러므로 $f(x)=x^4+6x^3-54x-81=(x+3)^3(x-3)$이고 $m=3$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        이계도함수와 변곡점의 관계로 $f''(x)=12x(x+3)$, $f(x)=x^4+6x^3+cx+d$ 를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3a]
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: |
        조건 (나)를 "$f(m)=0$, $f'(m)\ne0$ 인 $m$ 이 유일하고 양수"로 바꾸고, $f'(x)=0$ 의 근 구조($c$ 의 범위)로 사차함수 개형을 분류했다.
      depends_on: [3.M1]
      implied_ok: false
      steps: [3b-2, 3b-3, 3a]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $f(x)=(x+3)^3(x-3)$ 과 $m=3$ 을 구했다.
      depends_on: [3.M2]
      steps: [3b-4, 3a]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    문항 【1-3】에서 구한 함수 $f(x)$에 대하여 곡선 $y=f(x)$와 직선 $y=kx+f(0)$의 교점의 개수를 실수 $k$의 값에 따라 조사하시오.
  points: 10
