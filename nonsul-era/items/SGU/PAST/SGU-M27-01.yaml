        곡선 $y=f(x)$와 직선 $y=kx+f(0)$의 교점의 개수는 방정식 $x^4+6x^3-54x=kx$의 서로 다른 실근의 개수와 같다. 이 방정식은 $x=0$을 실근으로 갖는다. 이제 0이 아닌 실근을 찾기 위해 방정식 $x^3+6x^2-54=k$의 0이 아닌 서로 다른 실근의 개수를 조사하자. $g(x)=x^3+6x^2-54$라고 하면 $g'(x)=3x^2+12x=3x(x+4)$이므로 방정식 $g'(x)=0$의 해는 $x=0$, $x=-4$이다. 증감표: $x=-4$에서 극댓값 $-22$, $x=0$에서 극솟값 $-54$.
