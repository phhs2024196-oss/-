stimuli: []
stem: |
  정의역이 $\{x\mid -2\le x\le 3\}$인 함수 $y=2^{x}+a$의 최댓값이 $7$이고, 최솟값은 $m$이다. $a$, $m$의 값을 구하는 풀이 과정을 서술하시오. (단, $a$는 상수이다.)
subparts:
- id: '1'
  stem: |
    $a$, $m$의 값을 구하는 풀이 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=-1;m=-3/4
    equivalents:
    - $a=-1,\ m=-\dfrac{3}{4}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $y=2^{x}+a$가 증가함수이므로, $x=3$에서 최댓값은 $7$이므로 $7=2^{3}+a=8+a$이고, $a=-1$
      source_flow: 문항해설 p.52
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $x=-2$에서 최솟값은 $m$이므로 $m=2^{-2}+a=\dfrac{1}{4}+a$이고, $m=-\dfrac{3}{4}$
      source_flow: 문항해설 p.52
      criteria:
      - 1.B2
