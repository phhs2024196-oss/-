stem: |
  다음은 실수 전체의 집합에서 연속인 함수 $f(x)$가 $\displaystyle\lim_{x\to2}\dfrac{(x-2)f(x)}{x^{2}+2x-8}=5$를 만족시킬 때, $f(2)$의 값을 구하는 풀이 과정을 서술한 것이다.

  함수 $f(x)$가 실수 전체 집합에서 연속이므로
  $\displaystyle\lim_{x\to2}f(x)=f(2)$
  $\displaystyle\lim_{x\to2}\dfrac{(x-2)f(x)}{x^{2}+2x-8}=\lim_{x\to2}\dfrac{1}{\boxed{(가)}}\times\lim_{x\to2}f(x)=\boxed{(나)}\times f(2)=5$
  따라서, $f(2)=\boxed{(다)}$

  (가)에 알맞은 식과 (나), (다)에 알맞은 값을 구하시오.
