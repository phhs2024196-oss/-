stimuli: []
stem: |
  $a>0$인 상수 $a$에 대하여 곡선 $y=x^{2}+a$와 $x$축 및 두 직선 $x=-2$, $x=1$로 둘러싸인 도형의 넓이가 $9$이다. 이때, 곡선 $y=x^{2}+2a$와 $x$축 및 두 직선 $x=-2$, $x=1$로 둘러싸인 도형의 넓이를 구하는 풀이 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    도형의 넓이를 구하는 풀이 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=2;S=15
    equivalents:
    - $S=15$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        넓이가 $9$이므로 $\displaystyle\int_{-2}^{1}(x^{2}+a)\,dx=9$, $\left[\dfrac{1}{3}x^{3}+ax\right]_{-2}^{1}=9$이고 $a=2$이다.
      source_flow: 문항해설 p.58
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        곡선 $y=x^{2}+2a$와 $x$축 및 두 직선 $x=-2$, $x=1$로 둘러싸인 도형의 넓이는 $\displaystyle S=\int_{-2}^{1}(x^{2}+4)\,dx=\left[\dfrac{1}{3}x^{3}+4x\right]_{-2}^{1}=15$이다.
      source_flow: 문항해설 p.58
      criteria:
      - 1.B2
