stimuli: []
stem: |
  함수 $f(x)=2x^{3}+ax^{2}+bx+c$는 $x=1$에서 극댓값 $4$를 가지고, $x=2$에서 극솟값을 가진다. 이때, 상수 $a$, $b$, $c$의 값과 함수 $f(x)$의 극솟값을 구하는 풀이 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $a$, $b$, $c$의 값과 극솟값을 구하는 풀이 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=-9;b=12;c=-1;min=3
    equivalents:
    - 극솟값 $3$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=6x^{2}+2ax+b$이고 함수 $f(x)$는 $x=1$과 $x=2$에서 극값을 가지므로 $f'(1)=6+2a+b=0$, $f'(2)=24+4a+b=0$이다. 앞의 두 식을 연립하여 풀면 $a=-9$, $b=12$
      source_flow: 문항해설 p.60
      criteria:
      - 1.B1
      - 1.B2
    - id: 1b-2
      content: |
        한편 $x=1$에서 극댓값 $4$를 가지므로 $c=-1$이다.
      source_flow: 문항해설 p.60
      criteria:
      - 1.B3
    - id: 1b-3
      content: |
        함수 $f(x)=2x^{3}-9x^{2}+12x-1$, $x=2$에서 극솟값은 $3$이다.
      source_flow: 문항해설 p.60
      criteria:
      - 1.B4
