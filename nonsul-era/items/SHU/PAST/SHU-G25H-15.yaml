stimuli: []
stem: |
  정의역이 $\left\{x\mid -\dfrac{\pi}{2}\le x\le\dfrac{\pi}{3}\right\}$인 함수 $f(x)=\sin^{2}x-2\cos(x-\pi)+1$은 $x=a$에서 최솟값 $m$을 갖고, $x=b$에서 최댓값 $M$을 갖는다. $a$, $b$, $M$, $m$의 값을 구하는 풀이 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $a$, $b$, $M$, $m$의 값을 구하는 풀이 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: m=2;M=3;a=-pi/2;b=0
    equivalents:
    - $a=-\dfrac{\pi}{2},\ b=0,\ M=3,\ m=2$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\sin^{2}x-2\cos(x-\pi)+1$에서 $\cos(x-\pi)=-\cos x$이고, $\sin^{2}x=1-\cos^{2}x$이므로 $f(x)=(1-\cos^{2}x)+2\cos x+1$이고, $\cos x=t$로 치환하면 $-\dfrac{\pi}{2}\le x\le\dfrac{\pi}{3}$는 $0\le t\le1$이고 $f(x)=(1-t^{2})+2t+1=-(t-1)^{2}+3$이므로
      source_flow: 문항해설 p.62
      criteria:
      - 1.B1
      - 1.B2
    - id: 1b-2
      content: |
        $t=0$일 때, 최솟값 $m=2$이고, $t=1$일 때, 최댓값 $M=3$이다.
      source_flow: 문항해설 p.62
      criteria:
      - 1.B1
      - 1.B2
    - id: 1b-3
      content: |
        $t=0$이면 $-\dfrac{\pi}{2}\le x\le\dfrac{\pi}{3}$에서 $a=-\dfrac{\pi}{2}$, $t=1$이면 $-\dfrac{\pi}{2}\le x\le\dfrac{\pi}{3}$에서 $b=0$
      source_flow: 문항해설 p.62
      criteria:
      - 1.B3
      - 1.B4
