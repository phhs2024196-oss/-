stimuli: []
stem: |
  정의역이 $\{x\mid -3\le x\le 5\}$인 함수 $y=-\left(\dfrac{1}{3}\right)^{x-1}+1$의 최댓값이 $M$이고, 최솟값은 $m$이다. $M$, $m$의 값을 구하는 풀이 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $M$, $m$의 값을 구하는 풀이 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: M=80/81;m=-80
    equivalents:
    - $m=-80,\ M=\dfrac{80}{81}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $y=-\left(\dfrac{1}{3}\right)^{x-1}+1$이 증가함수이므로 $x=-3$에서 최솟값은 $m=-\left(\dfrac{1}{3}\right)^{-3-1}+1$이고, $m=-80$
      source_flow: 문항해설 p.89
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $x=5$에서 최댓값은 $M=-\left(\dfrac{1}{3}\right)^{5-1}+1$이고, $M=\dfrac{80}{81}$
      source_flow: 문항해설 p.89
      criteria:
      - 1.B2
