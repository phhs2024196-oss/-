stimuli: []
stem: |
  수열 $\{a_n\}$이 다음 조건을 만족시킬 때, $a_2$, $a_3$, $a_5$의 값을 구하는 풀이 과정을 서술하시오.

  (가) $3a_2+5a_3=7$
  (나) 모든 자연수 $n$에 대하여 $a_{n+1}=-\dfrac{1}{3}a_n$이다.
subparts:
- id: '1'
  stem: |
    $a_2$, $a_3$, $a_5$의 값을 구하는 풀이 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a2=21/4;a3=-7/4;a5=-7/36
    equivalents:
    - $a_2=\dfrac{21}{4},\ a_3=-\dfrac{7}{4},\ a_5=-\dfrac{7}{36}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (나)로부터 $a_3=-\dfrac{1}{3}a_2$이고, 이를 (가)에 대입하면 $3a_2-\dfrac{5}{3}a_2=7$, $a_2=\dfrac{21}{4}$
      source_flow: 문항해설 p.93
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $a_3=-\dfrac{1}{3}a_2=-\dfrac{7}{4}$
      source_flow: 문항해설 p.93
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        $a_4=-\dfrac{1}{3}a_3=\dfrac{7}{12}$, $a_5=-\dfrac{1}{3}a_4=-\dfrac{7}{36}$이다. 따라서, $a_5=-\dfrac{7}{36}$
      source_flow: 문항해설 p.93
      criteria:
      - 1.B3
