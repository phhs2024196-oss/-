stimuli: []
stem: |
  등식 $\displaystyle\lim_{x\to2}\dfrac{\sqrt{x+a}+b}{x^{2}-4}=\dfrac{1}{32}$이 성립하도록 하는 상수 $a$, $b$의 값을 구하는 풀이 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $a$, $b$의 값을 구하는 풀이 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=14;b=-4
    equivalents:
    - $a=14,\ b=-4$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{x\to2}\dfrac{\sqrt{x+a}+b}{x^{2}-4}=\dfrac{1}{32}$이고, $\displaystyle\lim_{x\to2}(x^{2}-4)=0$이므로, $\displaystyle\lim_{x\to2}(\sqrt{x+a}+b)=0$이고, $\sqrt{2+a}+b=0$이므로, $b=-\sqrt{2+a}$이다.
      source_flow: 문항해설 p.95
      criteria:
      - 1.B2
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to2}\dfrac{\sqrt{x+a}+b}{x^{2}-4}=\lim_{x\to2}\dfrac{\sqrt{x+a}-\sqrt{2+a}}{x^{2}-4}=\lim_{x\to2}\dfrac{1}{(x+2)(\sqrt{x+a}+\sqrt{2+a})}=\dfrac{1}{8\sqrt{2+a}}=\dfrac{1}{32}$
      source_flow: 문항해설 p.95
      criteria:
      - 1.B1
    - id: 1b-3
      content: |
        따라서, $a=14$, $b=-4$이다.
      source_flow: 문항해설 p.95
      criteria:
      - 1.B1
      - 1.B2
