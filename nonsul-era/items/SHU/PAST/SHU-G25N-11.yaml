stimuli: []
stem: |
  $x$에 대한 이차방정식 $\sqrt{3}x^{2}+(2\cos\theta)x+\sin\theta\cos\theta=0$이 중근을 갖도록 하는 상수 $\theta\,(0<\theta<\pi)$의 값을 구하는 풀이 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\theta$의 값을 구하는 풀이 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: theta=pi/2,pi/6
    equivalents:
    - $\theta=\dfrac{\pi}{2}$ 또는 $\theta=\dfrac{\pi}{6}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        이차방정식 $\sqrt{3}x^{2}+(2\cos\theta)x+\sin\theta\cos\theta=0$이 중근을 갖기 위해서는 $D=0$이고, $D/4=\cos^{2}\theta-\sqrt{3}\sin\theta\cos\theta=\cos\theta(\cos\theta-\sqrt{3}\sin\theta)=0$이므로 $\cos\theta=0$, $\tan\theta=\dfrac{\sqrt{3}}{3}$ 또는 $\cos\theta=0$ or $\cos\theta=\sqrt{3}\sin\theta$
      source_flow: 문항해설 p.97
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        주어진 범위 $(0<\theta<\pi)$에서 $\cos\theta=0$을 만족하는 $\theta=\dfrac{\pi}{2}$,
      source_flow: 문항해설 p.97
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $\tan\theta=\dfrac{\sqrt{3}}{3}$을 만족하는 $\theta=\dfrac{\pi}{6}$
      source_flow: 문항해설 p.97
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $\cos\theta=0$, $\tan\theta=\dfrac{\sqrt{3}}{3}$을 구했다.
      steps:
      - 1b-1
    - id: 1.A1
