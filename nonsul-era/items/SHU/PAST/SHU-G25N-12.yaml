stimuli: []
stem: |
  함수 $f(x)=x^{2}+ax+b$에 대하여

  $$\int_{-1}^{1}(x-1)f(x)\,dx=\dfrac{8}{3},\ \int_{-1}^{1}x^{2}f(x)\,dx=-\dfrac{4}{15}$$

  가 성립할 때, 상수 $a$, $b$의 값을 구하는 풀이 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $a$, $b$의 값을 구하는 풀이 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=2;b=-1
    equivalents:
    - $a=2,\ b=-1$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\int_{-1}^{1}(x-1)(x^{2}+ax+b)\,dx=\dfrac{8}{3}$이고 $\left[\dfrac{1}{4}x^{4}+\dfrac{1}{3}(a-1)x^{3}+\dfrac{1}{2}(b-a)x^{2}-bx\right]_{-1}^{1}=\dfrac{8}{3}$, $a-3b=5$이다.
      source_flow: 문항해설 p.99
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $\displaystyle\int_{-1}^{1}x^{2}(x^{2}+ax+b)\,dx=-\dfrac{4}{15}$이고 $\left[\dfrac{1}{5}x^{5}+\dfrac{a}{4}x^{4}+\dfrac{1}{3}bx^{3}\right]_{-1}^{1}=-\dfrac{4}{15}$, $b=-1$이다.
      source_flow: 문항해설 p.99
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        따라서 $a=2$, $b=-1$이다.
      source_flow: 문항해설 p.99
      criteria:
      - 1.B1
      - 1.B2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
