stimuli: []
stem: |
  삼차함수 $f(x)=ax^{3}+bx^{2}+cx$가 다음 조건을 만족시킬 때, 상수 $a$, $b$, $c$의 값을 구하는 풀이 과정을 서술하시오.

  (가) $\displaystyle\lim_{x\to1}\dfrac{f(x)-4}{x-1}=16$
  (나) 모든 실수 $p$에 대하여 $\displaystyle\lim_{x\to p}\dfrac{f(x)+f(-x)}{x-p}$의 값이 존재한다.
subparts:
- id: '1'
  stem: |
    $a$, $b$, $c$의 값을 구하는 풀이 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=6;b=0;c=-2
    equivalents:
    - $a=6,\ b=0,\ c=-2$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (나)로부터 $\displaystyle\lim_{x\to p}(x-p)=0$이므로, $\displaystyle\lim_{x\to p}\{f(x)+f(-x)\}=0$이고, $f(p)+f(-p)=0$이다. 즉, $f(x)$는 모든 실수 $p$에 대하여 $f(-p)=-f(p)$이고, $f(x)=ax^{3}+cx$이므로, $b=0$이다.
      source_flow: 문항해설 p.100
      criteria:
      - 1.B2
    - id: 1b-2
      content: |
        조건 (가)로부터 $f(1)=4$, $f'(1)=16$이고, $f'(x)=3ax^{2}+c$이므로, $f(1)=a+c=4$, $f'(1)=3a+c=16$이다. 두 식을 연립하면, $a=6$, $b=0$, $c=-2$를 얻는다.
      source_flow: 문항해설 p.100
      criteria:
      - 1.B1
      - 1.B3
  - id: S1-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 1c-1
      content: |
        조건 (가)로부터 $\displaystyle\lim_{x\to1}\{f(x)-4\}=(a+c)-4=0$이므로, $c=4-a$
      source_flow: 문항해설 p.100
      criteria:
      - 1.B3
    - id: 1c-2
      content: |
        $\displaystyle\lim_{x\to1}\dfrac{f(x)-4}{x-1}=\lim_{x\to1}\dfrac{ax^{3}+cx-4}{x-1}=\lim_{x\to1}\dfrac{ax^{3}+(4-a)x-4}{x-1}=\lim_{x\to1}\dfrac{(x-1)(ax^{2}+ax+4)}{x-1}=\lim_{x\to1}(ax^{2}+ax+4)=2a+4=16$
      source_flow: 문항해설 p.100
      criteria:
      - 1.B1
    - id: 1c-3
      content: |
        $a=6$, $b=0$, $c=-2$
      source_flow: 문항해설 p.100
      criteria:
      - 1.B1
      - 1.B2
      - 1.B3
