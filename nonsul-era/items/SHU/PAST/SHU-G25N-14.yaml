stimuli: []
stem: |
  다음 조건을 만족시키는 모든 자연수 $a$의 값의 합을 구하는 풀이 과정을 서술하시오. (단, $a\ne10$)

  $x$에 대한 이차부등식 $(1-\log a)x^{2}+2(1-\log a)x-1<0$이 모든 실수 $x$에 대하여 성립한다.
subparts:
- id: '1'
  stem: |
    조건을 만족시키는 모든 자연수 $a$의 값의 합을 구하는 풀이 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '4895'
    equivalents:
    - $4895$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        모든 실수 $x$에 대하여 $(1-\log a)x^{2}+2(1-\log a)x-1<0$ 부등식이 성립하기 위한 조건은 $a>0$이고, 이차항의 계수 $(1-\log a)$가 음수이고, 판별식이 $D<0$이므로 1) $1-\log a<0\Rightarrow a>10$
      source_flow: 문항해설 p.104
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        2) $D/4=(1-\log a)^{2}+(1-\log a)=(1-\log a)(2-\log a)<0\Rightarrow 1<\log a<2\Rightarrow 10<a<100$
      source_flow: 문항해설 p.104
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        3) $10<a<100$를 만족하는 자연수의 합은 등차수열의 합이므로 $\dfrac{89(11+99)}{2}=4895$
      source_flow: 문항해설 p.104
      criteria:
      - 1.A1
  - id: S1-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 1c-1
      content: |
        모든 실수 $x$에 대하여 $(1-\log a)x^{2}+2(1-\log a)x-1<0$ 부등식이 성립하기 위한 조건은 $a>0$이고, 이차항의 계수 $(1-\log a)$가 음수이고, 최댓값이 음수 $<0$일 때, 1) $1-\log a<0\Rightarrow a>10$
      source_flow: 문항해설 p.104
      criteria:
      - 1.M1
    - id: 1c-2
      content: |
        2) $f'(x)=2(1-\log a)x+2(1-\log a)=0$, $x=-1$일 때 최댓값이므로 $f(-1)=(1-\log a)-2(1-\log a)-1=\log a-2<0$, $\log a<2\Rightarrow a<100$
      source_flow: 문항해설 p.104
      criteria:
      - 1.M2
    - id: 1c-3
      content: |
        3) 식 1과 식 2의 교집합은 $10<a<100$이고, 이를 만족하는 자연수의 합은 등차수열의 합이므로 $\dfrac{89(11+99)}{2}=4895$
      source_flow: 문항해설 p.104
      criteria:
      - 1.A1
