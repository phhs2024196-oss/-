stimuli: []
stem: |
  두 함수 $f(x)=x^{3}-6x^{2}+ax$와 $g(x)=x^{3}-6x^{2}+ax+1$이 각각 $x=1$에서 극값을 가지고, 함수 $f(x)$의 그래프와 $g(x)$의 그래프는 직선 $y=b$와 각각 서로 다른 세 점에서 만난다.

  이때, 상수 $a$의 값과 가능한 모든 정수 $b$의 값의 합을 구하는 풀이 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $a$의 값과 가능한 모든 정수 $b$의 값의 합을 구하는 풀이 과정을 서술하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=9;b=2,3;sum=5
    equivalents:
    - $2+3=5$ 또는 $9+2+3=14$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 함수 $f(x)=x^{3}-6x^{2}+ax$라 하고 $g(x)=x^{3}-6x^{2}+ax+1$라 하면 $f'(x)=g'(x)=3x^{2}-12x+a$, 두 함수 $f(x)$와 $g(x)$는 $x=1$에서 극값을 가지므로 $3-12+a=0$이고 $a=9$이다.
      source_flow: 문항해설 p.107
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $f(x)=x^{3}-6x^{2}+9x$의 극솟값은 $0$, 극댓값은 $4$이므로 직선 $y=b$와 $f(x)$가 서로 다른 세 점에서 만나도록 하는 $b$의 값의 범위는 $0<b<4$이다. $g(x)=x^{3}-6x^{2}+9x+1$의 극솟값은 $1$, 극댓값은 $5$이므로 직선 $y=b$와 $g(x)$가 서로 다른 세 점에서 만나도록 하는 $b$의 값의 범위는 $1<b<5$이다.
      source_flow: 문항해설 p.107
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        따라서 문제의 조건에 만족하는 $b$값의 범위는 $1<b<4$이고 가능한 모든 정수는 $2$와 $3$이며, $b$의 값의 합은 $5$이다.
      source_flow: 문항해설 p.107
      criteria:
      - 1.B2
      - 1.B3
