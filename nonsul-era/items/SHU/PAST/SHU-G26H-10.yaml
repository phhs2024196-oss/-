stimuli: []
stem: |
  곡선 $y=3^{x}$을 $y$축에 대하여 대칭이동한 후, $x$축 방향으로 $m$만큼 평행이동한 도형이 점 $(3,9)$를 지난다. 상수 $m$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    상수 $m$의 값
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents:
    - $m=5$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y$축 대칭이동으로 $x$ 대신 $-x$를 대입하면, $y=3^{-x}=\left(\dfrac{1}{3}\right)^{x}$이고, $x$축 평행이동으로 $x$ 대신에 $x-m$을 대입하면, $y=3^{-(x-m)}=\left(\dfrac{1}{3}\right)^{x-m}$이다.
      source_flow: 문항해설 p.66
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        점 $(3,9)$를 지나므로 $9=3^{-(3-m)}=3^{-3+m}$이고,
      source_flow: 문항해설 p.66
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $9=3^{2}$이므로 지수를 비교하면 $2=m-3$으로 $m=5$이다.
      source_flow: 문항해설 p.66
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $y=3^{-(x-m)}=\left(\dfrac{1}{3}\right)^{x-m}$을 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 점 $(3,9)$를 대입하여 $9=3^{-3+m}$을 세웠다.
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $m=5$를 구했다.
      steps:
      - 1b-3
      depends_on:
      - 1.M2
