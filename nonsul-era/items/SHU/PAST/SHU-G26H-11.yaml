stimuli: []
stem: |
  아인슈타인의 상대성이론에서 정지 상태의 질량이 $m_{0}$(mg)인 입자가 $\nu$(m/s)의 속도로 움직일 때의 질량 $m$(mg)은 다음과 같다.

  $$m=m_{0}\left(1-\dfrac{\nu^{2}}{c^{2}}\right)^{-\frac{1}{2}}$$

  정지 상태의 질량이 $8\mathrm{mg}$인 입자가 움직일 때의 질량이 $10\mathrm{mg}$이다. 이때, 입자의 속도를 구하는 과정을 서술하시오. (단, $\nu>0$, 상수 $c$는 $3\times10^{8}$m/s로 계산한다.)
subparts:
- id: '1'
  stem: |
    입자의 속도
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1.8*10^8
    equivalents:
    - $\nu=1.8\times10^{8}\mathrm{m/s}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        정지 상태의 질량 $8\mathrm{mg}$, 움직일 때 질량 $10\mathrm{mg}$이다. $10=8\left(1-\dfrac{\nu^{2}}{c^{2}}\right)^{-\frac{1}{2}}$이고, $\dfrac{8}{10}=\sqrt{1-\dfrac{\nu^{2}}{c^{2}}}$이므로
      source_flow: 문항해설 p.69
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $0.8^{2}=1-\dfrac{\nu^{2}}{c^{2}}$, $\dfrac{\nu^{2}}{c^{2}}=1-0.64=0.36=0.6^{2}$, $\nu^{2}=c^{2}\times0.6^{2}$에서,
      source_flow: 문항해설 p.69
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\nu=1.8\times10^{8}\mathrm{m/s}$이다. 입자 속도는 $\nu=1.8\times10^{8}\mathrm{m/s}$
      source_flow: 문항해설 p.69
      criteria:
      - 1.A1
