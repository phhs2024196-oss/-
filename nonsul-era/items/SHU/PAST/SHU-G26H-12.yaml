stem: |
  첫째항이 $4$인 등비수열 $\{a_{n}\}$의 첫째항부터 제$n$항까지의 합을 $S_{n}$이라 하자.
  어떤 자연수 $k$에 대하여 $S_{k}=20$, $S_{2k}=30$일 때, 이 등비수열의 제$(k+1)$항 $a_{k+1}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $a_{k+1}$의 값
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents:
    - $a_{k+1}=2$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        등비수열 $\{a_{n}\}$의 공비를 $r$이라고 하면, $S_{k}=\dfrac{4(r^{k}-1)}{r-1}=20$,
      source_flow: 문항해설 p.72
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $S_{2k}=\dfrac{4(r^{2k}-1)}{r-1}=\dfrac{4(r^{k}-1)}{r-1}\times(r^{k}+1)=30$. 연립하면, $S_{2k}=20\times(r^{k}+1)=30$
      source_flow: 문항해설 p.72
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $r^{k}=\dfrac{30}{20}-1=\dfrac{1}{2}$
      source_flow: 문항해설 p.72
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서, $a_{k+1}=4\times r^{k}=4\times\dfrac{1}{2}=2$
      source_flow: 문항해설 p.72
      criteria:
      - 1.A1
