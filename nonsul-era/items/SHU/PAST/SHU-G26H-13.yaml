stimuli: []
stem: |
  다음과 같이 정의된 함수 $f(x)$가 실수 전체의 집합에서 연속일 때,
  상수 $a$, $b$의 값을 구하는 과정을 서술하시오.

  $$f(x)=\begin{cases}\dfrac{x^{3}-3a}{x-1} & (x\ne1)\\[4pt] b & (x=1)\end{cases}$$
subparts:
- id: '1'
  stem: |
    상수 $a$, $b$의 값
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=1/3;b=3
    equivalents:
    - $a=\dfrac{1}{3},\ b=3$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$가 $x=1$에서 연속이 되기 위해서는 $\lim_{x\to1}f(x)=f(1)=b$
      source_flow: 문항해설 p.75
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        극한값이 존재하기 위해서는 $\lim_{x\to1}\dfrac{x^{3}-3a}{x-1}$에서 분모 $\lim_{x\to1}(x-1)=0$이므로, $\lim_{x\to1}(x^{3}-3a)=0$이다.
      source_flow: 문항해설 p.75
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $1-3a=0$ 따라서, $a=\dfrac{1}{3}$
      source_flow: 문항해설 p.75
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        따라서, $b=\lim_{x\to1}\dfrac{x^{3}-1}{x-1}=\lim_{x\to1}(x^{2}+x+1)=3$
      source_flow: 문항해설 p.75
      criteria:
      - 1.M2
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $\lim_{x\to1}(x^{3}-3a)=0$을 세웠다.
      steps:
      - 1b-1
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $a=\dfrac{1}{3}$을 구했다.
