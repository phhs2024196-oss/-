      - 1b-3
      depends_on:
      - 1.M1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $\lim_{x\to1}(x^{2}+x+1)$로 정리했다.
      steps:
      - 1b-4
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $b=3$을 구했다.
      steps:
      - 1b-4
      depends_on:
      - 1.M2
