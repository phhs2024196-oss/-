stimuli: []
stem: |
  이차함수 $f(x)$와 일차함수 $g(x)=ax\ (a<0)$가 다음 조건을 만족시킬 때, $g(2)$의 값을 구하는 과정을 서술하시오.

  (가) 함수 $f(x)$의 그래프는 원점을 지난다.
  (나) 함수 $f(x)$는 $x=\dfrac{5}{2}$에서 극댓값 $\dfrac{25}{4}$를 갖는다.
  (다) 두 함수의 그래프로 둘러싸인 도형의 넓이는 $36$이다.
subparts:
- id: '1'
  stem: |
    $g(2)$의 값
  points: 10
  depends_on: []
  answer:
    kind: value
    value: f=-x*(x-5);g=-x;g2=-2
    equivalents:
    - $g(2)=-2$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g(x)=ax$, (가)의 조건에서 원점을 지나는 이차 함수이고, $x=\dfrac{5}{2}$에서 극댓값을 가지므로 $f(x)=-x(x-b)$이고, (나)의 조건에 의해 극댓값이 $\dfrac{25}{4}$이므로 $b=5$이다. 따라서 $f(x)=-x(x-5)$
      source_flow: 문항해설 p.78
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(x)=-x(x-5)$이라 할 때 (다)의 조건에서 함수 $f(x)$와 $g(x)$ 그래프로 둘러싸인 넓이는 $36$이고, 두 함수 그래프의 교점의 $x$좌표는 $-x^{2}+5x=ax$를 만족해야 하므로 $x=0$ 또는 $x=5-a$이다. 두 함수의 그래프로 둘러싸인 넓이가 $36$이므로 $\displaystyle\int_{0}^{5-a}(-x^{2}+5x-ax)dx=36$이다. 따라서 $a=-1$이고 $g(x)=-x$,
      source_flow: 문항해설 p.78
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $g(2)=-2$이다.
      source_flow: 문항해설 p.78
      criteria:
      - 1.A1
