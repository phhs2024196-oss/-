stimuli: []
stem: |
  두 함수 $f(x)=\dfrac{8}{3}x^{3}+2x^{2}$와 $g(x)=x^{4}-4x^{2}+a$가 있다. 모든 실수 $x$에 대하여 부등식 $f(x)\le g(x)$가 항상 성립하도록 하는 실수 $a$의 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    실수 $a$의 최솟값
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '45'
    equivalents:
    - $45$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $h(x)=g(x)-f(x)=x^{4}-\dfrac{8}{3}x^{3}-6x^{2}+a$라 하면, $h'(x)=4x(x^{2}-2x-3)$, $h'(x)=0$에서 $x=-1$ 또는 $x=0$ 또는 $x=3$이다.
      source_flow: 문항해설 p.81
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        함수 $h(x)$는 $x=0$에서 극댓값, $x=-1$과 $x=3$에서 극솟값을 가지므로 $h(-1)=a-\dfrac{7}{3}$, $h(3)=a-45$이고, $x$에 대하여 부등식 $f(x)\le g(x)$가 항상 성립하려면 $h(x)\ge0$이고, $a\ge\dfrac{7}{3}$, $a\ge45$이므로 실수 $a$의 최솟값은 $45$이다.
      source_flow: 문항해설 p.81
      criteria:
      - 1.A1
