stimuli: []
stem: |
  함수 $f(x)=3^{x-1}+2$에 대하여, 정의역이 $[-1,3]$일 때,
  이 함수의 최댓값은 $M$, 최솟값은 $m$이다. $M$, $m$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $M$, $m$의 값
  points: 10
  depends_on: []
  answer:
    kind: value
    value: M=11;m=19/9
    equivalents:
    - $M=11,\ m=\dfrac{19}{9}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=3^{x-1}+2$는 밑이 $1$보다 크기 때문에 증가함수이다. 최댓값 계산은 정의역이 오른쪽 끝인 $x=3$에서 최댓값을 가진다. 따라서 최댓값 $M$은 $M=f(3)=3^{3-1}+2=3^{2}+2=11$이다.
      source_flow: 문항해설 p.114
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        최솟값 계산은 정의역의 왼쪽 끝인 $x=-1$에서 최솟값을 가진다. 따라서 최솟값 $m$은 $m=f(-1)=3^{-1-1}+2=3^{-2}+2=\dfrac{1}{9}+\dfrac{18}{9}=\dfrac{19}{9}$
      source_flow: 문항해설 p.114
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $M=f(3)=3^{2}+2=11$을 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $m=f(-1)=\dfrac{1}{9}+\dfrac{18}{9}=\dfrac{19}{9}$를 구했다.
