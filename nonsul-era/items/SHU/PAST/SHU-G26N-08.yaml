stimuli: []
stem: |
  엑스선을 이용하면 물질의 두께를 측정할 수 있다.
  처음 엑스선의 강도를 $I_{0}$, 감약계수가 $\mu$인 어느 물질을 투과한 후 엑스선의 강도를 $I$라고 할 때, 그 물질의 두께 $d$($\mathrm{mm}$)에 대하여 다음 식이 성립한다.

  $$\log I=\log I_{0}-\dfrac{\mu}{0.7}d$$

  감약계수가 $0.245$인 어떤 물질을 투과한 엑스선의 강도가 처음 강도의 $\dfrac{1}{5}$이 되었다.
  이 물질의 두께를 구하는 과정을 서술하시오. (단, $\log2=0.3$으로 계산한다.)
