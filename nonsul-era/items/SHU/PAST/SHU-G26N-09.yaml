stimuli: []
stem: |
  $\overline{\mathrm{AB}}=8$인 삼각형 $\mathrm{ABC}$가 다음 조건을 만족시킬 때,
  삼각형 $\mathrm{ABC}$의 넓이를 구하는 과정을 서술하시오.

  (가) $3\sin C=2\sin A$
  (나) $5(\sin A-\sin C)=2\sin B$
subparts:
- id: '1'
  stem: |
    삼각형 $\mathrm{ABC}$의 넓이
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 15*sqrt(7)
    equivalents:
    - $15\sqrt{7}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이를 $R$, $\overline{\mathrm{AB}}=c$, $\overline{\mathrm{BC}}=a$, $\overline{\mathrm{CA}}=b$라 하자. 사인법칙에 의하여 $\sin A=\dfrac{a}{2R}$, $\sin B=\dfrac{b}{2R}$, $\sin C=\dfrac{c}{2R}$. 조건 (가)의 $3\sin C=2\sin A$에 의해 $3c=2a$, 이때 $c=\overline{\mathrm{AB}}=8$, $a=\dfrac{3}{2}c=12$
      source_flow: 문항해설 p.120
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        조건 (나)의 $5(\sin A-\sin C)=2\sin B$에 의해 $5(a-c)=2b$, $b=\dfrac{5}{2}(a-c)=10$
      source_flow: 문항해설 p.120
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        삼각형 $\mathrm{ABC}$에서 코사인법칙에 의하여 $\cos A=\dfrac{b^{2}+c^{2}-a^{2}}{2bc}=\dfrac{10^{2}+8^{2}-12^{2}}{2\times10\times8}=\dfrac{1}{8}$, $\sin A=\sqrt{1-\left(\dfrac{1}{8}\right)^{2}}=\dfrac{3\sqrt{7}}{8}$
      source_flow: 문항해설 p.120
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서 삼각형 $\mathrm{ABC}$의 넓이는 $\triangle ABC=\dfrac{1}{2}bc\sin A=\dfrac{1}{2}\times10\times8\times\dfrac{3\sqrt{7}}{8}=15\sqrt{7}$
      source_flow: 문항해설 p.120
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
