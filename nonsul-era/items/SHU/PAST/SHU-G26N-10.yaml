stimuli: []
stem: |
  다음과 같이 정의된 함수 $f(x)$가 실수 전체의 집합에서 연속일 때,
  상수 $a$, $b$의 값을 구하는 과정을 서술하시오.

  $$f(x)=\begin{cases}\dfrac{x^{2}+(a-1)x-3}{x-2} & (x\ne2)\\[4pt] b & (x=2)\end{cases}$$
subparts:
- id: '1'
  stem: |
    상수 $a$, $b$의 값
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=1/2;b=7/2
    equivalents:
    - $a=\dfrac{1}{2},\ b=\dfrac{7}{2}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$가 $x=2$에서 연속이 되기 위해서는 $\lim_{x\to2}f(x)=f(2)=b$
      source_flow: 문항해설 p.123
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        극한값이 존재하기 위해서는 $\lim_{x\to2}\dfrac{x^{2}+(a-1)x-3}{x-2}=b$에서 $\lim_{x\to2}(x-2)=0$이므로, $\lim_{x\to2}\{x^{2}+(a-1)x-3\}=0$ 즉, $2^{2}+(a-1)\times2-3=0$
      source_flow: 문항해설 p.123
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        따라서, $a=\dfrac{1}{2}$
      source_flow: 문항해설 p.123
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $b=\lim_{x\to2}\dfrac{x^{2}-\frac{1}{2}x-3}{x-2}=\lim_{x\to2}\dfrac{(x-2)\left(x+\frac{3}{2}\right)}{x-2}=\lim_{x\to2}\left(x+\dfrac{3}{2}\right)=2+\dfrac{3}{2}=\dfrac{7}{2}$
      source_flow: 문항해설 p.123
      criteria:
      - 1.M2
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $2^{2}+(a-1)\times2-3=0$을 세웠다.
      steps:
      - 1b-1
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $a=\dfrac{1}{2}$을 구했다.
      steps:
      - 1b-3
      depends_on:
      - 1.M1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $(x-2)\left(x+\dfrac{3}{2}\right)$로 인수분해했다.
      steps:
      - 1b-4
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $b=\dfrac{7}{2}$을 구했다.
      steps:
      - 1b-4
      depends_on:
      - 1.M2
