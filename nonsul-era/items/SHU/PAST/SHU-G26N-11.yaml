    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $h(x)=f(x)-g(x)$로 정의하면, $h(x)=3x^{4}+3x^{3}-4x^{2}-3x-1$, $h(x)$는 닫힌구간 $[-2,-1]$에서 연속
      source_flow: 문항해설 p.126
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $h(-2)=48-24-16+6-1=13$이므로, $h(-2)=13>0$이고, $h(-1)=3-3-4+3-1=-2$이므로, $h(-1)=-2<0$이다.
      source_flow: 문항해설 p.126
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        사잇값 정리에 의해 $h(c)=0$인 $c$가 열린구간 $(-2,-1)$에 적어도 하나 존재한다.
      source_flow: 문항해설 p.126
      criteria:
      - 1.R1
    - id: 1b-4
      content: |
        따라서, 방정식 $f(x)=g(x)$는 열린구간 $(-2,-1)$에서 적어도 하나의 실근을 가진다.
      source_flow: 문항해설 p.126
      criteria:
      - 1.A1
