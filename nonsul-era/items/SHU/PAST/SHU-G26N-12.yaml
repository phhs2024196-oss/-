stimuli: []
stem: |
  집합 $A_{n}$이 다음과 같다.

  $$A_{n}=\{3^{k}\mid1\le k\le n+2,\ k\text{는 자연수}\}$$

  집합 $A_{n}$의 서로 다른 두 원소를 곱했을 때 나올 수 있는 값의 집합을 $S_{n}$,
  집합 $S_{n}$의 원소의 개수를 $a_{n}$이라 할 때, $\displaystyle\sum_{n=1}^{8}a_{n}$의 값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{n=1}^{8}a_{n}$의 값
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '80'
    equivalents:
    - $80$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $n=1$일 때, $A_{1}=\{3,3^{2},3^{3}\}$이므로, $S_{1}=\{3^{3},3^{4},3^{5}\}$이고, $a_{1}=3$. $n=2$일 때, $A_{2}=\{3,3^{2},3^{3},3^{4}\}$이므로, $S_{2}=\{3^{3},3^{4},3^{5},3^{6},3^{7}\}$이고, $a_{2}=5$. $n=3$일 때, $A_{3}=\{3,3^{2},3^{3},3^{4},3^{5}\}$이므로, $S_{3}=\{3^{3},3^{4},3^{5},3^{6},3^{7},3^{8},3^{9}\}$이고, $a_{3}=7$. 즉, $S_{n}=\{3^{3},3^{4},3^{5},\cdots,3^{2n+3}\}$이고, $a_{n}=(2n+3)-3+1=2n+1$. 따라서, $a_{n}=2n+1$,
      source_flow: 문항해설 p.129
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $A_{n}=\{3^{1},3^{2},3^{3},\cdots,3^{n+2}\}$이므로 $1\le i<j\le n+2$인 정수 $i,j$에 대해 $3^{i}\times3^{j}=3^{i+j}$, $S_{n}=\{3^{i+j}\mid1\le i<j\le n+2\}=\{3^{k}\mid3\le k\le2n+3,\ k\text{는 자연수}\}$ 따라서, $a_{n}=2n+3-3+1=2n+1$이다.
      source_flow: 문항해설 p.129
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\displaystyle\sum_{n=1}^{8}a_{n}=\sum_{n=1}^{8}(2n+1)=2\sum_{n=1}^{8}n+\sum_{n=1}^{8}1=2\times\dfrac{8\times9}{2}+8=80$
      source_flow: 문항해설 p.129
      criteria:
      - 1.A1
