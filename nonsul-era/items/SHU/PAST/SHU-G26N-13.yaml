stimuli: []
stem: |
  최고차항의 계수가 $1$인 이차함수 $f(x)$에 대하여 $g(x)=(2x+3)f(x)$일 때,
  두 함수 $f(x)$, $g(x)$가 다음 조건을 만족시킨다. $f(6)-g'(2)$의 값을 구하는 과정을 서술하시오.

  (가) $\displaystyle\lim_{x\to1}\dfrac{5f(x)-g(1)}{x-1}=g(1)+35$
  (나) $\displaystyle\lim_{x\to1}\dfrac{g(x)-5f(1)}{x-1}=f(1)+11$
subparts:
- id: '1'
  stem: |
    $f(6)-g'(2)$의 값
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents:
    - $1$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=x^{2}+ax+b$라 하면 $f'(x)=2x+a$이다. $g(x)=(2x+3)f(x)$이고, $x=1$에서 $g(1)=5f(1)$이다. (가) 조건에서 $\displaystyle\lim_{x\to1}\dfrac{5f(x)-5f(1)}{x-1}=g(1)+35$, $5f'(1)=g(1)+35$이고 $b=-6$이다.
      source_flow: 문항해설 p.132
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        (나) 조건에서 $\displaystyle\lim_{x\to1}\dfrac{g(x)-5f(1)}{x-1}=\lim_{x\to1}\dfrac{g(x)-g(1)}{x-1}=f(1)+11$, $g'(1)=f(1)+11$이고 $a=1$이다.
      source_flow: 문항해설 p.132
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 $g(x)=(2x+3)(x^{2}+x-6)$, $f(x)=x^{2}+x-6$이고 $f(6)-g'(2)=1$이다.
      source_flow: 문항해설 p.132
      criteria:
      - 1.M3
      - 1.A1
