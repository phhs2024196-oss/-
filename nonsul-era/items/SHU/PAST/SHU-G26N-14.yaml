stimuli: []
stem: |
  두 함수 $f(x)=2x^{2}+6ax$와 $g(x)=-x^{2}+9a^{2}$의 그래프로 둘러싸인 도형의
  넓이가 $\dfrac{32}{27}$이고, 두 함수의 그래프가 서로 만나는 두 점을 연결한 직선의
  방정식을 $y=h(x)$라 할 때, $h(2)$의 값을 구하는 과정을 서술하시오. (단, $a$는 양의 상수이다.)
subparts:
- id: '1'
  stem: |
    $h(2)$의 값
  points: 10
  depends_on: []
  answer:
    kind: value
    value: a=1/3;h=2/3*(x+1);h2=2
    equivalents:
    - $h(2)=2$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 함수 그래프의 교점의 $x$좌표는 $2x^{2}+6ax=-x^{2}+9a^{2}$을 만족해야 하므로 $x=a$ 또는 $x=-3a$이다. $a$는 양수이므로 두 함수의 그래프로 둘러싸인 넓이는 $\displaystyle\int_{-3a}^{a}\{(-x^{2}+9a^{2})-(2x^{2}+6ax)\}dx=\dfrac{32}{27}$, $\left[-x^{3}-3ax^{2}+9a^{2}x\right]_{-3a}^{a}=\dfrac{32}{27}$이고 $a^{3}=\dfrac{1}{27}$, $a=\dfrac{1}{3}$이다.
      source_flow: 문항해설 p.135
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        함수 $f(x)=2x^{2}+2x$와 $f(x)=-x^{2}+1$의 교점은 점 $\left(\dfrac{1}{3},\dfrac{8}{9}\right)$과 점 $(-1,0)$이다. 이 두 점을 지나는 직선 $h(x)=\dfrac{2}{3}(x+1)$이고
      source_flow: 문항해설 p.135
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $h(2)=2$이다.
      source_flow: 문항해설 p.135
      criteria:
      - 1.A1
