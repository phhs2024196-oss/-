stimuli: []
stem: |
  최고차항의 계수가 $12$인 삼차함수 $f(x)$에 대하여 곡선 $y=f(x)$가 원점을 지나고, 점 $(1,f(1))$에서 접선의 방정식은 $y=-28x+8$이다. $g(x)=x^{4}-4x^{2}+k$일 때, 모든 실수 $x$에 대하여 $f(x)\le g(x)$가 항상 성립하도록 하는 실수 $k$의 최솟값을 구하는 과정을 서술하시오.
subparts:
- id: '1'
  stem: |
    실수 $k$의 최솟값
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '343'
    equivalents:
    - $343$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=f(x)$ 위의 점 $(1,f(1))$에서 접선의 방정식이 $y=-28x+8$이고 $f(x)=12x(x^{2}+ax+b)$이므로 $f(1)=12(1+a+b)=-20$, $a+b=-\dfrac{8}{3}$ ……①, $f'(1)=12(1+a+b)+12(2+a)=-28$, $2a+b=-\dfrac{16}{3}$ ……②, ②$-$①하면 $a=-\dfrac{8}{3}$, $b=0$이다. 따라서 $f(x)=12x\left(x^{2}-\dfrac{8}{3}x\right)=12x^{3}-32x^{2}$이다.
      source_flow: 문항해설 p.138
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $h(x)=g(x)-f(x)$라 하고 $h(x)=x^{4}-12x^{3}+28x^{2}+k$에서
      source_flow: 문항해설 p.138
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $h'(x)=4x(x^{2}-9x+14)=4x(x-2)(x-7)$, $h'(x)=0$에서 $x=0$ 또는 $x=2$ 또는 $x=7$이다.
      source_flow: 문항해설 p.138
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        함수 $h(x)$는 $x=2$에서 극댓값, $x=0$과 $x=7$에서 극솟값을 가지므로 $f(0)=k$, $f(7)=7^{4}-12\times7^{3}+28\times7^{2}+k$이고, $x$에 대하여 부등식 $f(x)\le g(x)$가 항상 성립하려면 $h(x)\ge0$이 성립해야 하므로 $k\ge0$, $-7^{3}+k\ge0$이다. 따라서 실수 $k$의 최솟값은 $343$이다.
      source_flow: 문항해설 p.138
      criteria:
      - 1.A1
