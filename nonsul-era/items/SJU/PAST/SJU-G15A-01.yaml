stimuli:
- label: 제시문
  body: |
    반지를 끼운 실의 양 끝점이 좌표공간의 두 점 $\mathrm{P}(0,-\sqrt3,5)$와 $\mathrm{Q}(1,0,3)$에 고정되어 있고, 실의 길이는 $4\sqrt2\,\mathrm{m}$이다. (모든 길이의 단위는 $\mathrm{m}$로 생각한다.) 점 $\mathrm{P}$의 위치에서부터 실을 타고 움직인 반지는 $xy$평면과 가장 가까운 위치에서 더 이상 움직이지 않게 된다.
    (그림 1: 좌표공간에서 $\mathrm{P}$, $\mathrm{Q}$에 고정된 실이 반지 위치에서 꺾여 V자 모양으로 늘어져 있다. 그림 2: 평면 $\alpha$ 위에 원점에서 직교하는 $X$축(오른쪽 위 방향), $Y$축(왼쪽 위 방향)이 있고 $X$축 위에 $\mathrm{Q}$, $\mathrm{P}$가 원점에 대해 대칭으로 놓여 있으며($\mathrm{P}$가 오른쪽 위), 아래쪽에 수평인 직선 $\ell$이 있고 실이 $\mathrm{Q}$, 반지, $\mathrm{P}$를 잇는다.)

stem: |
  아래 글을 읽고, 각 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    점 $\mathrm{P}$에서 출발한 반지가 실이 팽팽해진 이후 움직이는 궤적은 어떤 이차곡선의 일부가 된다. 이차곡선의 정의를 이용하여, 해당되는 이차곡선이 무엇인지 설명하시오.
    한편, 반지가 $xy$평면과 가장 가까운 위치의 점 $\mathrm{R}$에서 멈췄을 때, 세 점 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$는 한 평면 $\alpha$를 결정한다. [그림 2]에서처럼 평면 $\alpha$ 위에서 두 점 $\mathrm{P}$와 $\mathrm{Q}$의 중점이 원점이 되도록 좌표축 $X$, $Y$를 잡자. 이때, $XY$평면 위에서 반지의 궤적을 포함하는 이차곡선의 방정식을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'X**2/8 + Y**2/6 = 1', equivalents: ['3*X**2 + 4*Y**2 = 24'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 반지 위치 $\mathrm{R}$에 대해 $\overline{\mathrm{PR}}+\overline{\mathrm{RQ}}=4\sqrt2$로 일정하므로 초점이 $\mathrm{P}$, $\mathrm{Q}$인 타원.
    steps:
    - {id: 1a, content: '$2a=4\sqrt2$, $2c=\overline{\mathrm{PQ}}=2\sqrt2$, $b^2=6$ ⇒ $\tfrac{X^2}{8}+\tfrac{Y^2}{6}=1$', criteria: ['1.R1', '1.M1', '1.A1']}
    hint_ladder:
    - 실이 팽팽할 때 반지에서 두 끝점까지의 거리의 합은?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.194
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        반지의 위치를 $\mathrm{R}$라 하면 실이 팽팽할 때 $\overline{\mathrm{PR}}+\overline{\mathrm{RQ}}=4\sqrt2$로 일정하다. 두 정점에서 거리의 합이 일정한 점의 자취는 타원이므로 반지의 궤적은 두 점 $\mathrm{P}$, $\mathrm{Q}$를 초점으로 하는 타원의 일부이다.
      criteria: ['1.R1']
    - id: 1b-2
      content: |
        $\overline{\mathrm{PQ}}=\sqrt{1+3+4}=2\sqrt2$이고 직선 $\mathrm{PQ}$가 $X$축, 중점이 원점이므로 초점은 $(-\sqrt2,0)$, $(\sqrt2,0)$이다. 실의 길이가 $4\sqrt2$이므로 $X$축과 만나는 점의 $X$좌표는 $\pm2\sqrt2$, $Y$축과 만나는 점의 $Y$좌표는 $\pm\sqrt{8-2}=\pm\sqrt6$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        따라서 구하는 타원의 방정식은 $\dfrac{X^2}{8}+\dfrac{Y^2}{6}=1$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        $\overline{\mathrm{PR}}+\overline{\mathrm{RQ}}$가 일정함을 근거로 타원(초점 $\mathrm{P}$, $\mathrm{Q}$)임을 설명했다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\overline{\mathrm{PQ}}=2\sqrt2$로 초점 $(\pm\sqrt2,0)$과 장축 $2a=4\sqrt2$를 정했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\dfrac{X^2}{8}+\dfrac{Y^2}{6}=1$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3176}
  misconceptions:
  - id: MC-GEO-3176
    outcome_code: '71'
    wrong_work: '$a=4\sqrt2$로 두어 $\dfrac{X^2}{32}+\dfrac{Y^2}{30}=1$'
    detect_cue: 장반경을 실의 길이 그대로 썼다
    feedback: 두 초점까지 거리의 합이 $2a$입니다. 실의 길이 $4\sqrt2$는 $2a$이므로 $a=2\sqrt2$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $xy$평면과 $XY$평면의 교선 $\ell$의 방정식은 $XY$평면 위에서 $Y=aX+b$가 된다. 상수 $a$, $b$의 값을 각각 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'a = -1; b = -4*sqrt(2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\alpha\perp xy$평면이고 $\mathrm{PQ}$는 수평과 $\dfrac\pi4$를 이루므로 $\ell:Y=-X-m$, $\mathrm{P}(\sqrt2,0)$에서 $\ell$까지 거리 $5$.
    steps:
    - {id: 2a, content: '$\dfrac{\lvert\sqrt2+m\rvert}{\sqrt2}=5\Rightarrow m=4\sqrt2$, $a=-1$, $b=-4\sqrt2$', criteria: ['2.R1', '2.M1', '2.A1']}
    hint_ladder:
    - 반지가 가장 낮은 곳에 멈추면 평면 $\alpha$는 $xy$평면과 어떤 관계인가?
    - $\mathrm{P}$와 $\mathrm{Q}$의 높이 차와 수평 거리를 비교해 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.194
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        반지가 가장 낮은 위치에서 멈추면 반지와 $\mathrm{P}$, $\mathrm{Q}$가 이루는 평면 $\alpha$는 $xy$평면에 수직이다. 두 평면의 교선을 $\ell$이라 하면 $\ell$은 $\alpha$ 위의 수평선이다.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        $\mathrm{P}$, $\mathrm{Q}$에서 $xy$평면까지의 거리의 차는 $5-3=2$이고, $xy$평면에 내린 수선의 발 $(0,-\sqrt3)$, $(1,0)$ 사이의 거리도 $2$이므로 평면 $\alpha$ 위에서 직선 $\ell$과 $X$축이 이루는 각은 $\dfrac\pi4$이다. [그림 2]의 축 방향에서 $\ell$은 $Y=-X-m$ $(m>0)$ 꼴이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $\mathrm{P}$는 $XY$좌표로 $(\sqrt2,0)$이고 $\mathrm{P}$에서 $\ell$까지의 수직거리는 $\mathrm{P}$의 높이 $5$이므로 $\dfrac{\lvert\sqrt2+m\rvert}{\sqrt2}=5$, $m=4\sqrt2$이다. 따라서 $a=-1$, $b=-4\sqrt2$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        평면 $\alpha$가 $xy$평면에 수직임(또는 $\ell$이 수평선임)을 적었다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        높이 차 $2$와 수평 거리 $2$로 $\ell$과 $X$축이 이루는 각 $\dfrac\pi4$(기울기 $-1$)를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $\mathrm{P}$에서 $\ell$까지의 거리 $5$로 $b=-4\sqrt2$를 구하고 $a=-1$, $b=-4\sqrt2$를 적었다.
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.M1], max_points: 4}
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3177}
  misconceptions:
  - id: MC-GEO-3177
    outcome_code: '71'
    wrong_work: '$\ell$의 기울기를 $+1$로 두거나 $b=+4\sqrt2$로 둠'
    detect_cue: $\ell$이 [그림 2]의 아래쪽(원점보다 아래)에 있지 않다
    feedback: $X$축은 오른쪽 위, $Y$축은 왼쪽 위 방향입니다. 수평선 $\ell$은 두 축과 $\tfrac\pi4$를 이루며 원점 아래쪽에 있습니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    반지가 $xy$평면과 가장 가까운 위치의 점 $\mathrm{R}$에서 멈췄을 때, 점 $\mathrm{R}$에서 $xy$평면까지 이르는 수직거리를 구하시오.
  points: 10
  depends_on: ['1', '2']
  answer: {kind: expression, value: '4 - sqrt(7)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 가장 낮은 점은 타원 위에서 접선 기울기가 $-1$인 점(아래쪽)이고, 그 점에서 $\ell$까지의 거리가 답이다.
    steps:
    - {id: 3a, content: '$X=\tfrac43Y$, 접점 $\left(-\tfrac{4\sqrt2}{\sqrt7},-\tfrac{3\sqrt2}{\sqrt7}\right)$, 거리 $=4-\sqrt7$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2']}
    hint_ladder:
    - $\ell$에 평행한 접선을 생각해 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.195
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        반지가 $xy$평면과 가장 가까운 위치는 $\ell$과 평행한(기울기 $-1$) 직선 $\ell^{\prime}$이 타원에 접하는 접점이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        타원의 방정식을 $X$에 대하여 미분하면 $\dfrac X4+\dfrac Y3\dfrac{dY}{dX}=0$이고 $\dfrac{dY}{dX}=-\dfrac{3X}{4Y}=-1$에서 $X=\dfrac43Y$이다. 타원의 방정식과 연립하면 $\dfrac{7}{18}Y^2=1$이고, $\ell$ 쪽(아래쪽) 접점은 $(X,Y)=\left(-\dfrac{4\sqrt2}{\sqrt7},-\dfrac{3\sqrt2}{\sqrt7}\right)$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        지면까지의 거리는 이 접점에서 $\ell:X+Y+4\sqrt2=0$까지의 거리이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $\dfrac{\left\lvert-\dfrac{4\sqrt2}{\sqrt7}-\dfrac{3\sqrt2}{\sqrt7}+4\sqrt2\right\rvert}{\sqrt2}=\lvert4-\sqrt7\rvert=4-\sqrt7$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        가장 낮은 점이 기울기 $-1$인 접선의 접점임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        접점 $\left(-\dfrac{4\sqrt2}{\sqrt7},-\dfrac{3\sqrt2}{\sqrt7}\right)$을 구했다.
      depends_on: [3.M1]
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 2
      evidence: |
        접점에서 직선 $\ell$까지의 거리로 높이를 구하려 했다.
      depends_on: []
      implied_ok: true
      ft: {allowed: true, from: [2.A1], max_points: 2}
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: |
        $4-\sqrt7$을 얻었다.
      depends_on: [3.M2, 3.A1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3177}
  misconceptions:
  - id: MC-GEO-3177
    outcome_code: '71'
