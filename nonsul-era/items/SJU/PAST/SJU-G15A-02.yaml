intent: |
  멱영행렬 $N^3=O$의 성질을 이용해 $E-N$의 역행렬을 구성하고, 교환 가능한 행렬로 일반화하며, 귀류법과 성분 계산으로 $N$의 역행렬 부재와 $N^2=O$를 보이는 논증 능력을 본다.
key_idea: |
  $(E-N)(E+N+N^2)=E-N^3=E$. $N$이 역행렬을 가지면 $N^3=O$에 $N^{-1}$을 두 번 곱해 $N=O$이 되어 모순. $b=ac$이면 $N^2=(a+c)N$이므로 $O=N^3=(a+c)^2N$에서 $a+c=0$.
stuck: |
  (2-4)에서 $N^2$을 직접 계산해 $(a+c)N$으로 묶어 내는 것, $N\ne O$(성분 $1$)이므로 $a+c=0$을 끌어내는 것
