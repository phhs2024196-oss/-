stimuli:
- label: 제시문
  body: |
    실수에서 정의된 함수 $f$가 모든 $x$에 대해 $f(-x)=-f(x)$를 만족하면 원점에 대해 점대칭인 함수가 된다. 이는 아래 [그림 1]에서 보듯이 두 점 $(x,f(x))$와 $(-x,f(-x))$의 중점이 $(0,0)$이 된다는 것과 같은 의미이다.
    (그림 1: 원점을 지나는 증가하는 곡선 위의 두 점 $(x,f(x))$, $(-x,f(-x))$를 잇는 점선이 원점을 지난다. 그림 2: 점 $(a,b)$에 대해 점대칭인 곡선 $y=f(x)$와, 이를 평행이동해 원점을 지나게 한 곡선 $y=g(x)=f(x+a)-b$)
    같은 방법으로 함수 $f$가 점 $(a,b)$에 대해 점대칭인 함수라는 말은 두 점 $(a-x,f(a-x))$와 $(a+x,f(a+x))$의 중점이 $(a,b)$라는 뜻이므로 모든 $x$에 대해
    $$f(a+x)+f(a-x)=2b\quad\cdots\cdots\text{①}$$
    를 만족한다는 것을 알 수 있다.
    또는, 점 $(a,b)$에 대해 점대칭인 함수 $y=f(x)$를 [그림 2]에서처럼 $x$축으로 $-a$만큼, $y$축으로 $-b$만큼 평행이동 시켜 얻은 함수를 $g(x)=f(x+a)-b$라 하자. 이때 $g(x)$가 원점에 대해 점대칭인 함수가 된다는 사실을 이용하여, $g(-x)=-g(x)$로부터 식 ①을 얻을 수도 있다.

stem: |
  아래 제시문을 읽고, 이를 이용하여 각 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    함수 $f(x)=x^3-6x^2+11x-6$은 점 $(a,b)$에 대해 점대칭인 함수가 된다. 점 $(a,b)$를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '(2, 0)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 삼차함수는 변곡점에 대해 점대칭이다. $f''(x)=6x-12=0$에서 $(2,f(2))=(2,0)$.
    steps:
    - {id: 1a, content: '$f^{\prime\prime}(2)=0$, $f(2)=0$, $f(2+x)+f(2-x)=0$', criteria: ['1.M1', '1.A1', '1.R1']}
    hint_ladder:
    - 삼차함수의 그래프는 어떤 점에 대해 대칭인가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.197 (풀이 2)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f''(x)=6x-12=0$에서 $x=2$이고 $f(2)=8-24+22-6=0$이므로 변곡점은 $(2,0)$이다.
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        식 ①로 확인하면
        $f(2+x)+f(2-x)=\{(2+x)^3-6(2+x)^2+11(2+x)-6\}+\{(2-x)^3-6(2-x)^2+11(2-x)-6\}=0$
        이 모든 $x$에 대해 성립하므로 $f$는 점 $(2,0)$에 대해 점대칭이다. 즉 $(a,b)=(2,0)$.
      criteria: ['1.R1']
  - id: S1-ALT
    audience: ALT
    source_flow: 해설교재 p.197 풀이 1
    method_no: 2
    key_idea: 식 ①을 항등식으로 보고 $(a,b)$를 직접 정한다.
    steps:
    - id: 1c-1
      content: |
        $f(a+x)+f(a-x)=2(a^3-6a^2+11a-6)+(6a-12)x^2$이 모든 $x$에 대해 $2b$이려면 $6a-12=0$, 즉 $a=2$이고 $b=f(2)=0$이다.
      criteria: ['1.M1', '1.A1', '1.R1']
  - id: S1-ALT2
    audience: ALT
    source_flow: 해설교재 p.197 풀이 2의 (2)
    method_no: 3
    key_idea: 평행이동한 함수가 원점 대칭인지 확인한다.
    steps:
    - id: 1d-1
      content: |
        $g(x)=f(x+2)=(x+2)^3-6(x+2)^2+11(x+2)-6=x^3-x$이고 $g(-x)=-g(x)$이므로 $f$는 $(2,0)$에 대해 점대칭이다.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        변곡점(또는 식 ①의 항등식 비교)으로 대칭점 후보를 구하려 했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $(a,b)=(2,0)$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-1, 1c-1]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        $f(2+x)+f(2-x)=0$ 또는 $f(x+2)=x^3-x$가 기함수임을 계산해 점대칭을 확인했다.
      depends_on: []
      steps: [1b-2, 1c-1, 1d-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(항등식 비교)}
  - {code: '71', misconception: MC-CAL-3180}
  misconceptions:
  - id: MC-CAL-3180
    outcome_code: '71'
    wrong_work: '$f(a+x)+f(a-x)=b$로 세워 $b$를 두 배로(또는 반으로) 얻음'
    detect_cue: 우변이 $2b$가 아니다
    feedback: 두 점의 중점이 $(a,b)$이므로 $y$좌표의 합은 $2b$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    함수 $g(x)$가 원점 $(0,0)$에 대해 점대칭인 함수이고, 함수 $h(x)$가 점 $(a,0)$에 대해 점대칭인 함수이면, 합성함수 $(g\circ h)(x)$는 점 $(a,0)$에 대해 점대칭인 함수가 됨을 보이시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $h(a-x)=-h(a+x)$를 $g$에 넣고 $g$의 기함수성을 쓴다.
    steps:
    - {id: 2a, content: '$g(h(a+x))+g(h(a-x))=g(h(a+x))+g(-h(a+x))=0$', criteria: ['2.M1', '2.R1']}
    hint_ladder:
    - 점 $(a,0)$ 대칭을 식 ①로 쓰면 $h(a-x)$는 무엇과 같은가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.197
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $h$가 점 $(a,0)$에 대해 점대칭이므로 식 ①에서 $h(a+x)+h(a-x)=0$, 즉 $h(a-x)=-h(a+x)$이다. 따라서
        $g(h(a+x))+g(h(a-x))=g(h(a+x))+g(-h(a+x))$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $g$는 원점 대칭이므로 $g(-t)=-g(t)$이고, $t=h(a+x)$로 두면 위 식은 $g(h(a+x))-g(h(a+x))=0=2\cdot0$이다. 모든 $x$에 대해 성립하므로 $(g\circ h)(x)$는 점 $(a,0)$에 대해 점대칭이다. ■
      criteria: ['2.R1']
  - id: S2-ALT
    audience: ALT
    source_flow: 해설교재 p.197 별해
    method_no: 2
    key_idea: $k(x)=(g\circ h)(x+a)$가 원점 대칭임을 보인다.
    steps:
    - id: 2c-1
      content: |
        $k(-x)=g(h(a-x))=g(-h(a+x))=-g(h(a+x))=-k(x)$이므로 $k$는 원점 대칭이고, 제시문에 의해 $g\circ h$는 점 $(a,0)$에 대해 점대칭이다.
      criteria: ['2.M1', '2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $h(a-x)=-h(a+x)$를 이용해 $g(h(a-x))$를 $g(-h(a+x))$로 바꿨다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: |
        $g(-t)=-g(t)$로 합이 $0$(또는 $k(-x)=-k(x)$)임을 보이고 점 $(a,0)$ 대칭을 결론지었다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(평행이동 별해)}
  - {code: '71', misconception: MC-PRF-0003}
  misconceptions:
  - id: MC-PRF-0003
    outcome_code: '71'
    wrong_work: '$g(h(a+x))+g(h(a-x))=0$을 가정하고 정리해 $h(a-x)=-h(a+x)$를 얻었으므로 성립한다고 씀'
    detect_cue: 보일 식에서 출발해 조건으로 도착했다
    feedback: 조건($h$, $g$의 대칭)에서 출발해 합이 $0$이 됨을 이끌어야 합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    (3-1)과 (3-2)의 결과를 이용하여 정적분 $\displaystyle\int_{-1}^{5}\left(4+\sqrt[3]{x^3-6x^2+11x-6}\right)dx$의 값을 구하시오.
  points: 10
  depends_on: ['1', '2']
  answer: {kind: value, value: '24', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 피적분함수는 점 $(2,4)$에 대해 점대칭이고 구간이 $x=2$에 대해 대칭이므로 값은 직사각형 넓이 $6\times4$.
    steps:
    - {id: 3a, content: '$\int_{-1}^5\sqrt[3]{f(x)}dx=0\Rightarrow\int_{-1}^5(4+\sqrt[3]{f(x)})dx=24$', criteria: ['3.M1', '3.R1', '3.A1']}
    hint_ladder:
    - $\sqrt[3]{x}$는 어떤 대칭을 가지는가? (3-2)의 $g$로 놓아 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.197
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $g(x)=\sqrt[3]{x}$는 원점 대칭이고 $h(x)=f(x)$는 (3-1)에 의해 점 $(2,0)$에 대해 점대칭이므로 (3-2)에 의해 $\sqrt[3]{f(x)}=(g\circ h)(x)$는 점 $(2,0)$에 대해 점대칭이다. 따라서 피적분함수 $4+\sqrt[3]{f(x)}$는 점 $(2,4)$에 대해 점대칭이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        적분 구간 $[-1,5]$는 $x=2$에 대해 대칭이므로, 직선 $y=4$ 위로 올라간 부분과 아래로 내려간 부분의 넓이가 같아 상쇄된다($\int_{-1}^{5}\sqrt[3]{f(x)}dx=\int_{-3}^{3}\sqrt[3]{f(t+2)}dt=0$).
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        따라서 정적분의 값은 직선 $y=4$, $x=-1$, $x=5$와 $x$축으로 둘러싸인 직사각형의 넓이 $4\times6=24$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        (3-1)(3-2)를 써서 $\sqrt[3]{f(x)}$가 $(2,0)$(피적분함수가 $(2,4)$)에 대해 점대칭임을 적었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        구간이 $x=2$에 대해 대칭이라 $\int_{-1}^5\sqrt[3]{f(x)}dx=0$(넓이 상쇄)임을 밝혔다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $24$를 얻었다.
      depends_on: [3.R1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3181}
  misconceptions:
  - id: MC-CAL-3181
    outcome_code: '71'
    wrong_work: '피적분함수 전체가 점대칭이므로 적분값이 $0$이라고 답함'
    detect_cue: 답이 $0$이고 상수 $4$의 몫($24$)이 빠졌다
    feedback: 상쇄되는 것은 대칭 중심 $y=4$ 위아래의 부분입니다. 상수 $4$의 적분 $24$는 남습니다.
    remedy: [RL-3]

