intent: |
  점대칭의 대수적 표현 $f(a+x)+f(a-x)=2b$를 이해해 삼차함수의 대칭점을 찾고, 대칭성이 합성에서 보존됨을 증명한 뒤, 적분하기 어려운 함수의 정적분을 대칭성으로 계산하는 능력을 본다.
key_idea: |
  삼차함수는 변곡점 $(2,0)$에 대해 점대칭이고, $\sqrt[3]{\ }$는 원점 대칭이므로 $\sqrt[3]{f(x)}$는 $(2,0)$에 대해 점대칭이다. 구간 $[-1,5]$는 $x=2$에 대해 대칭이므로 $\int_{-1}^5\sqrt[3]{f(x)}dx=0$.
stuck: |
  $\sqrt[3]{x^3-6x^2+11x-6}$의 부정적분을 구하려 하지 않고 (3-2)의 합성 대칭으로 바꿔 보는 것
