intent: |
  튜브(두 원이 겹친 단면의 회전체)를 좌표평면의 회전체로 모델링하고, 두 곡선 사이 영역의 회전체 부피를 단면 넓이의 적분으로 바꿔 계산하는 능력을 본다.
key_idea: |
  $V=\pi\int_a^b(c+f)^2dx-\pi\int_a^b(c-f)^2dx=4c\pi\int_a^bf(x)dx$이고 $\int_a^bf(x)dx$는 단면 넓이의 절반이다(파푸스 정리와 같은 꼴).
stuck: |
  상자의 크기 $62$, $18$에서 반지름 $6$, 중심까지 거리 $25$를 읽어 내는 것, 그리고 겹친 두 원의 위쪽 절반 넓이를 부채꼴 두 개와 정삼각형으로 나누는 것
