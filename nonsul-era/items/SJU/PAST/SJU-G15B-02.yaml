  $f'(x)=\dfrac{\cos x}{\sqrt3}\le\dfrac{1}{\sqrt3}$이고 등호는 고립점에서만 성립하므로 할선 기울기는 $\dfrac1{\sqrt3}$보다 작고 $\left(0,\dfrac1{\sqrt3}\right)$의 값은 모두 나온다. 회전한 곡선이 함수의 그래프이려면 기울기 $\tan\left(\dfrac\pi2-\theta\right)$인 할선이 없어야 하므로 $\theta\le\dfrac\pi3$.
