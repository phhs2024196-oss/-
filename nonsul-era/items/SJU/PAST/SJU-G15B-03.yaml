    detect_cue: 분모에 $9$, $90$, $99$ 등 십진 순환소수 공식이 나온다
    feedback: 이진법에서 각 자리의 값은 $\tfrac1{2^k}$입니다. 등비급수(공비 $\tfrac12$)로 계산하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    제시문 (가)와 (나)에서 조건을 만족하는 동전의 개수와 추의 개수를 구하는데 사용된 공통된 생각이 무엇인지 논리적으로 설명하시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 남은 양보다 크지 않은 가장 큰 단위부터 가능한 만큼 빼 나가 $0$을 만든다.
    steps:
    - {id: 2a, content: '$1370-2\cdot500-3\cdot100-50-2\cdot10=0$, $73-64-8-1=0$', criteria: ['2.R1', '2.B1']}
    hint_ladder:
    - $1370$원에서 먼저 어떤 동전을 몇 개 빼는가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.201
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 경우 모두 유한개의 단위 $N_1>N_2>N_3>\cdots$로 양 $M$을 만들 때, 남은 양보다 작거나 같은 $N_i$ 중 가장 큰 것부터 남은 양에서 빼기 시작해 $0$이 되도록 하면 사용하는 단위의 전체 개수가 최소가 된다.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        예를 들어 (가)에서 $1370$에서 $500$을 두 번 빼면 $370$, 이보다 작은 값 중 가장 큰 $100$을 세 번 빼면 $70$, 다음으로 $50$을 빼고 $10$을 두 번 빼면 $1370-2\times500-3\times100-50-2\times10=0$이다. (나)도 같은 방법으로 $73-2^6=9$, $9-2^3=1$, $1-1=0$이므로 $2^6$, $2^3$, $1\,\mathrm{g}$ 추를 하나씩 쓴다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 6
      evidence: |
        "남은 양보다 작거나 같은 가장 큰 단위부터 빼서 $0$을 만든다"는 공통 원리를 일반적으로 서술했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.B1
