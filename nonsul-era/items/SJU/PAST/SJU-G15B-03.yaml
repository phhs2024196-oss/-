      points: 3
      evidence: |
        무한등비급수(첫째항 $\tfrac14$, 공비 $\tfrac14$)의 합이 $\dfrac13$임을 근거로 제시했다.
      depends_on: [3.M2]
      ft: {allowed: true, from: [1.M1], max_points: 3}
      steps: [3b-4]
