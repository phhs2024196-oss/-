    detect_cue: 특정 수치 예만 있고 "가장 큰 단위부터" 같은 일반 진술이 없다
    feedback: 두 예에 공통으로 쓰인 규칙을 일반적인 말(남은 양 이하의 가장 큰 단위부터 빼기)로 쓰세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    실수 $\dfrac13$을 이진법으로 나타내면 순환소수가 된다. 우선, (3-2)의 결과를 바탕으로 이 순환소수를 소수점 아래 네 자리까지 구하시오. 또, $\dfrac13$을 이진법으로 나타낸 순환소수를 구하고, 근거를 들어 설명하시오.
  points: 10
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'four_digits = 0.0101; repeating_block = 01', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 가장 큰 단위부터 빼면 $\dfrac13=\dfrac1{2^2}+\dfrac1{2^4}+\cdots$, 즉 $0.0101\cdots_{(2)}$, 그리고 $\dfrac{1/4}{1-1/4}=\dfrac13$으로 $0.\dot0\dot1_{(2)}$ 확인.
    steps:
    - {id: 3a, content: '$\tfrac13-\tfrac14=\tfrac1{12}$, 다음 $\tfrac1{16}$ ⇒ $0.0101_{(2)}$, $0.\dot0\dot1_{(2)}=\tfrac{1/4}{1-1/4}=\tfrac13$', criteria: ['3.M1', '3.A1', '3.M2', '3.R1']}
    hint_ladder:
    - $\tfrac12$, $\tfrac14$, $\tfrac18$, $\tfrac1{16}$ 중 $\tfrac13$ 이하의 가장 큰 값은?
    - 네 자리의 규칙이 계속된다면 어떤 급수가 되는가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.201
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\dfrac13$을 이진법으로 나타내는 것은 $\dfrac12$, $\dfrac1{2^2}$, $\dfrac1{2^3}$, $\cdots$의 합으로 나타내는 것이고, 소수점 아래 네 자리까지 구하는 것은 $\dfrac12$, $\dfrac1{2^2}$, $\dfrac1{2^3}$, $\dfrac1{2^4}$ 중 어느 것이 쓰이는지 정하는 것이다. (3-2)의 방법을 적용한다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\dfrac13$ 이하의 수 중 가장 큰 것은 $\dfrac1{2^2}$이고, $\dfrac13-\dfrac1{2^2}=\dfrac1{12}$ 이하의 수 중 가장 큰 것은 $\dfrac1{2^4}$이다. 따라서 $\dfrac13=\dfrac1{2^2}+\dfrac1{2^4}+\cdots$이고 소수점 아래 네 자리까지는 $0.0101_{(2)}$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        네 자리까지의 값으로부터 $\dfrac13$의 이진 전개는 $0.\dot0\dot1_{(2)}$일 것이라고 예상할 수 있다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $0.\dot0\dot1_{(2)}=\dfrac1{2^2}+\dfrac1{2^4}+\dfrac1{2^6}+\cdots$는 첫째항 $\dfrac14$, 공비 $\dfrac14$인 무한등비급수이므로 그 합은 $\dfrac{1/4}{1-1/4}=\dfrac13$이다. 따라서 $\dfrac13=0.\dot0\dot1_{(2)}$이다.
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        (3-2)의 원리(가장 큰 단위 $\tfrac1{2^k}$부터 빼기)를 적용했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.R1], max_points: 2}
      steps: [3b-1]
    - id: 3.A1
