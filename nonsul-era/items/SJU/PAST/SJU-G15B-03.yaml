stimuli:
- label: 가
  body: |
    $500$원, $100$원, $50$원, $10$원짜리 동전이 충분히 많이 있을 때, 동전의 개수를 최소한으로 하여 $1370$원을 지불하는 방법은 $500$원짜리 동전 $2$개, $100$원짜리 동전 $3$개, $50$원짜리 동전 $1$개, $10$원짜리 동전 $2$개를 지불하는 것이다.
- label: 나
  body: |
    $1\,\mathrm{g}$, $2\,\mathrm{g}$, $2^2\,\mathrm{g}$, $\cdots$, $2^6\,\mathrm{g}$짜리 추가 각각 충분히 많이 있을 때, 양팔 저울에 추를 최소한으로 올려 $73\,\mathrm{g}$짜리 물체와 평형을 이루게 하는 방법은 $2^6\,\mathrm{g}$짜리 $1$개, $2^3\,\mathrm{g}$짜리 $1$개, $1\,\mathrm{g}$짜리 $1$개를 올리는 것이다.
- label: 다
  body: |
    어떤 실수 $x$를 십진법으로 나타낸 것이 $15.401$이라는 것은
    $$x=1\times10^1+5\times10^0+4\times\dfrac{1}{10^1}+1\times\dfrac{1}{10^3}$$
    이라는 것을 의미한다.
    또, 실수 $x$를 십진법으로 나타낸 것이 순환소수 $1.\dot2$라는 것은
    $$x=1\times10^0+\sum_{k=1}^{\infty}\left(2\times\dfrac{1}{10^k}\right)=1\times10^0+2\times\dfrac{1}{10^1}+2\times\dfrac{1}{10^2}+2\times\dfrac{1}{10^3}+\cdots$$
    과 같이 수렴하는 무한급수로 표현된다는 뜻이다.
    같은 방법으로 양의 실수 $x$를 이진법으로 나타낸다는 것은 $0$ 또는 $1$인 $a_i$, $b_j$에 대해
    $$x=\left(a_n\times2^n+\cdots+a_1\times2^1+a_0\times2^0\right)+\left(b_1\times\dfrac{1}{2^1}+b_2\times\dfrac{1}{2^2}+\cdots\right)$$
    일 때, $x=a_n\cdots a_1a_0.b_1b_2b_3\cdots_{(2)}$와 같이 나타내는 것이다. 첨자 ${}_{(2)}$는 십진법과 구분하여 이진법을 나타내기 위해 표시하는 것이다.
    예를 들어, $101.01_{(2)}$는 실수 $2^2+1+\dfrac{1}{2^2}=\dfrac{21}{4}$을 의미한다.

stem: |
  아래 제시문 (가),(나),(다)를 읽고, 이를 이용하여 각 물음에 답하시오.

