key_idea: |
  $0.0\dot1_{(2)}=\sum_{k\ge2}\dfrac1{2^k}=\dfrac12$. 남은 양보다 작거나 같은 가장 큰 단위 $\dfrac1{2^k}$를 차례로 빼면 $\dfrac13=\dfrac1{2^2}+\dfrac1{2^4}+\cdots=0.\dot0\dot1_{(2)}$이고, 이는 공비 $\dfrac14$인 등비급수로 확인된다.
