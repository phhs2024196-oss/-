  stem: |
    제시문 (다)를 이용하여 어떤 실수 $a$를 이진법으로 나타낸 것이 $0.0\dot1_{(2)}$이다. 실수 $a$를 기약분수로 나타내시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: ['0.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $0.0\dot1_{(2)}=\dfrac1{2^2}+\dfrac1{2^3}+\cdots$(첫째항 $\tfrac14$, 공비 $\tfrac12$).
    steps:
    - {id: 1a, content: '$a=\dfrac{1/4}{1-1/2}=\dfrac12$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 제시문 (다)처럼 각 자리를 $\tfrac1{2^k}$의 합으로 써 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.201
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        제시문 (다)에 따라 $0.0\dot1_{(2)}=\dfrac1{2^2}+\dfrac1{2^3}+\dfrac1{2^4}+\cdots$이고, 이는 첫째항이 $\dfrac1{2^2}$이고 공비가 $\dfrac12$인 무한등비급수이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\lvert\tfrac12\rvert<1$이므로 수렴하고 $a=\dfrac{\frac14}{1-\frac12}=\dfrac12$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $0.0\dot1_{(2)}$을 첫째항 $\dfrac14$, 공비 $\dfrac12$인 무한등비급수로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $a=\dfrac12$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3186}
  misconceptions:
  - id: MC-CAL-3186
