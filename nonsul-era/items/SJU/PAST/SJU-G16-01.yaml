stimuli: []

stem: |
  아래 글을 읽고, 각 물음에 답하시오.

  $x\ge0$에서 연속이고 $x>0$에서 미분가능한 함수 $f(x)$에 대하여, $f(0)=0$이고 $x>0$일 때 $f'(x)>0$이다. $y=f(x)$의 역함수의 그래프를 $y$축의 둘레로 회전시켜 얻은 모양의 용기에 물을 넣고 있다. 시각 $t$에서 용기에 담긴 물의 높이는 $\sqrt t$이다. 또한 시각 $t$에서 물의 부피를 $V(t)$라 할 때, $V'(t)=aV(t)+b$이고 $V(0)=0$, $V(1)=1$, $V(2)=3$이다. (단, $a,b$는 상수이다.)
  (원문은 '역함수'에 밑줄)

subparts:
- id: '1'
  stem: |
    $x>0$일 때 $f(x)>0$임을 보이시오.
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 구간 $[0,x]$에서 평균값 정리.
    steps:
    - {id: 1a, content: '$f(x)=f(x)-f(0)=xf^{\prime}(s)>0$, $0<s<x$', criteria: ['1.M1', '1.R1']}
    hint_ladder:
    - $f(0)=0$과 $f'>0$을 함께 쓰는 정리는?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.185
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x>0$이라 하자. $f$는 $[0,x]$에서 연속이고 $(0,x)$에서 미분가능하므로 평균값 정리에 의해 $f(x)-f(0)=xf'(s)$인 $s\in(0,x)$가 존재한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f(0)=0$, $x>0$, $f'(s)>0$이므로 $f(x)=xf'(s)>0$이다. ■
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        $[0,x]$에서 평균값 정리를 조건(연속·미분가능)과 함께 적용했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 25
      evidence: |
        $f(0)=0$, $x>0$, $f'(s)>0$으로 $f(x)>0$을 결론지었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: '"증가함수이므로"만 쓰고 근거(평균값 정리 등) 없이 결론'
      effect: cap
      value: 25
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRF-0003}
  misconceptions:
  - id: MC-PRF-0003
    outcome_code: '71'
    wrong_work: '$f(x)>0$이라 가정하고 $f^{\prime}>0$과 모순 없음을 확인'
    detect_cue: 결론을 전제로 출발
    feedback: 보여야 할 것을 가정하지 말고 $f(0)=0$에서 출발해 평균값 정리로 이끄세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $a$와 $b$를 구하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'a = log(2); b = log(2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $V''=aV'$에서 $V=A_1(e^{at}-1)$, $V(2)/V(1)=e^a+1=3$.
    steps:
    - {id: 2a, content: '$V=A_1(e^{at}-1)$, $e^a=2$, $A_1=1$, $V=2^t-1$, $a=b=\ln2$', criteria: ['2.M1', '2.M2', '2.A1', '2.A2']}
    hint_ladder:
    - $V'=aV+b$를 한 번 더 미분하면?
    - $V(2)$를 $V(1)$과 비교해 인수분해하자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.185
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        높이 $y$에서 용기의 단면은 반지름이 $f(y)$인 원이므로 $t>0$이면 $V(t)=\displaystyle\int_0^{\sqrt t}\pi\{f(y)\}^2dy$이고, $V'(t)=\pi\{f(\sqrt t)\}^2\dfrac{1}{2\sqrt t}>0$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $f$가 미분가능하므로 $V'$도 미분가능하고, $V'(t)=aV(t)+b$를 미분하면 $V''(t)=aV'(t)$이다. $\dfrac{V''(t)}{V'(t)}=a$의 양변을 적분하면 $\ln V'(t)=at+C$, 즉 $V'(t)=Ae^{at}$이고 다시 적분하면 $V(t)=A_1e^{at}+B_1$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $V$는 $t=0$에서 연속이므로 $V(0)=A_1+B_1=0$, $B_1=-A_1$이고 $V(t)=A_1(e^{at}-1)$이다.
        $1=V(1)=A_1(e^a-1)$, $3=V(2)=A_1(e^{2a}-1)=A_1(e^a-1)(e^a+1)$이므로 $e^a+1=3$, $e^a=2$, $A_1=1$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        $V(t)=2^t-1$, $V'(t)=2^t\ln2=\ln2\cdot V(t)+\ln2$이므로 $a=b=\ln2$이다.
      criteria: ['2.A2']
  - id: S2-ALT
    audience: ALT
    source_flow: 해설교재 p.185 별해
    method_no: 2
    key_idea: 원 해설 별해 — $V'=aV+b$로부터 $V(t)=pe^{dt}+q$ 꼴을 예측해 대입.
    steps:
    - id: 2c-1
      content: |
        $V(t)=pe^{dt}+q$라 놓으면 $V(0)=0$에서 $V=pe^{dt}-p$. $1=p(e^d-1)$, $3=p(e^d-1)(e^d+1)$에서 $e^d=2$, $p=1$, $V(t)=2^t-1$, $V'(t)=2^t\ln2$이므로 $a=b=\ln2$.
      criteria: ['2.M2', '2.A1', '2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $V(t)=\int_0^{\sqrt t}\pi\{f(y)\}^2dy$로 부피를 나타내고 $V'>0$을 보였다.
      depends_on: []
      implied_ok: true
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        $V''=aV'$(또는 지수함수 꼴 가정)으로 $V=A_1e^{at}+B_1$ 꼴을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        $V(0)$, $V(1)$, $V(2)$ 조건으로 $e^a=2$, $A_1=1$을 구했다.
      depends_on: [2.M2]
      steps: [2b-3, 2c-1]
    - id: 2.A2
      mark_type: A
      points: 10
      evidence: |
        $a=b=\ln2$.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(지수함수 꼴 가정 별해)}
  - {code: '71', misconception: MC-CAL-3165}
  misconceptions:
  - id: MC-CAL-3165
    outcome_code: '71'
    wrong_work: '$V(t)=\int_0^{\sqrt t}\pi\{f^{-1}(x)\}^2dx$처럼 $x$축 회전 공식으로 세움'
    detect_cue: 적분변수와 반지름이 뒤바뀌었다
    feedback: $y$축 둘레 회전에서 높이 $y$의 단면 반지름은 그 높이에서의 $x$값, 즉 원함수 $f(y)$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $f(x)$를 구하시오.
  points: 50
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'sqrt(2*x*2**(x**2)*log(2)/pi)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $2^t-1=\int_0^{\sqrt t}\pi f(y)^2dy$를 미분하고 $x=\sqrt t$.
    steps:
    - {id: 3a, content: '$2^t\ln2=\pi f(\sqrt t)^2\tfrac{1}{2\sqrt t}\Rightarrow f(x)^2=\tfrac{2x\cdot2^{x^2}\ln2}{\pi}$', criteria: ['3.M1', '3.A1', '3.A2']}
    hint_ladder:
    - (1-2)의 $V(t)$와 부피의 적분식을 같다고 놓고 미분하자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.185
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1-2)에서 $V(t)=2^t-1$이므로 $2^t-1=\displaystyle\int_0^{\sqrt t}\pi\{f(y)\}^2dy$가 성립한다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        양변을 $t$로 미분하면 $2^t\ln2=\pi\{f(\sqrt t)\}^2\dfrac{1}{2\sqrt t}$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $x=\sqrt t$로 놓으면 $\{f(x)\}^2=\dfrac{2x\cdot2^{x^2}\ln2}{\pi}$이고, (1-1)에서 $x>0$일 때 $f(x)>0$이므로 $f(x)=\sqrt{\dfrac{2x\cdot2^{x^2}\ln2}{\pi}}$이다($x=0$에서도 $f(0)=0$으로 성립).
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        $V(t)=2^t-1$과 부피 적분식을 같다고 놓았다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 15}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        합성함수 미분으로 $2^t\ln2=\pi\{f(\sqrt t)\}^2\dfrac1{2\sqrt t}$를 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        $f(x)>0$을 근거로 $f(x)=\sqrt{\dfrac{2x\cdot2^{x^2}\ln2}{\pi}}$.
      depends_on: [3.M1, 3.A1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3161}
  misconceptions:
  - id: MC-CAL-3161
    outcome_code: '71'
    wrong_work: '$\tfrac{d}{dt}\int_0^{\sqrt t}\pi f(y)^2dy=\pi f(\sqrt t)^2$로 위끝의 미분 $\tfrac1{2\sqrt t}$을 빠뜨림'
    detect_cue: 결과에 $2x$ 인자가 없다
    feedback: 위끝이 $\sqrt t$이므로 합성함수 미분으로 $(\sqrt t)^{\prime}=\tfrac{1}{2\sqrt t}$를 곱해야 합니다.
    remedy: [RL-3]

