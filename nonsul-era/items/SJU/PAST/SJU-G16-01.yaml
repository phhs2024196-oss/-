intent: |
  평균값 정리로 함숫값의 부호를 증명하고, 역함수 그래프를 $y$축 둘레로 회전한 용기의 물의 부피를 정적분으로 나타내 $V'=aV+b$ 조건에서 $V$를 결정한 뒤, 다시 미분해 $f$를 복원하는 능력을 본다.
key_idea: |
  높이 $\sqrt t$까지의 부피는 $V(t)=\int_0^{\sqrt t}\pi\{f(y)\}^2dy$(높이 $y$의 단면 반지름이 $f(y)$)이고, $V''=aV'$에서 $V=A_1(e^{at}-1)$, $V(1)=1$, $V(2)=3$으로 $e^a=2$.
stuck: |
  역함수의 그래프를 $y$축 둘레로 돌렸을 때 높이 $y$에서의 단면 반지름이 원함수 값 $f(y)$라는 해석, 그리고 $V(2)=A_1(e^a-1)(e^a+1)$로 인수분해해 $e^a$를 구하는 것
idea_tags: [IDEA-INVERSE-GRAPH-ROTATION-RADIUS, IDEA-LOG-DERIVATIVE-EXPONENTIAL]
