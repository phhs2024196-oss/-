stimuli: []

stem: |
  아래 글을 읽고, 각 물음에 답하시오.

  두 평면 $\alpha$와 $\beta$의 이면각을 $\theta\left(0<\theta<\dfrac\pi2\right)$, 교선을 $L$이라 하자. 점 $\mathrm{A}$는 교선 $L$ 위에 있다. 삼각형 $\mathrm{ABC}$는 평면 $\alpha$ 위에 있고 $\beta$ 위로의 정사영은 정삼각형이다. 점 $\mathrm{B}$와 $\mathrm{C}$의 $\beta$ 위로의 정사영을 각각 $\mathrm{B}'$, $\mathrm{C}'$이라 하고, 선분 $\mathrm{AB}'$과 교선 $L$이 이루는 각을 $w\left(0<w<\dfrac\pi3\right)$라 하자.
  (그림: 교선 $L$ 위의 점 A에서 평면 $\alpha$ 위의 삼각형 ABC와 평면 $\beta$ 위의 정사영 정삼각형 $\mathrm{AB^{\prime}C^{\prime}}$(점선). $\mathrm{B^{\prime}}$이 $\mathrm{C^{\prime}}$보다 교선 $L$에 가깝게 그려짐. 원문은 '정삼각형'에 밑줄)

subparts:
- id: '1'
  stem: |
    직선 $\mathrm{B'C'}$과 교선 $L$이 이루는 예각이 $u$이고 $\sin w=\dfrac13$일 때, $\sin u$의 값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: value, value: '(2*sqrt(6) - 1)/6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 직선 $\mathrm{B'C'}$과 $L$의 교점 P에서 외각 관계로 $u=\dfrac\pi3-w$.
    steps:
    - {id: 1a, content: '$\sin u=\sin\left(\tfrac\pi3-w\right)=\tfrac{\sqrt3}{2}\cdot\tfrac{2\sqrt2}{3}-\tfrac12\cdot\tfrac13=\tfrac{2\sqrt6-1}{6}$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 직선 $\mathrm{B'C'}$을 연장해 $L$과 만나는 점을 P라 하자. 삼각형 $\mathrm{APB'}$의 외각은?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.186
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        평면 $\beta$에서 직선 $\mathrm{C'B'}$의 연장선이 $L$과 만나는 점을 P라 하면, 삼각형 $\mathrm{APB'}$의 외각에 대해 $\angle\mathrm{PAB'}+\angle\mathrm{B'PA}=\angle\mathrm{AB'C'}=\dfrac\pi3$이다.
        따라서 $u=\angle\mathrm{B'PA}=\dfrac\pi3-\angle\mathrm{PAB'}=\dfrac\pi3-w$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\sin w=\dfrac13$이고 $w$는 예각이므로 $\cos w=\dfrac{2\sqrt2}{3}$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\sin u=\sin\left(\dfrac\pi3-w\right)=\sin\dfrac\pi3\cos w-\cos\dfrac\pi3\sin w=\dfrac{\sqrt3}{2}\cdot\dfrac{2\sqrt2}{3}-\dfrac12\cdot\dfrac13=\dfrac{2\sqrt6-1}{6}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        외각(또는 각의 합) 관계로 $u=\dfrac\pi3-w$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $\cos w=\dfrac{2\sqrt2}{3}$.
      depends_on: [1.M1]
      implied_ok: true
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 20
      evidence: |
        덧셈정리로 $\sin u=\dfrac{2\sqrt6-1}{6}$.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '79', meaning: '기타 오답(예: $u=\tfrac\pi3+w$로 두어 $\tfrac{2\sqrt6+1}{6}$)'}
  misconceptions: []

- id: '2'
  stem: |
    정삼각형 $\mathrm{AB'C'}$의 한 변의 길이가 $2$일 때, $\overline{\mathrm{AB}}^2$을 $\theta$와 $w$로 표현하시오. 또한 $\theta=\dfrac\pi3$이고 $w=\dfrac\pi6$일 때, $\overline{\mathrm{AB}}$를 구하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'AB2 = 4*cos(w)**2 + 4*sin(w)**2/cos(theta)**2; AB = sqrt(7)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{B'}$에서 $L$에 내린 수선의 발 P에 대해 $\overline{\mathrm{AP}}=2\cos w$(보존), $\overline{\mathrm{PB}}=\dfrac{2\sin w}{\cos\theta}$.
    steps:
    - {id: 2a, content: '$\overline{\mathrm{AB}}^2=4\cos^2w+4\sin^2w\sec^2\theta$, $\theta=\tfrac\pi3$, $w=\tfrac\pi6$이면 $3+4=7$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $\mathrm{B'}$에서 $L$에 수선을 내리자. 그 수선의 발과 B를 잇는 선분은 $L$과 어떤 관계인가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.186
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\mathrm{B'}$에서 $L$에 내린 수선의 발을 P라 하면 $\overline{\mathrm{AP}}=2\cos w$, $\overline{\mathrm{PB'}}=2\sin w$이다.
        $\mathrm{BB'}\perp\beta$, $\mathrm{B'P}\perp L$이므로 삼수선의 정리에 의해 $\mathrm{BP}\perp L$이고 $\angle\mathrm{BPB'}=\theta$이다. 따라서 $\overline{\mathrm{PB}}=\dfrac{2\sin w}{\cos\theta}=2\sin w\sec\theta$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\mathrm{AP}\perp\mathrm{PB}$(평면 $\alpha$ 위)이므로 $\overline{\mathrm{AB}}^2=(2\cos w)^2+(2\sin w\sec\theta)^2=4\cos^2w+4\sin^2w\sec^2\theta$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $\theta=\dfrac\pi3$, $w=\dfrac\pi6$이면 $\overline{\mathrm{AB}}^2=4\cdot\dfrac34+4\cdot\dfrac14\cdot4=3+4=7$이므로 $\overline{\mathrm{AB}}=\sqrt7$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        교선 방향 성분 $2\cos w$와 교선까지의 거리 $2\sin w$를 나누고 후자가 $\alpha$에서 $\dfrac{2\sin w}{\cos\theta}$임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $\overline{\mathrm{AB}}^2=4\cos^2w+4\sin^2w\sec^2\theta$.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 10
      evidence: |
        $\overline{\mathrm{AB}}=\sqrt7$.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3156}
  misconceptions:
  - id: MC-GEO-3156
    outcome_code: '71'
    wrong_work: '$\overline{\mathrm{PB}}=2\sin w\cos\theta$로 두어 $\overline{\mathrm{AB}}^2=4\cos^2w+4\sin^2w\cos^2\theta$'
    detect_cue: 원래 길이가 정사영보다 짧게 나왔다
    feedback: 정사영 길이 = 원래 길이 × $\cos\theta$이므로, 원래 길이는 정사영 길이를 $\cos\theta$로 나눈 값입니다.
    remedy: [RL-1]

- id: '3'
  stem: |
    정삼각형 $\mathrm{AB'C'}$의 한 변의 길이가 $2$일 때, $\overline{\mathrm{AB}}^2+\overline{\mathrm{BC}}^2+\overline{\mathrm{CA}}^2$을 $\theta$만의 함수 $f(\theta)$로 표현하고 $f\!\left(\dfrac\pi4\right)$를 구하시오.
  points: 50
  depends_on: ['2']
  answer: {kind: expression, value: 'f = 6 + 6/cos(theta)**2; f(pi/4) = 18', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 세 변의 방향은 $L$과 $w$, $\dfrac\pi3-w$, $\dfrac\pi3+w$의 각을 이루고 $\sum\cos^2=\sum\sin^2=\dfrac32$.
    steps:
    - {id: 3a, content: '$f(\theta)=4\cdot\tfrac32+4\cdot\tfrac32\sec^2\theta=6+6\sec^2\theta$, $f(\tfrac\pi4)=18$', criteria: ['3.M1', '3.M2', '3.A1', '3.A2']}
    hint_ladder:
    - (2-2)의 식을 $\mathrm{BC}$, $\mathrm{CA}$에도 적용하자. 각 변이 $L$과 이루는 각은?
    - $\cos^2w+\cos^2\left(\frac\pi3-w\right)+\cos^2\left(\frac\pi3+w\right)$를 계산해 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.186
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2-2)의 계산 과정은 정사영의 한 변(길이 2)이 $L$과 이루는 각만으로 원래 변의 길이를 준다. $\mathrm{B'C'}$, $\mathrm{C'A}$가 $L$과 이루는 각은 각각 $\dfrac\pi3-w$, $\dfrac\pi3+w$이므로
        $\overline{\mathrm{AB}}^2=4\cos^2w+4\sin^2w\sec^2\theta$, $\overline{\mathrm{BC}}^2=4\cos^2\left(\dfrac\pi3-w\right)+4\sin^2\left(\dfrac\pi3-w\right)\sec^2\theta$, $\overline{\mathrm{CA}}^2=4\cos^2\left(\dfrac\pi3+w\right)+4\sin^2\left(\dfrac\pi3+w\right)\sec^2\theta$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\cos^2w+\left(\dfrac12\cos w+\dfrac{\sqrt3}{2}\sin w\right)^2+\left(\dfrac12\cos w-\dfrac{\sqrt3}{2}\sin w\right)^2=\dfrac32\cos^2w+\dfrac32\sin^2w=\dfrac32$이고,
        마찬가지로 $\sin^2w+\sin^2\left(\dfrac\pi3-w\right)+\sin^2\left(\dfrac\pi3+w\right)=\dfrac32$이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        따라서 $f(\theta)=\overline{\mathrm{AB}}^2+\overline{\mathrm{BC}}^2+\overline{\mathrm{CA}}^2=6+6\sec^2\theta$이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        $f\!\left(\dfrac\pi4\right)=6+6\cdot2=18$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        세 변 각각에 (2-2)의 식을 적용해 각 $w$, $\dfrac\pi3\mp w$로 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 15}
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        $\sum\cos^2=\sum\sin^2=\dfrac32$을 덧셈정리로 보였다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 10
      evidence: |
        $f(\theta)=6+6\sec^2\theta$.
      depends_on: [3.M1, 3.M2]
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 10
      evidence: |
        $f\!\left(\dfrac\pi4\right)=18$.
      depends_on: [3.M1, 3.A1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3156}
  misconceptions:
  - id: MC-GEO-3156
    outcome_code: '71'
    wrong_work: '세 변 모두에 $\sec\theta$를 곱해 $f=12\sec^2\theta$'
    detect_cue: 교선 방향 성분까지 늘였다
    feedback: 교선에 평행한 성분은 정사영해도 길이가 그대로입니다. 수직 성분만 $\sec\theta$배입니다.
    remedy: [RL-1]

- id: '4'
  stem: |
    삼각형 $\mathrm{ABC}$의 넓이는 $1$이고 $\overline{\mathrm{AB}}^2+\overline{\mathrm{BC}}^2+\overline{\mathrm{CA}}^2=8$일 때, 정삼각형 $\mathrm{AB'C'}$의 한 변의 길이를 구하시오.
  points: 50
  depends_on: ['3']
  answer: {kind: value, value: '2*sqrt(3)/3', equivalents: ['2/sqrt(3)'], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 한 변 $d$이면 합은 $\dfrac{3d^2}{2}(1+\sec^2\theta)$, 넓이의 정사영으로 $\cos\theta=\dfrac{\sqrt3d^2}{4}$.
    steps:
    - {id: 4a, content: '$\tfrac{3d^2}{2}\left(1+\tfrac{16}{3d^4}\right)=8\Rightarrow d^2=4,\tfrac43$, $\cos\theta<1\Rightarrow d^2=\tfrac43$', criteria: ['4.M1', '4.M2', '4.A1', '4.R1']}
    hint_ladder:
    - (2-3)을 한 변이 $d$인 경우로 바꾸면?
    - 삼각형의 넓이와 그 정사영의 넓이의 관계는?
    - 두 근 중 $\cos\theta<1$을 만족하는 것은?
  - id: S4-B
    audience: B
    source_flow: 해설교재 p.186
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        정삼각형 $\mathrm{AB'C'}$의 한 변의 길이를 $d$라 하면 (2-3)의 계산 과정에서 $2$를 $d$로 바꾸어
        $\overline{\mathrm{AB}}^2+\overline{\mathrm{BC}}^2+\overline{\mathrm{CA}}^2=\dfrac{3d^2}{2}(1+\sec^2\theta)=8$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        정사영의 넓이는 (원래 넓이)$\times\cos\theta$이고 $\triangle\mathrm{AB'C'}$의 넓이는 $\dfrac{\sqrt3d^2}{4}$이므로 $\cos\theta=\dfrac{\sqrt3d^2}{4}$, 즉 $\sec^2\theta=\dfrac{16}{3d^4}$이다.
      criteria: ['4.M2']
    - id: 4b-3
      content: |
        대입하면 $\dfrac{3d^2}{2}\left(1+\dfrac{16}{3d^4}\right)=8$, $3d^4-16d^2+16=0$, $(d^2-4)(3d^2-4)=0$이므로 $d^2=4$ 또는 $d^2=\dfrac43$이다.
      criteria: ['4.A1']
    - id: 4b-4
      content: |
        $d^2=4$이면 $\cos\theta=\sqrt3>1$이 되어 불가능하고, $d^2=\dfrac43$이면 $\cos\theta=\dfrac{\sqrt3}{3}$로 $0<\theta<\dfrac\pi2$에 맞다. 따라서 $d=\dfrac{2}{\sqrt3}=\dfrac{2\sqrt3}{3}$이다.
      criteria: ['4.R1']
