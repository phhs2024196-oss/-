intent: |
  이면각이 $\theta$인 두 평면에서 교선에 평행한 길이는 보존되고 수직인 길이는 $\sec\theta$배가 됨을 이용해 정사영 전 삼각형의 변의 길이를 나타내고, 세 방향의 $\cos^2$·$\sin^2$ 합이 $w$에 무관함(불변량)을 보이며, 넓이의 정사영 관계로 한 변의 길이를 결정하는 능력을 본다.
key_idea: |
  $\mathrm{B}'$의 교선 방향 성분 $2\cos w$는 그대로, 교선까지 거리 $2\sin w$는 $\alpha$ 위에서 $2\sin w\sec\theta$가 되므로 $\overline{\mathrm{AB}}^2=4\cos^2w+4\sin^2w\sec^2\theta$. 세 변 방향이 $60^\circ$씩 차이 나서 $\sum\cos^2=\sum\sin^2=\dfrac32$.
stuck: |
  각 변의 '교선 방향 성분'과 '교선에 수직 성분'을 분리해 수직 성분만 $\sec\theta$배 늘어난다고 보는 것, 그리고 $\cos^2w+\cos^2\left(\frac\pi3-w\right)+\cos^2\left(\frac\pi3+w\right)=\dfrac32$라는 불변량
idea_tags: [IDEA-DIHEDRAL-PERP-COMPONENT-SEC, IDEA-SUM-COS2-120DEG-INVARIANT]
tags: [구교육과정, 범위 밖(현행), 이면각, 정사영, 삼각함수의 덧셈정리]
