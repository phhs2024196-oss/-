intent: |
  기울기가 $\tan t$인 직선이 반원에 접할 때의 $x$절편으로 그림자 길이를 구하고, 어느 반원이 그림자를 결정하는지 $t$의 범위로 나누어 구간별 함수 $g(t)$와 미분불가능점을 찾은 뒤, 역함수의 미분으로 $h'(4)$를 구하는 능력을 본다.
key_idea: |
  중심 $(c,0)$, 반지름 $r$인 반원에 각 $t$로 접하는 직선의 $x$절편은 $c-\dfrac{r}{\sin t}$이므로 그림자 길이는 $\max\left(\dfrac{3}{\sin t}-5,\ \dfrac{1}{\sin t}-1\right)$이고, 두 값이 같아지는 $t=\dfrac\pi6$(공통접선)에서 바뀐다.
stuck: |
  두 반원 중 그림자를 결정하는 쪽이 $t=\dfrac\pi6$(두 반원의 공통접선 기울기각)에서 바뀐다는 분류, 그리고 $h$가 $g$의 역함수임을 이용한 미분
idea_tags: [IDEA-TANGENT-LINE-INTERCEPT-CIRCLE, IDEA-PIECEWISE-SWITCH-COMMON-TANGENT, IDEA-INVERSE-FUNCTION-DERIVATIVE]
tags: [구교육과정, 그림자, 원의 접선, 역함수의 미분]
elements:
  materials:
  - '반지름 1인 반원(중심 $(1,0)$)과 반지름 3인 반원(중심 $(5,0)$)으로 이루어진 영역'
  - '$x$축과 각 $t$를 이루며 비치는 평행광선과 $x\le0$의 그림자'
  - '그림자 길이 $g(t)$와 그 역함수 $h(s)$'
  concepts:
  - '원의 접선(중심과 직선 사이 거리 = 반지름)'
  - '삼각비'
  - '구간별로 정의된 함수'
  - '미분가능성(좌·우미분계수)'
  - '삼각함수의 미분'
  - '역함수의 미분법'
  tools:
  - '직각삼각형으로 $x$절편 $=c-\tfrac{r}{\sin t}$'
  - '두 후보의 대소 비교 $\tfrac{3}{\sin t}-5\gtrless\tfrac{1}{\sin t}-1\iff\sin t\lessgtr\tfrac12$'
  - '좌·우 미분계수 비교'
  - '$s=g(h(s))$ 양변 미분 또는 $h^{\prime}(g(t))=\tfrac{1}{g^{\prime}(t)}$'
  conditions:
  - '$0<t<\tfrac\pi2$'
  - '$t=\tfrac\pi6$에서 두 반원에 공통으로 접함, 그림자 길이 1'
  - '$g$는 감소 ⇒ $s\ge1$이면 $h(s)\le\tfrac\pi6$, 큰 반원 식 사용'
  - '$\sin h(4)=\tfrac13$, $\cos h(4)=\tfrac{2\sqrt2}{3}$'
  stimuli_used: []
  subpart_links: '(3-2)는 (3-1)의 접선 절편 계산을 일반화, (3-3)은 (3-2)의 $g(t)$ 식을 사용'

