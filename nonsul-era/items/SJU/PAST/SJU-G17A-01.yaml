intent: |
  곡선의 길이 공식으로 현수선의 호의 길이 함수를 구하고, 속력을 적분한 이동 거리(곡선 위 위치)를 비교해 두 점이 만나는 횟수를 삼차방정식의 실근 개수로 판정하는 능력을 본다.
key_idea: |
  $1+\{f'(x)\}^2=\left(\dfrac{e^x+e^{-x}}{2}\right)^2$이므로 호의 길이가 $\dfrac{e^x-e^{-x}}{2}$로 깔끔해지고, 두 점이 만나는 것은 $(0,1)$로부터의 곡선 길이가 같아지는 것과 같다.
stuck: |
  곡선 위를 같은 방향으로 움직이는 두 점이 만나는 조건을 '기준점 $(0,1)$에서 잰 곡선의 길이가 같다'로 바꾸는 발상
