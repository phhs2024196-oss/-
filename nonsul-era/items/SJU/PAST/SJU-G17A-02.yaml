stimuli: []

stem: |
  아래 글을 읽고, 각 물음에 답하시오.

  어느 공장에서 생산되는 제품의 불량률은 이 제품을 생산하는 기계의 작동상태에 따라 다르다. 이 기계가 정상적으로 작동할 경우 불량률은 $0.01$이고, 정상적으로 작동하지 않을 경우 불량률은 $0.10$이라고 한다. 이 기계의 작동상태를 관리하기 위하여 관리자는 기계에 센서를 설치하였다. 이 센서에 빨간 신호가 켜지면 기계의 작동상태가 정상적이지 않다는 것을 나타낸다.
  이 기계가 정상적으로 작동하지 않는 경우 센서에 빨간 신호가 켜지는 확률을 $p_1$, 기계가 정상적으로 작동하는 경우 센서에 빨간 신호가 켜지지 않는 확률을 $p_2$, 센서에 빨간 신호가 켜졌을 때 실제로 이 기계가 정상적으로 작동하고 있지 않을 확률을 $p_3$이라 하자. 즉, $A$를 이 기계가 정상적으로 작동하지 않을 사건이라 하고 $B$를 이 센서에 빨간 신호가 켜지는 사건이라 할 때,
  $p_1=\mathrm{P}(B\mid A)$, $p_2=\mathrm{P}(B^C\mid A^C)$, $p_3=\mathrm{P}(A\mid B)$이다.
  이 기계가 정상적으로 작동하지 않을 확률 $\mathrm{P}(A)$는 $0.01$로 일정하며, 현재 $p_1=0.80$, $p_2=0.90$이라고 한다.

subparts:
- id: '1'
  stem: |
    이 기계에서 생산되는 제품 중에서 임의로 한 개를 골랐을 때 이 제품이 불량품일 확률을 구하시오.
  points: 60
  depends_on: []
  answer: {kind: value, value: '109/10000', equivalents: ['0.0109'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 기계 상태 $A$, $A^C$로 나누어 전확률 공식을 쓴다.
    steps:
    - {id: 1a, content: '$\mathrm{P}(D)=0.1\times0.01+0.01\times0.99=0.0109$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 기계가 정상일 때와 아닐 때로 나누어 생각하자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.171
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        불량품이 뽑히는 사건을 $D$라 하면 $D=(D\cap A)\cup(D\cap A^C)$이고 두 사건은 서로 배반이므로
        $\mathrm{P}(D)=\mathrm{P}(D\mid A)\mathrm{P}(A)+\mathrm{P}(D\mid A^C)\mathrm{P}(A^C)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\mathrm{P}(D\mid A)=0.1$, $\mathrm{P}(A)=0.01$, $\mathrm{P}(D\mid A^C)=0.01$, $\mathrm{P}(A^C)=0.99$를 대입하면
        $\mathrm{P}(D)=0.001+0.0099=\dfrac{109}{10000}=0.0109$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: |
        사건 $A$, $A^C$로 나눈 전확률 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 30
      evidence: |
        $0.0109\left(=\dfrac{109}{10000}\right)$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '79', meaning: 기타 오답}
  misconceptions: []

- id: '2'
  stem: |
    확률 $p_3$을 구하시오.
  points: 60
  depends_on: []
  answer: {kind: value, value: '8/107', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 베이즈 정리. 분모의 $\mathrm{P}(B\mid A^C)$는 $1-p_2=0.1$이다.
    steps:
    - {id: 2a, content: '$p_3=\dfrac{0.8\times0.01}{0.8\times0.01+0.1\times0.99}=\dfrac{8}{107}$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $\mathrm{P}(A\mid B)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(B)}$에서 $\mathrm{P}(B)$를 어떻게 구할까?
    - $\mathrm{P}(B\mid A^C)$를 $p_2$로 나타내자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.171
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $p_3=\mathrm{P}(A\mid B)=\dfrac{\mathrm{P}(A\cap B)}{\mathrm{P}(B)}=\dfrac{\mathrm{P}(B\mid A)\mathrm{P}(A)}{\mathrm{P}(B\mid A)\mathrm{P}(A)+\mathrm{P}(B\mid A^C)\mathrm{P}(A^C)}$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\mathrm{P}(B\mid A^C)=1-\mathrm{P}(B^C\mid A^C)=1-p_2=0.1$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $p_3=\dfrac{0.8\times0.01}{0.8\times0.01+0.1\times0.99}=\dfrac{0.008}{0.107}=\dfrac{8}{107}\,(\approx0.075)$.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 25
      evidence: |
        베이즈 정리(분모에 전확률)로 $p_3$의 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        $\mathrm{P}(B\mid A^C)=1-p_2=0.1$을 썼다.
      depends_on: []
      implied_ok: true
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $p_3=\dfrac{8}{107}$을 얻었다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRB-3153}
  - {code: '72', misconception: MC-PRB-3154}
  misconceptions:
  - id: MC-PRB-3153
    outcome_code: '71'
    wrong_work: '$p_3=\mathrm{P}(B\mid A)=0.8$ 또는 $p_3=\mathrm{P}(A\cap B)=0.008$'
    detect_cue: 분모 $\mathrm{P}(B)$가 없다
    feedback: $p_3$은 신호가 켜졌다는 조건 아래의 확률입니다. $\mathrm{P}(A\cap B)$를 $\mathrm{P}(B)$로 나누세요.
    remedy: [RL-1]
  - id: MC-PRB-3154
    outcome_code: '72'
    wrong_work: '분모에 $0.9\times0.99$를 사용해 $p_3=\tfrac{8}{899}$'
    detect_cue: $\mathrm{P}(B\mid A^C)$ 자리에 $p_2=0.9$가 들어 있다
    feedback: $p_2$는 정상일 때 신호가 켜지지 않을 확률입니다. 켜질 확률은 $1-p_2$입니다.
    remedy: [RL-1]

- id: '3'
  stem: |
    확률 $p_3$은 (2-2)에서 구한 값보다 작아지지 않으면서, $p_2$는 낮추고 $p_1$을 최대한 높이고자 한다. 확률 $p_1$은 $0.01$ 증가할 때마다 $100$만원씩의 추가 비용이 발생하며, $p_2$는 $0.01$ 감소할 때마다 $50$만원씩의 비용이 절약된다. 추가로 드는 비용이 $1500$만원을 넘지 않는 범위 내에서 $p_1$의 최댓값을 구하시오.
  points: 60
  depends_on: ['2']
  answer: {kind: value, value: '24/25', equivalents: ['0.96'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $p_1$ 증가량 $x$, $p_2$ 감소량 $y$에 대해 $p_3\ge\dfrac{8}{107}\iff y\le\dfrac x8$, 비용 $100x-50y\le15$를 연립한다.
    steps:
    - {id: 3a, content: '$y\le\tfrac{x}{8}$, $100x-50y\le15\Rightarrow 100x-\tfrac{50}{8}x\le15\Rightarrow x\le0.16$, $p_1\le0.96$', criteria: ['3.M1', '3.M2', '3.A1', '3.A2']}
    hint_ladder:
    - 변화량을 문자로 두고 두 조건을 부등식으로 쓰자.
    - $p_3\ge\dfrac{8}{107}$을 정리하면 $x$와 $y$의 어떤 관계가 되는가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.171
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $p_1$의 증가량을 $x$, $p_2$의 감소량을 $y\,(x,y\ge0)$라 하자. 추가 비용(만원)은 $\dfrac{100}{0.01}x-\dfrac{50}{0.01}y$이므로 조건은
        $100x-50y\le15$ ⋯ ①
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        변화 후 $p_1=0.8+x$, $\mathrm{P}(B\mid A^C)=1-(0.9-y)=0.1+y$이므로 $p_3$ 조건은
        $\dfrac{(0.8+x)\times0.01}{(0.8+x)\times0.01+(0.1+y)\times0.99}\ge\dfrac{8}{107}$ ⋯ ②
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        ②의 분모를 넘겨 정리하면 $107(0.8+x)\ge8(0.8+x)+792(0.1+y)$, 즉 $99x\ge792y$, $y\le\dfrac{x}{8}$이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        ①에서 $100x\le15+50y\le15+\dfrac{50}{8}x$이므로 $\dfrac{375}{4}x\le15$, $x\le\dfrac{4}{25}=0.16$이다. $x=0.16$, $y=0.02$이면 ①②가 모두 성립한다.
        따라서 $p_1$의 최댓값은 $0.8+0.16=0.96$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        변화량을 두고 비용 조건 $100x-50y\le15$(또는 동치)를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        변화 후 $p_3$의 식을 세워 $\ge\dfrac{8}{107}$ 조건을 썼다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 15}
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $y\le\dfrac{x}{8}$을 얻었다.
      depends_on: [3.M2]
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        연립하여 $x\le0.16$, $p_1$의 최댓값 $0.96$을 얻었다.
      depends_on: [3.M1, 3.A1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRB-3154}
  misconceptions:
  - id: MC-PRB-3154
    outcome_code: '71'
    wrong_work: '$p_2$를 낮추면 분모의 $(0.9-y)\times0.99$가 줄어든다고 보고 부등식 방향을 거꾸로 세움'
    detect_cue: 분모에 $1-p_2$ 대신 $p_2$가 들어갔다
    feedback: 신호가 잘못 켜질 확률은 $1-p_2$이므로 $p_2$를 낮추면 오히려 $p_3$이 작아지는 쪽으로 작용합니다.
    remedy: [RL-1]

