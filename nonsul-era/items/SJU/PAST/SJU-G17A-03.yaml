stimuli: []

stem: |
  아래 글을 읽고, 각 물음에 답하시오.

  그림과 같은 사면체 $\mathrm{ABCD}$에 대하여
  $$\overline{\mathrm{AB}}=8,\quad\overline{\mathrm{AC}}=6,\quad\overline{\mathrm{AD}}=3\sqrt2,$$
  $$\cos(\angle\mathrm{DAC})=\dfrac{\sqrt6}{3},\ \cos(\angle\mathrm{CAB})=\dfrac{\sqrt3}{3},\ \cos(\angle\mathrm{DAB})=\alpha$$
  이다. 점 $\mathrm{D}$에서 밑면 $\mathrm{ABC}$에 내린 수선의 발을 $\mathrm{P}$, 점 $\mathrm{P}$에서 변 $\mathrm{AB}$에 내린 수선의 발을 $\mathrm{Q}$, 점 $\mathrm{P}$에서 변 $\mathrm{AC}$에 내린 수선의 발을 $\mathrm{R}$라 하자. (단, 점 $\mathrm{P}$는 삼각형 $\mathrm{ABC}$의 내부에 있다.)
  (그림: 밑면 삼각형 ABC 위에 꼭짓점 D가 있는 사면체. D에서 밑면에 내린 수선(점선)의 발 P가 삼각형 내부에 있고, P에서 AB에 내린 수선의 발 Q와 AC에 내린 수선의 발 R에 직각 표시. 원문은 '내부'에 밑줄)

subparts:
- id: '1'
  stem: |
    삼각형 $\mathrm{ABC}$의 넓이를 구하시오.
  points: 60
  depends_on: []
  answer: {kind: value, value: '8*sqrt(6)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\sin(\angle\mathrm{CAB})=\dfrac{\sqrt6}{3}$을 구해 두 변과 끼인각 공식.
    steps:
    - {id: 1a, content: '$\tfrac12\cdot8\cdot6\cdot\tfrac{\sqrt6}{3}=8\sqrt6$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 두 변의 길이와 끼인각의 코사인을 알 때 넓이는?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.172
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\sin(\angle\mathrm{CAB})=\sqrt{1-\cos^2(\angle\mathrm{CAB})}=\sqrt{1-\dfrac13}=\dfrac{\sqrt6}{3}$ (끼인각은 $0$과 $\pi$ 사이이므로 사인은 양수).
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        삼각형 $\mathrm{ABC}$의 넓이는 $\dfrac12\cdot\overline{\mathrm{AB}}\cdot\overline{\mathrm{AC}}\sin(\angle\mathrm{CAB})=\dfrac12\cdot8\cdot6\cdot\dfrac{\sqrt6}{3}=8\sqrt6$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $\sin^2+\cos^2=1$로 $\sin(\angle\mathrm{CAB})$를 구하려 했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $\sin(\angle\mathrm{CAB})=\dfrac{\sqrt6}{3}$.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.A2
      mark_type: A
      points: 20
      evidence: |
        넓이 $8\sqrt6$을 얻었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '79', meaning: 기타 오답}
  misconceptions: []

- id: '2'
  stem: |
    선분 $\mathrm{AR}$의 길이를 구하시오.
  points: 60
  depends_on: []
  answer: {kind: value, value: '2*sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 삼수선의 정리로 $\mathrm{DR}\perp\mathrm{AC}$이므로 직각삼각형 $\mathrm{ADR}$에서 $\overline{\mathrm{AR}}=\overline{\mathrm{AD}}\cos(\angle\mathrm{DAC})$.
    steps:
    - {id: 2a, content: '$\overline{\mathrm{AR}}=3\sqrt2\cdot\tfrac{\sqrt6}{3}=2\sqrt3$', criteria: ['2.M1', '2.R1', '2.A1']}
    hint_ladder:
    - $\mathrm{DP}\perp$평면, $\mathrm{PR}\perp\mathrm{AC}$이면 $\mathrm{DR}$과 $\mathrm{AC}$는 어떤 관계인가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.172
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\overline{\mathrm{DP}}\perp$(평면 $\mathrm{ABC}$), $\overline{\mathrm{PR}}\perp\overline{\mathrm{AC}}$이므로 삼수선의 정리에 의해 $\overline{\mathrm{DR}}\perp\overline{\mathrm{AC}}$이다.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        따라서 삼각형 $\mathrm{ADR}$은 $\angle\mathrm{ARD}=90^\circ$인 직각삼각형이고 $\overline{\mathrm{AR}}=\overline{\mathrm{AD}}\cos(\angle\mathrm{DAC})=3\sqrt2\cdot\dfrac{\sqrt6}{3}=2\sqrt3$이다.
      criteria: ['2.M1', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 25
      evidence: |
        삼수선의 정리로 $\mathrm{DR}\perp\mathrm{AC}$임을 근거로 밝혔다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        직각삼각형 $\mathrm{ADR}$에서 $\overline{\mathrm{AR}}=\overline{\mathrm{AD}}\cos(\angle\mathrm{DAC})$로 놓았다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $\overline{\mathrm{AR}}=2\sqrt3$.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3155}
  misconceptions:
  - id: MC-GEO-3155
    outcome_code: '71'
    wrong_work: '$\overline{\mathrm{AR}}=\overline{\mathrm{AD}}\sin(\angle\mathrm{DAC})=\sqrt6$'
    detect_cue: 직각이 R이 아닌 다른 꼭짓점에 있다고 보고 사인을 사용
    feedback: 삼수선의 정리로 직각은 R에 있습니다. 빗변 AD에 이웃한 변 AR은 코사인으로 구합니다.
    remedy: [RL-1]

- id: '3'
  stem: |
    선분 $\mathrm{PQ}$의 길이를 $\alpha$의 식으로 나타내시오.
  points: 60
  depends_on: ['1', '2']
  answer: {kind: expression, value: '3*(sqrt(2) - alpha)', equivalents: ['3*sqrt(2) - 3*alpha'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{AQ}}=3\sqrt2\alpha$. $\mathrm{RP}$ 연장선과 $\mathrm{AB}$의 교점 $\mathrm{S}$에 대해 $\triangle\mathrm{ASR}\sim\triangle\mathrm{PSQ}$.
    steps:
    - {id: 3a, content: '$\overline{\mathrm{AS}}=6$, $\overline{\mathrm{RS}}=2\sqrt6$, $\overline{\mathrm{QS}}=6-3\sqrt2\alpha$, $\overline{\mathrm{PQ}}=\overline{\mathrm{QS}}\cdot\tfrac{2\sqrt3}{2\sqrt6}=3(\sqrt2-\alpha)$', criteria: ['3.M1', '3.M2', '3.A1', '3.A2']}
    hint_ladder:
    - (3-2)와 같은 방법으로 $\overline{\mathrm{AQ}}$를 구하자.
    - 선분 $\mathrm{RP}$를 연장해 $\mathrm{AB}$와 만나는 점을 잡아 보자. 닮은 직각삼각형이 보이는가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.172
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (3-2)와 같이 삼수선의 정리에 의해 $\overline{\mathrm{DQ}}\perp\overline{\mathrm{AB}}$이므로 $\overline{\mathrm{AQ}}=\overline{\mathrm{AD}}\cos(\angle\mathrm{DAB})=3\sqrt2\alpha$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        선분 $\mathrm{RP}$의 연장선이 $\mathrm{AB}$(또는 그 연장선)와 만나는 점을 $\mathrm{S}$라 하자. $\angle\mathrm{ARS}=90^\circ$이므로
        $\overline{\mathrm{AS}}=\dfrac{\overline{\mathrm{AR}}}{\cos(\angle\mathrm{CAB})}=\dfrac{2\sqrt3}{\sqrt3/3}=6$, $\overline{\mathrm{RS}}=\sqrt{\overline{\mathrm{AS}}^2-\overline{\mathrm{AR}}^2}=2\sqrt6$이다.
        $\overline{\mathrm{AS}}=6<8$이므로 $\mathrm{S}$는 선분 $\mathrm{AB}$ 위에 있고, $\overline{\mathrm{QS}}=\overline{\mathrm{AS}}-\overline{\mathrm{AQ}}=6-3\sqrt2\alpha$이다.
      criteria: ['3.M2', '3.A1']
    - id: 3b-3
      content: |
        $\triangle\mathrm{ASR}$와 $\triangle\mathrm{PSQ}$는 각 $\mathrm{S}$를 공유하는 직각삼각형이므로 닮음이고
        $\overline{\mathrm{PQ}}:\overline{\mathrm{QS}}=\overline{\mathrm{AR}}:\overline{\mathrm{RS}}=2\sqrt3:2\sqrt6$이다.
        따라서 $\overline{\mathrm{PQ}}=\dfrac{6-3\sqrt2\alpha}{\sqrt2}=3(\sqrt2-\alpha)$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        삼수선의 정리로 $\overline{\mathrm{AQ}}=3\sqrt2\alpha$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        보조점 $\mathrm{S}$(또는 좌표)를 도입해 $\mathrm{PQ}$를 구할 닮음(또는 동치) 관계를 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 15}
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $\overline{\mathrm{AS}}=6$, $\overline{\mathrm{RS}}=2\sqrt6$, $\overline{\mathrm{QS}}=6-3\sqrt2\alpha$를 구했다.
      depends_on: [3.M2]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        $\overline{\mathrm{PQ}}=3(\sqrt2-\alpha)$를 얻었다.
      depends_on: [3.M1, 3.A1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3155}
  misconceptions:
  - id: MC-GEO-3155
    outcome_code: '71'
    wrong_work: '$\overline{\mathrm{AQ}}=3\sqrt2\sqrt{1-\alpha^2}$로 두고 진행'
    detect_cue: $\mathrm{AQ}$에 $\sin(\angle\mathrm{DAB})$가 쓰였다
    feedback: $\mathrm{DQ}\perp\mathrm{AB}$이므로 직각은 Q에 있고 $\overline{\mathrm{AQ}}=\overline{\mathrm{AD}}\cos(\angle\mathrm{DAB})$입니다.
    remedy: [RL-1]

- id: '4'
  stem: |
    사면체 $\mathrm{ABCD}$의 부피가 $4\sqrt{15}$일 때, $\alpha$의 값을 구하시오.
  points: 60
  depends_on: ['1', '3']
  answer: {kind: value, value: '5*sqrt(2)/12', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 부피에서 $\overline{\mathrm{DP}}$, 두 번의 피타고라스로 $\overline{\mathrm{DP}}^2=9(2\sqrt2\alpha-3\alpha^2)$, 내부 조건 $\alpha>\dfrac{\sqrt2}{3}$으로 근 선택.
    steps:
    - {id: 4a, content: '$\overline{\mathrm{DP}}=\tfrac{3\sqrt{10}}{4}$, $9(2\sqrt2\alpha-3\alpha^2)=\tfrac{45}{8}\Rightarrow\alpha=\tfrac{\sqrt2}{4},\tfrac{5\sqrt2}{12}$, 내부 조건으로 $\alpha=\tfrac{5\sqrt2}{12}$', criteria: ['4.M1', '4.M2', '4.A1', '4.R1']}
    hint_ladder:
    - 부피로부터 높이 $\overline{\mathrm{DP}}$를 구하자.
    - 직각삼각형 $\mathrm{DAQ}$, $\mathrm{DPQ}$를 차례로 쓰자.
    - 두 근이 나오면 '점 P는 내부' 조건을 확인하자. $\mathrm{P}$가 $\mathrm{AC}$ 위에 오는 $\alpha$는?
  - id: S4-B
    audience: B
    source_flow: 해설교재 p.172~173
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        사면체는 밑면이 $\triangle\mathrm{ABC}$, 높이가 $\overline{\mathrm{DP}}$인 삼각뿔이므로 $V=\dfrac13\cdot8\sqrt6\cdot\overline{\mathrm{DP}}=4\sqrt{15}$에서 $\overline{\mathrm{DP}}=\dfrac{3\sqrt{10}}{4}$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        직각삼각형 $\mathrm{DAQ}$에서 $\overline{\mathrm{DQ}}^2=\overline{\mathrm{AD}}^2-\overline{\mathrm{AQ}}^2=18-18\alpha^2$,
        직각삼각형 $\mathrm{DPQ}$에서 $\overline{\mathrm{DP}}^2=\overline{\mathrm{DQ}}^2-\overline{\mathrm{PQ}}^2=18(1-\alpha^2)-9(\sqrt2-\alpha)^2=9(2\sqrt2\alpha-3\alpha^2)$이다.
      criteria: ['4.M2']
    - id: 4b-3
      content: |
        $9(2\sqrt2\alpha-3\alpha^2)=\dfrac{90}{16}$을 정리하면 $24\alpha^2-16\sqrt2\alpha+5=0$이고 근의 공식으로 $\alpha=\dfrac{\sqrt2}{4}$ 또는 $\alpha=\dfrac{5\sqrt2}{12}$이다.
      criteria: ['4.A1']
    - id: 4b-4
      content: |
        $\alpha=\dfrac{\sqrt2}{3}$이면 $\overline{\mathrm{DP}}^2=9\left(\dfrac43-\dfrac23\right)=6$이고 $\overline{\mathrm{DR}}=\overline{\mathrm{AD}}\sin(\angle\mathrm{DAC})=3\sqrt2\cdot\dfrac{\sqrt3}{3}=\sqrt6$이므로 $\overline{\mathrm{DP}}=\overline{\mathrm{DR}}$, 즉 $\mathrm{P}=\mathrm{R}$로 $\mathrm{P}$가 변 $\mathrm{AC}$ 위에 놓인다.
        $\alpha$가 커질수록 $\overline{\mathrm{AQ}}$가 커져 $\mathrm{P}$는 $\mathrm{AC}$에서 삼각형 안쪽으로 이동하므로, 내부 조건은 $\alpha>\dfrac{\sqrt2}{3}$이다. 따라서 $\alpha=\dfrac{5\sqrt2}{12}$이다.
      criteria: ['4.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 15
      evidence: |
        부피 식에서 $\overline{\mathrm{DP}}=\dfrac{3\sqrt{10}}{4}$를 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 15}
      steps: [4b-1]
    - id: 4.M2
      mark_type: M
