intent: |
  삼수선의 정리로 공간의 수선을 평면 위 수선으로 옮기고, 닮음과 피타고라스 정리로 사면체의 높이를 $\alpha$의 식으로 나타낸 뒤, 부피 조건과 '수선의 발이 삼각형 내부' 조건으로 해를 고르는 능력을 본다.
key_idea: |
  $\mathrm{DP}\perp$평면 $\mathrm{ABC}$, $\mathrm{PR}\perp\mathrm{AC}$이면 $\mathrm{DR}\perp\mathrm{AC}$(삼수선)이므로 $\overline{\mathrm{AR}}=\overline{\mathrm{AD}}\cos(\angle\mathrm{DAC})$, $\overline{\mathrm{AQ}}=\overline{\mathrm{AD}}\cos(\angle\mathrm{DAB})$이다.
stuck: |
  직선 $\mathrm{RP}$를 연장해 $\mathrm{AB}$와 만나는 점 $\mathrm{S}$를 잡아 닮은 직각삼각형 $\triangle\mathrm{ASR}\sim\triangle\mathrm{PSQ}$를 만드는 보조선, 그리고 두 근 중 '내부' 조건으로 하나를 고르는 판정
