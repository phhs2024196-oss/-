stimuli: []

stem: |
  아래 글을 읽고, 각 물음에 답하시오.

  좌표평면에 원 $C_1$과 $C_2$가 있다. 시각 $t$에서 $C_1$과 $C_2$의 반지름은 각각 $r_1(t)>0$, $r_2(t)=\dfrac{1}{t^2+1}$이다. 원 $C_1$의 중심 $\mathrm{O_1}$의 좌표는 $(0,r_1(t))$이고, 원 $C_2$의 중심 $\mathrm{O_2}$는 제1사분면에 있다. 원 $C_2$는 원 $C_1$에 외접하고 $x$축에 접한다. 함수 $r_1(t)$는 $t\ge0$에서 연속이며, $t>0$에서 미분가능하고 다음을 만족시킨다.
  $$\{r_1(t)\}^2=\int_0^t\left(x-\dfrac13\right)r_1(x)\,dx+\int_0^1r_1(x)\,dx\quad(t\ge0)$$
  (그림: 원점 O에서 $x$축에 접하고 중심 $\mathrm{O_1}$이 $y$축 위에 있는 큰 원 $C_1$과, 그 오른쪽에서 $C_1$에 외접하고 $x$축에 접하는 작은 원 $C_2$(중심 $\mathrm{O_2}$). 두 원의 접점 P를 지나는 공통접선 $\ell$이 $x$축과 점 Q에서 만남)

subparts:
- id: '1'
  stem: |
    시각 $t=2$에서 원 $C_1$의 중심 $\mathrm{O_1}$의 속력을 구하시오.
  points: 60
  depends_on: []
  answer: {kind: value, value: '5/6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 관계식을 $t$로 미분해 $r_1>0$으로 나누면 $r_1'(t)=\dfrac t2-\dfrac16$이고, $\mathrm{O_1}$은 $y$축 위를 움직이므로 속력은 $\lvert r_1'(2)\rvert$.
    steps:
    - {id: 1a, content: '$2r_1r_1^{\prime}=\left(t-\tfrac13\right)r_1\Rightarrow r_1^{\prime}(2)=\tfrac56$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 위끝이 $t$인 정적분을 $t$로 미분하면?
    - $\mathrm{O_1}$의 좌표 중 시간에 따라 변하는 것은?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.174
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 관계식의 양변을 $t$에 대하여 미분하면 $2r_1(t)r_1'(t)=\left(t-\dfrac13\right)r_1(t)$이다(두 번째 적분은 상수).
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $r_1(t)>0$이므로 양변을 $2r_1(t)$로 나누면 $r_1'(t)=\dfrac12t-\dfrac16$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\mathrm{O_1}(0,r_1(t))$은 $y$축 위를 움직이므로 속력은 $\lvert r_1'(t)\rvert$이고, $t=2$에서 $\lvert r_1'(2)\rvert=\dfrac56$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        관계식의 양변을 미분해 $2r_1r_1'=\left(t-\dfrac13\right)r_1$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $r_1>0$을 근거로 나누어 $r_1'(t)=\dfrac t2-\dfrac16$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        속력 $\dfrac56$을 답했다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3161}
  misconceptions:
  - id: MC-CAL-3161
    outcome_code: '71'
    wrong_work: '$\tfrac{d}{dt}\int_0^1r_1(x)dx=r_1(1)$ 등 상수 적분까지 미분하거나, 우변 미분을 $\left(x-\tfrac13\right)r_1(x)$로 남김'
    detect_cue: 미분 결과에 $x$가 남아 있거나 $r_1(1)$ 항이 있다
    feedback: 위끝이 $t$인 적분만 $t$로 미분되어 피적분함수에 $x=t$를 넣은 값이 되고, 상수 구간 적분은 상수입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    시각 $t=2$에서 원 $C_1$의 반지름 $r_1(2)$를 구하시오.
  points: 60
  depends_on: ['1']
  answer: {kind: value, value: '5/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $r_1(t)=\dfrac14t^2-\dfrac16t+k$에서 $t=0$을 대입하면 $k^2=\int_0^1r_1=k$.
    steps:
    - {id: 2a, content: '$k^2=\int_0^1\left(\tfrac14x^2-\tfrac16x+k\right)dx=k$, $k>0\Rightarrow k=1$, $r_1(2)=\tfrac53$', criteria: ['2.M1', '2.M2', '2.A1', '2.A2']}
    hint_ladder:
    - (1-1)의 $r_1'(t)$를 적분하면 상수 하나가 남는다.
    - 관계식에 $t=0$을 넣어 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.174
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $r_1'(t)=\dfrac12t-\dfrac16$에서 $r_1(t)=\dfrac14t^2-\dfrac16t+k$이고, $t\ge0$에서 연속이므로 $k=r_1(0)>0$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        관계식에 $t=0$을 대입하면 $\{r_1(0)\}^2=\displaystyle\int_0^1r_1(x)\,dx$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $\displaystyle\int_0^1\left(\dfrac14x^2-\dfrac16x+k\right)dx=\dfrac1{12}-\dfrac1{12}+k=k$이므로 $k^2=k$이고, $k>0$이므로 $k=1$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        $r_1(t)=\dfrac14t^2-\dfrac16t+1$이므로 $r_1(2)=1-\dfrac13+1=\dfrac53$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        $r_1'$을 적분해 $r_1(t)=\dfrac14t^2-\dfrac16t+k$로 놓았다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 15}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        $t=0$을 대입해 $\{r_1(0)\}^2=\int_0^1r_1(x)dx$를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        $k^2=k$와 $k>0$에서 $k=1$을 얻었다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 15
      evidence: |
        $r_1(2)=\dfrac53$.
      depends_on: [2.M1, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3157}
  misconceptions:
  - id: MC-CAL-3157
    outcome_code: '71'
    wrong_work: '$r_1(t)=\tfrac14t^2-\tfrac16t+C$에서 $C$를 정하지 못하거나 $C=0$으로 둠'
    detect_cue: $t=0$ 대입식이 없다
    feedback: 관계식에 $t=0$을 넣으면 첫 번째 적분이 사라져 상수를 정하는 식이 나옵니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    원 $C_1$과 $C_2$의 접점을 $\mathrm{P}$라 하고, 점 $\mathrm{P}$를 지나면서 두 원에 동시에 접하는 직선을 $\ell$이라 하고, 직선 $\ell$이 $x$축과 만나는 점을 $\mathrm{Q}$라 하자.
    시각 $t=2$에서 점 $\mathrm{P}$의 좌표, 점 $\mathrm{Q}$의 좌표, 점 $\mathrm{Q}$의 속력을 각각 구하시오.
  points: 60
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'P = (25*sqrt(3)/42, 5/14); Q = (sqrt(3)/3, 0); speed = sqrt(3)/20', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{O_2}=(2\sqrt{r_1r_2},r_2)$, P는 $\mathrm{O_1O_2}$를 $r_1:r_2$로 내분, Q의 $x$좌표는 $q(t)=\sqrt{r_1(t)r_2(t)}$.
    steps:
    - {id: 3a, content: '$\mathrm{P}=\left(\tfrac{2r_1\sqrt{r_1r_2}}{r_1+r_2},\tfrac{2r_1r_2}{r_1+r_2}\right)$, $q=\sqrt{r_1r_2}$, $q^{\prime}(2)=-\tfrac{\sqrt3}{20}$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2', '3.A3']}
    hint_ladder:
    - 외접하는 두 원의 중심 사이 거리는 $r_1+r_2$이다. 수평 거리는?
    - 접점은 중심을 잇는 선분 위에 있다.
    - 접선은 $\mathrm{O_1P}$에 수직이다. $x$절편을 $r_1$, $r_2$로 정리해 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.174~175
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\overline{\mathrm{O_1O_2}}=r_1+r_2$이고 두 중심의 $y$좌표 차가 $r_1-r_2$이므로
        $\mathrm{O_2}=\left(\sqrt{(r_1+r_2)^2-(r_1-r_2)^2},\,r_2\right)=(2\sqrt{r_1r_2},\,r_2)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        접점 P는 선분 $\mathrm{O_1O_2}$를 $r_1:r_2$로 내분하므로
        $\mathrm{P}\left(\dfrac{2r_1\sqrt{r_1r_2}}{r_1+r_2},\,\dfrac{2r_1r_2}{r_1+r_2}\right)$이다. $r_1(2)=\dfrac53$, $r_2(2)=\dfrac15$을 대입하면 $\mathrm{P}\left(\dfrac{25\sqrt3}{42},\,\dfrac{5}{14}\right)$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $\mathrm{P}(a,b)$라 하면 $C_1:x^2+(y-r_1)^2=r_1^2$ 위의 점 P에서의 접선은 $\ell:ax+(b-r_1)(y-r_1)=r_1^2$이다.
        $\mathrm{Q}(q,0)$을 대입하면 $aq-(b-r_1)r_1=r_1^2$, 즉 $q=\dfrac{b}{a}r_1=\sqrt{r_1r_2}$이다. $t=2$에서 $\mathrm{Q}\left(\dfrac{\sqrt3}{3},0\right)$.
      criteria: ['3.M2', '3.A2']
    - id: 3b-4
      content: |
        $q'(t)=\dfrac{r_1'(t)r_2(t)+r_1(t)r_2'(t)}{2\sqrt{r_1(t)r_2(t)}}$이고 $r_1(2)=\dfrac53$, $r_2(2)=\dfrac15$, $r_1'(2)=\dfrac56$, $r_2'(2)=-\dfrac{2t}{(t^2+1)^2}\Big|_{t=2}=-\dfrac{4}{25}$이므로
        $q'(2)=\dfrac{\frac16-\frac4{15}}{2/\sqrt3}=-\dfrac{\sqrt3}{20}$. 점 Q의 속력은 $\lvert q'(2)\rvert=\dfrac{\sqrt3}{20}$이다.
      criteria: ['3.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        외접·$x$축 접함 조건으로 $\mathrm{O_2}=(2\sqrt{r_1r_2},r_2)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        내분점으로 $\mathrm{P}\left(\dfrac{25\sqrt3}{42},\dfrac5{14}\right)$를 구했다.
      depends_on: [3.M1]
      ft: {allowed: true, from: [2.A2], max_points: 15}
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 10
      evidence: |
        P에서의 접선(또는 $\mathrm{O_1P}$에 수직인 직선)으로 Q의 $x$좌표를 $t$의 함수로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 10
      evidence: |
        $\mathrm{Q}\left(\dfrac{\sqrt3}{3},0\right)$.
      depends_on: [3.M2]
      steps: [3b-3]
    - id: 3.A3
      mark_type: A
      points: 10
      evidence: |
        $q'(2)$를 계산해 속력 $\dfrac{\sqrt3}{20}$(양수)을 답했다.
      depends_on: [3.M2, 3.A2]
      ft: {allowed: true, from: [1.A1, 2.A2], max_points: 10}
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3158}
  misconceptions:
