intent: |
  정적분을 포함한 관계식을 미분해 반지름 함수 $r_1(t)$를 결정하고, 외접하는 두 원의 접점과 공통 내접선의 $x$절편을 시간의 함수로 나타내 그 속력을 구하는 능력을 본다.
key_idea: |
  관계식을 미분하면 $2r_1r_1'=\left(t-\dfrac13\right)r_1$이므로 $r_1'(t)=\dfrac t2-\dfrac16$이고, $t=0$ 대입으로 적분상수를 정한다. 접선의 $x$절편은 $q(t)=\sqrt{r_1(t)r_2(t)}$로 정리된다.
stuck: |
  $t=0$을 대입한 $\{r_1(0)\}^2=\int_0^1r_1(x)\,dx$로 적분상수 $k$를 결정하는 것, 그리고 접점 P에서 $C_1$의 접선 식으로부터 $x$절편을 $\sqrt{r_1r_2}$로 간단히 하는 계산
