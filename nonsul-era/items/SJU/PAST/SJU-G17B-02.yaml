  공간좌표에서 평면에 내린 수선의 발을 구하고, 평면 위 원 바깥 영역과의 최단거리를 피타고라스 정리로 환원하며, 평면과 평행한 직선의 정사영이 주어진 영역에 속함을 거리 비교로 증명하는 능력을 본다.
key_idea: |
  $\overline{\mathrm{AQ}}^2=\overline{\mathrm{AH}}^2+\overline{\mathrm{HQ}}^2$이므로 $\overline{\mathrm{HQ}}$의 최솟값 문제로 바뀌고, $\ell\parallel\alpha$이므로 $\mathrm{B}$에서 $\ell'$까지 거리는 $\sqrt{d(\mathrm{B},\ell)^2-1^2}$이다.
