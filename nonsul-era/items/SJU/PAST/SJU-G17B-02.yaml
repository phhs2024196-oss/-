stimuli: []

stem: |
  아래 글을 읽고, 각 물음에 답하시오.

  좌표공간에 점 $\mathrm{A}(4,4,3)$, 직선 $\ell:\dfrac{x-2}{2}=\dfrac{y+1}{2}=\dfrac{z-6}{-3}$, 평면 $\alpha:x+2y+2z=9$, $\alpha$ 위의 점 $\mathrm{B}\left(2,\dfrac32,2\right)$가 있다. 평면 $\alpha$ 위의 점 중에서 점 $\mathrm{B}$로부터 거리가 $2$ 이상인 점의 집합을 $S$라 하자.
  (그림: 평면 $\alpha$ 위에 점 B와, 점 A에서 $\alpha$에 내린 수선의 발 H(점선)가 있고, $\alpha$ 위쪽의 직선 $\ell$과 그 정사영 $\ell^{\prime}$이 점선으로 연결되어 나란히 그려져 있음)

subparts:
- id: '1'
  stem: |
    점 $\mathrm{A}$에서 평면 $\alpha$에 내린 수선의 발을 $\mathrm{H}$라 할 때, $\mathrm{H}$의 좌표를 구하시오.
  points: 60
  depends_on: []
  answer: {kind: expression, value: '(3, 2, 1)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: A를 지나고 법선벡터 $(1,2,2)$ 방향인 직선과 $\alpha$의 교점.
    steps:
    - {id: 1a, content: '$(4+t)+2(4+2t)+2(3+2t)=9\Rightarrow t=-1$, $\mathrm{H}(3,2,1)$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 평면에 수직인 방향은 무엇인가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.176
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $(1,2,2)$는 평면 $\alpha$의 법선벡터이므로 직선 $\mathrm{AH}$는 $x=4+t$, $y=4+2t$, $z=3+2t$로 나타낼 수 있다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        H는 이 직선과 $\alpha$의 교점이므로 $(4+t)+2(4+2t)+2(3+2t)=9$, $9t+18=9$, $t=-1$이다. 따라서 $\mathrm{H}(3,2,1)$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: |
        A를 지나고 법선벡터 방향인 직선의 매개변수 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 30
      evidence: |
        $\mathrm{H}(3,2,1)$.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3159}
  misconceptions:
  - id: MC-GEO-3159
    outcome_code: '71'
    wrong_work: '$t=-\tfrac13$(거리 $\tfrac{9}{3}$를 매개변수로 착각) 등으로 $\mathrm{H}$를 잘못 구함'
    detect_cue: 구한 H가 평면 방정식을 만족하지 않는다
    feedback: 직선의 매개변수 식을 평면 방정식에 대입해 $t$를 구하고, 결과를 평면 식에 넣어 확인하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    집합 $S$에 속하는 점 $\mathrm{Q}$에 대하여, 선분 $\mathrm{AQ}$의 길이의 최솟값을 구하시오.
  points: 60
  depends_on: ['1']
  answer: {kind: value, value: 'sqrt(37)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{AQ}}^2=9+\overline{\mathrm{HQ}}^2$, $\overline{\mathrm{HB}}=\dfrac32<2$이므로 $\overline{\mathrm{HQ}}\ge2-\dfrac32$.
    steps:
    - {id: 2a, content: '$\overline{\mathrm{AQ}}^2\ge9+\tfrac14=\tfrac{37}{4}$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $\overline{\mathrm{AH}}$는 고정이다. 평면 위에서 $\overline{\mathrm{HQ}}$를 최소로 하자.
    - H는 B 중심 반지름 2인 원의 안쪽인가 바깥쪽인가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.176
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        Q는 평면 $\alpha$ 위에 있으므로 $\overline{\mathrm{AQ}}^2=\overline{\mathrm{AH}}^2+\overline{\mathrm{HQ}}^2$이고, $\overline{\mathrm{AH}}=\sqrt{1+4+4}=3$이므로 $\overline{\mathrm{AQ}}^2=9+\overline{\mathrm{HQ}}^2$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\overline{\mathrm{HB}}=\sqrt{1+\dfrac14+1}=\dfrac32<2$이므로 H는 B를 중심으로 하고 반지름이 2인 원의 내부에 있다. $S$의 점 Q에 대해 $\overline{\mathrm{HQ}}\ge\overline{\mathrm{BQ}}-\overline{\mathrm{HB}}\ge2-\dfrac32=\dfrac12$이고, 직선 $\mathrm{BH}$가 그 원과 만나는 점 중 H 쪽 점을 Q로 잡으면 등호가 성립한다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        따라서 $\overline{\mathrm{AQ}}^2$의 최솟값은 $9+\left(\dfrac12\right)^2=\dfrac{37}{4}$이고, $\overline{\mathrm{AQ}}$의 최솟값은 $\dfrac{\sqrt{37}}{2}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $\overline{\mathrm{AQ}}^2=\overline{\mathrm{AH}}^2+\overline{\mathrm{HQ}}^2$와 $\overline{\mathrm{AH}}=3$을 썼다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 20}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 20
      evidence: |
        $\overline{\mathrm{HB}}=\dfrac32$을 구하고 $\overline{\mathrm{HQ}}$의 최솟값 $\dfrac12$을 근거와 함께 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        최솟값 $\dfrac{\sqrt{37}}{2}$.
      depends_on: [2.M1, 2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '79', meaning: '기타 오답(예: $\overline{\mathrm{HQ}}$ 최소를 $2+\tfrac32$로 둠)'}
  misconceptions: []

- id: '3'
  stem: |
    직선 $\ell$의 평면 $\alpha$ 위로의 정사영을 $\ell'$이라 할 때, $\ell'$은 집합 $S$에 속함을 보이시오.
  points: 60
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\ell\parallel\alpha$이고 그 거리는 1. $d(\mathrm{B},\ell)=\dfrac{\sqrt{21}}{2}$이면 $d(\mathrm{B},\ell')=\sqrt{\dfrac{21}{4}-1}=\dfrac{\sqrt{17}}{2}>2$.
    steps:
    - {id: 3a, content: '$d^2=(2t)^2+\left(2t-\tfrac52\right)^2+(-3t+4)^2$ 최소 $\tfrac{21}{4}$, $(2,2,-3)\cdot(1,2,2)=0$, 거리 1 ⇒ $\tfrac{\sqrt{17}}{2}>2$', criteria: ['3.M1', '3.A1', '3.R1', '3.R2']}
    hint_ladder:
    - $\ell$의 방향벡터와 $\alpha$의 법선벡터의 내적은?
    - $\ell$ 위 점과 그 정사영 사이의 거리는 일정한가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.176
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        직선 $\ell$ 위의 점은 $(2t+2,\,2t-1,\,-3t+6)$이고, 점 B와의 거리를 $d$라 하면
        $d^2=(2t)^2+\left(2t-\dfrac52\right)^2+(-3t+4)^2=17t^2-34t+\dfrac{89}{4}=17(t-1)^2+\dfrac{21}{4}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        따라서 $d^2$은 $t=1$일 때 최솟값 $\dfrac{21}{4}$을 가지며, 점 B와 직선 $\ell$ 사이의 거리는 $\dfrac{\sqrt{21}}{2}$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $\ell$의 방향벡터 $(2,2,-3)$과 $\alpha$의 법선벡터 $(1,2,2)$에 대해 $(2,2,-3)\cdot(1,2,2)=0$이고 $\ell$ 위의 점 $(2,-1,6)$은 $\alpha$ 위에 있지 않으므로 $\ell\parallel\alpha$이다. 직선 $\ell$과 평면 $\alpha$ 사이의 거리는 $\dfrac{\lvert2-2+12-9\rvert}{3}=1$이다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $\ell$ 위의 점 T와 그 정사영 $\mathrm{T}'$에 대해 $\overline{\mathrm{TT'}}=1$, $\mathrm{TT'}\perp\alpha$이므로 피타고라스 정리에 의해 $\overline{\mathrm{BT'}}^2=\overline{\mathrm{BT}}^2-1$이다. 점 B와 $\ell$의 최단 거리가 되는 $\ell$ 위의 점을 $\mathrm{T_1}$이라 하면 그 정사영 $\mathrm{T_2}$가 B와 $\ell'$의 최단 거리를 주고,
        점 B와 $\ell'$ 사이의 거리는 $\sqrt{\dfrac{21}{4}-1}=\dfrac{\sqrt{17}}{2}>2$이다. 따라서 $\ell'$ 위의 모든 점은 B로부터 거리가 2 이상이므로 $\ell'$은 집합 $S$에 속한다. ■
      criteria: ['3.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        $\ell$ 위의 점을 매개변수로 놓고 B까지 거리의 제곱을 $t$의 이차식으로 세웠다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        B와 $\ell$ 사이의 거리 $\dfrac{\sqrt{21}}{2}$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
      points: 15
      evidence: |
        내적 0으로 $\ell\parallel\alpha$를 보이고 $\ell$과 $\alpha$ 사이 거리 1을 구했다.
      depends_on: []
      steps: [3b-3]
    - id: 3.R2
      mark_type: R
      points: 15
      evidence: |
        피타고라스 정리로 B와 $\ell'$ 사이 거리 $\dfrac{\sqrt{17}}{2}>2$를 보이고 $\ell'\subset S$로 결론지었다.
      depends_on: [3.A1, 3.R1]
      steps: [3b-4]
    deductions:
    - code: D3-1
      condition: B와 $\ell$의 거리($\tfrac{\sqrt{21}}{2}>2$)만 보이고 정사영 $\ell'$과의 거리로 옮기지 않음
      effect: cap
      value: 30
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3156}
  misconceptions:
  - id: MC-GEO-3156
    outcome_code: '71'
    wrong_work: '$\ell$과 $\ell^{\prime}$이 같은 거리 성질을 가진다고 보고 $d(\mathrm{B},\ell)=\tfrac{\sqrt{21}}{2}>2$로 결론'
    detect_cue: 정사영 후 거리가 줄어드는 것을 반영하지 않았다
    feedback: 정사영하면 B까지의 거리는 줄어듭니다. 높이 1을 빼는 피타고라스 관계로 $\ell^{\prime}$까지의 거리를 구하세요.
    remedy: [RL-2]

