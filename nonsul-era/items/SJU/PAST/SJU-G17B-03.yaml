intent: |
  산술·기하평균(완전제곱) 부등식을 피적분함수에 적용해 정적분의 상계를 얻고, 등호가 성립하는 함수를 실제로 구성해 최댓값임을 확인하는 능력을 본다. 마지막은 $12hh'$의 적분을 치환적분으로 $h(k)$에 연결한다.
key_idea: |
  $2ab\le a^2+b^2$을 $a=g(x)$, $b=\sqrt{x^3+1}$ 또는 $a=3h$, $b=2h'$에 적용해 적분하고, 등호 조건 $a=b$를 만족하는 함수가 조건을 만족함을 보인다.
stuck: |
  (3-4)에서 $9h^2+4h'^2\ge12hh'$로 묶고 $\int_0^k12hh'\,dx=6\{h(k)^2-h(0)^2\}$로 바꾸는 발상, 그리고 등호 조건 $h'=\dfrac32h$에서 $h=2e^{\frac32x}$를 구성하는 것
