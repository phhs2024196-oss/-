stimuli: []
stem: |
  어떤 버스정류장에서 A대학교로 가는 B버스가 있다. 날씨가 맑을 때, 버스정류장에서 B버스를 기다리는 시간의 확률밀도함수 $f(x)$는 다음과 같다. (단, 시간의 단위는 분이다.)
  $$f(x)=\dfrac1{30}\quad(0\le x\le30)$$
  한편 날씨가 맑지 않을 때, 버스정류장에서 B버스를 기다리는 시간의 확률밀도함수 $g(x)$는 다음과 같다.
  $$g(x)=\dfrac1{60}\quad(0\le x\le60)$$
  일기예보에 의하면 날씨가 맑을 확률이 0.8, 맑지 않을 확률이 0.2이다. 수업에 지각하지 않기 위해서는 날씨에 관계없이 늦어도 오전 8시 15분에 버스를 타야한다.
subparts:
- id: '1'
  stem: |
    어떤 학생이 오전 8시에 버스정류장에 도착한다고 가정하자. 이 학생이 지각하지 않을 확률을 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: 9/20
    equivalents:
    - '0.45'
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '전확률: $\mathrm{P}(O)=\mathrm{P}(G)\mathrm{P}(O\mid G)+\mathrm{P}(G^c)\mathrm{P}(O\mid G^c)$, 대기시간 15분 이하.'
    steps:
    - id: 1a
      content: $0.8\times0.5+0.2\times0.25=0.45$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - 날씨별로 지각하지 않을 확률을 먼저 구하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.156
    steps:
    - id: 1b-1
      content: |
        지각하지 않을 사건을 $O$, 날씨가 맑을 사건을 $G$라 하면 $\mathrm{P}(G)=0.8$, $\mathrm{P}(G^c)=0.2$이다. 8시에 도착하면 기다리는 시간이 15분 이하여야 하므로
        $\mathrm{P}(O\mid G)=\displaystyle\int_0^{15}\dfrac1{30}\,dx=0.5$, $\mathrm{P}(O\mid G^c)=\displaystyle\int_0^{15}\dfrac1{60}\,dx=0.25$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $G$와 $G^c$는 서로 배반이고 합집합이 표본공간이므로 $O=(O\cap G)\cup(O\cap G^c)$이고 덧셈정리에 의해 $\mathrm{P}(O)=\mathrm{P}(O\cap G)+\mathrm{P}(O\cap G^c)$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        곱셈정리로 $\mathrm{P}(O)=\mathrm{P}(G)\mathrm{P}(O\mid G)+\mathrm{P}(G^c)\mathrm{P}(O\mid G^c)=0.8\times0.5+0.2\times0.25=0.45$이다.
      criteria:
      - 1.M2
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        확률밀도함수를 $[0,15]$에서 적분해 두 조건부확률 $0.5$, $0.25$를 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 20
      evidence: |
        $G$, $G^c$로 나눈 전확률 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-2
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $0.45$를 얻었다.
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-3
    deductions: []
