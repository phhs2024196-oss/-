  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 8시 15분까지 남은 시간 $y$분이면 $\mathrm{P}(O)=0.8\tfrac y{30}+0.2\tfrac y{60}=\tfrac{3y}{100}$.
    steps:
    - id: 3a
      content: $y\ge20$ ⇒ 오전 7시 55분
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
    hint_ladder:
    - 8시 15분까지 남은 시간을 변수로 두자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.156~157
    steps:
    - id: 3b-1
      content: |
        도착 시각부터 8시 15분까지의 시간을 $y$분이라 하면 기다리는 시간이 $y$ 이하일 때 지각하지 않으므로 $\mathrm{P}(O\mid G)=\displaystyle\int_0^y\dfrac1{30}\,dx=\dfrac y{30}$, $\mathrm{P}(O\mid G^c)=\dfrac y{60}$ $(0\le y\le30)$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        (1)과 같은 방법으로 $\mathrm{P}(O)=0.8\times\dfrac y{30}+0.2\times\dfrac y{60}=\dfrac3{100}y$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $\dfrac3{100}y\ge0.6$에서 $y\ge20$이므로 늦어도 8시 15분의 20분 전인 오전 7시 55분에 도착해야 한다.
      criteria:
      - 3.A1
