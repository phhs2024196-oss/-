    method_no: 1
    key_idea: $\mathrm{P}(G\mid O)=\tfrac{\mathrm{P}(G)\mathrm{P}(O\mid G)}{\mathrm{P}(O)}$.
    steps:
    - id: 2a
      content: $\tfrac{0.4}{0.45}=\tfrac89$
      criteria:
      - 2.M1
      - 2.A1
    hint_ladder:
    - 조건이 되는 사건은 무엇인가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.156
    steps:
    - id: 2b-1
      content: |
        조건부확률의 정의에 의해 $\mathrm{P}(G\mid O)=\dfrac{\mathrm{P}(G\cap O)}{\mathrm{P}(O)}$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\mathrm{P}(G\cap O)=\mathrm{P}(G)\mathrm{P}(O\mid G)=0.4$이고 (1)에서 $\mathrm{P}(O)=0.45$이므로 $\mathrm{P}(G\mid O)=\dfrac{0.4}{0.45}=\dfrac89$이다.
      criteria:
      - 2.A1
  rubric:
