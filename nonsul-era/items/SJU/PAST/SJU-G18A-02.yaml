- id: '3'
  stem: |
    $\lvert\overrightarrow{\mathrm{AP}}\rvert$가 최대가 되는 점 P의 $x$좌표의 값을 구하시오.
  points: 60
  depends_on:
  - '1'
  - '2'
  answer:
    kind: value
    value: (10-sqrt(10))/6
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{AP}^2=6+\mathrm{HP}^2$ ⇒ 원판(중심 $\mathrm{P_2}$, 반지름 $\tfrac{5\sqrt3}3$)에서 $\mathrm{H}$와 가장 먼 점.
    steps:
    - id: 3a
      content: $\overrightarrow{\mathrm{OP_3}}=\overrightarrow{\mathrm{OP_2}}+\tfrac{\sqrt{10}}2\overrightarrow{\mathrm{HP_2}}$, $x=\tfrac53-\tfrac{\sqrt{10}}6$
      criteria:
      - 3.M1
      - 3.M2
      - 3.R1
      - 3.A1
    hint_ladder:
    - $\overline{\mathrm{AP}}^2$을 $\overline{\mathrm{HP}}$로 나타내자.
    - 원판 위에서 $\mathrm{H}$와 가장 먼 점은?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.158
    steps:
    - id: 3b-1
      content: |
        (1)에서 $\overline{\mathrm{AP}}^2=6+\overline{\mathrm{HP}}^2$이므로 $\overline{\mathrm{HP}}$가 최대일 때 $\overline{\mathrm{AP}}$가 최대이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\mathrm{P}$가 움직이는 영역은 평면 위의 원판으로 중심은 $\mathrm{P_2}$, 반지름은 $\sqrt{25-\overline{\mathrm{OP_2}}^2}=\sqrt{25-\dfrac{50}3}=\dfrac5{\sqrt3}=\dfrac{5\sqrt3}3$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $\mathrm{H}$에서 가장 먼 원판 위의 점은 $\mathrm{H}$와 $\mathrm{P_2}$를 지나는 직선이 원과 만나는 점 중 $\mathrm{P_2}$ 너머의 점 $\mathrm{P_3}$이다. $\overrightarrow{\mathrm{HP_2}}=\left(-\dfrac13,\dfrac53,-\dfrac23\right)$의 크기가 $\dfrac{\sqrt{30}}3$이므로 $\overrightarrow{\mathrm{P_2P_3}}=\dfrac{5\sqrt3/3}{\sqrt{30}/3}\overrightarrow{\mathrm{HP_2}}=\dfrac{\sqrt{10}}2\overrightarrow{\mathrm{HP_2}}$이다.
      criteria:
      - 3.R1
    - id: 3b-4
      content: |
        $\overrightarrow{\mathrm{OP_3}}=\overrightarrow{\mathrm{OP_2}}+\dfrac{\sqrt{10}}2\overrightarrow{\mathrm{HP_2}}$이므로 $x$좌표는 $\dfrac53-\dfrac{\sqrt{10}}6=\dfrac{10-\sqrt{10}}6$이다.
      criteria:
      - 3.A1
