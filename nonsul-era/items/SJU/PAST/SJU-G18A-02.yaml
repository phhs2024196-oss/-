stem: |
  좌표공간에 원점 $\mathrm{O}(0,0,0)$과 점 $\mathrm{A}(1,-1,2)$가 있다. 점 $\mathrm{P}$는 아래의 조건을 만족시킨다.

  (가) 점 $\mathrm{P}$에서 직선 $x-1=y+1=\dfrac{z-2}2$에 내린 수선의 발 $\mathrm{H}$는 $(2,0,4)$이다.

  (나) $\lvert\overrightarrow{\mathrm{OP}}\rvert\le5$이고 $\lvert\overrightarrow{\mathrm{HP}}\rvert\ge1$이다.
subparts:
- id: '1'
  stem: |
    A와 P 사이의 거리의 최솟값을 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: sqrt(7)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}$는 $\mathrm{H}$를 지나고 직선에 수직인 평면 위, $\mathrm{AH}\perp$ 평면 ⇒ $\mathrm{AP}^2=6+\mathrm{HP}^2\ge7$.
    steps:
    - id: 1a
      content: $\sqrt7$
      criteria:
      - 1.M1
      - 1.R1
      - 1.A1
    hint_ladder:
    - $\mathrm{P}$는 어떤 평면 위에 있는가?
    - $\mathrm{A}$는 직선 위의 점이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.158
    steps:
    - id: 1b-1
      content: |
        주어진 직선을 $l$이라 하자. (가)에서 $\mathrm{P}$는 $\mathrm{H}(2,0,4)$를 지나고 $l$에 수직인 평면 $x+y+2z=10$ 위에 있고, (나)에서 원점 중심 반지름 5인 구의 내부(경계 포함)에 있으면서 $\mathrm{H}$로부터 거리가 1 이상이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\mathrm{A}(1,-1,2)$는 $l$ 위의 점이므로 $\mathrm{AH}\perp\mathrm{HP}$이고 $\overline{\mathrm{AH}}=\sqrt6$이다. 피타고라스 정리에 의해 $\overline{\mathrm{AP}}^2=6+\overline{\mathrm{HP}}^2\ge6+1$이다.
      criteria:
      - 1.R1
    - id: 1b-3
      content: |
        $\overline{\mathrm{HP}}=1$인 점 $\mathrm{P_1}$은 (나)를 만족하므로 최솟값은 $\sqrt7$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $\mathrm{P}$가 놓인 평면 $x+y+2z=10$과 영역 조건을 해석했다.
