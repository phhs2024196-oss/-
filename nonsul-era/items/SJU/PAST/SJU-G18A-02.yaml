- id: '2'
  stem: |
    $\lvert\overrightarrow{\mathrm{OP}}\rvert$가 최소가 되는 점 P의 좌표를 구하시오.
  points: 60
  depends_on:
  - '1'
  answer:
    kind: value
    value: (5/3, 5/3, 10/3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 원점에서 평면에 내린 수선의 발 $\mathrm{P_2}$가 조건을 만족.
    steps:
    - id: 2a
      content: $\overrightarrow{\mathrm{OP_2}}=\tfrac{10}6(1,1,2)$
      criteria:
      - 2.M1
      - 2.A1
      - 2.R1
    hint_ladder:
    - 평면 위에서 원점에 가장 가까운 점은?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.158
    steps:
    - id: 2b-1
      content: |
        평면 $x+y+2z-10=0$과 원점 사이의 거리는 $\dfrac{10}{\sqrt6}=\dfrac{5\sqrt6}3<5$이고, 원점에서 평면에 내린 수선의 발을 $\mathrm{P_2}$라 하면 $(1,1,2)$가 법선벡터이므로 $\overrightarrow{\mathrm{OP_2}}=\dfrac{5\sqrt6}3\cdot\dfrac{(1,1,2)}{\sqrt6}=\left(\dfrac53,\dfrac53,\dfrac{10}3\right)$이다.
      criteria:
      - 2.M1
      - 2.A1
    - id: 2b-2
      content: |
        $\overrightarrow{\mathrm{HP_2}}=\left(-\dfrac13,\dfrac53,-\dfrac23\right)$, $\lvert\overrightarrow{\mathrm{HP_2}}\rvert=\dfrac{\sqrt{30}}3\ge1$이므로 $\mathrm{P_2}$는 (나)를 만족하고, 평면 위의 점 중 원점에 가장 가까우므로 구하는 점은 $\left(\dfrac53,\dfrac53,\dfrac{10}3\right)$이다.
      criteria:
      - 2.R1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        원점에서 평면에 내린 수선의 발을 구하려 했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $\left(\tfrac53,\tfrac53,\tfrac{10}3\right)$을 얻었다.
      depends_on:
      - 2.M1
      steps:
      - 2b-1
    - id: 2.R1
      mark_type: R
      points: 20
      evidence: |
        $\lvert\mathrm{HP_2}\rvert\ge1$을 확인해 조건을 만족함을 보였다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    deductions: []
