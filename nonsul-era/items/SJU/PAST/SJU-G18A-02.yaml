      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $\overline{\mathrm{HP}}\ge1$을 써서 $\sqrt7$을 얻었다.
      depends_on:
      - 1.R1
      steps:
      - 1b-3
    deductions: []
