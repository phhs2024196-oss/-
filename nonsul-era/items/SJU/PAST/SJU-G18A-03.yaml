- id: '4'
  stem: |
    모든 실수 $x$에 대하여 $xF(1-x)+(1-x)F(x)=0$일 때, $\displaystyle\int_0^1f(x)\,dx$를 구하시오.
  points: 60
  depends_on:
  - '1'
  answer:
    kind: value
    value: (exp(1)-1)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $\int_0^1(x-1)F(x)\,dx=\int_0^1xF(1-x)\,dx$를 치환하면 부호가 반대 ⇒ 0.
    steps:
    - id: 4a
      content: $\int_0^1f=\int_0^1xe^{x^2}dx=\tfrac{e-1}2$
      criteria:
      - 4.M1
      - 4.M2
      - 4.A1
      - 4.A2
    hint_ladder:
    - 조건을 $[0,1]$에서 적분해 보자.
    - $u=1-x$로 치환하자.
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.160
    steps:
    - id: 4b-1
      content: |
        주어진 조건에서 $(x-1)F(x)=xF(1-x)$이므로 $\displaystyle\int_0^1(x-1)F(x)\,dx=\int_0^1xF(1-x)\,dx$이다.
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        $u=1-x$로 치환하면 $\displaystyle\int_0^1xF(1-x)\,dx=\int_1^0(1-u)F(u)(-du)=-\int_0^1(u-1)F(u)\,du$이다.
      criteria:
      - 4.M2
    - id: 4b-3
      content: |
        따라서 $\displaystyle\int_0^1(x-1)F(x)\,dx=0$이다.
      criteria:
      - 4.A1
    - id: 4b-4
      content: |
        $\displaystyle\int_0^1f(x)\,dx=\int_0^1\{(x-1)F(x)+xe^{x^2}\}\,dx=\int_0^1xe^{x^2}\,dx=\left[\dfrac12e^{x^2}\right]_0^1=\dfrac12(e-1)$이다.
      criteria:
      - 4.A2
