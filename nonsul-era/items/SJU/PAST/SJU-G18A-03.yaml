- id: '3'
  stem: |
    $g(x)=f'(x)$라 하자. $F'(1)=3$일 때, 미분계수의 정의를 이용하여 $g'(1)$을 구하시오.
  points: 60
  depends_on:
  - '2'
  answer:
    kind: value
    value: 6 + 10*exp(1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=F(x)+(x-1)F'(x)+e^{x^2}+2x^2e^{x^2}$의 차분몫, $F'$ 연속.
    steps:
    - id: 3a
      content: $g'(1)=F'(1)+F'(1)+10e=6+10e$
      criteria:
      - 3.M1
      - 3.M2
      - 3.R1
      - 3.A1
    hint_ladder:
    - $f'(x)$를 곱의 미분으로 구하자.
    - $\tfrac{e^{x^2}+2x^2e^{x^2}-3e}{x-1}$은 어떤 미분계수인가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.159~160
    steps:
    - id: 3b-1
      content: |
        $x\ne1$에서 $f'(x)=F(x)+(x-1)F'(x)+e^{x^2}+2x^2e^{x^2}$이고 (2)에서 $f'(1)=a+3e$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $g'(1)=\displaystyle\lim_{x\to1}\dfrac{f'(x)-f'(1)}{x-1}=\lim_{x\to1}\left\{\dfrac{F(x)-F(1)}{x-1}+F'(x)+\dfrac{e^{x^2}+2x^2e^{x^2}-3e}{x-1}\right\}$ ($F(1)=a$).
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $F'$이 연속이므로 앞의 두 항의 극한은 $F'(1)+F'(1)=6$이다. $m(x)=e^{x^2}+2x^2e^{x^2}$이라 하면 셋째 항의 극한은 $m'(1)$이고 $m'(x)=6xe^{x^2}+4x^3e^{x^2}$에서 $m'(1)=10e$이다. 따라서 $g'(1)=6+10e$이다.
      criteria:
      - 3.R1
      - 3.A1
