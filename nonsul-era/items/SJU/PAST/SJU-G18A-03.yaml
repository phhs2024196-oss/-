  - '1'
  answer:
    kind: expression
    value: a + 3*exp(1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f=(x-1)F+xe^{x^2}$의 차분몫을 둘로 나눔.
    steps:
    - id: 2a
      content: $f'(1)=\lim F+\lim\tfrac{xe^{x^2}-e}{x-1}=a+3e$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $f(x)$를 $F(x)$로 나타내자.
    - $\tfrac{xe^{x^2}-e}{x-1}$은 어떤 함수의 미분계수인가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.159 1안
    steps:
    - id: 2b-1
      content: |
        $x\ne1$에서 $f(x)=(x-1)F(x)+xe^{x^2}$이고 (1)에서 $f(1)=e$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $f'(1)=\displaystyle\lim_{x\to1}\dfrac{f(x)-f(1)}{x-1}=\lim_{x\to1}\dfrac{(x-1)F(x)}{x-1}+\lim_{x\to1}\dfrac{xe^{x^2}-e}{x-1}$.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        첫째 극한은 $\displaystyle\lim_{x\to1}F(x)=a$이고, $k(x)=xe^{x^2}$이라 하면 둘째 극한은 $k'(1)$이며 $k'(x)=e^{x^2}+2x^2e^{x^2}$에서 $k'(1)=3e$이다. 따라서 $f'(1)=a+3e$이다.
      criteria:
      - 2.M2
      - 2.A1
  - id: S2-ALT
    audience: ALT
    method_no: 2
    key_idea: 원 해설 2안 — $a=\lim F$에 $f(1)$을 더하고 빼기.
    source_flow: 해설교재 p.159 2안
    steps:
    - id: 2c-1
      content: |
        $a=\displaystyle\lim_{x\to1}\dfrac{f(x)-f(1)+f(1)-xe^{x^2}}{x-1}=\lim_{x\to1}\dfrac{f(x)-f(1)}{x-1}-\lim_{x\to1}\dfrac{xe^{x^2}-e}{x-1}=f'(1)-3e$.
      criteria:
      - 2.M1
      - 2.M2
    - id: 2c-2
      content: |
        따라서 $f'(1)=a+3e$이다.
      criteria:
      - 2.A1
