    value: exp(1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $F$ 연속 ⇒ 분자 $\to0$.
    steps:
    - id: 1a
      content: $f(1)=1\cdot e^{1}=e$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - $F$는 $x=1$에서 연속이다.
    - 분모가 0으로 가면 분자는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.159 1안
    steps:
    - id: 1b-1
      content: |
        $F'(x)$가 존재하므로 $F$는 연속이고 $\displaystyle\lim_{x\to1}\dfrac{f(x)-xe^{x^2}}{x-1}=F(1)=a$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        분모가 $0$으로 가므로 분자도 $0$으로 가야 한다. $\displaystyle\lim_{x\to1}\{f(x)-xe^{x^2}\}=0$이고 $f$가 연속이므로 $f(1)=e$이다.
      criteria:
      - 1.A1
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 원 해설 2안 — $f(x)=(x-1)F(x)+xe^{x^2}$의 극한.
    source_flow: 해설교재 p.159 2안
    steps:
    - id: 1c-1
      content: |
        $x\ne1$일 때 $f(x)=(x-1)F(x)+xe^{x^2}$이고 $F$, $f$가 연속이므로 $f(1)=\displaystyle\lim_{x\to1}\{(x-1)F(x)+xe^{x^2}\}=e$이다.
      criteria:
      - 1.M1
      - 1.A1
