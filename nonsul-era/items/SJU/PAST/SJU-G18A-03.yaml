stem: |
  실수 전체의 집합에서 미분가능한 함수 $f(x)$에 대하여 함수 $F(x)$를
  $$F(x)=\begin{cases}\dfrac{f(x)-xe^{x^2}}{x-1} & (x\ne1)\\[2mm] a & (x=1)\end{cases}$$
  라 정의하자. $F'(x)$는 실수 전체의 집합에서 연속이다.
subparts:
- id: '1'
  stem: |
    $f(1)$의 값을 구하시오.
  points: 60
  depends_on: []
  answer:
