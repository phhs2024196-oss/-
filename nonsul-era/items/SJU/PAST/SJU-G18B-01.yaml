stem: |
  함수 $f(x)=e^{x+x^2}+e^{x+\sqrt x}$ $(x\ge0)$와 $f(x)$의 역함수 $g(x)$ $(x\ge2)$에 대하여 정적분에 관한 다음 질문에 답하시오.
subparts:
- id: '1'
  stem: |
    $\displaystyle\int_0^1e^{x+x^2}dx=A$일 때, 정적분 $\displaystyle\int_0^12xe^{x+x^2}dx$를 $A$에 관한 식으로 나타내시오.
  points: 60
  depends_on: []
  answer:
    kind: expression
    value: exp(2) - 1 - A
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $2xe^{x+x^2}=e^x\cdot2xe^{x^2}$로 부분적분.
    steps:
    - id: 1a
      content: $[e^xe^{x^2}]_0^1-\int_0^1e^xe^{x^2}dx=e^2-1-A$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - $2xe^{x^2}$은 $e^{x^2}$의 도함수이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.161 1안
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\int_0^12xe^{x+x^2}dx=\int_0^1e^x\cdot2xe^{x^2}dx$에서 $u=e^x$, $v'=2xe^{x^2}$ ($v=e^{x^2}$)으로 부분적분한다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $=\left[e^x\cdot e^{x^2}\right]_0^1-\displaystyle\int_0^1e^x\cdot e^{x^2}dx=(e^2-1)-A$이다.
      criteria:
      - 1.A1
      - 1.A2
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 원 해설 2안 — $(2x+1)e^{x+x^2}$은 $e^{x+x^2}$의 도함수.
    source_flow: 해설교재 p.161 2안
    steps:
    - id: 1c-1
      content: |
        $\displaystyle\int_0^12xe^{x+x^2}dx=\int_0^1(2x+1)e^{x+x^2}dx-\int_0^1e^{x+x^2}dx=\left[e^{x+x^2}\right]_0^1-A=e^2-1-A$.
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        부분적분(또는 $(2x+1)e^{x+x^2}$로 분리)을 적용했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1c-1
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        경계항 $e^2-1$을 계산했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
      - 1c-1
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $e^2-1-A$를 얻었다.
      depends_on:
      - 1.M1
      - 1.A1
      steps:
      - 1b-2
      - 1c-1
    deductions: []
  outcome_codes:
