intent: |
  부분적분과 치환적분으로 계산할 수 없는 적분 $A$를 소거하고, 역함수의 정적분을 치환·넓이 관계로 구하는 능력을 본다.
key_idea: |
  $u=\sqrt x$ 치환으로 $\int e^{x+\sqrt x}$가 $\int2ue^{u+u^2}$이 되어 $A$가 상쇄; 역함수 적분은 $[yf(y)]-\int f$.
stuck: |
  (1-2)에서 $e^{x+\sqrt x}$를 $u=\sqrt x$로 바꾸면 (1-1)의 적분이 된다는 연결
