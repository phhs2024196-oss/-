- id: '2'
  stem: |
    정적분 $\displaystyle\int_0^1f(x)\,dx$의 값을 구하시오.
  points: 60
  depends_on:
  - '1'
  answer:
    kind: value
    value: exp(2) - 1
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $u=\sqrt x$로 $\int_0^1e^{x+\sqrt x}dx=\int_0^12ue^{u+u^2}du$.
    steps:
    - id: 2a
      content: $A+(e^2-1-A)=e^2-1$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
    hint_ladder:
    - $\sqrt x=u$로 치환하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.161
    steps:
    - id: 2b-1
      content: |
        $\displaystyle\int_0^1e^{x+\sqrt x}dx$에서 $u=\sqrt x$로 치환하면 $x=u^2$, $dx=2u\,du$이고 구간은 $0\to0$, $1\to1$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서 $\displaystyle\int_0^1e^{x+\sqrt x}dx=\int_0^12ue^{u^2+u}du=e^2-1-A$ ((1)의 결과).
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        $\displaystyle\int_0^1f(x)\,dx=\int_0^1e^{x+x^2}dx+\int_0^1e^{x+\sqrt x}dx=A+(e^2-1-A)=e^2-1$이다.
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $u=\sqrt x$ 치환($dx=2u\,du$)을 했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (1)의 적분과 같음을 보였다.
      depends_on:
      - 2.M1
      ft:
        allowed: true
        from:
        - 1.A2
        max_points: 20
      steps:
      - 2b-2
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        $e^2-1$을 얻었다.
      depends_on:
      - 2.M1
      - 2.A1
      steps:
      - 2b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  - code: '71'
    misconception: MC-CAL-3140
  misconceptions:
  - id: MC-CAL-3140
    outcome_code: '71'
    wrong_work: $dx=2u\,du$를 빠뜨려 $\int_0^1e^{u+u^2}du=A$로 둠
    detect_cue: 답이 $2A$
    feedback: 치환할 때 $dx$도 $u$로 바꿔야 합니다.
    remedy:
    - RL-1
- id: '3'
  stem: |
    정적분 $\displaystyle\int_2^{2e^2}g(x)\,dx$의 값을 구하시오.
  points: 60
  depends_on:
  - '2'
  answer:
    kind: value
    value: exp(2) + 1
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $x=f(y)$ 치환, $f(0)=2$, $f(1)=2e^2$.
    steps:
    - id: 3a
      content: $\int_0^1yf'(y)dy=[yf(y)]_0^1-\int_0^1f=2e^2-(e^2-1)$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
    hint_ladder:
    - $g$는 $f$의 역함수이다. $g(2)$, $g(2e^2)$는?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.161 1안
    steps:
    - id: 3b-1
      content: |
        $y=g(x)$로 치환하면 $x=f(y)$, $dx=f'(y)\,dy$이고 $f(0)=2$, $f(1)=2e^2$이므로 구간은 $y:0\to1$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\displaystyle\int_2^{2e^2}g(x)\,dx=\int_0^1yf'(y)\,dy=\left[yf(y)\right]_0^1-\int_0^1f(y)\,dy=2e^2-(e^2-1)=e^2+1$이다.
      criteria:
      - 3.M2
      - 3.A1
  - id: S3-ALT
    audience: ALT
    method_no: 2
    key_idea: 원 해설 2안 — 역함수 그래프와 넓이.
    source_flow: 해설교재 p.161 2안
    steps:
    - id: 3c-1
      content: |
        $f(0)=2$, $f(1)=2e^2$이고 $f'(x)>0$이다. 직사각형 $[0,1]\times[0,2e^2]$의 넓이 $2e^2$은 곡선 아래 넓이 $A_1=\int_0^1f(x)\,dx$와 곡선과 $y$축 사이 넓이 $A_2=\int_2^{2e^2}g(x)\,dx$의 합이다.
      criteria:
      - 3.M1
      - 3.M2
    - id: 3c-2
      content: |
        따라서 $\displaystyle\int_2^{2e^2}g(x)\,dx=2e^2-A_1=e^2+1$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $x=f(y)$로 치환하고 구간을 $0\to1$로 바꿨다(또는 넓이 관계를 세웠다).
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
      - 3c-1
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        부분적분(또는 직사각형 넓이 $2e^2$에서 빼기)으로 (2)의 적분을 이용했다.
      depends_on:
      - 3.M1
      ft:
        allowed: true
        from:
        - 2.A2
        max_points: 20
      steps:
      - 3b-2
      - 3c-1
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $e^2+1$을 얻었다.
      depends_on:
      - 3.M2
      steps:
      - 3b-2
      - 3c-2
    deductions: []
