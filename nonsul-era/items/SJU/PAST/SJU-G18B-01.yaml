# 세종대 2018학년도 수시 논술고사[B] 문제 1 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# [해설 불일치] 원 해설 (1-3) 2안의 'f(0)=0' 은 오기 — f(0)=e⁰+e⁰=2(원 해설 그래프에도 2). 답 e²+1 은 같음
