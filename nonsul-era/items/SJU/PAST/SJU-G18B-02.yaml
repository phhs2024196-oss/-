    outcome_code: '71'
    wrong_work: $\overrightarrow{\mathrm{AH}}=\tfrac12(\vec b+\vec c)$로 두어 $\overrightarrow{\mathrm{DH}}=\tfrac12(\vec b+\vec c)-\vec d$
    detect_cue: 계수 $\tfrac12$
    feedback: $\tfrac12(\vec b+\vec c)$는 $\mathrm{BC}$의 중점입니다. 수선의 발은 무게중심입니다.
    remedy:
    - RL-1
- id: '2'
  stem: |
    선분 $\mathrm{AP}$의 중점을 $\mathrm{Q}$라 할 때, $\overrightarrow{\mathrm{DQ}}$를 $\vec b$, $\vec c$, $\vec d$에 관한 식으로 나타내고 $\lvert\overrightarrow{\mathrm{DQ}}\rvert$를 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: expression
    value: DQ = b/6 + c/3 - d; |DQ| = 5/6
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{AP}}=\tfrac{\vec b+2\vec c}3$, 내적은 모두 $\tfrac12$.
    steps:
    - id: 2a
      content: $\lvert\overrightarrow{\mathrm{DQ}}\rvert^2=\tfrac{25}{36}$
      criteria:
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.A2
    hint_ladder:
    - $\mathrm{BC}$를 $2:1$로 내분하는 점의 위치벡터는?
    - $\vec b\cdot\vec c$는?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.162
    steps:
    - id: 2b-1
      content: |
        $\mathrm{P}$는 $\mathrm{BC}$를 $2:1$로 내분하므로 $\overrightarrow{\mathrm{AP}}=\dfrac{\vec b}3+\dfrac{2\vec c}3$, $\overrightarrow{\mathrm{AQ}}=\dfrac12\overrightarrow{\mathrm{AP}}=\dfrac{\vec b}6+\dfrac{\vec c}3$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\overrightarrow{\mathrm{DQ}}=\dfrac{\vec b}6+\dfrac{\vec c}3-\vec d$이다.
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        $\lvert\vec b\rvert=\lvert\vec c\rvert=\lvert\vec d\rvert=1$, $\vec b\cdot\vec c=\vec c\cdot\vec d=\vec d\cdot\vec b=\dfrac12$이므로
        $\lvert\overrightarrow{\mathrm{DQ}}\rvert^2=\dfrac1{36}+\dfrac19+1+\dfrac1{18}-\dfrac16-\dfrac13=\dfrac{25}{36}$, $\lvert\overrightarrow{\mathrm{DQ}}\rvert=\dfrac56$이다.
      criteria:
      - 2.M2
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        $\overrightarrow{\mathrm{AP}}=\tfrac{\vec b+2\vec c}3$을 얻었다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        $\overrightarrow{\mathrm{DQ}}=\tfrac{\vec b}6+\tfrac{\vec c}3-\vec d$를 얻었다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        내적값 $\tfrac12$을 써서 $\lvert\overrightarrow{\mathrm{DQ}}\rvert^2$을 전개했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-3
    - id: 2.A2
      mark_type: A
      points: 15
      evidence: |
        $\tfrac56$을 얻었다.
      depends_on:
      - 2.M2
      - 2.A1
      steps:
      - 2b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  - code: '71'
    misconception: MC-GEO-3138
  misconceptions:
  - id: MC-GEO-3138
    outcome_code: '71'
    wrong_work: 서로 다른 벡터의 내적을 0으로 두어 $\lvert\overrightarrow{\mathrm{DQ}}\rvert^2=\tfrac{41}{36}$
    detect_cue: 교차항이 없다
    feedback: 정사면체 모서리 벡터끼리의 내적은 $\cos60^\circ=\tfrac12$입니다.
    remedy:
    - RL-1
- id: '3'
  stem: |
    점 $\mathrm{R}$가 선분 $\mathrm{AP}$ 위를 움직일 때, 점 $\mathrm{D}$와 점 $\mathrm{R}$ 사이의 거리를 $L$이라 하자. $L^2$의 최솟값을 구하시오.
  points: 60
  depends_on:
  - '2'
  answer:
    kind: value
    value: 19/28
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{DR}}=t\overrightarrow{\mathrm{AP}}-\vec d$, $L^2=\tfrac79t^2-t+1$ $(0\le t\le1)$.
    steps:
    - id: 3a
      content: $t=\tfrac9{14}$에서 $\tfrac{19}{28}$
      criteria:
      - 3.M1
      - 3.A1
      - 3.A2
    hint_ladder:
    - $\overrightarrow{\mathrm{AR}}=t\overrightarrow{\mathrm{AP}}$로 두자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.162
    steps:
    - id: 3b-1
      content: |
        $\mathrm{R}$가 $\mathrm{AP}$를 $t:(1-t)$로 내분한다고 하면 $\overrightarrow{\mathrm{AR}}=t\left(\dfrac{\vec b}3+\dfrac{2\vec c}3\right)$, $\overrightarrow{\mathrm{DR}}=t\left(\dfrac{\vec b}3+\dfrac{2\vec c}3\right)-\vec d$ $(0\le t\le1)$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $L^2=\lvert\overrightarrow{\mathrm{DR}}\rvert^2=\dfrac79t^2-t+1$이다.
      criteria:
      - 3.A1
    - id: 3b-3
      content: |
        꼭짓점 $t=\dfrac9{14}$는 $[0,1]$ 안에 있으므로 $L^2$의 최솟값은 $\dfrac79\cdot\dfrac{81}{196}-\dfrac9{14}+1=\dfrac{19}{28}$이다.
      criteria:
      - 3.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $\overrightarrow{\mathrm{DR}}$을 매개변수 $t$로 나타냈다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 2.M1
        max_points: 20
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $L^2=\tfrac79t^2-t+1$을 얻었다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        $t=\tfrac9{14}\in[0,1]$을 확인해 $\tfrac{19}{28}$을 얻었다.
      depends_on:
      - 3.M1
      - 3.A1
      steps:
      - 3b-3
    deductions: []
