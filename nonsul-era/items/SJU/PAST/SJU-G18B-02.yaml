stimuli: []
stem: |
  그림과 같이 한 변의 길이가 1인 정사면체 $\mathrm{ABCD}$가 있다. 선분 $\mathrm{BC}$를 $2:1$로 내분하는 점을 $\mathrm{P}$라 하고 $\overrightarrow{\mathrm{AB}}=\vec b$, $\overrightarrow{\mathrm{AC}}=\vec c$, $\overrightarrow{\mathrm{AD}}=\vec d$라 하자. (그림: 정사면체 $\mathrm{ABCD}$, 꼭짓점 $\mathrm{D}$가 위, 모서리 $\mathrm{BC}$ 위의 $\mathrm{P}$는 $\mathrm{C}$ 쪽에 가까움)
subparts:
- id: '1'
  stem: |
    세 꼭짓점 $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$를 포함하는 평면을 $\alpha$라 하자. 점 $\mathrm{D}$에서 평면 $\alpha$에 내린 수선의 발을 $\mathrm{H}$라 할 때, $\overrightarrow{\mathrm{DH}}$를 $\vec b$, $\vec c$, $\vec d$에 관한 식으로 나타내시오.
  points: 60
  depends_on: []
  answer:
    kind: expression
    value: DH = b/3 + c/3 - d
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{H}$는 정삼각형 $\mathrm{ABC}$의 무게중심.
    steps:
    - id: 1a
      content: $\overrightarrow{\mathrm{DH}}=\tfrac{\vec b}3+\tfrac{\vec c}3-\vec d$
      criteria:
      - 1.M1
      - 1.R1
      - 1.A1
    hint_ladder:
    - $\mathrm{H}$에서 세 꼭짓점까지의 거리를 비교하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.162 1안
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{DA}}=\overline{\mathrm{DB}}=\overline{\mathrm{DC}}$이고 $\mathrm{DH}\perp\alpha$이므로 $\overline{\mathrm{HA}}=\overline{\mathrm{HB}}=\overline{\mathrm{HC}}$, $\mathrm{H}$는 정삼각형 $\mathrm{ABC}$의 외심, 곧 무게중심이다.
      criteria:
      - 1.M1
      - 1.R1
    - id: 1b-2
      content: |
        $\overrightarrow{\mathrm{AH}}=\dfrac{\vec b}3+\dfrac{\vec c}3$이므로 $\overrightarrow{\mathrm{DH}}=\overrightarrow{\mathrm{AH}}-\overrightarrow{\mathrm{AD}}=\dfrac{\vec b}3+\dfrac{\vec c}3-\vec d$이다.
      criteria:
      - 1.A1
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 원 해설 2안 — $\overrightarrow{\mathrm{AH}}=k(\vec b+\vec c)$와 수직 조건.
    source_flow: 해설교재 p.162 2안
    steps:
    - id: 1c-1
      content: |
        대칭성으로 $\overrightarrow{\mathrm{AH}}=k(\vec b+\vec c)$, $\overrightarrow{\mathrm{DH}}=k(\vec b+\vec c)-\vec d$로 두고 $\overrightarrow{\mathrm{AH}}\perp\overrightarrow{\mathrm{DH}}$에서 $\{k(\vec b+\vec c)-\vec d\}\cdot(\vec b+\vec c)=3k-1=0$.
      criteria:
      - 1.M1
      - 1.R1
    - id: 1c-2
      content: |
        $k=\dfrac13$이므로 $\overrightarrow{\mathrm{DH}}=\dfrac13(\vec b+\vec c)-\vec d$.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $\mathrm{H}$가 삼각형 $\mathrm{ABC}$의 무게중심(외심)임을 밝혔다(또는 $\overrightarrow{\mathrm{AH}}=k(\vec b+\vec c)$와 수직 조건).
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1c-1
    - id: 1.R1
      mark_type: R
      points: 20
      evidence: |
        그 근거(등거리 또는 내적 0)를 제시했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-1
      - 1c-1
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $\overrightarrow{\mathrm{DH}}=\tfrac13(\vec b+\vec c)-\vec d$를 얻었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
      - 1c-2
    deductions: []
