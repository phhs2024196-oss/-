- id: '3'
  stem: |
    $a$값의 범위를 구하시오.
  points: 60
  depends_on:
  - '2'
  answer:
    kind: set
    value: 2/(exp(1)-1) < a < 2/(exp(1)-2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g=f'$는 증가·아래로 볼록, $g(1)=a+1$이 직선 위 ⇒ $(0,1)$의 교점 조건 $g'(1)>a+4$, $g(0)>-3$.
    steps:
    - id: 3a
      content: $\tfrac2{e-1}<a<\tfrac2{e-2}$
      criteria:
      - 3.M1
      - 3.R1
      - 3.A1
      - 3.A2
    hint_ladder:
    - $g(1)$과 직선의 $x=1$에서의 값을 비교하자.
    - $g$는 아래로 볼록하다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.163~164
    steps:
    - id: 3b-1
      content: |
        $f''(x)=ae^x+2>0$이므로 $f$는 아래로 볼록하고 $f(0)=f(1)=0$이므로, $f(x)=ae^x+x^2+(a-ae-1)x-a$ $(a>0)$는 조건 (가)를 만족시킨다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $g(x)=f'(x)=ae^x+2x+a-ae-1$은 $g'(x)=ae^x+2>0$, $g''(x)=ae^x>0$이므로 증가하고 아래로 볼록하다. 직선 $y=(a+4)x-3$은 점 $(1,a+1)$을 지나고 $g(1)=a+1$이므로 두 그래프는 $x=1$에서 만난다.
      criteria:
      - 3.M1
      - 3.R1
    - id: 3b-3
      content: |
        $\varphi(x)=g(x)-\{(a+4)x-3\}$은 아래로 볼록하고 $\varphi(1)=0$이다. $\varphi'(1)\le0$이면 $x<1$에서 $\varphi$가 감소해 $\varphi>0$, $\varphi(0)\le0$이면 볼록성으로 $(0,1)$에서 $\varphi<0$이므로, $0<x<1$에서 만날 조건은 $g'(1)>a+4$이고 $g(0)>-3$이다.
      criteria:
      - 3.R1
    - id: 3b-4
      content: |
        $g'(1)=ae+2>a+4$에서 $a>\dfrac2{e-1}$이다.
      criteria:
      - 3.A1
    - id: 3b-5
      content: |
        $g(0)=2a-ae-1>-3$에서 $a<\dfrac2{e-2}$이다. 따라서 $\dfrac2{e-1}<a<\dfrac2{e-2}$이다.
      criteria:
      - 3.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        $f''>0$과 $f(0)=f(1)=0$으로 (가)가 만족됨을 확인하고 $g$의 증가·볼록성을 밝혔다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 2.A1
        max_points: 15
      steps:
      - 3b-1
      - 3b-2
    - id: 3.R1
      mark_type: R
      points: 15
      evidence: |
        $x=1$에서 이미 만나므로 (나)가 $g'(1)>a+4$, $g(0)>-3$과 동치임을 근거(볼록성·그림)와 함께 보였다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
      - 3b-3
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $a>\tfrac2{e-1}$을 얻었다.
      depends_on:
      - 3.R1
      steps:
      - 3b-4
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        $a<\tfrac2{e-2}$를 얻어 범위를 완성했다.
      depends_on:
      - 3.R1
      steps:
      - 3b-5
    deductions: []
