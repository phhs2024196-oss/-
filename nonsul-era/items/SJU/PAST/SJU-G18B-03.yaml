stimuli: []
stem: |
  실수 전체의 집합에서 정의되는 함수 $f(x)=ae^x+x^2+bx+c$는 다음 조건을 만족시킨다. (단, $a$, $b$, $c$는 실수이고 $a>0$이다.)

  (가) $x(x-1)f(x)\ge0$

  (나) $g(x)=f'(x)$라 할 때, 곡선 $y=g(x)$와 직선 $y=(a+4)x-3$은 좌표평면의 $0<x<1$인 영역에서 만난다.
subparts:
- id: '1'
  stem: |
    조건 (가)를 이용하여 $f(0)$과 $f(1)$의 값을 각각 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: f(0)=0; f(1)=0
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x\le0$ 또는 $x\ge1$에서 $f\ge0$, $0\le x\le1$에서 $f\le0$; 연속성.
    steps:
    - id: 1a
      content: $f(0)=f(1)=0$
      criteria:
      - 1.M1
      - 1.R1
    hint_ladder:
    - $0<x<1$과 $x<0$에서 $f$의 부호는?
    - $f$는 연속이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.163
    steps:
    - id: 1b-1
      content: |
        $x(x-1)f(x)\ge0$이므로 $x<0$ 또는 $x>1$에서 $f(x)\ge0$이고, $0<x<1$에서 $f(x)\le0$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f$는 연속이므로 $f(0)=\displaystyle\lim_{x\to0-}f(x)\ge0$, $f(0)=\lim_{x\to0+}f(x)\le0$에서 $f(0)=0$이고, 같은 방법으로 $f(1)=0$이다.
      criteria:
      - 1.R1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: |
        $x(x-1)$의 부호로 구간별 $f$의 부호를 정했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.R1
      mark_type: R
      points: 30
      evidence: |
        연속성(좌·우극한)으로 $f(0)=f(1)=0$을 이끌었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    deductions: []
