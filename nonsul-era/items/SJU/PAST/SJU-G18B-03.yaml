  misconceptions:
  - id: MC-CAL-3143
    outcome_code: '71'
    wrong_work: $g(0)<-3<g(1)$ 같은 사잇값 조건만 세움
    detect_cue: $x=1$에서 이미 만난다는 사실과 볼록성을 쓰지 않았다
    feedback: $g(1)$이 직선 위에 있으므로 끝점 부호 비교로는 판정할 수 없습니다. 볼록성과 기울기를 비교하세요.
    remedy:
    - RL-2
- id: '4'
  stem: |
    곡선 $y=g(x)$ 위의 점 $(1,g(1))$에서의 접선의 $y$절편을 $k$라 하자. $\dfrac{4-4e}{k+1}$가 자연수가 되는 실수 $a$의 값을 모두 구하시오. (단, $2.7<e<2.8$이다.)
  points: 60
  depends_on:
  - '3'
  answer:
    kind: set
    value: a=2; a=4/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $k=a-ae-1$이므로 $\tfrac{4-4e}{k+1}=\tfrac4a$, (3)으로 $2(e-2)<\tfrac4a<2(e-1)$.
    steps:
    - id: 4a
      content: $\tfrac4a\in\{2,3\}\Rightarrow a=2,\tfrac43$
      criteria:
      - 4.M1
      - 4.A1
      - 4.M2
      - 4.A2
    hint_ladder:
    - 접선의 $y$절편을 $a$로 나타내자.
    - (3)의 범위를 $\tfrac4a$의 범위로 바꾸자.
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.164
    steps:
    - id: 4b-1
      content: |
        $g(1)=a+1$, $g'(1)=ae+2$이므로 접선은 $y=(ae+2)(x-1)+a+1=(ae+2)x+a-ae-1$이다.
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        $k=a-ae-1$이고 $\dfrac{4-4e}{k+1}=\dfrac{4(1-e)}{a(1-e)}=\dfrac4a$이다.
      criteria:
      - 4.A1
    - id: 4b-3
      content: |
        (3)에서 $2(e-2)<\dfrac4a<2(e-1)$이고 $2.7<e<2.8$이므로 $1.4<2(e-2)$, $2(e-1)<3.6$이다. 따라서 $\dfrac4a$로 가능한 자연수는 $2$ 또는 $3$이고 $a=2$ 또는 $a=\dfrac43$이다.
      criteria:
      - 4.M2
      - 4.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 15
      evidence: |
        $x=1$에서의 접선을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 4b-1
    - id: 4.A1
      mark_type: A
      points: 15
      evidence: |
        $k=a-ae-1$, $\tfrac{4-4e}{k+1}=\tfrac4a$를 얻었다.
      depends_on:
      - 4.M1
      steps:
      - 4b-2
    - id: 4.M2
      mark_type: M
      points: 15
      evidence: |
        (3)의 범위로 $\tfrac4a$의 범위를 구했다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 3.A1
        - 3.A2
        max_points: 15
      steps:
      - 4b-3
    - id: 4.A2
      mark_type: A
      points: 15
      evidence: |
        $a=2$, $\tfrac43$을 모두 얻었다.
      depends_on:
      - 4.M2
      - 4.A1
      steps:
      - 4b-3
    deductions: []
