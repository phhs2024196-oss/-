  - code: '20'
    meaning: 만점
  - code: '71'
    misconception: MC-PRB-3131
  misconceptions:
  - id: MC-PRB-3131
    outcome_code: '71'
    wrong_work: $\mathrm{P}(X=k)=\dfrac{{}_k\mathrm{C}_3}{{}_n\mathrm{C}_4}$
    detect_cue: 조합의 위 첨자가 $k$이다
    feedback: $k$는 이미 뽑혔으므로 나머지 3장은 $k-1$장 중에서 고릅니다.
    remedy:
    - RL-2
- id: '3'
  stem: |
    $n$장의 카드가 담겨 있는 이 상자에 $n+1$이 적힌 카드 한 장을 추가한 후 카드 4장을 임의추출한다. 이때 뽑힌 카드에 적힌 숫자들 중 제일 큰 수를 확률변수 $Y$라 하고 기댓값 $\mathrm{E}(Y)$를 $b$라 하자. $b$를 $a$의 식으로 나타내시오.
  points: 60
  depends_on:
  - '2'
  answer:
    kind: expression
    value: a + 4/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $4\le k\le n$에서 $\mathrm{P}(Y=k)=\tfrac{n-3}{n+1}\mathrm{P}(X=k)$이고 $\mathrm{P}(Y=n+1)=\tfrac4{n+1}$.
    steps:
    - id: 3a
      content: $b=\tfrac{n-3}{n+1}a+4$, 그리고 $a=\tfrac{4(n+1)}5$이므로 $b=a+\tfrac45$
      criteria:
      - 3.M1
      - 3.A1
      - 3.A2
    hint_ladder:
    - 새 카드 $n+1$이 뽑히는 경우와 뽑히지 않는 경우로 나눠 보자.
    - $a$를 $n$으로 나타낼 수 있는가?
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2)와 같은 방법으로 $\mathrm{P}(Y=k)=\dfrac{{}_{k-1}\mathrm{C}_3}{{}_{n+1}\mathrm{C}_4}$ $(k=4,\dots,n+1)$이다. $\dfrac{{}_n\mathrm{C}_4}{{}_{n+1}\mathrm{C}_4}=\dfrac{n-3}{n+1}$이므로 $4\le k\le n$에서 $\mathrm{P}(Y=k)=\dfrac{n-3}{n+1}\mathrm{P}(X=k)$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $b=\displaystyle\sum_{k=4}^{n}k\,\mathrm{P}(Y=k)+(n+1)\mathrm{P}(Y=n+1)=\dfrac{n-3}{n+1}\sum_{k=4}^{n}k\,\mathrm{P}(X=k)+(n+1)\cdot\dfrac{{}_n\mathrm{C}_3}{{}_{n+1}\mathrm{C}_4}=\dfrac{n-3}{n+1}a+4$.
      criteria:
      - 3.A1
    - id: 3b-3
      content: |
        $k\,{}_{k-1}\mathrm{C}_3=4\,{}_k\mathrm{C}_4$와 $\displaystyle\sum_{k=4}^{n}{}_k\mathrm{C}_4={}_{n+1}\mathrm{C}_5$에서 $a=\dfrac{4\,{}_{n+1}\mathrm{C}_5}{{}_n\mathrm{C}_4}=\dfrac{4(n+1)}{5}$이므로 $\dfrac{n-3}{n+1}=1-\dfrac{16}{5a}$이다. 따라서 $b=a-\dfrac{16}5+4=a+\dfrac45$이다.
      criteria:
      - 3.A2
  - id: S3-ALT1
    audience: ALT
    method_no: 2
    key_idea: 원 해설 별해 — $n+1$이 포함된 경우와 아닌 경우로 나눈 전기댓값.
    source_flow: 해설교재 p.144 별해
    steps:
    - id: 3c-1
      content: |
        경우 1: 4장 중 $n+1$이 포함되면 최댓값은 $n+1$이고 그 확률은 $\dfrac{{}_n\mathrm{C}_3}{{}_{n+1}\mathrm{C}_4}=\dfrac4{n+1}$. 경우 2: 포함되지 않으면 처음 상자에서 뽑은 것과 같아 최댓값의 기댓값은 $a$이고 확률은 $\dfrac{{}_n\mathrm{C}_4}{{}_{n+1}\mathrm{C}_4}=\dfrac{n-3}{n+1}$.
      criteria:
      - 3.M1
    - id: 3c-2
      content: |
        따라서 $b=(n+1)\cdot\dfrac4{n+1}+a\cdot\dfrac{n-3}{n+1}=4+\dfrac{n-3}{n+1}a$이다.
      criteria:
      - 3.A1
  - id: S3-ALT2
    audience: ALT
    method_no: 3
    key_idea: 직접 계산 — $a=\tfrac{4(n+1)}5$, 같은 방법으로 $b=\tfrac{4(n+2)}5$.
    steps:
    - id: 3d-1
      content: |
        $\mathrm{E}(X)=\dfrac{1}{{}_n\mathrm{C}_4}\displaystyle\sum_{k=4}^{n}4\,{}_k\mathrm{C}_4=\dfrac{4\,{}_{n+1}\mathrm{C}_5}{{}_n\mathrm{C}_4}=\dfrac{4(n+1)}5$이고 $n$ 대신 $n+1$을 넣으면 $b=\dfrac{4(n+2)}5=a+\dfrac45$이다.
      criteria:
      - 3.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $\mathrm{P}(Y=k)$를 구하고 $\mathrm{P}(X=k)$와의 비 $\tfrac{n-3}{n+1}$(또는 두 경우로 나누기)를 세웠다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
      - 3c-1
    - id: 3.A1
      mark_type: A
      points: 25
      evidence: |
        $b=\tfrac{n-3}{n+1}a+4$를 얻었다.
      depends_on:
      - 3.M1
      ft:
        allowed: true
        from:
        - 2.A1
        max_points: 25
      steps:
      - 3b-2
      - 3c-2
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        $a=\tfrac{4(n+1)}5$로 $n$을 소거해 $b=a+\tfrac45$를 얻었다($\tfrac{n-3}{n+1}a+4$ 형태도 인정).
      depends_on:
      - 3.M1
      - 3.A1
      steps:
      - 3b-3
      - 3d-1
    deductions: []
