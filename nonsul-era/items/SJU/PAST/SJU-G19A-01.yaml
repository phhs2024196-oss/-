- id: '2'
  stem: |
    $X$의 확률질량함수를 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: expression
    value: binomial(k-1,3)/binomial(n,4) (k=4,5,...,n)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 최댓값이 $k$ ⇔ $k$가 뽑히고 나머지 3장은 $1,\dots,k-1$에서 뽑힘.
    steps:
    - id: 2a
      content: $\mathrm{P}(X=k)=\dfrac{{}_{k-1}\mathrm{C}_3}{{}_n\mathrm{C}_4}$ $(k=4,5,\dots,n)$
      criteria:
      - 2.M1
      - 2.A1
      - 2.B1
    hint_ladder:
    - 가장 큰 수가 $k$라는 것은 어떤 카드들이 뽑혔다는 뜻인가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.144
    steps:
    - id: 2b-1
      content: |
        4장을 뽑는 모든 경우의 수는 ${}_n\mathrm{C}_4$이다. 가장 큰 수가 $k$이려면 $k$가 적힌 카드가 뽑히고, 나머지 3장은 $1$부터 $k-1$까지의 카드 중에서 뽑혀야 하므로 경우의 수는 ${}_{k-1}\mathrm{C}_3$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서 $\mathrm{P}(X=k)=\dfrac{{}_{k-1}\mathrm{C}_3}{{}_n\mathrm{C}_4}=\dfrac{4(k-1)(k-2)(k-3)}{n(n-1)(n-2)(n-3)}$ $(k=4,5,\dots,n)$이다.
      criteria:
      - 2.A1
      - 2.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 30
      evidence: |
        최댓값이 $k$인 사건을 '$k$ 포함 + 나머지 3장은 $k-1$ 이하'로 세었다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $\mathrm{P}(X=k)={}_{k-1}\mathrm{C}_3/{}_n\mathrm{C}_4$ 또는 동치식을 얻었다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.B1
      mark_type: B
      points: 10
      evidence: |
        $X$가 갖는 값의 범위 $k=4,5,\dots,n$을 밝혔다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-2
    deductions: []
