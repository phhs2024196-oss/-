stem: |
  다음 물음에 답하시오.

  (1-2)와 (1-3)은 다음을 읽고 답하시오.

  > 상자 안에 1부터 $n\,(n\ge4)$까지의 자연수가 각각 하나씩 적힌 $n$장의 카드가 있다. 이 상자에서 카드 4장을 임의추출할 때, 뽑힌 카드에 적힌 숫자들 중에서 제일 큰 수를 확률변수 $X$라 하고 기댓값 $\mathrm{E}(X)$를 $a$라 하자.
subparts:
- id: '1'
  stem: |
    동전을 던질 때 앞면이 나오는 비율이 $p$인 구부러진 동전이 있다. 이 동전을 72번 던져 앞면이 24번 나왔을 때, 앞면이 나오는 비율 $p$에 대하여 신뢰도 $95\%$의 신뢰구간은 $s\le p\le t$이다. $s$와 $t$를 분수로 나타내시오. (단, $Z$가 표준정규분포를 따르는 확률변수일 때, $\mathrm{P}(\lvert Z\rvert\le1.96)=0.95$로 계산한다.)
  points: 60
  depends_on: []
  answer:
    kind: value
    value: s=101/450; t=199/450
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 표본비율 $\hat p=\tfrac13$, 표준오차 $\sqrt{\hat p(1-\hat p)/72}=\tfrac1{18}$로 $\tfrac13\pm1.96\cdot\tfrac1{18}$.
    steps:
    - id: 1a
      content: $\hat p\pm1.96\sqrt{\tfrac{\hat p(1-\hat p)}{72}}=\tfrac13\pm\tfrac{1.96}{18}\Rightarrow s=\tfrac{101}{450},\ t=\tfrac{199}{450}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - 표본비율 $\hat p$는 얼마인가?
    - 표준오차 $\sqrt{\hat p(1-\hat p)/n}$을 계산해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.144
    steps:
    - id: 1b-1
      content: |
        앞면이 나온 횟수를 $X$라 하면 $X$는 이항분포 $\mathrm{B}(72,p)$를 따르고, 표본이 크므로 $\dfrac{\hat p-p}{\sqrt{p(1-p)/72}}$는 근사적으로 표준정규분포를 따른다. 표본비율은 $\hat p=\dfrac{24}{72}=\dfrac13$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        신뢰도 $95\%$의 신뢰구간은 $\hat p-1.96\sqrt{\dfrac{\hat p(1-\hat p)}{72}}\le p\le\hat p+1.96\sqrt{\dfrac{\hat p(1-\hat p)}{72}}$이고 $\sqrt{\dfrac{\frac13\cdot\frac23}{72}}=\sqrt{\dfrac1{324}}=\dfrac1{18}$이다.
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-3
      content: |
        따라서 $\dfrac13\pm\dfrac{1.96}{18}=\dfrac{150\pm49}{450}$이므로 $s=\dfrac{101}{450}$, $t=\dfrac{199}{450}$이다.
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        표본비율 $\hat p=\tfrac13$과 정규근사(신뢰구간 공식 $\hat p\pm1.96\sqrt{\hat p(1-\hat p)/n}$)를 적었다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        표준오차 $\tfrac1{18}$을 얻었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 20
      evidence: |
        $s=\tfrac{101}{450}$, $t=\tfrac{199}{450}$을 분수로 제시했다.
      depends_on:
      - 1.M1
      - 1.A1
      steps:
      - 1b-3
    deductions: []
