    value: (2, 0, 2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{B}$는 $\mathrm{C}$를 지나고 법선 $(1,-1,1)$ 방향인 직선과 평면의 교점.
    steps:
    - id: 2a
      content: $\mathrm{B}(\tfrac32+s,\tfrac12-s,\tfrac32+s)$, $s=\tfrac12\Rightarrow\mathrm{B}(2,0,2)$
      criteria:
      - 2.M1
      - 2.A1
    hint_ladder:
    - 접점은 중심에서 평면에 내린 수선의 발이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.145
    steps:
    - id: 2b-1
      content: |
        접점 $\mathrm{B}$는 중심 $\mathrm{C}\left(\dfrac32,\dfrac12,\dfrac32\right)$를 지나고 방향벡터가 $(1,-1,1)$인 직선 위에 있으므로 $\mathrm{B}\left(\dfrac32+s,\dfrac12-s,\dfrac32+s\right)$로 둔다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\mathrm{B}$가 평면 $x-y+z=4$ 위에 있으므로 $\dfrac52+3s=4$, $s=\dfrac12$이고 $\mathrm{B}(2,0,2)$이다.
      criteria:
      - 2.A1
  rubric:
