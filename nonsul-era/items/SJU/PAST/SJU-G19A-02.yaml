    outcome_code: '71'
    wrong_work: $\mathrm{B}$를 평면 위 임의의 점으로 두고 $\lvert\mathrm{CB}\rvert=\tfrac{\sqrt3}2$만 사용
    detect_cue: 법선 방향 직선이 없다
