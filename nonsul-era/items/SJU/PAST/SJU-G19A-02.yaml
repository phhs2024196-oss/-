stimuli: []
stem: |
  좌표공간에서 중심이 $\mathrm{C}$인 구 $S$가 점 $\mathrm{A}(1,1,2)$에서 평면 $-x+y+z=2$에 접하고, 점 $\mathrm{B}$에서 평면 $x-y+z=4$에 접하고 있다. (단, $\mathrm{C}$의 $x$좌표는 양수이다.) (그림: 두 평면 사이에 놓인 구 $S$와 중심 $\mathrm{C}$, 아래 평면 위의 접점 $\mathrm{A}$, 기울어진 평면 위의 접점 $\mathrm{B}$)
subparts:
- id: '1'
  stem: |
    중심 $\mathrm{C}$의 좌표를 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: (3/2, 1/2, 3/2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{C}$는 $\mathrm{A}$를 지나고 법선 $(-1,1,1)$ 방향인 직선 위, $\lvert\mathrm{CA}\rvert=$ 두 번째 평면까지 거리.
    steps:
    - id: 1a
      content: $\mathrm{C}(1-t,1+t,2+t)$, $3t^2=\tfrac{(2+t)^2}3\Rightarrow t=-\tfrac12$ ($x>0$) $\Rightarrow\mathrm{C}(\tfrac32,\tfrac12,\tfrac32)$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - 접점에서 구의 중심으로 가는 방향은 평면과 어떤 관계인가?
    - 반지름을 두 가지로 나타내 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.145
    steps:
    - id: 1b-1
      content: |
        구가 점 $\mathrm{A}$에서 평면 $-x+y+z=2$에 접하므로 중심 $\mathrm{C}$는 $\mathrm{A}(1,1,2)$를 지나고 방향벡터가 $(-1,1,1)$인 직선 위에 있다. $\mathrm{C}(1-t,\,1+t,\,2+t)$로 둔다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\lvert\overrightarrow{\mathrm{CA}}\rvert^2=3t^2$이고, $\mathrm{C}$와 평면 $x-y+z=4$ 사이의 거리의 제곱은 $\dfrac{\{(1-t)-(1+t)+(2+t)-4\}^2}{3}=\dfrac{(2+t)^2}{3}$이다. 두 값은 반지름의 제곱으로 같다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $9t^2=(t+2)^2$에서 $t=1$ 또는 $t=-\dfrac12$. $t=1$이면 $\mathrm{C}$의 $x$좌표가 $0$이므로 단서에 맞지 않고, $t=-\dfrac12$이면 $\mathrm{C}\left(\dfrac32,\dfrac12,\dfrac32\right)$이다.
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        중심이 $\mathrm{A}$를 지나는 법선 위에 있음을 써서 $\mathrm{C}$를 한 문자로 나타냈다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $\lvert\mathrm{CA}\rvert$와 점과 평면 사이 거리를 같게 놓은 방정식 $9t^2=(t+2)^2$을 세웠다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 20
      evidence: |
        $x$좌표 양수 조건으로 $t=-\tfrac12$를 골라 $\mathrm{C}(\tfrac32,\tfrac12,\tfrac32)$를 얻었다.
      depends_on:
      - 1.M1
      - 1.A1
      steps:
      - 1b-3
    deductions: []
