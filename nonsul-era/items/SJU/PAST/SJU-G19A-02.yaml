- id: '3'
  stem: |
    내적 $\overrightarrow{\mathrm{PA}}\cdot\overrightarrow{\mathrm{PB}}$의 값이 최대가 되는 구 $S$ 위의 점 $\mathrm{P}$의 좌표를 구하시오.
  points: 60
  depends_on:
  - '1'
  - '2'
  answer:
    kind: value
    value: (3/2, 1/2, (3-sqrt(3))/2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{PA}}\cdot\overrightarrow{\mathrm{PB}}=$상수$+\overrightarrow{\mathrm{PC}}\cdot(\overrightarrow{\mathrm{CA}}+\overrightarrow{\mathrm{CB}})$, $\overrightarrow{\mathrm{CA}}+\overrightarrow{\mathrm{CB}}=(0,0,1)$.
    steps:
    - id: 3a
      content: $\overrightarrow{\mathrm{PC}}=\tfrac{\sqrt3}2(0,0,1)\Rightarrow\mathrm{P}(\tfrac32,\tfrac12,\tfrac{3-\sqrt3}2)$
      criteria:
      - 3.M1
      - 3.A1
      - 3.R1
      - 3.A2
    hint_ladder:
    - $\overrightarrow{\mathrm{PA}}=\overrightarrow{\mathrm{PC}}+\overrightarrow{\mathrm{CA}}$로 써 보자.
    - $\overrightarrow{\mathrm{CA}}+\overrightarrow{\mathrm{CB}}$를 계산하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.145
    steps:
    - id: 3b-1
      content: |
        $\overrightarrow{\mathrm{PA}}\cdot\overrightarrow{\mathrm{PB}}=(\overrightarrow{\mathrm{PC}}+\overrightarrow{\mathrm{CA}})\cdot(\overrightarrow{\mathrm{PC}}+\overrightarrow{\mathrm{CB}})=\lvert\overrightarrow{\mathrm{PC}}\rvert^2+\overrightarrow{\mathrm{CA}}\cdot\overrightarrow{\mathrm{CB}}+\overrightarrow{\mathrm{PC}}\cdot(\overrightarrow{\mathrm{CA}}+\overrightarrow{\mathrm{CB}})$이고 앞의 두 항은 상수이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\overrightarrow{\mathrm{CA}}+\overrightarrow{\mathrm{CB}}=\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}}-2\overrightarrow{\mathrm{OC}}=(0,0,1)$이다.
      criteria:
      - 3.A1
    - id: 3b-3
      content: |
        $\lvert\overrightarrow{\mathrm{PC}}\rvert=\dfrac{\sqrt3}2$(반지름)로 일정하므로 내적 $\overrightarrow{\mathrm{PC}}\cdot(0,0,1)$은 $\overrightarrow{\mathrm{PC}}$가 $(0,0,1)$과 같은 방향일 때 최대이다. 즉 $\overrightarrow{\mathrm{PC}}=\left(0,0,\dfrac{\sqrt3}2\right)$.
      criteria:
      - 3.R1
    - id: 3b-4
      content: |
        $\overrightarrow{\mathrm{OP}}=\overrightarrow{\mathrm{OC}}-\overrightarrow{\mathrm{PC}}=\left(\dfrac32,\dfrac12,\dfrac{3-\sqrt3}2\right)$이다.
      criteria:
      - 3.A2
  - id: S3-ALT
    audience: ALT
    method_no: 2
    key_idea: 선분 $\mathrm{AB}$의 중점 $\mathrm{M}$을 쓰면 $\overrightarrow{\mathrm{PA}}\cdot\overrightarrow{\mathrm{PB}}=\lvert\mathrm{PM}\rvert^2-\tfrac14\lvert\mathrm{AB}\rvert^2$.
    steps:
    - id: 3c-1
      content: |
        $\overrightarrow{\mathrm{PA}}\cdot\overrightarrow{\mathrm{PB}}=(\overrightarrow{\mathrm{PM}}+\overrightarrow{\mathrm{MA}})\cdot(\overrightarrow{\mathrm{PM}}-\overrightarrow{\mathrm{MA}})=\lvert\mathrm{PM}\rvert^2-\lvert\mathrm{MA}\rvert^2$이므로 $\mathrm{P}$가 $\mathrm{M}\left(\dfrac32,\dfrac12,2\right)$에서 가장 먼 구 위의 점일 때 최대이다.
      criteria:
      - 3.M1
      - 3.R1
    - id: 3c-2
      content: |
        $\overrightarrow{\mathrm{MC}}=\left(0,0,-\dfrac12\right)$이므로 가장 먼 점은 $\mathrm{C}$에서 $(0,0,-1)$ 방향으로 반지름만큼 간 점 $\left(\dfrac32,\dfrac12,\dfrac{3-\sqrt3}2\right)$이다.
      criteria:
      - 3.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $\overrightarrow{\mathrm{PA}}\cdot\overrightarrow{\mathrm{PB}}$를 $\overrightarrow{\mathrm{PC}}$로 분해해 변하는 부분을 $\overrightarrow{\mathrm{PC}}\cdot(\overrightarrow{\mathrm{CA}}+\overrightarrow{\mathrm{CB}})$로 줄였다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
      - 3c-1
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $\overrightarrow{\mathrm{CA}}+\overrightarrow{\mathrm{CB}}=(0,0,1)$을 얻었다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.R1
      mark_type: R
      points: 10
      evidence: |
        크기가 일정할 때 같은 방향에서 내적이 최대임을 근거로 $\overrightarrow{\mathrm{PC}}$의 방향을 정했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-3
      - 3c-1
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        $\mathrm{P}(\tfrac32,\tfrac12,\tfrac{3-\sqrt3}2)$를 얻었다.
      depends_on:
      - 3.R1
      steps:
      - 3b-4
      - 3c-2
    deductions: []
