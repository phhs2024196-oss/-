- id: '4'
  stem: |
    실수 $m$과 $b$에 대하여 $g(x)=mx+b$라 정의하자. $x\ge1$에서 $g(x)\le F(x)$가 성립하는 $g(x)$에 대하여 $g(e)$가 최댓값으로 $\dfrac{e^4}{4}$을 가질 때 $m$과 $b$를 구하시오.
  points: 60
  depends_on:
  - '1'
  - '2'
  - '3'
  answer:
    kind: value
    value: m=5*exp(3)/4; b=-exp(4)
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $F$는 $[1,\infty)$에서 아래로 볼록 ⇒ $g(e)$의 최댓값은 $x=e$에서의 접선일 때 $F(e)=\tfrac{e^{n+1}}{n+1}$.
    steps:
    - id: 4a
      content: $\tfrac{e^{n+1}}{n+1}=\tfrac{e^4}4\Rightarrow n=3$, $m=f(e)=\tfrac54e^3$, $b=-e^4$
      criteria:
      - 4.M1
      - 4.R1
      - 4.A1
      - 4.A2
    hint_ladder:
    - 곡선 $y=F(x)$는 아래로 볼록한가?
    - $F(e)$를 $n$으로 나타내 보자.
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.146~147
    steps:
    - id: 4b-1
      content: |
        $x\ge1$에서 $F''(x)=f'(x)>0$이므로 ((나) 또는 (3)의 식) 곡선 $y=F(x)$는 $[1,\infty)$에서 아래로 볼록하다. 아래로 볼록한 곡선은 접선보다 위에 있으므로, $g(x)\le F(x)$를 만족하는 직선 중 $g(e)$가 가장 큰 것은 $x=e$에서의 접선이고 그때 $g(e)=F(e)$이다.
      criteria:
      - 4.M1
      - 4.R1
    - id: 4b-2
      content: |
        (1)에서 $an+n+a=n+1$이므로 $F(e)=\dfrac{e^{n+1}}{n+1}$이고 이것이 $\dfrac{e^4}4$이다. $n=3$이 해이고, $h(x)=\dfrac{e^{x+1}}{x+1}$은 $h'(x)=\dfrac{xe^{x+1}}{(x+1)^2}>0$이므로 $x\ge2$에서 증가해 $n\ge2$인 해는 $n=3$뿐이다.
      criteria:
      - 4.A1
    - id: 4b-3
      content: |
        $m=F'(e)=f(e)=\left(1+\dfrac14\right)e^3=\dfrac54e^3$이고 $g(x)=\dfrac54e^3(x-e)+\dfrac{e^4}4$에서 $b=-e^4$이다.
      criteria:
      - 4.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 15
      evidence: |
        $g(e)$의 최댓값이 $x=e$에서 접할 때임을 제시했다.
      depends_on: []
      implied_ok: false
      steps:
      - 4b-1
    - id: 4.R1
      mark_type: R
      points: 15
      evidence: |
        $F''=f'>0$(아래로 볼록)으로 접선이 곡선 아래에 있음을 근거로 들었다.
      depends_on:
      - 4.M1
      steps:
      - 4b-1
    - id: 4.A1
      mark_type: A
      points: 15
      evidence: |
        $F(e)=\tfrac{e^{n+1}}{n+1}=\tfrac{e^4}4$에서 $n=3$(유일성 포함)을 얻었다.
      depends_on:
      - 4.M1
      ft:
        allowed: true
        from:
        - 1.A2
        max_points: 15
      steps:
      - 4b-2
    - id: 4.A2
      mark_type: A
      points: 15
      evidence: |
        $m=\tfrac54e^3$, $b=-e^4$를 얻었다.
      depends_on:
      - 4.M1
      - 4.A1
      steps:
      - 4b-3
    deductions: []
