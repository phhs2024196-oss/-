  misconceptions:
  - id: MC-CAL-3148
    outcome_code: '71'
    wrong_work: $n\ge1$ 전체에서 최소를 찾아 $n=1$일 때 $\tfrac32$
    detect_cue: 답이 $\tfrac32$
    feedback: (2)에서 조건 (나)가 $n\ge2$를 요구했습니다. 앞 결과의 범위를 반영하세요.
    remedy:
