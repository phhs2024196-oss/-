stimuli: []
stem: |
  자연수 $n$과 실수 $a$에 대하여 정의역이 $(0,\infty)$인 함수 $f(x)=x^n(a+\ln x)$와 $F(x)=\displaystyle\int_1^x f(t)\,dt$는 다음 조건을 만족시킨다. (단, $a>0$)

  (가) $F(e)=\dfrac{(an+n+a)e^{n+1}}{(n+1)^2}$

  (나) 구간 $[1,\infty)$에 속하는 모든 $x$에 대하여 $f'(x)\ge2a+1$이다.
subparts:
- id: '1'
  stem: |
    조건 (가)를 이용하여 $a$를 $n$의 식으로 나타내시오.
  points: 60
  depends_on: []
  answer:
    kind: expression
    value: 1/(n+1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 부분적분으로 $F(e)$를 계산해 (가)와 비교.
    steps:
    - id: 1a
      content: $F(e)=\tfrac{(an+n+a)e^{n+1}}{(n+1)^2}-\tfrac{(n+1)a-1}{(n+1)^2}\Rightarrow a=\tfrac1{n+1}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - $\ln t$가 있는 적분은 부분적분을 쓰자.
    - $e^{n+1}$이 없는 상수항을 비교하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.146
    steps:
    - id: 1b-1
      content: |
        $u=\ln t+a$, $v'=t^n$으로 부분적분하면
        $$\int_1^e f(t)\,dt=\left[(\ln t+a)\dfrac{t^{n+1}}{n+1}\right]_1^e-\int_1^e\dfrac{t^n}{n+1}\,dt.$$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        계산하면 $\dfrac{(a+1)e^{n+1}-a}{n+1}-\dfrac{e^{n+1}-1}{(n+1)^2}=\dfrac{(an+n+a)e^{n+1}}{(n+1)^2}-\dfrac{(n+1)a-1}{(n+1)^2}$이다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        조건 (가)와 비교하면 $\dfrac{(n+1)a-1}{(n+1)^2}=0$이므로 $a=\dfrac1{n+1}$이다.
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        $F(e)=\int_1^e t^n(a+\ln t)\,dt$에 부분적분을 적용했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $F(e)$를 $\tfrac{(an+n+a)e^{n+1}}{(n+1)^2}-\tfrac{(n+1)a-1}{(n+1)^2}$로 정리했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        (가)와 비교해 $a=\tfrac1{n+1}$을 얻었다.
      depends_on:
      - 1.M1
      - 1.A1
      steps:
      - 1b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  - code: '71'
    misconception: MC-CAL-3140
  misconceptions:
  - id: MC-CAL-3140
    outcome_code: '71'
    wrong_work: 부분적분 경계항에서 하한 $t=1$의 값 $\tfrac{a}{n+1}$을 빠뜨려 상수항 비교가 틀림
    detect_cue: $\tfrac{a}{n+1}$ 항이 없다
    feedback: 경계항은 위끝 값에서 아래끝 값을 빼야 합니다.
    remedy:
    - RL-1
- id: '2'
  stem: |
    조건 (나)를 이용하여 자연수 $n$의 범위를 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: set
    value: n>=2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=(n\ln x+an+1)x^{n-1}$은 $[1,\infty)$에서 증가하므로 $f'(1)\ge2a+1$만 보면 된다.
    steps:
    - id: 2a
      content: $f'(1)=an+1\ge2a+1\iff n\ge2$
      criteria:
      - 2.M1
      - 2.R1
      - 2.R2
    hint_ladder:
    - $x=1$을 넣으면 $n$에 대해 무엇을 알 수 있는가?
    - $f'(x)$는 $[1,\infty)$에서 증가하는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.146
    steps:
    - id: 2b-1
      content: |
        $f'(x)=nx^{n-1}(a+\ln x)+x^{n-1}=(n\ln x+an+1)x^{n-1}$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $n=1$이면 $f'(1)=a+1<2a+1$ ($a>0$)이므로 조건 (나)를 만족시키지 않는다.
      criteria:
      - 2.R1
    - id: 2b-3
      content: |
        $n\ge2$이면 $f'(1)=an+1\ge2a+1$이다. 또 $[1,\infty)$에서 $n\ln x+an+1$과 $x^{n-1}$은 모두 양수이고 증가하므로 그 곱 $f'(x)$도 증가한다. 따라서 $f'(x)\ge f'(1)\ge2a+1$이 모든 $x\ge1$에서 성립하고, 구하는 범위는 $n\ge2$이다.
      criteria:
      - 2.R2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        $f'(x)=(n\ln x+an+1)x^{n-1}$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.R1
      mark_type: R
      points: 15
      evidence: |
        $n=1$에서 $x=1$ 반례로 (나)가 깨짐을 보였다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.R2
      mark_type: R
      points: 30
      evidence: |
        $n\ge2$에서 $f'(1)\ge2a+1$과 $f'$의 증가성(양수·증가 함수의 곱)을 근거로 모든 $x\ge1$에서 성립함을 보이고 $n\ge2$로 결론지었다.
      depends_on:
      - 2.M1
      steps:
      - 2b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  - code: '71'
    misconception: MC-PRF-3146
  misconceptions:
  - id: MC-PRF-3146
    outcome_code: '71'
    wrong_work: $f'(1)\ge2a+1$만 확인하고 $n\ge2$라 결론
    detect_cue: $x>1$에서의 성립 근거(증가성)가 없다
    feedback: 끝점에서의 확인은 필요조건일 뿐입니다. 구간 전체에서는 $f'$의 증가성으로 보이세요.
    remedy:
    - RL-2
- id: '3'
  stem: |
    $F''(1)$의 최솟값을 구하시오.
  points: 60
  depends_on:
  - '1'
  - '2'
  answer:
    kind: value
    value: 5/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $F''=f'$, $F''(1)=1+\tfrac n{n+1}$은 $n$에 대해 증가, $n\ge2$.
    steps:
    - id: 3a
      content: $F''(1)=2-\tfrac1{n+1}\ge\tfrac53$ ($n=2$)
      criteria:
      - 3.M1
      - 3.A1
      - 3.A2
    hint_ladder:
    - $F''(x)$는 $f$와 어떤 관계인가?
    - (2)의 범위를 잊지 말자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.146
    steps:
    - id: 3b-1
      content: |
        미적분의 기본 정리에 의해 $F'(x)=f(x)=\left(\ln x+\dfrac1{n+1}\right)x^n$이고 $F''(x)=f'(x)=x^{n-1}\left(1+n\ln x+\dfrac n{n+1}\right)$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $F''(1)=1+\dfrac n{n+1}=2-\dfrac1{n+1}$은 $n$이 커질수록 커진다.
      criteria:
      - 3.A1
    - id: 3b-3
      content: |
        (2)에서 $n\ge2$이므로 $F''(1)$은 $n=2$일 때 최솟값 $\dfrac53$을 갖는다.
      criteria:
      - 3.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $F''(x)=f'(x)$를 쓰고 (1)의 $a=\tfrac1{n+1}$을 대입했다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 1.A2
        max_points: 20
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $F''(1)=2-\tfrac1{n+1}$을 얻었다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        (2)의 $n\ge2$를 써서 최솟값 $\tfrac53$을 얻었다.
      depends_on:
      - 3.M1
      - 3.A1
      ft:
        allowed: true
        from:
        - 2.R2
        max_points: 20
      steps:
      - 3b-3
    deductions: []
