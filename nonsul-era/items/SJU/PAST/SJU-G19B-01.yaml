stem: |
  좌표평면에 중심이 $\mathrm{P}(0,1)$이고 반지름의 길이가 1인 원 $C$가 있다. 원의 내부에 있고 제1사분면에 있는 점 $\mathrm{Q}(x_1,y_1)$과 $\mathrm{R}(x_2,y_2)$에 대하여
  두 점 $\mathrm{P}$와 $\mathrm{Q}$를 지나는 직선이 제1사분면에서 원 $C$와 만나는 점을 $\mathrm{Q_1}$이라 하고
  두 점 $\mathrm{P}$와 $\mathrm{R}$를 지나는 직선이 제1사분면에서 원 $C$와 만나는 점을 $\mathrm{R_1}$이라 하자.
  점 $\mathrm{Q}$, $\mathrm{Q_1}$, $\mathrm{R}$, $\mathrm{R_1}$은 다음 조건을 만족시킨다. (단, $0<y_2<y_1<1$, $0<x_1<\dfrac12$)

  (가) $\overline{\mathrm{QQ_1}}=x_1$

  (나) $\overline{\mathrm{RR_1}}=x_2$

  (다) $\overline{\mathrm{QR}}=x_1+x_2$

  (그림: 원점 $\mathrm{O}$에서 $x$축에 접하는 원 $C$, 중심 $\mathrm{P}$에서 $\mathrm{Q}$를 지나 원 위의 $\mathrm{Q_1}$로, $\mathrm{R}$를 지나 원 위의 $\mathrm{R_1}$로 가는 선분. $\mathrm{R}$가 $\mathrm{Q}$보다 아래·$x$축 가까이)
subparts:
- id: '1'
  stem: |
    $y_1$을 $x_1$의 식으로 나타내시오.
  points: 60
  depends_on: []
  answer:
    kind: expression
    value: 1 - sqrt(1-2*x1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{PQ}}=1-x_1$ (반지름 1에서 $\overline{\mathrm{QQ_1}}$을 뺌)을 좌표로 쓴다.
    steps:
    - id: 1a
      content: $x_1^2+(1-y_1)^2=(1-x_1)^2$, $y_1<1\Rightarrow y_1=1-\sqrt{1-2x_1}$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - $\overline{\mathrm{PQ}}$를 $x_1$로 나타내 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.148
    steps:
    - id: 1b-1
      content: |
        $\mathrm{Q}$는 선분 $\mathrm{PQ_1}$ 위에 있고 $\overline{\mathrm{PQ_1}}=1$이므로 $\overline{\mathrm{PQ}}=1-\overline{\mathrm{QQ_1}}=1-x_1$이다. 따라서 $x_1^2+(1-y_1)^2=(1-x_1)^2$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        정리하면 $y_1^2-2y_1=-2x_1$, 즉 $y_1=1\pm\sqrt{1-2x_1}$이다. $y_1<1$이므로 $y_1=1-\sqrt{1-2x_1}$이다.
      criteria:
      - 1.A1
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
