- id: '3'
  stem: |
    극한 $\displaystyle\lim_{y_1\to0+}\dfrac{y_2}{y_1}$를 구하시오.
  points: 60
  depends_on:
  - '1'
  answer:
    kind: value
    value: 3 - 2*sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: (다)에서 $4x_1x_2=(y_1-y_2)^2$, $x=\tfrac{2y-y^2}2$로 $y_2$의 이차방정식을 풀고 $0<y_2<y_1$로 근 선택.
    steps:
    - id: 3a
      content: $\dfrac{y_2}{y_1}=\dfrac{y_1-3-(y_1-2)\sqrt2}{y_1^2-2y_1-1}\to3-2\sqrt2$
      criteria:
      - 3.M1
      - 3.M2
      - 3.R1
      - 3.A1
    hint_ladder:
    - (다)를 좌표로 쓰면 $x_1x_2$와 $(y_1-y_2)^2$의 관계가 나온다.
    - (1)의 관계 $-2x=y^2-2y$를 대입하자.
    - 두 근 중 $0<y_2<y_1$인 것은?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.148
    steps:
    - id: 3b-1
      content: |
        (다)에서 $(x_1-x_2)^2+(y_1-y_2)^2=(x_1+x_2)^2$이므로 $4x_1x_2=(y_1-y_2)^2$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        (1)에서 $-2x_1=y_1^2-2y_1$, 같은 방법으로 $-2x_2=y_2^2-2y_2$이므로 $(y_1^2-2y_1)(y_2^2-2y_2)=(y_1-y_2)^2$이다. 전개해 $y_2$에 대해 정리하면
        $$(y_1^2-2y_1-1)y_2^2-2(y_1^2-3y_1)y_2-y_1^2=0.$$
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        근의 공식에서 판별식 부분이 $(y_1^2-3y_1)^2+(y_1^2-2y_1-1)y_1^2=2y_1^2(y_1-2)^2$이므로
        $$\dfrac{y_2}{y_1}=\dfrac{y_1-3\pm(y_1-2)\sqrt2}{y_1^2-2y_1-1}.$$
        $0<y_2<y_1$, $y_1^2-2y_1-1<0$을 쓰면 $\pm\sqrt2(2-y_1)<-y_1^2+3y_1-2$이어야 하고, $0<y_1<1$에서 우변이 음수이므로 $-$ 부호만 가능하다.
      criteria:
      - 3.R1
    - id: 3b-4
      content: |
        따라서 $\dfrac{y_2}{y_1}=\dfrac{y_1-3-(y_1-2)\sqrt2}{y_1^2-2y_1-1}$이고 $y_1\to0+$일 때 $\dfrac{-3+2\sqrt2}{-1}=3-2\sqrt2$이다.
      criteria:
      - 3.A1
  - id: S3-ALT
    audience: ALT
    method_no: 2
    key_idea: 원 해설 별해(불완전) — 극한 $\alpha$가 존재한다고 가정하고 극한을 취한다.
    source_flow: 해설교재 p.148~149 별해
    steps:
    - id: 3c-1
      content: |
        $4x_1x_2=(y_1-y_2)^2$의 양변을 $y_1^2$으로 나누면 $4\dfrac{x_1}{y_1}\dfrac{x_2}{y_2}\dfrac{y_2}{y_1}=\left(1-\dfrac{y_2}{y_1}\right)^2$이고, $\dfrac{x}{y}=1-\dfrac y2\to1$이다.
      criteria:
      - 3.M1
    - id: 3c-2
      content: |
        $\alpha=\displaystyle\lim_{y_1\to0+}\dfrac{y_2}{y_1}$이 존재한다고 하면 $4\alpha=(1-\alpha)^2$, $\alpha=3\pm2\sqrt2$이고 $\alpha\le1$이므로 $3-2\sqrt2$이다. (수렴성을 보이지 않았으므로 감점 D3-1 적용)
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        (다)를 $4x_1x_2=(y_1-y_2)^2$로 바꿨다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
      - 3c-1
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        $x_1$, $x_2$를 $y_1$, $y_2$로 바꿔 $y_2$의 이차방정식을 세웠다.
      depends_on:
      - 3.M1
      ft:
        allowed: true
        from:
        - 1.A1
        max_points: 15
      steps:
      - 3b-2
    - id: 3.R1
      mark_type: R
      points: 15
      evidence: |
        $0<y_2<y_1$로 부호를 근거 있게 골랐다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        극한값 $3-2\sqrt2$를 얻었다.
      depends_on:
      - 3.R1
      steps:
      - 3b-4
      - 3c-2
    deductions:
    - code: D3-1
      condition: 극한의 존재를 가정하고 $4\alpha=(1-\alpha)^2$만 푼 경우(원 해설 별해)
      effect: cap
      value: 30
