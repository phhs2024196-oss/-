- id: '2'
  stem: |
    극한 $\displaystyle\lim_{x_1\to0+}\dfrac{y_2}{x_2}$를 구하시오.
  points: 60
  depends_on:
  - '1'
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $y_2=1-\sqrt{1-2x_2}$, $0<x_2<x_1$이라 $x_2\to0+$, 유리화.
    steps:
    - id: 2a
      content: $\dfrac{y_2}{x_2}=\dfrac{2}{1+\sqrt{1-2x_2}}\to1$
      criteria:
      - 2.M1
      - 2.R1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $x_1\to0+$일 때 $x_2$는 어떻게 되는가?
    - 분자를 유리화하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.148
    steps:
    - id: 2b-1
      content: |
        (1)과 같은 방법으로 (나)에서 $y_2=1-\sqrt{1-2x_2}$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $y=1-\sqrt{1-2x}$는 증가함수이고 $y_2<y_1$이므로 $0<x_2<x_1$이다. 따라서 $x_1\to0+$일 때 $x_2\to0+$이다.
      criteria:
      - 2.R1
    - id: 2b-3
      content: |
        $\dfrac{y_2}{x_2}=\dfrac{1-\sqrt{1-2x_2}}{x_2}=\dfrac{(1-\sqrt{1-2x_2})(1+\sqrt{1-2x_2})}{x_2(1+\sqrt{1-2x_2})}=\dfrac{2}{1+\sqrt{1-2x_2}}$이므로 극한값은 $1$이다.
      criteria:
      - 2.M2
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
