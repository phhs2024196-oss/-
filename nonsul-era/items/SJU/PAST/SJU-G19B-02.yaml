  misconceptions:
  - id: MC-GEO-3138
    outcome_code: '71'
    wrong_work: $\mathrm{C_1}$을 $\mathrm{AB}$의 중점으로 보고 $m=n=\tfrac12$
    detect_cue: $m+n=1$인 답
    feedback: 꼭짓점 $\mathrm{C}$에서 내린 수선의 발은 밑면의 외심(무게중심)입니다.
    remedy:
    - RL-1
- id: '2'
  stem: |
    평면 $\alpha$ 위에 있지 않은 점 $\mathrm{S}$에서 평면 $\alpha$에 내린 수선의 발을 $\mathrm{S_1}$이라 하자. $\overrightarrow{\mathrm{PS}}=a\overrightarrow{\mathrm{OA}}+b\overrightarrow{\mathrm{OB}}+c\overrightarrow{\mathrm{OC}}$일 때, $\overrightarrow{\mathrm{PS_1}}=p\overrightarrow{\mathrm{OA}}+q\overrightarrow{\mathrm{OB}}$이다. 실수 $p$, $q$를 실수 $a$, $b$, $c$의 식으로 나타내시오.
  points: 60
  depends_on:
  - '1'
  answer:
    kind: expression
    value: p=(3*a+c)/3; q=(3*b+c)/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{SS_1}}\perp\overrightarrow{\mathrm{OA}},\overrightarrow{\mathrm{OB}}$.
    steps:
    - id: 2a
      content: $p=a+\tfrac c3$, $q=b+\tfrac c3$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
    hint_ladder:
    - $\overrightarrow{\mathrm{SS_1}}$은 평면 $\alpha$와 수직이다.
    - (2-1)에서 $\overrightarrow{\mathrm{OC}}$의 정사영을 이미 구했다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.150
    steps:
    - id: 2b-1
      content: |
        $\overrightarrow{\mathrm{SS_1}}=\overrightarrow{\mathrm{PS_1}}-\overrightarrow{\mathrm{PS}}=(p-a)\overrightarrow{\mathrm{OA}}+(q-b)\overrightarrow{\mathrm{OB}}-c\overrightarrow{\mathrm{OC}}$이고 $\overrightarrow{\mathrm{SS_1}}\cdot\overrightarrow{\mathrm{OA}}=\overrightarrow{\mathrm{SS_1}}\cdot\overrightarrow{\mathrm{OB}}=0$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        각 변의 길이가 1이고 두 모서리 벡터의 내적이 $\dfrac12$이므로 $(p-a)+\dfrac{q-b}2-\dfrac c2=0$, $\dfrac{p-a}2+(q-b)-\dfrac c2=0$이다.
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        두 식을 풀면 $p-a=q-b=\dfrac c3$, 즉 $p=\dfrac{3a+c}3$, $q=\dfrac{3b+c}3$이다.
      criteria:
      - 2.A2
  - id: S2-ALT
    audience: ALT
    method_no: 2
    key_idea: 원 해설 별해 — 정사영의 선형성.
    source_flow: 해설교재 p.150 별해
    steps:
    - id: 2c-1
      content: |
        $\overrightarrow{\mathrm{OA}}$, $\overrightarrow{\mathrm{OB}}$의 $\alpha$ 위로의 정사영은 자기 자신이고, (2-1)에서 $\overrightarrow{\mathrm{OC}}$의 정사영은 $\dfrac13\overrightarrow{\mathrm{OA}}+\dfrac13\overrightarrow{\mathrm{OB}}$이다.
      criteria:
      - 2.M1
      - 2.A1
    - id: 2c-2
      content: |
        따라서 $\overrightarrow{\mathrm{PS}}$의 정사영 $\overrightarrow{\mathrm{PS_1}}=a\overrightarrow{\mathrm{OA}}+b\overrightarrow{\mathrm{OB}}+c\left(\dfrac13\overrightarrow{\mathrm{OA}}+\dfrac13\overrightarrow{\mathrm{OB}}\right)$이므로 $p=\dfrac{3a+c}3$, $q=\dfrac{3b+c}3$.
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $\overrightarrow{\mathrm{SS_1}}$을 세 벡터로 나타내고 $\overrightarrow{\mathrm{OA}}$, $\overrightarrow{\mathrm{OB}}$와의 수직 조건(또는 정사영의 선형성)을 썼다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
      - 2c-1
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        내적값 $1$, $\tfrac12$을 넣은 두 식을 세웠다(또는 $\overrightarrow{\mathrm{OC}}$의 정사영이 $\tfrac13(\overrightarrow{\mathrm{OA}}+\overrightarrow{\mathrm{OB}})$임을 썼다).
      depends_on:
      - 2.M1
      ft:
        allowed: true
        from:
        - 1.A1
        max_points: 20
      steps:
      - 2b-2
      - 2c-1
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        $p=\tfrac{3a+c}3$, $q=\tfrac{3b+c}3$을 얻었다.
      depends_on:
      - 2.M1
      - 2.A1
      steps:
      - 2b-3
      - 2c-2
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  - code: '71'
    misconception: MC-GEO-3138
  misconceptions:
  - id: MC-GEO-3138
    outcome_code: '71'
    wrong_work: $\overrightarrow{\mathrm{OA}}\cdot\overrightarrow{\mathrm{OB}}=0$으로 두어 $p=a+\tfrac c2$, $q=b+\tfrac c2$
    detect_cue: 내적 $\tfrac12$이 반영되지 않았다
    feedback: 정사면체의 두 모서리 사이 각은 $60^\circ$이므로 내적은 $\tfrac12$입니다.
    remedy:
    - RL-1
- id: '3'
  stem: |
    $\mathrm{R}$는 선분 $\mathrm{AC}$를 $(1-t):t$로 내분하는 점이다. 실수 $t$를 구하시오.
  points: 60
  depends_on:
  - '2'
  answer:
    kind: value
    value: 11/29
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{R}$의 정사영 $\mathrm{R_1}$이 직선 $\mathrm{PQ}$ 위 ⇔ $\overrightarrow{\mathrm{PR_1}}\parallel\overrightarrow{\mathrm{PQ}}$.
    steps:
    - id: 3a
      content: $\dfrac{2t/3}{11/30}=\dfrac{(1-t)/3}{3/10}\Rightarrow t=\tfrac{11}{29}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.R1
      - 3.A1
    hint_ladder:
    - $\mathrm{R}$에서 $\alpha$에 내린 수선의 발은 어디에 있어야 하는가?
    - (2-2)를 $\mathrm{S}=\mathrm{R}$로 써 보자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.150
    steps:
    - id: 3b-1
      content: |
        $\overrightarrow{\mathrm{OP}}=\dfrac13\overrightarrow{\mathrm{OA}}$, $\overrightarrow{\mathrm{OQ}}=\dfrac7{10}\overrightarrow{\mathrm{OA}}+\dfrac3{10}\overrightarrow{\mathrm{OB}}$이므로 $\overrightarrow{\mathrm{PQ}}=\dfrac{11}{30}\overrightarrow{\mathrm{OA}}+\dfrac3{10}\overrightarrow{\mathrm{OB}}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\overrightarrow{\mathrm{OR}}=t\overrightarrow{\mathrm{OA}}+(1-t)\overrightarrow{\mathrm{OC}}$이므로 $\overrightarrow{\mathrm{PR}}=\left(t-\dfrac13\right)\overrightarrow{\mathrm{OA}}+(1-t)\overrightarrow{\mathrm{OC}}$이다. $\mathrm{R}$에서 $\alpha$에 내린 수선의 발을 $\mathrm{R_1}$이라 하면 (2-2)에서 $\overrightarrow{\mathrm{PR_1}}=\dfrac{2t}3\overrightarrow{\mathrm{OA}}+\dfrac{1-t}3\overrightarrow{\mathrm{OB}}$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $\mathrm{R}$가 $\alpha$에 수직이고 $\mathrm{PQ}$를 포함하는 평면 위에 있으므로 $\mathrm{R_1}$은 직선 $\mathrm{PQ}$ 위에 있고, $\overrightarrow{\mathrm{PR_1}}\parallel\overrightarrow{\mathrm{PQ}}$이다.
      criteria:
      - 3.R1
    - id: 3b-4
      content: |
        $\dfrac{2t/3}{11/30}=\dfrac{(1-t)/3}{3/10}$에서 $\dfrac{20t}{11}=\dfrac{10(1-t)}9$, $t=\dfrac{11}{29}$이다.
      criteria:
      - 3.A1
  - id: S3-ALT
    audience: ALT
    method_no: 2
    key_idea: 원 해설 별해 — 좌표 $\mathrm{O}(0,0,0)$, $\mathrm{A}(1,0,0)$, $\mathrm{B}(\tfrac12,\tfrac{\sqrt3}2,0)$, $\mathrm{C}(\tfrac12,\tfrac{\sqrt3}6,\tfrac{\sqrt6}3)$.
    source_flow: 해설교재 p.150 별해
    steps:
    - id: 3c-1
      content: |
        $\mathrm{P}\left(\dfrac13,0,0\right)$, $\mathrm{Q}\left(\dfrac{17}{20},\dfrac{3\sqrt3}{20},0\right)$이므로 $\mathrm{PQ}$를 포함하고 $\alpha$에 수직인 평면은 $y=\dfrac{9\sqrt3}{31}\left(x-\dfrac13\right)$이다.
      criteria:
      - 3.M1
      - 3.R1
    - id: 3c-2
      content: |
        $\mathrm{R}\left(t+\dfrac{1-t}2,\ \dfrac{\sqrt3}6(1-t),\ \dfrac{\sqrt6}3(1-t)\right)$를 대입하면 $\dfrac{\sqrt3}6(1-t)=\dfrac{9\sqrt3}{31}\left(\dfrac{1+t}2-\dfrac13\right)$, $t=\dfrac{11}{29}$.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        $\overrightarrow{\mathrm{PQ}}=\tfrac{11}{30}\overrightarrow{\mathrm{OA}}+\tfrac3{10}\overrightarrow{\mathrm{OB}}$을 얻었다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
      - 3c-1
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        $\overrightarrow{\mathrm{PR}}$을 쓰고 (2-2)로 정사영 $\overrightarrow{\mathrm{PR_1}}$을 구했다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 2.A2
        max_points: 15
      steps:
      - 3b-2
    - id: 3.R1
      mark_type: R
      points: 15
      evidence: |
        $\mathrm{R_1}$이 직선 $\mathrm{PQ}$ 위에 있어야 함(평행 조건)을 근거와 함께 세웠다.
      depends_on:
      - 3.M1
      - 3.M2
      steps:
      - 3b-3
      - 3c-1
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $t=\tfrac{11}{29}$를 얻었다.
      depends_on:
      - 3.R1
      steps:
      - 3b-4
      - 3c-2
    deductions: []
