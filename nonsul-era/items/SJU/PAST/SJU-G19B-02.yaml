stem: |
  각 변의 길이가 1인 정사면체의 네 꼭짓점을 $\mathrm{O}$, $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$라 하자. 세 점 $\mathrm{O}$, $\mathrm{A}$, $\mathrm{B}$를 포함하는 평면을 $\alpha$라 하고, 선분 $\mathrm{OA}$를 $1:2$로 내분하는 점을 $\mathrm{P}$,
  선분 $\mathrm{AB}$를 $3:7$로 내분하는 점을 $\mathrm{Q}$라 하자. 또한, 평면 $\alpha$에 수직이고 선분 $\mathrm{PQ}$를
  포함하는 평면이 선분 $\mathrm{AC}$와 만나는 점을 $\mathrm{R}$라 하자.
  (그림: 평면 $\alpha$ 위의 삼각형 $\mathrm{OAB}$와 꼭짓점 $\mathrm{C}$, 선분 $\mathrm{OA}$ 위의 $\mathrm{P}$, 선분 $\mathrm{AB}$ 위의 $\mathrm{Q}$, 선분 $\mathrm{AC}$ 위의 $\mathrm{R}$)
subparts:
- id: '1'
  stem: |
    점 $\mathrm{C}$에서 평면 $\alpha$에 내린 수선의 발을 $\mathrm{C_1}$이라 하자. $\overrightarrow{\mathrm{OC_1}}=m\overrightarrow{\mathrm{OA}}+n\overrightarrow{\mathrm{OB}}$일 때, 실수 $m$, $n$을 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: m=1/3; n=1/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{C_1}$은 정삼각형 $\mathrm{OAB}$의 외심 = 무게중심.
    steps:
    - id: 1a
      content: $\overrightarrow{\mathrm{OC_1}}=\tfrac13\overrightarrow{\mathrm{OA}}+\tfrac13\overrightarrow{\mathrm{OB}}$
      criteria:
      - 1.M1
      - 1.R1
      - 1.A1
    hint_ladder:
    - $\overline{\mathrm{C_1O}}$, $\overline{\mathrm{C_1A}}$, $\overline{\mathrm{C_1B}}$를 비교해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.150
    steps:
    - id: 1b-1
      content: |
        $\overline{\mathrm{CO}}=\overline{\mathrm{CA}}=\overline{\mathrm{CB}}$이고 $\mathrm{CC_1}\perp\alpha$이므로 피타고라스 정리에 의해 $\overline{\mathrm{C_1O}}=\overline{\mathrm{C_1A}}=\overline{\mathrm{C_1B}}$, 즉 $\mathrm{C_1}$은 삼각형 $\mathrm{OAB}$의 외심이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        삼각형 $\mathrm{OAB}$는 정삼각형이므로 외심은 무게중심과 같고, $\overrightarrow{\mathrm{OC_1}}=\dfrac13\overrightarrow{\mathrm{OA}}+\dfrac13\overrightarrow{\mathrm{OB}}$, 따라서 $m=n=\dfrac13$이다.
      criteria:
      - 1.R1
      - 1.A1
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 내적 조건 $\overrightarrow{\mathrm{C_1C}}\perp\overrightarrow{\mathrm{OA}},\overrightarrow{\mathrm{OB}}$로 연립.
    steps:
    - id: 1c-1
      content: |
        $\overrightarrow{\mathrm{OA}}\cdot\overrightarrow{\mathrm{OB}}=\overrightarrow{\mathrm{OA}}\cdot\overrightarrow{\mathrm{OC}}=\overrightarrow{\mathrm{OB}}\cdot\overrightarrow{\mathrm{OC}}=\dfrac12$이고 $(\overrightarrow{\mathrm{OC}}-m\overrightarrow{\mathrm{OA}}-n\overrightarrow{\mathrm{OB}})\cdot\overrightarrow{\mathrm{OA}}=0$, $\cdot\overrightarrow{\mathrm{OB}}=0$에서 $m+\dfrac n2=\dfrac12$, $\dfrac m2+n=\dfrac12$.
      criteria:
      - 1.M1
    - id: 1c-2
      content: |
        풀면 $m=n=\dfrac13$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        $\mathrm{C_1}$이 세 꼭짓점에서 같은 거리(외심)임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1c-1
    - id: 1.R1
      mark_type: R
      points: 15
      evidence: |
        정삼각형에서 외심 = 무게중심임을 근거로 들었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $m=n=\tfrac13$을 얻었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
      - 1c-2
    deductions: []
  outcome_codes:
  - code: '20'
