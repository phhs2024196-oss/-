- id: '4'
  stem: |
    $0\le x\le1$일 때 $g(x)$와 $a$를 각각 구하시오.
  points: 60
  depends_on:
  - '3'
  answer:
    kind: value
    value: g(x)=0; a=10
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $[0,1]$에서 $g'\le0$, $g(0)=g(1)=0$ ⇒ $g\equiv0$.
    steps:
    - id: 4a
      content: $f(x)=(a-5)x+5$, $a-5=f'(0)=f(0)=5\Rightarrow a=10$
      criteria:
      - 4.M1
      - 4.R1
      - 4.A1
      - 4.A2
    hint_ladder:
    - $g(0)$의 값은?
    - (3)에서 $[0,1]$의 증감은?
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.151
    steps:
    - id: 4b-1
      content: |
        (3)에서 $0\le x\le1$일 때 $g'(x)\le0$이므로 $g$는 이 구간에서 증가하지 않고 $g(0)\ge g(x)\ge g(1)$이다.
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        $g(0)=f(0)-5=0$, $g(1)=0$이므로 $g(x)=0$ $(0\le x\le1)$이고, 이 구간에서 $f(x)=(a-5)x+5$이다.
      criteria:
      - 4.R1
      - 4.A1
    - id: 4b-3
      content: |
        (가)에 $x=0$을 대입하면 $a-5=f'(0)=f(0)=5$이므로 $a=10$이다.
      criteria:
      - 4.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 15
      evidence: |
        (3)의 결과로 $[0,1]$에서 $g$가 증가하지 않음을 썼다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 3.R1
        max_points: 15
      steps:
      - 4b-1
    - id: 4.R1
      mark_type: R
      points: 15
      evidence: |
        $g(0)=g(1)=0$으로 $g\equiv0$을 이끌었다.
      depends_on:
      - 4.M1
      steps:
      - 4b-2
    - id: 4.A1
      mark_type: A
      points: 15
      evidence: |
        $g(x)=0$을 얻었다.
      depends_on:
      - 4.R1
      steps:
      - 4b-2
    - id: 4.A2
      mark_type: A
      points: 15
      evidence: |
        (가)에 $x=0$을 대입해 $a=10$을 얻었다.
      depends_on:
      - 4.R1
      steps:
      - 4b-3
    deductions: []
