stimuli: []
stem: |
  실수 전체의 집합에서 미분가능한 함수 $f(x)$는 다음 조건을 만족시킨다.

  (가) $f'(x)=f(x^2)-5x^2$

  (나) $f'(x)\ge5$

  (다) $f(1)=a$이고 $f(0)=5$이다.
subparts:
- id: '1'
  stem: |
    $x=1$일 때 $y=f(x)$의 접선의 방정식 $y=h(x)$를 $a$의 식으로 나타내시오.
  points: 60
  depends_on: []
  answer:
    kind: expression
    value: (a-5)*x + 5
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '(가)에 $x=1$: $f''(1)=f(1)-5=a-5$.'
    steps:
    - id: 1a
      content: $h(x)=(a-5)(x-1)+a=(a-5)x+5$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - (가)에 $x=1$을 넣어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.151
    steps:
    - id: 1b-1
      content: |
        (가)에 $x=1$을 대입하면 $f'(1)=f(1)-5=a-5$이다.
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-2
      content: |
        접선은 $y=(a-5)(x-1)+a$, 즉 $h(x)=(a-5)x+5$이다.
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
