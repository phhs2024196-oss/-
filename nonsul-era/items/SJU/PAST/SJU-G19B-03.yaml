- id: '3'
  stem: |
    $x\ge0$일 때 $g(x)=f(x)-h(x)$의 최솟값을 구하시오.
  points: 60
  depends_on:
  - '1'
  - '2'
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g'(x)=f(x^2)-5x^2-a+5$, $g''=2x(f'(x^2)-5)\ge0$, $g'(1)=0$.
    steps:
    - id: 3a
      content: $g$는 $x=1$에서 최솟값 $g(1)=0$
      criteria:
      - 3.M1
      - 3.M2
      - 3.R1
      - 3.A1
    hint_ladder:
    - $g'(x)$를 (가)로 바꿔 보자.
    - $g''(x)$의 부호는?
    - $g'(1)$의 값은?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.151
    steps:
    - id: 3b-1
      content: |
        $g(x)=f(x)-(a-5)x-5$이므로 (가)에 의해 $g'(x)=f'(x)-a+5=f(x^2)-5x^2-a+5$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $g''(x)=2xf'(x^2)-10x=2x\{f'(x^2)-5\}\ge0$ $(x\ge0)$이므로 $g'(x)$는 $x\ge0$에서 감소하지 않는다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $g'(1)=f(1)-5-a+5=0$이므로 $0\le x\le1$에서 $g'(x)\le0$, $x\ge1$에서 $g'(x)\ge0$이다.
      criteria:
      - 3.R1
    - id: 3b-4
      content: |
        따라서 $g$는 $x=1$에서 최솟값 $g(1)=f(1)-h(1)=a-a=0$을 가진다.
      criteria:
      - 3.A1
  - id: S3-ALT
    audience: ALT
    method_no: 2
    key_idea: 원 해설 별해 — $g$가 아래로 볼록하고 $g'(1)=0$.
    source_flow: 해설교재 p.151 별해
    steps:
    - id: 3c-1
      content: |
        $g'(x)=f(x^2)-5x^2-a+5$, $g'(1)=0$, $g(1)=0$이고 $g''(x)=2x\{f'(x^2)-5\}\ge0$이므로 $x\ge0$에서 $g$는 아래로 볼록하다.
      criteria:
      - 3.M1
      - 3.M2
    - id: 3c-2
      content: |
        아래로 볼록한 함수는 $g'=0$인 점에서 최소이므로 최솟값은 $g(1)=0$이다.
      criteria:
      - 3.R1
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
