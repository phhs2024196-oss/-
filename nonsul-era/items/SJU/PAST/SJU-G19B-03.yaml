  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.151
    steps:
    - id: 2b-1
      content: |
        $u(x)=f(x)-5x$라 하면 $u'(x)=f'(x)-5\ge0$ (조건 (나))이다.
      criteria:
      - 2.M1
      - 2.R1
    - id: 2b-2
      content: |
