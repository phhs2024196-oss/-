key_idea: |
  $g'(x)=f(x^2)-5x^2-a+5$이고 $g''=2x\{f'(x^2)-5\}\ge0$, $g'(1)=0$; $g(0)=g(1)=0$으로 $[0,1]$에서 $g\equiv0$.
stuck: |
  (3-3)에서 (가)를 써서 $g'$을 $f(x^2)$로 바꾸고 다시 미분해 (나)를 쓰는 발상
