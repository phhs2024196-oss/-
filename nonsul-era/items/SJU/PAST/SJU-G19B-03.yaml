      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $f'(1)=a-5$를 얻었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-1
    - id: 1.A2
      mark_type: A
      points: 20
      evidence: |
        $h(x)=(a-5)x+5$를 얻었다.
      depends_on:
      - 1.M1
      - 1.A1
      steps:
      - 1b-2
    deductions: []
