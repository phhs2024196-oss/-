      depends_on:
      - 3.M1
      steps:
      - 3b-2
      - 3c-1
    - id: 3.R1
      mark_type: R
      points: 15
      evidence: |
        $g'(1)=0$과 $g'$의 단조성(또는 볼록성)으로 $x=1$에서 최소임을 보였다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
      - 3c-2
    - id: 3.A1
