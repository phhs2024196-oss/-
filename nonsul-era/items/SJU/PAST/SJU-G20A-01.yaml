intent: |
  접선의 $y$절편이 주어진 함수가 되도록 하는 조건을 미분 등식으로 바꾸어 이계도함수를 구하고, 초기 조건으로 함수를 복원하는 능력을 본다.
key_idea: |
  점 $(t,f(t))$에서의 접선의 $y$절편은 $f(t)-tf'(t)=g(t)$이고, 양변을 미분하면 $-tf''(t)=g'(t)$.
stuck: |
  $y$절편 식 $f(t)-tf'(t)$를 미분하면 $f'(t)$가 소거되어 $-tf''(t)$만 남는다는 점, 그리고 $f'(1)$을 (1-1)의 두 절편으로 정하는 점
idea_tags: [IDEA-TANGENT-INTERCEPT-ODE]
tags: [접선, 절편, 함수 결정]

