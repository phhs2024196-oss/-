stimuli: []

stem: |
  함수 $f(x)$는 양의 실수에서 정의되고 두 번 미분가능하다. 임의의 양의 실수 $t$에 대하여 곡선 $y=f(x)$ 위의 점 $(t,f(t))$에서의 접선을 $l$이라 하자. 직선 $l$은 $y$축과 $(0,g(t))$에서 만나고 $x$축과 $(h(t),0)$에서 만난다. 이 경우 $g(t)=\dfrac2t-\ln t$이고 $h(1)=\dfrac23$이다.

subparts:
- id: '1'
  stem: |
    $f(1)$을 구하시오.
  points: 70
  depends_on: []
  answer: {kind: value, value: '-1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t=1$의 접선은 $(0,2)$, $(\tfrac23,0)$을 지나므로 기울기 $-3$, $f(1)=2-3=-1$.
    steps:
    - {id: 1a, content: '$f^{\prime}(1)=-3$, $f(1)=-1$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $t=1$일 때 접선이 지나는 두 점을 적어 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.135
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $(1,f(1))$에서의 접선은 두 점 $(0,g(1))=(0,2)$와 $(h(1),0)=\left(\tfrac23,0\right)$을 지난다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        기울기 $f'(1)=-\dfrac{2}{2/3}=-3$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        접선 $y=-3x+2$ 위에 $(1,f(1))$이 있으므로 $f(1)=-1$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        $t=1$의 접선이 $(0,2)$와 $\left(\tfrac23,0\right)$을 지남을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $f'(1)=-3$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 25
      evidence: |
        $f(1)=-1$을 얻었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $f''(t)$를 구하시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: '2/t**3 + 1/t**2', equivalents: ['(t+2)/t**3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(t)=f(t)-tf'(t)$를 미분하면 $g'(t)=-tf''(t)$.
    steps:
    - {id: 2a, content: '$-\tfrac2{t^2}-\tfrac1t=-tf^{\prime\prime}(t)\Rightarrow f^{\prime\prime}(t)=\tfrac2{t^3}+\tfrac1{t^2}$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - 접선의 $y$절편을 $f(t)$, $f'(t)$, $t$로 나타내자.
    - 그 식을 $t$에 대해 미분하면 무엇이 소거되는가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.135
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $(t,f(t))$에서의 접선은 $y-f(t)=f'(t)(x-t)$이므로 $y$절편은 $f(t)-tf'(t)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        즉 $\dfrac2t-\ln t=f(t)-tf'(t)$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        양변을 $t$에 대하여 미분하면 $-\dfrac2{t^2}-\dfrac1t=f'(t)-\{f'(t)+tf''(t)\}=-tf''(t)$.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        따라서 $f''(t)=\dfrac2{t^3}+\dfrac1{t^2}$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        접선의 방정식에서 $y$절편 $f(t)-tf'(t)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        $f(t)-tf'(t)=\dfrac2t-\ln t$로 놓았다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 25
      evidence: |
        양변을 $t$에 대해 미분해 $-tf''(t)$를 얻었다(곱의 미분 포함).
      depends_on: [2.A1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        $f''(t)=\dfrac2{t^3}+\dfrac1{t^2}$을 얻었다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3126}
  misconceptions:
  - id: MC-CAL-3126
    outcome_code: '71'
    wrong_work: '$y$절편을 $f(t)+tf^{\prime}(t)$로 두어 $f^{\prime\prime}$의 부호가 반대로 나옴'
    detect_cue: 접선식에 $x=0$을 넣을 때 $-t$의 부호를 놓쳤다
    feedback: $y=f'(t)(x-t)+f(t)$에 $x=0$을 넣으면 $f(t)-tf'(t)$입니다.
    remedy: [RL-1]

- id: '3'
  stem: |
    $f(t)$를 구하시오.
  points: 80
  depends_on: ['1', '2']
  answer: {kind: expression, value: '1/t - log(t) - t - 1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f''$을 두 번 적분하고 $f'(1)=-3$, $f(1)=-1$로 상수를 정한다.
    steps:
    - {id: 3a, content: '$f^{\prime}(t)=-\tfrac1{t^2}-\tfrac1t-1$, $f(t)=\tfrac1t-\ln t-t-1$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2']}
    hint_ladder:
    - $f'(1)$의 값은 (1-1)에서 이미 구했다.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.135
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f''(t)$를 적분하면 $f'(t)=-\dfrac1{t^2}-\dfrac1t+C$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $f'(1)=-3$이므로 $C=-1$, $f'(t)=-\dfrac1{t^2}-\dfrac1t-1$.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        다시 적분하면 $f(t)=\dfrac1t-\ln t-t+D$이고, $f(1)=-1$이므로 $D=-1$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        따라서 $f(t)=\dfrac1t-\ln t-t-1$이다(검산: $f(t)-tf'(t)=\dfrac2t-\ln t$).
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $f''$을 적분해 적분상수를 포함한 $f'$을 썼다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A2], max_points: 20}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $f'(1)=-3$으로 $f'(t)=-\dfrac1{t^2}-\dfrac1t-1$을 얻었다.
      depends_on: [3.M1]
      ft: {allowed: true, from: [1.A1], max_points: 20}
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        다시 적분하고 $f(1)=-1$로 상수를 정하려 했다.
      depends_on: [3.A1]
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        $f(t)=\dfrac1t-\ln t-t-1$을 얻었다.
      depends_on: [3.M2]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3004}
  misconceptions:
  - id: MC-CAL-3004
    outcome_code: '71'
    wrong_work: '$f(1)$은 쓰지만 $f^{\prime}(1)=-3$을 쓰지 않아 적분상수 하나가 남음'
    detect_cue: 접선의 기울기 조건을 초기 조건으로 쓰지 않았다
    feedback: 접선은 함숫값과 기울기를 모두 알려 줍니다. $f'(1)=-3$으로 첫 적분상수를 정하세요.
    remedy: [RL-2]

