intent: |
  공간에서 한 점을 지나는 직선과 평면의 교점을 매개변수로 구하고, 구에 그은 접선의 접점들이 한 평면 위에 있음을 수직 조건으로 보이며, 접점에 대응하는 그림자 점의 좌표를 최대화하는 능력을 본다.
key_idea: |
  직선 $\mathrm{P}+s(\mathrm{Q}-\mathrm{P})$의 $z$좌표가 $0$인 $s=\tfrac4{4-c}$에서 $\mathrm{Q}'$의 $y$좌표 $\tfrac{4b}{4-c}$. 접점 조건 $\overrightarrow{\mathrm{CQ}}\perp\overrightarrow{\mathrm{PQ}}$와 구의 방정식을 빼면 평면 $x+2z=5$.
stuck: |
  접점들의 집합이 평면 위에 있다는 것을 구의 방정식과 수직 조건의 차로 얻는 점, 그리고 (3-3)에서 $b$를 $c$로 나타내 한 변수 함수로 만드는 점
