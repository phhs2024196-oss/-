intent: |
  두 함수의 제곱의 합과 비가 주어질 때 음함수 미분으로 도함수의 비를 구하고, 비의 극한과 최솟값을 이용해 한 함수의 극한과 최댓값을 구하는 능력을 본다.
key_idea: |
  $f^2+g^2=1$을 미분하면 $\dfrac{f'}{g'}=-\dfrac gf$, 또 $g=\dfrac{1}{\sqrt{(f/g)^2+1}}$이므로 $g$의 최대는 $\dfrac fg$의 최소에서 생긴다.
stuck: |
  $f$, $g$를 따로 구하지 않고 비 $\dfrac fg=\dfrac{3x^2-3x+7}{x^2+1}$만으로 $f=\dfrac{1}{\sqrt{1+(g/f)^2}}$, $g=\dfrac{1}{\sqrt{(f/g)^2+1}}$로 표현하는 발상
idea_tags: [IDEA-IMPLICIT-RATIO, IDEA-MONOTONE-COMPOSITION]
tags: [음함수 미분, 함수의 극한, 최대]

