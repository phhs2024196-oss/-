stimuli: []

stem: |
  함수 $f(x)$와 $g(x)$는 양의 실수에서 정의되고 미분가능하다. 임의의 양수 $x$에 대하여 다음 조건을 만족한다.
  (가) $f(x)>0$, $g(x)>0$
  (나) $\{f(x)\}^2+\{g(x)\}^2=1$
  (다) $\dfrac{f(x)}{g(x)}=\dfrac{3x^2-3x+7}{x^2+1}$

subparts:
- id: '1'
  stem: |
    극한값 $\displaystyle\lim_{x\to3}\frac{f'(x)}{g'(x)}$를 구하시오.
  points: 80
  depends_on: []
  answer: {kind: value, value: '-2/5', equivalents: ['-0.4'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $2ff'+2gg'=0$에서 $\dfrac{f'}{g'}=-\dfrac gf$, $\dfrac{f(3)}{g(3)}=\dfrac52$.
    steps:
    - {id: 1a, content: '$\lim_{x\to3}\tfrac{f^{\prime}}{g^{\prime}}=-\tfrac{g(3)}{f(3)}=-\tfrac25$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - (나)를 미분해 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.138
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\{f(x)\}^2+\{g(x)\}^2=1$을 $x$로 미분하면 $2f(x)f'(x)+2g(x)g'(x)=0$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $g'(x)\ne0$인 $x$에서 $\dfrac{f'(x)}{g'(x)}=-\dfrac{g(x)}{f(x)}$이다. ([참고] $g'(a)=0$이면 $f'(a)=0$이고, (다)를 미분한 식 $\dfrac{f'g-fg'}{g^2}=\dfrac{(3x+1)(x-3)}{(x^2+1)^2}$에서 $a=3$이므로 $x\ne3$이면 $g'(x)\ne0$.)
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\displaystyle\lim_{x\to3}\frac{f'(x)}{g'(x)}=-\lim_{x\to3}\frac{g(x)}{f(x)}=-\frac{g(3)}{f(3)}=-\frac25$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: |
        (나)를 미분해 $2ff'+2gg'=0$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 25
      evidence: |
        $\dfrac{f'}{g'}=-\dfrac gf$로 바꾸었다($x\ne3$에서 $g'\ne0$ 언급 시 가산 없음, 누락 감점 없음).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 25
      evidence: |
        (다)의 값 $\dfrac{f(3)}{g(3)}=\dfrac52$로 $-\dfrac25$를 얻었다.
      depends_on: [1.A1]
      implied_ok: true
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    극한값 $\displaystyle\lim_{x\to\infty}f(x)$를 구하시오.
  points: 80
  depends_on: []
  answer: {kind: value, value: '3*sqrt(10)/10', equivalents: ['3/sqrt(10)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f=\dfrac{1}{\sqrt{1+(g/f)^2}}$, $\dfrac fg\to3$.
    steps:
    - {id: 2a, content: '$\lim f=\tfrac{1}{\sqrt{1+1/9}}=\tfrac{3}{\sqrt{10}}$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - (나)를 $f^2$로 묶어 $f$를 비 $\tfrac gf$로 나타내자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.138
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\{f(x)\}^2\left(1+\left(\dfrac{g(x)}{f(x)}\right)^2\right)=1$이고 $f(x)>0$이므로 $f(x)=\dfrac{1}{\sqrt{1+\left(\frac{g(x)}{f(x)}\right)^2}}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\displaystyle\lim_{x\to\infty}\frac{f(x)}{g(x)}=\lim_{x\to\infty}\frac{3x^2-3x+7}{x^2+1}=3$.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $\displaystyle\lim_{x\to\infty}f(x)=\frac{1}{\sqrt{1+\left(\frac13\right)^2}}=\frac{3}{\sqrt{10}}=\frac{3\sqrt{10}}{10}$.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 30
      evidence: |
        $f>0$을 써서 $f=\dfrac{1}{\sqrt{1+(g/f)^2}}$(또는 동치식)로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $\dfrac fg\to3$을 구했다.
      depends_on: [2.M1]
      implied_ok: true
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 30
      evidence: |
        $\dfrac{3\sqrt{10}}{10}$을 얻었다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    함수 $g(x)$의 최댓값을 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: value, value: '2*sqrt(29)/29', equivalents: ['2/sqrt(29)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g=\dfrac{1}{\sqrt{(f/g)^2+1}}$은 $\dfrac fg$가 최소일 때 최대이고, $\dfrac fg$는 $x=3$에서 최소 $\dfrac52$.
    steps:
    - {id: 3a, content: '$g(3)=\tfrac{1}{\sqrt{25/4+1}}=\tfrac{2}{\sqrt{29}}$', criteria: ['3.M1', '3.A1', '3.R1', '3.A2']}
    hint_ladder:
    - $g$를 비 $\tfrac fg$로 나타내 보자.
    - $\tfrac fg$의 최솟값은 어디서 생기는가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.138
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\dfrac{d}{dx}\left(\dfrac{f(x)}{g(x)}\right)=\dfrac{d}{dx}\dfrac{3x^2-3x+7}{x^2+1}=\dfrac{(3x+1)(x-3)}{(x^2+1)^2}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $x>0$에서 $0<x<3$이면 음, $x>3$이면 양이므로 $\dfrac fg$는 $x=3$에서 최솟값 $\dfrac{f(3)}{g(3)}=\dfrac52$을 가진다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $\{g(x)\}^2\left(\left(\dfrac{f}{g}\right)^2+1\right)=1$, $g>0$이므로 $g(x)=\dfrac{1}{\sqrt{\left(\frac{f(x)}{g(x)}\right)^2+1}}$이고, $\dfrac fg>0$이 작을수록 $g$가 크므로 $g$는 $x=3$에서 최댓값을 가진다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $g(3)=\dfrac{1}{\sqrt{\left(\frac52\right)^2+1}}=\dfrac{2}{\sqrt{29}}=\dfrac{2\sqrt{29}}{29}$.
      criteria: ['3.A2']
  - id: S3-ALT
    audience: ALT
    source_flow: 해설교재 p.138 별해
    method_no: 2
    key_idea: 원 해설 별해 — $f=\dfrac{3x^2-3x+7}{x^2+1}g$를 (나)에 넣어 $g(x)=\left\{1+\left(\dfrac{3x^2-3x+7}{x^2+1}\right)^2\right\}^{-1/2}$을 직접 미분.
    steps:
    - id: 3c-1
      content: |
        $g'(x)=-\dfrac12\left\{1+\left(\dfrac{3x^2-3x+7}{x^2+1}\right)^2\right\}^{-3/2}\cdot2\cdot\dfrac{3x^2-3x+7}{x^2+1}\cdot\dfrac{(3x+1)(x-3)}{(x^2+1)^2}$이므로 $g$는 $x=3$에서 최대이고 $g(3)=\left\{1+\left(\tfrac52\right)^2\right\}^{-1/2}=\dfrac{2\sqrt{29}}{29}$.
      criteria: ['3.M1', '3.A1', '3.R1', '3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $\dfrac fg$(또는 $g$)를 미분해 $(3x+1)(x-3)$ 인수를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3c-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $x>0$에서의 부호로 $\dfrac fg$의 최솟값 $\dfrac52$ ($x=3$)를 얻었다.
      depends_on: [3.M1]
      steps: [3b-2, 3c-1]
    - id: 3.R1
      mark_type: R
      points: 20
      evidence: |
        $g=\dfrac1{\sqrt{(f/g)^2+1}}$의 감소 관계로 $g$가 $x=3$에서 최대임을 설명했다.
      depends_on: [3.A1]
      ft: {allowed: true, from: [2.M1], max_points: 20}
      steps: [3b-3, 3c-1]
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        최댓값 $\dfrac{2\sqrt{29}}{29}$을 얻었다.
      depends_on: [3.R1]
      steps: [3b-4, 3c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(직접 미분 별해)}
  - {code: '71', misconception: MC-CAL-3003}
  misconceptions:
  - id: MC-CAL-3003
    outcome_code: '71'
    wrong_work: '$\left(\tfrac fg\right)^{\prime}=0$인 $x=3$을 찾고 곧바로 $g$의 최대라 결론'
    detect_cue: $\tfrac fg$가 최소일 때 $g$가 최대인 이유(감소 관계)나 증감 판정이 없다
    feedback: $\tfrac fg$의 최소와 $g$의 최대를 잇는 관계 $g=\tfrac1{\sqrt{(f/g)^2+1}}$과 부호 변화를 적으세요.
    remedy: [RL-1]

