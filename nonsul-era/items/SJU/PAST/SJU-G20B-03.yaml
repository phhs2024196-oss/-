stimuli: []

stem: |
  구 $(x+2)^2+(y-1)^2+z^2=16$과 평면 $2x-y+2z=4$의 교선인 원을 $\mathrm{A}$, $\mathrm{A}$의 중심 $\mathrm{C}$를 $xy$평면에 정사영한 점을 $\mathrm{C}'$라 하자, 원 $\mathrm{A}$ 위에 있는 임의의 점 $\mathrm{P}$를 $xy$평면에 정사영한 점을 $\mathrm{P}'$라 하자.
  (그림: 구와 비스듬한 평면의 교선인 원 A, 원의 중심 C와 원 위의 점 P, $xy$평면 위의 정사영 $\mathrm{C}'$, $\mathrm{P}'$)

subparts:
- id: '1'
  stem: |
    점 $\mathrm{C}$의 좌표를 구하시오.
  points: 70
  depends_on: []
  answer: {kind: value, value: '(0, 0, 2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 구의 중심 $(-2,1,0)$에서 법선 $(2,-1,2)$ 방향 직선과 평면의 교점.
    steps:
    - {id: 1a, content: '$(2t-2,-t+1,2t)$, $9t-5=4\Rightarrow t=1$, $\mathrm{C}(0,0,2)$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 단면 원의 중심은 구의 중심에서 평면에 내린 수선의 발이다.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.140
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        벡터 $(2,-1,2)$가 평면 $2x-y+2z=4$에 수직이므로 C는 구의 중심 $(-2,1,0)$을 지나는 직선 위의 점 $(2t-2,-t+1,2t)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        C는 평면 위에 있으므로 $2(2t-2)-(-t+1)+2(2t)=4$, $t=1$. 따라서 $\mathrm{C}(0,0,2)$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 35
      evidence: |
        구의 중심에서 평면의 법선 방향 직선을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 35
      evidence: |
        $\mathrm{C}(0,0,2)$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    점 $\mathrm{C}'$로부터 거리가 최대가 되는 점 $\mathrm{P}'$의 좌표를 모두 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: set, value: '{(sqrt(35)/5, 2*sqrt(35)/5, 0), (-sqrt(35)/5, -2*sqrt(35)/5, 0)}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{CP}}$가 $xy$평면과 평행($z=2$)할 때 정사영 거리가 $\sqrt7$로 최대.
    steps:
    - {id: 2a, content: '$z=2$, $(x+2)^2+(y-1)^2=12$, $2x-y=0\Rightarrow\mathrm{P}^{\prime}=\pm(\tfrac{\sqrt{35}}5,\tfrac{2\sqrt{35}}5,0)$', criteria: ['2.M1', '2.R1', '2.A1']}
    hint_ladder:
    - $\overline{\mathrm{C'P'}}$는 $\overrightarrow{\mathrm{CP}}$의 어떤 성분의 길이인가?
    - $\overline{\mathrm{CP}}$는 일정하다.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.140
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\overline{\mathrm{C'P'}}$는 $\overrightarrow{\mathrm{CP}}$를 $xy$평면에 정사영한 길이이고 $\overline{\mathrm{CP}}$는 반지름으로 일정하므로, 최대가 되려면 $\overrightarrow{\mathrm{CP}}$가 $xy$평면과 평행해야 한다. 즉 P의 $z$좌표는 $2$이다.
      criteria: ['2.M1', '2.R1']
    - id: 2b-2
      content: |
        $z=2$를 넣으면 $(x+2)^2+(y-1)^2=12$, $2x-y=0$이므로 $\mathrm{P}'\left(\dfrac{\sqrt{35}}5,\dfrac{2\sqrt{35}}5,0\right)$ 또는 $\left(-\dfrac{\sqrt{35}}5,-\dfrac{2\sqrt{35}}5,0\right)$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        정사영 거리를 $\overrightarrow{\mathrm{CP}}$의 수평 성분으로 보고 최대 조건을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 20}
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 25
      evidence: |
        $\overline{\mathrm{CP}}$가 일정하므로 $\overrightarrow{\mathrm{CP}}$가 $xy$평면과 평행할 때 최대라는 근거(P의 $z$좌표 $2$)를 적었다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 35
      evidence: |
        두 점 $\pm\left(\dfrac{\sqrt{35}}5,\dfrac{2\sqrt{35}}5,0\right)$을 모두 구했다.
      depends_on: [2.R1]
      steps: [2b-2]
    deductions:
    - code: D2-1
      condition: 두 점 중 하나만 답함
      effect: minus
      value: 15
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3127}
  misconceptions:
  - id: MC-GEO-3127
    outcome_code: '71'
    wrong_work: '$\overline{\mathrm{C^{\prime}P^{\prime}}}=\overline{\mathrm{CP}}=\sqrt7$로 일정하다고 보고 최대점을 정하지 못함'
    detect_cue: 정사영 거리와 공간 거리를 같게 놓았다
    feedback: 정사영하면 수직 성분이 사라집니다. $\overline{\mathrm{C'P'}}^2=\overline{\mathrm{CP}}^2-(z-2)^2$을 쓰세요.
    remedy: [RL-1]

- id: '3'
  stem: |
    점 $\mathrm{C}'$로부터 거리가 최소가 되는 점 $\mathrm{P}'$의 좌표를 모두 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: set, value: '{(4*sqrt(35)/15, -2*sqrt(35)/15, 0), (-4*sqrt(35)/15, 2*sqrt(35)/15, 0)}', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 최소일 때의 $\overrightarrow{\mathrm{CP_1}}$은 최대일 때의 $\overrightarrow{\mathrm{CP_2}}$와 수직이므로 $(x,y,z-2)\cdot(1,2,0)=0$, $x=-2y$.
    steps:
    - {id: 3a, content: '$x=-2y$, $45y^2=28$ $\Rightarrow\mathrm{P}^{\prime}=\pm(\tfrac{4\sqrt{35}}{15},-\tfrac{2\sqrt{35}}{15},0)$', criteria: ['3.M1', '3.A1', '3.A2']}
    hint_ladder:
    - 원 위에서 수평 성분이 가장 작은 반지름 방향은 수평 성분이 가장 큰 방향과 어떤 관계인가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.140
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        최소가 되는 $\mathrm{P}'$ 위의 점 $\mathrm{P}_1(x,y,z)$와 최대가 되는 점 $\mathrm{P}_2\left(\tfrac{\sqrt{35}}5,\tfrac{2\sqrt{35}}5,2\right)$에 대하여 $\overrightarrow{\mathrm{CP_1}}\perp\overrightarrow{\mathrm{CP_2}}$이므로 $(x,y,z-2)\cdot(1,2,0)=0$, 즉 $x=-2y$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $(x+2)^2+(y-1)^2+z^2=16$, $2x-y+2z=4$, $x=-2y$를 연립하면 $45y^2=28$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        따라서 $\mathrm{P}'\left(\dfrac{4\sqrt{35}}{15},-\dfrac{2\sqrt{35}}{15},0\right)$ 또는 $\left(-\dfrac{4\sqrt{35}}{15},\dfrac{2\sqrt{35}}{15},0\right)$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 30
      evidence: |
        최소 방향이 최대 방향과 수직임을 이용해 $x=-2y$를 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 30}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 25
      evidence: |
        세 식을 연립해 $45y^2=28$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 25
      evidence: |
        두 점을 모두 구했다.
      depends_on: [3.M1, 3.A1]
      steps: [3b-3]
    deductions:
    - code: D3-1
      condition: 두 점 중 하나만 답함
      effect: minus
      value: 15
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

