intent: |
  구와 평면의 교선인 원의 중심을 법선 벡터로 구하고, 원 위의 점을 $xy$평면에 정사영한 점과 중심의 정사영 사이 거리가 최대·최소가 되는 위치를 수평·수직 성분으로 판단하는 능력을 본다.
key_idea: |
  $\overline{\mathrm{C'P'}}^2=\overline{\mathrm{CP}}^2-(z_{\mathrm{P}}-2)^2=7-(z_{\mathrm{P}}-2)^2$이므로 최대는 $\overrightarrow{\mathrm{CP}}$가 $xy$평면과 평행할 때($z=2$), 최소는 그 방향과 수직인 $\overrightarrow{\mathrm{CP}}$일 때.
stuck: |
  정사영 거리가 $\overrightarrow{\mathrm{CP}}$의 수평 성분이라는 점과, 원의 반지름이 일정하므로 수직 성분이 작을수록 정사영 거리가 크다는 판단
idea_tags: [IDEA-PROJECTION-HORIZONTAL-COMPONENT, IDEA-NORMAL-LINE-CENTER]
tags: [공간좌표, 구와 평면, 정사영, 범위 밖(현행)]

