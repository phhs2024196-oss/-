key_idea: |
  바구니 구성은 $a+b+c=9$ $(a,b,c\ge2)$의 해 $10$가지이고 주문은 그중 $4$개를 중복 허용해 고르는 $_{10}\mathrm{H}_4$이다. 표본평균의 표준화 값이 같도록 $\tfrac{a-250}{15/4}=-2$로 놓는다.
stuck: |
