intent: |
  곡선의 길이와 넓이가 같다는 적분 관계식을 미분해 $\sqrt{1+\{f'\}^2}=f$를 얻고, 이를 다시 미분해 $f''=f$로 바꾼 뒤 보조함수 $g=f+f'$의 미분방정식과 인수분해로 $f$를 결정하는 능력을 본다.
key_idea: |
  $\sqrt{1+\{f'(t)\}^2}=f(t)$에서 $1+\{f'\}^2=f^2$, 미분하면 $f''=f$ $(f'>0)$이다. $g=f+f'$이면 $g'=g$이고, $f^2-\{f'\}^2=1$을 $(f+f')(f-f')$로 인수분해한다.
stuck: |
  적분 관계식을 미분해 피적분함수끼리의 관계로 바꾸는 것, 그리고 $f^2-\{f'\}^2=1$을 합·차의 곱으로 보는 것
