  - '$(e-1)-\tfrac1t=x''(t)\left(1-\tfrac1{x(t)}\right)$'
  - '$\tfrac1{t^2}=x''''(t)-\tfrac{x''''(t)x(t)-x''(t)^2}{x(t)^2}$'
  - '$x''''(a)=0$ 가정 ⇒ $x(a)=(e-1)a$ ⇒ 모순'
