intent: |
  구간별로 정의된 함수와의 합성 $f(x(t))=(e-1)t-\ln t$로 암묵적으로 주어진 함수 $x(t)$에 대해, 최솟값 비교로 $x(t)>1$을 보이고, 음함수 미분으로 미분계수를 구하며, $x''(a)=0$을 가정한 귀류법과 사잇값 정리로 $x''(t)>0$을 증명하는 능력을 본다.
key_idea: |
  $x''(a)=0$이면 둘째 미분식에서 $\tfrac1a=\tfrac{x'(a)}{x(a)}$, 첫째 미분식에서 $x'(a)=e-1$이므로 $x(a)=(e-1)a$가 되는데, 이를 원래 식에 넣으면 $\ln a=\ln\{(e-1)a\}$로 모순이다. $x''(1)>0$과 사잇값 정리로 부호가 고정된다.
stuck: |
  $x''$이 $0$이 되는 점이 없음을 귀류법으로 보이고, 한 점의 부호와 연속성(사잇값 정리)으로 전 구간 부호를 결정하는 구조를 스스로 세우는 것
idea_tags: [IDEA-NO-ZERO-THEN-IVT-SIGN, IDEA-IMPLICIT-DIFF-CONTRADICTION]
tags: [음함수 미분, 귀류법, 사잇값 정리, 이계도함수]
