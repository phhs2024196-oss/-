intent: |
  $\pm1$이 적힌 공을 소재로, 기록값의 분산을 '+1'의 횟수로 나타내 부등식을 풀고, 비복원 추출에서 순서 조건을 만족하는 경우를 분류해 확률을 구하며, 같은 부호 묶음의 개수를 중복조합(양의 정수해)으로 세는 능력을 본다.
key_idea: |
  기록값의 제곱이 모두 $1$이므로 분산은 $1-m^2$, $m=\tfrac X5-1$이다. $a+b+c=10$, $a,b,c\le5$, $a>b>c$이면 $(5,4,1)$, $(5,3,2)$뿐이다. 묶음 $5$개는 한 부호 $3$묶음·다른 부호 $2$묶음이고 $10$개를 $k$묶음으로 나누는 방법은 $_9\mathrm{C}_{k-1}$이다.
stuck: |
  분산을 평균 하나로 표현하는 것, 그리고 묶음 개수 조건을 '+1' 묶음과 '-1' 묶음 개수의 교대 구조로 바꾸는 것
