stem: |
  상자 안에 '+1'이 적힌 공 $10$개와 '-1'이 적힌 공 $10$개가 들어 있다.
  다음 물음에 각각 답하시오.

subparts:
- id: '1'
  stem: |
    상자에서 임의로 공을 한 개 꺼내 나온 수를 기록하고 다시 넣는 시행을 반복하였다. $10$번을 반복할 때 공에 적힌 수의 분산이 $0.2$ 이상 $0.4$ 이하였다면, '+1'이 몇 번 나왔는지 가능한 횟수를 모두 구하시오.
  points: 70
  depends_on: []
  answer: {kind: set, value: '{1, 9}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '+1이 $X$번이면 평균 $\tfrac X5-1$, 분산 $1-\left(\tfrac X5-1\right)^2$이다.'
    steps:
    - id: 1a
      content: |
        $0.2\le1-\left(\tfrac X5-1\right)^2\le0.4\iff15\le(X-5)^2\le20\Rightarrow X=1,9$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - 기록한 수의 제곱은 모두 얼마인가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.118
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        '+1'이 나온 횟수를 $X$라 하면 평균은 $m=\dfrac{X-(10-X)}{10}=\dfrac{2X-10}{10}$이고, 기록한 수의 제곱의 합은 $10$이므로 분산은 $V=\dfrac{10}{10}-\left(\dfrac{2X-10}{10}\right)^2=1-\left(\dfrac X5-1\right)^2$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $0.2\le V\le0.4\iff0.6\le\left(\dfrac X5-1\right)^2\le0.8\iff15\le(X-5)^2\le20$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $X$는 $0$ 이상 $10$ 이하의 정수이므로 $(X-5)^2=16$, 즉 $X=1$ 또는 $X=9$이다.
      criteria: ['1.A2']
  - id: S1-ALT
    audience: ALT
    source_flow: 해설교재 p.118 별해
    method_no: 2
    key_idea: 분산 $=\tfrac1{10}\sum x_i^2-m^2=1-m^2$이고 $m$은 $-1,-0.8,\cdots,1$ 중 하나이다.
    steps:
    - id: 1c-1
      content: |
        $0.2\le1-m^2\le0.4$를 만족하는 $m$은 $\pm0.8$뿐이고 $m=\dfrac X5-1$에서 $X=1$ 또는 $9$이다.
      criteria: ['1.M1', '1.A1', '1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        분산을 $X$(또는 평균 $m$)의 식 $1-\left(\dfrac X5-1\right)^2$으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        조건을 $15\le(X-5)^2\le20$(또는 $0.6\le m^2\le0.8$)으로 바꾸었다.
      depends_on: [1.M1]
      steps: [1b-2, 1c-1]
    - id: 1.A2
      mark_type: A
      points: 25
      evidence: |
        정수 조건으로 $X=1$, $9$를 모두 구했다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(평균 별해)}
  - {code: '71', misconception: MC-PRB-3109}
  misconceptions:
  - id: MC-PRB-3109
    outcome_code: '71'
    wrong_work: '이항분포 $B(10,\tfrac12)$의 분산 $2.5$ 등 확률변수 $X$의 분산과 기록값(표본)의 분산을 혼동'
    detect_cue: 분산 식에 기록값의 평균 $m$이 아니라 $np(1-p)$가 쓰였다
    feedback: 묻는 것은 기록된 $10$개 수의 분산입니다. $\tfrac1{10}\sum x_i^2-m^2$로 계산하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    상자에서 $A$가 $5$개의 공을 임의로 꺼낸 후, $B$가 $5$개의 공을 임의로 꺼내고, $C$는 나머지 공을 가진다. $A$, $B$, $C$가 가진 공 중에서 '+1'이 적힌 공의 개수를 각각 $a$, $b$, $c$라 하자. $a>b>c$일 확률을 $\dfrac qp$로 나타낼 때 $q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.)
  points: 80
  depends_on: []
  answer: {kind: value, value: '125', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a+b+c=10$, $a,b\le5$에서 $a>b>c$는 $(5,4,1)$, $(5,3,2)$뿐이다.
    steps:
    - id: 2a
      content: |
        $P=\dfrac{{}_{10}\mathrm{C}_5}{{}_{20}\mathrm{C}_5}\cdot\dfrac{{}_5\mathrm{C}_4\,{}_{10}\mathrm{C}_1+{}_5\mathrm{C}_3\,{}_{10}\mathrm{C}_2}{{}_{15}\mathrm{C}_5}=\dfrac{5^3}{11\cdot13\cdot17\cdot19}$
      criteria: ['2.M1', '2.A1', '2.M2', '2.A2']
    hint_ladder:
    - $a+b+c$는 얼마이고 $a$, $b$의 최댓값은?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.118
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a+b+c=10$이고 $a,b\le5$이므로 $a>b>c$를 만족하는 $(a,b,c)$는 $(5,4,1)$, $(5,3,2)$뿐이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        각 경우의 확률은 순서대로 꺼내는 확률의 곱으로
        $(5,4,1)$: $\dfrac{{}_{10}\mathrm{C}_5}{{}_{20}\mathrm{C}_5}\times\dfrac{{}_5\mathrm{C}_4\times{}_{10}\mathrm{C}_1}{{}_{15}\mathrm{C}_5}\times\dfrac{{}_1\mathrm{C}_1\times{}_9\mathrm{C}_9}{{}_{10}\mathrm{C}_{10}}$,
        $(5,3,2)$: $\dfrac{{}_{10}\mathrm{C}_5}{{}_{20}\mathrm{C}_5}\times\dfrac{{}_5\mathrm{C}_3\times{}_{10}\mathrm{C}_2}{{}_{15}\mathrm{C}_5}\times\dfrac{{}_2\mathrm{C}_2\times{}_8\mathrm{C}_8}{{}_{10}\mathrm{C}_{10}}$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $\dfrac{252}{15504}\times\dfrac{50+450}{3003}=\dfrac{125}{46189}=\dfrac{5^3}{11\cdot13\cdot17\cdot19}$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        $125$와 $46189$는 서로소이므로 $q=125$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $(a,b,c)=(5,4,1)$, $(5,3,2)$의 두 경우를 빠짐없이 찾았다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 25
      evidence: |
        각 경우의 확률을 단계별 조합의 곱(또는 다항계수)으로 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        확률 $\dfrac{125}{46189}$을 얻었다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 15
      evidence: |
        기약분수로 정리해 $q=125$를 답했다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-3108}
  misconceptions:
  - id: MC-CNT-3108
    outcome_code: '71'
    wrong_work: '$(5,4,1)$만 고려하여 확률 $\dfrac{25}{92378}$, $q=25$를 얻음'
    detect_cue: $(5,3,2)$ 경우가 빠졌다
    feedback: $a+b+c=10$, $a\le5$, $b\le5$ 조건에서 $a>b>c$인 순서쌍을 모두 나열해 보세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    공 $20$개를 잘 섞어서 일렬로 나열하였다. 이때 같은 수끼리 연속되어 있는 부분을 하나의 묶음이라 하자. 예를 들어 '+1 +1 -1 -1 +1'에는 묶음이 $3$개 있고, '-1 +1 -1 +1 +1'에는 묶음이 $4$개 있다. 묶음이 $5$개가 되도록 공 $20$개를 일렬로 나열하는 방법의 수를 구하시오.
  points: 80
  depends_on: []
  answer: {kind: value, value: '648', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '+1로 시작하면 +1 묶음 $3$개, -1 묶음 $2$개이고 $10$개를 $k$묶음으로 나누는 방법은 $_9\mathrm{C}_{k-1}$이다.'
    steps:
    - id: 3a
      content: |
        $2\times{}_9\mathrm{C}_2\times{}_9\mathrm{C}_1=2\times36\times9=648$
      criteria: ['3.M1', '3.M2', '3.A1', '3.A2']
    hint_ladder:
    - 묶음은 부호가 번갈아 나타난다. 5묶음이면 각 부호의 묶음은 몇 개인가?
    - 같은 공 $10$개를 빈 묶음 없이 $k$개로 나누는 방법의 수는?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.118~119
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (단계 1) 묶음이 $5$개인 나열은 '+1' 묶음으로 시작하는 경우와 '-1' 묶음으로 시작하는 경우가 있고, 대칭이므로 두 경우의 수는 같다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (단계 2) '+1' 묶음으로 시작해 묶음이 $5$개이면 부호가 번갈아 나타나므로 '+1' 묶음 $3$개, '-1' 묶음 $2$개이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        (단계 3) 같은 수가 적힌 $10$개의 공을 $k$개의 묶음으로 나누는 방법의 수는 $X_1+\cdots+X_k=10$의 양의 정수해의 개수와 같으므로 $_k\mathrm{H}_{10-k}={}_9\mathrm{C}_{k-1}$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        (단계 4) '+1' $10$개를 $3$묶음으로, '-1' $10$개를 $2$묶음으로 나누는 방법은 $_3\mathrm{H}_7\times{}_2\mathrm{H}_8={}_9\mathrm{C}_2\times{}_9\mathrm{C}_1=36\times9=324$이다.
      criteria: ['3.A1']
    - id: 3b-5
      content: |
        (단계 5) 전체 방법의 수는 $2\times324=648$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        시작 부호 두 경우와 각 부호의 묶음 수($3$개, $2$개)를 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3b-2]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        $10$개를 $k$묶음으로 나누는 수를 양의 정수해의 개수 $_9\mathrm{C}_{k-1}$로 셌다.
      depends_on: []
      implied_ok: false
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        한 경우의 수 $324$를 얻었다.
      depends_on: [3.M1, 3.M2]
      steps: [3b-4]
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        $648$을 얻었다.
      depends_on: [3.M1, 3.A1]
      steps: [3b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-3108}
  misconceptions:
  - id: MC-CNT-3108
    outcome_code: '71'
    wrong_work: '시작 부호 두 경우를 고려하지 않아 $324$를 답하거나, 묶음 나누기를 $_{k}\mathrm{H}_{10}$(빈 묶음 허용)으로 셈'
    detect_cue: $\times2$가 없거나 $_9\mathrm{C}_{k-1}$ 대신 빈 묶음을 허용한 수가 쓰였다
    feedback: 묶음에는 공이 적어도 하나 있어야 하고, '+1'로 시작하는 경우와 '-1'로 시작하는 경우를 모두 세야 합니다.
    remedy: [RL-2]

