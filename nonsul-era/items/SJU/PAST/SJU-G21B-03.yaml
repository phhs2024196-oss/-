intent: |
  원점을 지나는 직선이 그래프 아래에 놓이는 기울기의 집합 $A_f$를 다루며, 반례로 공집합임을 보이고, $f''\ge0$일 때 보조함수의 최솟값(또는 평균값 정리)으로 접선이 그래프 아래에 있음을 증명하고, 한쪽 극한으로 기울기가 $f'(0)$ 하나뿐임을 보이는 능력을 본다.
key_idea: |
  $g(x)=f(x)-f(0)-f'(0)x$이면 $g'(0)=0$이고 $g'$이 증가하므로 $g\ge g(0)=0$이다. $m\in A_f$이면 $x>0$, $x<0$에서 $\tfrac{f(x)-f(0)}{x}$와 $m$의 대소가 반대이므로 양쪽 극한으로 $m=f'(0)$이다.
stuck: |
  "모든 실수 $x$에 대하여" 조건을 반례 하나로 깨는 것, 그리고 $x>0$과 $x<0$을 나누어 부등호 방향을 바꾼 뒤 우극한·좌극한을 쓰는 것
