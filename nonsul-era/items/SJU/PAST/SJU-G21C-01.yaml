key_idea: |
  $(g\circ f)$의 미분 불가능 후보는 $f$의 꺾인 점($x=1,\tfrac32$)과 $f(x)=1$($g$의 꺾인 점)이 되는 점($x=0,\tfrac32$)이고, 각 점에서 좌우 미분계수를 비교한다.
stuck: |
  $g$가 $x=1$에서 꺾이므로 $f(x)=1$이 되는 $x=0$도 후보가 된다는 점, 그리고 $h^{-1}$의 미분계수가 $1$의 좌우에서 $\tfrac1e$, $\tfrac1{1+e}$로 다르다는 점
