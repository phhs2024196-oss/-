stimuli: []

stem: |
  실수 전체의 집합에서 정의된 세 함수
  $$f(x)=\begin{cases}x-\dfrac12 & ,\ x\ge\dfrac32\\[2mm] 2x-2 & ,\ 1<x\le\dfrac32\\[2mm] -x+1 & ,\ x\le1\end{cases},\quad g(x)=\begin{cases}(x-1)^2 & ,\ x\ge1\\ -x+1 & ,\ x<1\end{cases},\quad h(x)=\begin{cases}x+e^x-e & ,\ x\ge1\\ ex+1-e & ,\ x<1\end{cases}$$
  에 대하여, 다음 물음에 각각 답하시오.

subparts:
- id: '1'
  stem: |
    함수 $y=h(x)$가 역함수를 가짐을 보이시오.
  points: 70
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 구간에서 도함수가 양수이고 $x=1$에서 연속이므로 $h$는 실수 전체에서 증가하는 일대일 대응이다.
    steps:
    - {id: 1a, content: '$h^{\prime}(x)=1+e^x\ (x>1)$, $h^{\prime}(x)=e\ (x<1)$, $h$는 $x=1$에서 연속 $\Rightarrow$ 증가 $\Rightarrow$ 역함수 존재', criteria: ['1.M1', '1.R1', '1.R2']}
    hint_ladder:
    - 역함수가 존재하려면 함수가 어떤 성질을 가져야 하는가?
    - 각 구간에서 도함수의 부호와 $x=1$에서의 연결 상태를 확인하자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.122
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        각 구간에서 미분하면 $x>1$일 때 $h'(x)=1+e^x>0$, $x<1$일 때 $h'(x)=e>0$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $x=1$에서 $h(1)=1+e-e=1$이고 $\displaystyle\lim_{x\to1-}h(x)=e+1-e=1$이므로 $h$는 $x=1$에서 연속이다.
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        따라서 $h$는 $x<1$과 $x\ge1$에서 각각 증가하고 두 구간이 연속으로 이어지므로 실수 전체의 집합에서 증가함수이다. 증가함수는 일대일 대응이므로 $h$는 역함수를 가진다. ■
      criteria: ['1.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: |
        두 구간에서 $h'(x)$를 구해 모두 양수임을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 20
      evidence: |
        $x=1$에서의 함숫값과 좌극한이 모두 $1$이어서 연속임을 보였다.
      depends_on: []
      steps: [1b-2]
    - id: 1.R2
      mark_type: R
      points: 20
      evidence: |
        실수 전체에서 증가함수 $\Rightarrow$ 일대일 대응 $\Rightarrow$ 역함수 존재의 순서로 결론지었다.
      depends_on: [1.M1, 1.R1]
      steps: [1b-3]
    deductions: []
