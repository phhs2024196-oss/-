    remedy: [RL-1]

- id: '2'
  stem: |
    집합 $A=\{a\in\mathbb{R}\mid(g\circ f)(x)\text{는 }x=a\text{에서 미분 가능하지 않다.}\}$를 구하시오.
  points: 80
  depends_on: []
  answer: {kind: set, value: '{0, 1, 3/2}', equivalents: ['{0,1,1.5}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $(g\circ f)(x)$를 구간별 식으로 정리하면 $x=0,1,\tfrac32$에서만 식이 바뀌고, 세 점 모두 좌우 기울기가 다르다.
    steps:
    - {id: 2a, content: '$(g\circ f)(x)=(x-\tfrac32)^2,\,-2x+3,\,x,\,x^2$ (구간 $x\ge\tfrac32$, $1<x\le\tfrac32$, $0<x\le1$, $x\le0$) $\Rightarrow A=\{0,1,\tfrac32\}$', criteria: ['2.M1', '2.A1', '2.R1', '2.A2']}
    hint_ladder:
    - $f(x)$의 값이 $1$보다 큰지 작은지에 따라 $g$의 식이 달라진다.
    - $f(x)=1$이 되는 $x$를 모두 찾자.
    - 식이 바뀌는 점에서 좌우 접선의 기울기를 비교하자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.122
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)\ge1$인지 $f(x)<1$인지에 따라 $g$의 식을 골라 합성하면
        $$(g\circ f)(x)=\begin{cases}\left(x-\dfrac32\right)^2 & ,\ x\ge\dfrac32\\[2mm] -2x+3 & ,\ 1<x\le\dfrac32\\ x & ,\ 0<x\le1\\ x^2 & ,\ x\le0\end{cases}$$
        이다($x\ge\tfrac32$이면 $f(x)\ge1$, $1<x<\tfrac32$이면 $0<f(x)<1$, $0<x\le1$이면 $0\le f(x)<1$, $x\le0$이면 $f(x)\ge1$).
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        각 구간 안에서는 다항함수이므로 미분가능하고, 식이 바뀌는 $x=0,1,\tfrac32$만 조사하면 된다(세 점에서 모두 연속).
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $x=\tfrac32$: 오른쪽 기울기 $0$, 왼쪽 기울기 $-2$. $x=1$: 오른쪽 $-2$, 왼쪽 $1$. $x=0$: 오른쪽 $1$, 왼쪽 $0$. 세 점 모두 좌우 미분계수가 달라 미분 가능하지 않다.
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        따라서 $A=\left\{0,\,1,\,\dfrac32\right\}$이다.
      criteria: ['2.A2']
  - id: S2-ALT
    audience: ALT
    source_flow: 해설교재 p.122~123 별해
    method_no: 2
    key_idea: 원 해설의 별해 — 합성함수를 구하지 않고 $f$의 꺾인 점($1,\tfrac32$)과 $f(x)=1$인 점($0,\tfrac32$)에서 차분몫의 좌우 극한을 직접 계산한다.
    steps:
    - id: 2c-1
      content: |
        $f$는 $x=1,\tfrac32$에서만, $g$는 $x=1$에서만 미분 불가능하고 $f(x)=1$인 점은 $x=0,\tfrac32$이므로 후보는 $0,1,\tfrac32$이다.
      criteria: ['2.A1']
    - id: 2c-2
      content: |
        $x=0$: $\displaystyle\lim_{t\to0+}\frac{g(1-t)-g(1)}{t}=1$, $\displaystyle\lim_{t\to0-}\frac{g(1-t)-g(1)}{t}=\lim\frac{t^2}{t}=0$.
        $x=1$: $\displaystyle\lim_{t\to0+}\frac{g(2t)-g(0)}{t}=-2$, $\displaystyle\lim_{t\to0-}\frac{g(-t)-g(0)}{t}=1$.
        $x=\tfrac32$: $\displaystyle\lim_{t\to0+}\frac{g(1+t)-g(1)}{t}=0$, $\displaystyle\lim_{t\to0-}\frac{g(1+2t)-g(1)}{t}=-2$. 따라서 $A=\{0,1,\tfrac32\}$.
      criteria: ['2.R1', '2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 30
      evidence: |
        $f(x)$의 값과 $1$의 대소에 따라 $(g\circ f)(x)$를 구간별 식으로 정리했다(또는 차분몫으로 직접 조사할 후보를 세웠다).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        조사할 점이 $x=0,1,\tfrac32$뿐이고 나머지에서는 미분가능함을 밝혔다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.R1
      mark_type: R
      points: 25
      evidence: |
        세 점 각각에서 좌우 미분계수(접선의 기울기)를 구해 서로 다름을 보였다.
      depends_on: [2.A1]
      steps: [2b-3, 2c-2]
    - id: 2.A2
      mark_type: A
      points: 10
      evidence: |
        $A=\{0,1,\tfrac32\}$를 답했다.
      depends_on: [2.R1]
      steps: [2b-4, 2c-2]
    deductions:
    - code: D2-1
      condition: 원소 $0$을 빠뜨림($f(x)=1$인 점 누락)
      effect: cap
      value: 40
  outcome_codes:
  - {code: '20', meaning: 만점(합성함수 식 정리)}
  - {code: '21', meaning: 만점(차분몫 직접 계산)}
  - {code: '71', misconception: MC-CAL-3111}
  misconceptions:
  - id: MC-CAL-3111
    outcome_code: '71'
    wrong_work: '$f$와 $g$가 꺾이는 $x=1,\tfrac32$만 보고 $A=\{1,\tfrac32\}$'
    detect_cue: $f(x)=1$이 되는 $x=0$을 조사하지 않았다
    feedback: 바깥 함수 $g$의 꺾인 점 $1$에 대응하는 $x$, 즉 $f(x)=1$인 점도 합성함수의 미분 불가능 후보입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    함수 $(h^{-1}\circ f)(x)$가 $x=\dfrac32$에서 미분 가능하지 않음을 보이시오.
  points: 80
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f(\tfrac32)=1$이고 오른쪽에서 $f(\tfrac32+t)=1+t$, 왼쪽에서 $1+2t$이므로 우미분계수 $\dfrac{1}{h'(1+)}=\dfrac1{1+e}$, 좌미분계수 $\dfrac{2}{e}$.
    steps:
    - {id: 3a, content: '우: $\tfrac{1}{1+e}$, 좌: $\tfrac{2}{e}$ $\Rightarrow$ 서로 달라 미분 불가능', criteria: ['3.M1', '3.A1', '3.A2', '3.R1']}
    hint_ladder:
    - $f(\tfrac32)$와 $h^{-1}(1)$의 값을 먼저 구하자.
    - $x=\tfrac32$의 오른쪽과 왼쪽에서 $f$의 식이 다르다.
    - $h^{-1}(1+t)=x$로 놓으면 차분몫이 $\dfrac{x-1}{h(x)-1}$ 꼴이 된다.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.123
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(\tfrac32)=1$, $h(1)=1$이므로 $h^{-1}(1)=1$이다. 작은 $t>0$에 대해 $f(\tfrac32+t)=1+t$, 작은 $t<0$에 대해 $f(\tfrac32+t)=1+2t$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        오른쪽: $h^{-1}(1+t)=x$로 두면 $t\to0+$일 때 $x\to1+$이고 $1+t=h(x)$이므로
        $$\lim_{t\to0+}\frac{h^{-1}(1+t)-h^{-1}(1)}{t}=\lim_{x\to1+}\frac{x-1}{x+e^x-e-1}=\lim_{x\to1+}\frac{1}{1+\dfrac{e^x-e}{x-1}}=\frac{1}{1+e}.$$
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        왼쪽: $y<1$이면 $h^{-1}(y)=\dfrac{y-1+e}{e}$이므로
        $$\lim_{t\to0-}\frac{h^{-1}(1+2t)-h^{-1}(1)}{t}=\lim_{t\to0-}\frac{\frac1e(2t+1)+1-\frac1e-1}{t}=\frac2e.$$
      criteria: ['3.A2']
    - id: 3b-4
      content: |
        $\dfrac{1}{1+e}\ne\dfrac2e$이므로 좌우 미분계수가 달라 $(h^{-1}\circ f)(x)$는 $x=\tfrac32$에서 미분 가능하지 않다. ■
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $f(\tfrac32)=1$, $h^{-1}(1)=1$과 $x=\tfrac32$ 좌우의 $f$ 식을 써서 좌우 차분몫을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.R2], max_points: 20}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 25
      evidence: |
        우미분계수 $\dfrac{1}{1+e}$을 근거와 함께 구했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        좌미분계수 $\dfrac2e$를 구했다.
      depends_on: [3.M1]
      steps: [3b-3]
    - id: 3.R1
      mark_type: R
      points: 15
      evidence: |
        두 값이 다르므로 미분 가능하지 않다고 결론지었다.
      depends_on: [3.A1, 3.A2]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3112}
  misconceptions:
  - id: MC-CAL-3112
