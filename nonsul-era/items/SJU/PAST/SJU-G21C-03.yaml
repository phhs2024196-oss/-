intent: |
  주기함수와 증가함수의 곱의 정적분을 구간별로 나누어 평가하는 부등식을 증명하고, 구분구적법과 조임 정리로 수열의 극한을 구하는 능력을 본다.
key_idea: |
  $a_n=\dfrac1n\displaystyle\sum_{k=1}^n\int_{k-1}^k f\!\left(\tfrac tn\right)g(t)\,dt$로 나누고, 각 구간에서 $f\!\left(\tfrac{k-1}{n}\right)\le f\!\left(\tfrac tn\right)\le f\!\left(\tfrac kn\right)$, $\int_{k-1}^kg=\tfrac12$을 쓴다.
stuck: |
  $t=nx$로 치환해 적분 구간을 길이 1짜리 $n$개로 나누고, 각 구간에서 증가함수 $f$를 오른쪽 끝값으로 위에서 누르는 발상
