intent: |
  정적분을 포함한 등식에서 상수인 정적분을 문자로 처리해 함수와 상수를 결정하고, 두 지수곡선 사이 직사각형 넓이의 최대와 접선·수평선과 곡선으로 둘러싸인 넓이를 구하는 능력을 본다.
key_idea: |
  $x=0$을 대입하면 $a\displaystyle\int_0^{\ln3}e^{-t}f(t)\,dt=1$이 되어 $\displaystyle\int_0^xf(t)\,dt=e^x-e^{3x}$, 미분하면 $f(x)=e^x-3e^{3x}$이다.
stuck: |
  우변의 정적분이 $x$와 무관한 상수라는 점, 그리고 $x=0$ 대입으로 그 상수와 $a$의 곱이 $1$임을 끌어내는 단계
