intent: |
  극좌표 꼴 매개변수 곡선의 속력을 구해 이동 거리 조건을 미분 등식으로 바꾸고, 그 등식에서 곱의 부호에 관한 부등식을 이끌어 정적분으로 함수를 결정하는 능력을 본다.
key_idea: |
  $\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2=\{f'(t)\}^2+\{f(t)\}^2(2t-2)^2$이고, 이동 거리 조건을 미분하면 $\{f'\}^2+f^2(2x-2)^2=e^{2x}\{4(x^2-1)^2+(x+2)^2\}$. 정리하면 $(\,f'^2-(x+2)^2e^{2x})(f^2-(x+1)^2e^{2x})=-(2x-2)^2(f^2-(x+1)^2e^{2x})^2\le0$.
stuck: |
  (3-2)에서 두 차이 $f'^2-(x+2)^2e^{2x}$와 $f^2-(x+1)^2e^{2x}$의 곱이 음이 아닌 수의 $-1$배가 되도록 묶는 정리, (3-3)에서 곱이 $\tfrac12\{(f-(x+1)e^x)^2\}'$임을 알아보는 발상
idea_tags: [IDEA-POLAR-SPEED, IDEA-SQUARE-DERIVATIVE-MONOTONE]
tags: [매개변수 곡선, 곡선의 길이, 부등식, 함수 결정]

