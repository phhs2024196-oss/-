  - '산술평균과 기하평균의 관계'
  - '로그함수'
  tools:
  - '거리 대신 거리의 제곱 $D(x)$를 미분'
  - '임계점 관계식 $2t^2e^{-2\alpha^2}=1$로 $t$ 소거'
  - '수직 조건(기울기 곱 $-1$)으로 $r=\alpha+\frac1{2\alpha}$'
  - '$\alpha+\frac1{2\alpha}\ge\sqrt2$ (등호 $\alpha=\frac{1}{\sqrt2}$)'
  conditions:
  - '$t>\frac{\sqrt2}{2}$ ⇒ $2t^2>1$ ⇒ 임계점 $\alpha=\sqrt{\frac{\ln(2t^2)}{2}}>0$ 존재'
  - '$0<x<\alpha$에서 $D''<0$, $x>\alpha$에서 $D''>0$'
  - '등호 조건에서 $t=\sqrt{\frac e2}>\frac{\sqrt2}{2}$ 확인'
  stimuli_used: []
  subpart_links: '(1-3)은 (1-2)의 α=sqrt(ln(2t^2)/2), 즉 2t^2 e^{-2α^2}=1 을 사용'

