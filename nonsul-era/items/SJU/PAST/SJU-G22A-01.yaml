intent: |
  지수함수 곡선의 변곡점과 원점까지의 최단 거리를 구하고, 수직 조건으로 $x$절편을 접점의 좌표로 나타내 산술·기하평균으로 최소화하는 능력을 본다.
key_idea: |
  거리의 제곱 $D(x)=x^2+t^2e^{-2x^2}$의 임계점에서 $2t^2e^{-2\alpha^2}=1$. 이 관계로 $r=\alpha+\dfrac{t^2e^{-2\alpha^2}}{\alpha}=\alpha+\dfrac1{2\alpha}$이 되어 $\alpha=\dfrac{1}{\sqrt2}$에서 최소.
stuck: |
  $t^2e^{-2\alpha^2}=\tfrac12$을 이용해 $r$을 $\alpha$만의 식으로 바꾸는 것
