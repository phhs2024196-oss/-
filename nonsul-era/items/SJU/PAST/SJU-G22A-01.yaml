  - '원점에서 가장 가까운 곡선 위의 점 $\mathrm{P}$, 변곡점 $\mathrm{Q}$'
  - '$\angle\mathrm{OPS}=\frac\pi2$인 $x$축 위의 점 $\mathrm{S}(r,0)$'
