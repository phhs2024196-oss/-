# 세종대 2022학년도 신입학 수시모집 논술고사[A] 문제 2 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# type: null — SJU T01~T10 에 해당 유형 없음. 신설 제안: "함수 부등식·함수방정식과 미분계수의 정의(좌·우극한 조임)"
# [해설 불일치] (2-2) 원 해설 본풀이는 lim_{y→x-} g(y)=g(x) 를 써서 g 의 연속성을 가정한다(조건에 없음). 별해(좌·우 극한을
#   각각 한쪽 부등식으로 조임)는 이 가정이 필요 없으므로 주 해설 B 는 별해 흐름으로 두고 본풀이는 ALT 로 넣었다.
# [해설 불일치] (2-3) 원 해설은 f'' 의 존재를 가정해 2f''(x)+f''(-2x)=0 과 f''≥0 에서 f''=0 을 끌어낸다(g 의 미분가능성은
#   조건에 없음). 주 해설 B 는 원 해설의 단계 순서(미분 → g 의 단조성 → f'≡0 → f(0)=2)를 따르되 f'' 대신 f'(=g)의
#   단조성만으로 f'≡0 을 보였고, 원 해설의 f'' 풀이는 ALT 로 넣었다. 정답 f(x)=2 는 같다.
