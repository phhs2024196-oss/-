intent: |
  함수 부등식의 변수 교환과 미분계수의 정의(좌·우극한)로 $f'=g$를 증명하고, 도함수의 단조성과 함수방정식으로 함수를 결정하는 능력을 본다.
key_idea: |
  $x>y$이면 $g(y)\le\dfrac{f(x)-f(y)}{x-y}\le g(x)$. 좌·우 극한을 각각 취하면 $f'(x)=g(x)$이고, 동시에 $g$(즉 $f'$)는 증가(감소하지 않는) 함수이다. $4f'(x)=f'(-2x)$와 단조성으로 $f'\equiv0$.
stuck: |
  $x$와 $y$를 바꾸는 발상, 극한을 한쪽 방향씩 나눠 취하는 것, 그리고 부등식에서 $g$의 단조성을 읽어 내는 것
