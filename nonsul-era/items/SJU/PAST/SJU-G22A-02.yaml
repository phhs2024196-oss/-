stimuli: []

stem: |
  실수 전체의 집합에서 미분가능한 함수 $f(x)$와 $g(x)$는 다음 조건을 만족시킨다.

  모든 실수 $x$, $y$에 대하여 $f(x)-f(y)\le(x-y)g(x)$이다.

subparts:
- id: '1'
  stem: |
    모든 실수 $x$, $y$에 대하여 $(x-y)g(y)\le f(x)-f(y)$가 성립함을 보이시오.
  points: 70
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 주어진 식에서 $x$와 $y$를 바꾼 뒤 양변에 $-1$을 곱한다.
    steps:
    - {id: 1a, content: '$f(y)-f(x)\le(y-x)g(y)\Rightarrow(x-y)g(y)\le f(x)-f(y)$', criteria: ['1.M1', '1.R1']}
    hint_ladder:
    - 조건은 모든 $x$, $y$에 대해 성립한다. 두 문자의 역할을 바꾸면?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.98
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건은 모든 실수 $x$, $y$에 대해 성립하므로 $x$와 $y$를 바꾸어 쓰면 $f(y)-f(x)\le(y-x)g(y)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        양변에 $-1$을 곱하면 부등호 방향이 바뀌어 $f(x)-f(y)\ge(x-y)g(y)$, 즉 $(x-y)g(y)\le f(x)-f(y)$이다. ■
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 40
      evidence: |
        조건식에서 $x$와 $y$를 교환한 식 $f(y)-f(x)\le(y-x)g(y)$를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 30
      evidence: |
        $-1$을 곱하며 부등호 방향을 바꿔 결론을 이끌었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRF-0003}
  misconceptions:
  - id: MC-PRF-0003
    outcome_code: '71'
    wrong_work: '결론 $(x-y)g(y)\le f(x)-f(y)$에서 출발해 조건식과 같은 꼴로 바꾼 뒤 "성립"이라 씀'
    detect_cue: 결론을 가정하고 시작한다
    feedback: 조건식에서 출발해 결론에 도달하세요. 변수 교환 한 번이면 됩니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    모든 실수 $x$에 대하여 $f'(x)=g(x)$임을 보이시오.
  points: 80
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x>y$이면 몫 $\le g(x)$, $x<y$이면 몫 $\ge g(x)$. 좌·우 극한에서 $f'(x)\le g(x)\le f'(x)$.
    steps:
    - {id: 2a, content: '$y\to x-$: $f^{\prime}(x)\le g(x)$; $y\to x+$: $f^{\prime}(x)\ge g(x)$', criteria: ['2.M1', '2.R1', '2.R2']}
    hint_ladder:
    - 조건식을 $x-y$로 나누어 보자. $x-y$의 부호에 따라 무엇이 달라지는가?
    - 미분계수는 좌극한과 우극한이 같다.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.98 별해
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        조건식 $f(x)-f(y)\le(x-y)g(x)$를 $x-y$로 나눈다. $x>y$이면 $\dfrac{f(x)-f(y)}{x-y}\le g(x)$이고, $x<y$이면 부등호 방향이 바뀌어 $\dfrac{f(x)-f(y)}{x-y}\ge g(x)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $f$는 미분가능하므로 $x$를 고정하고 $y\to x-$로 극한을 취하면 $f'(x)=\displaystyle\lim_{y\to x-}\dfrac{f(x)-f(y)}{x-y}\le g(x)$이다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        $y\to x+$로 극한을 취하면 $f'(x)=\displaystyle\lim_{y\to x+}\dfrac{f(x)-f(y)}{x-y}\ge g(x)$이다. 따라서 모든 실수 $x$에 대하여 $f'(x)=g(x)$이다. ■
      criteria: ['2.R2']
  - id: S2-ALT
    audience: ALT
    source_flow: 해설교재 p.98
    method_no: 2
    key_idea: 원 해설 본풀이 — $x>y$에서 $g(y)\le\dfrac{f(x)-f(y)}{x-y}\le g(x)$로 조이고 $y\to x-$. (단, $\lim_{y\to x-}g(y)=g(x)$를 쓰므로 $g$의 연속성이 추가로 필요하다.)
    steps:
    - id: 2c-1
      content: |
        (2-1)과 조건에서 $x>y$이면 $g(y)\le\dfrac{f(x)-f(y)}{x-y}\le g(x)$이고, $y\to x-$이면 $\displaystyle\lim_{y\to x-}g(y)\le f'(x)\le g(x)$이다. $g$가 연속이면 좌변이 $g(x)$이므로 $f'(x)=g(x)$이다.
      criteria: ['2.M1', '2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 25
      evidence: |
        조건식을 $x-y$로 나누되 $x>y$, $x<y$에 따라 부등호 방향을 구분해 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.R1
      mark_type: R
      points: 25
      evidence: |
        $y\to x-$의 극한으로 $f'(x)\le g(x)$를 이끌었다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.R2
      mark_type: R
      points: 30
      evidence: |
        $y\to x+$의 극한으로 $f'(x)\ge g(x)$를 이끌어 $f'(x)=g(x)$라 결론지었다(또는 $g$의 연속성 없이 성립하는 다른 정당한 근거).
      depends_on: [2.M1]
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: $\lim_{y\to x}g(y)=g(x)$를 근거 없이 사용(g 의 연속성 가정)
      effect: minus
      value: 15
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3087}
  misconceptions:
  - id: MC-CAL-3087
    outcome_code: '71'
    wrong_work: '$x<y$일 때도 $\dfrac{f(x)-f(y)}{x-y}\le g(x)$로 두어 한쪽 부등식 $f^{\prime}(x)\le g(x)$만 얻고 등호라고 결론'
    detect_cue: 음수로 나눌 때 부등호 방향을 유지했거나 한쪽 극한만 있다
    feedback: $x-y<0$으로 나누면 부등호가 바뀝니다. 좌·우 두 방향에서 각각 부등식을 얻어 조이세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    모든 실수 $x$에 대하여 $8f(x)+f(-2x)=18$일 때, $f(x)$를 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: expression, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 미분하면 $4f'(x)=f'(-2x)$. $f'=g$는 감소하지 않으므로 $x>0$에서 $f'(x)\ge f'(0)=0\ge f'(-2x)$이고 $f'\equiv0$.
    steps:
    - {id: 3a, content: '$4f^{\prime}(x)=f^{\prime}(-2x)$, $f^{\prime}(0)=0$, 단조성 ⇒ $f^{\prime}\equiv0$, $9f(0)=18$ ⇒ $f(x)=2$', criteria: ['3.M1', '3.M2', '3.R1', '3.A1']}
    hint_ladder:
    - 양변을 미분해 보자.
    - (2-2)의 부등식에서 $g$는 증가하는가 감소하는가?
    - $x>0$일 때 $f'(x)$와 $f'(-2x)$의 부호는?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.98
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $8f(x)+f(-2x)=18$의 양변을 미분하면 $8f'(x)-2f'(-2x)=0$, 즉 $4f'(x)-f'(-2x)=0$이다. (2-2)에 의해 $f'(x)=g(x)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (2-2)의 풀이에서 $x>y$이면 $g(y)\le\dfrac{f(x)-f(y)}{x-y}\le g(x)$이므로 $g(x)\ge g(y)$, 즉 $f'=g$는 감소하지 않는 함수이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $x=0$을 대입하면 $4f'(0)-f'(0)=0$이므로 $f'(0)=0$이다. $x>0$이면 단조성에서 $f'(x)\ge f'(0)=0$이고 $-2x<0$이므로 $f'(-2x)\le0$인데 $4f'(x)=f'(-2x)$이므로 $f'(x)=0$이다. $x<0$이면 $-2x>0$이므로 방금 보인 것에서 $f'(-2x)=0$이고 $f'(x)=\dfrac14f'(-2x)=0$이다. 따라서 모든 실수 $x$에서 $f'(x)=0$이고 $f$는 상수함수이다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $8f(0)+f(0)=18$이므로 $f(0)=2$이고, 모든 실수 $x$에 대하여 $f(x)=2$이다. (이때 $g=f'=0$이고 조건 $0\le0$이 성립한다.)
      criteria: ['3.A1']
  - id: S3-ALT
    audience: ALT
    source_flow: 해설교재 p.98
    method_no: 2
    key_idea: 원 해설 — $g'(x)\ge0$에서 $f''(x)\ge0$, $2f''(x)+f''(-2x)=0$이므로 $f''=0$. (단, $f$가 두 번 미분가능하다는 가정이 추가로 필요하다.)
    steps:
    - id: 3c-1
      content: |
        $4f'(x)-f'(-2x)=0$을 한 번 더 미분하면 $2f''(x)+f''(-2x)=0$이고 $f''=g'\ge0$이므로 $f''(x)=0$이다. $x=0$에서 $f'(0)=0$이므로 $f'\equiv0$, $f(0)=2$에서 $f(x)=2$.
      criteria: ['3.R1', '3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        함수방정식을 미분해 $4f'(x)=f'(-2x)$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        (2-2)의 부등식에서 $f'=g$가 감소하지 않음(또는 $g'\ge0$)을 밝혔다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.R1, 2.R2], max_points: 20}
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
      points: 30
      evidence: |
        $f'(0)=0$과 단조성(또는 $f''$의 부호)으로 모든 $x$에서 $f'(x)=0$임을 보였다.
      depends_on: [3.M1, 3.M2]
      steps: [3b-3, 3c-1]
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $f(0)=2$를 구해 $f(x)=2$를 답했다.
      depends_on: [3.R1]
      steps: [3b-4, 3c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점(단조성)}
  - {code: '21', meaning: 만점(이계도함수)}
  - {code: '71', misconception: MC-CAL-3088}
  misconceptions:
  - id: MC-CAL-3088
