- id: '2'
  stem: |
    $g(x)$를 구하고 도함수와 이계도함수를 이용하여 곡선 $y=g(x)$의 개형을 좌표평면에 그리시오. 또한 극대, 극소, 변곡점이 되는 $x$의 값을 모두 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: 'g = (x-1)*(x-3)**2*exp(x); max = [2]; min = [-1, 3]; inflection = [1, -sqrt(7), sqrt(7)]', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 극솟값 $0$이면 $x=3$은 중근, $f=(x-1)(x-3)^2$. $g'=(x+1)(x-2)(x-3)e^x$, $g''=(x-1)(x^2-7)e^x$.
    steps:
    - {id: 2a, content: '$g=(x-1)(x-3)^2e^x$; 극대 $x=2$, 극소 $x=-1,3$, 변곡점 $x=1,\pm\sqrt7$', criteria: ['2.M1', '2.A1', '2.A2', '2.R1']}
    hint_ladder:
    - $g(3)=0$이 극솟값이 되려면 $x=3$ 좌우에서 $g$의 부호는?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.99
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (3-1)과 (나)에서 $f(1)=f(3)=0$이다. $x=3$이 방정식 $f(x)=0$의 중근이 아니면 $x=3$의 좌우에서 $g$의 부호가 바뀌므로 $g(3)=0$이 극솟값일 수 없다. 따라서 $f(x)=(x-1)(x-3)^2$, $g(x)=(x-1)(x-3)^2e^x$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $g'(x)=(x+1)(x-2)(x-3)e^x$, $g''(x)=(x-1)(x^2-7)e^x$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        증감표에서 $g$는 $x=-1$, $3$에서 극소, $x=2$에서 극대이며, $g''$의 부호가 바뀌는 $x=1$, $\pm\sqrt7$에서 변곡점을 갖는다.
      criteria: ['2.A2']
    - id: 2b-4
      content: |
        $g(1)=g(3)=0$, $x<1$에서 $g(x)<0$, $x\to-\infty$이면 $g\to0$, $x\to\infty$이면 $g\to\infty$이므로 개형은 다음과 같다: 왼쪽에서 $0$에 가까운 음수로 시작해 $x=-\sqrt7$에서 오목이 바뀌며 감소, $x=-1$에서 극소(음수), 증가하며 $x=1$을 지나 양수, $x=2$에서 극대 $e^2$, $x=\sqrt7$을 지나 $x=3$에서 극소 $0$, 이후 급격히 증가. (이 $g$는 $x\ge1$에서 $g\ge0$, $x\le1$에서 $g\le0$이므로 (가)도 만족한다.)
      criteria: ['2.R1']
  - id: S2-ALT
    audience: ALT
    source_flow: 해설교재 p.99 별해
    method_no: 2
    key_idea: $g'(3)=\{f'(3)+f(3)\}e^3=f'(3)e^3=0$에서 $f'(3)=0$.
    steps:
    - id: 2c-1
      content: |
        $f(1)=f(3)=g(3)=g'(3)=0$이고 $g'(x)=\{f'(x)+f(x)\}e^x$이므로 $0=g'(3)=f'(3)e^3$, $f'(3)=0$이다. 따라서 $f(x)=(x-1)(x-3)^2$이다.
      criteria: ['2.M1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $x=3$이 중근(또는 $f'(3)=0$)임을 근거로 $f(x)=(x-1)(x-3)^2$, $g(x)=(x-1)(x-3)^2e^x$을 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.R2], max_points: 20}
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $g'(x)=(x+1)(x-2)(x-3)e^x$, $g''(x)=(x-1)(x^2-7)e^x$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        극대 $x=2$, 극소 $x=-1,\,3$, 변곡점 $x=1,\,\pm\sqrt7$을 모두 구했다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    - id: 2.R1
      mark_type: R
      points: 20
      evidence: |
        부호·극한을 반영해 개형을 그렸다(극점·변곡점·$x$절편 $1$, $3$ 표시, $x\to-\infty$에서 $0$에 접근).
      depends_on: [2.A2]
      steps: [2b-4]
    deductions: []
