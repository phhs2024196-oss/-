intent: |
  정적분으로 정의된 함수의 최솟값 조건과 극솟값 조건으로 삼차함수를 결정하고, $g(x)=f(x)e^x$의 개형을 그린 뒤, 방정식의 해의 개수를 접선과 평행이동한 곡선의 교점 개수로 바꿔 세는 능력을 본다.
key_idea: |
  $G(x)=\int_1^xg\ge0$, $G(1)=0$이면 $G$는 $x=1$에서 극소이므로 $g(1)=0$. 극솟값 $0$은 $x=3$이 중근이어야 하므로 $f=(x-1)(x-3)^2$. 방정식은 $g(t)+g'(t)(x-t)=g(x+1)$ ($x\ne t$)이므로 접선과 $y=g(x+1)$의 교점 개수.
stuck: |
  분수 방정식을 "점 $(t,g(t))$에서의 접선과 곡선 $y=g(x+1)$의 교점"으로 해석하는 것, 그리고 접선이 $y=g(x+1)$에도 접하는 $t=\alpha$를 찾는 것
