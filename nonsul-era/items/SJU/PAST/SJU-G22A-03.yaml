stimuli: []

stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$에 대하여 $g(x)=f(x)e^x$이라 정의할 때, 함수 $g(x)$는 다음 조건을 만족시킨다.

  (가) 모든 실수 $x$에 대하여 $\displaystyle\int_1^xg(t)\,dt\ge0$이다.
  (나) $g(x)$는 $x=3$에서 극솟값 $0$을 갖는다.

subparts:
- id: '1'
  stem: |
    $f(1)=0$임을 보이시오.
  points: 80
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $G(x)=\int_1^xg$는 $G(1)=0$인 최솟값을 가지므로 $G'(1)=g(1)=0$.
    steps:
    - {id: 1a, content: '$G\ge0=G(1)\Rightarrow G^{\prime}(1)=g(1)=0\Rightarrow f(1)=g(1)e^{-1}=0$', criteria: ['1.M1', '1.R1', '1.R2']}
    hint_ladder:
    - $G(x)=\int_1^xg(t)dt$로 두면 $G(1)$은?
    - 미분가능한 함수가 극소인 점에서 도함수는?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.99
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $G(x)=\displaystyle\int_1^xg(t)\,dt$라 하면 (가)에서 모든 실수 $x$에 대하여 $G(x)\ge0$이고 $G(1)=0$이므로 $G$는 $x=1$에서 극솟값(최솟값) $0$을 갖는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $G$는 미분가능하므로 $G'(1)=0$이고, 정적분과 미분의 관계에서 $G'(x)=g(x)$이므로 $g(1)=G'(1)=0$이다.
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        $f(x)=g(x)e^{-x}$이므로 $f(1)=g(1)e^{-1}=0$이다. ■
      criteria: ['1.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
