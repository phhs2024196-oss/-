  - id: MC-CAL-3089
    outcome_code: '71'
    wrong_work: '$f(1)=f(3)=0$만 써서 $f(x)=(x-1)(x-3)(x-c)$로 두고 $c$를 정하지 못함(또는 $c=1$)'
    detect_cue: 극솟값 $0$의 중근 조건이 없다
    feedback: $g(3)=0$이 극솟값이면 $x=3$의 좌우에서 $g$의 부호가 바뀌지 않아야 합니다. 즉 $x=3$은 중근입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    실수 $t$에 대하여 방정식 $g'(t)=\dfrac{g(x+1)-g(t)}{x-t}$를 만족시키는 서로 다른 실수 $x$의 개수를 $h(t)$라 정의하자. 구간 $[2,\,3]$에 속하는 $t$ 중에서 $h(t)=2$를 만족시키는 $t$의 개수를 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h(t)$는 점 $(t,g(t))$에서의 접선과 $y=g(x+1)$의 교점 중 $x\ne t$인 것의 개수. $t=2$, $\alpha$(공통접선), $3$에서만 $2$.
    steps:
    - {id: 3a, content: '$h(2)=2$, $2<t<\alpha$: $h\le1$, $h(\alpha)=2$, $\alpha<t<3$: $h=3$, $h(3)=2$ ⇒ 3개', criteria: ['3.M1', '3.R1', '3.R2', '3.A1']}
    hint_ladder:
    - 양변에 $x-t$를 곱하면 어떤 직선과 어떤 곡선의 교점이 되는가?
    - $t=2$와 $t=3$에서 접선은 각각 어떤 직선인가?
    - 접선이 $y=g(x+1)$에도 접하게 되는 $t$가 있는가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.99~100
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        주어진 방정식은 $g'(t)(x-t)+g(t)=g(x+1)$ ($x\ne t$)과 같으므로 $h(t)$는 곡선 $y=g(x)$ 위의 점 $(t,g(t))$에서의 접선이 곡선 $y=g(x+1)$과 만나는 점 중 $x$좌표가 $t$가 아닌 점의 개수이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $t=2$일 때 접선은 $y=g(2)=e^2$이고, $y=g(x+1)$은 $x=1$에서 극댓값 $e^2$을 가지므로 접선은 $x=1$에서 $y=g(x+1)$에 접하고 $x>2$인 한 점에서 더 만난다. 두 점 모두 $x\ne2$이므로 $h(2)=2$이다.
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        $t>2$로 늘리면 접선의 기울기는 음수이고 변곡점 $(\sqrt7,g(\sqrt7))$까지 감소하다 다시 증가한다. 이 동안 접선은 $y=g(x+1)$과 한 점에서만 만나다가, 접선이 $y=g(x+1)$에도 접하게 되는 $\alpha$($\sqrt7<\alpha<3$, 유일)에서 서로 다른 두 점에서 만난다. $\dfrac52<\sqrt7<\alpha<3$이므로 $(\alpha-3)^2<(\alpha-2)^2$이고 $g(\alpha)=(\alpha-1)(\alpha-3)^2e^\alpha<\alpha(\alpha-2)^2e^{\alpha+1}=g(\alpha+1)$이어서 두 교점의 $x$좌표는 모두 $\alpha$보다 작다. 따라서 $2<t<\alpha$이면 $h(t)\le1$, $h(\alpha)=2$이다.
      criteria: ['3.R2']
    - id: 3b-4
      content: |
        $\alpha<t<3$이면 접선은 $y=g(x+1)$과 서로 다른 세 점에서 만나고 그 $x$좌표는 모두 $t$보다 작으므로 $h(t)=3$이다. $t=3$이면 접선은 $y=0$이고 $y=g(x+1)$과 $x=0$, $x=2$의 두 점에서 만나며 모두 $3$보다 작으므로 $h(3)=2$이다.
      criteria: ['3.R2']
    - id: 3b-5
      content: |
        따라서 $[2,3]$에서 $h(t)=2$인 $t$는 $2$, $\alpha$, $3$의 $3$개이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
