stimuli: []

stem: |
  아래 그림에 있는 삼각형 $\mathrm{ABC}$는 시각 $t\ge0$에 따라 크기가 변하며, 다음 조건을 만족시킨다.

  (가) 시각 $t=0$에서 $\overline{\mathrm{BC}}=1$이다.
  (나) 임의의 시각 $t\ge0$에서 $\angle\mathrm{B}=\dfrac{\pi}{4}$이고 $\overline{\mathrm{BC}}:\overline{\mathrm{AB}}=1:2\sqrt2$이다.
  (다) 임의의 시각 $t>0$에서 삼각형 $\mathrm{ABC}$의 넓이의 순간변화율은 $\dfrac43t+6$이다.

  (그림: 밑변 $\mathrm{BC}$가 수평이고 $\mathrm{B}$가 왼쪽, $\mathrm{C}$가 오른쪽에 있으며 꼭짓점 $\mathrm{A}$는 $\mathrm{C}$보다 오른쪽 위에 있어 $\angle\mathrm{C}$가 둔각인 삼각형)

subparts:
- id: '1'
  stem: |
    $\sin\mathrm{C}$를 구하시오.
  points: 70
  depends_on: []
  answer: {kind: value, value: '2*sqrt(5)/5', equivalents: ['2/sqrt(5)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 변의 비와 $\angle\mathrm{B}$가 고정이므로 $t=0$의 삼각형에서 코사인법칙으로 $\overline{\mathrm{AC}}$를, 사인법칙으로 $\sin\mathrm{C}$를 구한다.
    steps:
    - id: 1a
      content: |
        $\overline{\mathrm{AC}}^2=1+8-2\cdot1\cdot2\sqrt2\cos\dfrac{\pi}{4}=5$, $\sin\mathrm{C}=\dfrac{2\sqrt2\sin\frac{\pi}{4}}{\sqrt5}=\dfrac{2\sqrt5}{5}$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2']
    hint_ladder:
    - 시각이 변해도 바뀌지 않는 것은 무엇인가?
    - 두 변과 끼인각을 알면 나머지 한 변은 어떤 법칙으로 구하는가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.101
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $t=0$에서 $\overline{\mathrm{BC}}=1$, $\overline{\mathrm{AB}}=2\sqrt2$, $\angle\mathrm{B}=\dfrac{\pi}{4}$이므로 코사인법칙에 의하여
        $\overline{\mathrm{AC}}^2=1^2+(2\sqrt2)^2-2\cdot1\cdot2\sqrt2\cos\dfrac{\pi}{4}=9-4=5$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $\overline{\mathrm{AC}}=\sqrt5$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        사인법칙 $\dfrac{\overline{\mathrm{AB}}}{\sin\mathrm{C}}=\dfrac{\overline{\mathrm{AC}}}{\sin\mathrm{B}}$에서 $\dfrac{\sin\mathrm{C}}{2\sqrt2}=\dfrac{\sin\frac{\pi}{4}}{\sqrt5}$이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        그러므로 $\sin\mathrm{C}=\dfrac{2\sqrt2\cdot\frac{\sqrt2}{2}}{\sqrt5}=\dfrac{2}{\sqrt5}=\dfrac{2\sqrt5}{5}$이다. 변의 비와 $\angle\mathrm{B}$가 일정하므로 이 값은 모든 시각에서 같다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        두 변 $\overline{\mathrm{BC}}$, $\overline{\mathrm{AB}}$와 끼인각 $\angle\mathrm{B}$로 코사인법칙 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        $\overline{\mathrm{AC}}=\sqrt5$(또는 $\overline{\mathrm{AC}}=\sqrt5\,\overline{\mathrm{BC}}$)를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        $\overline{\mathrm{AB}}$와 $\angle\mathrm{C}$, $\overline{\mathrm{AC}}$와 $\angle\mathrm{B}$를 대응시켜 사인법칙 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $\sin\mathrm{C}=\dfrac{2\sqrt5}{5}$를 얻었다.
      depends_on: [1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-3090}
  misconceptions:
  - id: MC-ALG-3090
    outcome_code: '71'
    wrong_work: '$\dfrac{\overline{\mathrm{BC}}}{\sin\mathrm{C}}=\dfrac{\overline{\mathrm{AC}}}{\sin\mathrm{B}}$로 두어 $\sin\mathrm{C}=\dfrac{\sqrt{10}}{10}$을 얻음'
    detect_cue: 사인법칙에서 $\angle\mathrm{C}$의 대변을 $\overline{\mathrm{AB}}$가 아닌 다른 변으로 짝지었다
    feedback: 사인법칙은 각과 그 각의 대변을 짝짓습니다. $\angle\mathrm{C}$의 대변은 $\overline{\mathrm{AB}}$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    시각 $t$에서 선분 $\mathrm{BC}$의 길이를 $\ell(t)$라 할 때, $\displaystyle\lim_{t\to\infty}\dfrac{\ell(t)}{t}$의 값을 구하시오.
  points: 80
  depends_on: []
  answer: {kind: value, value: 'sqrt(6)/3', equivalents: ['sqrt(2/3)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 넓이 $S(t)=\tfrac23t^2+6t+1$이고 $S=\ell^2$이므로 $\ell(t)=\sqrt{S(t)}$이다.
    steps:
    - id: 2a
      content: |
        $S(t)=\tfrac23t^2+6t+1=\ell(t)^2\Rightarrow\dfrac{\ell(t)}{t}=\sqrt{\tfrac23+\tfrac6t+\tfrac1{t^2}}\to\dfrac{\sqrt6}{3}$
      criteria: ['2.M1', '2.A1', '2.M2', '2.A2', '2.A3']
    hint_ladder:
    - 넓이의 변화율을 알면 넓이 자체는 어떻게 구하는가? 적분상수는 무엇으로 정하는가?
    - 넓이를 $\ell(t)$로 나타내 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.101
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        시각 $t$에서 넓이를 $S(t)$라 하면 (다)에서 $S'(t)=\dfrac43t+6$이므로 $S(t)=\dfrac23t^2+6t+K$($K$는 상수)이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $t=0$에서 $S(0)=\dfrac12\cdot1\cdot2\sqrt2\sin\dfrac{\pi}{4}=1$이므로 $K=1$, 즉 $S(t)=\dfrac23t^2+6t+1$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        한편 $\overline{\mathrm{AB}}=2\sqrt2\ell(t)$이므로 $S(t)=\dfrac12\cdot\ell(t)\cdot2\sqrt2\ell(t)\sin\dfrac{\pi}{4}=\{\ell(t)\}^2$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        따라서 $\ell(t)=\sqrt{\dfrac23t^2+6t+1}$이다.
      criteria: ['2.A2']
    - id: 2b-5
      content: |
        $t>0$에서 $\dfrac{\ell(t)}{t}=\sqrt{\dfrac23+\dfrac6t+\dfrac1{t^2}}$이므로 $\displaystyle\lim_{t\to\infty}\dfrac{\ell(t)}{t}=\sqrt{\dfrac23}=\dfrac{\sqrt6}{3}$이다.
      criteria: ['2.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        넓이의 변화율 $\dfrac43t+6$을 적분해 $S(t)=\dfrac23t^2+6t+K$ 꼴로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        $S(0)=1$로 $K=1$을 정했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 20
      evidence: |
        넓이를 $\ell(t)$로 나타내 $S(t)=\{\ell(t)\}^2$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 10
      evidence: |
        $\ell(t)=\sqrt{\dfrac23t^2+6t+1}$을 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    - id: 2.A3
      mark_type: A
      points: 15
      evidence: |
        분자·분모를 $t$로 나누어 극한값 $\dfrac{\sqrt6}{3}$을 구했다.
      depends_on: [2.M2, 2.A2]
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3091}
  misconceptions:
  - id: MC-CAL-3091
    outcome_code: '71'
    wrong_work: '$S(t)=\dfrac23t^2+6t$로 두어 적분상수를 빠뜨림'
    detect_cue: $S(0)=1$을 쓰지 않았다(극한값은 같아도 $\ell(t)$의 식이 틀려 (1-3)에서 $t$가 달라진다)
    feedback: 변화율을 적분하면 상수가 남습니다. 조건 (가)로 $t=0$의 넓이를 구해 상수를 정하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    삼각형 $\mathrm{ABC}$의 외심을 $\mathrm{Z}$라 하자. 선분 $\mathrm{BC}$의 길이가 $5$일 때, 사각형 $\mathrm{ZBCA}$의 넓이의 순간변화율을 구하시오.
  points: 80
  depends_on: ['1', '2']
  answer: {kind: value, value: '20', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\angle\mathrm{C}$가 둔각이므로 외심은 $\mathrm{AB}$ 건너편에 있고 $\triangle\mathrm{AZB}=\tfrac12R^2\sin\angle\mathrm{AZB}=\ell^2=S$이므로 사각형 넓이는 $2S$이다.
    steps:
    - id: 3a
      content: |
        $R=\dfrac{\sqrt{10}}{2}\ell$, $\sin\angle\mathrm{AZB}=\dfrac45$이므로 $T=2S$, $\ell=5\iff t=3$, $T'(3)=2S'(3)=20$
      criteria: ['3.M1', '3.M2', '3.A1', '3.B1', '3.A2']
    hint_ladder:
    - $\angle\mathrm{C}$가 둔각이면 외심은 삼각형의 안과 밖 중 어디에 있는가?
    - 삼각형 $\mathrm{AZB}$는 어떤 삼각형이고, 그 넓이를 $\ell$로 나타내 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.101
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        외접원의 반지름을 $R(t)$라 하면 사인법칙에서 $2R(t)=\dfrac{\overline{\mathrm{AB}}}{\sin\mathrm{C}}=\dfrac{2\sqrt2\ell(t)}{2/\sqrt5}$이므로 $R(t)=\dfrac{\sqrt{10}}{2}\ell(t)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\angle\mathrm{C}$가 둔각이므로 외심 $\mathrm{Z}$는 변 $\mathrm{AB}$에 대하여 $\mathrm{C}$의 반대쪽에 있다. 사각형 $\mathrm{ZBCA}$의 넓이를 $T(t)$, 삼각형 $\mathrm{AZB}$의 넓이를 $T_1(t)$라 하면 $T(t)=S(t)+T_1(t)$이고 $T_1(t)=\dfrac12\{R(t)\}^2\sin(\angle\mathrm{AZB})$이다.
        이등변삼각형 $\mathrm{AZB}$에서 코사인법칙으로
        $\cos(\angle\mathrm{AZB})=\dfrac{2R^2-\overline{\mathrm{AB}}^2}{2R^2}=\dfrac{5\ell^2-8\ell^2}{5\ell^2}=-\dfrac35$이므로 $\sin(\angle\mathrm{AZB})=\dfrac45$이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $T_1(t)=\dfrac12\cdot\dfrac{10}{4}\{\ell(t)\}^2\cdot\dfrac45=\{\ell(t)\}^2=S(t)$이므로 $T(t)=2S(t)$이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        (1-2)의 $\ell(t)=\sqrt{\dfrac23t^2+6t+1}$에서 $\ell(t)=5$이면 $2t^2+18t-72=0$, $(t+12)(t-3)=0$이고 $t\ge0$이므로 $t=3$이다.
      criteria: ['3.B1']
    - id: 3b-5
      content: |
        $T'(t)=2S'(t)=2\left(\dfrac43t+6\right)$이므로 $T'(3)=2\cdot10=20$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        사인법칙으로 외접원의 반지름을 $\ell(t)$로 나타냈다($R=\dfrac{\sqrt{10}}{2}\ell$).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 20}
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        사각형 넓이를 $S+\triangle\mathrm{AZB}$로 분해하고 $\sin\angle\mathrm{AZB}$(또는 중심각 $2(\pi-\mathrm{C})$)를 구했다.
      depends_on: []
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $\triangle\mathrm{AZB}=\{\ell(t)\}^2$, 즉 $T(t)=2S(t)$(또는 $2\{\ell(t)\}^2$)를 얻었다.
      depends_on: [3.M1, 3.M2]
      steps: [3b-3]
    - id: 3.B1
      mark_type: B
      points: 10
      evidence: |
        $\ell(t)=5$가 되는 시각 $t=3$을 구했다.
      depends_on: []
      ft: {allowed: true, from: [2.A2], max_points: 10}
      steps: [3b-4]
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        $T'(3)=20$을 얻었다.
      depends_on: [3.M2, 3.A1, 3.B1]
      steps: [3b-5]
