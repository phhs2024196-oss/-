intent: |
  함수방정식 $f(2x)=4f(x)$를 치환적분과 결합해 구간을 두 배씩 옮긴 정적분의 관계를 만들고, 함수방정식을 미분한 조건으로 구간 $[1,2]$의 삼차함수를 결정하는 능력을 본다.
key_idea: |
  $\displaystyle\int_{2a}^{2b}f(x)\,dx=\int_a^b f(2y)\,2\,dy=8\int_a^b f(y)\,dy$이고, $f(2x)=4f(x)$를 미분하면 $f'(2x)=2f'(x)$이므로 $g(2)=4g(1)$, $g'(2)=2g'(1)$이다.
stuck: |
  치환 $x=2y$로 적분 구간을 반씩 줄여 배율 $8$을 얻는 것, 그리고 경계 $x=1,2$에서 함수방정식이 $g$의 계수 조건이 된다는 것
