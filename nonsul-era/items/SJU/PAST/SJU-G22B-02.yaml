stem: |
  실수 전체의 집합에서 미분가능한 함수 $f(x)$는 다음 조건을 만족시킨다.

  (가) 모든 실수 $x$에 대하여 $f(2x)=4f(x)$이다.
  (나) $\displaystyle\int_1^2f(x)dx=6$
  (다) 최고차항의 계수가 $1$인 삼차함수 $g(x)$에 대하여 $1\le x\le2$에서 $f(x)=g(x)$이다.

subparts:
- id: '1'
  stem: |
    $\displaystyle\int_1^3 2^xf(2^x)dx$를 구하시오.
  points: 70
  depends_on: []
  answer: {kind: value, value: '432/log(2)', equivalents: ['432/ln2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $u=2^x$로 바꾸면 $\tfrac1{\ln2}\int_2^8f(u)du$이고, $x=2y$ 치환으로 $\int_2^4f=8\cdot6$, $\int_4^8f=64\cdot6$이다.
    steps:
    - id: 1a
      content: |
        $\displaystyle\int_1^32^xf(2^x)dx=\dfrac1{\ln2}\int_2^8f(u)du=\dfrac{48+384}{\ln2}=\dfrac{432}{\ln2}$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2']
    hint_ladder:
    - $2^x$를 한 문자로 바꾸면 $2^x\,dx$는 무엇이 되는가?
    - $\int_2^4f(x)dx$에서 $x=2y$로 치환하고 (가)를 써 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.102
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $u=2^x$로 치환하면 $du=2^x\ln2\,dx$이고 $x=1\to u=2$, $x=3\to u=8$이므로
        $\displaystyle\int_1^32^xf(2^x)dx=\dfrac1{\ln2}\int_2^8f(u)du$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $x=2y$로 치환하고 (가)를 쓰면
        $\displaystyle\int_2^4f(x)dx=\int_1^2f(2y)\cdot2dy=8\int_1^2f(y)dy=48$,
        $\displaystyle\int_4^8f(x)dx=\int_2^4f(2y)\cdot2dy=8\int_2^4f(y)dy=384$이다.
      criteria: ['1.M2', '1.A1']
    - id: 1b-3
      content: |
        따라서 $\displaystyle\int_2^8f(x)dx=48+384=432$이고 $\displaystyle\int_1^32^xf(2^x)dx=\dfrac{432}{\ln2}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $u=2^x$ 치환으로 $\dfrac1{\ln2}\displaystyle\int_2^8f(u)du$(구간·계수 포함)로 바꾸었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 20
      evidence: |
        $x=2y$ 치환과 (가)로 $\displaystyle\int_{2a}^{2b}f(x)dx=8\int_a^bf(y)dy$ 관계를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        $\displaystyle\int_2^4f=48$, $\displaystyle\int_4^8f=384$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $\dfrac{432}{\ln2}$를 얻었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3093}
  misconceptions:
  - id: MC-CAL-3093
    outcome_code: '71'
    wrong_work: '$\int_2^4f(x)dx=\int_1^2f(2y)dy=4\cdot6=24$로 $dx=2dy$를 빠뜨림(또는 $\tfrac1{\ln2}$ 누락)'
    detect_cue: 배율이 $8$이 아니라 $4$이거나 답에 $\ln2$가 없다
    feedback: 치환할 때 $dx$도 바꿔야 합니다. $x=2y$이면 $dx=2dy$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $\displaystyle\int_0^1f(x)dx$를 구하시오.
  points: 80
  depends_on: []
  answer: {kind: value, value: '6/7', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $I=\int_0^1f$라 하면 $\int_0^2f=8I$이고 동시에 $I+6$이다.
    steps:
    - id: 2a
      content: |
        $8I=I+6\Rightarrow I=\dfrac67$
      criteria: ['2.M1', '2.M2', '2.A1']
    hint_ladder:
    - $\int_0^2f(x)dx$를 두 가지 방법으로 나타내 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.102
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\displaystyle\int_0^2f(x)dx$에서 $x=2u$로 치환하면 $\displaystyle\int_0^1f(2u)\cdot2du=8\int_0^1f(u)du$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        한편 $\displaystyle\int_0^2f(x)dx=\int_0^1f(x)dx+\int_1^2f(x)dx=\int_0^1f(x)dx+6$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        두 식에서 $8\displaystyle\int_0^1f(x)dx=\int_0^1f(x)dx+6$이므로 $\displaystyle\int_0^1f(x)dx=\dfrac67$이다.
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    source_flow: 해설교재 p.102 별해
    method_no: 2
    key_idea: 구간 $[2^{-k},2^{-k+1}]$의 적분이 $\tfrac{6}{8^k}$이므로 등비급수로 합한다.
    steps:
    - id: 2c-1
      content: |
        $x=2^{-k}y$로 치환하면 $\displaystyle\int_{2^{-k}}^{2^{-k+1}}f(x)dx=\int_1^2f(2^{-k}y)2^{-k}dy=8^{-k}\int_1^2f(y)dy=\dfrac6{8^k}$이고,
        $\displaystyle\int_0^1f(x)dx=\sum_{k=1}^{\infty}\dfrac6{8^k}=\dfrac{6/8}{1-1/8}=\dfrac67$이다.
      criteria: ['2.M1', '2.M2', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 30
      evidence: |
        치환으로 $\displaystyle\int_0^2f=8\int_0^1f$(또는 $\int_{2^{-k}}^{2^{-k+1}}f=8^{-k}\cdot6$)를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.M2
      mark_type: M
      points: 25
      evidence: |
        $\displaystyle\int_0^2f=\int_0^1f+6$으로 구간을 나누었다(또는 $[0,1]$을 $[2^{-k},2^{-k+1}]$로 나누어 급수로 표현).
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 25
      evidence: |
        $\dfrac67$을 얻었다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(등비급수 풀이)}
  - {code: '71', misconception: MC-CAL-3093}
  misconceptions:
  - id: MC-CAL-3093
    outcome_code: '71'
    wrong_work: '$\int_0^2f=4\int_0^1f$로 두어 $4I=I+6$, $I=2$를 얻음'
    detect_cue: 배율 $8$ 대신 $4$를 썼다
    feedback: $f(2u)=4f(u)$에 $dx=2du$의 $2$가 곱해져 배율은 $8$입니다.
    remedy: [RL-1]

- id: '3'
  stem: |
    $g(x)$를 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: expression, value: 'x**3 - 7*x**2/4 + 6*x - 8/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: (가)를 미분한 $f'(2x)=2f'(x)$와 (가)를 $x=1$에 적용하면 $g(2)=4g(1)$, $g'(2)=2g'(1)$이고, (나)가 세 번째 식이다.
    steps:
    - id: 3a
      content: |
        $g=x^3+ax^2+bx+c$: $g'(2)=2g'(1)\Rightarrow b=6$, $g(2)=4g(1)\Rightarrow c=-\tfrac83$, $\int_1^2g=6\Rightarrow a=-\tfrac74$
      criteria: ['3.M1', '3.A1', '3.M2', '3.A2']
    hint_ladder:
    - 구간 $[1,2]$의 양 끝 $1$과 $2=2\cdot1$은 (가)로 어떻게 연결되는가?
    - (가)의 양변을 미분해 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.102
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (가)의 양변을 미분하면 $2f'(2x)=4f'(x)$, 즉 $f'(2x)=2f'(x)$이다. $x=1$을 대입하면 $f(2)=4f(1)$, $f'(2)=2f'(1)$이다.
        $f$는 $[1,2]$에서 $g$와 같고 실수 전체에서 미분가능하므로 $g(2)=4g(1)$, $g'(2)=2g'(1)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $g(x)=x^3+ax^2+bx+c$라 하면 $g'(x)=3x^2+2ax+b$이다.
        $g'(2)=2g'(1)$에서 $12+4a+b=6+4a+2b$, 즉 $b=6$이고, $g(2)=4g(1)$에서 $8+4a+2b+c=4+4a+4b+4c$, 즉 $2b+3c=4$이므로 $c=-\dfrac83$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        (나)에서 $\displaystyle\int_1^2\left(x^3+ax^2+6x-\dfrac83\right)dx=\dfrac{15}4+\dfrac73a+9-\dfrac83=6$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $\dfrac73a=-\dfrac{49}{12}$에서 $a=-\dfrac74$이므로 $g(x)=x^3-\dfrac74x^2+6x-\dfrac83$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 25
      evidence: |
        (가)와 그 미분 $f'(2x)=2f'(x)$에서 $g(2)=4g(1)$, $g'(2)=2g'(1)$을 이끌었다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $b=6$, $c=-\dfrac83$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        (나)를 $g$의 정적분 식으로 세웠다.
      depends_on: []
      implied_ok: false
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        $a=-\dfrac74$, 즉 $g(x)=x^3-\dfrac74x^2+6x-\dfrac83$을 얻었다.
      depends_on: [3.M2, 3.A1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3094}
  misconceptions:
  - id: MC-CAL-3094
    outcome_code: '71'
    wrong_work: '(가)를 미분해 $f''(2x)=4f''(x)$로 두어 $g''(2)=4g''(1)$을 씀'
    detect_cue: 좌변 미분에서 속함수 $2x$의 도함수 $2$가 없다
    feedback: $f(2x)$를 미분하면 $2f'(2x)$입니다. 합성함수의 미분법을 확인하세요.
    remedy: [RL-2]

