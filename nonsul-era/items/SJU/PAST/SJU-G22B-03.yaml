stimuli: []

stem: |
  닫힌구간 $[-1,1]$에서 연속이고 열린구간 $(-1,1)$에서 이계도함수가 존재하는 함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $0<x<\pi$인 모든 실수 $x$에 대하여 $f'(\cos x)=e^x$이다.
  (나) $f(1)=\dfrac12$

  $0\le x\le2\pi$일 때 함수 $g(x)$를 $g(x)=f(\cos x)$라 정의하자. 다음 물음에 각각 답하시오.

subparts:
- id: '1'
  stem: |
    $0\le x\le\pi$일 때 $g(x)$를 구하시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: 'exp(x)*(cos(x) - sin(x))/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g'(x)=-e^x\sin x$를 적분하고, 연속성으로 끝점까지 식을 늘린 뒤 $g(0)=f(1)$로 상수를 정한다.
    steps:
    - id: 1a
      content: |
        $g'=-e^x\sin x\Rightarrow g=\tfrac12e^x(\cos x-\sin x)+C$, $g(0)=\tfrac12\Rightarrow C=0$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2']
    hint_ladder:
    - $f$를 구하지 말고 $g(x)=f(\cos x)$를 미분해 보자.
    - $e^x\sin x$의 부정적분은 부분적분을 두 번 하거나 $\{e^x(\cos x-\sin x)\}'$을 계산해 확인한다.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.103
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $0<x<\pi$에서 합성함수의 미분법과 (가)에 의하여 $g'(x)=f'(\cos x)\cdot(-\sin x)=-e^x\sin x$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\left\{\dfrac12e^x(\cos x-\sin x)\right\}'=\dfrac12e^x(\cos x-\sin x-\sin x-\cos x)=-e^x\sin x$이므로
        $0<x<\pi$에서 $g(x)=\dfrac12e^x(\cos x-\sin x)+C$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $f$가 $[-1,1]$에서 연속이므로 $g$는 $[0,\pi]$에서 연속이고, 이 식은 $0\le x\le\pi$에서도 성립한다. $x=0$을 대입하면 $g(0)=f(1)=\dfrac12+C$이고 (나)에서 $C=0$이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        따라서 $g(x)=\dfrac12e^x(\cos x-\sin x)$ $(0\le x\le\pi)$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        합성함수의 미분법으로 $g'(x)=-e^x\sin x$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $g(x)=\dfrac12e^x(\cos x-\sin x)+C$를 얻었다(부분적분 또는 미분으로 확인).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 20
      evidence: |
        연속성으로 끝점 $x=0$까지 식을 쓰고 $g(0)=f(1)=\dfrac12$로 상수를 정했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $g(x)=\dfrac12e^x(\cos x-\sin x)$를 얻었다.
      depends_on: [1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3094}
  - {code: '72', misconception: MC-CAL-3091}
  misconceptions:
  - id: MC-CAL-3094
    outcome_code: '71'
    wrong_work: '$g''(x)=f''(\cos x)=e^x$로 두어 $g(x)=e^x-\tfrac12$를 얻음'
    detect_cue: $-\sin x$ 인수가 없다
    feedback: $g(x)=f(\cos x)$는 합성함수입니다. 속함수 $\cos x$의 도함수 $-\sin x$를 곱하세요.
    remedy: [RL-1]
  - id: MC-CAL-3091
    outcome_code: '72'
    wrong_work: '적분상수를 두지 않고 $g(x)=\tfrac12e^x(\cos x-\sin x)$라고만 씀(우연히 맞음)'
    detect_cue: $g(0)=f(1)$을 이용한 상수 결정이 없다
    feedback: 부정적분에는 상수가 붙습니다. (나)로 상수가 $0$임을 보이세요.
    remedy: [RL-2]

- id: '2'
  stem: |
    $\pi\le x\le2\pi$일 때 함수 $g(x)$를 구하고, $0\le x\le2\pi$일 때 곡선 $y=g(x)$의 그래프의 개형을 그리시오. 또한 이 곡선이 $x$축과 만나는 점의 $x$좌표와 변곡점의 $x$좌표를 모두 구하고, 함수 $g(x)$의 최솟값을 $m$, 최댓값을 $M$이라 할 때 상수 $m$과 $M$을 각각 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: 'g(x)=exp(2*pi - x)*(cos(x) + sin(x))/2; zeros=pi/4,7*pi/4; inflections=3*pi/4,5*pi/4; m=-exp(pi)/2; M=1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\cos(2\pi-x)=\cos x$이므로 $g(2\pi-x)=g(x)$, 곡선은 $x=\pi$에 대칭이다. $[0,\pi]$에서 $g$는 감소하고 $g''=-e^x(\cos x+\sin x)$의 부호가 $x=\tfrac{3\pi}4$에서 바뀐다.
    steps:
    - id: 2a
      content: |
        $g(x)=\tfrac12e^{2\pi-x}(\cos x+\sin x)$ $(\pi\le x\le2\pi)$, 영점 $\tfrac{\pi}4,\tfrac{7\pi}4$, 변곡점 $\tfrac{3\pi}4,\tfrac{5\pi}4$, $m=g(\pi)=-\tfrac{e^\pi}2$, $M=g(0)=\tfrac12$
      criteria: ['2.M1', '2.A1', '2.M2', '2.A2', '2.A3', '2.A4']
    hint_ladder:
    - $\cos(2\pi-x)$와 $\cos x$의 관계를 이용하자.
    - $[0,\pi]$에서 $g'$와 $g''$의 부호를 조사하자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.103
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\pi\le x\le2\pi$이면 $0\le2\pi-x\le\pi$이고 $g(2\pi-x)=f(\cos(2\pi-x))=f(\cos x)=g(x)$이므로 곡선 $y=g(x)$는 직선 $x=\pi$에 대칭이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        (3-1)의 식에 $x$ 대신 $2\pi-x$를 넣으면
        $g(x)=\dfrac12e^{2\pi-x}\{\cos(2\pi-x)-\sin(2\pi-x)\}=\dfrac12e^{2\pi-x}(\cos x+\sin x)$ $(\pi\le x\le2\pi)$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $0<x<\pi$에서 $g'(x)=-e^x\sin x<0$이므로 $g$는 감소한다. $g''(x)=-e^x(\cos x+\sin x)$이고 $g''(x)=0$이면 $\tan x=-1$, 즉 $x=\dfrac{3\pi}4$이다. $0<x<\dfrac{3\pi}4$에서 $g''<0$(위로 볼록), $\dfrac{3\pi}4<x<\pi$에서 $g''>0$(아래로 볼록)이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $[0,\pi]$에서 $g(x)=0$이면 $\cos x=\sin x$, 즉 $x=\dfrac{\pi}4$이다. 그래프는 $\left(0,\dfrac12\right)$에서 출발해 $x=\dfrac{\pi}4$에서 $x$축을 지나고 $x=\dfrac{3\pi}4$에서 오목·볼록이 바뀌며 $\left(\pi,-\dfrac{e^\pi}2\right)$까지 감소하고($g'(\pi)=0$), $[\pi,2\pi]$는 $x=\pi$ 대칭으로 증가하여 $\left(2\pi,\dfrac12\right)$에 이른다.
      criteria: ['2.A2']
    - id: 2b-5
      content: |
        대칭성에 의해 $x$축과 만나는 점의 $x$좌표는 $\dfrac{\pi}4$, $\dfrac{7\pi}4$이고 변곡점의 $x$좌표는 $\dfrac{3\pi}4$, $\dfrac{5\pi}4$이다($x=\pi$의 양쪽은 모두 아래로 볼록이므로 $x=\pi$는 변곡점이 아니다).
      criteria: ['2.A3']
    - id: 2b-6
      content: |
        $m=g(\pi)=-\dfrac{e^\pi}2$, $M=g(0)=g(2\pi)=\dfrac12$이다.
      criteria: ['2.A4']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        $g(2\pi-x)=g(x)$(직선 $x=\pi$ 대칭)를 근거와 함께 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        $\pi\le x\le2\pi$에서 $g(x)=\dfrac12e^{2\pi-x}(\cos x+\sin x)$를 얻었다.
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A2], max_points: 15}
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        $g'$, $g''$의 부호를 조사해 증감과 오목·볼록을 판정했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 10
      evidence: |
        증감·볼록성·대칭이 반영된 그래프 개형을 그렸다.
      depends_on: [2.M2]
      steps: [2b-4]
    - id: 2.A3
      mark_type: A
      points: 15
      evidence: |
        $x$축과의 교점 $\dfrac{\pi}4,\dfrac{7\pi}4$와 변곡점 $\dfrac{3\pi}4,\dfrac{5\pi}4$를 모두 구했다.
      depends_on: [2.M2, 2.M1]
      steps: [2b-5]
    - id: 2.A4
      mark_type: A
      points: 10
      evidence: |
        $m=-\dfrac{e^\pi}2$, $M=\dfrac12$을 구했다.
      depends_on: [2.M2]
      steps: [2b-6]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3095}
  misconceptions:
  - id: MC-CAL-3095
    outcome_code: '71'
    wrong_work: '대칭점 $x=\pi$나 끝점 $x=0,2\pi$까지 변곡점에 포함'
    detect_cue: $g''$의 부호가 바뀌는지 확인하지 않고 변곡점을 나열했다
    feedback: 변곡점은 이계도함수의 부호가 바뀌는 점입니다. $x=\pi$ 양쪽은 모두 아래로 볼록입니다.
    remedy: [RL-3]

- id: '3'
  stem: |
    (3-2)에서 구한 상수 $m$과 $M$에 대하여 열린구간 $(m,M)$을 $I$라 하자. 실수 $t\in I$에 대하여 직선 $y=t$가 곡선 $y=g(x)$와 만나서 생기는 두 점 사이의 거리를 $h(t)$라 정의하자. 미분가능한 함수 $h(t)$에 대하여 $h(k)=\pi$일 때 상수 $k$와 $h'(k)$의 값을 각각 구하시오.
  points: 80
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'k=-exp(pi/2)/2; h1=2*exp(-pi/2)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 왼쪽 교점을 $x_1$이라 하면 대칭에 의해 오른쪽 교점은 $2\pi-x_1$, $h=2(\pi-x_1)$, $g(x_1)=t$를 미분한다.
    steps:
    - id: 3a
      content: |
        $h(k)=\pi\Rightarrow x_1=\tfrac{\pi}2$, $k=-\tfrac12e^{\pi/2}$, $h'(k)=-\dfrac2{g'(\pi/2)}=2e^{-\pi/2}$
      criteria: ['3.M1', '3.A1', '3.M2', '3.A2']
    hint_ladder:
    - 두 교점은 직선 $x=\pi$에 대해 대칭이다.
    - 왼쪽 교점의 $x$좌표를 $t$의 함수로 보고, 그 도함수를 $g'$으로 나타내자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.104
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        곡선이 $x=\pi$에 대칭이므로 두 교점의 $x$좌표는 $\pi-\dfrac12h(t)$, $\pi+\dfrac12h(t)$이다. $h(k)=\pi$이면 두 교점의 $x$좌표는 $\dfrac{\pi}2$, $\dfrac{3\pi}2$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        따라서 $k=g\!\left(\dfrac{\pi}2\right)=\dfrac12e^{\pi/2}(0-1)=-\dfrac12e^{\frac{\pi}2}$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $g\!\left(\pi-\dfrac12h(t)\right)=t$의 양변을 $t$에 대하여 미분하면 $-\dfrac12g'\!\left(\pi-\dfrac12h(t)\right)h'(t)=1$이므로
        $h'(t)=-\dfrac{2}{g'\!\left(\pi-\frac12h(t)\right)}$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
