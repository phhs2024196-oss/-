intent: |
  $f'(\cos x)=e^x$로 주어진 함수에서 합성함수 $g(x)=f(\cos x)$의 도함수를 구해 적분으로 $g$를 복원하고, 대칭성으로 그래프 전체를 그린 뒤, 수평선과의 두 교점 사이 거리 함수를 역함수의 미분법으로 미분하는 능력을 본다.
key_idea: |
  $g'(x)=f'(\cos x)(-\sin x)=-e^x\sin x$이므로 $g(x)=\tfrac12e^x(\cos x-\sin x)$이고, $g(2\pi-x)=g(x)$이므로 $h(t)=2\{\pi-g^{-1}(t)\}$이다.
stuck: |
  $f$를 직접 구하지 않고 $g$의 도함수를 합성함수 미분으로 얻는 것, 그리고 $x=\pi$ 대칭으로 두 교점 사이 거리를 한쪽 교점만으로 나타내는 것
