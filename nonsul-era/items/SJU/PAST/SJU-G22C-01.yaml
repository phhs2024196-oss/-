key_idea: |
  $F'(x)=xf^{-1}(x)$이고 $f(0)=1$에서 $f^{-1}(1)=0$이다. $F(1)=\int_0^1xf^{-1}(x)dx$는 $x=f(t)$로 치환해 $t$에 대한 지수함수 적분으로 바꾼다.
