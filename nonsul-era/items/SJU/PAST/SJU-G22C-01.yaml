stimuli: []

stem: |
  실수 전체의 집합에서 정의된 함수 $f(x)=2e^x-e^{-x}$에 대하여 다음 물음에 각각 답하시오.

subparts:
- id: '1'
  stem: |
    함수 $f(x)$의 역함수 $f^{-1}(x)$가 존재함을 보이시오.
  points: 70
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 도함수가 항상 양수이므로 증가함수, 따라서 일대일대응이다.
    steps:
    - id: 1a
      content: |
        $f'(x)=2e^x+e^{-x}>0\Rightarrow f$ 증가 $\Rightarrow$ 일대일대응 $\Rightarrow f^{-1}$ 존재
      criteria: ['1.M1', '1.R1']
    hint_ladder:
    - 역함수가 존재하려면 함수가 어떤 성질을 가져야 하는가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.105
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=2e^x+e^{-x}$이고 $e^x>0$, $e^{-x}>0$이므로 모든 실수 $x$에서 $f'(x)>0$이다. 따라서 $f$는 실수 전체에서 증가함수이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        증가함수이므로 $x_1\ne x_2$이면 $f(x_1)\ne f(x_2)$이다. 또 $f$는 연속이고 $\displaystyle\lim_{x\to\infty}f(x)=\infty$, $\displaystyle\lim_{x\to-\infty}f(x)=-\infty$이므로 치역은 실수 전체이다. 따라서 $f$는 실수 전체에서 실수 전체로의 일대일대응이고 역함수 $f^{-1}(x)$가 존재한다. ■
      criteria: ['1.R1']
  - id: S1-ALT
    audience: ALT
    source_flow: 해설교재 p.105 별해
    method_no: 2
    key_idea: $y=2e^x-e^{-x}$를 $e^x$에 대한 이차방정식으로 풀어 역함수를 직접 구한다.
    steps:
    - id: 1c-1
      content: |
        $y=2e^x-e^{-x}$에서 $2(e^x)^2-ye^x-1=0$이고 $e^x>0$이므로 $e^x=\dfrac{y+\sqrt{y^2+8}}{4}$, 즉 각 실수 $y$에 대해 $x=\ln\dfrac{y+\sqrt{y^2+8}}{4}$가 하나뿐이다. 따라서 $f^{-1}(x)=\ln\dfrac{x+\sqrt{x^2+8}}{4}$가 존재한다.
      criteria: ['1.M1', '1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 35
      evidence: |
        $f'(x)=2e^x+e^{-x}>0$을 보여 $f$가 증가함수임을 밝혔다(또는 $e^x$에 대한 이차방정식으로 $x$를 $y$로 풀었다).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.R1
      mark_type: R
      points: 35
      evidence: |
        증가함수(또는 해의 유일성)에서 일대일대응을 이끌어 역함수가 존재한다고 결론지었다.
      depends_on: [1.M1]
      steps: [1b-2, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(역함수 직접 계산)}
  - {code: '71', misconception: MC-PRF-3097}
  misconceptions:
  - id: MC-PRF-3097
    outcome_code: '71'
    wrong_work: '$f$가 연속함수이므로 역함수가 존재한다고 씀'
    detect_cue: 단조성(또는 일대일) 근거가 없다
    feedback: 연속만으로는 부족합니다. 역함수가 있으려면 일대일대응이어야 하며, $f'>0$으로 증가함을 보이면 됩니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    함수 $F(x)=\displaystyle\int_0^x tf^{-1}(t)dt$는 $x=1$에서 극솟값을 가짐을 보이시오.
  points: 80
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $F'(1)=f^{-1}(1)=0$, $F''(1)=f^{-1}(1)+\dfrac{1}{f'(0)}=\dfrac13>0$.
    steps:
    - id: 2a
      content: |
        $f(0)=1\Rightarrow f^{-1}(1)=0$, $F'(1)=0$, $F''(1)=\tfrac13>0$
      criteria: ['2.M1', '2.A1', '2.M2', '2.R1']
    hint_ladder:
    - $f^{-1}(1)$은 $f(a)=1$인 $a$이다.
    - 극솟값 판정에 이계도함수를 써 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.105
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f^{-1}(1)=a$라 하면 $2e^a-e^{-a}=1$이다. $e^a=A$로 놓으면 $2A^2-A-1=(A-1)(2A+1)=0$이고 $A>0$이므로 $A=1$, $a=0$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $F'(x)=xf^{-1}(x)$이므로 $F'(1)=f^{-1}(1)=0$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        역함수의 미분법에서 $\{f^{-1}(x)\}'=\dfrac{1}{f'(f^{-1}(x))}$이므로 $F''(x)=f^{-1}(x)+\dfrac{x}{f'(f^{-1}(x))}$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $F''(1)=0+\dfrac{1}{f'(0)}=\dfrac{1}{3}>0$이므로 $F$는 $x=1$에서 극솟값을 갖는다. ■
      criteria: ['2.R1']
  - id: S2-ALT
    audience: ALT
    source_flow: 해설교재 p.105 별해
    method_no: 2
    key_idea: $f^{-1}$은 증가하고 $f^{-1}(1)=0$이므로 $F'(x)=xf^{-1}(x)$의 부호가 $x=1$에서 음에서 양으로 바뀐다.
    steps:
    - id: 2c-1
      content: |
        $f(0)=1$에서 $f^{-1}(1)=0$, $F'(1)=0$이다. $f^{-1}$은 증가함수이므로 $x<1$이면 $f^{-1}(x)<0$, $x>1$이면 $f^{-1}(x)>0$이다. 따라서 $0<x<1$에서 $F'(x)<0$, $x>1$에서 $F'(x)>0$이므로 $F$는 $x=1$에서 극솟값을 갖는다.
      criteria: ['2.M1', '2.A1', '2.M2', '2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $f(a)=1$을 풀어(또는 $f(0)=1$을 확인해) $f^{-1}(1)=0$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        $F'(x)=xf^{-1}(x)$에서 $F'(1)=0$을 보였다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.M2
      mark_type: M
      points: 20
      evidence: |
        역함수의 미분법으로 $F''(x)$를 구했다(또는 $f^{-1}$의 증가성으로 $F'$의 부호를 조사했다).
      depends_on: []
      implied_ok: false
      steps: [2b-3, 2c-1]
    - id: 2.R1
      mark_type: R
      points: 25
      evidence: |
        $F''(1)=\dfrac13>0$(또는 $F'$의 부호가 음→양)을 근거로 극솟값을 결론지었다.
      depends_on: [2.M2, 2.A1]
      ft: {allowed: true, from: [1.M1], max_points: 25}
      steps: [2b-4, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(부호 변화 판정)}
  - {code: '71', misconception: MC-CAL-3003}
  - {code: '72', misconception: MC-CAL-3096}
  misconceptions:
  - id: MC-CAL-3003
    outcome_code: '71'
    wrong_work: '$F''(1)=0$이므로 극솟값이라고 결론'
    detect_cue: $F''$의 부호나 $F'$의 부호 변화가 없다
    feedback: 미분계수가 $0$인 것만으로는 극값이 아닙니다. 이계도함수의 부호나 도함수의 부호 변화를 보이세요.
    remedy: [RL-2]
  - id: MC-CAL-3096
    outcome_code: '72'
    wrong_work: '$\{f^{-1}(x)\}''=\dfrac1{f''(x)}$로 두어 $F''''(1)=\dfrac1{f''(1)}$을 계산'
    detect_cue: $f'$에 $f^{-1}(1)=0$ 대신 $1$을 넣었다
    feedback: 역함수의 도함수는 $\dfrac1{f'(f^{-1}(x))}$입니다. $x=1$에 대응하는 점은 $f^{-1}(1)=0$입니다.
    remedy: [RL-3]

- id: '3'
  stem: |
    $F(1)$의 값을 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: value, value: 'log(2) - 3/4', equivalents: ['ln2-3/4'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $x=f(t)$로 치환하면 $\int_0^1xf^{-1}(x)dx=\int_{\ln(1/\sqrt2)}^0 tf(t)f'(t)\,dt$이다.
    steps:
    - id: 3a
      content: |
        $f^{-1}(0)=\ln\tfrac1{\sqrt2}$, $\displaystyle F(1)=\int_{\ln(1/\sqrt2)}^0t(2e^t-e^{-t})(2e^t+e^{-t})dt=\ln2-\tfrac34$
      criteria: ['3.M1', '3.A1', '3.M2', '3.A2']
    hint_ladder:
    - 역함수가 들어 있는 적분은 $x=f(t)$로 치환해 보자. 구간의 끝은 어떻게 바뀌는가?
    - $f^{-1}(0)$을 구하려면 $f(a)=0$을 풀어야 한다.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.105
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f^{-1}(0)=a$라 하면 $2e^a-e^{-a}=0$, $e^a=A$로 놓으면 $2A^2-1=0$이고 $A>0$이므로 $A=\dfrac1{\sqrt2}$, $a=\ln\dfrac1{\sqrt2}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        부분적분하면 $\displaystyle\int_0^1xf^{-1}(x)dx=\left[\dfrac12x^2f^{-1}(x)\right]_0^1-\int_0^1\dfrac12x^2\{f^{-1}(x)\}'dx=-\int_0^1\dfrac12x^2\dfrac{1}{f'(f^{-1}(x))}dx$이다($f^{-1}(1)=0$).
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $t=f^{-1}(x)$로 치환하면 $x=f(t)$, $dx=f'(t)dt$이고 구간은 $f^{-1}(0)=\ln\dfrac1{\sqrt2}$에서 $f^{-1}(1)=0$까지이므로
        $\displaystyle F(1)=-\int_{\ln(1/\sqrt2)}^{0}\dfrac12\{f(t)\}^2dt=-\int_{\ln(1/\sqrt2)}^{0}\dfrac12(4e^{2t}-4+e^{-2t})dt$이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        $\displaystyle\int_{\ln(1/\sqrt2)}^{0}(4e^{2t}-4+e^{-2t})dt=\left[2e^{2t}-4t-\dfrac12e^{-2t}\right]_{-\frac12\ln2}^{0}=\dfrac32-(1+2\ln2-1)=\dfrac32-2\ln2$이므로
        $F(1)=-\dfrac12\left(\dfrac32-2\ln2\right)=\ln2-\dfrac34$이다.
      criteria: ['3.A2']
  - id: S3-ALT
    audience: ALT
    source_flow: 해설교재 p.105 별해
    method_no: 2
    key_idea: 부분적분 없이 곧바로 $t=f^{-1}(x)$로 치환한다.
    steps:
    - id: 3c-1
      content: |
        $\displaystyle\int_0^1xf^{-1}(x)dx=\int_{\ln(1/\sqrt2)}^0f(t)\,t\,f'(t)dt=\int_{\ln(1/\sqrt2)}^0t(2e^t-e^{-t})(2e^t+e^{-t})dt=\int_{\ln(1/\sqrt2)}^0t(4e^{2t}-e^{-2t})dt=\ln2-\dfrac34$
      criteria: ['3.M1', '3.M2', '3.A1', '3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        $f^{-1}(0)=\ln\dfrac1{\sqrt2}$($=-\tfrac12\ln2$)을 구했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3c-1]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        부분적분 또는 $x=f(t)$ 치환으로 역함수가 없는 적분으로 바꾸려 했다.
      depends_on: []
      implied_ok: false
      steps: [3b-2, 3c-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        치환 후 적분 구간 $\left[\ln\dfrac1{\sqrt2},0\right]$과 피적분함수를 바르게 썼다.
      depends_on: [3.M1, 3.M2]
      ft: {allowed: true, from: [2.M1], max_points: 20}
      steps: [3b-3, 3c-1]
    - id: 3.A2
      mark_type: A
      points: 25
      evidence: |
        $F(1)=\ln2-\dfrac34$를 얻었다.
      depends_on: [3.M2, 3.A1]
      steps: [3b-4, 3c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(직접 치환)}
  - {code: '71', misconception: MC-CAL-3093}
  misconceptions:
  - id: MC-CAL-3093
