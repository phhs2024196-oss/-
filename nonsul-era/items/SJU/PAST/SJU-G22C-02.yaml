intent: |
  시각에 따라 변하는 삼차함수의 접선과 넓이를 구하고, 접선과 $y$축에 동시에 접하는 원의 중심을 $t$로 나타내 극한을 계산하며, 반각 관계로 $\sin\theta$를 구해 같은 사인값을 주는 두 시각의 관계를 찾는 능력을 본다.
key_idea: |
  중심 $\mathrm{Z}(a,b)$는 $\mathrm{Q}$에서의 법선 $x=ty+t$ 위에 있고 반지름은 $a$이므로 $(t-a)^2+b^2=a^2$이다. $\mathrm{H}=(a,0)$이면 $\cos\tfrac{\theta}2=-\tfrac ba=\tfrac1{\sqrt{t^2+1}}$, $\sin\theta=\tfrac{2t}{t^2+1}$이다.
stuck: |
  원이 $y$축에 접한다는 조건을 반지름 $=a$로 바꾸는 것, 그리고 $\sin\theta$가 같은 두 시각이 $t_1t_2=1$을 만족한다는 것을 알아내는 것
