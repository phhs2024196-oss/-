stimuli: []

stem: |
  시각 $t>0$에서 함수 $f(x)$를 모든 실수 $x$에 대하여 다음과 같이 정의하자.
  $$f(x)=t(x-t)(x-t-1)$$
  점 $\mathrm{Q}(t,0)$에서 곡선 $y=f(x)$에 접하는 직선을 $L$이라 하자.
  중심 $\mathrm{Z}$가 제4사분면에 있는 원 $C$는 $y$축에 접하며 점 $\mathrm{Q}$에서 직선 $L$에도 접한다.
  (그림: 곡선 $y=f(x)$는 $y$축 위의 점에서 내려와 $\mathrm{Q}$에서 $x$축과 만나고 극소를 지나 다시 올라간다. 직선 $L$은 $\mathrm{Q}$를 지나는 기울기가 음인 직선이고, 원 $C$는 $x$축 아래 제4사분면에 중심 $\mathrm{Z}$를 두고 $y$축과 $L$에 접하며 $x$축과 $\mathrm{O}$와 $\mathrm{Q}$ 사이의 점 $\mathrm{P}$와 $\mathrm{Q}$에서 만난다.)

subparts:
- id: '1'
  stem: |
    시각 $t$에서 곡선 $y=f(x)$와 직선 $L$ 및 $y$축으로 둘러싸인 도형의 넓이를 $t$에 대한 식으로 나타내시오.
  points: 70
  depends_on: []
  answer: {kind: expression, value: 't**4/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)-L(x)=t(x-t)^2\ge0$이므로 넓이는 $\int_0^tt(x-t)^2dx$이다.
    steps:
    - id: 1a
      content: |
        $L:y=-t(x-t)$, $\displaystyle\int_0^tt(x-t)^2dx=\dfrac{t^4}3$
      criteria: ['1.M1', '1.A1', '1.M2', '1.A2']
    hint_ladder:
    - $f'(t)$를 구해 접선 $L$을 쓰자.
    - 곡선과 접선의 차를 인수분해해 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.106
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f'(x)=t\{(x-t-1)+(x-t)\}=t(2x-2t-1)$이므로 $f'(t)=-t$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 직선 $L$의 방정식은 $y=-t(x-t)$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $0\le x\le t$에서 $f(x)-\{-t(x-t)\}=t(x-t)(x-t-1)+t(x-t)=t(x-t)^2\ge0$이므로 곡선이 직선보다 위에 있고, 넓이는 $\displaystyle\int_0^t\{t(x-t)(x-t-1)+t(x-t)\}dx$이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $\displaystyle\int_0^tt(x-t)^2dx=t\left[\dfrac{(x-t)^3}{3}\right]_0^t=\dfrac{t^4}3$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        $f'(x)$를 구해 $f'(t)=-t$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        $L:y=-t(x-t)$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 20
      evidence: |
        구간 $[0,t]$에서 (곡선)$-$(직선)을 적분하는 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 20
      evidence: |
        넓이 $\dfrac{t^4}3$을 얻었다.
      depends_on: [1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3098}
  misconceptions:
  - id: MC-CAL-3098
    outcome_code: '71'
    wrong_work: '$\int_0^t\{-t(x-t)-f(x)\}dx=-\dfrac{t^4}3$처럼 위아래를 바꾸거나 적분 구간을 $[0,t+1]$로 잡음'
    detect_cue: 넓이가 음수이거나 구간 끝이 $\mathrm{Q}$의 $x$좌표 $t$가 아니다
    feedback: 둘러싸인 부분은 $y$축($x=0$)부터 접점 $x=t$까지이고, $f(x)-L(x)=t(x-t)^2\ge0$이므로 곡선이 위입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    시각 $t$에서 원 $C$의 중심 $\mathrm{Z}$의 좌표를 $(a(t),b(t))$라 할 때, $\displaystyle\lim_{t\to\infty}\dfrac{t\{b(t)\}^2}{a(t)}$을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '1/2', equivalents: ['0.5'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 중심은 법선 $x=ty+t$ 위, 반지름은 $a$이므로 $(t-a)^2+b^2=a^2$, $a=t(b+1)$이다.
    steps:
    - id: 2a
      content: |
        $b=-t(\sqrt{t^2+1}-t)$, $a=-\sqrt{t^2+1}\,b$, $\dfrac{tb^2}{a}=\dfrac{t^2}{\sqrt{t^2+1}(\sqrt{t^2+1}+t)}\to\dfrac12$
      criteria: ['2.M1', '2.M2', '2.A1', '2.A2']
    hint_ladder:
    - 원이 $\mathrm{Q}$에서 $L$에 접하면 중심은 어떤 직선 위에 있는가?
    - $y$축에 접하는 원의 반지름은 중심의 어느 좌표와 같은가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.106
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f'(t)=-t$이므로 점 $\mathrm{Q}$에서 $L$에 수직인 직선은 $y=\dfrac1t(x-t)$, 즉 $x=ty+t$이고 중심 $\mathrm{Z}$는 이 직선 위에 있다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        원 $C$는 $y$축에 접하고 중심이 제4사분면에 있으므로 반지름은 $a$이고, 원이 $\mathrm{Q}(t,0)$을 지나므로
        $(t-a)^2+b^2=a^2$, $a=t(b+1)$이 성립한다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $t-a=-tb$를 첫 식에 넣으면 $(t^2+1)b^2=a^2$이고 $a>0$, $b<0$이므로 $a=-\sqrt{t^2+1}\,b$이다. 이를 $a=tb+t$와 연립하면
        $b(t)=-\dfrac{t}{\sqrt{t^2+1}+t}=-t\left(\sqrt{t^2+1}-t\right)$, $a(t)=t\sqrt{t^2+1}\left(\sqrt{t^2+1}-t\right)=-\sqrt{t^2+1}\,b(t)$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        $\dfrac{t\{b(t)\}^2}{a(t)}=\dfrac{-t\,b(t)}{\sqrt{t^2+1}}=\dfrac{t^2}{\sqrt{t^2+1}\left(\sqrt{t^2+1}+t\right)}$이고, 분자·분모를 $t^2$으로 나누면 $\displaystyle\lim_{t\to\infty}\dfrac{t\{b(t)\}^2}{a(t)}=\dfrac{1}{1\cdot2}=\dfrac12$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        중심이 $\mathrm{Q}$를 지나고 $L$에 수직인 직선($x=ty+t$) 위에 있음을 썼다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 20}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 20
      evidence: |
        $y$축에 접하므로 반지름이 $a$임을 써서 $(t-a)^2+b^2=a^2$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        부호 조건($a>0$, $b<0$)을 써서 $a(t)$, $b(t)$를 $t$로 나타냈다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        극한값 $\dfrac12$을 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3099}
  misconceptions:
  - id: MC-GEO-3099
    outcome_code: '71'
    wrong_work: '반지름을 $|b|$(중심과 $x$축 사이 거리)로 두어 $(t-a)^2+b^2=b^2$, $a=t$를 얻음'
    detect_cue: $y$축에 접한다는 조건을 반지름 $=a$로 쓰지 않았다
    feedback: $y$축에 접하는 원은 중심에서 $y$축까지의 거리, 곧 $|a|$가 반지름입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    시각 $t$에서 원 $C$가 $x$축과 만나는 점 중에서 $\mathrm{Q}$가 아닌 점을 $\mathrm{P}$라 하고, $\angle\mathrm{PZQ}$를 $\theta$라 하자. 시각 $t_1$, $t_2$ $(0<t_1<t_2)$에서 $\sin\theta$의 값이 서로 같고, $t_1+t_2=14$일 때 $t_1$의 값을 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: value, value: '7 - 4*sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{H}=(a,0)$이면 $\cos\tfrac{\theta}2=-\tfrac ba=\tfrac1{\sqrt{t^2+1}}$이므로 $\sin\theta=\tfrac{2t}{t^2+1}$이고, 같은 값을 주는 두 양수는 $t_1t_2=1$이다.
    steps:
    - id: 3a
      content: |
        $\sin\theta=\dfrac{2t}{t^2+1}$, $t_1t_2=1$, $t_1+t_2=14\Rightarrow t_1=7-4\sqrt3$
      criteria: ['3.M1', '3.A1', '3.M2', '3.A2']
    hint_ladder:
    - 이등변삼각형 $\mathrm{PZQ}$에서 꼭짓점 $\mathrm{Z}$의 수선의 발을 생각하자.
    - $\dfrac{2t}{t^2+1}=k$를 $t$에 대한 이차방정식으로 보면 두 근의 곱은?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.106
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\mathrm{H}=(a,0)$이라 하면 $\mathrm{H}$는 현 $\mathrm{PQ}$의 중점이고 $\angle\mathrm{PZH}=\dfrac{\theta}2$이다. $\overline{\mathrm{ZP}}=a$, $\overline{\mathrm{ZH}}=-b$이므로 (2-2)에서 $\cos\dfrac{\theta}2=-\dfrac ba=\dfrac1{\sqrt{t^2+1}}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $0<\theta<\pi$이므로 $\sin\dfrac{\theta}2=\sqrt{1-\cos^2\dfrac{\theta}2}=\dfrac{t}{\sqrt{t^2+1}}$이고 $\sin\theta=2\sin\dfrac{\theta}2\cos\dfrac{\theta}2=\dfrac{2t}{t^2+1}$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $\dfrac{2t_1}{t_1^2+1}=\dfrac{2t_2}{t_2^2+1}$이면 $t_1t_2^2+t_1=t_2t_1^2+t_2$, 즉 $(t_1-t_2)(1-t_1t_2)=0$이고 $t_1\ne t_2$이므로 $t_1t_2=1$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $t_1+t_2=14$이므로 $t_1$, $t_2$는 $s^2-14s+1=0$의 두 근이고, $t_1<t_2$이므로 $t_1=7-4\sqrt3$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        현의 중점 $\mathrm{H}$와 반각을 이용해 $\cos\dfrac{\theta}2$(또는 $\sin\dfrac{\theta}2$)를 $a$, $b$ 또는 $t$로 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 20}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $\sin\theta=\dfrac{2t}{t^2+1}$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        $\sin\theta$가 같다는 조건을 인수분해해 $t_1t_2=1$을 이끌었다.
      depends_on: []
      implied_ok: false
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        $t_1=7-4\sqrt3$을 얻었다.
      depends_on: [3.M2, 3.A1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-3100}
  misconceptions:
  - id: MC-ALG-3100
    outcome_code: '71'
    wrong_work: '$\sin\theta$가 같으므로 $\theta$가 같고 따라서 $t_1=t_2$라 하여 모순 또는 해 없음으로 결론'
    detect_cue: $\theta_2=\pi-\theta_1$ 가능성이나 $(t_1-t_2)(1-t_1t_2)=0$의 둘째 인수를 다루지 않았다
    feedback: 사인값이 같아도 각은 서로 보각일 수 있습니다. $\sin\theta$를 $t$의 식으로 놓고 직접 비교하세요.
    remedy: [RL-3]

remedy_links:
- id: RL-1
