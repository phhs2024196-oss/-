stimuli: []

stem: |
  $x\ge0$에서 연속인 함수 $f(x)$는 다음 조건을 만족시킨다.

  (가) $x>0$에서 $f(x)$는 두 번 미분가능하고 $f(x)>0$, $f'(x)>0$, $f''(x)>0$이다.
  (나) 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선이 점 $\mathrm{A}(0,-\sqrt2)$를 지난다. (단, $a>0$)

  곡선 $y=f(x)$와 직선 $y=-\sqrt2$ 및 두 직선 $x=0$, $x=2a$로 둘러싸인 도형을 $S$라 하자. 도형 $S$에서 점 $\mathrm{A}$와 점 $(x,f(x))$ $(0\le x\le2a)$를 잇는 가장 짧은 경로의 길이를 $\ell(x)$라 하자.

subparts:
- id: '1'
  stem: |
    $x=a$에서 $\ell(x)$가 미분가능함을 보이시오.
  points: 80
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 오른쪽 미분계수는 곡선의 길이에서 $\sqrt{1+f'(a)^2}$, 왼쪽 미분계수는 선분 길이의 미분에 접선 조건 $f(a)+\sqrt2=af'(a)$를 넣어 같은 값이 된다.
    steps:
    - id: 1a
      content: |
        $\ell'_+(a)=\sqrt{1+f'(a)^2}$, $\ell'_-(a)=\dfrac{a+\{f(a)+\sqrt2\}f'(a)}{\sqrt{a^2+\{f(a)+\sqrt2\}^2}}=\dfrac{a(1+f'(a)^2)}{a\sqrt{1+f'(a)^2}}=\sqrt{1+f'(a)^2}$
      criteria: ['1.M1', '1.M2', '1.A1', '1.R1']
    hint_ladder:
    - 곡선이 아래로 볼록할 때 $\mathrm{A}$에서 곡선 위의 점까지 직선으로 갈 수 있는 범위는 어디까지인가?
    - $x=a$의 왼쪽과 오른쪽에서 $\ell(x)$의 식이 다르다. 각각 미분계수를 구하자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.107
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=f(x)$의 그래프가 아래로 볼록하므로, $0\le x\le a$이면 $\mathrm{A}$와 $(x,f(x))$를 잇는 선분이 $S$ 안에 있어 최단 경로가 되고, $a<x\le2a$이면 $\mathrm{A}$에서 접점 $(a,f(a))$까지 선분으로 간 뒤 곡선을 따라가야 한다. 따라서
        $$\ell(x)=\begin{cases}\sqrt{x^2+\{f(x)+\sqrt2\}^2}&(0\le x\le a)\\\sqrt{a^2+\{f(a)+\sqrt2\}^2}+\displaystyle\int_a^x\sqrt{1+\{f'(t)\}^2}dt&(a<x\le2a)\end{cases}$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $(a,f(a))$에서의 접선 $y=f'(a)(x-a)+f(a)$가 $\mathrm{A}(0,-\sqrt2)$를 지나므로 $-af'(a)+f(a)=-\sqrt2$, 즉 $f(a)+\sqrt2=af'(a)$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\displaystyle\lim_{h\to0+}\dfrac{\ell(a+h)-\ell(a)}{h}=\lim_{h\to0+}\dfrac1h\int_a^{a+h}\sqrt{1+\{f'(t)\}^2}dt=\sqrt{1+\{f'(a)\}^2}$이고,
        $\displaystyle\lim_{h\to0-}\dfrac{\ell(a+h)-\ell(a)}{h}=\dfrac12\cdot\dfrac{2a+2\{f(a)+\sqrt2\}f'(a)}{\sqrt{a^2+\{f(a)+\sqrt2\}^2}}=\dfrac{a+a\{f'(a)\}^2}{\sqrt{a^2+a^2\{f'(a)\}^2}}=\sqrt{1+\{f'(a)\}^2}$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        좌우 미분계수가 같으므로 $\ell(x)$는 $x=a$에서 미분가능하고 $\ell'(a)=\sqrt{1+\{f'(a)\}^2}$이다. ■
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        볼록성을 근거로 최단 경로를 $x\le a$(선분)와 $x>a$(접점까지 선분+곡선)로 나누어 $\ell(x)$를 식으로 썼다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        접선이 $\mathrm{A}$를 지나는 조건 $f(a)+\sqrt2=af'(a)$를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 25
      evidence: |
        우미분계수 $\sqrt{1+f'(a)^2}$와 좌미분계수(접선 조건 대입 후 $\sqrt{1+f'(a)^2}$)를 모두 계산했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 15
      evidence: |
        좌우 미분계수가 같음을 근거로 미분가능하다고 결론지었다.
      depends_on: [1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3006}
  misconceptions:
  - id: MC-CAL-3006
    outcome_code: '71'
    wrong_work: '한쪽 식만 미분해 $\ell''(a)=\sqrt{1+f''(a)^2}$이므로 미분가능하다고 씀'
    detect_cue: 좌미분계수 계산이나 접선 조건 대입이 없다
    feedback: 연결점에서는 양쪽 식의 미분계수를 각각 구해 같음을 보여야 합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $\ell(x)=\dfrac{x^3}{3}+x^2+\dfrac53$일 때 접점 $(a,f(a))$를 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: '(1, sqrt(2))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\ell(a)=\sqrt{a^2+a^2f'(a)^2}=a\ell'(a)$이므로 $\tfrac{a^3}3+a^2+\tfrac53=a(a^2+2a)$이다.
    steps:
    - id: 2a
      content: |
        $(a-1)(2a^2+5a+5)=0\Rightarrow a=1$, $\ell(1)=3=\sqrt{1+(f(1)+\sqrt2)^2}\Rightarrow f(1)=\sqrt2$
      criteria: ['2.M1', '2.A1', '2.M2', '2.A2']
    hint_ladder:
    - 접선 조건을 쓰면 $\ell(a)$와 $\ell'(a)$ 사이에 어떤 관계가 생기는가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.107
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        접선 조건 $f(a)+\sqrt2=af'(a)$와 (3-1)의 결과로 $\ell(a)=\sqrt{a^2+\{f(a)+\sqrt2\}^2}=\sqrt{a^2+\{af'(a)\}^2}=a\sqrt{1+\{f'(a)\}^2}=a\ell'(a)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\ell'(x)=x^2+2x$이므로 $\dfrac{a^3}3+a^2+\dfrac53=a(a^2+2a)$, 즉 $\dfrac13(2a^3+3a^2-5)=\dfrac13(a-1)(2a^2+5a+5)=0$이다. $2a^2+5a+5>0$이므로 $a=1$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $\ell(1)=\dfrac13+1+\dfrac53=3=\sqrt{1+\{f(1)+\sqrt2\}^2}$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $\{f(1)+\sqrt2\}^2=8$이고 $f(1)>0$이므로 $f(1)=\sqrt2$, 접점은 $(1,\sqrt2)$이다.
      criteria: ['2.A2']
  - id: S2-ALT
    audience: ALT
    source_flow: 해설교재 p.107 별해
    method_no: 2
    key_idea: $\ell'(a)=\sqrt{1+f'(a)^2}$에서 $f'(a)$를 $a$로 나타내 $\ell(a)^2$의 두 표현을 비교한다.
    steps:
    - id: 2c-1
      content: |
        $\ell'(a)=a^2+2a$에서 $\{f'(a)\}^2=(a^2+2a)^2-1=(a+1)^2(a^2+2a-1)$, $f'(a)=(a+1)\sqrt{a^2+2a-1}$이다.
        $\{\ell(a)\}^2=a^2+\{af'(a)\}^2=a^2+\{a(a+1)\sqrt{a^2+2a-1}\}^2$과 $\left(\dfrac{a^3}3+a^2+\dfrac53\right)^2$의 차를 $h(a)$라 하면
        $h(a)=\dfrac19(a-1)(8a^5+38a^4+65a^3+55a^2+25a+25)$이고 $a>0$이므로 $h(a)=0$인 $a$는 $1$뿐이다. 이후 $f(1)=\sqrt2$는 같다.
      criteria: ['2.M1', '2.A1', '2.M2', '2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 25
      evidence: |
        접선 조건으로 $\ell(a)=a\ell'(a)$(또는 $\ell(a)^2=a^2+a^2f'(a)^2$)를 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M2, 1.R1], max_points: 25}
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 25
      evidence: |
        $a$에 대한 방정식을 인수분해해 $a=1$만 가능함을 보였다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        $\ell(1)=\sqrt{1+\{f(1)+\sqrt2\}^2}$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-3, 2c-1]
    - id: 2.A2
      mark_type: A
      points: 15
      evidence: |
        $f(1)>0$을 써서 접점 $(1,\sqrt2)$를 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(직접 계산 별해)}
  - {code: '71', misconception: MC-CAL-3004}
  misconceptions:
  - id: MC-CAL-3004
    outcome_code: '71'
    wrong_work: '접선이 $\mathrm{A}$를 지난다는 조건을 쓰지 않고 $\ell(a)=\ell''(a)$ 등 근거 없는 관계로 $a$를 정함'
    detect_cue: $f(a)+\sqrt2=af'(a)$가 풀이에 없다
    feedback: 접선의 방정식에 $\mathrm{A}$의 좌표를 넣으면 함숫값과 기울기 사이의 관계가 나옵니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    (3-2)의 $\ell(x)$에 대하여 $f(x)$ $(0\le x\le2a)$를 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: expression, value: 'f1=sqrt((x**3/3 + x**2 + 5/3)**2 - x**2) - sqrt(2); f2=(x**2 + 2*x - 1)**(3/2)/3 + sqrt(2)/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $1\le x\le2$에서는 $\ell'=\sqrt{1+f'^2}$으로 $f'$를 구해 적분하고, $0\le x\le1$에서는 $\ell^2=x^2+(f+\sqrt2)^2$으로 $f$를 직접 구한다.
    steps:
    - id: 3a
      content: |
        $f(x)=\sqrt{\left(\tfrac{x^3}3+x^2+\tfrac53\right)^2-x^2}-\sqrt2$ $(0\le x\le1)$, $f(x)=\tfrac13(x^2+2x-1)^{3/2}+\tfrac{\sqrt2}3$ $(1<x\le2)$
      criteria: ['3.M1', '3.A1', '3.M2', '3.A2']
    hint_ladder:
    - $x>1$에서 $\ell'(x)$는 곡선 길이의 피적분함수와 같다.
    - $f'(x)>0$이므로 제곱근의 부호를 고를 수 있다.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.107
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $1\le x\le2$인 경우: $\ell'(x)=\sqrt{1+\{f'(x)\}^2}=x^2+2x$이므로 $\{f'(x)\}^2=(x^2+2x)^2-1=(x+1)^2(x^2+2x-1)$이고 $f'(x)>0$이므로 $f'(x)=(x+1)\sqrt{x^2+2x-1}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        적분하면 $f(x)=\dfrac13(x^2+2x-1)^{3/2}+C$이고 $f(1)=\sqrt2$에서 $\dfrac{2\sqrt2}{3}+C=\sqrt2$, $C=\dfrac{\sqrt2}3$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $0\le x\le1$인 경우: $\ell(x)=\sqrt{x^2+\{f(x)+\sqrt2\}^2}=\dfrac{x^3}3+x^2+\dfrac53$이므로 $\{f(x)+\sqrt2\}^2=\left(\dfrac{x^3}3+x^2+\dfrac53\right)^2-x^2$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $f(x)>0$이므로 $f(x)+\sqrt2>0$이고 $f(x)=\left\{\left(\dfrac{x^3}3+x^2+\dfrac53\right)^2-x^2\right\}^{1/2}-\sqrt2$이다. 정리하면
        $$f(x)=\begin{cases}\left\{\left(\dfrac{x^3}3+x^2+\dfrac53\right)^2-x^2\right\}^{1/2}-\sqrt2&(0\le x\le1)\\\dfrac13(x^2+2x-1)^{3/2}+\dfrac{\sqrt2}3&(1<x\le2)\end{cases}$$
        이고 이 함수는 문제의 조건을 모두 만족한다.
      criteria: ['3.A2']
