intent: |
  아래로 볼록한 곡선과 수평선으로 둘러싸인 영역에서 한 점까지의 최단 경로가 접선을 경계로 "선분" 또는 "선분+곡선"이 됨을 해석하고, 경계점에서의 미분가능성, 주어진 경로 길이 함수로부터 접점과 원래 함수를 복원하는 능력을 본다.
key_idea: |
  $0\le x\le a$에서는 $\ell(x)=\sqrt{x^2+\{f(x)+\sqrt2\}^2}$, $a<x\le2a$에서는 $\ell(a)+\int_a^x\sqrt{1+\{f'(t)\}^2}dt$이고, 접선 조건 $f(a)+\sqrt2=af'(a)$에서 $\ell(a)=a\ell'(a)$가 된다.
stuck: |
  최단 경로가 접점까지는 선분, 그 뒤로는 곡선을 따른다는 기하적 해석, 그리고 $\ell(a)=a\ell'(a)$로 접점의 $x$좌표를 방정식으로 바꾸는 것
