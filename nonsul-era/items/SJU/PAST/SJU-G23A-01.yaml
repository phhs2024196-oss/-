stimuli: []

stem: |
  미분가능한 함수 $f(x)$와 $g(x)=(x^2+2)e^{2x}+e^{4x}$이 모든 실수 $x>0$에 대하여 $(g\circ f)(x)=x$를 만족시킨다.

subparts:
- id: '1'
  stem: |
    방정식 $g(x)=3e^2+e^4$의 해는 $x=1$뿐임을 보이시오. 또한 방정식 $g(x)=3$의 해는 $x=0$뿐임을 보이시오.
  points: 70
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g'>0$이므로 $g$는 일대일이고, $g(1)$, $g(0)$을 직접 계산하면 된다.
    steps:
    - {id: 1a, content: '$g^{\prime}(x)=(2x^2+2x+4)e^{2x}+4e^{4x}>0$, $g(1)=3e^2+e^4$, $g(0)=3$', criteria: ['1.M1', '1.R1', '1.R2']}
    hint_ladder:
    - $g$는 증가함수인가?
    - 증가함수라면 같은 값을 두 번 가질 수 있는가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.82
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g'(x)=2xe^{2x}+2(x^2+2)e^{2x}+4e^{4x}=(2x^2+2x+4)e^{2x}+4e^{4x}$이다. $2x^2+2x+4=2\left(x+\tfrac12\right)^2+\tfrac72>0$이므로 모든 실수 $x$에서 $g'(x)>0$이고, $g$는 증가함수이므로 일대일함수이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $g(1)=3e^2+e^4$이므로 $x=1$은 방정식 $g(x)=3e^2+e^4$의 해이고, $g$가 일대일이므로 다른 해는 없다.
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        $g(0)=2+1=3$이므로 같은 이유로 $x=0$이 방정식 $g(x)=3$의 유일한 해이다. ■
      criteria: ['1.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: |
        $g'(x)=(2x^2+2x+4)e^{2x}+4e^{4x}$를 구하고 $g'(x)>0$의 근거를 적어 $g$가 증가(일대일)함수임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 20
      evidence: |
        $g(1)=3e^2+e^4$을 확인하고 일대일성으로 해가 $x=1$뿐이라고 결론지었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R2
      mark_type: R
      points: 20
      evidence: |
        $g(0)=3$을 확인하고 일대일성으로 해가 $x=0$뿐이라고 결론지었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 해를 대입해 확인만 하고 유일성 근거(증가·일대일)를 적지 않음
      effect: cap
      value: 30
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRF-0003}
  misconceptions:
  - id: MC-PRF-0003
    outcome_code: '71'
    wrong_work: '$x=1$을 대입하면 성립하므로 해는 $x=1$뿐이다'
    detect_cue: 대입 확인만 있고 다른 해가 없다는 근거(증가함수)가 없다
    feedback: 해가 '뿐'임을 보이려면 $g$가 일대일(증가)임을 먼저 보여야 합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    극한 $\displaystyle\lim_{x\to0+}xf'(x)$를 구하시오.
  points: 80
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: ['0.5'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=t$로 두면 $x f'(x)=\dfrac{g(t)}{g'(t)}$이고 $x\to0+$일 때 $t\to-\infty$이다.
    steps:
    - {id: 2a, content: '$\lim_{t\to-\infty}\dfrac{t^2+2+e^{2t}}{2t^2+2t+4+4e^{2t}}=\dfrac12$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - $x=g(f(x))$에서 $x\to0+$이면 $f(x)$는 어떻게 되는가?
    - $f'(x)$를 $g'$으로 나타내 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.82
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $x=g(f(x))=\{f(x)^2+2+e^{2f(x)}\}e^{2f(x)}$이다. $x\to0+$일 때 좌변은 $0$으로 가고, $f(x)^2+2+e^{2f(x)}>2$이므로 $e^{2f(x)}\to0$이어야 한다. 따라서 $f(x)=t$라 하면 $x\to0+$일 때 $t\to-\infty$이다.
      criteria: ['2.M1', '2.A1']
    - id: 2b-2
      content: |
        역함수의 미분법으로 $f'(x)=\dfrac{1}{g'(f(x))}=\dfrac{1}{\{2f(x)^2+2f(x)+4\}e^{2f(x)}+4e^{4f(x)}}$이므로
        $$xf'(x)=\dfrac{\{f(x)^2+2\}e^{2f(x)}+e^{4f(x)}}{\{2f(x)^2+2f(x)+4\}e^{2f(x)}+4e^{4f(x)}}=\dfrac{f(x)^2+2+e^{2f(x)}}{2f(x)^2+2f(x)+4+4e^{2f(x)}}.$$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $\displaystyle\lim_{x\to0+}xf'(x)=\lim_{t\to-\infty}\dfrac{t^2+2+e^{2t}}{2t^2+2t+4+4e^{2t}}=\dfrac12$ (분자·분모를 $t^2$으로 나누고 $e^{2t}\to0$).
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        $x=g(f(x))$의 식에서 $x\to0+$일 때의 $f(x)$의 거동을 조사했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $e^{2f(x)}\to0$, 즉 $f(x)\to-\infty$임을 근거와 함께 얻었다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 25
      evidence: |
        $f'(x)=\dfrac{1}{g'(f(x))}$을 쓰고 $xf'(x)$를 $f(x)$만의 식(또는 $\dfrac{g(t)}{g'(t)}$)으로 바꿨다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        극한값 $\dfrac12$을 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3070}
  misconceptions:
  - id: MC-CAL-3070
    outcome_code: '71'
    wrong_work: '$x\to0+$이면 $f(x)\to f(0)=0$으로 두어 $\lim xf^{\prime}(x)=0\cdot\dfrac{1}{g^{\prime}(0)}=0$'
    detect_cue: $f$의 정의역이 $x>0$인데 $f(0)$을 쓰고, 답이 $0$이다
    feedback: $g(t)\to0$이 되는 것은 $t\to-\infty$일 때입니다. $x=g(f(x))\to0$에서 $f(x)$의 극한을 다시 보세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    $\displaystyle\int_3^{3e^2+e^4}f(x)\,dx$를 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: '3*exp(4)/4 + 7*exp(2)/4 + 3/2', equivalents: ['(3*e**4+7*e**2+6)/4'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f(x)=t$로 치환하면 $dx=g'(t)\,dt$이고 구간은 $0\to1$이다.
    steps:
    - {id: 3a, content: '$\int_0^1 t\{(2t^2+2t+4)e^{2t}+4e^{4t}\}dt=\tfrac34e^4+\tfrac74e^2+\tfrac32$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - $3$과 $3e^2+e^4$은 $g$의 어떤 값인가?
    - $f(x)=t$로 치환해 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.82
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1-1)에서 $g(0)=3$, $g(1)=3e^2+e^4$이고 $f$는 $g$의 역함수이므로 $f(3)=0$, $f(3e^2+e^4)=1$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $f(x)=t$로 치환하면 $dt=f'(x)\,dx=\dfrac{dx}{(2t^2+2t+4)e^{2t}+4e^{4t}}$, 즉 $dx=\{(2t^2+2t+4)e^{2t}+4e^{4t}\}dt$이므로
        $$\int_3^{3e^2+e^4}f(x)\,dx=\int_0^1 t\{(2t^2+2t+4)e^{2t}+4e^{4t}\}dt.$$
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        부분적분으로 $\displaystyle\int_0^1(2t^3+2t^2+4t)e^{2t}dt=\left[(t^3-\tfrac12t^2+\tfrac52t-\tfrac54)e^{2t}\right]_0^1=\tfrac74e^2+\tfrac54$, $\displaystyle\int_0^1 4te^{4t}dt=\left[(t-\tfrac14)e^{4t}\right]_0^1=\tfrac34e^4+\tfrac14$.
        따라서 값은 $\dfrac34e^4+\dfrac74e^2+\dfrac32$이다.
      criteria: ['3.A1']
  - id: S3-ALT1
    audience: ALT
    source_flow: 해설교재 p.82 별해1
    method_no: 2
    key_idea: $\int f\,dx=[xf(x)]-\int xf'(x)\,dx$로 부분적분한 뒤 $x=g(f(x))$를 대입하고 $f(x)=t$로 치환한다.
    steps:
    - id: 3c-1
      content: |
        $\displaystyle\int_3^{3e^2+e^4}f(x)dx=[xf(x)]_3^{3e^2+e^4}-\int_3^{3e^2+e^4}xf'(x)dx=3e^2+e^4-\int_0^1\{(t^2+2)e^{2t}+e^{4t}\}dt=\dfrac34e^4+\dfrac74e^2+\dfrac32$.
      criteria: ['3.M2', '3.A1']
  - id: S3-ALT2
    audience: ALT
    source_flow: 해설교재 p.82 별해2
    method_no: 3
    key_idea: $f(x)=t$, $x=g(t)$, $dx=g'(t)dt$로 바꾼 뒤 $\int_0^1 tg'(t)dt=[tg(t)]_0^1-\int_0^1 g(t)dt$.
    steps:
    - id: 3d-1
      content: |
        $\displaystyle\int_0^1 t\,g'(t)\,dt=[tg(t)]_0^1-\int_0^1 g(t)\,dt=3e^2+e^4-\int_0^1\{(t^2+2)e^{2t}+e^{4t}\}dt$이고, $\displaystyle\int_0^1(t^2+2)e^{2t}dt=\left[\left(\tfrac12t^2-\tfrac12t+\tfrac54\right)e^{2t}\right]_0^1=\tfrac54e^2-\tfrac54$, $\displaystyle\int_0^1e^{4t}dt=\tfrac14e^4-\tfrac14$이므로 값은 $\dfrac34e^4+\dfrac74e^2+\dfrac32$.
      criteria: ['3.M2', '3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $f(3)=0$, $f(3e^2+e^4)=1$을 적분 구간의 변환에 썼다.
      depends_on: []
      implied_ok: true
      ft: {allowed: true, from: [1.R1, 1.R2], max_points: 20}
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 30
      evidence: |
        $f(x)=t$ 치환으로 $\displaystyle\int_0^1 t\,g'(t)\,dt$ 꼴(또는 부분적분으로 $3e^2+e^4-\int_0^1 g(t)dt$ 꼴)의 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [3b-2, 3c-1, 3d-1]
    - id: 3.A1
      mark_type: A
      points: 30
      evidence: |
        $\dfrac34e^4+\dfrac74e^2+\dfrac32$을 얻었다.
      depends_on: [3.M2]
      steps: [3b-3, 3c-1, 3d-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점(치환)}
  - {code: '21', meaning: 만점(부분적분)}
  - {code: '71', misconception: MC-CAL-3076}
  misconceptions:
  - id: MC-CAL-3076
    outcome_code: '71'
    wrong_work: '$f(x)=t$로 치환하고 $dx$를 그대로 $dt$로 바꿔 $\int_0^1t\,dt=\tfrac12$'
