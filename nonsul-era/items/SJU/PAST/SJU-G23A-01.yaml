intent: |
  증가함수의 일대일 대응으로 방정식의 해를 확정하고, 역함수의 미분법과 치환적분(또는 부분적분)으로 역함수의 극한·정적분을 계산하는 능력을 본다.
key_idea: |
  $f$는 $g$의 역함수이므로 $f'(x)=\dfrac{1}{g'(f(x))}$이고, $f(x)=t$로 치환하면 $x\to0+$일 때 $t\to-\infty$, 적분은 $\displaystyle\int_0^1 t\,g'(t)\,dt$가 된다.
stuck: |
  $x\to0+$일 때 $f(x)\to-\infty$임을 $g(f(x))=x$의 극한에서 끌어내는 것, 그리고 적분 구간 $3$, $3e^2+e^4$가 $g(0)$, $g(1)$임을 알아보는 것
