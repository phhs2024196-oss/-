  - '$f(x)=t$ 치환(역함수 치환)'
  - '$x f''(x)=\dfrac{g(t)}{g''(t)}$ 꼴로 바꾸어 $t\to-\infty$ 극한'
  - '$\int t\,g''(t)\,dt$의 부분적분'
  conditions:
  - '$(g\circ f)(x)=x$ ($x>0$) ⇒ $f$는 $g$의 역함수'
  - '$g(1)=3e^2+e^4$, $g(0)=3$ ⇒ $f(3e^2+e^4)=1$, $f(3)=0$'
  - '$x\to0+$ ⇒ $e^{2f(x)}\to0$ ⇒ $f(x)\to-\infty$'
  stimuli_used: []
  subpart_links: '(1-3)은 (1-1)의 f(3)=0, f(3e^2+e^4)=1 을 적분 구간 변환에 사용'

