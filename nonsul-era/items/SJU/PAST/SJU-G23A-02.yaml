key_idea: |
  $y'=\dfrac{x+y-1}{x+y+1}$이므로 $y'=0\iff x+y=1$이고 관계식에서 $x=y=\tfrac12$. $f(0)=f(\alpha)=\beta$이면 $\beta=\dfrac{\alpha}{e^\alpha-1}>\tfrac12$이 되어 $2\alpha+1>e^\alpha$.
stuck: |
  두 관계식 $\beta+\ln\beta=0$, $\beta+\ln(\alpha+\beta)=\alpha$를 빼서 $\beta$를 $\alpha$로 나타내고, 최솟값 $\tfrac12$을 부등식의 근거로 쓰는 발상
