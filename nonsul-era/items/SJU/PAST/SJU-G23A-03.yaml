intent: |
  닫힌구간 $[t,t+1]$에서의 최댓값 함수 $g(t)$의 개형을 삼차함수의 극값 배치에 따라 분류하고, 미분불가능점과 상수 구간 조건으로 삼차함수를 결정하는 능력을 본다.
key_idea: |
  $f(\alpha+1)<f(\alpha)$일 때 $g$는 $[\alpha-1,\alpha]$에서 상수 $f(\alpha)$이고, 미분불가능한 점은 $f(\gamma)=f(\gamma+1)$인 $\gamma$(극소점이 $(\gamma,\gamma+1)$ 안) 하나뿐이다. 따라서 $\gamma=3$, $f(3)=f(4)$.
stuck: |
  $g$의 꺾인 점이 상수 구간의 끝($\alpha-1$, $\alpha$)이 아니라 $f(t)=f(t+1)$이 되는 점이라는 것, 그리고 상수 구간 $[\alpha-1,\alpha]$가 $\left[0,\tfrac12\right]$을 포함해야 한다는 것
