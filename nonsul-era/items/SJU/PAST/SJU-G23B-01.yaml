stimuli: []

stem: |
  실수 전체의 집합에서 정의된 함수 $f(x)$는 다음을 만족시킨다.

  (가) $0\le x\le2$일 때 $f(x)=x^3-3x^2+4$이다.
  (나) 임의의 실수 $x$에 대하여 $f(-x)=f(x)$이다.
  (다) 임의의 실수 $x$에 대하여 $f(x)=f(x+4)$이다.

  열린구간 $(2,4)$에서 정의된 함수 $h(x)$는 열린구간 $(2,4)$에 속하는 모든 $x$에 대하여 $h(x)=f(x)$이다. $h(x)$의 역함수를 $h^{-1}(x)$라 하자.

subparts:
- id: '1'
  stem: |
    $h^{-1}(2)$를 구하시오.
  points: 70
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $[0,2]$에서 $f(x)=2$인 $x=1$을 찾고, 대칭·주기로 $(2,4)$ 안의 점 $3$으로 옮긴다.
    steps:
    - {id: 1a, content: '$f(1)=2$, $f(3)=f(-1)=f(1)$, $3\in(2,4)\Rightarrow h^{-1}(2)=3$', criteria: ['1.M1', '1.A1', '1.R1']}
    hint_ladder:
    - $0\le x\le2$에서 $f(x)=2$를 풀어 보자.
    - $(2,4)$ 안의 점으로 옮기려면 (나)와 (다)를 어떻게 쓰는가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.86
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $0\le x\le2$에서 $x^3-3x^2+4=2$를 풀면 $(x-1)(x^2-2x-2)=0$, $x=1$ 또는 $x=1\pm\sqrt3$이고 이 중 $0\le x\le2$인 것은 $x=1$뿐이다.
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        $f(1)=f(-1)=f(-1+4)=f(3)$이고 $3\in(2,4)$이므로 $h(3)=2$, 즉 $h^{-1}(2)=h^{-1}(h(3))=3$이다.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $0\le x\le2$에서 방정식 $x^3-3x^2+4=2$를 세워 인수분해했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        구간 $[0,2]$의 해가 $x=1$뿐임을 얻었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 30
      evidence: |
        (나)·(다)로 $f(3)=f(1)=2$를 보이고 $3\in(2,4)$이므로 $h^{-1}(2)=3$이라 결론지었다.
      depends_on: [1.A1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3073}
  misconceptions:
  - id: MC-CAL-3073
    outcome_code: '71'
    wrong_work: '$f(1)=2$이므로 $h^{-1}(2)=1$'
    detect_cue: 답이 $h$의 정의역 $(2,4)$ 밖의 값이다
    feedback: $h$는 $(2,4)$에서만 정의되므로 $h^{-1}(2)$도 $(2,4)$ 안에 있어야 합니다. 대칭·주기로 옮기세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $(h^{-1})'(2)$를 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $(h^{-1})'(2)=\dfrac{1}{h'(3)}$이고 $h'(3)=f'(3)=-f'(1)=3$.
    steps:
    - {id: 2a, content: '$(h^{-1})^{\prime}(2)=\dfrac{1}{f^{\prime}(3)}=\dfrac{-1}{f^{\prime}(1)}=\dfrac13$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 역함수의 미분법을 쓰려면 $h'(3)$이 필요하다.
    - 우함수의 도함수는 어떤 함수인가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.86
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        역함수의 미분법에서 $(h^{-1})'(2)=\dfrac{1}{h'(h^{-1}(2))}=\dfrac{1}{h'(3)}=\dfrac{1}{f'(3)}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $0<x<2$에서 $f'(x)=3x^2-6x$이다. (나)에서 $f'(-x)=-f'(x)$, (다)에서 $f'(x+4)=f'(x)$이므로 $f'(3)=f'(-1)=-f'(1)$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $f'(1)=3-6=-3$이므로 $(h^{-1})'(2)=\dfrac{-1}{f'(1)}=\dfrac13$이다.
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    source_flow: 해설교재 p.86 별해
    method_no: 2
    key_idea: $2<x<4$이면 $0<4-x<2$이고 $h(x)=f(x-4)=f(4-x)$이므로 $h'(x)=-f'(4-x)$.
    steps:
    - id: 2c-1
      content: |
        $h(x)=f(4-x)=(4-x)^3-3(4-x)^2+4$이므로 $h'(3)=-f'(1)=3$이고 $(h^{-1})'(2)=\dfrac{1}{h'(3)}=\dfrac13$이다.
      criteria: ['2.M2', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 25
      evidence: |
        $(h^{-1})'(2)=\dfrac{1}{h'(h^{-1}(2))}=\dfrac1{h'(3)}$을 썼다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.R1], max_points: 25}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 30
      evidence: |
        대칭·주기(또는 $h(x)=f(4-x)$)로 $h'(3)=f'(3)=-f'(1)$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 25
      evidence: |
        $(h^{-1})'(2)=\dfrac13$을 얻었다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3074}
  misconceptions:
  - id: MC-CAL-3074
    outcome_code: '71'
    wrong_work: '$h^{\prime}(3)=f^{\prime}(1)=-3$으로 두어 $(h^{-1})^{\prime}(2)=-\tfrac13$'
    detect_cue: 답이 음수이다($h$는 $(2,4)$에서 증가)
    feedback: $h(x)=f(4-x)$이므로 미분하면 $-f'(4-x)$입니다. 우함수의 도함수는 기함수예요.
    remedy: [RL-2]

- id: '3'
  stem: |
    실수 $t>0$에 대하여 두 점 $(0,\,f(0))$과 $(t,\,f(t))$를 지나는 직선의 기울기를 $g(t)$라 하자. $(h^{-1})'(x)=\lvert g(t)\rvert$를 만족시키는 실수 $x$가 존재하도록 하는 $t$의 최댓값을 $t_0$이라 할 때, $n<t_0<n+1$을 만족시키는 자연수 $n$을 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: value, value: '10', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $(h^{-1})'$의 값의 범위는 $\left[\tfrac13,\infty\right)$이므로 $g(t)\le-\tfrac13$, 즉 $f(t)\le4-\tfrac t3$인 $t$의 최댓값.
    steps:
    - {id: 3a, content: '$(h^{-1})^{\prime}\ge\tfrac13$, $g(t)\le-\tfrac13\iff f(t)\le-\tfrac t3+4$, $g(11)=-\tfrac2{11}>-\tfrac13$ ⇒ $10<t_0<11$', criteria: ['3.M1', '3.A1', '3.M2', '3.R1']}
    hint_ladder:
    - $(h^{-1})'(x)$는 어떤 값들을 가질 수 있는가?
    - $g(t)\le-\tfrac13$은 그래프에서 무엇을 뜻하는가?
    - $t=10$, $t=11$에서 $g(t)$를 계산해 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.86
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $0<x<2$에서 $f'(x)=3x^2-6x$이므로 $-3\le f'(x)<0$이다. (1-2)와 같이 $h'(x)=-f'(4-x)\in(0,3]$이므로 $0<x<4$에서 $(h^{-1})'(x)\ge\dfrac13$이고, $(h^{-1})'$은 $\dfrac13$ 이상의 모든 값을 가진다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $t>0$이면 $f(t)\le4=f(0)$이므로 $g(t)=\dfrac{f(t)-4}{t}\le0$이다. 따라서 조건을 만족시키는 $x$가 존재할 조건은 $\lvert g(t)\rvert\ge\dfrac13$, 즉 $g(t)\le-\dfrac13$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $g(t)\le-\dfrac13$은 점 $(t,f(t))$가 $(0,4)$를 지나고 기울기가 $-\dfrac13$인 직선 $y=-\dfrac13x+4$ 위 또는 아래에 있다는 뜻이다. 이 직선과 곡선 $y=f(x)$가 만나는 점의 $x$좌표의 최댓값을 $t_1$이라 하면, $f(10)=0<4-\tfrac{10}{3}$이므로 $t_1>10$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $f(11)=f(-1)=f(1)=2$이므로 $g(11)=-\dfrac{2}{11}>-\dfrac13$이고 $t_1<11$이다. $t\ge11$이면 $t<12$에서는 $f$가 증가하고 직선은 감소하며, $t\ge12$에서는 직선이 $0$ 이하인데 $f(t)=0$인 $t$($t=14,18,\dots$)에서도 직선이 음수이므로 $g(t)>-\dfrac13$이다. 따라서 $t_0=t_1$이고 $10<t_0<11$, 즉 $n=10$이다.
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $(h^{-1})'(x)\ge\dfrac13$(값의 범위 $\left[\tfrac13,\infty\right)$)을 근거와 함께 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.M2], max_points: 20}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $g(t)\le0$을 밝히고 존재 조건을 $g(t)\le-\dfrac13$으로 바꿨다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        직선 $y=-\dfrac13x+4$와 그래프의 위치 관계(또는 $f(t)\le4-\tfrac t3$)로 $t_0>10$을 보였다.
      depends_on: [3.A1]
      steps: [3b-3]
    - id: 3.R1
      mark_type: R
      points: 25
      evidence: |
        $g(11)=-\dfrac2{11}>-\dfrac13$과 $t\ge11$에서 조건이 성립하지 않음을 근거로 $10<t_0<11$, $n=10$을 결론지었다.
      depends_on: [3.M2]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3074}
  misconceptions:
  - id: MC-CAL-3074
    outcome_code: '71'
    wrong_work: '$(h^{-1})^{\prime}$의 범위를 $\left(0,\tfrac13\right]$로 두어 $\lvert g(t)\rvert\le\tfrac13$인 $t$의 최댓값을 찾음'
    detect_cue: 부등호 방향이 반대이거나 $t_0$을 매우 큰 값(무한)으로 답했다
    feedback: $h'$의 범위가 $(0,3]$이면 그 역수인 $(h^{-1})'$의 범위는 $\left[\tfrac13,\infty\right)$입니다.
    remedy: [RL-2]

