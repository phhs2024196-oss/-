intent: |
  우함수·주기함수의 성질로 구간을 옮겨 역함수의 함숫값과 미분계수를 구하고, 역함수 도함수의 값의 범위와 할선 기울기를 비교해 조건을 만족하는 매개변수의 최댓값을 추정하는 능력을 본다.
key_idea: |
  $(2,4)$에서 $h(x)=f(4-x)$이므로 $h'(x)=-f'(4-x)\in(0,3]$, 따라서 $(h^{-1})'\ge\tfrac13$. 조건은 $\lvert g(t)\rvert\ge\tfrac13$, 즉 $(0,4)$를 지나는 기울기 $-\tfrac13$ 직선과 그래프의 마지막 교점이 $t_0$.
stuck: |
  $(h^{-1})'(x)$가 가질 수 있는 값의 범위가 $\left[\tfrac13,\infty\right)$임을 알고, 존재 조건을 $g(t)\le-\tfrac13$으로 바꾸는 것
