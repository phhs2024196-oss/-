intent: |
  정적분으로 정의된 함수의 도함수로 최솟값을 판정하고, 부분적분·지수 치환으로 다른 적분을 주어진 값으로 나타내며, $x=\dfrac1y$ 대칭 치환으로 $I=-I$를 얻는 능력을 본다.
key_idea: |
  $f'(x)=\tan(\ln x)$. $\int\tan(\ln x)dx$의 부분적분에서 $\int\sec^2(\ln x)dx$가 나오고 $x=e^t$로 $\int e^t\sec^2t\,dt$로 바뀐다. (2-3)은 $I=\int_{1/e}^e\left(1+\dfrac1{x^2}\right)\tan(\ln x)dx$이고 $x=\dfrac1y$이면 $I=-I$.
stuck: |
  $-f\!\left(\tfrac1e\right)$을 적분 $\int_{1/e}^e\tan(\ln x)dx$로 바꿔 하나의 적분으로 합치고, $x\mapsto\tfrac1x$에서 피적분식이 부호만 바뀜을 알아보는 것
