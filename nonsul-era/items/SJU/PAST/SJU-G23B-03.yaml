stimuli: []

stem: |
  그림과 같이 가로의 길이가 $a>1$이고 세로의 길이가 $1$인 직사각형이 있다. 꼭짓점 $\mathrm{A}$에서 출발하여 직사각형의 네 변을 따라서 시계 방향으로 이동한 거리가 $s$인 위치의 점 $\mathrm{P}(s)$와 점 $\mathrm{A}$ 사이의 거리를 $f(s)$라 하자. (단, $0\le s\le2a+2$)
  (그림: 꼭짓점 $\mathrm{A}$는 직사각형의 왼쪽 아래 꼭짓점이고, 점은 $\mathrm{A}$에서 왼쪽 세로변을 따라 위로 올라간 뒤 윗변을 따라 오른쪽, 오른쪽 세로변을 따라 아래, 아랫변을 따라 왼쪽으로 이동한다. 윗변 위의 $\mathrm{P}(s)$와 $\mathrm{A}$를 잇는 점선의 길이가 $f(s)$, 가로 $a$, 세로 $1$이 표시됨)

  또한 곡선 $y=f(s)$ 위의 점 $(t,\,f(t))$에서의 접선을 $\ell_t$라 하자. (단, $1<t<a+1$ 또는 $a+1<t<a+2$)

subparts:
- id: '1'
  stem: |
    $0\le s\le2a+2$에서 $f(s)$를 구하시오. 또한 곡선 $y=f(s)$ 위의 점 $(2,\,f(2))$에서의 접선 $\ell_2$의 방정식을 구하시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: 'f1 = s; f2 = sqrt((s-1)**2+1); f3 = sqrt((s-a-2)**2+a**2); f4 = 2*a+2-s; l2 = sqrt(2)*s/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{A}=(0,0)$으로 두고 네 변 위에서 $\mathrm{P}(s)$의 좌표를 쓰면 거리 공식으로 $f$가 나온다.
    steps:
    - {id: 1a, content: '$f(s)=s,\ \sqrt{(s-1)^2+1},\ \sqrt{(s-a-2)^2+a^2},\ 2a+2-s$; $\ell_2:y=\tfrac{\sqrt2}{2}s$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 점 $\mathrm{A}$를 원점으로 하는 좌표를 잡아 보자.
    - $s$가 $1$, $a+1$, $a+2$를 지날 때마다 $\mathrm{P}(s)$가 있는 변이 바뀐다.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.89
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{A}(0,0)$이라 하면 $\mathrm{P}(s)$는 $0\le s\le1$에서 $(0,s)$, $1\le s\le a+1$에서 $(s-1,1)$, $a+1\le s\le a+2$에서 $(a,\,a+2-s)$, $a+2\le s\le2a+2$에서 $(2a+2-s,\,0)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $f(s)=s$ $(0\le s\le1)$, $\sqrt{(s-1)^2+1}$ $(1\le s\le a+1)$, $\sqrt{(s-a-2)^2+a^2}$ $(a+1\le s\le a+2)$, $2a+2-s$ $(a+2\le s\le2a+2)$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $1<s<a+1$에서 $f(s)=\sqrt{s^2-2s+2}$이므로 $f'(s)=\dfrac{s-1}{\sqrt{s^2-2s+2}}$이고 $f(2)=\sqrt2$, $f'(2)=\dfrac{\sqrt2}{2}$이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $\ell_2$: $y=\dfrac{\sqrt2}{2}(s-2)+\sqrt2$, 즉 $y=\dfrac{\sqrt2}{2}s$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        네 구간에서 $\mathrm{P}(s)$의 좌표를 $s$로 나타냈다.
      depends_on: []
      implied_ok: true
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 30
      evidence: |
        네 구간의 $f(s)$를 모두 바르게 적었다(구간 표시 포함).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        $f'(s)=\dfrac{s-1}{\sqrt{s^2-2s+2}}$을 구해 $f(2)$, $f'(2)$를 계산했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $\ell_2:y=\dfrac{\sqrt2}{2}s$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 구간(정의역) 표시 누락
      effect: minus
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3004}
  misconceptions:
  - id: MC-CAL-3004
    outcome_code: '71'
    wrong_work: '$\ell_2$를 기울기 $f^{\prime}(2)$만 쓰고 점 $(2,\sqrt2)$를 지나지 않게 $y=\tfrac{\sqrt2}{2}s+\sqrt2$로 씀'
    detect_cue: 접선이 접점 $(2,\sqrt2)$를 지나지 않는다
    feedback: 접선은 기울기 $f'(2)$와 접점 $(2,f(2))$ 두 조건으로 정해집니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $1<\alpha<a+1$일 때 $\ell_\alpha$와 곡선 $y=f(s)$의 교점의 개수를 $\alpha$의 값의 범위에 따라 구하시오. 또한 $a+1<\beta<a+2$일 때 $\ell_\beta$와 곡선 $y=f(s)$의 교점의 개수를 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: 'alpha_in_(1,2] = 3; alpha_in_(2,a+1) = 2; beta = 3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 볼록한 증가·감소 부분의 접선이 꼭짓점 $(0,0)$, $(2a+2,0)$의 어느 쪽에서 $s$축과 만나는지로 교점 수가 갈린다.
    steps:
    - {id: 2a, content: '$\ell_\alpha$가 원점을 지남 $\iff\alpha=2$; $1<\alpha\le2$: 3개, $2<\alpha<a+1$: 2개; $\ell_\beta$: 3개', criteria: ['2.M1', '2.A1', '2.R1', '2.R2']}
    hint_ladder:
    - $f''$의 부호로 각 구간의 볼록을 판정해 보자.
    - $\ell_\alpha$가 원점을 지나는 $\alpha$는?
    - $\ell_\beta$의 $s$절편은 $2a+2$보다 큰가 작은가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.89~90
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $1<s<a+1$에서 $f'(s)=\dfrac{s-1}{\sqrt{s^2-2s+2}}>0$, $f''(s)=\dfrac{1}{(s^2-2s+2)^{3/2}}>0$이므로 아래로 볼록인 증가함수이고, $a+1<s<a+2$에서 $f'(s)=\dfrac{s-a-2}{\sqrt{(s-a-2)^2+a^2}}<0$, $f''(s)=\dfrac{a^2}{\{(s-a-2)^2+a^2\}^{3/2}}>0$이므로 아래로 볼록인 감소함수이다. 양 끝 구간에서는 기울기 $1$, $-1$인 선분이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\ell_\alpha$가 $(0,0)$을 지날 조건은 $\dfrac{\sqrt{\alpha^2-2\alpha+2}}{\alpha}=\dfrac{\alpha-1}{\sqrt{\alpha^2-2\alpha+2}}$, 즉 $\alpha^2-2\alpha+2=\alpha^2-\alpha$에서 $\alpha=2$이다. 볼록한 증가 부분의 접선이므로 $1<\alpha\le2$이면 $\ell_\alpha$의 $s$절편은 $0$ 이하이고, $2<\alpha<a+1$이면 $s$절편은 $0$과 $a+1$ 사이이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $\ell_\alpha$는 볼록한 구간 $[1,a+1]$에서는 접점에서만 곡선과 만나고 그 밖에서는 곡선 아래에 있다. 증가하는 직선이므로 감소 구간 $[a+1,2a+2]$에서 곡선과 정확히 한 번 만난다(왼쪽 끝에서 곡선 아래, $s=2a+2$에서 직선은 양수). 구간 $[0,1]$에서는 절편이 $0$ 이하이면 $y=s$와 한 번 만나고($\alpha=2$일 때는 원점), 절편이 양수이면 만나지 않는다. 따라서 교점(접점 포함)은 $1<\alpha\le2$일 때 $3$개, $2<\alpha<a+1$일 때 $2$개이다.
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        $\ell_\beta$가 $(2a+2,0)$을 지날 조건 $-\dfrac{f(\beta)}{(2a+2)-\beta}=f'(\beta)$을 정리하면 $\beta=2$인데 $\beta>a+1>2$이므로 모순이다. 볼록한 감소 부분의 접선이므로 이는 $\ell_\beta$의 $s$절편이 $2a+2$보다 큼을 뜻한다. 같은 논리로 $\ell_\beta$는 $[a+1,a+2]$에서 접점에서만, $[a+2,2a+2]$에서 한 번, 증가 구간 $[0,a+1]$에서 한 번 곡선과 만나므로 교점은 $3$개이다.
      criteria: ['2.R2']
  - id: S2-ALT
    audience: ALT
    source_flow: 해설교재 p.90 별해
    method_no: 2
    key_idea: $\ell_\beta$의 $s$절편을 직접 계산한다.
    steps:
    - id: 2c-1
      content: |
        $\ell_\beta$의 $s$절편은 $\beta-\dfrac{f(\beta)}{f'(\beta)}=(2a+2)-\dfrac{a(\beta-2)}{\beta-a-2}$이고, $2<a+1<\beta<a+2$이므로 $\beta-2>0$, $\beta-a-2<0$에서 절편은 $2a+2$보다 크다.
      criteria: ['2.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        두 곡선 구간에서 $f'$, $f''$의 부호로 증가·감소와 아래로 볼록을 밝혔다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 15}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $\ell_\alpha$가 원점을 지나는 경계 $\alpha=2$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 25
      evidence: |
        각 구간에서의 교점을 따져 $1<\alpha\le2$일 때 3개, $2<\alpha<a+1$일 때 2개라고 근거와 함께 답했다.
      depends_on: [2.A1]
      steps: [2b-3]
    - id: 2.R2
      mark_type: R
      points: 20
      evidence: |
        $\ell_\beta$의 $s$절편이 $2a+2$보다 큼을 보이고 교점이 3개라고 답했다.
      depends_on: [2.M1]
      steps: [2b-4, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3077}
  misconceptions:
  - id: MC-CAL-3077
    outcome_code: '71'
    wrong_work: '접점을 교점에서 빼서 $2$개·$1$개·$2$개로 답하거나, 선분 구간 $[0,1]$의 교점을 놓침'
    detect_cue: 개수가 정답보다 1 작다
    feedback: 접점도 교점입니다. 그리고 꺾인 그래프의 각 조각(선분 포함)을 모두 확인하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    $1<\alpha<a+1$이고 $a+1<\beta<a+2$인 $\alpha$, $\beta$에 대하여 두 직선 $\ell_\alpha$와 $\ell_\beta$가 이루는 예각을 $\theta(\alpha,\,\beta)$라 하자. 실수 $a>1$에 대하여 집합 $I_a$는 다음과 같이 주어진다.
    $$I_a=\{\theta(\alpha,\,\beta)\mid1<\alpha<a+1,\ a+1<\beta<a+2\}$$
    $I_a$는 열린구간 $(L(a),\,R(a))$이다. 이 때 $\displaystyle\lim_{a\to\infty}L(a)$와 $\displaystyle\lim_{a\to\infty}R(a)$를 각각 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: expression, value: 'limL = 0; limR = pi/4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\theta=\pi-\theta_\beta+\theta_\alpha$이고 $\tan\theta_\alpha\in\left(0,\tfrac{a}{\sqrt{a^2+1}}\right)$, $\tan\theta_\beta\in\left(-\tfrac1{\sqrt{a^2+1}},0\right)$.
    steps:
    - {id: 3a, content: '$L(a)=0$, $R(a)=\tan^{-1}\tfrac{a}{\sqrt{a^2+1}}+\tan^{-1}\tfrac{1}{\sqrt{a^2+1}}\to\tfrac\pi4$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2']}
    hint_ladder:
    - 각 접선이 $s$축의 양의 방향과 이루는 각을 생각하자.
    - 기울기는 $\alpha$, $\beta$의 양 끝에서 어떤 값으로 가는가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.90~91
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\ell_\alpha$, $\ell_\beta$가 $s$축의 양의 방향과 이루는 각을 $\theta_\alpha$, $\theta_\beta$라 하면 $\tan\theta_\alpha=f'(\alpha)=\dfrac{\alpha-1}{\sqrt{\alpha^2-2\alpha+2}}$, $\tan\theta_\beta=f'(\beta)=\dfrac{\beta-a-2}{\sqrt{\beta^2-2(a+2)\beta+2a^2+4a+4}}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $0<f'(\alpha)<1$, $-1<f'(\beta)<0$이므로 $0<\theta_\alpha<\dfrac\pi4$, $\dfrac{3\pi}4<\theta_\beta<\pi$이고, 두 직선이 이루는 예각은 $\theta(\alpha,\beta)=\pi-\theta_\beta+\theta_\alpha$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $\alpha$, $\beta$는 서로 독립이고 $f'(\alpha)$, $f'(\beta)$는 각 구간에서 단조이다. $\displaystyle\lim_{\alpha\to1+}f'(\alpha)=0$, $\displaystyle\lim_{\beta\to(a+2)-}f'(\beta)=0$이므로 $a$에 관계없이 $L(a)=\pi-\pi+0=0$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $\displaystyle\lim_{\alpha\to(a+1)-}f'(\alpha)=\dfrac{a}{\sqrt{a^2+1}}$, $\displaystyle\lim_{\beta\to(a+1)+}f'(\beta)=\dfrac{-1}{\sqrt{a^2+1}}$이므로 $R(a)$는 이 두 기울기에 대응하는 $\pi-\theta_\beta+\theta_\alpha$이다. $a\to\infty$이면 $\dfrac{a}{\sqrt{a^2+1}}\to1$, $\dfrac{-1}{\sqrt{a^2+1}}\to0$이므로 $\displaystyle\lim_{a\to\infty}R(a)=\pi-\pi+\dfrac\pi4=\dfrac\pi4$이다. 즉 $\displaystyle\lim_{a\to\infty}L(a)=0$, $\displaystyle\lim_{a\to\infty}R(a)=\dfrac\pi4$.
      criteria: ['3.A2']
