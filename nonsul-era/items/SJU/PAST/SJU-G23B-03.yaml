intent: |
  직사각형 둘레를 따라 움직이는 점까지의 거리를 구간별 함수로 세우고, 볼록성으로 접선과 곡선의 교점 개수를 분류하며, 두 접선이 이루는 예각의 범위와 그 극한을 구하는 능력을 본다.
key_idea: |
  $1<s<a+1$에서 $f$는 아래로 볼록인 증가함수, $a+1<s<a+2$에서 아래로 볼록인 감소함수이다. 접선의 절편이 꼭짓점 $(0,0)$, $(2a+2,0)$을 지나는 경계를 찾으면 교점 개수가 나뉜다. 예각은 $\pi-\theta_\beta+\theta_\alpha$.
stuck: |
  $\ell_\alpha$가 원점을 지나는 경계 $\alpha=2$를 찾는 것, 그리고 $\ell_\beta$의 $s$절편이 항상 $2a+2$보다 큼을 보이는 것
