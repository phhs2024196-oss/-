stimuli: []

stem: |
  실수 전체의 집합에서 다음과 같이 정의되는 함수 $f(x)$에 대하여 아래 물음에 각각 답하시오. (단, $n$은 자연수이다.)
  $$f(x)=\begin{cases}-\displaystyle\int_0^x\dfrac{(t+3)(t+1)}{(n+3)(n+1)}\,dt & (x<0)\\ \displaystyle\int_0^x\left\{\dfrac{t^3}{n^3}-\dfrac{(t+3)(t+1)}{(n+3)(n+1)}\right\}dt & (x\ge0)\end{cases}$$

subparts:
- id: '1'
  stem: |
    $x<0$일 때 $f(x)$의 극솟값을 구하시오.
  points: 70
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x<0$에서 $f'(x)=-\dfrac{(x+3)(x+1)}{(n+3)(n+1)}$의 부호가 $x=-3$에서 음에서 양으로 바뀐다.
    steps:
    - {id: 1a, content: '$f^{\prime}$의 부호: $(-\infty,-3)$ 음, $(-3,-1)$ 양 $\Rightarrow$ 극소 $f(-3)=-\tfrac{1}{(n+3)(n+1)}\left[\tfrac{t^3}{3}+2t^2+3t\right]_0^{-3}=0$', criteria: ['1.M1', '1.A1', '1.R1', '1.A2']}
    hint_ladder:
    - 정적분으로 정의된 함수는 미분하면 피적분함수가 된다. 앞의 음의 부호에 주의하자.
    - $f'(x)=0$인 두 점에서 부호가 어떻게 바뀌는가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.56
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x<0$에서 미적분의 기본정리에 의해 $f'(x)=-\dfrac{(x+3)(x+1)}{(n+3)(n+1)}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f'(x)=0$에서 $x=-3$ 또는 $x=-1$이다. $(n+3)(n+1)>0$이므로 $x<-3$일 때 $f'(x)<0$, $-3<x<-1$일 때 $f'(x)>0$, $-1<x<0$일 때 $f'(x)<0$이다(증감표).
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 $x<0$에서 $f(x)$는 $x=-3$에서 극소, $x=-1$에서 극대이다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        극솟값은 $f(-3)=-\dfrac{1}{(n+3)(n+1)}\left[\dfrac13t^3+2t^2+3t\right]_0^{-3}=-\dfrac{1}{(n+3)(n+1)}(-9+18-9)=0$이다.
      criteria: ['1.A2']
  rubric:
