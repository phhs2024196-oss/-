intent: |
  정적분으로 정의된 구간별 함수를 미분해 증감표를 만들고 극값·최솟값을 구한 뒤, 기울기가 0인 세 점이 만드는 삼각형의 가장 큰 각을 탄젠트의 덧셈정리로 판정하고 극한을 계산하는 능력을 본다.
key_idea: |
  $x<0$에서 $f'(x)=-\dfrac{(x+3)(x+1)}{(n+3)(n+1)}$, $x>0$에서 $f'(x)=\dfrac{x^3}{n^3}-\dfrac{(x+3)(x+1)}{(n+3)(n+1)}$이 $x=n$을 인수로 가진다. 세 점 $\mathrm{P}(-3,0)$, $\mathrm{Q}(-1,f(-1))$, $\mathrm{R}(n,f(n))$에서 $\angle\mathrm{PQR}$은 두 직선의 경사각의 차이다.
stuck: |
  $x>0$에서 $f'(x)=0$의 해가 $x=n$뿐임을 인수분해로 보이는 것, 그리고 가장 큰 각이 $\angle\mathrm{PQR}$(둔각)임을 경사각의 차의 탄젠트 부호로 판정하는 발상
