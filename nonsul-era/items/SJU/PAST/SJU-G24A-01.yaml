- id: '2'
  stem: |
    함수 $f(x)$의 최솟값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: '-n*(n+9)/(12*(n+1))', equivalents: ['-(n**2+9*n)/(12*n+12)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x\le0$에서 $f\ge0$이고, $x>0$에서 $f'(x)$가 $(x-n)\times(\text{양수})$ 꼴이므로 최솟값은 $f(n)<0$이다.
    steps:
    - {id: 2a, content: '$f^{\prime}(x)=\tfrac{(x-n)\{(n^2+4n+3)x^2+(4n^2+3n)x+3n^2\}}{n^3(n+3)(n+1)}$, $f(n)=\tfrac{n}{4}-\tfrac{n(n+3)}{3(n+1)}=-\tfrac{n(n+9)}{12(n+1)}$', criteria: ['2.R1', '2.M1', '2.A1', '2.R2', '2.A2']}
    hint_ladder:
    - $x\le0$에서 $f(x)$의 부호는? (1)의 증감표와 $f(-3)=0$, $f(0)=0$을 보자.
    - $x>0$에서 $f'(x)$의 분자는 $x=n$을 대입하면 $0$이 된다.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.56
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1)에서 $x<0$일 때 $f$는 $x=-3$에서 극솟값 $0$, $x=-1$에서 극댓값을 가지고 $f(0)=0$이며 $x\to-\infty$일 때 $f(x)\to\infty$이므로 $x\le0$에서 $f(x)\ge0$이다.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        $x>0$에서 $f'(x)=\dfrac{x^3}{n^3}-\dfrac{(x+3)(x+1)}{(n+3)(n+1)}=\dfrac{(x-n)\{(n^2+4n+3)x^2+(4n^2+3n)x+3n^2\}}{n^3(n+3)(n+1)}$이다.
      criteria: ['2.M1', '2.A1']
    - id: 2b-3
      content: |
        자연수 $n$과 $x>0$에 대해 중괄호 안과 분모가 모두 양수이므로 $x>0$에서 $f'(x)=0$의 해는 $x=n$뿐이고, $0<x<n$에서 $f'<0$, $x>n$에서 $f'>0$이다. 따라서 $x>0$에서 $f$는 $x=n$에서 최소이다.
      criteria: ['2.R2']
    - id: 2b-4
      content: |
        $f(n)=\displaystyle\int_0^n\left\{\dfrac{t^3}{n^3}-\dfrac{(t+3)(t+1)}{(n+3)(n+1)}\right\}dt=\dfrac n4-\dfrac{n^3/3+2n^2+3n}{(n+3)(n+1)}=\dfrac n4-\dfrac{n(n+3)}{3(n+1)}=-\dfrac{n(n+9)}{12(n+1)}<0$이다. $x\le0$에서는 $f\ge0$이므로 실수 전체에서의 최솟값은 $-\dfrac{n(n+9)}{12(n+1)}$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 15
      evidence: |
        $x\le0$에서 $f(x)\ge0$임을 (1)의 증감과 $f(-3)=f(0)=0$으로 설명했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 15}
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $x>0$에서 $f'(x)=\dfrac{x^3}{n^3}-\dfrac{(x+3)(x+1)}{(n+3)(n+1)}$를 적고 통분했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        분자를 $(x-n)\{(n^2+4n+3)x^2+(4n^2+3n)x+3n^2\}$로 인수분해했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R2
      mark_type: R
      points: 15
      evidence: |
        나머지 인수가 양수임을 근거로 $x>0$에서 임계점이 $x=n$뿐이고 그 좌우 부호가 음→양임을 밝혔다.
      depends_on: [2.A1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 25
      evidence: |
        $f(n)=-\dfrac{n(n+9)}{12(n+1)}$을 계산하고 이것이 전체 최솟값임을 결론지었다.
      depends_on: [2.R2]
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: $x\le0$ 구간과의 비교 없이 $x>0$의 극솟값만으로 최솟값이라 결론
      effect: minus
      value: 15
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3003}
  misconceptions:
  - id: MC-CAL-3003
    outcome_code: '71'
    wrong_work: '$f^{\prime}(n)=0$만 확인하고 $f(n)$을 최솟값이라 씀'
    detect_cue: $x=n$이 유일한 임계점이라는 근거와 $x\le0$ 구간 비교가 없다
    feedback: 최솟값은 유일한 임계점·부호 변화와 다른 구간($x\le0$에서 $f\ge0$)의 비교로 정당화해야 합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    곡선 $y=f(x)$ 위의 점 중에서 접선의 기울기가 $0$인 점을 꼭짓점으로 갖는 삼각형의 내각 중에서 가장 큰 각의 크기를 $\theta_n$이라 할 때, $\displaystyle\lim_{n\to\infty}\tan\theta_n$을 구하시오.
  points: 80
  depends_on: ['1', '2']
  answer: {kind: value, value: '-1/12', equivalents: ['-0.0833...'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 세 점 $\mathrm{P}(-3,0)$, $\mathrm{Q}(-1,f(-1))$, $\mathrm{R}(n,f(n))$에서 $\angle\mathrm{PQR}=\beta_n-\alpha_n$($\alpha_n$, $\beta_n$은 직선 $\mathrm{PQ}$, $\mathrm{QR}$의 경사각)이고 $\tan(\beta_n-\alpha_n)<0$이므로 둔각이다.
    steps:
    - {id: 3a, content: '$\tan\alpha_n=\tfrac{2}{3(n+1)(n+3)}\to0$, $\tan\beta_n=-\tfrac{n(n+3)(n+9)+16}{12(n+3)(n+1)^2}\to-\tfrac1{12}$ $\Rightarrow\tan\theta_n\to-\tfrac1{12}$', criteria: ['3.M1', '3.A1', '3.M2', '3.R1', '3.A2']}
    hint_ladder:
    - 접선의 기울기가 $0$인 점은 $f'(x)=0$의 해이다. $x=0$에서는 어떤가?
    - 삼각형의 한 내각을 두 직선의 경사각의 차로 나타내 보자.
    - 탄젠트 값이 음수이면 그 각은 둔각이다.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.57~58
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1)(2)에서 $f'(x)=0$의 해는 $x=-3,-1,n$이다. 또 $\displaystyle\lim_{x\to0-}\dfrac{f(x)-f(0)}{x}=-\dfrac{3}{(n+3)(n+1)}\ne0$이므로 원점에서의 접선 기울기는 $0$이 아니다. $f(-1)=-\dfrac{1}{(n+3)(n+1)}\left[\dfrac13t^3+2t^2+3t\right]_0^{-1}=\dfrac{4}{3(n+3)(n+1)}$이므로 세 꼭짓점은 $\mathrm{P}(-3,0)$, $\mathrm{Q}(-1,f(-1))$, $\mathrm{R}(n,f(n))$이다.
      criteria: ['3.M1', '3.A1']
    - id: 3b-2
      content: |
        직선 $\mathrm{QR}$과 $x$축의 교점을 $\mathrm{S}$라 하고 $\alpha_n=\angle\mathrm{QPS}$, $\beta_n=\angle\mathrm{PSR}$이라 하면(삼각형 $\mathrm{PQS}$의 외각) $\angle\mathrm{PQR}=\beta_n-\alpha_n$이고
        $\tan\alpha_n=\dfrac{f(-1)}{2}=\dfrac{2}{3(n+1)(n+3)}$, $\tan\beta_n=\dfrac{f(n)-f(-1)}{n+1}=-\dfrac{n(n+3)(n+9)+16}{12(n+3)(n+1)^2}$이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $\tan\angle\mathrm{PQR}=\dfrac{\tan\beta_n-\tan\alpha_n}{1+\tan\beta_n\tan\alpha_n}$에서 분자는 음수, 분모는 $1$보다 작은 양수 두 수의 곱을 $1$에서 뺀 것이므로 양수이다. 따라서 $\tan\angle\mathrm{PQR}<0$, 즉 $\angle\mathrm{PQR}$은 둔각이고 삼각형의 가장 큰 각이므로 $\theta_n=\angle\mathrm{PQR}$이다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $n\to\infty$일 때 $\tan\alpha_n\to0$, $\tan\beta_n\to-\dfrac1{12}$(최고차항 비교)이므로 $\displaystyle\lim_{n\to\infty}\tan\theta_n=\dfrac{-\frac1{12}-0}{1+0}=-\dfrac1{12}$이다.
      criteria: ['3.A2']
  - id: S3-ALT1
    audience: ALT
    source_flow: 해설교재 p.58 참고
    method_no: 2
    key_idea: 가장 큰 각은 가장 긴 변의 대각이므로 변의 길이를 비교한다(원 해설의 참고).
    steps:
    - id: 3alt-1
      content: |
        $\overline{\mathrm{PQ}}^2=4+f(-1)^2$, $\overline{\mathrm{QR}}^2=(n+1)^2+\{f(-1)-f(n)\}^2$이므로 $\overline{\mathrm{PQ}}<\overline{\mathrm{QR}}$이다.
        $\overline{\mathrm{PR}}^2=(n+3)^2+f(n)^2$이고 $\overline{\mathrm{PR}}^2-\overline{\mathrm{QR}}^2=4n+8+2f(-1)f(n)-f(-1)^2=4n+8-\dfrac{2(n^3+12n^2+27n+8)}{9(n^4+8n^3+22n^2+24n+9)}>0$이다.
      criteria: ['3.R1']
    - id: 3alt-2
      content: |
        따라서 가장 긴 변은 $\overline{\mathrm{PR}}$이고 가장 큰 각은 그 대각 $\angle\mathrm{PQR}$이다. 이후 계산은 주 풀이와 같다.
      criteria: ['3.R1']
  - id: S3-ALT2
    audience: ALT
    source_flow: 해설교재 p.58~59 별해
    method_no: 3
    key_idea: 각의 범위를 직접 잡는다(원 해설의 별해) — $0<\alpha_n<\tfrac\pi4$, $\tfrac{3\pi}4<\beta_n<\pi$이면 $\tfrac\pi2<\beta_n-\alpha_n<\pi$.
    steps:
    - id: 3alt2-1
      content: |
        $0<\tan\alpha_n=\dfrac{2}{3(n+1)(n+3)}<1$에서 $0<\alpha_n<\dfrac\pi4$이고, $\tan\beta_n=-\dfrac{n^2+11n+16}{12n^2+48n+36}$이므로 $-1<\tan\beta_n<0$, 즉 $\dfrac{3\pi}4<\beta_n<\pi$이다.
      criteria: ['3.R1']
    - id: 3alt2-2
      content: |
        따라서 $\dfrac\pi2<\angle\mathrm{PQR}=\beta_n-\alpha_n<\pi$로 둔각이고 $\theta_n=\angle\mathrm{PQR}$이다. $\tan\beta_n\to-\dfrac1{12}$, $\tan\alpha_n\to0$에서 극한은 $-\dfrac1{12}$이다.
      criteria: ['3.A2']
