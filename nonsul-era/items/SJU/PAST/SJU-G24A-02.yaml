      evidence: |
        $(k,f(k))$와 $\mathrm{P}$를 잇는 직선이 $L$에 수직이고, 곡선 $y=\max\{f,L\}$가 $L$ 이상이므로 최단점이 $(k,f(k))$임을 설명했다.
      depends_on: [3.A1]
      steps: [3b-2, 3b-3, 3alt2-2]
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        $f(x)=L(x)$를 $x^2(x-1)^2=\alpha^2(\alpha-1)^2$ 또는 $\left(x^2-x+\tfrac16\right)\left(x^2-x-\tfrac16\right)=0$으로 정리했다.
      depends_on: []
