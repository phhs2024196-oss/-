      points: 15
      evidence: |
        직선 $L$의 기울기 $2$(또는 $L(x)=2x+\tfrac{37}{36}$)를 구했다.
      depends_on: [3.M1]
      steps: [3b-1, 3alt1-1]
    - id: 3.R1
