intent: |
  두 점에서 같은 직선에 접하는 사차함수를 접선과의 차로 결정하고, 이계도함수로 도함수의 최댓값을 찾아 역함수의 도함수 최솟값으로 바꾸며, 변곡점을 지나는 직선과 곡선이 만드는 경계에서 점과 곡선 사이의 최단 거리를 수직 조건으로 찾는 능력을 본다.
key_idea: |
  $f(x)-(2x+1)=(x-a)^2(x-b)^2$로 두면 (가)(나)(다)에서 $a=0$, $b=1$, $c=\tfrac12$이다. $(f^{-1})'(x)=\dfrac{1}{f'(f^{-1}(x))}$이므로 최솟값은 $f'$의 최댓값의 역수이고, 직선 $\mathrm{PQ}$의 기울기 $-\tfrac12$가 $L$의 기울기 $2$와 수직임을 이용한다.
stuck: |
  (2-3)에서 점 $(k,f(k))$와 $\mathrm{P}(k+2f(k),0)$를 잇는 직선의 기울기가 $-\tfrac12$로 직선 $L$에 수직이라는 것을 알아채고, 곡선 $y=\max\{f,L\}$가 항상 $L$ 이상임을 이용하는 발상
