stimuli: []

stem: |
  최고차항의 계수가 $1$인 사차함수 $f(x)$는 다음 조건을 만족시킨다.

  (가) 곡선 $y=f(x)$는 서로 다른 두 점 $\mathrm{A}(a,f(a))$, $\mathrm{B}(b,f(b))$에서 직선 $y=2x+1$에 접한다. (단, $a<b$)

  (나) 두 점 $\mathrm{A}$와 $\mathrm{B}$ 사이의 거리는 $\sqrt5$이다.

  (다) $f'(c)=2$를 만족시키는 $c\,(a<c<b)$에 대하여, $a+b+c=\dfrac32$이다.

subparts:
- id: '1'
  stem: |
    $c$의 값을 구하시오.
  points: 70
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: ['0.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=2x+1+(x-a)^2(x-b)^2$로 두면 $f'(c)=2$에서 $c=\tfrac{a+b}2$, (나)에서 $b-a=1$.
    steps:
    - {id: 1a, content: '$2(c-a)(c-b)(2c-a-b)=0\Rightarrow c=\tfrac{a+b}2$, $5(b-a)^2=5$, $3a+\tfrac32=\tfrac32\Rightarrow a=0,b=1,c=\tfrac12$', criteria: ['1.M1', '1.A1', '1.A2', '1.A3']}
    hint_ladder:
    - 두 점에서 직선에 접하면 $f(x)-(2x+1)$은 어떤 인수를 가지는가?
    - $f'(c)=2$는 $f(x)-(2x+1)$의 도함수가 $0$이라는 뜻이다.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.60
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가)에서 $f(x)-(2x+1)$은 $x=a$, $x=b$를 각각 중근으로 갖는 최고차항의 계수가 $1$인 사차식이므로 $f(x)=2x+1+(x-a)^2(x-b)^2$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f'(x)=2+2(x-a)(x-b)(2x-a-b)$이므로 $f'(c)=2$에서 $(c-a)(c-b)(2c-a-b)=0$이고, $a<c<b$이므로 $c=\dfrac{a+b}{2}$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $f(b)-f(a)=2(b-a)$이므로 (나)에서 $5=(b-a)^2+\{2(b-a)\}^2=5(b-a)^2$, 즉 $b=a+1$이다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        (다)에서 $\dfrac32=a+(a+1)+\dfrac{2a+1}{2}=3a+\dfrac32$이므로 $a=0$, $b=1$, $c=\dfrac12$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $f(x)=2x+1+(x-a)^2(x-b)^2$로 놓았다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $f'(c)=2$와 $a<c<b$에서 $c=\dfrac{a+b}{2}$를 이끌었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        거리 조건에서 $b-a=1$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A3
      mark_type: A
      points: 15
      evidence: |
        (다)를 이용해 $a=0$, $b=1$, $c=\dfrac12$를 구했다.
      depends_on: [1.A1, 1.A2, 1.M1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3052}
  misconceptions:
  - id: MC-CAL-3052
    outcome_code: '71'
    wrong_work: '$f(x)=x^4+px^3+qx^2+rx+s$로 두고 접점 조건 네 식을 풀다 미지수를 정하지 못함'
    detect_cue: $(x-a)^2(x-b)^2$ 인수 구조가 보이지 않고 연립방정식만 나열되어 있다
    feedback: 두 점에서 직선에 접하면 곡선과 직선의 차는 두 접점을 각각 중근으로 가집니다. $f(x)-(2x+1)=(x-a)^2(x-b)^2$로 놓으세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $a<x<c$에서 $f(x)$의 역함수가 존재함을 보이고, $f(a)<x<f(c)$인 $x$에 대하여 $\left(f^{-1}\right)'(x)$의 최솟값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '3*(18-sqrt(3))/107', equivalents: ['9/(18+sqrt(3))', '(54-3*sqrt(3))/107'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f''$의 부호로 $f'$은 $0\to\tfrac12-\tfrac{\sqrt3}6$에서 증가, 이후 감소하고 양 끝에서 $2$이므로 $f'>0$; $(f^{-1})'$의 최솟값은 $f'$의 최댓값의 역수.
    steps:
    - {id: 2a, content: '$\max_{0<t<1/2}f^{\prime}(t)=f^{\prime}\left(\tfrac12-\tfrac{\sqrt3}6\right)=\tfrac{18+\sqrt3}{9}\Rightarrow\min(f^{-1})^{\prime}=\tfrac{9}{18+\sqrt3}=\tfrac{3}{107}(18-\sqrt3)$', criteria: ['2.M1', '2.R1', '2.M2', '2.A1', '2.A2']}
    hint_ladder:
    - $f'$이 $(0,\tfrac12)$에서 항상 양수임을 보이려면 $f'$의 증감을 보면 된다.
    - $(f^{-1})'(x)=\dfrac{1}{f'(f^{-1}(x))}$에서 분모가 가장 클 때 값이 가장 작다.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.60
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (2-1)에서 $f(x)=x^2(x-1)^2+2x+1$이므로 $f'(x)=4x^3-6x^2+2x+2$, $f''(x)=2(6x^2-6x+1)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $f''(x)=0$의 근은 $x=\dfrac12\pm\dfrac{\sqrt3}{6}$이므로 $0<x<\dfrac12-\dfrac{\sqrt3}6$에서 $f''>0$($f'$ 증가), $\dfrac12-\dfrac{\sqrt3}6<x<\dfrac12$에서 $f''<0$($f'$ 감소)이다. $f'(0)=f'\!\left(\dfrac12\right)=2$이므로 $0<x<\dfrac12$에서 $f'(x)>0$이다. 따라서 $f$는 $a<x<c$에서 증가함수이므로 역함수가 존재한다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        $(f^{-1})'(x)=\dfrac{1}{f'(f^{-1}(x))}$이고 $f(a)<x<f(c)$일 때 $t=f^{-1}(x)$는 $0<t<\dfrac12$ 전체를 움직이므로, 최솟값은 $f'(t)$가 최대일 때이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $f'(t)$는 $t=\dfrac12-\dfrac{\sqrt3}{6}$에서 최대이고 $f'\!\left(\dfrac12-\dfrac{\sqrt3}6\right)=\dfrac{18+\sqrt3}{9}$이다.
      criteria: ['2.A1']
    - id: 2b-5
      content: |
        따라서 최솟값은 $\dfrac{9}{18+\sqrt3}=\dfrac{3}{107}(18-\sqrt3)$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        $f'(x)$와 $f''(x)=2(6x^2-6x+1)$을 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A3], max_points: 10}
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 25
      evidence: |
        $f''$의 부호로 $f'$의 증감을 밝히고 $f'(0)=f'(\tfrac12)=2$에서 $0<x<\tfrac12$일 때 $f'>0$, 따라서 역함수가 존재함을 서술했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        $(f^{-1})'(x)=\dfrac{1}{f'(f^{-1}(x))}$를 쓰고 $f'$의 최댓값 문제로 바꿨다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        $f'$의 최댓값 $\dfrac{18+\sqrt3}{9}$(최대점 $t=\tfrac12-\tfrac{\sqrt3}6$)을 구했다.
      depends_on: [2.M2, 2.R1]
      steps: [2b-4]
    - id: 2.A2
      mark_type: A
      points: 15
      evidence: |
        최솟값 $\dfrac{3}{107}(18-\sqrt3)$ 또는 $\dfrac{9}{18+\sqrt3}$을 얻었다.
      depends_on: [2.A1, 2.M2]
      steps: [2b-5]
    deductions:
    - code: D2-1
      condition: 역함수 존재를 $f'(x)>0$의 근거 없이 그래프 개형만으로 주장
      effect: minus
      value: 15
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3053}
  misconceptions:
  - id: MC-CAL-3053
    outcome_code: '71'
    wrong_work: '$(f^{-1})^{\prime}$의 최솟값을 $f^{\prime}$의 최솟값 $2$의 역수 $\tfrac12$ 또는 $f^{\prime}$의 최댓값 자체로 답함'
    detect_cue: 답이 $\tfrac12$ 또는 $\tfrac{18+\sqrt3}{9}$이다
    feedback: $(f^{-1})'=\dfrac1{f'}$이므로 $f'$이 가장 클 때 $(f^{-1})'$이 가장 작습니다. 또 끝점 값 $2$는 열린 구간이라 얻어지지 않습니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    곡선 $y=f(x)$ 위의 두 변곡점 $(\alpha,f(\alpha))$, $(\beta,f(\beta))$를 지나는 직선의 방정식을 $y=L(x)$라 하고, $y=f(x)$와 $y=L(x)$의 교점의 $x$좌표의 최댓값을 $k$라 하자. 이때, 점 $\mathrm{P}(k+2f(k),0)$과 곡선 $y=\dfrac12\{f(x)+L(x)+\lvert f(x)-L(x)\rvert\}$ 위의 점 $\mathrm{Q}$에 대하여, 선분 $\mathrm{PQ}$의 길이가 최소가 되도록 하는 점 $\mathrm{Q}$의 $x$좌표를 구하시오.
  points: 80
  depends_on: ['1', '2']
  answer: {kind: value, value: '1/2 + sqrt(15)/6', equivalents: ['(3+sqrt(15))/6'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $L$의 기울기는 $2$이고 $(k,f(k))$와 $\mathrm{P}$를 잇는 기울기는 $-\tfrac12$이므로 $\mathrm{P}$에서 $L$에 내린 수선의 발이 곡선 위의 점 $(k,f(k))$이다.
    steps:
    - {id: 3a, content: '$\alpha+\beta=1$, $\alpha\beta=\tfrac16$, 기울기 $2$; $x^2(x-1)^2=\alpha^2(\alpha-1)^2=\tfrac1{36}\Rightarrow k=\tfrac12+\tfrac{\sqrt{15}}6$', criteria: ['3.M1', '3.A1', '3.R1', '3.M2', '3.A2']}
    hint_ladder:
    - $\dfrac12\{f+L+\lvert f-L\rvert\}$는 $f$와 $L$ 중 큰 값이다.
    - 점 $(k,f(k))$와 $\mathrm{P}$를 잇는 직선의 기울기를 계산해 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.60~61
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f''(x)=2(6x^2-6x+1)=0$의 두 근이 $\alpha$, $\beta$이므로 $\alpha+\beta=1$, $\alpha\beta=\dfrac16$이다. $f(x)=x^4-2x^3+x^2+2x+1$이므로 $L$의 기울기는 $\dfrac{f(\beta)-f(\alpha)}{\beta-\alpha}=(\alpha+\beta)(\alpha^2+\beta^2)-2(\alpha^2+\alpha\beta+\beta^2)+(\alpha+\beta)+2=-(\alpha+\beta)^2+(\alpha+\beta)+2=2$이다.
      criteria: ['3.M1', '3.A1']
    - id: 3b-2
      content: |
        점 $(k,f(k))$와 $\mathrm{P}(k+2f(k),0)$을 지나는 직선의 기울기는 $-\dfrac{f(k)}{2f(k)}=-\dfrac12$이므로 이 직선은 $y=L(x)$와 수직이다. 또 $\dfrac12\{f+L+\lvert f-L\rvert\}$는 $f\ge L$일 때 $f$, $L\ge f$일 때 $L$이므로 이 곡선은 항상 직선 $L$ 위 또는 그 위쪽에 있고, $f(k)=L(k)$이므로 $(k,f(k))$는 이 곡선 위의 점이다.
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        $\mathrm{P}$는 직선 $L$의 아래쪽에 있으므로 곡선 위의 어떤 점까지의 거리도 $\mathrm{P}$에서 직선 $L$까지의 거리 이상이고, 그 값은 수선의 발 $(k,f(k))$에서 얻어진다. 따라서 $\mathrm{Q}=(k,f(k))$이다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $f(x)=L(x)$는 $x^2(x-1)^2+2x+1=2(x-\alpha)+\alpha^2(\alpha-1)^2+2\alpha+1$, 즉 $x^2(x-1)^2=\alpha^2(\alpha-1)^2$이다. $\alpha(\alpha-1)=-\alpha\beta=-\dfrac16$을 이용하면 $\left(x^2-x+\dfrac16\right)\left(x^2-x-\dfrac16\right)=0$이다.
      criteria: ['3.M2']
    - id: 3b-5
      content: |
        근은 $\dfrac12\pm\dfrac{\sqrt3}{6}$, $\dfrac12\pm\dfrac{\sqrt{15}}{6}$이고 가장 큰 것이 $k$이므로 $\mathrm{Q}$의 $x$좌표는 $k=\dfrac12+\dfrac{\sqrt{15}}{6}$이다.
      criteria: ['3.A2']
  - id: S3-ALT1
    audience: ALT
    source_flow: 해설교재 p.62 참고
    method_no: 2
    key_idea: $L$의 기울기를 $f(x)=x^2(x-1)^2+2x+1$ 꼴에서 바로 계산한다.
    steps:
    - id: 3alt1-1
      content: |
        $\dfrac{f(\beta)-f(\alpha)}{\beta-\alpha}=\dfrac{\{\beta(\beta-1)+\alpha(\alpha-1)\}\{\beta^2-\alpha^2-(\beta-\alpha)\}}{\beta-\alpha}+2=\{\beta(\beta-1)+\alpha(\alpha-1)\}(\alpha+\beta-1)+2=2$ ($\alpha+\beta=1$).
      criteria: ['3.A1']
  - id: S3-ALT2
    audience: ALT
    source_flow: 해설교재 p.62~63 별해
    method_no: 3
    key_idea: $\alpha,\beta$를 직접 구해 $L(x)=2x+1+\tfrac1{36}$을 얻고, 직선 $L$ 위에서 $\mathrm{P}$까지 최단인 점 $\mathrm{R}(d,L(d))$가 곡선 위에 있음을 확인한다.
    steps:
    - id: 3alt2-1
      content: |
        $\alpha=\dfrac12-\dfrac{\sqrt3}6$, $\beta=\dfrac12+\dfrac{\sqrt3}6$에서 $f(\alpha)=2+\dfrac1{36}-\dfrac{\sqrt3}{3}$, $f(\beta)=2+\dfrac1{36}+\dfrac{\sqrt3}3$이므로 $L(x)=2x+1+\dfrac1{36}$이다. $f=L\iff x^2(x-1)^2=\dfrac1{36}$이므로 $k=\dfrac12+\dfrac{\sqrt{15}}6$.
      criteria: ['3.M2', '3.A2']
    - id: 3alt2-2
      content: |
        직선 $L$ 위의 점 $\mathrm{R}(d,L(d))$에 대해 $\mathrm{PR}\perp L$이면 $\dfrac{L(d)}{d-k-2f(k)}=-\dfrac12$, $f(k)=L(k)$를 쓰면 $d+2L(d)=k+2L(k)$, 즉 $5d+\dfrac{37}{18}=5k+\dfrac{37}{18}$이므로 $d=k$이다. 이때 곡선의 값이 $L(d)$이므로 구하는 $x$좌표는 $k$이다.
      criteria: ['3.R1']
