stimuli: []

stem: |
  실수 전체의 집합에서 정의된 함수 $f(x)=\displaystyle\int_0^xte^{-(t-x)^2}dt$에 대하여 $\displaystyle\int_0^2e^{-x^2}dx=A$라 할 때, 다음 물음에 각각 답하시오.

subparts:
- id: '1'
  stem: |
    $f'(2)$를 $A$의 식으로 나타내시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: 'A', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $u=t-x$로 치환해 $x$를 적분 밖으로 꺼낸다.
    steps:
    - {id: 1a, content: '$f(x)=x\int_0^xe^{-u^2}du-\tfrac12(1-e^{-x^2})$, $f^{\prime}(x)=\int_0^xe^{-u^2}du$, $f^{\prime}(2)=A$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 피적분함수에 $x$가 있으면 그대로 미분할 수 없다. 어떤 치환이 $x$를 분리하는가?
    - $te^{-(t-x)^2}$에서 $t=x+u$로 놓아 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.64
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $u=t-x$로 놓으면 $t=x+u$이고 $t:0\to x$일 때 $u:-x\to0$이므로 $f(x)=\displaystyle\int_{-x}^0(x+u)e^{-u^2}du=x\int_{-x}^0e^{-u^2}du-\dfrac12\int_{-x}^0(-2u)e^{-u^2}du$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $e^{-u^2}$이 우함수이므로 $\displaystyle\int_{-x}^0e^{-u^2}du=\int_0^xe^{-u^2}du$이고, $\displaystyle\int_{-x}^0(-2u)e^{-u^2}du=\left[e^{-u^2}\right]_{-x}^0=1-e^{-x^2}$이다. 따라서 $f(x)=x\displaystyle\int_0^xe^{-u^2}du-\dfrac12\left(1-e^{-x^2}\right)$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        미분하면 $f'(x)=\displaystyle\int_0^xe^{-u^2}du+xe^{-x^2}+\dfrac12e^{-x^2}(-2x)=\int_0^xe^{-u^2}du$이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        따라서 $f'(2)=\displaystyle\int_0^2e^{-u^2}du=A$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        $u=t-x$(또는 동등한 전개)로 피적분함수의 $x$를 적분 밖으로 분리했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $f(x)=x\displaystyle\int_0^xe^{-u^2}du-\dfrac12(1-e^{-x^2})$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        곱의 미분과 미적분의 기본정리로 $f'(x)$를 계산했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 20
      evidence: |
        $f'(x)=\displaystyle\int_0^xe^{-u^2}du$와 $f'(2)=A$를 얻었다.
      depends_on: [1.A1, 1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3055}
  misconceptions:
  - id: MC-CAL-3055
    outcome_code: '71'
    wrong_work: '$f^{\prime}(x)=xe^{-(x-x)^2}=x$로 계산해 $f^{\prime}(2)=2$라 씀'
    detect_cue: 답에 $A$가 없고 피적분함수에 $t=x$만 대입했다
    feedback: 피적분함수에 $x$가 들어 있으면 미적분의 기본정리를 바로 쓸 수 없습니다. $u=t-x$로 치환해 $x$를 분리하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $0<x\le2$에서 함수 $\dfrac{f(x)}{x}$의 최댓값을 $A$의 식으로 나타내시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: 'A - (1 - exp(-4))/4', equivalents: ['A - 1/4 + exp(-4)/4'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f=xf'-\tfrac12(1-e^{-x^2})$이므로 $\left(\tfrac fx\right)'=\dfrac{xf'-f}{x^2}=\dfrac{1-e^{-x^2}}{2x^2}>0$.
    steps:
    - {id: 2a, content: '$\tfrac fx$는 증가 $\Rightarrow$ 최댓값 $\tfrac{f(2)}2=A-\tfrac14(1-e^{-4})$', criteria: ['2.M1', '2.A1', '2.R1', '2.A2']}
    hint_ladder:
    - (3-1)의 두 식을 비교하면 $f$와 $f'$ 사이에 어떤 관계가 있는가?
    - 몫의 미분 $\left(\tfrac fx\right)'$의 분자는 $xf'-f$이다.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.64
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (3-1)의 두 식에서 $f(x)=xf'(x)-\dfrac12\left(1-e^{-x^2}\right)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $0<x\le2$에서 $\dfrac{d}{dx}\left\{\dfrac{f(x)}{x}\right\}=\dfrac{xf'(x)-f(x)}{x^2}=\dfrac{1-e^{-x^2}}{2x^2}>0$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        따라서 $\dfrac{f(x)}{x}$는 이 구간에서 증가하므로 최댓값은 $x=2$에서의 값 $\dfrac{f(2)}{2}$이다.
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        $f(2)=2A-\dfrac12(1-e^{-4})$이므로 최댓값은 $A-\dfrac14\left(1-e^{-4}\right)$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $f(x)=xf'(x)-\dfrac12(1-e^{-x^2})$ 관계(또는 $f$, $f'$의 식)를 써서 $\left(\tfrac fx\right)'$을 계산하려 했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 1.A2], max_points: 20}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $\left(\tfrac fx\right)'=\dfrac{1-e^{-x^2}}{2x^2}$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 20
      evidence: |
        도함수가 양수이므로 증가하고 최댓값이 $x=2$에서임을 밝혔다.
      depends_on: [2.A1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        최댓값 $A-\dfrac14(1-e^{-4})$을 얻었다.
      depends_on: [2.R1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3056}
  misconceptions:
  - id: MC-CAL-3056
    outcome_code: '71'
    wrong_work: '근거 없이 $x=2$에서 최대라고 쓰고 $\tfrac{f(2)}2$를 계산'
    detect_cue: $\left(\tfrac fx\right)'$의 부호 판정이 없다
    feedback: 구간 끝점이 최댓값이 되려면 그 구간에서 증가함을 보여야 합니다. $\left(\tfrac fx\right)'=\dfrac{1-e^{-x^2}}{2x^2}>0$을 쓰세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    $\displaystyle\lim_{x\to0}\dfrac{\{f(x)\}^5f'(x)}{x^{11}}$의 값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '1/32', equivalents: ['0.03125'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{\{f\}^5f'}{x^{11}}=\left(\dfrac{f}{x^2}\right)^5\cdot\dfrac{f'}{x}$로 쪼갠다.
    steps:
    - {id: 3a, content: '$\tfrac{f^{\prime}}{x}\to f^{\prime\prime}(0)=1$, $\tfrac{f}{x^2}=\tfrac{f^{\prime}}{x}-\tfrac{1-e^{-x^2}}{2x^2}\to1-\tfrac12=\tfrac12$, 극한 $=\left(\tfrac12\right)^5=\tfrac1{32}$', criteria: ['3.M1', '3.A1', '3.A2', '3.A3']}
    hint_ladder:
    - $x^{11}=(x^2)^5\cdot x$로 나누어 보자.
    - $\dfrac{f'(x)}{x}$는 어떤 미분계수의 정의인가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.64
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\dfrac{\{f(x)\}^5f'(x)}{x^{11}}=\left\{\dfrac{f(x)}{x^2}\right\}^5\cdot\dfrac{f'(x)}{x}$이고, $\dfrac{f(x)}{x^2}=\dfrac{f'(x)}{x}-\dfrac{\frac12(1-e^{-x^2})}{x^2}$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $f'(0)=0$, $f''(x)=e^{-x^2}$이므로 $\displaystyle\lim_{x\to0}\dfrac{f'(x)}{x}=\lim_{x\to0}\dfrac{f'(x)-f'(0)}{x}=f''(0)=1$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $t=-x^2$으로 놓으면 $\displaystyle\lim_{x\to0}\dfrac{\frac12(1-e^{-x^2})}{x^2}=\lim_{t\to0-}\dfrac{\frac12(e^t-1)}{t}=\dfrac12$이므로 $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x^2}=1-\dfrac12=\dfrac12$이다.
      criteria: ['3.A2']
    - id: 3b-4
      content: |
        따라서 구하는 극한값은 $\left(\dfrac12\right)^5\times1=\dfrac1{32}$이다.
      criteria: ['3.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        식을 $\left(\dfrac{f}{x^2}\right)^5\cdot\dfrac{f'}{x}$로 쪼개고 $\dfrac{f}{x^2}$을 $f'$과 $1-e^{-x^2}$으로 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 1.A2], max_points: 20}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        미분계수의 정의로 $\displaystyle\lim_{x\to0}\dfrac{f'(x)}{x}=f''(0)=1$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x^2}=\dfrac12$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-3]
    - id: 3.A3
      mark_type: A
      points: 20
      evidence: |
        극한값 $\dfrac1{32}$을 얻었다.
      depends_on: [3.A1, 3.A2, 3.M1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3057}
  misconceptions:
  - id: MC-CAL-3057
    outcome_code: '71'
    wrong_work: '$f(0)=0$, $f^{\prime}(0)=0$만 보고 극한을 $0$ 또는 $\tfrac00$이라 결론'
    detect_cue: 분자·분모의 극한을 따로 대입했다
    feedback: $\tfrac00$ 꼴은 $\dfrac{f'(x)-f'(0)}{x}$처럼 미분계수의 정의로 바꾸어 계산하세요.
    remedy: [RL-3]

