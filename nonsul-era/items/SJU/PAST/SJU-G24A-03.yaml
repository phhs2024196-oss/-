intent: |
  피적분함수에 바깥 변수 $x$가 들어 있는 정적분 함수를 치환적분으로 분리해 미분하고, 얻은 관계식 $f(x)=xf'(x)-\tfrac12(1-e^{-x^2})$으로 $\tfrac{f(x)}{x}$의 단조성과 $x\to0$ 극한을 처리하는 능력을 본다.
key_idea: |
  $u=t-x$로 치환하면 $f(x)=x\displaystyle\int_0^xe^{-u^2}du-\tfrac12(1-e^{-x^2})$이고 $f'(x)=\displaystyle\int_0^xe^{-u^2}du$이다.
stuck: |
  적분 변수와 바깥 변수가 섞인 $e^{-(t-x)^2}$를 $u=t-x$ 치환으로 분리하는 발상, 그리고 $f=xf'-\tfrac12(1-e^{-x^2})$ 관계로 $\left(\tfrac fx\right)'$의 부호를 바로 얻는 것
