  항의 크기와 홀짝에 따라 세 갈래로 정의된 수열에서, 앞 항으로부터 뒤 항을 계산하고 뒤 항으로부터 가능한 앞 항을 빠짐없이 역추적해 최솟값·최댓값을 결정하는 능력을 본다.
key_idea: |
  (가)는 항상 짝수를 만들고, (나)의 $a_{n+1}=\tfrac{a_n}{2}+n+1$은 첨자 $n$에 의존하며, (다)는 $a_n=2a_{n+1}-1$로 거꾸로 무한히 늘릴 수 있다. 조건마다 역상을 구해 경우를 나눈다.
stuck: |
