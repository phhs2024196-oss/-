stimuli: []

stem: |
  실수 전체의 집합에서 정의된 함수 $f(x)=\left(1+\lvert x\rvert^3\right)^{-2}$에 대하여 함수 $g(x)$를 다음과 같이 정의한다.
  $$g(x)=\int_x^{x+4}f(t)\,dt$$

subparts:
- id: '1'
  stem: |
    $f'(x)<0$을 만족시키는 실수 $x$의 값의 범위를 구하시오. 또한 $f''(x)<0$을 만족시키는 실수 $x$의 값의 범위를 구하시오.
  points: 70
  depends_on: []
  answer: {kind: set, value: "f1<0: x>0; f2<0: -(2/7)**(1/3)<x<0 or 0<x<(2/7)**(1/3)", equivalents: ["f'(x)<0 ⇔ x>0, f''(x)<0 ⇔ -∛(2/7)<x<0 또는 0<x<∛(2/7)"], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x\ge0$, $x<0$으로 나누어 미분하고, 원점에서는 미분계수의 정의로 $f'(0)=f''(0)=0$을 확인한다.
    steps:
    - {id: 1a, content: '$x>0$: $f^{\prime}=-6x^2(1+x^3)^{-3}<0$, $f^{\prime\prime}=6x(1+x^3)^{-4}(7x^3-2)$; $x<0$: $f^{\prime}>0$, $f^{\prime\prime}=6x(1-x^3)^{-4}(2+7x^3)$', criteria: ['1.M1', '1.R1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - $\lvert x\rvert$가 있으므로 $x\ge0$과 $x<0$으로 나누어 식을 쓰자.
    - 원점에서의 미분계수는 정의로 확인해야 한다.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.68
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=(1+x^3)^{-2}\ (x\ge0)$, $f(x)=(1-x^3)^{-2}\ (x<0)$이므로 $f'(x)=-6x^2(1+x^3)^{-3}\ (x>0)$, $f'(x)=6x^2(1-x^3)^{-3}\ (x<0)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to0+}\dfrac{f(x)-f(0)}{x}=\lim_{x\to0+}\dfrac1x\cdot\dfrac{-2x^3-x^6}{(1+x^3)^2}=0$, $\displaystyle\lim_{x\to0-}\dfrac{f(x)-f(0)}{x}=\lim_{x\to0-}\dfrac1x\cdot\dfrac{2x^3-x^6}{(1-x^3)^2}=0$이므로 $f'(0)=0$이다. 따라서 $f'(x)<0$의 범위는 $x>0$이다.
      criteria: ['1.R1', '1.A1']
    - id: 1b-3
      content: |
        $x>0$이면 $f''(x)=-12x(1+x^3)^{-3}+54x^4(1+x^3)^{-4}=6x(1+x^3)^{-4}(7x^3-2)$, $x<0$이면 $f''(x)=12x(1-x^3)^{-3}+54x^4(1-x^3)^{-4}=6x(1-x^3)^{-4}(2+7x^3)$이다. 또 $\displaystyle\lim_{x\to0\pm}\dfrac{f'(x)-f'(0)}{x}=0$이므로 $f''(0)=0$이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        따라서 $f''(x)<0\iff0<x^3<\dfrac27$ 또는 $-\dfrac27<x^3<0$, 즉 $-\sqrt[3]{\dfrac27}<x<0$ 또는 $0<x<\sqrt[3]{\dfrac27}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        $x>0$, $x<0$에서 $f'(x)$를 각각 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 10
      evidence: |
        미분계수의 정의로 $f'(0)=0$을 확인했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $f'(x)<0$의 범위 $x>0$을 답했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 20
      evidence: |
        $f''(x)=6x(1+x^3)^{-4}(7x^3-2)\ (x>0)$, $6x(1-x^3)^{-4}(2+7x^3)\ (x<0)$과 $f''(0)=0$을 구했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $f''(x)<0$의 범위 $-\sqrt[3]{\tfrac27}<x<0$ 또는 $0<x<\sqrt[3]{\tfrac27}$을 답했다.
      depends_on: [1.M2]
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: $f''(x)<0$의 범위에 $x=0$을 포함함
      effect: minus
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3006}
  misconceptions:
  - id: MC-CAL-3006
    outcome_code: '71'
    wrong_work: '$x\ge0$의 식 하나로 $f^{\prime}$, $f^{\prime\prime}$을 구해 $x<0$ 구간과 원점을 따로 확인하지 않음'
    detect_cue: $x<0$에서의 식이나 $f'(0)$, $f''(0)$ 확인이 없다
    feedback: $\lvert x\rvert$가 있으면 $x\ge0$, $x<0$으로 나누고, 연결점 $x=0$의 미분계수는 정의로 확인하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    함수 $y=f(x)$의 그래프의 개형을 그리시오. 또한 함수 $g(x)$가 $x=a$에서 최댓값을 가질 때, $a$의 값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '-2', equivalents: ['a = -2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g'(x)=f(x+4)-f(x)$이고 $f$가 우함수이며 $x>0$에서 감소하므로 $f(x+4)>f(x)\iff\lvert x+4\rvert<\lvert x\rvert\iff x<-2$.
    steps:
    - {id: 2a, content: '개형: $y$축 대칭, $(0,1)$에서 최대, 변곡점 $\left(\pm\sqrt[3]{\tfrac27},\tfrac{49}{81}\right)$, 점근선 $x$축; $g^{\prime}>0\ (x<-2)$, $g^{\prime}<0\ (x>-2)\Rightarrow a=-2$', criteria: ['2.A1', '2.M1', '2.R1', '2.A2']}
    hint_ladder:
    - (2-1)의 결과로 증감표를 만들고, $f(0)$, 대칭성, $x\to\pm\infty$일 때의 극한을 확인하자.
    - $g'(x)$를 구하고 $f(x+4)$와 $f(x)$의 크기를 비교하자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.68~69
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)>0$이고 $f(-x)=f(x)$이므로 그래프는 $x$축 위쪽에 있고 $y$축에 대칭이며, $f(0)=1$이다. (2-1)에서 $x<0$일 때 증가, $x>0$일 때 감소하고, $\left(-\sqrt[3]{\tfrac27},\sqrt[3]{\tfrac27}\right)$에서 위로 볼록, 그 바깥에서 아래로 볼록이다. 변곡점은 $\left(\pm\sqrt[3]{\tfrac27},\dfrac{49}{81}\right)$이고 $\displaystyle\lim_{x\to\pm\infty}f(x)=0$이므로 점근선은 $x$축이다. 이를 바탕으로 종 모양의 개형을 그린다.
      criteria: ['2.A1']
    - id: 2b-2
      content: |
        $g'(x)=f(x+4)-f(x)$이고 $g'(x)=0\iff1+\lvert x\rvert^3=1+\lvert x+4\rvert^3\iff\lvert x\rvert=\lvert x+4\rvert\iff x=-2$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $f$는 $\lvert x\rvert$가 커질수록 작아지므로 $x<-2$이면 $\lvert x+4\rvert<\lvert x\rvert$에서 $f(x+4)>f(x)$, 즉 $g'(x)>0$이고, $x>-2$이면 $g'(x)<0$이다.
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        따라서 $g$는 $x<-2$에서 증가, $x>-2$에서 감소하므로 $x=-2$에서 최댓값을 가지고 $a=-2$이다.
      criteria: ['2.A2']
  - id: S2-ALT1
    audience: ALT
    source_flow: 해설교재 p.70~71 별해
    method_no: 2
    key_idea: $g(x)$는 구간 $[x,x+4]$에서 $y=f(x)$ 아래의 넓이이므로 $[-2,2]$와 겹치지 않는 부분의 넓이를 비교한다.
    steps:
    - id: 2alt1-1
      content: |
        $x<-2$이면 $[x,-2]$ 위의 넓이가 $[x+4,2]$ 위의 넓이보다 작으므로($[x,-2]$에서 $f$의 값이 $f(-2)=f(2)$보다 작고 $[x+4,2]$에서는 크다) $g(x)<g(-2)$이다. $x>-2$이면 $[-2,x]$ 위의 넓이가 $[2,x+4]$ 위의 넓이보다 크므로 역시 $g(x)<g(-2)$이다. 따라서 $a=-2$.
      criteria: ['2.R1', '2.A2']
  - id: S2-ALT2
    audience: ALT
    source_flow: 해설교재 p.71 참고
    method_no: 3
    key_idea: $g'(x)$를 통분해 부호를 직접 본다.
    steps:
    - id: 2alt2-1
      content: |
        $f(x+4)-f(x)=\dfrac{(\lvert x\rvert^3-\lvert x+4\rvert^3)(2+\lvert x\rvert^3+\lvert x+4\rvert^3)}{(1+\lvert x\rvert^3)^2(1+\lvert x+4\rvert^3)^2}$이고 둘째 인수와 분모가 양수이므로 $g'(x)>0\iff\lvert x\rvert>\lvert x+4\rvert\iff x<-2$이다.
      criteria: ['2.M1', '2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.A1
      mark_type: B
      points: 30
      evidence: |
        대칭성·$f(0)=1$·증감·오목볼록·변곡점·점근선($x$축)이 반영된 개형을 그렸다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 1.A2], max_points: 30}
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        $g'(x)=f(x+4)-f(x)$를 쓰고 $g'(x)=0$의 해 $x=-2$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2alt2-1]
    - id: 2.R1
      mark_type: R
      points: 20
      evidence: |
        $x<-2$에서 $g'>0$, $x>-2$에서 $g'<0$임을(또는 넓이 비교로 $g(x)<g(-2)$임을) 근거와 함께 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-3, 2alt1-1, 2alt2-1]
    - id: 2.A2
      mark_type: A
      points: 15
      evidence: |
        $a=-2$를 답했다.
      depends_on: [2.R1]
      steps: [2b-4, 2alt1-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3061}
  misconceptions:
  - id: MC-CAL-3061
    outcome_code: '71'
    wrong_work: '$g^{\prime}(x)=f(x+4)$로 두어 $g$가 항상 증가한다고 판단'
    detect_cue: $g'(x)$에 $-f(x)$ 항이 없다
    feedback: 위끝과 아래끝이 모두 $x$의 함수이면 $\dfrac{d}{dx}\displaystyle\int_x^{x+4}f(t)dt=f(x+4)-f(x)$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    (2-2)의 $a$에 대하여 $\displaystyle\int_0^at^3f(t)\,dt=S$라고 할 때, $g(a)-4S$의 값을 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: value, value: '4/9', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g(-2)=-2\displaystyle\int_0^{-2}f$이고, $S$를 부분적분하면 $S=-\tfrac2{27}+\tfrac16g(a)+\tfrac13S$.
    steps:
    - {id: 3a, content: '$S=\left[\tfrac t{3(1-t^3)}\right]_0^{-2}-\tfrac13\int_0^{-2}\tfrac{dt}{1-t^3}=-\tfrac2{27}+\tfrac16g(a)+\tfrac13S\Rightarrow g(a)-4S=\tfrac49$', criteria: ['3.M1', '3.M2', '3.A1', '3.A2']}
    hint_ladder:
    - $a=-2<0$이므로 $f(t)=(1-t^3)^{-2}$이다. $g(-2)$를 $\int_0^{-2}f$로 나타내 보자.
    - $\dfrac{t^3}{(1-t^3)^2}=\dfrac t3\cdot\dfrac{3t^2}{(1-t^3)^2}$이고 $\left(\dfrac{1}{1-t^3}\right)'=\dfrac{3t^2}{(1-t^3)^2}$이다.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.71
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(t)=f(-t)$이므로 $g(a)=g(-2)=\displaystyle\int_{-2}^2f(t)dt=2\int_{-2}^0f(t)dt=-2\int_0^{-2}f(t)dt$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $t<0$에서 $f(t)=(1-t^3)^{-2}$이므로 $S=\displaystyle\int_0^{-2}\dfrac{t^3}{(1-t^3)^2}dt=\int_0^{-2}\dfrac13t\cdot\dfrac{3t^2}{(1-t^3)^2}dt$이고 부분적분하면 $S=\left[\dfrac13t(1-t^3)^{-1}\right]_0^{-2}-\dfrac13\displaystyle\int_0^{-2}\dfrac{1}{1-t^3}dt=-\dfrac{2}{27}-\dfrac13\int_0^{-2}\dfrac{1}{1-t^3}dt$이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $\dfrac{1}{1-t^3}=\dfrac{1}{(1-t^3)^2}-\dfrac{t^3}{(1-t^3)^2}$이므로 $\displaystyle\int_0^{-2}\dfrac{dt}{1-t^3}=\int_0^{-2}f(t)dt-S=-\dfrac12g(a)-S$이다. 따라서 $S=-\dfrac{2}{27}+\dfrac16g(a)+\dfrac13S$이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        정리하면 $\dfrac23S=-\dfrac2{27}+\dfrac16g(a)$, 즉 $g(a)-4S=\dfrac49$이다.
      criteria: ['3.A2']
