intent: |
  절댓값이 들어간 우함수의 도함수·이계도함수를 구간별로(원점은 정의로) 구해 그래프 개형을 그리고, 길이가 일정한 구간의 정적분 함수의 최댓값을 찾은 뒤, 부분적분으로 $S$와 $g(a)$ 사이의 관계식을 세워 값을 구하는 능력을 본다.
key_idea: |
  $g'(x)=f(x+4)-f(x)=0\iff\lvert x\rvert=\lvert x+4\rvert\iff x=-2$이고, $S=\displaystyle\int_0^{-2}\dfrac{t^3}{(1-t^3)^2}dt$를 $\dfrac{t}{3}\cdot\dfrac{3t^2}{(1-t^3)^2}$로 보고 부분적분하면 $S$와 $g(a)$가 다시 나타난다.
stuck: |
  부분적분 뒤 남는 $\displaystyle\int\dfrac{1}{1-t^3}dt$를 $\dfrac{1}{(1-t^3)^2}-\dfrac{t^3}{(1-t^3)^2}$로 쪼개 $g(a)$와 $S$로 되돌리는 발상
idea_tags: [IDEA-SLIDING-WINDOW-INTEGRAL-MAX, IDEA-IBP-RECOVER-SAME-INTEGRAL]
tags: [절댓값 함수, 정적분으로 정의된 함수, 부분적분, 우함수]
