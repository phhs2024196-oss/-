  materials:
  - '우함수 $f(x)=(1+\lvert x\rvert^3)^{-2}$'
  - '길이 $4$인 구간의 정적분 $g(x)=\int_x^{x+4}f(t)dt$'
  - '값을 직접 구할 수 없는 두 정적분 $g(a)$와 $S=\int_0^at^3f(t)dt$의 일차 관계'
  concepts:
  - '미분계수의 정의(원점에서의 미분가능성)'
  - '도함수와 이계도함수의 부호'
  - '곡선의 오목·볼록과 변곡점'
  - '함수의 그래프 개형과 점근선'
  - '정적분으로 정의된 함수의 미분'
  - '우함수의 정적분'
  - '부분적분법'
  tools:
  - '구간별 미분 + 원점은 정의로 $f''(0)=f''''(0)=0$'
  - '증감표'
  - '$g''(x)=f(x+4)-f(x)$'
  - '$f(x+4)=f(x)\iff\lvert x\rvert=\lvert x+4\rvert$'
  - '넓이 비교(그림)로 $g(x)<g(-2)$'
  - '$\dfrac{t^3}{(1-t^3)^2}=\dfrac t3\cdot\dfrac{3t^2}{(1-t^3)^2}$로 부분적분'
  - '$\dfrac{1}{1-t^3}=\dfrac{1}{(1-t^3)^2}-\dfrac{t^3}{(1-t^3)^2}$'
  conditions:
  - '$x<0$이면 $\lvert x\rvert^3=-x^3$이므로 $f(x)=(1-x^3)^{-2}$'
  - '$f''(0)=0$이므로 $f''(x)<0$의 범위에서 $x=0$ 제외'
  - '$f''''(0)=0$이므로 $f''''(x)<0$의 범위는 원점을 뺀 두 구간'
  - '$a=-2<0$이므로 $S$의 피적분함수는 $\dfrac{t^3}{(1-t^3)^2}$'
