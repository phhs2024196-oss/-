stimuli: []

stem: |
  그림과 같이 좌표평면에 중심이 $\mathrm{O_1}$, $\mathrm{O_2}$이고 반지름의 길이가 $r$, $s$인 두 원 $C_1$, $C_2$가 있다. 두 점 $\mathrm{O_1}$, $\mathrm{O_2}$ 사이의 거리는 $1$이다. (단, $0<r<1$, $0<s<1$)
  $C_1$과 $C_2$의 교점 중 하나를 $\mathrm{P}$라 할 때, 점 $\mathrm{P}$에서 두 원의 접선이 이루는 예각이 $\dfrac\pi6$이다.
  $\angle\mathrm{PO_1O_2}=\alpha$라 하고, 굵은 선으로 표시된 8 모양의 도형의 길이를 $f(\alpha)$라 하자.
  (그림: 아래쪽에 큰 원 $C_1$(중심 $\mathrm{O_1}$, 반지름 $r$), 위쪽에 작은 원 $C_2$(중심 $\mathrm{O_2}$, 반지름 $s$)가 두 점에서 만나 8자 모양을 이룬다. 굵은 선은 각 원에서 다른 원의 내부에 있지 않은 부분(두 원의 겹치는 부분의 호는 점선)이다. 선분 $\mathrm{O_1O_2}$가 세로로 그려져 있고 오른쪽 교점 $\mathrm{P}$와 $\mathrm{O_1}$, $\mathrm{O_2}$를 잇는 선분에 $r$, $s$, $\angle\mathrm{PO_1O_2}=\alpha$가 표시되어 있으며, $\mathrm{P}$에서 두 원의 접선이 이루는 각 $\frac\pi6$이 표시되어 있다.)

subparts:
- id: '1'
  stem: |
    $\angle\mathrm{PO_2O_1}$의 크기를 $\alpha$의 식으로 나타내고 $\alpha$의 범위를 구하시오. 또한 $f(\alpha)$를 구하시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: 'angle = pi/6 - alpha; range = 0 < alpha < pi/6; f = 4*(pi - alpha)*sin(pi/6 - alpha) + 4*(5*pi/6 + alpha)*sin(alpha)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선은 반지름에 수직이므로 $\angle\mathrm{O_1PO_2}=\tfrac{5\pi}6$; 사인법칙으로 $r,s$를 구하고 각 원의 바깥 호 중심각은 $2\pi-2\alpha$, $2\pi-2\beta$.
    steps:
    - {id: 1a, content: '$\beta=\tfrac\pi6-\alpha$, $0<\alpha<\tfrac\pi6$, $s=2\sin\alpha$, $r=2\sin\beta$, $f=4(\pi-\alpha)\sin\left(\tfrac\pi6-\alpha\right)+4\left(\tfrac{5\pi}6+\alpha\right)\sin\alpha$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2', '1.A3']}
    hint_ladder:
    - 원의 접선은 접점에서 반지름과 수직이다. 두 접선이 이루는 각과 두 반지름이 이루는 각의 관계는?
    - 삼각형 $\mathrm{O_1O_2P}$에 사인법칙을 쓰자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.73
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\angle\mathrm{PO_2O_1}=\beta$라 하자. $C_1$의 $\mathrm{P}$에서의 접선은 $\mathrm{PO_1}$에, $C_2$의 $\mathrm{P}$에서의 접선은 $\mathrm{PO_2}$에 수직이므로 $\angle\mathrm{O_1PO_2}=\pi-\dfrac\pi6=\dfrac{5\pi}6$이다(그림에서 둔각). 따라서 $\alpha+\beta=\dfrac\pi6$, 즉 $\angle\mathrm{PO_2O_1}=\dfrac\pi6-\alpha$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\alpha>0$, $\beta>0$이므로 $0<\alpha<\dfrac\pi6$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        삼각형 $\mathrm{O_1O_2P}$에서 사인법칙에 의해 $\dfrac{s}{\sin\alpha}=\dfrac{r}{\sin\beta}=\dfrac{1}{\sin\frac{5\pi}6}=2$이므로 $s=2\sin\alpha$, $r=2\sin\beta$이다.
      criteria: ['1.M2', '1.A2']
    - id: 1b-4
      content: |
        $C_1$의 굵은 부분은 중심각 $2\pi-2\alpha$인 호이므로 길이 $2(\pi-\alpha)r=4(\pi-\alpha)\sin\beta$, $C_2$의 굵은 부분은 $2(\pi-\beta)s=4(\pi-\beta)\sin\alpha$이다. 따라서 $f(\alpha)=4(\pi-\alpha)\sin\left(\dfrac\pi6-\alpha\right)+4\left(\dfrac{5\pi}6+\alpha\right)\sin\alpha$이다.
      criteria: ['1.A3']
  - id: S1-ALT
    audience: ALT
    source_flow: 해설교재 p.73 별해
    method_no: 2
    key_idea: 사인법칙 대신 $\mathrm{P}$에서 $\mathrm{O_1O_2}$에 내린 수선으로 연립방정식을 세운다.
    steps:
    - id: 1alt-1
      content: |
        $r\sin\alpha=s\sin\beta$, $r\cos\alpha+s\cos\beta=1$에서 $s$를 소거하면 $r(\sin\alpha\cos\beta+\cos\alpha\sin\beta)=\sin\beta$, 즉 $r\sin(\alpha+\beta)=\sin\beta$이고 $\alpha+\beta=\dfrac\pi6$이므로 $r=2\sin\beta$이다. 같은 방법으로 $s=2\sin\alpha$이다.
      criteria: ['1.M2', '1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        접선과 반지름의 수직에서 $\angle\mathrm{O_1PO_2}=\dfrac{5\pi}6$을 구하고 $\angle\mathrm{PO_2O_1}=\dfrac\pi6-\alpha$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $0<\alpha<\dfrac\pi6$을 답했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        사인법칙(또는 수선을 이용한 연립방정식)으로 $r$, $s$를 각으로 나타내려 했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3, 1alt-1]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $s=2\sin\alpha$, $r=2\sin\left(\dfrac\pi6-\alpha\right)$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-3, 1alt-1]
    - id: 1.A3
      mark_type: A
      points: 25
      evidence: |
        두 호의 중심각 $2\pi-2\alpha$, $2\pi-2\beta$로 $f(\alpha)$를 바르게 나타냈다.
      depends_on: [1.A2, 1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3063}
  - {code: '72', misconception: MC-CAL-3064}
  misconceptions:
  - id: MC-CAL-3063
    outcome_code: '71'
    wrong_work: '$\angle\mathrm{O_1PO_2}=\tfrac\pi6$으로 두어 $\alpha+\beta=\tfrac{5\pi}6$을 얻음'
    detect_cue: $\beta=\tfrac{5\pi}6-\alpha$ 또는 사인법칙의 비가 $\tfrac1{\sin(\pi/6)}=2$로 같아 보이지만 각 관계가 다르다
    feedback: 두 접선이 이루는 예각이 $\tfrac\pi6$이면 두 반지름이 이루는 각은 $\tfrac\pi6$ 또는 $\tfrac{5\pi}6$입니다. 그림에서 $\angle\mathrm{O_1PO_2}$는 둔각입니다.
    remedy: [RL-1]
  - id: MC-CAL-3064
    outcome_code: '72'
    wrong_work: '$C_1$의 굵은 호 길이를 $r(\pi-\alpha)$ 또는 $2\alpha r$로 계산'
    detect_cue: 호의 중심각이 $2\pi-2\alpha$가 아니다
    feedback: $C_1$에서 $C_2$ 내부에 있는 호의 중심각은 $2\alpha$이므로 굵은 호의 중심각은 $2\pi-2\alpha$입니다.
    remedy: [RL-2]

- id: '2'
  stem: |
    위의 그림에서 $C_2$ 중 굵은 선으로 표시된 ∩ 모양의 호의 길이를 $g(\alpha)$라 할 때, $a<g'(\alpha)<b$이다. $a$의 최댓값과 $b$의 최솟값을 각각 구하시오.
    (그림: $C_2$의 굵은 호는 $C_2$ 중 $C_1$의 내부에 있지 않은 위쪽 부분이다.)
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: 'a_max = 10*pi/3; b_min = 2 + 2*sqrt(3)*pi', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g=4\left(\tfrac{5\pi}6+\alpha\right)\sin\alpha$, $g''>0$이므로 $g'$은 증가하고 범위는 양 끝 극한 사이(열린 구간).
    steps:
    - {id: 2a, content: '$g^{\prime\prime}=4\left\{2\cos\alpha-\left(\tfrac{5\pi}6+\alpha\right)\sin\alpha\right\}>4\left(\sqrt3-\tfrac\pi2\right)>0$; $g^{\prime}(0+)=\tfrac{10\pi}3$, $g^{\prime}\left(\tfrac\pi6-\right)=2+2\sqrt3\pi$', criteria: ['2.M1', '2.R1', '2.A1', '2.A2']}
    hint_ladder:
    - $g'(\alpha)$의 값의 범위를 알려면 $g'$의 증감을 보자.
    - $0<\alpha<\tfrac\pi6$에서 $2\cos\alpha$와 $\left(\tfrac{5\pi}6+\alpha\right)\sin\alpha$의 범위를 각각 잡아 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.73
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (3-1)에서 $g(\alpha)=4(\pi-\beta)\sin\alpha=4\left(\dfrac{5\pi}6+\alpha\right)\sin\alpha$이므로 $g'(\alpha)=4\left\{\sin\alpha+\left(\dfrac{5\pi}6+\alpha\right)\cos\alpha\right\}$, $g''(\alpha)=4\left\{2\cos\alpha-\left(\dfrac{5\pi}6+\alpha\right)\sin\alpha\right\}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $0<\alpha<\dfrac\pi6$이므로 $2\cos\alpha>\sqrt3$이고 $\left(\dfrac{5\pi}6+\alpha\right)\sin\alpha<\pi\cdot\dfrac12=\dfrac\pi2$이다. 따라서 $g''(\alpha)>4\left(\sqrt3-\dfrac\pi2\right)>0$이고 $g'$은 증가함수이다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        $\displaystyle\lim_{\alpha\to0+}g'(\alpha)=4\cdot\dfrac{5\pi}6=\dfrac{10\pi}3$, $\displaystyle\lim_{\alpha\to\frac\pi6-}g'(\alpha)=4\left(\dfrac12+\pi\cdot\dfrac{\sqrt3}2\right)=2+2\sqrt3\pi$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        $g'$이 증가하므로 $\dfrac{10\pi}3<g'(\alpha)<2+2\sqrt3\pi$이고 양 끝값은 얻어지지 않는다. 따라서 $a$의 최댓값은 $\dfrac{10\pi}3$, $b$의 최솟값은 $2+2\sqrt3\pi$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $g(\alpha)=4\left(\dfrac{5\pi}6+\alpha\right)\sin\alpha$와 $g'$, $g''$을 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2, 1.A3], max_points: 20}
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 25
      evidence: |
        부등식 $2\cos\alpha>\sqrt3$, $\left(\tfrac{5\pi}6+\alpha\right)\sin\alpha<\tfrac\pi2$로 $g''>0$, 즉 $g'$이 증가함을 보였다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        양 끝 극한 $\dfrac{10\pi}3$, $2+2\sqrt3\pi$를 구했다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 15
      evidence: |
        $a$의 최댓값 $\dfrac{10\pi}3$, $b$의 최솟값 $2+2\sqrt3\pi$를 답했다.
      depends_on: [2.R1, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3003}
  misconceptions:
  - id: MC-CAL-3003
    outcome_code: '71'
    wrong_work: '$g^{\prime}$의 양 끝 극한만 계산하고 $g^{\prime}$이 그 사이를 단조롭게 움직이는지 확인하지 않음'
    detect_cue: $g''$의 부호 판정이 없다
    feedback: 끝 극한값이 범위의 경계가 되려면 $g'$이 단조여야 합니다. $g''>0$을 보이세요.
    remedy: [RL-3]

- id: '3'
  stem: |
    $f(\alpha)$가 최소가 되도록 하는 $\alpha$의 값을 구하시오.
  points: 80
  depends_on: ['1', '2']
  answer: {kind: value, value: 'pi/12', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f(\alpha)=g\left(\tfrac\pi6-\alpha\right)+g(\alpha)$, $f'(\alpha)=g'(\alpha)-g'\left(\tfrac\pi6-\alpha\right)$이고 $g'$이 증가함수이다.
    steps:
    - {id: 3a, content: '$f^{\prime}=0\iff\alpha=\tfrac\pi6-\alpha\iff\alpha=\tfrac\pi{12}$, $f^{\prime\prime}=g^{\prime\prime}(\alpha)+g^{\prime\prime}\left(\tfrac\pi6-\alpha\right)>0$', criteria: ['3.M1', '3.R1', '3.A1', '3.R2']}
    hint_ladder:
    - $f(\alpha)$의 두 항을 $g$로 나타낼 수 있는가?
    - 증가함수 $g'$에 대해 $g'(x)=g'(y)$이면 $x$와 $y$의 관계는?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.74
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(\alpha)=4(\pi-\alpha)\sin\left(\dfrac\pi6-\alpha\right)+4\left(\dfrac{5\pi}6+\alpha\right)\sin\alpha=g\left(\dfrac\pi6-\alpha\right)+g(\alpha)$이므로 $f'(\alpha)=-g'\left(\dfrac\pi6-\alpha\right)+g'(\alpha)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (3-2)에서 $g'$은 증가함수이므로 $0<x,y<\dfrac\pi6$에서 $g'(x)=g'(y)$이면 $x=y$이다. 따라서 $f'(\alpha)=0$이려면 $\alpha=\dfrac\pi6-\alpha$, 즉 $\alpha=\dfrac\pi{12}$뿐이다.
      criteria: ['3.R1', '3.A1']
    - id: 3b-3
      content: |
        또 $g''>0$이므로 $f''(\alpha)=g''(\alpha)+g''\left(\dfrac\pi6-\alpha\right)>0$이다. 따라서 $f'$은 증가하고 $\alpha=\dfrac\pi{12}$의 좌우에서 음에서 양으로 바뀌므로 $f(\alpha)$는 $\alpha=\dfrac\pi{12}$에서 최솟값을 갖는다.
      criteria: ['3.R2']
  - id: S3-ALT
    audience: ALT
    source_flow: 해설교재 p.74~75 별해
    method_no: 2
    key_idea: $f\left(\tfrac\pi6-\alpha\right)=f(\alpha)$이므로 그래프가 $\alpha=\tfrac\pi{12}$에 대칭이고 $f'\left(\tfrac\pi{12}\right)=0$, $f''>0$을 직접 보인다.
    steps:
    - id: 3alt-1
      content: |
        $f(\alpha)=4\left\{(\alpha-\pi)\sin\left(\alpha-\dfrac\pi6\right)+\left(\alpha+\dfrac{5\pi}6\right)\sin\alpha\right\}$이고 $f\left(\dfrac\pi6-\alpha\right)=f(\alpha)$이므로 $f\left(\dfrac\pi{12}+\alpha\right)=f\left(\dfrac\pi{12}-\alpha\right)$이다. 이 대칭성에서 미분계수의 정의로 $f'\left(\dfrac\pi{12}\right)=-f'\left(\dfrac\pi{12}\right)$, 즉 $f'\left(\dfrac\pi{12}\right)=0$이다.
      criteria: ['3.M1', '3.A1']
    - id: 3alt-2
      content: |
        $f''(\alpha)=4\left\{2\cos\left(\alpha-\dfrac\pi6\right)-(\alpha-\pi)\sin\left(\alpha-\dfrac\pi6\right)+2\cos\alpha-\left(\alpha+\dfrac{5\pi}6\right)\sin\alpha\right\}\ge4\left(2\sqrt3-\pi\right)>0$이므로 $f'$은 증가하고 $f'=0$의 해는 $\alpha=\dfrac\pi{12}$뿐이며, 그 좌우에서 $f'$이 음에서 양으로 바뀐다. 따라서 $\alpha=\dfrac\pi{12}$에서 최소이다.
      criteria: ['3.R1', '3.R2']
  rubric:
