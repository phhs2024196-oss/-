intent: |
  두 원의 교점에서 접선과 반지름의 수직 관계로 각을 구하고, 사인법칙으로 반지름을 각의 함수로 나타내 호의 길이 함수를 만든 뒤, 이계도함수의 부호와 대칭 구조 $f(\alpha)=g(\alpha)+g\left(\tfrac\pi6-\alpha\right)$로 도함수의 범위와 최솟값을 판정하는 능력을 본다.
key_idea: |
  $\angle\mathrm{O_1PO_2}=\tfrac{5\pi}6$이므로 $\beta=\tfrac\pi6-\alpha$이고 사인법칙에서 $s=2\sin\alpha$, $r=2\sin\beta$이다. $g'$이 증가함수이므로 $g'(\alpha)=g'\left(\tfrac\pi6-\alpha\right)$는 $\alpha=\tfrac\pi{12}$뿐이다.
stuck: |
  $f(\alpha)=g\left(\tfrac\pi6-\alpha\right)+g(\alpha)$로 보고 (3-2)의 $g'$ 증가성(단사)을 이용해 임계점을 하나로 좁히는 발상
