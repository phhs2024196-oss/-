intent: |
  근과 정적분 조건으로 삼차함수를 결정하고, 피적분함수에 $x$가 든 정적분을 치환해 미분하며, 삼차함수의 점대칭에서 나오는 $h(x)+h(a-x)=a$를 산술·기하 평균에 연결해 최솟값을 구하는 능력을 본다.
key_idea: |
  $f(x)=x\left(x-\tfrac a2\right)(x-a)$는 점 $\left(\tfrac a2,0\right)$에 대해 대칭이므로 $h(x)+h(a-x)=a$이고, $e^{h(x)}+e^{a-h(x)}\ge2e^{a/2}$이다.
stuck: |
  $h(a-x)=a-h(x)$라는 불변량을 발견해 두 지수의 곱이 상수 $e^a$가 되게 만드는 단계
