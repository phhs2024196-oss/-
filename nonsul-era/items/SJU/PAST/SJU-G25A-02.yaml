stimuli: []

stem: |
  두 번 미분가능한 함수 $f(t)$는 모든 실수 $t$에 대하여 $0<f(t)<f(t+1)$를 만족시킨다.
  곡선 $y=\dfrac1x$ 위의 두 점 $\mathrm{A}\left(f(t),\,\dfrac{1}{f(t)}\right)$, $\mathrm{B}\left(f(t+1),\,\dfrac{1}{f(t+1)}\right)$에 대하여, 선분 $\mathrm{OA}$, 선분 $\mathrm{OB}$ 및 곡선 $y=\dfrac1x$로 둘러싸인 영역의 넓이를 $S(t)$라 정의하자. (단, $\mathrm{O}$는 원점이다.)
  (그림: 제1사분면에서 곡선 $y=\frac1x$ 위에 왼쪽 위의 점 $\mathrm{A}$, 오른쪽 아래의 점 $\mathrm{B}$가 있고, 원점 $\mathrm{O}$와 이은 두 선분 및 곡선 호 $\mathrm{AB}$로 둘러싸인 영역이 $S(t)$로 색칠되어 있다.)

subparts:
- id: '1'
  stem: |
    $S(t)$를 구하시오. 또한 $f(t)=e^{t^3}$일 때, $S(2)$의 값을 구하시오.
  points: 70
  depends_on: []
  answer: {kind: expression, value: 'S(t) = log(f(t+1)/f(t)); S(2) = 19', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S=\triangle\mathrm{OAC}+\int_{f(t)}^{f(t+1)}\tfrac1xdx-\triangle\mathrm{OBD}$이고 두 삼각형 넓이는 모두 $\tfrac12$.
    steps:
    - {id: 1a, content: '$S(t)=\ln\tfrac{f(t+1)}{f(t)}$, $S(2)=\ln\tfrac{e^{27}}{e^8}=19$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $\mathrm{A}$, $\mathrm{B}$에서 $x$축에 수선을 내려 보자.
    - 원점과 곡선 $y=\tfrac1x$ 위의 점, 그 점의 수선의 발이 이루는 삼각형의 넓이는?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.43
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{A}$, $\mathrm{B}$에서 $x$축에 내린 수선의 발을 $\mathrm{C}$, $\mathrm{D}$라 하면
        $S(t)=(\triangle\mathrm{OAC}\text{의 넓이})+\displaystyle\int_{f(t)}^{f(t+1)}\dfrac1x\,dx-(\triangle\mathrm{OBD}\text{의 넓이})$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        두 삼각형의 넓이는 모두 $\dfrac12\cdot f(t)\cdot\dfrac{1}{f(t)}=\dfrac12$이므로 $S(t)=\dfrac12+\ln\dfrac{f(t+1)}{f(t)}-\dfrac12=\ln\dfrac{f(t+1)}{f(t)}$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $f(t)=e^{t^3}$이면 $S(t)=\ln\dfrac{e^{(t+1)^3}}{e^{t^3}}$이고 $S(2)=\ln\dfrac{e^{27}}{e^8}=19$이다.
      criteria: ['1.A2']
  - id: S1-ALT1
    audience: ALT
    source_flow: 해설교재 p.43 별해
    method_no: 2
    key_idea: 원 해설 별해 — $\mathrm{C}(f(t+1),0)$, $\mathrm{D}\left(f(t+1),\tfrac{1}{f(t)}\right)$, $\mathrm{E}\left(0,\tfrac{1}{f(t)}\right)$인 직사각형 $\mathrm{OCDE}$에서 색칠된 부분(두 삼각형과 곡선 위쪽 부분)을 뺀다.
    steps:
    - id: 1c-1
      content: |
        $S(t)=\dfrac{f(t+1)}{f(t)}-\displaystyle\int_{f(t)}^{f(t+1)}\left\{\dfrac{1}{f(t)}-\dfrac1x\right\}dx-1=\ln f(t+1)-\ln f(t)=\ln\dfrac{f(t+1)}{f(t)}$.
      criteria: ['1.M1', '1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        $S(t)$를 삼각형 넓이와 $\int\tfrac1xdx$의 합·차(또는 직사각형에서 빼기)로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 25
      evidence: |
        $S(t)=\ln\tfrac{f(t+1)}{f(t)}$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 20
      evidence: |
        $S(2)=19$를 얻었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3038}
  misconceptions:
  - id: MC-CAL-3038
    outcome_code: '71'
    wrong_work: '$S(t)$를 삼각형 $\mathrm{OAB}$의 넓이로 계산하거나 곡선 아래 넓이 $\int\tfrac1xdx$를 빠뜨림'
    detect_cue: 로그 항이 없다
    feedback: 한 변이 곡선이므로 정적분이 필요합니다. 수선의 발을 내려 삼각형과 곡선 아래 넓이로 나누세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    모든 실수 $t$에 대하여 $S(t)=2$이고 $f(0)=2$일 때, $\displaystyle\sum_{n=1}^{\infty}\dfrac{1}{f(n)}$의 값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '1/(2*(exp(2) - 1))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\tfrac{f(t+1)}{f(t)}=e^2$이므로 $\tfrac{1}{f(n)}$은 첫째항 $\tfrac{1}{2e^2}$, 공비 $\tfrac{1}{e^2}$인 등비수열.
    steps:
    - {id: 2a, content: '$\sum_{n=1}^{\infty}\tfrac{1}{f(n)}=\tfrac{1/(2e^2)}{1-1/e^2}=\tfrac{1}{2(e^2-1)}$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $\ln\tfrac{f(t+1)}{f(t)}=2$를 비로 바꿔 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.44
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (2-1)에서 $S(t)=\ln\dfrac{f(t+1)}{f(t)}=2$이므로 $\dfrac{f(t+1)}{f(t)}=e^2$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 $f(1)=e^2f(0)=2e^2$이고 $\left\{\dfrac{1}{f(n)}\right\}$은 첫째항이 $\dfrac{1}{f(1)}=\dfrac{1}{2e^2}$, 공비가 $\dfrac{1}{e^2}$인 등비수열이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $0<\dfrac{1}{e^2}<1$이므로 $\displaystyle\sum_{n=1}^{\infty}\dfrac{1}{f(n)}=\dfrac{\frac{1}{2e^2}}{1-\frac{1}{e^2}}=\dfrac{1}{2(e^2-1)}$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 25
      evidence: |
        $S(t)=2$에서 $\tfrac{f(t+1)}{f(t)}=e^2$을 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 25}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 30
      evidence: |
        첫째항 $\tfrac{1}{2e^2}$과 공비 $\tfrac{1}{e^2}$을 밝혔다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 25
      evidence: |
        급수의 합 $\tfrac{1}{2(e^2-1)}$을 얻었다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-3039}
  misconceptions:
  - id: MC-ALG-3039
    outcome_code: '71'
    wrong_work: '첫째항을 $\tfrac{1}{f(0)}=\tfrac12$로 잡아 $\tfrac{e^2}{2(e^2-1)}$을 답함'
    detect_cue: 합이 $n=0$부터의 값이다
    feedback: 합은 $n=1$부터입니다. 첫째항은 $\tfrac{1}{f(1)}=\tfrac{1}{2e^2}$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    함수 $f(t)$는 $f(0)=2$, $f'(0)=3$이고 모든 실수 $t$에 대하여 $f''(t)f(t)\ge\{f'(t)\}^2$을 만족시킨다고 하자.
    $S(t)$가 상수함수일 때, $f\left(\dfrac12\right)$의 값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '2*exp(3/4)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g=\tfrac{f'}{f}$는 $g(t)=g(t+1)$이고 $g'\ge0$이므로 상수 $\tfrac32$, $f=2e^{3t/2}$.
    steps:
    - {id: 3a, content: '$g$가 상수가 아니면 평균값 정리로 $g''(d)<0$인 $d$가 생겨 모순 ⇒ $\tfrac{f''}{f}=\tfrac32$, $f\left(\tfrac12\right)=2e^{3/4}$', criteria: ['3.M1', '3.R1', '3.A1']}
    hint_ladder:
    - $S'(t)=0$을 $f$로 나타내 보자.
    - 주어진 부등식은 $\left(\tfrac{f'}{f}\right)'$의 부호와 어떤 관계인가?
    - 주기가 $1$인데 감소하는 곳이 없는 함수는?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.44
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $S(t)=\ln\dfrac{f(t+1)}{f(t)}$이 상수이므로 $0=S'(t)=\dfrac{f'(t+1)}{f(t+1)}-\dfrac{f'(t)}{f(t)}$이다. $g(t)=\dfrac{f'(t)}{f(t)}$라 하면 $g(t)=g(t+1)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $g$가 상수함수가 아니라고 하자. 그러면 어떤 $t$와 $t<c<t+1$인 $c$에 대해 $g(c)>g(t+1)$ 또는 $g(c)<g(t+1)=g(t)$이다.
        앞의 경우 $\dfrac{g(t+1)-g(c)}{t+1-c}<0$, 뒤의 경우 $\dfrac{g(c)-g(t)}{c-t}<0$이므로 평균값 정리에 의해 $g'(d)<0$인 $d$가 존재한다.
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        그런데 $g'(t)=\dfrac{f''(t)f(t)-\{f'(t)\}^2}{\{f(t)\}^2}\ge0$이므로 모순이다. 따라서 $g$는 상수이고 $g(t)=g(0)=\dfrac{f'(0)}{f(0)}=\dfrac32$이다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $\dfrac{f'(t)}{f(t)}=\dfrac32$을 적분하면 $\ln f(t)=\dfrac32t+C$, $f(t)=e^Ce^{3t/2}$이고 $f(0)=2$에서 $e^C=2$이다. $f(t)=2e^{3t/2}$이므로 $f\left(\dfrac12\right)=2e^{3/4}$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $S'(t)=0$에서 $\tfrac{f'(t+1)}{f(t+1)}=\tfrac{f'(t)}{f(t)}$를 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 20}
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 40
      evidence: |
        $\left(\tfrac{f'}{f}\right)'\ge0$과 평균값 정리(귀류)로 $\tfrac{f'}{f}$가 상수임을 보였다.
      depends_on: [3.M1]
      steps: [3b-2, 3b-3]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $f(t)=2e^{3t/2}$를 구해 $f\left(\tfrac12\right)=2e^{3/4}$를 얻었다.
      depends_on: [3.R1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3040}
  misconceptions:
  - id: MC-CAL-3040
    outcome_code: '71'
    wrong_work: '$\tfrac{f''(t+1)}{f(t+1)}=\tfrac{f''(t)}{f(t)}$만으로 근거 없이 $\tfrac{f''}{f}$를 상수라고 둠'
    detect_cue: 부등식 $f''f\ge(f')^2$이 쓰이지 않았다
    feedback: 주기가 $1$인 함수는 상수가 아닐 수도 있습니다(예를 들어 $\sin2\pi t$). 주어진 부등식으로 감소하지 않음을 보여야 상수가 됩니다.
    remedy: [RL-3]

