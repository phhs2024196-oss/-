intent: |
  곡선 $y=\tfrac1x$와 원점을 잇는 선분으로 둘러싸인 넓이를 로그로 나타내고, 그 결과를 등비급수와 함수 결정에 연결하며, 평균값 정리와 귀류법으로 $\tfrac{f'}{f}$가 상수임을 보이는 능력을 본다.
key_idea: |
  두 삼각형 넓이가 모두 $\tfrac12$이라 상쇄되어 $S(t)=\ln\tfrac{f(t+1)}{f(t)}$이다. $S'(t)=0$이면 $\tfrac{f'}{f}$는 주기 $1$이고, $\left(\tfrac{f'}{f}\right)'\ge0$이므로 상수여야 한다.
stuck: |
  (2-3)에서 주기가 $1$인 함수 $\tfrac{f'}{f}$가 감소하지 않으면 상수라는 것을 평균값 정리와 귀류법으로 보이는 단계
