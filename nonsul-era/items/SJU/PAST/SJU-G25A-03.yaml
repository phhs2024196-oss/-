stimuli: []

stem: |
  그림과 같이 좌표평면에서, $\overline{\mathrm{OA}}=2\sqrt2$, $\overline{\mathrm{OB}}=\overline{\mathrm{AB}}=2$인 직각삼각형 $\mathrm{OAB}$에 대하여 선분 $\mathrm{OB}$가 $x$축의 양의 방향과 이루는 각이 $\theta$이다. (단, $0\le\theta<\dfrac{\pi}{2}$)
  직선 $l:y=1$이 삼각형 $\mathrm{OAB}$와 만나는 두 점을 왼쪽부터 각각 $\mathrm{C}$, $\mathrm{D}$라 하자. (단, $\mathrm{O}$는 원점이다.)
  (그림: 두 경우가 그려져 있다. 왼쪽 그림은 $\theta$가 작아 $\mathrm{B}$가 직선 $l$ 아래에 있고 $\mathrm{C}$는 선분 $\mathrm{OA}$ 위, $\mathrm{D}$는 선분 $\mathrm{AB}$ 위에 있다. 오른쪽 그림은 $\theta$가 커서 $\mathrm{A}$가 제2사분면, $\mathrm{B}$가 직선 $l$ 위쪽에 있고 $\mathrm{C}$는 선분 $\mathrm{OA}$ 위, $\mathrm{D}$는 선분 $\mathrm{OB}$ 위에 있다. 두 그림 모두 $\mathrm{B}$에 직각 표시, 직선 $l$과 $x$축 사이 거리 $1$이 표시되어 있다.)

subparts:
- id: '1'
  stem: |
    $\mathrm{A}$의 좌표와 $\mathrm{B}$의 좌표를 각각 $\theta$의 식으로 나타내시오. 또한 $\mathrm{D}$가 선분 $\mathrm{OB}$ 위에 있는 경우 $\theta$의 값의 범위를 구하시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: 'Ax = 2*sqrt(2)*cos(theta + pi/4); Ay = 2*sqrt(2)*sin(theta + pi/4); Bx = 2*cos(theta); By = 2*sin(theta); theta_min = pi/6; theta_sup = pi/2', equivalents: ['pi/6 <= theta < pi/2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\angle\mathrm{AOB}=\tfrac{\pi}{4}$이므로 $\mathrm{A}$의 편각은 $\theta+\tfrac{\pi}{4}$, $\mathrm{D}\in\mathrm{OB}\iff$ $\mathrm{B}$의 $y$좌표 $\ge1$.
    steps:
    - {id: 1a, content: '$\mathrm{A}\left(2\sqrt2\cos\left(\theta+\tfrac{\pi}{4}\right),2\sqrt2\sin\left(\theta+\tfrac{\pi}{4}\right)\right)$, $\mathrm{B}(2\cos\theta,2\sin\theta)$, $\tfrac{\pi}{6}\le\theta<\tfrac{\pi}{2}$', criteria: ['1.M1', '1.A1', '1.A2', '1.A3']}
    hint_ladder:
    - 직각이등변삼각형에서 $\angle\mathrm{AOB}$는 얼마인가?
    - 직선 $y=1$이 선분 $\mathrm{OB}$와 만나려면 $\mathrm{B}$는 어디에 있어야 하는가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.45
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\triangle\mathrm{OAB}$는 $\angle\mathrm{B}=\dfrac{\pi}{2}$인 직각이등변삼각형이므로 $\angle\mathrm{AOB}=\dfrac{\pi}{4}$이고, 그림에서 $\mathrm{A}$는 $\mathrm{B}$를 시계 반대 방향으로 $\dfrac{\pi}{4}$ 더 돌린 방향에 있다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $\mathrm{A}\left(2\sqrt2\cos\left(\theta+\dfrac{\pi}{4}\right),\,2\sqrt2\sin\left(\theta+\dfrac{\pi}{4}\right)\right)$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\mathrm{B}(2\cos\theta,\,2\sin\theta)$이다.
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $\mathrm{D}$가 선분 $\mathrm{OB}$ 위에 있으려면 $\mathrm{B}$의 $y$좌표가 $1$ 이상, 즉 $2\sin\theta\ge1$이어야 하므로 $\dfrac{\pi}{6}\le\theta<\dfrac{\pi}{2}$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $\angle\mathrm{AOB}=\tfrac{\pi}{4}$을 밝혀 $\mathrm{A}$의 편각을 $\theta+\tfrac{\pi}{4}$로 잡았다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $\mathrm{A}$의 좌표를 바르게 썼다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $\mathrm{B}(2\cos\theta,2\sin\theta)$를 썼다.
      depends_on: [1.M1]
      implied_ok: true
      steps: [1b-3]
    - id: 1.A3
