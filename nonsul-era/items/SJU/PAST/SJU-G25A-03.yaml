      points: 25
      evidence: |
        $2\sin\theta\ge1$에서 $\tfrac{\pi}{6}\le\theta<\tfrac{\pi}{2}$를 얻었다.
      depends_on: [1.M1, 1.A2]
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 범위의 등호($\theta=\tfrac{\pi}{6}$ 포함) 처리 오류
      effect: minus
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-3041}
  misconceptions:
  - id: MC-ALG-3041
    outcome_code: '71'
    wrong_work: '$\mathrm{A}(2\sqrt2\cos\theta,\,2\sqrt2\sin\theta)$ 또는 편각을 $\theta+\tfrac{\pi}{2}$로 씀'
    detect_cue: $\theta+\tfrac{\pi}{4}$가 없다
    feedback: $\mathrm{OB}$와 $\mathrm{OA}$ 사이의 각은 직각이등변삼각형의 밑각 $\tfrac{\pi}{4}$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $t=\tan\theta$일 때, 선분 $\mathrm{CD}$의 길이를 $f(t)$라 하자. $\mathrm{D}$가 선분 $\mathrm{OB}$ 위에 있는 경우 $f(t)$를 구하고 $f(t)$의 최솟값과 최댓값을 각각 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: 'f(t) = 1/t - (1 - t)/(1 + t); min = 2*sqrt(2) - 2; max = 2*sqrt(3) - 2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{C}=\left(\cot\left(\theta+\tfrac{\pi}{4}\right),1\right)$, $\mathrm{D}=(\cot\theta,1)$, $t\ge\tfrac{1}{\sqrt3}$에서 $f'(t)=\tfrac{t^2-2t-1}{t^2(1+t)^2}$.
    steps:
    - {id: 2a, content: '$f(t)=\tfrac1t-\tfrac{1-t}{1+t}$, 최소 $f(1+\sqrt2)=2\sqrt2-2$, 최대 $f\left(\tfrac{1}{\sqrt3}\right)=2\sqrt3-2$ ($\lim_{t\to\infty}f=1$)', criteria: ['2.M1', '2.A1', '2.M2', '2.A2', '2.R1']}
    hint_ladder:
    - 원점을 지나고 기울기가 $\tan\phi$인 직선이 $y=1$과 만나는 점의 $x$좌표는?
    - $\cot\left(\theta+\tfrac{\pi}{4}\right)$를 $t$로 나타내자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.45
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\dfrac{\pi}{6}\le\theta<\dfrac{\pi}{2}$이면 $\mathrm{C}\left(\cot\left(\theta+\dfrac{\pi}{4}\right),1\right)$, $\mathrm{D}(\cot\theta,1)$이므로 $\overline{\mathrm{CD}}=\cot\theta-\cot\left(\theta+\dfrac{\pi}{4}\right)$이고 $t=\tan\theta\ge\dfrac{1}{\sqrt3}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\tan\left(\theta+\dfrac{\pi}{4}\right)=\dfrac{1+\tan\theta}{1-\tan\theta}$이므로 $f(t)=\dfrac1t-\dfrac{1-t}{1+t}$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $f'(t)=-\dfrac{1}{t^2}+\dfrac{2}{(1+t)^2}=\dfrac{t^2-2t-1}{t^2(1+t)^2}$이므로 $t\ge\dfrac{1}{\sqrt3}$에서 $f'(t)=0\iff t=1+\sqrt2$이고, $\dfrac{1}{\sqrt3}\le t<1+\sqrt2$에서 $f'<0$, $t>1+\sqrt2$에서 $f'>0$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        최솟값은 $f(1+\sqrt2)=2\sqrt2-2$이다.
      criteria: ['2.A2']
    - id: 2b-5
      content: |
        $f\left(\dfrac{1}{\sqrt3}\right)=2\sqrt3-2>1$이고 $\displaystyle\lim_{t\to\infty}f(t)=1$이므로 최댓값은 $f\left(\dfrac{1}{\sqrt3}\right)=2\sqrt3-2$이다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        $\mathrm{C}$, $\mathrm{D}$의 $x$좌표를 $\cot$으로 나타내 $\overline{\mathrm{CD}}$ 식을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 1.A3], max_points: 15}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        덧셈정리로 $f(t)=\tfrac1t-\tfrac{1-t}{1+t}$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 20
      evidence: |
        $f'(t)$를 구하고 $t\ge\tfrac{1}{\sqrt3}$에서 부호를 조사했다.
      depends_on: []
      implied_ok: false
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 15
      evidence: |
        최솟값 $2\sqrt2-2$를 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    - id: 2.R1
      mark_type: R
      points: 15
      evidence: |
        끝값 $f\left(\tfrac{1}{\sqrt3}\right)$과 극한값 $1$을 비교해 최댓값 $2\sqrt3-2$를 확정했다.
      depends_on: [2.M2]
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3042}
  misconceptions:
  - id: MC-CAL-3042
    outcome_code: '71'
    wrong_work: '끝값을 비교하지 않고 $t\to\infty$의 극한값 $1$을 최댓값(또는 최솟값)으로 씀'
    detect_cue: $f\left(\tfrac{1}{\sqrt3}\right)$의 계산이 없다
    feedback: 극한값 $1$은 도달하지 않는 값이고, 왼쪽 끝 $t=\tfrac{1}{\sqrt3}$에서의 값이 더 큽니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    직선 $l$이 나누는 삼각형의 두 영역 중 $l$ 위의 영역의 넓이를 $a$, $l$ 아래의 영역의 넓이를 $b$라 하자.
    $0\le\theta<\dfrac{\pi}{2}$일 때, $a\times b$의 최솟값과 최댓값을 각각 구하시오.
  points: 80
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'min = 4*sqrt(2) - 5; max = 1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a+b=2$이고 $b$의 범위는 $\left[\sqrt3-1,\tfrac32\right]\cup\left[\sqrt2-1,\sqrt3-1\right]=\left[\sqrt2-1,\tfrac32\right]$.
    steps:
    - {id: 3a, content: '$ab=b(2-b)$, $b=1$에서 최대 $1$, $b=\sqrt2-1$에서 최소 $(\sqrt2-1)(3-\sqrt2)=4\sqrt2-5$', criteria: ['3.M1', '3.A1', '3.A2', '3.R1', '3.A3']}
    hint_ladder:
    - 삼각형 전체 넓이는 얼마인가?
    - $\mathrm{D}$가 $\mathrm{OB}$ 위에 있으면 $l$ 아래 영역은 어떤 도형인가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.45~46
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        삼각형 넓이가 $\dfrac12\cdot2\cdot2=2$이므로 $a=2-b$이고 $g(b)=a\times b=b(2-b)$라 두자.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $0\le\theta\le\dfrac{\pi}{6}$이면 $\theta$가 증가할수록 $l$ 위의 영역이 커져 $a$는 증가하고 $b=2-a$는 감소한다. $\theta=0$일 때 $\mathrm{A}(2,2)$, $\mathrm{B}(2,0)$이라 $a=\dfrac12$, $b=\dfrac32$이고, $\theta=\dfrac{\pi}{6}$일 때 $b=\dfrac12\cdot\overline{\mathrm{CD}}\cdot1=\sqrt3-1$이다. 따라서 $\sqrt3-1\le b\le\dfrac32$.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $\dfrac{\pi}{6}\le\theta<\dfrac{\pi}{2}$이면 $l$ 아래 영역은 높이 $1$인 삼각형 $\mathrm{OCD}$이므로 $b=\dfrac12f(t)$이고, (3-2)에서 $\sqrt2-1\le b\le\sqrt3-1$이다.
      criteria: ['3.A2']
    - id: 3b-4
      content: |
        따라서 $0\le\theta<\dfrac{\pi}{2}$에서 $\sqrt2-1\le b\le\dfrac32$이다. $g(b)=b(2-b)$는 $b=1$에 대해 대칭인 위로 볼록한 포물선이고 $1-(\sqrt2-1)>\dfrac32-1$이므로
      criteria: ['3.R1']
    - id: 3b-5
      content: |
        최댓값 $g(1)=1$, 최솟값 $g(\sqrt2-1)=(\sqrt2-1)(3-\sqrt2)=4\sqrt2-5$이다.
      criteria: ['3.A3']
  - id: S3-ALT1
    audience: ALT
    source_flow: 해설교재 p.46~47 별해
    method_no: 2
    key_idea: 원 해설 별해 — $a$를 변수로 $g(a)=a(2-a)$를 두고 $a$의 범위 $\left[\tfrac12,3-\sqrt2\right]$에서 최대·최소를 구한다.
    steps:
    - id: 3c-1
      content: |
        $0\le\theta\le\tfrac{\pi}{6}$에서 $\tfrac12\le a\le3-\sqrt3$, $\tfrac{\pi}{6}\le\theta<\tfrac{\pi}{2}$에서 $3-\sqrt3\le a\le3-\sqrt2$이므로 $\tfrac12\le a\le3-\sqrt2$이고, $(3-\sqrt2)-1>1-\tfrac12$이므로 최댓값 $g(1)=1$, 최솟값 $g(3-\sqrt2)=4\sqrt2-5$.
