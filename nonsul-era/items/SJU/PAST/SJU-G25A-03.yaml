intent: |
  회전하는 직각이등변삼각형의 꼭짓점을 삼각함수로 나타내고, 수평선과의 교점 사이 거리를 탄젠트의 덧셈정리로 $t=\tan\theta$의 유리함수로 바꿔 최대·최소를 구한 뒤, 이를 넓이의 곱의 범위로 연결하는 능력을 본다.
key_idea: |
  $\overline{\mathrm{CD}}=\cot\theta-\cot\left(\theta+\tfrac{\pi}{4}\right)=\tfrac1t-\tfrac{1-t}{1+t}$이고, $a+b=2$이므로 $ab=b(2-b)$의 범위는 $b$의 범위 $\left[\sqrt2-1,\tfrac32\right]$로 정해진다.
stuck: |
  (3-3)에서 $\theta$의 범위를 $D$가 $\mathrm{AB}$ 위인 경우와 $\mathrm{OB}$ 위인 경우로 나눠 $b$의 범위를 합치고, $a+b=2$로 이차함수 최대·최소로 바꾸는 단계
