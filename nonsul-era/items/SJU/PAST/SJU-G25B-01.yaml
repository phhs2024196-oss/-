stimuli: []

stem: |
  최고차항의 계수가 $1$인 사차함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $f(-1)=2$

  (나) 함수 $\lvert f(x)\rvert$는 $x=0$과 $x=1$에서만 미분가능하지 <u>않다.</u>

subparts:
- id: '1'
  stem: |
    $f'(0)$의 값의 범위를 구하시오.
  points: 70
  depends_on: []
  answer: {kind: set, value: '[-4, 0)', equivalents: ['-4 <= f1(0) < 0'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=x(x-1)(x^2+ax+b)$, (가)에서 $a=b$, 나머지 이차식은 서로 다른 두 실근을 갖지 않아야 하고 $a\ne0$.
    steps:
    - {id: 1a, content: '$a^2-4a\le0$, $a\ne0\Rightarrow0<a\le4$, $f''(0)=-a\Rightarrow-4\le f''(0)<0$', criteria: ['1.M1', '1.A1', '1.R1', '1.A2']}
    hint_ladder:
    - $\lvert f(x)\rvert$는 $f$의 어떤 근에서 미분가능하지 않은가?
    - $f(-1)=2$로 계수 사이의 관계를 찾자.
    - $a=0$이면 $x=0$은 몇 중근인가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.48
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\lvert f(x)\rvert$가 미분가능하지 않은 점은 $f$의 근 중 $f'\ne0$인 점이므로, 조건 (나)로 $f(x)=x(x-1)(x^2+ax+b)$로 쓸 수 있다. 조건 (가) $f(-1)=2(1-a+b)=2$에서 $a=b$이다.
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        $f(x)=x(x-1)(x^2+ax+a)$이고, 조건 (나)로 $x^2+ax+a=0$은 서로 다른 두 실근을 갖지 않는다(그런 근에서 $\lvert f\rvert$가 미분불가능). 따라서 $a^2-4a\le0$, $0\le a\le4$이다.
        $a=0$이면 $f(x)=x^3(x-1)$이라 $f'(0)=0$이고 $\lvert f\rvert$가 $x=0$에서 미분가능하므로 제외한다. $a=4$이면 $x=-2$가 중근이라 $\lvert f\rvert$는 거기서 미분가능하다. 따라서 $0<a\le4$.
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        $f'(0)=(0-1)(0+0+a)=-a$이므로 $-4\le f'(0)<0$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        조건 (나)로 $f(x)=x(x-1)(x^2+ax+b)$ 꼴을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        $f(-1)=2$에서 $a=b$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 25
      evidence: |
        $x^2+ax+a$가 서로 다른 두 실근을 갖지 않아야 함($a^2-4a\le0$)과 $a=0$ 제외를 근거와 함께 밝혔다.
      depends_on: [1.A1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $f'(0)=-a$에서 $-4\le f'(0)<0$을 얻었다.
      depends_on: [1.R1]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: $a=0$ 또는 $a=4$의 포함 여부(등호) 처리 오류
      effect: minus
      value: 10
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3043}
  misconceptions:
  - id: MC-CAL-3043
    outcome_code: '71'
    wrong_work: '중근에서도 $\lvert f\rvert$가 미분불가능하다고 보아 $a^2-4a<0$, 답 $-4<f''(0)<0$'
    detect_cue: $a=4$ 경우를 제외했다
    feedback: $f$가 중근을 가지면 그 점에서 $f'=0$이므로 $\lvert f\rvert$도 미분가능합니다. 부호가 바뀌는 근만 문제가 됩니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $f'(0)=-3$일 때, $e^{\lvert f(x)\rvert}$은 $x=0$에서 미분가능하지 <u>않음</u>을 보이시오.
  points: 80
  depends_on: ['1']
  answer: {kind: proof, value: 'right derivative = -f1(0) = 3, left derivative = f1(0) = -3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x=0$ 근방에서 $x>0$이면 $f<0$, $x<0$이면 $f>0$이므로 우미분계수 $-f'(0)=3$, 좌미분계수 $f'(0)=-3$.
    steps:
    - {id: 2a, content: '$\lim_{x\to0+}\tfrac{e^{-f(x)}-1}{x}=3\ne-3=\lim_{x\to0-}\tfrac{e^{f(x)}-1}{x}$', criteria: ['2.M1', '2.R1', '2.A1']}
    hint_ladder:
    - $x=0$ 근처에서 $f(x)$의 부호는?
    - $\lvert f\rvert$를 좌우에서 각각 $\pm f$로 바꿔 미분계수의 정의를 쓰자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.48
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f'(0)=-3$이면 $a=3$, $f(x)=x(x-1)(x^2+3x+3)$이고 $x^2+3x+3>0$이므로 $0$ 근방에서 $x>0$이면 $f(x)<0$, $x<0$이면 $f(x)>0$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\displaystyle\lim_{x\to0+}\dfrac{e^{\lvert f(x)\rvert}-1}{x}=\lim_{x\to0+}\dfrac{e^{-f(x)}-1}{x}=\left\{e^{-f(x)}\right\}'(0)=-f'(0)e^{0}=3$이다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        $\displaystyle\lim_{x\to0-}\dfrac{e^{\lvert f(x)\rvert}-1}{x}=\lim_{x\to0-}\dfrac{e^{f(x)}-1}{x}=\left\{e^{f(x)}\right\}'(0)=f'(0)=-3$이다. 좌우 미분계수가 다르므로 $e^{\lvert f(x)\rvert}$은 $x=0$에서 미분가능하지 않다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $x=0$ 좌우에서 $f(x)$의 부호를 밝혀 $\lvert f\rvert$를 $-f$, $f$로 바꿨다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 20}
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 30
      evidence: |
        우미분계수를 정의(또는 합성함수 미분)로 계산해 $3$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 30
      evidence: |
        좌미분계수 $-3$을 얻고 좌우가 다르므로 미분불가능하다고 결론지었다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 결론을 가정하고 시작하거나 $e^{\lvert f\rvert}$의 도함수를 형식적으로 써서 판단
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRF-0003}
  misconceptions:
  - id: MC-PRF-0003
    outcome_code: '71'
    wrong_work: '$\left(e^{\lvert f\rvert}\right)''=\lvert f\rvert''e^{\lvert f\rvert}$이고 $\lvert f\rvert$가 미분불가능하므로 끝, 이라고 씀'
    detect_cue: 좌·우 미분계수의 계산이 없다
    feedback: 미분불가능한 함수의 합성도 미분가능할 수 있습니다. 좌우 미분계수를 직접 계산해 다름을 보이세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    직선 $y=mx+n$이 서로 다른 두 점 $\mathrm{A}(\alpha,f(\alpha))$, $\mathrm{B}(\beta,f(\beta))$에서 곡선 $y=f(x)$에 접하는 경우, $m$이 최소일 때 $f'(0)$의 값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '-1 - 2*sqrt(6)/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 계수 비교로 $\alpha+\beta=\tfrac{1-a}{2}$, $\alpha\beta=-\tfrac12(\alpha+\beta)^2$, $m=\tfrac{(a-1)^3}{8}-a$ ($0<a\le4$)를 최소화.
    steps:
    - {id: 3a, content: '$m''(a)=\tfrac{3(a-1)^2}{8}-1=0\Rightarrow a=1+\tfrac{2\sqrt6}{3}$에서 최소, $f''(0)=-a=-1-\tfrac{2\sqrt6}{3}$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2']}
    hint_ladder:
    - 두 점에서 접하면 $f(x)-(mx+n)$은 어떤 꼴로 인수분해되는가?
    - $m$을 $a$만의 식으로 나타내자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.48
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        두 점에서 접하므로 $x(x-1)(x^2+ax+a)=mx+n+(x-\alpha)^2(x-\beta)^2$가 항등식이다. 좌변은 $x^4+(a-1)x^3-ax$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        계수를 비교하면 $-2(\alpha+\beta)=a-1$, $(\alpha+\beta)^2+2\alpha\beta=0$, $m-2(\alpha+\beta)\alpha\beta=-a$이다.
        따라서 $m=2(\alpha+\beta)\alpha\beta-a=(1-a)\left(-\dfrac12\right)\left(\dfrac{1-a}{2}\right)^2-a=\dfrac{(a-1)^3}{8}-a$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $\dfrac{dm}{da}=\dfrac{3(a-1)^2}{8}-1=0$에서 $a=1\pm\dfrac{2\sqrt6}{3}$이다. $0<a\le4$에서 $m$은 $a<1+\tfrac{2\sqrt6}{3}$일 때 감소, $a>1+\tfrac{2\sqrt6}{3}$일 때 증가하므로 $a=1+\dfrac{2\sqrt6}{3}$에서 최소이다($a\ne1$이라 $\alpha\ne\beta$도 성립).
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        이때 $f'(0)=-a=-1-\dfrac{2\sqrt6}{3}$이다.
      criteria: ['3.A2']
  - id: S3-ALT1
    audience: ALT
    source_flow: 해설교재 p.48 별해
    method_no: 2
    key_idea: 원 해설 별해 — $\alpha^2+4\alpha\beta+\beta^2=0$에서 $\alpha=(-2+\sqrt3)\beta$로 두고 $\gamma=(-1+\sqrt3)\beta$로 치환하면 $m=-\gamma^3+2\gamma-1$, $-\tfrac32\le\gamma<\tfrac12$에서 $\gamma=-\sqrt{\tfrac23}$일 때 최소.
    steps:
    - id: 3c-1
      content: |
        $a=1-2\gamma$이고 $g(\gamma)=-\gamma^3+2\gamma-1$은 $\gamma=-\sqrt{\tfrac23}$에서 극소, $g\left(\tfrac12\right)>g\left(-\sqrt{\tfrac23}\right)$이므로 최소. $a=1+\tfrac{2\sqrt6}{3}$, $f'(0)=-1-\tfrac{2\sqrt6}{3}$.
      criteria: ['3.M2', '3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $f(x)-(mx+n)=(x-\alpha)^2(x-\beta)^2$의 항등식을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 20}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 25
      evidence: |
        계수 비교로 $m=\tfrac{(a-1)^3}{8}-a$(또는 동치식)를 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        $0<a\le4$에서 $m$의 증감을 조사해 최소가 되는 $a$를 찾았다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.R1], max_points: 20}
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        $f'(0)=-1-\tfrac{2\sqrt6}{3}$을 얻었다.
      depends_on: [3.M2, 3.A1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3044}
  misconceptions:
  - id: MC-CAL-3044
    outcome_code: '71'
    wrong_work: '$f''(\alpha)=f''(\beta)=m$만 세우고 접점에서 함숫값이 직선 위에 있다는 조건을 빠뜨려 미지수를 정하지 못함'
    detect_cue: 항등식 또는 $f(\alpha)=m\alpha+n$, $f(\beta)=m\beta+n$이 없다
    feedback: 두 점에서 접하면 $f(x)-(mx+n)$이 $(x-\alpha)^2(x-\beta)^2$로 인수분해됩니다. 계수 비교가 가장 빠릅니다.
    remedy: [RL-3]

