stimuli: []

stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) 모든 실수 $x$에 대하여 $f(-x)-f(0)=-\{f(x)-f(0)\}$

  (나) 방정식 $f(x)=\lvert x\rvert$의 서로 다른 실근의 개수는 $2$이다.

subparts:
- id: '1'
  stem: |
    $f(0)=c$일 때, 정적분 $\displaystyle\int_{-1}^1f(x)\,dx$의 값을 $c$의 식으로 나타내시오.
  points: 70
  depends_on: []
  answer: {kind: expression, value: '2*c', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)-c$는 기함수이므로 $\int_{-1}^1(f-c)=0$.
    steps:
    - {id: 1a, content: '$f(x)=x^3+bx+c\Rightarrow\int_{-1}^1f(x)dx=2c$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 조건 (가)는 그래프의 어떤 대칭을 뜻하는가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.49
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^3+ax^2+bx+c$라 하면 $f(0)=c$이고, 조건 (가)에서 모든 $x$에 대해 $-x^3+ax^2-bx=-x^3-ax^2-bx$이므로 $a=0$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f(x)=x^3+bx+c$이고 $f(x)-c=x^3+bx$의 그래프는 원점에 대해 대칭이므로 $f(x)$의 그래프는 점 $(0,c)$에 대해 대칭이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 $\displaystyle\int_{-1}^1f(x)\,dx=2c$이다.
      criteria: ['1.A2']
  - id: S1-ALT1
    audience: ALT
    source_flow: 해설교재 p.49 별해
    method_no: 2
    key_idea: 원 해설 별해 — 직접 계산 $\int_{-1}^1(x^3+bx+c)dx=\int_{-1}^1(x^3+bx)dx+\int_{-1}^1c\,dx=0+2c$.
    steps:
    - id: 1c-1
      content: |
        $\displaystyle\int_{-1}^1(x^3+bx+c)\,dx=0+2c=2c$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        조건 (가)를 계수 비교해 $x^2$의 계수가 $0$임을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $f(x)=x^3+bx+c$(점 $(0,c)$ 대칭)를 밝혔다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 25
      evidence: |
        $\int_{-1}^1f(x)dx=2c$를 얻었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3045}
  misconceptions:
  - id: MC-CAL-3045
    outcome_code: '71'
    wrong_work: '대칭이므로 $\int_{-1}^1f(x)dx=0$이라고 답함'
    detect_cue: 상수항 $c$의 기여 $2c$가 없다
    feedback: 대칭 중심이 원점이 아니라 $(0,c)$입니다. $f(x)-c$가 기함수이므로 $f$의 적분은 $2c$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $f(0)=0$일 때, 방정식 $f(x)=\lvert x\rvert$의 $0$이 아닌 실근을 $k$라 하자. $k$의 값의 범위를 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: set, value: '(0, sqrt(2)]', equivalents: ['0 < k <= sqrt(2)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=x^3+bx$, 원점에서의 기울기 $b$와 $\pm1$을 비교하면 근이 $2$개인 조건은 $-1\le b<1$, $k=\sqrt{1-b}$.
    steps:
    - {id: 2a, content: '$-1\le b<1$, $k=\sqrt{1-b}\Rightarrow0<k\le\sqrt2$', criteria: ['2.M1', '2.R1', '2.A1']}
    hint_ladder:
    - $x>0$과 $x<0$에서 방정식을 각각 풀어 보자.
    - $b=-1$일 때 $x<0$ 쪽 근은 어떻게 되는가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.49
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $c=f(0)=0$이므로 $f(x)=x^3+bx$이다. 조건 (나)로 $-1\le f'(0)<1$, 즉 $-1\le b<1$이어야 한다. $f'(0)<-1$이면 방정식 $f(x)=\lvert x\rvert$는 서로 다른 실근 $3$개를, $f'(0)\ge1$이면 실근 $1$개만 갖기 때문이다(그래프 비교).
      criteria: ['2.M1', '2.R1']
    - id: 2b-2
      content: |
        그러므로 한 실근은 $0$이고 나머지 실근 $k$는 양수이다. $y=x^3+bx$와 $y=x$ ($x>0$)를 연립하면 $x(x^2+b-1)=0$에서 $k=\sqrt{1-b}$ ($-1\le b<1$)이고, 따라서 $0<k\le\sqrt2$이다.
      criteria: ['2.A1']
  - id: S2-ALT1
    audience: ALT
    source_flow: 해설교재 p.49~50 별해
    method_no: 2
    key_idea: 원 해설 별해 — $x>0$이면 $x^3+bx=x$의 근은 $b<1$일 때 $\sqrt{1-b}$, $x<0$이면 $x^3+bx=-x$의 근은 $b<-1$일 때 $-\sqrt{-1-b}$. (i) $b<-1$ 근 3개, (ii) $-1\le b<1$ 근 $0,\sqrt{1-b}$, (iii) $b\ge1$ 근 $0$뿐.
    steps:
    - id: 2c-1
      content: |
        (ii)의 경우만 조건 (나)를 만족하므로 $k=\sqrt{1-b}$, $-1\le b<1$에서 $0<k\le\sqrt2$.
      criteria: ['2.R1', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $f(x)=x^3+bx$로 두고 $b$(또는 $f'(0)$)에 따라 근의 개수를 따지기 시작했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 20}
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 35
      evidence: |
        $b<-1$이면 근 $3$개, $b\ge1$이면 근 $1$개임을 근거(그래프 또는 구간별 풀이)로 밝혀 $-1\le b<1$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 25
      evidence: |
        $k=\sqrt{1-b}$에서 $0<k\le\sqrt2$를 얻었다.
      depends_on: [2.R1]
      steps: [2b-2]
    deductions:
    - code: D2-1
      condition: 등호($b=-1$, 즉 $k=\sqrt2$) 포함 여부 오류
      effect: minus
      value: 10
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3046}
  misconceptions:
  - id: MC-CAL-3046
    outcome_code: '71'
    wrong_work: '$b=-1$에서 $x<0$ 쪽에서도 근이 생긴다고 보아 $-1<b<1$, $0<k<\sqrt2$로 답함'
    detect_cue: $k=\sqrt2$를 제외했다
    feedback: $b=-1$이면 $x^3-x=-x$는 $x=0$만 근이므로 음수 근은 생기지 않습니다. 경계값을 직접 대입해 확인하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    $f(0)\ne0$일 때, 방정식 $f(x)=\lvert x\rvert$의 두 실근 중 더 큰 것을 $\beta$라 하자. $\displaystyle\int_{-\beta}^{\beta}\{f(x)-\lvert x\rvert\}\,dx=0$일 때, $f(x)$를 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: 'x**3 + x/4 + 1/4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $c>0$이면 $x=\beta$에서 $y=x$에 접해 $b=1-3\beta^2$, $c=2\beta^3$, 적분 $=2\beta c-\beta^2=\beta^2(4\beta^2-1)=0$. $c<0$이면 적분이 음수.
    steps:
    - {id: 3a, content: '$\beta=\tfrac12$, $f(x)=x^3+\tfrac14x+\tfrac14$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2', '3.R1']}
    hint_ladder:
    - $f(0)>0$이면 두 근의 부호는? 어느 쪽에서 접해야 근이 $2$개인가?
    - (2-1)처럼 대칭성으로 $\int_{-\beta}^{\beta}f(x)dx$를 구하자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.50~51
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (i) $f(0)>0$인 경우: 그래프의 개형을 보면 조건 (나)에서 두 실근 중 하나는 음수, 하나는 양수이고, $\beta>0$이며 $x=\beta$에서 곡선 $y=f(x)$에 직선 $y=x$가 접해야 한다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $f(\beta)=\beta$, $f'(\beta)=1$이므로 $\beta^3+b\beta+c=\beta$, $3\beta^2+b=1$이다. 따라서 $b=1-3\beta^2$, $c=\beta-\beta^3-b\beta=2\beta^3$이고 $f(x)=x^3+(1-3\beta^2)x+2\beta^3$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        대칭성에 의해 $\displaystyle\int_{-\beta}^{\beta}\{f(x)-\lvert x\rvert\}dx=2\beta f(0)-\beta^2=4\beta^4-\beta^2=\beta^2(4\beta^2-1)=0$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $\beta>0$이므로 $\beta=\dfrac12$이고 $f(x)=x^3+\dfrac14x+\dfrac14$이다.
      criteria: ['3.A2']
    - id: 3b-5
      content: |
        (ii) $f(0)<0$인 경우: 두 실근 중 하나는 음수, 하나는 양수이고 음의 실근에서 직선 $y=-x$가 곡선에 접해야 한다. 이때 그래프에서 $x\le\beta$이면 $f(x)\le\lvert x\rvert$이므로 $\displaystyle\int_{-\beta}^{\beta}\{f(x)-\lvert x\rvert\}dx<0$이 되어 조건을 만족하지 않는다.
        (i), (ii)를 종합하면 $f(x)=x^3+\dfrac14x+\dfrac14$이다.
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        $f(0)>0$일 때 $x=\beta>0$에서 $y=x$에 접해야 함을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $f(\beta)=\beta$, $f'(\beta)=1$에서 $b=1-3\beta^2$, $c=2\beta^3$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        대칭성으로 적분을 $2\beta f(0)-\beta^2$로 바꿨다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 15}
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        $\beta=\tfrac12$, $f(x)=x^3+\tfrac14x+\tfrac14$을 얻었다.
      depends_on: [3.M2, 3.A1]
      steps: [3b-4]
    - id: 3.R1
      mark_type: R
      points: 20
      evidence: |
        $f(0)<0$인 경우 적분이 음수라 불가능함을 근거와 함께 배제했다.
      depends_on: []
      steps: [3b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3046}
  misconceptions:
  - id: MC-CAL-3046
    outcome_code: '71'
    wrong_work: '$f(0)<0$ 경우를 검토하지 않거나, $y=-x$에 접하는 경우도 같은 식으로 풀어 해를 추가함'
    detect_cue: $f(0)<0$ 경우의 배제 근거가 없다
    feedback: 근이 $2$개가 되는 방식은 $f(0)$의 부호에 따라 다릅니다. 두 경우를 모두 따지고 조건에 맞지 않는 쪽을 근거로 배제하세요.
    remedy: [RL-2]

