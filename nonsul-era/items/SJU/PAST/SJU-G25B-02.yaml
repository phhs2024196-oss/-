intent: |
  점대칭 조건으로 삼차함수의 꼴을 정하고, 곡선 $y=f(x)$와 꺾인 직선 $y=\lvert x\rvert$의 교점 개수를 기울기 $f'(0)$에 따라 분류하며, 접하는 경우의 조건과 대칭성으로 정적분 조건을 처리하는 능력을 본다.
key_idea: |
  (가)로 $f(x)=x^3+bx+c$는 점 $(0,c)$에 대해 대칭. 교점이 정확히 $2$개이려면 $y=\lvert x\rvert$의 한 쪽 반직선에 접해야 하고, $c>0$이면 $x=\beta$에서 $y=x$에 접해 $f(x)=x^3+(1-3\beta^2)x+2\beta^3$.
stuck: |
  (2-3)에서 $f(0)>0$, $f(0)<0$을 나누고, $f(0)<0$이면 $[-\beta,\beta]$에서 $f\le\lvert x\rvert$라 적분이 음수가 되어 불가능함을 그래프로 판정하는 단계
idea_tags: [IDEA-CUBIC-POINT-SYMMETRY, IDEA-ROOT-COUNT-TANGENT-BOUNDARY]
tags: [삼차함수, 실근의 개수, 대칭성, 접선]
