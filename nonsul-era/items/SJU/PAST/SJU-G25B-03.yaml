intent: |
  우함수의 대칭성으로 정적분으로 정의된 함수의 관계식 $F(x)+F(-x)=C$를 얻고, 곱의 도함수 부호를 보조함수의 단조성으로 판정해 증가 조건을 구하며, 치환과 대칭으로 곱의 적분을 계산하는 능력을 본다.
key_idea: |
  $F(-x)=C-F(x)$. (3-2)는 $g'$의 부호가 $h(x)=e^{-x^2}-2a^2xF(x)$의 부호와 같고 $h$가 $x>0$에서 감소하므로 $h(1)\ge0$이 필요충분. (3-3)은 $x\to-x$ 치환으로 $\int f(ax)F(x)dx=\tfrac C2\int_{-1}^1f(ax)dx$.
stuck: |
  (3-2)에서 $g'$의 부호를 결정하는 보조함수 $h$를 세우고 그 단조성으로 조건을 끝점 $x=1$ 하나로 줄이는 단계, (3-3)에서 $\int f(ax)F(-x)dx$를 치환해 원래 적분으로 되돌리는 단계
