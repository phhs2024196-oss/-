intent: |
  정적분을 포함한 등식을 미분해 역함수 $f^{-1}$을 결정하고, 역함수의 미분법·역함수 그래프의 대칭을 이용한 정적분, 롤의 정리와 볼록성으로 최댓값의 위치를 특정하는 능력을 본다.
key_idea: |
  (나)를 미분하면 $f^{-1}(x)=2xe^x$. $f$를 직접 구할 수 없으므로 모든 계산을 $f^{-1}$ 쪽으로 옮긴다: $f'(f^{-1}(y))=\dfrac{1}{(f^{-1})'(y)}$, $\displaystyle\int_0^b f=bf(b)-\int_0^{f(b)}f^{-1}$, 최댓값 조건 $f'(\alpha)=\tfrac14$를 $2xe^x=\alpha$, $(1+x)e^x=2$로 바꾼다.
stuck: |
  $f$의 식을 구하지 않고 역함수 쪽에서 계산하는 발상, 그리고 (1-3)에서 두 식 $2xe^x=\alpha$, $(1+x)e^x=2$를 나눠 $x=\dfrac{\alpha}{4-\alpha}$로 $e^x$를 소거하는 것
