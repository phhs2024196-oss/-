intent: |
  피적분함수에 $x$가 섞인 적분 등식을 정리해 두 번 미분하여 함수를 결정하고, 비대칭 차분몫의 극한을 미분계수로 바꾸며, 치환으로 얻은 이차방정식의 근의 위치와 구간별 함수의 경계점을 함께 고려해 교점 개수를 분류하는 능력을 본다.
key_idea: |
  $\displaystyle\int_0^x(2t-x)f(t)dt=\int_0^x2tf(t)dt-x\int_0^xf(t)dt$로 나눠 미분하면 $f^{\prime}(x)=e^x$. $r(x)$는 $x\ne0$에서 $3g^{\prime}(x)$이고 $x=0$에서는 연속 조건 $C=2$ 후 직접 계산해 $5$. 교점은 $x>0$에서 $t=e^x>1$인 $t^2-3t+k=0$의 근, $x\le0$에서는 직선부분과 점 $(0,5)$로 나눠 센다.
stuck: |
  $r(0)$이 존재하려면 분자 $\to0$이어야 한다는 것에서 $C$를 결정하는 것, 그리고 $r(0)=5$라는 고립된 점이 $k=4$에서 교점 하나를 더 만든다는 것
