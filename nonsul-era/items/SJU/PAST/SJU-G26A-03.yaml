stimuli: []

stem: |
  그림과 같이 한 변의 길이가 2인 정삼각형 ABC의 밑변 AB 위의 한 점 D에 대하여, 삼각형 ACD에 내접하는 원을 $S_1$, 삼각형 BCD에 내접하는 원을 $S_2$라 하자. 선분 AD의 길이가 $x$일 때, $S_1$, $S_2$의 반지름의 길이를 각각 $r_1(x)$, $r_2(x)$라 정의하자. 닫힌구간 $[0,\,2]$에서 정의된 연속함수 $f(x)$는 $0<x<2$일 때, $f(x)=r_1(x)+r_2(x)$이다.
  (그림: 정삼각형 ABC에서 꼭짓점 C와 밑변 AB 위의 점 D를 잇는 선분 CD가 있고, 삼각형 ACD 안에 내접원 $S_1$(반지름 $r_1(x)$), 삼각형 BCD 안에 내접원 $S_2$(반지름 $r_2(x)$)가 그려져 있으며, A에서 D까지의 길이가 $x$로 표시됨)

subparts:
- id: '1'
  stem: |
    함수 $f(x)$를 구하시오. 또한 $f$의 치역을 구하시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: 'f = sqrt(3)*(3 - sqrt(x**2 - 2*x + 4))/3; range = [sqrt(3)/3, sqrt(3) - 1]', equivalents: ['sqrt(3)/3 <= y <= sqrt(3)-1'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{CD}}^2=x^2-2x+4$, $r_1=\dfrac{\text{넓이}}{\text{반둘레}}=\dfrac{\sqrt3x}{x+2+\overline{\mathrm{CD}}}$를 유리화, $r_2(x)=r_1(2-x)$.
    steps:
    - {id: 1a, content: '$r_1=\tfrac{\sqrt3(x+2-\sqrt{x^2-2x+4})}{6}$, $f=\tfrac{\sqrt3(3-\sqrt{x^2-2x+4})}{3}$, 최댓값 $f(1)=\sqrt3-1$, 끝값 $\tfrac{\sqrt3}{3}$', criteria: ['1.M1', '1.A1', '1.A2', '1.M2', '1.A3']}
    hint_ladder:
    - 내접원의 반지름은 넓이와 둘레로 표현된다.
    - $\overline{\mathrm{CD}}$는 $x$로 어떻게 나타나는가? $\overline{\mathrm{BD}}=2-x$일 때는?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.17
    steps:
    - id: 1b-1
      content: |
        $\angle\mathrm{CAD}=\dfrac\pi3$이므로 코사인법칙에서 $\overline{\mathrm{CD}}^2=x^2+4-2x$, $\overline{\mathrm{CD}}=\sqrt{x^2-2x+4}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        삼각형 ADC의 넓이는 $\dfrac{\sqrt3x}{2}$이고, 이는 $r_1(x)\cdot\dfrac{x+2+\sqrt{x^2-2x+4}}{2}$와 같다. 따라서
        $$r_1(x)=\dfrac{\sqrt3x}{x+2+\sqrt{x^2-2x+4}}=\dfrac{\sqrt3\left(x+2-\sqrt{x^2-2x+4}\right)}{6}.$$
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\overline{\mathrm{BD}}=2-x$이고 $(2-x)^2-2(2-x)+4=x^2-2x+4$이므로 대칭성에 의해 $r_2(x)=r_1(2-x)=\dfrac{\sqrt3\left(4-x-\sqrt{x^2-2x+4}\right)}{6}$. 그러므로
        $$f(x)=r_1(x)+r_1(2-x)=\dfrac{\sqrt3\left(3-\sqrt{x^2-2x+4}\right)}{3}.$$
      criteria: ['1.A2']
    - id: 1b-4
      content: |
        $f^{\prime}(x)=-\dfrac{\sqrt3}{3}\cdot\dfrac{x-1}{\sqrt{x^2-2x+4}}$이므로 $x<1$에서 $f^{\prime}>0$, $x>1$에서 $f^{\prime}<0$이고 $f(1)=\sqrt3-1$이 최댓값이다.
      criteria: ['1.M2']
    - id: 1b-5
      content: |
        $f$는 $[0,2]$에서 연속이므로 $f(0)=\displaystyle\lim_{x\to0+}f(x)=\dfrac{\sqrt3}{3}$, $f(2)=\displaystyle\lim_{x\to2-}f(x)=\dfrac{\sqrt3}{3}$. 따라서 치역은 $\left\{y\,\middle|\,\dfrac{\sqrt3}{3}\le y\le\sqrt3-1\right\}$이다.
      criteria: ['1.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        코사인법칙으로 $\overline{\mathrm{CD}}=\sqrt{x^2-2x+4}$를 구하고 넓이 = 반지름 × 반둘레 관계를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        $r_1(x)$를 바르게 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 20
      evidence: |
        $r_2(x)=r_1(2-x)$를 써서 $f(x)=\dfrac{\sqrt3\left(3-\sqrt{x^2-2x+4}\right)}{3}$를 얻었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        $f^{\prime}(x)$의 부호로 증감을 조사해 최댓값 $f(1)=\sqrt3-1$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 15
      evidence: |
        끝값 $f(0)=f(2)=\dfrac{\sqrt3}{3}$을 연속성(극한)으로 구하고 치역 $\left[\dfrac{\sqrt3}{3},\sqrt3-1\right]$을 적었다.
      depends_on: [1.M2, 1.A2]
      steps: [1b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3019}
  misconceptions:
  - id: MC-GEO-3019
    outcome_code: '71'
    wrong_work: '$r_1=\dfrac{\text{넓이}}{\text{둘레}}=\dfrac{\sqrt3x}{2(x+2+\overline{\mathrm{CD}})}$로 계산'
    detect_cue: 반지름이 정답의 절반이다(반둘레 대신 둘레 사용)
    feedback: 삼각형의 넓이는 $\dfrac12r(a+b+c)$입니다. 반지름은 넓이를 반둘레로 나눈 값입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $x$좌표가 1인 점 $P$를 지나는 두 직선이 곡선 $y=f(x)$에 점 $Q$와 점 $R$에서 각각 접한다. $Q$의 $x$좌표가 $\dfrac14$이고 $\angle QPR=\theta$일 때, $\sin\theta$의 값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: 'sqrt(19)/10', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=f(2-x)$이므로 $\mathrm{R}$의 $x$좌표는 $\tfrac74$이고 $\angle\mathrm{QPT}=\angle\mathrm{RPT}=\tfrac\theta2$ ($\mathrm{T}(1,0)$). $f^{\prime}(\tfrac14)=\tfrac1{\sqrt{19}}$이므로 $\tan\tfrac\theta2=\sqrt{19}$.
    steps:
    - {id: 2a, content: '$\cos\tfrac\theta2=\tfrac1{\sqrt{20}}$, $\sin\tfrac\theta2=\tfrac{\sqrt{19}}{\sqrt{20}}$, $\sin\theta=\tfrac{\sqrt{19}}{10}$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - 곡선 $y=f(x)$는 어떤 직선에 대해 대칭인가?
    - 접선과 대칭축(수직선)이 이루는 각을 접선의 기울기로 나타내 보자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.17
    steps:
    - id: 2b-1
      content: |
        $f(x)=r_1(x)+r_1(2-x)=f(2-x)$이므로 $y=f(x)$의 그래프는 직선 $x=1$에 대해 대칭이다. 따라서 $\mathrm{P}$를 지나는 두 접선의 접점은 $\mathrm{Q}\left(\tfrac14,f(\tfrac14)\right)$와 $\mathrm{R}\left(\tfrac74,f(\tfrac74)\right)$이고, $\mathrm{T}(1,0)$에 대해 $\angle\mathrm{QPT}=\angle\mathrm{RPT}=\dfrac\theta2$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\mathrm{Q}$에서의 접선의 기울기는 $f^{\prime}\!\left(\tfrac14\right)=-\dfrac{\sqrt3}{3}\cdot\dfrac{-3/4}{\sqrt{57}/4}=\dfrac{1}{\sqrt{19}}$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        접선 $\mathrm{PQ}$와 수직선 $\mathrm{PT}$가 이루는 각이 $\tfrac\theta2$이므로 접선 방향 $(\sqrt{19},1)$과 수직 방향을 비교하면 $\cos\dfrac\theta2=\dfrac{1/\sqrt{19}}{\sqrt{1+\tfrac1{19}}}=\dfrac1{\sqrt{20}}$, $\sin\dfrac\theta2=\dfrac{\sqrt{19}}{\sqrt{20}}$.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $\sin\theta=2\sin\dfrac\theta2\cos\dfrac\theta2=\dfrac{2\sqrt{19}}{20}=\dfrac{\sqrt{19}}{10}$.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $f(x)=f(2-x)$ 대칭으로 $\mathrm{R}$의 $x$좌표가 $\tfrac74$이고 $\angle\mathrm{QPT}=\tfrac\theta2$임을 밝혔다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 20}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $f^{\prime}\!\left(\tfrac14\right)=\dfrac1{\sqrt{19}}$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 20
      evidence: |
        접선과 수직선 사이의 각 $\tfrac\theta2$의 사인·코사인(또는 탄젠트 $\sqrt{19}$)을 기울기로 나타냈다.
      depends_on: [2.A1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        배각 공식으로 $\sin\theta=\dfrac{\sqrt{19}}{10}$을 얻었다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3020}
  misconceptions:
  - id: MC-CAL-3020
    outcome_code: '71'
    wrong_work: '점 $\mathrm{P}$를 곡선 위의 점 $(1,f(1))$로 보고 그 점에서의 접선(기울기 0)을 생각하거나, $\mathrm{P}$의 $y$좌표를 $f(1)=\sqrt3-1$로 둠'
    detect_cue: P의 $y$좌표를 Q에서의 접선과 $x=1$의 교점으로 구하지 않았다
    feedback: P는 곡선 밖의 점입니다. Q에서의 접선을 먼저 구하고, 그 접선이 직선 $x=1$과 만나는 점이 P입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $f$의 치역에 속하는 $t$에 대하여 $g(t)=\displaystyle\int_0^2\lvert f(x)-t\rvert dx$라 하자. 함수 $g(t)$가 $t=\alpha$에서 최솟값을 가질 때, $\alpha$의 값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: 'sqrt(3) - sqrt(39)/6', equivalents: ['sqrt(3)*(6 - sqrt(13))/6'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 대칭으로 $g(t)=2\displaystyle\int_0^1\lvert f(x)-t\rvert dx$이고 $f^{-1}(t)$에서 쪼개 미분하면 $g^{\prime}(t)=2\{2f^{-1}(t)-1\}$. 부호가 $t=f(\tfrac12)$에서 바뀐다.
    steps:
    - {id: 3a, content: '$\alpha=f(\tfrac12)=\tfrac{\sqrt3}{3}\left(3-\tfrac{\sqrt{13}}{2}\right)=\sqrt3-\tfrac{\sqrt{39}}{6}$', criteria: ['3.M1', '3.M2', '3.A1', '3.A2']}
    hint_ladder:
    - $f$의 대칭을 써서 적분 구간을 $[0,1]$로 줄이자.
    - $f(x)=t$인 점 $f^{-1}(t)$를 경계로 절댓값을 풀자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.18
    steps:
    - id: 3b-1
      content: |
        $f$가 $x=1$에 대해 대칭이므로 $g(t)=2\displaystyle\int_0^1\lvert f(x)-t\rvert dx$. $0\le x\le1$에서 $f$는 증가하므로 $\tfrac{\sqrt3}{3}\le t\le\sqrt3-1$에서 $f^{-1}(t)$가 존재한다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $F^{\prime}(x)=f(x)$라 하면
        $$g(t)=2\left(\int_0^{f^{-1}(t)}(t-f(x))dx+\int_{f^{-1}(t)}^1(f(x)-t)dx\right)=2\Big(2tf^{-1}(t)-2F(f^{-1}(t))+F(0)+F(1)-t\Big).$$
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        미분하면 $F^{\prime}(f^{-1}(t))=t$이므로 $(f^{-1})^{\prime}$ 항이 소거되어 $g^{\prime}(t)=2\{2f^{-1}(t)-1\}$이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        $f^{-1}$은 증가함수이므로 $\tfrac{\sqrt3}{3}<t<f(\tfrac12)$이면 $g^{\prime}(t)<0$, $f(\tfrac12)<t<\sqrt3-1$이면 $g^{\prime}(t)>0$이다. 따라서 $g$는 $t=f(\tfrac12)$에서 최솟값을 가지고
        $$\alpha=f\!\left(\tfrac12\right)=\dfrac{\sqrt3}{3}\left(3-\sqrt{\tfrac{13}{4}}\right)=\dfrac{\sqrt3}{6}(6-\sqrt{13})=\sqrt3-\dfrac{\sqrt{39}}{6}.$$
      criteria: ['3.A2']
  - id: S3-ALT1
    audience: ALT
    method_no: 2
    source_flow: 해설교재 p.18 별해 1
    key_idea: 부분적분과 $y=f(x)$의 치환으로 $\displaystyle\int_0^{f^{-1}(t)}(t-f(x))dx=\int_{\sqrt3/3}^tf^{-1}(y)dy$, $\displaystyle\int_{f^{-1}(t)}^1(f(x)-t)dx=(\sqrt3-1)-t-\int_t^{\sqrt3-1}f^{-1}(y)dy$로 바꿔 미분한다.
    steps:
    - id: 3c-1
      content: |
        $g(t)=2\left(\displaystyle\int_{\sqrt3/3}^tf^{-1}(y)dy+(\sqrt3-1)-t-\int_t^{\sqrt3-1}f^{-1}(y)dy\right)$에서 $g^{\prime}(t)=2\{2f^{-1}(t)-1\}$.
      criteria: ['3.M2', '3.A1']
  - id: S3-ALT2
    audience: ALT
    method_no: 3
    source_flow: 해설교재 p.19 별해 2
    key_idea: $a=f^{-1}(t)$ $(0\le a\le1)$를 변수로 $h(a)=2\left(\displaystyle\int_0^a(f(a)-f(x))dx+\int_a^1(f(x)-f(a))dx\right)$로 두면 $h^{\prime}(a)=2f^{\prime}(a)(2a-1)$.
    steps:
    - id: 3d-1
      content: |
        $0<a<1$에서 $f^{\prime}(a)>0$이므로 $h^{\prime}(a)=0\iff a=\dfrac12$이고 부호가 음에서 양으로 바뀐다. 따라서 $\alpha=f(\tfrac12)=\sqrt3-\dfrac{\sqrt{39}}{6}$.
      criteria: ['3.A1', '3.A2']
