intent: |
  코사인법칙과 내접원 반지름 공식으로 두 내접원 반지름의 합을 함수로 나타내 치역을 구하고, 그래프의 대칭으로 두 접선이 이루는 각을 반각으로 계산하며, 절댓값을 포함한 적분의 최솟값을 역함수를 써서 미분으로 찾는 능력을 본다.
key_idea: |
  $\overline{\mathrm{CD}}=\sqrt{x^2-2x+4}$가 $x$와 $2-x$에 대해 같으므로 $f(x)=\dfrac{\sqrt3}{3}\left(3-\sqrt{x^2-2x+4}\right)$는 $x=1$에 대해 대칭. (3-2)는 대칭으로 $\mathrm{R}$의 $x$좌표가 $\tfrac74$, $\angle\mathrm{QPT}=\tfrac\theta2$. (3-3)은 $g^{\prime}(t)=2\{2f^{-1}(t)-1\}$이므로 $t=f(\tfrac12)$에서 최소.
stuck: |
  $f(x)=f(2-x)$ 대칭을 찾아 (3-2)·(3-3)을 절반 구간 문제로 줄이는 것, 그리고 $g(t)$를 $f^{-1}(t)$를 경계로 두 적분으로 나눠 미분하는 것
