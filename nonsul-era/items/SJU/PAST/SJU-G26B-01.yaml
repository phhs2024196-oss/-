stimuli: []

stem: |
  실수 전체의 집합에서 함수 $f(x)$를 다음과 같이 정의하자.
  $$f(x)=\int_{\frac\pi2}^{2\pi}\lvert x-t\rvert\cos\dfrac t2dt$$

subparts:
- id: '1'
  stem: |
    $f(\dfrac\pi2)$의 값을 구하시오. 또한 $x<\dfrac\pi2$일 때, $f'(x)$를 구하시오.
  points: 70
  depends_on: []
  answer: {kind: value, value: 'f0 = -4 - 2*sqrt(2); fp = sqrt(2)', equivalents: ['f(pi/2)=-4-2sqrt2, f''(x)=sqrt2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x\le\tfrac\pi2$이면 $\lvert x-t\rvert=t-x$이므로 부분적분으로 $f(\tfrac\pi2)$, $x$를 밖으로 빼서 $f^{\prime}(x)=-\displaystyle\int_{\pi/2}^{2\pi}\cos\tfrac t2dt$.
    steps:
    - {id: 1a, content: '$f(\tfrac\pi2)=\left[2(t-\tfrac\pi2)\sin\tfrac t2+4\cos\tfrac t2\right]_{\pi/2}^{2\pi}=-4-2\sqrt2$, $f^{\prime}(x)=-[2\sin\tfrac t2]_{\pi/2}^{2\pi}=\sqrt2$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - $x=\tfrac\pi2$이면 적분 구간에서 $x-t$의 부호는?
    - 피적분함수의 $x$는 적분 밖으로 뺄 수 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.20
    steps:
    - id: 1b-1
      content: |
        $x=\dfrac\pi2$이면 $\dfrac\pi2\le t\le2\pi$에서 $\lvert x-t\rvert=t-\dfrac\pi2$이므로 부분적분하면
        $$f\!\left(\tfrac\pi2\right)=\Big[2\left(t-\tfrac\pi2\right)\sin\tfrac t2\Big]_{\pi/2}^{2\pi}-\int_{\pi/2}^{2\pi}2\sin\tfrac t2dt.$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        첫 항은 $0$이고 둘째 항은 $-\Big[-4\cos\tfrac t2\Big]_{\pi/2}^{2\pi}=4\left(\cos\pi-\cos\tfrac\pi4\right)=-4-2\sqrt2$이다. 따라서 $f(\tfrac\pi2)=-4-2\sqrt2$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $x<\dfrac\pi2$이면 $f(x)=\displaystyle\int_{\pi/2}^{2\pi}(t-x)\cos\tfrac t2dt=\int_{\pi/2}^{2\pi}t\cos\tfrac t2dt-x\int_{\pi/2}^{2\pi}\cos\tfrac t2dt$이므로
        $$f^{\prime}(x)=-\int_{\pi/2}^{2\pi}\cos\tfrac t2dt=-\Big[2\sin\tfrac t2\Big]_{\pi/2}^{2\pi}=\sqrt2.$$
      criteria: ['1.M2', '1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $\lvert x-t\rvert=t-\tfrac\pi2$로 풀고 부분적분을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        $f(\tfrac\pi2)=-4-2\sqrt2$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 20
      evidence: |
        $x<\tfrac\pi2$에서 $x$를 적분 밖으로 빼 $f(x)$를 $x$의 일차식 꼴로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $f^{\prime}(x)=\sqrt2$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3022}
  misconceptions:
  - id: MC-CAL-3022
    outcome_code: '71'
    wrong_work: '$x<\tfrac\pi2$에서 $\lvert x-t\rvert=x-t$로 풀어 $f^{\prime}(x)=-\sqrt2$'
    detect_cue: $f^{\prime}(x)$의 부호가 반대이다
    feedback: 적분변수 $t$는 $\tfrac\pi2$ 이상이고 $x<\tfrac\pi2$이므로 $x-t<0$, $\lvert x-t\rvert=t-x$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    함수 $f(x)$가 $x=\alpha$에서 최댓값을 가질 때, $\cos\dfrac\alpha2$의 값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '-sqrt(14)/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f^{\prime}(x)=\sqrt2$ $(x<\tfrac\pi2)$, $4\sin\tfrac x2-\sqrt2$ $(\tfrac\pi2\le x\le2\pi)$, $-\sqrt2$ $(x>2\pi)$. 부호가 $+$에서 $-$로 바뀌는 점은 $\sin\tfrac\alpha2=\tfrac{\sqrt2}{4}$, $\pi<\alpha<2\pi$.
    steps:
    - {id: 2a, content: '$\cos\tfrac\alpha2=-\sqrt{1-\tfrac18}=-\tfrac{\sqrt{14}}{4}$', criteria: ['2.M1', '2.A1', '2.R1', '2.A2']}
    hint_ladder:
    - $\tfrac\pi2\le x\le2\pi$에서는 적분을 $x$에서 둘로 나누자.
    - $\sin\tfrac\alpha2=\tfrac{\sqrt2}{4}$인 $\tfrac\alpha2$는 어느 범위에 있는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.20~21
    steps:
    - id: 2b-1
      content: |
        (1)에서 $x<\tfrac\pi2$이면 $f^{\prime}(x)=\sqrt2$. $x>2\pi$이면 $f(x)=x\displaystyle\int_{\pi/2}^{2\pi}\cos\tfrac t2dt-\int_{\pi/2}^{2\pi}t\cos\tfrac t2dt$이므로 $f^{\prime}(x)=\Big[2\sin\tfrac t2\Big]_{\pi/2}^{2\pi}=-\sqrt2$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\tfrac\pi2\le x\le2\pi$이면
        $$f(x)=x\int_{\pi/2}^{x}\cos\tfrac t2dt-\int_{\pi/2}^{x}t\cos\tfrac t2dt+\int_x^{2\pi}t\cos\tfrac t2dt-x\int_x^{2\pi}\cos\tfrac t2dt$$
        이므로 $x\cos\tfrac x2$ 항들이 소거되어
        $$f^{\prime}(x)=\int_{\pi/2}^{x}\cos\tfrac t2dt-\int_x^{2\pi}\cos\tfrac t2dt=4\sin\tfrac x2-\sqrt2.$$
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        따라서 $f^{\prime}(x)$는 $\sin\tfrac\alpha2=\tfrac{\sqrt2}{4}$인 $\alpha$에 대하여 $x<\alpha$에서 양수, $x>\alpha$에서 음수이므로 $f$는 $x=\alpha$에서 최댓값을 가진다. ($\tfrac\pi2\le x\le\pi$에서는 $\sin\tfrac x2\ge\tfrac{\sqrt2}{2}>\tfrac{\sqrt2}{4}$이므로 $\pi<\alpha<2\pi$.)
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        $\tfrac\pi2<\tfrac\alpha2<\pi$이므로 $\cos\tfrac\alpha2<0$이고 $\cos\dfrac\alpha2=-\sqrt{1-\dfrac{2}{16}}=-\dfrac{\sqrt{14}}{4}$.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $x$의 범위를 나눠 절댓값을 풀고 각 범위에서 $f^{\prime}(x)$를 구하려 했다($x>2\pi$에서 $-\sqrt2$ 포함).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 20}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 25
      evidence: |
        $\tfrac\pi2\le x\le2\pi$에서 $f^{\prime}(x)=4\sin\tfrac x2-\sqrt2$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 15
      evidence: |
        $f^{\prime}$의 부호 변화로 $x=\alpha$($\sin\tfrac\alpha2=\tfrac{\sqrt2}{4}$)에서 최대임을 밝혔다.
      depends_on: [2.A1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        $\pi<\alpha<2\pi$에서 $\cos\tfrac\alpha2=-\dfrac{\sqrt{14}}{4}$를 얻었다.
      depends_on: [2.M1, 2.R1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-3023}
  misconceptions:
  - id: MC-ALG-3023
    outcome_code: '71'
    wrong_work: '$\cos\tfrac\alpha2=\dfrac{\sqrt{14}}{4}$ (양수)로 답함'
    detect_cue: $\tfrac\alpha2$의 범위를 확인하지 않았다
    feedback: $\tfrac\pi2\le x\le\pi$에서는 $4\sin\tfrac x2-\sqrt2>0$이므로 $\alpha>\pi$, 즉 $\tfrac\alpha2$는 제2사분면 각이고 코사인은 음수입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    곡선 $y=f(x)-f(\dfrac\pi2)$와 직선 $y=\sqrt2x+k$가 만나는 점의 개수가 1이 되도록 하는 실수 $k$의 값을 모두 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: set, value: '{(8 - 5*pi/2)*sqrt(2)} U (-oo, -sqrt(2)*pi/2)', equivalents: ['k=(8-5pi/2)sqrt2 or k<-sqrt2*pi/2'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $x\le\tfrac\pi2$에서 곡선은 $y=\sqrt2(x-\tfrac\pi2)$이므로 직선과 평행. 교점 1개는 직선이 그보다 아래($k<-\tfrac{\sqrt2}{2}\pi$)이거나 $x=\beta$에서 접할 때($4\sin\tfrac\beta2-\sqrt2=\sqrt2$, $\beta=\tfrac32\pi$).
    steps:
    - {id: 3a, content: '$f(\tfrac32\pi)-f(\tfrac\pi2)=\int_{\pi/2}^{3\pi/2}(4\sin\tfrac t2-\sqrt2)dt=8\sqrt2-\sqrt2\pi$, $k=8\sqrt2-\sqrt2\pi-\tfrac{3\sqrt2}{2}\pi=(8-\tfrac52\pi)\sqrt2$', criteria: ['3.M1', '3.R1', '3.M2', '3.A1']}
    hint_ladder:
    - $x<\tfrac\pi2$에서 곡선의 모양은? 직선의 기울기와 비교해 보자.
    - 기울기가 $\sqrt2$인 접선의 접점을 찾자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.21~22
    steps:
    - id: 3b-1
      content: |
        $\tfrac\pi2<x<2\pi$에서 $f^{\prime\prime}(x)=2\cos\tfrac x2$이므로 $x=\pi$가 변곡점이다. 증감·볼록을 정리하면 $f$는 $x<\tfrac\pi2$에서 기울기 $\sqrt2$인 직선, $\tfrac\pi2<x<\pi$에서 증가하며 아래로 볼록, $\pi<x<\alpha$에서 증가하며 위로 볼록, $x=\alpha$에서 극대(최대), 이후 감소하고 $x>2\pi$에서 기울기 $-\sqrt2$인 직선이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        곡선 $y=f(x)-f(\tfrac\pi2)$는 점 $(\tfrac\pi2,0)$을 지나고 그 왼쪽은 직선 $y=\sqrt2(x-\tfrac\pi2)$이다. 따라서 직선 $y=\sqrt2x+k$와 교점이 1개이려면 직선이 곡선에 접하거나, 기울기가 $\sqrt2$이고 점 $(\tfrac\pi2,0)$을 지나는 직선보다 $y$절편이 작아야 한다. ($k=-\tfrac{\sqrt2}{2}\pi$이면 $x\le\tfrac\pi2$에서 겹쳐 교점이 무수히 많다.)
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        접점의 $x$좌표를 $\beta$라 하면 $4\sin\tfrac\beta2-\sqrt2=\sqrt2$이고 $\tfrac\pi2<\beta<2\pi$에서 $\sin\tfrac\beta2=\tfrac{\sqrt2}{2}$, $\beta=\tfrac32\pi$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $f(\tfrac32\pi)-f(\tfrac12\pi)=\displaystyle\int_{\pi/2}^{3\pi/2}\left(4\sin\tfrac t2-\sqrt2\right)dt=\Big[-8\cos\tfrac t2-\sqrt2t\Big]_{\pi/2}^{3\pi/2}=8\sqrt2-\sqrt2\pi$이므로 직선이 점 $\left(\tfrac32\pi,\,8\sqrt2-\sqrt2\pi\right)$을 지날 때 $k=\left(8-\tfrac52\pi\right)\sqrt2$.
        또 직선이 $(\tfrac\pi2,0)$을 지나면 $k=-\tfrac{\sqrt2}{2}\pi$이므로 답은 $k=\left(8-\dfrac52\pi\right)\sqrt2$ 또는 $k<-\dfrac{\sqrt2}{2}\pi$.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        $f^{\prime}$, $f^{\prime\prime}$로 증감·볼록을 조사해 곡선의 개형(왼쪽 직선부분 포함)을 그렸다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 15}
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 20
      evidence: |
        교점이 1개인 경우를 "접할 때" 또는 "$(\tfrac\pi2,0)$을 지나는 평행선보다 아래"로 나누고, $k=-\tfrac{\sqrt2}{2}\pi$가 제외됨을 근거와 함께 적었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        접점 조건 $f^{\prime}(\beta)=\sqrt2$에서 $\beta=\tfrac32\pi$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
