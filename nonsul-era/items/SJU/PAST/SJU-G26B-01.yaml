# 세종대 2026학년도 논술고사(자연계열B) 문제 1 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# [판독확인] 원문 피적분함수의 cos 가 이탤릭 'cos'(로만체 아님)로 인쇄됨 — \cos 로 옮김. 문두의 'f(x)'도 수식체가 아닌 본문 글꼴.
