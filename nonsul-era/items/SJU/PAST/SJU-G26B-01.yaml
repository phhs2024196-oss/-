  절댓값을 포함한 정적분으로 정의된 함수를 $x$의 위치에 따라 나눠 미분하고, 삼각함수 값의 사분면 판단으로 최댓점을 구하며, 증감·오목볼록을 이용해 기울기가 정해진 직선과 곡선의 교점 개수를 분류하는 능력을 본다.
key_idea: |
  $x<\tfrac\pi2$에서는 $f^{\prime}=\sqrt2$, $x>2\pi$에서는 $f^{\prime}=-\sqrt2$, 사이에서는 $f^{\prime}(x)=4\sin\tfrac x2-\sqrt2$. 직선 기울기 $\sqrt2$는 왼쪽 직선부분과 평행하므로, 교점 1개는 접할 때($f^{\prime}=\sqrt2$, $x=\tfrac32\pi$) 또는 직선이 왼쪽 직선부분보다 아래일 때.
stuck: |
  $\tfrac\pi2\le x\le2\pi$에서 적분을 $x$에서 쪼개 미분하는 계산, 그리고 $k=-\tfrac{\sqrt2}{2}\pi$에서 직선이 곡선의 직선부분과 겹쳐 교점이 무수히 많아진다는 점
