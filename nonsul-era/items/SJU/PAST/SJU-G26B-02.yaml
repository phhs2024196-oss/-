# [해설 보완] 원 해설은 "(나)·(다)를 만족하면 x=α>0 에서 극소"를 그림으로만 보임. α=0(x>0 에서 f 증가)인 경우는 (다)와 함께 불가능함(f'(0)=c>0 이면 f'=0 의 두 근이 모두 양수가 되어 극값 3개)을 B 해설 2b-1 에 한 줄로 보탬.
