intent: |
  베타적분 꼴 정적분을 이항정리로 묶어 계산하고, 부분적분으로 이웃 항의 비 $\dfrac{a_n}{a_{n+1}}$을 구해 수열의 증감과 최솟값의 위치를 판정한 뒤, 비의 곱(망원곱)으로 특정 항의 값을 구하는 능력을 본다.
key_idea: |
  $\dfrac{a_n}{2^n}=\displaystyle\int_0^1x^n(1-x)^{102-n}dx$이므로 (3-1)의 계수 $1,3,3,1$은 $\{(1-x)+x\}^3=1$로 묶인다. 부분적분으로 $\dfrac{a_n}{a_{n+1}}=\dfrac{102-n}{2(n+1)}$이고, 이 비가 $1$ 이상인 것은 $n\le33$이므로 $m=34$.
stuck: |
  (3-1)에서 $x^{98}(1-x)$를 공통인수로 꺼내 이항전개를 알아보는 것, (3-3)에서 $a_{34}$를 $a_{101}$(또는 $a_1$)부터 비를 곱해 나가 $_{102}\mathrm{C}_{34}$와 상쇄시키는 것
