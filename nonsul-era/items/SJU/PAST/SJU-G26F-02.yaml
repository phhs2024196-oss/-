intent: |
  무리함수의 도함수와 극한으로 치역을 구하고 역함수를 식으로 구한 뒤, 합성함수 $g\circ f\circ g^{-1}$의 영점·극값·치역을 도함수의 부호(감소함수 두 개의 합성)와 극한으로 분석하는 능력을 본다.
key_idea: |
  $g$와 $g^{-1}$은 모두 감소함수이므로 $h^{\prime}(x)=g^{\prime}(\cdot)\,f^{\prime}(g^{-1}(x))\,(g^{-1})^{\prime}(x)$의 부호는 $f^{\prime}(g^{-1}(x))$의 부호와 같다. $f^{\prime}(x)=(x+1)(2x-1)(x-1)e^{2x}$의 근 $-1,\tfrac12,1$을 $g$로 옮기면 $h$의 임계점 $g(1)<g(\tfrac12)<g(-1)$.
stuck: |
  $x$가 증가할 때 $g^{-1}(x)$는 감소한다는 점(증감 순서가 뒤집힘), 그리고 $x\to-1+$, $x\to1-$에서의 극한을 $f$의 $\pm\infty$ 극한으로 바꾸는 것
idea_tags: [IDEA-COMPOSITE-SIGN-TWO-DECREASING, IDEA-CONJUGATE-INVERSE-EXTREMA]
tags: [역함수, 합성함수, 극값, 치역]
