stimuli: []

stem: |
  실수 전체의 집합에서 정의된 두 함수 $f(x)=x(x-1)^2e^{2x}$과 $g(x)=-\dfrac{x}{\sqrt{1+x^2}}$가 있다.

subparts:
- id: '1'
  stem: |
    $g'(x)$를 구하시오. 또한 $g$의 치역을 구하시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: 'gp = -1/(1 + x**2)**(3/2); range = (-1, 1)', equivalents: ['-1<y<1'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 몫의 미분으로 $g^{\prime}(x)=-\dfrac{1}{(1+x^2)^{3/2}}<0$, $x\to\pm\infty$의 극한은 $\mp1$이고 감소·연속이므로 치역 $(-1,1)$.
    steps:
    - {id: 1a, content: '$g^{\prime}(x)=-\tfrac{\sqrt{1+x^2}-x^2/\sqrt{1+x^2}}{1+x^2}=-\tfrac{1}{(1+x^2)^{3/2}}$, $\lim_{x\to\infty}g=-1$, $\lim_{x\to-\infty}g=1$', criteria: ['1.M1', '1.A1', '1.R1', '1.A2']}
    hint_ladder:
    - 분모의 $\sqrt{1+x^2}$를 미분하면?
    - $x\to-\infty$일 때 $\sqrt{x^2}=-x$임에 주의하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.32
    steps:
    - id: 1b-1
      content: |
        몫의 미분법으로
        $$g^{\prime}(x)=-\dfrac{\sqrt{1+x^2}-x\cdot\dfrac{x}{\sqrt{1+x^2}}}{1+x^2}=-\dfrac{1}{(1+x^2)^{3/2}}.$$
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        $g^{\prime}(x)<0$이므로 $g$는 감소함수이다.
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        $\displaystyle\lim_{x\to\infty}g(x)=\lim_{x\to\infty}\dfrac{-1}{\sqrt{\tfrac1{x^2}+1}}=-1$, $\displaystyle\lim_{x\to-\infty}g(x)=\lim_{x\to-\infty}\dfrac{1}{\sqrt{\tfrac1{x^2}+1}}=1$이고 $g$는 연속인 감소함수이므로 치역은 $\{y\mid-1<y<1\}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        몫의 미분법(또는 곱·합성함수 미분)을 적용했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $g^{\prime}(x)=-\dfrac{1}{(1+x^2)^{3/2}}$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 15
      evidence: |
        $g^{\prime}<0$에서 $g$가 감소함수임을 밝혔다.
      depends_on: [1.A1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 25
      evidence: |
        $x\to\pm\infty$의 극한 $\mp1$을 구하고 치역 $(-1,1)$(양 끝 제외)을 적었다.
      depends_on: [1.M1, 1.R1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3010}
  misconceptions:
  - id: MC-CAL-3010
    outcome_code: '71'
    wrong_work: '치역을 $[-1,1]$로 쓰거나 $x\to-\infty$의 극한을 $-1$로 계산'
    detect_cue: 극한값(점근선의 값)을 치역에 포함했거나 $\sqrt{x^2}=\lvert x\rvert$의 부호를 놓쳤다
    feedback: 극한값 $\pm1$은 어떤 실수 $x$에서도 실제로 도달하지 않습니다. 또 $x<0$이면 $\sqrt{x^2}=-x$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $g(x)$의 역함수 $g^{-1}(x)$를 구하시오. 또한 $h(x)=(g\circ f\circ g^{-1})(x)$라 할 때, 방정식 $h(x)=0$의 해를 모두 구하시오.
  points: 120
  depends_on: ['1']
  answer: {kind: expression, value: 'ginv = -x/sqrt(1 - x**2); roots = {0, -sqrt(2)/2}', equivalents: ['g^{-1}(x)=-x/sqrt(1-x^2) (-1<x<1); x=0, -sqrt(2)/2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $y^2=\dfrac{x^2}{1+x^2}$에서 $x^2=\dfrac{y^2}{1-y^2}$, 부호가 반대이므로 $x=-\dfrac{y}{\sqrt{1-y^2}}$. $g(0)=0$이고 일대일이므로 $h=0\iff f(g^{-1}(x))=0\iff g^{-1}(x)\in\{0,1\}$.
    steps:
    - {id: 2a, content: '$g^{-1}(x)=-\tfrac{x}{\sqrt{1-x^2}}$ $(-1<x<1)$, $x=g(0)=0$ 또는 $x=g(1)=-\tfrac{\sqrt2}{2}$', criteria: ['2.M1', '2.A1', '2.A2', '2.M2', '2.A3']}
    hint_ladder:
    - $y=g(x)$를 $x$에 대해 풀 때 제곱하면 부호 정보가 사라진다. 무엇으로 되살릴까?
    - $g(t)=0$인 $t$는 $0$뿐이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.32
    steps:
    - id: 2b-1
      content: |
        $y=-\dfrac{x}{\sqrt{1+x^2}}$의 양변을 제곱하면 $y^2=\dfrac{x^2}{1+x^2}$이고 $x^2=\dfrac{y^2}{1-y^2}$이다. $-1<y<1$이므로 $x=\pm\dfrac{y}{\sqrt{1-y^2}}$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $x\ne0$일 때 $x$와 $y$는 서로 다른 부호이므로 $x=-\dfrac{y}{\sqrt{1-y^2}}$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $x$와 $y$를 바꾸면 $g^{-1}(x)=-\dfrac{x}{\sqrt{1-x^2}}$ $(-1<x<1)$이다.
      criteria: ['2.A2']
    - id: 2b-4
      content: |
        $g$는 감소함수이므로 일대일함수이고 $g(0)=0$이므로, $h(x)=0$이면 $(f\circ g^{-1})(x)=0$이다. $f(g^{-1}(x))=g^{-1}(x)\{g^{-1}(x)-1\}^2e^{2g^{-1}(x)}=0$을 풀면 $g^{-1}(x)=0$ 또는 $1$.
      criteria: ['2.M2']
    - id: 2b-5
      content: |
        따라서 $x=g(0)=0$ 또는 $x=g(1)=-\dfrac{\sqrt2}{2}$.
      criteria: ['2.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $y=g(x)$를 $x$에 대해 풀기 위해 제곱해 $x^2=\dfrac{y^2}{1-y^2}$을 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 20}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $x$와 $y$의 부호가 반대임을 근거로 음의 부호를 택했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        $g^{-1}(x)=-\dfrac{x}{\sqrt{1-x^2}}$와 정의역 $-1<x<1$을 적었다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    - id: 2.M2
      mark_type: M
      points: 30
      evidence: |
        $g$가 일대일이고 $g(0)=0$임을 써서 $h(x)=0\iff f(g^{-1}(x))=0$으로 바꾸고 $g^{-1}(x)=0,\,1$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-4]
    - id: 2.A3
      mark_type: A
      points: 30
      evidence: |
        $x=0$, $x=-\dfrac{\sqrt2}{2}$를 모두 구했다.
      depends_on: [2.M2]
      steps: [2b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3011}
  misconceptions:
  - id: MC-CAL-3011
    outcome_code: '71'
    wrong_work: '$g^{-1}(x)=\dfrac{x}{\sqrt{1-x^2}}$(부호 반대)로 두어 해를 $x=0,\ \dfrac{\sqrt2}{2}$로 답함'
    detect_cue: 제곱 후 $\pm$ 중 부호를 고르는 근거가 없다
    feedback: 제곱하면 부호 정보가 사라집니다. 원래 식에서 $x$와 $g(x)$는 부호가 반대이므로 음의 부호를 택해야 합니다. $g^{-1}(-\tfrac{\sqrt2}{2})=1$로 확인해 보세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    (2-2)에서 정의된 함수 $h(x)$의 극댓값과 극솟값을 각각 구하시오. 또한 $h$의 치역을 구하시오.
    (단, $\displaystyle\lim_{x\to-\infty}f(x)=0$)
  points: 150
  depends_on: ['2']
  answer: {kind: expression, value: 'max = {0, 4/sqrt(exp(4) + 16)}; min = -E/sqrt(E**2 + 64); range = (-1, 4/sqrt(exp(4) + 16)]', equivalents: ['극댓값 0, 4/sqrt(e^4+16); 극솟값 -e/sqrt(e^2+64); -1<y<=4/sqrt(e^4+16)'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h^{\prime}$의 부호 = $f^{\prime}(g^{-1}(x))$의 부호. $x$가 커지면 $g^{-1}(x)$는 작아지므로 $f$의 증감표를 뒤집어 읽는다. 극값은 $g(f(1))$, $g(f(\tfrac12))$, $g(f(-1))$.
    steps:
    - {id: 3a, content: '극댓값 $g(0)=0$, $g(-\tfrac4{e^2})=\tfrac4{\sqrt{e^4+16}}$; 극솟값 $g(\tfrac e8)=-\tfrac e{\sqrt{e^2+64}}$; $\lim_{x\to-1+}h=-1$, $\lim_{x\to1-}h=0$ ⇒ 치역 $(-1,\tfrac4{\sqrt{e^4+16}}]$', criteria: ['3.M1', '3.A1', '3.A2', '3.A3', '3.M2', '3.A4']}
    hint_ladder:
    - $g^{\prime}<0$, $(g^{-1})^{\prime}<0$이면 $h^{\prime}$의 부호는 무엇과 같은가?
    - $x\to-1+$이면 $g^{-1}(x)\to?$
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.33~34
    steps:
    - id: 3b-1
      content: |
        $h^{\prime}(x)=g^{\prime}\big((f\circ g^{-1})(x)\big)\times f^{\prime}(g^{-1}(x))\times(g^{-1})^{\prime}(x)$이고 $g^{\prime}<0$, $(g^{-1})^{\prime}(x)=-\dfrac{1}{(1-x^2)^{3/2}}<0$이므로 $h^{\prime}(x)$와 $f^{\prime}(g^{-1}(x))$는 부호가 같고, $h^{\prime}(x)=0\iff f^{\prime}(g^{-1}(x))=0$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $f^{\prime}(x)=(x+1)(2x-1)(x-1)e^{2x}$이므로 $h^{\prime}(x)=0$이면 $g^{-1}(x)=-1,\ \tfrac12,\ 1$, 즉 $x=g(-1),\ g(\tfrac12),\ g(1)$이다. $f^{\prime}>0\iff x>1$ 또는 $-1<x<\tfrac12$이므로 $f^{\prime}(g^{-1}(x))>0\iff g^{-1}(x)>1$ 또는 $-1<g^{-1}(x)<\tfrac12$이고, $g$가 감소함수여서 $g(1)<g(\tfrac12)<g(-1)$이므로 이는 $x<g(1)$ 또는 $g(\tfrac12)<x<g(-1)$과 같다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        증감표: $x<g(1)=-\tfrac{\sqrt2}{2}$에서 증가, $x=g(1)$에서 극대, $g(1)<x<g(\tfrac12)=-\tfrac{\sqrt5}{5}$에서 감소, $x=g(\tfrac12)$에서 극소, $g(\tfrac12)<x<g(-1)=\tfrac{\sqrt2}{2}$에서 증가, $x=g(-1)$에서 극대, 그 뒤 감소.
      criteria: ['3.A2']
    - id: 3b-4
      content: |
        $h(g(1))=g(f(1))=g(0)=0$, $h(g(-1))=g(f(-1))=g\!\left(-\tfrac4{e^2}\right)=\dfrac{4e^{-2}}{\sqrt{1+16e^{-4}}}=\dfrac{4}{\sqrt{e^4+16}}$,
        $h(g(\tfrac12))=g(f(\tfrac12))=g\!\left(\tfrac e8\right)=-\dfrac{e/8}{\sqrt{1+e^2/64}}=-\dfrac{e}{\sqrt{e^2+64}}$.
      criteria: ['3.A3']
    - id: 3b-5
      content: |
        $\displaystyle\lim_{x\to1-}h(x)=\lim_{x\to-\infty}g(f(x))=\lim_{x\to0}g(x)=0$, $\displaystyle\lim_{x\to-1+}h(x)=\lim_{x\to\infty}g(f(x))=\lim_{x\to\infty}g(x)=-1$.
      criteria: ['3.M2']
    - id: 3b-6
      content: |
        따라서 극댓값은 $0$과 $\dfrac{4}{\sqrt{e^4+16}}$, 극솟값은 $-\dfrac{e}{\sqrt{e^2+64}}$이고, $h$의 치역은 $\left\{y\,\middle|\,-1<y\le\dfrac{4}{\sqrt{e^4+16}}\right\}$이다.
      criteria: ['3.A4']
  - id: S3-ALT
    audience: ALT
    method_no: 2
    source_flow: 해설교재 p.34 별해
    key_idea: $g^{-1}$의 치역은 실수 전체이므로 $f\circ g^{-1}$의 치역은 $f$의 치역 $\left[-\tfrac4{e^2},\infty\right)$이고, 감소함수 $g$를 씌우면 $h$의 치역은 $\left(-1,\,g(-\tfrac4{e^2})\right]$. 극값은 $f$의 극값 $f(-1)$, $f(\tfrac12)$, $f(1)$에 $g$를 씌운 값(극대·극소가 뒤바뀜).
    steps:
    - id: 3c-1
      content: |
