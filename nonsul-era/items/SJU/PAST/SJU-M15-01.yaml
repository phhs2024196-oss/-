stimuli:
- label: 제시문
  body: |
    그림과 같이 속이 꽉 찬 어떤 물체에 실을 매달아 물이 가득 찬 용기 위에 위치를 잡고, 시각 $t$에 대해 $2t\,\mathrm{cm}/$초의 속력으로 용기의 수면과 수직인 방향으로 물체를 아래로 움직인다.
    $t=0$일 때 물체의 아랫부분과 수면 사이의 최단 거리가 $1\,\mathrm{cm}$이고, 물체의 높이는 $8\,\mathrm{cm}$이며, 물체가 수면에 닿기 시작한 시각 $t=a$부터 완전히 물에 잠긴 시각 $t=b$까지 용기로부터 넘쳐흐른 물의 부피는
    $$V(t)=-(5t^2-16t-4)(t-1)^4\,\mathrm{cm}^3\quad(a\le t\le b)$$
    로 주어진다.
    (단, 시각의 단위는 초이며, 물체는 처음 실에 매달린 형태 그대로 수면과 수직인 방향으로만 움직인다고 가정한다.)
    (그림: 왼쪽은 실에 매달린 불규칙한 모양의 물체(높이 $8\,\mathrm{cm}$)가 물이 가득 찬 용기 수면 위 $1\,\mathrm{cm}$에 있고 아래 방향 화살표에 $2t\,\mathrm{cm}/$초가 표시됨. 오른쪽은 물체의 아랫부분이 수면 아래 $h(t)\,\mathrm{cm}$까지 잠긴 모습.)

stem: |
  아래 글을 읽고, 각 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    물체가 수면에 닿는 시각 $t=a$를 구하고, 물체가 수면에 잠긴 깊이를 시각 $t$에 관한 함수 $h(t)$ $(a\le t\le b)$로 나타내시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'a = 1; h(t) = t**2 - 1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 이동 거리는 속력의 적분 $\int_0^t2s\,ds=t^2$.
    steps:
    - {id: 1a, content: '$a^2=1\Rightarrow a=1$, $b^2=9\Rightarrow b=3$, $h(t)=\int_1^t2s\,ds=t^2-1$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 속력이 시간에 따라 변하므로 이동 거리는 어떻게 구하는가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.202
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        속력이 $2t$이고 물체와 수면 사이의 거리가 $1$이므로 $0\le t\le a$ 동안 움직인 거리는 $\displaystyle\int_0^a\lvert2t\rvert dt=a^2=1$이다. 따라서 $a=1$이다.
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        물체가 완전히 잠길 때까지 움직인 거리는 $1+8=9$이므로 $\displaystyle\int_0^b\lvert2t\rvert dt=b^2=9$, $b=3$이다.
        그러므로 잠긴 깊이는 $h(t)=\displaystyle\int_1^t2s\,ds=t^2-1$ $(1\le t\le3)$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        이동 거리를 속력의 정적분 $\int_0^a2t\,dt$로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $a=1$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $h(t)=t^2-1$($1\le t\le3$)을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '79', meaning: '이동 거리를 속력×시간 $2t\cdot t$로 두어 $a=\tfrac{1}{\sqrt2}$ 등으로 답함'}
  misconceptions: []

- id: '2'
  stem: |
    물체가 용기에 잠길 때 넘쳐흐른 물의 부피를 이용하면, 수면과 평행한 방향으로 물체를 자를 때 생기는 단면의 넓이를 구할 수 있음을 설명하고, 시각이 $t$일 때 수면과 같은 위치에 있는 물체의 단면의 넓이를 시각 $t$에 관한 함수 $S(t)$로 나타내시오.
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'S(t) = -15*(t - 3)*(t - 1)**3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $V(t)=\int_0^{h(t)}A(x)dx$를 미분하면 $V^{\prime}(t)=A(h(t))h^{\prime}(t)=S(t)\cdot2t$.
    steps:
    - {id: 2a, content: '$V^{\prime}(t)=-30t(t-3)(t-1)^3$, $S(t)=\tfrac{V^{\prime}(t)}{2t}=-15(t-3)(t-1)^3$', criteria: ['2.R1', '2.M1', '2.A1']}
    hint_ladder:
    - 넘친 물의 부피는 잠긴 부분의 부피와 같다. 잠긴 부분의 부피를 단면 넓이의 적분으로 써 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.202
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        넘쳐흐른 물의 부피는 물에 잠긴 물체의 부피와 같다. 물체의 아랫부분에서 높이 $x$인 곳의 (수면과 평행한) 단면의 넓이를 $A(x)$라 하면, 시각 $t$에 수면 위치의 단면은 높이 $x=h(t)$이므로 $S(t)=A(h(t))$이다.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        잠긴 부분의 부피는 단면의 넓이를 적분해 $V(t)=\displaystyle\int_0^{h(t)}A(x)dx=F(h(t))-F(0)$ ($F^{\prime}(x)=A(x)$)이므로, 합성함수의 미분법으로 $V^{\prime}(t)=A(h(t))h^{\prime}(t)$이다. 즉 $V$를 알면 단면의 넓이를 구할 수 있다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $V^{\prime}(t)=-(10t-16)(t-1)^4-4(5t^2-16t-4)(t-1)^3=-30t(t-3)(t-1)^3$이고 $h^{\prime}(t)=2t$이므로
        $S(t)=-15(t-3)(t-1)^3$ $(1\le t\le3)$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        넘친 물의 부피 = 잠긴 부분의 부피이고 $S(t)=A(h(t))$임을 설명했다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $V(t)=\int_0^{h(t)}A(x)dx$를 미분해 $V^{\prime}(t)=A(h(t))h^{\prime}(t)$를 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 3}
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $S(t)=-15(t-3)(t-1)^3$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3187}
  misconceptions:
  - id: MC-CAL-3187
    outcome_code: '71'
    wrong_work: '$S(t)=V^{\prime}(t)=-30t(t-3)(t-1)^3$'
    detect_cue: $h^{\prime}(t)=2t$로 나누지 않았다
    feedback: $V$는 깊이 $h$의 함수이고 $h$가 시각 $t$의 함수입니다. $V^{\prime}(t)=S(t)\,h^{\prime}(t)$이므로 $h^{\prime}(t)$로 나누어야 합니다.
    remedy: [RL-1]

- id: '3'
  stem: |
    $S(t)$가 최대가 되는 시각 $t$를 구하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '5/2', equivalents: ['2.5'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $S^{\prime}(t)=-15(t-1)^2(4t-10)$의 부호가 $t=\tfrac52$에서 $+\to-$.
    steps:
    - {id: 3a, content: '$S^{\prime}(t)=-15(t-1)^2(4t-10)$, $t=\tfrac52$에서 최대', criteria: ['3.M1', '3.A1', '3.R1']}
    hint_ladder:
    - $S(t)$를 미분해 인수분해해 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.203
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $S(t)=-15(t-3)(t-1)^3$ $(1\le t\le3)$에서 $S^{\prime}(t)=-15(t-1)^3-45(t-3)(t-1)^2=-15(t-1)^2(4t-10)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $1<t<\dfrac52$에서 $S^{\prime}(t)>0$, $\dfrac52<t\le3$에서 $S^{\prime}(t)<0$이다(증감표).
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        따라서 $S(t)$는 $t=\dfrac52$에서 최댓값을 갖는다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $S^{\prime}(t)=-15(t-1)^2(4t-10)$ 또는 동치식을 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 4}
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        증감표(부호 변화)로 $t=\dfrac52$에서 최대임을 보였다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $t=\dfrac52$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3003}
  misconceptions:
  - id: MC-CAL-3003
    outcome_code: '71'
    wrong_work: '$S^{\prime}(t)=0$의 해 $t=1$, $\tfrac52$ 중 하나를 골라 최대라고만 씀'
    detect_cue: 부호 변화나 끝점 비교가 없다
    feedback: $t=1$은 중근이라 부호가 바뀌지 않습니다. 증감표로 최대를 확인하세요.
    remedy: [RL-2]

