intent: |
  속도를 적분해 잠긴 깊이를 구하고, 넘친 물의 부피 $V(t)=\int_0^{h(t)}A(x)dx$를 합성함수로 미분해 단면의 넓이 $S(t)=A(h(t))$를 얻은 뒤 최댓값을 구하는 능력을 본다.
key_idea: |
  $V(t)=F(h(t))-F(0)$ ($F^{\prime}=A$)이므로 $V^{\prime}(t)=A(h(t))h^{\prime}(t)$, 따라서 $S(t)=\dfrac{V^{\prime}(t)}{h^{\prime}(t)}=\dfrac{-30t(t-3)(t-1)^3}{2t}$.
stuck: |
  단면의 넓이가 $V^{\prime}(t)$ 자체가 아니라 $V^{\prime}(t)\div h^{\prime}(t)$라는 점(물체가 일정한 속력으로 내려가지 않음)
