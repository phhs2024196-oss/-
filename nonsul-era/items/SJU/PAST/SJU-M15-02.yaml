# 세종대 2015학년도 신입학 관련 모의평가 문제 2 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# [해설 오기] 해설교재 p.203 (2-1)의 "f(x)≥4 (x>0)" 는 "f(x)≥f(4)=2-ln4" 의 오기, p.204 (2-3) 증감표의 "r^{3/2}" 는 "e^{3/2}" 의 오기. 결론에는 영향 없음.
# 해설교재 (2-2)는 "x>0일 때 0<ln x/x" 라 썼으나 0<x<1 에서는 성립하지 않으므로 B 해설은 x>1 로 고쳐 씀.
# 해설교재 (2-4)는 그래프 개형만 제시 — B 해설은 같은 흐름(로그 → (2-3) 그래프)을 따르되 m<e<n 논증을 보충함.
