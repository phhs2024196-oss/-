intent: |
  보조함수로 부등식 $\ln x<\sqrt x$를 증명하고 샌드위치 정리로 $\dfrac{\ln x}{x}\to0$을 보인 뒤, $\dfrac{\ln x}{x}$의 그래프 개형을 이용해 $m^n=n^m$의 자연수 해를 결정하는 능력을 본다.
key_idea: |
  $m^n=n^m\iff\dfrac{\ln m}{m}=\dfrac{\ln n}{n}$. $f(x)=\dfrac{\ln x}{x}$는 $(0,e]$에서 증가, $[e,\infty)$에서 감소하므로 $m<e<n$, 즉 $m\in\{1,2\}$이고 $f(2)=f(4)$.
stuck: |
  방정식을 $f(m)=f(n)$ 꼴로 바꾸는 것, 그리고 $m<e<n$이어야 함을 단조 구간으로 논증하는 것
