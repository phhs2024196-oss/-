# 세종대 2015학년도 신입학 관련 모의평가 문제 3 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# [해설 불일치] (3-1) 해설교재 p.205 는 1행 (0,1/2,1/2)를 구해 놓고 최종 행렬 1행을 (1,1/2,1/2)로, 2행을 (1,1,-1)로 적었다.
#   x(0,1,2)+y(1,0,1)+z(1,0,-1)=(0,1,0) 을 풀면 2행은 (1,-1,1). 정답 A=[[0,1/2,1/2],[1,-1,1],[0,1/2,-1/2]](=B^{-1}) 로 둠.
# [해설 오기] (3-2) 해설의 "(0,2)A=(2,4)" 는 직선 y=3x-2 위의 점 (0,-2) 의 오기(계산 0·A[1]+(-2)·A[2] 는 (0,-2) 기준).
# [유형 제안] SJU T01~T10 중 맞는 유형 없음(구교육과정 수학Ⅰ 행렬) → type: null. 신설 제안: "행렬의 곱셈과 역행렬(구교육과정)"
