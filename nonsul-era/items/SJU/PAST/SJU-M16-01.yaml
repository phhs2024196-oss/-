# 세종대 2016학년도 신입학 수시모집 모의 논술고사 문제 1 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# [해설 불일치] (1-3) 해설교재 p.188 은 V=6π+2∫S(z)dz 로 세운 뒤 다음 식에서 2를 빠뜨리고 최종값을 (3√3-7/3)π 로 적었다.
#   올바른 값은 6π+2π(3√3-11/3)=(6√3-4/3)π=2(9√3-2)π/3 (≈9.06π; 원기둥 부피 6√3π≈10.39π, 구 부피 32π/3 보다 작음). 자기 계산을 정답으로 둠.
