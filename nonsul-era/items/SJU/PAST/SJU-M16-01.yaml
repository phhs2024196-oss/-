intent: |
  구와 원기둥을 축을 포함하는 평면으로 잘라 단면의 관계를 읽고, 높이에 따른 단면 원의 넓이를 적분해 공통 부분의 부피를 구하는 능력을 본다.
key_idea: |
  축에 수직인 평면 $z=k$로 자른 공통 부분의 단면은 (구의 단면 원)과 (원기둥 단면 원) 중 작은 원이다. $\sqrt3-1\le z\le\sqrt3+1$에서는 원기둥 단면, 그 위아래는 구의 단면이다.
stuck: |
