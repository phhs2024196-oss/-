stimuli: []

stem: |
  육지와 바다가 만나는 경계에 수상안전원이 대기하고 있다. 수상안전원은 육지에서 $1$초에 최대 $2\,\mathrm{m}$를 달릴 수 있고, 바다에서는 수영으로 $1$초에 최대 $1\,\mathrm{m}$를 갈 수 있다. 바다에 위급 상황이 발생하면, 그 위치에 따라 바로 수영만 해서 갈 수도 있고 일정거리까지는 육지에서 수평방향으로 달려간 뒤 수영을 할 수도 있는데, 어떤 방법을 택하느냐에 따라 그 위치에 도달하는 시간이 달라질 수 있다. 다음 물음에 답하시오. (단, 육지와 바다의 경계는 수평 방향의 직선이라 가정한다.)

subparts:
- id: '1'
  stem: |
    그림과 같이 위급 상황이 발생한 지점 $\mathrm{P}$가 육지로부터 $10\sqrt3\,\mathrm{m}$ 떨어져 있고, $\mathrm{P}$에서 가장 가까운 육지의 지점 $\mathrm{H}$로부터 왼쪽 수평방향으로 $80\,\mathrm{m}$ 떨어진 지점 $\mathrm{A}$에 수상안전원이 위치하고 있다. 수상안전원이 $\mathrm{A}$지점을 출발하여 $\mathrm{P}$지점에 도착하는데 걸리는 최소 시간을 구하시오.
    (그림: 위쪽은 바다, 아래쪽은 육지. 경계선 위에 왼쪽부터 $\mathrm{A}$, $\mathrm{H}$가 있고 $\overline{\mathrm{AH}}=80\,\mathrm{m}$, $\mathrm{H}$ 바로 위 바다에 $\mathrm{P}$가 있으며 $\overline{\mathrm{PH}}=10\sqrt3\,\mathrm{m}$, $\mathrm{PH}\perp$경계선)
  points: 10
  depends_on: []
  answer: {kind: value, value: '55', equivalents: ['55초'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $z\,\mathrm{m}$ 달린 뒤 수영하는 시간 $f(z)=\dfrac z2+\sqrt{(80-z)^2+300}$을 미분한다.
    steps:
    - {id: 1a, content: '$f^{\prime}(z)=0\iff 2(80-z)=\sqrt{(80-z)^2+300}\iff z=70$, $f(70)=35+20=55$', criteria: ['1.M1', '1.M2', '1.A1', '1.R1']}
    hint_ladder:
    - 육지에서 얼마나 달린 뒤 물에 들어갈지를 변수로 잡아 보자.
    - 걸리는 시간 = 거리 ÷ 속력.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.189
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{A}$에서 오른쪽으로 $z\,\mathrm{m}$ $(0\le z\le80)$ 달린 뒤 그 지점에서 $\mathrm{P}$까지 곧게 수영하면 걸리는 시간(초)은
        $$f(z)=\dfrac z2+\sqrt{(80-z)^2+(10\sqrt3)^2}$$
        이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f'(z)=\dfrac12-\dfrac{80-z}{\sqrt{(80-z)^2+300}}$이고, $0\le z\le80$에서
        $f'(z)=0\iff2(80-z)=\sqrt{(80-z)^2+300}\iff3(80-z)^2=300\iff z=70$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $0\le z<70$에서 $f'(z)<0$, $70<z\le80$에서 $f'(z)>0$이므로 $f$는 $z=70$에서 최솟값을 갖는다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        $f(70)=35+\sqrt{100+300}=55$이므로 최소 시간은 $55$초이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        달린 거리 $z$로 걸리는 시간 $f(z)=\dfrac z2+\sqrt{(80-z)^2+300}$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $f'(z)=0$을 풀어 $z=70$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: |
        $f'$의 부호 변화(증감)로 $z=70$에서 최소임을 밝혔다.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        최소 시간 $55$초를 얻었다.
      depends_on: [1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3172}
  misconceptions:
  - id: MC-CAL-3172
    outcome_code: '71'
    wrong_work: '달리는 시간을 $2z$, 수영 시간을 거리$\div2$로 두는 등 속력과 시간 관계를 뒤바꿈'
    detect_cue: 시간 함수에 $2z$ 또는 $\tfrac12\sqrt{\cdots}$가 있다
    feedback: 시간은 거리를 속력으로 나눈 값입니다. 육지(초속 $2$)에서는 $\dfrac z2$, 바다(초속 $1$)에서는 거리 그대로입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    위급 상황이 발생한 지점 $\mathrm{P}$가 육지로부터 $y\,\mathrm{m}$ 떨어져 있고, $\mathrm{P}$에서 가장 가까운 육지의 지점 $\mathrm{H}$로부터 왼쪽 수평방향으로 $x\,\mathrm{m}$ 떨어진 지점 $\mathrm{A}$에 수상안전원이 위치하고 있다. 수상안전원이 $\mathrm{A}$지점을 출발하여 $\mathrm{P}$지점에 가장 빨리 도착하기 위해 오른쪽 수평 방향으로 $50\,\mathrm{m}$를 달리고 나서 바로 수영을 시작했다. 이 때, $x$와 $y$가 만족하는 관계식을 구하시오.
    (그림: $\mathrm{A}$에서 오른쪽으로 $50\,\mathrm{m}$ 달린 지점에서 $\mathrm{P}$까지 비스듬히 수영하는 경로. $\overline{\mathrm{AH}}=x\,\mathrm{m}$, $\overline{\mathrm{PH}}=y\,\mathrm{m}$)
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'y = sqrt(3)*(x - 50)', equivalents: ['y = sqrt(3)*x - 50*sqrt(3)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (2-1)과 같이 $f(z)=\dfrac z2+\sqrt{(x-z)^2+y^2}$의 최소점은 $z=x-\dfrac{y}{\sqrt3}$이고, 여기에 $z=50$을 넣는다.
    steps:
    - {id: 2a, content: '$f^{\prime}(z)=0\iff y=\sqrt3(x-z)$, $z=50\Rightarrow y=\sqrt3(x-50)$ $(x\ge50)$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - (2-1)의 시간 함수에서 $80$, $10\sqrt3$을 $x$, $y$로 바꿔 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.189
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $z\,\mathrm{m}$ 달린 뒤 수영하는 시간은 $f(z)=\dfrac z2+\sqrt{(x-z)^2+y^2}$ $(0\le z\le x,\ y\ge0)$이고
        $f'(z)=\dfrac12-\dfrac{x-z}{\sqrt{(x-z)^2+y^2}}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $f'(z)=0\iff2(x-z)=\sqrt{(x-z)^2+y^2}\iff3(x-z)^2=y^2\iff\sqrt3(x-z)=y\iff z=x-\dfrac{y}{\sqrt3}$이다.
        $0\le z<x-\dfrac{y}{\sqrt3}$에서 $f'(z)<0$, $x-\dfrac{y}{\sqrt3}<z\le x$에서 $f'(z)>0$이므로 이 $z$에서 $f$가 최소이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        최적으로 달린 거리가 $50$이므로 $z=50$을 대입하면 $y=\sqrt3(x-50)$ $(x\ge50)$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $x$, $y$를 포함한 시간 함수 $f(z)$를 세우고 미분했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 4}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        최소 조건 $y=\sqrt3(x-z)$(또는 $z=x-\dfrac{y}{\sqrt3}$)와 최소 판정을 적었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $y=\sqrt3(x-50)$을 얻었다($x\ge50$ 표기 포함).
      depends_on: [2.M1]
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: $x\ge50$(또는 $x>50$) 조건 누락
      effect: minus
      value: 1
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3003}
  misconceptions:
  - id: MC-CAL-3003
    outcome_code: '71'
    wrong_work: '$f^{\prime}(z)=0$인 $z$를 구하고 그것이 최소임을 확인하지 않은 채 대입'
    detect_cue: 부호 변화나 증감표가 없다
    feedback: 임계점이 최소임을 $f'$의 부호 변화로 확인해야 "가장 빨리"의 조건이 됩니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    수상 안전원이 $60$초 안에 도착할 수 있는 바다의 모든 지점들로 이루어진 영역을 나타내고, 그 영역의 넓이를 구하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: expression, value: '3600*sqrt(3) + 600*pi', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 오른쪽으로 $z$ 달린 뒤 $y=\sqrt3(x-z)$로 수영해 $60$초에 닿는 끝점은 직선 $y=-\dfrac{\sqrt3}{3}(x-120)$ 위에 있다. 왼쪽도 대칭, 가운데는 반지름 $60$인 부채꼴(중심각 $\tfrac\pi3$).
    steps:
    - {id: 3a, content: '넓이 $=2\times\tfrac12\cdot120\cdot30\sqrt3+\tfrac12\cdot60^2\cdot\tfrac\pi3=3600\sqrt3+600\pi$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2']}
    hint_ladder:
    - 달린 거리 $z$를 정하면 $60$초 안에 갈 수 있는 끝점은 어디인가?
    - 바로 수영하는 경우는 어떤 모양인가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.189~190
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        수상안전원의 위치를 원점, 해안선을 $x$축, 바다 쪽을 $y>0$으로 둔다. 오른쪽으로 $z\,\mathrm{m}$ $(z>0)$ 달린 뒤 최적 경로 $y=\sqrt3(x-z)$를 따라 수영해 $60$초에 닿는 점 $(x,y)$는
        $\dfrac z2+\sqrt{(x-z)^2+y^2}=60$을 만족한다. $y=\sqrt3(x-z)$를 넣으면 $\dfrac z2+2(x-z)=60$, 즉 $z=\dfrac43x-40$ $(x>30)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        다시 $y=\sqrt3(x-z)$에 대입하면 끝점의 자취는 $y=-\dfrac{\sqrt3}{3}(x-120)$ $(30<x\le120)$이다. 따라서 $z>0$일 때 $60$초 안에 도달할 수 있는 영역은
        $\left\{(x,y)\mid0\le y\le-\dfrac{\sqrt3}{3}(x-120),\ 0\le y<\sqrt3x\right\}$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $z<0$(왼쪽으로 달림)인 경우는 이 영역과 $y$축에 대하여 대칭이다. $z=0$(바로 수영)이면 반지름 $60$인 반원 영역이 되고, 앞의 두 영역과 겹치지 않는 부분은 두 직선 $y=\pm\sqrt3x$ 사이의 중심각 $\dfrac\pi3$인 부채꼴이다.
        (영역: 꼭짓점 $(-120,0)$, $(-30,30\sqrt3)$, $(30,30\sqrt3)$, $(120,0)$을 잇는 두 선분과 두 점 $(\pm30,30\sqrt3)$ 사이의 원호 $x^2+y^2=60^2$, 그리고 $x$축으로 둘러싸인 부분)
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        넓이는 삼각형 $\mathrm{O}(0,0)$, $(120,0)$, $(30,30\sqrt3)$의 넓이 $\dfrac12\cdot120\cdot30\sqrt3=1800\sqrt3$의 $2$배와 부채꼴 넓이 $\dfrac12\cdot60^2\cdot\dfrac\pi3=600\pi$의 합이므로 $3600\sqrt3+600\pi\ (\mathrm{m}^2)$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
