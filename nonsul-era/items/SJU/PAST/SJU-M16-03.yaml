stimuli:
- label: 제시문
  body: |
    좌표공간에 쇠공이 놓여 있는데, 쇠공의 겉면을 $S$라 할 때, $S$는 구의 방정식 $(x-1)^2+(y-1)^2+(z-1)^2=1$로 주어진다. 좌표공간에서 쇠공 내부에 있지 않은 두 점 $\mathrm{P}$와 $\mathrm{Q}$를 실로 연결할 때 실의 길이의 최솟값을 $d(\mathrm{P},\mathrm{Q})$라고 정의하자. (단, 실은 쇠공을 통과하지 않는다.) 만일 두 점 $\mathrm{P}$, $\mathrm{Q}$가 아래 그림처럼 모두 쇠공의 겉면 $S$에 있을 때는 두 점을 연결하는 대원의 호 중 짧은 쪽의 길이가 $d(\mathrm{P},\mathrm{Q})$가 된다. (여기서 대원이란 구 $S$의 중심을 지나는 평면과 $S$가 만나 이루어지는 원을 말한다.)
    (그림: 좌표공간의 공 모양 쇠공 겉면 위의 두 점 $\mathrm{P}$, $\mathrm{Q}$를 잇는 대원의 짧은 호가 표시되어 있다.)

stem: |
  다음 제시문을 읽고 각 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $S$에 있는 두 점 $\mathrm{P}(1,2,1)$, $\mathrm{Q}\left(\dfrac32,\dfrac32,1+\dfrac{\sqrt2}{2}\right)$에 대하여 $d(\mathrm{P},\mathrm{Q})$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'pi/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 중심 $\mathrm{B}$에서 본 중심각을 내적으로 구하고 반지름 $1$을 곱한다.
    steps:
    - {id: 1a, content: '$\cos\theta=\tfrac12\Rightarrow\theta=\tfrac\pi3$, $d(\mathrm{P},\mathrm{Q})=\tfrac\pi3$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 대원의 호의 길이는 반지름과 무엇의 곱인가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.191
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $S$의 중심을 $\mathrm{B}(1,1,1)$이라 하면 $\overrightarrow{\mathrm{BP}}=(0,1,0)$, $\overrightarrow{\mathrm{BQ}}=\left(\dfrac12,\dfrac12,\dfrac{\sqrt2}{2}\right)$이다. 두 벡터가 이루는 각을 $\theta$라 하자.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\cos\theta=\dfrac{\overrightarrow{\mathrm{BP}}\cdot\overrightarrow{\mathrm{BQ}}}{\lvert\overrightarrow{\mathrm{BP}}\rvert\lvert\overrightarrow{\mathrm{BQ}}\rvert}=\dfrac{1/2}{1\cdot1}=\dfrac12$이므로 $\theta=\dfrac\pi3$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        반지름이 $1$이므로 짧은 호의 길이는 $d(\mathrm{P},\mathrm{Q})=1\cdot\dfrac\pi3=\dfrac\pi3$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        중심 $\mathrm{B}$에서 $\mathrm{P}$, $\mathrm{Q}$로 향하는 벡터(또는 중심각)를 이용해 호의 길이를 구하려 했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        중심각 $\dfrac\pi3$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $d(\mathrm{P},\mathrm{Q})=\dfrac\pi3$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3174}
  misconceptions:
  - id: MC-GEO-3174
    outcome_code: '71'
    wrong_work: '$d(\mathrm{P},\mathrm{Q})=\overline{\mathrm{PQ}}=1$로 직선거리를 답함'
    detect_cue: 중심각·호의 길이가 없다
    feedback: 실은 쇠공을 통과할 수 없으므로 겉면을 따라 대원의 호로 갑니다. 중심각을 구해 반지름을 곱하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    점 $\mathrm{A}(2,2,1-\sqrt2)$와 구 $S$의 중심 $\mathrm{B}(1,1,1)$을 연결하는 직선이 구 $S$와 만나는 두 점 중 $\mathrm{A}$에서 더 멀리 떨어져 있는 점을 $\mathrm{C}$라 할 때, $\mathrm{C}$의 좌표를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '(1/2, 1/2, 1 + sqrt(2)/2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{C}=\mathrm{B}+\dfrac{\overrightarrow{\mathrm{AB}}}{\lvert\overrightarrow{\mathrm{AB}}\rvert}$(반지름 $1$만큼 $\mathrm{A}$ 반대쪽).
    steps:
    - {id: 2a, content: '$\overrightarrow{\mathrm{AB}}=(-1,-1,\sqrt2)$, $\lvert\overrightarrow{\mathrm{AB}}\rvert=2$, $\mathrm{C}=\left(\tfrac12,\tfrac12,1+\tfrac{\sqrt2}{2}\right)$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - 직선 $\mathrm{AB}$를 매개변수로 나타내 구의 방정식에 넣어 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.191
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 점 $\mathrm{A}$, $\mathrm{B}$를 지나는 직선은 $(x,y,z)=(1,1,1)+t\overrightarrow{\mathrm{AB}}=(1,1,1)+t(-1,-1,\sqrt2)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이를 구의 방정식 $(x-1)^2+(y-1)^2+(z-1)^2=1$에 대입하면 $4t^2=1$, $t=\pm\dfrac12$이다. $t>0$ 쪽이 $\mathrm{A}$($t=-1$)에서 더 멀므로 $t=\dfrac12$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        따라서 $\mathrm{C}\left(\dfrac12,\dfrac12,1+\dfrac{\sqrt2}{2}\right)$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        직선 $\mathrm{AB}$의 방정식(매개변수 표현)을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        구와의 교점 매개변수 $t=\pm\dfrac12$를 구하고 $\mathrm{A}$에서 먼 쪽 $t=\dfrac12$를 골랐다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $\mathrm{C}\left(\dfrac12,\dfrac12,1+\dfrac{\sqrt2}{2}\right)$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '79', meaning: '$t=-\tfrac12$을 골라 가까운 교점 $\left(\tfrac32,\tfrac32,1-\tfrac{\sqrt2}{2}\right)$을 답함'}
  misconceptions: []

- id: '3'
  stem: |
    $d(\mathrm{A},\mathrm{C})$의 값을 구하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: expression, value: 'sqrt(3) + 2*pi/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 실은 $\mathrm{A}$에서 구에 접하는 선분 $\mathrm{AE}$와 대원의 호 $\mathrm{EC}$로 이루어진다.
    steps:
    - {id: 3a, content: '$\overline{\mathrm{AE}}=\sqrt{2^2-1^2}=\sqrt3$, $\angle\mathrm{CBE}=\pi-\tfrac\pi3=\tfrac{2\pi}{3}$, $d=\sqrt3+\tfrac{2\pi}{3}$', criteria: ['3.M1', '3.A1', '3.A2', '3.A3']}
    hint_ladder:
    - 실이 쇠공을 통과할 수 없다면 $\mathrm{A}$에서 어디까지 곧게 갈 수 있는가?
    - 실을 포함하는 평면으로 잘라 그림을 그려 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.191
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        실의 길이가 최소가 되도록 $\mathrm{A}$와 $\mathrm{C}$를 이으면, 실은 $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$를 지나는 평면(대원을 품은 평면) 위에 있고, $\mathrm{A}$에서 구에 접하는 선분 $\mathrm{AE}$($\mathrm{E}$는 접점)와 대원의 호 $\mathrm{EC}$로 이루어진다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\mathrm{AE}$는 원에 접하므로 $\angle\mathrm{AEB}=\dfrac\pi2$이고 $\overline{\mathrm{AB}}=2$, $\overline{\mathrm{BE}}=1$이므로 $\overline{\mathrm{AE}}=\sqrt3$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $\cos(\angle\mathrm{ABE})=\dfrac12$이므로 $\angle\mathrm{ABE}=\dfrac\pi3$이고, $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$가 한 직선 위에 있으므로 $\angle\mathrm{CBE}=\pi-\dfrac\pi3=\dfrac{2\pi}{3}$, 즉 $d(\mathrm{C},\mathrm{E})=\dfrac{2\pi}{3}$이다.
      criteria: ['3.A2']
    - id: 3b-4
      content: |
        따라서 $d(\mathrm{A},\mathrm{C})=\overline{\mathrm{AE}}+d(\mathrm{C},\mathrm{E})=\sqrt3+\dfrac{2\pi}{3}$이다.
      criteria: ['3.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        실이 접선 구간과 대원의 호 구간으로 이루어짐을 적었다(그림 포함 가능).
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $\overline{\mathrm{AE}}=\sqrt3$을 구했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 3
      evidence: |
        $\angle\mathrm{CBE}=\dfrac{2\pi}{3}$(호의 길이 $\dfrac{2\pi}{3}$)을 구했다.
      depends_on: [3.M1]
      ft: {allowed: true, from: [2.A2], max_points: 3}
      steps: [3b-3]
    - id: 3.A3
      mark_type: A
      points: 2
      evidence: |
        $d(\mathrm{A},\mathrm{C})=\sqrt3+\dfrac{2\pi}{3}$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3175}
  - {code: '72', misconception: MC-GEO-3174}
  misconceptions:
  - id: MC-GEO-3175
    outcome_code: '71'
    wrong_work: '$\mathrm{A}$에서 가까운 교점까지 직선 $1$, 그 뒤 반원 $\pi$를 더해 $1+\pi$로 답함'
    detect_cue: 접선 $\overline{\mathrm{AE}}=\sqrt3$이 없다
    feedback: 가장 짧은 실은 $\mathrm{A}$에서 구에 접하는 방향으로 나아가 접점부터 호를 따라갑니다.
    remedy: [RL-2]
  - id: MC-GEO-3174
    outcome_code: '72'
    wrong_work: '$d(\mathrm{A},\mathrm{C})=\overline{\mathrm{AC}}=3$'
    detect_cue: 실이 쇠공을 통과하는 직선거리를 답했다
    feedback: 실은 쇠공을 통과하지 않습니다. 구를 돌아가는 경로를 생각하세요.
    remedy: [RL-1]

- id: '4'
  stem: |
    평면 $z=\dfrac32$과 구 $S$가 만나는 원 위의 점을 $\mathrm{D}$라 할 때, $d(\mathrm{A},\mathrm{D})$의 최솟값을 구하시오.
  points: 10
  depends_on: ['3']
  answer: {kind: expression, value: 'sqrt(3) + pi/12', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{D}$가 대원 평면 $x=y$ 위에 있을 때 최소이고, 그때 $\angle\mathrm{CBD}=\dfrac{7\pi}{12}$이므로 $d(\mathrm{A},\mathrm{D})=d(\mathrm{A},\mathrm{C})-\dfrac{7\pi}{12}$.
    steps:
    - {id: 4a, content: '$\theta_1=\tfrac\pi4$, $\theta_2=\tfrac\pi6$, $\angle\mathrm{CBD}=\tfrac{7\pi}{12}$, $d=\sqrt3+\tfrac{2\pi}{3}-\tfrac{7\pi}{12}=\sqrt3+\tfrac{\pi}{12}$', criteria: ['4.M1', '4.A1', '4.M2', '4.A2']}
    hint_ladder:
    - 원 $z=\tfrac32$ 위의 점 중 $\mathrm{A}$ 쪽에 가장 가까운 점은 어느 평면 위에 있을까?
    - (3-3)의 경로 $\mathrm{A}\to\mathrm{E}\to\mathrm{C}$ 위에 $\mathrm{D}$가 놓이는가?
  - id: S4-B
    audience: B
    source_flow: 해설교재 p.192
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $\mathrm{D}\left(x,y,\dfrac32\right)$를 구의 방정식에 넣으면 $(x-1)^2+(y-1)^2+\dfrac14=1$이다. $\mathrm{A}$는 평면 $x=y$ 위에 있고 이 원 위의 점 중 평면 $x=y$ 위에 있으면서 $\mathrm{A}$ 쪽에 있는 점에서 $\mathrm{A}$로부터 중심각($\angle\mathrm{ABD}$)이 가장 작으므로 $d(\mathrm{A},\mathrm{D})$가 최소이다. 이때 $x=y=1+\dfrac{\sqrt6}{4}$, 즉 $\mathrm{D}\left(1+\dfrac{\sqrt6}{4},1+\dfrac{\sqrt6}{4},\dfrac32\right)$이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        $\overrightarrow{\mathrm{BC}}=\left(-\dfrac12,-\dfrac12,\dfrac{\sqrt2}{2}\right)$가 $xy$평면과 이루는 각을 $\theta_1$이라 하면, 정사영 $\left(-\dfrac12,-\dfrac12,0\right)$과의 각에서 $\cos\theta_1=\dfrac{\sqrt2}{2}$, $\theta_1=\dfrac\pi4$이다.
        $\overrightarrow{\mathrm{BD}}=\left(\dfrac{\sqrt6}{4},\dfrac{\sqrt6}{4},\dfrac12\right)$가 $xy$평면과 이루는 각을 $\theta_2$라 하면 정사영 $\left(\dfrac{\sqrt6}{4},\dfrac{\sqrt6}{4},0\right)$과의 각에서 $\cos\theta_2=\dfrac{\sqrt3}{2}$, $\theta_2=\dfrac\pi6$이다.
      criteria: ['4.A1']
    - id: 4b-3
      content: |
        $\overrightarrow{\mathrm{BC}}$와 $\overrightarrow{\mathrm{BD}}$는 평면 $x=y$ 위에서 서로 반대쪽 수평 방향을 기준으로 각각 위로 $\theta_1$, $\theta_2$만큼 기울어 있으므로 $\angle\mathrm{CBD}=\pi-(\theta_1+\theta_2)=\dfrac{7\pi}{12}$이다. $\mathrm{D}$는 경로 $\mathrm{A}\to\mathrm{E}\to\mathrm{C}$의 호 $\mathrm{EC}$ 위에 있다($\angle\mathrm{CBD}=\dfrac{7\pi}{12}<\dfrac{2\pi}{3}=\angle\mathrm{CBE}$).
      criteria: ['4.M2']
    - id: 4b-4
      content: |
        따라서 $d(\mathrm{A},\mathrm{D})=d(\mathrm{A},\mathrm{C})-\dfrac{7\pi}{12}=\sqrt3+\dfrac{2\pi}{3}-\dfrac{7\pi}{12}=\sqrt3+\dfrac{\pi}{12}$이다.
      criteria: ['4.A2']
  - id: S4-ALT
    audience: ALT
    source_flow: 해설교재 p.193 별해
    method_no: 2
    key_idea: $\angle\mathrm{CBD}$를 두 벡터의 내적으로 직접 구한다.
    steps:
    - id: 4c-1
      content: |
        $\cos(\angle\mathrm{CBD})=\dfrac{\overrightarrow{\mathrm{BC}}\cdot\overrightarrow{\mathrm{BD}}}{\lvert\overrightarrow{\mathrm{BC}}\rvert\lvert\overrightarrow{\mathrm{BD}}\rvert}=-\dfrac{\sqrt6}{8}-\dfrac{\sqrt6}{8}+\dfrac{\sqrt2}{4}=\dfrac{\sqrt2}{4}-\dfrac{\sqrt6}{4}$이고, 반각공식으로 $\cos\dfrac{7\pi}{12}=\dfrac{\sqrt2}{4}-\dfrac{\sqrt6}{4}$이므로 $\angle\mathrm{CBD}=\dfrac{7\pi}{12}$이다.
      criteria: ['4.A1']
  - id: S4-ALT2
    audience: ALT
    method_no: 3
    key_idea: 보이지 않는 점 $\mathrm{X}$에 대해 $d(\mathrm{A},\mathrm{X})=\sqrt3+\left(\angle\mathrm{ABX}-\dfrac\pi3\right)$이므로 $\angle\mathrm{ABD}$를 최소화한다.
    steps:
    - id: 4d-1
      content: |
        $\overrightarrow{\mathrm{BD}}=(u,v,\tfrac12)$, $u^2+v^2=\dfrac34$이면 $\overrightarrow{\mathrm{BA}}\cdot\overrightarrow{\mathrm{BD}}=u+v-\dfrac{\sqrt2}{2}\le\dfrac{\sqrt6}{2}-\dfrac{\sqrt2}{2}<1$이므로 원 위의 모든 점은 $\mathrm{A}$에서 직접 보이지 않고($\angle\mathrm{ABD}>\tfrac\pi3$), 최대일 때 $\cos\angle\mathrm{ABD}=\dfrac{\sqrt6-\sqrt2}{4}$, $\angle\mathrm{ABD}=\dfrac{5\pi}{12}$이다. 따라서 최솟값은 $\sqrt3+\dfrac{5\pi}{12}-\dfrac{\pi}{3}=\sqrt3+\dfrac{\pi}{12}$.
      criteria: ['4.M1', '4.A2']
