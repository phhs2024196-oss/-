intent: |
  점광원에서 나온 빛의 직선을 매개변수로 나타내 $xy$평면 위 그림자 점을 구하고, 반원판 경계의 그림자 곡선의 방정식을 유도한 뒤 음함수 미분으로 그 곡선 위 $y$의 최댓값을 구하는 능력을 본다.
key_idea: |
  $\mathrm{A}(0,0,d)$와 $\mathrm{P}(a,b,c)$를 지나는 직선과 $z=0$의 교점은 $\left(\dfrac{ad}{d-c},\dfrac{bd}{d-c}\right)$이고, 경계 반원 $(a-1)^2+c^2=1$, $b=1$에 $a=\dfrac xy$, $c=3-\dfrac3y$를 대입한다.
