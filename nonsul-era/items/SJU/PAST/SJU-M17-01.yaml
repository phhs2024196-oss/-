stimuli: []

stem: |
  좌표공간의 $xz$평면에서 중심이 원점이고 반지름이 $1$인 원으로 둘러싸인 영역을 $x$축, $y$축 방향으로 각각 $1$만큼 평행이동한 뒤 $z\ge0$인 부분만을 택하여 만든 영역을 $D$라 하자. 즉 $D$는 다음과 같은 식으로 나타낼 수 있으며 아래 그림에서 초록색으로 나타낸 영역이다.
  $$D=\{(x,y,z)\mid(x-1)^2+z^2\le1,\ y=1,\ z\ge0\}$$
  점 $\mathrm{A}$에서 빛이 나오고 있다. 다음 그림을 참고하여 각각의 물음에 답하시오.
  (그림: $z$축 위의 점 A에서 나온 빛이 평면 $y=1$ 위의 반원판 $D$(초록색)를 비추어 $xy$평면에 회색 그림자가 생김. 그림자 경계는 $x$축 방향 선분 $L$($y=1$, $0\le x\le2$)과 곡선 $S$로 이루어지고, $S$ 위의 점 R 표시. 또 A에서 나와 점 P를 지나 $xy$평면의 점 Q에 닿는 광선이 그려져 있음)

subparts:
- id: '1'
  stem: |
    점 $\mathrm{A}(0,0,d)$에서 나온 빛이 좌표공간의 한 점 $\mathrm{P}(a,b,c)$를 지나 $xy$평면과 만나는 점을 $\mathrm{Q}$라 할 때 $\mathrm{Q}$의 $x$좌표와 $y$좌표를 각각 상수 $a,b,c,d$를 이용하여 나타내시오. (단, $0\le c<d$이다.)
  points: 20
  depends_on: []
  answer: {kind: expression, value: 'x = a*d/(d - c); y = b*d/(d - c)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 직선 $\mathrm{AP}$를 매개변수로 쓰고 $z=0$인 매개변수 값을 대입.
    steps:
    - {id: 1a, content: '$(at,bt,d+t(c-d))$, $z=0\Rightarrow t=\tfrac{d}{d-c}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 두 점 A, P를 지나는 직선을 매개변수로 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.179
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직선 $\mathrm{AP}$의 방향벡터는 $\overrightarrow{\mathrm{AP}}=(a,b,c-d)$이므로 직선은 $x=at$, $y=bt$, $z=d+t(c-d)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $z=0$이면 $t=\dfrac{d}{d-c}$($c<d$이므로 존재)이고, 이를 대입하면 $\mathrm{Q}$의 좌표는 $x=\dfrac{ad}{d-c}$, $y=\dfrac{bd}{d-c}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        직선 AP의 매개변수 방정식(또는 닮음비)을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: |
        $x=\dfrac{ad}{d-c}$, $y=\dfrac{bd}{d-c}$.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3168}
  misconceptions:
  - id: MC-GEO-3168
    outcome_code: '71'
    wrong_work: '$t=\tfrac{c}{d-c}$ 또는 $\tfrac{d}{c}$로 두어 $x=\tfrac{ac}{d-c}$ 등'
    detect_cue: $c=0$을 넣었을 때 Q가 P와 같아지지 않는다
    feedback: P가 이미 $xy$평면 위($c=0$)이면 Q=P여야 합니다. $z$좌표가 0이 되는 매개변수를 다시 구하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    점 $\mathrm{A}$의 좌표가 $(0,0,3)$일 때 $\mathrm{A}$에서 나온 빛이 $D$를 비출 때 $xy$평면에 그림자가 생긴다. (위의 그림에서 회색으로 나타낸 영역이 그림자이다.) 또한 그림자의 경계는 위의 그림과 같이 선분 $L$과 곡선 $S$로 이루어진다. 곡선 $S$를 나타내는 방정식을 변수 $x$와 $y$를 이용하여 나타내시오.
  points: 20
  depends_on: ['1']
  answer: {kind: expression, value: '(x - y)**2 + (3*y - 3)**2 = y**2 (y >= 1)', equivalents: ['x**2 - 2*x*y + 9*y**2 - 18*y + 9 = 0 (y >= 1)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $b=1$, $d=3$에서 $x=\dfrac{3a}{3-c}$, $y=\dfrac{3}{3-c}$; 역으로 $a=\dfrac xy$, $c=3-\dfrac3y$를 반원 식에 대입.
    steps:
    - {id: 2a, content: '$\left(\tfrac xy-1\right)^2+\left(3-\tfrac3y\right)^2=1\Rightarrow(x-y)^2+(3y-3)^2=y^2\ (y\ge1)$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 곡선 $S$는 $D$의 어느 경계의 그림자인가?
    - $x$, $y$로부터 $a$, $c$를 거꾸로 구해 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.179
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        곡선 $S$는 $D$의 위쪽 경계인 반원 위의 점 $\mathrm{P}(a,1,c)$의 그림자이다. (1-1)에서 $b=1$, $d=3$이므로 $x=\dfrac{3a}{3-c}$, $y=\dfrac{3}{3-c}$ ⋯ (1.1)이고, P는 $(a-1)^2+c^2=1\ (c\ge0)$ ⋯ (1.2)를 만족한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        (1.1)에서 $c=3-\dfrac3y\ge0$이므로 $y\ge1$이고, $x=ay$이므로 $a=\dfrac xy$이다. 이를 (1.2)에 대입하면 $\left(\dfrac xy-1\right)^2+\left(3-\dfrac3y\right)^2=1\ (y\ge1)$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        양변에 $y^2$을 곱해 정리하면 곡선 $S$의 방정식은 $(x-y)^2+(3y-3)^2=y^2\ (y\ge1)$ ⋯ (1.3)이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: |
        S가 반원 경계의 그림자임을 쓰고 (1-1)에 $b=1$, $d=3$을 대입했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 6}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 7
      evidence: |
        $a=\dfrac xy$, $c=3-\dfrac3y$를 반원 식에 대입했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 7
      evidence: |
        $(x-y)^2+(3y-3)^2=y^2$와 범위 $y\ge1$을 제시했다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 범위 $y\ge1$(또는 동치 조건) 누락
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3168}
  misconceptions:
  - id: MC-GEO-3168
    outcome_code: '71'
    wrong_work: '그림자 점에 원래 좌표를 그대로 넣어 $(x-1)^2+y^2=1$ 등으로 답함'
    detect_cue: 사영 변환 $(a,c)\to(x,y)$를 거치지 않았다
    feedback: 그림자 점 $(x,y)$와 원래 점 $(a,1,c)$의 관계식 (1-1)을 이용해 $a$, $c$를 $x$, $y$로 바꿔 대입해야 합니다.
    remedy: [RL-1]

- id: '3'
  stem: |
    문제 (1-2)에서 제시된 곡선 $S$ 위의 점 $\mathrm{R}(x,y)$ 중에서 $y$값이 최대가 되는 점의 좌표를 구하시오.
  points: 20
  depends_on: ['2']
  answer: {kind: expression, value: '(3/2, 3/2)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 음함수 미분 $\dfrac{dy}{dx}=\dfrac{y-x}{9y-x-9}=0\Rightarrow y=x$를 (1.3)에 대입.
    steps:
    - {id: 3a, content: '$y=x\Rightarrow(3y-3)^2=y^2\Rightarrow y=\tfrac32\ (y\ge1)$', criteria: ['3.M1', '3.A1', '3.A2']}
    hint_ladder:
    - $y$가 최대인 점에서 $\dfrac{dy}{dx}$는?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.179
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        곡선 (1.3)에서 $y$가 최대인 점에서는 $\dfrac{dy}{dx}=0$이다. $y$를 $x$의 함수로 보고 (1.3)의 양변을 $x$에 대하여 미분하면
        $2(x-y)\left(1-\dfrac{dy}{dx}\right)+2(3y-3)\cdot3\dfrac{dy}{dx}=2y\dfrac{dy}{dx}$ ⋯ (1.4)
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        정리하면 $\dfrac{dy}{dx}=\dfrac{y-x}{9y-x-9}$이므로 $\dfrac{dy}{dx}=0$에서 $y=x$ ⋯ (1.5)이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        (1.5)를 (1.3)에 대입하면 $(3y-3)^2=y^2$, 즉 $8y^2-18y+9=(2y-3)(4y-3)=0$이다. $y\ge1$이므로 $y=\dfrac32$, (1.5)에서 $x=\dfrac32$이다. 따라서 $\mathrm{R}\left(\dfrac32,\dfrac32\right)$이다.
      criteria: ['3.A2']
  - id: S3-ALT
    audience: ALT
    method_no: 2
    key_idea: 자체 풀이 — 원래 점 $\mathrm{P}(a,1,c)$로 보면 $y=\dfrac{3}{3-c}$는 $c$에 대해 증가하므로 $c$가 최대($c=1$, $a=1$)일 때 최대. 그때 $x=\dfrac{3\cdot1}{3-1}=\dfrac32$, $y=\dfrac32$.
    steps:
    - id: 3c-1
      content: |
        $y=\dfrac{3}{3-c}$, $0\le c\le1$에서 $y$는 $c=1$(반원의 꼭대기 $a=1$)일 때 최대이고 $\mathrm{R}\left(\dfrac32,\dfrac32\right)$이다.
      criteria: ['3.M1', '3.A1', '3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 7
      evidence: |
        음함수 미분(또는 원래 점의 매개변수)으로 최대 조건을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 7}
      steps: [3b-1, 3c-1]
    - id: 3.A1
      mark_type: A
      points: 6
      evidence: |
        $\dfrac{dy}{dx}=0\iff y=x$(또는 $c=1$)을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2, 3c-1]
    - id: 3.A2
      mark_type: A
      points: 7
      evidence: |
        $y\ge1$로 근을 골라 $\left(\dfrac32,\dfrac32\right)$를 얻었다.
      depends_on: [3.M1, 3.A1]
      steps: [3b-3, 3c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점(음함수 미분)}
  - {code: '21', meaning: 만점(매개변수)}
  - {code: '79', meaning: '기타 오답(예: $y=\tfrac34$을 함께 답함)'}
  misconceptions: []

