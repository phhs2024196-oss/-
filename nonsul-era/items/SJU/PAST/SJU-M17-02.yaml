intent: |
  치환적분으로 두 적분이 같음을 보여 관계식을 단순화하고, 두 번 미분해 $\{f(x)\}^2=\sin^2x$를 얻은 뒤 연속성으로 구간마다 부호를 정해 가능한 정적분 값을 모두 분류하며, 확률밀도함수 조건으로 $f$를 하나로 정해 평균을 구하는 능력을 본다.
key_idea: |
  $u=x-t$ 치환으로 $\int_0^xt\{f(x-t)\}^2dt=\int_0^x(x-u)\{f(u)\}^2du$이므로 $g(x)=\dfrac14x^2-\dfrac14\sin^2x$이고, 두 번 미분하면 $\{f(x)\}^2=\sin^2x$이다.
stuck: |
  두 적분이 치환으로 같다는 것을 알아채는 것, 그리고 $f^2=\sin^2x$에서 연속성 때문에 각 구간 $[n\pi,(n+1)\pi]$에서 $f=\sin x$ 또는 $-\sin x$로만 고를 수 있다는 분류
