stimuli: []

stem: |
  연속함수 $f(x)$가 모든 실수 $x$에 대하여 다음 조건을 만족시킨다.
  $$\int_0^x(x-t)\{f(t)\}^2dt+\int_0^xt\{f(x-t)\}^2dt=\dfrac12x^2-\dfrac12\sin^2x$$
  다음 물음에 각각 답하시오.

subparts:
- id: '1'
  stem: |
    실수 $x$에 대하여 $g(x)=\displaystyle\int_0^xt\{f(x-t)\}^2dt$라 정의할 때 $g(\pi)$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: 'pi**2/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $u=x-t$로 치환하면 두 적분이 같아져 $2g(x)=\dfrac12x^2-\dfrac12\sin^2x$.
    steps:
    - {id: 1a, content: '$g(x)=\int_0^x(x-u)\{f(u)\}^2du\Rightarrow g(x)=\tfrac14x^2-\tfrac14\sin^2x$, $g(\pi)=\tfrac{\pi^2}{4}$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $g(x)$의 적분에서 $x-t$를 새 변수로 바꿔 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.180
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $u=x-t$로 치환하면 $dt=-du$이고 $t=0\to u=x$, $t=x\to u=0$이므로
        $g(x)=\displaystyle\int_0^xt\{f(x-t)\}^2dt=\int_0^x(x-u)\{f(u)\}^2du$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 주어진 조건식은 $2g(x)=2\displaystyle\int_0^x(x-t)\{f(t)\}^2dt=\dfrac12x^2-\dfrac12\sin^2x$이고
        $g(x)=\displaystyle\int_0^x(x-t)\{f(t)\}^2dt=\dfrac14x^2-\dfrac14\sin^2x$ ⋯ (2.1)
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        그러므로 $g(\pi)=\dfrac{\pi^2}{4}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 8
      evidence: |
        $u=x-t$ 치환으로 $g(x)=\int_0^x(x-u)\{f(u)\}^2du$를 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: |
        $g(x)=\dfrac14x^2-\dfrac14\sin^2x$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: |
        $g(\pi)=\dfrac{\pi^2}{4}$.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '79', meaning: '기타 오답(예: 치환 후 적분 구간의 방향을 바꾸지 않아 부호 오류)'}
  misconceptions: []

- id: '2'
  stem: |
    $\displaystyle\int_0^{100\pi}f(x)\,dx$의 값으로 가능한 것을 모두 구하시오.
  points: 20
  depends_on: ['1']
  answer: {kind: set, value: '{-200, -196, -192, ..., -4, 0, 4, ..., 192, 196, 200}', equivalents: ['4*j - 200 (j = 0, 1, ..., 100)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (2.1)을 두 번 미분해 $f^2=\sin^2x$, 각 구간에서 $\pm\sin x$를 골라 적분값이 $\pm2$의 100개 합.
    steps:
    - {id: 2a, content: '$\{f(x)\}^2=\sin^2x$, $\int_{n\pi}^{(n+1)\pi}f=\pm2$ ⇒ $-200,-196,\dots,196,200$', criteria: ['2.M1', '2.A1', '2.R1', '2.A2']}
    hint_ladder:
    - (2.1)의 $x$를 적분 밖으로 꺼낸 뒤 두 번 미분해 보자.
    - $f^2=\sin^2x$일 때 연속인 $f$는 어떻게 생길 수 있는가?
    - $100$개의 $\pm2$를 더한 값은 어떤 수들인가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.180
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (2.1)을 전개하면 $x\displaystyle\int_0^x\{f(t)\}^2dt-\int_0^xt\{f(t)\}^2dt=\dfrac14x^2-\dfrac14\sin^2x$이다.
        양변을 $x$에 대하여 미분하면 $\displaystyle\int_0^x\{f(t)\}^2dt=\dfrac12x-\dfrac12\sin x\cos x$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        다시 한 번 미분하면 $\{f(x)\}^2=\dfrac12-\dfrac12\cos^2x+\dfrac12\sin^2x=\sin^2x$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $f(x)$는 연속이고 열린구간 $(n\pi,(n+1)\pi)$에서 $\lvert f(x)\rvert=\lvert\sin x\rvert>0$이므로 사잇값 정리에 의해 그 구간에서 $f$의 부호는 일정하다. 따라서 각 구간 $[n\pi,(n+1)\pi]$ $(n=0,1,\dots,99)$에서 $f(x)=\sin x$ 또는 $f(x)=-\sin x$이다(끝점에서는 모두 $0$이라 연속성이 유지되므로 구간마다 독립적으로 고를 수 있다).
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        $\displaystyle\int_0^{\pi}\sin x\,dx=2$, $\displaystyle\int_0^{\pi}(-\sin x)\,dx=-2$이고 각 구간의 적분은 $\pm2$이므로, $100$개 구간 중 $j$개에서 $+2$를 고르면 적분값은 $2j-2(100-j)=4j-200$ $(j=0,1,\dots,100)$이다.
        따라서 가능한 값은 $-200,-196,-192,\dots,-4,0,4,\dots,192,196,200$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        (2.1)을 전개해 미분, $\int_0^x\{f(t)\}^2dt=\dfrac12x-\dfrac12\sin x\cos x$를 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 5}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $\{f(x)\}^2=\sin^2x$.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: |
        연속성으로 각 구간 $[n\pi,(n+1)\pi]$에서 $f=\pm\sin x$임을 밝혔다.
      depends_on: [2.A1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: |
        가능한 값 $-200$부터 $200$까지 공차 $4$인 101개를 모두 제시했다.
      depends_on: [2.M1, 2.R1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3162}
  - {code: '72', misconception: MC-CAL-3161}
  misconceptions:
  - id: MC-CAL-3162
    outcome_code: '71'
    wrong_work: '$f(x)=\sin x$ 또는 $f(x)=-\sin x$(전체)라 하여 가능한 값을 $0$ 하나로 답함'
    detect_cue: 구간마다 부호를 바꿀 수 있음을 고려하지 않았다
    feedback: $\sin x=0$인 점에서 $\pm\sin x$가 이어 붙여지므로 구간마다 독립적으로 부호를 고를 수 있습니다.
    remedy: [RL-1]
  - id: MC-CAL-3161
    outcome_code: '72'
    wrong_work: '$\tfrac{d}{dx}\int_0^x(x-t)f(t)^2dt=(x-x)f(x)^2=0$으로 처리'
    detect_cue: 피적분함수의 $x$를 적분 밖으로 빼지 않고 미분
    feedback: 피적분함수에 $x$가 있으면 먼저 $x\int_0^xf^2-\int_0^xtf^2$로 분리한 뒤 미분하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    닫힌구간 $[0,100\pi]$에서 $p(x)=kf(x)$를 확률밀도함수로 갖는 연속확률변수를 $X$라 하자. $p(x)$와 $\mathrm{E}(X)$를 각각 구하시오. (단, $k$는 양의 상수이며, $\mathrm{E}(X)$는 $X$의 평균이다.)
  points: 20
  depends_on: ['2']
  answer: {kind: expression, value: 'p(x) = Abs(sin(x))/200; E(X) = 50*pi', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $p\ge0$이므로 $f=\lvert\sin x\rvert$, $k=\dfrac1{200}$. 평균은 구간별 부분적분(또는 대칭).
    steps:
    - {id: 3a, content: '$f=\lvert\sin x\rvert$, $200k=1$, $\mathrm{E}(X)=\tfrac1{200}(\pi+3\pi+\cdots+199\pi)=50\pi$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2']}
    hint_ladder:
    - 확률밀도함수가 가져야 할 성질 두 가지는?
    - $\int x\sin x\,dx$를 부분적분으로 구하자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.180~181
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $p(x)=kf(x)$가 확률밀도함수이려면 $p(x)\ge0$이어야 하므로 $k>0$에서 $f(x)\ge0$, 즉 (2-2)의 분류 중 $f(x)=\lvert\sin x\rvert$이다.
        $\displaystyle\int_0^{100\pi}p(x)\,dx=k\int_0^{100\pi}\lvert\sin x\rvert\,dx=200k=1$이므로 $k=\dfrac1{200}$, $p(x)=\dfrac1{200}\lvert\sin x\rvert$이다.
      criteria: ['3.M1', '3.A1']
    - id: 3b-2
      content: |
        $\mathrm{E}(X)=\dfrac1{200}\displaystyle\int_0^{100\pi}x\lvert\sin x\rvert\,dx=\dfrac1{200}\sum_{n=0}^{99}(-1)^n\int_{n\pi}^{(n+1)\pi}x\sin x\,dx$이고, 부분적분으로 $\int x\sin x\,dx=\sin x-x\cos x+C$이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $(-1)^n\big[\sin x-x\cos x\big]_{n\pi}^{(n+1)\pi}=(n+1)\pi+n\pi=(2n+1)\pi$이므로
        $\mathrm{E}(X)=\dfrac1{200}(\pi+3\pi+5\pi+\cdots+199\pi)=\dfrac{100^2\pi}{200}=50\pi$이다.
      criteria: ['3.A2']
  - id: S3-ALT
    audience: ALT
    method_no: 2
    key_idea: 자체 풀이 — $p(100\pi-x)=p(x)$이므로 $X$의 분포는 $x=50\pi$에 대해 대칭이고 $\mathrm{E}(X)=50\pi$.
    steps:
    - id: 3c-1
      content: |
        $x\to100\pi-x$ 치환으로 $\int_0^{100\pi}xp(x)dx=\int_0^{100\pi}(100\pi-x)p(x)dx$이므로 $2\mathrm{E}(X)=100\pi$, $\mathrm{E}(X)=50\pi$.
      criteria: ['3.M2', '3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        $p(x)\ge0$ 조건으로 $f=\lvert\sin x\rvert$를 택하고 전체 적분 1 조건을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.R1], max_points: 5}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        $p(x)=\dfrac1{200}\lvert\sin x\rvert$.
      depends_on: [3.M1]
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: |
        $\mathrm{E}(X)=\int xp(x)dx$를 구간별 부분적분(또는 대칭성)으로 계산하려 했다.
      depends_on: []
      implied_ok: false
      steps: [3b-2, 3c-1]
    - id: 3.A2
      mark_type: A
      points: 5
      evidence: |
        $\mathrm{E}(X)=50\pi$.
      depends_on: [3.M2, 3.A1]
      steps: [3b-3, 3c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점(구간별 부분적분)}
  - {code: '21', meaning: 만점(대칭성)}
  - {code: '71', misconception: MC-PRB-3163}
  misconceptions:
  - id: MC-PRB-3163
    outcome_code: '71'
    wrong_work: '$f=\sin x$로 두고 $\int_0^{100\pi}k\sin x\,dx=0=1$에서 모순이라 하거나 $k$를 구하지 못함'
    detect_cue: $p(x)\ge0$ 조건을 쓰지 않았다
    feedback: 확률밀도함수는 음이 아니어야 하므로 (2-2)의 여러 $f$ 중 $\lvert\sin x\rvert$만 가능합니다.
    remedy: [RL-3]

