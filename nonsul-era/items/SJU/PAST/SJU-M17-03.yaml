intent: |
  지수함수와 거듭제곱함수가 접하는 조건으로 매개변수를 정하고, $\lvert u(x)\rvert$의 미분불가능점이 '부호가 바뀌는 근'임을 근거로 교점 개수를 $a$와 $k$의 홀짝에 따라 분류한 뒤 합으로 개수를 세는 능력을 본다.
key_idea: |
  $\lvert u\rvert$는 $u(c)=0$, $u'(c)\ne0$인 점에서 미분불가능하고, $e^{ax}=x^k$의 양의 근 개수는 $ax=k\ln x$에서 $a$와 $\dfrac ke$의 대소로 정해진다(음의 근은 $k$가 짝수일 때 하나).
stuck: |
  $\lvert e^{ax}-x^k\rvert$의 미분불가능점 개수를 $k$의 홀짝과 $a\gtrless\dfrac ke$로 표로 정리하고, 서로 다른 $k$의 교점이 겹치지 않음을 확인해 단순 합으로 세는 것
idea_tags: [IDEA-ABS-NONDIFF-SIGN-CHANGE, IDEA-LOG-LINEARIZE-INTERSECTION]
tags: [구교육과정, 미분가능성, 절댓값 함수, 공통접선]
