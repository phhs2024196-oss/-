- id: '3'
  stem: |
    관계식 ①이 성립할 때, 가능한 $c$의 최댓값과 최솟값을 구하시오.
  points: 60
  depends_on:
  - '1'
  answer:
    kind: value
    value: max=(exp(2)-1)/(exp(2)-3); min=0
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g\ge0$ ⇔ $f'\ge0$; $f''=ae^{-x}$로 $f'$이 단조 ⇒ $f'(-1)=c\ge0$, $f'(1)\ge0$.
    steps:
    - id: 3a
      content: $0\le c\le\tfrac{e^2-1}{e^2-3}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.R1
      - 3.A1
    hint_ladder:
    - 확률밀도함수의 조건은?
    - $f'$은 단조인가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.165
    steps:
    - id: 3b-1
      content: |
        (1)의 두 식 $ae-b+c=0$, $\dfrac ae+b+c=1$을 풀면 $a=\dfrac{e}{1+e^2}-\dfrac{2e}{1+e^2}c$, $b=\dfrac{e^2}{1+e^2}-\dfrac{e^2-1}{1+e^2}c$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $g$는 확률밀도함수이므로 $g(x)=\dfrac{d}{dx}\dfrac{2f(x)}{1+f(x)}=\dfrac{2f'(x)}{\{1+f(x)\}^2}\ge0$, 즉 $-1\le x\le1$에서 $f'(x)=-ae^{-x}+b\ge0$이어야 한다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $f''(x)=ae^{-x}$의 부호는 $a$의 부호로 일정하므로 $f'$은 증가하거나 감소한다. 따라서 $f'(-1)\ge0$과 $f'(1)\ge0$만 만족하면 된다.
      criteria:
      - 3.R1
    - id: 3b-4
      content: |
        $f'(-1)=-ae+b=c\ge0$, $f'(1)=-\dfrac ae+b=\dfrac{e^2-1}{e^2+1}-\dfrac{e^2-3}{e^2+1}c\ge0$이므로 $0\le c\le\dfrac{e^2-1}{e^2-3}$이다. 최솟값은 $0$, 최댓값은 $\dfrac{e^2-1}{e^2-3}$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        $a$, $b$를 $c$로 나타냈다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 1.A1
        max_points: 15
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        $g\ge0$을 $f'\ge0$으로 바꿨다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-2
    - id: 3.R1
      mark_type: R
      points: 15
      evidence: |
        $f''$의 부호가 일정해 양 끝점만 확인하면 됨을 보였다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        최솟값 $0$, 최댓값 $\tfrac{e^2-1}{e^2-3}$을 얻었다.
      depends_on:
      - 3.R1
      - 3.M1
      steps:
      - 3b-4
    deductions: []
