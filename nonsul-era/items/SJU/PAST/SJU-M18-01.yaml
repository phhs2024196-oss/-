stimuli: []
stem: |
  실수인 상수 $a$, $b$, $c$에 대해 함수 $f(x)$는 $f(x)=ae^{-x}+bx+c$로 정의된다.
  연속확률변수 $X$의 확률밀도함수 $g(x)$ $(-1\le x\le1)$와 함수 $f(x)$에 대해 관계식
  $$\mathrm{P}(-1\le X\le x)=\int_{-1}^xg(t)\,dt=\dfrac{2f(x)}{1+f(x)}\quad(\text{단, }-1\le x\le1)\quad\cdots\cdots①$$
  이 성립할 때, 다음 물음에 각각 답하시오.
subparts:
- id: '1'
  stem: |
    $f(-1)$과 $f(1)$의 값을 각각 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: f(-1)=0; f(1)=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=-1$이면 확률 0, $x=1$이면 전체 확률 1.
    steps:
    - id: 1a
      content: $\tfrac{2f(-1)}{1+f(-1)}=0$, $\tfrac{2f(1)}{1+f(1)}=1$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - $x=-1$, $x=1$을 대입하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.165
    steps:
    - id: 1b-1
      content: |
        $x=-1$을 대입하면 $\displaystyle\int_{-1}^{-1}g(t)\,dt=0=\dfrac{2f(-1)}{1+f(-1)}$이므로 $f(-1)=0$이다.
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-2
      content: |
        $x=1$을 대입하면 $\displaystyle\int_{-1}^1g(t)\,dt=1=\dfrac{2f(1)}{1+f(1)}$이므로 $f(1)=1$이다.
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: |
        $x=-1$, $x=1$을 대입하고 전체 확률이 1임을 썼다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
    - id: 1.A1
