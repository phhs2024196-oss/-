- id: '2'
  stem: |
    $c=\dfrac12$일 때, $\mathrm{P}\left(-1\le X\le\dfrac12\right)$을 구하시오.
  points: 60
  depends_on:
  - '1'
  answer:
    kind: value
    value: 6/7
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $ae-b+c=0$, $\tfrac ae+b+c=1$, $c=\tfrac12$ ⇒ $f(x)=\tfrac12(x+1)$.
    steps:
    - id: 2a
      content: $\tfrac{2\cdot3/4}{1+3/4}=\tfrac67$
      criteria:
      - 2.M1
      - 2.A1
      - 2.A2
    hint_ladder:
    - (1)의 두 값을 $a$, $b$, $c$로 쓰자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.165
    steps:
    - id: 2b-1
      content: |
        (1)의 결과와 $c=\dfrac12$에서 $ae-b+\dfrac12=0$, $\dfrac ae+b+\dfrac12=1$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        두 식을 더하면 $a\left(e+\dfrac1e\right)=0$이므로 $a=0$, $b=\dfrac12$이고 $f(x)=\dfrac12(x+1)$이다.
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        $f\left(\dfrac12\right)=\dfrac34$이므로 $\mathrm{P}\left(-1\le X\le\dfrac12\right)=\dfrac{3/2}{1+3/4}=\dfrac67$이다.
      criteria:
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        (1)의 두 조건과 $c=\tfrac12$로 연립방정식을 세웠다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 1.A1
        max_points: 20
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $a=0$, $b=\tfrac12$, $f(x)=\tfrac12(x+1)$을 얻었다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        $\tfrac67$을 얻었다.
      depends_on:
      - 2.M1
      - 2.A1
      steps:
      - 2b-3
    deductions: []
