- id: '3'
  stem: |
    점 $\mathrm{P}$가 정육각형 $H$의 한 변을 $2:1$로 내분하는 점일 때, $\lvert\overrightarrow{\mathrm{AP}}+\overrightarrow{\mathrm{BQ}}\rvert$의 최댓값을 구하시오.
  points: 60
  depends_on:
  - '2'
  answer:
    kind: value
    value: 2*sqrt(10)/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{OP}}=\tfrac{\vec a+2\vec b}3$, $\mathrm{Q}=\mathrm{F}$일 때 $\lvert\tfrac{\vec a+5\vec b}3\rvert=\tfrac{\sqrt{31}}3$.
    steps:
    - id: 3a
      content: $\sqrt{1+\tfrac{31}9}=\tfrac{2\sqrt{10}}3$
      criteria:
      - 3.M1
      - 3.M2
      - 3.R1
      - 3.A1
    hint_ladder:
    - $\overrightarrow{\mathrm{OP}}$를 두 꼭짓점 벡터로 나타내자.
    - $\mathrm{Q}$는 어느 꼭짓점일 때 최대인가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.166~167
    steps:
    - id: 3b-1
      content: |
        (2)에서처럼 $\lvert\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OQ}}\rvert$가 최대일 때 $\lvert\overrightarrow{\mathrm{AP}}+\overrightarrow{\mathrm{BQ}}\rvert$가 최대이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\mathrm{P}$가 변 $\mathrm{EF}$를 $2:1$로 내분하고 $\overrightarrow{\mathrm{OE}}=\vec a$, $\overrightarrow{\mathrm{OF}}=\vec b$라 하면 $\overrightarrow{\mathrm{OP}}=\dfrac{\vec a+2\vec b}3$이다($\lvert\vec a\rvert=\lvert\vec b\rvert=1$, $\vec a\cdot\vec b=\dfrac12$).
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $\lvert\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OQ}}\rvert$는 점 $-\overrightarrow{\mathrm{OP}}$에서 $\mathrm{Q}$까지의 거리이고 정육각형 위에서 가장 먼 점은 꼭짓점이다. 꼭짓점을 비교하면 $\mathrm{Q}=\mathrm{F}$일 때 최대이고 $\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OQ}}=\dfrac{\vec a+5\vec b}3$, 크기는 $\dfrac{\sqrt{25+10\vec a\cdot\vec b+1}}3=\dfrac{\sqrt{31}}3$이다.
      criteria:
      - 3.R1
    - id: 3b-4
      content: |
        따라서 최댓값은 $\sqrt{1+\dfrac{31}9}=\dfrac{2\sqrt{10}}3$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        (2)의 분해로 $\lvert\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OQ}}\rvert$ 최대 문제로 바꿨다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 2.R1
        max_points: 15
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        $\overrightarrow{\mathrm{OP}}=\tfrac{\vec a+2\vec b}3$으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-2
    - id: 3.R1
      mark_type: R
      points: 15
      evidence: |
        $\mathrm{Q}$가 꼭짓점 $\mathrm{F}$일 때 최대임을 근거(꼭짓점 비교·그림)와 함께 보였다.
      depends_on:
      - 3.M1
      - 3.M2
      steps:
      - 3b-3
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $\tfrac{2\sqrt{10}}3$을 얻었다.
      depends_on:
      - 3.R1
      steps:
      - 3b-4
    deductions: []
