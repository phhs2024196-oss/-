- id: '2'
  stem: |
    벡터 $\overrightarrow{\mathrm{AP}}+\overrightarrow{\mathrm{BQ}}$의 크기 $\lvert\overrightarrow{\mathrm{AP}}+\overrightarrow{\mathrm{BQ}}\rvert$의 최댓값을 구하시오.
  points: 60
  depends_on:
  - '1'
  answer:
    kind: value
    value: sqrt(5)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{AO}}+\overrightarrow{\mathrm{BO}}\perp\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OQ}}$, 크기 1과 최대 2.
    steps:
    - id: 2a
      content: $\sqrt{1+4}=\sqrt5$
      criteria:
      - 2.M1
      - 2.R1
      - 2.A1
    hint_ladder:
    - $\overrightarrow{\mathrm{AP}}=\overrightarrow{\mathrm{AO}}+\overrightarrow{\mathrm{OP}}$로 나누자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.166
    steps:
    - id: 2b-1
      content: |
        $\overrightarrow{\mathrm{AP}}+\overrightarrow{\mathrm{BQ}}=(\overrightarrow{\mathrm{AO}}+\overrightarrow{\mathrm{BO}})+(\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OQ}})$이고 앞의 벡터는 직선 $\mathrm{AB}$ 방향, 뒤의 벡터는 원 $C$의 평면 위에 있어 서로 수직이다.
      criteria:
      - 2.M1
      - 2.R1
    - id: 2b-2
      content: |
        $\lvert\overrightarrow{\mathrm{AO}}+\overrightarrow{\mathrm{BO}}\rvert=\lvert3-2\rvert=1$이므로 $\lvert\overrightarrow{\mathrm{AP}}+\overrightarrow{\mathrm{BQ}}\rvert^2=1+\lvert\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OQ}}\rvert^2$이다.
      criteria:
      - 2.R1
    - id: 2b-3
      content: |
        $\lvert\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OQ}}\rvert\le\lvert\overrightarrow{\mathrm{OP}}\rvert+\lvert\overrightarrow{\mathrm{OQ}}\rvert\le2$이고 $\mathrm{P}=\mathrm{Q}$가 정육각형의 꼭짓점일 때 등호가 성립하므로 최댓값은 $\sqrt{1+4}=\sqrt5$이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $\mathrm{O}$를 거쳐 두 벡터의 합으로 분해했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.R1
      mark_type: R
      points: 20
      evidence: |
        두 부분이 수직이고 $\lvert\overrightarrow{\mathrm{AO}}+\overrightarrow{\mathrm{BO}}\rvert=1$임을 보였다.
      depends_on:
      - 2.M1
      ft:
        allowed: true
        from:
        - 1.A1
        max_points: 20
      steps:
      - 2b-1
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $\lvert\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{OQ}}\rvert\le2$의 달성을 밝히고 $\sqrt5$를 얻었다.
      depends_on:
      - 2.R1
      steps:
      - 2b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  - code: '71'
    misconception: MC-GEO-3137
  misconceptions:
  - id: MC-GEO-3137
    outcome_code: '71'
    wrong_work: $\lvert\overrightarrow{\mathrm{AO}}+\overrightarrow{\mathrm{BO}}\rvert=5$로 두어 $\sqrt{29}$
    detect_cue: $\overrightarrow{\mathrm{AO}}$, $\overrightarrow{\mathrm{BO}}$가 반대 방향임을 무시
    feedback: $\overrightarrow{\mathrm{AO}}$와 $\overrightarrow{\mathrm{BO}}$는 서로 반대 방향입니다.
    remedy:
