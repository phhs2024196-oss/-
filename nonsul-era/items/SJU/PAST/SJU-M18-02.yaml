    outcome_code: '71'
    wrong_work: 원의 중심을 $\mathrm{AB}$의 중점으로 둠
    detect_cue: $x=y=\tfrac52$
    feedback: 교선 원의 중심은 두 구의 반지름에 따라 정해지며 중점이 아닙니다.
