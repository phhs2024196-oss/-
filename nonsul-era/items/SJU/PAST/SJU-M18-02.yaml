stimuli: []
stem: |
  반지름의 길이가 $\sqrt5$인 구 $S_1$과 반지름의 길이가 $\sqrt{10}$인 구 $S_2$가 있다. 두 구의 중심점을 각각 $\mathrm{A}$, $\mathrm{B}$라 할 때, 선분 $\mathrm{AB}$의 길이는 $5$이다. 두 구가 만나서 생기는 원 $C$에 내접하는 정육각형 $H$위를 움직이는 두 점을 $\mathrm{P}$, $\mathrm{Q}$라 할 때, 다음 물음에 각각 답하시오.
  (그림: 겹친 두 구 $S_1$, $S_2$와 중심 $\mathrm{A}$, $\mathrm{B}$($\overline{\mathrm{AB}}=5$), 교선 원 $C$와 그에 내접한 정육각형 $H$, 원 위의 점까지 $\sqrt5$, $\sqrt{10}$)
subparts:
- id: '1'
  stem: |
    원 $C$의 반지름의 길이를 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $C$의 중심 $\mathrm{O}$는 $\mathrm{AB}$ 위, $x+y=5$, $x^2+r^2=5$, $y^2+r^2=10$.
    steps:
    - id: 1a
      content: $x=2$, $y=3$, $r=1$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - 원 위의 점과 두 중심을 이은 삼각형을 그려 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.166
    steps:
    - id: 1b-1
      content: |
        원 $C$ 위의 점 $\mathrm{X}$에서 선분 $\mathrm{AB}$에 내린 수선의 발을 $\mathrm{O}$라 하면 $\mathrm{O}$는 원 $C$의 중심이다. $\overline{\mathrm{AO}}=x$, $\overline{\mathrm{BO}}=y$라 하면 $x+y=5$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        삼각형 $\mathrm{XAO}$, $\mathrm{XOB}$는 직각삼각형이므로 $x^2+r^2=5$, $y^2+r^2=10$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        연립하면 $y^2-x^2=5$, $y-x=1$에서 $x=2$, $y=3$, $r=1$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: |
        원의 중심이 $\mathrm{AB}$ 위의 수선의 발임을 쓰고 세 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 30
      evidence: |
        $r=1$을 얻었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
    deductions: []
