  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: '홀수차항의 적분은 0: $\tfrac{12}5+\tfrac43c$, $c>0$.'
    steps:
    - id: 4a
      content: 최솟값 $\tfrac{12}5$ ($f=x^4+1$)
      criteria:
      - 4.M1
      - 4.R1
      - 4.A1
    hint_ladder:
    - $[-1,1]$에서 홀수차항의 적분은?
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.169
    steps:
    - id: 4b-1
      content: |
        (i) $f(x)=x^4+1$이면 $\displaystyle\int_{-1}^1f(x)\,dx=\dfrac{12}5$이다.
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        (ii) $f(x)=x^4+\dfrac43bx^3+2cx^2+1$ $(b^2<4c)$이면 $c>\dfrac{b^2}4\ge0$이고, 홀수차항의 적분은 0이므로 $\displaystyle\int_{-1}^1f(x)\,dx=2\int_0^1(x^4+2cx^2+1)\,dx=\dfrac{12}5+\dfrac43c>\dfrac{12}5$이다.
      criteria:
      - 4.M1
      - 4.R1
    - id: 4b-3
      content: |
        (i), (ii)에서 최솟값은 $\dfrac{12}5$이다.
      criteria:
      - 4.A1
