- id: '3'
  stem: |
    함수 $f(x)$로 가능한 것을 모두 구하시오.
  points: 60
  depends_on:
  - '2'
  answer:
    kind: set
    value: x**4+1; x**4+(4/3)*b*x**3+2*c*x**2+1 (b**2<4*c)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g''=f'e^{-f}(1-f)$의 근이 $x=0$뿐 ⇒ $f'$의 실근은 0뿐.
    steps:
    - id: 3a
      content: $f=x^4+1$ 또는 $x^4+\tfrac43bx^3+2cx^2+1$ $(b^2<4c)$
      criteria:
      - 3.M1
      - 3.R1
      - 3.A1
      - 3.R2
    hint_ladder:
    - $g''$을 구하자.
    - $f'(x)=0$의 실근은 몇 개일 수 있는가?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.168~169
    steps:
    - id: 3b-1
      content: |
        $g''(x)=f'(x)e^{-f(x)}\{1-f(x)\}$이므로 (다)에서 $f'(x)\{1-f(x)\}=0$의 실근이 1개이다. $f(0)=1$이므로 $x=0$이 그 근이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $f'(x)$는 삼차식이라 실근을 적어도 하나 가지므로 그 실근은 $x=0$뿐이어야 한다. 따라서 $f'(x)=4x^3$ 또는 $f'(x)=4x(x^2+bx+c)$ $(b^2-4c<0)$이다.
      criteria:
      - 3.R1
    - id: 3b-3
      content: |
        $f'(x)=4x^3$이면 $f(x)=x^4+1$이고 $1-f(x)=-x^4=0$의 해는 $x=0$뿐이므로 조건을 만족한다.
      criteria:
      - 3.A1
      - 3.R2
    - id: 3b-4
      content: |
        $f'(x)=4x(x^2+bx+c)$이면 $f(x)=x^4+\dfrac43bx^3+2cx^2+1$이다. $0\le b^2<4c$에서 $x^2+\dfrac{4b}3x+2c$의 판별식은 $\dfrac{16b^2}9-8c<\dfrac{64c}9-8c=-\dfrac{8c}9<0$이므로 $x^2+\dfrac{4b}3x+2c>0$이고 $1-f(x)=-x^2\left(x^2+\dfrac{4b}3x+2c\right)=0$은 $x=0$만 실근으로 갖는다. 따라서 조건을 만족한다.
      criteria:
      - 3.A1
      - 3.R2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        $g''(x)=f'(x)e^{-f(x)}\{1-f(x)\}$를 구했다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 2.A1
        max_points: 15
      steps:
