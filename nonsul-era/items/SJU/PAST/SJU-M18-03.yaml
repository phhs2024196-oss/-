      points: 15
      evidence: |
        $f'$의 실근이 0뿐이어야 함을 근거와 함께 보였다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        두 꼴 $x^4+1$, $x^4+\tfrac43bx^3+2cx^2+1$ $(b^2<4c)$를 얻었다.
      depends_on:
      - 3.R1
      steps:
      - 3b-3
      - 3b-4
    - id: 3.R2
      mark_type: R
      points: 15
      evidence: |
        각 경우 $1-f(x)=0$의 실근이 0뿐임을 확인했다.
      depends_on:
      - 3.A1
      steps:
      - 3b-3
      - 3b-4
    deductions: []
