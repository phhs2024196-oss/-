stimuli: []
stem: |
  사차함수 $f(x)$와 함수 $g(x)=\displaystyle\int_0^xf(t)e^{-f(t)}dt$가 다음 조건을 만족시킨다.

  (가) $f(x)$의 최고차항의 계수는 $1$이다.

  (나) $g'(0)=\dfrac1e$

  (다) 집합 $\{x\mid g''(x)=0\text{ 이고 }x\text{는 실수}\}$의 원소의 개수는 $1$이다.

  다음 물음에 각각 답하시오.
subparts:
- id: '1'
  stem: |
    함수 $h(x)=xe^{-x}$의 도함수와 이계도함수를 이용하여 좌표평면에 곡선 $y=h(x)$의 개형을 그리시오. 또한, 함수의 극값과 곡선의 변곡점의 좌표를 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: max=exp(-1) (x=1); inflection=(2, 2*exp(-2))
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $h'=(1-x)e^{-x}$, $h''=(x-2)e^{-x}$.
    steps:
    - id: 1a
      content: 극댓값 $\tfrac1e$ ($x=1$), 변곡점 $(2,\tfrac2{e^2})$
      criteria:
      - 1.M1
      - 1.A1
      - 1.A2
      - 1.B1
    hint_ladder:
    - 곱의 미분으로 $h'$을 구하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.168
    steps:
    - id: 1b-1
      content: |
        $h'(x)=(1-x)e^{-x}$, $h''(x)=(x-2)e^{-x}$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x<1$에서 $h'>0$, $x>1$에서 $h'<0$이므로 $x=1$에서 극댓값 $h(1)=\dfrac1e$를 갖는다.
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        $x<2$에서 $h''<0$(위로 볼록), $x>2$에서 $h''>0$(아래로 볼록)이므로 변곡점은 $\left(2,\dfrac2{e^2}\right)$이다.
      criteria:
      - 1.A2
    - id: 1b-4
      content: |
        개형: 원점을 지나고 $x=1$까지 증가해 최댓값 $\dfrac1e$에 이른 뒤 감소하며, $x=2$에서 볼록성이 바뀌고 $x\to\infty$이면 $h(x)\to0$, $x\to-\infty$이면 $h(x)\to-\infty$이다.
      criteria:
      - 1.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        $h'$, $h''$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        극댓값 $\tfrac1e$ ($x=1$)를 얻었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        변곡점 $(2,\tfrac2{e^2})$를 얻었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
    - id: 1.B1
      mark_type: B
      points: 15
      evidence: |
        원점 통과, 증가·감소, $x\to\pm\infty$의 극한이 반영된 개형을 그렸다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-4
