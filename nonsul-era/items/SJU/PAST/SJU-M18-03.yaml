  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.168
    steps:
    - id: 2b-1
      content: |
        정적분과 미분의 관계에서 $g'(x)=f(x)e^{-f(x)}$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        (1)의 그래프에서 $h(t)=te^{-t}=\dfrac1e$을 만족하는 $t$는 최댓값을 갖는 $t=1$뿐이다. $g'(0)=f(0)e^{-f(0)}=\dfrac1e$이므로 $f(0)=1$이다.
      criteria:
      - 2.R1
      - 2.A1
  rubric:
