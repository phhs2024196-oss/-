stimuli: []
stem: |
  두 어린이 $A$와 $B$가 가위바위보 게임을 한다. 그런데 매 게임마다 $A$는 가위와 바위, $B$는 바위와 보 중에 임의로 내며, 게임의 횟수를 셀 때는 비긴 게임도 포함한다.
subparts:
- id: '1'
  stem: |
    5번 게임을 하면서 $A$는 ‘가위, 바위, 가위, 바위, 가위’를 냈는데 2번 이기고 2번 지고, 1번 비겼다. 이런 결과가 나올 수 있도록 $B$가 낼 수 있는 방법의 수를 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: '6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $A$ 승 = (가위, 보), 무 = (바위, 바위)뿐 ⇒ 무는 바위 자리, 승은 가위 자리.
    steps:
    - id: 1a
      content: ${}_3\mathrm{C}_2\times{}_2\mathrm{C}_1=6$
      criteria:
      - 1.M1
      - 1.R1
      - 1.A1
    hint_ladder:
    - $A$가 비길 수 있는 경우는 몇 가지인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.152
    steps:
    - id: 1b-1
      content: |
        $A$와 $B$가 낸 것을 $(A,B)$로 나타내면, $A$가 비기는 경우는 (바위, 바위), 이기는 경우는 (가위, 보), 지는 경우는 (가위, 바위)와 (바위, 보)뿐이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        한 번 비겨야 하므로 $A$의 '바위' 두 자리 중 한 곳에서 $B$는 바위를 내고, 두 번 이겨야 하므로 $A$의 '가위' 세 자리 중 두 곳에서 $B$는 보를 낸다. 나머지 '바위' 자리에는 보, 나머지 '가위' 자리에는 바위를 내야 2번 진다.
      criteria:
      - 1.R1
    - id: 1b-3
      content: |
        따라서 방법의 수는 $2\times3=6$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        네 가지 $(A,B)$ 조합의 승·무·패를 정리했다.
      depends_on: []
      implied_ok: false
      steps:
      - 1b-1
    - id: 1.R1
      mark_type: R
      points: 20
      evidence: |
        비김은 바위 자리, 이김은 가위 자리에서만 가능함을 근거로 배치를 정했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $6$을 얻었다.
      depends_on:
      - 1.R1
      steps:
      - 1b-3
    deductions: []
