    outcome_code: '71'
    wrong_work: 승2·패2·무1의 배열 수 $\tfrac{5!}{2!2!1!}=30$
    detect_cue: $A$의 고정된 순서를 무시한 배열
    feedback: $A$가 낸 것이 정해져 있으므로 각 자리에서 가능한 결과가 제한됩니다.
    remedy:
    - RL-1
- id: '2'
  stem: |
    $A$와 $B$가 게임을 하는데 $A$가 적어도 1번 이상 이길 확률이 0.5 이상 되기 위해서는 게임을 몇 번 이상 하여야 하는지 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 한 판에서 $A$가 이길 확률 $\tfrac14$; $1-(\tfrac34)^n\ge\tfrac12$.
    steps:
    - id: 2a
      content: '$n=2$: $\tfrac7{16}$, $n=3$: $\tfrac{37}{64}$ ⇒ 3번'
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - 한 판에서 이길 확률은?
    - '''적어도 한 번''은 여사건으로.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.152
    steps:
    - id: 2b-1
      content: |
        한 게임에서 가능한 $(A,B)$는 (가위,보), (바위,바위), (가위,바위), (바위,보)의 네 가지가 같은 확률로 일어나고, $A$가 이기는 것은 (가위,보)뿐이므로 이길 확률은 $\dfrac14$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $n$번 게임에서 적어도 1번 이길 확률은 한 번도 이기지 못할 확률의 여사건이므로 $1-\left(\dfrac34\right)^n$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $1-\left(\dfrac34\right)^n\ge0.5$에서 $n=2$이면 $\dfrac7{16}<\dfrac12$, $n=3$이면 $\dfrac{37}{64}\ge\dfrac12$이므로 3번 이상 해야 한다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        한 판에 이길 확률 $\tfrac14$을 구했다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 20
      evidence: |
        여사건으로 $1-(\tfrac34)^n$을 세웠다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $n=2,3$을 확인해 3번을 얻었다.
      depends_on:
      - 2.M1
      - 2.M2
      steps:
      - 2b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  - code: '71'
    misconception: MC-CNT-3135
  misconceptions:
  - id: MC-CNT-3135
    outcome_code: '71'
    wrong_work: 이길 확률을 $\tfrac12$로 두어 $n=1$
    detect_cue: $p=\tfrac12$
    feedback: 네 가지 조합 중 $A$가 이기는 것은 하나뿐입니다.
    remedy:
    - RL-1
- id: '3'
  stem: |
    게임을 $n$번 하였을 때 $A$가 이긴 횟수 $k$에 대하여, $A$가 받는 상금 $9^k$(원)을 확률변수 $X$라 하자. 기댓값 $\mathrm{E}(X)$를 구하시오.
  points: 60
  depends_on:
  - '2'
  answer:
    kind: expression
    value: 3**n
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 이긴 횟수는 $\mathrm{B}(n,\tfrac14)$, 이항정리.
    steps:
    - id: 3a
      content: $\sum{}_n\mathrm{C}_k(\tfrac94)^k(\tfrac34)^{n-k}=3^n$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
    hint_ladder:
    - 이긴 횟수의 분포는?
    - $\sum{}_n\mathrm{C}_ka^kb^{n-k}=(a+b)^n$
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.152
    steps:
    - id: 3b-1
      content: |
        이긴 횟수가 $k$일 확률은 ${}_n\mathrm{C}_k\left(\dfrac14\right)^k\left(\dfrac34\right)^{n-k}$이므로 $\mathrm{P}(X=9^k)={}_n\mathrm{C}_k\left(\dfrac14\right)^k\left(\dfrac34\right)^{n-k}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\mathrm{E}(X)=\displaystyle\sum_{k=0}^n9^k\,{}_n\mathrm{C}_k\left(\dfrac14\right)^k\left(\dfrac34\right)^{n-k}=\sum_{k=0}^n{}_n\mathrm{C}_k\left(\dfrac94\right)^k\left(\dfrac34\right)^{n-k}$.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        이항정리에 의해 $\mathrm{E}(X)=\left(\dfrac94+\dfrac34\right)^n=3^n$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $\mathrm{P}(X=9^k)$를 이항분포로 썼다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 2.M1
        max_points: 20
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        기댓값을 합으로 세우고 $9^k$를 묶었다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        이항정리로 $3^n$을 얻었다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
    deductions: []
