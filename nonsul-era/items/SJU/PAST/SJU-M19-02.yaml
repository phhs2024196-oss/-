- id: '3'
  stem: |
    $D$위의 임의의 점을 $P$라 할 때, $\overrightarrow{OP}\cdot\overrightarrow{OA}$의 최솟값을 구하시오.
  points: 60
  depends_on:
  - '1'
  - '2'
  answer:
    kind: value
    value: (1-sqrt(6))/14
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\angle POB=\tfrac\pi4$로 일정 ⇒ $\angle POA$의 최댓값 $\alpha+\tfrac\pi4$.
    steps:
    - id: 3a
      content: $\lvert OA\rvert\cos(\alpha+\tfrac\pi4)=\tfrac{1-\sqrt6}{14}$
      criteria:
      - 3.M1
      - 3.R1
      - 3.M2
      - 3.A1
    hint_ladder:
    - $P$가 원 $D$ 위를 움직일 때 $\angle POB$는 일정한가?
    - $\angle POA$가 가장 클 때는?
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.153
    steps:
    - id: 3b-1
      content: |
        $\lvert\overrightarrow{OP}\rvert=1$, $\lvert\overrightarrow{OB}\rvert=\dfrac1{\sqrt2}$이고 $OB\perp BP$이므로 $\cos(\angle POB)=\dfrac1{\sqrt2}$, 즉 $\angle POB=\dfrac\pi4$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        따라서 $\angle POA\le\angle POB+\angle BOA=\alpha+\dfrac\pi4$이고, $P$가 평면 $OAB$ 위에서 $A$의 반대쪽에 있을 때 등호가 성립한다. 그러므로 $\cos(\angle POA)$의 최솟값은 $\cos\left(\alpha+\dfrac\pi4\right)$이다.
      criteria:
      - 3.R1
    - id: 3b-3
      content: |
        $\overrightarrow{OP}\cdot\overrightarrow{OA}$의 최솟값은 $1\cdot\dfrac1{\sqrt{14}}\left(\cos\alpha\cos\dfrac\pi4-\sin\alpha\sin\dfrac\pi4\right)=\dfrac1{\sqrt{14}}\left(\dfrac1{\sqrt7}\cdot\dfrac1{\sqrt2}-\dfrac{\sqrt6}{\sqrt7}\cdot\dfrac1{\sqrt2}\right)=\dfrac{1-\sqrt6}{14}$이다.
      criteria:
      - 3.M2
      - 3.A1
  - id: S3-ALT
    audience: ALT
    method_no: 2
    key_idea: $\overrightarrow{OA}$를 평면 $x+z=1$의 법선 성분과 평면 방향 성분으로 분해.
    steps:
    - id: 3c-1
      content: |
        $\overrightarrow{OP}=\overrightarrow{OB}+\overrightarrow{BP}$, $\lvert\overrightarrow{BP}\rvert=\dfrac1{\sqrt2}$이고 $\overrightarrow{BP}$는 평면 $x+z=1$에 평행하다. $\overrightarrow{OA}$의 그 평면 방향 성분의 크기는 $\sqrt{\dfrac1{14}-\left(\dfrac{1}{7\sqrt2}\right)^2}=\dfrac{\sqrt6}{7\sqrt2}$이다.
      criteria:
      - 3.M1
    - id: 3c-2
      content: |
        따라서 $\overrightarrow{OP}\cdot\overrightarrow{OA}\ge\overrightarrow{OB}\cdot\overrightarrow{OA}-\dfrac1{\sqrt2}\cdot\dfrac{\sqrt6}{7\sqrt2}=\dfrac1{14}-\dfrac{\sqrt6}{14}$이고 등호가 성립하므로 최솟값은 $\dfrac{1-\sqrt6}{14}$이다.
      criteria:
      - 3.R1
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        $\angle POB=\tfrac\pi4$임을 보였다.
      depends_on: []
      implied_ok: false
      steps:
      - 3b-1
      - 3c-1
    - id: 3.R1
      mark_type: R
      points: 15
      evidence: |
        $\angle POA$의 최댓값이 $\alpha+\tfrac\pi4$이고 달성됨을 근거로 들었다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
      - 3c-2
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        덧셈정리로 $\cos(\alpha+\tfrac\pi4)$를 계산했다.
      depends_on: []
      implied_ok: false
      ft:
        allowed: true
        from:
        - 2.A1
        max_points: 15
      steps:
      - 3b-3
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $\tfrac{1-\sqrt6}{14}$를 얻었다.
      depends_on:
      - 3.R1
      - 3.M2
      steps:
      - 3b-3
      - 3c-2
    deductions: []
