    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $B(\tfrac12,0,\tfrac12)$, 내적 $\tfrac1{14}$, $\lvert OA\rvert=\tfrac1{\sqrt{14}}$, $\lvert OB\rvert=\tfrac1{\sqrt2}$.
    steps:
    - id: 2a
      content: $\cos=\tfrac{1/14}{1/\sqrt{28}}=\tfrac{\sqrt7}7$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - $B$도 같은 방법으로 구하자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.153
    steps:
    - id: 2b-1
      content: |
        같은 방법으로 $\overrightarrow{OB}=(t,0,t)$, $2t=1$에서 $B\left(\dfrac12,0,\dfrac12\right)$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\angle AOB=\alpha$라 하면 $\overrightarrow{OA}\cdot\overrightarrow{OB}=-\dfrac1{28}+\dfrac3{28}=\dfrac1{14}=\dfrac1{\sqrt{14}}\cdot\dfrac1{\sqrt2}\cos\alpha$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        따라서 $\cos\alpha=\dfrac1{\sqrt7}=\dfrac{\sqrt7}7$이다.
      criteria:
      - 2.A1
  rubric:
    rules:
