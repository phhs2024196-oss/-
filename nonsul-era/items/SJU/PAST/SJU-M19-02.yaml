    $A$를 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: (-1/14, 1/7, 3/14)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{OA}$는 평면의 법선 $(-1,2,3)$과 평행.
    steps:
    - id: 1a
      content: $\overrightarrow{OA}=t(-1,2,3)$, $14t=1$
      criteria:
      - 1.M1
      - 1.A1
    hint_ladder:
    - 원의 중심과 구의 중심을 잇는 선분은 평면과 어떤 관계인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.153
    steps:
    - id: 1b-1
      content: |
        원의 중심 $A$는 구의 중심 $O$에서 평면에 내린 수선의 발이므로 $\overrightarrow{OA}$는 $(-1,2,3)$과 평행하다. $\overrightarrow{OA}=(-t,2t,3t)$로 둔다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $A$는 평면 $-x+2y+3z=1$ 위에 있으므로 $t+4t+9t=1$, $t=\dfrac1{14}$이고 $A\left(-\dfrac1{14},\dfrac17,\dfrac3{14}\right)$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
