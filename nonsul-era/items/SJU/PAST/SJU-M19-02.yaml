stem: |
  구 $x^2+y^2+z^2=1$과 평면 $-x+2y+3z=1$이 만나서 만드는 원의 중심을 $A$라 하자.
  구 $x^2+y^2+z^2=1$과 평면 $x+z=1$이 만나서 만드는 원 $D$의 중심을 $B$라 하자.
  (그림: 원점 $O$를 중심으로 하는 구, 평면 $x+z=1$과 구가 만나는 원 $D$와 그 중심 $B$, $D$ 위의 점 $P$, 원의 중심 $A$)
