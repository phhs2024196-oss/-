- id: '2'
  stem: |
    양의 실수 $h$와 $r$에 대하여 원 $x^2+(y-h)^2=r^2$이 곡선 $y=f(x)$와 한 점에서 만날 때, $r$의 최댓값을 구하시오.
  points: 60
  depends_on:
  - '1'
  answer:
    kind: value
    value: 1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 대칭성으로 만나는 점은 원점 ⇒ $h=r$, $x^2(x^2+1-2r)=0$이 0 외의 해가 없을 조건.
    steps:
    - id: 2a
      content: $2r-1\le0\Rightarrow r\le\tfrac12$
      criteria:
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.A2
    hint_ladder:
    - 곡선과 원은 모두 $y$축에 대칭이다.
    - $x=0$ 외의 해가 없을 조건은?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.154
    steps:
    - id: 2b-1
      content: |
        만나는 점을 $(b,b^2)$라 하면 $(-b,b^2)$도 만나는 점이다. 한 점에서만 만나므로 $b=-b$, 즉 $b=0$이고 원점에서만 만난다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        원이 원점을 지나므로 $h=r$이다.
      criteria:
      - 2.A1
    - id: 2b-3
      content: |
        $y=x^2$을 대입하면 $x^2+(x^2-r)^2=r^2$, 즉 $x^2(x^2+1-2r)=0$이다. $x=0$ 이외의 해가 없어야 하므로 $x^2=2r-1$이 해를 갖지 않거나 $x=0$뿐이어야 하고 $2r-1\le0$이다. 따라서 $r\le\dfrac12$이고 최댓값은 $\dfrac12$이다.
      criteria:
      - 2.M2
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        $y$축 대칭으로 만나는 점이 원점임을 보였다.
      depends_on: []
      implied_ok: false
      ft:
