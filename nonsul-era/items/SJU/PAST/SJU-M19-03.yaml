        max_points: 15
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        $h=r$을 얻었다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        연립해 $x^2(x^2+1-2r)=0$을 얻었다.
      depends_on: []
      implied_ok: false
      steps:
      - 2b-3
    - id: 2.A2
      mark_type: A
      points: 15
      evidence: |
        $2r-1\le0$에서 최댓값 $\tfrac12$을 얻었다.
      depends_on:
      - 2.M2
      - 2.A1
      steps:
      - 2b-3
    deductions: []
