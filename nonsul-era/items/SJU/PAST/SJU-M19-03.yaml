- id: '4'
  stem: |
    곡선 $y=f(x)$위의 점 $P$에서의 접선과 평행한 직선이 곡선 $y=-\dfrac12(x-2)^2+\dfrac14$와 점 $R$에서 접할 때, 선분 $\overline{PR}$의 길이의 최솟값을 구하시오.
  points: 60
  depends_on:
  - '1'
  answer:
    kind: value
    value: sqrt(2)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 기울기 일치 $2t=2-s$, $\overline{PR}^2=9t^4+\tfrac{15}2t^2-12t+\tfrac{65}{16}$.
    steps:
    - id: 4a
      content: $t=\tfrac12$에서 최소 $\tfrac12$ ⇒ $\tfrac{\sqrt2}2$
      criteria:
      - 4.M1
      - 4.M2
      - 4.R1
      - 4.A1
    hint_ladder:
    - 두 접선의 기울기가 같다.
    - $\overline{PR}^2$을 $t$ 하나로 나타내자.
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.155
    steps:
    - id: 4b-1
      content: |
        $P(t,t^2)$, $h(x)=-\dfrac12(x-2)^2+\dfrac14$ 위의 $R(s,h(s))$에서 접선의 기울기가 같아야 하므로 $2t=-(s-2)$, 즉 $s=2-2t$이다.
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        $\overline{PR}^2=\{t-(2-2t)\}^2+\{t^2-h(2-2t)\}^2=9t^4+\dfrac{15}2t^2-12t+\dfrac{65}{16}$이다.
      criteria:
      - 4.M2
    - id: 4b-3
      content: |
        미분하면 $36t^3+15t-12=3(2t-1)(6t^2+3t+4)$이고 $6t^2+3t+4>0$이므로 $t=\dfrac12$에서 최소이다. 이때 $s=1$, $P\left(\dfrac12,\dfrac14\right)$, $R\left(1,-\dfrac14\right)$이고 $\overline{PR}=\dfrac{\sqrt2}2$이다.
      criteria:
      - 4.R1
      - 4.A1
  rubric:
