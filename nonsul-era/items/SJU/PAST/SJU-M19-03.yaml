- id: '3'
  stem: |
    곡선 $y=f(x)$위의 한 점 $P$와 원 $x^2+y^2-6x+8=0$ 위의 한 점 $Q$에 대하여 선분 $\overline{PQ}$의 길이의 최솟값을 구하시오.
  points: 60
  depends_on:
  - '1'
  answer:
    kind: value
    value: sqrt(5)-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 중심 $(3,0)$까지 거리 제곱 $g(t)=t^4+t^2-6t+9$의 최솟값 5.
    steps:
    - id: 3a
      content: $\sqrt5-1$
      criteria:
      - 3.M1
      - 3.M2
      - 3.R1
      - 3.A1
    hint_ladder:
    - 원 위의 점 대신 원의 중심까지의 거리를 생각하자.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.154
    steps:
    - id: 3b-1
      content: |
        $x^2+y^2-6x+8=0$은 $(x-3)^2+y^2=1$, 중심 $(3,0)$, 반지름 1인 원이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        곡선 위의 점 $(t,t^2)$과 $(3,0)$ 사이 거리의 제곱을 $g(t)=(t-3)^2+t^4=t^4+t^2-6t+9$라 하면 $g'(t)=4t^3+2t-6=2(t-1)(2t^2+2t+3)$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $2t^2+2t+3>0$이므로 $t<1$에서 $g'<0$, $t>1$에서 $g'>0$이고 $g$는 $t=1$에서 최솟값 $5$를 갖는다.
      criteria:
      - 3.R1
    - id: 3b-4
      content: |
        곡선 위의 점과 원의 중심 사이 거리의 최솟값은 $\sqrt5$이므로 $\overline{PQ}$의 최솟값은 $\sqrt5-1$이다.
      criteria:
      - 3.M1
      - 3.A1
  rubric:
