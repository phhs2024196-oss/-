stimuli: []
stem: |
  실수 전체의 집합에서 미분가능한 함수 $f(x)$가 상수 $a$에 대하여 다음 식을 만족시킨다.

  $$\int_0^xf(t)\,dt=\dfrac13x^3+x^2+2+a\left(\dfrac12x^2+1\right)\int_0^1tf'(t)\,dt$$
subparts:
- id: '1'
  stem: |
    함수 $f(x)$와 실수 $a$를 구하시오.
  points: 60
  depends_on: []
  answer:
    kind: value
    value: f(x)=x**2; a=-3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=0$ 대입으로 $\int_0^1tf'(t)\,dt=-\tfrac2a$, 미분해 $f$.
    steps:
    - id: 1a
      content: $f(x)=x^2$, $2+\tfrac23a=0\Rightarrow a=-3$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
    hint_ladder:
    - $x=0$을 대입하면?
    - 양변을 미분하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.154
    steps:
    - id: 1b-1
      content: |
        $x=0$을 대입하면 $0=2+a\displaystyle\int_0^1tf'(t)\,dt$이므로 $\displaystyle\int_0^1tf'(t)\,dt=-\dfrac2a$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        주어진 식은 $\displaystyle\int_0^xf(t)\,dt=\dfrac13x^3+x^2+2+a\left(\dfrac12x^2+1\right)\left(-\dfrac2a\right)=\dfrac13x^3$이 되고, 양변을 $x$에 대하여 미분하면 $f(x)=x^2$이다.
      criteria:
      - 1.M2
      - 1.A1
    - id: 1b-3
      content: |
        $0=2+a\displaystyle\int_0^1t\cdot2t\,dt=2+\dfrac23a$이므로 $a=-3$이다.
      criteria:
      - 1.A2
  rubric:
