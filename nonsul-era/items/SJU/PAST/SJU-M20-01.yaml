intent: |
  매개변수가 있는 확률분포에서 표본평균의 확률을 경우를 나열해 구하고, 기댓값의 선형성으로 가중합의 기댓값을 계산하며, 이항분포의 정규근사로 모비율의 신뢰구간을 구하는 능력을 본다.
key_idea: |
  방의 개수의 기댓값은 $1\cdot\tfrac a2+2(1-a)+3\cdot\tfrac a2=2$로 $a$와 무관하고, '방 1개 또는 3개'의 확률이 $a$이므로 $Y\sim\mathrm{B}(100,a)$, $\hat a=\tfrac{Y}{100}=0.2$.
stuck: |
  (1-2)에서 $\mathrm{E}(X_k)=2$가 $a$에 무관하다는 점, (1-3)에서 추정 대상 $a$가 '1개 또는 3개'인 사건의 확률이라는 해석
