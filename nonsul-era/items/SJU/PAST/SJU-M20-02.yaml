stimuli: []

stem: |
  삼각형 $\mathrm{ABC}$는 반지름이 $1$이고 중심이 $\mathrm{O}$인 원에 외접한다. 아래 그림과 같이 삼각형의 변 $\overline{\mathrm{AB}}$, $\overline{\mathrm{BC}}$, $\overline{\mathrm{AC}}$와 원의 교점을 각각 $\mathrm{P}$, $\mathrm{Q}$, $\mathrm{R}$이라 하자. 선분 $\mathrm{AB}$, $\mathrm{AC}$의 길이는 각각 $\dfrac{3\sqrt3}{2}$, $4\sqrt3$이고 각 $\mathrm{A}$는 $\dfrac{\pi}{3}$이다. 다음 물음에 각각 답하시오.
  (그림: 왼쪽 위 A, 왼쪽 아래 B, 오른쪽 C인 삼각형에 원 O가 내접하고, AB 위의 접점 P, BC 위의 접점 Q, AC 위의 접점 R)

subparts:
- id: '1'
  stem: |
    벡터 $\overrightarrow{\mathrm{AB}}$를 두 벡터 $\overrightarrow{\mathrm{OP}}$와 $\overrightarrow{\mathrm{OR}}$로 나타내시오.
  points: 70
  depends_on: []
  answer: {kind: expression, value: 'AB = -3/2*OP - 3*OR', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{AB}}\cdot\overrightarrow{\mathrm{OP}}=0\Rightarrow b=2a$, $\lvert\overrightarrow{\mathrm{AB}}\rvert^2=3a^2=\tfrac{27}4$.
    steps:
    - {id: 1a, content: '$a=-\tfrac32$ (방향), $\overrightarrow{\mathrm{AB}}=-\tfrac32\overrightarrow{\mathrm{OP}}-3\overrightarrow{\mathrm{OR}}$', criteria: ['1.M1', '1.A1', '1.R1']}
    hint_ladder:
    - $\angle\mathrm{POR}$의 크기는?
    - $\overrightarrow{\mathrm{AB}}$는 $\overrightarrow{\mathrm{OP}}$와 수직이다.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.142
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        각 A가 $\tfrac\pi3$이므로 $\angle\mathrm{POR}=\tfrac{2}{3}\pi$, 따라서 $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OR}}=-\tfrac12$이다.
        $\overrightarrow{\mathrm{AB}}=a\overrightarrow{\mathrm{OP}}+b\overrightarrow{\mathrm{OR}}$라 하면 $0=\overrightarrow{\mathrm{AB}}\cdot\overrightarrow{\mathrm{OP}}=a-\dfrac b2$이므로 $\overrightarrow{\mathrm{AB}}=a\overrightarrow{\mathrm{OP}}+2a\overrightarrow{\mathrm{OR}}$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\dfrac{27}{4}=\overrightarrow{\mathrm{AB}}\cdot\overrightarrow{\mathrm{AB}}=a^2+4a^2-2a^2=3a^2$이므로 $a=\pm\dfrac32$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\overrightarrow{\mathrm{AB}}$는 A에서 B로 향하여 $\overrightarrow{\mathrm{OR}}$(A 쪽 변을 향하는 방향)과 반대 성분을 가지므로 $a=-\dfrac32$, $\overrightarrow{\mathrm{AB}}=-\dfrac32\overrightarrow{\mathrm{OP}}-3\overrightarrow{\mathrm{OR}}$.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OR}}=-\tfrac12$과 수직 조건으로 $b=2a$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 25
      evidence: |
        크기 조건으로 $a=\pm\tfrac32$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 20
      evidence: |
        방향을 근거로 부호를 정해 $-\tfrac32\overrightarrow{\mathrm{OP}}-3\overrightarrow{\mathrm{OR}}$을 답했다.
      depends_on: [1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3129}
  misconceptions:
  - id: MC-GEO-3129
    outcome_code: '71'
    wrong_work: '$a=\tfrac32$을 택해 $\overrightarrow{\mathrm{AB}}=\tfrac32\overrightarrow{\mathrm{OP}}+3\overrightarrow{\mathrm{OR}}$'
    detect_cue: 크기 조건의 두 해 중 방향 확인 없이 양수를 골랐다
    feedback: 크기만으로는 $\overrightarrow{\mathrm{AB}}$와 $\overrightarrow{\mathrm{BA}}$를 구별할 수 없습니다. 그림에서 방향을 확인해 부호를 고르세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    벡터 $\overrightarrow{\mathrm{BC}}$를 두 벡터 $\overrightarrow{\mathrm{OP}}$와 $\overrightarrow{\mathrm{OR}}$로 나타내시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: 'BC = -13/2*OP - OR', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 같은 방법으로 $\overrightarrow{\mathrm{AC}}=-8\overrightarrow{\mathrm{OP}}-4\overrightarrow{\mathrm{OR}}$, $\overrightarrow{\mathrm{BC}}=\overrightarrow{\mathrm{AC}}-\overrightarrow{\mathrm{AB}}$.
    steps:
    - {id: 2a, content: '$\overrightarrow{\mathrm{BC}}=-\tfrac{13}2\overrightarrow{\mathrm{OP}}-\overrightarrow{\mathrm{OR}}$', criteria: ['2.M1', '2.A1', '2.R1', '2.A2']}
    hint_ladder:
    - $\overrightarrow{\mathrm{AC}}$도 (2-1)과 같이 구할 수 있다.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.142
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\overrightarrow{\mathrm{AC}}=a\overrightarrow{\mathrm{OP}}+b\overrightarrow{\mathrm{OR}}$라 하면 $0=\overrightarrow{\mathrm{AC}}\cdot\overrightarrow{\mathrm{OR}}=-\dfrac a2+b$이므로 $\overrightarrow{\mathrm{AC}}=2b\overrightarrow{\mathrm{OP}}+b\overrightarrow{\mathrm{OR}}$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $48=\lvert\overrightarrow{\mathrm{AC}}\rvert^2=4b^2+b^2-2b^2=3b^2$이므로 $b=\pm4$.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        방향을 고려하면 $b=-4$, $\overrightarrow{\mathrm{AC}}=-8\overrightarrow{\mathrm{OP}}-4\overrightarrow{\mathrm{OR}}$.
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        $\overrightarrow{\mathrm{BC}}=\overrightarrow{\mathrm{AC}}-\overrightarrow{\mathrm{AB}}=-8\overrightarrow{\mathrm{OP}}-4\overrightarrow{\mathrm{OR}}+\dfrac32\overrightarrow{\mathrm{OP}}+3\overrightarrow{\mathrm{OR}}=-\dfrac{13}{2}\overrightarrow{\mathrm{OP}}-\overrightarrow{\mathrm{OR}}$.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $\overrightarrow{\mathrm{AC}}\perp\overrightarrow{\mathrm{OR}}$로 $a=2b$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $\lvert\overrightarrow{\mathrm{AC}}\rvert^2=48$로 $b=\pm4$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 15
      evidence: |
        방향으로 $b=-4$를 골랐다.
      depends_on: [2.A1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 25
      evidence: |
        $\overrightarrow{\mathrm{BC}}=-\tfrac{13}2\overrightarrow{\mathrm{OP}}-\overrightarrow{\mathrm{OR}}$을 얻었다.
      depends_on: [2.R1]
      ft: {allowed: true, from: [1.R1], max_points: 25}
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3129}
  misconceptions:
  - id: MC-GEO-3129
    outcome_code: '71'
    wrong_work: '$b=4$를 택해 $\overrightarrow{\mathrm{AC}}=8\overrightarrow{\mathrm{OP}}+4\overrightarrow{\mathrm{OR}}$'
    detect_cue: 부호를 방향으로 확인하지 않았다
    feedback: $\overrightarrow{\mathrm{AC}}$는 A에서 C로 향합니다. 그림의 방향과 맞는 부호를 고르세요.
    remedy: [RL-1]

- id: '3'
  stem: |
    벡터 $\overrightarrow{\mathrm{OQ}}$를 두 벡터 $\overrightarrow{\mathrm{OP}}$와 $\overrightarrow{\mathrm{OR}}$로 나타내시오.
  points: 80
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'OQ = -3/7*OP - 8/7*OR', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\overrightarrow{\mathrm{OQ}}=\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{PB}}+\overrightarrow{\mathrm{BQ}}$, $\overline{\mathrm{AP}}=\sqrt3$, $\overline{\mathrm{PB}}=\overline{\mathrm{BQ}}=\tfrac{\sqrt3}2$, $\overline{\mathrm{BC}}=\tfrac{7\sqrt3}2$.
    steps:
    - {id: 3a, content: '$\overrightarrow{\mathrm{OQ}}=-\tfrac37\overrightarrow{\mathrm{OP}}-\tfrac87\overrightarrow{\mathrm{OR}}$', criteria: ['3.M1', '3.A1', '3.A2', '3.A3']}
    hint_ladder:
    - 원 밖의 한 점에서 그은 두 접선의 길이는 같다.
    - $\overline{\mathrm{AP}}$를 $\angle\mathrm{OAP}=\tfrac\pi6$로 구하자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.142
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\overrightarrow{\mathrm{OQ}}=\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{PB}}+\overrightarrow{\mathrm{BQ}}$이다. $\angle\mathrm{OAP}=\tfrac\pi6$이므로 $\overline{\mathrm{AP}}=\sqrt3$, $\overline{\mathrm{PB}}=\overline{\mathrm{AB}}-\overline{\mathrm{AP}}=\dfrac{\sqrt3}2$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\overrightarrow{\mathrm{PB}}=\dfrac{\overline{\mathrm{PB}}}{\overline{\mathrm{AB}}}\overrightarrow{\mathrm{AB}}=\dfrac13\left(-\dfrac32\overrightarrow{\mathrm{OP}}-3\overrightarrow{\mathrm{OR}}\right)=-\dfrac12\overrightarrow{\mathrm{OP}}-\overrightarrow{\mathrm{OR}}$.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $\overrightarrow{\mathrm{BC}}$에서 $\overline{\mathrm{BC}}=\dfrac{7\sqrt3}2$이고 $\overline{\mathrm{BQ}}=\overline{\mathrm{PB}}=\dfrac{\sqrt3}{2}$이므로
        $\overrightarrow{\mathrm{BQ}}=\dfrac17\left(-\dfrac{13}2\overrightarrow{\mathrm{OP}}-\overrightarrow{\mathrm{OR}}\right)=-\dfrac{13}{14}\overrightarrow{\mathrm{OP}}-\dfrac17\overrightarrow{\mathrm{OR}}$.
      criteria: ['3.A2']
    - id: 3b-4
      content: |
        따라서 $\overrightarrow{\mathrm{OQ}}=-\dfrac37\overrightarrow{\mathrm{OP}}-\dfrac87\overrightarrow{\mathrm{OR}}$이다.
      criteria: ['3.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $\overrightarrow{\mathrm{OQ}}=\overrightarrow{\mathrm{OP}}+\overrightarrow{\mathrm{PB}}+\overrightarrow{\mathrm{BQ}}$로 분해하고 $\overline{\mathrm{AP}}=\sqrt3$, $\overline{\mathrm{PB}}=\tfrac{\sqrt3}2$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $\overrightarrow{\mathrm{PB}}=-\tfrac12\overrightarrow{\mathrm{OP}}-\overrightarrow{\mathrm{OR}}$을 얻었다.
      depends_on: [3.M1]
      ft: {allowed: true, from: [1.R1], max_points: 20}
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 25
      evidence: |
        $\overline{\mathrm{BQ}}=\overline{\mathrm{BP}}$와 $\overline{\mathrm{BC}}=\tfrac{7\sqrt3}2$로 $\overrightarrow{\mathrm{BQ}}$를 구했다.
      depends_on: [3.M1]
      ft: {allowed: true, from: [2.A2], max_points: 25}
      steps: [3b-3]
    - id: 3.A3
      mark_type: A
      points: 15
      evidence: |
        $\overrightarrow{\mathrm{OQ}}=-\tfrac37\overrightarrow{\mathrm{OP}}-\tfrac87\overrightarrow{\mathrm{OR}}$을 얻었다.
      depends_on: [3.A1, 3.A2]
      implied_ok: true
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

