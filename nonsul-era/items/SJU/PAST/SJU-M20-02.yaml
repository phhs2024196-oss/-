intent: |
  내접원의 반지름 벡터와 변의 수직 관계, 내적과 크기 조건으로 변 벡터를 두 접점 벡터의 일차결합으로 나타내고, 접선 길이의 성질로 다른 접점의 위치벡터를 구하는 능력을 본다.
key_idea: |
  $\overrightarrow{\mathrm{OP}}\cdot\overrightarrow{\mathrm{OR}}=\cos\tfrac{2\pi}{3}=-\tfrac12$이고, $\overrightarrow{\mathrm{AB}}\perp\overrightarrow{\mathrm{OP}}$, $\overrightarrow{\mathrm{AC}}\perp\overrightarrow{\mathrm{OR}}$를 이용해 계수를 정한 뒤 크기 조건과 방향으로 부호를 정한다.
stuck: |
  $\angle\mathrm{POR}=\pi-\angle\mathrm{A}=\tfrac{2\pi}3$이라는 점, 크기 조건만으로는 부호가 두 가지라 그림의 방향으로 고르는 점, 접점 Q를 $\overline{\mathrm{BQ}}=\overline{\mathrm{BP}}$로 찾는 점
