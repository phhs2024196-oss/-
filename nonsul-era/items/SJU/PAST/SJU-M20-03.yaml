intent: |
  원점까지의 거리와 기울기의 곱이 일정하다는 조건으로 곡선의 관계식을 세우고, $x$를 $y$의 함수로 나타내 역함수의 미분으로 상수를 결정하며, $y=f(x)$ 치환으로 정적분을 계산하는 능력을 본다.
key_idea: |
  $d(x)m(x)=c$에서 $x^2y^2+y^4=c^2x^2$, 즉 $x=\dfrac{y^2}{\sqrt{c^2-y^2}}$. $y=1$에서 $\dfrac{dx}{dy}=3$으로 $c=\sqrt2$.
stuck: |
  관계식을 $y$에 대해 풀지 않고 $x$를 $y$의 식으로 표현해 $\dfrac{dx}{dy}=\dfrac{1}{f'(x)}$로 조건 (나)를 쓰는 발상, (3-3)에서 $y=f(x)$로 치환해 $x^2=\dfrac{y^4}{2-y^2}$을 대입하는 점
idea_tags: [IDEA-INVERSE-AS-FUNCTION-OF-Y, IDEA-SUBSTITUTE-Y-EQUALS-F]
tags: [역함수의 미분, 치환적분, 점과 직선 사이의 거리]

