intent: |
  선분 위를 움직이는 점이 만드는 삼각형의 넓이를 각의 함수로 나타내고, 그 증가성으로 역함수 존재를 설명하며, 역함수의 미분과 연쇄법칙으로 각의 변화율이 최대가 되는 위치를 찾는 능력을 본다.
key_idea: |
  $r=\dfrac{2}{\cos\theta+2\sin\theta}$, $S=\dfrac{2\sin\theta}{\cos\theta+2\sin\theta}$, $\dfrac{dS}{d\theta}=\dfrac{2}{(\cos\theta+2\sin\theta)^2}$이므로 $\dfrac{d\theta}{dt}=\dfrac{c(\cos\theta+2\sin\theta)^2}{2}$.
stuck: |
  $\dfrac{d\theta}{dt}=\dfrac{d\theta}{dS}\cdot\dfrac{dS}{dt}$에서 $\dfrac{d\theta}{dS}=1\Big/\dfrac{dS}{d\theta}$로 바꾸는 단계
idea_tags: [IDEA-POLAR-LINE, IDEA-INVERSE-RATE]
tags: [관련 변화율, 삼각함수, 역함수의 미분]

