  materials:
  - '선분 $\mathrm{AB}$ ($\mathrm{A}(2,0)$, $\mathrm{B}(0,1)$) 위를 움직이는 점 $\mathrm{P}$'
  - '삼각형 $\mathrm{OPA}$의 넓이 $S$와 $\angle\mathrm{POA}=\theta$'
  - '넓이의 시간 변화율이 양의 상수 $c$'
  concepts:
  - '삼각함수의 정의(극좌표 표현)'
  - '몫의 미분법'
  - '역함수의 존재와 미분법'
  - '합성함수의 미분법(연쇄법칙)'
  - '삼각함수의 합성과 최대'
  tools:
  - '$\mathrm{P}(r\cos\theta,r\sin\theta)$를 직선 $x+2y=2$에 대입'
  - '$\dfrac{dS}{d\theta}>0$으로 일대일 대응 판정'
  - '$\dfrac{d\theta}{dt}=\dfrac{1}{dS/d\theta}\cdot\dfrac{dS}{dt}$'
  - '이계도함수가 $0$인 조건 $-\sin\theta+2\cos\theta=0$'
  conditions:
  - '$0<\theta\le\tfrac{\pi}{2}$에서 $\cos\theta+2\sin\theta>0$'
  - '$\dfrac{dS}{dt}=c>0$ 상수'
