intent: |
  동전 던지기 게임이 끝나는 시점의 확률분포와 기댓값을 구하고, 중단된 게임의 상금을 승리 확률로 분배하며, 출발점을 매개변수로 한 기대 수익을 이차함수로 최적화하는 능력을 본다.
key_idea: |
  A는 앞면 $n$번, B는 뒷면 $m$번이 먼저 나오면 이긴다. A가 이길 확률 $=\mathrm{P}(n+m-1\text{번 중 앞면}\ge n)$이고, (2-3)의 기대 수익은 $1250(-3n^2+29n-28)$.
stuck: |
  게임이 $x$번째에 끝나려면 $x$번째가 결정 시행이어야 하므로 ${}_{x-1}\mathrm{C}_3$을 쓴다는 점, (2-3)에서 승리 확률을 시행 횟수별로 합해 $\dfrac{8+4n+n(n+1)}{2^{n+3}}$을 얻는 점
