# [해설 불일치] (3-3) 해설교재는 f(x)=M/2·x(1-x) 한 예만 제시한다. 등호 조건을 따지면 f(x)=-M/2·x(1-x)도 조건을 만족하고 이 둘뿐이므로 정답을 ±M/2·x(1-x)로 둔다(검산 확인).
# 세종대 2021학년도 모의논술고사(자연계열) 문제 3 — 기출 원문은 내부 분석용(allowed_use: internal_only)
