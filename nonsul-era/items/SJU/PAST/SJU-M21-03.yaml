intent: |
  절댓값 함수의 최대점에서 도함수가 0임을 보이고, 부분적분으로 함숫값을 이계도함수의 적분으로 나타내 이계도함수의 상한으로 함숫값을 평가하며, 등호가 성립하는 함수를 찾는 능력을 본다.
key_idea: |
  $f'(a)=0$을 쓰면 $f(a)=-\displaystyle\int_0^axf''(x)\,dx=-\int_a^1(1-x)f''(x)\,dx$이므로 $\lvert f(a)\rvert\le\dfrac M2\min(a^2,(1-a)^2)\le\dfrac M8$.
stuck: |
  $f(a)=\int_0^af'(x)\,dx$를 부분적분하되 $f'(a)=0$이 경계항을 없애도록 $x$(또는 $1-x$)를 곱하는 발상, 그리고 $a\le\tfrac12$, $a\ge\tfrac12$로 나누어 가까운 끝점을 쓰는 점
