stimuli: []

stem: |
  상수함수가 아닌 다항함수 $f(x)$가 다음 두 조건을 만족시킨다.
  (조건 1) $f(0)=f(1)=0$
  (조건 2) 양수 $M$에 대하여 $0\le x\le1$인 모든 실수 $x$에 대해 $\lvert f''(x)\rvert\le M$을 만족한다.
  구간 $[0,1]$에서 함수 $\lvert f(x)\rvert$의 최댓값이 $\lvert f(a)\rvert$라 할 때, 다음 물음에 각각 답하시오. (단, $a$는 실수이다.)

subparts:
- id: '1'
  stem: |
    $f'(a)=0$이 됨을 보이시오.
  points: 80
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a\in(0,1)$, $f(a)\ne0$이므로 $\lvert f\rvert$는 $a$ 근처에서 미분가능하고 내부 최대점이라 $k'(a)=0$, $k'(a)=\pm f'(a)$.
    steps:
    - {id: 1a, content: '$k=\lvert f\rvert$의 내부 최대 $\Rightarrow k^{\prime}(a)=0=\pm f^{\prime}(a)$', criteria: ['1.R1', '1.M1', '1.R2']}
    hint_ladder:
    - 최대점 $a$가 구간의 끝점일 수 있는가?
    - $f(a)\ne0$이면 $\lvert f\rvert$는 $a$ 근처에서 $f$ 또는 $-f$와 같다.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.134
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f$는 상수함수가 아니고 $f(0)=f(1)=0$이므로 $\lvert f\rvert$의 최댓값은 양수이다. 따라서 최대가 되는 $x=a$는 열린 구간 $(0,1)$에 속하고 $f(a)\ne0$이다.
      criteria: ['1.R1']
    - id: 1b-2
      content: |
        $g(x)=\lvert x\rvert$는 $x\ne0$에서 미분가능하고 $g'(x)=\pm1$이므로, $k(x)=(g\circ f)(x)=\lvert f(x)\rvert$는 $f(a)\ne0$인 $x=a$에서 미분가능하다.
        $k(a)$가 최댓값이므로 $\displaystyle\lim_{h\to0+}\frac{k(a+h)-k(a)}{h}\le0$, $\displaystyle\lim_{h\to0-}\frac{k(a+h)-k(a)}{h}\ge0$이고 따라서 $k'(a)=0$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        합성함수의 미분법으로 $0=k'(a)=g'(f(a))f'(a)=\pm f'(a)$이므로 $f'(a)=0$이다. ■
      criteria: ['1.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 25
      evidence: |
        상수함수가 아니고 $f(0)=f(1)=0$이므로 $a\in(0,1)$이고 $f(a)\ne0$임을 밝혔다.
      depends_on: []
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: |
        $\lvert f\rvert$가 $a$에서 미분가능함과 좌우 차분몫의 부호로 $k'(a)=0$을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.R2
      mark_type: R
      points: 25
      evidence: |
        $k'(a)=\pm f'(a)$로부터 $f'(a)=0$을 결론지었다.
      depends_on: [1.R1, 1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3125}
  misconceptions:
  - id: MC-CAL-3125
    outcome_code: '71'
    wrong_work: '최대점이므로 $f^{\prime}(a)=0$이라고 바로 씀'
    detect_cue: 끝점 배제($a\in(0,1)$)와 $f(a)\ne0$(절댓값의 미분가능성) 근거가 없다
    feedback: 끝점 최대나 꺾인 점이면 미분계수가 $0$이 아닐 수 있습니다. 두 가능성을 먼저 배제하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $\lvert f(a)\rvert\le\dfrac M8$이 성립함을 보이시오.
  points: 80
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(a)=-\int_0^axf''dx$ ($a\le\tfrac12$), $f(a)=-\int_a^1(1-x)f''dx$ ($a\ge\tfrac12$).
    steps:
    - {id: 2a, content: '$\lvert f(a)\rvert\le\tfrac M2a^2\le\tfrac M8$ 또는 $\le\tfrac M2(1-a)^2\le\tfrac M8$', criteria: ['2.M1', '2.A1', '2.R1', '2.R2']}
    hint_ladder:
    - $f(a)=\int_0^af'(x)\,dx$를 부분적분해 보자. $f'(a)=0$이 어디에 쓰이는가?
    - $a$가 $\tfrac12$보다 크면 반대쪽 끝점 $1$에서 출발하자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.134
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $0\le a\le\tfrac12$인 경우: $f'(a)=0$이므로
        $f(a)=\displaystyle\int_0^af'(x)\,dx=\Big[xf'(x)\Big]_0^a-\int_0^axf''(x)\,dx=-\int_0^axf''(x)\,dx$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\lvert f(a)\rvert\le\displaystyle\int_0^ax\lvert f''(x)\rvert\,dx\le M\int_0^ax\,dx=\frac M2a^2\le\frac M8$ ($a\le\tfrac12$).
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $\tfrac12\le a\le1$인 경우: $f(a)=-\displaystyle\int_a^1f'(x)\,dx=\Big[(1-x)f'(x)\Big]_a^1-\int_a^1(1-x)f''(x)\,dx=-\int_a^1(1-x)f''(x)\,dx$이므로
        $\lvert f(a)\rvert\le M\displaystyle\int_a^1(1-x)\,dx=\frac M2(1-a)^2\le\frac M8$ ($0\le1-a\le\tfrac12$).
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        두 경우 모두 $\lvert f(a)\rvert\le\dfrac M8$이다. ■
      criteria: ['2.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 25
      evidence: |
        $f'(a)=0$을 써서 부분적분으로 $f(a)=-\int_0^axf''(x)\,dx$를 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.R2], max_points: 25}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $\lvert f(a)\rvert\le\dfrac M2a^2\le\dfrac M8$ ($a\le\tfrac12$)을 보였다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 25
      evidence: |
        $a\ge\tfrac12$인 경우를 끝점 $1$ 쪽 부분적분으로 따로 평가했다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.R2
      mark_type: R
      points: 10
      evidence: |
        두 경우를 합쳐 결론을 맺었다.
      depends_on: [2.A1, 2.R1]
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: $a\le\tfrac12$ 경우만 다룸
      effect: cap
      value: 50
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    문제의 조건을 만족시키는 다항함수 중에서 $\lvert f(a)\rvert=\dfrac M8$을 만족시키는 함수 (즉, (3-2)에서 등호가 성립하는 함수) $f$를 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: expression, value: 'f = M*x*(1-x)/2 or f = -M*x*(1-x)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 등호는 $a=\tfrac12$이고 $\lvert f''\rvert\equiv M$(부호 일정)일 때이므로 $f''=\mp M$, $f(0)=f(1)=0$에서 $f=\pm\tfrac M2x(1-x)$.
    steps:
    - {id: 3a, content: '$f(x)=\tfrac M2x(1-x)$ (또는 $-\tfrac M2x(1-x)$), 최댓값 $\lvert f(\tfrac12)\rvert=\tfrac M8$', criteria: ['3.M1', '3.A1', '3.R1']}
    hint_ladder:
    - (3-2)의 부등식에서 등호가 되려면 $a$와 $f''$은 어떠해야 하는가?
    - $f''$이 상수인 다항함수는?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.134
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        임의의 양수 $M$에 대하여 $f(x)=\dfrac M2x(1-x)$라 두면 $f(0)=f(1)=0$이고 $f''(x)=-M$이므로 조건을 만족한다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $0\le x\le1$에서 $\lvert f(x)\rvert$의 최댓값은 $x=\tfrac12$일 때 $\dfrac M8$이므로 (3-2)에서 등호가 성립한다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        (보충) 등호가 성립하려면 (3-2)의 평가에서 $a=\tfrac12$이고 $[0,\tfrac12]$(또는 $[\tfrac12,1]$)에서 $xf''(x)$의 부호가 일정하며 $\lvert f''\rvert=M$이어야 한다. 다항함수이므로 $f''\equiv-M$ 또는 $f''\equiv M$이고, $f(0)=f(1)=0$에서 $f(x)=\pm\dfrac M2x(1-x)$뿐이다.
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 30
      evidence: |
        $f''$이 상수 $\pm M$인 이차함수 $f=\pm\dfrac M2x(1-x)$를 제시하고 두 조건을 확인했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1, 2.R1], max_points: 30}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 30
      evidence: |
        최댓값이 $x=\tfrac12$에서 $\dfrac M8$이 되어 등호가 성립함을 확인했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
      points: 20
      evidence: |
        등호 조건($a=\tfrac12$, $\lvert f''\rvert\equiv M$)에서 이 함수(부호 포함)뿐임을 설명했다.
      depends_on: [3.A1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

