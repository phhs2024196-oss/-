stimuli: []

stem: |
  그림과 같이 좌표평면에 중심이 $(0,\sqrt2)$이고 반지름의 길이가 $1$인 원 $C$가 있다.
  점 $\mathrm{P}(a,0)$을 지나고 원 위의 점 $\mathrm{T_1}$, $\mathrm{T_2}$에서 각각 접하는 두 직선에 대하여 $\angle\mathrm{T_1PT_2}=\theta$라 하자.
  (단, $0<a<1$)
  (그림: 원 $C$의 중심 $(0,\sqrt2)$와 반지름 $1$이 표시되어 있고, $x$축 위 원점 오른쪽의 점 $\mathrm{P}(a,0)$에서 그은 두 접선 중 기울기가 음인 직선은 원의 왼쪽 아래 점 $\mathrm{T_1}$에서, 기울기가 양인 가파른 직선은 원의 오른쪽 점 $\mathrm{T_2}$에서 원에 접하며, 두 직선 사이의 각 $\theta$가 $\mathrm{P}$에 표시되어 있다.)

subparts:
- id: '1'
  stem: |
    직선 $\mathrm{PT_1}$의 기울기 $m_1$과 직선 $\mathrm{PT_2}$의 기울기 $m_2$를 각각 $a$에 대한 식으로 나타내시오.
  points: 70
  depends_on: []
  answer: {kind: expression, value: 'm1=(sqrt(2)*a - sqrt(1 + a**2))/(1 - a**2); m2=(sqrt(2)*a + sqrt(1 + a**2))/(1 - a**2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선 $y=m(x-a)$를 원의 방정식에 넣은 이차방정식이 중근을 가질 조건으로 $m$의 이차방정식을 얻는다.
    steps:
    - id: 1a
      content: |
        $(1-a^2)m^2-2\sqrt2am-1=0\Rightarrow m=\dfrac{\sqrt2a\mp\sqrt{1+a^2}}{1-a^2}$, 그림에서 $m_1<0<m_2$
      criteria: ['1.M1', '1.A1', '1.A2']
    hint_ladder:
    - 원과 직선이 접할 조건을 식으로 나타내 보자.
    - 두 근 중 어느 것이 음수인가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.108
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        원 $C$의 방정식은 $x^2+y^2-2\sqrt2y+1=0$이다. 접선을 $y=m(x-a)$라 두고 연립하면
        $(1+m^2)x^2+(-2\sqrt2m-2am^2)x+1+2\sqrt2am+a^2m^2=0$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        접하므로 이 이차방정식의 판별식 $D$에 대하여 $\dfrac D4=(1-a^2)m^2-2\sqrt2am-1=0$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        근의 공식으로 $m=\dfrac{\sqrt2a\pm\sqrt{2a^2+(1-a^2)}}{1-a^2}=\dfrac{\sqrt2a\pm\sqrt{1+a^2}}{1-a^2}$이다. $0<a<1$이면 $\sqrt2a<\sqrt{1+a^2}$이므로 음수 근이 $\mathrm{PT_1}$의 기울기이고
        $m_1=\dfrac{\sqrt2a-\sqrt{1+a^2}}{1-a^2}$, $m_2=\dfrac{\sqrt2a+\sqrt{1+a^2}}{1-a^2}$이다.
      criteria: ['1.A2']
  - id: S1-ALT
    audience: ALT
    source_flow: 해설교재 p.108 다른 풀이
    method_no: 2
    key_idea: 접선 $mx-y-ma=0$과 중심 $(0,\sqrt2)$ 사이의 거리가 반지름 $1$이다.
    steps:
    - id: 1c-1
      content: |
        $\dfrac{\lvert-\sqrt2-ma\rvert}{\sqrt{m^2+1}}=1$의 양변을 제곱하면 $m^2+1=a^2m^2+2\sqrt2am+2$, 즉 $(1-a^2)m^2-2\sqrt2am-1=0$이고 이후는 같다.
      criteria: ['1.M1', '1.A1', '1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        접선을 $y=m(x-a)$로 두고 원과 연립(또는 중심과 직선 사이 거리 $=1$)한 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $(1-a^2)m^2-2\sqrt2am-1=0$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2, 1c-1]
    - id: 1.A2
      mark_type: A
      points: 25
      evidence: |
        두 근을 구하고 부호(그림)로 $m_1$, $m_2$를 바르게 구분했다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3, 1c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(거리 공식)}
  - {code: '71', misconception: MC-GEO-3099}
  misconceptions:
  - id: MC-GEO-3099
    outcome_code: '71'
    wrong_work: '거리 공식에서 분모 $\sqrt{m^2+1}$을 빠뜨리거나 반지름을 $\sqrt2$로 두어 접선 조건을 잘못 세움'
    detect_cue: $m$에 대한 이차방정식이 $(1-a^2)m^2-2\sqrt2am-1=0$과 다르다
    feedback: 원과 직선이 접하면 중심에서 직선까지의 거리가 반지름과 같습니다. 거리 공식의 분모를 확인하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $\tan\theta$를 $a$에 대한 식으로 나타내시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: '2*sqrt(1 + a**2)/a**2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 두 직선이 $x$축의 양의 방향과 이루는 각의 차가 $\theta$이므로 탄젠트의 덧셈정리를 쓴다. $m_1m_2=-\tfrac1{1-a^2}$이다.
    steps:
    - id: 2a
      content: |
        $\tan\theta=\dfrac{m_1-m_2}{1+m_1m_2}=\dfrac{-2\sqrt{1+a^2}/(1-a^2)}{-a^2/(1-a^2)}=\dfrac{2\sqrt{1+a^2}}{a^2}$
      criteria: ['2.M1', '2.A1', '2.A2']
    hint_ladder:
    - 각 직선이 $x$축과 이루는 각을 $\theta_1$, $\theta_2$라 하면 $\theta$는 무엇인가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.108
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        기울기가 $m_1$, $m_2$인 접선을 $\ell_1$, $\ell_2$라 하고 이들이 $x$축의 양의 방향과 이루는 각을 $\theta_1$, $\theta_2$라 하면 $\tan\theta_1=m_1$, $\tan\theta_2=m_2$이고
        $\tan\theta=\tan(\theta_1-\theta_2)=\dfrac{\tan\theta_1-\tan\theta_2}{1+\tan\theta_1\tan\theta_2}=\dfrac{m_1-m_2}{1+m_1m_2}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $m_1-m_2=-\dfrac{2\sqrt{1+a^2}}{1-a^2}$, $m_1m_2=\dfrac{2a^2-(1+a^2)}{(1-a^2)^2}=-\dfrac1{1-a^2}$이므로 $1+m_1m_2=-\dfrac{a^2}{1-a^2}$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        따라서 $\tan\theta=\dfrac{2\sqrt{1+a^2}}{a^2}$이다.
      criteria: ['2.A2']
  - id: S2-ALT
    audience: ALT
    source_flow: 해설교재 p.108 다른 풀이
    method_no: 2
    key_idea: 원의 중심을 $\mathrm{Q}$라 하면 $\angle\mathrm{QPT_1}=\tfrac{\theta}2$, $\angle\mathrm{QT_1P}=\tfrac{\pi}2$이다.
    steps:
    - id: 2c-1
      content: |
        $\overline{\mathrm{PQ}}=\sqrt{a^2+2}$, $\overline{\mathrm{QT_1}}=1$이므로 $\overline{\mathrm{T_1P}}=\sqrt{a^2+1}$이고 $\tan\dfrac{\theta}2=\dfrac1{\sqrt{a^2+1}}$이다.
        $\tan\theta=\dfrac{2\tan\frac{\theta}2}{1-\tan^2\frac{\theta}2}=\dfrac{2/\sqrt{a^2+1}}{a^2/(a^2+1)}=\dfrac{2\sqrt{a^2+1}}{a^2}$이다.
      criteria: ['2.M1', '2.A1', '2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 30
      evidence: |
        $\tan\theta=\dfrac{m_1-m_2}{1+m_1m_2}$(또는 반각 $\tan\dfrac{\theta}2=\dfrac1{\sqrt{a^2+1}}$)으로 식을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 30}
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 25
      evidence: |
        $m_1-m_2$와 $1+m_1m_2$(또는 배각 공식의 분모)를 바르게 계산했다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.A2
      mark_type: A
      points: 25
      evidence: |
        $\tan\theta=\dfrac{2\sqrt{1+a^2}}{a^2}$을 얻었다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(반각 풀이)}
  - {code: '71', misconception: MC-CAL-3102}
  misconceptions:
  - id: MC-CAL-3102
    outcome_code: '71'
    wrong_work: '$\tan\theta=\dfrac{m_2-m_1}{1+m_1m_2}=-\dfrac{2\sqrt{1+a^2}}{a^2}$으로 음수 결과를 그대로 답함'
    detect_cue: 그림의 $\theta$가 예각인지 확인하지 않고 부호가 음인 답을 냈다
    feedback: 덧셈정리의 순서에 따라 부호가 바뀝니다. 그림에서 $\theta$가 예각인지(또는 반각으로) 확인하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    $\cos\theta$를 $a$에 대한 식으로 나타낸 것을 $f(a)$라 할 때 극한 $\displaystyle\lim_{a\to0+}\dfrac{f(a)}{a^2}$를 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: value, value: '1/2', equivalents: ['0.5'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 밑변 $a^2$, 높이 $2\sqrt{a^2+1}$인 직각삼각형의 빗변이 $a^2+2$이므로 $\cos\theta=\tfrac{a^2}{a^2+2}$이다.
    steps:
    - id: 3a
      content: |
        $f(a)=\dfrac{a^2}{a^2+2}$, $\dfrac{f(a)}{a^2}=\dfrac1{a^2+2}\to\dfrac12$
      criteria: ['3.M1', '3.A1', '3.A2']
    hint_ladder:
    - $\tan\theta>0$이면 $\theta$는 어떤 범위에 있는가?
    - $a^4+4(a^2+1)$은 완전제곱식이다.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.108~109
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\tan\theta>0$이므로 $0<\theta<\dfrac{\pi}2$이고 $\cos\theta>0$이다. 밑변이 $a^2$, 높이가 $2\sqrt{a^2+1}$인 직각삼각형을 생각하면
        빗변은 $\sqrt{a^4+4a^2+4}=a^2+2$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        따라서 $f(a)=\cos\theta=\dfrac{a^2}{a^2+2}$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $\displaystyle\lim_{a\to0+}\dfrac{f(a)}{a^2}=\lim_{a\to0+}\dfrac1{a^2+2}=\dfrac12$이다.
      criteria: ['3.A2']
  - id: S3-ALT1
    audience: ALT
    source_flow: 해설교재 p.109
    method_no: 2
    key_idea: 그림 없이 $1+\tan^2\theta=\dfrac1{\cos^2\theta}$를 쓴다.
    steps:
    - id: 3c-1
      content: |
        $\dfrac{(a^2+2)^2}{a^4}=1+\tan^2\theta=\dfrac1{\cos^2\theta}$이고 $\cos\theta>0$이므로 $\cos\theta=\dfrac{a^2}{a^2+2}$이다.
      criteria: ['3.M1', '3.A1', '3.A2']
  - id: S3-ALT2
    audience: ALT
    source_flow: 해설교재 p.109 다른 풀이
    method_no: 3
    key_idea: (1-2) 다른 풀이의 직각삼각형 $\mathrm{QT_1P}$에서 반각의 사인·코사인을 구한다.
    steps:
    - id: 3d-1
      content: |
        $\cos\dfrac{\theta}2=\dfrac{\sqrt{a^2+1}}{\sqrt{a^2+2}}$, $\sin\dfrac{\theta}2=\dfrac1{\sqrt{a^2+2}}$이므로 $\cos\theta=\cos^2\dfrac{\theta}2-\sin^2\dfrac{\theta}2=\dfrac{a^2}{a^2+2}$, 극한은 $\dfrac12$이다.
      criteria: ['3.M1', '3.A1', '3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 30
      evidence: |
        $\theta$가 예각임을 밝히고 $\tan\theta$에서 $\cos\theta$를 구하는 방법(직각삼각형, $\sec^2$, 반각)을 썼다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A2], max_points: 30}
      steps: [3b-1, 3c-1, 3d-1]
    - id: 3.A1
      mark_type: A
      points: 25
      evidence: |
        $f(a)=\dfrac{a^2}{a^2+2}$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2, 3c-1, 3d-1]
    - id: 3.A2
      mark_type: A
      points: 25
      evidence: |
        극한값 $\dfrac12$을 얻었다.
      depends_on: [3.M1, 3.A1]
      steps: [3b-3, 3c-1, 3d-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(다른 풀이)}
  - {code: '71', misconception: MC-CAL-3102}
  misconceptions:
