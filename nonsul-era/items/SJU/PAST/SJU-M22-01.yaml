intent: |
  원 밖의 점에서 그은 두 접선의 기울기를 판별식(또는 점과 직선 사이의 거리)으로 구하고, 탄젠트의 덧셈정리로 두 접선이 이루는 각을 계산해 코사인과 극한으로 연결하는 능력을 본다.
key_idea: |
  접선 $y=m(x-a)$와 원의 중심 $(0,\sqrt2)$ 사이 거리가 $1$이므로 $(1-a^2)m^2-2\sqrt2am-1=0$이고, $\tan\theta=\tfrac{m_1-m_2}{1+m_1m_2}=\tfrac{2\sqrt{a^2+1}}{a^2}$, 따라서 $\cos\theta=\tfrac{a^2}{a^2+2}$이다.
stuck: |
