stimuli: []

stem: |
  실수 전체의 집합에서 미분가능한 함수 $f(x)$가 다음을 만족시킨다.

  (가) 임의의 실수 $x$에 대하여 $f(x)=\displaystyle\int_0^x\sqrt{f(t)-t-2}\,dt+x+2$이다.
  (나) $x>2$일 때 $f(x)>x+2$이고 $f(4)=7$이다.

subparts:
- id: '1'
  stem: |
    $x<0$일 때 $f(x)$를 구하면 $f(x)=x+k$이다. 상수 $k$를 구하시오.
  points: 70
  depends_on: []
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(t)=t+k$를 (가)에 넣으면 $x<0$에서 $x+k=(\sqrt{k-2}+1)x+2$인 항등식이 된다.
    steps:
    - id: 1a
      content: |
        $x+k=(\sqrt{k-2}+1)x+2$ $(x<0)$ $\Rightarrow\sqrt{k-2}=0$, $k=2$
      criteria: ['1.M1', '1.A1']
    hint_ladder:
    - $f(t)-t-2$에 $f(t)=t+k$를 넣으면 상수가 된다.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.109
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x<0$일 때 $f(x)=x+k$를 (가)에 대입하면 $x\le t\le0$에서 $\sqrt{f(t)-t-2}=\sqrt{k-2}$이므로
        $x+k=\displaystyle\int_0^x\sqrt{k-2}\,dt+x+2=(\sqrt{k-2}+1)x+2$ $(x<0)$인 항등식을 얻는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        모든 $x<0$에서 성립하려면 $x$의 계수와 상수항을 비교해 $\sqrt{k-2}+1=1$, $k=2$이다.
      criteria: ['1.A1']
  - id: S1-ALT1
    audience: ALT
    source_flow: 해설교재 p.109 다른 풀이 1
    method_no: 2
    key_idea: 근호가 정의되려면 $f(x)\ge x+2$이고, $x<0$이면 적분이 $0$ 이하이므로 $f(x)\le x+2$이다.
    steps:
    - id: 1c-1
      content: |
        (가)의 근호가 계산되려면 모든 $x$에서 $f(x)\ge x+2$이다. $x<0$이면 $\displaystyle\int_0^x\sqrt{f(t)-t-2}\,dt\le0$이므로 $f(x)\le x+2$이다. 따라서 $x<0$에서 $f(x)=x+2$, $k=2$이다.
      criteria: ['1.M1', '1.A1']
  - id: S1-ALT2
    audience: ALT
    source_flow: 해설교재 p.109 다른 풀이 2
    method_no: 3
    key_idea: (가)를 미분하면 $f'(x)=\sqrt{f(x)-x-2}+1$이다.
    steps:
    - id: 1d-1
      content: |
        $x<0$에서 $f'(x)=1$이므로 $0=\sqrt{x+k-x-2}=\sqrt{k-2}$, 따라서 $k=2$이다.
      criteria: ['1.M1', '1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 40
      evidence: |
        $f(x)=x+k$를 (가)에 대입해 $x$에 대한 항등식(또는 $f\ge x+2$와 적분 부호, 또는 미분식)을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1, 1d-1]
    - id: 1.A1
      mark_type: A
      points: 30
      evidence: |
        $k=2$를 근거와 함께 얻었다.
      depends_on: [1.M1]
      steps: [1b-2, 1c-1, 1d-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(다른 풀이)}
  - {code: '71', misconception: MC-CAL-3103}
  misconceptions:
  - id: MC-CAL-3103
    outcome_code: '71'
    wrong_work: '$x<0$에서 $\int_0^x\sqrt{k-2}\,dt=-\sqrt{k-2}\,x$로 부호를 바꿔 계산'
    detect_cue: 위끝이 아래끝보다 작을 때 적분값을 $\sqrt{k-2}\,x$로 쓰지 않았다
    feedback: $\int_0^xc\,dt=cx$는 $x$의 부호와 관계없이 성립합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $x>2$일 때 $f(x)$를 구하시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: 'x**2/4 + 3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(x)-1=\sqrt{f(x)-x-2}$를 근호로 나누고 $u=f(x)-x-2$로 치환해 적분한다.
    steps:
    - id: 2a
      content: |
        $2\sqrt{f(x)-x-2}=x+C$, $f(4)=7\Rightarrow C=-2$, $f(x)=\tfrac14(x-2)^2+x+2=\tfrac14x^2+3$
      criteria: ['2.M1', '2.M2', '2.A1', '2.A2']
    hint_ladder:
    - (가)를 미분해 보자.
    - $x>2$에서 근호 안이 양수이므로 나눌 수 있다. $f(x)-x-2$를 한 문자로 놓아 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.109
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (가)를 미분하면 모든 실수 $x$에서 $f'(x)=\sqrt{f(x)-x-2}+1$ ⋯ ① 이므로 $f'(x)-1=\sqrt{f(x)-x-2}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        (나)에서 $x>2$이면 $f(x)>x+2$이므로 $\dfrac{f'(x)-1}{\sqrt{f(x)-x-2}}=1$ $(x>2)$이다. $u=f(x)-x-2$로 치환하면 $du=\{f'(x)-1\}dx$이므로
        $\displaystyle\int\dfrac{f'(x)-1}{\sqrt{f(x)-x-2}}dx=\int\dfrac{du}{\sqrt u}=2\sqrt{f(x)-x-2}=x+C$ $(x>2)$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $f(4)=7$에서 $2\sqrt{1}=4+C$, $C=-2$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        $x>2$에서 $x-2>0$이므로 양변을 제곱해 $f(x)-x-2=\dfrac14(x-2)^2$, 즉 $f(x)=\dfrac14x^2+3$ $(x>2)$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        (가)를 미분해 $f'(x)=\sqrt{f(x)-x-2}+1$을 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 25
      evidence: |
        $f(x)>x+2$를 근거로 근호로 나누고 치환적분해 $2\sqrt{f(x)-x-2}=x+C$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        $f(4)=7$로 $C=-2$를 정했다.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        $f(x)=\dfrac14x^2+3$ $(x>2)$을 얻었다.
      depends_on: [2.M2, 2.A1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3093}
  misconceptions:
  - id: MC-CAL-3093
    outcome_code: '71'
    wrong_work: '$u=f(x)-x-2$로 치환하면서 $du=f''(x)dx$로 두어 $-1$을 빠뜨림'
    detect_cue: $du$에 $-dx$ 항이 없어 적분식이 맞지 않는다
    feedback: $u=f(x)-x-2$이면 $du=\{f'(x)-1\}dx$입니다. 분자가 바로 이 꼴입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $f(1)$을 구하시오.
  points: 80
  depends_on: ['1', '2']
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f(0)=2$, $f(2)=4$, $f'\ge1$이므로 $0<x<2$에서 $f(x)>x+2$인 점이 있으면 평균값 정리로 $f'(c)<1$인 점이 생겨 모순이다.
    steps:
    - id: 3a
      content: |
        $f'\ge1$, $f(0)=2$, $f(2)=4$ $\Rightarrow$ $(0,2)$에서 $f(x)=x+2$ $\Rightarrow f(1)=3$
      criteria: ['3.M1', '3.M2', '3.R1', '3.A1']
    hint_ladder:
    - $f(0)$과 $f(2)$의 값을 구하자.
    - ①에서 $f'(x)$의 최솟값은 얼마인가?
    - $f(x_0)>x_0+2$인 $x_0\in(0,2)$가 있다고 가정해 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.109~110
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2-1), (2-2)와 $f$의 연속성에 의해 $f(x)=x+2$ $(x\le0)$, $f(x)=\dfrac14x^2+3$ $(x\ge2)$이므로 $f(0)=2$, $f(2)=4$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        식 ①에서 모든 실수 $x$에 대하여 $f'(x)\ge1$ ⋯ ② 이다. 또 근호가 정의되려면 모든 $x$에서 $f(x)\ge x+2$ ⋯ ③ 이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $0<x_0<2$이고 $f(x_0)>x_0+2$인 $x_0$이 있다고 하자. 평균값 정리에 의해 $f'(c)=\dfrac{f(2)-f(x_0)}{2-x_0}=\dfrac{4-f(x_0)}{2-x_0}$인 $c$가 $x_0$과 $2$ 사이에 있는데,
        $\dfrac{4-f(x_0)}{2-x_0}<\dfrac{4-(x_0+2)}{2-x_0}=1$이므로 $f'(c)<1$이 되어 ②에 모순이다. 따라서 $0<x<2$에서 $f(x)\le x+2$이다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        ③과 함께 $f(x)=x+2$ $(0<x<2)$이고, 이렇게 정한 $f$는 모든 조건을 만족한다. 따라서 $f(1)=3$이다.
      criteria: ['3.A1']
  - id: S3-ALT
    audience: ALT
    source_flow: 해설교재 p.110 다른 풀이
    method_no: 2
    key_idea: $g(x)=f(x)-x-2$라 하면 $g'(x)=\sqrt{g(x)}\ge0$이므로 $g$는 감소하지 않는다.
    steps:
    - id: 3c-1
      content: |
        $g(x)=f(x)-x-2$라 두면 $g'(x)=\sqrt{f(x)-x-2}\ge0$이므로 $g$는 감소하지 않는다. $g(0)=g(2)=0$이므로 $0<x<2$에서 $g(x)=0$, 즉 $f(x)=x+2$이고 $f(1)=3$이다.
      criteria: ['3.M1', '3.M2', '3.R1', '3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        연속성으로 $f(0)=2$, $f(2)=4$를 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 2.A2], max_points: 20}
      steps: [3b-1, 3c-1]
    - id: 3.M2
      mark_type: M
      points: 15
      evidence: |
        $f'(x)\ge1$(또는 $g'\ge0$)과 $f(x)\ge x+2$를 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [3b-2, 3c-1]
    - id: 3.R1
      mark_type: R
      points: 30
      evidence: |
        평균값 정리를 이용한 귀류법(또는 $g$의 단조성과 $g(0)=g(2)=0$)으로 $0<x<2$에서 $f(x)=x+2$임을 논증했다.
      depends_on: [3.M1, 3.M2]
      steps: [3b-3, 3c-1]
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $f(1)=3$을 얻었다.
      depends_on: [3.M1, 3.R1]
      steps: [3b-4, 3c-1]
    deductions:
    - code: D3-1
      condition: $0<x<2$에서의 식을 근거 없이 $x+2$(또는 $\tfrac14x^2+3$)로 가정하고 $f(1)$을 계산
      effect: cap
      value: 35
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(단조성 풀이)}
  - {code: '71', misconception: MC-PRF-3104}
  misconceptions:
  - id: MC-PRF-3104
    outcome_code: '71'
    wrong_work: '$0<x<2$에서도 $f(x)=\tfrac14x^2+3$이라 보고 $f(1)=\tfrac{13}4$로 답함'
    detect_cue: $(0,2)$ 구간의 식을 결정하는 논증이 없다
    feedback: (2-2)의 식은 $x>2$에서만 유도되었습니다. $(0,2)$에서는 $f'\ge1$과 양 끝값으로 따로 결정해야 합니다.
    remedy: [RL-3]

