intent: |
  근호 안이 함수인 적분방정식에서 정의역 조건 $f(x)\ge x+2$를 끌어내고, 미분해 얻은 미분방정식을 치환적분으로 풀며, 두 구간의 식을 평균값 정리와 귀류법으로 잇는 능력을 본다.
key_idea: |
  (가)를 미분하면 $f'(x)=\sqrt{f(x)-x-2}+1\ge1$이고, $x>2$에서는 $\dfrac{f'(x)-1}{\sqrt{f(x)-x-2}}=1$을 적분해 $2\sqrt{f(x)-x-2}=x-2$를 얻는다. $0<x<2$에서는 $f(0)=2$, $f(2)=4$와 $f'\ge1$로 $f(x)=x+2$가 강제된다.
stuck: |
  근호가 정의되려면 모든 $x$에서 $f(x)\ge x+2$라는 숨은 조건을 읽는 것, 그리고 $0<x<2$에서 $f(x)>x+2$인 점이 있다고 가정해 평균값 정리로 모순을 만드는 것
idea_tags: [IDEA-HIDDEN-DOMAIN-CONDITION, IDEA-MVT-CONTRADICTION]
tags: [적분방정식, 미분방정식, 평균값 정리, 귀류법]
