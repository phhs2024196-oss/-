  - '$2x^4\ge x^2+1$ $(\lvert x\rvert>1)$로 $f\ge1$'
  - '$h(u)=\int_t^uf(x)dx$에 사잇값 정리'
  - '$1\le\tfrac{g(t)}t\le1+\tfrac2t$ 압축'
  - '$\tfrac{d}{dt}\int_t^{g(t)}f=f(g(t))g''(t)-f(t)$'
  conditions:
  - '$s$가 유일하게 존재 ⇒ 값을 하나 찾으면 그것이 $g(t)$'
  - '$f\ge1$ ⇒ $h(t+2)\ge2$, $h(t)=0$'
  - '$t>1$ ⇒ $t$, $g(t)$ 모두 $\lvert x\rvert>1$ 영역의 식 사용'
