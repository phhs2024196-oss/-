intent: |
  정적분 조건으로 암묵적으로 정의된 함수 $g(t)$에 대해, 구체적 값 확인, 피적분함수의 하한 $f\ge1$과 사잇값 정리로 $g(t)$의 범위를 증명하고, 정적분의 미분과 압축으로 $g'(t)$의 극한을 구하는 능력을 본다.
key_idea: |
  모든 $x$에서 $f(x)\ge1$이므로 $\int_t^{t+2}f\ge2$이고, $h(u)=\int_t^uf$에 사잇값 정리를 쓰면 $t\le g(t)\le t+2$이다. $\int_t^{g(t)}f=2$를 미분하면 $f(g(t))g'(t)=f(t)$이다.
stuck: |
  구간별 함수 모두에서 $f(x)\ge1$임을 확인하는 것, 그리고 $\dfrac{g(t)}{t}\to1$을 $g'(t)=\left\{\dfrac{t}{g(t)}\right\}^4\dfrac{1+g(t)^2}{1+t^2}$에 넣는 것
idea_tags: [IDEA-INTEGRAND-LOWER-BOUND-IVT, IDEA-SQUEEZE-RATIO]
tags: [정적분으로 정의된 함수, 사잇값 정리, 극한]
