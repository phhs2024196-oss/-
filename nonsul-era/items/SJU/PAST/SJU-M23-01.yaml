intent: |
  단면의 넓이를 적분해 물의 부피를 높이의 함수로 나타내고, 부피의 시간 변화율로부터 높이의 변화율과 이계도함수(시간에 대한, 높이에 대한)를 구하는 능력을 본다.
key_idea: |
  $81\pi t=V(t)=\pi\displaystyle\int_0^{h(t)}(20y-y^2)dy$. 양변을 미분하면 $81=h'(t)\{20h-h^2\}$이고, $\dfrac{dt}{dy}=\dfrac{20y-y^2}{81}$은 역함수 관계로 얻는다.
stuck: |
  $\dfrac{d^2y}{dt^2}$를 구할 때 $\dfrac{d}{dt}=\dfrac{d}{dy}\cdot\dfrac{dy}{dt}$로 연쇄법칙을 적용하는 것과, $\dfrac{d^2t}{dy^2}$이 $\dfrac{1}{d^2y/dt^2}$이 아니라는 것
idea_tags: [IDEA-VOLUME-BY-SECTION-RATE, IDEA-INVERSE-SECOND-DERIV]
tags: [단면의 넓이와 부피, 변화율, 이계도함수]
elements:
  materials:
  - '높이 $y$에서 단면이 반지름 $\sqrt{20y-y^2}$인 원인 반구 모양 용기($0\le y\le10$)'
  - '일정한 속도 $\frac{dV}{dt}=81\pi$로 채워지는 물의 높이 $h(t)$'
  concepts:
  - '단면의 넓이를 이용한 입체의 부피'
  - '정적분으로 정의된 함수의 미분'
  - '합성함수의 미분법(연쇄법칙)'
  - '역함수의 미분법'
  - '이계도함수'
  - '시각에 대한 변화율'
  tools:
  - '$V(t)=V(0)+\int_0^tV''(s)ds=81\pi t$'
  - '$V=\pi\int_0^{h}(20y-y^2)dy=\pi\left(10h^2-\frac{h^3}{3}\right)$'
  - '양변을 $t$로 미분 $\Rightarrow\frac{dy}{dt}=\frac{81}{20y-y^2}$'
  - '$\frac{d}{dt}=\frac{d}{dy}\cdot\frac{dy}{dt}$'
  - '$\frac{dt}{dy}=\frac{1}{dy/dt}$'
  conditions:
  - '$V(0)=0$, $\frac{dV}{dt}=81\pi$ ⇒ $V(t)=81\pi t$'
  - '$h(t)=9$에서 $20h-h^2=99$'
