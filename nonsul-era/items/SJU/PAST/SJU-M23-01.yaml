stimuli: []

stem: |
  높이가 $y$일 때 수평 단면이 반지름의 길이가 $\sqrt{20y-y^2}\,\mathrm{cm}$ (단, $0\le y\le10$)인 원으로 주어지는 반구 모양의 용기가 있다. 이 용기에 물이 채워지고 있고, 시각 $t$에서 용기에 담겨있는 물의 부피를 $V(t)\,\mathrm{cm}^3$라 할 때 $V(0)=0$이고 $\dfrac{dV}{dt}=81\pi\,\mathrm{cm}^3/$초이다. 시각 $t$에서 물의 높이 $y$가 $h(t)\,\mathrm{cm}$라 할 때, 다음 물음에 답하시오. (단, $t$의 단위는 초이다.)
  (그림: 바닥에 놓인 반구 모양 그릇. 바닥에서 높이 $y$인 수평 단면의 원의 반지름이 $\sqrt{20y-y^2}$로 표시됨)

subparts:
- id: '1'
  stem: |
    $h(t)=9$일 때, $t$의 값을 구하시오.
  points: 70
  depends_on: []
  answer: {kind: value, value: '7', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $81\pi t=\pi\left(10h^2-\tfrac{h^3}{3}\right)$에 $h=9$를 대입한다.
    steps:
    - {id: 1a, content: '$81\pi t=\pi(810-243)=567\pi\Rightarrow t=7$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 높이 $h$까지 찬 물의 부피를 단면의 넓이로 나타내 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.92
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $V(t)=V(0)+\displaystyle\int_0^tV'(s)ds=81\pi t$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        높이 $y$에서 단면의 넓이는 $\pi(20y-y^2)$이므로 $V(t)=\pi\displaystyle\int_0^{h(t)}(20y-y^2)dy=\pi\left\{10h(t)^2-\dfrac{h(t)^3}{3}\right\}$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $h(t)=9$이면 $81\pi t=\pi\left(10\times9^2-\dfrac{9^3}{3}\right)=567\pi$이므로 $t=7$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $V(0)=0$, $\dfrac{dV}{dt}=81\pi$에서 $V(t)=81\pi t$를 얻었다.
      depends_on: []
      implied_ok: true
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 30
      evidence: |
        $V=\pi\displaystyle\int_0^{h}(20y-y^2)dy$로 부피를 높이의 함수로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $t=7$을 얻었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 단위(초) 누락
      effect: minus
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3079}
  misconceptions:
  - id: MC-CAL-3079
    outcome_code: '71'
    wrong_work: '단면 반지름을 $10$으로 고정해 $V=100\pi h$로 계산, $t=\tfrac{900}{81}$'
    detect_cue: 부피가 $h$에 대한 일차식이다
    feedback: 단면의 반지름은 높이에 따라 $\sqrt{20y-y^2}$로 변합니다. 단면 넓이를 적분하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $h(t)=9$일 때, $h'(t)$의 값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '9/11', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $81\pi t=\pi\int_0^{h(t)}(20x-x^2)dx$를 $t$로 미분하면 $81=h'(t)\{20h-h^2\}$.
    steps:
    - {id: 2a, content: '$h^{\prime}(t)=\dfrac{81}{20\cdot9-81}=\dfrac{9}{11}$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - 위끝이 $h(t)$인 정적분을 $t$로 미분하면?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.92
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $81\pi t=\pi\displaystyle\int_0^{h(t)}(20x-x^2)dx$의 양변을 $t$로 미분하면 $81\pi=\pi h'(t)\{20h(t)-h(t)^2\}$이다.
      criteria: ['2.M1', '2.A1']
    - id: 2b-2
      content: |
        $h(t)=9$이면 $h'(t)=\dfrac{81}{20\times9-9^2}=\dfrac{81}{99}=\dfrac{9}{11}$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 30
      evidence: |
        부피 식의 양변을 $t$로 미분(정적분으로 정의된 함수의 미분 + 연쇄법칙)했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M2], max_points: 30}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 25
      evidence: |
        $81=h'(t)\{20h(t)-h(t)^2\}$ 또는 동치식을 얻었다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.A2
      mark_type: A
      points: 25
      evidence: |
        $h'(t)=\dfrac{9}{11}$을 얻었다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3075}
  misconceptions:
  - id: MC-CAL-3075
    outcome_code: '71'
    wrong_work: '$\dfrac{d}{dt}\int_0^{h(t)}(20x-x^2)dx=20h-h^2$로 두어 $h^{\prime}(t)$가 사라짐'
    detect_cue: 미분한 식에 $h'(t)$가 없다
    feedback: 위끝이 $h(t)$이므로 연쇄법칙으로 $h'(t)$를 곱해야 합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $h(t)=9$일 때, $\dfrac{d^2y}{dt^2}$과 $\dfrac{d^2t}{dy^2}$을 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: expression, value: 'd2y = -18/1331; d2t = 2/81', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{dy}{dt}=\dfrac{81}{20y-y^2}$, $\dfrac{dt}{dy}=\dfrac{20y-y^2}{81}$을 각각 한 번 더 미분한다.
    steps:
    - {id: 3a, content: '$\dfrac{d^2y}{dt^2}=-\dfrac{81(20-2y)}{(20y-y^2)^2}\cdot\dfrac{dy}{dt}=-\dfrac{18}{1331}$, $\dfrac{d^2t}{dy^2}=\dfrac{20-2y}{81}=\dfrac2{81}$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2']}
    hint_ladder:
    - $\dfrac{dy}{dt}$는 $y$의 함수이다. $t$로 미분하려면?
    - $\dfrac{dt}{dy}$는 $\dfrac{dy}{dt}$와 어떤 관계인가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.92
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $y=h(t)$이므로 (1-2)에서 $\dfrac{dy}{dt}=\dfrac{81}{20y-y^2}$이다. 따라서
        $$\dfrac{d^2y}{dt^2}=\dfrac{d}{dy}\left(\dfrac{81}{20y-y^2}\right)\cdot\dfrac{dy}{dt}=-\dfrac{81(20-2y)}{(20y-y^2)^2}\cdot\dfrac{dy}{dt}.$$
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $y=9$, $\dfrac{dy}{dt}=\dfrac{9}{11}$을 대입하면 $\dfrac{d^2y}{dt^2}=-\dfrac{81\cdot2}{99^2}\cdot\dfrac{9}{11}=-\dfrac{18}{11^3}=-\dfrac{18}{1331}$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        역함수의 미분법으로 $\dfrac{dt}{dy}=\dfrac{1}{dy/dt}=\dfrac{20y-y^2}{81}$이고 $\dfrac{d^2t}{dy^2}=\dfrac{20-2y}{81}$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $y=9$를 대입하면 $\dfrac{d^2t}{dy^2}=\dfrac{2}{81}$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 25
      evidence: |
        $\dfrac{d^2y}{dt^2}=\dfrac{d}{dy}\left(\dfrac{dy}{dt}\right)\cdot\dfrac{dy}{dt}$로 연쇄법칙을 적용했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 25}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $\dfrac{d^2y}{dt^2}=-\dfrac{18}{1331}$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        $\dfrac{dt}{dy}=\dfrac{20y-y^2}{81}$을 쓰고 $y$로 미분했다.
      depends_on: []
      implied_ok: false
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        $\dfrac{d^2t}{dy^2}=\dfrac{2}{81}$을 얻었다.
      depends_on: [3.M2]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3080}
  misconceptions:
  - id: MC-CAL-3080
    outcome_code: '71'
    wrong_work: '$\dfrac{d^2t}{dy^2}=\dfrac{1}{d^2y/dt^2}=-\dfrac{1331}{18}$'
    detect_cue: 두 답이 서로 역수이다
    feedback: 역수 관계는 일계도함수에서만 성립합니다. $\dfrac{dt}{dy}$를 먼저 $y$의 식으로 쓰고 다시 미분하세요.
    remedy: [RL-3]

