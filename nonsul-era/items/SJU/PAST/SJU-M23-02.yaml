stimuli: []

stem: |
  좌표평면에 다음과 같이 매개변수 $t$로 주어지는 곡선 $C$가 있다.
  $$C:x=6t^2+1,\ y=t^3-12t\ \ (t\ge0)$$
  곡선 $C$ 위의 점 $\mathrm{P}$와 점 $(1.0)$ 사이의 곡선 $C$의 길이는 $13$이다.
  (그림: 곡선 $C$는 $y$축 오른쪽 $x$축 근처에서 시작해 아래로 내려가 점 $\mathrm{Q}$에서 가장 낮아진 뒤 오른쪽 위로 올라간다. $\mathrm{P}$는 $\mathrm{Q}$의 왼쪽 위 곡선 위의 점이고, $L_1$은 $\mathrm{P}$에서의 접선으로 $x$축의 음의 부분의 점 $\mathrm{A}$를 지난다. $L_2$는 $\mathrm{Q}$를 지나며 $x$축의 양의 부분의 점 $\mathrm{D}$와 만나고, $L_1$과 $L_2$는 $\mathrm{Q}$ 아래 제4사분면의 점 $\mathrm{B}$에서 만난다.)

subparts:
- id: '1'
  stem: |
    곡선 $C$ 위의 점 중에서 $y$좌표가 최소인 점을 $\mathrm{Q}$라 할 때, $\mathrm{Q}$의 좌표를 구하시오.
  points: 70
  depends_on: []
  answer: {kind: expression, value: '(25, -16)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $y=t^3-12t$는 $t=2$에서 최소($t\ge0$).
    steps:
    - {id: 1a, content: '$\dfrac{dy}{dt}=3t^2-12$, $t=2$에서 최소, $\mathrm{Q}(25,-16)$', criteria: ['1.M1', '1.R1', '1.A1']}
    hint_ladder:
    - $y$를 $t$의 함수로 보고 최솟값을 구해 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.93
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\dfrac{dy}{dx}=\dfrac{dy/dt}{dx/dt}=\dfrac{3t^2-12}{12t}=\dfrac{t^2-4}{4t}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $0<t<2$이면 $\dfrac{dy}{dx}<0$, $t>2$이면 $\dfrac{dy}{dx}>0$이고 $x$는 $t$에 대해 증가하므로 $y$는 $t=2$에서 최소이다. ($t=0$일 때 $y=0$, $t=2$일 때 $y=-16$.)
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        $t=2$이면 $x=25$, $y=-16$이므로 $\mathrm{Q}(25,-16)$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 25
      evidence: |
        $\dfrac{dy}{dx}=\dfrac{t^2-4}{4t}$(또는 $\dfrac{dy}{dt}=3t^2-12$)을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 25
      evidence: |
        부호 변화로 $t=2$에서 $y$가 최소임을 밝혔다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $\mathrm{Q}(25,-16)$을 얻었다.
      depends_on: [1.R1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3081}
  misconceptions:
  - id: MC-CAL-3081
    outcome_code: '71'
    wrong_work: '$\dfrac{dy}{dx}=\dfrac{dx/dt}{dy/dt}$로 두어 부호·임계점을 잘못 판단'
    detect_cue: 기울기 식의 분자·분모가 바뀌었다
    feedback: 매개변수 곡선의 기울기는 $\dfrac{dy/dt}{dx/dt}$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    점 $\mathrm{P}$에서 곡선 $C$에 접하는 직선을 $L_1$이라 할 때, $L_1$의 방정식을 구하시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: '3*x + 4*y + 23 = 0', equivalents: ['y = -3*x/4 - 23/4'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 속력 $\sqrt{(12t)^2+(3t^2-12)^2}=3t^2+12$이므로 길이는 $a^3+12a$.
    steps:
    - {id: 2a, content: '$a^3+12a=13\Rightarrow a=1$, $\mathrm{P}(7,-11)$, 기울기 $-\tfrac34$, $3x+4y+23=0$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - 근호 안의 식이 완전제곱식이 되는지 확인해 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.93
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $t=0$에서 $t=a$까지 곡선의 길이는 $\displaystyle\int_0^a\sqrt{(12t)^2+(3t^2-12)^2}\,dt=\int_0^a(3t^2+12)\,dt=a^3+12a$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $a^3+12a=13$, $(a-1)(a^2+a+13)=0$이므로 $a=1$이고 $\mathrm{P}(7,-11)$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $t=1$에서 $\dfrac{dy}{dx}=\dfrac{t^2-4}{4t}=-\dfrac34$이므로 $L_1$: $y+11=-\dfrac34(x-7)$, 즉 $3x+4y+23=0$이다.
      criteria: ['2.M2', '2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 25
      evidence: |
        곡선의 길이 공식을 세우고 근호 안을 $(3t^2+12)^2$으로 정리했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $a=1$, $\mathrm{P}(7,-11)$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        $t=1$에서 접선의 기울기 $-\dfrac34$을 구했다.
      depends_on: []
      implied_ok: true
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        $L_1:3x+4y+23=0$을 얻었다.
      depends_on: [2.A1, 2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3081}
  misconceptions:
  - id: MC-CAL-3081
    outcome_code: '71'
    wrong_work: '$\dfrac{dy}{dx}=\dfrac{dy}{dt}\cdot\dfrac{dx}{dt}=-9\cdot12$로 기울기를 계산'
    detect_cue: 기울기 값이 $-\tfrac34$이 아닌 큰 수이다
    feedback: $\dfrac{dy}{dx}=\dfrac{dy/dt}{dx/dt}$입니다.
    remedy: [RL-1]

- id: '3'
  stem: |
    직선 $L_1$과 $x$축의 교점을 $\mathrm{A}$라 하고, 점 $\mathrm{Q}$를 지나는 직선 $L_2$에 대하여 $L_1$과 $L_2$의 교점을 $\mathrm{B}$, $L_2$와 $x$축의 교점을 $\mathrm{D}$라 하자. 선분 $\mathrm{AB}$의 길이와 선분 $\mathrm{AD}$의 길이가 같을 때 점 $\mathrm{D}$의 좌표를 구하시오.
  points: 80
  depends_on: ['1', '2']
  answer: {kind: expression, value: '(91/3, 0)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{AH}$($\angle\mathrm{BAD}$의 이등분선)$\perp L_2$. 이등분선은 $L_1$과 $x$축에서 같은 거리인 점의 자취.
    steps:
    - {id: 3a, content: '이등분선 $3x+9y+23=0$ (기울기 $-\tfrac13$), $L_2:3x-y-91=0$, $\mathrm{D}\left(\tfrac{91}{3},0\right)$', criteria: ['3.M1', '3.M2', '3.A1', '3.A2']}
    hint_ladder:
    - 이등변삼각형의 꼭지각의 이등분선은 밑변과 어떤 관계인가?
    - 두 직선 $L_1$, $x$축에서 같은 거리에 있는 점들의 자취는?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.93
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $3x+4\cdot0+23=0$에서 $\mathrm{A}\left(-\dfrac{23}{3},0\right)$이다. $\overline{\mathrm{AB}}=\overline{\mathrm{AD}}$이므로 $\triangle\mathrm{ABD}$는 이등변삼각형이고, $\mathrm{A}$에서 $L_2$에 내린 수선의 발을 $\mathrm{H}$라 하면 $\mathrm{AH}$는 $\angle\mathrm{BAD}$의 이등분선이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        직선 $\mathrm{AH}$ 위의 점 $(x,y)$는 $L_1$과 $x$축에서 같은 거리에 있으므로 $\dfrac{\lvert3x+4y+23\rvert}{\sqrt{3^2+4^2}}=\lvert y\rvert$이고, $3x-y+23=0$ 또는 $3x+9y+23=0$이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $\mathrm{H}$는 제4사분면에 있으므로 직선 $\mathrm{AH}$의 기울기는 음수이고, $\mathrm{AH}:3x+9y+23=0$이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        $L_2$는 $\mathrm{AH}$에 수직(기울기 $3$)이고 $\mathrm{Q}(25,-16)$을 지나므로 $L_2:3x-y-91=0$이다. 따라서 $\mathrm{D}\left(\dfrac{91}{3},0\right)$이다.
      criteria: ['3.A2']
  - id: S3-ALT
    audience: ALT
    source_flow: 해설교재 p.93 별해
    method_no: 2
    key_idea: $L_1$의 경사각 $\theta$에 대해 $\tan\theta=-\tfrac34$이고, 이등분선의 기울기는 $\tan\dfrac\theta2$이다.
    steps:
    - id: 3c-1
      content: |
        $\angle\mathrm{BAD}$를 $L_1$이 $x$축과 이루는 (음의 방향) 각 $\theta$로 보면 $\angle\mathrm{HAD}=\dfrac\theta2$이고 $-\dfrac34=\tan\theta=\dfrac{2\tan\frac\theta2}{1-\tan^2\frac\theta2}$에서 $\tan\dfrac\theta2=-\dfrac13$(나머지 근 $3$은 부적합)이므로 $\mathrm{AH}$의 기울기는 $-\dfrac13$이다. 따라서 $L_2:3x-y-91=0$, $\mathrm{D}\left(\dfrac{91}3,0\right)$.
      criteria: ['3.M2', '3.A1', '3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $\mathrm{A}\left(-\tfrac{23}{3},0\right)$을 구하고, 이등변삼각형에서 $\mathrm{A}$의 이등분선이 $L_2$에 수직임을 썼다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A2], max_points: 20}
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        거리 조건(또는 반각 공식)으로 이등분선의 후보를 구했다.
      depends_on: []
      implied_ok: false
      steps: [3b-2, 3c-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        그림(제4사분면, D 가 $x$축 양의 부분) 조건으로 이등분선 $3x+9y+23=0$(기울기 $-\tfrac13$)을 골랐다.
      depends_on: [3.M2]
      steps: [3b-3, 3c-1]
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        $L_2:3x-y-91=0$과 $\mathrm{D}\left(\tfrac{91}{3},0\right)$을 얻었다.
      depends_on: [3.M2, 3.A1]
      ft: {allowed: true, from: [1.A1], max_points: 20}
      steps: [3b-4, 3c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '21', meaning: 만점(반각 공식)}
  - {code: '71', misconception: MC-GEO-3082}
  misconceptions:
  - id: MC-GEO-3082
    outcome_code: '71'
    wrong_work: '이등분선 $3x-y+23=0$을 택해 $L_2$의 기울기 $-\tfrac13$, $\mathrm{D}(-23,0)$'
    detect_cue: $\mathrm{D}$가 $x$축 음의 부분(그림과 다른 위치)이다
    feedback: 이등분선은 두 개입니다. 그림의 $\mathrm{B}$, $\mathrm{D}$ 위치(수선의 발이 제4사분면)에 맞는 것을 고르세요.
    remedy: [RL-2]

