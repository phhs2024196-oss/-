# 세종대 2023학년도 신입학 수시모집 논술 모의평가 문제 2 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# [판독확인] 원문 발문의 "점 (1.0)" 은 인쇄 그대로 옮김 — 곡선 C 의 t=0 인 점 (1,0) 의 오식으로 보임(해설도 t=0 부터 길이를 잼).
# [해설 불일치] (2-3) 각의 이등분선은 3x+9y+23=0, 3x-y+23=0 두 개이고 후자를 택하면 D(-23,0) 에서도 AB=AD(=46/3)가 성립한다.
#   원 해설은 그림(D 가 x축 양의 부분, B 가 제4사분면)에 따라 앞의 것을 택함. 답은 그림 조건을 반영한 (91/3,0) 으로 둔다.
