stimuli: []

stem: |
  이차함수 $f(x)$에 대하여 함수 $g(x)$를 $g(x)=f(f(x))$로 정의할 때, 함수 $f(x)$, $g(x)$ 및 실수 $k$가 다음 조건을 만족시킨다.

  (가) $f(k)=f'(k)=0$ (단, $k<0$)
  (나) 함수 $g(x)$는 극값을 하나만 갖는다.
  (다) $g(-1)\le g(0)$

subparts:
- id: '1'
  stem: |
    곡선 $y=f(x)$가 위로 볼록한지, 아니면 아래로 볼록한지 조사하시오.
  points: 80
  depends_on: []
  answer: {kind: choice, value: '아래로 볼록', equivalents: ['a>0'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g'(x)=4a^2\{a(x-k)^2-k\}(x-k)$, 이차 인수의 $\tfrac D4=ak$. $a<0$이면 극값 3개.
    steps:
    - {id: 1a, content: '$a<0\Rightarrow$ 근 $k,\ k\pm\sqrt{k/a}$ (극값 3개), $a>0\Rightarrow$ 근 $k$만 ⇒ $a>0$', criteria: ['1.M1', '1.A1', '1.R1', '1.R2']}
    hint_ladder:
    - 조건 (가)에서 $f(x)$의 꼴을 정해 보자.
    - $g'(x)$를 인수분해해 $a$의 부호에 따라 근의 개수를 세어 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.94
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가)에서 $f(x)=a(x-k)^2$ ($a\ne0$, $k<0$)로 둘 수 있고 $g(x)=a\{a(x-k)^2-k\}^2=a(ax^2-2akx+ak^2-k)^2$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $g'(x)=2a(ax^2-2akx+ak^2-k)\cdot2a(x-k)=4a^2(ax^2-2akx+ak^2-k)(x-k)$이고, 이차식 $ax^2-2akx+ak^2-k$의 판별식은 $\dfrac D4=a^2k^2-a(ak^2-k)=ak$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $a<0$이면 $\dfrac D4>0$이므로 $g'(x)=0$은 서로 다른 세 실근 $x=k$, $k\pm\sqrt{\dfrac ka}$를 갖고 각 점에서 $g'$의 부호가 바뀌어 극값이 세 개이므로 (나)에 모순이다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        $a>0$이면 $\dfrac D4<0$이고 이차 인수는 항상 양수이므로 $g'(x)=0$의 실근은 $x=k$뿐이며 $x<k$에서 $g'<0$, $x>k$에서 $g'>0$이다. $g$는 $x=k$에서만 극솟값을 가져 (나)를 만족한다. 따라서 $a>0$이고 포물선 $y=f(x)$는 아래로 볼록하다.
      criteria: ['1.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        $f(x)=a(x-k)^2$으로 두고 $g(x)$를 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        $g'(x)=4a^2(ax^2-2akx+ak^2-k)(x-k)$와 판별식 $\dfrac D4=ak$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 25
      evidence: |
        $a<0$이면 극값이 세 개여서 (나)에 모순임을 보였다.
      depends_on: [1.A1]
      steps: [1b-3]
    - id: 1.R2
      mark_type: R
      points: 20
      evidence: |
        $a>0$이면 극값이 $x=k$ 하나뿐임을 보이고 아래로 볼록이라 결론지었다.
      depends_on: [1.A1]
      steps: [1b-4]
    deductions: []
