    outcome_code: '71'
    wrong_work: '$a$의 부호를 나누지 않고 "$g^{\prime}(x)=0$의 근이 $x=k$이므로 극값 하나"라고 씀'
    detect_cue: 이차 인수의 판별식(또는 $a<0$ 경우)이 없다
    feedback: $a$의 부호에 따라 이차 인수가 실근을 가질 수 있습니다. 두 경우를 모두 따져 보세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $g''(x)>0$인 $x$의 범위를 구하시오. 또한 $k$의 최댓값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: 'range = all_real; kmax = -1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g''(x)=4a^2\{3a(x-k)^2-k\}>0$. $g$는 $x=k$ 대칭이므로 (다)는 $\lvert k+1\rvert\le\lvert k\rvert$.
    steps:
    - {id: 2a, content: '$g^{\prime\prime}>0$ (모든 실수), $\lvert k+1\rvert\le-k\Rightarrow k\le-\tfrac12$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2']}
    hint_ladder:
    - $g''(x)$의 이차 인수의 판별식을 보자.
    - $g$의 그래프는 어느 직선에 대해 대칭인가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.94~95
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g''(x)=4a^2(3ax^2-6akx+3ak^2-k)$이고, $a>0$, $k<0$이므로 이차식 $3ax^2-6akx+3ak^2-k$의 판별식은 $\dfrac D4=3ak<0$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 모든 실수 $x$에 대하여 $3ax^2-6akx+3ak^2-k>0$이고 $g''(x)>0$이다. $g''(x)>0$인 $x$의 범위는 실수 전체의 집합이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $g(k)=ak^2>0$이고, $f(x)=a(x-k)^2$이 직선 $x=k$에 대해 대칭이므로 $g(x)=f(f(x))$도 $x=k$에 대해 대칭이다. $g$는 $x<k$에서 감소, $x>k$에서 증가하므로 (다) $g(-1)\le g(0)$이려면 $\lvert k-(-1)\rvert\le\lvert k-0\rvert$이어야 한다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $k<0$이므로 $\lvert k+1\rvert\le-k$, 즉 $k\le k+1\le-k$에서 $k\le-\dfrac12$이다. $k$의 최댓값은 $-\dfrac12$이다.
      criteria: ['2.A2']
  - id: S2-ALT
    audience: ALT
    source_flow: 해설교재 p.95 별해
    method_no: 2
    key_idea: $g(-1)=a\{a(1+k)^2-k\}^2$, $g(0)=a(ak^2-k)^2$를 직접 비교한다.
    steps:
    - id: 2c-1
      content: |
        $a>0$, $ak^2-k>0$, $a(1+k)^2-k\ge-k>0$이고 $y=ax^2$은 $x>0$에서 증가하므로 $g(-1)\le g(0)\iff a+2ak+ak^2-k\le ak^2-k\iff a(1+2k)\le0\iff k\le-\dfrac12$이다.
      criteria: ['2.M2', '2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $g''(x)=4a^2(3ax^2-6akx+3ak^2-k)$을 구하고 이차 인수의 판별식 $3ak$를 조사했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.R2], max_points: 20}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        $g''(x)>0$인 범위가 실수 전체임을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 20
      evidence: |
        $g$의 $x=k$ 대칭과 증감(또는 $g(-1)$, $g(0)$의 직접 비교)으로 (다)를 $k$의 부등식으로 바꿨다.
      depends_on: []
      implied_ok: false
      steps: [2b-3, 2c-1]
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        $k\le-\dfrac12$, 최댓값 $-\dfrac12$을 얻었다.
      depends_on: [2.M2]
      steps: [2b-4, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점(대칭)}
  - {code: '21', meaning: 만점(직접 비교)}
  - {code: '71', misconception: MC-CAL-3083}
  misconceptions:
  - id: MC-CAL-3083
    outcome_code: '71'
    wrong_work: '$g(-1)\le g(0)$에서 $g$가 증가함수라 보고 $-1\le0$이므로 항상 성립, $k$의 최댓값 없음(또는 $0$)'
    detect_cue: $g$의 대칭축 $x=k$를 고려하지 않았다
    feedback: $g$는 $x=k$에서 최소이고 그 양쪽이 대칭입니다. 대칭축까지의 거리로 비교하세요.
    remedy: [RL-1]

- id: '3'
  stem: |
    함수 $h(x)$를 $h(x)=g(g(-x))$로 정의할 때 다음 식이 성립하도록 하는 실수 $p$의 최솟값을 구하시오. (단, $p>0$)
    $$\int_0^ph(x)\,dx=\int_p^{2p}h(x)\,dx$$
  points: 80
  depends_on: ['2']
  answer: {kind: value, value: '1/2', equivalents: ['0.5'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h$는 $x=-k$ 대칭, $x<-k$ 감소, $x>-k$ 증가이므로 등식은 $p=-k$에서만 성립하고 $-k\ge\tfrac12$.
    steps:
    - {id: 3a, content: '$h(-k+c)=h(-k-c)$, $h^{\prime}$ 부호 ⇒ $p=-k\ge\tfrac12$', criteria: ['3.M1', '3.M2', '3.R1', '3.A1']}
    hint_ladder:
    - $h$의 그래프는 어느 직선에 대해 대칭인가?
    - $p$가 대칭축보다 작으면 두 적분 중 어느 쪽이 큰가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.95~96
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        모든 실수 $x$에서 $g(x)>0$이다. $g$가 $x=k$에 대해 대칭이므로 임의의 $c$에 대해 $h(-k+c)=g(g(k-c))=g(g(k+c))=h(-k-c)$이고, $h$의 그래프는 직선 $x=-k$에 대해 대칭이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $h'(x)=-g'(g(-x))g'(-x)$이고 $g(-x)>0>k$이므로 $g'(g(-x))>0$이다. 따라서 $x<-k$이면 $-x>k$, $g'(-x)>0$이므로 $h'(x)<0$, $x=-k$이면 $h'(x)=0$, $x>-k$이면 $h'(x)>0$이다. (참고: $h''(x)=g''(g(-x))\{g'(-x)\}^2+g'(g(-x))g''(-x)>0$이므로 아래로 볼록.)
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $p=-k$이면 대칭성으로 $\displaystyle\int_0^{-k}h\,dx=\int_{-k}^{-2k}h\,dx$이다. $0<p<-k$이면 대칭성과 증감에 의해 $\displaystyle\int_0^ph\,dx>\int_p^{2p}h\,dx$, $p>-k$이면 $\displaystyle\int_0^ph\,dx<\int_p^{2p}h\,dx$이다. 따라서 등식을 만족하는 $p$는 $-k$뿐이다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        (3-2)에서 $k\le-\dfrac12$이므로 $p=-k\ge\dfrac12$이고, $p$의 최솟값은 $\dfrac12$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $h(-k+c)=h(-k-c)$로 $h$가 $x=-k$에 대해 대칭임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        $h'(x)=-g'(g(-x))g'(-x)$의 부호로 $x=-k$ 좌우의 증감을 밝혔다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 20}
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
      points: 25
