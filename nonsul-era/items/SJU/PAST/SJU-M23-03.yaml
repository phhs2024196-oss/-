intent: |
  이차함수의 합성함수 $f(f(x))$의 극값 개수를 계수의 부호로 분류해 볼록성을 결정하고, 대칭성과 증감으로 매개변수의 범위와 정적분 등식의 해를 구하는 능력을 본다.
key_idea: |
  $f(x)=a(x-k)^2$이면 $g'(x)=4a^2\{a(x-k)^2-k\}(x-k)$. $a<0$이면 극값 3개, $a>0$이면 1개. $g$는 $x=k$에 대해 대칭인 아래로 볼록 함수이고 $h(x)=g(g(-x))$는 $x=-k$에 대해 대칭이며 $x<-k$에서 감소, $x>-k$에서 증가하므로 등식은 $p=-k$에서만 성립.
stuck: |
  $g'(x)=0$의 이차 인수의 판별식 $\tfrac D4=ak$의 부호로 극값 개수를 나누는 것, 그리고 $\int_0^ph=\int_p^{2p}h$를 대칭축 $x=p$로 해석하는 것
idea_tags: [IDEA-COMPOSITE-QUADRATIC-SHAPE, IDEA-SYMMETRY-AXIS-INTEGRAL]
tags: [합성함수, 볼록성, 대칭, 정적분 등식]
