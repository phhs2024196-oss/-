stem: |
  모든 항이 자연수인 수열 $\{a_n\}$이 다음 조건을 만족시킨다.

  (가) $a_5=4$이고 $a_2<200$

  (나) 모든 자연수 $n$에 대하여 $a_{n+2}=\begin{cases}2a_n & (a_{n+1}\le80)\\ a_{n+1}-80 & (a_{n+1}>80)\end{cases}$

subparts:
- id: '1'
  stem: |
    $a_2$의 최댓값을 구하시오.
  points: 70
  depends_on: []
  answer: {kind: value, value: '80', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_4\le80$이면 $a_2\le40$; $a_4>80$이면 $a_4=84$, 그 앞에서 $a_2=42$ 또는 $a_3=164$이고 $a_2>80$이면 $a_2=244$로 모순.
    steps:
    - {id: 1a, content: '$a_4\le80\Rightarrow a_3=2, a_2=\tfrac{a_4}2\le40$; $a_4=84\Rightarrow a_2=42$ 또는 $a_3=164$, $a_2\le80$; 예 $(82,80,164,84,4)$', criteria: ['1.M1', '1.A1', '1.R1', '1.A2']}
    hint_ladder:
    - $a_5$를 정하는 식은 $a_4$의 크기에 따라 달라진다. 두 경우로 나누자.
    - $a_2>80$이면 $a_3$, $a_4$는 어떻게 되는가? (가)의 $a_2<200$과 비교하자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.76
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (i) $a_4\le80$이면 $a_5=2a_3$에서 $a_3=2\le80$이므로 $a_4=2a_2$이고 $a_2=\dfrac{a_4}{2}\le40$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (ii) $a_4>80$이면 $a_5=a_4-80$에서 $a_4=84$이다. $a_3\le80$이면 $a_4=2a_2$에서 $a_2=42$이다. $a_3>80$이면 $a_4=a_3-80$에서 $a_3=164$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        이때 $a_2>80$이면 $a_3=a_2-80$에서 $a_2=244$인데 이는 $a_2<200$에 모순이다. 따라서 $a_2\le80$이고 $a_3=2a_1$에서 $a_1=82$이며, $a_2$는 $80$ 이하의 모든 자연수가 될 수 있다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        실제로 $a_1=82$, $a_2=80$, $a_3=164$, $a_4=84$, $a_5=4$는 조건을 모두 만족시키므로 $a_2$의 최댓값은 $80$이다.
      criteria: ['1.A2']
  - id: S1-ALT
    audience: ALT
    source_flow: 해설교재 p.76 다른 풀이
    method_no: 2
    key_idea: $a_2>80$을 가정하고 $80<a_2\le160$, $a_2>160$의 두 경우 모두 모순을 보인다.
    steps:
    - id: 1alt-1
      content: |
        $80<a_2\le160$이면 $a_3=a_2-80\le80$이므로 $a_4=2a_2>160$, $a_5=a_4-80=4$에서 $a_4=84$로 모순이다. $a_2>160$이면 $a_3=a_2-80>80$, $a_4=a_2-160$이고, $a_4\le80$이면 $a_3=2$에서 $a_2=82$로 모순, $a_4>80$이면 $a_2=244$로 (가)에 모순이다.
      criteria: ['1.R1']
    - id: 1alt-2
      content: |
        따라서 $a_2\le80$이고, $(a_1,\cdots,a_5)=(82,80,164,84,4)$가 조건을 만족시키므로 최댓값은 $80$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        $a_4\le80$, $a_4>80$으로 나누어 $a_5=4$에서 거꾸로 추적했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        $a_4=84$, $a_3=164$(또는 $a_2=42$) 등 각 갈래의 값을 바르게 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 25
      evidence: |
        $a_2>80$이면 $a_2=244$(또는 다른 모순)가 되어 (가)에 어긋나므로 $a_2\le80$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-3, 1alt-1]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $a_2=80$인 수열의 예를 제시하고 최댓값 $80$을 답했다.
      depends_on: [1.R1]
      steps: [1b-4, 1alt-2]
    deductions:
    - code: D1-1
      condition: $a_2=80$이 실제로 가능한 예(수열)를 제시하지 않음
      effect: minus
      value: 10
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-3059}
  misconceptions:
  - id: MC-CNT-3059
    outcome_code: '71'
    wrong_work: '$a_4\le80$ 경우만 보고 $a_2$의 최댓값을 $40$이라 답함'
    detect_cue: $a_4=84$ 갈래가 없다
    feedback: $a_5=a_4-80$인 경우($a_4>80$)도 있습니다. 모든 갈래를 수형도로 정리하세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $a_1$이 될 수 있는 서로 다른 모든 수의 합을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '902', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a_2\le80$이므로 $a_1=\tfrac{a_3}2$이고 $a_3\in\{2,4,\cdots,80\}\cup\{164\}$.
    steps:
    - {id: 2a, content: '$a_1\in\{1,2,\cdots,40\}\cup\{82\}$, 합 $=820+82=902$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - (1-1)에서 $a_2\le80$이었다. 그러면 $a_3$과 $a_1$은 어떤 관계인가?
    - $a_3$이 될 수 있는 값을 모두 모아 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.77
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1-1)에서 $a_2\le80$이므로 $a_3=2a_1$, 즉 $a_1=\dfrac{a_3}{2}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        (1-1)의 풀이에서 $a_3$은 $2$($a_4\le80$), $2,4,\cdots,80$($a_4=84$, $a_2=42$), $164$($a_4=84$, $a_3>80$)이므로 가능한 수열은 $(1;\,1\sim40;\,2;\,2a_2;\,4)$, $(1\sim40;\,42;\,2a_1;\,84;\,4)$, $(82;\,1\sim80;\,164;\,84;\,4)$이고 모두 조건을 만족시킨다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        따라서 $a_1$은 $40$ 이하의 자연수 또는 $82$이고, 그 합은 $\displaystyle\sum_{k=1}^{40}k+82=820+82=902$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $a_2\le80$에서 $a_1=\dfrac{a_3}{2}$임을 이용했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.R1], max_points: 20}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 35
      evidence: |
        $a_1$이 될 수 있는 값이 $1,2,\cdots,40$과 $82$임을 (표 등으로) 빠짐없이 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 25
      evidence: |
        합 $902$를 얻었다.
      depends_on: [2.A1, 2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-3069}
  misconceptions:
  - id: MC-CNT-3069
    outcome_code: '71'
    wrong_work: '$a_1=1$을 두 갈래에서 각각 세어 $903$으로 답함'
    detect_cue: 합이 $902$보다 $1$(또는 겹친 값만큼) 크다
    feedback: 「서로 다른 수」의 합이므로 여러 경우에서 겹치는 값은 한 번만 더합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $a_8\le90$일 때, $a_9$가 될 수 있는 서로 다른 모든 수의 합을 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: value, value: '200', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a_6=2a_4$이고 $a_4\le20$, $a_4=22$, $a_4=84$일 때만 $a_8\le90$이며 각각 $a_9=16,8,176$.
    steps:
    - {id: 3a, content: '$a_4\le40$: $a_7=8$, $a_8=4a_4$ → $a_9=16$($a_4\le20$) 또는 $8$($a_4=22$); $40<a_4\le80$: $a_8>160$ 불가; $a_4=84$: $a_7=88$, $a_8=8$, $a_9=176$', criteria: ['3.M1', '3.A1', '3.R1', '3.A2', '3.A3']}
    hint_ladder:
    - $a_5=4\le80$이므로 $a_6$은 무엇인가?
    - $a_4$의 크기를 $40$, $80$ 기준으로 나누어 $a_7$, $a_8$을 계산하자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.77
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $a_5=4\le80$이므로 $a_6=2a_4$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (i) $a_4\le40$이면 $a_6\le80$이므로 $a_7=2a_5=8$이고 $a_8=2a_6=4a_4$이다. (1-2)에서 $a_4$는 짝수이므로 $a_8$은 $8$의 배수이다. $a_4\le20$이면 $a_8\le80$이므로 $a_9=2a_7=16$이다. $20<a_4\le40$이면 $a_8>80$이고 $a_8\le90$이므로 $a_8=88$($a_4=22$), $a_9=a_8-80=8$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        (ii) $40<a_4\le80$이면 $80<a_6\le160$이므로 $a_7=a_6-80\le80$이고 $a_8=2a_6>160$이 되어 $a_8\le90$에 어긋난다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        (iii) $a_4>80$이면 $a_4=84$이고 $a_6=168>80$이므로 $a_7=a_6-80=88>80$, $a_8=a_7-80=8\le80$, $a_9=2a_7=176$이다.
      criteria: ['3.A2']
    - id: 3b-5
      content: |
        각 경우의 수열이 실제로 존재하므로($a_4=2$, $a_4=22$, $a_4=84$ 등) $a_9$가 될 수 있는 값은 $16,8,176$이고 합은 $200$이다.
      criteria: ['3.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        $a_6=2a_4$를 쓰고 $a_4$의 크기로 경우를 나눴다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 10}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 25
      evidence: |
        $a_4\le40$에서 $a_9=16$($a_4\le20$), $a_9=8$($a_4=22$)을 구했다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
      points: 15
      evidence: |
        $40<a_4\le80$이면 $a_8>160$이 되어 불가능함을 밝혔다.
      depends_on: [3.M1]
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        $a_4=84$에서 $a_7=88$, $a_8=8$, $a_9=176$을 구했다.
      depends_on: [3.M1]
      steps: [3b-4]
    - id: 3.A3
      mark_type: A
      points: 15
      evidence: |
        합 $16+8+176=200$을 얻었다.
      depends_on: [3.A1, 3.A2, 3.M1]
      steps: [3b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-3059}
  misconceptions:
  - id: MC-CNT-3059
    outcome_code: '71'
