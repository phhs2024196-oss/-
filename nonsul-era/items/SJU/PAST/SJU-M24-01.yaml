intent: |
  한 칸 건너뛴 항을 다음 항의 크기($80$ 기준)에 따라 결정하는 이항 점화식에서, 주어진 항 $a_5=4$로부터 앞 항을 경우별로 역추적하고 뒤 항을 순추적해 가능한 값을 빠짐없이 정리하는 능력을 본다.
key_idea: |
  $a_{n+2}$를 정하는 기준은 $a_{n+1}$의 크기이다. $a_5=4$에서 $a_4\le80$($a_3=2$)과 $a_4>80$($a_4=84$)으로 나누고, $a_2<200$으로 $a_2\le80$을 이끌어 $a_3=2a_1$을 얻는다.
stuck: |
  $a_4=84$ 갈래에서 다시 $a_3\le80$, $a_3>80$($a_3=164$)으로 나누고, $a_2>80$이면 $a_2=244$가 되어 (가)에 모순임을 찾는 것
