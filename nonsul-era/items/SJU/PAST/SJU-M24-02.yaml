intent: |
  음함수의 미분법으로 접선의 기울기와 이계도함수를 구해 곡선이 실수 전체에서 위로 볼록함을 증명하고, 볼록성과 평행한 접선을 이용해 직선과 곡선 사이의 최단 거리를 주는 점을 찾는 능력을 본다.
key_idea: |
  $y'=\dfrac{1-e^{x+y}}{1+e^{x+y}}$이고 $e^{x+y}=x-y$를 대입하면 $y'=\dfrac{1-x+y}{1+x-y}$, $y''=\dfrac{2(y'-1)}{(1+x-y)^2}<0$이다. 기울기 $\tfrac12$인 접선이 접하는 점이 최단점이다.
stuck: |
  곡선이 직선 $y=\tfrac x2-\tfrac12$와 만나지 않음을 접선 $\ell$의 $y$절편 비교와 위로 볼록함으로 확인하는 것
