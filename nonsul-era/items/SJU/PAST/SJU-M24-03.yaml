  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3067}
  misconceptions:
  - id: MC-CAL-3067
    outcome_code: '71'
    wrong_work: '$\tfrac{1}{f(0)}f(h(t))=\tfrac1{(1+t)^2}$로 미분해 $h^{\prime}(t)$를 구하지 못함'
    detect_cue: 미분한 식에 $h'(t)$가 없다
    feedback: 위끝이 $h(t)$이면 $\dfrac{d}{dt}\displaystyle\int_{-1}^{h(t)}f=f(h(t))\,h'(t)$입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $f(x)$가
    $$f(x)=\begin{cases}1+x & (-1\le x\le0)\\ 1-x & (0<x\le1)\end{cases}$$
    로 주어질 때, $h(t)$를 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: 'h(t) = -1 + sqrt(2*t/(1+t)) (0<t<=1); 1 - sqrt(2/(1+t)) (t>1)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $p(x)=\tfrac1{f(0)}\int_{-1}^xf$는 $[-1,1]$에서 증가하는 함수이고 $h(t)=p^{-1}\left(\tfrac{t}{1+t}\right)$; $p(0)=\tfrac12$을 경계로 나눈다.
    steps:
    - {id: 3a, content: '$p(x)=\tfrac{(1+x)^2}2\ (x\le0)$, $1-\tfrac{(1-x)^2}2\ (x>0)$ $\Rightarrow h(t)=-1+\sqrt{\tfrac{2t}{1+t}}\ (0<t\le1)$, $1-\sqrt{\tfrac{2}{1+t}}\ (t>1)$', criteria: ['3.M1', '3.A1', '3.M2', '3.A2', '3.A3']}
    hint_ladder:
    - 주어진 $f$에서 $f(0)$과 $\int_{-1}^xf$를 계산하자.
    - $\int_{-1}^0f=\tfrac12$이므로 $\tfrac{t}{1+t}$가 $\tfrac12$보다 큰지 작은지에 따라 $h(t)$가 $0$의 어느 쪽에 있는지 정해진다.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.80~81
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(0)=1$이다. $p(x)=\dfrac{1}{f(0)}\displaystyle\int_{-1}^xf(y)dy$라 하면 $p(x)=\dfrac{(1+x)^2}{2}\ (-1\le x\le0)$, $p(x)=1-\dfrac{(1-x)^2}{2}\ (0<x\le1)$이다.
      criteria: ['3.M1', '3.A1']
    - id: 3b-2
      content: |
        $p$는 $[-1,1]$에서 증가하므로 역함수가 존재하고, (3-1)에서 $p(h(t))=\dfrac{t}{1+t}$이므로 $h(t)=p^{-1}\left(\dfrac{t}{1+t}\right)$이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $p^{-1}(x)=-1+\sqrt{2x}\ \left(0\le x\le\dfrac12\right)$, $p^{-1}(x)=1-\sqrt{2(1-x)}\ \left(\dfrac12<x\le1\right)$이다.
      criteria: ['3.A2']
    - id: 3b-4
      content: |
        $\dfrac{t}{1+t}\le\dfrac12\iff t\le1$이므로 $h(t)=-1+\sqrt{\dfrac{2t}{1+t}}\ (0<t\le1)$, $h(t)=1-\sqrt{\dfrac{2}{1+t}}\ (t>1)$이다.
      criteria: ['3.A3']
  - id: S3-ALT
    audience: ALT
    source_flow: 해설교재 p.81 다른 풀이
    method_no: 2
    key_idea: $\int_{-1}^af=\tfrac{t}{1+t}$를 $a$에 대한 이차방정식으로 직접 푼다.
    steps:
    - id: 3alt-1
      content: |
        $\displaystyle\int_{-1}^af(x)dx=a+\dfrac{a^2}{2}+\dfrac12\ (-1\le a\le0)$, $a-\dfrac{a^2}{2}+\dfrac12\ (0<a\le1)$이므로 $h(t)$는 이 함수와 직선 $y=\dfrac{t}{1+t}$의 교점의 $x$좌표이다.
      criteria: ['3.M1', '3.A1', '3.M2']
    - id: 3alt-2
      content: |
        (i) $t\le1$이면 $x^2+2x+\left(1-\dfrac{2t}{1+t}\right)=0$의 해 $-1\pm\sqrt{\dfrac{2t}{1+t}}$ 중 $(-1,1)$에 속하는 $h(t)=-1+\sqrt{\dfrac{2t}{1+t}}$. (ii) $t>1$이면 $x^2-2x-\left(1-\dfrac{2t}{1+t}\right)=0$의 해 $1\pm\sqrt{\dfrac{2}{1+t}}$ 중 $h(t)=1-\sqrt{\dfrac{2}{1+t}}$.
      criteria: ['3.A2', '3.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 10
      evidence: |
        $f(0)=1$을 확인하고 $\displaystyle\int_{-1}^xf$를 구간별로 계산하려 했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 10}
      steps: [3b-1, 3alt-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $\dfrac{(1+x)^2}{2}$, $1-\dfrac{(1-x)^2}{2}$(또는 동치식)을 얻었다.
      depends_on: [3.M1]
      steps: [3b-1, 3alt-1]
    - id: 3.M2
      mark_type: M
