intent: |
  바깥 변수 $x$가 피적분함수와 적분 구간에 함께 들어 있는 정적분 함수를 분리해 미분하고, 도함수가 증가함수임과 중간값으로 최소점 $h(t)$의 존재·유일성을 보인 뒤, 그 특성식 $\int_{-1}^{h(t)}f=\tfrac{t}{1+t}f(0)$을 미분하거나 역함수로 풀어 $h'(1)$과 $h(t)$를 구하는 능력을 본다.
key_idea: |
  $g'(x)=(1+t)\left(F(x)-\dfrac{t}{1+t}f(0)\right)$, $F(x)=\displaystyle\int_{-1}^xf(y)dy$이고 $F(1)=f(0)$(조건 (나))이다. $F$가 증가하므로 $g'$은 한 번만 부호가 바뀌고 $F(h(t))=\dfrac{t}{1+t}f(0)$이다.
stuck: |
  $g'(x)$에서 $\int_x^1f$를 $f(0)-F(x)$로 바꿔 $g'$을 $F$ 하나로 정리하고, 조건 (나)를 $F(1)=f(0)$으로 읽어 $0<\tfrac{t}{1+t}f(0)<F(1)$에서 최소점의 존재와 유일성을 끌어내는 것
