stimuli: []

stem: |
  구간 $[-1,1]$에서 정의되는 연속함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) 모든 $x\in(-1,1)$에 대하여 $f(x)>0$

  (나) $f(0)=\displaystyle\int_{-1}^1f(x)dx$

  실수 $x\in[-1,\,1]$와 $t>0$에 대하여 $g(x)=\displaystyle\int_{-1}^x(x-y)f(y)dy+t\int_x^1(y-x)f(y)dy$라고 정의할 때, $g(x)$가 최소가 되도록 하는 $x\in(-1,1)$의 값을 $h(t)$라고 하자.

subparts:
- id: '1'
  stem: |
    $\dfrac{1}{f(0)}\displaystyle\int_{-1}^{h(t)}f(x)dx$를 $t$의 식으로 나타내시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: 't/(1+t)', equivalents: ['t/(t+1)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g'(x)=\int_{-1}^xf-t\int_x^1f=(1+t)\left(F(x)-\tfrac{t}{1+t}f(0)\right)$이고 $F$가 증가하므로 최소점에서 $F(h(t))=\tfrac{t}{1+t}f(0)$.
    steps:
    - {id: 1a, content: '$g^{\prime}(x)=(1+t)\left(F(x)-\tfrac{t}{1+t}f(0)\right)$, $F(-1)=0<\tfrac{t}{1+t}f(0)<f(0)=F(1)\Rightarrow\tfrac1{f(0)}\int_{-1}^{h(t)}f=\tfrac t{1+t}$', criteria: ['1.M1', '1.A1', '1.R1', '1.A2']}
    hint_ladder:
    - 피적분함수의 $(x-y)$를 전개해 $x$를 적분 밖으로 꺼내자.
    - $\int_x^1f=\int_{-1}^1f-\int_{-1}^xf$이고 조건 (나)를 쓰자.
    - $g'(x)$가 증가함수이면 $g$는 어디에서 최소인가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.80
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g(x)=x\displaystyle\int_{-1}^xf(y)dy-\int_{-1}^xyf(y)dy+t\left(\int_x^1yf(y)dy-x\int_x^1f(y)dy\right)$이므로 $g$는 $(-1,1)$에서 미분가능하고
        $g'(x)=\displaystyle\int_{-1}^xf(y)dy+xf(x)-xf(x)+t\left(-xf(x)-\int_x^1f(y)dy+xf(x)\right)=\int_{-1}^xf(y)dy-t\int_x^1f(y)dy$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\int_x^1f=\int_{-1}^1f-\int_{-1}^xf$이므로 $F(x)=\displaystyle\int_{-1}^xf(y)dy$라 하면 $g'(x)=(1+t)\left(F(x)-\dfrac{t}{1+t}F(1)\right)$이고, 조건 (나)에서 $F(1)=f(0)$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        (가)에서 $F$는 증가함수이므로 $g'$도 증가함수이다. $t>0$이므로 $F(-1)=0<\dfrac{t}{1+t}f(0)<f(0)=F(1)$이고, $F(a)=\dfrac{t}{1+t}f(0)$인 $a\in(-1,1)$가 유일하게 존재하며 $x<a$이면 $g'(x)<0$, $x>a$이면 $g'(x)>0$이다. 따라서 $g$는 $x=a$에서 최소이고 $a=h(t)$이다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        그러므로 $F(h(t))=\dfrac{t}{1+t}f(0)$, 즉 $\dfrac{1}{f(0)}\displaystyle\int_{-1}^{h(t)}f(x)dx=\dfrac{t}{1+t}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $x$를 적분 밖으로 꺼내 $g'(x)=\displaystyle\int_{-1}^xf-t\int_x^1f$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        조건 (나)를 써서 $g'(x)=(1+t)\left(F(x)-\tfrac{t}{1+t}f(0)\right)$ 꼴로 정리했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 25
      evidence: |
        $F$의 증가성과 $0<\tfrac{t}{1+t}f(0)<f(0)$으로 $g'$의 부호가 한 점에서 음→양으로 바뀌어 그 점이 최소점임을 밝혔다.
      depends_on: [1.A1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        $\dfrac{1}{f(0)}\displaystyle\int_{-1}^{h(t)}f=\dfrac{t}{1+t}$을 얻었다.
      depends_on: [1.R1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3055}
  misconceptions:
  - id: MC-CAL-3055
    outcome_code: '71'
    wrong_work: '$g^{\prime}(x)=(x-x)f(x)+t(x-x)f(x)=0$으로 미분해 진행하지 못함'
    detect_cue: 피적분함수의 $x$를 분리하지 않고 미적분의 기본정리를 적용했다
    feedback: 피적분함수에 $x$가 있으면 먼저 $(x-y)f(y)=xf(y)-yf(y)$로 나누어 $x$를 적분 밖으로 꺼내야 합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $h(t)$가 $t>0$에서 미분가능하고 $h(1)=0$일 때 $h'(1)$의 값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '1/4', equivalents: ['0.25'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (3-1)의 항등식을 $t$로 미분하면 $\dfrac{f(h(t))h'(t)}{f(0)}=\dfrac{1}{(1+t)^2}$.
    steps:
    - {id: 2a, content: '$t=1$, $h(1)=0$: $h^{\prime}(1)=\tfrac14$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - (3-1)의 결과는 모든 $t>0$에서 성립하는 항등식이다.
    - 위끝이 $h(t)$인 정적분을 $t$로 미분하면 무엇이 곱해지는가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.80
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (3-1)에서 모든 $t>0$에 대해 $\dfrac{1}{f(0)}\displaystyle\int_{-1}^{h(t)}f(x)dx=\dfrac{t}{1+t}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        양변을 $t$에 대하여 미분하면 $\dfrac{1}{f(0)}f(h(t))h'(t)=\dfrac{1}{(1+t)^2}$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $t=1$을 대입하고 $h(1)=0$을 쓰면 $\dfrac{f(0)}{f(0)}h'(1)=\dfrac14$이므로 $h'(1)=\dfrac14$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        (3-1)의 식을 $t$에 대한 항등식으로 보고 미분하려 했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 20}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 35
      evidence: |
        합성함수 미분으로 $\dfrac{f(h(t))h'(t)}{f(0)}=\dfrac{1}{(1+t)^2}$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 25
      evidence: |
        $t=1$, $h(1)=0$을 대입해 $h'(1)=\dfrac14$을 얻었다.
      depends_on: [2.A1, 2.M1]
      steps: [2b-3]
    deductions: []
