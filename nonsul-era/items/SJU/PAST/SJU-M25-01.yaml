intent: |
  두 점에서 접하는 직선 조건을 인수분해 꼴로 바꿔 사차함수를 한 개의 미지수로 나타내고, 이계도함수로 볼록 구간을 구하며, 사잇값 정리로 실근의 위치를 보이는 능력을 본다.
key_idea: |
  $f(x)-(x+1)=k(x+1)^2(x-2)^2$이고, $f(x)=(x+1)\{1+k(x+1)(x-2)^2\}$에서 $g(x)=1+k(x+1)(x-2)^2$의 부호를 $x=-1,0,2,3$에서 비교한다.
stuck: |
  (1-3)에서 $f$를 $(x+1)$로 묶고 남은 삼차식 $g$의 값이 $g(-1)=g(2)=1$, $g(0)=g(3)=1+4k<0$임을 찾아 사잇값 정리를 세 번 쓰는 발상
