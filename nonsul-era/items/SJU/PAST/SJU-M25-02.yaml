intent: |
  삼차함수의 접선이 곡선과 다시 만나는 점의 $x$좌표를 접점의 중근 인수로 구하고, 변곡점과의 관계로 계수를 정하며, 합성함수의 좌우 미분계수 비교로 미분가능 조건과 도함수의 연속성을 판정하는 능력을 본다.
key_idea: |
  접선과 곡선의 교점 방정식은 $(x-t)^2(x+2t-6)=0$이므로 $g(t)=\max(t,\,6-2t)$이고, $h=f\circ g$가 $t=2$에서 미분가능하려면 $-2f'(2)=f'(2)$, 즉 $f'(2)=0$.
stuck: |
