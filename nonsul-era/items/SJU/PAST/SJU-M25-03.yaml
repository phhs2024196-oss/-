stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$와 실수 $a$에 대하여 $g(x)$를 다음과 같이 정의한다.
  $$g(x)=\int_a^xf(t)dt$$
  $f(0)>0$이고 모든 $x$에 대하여 $g(g(x))=4x$일 때, 다음 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    $g(0)$을 구하시오.
  points: 80
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(g(g(x)))=g(4x)$이고 동시에 $=4g(x)$.
    steps:
    - {id: 1a, content: '$g(4x)=4g(x)$에 $x=0$: $g(0)=4g(0)\Rightarrow g(0)=0$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $g$를 세 번 합성한 것을 두 가지 방법으로 계산해 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.55
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $g(g(g(x)))$에서 안쪽 $g(g(x))=4x$를 쓰면 $g(4x)$이고, 바깥쪽에 $y=g(x)$로 $g(g(y))=4y$를 쓰면 $4g(x)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 모든 $x$에 대하여 $g(4x)=4g(x)$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $x=0$을 대입하면 $g(0)=4g(0)$이므로 $g(0)=0$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
