intent: |
  정적분으로 정의된 함수의 합성 관계식 $g(g(x))=4x$에서 $g(4x)=4g(x)$를 끌어내고, 미분과 연속성(극한)으로 피적분함수와 아래끝을 결정하는 능력을 본다.
key_idea: |
  $g(g(g(x)))$를 두 가지로 읽으면 $g(4x)=4g(x)$이고, 미분하면 $f(4x)=f(x)$, 반복하면 $f(x)=f\left(\tfrac{x}{4^n}\right)\to f(0)=2$.
stuck: |
  $g(g(g(x)))$를 안쪽부터, 바깥쪽부터 두 번 계산해 $g(4x)=4g(x)$를 얻는 발상
