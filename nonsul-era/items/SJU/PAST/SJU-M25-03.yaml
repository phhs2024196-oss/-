    wrong_work: '$g(g(0))=0$에서 근거 없이 $g(0)=0$이라 하거나, $g(0)=0$을 가정하고 대입해 확인만 함'
    detect_cue: $g(4x)=4g(x)$ 같은 관계식 없이 결론을 냈다
    feedback: $g(0)=0$은 결론이므로 가정할 수 없습니다. $g(g(g(x)))$를 두 방법으로 계산해 $g(4x)=4g(x)$를 먼저 보이세요.
    remedy: [RL-3]

- id: '2'
  stem: |
    $f(0)$을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g'(g(x))g'(x)=4$에 $x=0$, $g(0)=0$, $g'=f$.
    steps:
    - {id: 2a, content: '$\{f(0)\}^2=4$, $f(0)>0\Rightarrow f(0)=2$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $g(g(x))=4x$의 양변을 미분하자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.55
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(g(x))=4x$의 양변을 미분하면 $g'(g(x))g'(x)=4$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $x=0$을 대입하고 (3-1)의 $g(0)=0$을 쓰면 $g'(0)g'(0)=4$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $g'(x)=f(x)$이므로 $\{f(0)\}^2=4$이고, $f(0)>0$에서 $f(0)=2$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 30
      evidence: |
