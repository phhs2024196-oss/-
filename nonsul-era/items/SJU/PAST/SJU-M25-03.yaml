- id: '3'
  stem: |
    $f(x)$와 $a$를 구하시오.
  points: 80
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'f(x) = 2; a = 0', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g(4x)=4g(x)$를 미분해 $f(4x)=f(x)$, 반복과 연속성으로 $f\equiv f(0)=2$.
    steps:
    - {id: 3a, content: '$f(x)=\lim f\left(\tfrac{x}{4^n}\right)=f(0)=2$, $g(x)=2(x-a)$, $g(0)=0\Rightarrow a=0$', criteria: ['3.M1', '3.R1', '3.A1', '3.A2']}
    hint_ladder:
    - (3-1)에서 얻은 $g(4x)=4g(x)$를 미분하면?
    - $f(x)=f\left(\tfrac x4\right)=f\left(\tfrac{x}{16}\right)=\cdots$의 끝은?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.55
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $g(4x)=4g(x)$의 양변을 미분하면 $4g'(4x)=4g'(x)$, 즉 $f(4x)=f(x)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $x$ 대신 $\dfrac x4$를 넣으면 $f(x)=f\left(\dfrac14x\right)$이고, 반복하면 $f(x)=f\left(\dfrac{1}{4^n}x\right)$이다. $f$가 연속이므로 $f(x)=\displaystyle\lim_{n\to\infty}f\left(\dfrac{1}{4^n}x\right)=f(0)=2$이다.
      criteria: ['3.R1', '3.A1']
    - id: 3b-3
      content: |
        $g(x)=\displaystyle\int_a^x2\,dt=2(x-a)$이고 $g(0)=0$이므로 $a=0$이다(이때 $g(g(x))=4x$ 성립).
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $g(4x)=4g(x)$를 미분해 $f(4x)=f(x)$를 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 20}
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 25
      evidence: |
        반복 대입과 연속성(극한)으로 $f(x)=f(0)$임을 보였다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $f(x)=2$를 얻었다.
      depends_on: [3.R1]
      ft: {allowed: true, from: [2.A2], max_points: 15}
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        $g(x)=2(x-a)$와 $g(0)=0$으로 $a=0$을 얻었다.
      depends_on: [3.M1, 3.A1]
      steps: [3b-3]
    deductions:
    - code: D3-1
      condition: 연속성 언급 없이 $\lim f\left(\tfrac{x}{4^n}\right)=f(0)$을 씀
      effect: minus
      value: 10
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3030}
  misconceptions:
  - id: MC-CAL-3030
    outcome_code: '71'
    wrong_work: '$f(x)=f\left(\tfrac{x}{4^n}\right)$에서 근거 없이 $f(x)=f(0)$이라 씀'
    detect_cue: 「연속이므로」나 극한 기호가 없다
