stimuli: []

stem: |
  실수 전체의 집합에서 연속인 함수 $f(x)$는 모든 실수 $x$에 대하여 다음 조건을 만족시킨다.
  $$f(x)=8f\left(\dfrac{x+1}{2}\right)$$

subparts:
- id: '1'
  stem: |
    실수 $p$에 대하여 $g(x)=\lvert x-1\rvert^p$가 모든 실수 $x$에 대하여 조건
    $$g(x)=8g\left(\dfrac{x+1}{2}\right)$$
    을 만족시킬 때, $p$를 구하여시오.
  points: 70
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g\left(\tfrac{x+1}{2}\right)=\left\lvert\tfrac{x-1}{2}\right\rvert^p=\tfrac{1}{2^p}g(x)$이므로 $8=2^p$.
    steps:
    - {id: 1a, content: '$\lvert x-1\rvert^p=8\cdot\tfrac{\lvert x-1\rvert^p}{2^p}\Rightarrow2^p=8\Rightarrow p=3$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $\tfrac{x+1}{2}-1$을 간단히 해 보자.
    - 양변을 $\lvert x-1\rvert^p$($x\ne1$)로 나누면 무엇이 남는가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.35
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\dfrac{x+1}{2}-1=\dfrac{x-1}{2}$이므로 조건은 $\lvert x-1\rvert^p=8\left\lvert\dfrac{x-1}{2}\right\rvert^p=\dfrac{8}{2^p}\lvert x-1\rvert^p$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $x\ne1$인 $x$(예: $x=3$)에서 $\lvert x-1\rvert^p\ne0$이므로 양변을 나누면 $2^p=8$, 따라서 $p=3$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 40
      evidence: |
        $g\left(\tfrac{x+1}{2}\right)=\left\lvert\tfrac{x-1}{2}\right\rvert^p$로 정리해 조건을 $\lvert x-1\rvert^p$에 대한 식으로 썼다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 30
      evidence: |
        $2^p=8$에서 $p=3$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3036}
  misconceptions:
  - id: MC-CAL-3036
    outcome_code: '71'
    wrong_work: '$\left\lvert\tfrac{x+1}{2}-1\right\rvert$을 $\tfrac{\lvert x+1\rvert}{2}-1$ 등으로 잘못 정리해 $p$를 구하지 못하거나 다른 값을 얻음'
    detect_cue: 안쪽 식 $\tfrac{x-1}{2}$로의 정리가 없다
    feedback: 합성할 때는 안쪽 함수 $\tfrac{x+1}{2}$를 먼저 그대로 대입하고 정리하세요. $\tfrac{x+1}{2}-1=\tfrac{x-1}{2}$입니다.
    remedy: [RL-3]

- id: '2'
  stem: |
    $\displaystyle\int_2^3f(x)dx=A$라 할 때, $\displaystyle\int_2^5f(x)dx$를 $A$의 식으로 나타내시오.
  points: 80
  depends_on: []
  answer: {kind: expression, value: '17*A', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $[3,5]$에서 $f(x)=8f\left(\tfrac{x+1}{2}\right)$로 바꾸고 $u=\tfrac{x+1}{2}$로 치환하면 $[2,3]$으로 돌아온다.
    steps:
    - {id: 2a, content: '$\int_3^5f=\int_3^58f\left(\tfrac{x+1}{2}\right)dx=16\int_2^3f(u)du=16A\Rightarrow\int_2^5f=17A$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $x\in[3,5]$이면 $\tfrac{x+1}{2}$는 어느 구간에 있는가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.35
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        조건을 적분하면 $\displaystyle\int_3^5f(x)dx=\int_3^58f\left(\dfrac{x+1}{2}\right)dx$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $u=\dfrac{x+1}{2}$로 놓으면 $dx=2\,du$이고 $x=3\to u=2$, $x=5\to u=3$이므로
        $\displaystyle\int_3^58f\left(\dfrac{x+1}{2}\right)dx=\int_2^316f(u)du=16A$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $\displaystyle\int_2^5f(x)dx=\int_2^3f(x)dx+\int_3^5f(x)dx=A+16A=17A$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 30
      evidence: |
        $[3,5]$의 적분을 조건식을 써서 $8f\left(\tfrac{x+1}{2}\right)$의 적분으로 바꿨다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 30
      evidence: |
        치환 $u=\tfrac{x+1}{2}$($dx=2du$, 구간 $[2,3]$)으로 $16A$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 20
      evidence: |
        구간을 합쳐 $17A$를 얻었다.
      depends_on: [2.M1, 2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3031}
  misconceptions:
  - id: MC-CAL-3031
    outcome_code: '71'
    wrong_work: '치환에서 $dx=2du$를 빼먹어 $\int_3^5f=8A$, 답 $9A$'
    detect_cue: 계수 $16$ 대신 $8$이 나온다
    feedback: $u=\tfrac{x+1}{2}$이면 $dx=2du$입니다. 치환할 때 미분 계수를 꼭 곱하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    (1-1)에서 구한 $g(x)$에 대하여 $h(x)=\begin{cases}\dfrac{f(x)}{g(x)} & (x\ne1)\\[2mm] 5 & (x=1)\end{cases}$이라 하자.
    $h(x)$가 실수 전체의 집합에서 연속일 때, 모든 자연수 $n$에 대하여
    $$h(x)=h\left(\dfrac{x}{2^n}+\dfrac{1}{2^n}+\dfrac{1}{2^{n-1}}+\cdots+\dfrac12\right)$$
    임을 보이고 $f(x)$를 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: '5*Abs(x - 1)**3', equivalents: ['5*|x-1|^3'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h(x)=h\left(\tfrac{x+1}{2}\right)$을 $n$번 쓰면 인수가 $1+\tfrac{x-1}{2^n}\to1$이므로 연속성에 의해 $h\equiv5$.
    steps:
    - {id: 3a, content: '$h(x)=h\left(\tfrac{x+1}{2}\right)\Rightarrow h(x)=h\left(1+\tfrac{x-1}{2^n}\right)\to h(1)=5\Rightarrow f(x)=5\lvert x-1\rvert^3$', criteria: ['3.M1', '3.R1', '3.M2', '3.A1']}
    hint_ladder:
    - $f$와 $g$가 같은 관계식을 만족하면 그 몫은 어떤 관계식을 만족하는가?
    - $\tfrac{x}{2^n}+\tfrac{1}{2^n}+\cdots+\tfrac12$를 등비수열의 합으로 정리해 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.35
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $x\ne1$이면 $\dfrac{x+1}{2}\ne1$이고, (1-1)에서 $g(x)=8g\left(\dfrac{x+1}{2}\right)$이므로
        $h\left(\dfrac{x+1}{2}\right)=\dfrac{f\left(\frac{x+1}{2}\right)}{g\left(\frac{x+1}{2}\right)}=\dfrac{f(x)/8}{g(x)/8}=h(x)$이다. $x=1$이면 $\dfrac{x+1}{2}=1$이라 자명하다. 따라서 모든 실수 $x$에 대하여 $h(x)=h\left(\dfrac{x+1}{2}\right)$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        이 식을 거듭 적용하면 $h(x)=h\left(\dfrac x2+\dfrac12\right)=h\left(\dfrac x4+\dfrac14+\dfrac12\right)=h\left(\dfrac x8+\dfrac18+\dfrac14+\dfrac12\right)=\cdots$이다.
        $n$에서 성립한다고 하면 인수 $u_n=\dfrac{x}{2^n}+\dfrac{1}{2^n}+\cdots+\dfrac12$에 대해 $h(u_n)=h\left(\dfrac{u_n+1}{2}\right)$이고 $\dfrac{u_n+1}{2}=u_{n+1}$이므로 $n+1$에서도 성립한다(수학적 귀납법).
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        $\dfrac{1}{2^{n-1}}+\cdots+\dfrac12=1-\dfrac{1}{2^{n-1}}$(등비수열의 합)이므로 $u_n=\dfrac{x}{2^n}+\dfrac{1}{2^n}+1-\dfrac{2}{2^n}=1+\dfrac{x-1}{2^n}$이고 $\displaystyle\lim_{n\to\infty}u_n=1$이다.
        $h$가 연속이므로 $h(x)=\displaystyle\lim_{n\to\infty}h(u_n)=h(1)=5$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        따라서 $x\ne1$에서 $f(x)=5g(x)=5\lvert x-1\rvert^3$이고, $f$의 연속성(또는 조건식에 $x=1$ 대입: $f(1)=8f(1)$)으로 $f(1)=0$도 같은 식을 만족한다. $f(x)=5\lvert x-1\rvert^3$.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $f$와 $g$의 관계식에서 $h(x)=h\left(\tfrac{x+1}{2}\right)$을 이끌었다($x=1$ 경우 포함).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 20}
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 25
      evidence: |
        반복 대입(또는 귀납법)으로 모든 자연수 $n$에 대하여 주어진 식이 성립함을 보였다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        인수가 $1+\tfrac{x-1}{2^n}\to1$임을 보이고 $h$의 연속성으로 $h(x)=h(1)=5$를 얻었다.
      depends_on: [3.R1]
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 15
      evidence: |
        $f(x)=5\lvert x-1\rvert^3$을 얻었다.
      depends_on: [3.M2]
      steps: [3b-4]
    deductions:
    - code: D3-1
      condition: 연속성 언급 없이 $\lim h(u_n)=h(1)$로 극한을 함수 안에 넣음
      effect: minus
      value: 10
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3030}
  misconceptions:
  - id: MC-CAL-3030
    outcome_code: '71'
    wrong_work: '$h(x)=h\left(1+\tfrac{x-1}{2^n}\right)$에서 연속성 근거 없이 바로 $h(x)=h(1)$로 결론'
    detect_cue: 「연속이므로」라는 근거나 극한 기호가 없다
    feedback: 인수가 $1$에 가까워질 뿐 $1$이 되지는 않습니다. 연속성이 있어야 $\lim h(u_n)=h(\lim u_n)$을 쓸 수 있습니다.
    remedy: [RL-1]

