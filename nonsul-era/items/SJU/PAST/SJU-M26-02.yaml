stimuli: []

stem: |
  함수 $f(x)=\left\lvert x-\dfrac{\sqrt3}{2}\right\rvert-\dfrac{\sqrt3}{2}$에 대한 다음 물음에 각각 답하시오.

subparts:
- id: '1'
  stem: |
    닫힌 구간 $[-\pi,\,\pi]$에서 정의되는 함수 $g(x)=f(\sin x)$의 그래프를 좌표평면에 그리고 정적분 $\displaystyle\int_{-\pi}^0g(x)dx$와 $\displaystyle\int_0^{\pi}g(x)dx$의 값을 각각 구하시오.
  points: 70
  depends_on: []
  answer: {kind: expression, value: 'I1 = 2; I2 = -sqrt(3)*pi/3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\tfrac{\pi}{3}\le x\le\tfrac{2\pi}{3}$에서만 $g=\sin x-\sqrt3$, 나머지는 $g=-\sin x$.
    steps:
    - {id: 1a, content: '$\int_{-\pi}^0(-\sin x)dx=2$, $\int_0^{\pi}g=2\left\{\int_0^{\pi/3}(-\sin x)dx+\int_{\pi/3}^{\pi/2}(\sin x-\sqrt3)dx\right\}=-\tfrac{\sqrt3\pi}{3}$', criteria: ['1.M1', '1.B1', '1.A1', '1.A2']}
    hint_ladder:
    - $\sin x-\tfrac{\sqrt3}{2}$의 부호가 바뀌는 곳을 찾자.
    - $[0,\pi]$에서 그래프는 $x=\tfrac{\pi}{2}$에 대해 대칭이다.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.36
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $[-\pi,\pi]$에서 $\sin x\ge\dfrac{\sqrt3}{2}\iff\dfrac{\pi}{3}\le x\le\dfrac{2\pi}{3}$이므로
        $g(x)=\begin{cases}\sin x-\sqrt3 & \left(\frac{\pi}{3}\le x\le\frac{2\pi}{3}\right)\\ -\sin x & (\text{그 외})\end{cases}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        그래프: $[-\pi,0]$에서 $y=-\sin x$(최댓값 $1$, $x=-\tfrac{\pi}{2}$), $[0,\tfrac{\pi}{3}]$에서 $-\sin x$로 $-\tfrac{\sqrt3}{2}$까지 감소, $[\tfrac{\pi}{3},\tfrac{2\pi}{3}]$에서 $\sin x-\sqrt3$(꼭대기 $\left(\tfrac{\pi}{2},1-\sqrt3\right)$), $x=\tfrac{\pi}{3},\tfrac{2\pi}{3}$에서 꺾이고 $[\tfrac{2\pi}{3},\pi]$에서 $0$까지 증가.
      criteria: ['1.B1']
    - id: 1b-3
      content: |
        $\displaystyle\int_{-\pi}^0g(x)dx=\int_{-\pi}^0(-\sin x)dx=\Big[\cos x\Big]_{-\pi}^0=2$.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        그래프가 $x=\tfrac{\pi}{2}$에 대해 대칭이므로
        $\displaystyle\int_0^{\pi}g(x)dx=2\left\{\int_0^{\pi/3}(-\sin x)dx+\int_{\pi/3}^{\pi/2}(\sin x-\sqrt3)dx\right\}=2\Big[\cos x\Big]_0^{\pi/3}+2\Big[-\cos x-\sqrt3x\Big]_{\pi/3}^{\pi/2}=-1+\left(1-\dfrac{\sqrt3\pi}{3}\right)=-\dfrac{\sqrt3\pi}{3}$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $\sin x\ge\tfrac{\sqrt3}{2}$인 구간 $\left[\tfrac{\pi}{3},\tfrac{2\pi}{3}\right]$을 기준으로 $g$를 구간별 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 15
      evidence: |
        꺾인 점 $x=\tfrac{\pi}{3},\tfrac{2\pi}{3}$과 최댓값 $1$, 값 $-\tfrac{\sqrt3}{2}$, $1-\sqrt3$이 드러나는 그래프를 그렸다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        $\int_{-\pi}^0g(x)dx=2$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 20
      evidence: |
        $\int_0^{\pi}g(x)dx=-\tfrac{\sqrt3\pi}{3}$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3032}
  misconceptions:
  - id: MC-CAL-3032
    outcome_code: '71'
    wrong_work: '$g(x)=\lvert\sin x-\tfrac{\sqrt3}{2}\rvert-\tfrac{\sqrt3}{2}$를 $[0,\pi]$ 전체에서 $\sin x-\sqrt3$ 또는 $-\sin x$ 하나로 처리'
    detect_cue: 구간 $\left[\tfrac{\pi}{3},\tfrac{2\pi}{3}\right]$의 분리가 없다
    feedback: 절댓값 안의 부호가 바뀌는 점 $\sin x=\tfrac{\sqrt3}{2}$을 먼저 찾아 구간을 나누세요.
    remedy: [RL-1]

- id: '2'
  stem: |
    $h(x)=f(\sin\alpha x)$라 정의할 때, 열린 구간 $(-\pi,\,\pi)$에 속하는 실수 $x$에 대하여 $h(x)$가 극솟값을 갖지 않도록 하는 실수 $\alpha$의 최댓값을 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\sin\alpha x=\tfrac{\sqrt3}{2}$이 되는 첫 양수 $x=\tfrac{\pi}{3\alpha}$에서 $h$가 꺾이며 극소가 되므로 이 점이 $\pi$ 이상이어야 한다.
    steps:
    - {id: 2a, content: '$\alpha=\tfrac13$: $h=-\sin\tfrac x3$ 감소. $\alpha>\tfrac13$: $x=\tfrac{\pi}{3\alpha}\in(0,\pi)$에서 극솟값 $-\tfrac{\sqrt3}{2}$', criteria: ['2.B1', '2.M1', '2.R1', '2.A1']}
    hint_ladder:
    - $h$가 미분가능하지 않은 점은 어디인가?
    - 그 점 좌우에서 $h$는 증가하는가, 감소하는가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.36
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\alpha=\dfrac13$이면 $x\in(-\pi,\pi)$에서 $\sin\dfrac x3<\dfrac{\sqrt3}{2}$이므로 $h(x)=-\sin\dfrac x3$이고, 이는 $(-\pi,\pi)$에서 감소하므로 극솟값이 없다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        $\alpha>\dfrac13$이면 $p(x)=\sin\alpha x-\dfrac{\sqrt3}{2}$이라 하자. $\left(0,\dfrac{\pi}{2\alpha}\right)$에서 $p'(x)=\alpha\cos\alpha x>0$이라 $p$는 증가하고 $p\left(\dfrac{\pi}{3\alpha}\right)=0$이며 $\dfrac{\pi}{3\alpha}<\pi$이다.
        따라서 $\left(0,\dfrac{\pi}{3\alpha}\right)$에서 $p<0$, $\left(\dfrac{\pi}{3\alpha},\min\left(\dfrac{\pi}{2\alpha},\pi\right)\right)$에서 $p>0$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $h(x)=\lvert p(x)\rvert-\dfrac{\sqrt3}{2}$은 $x=\dfrac{\pi}{3\alpha}$ 왼쪽에서 감소, 오른쪽에서 증가하므로 그 점에서 극솟값 $-\dfrac{\sqrt3}{2}$을 갖는다(그래프가 꺾이는 점).
      criteria: ['2.R1']
    - id: 2b-4
      content: |
        그러므로 극솟값을 갖지 않게 하는 $\alpha$의 최댓값은 $\dfrac13$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 20
      evidence: |
        $\alpha=\tfrac13$일 때 $h(x)=-\sin\tfrac x3$이 $(-\pi,\pi)$에서 감소해 극솟값이 없음을 보였다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 20
      evidence: |
        $\alpha>\tfrac13$일 때 $\sin\alpha x-\tfrac{\sqrt3}{2}$의 부호가 $x=\tfrac{\pi}{3\alpha}$($<\pi$)에서 음에서 양으로 바뀜을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 25
      evidence: |
        그 점 좌우의 증감(감소→증가)으로 $h$가 극솟값을 가짐을 근거 있게 보였다.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 15
      evidence: |
        최댓값 $\tfrac13$을 얻었다.
      depends_on: [2.B1, 2.R1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3033}
  misconceptions:
  - id: MC-CAL-3033
    outcome_code: '71'
    wrong_work: '$h''(x)=0$인 점($\cos\alpha x=0$)만 극값 후보로 보아 $x=\tfrac{\pi}{2\alpha}\ge\pi$에서 $\alpha=\tfrac12$이라 답함'
    detect_cue: 꺾인 점 $\sin\alpha x=\tfrac{\sqrt3}{2}$에 대한 검토가 없다
    feedback: 미분가능하지 않은 점에서도 극값이 생깁니다. $x=\tfrac{\pi}{2\alpha}$는 오히려 극댓점이고, 꺾인 점 $\tfrac{\pi}{3\alpha}$가 극솟점입니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    구간 $[0,\,\pi]$에서 정의되는 함수 $F(x)=\displaystyle\int_0^xf(\sin6t)\,dt$의 최솟값과 최댓값을 각각 구하시오.
  points: 80
  depends_on: ['1']
  answer: {kind: expression, value: 'min = -sqrt(3)*pi/18; max = 1 - sqrt(3)*pi/6', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $F$는 $\left[\tfrac{k\pi}{3},\tfrac{k\pi}{3}+\tfrac{\pi}{6}\right]$에서 감소, 다음 $\tfrac{\pi}{6}$에서 증가하며 한 주기마다 $\tfrac{6-\sqrt3\pi}{18}>0$만큼 증가한다.
    steps:
    - {id: 3a, content: '$F\left(\tfrac{\pi}{6}\right)=\tfrac16\int_0^{\pi}f(\sin u)du=-\tfrac{\sqrt3\pi}{18}$, $F(\pi)=\tfrac12\int_{-\pi}^{\pi}f(\sin u)du=1-\tfrac{\sqrt3\pi}{6}$', criteria: ['3.M1', '3.R1', '3.A1', '3.A2']}
    hint_ladder:
    - $f(\sin6t)$는 주기가 얼마인가? 한 주기에서 음수인 부분과 양수인 부분은?
    - $u=6t$로 치환해 (2-1)의 적분을 이용하자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.37
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2-1)의 그래프를 $x$축 방향으로 $\tfrac16$배하면 $y=f(\sin6x)$의 그래프이다. 주기는 $\tfrac{\pi}{3}$이고 $\left(\tfrac{k\pi}{3},\tfrac{k\pi}{3}+\tfrac{\pi}{6}\right)$에서 $f(\sin6x)<0$, $\left(\tfrac{k\pi}{3}+\tfrac{\pi}{6},\tfrac{(k+1)\pi}{3}\right)$에서 $f(\sin6x)>0$이다.
        따라서 $F'(x)=f(\sin6x)$에 의해 $F$는 $x=\tfrac{\pi}{6},\tfrac{\pi}{2},\tfrac{5\pi}{6}$에서 극소, $x=\tfrac{\pi}{3},\tfrac{2\pi}{3}$에서 극대이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $u=6t$로 치환하면 $\displaystyle\int_0^{\pi/6}f(\sin6t)dt=\dfrac16\int_0^{\pi}f(\sin u)du=-\dfrac{\sqrt3\pi}{18}$, $\displaystyle\int_{\pi/6}^{\pi/3}f(\sin6t)dt=\dfrac16\int_{\pi}^{2\pi}f(\sin u)du=\dfrac16\int_{-\pi}^0f(\sin u)du=\dfrac13$이다.
        $\left\lvert\int_0^{\pi/6}f(\sin6t)dt\right\rvert=\tfrac{\sqrt3\pi}{18}<\tfrac13=\int_{\pi/6}^{\pi/3}f(\sin6t)dt$이므로 한 주기 적분은 $\tfrac{6-\sqrt3\pi}{18}>0$이다.
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        주기성에 의해 극솟값은 $F\left(\tfrac{\pi}{6}\right)<F\left(\tfrac{\pi}{2}\right)<F\left(\tfrac{5\pi}{6}\right)$, 극댓값과 끝값은 $F(0)<F\left(\tfrac{\pi}{3}\right)<F\left(\tfrac{2\pi}{3}\right)<F(\pi)$ 순이다.
        최솟값 $F\left(\dfrac{\pi}{6}\right)=-\dfrac{\sqrt3\pi}{18}$.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        최댓값 $F(\pi)=3\displaystyle\int_0^{\pi/3}f(\sin6t)dt=\dfrac36\int_0^{2\pi}f(\sin u)du=\dfrac12\int_{-\pi}^{\pi}f(\sin u)du=\dfrac12\left(2-\dfrac{\sqrt3\pi}{3}\right)=1-\dfrac{\sqrt3\pi}{6}$.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $F'(x)=f(\sin6x)$의 부호(주기 $\tfrac{\pi}{3}$, 반주기마다 음·양)로 $F$의 증감과 극값 후보를 정리했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 20}
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 20
      evidence: |
        치환과 (2-1)의 값으로 반주기 적분 $-\tfrac{\sqrt3\pi}{18}$, $\tfrac13$을 구하고 한 주기 적분이 양수임을 근거로 들었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        최솟값 $-\tfrac{\sqrt3\pi}{18}$을 얻었다.
      depends_on: [3.R1]
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 20
      evidence: |
        최댓값 $1-\tfrac{\sqrt3\pi}{6}$을 얻었다.
      depends_on: [3.R1]
      steps: [3b-4]
