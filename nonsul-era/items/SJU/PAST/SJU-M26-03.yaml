intent: |
  절댓값이 든 정적분을 구간을 나눠 부분적분으로 계산하고, 부등식 $\ln x\le x-1$로 정적분의 부호를 판정하며, 피적분함수에 $x$가 든 정적분으로 정의된 함수를 미분해 최댓점을 찾는 능력을 본다.
key_idea: |
  $f'(x)=\int_{\ln2}^xe^{-t}\ln t\,dt+\int_{\ln3}^xe^{-t}\ln t\,dt=2g(x)-g(\ln3)$이므로 최댓점 $a$에서 $g(\ln3)=2g(a)$.
stuck: |
  $f(x)$를 $x$를 밖으로 뺀 꼴로 바꿔 미분하고, $f'(a)=0$을 $g(\ln3)=2g(a)$로 읽는 발상
