stimuli: []

stem: |
  함수 $f(x)$와 구간 $(0,\infty)$에서 정의되는 함수 $g(x)$를
  $$f(x)=\int_{\ln2}^{\ln3}\lvert x-t\rvert e^{-t}\ln t\,dt,\qquad g(x)=\int_{\ln2}^xe^{-t}\ln t\,dt$$
  와 같이 정의하자.

subparts:
- id: '1'
  stem: |
    $f(1)$의 값을 구하시오.
  points: 80
  depends_on: []
  answer: {kind: value, value: '-log(3)/3*log(log(3)) - log(2)/2*log(log(2)) - 5/6 + 2/E', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\ln2<1<\ln3$이므로 $t=1$에서 나누고, $\int(t-1)e^{-t}dt=-te^{-t}$를 써서 부분적분한다.
    steps:
    - {id: 1a, content: '$f(1)=\int_1^{\ln3}(t-1)e^{-t}\ln t\,dt+\int_1^{\ln2}(t-1)e^{-t}\ln t\,dt=-\tfrac{\ln3}{3}\ln(\ln3)-\tfrac{\ln2}{2}\ln(\ln2)-\tfrac56+\tfrac2e$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $\ln2$와 $\ln3$은 $1$보다 큰가, 작은가?
    - $(t-1)e^{-t}$의 부정적분을 먼저 구해 두자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.38
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\ln2<1<\ln3$이므로 $f(1)=\displaystyle\int_{\ln2}^1(1-t)e^{-t}\ln t\,dt+\int_1^{\ln3}(t-1)e^{-t}\ln t\,dt$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\int(t-1)e^{-t}dt=-(t-1)e^{-t}+\int e^{-t}dt=-te^{-t}+C$이므로 부분적분하면
        $\displaystyle\int_1^{\ln3}(t-1)e^{-t}\ln t\,dt=\Big[-te^{-t}\ln t\Big]_1^{\ln3}+\int_1^{\ln3}e^{-t}dt=-\dfrac{\ln3}{3}\ln(\ln3)-\dfrac13+e^{-1}$.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        같은 방법으로 $\displaystyle\int_{\ln2}^1(1-t)e^{-t}\ln t\,dt=\int_1^{\ln2}(t-1)e^{-t}\ln t\,dt=-\dfrac{\ln2}{2}\ln(\ln2)-\dfrac12+e^{-1}$.
        따라서 $f(1)=-\dfrac{\ln3}{3}\ln(\ln3)-\dfrac{\ln2}{2}\ln(\ln2)-\dfrac56+\dfrac2e$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        $t=1$을 기준으로 절댓값을 풀어 두 적분으로 나눴다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 30
      evidence: |
        $(t-1)e^{-t}$를 적분하는 쪽($-te^{-t}$), $\ln t$를 미분하는 쪽으로 부분적분해 한 구간의 값을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 30
      evidence: |
        $f(1)=-\tfrac{\ln3}{3}\ln(\ln3)-\tfrac{\ln2}{2}\ln(\ln2)-\tfrac56+\tfrac2e$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3035}
  misconceptions:
  - id: MC-CAL-3035
    outcome_code: '71'
    wrong_work: '$\int_{\ln2}^1(1-t)\cdots$를 $\int_1^{\ln2}(t-1)\cdots$로 바꿀 때 또는 경계항 $\big[-te^{-t}\ln t\big]$에서 부호를 틀림'
    detect_cue: 두 구간 결과 중 하나의 $\ln(\ln2)$ 항 또는 $e^{-1}$ 항 부호가 반대이다
    feedback: 적분 구간을 뒤집으면 부호가 한 번, 피적분함수의 부호를 바꾸면 또 한 번 바뀝니다. 경계항은 위끝 값에서 아래끝 값을 뺍니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    양수 $x$에 대하여 $\ln x\le x-1$임과 $g(\ln3)<0$을 보이시오.
  points: 80
  depends_on: []
  answer: {kind: proof, value: 'ln(x) <= x - 1 for x > 0; g(ln3) <= ln(2)/2 - ln(3)/3 = (1/6)*ln(8/9) < 0', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $h(x)=\ln x-x+1$의 최댓값이 $h(1)=0$이고, $e^{-t}\ln t\le e^{-t}(t-1)$을 적분한다.
    steps:
    - {id: 2a, content: '$g(\ln3)\le\int_{\ln2}^{\ln3}(t-1)e^{-t}dt=\big[-te^{-t}\big]_{\ln2}^{\ln3}=\tfrac16\ln\tfrac89<0$', criteria: ['2.M1', '2.R1', '2.M2', '2.A1']}
    hint_ladder:
    - $\ln x-(x-1)$을 함수로 두고 최댓값을 구해 보자.
    - $e^{-t}>0$을 곱해도 부등호 방향은 그대로이다.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.38
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $h(x)=\ln x-x+1$ ($x>0$)이라 하면 $h'(x)=\dfrac1x-1=\dfrac{1-x}{x}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $0<x<1$에서 $h'>0$, $x>1$에서 $h'<0$이므로 $h$는 $x=1$에서 최댓값 $h(1)=0$을 갖는다. 따라서 $h(x)\le0$, 즉 $\ln x\le x-1$이다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        $e^{-t}>0$이므로 $e^{-t}\ln t\le e^{-t}(t-1)$이고, $\displaystyle g(\ln3)=\int_{\ln2}^{\ln3}e^{-t}\ln t\,dt\le\int_{\ln2}^{\ln3}e^{-t}(t-1)dt=\Big[-te^{-t}\Big]_{\ln2}^{\ln3}$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $\Big[-te^{-t}\Big]_{\ln2}^{\ln3}=\dfrac{\ln2}{2}-\dfrac{\ln3}{3}=\dfrac{3\ln2-2\ln3}{6}=\dfrac16\ln\dfrac89<0$이므로 $g(\ln3)<0$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        $h(x)=\ln x-x+1$을 두고 도함수를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 25
      evidence: |
        증감으로 $x=1$에서 최댓값 $0$임을 보여 $\ln x\le x-1$을 결론지었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 20
      evidence: |
        $e^{-t}>0$을 곱한 부등식을 적분해 $g(\ln3)\le\int_{\ln2}^{\ln3}(t-1)e^{-t}dt$를 세웠다.
      depends_on: [2.R1]
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        우변 $=\tfrac16\ln\tfrac89<0$을 계산해 $g(\ln3)<0$을 보였다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 근삿값($\ln2\approx0.69$ 등)만으로 $g(\ln3)<0$을 주장
      effect: cap
      value: 40
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-PRF-0011}
  misconceptions:
  - id: MC-PRF-0011
    outcome_code: '71'
    wrong_work: '피적분함수의 근삿값 몇 개를 계산해 $g(\ln3)<0$이라 주장'
    detect_cue: 부등식 $\ln t\le t-1$의 적분이 없다
    feedback: 수치 근삿값은 증명이 아닙니다. 앞에서 보인 부등식을 적분해 정확한 값으로 비교하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    구간 $[\ln2,\,\ln3]$에서 함수 $f(x)$를 최대로 만드는 $x$의 값을 $a$라고 할 때, $\dfrac{g(a)}{g(\ln3)}$의 값을 구하시오.
  points: 80
  depends_on: ['2']
  answer: {kind: value, value: '1/2', equivalents: ['0.5'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=2g(x)-g(\ln3)$, $f''(x)=2e^{-x}\ln x$로 최댓점이 $f'(a)=0$인 점이다.
    steps:
    - {id: 3a, content: '$f''(\ln2)=-g(\ln3)>0$, $f''(\ln3)=g(\ln3)<0$, $f''$은 $x<1$에서 감소 ⇒ 유일한 $a$, $2g(a)=g(\ln3)$', criteria: ['3.M1', '3.A1', '3.R1', '3.A2']}
    hint_ladder:
    - $\lvert x-t\rvert$를 $t\le x$와 $t\ge x$로 나누고 $x$를 적분 밖으로 빼자.
    - $f'(x)$를 $g$로 나타내 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.38~39
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\ln2\le x\le\ln3$일 때
        $f(x)=\displaystyle\int_{\ln2}^x(x-t)e^{-t}\ln t\,dt+\int_x^{\ln3}(t-x)e^{-t}\ln t\,dt=x\int_{\ln2}^xe^{-t}\ln t\,dt-\int_{\ln2}^xte^{-t}\ln t\,dt+x\int_{\ln3}^xe^{-t}\ln t\,dt-\int_{\ln3}^xte^{-t}\ln t\,dt$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        미분하면 $xe^{-x}\ln x$ 항들이 소거되어 $f'(x)=\displaystyle\int_{\ln2}^xe^{-t}\ln t\,dt+\int_{\ln3}^xe^{-t}\ln t\,dt$이고 $f''(x)=2e^{-x}\ln x$이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $x<1$에서 $f''<0$, $x>1$에서 $f''>0$이라 $f'$은 $x<1$에서 감소, $x>1$에서 증가한다. (3-2)에서 $f'(\ln2)=-g(\ln3)>0$, $f'(\ln3)=g(\ln3)<0$이므로
        $f'(a)=0$인 $a$가 $(\ln2,1)$에 하나 있고 $f$는 $x<a$에서 증가, $x>a$에서 감소한다. 따라서 $f$는 $x=a$에서 최대이다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $f'(a)=\displaystyle\int_{\ln2}^ae^{-t}\ln t\,dt-\int_a^{\ln3}e^{-t}\ln t\,dt=0$이므로 $g(\ln3)=\displaystyle\int_{\ln2}^a+\int_a^{\ln3}=2g(a)$이고 $\dfrac{g(a)}{g(\ln3)}=\dfrac12$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 20
      evidence: |
        $\lvert x-t\rvert$를 $t=x$에서 나누고 $x$를 적분 밖으로 빼서 $f(x)$를 미분 가능한 꼴로 썼다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $f'(x)=\int_{\ln2}^xe^{-t}\ln t\,dt+\int_{\ln3}^xe^{-t}\ln t\,dt$(또는 $2g(x)-g(\ln3)$)와 $f''(x)=2e^{-x}\ln x$를 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
      points: 25
      evidence: |
        $f'$의 증감과 양 끝 부호($g(\ln3)<0$ 이용)로 $f'(a)=0$인 $a$에서 최대임을 근거 있게 보였다.
      depends_on: [3.A1]
      ft: {allowed: true, from: [2.A1], max_points: 25}
      steps: [3b-3]
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        $g(\ln3)=2g(a)$에서 $\tfrac12$을 얻었다.
      depends_on: [3.R1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3034}
  misconceptions:
  - id: MC-CAL-3034
    outcome_code: '71'
    wrong_work: '$x$를 적분 밖으로 빼지 않고 $\dfrac{d}{dx}\int_{\ln2}^x(x-t)e^{-t}\ln t\,dt=(x-x)e^{-x}\ln x=0$으로 계산'
    detect_cue: $f'(x)$에 적분 항이 남지 않았다
    feedback: 피적분함수에 $x$가 있으면 먼저 $x\int\cdots dt-\int t\cdots dt$로 분리한 뒤 곱의 미분과 미적분의 기본정리를 쓰세요.
    remedy: [RL-3]

