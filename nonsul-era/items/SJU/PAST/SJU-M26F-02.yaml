key_idea: |
  $g=\ln f$이면 $g\left(\tfrac{x+1}{2}\right)=1+\tfrac12g(x)$, 미분하면 $g'\left(\tfrac{x+1}{2}\right)=g'(x)$이고, 반복하면 $g'(x)=g'\left(1+\tfrac{x-1}{2^n}\right)\to g'(1)$.
stuck: |
  두 번 미분가능하다는 조건에서 $g'$이 연속임을 끌어내 $\lim_{n\to\infty}g'\left(1+\tfrac{x-1}{2^n}\right)=g'(1)$로 극한을 함수 안에 넣는 단계
