stimuli: []

stem: |
  실수 전체의 집합에서 두 번 미분 가능한 함수 $f(x)$는 모든 실수 $x$에 대하여 다음 세 조건을 만족시킨다.
  $$(1)\ f(x)>0,\qquad(2)\ f'(1)=1,\qquad(3)\ f\left(\dfrac{x+1}{2}\right)=e\sqrt{f(x)}$$
  이때 $g(x)=\ln f(x)$라 정의하자.

subparts:
- id: '1'
  stem: |
    $g'(1)$을 구하시오.
  points: 100
  depends_on: []
  answer: {kind: value, value: 'exp(-2)', equivalents: ['1/e**2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 조건 (3)에 $x=1$을 넣어 $f(1)=e^2$, $g'(1)=\tfrac{f'(1)}{f(1)}$.
    steps:
    - {id: 1a, content: '$f(1)=e\sqrt{f(1)}\Rightarrow f(1)=e^2\Rightarrow g''(1)=\tfrac{1}{e^2}$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - $\tfrac{x+1}{2}=x$가 되는 $x$는?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.40
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (3)에 $x=1$을 대입하면 $f(1)=e\sqrt{f(1)}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f(1)>0$이므로 양변을 $\sqrt{f(1)}$로 나누면 $\sqrt{f(1)}=e$, 즉 $f(1)=e^2$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $g'(x)=\dfrac{f'(x)}{f(x)}$이므로 $g'(1)=\dfrac{f'(1)}{f(1)}=\dfrac{1}{e^2}$이다.
      criteria: ['1.M2', '1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: |
        조건 (3)에 $x=1$을 대입했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 30
      evidence: |
        $f(1)>0$을 근거로 $f(1)=e^2$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 20
      evidence: |
        $g'(x)=\tfrac{f'(x)}{f(x)}$를 썼다.
      depends_on: []
      implied_ok: true
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 20
      evidence: |
        $g'(1)=\tfrac{1}{e^2}$을 얻었다.
      depends_on: [1.M2, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3036}
  misconceptions:
  - id: MC-CAL-3036
    outcome_code: '71'
    wrong_work: '$g''(x)=\tfrac{1}{f(x)}$로 미분해 $g''(1)=\tfrac{1}{e^2}$을 우연히 얻거나, $g''(1)=f''(1)=1$로 둠'
    detect_cue: $f'(x)$ 곱(속미분)이 없다
    feedback: $\ln f(x)$를 미분하면 $\tfrac{f'(x)}{f(x)}$입니다. 바깥 함수 미분 뒤에 안쪽 함수의 도함수를 곱하세요.
    remedy: [RL-2]

- id: '2'
  stem: |
    모든 실수 $x$에 대하여 $g'\left(\dfrac{x+1}{2}\right)=g'(x)$임을 보이고 모든 자연수 $n$에 대하여
    $$g'(x)=g'\left(1+\dfrac{x-1}{2^n}\right)$$
    임을 보이시오.
  points: 120
  depends_on: ['1']
  answer: {kind: proof, value: 'g((x+1)/2) = 1 + g(x)/2 => g1((x+1)/2) = g1(x) => g1(x) = g1(1 + (x-1)/2**n)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 로그를 취하면 $g\left(\tfrac{x+1}{2}\right)=1+\tfrac12g(x)$, 미분하면 양변의 $\tfrac12$이 소거된다.
    steps:
    - {id: 2a, content: '$\tfrac12g''\left(\tfrac{x+1}{2}\right)=\tfrac12g''(x)$, 반복하면 인수 $\tfrac{x}{2^n}+\tfrac1{2^n}+\cdots+\tfrac12=1+\tfrac{x-1}{2^n}$', criteria: ['2.M1', '2.A1', '2.R1']}
    hint_ladder:
    - 곱과 제곱근을 합으로 바꾸려면?
    - 좌변을 미분할 때 안쪽 함수 $\tfrac{x+1}{2}$의 도함수를 잊지 말자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.40
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        조건 (3)의 양변($>0$)에 자연로그를 취하면 $\ln f\left(\dfrac{x+1}{2}\right)=\ln e\sqrt{f(x)}=1+\dfrac12\ln f(x)$, 즉 $g\left(\dfrac{x+1}{2}\right)=1+\dfrac12g(x)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        양변을 $x$에 대해 미분하면 $\dfrac12g'\left(\dfrac{x+1}{2}\right)=\dfrac12g'(x)$이므로 $g'\left(\dfrac{x+1}{2}\right)=g'(x)$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        이 식을 거듭 쓰면 $g'(x)=g'\left(\dfrac x2+\dfrac12\right)=g'\left(\dfrac x4+\dfrac14+\dfrac12\right)=g'\left(\dfrac x8+\dfrac18+\dfrac14+\dfrac12\right)=\cdots=g'\left(\dfrac{x}{2^n}+\dfrac{1}{2^n}+\dfrac{1}{2^{n-1}}+\cdots+\dfrac12\right)$이다(인수 $u_n$에 대해 $\tfrac{u_n+1}{2}=u_{n+1}$이므로 귀납적으로 성립).
        $\dfrac{1}{2^{n-1}}+\cdots+\dfrac12=1-\dfrac{1}{2^{n-1}}$이므로 인수는 $\dfrac{x}{2^n}+\dfrac{1}{2^n}+1-\dfrac{2}{2^n}=1+\dfrac{x-1}{2^n}$이다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 40
      evidence: |
        로그를 취해 $g\left(\tfrac{x+1}{2}\right)=1+\tfrac12g(x)$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 40
      evidence: |
        합성함수 미분으로 $g'\left(\tfrac{x+1}{2}\right)=g'(x)$를 얻었다(양변의 $\tfrac12$ 명시).
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 40
      evidence: |
        반복 대입(귀납)과 등비수열의 합으로 인수가 $1+\tfrac{x-1}{2^n}$임을 보였다.
      depends_on: [2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3036}
  misconceptions:
  - id: MC-CAL-3036
    outcome_code: '71'
    wrong_work: '좌변 미분에서 속미분 $\tfrac12$을 빠뜨려 $g''\left(\tfrac{x+1}{2}\right)=\tfrac12g''(x)$로 씀'
    detect_cue: 결론식에 계수 $\tfrac12$이 남아 있다
    feedback: $g\left(\tfrac{x+1}{2}\right)$을 미분하면 $\tfrac12g'\left(\tfrac{x+1}{2}\right)$입니다. 양변의 $\tfrac12$이 소거됩니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    $g'(x)$와 $g(x)$를 구하시오.
  points: 130
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'g1(x) = exp(-2); g(x) = x*exp(-2) + 2 - exp(-2)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g'$이 연속이므로 $g'(x)=\lim g'\left(1+\tfrac{x-1}{2^n}\right)=g'(1)=\tfrac{1}{e^2}$, $g(1)=2$.
    steps:
    - {id: 3a, content: '$g''(x)=\tfrac{1}{e^2}$, $g(x)=\tfrac{x}{e^2}+2-\tfrac{1}{e^2}$', criteria: ['3.R1', '3.M1', '3.A1', '3.A2']}
    hint_ladder:
    - $n\to\infty$이면 $1+\tfrac{x-1}{2^n}$은 어디로 가는가?
    - 극한을 $g'$ 안으로 넣으려면 $g'$이 어떤 성질을 가져야 하는가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.40
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f$가 두 번 미분가능하므로 $g=\ln f$도 두 번 미분가능하고, 따라서 $g'$은 연속이다.
      criteria: ['3.R1']
    - id: 3b-2
      content: |
        (2-2)에서 $g'(x)=g'\left(1+\dfrac{x-1}{2^n}\right)$이 모든 $n$에서 성립하고 $1+\dfrac{x-1}{2^n}\to1$이므로 $g'(x)=\displaystyle\lim_{n\to\infty}g'\left(1+\dfrac{x-1}{2^n}\right)=g'(1)=\dfrac{1}{e^2}$이다.
      criteria: ['3.M1', '3.A1']
    - id: 3b-3
      content: |
        따라서 $g(x)=\dfrac{1}{e^2}x+C$이고, $g(1)=\ln f(1)=\ln e^2=2$이므로 $C=2-\dfrac{1}{e^2}$, $g(x)=\dfrac{1}{e^2}x+2-\dfrac{1}{e^2}$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.R1
      mark_type: R
      points: 30
      evidence: |
        두 번 미분가능성에서 $g'$이 연속임을 밝혔다.
      depends_on: []
      steps: [3b-1]
    - id: 3.M1
      mark_type: M
      points: 30
      evidence: |
        $n\to\infty$일 때 인수가 $1$로 수렴함을 쓰고 연속성으로 $g'(x)=g'(1)$로 이었다.
      depends_on: [3.R1]
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 30
      evidence: |
        $g'(x)=\tfrac{1}{e^2}$을 얻었다.
      depends_on: [3.M1]
      ft: {allowed: true, from: [1.A2], max_points: 30}
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 40
      evidence: |
        $g(1)=2$로 적분상수를 정해 $g(x)=\tfrac{1}{e^2}x+2-\tfrac{1}{e^2}$을 얻었다.
      depends_on: [3.M1, 3.A1]
      steps: [3b-3]
    deductions:
    - code: D3-1
      condition: 연속성 근거 없이 극한을 $g'$ 안으로 넣음
      effect: minus
      value: 20
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3030}
  misconceptions:
  - id: MC-CAL-3030
    outcome_code: '71'
    wrong_work: '$g''(x)=g''\left(1+\tfrac{x-1}{2^n}\right)$에서 근거 없이 바로 $g''(x)=g''(1)$'
    detect_cue: 「$g'$이 연속」 또는 극한 기호가 없다
    feedback: 인수는 $1$에 한없이 가까워질 뿐입니다. $g'$의 연속성이 있어야 극한과 함숫값을 바꿀 수 있습니다.
    remedy: [RL-1]

