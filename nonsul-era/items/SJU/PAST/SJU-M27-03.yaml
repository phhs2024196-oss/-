stimuli: []

stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$에 대하여 함수
  $$g(x)=\begin{cases}\dfrac12x+1 & (x<0)\\[2mm] f(x) & (x\ge0)\end{cases}$$
  이 실수 전체의 집합에서 미분가능할 때, 다음 물음에 각각 답하시오.

subparts:
- id: '1'
  stem: |
    $g(2)-g'(2)$의 값을 구하시오.
  points: 80
  depends_on: []
  answer: {kind: value, value: '-5/2', equivalents: ['-2.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(0)=1$, $f'(0)=\tfrac12$로 미지수가 하나($\alpha$) 남지만 $f(2)-f'(2)$에서 소거된다.
    steps:
    - {id: 1a, content: '$f(x)=x^3-\tfrac32\alpha x^2+\tfrac12x+1\Rightarrow f(2)-f^{\prime}(2)=(10-6\alpha)-(\tfrac{25}{2}-6\alpha)=-\tfrac52$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $x=0$에서 연속·미분가능 조건을 쓰자.
    - 남은 미지수는 계산에서 사라지는가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.6
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x=0$에서 연속이므로 $f(0)=1$, 미분가능하므로 $f'(0)=\dfrac12$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f'(x)=3x^2-3\alpha x+\dfrac12$ ($\alpha$는 실수)로 두면 $f(x)=x^3-\dfrac32\alpha x^2+\dfrac12x+1$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $g(2)-g'(2)=f(2)-f'(2)=(10-6\alpha)-\left(\dfrac{25}{2}-6\alpha\right)=-\dfrac52$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 30
      evidence: |
        $x=0$에서의 연속·미분가능 조건 $f(0)=1$, $f'(0)=\tfrac12$를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 25
      evidence: |
        $f(x)$를 한 개의 미지수로 나타냈다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 25
      evidence: |
        $-\tfrac52$를 얻었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3006}
  misconceptions:
  - id: MC-CAL-3006
    outcome_code: '71'
    wrong_work: '$f(0)=1$만 쓰고 $f^{\prime}(0)$ 조건 없이 계수 두 개를 남김'
    detect_cue: $f'(0)=\tfrac12$이 없다
    feedback: 미분가능하려면 연결점에서 함숫값과 미분계수가 모두 이어져야 합니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    $g(x)$가 실수 전체의 집합에서 증가할 때, $g(2)$의 최솟값을 구하시오.
  points: 90
  depends_on: ['1']
  answer: {kind: value, value: '10 - 2*sqrt(6)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'$의 두 근의 곱이 $\tfrac16>0$이므로 $\alpha\le\tfrac{\sqrt6}{3}$이면 $[0,\infty)$에서 증가, 그보다 크면 두 양근 사이에서 감소한다.
    steps:
    - {id: 2a, content: '$\alpha\le\tfrac{\sqrt6}{3}\iff$ 증가, $g(2)=10-6\alpha\ge10-2\sqrt6$', criteria: ['2.M1', '2.R1', '2.A1']}
    hint_ladder:
    - $x<0$에서는 이미 증가한다. $[0,\infty)$만 보면 된다.
    - $f'(x)=0$의 두 근의 곱과 합을 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.6~7
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $x<0$에서 $g$는 증가하므로 $[0,\infty)$에서 $f'(x)=3x^2-3\alpha x+\dfrac12\ge0$인 조건을 찾으면 된다. 판별식 $D=9\alpha^2-6$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $D\le0$ ($|\alpha|\le\tfrac{\sqrt6}{3}$)이면 $f'(x)\ge0$이고 $f'=0$인 점은 많아야 하나이므로 증가한다.
        $D>0$이면 두 근의 곱이 $\tfrac16>0$, 합이 $\alpha$이다. $\alpha<-\tfrac{\sqrt6}{3}$이면 두 근이 모두 음수라 $[0,\infty)$에서 $f'>0$이고, $\alpha>\tfrac{\sqrt6}{3}$이면 두 근이 모두 양수라 그 사이에서 $f'<0$이다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        따라서 조건은 $\alpha\le\dfrac{\sqrt6}{3}$이고 $g(2)=f(2)=10-6\alpha$는 $\alpha=\dfrac{\sqrt6}{3}$일 때 최소 $10-2\sqrt6$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 25
      evidence: |
        $[0,\infty)$에서 $f'(x)\ge0$ 조건으로 바꾸고 판별식·근의 위치를 따지기 시작했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 25}
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 40
      evidence: |
        $D\le0$, $D>0$이고 $\alpha<0$, $D>0$이고 $\alpha>0$의 세 경우를 근의 곱·합으로 판정해 $\alpha\le\tfrac{\sqrt6}{3}$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 25
      evidence: |
        최솟값 $10-2\sqrt6$을 얻었다.
      depends_on: [2.R1]
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: $D\le0$ 경우만 다뤄 $|\alpha|\le\tfrac{\sqrt6}{3}$으로 결론(답은 같아도 근거 불완전)
      effect: minus
      value: 20
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-3007}
  misconceptions:
  - id: MC-CAL-3007
    outcome_code: '71'
    wrong_work: '실수 전체에서 $D\le0$이어야 하므로 $-\tfrac{\sqrt6}{3}\le\alpha\le\tfrac{\sqrt6}{3}$'
    detect_cue: 정의역이 $[0,\infty)$로 제한된다는 점과 $\alpha<-\tfrac{\sqrt6}{3}$ 경우가 없다
    feedback: $f$는 $x\ge0$에서만 쓰입니다. 두 근이 모두 음수인 경우도 증가 조건을 만족합니다.
    remedy: [RL-2]

- id: '3'
  stem: |
    모든 정수 $k$에 대하여 $g(k)g(k+1)\ge0$이고, 어떤 정수 $j$에 대하여 $0\le g(j+1)-g(j)\le\dfrac14$일 때, $21-6g'(1)$이 취할 수 있는 값의 범위를 구하시오.
  points: 100
  depends_on: ['1', '2']
  answer: {kind: set, value: '[15, 18] U [29, 30]', equivalents: ['15<=21-6g1(1)<=18 or 29<=21-6g1(1)<=30'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: (가)는 $\alpha\le\tfrac53$, (나)는 $0\le 3j^2+3j-3\alpha j-\tfrac32\alpha+\tfrac32\le\tfrac14$인 $j\ge0$ 존재, 그리고 $21-6g'(1)=18\alpha$.
    steps:
    - {id: 3a, content: '$\tfrac56\le\alpha\le1$ 또는 $\tfrac{29}{18}\le\alpha\le\tfrac53\Rightarrow 18\alpha\in[15,18]\cup[29,30]$', criteria: ['3.M1', '3.R1', '3.M2', '3.A1', '3.A2']}
    hint_ladder:
    - 음의 정수 $k$에서는 $g$의 값이 어떤가?
    - $f(1)$, $f(2)$의 부호가 (가)를 결정한다.
    - $21-6f'(1)$을 $\alpha$로 나타내 보자.
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.7~9
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        조건 (가): $k\le-2$이면 $g(k),g(k+1)\le0$, $k=-1$이면 $g(-1)g(0)=\tfrac12>0$이므로 $k\ge0$만 보면 된다.
        $\alpha\le\tfrac{\sqrt6}{3}$이면 (2)에 의해 $f$가 증가하고 $f(0)=1>0$이라 성립한다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\alpha>\tfrac{\sqrt6}{3}$이면 극소점 $x_2=\tfrac{\alpha}{2}+\tfrac16\sqrt{9\alpha^2-6}$이 있다. $f(1)=\tfrac52-\tfrac32\alpha$, $f(2)=10-6\alpha$이므로
        $\alpha\le\tfrac53$이면 $f(1),f(2)\ge0$이고 $x_2<2$라 $x\ge2$에서 $f$는 증가해 모든 $k\ge0$에서 $f(k)f(k+1)\ge0$이다.
        $\alpha>\tfrac53$이면 $f(0)f(1)=f(1)<0$이라 (가)가 깨진다. 따라서 (가) $\iff\alpha\le\tfrac53$.
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        조건 (나): $j\le-1$이면 $g(j+1)-g(j)=\tfrac12$이므로 $j\ge0$이어야 하고, $f(j+1)-f(j)=3j^2+3j-3\alpha j-\tfrac32\alpha+\tfrac32$이므로
        $\dfrac{2j^2+2j+\frac56}{2j+1}\le\alpha\le\dfrac{2j^2+2j+1}{2j+1}$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $j=0$: $\tfrac56\le\alpha\le1$. $j=1$: $\tfrac{29}{18}\le\alpha\le\tfrac53$. $j\ge2$: 왼쪽 끝이 $j+\tfrac12+\dfrac{1/3}{2j+1}>2>\tfrac53$이라 (가)와 모순.
      criteria: ['3.A1']
    - id: 3b-5
      content: |
        $g'(1)=f'(1)=\tfrac72-3\alpha$이므로 $21-6g'(1)=18\alpha$이고, 구하는 범위는 $15\le21-6g'(1)\le18$ 또는 $29\le21-6g'(1)\le30$이다.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 15
      evidence: |
        음의 정수 구간을 정리해 $k\ge0$만 따지면 됨을 밝히고 (2)의 결과를 활용했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.R1], max_points: 15}
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 30
      evidence: |
        $f(1)$, $f(2)$의 부호와 극소점 위치로 (가)$\iff\alpha\le\tfrac53$을 근거 있게 보였다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 20
      evidence: |
        (나)를 $j\ge0$에서의 $\alpha$의 부등식으로 바꿨다.
      depends_on: []
      implied_ok: false
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 20
      evidence: |
        $j=0,1$의 범위를 구하고 $j\ge2$를 배제했다.
      depends_on: [3.M2, 3.R1]
      steps: [3b-4]
    - id: 3.A2
      mark_type: A
      points: 15
      evidence: |
        $21-6g'(1)=18\alpha$로 바꿔 최종 범위를 얻었다.
      depends_on: [3.A1]
      implied_ok: true
      steps: [3b-5]
    deductions:
    - code: D3-1
      condition: 등호 포함 여부 오류(구간 끝 처리)
      effect: minus
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

