stimuli: []

stem: |
  자연수 $n\ge1$에 대하여 한 변의 길이가 1인 정사각형들이 아래 그림과 같이 $n$줄 쌓여 있다. 즉, 첫 줄은 $n$개의 정사각형이 모두 붙어있고, 그 위로 정사각형을 하나씩 줄여가면서 붙여서 쌓는데 항상 전체의 모양이 좌우대칭이 되도록 한다. 이때 첫 줄 가장 왼쪽에 있는 정사각형의 아래 왼쪽의 꼭짓점을 A, 첫 줄 가장 오른쪽에 있는 정사각형의 아래 오른쪽의 꼭짓점을 B, 가장 윗줄에 있는 정사각형의 왼쪽 위의 꼭짓점을 C라 하자. (아래 그림은 $n=5$일 때의 예이다.)
  (그림: $n=5$일 때 아래에서부터 5개, 4개, 3개, 2개, 1개의 정사각형이 좌우대칭으로 쌓인 계단 모양. 맨 아랫줄 왼쪽 아래 꼭짓점 A, 오른쪽 아래 꼭짓점 B, 맨 윗줄 정사각형의 왼쪽 위 꼭짓점 C가 표시됨)

subparts:
- id: '1'
  stem: |
    $\angle\mathrm{CAB}=\alpha$라고 할 때, $\sin\alpha$를 $n$에 관한 식으로 나타내시오.
  points: 120
  depends_on: []
  answer: {kind: expression, value: '2*n/sqrt(5*n**2 - 2*n + 1)', equivalents: ['n/sqrt(n**2 + (n-1)**2/4)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{C}$에서 $\mathrm{AB}$에 수선을 내리면 밑변 방향 거리 $\tfrac{n-1}{2}$, 높이 $n$인 직각삼각형이 생긴다.
    steps:
    - {id: 1a, content: '$\overline{\mathrm{AC}}=\tfrac{\sqrt{5n^2-2n+1}}{2}$, $\sin\alpha=\tfrac{n}{\overline{\mathrm{AC}}}=\tfrac{2n}{\sqrt{5n^2-2n+1}}$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 맨 윗줄 정사각형의 왼쪽 변은 $\mathrm{A}$에서 가로로 얼마나 떨어져 있는가?
    - 도형의 높이는 몇 줄인가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.10
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{C}$에서 변 $\mathrm{AB}$에 내린 수선의 발을 $\mathrm{C}^{\prime}$이라 한다. 전체가 좌우대칭이고 맨 윗줄 정사각형은 가운데에 놓이므로 그 왼쪽 변은 $\mathrm{A}$로부터 $\dfrac{n-1}{2}$만큼 떨어져 있다. 따라서 $\overline{\mathrm{AC}^{\prime}}=\dfrac{n-1}{2}$이고, $n$줄이 쌓였으므로 $\overline{\mathrm{CC}^{\prime}}=n$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        직각삼각형 $\mathrm{ACC}^{\prime}$에서 $\overline{\mathrm{AC}}=\sqrt{\left(\dfrac{n-1}{2}\right)^2+n^2}=\dfrac{\sqrt{5n^2-2n+1}}{2}$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\sin\alpha=\dfrac{\overline{\mathrm{CC}^{\prime}}}{\overline{\mathrm{AC}}}=\dfrac{2n}{\sqrt{5n^2-2n+1}}$.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 40
      evidence: |
        수선의 발(또는 좌표)을 잡아 $\overline{\mathrm{AC}^{\prime}}=\dfrac{n-1}{2}$, $\overline{\mathrm{CC}^{\prime}}=n$을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 40
      evidence: |
        $\overline{\mathrm{AC}}=\dfrac{\sqrt{5n^2-2n+1}}{2}$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 40
      evidence: |
        $\sin\alpha=\dfrac{2n}{\sqrt{5n^2-2n+1}}$ 또는 동치식을 얻었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3010}
  misconceptions:
  - id: MC-GEO-3010
    outcome_code: '71'
    wrong_work: '$\overline{\mathrm{AC}^{\prime}}=\dfrac{n}{2}$(도형의 대칭축)로 두어 $\sin\alpha=\dfrac{2}{\sqrt5}$'
    detect_cue: 가로 거리에 맨 윗줄 정사각형의 폭 1을 반영하지 않았다
    feedback: C는 맨 윗줄 정사각형의 왼쪽 위 꼭짓점이므로 대칭축 $x=\tfrac n2$에서 $\tfrac12$만큼 왼쪽, 즉 $\tfrac{n-1}{2}$입니다.
    remedy: [RL-1]

- id: '2'
  stem: |
    정사각형들이 모두 한 원으로 둘러싸여 있을 때, 이 원의 반지름의 길이의 최솟값 $r(n)$을 구하시오.
  points: 130
  depends_on: ['1']
  answer: {kind: expression, value: 'sqrt(25*n**4 + 6*n**2 + 1)/(8*n)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 맨 윗줄 정사각형의 오른쪽 위 꼭짓점 $\mathrm{D}$에 대해 $\angle\mathrm{ACB}=\angle\mathrm{ADB}$이므로 A, B, C, D는 한 원 위에 있고, 그 원(삼각형 ABC의 외접원)의 반지름이 $r(n)$이다. 사인법칙 $\tfrac{\overline{\mathrm{BC}}}{\sin\alpha}=2r$.
    steps:
    - {id: 2a, content: '$\overline{\mathrm{BC}}=\tfrac{\sqrt{5n^2+2n+1}}{2}$, $2r=\tfrac{\sqrt{(5n^2+2n+1)(5n^2-2n+1)}}{4n}=\tfrac{\sqrt{25n^4+6n^2+1}}{4n}$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 도형의 가장 바깥쪽 꼭짓점 네 개는 어떤 사각형을 이루는가?
    - 등변사다리꼴은 항상 원에 내접한다. 그 원의 반지름은 어떤 삼각형의 외접원 반지름과 같은가?
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.10
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        맨 윗줄 정사각형의 오른쪽 위 꼭짓점을 $\mathrm{D}$라 하자. 도형이 좌우대칭이므로 $\angle\mathrm{ACB}=\angle\mathrm{ADB}$이고, $\mathrm{C}$, $\mathrm{D}$가 직선 $\mathrm{AB}$의 같은 쪽에 있으므로 원주각의 성질(역)에 의해 $\mathrm{D}$도 삼각형 $\mathrm{ABC}$의 외접원 위에 있다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이 외접원은 도형의 가장 바깥 꼭짓점 A, B, C, D를 모두 지나고 나머지 꼭짓점은 이 원 안에 있으며, 중심이 사다리꼴 ABDC 안에 있으므로 A, B, C, D를 모두 품는 원 중 반지름이 가장 작다. 따라서 $r(n)$은 삼각형 $\mathrm{ABC}$의 외접원의 반지름이다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        $\mathrm{B}$에서 $\mathrm{C}^{\prime}$까지의 거리는 $n-\dfrac{n-1}{2}=\dfrac{n+1}{2}$이므로 $\overline{\mathrm{BC}}=\sqrt{\left(\dfrac{n+1}{2}\right)^2+n^2}=\dfrac{\sqrt{5n^2+2n+1}}{2}$.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        사인법칙과 (1)의 결과에서
        $$2r(n)=\dfrac{\overline{\mathrm{BC}}}{\sin\alpha}=\dfrac{\sqrt{5n^2+2n+1}}{2}\cdot\dfrac{\sqrt{5n^2-2n+1}}{2n}=\dfrac{\sqrt{25n^4+6n^2+1}}{4n}$$
        이므로 $r(n)=\dfrac{\sqrt{25n^4+6n^2+1}}{8n}$이다.
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    source_flow: 자체 풀이(좌표)
    method_no: 2
    key_idea: 좌표 $\mathrm{A}(0,0)$, $\mathrm{B}(n,0)$, $\mathrm{C}\left(\tfrac{n-1}{2},n\right)$에서 외접원의 중심은 대칭축 $x=\tfrac n2$ 위의 $(\tfrac n2,y_0)$이고 $\overline{\mathrm{OA}}=\overline{\mathrm{OC}}$에서 $y_0=\tfrac{3n^2+1}{8n}$을 얻는다.
    steps:
    - id: 2c-1
      content: |
        $\dfrac{n^2}{4}+y_0^2=\dfrac14+(n-y_0)^2$에서 $y_0=\dfrac{3n^2+1}{8n}$이고 $r^2=\dfrac{n^2}{4}+y_0^2=\dfrac{25n^4+6n^2+1}{64n^2}$.
      criteria: ['2.M2', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 30
      evidence: |
        맨 윗줄 오른쪽 위 꼭짓점 $\mathrm{D}$도 삼각형 $\mathrm{ABC}$의 외접원 위에 있음을 대칭성·원주각(또는 등변사다리꼴)으로 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 30
      evidence: |
        구하는 최소 원이 삼각형 $\mathrm{ABC}$의 외접원(즉 A, B, C, D를 지나는 원)임을 근거와 함께 적었다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 30
      evidence: |
        $\overline{\mathrm{BC}}=\dfrac{\sqrt{5n^2+2n+1}}{2}$를 구하고 사인법칙(또는 중심 좌표)으로 반지름을 구하는 식을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A2], max_points: 30}
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 40
      evidence: |
        $r(n)=\dfrac{\sqrt{25n^4+6n^2+1}}{8n}$을 얻었다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-3011}
  misconceptions:
  - id: MC-GEO-3011
    outcome_code: '71'
    wrong_work: '밑변 $\overline{\mathrm{AB}}$를 지름으로 하는 원을 최소 원으로 두어 $r(n)=\dfrac n2$'
    detect_cue: 꼭짓점 C가 원 밖에 있는지 확인하지 않았다($n\ge2$이면 C까지 거리가 $\tfrac n2$보다 크다)
    feedback: 둘러싸는 원은 가장 바깥 꼭짓점 A, B, C, D를 모두 품어야 합니다. 네 점을 지나는 원의 반지름을 사인법칙으로 구하세요.
    remedy: [RL-2]

- id: '3'
  stem: |
    자연수 $n$과 자연수 $d$에 대하여 $f(n)=64n^2(r(n))^2$, $g(n)=\dfrac{206+50d}{3}n^3-\dfrac{3d}{2}n^2$이라 하자. $a_n=f(n)-g(n)$ $(n=1,\,2,\,3,\,\cdots)$이라고 할 때, 수열 $\{a_n\}$은 $n=2d-6$에서 최솟값을 가진다. 이때, $d$의 값을 구하시오.
  points: 150
  depends_on: ['2']
  answer: {kind: value, value: '5', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $p(x)=25x^4+6x^2+1-\tfrac{206+50d}{3}x^3+\tfrac{3d}{2}x^2$이면 $p^{\prime}(x)=x(50x-3)(2x-d-4)$이므로 $x\ge1$에서 $p$는 $x=\tfrac{d+4}{2}$까지 감소, 이후 증가한다. 최소 정수는 $\tfrac{d+4}{2}$ 또는 그 양옆 정수이다.
    steps:
    - {id: 3a, content: '$2d-6=\tfrac{d+4}{2}$ 또는 $2d-6\pm\tfrac12=\tfrac{d+4}{2}$ 중 자연수 해는 $d=5$, 이때 $p(4)=-3111<p(5)=-\tfrac{6073}{2}$', criteria: ['3.M1', '3.A1', '3.R1', '3.A2']}
    hint_ladder:
    - (2)에서 $f(n)$은 어떤 다항식이 되는가?
    - $a_n$을 실수 $x$의 함수로 확장해 미분해 보자.
    - $d$가 자연수이면 $\tfrac{d+4}{2}$는 어떤 꼴의 수인가?
  - id: S3-B
    audience: B
    source_flow: 해설교재 p.11
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2)에서 $f(n)=64n^2\cdot\dfrac{25n^4+6n^2+1}{64n^2}=25n^4+6n^2+1$이다. 실수 $x$에 대해 $h(x)=25x^4+6x^2+1$, $k(x)=\dfrac{206+50d}{3}x^3-\dfrac{3d}{2}x^2$, $p(x)=h(x)-k(x)$로 두면 $a_n=p(n)$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $p^{\prime}(x)=100x^3-(206+50d)x^2+(12+3d)x=x(50x-3)(2x-d-4)$.
        따라서 $1\le x\le\dfrac{d+4}{2}$에서 $p$는 감소하고 $x\ge\dfrac{d+4}{2}$에서 증가한다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        그러므로 $\{a_n\}$의 최솟값은 $\dfrac{d+4}{2}$에 가장 가까운 양옆 정수 중 하나에서 생긴다. $d$가 자연수이므로 $\dfrac{d+4}{2}$는 정수이거나 (정수)$+\dfrac12$이고, 최솟값을 주는 $n=2d-6$에 대해 $2d-6=\dfrac{d+4}{2}$ 또는 $2d-6\pm\dfrac12=\dfrac{d+4}{2}$이어야 한다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        $2d-6=\dfrac{d+4}{2}$이면 $d=\dfrac{16}{3}$, $2d-6-\dfrac12=\dfrac{d+4}{2}$이면 $d=\dfrac{17}{3}$으로 자연수가 아니다. $2d-6+\dfrac12=\dfrac{d+4}{2}$이면 $d=5$이다.
        $d=5$일 때 $p(4)=-3111$, $p(5)=-\dfrac{6073}{2}$이므로 $p(4)<p(5)$이고, $\{a_n\}$은 $n=4=2d-6$에서 최솟값을 가진다. 따라서 $d=5$.
      criteria: ['3.A2']
