  계단 모양으로 쌓은 정사각형 도형에서 좌표·피타고라스 정리로 각의 사인을 구하고, 대칭성과 원주각으로 모든 정사각형을 둘러싸는 최소 원을 외접원으로 바꿔 사인법칙으로 반지름을 구한 뒤, 사차 다항식으로 정의된 수열의 최솟값 위치를 도함수로 분석하는 능력을 본다.
key_idea: |
  맨 윗줄 정사각형의 위쪽 두 꼭짓점 $\mathrm{C}$, $\mathrm{D}$와 $\mathrm{A}$, $\mathrm{B}$는 등변사다리꼴을 이루어 한 원 위에 있고, 이 원이 최소 원이다. $f(n)=25n^4+6n^2+1$이 되어 $p(x)=f(x)-g(x)$의 임계점 $x=\tfrac{d+4}{2}$ 근처 정수에서 수열이 최소가 된다.
stuck: |
  최소 원이 삼각형 $\mathrm{ABC}$의 외접원이라는 판단(점 $\mathrm{D}$도 같은 원 위), 그리고 $\tfrac{d+4}{2}$가 정수 또는 반정수라는 점을 이용해 $2d-6$과 비교하는 것
