intent: |
  문제의 기하학적 정보를 파악하여 수식화한 뒤 여러 수학적 이론을 활용해 필요한 정보를 얻어내는 능력을 본다. 포물선과 접선에 수직인 직선(법선) 사이의 관계를 수식으로 표현하고, 그로부터 유도되는 여러 점들 사이의 기하학적 관계(초점·준선 거리와의 일치, 급수, 극한)를 이해하는지 평가한다(2021 보고서 문항카드 10 출제 의도 요약). 소문항 배점은 채점기준표 배점.
key_idea: |
  $\mathrm{C}\left(a,\dfrac{a^2}{4p}\right)$에서의 법선 $y=-\dfrac{2p}{a}x+2p+\dfrac{a^2}{4p}$의 $y$절편과 $\mathrm{E}$의 $y$좌표 차가 항상 $2p$이다($\overline{\mathrm{DE}}=2|p|$). 이 결과를 $y=nx^2$($p=\tfrac1{4n}$)에 적용하면 $a_n=\dfrac1{2n}$이다.
stuck: |
  법선의 $y$절편에서 $\dfrac{a^2}{4p}$가 상쇄되어 $\overline{\mathrm{DE}}$가 점의 위치와 무관해진다는 관찰, 그리고 $y=nx^2$를 $x^2=4\cdot\dfrac1{4n}y$로 바꿔 [수학 1-ⅰ]을 재사용하는 발상
idea_tags: [IDEA-PARABOLA-NORMAL-SUBNORMAL, IDEA-TELESCOPING-SUM, IDEA-LIMIT-LEADING-TERM]
tags: [포물선의 법선, 초점과 준선, 부분분수 급수, 함수의 극한]
