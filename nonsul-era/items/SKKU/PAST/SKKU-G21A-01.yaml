stimuli:
- id: S1
  label: <제시문1>
  body: |
    초점이 $(0,\,p)$, 준선이 $y=-p$인 포물선의 방정식은 다음과 같다.
    $$x^2=4py\qquad(\text{단, } p\ne0)$$
- id: S2
  label: <제시문2>
  body: |
    포물선 $x^2=4py$ 위의 원점이 아닌 점 $\mathrm{C}$를 지나고 이 점에서의 접선에 수직인 직선이 $y$축과 만나는 점을 $\mathrm{D}$라 한다. 또한, 점 $\mathrm{C}$에서 $y$축에 내린 수선의 발을 $\mathrm{E}$라 한다.
- id: S3
  label: <제시문3>
  body: |
    자연수 $n$에 대하여, 포물선 $y=nx^2$ 위의 원점이 아닌 점 $\mathrm{C}_n$을 지나고 이 점에서의 접선에 수직인 직선이 $y$축과 만나는 점을 $\mathrm{D}_n$이라 한다. 또한, 점 $\mathrm{C}_n$에서 $y$축에 내린 수선의 발을 $\mathrm{E}_n$이라 한다. 이때 선분 $\mathrm{D}_n\mathrm{E}_n$의 길이를 $a_n$이라 한다.
- id: S4
  label: <제시문4>
  body: |
    포물선 $x^2=4py$ 위의 원점이 아닌 점 $\left(a,\,\dfrac{a^2}{4p}\right)$ (단, $a>0$)을 지나고 이 점에서의 접선에 수직인 직선을 $\ell_a$라 한다. 직선 $\ell_a$가 포물선 $x^2=4py$와 만나는 두 점의 $y$좌표의 값을 각각 $f(a)$, $g(a)$라 하고, $\ell_a$가 $x$축과 만나는 점의 $x$좌표의 값을 $h(a)$라 한다.

stem: |
  [수학 1] 다음 <제시문1>~<제시문4>를 읽고 [수학 1-ⅰ] ~ [수학 1-ⅲ]을 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    [수학 1-ⅰ] <제시문2>의 점 $\mathrm{D}$와 점 $\mathrm{E}$ 사이의 거리는, 점 $\mathrm{C}$의 위치에 관계없이 항상 포물선 $x^2=4py$의 초점과 준선 사이의 거리와 같음을 보이고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: 'DE = 2*Abs(p)', equivalents: ['|p-(-p)|'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{C}\left(a,\tfrac{a^2}{4p}\right)$에서 법선의 $y$절편은 $2p+\tfrac{a^2}{4p}$, $\mathrm{E}$의 $y$좌표는 $\tfrac{a^2}{4p}$이므로 차는 $2p$.
    steps:
    - {id: 1a, content: '$\mathrm{D}\left(0,2p+\tfrac{a^2}{4p}\right)$, $\mathrm{E}\left(0,\tfrac{a^2}{4p}\right)$이므로 $\overline{\mathrm{DE}}=2|p|=|p-(-p)|$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 점 $\mathrm{C}$의 좌표를 한 문자 $a$로 나타내 보자.
    - 접선의 기울기가 $\tfrac{a}{2p}$이면 수직인 직선의 기울기는?
    - 초점 $(0,p)$와 준선 $y=-p$ 사이의 거리는 얼마인가?
  - id: S1-B
    audience: B
    source_flow: 2021 보고서 문항카드 10 예시답안 p.180(인쇄 쪽 176)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{C}$를 $\mathrm{C}\left(a,\dfrac{a^2}{4p}\right)$라 두면 $\mathrm{E}$의 좌표는 $\left(0,\dfrac{a^2}{4p}\right)$가 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        한편, $y'=\dfrac{x}{2p}$이므로 $\mathrm{C}$를 지나고 이 점에서의 접선에 수직인 직선의 방정식은
        $$y=-\dfrac{2p}{a}(x-a)+\dfrac{a^2}{4p}=-\dfrac{2p}{a}x+2p+\dfrac{a^2}{4p}$$
        이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        따라서 $\mathrm{D}$의 좌표는 $\left(0,\,2p+\dfrac{a^2}{4p}\right)$이고, 선분 $\mathrm{DE}$의 길이는
        $$\left|2p+\dfrac{a^2}{4p}-\dfrac{a^2}{4p}\right|=2|p|$$
        이다. 이는 포물선의 초점 $(0,p)$와 준선 $y=-p$의 거리 $|p-(-p)|=2|p|$와 일치한다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: |
        접선에 수직인 직선의 방정식 $y=-\dfrac{2p}{a}x+2p+\dfrac{a^2}{4p}$를 도출했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        선분 $\mathrm{DE}$의 길이가 $2|p|$임을 도출하고 초점과 준선 사이의 거리와 같음을 밝혔다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [수학 1-ⅱ] <제시문3>에서 정의된 수열 $\{a_n\}$에 대해서, 무한급수 $\displaystyle\sum_{n=1}^{\infty}a_na_{n+1}$의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '1/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $y=nx^2\iff x^2=4\cdot\tfrac{1}{4n}y$이므로 [수학 1-ⅰ]에서 $a_n=\tfrac1{2n}$, 부분분수로 망원급수.
    steps:
    - {id: 2a, content: '$a_n=2\cdot\tfrac1{4n}=\tfrac1{2n}$, $\sum a_na_{n+1}=\tfrac14\sum\left(\tfrac1n-\tfrac1{n+1}\right)=\tfrac14$', criteria: ['2.M1', '2.A2']}
    hint_ladder:
    - $y=nx^2$를 $x^2=4py$ 꼴로 바꾸면 $p$는?
    - $\tfrac{1}{n(n+1)}$을 두 분수의 차로 나타내 보자.
  - id: S2-B
    audience: B
    source_flow: 2021 보고서 문항카드 10 예시답안 p.180(인쇄 쪽 176)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $x^2=\dfrac1n y=4\left(\dfrac1{4n}\right)y$이므로 [수학 1-ⅰ]의 결과를 사용하면 $a_n=2\left(\dfrac1{4n}\right)=\dfrac1{2n}$임을 알 수 있다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서
        $$\sum_{n=1}^{\infty}a_na_{n+1}=\sum_{n=1}^{\infty}\dfrac1{2n}\dfrac1{2(n+1)}=\dfrac14\sum_{n=1}^{\infty}\dfrac1{n(n+1)}=\dfrac14\sum_{n=1}^{\infty}\left(\dfrac1n-\dfrac1{n+1}\right)=\dfrac14\lim_{n\to\infty}\left(1-\dfrac1{n+1}\right)=\dfrac14$$
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $a_n=\dfrac1{2n}$을 도출했다.
      depends_on: []
      ft: {allowed: true, from: [1.A1], max_points: 5}
      steps: [2b-1]
    - id: 2.A2
      mark_type: A
      points: 5
      evidence: |
        부분합(부분분수)을 이용해 $\displaystyle\sum_{n=1}^{\infty}a_na_{n+1}=\dfrac14$을 도출했다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [수학 1-ⅲ] <제시문4>에서 정의된 $f(a)$, $g(a)$, $h(a)$에 대해서, 극한 $\displaystyle\lim_{a\to\infty}\dfrac{f(a)\,g(a)}{a\,h(a)}$ 의 값은 $p$에 관계없이 일정함을 보이고 그 이유를 논하시오. [판독확인: 원본 보고서 발문의 극한 아래첨자가 "$a\to$"에서 끝나 목표값이 인쇄되어 있지 않음(PDF 글리프에도 없음). 같은 문항카드의 채점기준·예시답안의 $a\to\infty$로 보충]
  points: 10
  depends_on: ['1']
  answer: {kind: proof, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 법선과 포물선의 교점의 $x$좌표는 $a$와 $-\tfrac{8p^2+a^2}{a}$, $h(a)=a+\tfrac{a^3}{8p^2}$이므로 최고차항 비교로 $\tfrac12$.
    steps:
    - {id: 3a, content: '$f(a)g(a)=\tfrac{(8p^2+a^2)^2}{16p^2}$, $ah(a)=a^2+\tfrac{a^4}{8p^2}$, 극한 $=\tfrac{1/(16p^2)}{1/(8p^2)}=\tfrac12$', criteria: ['3.M1', '3.M2', '3.A3']}
    hint_ladder:
    - $\ell_a$의 $x$절편을 구해 보자.
    - $\ell_a$와 포물선을 연립한 이차방정식은 $x=a$를 근으로 가진다.
    - 분자·분모를 $a^4$으로 나누어 보자.
  - id: S3-B
    audience: B
    source_flow: 2021 보고서 문항카드 10 예시답안 p.180-181(인쇄 쪽 176-177)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        접선에 수직인 직선을 $\ell_a$라 하면 $\ell_a:\ y=-\dfrac{2p}{a}(x-a)+\dfrac{a^2}{4p}=-\dfrac{2p}{a}x+2p+\dfrac{a^2}{4p}$. 따라서
        $$h(a)=\dfrac{2p+\dfrac{a^2}{4p}}{\dfrac{2p}{a}}=a+\dfrac{a^3}{8p^2}$$
      criteria: ['3.M2']
    - id: 3b-2
      content: |
        한편 직선 $\ell_a$와 포물선을 연립하면 $\dfrac{x^2}{4p}=-\dfrac{2p}{a}x+2p+\dfrac{a^2}{4p}$, 즉 $x^2+\dfrac{8p^2}{a}x-8p^2-a^2=0$이고, 인수분해하면 $(x-a)\left(x+\dfrac{8p^2+a^2}{a}\right)=0$이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        이로부터 일반성을 잃지 않고 $f(a)=\dfrac1{4p}\left(\dfrac{8p^2+a^2}{a}\right)^2$, $g(a)=\dfrac{a^2}{4p}$라 둘 수 있다.
      criteria: ['3.M1']
    - id: 3b-4
      content: |
        따라서
        $$\lim_{a\to\infty}\dfrac{f(a)g(a)}{ah(a)}=\lim_{a\to\infty}\dfrac{\dfrac1{16p^2}(a^4+16p^2a^2+64p^4)}{a^2+\dfrac{a^4}{8p^2}}=\lim_{a\to\infty}\dfrac{\dfrac1{16p^2}\left(1+\dfrac{16p^2}{a^2}+\dfrac{64p^4}{a^4}\right)}{\dfrac1{a^2}+\dfrac1{8p^2}}=\dfrac{\dfrac1{16p^2}}{\dfrac1{8p^2}}=\dfrac12$$
        이므로 극한값은 $p$에 관계없이 $\dfrac12$로 일정하다.
      criteria: ['3.A3']
