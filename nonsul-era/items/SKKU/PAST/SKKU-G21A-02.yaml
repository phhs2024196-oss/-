intent: |
  유리함수의 그래프 위의 점과 그래프 밖의 점 사이의 거리에 관련된 기하 내용을 이해하는지, 함수의 미분을 이용한 증감 분석 또는 산술-기하 평균을 이용해 최대·최소를 올바르게 구할 수 있는지, 그리고 이를 이용해 유리함수의 그래프 위의 점의 좌표를 그래프 밖의 특정한 점까지의 거리와 관련지을 수 있는지 평가한다(2021 보고서 문항카드 11 출제 의도 요약). 소문항 배점은 채점기준표 배점.
key_idea: |
  $\beta=\dfrac{2\alpha+1}{2\alpha+2}$에서 $2\alpha\beta+2\beta=2\alpha+1$이고 양변에 $\alpha^2+\beta^2$을 더하면 $(\alpha-\beta+1)^2=\alpha^2+\beta^2=r^2$이 된다. $\alpha<-1$에서 $\alpha-\beta+1<0$이므로 $\alpha-\beta=-r-1$.
stuck: |
  관계식 $2\alpha\beta+2\beta=2\alpha+1$에 $\alpha^2+\beta^2$을 더해 완전제곱 $(\alpha-\beta+1)^2$을 만드는 발상(<제시문2>의 활용)과, (ⅰ)의 최댓값으로 $\alpha-\beta+1$의 부호를 결정하는 것
idea_tags: [IDEA-COMPLETE-SQUARE-DISTANCE, IDEA-AMGM-HYPERBOLA, IDEA-SIGN-FROM-EXTREMUM]
tags: [유리함수, 최대·최소, 산술-기하 평균, 두 점 사이의 거리]
