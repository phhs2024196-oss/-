stimuli:
- id: S1
  label: <제시문1>
  body: |
    유리함수 $y=\dfrac{2x+1}{2x+2}$의 그래프 위의 임의의 한 점 $\mathrm{P}(\alpha,\beta)$로부터 원점까지 이르는 거리를 $r$이라 하자.
- id: S2
  label: <제시문2>
  body: |
    실수 $a$, $b$, $c$에 대하여 $(a+b+c)^2=a^2+b^2+c^2+2ab+2bc+2ca$가 성립한다.

stem: |
  [수학 2]

subparts:
- id: '1'
  stem: |
    [수학 2-ⅰ] <제시문1>의 $\alpha$, $\beta$에 대해 $\alpha>-1$일 때, $\alpha-\beta$의 최솟값과 $\alpha<-1$일 때, $\alpha-\beta$의 최댓값을 각각 구하고, 그 이유를 논하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: 'min_gt = sqrt(2) - 2; max_lt = -sqrt(2) - 2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(\alpha)=\alpha-\dfrac{2\alpha+1}{2\alpha+2}$의 극값은 $\alpha=-1\pm\tfrac1{\sqrt2}$에서 $-2\pm\sqrt2$.
    steps:
    - {id: 1a, content: '$f^{\prime}(\alpha)=\dfrac{2\alpha^2+4\alpha+1}{2(\alpha+1)^2}$, $\alpha>-1$ 최솟값 $\sqrt2-2$, $\alpha<-1$ 최댓값 $-\sqrt2-2$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $\alpha-\beta$를 $\alpha$만의 함수로 나타내 보자.
    - 또는 $(\alpha+1)(1-\beta)$를 계산해 보자.
  - id: S1-B
    audience: B
    source_flow: 2021 보고서 문항카드 11 예시답안 p.185(인쇄 쪽 181)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\alpha-\beta=\alpha-\dfrac{2\alpha+1}{2\alpha+2}$이므로 함수 $f(\alpha)=\alpha-\dfrac{2\alpha+1}{2\alpha+2}$로 정의하고 미분을 계산하면 $f'(\alpha)=\dfrac{2\alpha^2+4\alpha+1}{2(\alpha+1)^2}$이 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        증감표: $x<-1-\dfrac1{\sqrt2}$에서 $f'>0$(증가), $x=-1-\dfrac1{\sqrt2}$에서 $f'=0$, $f=-2-\sqrt2$; $-1-\dfrac1{\sqrt2}<x<-1$에서 감소; $x=-1$에서 정의되지 않음; $-1<x<-1+\dfrac1{\sqrt2}$에서 감소; $x=-1+\dfrac1{\sqrt2}$에서 $f'=0$, $f=-2+\sqrt2$; 그 뒤 증가.
      criteria: ['1.A1', '1.A2']
    - id: 1b-3
      content: |
        따라서 $\alpha<-1$일 때 최댓값 $f\left(-1-\dfrac1{\sqrt2}\right)=-2-\sqrt2$를 얻고, $\alpha>-1$일 때 최솟값 $f\left(-1+\dfrac1{\sqrt2}\right)=-2+\sqrt2$를 얻는다.

        답: $\alpha$가 $-1$보다 큰 경우에 $\alpha-\beta$의 최솟값은 $\sqrt2-2$, $\alpha$가 $-1$보다 작은 경우에 $\alpha-\beta$의 최댓값은 $-\sqrt2-2$.
      criteria: ['1.A1', '1.A2']
  - id: S1-ALT
    audience: ALT
    source_flow: 2021 보고서 문항카드 11 예시답안 p.185(인쇄 쪽 181) 별해
    method_no: 2
    key_idea: $(\alpha+1)(1-\beta)=\tfrac12$이므로 산술-기하 평균.
    steps:
    - id: 1c-1
      content: |
        $\beta=\dfrac{2\alpha+1}{2\alpha+2}$로부터 $2(\alpha+1)(\beta-1)=-1$을 얻고, $(\alpha+1)(1-\beta)=\dfrac12$가 성립한다.
      criteria: ['1.M1']
    - id: 1c-2
      content: |
        $\alpha>-1$이면 $\beta<1$이 되고, 산술-기하평균의 관계로부터
        $\alpha-\beta=(\alpha+1)+(1-\beta)-2\ge2\sqrt{(\alpha+1)(1-\beta)}-2\ge2\sqrt{\dfrac12}-2=\sqrt2-2$. 그러므로 $\alpha$가 $-1$보다 큰 경우에 $\alpha-\beta$의 최솟값은 $\sqrt2-2$가 된다.
      criteria: ['1.A1']
    - id: 1c-3
      content: |
        $\alpha<-1$이면 $\beta>1$이 되고, 산술-기하평균의 관계로부터
        $-(\alpha-\beta)=(-\alpha-1)+(\beta-1)+2\ge2\sqrt{(-\alpha-1)(\beta-1)}+2\ge2\sqrt{\dfrac12}+2=\sqrt2+2$. 그러므로 $\alpha$가 $-1$보다 작은 경우에 $\alpha-\beta$의 최댓값은 $-\sqrt2-2$가 된다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        $\alpha-\beta$를 $\alpha$의 함수로 두고 도함수 $\dfrac{2\alpha^2+4\alpha+1}{2(\alpha+1)^2}$을 구하거나, $(\alpha+1)(1-\beta)=\dfrac12$로 변형해 산술-기하 평균을 적용했다(채점기준표는 최솟값 4점·최댓값 4점 두 행뿐이므로 각 행에서 방법 1점씩을 이 마크로 묶음).
      depends_on: []
      implied_ok: true
      steps: [1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\alpha>-1$일 때 $\alpha-\beta$의 최솟값 $\sqrt2-2$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2, 1b-3, 1c-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $\alpha<-1$일 때 $\alpha-\beta$의 최댓값 $-\sqrt2-2$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2, 1b-3, 1c-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [수학 2-ⅱ] <제시문1>의 $\alpha$, $\beta$, $r$에 대해 $\alpha<-1$일 때, $\alpha-\beta$를 $r$에 대한 식으로 나타내고, 그 이유를 논하시오.
  points: 12
  depends_on: ['1']
  answer: {kind: expression, value: '-r - 1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $(\alpha-\beta+1)^2=\alpha^2+\beta^2=r^2$이고 $\alpha-\beta+1<0$.
    steps:
    - {id: 2a, content: '$2\alpha\beta+2\beta=2\alpha+1\Rightarrow(\alpha-\beta+1)^2=r^2$, (ⅰ)에서 $\alpha-\beta+1\le-\sqrt2-1<0$이므로 $\alpha-\beta=-r-1$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 분모를 없앤 관계식에 $\alpha^2+\beta^2$을 더해 보자.
    - <제시문2>의 전개식과 비교해 보자.
    - 제곱근을 취할 때 부호는 (ⅰ)의 결과로 정한다.
  - id: S2-B
    audience: B
    source_flow: 2021 보고서 문항카드 11 예시답안 p.185-186(인쇄 쪽 181-182)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\beta=\dfrac{2\alpha+1}{2\alpha+2}$로부터 $2\alpha\beta+2\beta=2\alpha+1$을 얻고, 양변에 $\alpha^2+\beta^2$을 더하면 $2\alpha\beta+2\beta+\alpha^2+\beta^2=2\alpha+1+\alpha^2+\beta^2$이 된다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이제 좌변에 $\alpha^2+\beta^2$을 남겨놓고 나머지 항들을 우변으로 이항하면 $\alpha^2+\beta^2=2\alpha+1+\alpha^2+\beta^2-2\alpha\beta-2\beta=(\alpha-\beta+1)^2$이 된다. 따라서 $(\alpha-\beta+1)^2=\alpha^2+\beta^2=r^2$이 항상 성립한다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        (ⅰ)번의 풀이에서 $\alpha$가 $-1$보다 작은 경우에 $\alpha-\beta$의 최댓값은 $-\sqrt2-2$이므로, $\alpha-\beta+1$의 최댓값은 $-\sqrt2-1$이 되어 $\alpha-\beta+1$은 항상 음수가 된다. 따라서 $\alpha$가 $-1$보다 작은 경우에 $\alpha-\beta+1=-r$이 된다. 그러므로 $\alpha-\beta=-r-1$과 같다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 8
      evidence: |
        $(\alpha-\beta+1)^2=r^2$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $\alpha<-1$일 때 $\alpha-\beta+1$이 항상 음수임을 보이고, 이를 이용하여 $\alpha-\beta=-r-1$임을 보였다.
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A2], max_points: 4}
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [수학 2-ⅲ] <제시문1>의 $\alpha$, $r$, 점 $\mathrm{P}$, 그리고 점 $\mathrm{Q}(-2,\,2)$에 대해 $\alpha<-1$일 때, 선분 $\mathrm{PQ}$의 길이를 $r$에 대한 식으로 나타내고, 그 이유를 논하시오.
  points: 6
  depends_on: ['1', '2']
  answer: {kind: expression, value: 'r - 2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{PQ}}^2=\alpha^2+\beta^2+4(\alpha-\beta)+8=(r-2)^2$이고 $r-2>0$.
    steps:
    - {id: 3a, content: '$\overline{\mathrm{PQ}}^2=r^2+4(-r-1)+8=(r-2)^2$, $r-2\ge\sqrt2-1>0$이므로 $\overline{\mathrm{PQ}}=r-2$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $\overline{\mathrm{PQ}}^2$을 전개하면 $\alpha^2+\beta^2$과 $\alpha-\beta$가 보인다.
  - id: S3-B
    audience: B
    source_flow: 2021 보고서 문항카드 11 예시답안 p.186(인쇄 쪽 182)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (ⅱ)번의 결과로부터 $\alpha-\beta=-r-1$이므로, 다음 식이 성립함을 알 수 있다.
        $$\overline{\mathrm{PQ}}^2=(\alpha+2)^2+(\beta-2)^2=\alpha^2+\beta^2+4(\alpha-\beta)+8=r^2+4(-r-1)+8=(r-2)^2$$
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (ⅰ)번의 결과로부터 $-r-1=\alpha-\beta\le-\sqrt2-2$이므로, $r-2\ge\sqrt2-1>0$이므로, 위의 식에서 $\overline{\mathrm{PQ}}=r-2$가 된다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $\alpha<-1$일 때 $\overline{\mathrm{PQ}}^2=(r-2)^2$임을 보였다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 3}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $\alpha<-1$일 때 $r-2$가 항상 양수임을 보이고, 이를 이용하여 $\overline{\mathrm{PQ}}=r-2$임을 보였다.
      depends_on: [3.M1]
      steps: [3b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    [수학 2-ⅳ] <제시문1>의 $\alpha$와 $r$에 대해 $\alpha<-1$일 때, $\alpha$를 한 근으로 갖는 2차방정식을 $2x^2+b_1x+b_0=0$이라고 하자. 이 때, $b_0$, $b_1$의 값을 $r$에 대한 식으로 표시하고, 그 이유를 논하시오.
  points: 4
  depends_on: ['2']
  answer: {kind: expression, value: 'b1 = 2*r + 2; b0 = 2*r + 1', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
