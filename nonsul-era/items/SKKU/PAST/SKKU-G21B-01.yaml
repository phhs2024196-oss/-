intent: |
  도함수를 이용한 함수의 그래프의 개형, 원과 직선의 위치 관계, 삼각함수의 덧셈정리를 이해하는지 평가한다. 두 점 사이의 거리를 함수로 표현해 개형으로 최솟값을 구하고(ⅰ), 두 점을 지나는 직선과 원의 교점을 구하며(ⅱ), 원에 접하는 직선의 방정식을 구하고(ⅲ), 삼각함수의 뜻과 덧셈정리를 이용할 수 있는지(ⅳ) 본다(2021 보고서 문항카드 15 출제 의도 요약). 소문항 배점은 채점기준표 배점.
key_idea: |
  원 위의 점과 포물선 위의 점 사이의 최소 거리는 「포물선 위의 점과 원의 중심 사이의 최소 거리 − 반지름」으로 두 단계로 나뉜다. $f(x)=(x-12)^2+\left(x^2-\tfrac{15}{2}\right)^2$의 최솟값은 $x=3$에서 $\tfrac{333}{4}$이다.
stuck: |
  두 동점 $\mathrm{A}$, $\mathrm{B}$의 거리 최소를 「원의 중심과 $\mathrm{B}$의 거리 최소」로 환원하고, 사차함수 $f'(x)=4(x+2)(x+1)(x-3)$의 증감표에서 최솟값을 고르는 것
idea_tags: [IDEA-CIRCLE-DISTANCE-VIA-CENTER, IDEA-SQUARED-DISTANCE-QUARTIC, IDEA-TANGENT-HALF-ANGLE]
tags: [원과 포물선 사이의 거리, 최솟값, 원의 접선, 배각 공식]
