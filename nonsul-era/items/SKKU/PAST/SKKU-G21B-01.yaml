      content: |
        두 접선의 방정식이 이루는 각의 크기를 $\theta$라고 하면, $\sin\dfrac{\theta}{2}$의 값은 원 $C$의 반지름 $r=6$을 점 $\mathrm{B}(3,9)$에서 원 $C$의 중심 $O'$ 사이의 거리 $r'=\overline{BO'}=\sqrt{\dfrac{333}{4}}=\dfrac32\sqrt{37}$으로 나눈 값이다. 즉, $\sin\dfrac{\theta}{2}=\dfrac{r}{r'}=\dfrac{4}{\sqrt{37}}$.
