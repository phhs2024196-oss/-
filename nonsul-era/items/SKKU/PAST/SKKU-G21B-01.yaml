stimuli:
- id: S1
  label: <제시문1>
  body: |
    중심의 좌표가 $(a,\,b)$이고 반지름의 길이가 $r$인 원의 방정식은 다음과 같다.
    $$(x-a)^2+(y-b)^2=r^2$$
- id: S2
  label: <제시문2>
  body: |
    초점이 $(0,\,p)$이고 준선이 $y=-p$인 포물선의 방정식은 다음과 같다.
    $$x^2=4py\quad(\text{단, } p\ne0)$$
- id: S3
  label: <제시문3>
  body: |
    원 $C:(x-12)^2+\left(y-\dfrac{15}{2}\right)^2=36$ 위의 임의의 점을 $\mathrm{A}$, 포물선 $P:y=x^2$ 위의 임의의 점을 $\mathrm{B}$라고 하자.

stem: |
  [수학 1] 다음 <제시문1> ~ <제시문3>을 읽고 [수학 1-ⅰ] ~ [수학 1-ⅳ]를 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    [수학 1-ⅰ] <제시문3>에서 원 $C$의 중심과 점 $\mathrm{B}$ 사이의 거리가 항상 원 $C$의 반지름보다 큼을 보이고 그 이유를 논하시오.
  points: 7
  depends_on: []
  answer: {kind: proof, value: 'min_dist = 3*sqrt(37)/2; radius = 6', equivalents: ['sqrt(333/4)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 거리의 제곱 $f(x)=x^4-14x^2-24x+\tfrac{801}{4}$의 최솟값 $f(3)=\tfrac{333}{4}>36$.
    steps:
    - {id: 1a, content: '$f^{\prime}(x)=4(x+2)(x+1)(x-3)$, 최솟값 $f(3)=\tfrac{333}{4}$, $\sqrt{\tfrac{333}{4}}=\tfrac32\sqrt{37}>6$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $\mathrm{B}(x,x^2)$로 두고 중심까지의 거리의 제곱을 $x$의 함수로 나타내 보자.
    - 사차함수의 도함수를 인수분해하면 극값 후보가 보인다.
  - id: S1-B
    audience: B
    source_flow: 2021 보고서 문항카드 15 예시답안 p.216(인쇄 쪽 212)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        원 $C$의 중심과 포물선 $P$ 위의 점 $\mathrm{B}(x,x^2)$ 사이의 거리의 제곱을 $f(x)$라고 하면
        $$f(x)=(x-12)^2+\left(x^2-\dfrac{15}{2}\right)^2=x^4-14x^2-24x+\dfrac{801}{4}$$
        원 $C$의 중심과 점 $\mathrm{B}$ 사이의 거리가 항상 원 $C$의 반지름보다 큼을 보이기 위해서, 함수 $f(x)$의 최솟값이 원 $C$의 반지름의 제곱보다 큼을 보이면 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $f'(x)=4x^3-28x-24=4(x+2)(x+1)(x-3)$이므로 $f'(x)=0$에서 $x=-2$ 또는 $x=-1$ 또는 $x=3$. 증감표: $x=-2$에서 극소 $\dfrac{833}{4}$, $x=-1$에서 극대 $\dfrac{845}{4}$, $x=3$에서 극소 $\dfrac{333}{4}$ (감소-증가-감소-증가).
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        그러므로 $f(x)$의 최솟값은 $\dfrac{333}{4}$이다. 따라서 원 $C$의 중심과 점 $\mathrm{B}$ 사이의 거리의 최솟값 $\sqrt{\dfrac{333}{4}}=\dfrac32\sqrt{37}$은 원의 반지름 $6$보다 크다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        원 $C$의 중심과 점 $\mathrm{B}$ 사이의 거리(의 제곱)를 함수 $f(x)$로 표현하고 도함수로 증감(그래프의 개형)을 조사했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        최솟값 $\dfrac{333}{4}$(거리 $\dfrac32\sqrt{37}$)을 얻고 이 값이 반지름보다 큼을 올바르게 유도했다(채점기준표 7점 단일 행을 방법 4·결론 3으로 나눔).
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [수학 1-ⅱ] <제시문3>의 두 점 $\mathrm{A}$, $\mathrm{B}$ 사이의 거리가 최소가 되도록 하는 점 $\mathrm{A}$와 점 $\mathrm{B}$를 구하고 그 이유를 논하시오.
  points: 8
  depends_on: ['1']
  answer: {kind: expression, value: 'A = (12 - 36/sqrt(37), 15/2 + 6/sqrt(37)); B = (3, 9)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 최소 거리는 (중심과 $\mathrm{B}$의 최소 거리) − 반지름이고, $\mathrm{A}$는 $\mathrm{B}$와 중심을 잇는 직선과 원의 교점 중 $\mathrm{B}$에 가까운 점.
    steps:
    - {id: 2a, content: '$\mathrm{B}(3,9)$, 직선 $l:y=-\tfrac16x+\tfrac{19}{2}$, $\mathrm{A}\left(12-\tfrac{36}{\sqrt{37}},\tfrac{15}{2}+\tfrac{6}{\sqrt{37}}\right)$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $\mathrm{B}$를 고정하면 원 위의 가장 가까운 점은 어디인가?
    - 그러면 $\mathrm{B}$는 중심까지의 거리가 최소인 점이어야 한다.
  - id: S2-B
    audience: B
    source_flow: 2021 보고서 문항카드 15 예시답안 p.216-217(인쇄 쪽 212-213)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        원 $C$ 밖에 있는 포물선 $P$ 위의 점 $\mathrm{B}$가 주어지면, 점 $\mathrm{B}$와 원 위의 임의의 점 $\mathrm{A}$ 사이의 거리가 최소가 되도록 하는 점 $\mathrm{A}$는 점 $\mathrm{B}$와 원 $C$의 중심을 지나는 직선 위에 있고, 그 거리는 점 $\mathrm{B}$와 원 $C$의 중심 사이의 거리에서 원 $C$의 반지름을 뺀 것과 같다. 따라서 먼저 포물선 $P$ 위의 점 중에서 원 $C$의 중심과의 거리가 최소인 점이 구하고자 하는 점 $\mathrm{B}$가 된다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이 점 $\mathrm{B}$와 원 $C$의 중심을 지나는 직선을 $l$이라고 하면, 직선 $l$과 원 $C$의 두 교점 중 점 $\mathrm{B}$에 가까운 점이 구하고자 하는 점 $\mathrm{A}$가 된다. 앞의 [수학 1-ⅰ]로부터 점 $\mathrm{B}(x,x^2)$와 원 $C$의 중심 사이의 거리가 최소가 되도록 하는 점 $\mathrm{B}$는 $(3,9)$이다. 그리고 점 $\mathrm{B}(3,9)$과 원 $C$의 중심 $\left(12,\dfrac{15}{2}\right)$을 지나는 직선 $l$의 방정식은 $y=-\dfrac16x+\dfrac{19}{2}$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        또한 직선 $l$과 원 $C$의 두 교점 $\left(12+\dfrac{36}{\sqrt{37}},\,\dfrac{15}{2}-\dfrac{6}{\sqrt{37}}\right)$ 또는 $\left(12-\dfrac{36}{\sqrt{37}},\,\dfrac{15}{2}+\dfrac{6}{\sqrt{37}}\right)$ 중 점 $\mathrm{B}(3,9)$에 가까운 점은 $\left(12-\dfrac{36}{\sqrt{37}},\,\dfrac{15}{2}+\dfrac{6}{\sqrt{37}}\right)$이다. 즉, 구하고자 하는 점 $\mathrm{A}$는 $\left(12-\dfrac{36}{\sqrt{37}},\,\dfrac{15}{2}+\dfrac{6}{\sqrt{37}}\right)$이고, 점 $\mathrm{B}$는 $(3,9)$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        [수학 1-ⅰ]의 결과를 해석해 최소 거리가 「중심과 $\mathrm{B}$의 최소 거리 − 반지름」이고 $\mathrm{B}(3,9)$, 직선 $l:y=-\dfrac16x+\dfrac{19}{2}$임을 밝혔다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        원과 직선의 교점 중 $\mathrm{B}$에 가까운 점 $\mathrm{A}\left(12-\dfrac{36}{\sqrt{37}},\dfrac{15}{2}+\dfrac{6}{\sqrt{37}}\right)$와 $\mathrm{B}(3,9)$를 올바르게 유도했다(채점기준표 8점 단일 행을 4·4로 나눔).
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [수학 1-ⅲ] 문항 [수학 1-ⅱ]에서 구한 점 $\mathrm{B}$에서 <제시문3>의 원 $C$에 그은 두 접선의 방정식을 구하고 그 이유를 논하시오.
  points: 8
  depends_on: ['2']
  answer: {kind: expression, value: 'tangents = [(-3 + 2*sqrt(21))/10*(x - 3) + 9, (-3 - 2*sqrt(21))/10*(x - 3) + 9]', equivalents: ['y = (1/10)(-3 ± 2√21)(x-3)+9'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $y=m(x-3)+9$를 원에 대입한 이차방정식의 판별식 $D=-9(20m^2+12m-15)=0$.
    steps:
    - {id: 3a, content: '$m=\tfrac{1}{10}(-3\pm2\sqrt{21})$, $x=3$은 원과 만나지 않음 → $y=\tfrac1{10}(-3\pm2\sqrt{21})(x-3)+9$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 점 $(3,9)$를 지나는 직선을 기울기 $m$으로 나타내자. 기울기가 없는 경우도 잊지 말자.
    - 접한다는 조건은 판별식 또는 중심과 직선 사이의 거리로 쓸 수 있다.
  - id: S3-B
    audience: B
    source_flow: 2021 보고서 문항카드 15 예시답안 p.217(인쇄 쪽 213)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
