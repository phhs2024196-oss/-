stimuli:
- id: S1
  label: <제시문1>
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b|f(x)-g(x)|dx$$
- id: S2
  label: <제시문2>
  body: |
    실수 $e$를 $e=\displaystyle\lim_{x\to0}(1+x)^{\frac1x}$ 로 정의한다.
- id: S3
  label: <제시문3>
  body: |
    함수 $f(x)$, $g(x)$에서 $\displaystyle\lim_{x\to a}f(x)=L$, $\displaystyle\lim_{x\to a}g(x)=M$ ($L$, $M$은 실수)일 때, $a$에 가까운 모든 실수 $x$에서 함수 $h(x)$가 $f(x)\le h(x)\le g(x)$ 이고 $L=M$ 이면 $\displaystyle\lim_{x\to a}h(x)=L$ 이다.
- id: S4
  label: <제시문4>
  body: |
    곡선 $y=\dfrac1x$ (단, $x>0$), 직선 $x=1$, 직선 $y=\dfrac1a$로 둘러싸인 영역의 넓이를 $f(a)$라 한다. 직선 $x=1$, 직선 $x=a$, 직선 $y=\dfrac1a$, 직선 $y=0$으로 둘러싸인 영역의 넓이를 $g(a)$라 한다. 함수 $h$를 $h(a)=f(a)-g(a)$ 라 정의한다. (단, $a>1$)

stem: |
  [수학 2]
  다음 <제시문1> ~ <제시문4>를 읽고 [수학 2 - ⅰ] ~ [수학 2 - ⅴ]를 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    [수학 2 - ⅰ] <제시문4>에서 정의된 $h(a)$를 $a$에 관한 식으로 표현하고 그 이유를 논하시오.
  points: 6
  depends_on: []
  answer: {kind: expression, value: 'log(a) + 2/a - 2', equivalents: ['ln a + 2/a - 2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(a)=\int_1^a\left(\tfrac1x-\tfrac1a\right)dx$, $g(a)$는 직사각형 넓이.
    steps:
    - {id: 1a, content: '$f(a)=\ln a+\tfrac1a-1$, $g(a)=1-\tfrac1a$, $h(a)=\ln a+\tfrac2a-2$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $f(a)$의 영역은 $1\le x\le a$에서 $y=\tfrac1x$와 $y=\tfrac1a$ 사이이다.
  - id: S1-B
    audience: B
    source_flow: 2021 보고서 문항카드 16 예시답안 p.221(인쇄 쪽 217)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        문제의 조건으로부터
        $$f(a)=\int_1^a\left(\dfrac1x-\dfrac1a\right)dx=(\ln a-1)-\left(\ln1-\dfrac1a\right)=\ln a+\dfrac1a-1$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $g(a)=(a-1)\dfrac1a=1-\dfrac1a$. 따라서 $h(a)=\ln a+\dfrac2a-2$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $f(a)=\ln a+\dfrac1a-1$을 유도했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $h(a)=\ln a+\dfrac2a-2$를 유도했다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [수학 2 - ⅱ] <제시문4>에서 정의된 $h(a)$의 최솟값을 구하고 그 이유를 논하시오.
  points: 6
  depends_on: ['1']
  answer: {kind: value, value: 'log(2) - 1', equivalents: ['ln 2 - 1'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $h^{\prime}(a)=\tfrac{a-2}{a^2}$이므로 $a=2$에서 최소.
    steps:
    - {id: 2a, content: '$h^{\prime}(a)=\tfrac{a-2}{a^2}$, $a=2$에서 최솟값 $h(2)=\ln2-1$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $h(a)$를 미분해 부호를 조사해 보자.
  - id: S2-B
    audience: B
    source_flow: 2021 보고서 문항카드 16 예시답안 p.221(인쇄 쪽 217)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $h'(a)=\dfrac1a-\dfrac2{a^2}=\dfrac{a-2}{a^2}$, $h''(a)=-\dfrac1{a^2}+\dfrac4{a^3}$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이고 $h''(2)=\dfrac14>0$ 이므로 $h(a)$의 최솟값은 $h(2)=\ln2-1$ 이다. ($1<a<2$에서 $h'<0$, $a>2$에서 $h'>0$이므로 극소이자 최소.)
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $h'(a)=\dfrac{a-2}{a^2}$를 유도했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        최솟값 $h(2)=\ln2-1$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [수학 2 - ⅲ] <제시문4>에서 정의된 $h(a)$에 대하여, 극한 $\displaystyle\lim_{a\to1}\dfrac{h(a)}{a-1}$의 값을 구하고 그 이유를 논하시오. (단, 로피탈의 정리는 사용할 수 없음)
  points: 6
  depends_on: ['1']
  answer: {kind: value, value: '-1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{h(a)}{a-1}=\dfrac{\ln a}{a-1}-\dfrac2a$이고 $a-1=x$로 두면 <제시문2>.
    steps:
    - {id: 3a, content: '$\lim_{a\to1}\tfrac{\ln a}{a-1}=\lim_{x\to0}\ln(1+x)^{1/x}=\ln e=1$, 답 $1-2=-1$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $\tfrac2a-2$를 $a-1$로 나누면 어떻게 정리되는가?
    - $a=1+x$로 치환해 보자.
  - id: S3-B
    audience: B
    source_flow: 2021 보고서 문항카드 16 예시답안 p.221(인쇄 쪽 217)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\dfrac{h(a)}{a-1}=\dfrac{\ln a}{a-1}-\dfrac2a$이므로
        $$\lim_{a\to1}\dfrac{h(a)}{a-1}=\lim_{a\to1}\left(\dfrac{\ln a}{a-1}-\dfrac2a\right)=\lim_{a\to1}\dfrac{\ln a}{a-1}-2=\lim_{x\to0}\dfrac{\ln(1+x)}{x}-2=\lim_{x\to0}\ln(1+x)^{\frac1x}-2$$
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        따라서 <제시문 2>에 의해서 $\displaystyle\lim_{a\to1}\dfrac{h(a)}{a-1}=\ln e-2=-1$ 임을 알 수 있다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $\displaystyle\lim_{a\to1}\dfrac{\ln a}{a-1}=\lim_{x\to0}\ln(1+x)^{\frac1x}$ 임을 유도했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $\displaystyle\lim_{a\to1}\dfrac{h(a)}{a-1}=-1$을 도출했다.
      depends_on: [3.M1]
      steps: [3b-2]
    deductions:
    - code: D3-1
      condition: 로피탈의 정리를 사용함(발문 조건 위반)
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    [수학 2 - ⅳ] <제시문4>에서 정의된 $h(a)$가 $a>1$에서 부등식 $h(a)<2\sqrt a$을 만족함을 보이고 그 이유를 논하시오.
  points: 6
  depends_on: ['1']
  answer: {kind: proof, value: 'k(a) = 2*sqrt(a) - h(a) > 0; k(1) = 2', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $k(a)=2\sqrt a-h(a)$는 $a>1$에서 증가하고 $k(1)=2>0$.
    steps:
    - {id: 4a, content: '$k^{\prime}(a)=\tfrac{a(\sqrt a-1)+2}{a^2}>0$, $k(1)=2>0$이므로 $h(a)<2\sqrt a$', criteria: ['4.M1', '4.A1', '4.A2']}
    hint_ladder:
    - 차를 새 함수로 두고 미분해 보자.
    - $a=1$에서의 값은?
  - id: S4-B
    audience: B
    source_flow: 2021 보고서 문항카드 16 예시답안 p.222(인쇄 쪽 218)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $k(a)=2\sqrt a-h(a)=2\sqrt a-\ln a-\dfrac2a+2$라 두자. $a>1$ 이므로
        $$k'(a)=\dfrac{a^{3/2}-a+2}{a^2}=\dfrac{a(\sqrt a-1)+2}{a^2}>0$$
      criteria: ['4.M1', '4.A1']
    - id: 4b-2
      content: |
        그런데 $k(1)=2>0$ 이므로 $k(a)=2\sqrt a-h(a)>0$ 이다. 따라서 $h(a)<2\sqrt a$.
      criteria: ['4.A2']
  - id: S4-ALT
    audience: ALT
    source_flow: 2021 보고서 문항카드 16 예시답안 p.222(인쇄 쪽 218) 별해
    method_no: 2
    key_idea: $k(a)=2\sqrt a-\ln a$로 두고 $2\sqrt a-h(a)=k(a)+\dfrac{2(a-1)}{a}>k(a)$.
    steps:
    - id: 4c-1
      content: |
        $k(a)=2\sqrt a-\ln a$라 두면 $a>1$에서 $k'(a)=\dfrac1{\sqrt a}-\dfrac1a=\dfrac{\sqrt a-1}{a}>0$이다. 그런데 $k(1)=2>0$이므로 $k(a)=2\sqrt a-\ln a>0$이다.
      criteria: ['4.M1', '4.A1', '4.A2']
    - id: 4c-2
      content: |
        그런데 $a>1$에서 $\dfrac{a-1}{a}>0$ 이므로 $2\sqrt a-h(a)=2\sqrt a-\ln a+\dfrac{2(a-1)}{a}>2\sqrt a-\ln a>0$ 이다.
      criteria: ['4.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 2
      evidence: |
        $k'(a)=\dfrac{a^{3/2}-a+2}{a^2}$ 임을 보였다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [4b-1, 4c-1]
    - id: 4.A1
      mark_type: A
      points: 3
      evidence: |
        $a>1$이므로 $k'(a)=\dfrac{a(\sqrt a-1)+2}{a^2}>0$ 임을 보였다.
      depends_on: [4.M1]
      steps: [4b-1, 4c-1]
    - id: 4.A2
      mark_type: A
      points: 1
      evidence: |
        $k(1)>0$임을 보였다.
      depends_on: [4.M1]
      steps: [4b-2, 4c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '5'
  stem: |
    [수학 2 - ⅴ] <제시문4>에서 정의된 $h(a)$에 대하여, 극한 $\displaystyle\lim_{a\to\infty}\dfrac{h(a)}{a}$ 의 값을 구하고 그 이유를 논하시오. (단, 로피탈의 정리는 사용할 수 없음) [판독확인: 원본 보고서 발문의 극한 아래첨자가 "$a\to$"에서 끝나 목표값이 인쇄되어 있지 않음(PDF 글리프에도 없음; 같은 쪽 [수학 2-ⅲ]의 "$a\to1$"은 정상). 채점기준·예시답안의 $a\to\infty$로 보충]
  points: 6
  depends_on: ['2', '4']
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S5-A
    audience: A
    method_no: 1
    key_idea: $\ln2-1\le h(a)<2\sqrt a$를 $a$로 나누어 조임.
    steps:
    - {id: 5a, content: '$\tfrac{\ln2-1}{a}\le\tfrac{h(a)}{a}<\tfrac{2}{\sqrt a}$, 양끝 극한 $0$이므로 답 $0$', criteria: ['5.M1', '5.A1']}
    hint_ladder:
    - (ⅱ)와 (ⅳ)는 $h(a)$의 아래·위 경계를 준다.
    - <제시문3>을 써 보자.
  - id: S5-B
    audience: B
    source_flow: 2021 보고서 문항카드 16 예시답안 p.222(인쇄 쪽 218)
    method_no: 1
    steps:
    - id: 5b-1
      content: |
        [수학 2-ⅱ]와 [수학 2-ⅳ]의 결과로부터 $\ln2-1\le h(a)<2\sqrt a$ 임을 알 수 있다. 양변을 $a$로 나누면
        $$\dfrac{\ln2-1}{a}\le\dfrac{h(a)}{a}<\dfrac2{\sqrt a}$$
      criteria: ['5.M1']
    - id: 5b-2
      content: |
        그런데 $\displaystyle\lim_{a\to\infty}\dfrac{\ln2-1}{a}=\lim_{a\to\infty}\dfrac2{\sqrt a}=0$ 이므로 <제시문 3>에 의해 $\displaystyle\lim_{a\to\infty}\dfrac{h(a)}{a}=0$을 얻는다.
      criteria: ['5.A1']
