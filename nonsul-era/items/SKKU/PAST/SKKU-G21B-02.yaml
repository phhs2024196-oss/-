intent: |
  주어진 조건으로부터 적절한 수식을 구성하고 미분·적분·극한의 다양한 개념을 적용해 원하는 정보를 이끌어 내는 능력을 본다. 곡선으로 둘러싸인 넓이들 사이의 관계를 정적분으로 수식화하고, 그 수식으로부터 최솟값, 수식이 만족하는 부등식, 다양한 극한값을 도출하는 능력을 검증한다(2021 보고서 문항카드 16 출제 의도 요약). 소문항 배점은 채점기준표 배점.
key_idea: |
  $f(a)=\displaystyle\int_1^a\left(\dfrac1x-\dfrac1a\right)dx=\ln a+\dfrac1a-1$, $g(a)=1-\dfrac1a$이므로 $h(a)=\ln a+\dfrac2a-2$. 이후 최솟값 $\ln2-1$과 상한 $2\sqrt a$로 $\dfrac{h(a)}{a}$를 조여 극한 $0$을 얻는다.
stuck: |
  [수학 2-ⅴ]에서 로피탈 없이 (ⅱ)의 하한과 (ⅳ)의 상한을 $a$로 나누어 <제시문3>(조임 정리)을 쓰는 연결
idea_tags: [IDEA-AREA-BETWEEN-CURVES-LOG, IDEA-LIMIT-E-DEFINITION, IDEA-SQUEEZE-FROM-BOUNDS]
tags: [로그함수, 정적분의 활용, 최솟값, 조임 정리, e의 정의]
