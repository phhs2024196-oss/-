intent: |
  함수의 도함수를 활용한 그래프의 개형, 포물선과 직선의 위치 관계, 적분법을 이해하는지 평가한다. 점과 직선 사이의 거리를 함수로 표현해 도함수로 개형을 파악하고(ⅰ), 직선에 수직인 직선의 방정식으로 삼각형의 넓이를 구하며(ⅱ), 평행이동한 포물선과 직선의 위치 관계를 이해하고(ⅲ), 정적분으로 곡선으로 둘러싸인 넓이를 구하는지(ⅳ) 본다(2021 보고서 문항카드 20 출제 의도 요약). 소문항 배점은 채점기준표 배점.
key_idea: |
  직선 $\dfrac xa+\dfrac yb=1$이 $D$의 넓이 $\dfrac{16}{3}$을 이등분하려면 $ab=\dfrac{16}{3}$이고, 원점과의 거리 $\dfrac{16}{3}\cdot\dfrac{1}{\sqrt{a^2+b^2}}$의 최대·최소는 $a^2+b^2=a^2+\left(\dfrac{16}{3a}\right)^2$의 $\left[\dfrac43,2\right]$에서의 최소·최대로 바뀐다.
stuck: |
  넓이 이등분 조건을 삼각형 넓이 $\tfrac12ab=\tfrac12S_D$로 바꾸고, $0<b\le4$에서 $a$의 범위 $\tfrac43\le a\le2$를 끌어내는 것(구간 끝에서 최대·최소)
idea_tags: [IDEA-AREA-BISECT-INTERCEPT, IDEA-DISTANCE-POINT-LINE-OPTIMIZE, IDEA-DOUBLE-TANGENT-PARABOLA]
tags: [넓이 이등분, 점과 직선 사이의 거리, 평행이동, 포물선과 접선, 정적분]
