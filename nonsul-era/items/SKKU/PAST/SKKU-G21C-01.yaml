stimuli:
- id: S1
  label: <제시문1>
  body: |
    두 함수 $f(x)$와 $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b|\,f(x)-g(x)\,|\,dx$$
- id: S2
  label: <제시문2>
  body: |
    곡선 $E:y=-x^2+4$ (단, $x\ge0$, $y\ge0$)가 $x$축과 만나는 점을 $\mathrm{P}$, $y$축과 만나는 점을 $\mathrm{Q}$라고 하고, 곡선 $E$ 및 $x$축과 $y$축으로 둘러싸인 도형을 $D$라고 하자. 또한 원점 $\mathrm{O}$를 포함하는 선분 $\mathrm{OP}$ 위의 임의의 점을 $\mathrm{A}$, 선분 $\mathrm{OQ}$ 위의 임의의 점을 $\mathrm{B}$라고 하자.

stem: |
  [수학 1] 다음 <제시문1>~<제시문2>를 읽고 [수학 1 - ⅰ]~[수학 1 - ⅳ]를 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    [수학 1 - ⅰ] <제시문2>의 두 점 $\mathrm{A}$와 $\mathrm{B}$를 지나고 도형 $D$의 넓이를 이등분하는 직선 중 원점 $\mathrm{O}$와의 거리가 가장 가까운 직선 $l_1$과 가장 먼 직선 $l_2$의 방정식을 각각 구하고 그 이유를 논하시오.
  points: 8
  depends_on: []
  answer: {kind: expression, value: 'l1 = 3*x + y - 4; l2 = 4*x + 3*y - 8', equivalents: ['l1: 3x+y=4, l2: 4x+3y=8'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $ab=\tfrac{16}{3}$, $\tfrac43\le a\le2$에서 $a^2+b^2$은 감소하므로 $a=\tfrac43$이 가장 가깝고 $a=2$가 가장 멀다.
    steps:
    - {id: 1a, content: '$f(a)=a^2+\left(\tfrac{16}{3a}\right)^2$ 감소 → $(a,b)=\left(\tfrac43,4\right)$: $3x+y=4$, $(a,b)=\left(2,\tfrac83\right)$: $4x+3y=8$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 직선이 $x$축·$y$축과 만나는 점을 $(a,0)$, $(0,b)$라 두자.
    - 넓이를 이등분하려면 두 축과 직선이 만드는 삼각형의 넓이가 얼마여야 하는가?
    - 원점과 직선 사이의 거리를 $a$, $b$로 나타내자.
  - id: S1-B
    audience: B
    source_flow: 2021 보고서 문항카드 20 예시답안 p.254-255(인쇄 쪽 250-251)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        도형 $D$의 넓이 $S_D$는 $S_D=\displaystyle\int_0^2(-x^2+4)dx=\left[-\dfrac13x^3+4x\right]_0^2=\dfrac{16}{3}$.
        점 $\mathrm{A}(a,0)$와 $\mathrm{B}(0,b)$를 지나고 도형 $D$의 넓이를 이등분하는 직선 $l$의 방정식은 $\dfrac xa+\dfrac yb=1$ (단, $0<a\le2$, $0<b\le4$)이고, 여기서 $a$와 $b$는 $ab=\dfrac{16}{3}$ …① 을 만족한다. 왜냐하면, 직선 $l$이 도형 $D$의 넓이 $S_D$를 이등분한다는 조건으로부터 직선 $l$ 및 $x$축, $y$축으로 둘러싸인 삼각형의 넓이가 $\dfrac12S_D$와 같아야 하기 때문이다. 즉, $\dfrac12ab=\dfrac12S_D$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (참고로, 점 $\mathrm{A}$와 $\mathrm{B}$가 같은 경우를 고려하면 원점 $\mathrm{O}$를 지나고 도형 $D$의 넓이를 이등분하는 직선이 원점과의 거리가 $0$으로 가장 가까운 직선이 되지만, [수학 1-ⅱ]에서 구하고자 하는 점 $\mathrm{C}_1$이 원점 $\mathrm{O}$와 같아지기 때문에 삼각형 $\mathrm{OC_1C_2}$를 정의할 수 없다. 따라서 점 $\mathrm{A}$와 $\mathrm{B}$는 서로 다른 두 점으로 이해되어야 한다.)
        그러므로, 직선 $l$의 방정식은 $bx+ay=\dfrac{16}{3}$이고, 두 부등식 $0<a\le2$, $0<b\le4$로부터 $\dfrac43\le a\le2$.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        원점 $\mathrm{O}$와 직선 $l:bx+ay+\left(-\dfrac{16}{3}\right)=0$ 사이의 거리는 $\dfrac{\left|-\frac{16}{3}\right|}{\sqrt{b^2+a^2}}=\dfrac{16}{3}\dfrac{1}{\sqrt{a^2+b^2}}$이므로 거리가 최소가 되려면 $a^2+b^2$이 최대, 최대가 되려면 $a^2+b^2$이 최소가 되어야 한다. 관계식 ①로 $f(a)=a^2+\left(\dfrac{16}{3a}\right)^2$으로 나타내고 닫힌구간 $\left[\dfrac43,2\right]$에서 최대·최소를 조사한다.
      criteria: ['1.M1']
    - id: 1b-4
      content: |
        $f'(a)=2a-\dfrac{512}{9a^3}=2a\left(1-\dfrac{16}{3a^2}\right)\left(1+\dfrac{16}{3a^2}\right)$ 이므로 $f'(a)=0$에서 $a=\pm\dfrac{4}{\sqrt3}$. 구간 $\left[\dfrac43,2\right]$에서 $f'(a)<0$이고 $f\left(\dfrac43\right)=\dfrac{160}{9}$, $f(2)=\dfrac{100}{9}$이므로 $f(a)$는 $a=\dfrac43$일 때 최댓값을, $a=2$일 때 최솟값을 가진다.
      criteria: ['1.A1']
    - id: 1b-5
      content: |
        즉, 원점과 직선 $l:bx+ay=\dfrac{16}{3}$ 사이의 거리는 $(a,b)=\left(\dfrac43,4\right)$일 때 최솟값을, $(a,b)=\left(2,\dfrac83\right)$일 때 최댓값을 가진다. 그러므로 $l_1:3x+y=4$, $l_2:4x+3y=8$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        넓이 이등분 조건 $ab=\dfrac{16}{3}$과 범위 $\dfrac43\le a\le2$를 얻고, 점과 직선 사이의 거리를 $a$의 함수로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        도함수로 그래프의 개형(감소)을 파악해 $l_1:3x+y=4$, $l_2:4x+3y=8$을 올바르게 유도했다(채점기준표 8점 단일 행을 4·4로 나눔).
      depends_on: [1.M1]
      steps: [1b-4, 1b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [수학 1 - ⅱ] 문항 [수학 1 - ⅰ]에서 구한 직선 $l_1$ 위의 점 중에서 원점 $\mathrm{O}$와의 거리가 최소인 점을 $\mathrm{C}_1$, 문항 [수학 1 - ⅰ]에서 구한 직선 $l_2$ 위의 점 중에서 원점 $\mathrm{O}$와의 거리가 최소인 점을 $\mathrm{C}_2$라고 할 때, 삼각형 $\mathrm{OC_1C_2}$의 넓이를 구하고 그 이유를 논하시오.
  points: 7
  depends_on: ['1']
  answer: {kind: value, value: '8/25', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{C}_k$는 원점에서 $l_k$에 내린 수선의 발.
    steps:
    - {id: 2a, content: '$\mathrm{C}_1\left(\tfrac65,\tfrac25\right)$, $\mathrm{C}_2\left(\tfrac{32}{25},\tfrac{24}{25}\right)$, 넓이 $\tfrac12\cdot\tfrac85\cdot\tfrac25=\tfrac{8}{25}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 직선 위에서 원점과 가장 가까운 점은 수선의 발이다.
  - id: S2-B
    audience: B
    source_flow: 2021 보고서 문항카드 20 예시답안 p.255(인쇄 쪽 251)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{C}_1$은 원점을 지나고 직선 $l_1:y=-3x+4$에 수직인 직선 $y=\dfrac13x$와 직선 $l_1$의 교점이므로 $\mathrm{C}_1\left(\dfrac65,\dfrac25\right)$. 같은 방법으로 원점을 지나고 직선 $l_2:y=-\dfrac43x+\dfrac83$에 수직인 직선 $y=\dfrac34x$와 $l_2$의 교점은 $\mathrm{C}_2\left(\dfrac{32}{25},\dfrac{24}{25}\right)$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        점 $\mathrm{C}_1$과 직선 $y=\dfrac34x$ 사이의 거리를 $h$, 선분 $\mathrm{OC}_2$의 길이를 $d$라고 하면 $S_\triangle=\dfrac12dh$. 이때 $\mathrm{C}_1\left(\dfrac65,\dfrac25\right)$와 직선 $3x-4y=0$ 사이의 거리 $h=\dfrac{\left|3\cdot\frac65-4\cdot\frac25\right|}{\sqrt{3^2+4^2}}=\dfrac25$, $d=\sqrt{\left(\dfrac{32}{25}\right)^2+\left(\dfrac{24}{25}\right)^2}=\dfrac85$. 그러므로 삼각형 $\mathrm{OC_1C_2}$의 넓이는 $\dfrac{8}{25}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        수직인 직선의 방정식을 이용하여 $\mathrm{C}_1\left(\dfrac65,\dfrac25\right)$, $\mathrm{C}_2\left(\dfrac{32}{25},\dfrac{24}{25}\right)$를 찾았다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        삼각형 $\mathrm{OC_1C_2}$의 넓이 $\dfrac{8}{25}$을 올바르게 유도했다(채점기준표 7점 단일 행을 4·3으로 나눔).
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [수학 1 - ⅲ] 포물선 $y=-x^2+4$를 $x$축 방향으로 $m$만큼, $y$축 방향으로 $n$만큼 평행이동 하였더니 문항 [수학 1 - ⅰ]에서 구한 직선 $l_1$과 $l_2$에 동시에 접하는 포물선 $F$를 얻게 되었다. 이때 상수 $m$, $n$의 값을 구하고 그 이유를 논하시오.
  points: 8
  depends_on: ['1']
  answer: {kind: expression, value: 'm = -17/60; n = -7/5', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $F:y-n=-(x-m)^2+4$와 각 직선을 연립한 이차방정식의 판별식이 $0$.
    steps:
    - {id: 3a, content: '$D_1=12m+4n+9=0$, $D_2=\tfrac49(12m+9n+16)=0$ → $m=-\tfrac{17}{60}$, $n=-\tfrac75$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 평행이동한 포물선의 방정식을 쓰자.
    - 직선에 접할 조건을 판별식으로 나타내면 $m$, $n$에 대한 일차식이 나온다.
  - id: S3-B
    audience: B
    source_flow: 2021 보고서 문항카드 20 예시답안 p.256(인쇄 쪽 252)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        포물선 $y=-x^2+4$를 $x$축 방향으로 $m$만큼 $y$축 방향으로 $n$만큼 평행이동한 포물선 $F$의 방정식은 $y-n=-(x-m)^2+4$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        포물선 $F$가 직선 $l_1$에 접한다는 조건으로부터, 직선 $l_1$의 방정식 $y=-3x+4$를 포물선의 방정식에 대입하여 얻은 이차방정식 $x^2-(2m+3)x+(m^2-n)=0$ …Ⓐ 의 판별식을 $D_1$이라 하면 $D_1=12m+4n+9=0$ …①.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        같은 방법으로 직선 $l_2$의 방정식 $y=-\dfrac43x+\dfrac83$을 대입하여 얻은 이차방정식 $x^2-\left(2m+\dfrac43\right)x+\left(m^2-n-\dfrac43\right)=0$ …Ⓑ 의 판별식을 $D_2$라 하면 $D_2=\dfrac49(12m+9n+16)=0$ …②.
      criteria: ['3.M1']
    - id: 3b-4
      content: |
        포물선 $F$가 직선 $l_1$과 $l_2$에 동시에 접하기 위한 $m$, $n$의 값은 1차방정식 ①, ②를 동시에 만족해야 하므로 $m=-\dfrac{17}{60}$, $n=-\dfrac75$.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        평행이동한 포물선과 각 직선의 위치 관계(판별식 $=0$)로 $m$, $n$에 대한 두 식 $12m+4n+9=0$, $12m+9n+16=0$을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [3b-1, 3b-2, 3b-3]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        $m=-\dfrac{17}{60}$, $n=-\dfrac75$을 올바르게 유도했다(채점기준표 8점 단일 행을 4·4로 나눔).
      depends_on: [3.M1]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    [수학 1 - ⅳ] 문항 [수학 1 - ⅲ]에서 구한 포물선 $F$ 및 문항 [수학 1 - ⅰ]에서 구한 직선 $l_1$과 $l_2$로 둘러싸인 도형의 넓이를 구하고 그 이유를 논하시오.
  points: 7
  depends_on: ['1', '3']
  answer: {kind: value, value: '125/2592', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: 접점 $x_1=\tfrac{73}{60}$, $x_2=\tfrac{23}{60}$, 두 직선의 교점 $x=\tfrac45$에서 구간을 나누면 피적분함수는 $(x-x_k)^2$.
    steps:
    - {id: 4a, content: '$S_F=\int_{23/60}^{4/5}\left(x-\tfrac{23}{60}\right)^2dx+\int_{4/5}^{73/60}\left(x-\tfrac{73}{60}\right)^2dx=\tfrac{125}{5184}\cdot2=\tfrac{125}{2592}$', criteria: ['4.M1', '4.A1']}
    hint_ladder:
    - 접점의 $x$좌표는 이차방정식 Ⓐ, Ⓑ의 중근이다.
    - 포물선과 접선 사이의 차는 $(x-\text{접점})^2$ 꼴이다.
  - id: S4-B
    audience: B
    source_flow: 2021 보고서 문항카드 20 예시답안 p.256(인쇄 쪽 252)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        포물선 $F$ 및 직선 $l_1$과 $l_2$로 둘러싸인 도형의 넓이를 $S_F$라고 하자. 포물선 $F$와 직선 $l_1$의 접점의 $x$좌표 $x_1$은 [수학 1-ⅲ]의 2차방정식 Ⓐ의 중근이므로 $x_1=\dfrac12(2m+3)=\dfrac{73}{60}$. 같은 방법으로 $l_2$의 접점의 $x$좌표 $x_2$는 Ⓑ의 중근이므로 $x_2=\dfrac12\left(2m+\dfrac43\right)=\dfrac{23}{60}$.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        이 때, 직선 $l_1$과 직선 $l_2$의 교점의 $x$좌표의 값이 $\dfrac45$이므로
        $$S_F=\int_{\frac{23}{60}}^{\frac45}\left(x-\dfrac{23}{60}\right)^2dx+\int_{\frac45}^{\frac{73}{60}}\left(x-\dfrac{73}{60}\right)^2dx=\left[\dfrac13\left(x-\dfrac{23}{60}\right)^3\right]_{\frac{23}{60}}^{\frac45}+\left[\dfrac13\left(x-\dfrac{73}{60}\right)^3\right]_{\frac45}^{\frac{73}{60}}=\dfrac{125}{5184}+\dfrac{125}{5184}=\dfrac{125}{2592}$$
      criteria: ['4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 4
      evidence: |
        접점 $x_1=\dfrac{73}{60}$, $x_2=\dfrac{23}{60}$과 두 직선의 교점 $x=\dfrac45$를 구해 넓이를 정적분식으로 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [3.A1], max_points: 4}
      steps: [4b-1]
    - id: 4.A1
      mark_type: A
      points: 3
      evidence: |
        정적분을 계산해 넓이 $\dfrac{125}{2592}$를 올바르게 유도했다(채점기준표 7점 단일 행을 4·3으로 나눔).
      depends_on: [4.M1]
      steps: [4b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

