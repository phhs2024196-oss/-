- id: '4'
  stem: |
    [수학 2 - ⅳ] <제시문2>에서 점 $\mathrm{T}_n$의 $y$좌표, 점 $\mathrm{R}_n$의 $x$좌표, 넓이 $S_n$을 각각 $\alpha_n$, $\beta_n$에 대한 식으로 나타낸 후 $\displaystyle\lim_{n\to\infty}S_n$을 구하고, 그 이유를 논하시오.
  points: 8
  depends_on: ['3']
  answer: {kind: expression, value: 'T_y = 4*alpha - beta + 6; R_x = (beta - 4*alpha - 3)/(4*alpha + 3); S = -(beta - 4*alpha - 3)**2/(2*(4*alpha + 3)) - 9/8; lim_S = 7/8', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $S_n=\triangle\mathrm{Q_2R_nT_n}-\tfrac98$, $\triangle=\tfrac12(3-t_n)(-r_n)$.
    steps:
    - {id: 4a, content: '$t_n=4\alpha-\beta+6$, $r_n=\tfrac{\beta-4\alpha-3}{4\alpha+3}$, $S_n=-\tfrac12\tfrac{(\beta-4\alpha-3)^2}{4\alpha+3}-\tfrac98\to-\tfrac12\cdot\tfrac{4}{-1}-\tfrac98=\tfrac78$', criteria: ['4.M1', '4.A1']}
    hint_ladder:
    - $l_n$은 제2사분면의 직선 부분 $y=x+3$과 다시 만난다.
    - 영역을 삼각형에서 포물선과 직선 사이의 조각을 뺀 것으로 보자.
  - id: S4-B
    audience: B
    source_flow: 2021 보고서 문항카드 21 예시답안 p.262(인쇄 쪽 258)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        (ⅲ)번의 풀이에서 접선 $l_n$의 방정식은 $(\alpha+1)(x+1)=\dfrac14(y-1+\beta-1)$로 주어지므로, 이 식에 $x=0$을 대입하면 $y=4\alpha-\beta+6$이 되므로, 점 $\mathrm{T}_n$의 $y$좌표는 $4\alpha-\beta+6$과 같다. 또한 접선 $l_n$은 곡선 $y=h(x)$와 2사분면에 있는 직선부분과 만나므로, 두 식 $(\alpha+1)(x+1)=\dfrac14(y-1+\beta-1)$과 $y=x+3$을 연립해서 풀면 $x=\dfrac{\beta-4\alpha-3}{4\alpha+3}$이 되므로, 교점 $\mathrm{R}_n$의 $x$좌표는 $\dfrac{\beta-4\alpha-3}{4\alpha+3}$이 된다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        넓이 $S_n=\triangle\mathrm{Q_2R_nT_n}-\displaystyle\int_{-\frac32}^{0}\left((x+3)-(2x^2+4x+3)\right)dx=\triangle\mathrm{Q_2R_nT_n}-\dfrac98$이고, 여기서 $\triangle\mathrm{Q_2R_nT_n}=\dfrac12(3-t_n)(-r_n)$이 된다. 여기서 $t_n$은 점 $\mathrm{T}_n$의 $y$좌표이며, $r_n$은 점 $\mathrm{R}_n$의 $x$좌표이다.
      criteria: ['4.A1']
    - id: 4b-3
      content: |
        앞에서 구한 $t_n$과 $r_n$의 식을 대입해서 정리하면 $3-t_n=\beta-4\alpha-3$이므로
        $$S_n=-\dfrac12\dfrac{(\beta-4\alpha-3)^2}{4\alpha+3}-\dfrac98$$
        이 되며, (ⅲ)번에서 구한 $\alpha$의 극한값 $-1$과 $\beta$의 극한값 $1$을 적용하면 $S_n$의 극한값은 $-\dfrac12\cdot\dfrac{2^2}{-1}-\dfrac98=\dfrac78$과 같게 된다.
        [공식 예시답안은 $S_n=-\dfrac12\dfrac{(\beta_n-4\alpha_n+3)^2}{4\alpha_n+3}-\dfrac98$로 인쇄되어 있으나, $3-t_n=\beta_n-4\alpha_n-3$이므로 분자는 $(\beta_n-4\alpha_n-3)^2$이 맞다(인쇄식으로는 극한이 $\tfrac{247}{8}$이 되어 공식 답 $\tfrac78$과 모순). 극한값 $\tfrac78$은 공식 답과 같다.]
      criteria: ['4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 4
      evidence: |
        점 $\mathrm{T}_n$의 $y$좌표 $4\alpha_n-\beta_n+6$과 점 $\mathrm{R}_n$의 $x$좌표 $\dfrac{\beta_n-4\alpha_n-3}{4\alpha_n+3}$을 각각 $\alpha_n$, $\beta_n$에 대한 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [3.M1], max_points: 4}
      steps: [4b-1]
    - id: 4.A1
      mark_type: A
      points: 4
      evidence: |
        넓이 $S_n$을 $\alpha_n$, $\beta_n$에 대한 식으로 나타내고 $\displaystyle\lim_{n\to\infty}S_n=\dfrac78$을 구했다.
      depends_on: [4.M1]
      steps: [4b-2, 4b-3]
    deductions: []
