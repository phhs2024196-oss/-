stimuli:
- id: S1
  label: <제시문1>
  body: |
    (ⅰ) 두 함수 $f(x)$와 $g(x)$를 다음과 같이 정의하자.
    $$f(x)=\begin{cases}2x^2+4x+3 & (x\le0)\\[2pt] \dfrac1x+2 & (x>0)\end{cases}\quad\text{이고,}\quad g(x)=x+3$$
    (ⅱ) 두 함수 $y=f(x)$와 $y=g(x)$의 그래프를 좌표평면에 그렸을 때 나타나는 세 교점을 왼쪽부터 차례대로 $\mathrm{Q}_1$, $\mathrm{Q}_2$, $\mathrm{Q}_3$이라고 하자.
    (ⅲ) 함수 $h(x)$를 $h(x)=\begin{cases}f(x) & (f(x)<g(x))\\ g(x) & (f(x)\ge g(x))\end{cases}$로 정의하자. 이때, $0<t<1$인 실수 $t$에 대하여 직선 $y=t\,(x+3)$과 곡선 $y=h(x)$의 교점의 개수를 $t$에 대한 함수 $k(t)$라 하자.
- id: S2
  label: <제시문2>
  body: |
    (ⅰ) 양의 정수 $n$에 대하여, 점 $(n,\,0)$에서 곡선 $y=h(x)$에 그은 접선 위의 접점 중 제2사분면에 있는 점을 $\mathrm{P_n}(\alpha_\mathrm{n},\beta_\mathrm{n})$이라고 하고 이때의 접선을 $l_n$이라 하자.
    (ⅱ) 직선 $l_n$이 $y$축과 만나는 점을 $\mathrm{T}_n$이라고 하고, 직선 $l_n$이 접점 $\mathrm{P}_n$을 제외한 곡선 $y=h(x)$와 다시 만나는 점을 $\mathrm{R}_n$이라고 하자.
    (ⅲ) 직선 $l_n$, $y$축, 곡선 $y=h(x)$로 둘러싸인 영역의 넓이를 $S_n$이라고 하자.

