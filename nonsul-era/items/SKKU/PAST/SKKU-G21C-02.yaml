intent: |
  직선, 포물선 및 유리함수의 그래프와 관련한 기하(포물선의 접선의 방정식, 두 곡선으로 둘러싸인 도형의 넓이)를 이해하는지 평가한다. 포물선이 접선을 가질 때 접선과 포물선의 방정식을 연립해 얻는 이차방정식의 해를 구할 수 있는지, 이를 수열의 극한과 연관시켜 극한의 수렴·발산 개념을 올바르게 이해하는지 평가한다(2021 보고서 문항카드 21 출제 의도 요약). 소문항 배점은 채점기준표 배점.
key_idea: |
  $h(x)=\min(f(x),g(x))$는 $x\le-\tfrac32$에서 $x+3$, $-\tfrac32<x\le0$에서 $2x^2+4x+3$, $0<x\le\tfrac{-1+\sqrt5}{2}$에서 $x+3$, 그 뒤 $\tfrac1x+2$이다. $(-3,0)$을 지나는 직선이 포물선 부분에 접하는 기울기 $t=-8+6\sqrt2$를 경계로 교점 수가 $2,3,4$로 바뀐다. 점 $(n,0)$에서의 접선 조건은 $2\alpha^2-4n\alpha-(4n+3)=0$.
stuck: |
  $h$의 구간별 식을 정확히 정한 뒤, 직선 $y=t(x+3)$이 오른쪽 유리함수 부분과는 항상 한 번, 왼쪽 직선 부분과는 $x=-3$에서 한 번 만나고 포물선 부분과의 교점 수만 판별식으로 갈린다는 분류
idea_tags: [IDEA-MIN-FUNCTION-PIECEWISE, IDEA-PENCIL-OF-LINES-COUNT, IDEA-TANGENT-FROM-EXTERNAL-POINT-SEQ, IDEA-RATIONALIZE-LIMIT]
