subparts:
- id: '1'
  stem: |
    [수학 2 - ⅰ] <제시문1>에서 세 교점 $\mathrm{Q}_1$, $\mathrm{Q}_2$, $\mathrm{Q}_3$의 좌표를 모두 구하고, 그 이유를 논하시오.
  points: 6
  depends_on: []
  answer: {kind: expression, value: 'Q1 = (-3/2, 3/2); Q2 = (0, 3); Q3 = ((-1 + sqrt(5))/2, (5 + sqrt(5))/2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x\le0$과 $x>0$으로 나누어 각각 $g$와 연립.
    steps:
    - {id: 1a, content: '$2x^2+3x=0\Rightarrow x=-\tfrac32,0$; $\tfrac1x+2=x+3\Rightarrow x^2+x-1=0$, $x=\tfrac{-1+\sqrt5}{2}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $f$가 구간별로 정의되어 있으니 두 경우로 나누어 연립하자.
  - id: S1-B
    audience: B
    source_flow: 2021 보고서 문항카드 21 예시답안 p.259-260(인쇄 쪽 255-256)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (a) $x\le0$: 두 식 $y=2x^2+4x+3$과 $y=x+3$을 연립하여 풀면, 두 교점 $\mathrm{Q}_1\left(-\dfrac32,\dfrac32\right)$과 $\mathrm{Q}_2(0,3)$을 얻는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (b) $x>0$: 두 식 $y=\dfrac1x+2$와 $y=x+3$을 연립하여 풀면, 교점 $\mathrm{Q}_3\left(\dfrac{-1+\sqrt5}{2},\dfrac{5+\sqrt5}{2}\right)$를 얻는다.

        답: $\mathrm{Q}_1\left(-\dfrac32,\dfrac32\right)$, $\mathrm{Q}_2(0,3)$, $\mathrm{Q}_3\left(\dfrac{-1+\sqrt5}{2},\dfrac{5+\sqrt5}{2}\right)$
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $x\le0$, $x>0$으로 나누어 각각 $g(x)=x+3$과 연립하고 $\mathrm{Q}_1$, $\mathrm{Q}_2$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\mathrm{Q}_3\left(\dfrac{-1+\sqrt5}{2},\dfrac{5+\sqrt5}{2}\right)$까지 세 교점의 좌표를 모두 구했다(채점기준표 6점 단일 행을 3·3으로 나눔).
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [수학 2 - ⅱ] <제시문1>에서 함수 $y=h(x)$의 그래프의 개형을 그리고, $0<t<1$인 실수 $t$의 범위에 따른 함수 $k(t)$의 값을 표로 나타내고, 그 이유를 논하시오.
  points: 8
  depends_on: ['1']
  answer: {kind: expression, value: 't0 = -8 + 6*sqrt(2); k_below = 2; k_at = 3; k_above = 4', equivalents: ['0<t<-8+6√2: k=2, t=-8+6√2: k=3, -8+6√2<t<1: k=4'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $y=t(x+3)$은 $x=-3$에서 한 번, 유리함수 부분과 한 번 만나고, 포물선 부분과의 교점 수는 판별식 $t^2+16t-8$의 부호로 정해진다.
    steps:
    - {id: 2a, content: '$2x^2+(4-t)x+3-3t=0$의 판별식 $=0\Rightarrow t=-8+6\sqrt2$; $k=2,3,4$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $f<g$인 구간을 구해 $h$를 구간별로 쓰자.
    - $(-3,0)$을 지나는 직선을 돌려 보며 그래프와의 교점을 세어 보자.
    - 포물선 부분에 접할 때의 기울기를 판별식으로 구하자.
  - id: S2-B
    audience: B
    source_flow: 2021 보고서 문항카드 21 예시답안 p.260-261(인쇄 쪽 256-257)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (a) $x\le0$: $f(x)<g(x)$인 부분을 살펴보면, 부등식 $2x^2+4x+3<x+3$으로부터 $-\dfrac32<x<0$을 얻는다. 또한 $f(0)=g(0)$이다. 따라서 $x\le0$일 때 $h(x)=\begin{cases}x+3 & \left(x\le-\frac32\right)\\ 2x^2+4x+3 & \left(-\frac32<x\le0\right)\end{cases}$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        (b) $x>0$: $f(x)<g(x)$인 부분을 살펴보면, 부등식 $\dfrac1x+2<x+3$으로부터 $x>\dfrac{-1+\sqrt5}{2}$를 얻는다. 따라서 $x>0$일 때 $h(x)=\begin{cases}x+3 & \left(0<x\le\frac{-1+\sqrt5}{2}\right)\\ \frac1x+2 & \left(x>\frac{-1+\sqrt5}{2}\right)\end{cases}$.
        이로부터 곡선 $y=h(x)$의 그래프의 개형은 아래와 같다.
        [그림: $-4\le x\le4$ 범위의 그래프. $x\le-\frac32$에서 기울기 1인 직선 $y=x+3$이 $(-4,-1)$에서 $(-3,0)$을 지나 $\left(-\frac32,\frac32\right)$의 꺾인 점까지 올라가고, 이어서 포물선 $y=2x^2+4x+3$이 내려가 $(-1,1)$에서 최소가 된 뒤 $(0,3)$까지 올라간다. $(0,3)$에서 다시 기울기 1인 직선으로 $\left(\frac{-1+\sqrt5}{2},\frac{5+\sqrt5}{2}\right)$(약 $(0.62,3.62)$)의 뾰족한 점까지 오르고, 그 뒤 $y=\frac1x+2$가 감소하며 $y=2$에 가까워진다($x=4$에서 약 $2.25$).]
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        이 곡선 위에 $(-3,0)$을 지나고 기울기가 $t$인 직선을 그으면, 아래 그림에 있는 것처럼 2사분면에서 곡선과 접할 때, 3개의 교점을 가짐을 알 수 있다.
        [그림: 위의 $y=h(x)$ 그래프에 $(-3,0)$을 지나는 직선(기울기 약 $0.49$)을 겹쳐 그린 그림. 직선은 $(-3,0)$에서 그래프와 만나고, $x\approx-1$ 부근에서 포물선 부분에 접하며, $x\approx2$ 부근에서 $y=\frac1x+2$ 부분과 만난다.]
        위 그림에서 접선의 기울기가 $t$일 때, 이차방정식 $2x^2+4x+3=t(x+3)$이 중근을 가지므로, 판별식은 $0$이 되어, $t=-8+6\sqrt2$를 얻는다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        이로부터 아래와 같은 표를 얻는다.

        | $t$의 범위 | $k(t)$ |
        |---|---|
        | $0<t<-8+6\sqrt2$ | 2 |
        | $t=-8+6\sqrt2$ | 3 |
        | $-8+6\sqrt2<t<1$ | 4 |
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        함수 $y=h(x)$의 구간별 식을 정하고 그래프의 개형을 그렸다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        실수 $t$의 범위에 따른 함수 $k(t)$의 값($2$, $3$, $4$; 경계 $t=-8+6\sqrt2$)을 표로 나타냈다.
      depends_on: [2.M1]
      steps: [2b-3, 2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [수학 2 - ⅲ] <제시문2>에서 $\alpha_n$, $\beta_n$을 각각 $n$에 대한 식으로 나타내고, $\displaystyle\lim_{n\to\infty}\alpha_n$과 $\displaystyle\lim_{n\to\infty}\beta_n$의 값을 구하고 그 이유를 논하시오.
  points: 8
  depends_on: ['2']
  answer: {kind: expression, value: 'alpha_n = n - sqrt(4*n**2 + 8*n + 6)/2; beta_n = 4*n**2 + 8*n + 6 - (2*n + 2)*sqrt(4*n**2 + 8*n + 6); lim_alpha = -1; lim_beta = 1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 포물선 부분의 접선이 $(n,0)$을 지날 조건 $2\alpha^2-4n\alpha-(4n+3)=0$에서 작은 근, 극한은 유리화.
    steps:
    - {id: 3a, content: '$\alpha_n=n-\tfrac12\sqrt{4n^2+8n+6}\to-1$, $\beta_n=(4n^2+8n+6)-(2n+2)\sqrt{4n^2+8n+6}\to1$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - 제2사분면의 접점은 어느 부분 위에 있는가?
    - 접선이 $(n,0)$을 지나는 조건을 $\alpha$에 대한 방정식으로 쓰자.
    - 극한은 켤레식을 곱해 $\infty-\infty$ 꼴을 없애자.
  - id: S3-B
    audience: B
    source_flow: 2021 보고서 문항카드 21 예시답안 p.261-262(인쇄 쪽 257-258)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\mathrm{P}_n(\alpha_n,\beta_n)$에서 편의상 $\alpha=\alpha_n$, $\beta=\beta_n$이라고 표기하자. 접점 $\mathrm{P}_n$이 2사분면 위에 놓여있어야 하므로, $\mathrm{P}_n$은 포물선 $y=2x^2+4x+3$ 위에 놓여있어야 한다. 또한 $\alpha$는 점 $\mathrm{Q}_1$의 $x$좌표인 $-\dfrac32$와 점 $\mathrm{Q}_2$의 $x$좌표인 $0$ 사이에 놓여있게 된다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        포물선 $y=2x^2+4x+3=2(x+1)^2+1$ 위의 점 $\mathrm{P}_n(\alpha,\beta)$에서의 접선의 방정식은 $(\alpha+1)(x+1)=\dfrac14(y-1+\beta-1)$로 주어지고, 이 직선이 점 $(n,0)$을 지나므로 $(\alpha+1)(n+1)=\dfrac14(\beta-2)$를 얻는다. 이 식에 $\beta=2\alpha^2+4\alpha+3$을 대입하고 정리하면, $\alpha$는 2차방정식 $2x^2-4nx-(4n+3)=0$의 근이 됨을 알 수 있다. 근의 공식과 $\alpha$의 범위를 고려하면 $\alpha_n=n-\dfrac12\sqrt{4n^2+8n+6}$을 얻고, $(\alpha+1)(n+1)=\dfrac14(\beta-2)$로부터 $\beta_n=(4n^2+8n+6)-(2n+2)\sqrt{4n^2+8n+6}$을 얻게 된다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        편의상 $4n^2+8n+6$을 $A$로 치환하면 $\alpha=n-\dfrac12\sqrt A$이고, 분모와 분자에 각각 $n+\dfrac12\sqrt A$를 곱해서 정리하면 $\alpha=\dfrac{-2n-\frac32}{n+\frac12\sqrt A}$, 분모와 분자를 각각 $n$으로 나누면 $\alpha=\dfrac{-2-\frac{3}{2n}}{1+\frac{\sqrt{4n^2+8n+6}}{2n}}$이 되어 $\displaystyle\lim_{n\to\infty}\alpha_n=-1$.
        비슷한 방법으로 $\beta=A-(2n+2)\sqrt A$이고, 분모와 분자에 각각 $A+(2n+2)\sqrt A$를 곱해서 정리하면 $\beta=\dfrac{2A}{A+(2n+2)\sqrt A}$, 분모와 분자를 각각 $A$로 나누면 $\beta=\dfrac{2}{1+\frac{(2n+2)}{\sqrt A}}$이 되어 $\displaystyle\lim_{n\to\infty}\beta_n=1$.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $\alpha_n=n-\dfrac12\sqrt{4n^2+8n+6}$, $\beta_n=(4n^2+8n+6)-(2n+2)\sqrt{4n^2+8n+6}$을 각각 $n$에 대한 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [3b-1, 3b-2]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        $\displaystyle\lim_{n\to\infty}\alpha_n=-1$과 $\displaystyle\lim_{n\to\infty}\beta_n=1$의 값을 구했다.
      depends_on: [3.M1]
      steps: [3b-3]
    deductions: []
