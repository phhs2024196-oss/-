- id: '3'
  stem: |
    [수학1-ⅲ] <제시문3>에서 모든 양의 정수 $n$에 대하여 $S_n=2^n$이고, 수열 $\{a_n\}$을 삼각형 모양으로 배열할 때, [수학1-ⅱ]에서와 같이 짝수번째 줄의 배열은 역순으로 하자. 이때 삼각형의 위 꼭짓점에서부터 50번째 줄까지 각 줄의 가장 오른쪽에 배열되는 수들의 곱을 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '2**21426', equivalents: ['2^21426'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a_1=2$, $a_n=2^{n-1}$($n\ge2$)이므로 곱은 $2^N$이고, 지수 $N$은 (ii)의 항 번호에서 1을 뺀 값들의 합(첫 줄은 1).
    steps:
    - {id: 3a, content: '$N=1+\sum_{m=1}^{25}(4m^2-2m-1)=21426$, 곱 $=2^{21426}$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - $S_n=2^n$에서 $a_n$을 구하면 등비수열이 된다. $a_1$은?
    - 곱은 지수의 합으로 바뀐다. (ii)에서 구한 항 번호를 그대로 쓰라.
  - id: S3-B
    audience: B
    source_flow: 2022 보고서 문항카드 10 예시답안 p.184(인쇄 180)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        2 이상인 양의 정수 $n$에 대해 $a_n=S_n-S_{n-1}=2^n-2^{n-1}=2^{n-1}$이고, $a_1=S_1=2$이다.
    - id: 3b-2
      content: |
        $k$가 짝수일 때, 제$k$번째 줄의 마지막 수는 수열의 $1+(1+2+\cdots+(k-1))=\dfrac12(k^2-k+2)$번째 항이므로 $2^{\frac12(k^2-k)}$이다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        $k$가 2 이상인 홀수일 때, 제$k$번째 줄의 마지막 수는 수열의 $1+2+\cdots+k=\dfrac{k(k+1)}{2}$번째 항이므로 $2^{\frac12(k^2+k-2)}$이다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        따라서 50번째 줄까지 각 줄의 가장 오른쪽에 배열되는 수들의 곱은
        $2\times2^{\frac12\sum_{m=2}^{25}((2m-1)^2+(2m-1)-2)}\times2^{\frac12\sum_{m=1}^{25}((2m)^2-(2m))}$이다. 이를 다시 정리하면 $2^N$의 형태이고,
        $N=1+\dfrac12\displaystyle\sum_{m=1}^{25}((2m-1)^2+(2m-1)-2+(2m)^2-2m)=1+\sum_{m=1}^{25}(4m^2-2m-1)=1+4\times\dfrac{25\times26\times51}{6}-2\times\dfrac{25\times26}{2}-25=21426$이다. 따라서 문제의 곱은 $2^{21426}$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
