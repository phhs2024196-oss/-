subparts:
- id: '1'
  stem: |
    [수학1-ⅰ] <제시문3>에서 모든 양의 정수 $n$에 대하여 $S_n=n^2+n+1$일 때, 삼각형의 위 꼭짓점에서부터 50번째 줄까지 각 줄의 가장 오른쪽에 배열되는 수들의 합을 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '44201', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_1=3$, $a_n=2n$($n\ge2$)이고 $k$번째 줄 마지막 항은 $\dfrac{k(k+1)}{2}$번째 항이므로 그 값은 $k(k+1)$이다.
    steps:
    - {id: 1a, content: '$3+\sum_{k=2}^{50}k(k+1)=1+\sum_{k=1}^{50}(k^2+k)=44201$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $S_n$이 주어지면 $a_n$은 어떻게 구하는가? $n=1$은 따로 보라.
    - $k$번째 줄까지 몇 개의 항이 놓였는가?
  - id: S1-B
    audience: B
    source_flow: 2022 보고서 문항카드 10 예시답안 p.183-184(인쇄 179-180)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        2 이상인 양의 정수 $n$에 대해 $a_n=S_n-S_{n-1}=(n^2+n+1)-((n-1)^2+(n-1)+1)=2n$이고, $a_1=S_1=3$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        2 이상인 양의 정수 $k$에 대하여, 이 삼각형 배열의 제$k$번째 줄의 마지막 수는 수열의 $1+2+\cdots+k=\dfrac{k(k+1)}{2}$번째 항이므로 $k(k+1)$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        따라서 가장 위 꼭짓점에서부터 50번째 줄까지 각 줄의 가장 오른쪽에 배열되는 수들의 합은
        $3+\displaystyle\sum_{k=2}^{50}k(k+1)=1+\sum_{k=1}^{50}(k^2+k)=1+\dfrac{50\times51\times101}{6}+\dfrac{50\times51}{2}=44201$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $a_1=3$과 $n\ge2$일 때 $a_n=2n$임을 보인다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $n\ge2$일 때, 제$n$번째 줄의 마지막 수가 $n(n+1)$임을 보인다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $3+\displaystyle\sum_{n=2}^{50}n(n+1)=44201$임을 보인다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [수학1-ⅱ] <제시문3>에서 수열 $\{a_n\}$을 삼각형 모양으로 배열할 때, 짝수번째 줄의 배열은 역순으로 하자. 예를 들어, 두 번째 줄은 $a_2\,a_3$이 아니라 $a_3\,a_2$로 재배열하고, 네번째 줄은 $a_7\,a_8\,a_9\,a_{10}$이 아니라 $a_{10}\,a_9\,a_8\,a_7$로 재배열한다. [수학1-ⅰ]에서와 같이 모든 양의 정수 $n$에 대하여 $S_n=n^2+n+1$일 때, 삼각형의 위 꼭짓점에서부터 50번째 줄까지 각 줄의 가장 오른쪽에 배열되는 수들의 합을 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '42951', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 짝수 줄의 가장 오른쪽은 그 줄의 첫 항 $\left(\dfrac{k^2-k+2}{2}\right)$번째 항으로 값 $k^2-k+2$, 홀수 줄은 그대로 $k(k+1)$.
    steps:
    - {id: 2a, content: '$3+\sum_{m=2}^{25}(2m-1)(2m)+\sum_{m=1}^{25}((2m)^2-2m+2)=1+\sum_{m=1}^{25}(8m^2-4m+2)=42951$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 역순으로 놓은 줄에서 가장 오른쪽에 오는 항은 원래 그 줄의 몇 번째 항인가?
    - 50줄을 홀수 줄 25개와 짝수 줄 25개로 나누어 더하라.
  - id: S2-B
    audience: B
    source_flow: 2022 보고서 문항카드 10 예시답안 p.184(인쇄 180)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $k$가 짝수일 때, 제$k$번째 줄의 마지막 수는 수열의 $1+(1+2+\cdots+(k-1))=\dfrac12(k^2-k+2)$번째 항이므로 $k^2-k+2$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $k$가 2 이상인 홀수일 때, 제$k$번째 줄의 마지막 수는 수열의 $1+2+\cdots+k=\dfrac{k(k+1)}{2}$번째 항이므로 $k(k+1)$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        따라서 50번째 줄까지 각 줄의 가장 오른쪽에 배열되는 수들의 합은
        $3+\displaystyle\sum_{m=2}^{25}(2m-1)(2m)+\sum_{m=1}^{25}((2m)^2-(2m)+2)=1+\sum_{m=1}^{25}(8m^2-4m+2)$이고, 이를 다시 정리하면 $1+8\times\dfrac{25\times26\times51}{6}-4\times\dfrac{25\times26}{2}+2\times25=42951$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
