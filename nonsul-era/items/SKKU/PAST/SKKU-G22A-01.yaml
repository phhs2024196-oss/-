stimuli:
- id: S1
  label: <제시문1>
  body: |
    첫째항에 차례로 일정한 수를 더하여 얻어진 수열을 등차수열이라 하고, 그 일정한 수를 공차라고 한다. 그리고, 첫째항에 차례로 일정한 수를 곱하여 얻어진 수열을 등비수열이라 하고, 그 일정한 수를 공비라고 한다.
- id: S2
  label: <제시문2>
  body: |
    자연수의 거듭제곱의 합은 다음의 등식으로 구할 수 있다.
    (i) $1+2+3+\cdots+n=\displaystyle\sum_{k=1}^{n}k=\dfrac{n(n+1)}{2}$
    (ii) $1^2+2^2+3^2+\cdots+n^2=\displaystyle\sum_{k=1}^{n}k^2=\dfrac{n(n+1)(2n+1)}{6}$
- id: S3
  label: <제시문3>
  body: |
    수열 $\{a_n\}$을 오른쪽 그림과 같이 삼각형 모양으로, 가장 위 꼭짓점에서부터 출발하여 왼쪽에서 오른쪽으로, $k$번째 줄에는 $k$개씩 배열하자. 그리고 모든 양의 정수 $n$에 대하여, 이 수열의 첫째항부터 제$n$항까지의 합을 $S_n$이라고 한다.
    [그림: 삼각형 배열 — 1번째 줄 $a_1$ / 2번째 줄 $a_2\ a_3$ / 3번째 줄 $a_4\ a_5\ a_6$ / 4번째 줄 $a_7\ a_8\ a_9\ a_{10}$ / 5번째 줄 $a_{11}\ a_{12}\ a_{13}\ a_{14}\ a_{15}$ / 6번째 줄 $a_{16}\ a_{17}\ \bullet\ \bullet\ \bullet\ \bullet$ / 다음 줄 $\bullet\ \bullet\ \cdots$ 가운데 정렬]

