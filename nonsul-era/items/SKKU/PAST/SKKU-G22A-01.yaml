      points: 3
      evidence: |
        $n$이 짝수일 때, 제$n$번째 줄의 마지막 수가 $n^2-n+2$임을 보인다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 3}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $n$이 2 이상인 홀수일 때, 제$n$번째 줄의 마지막 수가 $n(n+1)$임을 보인다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M2], max_points: 3}
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $3+\displaystyle\sum_{k=2}^{25}(2k-1)(2k)+\sum_{k=1}^{25}((2k)^2-(2k)+2)=42951$임을 보인다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-3]
    deductions: []
