intent: |
  수열과 수열의 합 사이의 관계를 등차수열과 등비수열의 예를 통해 이해하고 있는지 평가한다. 자연수의 거듭제곱의 합 공식을 이용해 특정한 형태로 나타나는 수열의 합과 곱을 정확히 유도하고, 그 과정에서 수열의 표현식을 경우(짝수 줄/홀수 줄)로 나누어 자연스럽게 정리하는 능력이 주요 평가요소이다(2022 보고서 문항카드 10 출제 의도 요약). [배점추정: 문항별 배점 미표기, 채점기준표 배점(각 10점) 사용]
key_idea: |
  $a_n=S_n-S_{n-1}$($n\ge2$), $a_1=S_1$로 일반항을 구하고, $k$번째 줄의 마지막 수가 몇 번째 항인지를 $\dfrac{k(k+1)}{2}$(홀수 줄) 또는 $1+\dfrac{k(k-1)}{2}$(역순인 짝수 줄)로 센다.
stuck: |
  짝수 줄을 역순으로 놓으면 그 줄의 가장 오른쪽 수가 그 줄의 첫 항, 즉 $\dfrac{(k-1)k}{2}+1$번째 항이 된다는 것, 그리고 $a_1$만 일반항 공식에서 벗어난다는 것
idea_tags: [IDEA-SUM-TO-TERM-DIFFERENCE, IDEA-TRIANGULAR-INDEX, IDEA-PARITY-CASE-SPLIT]
tags: [수열의 합과 일반항, 삼각형 배열, 거듭제곱의 합]
