intent: |
  일대일함수의 역함수를 이해하고 적용할 수 있는지, 이를 함수의 미분을 이용한 접점에서의 접선의 방정식 등의 개념과 연결할 수 있는지 평가한다. 또한 접선과 곡선으로 둘러싸인 영역의 넓이를 구하는 개념과 관련지을 수 있는지, 두 영역의 넓이의 비를 구할 수 있는지 평가한다(2022 보고서 문항카드 11 출제 의도 요약). [배점추정: 문항별 배점 미표기, 채점기준표 배점 사용]
key_idea: |
  $g(x)=(-1-\sqrt2)x$, $h(x)=(1-\sqrt2)x=\alpha x$이므로 $x_n=\alpha^n$이고, $g(x_{n+1})=x_n$이므로 직선 $\mathrm{P}_n\mathrm{P}_{n+1}$은 $\mathrm{P}_{n+1}$에서의 접선이다.
stuck: |
  $h$가 $g$의 역함수라는 사실에서 $\mathrm{P}_{n+1}$에서의 접선이 곡선과 다시 만나는 점이 바로 $\mathrm{P}_n$임을 알아보는 것(두 점을 잇는 직선 = 접선)
idea_tags: [IDEA-INVERSE-FUNCTION-ITERATION, IDEA-SECANT-IS-TANGENT, IDEA-GEOMETRIC-SCALING-RATIO]
tags: [구간별 이차함수, 접선, 역함수, 넓이의 비, 등비]
