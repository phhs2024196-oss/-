stimuli:
- id: S1
  label: <제시문1>
  body: |
    (i) 함수 $f(x)$를 다음과 같이 정의하자.
    $$f(x)=\begin{cases}-x^2-x & (x\le0)\\ x^2-x & (x>0)\end{cases}$$
    (ii) 함수 $g(x)$를 다음과 같이 정의하자. $g(0)=0$이며, $0$이 아닌 실수 $b$에 대하여, 곡선 $y=f(x)$ 위의 점 $(b,f(b))$에서의 접선이 접점을 제외한 곡선 $y=f(x)$와 다시 만나는 점의 $x$좌표를 $g(b)$로 한다.
    (iii) 함수 $h(x)$를 함수 $g(x)$의 역함수로 정의하자.
- id: S2
  label: <제시문2>
  body: |
    (i) $x_0=1$로 놓고, 양의 정수 $n$에 대하여, $x_{n+1}=h(x_n)$으로 정의하자.
    (ii) 음이 아닌 정수 $n$에 대하여, $y_n=f(x_n)$으로 정의하고, 점 $\mathrm{P}_n$을 $(x_n,y_n)$으로 놓자.
    (iii) 음이 아닌 정수 $n$에 대하여, 점 $\mathrm{P}_n$과 점 $\mathrm{P}_{n+1}$을 잇는 직선의 방정식을 $y=L_n(x)$로 놓자.
    (iv) 음이 아닌 정수 $n$에 대하여, 직선 $y=L_n(x)$와 곡선 $y=f(x)$로 둘러싸인 영역의 넓이를 $A_n$이라고 하자.

stem: null   # 원문에 공통 발문 없음

subparts:
- id: '1'
  stem: |
    [수학2-ⅰ] <제시문1>에서 정의된 두 함수 $g(x)$와 $h(x)$를 모두 구하고, 그 이유를 논하시오.
  points: 5
  depends_on: []
  answer: {kind: expression, value: 'g(x) = (-1-sqrt(2))*x; h(x) = (1-sqrt(2))*x', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선과 반대쪽 가지를 연립하면 $x=-b\pm\sqrt2b$이고 부호가 $b$와 반대인 근이 $g(b)$이다.
    steps:
    - {id: 1a, content: '$g(x)=(-1-\sqrt2)x$, $h(x)=\dfrac{x}{-1-\sqrt2}=(1-\sqrt2)x$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $b>0$일 때 접선이 다시 만나는 점은 어느 쪽 가지 위에 있는가?
    - $(-1-\sqrt2)(1-\sqrt2)=1$을 확인하라.
  - id: S1-B
    audience: B
    source_flow: 2022 보고서 문항카드 11 예시답안 p.187(인쇄 183)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $b$가 양수인 경우, $(b,f(b))$에서의 접선의 방정식은 $y=(2b-1)(x-b)+(b^2-b)$가 되고, 이 식과 $y=-x^2-x$를 연립하여 풀면, $x=-b\pm\sqrt2b$를 얻는다. 함수 $g(x)$의 정의에 따르면, $b$가 양수일 때, $g(b)$는 음수이므로, $g(b)=(-1-\sqrt2)b$를 얻는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        비슷한 방법으로, $b$가 음수인 경우, $(b,f(b))$에서의 접선의 방정식은 $y=(-2b-1)(x-b)+(-b^2-b)$가 되고, 이 식과 $y=x^2-x$를 연립하여 풀면, $x=-b\pm\sqrt2b$를 얻는다. $b$가 음수일 때, $g(b)$는 양수이므로, $g(b)=(-1-\sqrt2)b$를 얻는다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        따라서 모든 실수 $x$에 대하여, 함수 $g(x)$는 $g(x)=(-1-\sqrt2)x$가 되고, 역함수 $h(x)$는 $h(x)=(1-\sqrt2)x$와 같게 된다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $g(x)=(-1-\sqrt2)x$ 임을 구한다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $h(x)=(1-\sqrt2)x$ 임을 구한다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [수학2-ⅱ] 음이 아닌 정수 $m$에 대하여, <제시문2>에 주어진 함수 $L_{2m}(x)$와 $L_{2m+1}(x)$의 모든 계수를 $\alpha$와 $m$에 대한 식으로 표시하고, 그 이유를 논하시오. (단, $\alpha$는 $1-\sqrt2$이다.)
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'L2m_slope = -2*alpha**(2*m+1)-1; L2m_const = alpha**(4*m+2); L2m1_slope = 2*alpha**(2*m+2)-1; L2m1_const = -alpha**(4*m+4)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x_n=\alpha^n$이고 $L_{2m}$은 $\mathrm{P}_{2m+1}$($x<0$ 가지), $L_{2m+1}$은 $\mathrm{P}_{2m+2}$($x>0$ 가지)에서의 접선이다.
    steps:
    - {id: 2a, content: '$L_{2m}(x)=(-2\alpha^{2m+1}-1)x+\alpha^{4m+2}$, $L_{2m+1}(x)=(2\alpha^{2m+2}-1)x-\alpha^{4m+4}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $x_{n+1}=h(x_n)$이면 $g(x_{n+1})=x_n$이다. 이것이 접선에 대해 무엇을 말해 주는가?
  - id: S2-B
    audience: B
    source_flow: 2022 보고서 문항카드 11 예시답안 p.188(인쇄 184)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        [그림: 원점 근처의 곡선 $y=f(x)$(왼쪽은 위로 볼록한 $-x^2-x$, 오른쪽은 아래로 볼록한 $x^2-x$)와 점 $\mathrm{P}_0(1,0)$, $\mathrm{P}_1$(제2사분면), $\mathrm{P}_2$(제4사분면), 직선 $y=L_0(x)$($\mathrm{P}_1$에서 접하고 $\mathrm{P}_0$를 지남)와 $y=L_1(x)$($\mathrm{P}_2$에서 접하고 $\mathrm{P}_1$을 지남)]
        $x_0=1$이고, 양의 정수 $n$에 대하여, $x_{n+1}=h(x_n)=(1-\sqrt2)x_n$이므로, $x_n=(1-\sqrt2)^n$과 같게 된다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        직선 $y=L_{2m}(x)$는 점 $P_{2m+1}$을 접점으로 하는 접선의 식과 같다. 따라서 $\alpha=1-\sqrt2$, $b=x_{2m+1}=\alpha^{2m+1}$이라고 두면, $L_{2m}(x)=(-2b-1)x+b^2=(-2\alpha^{2m+1}-1)x+\alpha^{4m+2}$이 된다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        한편, 직선 $y=L_{2m+1}(x)$는 점 $P_{2m+2}$를 접점으로 하는 접선의 식과 같게 되므로, $c=x_{2m+2}=\alpha^{2m+2}$이라고 두면, $L_{2m+1}(x)=(2c-1)x-c^2=(2\alpha^{2m+2}-1)x-\alpha^{4m+4}$이 된다.
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    source_flow: 2022 보고서 문항카드 11 예시답안 p.188(인쇄 184) 별해
    method_no: 2
    key_idea: 점의 좌표 $x_n=\alpha^n$, $y_n=\alpha^{2n}-\alpha^n$($n$ 짝수), $y_n=-\alpha^{2n}-\alpha^n$($n$ 홀수)을 구해 두 점을 지나는 직선의 식으로 계수를 구한다.
    steps:
    - id: 2c-1
      content: |
        $L_{2m}(x)=\left(\dfrac{y_{2m+1}-y_{2m}}{x_{2m+1}-x_{2m}}\right)(x-x_{2m})+y_{2m}$, $L_{2m+1}(x)=\left(\dfrac{y_{2m+2}-y_{2m+1}}{x_{2m+2}-x_{2m+1}}\right)(x-x_{2m+1})+y_{2m+1}$을 구한 후, 이 식의 계수들을 $\alpha$와 $m$으로 표현할 수 있음.(단, 좌표를 맞게 구해서 표기했는지 확인 필요)
      criteria: ['2.M1', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $L_{2m}(x)$의 일차항 계수: $-2\alpha^{2m+1}-1$, $L_{2m}(x)$의 상수항: $\alpha^{4m+2}$.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 5}
      steps: [2b-1, 2b-2, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $L_{2m+1}(x)$의 일차항 계수: $2\alpha^{2m+2}-1$, $L_{2m+1}(x)$의 상수항: $-\alpha^{4m+4}$.
      depends_on: [2.M1]
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [수학2-ⅲ] 음이 아닌 정수 $m$에 대하여, <제시문2>에 주어진 $A_{2m}$과 $A_{2m+1}$을 모두 $\alpha$와 $m$에 대한 식으로 표시하고, 그 이유를 논하시오. (단, $\alpha$는 $1-\sqrt2$이다.)
  points: 10
  depends_on: ['2']
  answer: {kind: expression, value: 'A2m = -2*alpha**(6*m+1)/3; A2m1 = 2*alpha**(6*m+4)/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 접점 $b$에서 접선과 곡선의 차는 $\pm(x-b)^2$이므로 $0$에서 구간을 나누어 적분하고 $\alpha^2=2\alpha+1$로 정리.
    steps:
    - {id: 3a, content: '$A_{2m}=-\tfrac23\alpha^{6m+1}$, $A_{2m+1}=\tfrac23\alpha^{6m+4}$', criteria: ['3.M1', '3.A1']}
    hint_ladder:
    - $L_{2m}$과 $f$의 차를 $x\le0$, $x>0$ 각각 정리해 보라.
    - $b/\alpha=x_{2m}$이다.
  - id: S3-B
    audience: B
    source_flow: 2022 보고서 문항카드 11 예시답안 p.189(인쇄 185)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        [수학2-ⅱ]의 풀이에서처럼 편의상 $\alpha=1-\sqrt2$, $b=x_{2m+1}=\alpha^{2m+1}$, $c=x_{2m+2}=\alpha^{2m+2}$이라고 두자.
        $A_{2m}=\displaystyle\int_{x_{2m+1}}^{x_{2m}}(L_{2m}(x)-f(x))dx=\int_b^0((-2b-1)x+b^2-(-x^2-x))dx+\int_0^{b/\alpha}((-2b-1)x+b^2-(x^2-x))dx$
        $=\displaystyle\int_b^0(x^2-2bx+b^2)dx+\int_0^{b/\alpha}(-x^2-2bx+b^2)dx=\left[\dfrac{x^3}{3}-bx^2+b^2x\right]_b^0+\left[-\dfrac{x^3}{3}-bx^2+b^2x\right]_0^{b/\alpha}$
        $=-\dfrac{b^3}{3}+\left(-\dfrac{b^3}{3\alpha^3}-\dfrac{b^3}{\alpha^2}+\dfrac{b^3}{\alpha}\right)=-\left(\dfrac{\alpha^3+1+3\alpha-3\alpha^2}{3\alpha^3}\right)b^3=-\left(\dfrac{2+5\alpha+1+3\alpha-3-6\alpha}{3\alpha^3}\right)\alpha^{6m+3}$
        $=-\dfrac23\alpha^{6m+1}$ 이 되고,
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $A_{2m+1}=\displaystyle\int_{x_{2m+1}}^{x_{2m+2}}(f(x)-L_{2m+1}(x))dx=\int_0^c((x^2-x)-((2c-1)x-c^2))dx+\int_{c/\alpha}^0((-x^2-x)-((2c-1)x-c^2))dx$
        $=\displaystyle\int_0^c(x^2-2cx+c^2)dx+\int_{c/\alpha}^0(-x^2-2cx+c^2)dx=\left[\dfrac{x^3}{3}-cx^2+c^2x\right]_0^c+\left[-\dfrac{x^3}{3}-cx^2+c^2x\right]_{c/\alpha}^0$
        $=\dfrac{c^3}{3}-\left(-\dfrac{c^3}{3\alpha^3}-\dfrac{c^3}{\alpha^2}+\dfrac{c^3}{\alpha}\right)=\left(\dfrac{\alpha^3+1+3\alpha-3\alpha^2}{3\alpha^3}\right)c^3=\left(\dfrac{2+5\alpha+1+3\alpha-3-6\alpha}{3\alpha^3}\right)\alpha^{6m+6}$
        $=\dfrac23\alpha^{6m+4}$ 이 된다.
