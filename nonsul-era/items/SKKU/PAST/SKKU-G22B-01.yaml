stimuli:
- id: S1
  label: <제시문1>
  body: |
    $f(x)$는 최고차항의 계수가 $-1$인 사차함수이다. 기울기가 양수이고 원점을 지나는 직선 $L$이 $y=f(x)$에 두 점 $(a,f(a))$와 $(b,f(b))$에 접한다. 그리고 $L$과 평행인 직선이 $y=f(x)$와 $(c,f(c))$에 접한다. (단, $a,b,c$는 $0<a<c<b$를 만족하는 실수이다.)
- id: S2
  label: <제시문2>
  body: |
    <제시문1>에서 주어진 함수 $f(x)$와 $a,b,c$에 대하여 $c<x<b$를 만족하며 $f'(x)$가 최대가 되게 하는 $x$의 값을 $d$라 하자.
- id: S3
  label: <제시문3>
  body: |
    <제시문1>에서 주어진 함수 $f(x)$와 $a,b,c$에 대하여 두 점 $(c,f(c))$와 $(b,f(b))$를 잇는 직선이 $y=f(x)$와 만나는 점을 $(e,f(e))$라 하자. (단, $e$는 $c<e<b$를 만족하는 실수이다.)

stem: |
  다음 <제시문1>~<제시문3>을 읽고 [수학 1-ⅰ]~[수학 1-ⅳ]를 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    [수학 1-ⅰ] <제시문1>에서 주어진 $c$를 $a,b$로 표현하고 그 이유를 논하시오.
  points: 5
  depends_on: []
  answer: {kind: expression, value: '(a+b)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(x)=f(x)-mx=-(x-a)^2(x-b)^2$이고 $g'(c)=0$인 $a<c<b$는 $\dfrac{a+b}{2}$뿐.
    steps:
    - {id: 1a, content: '$g''(x)=-4(x-a)(x-b)\left(x-\tfrac{a+b}{2}\right)$이므로 $c=\tfrac{a+b}{2}$', criteria: ['1.B1']}
    hint_ladder:
    - 두 점에서 접하는 직선을 빼면 어떤 다항식이 남는가?
  - id: S1-B
    audience: B
    source_flow: 2022 보고서 문항카드 15 예시답안 p.216(인쇄 212)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        [그림: 위로 볼록한 사차함수 $y=f(x)$의 그래프. 원점을 지나는 빨간 직선 $L$이 $x=a$, $x=b$에서 곡선에 접하고, $x=c$(극소점 근처)에서 $L$과 평행한 짧은 접선, 점 $(c,f(c))$와 $(b,f(b))$를 잇는 직선이 $x=e$에서 곡선과 만나며, $d$는 $c$와 $e$ 사이, $e$의 바로 왼쪽에 표시됨]
        직선 $L$의 식을 $y=mx$라 하면 함수 $g(x)=f(x)-mx$은 $g(a)=g'(a)=0$와 $g(b)=g'(b)=0$을 만족한다. 이 조건과 $g(x)$는 최고차항의 계수가 $-1$인 사차함수라는 것을 이용하면 $g(x)=-(x-a)^2(x-b)^2$이고 따라서 $f(x)=mx-(x-a)^2(x-b)^2$이다.
      criteria: ['1.B1']
    - id: 1b-2
      content: |
        문제의 조건으로부터 $f'(c)=m+g'(c)=m$이므로 $g'(c)=0$이 된다. $g'(x)=-4(x-a)(x-b)(x-(a+b)/2)$이므로 $c=(a+b)/2$을 얻는다.
      criteria: ['1.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 5
      evidence: |
        $c=(a+b)/2$
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [수학 1-ⅱ] <제시문2>에서 주어진 $d$를 $a,b$로 표현하고 그 이유를 논하시오.
  points: 5
  depends_on: ['1']
  answer: {kind: expression, value: '(3*(a+b)+sqrt(3)*(b-a))/6', equivalents: ['((3-sqrt(3))*a+(3+sqrt(3))*b)/6'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'$의 최대는 $f''=0$인 점; $c<d<b$인 근을 고른다.
    steps:
    - {id: 2a, content: '$f''''(d)=0\Rightarrow d=\tfrac{3(a+b)+\sqrt3(b-a)}{6}$', criteria: ['2.B1']}
    hint_ladder:
    - $f'(x)$가 최대가 되는 점에서 $f''(x)$는 얼마인가?
  - id: S2-B
    audience: B
    source_flow: 2022 보고서 문항카드 15 예시답안 p.217(인쇄 213)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)=mx-(x-a)^2(x-b)^2$을 두 번 미분하면 $f''(x)=-4\left(3x^2-3(a+b)x+\dfrac{a^2+4ab+b^2}{2}\right)$이 된다.
        조건으로부터 $f''(d)=0$이므로 $d=\dfrac{3(a+b)\pm\sqrt3(b-a)}{6}$에서 $c=(a+b)/2<d<b$인 것을 고르면 $d=\dfrac{3(a+b)+\sqrt3(b-a)}{6}=\dfrac{(3-\sqrt3)a+(3+\sqrt3)b}{6}$을 얻는다.
      criteria: ['2.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 5
      evidence: |
        $d=\dfrac{3(a+b)+\sqrt3(b-a)}{6}$ (또는 $d=\dfrac{(3-\sqrt3)a+(3+\sqrt3)b}{6}$)
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.B1], max_points: 5}
      steps: [2b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [수학 1-ⅲ] <제시문3>에서 주어진 $e$를 $a,b$로 표현하고 그 이유를 논하시오.
  points: 5
  depends_on: ['1']
  answer: {kind: expression, value: '((3*a+b)+sqrt(5)*(b-a))/4', equivalents: ['((3-sqrt(5))*a+(1+sqrt(5))*b)/4'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 직선과 곡선의 교점 방정식은 $b$, $c$를 근으로 가지므로 $(x-b)$로 약분 후 $x-\tfrac{a+b}{2}$로 나누면 남은 이차식의 근이 $e$.
    steps:
    - {id: 3a, content: '$x^2-\tfrac{3a+b}{2}x+\tfrac{a^2+4ab-b^2}{4}=0$의 큰 근 $e=\tfrac{(3a+b)+\sqrt5(b-a)}{4}$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - 교점 방정식에서 이미 알고 있는 근은 무엇인가?
  - id: S3-B
    audience: B
    source_flow: 2022 보고서 문항카드 15 예시답안 p.217(인쇄 213)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        두 점 $(c,f(c))$와 $(b,f(b))$를 잇는 직선은 $y=\dfrac{f(b)-f(c)}{b-c}(x-b)+f(b)$이고 [수학 1-ⅰ]에서 구한 $c$를 이용해 정리하면 $y=(m+(b-a)^3/8)(x-b)+mb$가 된다. 따라서 $b,c,e$는 $(m+(b-a)^3/8)(x-b)+mb=mx-(x-a)^2(x-b)^2$의 근이 된다. 이 식을 정리하면 $\dfrac{(b-a)^3}{8}(x-b)+(x-a)^2(x-b)^2=0$이고 $c,e\ne b$이므로 $c,e$는 $\dfrac{(b-a)^3}{8}+(x-a)^2(x-b)=0$이 근이 된다. 이 식을 정리하면 $x^3-(2a+b)x^2+(a^2+2ab)x-a^2b+\dfrac{(b-a)^3}{8}=0$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        또한 $c=(a+b)/2$이 근이 되므로 다항식의 나눗셈을 이용해 $x-(a+b)/2$로 이 식의 좌변을 나누면
        $x^3-(2a+b)x^2+(a^2+2ab)x-a^2b+\dfrac{(b-a)^3}{8}=\left(x-\dfrac{a+b}{2}\right)\left(x^2-\dfrac{3a+b}{2}x+\dfrac{a^2+4ab-b^2}{4}\right)$을 얻는다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $e\ne c=(a+b)/2$이므로 $e$는 $x^2-\dfrac{3a+b}{2}x+\dfrac{a^2+4ab-b^2}{4}=0$의 두 근 $\dfrac{(3a+b)\pm\sqrt5(b-a)}{4}$ 중 하나가 된다. 주어진 조건 $c<e<b$을 사용하면 $e=\dfrac{(3a+b)+\sqrt5(b-a)}{4}=\dfrac{(3-\sqrt5)a+(1+\sqrt5)b}{4}$을 얻는다. (만약 $e=\dfrac{(3a+b)-\sqrt5(b-a)}{4}$이면 $e-a=\dfrac{(b-a)-\sqrt5(b-a)}{4}=\dfrac{1-\sqrt5}{4}(b-a)<0$가 되어 $a<c<e$에 모순이다.)
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 1
      evidence: |
        $e$가 방정식 $x^3-(2a+b)x^2+(a^2+2ab)x-a^2b+\dfrac{(b-a)^3}{8}=0$의 근이 됨을 도출 [배점추정: 채점기준표는 세 항목 합 5점으로만 표기 — 1/2/2로 배분]
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.B1], max_points: 1}
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 2
      evidence: |
        $x^3-(2a+b)x^2+(a^2+2ab)x-a^2b+\dfrac{(b-a)^3}{8}$을 인수분해하여 $\left(x-\dfrac{a+b}{2}\right)\left(x^2-\dfrac{3a+b}{2}x+\dfrac{a^2+4ab-b^2}{4}\right)$을 도출
      depends_on: [3.M1]
      implied_ok: false
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $e=\dfrac{(3a+b)+\sqrt5(b-a)}{4}$ (또는 $e=\dfrac{(3-\sqrt5)a+(1+\sqrt5)b}{4}$)
      depends_on: [3.M2]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    [수학 1-ⅳ] <제시문1>~<제시문3>에서 주어진 $a,b,d,e$에 대해 $\dfrac{e-d}{b-a}$의 값을 구하고 그 이유를 논하시오.
  points: 5
  depends_on: ['2', '3']
  answer: {kind: value, value: '(3*sqrt(5)-2*sqrt(3)-3)/12', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: (ii)·(iii)의 식을 빼면 $b-a$가 공통인수로 나온다.
    steps:
    - {id: 4a, content: '$\tfrac{e-d}{b-a}=\tfrac{3\sqrt5-2\sqrt3-3}{12}$', criteria: ['4.B1']}
    hint_ladder:
    - $d$, $e$를 $\tfrac{a+b}{2}+k(b-a)$ 꼴로 써 보라.
  - id: S4-B
    audience: B
    source_flow: 2022 보고서 문항카드 15 예시답안 p.217(인쇄 213)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        위에서 구한 식을 이용하면 $e-d=\dfrac{(-3-2\sqrt3+3\sqrt5)(b-a)}{12}$이므로 $\dfrac{e-d}{b-a}=\dfrac{3\sqrt5-2\sqrt3-3}{12}$이다.
      criteria: ['4.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.B1
      mark_type: B
      points: 5
      evidence: |
        $\dfrac{e-d}{b-a}=\dfrac{3\sqrt5-2\sqrt3-3}{12}$
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.B1, 3.A1], max_points: 5}
      steps: [4b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

