intent: |
  함수의 그래프의 기하학적 의미를 수식으로 설명하는 능력, 특히 그래프에서 접선이 주어진 경우 함수의 식을 찾아내는 능력을 평가한다. 미분계수의 극값과 이계도함수와의 관계를 파악하는 능력, 사차함수의 그래프와 직선의 교점을 찾기 위해 다른 교점들을 이용해 사차 다항식을 인수분해하는 능력을 평가한다(2022 보고서 문항카드 15 출제 의도 요약). [배점추정: 문항별 배점 미표기, 채점기준표 배점(각 5점, 합 20) 사용]
key_idea: |
  $L:y=mx$가 $a,b$에서 접하므로 $f(x)=mx-(x-a)^2(x-b)^2$로 두면 $c,d,e$가 모두 $(x-a)^2(x-b)^2$의 도함수·이계도함수·인수분해로 결정된다.
stuck: |
  두 점에서 접하는 직선 조건을 $f(x)-mx=-(x-a)^2(x-b)^2$로 바꾸는 것, 그리고 (iii)에서 이미 아는 근 $b$, $c$로 사차식을 나누는 것
idea_tags: [IDEA-DOUBLE-TANGENT-FACTOR, IDEA-INFLECTION-MAX-SLOPE, IDEA-KNOWN-ROOT-DIVISION]
tags: [사차함수, 이중접선, 이계도함수, 인수분해]
