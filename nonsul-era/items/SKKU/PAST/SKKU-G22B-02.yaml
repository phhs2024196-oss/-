stimuli:
- id: S1
  label: <제시문1>
  body: |
    함수 $f(x)$에서 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\le f(a)$일 때, 함수 $f(x)$는 $x=a$에서 극대라 하며, $f(a)$를 극댓값이라고 한다. 또한, $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\ge f(a)$일 때, 함수 $f(x)$는 $x=a$에서 극소라 하며, $f(a)$를 극솟값이라고 한다. 극댓값과 극솟값을 통틀어 극값이라고 한다.
- id: S2
  label: <제시문2>
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 함수 $F(x)$가 $f(x)$의 한 부정적분일 때 다음이 성립한다.
    $$\int_a^b f(x)dx=[F(x)]_a^b=F(b)-F(a)$$
- id: S3
  label: <제시문3>
  body: |
    임의의 실수 $a,b,c$에 대해, 함수 $g(x)$와 $h(x)$의 그래프는 $y=|x|$의 그래프를 $x$축의 방향으로 각각 $a$와 $b$만큼 평행이동한 것이라 하고, 함수 $u(x)$의 그래프는 $y=-|x|$의 그래프를 $y$축의 방향으로 $c$만큼 평행이동한 것이라 하자.

stem: null   # 원문에 공통 발문 없음

subparts:
- id: '1'
  stem: |
    [수학 2-ⅰ] <제시문3>에서 $a=1$이고 $c<0$이라고 가정하자. 두 함수 $y=2x(x-2)g(x)$와 $y=u(x-1)$의 그래프가 서로 다른 두 개의 교점을 가질 때, 두 그래프로 둘러싸인 부분의 넓이를 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'c = -sqrt(6)/9; area = 1/12', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x$축으로 $-1$ 평행이동하면 $y=2(x+1)(x-1)|x|$와 $y=-|x|+c$; $x\ge0$에서 기울기 $-1$인 접점 $x=\tfrac{\sqrt6}{6}$.
    steps:
    - {id: 1a, content: '$c=-\tfrac{\sqrt6}{9}$, 넓이 $2\int_0^{\sqrt6/6}\left(2(x^3-x)+x+\tfrac{\sqrt6}{9}\right)dx=\tfrac1{12}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 두 그래프는 어떤 직선에 대하여 대칭인가?
    - 교점이 딱 두 개가 되려면 두 그래프가 어떻게 만나야 하는가?
  - id: S1-B
    audience: B
    source_flow: 2022 보고서 문항카드 16 예시답안 p.220-221(인쇄 216-217)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        문제의 두 그래프를 $x$축의 방향으로 평행이동 시켜도 구하고자 하는 넓이의 값에는 변함이 없다. 두 그래프 $y=2x(x-2)g(x)$와 $y=u(x-1)$는 모두 직선 $x=1$에 대하여 대칭이므로, $x$축의 방향으로 $-1$만큼 평행이동시켜 얻을 수 있는 두 그래프 $y=2(x+1)(x-1)|x|$와 $y=-|x|+c$를 고려하자. 또한 대칭성에 의해 $x\ge0$인 경우만 살펴보면 된다. 이 경우, $y=2(x+1)(x-1)x=2(x^3-x)$, $(2(x^3-x))'=6x^2-2$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        방정식 $6x^2-2=-1$의 근은 이 구간에서 $x=\dfrac{\sqrt6}{6}$이고, 이때 함수 $2(x+1)(x-1)|x|$의 값은 $-\dfrac{5\sqrt6}{18}$이다. 즉, 함수 $y=-|x|+c$의 그래프가 점 $\left(\dfrac{\sqrt6}{6},-\dfrac{5\sqrt6}{18}\right)$을 지나야 하므로, 상수 $c$의 값은 $-\dfrac{\sqrt6}{9}$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        따라서, 구하고자 하는 넓이는
        $2\displaystyle\int_0^{\frac{\sqrt6}{6}}\left(2(x^3-x)+x+\dfrac{\sqrt6}{9}\right)dx=2\left[\dfrac12x^4-\dfrac12x^2+\dfrac{\sqrt6}{9}x\right]_0^{\frac{\sqrt6}{6}}=2\left(\dfrac1{72}-\dfrac1{12}+\dfrac19\right)=\dfrac1{12}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        $c=-\dfrac{\sqrt6}{9}$ 을 구한다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        넓이 $2\displaystyle\int_0^{\frac{\sqrt6}{6}}\left(2(x^3-x)+x+\dfrac{\sqrt6}{9}\right)dx=\dfrac1{12}$ 임을 보인다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [수학 2-ⅱ] <제시문3>에서 양의 실수 $a$에 대하여 함수 $y=(x-a)g(x)$의 역함수를 $y=w(x)$라고 하자. 두 곡선 $y=(x-a)g(x)$, $y=w(x)$ 및 직선 $y=-x$로 둘러싸인 부분의 넓이를 $S(a)$라고 할 때, $\displaystyle\sum_{k=1}^{12}S(k)$의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'S(k) = 2*k**2+2*k+1/3; sum = 1460', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 영역은 $y=x$에 대칭이므로 곡선, $y=x$, $y=-x$로 둘러싸인 넓이의 2배이고, 교점 $t_1,t_2$는 $(x-a)^2=x$의 두 근.
    steps:
    - {id: 2a, content: '$S(a)=2\left(a^2+a+\tfrac16\right)$, $\sum_{k=1}^{12}S(k)=1460$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - 함수와 그 역함수의 그래프는 어떤 직선에 대하여 대칭인가?
    - 곡선이 $y=x$, $y=-x$와 만나는 점의 $x$좌표는 같은 이차방정식의 두 근이다.
  - id: S2-B
    audience: B
    source_flow: 2022 보고서 문항카드 16 예시답안 p.221(인쇄 217)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문제에서 넓이를 구하고자 하는 부분은 직선 $y=x$에 대해 대칭이므로, 곡선 $y=(x-a)g(x)$ 및 두 직선 $y=x$와 $y=-x$로 둘러싸인 부분의 넓이의 두배가 구하고자 하는 넓이이다.
        곡선 $y=(x-a)g(x)$와 직선 $y=x$의 교점의 $x$좌표 $t_2$는, 방정식 $(x-a)^2=x$의 근이고, 곡선 $y=(x-a)g(x)$와 직선 $y=-x$의 교점의 $x$좌표 $t_1$은, 방정식 $-(x-a)^2=-x$의 근이다. 따라서, $t_1+t_2=2a+1$과 $t_1t_2=a^2$이 성립한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이때, 곡선 $y=(x-a)g(x)$ 및 두 직선 $y=x$와 $y=-x$로 둘러싸인 부분의 넓이는
        $\dfrac12t_1^2+\dfrac12t_2^2+\displaystyle\int_{t_1}^a(x-a)^2dx-\int_a^{t_2}(x-a)^2dx$
        와 같고, 이를 정리하면
        $\dfrac12(t_1^2+t_2^2)+\dfrac23a^3-(t_1+t_2)a^2+(t_1^2+t_2^2)a-\dfrac13(t_1^3+t_2^3)=a^2+a+\dfrac16$
        를 얻게 된다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        따라서, $S(k)=2k^2+2k+\dfrac13$이고, $\displaystyle\sum_{k=1}^{12}S(k)=\dfrac{12\times13\times25}{3}+12\times13+4=1460$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        $S(k)=2k^2+2k+\dfrac13$ 임을 보인다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $\displaystyle\sum_{k=1}^{12}S(k)=1460$ 임을 보인다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [수학 2-ⅲ] <제시문3>에서 고정된 실수 $a$에 대해
    $$\int_0^b(x-a)^2g(x)\,dx=\int_0^a(x-b)^2h(x)\,dx$$
    가 성립할 때, 가능한 모든 $b$의 값의 곱을 $a$에 관한 식으로 나타내고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'a**3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a>0$, $a<b$이면 $a^4+(a-b)^4=-(a-b)^4+b^4$; $t=a/b$로 $(t-1)(3t^3-5t^2+7t-1)=0$, 유일한 근 $t_0\in(0,1)$.
    steps:
    - {id: 3a, content: '$b\in\{t_0a,\ a,\ a/t_0\}$, 곱 $=a^3$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - $b=a$는 항상 해이다. $b>a$, $0<b<a$, $b\le0$으로 나누어 보라.
    - 등식을 $a/b$만의 식으로 바꾸어 보라.
  - id: S3-B
    audience: B
    source_flow: 2022 보고서 문항카드 16 예시답안 p.221-222(인쇄 217-218)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        먼저 $a=b$일 때는, 문제의 등식이 항상 성립한다. 그리고 $a=0$일 때, $\displaystyle\int_0^bx^2|x|dx=0$이므로 $b=0$이다.
        먼저 $a>0$을 가정하자. 만약 $a<b$라면, 문제의 등식에서
        $\displaystyle\int_0^b(x-a)^2|x-a|dx=\int_0^a-(x-a)^3dx+\int_a^b(x-a)^3dx=\dfrac14a^4+\dfrac14(b-a)^4$와
        $\displaystyle\int_0^a(x-b)^2|x-b|dx=\int_0^a-(x-b)^3dx=\dfrac14b^4-\dfrac14(a-b)^4$
        이 성립하므로, $a^4+(a-b)^4=-(a-b)^4+b^4$을 얻게 된다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $0<t=\dfrac ab<1$로 치환하면, 다음 방정식 $3t^4-8t^3+12t^2-8t+1=(t-1)(3t^3-5t^2+7t-1)=0$을 얻게 된다. 함수 $p(t)=3t^3-5t^2+7t-1$에 대하여 $p'(t)=9t^2-10t+7>0$[판독확인: 원문 인쇄는 "$p'(t)=27t^2-10t+7>0$" — 계산상 $9t^2-10t+7$이 맞음, 결론($>0$)은 동일]와 $p(0)=-1$, $p(1)=4$
        이 성립하므로, 다항식 $p(t)=0$은 열린구간 $(0,1)$에서 유일한 실근 $t_0$을 갖는다. 즉, $b=\dfrac1{t_0}a$이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $0<b<a$임을 가정하면, $a$와 $b$의 역할을 바꾼 뒤, 위의 논리를 적용하면 $a=\dfrac1{t_0}b$를 얻게 된다. 즉, $a=t_0b$이다. $b\le0$임을 가정하면, $\displaystyle\int_0^b(x-a)^2|x-a|dx\le0$인 반면, $\displaystyle\int_0^a(x-b)^2|x-b|dx>0$이므로, 식이 성립하지 않는다. 따라서, 주어진 $a$에 대해 등식을 만족하는 $b$는 $t_0a,\ a,\ \dfrac1{t_0}a$로 세 개가 존재하고, 이들의 곱은 $a^3$이다.
        마지막으로, $a<0$인 경우도 대칭성에 의해 $a>0$인 경우와 같이 $a^3$을 얻게 된다.
      criteria: ['3.A1']
