intent: |
  다항함수와 절댓값이 적용된 함수를 통해 표현되는 여러 함수의 성질을 이해하고, 미분·적분과 관련한 다양한 성질을 적절하게 적용할 수 있는지 평가한다. 절댓값이 적용된 함수를 이해하기 위해 정의역을 나누어 조직적으로 사고하는 능력, 다항함수의 실근의 존재성을 이해하기 위해 도함수로 증감을 파악하는 능력, 자연수의 거듭제곱의 합을 계산하는 능력을 본다(2022 보고서 문항카드 16 출제 의도 요약). [배점추정: 문항별 배점 미표기, 채점기준표 배점 사용]
key_idea: |
  (i) 대칭축 $x=1$을 이용해 평행이동 후 $x\ge0$만 보고, 두 그래프가 접할 때(기울기 $-1$) 교점이 2개. (ii) 영역이 $y=x$에 대칭이므로 곡선과 $y=x$, $y=-x$로 둘러싸인 넓이의 2배. (iii) 경우를 나누어 적분을 계산하고 $t=a/b$로 치환한 사차방정식을 $(t-1)$로 인수분해.
stuck: |
  (i)에서 교점이 정확히 2개라는 조건을 접할 조건으로 읽는 것, (iii)에서 $b$의 위치($b>a$, $0<b<a$, $b\le0$)에 따라 절댓값을 풀고 비율 $t=a/b$로 바꾸는 것
