stimuli:
- id: S1
  label: <제시문1>
  body: |
    (i) $f(x),g(x),h(x)$는 이차함수이다.
    (ii) $f(x),g(x)$는 $f(0)=f(1)=g(2)=0$와 $f''(0)=-2$를 만족한다.
    (iii) $F(x)$는 다음과 같이 정의되는 함수이다.
    $$F(x)=\begin{cases}f(x) & (x\le1)\\ g(x) & (1<x\le2)\\ h(x) & (x>2)\end{cases}$$
    (iv) $F(x)$는 모든 실수에서 미분가능하며 최댓값이 2이다.
- id: S2
  label: <제시문2>
  body: |
    정의역이 음이 아닌 실수의 집합인 함수 $k(x)$를 다음과 같이 정의한다.
    음이 아닌 실수 $x$에 대하여 $k(x)$는 두 점 $(-1,0)$과 $(x,F(x))$을 지나는 직선의 기울기이다.
    (단, $F(x)$는 <제시문1>에서 정의된 함수이다.)

stem: |
  다음 <제시문1>~<제시문2>를 읽고 [수학 1-ⅰ]~[수학 1-ⅲ]을 문항별로 풀이와 함께 답하시오.

subparts:
- id: '1'
  stem: |
    [수학 1-ⅰ] <제시문1>에서 정의된 함수 $F(x)$의 식을 찾고 그 이유를 논하시오.
  points: 9
  depends_on: []
  answer: {kind: expression, value: 'f = -x**2+x; g = x**2-3*x+2; h = -x**2/8+3*x/2-5/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f=-x(x-1)$, $g=a(x-1)(x-2)$에서 $x=1$ 미분가능으로 $a=1$, 최댓값 2는 $h$가 가지므로 $h=2-b(x-c)^2$에서 $x=2$ 연결 조건.
    steps:
    - {id: 1a, content: '$f(x)=-x^2+x$, $g(x)=x^2-3x+2$, $h(x)=-\tfrac18x^2+\tfrac32x-\tfrac52$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $f$의 최댓값은 $\tfrac14$이고, $1<x\le2$에서 $g\le0$이다. 그러면 최댓값 2는 어디서 나오는가?
  - id: S1-B
    audience: B
    source_flow: 2022 보고서 문항카드 20 예시답안 p.252-253(인쇄 248-249)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)$는 최고차항의 계수가 $f''(0)/2=-1$이고 두 근 $0,1$을 가지므로 $f(x)=-x(x-1)=-x^2+x$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $g(x)=0$는 두 근 $1,2$를 가지므로 어떤 실수 $a$에 대해 $g(x)=a(x-1)(x-2)$라 쓸 수 있다. $F(x)$가 $x=1$에서 미분 가능하므로 $f'(1)=-1$와 $g'(1)=-a$의 값이 같고 따라서 $a=1$, 즉 $g(x)=(x-1)(x-2)=x^2-3x+2$이 된다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $f(x)$의 최댓값은 $1/4$이고 $1<x\le2$일 때 $g(x)\le0$이므로 $F(x)$의 최댓값 2는 $h(x)$의 최댓값과 같아야 한다. $h(x)$이 $x=c$에서 최댓값을 갖는다고 하면 어떤 실수 $b$에 대해 $h(x)=2-b(x-c)^2$로 쓸 수 있다. $F(x)$가 $x=2$에서 미분 가능하므로 $h(2)=2-b(2-c)^2=g(2)=0$이고 $h'(2)=-2b(2-c)=g'(2)=1$을 만족한다. 두 식을 풀면 $c=6$과 $b=1/8$을 얻는다. 따라서 $h(x)=-\dfrac18x^2+\dfrac32x-\dfrac52$이다.
        [그림: $y=F(x)$의 그래프($-1\le x\le7$; $x=0.5$ 근처 극대 $\tfrac14$, $x=1.5$ 근처 극소, $x=6$에서 최댓값 2)와 점 $(-1,0)$에서 그은 세 접선(빨간색)]
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f(x)=-x^2+x$
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $g(x)=x^2-3x+2$
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $h(x)=-\dfrac18x^2+\dfrac32x-\dfrac52$
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [수학 1-ⅱ] <제시문1>에서 정의된 함수 $F(x)$에 대하여 점 $(-1,0)$에서 $y=F(x)$에 접선을 그을 때 가능한 접점의 $x$좌표들 중 양수인 것을 모두 구하고 그 이유를 논하시오.
  points: 9
  depends_on: ['1']
  answer: {kind: set, value: '{sqrt(2)-1, sqrt(6)-1, sqrt(33)-1}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 각 이차함수 조각에서 $0=p'(t)(-1-t)+p(t)$를 풀고 해당 구간에 드는 근만 남긴다.
    steps:
    - {id: 2a, content: '$t=\sqrt2-1$ ($f$), $\sqrt6-1$ ($g$), $\sqrt{33}-1$ ($h$)', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 접점 $t$에서의 접선이 $(-1,0)$을 지날 조건을 식으로 쓰라.
    - 구한 $t$가 그 조각의 정의 구간에 있는지 확인하라.
  - id: S2-B
    audience: B
    source_flow: 2022 보고서 문항카드 20 예시답안 p.253(인쇄 249)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        이차 함수 $p(x)=Ax^2+Bx+C$이 있을 때 $y=p(x)$의 $x=t$에서의 접선의 식은 $y=p'(t)(x-t)+p(t)$이다. 이 접선이 $(-1,0)$을 지난다면 $t$는 $0=p'(t)(-1-t)+p(t)$을 만족한다. 이 식에 $p(t)=At^2+Bt+C$와 $p'(t)=2At+B$을 대입하여 얻어진 $t$에 관한 이차식을 풀면 $t=\dfrac{A\pm\sqrt{A^2+A(C-B)}}{-A}$을 얻는다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        문제로 돌아가서 $(-1,0)$에서 $y=F(x)$에 그은 접선은 이 점에서 $y=f(x)$, $y=g(x)$, $y=h(x)$에 그은 접선 중 하나가 된다. 접점의 $x$좌표를 $t$라고 할 때 $0<t\le1$인 것은 $y=f(x)$에 그은 접선에서 얻어지므로 위에서 구한 식을 이용하면 $t=\sqrt2-1$을 얻는다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        $1<t\le2$인 것은 $y=g(x)$에 그은 접선에서 얻어지므로 $t=\sqrt6-1$이고
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        $t>2$인 것은 $y=h(x)$에 그은 접선에서 얻어지므로 $t=\sqrt{33}-1$이 된다. 따라서 문제의 조건을 만족하는 $x$좌표의 값은 $\sqrt2-1,\ \sqrt6-1,\ \sqrt{33}-1$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $\sqrt2-1$
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 3}
      steps: [2b-1, 2b-2]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $\sqrt6-1$
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M2], max_points: 3}
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\sqrt{33}-1$
      depends_on: [2.M1]
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [수학 1-ⅲ] 한 개의 주사위를 세 번 던져서 나온 수를 차례로 $a,b,c$라 하자. 이때 함수 $G(x)$를 다음과 같이 정의하자.
    $$G(x)=\begin{cases}a-|x-a| & (x\le2a)\\ b-|x-2a-b| & (2a<x\le2a+2b)\\ c-|x-2a-2b-c| & (x>2a+2b)\end{cases}$$
    <제시문2>에서 정의된 함수 $k(x)$에 대하여, 합성함수 $(k\circ G)(x)$가 열린구간 $(0,2a+2b+2c)$에서 9개의 극댓값을 갖게 되는 순서쌍 $(a,b,c)$의 개수를 구하시오. (단, 주사위는 각 면에 1부터 6까지의 자연수가 하나씩 적힌 정육면체이다.)
  points: 12
  depends_on: ['2']
  answer: {kind: value, value: '63', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $k$는 $[0,\sqrt2-1]$ 증가, $[\sqrt2-1,\sqrt6-1]$ 감소, $[\sqrt6-1,\sqrt{33}-1]$ 증가, $[\sqrt{33}-1,\infty)$ 감소. 높이 $d$인 산의 기여 $m(1)=2$, $m(2)=m(3)=m(4)=3$, $m(5)=m(6)=4$.
    steps:
    - {id: 3a, content: '$m(a)+m(b)+m(c)=9$: $(3,3,3)$이 $3^3=27$가지, $(2,3,4)$의 순열이 $1\cdot3\cdot2\cdot3!=36$가지, 합 $63$', criteria: ['3.M1', '3.M2', '3.A1', '3.A2']}
    hint_ladder:
    - $k'(x)=0$인 점은 (ii)에서 구한 접점과 어떤 관계인가?
    - $G$가 $0$에서 $d$까지 올라갔다 내려올 때 $k(G(x))$의 극댓값은 몇 번 생기는가?
  - id: S3-B
    audience: B
    source_flow: 2022 보고서 문항카드 20 예시답안 p.253-254(인쇄 249-250)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        [수학 1-ⅱ]에서 구한 결과로부터 $k(x)$는 구간 $[0,\sqrt2-1]$에서 증가, 구간 $[\sqrt2-1,\sqrt6-1]$에서 감소, 구간 $[\sqrt6-1,\sqrt{33}-1]$에서 증가, 구간 $[\sqrt{33}-1,\infty)$에서 감소한다. 따라서 $k(x)$는 $x=\sqrt2-1$와 $x=\sqrt{33}-1$일 때 극댓값을 가진다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        또한 $y=G(x)$는 구간 $[0,2a+2b+2c]$에서 아래와 같이 그려지므로 함수 $G(x)$는 $x$가 $0$에서 $2a+2b+2c$까지 변할 때, 함숫값이 연속적으로 $0$에서 $a$까지 증가, $a$에서 $0$까지 감소, $0$에서 $b$까지 증가, $b$에서 $0$까지 감소, $0$에서 $c$까지 증가, $c$에서 $0$까지 감소한다.
        [그림: $y=G(x)$의 그래프 — 꼭짓점이 $x=a,\ 2a+b,\ 2a+2b+c$인 세 개의 삼각형(높이 $a,b,c$) 모양 꺾은선으로, $x=0,\ 2a,\ 2a+2b,\ 2a+2b+2c$에서 $0$]
        1에서 6까지의 정수 $d$에 대해 $G(x)$의 값이 $0$에서 $d$까지 증가하고 $d$에서 $0$까지 감소할 때 나타나는 $k(G(x))$의 극댓값의 개수를 $m(d)$라 하자. 위에서 구한 $k(x)$의 성질에 의해 $k(G(x))$가 극댓값을 가지려면 $G(x)=\sqrt2-1$, $G(x)=\sqrt{33}-1$, 이거나 $G(x)=d$이고 $d$가 함수 $k(x)$가 증가하는 구간인 $[0,\sqrt2-1]$ 또는 $[\sqrt6-1,\sqrt{33}-1]$에 속해야 한다. (단, $d\ge1$이므로 구간 $[0,\sqrt2-1]$은 생략해도 무방하다.) 또한 $0<\sqrt2-1<1$, $1<\sqrt6-1<2$, $4<\sqrt{33}-1<5$이므로 이를 종합하면 $m(1)=2$, $m(2)=m(3)=m(4)=3$, $m(5)=m(6)=4$임을 알 수 있다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        예를 들면 $d=3$인 경우 $G(x)$의 값이 $0$에서 $3$까지 증가할 때 $G(x)=\sqrt2-1$이 한번 성립하므로 $k(G(x))$의 극댓값이 한개 생기고, $G(x)=3$의 값이 구간 $[\sqrt6-1,\sqrt{33}-1]$에 속하므로 $k(G(x))$의 극댓값이 한개 생기고, $G(x)$의 값이 $3$에서 $0$까지 감소할 때 $G(x)=\sqrt2-1$이 한번 성립하므로 $k(G(x))$의 극댓값이 한개 생겨서 $m(3)=3$이 된다.
        문제에서 주어진 조건은 $m(a)+m(b)+m(c)=9$가 되고 이를 만족하려면 $m(a),m(b),m(c)$가 $3,3,3$이거나 $2,3,4$의 순열이 되어야 한다. $m(a),m(b),m(c)$가 $3,3,3$인 경우는 $a,b,c$가 각각 $2,3,4$ 중 하나가 될 수 있으므로 $3^3=27$ 가지가 있다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        $m(a),m(b),m(c)$가 $2,3,4$의 순열인 경우는 $a,b,c$가 $1$ 한 개와 $2,3,4$중에 한 개, $5,6$중에 한 개를 골라 배열하여 얻어지는 것이므로 $1\cdot3\cdot2\cdot3!=36$가지가 있다. 따라서 총 경우의 수는 $27+36=63$이다.
      criteria: ['3.A2']
