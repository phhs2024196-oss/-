intent: |
  도함수를 이용해 함수의 증가·감소를 판별하는 것은 미분의 기초적이지만 중요한 응용이다. 구간별로 정의된 함수의 미분가능성을 통해 구간별 함수의 식을 찾아내는 능력과 미분을 이용한 함수의 최대·최소를 구할 수 있는지 평가하고, 합성함수의 극값을 찾는 능력과 주어진 조건을 만족하는 대상의 경우의 수를 구할 수 있는지 평가한다(2022 보고서 문항카드 20 출제 의도 요약). [배점추정: 문항별 배점 미표기, 채점기준표 배점 사용]
key_idea: |
  $k(x)$는 $(-1,0)$을 지나는 직선의 기울기이므로, $(-1,0)$에서 그은 접선의 접점에서 $k$의 증감이 바뀐다. $G$는 높이 $a,b,c$인 세 개의 '산' 모양이므로 각 산(높이 $d$)이 만드는 $k\circ G$의 극댓값 개수 $m(d)$를 세어 합이 9인 경우를 센다.
stuck: |
  $k'(x)=0$이 "$(-1,0)$에서 그은 접선의 접점"과 같다는 해석, 그리고 산의 꼭대기 값 $d$가 $k$의 증가 구간에 있으면 꼭대기에서도 극댓값이 생긴다는 점
idea_tags: [IDEA-SLOPE-FROM-FIXED-POINT, IDEA-COMPOSITE-MONOTONE-PIECES, IDEA-COUNT-BY-CONTRIBUTION]
