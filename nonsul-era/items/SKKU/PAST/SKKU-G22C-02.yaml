stimuli:
- id: S1
  label: <제시문>
  body: |
    이차함수 $f(x)=ax^2+bx+c$가 다음의 조건들을 만족한다.
    (i) $a$는 $0$이 아닌 정수이고, $b$와 $c$는 모두 정수이다.
    (ii) $b^2-4ac=1$

stem: null   # 원문에 공통 발문 없음

subparts:
- id: '1'
  stem: |
    [수학 2-ⅰ] 1보다 큰 자연수 $N$에 대하여, <제시문>에 주어진 이차함수 $f(x)$가 두 조건 $f(0)<0$와 $f(N)>0$를 동시에 만족할 수 있는지에 대하여 논하시오.
  points: 5
  depends_on: []
  answer: {kind: proof, value: '동시에 만족할 수 없다', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a>0$이면 $1=b^2+4a|c|\ge4$ 모순, $a<0$이면 $N$이 두 근 $\frac{-b\pm1}{2a}$ 사이에 있어 $-b=2Na$, 판별식 짝수 모순.
    steps:
    - {id: 1a, content: '$-b-1<2Na<-b+1\Rightarrow -b=2Na\Rightarrow b^2-4ac$ 짝수', criteria: ['1.R1', '1.R2']}
    hint_ladder:
    - $f(0)=c<0$이다. $a>0$이면 판별식은 얼마 이상인가?
    - 판별식이 1이면 두 근 사이의 거리는 얼마인가?
  - id: S1-B
    audience: B
    source_flow: 2022 보고서 문항카드 21 예시답안 p.257(인쇄 253)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(0)=c$이므로, $f(0)<0$이라는 조건은 $c<0$이라는 조건과 같다.
        $a>0$인 경우, $1=b^2-4ac=b^2+4a|c|\ge4$이므로 모순이 된다.
      criteria: ['1.R1']
    - id: 1b-2
      content: |
        $a<0$인 경우, 이차함수 $f(x)$의 그래프는 아래로 오목하므로, $f(N)>0$라는 조건을 만족할 때, $N$은 이차함수 $f(x)$의 두 근 사이에 놓여있게 된다. 근의 공식과 판별식 $b^2-4ac=1$이라는 조건으로부터, 이차함수 $f(x)$의 두 근은 $\dfrac{-b\pm1}{2a}$로 주어지게 되므로, 다음의 부등식이 성립하게 된다.
        $$\dfrac{-b+1}{2a}<N<\dfrac{-b-1}{2a}$$
        위 부등식에 $2a$를 곱하면, 우리는 다음의 부등식을 얻는다. $-b-1<2Na<-b+1$
        따라서 $a<0$인 경우, $-b=2Na$가 되어 $b^2-4ac$는 짝수가 되므로, $b^2-4ac=1$이라는 조건에 모순이 된다.
        그러므로, 이차함수 $f(x)$는 두 조건 $f(0)<0$과 $f(N)>0$을 동시에 만족할 수 없다.
      criteria: ['1.R2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: |
        $a>0$인 경우, $1=b^2-4ac=b^2+4a|c|\ge4$이므로 모순임을 보인다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R2
      mark_type: R
      points: 3
      evidence: |
        $a<0$인 경우, $-b=2Na$가 되어 $b^2-4ac$는 짝수가 되어 모순임을 보인다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [수학 2-ⅱ] 1보다 큰 자연수 $N$과 <제시문>에 주어진 이차함수 $f(x)$에 대하여, $a<0$이고 $f\left(\dfrac1N\right)>0$일 때, 가능한 이차함수 $f(x)$를 모두 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'f(x) = -r*x**2+x, r in 1..N-1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(x)=cx^2+bx+a$는 $g(0)=a<0$, $g(N)>0$이므로 $c\ne0$이면 (i)에 모순 → $c=0$, $b=\pm1$, $f(1/N)>0$에서 $b=1$, $-a\le N-1$.
    steps:
    - {id: 2a, content: '$f(x)=-rx^2+x$ ($1\le r\le N-1$인 정수)', criteria: ['2.R1', '2.A1']}
    hint_ladder:
    - $f(1/N)>0$의 양변에 $N^2$을 곱해 보라. 어떤 이차함수의 $N$에서의 값이 되는가?
  - id: S2-B
    audience: B
    source_flow: 2022 보고서 문항카드 21 예시답안 p.257-258(인쇄 253-254)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        주어진 조건으로부터, $f\left(\dfrac1N\right)=a\left(\dfrac1N\right)^2+b\left(\dfrac1N\right)+c>0$이므로, 양변에 $N^2$을 곱하면, 다음의 부등식을 얻는다. $cN^2+bN+a>0$
        $c$가 $0$이 아닌 정수인 경우에, 이차함수 $g(x)$를 $g(x)=cx^2+bx+a$라고 정의하면, 주어진 조건들로부터 이차함수 $g(x)$는 두 조건 $g(0)<0$와 $g(N)>0$를 동시에 만족하게 된다. 따라서 문제 [수학2-ⅰ]의 풀이에 있는 결과로부터, 그러한 이차함수 $g(x)$는 존재하지 않는다. 따라서 $c=0$이 됨을 알 수 있다.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        이제 $c=0$이 되므로, $b^2-4ac=1$이라는 조건으로부터, $b=\pm1$을 얻는다. 이제 조건 $f\left(\dfrac1N\right)>0$로부터 다음의 부등식을 얻게 된다.
        $$f\left(\dfrac1N\right)=a\left(\dfrac1N\right)^2+b\left(\dfrac1N\right)+c=a\left(\dfrac1N\right)^2\pm\left(\dfrac1N\right)=\dfrac{a\pm N}{N^2}>0$$
        $a$는 음의 정수이므로, $b=-1$인 경우, 위 부등식이 만족되지 않으므로, $b=1$이 되어야한다. 이 경우에 $a=-1$부터 $a=-(N-1)$ 까지의 음의 정수에 대하여, 위 부등식이 성립하게 된다. 따라서 구하는 이차함수 $f(x)$의 형태는 다음과 같다.
        $f(x)=-rx^2+x$ (단, $1\le r\le N-1$인 정수)
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 5
      evidence: |
        $c=0$ 이 되어야함을 [수학2-ⅰ]의 결과를 이용하여 논리적으로 설명한다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $f(x)=-rx^2+x$ (단, $1\le r\le N-1$인 정수) 임을 보인다.
      depends_on: [2.R1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [수학 2-ⅲ] 1보다 큰 홀수 $M$과 <제시문>에 주어진 이차함수 $f(x)$에 대하여 $f(0)<0$이고 $f\left(\dfrac2M\right)>0$일 때, 가능한 이차함수 $f(x)$를 모두 구하고, 그 이유를 논하시오.
  points: 7
  depends_on: ['2']
  answer: {kind: expression, value: '(1-M**2)/4*x**2+M*x-1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h(x)=cx^2+bx+a$에서 $h(M/2)>0$; $k(x)=h\left(x+\frac{M-1}{2}\right)$은 (ii)의 $N=2$ 조건을 만족하므로 $k(x)=-x^2+x$.
    steps:
    - {id: 3a, content: '$f(x)=\left(\tfrac{1-M^2}{4}\right)x^2+Mx-1$', criteria: ['3.B1']}
    hint_ladder:
    - $f(2/M)>0$의 양변에 $(M/2)^2$을 곱하라.
    - $M/2$를 $\tfrac12$로 옮기는 평행이동은?
  - id: S3-B
    audience: B
    source_flow: 2022 보고서 문항카드 21 예시답안 p.258(인쇄 254)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        주어진 조건으로부터, $c<0$이고, $f\left(\dfrac2M\right)=a\left(\dfrac2M\right)^2+b\left(\dfrac2M\right)+c>0$이므로, 양변에 $\left(\dfrac M2\right)^2$을 곱하면, 다음의 부등식을 얻는다. $c\left(\dfrac M2\right)^2+b\left(\dfrac M2\right)+a>0$
        이차함수 $h(x)$를 $h(x)=cx^2+bx+a$라고 정의하면, $h\left(\dfrac M2\right)>0$이다. 이제 이차함수 $k(x)$를 $h\left(x+\dfrac{M-1}{2}\right)$로 정의하면, $k(x)$의 최고차항은 음의 정수이고, 판별식은 1이며, $k\left(\dfrac12\right)>0$이 된다. 따라서 문제 [수학2-ⅱ]의 풀이에 있는 결과로부터, $k(x)=-x^2+x$가 된다. 따라서
        $h(x)=k\left(x-\left(\dfrac{M-1}{2}\right)\right)=-\left(x-\left(\dfrac{M-1}{2}\right)\right)^2+\left(x-\left(\dfrac{M-1}{2}\right)\right)=-x^2+Mx+\left(\dfrac{1-M^2}{4}\right)$이므로,
        $f(x)=\left(\dfrac{1-M^2}{4}\right)x^2+Mx-1$이 된다.
      criteria: ['3.B1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.B1
      mark_type: B
      points: 7
      evidence: |
        $f(x)=\left(\dfrac{1-M^2}{4}\right)x^2+Mx-1$ 임을 보인다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 7}
      steps: [3b-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    [수학 2-ⅳ] $N=100$일 때 [수학 2-ⅱ]에서 구한 이차함수 중 하나를 $Q(x)$라 하고, $M=19$일 때 [수학 2-ⅲ]에서 구한 이차함수 중 하나를 $R(x)$라 하자. 자연수 $n$에 대하여 $Q(n)$이 어떤 수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합과 같고, $R(n)$은 어떤 수열 $\{b_n\}$의 첫째항부터 제$n$항까지의 합과 같다고 하자. 이때 가능한 모든 수열 $\{a_n\}$과 수열 $\{b_n\}$에 대하여, $\displaystyle\sum_{n=1}^{10}|a_n-b_n|$의 최솟값과 최댓값을 구하고, 그 이유를 논하시오.
  points: 8
  depends_on: ['2', '3']
  answer: {kind: expression, value: 'min = 81; max = 8721', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $a_1=1-r$, $a_n=-2rn+(r+1)$; $b_1=-72$, $b_n=-180n+109$. $S=|73-r|+\sum_{n=2}^{10}|(180-2r)n+(r-108)|$를 $r$로 경우 분류.
    steps:
