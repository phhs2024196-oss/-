intent: |
  이차함수의 판별식과 근과의 관계 등의 개념을 이해하고 적용할 수 있는지 평가한다. 이를 이차함수의 그래프의 평행이동 개념과 연결시킬 수 있는지, 이차함수의 자연수에서의 값과 연관된 수열(합과 일반항의 관계)을 다루는 문제와 관련지을 수 있는지 평가한다(2022 보고서 문항카드 21 출제 의도 요약). [배점추정: 문항별 배점 미표기, 채점기준표 배점 사용]
key_idea: |
  판별식이 1이므로 두 근이 $\dfrac{-b\pm1}{2a}$로 정확히 $\dfrac{1}{|a|}$만큼 떨어져 있다. (i) 정수 $N$이 두 근 사이에 끼면 $-b=2Na$가 되어 판별식이 짝수 — 모순. (ii)·(iii)은 $x\mapsto\frac1x$ 꼴의 계수 뒤집기($cx^2+bx+a$)와 평행이동으로 (i)에 귀착.
stuck: |
  $f(1/N)>0$을 $N^2$배하여 계수를 뒤집은 이차함수 $cx^2+bx+a$에 (i)을 적용하는 발상, (iii)에서 $x+\frac{M-1}{2}$ 평행이동으로 (ii)의 $N=2$ 경우로 옮기는 발상
idea_tags: [IDEA-DISCRIMINANT-PARITY, IDEA-COEFFICIENT-REVERSAL, IDEA-SHIFT-TO-KNOWN-CASE, IDEA-ABS-SUM-CASE-SPLIT]
tags: [이차함수, 판별식, 정수 계수, 귀류법, 수열의 합과 일반항]
