    steps:
    - id: 4b-1
      content: |
        문제 [수학2-ⅱ]의 풀이에 있는 결과로부터, $Q(x)=-rx^2+x$ (단, $1\le r\le99$인 정수)이므로, $a_1=Q(1)=-r+1$이 되고, 2 이상의 양의 정수 $n$에 대하여, $a_n=Q(n)-Q(n-1)=-2rn+(r+1)$을 얻는다. 한편, 문제 [수학2-ⅲ]의 풀이에 있는 결과로부터, $R(x)=-90x^2+19x-1$이므로, $b_1=R(1)=-72$가 되고, 2 이상의 양의 정수 $n$에 대하여, $b_n=R(n)-R(n-1)=-180n+109$를 얻는다. 이제 $S=\displaystyle\sum_{n=1}^{10}|a_n-b_n|$라고 놓으면,
        $S=|a_1-b_1|+\displaystyle\sum_{n=2}^{10}|a_n-b_n|=|73-r|+\sum_{n=2}^{10}|(180-2r)n+(r-108)|$과 같게 된다. 다음과 같이 $r$의 값에 대한 경우를 나누어 $S$의 최댓값과 최솟값을 살펴보자.
    - id: 4b-2
      content: |
        경우1: $91\le r\le99$. 이 경우, 양의 정수 $n$에 대하여, $(180-2r)n+(r-108)$의 값은 항상 음수가 된다. 따라서, $S=|73-r|-\displaystyle\sum_{n=2}^{10}((180-2r)n+(r-108))=100r-8821$이 되어, $279\le S\le1079$가 된다.
        경우2: $r=90$. $S=|73-r|+\displaystyle\sum_{n=2}^{10}|r-108|=17+18\times9=179$
        경우3: $r=89$. $S=16+\displaystyle\sum_{n=2}^{10}|2n-19|=16+\sum_{n=2}^{9}(19-2n)+1=81$
        경우4: $r=88$. $S=15+\displaystyle\sum_{n=2}^{10}|4n-20|=15+\sum_{n=2}^{4}(20-4n)+\sum_{n=5}^{10}(4n-20)=99$
        경우5: $r=87$. $S=14+\displaystyle\sum_{n=2}^{10}|6n-21|=14+\sum_{n=2}^{3}(21-6n)+\sum_{n=4}^{10}(6n-21)=173$
        경우6: $r=86$. $S=13+\displaystyle\sum_{n=2}^{10}|8n-22|=13+6+\sum_{n=3}^{10}(8n-22)=259$
        경우7: $r=85$. $S=12+\displaystyle\sum_{n=2}^{10}|10n-23|=12+3+\sum_{n=3}^{10}(10n-23)=351$
      criteria: ['4.B1']
    - id: 4b-3
      content: |
        경우8: $1\le r\le84$. 이 경우, 2이상의 정수 $n$에 대하여, $(180-2r)n+(r-108)$의 값은 항상 양수가 된다. 따라서,
        $S=|73-r|+\displaystyle\sum_{n=2}^{10}((180-2r)n+(r-108))=|73-r|+8748-99r=\begin{cases}-98r+8675, & 73\le r\le84\\ -100r+8821, & 1\le r\le72\end{cases}$이므로,
        $73\le r\le84$인 경우, $443\le S\le1521$이 되고, $1\le r\le72$인 경우, $1621\le S\le8721$이 된다.
        경우1부터 경우8까지를 종합하면, $S$의 최솟값은 81, 최댓값은 8721임을 알 수 있다.
      criteria: ['4.B2']
