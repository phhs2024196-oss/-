intent: |
  단위원과 곡선 $y=(x+1)^2$ 위의 점 $\mathrm{P}$에서의 접선을 좌표로 나타내고, 현의 길이·거리의 최소·곱의 최대 조건이 모두 "접선 $L\perp\mathrm{OP}$"라는 하나의 기하적 조건으로 귀결됨을 논증하는 능력을 본다(공식 출제 의도 자료 없음, 문제지로부터 요약). [배점추정] 소문항 배점이 문제지에 없어 10·10·10으로 균등 배분.
key_idea: |
  $\mathrm{P}(p,(p+1)^2)$로 두면 $\mathrm{OP}\perp L$은 $p+2(p+1)^3=0$이고, 이것이 $\overline{\mathrm{OP}}^2$의 도함수가 $0$인 조건과 같다. 또 $\overline{\mathrm{AP}}\times\overline{\mathrm{PB}}=1-\overline{\mathrm{OP}}^2$이다.
stuck: |
  (ⅲ)에서 $\overline{\mathrm{AP}}\times\overline{\mathrm{PB}}$를 계산하면 $1-\overline{\mathrm{OP}}^2$이 되어 (ⅱ)의 최소 문제로 바뀐다는 관찰
