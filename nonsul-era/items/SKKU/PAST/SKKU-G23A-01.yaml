stimuli:
- id: S1
  label: <제시문1>
  body: |
    좌표평면 위의 두 점 $\mathrm{A}(x_1,y_1)$, $\mathrm{B}(x_2,y_2)$ 사이의 거리는 다음과 같다.
    $$\overline{\mathrm{AB}}=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$$
- id: S2
  label: <제시문2>
  body: |
    중심의 좌표가 $(a,b)$이고 반지름의 길이가 $r$인 원의 방정식은 다음과 같다.
    $$(x-a)^2+(y-b)^2=r^2$$
- id: S3
  label: <제시문3>
  body: |
    두 직선 $y=mx+n$, $y=m'x+n'$에서 $mm'=-1$이면 두 직선은 서로 수직이다.
- id: S4
  label: <제시문4>
  body: |
    원점을 중심으로 하고 반지름의 길이가 1인 원을 $C$라 한다. $-1<x<0$에서 정의된 곡선 $y=(x+1)^2$ 위의 점 $\mathrm{P}$에서의 접선을 $L$이라 하자. 또한, 점 $\mathrm{P}$를 지나고 $x$축에 평행한 직선이 원 $C$와 만나는 두 점 중, $x$좌표가 음수인 점을 $\mathrm{A}$, $x$좌표가 양수인 점을 $\mathrm{B}$라고 한다.

stem: |
  다음 <제시문1> ~ <제시문4>를 읽고 [문제 1-ⅰ] ~ [문제 1-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    [문제 1-ⅰ] <제시문4>에서 정의된 점 $\mathrm{P}$와 직선 $L$에 대해서, 원점 $\mathrm{O}$와 점 $\mathrm{P}$를 연결하는 직선의 기울기가 $-\dfrac12$일 때, 직선 $L$이 원 $C$와 만나는 두 점을 $\mathrm{E},\mathrm{F}$라 하자. $\overline{\mathrm{EF}}^2$을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '23/8', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\dfrac{(p+1)^2}{p}=-\dfrac12$에서 $p=-\dfrac12$, $L:y=x+\dfrac34$, 원점과의 거리 $d$로 $\overline{\mathrm{EF}}^2=4(1-d^2)$.
    steps:
    - {id: 1a, content: '$p=-\tfrac12$, $L:y=x+\tfrac34$, $d^2=\tfrac{9}{32}$, $\overline{\mathrm{EF}}^2=4\left(1-\tfrac{9}{32}\right)=\tfrac{23}{8}$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 점 $\mathrm{P}$를 $(p,(p+1)^2)$로 두고 기울기 조건을 식으로 써 보자.
    - 원의 중심에서 현까지의 거리를 알면 현의 길이를 구할 수 있다.
  - id: S1-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{P}(p,(p+1)^2)$ $(-1<p<0)$라 하면 직선 $\mathrm{OP}$의 기울기는 $\dfrac{(p+1)^2}{p}=-\dfrac12$이므로 $2p^2+5p+2=0$, $(2p+1)(p+2)=0$이고 $-1<p<0$에서 $p=-\dfrac12$, $\mathrm{P}\left(-\dfrac12,\dfrac14\right)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $y'=2(x+1)$이므로 $L$의 기울기는 $1$이고 $L:y=x+\dfrac34$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        원점에서 $L$까지의 거리는 $d=\dfrac{3/4}{\sqrt2}$, $d^2=\dfrac{9}{32}<1$이므로 $L$은 원과 두 점에서 만나고, 현 $\mathrm{EF}$의 중점을 $\mathrm{M}$이라 하면 $\mathrm{OM}\perp\mathrm{EF}$이므로 $\overline{\mathrm{EF}}^2=4(1-d^2)$.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $\overline{\mathrm{EF}}^2=4\left(1-\dfrac{9}{32}\right)=\dfrac{23}{8}$. (또는 $x^2+(x+\tfrac34)^2=1$의 두 근 $x_1,x_2$에 대해 $\overline{\mathrm{EF}}^2=2(x_1-x_2)^2=2\left(\tfrac{9}{16}+\tfrac{7}{4}\right)=\tfrac{23}{8}$.)
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        기울기 조건으로 $p=-\dfrac12$를 구했다($p=-2$는 범위 밖으로 제외).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        접선 $L:y=x+\dfrac34$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        중심과 현 사이 거리(또는 연립 후 근과 계수의 관계)로 현의 길이를 계산하는 식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $\overline{\mathrm{EF}}^2=\dfrac{23}{8}$을 얻었다.
      depends_on: [1.M2, 1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 1-ⅱ] <제시문4>에서 정의된 점 $\mathrm{P}$와 직선 $L$에 대해서, $\overline{\mathrm{OP}}$가 최소가 될 때 직선 $L$과 선분 $\mathrm{OP}$가 수직임을 보이고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: 'D(p)=p^2+(p+1)^4 의 최소점은 D''(p)=2p+4(p+1)^3=0 의 (-1,0) 내 유일근이고, 이 식은 OP·(L의 방향벡터)=p+2(p+1)^3=0, 즉 OP⊥L 과 같다', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $D(p)=\overline{\mathrm{OP}}^2=p^2+(p+1)^4$의 임계 조건 $p+2(p+1)^3=0$이 곧 기울기 곱 $\dfrac{(p+1)^2}{p}\cdot2(p+1)=-1$이다.
    steps:
    - {id: 2a, content: '$D''(p)=2p+4(p+1)^3$, $D''''>0$이므로 최소점은 유일한 임계점이고 거기서 $\tfrac{(p+1)^2}{p}\cdot 2(p+1)=-1$', criteria: ['2.M1', '2.R1', '2.A1']}
    hint_ladder:
    - $\overline{\mathrm{OP}}^2$을 $p$의 함수로 나타내 미분해 보자.
    - 직선 $\mathrm{OP}$와 $L$의 기울기의 곱을 계산해 임계 조건과 비교해 보자.
  - id: S2-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\mathrm{P}(p,(p+1)^2)$ $(-1<p<0)$에 대해 $D(p)=\overline{\mathrm{OP}}^2=p^2+(p+1)^4$이고, $\overline{\mathrm{OP}}$가 최소인 것은 $D$가 최소인 것과 같다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $D'(p)=2p+4(p+1)^3$, $D''(p)=2+12(p+1)^2>0$이므로 $D'$은 증가한다. $D'(-1)=-2<0$, $D'(0)=4>0$이므로 $D'(p_0)=0$인 $p_0\in(-1,0)$이 유일하게 존재하고, $D$는 $p_0$에서 감소에서 증가로 바뀌어 최소가 된다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        $p_0$에서 $p_0+2(p_0+1)^3=0$, 즉 $2(p_0+1)^3=-p_0$. 직선 $\mathrm{OP}$의 기울기 $m=\dfrac{(p_0+1)^2}{p_0}$, $L$의 기울기 $m'=2(p_0+1)$에 대해 $mm'=\dfrac{2(p_0+1)^3}{p_0}=-1$이므로 <제시문3>에 의해 $L\perp\mathrm{OP}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $\overline{\mathrm{OP}}^2=p^2+(p+1)^4$로 놓고 미분했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        최소가 $D'(p)=0$인 내부 점에서 생김을 근거(증감, $D''>0$ 또는 부호 변화)로 밝혔다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        임계 조건이 기울기 곱 $-1$과 같음을 보여 수직을 결론지었다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 1-ⅲ] <제시문4>에서 정의된 점 $\mathrm{P},\mathrm{A},\mathrm{B}$와 직선 $L$에 대해서, $\overline{\mathrm{AP}}\times\overline{\mathrm{PB}}$가 최댓값을 가질 때 직선 $L$과 선분 $\mathrm{OP}$가 수직임을 보이고 그 이유를 논하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: proof, value: 'AP*PB = 1 - OP^2 이므로 곱의 최대 ⇔ OP 최소 ⇔ (ⅱ)에 의해 L⊥OP', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{A}(-k,y_0)$, $\mathrm{B}(k,y_0)$ $(k=\sqrt{1-y_0^2})$이면 $\overline{\mathrm{AP}}\times\overline{\mathrm{PB}}=(k+p)(k-p)=1-\overline{\mathrm{OP}}^2$.
    steps:
    - {id: 3a, content: '$\overline{\mathrm{AP}}\times\overline{\mathrm{PB}}=1-p^2-(p+1)^4$이므로 최대 ⇔ $\overline{\mathrm{OP}}$ 최소 ⇔ (ⅱ)', criteria: ['3.M1', '3.A1', '3.R1']}
    hint_ladder:
    - 점 $\mathrm{A},\mathrm{B}$의 좌표를 $\mathrm{P}$의 $y$좌표로 나타내 보자.
    - 곱을 전개하면 $\overline{\mathrm{OP}}$와 어떤 관계인가?
  - id: S3-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $y_0=(p+1)^2\in(0,1)$이고 $k=\sqrt{1-y_0^2}$라 하면 <제시문2>에 의해 $\mathrm{A}(-k,y_0)$, $\mathrm{B}(k,y_0)$이다. $0<p+1<1$이므로 $\overline{\mathrm{OP}}^2=p^2+(p+1)^4<p^2+(p+1)^2=1+2p(p+1)<1$, 즉 $\mathrm{P}$는 원 내부에 있어 $-k<p<k$이고 선분 $\mathrm{AB}$ 위에 있다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $\overline{\mathrm{AP}}=p+k$, $\overline{\mathrm{PB}}=k-p$이므로 $\overline{\mathrm{AP}}\times\overline{\mathrm{PB}}=k^2-p^2=1-y_0^2-p^2=1-\overline{\mathrm{OP}}^2$.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        따라서 $\overline{\mathrm{AP}}\times\overline{\mathrm{PB}}$가 최대인 것은 $\overline{\mathrm{OP}}$가 최소인 것과 같고, [문제 1-ⅱ]에 의해 그때 $L\perp\mathrm{OP}$이다.
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $\mathrm{A},\mathrm{B}$의 좌표를 $\mathrm{P}$의 좌표로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        $\overline{\mathrm{AP}}\times\overline{\mathrm{PB}}=1-\overline{\mathrm{OP}}^2$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        최대 ⇔ $\overline{\mathrm{OP}}$ 최소로 바꾸어 (ⅱ)의 결과로 수직을 결론지었다.
      depends_on: [3.A1]
      ft: {allowed: true, from: [2.A1], max_points: 3}
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

