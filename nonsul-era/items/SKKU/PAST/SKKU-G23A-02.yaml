intent: |
  사인법칙으로 $\angle\mathrm{A}=60^\circ$를 확정한 뒤 코사인법칙 $\overline{\mathrm{AB}}^2-\overline{\mathrm{AB}}\,\overline{\mathrm{AC}}+\overline{\mathrm{AC}}^2=3a^2$를 정수 조건·합·곱 조건과 결합해 가능한 값을 빠짐없이 찾는 능력을 본다(공식 출제 의도 자료 없음, 문제지로부터 요약). [배점추정] 소문항 배점이 문제지에 없어 10·10·10·10으로 균등 배분.
key_idea: |
  $b=\overline{\mathrm{AC}}$, $c=\overline{\mathrm{AB}}$라 하면 $b^2-bc+c^2=3a^2$. 합 $M$이면 $bc=\dfrac{M^2-3a^2}{3}$, 곱 $N$이면 $b^2,c^2$은 $X^2-(3a^2+N)X+N^2=0$의 두 근이므로 판별식으로 범위를 잡는다.
stuck: |
  (ⅲ)·(ⅳ)에서 $b,c$를 직접 찾지 않고 합·곱을 두 근으로 하는 이차방정식의 실근 조건(판별식)으로 존재성을 판정하는 발상
