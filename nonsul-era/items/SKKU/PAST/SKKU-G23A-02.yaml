stimuli:
- id: S1
  label: <제시문1>
  body: |
    삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이 $R$에 대해 다음이 성립한다.
    $$\frac{\overline{\mathrm{BC}}}{\sin A}=\frac{\overline{\mathrm{CA}}}{\sin B}=\frac{\overline{\mathrm{AB}}}{\sin C}=2R$$
- id: S2
  label: <제시문2>
  body: |
    그림과 같이 양의 실수 $a$에 대해 반지름이 $a$인 원에 내접하는 삼각형 $\mathrm{ABC}$가 다음 세 가지 조건을 만족한다.
    (1) $\overline{\mathrm{BC}}=\sqrt3a$
    (2) $\angle\mathrm{A}<90^\circ$
    (3) $0<\overline{\mathrm{AC}}\le\overline{\mathrm{AB}}$

    [그림: 원에 내접하는 삼각형 $\mathrm{ABC}$. $\mathrm{A}$는 원의 위쪽 오른편, $\mathrm{B}$는 왼쪽 아래, $\mathrm{C}$는 오른쪽 아래에 있다. 원의 중심에서 원 위의 한 점까지 그은 반지름 옆에 점선 호로 $a$가 표시되어 있고, 변 $\mathrm{BC}$ 아래에 점선 호로 $\sqrt3a$가 표시되어 있다.]

stem: |
  다음 <제시문1>과 <제시문2>를 읽고 [문제 2-ⅰ] ~ [문제 2-ⅳ]를 문항별로 풀이와 함께 답하시오. (40점)

subparts:
- id: '1'
  stem: |
    [문제 2-ⅰ] <제시문2>의 삼각형 $\mathrm{ABC}$에 대해 $\angle\mathrm{A}$를 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'pi/3', equivalents: ['60°'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 사인법칙에서 $\sin A=\dfrac{\sqrt3a}{2a}=\dfrac{\sqrt3}{2}$, $A<90^\circ$이므로 $A=60^\circ$.
    steps:
    - {id: 1a, content: '$\sin A=\tfrac{\sqrt3}{2}$, $0^\circ<A<90^\circ$에서 $A=60^\circ$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - <제시문1>에서 $R=a$를 넣어 보자.
  - id: S1-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        외접원의 반지름이 $a$이므로 <제시문1>에 의해 $\dfrac{\overline{\mathrm{BC}}}{\sin A}=2a$, 즉 $\sin A=\dfrac{\sqrt3a}{2a}=\dfrac{\sqrt3}{2}$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\sin A=\dfrac{\sqrt3}{2}$인 삼각형의 내각은 $60^\circ$ 또는 $120^\circ$인데 조건 (2)에서 $\angle\mathrm{A}<90^\circ$이므로 $\angle\mathrm{A}=60^\circ\left(=\dfrac{\pi}{3}\right)$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        사인법칙으로 $\sin A=\dfrac{\sqrt3}{2}$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $120^\circ$를 조건 (2)로 배제하고 $60^\circ$를 결론지었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 2-ⅱ] <제시문2>의 삼각형 $\mathrm{ABC}$에 대해 $a=10$일 때, $\overline{\mathrm{AB}}$와 $\overline{\mathrm{AC}}$가 모두 정수가 되는 $\overline{\mathrm{AB}}$와 $\overline{\mathrm{AC}}$의 값을 모두 찾고 그 이유를 논하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: set, value: '{(20, 10)}', equivalents: ['AB=20, AC=10'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $b^2-bc+c^2=300$, $b\le c$에서 $300\le c^2\le400$이므로 $c\in\{18,19,20\}$만 조사.
    steps:
    - {id: 2a, content: '$c=18,19$는 판별식이 제곱수가 아니고 $c=20$에서 $b=10$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 코사인법칙으로 $\overline{\mathrm{AB}}$, $\overline{\mathrm{AC}}$ 사이 관계식을 세우자.
    - $b\le c$를 이용해 $c$의 범위를 좁혀 보자.
  - id: S2-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $b=\overline{\mathrm{AC}}$, $c=\overline{\mathrm{AB}}$라 하면 코사인법칙과 $A=60^\circ$에서 $\overline{\mathrm{BC}}^2=b^2+c^2-bc$, 즉 $b^2-bc+c^2=300$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $0<b\le c$이므로 $b^2-bc\le0$에서 $c^2\ge300$이고, $b^2-bc+c^2=\left(b-\dfrac c2\right)^2+\dfrac34c^2\ge\dfrac34c^2$에서 $c^2\le400$. 따라서 $c\in\{18,19,20\}$.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $c=18$: $b^2-18b+24=0$, 판별식 $228$은 제곱수가 아님. $c=19$: $b^2-19b+61=0$, 판별식 $117$은 제곱수가 아님. $c=20$: $b^2-20b+100=(b-10)^2=0$, $b=10$.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        역으로 $b=10$, $c=20$, $A=60^\circ$이면 $\overline{\mathrm{BC}}=10\sqrt3$, 외접원 반지름 $\dfrac{10\sqrt3}{2\sin60^\circ}=10$이고 세 조건을 만족한다. 따라서 $\overline{\mathrm{AB}}=20$, $\overline{\mathrm{AC}}=10$뿐이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        코사인법칙으로 $b^2-bc+c^2=300$을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        $b\le c$ 등으로 후보를 유한개로 좁혀 빠짐없이 조사했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $(\overline{\mathrm{AB}},\overline{\mathrm{AC}})=(20,10)$만 가능함을 얻었다.
      depends_on: [2.M2]
      steps: [2b-3, 2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 2-ⅲ] <제시문2>의 삼각형 $\mathrm{ABC}$에 대해 $a=\sqrt{10}$이라 하자. 2023 이하인 자연수 $M$에 대해, $\overline{\mathrm{AB}}+\overline{\mathrm{AC}}=M$을 만족하는 순서쌍 $(\overline{\mathrm{AB}},\overline{\mathrm{AC}})$가 존재하는 모든 $M$의 합을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '40', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $bc=\dfrac{M^2-30}{3}>0$, 판별식 $M^2-4bc\ge0$에서 $30<M^2\le120$, $M\in\{6,\dots,10\}$.
    steps:
    - {id: 3a, content: '$30<M^2\le120\Rightarrow M=6,7,8,9,10$, 합 $40$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - $b+c$와 $bc$의 관계를 코사인법칙에서 얻어 보자.
    - 합과 곱이 주어진 두 양수가 존재할 조건은?
  - id: S3-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\overline{\mathrm{BC}}^2=30$이므로 $b^2-bc+c^2=30$, 즉 $(b+c)^2-3bc=30$. $b+c=M$이면 $bc=\dfrac{M^2-30}{3}$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $b,c$는 $X^2-MX+\dfrac{M^2-30}{3}=0$의 두 근이다. 두 양의 실근이 존재할 조건은 합 $M>0$, 곱 $\dfrac{M^2-30}{3}>0$, 판별식 $M^2-\dfrac43(M^2-30)\ge0$, 즉 $30<M^2\le120$. 이때 두 근 중 큰 것을 $c$로 두면 $0<b\le c$이고, $A=60^\circ$, 외접원 반지름 $\sqrt{10}$인 삼각형이 존재한다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        자연수 $M$은 $6,7,8,9,10$이므로 합은 $40$.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $bc=\dfrac{M^2-30}{3}$을 얻었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: |
        곱 양수·판별식 조건으로 $30<M^2\le120$을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        합 $40$을 얻었다.
      depends_on: [3.M2]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    [문제 2-ⅳ] <제시문2>의 삼각형 $\mathrm{ABC}$에 대해 $a=\sqrt2$라 하자. 2023 이하인 자연수 $N$에 대해, $\overline{\mathrm{AB}}^2$과 $\overline{\mathrm{AC}}^2$은 정수가 아니고 $\overline{\mathrm{AB}}\times\overline{\mathrm{AC}}=N$을 만족하는 순서쌍 $\left(\overline{\mathrm{AB}}^2,\overline{\mathrm{AC}}^2\right)$이 존재하는 모든 $N$의 합을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '11', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $b^2,c^2$은 $X^2-(6+N)X+N^2=0$의 두 근, 판별식 $3(6-N)(N+2)\ge0$에서 $N\le6$, 근이 정수가 되는 $N=4,6$ 제외.
    steps:
    - {id: 4a, content: '$N\in\{1,2,3,5\}$, 합 $11$', criteria: ['4.M1', '4.M2', '4.A1']}
    hint_ladder:
    - $b^2+c^2$과 $b^2c^2$을 $N$으로 나타내 보자.
    - 두 근이 정수가 되는 경우는 판별식이 언제인가?
  - id: S4-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $\overline{\mathrm{BC}}^2=6$이므로 $b^2+c^2-bc=6$이고 $bc=N$이면 $b^2+c^2=6+N$, $b^2c^2=N^2$. 따라서 $b^2,c^2$은 $X^2-(6+N)X+N^2=0$의 두 근이다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        두 양의 실근 조건: 판별식 $(6+N)^2-4N^2=3(6-N)(N+2)\ge0$에서 $N\le6$ (합·곱은 양수). 따라서 $N\in\{1,\dots,6\}$이고 각각 $b\le c$인 삼각형이 존재한다.
      criteria: ['4.M2']
    - id: 4b-3
      content: |
        근 $X=\dfrac{6+N\pm\sqrt{3(6-N)(N+2)}}{2}$. 판별식 값은 $N=1,2,3,4,5,6$에서 $45,48,45,36,21,0$. 제곱수가 아니면 두 근은 무리수(정수 아님). $N=4$이면 $X=8,2$, $N=6$이면 $X=6$(중근)으로 정수이므로 제외.
      criteria: ['4.A1']
    - id: 4b-4
      content: |
        따라서 $N=1,2,3,5$이고 합은 $11$.
      criteria: ['4.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: |
        $b^2,c^2$을 두 근으로 하는 이차방정식(또는 동치 관계)을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [4b-1]
    - id: 4.M2
      mark_type: M
      points: 3
      evidence: |
        판별식으로 $N\le6$을 얻었다.
      depends_on: [4.M1]
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 4
      evidence: |
        정수가 되는 $N=4,6$을 제외하고 합 $11$을 얻었다.
      depends_on: [4.M2]
      steps: [4b-3, 4b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

