intent: |
  직각삼각형 안에 이어 붙인 정사각형의 닮음비로 등비수열을 세우고, 홀수·짝수 번째 항의 부분합 사이 관계를 이용해 비의 값을 계산한 뒤, 평균의 대소를 수학적 귀납법으로 증명하는 능력을 본다(공식 출제 의도 자료 없음, 문제지로부터 요약). [배점추정] 소문항 배점이 문제지에 없어 10·10·10으로 균등 배분.
key_idea: |
  한 변이 $\ell$인 정사각형 왼쪽 위 꼭짓점이 빗변 위에 있으므로 다음 정사각형의 한 변은 $\dfrac{\ell}{1+t}$, 넓이 공비는 $q=\dfrac{1}{(1+t)^2}$. 또 $P_{2n+1}=1+qQ_{2n+1}$.
stuck: |
  (ⅲ)에서 $n$에 관한 명제 "$nP_{2n+1}>(n+1)Q_{2n+1}$"를 세우고, 차이 $A_{n+1}-A_n=(1-q)\left(\sum_{k=0}^{n}q^{2k}-(n+1)q^{2n+1}\right)>0$을 보이는 귀납 단계
idea_tags: [IDEA-SIMILAR-SQUARES-GEOMETRIC, IDEA-INDUCTION-ON-DIFFERENCE]
tags: [등비수열, 닮음, 수학적 귀납법, 평균 비교]
