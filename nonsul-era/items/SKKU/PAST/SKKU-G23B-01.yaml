stimuli:
- id: S1
  label: <제시문1>
  body: |
    첫째항부터 차례대로 일정한 수를 더하여 만든 수열을 등차수열이라 하며, 그 일정한 수를 공차라고 한다. 공차가 $d$인 등차수열 $\{a_n\}$에서 제$n$항에 공차 $d$를 더하면 제$(n+1)$항이 되므로 다음이 성립한다.
    $$a_{n+1}=a_n+d\quad(n=1,2,3,\cdots)$$
- id: S2
  label: <제시문2>
  body: |
    첫째항부터 차례대로 일정한 수를 곱하여 만든 수열을 등비수열이라 하며, 그 일정한 수를 공비라고 한다. 공비가 $r$ $(r\ne0)$인 등비수열 $\{a_n\}$에서 제$n$항에 공비 $r$를 곱하면 제$(n+1)$항이 되므로 다음이 성립한다.
    $$a_{n+1}=ra_n\quad(r\ne0,\ n=1,2,3,\cdots)$$
- id: S3
  label: <제시문3>
  body: |
    세 개의 정수로 이루어진 순서쌍의 집합 $M$을 다음과 같이 정의하자.
    $$M=\{(a,b,c)\mid a,b,c\text{는 정수이고 }1\le|a|,|b|,|c|\le100\}$$
    이때, 집합 $M$의 원소의 개수는 $200^3$이다.

stem: |
  다음 <제시문1> ~ <제시문3>을 읽고 [문제 1-ⅰ] ~ [문제 1-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    [문제 1-ⅰ] 삼각형의 세 변의 길이가 각각 100 이하의 자연수이면서 등차수열을 이루는 삼각형의 개수를 구하고 그 이유를 논하시오. (단, 합동인 두 삼각형은 한 개의 삼각형으로 간주한다.)
  points: 10
  depends_on: []
  answer: {kind: value, value: '1717', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 세 변 $a-d,a,a+d$, 조건 $a>2d$, $a+d\le100$. $d=0$에서 100개, $d\ge1$에서 $100-3d$개.
    steps:
    - {id: 1a, content: '$100+\sum_{d=1}^{33}(100-3d)=100+1617=1717$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 세 변을 가운데 항과 공차로 나타내자.
    - 가장 긴 변이 나머지 두 변의 합보다 작을 조건을 쓰자.
  - id: S1-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        합동인 삼각형은 하나로 보므로 세 변을 작은 순서로 $a-d,\ a,\ a+d$ ($d\ge0$ 정수)로 둔다. 삼각형 조건은 $(a-d)+a>a+d$, 즉 $a>2d$이고, 이때 $a-d>d\ge0$이므로 $a-d\ge1$은 자동. 또 $a+d\le100$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $d=0$: 정삼각형 $a=1,\dots,100$의 100개. $d\ge1$: $2d+1\le a\le100-d$이므로 $100-3d$개이고, $100-3d\ge1$에서 $d\le33$.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\sum_{d=1}^{33}(100-3d)=3300-3\cdot\dfrac{33\cdot34}{2}=1617$. 따라서 총 $100+1617=1717$개.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        세 변을 $a-d,a,a+d$로 두고 삼각형 조건 $a>2d$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: |
        $d$별 개수($d=0$은 100개, $d\ge1$은 $100-3d$개)를 셌다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $1717$을 얻었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 1-ⅱ] 삼각형의 세 변의 길이가 각각 100 이하의 자연수이면서 등비수열을 이루는 삼각형의 개수를 구하고 그 이유를 논하시오. (단, 합동인 두 삼각형은 한 개의 삼각형으로 간주하며, $\sqrt5=2.236\cdots$이다.)
  points: 10
  depends_on: []
  answer: {kind: value, value: '133', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 세 변 $mp^2,mpq,mq^2$ ($\gcd(p,q)=1$, $1\le\dfrac qp<\dfrac{1+\sqrt5}{2}$), 개수 $=\left\lfloor\dfrac{100}{q^2}\right\rfloor$.
    steps:
    - {id: 2a, content: '$r=1$: 100, $\tfrac32$: 11, $\tfrac43$: 6, $\tfrac54$: 4, $\tfrac65$: 2, $\tfrac76,\tfrac75$: 4, $\tfrac87,\tfrac85$: 2, $\tfrac98,\tfrac97$: 2, $\tfrac{10}{9},\tfrac{10}{7}$: 2, 합 133', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 세 자연수가 등비수열이면 공비는 유리수이다. 기약분수 $\dfrac qp$로 두자.
    - 가장 긴 변 $mq^2\le100$에서 $q$의 범위가 정해진다.
  - id: S2-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        세 변을 작은 순으로 $x\le y\le z$, 공비 $r=\dfrac yx\ge1$이라 하면 $r$는 유리수이므로 $r=\dfrac qp$ ($p\le q$, $\gcd(p,q)=1$). $z=x\dfrac{q^2}{p^2}$이 정수이므로 $p^2\mid x$, $x=mp^2$이고 세 변은 $mp^2,\ mpq,\ mq^2$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        삼각형 조건 $x+xr>xr^2$에서 $r^2-r-1<0$, $1\le r<\dfrac{1+\sqrt5}{2}=1.618\cdots$. 또 $mq^2\le100$이므로 $q\le10$이고 각 $(p,q)$마다 $m=1,\dots,\left\lfloor\dfrac{100}{q^2}\right\rfloor$.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        가능한 기약 공비: $r=1$(정삼각형, 100개); $q=3$: $\dfrac32$ (11개); $q=4$: $\dfrac43$ (6개); $q=5$: $\dfrac54$ (4개, $\dfrac53>1.618$ 제외); $q=6$: $\dfrac65$ (2개); $q=7$: $\dfrac76,\dfrac75$ (각 2개, $\dfrac74$ 제외); $q=8$: $\dfrac87,\dfrac85$ (각 1개, $\dfrac85=1.6<1.618$); $q=9$: $\dfrac98,\dfrac97$ (각 1개, $\dfrac95$ 제외); $q=10$: $\dfrac{10}{9},\dfrac{10}{7}$ (각 1개). $q=2$이면 $r=2$로 불가.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        합: $100+11+6+4+2+4+2+2+2=133$개.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        세 변을 $mp^2,mpq,mq^2$ 꼴로 나타내고 삼각형 조건 $r<\dfrac{1+\sqrt5}{2}$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        가능한 공비를 빠짐없이 나열하고 각 개수를 셌다(특히 $\dfrac85$ 포함, $\dfrac53$ 제외).
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $133$을 얻었다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 1-ⅲ] <제시문3>에서 정의된 집합 $M$의 원소 $(a,b,c)$ 중에서 다음의 조건을 모두 만족하는 모든 원소의 개수를 구하고 그 이유를 논하시오.
    (가) $a,b,c$는 이 순서대로 등차수열을 이룬다.
    (나) $a,b,c$를 일렬로 나열하여 적어도 한 개의 등비수열을 만들 수 있다. 예를 들어, $(a,b,c)=(1,2,3)$인 경우 $a,b,c$를 일렬로 나열하는 방법은 다음의 여섯 가지가 있다.
    ① $1,2,3$ ② $1,3,2$ ③ $2,1,3$ ④ $2,3,1$ ⑤ $3,1,2$ ⑥ $3,2,1$
  points: 10
  depends_on: []
  answer: {kind: value, value: '300', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 공차 0이면 200개. 공차 $d\ne0$이면 등비중항이 될 수 있는 항에 따라 $(-2k,k,4k)$ 또는 $(4k,k,-2k)$, $1\le|k|\le25$.
    steps:
    - {id: 3a, content: '$200+50+50=300$', criteria: ['3.M1', '3.M2', '3.A1']}
    hint_ladder:
    - 0이 아닌 세 수가 어떤 순서로 등비수열이 된다는 것은 한 수의 제곱이 나머지 두 수의 곱이라는 뜻이다.
    - 등차수열 $x,x+d,x+2d$에서 어느 항이 등비중항인지 세 경우로 나누자.
  - id: S3-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $(a,b,c)=(x,x+d,x+2d)$라 하자. 세 수는 0이 아니므로 재배열 $u,v,w$가 등비수열일 조건은 $v^2=uw$이다($v$가 가운데 항).
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $d=0$: $(a,a,a)$는 공비 1인 등비수열이므로 모두 가능하고 $a\in\{\pm1,\dots,\pm100\}$의 200개.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        $d\ne0$: (1) 가운데 $x+d$: $(x+d)^2=x(x+2d)\Rightarrow d^2=0$ 불가. (2) 가운데 $x$: $x^2=(x+d)(x+2d)\Rightarrow x=-\dfrac{2d}{3}$, $d=3k$이면 $(a,b,c)=(-2k,k,4k)$. (3) 가운데 $x+2d$: $(x+2d)^2=x(x+d)\Rightarrow x=-\dfrac{4d}{3}$, $d=3k$이면 $(-4k,-k,2k)$, $k\to-k$로 쓰면 $(4k,k,-2k)$.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        두 꼴 모두 $1\le|4k|\le100$, 즉 $k\in\{\pm1,\dots,\pm25\}$에서 50개씩이고, 두 꼴이 같아지려면 $k=0$이어야 하므로 겹치지 않는다. 따라서 $200+50+50=300$개.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        등비 조건을 $v^2=uw$(등비중항)로 바꾸었다.
      depends_on: []
      implied_ok: true
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: |
        공차 0인 경우와 가운데 항 세 경우를 나누어 $(-2k,k,4k)$, $(4k,k,-2k)$ 꼴을 얻었다.
      depends_on: [3.M1]
      steps: [3b-2, 3b-3]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        범위 $|k|\le25$와 중복 없음을 확인해 $300$을 얻었다.
      depends_on: [3.M2]
      steps: [3b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

