intent: |
  등차·등비수열의 정의와 삼각형의 결정 조건(두 변의 합 > 나머지 한 변)을 결합해 정수 조건을 만족하는 경우를 빠짐없이 세고, 등차이면서 재배열하여 등비가 되는 정수 순서쌍을 분류하는 능력을 본다(공식 출제 의도 자료 없음, 문제지로부터 요약). [배점추정] 소문항 배점이 문제지에 없어 10·10·10으로 균등 배분.
key_idea: |
  (ⅰ) 세 변 $a-d,a,a+d$ ($d\ge0$)에서 삼각형 조건은 $a>2d$. (ⅱ) 공비 $r=\dfrac qp$(기약, $q\ge p$)이면 세 변은 $mp^2,mpq,mq^2$이고 삼각형 조건은 $r<\dfrac{1+\sqrt5}{2}$. (ⅲ) 등차 $x,x+d,x+2d$ ($d\ne0$)의 재배열이 등비이면 $x=-\dfrac{2d}{3}$ 또는 $x=-\dfrac{4d}{3}$.
stuck: |
  (ⅱ)에서 정수 등비수열의 공비가 유리수 $\dfrac qp$이고 세 항이 $mp^2,mpq,mq^2$ 꼴이 된다는 사실, 그리고 $\dfrac85<\dfrac{1+\sqrt5}{2}<\dfrac53$ 판정
idea_tags: [IDEA-INTEGER-GP-PARAMETRIZATION, IDEA-TRIANGLE-INEQUALITY-COUNT]
tags: [등차수열, 등비수열, 삼각형의 결정 조건, 경우의 수]
