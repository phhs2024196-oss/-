intent: |
  $\cos\left(x+\dfrac{n\pi}{2}\right)$이 $n$을 4로 나눈 나머지에 따라 $\cos x,-\sin x,-\cos x,\sin x$가 됨을 이용해 방정식을 경우별로 분류하고, $0<x<\dfrac\pi4$에서의 $\sin x,\cos x$의 범위로 해의 존재를 판정하는 능력을 본다(공식 출제 의도 자료 없음, 문제지로부터 요약). [배점추정] 소문항 배점이 문제지에 없어 10·10·10으로 균등 배분.
key_idea: |
  $0<x<\dfrac\pi4$에서 $0<\sin x<\dfrac{\sqrt2}{2}<\cos x<1$. 각 방정식을 $n\bmod4$(와 $m$의 홀짝)로 나누어 $\sin x$ 또는 $\cos x$의 방정식으로 바꾸고 근이 해당 범위에 있는지 본다.
stuck: |
  (ⅲ)에서 4차식 $F(u)=8u^4-7u^2+3u-1$의 근을 직접 구하지 않고, $|u|\le\dfrac{\sqrt2}{2}$에서 $F(u)\le-3u^2+3u-1<0$ 같은 부등식 평가와 사잇값 정리로 존재 여부만 판정하는 발상
idea_tags: [IDEA-MOD4-TRIG-SHIFT, IDEA-IVT-EXISTENCE-BY-SIGN]
tags: [삼각함수, 방정식의 해, 경우 분류, 사잇값 정리]
elements:
  materials:
  - '$4\cos\left(x+\dfrac{n\pi}{2}\right)=1$'
  - '$6\cos^2\left(x+\dfrac{m\pi}{2}\right)+\cos\left(x+\dfrac{n\pi}{2}\right)=5$ ($m,n\le23$)'
  - '$8\cos^4\left(x+\dfrac{n\pi}{2}\right)-7\cos^2\left(x+\dfrac{n\pi}{2}\right)+3\cos\left(x+\dfrac{n\pi}{2}\right)=1$'
  concepts:
  - '삼각함수의 성질($x+\dfrac\pi2$, $x+\pi$ 변환)'
  - '$\sin^2x+\cos^2x=1$'
  - '삼각방정식'
  - '이차방정식의 인수분해'
  - '사잇값 정리'
  tools:
  - '$n\bmod4$에 따른 치환 $\cos\left(x+\tfrac{n\pi}{2}\right)\in\{\cos x,-\sin x,-\cos x,\sin x\}$'
  - '$m$의 홀짝에 따른 $\cos^2\left(x+\tfrac{m\pi}{2}\right)\in\{\cos^2x,\sin^2x\}$'
  - '구간 $\left(0,\tfrac\pi4\right)$에서 $\sin x\in\left(0,\tfrac{\sqrt2}{2}\right)$, $\cos x\in\left(\tfrac{\sqrt2}{2},1\right)$'
  - '부등식 평가 $8u^4\le4u^2$ ($u^2\le\tfrac12$)'
  conditions:
  - '열린구간 $0<x<\dfrac{\pi}{4}$'
  - '(ⅰ)·(ⅲ) $n$은 2023 이하 자연수, (ⅱ) $m,n$은 23 이하 자연수'
  stimuli_used: [S1, S2]
  subpart_links: '세 소문항 모두 <제시문1>의 $n\bmod4$ 분류를 공통으로 사용하며, (ⅱ)는 $m$의 홀짝 분류를 추가, (ⅲ)은 같은 분류에서 4차방정식의 해 존재 판정'

