intent: |
  곡선과 원점을 잇는 두 선분으로 둘러싸인 도형의 넓이를 정적분으로 표현하고 그 순간 변화율 $A(t)=\dfrac12|tf'(t)-f(t)|$를 유도한 뒤, 절댓값 함수의 미분가능성·극값·정적분 조건으로 삼차함수의 계수를 결정하는 능력을 본다(공식 출제 의도 자료 없음, 문제지로부터 요약). [배점추정] 소문항 배점이 문제지에 없어 10·10·10·10으로 균등 배분.
key_idea: |
  $p(h)=\left|\displaystyle\int_t^{t+h}f(x)\,dx+\dfrac12tf(t)-\dfrac12(t+h)f(t+h)\right|$이므로 $A(t)=\dfrac12|g(t)|$, $g(t)=2at^3+bt^2-d$. (가)(나)에서 $g$는 $\alpha$에서 중근, $\beta$에서 단순근.
stuck: |
  "$A(t)=0$의 실근이 두 개뿐이고 $\beta$에서 미분불가능"을 $g$의 중근 $\alpha$·단순근 $\beta$로 해석하고, $g(0)=-d<0$에서 $\alpha<0$이 극대점임을 읽어내는 단계
