stimuli:
- id: S1
  label: <제시문1>
  body: |
    상수 $a,b,c,d$에 대하여 삼차함수 $f(x)=ax^3+bx^2+cx+d$가 있다 (단, $a,d$는 양수). 실수 $t$와 양수 $h$에 대해 원점 $\mathrm{O}$와 두 점 $\mathrm{P}(t,f(t))$, $\mathrm{Q}(t+h,f(t+h))$를 각각 잇는 선분 $\mathrm{OP},\mathrm{OQ}$가 있다. 다음 그림과 같은 방식으로 $y=f(x)$의 그래프의 점 $\mathrm{P}$에서 점 $\mathrm{Q}$까지의 부분과 선분 $\mathrm{OP},\mathrm{OQ}$로 둘러싸인 도형의 넓이를 $p(h)$라 하고 $A(t)=\displaystyle\lim_{h\to0+}\frac{p(h)}{h}$라 하자.

    [그림: 좌표평면에 삼차함수 $y=f(x)$의 그래프(파란 곡선)가 $y$축 왼쪽에서 극대, $x>0$ 쪽에서 내려갔다가 극소 후 다시 올라간다. 제1사분면의 곡선 위 두 점 $\mathrm{P}$($x$좌표 $t$)와 $\mathrm{Q}$($x$좌표 $t+h$, $\mathrm{P}$보다 오른쪽 아래)가 있고, 원점 $\mathrm{O}$에서 $\mathrm{P}$, $\mathrm{Q}$로 굵은 선분이 그어져 곡선의 $\mathrm{P}$~$\mathrm{Q}$ 부분과 함께 좁은 도형을 이룬다. $\mathrm{P},\mathrm{Q}$에서 $x$축으로 빨간 점선 수선이 그어져 $t$, $t+h$가 표시되어 있다.]
- id: S2
  label: <제시문2>
  body: |
    <제시문1>에서 정의된 함수 $A(t)$가 다음의 조건을 모두 만족한다.
    (가) 방정식 $A(t)=0$이 두 개의 실근 $\alpha$와 $\beta$만을 갖는다 (단, $\alpha<\beta$).
    (나) 함수 $A(t)$는 $t=\beta$에서 미분가능하지 않다.
    (다) 함수 $A(t)$는 극댓값 16을 갖는다.
    (라) $\displaystyle\int_0^{2\beta}A(t)dt=38$이다.

stem: |
  다음 <제시문1>과 <제시문2>를 읽고 [문제 3-ⅰ] ~ [문제 3-ⅳ]를 문항별로 풀이와 함께 답하시오. (40점)

subparts:
- id: '1'
  stem: |
    [문제 3-ⅰ] <제시문1>에서 주어진 함수 $f(x)$에 대하여 $\displaystyle\int_0^1f(x)dx$의 값을 $a,b,c,d$를 사용하여 표현하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'a/4 + b/3 + c/2 + d', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 다항함수의 부정적분 $\dfrac a4x^4+\dfrac b3x^3+\dfrac c2x^2+dx$에 $0,1$을 대입.
    steps:
    - {id: 1a, content: '$\int_0^1f=\tfrac a4+\tfrac b3+\tfrac c2+d$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $x^n$의 부정적분을 떠올리자.
  - id: S1-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $F(x)=\dfrac a4x^4+\dfrac b3x^3+\dfrac c2x^2+dx$라 하면 $F'(x)=f(x)$이므로 $f$의 한 부정적분이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\int_0^1f(x)dx=F(1)-F(0)=\dfrac a4+\dfrac b3+\dfrac c2+d$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        부정적분을 바르게 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $\dfrac a4+\dfrac b3+\dfrac c2+d$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 3-ⅱ] <제시문1>에서 주어진 함수 $A(t)$를 $a,b,c,d$와 $t$를 사용하여 표현하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'Abs(2*a*t**3 + b*t**2 - d)/2', equivalents: ['|t*f''(t)-f(t)|/2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 사다리꼴 넓이로 $p(h)=\left|\int_t^{t+h}f\,dx+\tfrac12tf(t)-\tfrac12(t+h)f(t+h)\right|$, $h\to0+$에서 $\tfrac{p(h)}{h}\to\tfrac12|f(t)-tf'(t)|$.
    steps:
    - {id: 2a, content: '$A(t)=\tfrac12|tf''(t)-f(t)|=\tfrac12|2at^3+bt^2-d|$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 곡선 아래 넓이와 두 삼각형 넓이의 합·차로 $p(h)$를 표현하자.
    - $h$로 나눈 극한은 어떤 함수의 미분계수인가?
  - id: S2-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $x=t$, $x=t+h$에서 내린 수선과 $x$축을 고려하면, 부호 있는 넓이로 $p(h)=|S(h)|$, $S(h)=\displaystyle\int_t^{t+h}f(x)dx+\dfrac12tf(t)-\dfrac12(t+h)f(t+h)$ (곡선 아래 넓이에 삼각형 $\mathrm{O}\,t\,\mathrm{P}$를 더하고 삼각형 $\mathrm{O}\,(t+h)\,\mathrm{Q}$를 뺀 것). $h$가 충분히 작으면 이 식이 그림의 도형 넓이와 같다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $S(0)=0$이므로 $\displaystyle\lim_{h\to0+}\dfrac{S(h)}{h}=S'(0)=f(t)-\dfrac12f(t)-\dfrac12tf'(t)=\dfrac12\left(f(t)-tf'(t)\right)$.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $tf'(t)-f(t)=3at^3+2bt^2+ct-(at^3+bt^2+ct+d)=2at^3+bt^2-d$이므로 $A(t)=\dfrac12\left|2at^3+bt^2-d\right|$. ($c$는 나타나지 않는다.)
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $p(h)$를 정적분과 삼각형 넓이로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        극한을 미분계수로 계산했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $A(t)=\dfrac12|2at^3+bt^2-d|$를 얻었다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 3-ⅲ] <제시문1>에서 주어진 함수 $A(t)$가 <제시문2>의 조건을 만족할 때, $\alpha,\beta$와 $a$의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: expression, value: 'alpha=-2; beta=1; a=4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g(t)=2at^3+bt^2-d=2a(t-\alpha)^2(t-\beta)$, 계수비교로 $\alpha=-2\beta$, $d=8a\beta^3$; 극댓값 $A(0)=\tfrac d2=16$; $\int_0^{2\beta}A=\tfrac{19}{2}a\beta^4=38$.
    steps:
    - {id: 3a, content: '$a\beta^3=4$, $a\beta^4=4\Rightarrow\beta=1$, $a=4$, $\alpha=-2$', criteria: ['3.M1', '3.R1', '3.M2', '3.A1']}
    hint_ladder:
    - $|g(t)|$가 근에서 미분가능하려면 그 근은 몇 중근이어야 하는가?
    - $g(0)=-d<0$을 이용해 중근이 극대점인지 극소점인지 판단하자.
    - $A(t)$의 극대점은 $g$의 어느 임계점인가?
  - id: S3-B
    audience: B
    source_flow: 공식 해설 없음(자체 작성)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $g(t)=2at^3+bt^2-d$라 하면 $A=\dfrac12|g|$. 삼차방정식 $g=0$의 서로 다른 실근이 $\alpha,\beta$ 두 개뿐이므로 하나는 중근, 하나는 단순근이다. 단순근 $\gamma$에서 $g'(\gamma)\ne0$이라 $|g|$는 좌우미분계수가 $\mp|g'(\gamma)|$로 달라 미분불가능하고, 중근에서는 $|g|=|t-\gamma|^2\cdot|\cdots|$ 꼴이라 미분계수 0으로 미분가능하다. (나)에 의해 $\beta$가 단순근, $\alpha$가 중근: $g(t)=2a(t-\alpha)^2(t-\beta)$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $t$의 계수 비교: $2a(\alpha^2+2\alpha\beta)=0$, $\alpha\ne0$ ($g(0)=-d\ne0$)이므로 $\alpha=-2\beta$. 상수항: $-2a\alpha^2\beta=-d$에서 $\beta=\dfrac{d}{2a\alpha^2}>0$, $\alpha<0$이고 $d=8a\beta^3$. $t^2$의 계수: $b=2a(-2\alpha-\beta)=6a\beta$.
      criteria: ['3.R1']
    - id: 3b-3
      content: |
        $g'(t)=6at^2+2bt=2t(3at+b)$의 임계점은 $\alpha=-\dfrac{b}{3a}$ (극대, $g=0$)과 $0$ (극소, $g(0)=-d<0$). $A=\dfrac12|g|$의 극대는 $g$가 음수인 구간 $(\alpha,\beta)$의 극소점 $t=0$뿐이므로 극댓값은 $A(0)=\dfrac d2=16$, $d=32$, $a\beta^3=4$.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        $t=\beta s$로 치환하면 $g=2a\beta^3(s+2)^2(s-1)=2a\beta^3(s^3+3s^2-4)$이고 $\displaystyle\int_0^{2\beta}A\,dt=a\beta^4\left[\int_0^1(4-3s^2-s^3)ds+\int_1^2(s^3+3s^2-4)ds\right]=a\beta^4\left(\dfrac{11}{4}+\dfrac{27}{4}\right)=\dfrac{19}{2}a\beta^4=38$. 따라서 $a\beta^4=4$.
      criteria: ['3.A1']
    - id: 3b-5
      content: |
        $a\beta^4=a\beta^3=4$에서 $\beta=1$, $a=4$, $\alpha=-2$.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        (가)(나)를 $\alpha$ 중근·$\beta$ 단순근으로 해석했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1], max_points: 3}
      steps: [3b-1]
    - id: 3.R1
      mark_type: R
      points: 2
      evidence: |
        계수비교로 $\alpha=-2\beta$, $d=8a\beta^3$ 관계를 얻었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.M2
      mark_type: M
      points: 2
      evidence: |
        극댓값이 $A(0)=\dfrac d2$임을 근거와 함께 보였다.
      depends_on: [3.M1]
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        (라)의 적분을 계산해 $\alpha=-2$, $\beta=1$, $a=4$를 얻었다.
      depends_on: [3.R1, 3.M2]
      steps: [3b-4, 3b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    [문제 3-ⅳ] <제시문1>에서 주어진 함수 $f(x)$가 $\displaystyle\int_0^1f(x)dx=23$을 만족하고 <제시문1>에서 주어진 함수 $A(t)$가 <제시문2>의 모든 조건을 만족할 때, $a,b,c,d$의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: ['1', '3']
  answer: {kind: expression, value: 'a=4; b=24; c=-36; d=32', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: (ⅲ)에서 $a=4$, $b=6a\beta=24$, $d=32$; (ⅰ)식 $=23$에서 $c$.
    steps:
    - {id: 4a, content: '$1+8+\tfrac c2+32=23\Rightarrow c=-36$', criteria: ['4.M1', '4.A1']}
    hint_ladder:
    - $A(t)$에는 $c$가 나타나지 않는다. $c$는 어떤 조건으로 정해지는가?
  - id: S4-B
