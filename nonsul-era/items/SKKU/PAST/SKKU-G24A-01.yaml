intent: |
  미분을 활용해 곡선 밖의 점에서 곡선까지의 최단거리를 주는 점에서의 접선이 두 점을 잇는 직선과 수직임을 논리적으로 정당화하고, 이 성질과 함수(그래프)의 대칭이동을 이용해 여러 그래프 위의 점들로 이루어진 선분의 합의 최솟값을 구하는 과정을 설명할 수 있는지 평가한다(2024 보고서 문항카드 7 출제 의도 요약).
key_idea: |
  거리의 제곱 $g(x)=(x-a)^2+(f(x)-b)^2$이 $x=c$에서 극소이므로 $g'(c)=0$이고, 이 식이 곧 법선이 $\mathrm{P}$를 지난다는 조건이다. (ⅲ)에서는 $\mathrm{A}$를 $y=x$, $\mathrm{D}$를 $y=0$에 대해 대칭이동해 꺾은선 길이를 두 곡선 사이의 거리로 바꾼다.
stuck: |
  $\overline{\mathrm{AB}}+\overline{\mathrm{BC}}+\overline{\mathrm{CD}}$를 대칭점 $\mathrm{A}'$, $\mathrm{D}'$ 사이의 꺾은선으로 바꾸어 두 포물선 $y=x^2+1$과 $y=-2x^2+30x-113$ 사이의 최단거리 문제로 보는 발상
idea_tags: [IDEA-DIST-MIN-NORMAL, IDEA-REFLECTION-SHORTEST-PATH]
tags: [최단거리와 법선, 대칭이동, 꺾은선 최소]
