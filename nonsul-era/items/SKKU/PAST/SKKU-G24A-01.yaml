stimuli:
- id: S1
  label: <제시문1>
  body: |
    곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 방정식은 $y=f'(a)(x-a)+f(a)$이다.
- id: S2
  label: <제시문2>
  body: |
    좌표평면 위의 네 점 $\mathrm{A},\mathrm{B},\mathrm{C},\mathrm{D}$가 다음의 조건을 만족한다.
    • 점 $\mathrm{A}$는 곡선 $y=\sqrt{x-1}$ 위의 점이다. (단, $x\ge1$)
    • 점 $\mathrm{B}$는 직선 $y=x$ 위의 점이다.
    • 점 $\mathrm{C}$는 직선 $y=0$ 위의 점이다.
    • 점 $\mathrm{D}$는 곡선 $y=2x^2-30x+113$ 위의 점이다.

stem: |
  다음 <제시문1>과 <제시문2>를 읽고 [문제 1-ⅰ] ~ [문제 1-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    [문제 1-ⅰ] 실수 전체의 집합에서 미분가능한 함수 $f(x)$에 대하여 곡선 $y=f(x)$와 이 곡선 위에 있지 않은 점 $\mathrm{P}$가 주어져 있다. 이 곡선 위의 점 중에서 주어진 점 $\mathrm{P}$까지의 거리가 최소가 되는 점을 $\mathrm{Q}$라고 하자. 이때, 점 $\mathrm{Q}$에서 곡선 $y=f(x)$에 접하는 접선이 직선 $\mathrm{PQ}$에 수직인 이유를 논하시오.
  points: 8
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 거리의 제곱 $g(x)=(x-a)^2+(f(x)-b)^2$은 $x=c$에서 최소(극소)이므로 $g'(c)=0$이고, 이것이 $\mathrm{Q}$에서의 법선이 $\mathrm{P}$를 지난다는 식과 같다.
    steps:
    - id: 1a
      content: |
        $g'(c)=2(c-a)+2f'(c)(f(c)-b)=0\iff b=-\dfrac{1}{f'(c)}(a-c)+f(c)$ (법선이 $\mathrm{P}$를 지남)
      criteria: ['1.M1', '1.R1']
    hint_ladder:
    - 거리 대신 거리의 제곱을 $x$의 함수로 놓아 보자.
    - 최솟값을 갖는 점은 극소점이다. 그 점에서 도함수는?
    - 얻은 식을 $\mathrm{Q}$를 지나고 접선에 수직인 직선의 방정식과 비교하자.
  - id: S1-B
    audience: B
    source_flow: 2024 보고서 문항카드 7 예시답안 PDF p.143(인쇄 쪽 140)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=f(x)$ 위의 점 $\mathrm{Q}(c,f(c))$에서 곡선 $y=f(x)$에 접하는 접선과 수직이며 점 $\mathrm{Q}$를 지나는 직선을 $\ell$이라 하자. 이 직선 $\ell$이 점 $\mathrm{P}(a,b)$를 지난다는 것을 보이면 된다. 직선 $\ell$의 방정식은 $y=-\dfrac{1}{f'(c)}(x-c)+f(c)$이므로
        $$b=-\dfrac{1}{f'(c)}(a-c)+f(c)\quad\cdots(*)$$
        를 만족함을 보이면 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        곡선 위의 점 $(x,f(x))$에서 점 $\mathrm{P}$까지의 거리의 제곱을 $g(x)=(x-a)^2+(f(x)-b)^2=x^2-2ax+a^2+f(x)\cdot f(x)-2bf(x)+b^2$이라 하자. 미분가능한 함수 $g(x)$는 $x=c$에서 최솟값을 가지므로 극소가 된다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        도함수 $g'(x)=2(x-a)+2f'(x)(f(x)-b)$는 $g'(c)=0$을 만족하므로 $2(c-a)+2f'(c)(f(c)-b)=0$을 얻는다. 이 식은 식 $(*)$과 같으므로 직선 $\ell$은 점 $\mathrm{P}$를 지난다. 즉 $\mathrm{Q}$에서의 접선은 직선 $\mathrm{PQ}$에 수직이다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        참고: $f'(c)=0$인 경우 $2(c-a)+2f'(c)(f(c)-b)=0$에서 $a=c$가 되고 직선 $\ell$의 방정식은 $x=c$이므로, 이 경우에도 $\ell$은 점 $\mathrm{P}$를 지난다.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\mathrm{Q}$에서의 법선(접선에 수직인 직선)의 방정식과, 거리의 제곱 함수 $g(x)$를 세웠다. (공식 채점기준 1-ⅰ 「접선의 방정식을 계산할 수 있다」 8점 중 세부 배분은 자체 설정)
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        최솟값이 극소이므로 $g'(c)=0$이고, 그 식이 법선이 $\mathrm{P}$를 지나는 조건과 같음을 밝혔다($f'(c)=0$인 경우 포함).
      depends_on: [1.M1]
      steps: [1b-3, 1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 1-ⅱ] 실수 전체의 집합에서 미분가능한 두 함수 $g(x)$와 $h(x)$에 대하여, 곡선 $y=g(x)$와 곡선 $y=h(x)$가 서로 만나지 않는다고 하자. 곡선 $y=g(x)$ 위의 점 $\mathrm{Q}$와 곡선 $y=h(x)$ 위의 점 $\mathrm{R}$에 대해 선분 $\mathrm{QR}$의 길이가 최소일 때, 점 $\mathrm{Q}$에서 곡선 $y=g(x)$에 접하는 접선과 점 $\mathrm{R}$에서 곡선 $y=h(x)$에 접하는 접선이 모두 직선 $\mathrm{QR}$에 수직인 이유를 논하시오.
  points: 6
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{Q}$를 고정하면 $\mathrm{R}$은 $y=h(x)$ 위에서 $\mathrm{Q}$까지 거리가 최소인 점이므로 (ⅰ)을 적용하고, 역할을 바꾸어 한 번 더 적용한다.
    steps:
    - id: 2a
      content: |
        (ⅰ)을 $(\mathrm{R};\mathrm{Q})$, $(\mathrm{Q};\mathrm{R})$에 각각 적용 → 두 법선이 모두 직선 $\mathrm{QR}$
      criteria: ['2.M1', '2.R1']
    hint_ladder:
    - 한 점을 고정하면 (ⅰ)의 상황이 된다.
  - id: S2-B
    audience: B
    source_flow: 2024 보고서 문항카드 7 예시답안 PDF p.143-144(인쇄 쪽 140-141)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{Q}$에서 곡선 $y=g(x)$에 접하는 접선과 수직이며 점 $\mathrm{Q}$를 지나는 직선을 $\ell_1$, 점 $\mathrm{R}$에서 곡선 $y=h(x)$에 접하는 접선과 수직이며 점 $\mathrm{R}$을 지나는 직선을 $\ell_2$라 하자.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        점 $\mathrm{Q}$를 고정하고 곡선 $y=h(x)$ 위의 점 중에서 점 $\mathrm{Q}$까지의 거리가 최소인 점을 $\mathrm{R}$이라고 할 때, 선분 $\mathrm{QR}$의 길이가 최소가 되어야 하므로 [문제 1-ⅰ]에 의해 직선 $\ell_2$가 점 $\mathrm{Q}$를 지난다. 같은 이유로 직선 $\ell_1$은 점 $\mathrm{R}$을 지난다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        따라서 직선 $\ell_1$과 $\ell_2$는 모두 직선 $\mathrm{QR}$과 같으므로, 점 $\mathrm{Q}$에서 곡선 $y=g(x)$에 접하는 접선과 점 $\mathrm{R}$에서 곡선 $y=h(x)$에 접하는 접선은 모두 직선 $\mathrm{QR}$에 수직이다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        한 점을 고정하여 [문제 1-ⅰ]의 상황(곡선 밖의 점에서 최단거리)으로 바꾸었다. (공식 채점기준 1-ⅱ 6점 중 세부 배분은 자체 설정)
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        두 법선 $\ell_1$, $\ell_2$가 모두 직선 $\mathrm{QR}$과 일치함을 밝혀 두 접선이 $\mathrm{QR}$에 수직이라고 결론지었다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 1-ⅲ] <제시문2>의 네 점 $\mathrm{A},\mathrm{B},\mathrm{C},\mathrm{D}$에 대해 $\overline{\mathrm{AB}}+\overline{\mathrm{BC}}+\overline{\mathrm{CD}}$의 값이 최소가 될 때, 점 $\mathrm{D}$의 $x$좌표와 점 $\mathrm{A}$의 $y$좌표의 차가 $6$이라고 한다. 이때, 점 $\mathrm{A}$와 $\mathrm{D}$의 좌표를 구하고 그 이유를 논하시오.
  points: 16
  depends_on: ['2']
  answer: {kind: expression, value: 'A=(2,1); D=(7,1)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{A}(a,b)$를 $y=x$에 대칭이동한 $\mathrm{A}'(b,a)$는 $y=x^2+1$ 위, $\mathrm{D}(c,d)$를 $y=0$에 대칭이동한 $\mathrm{D}'(c,-d)$는 $y=-2x^2+30x-113$ 위에 있고, 최소일 때 두 접선이 평행하다.
    steps:
    - id: 3a
      content: |
        $2b=-4c+30$, $c-b=6$ → $b=1$, $c=7$ → $\mathrm{A}(2,1)$, $\mathrm{D}(7,1)$
      criteria: ['3.M1', '3.M2', '3.A1']
    hint_ladder:
    - 꺾은선의 길이를 줄이려면 대칭이동으로 펴 보자.
    - $\mathrm{A}$를 직선 $y=x$에 대해, $\mathrm{D}$를 직선 $y=0$에 대해 옮기면 어떤 곡선 위에 놓이는가?
    - (ⅱ)에 의해 최단 선분의 양 끝에서의 접선은 서로 평행하다.
  - id: S3-B
    audience: B
    source_flow: 2024 보고서 문항카드 7 예시답안 PDF p.144(인쇄 쪽 141)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        곡선 $y=\sqrt{x-1}$ $(x\ge1)$을 직선 $y=x$에 대해 대칭시키면 $y=x^2+1$ $(x\ge0)$이 되고 곡선 $y=2x^2-30x+113$을 직선 $y=0$에 대해 대칭시키면 $y=-2x^2+30x-113$이 된다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        점 $\mathrm{A}(a,b)$를 직선 $y=x$에 대해 대칭시켜 얻은 점을 $\mathrm{A}'(b,a)$, 점 $\mathrm{D}(c,d)$를 직선 $y=0$에 대해 대칭시켜 얻은 점을 $\mathrm{D}'(c,-d)$라 하면 $\overline{\mathrm{AB}}+\overline{\mathrm{BC}}+\overline{\mathrm{CD}}=\overline{\mathrm{A'B}}+\overline{\mathrm{BC}}+\overline{\mathrm{CD'}}$이다. 따라서 이 합이 최소가 될 때는 점 $\mathrm{A}',\mathrm{B},\mathrm{C},\mathrm{D}'$이 한 직선 위에 있고, 선분 $\mathrm{A'D'}$의 길이가 두 포물선 사이의 최소 거리가 될 때이다. 주어진 조건으로부터 $c-b=6$을 얻는다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        [문제 1-ⅱ]에 의해 점 $\mathrm{A}'$에서 곡선 $y=x^2+1$에 접하는 접선과 점 $\mathrm{D}'$에서 곡선 $y=-2x^2+30x-113$에 접하는 접선은 서로 평행하므로 기울기가 같다. 두 접선의 기울기를 비교하면 $2b=-4c+30$이 된다.
      criteria: ['3.M2']
    - id: 3b-4
      content: |
        이 식과 $c-b=6$을 연립하면 $b=1$, $c=7$을 얻는다. 따라서 $\mathrm{A}'=(1,2)$, $\mathrm{D}'=(7,-1)$이므로 $\mathrm{A}=(2,1)$, $\mathrm{D}=(7,1)$이다.
      criteria: ['3.A1']
