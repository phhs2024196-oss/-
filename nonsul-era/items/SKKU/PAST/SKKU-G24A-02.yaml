- id: '3'
  stem: |
    [문제 2-ⅲ] 양의 정수 $m,n$에 대해 <제시문3>에서 $x_3=\sqrt m$, $x_4=\sqrt n$이고, 네 점 $\mathrm{Q},\mathrm{R},\mathrm{S},\mathrm{T}$를 지나는 원의 반지름이 $10$이라 하자. 이때, <제시문3>을 만족하는 양의 정수 순서쌍 $(m,n)$의 개수를 구하고 그 이유를 논하시오.
  points: 15
  depends_on: ['2']
  answer: {kind: value, value: '76', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g(x)=-(x^2-m)(x^2-n)$, 네 교점을 지나는 원은 $x^2+\left(y-\tfrac{m+n}{2}\right)^2=\left(\tfrac{m-n}{2}\right)^2$이므로 $n-m=20$. 판별식에서 $m+n\le200$.
    steps:
    - id: 3a
      content: |
        $(m,n)=(1,21),\dots,(90,110)$의 90개 중 $m$ 또는 $n$이 완전제곱수인 $9+6-1=14$개 제외 → $76$
      criteria: ['3.M1', '3.M2', '3.A1']
    hint_ladder:
    - $g$는 우함수이고 $x$절편이 $\pm\sqrt m$, $\pm\sqrt n$이다.
    - $y=x^2$과 연립하면 $y$에 대한 이차방정식이 된다. (ⅱ)의 원의 방정식을 다시 쓰자.
    - $x_k$가 정수가 아니라는 조건을 잊지 말자.
  - id: S3-B
    audience: B
    source_flow: 2024 보고서 문항카드 8 예시답안 PDF p.150(인쇄 쪽 147)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        <제시문3>의 조건과 $x_3=\sqrt m$, $x_4=\sqrt n$이므로 $g(x)=-(x^2-m)(x^2-n)$이다. $y=x^2$과 $y=g(x)$가 네 개의 점에서 만나기 위해서는 $y=-(y-m)(y-n)$, 즉 $y^2-(m+n-1)y+mn=0$이 서로 다른 두 실근 $a,b$ $(0<a<b)$를 가져야 한다. 따라서 $D=(m+n-1)^2-4mn=(m-n)^2-2(m+n)+1>0$ ……①이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        한편, $\mathrm{S}(\sqrt a,a)$, $\mathrm{T}(\sqrt b,b)$라 하면, 네 점 $\mathrm{Q},\mathrm{R},\mathrm{S},\mathrm{T}$를 지나는 원의 방정식은 [문제 2-ⅱ]에서와 같이 $x^2+\left(y-\dfrac{a+b+1}{2}\right)^2=\left(\dfrac{a+b+1}{2}\right)^2-ab$이다. 근과 계수의 관계로부터 $a+b=m+n-1$, $ab=mn$이므로, 원의 방정식은 $x^2+\left(y-\dfrac{m+n}{2}\right)^2=\left(\dfrac{m-n}{2}\right)^2$이고, $n-m=20$이다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        이를 ①에 대입하면 $m+n\le200$이 성립한다. 따라서 가능한 순서쌍 $(m,n)$은 $(1,21),(2,22),\cdots,(90,110)$이다.
      criteria: ['3.A1']
    - id: 3b-4
      content: |
        이 중에서 완전제곱수인 $m$은 $m=1,4,9,16,25,36,49,64,81$의 $9$가지이고, 완전제곱수인 $n$은 $n=25,36,49,64,81,100$의 $6$가지이다. 여기서 $(m,n)=(16,36)$은 중복해서 발생하므로 $9+6-1=14$가지를 제외해야 한다. 따라서 문제의 개수는 $90-14=76$이다.
      criteria: ['3.A2']
