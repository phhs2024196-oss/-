intent: |
  이차함수·사차함수의 가장 기본적인 형태로부터 직선과 원의 방정식을 기하적·대수적으로 다루는 능력을 본다. 직선과 포물선의 교점, 근과 계수의 관계, 미지수 2개인 연립이차방정식, 판별식을 이용해 사다리꼴의 넓이와 조건을 만족하는 정수 순서쌍의 개수를 구한다(2024 보고서 문항카드 8 출제 의도 요약).
key_idea: |
  평행한 두 현의 중점은 $x=\dfrac k2$ 위에 있고, 네 점이 한 원 위에 있으면 $\mathrm{M}_1\mathrm{M}_2$가 중심을 지나 현에 수직이므로 $k=0$(현이 수평)이다. 원과 $y=x^2$의 교점은 $y$에 대한 이차방정식 $y^2+(1-2k)y+k^2-r^2=0$의 두 근으로 정해진다.
stuck: |
  $y=x^2$을 원의 방정식에 대입해 $x$가 아니라 $y$에 대한 이차방정식으로 보고, 근과 계수의 관계로 중심의 $y$좌표와 반지름을 두 근 $a,b$로 표현하는 발상
idea_tags: [IDEA-PARABOLA-CHORD-MIDPOINT, IDEA-SUBSTITUTE-Y-QUADRATIC, IDEA-VIETA-CIRCLE-PARABOLA]
tags: [포물선과 평행한 현, 원과 포물선의 교점, 정수 순서쌍 세기]
