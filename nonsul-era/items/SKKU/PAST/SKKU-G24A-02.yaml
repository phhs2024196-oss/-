stimuli:
- id: S1
  label: <제시문1>
  body: |
    기울기가 양수이고 서로 평행인 두 직선 $L_1$과 $L_2$의 $y$절편을 각각 $p$와 $0$이라 하자.(단, $p>0$) 직선 $L_1$이 이차함수 $y=x^2$의 그래프와 만나는 두 점을 $x$좌표의 값이 작은 것부터 $\mathrm{A},\mathrm{D}$라 하고, 직선 $L_2$가 이차함수 $y=x^2$의 그래프와 만나는 두 점을 $x$좌표의 값이 작은 것부터 $\mathrm{B},\mathrm{C}$라 하자. 사각형 $\mathrm{ABCD}$의 두 대각선의 교점을 $\mathrm{P}$, 선분 $\mathrm{AD}$의 중점을 $\mathrm{M}_1$, 선분 $\mathrm{BC}$의 중점을 $\mathrm{M}_2$라 하자.
- id: S2
  label: <제시문2>
  body: |
    이차함수 $y=x^2$과 반지름이 $r$인 원이 다음 세 조건을 만족시킨다.
    • 원의 중심의 $x$좌표와 $y$좌표가 모두 정수이다.
    • 이차함수 $y=x^2$과 원이 서로 다른 네 점에서 만나고, 교점의 $y$좌표는 모두 정수이다.
    • 네 교점을 꼭짓점으로 하는 사각형은 사다리꼴이다.
- id: S3
  label: <제시문3>
  body: |
    최고차항의 계수가 $-1$인 사차함수 $y=g(x)$가 $g(x)=g(-x)$를 만족하고, $x$축과 $x_1,x_2,x_3,x_4$에서 만난다. 또한, 사차함수 $y=g(x)$의 그래프와 이차함수 $y=x^2$의 그래프가 서로 다른 네 점 $\mathrm{Q},\mathrm{R},\mathrm{S},\mathrm{T}$에서 만난다고 가정하자.
    (단, $x_1<x_2<x_3<x_4$이고, $x_k(k=1,2,3,4)$는 정수가 아니다.)

stem: |
  다음 <제시문1> ~ <제시문3>을 읽고 [문제 2-ⅰ] ~ [문제 2-ⅲ]을 문항별로 풀이와 함께 답하시오. (40점)

subparts:
- id: '1'
  stem: |
    [문제 2-ⅰ] <제시문1>에서 $\overline{\mathrm{PM}_1}=5$이고 $\overline{\mathrm{PM}_2}=1$일 때, 사각형 $\mathrm{ABCD}$의 넓이를 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '18', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{M}_1$, $\mathrm{M}_2$의 $x$좌표가 모두 $\tfrac k2$이므로 $\mathrm{P}$도 그 위에 있고 $\overline{\mathrm{M}_1\mathrm{M}_2}=p=6$. 직선 $\mathrm{BP}$가 $\mathrm{D}$를 지나는 조건으로 $k=1$.
    steps:
    - id: 1a
      content: |
        $p=6$, $\mathrm{P}\left(\tfrac k2,\tfrac{k^2}{2}+1\right)$, $k^2+8=\left(\tfrac{k^2+2}{k}\right)^2\Rightarrow k=1$, 넓이 $18$
      criteria: ['1.M1', '1.A1']
    hint_ladder:
    - 두 직선 $y=kx+p$, $y=kx$와 $y=x^2$의 교점의 $x$좌표 합은 얼마인가?
    - $\mathrm{M}_1$, $\mathrm{M}_2$, $\mathrm{P}$는 한 수직선 위에 있다.
    - 대각선 $\mathrm{BD}$는 원점 $\mathrm{B}$와 $\mathrm{P}$를 지난다.
  - id: S1-B
    audience: B
    source_flow: 2024 보고서 문항카드 8 예시답안 PDF p.149(인쇄 쪽 146)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 직선 $L_1,L_2$의 기울기를 $k$라 하면 $L_1: y=kx+p$, $L_2: y=kx$이다. $L_2$와 $y=x^2$의 교점은 $\mathrm{B}(0,0)$와 $\mathrm{C}(k,k^2)$이고, 이로부터 $\mathrm{M}_2\left(\dfrac k2,\dfrac{k^2}{2}\right)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        두 점 $\mathrm{A},\mathrm{D}$의 $x$좌표를 각각 $x_1,x_2$라 하면 이차방정식 $x^2-kx-p=0$의 해이므로 $x_1+x_2=k$, $x_1x_2=-p$와 $\mathrm{M}_1\left(\dfrac k2,\dfrac{k^2}{2}+p\right)$를 얻는다. 두 점 $\mathrm{M}_1,\mathrm{M}_2$의 $x$좌표가 같고 $\overline{\mathrm{PM}_1}=5$, $\overline{\mathrm{PM}_2}=1$이므로 $\mathrm{P}\left(\dfrac k2,\dfrac{k^2}{2}+1\right)$, $\overline{\mathrm{M}_1\mathrm{M}_2}=p=6$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        직선 $\mathrm{BP}$의 방정식이 $y=\left(\dfrac{\frac{k^2}{2}+1}{\frac k2}\right)x=\left(\dfrac{k^2+2}{k}\right)x$이고, 이 직선과 $y=x^2$의 교점 중의 하나가 점 $\mathrm{D}$이므로 $(x_2,kx_2+p)=\left(\dfrac{k^2+2}{k},\left(\dfrac{k^2+2}{k}\right)^2\right)$. 즉 $kx_2+p=k\left(k+\dfrac2k\right)+6=k^2+8=\left(\dfrac{k^2+2}{k}\right)^2$이고, 정리하면 $k=1$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        따라서 $\mathrm{A}(-2,4)$, $\mathrm{B}(0,0)$, $\mathrm{C}(1,1)$, $\mathrm{D}(3,9)$이고, 이 네 점을 꼭짓점으로 하는 사각형은 사다리꼴이므로 그 넓이는 $(5\sqrt2+\sqrt2)\times\dfrac{6}{\sqrt2}\times\dfrac12=18$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        직선의 방정식과 근과 계수의 관계로 $\mathrm{M}_1$, $\mathrm{M}_2$의 좌표를 구하고 $p=6$, $\mathrm{P}$의 좌표를 얻었다. (공식 채점기준 2-ⅰ 10점 중 세부 배분은 자체 설정)
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        직선 $\mathrm{BP}$가 $\mathrm{D}$를 지나는 조건에서 $k=1$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        네 꼭짓점을 구하고 사다리꼴의 넓이 $18$을 얻었다.
      depends_on: [1.A1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 2-ⅱ] <제시문2>에서 $r=4$일 때, 사다리꼴의 넓이를 모두 구하고 그 이유를 논하시오.
  points: 15
  depends_on: ['1']
  answer: {kind: set, value: '{sqrt(16)+sqrt(15), 3*(sqrt(15)+sqrt(12)), 5*(sqrt(12)+sqrt(7))}', equivalents: ['{4+sqrt(15), 3*sqrt(15)+6*sqrt(3), 10*sqrt(3)+5*sqrt(7)}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 평행한 두 변의 중점을 잇는 선분이 원의 중심을 지나 두 변에 수직이므로 $k=0$. 원 $x^2+(y-k)^2=r^2$과 $y=x^2$의 교점의 $y$좌표 $a<b$에 대해 $(b-a)^2+2(a+b)=63$.
    steps:
    - id: 2a
      content: |
        $(b-a,a+b)=(1,31),(3,27),(5,19)$ → 넓이 $(\sqrt b+\sqrt a)(b-a)$: $\sqrt{16}+\sqrt{15}$, $3(\sqrt{15}+\sqrt{12})$, $5(\sqrt{12}+\sqrt7)$
      criteria: ['2.M1', '2.M2', '2.A1']
    hint_ladder:
    - (ⅰ)처럼 평행한 두 변의 중점은 같은 수직선 위에 있다. 이 선분은 원의 중심을 지난다.
    - $x^2=y$를 원의 방정식에 대입해 $y$에 대한 이차방정식을 만들자.
    - $\dfrac{a+b+1}{2}$가 정수이므로 $b-a$는 홀수이다.
  - id: S2-B
    audience: B
    source_flow: 2024 보고서 문항카드 8 예시답안 PDF p.149-150(인쇄 쪽 146-147)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $y=x^2$과 원의 교점을 $x$좌표의 값이 작은 순으로 $\mathrm{A},\mathrm{B},\mathrm{C},\mathrm{D}$라 하고, <제시문1>과 같이 $\mathrm{P}$, $\mathrm{M}_1$, $\mathrm{M}_2$를 잡는다. 직선 $y=kx+p$가 $y=x^2$과 만나는 두 교점의 $x$좌표값의 합은 항상 $k$이다. <제시문2>의 조건으로부터 두 직선 $\mathrm{AD}$와 $\mathrm{BC}$가 서로 평행이고, 그 기울기를 $k$라 하면 $\mathrm{M}_1$과 $\mathrm{M}_2$는 $y$축과 평행한 직선 $x=\dfrac k2$ 위에 놓이게 된다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\mathrm{A},\mathrm{B},\mathrm{C},\mathrm{D}$가 한 원 위에 있으므로 선분 $\mathrm{M}_1\mathrm{M}_2$는 원의 중심을 지나게 되고 두 직선 $\mathrm{AD}$와 $\mathrm{BC}$는 수직이다. 따라서 $k=0$이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        이제 점 $\mathrm{C},\mathrm{D}$가 $y=x^2$ 위의 점이므로 $\mathrm{C}(\sqrt a,a)$, $\mathrm{D}(\sqrt b,b)$ $(b>a>0)$라 하자. 점 $\mathrm{A},\mathrm{B},\mathrm{C},\mathrm{D}$를 지나는 원의 방정식을 $x^2+(y-k)^2=r^2$이라 하면 $y^2+(1-2k)y+k^2-r^2=0$의 두 근이 $a,b$이므로 근과 계수의 관계에 의해 $a+b=2k-1$, $ab=k^2-r^2$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        따라서 $k=\dfrac{a+b+1}{2}$, $r^2=\left(\dfrac{a+b+1}{2}\right)^2-ab$이다. $r=4$이므로 $\left(\dfrac{a+b+1}{2}\right)^2-ab=16$이고 <제시문2>의 조건으로부터 $\dfrac{a+b+1}{2}$는 정수이다. 이 식을 정리하면 $(b-a)^2+2(a+b)=63$이고 $b-a$는 홀수이다. 가능한 경우는 $(b-a,\,b+a,\,a,\,b)=(1,31,15,16),\ (3,27,12,15),\ (5,19,7,12)$이다.
      criteria: ['2.A1']
    - id: 2b-5
      content: |
        사다리꼴 $\mathrm{ABCD}$의 넓이는 $(\sqrt b+\sqrt a)(b-a)$이므로 각 경우의 넓이는 $\sqrt{16}+\sqrt{15}$, $3(\sqrt{15}+\sqrt{12})$, $5(\sqrt{12}+\sqrt7)$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
