intent: |
  제시문의 이차함수들 사이의 관계를 이해하고, 이차함수 그래프 위의 한 점에서의 접선과 그 점에서 접선에 수직인 직선의 방정식으로부터 주어진 관계를 수식으로 표현한 뒤, 근과 계수의 관계·정수 조건으로 계수를 결정하고 정적분으로 넓이의 최솟값을 구할 수 있는지 평가한다(2024 보고서 문항카드 9 출제 의도 요약).
key_idea: |
  $\alpha=-\dfrac rq$, $\beta=qr$이므로 $-\alpha\beta=r^2=\dfrac CA$(제곱수)이고, $B^2+4AC=100$에서 $B$는 $10$ 이하의 짝수, $AC=\dfrac{100-B^2}{4}$이다.
stuck: |
  $\alpha\beta=-r^2$를 근과 계수의 관계 $\alpha\beta=-\dfrac CA$와 연결해 $\dfrac CA$가 (정수의) 제곱수라는 조건으로 경우를 줄이는 발상
idea_tags: [IDEA-TANGENT-NORMAL-INTERCEPTS, IDEA-VIETA-INTEGER-CASES]
tags: [접선과 법선의 절편, 정수 조건 경우 나누기, 넓이의 최솟값]
