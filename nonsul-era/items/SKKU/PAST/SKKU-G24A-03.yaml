stimuli:
- id: S1
  label: <제시문1>
  body: |
    함수 $h(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 곡선 $y=h(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b|h(x)|dx$$
- id: S2
  label: <제시문2>
  body: |
    정수 계수를 갖는 두 이차함수
    $$f(x)=-Ax^2+Bx+C,\qquad g(x)=-px^2+qx+r$$
    가 다음의 다섯 조건을 만족시킨다.
    • $A,B,C,p,q,r$는 모두 양수이고, $B>C$이다.
    • $B^2+4AC=100$이고 $q^2+4pr$는 완전제곱수이다.
    • 이차함수 $y=g(x)$의 그래프 위의 점 $\mathrm{R}(0,r)$에서의 접선이 $x$축과 만나는 교점을 $\mathrm{P}(\alpha,0)$이라고 하자.
    • 점 $\mathrm{R}(0,r)$를 지나고 직선 $\mathrm{PR}$에 수직인 직선이 $x$축과 만나는 교점을 $\mathrm{Q}(\beta,0)$이라고 하자.
    • $\alpha$와 $\beta$는 이차방정식 $f(x)=0$의 해이다.

stem: |
  다음 <제시문1>과 <제시문2>를 읽고 [문제 3-ⅰ] ~ [문제 3-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    [문제 3-ⅰ] <제시문2>에 주어진 $\alpha,\beta$를 $q,r$에 대한 식으로 나타내고, 그 이유를 논하시오.
  points: 8
  depends_on: []
  answer: {kind: expression, value: 'alpha=-r/q; beta=q*r', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g^{\prime}(0)=q$이므로 접선 $y=qx+r$의 $x$절편이 $\alpha$, 수직인 직선 $y=-\tfrac1q x+r$의 $x$절편이 $\beta$.
    steps:
    - id: 1a
      content: |
        $\alpha=-\dfrac rq$, $\beta=qr$
      criteria: ['1.M1', '1.A1']
    hint_ladder:
    - $\mathrm{R}$에서의 접선의 기울기는 $g^{\prime}(0)$이다.
    - 수직인 직선의 기울기는 $-\dfrac1q$이다.
  - id: S1-B
    audience: B
    source_flow: 2024 보고서 문항카드 9 예시답안 PDF p.153(인쇄 쪽 150)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $g(x)$의 도함수 $g^{\prime}(x)=-2px+q$이고 여기에 $x=0$을 대입하면 $g^{\prime}(0)=q$가 된다. 따라서 포물선 $y=g(x)$ 위의 점 $\mathrm{R}(0,r)$에서의 접선의 방정식은 $y=qx+r$이 되고, $x$절편은 $-\dfrac rq$이므로 $\alpha=-\dfrac rq$이 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        또한 포물선 $y=g(x)$ 위의 점 $\mathrm{R}(0,r)$를 지나고 직선 $\mathrm{PR}$에 수직인 직선의 방정식은 $y=-\dfrac1qx+r$이 되고, 이 직선의 $x$절편은 $qr$이므로 $\beta=qr$이 된다. 답: $\alpha=-\dfrac rq$, $\beta=qr$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\mathrm{R}$에서의 접선 $y=qx+r$을 구해 $\alpha=-\tfrac rq$를 얻었다. (공식 채점기준 3-ⅰ 8점 중 세부 배분은 자체 설정)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        수직인 직선 $y=-\tfrac1qx+r$의 $x$절편으로 $\beta=qr$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 3-ⅱ] <제시문2>를 만족시키는 모든 순서쌍 $(A,B,C)$와 각각의 순서쌍에 대해 $p$의 값이 최소가 되도록 하는 순서쌍 $(p,q,r)$를 찾고, 그 이유를 논하시오.
  points: 12
  depends_on: ['1']
  answer: {kind: set, value: '{(3,8,3,4,3,1), (4,6,4,3,2,1)}', equivalents: ['(A,B,C)=(3,8,3)일 때 (p,q,r)=(4,3,1); (A,B,C)=(4,6,4)일 때 (p,q,r)=(3,2,1)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $B$는 $10$ 이하의 짝수, $A,C$는 $\tfrac{100-B^2}{4}$의 약수, $\tfrac CA=r^2$은 제곱수 → $(3,8,3)$, $(4,6,4)$.
    steps:
    - id: 2a
      content: |
        $(3,8,3)$: $(\alpha,\beta)=(-\tfrac13,3)$, $(q,r)=(3,1)$, $9+4p$ 제곱 → $p=4$. $(4,6,4)$: $(-\tfrac12,2)$, $(q,r)=(2,1)$, $4+4p$ 제곱 → $p=3$.
      criteria: ['2.M1', '2.A1', '2.A2']
    hint_ladder:
    - $B^2\le B^2+4AC=100$이다. $B$의 홀짝은?
    - $\alpha\beta$를 (ⅰ)로 계산하고 근과 계수의 관계와 비교하자.
  - id: S2-B
    audience: B
    source_flow: 2024 보고서 문항카드 9 예시답안 PDF p.153-154(인쇄 쪽 150-151)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        제시문의 조건으로부터 다음이 성립한다.
        • $B>C$
        • $B^2\le B^2+4AC=100$이므로, $B\le10$이고 $B$는 짝수이다.
        • $A$와 $C$는 $\dfrac{100-B^2}{4}$의 약수이다.
        • $-\alpha\beta=r^2$이므로, 근과 계수의 관계로부터 $\dfrac CA$는 제곱수이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이로부터 가능한 순서쌍 $(A,B,C)$는 두 쌍이 존재한다. $B=8$, $AC=9$일 때 $(A,B,C)=(3,8,3)$, $(\alpha,\beta)=\left(-\dfrac13,3\right)$, $(q,r)=(3,1)$이고, $B=6$, $AC=16$일 때 $(A,B,C)=(4,6,4)$, $(\alpha,\beta)=\left(-\dfrac12,2\right)$, $(q,r)=(2,1)$이다. (각 순서쌍에 대해 $f(x)=0$의 두 실근 $\alpha,\beta$를 구하고 [문제 3-ⅰ]의 결과로부터 $q,r$을 구한다.)
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        마지막으로 $q^2+4pr$가 완전제곱수가 되도록 하는 $p$ 중에서 최소인 것을 구하면 $(A,B,C)=(3,8,3)$일 때 $(p,q,r)=(4,3,1)$, $(A,B,C)=(4,6,4)$일 때 $(p,q,r)=(3,2,1)$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $B$가 $10$ 이하의 짝수, $A,C$가 $\tfrac{100-B^2}{4}$의 약수, $\tfrac CA$가 제곱수라는 조건을 이끌었다. (공식 채점기준 3-ⅱ 12점 중 세부 배분은 자체 설정)
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        $(A,B,C)=(3,8,3)$, $(4,6,4)$를 모두 찾고 각각 $(q,r)=(3,1)$, $(2,1)$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: |
        완전제곱 조건에서 최소 $p$를 찾아 $(p,q,r)=(4,3,1)$, $(3,2,1)$을 얻었다.
      depends_on: [2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 3-ⅲ] <제시문2>에서 직선 $\mathrm{PR}$와 곡선 $y=g(x)$ 및 $x$축($x<0$)으로 둘러싸인 도형의 넓이의 최솟값을 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: value, value: '1/32', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 넓이 $=\tfrac12|\alpha|r-\int_\gamma^0 g(x)dx$이고, $q,r$ 고정이면 $p$가 최소일 때 빼는 넓이가 최대 → (ⅱ)의 두 경우만 비교.
    steps:
    - id: 3a
      content: |
        $(4,3,1)$: $\gamma=-\tfrac14$, 넓이 $\tfrac1{32}$; $(3,2,1)$: $\gamma=-\tfrac13$, 넓이 $\tfrac7{108}$ → 최솟값 $\tfrac1{32}$
      criteria: ['3.M1', '3.M2', '3.A1']
    hint_ladder:
    - 구하는 도형은 삼각형 $\mathrm{POR}$에서 곡선 아래 부분을 뺀 것이다.
    - $q,r$이 고정되면 $p$가 작을수록 곡선 아래 넓이가 커진다.
  - id: S3-B
    audience: B
    source_flow: 2024 보고서 문항카드 9 예시답안 PDF p.154(인쇄 쪽 151)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $g(x)=0$의 두 근 중에서 음수인 근을 $\gamma$로 놓자. 선분 $\mathrm{PR}$와, 곡선 $y=g(x)$ 및 $x$축($x<0$)으로 둘러싸인 도형의 넓이는
        $$\frac12|\alpha|r-\int_\gamma^0(-px^2+qx+r)\,dx=\frac12|\alpha|r-\frac p3\gamma^3+\frac q2\gamma^2+r\gamma$$
        와 같다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        이 도형의 넓이가 최소가 되기 위해서는 곡선 $y=g(x)$, $x$축($x<0$), $y$축($y>0$)으로 둘러싸인 도형의 넓이가 최대가 되어야 한다. 고정된 $q$와 $r$에 대하여, $p$의 값이 최소일 때 이 넓이는 최대가 된다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        [문제 3-ⅱ]의 풀이에서 구한 순서쌍 $(p,q,r)$로부터 $g(x)=0$의 음수인 근 $\gamma$를 구하여 넓이 공식에 대입하면 $(A,B,C)=(3,8,3)$, $(p,q,r)=(4,3,1)$일 때 $\gamma=-\dfrac14$, 넓이 $\dfrac1{32}$이고, $(A,B,C)=(4,6,4)$, $(p,q,r)=(3,2,1)$일 때 $\gamma=-\dfrac13$, 넓이 $\dfrac7{108}$이다. 이로부터 넓이가 최소가 되는 경우는 $(A,B,C)=(3,8,3)$인 경우이고, 이때 넓이의 값은 $\dfrac1{32}$이다.
      criteria: ['3.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        도형의 넓이를 삼각형 넓이와 정적분으로 $\tfrac12|\alpha|r-\int_\gamma^0g(x)dx$로 표시했다. (공식 채점기준 3-ⅲ 10점 중 세부 배분은 자체 설정)
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
