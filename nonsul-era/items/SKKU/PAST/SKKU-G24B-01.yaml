intent: |
  다항함수들 사이에 놓인 미지의 미분가능한 함수에 대해, 둘러싼 다항함수의 분석으로 두 미지 함수의 대소 관계를 논리적으로 밝히고, 그 정보로 특정 점에서의 미분계수를 구하며, 극한값이 존재하기 위한 조건을 앞 문제의 결과로 구하는 능력을 본다. 하위 문제들이 유기적으로 연결되어 점차 심화된다(2024 보고서 문항카드 10 출제 의도 요약).
key_idea: |
  끼인 함수 $f$가 경계 함수와 한 점에서 만나면 차 $f-A\ge0$이 그 점에서 최솟값(극소) $0$을 가지므로 $f^{\prime}=A^{\prime}$이다. $A-D=(x-2)^2(x+2)$, $B-C$의 최댓값 $22$($x=1,3$)가 접점을 결정한다.
stuck: |
  극한이 존재하려면 분자 $\to0$이어야 하고, 그 조건 $f(a)=g(a)$ 또는 $f(b)-g(b)=22$가 경계 함수들의 접점에서만 가능하다는 연결
idea_tags: [IDEA-SQUEEZE-TANGENT-DERIVATIVE, IDEA-LIMIT-EXISTENCE-ZERO-NUMERATOR]
tags: [끼인 함수의 미분계수, 미분계수의 정의, 극한 존재 조건]
elements:
  materials:
  - '$A(x)=x^3-3x^2+2x+8$, $B(x)=-x^4+8x^3-22x^2+25x+13$, $C(x)=x$, $D(x)=-x^2+6x$'
  - '$0<x<3.5$에서 $A\le f\le B$, $C\le g\le D$인 미분가능한 함수 $f,g$'
  - '극한 $\lim_{h\to0}\frac{f(a+3h)-g(a+5h)}{h}$, $\lim_{h\to0}\frac{f(b+4h)-g(b-3h)-22}{h}$'
  concepts:
  - '미분계수의 정의'
  - '극대·극소와 도함수(극값에서 $f^{\prime}=0$)'
  - '함수의 최대와 최소'
  - '함수의 극한의 성질'
  - '다항식의 인수분해'
  tools:
  - '$h(x)=A(x)-D(x)=(x-2)^2(x+2)\ge0$'
  - '$k(x)=f(x)-A(x)\ge0$, $k(1)=0$이면 극소 → $k^{\prime}(1)=0$'
  - '$p(x)=B(x)-C(x)$, $p^{\prime}(x)=-4(x-1)(x-2)(x-3)$'
  - '분자를 $f(a+3h)-f(a)$, $g(a+5h)-g(a)$로 나누어 미분계수로 변형'
  conditions:
  - '구간 $0<x<3.5$(열린구간)에서만 부등식 성립'
  - '극한 존재 → 분자의 극한 $0$'
  stimuli_used: [S1, S2]
  subpart_links: '(ⅲ)은 (ⅰ)의 등호 조건 $x=2$와 (ⅱ)의 접점 미분 논리를, (ⅳ)는 (ⅱ)의 논리를 $B-C$의 최댓값에 적용'

