intent: |
  제시문에 주어진 원과 직선들 간의 위치 관계를 파악하여 교점들을 원 위에 표시하고, 원주각과 중심각의 성질을 활용해 원 위의 점들이 규칙적인 패턴을 이룬다는 것을 이해한 뒤, 이 점들로 만들어지는 호의 길이와 도형의 넓이 등을 구할 수 있는지 평가한다(2024 보고서 문항카드 11 출제 의도 요약).
key_idea: |
  기울기 $1$($\tfrac\pi4$)과 $\sqrt3$($\tfrac\pi3$)인 현이 번갈아 나오므로 이웃한 두 현이 이루는 원주각이 항상 $\tfrac\pi{12}$, 즉 $\mathrm{P}_n$과 $\mathrm{P}_{n+2}$ 사이의 중심각이 $\tfrac\pi6$이다. 접하는 순간($\mathrm{P}_{10}=\mathrm{P}_9$) 진행 방향이 뒤집혀 주기 $24$로 반복된다.
stuck: |
  $\mathrm{P}_9$에서 기울기 $\sqrt3$인 직선이 원에 접해 $\mathrm{P}_{10}=\mathrm{P}_9$가 되고 이후 점들이 거꾸로 되돌아간다는 것을 알아채고, $\mathrm{P}_{24+n}=\mathrm{P}_n$의 주기를 찾는 것
