stimuli:
- id: S1
  label: <제시문1>
  body: |
    자연수 $n$에 대하여, 수열 $\{t_n\}$을 다음과 같이 정의하자. $n$이 홀수일 때 $t_n=3$이고, $n$이 짝수일 때 $t_n=4$이다. 점 $\mathrm{P}_0(-1,0)$에서 그은 기울기가 $\tan\left(\dfrac{t_1}{12}\pi\right)$인 직선이 원 $x^2+y^2=1$과 다시 만나는 점을 $\mathrm{P}_1$이라 하자. 자연수 $n$에 대하여, 점 $\mathrm{P}_n$에서 그은 기울기가 $\tan\left(\dfrac{t_{n+1}}{12}\pi\right)$인 직선이 원 $x^2+y^2=1$과 다시 만나는 점을 $\mathrm{P}_{n+1}$이라 하자. 만약 이 직선이 원과 접할 경우, $\mathrm{P}_{n+1}=\mathrm{P}_n$이다.
- id: S2
  label: <제시문2>
  body: |
    음이 아닌 정수 $n$에 대하여, $A(n)$을 삼각형 $\mathrm{P}_n\mathrm{P}_{n+1}\mathrm{P}_{n+2}$의 넓이라 하자. (단, 세 점 $\mathrm{P}_n$, $\mathrm{P}_{n+1}$, $\mathrm{P}_{n+2}$ 중에서 두 점이 서로 일치할 경우, $A(n)=0$이다.)

stem: |
  다음 <제시문1>과 <제시문2>를 읽고 [문제 2-ⅰ] ~ [문제 2-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    [문제 2-ⅰ] $0\le n\le7$인 정수 $n$에 대하여 호 $\mathrm{P}_n\mathrm{P}_{n+2}$의 길이가 항상 일정함을 보이고, 그 값을 구하시오.
    (단, 호 $\mathrm{P}_n\mathrm{P}_{n+2}$는 두 점 $\mathrm{P}_n$, $\mathrm{P}_{n+2}$에 의하여 나누어지는 원 $x^2+y^2=1$의 두 부분 중 길이가 짧은 것으로 한다.)
  points: 10
  depends_on: []
  answer: {kind: value, value: 'pi/6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 기울기 $1$과 $\sqrt3$인 현이 번갈아 나오므로 $\angle\mathrm{P}_n\mathrm{P}_{n+1}\mathrm{P}_{n+2}=\tfrac\pi3-\tfrac\pi4=\tfrac\pi{12}$, 중심각 $\tfrac\pi6$, 반지름 $1$이므로 호의 길이 $\tfrac\pi6$.
    steps:
    - id: 1a
      content: |
        원주각 $\tfrac\pi{12}$ → 중심각 $\tfrac\pi6$ → 호의 길이 $\tfrac\pi6$
      criteria: ['1.M1', '1.A1']
    hint_ladder:
    - $\tan\tfrac{3\pi}{12}$, $\tan\tfrac{4\pi}{12}$의 값을 구하자.
    - 연속한 두 현이 $x$축과 이루는 각의 차가 원주각이다.
  - id: S1-B
    audience: B
    source_flow: 2024 보고서 문항카드 11 예시답안 PDF p.162(인쇄 쪽 159)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P}_0(-1,0)$에서 그은 기울기가 $\tan\left(\dfrac{t_1\pi}{12}\right)=\tan\left(\dfrac{3\pi}{12}\right)=1$인 직선이 원 $x^2+y^2=1$과 다시 만나는 점은 $(0,1)$이므로, 점 $\mathrm{P}_1$의 좌표는 $(0,1)$이다. 또한 $n$이 홀수이면, 점 $\mathrm{P}_n$에서 그은 기울기가 $\tan\left(\dfrac{t_{n+1}\pi}{12}\right)=\tan\left(\dfrac{4\pi}{12}\right)=\sqrt3$인 직선이 원과 다시 만나는 점이 $\mathrm{P}_{n+1}$이 된다. 만약 $n$이 짝수이면, 기울기가 $\tan\left(\dfrac{3\pi}{12}\right)=1$인 직선이 원과 다시 만나는 점이 $\mathrm{P}_{n+1}$이 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        [그림: 단위원 위의 점 $\mathrm{P}_0,\mathrm{P}_1,\dots,\mathrm{P}_9$와 현 $\mathrm{P}_0\mathrm{P}_1,\mathrm{P}_1\mathrm{P}_2,\dots,\mathrm{P}_8\mathrm{P}_9$. $\mathrm{P}_0$은 왼쪽 끝 $(-1,0)$, $\mathrm{P}_1$은 맨 위, 짝수 번째 점 $\mathrm{P}_2,\mathrm{P}_4,\mathrm{P}_6,\mathrm{P}_8$은 원의 왼쪽 아래에서 오른쪽 아래로, 홀수 번째 점 $\mathrm{P}_1,\mathrm{P}_3,\mathrm{P}_5,\mathrm{P}_7,\mathrm{P}_9$는 위에서 오른쪽으로 차례로 놓이며 현들이 지그재그로 그려져 있다.]
        선분 $\mathrm{P}_0\mathrm{P}_1$이 $x$축과 이루는 각이 $\dfrac\pi4$이고, 선분 $\mathrm{P}_1\mathrm{P}_2$가 $x$축과 이루는 각이 $\dfrac\pi3$이므로, 호 $\mathrm{P}_0\mathrm{P}_2$에 대한 원주각 $\angle\mathrm{P}_0\mathrm{P}_1\mathrm{P}_2=\dfrac\pi{12}$임을 알 수 있다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        따라서 호 $\mathrm{P}_0\mathrm{P}_2$에 대한 중심각은 $\dfrac\pi6$가 되므로, 호 $\mathrm{P}_0\mathrm{P}_2$의 길이도 $\dfrac\pi6$가 된다. 동일한 방법으로, $1\le n\le7$인 자연수 $n$에 대하여 호 $\mathrm{P}_n\mathrm{P}_{n+2}$에 대한 원주각 $\angle\mathrm{P}_n\mathrm{P}_{n+1}\mathrm{P}_{n+2}=\dfrac\pi{12}$가 되므로, 호 $\mathrm{P}_n\mathrm{P}_{n+2}$에 대한 중심각은 $\dfrac\pi6$가 되고, 호 $\mathrm{P}_n\mathrm{P}_{n+2}$의 길이 역시 $\dfrac\pi6$로 항상 일정하게 된다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        교점들을 원 위에 표시하고 이웃한 두 현이 $x$축과 이루는 각 $\tfrac\pi4$, $\tfrac\pi3$로부터 원주각 $\tfrac\pi{12}$를 얻었다. (공식 채점기준 2-ⅰ 10점 중 세부 배분은 자체 설정)
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        중심각 $\tfrac\pi6$에서 호의 길이 $\tfrac\pi6$가 $0\le n\le7$에서 일정함을 밝혔다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 2-ⅱ] 점 $\mathrm{P}_{2024}$의 좌표를 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: '(1/2, -sqrt(3)/2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}_9$에서 기울기 $\sqrt3$인 직선이 접해 $\mathrm{P}_{10}=\mathrm{P}_9$, 이후 점들이 되돌아가며 $\mathrm{P}_{24+n}=\mathrm{P}_n$. $2024=24\times84+8$이므로 $\mathrm{P}_{2024}=\mathrm{P}_8$.
    steps:
    - id: 2a
      content: |
        $\mathrm{P}_{2024}=\mathrm{P}_8=\left(\tfrac12,-\tfrac{\sqrt3}{2}\right)$
      criteria: ['2.M1', '2.A1']
    hint_ladder:
    - $\mathrm{P}_9$의 위치에서 기울기 $\sqrt3$인 직선은 원과 어떤 관계인가?
    - 접한 뒤에는 같은 현을 거꾸로 밟아 간다.
  - id: S2-B
    audience: B
    source_flow: 2024 보고서 문항카드 11 예시답안 PDF p.162-163(인쇄 쪽 159-160)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{P}_9$에서 그은 기울기가 $\sqrt3$인 직선은 원과 접하게 되므로, $\mathrm{P}_{10}=\mathrm{P}_9$이 된다. 이제 점 $\mathrm{P}_{10}$에서 그은 기울기가 $1$인 직선은 원과 점 $\mathrm{P}_8$에서 만나게 되므로, $\mathrm{P}_{11}=\mathrm{P}_8$이 됨을 알 수 있다. 동일한 방법으로, $\mathrm{P}_{12}=\mathrm{P}_7$, $\mathrm{P}_{13}=\mathrm{P}_6$, $\mathrm{P}_{14}=\mathrm{P}_5$, $\mathrm{P}_{15}=\mathrm{P}_4$, $\mathrm{P}_{16}=\mathrm{P}_3$, $\mathrm{P}_{17}=\mathrm{P}_2$, $\mathrm{P}_{18}=\mathrm{P}_1$, $\mathrm{P}_{19}=\mathrm{P}_0$이 된다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이제 점 $\mathrm{P}_{19}$에서 기울기가 $\sqrt3$인 직선을 그어서 원과 만나는 점 $\mathrm{P}_{20}$을 얻고, 이 점에서 기울기가 $1$인 직선을 그어서 원과 만나는 점 $\mathrm{P}_{21}$을 얻는다. 점 $\mathrm{P}_{21}$에서 그은 기울기가 $\sqrt3$인 직선은 원과 접하게 되므로, $\mathrm{P}_{22}=\mathrm{P}_{21}$이 된다. 점 $\mathrm{P}_{22}$에서 그은 기울기가 $1$인 직선은 원과 점 $\mathrm{P}_{20}$과 만나게 되므로, $\mathrm{P}_{23}=\mathrm{P}_{20}$이 됨을 알 수 있다. 동일한 방법으로, $\mathrm{P}_{24}=\mathrm{P}_{19}=\mathrm{P}_0$, $\mathrm{P}_{25}=\mathrm{P}_{18}=\mathrm{P}_1$, $\cdots$, $\mathrm{P}_{33}=\mathrm{P}_{10}=\mathrm{P}_9$이 된다. 이로부터 $\mathrm{P}_{24+n}=\mathrm{P}_n$임을 관찰할 수 있다.
        [그림: 단위원 위에 $\mathrm{P}_0,\dots,\mathrm{P}_{23}$을 표시한 그림. 같은 점끼리 $\mathrm{P}_1=\mathrm{P}_{18}$, $\mathrm{P}_3=\mathrm{P}_{16}$, $\mathrm{P}_5=\mathrm{P}_{14}$, $\mathrm{P}_7=\mathrm{P}_{12}$, $\mathrm{P}_9=\mathrm{P}_{10}$, $\mathrm{P}_8=\mathrm{P}_{11}$, $\mathrm{P}_6=\mathrm{P}_{13}$, $\mathrm{P}_{15}=\mathrm{P}_4$, $\mathrm{P}_{17}=\mathrm{P}_2$, $\mathrm{P}_{19}=\mathrm{P}_0$, $\mathrm{P}_{22}=\mathrm{P}_{21}$, $\mathrm{P}_{23}=\mathrm{P}_{20}$으로 표기되어 있고, $\mathrm{P}_{20}$은 원의 왼쪽 위, $\mathrm{P}_{21}$은 그보다 아래 왼쪽에 있다.]
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        위에서 얻은 규칙과 $2024=24\times84+8$임을 감안하여, 같은 점들이 같은 열에 위치하도록 점 $\mathrm{P}_n$들을 표로 나열해 보면(첫 줄 $\mathrm{P}_0,\dots,\mathrm{P}_9$, 둘째 줄 $\mathrm{P}_{21},\mathrm{P}_{20},\mathrm{P}_{19},\dots,\mathrm{P}_{10}$, 셋째 줄 $\mathrm{P}_{22},\mathrm{P}_{23},\mathrm{P}_{24},\dots,\mathrm{P}_{33}$, …, 마지막 줄 $\mathrm{P}_{2014},\mathrm{P}_{2015},\mathrm{P}_{2016},\dots,\mathrm{P}_{2024},\mathrm{P}_{2025}$) $\mathrm{P}_{2024}=\mathrm{P}_8$이므로 $\mathrm{P}_{2024}$의 좌표는 $\left(\dfrac12,-\dfrac{\sqrt3}{2}\right)$임을 알 수 있다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        원과 직선이 두 점에서 만나는 경우와 접하는 경우($\mathrm{P}_{10}=\mathrm{P}_9$, $\mathrm{P}_{22}=\mathrm{P}_{21}$)를 구분하고 $\mathrm{P}_{24+n}=\mathrm{P}_n$의 규칙을 찾았다. (공식 채점기준 2-ⅱ 10점 중 세부 배분은 자체 설정)
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $2024=24\times84+8$로 $\mathrm{P}_{2024}=\mathrm{P}_8=\left(\tfrac12,-\tfrac{\sqrt3}{2}\right)$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 2-ⅲ] <제시문2>에 주어진 $A(n)$의 최댓값을 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: ['1', '2']
  answer: {kind: value, value: '1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{P}_n\mathrm{P}_{n+2}}$는 일정하므로 다른 변이 지름일 때 최대($n=2,3,14,15$). 지름을 밑변으로 하면 $A=\tfrac12\cdot2\cdot\sin\tfrac\pi6=\tfrac12$.
    steps:
    - id: 3a
      content: |
        $A(n)=\tfrac12\times2\times\sin\tfrac\pi6=\tfrac12$
      criteria: ['3.M1', '3.A1']
    hint_ladder:
    - 주기성 때문에 $n\le22$만 보면 된다.
    - 원에 내접하는 삼각형의 넓이를 세 변의 길이로 나타내 보자.
  - id: S3-B
    audience: B
    source_flow: 2024 보고서 문항카드 11 예시답안 PDF p.163-164(인쇄 쪽 160-161)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $n$이 $22$보다 큰 경우에는 같은 모양의 도형이 계속 반복되므로, $n\le22$일 때 $A(n)$의 최댓값을 구하면 충분하다. $n=8,9,20,21$인 경우에는 $A(n)=0$이 된다. $n\le22$이고 $n\ne8,9,20,21$이면, 선분 $\mathrm{P}_n\mathrm{P}_{n+1}$, 선분 $\mathrm{P}_{n+1}\mathrm{P}_{n+2}$, 선분 $\mathrm{P}_n\mathrm{P}_{n+2}$로 둘러싸인 도형은 원에 내접하는 삼각형이 되므로,
        $$A(n)=\frac{\overline{\mathrm{P}_n\mathrm{P}_{n+1}}\cdot\overline{\mathrm{P}_{n+1}\mathrm{P}_{n+2}}\cdot\overline{\mathrm{P}_n\mathrm{P}_{n+2}}}{4}$$
        이 됨을 알 수 있다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        [문제 2-ⅰ]로부터, 호 $\mathrm{P}_n\mathrm{P}_{n+2}$의 길이가 일정하므로, 선분 $\mathrm{P}_n\mathrm{P}_{n+2}$의 길이도 일정하게 된다. 선분 $\mathrm{P}_n\mathrm{P}_{n+1}$의 길이는 이 선분이 지름이 되는 경우(즉, 중심각이 $\pi$, 원주각이 $\dfrac\pi2$인 경우) 최대가 되고, 그 다음으로는 중심각이 $\dfrac{5\pi}{6}$, 즉 원주각이 $\dfrac{5\pi}{12}$인 경우임을 알 수 있다. 선분 $\mathrm{P}_n\mathrm{P}_{n+1}$이 지름이 되는 경우, 선분 $\mathrm{P}_{n+1}\mathrm{P}_{n+2}$의 원주각이 $\dfrac{5\pi}{12}$임을 관찰할 수 있다. 또한 선분 $\mathrm{P}_{n+1}\mathrm{P}_{n+2}$가 지름이 되는 경우에는, 선분 $\mathrm{P}_n\mathrm{P}_{n+1}$의 원주각이 $\dfrac{5\pi}{12}$임을 관찰할 수 있다. 따라서 선분 $\mathrm{P}_n\mathrm{P}_{n+1}$ 또는 선분 $\mathrm{P}_{n+1}\mathrm{P}_{n+2}$가 지름이 되는 경우(즉, $n=2,3,14,15$), $A(n)$은 최대가 된다.
      criteria: ['3.M1']
    - id: 3b-3
      content: |
        이제 삼각형 $\mathrm{P}_n\mathrm{P}_{n+1}\mathrm{P}_{n+2}$를 지름을 밑변으로 하는 삼각형으로 볼 때, $A(n)=\dfrac12\times2\times\sin\dfrac\pi6=\dfrac12$이므로, $A(n)$의 최댓값은 $\dfrac12$이 된다.
      criteria: ['3.A1']
