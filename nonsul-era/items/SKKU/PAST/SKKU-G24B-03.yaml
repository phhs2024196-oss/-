stimuli:
- id: S1
  label: <제시문1>
  body: |
    이차방정식 $ax^2+bx+c=0$의 두 근을 $\alpha,\beta$라고 하면
    $$\alpha+\beta=-\frac ba,\quad \alpha\beta=\frac ca$$
- id: S2
  label: <제시문2>
  body: |
    함수 $f(x)$가 미분가능하고 $f^{\prime}(a)=0$일 때, $x=a$의 좌우에서 $f^{\prime}(x)$의 부호가
    • 양에서 음으로 바뀌면, $f(x)$는 $x=a$에서 극대이고, 극댓값 $f(a)$를 갖는다.
    • 음에서 양으로 바뀌면, $f(x)$는 $x=a$에서 극소이고, 극솟값 $f(a)$를 갖는다.
- id: S3
  label: <제시문3>
  body: |
    정수 계수를 가지는 다항함수 $f(x)$와 $g(x)$가 다음과 같이 정의된다.
    $$f(x)=px^2+qx+r$$
    $$g(x)=x^3+Ax^2+Bx+C$$

stem: |
  다음 <제시문1> ~ <제시문3>을 읽고 [문제 3-ⅰ] ~ [문제 3-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    [문제 3-ⅰ] <제시문3>에서 $f(x)=g^{\prime}(x)$이고 $S_n=f(n)$이 어떤 등차수열 $a_1,a_2,a_3,\cdots$의 첫째항부터 제$n$항까지의 합이라고 한다. 실수 전체의 집합에서 미분가능한 함수 $y=h(x)$가 다음의 조건을 만족시킬 때,
    • $0\le x\le6$에서 $h(x)=g(x)$
    • 모든 실수 $x$에 대하여 $h(x+6)=h(x)+h(6)$
    정적분 $\displaystyle\int_0^8h(x)dx$의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-560', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $p=3$, 등차수열의 합이므로 $r=0$; $h$의 미분가능성에서 $g^{\prime}(0)=g^{\prime}(6)$ → $q=-18$; $h(0)=0$ → $C=0$. $g=x^3-9x^2$.
    steps:
    - id: 1a
      content: |
        $\int_0^8h=\int_0^6g+\int_0^2g+2g(6)=-324-20-216=-560$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - $S_n$이 등차수열의 합이면 $S_1=a_1$과 $a_n=S_n-S_{n-1}$이 같은 식으로 맞아야 한다.
    - $x=6$에서 $h$가 미분가능하려면 좌우 미분계수가 같아야 한다.
    - $\int_6^8h(x)dx$를 $x=t+6$으로 옮겨 보자.
  - id: S1-B
    audience: B
    source_flow: 2024 보고서 문항카드 12 예시답안 PDF p.168(인쇄 쪽 165)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $px^2+qx+r=f(x)=g^{\prime}(x)=3x^2+2Ax+B$로부터 $p=3$이다. 수열 $S_n=f(n)$이 등차수열 $\{a_n\}$의 첫째항부터 제$n$항까지의 합이라고 할 때, $S_n-S_{n-1}=a_n=f(n)-f(n-1)=6(n-1)+q+3=6n+q-3$ ($n\ge2$일 때)이 성립하므로 공차는 $6$이다. 또한, $a_1=S_1=f(1)$이므로, $a_1=3+q=f(1)=3+q+r$를 얻게 되고, $r=0$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        한편, 함수 $y=h(x)$의 조건으로부터 $g^{\prime}(0)=0=g^{\prime}(6)=108+6q$를 얻게 되어, $q=-18$이고, $h(6)=h(0)+h(6)$로부터 $C=h(0)=0$이다. 따라서, 두 함수 $f(x)$와 $g(x)$는 $f(x)=3x^2-18x$, $g(x)=x^3-9x^2$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        이로부터 정적분 값을 구하면 $\displaystyle\int_0^6g(x)dx=\int_0^6(x^3-9x^2)dx=-324$와 $\displaystyle\int_0^2g(x)dx=\int_0^2(x^3-9x^2)dx=-20$이고 $g(6)-g(0)=-108$이므로, $\displaystyle\int_0^8h(x)dx=-324-20-108\times2=-560$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $p=3$과 등차수열의 합 조건($a_1=S_1$)으로 $r=0$을 얻었다. (공식 채점기준 3-ⅰ 10점 중 세부 배분은 자체 설정)
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $h$의 미분가능성·조건에서 $g^{\prime}(0)=g^{\prime}(6)$으로 $q=-18$, $h(0)=0$으로 $C=0$을 얻어 $g(x)=x^3-9x^2$을 결정했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $\int_0^8h(x)dx=-560$을 얻었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 3-ⅱ] <제시문3>에서 $A=q$, $B=p$, $C=r$ $(p,q,r\ne0)$이라 하자. 이차방정식 $f(x)=0$의 두 실근 $\alpha,\beta$ (단, $\alpha<\beta$)가 모두 삼차방정식 $g(x)=0$의 해일 때, 정적분 $\displaystyle\int_\alpha^\beta|f(x)-g(x)|dx$의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '22/3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g-f=x(x^2+(q-p)x-(q-p))$이므로 $\alpha+\beta=\alpha\beta=p-q=-\tfrac qp=\tfrac rp$ → $r=-q$, $p^2=q(p-1)$ → $p=2$, $(p,q,r)=(2,4,-4)$.
    steps:
    - id: 2a
      content: |
        $\alpha,\beta=-1\mp\sqrt3$, $\int_\alpha^\beta|x(x^2+2x-2)|dx=\tfrac{22}{3}$
      criteria: ['2.M1', '2.A1', '2.A2']
    hint_ladder:
    - $\alpha,\beta\ne0$이고 $g(x)-f(x)=0$의 해이기도 하다.
    - $g(x)-f(x)$는 $x$로 묶인다.
    - $q=\dfrac{p^2}{p-1}$이 정수가 되는 $p$는?
  - id: S2-B
    audience: B
    source_flow: 2024 보고서 문항카드 12 예시답안 PDF p.168-169(인쇄 쪽 165-166)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 실수 $\alpha,\beta$는 $f(x)=px^2+qx+r=0$의 해이고 $r\ne0$이므로, 모두 $0$이 아니다. 또한 $\alpha,\beta$는 삼차방정식 $g(x)-f(x)=(x^3+qx^2+px+r)-(px^2+qx+r)=x(x^2+(q-p)x-(q-p))=0$의 해가 되므로, 이차방정식 $x^2+(q-p)x-(q-p)=0$의 해가 되어, $\alpha+\beta=\alpha\beta=p-q$가 성립한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        한편, $\alpha+\beta=-\dfrac qp$, $\alpha\beta=\dfrac rp$가 성립하므로 $\alpha+\beta=\alpha\beta=p-q=-\dfrac qp=\dfrac rp$를 얻을 수 있고, 이로부터 $r=-q$이다. 또한, $p-q=-\dfrac qp$로부터 $p^2=q(p-1)$을 얻게 되고, $p\ne1$임을 알 수 있다. 양변을 $p-1$로 나누면 $q=\dfrac{p^2}{p-1}=p+1+\dfrac1{p-1}$를 얻게 되고, $q$는 정수이므로 $p=2$이다. 따라서 $(p,q,r)=(2,4,-4)$를 얻게 되어 $f(x)=2x^2+4x-4$, $g(x)=x^3+4x^2+2x-4$이고, $\alpha=-1-\sqrt3$, $\beta=-1+\sqrt3$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        따라서 구하고자 하는 정적분은
        $$\int_\alpha^\beta|f(x)-g(x)|dx=\int_\alpha^0x(x^2+2x-2)dx-\int_0^\beta x(x^2+2x-2)dx=-\frac14(\alpha^4+\beta^4)-\frac23(\alpha^3+\beta^3)+(\alpha^2+\beta^2)$$
        이다. $\alpha+\beta=\alpha\beta=-2$로부터 $\alpha^2+\beta^2=8$, $\alpha^3+\beta^3=-20$, $\alpha^4+\beta^4=56$을 얻게 되어, 문제의 정적분의 값은 $\dfrac{22}{3}$임을 알 수 있다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $g(x)-f(x)=x(x^2+(q-p)x-(q-p))$로 인수분해해 $\alpha+\beta=\alpha\beta=p-q$를 얻었다. (공식 채점기준 3-ⅱ 10점 중 세부 배분은 자체 설정)
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        근과 계수의 관계와 정수 조건으로 $(p,q,r)=(2,4,-4)$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 4
      evidence: |
        절댓값을 구간 $[\alpha,0]$, $[0,\beta]$로 나누어 정적분 값 $\tfrac{22}{3}$을 얻었다.
      depends_on: [2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 3-ⅲ] <제시문3>에서 $C<0$이고 $A,B$가 이차방정식 $x^2+9C=0$의 두 근일 때, 삼차함수 $y=g(x)$는 다음의 조건을 만족시킨다.
    • 함수 $y=g(x)$가 극값을 가지고, 극댓값은 양수이고 극솟값은 음수이다.
    • 함수 $y=g(x)$의 극댓값과 극솟값의 차는 $24\sqrt6$이다.
    이때, $A$의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $B=-A$, $C=-\tfrac{A^2}{9}$이고 $g(x)=g^{\prime}(x)\left(\tfrac x3+\tfrac A9\right)-\tfrac29A(A+3)x$. 극값의 부호에서 극대점 $a<0<b$, 즉 $A>0$; 차 $\tfrac4{27}\{A(A+3)\}^{3/2}=24\sqrt6$ → $A(A+3)=54$.
    steps:
    - id: 3a
      content: |
        $A(A+3)=54$, $A>0$ → $A=6$
      criteria: ['3.M1', '3.M2', '3.A1']
    hint_ladder:
    - 근과 계수의 관계로 $B$, $C$를 $A$로 나타내자.
    - 극값 $g(a)$를 $g^{\prime}(a)=0$을 이용해 일차식으로 줄여 보자.
    - 극댓값과 극솟값의 차를 $a-b$와 $a+b$, $ab$로 표현하자.
  - id: S3-B
    audience: B
    source_flow: 2024 보고서 문항카드 12 예시답안 PDF p.169(인쇄 쪽 166)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $A+B=0$, $AB=9C$가 성립하므로, 삼차함수 $g(x)=x^3+Ax^2-Ax-\dfrac{A^2}{9}$이다. 이차방정식 $g^{\prime}(x)=3x^2+2Ax-A=0$이 서로 다른 두 실근을 가져야 하므로, 판별식 $D=A^2+3A>0$이 성립해야 하고, 이로부터 $A>0$ 또는 $A<-3$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        이때, 이차방정식 $g^{\prime}(x)=0$의 두 근 $\dfrac{-A\pm\sqrt{A^2+3A}}{3}$을 각각 $a,b$ (단, $a<b$)라고 하면 $a+b=-\dfrac{2A}{3}$, $ab=-\dfrac A3$이 성립한다. 한편,
        $$g(a)=a^3+Aa^2-Aa-\frac{A^2}{9}=g^{\prime}(a)\left(\frac a3+\frac A9\right)-\frac29A(A+3)a=-\frac29A(A+3)a>0$$
        이 되어 $a<0$이다. 동일한 방법으로 $g(b)=-\dfrac29A(A+3)b<0$으로부터 $b>0$을 얻게 되어, $A=-3ab>0$을 얻을 수 있다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        마지막으로,
        $$24\sqrt6=g(a)-g(b)=(a^3-b^3)+A(a^2-b^2)-A(a-b)=(a-b)\left((a^2+ab+b^2)+A(a+b)-A\right)=\frac4{27}A(A+3)\sqrt{A(A+3)}$$
        을 얻게 되어 $A(A+3)=54$이다. 따라서, $A=6$이다.
      criteria: ['3.A1']
