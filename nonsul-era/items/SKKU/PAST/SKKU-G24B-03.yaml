intent: |
  기본적인 함수인 이차함수와 삼차함수의 미분을 통해 함수의 증가와 감소, 극대와 극소를 올바르게 분석·판단할 수 있는지, 등차수열의 합과 일반항의 관계·근과 계수의 관계 등 관련된 수학적 성질을 이용하여 정적분의 값을 구할 수 있는지 평가한다(2024 보고서 문항카드 12 출제 의도 요약).
key_idea: |
  (ⅰ) $S_n=f(n)$이 등차수열의 합이면 상수항 $r=0$, $h$의 미분가능성에서 $g^{\prime}(0)=g^{\prime}(6)$. (ⅱ) $g-f=x(x^2+(q-p)x-(q-p))$이므로 $\alpha+\beta=\alpha\beta=p-q$. (ⅲ) $g(a)=-\tfrac29A(A+3)a$로 극값의 부호에서 $A>0$.
stuck: |
  (ⅰ)에서 $h(x+6)=h(x)+h(6)$과 미분가능성으로부터 $g^{\prime}(0)=g^{\prime}(6)$, $h(0)=0$을 끌어내는 것, (ⅲ)에서 $g(a)$를 $g^{\prime}(a)$로 나눈 나머지로 정리하는 것
idea_tags: [IDEA-ARITH-SUM-NO-CONSTANT, IDEA-FUNCTIONAL-SHIFT-INTEGRAL, IDEA-POLY-REMAINDER-BY-DERIVATIVE]
tags: [등차수열의 합, 함수방정식과 정적분, 극댓값과 극솟값의 차]
