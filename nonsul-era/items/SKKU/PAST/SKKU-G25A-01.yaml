intent: |
  주어진 기하학적 정보를 이해하고 수식화하여 원하는 정보를 도출할 수 있는지 평가한다. 조건에 맞게 곡선 및 직선(접선·법선)의 방정식을 유도하고 이를 바탕으로 여러 점의 위치를 수식화한 뒤, 점들 사이의 거리 관계에서 변하지 않는 관계를 유도하거나 극한 관계를 계산할 수 있는지 본다(2025 보고서 문항카드 7 출제 의도 요약).
key_idea: |
  $\mathrm{Q}(a,a^2)$로 두고 접선 $l$과 법선의 절편으로 $\mathrm{T},\mathrm{S},\mathrm{P}$를 구한 뒤, 원 $C$의 접선 길이가 같다는 성질($\overline{\mathrm{TU}}=\overline{\mathrm{QT}}$)로 중심 $\mathrm{R}$의 $x$좌표를 얻고 수직 조건으로 반지름 $r$을 구한다.
stuck: |
  원 $C$가 $x$축과 직선 $l$에 동시에 접하므로 점 $\mathrm{T}$에서 원에 그은 두 접선의 길이가 같다($\overline{\mathrm{TU}}=\overline{\mathrm{TQ}}$)는 사실로 중심의 $x$좌표를 잡는 발상
