stimuli:
- id: S1
  label: <제시문1>
  body: |
    곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 방정식은 $y=f'(a)(x-a)+f(a)$이다.
- id: S2
  label: <제시문2>
  body: |
    좌표평면 위의 두 직선 $y=mx+n,\ y=m'x+n'$에 대하여
    (1) 두 직선이 서로 수직이면 $mm'=-1$이다.
    (2) $mm'=-1$이면 두 직선이 수직이다.
- id: S3
  label: <제시문3>
  body: |
    아래 그림과 같이 곡선 $y=x^2$ 위의 한 점을 제1사분면 위에서 택하고 이를 $\mathrm{Q}$라 한다. 곡선 $y=x^2$ 위의 점 $\mathrm{Q}$에서의 접선을 $l$이라 한다. 직선 $l$이 $x$축과 만나는 점을 $\mathrm{T}$라 한다. 점 $\mathrm{Q}$를 지나고 직선 $l$에 수직인 직선이 $y$축과 만나는 점을 $\mathrm{P}$라 하고, $x$축과 만나는 점을 $\mathrm{S}$라 한다. 직선 $l$과 점 $\mathrm{Q}$에서 접하고, 동시에 $x$축과 접하는 원을 $C$라 한다. 단, 원 $C$와 $x$축의 접점의 $x$좌표는 양수이다. 원 $C$의 중심을 $\mathrm{R}$라고 하고 그 둘레의 길이를 $L$이라 한다. 좌표평면의 원점을 $\mathrm{O}$라 한다.

    [그림: 좌표평면에 포물선 $y=x^2$(원점 $\mathrm{O}$에서 $x$축에 접함)이 그려져 있다. 제1사분면의 점 $\mathrm{Q}$에서 그은 접선 $l$이 $x$축의 양의 부분 점 $\mathrm{T}$($\mathrm{O}$ 가까이)를 지나 오른쪽 위로 뻗는다. $y$축 위의 점 $\mathrm{P}$에서 $\mathrm{Q}$를 지나 $x$축 위의 점 $\mathrm{S}$(T보다 훨씬 오른쪽)까지 선분 $\mathrm{PS}$가 그려져 있다. 원 $C$는 $\mathrm{Q}$에서 $l$에 접하고 $x$축에 접하며, 중심 $\mathrm{R}$은 선분 $\mathrm{QS}$ 위에 있다. 점 $\mathrm{O},\mathrm{T},\mathrm{S}$가 $x$축 위에 왼쪽부터 차례로 표시되어 있다.]

stem: |
  다음 <제시문1> ~ <제시문3>을 읽고 [문제 1-ⅰ] ~ [문제 1-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    [문제 1-ⅰ] <제시문3>에서 주어진 점 $\mathrm{Q},\mathrm{S},\mathrm{T}$에 대하여, $\dfrac{\overline{\mathrm{QS}}\times\overline{\mathrm{ST}}}{\overline{\mathrm{QT}}^3}$의 값은 점 $\mathrm{Q}$의 위치에 관계없이 일정함을 보이고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{Q}(a,a^2)$에서 접선·법선의 $x$절편을 구하면 세 길이가 모두 $\sqrt{a^2+\tfrac14}$의 거듭제곱 꼴이 되어 비가 $4$로 일정하다.
    steps:
    - {id: 1a, content: '$\overline{\mathrm{QT}}=a\sqrt{a^2+\tfrac14}$, $\overline{\mathrm{ST}}=2a\left(a^2+\tfrac14\right)$, $\overline{\mathrm{QS}}=2a^2\sqrt{a^2+\tfrac14}$이므로 비는 $4$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 점 $\mathrm{Q}$의 좌표를 하나의 문자 $a$로 나타내 보자.
    - 접선과 법선의 $x$절편을 각각 구하면 $\mathrm{T}$, $\mathrm{S}$가 정해진다.
    - 세 길이에 공통으로 나타나는 인수 $\sqrt{a^2+\tfrac14}$에 주목하자.
  - id: S1-B
    audience: B
    source_flow: 2025 보고서 문항카드 7 예시답안 p.166-167(인쇄 쪽 162-163)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{Q}$의 좌표를 $\mathrm{Q}(a,a^2)$ $(a>0)$이라 하자. <제시문1>에 의해 직선 $l$의 방정식은 $y=2a(x-a)+a^2=2ax-a^2$이므로 $l$의 $x$절편은 $\dfrac a2$이고 $\mathrm{T}\left(\dfrac a2,0\right)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $\overline{\mathrm{QT}}=\sqrt{\left(\dfrac a2-a\right)^2+(0-a^2)^2}=a\sqrt{a^2+\dfrac14}$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        <제시문2>에 의해 직선 $l$에 수직인 직선의 방정식은 $y=-\dfrac{1}{2a}(x-a)+a^2=-\dfrac{1}{2a}x+a^2+\dfrac12$이므로 $x$절편을 구하면 $\mathrm{S}(2a^3+a,0)$이다.
      criteria: ['1.M1']
    - id: 1b-4
      content: |
        따라서 $\overline{\mathrm{ST}}=2a^3+a-\dfrac a2=2a^3+\dfrac a2=2a\left(a^2+\dfrac14\right)$, $\overline{\mathrm{QS}}=\sqrt{(2a^3+a-a)^2+(0-a^2)^2}=2a^2\sqrt{a^2+\dfrac14}$.
      criteria: ['1.A1']
    - id: 1b-5
      content: |
        그러므로 $\dfrac{\overline{\mathrm{QS}}\times\overline{\mathrm{ST}}}{\overline{\mathrm{QT}}^3}=\dfrac{2a^2\sqrt{a^2+\frac14}\times2a\left(a^2+\frac14\right)}{\left(a\sqrt{a^2+\frac14}\right)^3}=4$이고, 이 값은 $a$에 무관하므로 $\mathrm{Q}$의 위치와 관계없이 일정하다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\mathrm{Q}(a,a^2)$로 두고 접선 $l$과 $l$에 수직인 직선의 방정식을 세워 $\mathrm{T}\left(\dfrac a2,0\right)$, $\mathrm{S}(2a^3+a,0)$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        $\overline{\mathrm{QT}}=a\sqrt{a^2+\tfrac14}$, $\overline{\mathrm{ST}}=2a\left(a^2+\tfrac14\right)$, $\overline{\mathrm{QS}}=2a^2\sqrt{a^2+\tfrac14}$(또는 동치식)를 구했다.
      depends_on: [1.M1]
      steps: [1b-2, 1b-4]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        비를 정리해 $4$를 얻고, $a$에 무관하므로 일정하다고 결론지었다.
      depends_on: [1.M1, 1.A1]
      steps: [1b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 1-ⅱ] <제시문3>에서 주어진 점 $\mathrm{P},\mathrm{Q},\mathrm{R}$에 대하여, $\dfrac12\overline{\mathrm{PQ}}+\overline{\mathrm{QR}}-\overline{\mathrm{OP}}$의 값은 점 $\mathrm{Q}$의 위치에 관계없이 일정함을 보이고 그 이유를 논하시오.
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '-1/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{T}$에서 원 $C$에 그은 두 접선의 길이가 같으므로 $\overline{\mathrm{TU}}=\overline{\mathrm{QT}}$, 이것으로 중심 $\mathrm{R}$의 $x$좌표를 얻고 $\mathrm{QR}\perp l$에서 반지름을 구한다.
    steps:
    - {id: 2a, content: '$\overline{\mathrm{OP}}=a^2+\tfrac12$, $\overline{\mathrm{PQ}}=\sqrt{a^2+\tfrac14}$, $\overline{\mathrm{QR}}=a^2+\tfrac14-\tfrac12\sqrt{a^2+\tfrac14}$이므로 값은 $-\tfrac14$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2', '2.A3']}
    hint_ladder:
    - 원의 중심 $\mathrm{R}$의 $y$좌표는 반지름과 같다.
    - 점 $\mathrm{T}$에서 원 $C$에 그은 두 접선은 직선 $l$과 $x$축이다. 두 접선의 길이를 비교해 보자.
    - 중심 $\mathrm{R}$과 접점 $\mathrm{Q}$를 잇는 선분은 $l$에 수직이다.
  - id: S2-B
    audience: B
    source_flow: 2025 보고서 문항카드 7 예시답안 p.167-168(인쇄 쪽 163-164)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\mathrm{Q}(a,a^2)$이라 하자. 직선 $l$에 수직인 직선의 방정식 $y=-\dfrac{1}{2a}(x-a)+a^2=-\dfrac{1}{2a}x+a^2+\dfrac12$의 $y$절편은 $a^2+\dfrac12$이므로 $\mathrm{P}\left(0,a^2+\dfrac12\right)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 $\overline{\mathrm{OP}}=a^2+\dfrac12$ …(1), $\overline{\mathrm{PQ}}=\sqrt{(0-a)^2+\left(a^2+\dfrac12-a^2\right)^2}=\sqrt{a^2+\dfrac14}$ …(2).
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        [문제 1-ⅰ]의 결과에 의해 $\overline{\mathrm{QT}}=a\sqrt{a^2+\dfrac14}$이므로 $\mathrm{R}$에서 $x$축에 내린 수선의 발을 $\mathrm{U}$라 하면(점 $\mathrm{T}$에서 원 $C$에 그은 두 접선의 길이는 같으므로) $\overline{\mathrm{TU}}=\overline{\mathrm{QT}}=a\sqrt{a^2+\dfrac14}$. 따라서 $\overline{\mathrm{OU}}=\dfrac a2+a\sqrt{a^2+\dfrac14}$.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        선분 $\overline{\mathrm{QR}}$의 길이를 $r$이라 하면 $\mathrm{R}\left(\dfrac a2+a\sqrt{a^2+\dfrac14},\,r\right)$이다. 선분 $\mathrm{QR}$과 직선 $l$은 서로 수직이므로
        $$2a\times\left(\dfrac{r-a^2}{\frac a2+a\sqrt{a^2+\frac14}-a}\right)=-1.$$
      criteria: ['2.M2']
    - id: 2b-5
      content: |
        이를 풀면 $r=a^2+\dfrac14-\dfrac12\sqrt{a^2+\dfrac14}$, 즉 $\overline{\mathrm{QR}}=a^2+\dfrac14-\dfrac12\sqrt{a^2+\dfrac14}$ …(3).
      criteria: ['2.A2']
    - id: 2b-6
      content: |
        (1), (2), (3)으로부터
        $\dfrac12\overline{\mathrm{PQ}}+\overline{\mathrm{QR}}-\overline{\mathrm{OP}}=\dfrac12\sqrt{a^2+\dfrac14}+a^2+\dfrac14-\dfrac12\sqrt{a^2+\dfrac14}-\left(a^2+\dfrac12\right)=-\dfrac14.$
        따라서 $\mathrm{Q}$의 위치와 관계없이 값은 일정하다.
      criteria: ['2.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        법선의 $y$절편으로 $\mathrm{P}\left(0,a^2+\tfrac12\right)$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\overline{\mathrm{OP}}=a^2+\tfrac12$, $\overline{\mathrm{PQ}}=\sqrt{a^2+\tfrac14}$를 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        접선 길이가 같음($\overline{\mathrm{TU}}=\overline{\mathrm{QT}}$) 등으로 중심 $\mathrm{R}$의 $x$좌표를 나타내고, $\mathrm{QR}\perp l$(기울기 곱 $-1$) 또는 동등한 조건으로 반지름 $r$에 대한 식을 세웠다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 4}
      steps: [2b-3, 2b-4]
    - id: 2.A2
      mark_type: A
      points: 3
