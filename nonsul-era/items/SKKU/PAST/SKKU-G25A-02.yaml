intent: |
  구간에 따라 식이 다르게 정의되는 함수를 정의하고, 이 함수가 포함된 정적분(절댓값·간단한 합성함수 포함)을 구간별로 나누어 계산할 수 있는지, 그리고 정의된 함수의 적분을 포함하는 새로운 함수를 미분과 적분의 관계로 미분해 극값을 판별할 수 있는지 평가한다(2025 보고서 문항카드 8 출제 의도 요약).
key_idea: |
  적분 구간을 $f$의 식이 바뀌는 점($t=0$, $t^2-2=0$)과 절댓값이 바뀌는 점($t=1$)에서 나누고, $g'(x)=2x^2-4x+12+(1-x)f(x)-(4-x)f(x-3)$을 $x\le0$, $0<x\le3$, $x>3$으로 나누어 부호를 조사한다.
stuck: |
  $f(x-3)$의 식이 $x=3$에서 바뀌고 $f(x)$의 식이 $x=0$에서 바뀌므로 $g'$을 세 구간으로 나누어야 한다는 점, $f(t^2-2)$에서 $t^2-2$의 부호로 $t=\pm\sqrt2$에서 구간을 나눠야 한다는 점
idea_tags: [IDEA-PIECEWISE-SPLIT-INTEGRAL, IDEA-FTC-DERIVATIVE-SIGN]
tags: [구간별로 정의된 함수, 절댓값 적분, 정적분으로 정의된 함수, 극값]
