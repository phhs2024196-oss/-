stimuli:
- id: S1
  label: <제시문1>
  body: |
    함수 $g(x)$가 미분가능하고 $g'(b)=0$일 때, $x=b$의 좌우에서 $g'(x)$의 부호가
    • 양에서 음으로 바뀌면, $g(x)$는 $x=b$에서 극대이고, 극댓값 $g(b)$를 갖는다.
    • 음에서 양으로 바뀌면, $g(x)$는 $x=b$에서 극소이고, 극솟값 $g(b)$를 갖는다.
- id: S2
  label: <제시문2>
  body: |
    • 함수 $f(t)$를 다음과 같이 정의한다.
    $$f(t)=\begin{cases}t^2+2t & (t>0)\\ -t & (t\le0)\end{cases}$$
    • 함수 $g(x)$를 다음과 같이 정의한다.
    $$g(x)=\dfrac{2x^3}{3}-2x^2+12x+\int_{-10}^{x}(1-t)f(t)dt-\int_{-10}^{x}(4-t)f(t-3)dt$$

stem: |
  다음 <제시문1>과 <제시문2>를 읽고 [문제 2-ⅰ] ~ [문제 2-ⅳ]를 문항별로 풀이와 함께 답하시오. (40점)

subparts:
- id: '1'
  stem: |
    [문제 2-ⅰ] <제시문2>에서 정의된 함수 $f(t)$에 대하여 $\displaystyle\int_{-2}^{a}f(t)dt=\dfrac{32-3a}{3}$를 만족시키는 양의 실수 $a$의 값을 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $[-2,0]$과 $[0,a]$로 나누면 $\tfrac{a^3}{3}+a^2+2=\tfrac{32-3a}{3}$, 즉 $(a+1)^3=27$.
    steps:
    - {id: 1a, content: '$a^3+3a^2+3a=26\iff(a+1)^3=27\iff a=2$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - $f$의 식이 바뀌는 $t=0$에서 적분 구간을 나누자.
    - 정리한 식의 좌변에 $1$을 더하면 완전세제곱이 된다.
  - id: S1-B
    audience: B
    source_flow: 2025 보고서 문항카드 8 예시답안 p.172(인쇄 쪽 168)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a>0$인 경우 $[-2,0]$과 $[0,a]$ 구간으로 나누어 적분하면 $\displaystyle\int_{-2}^{0}f(t)dt=\int_{-2}^{0}(-t)dt=2$, $\displaystyle\int_{0}^{a}f(t)dt=\int_0^a(t^2+2t)dt=\dfrac{a^3}{3}+a^2$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $\displaystyle\int_{-2}^{a}f(t)dt=\dfrac{a^3}{3}+a^2+2$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        주어진 식은 $\dfrac{a^3}{3}+a^2+2=\dfrac{32-3a}{3}$이고, 정리하면 $a^3+3a^2+3a=26$, 즉 $(a+1)^3=27$이므로 해를 구하면 $a=2$가 된다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        적분 구간을 $[-2,0]$과 $[0,a]$로 나누고 각 구간에서 $f$의 식($-t$, $t^2+2t$)으로 적분했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\int_{-2}^{a}f(t)dt=\dfrac{a^3}{3}+a^2+2$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: |
        $a^3+3a^2+3a=26$으로 정리하고 양의 실수 해 $a=2$를 구했다.
      depends_on: [1.A1]
      implied_ok: true
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 2-ⅱ] <제시문2>에서 정의된 함수 $f(t)$에 대하여 정적분 $\displaystyle\int_{-2}^{2}f(t)\lvert t-1\rvert dt$의 값을 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '49/6', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f$가 바뀌는 $0$과 절댓값이 바뀌는 $1$에서 나눈다.
    steps:
    - {id: 2a, content: '$\tfrac{14}{3}+\tfrac{5}{12}+\left(\tfrac83+\tfrac{5}{12}\right)=\tfrac{49}{6}$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - 피적분함수의 식이 바뀌는 점은 몇 개인가?
  - id: S2-B
    audience: B
    source_flow: 2025 보고서 문항카드 8 예시답안 p.172(인쇄 쪽 168)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        적분의 영역을 $[-2,0]$, $[0,1]$, $[1,2]$로 나누어 계산하자.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\displaystyle\int_{-2}^{0}(-t)(1-t)dt=\int_{-2}^{0}(t^2-t)dt=\left[\dfrac{t^3}{3}-\dfrac{t^2}{2}\right]_{-2}^{0}=\dfrac83+2$
        $\displaystyle\int_{0}^{1}(t^2+2t)(1-t)dt=\int_0^1(-t^3-t^2+2t)dt=\left[-\dfrac{t^4}{4}-\dfrac{t^3}{3}+t^2\right]_0^1=\dfrac{5}{12}$
        $\displaystyle\int_{1}^{2}(t^2+2t)(t-1)dt=\int_1^2(t^3+t^2-2t)dt=\left[\dfrac{t^4}{4}+\dfrac{t^3}{3}-t^2\right]_1^2=\dfrac83+\dfrac{5}{12}$
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        따라서 전체 적분값은 $\dfrac{16}{3}+\dfrac{17}{6}=\dfrac{49}{6}$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        적분 구간을 $[-2,0]$, $[0,1]$, $[1,2]$로 나누고 각 구간에서 $f(t)$와 $\lvert t-1\rvert$의 식을 바르게 정했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        세 구간의 적분값 $\dfrac{14}{3}$, $\dfrac{5}{12}$, $\dfrac{37}{12}$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        합 $\dfrac{49}{6}$을 얻었다.
      depends_on: [2.A1]
      implied_ok: true
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 2-ⅲ] <제시문2>에서 정의된 함수 $f(t)$에 대하여 정적분 $\displaystyle\int_{-2}^{2}f(t^2-2)\lvert t-1\rvert dt$의 값을 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '21/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $t^2-2$의 부호가 바뀌는 $\pm\sqrt2$와 $\lvert t-1\rvert$이 바뀌는 $1$에서 네 구간으로 나누고, $I_1+I_4$, $I_2+I_3$로 묶으면 무리수 항이 상쇄된다.
    steps:
    - {id: 3a, content: '$I_1+I_4=\tfrac{20}{3}$, $I_2+I_3=\tfrac{23}{6}$, 합 $\tfrac{21}{2}$', criteria: ['3.M1', '3.A1', '3.A2']}
    hint_ladder:
    - $f(t^2-2)$의 식은 $t^2-2$의 부호에 따라 달라진다.
    - $\lvert t\rvert>\sqrt2$이면 $f(t^2-2)=(t^2-2)^2+2(t^2-2)=t^4-2t^2$이다.
  - id: S3-B
    audience: B
    source_flow: 2025 보고서 문항카드 8 예시답안 p.173-174(인쇄 쪽 169-170)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        적분 구간을 $[-2,-\sqrt2]$, $[-\sqrt2,1]$, $[1,\sqrt2]$, $[\sqrt2,2]$로 나누어 계산하자.
        $I_1=\displaystyle\int_{-2}^{-\sqrt2}f(t^2-2)\lvert t-1\rvert dt=\int_{-2}^{-\sqrt2}\left((t^2-2)^2+2(t^2-2)\right)(1-t)dt=\int_{-2}^{-\sqrt2}(-t^5+t^4+2t^3-2t^2)dt$
        $I_2=\displaystyle\int_{-\sqrt2}^{1}(2-t^2)(1-t)dt=\int_{-\sqrt2}^{1}(t^3-t^2-2t+2)dt$
        $I_3=\displaystyle\int_{1}^{\sqrt2}(2-t^2)(t-1)dt=\int_1^{\sqrt2}(-t^3+t^2+2t-2)dt$
        $I_4=\displaystyle\int_{\sqrt2}^{2}(t^4-2t^2)(t-1)dt=\int_{\sqrt2}^{2}(t^5-t^4-2t^3+2t^2)dt$
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        이를 토대로 계산하면
        $I_1=\left[-\dfrac{t^6}{6}+\dfrac{t^5}{5}+\dfrac{t^4}{2}-\dfrac{2t^3}{3}\right]_{-2}^{-\sqrt2}=\left(-\dfrac86-\dfrac{4\sqrt2}{5}+2+\dfrac{4\sqrt2}{3}\right)-\left(-\dfrac{64}{6}-\dfrac{32}{5}+8+\dfrac{16}{3}\right)$
        $I_2=\left[\dfrac{t^4}{4}-\dfrac{t^3}{3}-t^2+2t\right]_{-\sqrt2}^{1}=\left(\dfrac14-\dfrac13-1+2\right)-\left(1+\dfrac{2\sqrt2}{3}-2-2\sqrt2\right)$
        $I_3=\left[-\dfrac{t^4}{4}+\dfrac{t^3}{3}+t^2-2t\right]_{1}^{\sqrt2}=\left(-1+\dfrac{2\sqrt2}{3}+2-2\sqrt2\right)-\left(-\dfrac14+\dfrac13+1-2\right)$
        $I_4=\left[\dfrac{t^6}{6}-\dfrac{t^5}{5}-\dfrac{t^4}{2}+\dfrac{2t^3}{3}\right]_{\sqrt2}^{2}=\left(\dfrac{64}{6}-\dfrac{32}{5}-\dfrac{16}{2}+\dfrac{16}{3}\right)-\left(\dfrac86-\dfrac{4\sqrt2}{5}-\dfrac42+\dfrac{4\sqrt2}{3}\right)$
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        $I_1+I_4=-2\left(\dfrac86-2\right)+2\left(\dfrac{64}{6}-8\right)=-\dfrac83+4+\dfrac{64}{3}-16=\dfrac{20}{3}$,
        $I_2+I_3=2(-1+2)+2\left(\dfrac14-\dfrac13-1+2\right)=2-\dfrac16+2=\dfrac{23}{6}$.
        이들을 합하면 $I_1+I_2+I_3+I_4=\dfrac{63}{6}=\dfrac{21}{2}$.
      criteria: ['3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        적분 구간을 $-\sqrt2$, $1$, $\sqrt2$에서 나누고 각 구간의 피적분함수를 다항식으로 바르게 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        네 구간의 정적분 $I_1\sim I_4$를 바르게 계산했다(또는 짝지어 무리수 항을 상쇄).
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: |
        합 $\dfrac{21}{2}$을 얻었다.
      depends_on: [3.A1]
      implied_ok: true
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '4'
  stem: |
    [문제 2-ⅳ] <제시문2>에서 정의된 함수 $g(x)$를 생각하자. 열린구간 $(-10,10)$에서 $g(x)$가 극값을 갖는 $x$의 값을 모두 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '{-1, 0, sqrt(5)}', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $g'(x)=2x^2-4x+12+(1-x)f(x)-(4-x)f(x-3)$을 세 구간으로 나누면 $2x(x+1)$, $-x(x^2-5)$, $-x(7x-17)$이다.
    steps:
    - {id: 4a, content: '$g''$의 부호가 $x=-1$(양→음), $x=0$(음→양), $x=\sqrt5$(양→음)에서 바뀌므로 극값은 $x=-1,0,\sqrt5$', criteria: ['4.M1', '4.A1', '4.R1']}
    hint_ladder:
    - 미분과 적분의 관계로 $g'(x)$를 먼저 구하자.
    - $f(x)$는 $x=0$에서, $f(x-3)$은 $x=3$에서 식이 바뀐다.
  - id: S4-B
    audience: B
    source_flow: 2025 보고서 문항카드 8 예시답안 p.174(인쇄 쪽 170)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        적분과 미분의 관계를 활용하여 함수 $g(x)$를 미분하면 $g'(x)=2x^2-4x+12+(1-x)f(x)-(4-x)f(x-3)$임을 알 수 있다. 이제 $x$의 구간을 $x\le0$, $0<x\le3$, $x>3$으로 나누어 $g'(x)$의 개형을 조사하자.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        (가) $x\le0$인 경우: $g'(x)=2x^2-4x+12+(1-x)(-x)-(4-x)(3-x)=2x(x+1)$이고, $x=-1$일 때와 $x=0$일 때 $0$이 된다.
        (나) $0<x\le3$인 경우: $g'(x)=-x^3+5x=-x(x^2-5)$이고, $x=\sqrt5$일 때 $0$이 된다.
        (다) $x>3$인 경우: $g'(x)=-7x^2+17x=-x(7x-17)<0$이므로 항상 음수이다.
      criteria: ['4.A1']
    - id: 4b-3
      content: |
        $g'(x)$의 구간별 부호는 $x<-1$에서 양수, $x=-1$에서 $0$, $-1<x<0$에서 음수, $x=0$에서 $0$, $0<x<\sqrt5$에서 양수, $x=\sqrt5$에서 $0$, $x>\sqrt5$에서 음수이다. 따라서 <제시문1>에 의해 $x=-1,\ 0,\ \sqrt5$에서 극값을 갖는다.
      criteria: ['4.R1']
