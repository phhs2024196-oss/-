- id: '3'
  stem: |
    [문제 3-ⅲ] [문제 3-ⅱ]의 조건을 모두 만족하는 함수 $f(x)$에 대하여, 정수 계수를 가지는 사차함수 $y=g(x)$가 $g'(x)=f(x)$이고 사차방정식 $g(x)=0$이 서로 다른 네 개의 실근을 가진다고 한다. 이때 가능한 함수 $g(x)$를 모두 구하고 그 이유를 논하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: set, value: '{x**4 - 2*x**3 + x, x**4 - 3*x**3 + 4*x - 1, x**4 - 3*x**3 + 4*x - 2}', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g$의 극값은 $g(\alpha_1),g(\alpha_2),g(\alpha_3)$이고 네 실근 조건은 $g(\alpha_1)<0<g(\alpha_2)$, $g(\alpha_3)<0$. 근의 이차 관계식으로 $g(\alpha_i)$의 차수를 낮춘다.
    steps:
    - {id: 3a, content: '(i) $g=x^4-2x^3+x+d$: $\tfrac{5}{16}+d>0$, $d-\tfrac14<0$ → $d=0$. (ii) $g=x^4-3x^3+4x+d$: $g(2)=d<0$, $g(\alpha_2)=\tfrac{165}{64}\alpha_2-\tfrac{3}{32}+d>0$ → $d=-1,-2$', criteria: ['3.M1', '3.A1', '3.A2', '3.A3']}
    hint_ladder:
    - $g'(x)=f(x)$이므로 $g$의 극값을 갖는 점은 $f$의 세 근이다.
    - 사차함수가 네 실근을 가지려면 세 극값의 부호가 어떻게 되어야 하는가?
    - $\alpha$가 $2x^2-2x-1=0$ 또는 $4x^2-x-2=0$의 근임을 이용해 $g(\alpha)$를 일차식으로 줄이자.
  - id: S3-B
    audience: B
    source_flow: 2025 보고서 문항카드 9 예시답안 p.178-179(인쇄 쪽 174-175)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $g'(x)=f(x)$이므로 $g$는 $\alpha_1$, $\alpha_3$에서 극소, $\alpha_2$에서 극대이고, $g(x)=0$이 서로 다른 네 실근을 가질 조건은 $g(\alpha_1)<0$, $g(\alpha_2)>0$, $g(\alpha_3)<0$이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        (i) 먼저 $f(x)=4x^3-6x^2+1$이라고 가정하면 $g(x)=x^4-2x^3+x+d$이고 $d$는 정수이다. 문제의 조건으로부터 $g(\alpha_1)<0$, $g(\alpha_2)=g\left(\dfrac12\right)>0$이고 $g(\alpha_3)<0$을 만족해야 한다. $g\left(\dfrac12\right)=\dfrac{5}{16}+d>0$으로부터 $d\ge0$이 성립한다. 한편 $\alpha=\alpha_1$에 대해 $g(\alpha)=\alpha^4-2\alpha^3+\alpha+d=d-\dfrac14<0$을 얻게 되어 $d\le0$이다. 따라서 $g(x)=x^4-2x^3+x=x(x-1)(x^2-x-1)$이고 서로 다른 네 개의 실근을 가진다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        (ii) $f(x)=4x^3-9x^2+4$라고 가정하면 $g(x)=x^4-3x^3+4x+d$이고 $d$는 정수이다. 문제의 조건으로부터 $g(\alpha_1)<0$, $g(\alpha_2)>0$이고 $g(\alpha_3)=g(2)<0$을 만족해야 한다. $g(2)=d<0$으로부터 $d\le-1$이 성립한다. $g(0)=d\le-1$이므로 $g(x)=0$은 $\alpha_1$보다 작은 근을 하나 가진다. 따라서 추가적으로 조건 $g(\alpha_2)>0$을 만족하는 $d$의 값을 찾아야 한다. $q=\alpha_2$라고 두면 $4q^2-q-2=0$이 성립하고, 이를 이용하면 $g(\alpha_2)=g(q)=q^4-3q^3+4q+d=\dfrac{165}{64}q-\dfrac{3}{32}+d$가 된다.
      criteria: ['3.M1', '3.A2']
    - id: 3b-4
      content: |
        $\dfrac{11}{2}<\sqrt{33}<6$이므로 $\dfrac{13}{16}<\alpha_2=\dfrac{1+\sqrt{33}}{8}<\dfrac78$이다. 이를 이용하면
        $g(q)>\dfrac{165}{64}\times\dfrac{13}{16}-\dfrac{3}{32}+d=\dfrac{2049}{1024}+d$와 $g(q)<\dfrac{165}{64}\times\dfrac78-\dfrac{3}{32}+d=\dfrac{1107}{512}+d$이므로, $g(q)>0$을 만족하는 $d$의 값은 $d=-1,-2$이다.
        (i)과 (ii)를 종합하면, 가능한 함수 $g(x)$는 $x^4-2x^3+x$, $x^4-3x^3+4x-1$, $x^4-3x^3+4x-2$이다.
      criteria: ['3.A3']
