intent: |
  다항함수의 미분으로 함수의 증가와 감소, 극대와 극소, 좌표축과의 교점 등을 이용해 그래프의 개형을 올바르게 그릴 수 있는지 묻는다. 이차·삼차·사차방정식의 근에 대한 성질을 대응하는 다항함수의 그래프 개형으로 분석하는 능력을 평가한다(2025 보고서 문항카드 9 출제 의도 요약).
key_idea: |
  삼차함수가 서로 다른 세 실근을 가질 조건(극댓값×극솟값 $<0$)과 사잇값 부호 조건을 정수 조건과 결합하고, 사차함수 $g$가 네 실근을 가질 조건을 극값($g(\alpha_1)<0$, $g(\alpha_2)>0$, $g(\alpha_3)<0$)의 부호로 바꾼다.
stuck: |
  "모든 정수 $n$에 대하여 $[n,n+1]$은 근을 많아야 하나 포함한다"는 조건을 $f(0),f(1),f(2)$ 등 정수점에서의 부호 조건으로 바꾸는 것, 그리고 (iii)에서 $g(\alpha_2)$를 $\alpha_2$의 이차식 관계로 차수를 낮춰 평가하는 것
idea_tags: [IDEA-CUBIC-THREE-ROOTS-EXTREMA-PRODUCT, IDEA-INTEGER-POINT-SIGN, IDEA-QUARTIC-FOUR-ROOTS-EXTREMA]
tags: [삼차방정식의 근, 정수 조건, 사차함수 개형, 경우 분류]
elements:
  materials:
  - '정수 계수 삼차함수 $f(x)=4x^3+3ax^2+2bx+c$'
  - '서로 다른 세 실근 $\alpha_1<\alpha_2<\alpha_3$, 모든 정수 $n$에 대해 $[n,n+1]$은 근을 많아야 하나 포함'
  - '$g''(x)=f(x)$인 정수 계수 사차함수 $g(x)$'
  concepts:
  - '도함수를 이용한 극대·극소와 그래프 개형'
  - '삼차방정식이 서로 다른 세 실근을 가질 조건'
  - '사잇값 정리(부호 변화와 근의 존재)'
  - '연립일차부등식'
  - '이차부등식'
  - '부정적분'
  - '사차방정식의 실근 개수와 극값의 부호'
  tools:
  - '극댓값·극솟값의 곱 $<0$'
  - '정수점 $f(-1),f(0),f(1),f(2)$의 부호 조사'
  - '정수 조건 연립부등식 $1\le c\le-3a-5$, $-32-12a\le c$'
  - '$4q^2-q-2=0$을 써서 $g(q)$의 차수 낮추기'
  conditions:
  - '$a,b,c$는 정수'
  - '$f(x)=0$은 서로 다른 세 실근'
  - '모든 정수 $n$에 대해 $[n,n+1]$은 근을 많아야 하나 포함(닫힌구간이므로 정수 근은 이웃 두 구간에 걸침)'
  - '(ii) $b=0$, 두 근이 $[0,2]$에 포함'
  - '(iii) $g$는 정수 계수, $g(x)=0$은 서로 다른 네 실근'
  stimuli_used: [S1, S2, S3]
  subpart_links: '(iii)은 (ii)에서 결정된 두 함수 $f(x)=4x^3-6x^2+1$, $4x^3-9x^2+4$를 사용'

