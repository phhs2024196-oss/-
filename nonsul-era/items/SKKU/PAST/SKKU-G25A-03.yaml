stimuli:
- id: S1
  label: <제시문1>
  body: |
    함수 $f(x)$가 미분가능하고 $f'(a)=0$일 때, $x=a$의 좌우에서 $f'(x)$의 부호가
    • 양에서 음으로 바뀌면, $f(x)$는 $x=a$에서 극대이고, 극댓값 $f(a)$를 갖는다.
    • 음에서 양으로 바뀌면, $f(x)$는 $x=a$에서 극소이고, 극솟값 $f(a)$를 갖는다.
- id: S2
  label: <제시문2>
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능하고 $x=a$에서 극값을 가지면 $f'(a)=0$이다.
- id: S3
  label: <제시문3>
  body: |
    정수 $a,b,c$에 대하여 삼차함수 $f(x)=4x^3+3ax^2+2bx+c$가 다음의 두 조건을 모두 만족한다.
    • 방정식 $f(x)=0$은 서로 다른 세 실근 $\alpha_1,\alpha_2,\alpha_3$을 가진다. (단, $\alpha_1<\alpha_2<\alpha_3$)
    • 모든 정수 $n$에 대하여 닫힌구간 $[n,n+1]$은 세 실근 $\alpha_1,\alpha_2,\alpha_3$중 많아야 하나를 포함한다.

stem: |
  다음 <제시문1> ~ <제시문3>을 읽고 [문제 3-ⅰ] ~ [문제 3-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    [문제 3-ⅰ] <제시문3>에서 $a=-1,\ b=-3$일 때, 가능한 모든 함수 $f(x)$의 개수를 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 세 실근 조건 $f(-\tfrac12)f(1)<0$에서 $-1\le c\le4$, 정수점 부호로 $c=-1,0$을 제외한다.
    steps:
    - {id: 1a, content: '$\left(c+\tfrac74\right)(c-5)<0$, $c=-1$은 $f(-1)=-2$로 모순, $c=0$은 $\alpha_1,\alpha_2\in[-1,0]$로 모순, $c=1,2,3,4$ 가능 → 4개', criteria: ['1.M1', '1.A1', '1.R1', '1.A2']}
    hint_ladder:
    - 극댓값과 극솟값의 부호가 달라야 세 실근을 가진다.
    - $c$의 후보마다 $f(-1)$, $f(0)$, $f(1)$의 부호를 확인하자.
  - id: S1-B
    audience: B
    source_flow: 2025 보고서 문항카드 9 예시답안 p.177-178(인쇄 쪽 173-174)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=4x^3-3x^2-6x+c$를 미분하여 $f'(x)=12x^2-6x-6=6(2x+1)(x-1)$을 얻게 된다. $f'(x)=0$은 두 개의 근 $x=-\dfrac12,\ 1$을 가지므로 서로 다른 세 실근을 가지려면 $f\left(-\dfrac12\right)f(1)=\left(c+\dfrac74\right)(c-5)<0$이 성립한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이로부터 $-\dfrac74<c<5$를 얻게 되어, $c$는 정수이므로 $-1\le c\le4$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        (i) $c=-1$일 때, $f(0)=-1<0$이므로 $\alpha_1<-\dfrac12<\alpha_2<0<\alpha_3$이 성립한다. 따라서 실근 $\alpha_2$가 닫힌구간 $[-1,0]$에 포함되므로 $\alpha_1<-1$이다. 이 경우 $0<f(-1)=-2$가 되어 모순이다.
        (ii) $c=0$일 때, $f(x)=x(4x^2-3x-6)$이므로 $\alpha_1=\dfrac{3-\sqrt{105}}{8}$, $\alpha_2=0$, $\alpha_3=\dfrac{3+\sqrt{105}}{8}$이고 $\alpha_1,\alpha_2$가 닫힌구간 $[-1,0]$에 포함되어 모순이다.
        (iii) $c=1,2,3,4$일 때, $f(0)=c>0$이고 $f(1)=c-5<0$이므로 닫힌구간 $[0,1]$은 $\alpha_2$만을 포함한다.
      criteria: ['1.R1']
    - id: 1b-4
      content: |
        따라서, 가능한 함수 $f(x)$의 개수는 $4$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f'(x)=6(2x+1)(x-1)$을 구하고 세 실근 조건으로 $f\left(-\tfrac12\right)f(1)<0$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $-\tfrac74<c<5$에서 정수 $c$의 범위 $-1\le c\le4$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        $c=-1$, $c=0$이 정수 구간 조건에 모순임과 $c=1,2,3,4$가 조건을 만족함을 정수점에서의 함숫값 부호 등으로 밝혔다.
      depends_on: [1.A1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 1
      evidence: |
        가능한 함수의 개수 $4$를 답했다.
      depends_on: [1.R1]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 3-ⅱ] <제시문3>에서 $b=0$이고 세 실근 $\alpha_1,\alpha_2,\alpha_3$중 두 수가 닫힌구간 $[0,2]$에 포함될 때, 가능한 $\lvert\alpha_1\rvert+\lvert\alpha_2\rvert+\lvert\alpha_3\rvert$의 값을 모두 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: set, value: '{1/2 + sqrt(3), 2 + sqrt(33)/4}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(0)=0$이고 $ac<0$이므로 음의 근이 하나 있고, $\alpha_1<0<\alpha_2<1<\alpha_3\le2$에서 $f(0)>0$, $f(1)<0$, $f(2)\ge0$의 정수 연립부등식을 푼다.
    steps:
    - {id: 2a, content: '$1\le c\le-3a-5$, $-32-12a\le c$ → $(a,c)=(-2,1),(-3,4)$ → $\tfrac12+\sqrt3$, $2+\tfrac{\sqrt{33}}{4}$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2', '2.A3']}
    hint_ladder:
    - $b=0$이면 $x=0$에서 극값을 가진다. 이때 근의 부호 배치는?
    - $[0,1]$과 $[1,2]$는 각각 근을 많아야 하나 포함한다.
    - $f(0)$, $f(1)$, $f(2)$의 부호를 $a,c$의 부등식으로 쓰자.
  - id: S2-B
    audience: B
    source_flow: 2025 보고서 문항카드 9 예시답안 p.178(인쇄 쪽 174)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        함수 $f(x)=4x^3+3ax^2+c$를 미분하여 $f'(x)=12x^2+6ax=6x(2x+a)$를 얻게 된다. 세 개의 근이 존재하기 위해선 $f'(x)=0$이 서로 다른 두 개의 실근을 가져야 하므로 $a\ne0$이고 $f(0)f\left(-\dfrac a2\right)=c\left(c+\dfrac{a^3}{4}\right)<0$이다. 이로부터 $ac<0$임을 알 수 있다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $f'(0)=0$이므로 삼차방정식 $f(x)=0$은 적어도 하나의 음의 근을 가져야 한다. 따라서 닫힌구간 $[0,2]$에는 $\alpha_2,\alpha_3$가 포함된다. $\alpha_2=0$일 때, $f(x)=4x^3+3ax^2=0$은 중근 $x=0$을 갖게 되어 가능하지 않다. 그러므로 $\alpha_1<0<\alpha_2<1<\alpha_3\le2$가 성립하고, $f(0)=c>0$, $f(1)=4+3a+c<0$, $f(2)=32+12a+c\ge0$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $a$와 $c$가 정수이므로 $c\ge1$, $3a+c\le-5$, $12a+c\ge-32$이다. $1\le c\le-3a-5$와 $-32-12a\le c\le-3a-5$로부터 $a=-2,-3$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        (i) $a=-2$일 때, $c=1$이고 $f(x)=4x^3-6x^2+1=(2x-1)(2x^2-2x-1)$이므로 $\alpha_1=\dfrac{1-\sqrt3}{2}$, $\alpha_2=\dfrac12$, $\alpha_3=\dfrac{1+\sqrt3}{2}$을 얻게 된다. 이 경우 $\lvert\alpha_1\rvert+\lvert\alpha_2\rvert+\lvert\alpha_3\rvert=\dfrac12+\sqrt3$이다.
        (ii) $a=-3$일 때, $c=4$이고 $f(x)=4x^3-9x^2+4=(x-2)(4x^2-x-2)$이므로 $\alpha_1=\dfrac{1-\sqrt{33}}{8}$, $\alpha_2=\dfrac{1+\sqrt{33}}{8}$, $\alpha_3=2$를 얻게 된다. 이 경우 $\lvert\alpha_1\rvert+\lvert\alpha_2\rvert+\lvert\alpha_3\rvert=2+\dfrac{\sqrt{33}}{4}$이다.
      criteria: ['2.A2']
    - id: 2b-5
      content: |
        따라서, 가능한 $\lvert\alpha_1\rvert+\lvert\alpha_2\rvert+\lvert\alpha_3\rvert$의 값은 $\dfrac12+\sqrt3$, $2+\dfrac{\sqrt{33}}{4}$이다.
      criteria: ['2.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $f'(x)=6x(2x+a)$와 극값의 곱 조건 $c\left(c+\tfrac{a^3}{4}\right)<0$(또는 $ac<0$)을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        음의 근이 있고 $\alpha_2\ne0$임을 근거로 $\alpha_1<0<\alpha_2<1<\alpha_3\le2$를 밝히고 $f(0)>0$, $f(1)<0$, $f(2)\ge0$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        정수 연립부등식을 풀어 $(a,c)=(-2,1),(-3,4)$를 얻었다.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        두 경우의 세 근을 인수분해로 구했다.
      depends_on: [2.A1]
      implied_ok: true
      steps: [2b-4]
    - id: 2.A3
      mark_type: A
      points: 1
      evidence: |
        $\tfrac12+\sqrt3$, $2+\tfrac{\sqrt{33}}{4}$를 모두 답했다.
      depends_on: [2.A2]
      implied_ok: true
