intent: |
  적분을 이용해 곡선으로 둘러싸인 넓이를 구하고, 주어진 함수의 극값을 조사해 최댓값·최솟값을 구할 수 있는지 평가한다. (i)(ii)는 변수로 주어진 닫힌 구간 위에서 양수와 음수 값을 동시에 가지는 함수의 넓이를 함수로 나타낼 수 있는지, (iii)은 이렇게 구한 함수의 극값과 그래프 개형을 조사해 최솟값을 구할 수 있는지 본다(2025 보고서 문항카드 10 출제 의도 요약).
key_idea: |
  $3x^2-3$의 부호가 바뀌는 $x=\pm1$이 구간 $[t,t+1]$ 안에 있는지에 따라 $-3\le t<-2$, $-2\le t<-1$, $-1\le t\le0$으로 나누어 $g(t)$를 구하고, 구간별 도함수로 증감표를 만든다.
stuck: |
  $x=-1$이 구간 $[t,t+1]$에 포함되는 경우($-2\le t<-1$)에 적분을 $-1$에서 끊어 절댓값을 풀어야 한다는 점
idea_tags: [IDEA-ABS-AREA-SPLIT-AT-ROOT, IDEA-SLIDING-WINDOW-AREA-FUNCTION]
tags: [넓이 함수, 절댓값 적분, 경우 분류, 최솟값]
