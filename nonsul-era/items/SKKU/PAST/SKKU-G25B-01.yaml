stimuli:
- id: S1
  label: <제시문1>
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 $S=\displaystyle\int_a^b\lvert f(x)\rvert dx$이다.
- id: S2
  label: <제시문2>
  body: |
    $-3\le t\le0$인 임의의 실수 $t$에 대하여 곡선 $y=3x^2-3$과 $x$축 및 두 직선 $x=t$, $x=t+1$로 둘러싸인 도형의 넓이를 $g(t)$라 한다.

stem: |
  다음 <제시문1>과 <제시문2>를 읽고 [문제 1-ⅰ] ~ [문제 1-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    [문제 1-ⅰ] <제시문2>에서 정의된 함수 $g(t)$에 대하여, $g\left(-\dfrac32\right)$의 값을 구하고 그 이유를 논하시오.
  points: 6
  depends_on: []
  answer: {kind: value, value: '3/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 구간 $\left[-\tfrac32,-\tfrac12\right]$은 $x=-1$을 포함하므로 거기서 나누어 절댓값을 푼다.
    steps:
    - {id: 1a, content: '$\int_{-3/2}^{-1}(3x^2-3)dx+\int_{-1}^{-1/2}(3-3x^2)dx=\tfrac78+\tfrac58=\tfrac32$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $3x^2-3$의 부호가 바뀌는 점은 어디인가?
  - id: S1-B
    audience: B
    source_flow: 2025 보고서 문항카드 10 예시답안 p.182(인쇄 쪽 178)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $-\dfrac32\le x\le-1$에서 $3x^2-3\ge0$, $-1\le x\le-\dfrac12$에서 $3x^2-3\le0$이므로
        $g\left(-\dfrac32\right)=\displaystyle\int_{-3/2}^{-1}(3x^2-3)dx+\int_{-1}^{-1/2}(3-3x^2)dx$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $=\left[x^3-3x\right]_{-3/2}^{-1}+\left[3x-x^3\right]_{-1}^{-1/2}=\dfrac32$.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        적분 구간을 $x=-1$에서 나누고 각 구간에서 $\lvert3x^2-3\rvert$의 부호를 바르게 정한 적분식을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $g\left(-\tfrac32\right)=\tfrac32$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 1-ⅱ] <제시문2>에서 정의된 함수 $g(t)$의 식을 구하고, 그 이유를 논하시오.
  points: 12
  depends_on: []
  answer: {kind: expression, value: 'Piecewise((3*t**2 + 3*t - 2, t < -2), (-2*t**3 - 3*t**2 + 3*t + 6, t < -1), (-3*t**2 - 3*t + 2, True))', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x=-1$이 $[t,t+1]$의 왼쪽 밖·안·오른쪽 밖에 있는 세 경우로 나눈다.
    steps:
    - {id: 2a, content: '$g(t)=3t^2+3t-2\ (-3\le t<-2)$, $-2t^3-3t^2+3t+6\ (-2\le t<-1)$, $-3t^2-3t+2\ (-1\le t\le0)$', criteria: ['2.M1', '2.A1', '2.A2', '2.A3']}
    hint_ladder:
    - $t+1$이 $-1$보다 작은 경우, $t$가 $-1$보다 작고 $t+1$이 $-1$ 이상인 경우, $t\ge-1$인 경우로 나누자.
  - id: S2-B
    audience: B
    source_flow: 2025 보고서 문항카드 10 예시답안 p.182-183(인쇄 쪽 178-179)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        다음과 같이 세 가지 경우를 생각한다.
        (1) $-3\le t<-2$인 경우: 이때 $t\le t+1<-1$이므로 $t\le x\le t+1$일 때 $\lvert3x^2-3\rvert=3x^2-3$이다. 따라서 $g(t)=\displaystyle\int_t^{t+1}(3x^2-3)dx=\left[x^3-3x\right]_t^{t+1}=3t^2+3t-2$.
      criteria: ['2.M1', '2.A1']
    - id: 2b-2
      content: |
        (2) $-2\le t<-1$인 경우: 이때 $t<-1\le t+1$이므로 $t\le x<-1$에서 $\lvert3x^2-3\rvert=3x^2-3$이고, $-1\le x<t+1$에서 $\lvert3x^2-3\rvert=3-3x^2$이다. 따라서
        $g(t)=\displaystyle\int_t^{-1}(3x^2-3)dx+\int_{-1}^{t+1}(3-3x^2)dx=\left[x^3-3x\right]_t^{-1}+\left[3x-x^3\right]_{-1}^{t+1}=(-t^3+3t+2)+(-t^3-3t^2+4)=-2t^3-3t^2+3t+6$.
      criteria: ['2.M1', '2.A2']
    - id: 2b-3
      content: |
        (3) $-1\le t\le0$인 경우: $-1\le t<t+1\le1$이므로 $t\le x\le t+1$일 때 $\lvert3x^2-3\rvert=3-3x^2$이다. 따라서 $g(t)=\displaystyle\int_t^{t+1}(3-3x^2)dx=\left[3x-x^3\right]_t^{t+1}=-3t^2-3t+2$.
        위의 세 가지 경우를 종합하면
        $$g(t)=\begin{cases}3t^2+3t-2 & (-3\le t<-2)\\ -2t^3-3t^2+3t+6 & (-2\le t<-1)\\ -3t^2-3t+2 & (-1\le t\le0)\end{cases}$$
      criteria: ['2.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $x=-1$과 $[t,t+1]$의 위치 관계로 $-3\le t<-2$, $-2\le t<-1$, $-1\le t\le0$의 세 경우를 나누었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $-3\le t<-2$에서 $g(t)=3t^2+3t-2$를 구했다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $-2\le t<-1$에서 $-1$에서 나누어 $g(t)=-2t^3-3t^2+3t+6$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A3
      mark_type: A
      points: 3
      evidence: |
        $-1\le t\le0$에서 $g(t)=-3t^2-3t+2$를 구하고 세 식을 종합했다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 1-ⅲ] <제시문2>에서 정의된 함수 $g(t)$의 최솟값을 구하고, 그 이유를 논하시오.
  points: 12
  depends_on: ['2']
  answer: {kind: value, value: '4 - 3*sqrt(3)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 구간별 $g'(t)$의 부호로 증감표를 만들면 최솟값 후보는 극소점 $t=-\tfrac{1+\sqrt3}{2}$와 끝점이다.
    steps:
    - {id: 3a, content: '$g\left(-\tfrac{1+\sqrt3}{2}\right)=4-\tfrac32\sqrt3$이 $g(0)=2$, $g(-3)=16$보다 작다', criteria: ['3.M1', '3.A1', '3.R1']}
    hint_ladder:
    - 각 구간에서 $g'(t)$를 구해 부호를 조사하자.
    - $-2\le t<-1$에서 $g'(t)=-6t^2-6t+3$의 근은?
  - id: S3-B
    audience: B
    source_flow: 2025 보고서 문항카드 10 예시답안 p.183(인쇄 쪽 179)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1) $-3\le t<-2$인 경우: $g'(t)=6t+3<0$.
        (2) $-2\le t<-1$인 경우: $g'(t)=-6t^2-6t+3=-6\left(t+\dfrac{1+\sqrt3}{2}\right)\left(t+\dfrac{1-\sqrt3}{2}\right)$. 따라서 $-2\le t<-\dfrac{1+\sqrt3}{2}$에서 $g'(t)<0$, $-\dfrac{1+\sqrt3}{2}<t<-1$에서 $g'(t)>0$.
        (3) $-1\le t\le0$인 경우: $g'(t)=-6t-3$. 따라서 $-1<t<-\dfrac12$에서 $g'(t)>0$, $-\dfrac12<t<0$에서 $g'(t)<0$.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        이를 종합하여 닫힌구간 $[-3,0]$에서 함수 $g(t)$의 증가와 감소를 나타내는 표를 만들면
        $t=-3$: $16$ (감소) $t=-2$: $4$ (감소) $t=-\dfrac{1+\sqrt3}{2}$: $4-\dfrac32\sqrt3$ (증가) $t=-1$: $2$ (증가) $t=-\dfrac12$: $\dfrac{11}{4}$ (감소) $t=0$: $2$.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        따라서 함수 $g$는 $t=-\dfrac{1+\sqrt3}{2}$에서 최솟값을 가지고 그 최솟값은 $g\left(-\dfrac{1+\sqrt3}{2}\right)=4-\dfrac32\sqrt3$이다.
      criteria: ['3.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        세 구간에서 $g'(t)$를 구하고 부호(특히 $-6t^2-6t+3$의 근 $-\tfrac{1+\sqrt3}{2}$)를 조사했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [2.A1, 2.A2, 2.A3], max_points: 4}
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        $[-3,0]$에서의 증감표(끝점·극값 $16,4,4-\tfrac32\sqrt3,2,\tfrac{11}{4},2$)를 바르게 만들었다.
      depends_on: [3.M1]
      steps: [3b-2]
    - id: 3.R1
      mark_type: R
      points: 4
      evidence: |
        극솟값과 끝점 값을 비교해 최솟값 $4-\tfrac32\sqrt3$($t=-\tfrac{1+\sqrt3}{2}$)을 근거와 함께 결론지었다.
      depends_on: [3.A1]
      steps: [3b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

