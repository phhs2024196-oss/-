  materials:
  - '두 대각선의 교점이 $(a,0)$이고 $\overline{\mathrm{AB}}=2\sqrt2$, 대각선 $\mathrm{AC}$의 기울기 $a$인 정사각형 $\mathrm{ABCD}$(반시계 방향, $\mathrm{D}$의 $y$좌표 $>0$)'
  - '$f(a)$=점 A의 $y$좌표, $g(a)$=점 D의 $y$좌표'
  - '원 $x^2+y^2=4$'
  - '$\left\lvert f\left(2\sin\left(\tfrac{\pi}{2}a\right)\right)\right\rvert=\sqrt3$인 양수 $a$의 수열'
  concepts:
  - '직선의 방정식과 수직 조건'
  - '원의 방정식, 원과 직선의 교점'
  - '점과 직선 사이의 거리'
  - '이차방정식의 근의 공식'
  - '합성함수'
  - '사인함수의 주기와 그래프'
  - '등차수열의 합, $\Sigma$의 성질'
  tools:
  - '외접원 $(x-a)^2+y^2=4$과 대각선의 연립'
  - '$a$의 부호에 따른 경우 분류로 부호 결정'
  - '$t=2\sin\left(\tfrac\pi2a\right)$ 치환'
  - '두 항씩 묶어 합 $2n^2$'
  conditions:
  - '$\overline{\mathrm{AB}}=2\sqrt2$이므로 대각선 길이 $4$, 외접원 반지름 $2$'
  - '점 $\mathrm{D}$의 $y$좌표 $>0$, 꼭짓점은 반시계 방향'
  - '(iv) $a>0$'
  stimuli_used: [S1, S2]
  subpart_links: '(ii)·(iv)는 (i)에서 구한 $f(a)$, $g(a)$를 사용; (iii)은 <제시문1>의 대각선 AC 방정식만 사용'

