stimuli:
- id: S1
  label: <제시문1>
  body: |
    두 대각선의 교점이 $x$축 위에 놓여있는 정사각형 $\mathrm{ABCD}$가 다음 세 조건을 모두 만족한다.
    • $\overline{\mathrm{AB}}=2\sqrt2$이고 점 $\mathrm{D}$의 $y$좌표는 $0$보다 크다.
    • 두 대각선의 교점이 $(a,0)$일 때, 대각선 $\mathrm{AC}$의 기울기는 $a$이다.
    • 꼭짓점 $\mathrm{A}$, $\mathrm{B}$, $\mathrm{C}$, $\mathrm{D}$는 시곗바늘이 도는 반대 방향으로 주어진다.
- id: S2
  label: <제시문2>
  body: |
    임의의 실수 $a$에 대하여 <제시문1>의 두 대각선의 교점이 $(a,0)$일 때, 점 $\mathrm{A}$의 $y$좌표와 점 $\mathrm{D}$의 $y$좌표를 각각 함수 $f(a)$와 $g(a)$로 정의하자. 제시된 상황을 그림으로 나타내면 오른쪽 그림과 같다.

    [그림: 좌표평면에 정사각형 $\mathrm{ABCD}$가 그려져 있다. 두 대각선(점선)의 교점이 $x$축 위의 점 $a$(양수, 원점 O의 오른쪽)이다. $\mathrm{D}$는 $y$축 바로 오른쪽 제1사분면 위쪽, $\mathrm{C}$는 오른쪽 위, $\mathrm{B}$는 오른쪽 아래(제4사분면), $\mathrm{A}$는 $y$축 근처 아래(제4사분면)에 있고, 변 $\mathrm{AD}$가 원점 O 근처를 지난다. 대각선 $\mathrm{AC}$는 오른쪽 위로 올라가고 $\mathrm{BD}$는 오른쪽 아래로 내려간다.]

stem: |
  다음 <제시문1>과 <제시문2>를 읽고 [문제 2-ⅰ] ~ [문제 2-ⅳ]를 문항별로 풀이와 함께 답하시오. (40점)

subparts:
- id: '1'
  stem: |
    [문제 2-ⅰ] <제시문2>에 주어진 함수 $f(a)$와 $g(a)$를 각각 $a$에 관한 식으로 표현하고, 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'f(a) = -2*a/sqrt(1 + a**2); g(a) = 2/sqrt(1 + a**2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 꼭짓점은 외접원 $(x-a)^2+y^2=4$ 위에 있으므로 대각선 직선과의 교점의 $y$좌표는 $\pm\tfrac{2a}{\sqrt{1+a^2}}$, $\pm\tfrac{2}{\sqrt{1+a^2}}$이고 부호는 배치로 정한다.
    steps:
    - {id: 1a, content: '$f(a)=-\dfrac{2a}{\sqrt{1+a^2}}$, $g(a)=\dfrac{2}{\sqrt{1+a^2}}$', criteria: ['1.M1', '1.A1', '1.R1', '1.A2']}
    hint_ladder:
    - 정사각형의 네 꼭짓점은 대각선의 교점을 중심으로 하는 한 원 위에 있다. 반지름은?
    - 꼭짓점이 반시계 방향이고 $\mathrm{D}$가 위쪽에 있으면 $\mathrm{A}$는 어느 쪽인가?
  - id: S1-B
    audience: B
    source_flow: 2025 보고서 문항카드 11 예시답안 p.187(인쇄 쪽 183)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 꼭짓점 $\mathrm{A}$와 $\mathrm{C}$는 직선 $y=a(x-a)$와 원 $(x-a)^2+y^2=4$의 두 교점이 된다. 이 두 식을 연립하여 변수 $x$를 소거한 후, $y$에 대해서 풀면 $y=\pm\dfrac{2a}{\sqrt{1+a^2}}$를 얻는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이제 다음 세 가지 경우로 나누어 생각해보자.
        $a>0$인 경우: $a>0$이고 $f(a)<0$이므로 $f(a)=-\dfrac{2a}{\sqrt{1+a^2}}$를 얻는다.
        $a<0$인 경우: $a<0$이고 $f(a)>0$이므로 $f(a)=-\dfrac{2a}{\sqrt{1+a^2}}$를 얻는다.
        $a=0$인 경우: $f(a)=0$이고 $-\dfrac{2a}{\sqrt{1+a^2}}$에 $a=0$을 대입한 값도 $0$이므로 $f(a)=-\dfrac{2a}{\sqrt{1+a^2}}$가 성립한다.
        따라서 모든 실수 $a$에 대하여 $f(a)=-\dfrac{2a}{\sqrt{1+a^2}}$이다.
      criteria: ['1.R1', '1.A1']
    - id: 1b-3
      content: |
        또한 두 꼭짓점 $\mathrm{B}$와 $\mathrm{D}$는 직선 $y=-\dfrac1a(x-a)$와 원 $(x-a)^2+y^2=4$의 두 교점이 된다. 이 두 식을 연립하여 $x$를 소거한 후 $y$에 대해서 풀면 $y=\pm\dfrac{2}{\sqrt{1+a^2}}$를 얻는다.
        $a\ne0$인 경우: 모든 $a$에 대하여 $g(a)>0$이므로 $g(a)=\dfrac{2}{\sqrt{1+a^2}}$이다.
        $a=0$인 경우: $g(a)=2$이고 $\dfrac{2}{\sqrt{1+a^2}}$에 $a=0$을 대입한 값도 $2$이므로 $g(a)=\dfrac{2}{\sqrt{1+a^2}}$가 성립한다.
        따라서 모든 실수 $a$에 대하여 $g(a)=\dfrac{2}{\sqrt{1+a^2}}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        꼭짓점이 외접원 $(x-a)^2+y^2=4$ 위에 있음을 이용해 대각선 $y=a(x-a)$(및 $y=-\tfrac1a(x-a)$)와 연립했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $a>0$, $a<0$, $a=0$의 경우로 나누어 꼭짓점 배치에서 $f(a)$의 부호를 정했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $f(a)=-\dfrac{2a}{\sqrt{1+a^2}}$를 얻었다.
      depends_on: [1.M1, 1.R1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $g(a)=\dfrac{2}{\sqrt{1+a^2}}$를 ($a=0$ 포함) 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 2-ⅱ] <제시문2>에 주어진 함수 $f(a)$와 $g(a)$에 대하여, $\lvert f(a)-g(a)\rvert=1$이 되는 $a$의 값을 모두 구하고 그 이유를 논하시오.
  points: 7
  depends_on: ['1']
  answer: {kind: set, value: '{(-4 + sqrt(7))/3, (-4 - sqrt(7))/3}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\lvert f-g\rvert=\dfrac{2\lvert a+1\rvert}{\sqrt{1+a^2}}=1$을 제곱하면 $3a^2+8a+3=0$.
    steps:
    - {id: 2a, content: '$4(a+1)^2=1+a^2\iff3a^2+8a+3=0\iff a=\tfrac{-4\pm\sqrt7}{3}$', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - (i)의 결과로 $\lvert f(a)-g(a)\rvert$를 하나의 분수로 쓰자.
  - id: S2-B
    audience: B
    source_flow: 2025 보고서 문항카드 11 예시답안 p.187-188(인쇄 쪽 183-184)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        [문제 2-ⅰ]의 결과로부터 $\lvert f(a)-g(a)\rvert=\dfrac{2\lvert a+1\rvert}{\sqrt{1+a^2}}$이다. 이 값이 $1$이 되기 위해서는 $2\lvert a+1\rvert=\sqrt{1+a^2}$이 성립해야 한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        양변을 제곱해서 이차방정식 $3a^2+8a+3=0$의 근을 구하면 $a=\dfrac{-4\pm\sqrt7}{3}$을 얻는다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        (i)의 결과로 $\lvert f(a)-g(a)\rvert=\dfrac{2\lvert a+1\rvert}{\sqrt{1+a^2}}$를 세우고 $=1$ 조건을 이차방정식으로 바꾸었다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1, 1.A2], max_points: 4}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $a=\dfrac{-4\pm\sqrt7}{3}$ 두 값을 모두 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 2-ⅲ] <제시문1>에 주어진 정사각형 $\mathrm{ABCD}$의 두 대각선의 교점이 $(a,0)$이고 직선 $\mathrm{AC}$가 원 $x^2+y^2=4$와 접할 때, $a^2$의 값을 모두 구하고 그 이유를 논하시오.
  points: 7
  depends_on: []
  answer: {kind: set, value: '{2 + 2*sqrt(2)}', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 원점에서 직선 $ax-y-a^2=0$까지의 거리가 $2$.
    steps:
    - {id: 3a, content: '$\dfrac{a^2}{\sqrt{a^2+1}}=2\iff a^4-4a^2-4=0\iff a^2=2+2\sqrt2$($a^2\ge0$)', criteria: ['3.M1', '3.A1']}
    hint_ladder:
