intent: |
  기하학적 정보를 파악·수식화한 뒤 여러 수학적 이론을 활용해 필요한 정보를 얻어내는지 평가한다. 정사각형에 외접하는 원과 직선의 교점, 고정된 원과 직선의 위치 관계, 이차방정식의 판별식·근의 공식을 활용해 정사각형이 고정된 원에 접하는 경우, 선분 길이의 변화, 삼각함수를 합성해 얻는 함수와 연관된 등차수열의 합 등을 구할 수 있는지 본다(2025 보고서 문항카드 11 출제 의도 요약).
key_idea: |
  두 대각선은 서로를 수직이등분하므로 네 꼭짓점은 중심 $(a,0)$, 반지름 $2$인 외접원 위에 있다. 대각선 $\mathrm{AC}$: $y=a(x-a)$, $\mathrm{BD}$: $y=-\tfrac1a(x-a)$와 원을 연립해 $y$좌표를 얻는다.
stuck: |
  정사각형의 외접원(반지름 $=\tfrac12\times$대각선 $=2$)을 이용해 꼭짓점을 직선과 원의 교점으로 보는 것, 그리고 $f(a)$의 부호를 꼭짓점 배치(반시계 방향, $\mathrm{D}$의 $y$좌표 양수)로 결정하는 것
idea_tags: [IDEA-SQUARE-CIRCUMCIRCLE-DIAGONALS, IDEA-COMPOSE-TRIG-PERIODIC-ROOTS, IDEA-PAIRED-ARITHMETIC-SUM]
tags: [정사각형, 원과 직선, 점과 직선 사이의 거리, 삼각방정식, 수열의 합]
