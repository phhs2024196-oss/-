- id: '4'
  stem: |
    [문제 2-ⅳ] <제시문2>에 주어진 함수 $f(a)$에 대하여, $\left\lvert f\left(2\sin\left(\dfrac{\pi}{2}a\right)\right)\right\rvert=\sqrt3$이 되는 모든 양수 $a$를 작은 것부터 크기 순서대로 나열한 것을 수열 $\{a_n\}$으로 정의하자. 이때 부등식 $\displaystyle\sum_{k=1}^{m}a_k>2025$를 만족하는 가장 작은 자연수 $m$을 구하고, 그 이유를 논하시오.
  points: 16
  depends_on: ['1']
  answer: {kind: value, value: '64', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $t=2\sin\left(\tfrac\pi2a\right)$이면 $\tfrac{2\lvert t\rvert}{\sqrt{t^2+1}}=\sqrt3\iff t^2=3$. 한 주기 $(0,4]$에 해가 $\tfrac23,\tfrac43,\tfrac83,\tfrac{10}{3}$이고 $a_{2k-1}+a_{2k}=4k-2$.
    steps:
    - {id: 4a, content: '$\sum_{k=1}^{2n}a_k=2n^2$, $\sum^{62}=1922$, $\sum^{63}=1922+\tfrac{188}{3}<2025<\sum^{64}=2048$ → $m=64$', criteria: ['4.M1', '4.A1', '4.M2', '4.A2', '4.A3']}
    hint_ladder:
    - $2\sin\left(\tfrac\pi2a\right)$를 하나의 문자로 놓자.
    - $\sin\left(\tfrac\pi2a\right)=\pm\tfrac{\sqrt3}{2}$인 양수 $a$는 주기 $4$로 반복된다.
    - 연속한 두 항씩 묶어 더해 보자.
  - id: S4-B
    audience: B
    source_flow: 2025 보고서 문항카드 11 예시답안 p.188(인쇄 쪽 184)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $t=2\sin\left(\dfrac\pi2a\right)$라고 놓자. $\left\lvert f\left(2\sin\left(\dfrac\pi2a\right)\right)\right\rvert=\sqrt3$으로부터 $\dfrac{\lvert2t\rvert}{\sqrt{t^2+1}}=\sqrt3$이 된다. 양변을 제곱한 후에 정리하면 $t^2=3$을 얻는다. 이로부터 $t=2\sin\left(\dfrac\pi2a\right)=\pm\sqrt3$이 되는 양수 $a$를 찾아보자.
      criteria: ['4.M1', '4.A1']
    - id: 4b-2
      content: |
        $0<a\le4$일 때, $2\sin\left(\dfrac\pi2a\right)=\pm\sqrt3$이 되는 $a$의 값을 찾아보면 $\dfrac23,\ \dfrac43,\ \dfrac83,\ \dfrac{10}{3}$ 네 값뿐임을 알 수 있다. 이제 $2\sin\left(\dfrac\pi2a\right)$는 주기를 $4$로 갖는 주기함수임을 이용하면, $2\sin\left(\dfrac\pi2a\right)=\pm\sqrt3$이 되는 양수 $a$의 값은 $a=\dfrac23+2(k-1)$ 또는 $a=\dfrac43+2(k-1)$ (단, $k$는 자연수) 뿐임을 알 수 있다.
      criteria: ['4.M2']
    - id: 4b-3
      content: |
        따라서 이 값들을 크기 순서로 나열하여 얻어지는 수열 $\{a_n\}$은 $a_{2k-1}=\dfrac23+2(k-1)$이고 $a_{2k}=\dfrac43+2(k-1)$이다. 이로부터
        $\displaystyle\sum_{k=1}^{2n}a_k=\left(\dfrac23+\dfrac43\right)+\left(\dfrac83+\dfrac{10}{3}\right)+\left(\dfrac{14}{3}+\dfrac{16}{3}\right)+\cdots+\left(\dfrac23+2(n-1)+\dfrac43+2(n-1)\right)=2+6+10+\cdots+(4n-2)=2n^2$
        이므로 $\displaystyle\sum_{k=1}^{62}a_k=1922$, $\displaystyle\sum_{k=1}^{64}a_k=2048$을 얻는다.
      criteria: ['4.A2']
    - id: 4b-4
      content: |
        또한 $a_{63}=\dfrac{188}{3}$, $a_{64}=\dfrac{190}{3}$이므로 $\displaystyle\sum_{k=1}^{63}a_k<2025<\sum_{k=1}^{64}a_k$이고, $\displaystyle\sum_{k=1}^{m}a_k>2025$를 만족하는 최소의 자연수 $m$은 $64$임을 알 수 있다.
      criteria: ['4.A3']
