      depends_on: [4.M1]
      steps: [4b-1]
    - id: 4.M2
      mark_type: M
      points: 4
      evidence: |
        한 주기에서 해 $\tfrac23,\tfrac43,\tfrac83,\tfrac{10}{3}$을 찾고 주기 $4$를 이용해 일반항 $a_{2k-1}=\tfrac23+2(k-1)$, $a_{2k}=\tfrac43+2(k-1)$을 얻었다.
      depends_on: [4.A1]
      steps: [4b-2]
    - id: 4.A2
      mark_type: A
      points: 4
      evidence: |
        $\sum_{k=1}^{2n}a_k=2n^2$을 구하고 $\sum^{62}=1922$, $\sum^{64}=2048$을 계산했다.
      depends_on: [4.M2]
      steps: [4b-3]
