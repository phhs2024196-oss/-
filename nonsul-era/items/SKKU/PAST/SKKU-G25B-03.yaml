stimuli:
- id: S1
  label: <제시문1>
  body: |
    함수 $y=f(x)$에서 $x$의 값이 $a$에서 $a+\Delta x$까지 변할 때의 평균변화율은 $\dfrac{\Delta y}{\Delta x}=\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$이다. 여기서 $\Delta x\to0$일 때, 평균변화율의 극한값 $\displaystyle\lim_{\Delta x\to0}\dfrac{\Delta y}{\Delta x}=\lim_{\Delta x\to0}\dfrac{f(a+\Delta x)-f(a)}{\Delta x}$가 존재하면 함수 $y=f(x)$는 $x=a$에서 미분가능하다고 한다. 이때 이 극한값을 함수 $y=f(x)$의 $x=a$에서의 순간변화율 또는 미분계수라 하고, 기호로 $y=f'(a)$와 같이 나타낸다.
- id: S2
  label: <제시문2>
  body: |
    임의의 실수 $a$에 대하여, 곡선 $y=-x^2$과 직선 $y=ax+a$의 교점의 개수가 $f(a)$가 되도록 함수 $f(x)$를 정의하자.
- id: S3
  label: <제시문3>
  body: |
    최고차항의 계수가 $1$인 사차함수 $g(x)$와 <제시문2>의 함수 $f(x)$는 다음 세 조건을 모두 만족한다.
    • 사차방정식 $g(x)=0$은 허근을 가지지 않는다.
    • 함수 $h(x)=f(x)g(x)$는 모든 실수에서 연속이다.
    • 함수 $h(x)=f(x)g(x)$는 열린구간 $(2,10)$에서 미분가능하다.

stem: |
  다음 <제시문1> ~ <제시문3>을 읽고 [문제 3-ⅰ] ~ [문제 3-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    [문제 3-ⅰ] <제시문2>의 함수 $f(x)$에 대하여, $f(0)+f(1)+f(2)+f(3)+f(4)+f(5)$의 값을 구하고 그 이유를 논하시오.
  points: 5
  depends_on: []
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 교점의 개수 = $x^2+ax+a=0$의 실근의 개수, 판별식 $a(a-4)$.
    steps:
    - {id: 1a, content: '$f(0)=f(4)=1$, $f(1)=f(2)=f(3)=0$, $f(5)=2$ → 합 $4$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - 두 식을 연립한 이차방정식의 판별식을 보자.
  - id: S1-B
    audience: B
    source_flow: 2025 보고서 문항카드 12 예시답안 p.191-192(인쇄 쪽 187-188)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=-x^2$과 직선 $y=ax+a$의 교점의 개수는 이차방정식 $x^2+ax+a=0$의 실근의 개수와 같고 이는 이차방정식의 판별식으로 결정된다. 판별식이 $a^2-4a=a(a-4)$이므로 $f(a)=2$ ($a(a-4)>0$), $1$ ($a(a-4)=0$), $0$ ($a(a-4)<0$)이 된다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이를 정리하여 함수로 나타내면
        $$(*)\quad f(x)=\begin{cases}2 & (x>4)\\ 1 & (x=4)\\ 0 & (0<x<4)\\ 1 & (x=0)\\ 2 & (x<0)\end{cases}$$
        이다. 따라서 구하는 답은 $f(0)+f(1)+f(2)+f(3)+f(4)+f(5)=1+0+0+0+1+2=4$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        교점의 개수를 $x^2+ax+a=0$의 판별식 $a(a-4)$의 부호로 판정했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $f(x)$를 구간별로 정리하고 합 $4$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 3-ⅱ] <제시문3>의 함수 $h(x)$에 대하여, 가능한 $h(-1)+3h(2)+5h(5)$의 값을 모두 구하고 그 이유를 논하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: set, value: '{300}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 연속이면 $g(0)=g(4)=0$, $x=4$에서 좌미분계수 $0$=우미분계수 $2g'(4)$이므로 $g=x(x-4)^2(x-\alpha)$이고 $\alpha$가 상쇄된다.
    steps:
    - {id: 2a, content: '$2g(-1)+10g(5)=50(1+\alpha)+50(5-\alpha)=300$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2', '2.A3']}
    hint_ladder:
    - $f$가 불연속인 점은 $x=0$, $x=4$뿐이다. 그 점에서 $h$가 연속이려면?
    - $(2,10)$ 안에서 미분가능성이 문제 되는 점은 $x=4$이다. 좌·우 미분계수를 비교하자.
  - id: S2-B
    audience: B
    source_flow: 2025 보고서 문항카드 12 예시답안 p.192(인쇄 쪽 188)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        함수 $h(x)$를 (*)를 이용하여 나타내면 $h(x)=f(x)g(x)=2g(x)$ ($x>4$), $g(4)$ ($x=4$), $0$ ($0<x<4$), $g(0)$ ($x=0$), $2g(x)$ ($x<0$)이다. 함수 $h(x)$가 모든 실수에서 연속이므로 $g(0)=g(4)=0$이 성립한다. 따라서 $h(x)=2g(x)$ ($x>4$), $0$ ($0\le x\le4$), $2g(x)$ ($x<0$)이다.
      criteria: ['2.M1', '2.A1']
    - id: 2b-2
      content: |
        그리고 최고차항의 계수가 $1$인 이차함수 $k(x)$가 존재하여 $g(x)=(x^2-4x)k(x)$로 표현된다. 상수함수와 다항식은 모든 실수에서 미분가능하므로 함수 $h(x)$가 열린구간 $(2,10)$에서 미분가능하려면 $x=4$에서 미분가능해야 한다. 그러므로 $h'(4)=\displaystyle\lim_{\Delta x\to0+}\dfrac{h(4+\Delta x)-h(4)}{\Delta x}=\lim_{\Delta x\to0-}\dfrac{h(4+\Delta x)-h(4)}{\Delta x}$가 존재한다.
        함수 $h(x)$의 식을 이용하면 $\displaystyle\lim_{\Delta x\to0-}\dfrac{h(4+\Delta x)-h(4)}{\Delta x}=0$과 $\displaystyle\lim_{\Delta x\to0+}\dfrac{h(4+\Delta x)-h(4)}{\Delta x}=\lim_{\Delta x\to0+}\dfrac{2g(4+\Delta x)}{\Delta x}=\lim_{\Delta x\to0+}\dfrac{2g(4+\Delta x)-2g(4)}{\Delta x}=2g'(4)$이 되므로 $g'(4)=0$이 성립한다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        함수의 곱의 미분법을 사용하면 $g'(x)=(2x-4)k(x)+(x^2-4x)k'(x)$이 되고 $g'(4)=4k(4)=0$이 성립하므로 어떤 수 $\alpha$가 존재하여 $k(x)=(x-4)(x-\alpha)$가 된다. 즉,
        $$(*)\quad g(x)=x(x-4)^2(x-\alpha)=(x^2-8x+16)(x^2-\alpha x)$$
        형태가 된다.
      criteria: ['2.A2']
    - id: 2b-4
      content: |
        따라서 $g(-1)=25(1+\alpha)$, $g(5)=5(5-\alpha)$이고 구하는 답은 $h(-1)+3h(2)+5h(5)=2g(-1)+0+10g(5)=50(1+\alpha)+50(5-\alpha)=300$이다.
      criteria: ['2.A3']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        (i)의 $f$로 $h$를 구간별로 나타내고 $x=0,4$에서의 연속 조건을 적용했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 2}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $g(0)=g(4)=0$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $x=4$에서 좌미분계수 $0$과 우미분계수 $2g'(4)$를 미분계수의 정의로 비교해 $g'(4)=0$을 얻었다.
      depends_on: [2.A1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $g(x)=x(x-4)^2(x-\alpha)$ 꼴을 얻었다.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.A3
      mark_type: A
      points: 1
      evidence: |
        $h(-1)+3h(2)+5h(5)=300$($\alpha$와 무관)을 계산했다.
      depends_on: [2.M2, 2.A2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 3-ⅲ] <제시문3>의 함수 $g(x)$에 대하여 두 방정식 $g(x)=0$과 $g'(x)+5x^3-20x^2=0$의 실근이 모두 정수이다. 이때 가능한 사차함수 $g(x)$의 개수를 구하고, 그 이유를 논하시오.
  points: 15
  depends_on: ['2']
  answer: {kind: value, value: '9', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $g'(x)+5x^3-20x^2=(x-4)(9x^2-(3\alpha+8)x+4\alpha)$이고 이차식은 정수근을 가질 수 없으므로 판별식 $<0$, 즉 $(3\alpha-16)^2<192$.
    steps:
    - {id: 3a, content: '$\alpha$ 정수, $-13\le3\alpha-16\le13\iff1\le\alpha\le9$ → $9$개', criteria: ['3.M1', '3.A1', '3.R1', '3.M2', '3.A2']}
    hint_ladder:
    - $g(x)=0$의 근 $\alpha$는 어떤 수여야 하는가?
    - $g'(x)+5x^3-20x^2$를 $x-4$로 묶어 보자.
    - 남은 이차방정식이 두 정수근을 가진다고 하고 근과 계수의 관계를 써 보자.
  - id: S3-B
    audience: B
    source_flow: 2025 보고서 문항카드 12 예시답안 p.192-193(인쇄 쪽 188-189)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        사차함수 $g(x)$가 식 (*)의 형태로 표현될 때 $\alpha$는 $g(x)=0$의 근이 되므로 실수가 되어야 하고 $g(x)=0$의 모든 실근이 정수가 되어야 하므로 $\alpha$는 정수이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        그리고 식 (*)로부터 $g'(x)=(2x-8)(x^2-\alpha x)+(x^2-8x+16)(2x-\alpha)=(x-4)\left(4x^2-(3\alpha+8)x+4\alpha\right)$이고
        $g'(x)+5x^3-20x^2=g'(x)+5x^2(x-4)=(x-4)\left(9x^2-(3\alpha+8)x+4\alpha\right)$이다. 따라서 방정식 $g'(x)+5x^3-20x^2=0$의 실근은 $x=4$와 방정식 $9x^2-(3\alpha+8)x+4\alpha=0$의 실근이다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        방정식 $9x^2-(3\alpha+8)x+4\alpha=0$의 계수가 모두 실수이므로 (근과 계수의 관계를 이용하면) 실근과 허근을 동시에 가지는 경우는 발생하지 않는다. 따라서 만약 이 방정식이 실근을 가진다고 하면 어떤 실수 $A,B$가 존재하여 $9x^2-(3\alpha+8)x+4\alpha=9(x-A)(x-B)$ 형태가 된다. 해당 방정식의 모든 실근이 정수가 되어야 하므로 $A,B$는 정수이고, 이 경우 근과 계수의 관계를 통하여 $A+B=\dfrac{3\alpha+8}{9}$, $A\cdot B=\dfrac{4\alpha}{9}$가 성립한다. 두 번째 식으로부터 어떤 정수 $l$이 존재하여 $\alpha=9l$이 되지만, 이를 첫 번째 식에 대입하면 $A+B$가 정수라는 조건에 모순이 된다. 따라서 방정식 $9x^2-(3\alpha+8)x+4\alpha=0$은 실근을 가지지 않는다.
      criteria: ['3.R1']
    - id: 3b-4
      content: |
        이는 해당 방정식의 판별식이 음수가 되는 것과 같은 의미이다. 이를 식으로 표현하면 $(3\alpha+8)^2-144\alpha<0$이고 이를 정리하면 $(3\alpha-16)^2<192$가 된다.
      criteria: ['3.M2']
    - id: 3b-5
      content: |
        $\alpha$가 정수이므로 $-13\le3\alpha-16\le13$, 즉 $1\le\alpha\le9$이다. 따라서 $\alpha$는 $1\le\alpha\le9$인 정수가 모두 가능하다. 각각의 $\alpha$에 따라 서로 다른 사차함수 $g(x)$가 존재하므로 답은 총 $9$개다.
      criteria: ['3.A2']
