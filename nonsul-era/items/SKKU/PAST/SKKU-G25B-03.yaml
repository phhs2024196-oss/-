intent: |
  극한, 연속, 미분의 정의를 올바르게 이해하고 문제에 적용할 수 있는지 평가한다. 또한 이차방정식이 실근을 가질 때 모두 정수가 된다고 제한하여, 근과 계수의 관계로 그 이차방정식이 실근을 가지지 않음을 보이고 이를 판별식과 관련한 부등식으로 해결할 수 있는지 평가한다(2025 보고서 문항카드 12 출제 의도 요약).
key_idea: |
  $f(x)$는 $x=0,4$에서만 값이 튀는 계단 함수이므로 $h=fg$의 연속은 $g(0)=g(4)=0$, $x=4$에서의 미분가능은 $g'(4)=0$을 뜻해 $g(x)=x(x-4)^2(x-\alpha)$. (iii)에서 $9x^2-(3\alpha+8)x+4\alpha=0$은 정수근을 가질 수 없으므로 실근이 없어야 한다.
stuck: |
  $x=4$에서 좌미분계수 $0$과 우미분계수 $2g'(4)$가 같아야 한다는 조건을 끌어내는 것, (iii)에서 "실근이 모두 정수"를 "이차방정식이 실근을 갖지 않음"으로 바꾸는 근과 계수의 관계 논증
