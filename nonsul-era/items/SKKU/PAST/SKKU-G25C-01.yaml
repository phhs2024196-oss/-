- id: '4'
  stem: |
    [문제 1-ⅳ] <제시문>에 주어진 함수 $f(\theta)$의 값이 선분 $\mathrm{AC}$의 길이와 같을 때, $\cos\theta$의 값을 모두 구하고 그 이유를 논하시오.
