stimuli:
- id: S1
  label: <제시문>
  body: |
    좌표평면 위의 세 점 $\mathrm{B}$, $\mathrm{C}$, $\mathrm{D}$를 다음과 같이 정의하자.
    • 점 $\mathrm{B}$와 $\mathrm{C}$의 좌표는 각각 $(-4,0)$과 $(0,0)$이다.
    • 점 $\mathrm{D}$의 $y$좌표는 양수이고, 선분 $\mathrm{CD}$의 길이는 $3$이다.
    점 $\mathrm{C}$에서 직선 $\mathrm{BC}$와 접하고, 점 $\mathrm{D}$를 지나는 원을 생각하자. 직선 $\mathrm{BD}$가 점 $\mathrm{D}$를 제외하고 이 원과 다시 만나는 점을 점 $\mathrm{A}$라 하자. $\angle\mathrm{BCD}=\theta$라 할 때, 함수 $f(\theta)$를 선분 $\mathrm{AD}$의 길이로 정의하자. 단, 원이 점 $\mathrm{D}$에서 직선 $\mathrm{BD}$와 접할 경우에는, 점 $\mathrm{A}$를 점 $\mathrm{D}$로 정의하고 그 때의 $\theta$의 값을 $\alpha$라고 하며 $f(\alpha)=0$으로 정의한다. $0<\theta<\alpha$일 때, 제시된 상황을 그림으로 나타내면 아래와 같다.

    [그림: 수평선(직선 BC, $x$축) 위에 왼쪽부터 점 $\mathrm{B}$, $\mathrm{C}$가 있고, 원이 점 $\mathrm{C}$에서 수평선에 접하며 그 위쪽에 놓여 있다. 원 위의 왼쪽 점 $\mathrm{D}$와 맨 위 근처의 점 $\mathrm{A}$가 있고, $\mathrm{B}$에서 $\mathrm{D}$를 지나 $\mathrm{A}$까지 직선이 그어져 있다($\mathrm{D}$는 $\mathrm{B}$와 $\mathrm{A}$ 사이). 선분 $\mathrm{CD}$, $\mathrm{CA}$가 그어져 있고, $\mathrm{C}$에서 선분 $\mathrm{CB}$와 $\mathrm{CD}$ 사이의 각이 $\theta$로 표시되어 있다.]

stem: |
  다음 <제시문>을 읽고 [문제 1-ⅰ] ~ [문제 1-ⅳ]를 문항별로 풀이와 함께 답하시오. (40점)

subparts:
- id: '1'
  stem: |
    [문제 1-ⅰ] <제시문>에 주어진 원의 반지름을 $\theta$에 관한 식으로 표현하고, 그 이유를 논하시오.
  points: 9
  depends_on: []
  answer: {kind: expression, value: '3/(2*sin(theta))', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선과 현이 이루는 각에 의해 현 $\mathrm{CD}$에 대한 원주각의 사인값은 $\sin\theta$이므로 $\dfrac{3}{\sin\theta}=2r$.
    steps:
    - {id: 1a, content: '$r=\dfrac{3}{2\sin\theta}$($\theta<\alpha$, $\theta>\alpha$, $\theta=\alpha$ 모두)', criteria: ['1.M1', '1.R1', '1.A1']}
    hint_ladder:
    - 원의 접선과 그 접점을 지나는 현이 이루는 각은 그 각 안에 있는 호에 대한 원주각과 같다.
    - 삼각형 $\mathrm{CAD}$의 외접원이 바로 주어진 원이다.
  - id: S1-B
    audience: B
    source_flow: 2025 보고서 문항카드 13 예시답안 p.196(인쇄 쪽 192)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        원의 반지름을 $r$이라고 하자.
        $0<\theta<\alpha$인 경우: $\angle\mathrm{CAD}=\theta$이므로, 삼각형 $\mathrm{CAD}$에 사인법칙을 적용하면 $\dfrac{3}{\sin\theta}=2r$이므로 $r=\dfrac{3}{2\sin\theta}$를 얻는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\alpha<\theta<\pi$인 경우: $\angle\mathrm{CAD}=\pi-\theta$이므로, 삼각형 $\mathrm{CAD}$에 사인법칙을 적용하면 $\dfrac{3}{\sin(\pi-\theta)}=2r$이므로 $r=\dfrac{3}{2\sin\theta}$를 얻는다.
        $\theta=\alpha$인 경우: 더 긴 길이를 갖는 호 $\mathrm{AC}$ 위에 양 끝점이 아닌 임의의 점을 $\mathrm{E}$라고 하자. 삼각형 $\mathrm{ACE}$에 사인법칙을 적용하면 $\dfrac{3}{\sin\alpha}=2r$이므로 $r=\dfrac{3}{2\sin\alpha}$를 얻는다.
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        따라서 모든 경우에 $r=\dfrac{3}{2\sin\theta}$를 얻는다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        접선과 현이 이루는 각으로 $\angle\mathrm{CAD}=\theta$(또는 $\pi-\theta$)를 밝히고 삼각형 $\mathrm{CAD}$에 사인법칙 $\dfrac{3}{\sin\angle\mathrm{CAD}}=2r$을 적용했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: |
        $\theta>\alpha$인 경우($\angle\mathrm{CAD}=\pi-\theta$)와 $\theta=\alpha$인 경우도 같은 식이 됨을 밝혔다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $r=\dfrac{3}{2\sin\theta}$를 답했다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 1-ⅱ] <제시문>에 주어진 $\alpha$와 원에 대하여 $\cos\alpha$의 값과 원의 반지름을 각각 구하고, 그 이유를 논하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'cos(alpha) = 3/8; r = 12/sqrt(55)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 원이 $\mathrm{D}$에서 $\mathrm{BD}$에 접하면 $\mathrm{B}$에서 그은 두 접선의 길이가 같아 $\overline{\mathrm{BD}}=\overline{\mathrm{BC}}=4$.
    steps:
    - {id: 2a, content: '$16=16+9-24\cos\alpha\Rightarrow\cos\alpha=\tfrac38$, $\sin\alpha=\tfrac{\sqrt{55}}{8}$, $r=\tfrac{12}{\sqrt{55}}$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - 원 밖의 점 $\mathrm{B}$에서 원에 그은 두 접선의 길이를 비교하자.
  - id: S2-B
    audience: B
    source_flow: 2025 보고서 문항카드 13 예시답안 p.197(인쇄 쪽 193)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        원이 점 $\mathrm{D}$에서 직선 $\mathrm{BD}$와 접할 경우, 삼각형 $\mathrm{BCD}$는 이등변삼각형이 된다. $\overline{\mathrm{BC}}=\overline{\mathrm{BD}}=4$, $\overline{\mathrm{CD}}=3$, $\angle\mathrm{BCD}=\alpha$이므로 코사인법칙을 적용하면 $4^2=4^2+3^2-2\cdot4\cdot3\cos\alpha$를 얻는다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이로부터 $\cos\alpha=\dfrac38$임을 알 수 있다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        이로부터 $\sin\alpha=\dfrac{\sqrt{55}}{8}$이 되고, [문제 1-ⅰ]의 결과를 적용하면 $r=\dfrac{3}{2\sin\alpha}=\dfrac{12}{\sqrt{55}}$임을 알 수 있다.
      criteria: ['2.A2']
  - id: S2-ALT
    audience: ALT
    source_flow: 2025 보고서 문항카드 13 예시답안 p.197(인쇄 쪽 193) 별해
    method_no: 2
    key_idea: 이등변삼각형 $\mathrm{BCD}$에서 밑변 $\mathrm{CD}$의 중점 $\mathrm{H}$를 잡으면 $\mathrm{BH}\perp\mathrm{CD}$.
    steps:
    - id: 2c-1
      content: |
        선분 $\mathrm{CD}$의 중점을 $\mathrm{H}$라고 하면 $\cos\alpha=\dfrac{\overline{\mathrm{CH}}}{\overline{\mathrm{BC}}}=\dfrac{3/2}{4}=\dfrac38$을 얻는다.
      criteria: ['2.M1', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        접할 때 $\overline{\mathrm{BD}}=\overline{\mathrm{BC}}=4$(이등변삼각형)임을 밝히고 코사인법칙(또는 중점 $\mathrm{H}$로 직각삼각형)을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\cos\alpha=\tfrac38$을 얻었다.
      depends_on: [2.M1]
      steps: [2b-2, 2c-1]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $\sin\alpha=\tfrac{\sqrt{55}}{8}$과 (i)로 반지름 $\tfrac{12}{\sqrt{55}}$를 구했다.
      depends_on: [2.A1]
      implied_ok: true
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 1-ⅲ] <제시문>에 주어진 함수 $f(\theta)$에 대하여, $f\left(\dfrac{\pi}{3}\right)$와 $f\left(\dfrac{\pi}{2}\right)$의 값을 각각 구하고 그 이유를 논하시오.
  points: 10
  depends_on: ['2']
  answer: {kind: expression, value: 'f(pi/3) = 3/sqrt(13); f(pi/2) = 9/5', equivalents: [], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{BD}}^2=25-24\cos\theta$, $\overline{\mathrm{BC}}^2=16=\overline{\mathrm{BD}}\cdot\overline{\mathrm{BA}}$, $\tfrac\pi3<\alpha<\tfrac\pi2$로 경우 선택.
    steps:
    - {id: 3a, content: '$\theta<\alpha$: $f=\tfrac{24\cos\theta-9}{\sqrt{25-24\cos\theta}}$, $\theta>\alpha$: $f=\tfrac{9-24\cos\theta}{\sqrt{25-24\cos\theta}}$ → $f(\tfrac\pi3)=\tfrac{3}{\sqrt{13}}$, $f(\tfrac\pi2)=\tfrac95$', criteria: ['3.M1', '3.A1', '3.R1', '3.A2']}
    hint_ladder:
    - 점 $\mathrm{B}$에서의 접선 길이 $\overline{\mathrm{BC}}=4$와 할선 $\mathrm{BDA}$의 관계를 쓰자.
    - $\theta$가 $\alpha$보다 작으면 $\mathrm{A}$는 $\mathrm{D}$보다 $\mathrm{B}$에서 먼가, 가까운가?
  - id: S3-B
    audience: B
    source_flow: 2025 보고서 문항카드 13 예시답안 p.197(인쇄 쪽 193)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        삼각형 $\mathrm{BCD}$에 코사인법칙을 적용하면 $\overline{\mathrm{BD}}^2=9+16-2\cdot3\cdot4\cos\theta=25-24\cos\theta$를 얻는다. 이제 다음 두 경우를 나누어서 생각해보자.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        $0<\theta<\alpha$인 경우: $4^2=\overline{\mathrm{BD}}\left(\overline{\mathrm{BD}}+f(\theta)\right)=\overline{\mathrm{BD}}^2+\overline{\mathrm{BD}}\cdot f(\theta)=25-24\cos\theta+\overline{\mathrm{BD}}\cdot f(\theta)$이므로 $f(\theta)=\dfrac{24\cos\theta-9}{\sqrt{25-24\cos\theta}}$를 얻는다.
        $\alpha<\theta<\pi$인 경우: $4^2=\left(\overline{\mathrm{BD}}-f(\theta)\right)\overline{\mathrm{BD}}=\overline{\mathrm{BD}}^2-\overline{\mathrm{BD}}\cdot f(\theta)=25-24\cos\theta-\overline{\mathrm{BD}}\cdot f(\theta)$이므로 $f(\theta)=\dfrac{9-24\cos\theta}{\sqrt{25-24\cos\theta}}$를 얻는다.
      criteria: ['3.A1']
    - id: 3b-3
      content: |
        이제 $\dfrac\pi3<\alpha<\dfrac\pi2$이므로($\cos\alpha=\tfrac38$), 위에서 얻은 $f(\theta)$에 대한 첫 번째 경우의 식으로부터 $f\left(\dfrac\pi3\right)=\dfrac{3}{\sqrt{13}}$과 두 번째 경우의 식으로부터 $f\left(\dfrac\pi2\right)=\dfrac95$를 얻는다.
      criteria: ['3.R1', '3.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        코사인법칙 $\overline{\mathrm{BD}}^2=25-24\cos\theta$와 접선-할선 관계 $\overline{\mathrm{BC}}^2=\overline{\mathrm{BD}}\cdot\overline{\mathrm{BA}}$를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 3
