intent: |
  기하학적 정보를 파악·수식화한 뒤 여러 수학적 이론을 활용해 필요한 정보를 얻는지 평가한다. 원 밖의 한 점에서 원에 그은 직선(할선) 또는 접선과 관련된 기하학적 요소를 이해하고, 사인법칙·코사인법칙 등을 활용해 원에 내접하는 삼각형의 반지름, 선분의 길이, 내각의 크기 등을 구할 수 있는지 본다(2025 보고서 문항카드 13 출제 의도 요약).
key_idea: |
  접선과 현이 이루는 각($\angle\mathrm{CAD}=\theta$ 또는 $\pi-\theta$)으로 사인법칙을 써서 $r=\dfrac{3}{2\sin\theta}$를 얻고, 할선-접선 관계 $\overline{\mathrm{BC}}^2=\overline{\mathrm{BD}}\cdot\overline{\mathrm{BA}}$와 코사인법칙 $\overline{\mathrm{BD}}^2=25-24\cos\theta$로 $f(\theta)$를 구한다.
stuck: |
  $\theta$가 $\alpha$보다 작은지 큰지에 따라 점 $\mathrm{A}$가 선분 $\mathrm{BD}$의 연장선 위에 있는지($\overline{\mathrm{BA}}=\overline{\mathrm{BD}}+f$) 선분 위에 있는지($\overline{\mathrm{BA}}=\overline{\mathrm{BD}}-f$)를 구분하는 것, (iv)에서 $\triangle\mathrm{BCD}\sim\triangle\mathrm{BAC}$로 $\overline{\mathrm{AC}}\cdot\overline{\mathrm{BD}}=12$를 얻는 것
