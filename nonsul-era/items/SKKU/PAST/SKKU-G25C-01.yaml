  answer: {kind: set, value: '{7/8, -1/8}', equivalents: [], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: $\triangle\mathrm{BCD}\sim\triangle\mathrm{BAC}$에서 $\overline{\mathrm{AC}}\cdot\overline{\mathrm{BD}}=12$, 이를 $16=\overline{\mathrm{BD}}^2\pm\overline{\mathrm{BD}}\cdot\overline{\mathrm{AC}}$에 대입.
    steps:
    - {id: 4a, content: '$\theta<\alpha$: $\overline{\mathrm{BD}}=2$, $\cos\theta=\tfrac78$; $\theta>\alpha$: $\overline{\mathrm{BD}}=2\sqrt7$, $\cos\theta=-\tfrac18$; $\theta=\alpha$는 불가', criteria: ['4.R1', '4.M1', '4.A1', '4.A2']}
    hint_ladder:
    - 삼각형 $\mathrm{BCD}$와 삼각형 $\mathrm{BAC}$는 각 $\mathrm{B}$를 공유하고 접선과 현이 이루는 각이 같다.
    - $\theta=\alpha$인 경우도 따로 확인하자.
  - id: S4-B
    audience: B
    source_flow: 2025 보고서 문항카드 13 예시답안 p.197-198(인쇄 쪽 193-194)
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        다음 세 가지 경우로 나누어서 생각해보자.
        $\theta=\alpha$인 경우: 점 $\mathrm{A}$는 점 $\mathrm{D}$와 같으므로 $f(\theta)=0$이다. 한편, $\overline{\mathrm{AC}}=\overline{\mathrm{DC}}=3$이므로, 이 경우에 $f(\theta)$는 $\overline{\mathrm{AC}}$와 같지 않게 된다.
      criteria: ['4.R1']
    - id: 4b-2
      content: |
        $0<\theta<\alpha$인 경우: $4^2=\overline{\mathrm{BD}}\left(\overline{\mathrm{BD}}+f(\theta)\right)=\overline{\mathrm{BD}}^2+\overline{\mathrm{BD}}\cdot f(\theta)=\overline{\mathrm{BD}}^2+\overline{\mathrm{BD}}\cdot\overline{\mathrm{AC}}$가 성립한다. 한편, 삼각형 $\mathrm{BCD}$와 삼각형 $\mathrm{BAC}$는 서로 닮음이므로, $3:\overline{\mathrm{AC}}=4:\left(f(\theta)+\overline{\mathrm{BD}}\right)$를 얻는다. 이로부터 $4\overline{\mathrm{AC}}=3\left(f(\theta)+\overline{\mathrm{BD}}\right)=3\cdot\dfrac{16}{\overline{\mathrm{BD}}}$이 되므로 $\overline{\mathrm{AC}}\cdot\overline{\mathrm{BD}}=12$임을 알 수 있다.
      criteria: ['4.M1']
    - id: 4b-3
      content: |
        따라서 $4^2=\overline{\mathrm{BD}}^2+\overline{\mathrm{BD}}\cdot\overline{\mathrm{AC}}=\overline{\mathrm{BD}}^2+12$로부터 $\overline{\mathrm{BD}}=2$를 얻는다. 이제 삼각형 $\mathrm{BCD}$에 코사인법칙을 적용하면, $4=9+16-2\cdot3\cdot4\cos\theta=25-24\cos\theta$로부터 $\cos\theta=\dfrac78$을 얻는다.
      criteria: ['4.A1']
    - id: 4b-4
      content: |
        $\alpha<\theta<\pi$인 경우: $4^2=\left(\overline{\mathrm{BD}}-f(\theta)\right)\overline{\mathrm{BD}}=\overline{\mathrm{BD}}^2-\overline{\mathrm{BD}}\cdot f(\theta)=\overline{\mathrm{BD}}^2-\overline{\mathrm{BD}}\cdot\overline{\mathrm{AC}}$가 성립한다. 한편, 삼각형 $\mathrm{BAC}$와 삼각형 $\mathrm{BCD}$는 서로 닮음이므로, $\overline{\mathrm{AC}}:3=4:\overline{\mathrm{BD}}$를 얻는다. 이로부터 $\overline{\mathrm{AC}}\cdot\overline{\mathrm{BD}}=12$임을 알 수 있다. 따라서 $4^2=\overline{\mathrm{BD}}^2-\overline{\mathrm{BD}}\cdot\overline{\mathrm{AC}}=\overline{\mathrm{BD}}^2-12$로부터 $\overline{\mathrm{BD}}=2\sqrt7$을 얻는다. 이제 삼각형 $\mathrm{BCD}$에 코사인법칙을 적용하면, $28=9+16-2\cdot3\cdot4\cos\theta=25-24\cos\theta$로부터 $\cos\theta=-\dfrac18$을 얻는다.
        답: $\dfrac78$, $-\dfrac18$
      criteria: ['4.A2']
