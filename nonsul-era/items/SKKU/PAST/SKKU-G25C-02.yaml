        $\therefore$ 점 $\mathrm{D}$는 직선 $\mathrm{AD}:y=\dfrac14(x-w)+\dfrac12(w+1)$과 곡선 $y=1-x^2$의 교점의 $x$좌표이므로, $x=w+1$은 $\dfrac14(x-w)+\dfrac12(w+1)=1-x^2$의 해가 된다.
