stimuli:
- id: S1
  label: <제시문>
  body: |
    아래 그림과 같이 곡선 $y=1-x^2$과 $x$축으로 둘러싸인 도형이 직선 $\mathrm{L}:y=\dfrac x2+\dfrac12$에 의해 두 부분으로 나누어진다. 이때 윗 부분의 도형을 $\mathrm{P}$라 하고 아랫 부분의 도형을 $\mathrm{Q}$라고 하자.

    [그림: 포물선 $y=1-x^2$과 $x$축, 직선 $\mathrm{L}$이 그려져 있다. $\mathrm{L}$은 점 $(-1,0)$에서 포물선·$x$축과 만나 오른쪽 위로 올라가 포물선과 다시 만난다. $\mathrm{L}$ 위쪽, 포물선 아래의 빗금 친 부분이 $\mathrm{P}$, $\mathrm{L}$ 아래쪽·$x$축 위쪽·포물선 아래의 회색 부분이 $\mathrm{Q}$이다.]

stem: |
  다음 <제시문>을 읽고 [문제 2-ⅰ] ~ [문제 2-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: '1'
  stem: |
    [문제 2-ⅰ] <제시문>에서 주어진 도형 $\mathrm{P}$의 넓이 $\mathrm{S_P}$와 도형 $\mathrm{Q}$의 넓이 $\mathrm{S_Q}$의 비율 $\dfrac{\mathrm{S_P}}{\mathrm{S_Q}}$를 구하고, 그 이유를 논하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '27/37', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 전체 넓이 $\tfrac43$에서 $\mathrm{S_P}=\int_{-1}^{1/2}\left(1-x^2-\tfrac x2-\tfrac12\right)dx=\tfrac{9}{16}$을 뺀다.
    steps:
    - {id: 1a, content: '$\mathrm{S_P}=\tfrac{9}{16}$, $\mathrm{S_Q}=\tfrac43-\tfrac{9}{16}=\tfrac{37}{48}$, 비 $\tfrac{27}{37}$', criteria: ['1.M1', '1.A1', '1.A2']}
    hint_ladder:
    - 직선 $\mathrm{L}$과 포물선의 교점의 $x$좌표를 구하자.
  - id: S1-B
    audience: B
    source_flow: 2025 보고서 문항카드 14 예시답안 p.202(인쇄 쪽 198)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\mathrm{S_P}+\mathrm{S_Q}=\displaystyle\int_{-1}^{1}(1-x^2)dx=2\left[x-\dfrac{x^3}{3}\right]_0^1=2\left(1-\dfrac13\right)=\dfrac43$.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\mathrm{S_P}=\displaystyle\int_{-1}^{1/2}\left\{(1-x^2)-\left(\dfrac x2+\dfrac12\right)\right\}dx=\int_{-1}^{1/2}\left(-x^2-\dfrac12x+\dfrac12\right)dx=\dfrac{9}{16}$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        $\mathrm{S_Q}=\dfrac{37}{48}$이므로 $\dfrac{\mathrm{S_P}}{\mathrm{S_Q}}=\dfrac{27}{37}$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        전체 넓이 $\int_{-1}^{1}(1-x^2)dx$와 $\mathrm{S_P}$를 구하는 적분식(교점 $x=-1,\tfrac12$)을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $\mathrm{S_P}+\mathrm{S_Q}=\tfrac43$, $\mathrm{S_P}=\tfrac{9}{16}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: |
        $\mathrm{S_Q}=\tfrac{37}{48}$과 비 $\tfrac{27}{37}$을 얻었다.
      depends_on: [1.A1]
      implied_ok: true
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    [문제 2-ⅱ] 아래 그림과 같이 <제시문>에서 주어진 도형 $\mathrm{Q}$에 내접하는 직사각형 $\mathrm{ABCD}$가 다음 두 조건을 모두 만족한다.
    (1) 점 $\mathrm{B}$와 점 $\mathrm{C}$는 $x$축 위에 있다.
    (2) 점 $\mathrm{A}$는 직선 $\mathrm{L}:y=\dfrac x2+\dfrac12$ 위에 있고, 점 $\mathrm{D}$는 곡선 $y=1-x^2$ 위에 있다.
    이 조건들을 만족하면서 직사각형 $\mathrm{ABCD}$의 넓이가 최대가 될 때의 점 $\mathrm{C}$의 좌표를 $(q,0)$이라 하고, $w=q-\dfrac12$로 정의하자. 이때 $8w^3+15w^2+3w$의 값을 구하고 그 이유를 논하시오.

    [그림: 포물선과 직선 $\mathrm{L}$ 사이의 도형 $\mathrm{Q}$ 안에 직사각형 $\mathrm{ABCD}$가 있다. $\mathrm{B}$는 원점 $\mathrm{O}$ 바로 왼쪽, $\mathrm{C}$는 오른쪽의 $x$축 위 점이고, $\mathrm{A}$는 $\mathrm{B}$ 바로 위 직선 $\mathrm{L}$ 위의 점, $\mathrm{D}$는 $\mathrm{C}$ 바로 위 포물선 위의 점이다.]
  points: 12
  depends_on: []
  answer: {kind: value, value: '9/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{B}(1-2q^2,0)$이므로 넓이 $f(q)=(1-q^2)(2q^2+q-1)$, $f'(q)=-8q^3-3q^2+6q+1=0$에 $q=\tfrac12+w$를 대입.
    steps:
    - {id: 2a, content: '$-8w^3-15w^2-3w+\tfrac94=0\Rightarrow8w^3+15w^2+3w=\tfrac94$', criteria: ['2.M1', '2.A1', '2.M2', '2.A2', '2.R1']}
    hint_ladder:
    - $\mathrm{A}$와 $\mathrm{D}$의 $y$좌표가 같다는 것으로 $\mathrm{B}$의 $x$좌표를 $q$로 나타내자.
    - 최댓값을 주는 $q$를 직접 구할 필요는 없다. $f'(q)=0$을 $w$로 옮겨 보자.
  - id: S2-B
    audience: B
    source_flow: 2025 보고서 문항카드 14 예시답안 p.202-203(인쇄 쪽 198-199)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\mathrm{C}(q,0)$, $\mathrm{B}(p,0)$이라 하면 $\dfrac{p+1}{2}=1-q^2$, $p=1-2q^2$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $\overline{\mathrm{BC}}=q-p=q+2q^2-1$, $\overline{\mathrm{DC}}=1-q^2$이므로 $f(q)=(1-q^2)(2q^2+q-1)$.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $f'(q)=-8q^3-3q^2+6q+1=0$이 된다. $q=\dfrac12+w$라고 하면 $8w^3+15w^2+3w=\dfrac94$.
      criteria: ['2.M2', '2.A2']
    - id: 2b-4
      content: |
        (부연 설명) $f(q)=(1-q^2)(2q^2+q-1)$에 대해 $f\left(\dfrac12\right)=0$, $f(1)=0$이고 $f'\left(\dfrac12\right)=-1-\dfrac34+3+1=\dfrac94>0$, $f'(1)=-11+7=-4<0$이다. $H(q)=f'(q)=-8q^3-3q^2+6q+1$로 두고 이를 미분하면 $H'(q)=-24q^2-6q+6$이고 열린구간 $\left(\dfrac12,1\right)$에서 $H'(q)<0$이다. $H\left(\dfrac12\right)=f'\left(\dfrac12\right)>0$, $H(1)=f'(1)<0$이므로 열린구간 $\left(\dfrac12,1\right)$에서 $H(q)=0$인 $q$가 유일하게 존재한다. 즉 $f'(q)=0$이고 이때의 $q$의 좌우에서 $f'(x)$값의 부호가 양에서 음으로 변하므로 $q$에서 $f(q)$가 최댓값이 된다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $\mathrm{A}$, $\mathrm{D}$의 $y$좌표가 같음을 이용해 $\mathrm{B}(1-2q^2,0)$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        넓이 $f(q)=(1-q^2)(2q^2+q-1)$을 세웠다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $f'(q)=-8q^3-3q^2+6q+1=0$을 세웠다.
      depends_on: [2.A1]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: |
        $q=\tfrac12+w$를 대입해 $8w^3+15w^2+3w=\tfrac94$를 얻었다.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        $\left(\tfrac12,1\right)$에서 $f'=0$인 점이 유일하고 그 좌우에서 부호가 양→음으로 바뀌어 최대임을 밝혔다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    [문제 2-ⅲ] 아래 그림과 같이 <제시문>에서 주어진 도형 $\mathrm{Q}$를 직선 $\mathrm{M}:y=\dfrac x4+\dfrac14$로 나누어 윗 부분의 도형을 $\mathrm{R}$이라 하자. 이때 도형 $\mathrm{R}$에 내접하는 직사각형 $\mathrm{ABCD}$는 다음 두 조건을 모두 만족한다.
    (1) 점 $\mathrm{B}$와 점 $\mathrm{C}$는 직선 $\mathrm{M}:y=\dfrac x4+\dfrac14$ 위에 있고, $\overline{\mathrm{BC}}=\dfrac{\sqrt{17}}{4}$이다.
    (2) 점 $\mathrm{A}$는 직선 $\mathrm{L}:y=\dfrac x2+\dfrac12$ 위에 있고, 점 $\mathrm{D}$는 곡선 $y=1-x^2$ 위에 있다.
    이때 점 $\mathrm{B}$의 좌표를 구하고 그 이유를 논하시오.

    [그림: 왼쪽 그림은 포물선, 직선 $\mathrm{L}$, 직선 $\mathrm{M}$이 점 $(-1,0)$에서 만나고, $\mathrm{L}$ 아래·$\mathrm{M}$ 위·포물선 아래의 회색 부분이 $\mathrm{R}$, $\mathrm{L}$ 위쪽이 $\mathrm{P}$로 표시되어 있다. 화살표 오른쪽 그림은 $\mathrm{R}$ 안에 직선 $\mathrm{M}$에 평행한 긴 변을 가진 기울어진 직사각형 $\mathrm{ABCD}$가 있고, $\mathrm{A}$는 $\mathrm{L}$ 위(왼쪽 위), $\mathrm{B}$는 $\mathrm{M}$ 위(왼쪽 아래, $y$축 왼쪽), $\mathrm{C}$는 $\mathrm{M}$ 위(오른쪽 아래), $\mathrm{D}$는 포물선 위(오른쪽 위)이다.]
