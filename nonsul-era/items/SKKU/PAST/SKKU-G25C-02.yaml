intent: |
  곡선과 직선 등으로 정의된 도형의 넓이를 계산하고 그 결과를 분석하는 능력을 본다. 곡선과 직선으로 둘러싸인 도형들의 넓이를 계산하고, 이와 관련해 주어진 조건을 만족하는 (내접) 직사각형을 분석하는 능력을 평가한다(2025 보고서 문항카드 14 출제 의도 요약).
key_idea: |
  (ii) 점 $\mathrm{C}(q,0)$으로 직사각형을 매개화하면 넓이는 $(1-q^2)(2q^2+q-1)$이고 극대 조건 $-8q^3-3q^2+6q+1=0$을 $q=\tfrac12+w$로 바꾸면 구하는 식이 바로 나온다. (iii) $\mathrm{AD}\parallel\mathrm{M}$이고 $\overline{\mathrm{AD}}=\tfrac{\sqrt{17}}{4}$이므로 $x$좌표 차가 $1$, $\mathrm{BA}$의 기울기는 $-4$.
stuck: |
  (ii)에서 넓이 최대점을 직접 구하지 않고 $f'(q)=0$을 $w$에 대한 식으로 옮기는 것, (iii)에서 기울기 $\tfrac14$, 길이 $\tfrac{\sqrt{17}}{4}$인 선분의 $x$좌표 차가 $1$임을 이용하는 것
