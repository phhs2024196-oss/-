intent: |
  주어진 실수에 가장 가까운 정수를 이용해 올바른 부등식을 설정하고, 그 부등식을 정수의 성질로 더 활용도가 높은 형태로 변형할 수 있는지 평가한다. 조건을 만족하는 수열의 규칙을 찾아 합을 구하고, 이를 일반화해 일반화 전의 수열과 공통적인 규칙으로 복잡해 보이는 상황을 단순화할 수 있는지 본다(2025 보고서 문항카드 15 출제 의도 요약).
key_idea: |
  $b_n=M\iff M-\tfrac12\le A_n<M+\tfrac12\iff 4M^3-6M^2+3M-\left(\tfrac12+(-1)^n4a_n\right)\le n<4M^3+6M^2+3M+\left(\tfrac12-(-1)^n4a_n\right)$이고, $n\ge5$에서는 $\lvert4a_n\rvert<\tfrac12$이므로 정수 조건 $4M^3-6M^2+3M\le n\le4M^3+6M^2+3M$로 단순화된다.
stuck: |
  세제곱근에 가장 가까운 정수 조건을 세제곱해 $n$에 대한 정수 부등식으로 바꾸고, 작은 오차항 $(-1)^n4a_n$을 정수성으로 없애는 것; $n\le4$는 따로 직접 계산해야 한다는 것
idea_tags: [IDEA-NEAREST-INTEGER-CUBE-BOUNDS, IDEA-INTEGER-ABSORB-SMALL-ERROR, IDEA-SMALL-CASES-SEPARATE]
tags: [가장 가까운 정수, 세제곱근, 등비수열, 수열의 합, 경우 분류]
