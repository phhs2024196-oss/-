intent: |
  주어진 함수의 정보(접선으로 이어 붙인 연속함수)를 이해하고 이를 이용하여 정적분을 계산하고 기하학적 정보를 도출할 수 있는지 평가한다. 조건에 맞게 곡선·직선의 방정식을 유도하여 점들의 위치를 수식화하고, 이차함수 그래프의 기하학적 의미와 정적분의 넓이로서의 해석을 이용해 정확히 계산할 수 있는지 본다(보고서 출제 의도 요약).
key_idea: |
  $g$는 $[-1,1]$에서 $f$, 바깥에서는 $x=\pm1$에서의 접선이다. (ⅱ)는 $f'(\pm1)$ 조건으로 $f$의 계수를 정하고 남은 상수항 $c$가 가장 작을 때 넓이가 최소, (ⅲ)은 $g(-2)=5c$가 2를 넘는지로 $c$의 범위를 나눈다.
stuck: |
  (ⅱ)에서 넓이가 상수항 $c$에 대해 증가함을 보고 $c$의 최솟값을 조건 (1)에서 찾는 것, (ⅲ)에서 $G$가 잘리는 구간 $c>\tfrac25$를 나누는 것
