stimuli:
- id: S1
  label: <제시문1>
  body: |
    수열 $\{b_n\}$은 첫째항이 $1$, 공차가 $a>0$인 등차수열이고, 등차수열 $\{b_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하자.
    자연수 $n$에 대하여 한 변의 길이가 $b_n$인 정삼각형 $T_n$이 좌표평면에 아래 그림과 같이 나란히 놓여져 있다. 삼각형 $T_1$의 한 꼭짓점은 제1사분면에 놓여져 있고, 다른 두 꼭짓점의 좌표는 $(0,0)$과 $(S_1,0)$이다. $n\ge2$일 때 삼각형 $T_n$의 한 꼭짓점은 제1사분면에 놓여져 있고, 다른 두 꼭짓점의 좌표는 $(S_{n-1},0)$과 $(S_n,0)$이다.

    구간 $[0,\infty)$을 정의역으로 하는 함수 $f(x)$를 아래와 같이 정의한다.

    (1) $0\le x<S_1$일 때 $f(x)=\dfrac{\sqrt3}{2}-\sqrt3\left|x-\dfrac12\right|$이다.

    (2) $n$이 2 이상의 자연수이고 $S_{n-1}\le x<S_n$일 때 $f(x)=\dfrac{\sqrt3}{2}(S_n-S_{n-1})-\sqrt3\left|x-\dfrac{S_n+S_{n-1}}{2}\right|$이다.

    이 경우 함수 $y=f(x)$의 그래프가 정삼각형 $T_n$의 윗 두 변들을 합친 도형과 일치한다. 여기서 윗 두 변은 변의 한 끝이 제1사분면 위에 있는 두 변을 의미한다.

    [그림: $x$축 위에 정삼각형 $T_1,T_2,T_3,\dots,T_n,\dots$이 왼쪽부터 크기가 커지며 빈틈없이 나란히 놓여 있고, 밑변의 끝점이 $0,S_1,S_2,S_3,\dots,S_{n-1},S_n$으로 표시됨. 점 $-1$을 지나는 직선 $l$이 삼각형들의 위를 지나며 일부 삼각형과 만남. (문제지에는 그림 없음, 보고서 문항카드 p.167의 그림)]
- id: S2
  label: <제시문2>
  body: |
    직선 $l$은 점 $(-1,0)$을 지나며 기울기가 $m$이다.

stem: |
  다음 <제시문1>과 <제시문2>를 읽고 [문제2-ⅰ] ~ [문제2-ⅲ]을 문항별로 풀이와 함께 답하시오. (40점)

subparts:
- id: 'i'
  stem: |
    <제시문1>에서 $a=2$일 때 정적분 $\displaystyle\int_0^{134}f(x)\,dx$의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '525*sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: Si-A
    audience: A
    method_no: 1
    key_idea: $S_n=n^2$이므로 $[0,134]$는 $T_1\sim T_{11}$ 전체와 $T_{12}$의 일부를 덮는다. $T_1\sim T_{12}$ 넓이 합에서 $[134,144]$ 부분 삼각형을 뺀다.
    steps:
    - {id: ia, content: '$\tfrac{\sqrt3}{4}\sum_{k=1}^{12}(2k-1)^2-\tfrac12\cdot10\cdot10\sqrt3=575\sqrt3-50\sqrt3=525\sqrt3$', criteria: ['i.M1', 'i.A1', 'i.M2', 'i.A2']}
    hint_ladder:
    - $a=2$일 때 $S_n$을 구해 $134$가 어느 삼각형 위에 있는지 보자.
    - 정적분은 그래프와 $x$축 사이 넓이이다.
  - id: Si-B
    audience: B
    source_flow: 2026 보고서 문항카드 8 예시답안 p.169-170(인쇄 165-166)
    method_no: 1
    steps:
    - id: ib-1
      content: |
        $a=2$이면 $b_k=2k-1$이고, $S_n=b_1+\cdots+b_n=\displaystyle\sum_{k=1}^{n}(2k-1)=n(n+1)-n=n^2$이다.
      criteria: ['i.M1']
    - id: ib-2
      content: |
        $S_{11}=121<134$이고 $S_{12}=144>134$이다. 따라서 $T_1,T_2,\dots,T_{11}$의 전체 넓이와 $T_{12}$의 일부 영역의 넓이의 합이 적분값이 된다. $T_{12}$의 일부 영역은 $T_{12}$ 전체 넓이에서 $x$의 구간 $[134,S_{12}]=[134,144]$에 해당되는 영역을 제외하면 된다. 제외하여야 하는 영역은 밑변의 길이가 $10$이고 높이가 $10\sqrt3$인 삼각형이므로 넓이는 $\dfrac12\times10\times10\sqrt3=50\sqrt3$이다.
      criteria: ['i.M2']
    - id: ib-3
      content: |
        한편 $T_1,\dots,T_{12}$의 넓이의 합은 $\dfrac{\sqrt3}{4}\displaystyle\sum_{k=1}^{12}b_k^2=\dfrac{\sqrt3}{4}\sum_{k=1}^{12}(4k^2-4k+1)$이고
        $\displaystyle\sum_{k=1}^{12}(4k^2-4k+1)=4\cdot\dfrac{12\cdot13\cdot25}{6}-4\cdot\dfrac{12\cdot13}{2}+12=2300$
        이므로 $575\sqrt3$이다.
      criteria: ['i.A1']
    - id: ib-4
      content: |
        따라서 구하고자 하는 영역의 넓이는 $575\sqrt3-50\sqrt3=525\sqrt3$이다.
      criteria: ['i.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: i.M1
      mark_type: M
      points: 2
      evidence: |
        $b_k=2k-1$, $S_n=n^2$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [ib-1]
    - id: i.M2
      mark_type: M
      points: 3
      evidence: |
        $134$가 $T_{12}$ 위에 있음을 보이고 제외할 영역(밑변 10, 높이 $10\sqrt3$인 삼각형) 넓이 $50\sqrt3$을 구했다.
      depends_on: [i.M1]
      implied_ok: false
      steps: [ib-2]
    - id: i.A1
      mark_type: A
      points: 3
      evidence: |
        $T_1\sim T_{12}$의 넓이 합 $575\sqrt3$을 $\sum$ 공식으로 구했다.
      depends_on: [i.M1]
      steps: [ib-3]
    - id: i.A2
      mark_type: A
      points: 2
      evidence: |
        $525\sqrt3$을 얻었다.
      depends_on: [i.M2, i.A1]
      steps: [ib-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'ii'
  stem: |
    <제시문1>과 <제시문2>에서 $a=1$, $m=\dfrac{\sqrt3}{10}$일 때, 함수 $y=f(x)$의 그래프와 직선 $l$이 만나는 점의 개수를 구하고 그 이유를 논하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '18', equivalents: [], tolerance: null}
  solutions:
  - id: Sii-A
    audience: A
    method_no: 1
    key_idea: $(-1,0)$에서 $T_n$의 위 꼭짓점까지 기울기 $\tfrac{\sqrt3n}{n^2+2}$가 $\tfrac{\sqrt3}{10}$보다 큰 $n$은 $1,\dots,9$이다.
    steps:
    - {id: iia, content: '$\tfrac{\sqrt3n}{n^2+2}>\tfrac{\sqrt3}{10}\iff n^2-10n+2<0\iff n=1,\dots,9$, 등호인 $n$ 없음 → $2\times9=18$', criteria: ['ii.M1', 'ii.A1', 'ii.R1', 'ii.A2']}
    hint_ladder:
    - 직선과 삼각형이 두 점에서 만나는 조건을 위 꼭짓점의 위치로 표현해 보자.
    - 기울기 비교 부등식은 $n$에 대한 어떤 부등식이 되는가?
  - id: Sii-B
    audience: B
    source_flow: 2026 보고서 문항카드 8 예시답안 p.170(인쇄 166)
    method_no: 1
    steps:
    - id: iib-1
      content: |
        $a=1$이면 $b_n=n$이다. 따라서 $S_n=\displaystyle\sum_{k=1}^{n}k=\dfrac{n(n+1)}{2}$이고 삼각형 $T_n$의 중점의 $x$좌표는
        $\dfrac12(S_{n-1}+S_n)=\dfrac12\left(\dfrac{n(n-1)}{2}+\dfrac{n(n+1)}{2}\right)=\dfrac{n^2}{2}$이다.
      criteria: ['ii.M1']
    - id: iib-2
      content: |
        점 $(-1,0)$의 $x$좌표부터 $T_n$의 중점의 $x$좌표까지의 거리는 $\dfrac{n^2}{2}+1$이다. 그리고 삼각형 $T_n$의 높이는 $\dfrac{\sqrt3}{2}b_n=\dfrac{\sqrt3}{2}n$이다. 따라서 $(-1,0)$에서 $T_n$의 제1사분면 위의 꼭짓점까지 잇는 직선의 기울기는 $\dfrac{\frac{\sqrt3}{2}n}{\frac{n^2}{2}+1}=\dfrac{\sqrt3n}{n^2+2}$이다.
      criteria: ['ii.A1']
    - id: iib-3
      content: |
        이 기울기가 직선 $l$의 기울기 $\dfrac{\sqrt3}{10}$보다 크면 $l$과 $T_n$은 두 점에서 만나고, $\dfrac{\sqrt3}{10}$과 같으면 한 점에서 만나고, $\dfrac{\sqrt3}{10}$보다 작으면 만나지 않는다.
      criteria: ['ii.R1']
    - id: iib-4
      content: |
        $\dfrac{\sqrt3n}{n^2+2}>\dfrac{\sqrt3}{10}$이 되는 $n$의 범위는 $10n>n^2+2$, 즉 $n^2-10n+2<0$인 범위이므로 $5-\sqrt{23}<n<5+\sqrt{23}$이 되고, 가능한 자연수는 $n=1,2,\dots,8,9$가 된다. 한편 $\dfrac{\sqrt3n}{n^2+2}=\dfrac{\sqrt3}{10}$인 자연수는 없다. 따라서 $T_1,\dots,T_9$가 직선 $l$과 각각 두 점에서 만나므로 만나는 점의 개수는 $18$개이다.
      criteria: ['ii.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: ii.M1
      mark_type: M
      points: 3
      evidence: |
        $S_n=\dfrac{n(n+1)}{2}$와 $T_n$의 위 꼭짓점 좌표 $\left(\dfrac{n^2}{2},\dfrac{\sqrt3}{2}n\right)$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [iib-1]
    - id: ii.A1
      mark_type: A
      points: 3
      evidence: |
        $(-1,0)$에서 위 꼭짓점까지 기울기 $\dfrac{\sqrt3n}{n^2+2}$를 구했다.
      depends_on: [ii.M1]
      steps: [iib-2]
    - id: ii.R1
      mark_type: R
      points: 4
      evidence: |
        이 기울기와 $m$의 대소에 따라 교점이 2개·1개·0개임을 밝혔다.
      depends_on: []
      steps: [iib-3]
    - id: ii.A2
      mark_type: A
      points: 5
      evidence: |
        $n^2-10n+2<0$을 풀어 $n=1,\dots,9$, 등호인 $n$이 없음을 보이고 18개를 얻었다.
      depends_on: [ii.A1, ii.R1]
      steps: [iib-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'iii'
  stem: |
    <제시문1>과 <제시문2>에서 $m=\dfrac{\sqrt3}{30}$일 때, 함수 $y=f(x)$의 그래프와 직선 $l$이 만나는 점의 개수가 30이 되는 $a$의 값의 범위를 구하고 그 이유를 논하시오.
  points: 15
  depends_on: []
  answer: {kind: set, value: 'Interval.open(1/224, 1/75)', equivalents: ['1/224 < a < 1/75'], tolerance: null}
  solutions:
  - id: Siii-A
    audience: A
    method_no: 1
    key_idea: 위 꼭짓점 기울기 조건이 $n-1=M$에 대한 이차부등식 $aM^2+2M(1-15a)-27<0$이 되고, 그 해가 $M=0,\dots,14$일 조건을 찾는다.
    steps:
    - {id: iiia, content: '$T_{15}$와 두 점, $T_{16}$과 0점: $\tfrac{\sqrt3}{2}(14a+1)\big/\left(\tfrac12(29+14^2a)+1\right)>\tfrac{\sqrt3}{30}$, $n=16$에서 $<$ → $\tfrac1{224}<a<\tfrac1{75}$', criteria: ['iii.M1', 'iii.A1', 'iii.R1', 'iii.A2']}
    hint_ladder:
    - (ⅱ)와 같은 방법으로 $T_n$의 위 꼭짓점까지의 기울기를 $a$, $n$으로 나타내 보자.
    - 교점이 30개이려면 어떤 삼각형까지 두 점에서 만나야 하는가?
  - id: Siii-B
    audience: B
    source_flow: 2026 보고서 문항카드 8 예시답안 풀이1 p.170-171(인쇄 166-167)
    method_no: 1
    steps:
    - id: iiib-1
      content: |
        $S_n=b_1+\cdots+b_n=\displaystyle\sum_{k=1}^{n}(1-a+ka)=n+a\dfrac{n(n-1)}{2}$이다. 따라서 삼각형 $T_n$의 중점의 좌표는
        $\dfrac12(S_n+S_{n-1})=\dfrac12\left[n+\dfrac{an(n-1)}{2}+(n-1)+\dfrac{a(n-1)(n-2)}{2}\right]=\dfrac12\left[2n-1+a(n-1)^2\right]$
        로 주어지게 된다.
      criteria: ['iii.M1']
    - id: iiib-2
      content: |
        한편 $T_n$의 높이는 $\dfrac{\sqrt3}{2}(1-a+na)$이다. 삼각형 $T_n$의 제1사분면 위의 꼭짓점과 $(-1,0)$을 잇는 직선의 기울기는
        $$\dfrac{\frac{\sqrt3}{2}(1-a+na)}{\frac12\left[2n-1+a(n-1)^2\right]+1}$$
        이고, 이 기울기가 직선 $l$의 기울기 $\dfrac{\sqrt3}{30}$보다 크면 $T_n$과 직선 $l$은 두 점에서 만나고, 같으면 한 점에서 만나며, 작으면 만나지 않는다.
      criteria: ['iii.A1']
    - id: iiib-3
      content: |
        $y=f(x)$의 그래프와 직선 $l$이 만나는 점의 개수가 30이려면 $T_{15}$와 2개의 점에서 만나고, $T_{16}$과 만나지 않는다(이 부등식을 만족하는 $n$이 $1,2,\dots$로 연속함은 풀이2의 이차함수 개형으로 확인된다).
      criteria: ['iii.R1']
    - id: iiib-4
      content: |
        따라서 $n=15$일 때 $\dfrac{\frac{\sqrt3}{2}(14a+1)}{\frac12(29+14^2a)+1}>\dfrac{\sqrt3}{30}$을 만족하고 따라서 $a>\dfrac1{224}$.
        $n=16$일 때 $\dfrac{\frac{\sqrt3}{2}(15a+1)}{\frac12(29+15^2a)+1}<\dfrac{\sqrt3}{30}$이 성립하고, 따라서 $a<\dfrac1{75}$. 따라서 $a$의 범위는 $\dfrac1{224}<a<\dfrac1{75}$이다.
      criteria: ['iii.A2']
  - id: Siii-ALT
    audience: ALT
    source_flow: 2026 보고서 문항카드 8 예시답안 풀이2(별해) p.171(인쇄 167)
    method_no: 2
    key_idea: $M=n-1$로 두면 조건은 $g(M)=aM^2+2M(1-15a)-27<0$이고, $g(0)=-27<0$, $a>0$이므로 $g(M)<0$인 자연수는 $1,\dots,W$로 연속한다.
    steps:
    - id: iiic-1
      content: |
        풀이1의 조건 $\dfrac{\frac{\sqrt3}{2}(1-a+na)}{\frac12[2n-1+a(n-1)^2]+1}>\dfrac{\sqrt3}{30}$에서 $M=n-1$로 두면 $\dfrac{1+Ma}{aM^2+2M+3}>\dfrac1{30}$, 즉 $aM^2+2M(1-15a)-27<0$이다.
      criteria: ['iii.M1', 'iii.A1']
    - id: iiic-2
      content: |
        $g(M)=aM^2+2M(1-15a)-27$이라 하면 $g(0)=-27<0$이고 $a>0$이므로 그래프 개형을 통해 자연수 $u$에 대해 $g(u)<0$이면 $g(u-1)<0$이다. 따라서 $g(W)<0$, $g(W+1)>0$인 자연수 $W$가 있으면 위 식을 만족하는 $n$은 $1,2,\dots,W+1$이 되고 교점은 $2(W+1)$개, $g(W+1)=0$이면 $2(W+1)+1$개이다.
      criteria: ['iii.R1']
    - id: iiic-3
      content: |
        $2(W+1)=30$인 $W=14$에 대해 $g(14)<0$, $g(15)>0$을 동시에 만족하는 조건을 찾는다. $g(14)=196a-420a+1<0$에서 $224a>1$, $g(15)=225a+30(1-15a)-27>0$에서 $225a<3$, 즉 $75a<1$. 따라서 $a$의 범위는 열린구간 $\left(\dfrac1{224},\dfrac1{75}\right)$이다.
      criteria: ['iii.A2']
