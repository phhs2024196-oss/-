intent: |
  좌표평면을 이용하여 기하학적 정보를 파악하고 삼각함수(코사인법칙)로 필요한 정보를 이끌어 내는지, 기하학적 정보를 수식화하여 이차함수의 그래프 개형으로 조건을 만족하는 경우의 수를 구하는지, 밑변과 높이가 같으면 넓이가 같다는 성질로 삼각형 넓이가 최대가 되는 조건을 파악하고 이차방정식·이차부등식으로 그 경우의 수를 구하는지 평가한다(보고서 출제 의도 요약).
key_idea: |
  두 정육각형은 닮음(중심 O)이므로 $\mathrm{OQ}$와 작은 정육각형의 교점 $\mathrm{Q}'$의 이동 거리는 $s_{\mathrm Q}/k$이고, 사잇각 $\tfrac{\pi}{3}$은 $s_{\mathrm P}-s_{\mathrm{Q}'}\equiv1,5\pmod 6$과 같다. 넓이 최대는 밑변 $\mathrm{OQ}$에 대한 높이가 최대인 $\mathrm P$의 위치로 판정한다.
stuck: |
  (ⅱ)에서 사잇각 조건을 둘레 위 이동 거리의 차로 바꾸는 발상, (ⅲ)에서 넓이 최대가 되는 $\mathrm{P}$의 위치(변 또는 꼭짓점)를 $\mathrm Q$의 위치에 따라 나누는 것
idea_tags: [IDEA-SIMILAR-HEXAGON-PROJECTION, IDEA-ARC-LENGTH-MOD-PERIOD, IDEA-TRIANGLE-AREA-MAX-HEIGHT]
tags: [정육각형 위의 운동, 코사인법칙, 경우의 수]
