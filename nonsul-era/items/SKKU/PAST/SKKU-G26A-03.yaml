stimuli:
- id: S1
  label: <제시문1>
  body: |
    삼각형 $\mathrm{ABC}$의 세 각 $\angle\mathrm A$, $\angle\mathrm B$, $\angle\mathrm C$의 크기를 각각 $A,B,C$로 나타내고, 이들의 대변의 길이를 각각 $a,b,c$로 나타내기로 한다. 삼각형의 세 변의 길이와 세 각의 크기 사이에는 다음과 같은 관계가 성립하는데 이를 코사인법칙이라고 한다.
    $$a^2=b^2+c^2-2bc\cos A$$
    $$b^2=c^2+a^2-2ca\cos B$$
    $$c^2=a^2+b^2-2ab\cos C$$
- id: S2
  label: <제시문2>
  body: |
    아래 그림과 같이 한 변의 길이가 $1$이고 점 $\mathrm A(1,0)$을 한 꼭짓점으로 하는 정육각형 $\mathrm{ABCDEF}$가 있다. 그리고 $2$ 이상의 자연수 $k$에 대하여 한 변의 길이가 $k$이고 점 $\mathrm A'(k,0)$을 한 꼭짓점으로 하는 정육각형 $\mathrm{A'B'C'D'E'F'}$가 있다. 두 꼭짓점 $\mathrm A$와 $\mathrm D$는 원점 $\mathrm O$에 대하여 대칭이고, 두 꼭짓점 $\mathrm A'$와 $\mathrm D'$도 원점 $\mathrm O$에 대하여 대칭이다. 점 $\mathrm P$는 꼭짓점 $\mathrm A$를 출발하여 시계 반대 방향으로 정육각형 $\mathrm{ABCDEF}$의 변을 따라 움직이며, 출발 후 $t$분 동안 이동한 거리는 $s_{\mathrm P}(t)=t^2+2t$이다. 점 $\mathrm Q$는 꼭짓점 $\mathrm A'$를 출발하여 시계 반대 방향으로 정육각형 $\mathrm{A'B'C'D'E'F'}$의 변을 따라 움직이며, 출발 후 $t$분 동안 이동한 거리는 $s_{\mathrm Q}(t)=2t^2+t$이다.

    [그림: 원점 O를 중심으로 하는 두 정육각형. 작은 정육각형은 꼭짓점 A(1,0), B, C, D, E, F가 시계 반대 방향 순서이고 A와 D가 $x$축 위에 있으며 변 BC, EF가 $x$축에 평행. 큰 정육각형은 꼭짓점 A'(k,0), B', C', D', E', F'가 같은 방향으로 놓이며 A', D'가 $x$축 위. 점 P는 변 AB 위, 점 Q는 변 A'B' 위에 표시되고 각각 B, B' 쪽(위쪽)으로 향하는 화살표가 있음.]

stem: |
  다음 <제시문1>과 <제시문2>을 읽고 [문제3-ⅰ] ~ [문제3-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: 'i'
  stem: |
    <제시문2>의 두 점 $\mathrm{P},\mathrm{Q}$가 동시에 각각 두 꼭짓점 $\mathrm{A},\mathrm{A}'$를 출발한 후 8분이 지났을 때 두 선분 $\mathrm{OP}$와 $\mathrm{OQ}$의 사잇각을 $\theta\,(0\le\theta\le\pi)$라 하자. $k=6$인 경우 $\sin\theta$의 값을 구하고 그 이유를 논하시오.
  points: 5
  depends_on: []
  answer: {kind: value, value: 'sqrt(21)/14', equivalents: ['sqrt(3)/(2*sqrt(7))'], tolerance: null}
  solutions:
  - id: Si-A
    audience: A
    method_no: 1
    key_idea: $s_{\mathrm P}(8)=80$, $s_{\mathrm Q}(8)=136$으로 $\mathrm P$, $\mathrm Q$의 좌표를 구한 뒤 코사인법칙.
    steps:
    - {id: ia, content: '$\mathrm P\left(-\tfrac12,\tfrac{\sqrt3}2\right)$, $\mathrm Q(1,-3\sqrt3)$, $39=1+28-4\sqrt7\cos\theta$, $\sin\theta=\tfrac{\sqrt{21}}{14}$', criteria: ['i.M1', 'i.A1']}
    hint_ladder:
    - 둘레가 6, 36이므로 이동 거리를 둘레로 나눈 나머지를 보자.
  - id: Si-B
    audience: B
    source_flow: 2026 보고서 문항카드 9 예시답안 p.175(인쇄 171)
    method_no: 1
    steps:
    - id: ib-1
      content: |
        두 점 $\mathrm P$, $\mathrm Q$가 8분 동안 이동한 거리는 각각 $s_{\mathrm P}(8)=80$, $s_{\mathrm Q}(8)=136$이므로, 8분 뒤 두 점 $\mathrm P$, $\mathrm Q$의 좌표는 각각 $\mathrm P\left(-\dfrac12,\dfrac{\sqrt3}{2}\right)$, $\mathrm Q(1,-3\sqrt3)$이다.
      criteria: ['i.M1']
    - id: ib-2
      content: |
        $\overline{\mathrm{OP}}=1$, $\overline{\mathrm{OQ}}=2\sqrt7$, $\overline{\mathrm{PQ}}=\sqrt{39}$, $\angle\mathrm{POQ}=\theta$이므로 삼각형 $\mathrm{OPQ}$에 코사인법칙을 적용하면 $39=1+28-4\sqrt7\cos\theta$가 되어 $\cos\theta=-\dfrac{5}{2\sqrt7}$이 된다. 따라서 $\sin\theta=\dfrac{\sqrt3}{2\sqrt7}=\dfrac{\sqrt{21}}{14}$이다.
      criteria: ['i.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: i.M1
      mark_type: M
      points: 2
      evidence: |
        8분 뒤 $\mathrm P\left(-\dfrac12,\dfrac{\sqrt3}{2}\right)$, $\mathrm Q(1,-3\sqrt3)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [ib-1]
    - id: i.A1
      mark_type: A
      points: 3
      evidence: |
        코사인법칙으로 $\cos\theta=-\dfrac{5}{2\sqrt7}$, $\sin\theta=\dfrac{\sqrt{21}}{14}$를 얻었다.
      depends_on: [i.M1]
      steps: [ib-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'ii'
  stem: |
    자연수 $k$에 대하여 <제시문2>의 두 점 $\mathrm{P},\mathrm{Q}$가 동시에 각각 두 꼭짓점 $\mathrm{A},\mathrm{A}'$를 출발하였을 때, 출발한 후 10분 동안 두 선분 $\mathrm{OP}$와 $\mathrm{OQ}$의 사잇각이 $\dfrac{\pi}{3}$가 되는 횟수를 $a_k$라 하자. 이때
    $$\sum_{j=3}^{10}a_{5^j}=a_{125}+a_{625}+\cdots+a_{5^{10}}$$
    의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '319', equivalents: [], tolerance: null}
  solutions:
  - id: Sii-A
    audience: A
    method_no: 1
    key_idea: $d(t)=s_{\mathrm P}-s_{\mathrm Q}/k$가 증가하므로 $[0,d(10)]$ 안의 $6m+1$, $6m+5$ 꼴 자연수를 센다.
    steps:
    - {id: iia, content: '$d(10)=120-\tfrac{210}{k}$; $k>210$이면 $a_k=40$, $k=125$이면 $a_k=39$ → $39+7\cdot40=319$', criteria: ['ii.M1', 'ii.A1', 'ii.M2', 'ii.A2']}
    hint_ladder:
    - $\mathrm{OQ}$가 작은 정육각형과 만나는 점은 어떻게 움직이는가?
    - 사잇각이 $\tfrac\pi3$이면 두 점의 둘레 위 위치 차는 얼마인가?
  - id: Sii-B
    audience: B
    source_flow: 2026 보고서 문항카드 9 예시답안 p.175(인쇄 171)
    method_no: 1
    steps:
    - id: iib-1
      content: |
        선분 $\mathrm{OQ}$와 정육각형 $\mathrm{ABCDEF}$가 만나는 점을 $\mathrm Q'$라고 하면 점 $\mathrm Q'$는 꼭짓점 $\mathrm A$를 출발하여 반시계 방향으로 정육각형 $\mathrm{ABCDEF}$ 위를 움직인다. 그리고 출발 후 $t$분 동안 이동한 거리는 $s_{\mathrm Q'}(t)=\dfrac2kt^2+\dfrac1kt$가 된다.
      criteria: ['ii.M1']
    - id: iib-2
      content: |
        두 선분 $\mathrm{OP}$와 $\mathrm{OQ}$의 사잇각과 두 선분 $\mathrm{OP}$와 $\mathrm{OQ}'$의 사잇각이 같으므로, 사잇각이 $\dfrac\pi3$일 경우는 $s_{\mathrm P}(t)-s_{\mathrm Q'}(t)=\left(1-\dfrac2k\right)t^2+\left(2-\dfrac1k\right)t$가 어떤 정수 $m$에 대하여 $6m+1$ 또는 $6m+5$가 될 때만 가능하다.
      criteria: ['ii.A1']
    - id: iib-3
      content: |
        $k\ge125$인 경우 $s_{\mathrm P}(t)-s_{\mathrm Q'}(t)$는 $0\le t\le10$에서 증가하므로 $s_{\mathrm P}(0)-s_{\mathrm Q'}(0)=0$ 이상 $s_{\mathrm P}(10)-s_{\mathrm Q'}(10)=120-\dfrac{210}{k}$ 이하의 수 중 6으로 나누었을 때 나머지가 1 또는 5가 되는 자연수의 개수가 $a_k$가 된다.
      criteria: ['ii.M2']
    - id: iib-4
      content: |
        우선 $k>210$인 경우 0부터 119까지의 자연수를 고려하므로 $1,7,13,\dots,115$(20개), $5,11,17,\dots,119$(20개)가 되어 $a_k=40$이다. $k=125$인 경우는 0부터 118까지의 자연수를 고려하므로 $a_{5^3}=39$이다. 따라서 $\displaystyle\sum_{j=3}^{10}a_{5^j}=319$이다.
      criteria: ['ii.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: ii.M1
      mark_type: M
      points: 2
      evidence: |
        $\mathrm{OQ}$와 작은 정육각형의 교점 $\mathrm Q'$의 이동 거리 $\dfrac2kt^2+\dfrac1kt$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [iib-1]
    - id: ii.A1
      mark_type: A
      points: 3
      evidence: |
        사잇각 $\dfrac\pi3$ $\iff$ $s_{\mathrm P}-s_{\mathrm Q'}=6m+1$ 또는 $6m+5$임을 밝혔다.
      depends_on: [ii.M1]
      steps: [iib-2]
    - id: ii.M2
      mark_type: M
      points: 2
      evidence: |
        $s_{\mathrm P}-s_{\mathrm Q'}$가 $[0,10]$에서 증가하고 최댓값이 $120-\dfrac{210}{k}$임을 밝혔다.
      depends_on: [ii.A1]
      implied_ok: false
      steps: [iib-3]
    - id: ii.A2
      mark_type: A
      points: 3
      evidence: |
        $a_{125}=39$, $k\ge625$에서 $a_k=40$을 구해 합 $319$를 얻었다.
      depends_on: [ii.M2]
      steps: [iib-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'iii'
  stem: |
    $k=8$에 대하여 <제시문2>의 세 점 $\mathrm{O},\mathrm{P},\mathrm{Q}$가 일직선 상에 있지 않을 경우 삼각형 $\mathrm{OPQ}$의 넓이의 최댓값을 $\alpha$라 하자. 두 점 $\mathrm{P},\mathrm{Q}$가 동시에 각각 두 꼭짓점 $\mathrm{A},\mathrm{A}'$를 출발하였을 때, 출발한 후 6분 동안 아래의 두 조건을 모두 만족하는 경우의 수를 구하고 그 이유를 논하시오.

    (1) 점 $\mathrm{Q}$가 선분 $\mathrm{C'D'}$위에 위치한다.

    (2) 삼각형 $\mathrm{OPQ}$의 넓이가 $\alpha$가 된다.
  points: 15
  depends_on: []
  answer: {kind: value, value: '4', equivalents: [], tolerance: null}
  solutions:
  - id: Siii-A
    audience: A
    method_no: 1
    key_idea: $\alpha=2\sqrt3$. $\mathrm Q$가 꼭짓점이면 $\mathrm P$는 $\mathrm{OQ}$에 평행한 두 변 위, $\mathrm Q$가 변의 내부이면 $\mathrm P$는 특정 꼭짓점이어야 한다. 각 경우 $t$의 범위를 이차식으로 비교한다.
    steps:
    - {id: iiia, content: '$\mathrm Q=\mathrm C''$: 0번, $\mathrm Q=\mathrm D''$: 1번, $\mathrm Q\in\mathrm{C''D''}$ 내부: 3번 → 합 4', criteria: ['iii.M1', 'iii.A1', 'iii.A2', 'iii.A3']}
    hint_ladder:
    - 밑변을 $\mathrm{OQ}$로 보면 넓이가 최대가 되려면 $\mathrm P$는 어디에 있어야 하는가?
    - $\mathrm Q$가 꼭짓점일 때와 변의 내부일 때를 나누자.
  - id: Siii-B
    audience: B
    source_flow: 2026 보고서 문항카드 9 예시답안 p.175-176(인쇄 171-172)
    method_no: 1
    steps:
    - id: iiib-1
      content: |
        삼각형 $\mathrm{OPQ}$의 넓이가 최대가 되는 조건을 먼저 생각한다.
        1. 점 $\mathrm Q$가 정육각형 $\mathrm{A'B'C'D'E'F'}$의 한 꼭짓점 위에 있다면, 점 $\mathrm P$가 선분 $\mathrm{OQ}$와 평행한 정육각형 $\mathrm{ABCDEF}$의 두 변 위에 놓이면 된다. 이때 삼각형 $\mathrm{OPQ}$의 넓이는 $2\sqrt3$이 된다.
        2. 점 $\mathrm Q$가 정육각형 $\mathrm{A'B'C'D'E'F'}$의 꼭짓점이 아닌 한 변 위에 있다면, $\mathrm{OQ}$와 평행한 직선이 정육각형 $\mathrm{ABCDEF}$와 한 점에서만 만나게 될 때(두 가지 경우)만 가능하다. 이 경우 삼각형 $\mathrm{OPQ}$의 넓이는 $2\sqrt3$이 된다.
        따라서 가능한 삼각형 $\mathrm{OPQ}$의 넓이의 최댓값은 $\alpha=2\sqrt3$이고 위 두 가지 경우에만 가능하다.
      criteria: ['iii.M1']
    - id: iiib-2
      content: |
        경우1. 점 $\mathrm Q$가 꼭짓점 $\mathrm C'$ 위에 있는 경우: 점 $\mathrm P$가 선분 $\mathrm{AB}$ 또는 선분 $\mathrm{DE}$ 위에 놓이면 된다. $0\le t\le6$이므로 $2t^2+t=16$ 또는 $2t^2+t=64$ 중에 하나가 성립하고, 어떤 정수 $m$이 존재하여
        $$6m\le t^2+2t\le6m+1\ \text{또는}\ 6m+3\le t^2+2t\le6m+4\qquad(*)$$
        중에 하나가 성립하면 된다. 우선 $2t^2+t=16$이면 $2<t<3$이고 $11<t^2+2t=8+\dfrac32t<12+\dfrac12$이다. 그러므로 조건 $(*)$은 $12\le8+\dfrac32t<12+\dfrac12$이고, 이는 $\dfrac83\le t<3$이 된다. 하지만 이 경우 $16=2t^2+t\ge\dfrac{152}{9}$가 되어 모순이다. 그리고 $2t^2+t=64$이면, 비슷한 방식으로 조건 $(*)$은 $5<t\le\dfrac{16}{3}$이 되는데 해당 범위에서 $64=2t^2+t\le\dfrac{560}{9}$이 되어 모순이다. 따라서 0번 발생한다.
      criteria: ['iii.A1']
    - id: iiib-3
      content: |
        경우2. 점 $\mathrm Q$가 꼭짓점 $\mathrm D'$ 위에 있는 경우: 점 $\mathrm P$가 선분 $\mathrm{BC}$ 또는 선분 $\mathrm{EF}$ 위에 놓이면 가능하다. $0\le t\le6$이므로 $2t^2+t=24$ 또는 $2t^2+t=72$ 중에 하나가 성립하고, 어떤 정수 $m$이 존재하여
        $$6m+1\le t^2+2t\le6m+2\ \text{또는}\ 6m+4\le t^2+2t\le6m+5\qquad(**)$$
        중에 하나가 성립하면 된다. 우선 $2t^2+t=24$이면 $3<t<4$이고 $16+\dfrac12<t^2+2t=12+\dfrac32t<18$이다. 그러므로 조건 $(**)$는 $16+\dfrac12<12+\dfrac32t\le17$이고, 이는 $3<t\le\dfrac{10}{3}$이 된다. 해당 범위에서 $2t^2+t=24$를 만족하는 $t$가 1개 존재한다. 그리고 $2t^2+t=72$이면, 비슷한 방식으로 조건 $(**)$는 $5<t\le\dfrac{16}{3}$이 되는데, $72=2t^2+t\le\dfrac{560}{9}$이 되어 모순이다. 따라서 1번 발생한다.
      criteria: ['iii.A2']
    - id: iiib-4
      content: |
        경우3. 점 $\mathrm Q$가 선분 $\mathrm{C'D'}$ 위에 있으면서 양 끝점이 아닌 경우: 점 $\mathrm P$가 꼭짓점 $\mathrm B$ 또는 꼭짓점 $\mathrm E$ 위에 있을 경우 가능하다. $0\le t\le6$이므로 $8<t^2+\dfrac t2<12$ 또는 $32<t^2+\dfrac t2<36$ 둘 중 하나가 성립하고, 어떤 정수 $m$이 존재하여
        $$t^2+2t=6m+1\ \text{또는}\ t^2+2t=6m+4\qquad(***)$$
        둘 중 하나가 성립하면 된다. 우선 $8<t^2+\dfrac t2<12$이면, $2<t<4$이고 $11<t^2+2t<18$이 되어야 하므로 조건 $(***)$은 $t^2+2t=13$ 또는 $t^2+2t=16$이 된다. 만약 $t^2+2t=13$이면 $\dfrac23<t<\dfrac{10}{3}$이 된다. 이 범위에서 $t^2+2t=13$을 만족하는 $t$가 1개 존재한다. 만약 $t^2+2t=16$이면 $\dfrac83<t<\dfrac{16}{3}$이 된다. 이 범위에서 $t^2+2t=16$을 만족하는 $t$가 1개 존재한다. 따라서 $8<t^2+\dfrac t2<12$인 경우 원하는 $t$는 2개 존재한다.
        그리고 $32<t^2+\dfrac t2<36$이면, $5<t<6$이고 $39+\dfrac12<t^2+2t<45$가 되어야 하므로 조건 $(***)$은 $t^2+2t=40$ 또는 $t^2+2t=43$이 된다. 만약 $t^2+2t=40$이면 $\dfrac83<t<\dfrac{16}{3}$이 되는데, 이 경우 $40=t^2+2t<\dfrac{352}{9}$이 되어 모순이다. 만약 $t^2+2t=43$이면 $\dfrac{14}{3}<t<\dfrac{22}{3}$가 성립한다. 따라서 해당 범위에 $t^2+2t=43$을 만족하는 $t$가 1개 존재한다. 그러므로 $32<t^2+\dfrac t2<36$인 경우 원하는 $t$는 1개 존재한다. 따라서 3번 발생한다.
      criteria: ['iii.A3']
    - id: iiib-5
      content: |
        위의 모든 경우를 종합하면 조건 (1), (2)를 모두 만족하는 삼각형 $\mathrm{OPQ}$의 넓이가 최대가 되는 경우의 수는 $4$번이다.
      criteria: ['iii.A3']
