intent: |
  두 점을 잇는 직선의 방정식을 이용하여 어떤 점들이 주어진 선분에 속할 수 있는지 판별하는 문제이다. 계수와 사잇값 정리 등으로 삼차방정식의 근을 구하는지, 사차함수의 증가·감소를 미분계수로 판별해 사차방정식이 주어진 구간에서 근을 갖는 조건을 알아내는지, 다항함수가 아닌 주어진 함수가 감소하지 않는 함수임을 이용해 효율적으로 순서쌍을 찾는지 평가한다(보고서 출제 의도 요약).
key_idea: |
  점 $(x_0,y_0)$가 선분 $\mathrm{PQ}$ 위에 있을 조건은 $y_0=(f(t)-t)x_0+t$를 만족하는 $t\in[0,1]$가 존재하는 것이다. 이 식을 $t$의 함수로 보고 증가(감소하지 않음)를 이용해 값의 범위를 구한다.
stuck: |
  선분 위의 점 조건을 $t$에 대한 방정식으로 바꾸고, 그 방정식이 $[0,1]$에서 해를 갖는 조건을 $t$의 함수의 단조성과 양 끝값으로 판정하는 것
idea_tags: [IDEA-SEGMENT-PARAM-EQUATION, IDEA-MONOTONE-RANGE-IVT]
tags: [선분 위의 점, 직선의 방정식, 단조성]
