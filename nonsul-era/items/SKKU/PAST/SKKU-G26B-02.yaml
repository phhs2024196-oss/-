stimuli:
- id: S1
  label: <제시문1>
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고 $x=a$의 좌우에서 $f'(x)$의 부호가

    (1) 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이고, 극댓값 $f(a)$를 갖는다.

    (2) 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이고, 극솟값 $f(a)$를 갖는다.
- id: S2
  label: <제시문2>
  body: |
    함수 $f(x)$가 두 실수 $a,b$를 포함하는 구간에서 연속일 때, $f(x)$의 한 부정적분을 $F(x)$라고 하면 $f(x)$의 $a$에서 $b$까지의 정적분은 다음과 같다.
    $$\int_a^b f(x)\,dx=\big[F(x)\big]_a^b=F(b)-F(a)$$
- id: S3
  label: <제시문3>
  body: |
    연속함수 $f(x)$에 대하여 함수 $g(x)$는 $g(x+4)=g(x)$와
    $$g(x)=\begin{cases}f(x) & (-2\le x\le0)\\ f(-x) & (0<x<2)\end{cases}$$
    를 만족한다. 그리고 함수 $h(x)=g(x-1)\lvert g(x)-g(x-1)\rvert$로 정의한다.
    예를 들어, $f(x)=-x-\dfrac12$일 때, $g\left(\dfrac14\right)=-\dfrac14$과 $g\left(-\dfrac34\right)=\dfrac14$이므로 $h\left(\dfrac14\right)=\dfrac18$이다.

stem: |
  다음 <제시문1> ~ <제시문3>을 읽고 [문제2-ⅰ] ~ [문제2-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: 'i'
  stem: |
    <제시문3>에서 $f(x)=x+1$일 때, $2\le x\le2026$인 $x$에 대하여 $\displaystyle\int_1^x h(t)\,dt=0$을 만족하는 $x$의 개수를 구하고 그 이유를 논하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '1012', equivalents: [], tolerance: null}
  solutions:
  - id: Si-A
    audience: A
    method_no: 1
    key_idea: $H(x)=\int_1^xh$는 주기 4마다 0으로 돌아오고, 한 주기 $(4k-3,4k+1]$에서 0이 되는 점이 정확히 2개.
    steps:
    - {id: ia, content: '$H(2)=\tfrac12$, $H(3)=\tfrac14$, $H(4)=-\tfrac14$, $H(5)=0$ → 주기마다 2개, $506\times2=1012$', criteria: ['i.M1', 'i.A1', 'i.R1', 'i.A2']}
    hint_ladder:
    - $h$의 주기를 먼저 확인하자.
    - $H(x)=\int_1^x h(t)dt$의 증감표를 한 주기에 대해 그려 보자.
  - id: Si-B
    audience: B
    source_flow: 2026 보고서 문항카드 11 예시답안 p.184(인쇄 180)
    method_no: 1
    steps:
    - id: ib-1
      content: |
        $g(x+4)=g(x)$이므로 $h(x+4)=h(x)$이다. 또한
        $\lvert g(x)-g(x-1)\rvert=\begin{cases}\lvert1-2x\rvert & (0\le x\le1)\\ 1 & (1<x<2)\end{cases}$이므로 $h(x)=\begin{cases}x\lvert1-2x\rvert & (0\le x\le1)\\ 2-x & (1\le x\le2)\end{cases}$이다.
        마찬가지로, $h(x)=\begin{cases}(2-x)\lvert5-2x\rvert & (2\le x\le3)\\ x-4 & (3\le x\le4)\end{cases}$이다.
      criteria: ['i.M1']
    - id: ib-2
      content: |
        이제 $H(x)=\displaystyle\int_1^xh(t)dt$라고 하면 $H'(x)=h(x)$이므로, 함수 $H(x)$는 다음 증감표를 가진다.
        $x=1$에서 $h=1$, $(1,2)$에서 $+$(증가), $x=2$에서 $0$, $(2,3)$에서 $-$(감소), $x=3$에서 $-1$, $(3,4)$에서 $-$(감소), $x=4$에서 $0$, $(4,5)$에서 $+$(증가), $x=5$에서 $1$.
      criteria: ['i.A1']
    - id: ib-3
      content: |
        또한 $\alpha=\displaystyle\int_4^5h(t)dt=\int_0^1h(t)dt=\int_0^1t\lvert1-2t\rvert dt=\dfrac14$이고 $\beta=\displaystyle\int_1^2h(t)dt=\dfrac12$이다. 그리고 $\displaystyle\int_2^3h(t)dt=-\alpha=-\dfrac14$이고 $\displaystyle\int_3^4h(t)dt=-\beta=-\dfrac12$이다. 이로부터
        $H(1)=0$, $H(2)=\dfrac12$, $H(3)=\dfrac12-\dfrac14=\dfrac14$, $H(4)=\dfrac14-\dfrac12=-\dfrac14$, $H(5)=0$
        을 얻게 된다. 따라서 $\displaystyle\int_1^5h(t)dt=0$이고 모든 정수 $k$에 대해 $\displaystyle\int_1^{4k+1}h(t)dt=0$이다.
      criteria: ['i.R1']
    - id: ib-4
      content: |
        위의 증감표와 사잇값 정리로부터 닫힌구간 $[3,4]$에서 $\displaystyle\int_1^xh(t)dt=0$을 만족하는 유일한 $x$가 존재한다. 따라서 모든 정수 $k$에 대해 구간 $(4k-3,4k+1]$ 위에 $\displaystyle\int_1^xh(t)dt=0$을 만족하는 $x$가 정확히 두 개 존재한다. 이로부터 닫힌구간 $[2,2026]$에서 $\displaystyle\int_1^xh(t)dt=0$을 만족하는 $x$는 $506\times2=1012$개 존재한다.
      criteria: ['i.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: i.M1
      mark_type: M
      points: 2
      evidence: |
        $h$의 주기 4와 한 주기에서의 구간별 식을 구했다.
      depends_on: []
      implied_ok: false
      steps: [ib-1]
    - id: i.A1
      mark_type: A
      points: 2
      evidence: |
        $H'(x)=h(x)$로 $H$의 증감표를 만들었다.
      depends_on: [i.M1]
      steps: [ib-2]
    - id: i.R1
      mark_type: R
      points: 3
      evidence: |
        $H(2),H(3),H(4),H(5)$ 값을 구해 한 주기 적분이 0임을 보였다.
      depends_on: [i.A1]
      steps: [ib-3]
    - id: i.A2
      mark_type: A
      points: 3
      evidence: |
        사잇값 정리로 주기마다 정확히 2개임을 밝혀 1012개를 얻었다.
      depends_on: [i.R1]
      steps: [ib-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'ii'
  stem: |
    <제시문3>에서 $f(x)=(x+1)^2$일 때, 정적분 $\displaystyle\int_0^{\frac{2025}{2}}h(x)\,dx$의 값을 구하고 그 이유를 논하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '18217/96', equivalents: [], tolerance: null}
  solutions:
  - id: Sii-A
    audience: A
    method_no: 1
    key_idea: 이 경우 $g$의 주기가 2이므로 $h$도 주기 2. 한 주기 적분 $\tfrac{36}{96}$을 506번 더하고 나머지 $\int_0^{1/2}h=\tfrac1{96}$.
    steps:
    - {id: iia, content: '$506\left(\tfrac1{96}+\tfrac{17}{96}+\tfrac{17}{96}+\tfrac1{96}\right)+\tfrac1{96}=\tfrac{18217}{96}$', criteria: ['ii.M1', 'ii.A1', 'ii.A2']}
    hint_ladder:
    - $f(x)=(x+1)^2$이면 $g$의 주기가 더 짧아진다.
  - id: Sii-B
    audience: B
    source_flow: 2026 보고서 문항카드 11 예시답안 p.185(인쇄 181)
    method_no: 1
    steps:
    - id: iib-1
      content: |
        $f(x)=(x+1)^2$일 때, $g(x+2)=g(x)$이고 $h(x+2)=h(x)$이다. 그리고
        $\lvert g(x)-g(x-1)\rvert=\begin{cases}\lvert1-2x\rvert & (0\le x\le1)\\ \lvert3-2x\rvert & (1<x<2)\end{cases}$이므로 $h(x)=\begin{cases}x^2\lvert1-2x\rvert & (0\le x\le1)\\ (x-2)^2\lvert3-2x\rvert & (1\le x\le2)\end{cases}$이다.
      criteria: ['ii.M1']
    - id: iib-2
      content: |
        구하고자 하는 정적분은
        $$\int_0^{\frac{2025}{2}}h(x)dx=\int_0^2h+\int_2^4h+\cdots+\int_{1010}^{1012}h+\int_{1012}^{\frac{2025}{2}}h=506\left(\int_0^1h+\int_1^2h\right)+\int_0^{\frac12}h.$$
      criteria: ['ii.A1']
    - id: iib-3
      content: |
        $\displaystyle\int_0^{\frac12}h(x)dx=\int_{\frac32}^{2}h(x)dx=\dfrac1{96}$과 $\displaystyle\int_{\frac12}^{1}h(x)dx=\int_1^{\frac32}h(x)dx=\dfrac{17}{96}$이므로,
        $$\int_0^{\frac{2025}{2}}h(x)dx=506\left(\dfrac1{96}+\dfrac{17}{96}+\dfrac{17}{96}+\dfrac1{96}\right)+\dfrac1{96}=\dfrac{18217}{96}$$
        이다.
      criteria: ['ii.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: ii.M1
      mark_type: M
      points: 3
      evidence: |
        $h$의 주기 2와 $[0,2]$에서의 구간별 식을 구했다.
      depends_on: []
      implied_ok: false
      steps: [iib-1]
    - id: ii.A1
      mark_type: A
      points: 3
      evidence: |
        적분을 $506\left(\int_0^2h\right)+\int_0^{1/2}h$로 분해했다.
      depends_on: [ii.M1]
      steps: [iib-2]
    - id: ii.A2
      mark_type: A
      points: 4
      evidence: |
        $\dfrac1{96}$, $\dfrac{17}{96}$을 계산해 $\dfrac{18217}{96}$을 얻었다.
      depends_on: [ii.M1, ii.A1]
      steps: [iib-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'iii'
  stem: |
    <제시문3>에서 $f(x)=ax+b$ (단, $a,b$는 $1\le a<b\le10$을 만족하는 자연수)이고, 정적분 $\displaystyle\int_{2023}^{2025}h(x)\,dx$의 값이 $0$보다 작다고 한다. 이때 가능한 순서쌍 $(a,b)$를 모두 구하고 그 이유를 논하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: set, value: '{(7,8), (8,9), (9,10)}', equivalents: [], tolerance: null}
  solutions:
  - id: Siii-A
    audience: A
    method_no: 1
    key_idea: 주기 4로 $\int_{2023}^{2025}h=\int_{-1}^{1}h=a\left(-\tfrac74a+\tfrac32b\right)$.
    steps:
    - {id: iiia, content: '$a\left(-\tfrac74a+\tfrac32b\right)<0\iff a<b<\tfrac76a$ → $(7,8),(8,9),(9,10)$', criteria: ['iii.M1', 'iii.A1', 'iii.A2']}
    hint_ladder:
    - $2023$과 $2025$를 4로 나눈 나머지를 보자.
  - id: Siii-B
    audience: B
    source_flow: 2026 보고서 문항카드 11 예시답안 p.185(인쇄 181)
    method_no: 1
    steps:
    - id: iiib-1
      content: |
        $g(x+4)=g(x)$이므로 $h(x+4)=h(x)$를 얻게 되어 $\displaystyle\int_{2023}^{2025}h(x)dx=\int_{-1}^{1}h(x)dx$이다.
        $\lvert g(x)-g(x-1)\rvert=\begin{cases}a & (-1\le x\le0)\\ a\lvert1-2x\rvert & (0<x<1)\end{cases}$이므로 $h(x)=\begin{cases}a(ax+(b-a)) & (-1\le x\le0)\\ a\lvert1-2x\rvert(ax+(b-a)) & (0\le x\le1)\end{cases}$이다.
      criteria: ['iii.M1']
    - id: iiib-2
      content: |
        $$\int_{-1}^{1}h(x)dx=\int_{-1}^{0}h+\int_0^{\frac12}h+\int_{\frac12}^{1}h=a\left[\left(b-\dfrac32a\right)+\left(-\dfrac5{24}a+\dfrac14b\right)+\left(-\dfrac1{24}a+\dfrac14b\right)\right]=a\left(-\dfrac74a+\dfrac32b\right)<0$$
      criteria: ['iii.A1']
    - id: iiib-3
      content: |
        으로부터 $a<b<\dfrac76a$를 얻게 된다. 이를 만족하는 순서쌍은 $(7,8)$, $(8,9)$, $(9,10)$이다.
      criteria: ['iii.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: iii.M1
      mark_type: M
      points: 3
      evidence: |
        주기성으로 $\int_{-1}^{1}h$로 바꾸고 $h$를 구간별로 구했다.
      depends_on: []
      implied_ok: false
      steps: [iiib-1]
    - id: iii.A1
      mark_type: A
      points: 4
