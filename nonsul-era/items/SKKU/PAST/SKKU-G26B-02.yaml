intent: |
  주어진 함수에 평행이동과 대칭이동을 적용하여 얻은 새로운 함수(주기함수)의 정적분 값과 관련한 질문을 묻는다. 도형의 이동으로 그래프 개형을 올바르게 그리고, 도함수를 활용해 증가와 감소를 판단하며 정적분의 값을 구하는 능력, 즉 창의·융합적 사고를 평가한다(보고서 출제 의도 요약).
key_idea: |
  $g$는 주기 4인 함수이므로 $h(x)=g(x-1)\lvert g(x)-g(x-1)\rvert$도 주기 4(또는 2)이다. 한 주기 안에서 $h$를 구간별로 구하고 정적분을 주기 단위로 묶는다.
stuck: |
  $g(x)$와 $g(x-1)$을 각 구간에서 정확히 식으로 바꿔 $h$를 구간별로 쓰는 것, 그리고 $\int_1^{x}h$의 증감표에서 한 주기 적분이 0임을 찾는 것
