- id: 'iii'
  stem: |
    <제시문1>과 <제시문2>에서 직선 $\mathrm{NP}$의 기울기가 $m$이고 점 $\mathrm P$의 $x$좌표가 집합 $D_2\cap(1,\infty)$에 속한다고 하자. 삼각형 $\mathrm{NQR}$이 선분 $\mathrm{QR}$을 빗변으로 하는 직각삼각형이 되었을 때, $m$은 삼차방정식 $x^3+px^2+qx+r=0$의 근이다. 이때 유리수 $p,q,r$을 구하고 그 이유를 논하시오.
  points: 15
  depends_on: ['i', 'ii']
  answer: {kind: expression, value: 'p=0; q=1/3; r=-2/3', equivalents: [], tolerance: null}
  solutions:
  - id: Siii-A
    audience: A
    method_no: 1
    key_idea: 빗변이 $\mathrm{QR}$이면 $\mathrm{QR}$은 지름이므로 $\mathrm Q=-\mathrm R$. $\mathrm Q$에서의 접선과 직선 $\mathrm{NP}$의 교점이 곡선 위에 있어야 한다.
    steps:
    - {id: iiia, content: '교점 $\left(\tfrac{2}{m(1+m^2)},\tfrac{m^2+3}{m^2+1}\right)$을 $y=-x+4$에 대입 → $3m^3+m-2=0$', criteria: ['iii.M1', 'iii.A1', 'iii.R1', 'iii.A2']}
    hint_ladder:
    - 원에 내접하는 삼각형의 빗변이 지름이 되는 조건을 떠올리자.
    - $\mathrm P$는 $y=x+1$ 또는 $y=-x+4$ 위에 있다.
  - id: Siii-B
    audience: B
    source_flow: 2026 보고서 문항카드 12 예시답안 p.190(인쇄 186)
    method_no: 1
    steps:
    - id: iiib-1
      content: |
        점 $\mathrm P$의 $x$좌표가 $D_2\cap(1,\infty)=(1,2]$에 속하는 경우, 기울기가 $m$인 직선 $\mathrm{NP}$의 방정식 $y=mx+1$과 원의 방정식 $x^2+y^2=1$을 연립하면, 점 $\mathrm R$의 좌표는 $\left(-\dfrac{2m}{1+m^2},\dfrac{1-m^2}{1+m^2}\right)$임을 알 수 있다.
      criteria: ['iii.M1']
    - id: iiib-2
      content: |
        삼각형 $\mathrm{NQR}$이 선분 $\mathrm{QR}$을 빗변으로 하는 직각삼각형이면 선분 $\mathrm{QR}$은 원의 지름이다. 선분 $\mathrm{QR}$이 지름이 되는 경우에, 점 $\mathrm Q$는 점 $\mathrm R$의 원점 대칭점이므로 점 $\mathrm Q$의 좌표는 $\left(\dfrac{2m}{1+m^2},\dfrac{m^2-1}{m^2+1}\right)$이 된다. 원 위의 점 $\mathrm Q$에서의 접선과 직선 $\mathrm{NP}$의 교점이 곡선 $y=f(x)$ 위에 놓여있어야 한다. 교점의 좌표를 구하면, $\left(\dfrac{2}{m(1+m^2)},\dfrac{m^2+3}{m^2+1}\right)$이 된다.
      criteria: ['iii.A1']
    - id: iiib-3
      content: |
        이 좌표값을 $y=x+1$에 대입하고 정리하면, $m=1$을 얻는다. 이때 교점의 $x$좌표는 1이므로, $D_2\cap(1,\infty)=(1,2]$에 속하지 않게 된다.
      criteria: ['iii.R1']
    - id: iiib-4
      content: |
        이제 [문제 3-ⅱ] 풀이에서 $\dfrac12\le m\le1$인 $m$에 대하여, $\left(\dfrac{2}{m(1+m^2)},\dfrac{m^2+3}{m^2+1}\right)$의 좌표값을 $y=-x+4$에 대입하고 정리하면, $3m^3+m-2=0$을 얻는다. $h(m)=3m^3+m-2$로 두면, $h\left(\dfrac12\right)=-\dfrac98<0$이고 $h(1)=2>0$이므로, 사잇값의 정리(<제시문3>)에 의해 $h(m)=0$의 실근 $\beta$가 열린구간 $\left(\dfrac12,1\right)$에 존재하게 된다. 또한 $m=\beta$에 대응하는 점 $\mathrm P$의 $x$좌표는 열린구간 $\left(\dfrac32,2\right)$에 속하게 된다. 따라서 $\beta$가 만족하는 삼차방정식은 $x^3+\dfrac13x-\dfrac23=0$이므로, $p=0$, $q=\dfrac13$, $r=-\dfrac23$임을 알 수 있다.
        답: $p=0$, $q=\dfrac13$, $r=-\dfrac23$
      criteria: ['iii.A2']
