stimuli:
- id: S1
  label: <제시문1>
  body: |
    함수 $f(x)=\begin{cases}x^2-x+2 & (x\le1)\\ x+1 & \left(1<x\le\dfrac32\right)\\ -x+4 & \left(\dfrac32<x\le2\right)\\ -x^2+3x & (x>2)\end{cases}$에 대하여 집합 $D_1$과 $D_2$는 각각 다음과 같이 정의된다.
    $D_1=\{x\mid f(f(x))\le f(x)+1\}$이고 $D_2=\{x\mid f(f(x))\le f(x)\}$이다.
- id: S2
  label: <제시문2>
  body: |
    좌표평면 위에 놓여있는 원 $C$는 원점이 중심이고 반지름이 $1$이다. <제시문1>의 함수 $f(x)$에 대하여 곡선 $y=f(x)$ 위의 임의의 점 $\mathrm P$와 점 $\mathrm N(0,1)$을 지나는 직선이 원 $C$와 만나는 점 중 $\mathrm N$이 아닌 점을 $\mathrm R$이라고 한다. 또한 점 $\mathrm P$에서 원 $C$에 그은 두 접선과 원의 교점 $\mathrm Q$ 중에서 세 점 $\mathrm N,\mathrm Q,\mathrm R$이 시계 방향으로 놓이도록 점 $\mathrm Q$를 잡는다. 만약 직선 $\mathrm{NP}$가 원에 접하는 경우에는 점 $\mathrm R$과 점 $\mathrm Q$를 모두 점 $\mathrm N$으로 정의한다.
- id: S3
  label: <제시문3>
  body: |
    함수 $h(x)$가 닫힌구간 $[a,b]$에서 연속이고 $h(a)\ne h(b)$이면, $h(a)$와 $h(b)$ 사이의 임의의 값 $k$에 대하여 $h(c)=k$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.

stem: |
  다음 <제시문1> ~ <제시문3>을 읽고 [문제3-ⅰ] ~ [문제3-ⅲ]을 문항별로 풀이와 함께 답하시오. (40점)

subparts:
- id: 'i'
  stem: |
    <제시문1>에서 집합 $D_1=(-\infty,a]$이고 집합 $D_2=(-\infty,b]\cup[c,d]$일 때, $a,b,c,d$의 값을 모두 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'a=(3+sqrt(5))/2; b=0; c=1; d=2', equivalents: [], tolerance: null}
  solutions:
  - id: Si-A
    audience: A
    method_no: 1
    key_idea: $t=f(x)$로 두면 $f(t)\le t+1\iff t\ge1$, $f(t)\le t\iff t\ge2$이므로 각각 $f(x)\ge1$, $f(x)\ge2$의 해를 구한다.
    steps:
    - {id: ia, content: '$f(x)\ge1\iff x\le\tfrac{3+\sqrt5}{2}$, $f(x)\ge2\iff x\le0$ 또는 $1\le x\le2$', criteria: ['i.M1', 'i.A1', 'i.A2']}
    hint_ladder:
    - $f(x)$를 한 문자로 치환해 보자.
    - $y=f(x)$와 $y=x+1$, $y=x$의 그래프를 비교하자.
  - id: Si-B
    audience: B
    source_flow: 2026 보고서 문항카드 12 예시답안 p.188-189(인쇄 184-185)
    method_no: 1
    steps:
    - id: ib-1
      content: |
        곡선 $y=f(x)$의 그래프를 그린다. [그림(보고서): $y=f(x)$의 그래프와 직선 $y=x+1$, $y=x$, $y=2$, $y=1$; $x=1,\tfrac32,2$에 점선]
        $f(x)$를 $t$로 치환하면, $f(f(x))\le f(x)+1$이라는 조건은 $f(t)\le t+1$이 된다. 곡선 $y=f(x)$의 그래프와 직선 $y=x+1$의 그래프를 비교해보면, $f(t)\le t+1$이 되는 $t$의 범위는 $t\ge1$임을 알 수 있다.
      criteria: ['i.M1']
    - id: ib-2
      content: |
        <제시문1>에 주어진 함수의 정의로부터 $f(x)\ge1$이 되는 $x$의 범위를 조사해 보면, $-x^2+3x=1$의 두 실근 중에서 더 큰 실근을 $a$라고 했을 때, $x\le a$가 된다. 여기서 $a=\dfrac{3+\sqrt5}{2}$이므로, 집합 $D_1=(-\infty,a]$일 때, $a=\dfrac{3+\sqrt5}{2}$이다.
      criteria: ['i.A1']
    - id: ib-3
      content: |
        비슷한 방법으로, $f(f(x))\le f(x)$라는 조건은 $f(t)\le t$이 된다. 곡선 $y=f(x)$의 그래프와 직선 $y=x$의 그래프를 비교해보면, $f(t)\le t$이 되는 $t$의 범위는 $t\ge2$임을 알 수 있다. <제시문1>에 주어진 함수의 정의로부터 $f(x)\ge2$이 되는 $x$의 범위를 조사해 보면, $x\le0$이거나 $1\le x\le2$임을 알 수 있다. 따라서 집합 $D_2=(-\infty,b]\cup[c,d]$일 때, $b=0$, $c=1$, $d=2$가 된다.
        답: $a=\dfrac{3+\sqrt5}{2}$, $b=0$, $c=1$, $d=2$
      criteria: ['i.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: i.M1
      mark_type: M
      points: 3
      evidence: |
        $t=f(x)$로 치환해 $f(t)\le t+1\iff t\ge1$(그래프 비교)을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [ib-1]
    - id: i.A1
      mark_type: A
      points: 3
      evidence: |
        $f(x)\ge1\iff x\le\dfrac{3+\sqrt5}{2}$로 $a$를 구했다.
      depends_on: [i.M1]
      steps: [ib-2]
    - id: i.A2
      mark_type: A
      points: 4
      evidence: |
        $f(t)\le t\iff t\ge2$와 $f(x)\ge2$의 해로 $b=0$, $c=1$, $d=2$를 구했다.
      depends_on: [i.M1]
      steps: [ib-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'ii'
  stem: |
    <제시문1>과 <제시문2>에서 점 $\mathrm P$의 $x$좌표가 집합 $D_1$에 속한다고 하자. 점 $\mathrm R$이 될 수 있는 모든 점들로 이루어진 호의 길이를 $\theta$라고 할 때, $\tan\left(\dfrac{\theta}{2}\right)$의 값을 구하고 그 이유를 논하시오.
  points: 15
  depends_on: ['i']
  answer: {kind: value, value: '-3', equivalents: [], tolerance: null}
  solutions:
  - id: Sii-A
    audience: A
    method_no: 1
    key_idea: 직선 $\mathrm{NP}$의 기울기는 $m\le-3$ 또는 $m\ge0$이고, $\mathrm R$은 $\mathrm N$에서 $\mathrm R_0(-1,0)$, $\mathrm R_1(0,-1)$을 지나 $\mathrm R_2$($m=-3$)까지의 긴 호를 움직인다.
    steps:
    - {id: iia, content: '$\theta=\pi+\widehat{\mathrm R_1\mathrm R_2}$, $\tan\tfrac\theta2=\tan\left(\tfrac\pi2+\angle\mathrm{ONR_1}\right)=-3$', criteria: ['ii.M1', 'ii.A1', 'ii.M2', 'ii.A2']}
    hint_ladder:
    - $\mathrm N(0,1)$을 지나 곡선 $y=x^2-x+2$에 접하는 직선의 기울기를 구하자.
    - 기울기가 바뀔 때 $\mathrm R$은 원 위에서 어떻게 움직이는가?
  - id: Sii-B
    audience: B
    source_flow: 2026 보고서 문항카드 12 예시답안 p.189-190(인쇄 185-186)
    method_no: 1
    steps:
    - id: iib-1
      content: |
        [그림(보고서): 단위원, 점 N, 곡선 위의 점 P, 직선 NP와 원의 교점 R]
        점 $\mathrm N$과 점 $\mathrm P$를 지나는 직선의 기울기를 $m$이라고 하자. 먼저 점 $(0,1)$을 지나고 $y=x^2-x+2$에 접하는 직선을 찾아보자. 접점을 $(t,t^2-t+2)$라 하고 접선의 방정식을 구해보면, $y=(2t-1)(x-t)+t^2-t+2$가 되는데, 이 접선이 점 $(0,1)$을 지나므로, $t=\pm1$을 얻는다. 이로부터 접선의 기울기는 $-3$ 또는 $1$이 된다. 따라서 점 $\mathrm P$의 $x$좌표가 0이 아니고, 1 이하인 경우에, 직선 $y=mx+1$과 곡선 $y=f(x)$의 교점이 생기도록 하는 $m$의 범위는 $m\ge1$ 또는 $m\le-3$임을 알 수 있다. 한편 점 $\mathrm P$가 $(0,2)$인 경우에 점 $\mathrm R$은 $(0,-1)$이 된다.
      criteria: ['ii.M1']
    - id: iib-2
      content: |
        곡선 $y=f(x)$의 그래프를 관찰해보면, 점 $\mathrm P$의 $x$좌표가 $(1,2]$에 속한 경우에는 직선 $\mathrm{NP}$의 기울기 $m$이 $\dfrac12\le m\le1$을 만족하게 된다. 또한 $2<x\le a$ (여기서 $a=\dfrac{3+\sqrt5}{2}$)일 때, 직선 $y=mx+1$과 곡선 $y=-x^2+3x$의 교점이 생기도록하는 $m$의 범위는 $0\le m\le\dfrac12$임을 알 수 있다.
        따라서 점 $\mathrm P$는 $(0,2)$가 아니고 점 $\mathrm P$의 $x$좌표가 집합 $D_1$에 속하는 경우, 직선 $\mathrm{NP}$의 기울기 $m$은 $m\le-3$ 또는 $m\ge0$임을 알 수 있다.
      criteria: ['ii.A1']
    - id: iib-3
      content: |
        두 점 $\mathrm R_0$과 $\mathrm R_1$을 $\mathrm R_0(-1,0)$, $\mathrm R_1(0,-1)$로 놓고, $\mathrm R_2$를 $m=-3$일 때 대응하는 점이라 하자. $m\ge0$일 때, 점 $\mathrm R$은 $\mathrm N$과 $\mathrm R_0$, $\mathrm R_1$을 시계 반대 방향으로 연결하는 호 위를 움직이고, $m\le-3$일 때, 점 $\mathrm R$은 $\mathrm R_1$과 $\mathrm R_2$를 시계 반대 방향으로 연결하는 호 위를 움직인다. 따라서 문제에서 요구하는 $\theta$는 $\mathrm N$과 $\mathrm R_2$를 연결하는 더 긴 쪽의 호의 길이와 같게 되므로 $\pi+\widehat{\mathrm R_1\mathrm R_2}$이 된다.
      criteria: ['ii.M2']
    - id: iib-4
      content: |
        따라서 $\tan\left(\dfrac\theta2\right)=\tan\left(\dfrac\pi2+\dfrac{\widehat{\mathrm R_1\mathrm R_2}}{2}\right)=\tan\left(\dfrac\pi2+\angle\mathrm{ONR_1}\right)$이고 $\dfrac\pi2+\angle\mathrm{ONR_1}$은 $x$축의 양의 방향과 직선 $y=-3x+1$이 이루는 각의 크기와 같으므로, $\tan\left(\dfrac\pi2+\angle\mathrm{ONR_1}\right)=-3$임을 알 수 있다.
        답: $-3$
      criteria: ['ii.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: ii.M1
      mark_type: M
      points: 4
      evidence: |
        $(0,1)$을 지나 $y=x^2-x+2$에 접하는 직선의 기울기 $-3$, $1$을 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [i.A1], max_points: 4}
      steps: [iib-1]
    - id: ii.A1
      mark_type: A
      points: 4
      evidence: |
        $x\in D_1$일 때 직선 $\mathrm{NP}$의 기울기 범위가 $m\le-3$ 또는 $m\ge0$임을 밝혔다.
      depends_on: [ii.M1]
      steps: [iib-2]
    - id: ii.M2
      mark_type: M
      points: 4
      evidence: |
        $\mathrm R$이 움직이는 호를 $\mathrm N\to\mathrm R_0\to\mathrm R_1\to\mathrm R_2$로 파악해 $\theta=\pi+\widehat{\mathrm R_1\mathrm R_2}$를 얻었다.
      depends_on: [ii.A1]
      implied_ok: false
      steps: [iib-3]
    - id: ii.A2
      mark_type: A
      points: 3
      evidence: |
        $\tan\dfrac\theta2=-3$을 근거와 함께 구했다.
      depends_on: [ii.M2]
