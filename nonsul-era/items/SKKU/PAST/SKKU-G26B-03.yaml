intent: |
  문제의 기하학적 정보를 파악해 수식화한 후 다양한 수학적 이론으로 필요한 정보를 얻어 내는지 평가한다. 합성함수와 관련된 부등식의 해, 구간별로 정의된 함수의 그래프, 원의 접선·할선 문제를 원과 직선의 위치관계, 호도법, 삼각함수, 사잇값의 정리 등을 사용하여 해결할 수 있는지 본다(보고서 출제 의도 요약).
key_idea: |
  $f(x)=t$로 치환하면 $f(f(x))\le f(x)+1\iff f(t)\le t+1$, $f(f(x))\le f(x)\iff f(t)\le t$이다. (ⅱ)는 직선 $\mathrm{NP}$의 기울기 범위를 그래프와 접선으로 구해 $\mathrm R$이 움직이는 호를 찾고, (ⅲ)은 빗변이 $\mathrm{QR}$인 직각삼각형 $\iff$ $\mathrm{QR}$이 지름임을 이용한다.
stuck: |
  합성함수 부등식을 $t=f(x)$의 부등식으로 바꾸는 것, (ⅱ)에서 직선 $\mathrm{NP}$의 기울기 범위($m\le-3$ 또는 $m\ge0$)와 $\mathrm R$이 움직이는 호의 대응, (ⅲ)에서 $\mathrm Q=-\mathrm R$과 접선의 교점이 곡선 위에 있을 조건
idea_tags: [IDEA-COMPOSITE-INEQ-SUBSTITUTION, IDEA-SLOPE-RANGE-ARC, IDEA-THALES-DIAMETER]
