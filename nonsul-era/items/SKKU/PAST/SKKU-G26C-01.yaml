stimuli:
- id: S1
  label: <제시문1>
  body: |
    실수 $A,B,P,Q$에 대하여 함수 $f(x)$가 다음과 같이 정의되어 있다.
    $$f(x)=\begin{cases}-x^2+Ax+B & (x<1)\\ x^2+Px+Q & (x\ge1)\end{cases}$$
    함수 $f(x)$는 실수 전체 집합에서 미분가능하고, 함수 $y=f(x)$의 그래프와 직선 $y=m$이 서로 다른 두 점에서만 만나도록 하는 모든 실수 $m$의 집합은 $\{-6,\,2\}$이다.
- id: S2
  label: <제시문2>
  body: |
    실수 $a,b,c,p,q$에 대하여 함수 $g(x)$가 다음과 같이 정의되어 있다.
    $$g(x)=\begin{cases}-x^3+ax^2+bx+c & (x\le0)\\ x^2+px+q & (x>0)\end{cases}$$
    함수 $g(x)$는 아래의 조건을 모두 만족한다.

    (1) 함수 $g(x)$는 연속함수이다.

    (2) 함수 $g(x)$는 $x=-2$에서 극소가 된다.

    (3) 함수 $y=g(x)$의 그래프와 직선 $y=m$이 서로 다른 네 점에서 만나도록 하는 모든 실수 $m$의 집합은 열린구간 $(1,\beta)$이다.

    (4) $p+c=a+b$가 성립한다.

    (5) 함수 $y=g(x)$의 그래프는 점 $\left(1,-\dfrac{19}{2}\right)$를 지난다.

stem: |
  다음 <제시문1>과 <제시문2>를 읽고 [문제1-ⅰ] ~ [문제1-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: 'i'
  stem: |
    <제시문1>에서 실수 $A,B,P,Q$의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'A=-2; B=1; P=-6; Q=3', equivalents: [], tolerance: null}
  solutions:
  - id: Si-A
    audience: A
    method_no: 1
    key_idea: 꼭짓점 높이 조건 $B=2-\tfrac{A^2}4$, $Q=\tfrac{P^2}4-6$과 $x=1$에서의 미분가능 조건을 연립한다.
    steps:
    - {id: ia, content: '$A-P=4$, $A^2+P^2=40$, $\tfrac A2<1$, $-\tfrac P2>1$ → $P=-6$, $A=-2$, $Q=3$, $B=1$', criteria: ['i.M1', 'i.M2', 'i.A1']}
    hint_ladder:
    - 수평선과 정확히 두 점에서 만나는 높이는 그래프의 어떤 점의 높이인가?
  - id: Si-B
    audience: B
    source_flow: 2026 보고서 문항카드 13 예시답안 p.193-194(인쇄 189-190)
    method_no: 1
    steps:
    - id: ib-1
      content: |
        $x=1$에서 미분가능하므로 다음이 성립한다. $-2+A=2+P$ ⋯ (i)
        $x=1$에서 연속이므로 다음이 성립한다. $-1+A+B=1+P+Q$ ⋯ (ii)
      criteria: ['i.M1']
    - id: ib-2
      content: |
        $y=f(x)$가 $y=t$와 두 점에서 만나기 위한 $t$가 $-6$과 $2$이므로
        $x<1$ 범위에서 $-x^2+Ax+B=-\left(x-\dfrac A2\right)^2+2$이어야 한다. 따라서 $B=2-\dfrac{A^2}{4}$이 성립한다.
        $x>1$ 범위에서 $x^2+Px+Q=\left(x+\dfrac P2\right)^2-6$이어야 한다. 따라서 $Q=\dfrac{P^2}{4}-6$이 성립한다. 또한 극대점이 $x<1$에서, 극소점이 $x\ge1$에서 존재하려면 $\dfrac A2<1$과 $-\dfrac P2>1$이 성립하여야 한다.
      criteria: ['i.M2']
    - id: ib-3
      content: |
        얻어낸 두 관계식을 위의 식 (ii)에 대입하면 $A-\dfrac{A^2}{4}+2-1=1+P+\dfrac{P^2}{4}-6$이 성립한다. 즉, $A-P-\dfrac{A^2}{4}-\dfrac{P^2}{4}=-6$이다.
        위의 식 (i)의 $A-P=4$ 관계식을 대입하면 $A^2+P^2=40$이 성립한다. 두 식을 통해 $P^2+8P+16+P^2=40$이 되고, 정리하면 $P^2+4P-12=0$이다. $(P+6)(P-2)=0$인데, 이 중 음수인 $P$를 택하면 $P=-6$이다. 이를 대입하여 $A=-2$임을 알 수 있고, 위 관계식에 대입하여 $Q=3$과 $B=1$을 얻는다.
      criteria: ['i.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: i.M1
      mark_type: M
      points: 3
      evidence: |
        $x=1$에서 미분가능·연속 조건 $-2+A=2+P$, $-1+A+B=1+P+Q$를 세웠다.
      depends_on: []
      implied_ok: false
      steps: [ib-1]
    - id: i.M2
      mark_type: M
      points: 3
      evidence: |
        꼭짓점 높이 조건 $B=2-\dfrac{A^2}{4}$, $Q=\dfrac{P^2}{4}-6$과 꼭짓점 위치 조건 $\dfrac A2<1$, $-\dfrac P2>1$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [ib-2]
    - id: i.A1
      mark_type: A
      points: 4
      evidence: |
        연립해 $A=-2$, $B=1$, $P=-6$, $Q=3$을 얻고 $P=2$를 배제했다.
      depends_on: [i.M1, i.M2]
      steps: [ib-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'ii'
  stem: |
    <제시문2>에서 실수 $a,b,c,p,q$의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'a=-9/2; b=-6; c=-1; p=-19/2; q=-1', equivalents: [], tolerance: null}
  solutions:
  - id: Sii-A
    audience: A
    method_no: 1
    key_idea: 연속 $c=q$, 극소 $g'(-2)=0$, 조건 (3)에서 극솟값 $g(-2)=1$, (4)(5)를 연립한다.
    steps:
    - {id: iia, content: '$4a-b=-12$, $8+4a-2b+c=1$, $p+q=-\tfrac{21}2$, $a+b=-\tfrac{21}2$ → $a=-\tfrac92$, $b=-6$, $c=q=-1$, $p=-\tfrac{19}2$', criteria: ['ii.M1', 'ii.M2', 'ii.A1']}
    hint_ladder:
    - 네 점에서 만나는 $m$의 하한 $1$은 그래프의 어떤 값인가?
  - id: Sii-B
    audience: B
    source_flow: 2026 보고서 문항카드 13 예시답안 p.194(인쇄 190)
    method_no: 1
    steps:
    - id: iib-1
      content: |
        점 $x=0$에서 연속이므로 $c=q$가 성립한다.
        $x=-2$에서 극소가 되므로 $g'(-2)=0$이다. $g'(x)=-3x^2+2ax+b$이므로 $-12-4a+b=0$이다.
      criteria: ['ii.M1']
    - id: iib-2
      content: |
        (3)에서 그래프 개형을 통해 극솟값이 1이 되어야함을 알 수 있다. 따라서 $1=g(-2)=8+4a-2b+c$이 성립한다.
      criteria: ['ii.M2']
    - id: iib-3
      content: |
        (5)에서 $1+p+q=-\dfrac{19}{2}$이 된다. 즉 $p+q=-\dfrac{21}{2}$가 되고 $c=q$임을 활용하고 (4)의 식과 합치면 $a+b=-\dfrac{21}{2}$이다.
        앞에서 구한 $4a-b=-12$와 연립하여 풀면 $5a=-\dfrac{21}{2}-12=-\dfrac{45}{2}$이 돼서 $a=-\dfrac92$이다. 이를 앞의 식 $a+b=-\dfrac{21}{2}$에 대입하면 $b=-6$이 된다.
        이제 $8+4a-2b+c=1$이 대입하면, $c=-1$가 됨을 알 수 있다. 따라서 $q=-1$이고 $p=-\dfrac{19}{2}$이다.
      criteria: ['ii.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: ii.M1
      mark_type: M
      points: 3
      evidence: |
        $c=q$와 $g'(-2)=0$, 즉 $-12-4a+b=0$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [iib-1]
    - id: ii.M2
      mark_type: M
      points: 3
      evidence: |
        조건 (3)에서 극솟값 $g(-2)=1$임을 근거와 함께 세웠다.
      depends_on: []
      implied_ok: false
      steps: [iib-2]
    - id: ii.A1
      mark_type: A
      points: 4
      evidence: |
        (4)(5)와 연립해 $a=-\dfrac92$, $b=-6$, $c=-1$, $p=-\dfrac{19}2$, $q=-1$을 얻었다.
      depends_on: [ii.M1, ii.M2]
      steps: [iib-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'iii'
  stem: |
    <제시문2>에서 실수 $\beta$의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: ['ii']
  answer: {kind: value, value: '3/2', equivalents: [], tolerance: null}
  solutions:
  - id: Siii-A
    audience: A
    method_no: 1
    key_idea: $x<0$에서 $g$의 극댓값이 $\beta$이다.
    steps:
    - {id: iiia, content: '$g''(x)=-3(x+1)(x+2)$, 극댓값 $g(-1)=\tfrac32$', criteria: ['iii.M1', 'iii.A1']}
    hint_ladder:
    - 네 점에서 만나려면 $y=m$이 극솟값과 극댓값 사이에 있어야 한다.
  - id: Siii-B
    audience: B
    source_flow: 2026 보고서 문항카드 13 예시답안 p.194(인쇄 190)
    method_no: 1
    steps:
    - id: iiib-1
      content: |
        앞에서 $x<0$ 범위에서 $g(x)=-x^3-\dfrac92x^2-6x-1$임을 확인하였다. $g'(x)=-3x^2-9x-6$이므로 $g'(x)=0$이 될 때를 구하면 $x^2+3x+2=0$에서 $x=-2$와 $x=-1$이다.
      criteria: ['iii.M1']
    - id: iiib-2
      content: |
        따라서 $x=-1$에서 극댓값 $g(-1)=1-\dfrac92+6-1=\dfrac32$를 갖는다. (3)의 정보와 그래프 개형을 통해 $\beta=\dfrac32$임을 알 수 있다.
      criteria: ['iii.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: iii.M1
      mark_type: M
      points: 5
      evidence: |
        $g'(x)=-3x^2-9x-6=0$에서 $x=-2,-1$을 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [ii.A1], max_points: 5}
      steps: [iiib-1]
    - id: iii.A1
      mark_type: A
      points: 5
      evidence: |
        극댓값 $g(-1)=\dfrac32$를 구하고 그래프 개형으로 $\beta=\dfrac32$임을 밝혔다.
      depends_on: [iii.M1]
      steps: [iiib-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

