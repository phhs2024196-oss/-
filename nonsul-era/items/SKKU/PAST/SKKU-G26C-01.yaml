  (ⅰ) $y=m$과 두 점에서만 만나는 $m$이 $-6$, $2$뿐이므로 왼쪽 포물선의 꼭짓점 $y$값이 $2$, 오른쪽 포물선의 꼭짓점 $y$값이 $-6$이다. (ⅱ) 네 점에서 만나는 $m$의 하한 $1$은 극솟값 $g(-2)$이다.
