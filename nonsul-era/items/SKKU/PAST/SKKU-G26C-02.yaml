stimuli:
- id: S1
  label: <제시문1>
  body: |
    한 원 위에 세 점 $\mathrm A,\mathrm B,\mathrm D_1$이 시계 반대 방향으로 놓여져 있고, $0<\theta<\dfrac\pi4$인 $\theta$에 대하여, $\angle\mathrm{BAD_1}=2\theta$이다. 각 $\mathrm{BAD_1}$의 이등분선이 원과 만나는 점 중에서 점 $\mathrm A$가 아닌 점을 점 $\mathrm C_1$이라고 하자.
- id: S2
  label: <제시문2>
  body: |
    <제시문1>의 삼각형 $\mathrm{ABD_1}$을 생각하자. 그림과 같이 2 이상의 자연수 $n$에 대하여 직선 $\mathrm{AB}$와 직선 $\mathrm C_{n-1}\mathrm D_{n-1}$이 서로 평행이 아닐 때, 두 점 $\mathrm C_n$과 $\mathrm D_n$을 다음과 같이 귀납적으로 정의하자. 점 $\mathrm B$를 지나고 직선 $\mathrm C_{n-1}\mathrm D_{n-1}$과 평행한 직선이 직선 $\mathrm{AD_1}$과 만나는 점을 점 $\mathrm D_n$이라 하고, 각 $\mathrm{BAD}_n$의 이등분선이 삼각형 $\mathrm{ABD}_n$의 외접원과 만나는 점 중에서 점 $\mathrm A$가 아닌 점을 점 $\mathrm C_n$으로 정의한다.

    [그림: 위쪽 꼭짓점 A에서 아래로 그은 각의 이등분선(양쪽 각 $\theta$, $\theta$) 위에 $\mathrm C_2$, $\mathrm C_1$이 차례로 있음. 왼쪽에 B, 오른쪽 아래에 $\mathrm D_1$, 선분 $\mathrm{AD_1}$ 위에 $\mathrm D_2$. 삼각형 $\mathrm{ABD_1}$의 외접원(큰 원)과 삼각형 $\mathrm{ABD_2}$의 외접원(작은 원)이 그려져 있고, 선분 $\mathrm{BD_2}$는 $\mathrm{C_1D_1}$과 평행, $\mathrm{C_2D_2}$와 $\mathrm{C_1D_1}$이 표시됨.]

stem: |
  다음 <제시문1>과 <제시문2>를 읽고 [문제2-ⅰ] ~ [문제2-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: 'i'
  stem: |
    <제시문1>에서 $\overline{\mathrm{AB}}:\overline{\mathrm{AD_1}}=m:1$이라고 하자. 선분 $\mathrm{AB}$와 선분 $\mathrm{C_1D_1}$이 서로 평행일 때, $m$과 $\theta$의 관계식을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'sin(3*theta)/sin(theta)', equivalents: ['3-4*sin(theta)**2'], tolerance: null}
  solutions:
  - id: Si-A
    audience: A
    method_no: 1
    key_idea: 평행이면 $\angle\mathrm{AC_1D_1}=\theta$, 원주각으로 $\angle\mathrm{ABD_1}=\angle\mathrm{BD_1C_1}=\theta$ 등을 모아 $\alpha=\angle\mathrm{AD_1B}$에 대해 $\sin\alpha=\sin3\theta$.
    steps:
    - {id: ia, content: '사인법칙 $\tfrac{m}{\sin3\theta}=\tfrac1{\sin\theta}\Rightarrow\sin3\theta=m\sin\theta$', criteria: ['i.M1', 'i.A1']}
    hint_ladder:
    - 평행선이 만드는 엇각과 같은 호에 대한 원주각을 찾아보자.
  - id: Si-B
    audience: B
    source_flow: 2026 보고서 문항카드 14 예시답안 p.197(인쇄 193)
    method_no: 1
    steps:
    - id: ib-1
      content: |
        주어진 조건으로부터 선분 $\mathrm{AB}$와 선분 $\mathrm{C_1D_1}$이 서로 평행하므로, 각 $\mathrm{AC_1D_1}$과 각 $\mathrm{BAC_1}$은 엇각으로 같게 되어 크기가 $\theta$가 된다. 각 $\mathrm{AC_1D_1}$과 각 $\mathrm{ABD_1}$은 호 $\mathrm{AD_1}$에 대한 원주각으로 서로 같게 되므로, 크기가 $\theta$가 된다. 또한 $\angle\mathrm{C_1AD_1}=\theta$이므로, 호 $\mathrm{C_1D_1}$에 대한 원주각인 각 $\mathrm{C_1BD_1}$의 크기도 $\theta$가 된다. 마찬가지로 $\angle\mathrm{BAC_1}=\theta$이므로, 호 $\mathrm{BC_1}$에 대한 원주각인 각 $\mathrm{BD_1C_1}$의 크기도 $\theta$가 된다.
      criteria: ['i.M1']
    - id: ib-2
      content: |
        사각형 $\mathrm{ABC_1D_1}$이 원에 내접하므로, $\angle\mathrm{ABC_1}+\angle\mathrm{AD_1C_1}=2\theta+(\theta+\alpha)=\pi$가 성립한다. 여기서 $\alpha=\angle\mathrm{AD_1B}$이다. 따라서 $\sin\alpha=\sin(3\theta)$임을 알 수 있다. 이제 삼각형 $\mathrm{ABD_1}$에 사인법칙을 적용하면, $\dfrac{\overline{\mathrm{AB}}}{\sin\alpha}=\dfrac{\overline{\mathrm{AD_1}}}{\sin\theta}$이므로, $\dfrac{m}{\sin(3\theta)}=\dfrac{1}{\sin\theta}$가 되어 $\sin(3\theta)=m\sin\theta$를 얻는다.
        답: $\sin(3\theta)=m\sin\theta$
      criteria: ['i.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: i.M1
      mark_type: M
      points: 5
      evidence: |
        엇각·원주각으로 $\angle\mathrm{ABD_1}=\theta$, $\angle\mathrm{C_1BD_1}=\angle\mathrm{BD_1C_1}=\theta$ 등을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [ib-1]
    - id: i.A1
      mark_type: A
      points: 5
      evidence: |
        내접사각형 조건으로 $\sin\alpha=\sin3\theta$를 얻고 사인법칙으로 $\sin3\theta=m\sin\theta$를 이끌었다.
      depends_on: [i.M1]
      steps: [ib-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'ii'
  stem: |
    <제시문2>에서 $\overline{\mathrm{AB}}=\overline{\mathrm{AD_1}}=2$이고, 직선 $\mathrm{AB}$와 직선 $\mathrm{C_1D_1}$의 교점을 점 $\mathrm P$라고 하자. 이때 $\overline{\mathrm{AP}}$를 $\tan\theta$에 관한 식으로 표현하고, 그 이유를 논하시오.
  points: 5
  depends_on: []
  answer: {kind: expression, value: '2*(1+tan(theta)**2)/(1-tan(theta)**2)', equivalents: [], tolerance: null}
  solutions:
  - id: Sii-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{AC_1}$이 지름이 되어 $\mathrm{C_1D_1}=2\tan\theta$, 이등분선 내분비와 할선 정리로 $(x-2)x=xt(x+2)t$.
    steps:
    - {id: iia, content: '$x=\overline{\mathrm{AP}}=\tfrac{2(1+t^2)}{1-t^2}$, $t=\tan\theta$', criteria: ['ii.M1', 'ii.A1']}
    hint_ladder:
    - $\triangle\mathrm{ABC_1}$과 $\triangle\mathrm{AD_1C_1}$은 어떤 관계인가?
  - id: Sii-B
    audience: B
    source_flow: 2026 보고서 문항카드 14 예시답안 p.198(인쇄 194)
    method_no: 1
    steps:
    - id: iib-1
      content: |
        주어진 조건으로부터 삼각형 $\mathrm{ABC_1}$은 삼각형 $\mathrm{AD_1C_1}$과 서로 합동이 된다. 따라서 $\angle\mathrm{ABC_1}=\angle\mathrm{AD_1C_1}$이고, 사각형 $\mathrm{ABC_1D_1}$이 원에 내접하므로, $\angle\mathrm{ABC_1}+\angle\mathrm{AD_1C_1}=\pi$이다. 이로부터 $\angle\mathrm{ABC_1}=\angle\mathrm{AD_1C_1}=\dfrac\pi2$임을 알 수 있다. 따라서 삼각형 $\mathrm{ABC_1}$은 삼각형 $\mathrm{AD_1C_1}$과 서로 합동인 직각삼각형이다. 이로부터 $\overline{\mathrm{C_1D_1}}=2\tan\theta$를 얻는다.
      criteria: ['ii.M1']
    - id: iib-2
      content: |
        $x=\overline{\mathrm{AP}}$, $t=\tan\theta$라고 두자. 삼각형 $\mathrm{APD_1}$에서 각 $\mathrm{PAD_1}$의 이등분선과 선분 $\mathrm{PD_1}$의 교점이 $\mathrm C_1$이므로, $\overline{\mathrm{PC_1}}:\overline{\mathrm{C_1D_1}}=\overline{\mathrm{AP}}:\overline{\mathrm{AD_1}}=x:2$가 성립하고 $\overline{\mathrm{C_1D_1}}=2t$이므로 $\overline{\mathrm{PC_1}}=xt$가 된다. 이제 점 $\mathrm P$로부터 원에 그은 할선들의 길이 사이의 관계로부터, $(x-2)\cdot x=xt\cdot(x+2)t$이므로, $x=\dfrac{2(1+t^2)}{1-t^2}$을 얻는다. 따라서 $\overline{\mathrm{AP}}=\dfrac{2(1+\tan^2\theta)}{1-\tan^2\theta}$이다.
      criteria: ['ii.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: ii.M1
      mark_type: M
      points: 2
      evidence: |
        합동·내접사각형으로 직각을 보이고 $\overline{\mathrm{C_1D_1}}=2\tan\theta$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [iib-1]
    - id: ii.A1
      mark_type: A
      points: 3
      evidence: |
        이등분선 내분비와 할선 관계 $(x-2)x=xt(x+2)t$로 $\overline{\mathrm{AP}}=\dfrac{2(1+\tan^2\theta)}{1-\tan^2\theta}$를 얻었다.
      depends_on: [ii.M1]
      steps: [iib-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'iii'
  stem: |
    <제시문2>에서 $\overline{\mathrm{AB}}=2$, $\overline{\mathrm{AD_1}}=3$이고 $\theta=\dfrac\pi6$이라고 하자. 이때 $\angle\mathrm{BAD}_n=\dfrac23\pi$가 되는 자연수 $n$의 최솟값과 그때 $\overline{\mathrm{AD}_{n-1}}$의 값을 구하고 그 이유를 논하시오.
  points: 15
  depends_on: ['i', 'ii']
  answer: {kind: expression, value: 'n=4; AD=2/3', equivalents: [], tolerance: null}
  solutions:
  - id: Siii-A
    audience: A
    method_no: 1
    key_idea: $\theta=\tfrac\pi6$이면 (ⅰ)에서 평행 조건은 $\mathrm{AB}:\mathrm{AD}_n=2:1$. $\mathrm{AD}_n$을 할선 정리·닮음으로 $3\to\tfrac85\to\tfrac23$ 순서로 구하면 $\mathrm{AD_3}<1$이 되어 $\mathrm D_4$는 $\mathrm A$의 반대편에 놓인다.
    steps:
    - {id: iiia, content: '$\mathrm{AP_1}=\tfrac{15}4$, $\mathrm{AD_2}=\tfrac85$, $\mathrm{AP_2}=\tfrac{24}5$, $\mathrm{AD_3}=\tfrac23$ → $n=4$, $\overline{\mathrm{AD_3}}=\tfrac23$', criteria: ['iii.M1', 'iii.A1', 'iii.A2', 'iii.R1']}
    hint_ladder:
    - (ⅰ)에서 $\theta=\tfrac\pi6$이면 $m$은 얼마인가?
    - $\mathrm{AB}:\mathrm{AD}_n$이 $2:1$보다 크고 작음에 따라 $\mathrm D_{n+1}$은 어느 쪽으로 가는가?
  - id: Siii-B
    audience: B
    source_flow: 2026 보고서 문항카드 14 예시답안 p.198-199(인쇄 194-195)
    method_no: 1
    steps:
    - id: iiib-1
      content: |
        문제에 주어진 점들을 좌표평면에서 잡고 직선 $\mathrm{AB}$의 기울기가 양수인 경우를 생각하자. [문제 2-ⅰ]의 결과로부터 $\overline{\mathrm{AB}}:\overline{\mathrm{AD}_n}=2:1$인 경우에 선분 $\mathrm{AB}$와 선분 $\mathrm C_n\mathrm D_n$이 서로 평행하게 됨을 주목하자. $\overline{\mathrm{AB}}:\overline{\mathrm{AD_1}}=\dfrac23:1$이므로 선분 $\mathrm{AB}$의 기울기는 선분 $\mathrm{C_1D_1}$의 기울기보다 더 큼을 알 수 있다.
        [그림(보고서): A에서의 이등분선 위의 $\mathrm C_1,\mathrm C_2,\mathrm C_3$, 선분 $\mathrm{AD_1}$ 위의 $\mathrm D_1,\mathrm D_2,\mathrm D_3$, 직선 AB 연장선 위의 $\mathrm P_1,\mathrm P_2$와 세 외접원]
      criteria: ['iii.M1']
    - id: iiib-2
      content: |
        점 $\mathrm P_1$을 직선 $\mathrm{AB}$와 직선 $\mathrm{C_1D_1}$의 교점으로 놓고, 선분 $\mathrm{AP_1}$의 길이를 $x$라고 하자. 삼각형 $\mathrm{AP_1D_1}$에 코사인법칙을 적용하면, $\overline{\mathrm{P_1D_1}}=\sqrt{x^2-3x+9}$를 얻는다. 점 $\mathrm C_1$은 선분 $\mathrm{P_1D_1}$을 $x:3$으로 내분하는 점이므로, $\overline{\mathrm{P_1C_1}}=\sqrt{x^2-3x+9}\cdot\dfrac{x}{x+3}$이다. 이제 점 $\mathrm P_1$으로부터 삼각형 $\mathrm{ABD_1}$의 외접원에 그은 할선들의 길이 사이의 관계로부터, $(x-2)\cdot x=\sqrt{x^2-3x+9}\cdot\dfrac{x}{x+3}\cdot\sqrt{x^2-3x+9}$이므로 이를 정리하면, $x=\dfrac{15}{4}$를 얻는다. 삼각형 $\mathrm{ABD_2}$와 삼각형 $\mathrm{AP_1D_1}$이 서로 닮아 있으므로, 비례식 $\overline{\mathrm{AD_2}}:3=2:\dfrac{15}{4}$가 성립하고, 이로부터 $\overline{\mathrm{AD_2}}=\dfrac85$를 얻는다.
      criteria: ['iii.A1']
    - id: iiib-3
      content: |
        이제 $\overline{\mathrm{AB}}:\overline{\mathrm{AD_2}}=1.25:1$이므로 선분 $\mathrm{AB}$의 기울기는 선분 $\mathrm{C_2D_2}$의 기울기보다 더 큼을 알 수 있다. 이제 점 $\mathrm P_2$를 직선 $\mathrm{AB}$와 직선 $\mathrm{C_2D_2}$의 교점으로 놓고, 선분 $\mathrm{AP_2}$의 길이를 $t$라고 하자. 삼각형 $\mathrm{AP_2D_2}$에 코사인법칙을 적용하면, $\overline{\mathrm{P_2D_2}}=\dfrac{\sqrt{25t^2-40t+64}}{5}$를 얻는다. 점 $\mathrm C_2$는 선분 $\mathrm{P_2D_2}$를 $t:\dfrac85$로 내분하는 점이므로, $\overline{\mathrm{P_2C_2}}=\dfrac{\sqrt{25t^2-40t+64}}{5}\cdot\dfrac{t}{t+1.6}$이다. 이제 점 $\mathrm P_2$로부터 삼각형 $\mathrm{ABD_2}$의 외접원에 그은 할선들의 길이 사이의 관계로부터, $t=\dfrac{24}{5}$를 얻는다. 삼각형 $\mathrm{ABD_3}$과 삼각형 $\mathrm{AP_2D_2}$가 서로 닮아있으므로, 비례식 $\overline{\mathrm{AD_3}}:\dfrac85=2:\dfrac{24}{5}$가 성립하고, 이로부터 $\overline{\mathrm{AD_3}}=\dfrac23$을 얻는다.
      criteria: ['iii.A2']
    - id: iiib-4
      content: |
        이제 $\overline{\mathrm{AB}}:\overline{\mathrm{AD_3}}=3:1$이므로 선분 $\mathrm{AB}$의 기울기는 선분 $\mathrm{C_3D_3}$의 기울기보다 더 작아짐을 알 수 있다. 따라서 직선 $\mathrm{AD_1}$ 위에 점 $\mathrm D_4$와 점 $\mathrm D_3$ 사이에 점 $\mathrm A$가 위치하게 된다. 따라서 $\angle\mathrm{BAD}_n=\dfrac{2\pi}{3}$가 되는 자연수 $n$의 최솟값은 4이고 그때 $\overline{\mathrm{AD_3}}=\dfrac23$이다.
        답: $\angle\mathrm{BAD}_n=\dfrac{2\pi}{3}$가 되는 자연수 $n$의 최솟값: 4, $\overline{\mathrm{AD_3}}=\dfrac23$
      criteria: ['iii.R1']
