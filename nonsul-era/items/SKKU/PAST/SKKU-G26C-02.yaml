intent: |
  문제의 기하학적 정보를 파악해 수식화한 후 다양한 수학적 이론으로 필요한 정보를 얻어 내는지 평가한다. 삼각형의 외접원과 한 내각의 이등분선 등 기하학적 요소들을 제대로 이해하고 사인법칙, 코사인법칙 등을 활용하여 해결할 수 있는지 본다(보고서 출제 의도 요약).
key_idea: |
  $\mathrm{AB}\parallel\mathrm{C_1D_1}$이면 원주각으로 $\angle\mathrm{AD_1B}=\pi-3\theta$이 되어 사인법칙에서 $\sin3\theta=m\sin\theta$. (ⅱ)는 $\triangle\mathrm{ABC_1}\equiv\triangle\mathrm{AD_1C_1}$(직각)과 각의 이등분선 성질·할선 정리, (ⅲ)은 (ⅰ)에서 $\theta=\tfrac\pi6$일 때 평행 조건 $\mathrm{AB}:\mathrm{AD}_n=2:1$과 비교해 $\mathrm D_n$의 이동 방향을 판정한다.
stuck: |
  (ⅰ) 평행에서 엇각·원주각으로 $\angle\mathrm{AD_1B}$를 $\theta$로 나타내는 것, (ⅲ) 귀납적으로 정의된 $\mathrm D_n$을 닮음과 할선 정리로 차례로 구하고 $\mathrm{AB}:\mathrm{AD}_n$이 $2:1$을 넘는 순간을 찾는 것
