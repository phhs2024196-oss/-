stimuli:
- id: S1
  label: <제시문1>
  body: |
    함수 $f(x)$에서 $x$의 값이 $a$보다 크면서 $a$에 한없이 가까워질 때, $f(x)$의 값이 일정한 값 $L$에 한없이 가까워지는 것을 기호로 $\displaystyle\lim_{x\to a+}f(x)=L$과 같이 나타내고, $L$을 함수 $f(x)$의 $x=a$에서의 우극한이라고 한다.
    또한, 함수 $f(x)$에서 $x$의 값이 $a$보다 작으면서 $a$에 한없이 가까워질 때, $f(x)$의 값이 일정한 값 $M$에 한없이 가까워지는 것을 기호로 $\displaystyle\lim_{x\to a-}f(x)=M$과 같이 나타내고, $M$을 함수 $f(x)$의 $x=a$에서의 좌극한이라고 한다.
- id: S2
  label: <제시문2>
  body: |
    주어진 실수 $x$에 대하여, 집합 $\{1,2,3\}$에서 서로 다른 세 수 $a,b,c$를 선택하여 $(x^2-ax+b)(x-c)$의 값이 최대가 되도록 하고 이 최댓값을 $g(x)$로 정의한다. 이 경우 함수 $g(x)$는 모든 실수 $x$에서 연속이 된다.
    예를 들어, $x=1$이면 $(1-a+b)(1-c)$의 값은 $(a,b,c)=(3,1,2)$일 경우 최대이고 $g(1)=1$이다. $x=0$이면 $b(-c)$의 값은 $(a,b,c)=(3,1,2)$ 또는 $(a,b,c)=(3,2,1)$일 경우 최대이고 $g(0)=-2$이다.
- id: S3
  label: <제시문3>
  body: |
    실수 $r$에 대하여 좌표평면 위의 정사각형 $\mathrm{ABCD}$의 한변의 길이는 12이고 네 꼭짓점은 다음과 같다.
    $$\mathrm A(-2,r),\ \mathrm B(-2,r+12),\ \mathrm C(-14,r+12),\ \mathrm D(-14,r)$$

stem: |
  다음 <제시문1> ~ <제시문3>을 읽고 [문제3-ⅰ] ~ [문제3-ⅲ]을 문항별로 풀이와 함께 답하시오. (40점)

subparts:
- id: 'i'
  stem: |
    <제시문2>의 함수 $g(x)$에 대하여 정적분 $\displaystyle\int_{-1}^{1}g(x)\,dx$의 값을 구하고 그 이유를 논하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-6', equivalents: [], tolerance: null}
  solutions:
  - id: Si-A
    audience: A
    method_no: 1
    key_idea: 후보는 $P=(x^2-3x+1)(x-2)$, $Q=(x^2-3x+2)(x-1)$, $R=(x^2-2x+3)(x-1)$이고, 차가 이차식이므로 이차부등식으로 최댓값 구간을 정한다.
    steps:
    - {id: ia, content: '$[-1,0]$에서 $g=Q$, $[0,1]$에서 $g=P$ → $\int_{-1}^0Q+\int_0^1P=-6$', criteria: ['i.M1', 'i.A1', 'i.A2']}
    hint_ladder:
    - $x^3$항은 공통이다. 나머지 항을 비교해 보자.
  - id: Si-B
    audience: B
    source_flow: 2026 보고서 문항카드 15 예시답안 p.203(인쇄 199)
    method_no: 1
    steps:
    - id: ib-1
      content: |
        실수 $x$와 $b>0$가 고정되었을 경우 $x^3-ax^2-cx^2+bx+acx-bc=\{x^3+bx+acx-(a+c)x^2\}-bc$가 최댓값을 가지려면, $x^3+bx+acx-(a+c)x^2$가 고정된 값이므로 $a>c$가 성립하여야 한다. 이 경우 $(a,b,c)$는 $(3,1,2)$, $(3,2,1)$, $(2,3,1)$ 세 가지 중 하나이다. 따라서 $x$가 주어졌을 때,
        $P(x)=(x^2-3x+1)(x-2)=x^3-5x^2+7x-2$, $Q(x)=(x^2-3x+2)(x-1)=x^3-4x^2+5x-2$, $R(x)=(x^2-2x+3)(x-1)=x^3-3x^2+5x-3$
        중 가장 큰 값이 $g(x)$가 된다.
      criteria: ['i.M1']
    - id: ib-2
      content: |
        세 부등식 $P(x)>Q(x)$, $Q(x)>R(x)$, $P(x)>R(x)$는 모두 이차부등식이 되며, 이를 풀면 각각 $0<x<2$, $-1<x<1$, $\dfrac{1-\sqrt3}{2}<x<\dfrac{1+\sqrt3}{2}$이 된다. 따라서 $P(x)$의 값이 가장 큰 경우는 $0<x<\dfrac{1+\sqrt3}{2}$이고, $Q(x)$의 값이 가장 큰 경우는 $-1<x<0$이고, $R(x)$의 값이 가장 큰 경우는 $x<-1$ 또는 $x>\dfrac{1+\sqrt3}{2}$이다. 함수 $g(x)$가 모든 실수에서 연속임을 고려하여 종합하면
        $$g(x)=\begin{cases}x^3-3x^2+5x-3 & (x\le-1)\\ x^3-4x^2+5x-2 & (-1<x\le0)\\ x^3-5x^2+7x-2 & \left(0<x\le\dfrac{1+\sqrt3}{2}\right)\\ x^3-3x^2+5x-3 & \left(\dfrac{1+\sqrt3}{2}<x\right)\end{cases}$$
        이다.
      criteria: ['i.A1']
    - id: ib-3
      content: |
        그러므로
        $$\int_{-1}^{1}g(x)dx=\int_{-1}^{0}g(x)dx+\int_0^1g(x)dx=\int_{-1}^{0}(x^3-4x^2+5x-2)dx+\int_0^1(x^3-5x^2+7x-2)dx=-6$$
        이다.
      criteria: ['i.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: i.M1
      mark_type: M
      points: 3
      evidence: |
        후보를 $P(x)$, $Q(x)$, $R(x)$ 세 삼차식으로 좁혔다.
      depends_on: []
      implied_ok: false
      steps: [ib-1]
    - id: i.A1
      mark_type: A
      points: 4
      evidence: |
        이차부등식을 풀어 $g(x)$를 구간별로 확정했다.
      depends_on: [i.M1]
      steps: [ib-2]
    - id: i.A2
      mark_type: A
      points: 3
      evidence: |
        $\int_{-1}^{0}Q+\int_0^1P=-6$을 계산했다.
      depends_on: [i.M1, i.A1]
      steps: [ib-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'ii'
  stem: |
    <제시문2>의 함수 $g(x)$가 열린구간 $\left(x_0-\dfrac12,x_0\right)$와 $\left(x_0,x_0+\dfrac12\right)$에서 미분가능하도록 하는 실수 $x_0$에 대하여
    $$\left|\lim_{x\to x_0-}g'(x)-\lim_{x\to x_0+}g'(x)\right|$$
    이 될 수 있는 값을 모두 구하고 그 이유를 논하시오.
  points: 10
  depends_on: ['i']
  answer: {kind: set, value: '{0, 2, 2*sqrt(3)}', equivalents: [], tolerance: null}
  solutions:
  - id: Sii-A
    audience: A
    method_no: 1
    key_idea: 꺾이는 점 $-1$, $0$, $\tfrac{1+\sqrt3}2$에서만 좌·우 도함수 극한이 다르다.
    steps:
    - {id: iia, content: '$x_0=-1$: $2$, $x_0=0$: $2$, $x_0=\tfrac{1+\sqrt3}2$: $2\sqrt3$, 그 외 $0$', criteria: ['ii.M1', 'ii.A1', 'ii.A2']}
    hint_ladder:
    - (ⅰ)에서 구한 $g$의 각 구간에서 도함수를 구하자.
  - id: Sii-B
    audience: B
    source_flow: 2026 보고서 문항카드 15 예시답안 p.204(인쇄 200)
    method_no: 1
    steps:
    - id: iib-1
      content: |
        [문제 3-ⅰ]의 함수 $g(x)$에 대하여
        $$g'(x)=\begin{cases}3x^2-6x+5 & (x<-1)\\ 3x^2-8x+5 & (-1<x<0)\\ 3x^2-10x+7 & \left(0<x<\dfrac{1+\sqrt3}{2}\right)\\ 3x^2-6x+5 & \left(\dfrac{1+\sqrt3}{2}<x\right)\end{cases}$$
        이 성립한다.
      criteria: ['ii.M1']
    - id: iib-2
      content: |
        따라서 $x_0$가 $-1$, $0$, $\dfrac{1+\sqrt3}{2}$ 이외의 값일 경우에는 $\left|\displaystyle\lim_{x\to x_0-}g'(x)-\lim_{x\to x_0+}g'(x)\right|=\lvert g'(x_0)-g'(x_0)\rvert=0$이 된다.
      criteria: ['ii.A1']
    - id: iib-3
      content: |
        또한 $\left|\displaystyle\lim_{x\to-1-}g'(x)-\lim_{x\to-1+}g'(x)\right|=2$, $\left|\displaystyle\lim_{x\to0-}g'(x)-\lim_{x\to0+}g'(x)\right|=2$, $\left|\displaystyle\lim_{x\to\frac{1+\sqrt3}{2}-}g'(x)-\lim_{x\to\frac{1+\sqrt3}{2}+}g'(x)\right|=2\sqrt3$이므로 답은 $0$, $2$, $2\sqrt3$이다.
      criteria: ['ii.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: ii.M1
      mark_type: M
      points: 3
      evidence: |
        $g'(x)$를 구간별로 구했다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [i.A1], max_points: 3}
      steps: [iib-1]
    - id: ii.A1
      mark_type: A
      points: 3
      evidence: |
        꺾이는 점이 아닌 $x_0$에서 값이 $0$임을 밝혔다.
      depends_on: [ii.M1]
      steps: [iib-2]
    - id: ii.A2
      mark_type: A
      points: 4
      evidence: |
        $x_0=-1,0,\dfrac{1+\sqrt3}{2}$에서 각각 $2$, $2$, $2\sqrt3$을 구해 값 $0,2,2\sqrt3$을 모두 답했다.
      depends_on: [ii.M1]
      steps: [iib-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'iii'
  stem: |
    점 $\mathrm Q(x_1,y_1)$은 <제시문2>의 함수 $y=g(x)$의 그래프 위를 움직이고, 점 $\mathrm R(x_2,y_2)$는 <제시문3>의 $r$에 관한 정사각형 $\mathrm{ABCD}$의 네 변 위를 움직인다. 아래의 두 조건 (1), (2)를 모두 만족하는 두 점 $\mathrm Q(x_1,y_1)$과 $\mathrm R(x_2,y_2)$가 존재하면 정사각형 $\mathrm{ABCD}$의 네 변 위에서 점 $\mathrm R(x_2,y_2)$가 놓일 수 있는 부분의 길이를 $k(r)$이라 하고, 그러한 점들이 존재하지 않으면 $k(r)=0$으로 정의한다.

    (1) $0\le x_1\le1$

    (2) $y_1(x_2-1)+y_2(x_1+1)=2(x_1+x_2)$

    이때 $k(r)$의 최댓값을 구하고 그 이유를 논하시오.
  points: 20
  depends_on: ['i']
  answer: {kind: value, value: '309/8', equivalents: [], tolerance: null}
  solutions:
  - id: Siii-A
    audience: A
    method_no: 1
    key_idea: $y$축 대칭한 정사각형 $\mathrm{A'B'C'D'}$ 위의 $\mathrm R'(-x_2,y_2)$는 $\mathrm S(-1,2)$와 곡선 위 $\mathrm Q$를 잇는 직선 위에 있다. 직선 다발은 $y=-4x-2$와 $y=-\tfrac12x+\tfrac32$ 사이를 훑는다.
    steps:
    - {id: iiia, content: '$-\tfrac{35}2\le r\le-10$에서 $k(r)=-\tfrac74r+8$, 최댓값 $k\left(-\tfrac{35}2\right)=\tfrac{309}8$', criteria: ['iii.M1', 'iii.A1', 'iii.M2', 'iii.A2']}
    hint_ladder:
    - 조건 (2)를 두 기울기가 같다는 식으로 바꿔 보자.
    - $x_2$ 대신 $-x_2$를 쓰면 어떤 점을 지나는 직선이 보이는가?
  - id: Siii-B
    audience: B
    source_flow: 2026 보고서 문항카드 15 예시답안 p.204-205(인쇄 200-201)
    method_no: 1
    steps:
    - id: iiib-1
      content: |
        점 $\mathrm Q(x_1,y_1)$가 $0\le x_1\le1$인 경우만 고려되고, [문제 3-ⅰ]에서 $0\le x\le1$인 경우 $g(x)=(x^2-3x+1)(x-2)=x^3-5x^2+7x-2$임을 확인하였다. 정사각형 $\mathrm{ABCD}$를 $y$축에 대칭시킨 정사각형 $\mathrm{A'B'C'D'}$를 고려하자. 그러면 점 $\mathrm R(x_2,y_2)$를 $y$축에 대칭한 점 $\mathrm R'(-x_2,y_2)$는 정사각형 $\mathrm{A'B'C'D'}$의 네 변 위에 놓이게 된다.
      criteria: ['iii.M1']
    - id: iiib-2
      content: |
        주어진 조건 $y_1(x_2-1)+y_2(x_1+1)=2(x_1+x_2)$은 $\dfrac{y_2-2}{-x_2+1}=\dfrac{y_1-2}{x_1+1}$이므로, 세 점 $\mathrm Q(x_1,y_1)$, $\mathrm R'(-x_2,y_2)$, $\mathrm S(-1,2)$가 한 직선 위에 놓이게 됨을 의미한다. 즉, 점 $\mathrm Q(x_1,y_1)$가 $y=g(x)\ (0\le x\le1)$의 그래프 위를 움직일 때, 두 점 $\mathrm Q(x_1,y_1)$와 $\mathrm S(-1,2)$를 지나는 직선 $l$이 정사각형 $\mathrm{A'B'C'D'}$와 만날 때의 교점이 $\mathrm R'(-x_2,y_2)$가 된다. 따라서 실수 $r$이 고정되었을 때 모든 $\mathrm Q(x_1,y_1)$에 대하여 직선 $l$과 정사각형 $\mathrm{A'B'C'D'}$가 만나지 않을 경우 $k(r)=0$이고, 그렇지 않을 경우 정사각형 $\mathrm{A'B'C'D'}$의 네 변 위에서 점 $\mathrm R'(-x_2,y_2)$가 놓일 수 있는 부분의 길이가 $k(r)$이 된다.
        [그림(보고서): 곡선 $g(x)=x^3-5x^2+7x-2$ 위의 $(0,-2)$, $(1,1)$, 점 $\mathrm S(-1,2)$, 직선 $y=-4x-2$와 $y=-\tfrac12x+\tfrac32$, 정사각형 $\mathrm{A'B'C'D'}$와 그 위의 빨간 선(점 $\mathrm R'$가 놓일 수 있는 부분), 수평선 $y=-\tfrac{11}2$, $y=-10$]
      criteria: ['iii.A1']
    - id: iiib-3
      content: |
        $r$의 값에 따라 정사각형 $\mathrm{A'B'C'D'}$는 두 직선 $x=2$와 $x=14$ 사이에서 위 아래로 움직일 수 있으므로, $k(r)$이 최댓값이 되기 위해선
        1. 점 $\mathrm A'$가 직선 $y=-4x-2$보다 위에 위치하면 안되고
        2. 점 $\mathrm C'$가 직선 $y=-\dfrac12x+\dfrac32$보다 밑에 위치하면 안된다.
        이를 고려하면 $r\le-10$과 $r+12\ge-\dfrac{11}{2}$이 성립해야 하고, 따라서 $-\dfrac{35}{2}\le r\le-10$ 범위에서 $k(r)$의 최댓값이 가능하다.
      criteria: ['iii.M2']
    - id: iiib-4
      content: |
        이때
        $$k(r)=\left(14+\dfrac{r+2}{4}\right)+\left(-\dfrac{11}{2}-r\right)+(-2r-23)+(r+22)=-\dfrac74r+8$$
        이므로 $-\dfrac{35}{2}\le r\le-10$ 범위에서 $k\left(-\dfrac{35}{2}\right)=\dfrac{245}{8}+8=\dfrac{309}{8}$이 최댓값이 된다.
      criteria: ['iii.A2']
