intent: |
  이차부등식을 제대로 풀고 이를 활용해 함수의 그래프에 관한 정보를 올바르게 분석하는지, 함수의 좌극한·우극한의 정의를 정확하게 이해하고 구하는지, 주어진 식의 기하학적 의미를 올바르게 파악하고 이를 활용하여 상황에 맞게 해결하는지 평가한다(보고서 출제 의도 요약).
key_idea: |
  $g$는 세 삼차식 $P(x)$, $Q(x)$, $R(x)$ 중 최댓값이고, 두 식의 차가 이차식이므로 이차부등식으로 구간을 나눈다. 조건 (2)는 세 점 $\mathrm Q(x_1,y_1)$, $\mathrm R'(-x_2,y_2)$, $\mathrm S(-1,2)$가 한 직선 위에 있다는 뜻이다.
stuck: |
  최댓값 함수 $g$를 이차부등식으로 구간별로 확정하는 것, 그리고 조건 (2)를 기울기 등식으로 바꿔 $y$축 대칭한 정사각형과 점 $\mathrm S(-1,2)$를 지나는 직선 다발로 해석하는 것
idea_tags: [IDEA-MAX-OF-FUNCTIONS-PIECEWISE, IDEA-CONDITION-AS-COLLINEARITY, IDEA-LINE-PENCIL-SWEEP]
