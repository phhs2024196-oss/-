intent: |
  이차방정식의 근과 계수의 관계를 통해 귀납적으로 특정 수열을 정의한 뒤, 이 수열로부터 파생되는 다양한 주제의 문제를 해결할 수 있는 능력을 평가한다. 수학적 귀납법, 경우의 수, 이차방정식의 근과 계수의 관계를 이해하면 해결할 수 있으며 합의 기호를 포함한다(2023 모의논술 해설지 개요 및 주요 평가항목 요약).
key_idea: |
  $\alpha+\beta=-a$, $\alpha\beta=-b$이므로 $-af_{n+1}+bf_n=(\alpha+\beta)f_{n+1}-\alpha\beta f_n=f_{n+2}$. 명제를 "$f_n$과 $f_{n+1}$이 정수"로 잡아 두 항씩 귀납한다.
stuck: |
  (ⅱ)에서 한 항만이 아니라 연속한 두 항 $f_n,f_{n+1}$을 함께 명제로 설정해야 점화식으로 귀납 단계가 이어진다는 점
