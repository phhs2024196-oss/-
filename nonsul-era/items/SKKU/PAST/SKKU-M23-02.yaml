intent: |
  특정한 정수의 곱과 합으로 정의되는 집합의 원소들을 등차수열의 항으로 이해한 다음, 다양한 종류의 합과 이와 관련한 현상들을 탐구하는 능력을 평가한다. 집합과 명제, 등차수열과 여러 가지 수열의 합을 이해하면 해결할 수 있으며 자연수에 대한 기본적인 이해와 등차수열의 합을 포함한다(2023 모의논술 해설지 개요 및 주요 평가항목 요약).
key_idea: |
  $3x+2=5(3a-5b)$이므로 $x=5k+1$이고, $3k+1$ 꼴의 수는 $(a,b)=(2,1)$의 배수 조합으로 언제나 $3a-5b$ 꼴이 되므로 $S=\{1,6,11,\dots\}$, $a_n=5n-4$.
stuck: |
  (ⅰ)에서 $5k+1$ 꼴의 모든 음이 아닌 정수가 실제로 $S$에 속함(음이 아닌 $a,b$로 $3a-5b=3k+1$을 만들 수 있음)을 확인하는 단계
