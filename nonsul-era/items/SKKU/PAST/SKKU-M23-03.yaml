intent: |
  절댓값이 포함된 합성함수의 극대, 극소와 정적분 계산을, 적절한 대칭성을 활용하여 구할 수 있는 능력을 평가한다. 도형의 이동, 함수의 극대와 극소, 다항함수의 정적분을 이해하면 해결할 수 있으며 절댓값과 합성함수에 대한 기본적인 내용을 포함한다(2023 모의논술 해설지 개요 및 주요 평가항목 요약).
key_idea: |
  $f$는 기함수, $g$는 우함수이므로 $h=g\circ f$는 우함수. $x\ge0$에서 $f$는 $[0,1]$에서 $x$, $[1,2]$에서 $-x+2$, $[2,\infty)$에서 $x-2$이므로 $h$는 $g$의 $[0,1]$ 부분을 $x=1$ 대칭·평행이동한 것.
stuck: |
  $h(-x)=g(-f(x))=g(f(x))$로 우함수임을 보고, $[0,2]$에서 $x=1$에 대한 대칭까지 찾아 극점과 적분을 $[0,1]$로 환원하는 발상
