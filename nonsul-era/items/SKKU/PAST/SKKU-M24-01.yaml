intent: |
  곡선 위의 한 점에서 그은 접선의 방정식을 미분을 활용하여 구하고, 곡선 또는 직선으로 둘러싸인 도형의 넓이를 적분을 활용하여 구할 수 있는 능력을 평가한다(해설지 「개요 및 주요 평가항목」 요지). 마지막에는 $k=\frac1n$일 때 넓이 $B\left(\frac1n\right)$이 무리수 꼴 $C+D\sqrt{n^2-2n+2}$로 표현되고 $D>0$임을 논하게 한다.
key_idea: |
  접선 $\ell: y=(1-2k)(x-k)+k-k^2$과 $y=x^2-x$의 교점 중 양수인 $x$좌표가 $\alpha=1-k+\sqrt{1-2k+2k^2}>1$이므로 $B(k)=\displaystyle\int_1^\alpha\{\ell(x)-(x^2-x)\}dx$를 $k,\alpha$의 다항식으로 쓴다.
stuck: |
  $\alpha>1$임을 확인해야 적분 구간이 $[1,\alpha]$로 정해진다는 점, 그리고 $\alpha$를 대입한 뒤 $\sqrt{n^2-2n+2}$의 계수만 모아 $D$를 정리하는 계산
