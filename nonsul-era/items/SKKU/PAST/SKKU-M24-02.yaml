stimuli:
- id: S1
  label: <제시문 1>
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,\,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b|f(x)-g(x)|\,dx$$
- id: S2
  label: <제시문 2>
  body: |
    첫째항이 $a$, 공비가 $r$인 등비수열의 첫째항부터 제$n$항까지의 합 $S_n$은 다음과 같다.
    $$S_n=\begin{cases}\dfrac{a(r^n-1)}{r-1} & (r\ne1\text{일 때})\\[2mm] na & (r=1\text{일 때})\end{cases}$$
- id: S3
  label: <제시문 3>
  body: |
    양의 실수 전체의 집합에서 연속인 함수 $f(x)$가 다음 두 조건을 만족시킨다. (단, $A,\,B$는 상수이고, $A>1$이다.)
    • 모든 양의 실수 $x$에 대하여 $f(Ax)=Af(x)$이 성립한다.
    • 닫힌 구간 $[1,\,A]$에서 $f(x)=B-\dfrac{2B}{A-1}\left|x-\dfrac{A+1}{2}\right|$이다.

stem: |
  다음 <제시문 1> ~ <제시문 3>을 읽고 [문제 2-ⅰ] ~ [문제 2-ⅲ]을 문항별로 풀이와 함께 답하시오. (35점)

subparts:
- id: '1'
  stem: |
    <제시문 3>의 함수 $f(x)$에 대하여, $A=3$이고 $B=1$일 때, 정적분 $\displaystyle\int_{\frac23}^{9}f(x)\,dx$의 값을 구하고 그 이유를 논하여라. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '181/18', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      $[1,3]$의 삼각형 넓이 $1$을 기준으로 $[3,9]$는 $9$배, $[\frac13,1]$은 $\frac19$배이고 $[\frac23,1]$은 $[2,3]$의 $\frac19$배이다.
    steps:
    - {id: 1a, content: '$\int_{2/3}^9f\,dx=1+9+\tfrac1{18}=\tfrac{181}{18}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $f(3x)=3f(x)$이면 그래프 위의 점 $(a,b)$에 대해 $(3a,3b)$도 그래프 위에 있다.
    - 가로·세로가 모두 3배가 되면 넓이는 몇 배인가?
  - id: S1-B
    audience: B
    source_flow: 2024 모의논술 해설지 문제2-ⅰ 예시답안 p.6/12
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 $f(Ax)=Af(x)$로부터, 점 $(a,b)$가 그래프 $y=f(x)$ 위에 있다면 점 $(Aa,Ab)$도 역시 그래프 $y=f(x)$ 위에 있어야 한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $\displaystyle\int_1^3f(x)dx$는 밑변의 길이가 $2$이고 높이가 $1$인 삼각형의 넓이이므로 $1$이다. 따라서 닫힌 구간 $[3,9]$에서의 정적분 $\displaystyle\int_3^9f(x)dx$는 밑변의 길이가 $6$이고 높이가 $3$인 삼각형의 넓이이므로 $9$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        마찬가지로 $\displaystyle\int_2^3f(x)dx=\dfrac12$이므로 $\displaystyle\int_{\frac23}^1f(x)dx=\dfrac1{18}$이다. 따라서 $\displaystyle\int_{\frac23}^9f(x)dx=1+9+\dfrac1{18}=\dfrac{181}{18}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        함수 $f(x)$의 그래프를 올바르게 구할 수 있다(닮음 확대 구조).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        정적분의 값 $\dfrac{181}{18}$을 구할 수 있다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    삼차함수 $g(x)=x^3-9x^2+18x$와 <제시문 3>의 함수 $f(x)$에 대하여 $A=2$이고 $B=\dfrac12$일 때, 합성함수 $(g\circ f)(x)$가 $x=a$에서 극솟값을 가진다고 한다. $1\le a\le100$일 때 가능한 $a$값의 개수를 구하고 그 이유를 논하여라. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '14', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $g$는 $x=3-\sqrt3$에서 극대, $3+\sqrt3$에서 극소. $f$는 $x=2^k$에서 극솟값 $0$, $[2^k,2^{k+1}]$의 중점에서 극댓값 $2^{k-1}$. 극댓값이 $(3-\sqrt3,3+\sqrt3)$에 있으면 그 점도 $g\circ f$의 극소, $3+\sqrt3$보다 크면 $f=3+\sqrt3$인 두 점이 극소.
    steps:
    - {id: 2a, content: '구간별 $1,1,2,2,3,3,2$개 → $14$개', criteria: ['2.M1', '2.A1']}
    hint_ladder:
    - $g\circ f$가 극소가 되려면 $f$가 극소이고 $g$가 증가하거나, $f$가 극대이고 $g$가 감소하거나, $f$의 값이 $g$의 극소점을 지나야 한다.
    - $f$의 극댓값 $\frac12,1,2,4,8,16,32$를 $3\pm\sqrt3$과 비교하라.
  - id: S2-B
    audience: B
    source_flow: 2024 모의논술 해설지 문제2-ⅱ 예시답안 p.7/12
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(x)=x^3-9x^2+18x=x(x-3)(x-6)$는 세 개의 해 $x=0,3,6$을 가지고, $g'(x)=3(x^2-6x+6)$이므로 $x=3-\sqrt3$에서 극댓값, $x=3+\sqrt3$에서 극솟값을 가진다.
        한편, 함수 $f(x)$의 그래프는 정수 $k$에 대해 $x=2^k$에서 극솟값 $0$을 가지고, $x=\dfrac12(2^k+2^{k+1})$에서 극댓값 $2^{k-1}$을 가진다. [판독확인: 해설지 원문은 "극댓값 $x=2^{k-1}$"로 인쇄되어 있으나 문맥상 극댓값 $2^{k-1}$의 오식으로 보임]
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        닫힌 구간 $[1,100]$을 $[1,2),[2,4),[4,8),[8,16),[16,32),[32,64),[64,100]$으로 나누어서 생각하자.
        (a) 구간 $[1,2)$와 $[2,4)$에서 함수 $f(x)$의 최댓값은 각각 $\dfrac12$, $1$이고 $1<3-\sqrt3$이므로, $(g\circ f)(x)$의 극솟값은 $x=1,2$에서 발생한다. 즉, 각 구간에서 극솟값이 한 번씩 발생한다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        (b) 구간 $[4,8),[8,16)$에서 함수 $f(x)$의 최댓값은 각각 $2,4$이고 $3-\sqrt3<2,4<3+\sqrt3$이므로, $(g\circ f)(x)$의 극솟값은 $x=4,6,8,12$에서 발생한다. 즉, 각 구간에서 극솟값이 두 번씩 발생한다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        (c) 구간 $[16,32),[32,64),[64,128)$에서 함수 $f(x)$의 각각의 최댓값은 $3+\sqrt3$보다 크므로, $(g\circ f)(x)$의 극솟값은 각 구간에서 3번씩 발생한다. 하지만, $x=100$에서의 함숫값 $f(100)=64f\left(\dfrac{100}{64}\right)=64\times\dfrac7{16}=28>4$이므로, 마지막 닫힌 구간 $[64,100]$에서는 극솟값이 2번 발생한다.
        (a),(b),(c)를 종합하면, 극솟값은 $2\times1+2\times2+3\times2+2=14$번 발생한다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        함수 $f(x)$와 $g(x)$의 증가와 감소, 극대와 극소를 올바르게 구할 수 있다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        극솟값의 개수 $14$를 올바르게 구할 수 있다.
      depends_on: [2.M1]
      steps: [2b-2, 2b-3, 2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '3'
  stem: |
    <제시문 3>의 함수 $f(x)$에 대하여, 수열 $a_1,a_2,a_3,\cdots$을 $a_n=\displaystyle\int_{A^{n-1}}^{A^n}f(x)\,dx$로 정의하자. 수열의 각 항 $a_n$에 대해 $\log_3a_n$의 값이 모두 정수이고 다음의 두 조건
    • $\displaystyle\sum_{n=1}^{6}\log_3a_n=117$　　　• $37<\log_3\left(\displaystyle\sum_{n=1}^{6}a_n\right)<38$
    을 만족할 때, 가능한 순서쌍 $(A,\,B)$를 모두 구하고 그 이유를 논하여라. (15점)
  points: 15
  depends_on: []
  answer: {kind: value, value: '(27*sqrt(3), 18/(27*sqrt(3) - 1))', equivalents: ['(3**(7/2), 18/(3**(7/2)-1))'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $a_n=a(A^2)^{n-1}$, $a=\frac{B(A-1)}2$. $P=\log_3a$, $Q=2\log_3A$가 정수이고 $6P+15Q=117$, $P+5Q=37$ (등비합의 보정항 로그가 $0$과 $1$ 사이).
    steps:
    - {id: 3a, content: '$(P,Q)=(2,7)$ → $A=3^{7/2}=27\sqrt3$, $B=\tfrac{18}{27\sqrt3-1}$', criteria: ['3.M1', '3.M2', '3.M3', '3.A1']}
    hint_ladder:
    - $a_{n+1}/a_n$은 넓이의 닮음비이다.
    - $\log_3a_1$과 $\log_3(A^2)$이 각각 정수여야 함을 보여라.
  - id: S3-B
    audience: B
    source_flow: 2024 모의논술 해설지 문제2-ⅲ 예시답안 p.8/12
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $a_1=a=\dfrac{B(A-1)}{2}$라고 두면, $a_n=a(A^2)^{n-1}$이 된다. $\log_3a_n=\log_3a+2(n-1)\log_3A$의 값이 항상 정수이므로, $\log_3a=P$와 $2\log_3A=Q$의 값 모두 정수이다.
      criteria: ['3.M1']
    - id: 3b-2
      content: |
        문제의 첫 번째 조건으로부터 $\displaystyle\sum_{n=1}^6\log_3a_n=6\log_3a+15\times2\log_3A=6P+15Q=117$이므로, 식 $2P+5Q=39$를 얻을 수 있다.
      criteria: ['3.M2']
    - id: 3b-3
      content: |
        또한, 문제의 두 번째 조건으로부터
        $\log_3\left(\displaystyle\sum_{n=1}^6a_n\right)=\log_3\left(a\dfrac{A^{12}-1}{A^2-1}\right)=P+\log_3\left(\dfrac{A^{12}-1}{A^2-1}\right)=P+5Q+\log_3\left(\dfrac{1-\frac1{A^{12}}}{1-\frac1{A^2}}\right)$
        을 얻을 수 있다. $2\log_3A=Q$가 $0$보다 큰 정수이므로, $2\log_3A\ge1$이 되어 $A^2\ge3$이다.
      criteria: ['3.M3']
    - id: 3b-4
      content: |
        따라서 $1<\dfrac{1-\frac1{A^{12}}}{1-\frac1{A^2}}<\dfrac32$이므로 $0<\log_3\left(\dfrac{1-\frac1{A^{12}}}{1-\frac1{A^2}}\right)<1$이 되어, 식 $P+5Q=37$을 얻을 수 있다.
      criteria: ['3.M3']
    - id: 3b-5
      content: |
