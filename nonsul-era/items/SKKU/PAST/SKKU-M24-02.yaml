intent: |
  절댓값으로 정의된 함수의 정적분 값으로 정의된 수열의 값을 구할 수 있고, 함수의 증가와 감소, 극대와 극소에 대한 개념을 올바르게 이해하고 있는지, 로그의 뜻을 제대로 이해하여 연립일차방정식을 푸는 데 활용할 수 있는지 평가한다(해설지 「개요 및 주요 평가항목」 요지). 지수와 로그, 등비수열, 도함수의 활용, 정적분을 다룬다.
key_idea: |
  $f(Ax)=Af(x)$이므로 점 $(a,b)$가 그래프 위에 있으면 $(Aa,Ab)$도 그래프 위에 있다. 따라서 $[A^{k},A^{k+1}]$의 그래프는 $[1,A]$의 삼각형(꺾은선)을 $A^k$배 닮음 확대한 것이고, 그 구간의 정적분은 $A^{2k}$배가 된다.
stuck: |
  자기닮음 조건 $f(Ax)=Af(x)$를 그래프의 닮음 확대로 해석하는 것, (ii)에서 $g\circ f$의 극소가 $f$의 극소점·$f$가 $g$의 극소점 값을 지나는 점·$f$의 극대값이 $g$의 감소 구간에 있는 점 세 종류에서 생긴다는 분류
