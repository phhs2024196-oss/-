intent: |
  수열의 정의에 따라 수열의 값을 구할 수 있고, 함수의 미분 불가능한 점의 개념과 함수의 그래프의 평행이동을 제대로 이해하고 있는지 평가한다(해설지 「개요 및 주요 평가항목」 요지). 수열의 정의, 미분 가능·불가능, 그래프의 평행이동, 주기성을 이용한 정적분 계산을 다룬다.
key_idea: |
  $\frac{54484}{333333}=0.\dot1\,6345\dot2$이므로 $a_n$은 $1,6,3,4,5,2$가 반복되고 $f(n)=a_n-a_{n+4}$는 $-4,4,2,-2,2,-2$가 반복된다. $h$는 주기 $6$이고, 이음점 $x=m+1$에서 왼쪽 기울기 $-c_m$, 오른쪽 기울기 $c_{m+1}$을 비교한다.
stuck: |
  $c\,g(x-m)$의 양 끝 기울기가 $c$, $-c$임을 이용해 이음점의 미분가능성을 계수 부호만으로 판정하는 것, 그리고 $[1,100]$을 주기 16개와 나머지 $[97,100]$으로 나누는 것
