intent: |
  서로 다른 $n$개의 숫자에서 2개를 선택하여 만들어 낼 수 있는 ${}_n\mathrm{C}_2$개의 숫자들이 언제 등차수열의 항을 이루는지를 확인하는 문제로, 등차수열의 기본적인 개념과 간단한 경우에서의 조합의 의미를 이해하고 있는지 평가한다(해설지 「개요 및 주요 평가항목」 요지). 고교 과정 중 경우의 수(조합)와 등차수열을 다룬다.
key_idea: |
  두 원소의 합을 크기순으로 늘어놓으면 처음 두 항은 $a_1+a_2<a_1+a_3$, 마지막 두 항은 $a_{n-2}+a_n<a_{n-1}+a_n$로 고정된다. 공차 $d=a_3-a_2=a_{n-1}-a_{n-2}$에서 서로 다른 두 쌍의 합이 같아지는 모순을 끌어낸다.
stuck: |
  $n=4$에서 세 번째 항이 $a_1+a_4$인지 $a_2+a_3$인지로 경우를 나누는 것, $n=5$에서 $a_1+a_5$의 위치(4번째 또는 7번째)를 정하는 것
