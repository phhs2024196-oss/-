intent: |
  이차함수의 그래프와 직선의 위치 관계로부터 파생되는 다양한 점의 좌표와 직선의 방정식을 구할 수 있는지와 이차방정식의 근과 계수의 관계를 올바르게 이해하고 있는지, 그리고 정적분을 올바르게 구할 수 있는지를 평가한다(해설지 「개요 및 주요 평가항목」 요지). 방정식과 부등식, 직선의 방정식, 정적분을 다룬다.
key_idea: |
  교점의 $x$좌표는 $(1-k^2)x^2-2kx-2=0$의 근이므로 근과 계수의 관계로 중점 $\left(\frac{k}{1-k^2},\frac{1}{1-k^2}\right)$을 얻는다. 판별식 $D/4=k^2+2(1-k^2)=2-k^2$로 교점 개수를 정한다.
stuck: |
  중점의 $y$좌표를 $kx+1$에 대입해 $\frac{1}{1-k^2}$로 정리하는 것, (ii)에서 $c=\frac{2}{-2k^2-k+2}$의 분모가 $0$을 지나므로 치역이 두 조각으로 나뉜다는 것
