- id: '4'
  stem: |
    <제시문 2>에 주어진 함수 $f_3(a)$에 대하여, $f_3(a)\ge1$이기 위한 $a$의 범위를 [문제 3-ⅱ]에서 제시된 $m$을 이용하여 구하고, 그 이유를 논하시오. (10점)
  points: 10
  depends_on: ['2']
  answer: {kind: set, value: 'Union(FiniteSet(1), Interval(m, 2))', equivalents: ['a = 1 or m <= a <= 2'], tolerance: null}
  solutions:
  - id: S4-A
    audience: A
    method_no: 1
    key_idea: |
      $h(x)=4\left(x-\frac{a-a^2+6}{4}\right)^2+\frac1{12}(a^2+3a-6)^2$ ($1\le x\le2$). 최댓값 $h(2)=(2-a)^2+\frac13a^4\ge\frac43$은 (ii)에서 이미 푼 부등식이다.
    steps:
    - {id: 4a, content: '$a=1$ 또는 $m\le a\le2$', criteria: ['4.M1', '4.A1']}
    hint_ladder:
    - 선분 $\mathrm{BC}$ 위의 점을 $(x,\sqrt3(2-x))$로 두라.
    - 최댓값 조건은 [문제 3-ⅱ]의 부등식과 같다.
  - id: S4-B
    audience: B
    source_flow: 2025 모의논술 해설지 문제3-ⅳ 예시답안 p.15-16/17
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        선분 $\mathrm{BC}$ 위의 임의의 점을 $(x,\sqrt3(2-x))$로 놓자. 여기서 $1\le x\le2$이다. 두 점 사이의 거리의 제곱을 이차함수 $h(x)$로 두면
        $h(x)=(x-a)^2+\left(\sqrt3(2-x)-\frac1{\sqrt3}a^2\right)^2=4\left(x-\frac{(a-a^2+6)}4\right)^2+\frac1{12}(a^2+3a-6)^2$.
        이제 $h(x)=\frac43$가 되는 $x$를 닫힌 구간 $[1,2]$에서 찾도록 하자. $a\ge1$이므로 $\frac{a-a^2+6}4\le\frac32$이다. 또한 $\frac{a-a^2+6}4=1$이 되는 $a$는 $2$이므로, 두 가지 경우로 나누어서 생각한다.
      criteria: ['4.M1']
    - id: 4b-2
      content: |
        (경우1) $1\le a\le2$: 이 경우 $1\le\frac{a-a^2+6}4\le\frac32$이므로, 닫힌 구간 $[1,2]$에서 $h(x)$의 최솟값은 $h\left(\frac{a-a^2+6}4\right)=\frac1{12}(a^2+3a-6)^2$이고 최댓값은 $h(2)=(2-a)^2+\frac13a^4$이 된다. 따라서, $f_3(a)\ge1$일 필요충분조건은 $\frac1{12}(a^2+3a-6)^2\le\frac43\le(2-a)^2+\frac13a^4$임을 알 수 있다. 여기서 $\frac1{12}(a^2+3a-6)^2\le\frac43$를 풀면, $(a^2+3a-10)(a^2+3a-2)=(a-2)(a+5)(a^2+3a-2)\le0$이고, $1\le a\le2$에서 $(a+5)(a^2+3a-2)$는 항상 양수 값을 가지므로 $1\le a\le2$를 얻는다. 또한 $\frac43\le(2-a)^2+\frac13a^4$을 풀면, [문제 3-ⅱ]의 풀이로부터 $a=1$ 또는 $a\ge m$임을 알 수 있다. 따라서 $f_3(a)\ge1$일 필요충분조건은 $a=1$ 또는 $m\le a\le2$이 된다.
      criteria: ['4.A1']
    - id: 4b-3
      content: |
        (경우2) $a\ge2$: 이 경우 $\frac{a-a^2+6}4\le1$이므로, 닫힌 구간 $[1,2]$에서 $h(x)$의 최솟값은 $h(1)=\frac{a^4}3-a^2-2a+4$이고 최댓값은 $h(2)=(2-a)^2+\frac13a^4$이 된다. 따라서, $f_3(a)\ge1$일 필요충분조건은 $\frac{a^4}3-a^2-2a+4\le\frac43\le(2-a)^2+\frac13a^4$임을 알 수 있다. 여기서 $\frac{a^4}3-a^2-2a+4\le\frac43$를 풀면, $a^4-3a^2-6a+8\le0$이 되어 $(a-1)(a-2)(a^2+3a+4)\le0$이므로, $1\le a\le2$가 된다. $a=2$인 경우에, $\frac43\le(2-a)^2+\frac13a^4$도 만족되므로, 이 경우에 $a=2$만이 $f_3(a)\ge1$이 된다.
        이제 (경우1)과 (경우2)를 종합적으로 고려하면, $f_3(a)\ge1$이기 위한 $a$의 범위는 $a=1$ 또는 $m\le a\le2$가 된다.
      criteria: ['4.A1']
