stimuli:
- id: S1
  label: <제시문1>
  body: |
    자연수의 거듭제곱의 합은 다음과 같다.
    $$\sum_{k=1}^{n}k=\frac{n(n+1)}{2}$$
    $$\sum_{k=1}^{n}k^2=\frac{n(n+1)(2n+1)}{6}$$
    $$\sum_{k=1}^{n}k^3=\left\{\frac{n(n+1)}{2}\right\}^2$$
- id: S2
  label: <제시문2>
  body: |
    첫째항이 $a$, 공차가 $d$인 등차수열의 제 $n$항을 $l$이라 하고, 첫째항부터 제 $n$항까지의 합을 $S_n$이라고 하면
    $$S_n=\frac{n(a+l)}{2}=\frac{n(2a+(n-1)d)}{2}$$
    이다.
- id: S3
  label: <제시문3>
  body: |
    서로 다른 실수로 이루어진 집합 $A=\{a_1,a_2,\cdots,a_k\}$에 대해 $S(A)$를 집합 $A$의 모든 원소들의 합으로 정의하자.
    $$S(A)=a_1+a_2+\cdots+a_k$$
    예를 들어, 소수 $p$에 대해 집합 $A$를 $A=\{1,p\}$, 즉 $p$의 약수들의 집합이라 할 때, $S(A)=p+1$이다.

stem: |
  다음 <제시문1> ~ <제시문3>을 읽고 [문제1-ⅰ] ~ [문제1-ⅲ]을 문항별로 풀이와 함께 답하시오. (30점)

subparts:
- id: 'i'
  stem: |
    <제시문3>에서 집합 $A$를, 자연수 $2^{2025}$의 약수에 $\log_2$를 취한 값들의 집합이라 하자. 이때, $S(A)$의 값을 소인수분해하고 그 이유를 논하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '3**4*5**2*1013', equivalents: ['2050325'], tolerance: null}
  solutions:
  - id: Si-A
    audience: A
    method_no: 1
    key_idea: $A=\{0,1,\cdots,2025\}$이므로 등차수열의 합이다.
    steps:
    - {id: ia, content: '$S(A)=\tfrac{2025\times2026}{2}=3^4\cdot5^2\cdot1013$', criteria: ['i.M1', 'i.A1']}
    hint_ladder:
    - $2^{2025}$의 약수를 모두 나열해 보자.
    - $\log_2 2^k=k$이다.
  - id: Si-B
    audience: B
    source_flow: 2026 모의논술 해설지 [문제1-ⅰ] 예시답안 p.4(해설 2/13)
    method_no: 1
    steps:
    - id: ib-1
      content: |
        자연수 $2^{2025}$의 약수는 $1,2,4,\cdots,2^{2025}$이고, 여기에 $\log_2$를 취했으므로, 집합 $A$는
        $$A=\{0,1,2,\cdots,2025\}$$
        이다.
      criteria: ['i.M1']
    - id: ib-2
      content: |
        따라서, $S(A)=\dfrac{2025\times2026}{2}=3^4\cdot5^2\cdot1013$이다.
      criteria: ['i.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: i.M1
      mark_type: M
      points: 5
      evidence: |
        집합 $A$를 올바르게 구할 수 있다.
      depends_on: []
      implied_ok: false
      steps: [ib-1]
    - id: i.A1
      mark_type: A
      points: 5
      evidence: |
        $S(A)$의 값을 올바르게 구하고 소인수분해할 수 있다.
      depends_on: [i.M1]
      steps: [ib-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'ii'
  stem: |
    <제시문3>에서 집합 $A$를, 자연수 $10^{2025}$의 약수에 $\log_{10}$을 취한 값들의 집합이라 하자. 이때 $S(A)$의 값이 자연수임을 보인 뒤, 그 수를 소인수분해하고 그 이유를 논하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: value, value: '2*3**4*5**2*1013**2', equivalents: ['2026*2025*2026/2'], tolerance: null}
  solutions:
  - id: Sii-A
    audience: A
    method_no: 1
    key_idea: 각 지수 $a$(또는 $b$)는 $2026$개의 약수에서 나타나므로 $S(A)=2026\cdot\tfrac{2025\cdot2026}{2}(\log_{10}2+\log_{10}5)$.
    steps:
    - {id: iia, content: '$S(A)=\log_{10}10^{2026(0+1+\cdots+2025)}=2026\times\tfrac{2025\times2026}{2}=2\cdot3^4\cdot5^2\cdot1013^2$', criteria: ['ii.M1', 'ii.A1']}
    hint_ladder:
    - $10^{2025}$의 약수를 $2^a5^b$ 꼴로 써 보자.
    - 합 대신 모든 약수의 곱의 로그를 생각해 보자.
  - id: Sii-B
    audience: B
    source_flow: 2026 모의논술 해설지 [문제1-ⅱ] 예시답안 p.5(해설 3/13)
    method_no: 1
    steps:
    - id: iib-1
      content: |
        집합 $A$의 원소는 $0\le a,b\le2025$인 정수 $a,b$에 대하여 $\log_{10}2^a5^b$의 형태를 가진다. 따라서, $S(A)$의 값은 $10^{2025}$의 모든 약수들의 곱에 $\log_{10}$를 취한 것과 같다.
      criteria: ['ii.M1']
    - id: iib-2
      content: |
        고정된 $a$에 대하여, $2^a$에 의해 나눠지지만 $2^{a+1}$에 의해서 나눠지지 않는 약수는 $2^a,2^a5,2^a5^2,\cdots,2^a5^{2025}$가 되어 모두 $2026$개다. 마찬가지로 고정된 $b$에 대하여, $5^b$에 의해 나눠지지만 $5^{b+1}$에 의해서 나눠지지 않는 약수는 모두 $2026$개다.
      criteria: ['ii.M1']
    - id: iib-3
      content: |
        따라서,
        $$S(A)=\log_{10}\left(2^{0\times2026}2^{1\times2026}\cdots2^{2025\times2026}\times5^{0\times2026}5^{1\times2026}\cdots5^{2025\times2026}\right)=\log_{10}10^{2026(0+1+\cdots+2025)}=2026\times\frac{2025\times2026}{2}=2\cdot3^4\cdot5^2\cdot1013^2$$
        이다.
      criteria: ['ii.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: ii.M1
      mark_type: M
      points: 5
      evidence: |
        집합 $A$를 올바르게 구할 수 있다.
      depends_on: []
      implied_ok: false
      steps: [iib-1, iib-2]
    - id: ii.A1
      mark_type: A
      points: 5
      evidence: |
        $S(A)$의 값을 올바르게 구하고 소인수분해할 수 있다.
      depends_on: [ii.M1]
      steps: [iib-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'iii'
  stem: |
    <제시문3>에서 집합 $A$를, 자연수 $10^{2025}$의 약수에 $\log_{10}$을 취한 다음, 약수가 짝수이면 $+1$을 곱하고 홀수이면 $-1$을 곱한 값들의 집합이라 하자. 이때 $S(A)-2025\cdot2026\cdot\log_{10}2$의 값이 자연수임을 보이고, 그 수를 소인수분해한 뒤 그 이유를 논하시오. (10점)
  points: 10
  depends_on: ['ii']
  answer: {kind: value, value: '2**3*3**4*5**2*11*23*1013', equivalents: ['2024*2025*2026/2'], tolerance: null}
  solutions:
  - id: Siii-A
    audience: A
    method_no: 1
    key_idea: 짝수 약수 부분 $S(A_1)$과 홀수 약수 부분 $S(A_2)$로 나누고 $\log_{10}5=1-\log_{10}2$로 정리한다.
    steps:
    - {id: iiia, content: '$S(A)=\tfrac{2024\cdot2025\cdot2026}{2}+2025\cdot2026\log_{10}2$이므로 구하는 값은 $2^3\cdot3^4\cdot5^2\cdot11\cdot23\cdot1013$', criteria: ['iii.M1', 'iii.A1']}
    hint_ladder:
    - 짝수인 약수는 $a\ge1$, 홀수인 약수는 $a=0$인 $2^a5^b$이다.
    - $\log_{10}2$와 $\log_{10}5$의 계수를 각각 모아 보자.
  - id: Siii-B
    audience: B
    source_flow: 2026 모의논술 해설지 [문제1-ⅲ] 예시답안 p.6(해설 4/13)
    method_no: 1
    steps:
    - id: iiib-1
      content: |
        집합 $A_1$을 $10^{2025}$의 짝수인 약수에 $\log_{10}$를 취한 수들의 집합이라고 하고, 집합 $A_2$를 $10^{2025}$의 홀수인 약수에 $-\log_{10}$를 취한 수들의 집합이라고 하자. 그러면, $A=A_1\cup A_2$이고 $S(A)=S(A_1)+S(A_2)$가 성립한다.
      criteria: ['iii.M1']
    - id: iiib-2
      content: |
        집합 $A_1$의 원소는 $1\le a\le2025$와 $0\le b\le2025$인 정수 $a,b$에 대하여 $\log_{10}2^a5^b$의 형태를 띄므로, [문제 1-ⅱ]에서와 같은 방법으로
        $$S(A_1)=\log_{10}\left(2^{1\times2026}\cdots2^{2025\times2026}\times5^{0\times2025}5^{1\times2025}\cdots5^{2025\times2025}\right)=\log_{10}2^{2026(1+\cdots+2025)}5^{2025(0+1+\cdots+2025)}$$
        임을 알 수 있다. 집합 $A_2$의 원소는 $0\le b\le2025$인 정수 $b$에 대하여 $-\log_{10}5^b$의 형태를 띄므로,
        $$S(A_2)=-\log_{10}\left(5^{0+1+\cdots+2025}\right)$$
        이다.
      criteria: ['iii.M1']
    - id: iiib-3
      content: |
        따라서,
        $$S(A)=S(A_1)+S(A_2)=\log_{10}2^{\frac{2026^2\times2025}{2}}5^{\frac{2024\times2025\times2026}{2}}=\left(\frac{2024\times2025\times2026}{2}\right)+\log_{10}2^{2025\times2026}$$
        이고, $S(A)-2025\cdot2026\cdot\log_{10}2=2^3\cdot3^4\cdot5^2\cdot11\cdot23\cdot1013$이다.
      criteria: ['iii.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: iii.M1
      mark_type: M
      points: 5
      evidence: |
        집합 $A$를 올바르게 구할 수 있다.
      depends_on: []
      implied_ok: false
      steps: [iiib-1, iiib-2]
    - id: iii.A1
      mark_type: A
      points: 5
      evidence: |
        $S(A)-2025\cdot2026\cdot\log_{10}2$의 값을 올바르게 구하고 소인수분해할 수 있다.
      depends_on: [iii.M1]
      steps: [iiib-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

