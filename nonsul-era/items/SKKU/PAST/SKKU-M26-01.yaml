intent: |
  로그 개념을 이용하여 수학적으로 정의된 집합의 원소들의 합을 구하는 문제이다. 매우 큰 수의 약수들에 특정한 밑을 가지는 로그함수를 취해 나오는 수들로 이루어진 집합의 원소들의 합을 구하는 과정에서 등차수열의 개념과 합, 로그의 성질을 활용할 수 있는지 평가한다(해설지 개요 요약).
key_idea: |
  $10^{2025}$의 약수는 $2^a5^b$ $(0\le a,b\le2025)$이므로 $\log_{10}2^a5^b=a\log_{10}2+b\log_{10}5$의 합을 $a$, $b$에 대한 등차수열의 합으로 나누어 계산한다. (ⅲ)은 짝수 약수($a\ge1$)와 홀수 약수($a=0$)로 나눈다.
stuck: |
  (ⅱ)에서 각 $a$가 $2026$번씩 나타난다는 세기, (ⅲ)에서 $\log_{10}2+\log_{10}5=1$로 $\log_{10}2$ 항을 분리하는 정리
idea_tags: [IDEA-LOG-SUM-OVER-DIVISORS, IDEA-DOUBLE-COUNT-EXPONENTS]
tags: [로그, 약수, 등차수열의 합, 소인수분해]
