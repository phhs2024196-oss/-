intent: |
  좌표평면 위 네 점을 꼭짓점으로 갖는 사각형 종이를 접는 상황에서 삼각형의 합동, 도형의 넓이, 호의 길이를 연관 짓는 문제를 해결할 수 있는지 평가한다. 도형의 넓이, 미분을 활용한 함수의 최대와 최소, 호도법, 삼각함수의 개념을 이해하고 있으면 풀 수 있다(해설지 개요 요약).
key_idea: |
  접기에 의해 $\triangle\mathrm{FBG}\equiv\triangle\mathrm{FEG}$이므로 $\overline{\mathrm{EF}}=\overline{\mathrm{BF}}=a$, $\overline{\mathrm{EG}}=b$이다. 넓이 등식으로 $b$를 $a$로 나타내고, $\mathrm{G}$가 움직일 때 $\mathrm{E}$는 중심 $\mathrm{F}$, 반지름 $a$인 원 위를 움직인다.
