intent: |
  이차함수의 그래프 위의 두 점을 잇는 선분과 그래프 사이의 도형의 넓이를 구하는 문제이다. 내분점의 개념, 미분을 이용한 함수의 증가와 감소 판단, 접선의 방정식, 정적분을 이용한 도형의 넓이 계산 능력을 평가한다(해설지 개요 요약).
key_idea: |
  (ⅰ) $\mathrm{M}$이 $y$축 위이므로 $\mathrm{P}_1(-t,t^2)$, $\mathrm{P}_2(2t,4t^2)$. (ⅱ) $\tfrac{n}{m}=\tfrac{\overline{\mathrm{PM}_2}}{\overline{\mathrm{P}_1\mathrm{M}}}$은 거리 함수 $f(x)=\overline{\mathrm{PM}}^2$의 증감으로 범위가 정해진다. (ⅲ) 중점이 $y=x^2+\tfrac14$ 위에 있고 선분은 그 곡선의 접선의 일부이다.
stuck: |
  (ⅲ)에서 $x_2-x_1=1$인 현이 모두 $y=x^2+\tfrac14$에 접한다는 사실을 발견해 휩쓴 영역의 위쪽 경계를 구하는 것
