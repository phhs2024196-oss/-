intent: |
  좌표평면에 주어진 서로 다른 직선들의 교점으로부터 생각할 수 있는 삼각형, 특히 정삼각형의 개수를 구하는 문제로 '경우의 수'에서 곱의 법칙을 제대로 활용할 수 있는지를 평가하고, 그 과정에서 '자연수의 거듭제곱의 합'과 '로그함수', '이차부등식'에 대한 이해를 묻는다(해설지 개요 요약).
key_idea: |
  직선 $\ell$을 $x$축으로 보면 정삼각형은 기울기 $\sqrt3$인 직선 하나와 $-\sqrt3$인 직선 하나를 고를 때마다 생기므로 개수는 $k(n-k)$이다. $a_n$은 $|k-(n-k)|$가 최소일 때, $b_n$은 차가 두 번째로 작은 경우와 한 직선을 다른 방향으로 둔 경우($a_{n-1}$) 중 큰 값이다.
stuck: |
  (ⅱ)에서 '두 번째 최대'의 후보로 $n-1$개만 $\pm\sqrt3$인 경우($a_{n-1}$)를 함께 비교하는 것, (ⅲ)에서 곱이 망원곱으로 정리되는 것
