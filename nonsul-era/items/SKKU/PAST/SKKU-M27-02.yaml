- id: 'iii'
  stem: |
    점 $\mathrm{C}$가 점 $(0,F(0))$부터 점 $(2027,F(2027))$까지 곡선 $y=F(x)$ 위를 움직일 때, 점 $\mathrm{D}$가 나타내는 도형은 선분이다. 이때 이 선분의 길이를 구하고 그 이유를 논하시오. (10점)
  points: 10
  depends_on: ['i']
  answer: {kind: value, value: '162185/14', equivalents: [], tolerance: null}
  solutions:
  - id: Siii-A
    audience: A
    method_no: 1
    key_idea: 한 주기의 자취는 선분 $\mathrm{M}_n\mathrm{Q}_n$이고 $n$이 커질수록 앞 선분을 포함하므로 전체는 $\mathrm{M}_{2026}\mathrm{Q}_{2026}$.
    steps:
    - {id: iiia, content: '$\alpha(\mathrm{Q}_n)-\alpha(\mathrm{M}_n)=\tfrac{48n+63}{14}$, 길이 $\tfrac53\cdot\tfrac{48n+63}{14}$에 $n=2026$: $\tfrac{162185}{14}$', criteria: ['iii.M1', 'iii.M2', 'iii.A1']}
    hint_ladder:
    - $x=n,\ n+\tfrac12,\ n+1$에서의 접선이 만드는 점 $\mathrm{D}$를 먼저 구해 보자.
    - 다음 주기로 가면 그 선분은 어떻게 변하는가?
  - id: Siii-B
    audience: B
    source_flow: 2027 모의논술 해설지 [문제2-ⅲ] 예시답안 p.11-12(해설 9-10/20)
    method_no: 1
    steps:
    - id: iiib-1
      content: |
        점 $\mathrm{C}$가 한 주기 $n\le x\le n+1$ ($n$은 정수)에서 움직일 때, 먼저 세 특수한 위치에 대응하는 점 $\mathrm{D}$를 다음과 같이 잡자. $x=n$에서의 점 $\mathrm{D}$를 $\mathrm{P}_n$, $x=n+\dfrac12$에서의 점 $\mathrm{D}$를 $\mathrm{M}_n$, $x=n+1$에서의 점 $\mathrm{D}$를 $\mathrm{Q}_n$이라고 하자. $x=n$, $x=n+\dfrac12$, $x=n+1$에서의 접선은 각각 $y=x-n$, $y=-x+n+\dfrac12$, $y=x-n-1$이므로, 이들을 직선 $\mathrm{AB}$와 연립하면 $\mathrm{P}_n\left(\dfrac{3(n-1)}{7},-\dfrac{4n+3}{7}\right)$, $\mathrm{M}_n\left(-3n-\dfrac92,4n+5\right)$, $\mathrm{Q}_n\left(\dfrac{3n}{7},-\dfrac{4n+7}{7}\right)$을 얻는다. 이제 점 $\mathrm{D}$의 움직임을 각 주기를 반으로 나눈 두 구간별로 살펴보자. 편의상 점 $\mathrm{P}$의 $x$좌표를 $\alpha(\mathrm{P})$라 하자.
      criteria: ['iii.M1']
    - id: iiib-2
      content: |
        ① $n\le x\le n+\dfrac12$: $\alpha(\mathrm{C})=n+u$ $\left(0\le u\le\dfrac12\right)$라 두면 $\alpha(\mathrm{D})=\dfrac{3(4nu-n+2u^2+1)}{12u-7}$이다. $\alpha(\mathrm{M}_n)=-3n-\dfrac92$, $\alpha(\mathrm{Q}_n)=\dfrac{3n}{7}$임을 이용하면, $\alpha(\mathrm{D})-\alpha(\mathrm{M}_n)=\dfrac{3(1-2u)(16n+2u+19)}{2(7-12u)}\ge0$이고, $\alpha(\mathrm{Q}_n)-\alpha(\mathrm{D})=\dfrac{3(14u^2+16nu+7)}{7(7-12u)}\ge0$이다. 따라서 $0\le u\le\dfrac12$에서 얻는 모든 점 $\mathrm{D}$는 선분 $\mathrm{M}_n\mathrm{Q}_n$ 위에 있다.
      criteria: ['iii.M1']
    - id: iiib-3
      content: |
        ② $n+\dfrac12\le x\le n+1$: $\alpha(\mathrm{C})=n+u$ $\left(\dfrac12\le u\le1\right)$이라 두면 $\alpha(\mathrm{D})=\dfrac{3(4nu-3n+2u^2-2)}{12u-5}$이다. $\alpha(\mathrm{D})-\alpha(\mathrm{M}_n)=\dfrac{3(2u-1)(16n+2u+19)}{2(12u-5)}\ge0$이고 $\alpha(\mathrm{Q}_n)-\alpha(\mathrm{D})=\dfrac{6(1-u)(8n+7u+7)}{7(12u-5)}\ge0$이므로 항상 점 $\mathrm{D}$는 선분 $\mathrm{M}_n\mathrm{Q}_n$ 위에 있다. 한편 $u=\dfrac12$일 때 $\alpha(\mathrm{D})=\alpha(\mathrm{M}_n)$, $u=1$일 때 $\alpha(\mathrm{D})=\alpha(\mathrm{Q}_n)$이다. 또 고정된 $n$에 대해, $\alpha(\mathrm{D})$를 나타내는 함수를 변수 $u$에 관한 함수로 보면, 이 함수는 닫힌구간 $\left[\dfrac12,1\right]$에서 연속이므로, $n+\dfrac12\le x\le n+1$일 때, 점 $\mathrm{D}$가 나타내는 도형은 선분 $\mathrm{M}_n\mathrm{Q}_n$ 전체이다. $n\le x\le n+\dfrac12$일 때 점 $\mathrm{D}$가 나타내는 도형 또한 모두 이 선분 위에 있으므로, 한 주기에서 점 $\mathrm{D}$가 나타내는 도형은 바로 선분 $\mathrm{M}_n\mathrm{Q}_n$이다.
      criteria: ['iii.M1']
    - id: iiib-4
      content: |
        또한 $n$이 $1$만큼 증가할 때, $\alpha(\mathrm{M}_{n+1})=\alpha(\mathrm{M}_n)-3$, $\alpha(\mathrm{Q}_{n+1})=\alpha(\mathrm{Q}_n)+\dfrac37$이므로, 선분 $\mathrm{M}_n\mathrm{Q}_n$은 다음 주기의 선분 $\mathrm{M}_{n+1}\mathrm{Q}_{n+1}$ 안에 완전히 포함된다. 따라서 $0\le x\le2027$에서 점 $\mathrm{D}$가 나타내는 도형은 마지막 주기에서 얻는 선분 $\mathrm{M}_{2026}\mathrm{Q}_{2026}$ 하나이다.
      criteria: ['iii.M2']
    - id: iiib-5
      content: |
        이제 이 선분의 길이를 구하자. 직선 $\mathrm{AB}$의 기울기는 $-\dfrac43$이고 $\alpha(\mathrm{Q}_n)-\alpha(\mathrm{M}_n)=\dfrac{48n+63}{14}$이므로, $\overline{\mathrm{M}_n\mathrm{Q}_n}=\dfrac53\cdot\dfrac{48n+63}{14}=\dfrac{5(16n+21)}{14}$을 얻는다. 이제 $n=2026$을 대입하면 $\overline{\mathrm{M}_{2026}\mathrm{Q}_{2026}}=\dfrac{162185}{14}$이 된다. 따라서 구하는 선분의 길이는 $\dfrac{162185}{14}$이다.
      criteria: ['iii.A1']
