stimuli:
- id: S1
  label: <제시문1>
  body: |
    함수 $F(x)$는 다음과 같이 정의되고, 모든 실수 $x$에 대하여 $F(x+1)=F(x)$를 만족한다.
    $$F(x)=\begin{cases}-2x^2+x & \left(0\le x\le\dfrac12\right)\\ 2x^2-3x+1 & \left(\dfrac12\le x<1\right)\end{cases}$$
- id: S2
  label: <제시문2>
  body: |
    좌표평면에서 두 점 $\mathrm{A}(0,-1)$와 $\mathrm{B}(3,-5)$에 대해, <제시문1>의 곡선 $y=F(x)$ 위의 점 $\mathrm{C}(c,F(c))$에서 그은 접선이 직선 $\mathrm{AB}$와 만나는 점을 $\mathrm{D}$라 한다.
- id: S3
  label: <제시문3>
  body: |
    임의의 실수 $x$에 대하여 $x=n+u$ ($n$은 정수, $0\le u<1$)라 하면, <제시문1>에서 다음을 얻는다.
    $$F'(x)=\begin{cases}-4u+1 & \left(0\le u\le\dfrac12\right)\\ 4u-3 & \left(\dfrac12\le u<1\right)\end{cases}$$
- id: S4
  label: <제시문4>
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)$와 $f(b)$의 값이 서로 다른 부호를 가지면, 방정식 $f(x)=0$은 열린구간 $(a,b)$에서 적어도 하나의 해를 가진다.

stem: |
  다음 <제시문1> ~ <제시문4>를 읽고 [문제2-ⅰ] ~ [문제2-ⅳ]를 문항별로 풀이와 함께 답하시오. (40점)

subparts:
- id: 'i'
  stem: |
    직선 $\mathrm{AB}$의 방정식을 구하고, 곡선 $y=F(x)$ 위의 점 $\mathrm{C}$를 택할 때마다 점 $\mathrm{D}$가 항상 유일하게 존재함을 보이시오. 또한 $\mathrm{C}(n,0)$($n$은 정수)일 때, 점 $\mathrm{D}$의 좌표를 $n$에 관한 식으로 나타내고 그 이유를 논하시오. (10점)
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'AB: y = -4*x/3 - 1; D = (3*(n-1)/7, -(4*n+3)/7)', equivalents: [], tolerance: null}
  solutions:
  - id: Si-A
    audience: A
    method_no: 1
    key_idea: 접선 기울기는 $[-1,1]$이고 $\mathrm{AB}$의 기울기는 $-\tfrac43$이므로 항상 한 점에서 만난다.
    steps:
    - {id: ia, content: '$y=-\tfrac43x-1$; $\mathrm{C}(n,0)$의 접선 $y=x-n$과 연립하면 $\mathrm{D}\left(\tfrac{3(n-1)}{7},-\tfrac{4n+3}{7}\right)$', criteria: ['i.A1', 'i.M1', 'i.A2']}
    hint_ladder:
    - <제시문3>에서 접선의 기울기가 가질 수 있는 값의 범위는?
  - id: Si-B
    audience: B
    source_flow: 2027 모의논술 해설지 [문제2-ⅰ] 예시답안 p.8(해설 6/20)
    method_no: 1
    steps:
    - id: ib-1
      content: |
        점 $\mathrm{A}$의 좌표는 $(0,-1)$이고 점 $\mathrm{B}$의 좌표는 $(3,-5)$이므로 직선 $\mathrm{AB}$의 기울기는 $-\dfrac43$이다. 따라서 직선 $\mathrm{AB}$의 방정식은 $y=-\dfrac43x-1$이다.
      criteria: ['i.A1']
    - id: ib-2
      content: |
        <제시문3>에 의해, 곡선 $y=F(x)$의 접선의 기울기는 항상 $-1$ 이상 $1$ 이하이다. 즉 모든 점 $\mathrm{C}$에서 접선의 기울기 $m$은 $-1\le m\le1$을 만족한다. 그런데 직선 $\mathrm{AB}$의 기울기는 $-\dfrac43$이므로, 접선과 직선 $\mathrm{AB}$는 서로 평행할 수 없다. 따라서 임의의 점 $\mathrm{C}$에서 그은 접선은 직선 $\mathrm{AB}$와 정확히 한 점에서 만나며, 점 $\mathrm{D}$는 항상 유일하게 존재한다.
      criteria: ['i.M1']
    - id: ib-3
      content: |
        이제 점 $\mathrm{C}$의 좌표를 $(n,0)$($n$은 정수)라고 하자. $F(n)=0$이고 $F'(n)=1$이므로, $\mathrm{C}$에서의 접선의 방정식은 $y=x-n$이다. 이것과 직선 $\mathrm{AB}$의 방정식을 연립하면 $x=\dfrac{3(n-1)}{7}$이므로 $\mathrm{D}$의 $x$좌표는 $\dfrac{3(n-1)}{7}$이다. 다시 $y=x-n$에 대입하면 $\mathrm{D}$의 $y$좌표는 $y=-\dfrac{4n+3}{7}$이다. 따라서 점 $\mathrm{D}$의 좌표는 $\left(\dfrac{3(n-1)}{7},-\dfrac{4n+3}{7}\right)$이다.
      criteria: ['i.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: i.A1
      mark_type: A
      points: 3
      evidence: |
        직선 $\mathrm{AB}$의 방정식을 올바르게 구할 수 있다.
      depends_on: []
      steps: [ib-1]
    - id: i.M1
      mark_type: M
      points: 3
      evidence: |
        접선의 기울기 범위를 이용하여 점 $\mathrm{D}$의 유일성을 설명할 수 있다.
      depends_on: []
      implied_ok: false
      steps: [ib-2]
    - id: i.A2
      mark_type: A
      points: 4
      evidence: |
        점 $\mathrm{C}$의 좌표가 $(n,0)$일 때 점 $\mathrm{D}$의 좌표를 정확히 구할 수 있다.
      depends_on: [i.A1]
      steps: [ib-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: 'ii'
  stem: |
    $x$좌표가 $0$ 이상 $2027$ 이하인 점 $\mathrm{C}$에 대하여 점 $\mathrm{D}$가 선분 $\mathrm{AB}$를 $2:1$로 외분한다고 할 때, 가능한 점 $\mathrm{C}$의 개수를 구하고 그 이유를 논하시오. (10점)
  points: 10
  depends_on: ['i']
  answer: {kind: value, value: '4024', equivalents: [], tolerance: null}
  solutions:
  - id: Sii-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{D}(6,-9)$를 지나는 접선의 접점을 반주기마다 끝값 부호로 센다.
    steps:
    - {id: iia, content: '$n=15,\cdots,2026$의 각 주기에 해가 $2$개씩: $2\times2012=4024$', criteria: ['ii.A1', 'ii.M1', 'ii.A2']}
    hint_ladder:
    - 외분점 $\mathrm{D}$의 좌표부터 구하자.
    - $c=n+u$로 두고 $u$에 대한 이차방정식의 해가 반주기 구간에 있는지 끝값으로 판정하자.
  - id: Sii-B
    audience: B
    source_flow: 2027 모의논술 해설지 [문제2-ⅱ] 예시답안 p.9-10(해설 7-8/20)
    method_no: 1
    steps:
    - id: iib-1
      content: |
        점 $\mathrm{D}$가 선분 $\mathrm{AB}$를 $2:1$로 외분한다는 것은 $\overline{\mathrm{AD}}:\overline{\mathrm{DB}}=2:1$이고 $\mathrm{D}$가 $\mathrm{B}$쪽 바깥에 있다는 뜻이다. 따라서 외분점의 좌표는 $(6,-9)$이다. 이제 점 $\mathrm{C}$의 $x$좌표를 $c=n+u$ ($n$은 정수, $0\le u<1$)라 두고, $0\le c\le2027$인 경우만 따져 보자.
      criteria: ['ii.A1']
    - id: iib-2
      content: |
        ① $0\le u\le\dfrac12$인 경우: 이때 점 $\mathrm{C}$의 좌표는 $(n+u,-2u^2+u)$, 접선의 기울기는 $1-4u$이다. 접선이 $\mathrm{D}(6,-9)$를 지나야 하므로 $-9=(1-4u)(6-n-u)+(-2u^2+u)$, 즉, $2u^2+(4n-24)u-n+15=0$을 얻는다. $g_1(u)=2u^2+(4n-24)u-n+15$라 하면, $g_1'(u)=4(u+n-6)$이다. $0\le n\le5$일 때 $g_1$은 열린구간 $\left(0,\dfrac12\right)$에서 감소하고, $n\ge6$일 때 열린구간 $\left(0,\dfrac12\right)$에서 증가한다. $g_1(0)=15-n$이고 $g_1\left(\dfrac12\right)=n+\dfrac72$이다. 따라서 $0\le n\le14$에서는 두 끝값이 모두 양수이므로 해가 없다. $n=15$에서는 $u=0$이 유일한 해가 되고, $n=16,17,\cdots,2026$에서는 $g_1(0)<0<g_1\left(\dfrac12\right)$이므로 <제시문4>에 의해서 해가 정확히 하나 존재한다. 또한 $c=2027$인 경우는 $n=2027$, $u=0$인 경우이고 $g_1(0)<0$이므로 해가 되지 않는다.
      criteria: ['ii.M1']
    - id: iib-3
      content: |
        ② $\dfrac12\le u<1$인 경우: 이때 점 $\mathrm{C}$의 좌표는 $(n+u,2u^2-3u+1)$, 접선의 기울기는 $4u-3$이다. 같은 방식으로 $-9=(2u^2-3u+1)+(4u-3)(6-n-u)$, 즉, $2u^2+(4n-24)u-3n+8=0$을 얻는다. $g_2(u)=2u^2+(4n-24)u-3n+8$이라 하면 $g_2'(u)=4(u+n-6)$이다. $0\le n\le5$일 때 $g_2$는 열린구간 $\left(\dfrac12,1\right)$에서 감소하고, $n\ge6$일 때 열린구간 $\left(\dfrac12,1\right)$에서 증가한다. $g_2\left(\dfrac12\right)=-\left(n+\dfrac72\right)$이고 $g_2(1)=n-14$이다. 따라서 $0\le n\le13$에서는 해가 없고, $n=14$에서는 $u=1$이 되어 구간에서 제외된다. $n=15,16,\cdots,2026$에서는 $g_2\left(\dfrac12\right)<0<g_2(1)$이므로 <제시문4>에 의해서 해가 정확히 하나 존재한다.
      criteria: ['ii.M1']
    - id: iib-4
      content: |
        결국 각 정수 $n=15,16,\cdots,2026$에 대하여 구간 $\left[n,n+\dfrac12\right]$에서 $1$개, 구간 $\left[n+\dfrac12,n+1\right)$에서 $1$개의 점 $\mathrm{C}$가 존재한다. 따라서 가능한 점 $\mathrm{C}$의 개수는 $2\times(2026-15+1)=4024$개다.
      criteria: ['ii.A2']
  - id: Sii-ALT
    audience: ALT
    source_flow: 2027 모의논술 해설지 [문제2-ⅱ] p.10(해설 8/20) * 참고(직관적 판단)
    method_no: 2
    key_idea: 원 해설 참고 — 접선의 기울기가 $[-1,1]$이므로 $\mathrm{D}$를 지나고 기울기가 $1$, $-1$인 직선이 $x$축과 만나는 점 $(15,0)$, $(-3,0)$을 보면 $0\le c<15$에서는 접선이 $\mathrm{D}$를 지나지 않고, 그림을 그려보면 각 주기마다 가능한 점 $\mathrm{C}$가 두 개씩 존재한다.
    steps:
    - id: iic-1
      content: |
        $\mathrm{D}(6,-9)$를 지나고 기울기가 $1$인 직선은 점 $(15,0)$을, 기울기가 $-1$인 직선은 점 $(-3,0)$을 지나기 때문에 점 $\mathrm{C}$의 $x$좌표가 $0$이상 $15$미만인 경우에는 접선이 점 $\mathrm{D}$를 지나지 않음을 알 수 있다. 그리고 그림을 그려보면 각 주기마다 가능한 점 $\mathrm{C}$가 두 개씩 존재함을 알 수 있다.
      criteria: ['ii.M1', 'ii.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: ii.A1
      mark_type: A
      points: 3
      evidence: |
        외분 조건으로부터 $\mathrm{D}(6,-9)$를 정확히 구할 수 있다.
      depends_on: []
      steps: [iib-1]
    - id: ii.M1
      mark_type: M
      points: 4
      evidence: |
        각 주기를 반으로 나눈 두 구간에서 얻는 방정식을 세우고, 주어진 구간에서 함수의 증가·감소와 끝값을 이용하여 해의 존재 여부를 판정할 수 있다.
      depends_on: [ii.A1]
      implied_ok: false
      steps: [iib-2, iib-3, iic-1]
    - id: ii.A2
