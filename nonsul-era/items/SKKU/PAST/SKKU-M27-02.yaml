intent: |
  주기 1인 조각별 이차함수의 그래프 위에서 접선의 방정식을 세우고, 그 접선이 고정된 직선 AB와 만나는 점 D를 해석하는 능력을 평가한다. 접선 기울기의 범위로 D의 존재·유일성을 설명하고, 외분 조건을 방정식으로 바꾸어 해의 개수를 세며, D의 자취와 선분 CD가 만드는 도형의 포함관계를 찾아 넓이를 적분으로 계산할 수 있는지 본다(해설지 개요 요약).
key_idea: |
  접선의 기울기는 항상 $[-1,1]$에 있어 기울기 $-\tfrac43$인 직선 $\mathrm{AB}$와 평행하지 않는다. 한 주기 $[n,n+1]$에서 $\mathrm{D}$는 선분 $\mathrm{M}_n\mathrm{Q}_n$을 움직이고, 이 선분과 선분 $\mathrm{CD}$가 만드는 도형은 주기마다 커지며 앞의 것을 포함한다.
stuck: |
  (ⅲ)·(ⅳ)에서 각 주기의 자취(도형)가 다음 주기의 것에 포함되어 전체가 마지막 주기 하나로 정해진다는 포함관계를 발견하는 것
