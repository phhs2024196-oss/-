- id: 'iv'
  stem: |
    점 $\mathrm{C}$가 점 $(0,F(0))$부터 점 $(2027,F(2027))$까지 곡선 $y=F(x)$ 위를 움직일 때, 선분 $\mathrm{CD}$가 나타내는 도형의 넓이를 구하고 그 이유를 논하시오. (10점)
  points: 10
  depends_on: ['iii']
  answer: {kind: value, value: '1578238457/168', equivalents: [], tolerance: null}
  solutions:
  - id: Siv-A
    audience: A
    method_no: 1
    key_idea: $R_n\subset T_n\subset T_{n+1}$이므로 전체 도형은 $T_{2026}$이고, 그 넓이를 세 구간으로 나누어 적분한다.
    steps:
    - {id: iva, content: '$S_n=\tfrac{16}{7}n^2+6n+\tfrac{95}{24}$, $S_{2026}=\tfrac{1578238457}{168}$', criteria: ['iv.M1', 'iv.M2', 'iv.A1']}
    hint_ladder:
    - 앞 반주기에서 생기는 도형은 뒤 반주기 도형 안에 들어가지 않는가?
    - 마지막 반주기 도형의 위쪽 경계는 $x=n+\tfrac12$에서의 접선이다.
  - id: Siv-B
    audience: B
    source_flow: 2027 모의논술 해설지 [문제2-ⅳ] 예시답안 p.13-14(해설 11-12/20)
    method_no: 1
    steps:
    - id: ivb-1
      content: |
        점 $\mathrm{C}$가 $n\le x\le n+\dfrac12$ ($n$은 정수)에서 움직일 때 선분 $\mathrm{CD}$가 만드는 도형을 $R_n$이라 하고, $n+\dfrac12\le x\le n+1$에서 움직일 때 만드는 도형을 $T_n$이라 하자.
        ① 먼저 도형 $R_n$이 도형 $T_n$에 포함됨을 보이자. $n\le x\le n+\dfrac12$에서의 곡선은 $y=-2(x-n)^2+(x-n)$이고 $x=n+\dfrac12$에서의 접선은 $y=-x+n+\dfrac12$이다. 이 곡선과 접선의 위치관계를 살펴보자. $n\le x\le n+\dfrac12$에서 $\left(-x+n+\dfrac12\right)-\left(-2(x-n)^2+(x-n)\right)=2\left(x-n-\dfrac12\right)^2\ge0$이므로, $n\le x\le n+\dfrac12$에서의 곡선은 항상 $x=n+\dfrac12$에서의 접선 아래에 놓인다. [문제 2-ⅲ]에서 이미 보였듯이, 같은 한 주기 $n\le x\le n+1$ 안에서는 점 $\mathrm{D}$가 움직이는 범위가 선분 $\mathrm{M}_n\mathrm{Q}_n$이다. 따라서 $n\le x\le n+\dfrac12$에서 생기는 모든 선분 $\mathrm{CD}$의 아래쪽 끝점 $\mathrm{D}$는 모두 선분 $\mathrm{M}_n\mathrm{Q}_n$ 위에 있다.
      criteria: ['iv.M1']
    - id: ivb-2
      content: |
        한편 $n+\dfrac12\le x\le1$에서 생기는 도형 $T_n$은, 위쪽 경계인 직선 $y=-x+n+\dfrac12$과 아래쪽 경계인 직선 $\mathrm{AB}$ 및 직선 $y=x-n-1$ 사이의 영역을 포함한다. 특히 점 $\left(n+\dfrac12,0\right)$, $\mathrm{M}_n$, $\mathrm{Q}_n$을 꼭짓점으로 하는 삼각형 전체가 $T_n$ 안에 들어간다. 실제로 $\alpha(\mathrm{Q}_n)\le x\le n+\dfrac12$에서는 $T_n$의 아래 경계가 직선 $y=x-n-1$인데, 이 직선은 점 $\mathrm{Q}_n$과 점 $\left(n+\dfrac12,0\right)$을 이은 선분보다 더 아래에 있으므로, 그 삼각형이 통째로 $T_n$에 포함된다. 또 $n\le x\le n+\dfrac12$에서의 곡선은 $x$축 위쪽에 있고, 방금 확인한 것처럼 직선 $y=-x+n+\dfrac12$ 아래에 있으므로 $n\le x\le n+\dfrac12$인 모든 점 $\mathrm{C}$는 이 삼각형 안에 있다. 삼각형 내부의 임의의 두 점을 이은 선분은 다시 삼각형 안에 놓여 있으므로, 밑변 $\mathrm{M}_n\mathrm{Q}_n$ 위의 점 $\mathrm{D}$와 삼각형 안의 점 $\mathrm{C}$를 이은 선분 $\mathrm{CD}$도 삼각형 안에 놓인다. 따라서 $n\le x\le n+\dfrac12$에서 생기는 선분들은 모두 이미 $T_n$ 안에 들어 있으며, 곧 $R_n$은 $T_n$ 안에 들어있게 된다.
      criteria: ['iv.M1']
    - id: ivb-3
      content: |
        ② 다음으로 도형 $T_n$이 도형 $T_{n+1}$에 포함됨을 보이자. $x=n+\dfrac32$에서의 접선은 $y=-x+n+\dfrac32$이다. $n+\dfrac12\le x\le n+1$에서의 곡선 $y=2(x-n)^2-3(x-n)+1$과 방금 구한 접선을 비교하면 $\left(-x+n+\dfrac32\right)-\left(2(x-n)^2-3(x-n)+1\right)=\dfrac12+2(x-n)(1-(x-n))>0$이 성립한다. 따라서 $n+\dfrac12\le x\le n+1$에서 생긴 도형은 $n+\dfrac32\le x\le n+2$에서 생긴 도형 안에 들어간다. 결국 전체 도형은 $2026+\dfrac12\le x\le2027$에서 생기는 도형 하나와 같다.
      criteria: ['iv.M1']
    - id: ivb-4
      content: |
        이제 일반적인 $n$에 대해 $T_n$의 넓이 $S_n$을 구하자. $T_n$은 다음과 같이 세 부분으로 나누어 적분할 수 있다.
        $$S_n=\int_{\alpha(\mathrm{M}_n)}^{\alpha(\mathrm{Q}_n)}\left\{\left(-x+n+\frac12\right)-\left(-\frac43x-1\right)\right\}dx+\int_{\alpha(\mathrm{Q}_n)}^{n+\frac12}\left\{\left(-x+n+\frac12\right)-(x-n-1)\right\}dx+\int_{n+\frac12}^{n+1}\left\{\left(2(x-n)^2-3(x-n)+1\right)-(x-n-1)\right\}dx$$
      criteria: ['iv.M2']
    - id: ivb-5
      content: |
        여기서 $\alpha(\mathrm{M}_n)=-3n-\dfrac92$, $\alpha(\mathrm{Q}_n)=\dfrac{3n}{7}$이므로 계산하면 $S_n=\dfrac{16}{7}n^2+6n+\dfrac{95}{24}$를 얻는다. 따라서 $n=2026$을 대입하면 $S_{2026}=\dfrac{1578238457}{168}$이 된다. 따라서 선분 $\mathrm{CD}$가 이루는 도형의 면적은 $\dfrac{1578238457}{168}$이다.
      criteria: ['iv.A1']
