    source_flow: 2027 모의논술 해설지 별해 [문제3-ⅲ] p.22(해설 20/20)
    method_no: 2
    key_idea: 원 해설 별해 — $k=4m+1,4m+2$이면 $n+2m<a_n<n+2m+1$, $k=4m+3$이면 $n+2m+1<a_n<n+2m+2$로 정수 사이에 가두고 위쪽 정수와의 거리 $\le\tfrac13$ 조건을 본다.
    steps:
    - id: iiic-1
      content: |
        $a_n=\sqrt{n^2+(4m+1)n}$ $(n\ge500,\ 5\le m\le10)$이면 $n+2m<a_n<n+2m+1$이다. 따라서 $\boxed{3}$번 구간에 들어가려면 $n$은 짝수이고, $(n+2m+1)-a_n\le\dfrac13$이어야 한다. 조건을 만족하는 $n$은 존재하지 않는다. 따라서 $\displaystyle\sum_{m=5}^{10}A_{4m+1}=0$이다.
        $a_n=\sqrt{n^2+(4m+3)n}$ $(n\ge500,\ 5\le m\le10)$이면 $n+2m+1<a_n<n+2m+2$이다. 따라서 $\boxed{3}$번 구간에 들어가려면 $n$은 홀수이고, $(n+2m+2)-a_n\le\dfrac13$이어야 한다. 조건을 만족하는 $n$은 존재하지 않는다. 따라서 $\displaystyle\sum_{m=5}^{10}A_{4m+3}=0$이다.
        $a_n=\sqrt{n^2+(4m+2)n}$ $(n\ge500,\ 5\le m\le10)$이면 $n+2m<a_n<n+2m+1$이다. 따라서 $\boxed{3}$번 구간에 들어가려면 $n$은 짝수이고, $(n+2m+1)-a_n\le\dfrac13$이어야 한다. 따라서 $n\ge6m^2+4m+\dfrac23$인 짝수이다. (이후 예시답안과 동일)
