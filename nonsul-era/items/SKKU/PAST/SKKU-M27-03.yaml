intent: |
  수직선의 0 이상인 부분을 길이가 1/3인 구간들로 나누고 각 구간에 1번부터 6번까지의 번호를 반복하여 부여한 상황을 바탕으로, 수열 $\sqrt{n^2+kn}$의 각 항이 어느 번호의 구간에 속하는지를 판단하는 문제이다. 완전제곱식을 활용하여 수열을 $n+\tfrac{k}{2}$와 비교하고, 두 값의 차이를 추정함으로써 각 항이 들어가는 구간을 판별하거나 조건을 만족하는 항의 개수를 구하는 능력을 평가한다(해설지 개요 요약).
key_idea: |
  $d_n=n+\tfrac{k}{2}-\sqrt{n^2+kn}=\dfrac{k^2/4}{n+\tfrac{k}{2}+\sqrt{n^2+kn}}$은 $n\ge500$, $k\le43$이면 $0<d_n<\tfrac12$이다. 번호는 길이 $2$를 주기로 반복되므로 $\sqrt{n^2+kn}$에서 짝수를 빼어 $[0,2)$로 옮긴 값으로 번호를 판정한다.
stuck: |
  번호 배열이 길이 $2$ 주기라는 점과 $n$의 홀짝에 따라 빼는 짝수($n+20$, $n+19$ 등)를 고르는 것
