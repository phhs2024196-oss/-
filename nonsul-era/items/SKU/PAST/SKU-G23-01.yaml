stimuli: []
stem: |
  1. 부등식 $-\log_{\frac15}\lvert x\rvert+\log_5(x+2)\le4$를 만족시키는 모든 정수 $x$의 개수를 구하는 풀이 과정과 답을 쓰시오. (10점)
subparts:
- id: '1'
  stem: |
    (10점)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '25'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        로그의 성질 $\log_{a^m}b^n=\dfrac nm\log_ab$를 이용하면 $-\log_{\frac15}\lvert x\rvert=\log_{5^{-1}}\lvert x\rvert^{-1}=\log_5\lvert x\rvert$이므로 주어진 부등식은 $\log_5\lvert x\rvert+\log_5(x+2)\le4$이다.
      source_flow: 예시답안 p.46
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        진수조건에서 $\lvert x\rvert>0$이고 $x+2>0$이므로 (i) $x>0$ 또는 (ii) $-2<x<0$이다.
      source_flow: 예시답안 p.46
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        (i) $x>0$일 때 $\log_5x(x+2)\le4\iff x(x+2)\le5^4\iff x^2+2x-5^4\le0$이다.
      source_flow: 예시답안 p.46
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        근의 공식으로 $-1-\sqrt{5^4+1}\le x\le-1+\sqrt{5^4+1}$이고 $x>0$과 결합하면 $0<x\le-1+\sqrt{5^4+1}$이다.
      source_flow: 예시답안 p.46
      criteria:
      - 1.A1
    - id: 1b-5
      content: |
        $\sqrt{5^4}<\sqrt{5^4+1}<\sqrt{26^2}$이므로 $\sqrt{5^4+1}=25.\cdots$이고, 이 범위의 정수는 $x=1$부터 $24$까지로 24개이다.
      source_flow: 예시답안 p.46
      criteria:
      - 1.A2
    - id: 1b-6
      content: |
        (ii) $-2<x<0$일 때 $\log_5\{-x(x+2)\}\le4\iff-x(x+2)\le5^4\iff x^2+2x+5^4\ge0$이다.
      source_flow: 예시답안 p.46
      criteria:
      - 1.M4
    - id: 1b-7
      content: |
        이 이차부등식의 해는 모든 실수이다.
      source_flow: 예시답안 p.46
      criteria:
      - 1.A3
    - id: 1b-8
      content: |
        $-2<x<0$과 결합하면 만족하는 정수는 $x=-1$이고 정수 개수는 1개이다.
      source_flow: 예시답안 p.46
      criteria:
      - 1.A4
    - id: 1b-9
      content: |
        (i), (ii)에 의하여 구하는 정수 $x$의 개수는 25개이다.
      source_flow: 예시답안 p.46
      criteria:
      - 1.A5
