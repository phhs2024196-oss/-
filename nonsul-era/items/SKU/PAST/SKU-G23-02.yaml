stem: |
  2. 구간 $0\le x<2\pi$에서 $x$에 대한 방정식 $\lvert\cos3x\rvert=\dfrac{\sqrt3}{2}$의 서로 다른 실근의 개수는 $a$개이고, 모든 실근의 합이 $b\pi$라고 할 때, $\dfrac ba$의 값을 구하는 풀이 과정과 답을 쓰시오. (10점)
