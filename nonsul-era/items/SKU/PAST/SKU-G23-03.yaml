stem: |
  3. 수열 $\{a_k\}$에 대하여, $a_1=n$, $a_n=n$이고,

  $$\sum_{k=2}^{n-1}a_k=2\times(n-1)+3\times(n-2)+\cdots+(n-2)\times3+(n-1)\times2=\dfrac{n(n+a)(n+b)}{6}$$

  가 성립할 때, 상수 $a$, $b$에 대하여 $a+b$의 값을 구하는 풀이 과정과 답을 쓰시오. (10점)
