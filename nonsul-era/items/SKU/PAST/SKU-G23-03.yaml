  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        수열 $2\times(n-1),\ 3\times(n-2),\ 4\times(n-3),\ \cdots$의 제 $k$항은 $a_k=k\{n-(k-1)\}=k(n-k+1)$이다.
      source_flow: 예시답안 p.57-60
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        주어진 합은 수열 $\{a_k\}$의 둘째 항부터 제 $n-1$항까지의 합과 같으므로 $\displaystyle\sum_{k=2}^{n-1}a_k=\sum_{k=2}^{n-1}k(n-k+1)=\sum_{k=2}^{n-1}(nk-k^2+k)$이고 $\displaystyle\sum_{k=2}^{n-1}(nk-k^2+k)=\sum_{k=1}^{n}(nk-k^2+k)-(a_1+a_n)$이 성립한다.
      source_flow: 예시답안 p.57-60
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\displaystyle\sum_{k=1}^{n}(nk-k^2+k)=n\times\dfrac{n(n+1)}{2}-\dfrac{n(n+1)(2n+1)}{6}+\dfrac{n(n+1)}{2}=\dfrac{n(n+1)(n+2)}{6}$이고, $a_1+a_n=2n$이다.
      source_flow: 예시답안 p.57-60
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        그러므로 $\displaystyle\sum_{k=2}^{n-1}(nk-k^2+k)=\dfrac{n(n+1)(n+2)}{6}-2n=\dfrac{n(n-2)(n+5)}{6}$이다.
      source_flow: 예시답안 p.57-60
      criteria:
      - 1.A1
    - id: 1b-5
      content: |
        따라서 $a=-2,\ b=5$ 또는 $a=5,\ b=-2$이므로 $a+b=3$이다.
      source_flow: 예시답안 p.57-60
      criteria:
      - 1.A2
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    steps:
    - id: 1c-1
      content: |
        수열 $2\times(n-1),\ 3\times(n-2),\ 4\times(n-3),\ \cdots$의 제 $k$항을 $a_k=(k+1)(n-k)=nk-k^2+n-k$로 놓는다.
      source_flow: 예시답안 p.57-60
    - id: 1c-2
      content: |
        주어진 합은 $\displaystyle\sum_{k=1}^{n-2}a_k=\sum_{k=1}^{n-2}(k+1)(n-k)=\sum_{k=1}^{n-2}(nk-k^2+n-k)$이다.
      source_flow: 예시답안 p.57-60
    - id: 1c-3
      content: |
        거듭제곱의 합 공식으로 $\dfrac{(n-2)(n-1)}{2}\cdot n-\dfrac{(n-2)(n-1)(2n-3)}{6}+n(n-2)-\dfrac{(n-2)(n-1)}{2}=\dfrac{n(n-2)(n-1)}{6}+\dfrac{6n(n-2)}{6}=\dfrac{n(n-2)(n+5)}{6}$이다.
      source_flow: 예시답안 p.57-60
    - id: 1c-4
      content: |
        따라서 $a=-2,\ b=5$ 또는 $a=5,\ b=-2$이므로 $a+b=3$이다.
      source_flow: 예시답안 p.57-60
  # 채점기준: 위는 채점기준 (1). 채점기준 (2)(둘째 방법): 일반항 $a_k=(k+1)(n-k)$ 2점 / $\sum_{k=1}^{n-2}$로 표현 2점 / 거듭제곱 합 공식으로 전개·정리 4점 / 답 2점.
