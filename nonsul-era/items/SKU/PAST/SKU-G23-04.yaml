  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=ax+b$ ($a$, $b$는 상수이고 $a\ne0$)라 하자. $\displaystyle\lim_{x\to1}f(x)=2$에서 $\displaystyle\lim_{x\to1}f(x)=\lim_{x\to1}(ax+b)=a+b=2$ … ①
      source_flow: 예시답안 p.62
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to1}\dfrac{\{f(x)\}^2-4}{\sqrt{f(-x)}-2}=k$에서 $x\to1$일 때 (분자)$\to0$이고 0이 아닌 극한값이 존재하므로 (분모)$\to0$이어야 한다. 즉 $\displaystyle\lim_{x\to1}\sqrt{f(-x)}-2=\sqrt{f(-1)}-2=0$이므로 $f(-1)=4$이다.
      source_flow: 예시답안 p.62
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $f(-1)=-a+b=4$에서 $a-b=-4$ … ②. ①, ②를 연립하면 $a=-1,\ b=3$이므로 $f(x)=-x+3$이다.
      source_flow: 예시답안 p.62
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $\displaystyle k=\lim_{x\to1}\dfrac{\{f(x)\}^2-4}{\sqrt{f(-x)}-2}=\lim_{x\to1}\dfrac{(-x+3)^2-4}{\sqrt{x+3}-2}=\lim_{x\to1}\dfrac{x^2-6x+5}{\sqrt{x+3}-2}=\lim_{x\to1}\dfrac{(x-1)(x-5)(\sqrt{x+3}+2)}{(\sqrt{x+3}-2)(\sqrt{x+3}+2)}=\lim_{x\to1}(x-5)(\sqrt{x+3}+2)=-4\times(\sqrt4+2)=-16$ … ③
      source_flow: 예시답안 p.62
      criteria:
      - 1.M2
    - id: 1b-5
      content: |
        따라서 ①, ③에 의해 $\dfrac{k}{a+b}=-\dfrac{16}{2}=-8$이다.
      source_flow: 예시답안 p.62
      criteria:
      - 1.A2
