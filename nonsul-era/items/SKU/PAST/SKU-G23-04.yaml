stimuli: []
stem: |
  4. $a$, $b$가 상수이고 일차함수 $f(x)=ax+b$가

  $$\lim_{x\to1}f(x)=2,\quad\lim_{x\to1}\dfrac{\{f(x)\}^2-4}{\sqrt{f(-x)}-2}=k\ (\text{단, }k\ne0)$$

  를 만족시킬 때, 상수 $k$에 대해 $\dfrac{k}{a+b}$의 값을 구하는 풀이 과정과 답을 쓰시오. (10점)
