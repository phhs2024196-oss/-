  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$가 원점을 지나므로 $f(0)=0$이다.
      source_flow: 예시답안 p.65-66
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $f(x)$가 닫힌구간 $\left[0,\dfrac43\right]$에서 연속이고 열린구간 $\left(0,\dfrac43\right)$에서 미분가능하므로 평균값정리에 의하여 $\dfrac{f\left(\frac43\right)-f(0)}{\frac43-0}=f'(c)$인 상수 $c$가 열린구간 $\left(0,\dfrac43\right)$에 적어도 하나 존재한다.
      source_flow: 예시답안 p.65-66
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        모든 실수 $x$에 대하여 $\lvert f'(x)\rvert\le9$이므로 $\lvert f'(c)\rvert\le9$이다. 그러므로 $-9\le\dfrac{f\left(\frac43\right)}{\frac43}\le9$, 즉 $-12=-9\cdot\dfrac43\le f\left(\dfrac43\right)\le9\cdot\dfrac43=12$이다.
      source_flow: 예시답안 p.65-66
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $f(x)=\pm9x$가 조건을 만족하므로 $M=12,\ m=-12$이다. 그러므로 $M^2-mM+m^2=12^2-(-12)(12)+(-12)^2=144\cdot3=432$이다.
      source_flow: 예시답안 p.65-66
      criteria:
      - 1.A1
  # 채점기준: 위는 채점기준 (1). 채점기준 (2): 평균값정리 적용과 $f'(c)$ 식 5점 / 범위 $-12\le f\left(\frac43\right)\le12$ 2점 / $M$, $m$과 432 3점.
