stem: |
  5. 다음 조건 (ㄱ)과 (ㄴ)을 동시에 만족시키는 모든 다항함수 $f(x)$에 대하여 함수값 $f\left(\dfrac43\right)$의 최댓값이 $M$이고, 최솟값이 $m$일 때, $M^2-mM+m^2$의 값을 구하는 풀이과정과 그 값을 쓰시오.(10점)

  (ㄱ) 함수 $y=f(x)$의 그래프가 원점을 지난다.

  (ㄴ) 모든 실수 $x$에 대하여 $\lvert f'(x)\rvert\le9$를 만족한다.
