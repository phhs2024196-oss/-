stimuli: []
stem: |
  6. 함수 $y=f(x)=x^2-4x-1$의 그래프를 $x$축에 관하여 대칭이동한 후에 $x$축의 방향으로 $-1$만큼, $y$축의 방향으로 $3$만큼 평행이동시키면 함수 $y=g(x)$의 그래프와 일치한다. 이 때, 두 곡선 $y=f(x)$와 $y=g(x)$로 둘러싸인 부분의 넓이를 구하는 풀이 과정과 그 넓이를 쓰시오. (10점)
