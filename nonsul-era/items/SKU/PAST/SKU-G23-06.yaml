  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=f(x)=x^2-4x-1$의 그래프를 $x$축에 관하여 대칭이동하면 $-y=x^2-4x-1$, 즉 $y=-x^2+4x+1$이다. 이것을 $x$축의 방향으로 $-1$만큼, $y$축의 방향으로 $3$만큼 평행이동하면 $y-3=-(x+1)^2+4(x+1)+1=-x^2+2x+4$, 즉 $y=g(x)=-x^2+2x+7$이다.
      source_flow: 예시답안 p.68-70
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        두 곡선의 교점의 $x$좌표는 $x^2-4x-1=-x^2+2x+7$, 즉 $2x^2-6x-8=2(x^2-3x-4)=2(x+1)(x-4)=0$에서 $x=-1,\ 4$이다.
      source_flow: 예시답안 p.68-70
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        그러므로 구하는 넓이는 $\displaystyle\int_{-1}^{4}\lvert f(x)-g(x)\rvert\,dx=\int_{-1}^{4}\{g(x)-f(x)\}\,dx=\int_{-1}^{4}(-2x^2+6x+8)\,dx=\left[-\dfrac23x^3+3x^2+8x\right]_{-1}^{4}=\dfrac{125}{3}$이다.
      source_flow: 예시답안 p.68-70
      criteria:
      - 1.A1
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    steps:
    - id: 1c-1
      content: |
        (앞과 같이) $g(x)=-x^2+2x+7$이고 두 곡선의 교점의 $x$좌표는 $-1$, $4$이다.
      source_flow: 예시답안 p.68-70
    - id: 1c-2
      content: |
        $y=ax^2+bx+c$와 $y=a'x^2+b'x+c'$이 $x=\beta$, $x=\alpha$ ($\beta>\alpha$)에서 만날 때 두 곡선으로 둘러싸인 부분의 넓이는 $S=\dfrac{\lvert a-a'\rvert\lvert\beta-\alpha\rvert^3}{6}$이므로 $S=\dfrac{\lvert1-(-1)\rvert\lvert4-(-1)\rvert^3}{6}=\dfrac{2\cdot5^3}{6}=\dfrac{125}{3}$이다.
      source_flow: 예시답안 p.68-70
  # 채점기준: 위는 채점기준 (1). 채점기준 (2)(공식 이용): $g(x)$ 구하기 3점(대칭이동·평행이동 각 1점 포함) / 교점 $x=-1,4$ 3점 / 공식 $S=\dfrac{\lvert a-a'\rvert\lvert\beta-\alpha\rvert^3}{6}$ 대입으로 넓이 4점.
