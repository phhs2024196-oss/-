      points: 4
      evidence: $\cos\dfrac{\pi}{5}=\sin\dfrac{3\pi}{10}$로 바꾸어 $\sin x\ge\sin\dfrac{3\pi}{10}$ 꼴로 쓴 식이 있다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 사인 그래프와 직선의 교점 또는 대칭성으로 $\alpha=\dfrac{3\pi}{10}$, $\beta=\dfrac{7\pi}{10}$를 구했다.
      steps:
      - 1b-2
    - id: 1.A1
