stimuli: []
stem: |
  구간 $0\le x\le 2\pi$에서 부등식 $\sin x\ge\cos\dfrac{\pi}{5}$를 만족하는 모든 $x$의 값의 범위가 $\alpha\le x\le\beta$일 때, $\dfrac{\beta}{\alpha}$의 값을 구하는
subparts:
- id: '1'
  stem: |
    풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 7/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        식 변형: $\cos\dfrac{\pi}{5}=\sin\left(\dfrac{\pi}{2}-\dfrac{\pi}{5}\right)=\sin\dfrac{3\pi}{10}$이므로 주어진 부등식은 $\sin x\ge\sin\dfrac{3\pi}{10}$이다.
      source_flow: 예시답안 p.173
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $y=\sin x$의 그래프와 직선 $y=\sin\dfrac{3\pi}{10}$을 이용하면 부등식을 만족하는 $\alpha,\beta$는 평균값을 이용하여 $\dfrac{\alpha+\beta}{2}=\dfrac{\pi}{2}$이고 $\alpha=\dfrac{3\pi}{10}$이므로 $\beta=\dfrac{7\pi}{10}$이다.
        (별해) $\alpha=\dfrac{3\pi}{10}$를 이용하여 $\beta=\pi-\alpha=\pi-\dfrac{3}{10}\pi=\dfrac{7}{10}\pi$
      source_flow: 예시답안 p.173
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 $\dfrac{\beta}{\alpha}=\dfrac{7}{3}$이다.
      source_flow: 예시답안 p.173
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
