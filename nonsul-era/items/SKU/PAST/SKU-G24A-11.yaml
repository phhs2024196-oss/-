stem: |
  두 상수 $a,b\,(1<a<b)$에 대하여 좌표평면 위의 점 $A(a,\log_{3}a)$, $B(b,\log_{3}b)$를 지나는 직선의 $y$절편과 또 다른 두 점 $C(a,\log_{9}a)$, $D(b,\log_{9}b)$를 지나는 직선의 $y$절편이 서로 같다. 이때, 함수 $f(x)=a^{bx}+b^{ax}$에 대하여 $f(1)=32$이다. $f(2)$의 값을 구하는
subparts:
- id: '1'
  stem: |
    풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '512'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (i) 두 점 $A(a,\log_{3}a)$, $B(b,\log_{3}b)$를 지나는 직선의 방정식은 $y-\log_{3}a=\dfrac{\log_{3}b-\log_{3}a}{b-a}(x-a)$이고 $x=0$일 때 $y$값이 $y$절편이다. 이 절편값을 $\beta_{1}$이라 두면
        $$\beta_{1}=\dfrac{\log_{3}b-\log_{3}a}{b-a}(0-a)+\log_{3}a=\dfrac{-a\log_{3}\dfrac{b}{a}}{b-a}+\log_{3}a$$
        이다.
        (ii) (i)과 동일한 방법으로 두 점 $C(a,\log_{9}a)$, $D(b,\log_{9}b)$를 지나는 직선의 $y$절편값을 $\beta_{2}$라 두면
        $$\beta_{2}=\dfrac{\log_{9}b-\log_{9}a}{b-a}(0-a)+\log_{9}a=\dfrac{-a\log_{9}\dfrac{b}{a}}{b-a}+\log_{9}a$$
        이다.
      source_flow: 예시답안 p.176
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        (iii) 두 절편이 같다는 조건으로부터 $\beta_{1}=\beta_{2}$에서
        $$\dfrac{-a\log_{3}\dfrac{b}{a}}{b-a}+\log_{3}a=\dfrac{-a\log_{9}\dfrac{b}{a}}{b-a}+\log_{9}a$$
        이고 $\log_{3}a=\log_{9}a^{2}$, $\log_{3}\dfrac{b}{a}=\log_{9}\left(\dfrac{b}{a}\right)^{2}$를 이용하면
        $$\dfrac{a\log_{9}\left(\dfrac{b}{a}\right)^{2}-a\log_{9}\dfrac{b}{a}}{b-a}=\log_{9}a^{2}-\log_{9}a.$$
        위 식을 정리하면 $\dfrac{a\log_{9}\dfrac{b}{a}}{b-a}=\log_{9}a$이고 $\log_{9}\left(\dfrac{b}{a}\right)^{a}=\log_{9}a^{(b-a)}$이다. 따라서 $\left(\dfrac{b}{a}\right)^{a}=a^{(b-a)}$이며, 이 식을 간단히 정리하면 $b^{a}a^{-a}=a^{b}a^{-a}$이고 $b^{a}=a^{b}$이다.
      source_flow: 예시답안 p.176
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        함수 $f(x)=a^{bx}+b^{ax}$에서 $f(1)=32$이므로 $f(1)=a^{b}+b^{a}=32$이고 위 식의 결론을 이용하면 $a^{b}=b^{a}=16$이다.
      source_flow: 예시답안 p.176
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $f(2)=a^{2b}+b^{2a}=(a^{b})^{2}+(b^{a})^{2}=16^{2}+16^{2}=256+256=512$이다.
      source_flow: 예시답안 p.176
      criteria:
      - 1.A1
