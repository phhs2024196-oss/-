stimuli: []
stem: |
  $a_{1}=a\,(a>0)$, $a_{2}=-2$인 수열 $\{a_{n}\}$이 모든 자연수 $n$에 대하여 $a_{n+2}=a_{n+1}-a_{n}$을 만족시킨다. $\displaystyle\sum_{k=1}^{22}\lvert a_{k}\rvert=103$을 만족시키는 $a$의 값을 구하는
subparts:
- id: '1'
  stem: |
    풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_{1}=a\,(a>0)$, $a_{2}=-2$인 수열 $\{a_{n}\}$이 모든 자연수 $n$에 대하여 $a_{n+2}=a_{n+1}-a_{n}$을 만족하므로 수열의 귀납적 정의에 의해
        $a_{1}=a$, $a_{2}=-2$,
        $a_{3}=a_{2}-a_{1}=-2-a$,
        $a_{4}=a_{3}-a_{2}=(-2-a)-(-2)=-a$,
        $a_{5}=a_{4}-a_{3}=(-a)-(-2-a)=2$,
        $a_{6}=a_{5}-a_{4}=2-(-a)=2+a$,
        $a_{7}=a_{6}-a_{5}=(2+a)-a=a$,
        $a_{8}=a_{7}-a_{6}=a-(2+a)=-2$,
        $a_{9}=a_{8}-a_{7}=-2-a$, $\cdots$ 이다.
      source_flow: 예시답안 p.179
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이때 $a>0$이므로 $\lvert a_{1}\rvert=a$, $\lvert a_{2}\rvert=2$, $\lvert a_{3}\rvert=2+a$, $\lvert a_{4}\rvert=a$, $\lvert a_{5}\rvert=2$, $\lvert a_{6}\rvert=2+a$, $\cdots$ 이 성립한다.
      source_flow: 예시답안 p.179
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        즉, 자연수 $m$에 대하여 $\lvert a_{3m-2}\rvert=a$, $\lvert a_{3m-1}\rvert=2$, $\lvert a_{3m}\rvert=2+a$이다. (일반항 도출)
      source_flow: 예시답안 p.179
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서 $\displaystyle\sum_{k=1}^{22}\lvert a_{k}\rvert=\sum_{k=1}^{21}\lvert a_{k}\rvert+\lvert a_{22}\rvert=\sum_{k=1}^{21}\lvert a_{k}\rvert+\lvert a_{1}\rvert=7\times(a+2+2+a)+a=15a+28$이다.
      source_flow: 예시답안 p.179
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        $15a+28=103$에서 $a=5$이다.
      source_flow: 예시답안 p.179
      criteria:
      - 1.A1
