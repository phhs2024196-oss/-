stimuli:
- label: 조건
  body: |
    (가) 함수 $\lvert f(x)g(x)\rvert$는 실수 전체의 집합에서 연속이다.
    (나) $x<1$일 때 $f(x)g(x)=x^{2}-7$이고, $x>1$일 때 $\dfrac{g(x)}{f(x)}=3x-1$이다.
stem: |
  실수 전체의 집합에서 연속이고 모든 실수 $x$에 대하여 $f(x)>0$인 함수 $f(x)$와 $\displaystyle\lim_{x\to1+}g(x)>\lim_{x\to1-}g(x)$인 함수 $g(x)$가 있다. 두 함수 $f(x)$, $g(x)$가 다음 조건을 모두 만족시킬 때, $f(1)\times\left\{\displaystyle\lim_{x\to1+}g(x)-\lim_{x\to1-}g(x)\right\}$의 값을 구하는
subparts:
- id: '1'
  stem: |
    풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '12'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$는 실수 전체의 집합에서 연속이고 모든 실수 $x$에 대하여 $f(x)>0$이므로 $\lvert f(x)\rvert=f(x)$이다. 조건 (가)에서 $\lvert f(x)g(x)\rvert=f(x)\lvert g(x)\rvert$가 실수 전체의 집합에서 연속이고 연속함수 $f(x)$가 실수 전체의 집합에서 $f(x)>0$이므로 함수 $\dfrac{f(x)\lvert g(x)\rvert}{f(x)}=\lvert g(x)\rvert$도 실수 전체의 집합에서 연속이다.
      source_flow: 예시답안 p.182
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        즉, $\displaystyle\lim_{x\to1+}g(x)=a$, $\lim_{x\to1-}g(x)=b$라고 할 때 $\displaystyle\lim_{x\to1+}\lvert g(x)\rvert=\lvert a\rvert$, $\lim_{x\to1-}\lvert g(x)\rvert=\lvert b\rvert$이고 $\lvert a\rvert=\lvert b\rvert=\lvert g(1)\rvert$이다.
        $\displaystyle\lim_{x\to1+}g(x)>\lim_{x\to1-}g(x)$에서 $a>b$이므로 $a>0>b$이고 $b=-a$ $\cdots$ ①
      source_flow: 예시답안 p.182
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        조건 (나)에서 $\displaystyle\lim_{x\to1-}f(x)g(x)=\lim_{x\to1-}(x^{2}-7)=1-7=-6$, $\displaystyle\lim_{x\to1-}\lvert f(x)g(x)\rvert=6$이고 함수 $\lvert f(x)g(x)\rvert$는 $x=1$에서 연속이므로 $\lvert f(1)g(1)\rvert=f(1)\lvert g(1)\rvert=6$ $\cdots$ ②
      source_flow: 예시답안 p.182
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $\displaystyle\lim_{x\to1+}\dfrac{g(x)}{f(x)}=\lim_{x\to1+}(3x-1)=2$, $\displaystyle\lim_{x\to1+}\left\lvert\dfrac{g(x)}{f(x)}\right\rvert=2$이고 $\left\lvert\dfrac{g(x)}{f(x)}\right\rvert=\dfrac{\lvert g(x)\rvert}{f(x)}$는 $x=1$에서 연속이므로 $\dfrac{\lvert g(1)\rvert}{f(1)}=2$ $\cdots$ ③
      source_flow: 예시답안 p.182
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        ②, ③에서 $\lvert g(1)\rvert^{2}=12$이므로 $\lvert g(1)\rvert=2\sqrt{3}$이다. 이를 ②에 대입하면 $f(1)=\sqrt{3}$이다.
      source_flow: 예시답안 p.182
      criteria:
      - 1.M5
    - id: 1b-6
      content: |
        $\lvert a\rvert=\lvert b\rvert=\lvert g(1)\rvert=2\sqrt{3}$과 ①에서 $a=2\sqrt{3}$, $b=-2\sqrt{3}$이다. 따라서 $f(1)\times\left\{\displaystyle\lim_{x\to1+}g(x)-\lim_{x\to1-}g(x)\right\}=\sqrt{3}\times\{2\sqrt{3}-(-2\sqrt{3})\}=12$이다.
      source_flow: 예시답안 p.182
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: $f>0$과 (가)로부터 $\lvert g(x)\rvert$가 연속임을 밝혔다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $\lvert a\rvert=\lvert b\rvert$와 $a>b$로부터 $b=-a$를 이끌었다.
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: (나)와 연속성으로 $f(1)\lvert g(1)\rvert=6$을 얻었다.
      steps:
      - 1b-3
    - id: 1.M4
      mark_type: M
      points: 2
      evidence: $\left\lvert\dfrac{g(x)}{f(x)}\right\rvert$의 연속성으로 $\dfrac{\lvert g(1)\rvert}{f(1)}=2$를 얻었다.
      steps:
      - 1b-4
    - id: 1.M5
      mark_type: M
      points: 1
      evidence: $\lvert g(1)\rvert=2\sqrt{3}$, $f(1)=\sqrt{3}$을 구했다.
      steps:
      - 1b-5
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $a=2\sqrt{3}$, $b=-2\sqrt{3}$을 이용해 값 $12$를 적었다.
      depends_on:
      - 1.M5
      steps:
      - 1b-6
