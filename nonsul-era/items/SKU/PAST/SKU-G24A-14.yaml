stimuli:
- label: 조건
  body: |
    (가) $f(0)=0$
    (나) 모든 실수 $x$에 대하여
    $$\lim_{h\to0}\dfrac{f(x+h^{2}+h+1)f\left(\dfrac{h}{3}\right)-f(x+1)f\left(\dfrac{h}{3}\right)}{h^{2}}=x^{2}+\dfrac{4}{3}x+\dfrac{2}{3}$$
    이다.
stem: |
  최고차항의 계수가 1인 다항함수 $f(x)$가 다음 조건을 모두 만족시킬 때, $f(3)$의 값을 구하는
subparts:
- id: '1'
  stem: |
    풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '21'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{h\to0}\dfrac{f(x+h^{2}+h+1)f\left(\dfrac{h}{3}\right)-f(x+1)f\left(\dfrac{h}{3}\right)}{h^{2}}=\lim_{h\to0}\dfrac{f(x+h^{2}+h+1)-f(x+1)}{h}\times\dfrac{f\left(\dfrac{h}{3}\right)}{h}$
        $=\displaystyle\lim_{h\to0}\dfrac{f(x+h^{2}+h+1)-f(x+1)}{h^{2}+h}\times\dfrac{h^{2}+h}{h}\times\dfrac{f\left(\dfrac{h}{3}\right)-f(0)}{\dfrac{h}{3}}\times\dfrac{1}{3}$
        $=f'(x+1)\times1\times\dfrac{1}{3}\times f'(0)=\dfrac{1}{3}f'(x+1)\times f'(0)$
      source_flow: 예시답안 p.185
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(x)=x^{3}+ax^{2}+bx$로 놓으면 $f'(x)=3x^{2}+2ax+b$, $f'(0)=b$이므로
        $f'(x+1)\times f'(0)=\{3(x+1)^{2}+2a(x+1)+b\}b=3\left(x^{2}+\dfrac{4}{3}x+\dfrac{2}{3}\right)$
      source_flow: 예시답안 p.185
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        [방법 1] 정리하면 $3bx^{2}+(2a+6)bx+(3+2a+b)b=3x^{2}+4x+2$이므로 $3b=3$에서 $b=1$을 얻는다. 그러므로 $(2a+6)b=2a+6=4$에서 $a=-1$이고, $(3+2a+b)b=2$로 성립한다. 따라서 $f(x)=x^{3}-x^{2}+x$이고 $f(3)=3^{3}-3^{2}+3=21$이다.
        [방법 2] $3b=3$에서 $b=1$이다. $f'(1)\times f'(0)=2$, $(3+2a+b)b=2$, $3+2a+1=2$, $a=-1$이다. 따라서 $f(x)=x^{3}-x^{2}+x$이고, $f(3)=3^{3}-3^{2}+3=21$이다.
        [방법 3] $f'(x)f'(0)=3(x-1)^{2}+4(x-1)+2$, $(3x^{2}+2ax+b)b=3x^{2}-6x+3+4x-4+2$, $3b=3$이므로 $b=1$. $f'(1)f'(0)=f'(1)=2=3+2a+1$이므로 $a=-1$이다. 따라서 $f(x)=x^{3}-x^{2}+x$이고 $f(3)=3^{3}-3^{2}+3=21$이다.
      source_flow: 예시답안 p.185
      criteria:
      - 1.A1
