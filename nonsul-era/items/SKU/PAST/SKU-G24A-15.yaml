stimuli:
- label: 조건
  body: |
    (가) $\displaystyle\int\{f'(x)\}^{2}dx=\int(3x^{2}-2x-1)f'(x)dx$
    (나) $\displaystyle\int_{0}^{1}f(x)dx+\dfrac{11}{12}=\int_{0}^{2}f(x)dx$
stem: |
  상수가 아닌 다항함수 $f(x)$가 다음 조건을 모두 만족시킬 때, 두 도형 $y=f(x)$, $y=0$으로 둘러싸인 영역 중에서 구간 $[-1,1]$에 대응되는 유한한 영역의 넓이를 구하는
subparts:
- id: '1'
  stem: |
    풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 4/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)의 양변을 미분하면 $\{f'(x)\}^{2}=(3x^{2}-2x-1)f'(x)$, 즉 $f'(x)\{f'(x)-(3x^{2}-2x-1)\}=0$이다. 그러므로 $f'(x)=0$ 또는 $f'(x)=3x^{2}-2x-1$이다.
      source_flow: 예시답안 p.188
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(x)$는 다항함수이므로 $f(x)=C$($C$는 상수) 또는 $f(x)=\displaystyle\int(3x^{2}-2x-1)dx=x^{3}-x^{2}-x+C$이다.
      source_flow: 예시답안 p.188
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $f(x)$는 상수함수가 아니므로 $f(x)\ne C$이다. $f(x)=x^{3}-x^{2}-x+C$이면
        $\displaystyle\int_{0}^{1}(x^{3}-x^{2}-x+C)dx=\left[\dfrac{1}{4}x^{4}-\dfrac{1}{3}x^{3}-\dfrac{1}{2}x^{2}+Cx\right]_{0}^{1}=\dfrac{1}{4}-\dfrac{1}{3}-\dfrac{1}{2}+C=-\dfrac{7}{12}+C$
        $\displaystyle\int_{0}^{2}(x^{3}-x^{2}-x+C)dx=\left[\dfrac{1}{4}x^{4}-\dfrac{1}{3}x^{3}-\dfrac{1}{2}x^{2}+Cx\right]_{0}^{2}=4-\dfrac{8}{3}-2+2C=-\dfrac{2}{3}+2C$
        이므로 (나)에서 $-\dfrac{7}{12}+C+\dfrac{11}{12}=-\dfrac{2}{3}+2C$이고 $C=1$이다. 그러므로 $f(x)=x^{3}-x^{2}-x+1$
      source_flow: 예시답안 p.188
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        그런데 $f(x)=x^{3}-x^{2}-x+1=x^{2}(x-1)-(x-1)=(x-1)^{2}(x+1)$이므로 구간 $[-1,1]$에서 음이 아니다.
        [방법 1] 따라서 구하는 영역의 넓이는 $\displaystyle\int_{-1}^{1}f(x)dx=\int_{-1}^{1}(x^{3}-x^{2}-x+1)dx=\int_{-1}^{1}(-x^{2}+1)dx=\left[-\dfrac{1}{3}x^{3}+x\right]_{-1}^{1}=\dfrac{4}{3}$
        [방법 2] $\displaystyle\int_{-1}^{1}(x-1)^{2}(x+1)dx=\dfrac{\{1-(-1)\}^{4}}{12}=\dfrac{16}{12}=\dfrac{4}{3}$
      source_flow: 예시답안 p.188
      criteria:
      - 1.A1
