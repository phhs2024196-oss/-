stimuli: []
stem: |
  구간 $0\le x\le 2\pi$에서 방정식 $4\sin^2 x-3=0$과 부등식 $\sin x\cos x>0$을 동시에 만족하는 실수 $x$의 값을 두 근으로 하는 최고차항의 계수가 1인 이차방정식을 구하는 풀이 과정과 답을 쓰시오(10점).
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: x**2 - 5*pi*x/3 + 4*pi**2/9
    equivalents:
    - $x^2-\dfrac{5\pi}{3}x+\dfrac{4\pi^2}{9}=0$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        방정식 $4\sin^2 x-3=0$에서 $\sin x=t\ (-1\le t\le 1)$라고 두면 방정식은 $4t^2-3=0$이 된다. 방정식을 풀면 $\sin x=t=\dfrac{\sqrt{3}}{2},\ \sin x=t=-\dfrac{\sqrt{3}}{2}$이다.
      source_flow: 예시답안 p.204
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        부등식 $\sin x\cos x>0$을 만족하는 $x$값의 위치는 $\sin x$와 $\cos x$가 동일한 부호를 가져야 한다. 따라서 1사분면 또는 3사분면이다.
      source_flow: 예시답안 p.204
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\sin x=\dfrac{\sqrt{3}}{2}$인 1사분면의 $x=\dfrac{\pi}{3}$이고, $\sin x=-\dfrac{\sqrt{3}}{2}$인 3사분면의 $x=\pi+\dfrac{\pi}{3}=\dfrac{4\pi}{3}$이다.
      source_flow: 예시답안 p.204
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        두 $x$값을 각각 $\alpha_1, \alpha_2$라 두면 두 값을 근으로 하는 최고차항의 계수가 1인 이차방정식은 $\left(x-\dfrac{\pi}{3}\right)\left(x-\dfrac{4\pi}{3}\right)=x^2-\dfrac{5\pi}{3}x+\dfrac{4\pi^2}{9}=0$이다.
      source_flow: 예시답안 p.204
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $\sin x=t$로 치환하여 $4t^2-3=0$을 세우고 $\sin x=\pm\dfrac{\sqrt{3}}{2}$를 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $\sin x\cos x>0$이 $\sin x$와 $\cos x$가 같은 부호, 곧 제1사분면 또는 제3사분면임을 밝혔다.
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: 조건을 만족하는 $x=\dfrac{\pi}{3},\ \dfrac{4\pi}{3}$를 구했다.
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: 두 값을 근으로 하는 이차방정식 $x^2-\dfrac{5\pi}{3}x+\dfrac{4\pi^2}{9}=0$을 구했다.
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-4
