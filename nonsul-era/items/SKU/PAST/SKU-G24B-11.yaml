stimuli: []
stem: |
  직선 $y=-4x+k$가 두 함수 $y=\left(\dfrac{3}{2}\right)^{x+1}-1,\ y=\left(\dfrac{3}{2}\right)^{x+3}+\dfrac{5}{2}$의 그래프와 만나는 두 점을 각각 $P, Q$라 하자. $\overline{PQ}=\sqrt{17}$일 때, 상수 $k$의 값을 구하는 풀이 과정과 답을 쓰시오(10점).
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 점 $P, Q$의 $x$좌표를 각각 $p, q\ (q<p)$라 하면, 두 점 $P, Q$는 직선 $y=-4x+k$위의 점이므로 $P(p,-4p+k),\ Q(q,-4q+k)$로 놓을 수 있다. 이때 $\overline{PQ}=\sqrt{17}$이고 $\overline{PQ}^2=17$이므로 거리공식을 이용하면 $(p-q)^2+(-4p+4q)^2=17$이고 이로부터 $(p-q)^2=1$이다. 따라서 $p-q=1,\ p=q+1$이다.
      source_flow: 예시답안 p.208
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        점 $P$는 함수 $y=\left(\dfrac{3}{2}\right)^{x+1}-1$ 위의 점이므로 $\left(\dfrac{3}{2}\right)^{p+1}-1=-4p+k$이고, 점 $Q$는 함수 $y=\left(\dfrac{3}{2}\right)^{x+3}+\dfrac{5}{2}$ 위의 점이므로 $\left(\dfrac{3}{2}\right)^{q+3}+\dfrac{5}{2}=-4q+k$이다.
      source_flow: 예시답안 p.208
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        위의 두 식 및 $p-q=1$을 이용하면 $\left(\dfrac{3}{2}\right)^{p+1}-1=-4p+k\iff\left(\dfrac{3}{2}\right)^{q+2}-1=-4(q+1)+k$, $\left(\dfrac{3}{2}\right)^{q+3}+\dfrac{5}{2}=-4q+k$이 되고 방정식을 풀면 $\left(\dfrac{3}{2}\right)^{q+2}\left(\dfrac{3}{2}-1\right)+\dfrac{7}{2}=4$이고 이로부터 $q=-2$이다.
      source_flow: 예시답안 p.208
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        $\left(\dfrac{3}{2}\right)^{q+3}+\dfrac{5}{2}=-4q+k$에 $q=-2$를 대입하면 $\left(\dfrac{3}{2}\right)^{-2+3}+\dfrac{5}{2}=8+k$이고 $k=-4$이다.
      source_flow: 예시답안 p.208
      criteria:
      - 1.A2
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    key_idea: 직선의 기울기 $-4$와 $\overline{PQ}=\sqrt{17}$로부터 $Q=(\alpha-1,\beta+4)$로 놓는다.
    steps:
    - id: 1c1-1
      content: |
        두 점 $P, Q$ 사이의 거리가 $\sqrt{17}$이고 직선의 기울기가 $-4$이므로 피타고라스 정리에 의하여 밑변은 1이고 높이가 4이며 빗변이 $\sqrt{17}$이다. 즉, $x$좌표 간 차이는 1이고 $y$좌표 간 차이는 4이다. 따라서 $P=(\alpha,\beta)$라 두면 $Q=(\alpha-1,\beta+4)$라고 놓을 수 있다.
      source_flow: 예시답안 p.210
      criteria: []
    - id: 1c1-2
      content: |
        점 $P$의 좌표를 $y=\left(\dfrac{3}{2}\right)^{x+1}-1$에 대입하면 $\beta=\left(\dfrac{3}{2}\right)^{\alpha+1}-1\cdots$ ①, 점 $Q$의 좌표를 $y=\left(\dfrac{3}{2}\right)^{x+3}+\dfrac{5}{2}$에 대입하면 $\beta+4=\left(\dfrac{3}{2}\right)^{\alpha+2}+\dfrac{5}{2}\cdots$ ②
      source_flow: 예시답안 p.210
      criteria: []
    - id: 1c1-3
      content: |
        ② $-$ ①을 하면 $\left(\dfrac{3}{2}\right)^{\alpha+2}+\dfrac{5}{2}-\left(\dfrac{3}{2}\right)^{\alpha+1}+1=4$이고 $\left(\dfrac{3}{2}\right)^{\alpha+1}=1$이다. 따라서 $\alpha=-1,\ \beta=0$(①식에 $\alpha$를 대입)이다.
      source_flow: 예시답안 p.210
      criteria: []
    - id: 1c1-4
      content: |
        점 $P(\alpha,\beta)$는 직선 $y=-4x+k$ 위에 있으므로 이것을 직선 $y=-4x+k$에 대입하면 $k=-4$이다.
      source_flow: 예시답안 p.210
      criteria: []
