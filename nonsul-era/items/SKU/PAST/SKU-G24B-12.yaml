stem: |
  수열 $\{a_n\}$이 첫째항이 1, 공차가 4인 등차수열일 때, $\displaystyle\sum_{k=1}^{20}\dfrac{1}{\sqrt{a_k}+\sqrt{a_{k+1}}}$의 값을 구하는 풀이 과정과 답을 쓰시오(10점).
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        수열 $\{a_n\}$이 첫째항이 1, 공차가 4인 등차수열이므로 일반항은 $a_n=1+(n-1)\times 4=4n-3$이다.
      source_flow: 예시답안 p.213
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $\displaystyle\sum_{k=1}^{20}\dfrac{1}{\sqrt{a_k}+\sqrt{a_{k+1}}}=\dfrac{1}{\sqrt{a_1}+\sqrt{a_2}}+\dfrac{1}{\sqrt{a_2}+\sqrt{a_3}}+\cdots+\dfrac{1}{\sqrt{a_{20}}+\sqrt{a_{21}}}$이다.
      source_flow: 예시답안 p.213
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        이 식을 유리화하면 $\dfrac{\sqrt{a_2}-\sqrt{a_1}}{a_2-a_1}+\dfrac{\sqrt{a_3}-\sqrt{a_2}}{a_3-a_2}+\cdots+\dfrac{\sqrt{a_{21}}-\sqrt{a_{20}}}{a_{21}-a_{20}}$이다.
      source_flow: 예시답안 p.213
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        이때 수열 $\{a_n\}$은 공차가 4인 등차수열이므로 $a_2-a_1=a_3-a_2=\cdots=a_{21}-a_{20}=4$이다.
      source_flow: 예시답안 p.213
      criteria:
      - 1.B2
    - id: 1b-5
      content: |
        따라서 $\dfrac{\sqrt{a_2}-\sqrt{a_1}}{a_2-a_1}+\cdots+\dfrac{\sqrt{a_{21}}-\sqrt{a_{20}}}{a_{21}-a_{20}}=\dfrac{\sqrt{a_2}-\sqrt{a_1}}{4}+\dfrac{\sqrt{a_3}-\sqrt{a_2}}{4}+\cdots+\dfrac{\sqrt{a_{21}}-\sqrt{a_{20}}}{4}=\dfrac{\sqrt{a_{21}}-\sqrt{a_1}}{4}$
      source_flow: 예시답안 p.213
      criteria:
      - 1.M3
    - id: 1b-6
      content: |
        $a_n=4n-3$에서 $a_1=1,\ a_{21}=4\times 21-3=81$
      source_flow: 예시답안 p.213
      criteria:
      - 1.B3
    - id: 1b-7
      content: |
        주어진 식의 값은 $\dfrac{\sqrt{81}-\sqrt{1}}{4}=\dfrac{9-1}{4}=2$이다.
      source_flow: 예시답안 p.213
      criteria:
      - 1.A1
