stimuli: []
stem: |
  함수 $f(x)$가 실수 전체의 집합에서 연속이고 모든 실수 $x$에 대하여
  $(x-1)(x-3)f(x)=(x-1)(x^2+ax+b)$
  를 만족시킨다. $f(1)=2$일 때, $f(3)$의 값을 구하는 풀이 과정과 답을 쓰시오(10점).
  (단, $a, b$는 상수이다.)
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $x\ne 1,\ x\ne 3$일 때, $f(x)=\dfrac{(x-1)(x^2+ax+b)}{(x-1)(x-3)}=\dfrac{x^2+ax+b}{x-3}$이다.
      source_flow: 예시답안 p.216
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        함수 $f(x)$는 $x=1$에서 연속이므로 $\displaystyle\lim_{x\to 1}f(x)=f(1)=2$이다.
      source_flow: 예시답안 p.216
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        즉, $\displaystyle\lim_{x\to 1}\dfrac{x^2+ax+b}{x-3}=2$이므로 $\dfrac{1+a+b}{1-3}=2$, $a+b=-5\cdots$ (1)
      source_flow: 예시답안 p.216
      criteria:
      - 1.A1
    - id: 1b-4
      content: |
        함수 $f(x)$는 $x=3$에서 연속이므로 $\displaystyle\lim_{x\to 3}f(x)=f(3)$이다.
      source_flow: 예시답안 p.216
      criteria:
      - 1.M3
    - id: 1b-5
      content: |
        $\displaystyle\lim_{x\to 3}\dfrac{x^2+ax+b}{x-3}=f(3)$에서 $x\to 3$일 때 (분모) $\to 0$이고 극한값이 존재하므로 (분자) $\to 0$이어야 한다.
      source_flow: 예시답안 p.216
      criteria:
      - 1.M4
    - id: 1b-6
      content: |
        즉, $\displaystyle\lim_{x\to 3}(x^2+ax+b)=9+3a+b=0$에서 $3a+b=-9\cdots$ (2)이다.
      source_flow: 예시답안 p.216
      criteria:
      - 1.A2
    - id: 1b-7
      content: |
        (1)과 (2)에서 $a=-2,\ b=-3$이다.
      source_flow: 예시답안 p.216
      criteria:
      - 1.A3
    - id: 1b-8
      content: |
        따라서 $f(3)=\displaystyle\lim_{x\to 3}\dfrac{x^2-2x-3}{x-3}=\lim_{x\to 3}\dfrac{(x+1)(x-3)}{x-3}=\lim_{x\to 3}(x+1)=3+1=4$이다.
      source_flow: 예시답안 p.216
      criteria:
      - 1.A4
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    key_idea: $x\ne 1$에서 양변을 $x-1$로 나눈 식 $(x-3)f(x)=x^2+ax+b$가 연속성에 의해 $x=3$, $x=1$에서도 성립함을 이용한다.
    steps:
    - id: 1c1-1
      content: |
        $(x-1)(x-3)f(x)=(x-1)(x^2+ax+b)$에서 실수 전체의 집합에서 연속이므로 $x\ne 1$일 때 양변을 $(x-1)$로 나누면 $(x-3)f(x)=x^2+ax+b$이다.
      source_flow: 예시답안 p.217
      criteria: []
    - id: 1c1-2
      content: |
        $x$에 3을 대입하면 $0=9+3a+b$ 성립한다. $3a+b=-9\cdots$ ①
      source_flow: 예시답안 p.217
      criteria: []
    - id: 1c1-3
      content: |
        $x$에 1을 대입하면 $-2f(1)=1+a+b$, $a+b=-5\cdots$ ②
      source_flow: 예시답안 p.217
      criteria: []
    - id: 1c1-4
      content: |
        ①과 ②에서 $a=-2,\ b=-3$이다.
      source_flow: 예시답안 p.217
      criteria: []
    - id: 1c1-5
      content: |
        따라서 $f(3)=\displaystyle\lim_{x\to 3}\dfrac{x^2-2x-3}{x-3}=\lim_{x\to 3}\dfrac{(x+1)(x-3)}{x-3}=\lim_{x\to 3}(x+1)=3+1=4$이다.
      source_flow: 예시답안 p.217
      criteria: []
