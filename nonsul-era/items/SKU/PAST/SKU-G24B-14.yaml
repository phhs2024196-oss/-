stimuli: []
stem: |
  삼차함수 $f(x)$가 다음 조건을 모두 만족시킬 때, $\displaystyle\int_0^2 f(x+2)dx$의 값을 구하는 풀이 과정과 답을 쓰시오(10점).
  (가) 함수 $y=f(x)$의 그래프는 원점에서 $x$축에 접한다.
  (나) 함수 $y=f(x)$의 그래프 위의 점 $(-1,f(-1))$에서의 접선의 기울기는 3이다.
  (다) 함수 $y=f(x)$의 그래프 위의 점 $(1,f(1))$에서의 접선의 기울기는 9이다.
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '148'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가)에 의하여 $f(x)=x^2(ax+b)=ax^3+bx^2$의 형태이다. 그러므로 $f'(x)=3ax^2+2bx$이다.
      source_flow: 예시답안 p.220
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        (나)에 의하여 $f'(-1)=3$, (다)에 의하여 $f'(1)=9$이므로 연립방정식 $\begin{cases}3a-2b=3\\3a+2b=9\end{cases}$를 얻고 해는 $a=2,\ b=\dfrac{3}{2}$이다. 그러므로 $f(x)=2x^3+\dfrac{3}{2}x^2$이다.
      source_flow: 예시답안 p.220
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 $\displaystyle\int_0^2 f(x+2)dx=\int_0^2\left\{2(x+2)^3+\dfrac{3}{2}(x+2)^2\right\}dx=\left[\dfrac{2}{4}(x+2)^4+\dfrac{3}{6}(x+2)^3\right]_0^2=\dfrac{256}{2}+\dfrac{64}{2}-12=148$
      source_flow: 예시답안 p.220
      criteria:
      - 1.A1
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    key_idea: 치환하여 $\displaystyle\int_0^2 f(x+2)dx=\int_2^4 f(x)dx$로 바꾼다.
    steps:
    - id: 1c1-1
      content: |
        [다른 방법] $\displaystyle\int_0^2 f(x+2)dx=\int_2^4 f(u)du=\int_2^4 f(x)dx=\int_2^4\left(2x^3+\dfrac{3}{2}x^2\right)dx=\left[\dfrac{1}{2}x^4+\dfrac{1}{2}x^3\right]_2^4=\dfrac{4^4}{2}+\dfrac{4^3}{2}-\dfrac{2^4}{2}-\dfrac{2^3}{2}=128+32-12=148$
      source_flow: 예시답안 p.220
      criteria: []
