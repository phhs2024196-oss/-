stem: |
  함수 $f(x)=x^4-(a+b)x^3+abx^2$에 대하여, 곡선 $y=f(x)$와 $x$축으로 둘러싸인 영역에서 $x$축의 윗부분과 아랫부분에 각각 놓인 두 영역의 넓이가 서로 같도록 2024 이하의 자연수 $a, b(a<b)$의 모든 순서쌍 $(a, b)$의 개수를 구하는 풀이 과정과 답을 쓰시오(10점).
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '404'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^2(x-a)(x-b)$이고 $a<b$이므로 $x$축의 윗부분에 놓인 영역의 넓이는 $A=\displaystyle\int_0^a\{x^4-(a+b)x^3+abx^2\}dx=\left[\dfrac{1}{5}x^5-\dfrac{1}{4}(a+b)x^4+\dfrac{1}{3}abx^3\right]_0^a=\dfrac{1}{5}a^5-\dfrac{1}{4}(a+b)a^4+\dfrac{1}{3}aba^3$이다.
      source_flow: 예시답안 p.224
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $x$축의 아랫부분에 놓인 영역의 넓이는 $B=\left|\displaystyle\int_a^b\{x^4-(a+b)x^3+abx^2\}dx\right|$이고, 절댓값 기호 안의 수가 음수이므로 $B=\left(\dfrac{1}{5}a^5-\dfrac{1}{4}(a+b)a^4+\dfrac{1}{3}aba^3\right)-\left(\dfrac{1}{5}b^5-\dfrac{1}{4}(a+b)b^4+\dfrac{1}{3}abb^3\right)$이다. $A=B$이므로 $\dfrac{1}{5}b^5-\dfrac{1}{4}(a+b)b^4+\dfrac{1}{3}abb^3=0$이다.
      source_flow: 예시답안 p.224
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $b\ne 0$이므로 $b^3\left(\dfrac{1}{5}b^2-\dfrac{1}{4}(a+b)b+\dfrac{1}{3}ab\right)=0$, 즉 $12b^2-15(a+b)b+20ab=0$, $-3b^2+5ab=0$, $3b=5a\ (a<b)$
      source_flow: 예시답안 p.224
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $a<b$는 자연수이므로 순서쌍의 모양은 $(3n,\ 5n)$의 형태이다. 그런데 $5n\le 2024$를 만족하는 최대 정수는 404이므로 구하는 개수는 404개다.
      source_flow: 예시답안 p.224
      criteria:
      - 1.A1
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    key_idea: 윗부분의 넓이 $A$와 아랫부분의 넓이 $B$를 따로 구해 $A=B$를 세운다.
    steps:
    - id: 1c1-1
      content: |
        $x$축 윗부분에 놓인 영역의 넓이는 $A=\displaystyle\int_0^a\{x^4-(a+b)x^3+abx^2\}dx=\left[\dfrac{1}{5}x^5-\dfrac{1}{4}(a+b)x^4+\dfrac{1}{3}abx^3\right]_0^a=\dfrac{1}{5}a^5-\dfrac{1}{4}(a+b)a^4+\dfrac{1}{3}aba^3$ (1점)
      source_flow: 예시답안 p.225
      criteria: []
    - id: 1c1-2
      content: |
        아랫부분에 놓인 영역의 넓이는 $B=\left|\displaystyle\int_a^b\{x^4-(a+b)x^3+abx^2\}dx\right|$이고 절댓값 기호 안의 수가 음수이므로 $A=B$이면 $\dfrac{1}{5}b^5-\dfrac{1}{4}(a+b)b^4+\dfrac{1}{3}abb^3=0$이다. (2점)
      source_flow: 예시답안 p.225
      criteria: []
    - id: 1c1-3
      content: |
        $b\ne 0$이므로 $12b^2-15(a+b)b+20ab=0$, $-3b^2+5ab=0$, $3b=5a\ (a<b)$ (3점)
      source_flow: 예시답안 p.225
      criteria: []
    - id: 1c1-4
      content: |
        $a<b$는 자연수이므로 순서쌍의 모양은 $(3n,5n)$의 형태이다. 그런데 $5n\le 2024$를 만족하는 최대 정수는 404이므로 구하는 개수는 404개다. (4점)
      source_flow: 예시답안 p.225
      criteria: []
