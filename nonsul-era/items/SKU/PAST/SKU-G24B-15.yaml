      steps:
      - 1b-1
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 식을 정리하여 $3b=5a$를 구했다.
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $(a,b)=(3n,5n)$, $5n\le 2024$에서 순서쌍의 개수 404를 구했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-4
    note: '채점기준(2): 1점($A$) / 2점($B$, $A=B$) / 3점($3b=5a$) / 4점(404). 채점기준(1)은 3점($\int_0^b=0$) / 3점 / 4점'
