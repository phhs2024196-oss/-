stimuli: []
stem: |
  그림과 같이 $\overline{AB}:\overline{BC}=2:1$이고 $\angle B=\dfrac{\pi}{2}$인 직각삼각형 ABC에서 선분 AB의 중점을 M이라 하자.
  [그림: 점 B에서 직각인 직각삼각형 ABC. 꼭짓점 A가 위, B가 왼쪽 아래, C가 오른쪽 아래에 있고, 선분 AB 위의 중점 M과 점 C를 점선으로 연결함. 선분 AM과 MB에 같은 길이 표시가 있음]
subparts:
- id: '1'
  stem: |
    $\sin^2(\angle ACM)=\dfrac{q}{p}$일 때, $p-q$의 값을 구하는 풀이 과정과 답을 쓰시오(10점).
    (단, $p$와 $q$는 서로소인 자연수이다.)
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '9'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\overline{BM}=a$ $(a>0)$이라 하면 직각이등변삼각형 MBC에서 $\overline{BC}=\overline{BM}=a$이므로 $\overline{CM}=\sqrt{\overline{BC}^2+\overline{BM}^2}=\sqrt{a^2+a^2}=\sqrt{2}a$.
      source_flow: 모범답안 p.60
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        M이 선분 AB의 중점이므로 $\overline{AM}=\overline{BM}=a$, $\overline{AB}=2a$. 직각삼각형 ABC에서 $\overline{AC}=\sqrt{\overline{AB}^2+\overline{BC}^2}=\sqrt{(2a)^2+a^2}=\sqrt{5}a$.
      source_flow: 모범답안 p.60
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        삼각형 AMC에서 코사인법칙에 의하여 $\overline{AM}^2=\overline{AC}^2+\overline{CM}^2-2\times\overline{AC}\times\overline{CM}\times\cos(\angle ACM)$, 즉 $a^2=(\sqrt{5}a)^2+(\sqrt{2}a)^2-2\times\sqrt{5}a\times\sqrt{2}a\times\cos(\angle ACM)$.
      source_flow: 모범답안 p.60
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $\cos(\angle ACM)=\dfrac{(\sqrt{5}a)^2+(\sqrt{2}a)^2-a^2}{2\times\sqrt{5}a\times\sqrt{2}a}=\dfrac{6a^2}{2\sqrt{10}a^2}=\dfrac{3}{\sqrt{10}}$이므로 $\cos^2(\angle ACM)=\dfrac{9}{10}$이고 $\sin^2(\angle ACM)=\dfrac{1}{10}$이다.
      source_flow: 모범답안 p.60
      criteria:
      - 1.A4
    - id: 1b-5
      content: |
        $p=10$, $q=1$이므로 $p-q=10-1=9$.
      source_flow: 모범답안 p.60
      criteria:
      - 1.A5
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: $\overline{CM}=\sqrt{\overline{BC}^2+\overline{BM}^2}=\sqrt{2}a$를 제시했다.
      steps:
      - 1b-1
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: $\overline{AB}=2a$로 두고 $\overline{AC}=\sqrt{\overline{AB}^2+\overline{BC}^2}=\sqrt{5}a$를 제시했다.
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: 삼각형 AMC에서 $\overline{AM}$, $\overline{AC}$, $\overline{CM}$과 $\cos(\angle ACM)$을 넣은 코사인법칙의 식을 세웠다.
      steps:
      - 1b-3
    - id: 1.A4
      mark_type: A
      points: 2
      evidence: $\cos^2(\angle ACM)=\dfrac{9}{10}$, $\sin^2(\angle ACM)=\dfrac{1}{10}$을 제시했다.
      depends_on:
      - 1.M3
      steps:
      - 1b-4
    - id: 1.A5
      mark_type: A
      points: 2
      evidence: $p=10$, $q=1$을 정하고 $p-q=9$를 제시했다.
      depends_on:
      - 1.M3
      - 1.A4
      steps:
      - 1b-5
