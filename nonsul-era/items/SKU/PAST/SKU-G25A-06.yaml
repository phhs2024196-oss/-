stimuli: []
stem: |
  그림과 같이 중심이 각각 점 $\mathrm{O}_1$, 점 $\mathrm{O}_2$, 점 $\mathrm{O}_3$이고 반지름의 길이가 각각 $r_1$, $r_2$, $r_3$인 세 원 $C_1$, $C_2$, $C_3$이 다음 조건을 만족시킨다.
  (가) $\overline{\mathrm{O}_1\mathrm{O}_2}=r_1+r_2$, $\overline{\mathrm{O}_2\mathrm{O}_3}=r_2+r_3$, $\overline{\mathrm{O}_1\mathrm{O}_3}=r_1+2r_2+r_3$
  (나) 세 원의 반지름 $r_1$, $r_2$, $r_3$은 순서대로 등비수열을 이룬다.
  (다) 세 원 $C_1$, $C_2$, $C_3$에 모두 접하는 직선 $l$이 존재한다.
  [그림: 수평인 직선 $l$ 위에 왼쪽부터 작은 원 $C_1$(중심 $\mathrm{O}_1$), 중간 원 $C_2$(중심 $\mathrm{O}_2$), 큰 원 $C_3$(중심 $\mathrm{O}_3$)이 놓여 있고 $C_1$과 $l$의 접점이 G, $C_3$과 $l$의 접점이 H이다. 반지름이 왼쪽에서 오른쪽으로 갈수록 커짐]
subparts:
- id: '1'
  stem: |
    두 원 $C_1$, $C_3$이 직선 $l$과 접하는 점을 각각 G, H라 하자. $r_1=1$, $\overline{\mathrm{GH}}=20$일 때, 두 원 $C_2$, $C_3$ 넓이의 합을 구하는 풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 272\pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에 의해 세 점 $\mathrm{O}_1$, $\mathrm{O}_2$, $\mathrm{O}_3$은 한 직선 위에 있다. $r_1=1$이므로 조건 (나)에 의해 공비를 $r$이라 하면 $r_2=r$, $r_3=r^2$이다.
      source_flow: 모범답안 p.62
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $\overline{\mathrm{GH}}=20$이므로 $r_1<r_2<r_3$, 즉 $r>1$이다.
      source_flow: 모범답안 p.62
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        점 $\mathrm{O}_1$에서 선분 $\mathrm{O}_3\mathrm{H}$에 내린 수선의 발을 I라 하면 $\overline{\mathrm{O}_1\mathrm{O}_3}=1+2r+r^2$, $\overline{\mathrm{O}_3\mathrm{I}}=r^2-1$이므로 직각삼각형 $\mathrm{O}_1\mathrm{IO}_3$에서 $\overline{\mathrm{O}_1\mathrm{I}}^2=(1+2r+r^2)^2-(r^2-1)^2=(1+2r+r^2+r^2-1)(1+2r+r^2-r^2+1)=(2r^2+2r)(2r+2)=4r(r+1)^2$.
      source_flow: 모범답안 p.62
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        이때 $\overline{\mathrm{O}_1\mathrm{I}}=\overline{\mathrm{GH}}=20$이므로 $4r(r+1)^2=400$, $r^3+2r^2+r-100=0$, $(r-4)(r^2+6r+25)=0$이다. 여기서 $r^2+6r+25>0$이므로 $r=4$.
      source_flow: 모범답안 p.62
      criteria:
      - 1.A4
    - id: 1b-5
      content: |
        따라서 두 원 $C_2$, $C_3$의 넓이의 합은 $4^2\pi+16^2\pi=272\pi$.
      source_flow: 모범답안 p.62
      criteria:
      - 1.A5
