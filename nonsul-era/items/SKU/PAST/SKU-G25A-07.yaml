    - id: 1.B1
      mark_type: M
      points: 2
      evidence: 곡선과 $x$축으로 둘러싸인 영역의 넓이 $\dfrac{9}{2}$를 제시했다(넓이 공식 $\dfrac{\lvert a\rvert(\beta-\alpha)^3}{6}=\dfrac{3^3}{6}$ 이용도 인정).
      steps:
      - 1b-1
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: 곡선과 직선의 교점 $x=0$, $x=3-a$를 제시했다.
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: $S_1=\dfrac{1}{6}(3-a)^3$을 정적분 또는 넓이 공식으로 구해 제시했다.
      steps:
      - 1b-3
    - id: 1.A4
      mark_type: A
      points: 2
      evidence: $S_1+S_2=\dfrac{9}{2}$와 $19S_1=8S_2$로부터 $S_1=\dfrac{4}{3}$을 제시했다.
      depends_on:
      - 1.B1
      steps:
      - 1b-4
    - id: 1.A5
      mark_type: A
      points: 2
      evidence: $\dfrac{1}{6}(3-a)^3=\dfrac{4}{3}$에서 $(3-a)^3=8$, $a=1$을 제시했다.
      depends_on:
      - 1.M3
      - 1.A4
      steps:
      - 1b-5
