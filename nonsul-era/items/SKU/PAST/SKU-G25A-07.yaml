stimuli: []
stem: |
  그림과 같이 곡선 $y=-x^2+3x$와 $x$축으로 둘러싸인 도형을 직선 $y=ax$ $(a>0)$가 두 영역으로 나눈다.
  [그림: 좌표평면에서 위로 볼록한 곡선 $y=-x^2+3x$가 원점과 점 (3,0)을 지나고, 원점을 지나는 직선 $y=ax$가 곡선과 만나 곡선과 직선 사이의 영역을 $S_1$, 직선 아래쪽 영역을 $S_2$로 나눈다]
subparts:
- id: '1'
  stem: |
    이때 각각의 넓이를 $S_1$, $S_2$라 할 때, $19S_1=8S_2$가 되는 $a$의 값을 구하는 풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=-x^2+3x$와 $x$축으로 둘러싸인 영역의 넓이는 $\displaystyle\int_0^3(-x^2+3x)dx=\left[-\dfrac{1}{3}x^3+\dfrac{3}{2}x^2\right]_0^3=-9+\dfrac{27}{2}=\dfrac{9}{2}$이다.
      source_flow: 모범답안 p.64
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $y=-x^2+3x$와 $y=ax$ $(a>0)$의 교점을 찾으면 $x=0$, $x=3-a$이다.
      source_flow: 모범답안 p.64
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        $S_1=\displaystyle\int_0^{3-a}\{-x^2+x(3-a)\}dx=\left[-\dfrac{1}{3}x^3+\dfrac{1}{2}(3-a)x^2\right]_0^{3-a}=\dfrac{1}{6}(3-a)^3$이다.
      source_flow: 모범답안 p.64
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $S_1+S_2=\dfrac{9}{2}$이고 $19S_1=8S_2$이므로 $S_2=\dfrac{19}{8}S_1$, 따라서 $\dfrac{27}{8}S_1=\dfrac{9}{2}$이고 $S_1=\dfrac{4}{3}$이다.
      source_flow: 모범답안 p.64
      criteria:
      - 1.A4
    - id: 1b-5
      content: |
        $\dfrac{1}{6}(3-a)^3=\dfrac{4}{3}$에서 $(3-a)^3=8$이고 $3-a=2$에서 $a=1$이다.
      source_flow: 모범답안 p.64
      criteria:
      - 1.A5
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
