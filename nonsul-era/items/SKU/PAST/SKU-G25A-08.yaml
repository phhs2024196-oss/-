stem: |
  두 함수 $f(x)=x^4+x^3-2x^2-8x$, $g(x)=x^3+2x^2+8x+k$에 대하여 부등식
subparts:
- id: '1'
  stem: |
    $f(x)\le g(x)$를 만족시키는 정수 $x$의 개수가 3이 되도록 하는 정수 $k$의 모든 값의 합을 구하는 풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-6'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        부등식 $f(x)\le g(x)$에서 $x^4+x^3-2x^2-8x\le x^3+2x^2+8x+k$이며, 정리하면 $x^4-4x^2-16x\le k$이다.
      source_flow: 모범답안 p.66
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $h(x)=x^4-4x^2-16x$라 하면 $h^{\prime}(x)=4x^3-8x-16=4(x^3-2x-4)=4(x-2)(x^2+2x+2)$이고 $h^{\prime}(x)=0$에서 $x=2$이다.
      source_flow: 모범답안 p.66
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $x<2$에서 $h(x)$는 감소하고 $x=2$에서 극소이면서 최솟값 $-32$를 가지며, $x>2$에서 $h(x)$는 증가한다.
      source_flow: 모범답안 p.66
      criteria:
      - 1.A3
    - id: 1b-4
      content: |
        $h(-1)=13$, $h(0)=0$, $h(1)=-19$, $h(2)=-32$, $h(3)=-3$이므로 정수 $x$의 개수가 3이 되도록 하려면 $-3\le k<0$이어야 한다.
      source_flow: 모범답안 p.66
      criteria:
      - 1.A4
    - id: 1b-5
      content: |
        따라서 구하고자 하는 $k=-3,-2,-1$이고 모든 값의 합은 $-6$이다.
      source_flow: 모범답안 p.66
      criteria:
      - 1.A5
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: $f(x)\le g(x)$를 $x^4-4x^2-16x\le k$로 정리했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $h(x)=x^4-4x^2-16x$로 놓고 $h^{\prime}(x)=4(x-2)(x^2+2x+2)$, $x=2$를 구했다.
      steps:
      - 1b-2
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: $x=2$ 전후의 증감과 $x=2$에서 극소이자 최솟값 $-32$를 제시했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A4
      mark_type: A
      points: 3
      evidence: $h(-1)=13$, $h(0)=0$, $h(1)=-19$, $h(2)=-32$, $h(3)=-3$을 이용해 $-3\le k<0$을 제시했다.
      depends_on:
      - 1.M2
      - 1.A3
      steps:
      - 1b-4
    - id: 1.A5
      mark_type: A
      points: 1
      evidence: $k=-3,-2,-1$과 합 $-6$을 제시했다.
      depends_on:
      - 1.M2
      - 1.A4
      steps:
      - 1b-5
