stimuli: []
stem: |
  기울기가 $-3$인 직선이 두 함수 $y=3^x$, $y=3^{x+2}+6$의 그래프와 만나는 점을 각각 A, B라 하자.
subparts:
- id: '1'
  stem: |
    선분 AB의 중점의 좌표가 $(3,a)$일 때, 상수 $a$의 값을 구하는 풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '84'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=3^{x+2}+6$의 그래프는 $y=3^x$의 그래프를 $x$축 방향으로 $-2$만큼, $y$축 방향으로 $6$만큼 평행이동한 것이다. 함수 $y=3^x$의 그래프 위의 점을 $(p,q)$라 하면 위의 평행이동에 의해 점 $(p,q)$는 점 $(p-2,q+6)$으로 옮겨지고 이 점은 함수 $y=3^{x+2}+6$의 그래프 위의 점이다. 이때 두 점 $(p,q)$, $(p-2,q+6)$을 지나는 직선의 기울기가 $-3$이므로 $\mathrm{A}(p,q)$, $\mathrm{B}(p-2,q+6)$이라 한다.
      source_flow: 모범답안 p.78
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        선분 AB의 중점의 좌표는 $\left(\dfrac{p+(p-2)}{2},\dfrac{q+(q+6)}{2}\right)$, 즉 $(p-1,q+3)$이다.
      source_flow: 모범답안 p.78
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        이 중점의 좌표가 $(3,a)$이므로 $p-1=3$, $q+3=a$에서 $p=4$, $q=a-3$이다.
      source_flow: 모범답안 p.78
      criteria:
      - 1.A3
    - id: 1b-4
      content: |
        또 점 $\mathrm{A}(4,q)$는 함수 $y=3^x$의 그래프 위의 점이므로 $q=3^4$이다.
      source_flow: 모범답안 p.78
      criteria:
      - 1.A4
    - id: 1b-5
      content: |
        따라서 $a=3^4+3=84$.
      source_flow: 모범답안 p.78
      criteria:
      - 1.A5
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
