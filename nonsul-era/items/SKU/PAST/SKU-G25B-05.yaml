      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: 선분 AB의 중점의 좌표 $(p-1,q+3)$을 도출했다.
      steps:
      - 1b-2
    - id: 1.A3
