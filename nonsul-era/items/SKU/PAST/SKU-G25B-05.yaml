key_idea: $y=3^{x+2}+6$은 $y=3^x$을 $x$축 방향으로 $-2$, $y$축 방향으로 $6$만큼 평행이동한 그래프이므로, 기울기가 $-3$인 직선과 만나는 두 점은 $\mathrm{A}(p,q)$, $\mathrm{B}(p-2,q+6)$이고 중점 $(p-1,q+3)=(3,a)$로 $p$, $q$를 정한다.
