stimuli: []
stem: |
  수열 $\{a_n\}$이 모든 자연수 $n$에 대하여 $a_n+a_{n+3}=15$를 만족시킨다.
subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{n=1}^{3}a_n=10$일 때, $\displaystyle\sum_{n=1}^{63}a_n$의 값을 구하는 풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '460'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_n+a_{n+3}=15$에서 $a_{n+3}=15-a_n$이다.
      source_flow: 모범답안 p.80
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\sum_{n=1}^{3}a_n=a_1+a_2+a_3=10$. $a_4+a_5+a_6=(15-a_1)+(15-a_2)+(15-a_3)=45-10=35$, $a_7+a_8+a_9=(15-a_4)+(15-a_5)+(15-a_6)=45-35=10$, $a_{10}+a_{11}+a_{12}=(15-a_7)+(15-a_8)+(15-a_9)=45-10=35$이고, 같은 방식으로 반복하면 $a_{58}+a_{59}+a_{60}=(15-a_{55})+(15-a_{56})+(15-a_{57})=45-10=35$, $a_{61}+a_{62}+a_{63}=(15-a_{58})+(15-a_{59})+(15-a_{60})=45-35=10$이다.
      source_flow: 모범답안 p.80
      criteria:
      - 1.A2
    - id: 1b-3
      content: |
        즉, 수열의 합이 6을 주기로 45의 값을 가지며 순환한다. 따라서 $\displaystyle\sum_{n=1}^{63}a_n=10\times\sum_{n=1}^{6}a_n+\sum_{n=61}^{63}a_n$.
      source_flow: 모범답안 p.80
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $=10\times45+10=460$.
      source_flow: 모범답안 p.80
      criteria:
      - 1.A4
