stimuli: []
stem: |
  곡선 $y=-x^3+3x^2-3x+1$과 직선 $y=-3x+k$가 서로 다른 세 점에서 만날 때,
subparts:
- id: '1'
  stem: |
    정수 $k$의 모든 값의 합을 구하는 풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '9'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        만나는 점의 개수가 3이 되려면 곡선 $y=-x^3+3x^2-3x+1$과 직선 $y=-3x+k$를 서로 같다고 놓고 풀면 $-x^3+3x^2-3x+1=-3x+k$이고, 이를 정리하면 $-x^3+3x^2+1=k$이다.
      source_flow: 모범답안 p.84
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이때 $f(x)=-x^3+3x^2+1$이라 하면 $f(x)$의 도함수 $f^{\prime}(x)=-3x^2+6x=-3x(x-2)=0$이 되는 값은 $x=0$, $x=2$이다. 3차 곡선의 최고차항이 음수이므로 $x=0$에서 $f(x)$는 극솟값 1을 가지고 $x=2$에서 극댓값 5를 갖는다.
      source_flow: 모범답안 p.84
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 곡선 $f(x)=-x^3+3x^2+1$과 직선 $y=k$가 만나는 점이 3개가 되려면 $k$의 범위는 $1<k<5$이어야 한다.
      source_flow: 모범답안 p.84
      criteria:
      - 1.A3
    - id: 1b-4
      content: |
        이때 정수는 $k=2,3,4$이고, 따라서 모든 $k$의 합은 9이다.
      source_flow: 모범답안 p.84
      criteria:
      - 1.A4
