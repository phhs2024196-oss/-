stimuli: []
stem: |
  함수 $y=f(x)=\dfrac{1}{4}x^3$의 역함수를 $y=g(x)$라고 하자.
subparts:
- id: '1'
  stem: |
    이때, 두 함수 $f(x)$와 $g(x)$의 그래프로 둘러싸인 영역의 넓이를 구하는 풀이 과정과 답을 쓰시오(10점).
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 함수 $f(x)$와 $g(x)$의 그래프는 직선 $y=x$에 관하여 대칭이므로 함수 $f(x)=\dfrac{1}{4}x^3$과 직선 $y=x$의 교점을 구하면 $x=\dfrac{1}{4}x^3$에서 $x=0$, $x=-2$, $x=2$이다.
      source_flow: 모범답안 p.86
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 구하고자 하는 영역의 넓이는 그래프의 대칭성을 이용하여 정적분 $\displaystyle\int_0^2\left(x-\dfrac{1}{4}x^3\right)dx$를 구하고 4배를 해주면 된다. 정적분 $\displaystyle\int_0^2\left(x-\dfrac{1}{4}x^3\right)dx=\left[\dfrac{1}{2}x^2-\dfrac{1}{16}x^4\right]_0^2=[2-1]=1$이다.
      source_flow: 모범답안 p.86
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 구하고자 하는 영역의 넓이는 4이다.
      source_flow: 모범답안 p.86
      criteria:
      - 1.A3
