stimuli: []
stem: |
  상수 $a,b$에 대하여 최고차항의 계수가 $1$인 이차함수 $f(x)$가

  $\displaystyle\lim_{x\to2}\dfrac{f(x)-3}{x^2-4}=a,\ \lim_{x\to3}\dfrac{f(x)-f(x-1)}{x-3}=b$를 만족시킬 때,

  다음에 답하시오(3개 문항 모두 답만 쓰시오).
subparts:
- id: '1'
  stem: $f(x)=$ (4점)
  points: 4
  depends_on: []
  answer:
    kind: expression
    value: x^2-5*x+9
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\displaystyle\lim_{x\to2}\dfrac{f(x)-3}{x^2-4}=a$에서 분모가 $0$으로 수렴하므로 분자도 $0$으로 수렴한다. 따라서 $f(2)-3=0$, 즉 $f(2)=3$이다. $\displaystyle\lim_{x\to3}\dfrac{f(x)-f(x-1)}{x-3}=b$에서 분모가 $0$으로 수렴하므로 분자도 $0$으로 수렴한다. 따라서 $f(3)-f(2)=0$, 즉 $f(3)=f(2)$이다.
      source_flow: 모범답안 p.65
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        위의 두 결과로부터 $f(2)=f(3)=3$이고 $f(x)=(x-2)(x-3)+3=x^2-5x+9$이다.
      source_flow: 모범답안 p.65
      criteria:
      - 1.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: $f(x)=x^2-5x+9$
      steps:
      - 1b-1
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: $a=$ (3점)
  points: 3
  depends_on: []
  answer:
    kind: value
    value: -1/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)-3=(x-2)(x-3)$를 $\displaystyle\lim_{x\to2}\dfrac{f(x)-3}{x^2-4}=a$에 대입하면 $\displaystyle\lim_{x\to2}\dfrac{(x-2)(x-3)+3-3}{(x-2)(x+2)}=a$이고, $a=-\dfrac14$이다.
      source_flow: 모범답안 p.65
      criteria:
      - 2.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: $a=-\dfrac14$
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: $b=$ (3점)
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(x-1)=(x-3)(x-4)+3$이므로 $\displaystyle\lim_{x\to3}\dfrac{f(x)-f(x-1)}{x-3}=\lim_{x\to3}\dfrac{((x-2)(x-3)+3)-((x-3)(x-4)+3)}{x-3}=2$이다. 따라서 $b=2$이다.
      source_flow: 모범답안 p.65
      criteria:
      - 3.B1
  - id: S3-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 3b-2
      content: |
        (별해) $f(x)=x^2-5x+9$이므로 $f'(x)=2x-5$이다. 로피탈의 법칙을 이용하면 $\displaystyle\lim_{x\to3}\dfrac{f(x)-f(x-1)}{x-3}=\dfrac{f'(3)-f'(2)}{1}=2$이다.
      source_flow: 모범답안 p.65
      criteria: []
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.B1
      mark_type: B
      points: 3
      evidence: $b=2$
      steps:
      - 3b-1
    alt_criteria:
    - id: 3.alt1
      points: 3
      evidence: '별해 채점기준: 로피탈의 법칙 이용 $\displaystyle\lim_{x\to3}\dfrac{f(x)-f(x-1)}{x-3}=\dfrac{f''(3)-f''(2)}{1}=2$이다. $b=2$ (①②는 같은 배점 4, 3)'
