stimuli: []
stem: |
  그림과 같이 원에 내접하고 $\overline{AB}=\overline{AD}$, $\overline{BC}=2$, $\overline{CD}=4$인 사각형 ABCD가 있다. $\angle ABC$를 $\theta$라 할 때, $\overline{AB}\cos\theta$를 구하시오(풀이 과정과 답을 모두 쓰시오. 10점).

  [그림 1: 원에 내접하는 사각형 ABCD. 꼭짓점 A가 위쪽, B가 왼쪽 아래, C가 아래쪽, D가 오른쪽 아래에 있고, 선분 AB와 AD에 길이가 같음을 나타내는 표시가 있다. 선분 BC의 길이 2, 선분 CD의 길이 4, 각 ABC에 $\theta$가 표시되어 있다.]
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '-1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        사각형 ABCD의 삼각형 ABC에서 코사인 법칙에 의하여 $\overline{AC}^2=\overline{AB}^2+\overline{BC}^2-2\times\overline{AB}\times\overline{BC}\times\cos\theta=\overline{AB}^2+2^2-2\times\overline{AB}\times2\times\cos\theta=\overline{AB}^2+4-4\times\overline{AB}\cos\theta$이다.
      source_flow: 모범답안 p.67
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        사각형 ABCD의 삼각형 ACD에서 코사인 법칙에 의하여 $\overline{AC}^2=\overline{AD}^2+\overline{CD}^2-2\times\overline{AD}\times\overline{CD}\times\cos D=\overline{AD}^2+4^2-2\times\overline{AD}\times4\times\cos D=\overline{AD}^2+16-8\times\overline{AD}\cos D$이다.
      source_flow: 모범답안 p.67
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        사각형 ABCD는 원에 내접하므로 $B+D=\pi$, 즉 $D=\pi-B$이고 $\overline{AB}=\overline{AD}$이므로 두 식에서 $\overline{AB}^2+4-4\times\overline{AB}\cos\theta=\overline{AD}^2+16-8\times\overline{AD}\cos D$이고 $\overline{AB}^2+4-4\times\overline{AB}\cos\theta=\overline{AB}^2+16-8\times\overline{AB}\cos(\pi-\theta)$이다.
      source_flow: 모범답안 p.67
      criteria:
      - 1.M3
      - 1.M4
    - id: 1b-4
      content: |
        $\overline{AB}^2+4-4\times\overline{AB}\cos\theta=\overline{AB}^2+16+8\times\overline{AB}\cos\theta$에서 $4-4\times\overline{AB}\cos\theta=16+8\times\overline{AB}\cos\theta$, $12\times\overline{AB}\cos\theta=-12$이므로 $\overline{AB}\cos\theta=-1$이다.
      source_flow: 모범답안 p.67
      criteria:
      - 1.A1
      - 1.A2
  - id: S1-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 1b-5
      content: |
        (별해) $\overline{AC}$를 $x$라 하고 $\overline{AB}$를 $y$라 하면, $\overline{AB}\cos\theta$는 $y\cos\theta$이다. ① 삼각형 ABC에서 $x^2=y^2+\overline{BC}^2-2\times y\times\overline{BC}\times\cos\theta=y^2+2^2-2\times y\times2\times\cos\theta=y^2+4-4y\cos\theta$. ② 삼각형 ACD에서 $x^2=\overline{AD}^2+\overline{CD}^2-2\times\overline{AD}\times\overline{CD}\times\cos D=\overline{AB}^2+\overline{CD}^2-2\times\overline{AB}\times\overline{CD}\times\cos D=y^2+4^2-2\times y\times4\times\cos(\pi-\theta)=y^2+16+8y\cos\theta$. ①,②에서 $y^2+4-4y\cos\theta=y^2+16+8y\cos\theta$, $12y\cos\theta=-12$, $y\cos\theta=-1$.
      source_flow: 모범답안 p.67
      criteria: []
