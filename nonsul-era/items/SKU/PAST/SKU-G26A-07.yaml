stem: |
  두 실수 $a,b$에 대하여 $2<a<b$이고 $a:b=2:3$이다. 직선 $y=3$과 세 곡선 $y=\log_2x,\ y=\log_ax,\ y=\log_bx$가 만나는 점을 각각 $A,B,C$라 하자.

  $\overline{AB}:\overline{BC}=1:5$일 때, $b^3-a^3=\dfrac{q}{p}$이다(단, $p,q$는 서로소인 자연수이다).

  다음에 답하시오.
