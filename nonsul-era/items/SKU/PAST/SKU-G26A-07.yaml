- id: '2'
  stem: $p+q$를 구하시오(풀이 과정과 답을 모두 쓰시오. 7.5점).
  points: 7
  depends_on: []
  answer:
    kind: value
    value: '781'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $3=\log_ax$에서 $x=a^3$이므로 점 $B(a^3,3)$이고, $3=\log_bx$에서 $x=b^3$이므로 점 $C(b^3,3)$이다. $a:b=2:3$이므로 $a=2k,\ b=3k\ (k>0)$이라 하면, $a^3=8k^3,\ b^3=27k^3$이 된다.
      source_flow: 모범답안 p.70
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\overline{AB}=a^3-8=8k^3-8$이고, $\overline{BC}=b^3-a^3=27k^3-8k^3=19k^3$이다. $\overline{AB}:\overline{BC}=1:5$에서 $(8k^3-8):19k^3=1:5$, 즉 $19k^3=40k^3-40$이므로 $k^3=\dfrac{40}{21}$이다.
      source_flow: 모범답안 p.70
      criteria:
      - 2.M2
      - 2.A1
    - id: 2b-3
      content: |
        $b^3-a^3=19k^3=19\times\dfrac{40}{21}=\dfrac{760}{21}$이므로, $p=21$, $q=760$이 된다. 따라서 $p+q=21+760=781$이다.
      source_flow: 모범답안 p.70
      criteria:
      - 2.A2
      - 2.A3
  - id: S2-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 2b-4
      content: |
        (별해) $a:b=2:3$에서 $b=\dfrac32a$이고 $b^3=\dfrac{27}{8}a^3$이 된다. $\overline{AB}=a^3-8$, $\overline{BC}=b^3-a^3=\dfrac{27}{8}a^3-a^3=\dfrac{19}{8}a^3$. $\overline{AB}:\overline{BC}=1:5$에서 $(a^3-8):\dfrac{19}{8}a^3=1:5$, $\dfrac{19}{8}a^3=5\times(a^3-8)$, $\dfrac{19}{8}a^3=5a^3-40$, $\dfrac{21}{8}a^3=40$, $a^3=\dfrac{8}{21}\times40=\dfrac{320}{21}$. 따라서 $b^3-a^3=\dfrac{19}{8}a^3=\dfrac{19}{8}\times\dfrac{320}{21}=\dfrac{760}{21}$이고 $p+q=21+760=781$.
      source_flow: 모범답안 p.70
      criteria: []
