stimuli: []
stem: |
  다항함수 $f(x)$가 다음 조건 (가)와 (나)를 만족시킨다.

  (가) 함수 $y=f(x)$위의 점 $(t,f(t))$에서 접선의 기울기가 $t^2-3a$이다. (단, $a$는 상수)
  (나) 함수 $y=f(x)$가 $x=-1$에서 $x$축에 접한다.

  다음에 답하시오.
subparts:
- id: '1'
  stem: $a=$ (답만 쓰시오. 2점).
  points: 2
  depends_on: []
  answer:
    kind: value
    value: 1/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)로부터 $f'(x)=x^2-3a$이고 조건 (나)에 의하여 $f'(-1)=0$이고 $f(-1)=0$이다. $f'(-1)=0$으로부터 $1-3a=0$이고 $a=\dfrac13$이다.
      source_flow: 모범답안 p.73
      criteria:
      - 1.B1
