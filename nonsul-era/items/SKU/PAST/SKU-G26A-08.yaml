- id: '2'
  stem: $f(x)=$ (답만 쓰시오. 3점).
  points: 3
  depends_on: []
  answer:
    kind: expression
    value: x^3/3-x-2/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        부정적분을 이용하면 $f(x)=\displaystyle\int f'(x)\,dx=\int(x^2-1)\,dx=\dfrac13x^3-x+C$ ($C$는 적분상수)이다. $f(-1)=0$에서 $f(-1)=-\dfrac13+1+C=0$에서 $C=-\dfrac23$이다. 따라서 $f(x)=\dfrac13x^3-x-\dfrac23$이다.
      source_flow: 모범답안 p.73
      criteria:
      - 2.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
