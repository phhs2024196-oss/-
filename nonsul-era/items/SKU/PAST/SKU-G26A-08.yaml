- id: '3'
  stem: 함수 $y=f(x)$와 $x$축으로 둘러싸인 영역의 면적을 구하시오(풀이 과정과 답을 모두 쓰시오. 5점).
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 9/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(x)=\dfrac13x^3-x-\dfrac23$을 인수분해하면 $f(x)=\dfrac13(x+1)^2(x-2)$이다. 따라서 $x$축과 다항함수 $f(x)$의 그래프로 둘러싸인 영역의 면적은 적분구간 $[-1,2]$에서 $\displaystyle\int_{-1}^{2}0-\left(\dfrac13x^3-x-\dfrac23\right)dx=\left[-\dfrac1{12}x^4+\dfrac12x^2+\dfrac23x\right]_{-1}^{2}$이다.
      source_flow: 모범답안 p.73
      criteria:
      - 3.M1
      - 3.M2
    - id: 3b-2
      content: |
        $=-\dfrac{16}{12}+2+\dfrac43-\left(-\dfrac1{12}+\dfrac12-\dfrac23\right)=\dfrac{27}{12}=\dfrac94$이다.
      source_flow: 모범답안 p.73
      criteria:
      - 3.A1
  - id: S3-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 3b-3
      content: |
        (별해) 직선과 곡선이 만나는 두 점을 $\alpha,\beta$라 할 때 둘러싸인 영역의 면적을 구하는 공식은 최종 정리된 곡선의 최고차항 계수가 $a$라 하면 3차 다항함수인 경우 영역의 면적$=\dfrac{|a|(\beta-\alpha)^4}{12}$인 공식을 이용하여 구한다. $f(x)=\dfrac13x^3-x-\dfrac23$이므로 면적은 $\dfrac{\left|\dfrac13\right|(2-(-1))^4}{12}=\dfrac{81}{36}=\dfrac94$이다.
      source_flow: 모범답안 p.73
      criteria: []
