stimuli: []
stem: |
  수열 $\{a_n\}$이 모든 자연수 $n$에 대하여

  $a_n=\begin{cases}2n+1&(n\text{이 홀수인 경우})\\a_{n-1}+1&(n\text{이 짝수인 경우})\end{cases}$

  를 만족시킨다.

  $\displaystyle\sum_{k=1}^{50}a_k$를 구하시오(풀이 과정과 답을 모두 쓰시오. 10점).
subparts:
- id: '1'
  stem: ''
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '2575'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        모든 자연수 $k$에 대하여 $2k-1$은 홀수이므로 $a_{2k-1}=2(2k-1)+1=4k-1$이다. $2k$는 짝수이므로 $a_{2k}=a_{2k-1}+1=(4k-1)+1=4k$이다.
      source_flow: 모범답안 p.88
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\sum_{k=1}^{50}a_k=\sum_{k=1}^{25}(a_{2k-1}+a_{2k})=\sum_{k=1}^{25}(4k-1+4k)=\sum_{k=1}^{25}(8k-1)=8\sum_{k=1}^{25}k-\sum_{k=1}^{25}1$이다.
      source_flow: 모범답안 p.88
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $=8\times\dfrac{25\times26}{2}-25=2600-25=2575$이다.
      source_flow: 모범답안 p.88
      criteria:
      - 1.A1
  - id: S1-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 1b-4
      content: |
        (별해) 숫자를 직접 대입하여, 규칙성을 찾아서 계산한다. $a_1=3,\ a_2=a_1+1=3+1$, $a_3=7,\ a_4=a_3+1=7+1$, $\cdots$, $a_{49}=99,\ a_{50}=a_{49}+1=99+1$. 등차수열의 합 공식 $S_n=\dfrac{n(a+l)}{2}$($n$은 항의 개수, $a$는 초항, $l$은 마지막항)을 활용하여 $2\times\dfrac{25(3+99)}{2}+25=2575$이다.
      source_flow: 모범답안 p.88
      criteria: []
