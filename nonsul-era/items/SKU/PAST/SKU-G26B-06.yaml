stem: |
  두 다항함수 $f(x),g(x)$가

  $\displaystyle\lim_{x\to1}\dfrac{f(x)-g(x)}{x-1}=2,\ \lim_{x\to1}\dfrac{f(x)+g(x)-4}{x-1}=6$을 만족시킨다.

  $h(x)=f(x)g(x)$라 할 때, 다음에 답하시오(5개 문항 모두 답만 쓰시오).
subparts:
- id: '1'
  stem: $f(1)=$ (2점)
  points: 2
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 조건 $\displaystyle\lim_{x\to1}\dfrac{f(x)-g(x)}{x-1}=2$로부터 극한값이 존재하기 위해서는 $x\to1$에 따라 분모가 $0$이므로 분자도 $0$이어야 한다. 따라서 $f(1)-g(1)=0$, $f(1)=g(1)$이다. 또한 $\displaystyle\lim_{x\to1}\dfrac{f(x)+g(x)-4}{x-1}=6$으로부터 극한값이 존재하기 위해서는 $x\to1$에 따라 분모가 $0$이므로 분자도 $0$이어야 한다. 따라서 $f(1)+g(1)=4$이다. $f(1)-g(1)=0$과 $f(1)+g(1)=4$를 연립하여 풀면 $f(1)=g(1)=2$이다.
      source_flow: 모범답안 p.90
      criteria:
      - 1.B1
      - 2.B1
