  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\displaystyle\lim_{x\to1}\dfrac{f(x)+g(x)-4}{x-1}=\lim_{x\to1}\dfrac{f(x)-2+g(x)-2}{x-1}=\lim_{x\to1}\dfrac{f(x)-f(1)+g(x)-g(1)}{x-1}=6$이고 도함수 정의식으로부터 $f'(1)+g'(1)=6$이다. 동일한 방법으로 $\displaystyle\lim_{x\to1}\dfrac{f(x)-g(x)}{x-1}=\lim_{x\to1}\dfrac{f(x)-1-(g(x)-1)}{x-1}=2$로 고쳐 쓸 수 있고, 이는 도함수 정의식으로부터 $f'(1)-g'(1)=2$이다. $f'(1)+g'(1)=6$과 $f'(1)-g'(1)=2$를 연립하면 $f'(1)=4$, $g'(1)=2$이다.
      source_flow: 모범답안 p.90
      criteria:
      - 3.B1
      - 4.B1
