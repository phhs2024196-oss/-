      mark_type: M
      points: 1
      evidence: 직선과 곡선이 만나는 점 $\dfrac12x^2+2x+5=\dfrac12x+7$에서 $x=-4,\ x=1$이다 (원 배점 1.5점)
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: $\displaystyle\int_{-4}^{1}\left(\left(\dfrac12x+7\right)-\left(\dfrac12x^2+2x+5\right)\right)dx=\int_{-4}^{1}\left(-\dfrac12x^2-\dfrac32x+2\right)dx$ (원 배점 2.5점)
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.M3
      mark_type: M
      points: 1
      evidence: 정적분 결과 $=\left[-\dfrac16x^3-\dfrac34x^2+2x\right]_{-4}^{1}$ (원 배점 1.5점)
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: '계산결과 $=-\dfrac16-\dfrac34+2-\left(\dfrac{64}{6}-12-8\right)=\dfrac{125}{12}$ (원 배점 1.5점. 원 채점기준 비고: 계산결과가 있으면 7점)'
      depends_on:
      - 2.M3
      steps:
      - 2b-3
    alt_criteria:
    - id: 2.alt1
      points: 1.5
      evidence: 직선과 곡선이 만나는 점 $\dfrac12x^2+2x+5=\dfrac12x+7$에서 $\dfrac12x^2+\dfrac32x-2=0$이고 $x=-4,\ x=1$이다
    - id: 2.alt2
      points: 5.5
      evidence: '$\dfrac12x^2+\dfrac32x-2=0$으로부터 영역의 면적$=\dfrac{|a|(\beta-\alpha)^3}{6}$인 공식을 이용 $\dfrac{\left|-\dfrac12\right|(1-(-4))^3}{6}=\dfrac{125}{12}$ (원 채점기준 비고: 계산결과가 있으면 7점)'
