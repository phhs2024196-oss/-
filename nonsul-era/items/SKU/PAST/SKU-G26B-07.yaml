stimuli: []
stem: |
  함수 $f(x)=\dfrac12x^2+2x+5$에 대하여 곡선 $y=f(x)$ 위의 점 $A(-4,f(-4))$에서의 접선에 수직이고, 점 $A$를 지나는 직선을 $y=l(x)$라 하자. 곡선 $y=f(x)$와 직선 $y=l(x)$로 둘러싸인 부분의 넓이를 구하고자 한다. 다음에 답하시오.
subparts:
- id: '1'
  stem: $l(x)=$ (답만 쓰시오. 3점).
  points: 3
  depends_on: []
  answer:
    kind: expression
    value: x/2+7
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\dfrac12x^2+2x+5=\dfrac12(x+2)^2+3$이므로 함수의 꼭짓점이 $(-2,3)$이고 주어진 곡선 $y=f(x)$의 도함수를 이용하여 곡선을 지나는 점 $(-4,f(-4))$에서 접선의 기울기를 구하면 $f'(x)=x+2$에서 $x=-4$를 대입하면 접선의 기울기는 $-2$이고 접선의 식은 $y=-2x-3$이다. 따라서 접선에 수직인 직선은 $l(x)=\dfrac12x+c$이고 $f(-4)=5$이다. 이 직선은 점 $(-4,f(-4))$를 지나므로 $l(x)=\dfrac12x+7$이다.
      source_flow: 모범답안 p.92
      criteria:
      - 1.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: 접선에 수직인 직선 $l(x)=\dfrac12x+7$이다.
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: 곡선 $y=f(x)$와 직선 $y=l(x)$로 둘러싸인 부분의 넓이를 구하시오(풀이 과정과 답을 모두 쓰시오. 7점).
  points: 7
  depends_on: []
  answer:
    kind: value
    value: 125/12
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        함수 $y=f(x)$와 직선 $y=l(x)$가 만나는 두 점을 구하면 $\dfrac12x^2+2x+5=\dfrac12x+7$로부터 $x^2+3x-4=0$을 풀면 $x=-4,\ x=1$에서 만난다.
      source_flow: 모범답안 p.92
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서 구하고자 하는 영역의 넓이는 직선이 위쪽에 있고 함수 $f(x)$가 아래쪽에 놓여 있으므로 정적분 $\displaystyle\int_{-4}^{1}\left(\left(\dfrac12x+7\right)-\left(\dfrac12x^2+2x+5\right)\right)dx=\int_{-4}^{1}\left(-\dfrac12x^2-\dfrac32x+2\right)dx$이다.
      source_flow: 모범답안 p.92
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $=\left[-\dfrac16x^3-\dfrac34x^2+2x\right]_{-4}^{1}=\dfrac{125}{12}$이다.
      source_flow: 모범답안 p.92
      criteria:
      - 2.M3
      - 2.A1
  - id: S2-ALT
    audience: ALT
    method_no: 2
    steps:
    - id: 2b-4
      content: |
        (별해) 직선과 곡선이 만나는 두 점을 $\alpha,\beta$라 할 때 둘러싸인 영역의 면적을 구하는 공식은 곡선의 최고차항 계수가 $a$라 하면 공식 영역의 면적$=\dfrac{|a|(\beta-\alpha)^3}{6}$인 공식을 이용하여 구한다. 따라서 $\displaystyle\int_{-4}^{1}\left(\left(\dfrac12x+7\right)-\left(\dfrac12x^2+2x+5\right)\right)dx$를 계산하지 않고 영역의 면적은 $\dfrac{\left|-\dfrac12\right|(1-(-4))^3}{6}=\dfrac{125}{12}$이다.
      source_flow: 모범답안 p.92
      criteria: []
