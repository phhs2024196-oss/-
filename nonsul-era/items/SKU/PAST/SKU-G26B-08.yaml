stimuli: []
stem: |
  양의 실수 $k$에 대하여 함수 $f(x)=3\cos2kx$의 주기를 $g(k)$라 하고,

  $h(k)=f(g(k))+\cos\left\{\dfrac{g(k)}{2}+\dfrac43\pi\right\}$라 하자. 함수 $h(k)$가 최댓값을 갖도록 하는 양수 $k$의 최댓값을 $a$라 하고, 함수 $h(k)$가 최솟값을 갖도록 하는 양수 $k$의 최댓값을 $b$라 한다. 다음에 답하시오.
