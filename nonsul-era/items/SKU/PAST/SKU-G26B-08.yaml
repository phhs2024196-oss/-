    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=3\cos2kx$의 주기 $g(k)=\dfrac{2\pi}{|2k|}=\dfrac1k\pi$이다.
      source_flow: 모범답안 p.95
      criteria:
      - 1.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
