    meaning: 만점
  misconceptions: []
- id: '2'
  stem: $h(k)$를 간단히 정리하시오. $h(k)=$ (답만 쓰시오. 2.5점).
  points: 2
  depends_on: []
  answer:
    kind: expression
    value: 3+cos(pi/(2*k)+4*pi/3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $h(k)=f(g(k))+\cos\left\{\dfrac{g(k)}{2}+\dfrac43\pi\right\}=f\left(\dfrac1k\pi\right)+\cos\left\{\dfrac12\cdot\dfrac1k\pi+\dfrac43\pi\right\}=3\cos\left(2k\times\dfrac1k\pi\right)+\cos\left\{\dfrac1{2k}\pi+\dfrac43\pi\right\}=3\cos2\pi+\cos\left\{\dfrac1{2k}\pi+\dfrac43\pi\right\}=3+\cos\left\{\dfrac1{2k}\pi+\dfrac43\pi\right\}$이다.
      source_flow: 모범답안 p.95
      criteria:
      - 2.B1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: '$3+\cos\left\{\dfrac1{2k}\pi+\dfrac43\pi\right\}$ (원 배점 2.5점. 원 채점기준: $3\cos\left(2k\times\dfrac1k\pi\right)+\cos\left\{\dfrac1{2k}\pi+\dfrac43\pi\right\}$라고 썼으면 1점, $3\cos2\pi+\cos\left\{\dfrac1{2k}\pi+\dfrac43\pi\right\}$라고 썼으면 1.5점)'
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: $a$를 구하시오(풀이 과정과 답을 모두 쓰시오. 3점).
  points: 3
  depends_on: []
  answer:
    kind: value
    value: 3/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        함수 $h(k)$는 $\cos\left\{\dfrac1{2k}\pi+\dfrac43\pi\right\}$의 값이 최대일 때, 즉 $\cos\left\{\dfrac1{2k}\pi+\dfrac43\pi\right\}=1$일 때 최대이다. 이것은 $\dfrac1{2k}\pi+\dfrac43\pi$의 값이 $0,\ 2\pi,\ 4\pi,\ 6\pi,\ \cdots$일 때다. $k$는 양수이므로 $\dfrac1{2k}\pi+\dfrac43\pi>\dfrac43\pi$이 되고 함수 $h(k)$가 최댓값을 갖도록 하는 양수 $k$의 최댓값 $a$는 $\dfrac1{2a}\pi+\dfrac43\pi=2\pi$이므로 $a$는 $\dfrac34$이다.
      source_flow: 모범답안 p.95
      criteria:
      - 3.M1
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: ($h(k)$가 최대일 때는 $\dfrac1{2k}\pi+\dfrac43\pi$의 값이 $0,2\pi,4\pi,6\pi,\cdots$일 때다.) 최댓값 $a$는 $\dfrac1{2a}\pi+\dfrac43\pi=2\pi$이므로
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 1
      evidence: (답) $a$는 $\dfrac34$
      depends_on:
