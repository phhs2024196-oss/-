- id: '4'
  stem: $b$를 구하시오(풀이 과정과 답을 모두 쓰시오. 3점).
  points: 3
  depends_on: []
  answer:
    kind: value
    value: 3/10
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        또한 함수 $h(k)$가 최솟값을 갖기 위한 $\cos\left\{\dfrac1{2k}\pi+\dfrac43\pi\right\}=-1$은 $\dfrac1{2k}\pi+\dfrac43\pi$의 값이 $\pi,\ 3\pi,\ 5\pi,\ \cdots$일 때다. $\dfrac1{2k}\pi+\dfrac43\pi>\dfrac43\pi$에서 함수 $h(k)$가 최솟값을 갖도록 하는 양수 $k$의 최댓값 $b$는 $\dfrac1{2b}\pi+\dfrac43\pi=3\pi$이다. 따라서 $b$는 $\dfrac3{10}$이다.
      source_flow: 모범답안 p.95
