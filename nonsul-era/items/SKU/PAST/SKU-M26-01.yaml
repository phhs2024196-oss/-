stimuli: []
stem: |
  $2<a<b$이고 $a:b=2:3$인 두 실수 $a,\ b$에 대하여 직선 $y=3$과 세 곡선 $y=\log_2 x,\ y=\log_a x,\ y=\log_b x$가 만나는 점을 각각 $A,\ B,\ C$라 하자. $\overline{AB}:\overline{BC}=1:4$일 때, $a^3+b^3=\dfrac{q}{p}$이다. 단, $p,\ q$는 서로소인 자연수일 때, 다음을 구하시오. [총 10점]
subparts:
- id: '1'
  stem: |
    ① 정점 $A$의 좌표를 구하시오. [2.5점]
  points: 3
  depends_on: []
  answer:
    kind: value
    value: (8,3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직선 $y=3$과 세 곡선의 만나는 정점 $A,\ B,\ C$를 구한다. $3=\log_2 x$에서 $x=8$이므로 ① 정점 $A(8,3)$이다.
      source_flow: 해설 p.20
      criteria:
      - 1.B
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B
      mark_type: B
      points: 3
      evidence: 정점 $A(8,3)$ 또는 $x=8,\ y=3$을 적었다. (원 배점 2.5점)
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    ② $p+q$를 구하시오. [7.5점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: '1133'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $3=\log_a x$에서 $x=a^3$이므로 정점 $B(a^3,3)$이고, $3=\log_b x$에서 $x=b^3$이므로 정점 $C(b^3,3)$이다.
      source_flow: 해설 p.20
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $a:b=2:3$이므로 $a=2k,\ b=3k\ (k>0)$이라 하면 $a^3=8k^3,\ b^3=27k^3$이므로 $\overline{AB}:\overline{BC}=1:4$에서 $(8k^3-8):19k^3=1:4$
      source_flow: 해설 p.20
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        즉, $19k^3=32k^3-32$이므로 $k^3=\dfrac{32}{13}$이다.
      source_flow: 해설 p.20
      criteria:
      - 2.A1
    - id: 2b-4
      content: |
        $a^3+b^3=8k^3+27k^3=35k^3=\dfrac{1120}{13}$이 되므로, $p=13,\ q=1120$이 된다. 따라서 ② $p+q=13+1120=1133$이다.
      source_flow: 해설 p.20
      criteria:
      - 2.A2
