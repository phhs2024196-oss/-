      content: |
        함수 $f(x)=3\cos 2kx$의 주기 $g(k)$는 ① $g(k)=\dfrac{2\pi}{|2k|}=\dfrac{1}{k}\pi$이다.
      source_flow: 해설 p.21
      criteria:
      - 1.B
  rubric:
