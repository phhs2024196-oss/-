    method_no: 1
    steps:
    - id: 3b-1
      content: |
        또한 함수 $h(k)$가 최솟값을 갖기 위한 $\cos\left\{\dfrac{1}{3k}\pi+\dfrac54\pi\right\}=-1$은 $\dfrac{1}{3k}\pi+\dfrac54\pi$의 값이 $\pi,\ 3\pi,\ 5\pi,\ \cdots$일 때다.
      source_flow: 해설 p.21
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\dfrac{1}{3k}\pi+\dfrac54\pi>\dfrac54\pi$에서 함수 $h(k)$가 $k=\beta$에서 최솟값을 갖도록 하는 양수 $\beta$의 최댓값 $b$는 $\dfrac{1}{3b}\pi+\dfrac54\pi=3\pi$, 따라서 ③ $b$는 $\dfrac{4}{21}$이다.
      source_flow: 해설 p.21
      criteria:
      - 3.A1
  rubric:
