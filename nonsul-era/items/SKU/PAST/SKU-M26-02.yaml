- id: '2'
  stem: |
    ② $a$를 구하시오. [4.5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 4/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $h(k)=f(g(k))+\cos\left\{\dfrac{g(k)}{3}+\dfrac54\pi\right\}=f\left(\dfrac1k\pi\right)+\cos\left\{\dfrac{\frac1k\pi}{3}+\dfrac54\pi\right\}=3\cos 2k\cdot\dfrac1k\pi+\cos\left\{\dfrac{1}{3k}\pi+\dfrac54\pi\right\}=3\cos 2\pi+\cos\left\{\dfrac{1}{3k}\pi+\dfrac54\pi\right\}=3+\cos\left\{\dfrac{1}{3k}\pi+\dfrac54\pi\right\}$
      source_flow: 해설 p.21
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        함수 $h(k)$는 $\cos\left\{\dfrac{1}{3k}\pi+\dfrac54\pi\right\}$의 값이 최대일 때, 즉 $\cos\left\{\dfrac{1}{3k}\pi+\dfrac54\pi\right\}=1$일 때 최대이고, $\cos\left\{\dfrac{1}{3k}\pi+\dfrac54\pi\right\}$의 값이 최소일 때, 즉 $\cos\left\{\dfrac{1}{3k}\pi+\dfrac54\pi\right\}=-1$일 때 최소가 된다.
      source_flow: 해설 p.21
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        함수 $h(k)$가 최댓값을 갖기 위한 $\cos\left\{\dfrac{1}{3k}\pi+\dfrac54\pi\right\}=1$은 $\dfrac{1}{3k}\pi+\dfrac54\pi$의 값이 $0,\ 2\pi,\ 4\pi,\ 6\pi,\ \cdots$일 때다. $k$는 양수이므로 $\dfrac{1}{3k}\pi+\dfrac54\pi>\dfrac54\pi$이다.
      source_flow: 해설 p.21
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        함수 $h(k)$가 $k=\alpha$에서 최댓값을 갖도록 하는 양수 $\alpha$의 최댓값 $a$는 $\dfrac{1}{3a}\pi+\dfrac54\pi=2\pi$, ② $a=\dfrac49$이다.
      source_flow: 해설 p.21
      criteria:
      - 2.A1
  rubric:
    # 채점기준 미공개 — 단계별 추정
