      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: 최대 조건 $\cos\{\cdots\}=1$과 $k>0$에서 각이 $\dfrac54\pi$보다 큼을 이용해 $\alpha$의 최댓값이 각 $2\pi$에 대응함을 밝혔다. (원 배점 1.5점)
      depends_on:
      - 2.M1
      steps:
      - 2b-2
      - 2b-3
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: $\dfrac{1}{3a}\pi+\dfrac54\pi=2\pi$에서 $a=\dfrac49$를 구했다. (원 배점 1.5점)
      depends_on:
      - 2.M2
      steps:
      - 2b-4
