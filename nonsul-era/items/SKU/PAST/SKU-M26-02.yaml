stimuli: []
stem: |
  양의 실수 $k$에 대하여 함수 $f(x)=3\cos 2kx$의 주기를 $g(k)$라 하고 $h(k)=f(g(k))+\cos\left\{\dfrac{g(k)}{3}+\dfrac54\pi\right\}$라 하자.
  함수 $h(k)$가 $k=\alpha$에서 최댓값을 갖도록 하는 양수 $\alpha$의 최댓값을 $a$, 함수 $h(k)$가 $k=\beta$에서 최솟값을 갖도록 하는 양수 $\beta$의 최댓값을 $b$라 한다.
  다음을 구하시오. [총 10점]
