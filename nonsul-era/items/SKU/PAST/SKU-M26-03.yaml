stimuli: []
stem: |
  다항함수 $f(x)$가 다음 조건(가)와 (나)를 만족시킨다.
  (가) 곡선 $y=f(x)$ 위의 임의의 점 $(x,\ f(x))$에서 접선의 기울기가 $ax^2-12$ ($a$는 상수)이다.
  (나) 곡선 $y=f(x)$가 점 $(-2,\ f(-2))$에서 $x$축에 접한다. 다음을 구하시오. [총 10점]
subparts:
- id: '1'
  stem: |
    ① 상수 $a$ = ? [2점]
  points: 2
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)로부터 $f'(x)=ax^2-12$이고 조건 (나)에 의하여 $f'(-2)=0$이고 $f(-2)=0$이다. $f'(-2)=0$으로부터 $4a-12=0$이고 $a=3$이다.
      source_flow: 해설 p.22
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    # 채점기준 미공개 — 단계별 추정
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: $f'(x)=ax^2-12$이고 $f'(-2)=0$, $f(-2)=0$을 세웠다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: $4a-12=0$에서 $a=3$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    ② 함수 $f(x)$ = ? [3점]
  points: 3
  depends_on:
  - '1'
  answer:
    kind: value
    value: x**3-12*x-16
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        따라서 부정적분을 이용하면 $f(x)=\int f'(x)\,dx=\int(3x^2-12)\,dx=x^3-12x+C$ ($C$는 적분상수)이다.
      source_flow: 해설 p.22
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $f(-2)=0$에서 $f(-2)=-8+24+C=0$에서 $C=-16$이다. $f(x)=x^3-12x-16$이다.
      source_flow: 해설 p.22
      criteria:
      - 2.A1
  rubric:
    # 채점기준 미공개 — 단계별 추정
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 1
      evidence: 부정적분으로 $f(x)=x^3-12x+C$를 얻었다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: $f(-2)=0$으로 $C=-16$, $f(x)=x^3-12x-16$을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    ③ 함수 $f(x)$의 극솟값 = ? [5점]
  points: 5
  depends_on:
  - '2'
  answer:
    kind: value
    value: '-32'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(x)=x^3-12x-16$이고 극대, 극소를 알아보기 위해 도함수를 이용하면, $f'(x)=3(x+2)(x-2)=0$이고 증감상태를 파악하면 $x=2$에서 극솟값 $f(2)$를 갖는다.
      source_flow: 해설 p.22
      criteria:
      - 3.M1
      - 3.A1
    - id: 3b-2
      content: |
        따라서 극솟값은 $f(2)=8-24-16=-32$이다.
      source_flow: 해설 p.22
      criteria:
      - 3.A2
  rubric:
    # 채점기준 미공개 — 단계별 추정
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: $f'(x)=3(x+2)(x-2)$를 구하고 증감을 조사했다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 1
      evidence: $x=2$에서 극소임을 밝혔다.
      depends_on:
      - 3.M1
      steps:
      - 3b-1
    - id: 3.A2
      mark_type: A
      points: 2
      evidence: 극솟값 $f(2)=-32$를 구했다.
      depends_on:
      - 3.M1
      - 3.A1
      steps:
      - 3b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
