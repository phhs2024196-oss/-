stimuli: []
stem: |
  두 함수 $f(x)=x^2-2x-3$과 $g(x)=2|(x-1)|-4$ 및 직선 $x=-2,\ x=4$로 둘러 쌓인 영역의 넓이를 $S$라 할 때, $S$를 구하는 과정이다. 답을 쓰시오. [총 10점]
subparts:
- id: '1'
  stem: |
    ① $x$ 구간에 따른 $f(x),\ g(x)$의 대소 관계는? [3점]
  points: 3
  depends_on: []
  answer:
    kind: value
    value: 구간 [-1,3]에서 g(x)>=f(x), 구간 [3,4]에서 f(x)>=g(x)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=x^2-2x-3$은 포물선으로 꼭짓점의 좌표는 $(1,-4)$이고 $x$절편은 $x=-1,\ x=3$이며 $y$절편은 $y=-3$이다. 또한 함수 $g(x)=2|(x-1)|-4$는 절댓값 함수로 $g(x)=\begin{cases}-2x-2 & (x\le 1)\\ 2x-6 & (x>1)\end{cases}$이고, 꺾이는 점은 $x=1$일 때 $g(1)=-4$이므로 $(1,-4)$이다.
      source_flow: 해설 p.23
      criteria:
      - 1.B
    - id: 1b-2
      content: |
        따라서, 구간 $[-1,3]$에서는 $g(x)\ge f(x)$이고 구간 $[3,4]$에서는 $f(x)\ge g(x)$입니다.
      source_flow: 해설 p.23
      criteria:
      - 1.B
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B
      mark_type: B
      points: 3
      evidence: 구간 $[-1,3]$에서 $g(x)\ge f(x)$, 구간 $[3,4]$에서 $f(x)\ge g(x)$를 적었다.
      steps:
      - 1b-1
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    ② 영역의 넓이 $S$를 정적분을 이용하여 나타내면? [2점]
  points: 2
  depends_on: []
  answer:
    kind: value
    value: S=2(int_1^3 (g(x)-f(x))dx+int_3^4 (f(x)-g(x))dx)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        위 영역에 의하여 구하고자 하는 영역의 넓이는 꼭짓점을 중심으로 좌우 대칭이므로 한쪽 영역의 면적을 구한 다음 2배를 해준다. 정적분을 이용하면 구하고자 하는 $x=1$의 오른쪽 영역의 면적 $S$는 $S=2\left(\displaystyle\int_1^3(g(x)-f(x))\,dx+\int_3^4(f(x)-g(x))\,dx\right)$이다.
      source_flow: 해설 p.23
      criteria:
      - 2.B
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.B
      mark_type: B
      points: 2
      evidence: $S=2\left(\displaystyle\int_1^3(g(x)-f(x))\,dx+\int_3^4(f(x)-g(x))\,dx\right)$ 또는 동치인 정적분 식을 적었다.
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    ③ 영역의 넓이 $S$ = ? [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 16/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        ① $\displaystyle\int_1^3(2x-6-x^2+2x+3)\,dx+\int_3^4(x^2-2x-3-2x+6)\,dx$이고 $=\displaystyle\int_1^3(-x^2+4x-3)\,dx+\int_3^4(x^2-4x+3)\,dx=\left[-\dfrac13x^3+2x^2-3x\right]_1^3+\left[\dfrac13x^3-2x^2+3x\right]_3^4=\dfrac43+\dfrac43=\dfrac83$
      source_flow: 해설 p.23
      criteria:
      - 3.B
    - id: 3b-2
      content: |
        따라서 구하고자 하는 영역의 넓이 $S=2\times①=2\times\dfrac83=\dfrac{16}{3}$.
      source_flow: 해설 p.23
      criteria:
      - 3.B
    - id: 3b-3
      content: |
        같은 방법으로 $x=1$의 왼쪽 영역의 면적 $S$는 $S=2\left(\displaystyle\int_{-2}^{-1}(f(x)-g(x))\,dx+\int_{-1}^{1}(g(x)-f(x))\,dx\right)=2\left(\displaystyle\int_{-2}^{-1}((x^2-2x-3)-(-2x-2))\,dx+\int_{-1}^{1}((-2x-2)-(x^2-2x-3))\,dx\right)=2\left(\dfrac43+\dfrac43\right)=2\left(\dfrac83\right)=\dfrac{16}{3}$
      source_flow: 해설 p.23
      criteria:
      - 3.B
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.B
      mark_type: B
      points: 5
      evidence: 넓이 $S=\dfrac{16}{3}$을 적었다.
      steps:
      - 3b-1
      - 3b-2
      - 3b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
