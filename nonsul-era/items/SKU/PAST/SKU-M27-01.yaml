- id: '4'
  stem: |
    ③ 함수 $y=g(x)$의 그래프가 점 $(5,3)$을 지날 때, 상수 $a$ 값을 구하는 풀이 과정과 답을 모두 쓰시오. (3.5점)
  points: 4
