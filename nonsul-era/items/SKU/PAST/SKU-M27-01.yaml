stimuli: []
stem: |
  함수 $f(x)=2^{x-a}+b$의 역함수를 $g(x)$라 하자. 곡선 $y=f(x)$의 점근선과 곡선 $y=g(x)$의 점근선이 만나는 교점을 $P$라 할 때,
  다음 물음에 답하시오. (단, $a,\ b$는 상수)
subparts:
- id: '1'
  stem: |
    ① 두 함수 $f(x)$와 $g(x)$의 점근선의 방정식을 구하여 답만 쓰시오.
    $f(x)$의 점근선 __________ (1.1점)
  points: 1
  depends_on: []
  answer:
    kind: value
    value: y=b
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        지수함수 $f(x)=2^{x-a}+b$의 그래프는 지수함수 $y=2^x$의 그래프를 $x$축의 방향으로 $a$만큼, $y$축의 방향으로 $b$만큼 평행이동한 것이므로 점근선의 방정식은 $y=b$이다.
      source_flow: 해설 p.17
      criteria:
      - 1.B
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B
      mark_type: B
      points: 1
      evidence: $f(x)$의 점근선 $y=b$를 적었다. (원 배점 1.1점)
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $g(x)$의 점근선 __________ (1.4점)
  points: 1
  depends_on:
  - '1'
  answer:
    kind: value
    value: x=b
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        또한, 함수 $g(x)$는 함수 $f(x)$의 역함수이므로 곡선 $y=g(x)$는 곡선 $y=f(x)$를 직선 $y=x$에 대하여 대칭이동한 그래프를 갖는다. 따라서 로그함수 $g(x)$의 점근선의 방정식은 지수함수의 점근선인 $y=b$를 직선 $y=x$에 대하여 대칭이동한 $x=b$가 된다.
      source_flow: 해설 p.17
      criteria:
      - 2.B
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.B
      mark_type: B
      points: 1
      evidence: $g(x)$의 점근선 $x=b$를 적었다. (원 배점 1.4점)
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    ② 점 $P$가 직선 $y=2x-3$ 위에 있을 때, 상수 $b$의 값을 구하여 답만 쓰시오. (2.4점)
  points: 2
  depends_on:
  - '1'
  - '2'
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        ①에서 구한 두 곡선의 점근선의 방정식이 각각 $y=b,\ x=b$이므로, 두 점근선이 만나는 교점 $P$의 좌표는 $(b,b)$이다. 이 점 $P$가 직선 $y=2x-3$ 위의 점이므로 대입하면 대수식 $b=2b-3$이 성립한다. 따라서 $b=3$이 된다.
      source_flow: 해설 p.17
      criteria:
      - 3.B
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
