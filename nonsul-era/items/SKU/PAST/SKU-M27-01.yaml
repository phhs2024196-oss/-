  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        함수 $y=g(x)$의 그래프가 $(5,3)$을 지나므로 $g(5)=3$이 성립한다. 이 때 역함수의 성질에 의하여 $f(3)=5$가 성립해야 한다.
      source_flow: 해설 p.17
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        함수식에 $x=3$을 대입하면 $f(3)=2^{3-a}+b=5$가 되며, ②에서 구한 $b=3$의 값을 대입하여 정리하면 지수방정식 $2^{3-a}+3=5,\ 2^{3-a}=2$를 얻는다.
      source_flow: 해설 p.17
      criteria:
      - 4.M2
    - id: 4b-3
      content: |
        지수법칙에 의해 $3-a=1$이므로 $a=2$이다.
      source_flow: 해설 p.17
      criteria:
      - 4.A1
  rubric:
