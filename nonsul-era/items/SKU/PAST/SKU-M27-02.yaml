stimuli: []
stem: |
  등차수열 $\{a_n\}$의 첫째항부터 제 $n$항까지의 합을 $S_n$이라 하자. $S_n$이 다음 (가), (나)의 조건을 모두 만족시킬 때,
  다음 물음에 답하시오. (단, 공차는 정수이다.)
  (가) 모든 자연수 $n$에 대하여 $S_n\ge S_5$이다.
  (나) $|S_4-S_2|=11$
subparts:
- id: '1'
  stem: |
    ① 조건 (가)와 (나)를 이용하여 $a_3+a_4$를 구하여 답만 쓰시오. (3.1점)
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '-11'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        조건 (가)에서 모든 자연수 $n$에 대하여 $S_n\ge S_5$이므로 $S_n$은 $n=5$일 때 최솟값을 갖는다. 수열의 합이 제5항에서 최소가 되려면 제5항까지 음수인 항들을 제5항까지 더하다가 제6항부터 양수가 더해져야 하므로 공차는 양수이어야 하고, 제5항 이하의 모든 항은 음수 또는 0이다. 즉 $a_3<0,\ a_4<0$이다.
      source_flow: 해설 p.18
      criteria:
      - 1.B
    - id: 1b-2
      content: |
        한편, 수열의 합의 정의에 의해 $S_4-S_2=a_3+a_4$가 성립하므로, 조건 (나)에 의해 $|S_4-S_2|=|a_3+a_4|=11$이 된다. 이 때 $a_3+a_4<0$이므로 절댓값 내부가 음수가 되어 $-(a_3+a_4)=11$이 된다. 따라서 $a_3+a_4=-11$이다.
      source_flow: 해설 p.18
      criteria:
      - 1.B
