- id: '2'
  stem: |
    ② 위의 결과를 바탕으로 수열 $\{a_n\}$의 첫째항 $a_1$과 공차 $d$를 구하여 답만 쓰시오. / 첫째항 $a_1$ = __________ (2.4점) /
  points: 3
  depends_on:
  - '1'
  answer:
    kind: value
    value: '-13'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        수열 $a_n$의 첫째항을 $a_1$, 공차를 $d$라 하면 ①의 결과에 의해 $(a_1+2d)+(a_1+3d)=-11$이므로 $a_1=-\dfrac{5d+11}{2}$이다. 이 식을 조건 (가)에서 도출된 경계 조건인 $a_5\le0$과 $a_6\ge0$에 각각 대입하면 $a_5=a_1+4d=-\dfrac{5d+11}{2}+4d=\dfrac{3d-11}{2}\le0$이므로, $3d\le11,\ d\le\dfrac{11}{3}$, $a_6=a_1+5d=-\dfrac{5d+11}{2}+5d=\dfrac{5d-11}{2}\ge0$이므로 $d\ge\dfrac{11}{5}$가 된다. 따라서 공차 $d$의 범위는 $\dfrac{11}{5}\le d\le\dfrac{11}{3}$이고, $d$는 정수이므로 $d=3$이다. 이를 $a_1$에 대입하면 $a_1=-13$이다.
      source_flow: 해설 p.18
      criteria:
      - 2.B
