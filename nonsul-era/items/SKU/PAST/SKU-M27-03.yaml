stem: |
  곡선 $y=\dfrac12x^4-\dfrac43x^3-x$에 접하는 직선 중 직선 $y=-x+5$에 평행한 두 직선 $y_1$과 $y_2$가 있다.
  (단, ($y_1$ 직선에 의한 접점의 $x$좌표) < ($y_2$ 직선에 의한 접점의 $x$좌표)이다.) 다음에 대하여 답하시오.
subparts:
- id: '1'
  stem: |
    ① 곡선 $y$와 직선 $y_1$과의 접점의 좌표 = __________ (답만 쓰시오. 2.8점)
  points: 3
  depends_on: []
  answer:
    kind: value
    value: (0,0)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\dfrac12x^4-\dfrac43x^3-x$로 놓으면, $f'(x)=2x^3-4x^2-1$이 된다. 곡선 $y=f(x)$의 접선 중 직선 $y=-x+5$에 평행한 직선은 기울기가 $-1$이므로 $f'(x)=-1$에서 $2x^3-4x^2-1=-1$이 된다. 정리하면 $2x^2(x-2)=0$에서 $x=0$ 또는 $x=2$이다. $f(0)=0,\ f(2)=-\dfrac{14}{3}$이므로 곡선 $y=f(x)$의 접선 중 직선 $y=-x+5$에 평행한 두 직선의 접점의 좌표는 각각 $(0,0)$과 $\left(2,-\dfrac{14}{3}\right)$이다.
      source_flow: 해설 p.19
      criteria:
      - 1.B
