stimuli: []
stem: |
  함수 $f(x)=2x^3-12x^2+18x$가 $x=k$에서 극대일 때,
  곡선 $y=f(x)$와 $x$축으로 둘러싸인 부분이 직선 $x=k$에 의하여 나누어지는 두 부분의 넓이를 각각 $S_1,\ S_2\ (S_1\le S_2)$라 하자.
  $\dfrac{S_1}{S_2}=\dfrac{q}{p}$이다. (단, $p$와 $q$는 서로소인 자연수이다.) 다음에 답하시오.
subparts:
- id: '1'
  stem: |
    ① $k$ = __________ (답만 쓰시오. 3.2점)
  points: 3
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=2x^3-12x^2+18x$에서, $f(x)=2x(x^2-6x+9)=2x(x-3)^2$이므로, $f(x)=0$에서 $x=0$ 또는 $x=3$이다. $f'(x)=6x^2-24x+18=6(x^2-4x+3)=6(x-1)(x-3)$이므로, $f'(x)=0$에서 $x=1$ 또는 $x=3$이다. 즉, 함수 $f(x)$는 $x=1$에서 극대이므로 $k=1$이 된다.
      source_flow: 해설 p.20
      criteria:
      - 1.B
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B
      mark_type: B
      points: 3
      evidence: $k=1$을 적었다. (원 배점 3.2점)
      steps:
      - 1b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    ② $S_1$ = __________ (답만 쓰시오. 2.8점)
  points: 3
  depends_on:
  - '1'
  answer:
    kind: value
    value: 11/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        이때 $\displaystyle\int_0^3f(x)\,dx=\int_0^3(2x^3-12x^2+18x)\,dx=\left[\dfrac12x^4-4x^3+9x^2\right]_0^3=\dfrac{27}{2}$이고, $S_1=\displaystyle\int_0^1f(x)\,dx=\int_0^1(2x^3-12x^2+18x)\,dx=\left[\dfrac12x^4-4x^3+9x^2\right]_0^1=\dfrac{11}{2}$이므로
      source_flow: 해설 p.20
      criteria:
      - 2.B
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.B
      mark_type: B
      points: 3
      evidence: $S_1=\dfrac{11}{2}$을 적었다. (원 배점 2.8점)
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    ③ $S_2$ = __________ (답만 쓰시오. 2.5점)
  points: 3
  depends_on:
  - '2'
  answer:
    kind: value
    value: '8'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $S_2=\dfrac{27}{2}-S_1=\dfrac{27}{2}-\dfrac{11}{2}=\dfrac{16}{2}=8$이 된다.
      source_flow: 해설 p.20
      criteria:
      - 3.B
  rubric:
