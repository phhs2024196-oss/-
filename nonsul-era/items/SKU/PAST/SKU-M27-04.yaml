    meaning: 만점
  misconceptions: []
- id: '4'
  stem: |
    ④ $p-q$ = __________ (답만 쓰시오. 1.5점)
  points: 1
  depends_on:
  - '2'
  - '3'
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    steps:
    - id: 4b-1
      content: |
        $\dfrac{S_1}{S_2}=\dfrac{\frac{11}{2}}{8}=\dfrac{11}{16}$이 되므로, $p=16,\ q=11$이다. 따라서 $p-q=16-11=5$이다.
      source_flow: 해설 p.20
      criteria:
