stem: |
  공차가 $0$이 아닌 등차수열 $\{a_n\}$에 대하여 첫째항부터 제$n$항까지의 합을 $S_n$이라 하자. $a_1=30$, $|a_{11}|=|a_{21}|$일 때,

  (1) $a_M=-20$을 만족시키는 자연수 $M$의 값을 구하시오.

  (2) $S_n$의 최댓값을 구하시오.

  (3) $\displaystyle\sum_{n=M}^{100}\frac{4}{a_na_{n+1}}$의 값을 구하시오.
