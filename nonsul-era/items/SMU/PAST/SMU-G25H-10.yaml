    source_flow: 공식 해설·정답 비공개(가이드북 명시) — 출제 의도(가이드북 PDF 26쪽) 흐름에 따른 자체 풀이, sympy 검산
    steps:
    - id: 1b-1
      content: |
        (나)에서 $f'$의 그래프는 $x=1$에 대칭이므로 $f'(x)=3(x-1)^2+k$.
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        (가)에서 분모 $\to0$이므로 $f(2)=-22$, 극한 $=\dfrac{f'(2)}{6}=-\dfrac32$에서 $f'(2)=-9$, $k=-12$.
      criteria:
      - 1.B1
    - id: 1b-3
      content: |
        $f(x)=(x-1)^3-12(x-1)+C$, $f(2)=-11+C=-22$에서 $C=-11$, $f(x)=x^3-3x^2-9x$.
      criteria:
      - 1.B1
