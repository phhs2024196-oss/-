stimuli: []
stem: |
  최고차항의 계수가 $1$인 삼차함수 $f(x)$와 도함수 $f'(x)$가 다음 조건을 만족시킨다.

  (가) $\displaystyle\lim_{x\to3}\frac{f(x-1)+22}{x^2-9}=-\frac{3}{2}$
  (나) 모든 실수 $x$에서 $f'\left(\dfrac{1}{2}-x\right)=f'\left(\dfrac{3}{2}+x\right)$이다.

  함수 $f(x)$를 구하고, 함수 $f(x)$의 극댓값과 극솟값을 구하시오.
