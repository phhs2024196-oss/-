    steps:
    - id: 1b-1
      content: |
        $a=-3+d$, $b=-3+2d$. 등비에서 $b=ar$, $ab=br$이고 $b\ne0$이므로 $r=a$, $b=a^2$.
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $-3+2d=(d-3)^2$, $d^2-8d+12=0$, $d=2$ 또는 $6$. $d=2$이면 $a=-1$, $b=1$, $ab=-1=a$로 서로 다르지 않으므로 $d=6$.
      criteria:
      - 1.B1
