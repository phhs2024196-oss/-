stem: |
  서로 다른 네 수 $-3$, $a$, $b$, $ab$에 대하여 $-3$, $a$, $b$는 이 순서대로 공차가 $d$인 등차수열을 이루고,
  $a$, $b$, $ab$는 이 순서대로 공비가 $r$인 등비수열을 이룬다.
  이때, $d$, $r$ 그리고 $ab$의 값을 구하시오.
