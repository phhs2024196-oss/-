stem: |
  $y=x^2-2(\log_2a+1)x+(\log_2a+7)$의 그래프가 $x$축과 만나지 않도록 하는 양수 $a$의 범위를 $2^m<a<2^n$라 하자.

  (1) $m$, $n$의 값을 구하시오.

  (2) 위에서 구한 $m$, $n$에 대하여 부등식 $\log_4\{x^2+(m-n)x+mn\}\le\log_2\sqrt{mn(m-n)}$을 만족시키는 모든 정수 $x$의 합을 구하시오.
