stem: |
  등차수열 $\{a_n\}$에서 $a_4=7$, $a_{11}=21$일 때,

  (1) 일반항 $a_n$을 구하시오.

  (2) $\displaystyle\sum_{k=1}^{10}\frac{1}{a_ka_{k+2}}$의 값을 구하시오.

  (3) 부등식 $\displaystyle\sum_{k=1}^{m}\frac{4}{a_ka_{k+2}}<\frac{13}{12}$을 만족시키는 자연수 $m$을 모두 구하시오.
