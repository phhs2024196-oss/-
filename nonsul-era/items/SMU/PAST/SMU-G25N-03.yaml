    steps:
    - id: 3b-1
      content: |
        $\sum_{k=1}^{m}\dfrac{4}{a_ka_{k+2}}=\dfrac43-\dfrac1{2m+1}-\dfrac1{2m+3}<\dfrac{13}{12}$ ⇔ $\dfrac1{2m+1}+\dfrac1{2m+3}>\dfrac14$.
      criteria:
