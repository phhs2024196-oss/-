stem: |
  함수 $f(x)$가 모든 실수 $x$에 대하여 $-2x^2+2x\le f(x)\le x^2+2x$를 만족시킬 때,

  (1) $\displaystyle\lim_{x\to0}\frac{\{f(x)\}^2}{3x^2+xf(x)}$의 값을 구하시오.

  (2) $\displaystyle\lim_{x\to-2}\frac{f(x+2)-ax+b}{x^2-4}=4$를 만족시키는 두 상수 $a$, $b$의 값을 구하시오.
subparts:
- id: '1'
  stem: |
    ① $\displaystyle\lim_{x\to0}\frac{\{f(x)\}^2}{3x^2+xf(x)}=$ ______ (4.8점)
  points: 48
  depends_on: []
  answer:
    kind: value
    value: 4/5
    equivalents:
    - $\dfrac45$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 공식 해설·정답 비공개(가이드북 명시) — 출제 의도(가이드북 PDF 31쪽) 흐름에 따른 자체 풀이, sympy 검산
    steps:
    - id: 1b-1
      content: |
        $x>0$, $x<0$ 각각 $x$로 나누면 $\lim_{x\to0}\dfrac{f(x)}x=2$(조임). 식 $=\dfrac{(f/x)^2}{3+f/x}\to\dfrac45$.
      criteria:
      - 1.B1
