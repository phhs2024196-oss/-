stem: |
  $x$에 대한 방정식 $(\log x)^2-(a+2)\log x-a+3=0$의 두 근을 $p$, $q$라 할 때,

  (1) $q=10p$를 만족시키는 음수 $a$의 값을 구하시오.

  (2) 위에서 구한 $a$의 값에 따른 두 근 $p$, $q$를 구하시오.
