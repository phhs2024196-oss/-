    method_no: 1
    source_flow: 공식 해설·정답 비공개(가이드북 명시) — 출제 의도(가이드북 PDF 33쪽) 흐름에 따른 자체 풀이, sympy 검산
    steps:
    - id: 2b-1
      content: |
        $x<2$: $\int_0^x(t-2)(-3t)dt=-x^3+3x^2$. $g(2)=4$.
