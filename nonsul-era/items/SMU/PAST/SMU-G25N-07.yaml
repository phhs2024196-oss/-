    steps:
    - id: 3b-1
      content: |
        $g(x)=0$: $x<2$에서 $-x^2(x-3)=0$ → $x=0$; $x\ge2$에서 $(x-1)(x-4)^2=0$ → $x=4$. $b=2$.
      criteria:
      - 3.B1
    - id: 3b-2
      content: |
        $g(x)=3$: $x<2$에서 $x^3-3x^2+3=0$은 $(-1,0)$, $(1,2)$에 근 2개; $x\ge2$에서 $g$는 $2\to4$ 감소($4\to0$), 이후 증가하므로 근 2개. $c=4$, $b+c=6$.
      criteria:
      - 3.B1
