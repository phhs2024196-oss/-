stimuli: []
stem: |
  함수 $f(x)=\begin{cases}-3x & (x<2)\\3(x-a) & (x\ge2)\end{cases}$가 실수 전체 집합에서 연속이 되도록 하는 상수 $a$의 값을 구하고, 함수

  $g(x)=\displaystyle\int_0^x(t-2)f(t)dt$라 할 때 함수 $g(x)$를 구하시오.

  곡선 $y=g(x)$와 직선 $y=0$과의 교점의 개수는 $b$이고 곡선 $y=g(x)$와 $y=3$ 과의 교점의 개수는 $c$일 때,

  $b+c$의 값을 구하시오. (단, $b$, $c$는 자연수이다.)
