    steps:
    - id: 1b-1
      content: |
        양변을 미분하면 $f(x)-3+xf'(x)=4x^3-3x^2$, $\{xf(x)\}'=4x^3-3x^2+3$, $xf(x)=x^4-x^3+3x+C$. 다항함수이므로 $C=0$, $f(x)=x^3-x^2+3$.
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $f'(x)=3x^2-2x$, $x=0$에서 극대, $f(0)=3$.
      criteria:
      - 1.B1
