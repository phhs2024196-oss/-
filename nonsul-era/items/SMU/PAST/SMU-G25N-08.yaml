stimuli: []
stem: |
  다항함수 $f(x)$가 $\displaystyle\int\{f(x)-3\}dx+\int xf'(x)dx=x^4-x^3$을 만족시킨다.

  (1) 함수 $y=f(x)$가 $x=a$에서 극대일 때, $f(a)$의 값을 구하시오.

  (2) 함수 $y=f(x)$ 위의 점 $(1,\;f(1))$에서의 접선 $\ell$의 방정식을 구하시오.

  (3) 함수 $y=f(x)$와 직선 $\ell$의 그래프로 둘러싸인 도형의 넓이를 구하시오.
