stem: |
  두 함수 $f(x)=p\sin x+q$와 $g(x)=|\cos(rx)|$에 대하여 $f(x)$의 최댓값과 최솟값의 차는 $20$이고, $f\left(\dfrac{\pi}{6}\right)=3$이다. (단, $p$, $q$, $r$은 임의의 상수)

  두 함수 $f(x)$와 $g(x)$의 주기가 같을 때,

  (1) 모든 $p$의 값의 곱을 구하시오.

  (2) 모든 $q$의 값의 합을 구하시오.

  (3) $pr$의 최솟값을 구하시오.
