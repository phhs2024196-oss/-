- id: '2'
  stem: |
    (2) $f(x)$ = ______ (5.9점)
  points: 59
  depends_on: []
  answer:
    kind: expression
    value: x**4+4*x**3+7*x**2+6*x
    equivalents:
    - $x(x+2)(x^2+2x+3)$
    - $x^4+4x^3+7x^2+6x$
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 공식 해설·정답 비공개(가이드북 명시) — 출제 의도(가이드북 PDF 30쪽(인쇄 쪽번호 27)) 흐름에 따른 자체 풀이, sympy 검산
    steps:
    - id: 2b-1
      content: |
        삼차함수 $k$는 실근을 가지며, $x=0$이 아닌 $f$의 근 $x_1$에서 $g$가 연속이려면 분자도 $0$이어야 하므로 $x_1=-2$ ($k(0)=6\ne0$).
      criteria:
      - 2.B1
    - id: 2b-2
      content: |
        $f(x)=x(x+2)h(x)$, $h(0)=3$이고 $\lim_{x\to-2}g=\dfrac1{h(-2)}=c=\dfrac13$이므로 $h(-2)=3$. $h(x)=x^2+2x+3$(실근 없음).
      criteria:
      - 2.B1
    - id: 2b-3
      content: |
        $f(x)=x(x+2)(x^2+2x+3)=x^4+4x^3+7x^2+6x$.
      criteria:
      - 2.B1
