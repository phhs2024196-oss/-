stimuli: []
stem: |
  최고차항의 계수가 1인 사차함수 $f(x)$에 대하여 $\displaystyle\lim_{x\to0}\frac{f(x)}{x}=6$이다.
  상수 $c$에 대하여 함수 $g(x)$가

  $g(x)=\begin{cases}\dfrac{x(x+2)}{f(x)} & (f(x)\ne0)\\ c & (f(x)=0)\end{cases}$

  이고, 함수 $g(x)$가 실수 전체의 집합에서 연속일 때,

  (1) 상수 $c$의 값을 구하시오.

  (2) 함수 $f(x)$를 구하시오.
subparts:
- id: '1'
  stem: |
    (1) 상수 $c$의 값을 구하는 과정을 서술하시오. (4.1점)
  points: 41
  depends_on: []
  answer:
    kind: value
    value: 1/3
    equivalents:
    - $\dfrac13$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 공식 해설·정답 비공개(가이드북 명시) — 출제 의도(가이드북 PDF 30쪽(인쇄 쪽번호 27)) 흐름에 따른 자체 풀이, sympy 검산
    steps:
    - id: 1b-1
      content: |
        극한값이 존재하므로 $f(0)=0$이고 $f(x)=xk(x)$($k$는 삼차, $k(0)=6$).
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(0)=0$이므로 $g(0)=c$이고, 연속이므로 $c=\lim_{x\to0}\dfrac{x(x+2)}{xk(x)}=\dfrac{2}{6}=\dfrac13$.
      criteria:
      - 1.M1
      - 1.A1
