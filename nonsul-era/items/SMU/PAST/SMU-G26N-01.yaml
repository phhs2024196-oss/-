stem: |
  연립방정식 $\begin{cases}2^{a+1}+3^{b+2}=113\\2^{a+2}+3^{b+1}=91\end{cases}$의 해 $a$와 $b$에 대하여,

  $\log_a\left(a+\dfrac{1}{b}\right)^2+\log_b\left(b+\dfrac{1}{a}\right)=\log_b\dfrac{m}{n}$을 만족시킬 때, 다음 물음에 답하시오. (단, $m$과 $n$은 서로소인 자연수)

  (1) $a+b$의 값을 구하시오.

  (2) $n\sqrt{m}$의 값을 구하시오.
