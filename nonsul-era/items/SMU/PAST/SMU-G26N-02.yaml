stimuli: []
stem: |
  $0<x<\pi$에서 방정식 $\dfrac{1}{2-2\cos x}-\dfrac{1}{2+2\cos x}=\dfrac{2}{3}$의 해를 $\alpha$라 하자.

  외접원의 반지름 길이가 $\sqrt{15}$인 삼각형 $\mathrm{ABC}$에 대하여 $\cos A=\dfrac{1}{2}\cos\alpha$를 만족시킬 때,

  (1) $\alpha$의 값을 구하시오.

  (2) $\sin A$의 값을 구하시오.

  (3) 선분 $\overline{\mathrm{BC}}$의 길이를 구하시오.
