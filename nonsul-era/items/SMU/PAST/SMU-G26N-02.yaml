    equivalents:
    - $\dfrac{\pi}{3}$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 공식 해설·정답 비공개(가이드북 명시) — 출제 의도(가이드북 PDF 32쪽(인쇄 쪽번호 29)) 흐름에 따른 자체 풀이, sympy 검산
    steps:
    - id: 1b-1
      content: |
        좌변 $=\dfrac{4\cos x}{4-4\cos^2x}=\dfrac{\cos x}{\sin^2x}=\dfrac23$이므로 $2\cos^2x+3\cos x-2=0$, $(2\cos x-1)(\cos x+2)=0$에서 $\cos x=\dfrac12$, $\alpha=\dfrac{\pi}{3}$.
      criteria:
      - 1.B1
