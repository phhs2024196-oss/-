stem: |
  모든 자연수 $n$에 대하여 $a_n<a_{n+1}$이고, 첫째항 $a_1$과 공비의 곱이 1인 등비수열 $\{a_n\}$에 대하여 수열 $\{b_n\}$을 $b_n=a_{3n-1}$이라 하자. 수열 $\{a_n\}$의 첫째항에서 제$n$항까지의 합을 $A_n$, 수열 $\{b_n\}$의 첫째항에서 제$n$항까지의 합을 $B_n$이라 할 때, $2A_9=7B_3$을 만족시킨다. 다음 물음에 답하시오.

  (1) 등비수열 $\{a_n\}$의 공비를 구하시오.

  (2) $\dfrac{b_n}{a_n}>1024$를 만족시키는 가장 작은 자연수 $n$을 구하시오.

  (3) $\log_{b_3}a_5$의 값을 구하시오.
subparts:
- id: '1'
  stem: |
    ① 등비수열 $\{a_n\}$의 공비를 구하는 과정을 서술하시오. (5.1점)
  points: 51
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 공식 해설·정답 비공개(가이드북 명시) — 출제 의도(가이드북 PDF 33쪽(인쇄 쪽번호 30)) 흐름에 따른 자체 풀이, sympy 검산
    steps:
    - id: 1b-1
      content: |
        공비를 $r$라 하면 $a_1=\dfrac1r$, $a_n=r^{n-2}$이고 $b_n=a_{3n-1}=r^{3n-3}$은 첫째항 $1$, 공비 $r^3$인 등비수열이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $A_9=\dfrac{r^9-1}{r(r-1)}$, $B_3=\dfrac{r^9-1}{r^3-1}$이므로 $2A_9=7B_3$에서 $\dfrac{2}{r(r-1)}=\dfrac{7}{r^3-1}$, $2(r^2+r+1)=7r$, $2r^2-5r+2=0$, $r=2$ 또는 $r=\dfrac12$.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $a_n<a_{n+1}$이고 $a_1=\dfrac1r>0$이므로 $r>1$, 공비는 $2$이다.
      criteria:
      - 1.M1
      - 1.A1
