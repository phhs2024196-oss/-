stimuli: []
stem: |
  두 다항함수 $f(x)$와 $g(x)$가

  $g(x)=x^2+\displaystyle\int_0^1(2x+t)f(t)dt$, $\displaystyle\int_1^x f(t)dt=xg(x)+2x+2$를 만족시킬 때,

  (1) 함수 $g(x)$를 구하시오.

  (2) 함수 $f(x)$를 구하시오.

  (3) 직선 $y=2$와 곡선 $y=f(x)-g(x)$로 둘러싸인 도형의 넓이를 구하시오.
subparts:
- id: '1'
  stem: |
    ① $g(x)$ = ______ (3.6점)
  points: 36
  depends_on: []
  answer:
    kind: expression
    value: x**2-4*x-1
    equivalents:
    - $x^2-4x-1$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 공식 해설·정답 비공개(가이드북 명시) — 출제 의도(가이드북 PDF 34쪽(인쇄 쪽번호 31)) 흐름에 따른 자체 풀이, sympy 검산
    steps:
    - id: 1b-1
      content: |
        $A=\int_0^1f(t)dt$, $B=\int_0^1tf(t)dt$라 하면 $g(x)=x^2+2Ax+B$이다.
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        둘째 식에 $x=1$을 넣으면 $g(1)=-4$, 즉 $2A+B=-5$. 양변을 미분하면 $f(x)=g(x)+xg'(x)+2=3x^2+4Ax+B+2$.
      criteria:
      - 1.B1
    - id: 1b-3
      content: |
        $A=\int_0^1f=1+2A+B+2=-2$이므로 $A=-2$, $B=-1$, $g(x)=x^2-4x-1$.
      criteria:
      - 1.B1
