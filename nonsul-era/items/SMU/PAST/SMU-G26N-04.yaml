intent: |
  다항함수의 정적분을 이해하고 구할 수 있다. 정적분과 미분과의 관계를 이해하고 구할 수 있다. 곡선으로 둘러싸인 도형의 넓이를 구할 수 있다.
key_idea: |
  $\int_0^1 f(t)dt=A$, $\int_0^1 tf(t)dt=B$로 두면 $g(x)=x^2+2Ax+B$이고, 둘째 식을 미분하면 $f=g+xg'+2$.
  [주의] 원문 결함 의심: 첫째 식의 $\int_0^1tf(t)dt$ 가 $-\frac{17}{12}$ 로 $B=-1$ 과 모순(조건 과잉) — 출제 의도 풀이($g(1)=-4$, $A=\int_0^1f$)로 답 입력, 교차검증 대상
