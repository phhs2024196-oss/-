    steps:
    - id: 3b-1
      content: |
        $f'(t)=16$에서 $(t+1)(t-2)^2=4$, $t^2(t-3)=0$이므로 $g(t)=f'(t)\;(-1\le t\le0)$, $16\;(0\le t\le3)$, $f'(t)\;(t\ge3)$.
      criteria:
      - 3.B1
    - id: 3b-2
      content: |
        $f(x)=x^4-4x^3+16x-16$이므로 $\int_{-1}^4g=\{f(0)-f(-1)\}+48+\{f(4)-f(3)\}=11+48+43=102$.
      criteria:
      - 3.B1
