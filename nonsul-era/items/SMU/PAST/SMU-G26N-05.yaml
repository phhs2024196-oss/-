    source_flow: 공식 해설·정답 비공개(가이드북 명시) — 출제 의도(가이드북 PDF 35쪽(인쇄 쪽번호 32)) 흐름에 따른 자체 풀이, sympy 검산
    steps:
    - id: 1b-1
      content: |
        (가)에서 $f'(x)=4(x+1)(x-\alpha)^2$이고 (나)에서 $f(0)=f(\alpha)-\int_0^\alpha4(x+1)(x-\alpha)^2dx=-\dfrac{\alpha^4+4\alpha^3}{3}=-16$.
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $\alpha^4+4\alpha^3-48=(\alpha-2)(\alpha^3+6\alpha^2+12\alpha+24)=0$, $\alpha>0$이므로 $\alpha=2$.
      criteria:
      - 1.B1
