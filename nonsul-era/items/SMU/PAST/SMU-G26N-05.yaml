  정적분과 미분과의 관계를 이해하고 이를 문제에 활용할 수 있다. 함수의 미분을 이용하여 극대와 극소를 판정한다. 도함수의 부호를 통해 함수의 증가 감소를 파악하고 이를 이용해 함수의 개형을 파악한다.
