stimuli: []
stem: |
  최고차항의 계수가 $1$인 사차함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $f(x)$의 도함수 $y=f'(x)$의 그래프는 $x$축과 $x=-1$에서 만나고, $x=\alpha\;(\alpha>0)$에서 접한다.
  (나) $f(\alpha)=0$이고, $f(0)=-16$이다.

  구간 $-1\le x\le t\;(t\ge-1)$에서 $f'(x)$의 최댓값을 $g(t)$라 할 때,

  (1) 위의 조건을 만족시키는 양수 $\alpha$의 값을 구하시오.

  (2) $g\left(\dfrac{3}{2}\right)$의 값을 구하시오.

  (3) $\displaystyle\int_{-1}^{4}g(t)dt$의 값을 구하시오.
