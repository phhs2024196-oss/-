stimuli: []
stem: |
  함수 $f(x)=\log_a x\;(a>0,\;a\ne1)$가 다음 조건을 만족시킨다.

  (가) $1<p<q$인 모든 실수 $p$, $q$에 대하여 $f(p)(q-1)>f(q)(p-1)$이다.
  (나) $|f(8)|=3$

  함수 $y=f(x)$의 그래프를 $x$축에 대하여 대칭이동한 후, $y$축의 방향으로 $4$만큼 평행이동한 그래프를 나타내는 함수를 $y=g(x)$라 하자. 두 함수 $y=f(x)$와 $y=g(x)$가 $x$축과 만나는 점을 각각 $\mathrm{A}$와 $\mathrm{B}$라 하고, 두 함수의 교점을 $\mathrm{C}$라 할 때,

  (1) $f(x)=\log_a x$에서 밑 $a$의 값을 구하시오.

  (2) 삼각형 $\mathrm{ABC}$의 넓이를 구하시오.

  (3) 함수 $y=f(x)$의 역함수의 그래프를 원점에 대하여 대칭이동하고, 직선 $y=x$에 대하여 대칭이동한 후, $x$축의 방향으로 $k$만큼 평행이동한 그래프가 점 $(-6,\;-1)$을 지날 때, 실수 $k$의 값을 구하시오.
