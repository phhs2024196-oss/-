stimuli: []
stem: |
  모든 항이 자연수인 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여 아래의 조건을 만족시킨다.

  (가) $a_{2n-1}=n^3+1$
  (나) $a_{2n}-a_{2n-1}=d\;(d$는 상수$)$
  (다) $a_n<a_{n+1}$

  다음 물음에 답하시오.

  (1) $\displaystyle\sum_{n=1}^{13}a_n$의 최댓값과 최솟값의 차이를 구하시오.

  (2) $\displaystyle\sum_{n=1}^{13}a_n$의 값이 최소일 때, $a_{16}$의 값을 구하시오.
subparts:
- id: '1'
  stem: |
    ① $\displaystyle\sum_{n=1}^{13}a_n$의 최댓값과 최솟값의 차이를 구하는 과정을 서술하시오. (7.8점)
  points: 78
  depends_on: []
  answer:
    kind: value
    value: '30'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 공식 해설·정답 비공개(가이드북 명시) — 출제 의도(가이드북 PDF 37쪽(인쇄 쪽번호 34)) 흐름에 따른 자체 풀이, sympy 검산
    steps:
    - id: 1b-1
      content: |
        (다)에서 $a_{2n-1}<a_{2n}$이므로 $d>0$, $a_{2n}<a_{2n+1}$이므로 $n^3+1+d<(n+1)^3+1$, 즉 $d<3n^2+3n+1$이 모든 $n$에서 성립해야 하므로 $d<7$. 항이 자연수이므로 $d\in\{1,2,\dots,6\}$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\sum_{n=1}^{13}a_n=\sum_{n=1}^{7}(n^3+1)+\sum_{n=1}^{6}(n^3+1+d)=791+447+6d=1238+6d$.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        최댓값($d=6$)과 최솟값($d=1$)의 차이는 $6\cdot5=30$.
      criteria:
      - 1.M1
      - 1.A1
