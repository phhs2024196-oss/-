stimuli: []
stem: |
  최고차항의 계수가 $1$인 이차함수 $f(x)$에 대하여 $\displaystyle\lim_{x\to1}\frac{f(x)}{x-1}$의 값이 존재하고, 미분가능한 함수 $g(x)$의 도함수가 $g'(x)=f(|x+5|)-f(|x|)$이다. 함수 $g(x)$가 $x=\dfrac{1}{2}$에서 극솟값을 가질 때,

  (1) 이차함수 $f(x)$를 구하시오.

  (2) $x_0\ne\dfrac{1}{2}$이고 $g'(x_0)=0$을 만족시키는 두 실수 $x_0=\alpha$와 $x_0=\beta$를 구하시오. (단, $\alpha<\beta$)

  (3) 함수 $g(x)$가 극댓값을 갖도록 하는 $x$의 값을 정확히 구하시오.
subparts:
- id: '1'
  stem: |
    ① $f(x)$ = ______ (2.7점)
  points: 27
  depends_on: []
  answer:
    kind: expression
    value: x**2-6*x+5
    equivalents:
    - $x^2-6x+5$
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 공식 해설·정답 비공개(가이드북 명시) — 출제 의도(가이드북 PDF 38쪽(인쇄 쪽번호 35)) 흐름에 따른 자체 풀이, sympy 검산
    steps:
    - id: 1b-1
      content: |
        극한이 존재하므로 $f(1)=0$, $f(x)=(x-1)(x-k)$. $g'\left(\frac12\right)=f\left(\frac{11}2\right)-f\left(\frac12\right)=0$에서 $\frac92\left(\frac{11}2-k\right)=-\frac12\left(\frac12-k\right)$, $k=5$. $f(x)=x^2-6x+5$.
      criteria:
      - 1.B1
