intent: |
  함수의 대칭이동을 문제에 활용할 수 있다. 절대값의 성질을 이용하여 값을 계산하고 이를 문제에 활용할 수 있다. 도함수의 부호를 통해 함수의 증가 감소를 파악하고 이를 이용해 함수의 개형을 파악한다.
key_idea: |
  $f(1)=0$에서 $f(x)=(x-1)(x-k)$, $g'(\tfrac12)=0$으로 $k=5$. 이후 $x<-5$, $-5\le x<0$, $x\ge0$으로 나누면 $g'$은 각 구간에서 일차식.
