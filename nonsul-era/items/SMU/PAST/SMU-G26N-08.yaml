- id: '2'
  stem: |
    ② 두 실수 $\alpha$와 $\beta$를 구하는 과정을 서술하시오. (5.0점)
  points: 50
  depends_on: []
  answer:
    kind: set
    value: alpha=-11/2; beta=-5/2
    equivalents:
    - $\alpha=-\dfrac{11}{2}$, $\beta=-\dfrac52$
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 공식 해설·정답 비공개(가이드북 명시) — 출제 의도(가이드북 PDF 38쪽(인쇄 쪽번호 35)) 흐름에 따른 자체 풀이, sympy 검산
    steps:
    - id: 2b-1
      content: |
        $x\ge0$: $g'(x)=f(x+5)-f(x)=10x-5$ → 근 $\frac12$뿐.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $-5\le x<0$: $g'(x)=f(x+5)-f(-x)=-2x-5$ → 근 $-\frac52$.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        $x<-5$: $g'(x)=f(-x-5)-f(-x)=10x+55$ → 근 $-\frac{11}2$. 따라서 $\alpha=-\frac{11}2$, $\beta=-\frac52$.
      criteria:
      - 2.M1
      - 2.A1
