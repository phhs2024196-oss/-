  함수의 곱의 미분법을 이용하여 주어진 함수식을 계산할 수 있는지(1-1), 부분적분법을 이용하여 주어진 함수식 간의 관계를 유도하고 이차방정식으로 표시되는 관계에서 근을 찾을 수 있는지(1-2)를 평가한다.
key_idea: |
  $f(x+1)=(x+1)f(x)$를 미분한 $f'(x+1)-(x+1)f'(x)=f(x)$를 $f'(4)-9f'(2)-6f'(1)$에 맞게 묶고, $f(u)$는 부분적분 후 $(1-x)^{11}=(1-x)(1-x)^{10}$으로 쪼개 $f(u)=\frac{u}{11}f(u-1)-\frac{u}{11}f(u)$를 얻는다.
stuck: |
