stimuli:
- label: 가
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능할 때, 함수 $f(x)g(x)$를 $x$에 대하여 미분하면
    $$\{f(x)g(x)\}'=f'(x)g(x)+f(x)g'(x)$$
    이다.
    구간 $[a,b]$에서 두 함수 $f(x)$, $g(x)$의 도함수가 연속이면
    $$\int_a^bf(x)g'(x)dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf'(x)g(x)dx=f(b)g(b)-f(a)g(a)-\int_a^bf'(x)g(x)dx$$
    이다.

stem: |
  제시문을 읽고 다음 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    양의 실수에서 정의된 함수 $f(x)$는 미분가능하고
    $$f(x+1)=(x+1)f(x),\quad f(1)=1$$
    을 만족시킨다. $f'(4)-9f'(2)-6f'(1)$의 값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: value, value: '17', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'(x+1)-(x+1)f'(x)=f(x)$를 $x=3,2,1$에 써서 $f'(4)-9f'(2)-6f'(1)=f(3)+4f(2)+3f(1)=17$.
    steps:
    - {id: 1a, content: '$f''(4)-9f''(2)-6f''(1)=\{f''(4)-4f''(3)\}+4\{f''(3)-3f''(2)\}+3\{f''(2)-2f''(1)\}=3!+4\cdot2!+3\cdot1=17$', criteria: ['1.B1', '1.M1', '1.A1']}
    hint_ladder:
    - 주어진 함수방정식의 양변을 미분해 보자.
    - $f'(3)$, $f'(2)$를 소거하도록 묶어 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-44.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수의 곱의 미분법에 의해 다음의 관계가 성립한다.
        $f'(x+1)=f(x)+(x+1)f'(x)\ \Rightarrow\ f'(x+1)-(x+1)f'(x)=f(x)\qquad\cdots\cdots\ ①$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        정의된 함수의 관계를 이용하면 $f(1)=1$, $f(2)=2f(1)=2!$, $f(3)=3f(2)=3!$, $\cdots$이다.
      criteria: ['1.B1']
    - id: 1b-3
      content: |
        $f'(4)-9f'(2)-6f'(1)$에 식 ①의 관계를 적용하면
        $f'(4)-9f'(2)-6f'(1)=f'(4)-4f'(3)+4(f'(3)-3f'(2))+3(f'(2)-2f'(1))=f(3)+4f(2)+3f(1)=3!+4\times2!+3\times1=17$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 17
      evidence: |
        (기준 ①) $f(1)=1$, $f(2)=2f(1)=2$, $f(3)=3f(2)=6$임을 보였다.
      depends_on: []
      steps: [1b-2]
    - id: 1.M1
      mark_type: M
      points: 17
      evidence: |
        (기준 ②) $f(x+1)=(x+1)f(x)$를 미분하여 $f'(x+1)=f(x)+(x+1)f'(x)$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 16
      evidence: |
        (기준 ③) ①과 ②의 관계를 이용하여 $f'(4)-9f'(2)-6f'(1)=17$임을 보였다.
      depends_on: [1.M1, 1.B1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    함수 $f(u)$는
    $$f(u)=\int_0^1x^u(1-x)^{10}dx,\quad u\ge1$$
    이다. $u\ge2$일 때, $f(u)=g(u)f(u-1)$인 $g(u)$를 구하고 $f(u+1)=\dfrac{1}{12}f(u-1)$인 $u$의 값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'g(u) = u/(u+11); u = 4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 부분적분으로 $f(u)=\frac{u}{11}\int_0^1x^{u-1}(1-x)^{11}dx=\frac{u}{11}\{f(u-1)-f(u)\}$, 즉 $g(u)=\frac{u}{u+11}$; $g(u+1)g(u)=\frac1{12}$에서 $u=4$.
    steps:
    - {id: 2a, content: '$g(u)=\frac{u}{u+11}$, $\frac{u(u+1)}{(u+11)(u+12)}=\frac1{12}\Rightarrow(u-4)(u+3)=0$, $u=4$', criteria: ['2.M1', '2.A1', '2.A2']}
    hint_ladder:
    - $x^u$을 미분하고 $(1-x)^{10}$을 적분하는 부분적분을 해 보자.
    - $(1-x)^{11}=(1-x)(1-x)^{10}$으로 쪼개면 무엇이 보이는가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-45.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        부분적분에 의해
        $f(u)=\displaystyle\int_0^1x^u(1-x)^{10}dx=-x^u\frac{1}{11}(1-x)^{11}\Big|_{x=0}^{1}+\frac{u}{11}\int_0^1x^{u-1}(1-x)^{11}dx=\frac{u}{11}\int_0^1x^{u-1}(1-x)^{11}dx$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이 식이 $f(u)$ 또는 $f(u-1)$의 꼴이 되기 위해서는 $(1-x)$의 지수가 $10$이 되어야 하므로
        $f(u)=\dfrac{u}{11}\displaystyle\int_0^1x^{u-1}(1-x)(1-x)^{10}dx=\frac{u}{11}\int_0^1(x^{u-1}-x^u)(1-x)^{10}dx$
        $=\dfrac{u}{11}\left(\displaystyle\int_0^1x^{u-1}(1-x)^{10}dx-\int_0^1x^u(1-x)^{10}dx\right)=\dfrac{u}{11}f(u-1)-\dfrac{u}{11}f(u)$
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        위 관계식을 정리하면 $f(u)=\dfrac{u}{u+11}f(u-1)$이므로 $g(u)=\dfrac{u}{u+11}$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        이 관계식을 이용하면 $f(u+1)=\dfrac{u+1}{u+12}f(u)=\dfrac{(u+1)u}{(u+12)(u+11)}f(u-1)$이므로, $\dfrac{u(u+1)}{(u+11)(u+12)}=\dfrac{1}{12}$을 만족시키는 $u$를 찾는다.
        $12u^2+12u=u^2+21u+132\ \Rightarrow\ 11u^2-11u-132=0\ \Rightarrow\ u^2-u-12=(u-4)(u+3)=0$
        $u\ge2$이므로 $u=4$이다.
      criteria: ['2.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 17
      evidence: |
        (기준 ④) 부분적분법에 의해 $f(u)=\dfrac{u}{11}\displaystyle\int_0^1x^{u-1}(1-x)^{11}dx$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 17
      evidence: |
        (기준 ⑤) ④의 적분식이 $f(u)=\dfrac{u}{11}f(u-1)-\dfrac{u}{11}f(u)$가 되고 이를 정리하면 $g(u)=\dfrac{u}{u+11}$임을 보였다.
      depends_on: [2.M1]
      steps: [2b-2, 2b-3]
    - id: 2.A2
      mark_type: A
      points: 16
      evidence: |
        (기준 ⑥) $f(u+1)=\dfrac{(u+1)u}{(u+12)(u+11)}f(u-1)$에서 $u^2-u-12=0$의 근 $u=-3,4$ 중 $u\ge2$이므로 $u=4$임을 보였다.
      depends_on: [2.A1, 2.M1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

