  제시문 <나>에서 설명한 수열을 주어진 함수에 대하여 귀납적으로 정의할 수 있는지(2-1), 제시문 <다>의 과정을 이해하여 제시문 <나>에서 설명한 수열이 수렴하게 하는 $d$의 값을 바르게 구할 수 있는지(2-2)를 평가한다.
key_idea: |
  법선의 기울기 $-\dfrac{1}{f'(x_n)}$과 높이 차 $d$로 $x_{n+1}=x_n-f'(x_n)d$를 얻고, $f'$이 일차식이면 $x_{n+1}=px_n+q$ 꼴이 되어 공비 $p$인 등비수열 $\{x_n-\alpha\}$의 수렴 조건 $\lvert p\rvert<1$로 판정한다.
stuck: |
