# 숙명여대 2023학년도 수시모집 논술우수자전형 자연계열 계열문항 2 — 기출 원문은 내부 분석용(allowed_use: internal_only)
# 원문: img/G23/q-2.png / 문항카드 card-38~47
# 배점: 문항카드 채점 기준은 계열문항(2-1·2-2 합산)마다 6가지 기준 충족 개수에 따른 1~9등급제뿐(숫자 배점 없음).
#   원문 방식: 「1등급: 6가지 모두 + 논리 완벽 / 2등급: 6가지 모두, 논리·표현 다소 부족 / 3등급: 5가지 / 4등급: ①과 ② + 나머지 중 2가지 /
#   5등급: 4가지(4등급 제외) / 6등급: 3가지 / 7등급: 2가지 / 8등급: 1가지 / 9등급: 전혀 충족 못 함」.
#   아래 points 는 소문항 2개 × 50 = 100 균등, 기준 ①~③ → 2-1, ④~⑥ → 2-2 에 17/17/16 배정.  # [확인필요] 배점 미공개
# 참고: 문항카드 예시 답안 2-2 는 「-1<1-6d≤1 이어야 하고 0≤d<1/3」이라 적었는데, 1-6d=1(d=0)이면 수열이 상수(수렴)이므로 그 자체는 맞고 d>0 으로 0<d<1/3.
