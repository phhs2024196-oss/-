stimuli:
- label: 나
  body: |
    오른쪽 그림과 같이 함수 $y=f(x)$의 그래프 위의 한 점 $\mathrm{P}_1(x_1,y_1)$에 대하여 점 $\mathrm{P}_1$을 지나고 점 $\mathrm{P}_1$에서의 접선과 수직인 직선을 $l$이라 하자. 양수 $d$에 대하여 직선 $y=y_1+d$와 직선 $l$의 교점을 $\mathrm{Q}_1$이라 하고, 점 $\mathrm{Q}_1$을 지나고 $y$축과 평행한 직선과 $y=f(x)$의 그래프의 교점을 점 $\mathrm{P}_2(x_2,y_2)$라 하자. 같은 방법으로 점 $\mathrm{P}_2$를 지나고 점 $\mathrm{P}_2$에서의 접선과 수직인 직선이 직선 $y=y_2+d$와 만나는 점을 $\mathrm{Q}_2$라 하고, 점 $\mathrm{Q}_2$를 지나고 $y$축과 평행한 직선과 $y=f(x)$의 그래프의 교점을 점 $\mathrm{P}_3(x_3,y_3)$이라 하자. 이와 같은 과정을 반복하여 $n$번째 얻은 점을 $\mathrm{P}_n(x_n,y_n)$이라 하자.
    점 $\mathrm{P}_n$의 $x$좌표로 이루어진 수열 $\{x_n\}$의 수렴과 발산은 $d$의 값에 따라 달라지고, 수렴하는 경우 수열 $\{x_n\}$의 극한값은 함수 $y=f(x)$가 극소가 되는 $x$의 값이다.
    [그림: 원점 근처에서 극소인 아래로 볼록한 곡선 $y=f(x)$ 위의 점 $\mathrm{P}_1$에서의 접선과 그에 수직인 직선 $l$, $\mathrm{P}_1$보다 $d$만큼 위에 있는 $l$ 위의 점 $\mathrm{Q}_1$, $\mathrm{Q}_1$에서 수직으로 내려 곡선과 만나는 점 $\mathrm{P}_2$]
- label: 다
  body: |
    다음과 같이 귀납적으로 정의된 수열 $\{a_n\}$의 수렴, 발산을 조사해보자.
    $$a_1=1$$
    $$a_{n+1}=pa_n+q\quad(\text{단, }p,\ q\text{는 상수이고 }n=1,\ 2,\ 3,\ \cdots)\qquad\cdots\cdots\ ①$$
    이 수열이 수렴하는 경우 $\displaystyle\lim_{n\to\infty}a_n=\alpha$라 하면 $\displaystyle\lim_{n\to\infty}a_{n+1}=\alpha$이므로 식 ①에서
    $$\alpha=p\alpha+q\qquad\cdots\cdots\ ②$$
    이다. 이때 수열 $\{a_n\}$이 $\alpha$로 수렴하는 것은 수열 $\{a_n-\alpha\}$가 $0$으로 수렴하는 것과 같다. 식 ①에서 식 ②를 빼면 $a_{n+1}-\alpha=p(a_n-\alpha)$이므로 수열 $\{a_n-\alpha\}$는 공비가 $p$인 등비수열이다. 따라서 $p$의 값에 따라 수열 $\{a_n\}$의 수렴 여부가 달라진다.

stem: |
  제시문 <나>에서 구한 점 $\mathrm{P}_n$의 $x$좌표를 $x_n$이라 할 때 다음 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    $f(x)=3x^2$에 대하여 점 $\mathrm{P}_1(1,3)$, $d=\dfrac15$일 때, 수열 $\{x_n\}$을 귀납적으로 정의하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'x_1 = 1; x_(n+1) = -x_n/5', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: |
      법선 위에서 $y$가 $d$ 늘면 $x$는 $-f'(x_n)d$ 변하므로 $x_{n+1}=x_n-6x_n\cdot\frac15=-\frac15x_n$.
    steps:
    - id: 1a
      content: |
        $x_{n+1}=x_n-f'(x_n)d$, $x_1=1$, $x_{n+1}=\left(-\dfrac15\right)x_n$
      criteria: ['1.M1', '1.M2', '1.A1']
    hint_ladder:
    - 접선과 수직인 직선의 기울기는 무엇인가?
    - $\mathrm{Q}_n$의 좌표를 $(x_{n+1},y_n+d)$로 놓아 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-45.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P}_n(x_n,y_n)$과 $\mathrm{Q}_n(x_{n+1},y_n+d)$를 지나는 직선은 점 $\mathrm{P}_n$에서의 접선과 수직이므로 기울기가 $-\dfrac{1}{f'(x_n)}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $\dfrac{(y_n+d)-y_n}{x_{n+1}-x_n}=\dfrac{d}{x_{n+1}-x_n}=-\dfrac{1}{f'(x_n)}$이다. 그러므로 $x_{n+1}=x_n-f'(x_n)d$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $f'(x)=6x$이므로 수열 $\{x_n\}$은 귀납적으로 정의된 수열
        $x_1=1,\quad x_{n+1}=x_n-6x_n\times\dfrac15=\left(-\dfrac15\right)x_n$임을 알 수 있다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 17
      evidence: |
        (기준 ①) 점 $\mathrm{P}_n$을 지나고 점 $\mathrm{P}_n$에서의 접선과 수직이므로 기울기가 $-\dfrac{1}{f'(x_n)}$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 17
      evidence: |
        (기준 ②) $x_{n+1}$과 $x_n$의 관계식 $x_{n+1}=x_n-f'(x_n)d$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 16
      evidence: |
        (기준 ③) 수열 $\{x_n\}$의 귀납적 정의가 $x_1=1$, $x_{n+1}=\left(-\dfrac15\right)x_n$임을 보였다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    $f(x)=3(x^2-x)$에 대하여 점 $\mathrm{P}_1(1,0)$일 때, 수열 $\{x_n\}$이 수렴하도록 하는 $d$의 값의 범위를 구하시오.
  points: 50
  depends_on: ['1']
  answer: {kind: set, value: 'Interval.open(0, 1/3)', equivalents: ['0<d<1/3'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x_{n+1}=(1-6d)x_n+3d$이므로 $\{x_n-\frac12\}$는 공비 $1-6d$인 등비수열, $\lvert1-6d\rvert<1$과 $d>0$에서 $0<d<\frac13$.
    steps:
    - {id: 2a, content: '$x_{n+1}-\alpha=(1-6d)(x_n-\alpha)$, $-1<1-6d<1$, $0<d<\frac13$', criteria: ['2.B1', '2.M1', '2.A1']}
    hint_ladder:
    - 2-1에서 얻은 관계식에 $f'(x)=3(2x-1)$을 넣어 보자.
    - 제시문 <다>처럼 극한값 $\alpha$를 빼 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-45.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f'(x)=3(2x-1)$이므로 수열 $\{x_n\}$은 귀납적으로 정의된 수열
        $x_1=1$, $x_{n+1}=x_n-3(2x_n-1)d=(1-6d)x_n+3d\qquad\cdots\cdots\ ①$이다.
      criteria: ['2.B1']
    - id: 2b-2
      content: |
        수열 $\{x_n\}$이 수렴하는 경우 $\displaystyle\lim_{n\to\infty}x_n=\alpha$라 하면 $\displaystyle\lim_{n\to\infty}x_{n+1}=\alpha$이므로 식 ①에서 $\alpha=(1-6d)\alpha+3d\qquad\cdots\cdots\ ②$이다.
        식 ①에서 식 ②를 빼면 $x_{n+1}-\alpha=(1-6d)(x_n-\alpha)$이고, 따라서 수열 $\{x_n-\alpha\}$는 공비가 $(1-6d)$인 등비수열이다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        이 수열이 수렴하기 위해서는 $-1<1-6d\le1$이어야 하고 $0\le d<\dfrac13$이다. 그런데 $d$는 양수이므로 $0<d<\dfrac13$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 17
      evidence: |
        (기준 ④) 수열 $\{x_n\}$의 귀납적 정의가 $x_1=1$, $x_{n+1}=(1-6d)x_n+3d$임을 보였다.
      depends_on: []
      ft: {allowed: true, from: [1.M2], max_points: 17}
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 17
      evidence: |
        (기준 ⑤) $\displaystyle\lim_{n\to\infty}x_n=\alpha$라 할 때 $x_{n+1}-\alpha=(1-6d)(x_n-\alpha)$를 만족시키고 따라서 $\{x_n-\alpha\}$가 공비 $(1-6d)$인 등비수열임을 보였다.
      depends_on: [2.B1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 16
      evidence: |
        (기준 ⑥) 수열 $\{x_n-\alpha\}$가 수렴하기 위한 $d$의 값의 범위가 $0<d<\dfrac13$임을 바르게 보였다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

