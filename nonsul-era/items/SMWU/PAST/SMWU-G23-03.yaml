stimuli:
- label: 라
  body: |
    반지름의 길이가 $1$인 원 $\mathrm{O}$에 $n$각형이 내접하고 있다. $n$각형의 꼭짓점을 각각 $\mathrm{A}_1,\mathrm{A}_2,\cdots,\mathrm{A}_n$이라 하자. 원의 중심 $\mathrm{O}$는 $n$각형의 내부에 있고 $\theta_i=\angle\mathrm{OA}_i\mathrm{A}_{i+1}$이다. (단, $\theta_n=\angle\mathrm{OA}_n\mathrm{A}_1$)
    현 $\mathrm{A}_i\mathrm{A}_{i+1}$의 길이를 $x$, 원의 중심 $\mathrm{O}$에서 현 $\mathrm{A}_i\mathrm{A}_{i+1}$에 내린 수선의 길이를 $h$라 하면 삼각형 $\mathrm{OA}_i\mathrm{A}_{i+1}$의 넓이는 $\dfrac12xh$이다.
    [그림: 중심 $\mathrm{O}$인 원에 내접하는 $n$각형 $\mathrm{A}_1\mathrm{A}_2\cdots\mathrm{A}_n$과 삼각형 $\mathrm{OA}_i\mathrm{A}_{i+1}$, 꼭짓점 $\mathrm{A}_i$에서의 각 $\theta_i$ 표시]
- label: 마
  body: |
    구간 $[a,b]$에서 연속인 함수 $f(x)$의 그래프가 위로 볼록이면 그 구간에 있는 $n$개의 점 $x_1,x_2,\cdots,x_n$에 대하여 부등식
    $$\frac1n\sum_{i=1}^{n}f(x_i)\le f\left(\frac1n\sum_{i=1}^{n}x_i\right)$$
    가 성립한다. 여기서 등호는 $x_1=x_2=\ \cdots\ =x_n$일 때 성립한다.
- label: 바
  body: |
    기원전 $3$세기의 고대 그리스 수학자 아르키메데스는 원에 내접하는 정다각형의 둘레와 외접하는 정다각형의 둘레를 비교하여 원주율을 계산하였다. 원의 둘레는 그 원에 외접하는 정다각형의 둘레보다 짧고 내접하는 정다각형의 둘레보다 길다. 이때 정다각형의 변이 많아질수록 외접하는 정다각형의 둘레와 내접하는 정다각형의 둘레의 차는 작아지므로 정다각형의 둘레는 원의 둘레에 가까워진다. 아르키메데스는 원에 내접하는 정$96$각형의 둘레와 원에 외접하는 정$96$각형의 둘레를 구하여 원주율이 $3\dfrac{10}{71}$보다 크고 $3\dfrac17$보다 작은 것을 보였다. 이 값을 계산하면 원주율은 $3.1408$과 $3.1429$ 사이에 있음을 알 수 있다. 원에 내접하는 정$n$각형의 둘레와 외접하는 정$n$각형의 둘레에서 $n$의 값이 한없이 커질 때 극한을 구하면 원주율을 구할 수 있다.

stem: |
  제시문을 읽고 다음 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    제시문 <라>의 원에 내접하는 $n$각형의 넓이는 $\dfrac12\displaystyle\sum_{i=1}^{n}\sin(2\theta_i)$임을 보이고 그 넓이의 최댓값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'n/2*sin(2*pi/n)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 각 삼각형 넓이 $\frac12\sin2\theta_i$, $\sin$이 $(0,\pi)$에서 위로 볼록이고 $\sum2\theta_i=(n-2)\pi$이므로 최댓값 $\frac n2\sin\frac{2\pi}{n}$(정$n$각형).
    steps:
    - {id: 1a, content: '$\frac12\sum\sin2\theta_i\le\frac n2\sin\frac{(n-2)\pi}{n}=\frac n2\sin\frac{2\pi}{n}$', criteria: ['1.M1', '1.R1', '1.A1']}
    hint_ladder:
    - $\triangle\mathrm{OA}_i\mathrm{A}_{i+1}$은 이등변삼각형이다. 밑변과 높이를 $\theta_i$로 나타내 보자.
    - $\sum2\theta_i$는 무엇의 합인가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-46.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각형 $\mathrm{OA}_i\mathrm{A}_{i+1}$의 넓이는 $\dfrac12xh$이고 $x=2\cos\theta_i$, $h=\sin\theta_i$이므로 $\dfrac12xh=\dfrac12\cdot2\sin\theta_i\cos\theta_i=\dfrac12\sin(2\theta_i)$
        ($\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$이므로 $2\sin\theta_i\cos\theta_i=\sin(\theta_i+\theta_i)=\sin(2\theta_i)$이다.)
        따라서 원에 내접하는 $n$각형의 넓이는 $\dfrac12\displaystyle\sum_{i=1}^{n}\sin(2\theta_i)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        한편 $f(x)=\sin x$라 하면 $f''(x)=-\sin x$이므로 구간 $(0,\pi)$에서 $f''(x)<0$이다. 따라서 구간 $(0,\pi)$에서 함수 $f(x)=\sin x$의 그래프는 위로 볼록이고 제시문 <마>에 의해 부등식 $\dfrac1n\displaystyle\sum_{i=1}^{n}\sin(2\theta_i)\le\sin\left(\frac1n\sum_{i=1}^{n}2\theta_i\right)$이 성립한다.
        즉, $\dfrac12\displaystyle\sum_{i=1}^{n}\sin(2\theta_i)=\frac n2\left(\frac1n\sum_{i=1}^{n}\sin(2\theta_i)\right)\le\frac n2\sin\left(\frac1n\sum_{i=1}^{n}2\theta_i\right)$
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        여기서 $\displaystyle\sum_{i=1}^{n}2\theta_i$는 $n$각형의 내각의 합이므로 $\displaystyle\sum_{i=1}^{n}2\theta_i=(n-2)\pi$이고, 등호는 $\theta_1=\theta_2=\cdots=\theta_n$일 때 성립하므로
        $\dfrac12\displaystyle\sum_{i=1}^{n}\sin(2\theta_i)\le\frac n2\sin\frac{(n-2)\pi}{n}=\frac n2\sin\left(\pi-\frac{2\pi}{n}\right)=\frac n2\sin\left(\frac{2\pi}{n}\right)$
        즉, 원에 내접하는 $n$각형의 넓이가 최대인 경우는 정$n$각형이고 그 넓이는 $\dfrac n2\sin\dfrac{2\pi}{n}$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    source_flow: 문항카드 card-46.png 별해
    method_no: 2
    key_idea: 원 해설 별해 — $\angle\mathrm{A}_i\mathrm{OA}_{i+1}=\pi-2\theta_i$이므로 삼각형 넓이는 $\frac12\sin(\pi-2\theta_i)=\frac12\sin(2\theta_i)$.
    steps:
    - id: 1c-1
      content: |
        $\theta_i=\angle\mathrm{OA}_i\mathrm{A}_{i+1}$이므로 $\angle\mathrm{A}_i\mathrm{OA}_{i+1}=\pi-2\theta_i$이다. 따라서 삼각형 $\mathrm{OA}_i\mathrm{A}_{i+1}$의 넓이는 $\dfrac12\sin(\pi-2\theta_i)=\dfrac12\sin(2\theta_i)$이고 $n$각형의 넓이는 $\dfrac12\displaystyle\sum_{i=1}^{n}\sin(2\theta_i)$이다.
      criteria: ['1.M1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 17
      evidence: |
        (기준 ①) 삼각형 $\mathrm{OA}_i\mathrm{A}_{i+1}$의 넓이는 $\sin\theta_i\cos\theta_i=\dfrac12\sin(2\theta_i)$이고 $n$각형의 넓이는 $\dfrac12\displaystyle\sum_{i=1}^{n}\sin(2\theta_i)$임을 보였다(별해: $\angle\mathrm{A}_i\mathrm{OA}_{i+1}=\pi-2\theta_i$ 이용).
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.R1
      mark_type: R
      points: 17
      evidence: |
        (기준 ②) 구간 $(0,\pi)$에서 $(\sin x)''=-\sin x<0$이므로 $y=\sin x$의 그래프가 위로 볼록이고(또는 그래프 그림으로 설명) 제시문 <마>에 의해 $\dfrac1n\displaystyle\sum\sin(2\theta_i)\le\sin\left(\frac1n\sum2\theta_i\right)$이 성립함을 보였다.
      depends_on: []
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 16
      evidence: |
        (기준 ③) $\theta_1=\cdots=\theta_n$일 때 등호가 성립하고 $\sum2\theta_i=(n-2)\pi$이므로 $n$각형의 넓이의 최댓값이 $\dfrac n2\sin\dfrac{2\pi}{n}$임을 보였다.
      depends_on: [1.R1, 1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    다음 <보기>와 수열의 극한을 이용하여 반지름의 길이가 $1$인 원의 넓이는 $\pi$임을 보이시오.
    <보기> 원의 넓이는 그 원에 외접하는 $n$각형의 넓이보다 작고 내접하는 $n$각형의 넓이보다 크다.
  points: 50
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\frac n2\sin\frac{2\pi}{n}<A<n\tan\frac\pi n$이고 두 끝이 모두 $\pi$로 수렴하므로 $A=\pi$.
    steps:
    - {id: 2a, content: '$\lim\frac n2\sin\frac{2\pi}{n}=\pi=\lim n\tan\frac\pi n$이므로 $A=\pi$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 외접 정$n$각형을 중심과 꼭짓점으로 $n$개의 삼각형으로 나누면 높이는 얼마인가?
    - $\lim_{x\to0}\frac{\sin x}{x}=1$을 쓸 수 있게 식을 바꿔 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-46.png~card-47.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문제 3-1에서 원에 내접하는 정$n$각형의 넓이는 $\dfrac n2\sin\dfrac{2\pi}{n}$이다. $\cdots\cdots\ ①$
        원에 외접하는 정$n$각형의 넓이를 구하자. 원 $\mathrm{O}$에 외접하는 정$n$각형의 꼭짓점을 각각 $\mathrm{B}_1,\mathrm{B}_2,\cdots,\mathrm{B}_n$이라 하면 $\angle\mathrm{B}_i\mathrm{OB}_{i+1}=\dfrac{2\pi}{n}$이다. 따라서 $\overline{\mathrm{B}_i\mathrm{B}_{i+1}}=2\tan\dfrac{2\pi}{2n}$이고 원의 중심 $\mathrm{O}$에서 현 $\mathrm{B}_i\mathrm{B}_{i+1}$에 내린 수선의 길이는 반지름의 길이와 같으므로 삼각형 $\mathrm{B}_i\mathrm{OB}_{i+1}$의 넓이 $S_i$는 $S_i=\tan\dfrac\pi n$이다.
        (별해. $\angle\mathrm{OB}_i\mathrm{B}_{i+1}=\dfrac\pi2-\dfrac\pi n$이므로 삼각형 $\mathrm{B}_i\mathrm{OB}_{i+1}$의 넓이는 $\cot\left(\dfrac\pi2-\dfrac\pi n\right)=\tan\dfrac\pi n$이다.)
        따라서 원에 외접하는 정$n$각형의 넓이는 $n\tan\dfrac\pi n$이다. $\cdots\cdots\ ②$
        [그림: 중심 $\mathrm{O}$와 외접 정$n$각형의 한 변 $\mathrm{B}_i\mathrm{B}_{i+1}$, 중심각 $\frac{2\pi}{n}$]
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        ①, ②에서 원의 넓이를 $A$라 하면 $\dfrac n2\sin\dfrac{2\pi}{n}<A<n\tan\dfrac\pi n$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        위 식에 $n\to\infty$인 극한을 구하면
        $\displaystyle\lim_{n\to\infty}\frac n2\sin\frac{2\pi}{n}=\lim_{n\to\infty}\frac n2\cdot\frac{2\pi}{n}\cdot\frac{\sin\left(\frac{2\pi}{n}\right)}{\frac{2\pi}{n}}=\pi\lim_{n\to\infty}\frac{\sin\left(\frac{2\pi}{n}\right)}{\frac{2\pi}{n}}=\pi$
        $\displaystyle\lim_{n\to\infty}n\tan\frac\pi n=\lim_{n\to\infty}n\frac{\sin\frac\pi n}{\cos\frac\pi n}=\lim_{n\to\infty}n\sin\frac\pi n\lim_{n\to\infty}\sec\frac\pi n$이다.
        여기서 $\displaystyle\lim_{n\to\infty}n\sin\frac\pi n=\lim_{n\to\infty}n\frac\pi n\frac{\sin\frac\pi n}{\frac\pi n}=\pi$, $\displaystyle\lim_{n\to\infty}\sec\frac\pi n=1$이므로 $\displaystyle\lim_{n\to\infty}n\tan\frac\pi n=\pi$이다.
        따라서 $\displaystyle\lim_{n\to\infty}\frac n2\sin\frac{2\pi}{n}=\pi\le A\le\pi=\lim_{n\to\infty}n\tan\frac\pi n$이므로 $A=\pi$
        즉, 반지름의 길이가 $1$인 원의 넓이는 $\pi$이다.
      criteria: ['2.A1']
