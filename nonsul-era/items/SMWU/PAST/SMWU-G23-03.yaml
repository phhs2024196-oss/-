intent: |
  삼각함수의 덧셈정리를 이용하여 원에 내접하는 $n$각형의 넓이가 $\frac12\sum_{i=1}^{n}\sin(2\theta_i)$임을 유도하고 사인함수의 그래프가 구간 $(0,\pi)$에서 위로 볼록임을 확인하여 제시문 <마>의 부등식을 활용할 수 있는지(3-1), 제시문 <바>의 과정을 이해하여 원에 내접·외접하는 다각형의 넓이를 원의 넓이와 비교하고 삼각함수의 극한을 이용하여 원의 넓이를 구할 수 있는지(3-2)를 평가한다.
key_idea: |
  $\triangle\mathrm{OA}_i\mathrm{A}_{i+1}$의 넓이 $\frac12\sin2\theta_i$, $\sum2\theta_i=(n-2)\pi$와 $\sin$의 위로 볼록성(옌센형 부등식)으로 최댓값 $\frac n2\sin\frac{2\pi}{n}$; 외접 정$n$각형 넓이 $n\tan\frac\pi n$과 함께 조임으로 $A=\pi$.
stuck: |
  $\sum_{i=1}^{n}2\theta_i$가 $n$각형의 내각의 합 $(n-2)\pi$임을 알아차리는 단계, 외접 정$n$각형의 넓이를 구하는 단계
