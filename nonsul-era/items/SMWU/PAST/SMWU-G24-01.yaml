    method_no: 1
    key_idea: 롤의 정리로 $f^{\prime}(c)=0$, $f^{\prime}$ 감소이므로 $c$ 왼쪽에서 증가·오른쪽에서 감소, 끝값이 0이므로 내부에서 양수.
    steps:
    - {id: 1a, content: '$f^{\prime}(c)=0$, $(a,c)$ 증가·$(c,b)$ 감소, $f(a)=f(b)=0\Rightarrow f\ge0$', criteria: ['1.M1', '1.M2', '1.R1']}
    hint_ladder:
    - $f(a)=f(b)$이면 어떤 정리를 쓸 수 있는가?
    - $f^{\prime}$이 감소하면 $f^{\prime}(c)=0$인 $c$의 좌우에서 $f^{\prime}$의 부호는?
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-09.png 예시 답안 1-1
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$가 열린구간 $(a,b)$에서 $f^{\prime\prime}(x)<0$이므로 함수 $f(x)$는 열린구간 $(a,b)$에서 미분 가능하다. 또한 $f(a)=f(b)=0$이므로 <롤의 정리>에 의하여 $f^{\prime}(c)=0$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        그런데 함수 $f(x)$가 열린구간 $(a,b)$에서 $f^{\prime\prime}(x)<0$이므로 이 구간에서 $f^{\prime}(x)$는 감소한다. 따라서 $f^{\prime}(c)=0$을 만족시키는 $c$가 열린구간 $(a,b)$에서 오직 하나만 존재한다. 한편 열린구간 $(a,b)$에서 $f^{\prime}(x)$는 감소하고 $f^{\prime}(c)=0$이므로 함수 $f(x)$의 증감은 다음과 같다.
        (i) 열린구간 $(a,c)$에서 $f^{\prime}(x)>0$이므로 함수 $f(x)$는 이 구간에서 증가한다.
        (ii) 열린구간 $(c,b)$에서 $f^{\prime}(x)<0$이므로 함수 $f(x)$는 이 구간에서 감소한다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        또한 $f(a)=0$이므로 (i)에 의하여 열린구간 $(a,c)$에서 $f(x)>0$이고, $f(b)=0$이므로 (ii)에 의하여 열린구간 $(c,b)$에서 $f(x)>0$이다. 따라서 함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이므로 이 구간에서 $f(x)\ge0$이다. ■
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 원문 채점 기준(1-1, 1-2 공통 6가지): ① 제시문 <가>와 <나>의 핵심 내용 파악 ② 제시문 과정 적용·설명
    # ③ <1-1> 롤의 정리를 적절히 이용 ④ <1-1> f', f''의 관계를 적절히 이용 ⑤ <1-2> 필요한 함수를 적절히 도출 ⑥ <1-2> 주어진 부등식을 보임
    # 1~9등급제, 배점 칸 공란. ①은 1-1, ②는 1-2 에 편의상 배정.
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ③) $f(a)=f(b)=0$에 롤의 정리를 적용해 $f^{\prime}(c)=0$인 $c\in(a,b)$의 존재를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 20
      evidence: |
        (기준 ④) $f^{\prime\prime}<0$이므로 $f^{\prime}$이 감소하여 $(a,c)$에서 $f^{\prime}>0$, $(c,b)$에서 $f^{\prime}<0$임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 15
      evidence: |
        (기준 ①) 증감과 $f(a)=f(b)=0$으로 $(a,c)$, $(c,b)$에서 $f(x)>0$, 따라서 $[a,b]$에서 $f(x)\ge0$을 결론지었다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
