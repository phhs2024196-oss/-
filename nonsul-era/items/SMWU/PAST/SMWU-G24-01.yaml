- id: '2'
  # 원문 번호 1-2
  stem: |
    실수 전체의 집합에서 미분가능한 함수 $f(x)$는 열린구간 $(a,b)$에서 $f^{\prime\prime}(x)<0$을 만족시킨다. 이때,
    $$(b-a)\{f(a)+f(b)\}\le2\int_a^bf(x)\,dx$$
    임을 보이시오.
  points: 50
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 두 끝점을 잇는 일차함수 $h$와의 차 $F=f-h$에 명제 ①을 적용하면 $\int_a^bh\le\int_a^bf$, $\int_a^bh=\tfrac12(b-a)\{f(a)+f(b)\}$.
    steps:
    - {id: 2a, content: '$F=f-h\ge0\Rightarrow\int_a^bf\ge\int_a^bh=\tfrac12(b-a)\{f(a)+f(b)\}$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 제시문 <나>에서 $g-h$를 만든 것처럼, 양 끝에서 0이 되는 함수를 만들어 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-09.png 예시 답안 1-2
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        실수 전체의 집합에서 미분가능한 함수 $f(x)$에 대하여, 닫힌구간 $[a,b]$에서 두 점 $(a,f(a))$와 $(b,f(b))$를 지나는 일차함수 $h(x)=\dfrac{f(b)-f(a)}{b-a}(x-a)+f(a)$의 그래프를 생각하자.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이때, 함수 $F(x)=f(x)-h(x)$는 $F(a)=0$, $F(b)=0$을 만족시킨다. 열린구간 $(a,b)$에서 $F^{\prime\prime}(x)=f^{\prime\prime}(x)-h^{\prime\prime}(x)=f^{\prime\prime}(x)<0$이므로 명제 ①에 의하여 닫힌구간 $[a,b]$에서 $F(x)\ge0$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        따라서 닫힌구간 $[a,b]$에서 $\displaystyle\int_a^bF(x)dx=\int_a^b\{f(x)-h(x)\}dx=\int_a^bf(x)dx-\int_a^bh(x)dx\ge0$이므로 $\displaystyle\int_a^bh(x)dx\le\int_a^bf(x)dx$이다.
      criteria: ['2.M2']
    - id: 2b-4
      content: |
        한편
        $$\begin{aligned}\int_a^bh(x)dx&=\int_a^b\left\{\frac{f(b)-f(a)}{b-a}(x-a)+f(a)\right\}dx\\&=\left[\frac12\frac{f(b)-f(a)}{b-a}x^2-a\frac{f(b)-f(a)}{b-a}x+f(a)x\right]_a^b\\&=\frac12(b-a)\{f(a)+f(b)\}\end{aligned}$$
        이고, $(b-a)\{f(a)+f(b)\}\le2\displaystyle\int_a^bf(x)\,dx$이다. ■
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ⑤) 두 점 $(a,f(a))$, $(b,f(b))$를 지나는 일차함수 $h(x)$와 $F(x)=f(x)-h(x)$를 도입했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ②) $F(a)=F(b)=0$, $F^{\prime\prime}=f^{\prime\prime}<0$을 확인하고 명제 ①로 $F\ge0$, $\int_a^bh\le\int_a^bf$를 얻었다.
      depends_on: [2.M1]
      steps: [2b-2, 2b-3]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ⑥) $\int_a^bh(x)dx=\dfrac12(b-a)\{f(a)+f(b)\}$를 계산해 주어진 부등식을 결론지었다.
      depends_on: [2.M2]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

