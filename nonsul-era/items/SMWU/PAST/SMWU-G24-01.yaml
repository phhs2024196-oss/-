stimuli:
- label: 가
  body: |
    ● 함수 $f(x)$가 열린구간 $(a,b)$에서 $f^{\prime\prime}(x)<0$이면 그 구간에서 $f^{\prime}(x)$는 감소한다. 이때,
    1) 열린구간 $(a,b)$에 속하는 어떤 실수 $c_1$에 대하여 $f^{\prime}(c_1)>0$이면, 열린구간 $(a,c_1)$에서 $f^{\prime}(x)>0$이므로 함수 $f(x)$는 열린구간 $(a,c_1)$에서 증가한다.
    2) 열린구간 $(a,b)$에 속하는 어떤 실수 $c_2$에 대하여 $f^{\prime}(c_2)<0$이면, 열린구간 $(c_2,b)$에서 $f^{\prime}(x)<0$이므로 함수 $f(x)$는 열린구간 $(c_2,b)$에서 감소한다.

    ● <롤의 정리>
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능할 때, $f(a)=f(b)$이면 $f^{\prime}(c)=0$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: 나
  body: |
    ① 함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고, $f(a)=0$, $f(b)=0$을 만족시킬 때, 열린구간 $(a,b)$에서 $f^{\prime\prime}(x)<0$이면, 닫힌구간 $[a,b]$에서 $f(x)\ge0$이다.

    ● 함수 $g(x)=\sqrt{x}$, $h(x)=x$에 대하여, 부등식
    $$\int_0^1h(x)\,dx\le\int_0^1g(x)\,dx\quad\cdots\cdots\quad(1)$$
    가 성립함을 보이자. 함수 $F(x)=g(x)-h(x)$는 $F(0)=0$, $F(1)=0$이고, 열린구간 $(0,1)$에서 $F^{\prime\prime}(x)=-\dfrac{1}{4x\sqrt{x}}<0$이다. 그러면 명제 ①에 의하여 닫힌구간 $[0,1]$에서 $F(x)\ge0$이므로 이 구간에서 $h(x)\le g(x)$이고 부등식 (1)이 성립한다.

