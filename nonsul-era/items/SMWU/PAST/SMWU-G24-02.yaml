stimuli:
- label: 다
  body: |
    함수 $y=f(x)$의 정의역에 속하는 모든 $x$에 대하여
    $$f(x+p)=f(x)$$
    를 만족시키는 $0$이 아닌 상수 $p$가 존재할 때, 함수 $y=f(x)$를 주기함수라 하고 상수 $p$ 중에서 최소인 양수를 그 함수의 주기라고 한다.
    두 주기함수의 곱의 정적분을 생각해보자. 예를 들어, 연속함수 $G(x)$가 모든 실수 $x$에 대하여 $G(x+\pi)=G(x)$를 만족시킬 때, 임의의 자연수 $n$에 대하여
    $$a=\int_0^{2\pi}G(x)\sin x\,dx,\quad b=\int_{2n\pi}^{2(n+1)\pi}G(x)\sin x\,dx$$
    라 하면, $a=b=0$임을 다음과 같이 보일 수 있다.
    $x-2n\pi=t$로 놓으면, $\dfrac{dx}{dt}=1$이고
    $$b=\int_0^{2\pi}G(t+2n\pi)\sin(t+2n\pi)\,dt=\int_0^{2\pi}G(t)\sin t\,dt=a$$
    이다. 이제 정적분의 성질을 이용하여 적분 구간을 나누면
    $$a=\int_0^{2\pi}G(x)\sin x\,dx=\int_0^{\pi}G(x)\sin x\,dx+\int_{\pi}^{2\pi}G(x)\sin x\,dx\quad\cdots\cdots\quad(1)$$
    이다. 이때, $\displaystyle\int_{\pi}^{2\pi}G(x)\sin x\,dx$의 값을 구하기 위해, $x-\pi=u$로 놓으면 $\dfrac{dx}{du}=1$이고
    $$\int_{\pi}^{2\pi}G(x)\sin x\,dx=\int_0^{\pi}G(u+\pi)\sin(u+\pi)\,du=-\int_0^{\pi}G(u)\sin u\,du$$
    이다. 따라서 (1)에 의하여 $a=0$이다.
- label: 라
  body: |
    $\displaystyle\int_{-1}^1\frac{1}{e^x+1}dx$의 값을 생각해보자.
    $$\int_{-1}^1\frac{1}{e^x+1}dx=\int_{-1}^1\frac{e^{-x}}{1+e^{-x}}dx=-\left[\ln(1+e^{-x})\right]_{-1}^1=-\ln\frac{1+e^{-1}}{1+e}=1$$
    이다. 한편,
    $$\int_{-1}^1\frac{1}{e^x+1}dx=\int_{-1}^1\frac{e^x}{e^x+1}dx$$
    이다.

stem: |
  제시문 <다>와 <라>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'
  # 원문 번호 2-1
  stem: |
    연속함수 $g(x)$는 모든 실수 $x$에 대하여 $g(x+1)=g(x)$를 만족시키고, 연속함수 $h(x)$는 모든 실수 $x$에 대하여 $h(x+2)=h(x)$를 만족시키고
    $$h(x)=\begin{cases}x & (0\le x<1)\\ 2-x & (1\le x<2)\end{cases}$$
    이다. 정적분 $\displaystyle\int_0^2g(x)h(x)\,dx$의 값을 $A$라 할 때, 임의의 자연수 $n$에 대하여 정적분
    $$\int_{2n}^{2(n+1)}g(x)h(x)\,dx,\quad\int_0^1g(x)\,dx$$
    의 값을 각각 구하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'I1 = A; I2 = A', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 평행이동 치환으로 첫 적분은 $A$, 그리고 $A=\int_0^1xg+\int_0^1(1-x)g=\int_0^1g$.
    steps:
    - {id: 1a, content: '$\int_{2n}^{2n+2}gh=A$, $A=\int_0^1 g$', criteria: ['1.M1', '1.A1', '1.M2', '1.A2']}
    hint_ladder:
    - 제시문 <다>처럼 $x-2n=t$로 놓아 보자.
    - $\int_1^2(2-x)g(x)dx$를 $[0,1]$ 위의 적분으로 바꾸어 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-09.png~card-10.png 예시 답안 2-1
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        정적분 $\displaystyle\int_{2n}^{2(n+1)}g(x)h(x)dx$에서 $x-2n=t$로 놓으면, $\dfrac{dx}{dt}=1$이고
        $$\int_{2n}^{2(n+1)}g(x)h(x)dx=\int_0^2g(t+2n)h(t+2n)dt=\int_0^2g(t)h(t)dt=A$$
        이다.
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        이제 정적분의 성질을 이용하여 적분 구간을 나누면
        $$A=\int_0^2g(x)h(x)dx=\int_0^1xg(x)dx+\int_1^2(2-x)g(x)dx\quad\cdots\cdots\quad(1)$$
        이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        이때 $\displaystyle\int_1^2(2-x)g(x)dx$의 값을 구하기 위해, $x-1=t$로 놓으면, $\dfrac{dx}{dt}=1$이고
        $$\int_1^2(2-x)g(x)dx=\int_0^1(1-t)g(t+1)dt=\int_0^1(1-t)g(t)dt$$
        이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        따라서 (1)에 의하여 $\displaystyle A=\int_0^2g(x)h(x)dx=\int_0^1xg(x)dx+\int_0^1(1-x)g(x)dx=\int_0^1g(x)dx$이다.
      criteria: ['1.A2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 원문 채점 기준(2-1, 2-2 공통 6가지): ① 제시문 <다>와 <라>의 핵심 파악 ② 제시문 과정 적용·설명
    # ③ <2-1> ∫_{2n}^{2(n+1)} g h dx 값 도출 ④ <2-1> ∫_0^1 g dx 값 도출 ⑤ <2-2> 주어진 함수 조건 활용 ⑥ <2-2> 정적분 값.
    # 1~9등급제, 배점 칸 공란. ①은 2-1, ②는 2-2 에 편의상 배정.
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        (기준 ①) 제시문 <다>처럼 $x-2n=t$로 치환하고 주기성 $g(t+2n)=g(t)$, $h(t+2n)=h(t)$를 썼다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        (기준 ③) $\displaystyle\int_{2n}^{2(n+1)}g(x)h(x)dx=A$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 10
      evidence: |
        구간을 $[0,1]$, $[1,2]$로 나누고 $x-1=t$ 치환으로 $\int_1^2(2-x)g(x)dx=\int_0^1(1-t)g(t)dt$를 얻었다.
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1b-3]
    - id: 1.A2
      mark_type: A
      points: 15
      evidence: |
        (기준 ④) $\displaystyle\int_0^1g(x)dx=A$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  # 원문 번호 2-2
  stem: |
    연속함수 $f(x)$가 모든 실수 $x$에 대하여 $f(x)>0$이고 $f(x)f(-x)=1$을 만족시킬 때, 정적분
    $$\int_{-1}^1\frac{1}{\{f(x)\}^4+1}dx$$
    의 값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=1/f(-x)$와 $x\to-x$ 치환으로 $I=\int_{-1}^1\dfrac{f^4}{f^4+1}dx$, 더하면 $2I=2$.
    steps:
    - {id: 2a, content: '$I+I=\int_{-1}^1 1\,dx=2\Rightarrow I=1$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 제시문 <라>의 마지막 등식은 왜 성립하는가?
    - $f(x)=\dfrac{1}{f(-x)}$를 대입하고 $-x=t$로 놓아 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-10.png 예시 답안 2-2
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        정적분 $\displaystyle\int_{-1}^1\frac{1}{\{f(x)\}^4+1}dx$에서 $f(x)=\dfrac{1}{f(-x)}$이므로
        $$\int_{-1}^1\frac{1}{\{f(x)\}^4+1}dx=\int_{-1}^1\frac{1}{\left\{\frac{1}{f(-x)}\right\}^4+1}dx=\int_{-1}^1\frac{\{f(-x)\}^4}{\{f(-x)\}^4+1}dx$$
        이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $-x=t$로 놓으면, $\dfrac{dx}{dt}=-1$이고
        $$\int_{-1}^1\frac{\{f(-x)\}^4}{\{f(-x)\}^4+1}dx=-\int_1^{-1}\frac{\{f(t)\}^4}{\{f(t)\}^4+1}dt=\int_{-1}^1\frac{\{f(t)\}^4}{\{f(t)\}^4+1}dt$$
        이다. 따라서
        $$\int_{-1}^1\frac{1}{\{f(x)\}^4+1}dx=\int_{-1}^1\frac{\{f(x)\}^4}{\{f(x)\}^4+1}dx\quad\cdots\cdots\quad(2)$$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        이고, $\displaystyle\int_{-1}^1\left[\frac{1}{\{f(x)\}^4+1}+\frac{\{f(x)\}^4}{\{f(x)\}^4+1}\right]dx=\int_{-1}^1\frac{\{f(x)\}^4+1}{\{f(x)\}^4+1}dx=2$이다. (2)에 의하여 $\displaystyle\int_{-1}^1\frac{1}{\{f(x)\}^4+1}dx=1$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ⑤) $f(x)=\dfrac{1}{f(-x)}$를 대입해 피적분함수를 $\dfrac{\{f(-x)\}^4}{\{f(-x)\}^4+1}$로 바꾸었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ②) 제시문 <라>처럼 $-x=t$ 치환으로 두 적분이 같음(식 (2))을 보였다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ⑥) 두 적분의 합이 $2$임을 이용해 값 $1$을 얻었다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
