stimuli:
- label: 마
  body: |
    ● <이차방정식의 근과 계수의 관계>
    이차방정식 $ax^2+bx+c=0$의 두 근을 $\alpha$, $\beta$라 하면
    $$\alpha+\beta=-\frac{b}{a},\quad\alpha\beta=\frac{c}{a}$$
    이다.
- label: 바
  body: |
    ② 이차방정식 $F(x)=0$의 두 근이 유리수이면 방정식 $F^{\prime}(x)=0$의 근은 유리수이다.

    $a$, $b$는 실수이고 $a\le\dfrac14$일 때, 삼차함수 $f(x)=(x^2+x+a)(x-b)$를 생각해보자. 이때,
    $$x^2+x+a=\left(x+\frac12\right)^2-\frac14+a=\left(x+\frac12\right)^2-\frac{1-4a}{4}$$
    이다. 따라서 두 방정식 $f(x)=0$, $f^{\prime}(x)=0$은 각각
    $$\left\{\left(x+\frac12\right)^2-\frac{1-4a}{4}\right\}\left\{\left(x+\frac12\right)-\left(b+\frac12\right)\right\}=0,\quad\cdots\cdots\quad(1)$$
    $$3\left(x+\frac12\right)^2-2\left(b+\frac12\right)\left(x+\frac12\right)-\frac{1-4a}{4}=0\quad\cdots\cdots\quad(2)$$
    이 된다. 이제
    $$x+\frac12=t,\ b+\frac12=u,\ \frac{1-4a}{4}=v^2\quad\cdots\cdots\quad(3)$$
    으로 놓으면, $x$에 대한 삼차방정식 (1)은 $t$에 대한 삼차방정식
    $$(t^2-v^2)(t-u)=0\quad\cdots\cdots\quad(4)$$
    이 된다. 이때, 방정식 (4)의 근 $u$와 $\pm v$가 유리수이면 (3)에 의해 $b$는 유리수가 되고 $1-4a=4v^2$이므로 $x$에 대한 삼차방정식 $f(x)=0$의 세 근 $\dfrac{-1\pm2v}{2}$, $b$는 유리수이다. 이때, 방정식 (4)의 좌변을 $t$에 대하여 미분한 후, 방정식
    $$3t^2-2ut-v^2=0\quad\cdots\cdots\quad(5)$$
    을 생각하면, 방정식 (5)는 (3)에 의해 방정식 (2)와 같다. $t$에 대한 이차방정식 (5)의 근은
    $$\frac{u\pm\sqrt{u^2+3v^2}}{3}\quad\cdots\cdots\quad(6)$$
    이다.

stem: |
  제시문 <마>와 <바>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'
  # 원문 번호 3-1
  stem: |
    $b$가 자연수일 때, 삼차함수 $g(x)=x(x-1)(x-b)$에 대하여 방정식 $g^{\prime}(x)=0$의 두 근이 동시에 정수가 될 수 없음을 제시문 <마>를 이용하여 보이시오.
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 근과 계수의 관계에서 두 근이 정수이면 $3\mid 2(b+1)$이고 $3\mid b$이므로 모순.
    steps:
    - {id: 1a, content: '$\alpha+\beta=\tfrac23(b+1)$, $\alpha\beta=\tfrac b3$ → $3\mid b+1$, $3\mid b$ 모순', criteria: ['1.M1', '1.R1']}
    hint_ladder:
    - $g^{\prime}(x)=3x^2-2(b+1)x+b$의 두 근의 합과 곱은?
    - 두 근이 정수라면 합과 곱도 정수이다.
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-10.png 예시 답안 3-1
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $b$가 자연수일 때, 삼차함수 $g(x)=x(x-1)(x-b)=x^3-(b+1)x^2+bx$에 대하여 $g^{\prime}(x)=3x^2-2(b+1)x+b$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이차방정식 $g^{\prime}(x)=0$의 두 근을 $\alpha$, $\beta$라 하면 <이차방정식의 근과 계수의 관계>에 의해
        $$\alpha+\beta=\frac23(b+1),\quad\alpha\beta=\frac b3\quad\cdots\cdots\quad(1)$$
        이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\alpha$, $\beta$가 모두 정수라 가정하면, $b$가 자연수이므로 (1)에 의해 $\alpha+\beta$, $\alpha\beta$는 자연수이며,
        $$2(b+1)=3(\alpha+\beta)\quad\cdots\cdots\quad(2),\qquad b=3\alpha\beta\quad\cdots\cdots\quad(3)$$
        이다. $3$은 $2$와 서로소이므로 (2)에 의해 $b+1$은 $3$의 배수이고, (3)에 의해 $b$는 $3$의 배수이다. 이는 모순이므로 방정식 $g^{\prime}(x)=0$의 두 근이 동시에 정수가 될 수 없다. ■
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 원문 채점 기준(3-1, 3-2 공통 6가지): ① 제시문 <마>와 <바>의 핵심 파악 ② 제시문 과정 적용·설명
    # ③ <3-1> 삼차함수의 도함수를 구한 다음 근과 계수의 관계 활용 ④ <3-1> 주어진 문제 해결
    # ⑤ <3-2> 명제 ② 증명 ⑥ <3-2> 조건을 만족시키는 삼차함수 도출. 1~9등급제, 배점 칸 공란. ①은 3-1, ②는 3-2 에 편의상 배정.
    criteria:
    - id: 1.M1
      mark_type: M
      points: 10
      evidence: |
        (기준 ③ 앞부분) $g^{\prime}(x)=3x^2-2(b+1)x+b$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ①·③) 제시문 <마>로 $\alpha+\beta=\dfrac23(b+1)$, $\alpha\beta=\dfrac b3$을 적었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 25
      evidence: |
        (기준 ④) 두 근이 정수라 가정하면 $b+1$과 $b$가 모두 $3$의 배수가 되어 모순임을 밝혔다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  # 원문 번호 3-2
  stem: |
    제시문 <바>에 있는 명제 ②가 참임을 증명하시오. 또한 $t$에 대한 삼차방정식 (4)에서 $u=1$일 때, 제시문 <바>에 있는 삼차함수 $f(x)$에 대하여 세 방정식
    $$f(x)=0,\quad f^{\prime}(x)=0,\quad f^{\prime\prime}(x)=0$$
    의 모든 근이 유리수가 되게 하는 $4$ 이하의 자연수 $v$를 식 (6)을 이용하여 모두 찾고, 이에 대응하는 삼차함수
    $$f(x)=(x^2+x+a)(x-b)$$
    를 각각 구하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'v=1: (x**2+x-3/4)*(x-1/2); v=4: (x**2+x-63/4)*(x-1/2)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $F=a(x-r)(x-s)$이면 $F^{\prime}=0$의 근 $\tfrac{r+s}{2}$; $u=1$이면 $1+3v^2$이 제곱수인 $v=1$($4$), $v=4$($49$).
    steps:
    - {id: 2a, content: '$b=\tfrac12$, $a=\tfrac14-v^2$: $v=1\Rightarrow a=-\tfrac34$, $v=4\Rightarrow a=-\tfrac{63}{4}$', criteria: ['2.R1', '2.M1', '2.A1']}
    hint_ladder:
    - 이차함수 $F$를 두 근으로 인수분해해 미분해 보자.
    - $u=1$이면 식 (6)의 근호 안은 $1+3v^2$이다.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-11.png 예시 답안 3-2
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        이차함수 $F(x)=a(x-r)(x-s)$에 대해 $F^{\prime}(x)=a(2x-r-s)$이다. 이차방정식 $F(x)=0$의 두 근 $r$, $s$가 유리수이면, 방정식 $F^{\prime}(x)=0$의 근 $\dfrac{r+s}{2}$는 유리수이다.
      criteria: ['2.R1']
    - id: 2b-2
      content: |
        $u=1$일 때, 제시문 <바>에 있는 식 (6)은 $\dfrac{1\pm\sqrt{1+3v^2}}{3}$이다.
        (i) $v=1$이면 $\dfrac{1\pm\sqrt{1+3v^2}}{3}=\dfrac{1\pm2}{3}$이므로, 제시문 <바>에 있는 $t$에 대한 방정식 (5)의 두 근은 유리수가 된다. 그런데 제시문 <바>에 있는 (3)에서 $x=t-\dfrac12$이므로, 이차방정식 $f^{\prime}(x)=0$의 두 근은 유리수가 된다. 한편, 제시문 <바>에 있는 (3)에 의해 $1=b+\dfrac12$, $1=\dfrac{1-4a}{4}$이므로 $a=-\dfrac34$, $b=\dfrac12$이다. 따라서 $v=1$에 대응하는 $f(x)=0$, $f^{\prime}(x)=0$의 모든 근이 유리수가 되게 하는 삼차함수는 $f(x)=\left(x^2+x-\dfrac34\right)\left(x-\dfrac12\right)$이다. 이때, 명제 ②에 의해 방정식 $f^{\prime\prime}(x)=0$의 근도 유리수이다.
      criteria: ['2.M1', '2.A1']
    - id: 2b-3
      content: |
        (ii) $v=2$이면 $\dfrac{1\pm\sqrt{1+3v^2}}{3}=\dfrac{1\pm\sqrt{13}}{3}$이므로, 방정식 (5)의 두 근은 무리수가 된다. 그런데 (3)에서 $x=t-\dfrac12$이므로, 이차방정식 $f^{\prime}(x)=0$의 두 근은 무리수가 된다. 따라서 $v=2$에 대응하는 $f^{\prime}(x)=0$의 모든 근이 유리수가 되게 하는 삼차함수 $f(x)=(x^2+x+a)(x-b)$는 존재하지 않는다.
        (iii) $v=3$이면 $\dfrac{1\pm\sqrt{1+3v^2}}{3}=\dfrac{1\pm2\sqrt7}{3}$이므로, 방정식 (5)의 두 근은 무리수가 된다. 그런데 (3)에서 $x=t-\dfrac12$이므로, 이차방정식 $f^{\prime}(x)=0$의 두 근은 무리수가 된다. 따라서 $v=3$에 대응하는 $f^{\prime}(x)=0$의 모든 근이 유리수가 되게 하는 삼차함수 $f(x)=(x^2+x+a)(x-b)$는 존재하지 않는다.
      criteria: ['2.M1']
    - id: 2b-4
      content: |
        (iv) $v=4$이면 $\dfrac{1\pm\sqrt{1+3v^2}}{3}=\dfrac{1\pm7}{3}$이므로, 방정식 (5)의 두 근은 유리수가 된다. 그런데 (3)에서 $x=t-\dfrac12$이므로, 이차방정식 $f^{\prime}(x)=0$의 두 근은 유리수가 된다. 한편, (3)에 의해 $1=b+\dfrac12$, $16=\dfrac{1-4a}{4}$이므로 $a=-\dfrac{63}{4}$, $b=\dfrac12$이다. 따라서 $v=4$에 대응하는 $f(x)=0$, $f^{\prime}(x)=0$의 모든 근이 유리수가 되게 하는 삼차함수는 $f(x)=\left(x^2+x-\dfrac{63}{4}\right)\left(x-\dfrac12\right)$이다. 이때 명제 ②에 의해 방정식 $f^{\prime\prime}(x)=0$의 근도 유리수이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
      mark_type: R
      points: 15
      evidence: |
        (기준 ⑤) $F(x)=a(x-r)(x-s)$에서 $F^{\prime}(x)=a(2x-r-s)$, 근 $\dfrac{r+s}{2}$가 유리수임을 보였다.
      depends_on: []
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ②) $u=1$일 때 식 (6) $\dfrac{1\pm\sqrt{1+3v^2}}{3}$에 $v=1,2,3,4$를 대입해 유리 여부를 조사하고 $x=t-\dfrac12$로 $f^{\prime}(x)=0$의 근과 연결했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2, 2b-3]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ⑥) $v=1$: $f(x)=\left(x^2+x-\dfrac34\right)\left(x-\dfrac12\right)$, $v=4$: $f(x)=\left(x^2+x-\dfrac{63}{4}\right)\left(x-\dfrac12\right)$를 구하고 명제 ②로 $f^{\prime\prime}(x)=0$의 근도 유리수임을 밝혔다.
      depends_on: [2.M1, 2.R1]
      steps: [2b-2, 2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
