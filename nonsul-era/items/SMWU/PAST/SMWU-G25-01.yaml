stimuli:
- label: 가
  body: |
    이차방정식 $ax^2+bx+c=0$의 두 근을 $\alpha$, $\beta$라고 하면,
    $$\alpha+\beta=-\frac ba,\ \alpha\beta=\frac ca$$
- label: 나
  body: |
    다항식의 곱셈 공식을 이용하면 여러 가지 식의 값을 쉽게 구할 수 있다.
    $$a^2+b^2=(a+b)^2-2ab,$$
    $$a^3+b^3=(a+b)^3-3ab(a+b)$$
- label: 다
  body: |
    함수 $y=f(x)$가 닫힌구간 $[a,b]$에서 연속이면, 최대·최소 정리에 따라 함수 $f(x)$는 이 구간에서 최댓값과 최솟값을 가진다. 이때 이 구간에서 $f(x)$의 극댓값, 극솟값, $f(a)$, $f(b)$ 중에서 가장 큰 값이 최댓값, 가장 작은 값이 최솟값이 된다.

stem: |
  제시문 <가>, <나>, <다>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'   # 원문 1-1
  stem: |
    이차방정식 $x^2+(\ln k)x-(\ln k+2)=0$의 서로 다른 두 실근을 $\alpha$, $\beta$라고 할 때, 두 실근 $\alpha$, $\beta$의 차가 최소가 되는 실수 $k$의 값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: value, value: 'exp(-2)', equivalents: ['1/e**2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $(\alpha-\beta)^2=(\ln k+2)^2+4$는 $\ln k=-2$에서 최소.
    steps:
    - {id: 1a, content: '$k=e^{-2}$', criteria: ['1.M1', '1.M2', '1.A1']}
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-7.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 이차방정식의 판별식은
        $$D=(\ln k)^2+4(\ln k+2)=(\ln k+2)^2+4>0$$
        이므로 이차방정식은 항상 서로 다른 두 실근을 가진다. 또한 이차방정식의 근과 계수의 관계에서
        $$\alpha+\beta=-\ln k,\ \alpha\beta=-(\ln k+2)$$
        이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 두 근 $\alpha,\beta$의 차의 제곱은
        $$(\alpha-\beta)^2=(\alpha+\beta)^2-4\alpha\beta=(\ln k)^2+4\ln k+8=(\ln k+2)^2+4$$
        이고, $\ln k=-2$, 즉 $k=e^{-2}=\dfrac{1}{e^2}$일 때, 최소이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        따라서 두 근의 차가 최소가 되는 실수 $k$의 값은 $k=e^{-2}=\dfrac1{e^2}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ①, <1-1>·<1-2> 공통) 근과 계수의 관계를 정확히 이해한다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ②) <1-1>에서 곱셈 공식을 활용할 수 있다($(\alpha-\beta)^2=(\alpha+\beta)^2-4\alpha\beta$).
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ③) 두 실근의 차의 최솟값을 구할 수 있다($k=e^{-2}$).
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 1-2
  stem: |
    삼차함수 $f(x)=(x^2-1)(x+3k)$의 극댓값과 극솟값의 합이 최대가 되는 실수 $k$의 값과 그때 극댓값과 극솟값의 합을 구하시오. (단, $-1\le k\le1$)
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'k = -sqrt(3)/3; sum = 8*sqrt(3)/9', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=3x^2+6kx-1$의 두 근으로 $f(\alpha)+f(\beta)=4k^3-4k$, $[-1,1]$에서 최대.
    steps:
    - {id: 2a, content: '$g(k)=4k^3-4k$, $k=-\tfrac{\sqrt3}{3}$에서 최댓값 $\tfrac{8\sqrt3}{9}$', criteria: ['2.M1', '2.M2', '2.A1']}
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-7.png, card-8.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        도함수 $f'(x)=2x(x+3k)+x^2-1=3x^2+6kx-1$이다. 이차방정식 $f'(x)=0$의 판별식 $D/4=9k^2+3>0$이므로 $f'(x)=0$은 항상 서로 다른 두 실근을 가진다.
        $f'(x)=0$의 두 실근을 $\alpha$, $\beta\ (\alpha<\beta)$라고 하면 $f'(x)=0$의 근과 계수의 관계에서
        $$\alpha+\beta=-2k,\ \alpha\beta=-\frac13$$
        이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서
        $$\alpha^2+\beta^2=(\alpha+\beta)^2-2\alpha\beta=4k^2+\frac23,$$
        $$\alpha^3+\beta^3=(\alpha+\beta)^3-3\alpha\beta(\alpha+\beta)=-8k^3-2k$$
        삼차함수 $f(x)$의 삼차항의 계수가 $1$로 양수이고 $\alpha<\beta$이므로 $f(\alpha)$는 극댓값, $f(\beta)$ 극솟값이다. 따라서
        $$f(\alpha)+f(\beta)=\alpha^3+\beta^3+3k(\alpha^2+\beta^2)-(\alpha+\beta)-6k=-8k^3-2k+12k^3+2k+2k-6k=4k^3-4k$$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        여기서 $g(k)=4k^3-4k$라고 하면, $g'(k)=4(3k^2-1)$이므로 $g'(k)=0$에서 $k=\pm\dfrac{1}{\sqrt3}$이다.
        증감표: $g(-1)=0$, $k=-\dfrac1{\sqrt3}$에서 극댓값 $\dfrac{8\sqrt3}{9}$, $k=\dfrac1{\sqrt3}$에서 극솟값 $-\dfrac{8\sqrt3}{9}$, $g(1)=0$.
        따라서 $k=-\dfrac{1}{\sqrt3}=-\dfrac{\sqrt3}{3}$일 때 $f(\alpha)+f(\beta)$를 최대로 하고 최댓값은 $g\left(-\dfrac{\sqrt3}{3}\right)=\dfrac{8\sqrt3}{9}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ④) <1-2>에서 도함수의 근과 계수와의 관계를 활용할 수 있다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ⑤) <1-2>에서 곱셈 공식을 활용할 수 있다($f(\alpha)+f(\beta)=4k^3-4k$).
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ⑥) 최댓값을 구할 수 있다($k=-\dfrac{\sqrt3}{3}$, 합 $\dfrac{8\sqrt3}{9}$).
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

