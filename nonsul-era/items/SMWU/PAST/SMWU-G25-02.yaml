intent: |
  정적분의 구간 합 성질과 등비수열의 합으로 수열 $a_n$을 구하고, 점과 직선 사이의 거리로 현의 길이를 나타낸 뒤 삼각함수의 극한으로 극한값을 구하는 능력을 본다.
key_idea: |
  $\int_{a_1}^{a_n}f=\sum_{k=1}^{n-1}A_k$이고 $\int f=\tfrac{1}{e^2-1}e^{x^2}$이므로 $a_n^2=2n-1$. 현의 길이 $l_n=2\sqrt{a_n^2-d_n^2}$.
stuck: |
  넓이 $A_k$를 이어 붙여 $a_1$부터 $a_n$까지의 정적분으로 만드는 것, 그리고 $l_n^2$을 $8a_n^2\sin\tfrac1n\cos\tfrac1n$으로 정리하는 것
