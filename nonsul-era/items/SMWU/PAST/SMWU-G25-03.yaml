stimuli:
- label: 사
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면 $f(a)$와 $f(b)$ 사이에 있는 임의의 값 $k$에 대하여 $f(c)=k$인 $c$가 $a$와 $b$ 사이에 적어도 하나 존재한다. 이것을 사잇값의 정리라고 한다.
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)$와 $f(b)$의 부호가 서로 다르면 사잇값의 정리에 의하여 방정식 $f(x)=0$은 $a$와 $b$ 사이에 적어도 하나의 실근을 갖는다.
- label: 아
  body: |
    명제 $p\to q$가 참이면 그 대우 $\sim q\to\ \sim p$도 참이므로 어떤 명제가 참임을 증명할 때에는 그 대우가 참임을 증명해도 된다.

stem: |
  제시문 <사>, <아>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'   # 원문 3-1
  stem: |
    방정식 $x^{2n}+x^{2n-1}+\cdots+x^2+x-1=0$이 열린구간 $(-2,1)$에서 적어도 두 개의 실근을 가짐을 보이시오. (단, $n$은 자연수)
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(-2)=\tfrac23\cdot4^n-\tfrac53>0$, $f(0)=-1$, $f(1)=2n-1>0$에 사잇값의 정리를 두 번 쓴다.
    steps:
    - {id: 1a, content: '$(-2,0)$, $(0,1)$에 각각 실근', criteria: ['1.M1', '1.M2', '1.R1']}
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-9.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^{2n}+x^{2n-1}+\cdots+x^2+x-1$이라 하자. $f(0)=-1<0$이다. 한편,
        $$f(-2)=(-2)^{2n}+(-2)^{2n-1}+\cdots+(-2)^2+(-2)-1=\frac{(-2)^{2n+1}-(-2)}{-2-1}-1=\frac23\times4^n-\frac53$$
      criteria: ['1.M2']
    - id: 1b-2
      content: |
        이고, $n$은 자연수이므로 $f(-2)\ge\dfrac23\times4-\dfrac53=1>0$이다. 또한 $f(1)=2n-1>0$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        사잇값의 정리에 의하여 방정식 $f(x)=0$은 $-2$와 $0$ 사이에 적어도 하나의 실근을 갖고, $0$과 $1$ 사이에 적어도 하나의 실근을 갖는다. 그러므로 열린구간 $(-2,1)$에서 적어도 두 개의 실근을 갖는다.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ①) <3-1>에서 사잇값의 정리를 정확히 이해한다(구간 끝점의 부호 확인).
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ②) <3-1>에서 등비수열의 합을 구할 수 있다($f(-2)=\tfrac23\cdot4^n-\tfrac53$).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 20
      evidence: |
        (문항카드 ③) 사잇값의 정리를 활용하여 두 개의 실근을 가짐을 증명한다($(-2,0)$, $(0,1)$).
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 3-2
  stem: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고, $f(a)>0$, $f(b)>0$이다. 다음 명제의 대우를 말하고 그것이 참임을 증명하시오.

    > 방정식 $f(x)=0$이 열린구간 $(a,b)$에서 실근을 갖지 않는다면 열린구간 $(a,b)$의 모든 $x$에 대하여 $f(x)>0$이다.
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 대우는 「$(a,b)$의 어떤 $x$에 대하여 $f(x)\le0$이면 $f(x)=0$은 $(a,b)$에서 실근을 갖는다」. $f(c)=0$이면 끝, $f(c)<0$이면 $f(a)>0$과 사잇값의 정리.
    steps:
    - {id: 2a, content: '$f(c)\le0$인 $c$에서 두 경우로 나눠 사잇값의 정리', criteria: ['2.M1', '2.M2', '2.R1']}
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-9.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        주어진 명제의 대우는
        '열린구간 $(a,b)$의 어떤 $x$에 대하여 $f(x)\le0$이면 방정식 $f(x)=0$은 열린구간 $(a,b)$에서 실근을 갖는다.'
        이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        조건에 의하여 $f(c)\le0$인 실수 $c$가 $a$와 $b$ 사이에 존재한다.
        만약 $f(c)=0$이면 $x=c$는 방정식 $f(x)=0$의 근이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        만약 $f(c)<0$이면 $f(a)>0$이므로 사잇값의 정리에 의하여 방정식 $f(x)=0$은 $a$와 $c$ 사이에 적어도 하나의 실근을 갖고 또한 $f(b)>0$이므로 $c$와 $b$ 사이에 적어도 하나의 실근을 갖는다. 따라서 방정식 $f(x)=0$은 열린구간 $(a,b)$에서 실근을 갖는다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ④) <3-2>에서 명제의 대우를 바르게 말할 수 있다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ⑤) <3-2>에서 명제의 가정을 두 가지 경우($f(c)=0$, $f(c)<0$)로 나누어 설명할 수 있다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 20
      evidence: |
        (문항카드 ⑥) <3-2>에서 사잇값의 정리를 활용하여 명제가 참임을 증명할 수 있다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

