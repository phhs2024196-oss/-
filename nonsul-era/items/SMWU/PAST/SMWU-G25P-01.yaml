stimuli:
- label: 가
  body: |
    이차방정식 $ax^2+bx+c=0$의 두 근을 $\alpha$, $\beta$라고 하면,
    $$\alpha+\beta=-\frac ba,\ \alpha\beta=\frac ca$$
- label: 나
  body: |
    함수 $y=f(x)$가 닫힌구간 $[a,b]$에서 연속이면, 최대·최소 정리에 따라 함수 $f(x)$는 이 구간에서 최댓값과 최솟값을 가진다. 이때 이 구간에서 $f(x)$의 극댓값, 극솟값, $f(a)$, $f(b)$ 중에서 가장 큰 값이 최댓값, 가장 작은 값이 최솟값이 된다.

stem: |
  제시문 <가>, <나>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'   # 원문 1-1
  stem: |
    이차방정식 $x^2-(e^k-2)x-2e^k+1=0$의 서로 다른 두 실근을 $\alpha$, $\beta$라고 할 때, $\alpha^3+\beta^3$이 최소가 되는 실수 $k$의 값과 그때 $\alpha^3+\beta^3$의 값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'k = 0; min = -4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t=e^k$에서 $\alpha^3+\beta^3=(t-2)^3-3(1-2t)(t-2)$, 도함수 $3(t+1)(t-1)$.
    steps:
    - {id: 1a, content: '$t=1$ ($k=0$)에서 최솟값 $-4$', criteria: ['1.M1', '1.M2', '1.A1']}
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-07.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 이차방정식의 판별식
        $$D=e^{2k}-4e^k+4+8e^k-4=e^{2k}+4e^k>0$$
        이므로 이차방정식은 항상 서로 다른 두 실근을 가진다. 또한 이차방정식의 근과 계수의 관계에서
        $$\alpha+\beta=e^k-2,\ \alpha\beta=1-2e^k$$
        이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서
        $$\alpha^3+\beta^3=(\alpha+\beta)^3-3\alpha\beta(\alpha+\beta)=(e^k-2)^3-3(1-2e^k)(e^k-2)\ \cdots\cdots\ ①$$
        이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        이때 $t=e^k\ (t>0)$라고 두고, $f(t)=(t-2)^3-3(1-2t)(t-2)$라 하자.
        $$f'(t)=3(t-2)^2+6(t-2)-3(1-2t)=3t^2-3=3(t+1)(t-1)$$
        이므로 $f'(t)=0$에서 $t=\pm1$이다. $t>0$에서 $t=1$ 좌우로 $f'(t)$의 부호가 $-$에서 $+$로 바뀌고 $f(1)=-4$.
        따라서 $t=1$, 즉 $k=0$일 때, $\alpha^3+\beta^3$의 최솟값은 $f(1)=-4$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    source_flow: 문항카드 card-08.png 별해
    method_no: 2
    key_idea: ①을 $k$의 함수로 직접 미분한다.
    steps:
    - id: 1c-1
      content: |
        ①로부터 $g(k)=(e^k-2)^3-3(1-2e^k)(e^k-2)$라 하면,
        $$g'(k)=e^k\{3(e^k-2)^2+6(e^k-2)-3(1-2e^k)\}=3e^k(e^k+1)(e^k-1)=0$$
        이므로 $g'(k)=0$에서 $k=0$이다. $k=0$ 좌우로 $g'(k)$의 부호가 $-$에서 $+$로 바뀌므로 $k=0$일 때, $\alpha^3+\beta^3$의 최솟값은 $g(0)=-4$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
