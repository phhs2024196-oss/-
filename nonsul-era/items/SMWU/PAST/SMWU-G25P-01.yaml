      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ③) $\alpha^3+\beta^3$의 최솟값 $-4$와 실수 $k=0$을 구할 수 있다.
      depends_on: [1.M2]
      steps: [1b-3, 1c-1]
    deductions: []
