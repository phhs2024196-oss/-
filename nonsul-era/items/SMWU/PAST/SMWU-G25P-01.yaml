- id: '2'   # 원문 1-2
  stem: |
    삼차함수 $f(x)=(x^2-1)(x+3k)$의 극댓값과 극솟값의 합이 최대가 되는 실수 $k$의 값과 그때 극댓값과 극솟값의 합을 구하시오. (단, $-\sqrt3\le k\le\sqrt3$)
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'k = sqrt(3); sum = 8*sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(\alpha)+f(\beta)=4k^3-4k$; 극댓값 $\tfrac{8\sqrt3}{9}$보다 끝값 $g(\sqrt3)=8\sqrt3$이 크다.
    steps:
    - {id: 2a, content: '$k=\sqrt3$, 최댓값 $8\sqrt3$', criteria: ['2.M1', '2.M2', '2.A1']}
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-08.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        도함수 $f'(x)=2x(x+3k)+x^2-1=3x^2+6kx-1$이다. 이차방정식 $f'(x)=0$의 판별식 $D/4=9k^2+3>0$이므로 $f'(x)=0$은 항상 서로 다른 두 실근을 가진다.
        $f'(x)=0$의 두 실근을 $\alpha$, $\beta\ (\alpha<\beta)$라고 하면 $f'(x)=0$의 근과 계수의 관계에서
        $$\alpha+\beta=-2k,\ \alpha\beta=-\frac13$$
        이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서
        $$\alpha^2+\beta^2=(\alpha+\beta)^2-2\alpha\beta=4k^2+\frac23,$$
        $$\alpha^3+\beta^3=(\alpha+\beta)^3-3\alpha\beta(\alpha+\beta)=-8k^3-2k$$
        삼차함수 $f(x)$의 삼차항의 계수가 $1$로 양수이고 $\alpha<\beta$이므로 $f(\alpha)$는 극댓값, $f(\beta)$는 극솟값이다. 따라서
        $$f(\alpha)+f(\beta)=\alpha^3+\beta^3+3k(\alpha^2+\beta^2)-(\alpha+\beta)-6k=-8k^3-2k+12k^3+2k+2k-6k=4k^3-4k$$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        여기서 $g(k)=4k^3-4k$라고 하면, $g'(k)=4(3k^2-1)$이므로 $g'(k)=0$에서 $k=\pm\dfrac{1}{\sqrt3}$이다.
        증감표: $g(-\sqrt3)=-8\sqrt3$, $k=-\dfrac1{\sqrt3}$에서 $\dfrac{8\sqrt3}{9}$, $k=\dfrac1{\sqrt3}$에서 $-\dfrac{8\sqrt3}{9}$, $g(\sqrt3)=8\sqrt3$.
        따라서 $k=\sqrt3$일 때 $f(\alpha)+f(\beta)$를 최대로 하고 최댓값은 $g(\sqrt3)=8\sqrt3$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ④) <1-2>에서 도함수의 근과 계수의 관계를 활용할 수 있다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ⑤) <1-2>에서 곱셈 공식을 활용할 수 있다($4k^3-4k$).
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ⑥) 최댓값을 구할 수 있다($k=\sqrt3$, 합 $8\sqrt3$).
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
