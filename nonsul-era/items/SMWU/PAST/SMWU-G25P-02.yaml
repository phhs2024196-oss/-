- id: '2'   # 원문 2-2
  stem: |
    양수 $k$에 대하여 삼차방정식 $x^3-2x=k$가 닫힌구간 $[-k,k]$에서 실근을 갖도록 하는 $k$의 값의 범위를 구하시오.
  points: 50
  depends_on: []
  answer: {kind: set, value: 'Union(Interval.Lopen(0, 4*sqrt(6)/9), Interval(sqrt(3), oo))', equivalents: ['0 < k <= 4*sqrt(6)/9 or k >= sqrt(3)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 극댓값 $\tfrac49\sqrt6$ 이하이면 $[-k,0]$에 근, 넘으면 근이 $x>\sqrt2$뿐이라 $f(k)\ge k$.
    steps:
    - {id: 2a, content: '$0<k\le\tfrac49\sqrt6$ 또는 $k\ge\sqrt3$', criteria: ['2.M1', '2.M2', '2.A1']}
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-09.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(x)=x^3-2x$라 하면 방정식 $f(x)=k$의 근은 곡선 $y=f(x)$와 $y=k$의 교점의 $x$좌표이다.
        $f'(x)=3x^2-2$이므로 $f'(x)=0$에서 $x=\pm\dfrac{\sqrt6}{3}$이다.
        증감표: $x=-\dfrac{\sqrt6}{3}$에서 극댓값 $\dfrac49\sqrt6$, $x=\dfrac{\sqrt6}{3}$에서 극솟값 $-\dfrac49\sqrt6$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $0<k\le1$인 경우에는 $f(-k)-k=-k^3+k=k(1-k^2)>0$이므로 $f(-k)\ge k$이다. $f(0)=0$이므로 사잇값의 정리에 의하여 $f(x)=k$는 구간 $[-k,0]$에서 실근을 갖는다.
        $1<k\le\dfrac49\sqrt6$인 경우에는 $f\left(-\dfrac{\sqrt6}{3}\right)=\dfrac49\sqrt6>k$이므로 $f(x)=k$는 구간 $\left[-\dfrac{\sqrt6}{3},0\right]$에서 실근을 갖는다. 또 $-k<-1<-\dfrac{\sqrt6}{3}$이므로 $f(x)=k$는 구간 $[-k,0]$에서 실근을 갖는다.
        [그림: $y=f(x)$와 직선 $y=-x$, 점 $(-k,k)$, 높이 $1$, $\tfrac49\sqrt6$ 표시]
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        한편, $k>\dfrac49\sqrt6$인 경우에는 방정식 $f(x)=k$는 $x<\sqrt2$인 근을 갖지 않는다. 따라서 방정식 $f(x)=k$가 닫힌구간 $[\sqrt2,k]$에서 실근을 가져야 한다. 함수 $f(x)$는 $[\sqrt2,k]$에서 증가하고 $f(\sqrt2)=0$이므로 $f(k)\ge k$가 되어야 한다. 이 부등식을 풀면 $k^3-3k\ge0$이므로 $k\ge\sqrt3$이다.
        [그림: $y=f(x)$와 직선 $y=x$, $x=\sqrt3$, $x=k$ 표시]
        모든 경우를 고려하면 구하는 $k$의 값의 범위는 $0<k\le\dfrac49\sqrt6$ 또는 $k\ge\sqrt3$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ④) <2-2>에서 함수의 그래프의 개형을 파악한다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ⑤) <2-2>에서 $k$의 값의 범위에 따라 경우를 나누어 설명할 수 있다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ⑥) 사잇값의 정리를 활용하여 실근을 갖는 $k$의 값의 범위($0<k\le\tfrac49\sqrt6$ 또는 $k\ge\sqrt3$)를 구할 수 있다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

