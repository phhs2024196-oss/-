      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ②) <2-1>에서 명제의 가정을 두 가지 경우로 나누어 설명할 수 있다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 20
      evidence: |
        (문항카드 ③) <2-1>에서 사잇값의 정리를 활용하여 명제가 참임을 증명할 수 있다.
      depends_on: [1.M2]
