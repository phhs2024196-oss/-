intent: |
  명제의 대우를 세워 사잇값의 정리로 증명하고, 삼차함수의 그래프의 개형과 사잇값의 정리를 이용해 $k$의 범위에 따라 경우를 나누어 닫힌구간에서 실근을 가질 조건을 구하는 능력을 본다.
key_idea: |
  (2-2) $f(x)=x^3-2x$의 극댓값 $\tfrac49\sqrt6$을 기준으로 $k$를 나누고, $k\le1$이면 $f(-k)\ge k$, $k>\tfrac49\sqrt6$이면 $f(k)\ge k$가 필요충분임을 본다.
stuck: |
  $k>\tfrac49\sqrt6$일 때 실근이 $x>\sqrt2$에만 있으므로 $f(k)\ge k$, 즉 $k\ge\sqrt3$이 되어야 한다는 판단
