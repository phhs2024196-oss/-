stimuli:
- label: 마
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속일 때 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $A$는
    $$A=\int_a^b|f(x)|dx$$
- label: 바
  body: |
    함수 $f(x)$가 임의의 실수 $a$, $b$, $c$를 포함하는 구간에서 연속일 때,
    $$\int_a^c f(x)dx+\int_c^b f(x)dx=\int_a^b f(x)dx$$
- label: 사
  body: |
    점 $(x_1,y_1)$과 직선 $ax+by+c=0$ 사이의 거리 $d$는
    $$d=\frac{|ax_1+by_1+c|}{\sqrt{a^2+b^2}}$$
- label: 아
  body: |
    자연수 $n$에 대한 명제 $p(n)$이 모든 자연수 $n$에 대하여 성립함을 증명할 때, 다음 두 가지를 증명하면 된다.
    (i) $n=1$일 때 명제 $p(n)$이 성립한다.
    (ii) $n=k$일 때 명제 $p(n)$이 성립한다고 가정하면, $n=k+1$일 때도 명제 $p(n)$이 성립한다.
    자연수에 대한 어떤 명제가 참임을 증명하는 이와 같은 방법을 수학적 귀납법이라고 한다.

stem: |
  제시문 <마>, <바>, <사>, <아>를 읽고, 다음 조건을 만족시키는 $a_n$에 대하여 문제에 답하시오.

  > 자연수 $n$에 대하여 $a_1=1$이고 $a_n<a_{n+1}$이다. 함수 $f(x)=\dfrac{2x}{e^2-1}e^{x^2}$의 그래프와 $x$축 및 두 직선 $x=a_n$, $x=a_{n+1}$로 둘러싸인 도형의 넓이 $A_n$이 $A_n=e^{2n-1}$이다.

subparts:
- id: '1'   # 원문 3-1
  stem: |
    $x$축, $y$축에 모두 접하고 중심이 점 $(a_n,a_n)$인 원이 직선 $y=\left(\tan\dfrac1n\right)x$와 만나는 두 점을 각각 $\mathrm{P}_n$, $\mathrm{Q}_n$이라 하자. 선분 $\mathrm{P}_n\mathrm{Q}_n$의 길이를 $l_n$이라 할 때 $\displaystyle\lim_{n\to\infty}l_n^2$의 값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: value, value: '16', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_n^2=2n-1$이고 $l_n^2=8a_n^2\sin\tfrac1n\cos\tfrac1n\to16$.
    steps:
    - {id: 1a, content: '$\lim 8(2-t)\tfrac{\sin t}{t}\cos t=16$', criteria: ['1.M1', '1.M2', '1.A1']}
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-09.png, card-10.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$의 $a_1$부터 $a_n$까지의 정적분은
        $$\int_{a_1}^{a_n}\frac{2x}{e^2-1}e^{x^2}dx=\int_{a_1}^{a_2}\frac{2x}{e^2-1}e^{x^2}dx+\int_{a_2}^{a_3}\frac{2x}{e^2-1}e^{x^2}dx+\cdots+\int_{a_{n-1}}^{a_n}\frac{2x}{e^2-1}e^{x^2}dx=e+e^3+\cdots+e^{2n-3}$$
        $$\frac{1}{e^2-1}\left(e^{a_n^2}-e\right)=\sum_{k=1}^{n-1}e^{2k-1}=\frac{1}{e^2-1}\left(e^{2n-1}-e\right)$$
        따라서 $a_n^2=2n-1$, 즉 $a_n=\sqrt{2n-1}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        점 $(a_n,a_n)$과 직선 $\left(\tan\dfrac1n\right)x-y=0$ 사이의 거리를 $d_n$으로 놓으면
        $$d_n=\frac{\left|\left(\tan\frac1n\right)a_n-a_n\right|}{\sqrt{\tan^2\frac1n+1}}$$
        이다. 한편 $l_n=2\sqrt{a_n^2-d_n^2}$이므로,
        $$l_n^2=4\left(a_n^2-d_n^2\right)=4\left(a_n^2-\frac{a_n^2\left(\tan\frac1n-1\right)^2}{1+\tan^2\frac1n}\right)$$
        이다. 이때 삼각함수의 성질에 의하여 $1+\tan^2\dfrac1n=\sec^2\dfrac1n$이므로
        $$4\left(a_n^2-\frac{a_n^2\left(\tan\frac1n-1\right)^2}{1+\tan^2\frac1n}\right)=4a_n^2\left(1-\frac{\left(\tan\frac1n-1\right)^2}{\sec^2\frac1n}\right)=8a_n^2\left(\frac{\tan\frac1n}{\sec^2\frac1n}\right)=8a_n^2\left(\sin\frac1n\cos\frac1n\right)$$
        이다. 또한 $a_n=\sqrt{2n-1}$이므로 $l_n^2=8(2n-1)\left(\sin\dfrac1n\cos\dfrac1n\right)$이다.
        [그림: 중심 $(a_n,a_n)$, 반지름 $a_n$인 원과 직선이 만나는 두 점 $\mathrm{P}_n$, $\mathrm{Q}_n$]
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        이때, $t=\dfrac1n$이라 하면, $n\to\infty$일 때, $t\to0$이므로
        $$\lim_{n\to\infty}l_n^2=\lim_{n\to\infty}8(2n-1)\left(\sin\frac1n\cos\frac1n\right)=\lim_{t\to0}8\left(\frac2t-1\right)(\sin t\cos t)=\lim_{t\to0}8(2-t)\frac{\sin t}{t}\cos t=16$$
        이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ①) <3-1>에서 정적분의 성질을 이용하여 $a_n=\sqrt{2n-1}$을 구할 수 있다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ②) <3-1>에서 선분의 길이 $l_n$을 구할 수 있다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ③) 삼각함수의 극한을 이용하여 극한값 $16$을 구할 수 있다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 3-2
  stem: |
    모든 자연수 $n$에 대하여 다음 부등식이 성립함을 수학적 귀납법으로 증명하시오.
    $$\sum_{m=1}^{n^2}\frac{1}{a_m}\ge n$$
  points: 50
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $m=k^2+1,\dots,(k+1)^2$의 $2k+1$개 항은 각각 $\tfrac1{\sqrt{2(k+1)^2-1}}$ 이상.
    steps:
    - {id: 2a, content: '$k+\tfrac{2k+1}{\sqrt{2(k+1)^2-1}}\ge k+1$', criteria: ['2.M1', '2.M2', '2.R1']}
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-10.png, card-11.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a_n=\sqrt{2n-1}$이므로 주어진 부등식은
        $$\sum_{m=1}^{n^2}\frac{1}{\sqrt{2m-1}}\ge n\ \cdots\cdots\ ②$$
        이다.
        $n=1$일 때 $\dfrac{1}{\sqrt1}\ge1$이므로 ②가 성립한다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $n=k$일 때 부등식 $\displaystyle\sum_{m=1}^{k^2}\frac{1}{\sqrt{2m-1}}\ge k$가 성립한다고 가정하자.
        위 부등식의 양변에 $\dfrac{1}{\sqrt{2k^2+1}}+\dfrac{1}{\sqrt{2k^2+3}}+\cdots+\dfrac{1}{\sqrt{2(k+1)^2-1}}$을 더하면
        $$\sum_{m=1}^{k^2}\frac{1}{\sqrt{2m-1}}+\frac{1}{\sqrt{2k^2+1}}+\frac{1}{\sqrt{2k^2+3}}+\cdots+\frac{1}{\sqrt{2(k+1)^2-1}}\ge k+\frac{1}{\sqrt{2k^2+1}}+\frac{1}{\sqrt{2k^2+3}}+\cdots+\frac{1}{\sqrt{2(k+1)^2-1}}$$
        여기에서,
        $$\sum_{m=1}^{k^2}\frac{1}{\sqrt{2m-1}}+\frac{1}{\sqrt{2k^2+1}}+\frac{1}{\sqrt{2k^2+3}}+\cdots+\frac{1}{\sqrt{2(k+1)^2-1}}=\sum_{m=1}^{(k+1)^2}\frac{1}{\sqrt{2m-1}}$$
        이고
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $\dfrac{1}{\sqrt{2k^2+1}}+\dfrac{1}{\sqrt{2k^2+3}}+\cdots+\dfrac{1}{\sqrt{2(k+1)^2-1}}$의 항의 개수는 $2k+1$이므로
        $$\sum_{m=1}^{(k+1)^2}\frac{1}{a_m}\ge k+\frac{2k+1}{\sqrt{2(k+1)^2-1}}=k+\sqrt{\frac{4k^2+4k+1}{2k^2+4k+1}}=k+\sqrt{1+\frac{2k^2}{2k^2+4k+1}}\ge k+1$$
        이므로 $n=k+1$일 때도 ②가 성립한다. 따라서 모든 자연수 $n$에서 주어진 부등식이 성립한다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ④) <3-2>에서 주어진 부등식을 이해할 수 있다($a_m=\sqrt{2m-1}$ 대입, $n=1$ 확인).
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 15}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ⑤) <3-2>에서 $n=k$에서 $n=k+1$이 되는 과정을 설명할 수 있다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 20
      evidence: |
        (문항카드 ⑥) <3-2>에서 수학적 귀납법을 이용하여 부등식을 증명할 수 있다(항 개수 $2k+1$과 최소항 평가).
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
