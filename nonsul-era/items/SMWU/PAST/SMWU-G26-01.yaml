  (1-1) $f(x)=x^2+a-\sqrt{x+1}$에 사잇값 정리: $f(1)f(3)<0$. (1-2) 서로 다른 두 해 $c_1<c_2$를 가정하면 평균값 정리로 $f'(c)=\dfrac{2c_2-2c_1}{c_2-c_1}=2$인 $c\in(0,1)$가 존재해 $\lvert f'(x)\rvert<1$에 모순.
