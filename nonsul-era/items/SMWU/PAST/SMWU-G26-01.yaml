stimuli:
- label: 가
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\neq f(b)$이면, $f(a)$와 $f(b)$ 사이의 임의의 값 $k$에 대하여 $f(c)=k$인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: 나
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능하면
    $$\frac{f(b)-f(a)}{b-a}=f'(c)$$
    인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: 다
  body: |
    어떤 명제가 참임을 증명할 때, 그 명제 또는 명제의 결론을 부정하면 모순이 생긴다는 것을 보여도 된다. 이와 같이 증명하는 방법을 귀류법이라고 한다.

stem: |
  제시문 <가>, <나>, <다>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'   # 원문 1-1
  stem: |
    이차함수 $y=x^2+a$와 무리함수 $y=\sqrt{x+1}$이 열린구간 $(1,3)$에서 만나도록 하는 실수 $a$의 값의 범위를 구하시오.
  points: 50
  depends_on: []
  answer: {kind: set, value: '(-7, sqrt(2)-1)', equivalents: ['-7 < a < sqrt(2)-1'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(x)=x^2+a-\sqrt{x+1}$은 $[1,3]$에서 연속·증가이므로 $(1,3)$에 근이 있을 조건은 $f(1)<0<f(3)$.
    steps:
    - {id: 1a, content: '$(a+1-\sqrt2)(a+7)<0\Rightarrow -7<a<\sqrt2-1$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 두 함수의 차를 새 함수로 두자.
    - 양 끝값의 부호가 다르면 무엇을 알 수 있는가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-10.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^2+a-\sqrt{x+1}$이라고 하면 $f(x)$는 닫힌구간 $[1,3]$에서 연속이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        제시문 <가>(사잇값 정리)에 의해 $f(1)f(3)<0$이면 $f(c)=0$인 $c$가 열린구간 $(1,3)$에 적어도 하나 존재한다. 즉, 이차함수 $y=x^2+a$와 무리함수 $y=\sqrt{x+1}$이 열린구간 $(1,3)$에서 만난다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $f(1)=a+1-\sqrt2$이고 $f(3)=a+7$이므로 $f(1)f(3)<0$에 대입하면 다음을 얻을 수 있다.
        $$(a+1-\sqrt2)(a+7)<0$$
        그러므로 실수 $a$의 값의 범위는 $-7<a<\sqrt2-1$이다.
      criteria: ['1.A1']
    - id: 1b-4
      content: |
        참고로 열린구간 $(1,3)$에서 도함수 $f'(x)$는 다음을 만족시킨다.
        $$f'(x)=2x-\frac{1}{2\sqrt{x+1}}=\frac{4x\sqrt{x+1}-1}{2\sqrt{x+1}}>0$$
        따라서 다음이 성립함을 알 수 있다. $f(1)<0$, $f(3)>0$
      criteria: ['1.M2']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: R
      points: 15
      evidence: |
        (기준 ①) 이차함수와 무리함수(따라서 $f(x)=x^2+a-\sqrt{x+1}$)가 $[1,3]$에서 연속임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ②) 사잇값 정리로 $f(1)f(3)<0$이면 $(1,3)$에서 만남을 이용했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2, 1b-4]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ③) $(a+1-\sqrt2)(a+7)<0$을 풀어 $-7<a<\sqrt2-1$을 얻었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 1-2
  stem: |
    함수 $f(x)$가 닫힌구간 $[0,1]$에서 연속이고 열린구간 $(0,1)$에서 미분가능한 함수라고 하자. 함수 $f(x)$가 열린구간 $(0,1)$에 있는 모든 실수 $x$에 대하여 $\lvert f'(x)\rvert<1$을 만족시킬 때, $f(c)=2c$인 $c$의 개수가 닫힌구간 $[0,1]$에서 하나 이하로 존재함을 귀류법을 이용하여 증명하시오.
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 두 해 $c_1<c_2$를 가정하면 평균값 정리로 $f'(c)=2$인 $c\in(c_1,c_2)\subset(0,1)$가 생겨 모순.
    steps:
    - {id: 2a, content: '$f^{\prime}(c)=\dfrac{f(c_2)-f(c_1)}{c_2-c_1}=\dfrac{2c_2-2c_1}{c_2-c_1}=2$, $\lvert f^{\prime}(c)\rvert<1$에 모순', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 결론을 부정하면 어떤 두 점이 존재하는가?
    - 그 두 점 사이에서 평균값 정리를 써 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-10.png, card-11.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        귀류법을 사용하기 위해 $f(c_1)=2c_1$이고 $f(c_2)=2c_2$인 서로 다른 $c_1,c_2$가 구간 $[0,1]$에 존재한다고 가정하자. 여기서 $c_1\neq c_2$이므로 $c_1<c_2$라고 하자.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        함수 $f(x)$가 닫힌구간 $[c_1,c_2]$에서 연속이고 열린구간 $(c_1,c_2)$에서 미분가능하므로 제시문 <나>(평균값 정리)에 의해
        $$\frac{f(c_2)-f(c_1)}{c_2-c_1}=f'(c)$$
        인 $c$가 열린구간 $(c_1,c_2)$에서 적어도 하나 존재한다. 위의 식으로부터 다음을 얻을 수 있다.
        $$f'(c)=\frac{f(c_2)-f(c_1)}{c_2-c_1}=\frac{2c_2-2c_1}{c_2-c_1}=2$$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        그런데 $c$는 열린구간 $(0,1)$에 있고 $f'(c)=2$이므로 함수 $f(x)$가 열린구간 $(0,1)$에 있는 모든 실수 $x$에 대하여 $\lvert f'(x)\rvert<1$이라는 사실에 모순이다. 그러므로 $f(c)=2c$인 $c$의 개수가 닫힌구간 $[0,1]$에서 하나 이하로 존재한다. ■
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ④) 명제의 부정 「$f(c_1)=2c_1$, $f(c_2)=2c_2$인 서로 다른 $c_1<c_2$가 $[0,1]$에 존재」를 정확히 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ⑤) $[c_1,c_2]$에서 평균값 정리를 적용해 $f'(c)=2$인 $c\in(c_1,c_2)$를 얻었다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: R
      points: 20
      evidence: |
        (기준 ⑥) $c\in(0,1)$에서 $f'(c)=2$가 $\lvert f'(x)\rvert<1$에 모순임을 밝혀 결론을 맺었다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

