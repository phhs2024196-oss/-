intent: |
  접선에 수직인 직선이 주어진 점을 지난다는 가정을 이용하여 $a_n$과 $b_n$을 구할 수 있는지, 곡선과 $x$축 및 접선으로 둘러싸인 영역의 넓이를 구하고 수열의 극한값을 구할 수 있는지 평가한다.
key_idea: |
  법선 $y=-\dfrac{1}{2na_n}(x-a_n)+na_n^2$이 $(0,1)$을 지나 $na_n^2=1-\dfrac{1}{2n}$. 접선의 $x$절편이 $\dfrac{a_n}{2}$이므로 $A_n=\dfrac{na_n^3}{12}$, $\dfrac{A_n}{a_n}=\dfrac{b_n}{12}\to\dfrac1{12}$.
stuck: |
  넓이를 $\displaystyle\int_0^{a_n}nx^2dx$에서 접선 아래 삼각형을 빼는 꼴로 정리하는 것
