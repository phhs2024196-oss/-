stimuli:
- label: 라
  body: |
    두 직선 $l:y=mx+n$, $l':y=m'x+n'$에 대하여 $l$과 $l'$이 서로 수직인 조건은 다음과 같다.
    $$mm'=-1$$
    거꾸로 $mm'=-1$이면 $l$과 $l'$은 서로 수직이다.
- label: 마
  body: |
    두 함수 $f(x)$와 $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b\lvert f(x)-g(x)\rvert dx$$

stem: |
  제시문 <라>와 <마>를 읽고 다음 문제에 답하시오.

  자연수 $n$에 대하여 이차함수 $y=nx^2$ 위의 점 $P_n(a_n,b_n)$을 지나고 이 점에서의 접선에 수직인 직선이 점 $(0,1)$을 지난다고 가정하자. (단, $a_n>0$이다.)

subparts:
- id: '1'   # 원문 2-1
  stem: |
    $a_n$과 $b_n$을 각각 구하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'a_n = sqrt((2*n-1)/2)/n; b_n = (2*n-1)/(2*n)', equivalents: ['a_n = sqrt(2*n-1)/(sqrt(2)*n)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 법선에 $(0,1)$ 대입 → $1=\dfrac{1}{2n}+na_n^2$.
    steps:
    - {id: 1a, content: '$a_n^2=\dfrac{2n-1}{2n^2}$, $a_n=\dfrac1n\sqrt{\dfrac{2n-1}{2}}$, $b_n=\dfrac{2n-1}{2n}$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 접선의 기울기 $2na_n$에 수직인 기울기는?
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-11.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        이차함수 $y=nx^2$ 위의 점 $P_n(a_n,b_n)$을 지나는 접선의 방정식은
        $$y=2na_n(x-a_n)+na_n^2$$
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이고, 이차함수 $y=nx^2$ 위의 점 $P_n(a_n,b_n)$을 지나고 이 점에서의 접선에 수직인 직선의 방정식은
        $$y=-\frac{1}{2na_n}(x-a_n)+na_n^2$$
        으로 주어진다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        또한 이 직선은 점 $(0,1)$을 지나므로 $1=\dfrac{1}{2n}+na_n^2$을 만족시킨다. 따라서 $a_n^2=\dfrac{2n-1}{2n^2}$을 얻고, 이를 이용하면
        $$a_n=\frac1n\sqrt{\frac{2n-1}{2}},\quad b_n=\frac{2n-1}{2n}$$
        을 얻는다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ①) 점 $P_n$에서의 접선의 기울기 $2na_n$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ②) 접선에 수직인 직선 $y=-\dfrac{1}{2na_n}(x-a_n)+na_n^2$을 세웠다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ③) $(0,1)$을 대입해 $a_n=\dfrac1n\sqrt{\dfrac{2n-1}{2}}$, $b_n=\dfrac{2n-1}{2n}$을 구했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 2-2
  stem: |
    이차함수 $y=nx^2$과 $x$축 및 이차함수 $y=nx^2$ 위의 점 $P_n(a_n,b_n)$에서의 접선으로 둘러싸인 영역의 넓이를 $A_n$이라고 하자. 이때 $\displaystyle\lim_{n\to\infty}\frac{A_n}{a_n}$의 값을 구하시오.
  points: 50
  depends_on: ['1']
  answer: {kind: value, value: '1/12', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 포물선과 접선·$x$축 사이 넓이 $A_n=\dfrac{na_n^3}{12}$, $\dfrac{A_n}{a_n}=\dfrac{na_n^2}{12}=\dfrac{b_n}{12}$.
    steps:
    - {id: 2a, content: '$\dfrac{A_n}{a_n}=\dfrac{2n-1}{24n}\to\dfrac1{12}$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 접선의 $x$절편을 먼저 구하자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-12.png, card-13.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $P_n(a_n,b_n)$에서의 접선의 방정식은 $y-na_n^2=2na_n(x-a_n)$이다. $x$축과의 교점을 구하기 위해 $y=0$을 대입하면 $-na_n^2=2na_nx-2na_n^2$을 얻는다. 따라서 $x=\dfrac{a_n}{2}>0$이다. [그림: 포물선 $y=nx^2$, 점 $P_n(a_n,b_n)$에서의 접선, 접선의 $x$절편 $\left(\frac{a_n}{2},0\right)$]
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이를 이용하여, 이차함수 $y=nx^2$과 $x$축 및 이차함수 $y=nx^2$ 위의 점 $P_n(a_n,b_n)$에서의 접선으로 둘러싸인 영역의 넓이 $A_n$을 구하면 다음과 같다.
        $$A_n=\int_0^{\frac{a_n}{2}}nx^2dx+\int_{\frac{a_n}{2}}^{a_n}\{nx^2-(2na_nx-na_n^2)\}dx=\int_0^{a_n}nx^2dx-\int_{\frac{a_n}{2}}^{a_n}(2na_nx-na_n^2)dx$$
        $$=\frac{na_n^3}{3}-na_n\left\{a_n^2-\left(\frac{a_n}{2}\right)^2\right\}+na_n^2\frac{a_n}{2}=na_n^3\left(\frac13-\frac34+\frac12\right)=\frac{na_n^3}{12}=\frac{n}{12}\frac{1}{n^3}\left(\sqrt{\frac{2n-1}{2}}\right)^3$$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        따라서
        $$\lim_{n\to\infty}\frac{A_n}{a_n}=\lim_{n\to\infty}\frac{\frac{1}{12n^2}\frac{2n-1}{2}\sqrt{\frac{2n-1}{2}}}{\frac1n\sqrt{\frac{2n-1}{2}}}=\frac1{12}$$
        이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ④) 점 $P_n$에서의 접선의 방정식과 $x$절편 $\dfrac{a_n}{2}$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ⑤) 넓이를 적분으로 나타내 $A_n=\dfrac{na_n^3}{12}$을 구했다.
      depends_on: [2.M1]
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 15}
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ⑥) 수열의 극한값 $\dfrac1{12}$을 구했다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

