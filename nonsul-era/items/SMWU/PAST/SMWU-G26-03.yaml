stimuli:
- label: 바
  body: |
    함수 $f:X\to Y$가 일대일대응이면 $Y$의 각 원소 $y$에 대하여 $y=f(x)$인 $X$의 원소 $x$가 오직 하나 존재한다. 이때 $Y$의 각 원소 $y$에 $y=f(x)$인 $X$의 원소 $x$를 대응시키면 $Y$를 정의역, $X$를 공역으로 하는 새로운 함수를 정의할 수 있다. 이 함수를 함수 $f$의 역함수라 하고, 기호로
    $$f^{-1}:Y\to X,\ x=f^{-1}(y)$$
    와 같이 나타낸다.
- label: 사
  body: |
    실수 전체의 집합에서 정의된 삼차함수 $f(x)=ax^3+bx^2+cx+d\ (a\neq0)$가 역함수를 갖기 위한 조건은 다음과 같다.
    1. $a>0$이면 도함수 $f'(x)$가 실수 전체의 집합에서 $f'(x)\ge0$을 만족시킨다.
    2. $a<0$이면 도함수 $f'(x)$가 실수 전체의 집합에서 $f'(x)\le0$을 만족시킨다.

stem: |
  제시문 <바>와 <사>를 읽고 다음 문제에 답하시오.

  함수 $f(x)=x^3+2x+4$는 실수 전체의 집합에서 정의된 삼차함수이다.

subparts:
- id: '1'   # 원문 3-1
  stem: |
    삼차함수 $f(x)$의 역함수가 존재함을 보이고, 역함수 $f^{-1}$에 대하여 $f^{-1}(t^2+5t+1)=t-1$을 만족시키는 실수 $t$의 값을 모두 구하시오.
  points: 50
  depends_on: []
  answer: {kind: set, value: '{0, 4}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=3x^2+2\ge0$이므로 역함수 존재, $t^2+5t+1=f(t-1)=t^3-3t^2+5t+1$.
    steps:
    - {id: 1a, content: '$t^2(t-4)=0\Rightarrow t=0,4$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $f^{-1}(u)=v$는 $f$로 어떻게 바꿔 쓸 수 있는가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-13.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        도함수 $f'(x)=3x^2+2$는 $f'(x)\ge0$을 만족시킨다. 그러므로 제시문 <사>에 따르면 $f(x)$는 역함수를 갖는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        문제에서 $f^{-1}(t^2+5t+1)=t-1$이므로 $t^2+5t+1=f(t-1)$이 성립한다. 여기에서 우변의 $f(t-1)$을 주어진 $f(x)$를 이용하여 계산하면 $f(t-1)=t^3-3t^2+5t+1$을 얻는다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        그러므로 $t^3-3t^2+5t+1=t^2+5t+1$이 되고, 이것을 풀면 $t^2(t-4)=0$이다. 그러므로 $t=0$ 또는 $t=4$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: R
      points: 15
      evidence: |
        (기준 ①) $f'(x)=3x^2+2\ge0$을 근거로 역함수가 존재함을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ②) 역함수를 이용해 삼차방정식 $t^2+5t+1=f(t-1)=t^3-3t^2+5t+1$을 세웠다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ③) $t^2(t-4)=0$을 풀어 $t=0$, $t=4$를 구했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 3-2
  stem: |
    삼차함수 $f(x)$의 역함수 $f^{-1}$에 대하여 $f^{-1}(t^2+2)+f^{-1}(t^2-2)=0$을 만족시키는 실수 $t$의 값을 모두 구하시오.
  points: 50
  depends_on: ['1']
  answer: {kind: set, value: '{-2, 2}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a=f^{-1}(t^2+2)$, $b=-a$이면 $f(a)-f(-a)=2a^3+4a=4$, 즉 $a^3+2a=2$이고 $f(a)=6=t^2+2$.
    steps:
    - {id: 2a, content: '$t^2=4\Rightarrow t=\pm2$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 두 역함수 값을 각각 문자로 두자.
    - 두 식을 빼면 상수가 남는다.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-14.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f^{-1}(t^2+2)=a$, $f^{-1}(t^2-2)=b$라고 하면 $f(a)=t^2+2$, $f(b)=t^2-2$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        첫 번째 식에서 두 번째 식을 빼면 $f(a)-f(b)=4\quad(1)$이다. 식 (1)의 좌변을 계산하면
        $$f(a)-f(b)=(a^3+2a+4)-(b^3+2b+4)=a^3-b^3+2(a-b)\qquad(2)$$
        이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        한편 $f^{-1}(t^2+2)+f^{-1}(t^2-2)=0$은 $a+b=0$이다. 이를 식 (2)에 대입하면
        $$f(a)-f(b)=a^3-(-a)^3+2(a-(-a))=2a^3+4a$$
        이다. 이것과 식 (1)로부터 $a^3+2a=2$를 얻는다. 그러므로 $f(a)=a^3+2a+4=6$이다. 또한 $f(a)=t^2+2$이므로 $t^2=4$이다. 따라서 $t=\pm2$이다.
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    source_flow: 문항카드 card-14.png 다른 풀이
    method_no: 2
    key_idea: $f(-x)=-f(x)+8$을 이용한다.
    steps:
    - id: 2c-1
      content: |
        함수 $f(x)$에 $-x$를 대입하면 $f(-x)=-x^3-2x+4=-f(x)+8\quad(3)$이다. 문제의 조건은 $f^{-1}(t^2+2)=-f^{-1}(t^2-2)$와 같이 쓸 수 있다. 이것과 식 (3)을 이용하면
        $$t^2+2=f(-f^{-1}(t^2-2))=-f(f^{-1}(t^2-2))+8=-t^2+2+8$$
        이다. 따라서 $2t^2=8$이고 $t=\pm2$이다.
      criteria: ['2.M1', '2.M2', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ④) 역함수의 정의로 $f(a)=t^2+2$, $f(b)=t^2-2$로 표현했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2c-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ⑤) $f(a)-f(b)=4$를 구했다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ⑥) $a+b=0$과 연립한 삼차방정식 $a^3+2a=2$와 이차방정식 $t^2=4$를 풀어 $t=\pm2$를 얻었다.
      depends_on: [2.M2]
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

