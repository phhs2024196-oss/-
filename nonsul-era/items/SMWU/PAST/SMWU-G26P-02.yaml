key_idea: |
  $0\le x\le100\pi$에서 $\sin x\le-\frac12$의 해는 $A_n=\left[(2n-1)\pi+\frac\pi6,\,2n\pi-\frac\pi6\right]$ $(n=1,\ldots,50)$이고, 각 구간의 적분이 $\left(e^{\frac{5\pi}{6}}-e^{\frac\pi6}\right)e^{-2n\pi}$이므로 등비수열의 합.
