stimuli:
- label: 바
  body: |
    함수 $f:X\to Y$가 일대일대응이면 $Y$의 각 원소 $y$에 대하여 $y=f(x)$인 $X$의 원소 $x$가 오직 하나 존재한다. 이때 $Y$의 각 원소 $y$에 $y=f(x)$인 $X$의 원소 $x$를 대응시키면 $Y$를 정의역, $X$를 공역으로 하는 새로운 함수를 정의할 수 있다. 이 함수를 함수 $f$의 역함수라 하고, 기호로
    $$f^{-1}:Y\to X,\ x=f^{-1}(y)$$
    와 같이 나타낸다.
- label: 사
  body: |
    지수함수 $y=a^x\ (a>0,\,a\neq1)$은 실수 전체의 집합에서 양의 실수 전체의 집합으로의 일대일대응이므로 역함수를 갖는다. 이때 로그의 정의에 의하여
    $$y=a^x\iff x=\log_ay$$
    이므로, $x=\log_ay$에서 $x$와 $y$를 서로 바꾸면 지수함수 $y=a^x$의 역함수
    $$y=\log_ax\ (a>0,\,a\neq1)$$
    를 얻는다. 이 함수를 $a$를 밑으로 하는 로그함수라고 하며 다음과 같은 성질을 갖는다.
    1. 정의역은 양의 실수 전체의 집합이고 치역은 실수 전체의 집합이다.
    2. $a>1$일 때, $x$의 값이 증가하면 $y$의 값도 증가한다.
    3. 그래프는 점 $(1,0)$을 지나고, $y$축을 점근선으로 갖는다.
    특히, $a$가 자연상수 $e=\displaystyle\lim_{x\to\infty}\left(1+\frac1x\right)^x$인 경우에 자연로그라 하고, $y=\ln x$로 나타낸다.

stem: |
  제시문 <바>와 <사>를 읽고 다음 문제에 답하시오.

  함수 $f(x)=\ln\sqrt{\dfrac{1+x}{1-x}}$의 역함수를 $y=g(x)$라고 하자.

subparts:
- id: '1'   # 원문 3-1
  stem: |
    $x>0$에 대하여 $f(x)>x$임을 보이시오.
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $h(x)=f(x)-x$는 $h'(x)=\dfrac{x^2}{1-x^2}>0$ $(0<x<1)$, $h(0)=0$.
    steps:
    - {id: 1a, content: '$h^{\prime}(x)=\dfrac{x^2}{1-x^2}>0\Rightarrow h(x)>h(0)=0$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 먼저 $f$의 정의역을 구하자.
    - 두 함수의 차를 미분해 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-14.png, card-15.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 함수
        $$f(x)=\ln\sqrt{\frac{1+x}{1-x}}=\frac12(\ln(1+x)-\ln(1-x))$$
        의 정의역은 $\{x\mid-1<x<1\}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이제 두 함수의 차 $f(x)-x$를 $h(x)$라 두자. 즉, $h(x)=f(x)-x$이다. 함수 $h(x)$를 미분하면
        $$h'(x)=f'(x)-1=\frac12\left(\frac{1}{1+x}+\frac{1}{1-x}\right)-1=\frac{x^2}{1-x^2}$$
        이다. 따라서 $0<x<1$에서 $h'(x)>0$이므로 $h(x)$는 증가함수이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        또한 $h(0)=0$이므로 $x>0$에 대하여 $h(x)>h(0)=0$을 만족시킨다. 따라서 $x>0$에 대하여 $f(x)>x$가 성립한다. ■
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: B
      points: 15
      evidence: |
        (기준 ①) $f(x)$의 정의역 $-1<x<1$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ②) $h'(x)=\dfrac{x^2}{1-x^2}>0$으로 $h(x)=f(x)-x$가 증가함수임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: R
      points: 20
      evidence: |
        (기준 ③) $h(x)>h(0)=0$을 이용해 $f(x)>x$를 결론지었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 3-2
  stem: |
    $y=g(x)$의 그래프를 그리시오.
  points: 50
  depends_on: ['1']
  answer: {kind: expression, value: 'g(x) = (exp(2*x) - 1)/(exp(2*x) + 1); asymptotes y=1, y=-1; inflection (0,0); g increasing', equivalents: ['g(x) = tanh(x)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $y=f(x)$는 증가, 변곡점 $(0,0)$, 점근선 $x=\pm1$, 원점에서 $y=x$에 접함 → $y=x$ 대칭으로 $g$는 점근선 $y=\pm1$인 증가 곡선.
    steps:
    - {id: 2a, content: '$f^{\prime}=\dfrac{1}{1-x^2}>0$, $f^{\prime\prime}=\dfrac{2x}{(1-x^2)^2}$, $\displaystyle\lim_{x\to\pm1}f(x)=\pm\infty$ → $y=x$ 대칭', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 역함수의 그래프는 원래 그래프와 어떤 관계인가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-15.png, card-16.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $y=f(x)$의 역함수 $y=g(x)$의 그래프는 $y=f(x)$의 그래프를 직선 $y=x$에 대하여 대칭하여 얻을 수 있다. $y=f(x)$의 그래프를 그리기 위해 함수의 증감을 확인하면 다음과 같다. 정의역 $\{x\mid-1<x<1\}$에서 $f'(x)=\dfrac{1}{1-x^2}>0$이다. 한편 $f''(x)=\dfrac{2x}{(1-x^2)^2}$이다. 이로부터 점 $(0,0)$은 곡선 $y=f(x)$의 변곡점임을 알 수 있다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        또한 $\displaystyle\lim_{x\to1}f(x)=\infty$, $\displaystyle\lim_{x\to-1}f(x)=-\infty$이다. 따라서 두 직선 $x=1$과 $x=-1$이 점근선이 된다. 그리고 $f'(0)=1$이므로 $y=f(x)$의 그래프는 원점에서 $y=x$에 접한다. 이제 이를 이용하여 그래프를 그리면 다음과 같다. [그림: $y=f(x)$ — 점근선 $x=\pm1$, 변곡점 $(0,0)$, 원점에서 $y=x$에 접하는 증가 곡선]
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        직선 $y=x$에 관하여 대칭하면 역함수 $y=g(x)$의 그래프를 다음과 같이 얻을 수 있다. [그림: $y=g(x)$ — 점근선 $y=1$, $y=-1$, 원점을 지나며 원점에서 $y=x$에 접하는 증가 곡선, $x>0$에서 $y=x$ 아래, $x<0$에서 $y=x$ 위]
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ④) 이계도함수 $f''(x)=\dfrac{2x}{(1-x^2)^2}$로 변곡점 $(0,0)$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ⑤) $\displaystyle\lim_{x\to\pm1}f(x)=\pm\infty$에서 점근선 $x=\pm1$(역함수는 $y=\pm1$)을 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ⑥) $y=x$에 대한 대칭으로 점근선 $y=\pm1$, 원점 통과·증가하는 $y=g(x)$의 그래프를 그렸다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

