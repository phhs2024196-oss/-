intent: |
  닫힌구간에서 연속인 함수의 정적분이 급수의 합으로 표현될 수 있음을 이용하여, 정적분을 부정적분 없이 급수의 합으로 계산하고(1-1), 주어진 극한을 급수의 합 표현으로 바꾼 뒤 정적분으로 그 값을 계산할 수 있는지(1-2)를 평가한다.
key_idea: |
  $\displaystyle\int_a^bf(x)dx=\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x$에서 $1$-$1$은 $f(x)=x^3$, $[0,1]$, $1$-$2$는 $f(x)=\ln x$, $[1,2]$, $n=2^N$으로 대응시킨다.
stuck: |
  $\ln\left(\dfrac{2^N+k}{2^N}\right)^{\frac{1}{2^N}}=\dfrac{1}{2^N}\ln\left(1+\dfrac{k}{2^N}\right)$로 지수를 앞으로 내리고 $n=2^N$, $x_k=1+\dfrac{k}{2^N}$으로 읽는 단계
