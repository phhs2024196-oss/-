stimuli:
- label: 가
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(x)\ge0$일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이를 $S$라 하자. 닫힌구간 $[a,b]$를 $n$등분하여 양 끝점과 각 분점의 $x$좌표를 차례대로
    $$a=x_0,\ x_1,x_2,\ \cdots,\ x_{n-1},\ x_n=b$$
    라 하고, 각 소구간의 길이를 $\Delta x$라 하면,
    $$\Delta x=\frac{b-a}{n},\ x_k=a+k\Delta x\ (k=0,1,\cdots,n)$$
    이다. 이때 색칠한 직사각형의 넓이의 합 $S_n$은
    $$S_n=f(x_1)\Delta x+f(x_2)\Delta x+\ \cdots\ +f(x_n)\Delta x=\sum_{k=1}^{n}f(x_k)\Delta x$$
    이다. 여기서 $n$이 한없이 커질 때 $S_n$이 $S$로 수렴함이 알려져 있다. 그런데 정적분의 정의에 의하여 $S=\displaystyle\int_a^bf(x)dx$이다. 따라서, 정적분과 급수의 합 사이에는 다음 관계가 성립한다.
    $$\int_a^bf(x)dx=\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x\quad\left(\text{단, }\Delta x=\frac{b-a}{n},\ x_k=a+k\Delta x\right)$$
    [그림: 곡선 $y=f(x)$ 아래 $[a,b]$를 $n$등분한 소구간마다 오른쪽 끝점 $x_k$의 함숫값을 높이로 하는 직사각형들을 색칠한 그림]

stem: |
  제시문 <가>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    급수의 합 표현을 이용하여 정적분 $\displaystyle\int_0^1x^3dx$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\Delta x=\frac1n$, $x_k=\frac kn$으로 두면 $\displaystyle\lim_{n\to\infty}\frac{1}{n^4}\sum_{k=1}^{n}k^3=\frac14$.
    steps:
    - {id: 1a, content: '$\displaystyle\int_0^1x^3dx=\lim_{n\to\infty}\frac{1}{n^4}\left\{\frac{n(n+1)}{2}\right\}^2=\frac14$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 제시문 <가>의 $a$, $b$, $\Delta x$, $x_k$에 무엇을 넣어야 하는가?
    - $\sum_{k=1}^{n}k^3$의 공식을 떠올려 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-31.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x^3$이라 하면 함수 $f(x)$는 닫힌구간 $[0,1]$에서 연속이다. 이때 $a=0$, $b=1$이므로
        $\Delta x=\dfrac{b-a}{n}=\dfrac1n$, $x_k=a+k\Delta x=\dfrac kn$, $f(x_k)=x_k^3=\left(\dfrac kn\right)^3$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        정적분과 급수의 합 사이의 관계에 의하여
        $\displaystyle\int_0^1x^3dx=\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x=\lim_{n\to\infty}\sum_{k=1}^{n}\left(\frac{k^3}{n^3}\times\frac1n\right)=\lim_{n\to\infty}\frac{1}{n^4}\sum_{k=1}^{n}k^3$.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $\displaystyle=\lim_{n\to\infty}\frac{1}{n^4}\times\left\{\frac{n(n+1)}{2}\right\}^2=\lim_{n\to\infty}\frac{n^4+2n^3+n^2}{4n^4}=\frac14$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\Delta x=\dfrac1n$, $x_k=\dfrac kn$, $f(x_k)=x_k^3=\left(\dfrac kn\right)^3$으로 표현될 수 있음을 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        주어진 정적분을 $\displaystyle\lim_{n\to\infty}\frac{1}{n^4}\sum_{k=1}^{n}k^3$ 꼴로 변환했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        위 극한값이 $\dfrac14$임을 보였다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    아래 식을 급수의 합 표현으로 바꾸고, 정적분과 급수의 합 사이의 관계를 이용하여 그 값을 구하시오.
    $$\lim_{N\to\infty}\left\{\ln\left(\frac{2^N+1}{2^N}\right)^{\frac{1}{2^N}}+\ln\left(\frac{2^N+2}{2^N}\right)^{\frac{1}{2^N}}+\ \cdots\ +\ln\left(\frac{2^N+2^N}{2^N}\right)^{\frac{1}{2^N}}\right\}$$
  points: 10
  depends_on: []
  answer: {kind: value, value: '2*log(2) - 1', equivalents: ['2ln2-1'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $n=2^N$, $\Delta x=\frac{1}{2^N}$, $x_k=1+\frac{k}{2^N}$으로 읽으면 $\displaystyle\int_1^2\ln x\,dx=2\ln2-1$.
    steps:
    - {id: 2a, content: '$\displaystyle\lim_{N\to\infty}\sum_{k=1}^{2^N}\frac{1}{2^N}\ln\left(1+\frac{k}{2^N}\right)=\int_1^2\ln x\,dx=2\ln2-1$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 지수 $\frac{1}{2^N}$을 로그 앞으로 내려 보자.
    - $2^N$을 제시문의 $n$으로 보면 $\Delta x$와 $x_k$는 무엇인가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-31.png~card-32.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        주어진 식을 급수의 합 표현으로 바꾸면
        $\displaystyle\lim_{N\to\infty}\sum_{k=1}^{2^N}\ln\left(\frac{2^N+k}{2^N}\right)^{\frac{1}{2^N}}=\lim_{N\to\infty}\sum_{k=1}^{2^N}\frac{1}{2^N}\ln\left(\frac{2^N+k}{2^N}\right)=\lim_{N\to\infty}\sum_{k=1}^{2^N}\frac{1}{2^N}\ln\left(1+\frac{k}{2^N}\right)$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이때 $f(x)=\ln x$, $a=1$, $b=2$, $n=2^N$으로 놓으면 $\Delta x=\dfrac{b-a}{n}=\dfrac{1}{2^N}$, $x_k=a+k\Delta x=1+\dfrac{k}{2^N}$이다. 따라서 정적분과 급수의 합 사이의 관계에 의하여
        $\displaystyle\lim_{N\to\infty}\sum_{k=1}^{2^N}\frac{1}{2^N}\ln\left(1+\frac{k}{2^N}\right)=\lim_{n\to\infty}\sum_{k=1}^{n}f(x_k)\Delta x=\int_1^2f(x)dx=\int_1^2(\ln x)dx$.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $\displaystyle\int_1^2(\ln x)dx=\Big[x\ln x-x\Big]_1^2=(2\ln2-2)-(0-1)=2\ln2-1$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        주어진 극한을 $\displaystyle\lim_{N\to\infty}\sum_{k=1}^{2^N}\frac{1}{2^N}\ln\left(1+\frac{k}{2^N}\right)$ 꼴로 서술했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        정적분과 급수의 합 관계를 이용하여 주어진 식을 $\displaystyle\int_1^2(\ln x)dx$로 나타냈다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        정적분의 값이 $2\ln2-1$임을 보였다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

