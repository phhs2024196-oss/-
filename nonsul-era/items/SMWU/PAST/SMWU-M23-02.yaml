stimuli:
- label: 나
  body: |
    삼각형 $\mathrm{ABC}$에서 $\angle\mathrm{A}$, $\angle\mathrm{B}$, $\angle\mathrm{C}$의 크기를 각각 $A,B,C$라 하고 이들의 대변의 길이를 각각 $a,b,c$라 하자. 삼각형 $\mathrm{ABC}$의 넓이는 밑변이 $a$, 높이가 $h$일 때 $\dfrac12ah$이다. 삼각함수를 이용하여 높이 $h$를 $b$와 $\sin C$로 나타내면 $h=b\sin C$이므로 삼각형 $\mathrm{ABC}$의 넓이는
    $$\frac12ab\sin C\qquad\cdots\cdots\ ①$$
    이다.
    한편 $\sin^2x+\cos^2x=1$과 코사인법칙을 이용하여 $\sin C$를 $a,b,c$로 나타내면 삼각형의 넓이는
    $$\sqrt{\frac{1}{16}(a+b+c)(-a+b+c)(a-b+c)(a+b-c)}$$
    와 같이 나타낼 수 있다. 여기서 $s=\dfrac{a+b+c}{2}$라 두면 위 식은
    $$\sqrt{s(s-a)(s-b)(s-c)}\qquad\cdots\cdots\ ②$$
    이다. 삼각형의 넓이를 구하는 이 식을 '헤론의 공식'이라 한다.
    [그림: 밑변 $\mathrm{CB}$의 길이 $a$, 변 $\mathrm{CA}$의 길이 $b$, 변 $\mathrm{AB}$의 길이 $c$인 삼각형과 꼭짓점 $\mathrm{A}$에서 밑변에 내린 높이 $\mathrm{h}$(직각 표시)]
- label: 다
  body: |
    $n$이 자연수일 때 $n$개의 양수 $x_1,x_2,\cdots,x_n$에 대하여 이들의 산술평균 $\dfrac{x_1+x_2+\ \cdots\ +x_n}{n}$과 기하평균 $(x_1x_2\cdots x_n)^{\frac1n}$은 부등식
    $$\frac{x_1+x_2+\ \cdots\ +x_n}{n}\ge(x_1x_2\cdots x_n)^{\frac1n}$$
    을 만족시키고 등호는 $x_1=x_2=\ \cdots\ =x_n$일 때 성립한다.
- label: 라
  body: |
    둘레의 길이가 일정한 직사각형 중에서 넓이가 최대인 직사각형은 정사각형임을 미분을 사용하지 않고 다음과 같이 보일 수 있다.
    주어진 직사각형의 둘레의 길이를 $L$이라 하고 한 변의 길이를 $x$라 하면 다른 한 변의 길이는 $\dfrac{L-2x}{2}$이다. 이 직사각형의 넓이를 $A(x)$라 하면
    $$A(x)=x\left(\frac{L-2x}{2}\right)=\frac12Lx-x^2=\frac{L^2}{16}-\left(x-\frac L4\right)^2$$
    여기서 $\left(x-\dfrac L4\right)^2\ge0$이므로 $A(x)=\dfrac{L^2}{16}-\left(x-\dfrac L4\right)^2\le\dfrac{L^2}{16}$이다.
    사각형의 넓이는 $\dfrac{L^2}{16}$보다 클 수 없고 $A(x)=\dfrac{L^2}{16}$이기 위한 필요충분조건은 $x=\dfrac L4$이다.
    따라서 둘레의 길이가 일정한 직사각형 중에서 넓이가 최대인 사각형은 정사각형이다.

stem: |
  제시문 <나>-<라>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'
  stem: |
    제시문 <나>에서 식 ①로부터 식 ②를 유도하는 과정을 서술하시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\sin C=\sqrt{1-\cos^2C}$에 코사인법칙을 넣고, $4a^2b^2-(a^2+b^2-c^2)^2$을 제곱의 차로 두 번 인수분해한다.
    steps:
    - {id: 1a, content: '$\frac12ab\sin C=\frac14\sqrt{\{(a+b)^2-c^2\}\{c^2-(a-b)^2\}}=\sqrt{s(s-a)(s-b)(s-c)}$', criteria: ['1.M1', '1.A1']}
    hint_ladder:
    - $\sin C$를 $\cos C$로, $\cos C$를 세 변으로 나타내 보자.
    - 근호 안의 식은 두 제곱의 차 꼴이다.
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-32.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        삼각형 $\mathrm{ABC}$의 넓이를 $A$라 하면 $A=\dfrac12ab\sin C$이다. $\sin^2C+\cos^2C=1$이므로 $\sin C=\sqrt{1-\cos^2C}$이고, 코사인법칙 $c^2=a^2+b^2-2ab\cos C$에서 $\cos C=\dfrac{a^2+b^2-c^2}{2ab}$이므로 $\sin C=\sqrt{1-\left(\dfrac{a^2+b^2-c^2}{2ab}\right)^2}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $A=\dfrac12ab\sqrt{1-\dfrac{(a^2+b^2-c^2)^2}{4a^2b^2}}=\dfrac14\sqrt{4a^2b^2-(a^2+b^2-c^2)^2}$
        $=\dfrac14\sqrt{\{2ab+(a^2+b^2-c^2)\}\{2ab-(a^2+b^2-c^2)\}}=\dfrac14\sqrt{\{(a+b)^2-c^2\}\{c^2-(a-b)^2\}}$
        $=\dfrac14\sqrt{(a+b+c)(a+b-c)(a-b+c)(-a+b+c)}$.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        여기서 $s=\dfrac{a+b+c}{2}$라 두면
        $A=\sqrt{\dfrac{1}{16}(a+b+c)(a+b+c-2c)(a+b+c-2b)(a+b+c-2a)}=\sqrt{s(s-a)(s-b)(s-c)}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: |
        코사인법칙으로 $\cos C=\dfrac{a^2+b^2-c^2}{2ab}$이고 $\sin C=\sqrt{1-\left(\dfrac{a^2+b^2-c^2}{2ab}\right)^2}$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        근호 안의 식을 정리하여 $\dfrac12ab\sin C=\sqrt{s(s-a)(s-b)(s-c)}$임을 보였다.
      depends_on: [1.M1]
      steps: [1b-2, 1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  stem: |
    제시문 <나>-<라>를 이용하여 둘레의 길이가 일정한 삼각형 중에서 넓이가 최대인 삼각형은 어떤 삼각형인지를, 구하는 과정과 함께 설명하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: expression, value: 'a = b = c', equivalents: ['정삼각형'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $(s-a)+(s-b)+(s-c)=s$로 일정하므로 산술-기하평균 부등식에서 곱은 $(s-a)=(s-b)=(s-c)$일 때 최대, 즉 정삼각형.
    steps:
    - {id: 2a, content: '$(s-a)(s-b)(s-c)\le\left(\frac s3\right)^3$, 등호 $\iff a=b=c$', criteria: ['2.M1', '2.R1', '2.A1']}
    hint_ladder:
    - 헤론의 공식에서 둘레가 일정하면 무엇이 일정한가?
    - $(s-a)$, $(s-b)$, $(s-c)$의 합을 계산해 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-32.png~card-33.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        삼각형 $\mathrm{ABC}$의 세 변의 길이를 각각 $a,b,c$라 하고 $s=\dfrac{a+b+c}{2}$라 하자. 삼각형의 넓이를 $A$라 하면 헤론의 공식에 의해 $A=\sqrt{s(s-a)(s-b)(s-c)}$이다. 둘레가 일정하므로 $s$가 일정하고, 따라서 삼각형의 넓이가 최대인 경우는 $(s-a)(s-b)(s-c)$가 최대인 경우이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $s-a=\dfrac{-a+b+c}{2}$, $s-b=\dfrac{a-b+c}{2}$, $s-c=\dfrac{a+b-c}{2}$이고, $a,b,c$는 삼각형의 세 변의 길이이므로 두 변의 길이의 합은 나머지 한 변의 길이보다 크다. 따라서 $(s-a)$, $(s-b)$, $(s-c)$는 모두 양수이다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        제시문 <다>에서 $n=3$인 경우를 생각하면
        $\dfrac{(s-a)+(s-b)+(s-c)}{3}=\dfrac{3s-(a+b+c)}{3}=\dfrac s3\ge\{(s-a)(s-b)(s-c)\}^{1/3}$이 성립한다.
      criteria: ['2.M1']
    - id: 2b-4
      content: |
        즉 $(s-a)(s-b)(s-c)$의 값은 $\left(\dfrac s3\right)^3$보다 클 수 없고 $(s-a)(s-b)(s-c)$가 최댓값을 갖는 것은 $(s-a)=(s-b)=(s-c)$일 때이다. 즉 삼각형의 넓이가 최대인 경우는 삼각형 $\mathrm{ABC}$가 $a=b=c$인 정삼각형일 때이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        제시문 <다>의 산술-기하평균 부등식에서 $n=3$인 경우를 $(s-a)$, $(s-b)$, $(s-c)$에 사용했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-3]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        $(s-a)$, $(s-b)$, $(s-c)$가 모두 양수임을 삼각형의 변의 조건으로 보였다.
      depends_on: []
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: |
        넓이가 최댓값을 갖는 것은 $(s-a)=(s-b)=(s-c)$일 때, 즉 세 변의 길이가 모두 같은 정삼각형일 때임을 설명했다.
      depends_on: [2.M1, 2.R1]
      steps: [2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

