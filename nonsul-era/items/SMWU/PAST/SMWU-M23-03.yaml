intent: |
  주어진 조건을 만족하는 등비수열과 그로부터 만든 수열을 구성할 수 있는지(3-1), 짝수 번째에 처음 엎어진 윷이 나올 확률을 $\sum_{n=1}^{\infty}f_{2n}$으로 나타내고 무한등비급수로 계산하여 $\frac12$보다 작음을 보일 수 있는지(3-2)를 평가한다.
key_idea: |
  $a_n=(-1)^{n-1}$, $b_n=\dfrac{1-a_n}{2}$로 짝수 번째 항만 골라 $\sum b_nf_n=\sum f_{2n}=\dfrac{q}{1+q}<\dfrac12$.
