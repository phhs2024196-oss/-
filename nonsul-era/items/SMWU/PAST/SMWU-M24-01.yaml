    # ③ <1-1> 수학적 귀납법의 의미 이해 ④ <1-1> 귀납법으로 부등식 도출·증명 ⑤ <1-2> 몫의 미분법과 e로 감소 ⑥ <1-2> 감소를 이용해 부등식 증명
