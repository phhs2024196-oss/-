- id: '2'
  # 원문 번호 1-2
  stem: |
    $x\ge3$인 모든 실수에 대하여
    $$\frac{\ln x}{x}>\frac{\ln(x+1)}{x+1}$$
    임을 보이시오. (단, 무리수 $e=2.72$이다.)
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(x)=\dfrac{\ln x}{x}$의 도함수 $\dfrac{1-\ln x}{x^2}$가 $x\ge3>e$에서 음수이므로 $f$는 감소한다.
    steps:
    - {id: 2a, content: '$f^{\prime}(x)=\tfrac{\ln(e/x)}{x^2}<0\ (x\ge3)\Rightarrow f(x)>f(x+1)$', criteria: ['2.M1', '2.R1']}
    hint_ladder:
    - 양변이 같은 함수의 서로 다른 점에서의 값이다.
    - $\dfrac{\ln x}{x}$를 미분해 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-26.png 예시 답안 1-2
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        함수 $f(x)=\dfrac{\ln x}{x}\ (x\ge3)$에서 양변을 $x$에 대하여 미분하면
        $$f^{\prime}(x)=\frac{\frac1x\times x-1\times\ln x}{x^2}=\frac{1-\ln x}{x^2}=\frac{\ln\frac{e}{x}}{x^2}$$
        이다.
      criteria: ['2.M1', '2.M2']
    - id: 2b-2
      content: |
        무리수 $e=2.72$이므로, $x\ge3$일 때 $\dfrac{e}{x}<1$이고, $\ln\dfrac{e}{x}<0$이므로 $f^{\prime}(x)<0$이다. 따라서 $f(x)$는 $x\ge3$에서 감소한다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        $x\ge3$인 모든 실수에 대하여 $f(x)>f(x+1)$이다. 따라서 $\dfrac{\ln x}{x}>\dfrac{\ln(x+1)}{x+1}$이다. ■
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        (기준 ②) 제시문 <가>의 도함수 부호에 의한 증가·감소 판정을 $f(x)=\dfrac{\ln x}{x}$에 적용하려 했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 10
      evidence: |
        (기준 ⑤ 앞부분) 몫의 미분법으로 $f^{\prime}(x)=\dfrac{1-\ln x}{x^2}$를 구했다.
      depends_on: []
      implied_ok: true
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 10
      evidence: |
        (기준 ⑤) $e=2.72<3\le x$를 근거로 $f^{\prime}(x)<0$, 즉 $f$가 $x\ge3$에서 감소함을 밝혔다.
      depends_on: [2.M2]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 20
      evidence: |
        (기준 ⑥) 감소성에서 $f(x)>f(x+1)$을 이끌어 주어진 부등식을 결론지었다.
      depends_on: [2.A1]
      steps: [2b-3]
    deductions: []
