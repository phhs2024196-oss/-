    method_no: 1
    key_idea: 제시문 ㉠의 증명처럼 귀납 가정의 좌변 $(k+1)\ln k$를 빼고 더해 가정을 대입한 뒤 $\dfrac{(k+1)^2}{k}>k+2$를 쓴다.
    steps:
    - {id: 1a, content: '$(k+2)\ln(k+1)>2(k+1)\ln(k+1)-(k+1)\ln k=(k+1)\ln\tfrac{(k+1)^2}{k}>(k+1)\ln(k+2)$', criteria: ['1.M1', '1.R1']}
    hint_ladder:
    - 제시문 ㉠의 귀납 단계와 무엇이 같고 무엇이 다른가?
    - $(k+2)\ln(k+1)$에서 $(k+1)\ln k$를 빼고 더해 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-25.png~card-26.png 예시 답안 1-1
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        먼저 $n=3$일 때를 생각하면, $(\text{좌변})=4\ln3=\ln3^4=\ln81$, $(\text{우변})=3\ln4=\ln4^3=\ln64$이다. 따라서 $n=3$일 때 주어진 부등식이 성립한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $n=k\,(k\ge3)$일 때 주어진 부등식이 성립한다고 가정하면 $(k+1)\ln k>k\ln(k+1)$이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        $n=k+1$일 때를 생각하면,
        $$\begin{aligned}(k+2)\ln(k+1)&=(k+2)\ln(k+1)-(k+1)\ln k+(k+1)\ln k\\&>(k+2)\ln(k+1)-(k+1)\ln k+k\ln(k+1)\\&=2(k+1)\ln(k+1)-(k+1)\ln k\\&=(k+1)\ln\frac{(k+1)^2}{k}=(k+1)\ln\left(k+2+\frac1k\right)\\&>(k+1)\ln(k+2)\end{aligned}$$
      criteria: ['1.M2', '1.R1']
    - id: 1b-4
      content: |
        따라서 $(k+2)\ln(k+1)>(k+1)\ln(k+2)$이므로, $n=k+1$일 때도 성립한다. ■
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
