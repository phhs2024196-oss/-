stimuli:
- label: 가
  body: |
    ● 자연수 $n$에 대한 명제 $p(n)$이 모든 자연수에서 성립한다는 것은 수학적 귀납법을 이용하여 증명할 수 있다. 수학적 귀납법을 이용하여 다음 명제를 증명해 보자.

    ㉠ $n\ge3$인 모든 자연수에 대하여
    $$n\ln n>(n-1)\ln(n+1)$$
    이다.

    먼저 $n=3$일 때를 생각하면,
    $$(\text{좌변})=3\ln3=\ln3^3=\ln27,\ (\text{우변})=2\ln4=\ln4^2=\ln16$$
    이다. 따라서 $n=3$일 때 주어진 부등식이 성립한다.
    $n=k\,(k\ge3)$일 때 주어진 부등식이 성립한다고 가정하면
    $$k\ln k>(k-1)\ln(k+1)$$
    이다. $n=k+1$일 때를 생각하면,
    $$\begin{aligned}(k+1)\ln(k+1)&=(k+1)\ln(k+1)-k\ln k+k\ln k\\&>(k+1)\ln(k+1)-k\ln k+(k-1)\ln(k+1)\\&=2k\ln(k+1)-k\ln k=k\ln\frac{(k+1)^2}{k}=k\ln\left(k+2+\frac1k\right)\\&>k\ln(k+2)\end{aligned}$$
    이다. 따라서 $(k+1)\ln(k+1)>k\ln(k+2)$이므로, $n=k+1$일 때도 성립한다.

    ● 함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능할 때, $(a,b)$의 모든 $x$에 대하여 $f^{\prime}(x)>0$이면 $f(x)$는 $[a,b]$에서 증가하고, $f^{\prime}(x)<0$이면 $f(x)$는 $[a,b]$에서 감소한다.
    $x\ge1$인 모든 실수에 대하여 함수 $f(x)=x\ln x$는 증가함을 보이자. $f(x)$의 도함수는
    $$f^{\prime}(x)=\ln x+x\times\frac1x=\ln x+1$$
    이다. 한편 $x\ge1$일 때, $\ln x+1\ge1>0$이므로 $f^{\prime}(x)>0$이다. 따라서 $f(x)$는 $x\ge1$에서 증가한다.

