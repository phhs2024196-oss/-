stimuli:
- label: 나
  body: |
    함수 $f(x)$에서 $x=a$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\le f(a)$이면 함수 $f(x)$는 $x=a$에서 극대라고 하며, 그때의 함숫값 $f(a)$를 극댓값이라고 한다.
    함수 $f(x)$에서 $x=b$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여 $f(x)\ge f(b)$이면 함수 $f(x)$는 $x=b$에서 극소라고 하며, 그때의 함숫값 $f(b)$를 극솟값이라고 한다. 이때, 극댓값과 극솟값을 통틀어 극값이라고 한다. 함수 $f(x)$가 미분가능할 때, 도함수 $f^{\prime}(x)$의 부호를 이용하여 극값을 판정할 수 있다. 예를 들면, 사차함수 $f(x)=x^4-2x^2$은 도함수가
    $$f^{\prime}(x)=4x(x+1)(x-1)$$
    이므로, $x=0$에서 극대이고, 극댓값은 $f(0)=0$, 그리고 $x=-1$, $x=1$에서 극소이고, 극솟값은
    $$f(-1)=f(1)=-1$$
    이다. 이 경우 함수 $f(x)$의 극값은 $0$과 $-1$이므로 서로 다른 극값의 개수는 $2$이다.
    이제 삼차함수
    $$g(x)=2x^3+3x^2-12x-c$$
    에 대하여, 실수 $c$의 값의 범위가 $-7<c<20$일 때, 함수 $|g(x)|$의 서로 다른 극값의 개수가 $2$가 되게 하는 실수 $c$의 값을 구해 보자. 함수 $g(x)$는 실수 전체의 집합에서 미분가능하고 도함수는
    $$g^{\prime}(x)=6(x+2)(x-1)$$
    이다.
    함수 $g(x)$는 $x=-2$, $x=1$에서 각각 극댓값 $g(-2)=20-c$, 극솟값 $g(1)=-7-c$를 갖는다. 이때, 실수 $c$의 값의 범위가 $-7<c<20$이므로 $g(-2)>0$이고 $g(1)<0$이다.
    이제 함수 $|g(x)|$의 극대와 극소를 조사해 보자. $x=-2$를 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여
    $$|g(x)|\le|g(-2)|$$
    이고, $x=1$을 포함하는 어떤 열린구간에 속하는 모든 $x$에 대하여
    $$|g(x)|\le|g(1)|$$
    이므로, 함수 $|g(x)|$는 $x=-2$에서 극댓값,
    $$|g(-2)|=|20-c|=20-c,$$
    $x=1$에서 극댓값,
    $$|g(1)|=|-7-c|=7+c$$
    를 갖는다. 또한, 함수 $|g(x)|$는 $g(x)=0$을 만족시키는 $x$에서 극솟값을 갖는다.
    한편
    $$|g(-2)|\ne0,\ |g(1)|\ne0$$
    이므로 함수 $|g(x)|$의 서로 다른 극값의 개수가 $2$인 경우는 $|g(-2)|=|g(1)|$밖에 없다. 이때, 이를 만족시키는 실수 $c$의 값은 $\dfrac{13}{2}$이다. <그림 1>과 <그림 2>는 $c=\dfrac{13}{2}$일 때, $y=g(x)$의 그래프와 $y=|g(x)|$의 그래프를 각각 그린 것이다.

    [그림: <그림 1> $c=\frac{13}{2}$일 때 $y=g(x)$의 그래프 — $x=-2$에서 극댓값 $13.5$, $x=1$에서 극솟값 $-13.5$]
    [그림: <그림 2> $c=\frac{13}{2}$일 때 $y=|g(x)|$의 그래프 — $x=-2$, $x=1$에서 극댓값 $13.5$, 세 영점에서 극솟값 $0$]

stem: |
  제시문 <나>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'
  # 원문 번호 2-1
  stem: |
    삼차함수 $g(x)=-4x^3+6x^2+24x+5$와 다항함수 $f(x)$는
    $$\int_0^x\{g^{\prime}(t)+g(t)\}dt=x\,g(x)+f(x)+c\quad\cdots\cdots\quad①$$
    를 만족시킨다. 방정식 $f(x)=0$이 서로 다른 세 실근을 갖도록 하는 실수 $c$의 값을 모두 구하시오.
  points: 50
  depends_on: []
  answer: {kind: set, value: '{8, 13}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 미분하면 $f^{\prime}=(1-x)g^{\prime}$, $f(0)=-c$이므로 $f=h-c$이고, $y=c$가 극댓값 $h(1)=13$ 또는 극솟값 $h(2)=8$을 지날 때 세 실근.
    steps:
    - {id: 1a, content: '$h(-1)=-19$, $h(1)=13$, $h(2)=8\Rightarrow c\in\{8,13\}$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 등식 ①의 양변을 미분하고 $x=0$을 넣어 보자.
    - $f(x)=0$의 실근은 어떤 두 그래프의 교점인가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-26.png~card-27.png 예시 답안 2-1
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 삼차함수 $g(x)$의 도함수 $g^{\prime}(x)=-12(x+1)(x-2)$이다. 그리고 "정적분과 미분의 관계"를 이용하여 주어진 등식 ①을 $x$에 대하여 미분하면
        $$g(x)+g^{\prime}(x)=g(x)+xg^{\prime}(x)+f^{\prime}(x)$$
        이고, 양변을 정리하면
        $$(1-x)g^{\prime}(x)=12(x+1)(x-1)(x-2)=f^{\prime}(x)$$
        이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        한편 등식 ①에서 $x=0$을 대입하면 $f(0)=-c$임을 알 수 있다. 다항함수 $f(x)$의 도함수 $f^{\prime}(x)=12(x+1)(x-1)(x-2)$이므로,
        $$f(x)=3x^4-8x^3-6x^2+24x-c$$
        이다.
      criteria: ['1.M1']
    - id: 1b-3
      content: |
        따라서, 방정식 $f(x)=3x^4-8x^3-6x^2+24x-c=0$의 실근의 개수는 두 함수 $y=3x^4-8x^3-6x^2+24x$, $y=c$의 그래프의 교점의 개수와 같다. $h(x)=3x^4-8x^3-6x^2+24x$라고 하면 $h^{\prime}(x)=f^{\prime}(x)=12(x+1)(x-1)(x-2)$이므로 $h^{\prime}(x)=0$으로부터 $x=-1$, $x=1$, 또는 $x=2$이다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        $h^{\prime}(x)$의 부호를 조사하면 $h(x)$는 $x<-1$에서 감소, $-1<x<1$에서 증가, $1<x<2$에서 감소, $x>2$에서 증가하고 $h(-1)=-19$, $h(1)=13$, $h(2)=8$이다.
        [그림: $y=h(x)$의 그래프와 직선 $y=c$ — $x=-1$에서 극소 $-19$, $x=1$에서 극대 $13$, $x=2$에서 극소 $8$]
      criteria: ['1.M2']
    - id: 1b-5
      content: |
        따라서 주어진 방정식이 서로 다른 세 실근을 갖기 위한 실수 $c=h(2)=8$ 또는 $c=h(1)=13$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    # 원문 채점 기준(2-1, 2-2 공통 6가지): ① 제시문 <나> 핵심 파악 ② 제시문 과정 적용·설명
    # ③ <2-1> 정적분과 미분의 관계·도함수로 f(x)의 그래프 개형 도출 ④ <2-1> 방정식의 서로 다른 실근의 개수
    # ⑤ <2-2> |f(x)|의 극대와 극소 도출 ⑥ <2-2> 서로 다른 극값 개수 3이 되는 c. 1~9등급제. ①은 2-1, ②는 2-2 에 편의상 배정.
    criteria:
    - id: 1.M1
      mark_type: M
      points: 20
      evidence: |
        (기준 ③) ①을 미분해 $f^{\prime}(x)=(1-x)g^{\prime}(x)=12(x+1)(x-1)(x-2)$를 얻고 $f(0)=-c$로 $f(x)=3x^4-8x^3-6x^2+24x-c$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1b-2]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ①) 증감을 조사해 극값 $h(-1)=-19$, $h(1)=13$, $h(2)=8$과 그래프 개형을 제시했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3, 1b-4]
    - id: 1.A1
      mark_type: A
      points: 15
      evidence: |
        (기준 ④) 서로 다른 세 실근이 되는 $c=8$, $c=13$을 모두 구했다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  # 원문 번호 2-2
  stem: |
    다항함수 $f(x)$는 문제 2-1의 ①을 만족시킨다. 이때, $-19<c<8$인 실수 $c$에 대하여 $|f(x)|$의 서로 다른 극값의 개수가 $3$이 되게 하는 실수 $c$의 값을 모두 구하시오.
  points: 50
  depends_on: ['1']
  answer: {kind: set, value: '{-11/2, -3}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $|f|$의 극값 후보는 $0$, $19+c$, $13-c$, $8-c$이고 $13-c\ne8-c$이므로 $19+c$가 둘 중 하나와 같아야 한다.
    steps:
    - {id: 2a, content: '$19+c=8-c\Rightarrow c=-\tfrac{11}{2}$, $19+c=13-c\Rightarrow c=-3$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $-19<c<8$에서 $f(-1)$, $f(1)$, $f(2)$의 부호는?
    - $|f(x)|$의 극값은 몇 종류가 후보인가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-27.png 예시 답안 2-2
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        문제 2-1의 풀이로부터 함수 $f(x)=3x^4-8x^3-6x^2+24x-c$는 $x=-1,1,2$에서 극값을 가지며 각각의 극값은 $f(-1)=-19-c$, $f(1)=13-c$, $f(2)=8-c$이다. 이때, 실수 $c$의 값의 범위가 $-19<c<8$이므로 부등식
        $$f(-1)<0<f(2)<f(1)$$
        을 만족시킨다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        또한, 함수 $|f(x)|$는 $f(x)=0$을 만족시키는 $x$에서 극솟값을 갖는다. 따라서 실수 $c$의 값에 따라 함수 $|f(x)|$의 서로 다른 극값의 개수가 $3$이 되게 하는 경우는 2가지 밖에 없다.
        [그림: $c=-\frac{11}{2}$일 때와 $c=-3$일 때 $y=|f(x)|$의 그래프]
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        경우 1. $|f(-1)|=f(2)$: 이 경우에는 함수 $f(x)$의 가장 작은 극솟값인 $f(-1)$의 절댓값이 함수 $f(x)$의 두 번째로 작은 극솟값인 $f(2)$와 같아진다. 이때, $|f(-1)|=f(2)$를 만족시키는 실수 $c=-\dfrac{11}{2}$이다.
      criteria: ['2.A1']
    - id: 2b-4
      content: |
        경우 2. $|f(-1)|=f(1)$: 이 경우에는 함수 $f(x)$의 가장 작은 극솟값인 $f(-1)$의 절댓값이 함수 $f(x)$의 극댓값인 $f(1)$과 같아진다. 이때, $|f(-1)|=f(1)$을 만족시키는 실수 $c=-3$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 10
      evidence: |
        (기준 ②) 제시문 <나>의 방법대로 $f(-1)=-19-c$, $f(1)=13-c$, $f(2)=8-c$의 부호 $f(-1)<0<f(2)<f(1)$을 밝혔다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M1], max_points: 10}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 20
      evidence: |
        (기준 ⑤) $|f(x)|$가 $x=-1,1,2$에서 극값 $|f(-1)|$, $f(1)$, $f(2)$를, $f(x)=0$인 점에서 극솟값 $0$을 가짐을 밝혔다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
