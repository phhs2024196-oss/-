stimuli:
- label: 다
  body: |
    ㉡ 주머니1, 주머니2, $\cdots$ , 주머니10에는 각각 동전들이 $2^{10}$개 들어 있다. 동전들은 진짜 동전과 가짜 동전으로 구분되며, 진짜 동전들의 무게는 모두 같고, 가짜 동전의 무게는 진짜 동전의 무게보다 1그램이 작다. 각 주머니의 동전들은 모두 진짜이거나 모두 가짜이고, 이 중 모두 가짜 동전들이 들어 있는 주머니는 1개 이상이다.

    각각의 주머니$k$에서 $k$개, 즉, 주머니1에서 1개, 주머니2에서 2개, $\cdots$ , 주머니10에서 10개의 동전을 꺼내, 그 꺼낸 동전들 $1+2+\cdots+10=55$개의 무게를 재었을 때, 그 무게의 합이 55개 동전 모두가 진짜일 때의 합보다 5그램이 작다고 하자. 이때, $5=1+4=2+3$이므로 가짜 동전들이 들어 있는 주머니들의 가능한 경우는 다음의 3가지이다.
    주머니5, 주머니1과 주머니4, 주머니2와 주머니3.

    ㉢ 집합 $B=\{b_1,b_2,\cdots,b_n\}$의 모든 원소는 서로 다른 자연수이고 $b_1<b_2<\cdots<b_n$이면
    $$1\le b_1,\ 2\le b_2,\ \cdots,\ n\le b_n$$
    이다. 즉, 집합 $B$의 원소의 개수 $n$은 집합 $B$의 원소 중 가장 큰 자연수 $b_n$보다 작거나 같다.

    집합 $A_{10}=\{a_1,a_2,\cdots,a_{10}\}$의 모든 원소는 서로 다른 자연수이고, 집합 $A_{10}$의 공집합이 아닌 서로 다른 모든 부분집합의 개수는 $2^{10}-1$이다. 이러한 $2^{10}-1$개의 부분집합들은 각각 원소의 합이 서로 다르다고 하자. 이때,
    $$a_1+a_2+\cdots+a_{10}\ge2^{10}-1=1023\quad\cdots\cdots\quad(1)$$
    임을 증명할 수 있다. 집합 $A_{10}$의 원소 중 가장 큰 자연수를 $x$라고 하면
    $$a_1+a_2+\cdots+a_{10}\le x+(x-1)+(x-2)+\cdots+(x-8)+(x-9)=10x-45$$
    이고 (1)에 의해 $x\ge\dfrac{1}{10}(2^{10}+44)=106.8$이다. 집합 $A_{10}$의 예로는 집합
    $$\{1,2,2^2,2^3,\cdots,2^9\},\ \{2^{10}+1,2^{10}+2,2^{10}+2^2,2^{10}+2^3,\cdots,2^{10}+2^9\}$$
    등이 있다.

stem: |
  제시문 <다>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'
  # 원문 번호 3-1
  stem: |
    ㉡에 있는 각각의 주머니$k$에서 $2^{k-1}$개의 동전을 꺼내, 그 꺼낸 모든 동전들의 무게를 쟀을 때, 그 무게의 합이 꺼낸 동전 모두가 진짜일 때의 합보다 $2^4+2^5+2^8$그램이 작다면, 가짜 동전들이 들어 있는 주머니들은 무엇인가? 가능한 주머니들의 경우를 찾으시오. 또한 부등식 (1)에서 등호가 성립할 때, 제시문 <다>에서 주어진 집합 $A_{10}$의 한 예를 찾으시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'pouches={5,6,9}; A10={1,2,4,8,16,32,64,128,256,512}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 주머니 $k$에서 $2^{k-1}$개이므로 부족한 무게는 가짜 주머니 집합에 대한 $2^{k-1}$들의 합이고, 이진 표현은 유일하다.
    steps:
    - {id: 1a, content: '$2^4+2^5+2^8=2^{5-1}+2^{6-1}+2^{9-1}$ → 주머니5, 6, 9; $A_{10}=\{1,2,\cdots,2^9\}$', criteria: ['1.M1', '1.R1', '1.A1']}
    hint_ladder:
    - 주머니 $k$가 가짜면 무게가 몇 그램 줄어드는가?
    - $\{1,2,2^2,\cdots,2^9\}$의 부분집합의 합은 서로 다른가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-27.png~card-28.png 예시 답안 3-1
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        ㉡에 있는 주머니5, 주머니6, 주머니9가 가짜 동전들이 들어 있는 주머니이고 나머지 주머니에는 진짜 동전들이 들어 있다면, 각각의 주머니$k$에서 $2^{k-1}$개의 동전을 꺼내, 그 꺼낸 동전들의 무게를 쟀을 때, 그 무게의 합이 꺼낸 동전 모두가 진짜일 때의 합보다 $2^4+2^5+2^8$그램이 작다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        한편, 집합 $\{1,2,2^2,2^3,\cdots,2^9\}$의 부분집합 $\{2^4,2^5,2^8\}$의 원소들의 합이 $2^4+2^5+2^8$이고, 집합 $\{1,2,2^2,2^3,\cdots,2^9\}$의 공집합이 아닌 각각의 부분집합의 원소의 합은 서로 다르므로, 원소들의 합이 $2^4+2^5+2^8$인 부분집합은 $\{2^4,2^5,2^8\}$이 유일하다. 따라서, 가짜 동전들이 들어 있는 가능한 주머니들의 경우는 주머니5, 주머니6, 주머니9가 유일하다.
      criteria: ['1.R1']
    - id: 1b-3
      content: |
        집합 $\{1,2,2^2,2^3,\cdots,2^9\}$의 원소의 합은 $1+2+2^2+2^3+\cdots+2^9=2^{10}-1$이고 이 합은 부등식 (1)의 우변과 같다. 집합 $\{1,2,2^2,2^3,\cdots,2^9\}$의 공집합을 제외한 모든 부분집합은 원소의 합이 다르므로, 부등식 (1)에서 등호가 성립할 때의 가능한 집합 $A_{10}$은 집합 $\{1,2,2^2,2^3,\cdots,2^9\}$이 있다.
      criteria: ['1.A1']
