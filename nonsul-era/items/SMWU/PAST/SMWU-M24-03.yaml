- id: '2'
  # 원문 번호 3-2
  stem: |
    제시문 <다>에서 주어진 집합 $A_{10}$의 공집합이 아닌 서로 다른 모든 부분집합 $C_1,C_2,\cdots,C_N$의 개수는 $N=2^{10}-1$이다. $1\le k\le N$인 자연수 $k$에 대하여, $S(C_k)$를 집합 $C_k$의 모든 원소들의 합이라고 할 때, 집합
    $$C=\{S(C_1),S(C_2),\cdots,S(C_N)\}$$
    의 서로 다른 원소의 개수를 구하고, 이 개수와 ㉢을 이용하여 부등식 (1)을 보이시오. 또한 모든 원소가 서로 다른 10개의 자연수인 집합 중, 다음을 만족시키는 집합이 존재하는지를 판단하시오.

    ⓐ 집합의 원소 중, 가장 큰 자연수가 $104$이다.
    ⓑ 공집합이 아닌 서로 다른 모든 부분집합의 원소의 합이 서로 다르다.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'count=2**10-1; exists=False', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $C$는 서로 다른 자연수 $2^{10}-1$개, 최댓값 $a_1+\cdots+a_{10}$이므로 ㉢에서 (1); 그러면 최대 원소 $x\ge106.8$이라 $104$는 불가.
    steps:
    - {id: 2a, content: '$|C|=2^{10}-1\le\max C=\sum a_i$; $10\cdot104-45=995<1023$이므로 존재하지 않음', criteria: ['2.M1', '2.R1', '2.A1']}
    hint_ladder:
    - $C$의 원소들은 서로 다른가? 가장 큰 원소는?
    - 최대 원소가 104이면 원소의 합은 최대 얼마인가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-28.png 예시 답안 3-2
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $1\le k\le N$인 자연수 $k$에 대하여, $S(C_k)$를 집합 $C_k$의 모든 원소들의 합이라 하고, 집합 $C=\{S(C_1),S(C_2),\cdots,S(C_N)\}$을 생각하자. 집합 $A_{10}$의 공집합이 아닌 서로 다른 모든 부분집합의 원소의 합은 서로 다르므로 각각의 $S(C_k)$의 값은 모두 다르다. 따라서 집합 $C$의 원소의 개수는 "집합 $A_{10}$의 공집합이 아닌 서로 다른 모든 부분집합 $C_1,C_2,\cdots,C_N$의 개수"와 같으므로 $N=2^{10}-1$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        한편, 집합 $C$의 원소 중에서 가장 큰 원소는 $a_1+a_2+\cdots+a_{10}$이므로, ㉢에 의해 집합 $C$의 원소의 개수 $2^{10}-1$은 집합 $C$의 원소 중 가장 큰 자연수 $a_1+a_2+\cdots+a_{10}$보다 작거나 같다. 즉,
        $$a_1+a_2+\cdots+a_{10}\ge2^{10}-1$$
        이다.
      criteria: ['2.R1']
    - id: 2b-3
      content: |
        제시문에 의하면 집합 $A_{10}$의 원소 중 가장 큰 자연수 $x$는 $107$보다 크거나 같다. 따라서, 서로 다른 $10$개의 자연수를 원소로 가진 집합 중, 가장 큰 원소가 $104$이고 공집합이 아닌 모든 부분집합의 원소의 합이 다른 집합은 존재하지 않는다.
      criteria: ['2.A1']
