stimuli:
- label: 다
  body: |
    이차함수 $y=ax^2+bx+c$의 그래프와 직선 $y=mx+n$의 교점의 $x$좌표는 방정식
    $ax^2+bx+c=mx+n$, 즉
    $$ax^2+(b-m)x+c-n=0\ \cdots\cdots\ ①$$
    의 실근과 같다. 따라서 이차함수 $y=ax^2+bx+c$의 그래프와 직선 $y=mx+n$의 위치 관계는 이차방정식 ①의 판별식
    $$D=(b-m)^2-4a(c-n)$$
    의 값의 부호에 따라 다음과 같다.
    (1) $D>0$이면 서로 다른 두 점에서 만난다.
    (2) $D=0$이면 한 점에서 만난다. (접한다.)
    (3) $D<0$이면 만나지 않는다.

stem: |
  제시문 <다>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'   # 원문 2-1
  stem: |
    두 이차함수 $y=x^2$과 $y=x^2-x$의 그래프에 동시에 접하는 직선의 방정식을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'y = -x/2 - 1/16', equivalents: ['y = -1/2*x - 1/16'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 판별식 $m^2+4n=0$, $(m+1)^2+4n=0$을 빼면 $m=-\tfrac12$.
    steps:
    - {id: 1a, content: '$m=-\tfrac12$, $n=-\tfrac1{16}$', criteria: ['1.M1', '1.M2', '1.A1']}
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-22.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 이차함수의 그래프에 동시에 접하는 직선의 방정식을 $y=mx+n$이라 하면, 두 이차방정식 $x^2=mx+n$과 $x^2-x=mx+n$은 각각 중근을 갖는다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 판별식을 이용하면
        $$m^2+4n=0,\quad (m+1)^2+4n=0$$
        이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        이 연립방정식을 풀면 $m=-\dfrac12$, $n=-\dfrac{1}{16}$이다. 따라서 두 이차함수의 그래프에 동시에 접하는 직선의 방정식은 $y=-\dfrac12x-\dfrac{1}{16}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ①) <2-1>에서 이차함수의 그래프와 직선의 위치관계를 정확히 이해한다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ②) 이차함수의 그래프와 직선이 접하는 조건을 이용하여 연립방정식을 세운다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ③) 연립이차방정식을 풀어 공통접선 $y=-\dfrac12x-\dfrac1{16}$을 바르게 구한다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 2-2
  stem: |
    두 이차함수 $y=-x^2-2$과 $y=x^2-2ax+a^2+a$의 그래프에 동시에 접하는 직선이 두 개 존재하고 서로 수직으로 만날 때, 실수 $a$의 값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: value, value: '-3/2', equivalents: ['-1.5'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 두 판별식을 더해 $m^2+2am-2a-4=0$을 얻고, 두 근의 곱 $-2a-4=-1$.
    steps:
    - {id: 2a, content: '$-2a-4=-1\Rightarrow a=-\tfrac32$', criteria: ['2.M1', '2.M2', '2.A1']}
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-23.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 이차함수의 그래프에 동시에 접하는 직선의 방정식을 $y=mx+n$이라 하면, 두 이차방정식 $-x^2-2=mx+n$과 $x^2-2ax+a^2+a=mx+n$은 각각 중근을 갖는다. 따라서 판별식을 이용하면
        $$m^2-4(n+2)=0,\quad (m+2a)^2-4(-n+a^2+a)=0$$
        이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        두 식을 더하여 $n$을 소거하면
        $$m^2+(m+2a)^2-4(a^2+a+2)=2m^2+4am-4a-8=0,$$
        즉 $m^2+2am-2a-4=0\ \cdots\cdots\ ①$이다.
        방정식 ①의 판별식은 $\dfrac{D}{4}=a^2+2a+4=(a+1)^2+3>0$이므로 모든 실수 $a$에 대하여 서로 다른 두 실근을 갖는다. $n$의 값은 $m$에 의하여 결정되므로 두 이차함수의 그래프에 동시에 접하는 직선이 두 개 존재한다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        방정식 ①의 두 근이 각각 두 직선의 기울기이므로, 두 직선이 서로 수직으로 만난다면 두 근의 곱이 $-1$이다. 따라서 근과 계수와의 관계에 의하여 $-2a-4=-1$이고, 따라서 $a=-\dfrac32$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ④) <2-2>에서 이차함수의 그래프와 직선의 위치관계를 이해하고 연립이차방정식을 구한다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ⑤) 연립방정식을 풀어 동시에 접하는 직선이 두 개 존재함을 확인한다($\tfrac D4=(a+1)^2+3>0$).
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ⑥) 두 직선이 수직으로 만날 조건을 이용하여 $a=-\dfrac32$를 바르게 구한다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

