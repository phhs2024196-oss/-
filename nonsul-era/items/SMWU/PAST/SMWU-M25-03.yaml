stimuli:
- label: 라
  body: |
    임의의 실수 $a$, $b$를 포함하는 구간에서 연속인 함수 $f(x)$의 한 부정적분을 $F(x)$라고 하면
    $$\int_a^b f(x)dx=\Big[F(x)\Big]_a^b=F(b)-F(a)$$
    이다.
- label: 마
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$와 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때 $x=g(t)$의 도함수 $g'(t)$가 $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^b f(x)dx=\int_\alpha^\beta f(g(t))g'(t)dt$$
    이다.

stem: |
  제시문 <라>와 <마>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'   # 원문 3-1
  stem: |
    함수 $f(x)=\dfrac12+\left(x-\dfrac12\right)^5\cos(2\pi x)$에 대하여, 정적분
    $$\int_0^1 f(x)dx$$
    의 값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: value, value: '1/2', equivalents: ['0.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t=x-\tfrac12$로 치환하면 피적분함수의 두 번째 항은 $[-\tfrac12,\tfrac12]$에서 기함수이다.
    steps:
    - {id: 1a, content: '$\int_0^1 f=\tfrac12-\int_{-1/2}^{1/2}t^5\cos(2\pi t)dt=\tfrac12$', criteria: ['1.M1', '1.M2', '1.A1']}
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-23.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        정적분 $\displaystyle\int_0^1\left\{\frac12+\left(x-\frac12\right)^5\cos(2\pi x)\right\}dx$에서 $x-\dfrac12=t$로 놓으면 $\dfrac{dx}{dt}=1$이고 $0-\dfrac12=-\dfrac12$, $1-\dfrac12=\dfrac12$이므로
        $$\int_0^1\left\{\frac12+\left(x-\frac12\right)^5\cos(2\pi x)\right\}dx=\int_{-\frac12}^{\frac12}\left\{\frac12+t^5\cos\left(2\pi\left(t+\frac12\right)\right)\right\}dt=\frac12-\int_{-\frac12}^{\frac12}t^5\cos(2\pi t)dt$$
        이다.
      criteria: ['1.M1', '1.M2']
    - id: 1b-2
      content: |
        $g(t)=t^5\cos(2\pi t)$라 하면 $g(-t)=-g(t)$이므로 $\displaystyle\int_{-\frac12}^{\frac12}t^5\cos(2\pi t)dt=0$이다. 따라서 $\displaystyle\int_0^1 f(x)dx=\frac12$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ①, <3-1>·<3-2> 공통) 치환적분법의 활용을 정확히 이해한다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ②) <3-1>에서 삼각함수의 성질($\cos(2\pi t+\pi)=-\cos 2\pi t$)을 파악한다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ③) 기함수의 정적분을 정확히 구해 $\dfrac12$을 얻는다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 3-2
  stem: |
    실수 전체에서 연속인 함수 $f(x)$가 상수 $c$에 대하여
    $$f(x)+f(c-x)=c$$
    를 만족시킨다. $\displaystyle\int_0^c f(x)dx=2$일 때, 상수 $c$의 값을 모두 구하시오.
  points: 50
  depends_on: []
  answer: {kind: set, value: '{-2, 2}', equivalents: ['c = 2 or c = -2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 양변을 $0$부터 $c$까지 적분하고 $t=c-x$로 치환하면 $2\int_0^c f=c^2$.
    steps:
    - {id: 2a, content: '$\tfrac12c^2=2\Rightarrow c=\pm2$', criteria: ['2.M1', '2.M2', '2.A1']}
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-23.png, card-24.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        함수 $f(x)$의 성질에 의하여
        $$\int_0^c\{f(x)+f(c-x)\}dx=c^2\ \cdots\cdots\ ②$$
        이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $c-x=t$라 하면 $\dfrac{dx}{dt}=-1$이고 $c-0=c$, $c-c=0$이므로 $\displaystyle\int_0^c f(c-x)dx=\int_0^c f(t)dt$이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        ②에서 정적분의 성질을 이용하면
        $$\int_0^c\{f(x)+f(c-x)\}dx=\int_0^c f(x)dx+\int_0^c f(c-x)dx=2\int_0^c f(t)dt=c^2$$
        이므로 $\displaystyle\int_0^c f(x)dx=\frac12c^2$이다. 따라서 $\displaystyle\int_0^c f(x)dx=2$를 만족시키는 실수 $c$의 값은 $c=\pm2$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ④) <3-2>에서 $f(x)+f(c-x)=c$의 의미를 정확히 이해하고 활용한다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ⑤) 치환적분법을 적용하여 정적분의 값을 구한다($\int_0^c f(c-x)dx=\int_0^c f(t)dt$).
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ⑥) 실수 $c$의 값 $c=\pm2$를 정확히 구한다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

