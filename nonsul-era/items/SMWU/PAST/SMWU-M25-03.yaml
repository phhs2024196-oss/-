intent: |
  치환적분으로 적분 구간을 대칭 구간으로 옮겨 기함수의 정적분이 $0$임을 이용하고, 함수방정식 $f(x)+f(c-x)=c$를 치환적분과 결합해 정적분의 값을 구하는 능력을 본다.
key_idea: |
  (3-1) $t=x-\tfrac12$로 치환하면 $t^5\cos(2\pi t)$ 꼴의 기함수가 남는다. (3-2) $\int_0^c f(c-x)dx=\int_0^c f(t)dt$이므로 $2\int_0^c f=c^2$.
stuck: |
