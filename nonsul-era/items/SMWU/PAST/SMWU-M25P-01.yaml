stimuli:
- label: 가
  body: |
    세 집합 $X$, $Y$, $Z$에 대하여 두 함수
    $$f:X\to Y,\ g:Y\to Z$$
    가 주어질 때, 집합 $X$의 각 원소 $x$에 대하여 $f(x)$는 집합 $Y$의 원소이고, 집합 $Y$의 원소 $f(x)$에 대하여 $g(f(x))$는 집합 $Z$의 원소이다. 따라서 집합 $X$의 각 원소 $x$에 집합 $Z$의 원소 $g(f(x))$를 대응시키면 $X$를 정의역, $Z$를 공역으로 하는 새로운 함수를 정의할 수 있다.
    이 새로운 함수를 $f$와 $g$의 합성함수라 하며, 이것을 기호로
    $$g\circ f:X\to Z$$
    와 같이 나타낸다.
    또 합성함수 $g\circ f:X\to Z$에 대하여 $x$에서의 함숫값을 기호로
    $$(g\circ f)(x)$$
    와 같이 나타낸다. 이때 $X$의 임의의 원소 $x$에 $Z$의 원소 $g(f(x))$가 대응하므로
    $$(g\circ f)(x)=g(f(x))$$
    이다. 따라서 $f$와 $g$의 합성함수를
    $$y=g(f(x))$$
    와 같이 나타낼 수도 있다.
- label: 나
  body: |
    방정식 $f(x)=g(x)$의 실근은 두 함수 $y=f(x)$와 $y=g(x)$의 그래프의 교점의 $x$좌표와 같다. 따라서 방정식 $f(x)=g(x)$의 서로 다른 실근의 개수는 두 함수 $y=f(x)$와 $y=g(x)$의 그래프의 교점의 개수를 조사하여 구할 수 있다.

stem: |
  제시문 <가>와 <나>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'   # 원문 1-1
  stem: |
    이차함수 $f(x)=a(x+2)(x-3)$에 대하여 방정식 $f(f(x))=0$의 서로 다른 실근의 개수가 $3$일 때, 실수 $a$의 값을 구하시오. (단, $a>0$)
  points: 50
  depends_on: []
  answer: {kind: value, value: '8/25', equivalents: ['0.32'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f(f(x))=0\iff f(x)=3$ 또는 $f(x)=-2$. $f(x)=3$은 항상 두 근이므로 $f(x)=-2$가 중근이어야 하고, 최솟값 $f(\tfrac12)=-\tfrac{25}{4}a=-2$.
    steps:
    - {id: 1a, content: '$-\tfrac{25}{4}a=-2\Rightarrow a=\tfrac{8}{25}$', criteria: ['1.M1', '1.M2', '1.A1']}
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-30.png, card-31.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a>0$일 때 $f(f(x))=0$이기 위해서는, $f(x)=3$ 또는 $f(x)=-2$이다.
        또, $a>0$이고 $f'(x)=a(2x-1)=0$이므로, $x=\dfrac12$에서 $f(x)$는 최솟값을 가진다.
      criteria: ['1.M1', '1.M2']
    - id: 1b-2
      content: |
        (1) $f(x)=3$이면 $f(x)=a(x+2)(x-3)=3$이다.
        $f\left(\dfrac12\right)=a\left(\dfrac12+2\right)\left(\dfrac12-3\right)=-\dfrac{25}{4}a<0$이므로 방정식 $f(x)=3$은 항상 서로 다른 두 실근을 갖는다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        (2) $f(x)=-2$이면 $f(x)=a(x+2)(x-3)=-2$이다. $f(f(x))=0$의 서로 다른 실근의 개수가 $3$이고, $f(x)=3$은 항상 서로 다른 두 실근을 가지므로, 방정식 $f(x)=-2$는 오직 하나의 실근을 가져야 한다.
        그러기 위해서는 $f\left(\dfrac12\right)=-\dfrac{25}{4}a=-2$이어야 하므로 $a=\dfrac{8}{25}$이다.
        따라서 $a=\dfrac{8}{25}$이다.
      criteria: ['1.A1']
  - id: S1-ALT
    audience: ALT
    source_flow: 문항카드 card-31.png 별해
    method_no: 2
    key_idea: 판별식으로 두 방정식의 근의 개수를 판정한다.
    steps:
    - id: 1c-1
      content: |
        $f(x)=a(x+2)(x-3)=3$을 정리하면 $ax^2-ax-6a-3=0$이고 판별식은 $D=a^2+4a(6a+3)=25a^2+12a>0$이므로 방정식 $f(x)=3$은 항상 서로 다른 두 실근을 갖는다.
      criteria: ['1.M2']
    - id: 1c-2
      content: |
        $f(x)=a(x+2)(x-3)=-2$를 정리하면 $ax^2-ax-6a+2=0$이다. 방정식 $f(x)=-2$는 오직 하나의 실근을 가져야 하므로 판별식은 $D=a^2+4a(6a-2)=25a^2-8a=0$이다. 따라서 $a=\dfrac{8}{25}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ①, <1-1>·<1-2> 공통) 합성함수의 의미를 정확히 이해한다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ②) <1-1>에서 $f(f(x))=0$인 조건($f(x)=3$ 또는 $f(x)=-2$)을 파악한다.
      depends_on: []
      implied_ok: false
      steps: [1b-1, 1c-1]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ③) 합성함수의 정의를 이용해 주어진 방정식이 서로 다른 세 실근을 가질 조건을 구한다($a=\dfrac{8}{25}$).
      depends_on: [1.M2]
      steps: [1b-2, 1b-3, 1c-2]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 1-2
  stem: |
    함수 $f(x)=a\sin x\,(0\le x\le\pi)$에 대하여 방정식 $f(f(x))=0$의 서로 다른 실근의 개수가 $4$일 때, 실수 $a$의 범위를 구하시오. (단, $a>0$)
  points: 50
  depends_on: []
  answer: {kind: set, value: 'Interval.open(pi, 2*pi)', equivalents: ['pi < a < 2*pi'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(f(x))=0\iff f(x)=n\pi$. $f(x)=0$은 두 근, 최댓값 $a$와 $\pi$, $2\pi$를 비교한다.
    steps:
    - {id: 2a, content: '$f(x)=\pi$가 두 근($a>\pi$), $f(x)=2\pi$가 근 없음($a<2\pi$) $\Rightarrow \pi<a<2\pi$', criteria: ['2.M1', '2.M2', '2.A1']}
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-31.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a>0$일 때 $f(f(x))=0$이기 위해서는, $f(x)=n\pi\,(n=0,1,2,3,\cdots)$이다.
        또, $a>0$이고 $f'(x)=a\cos x=0$이므로, $x=\dfrac{\pi}{2}$에서 $f(x)$는 최댓값을 가진다.
      criteria: ['2.M1', '2.M2']
    - id: 2b-2
      content: |
        (1) 방정식 $f(x)=0$의 실근은 $x=0$ 또는 $x=\pi$이다. 따라서 방정식 $f(x)=0$은 항상 서로 다른 두 실근을 갖는다.
        (2) 방정식 $f(x)=\pi$가 서로 다른 두 실근을 갖기 위한 조건은 $f\left(\dfrac{\pi}{2}\right)=a\sin\dfrac{\pi}{2}=a>\pi$이다. 또한 방정식 $f(x)=\pi$는 $a=\pi$일 때 한 실근을 갖는다.
        (3) 방정식 $f(x)=2\pi$가 실근을 갖지 않을 조건은 $f\left(\dfrac{\pi}{2}\right)=a\sin\dfrac{\pi}{2}=a<2\pi$이다. 또한 방정식 $f(x)=2\pi$는 $a=2\pi$일 때 한 실근을 갖는다.
        [그림: $0\le x\le\pi$에서 $y=f(x)$의 그래프와 수평선 $y=\pi$, $y=2\pi$]
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $a=\pi$일 때 서로 다른 세 실근을 갖고, $a=2\pi$일 때는 서로 다른 다섯 실근을 갖는다. 따라서 서로 다른 네 실근을 갖기 위한 $a$의 범위는 $\pi<a<2\pi$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ④) <1-2>에서 $f(f(x))=0$인 조건($f(x)=n\pi$)을 파악한다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ⑤) <1-2>에서 삼각함수의 합성을 정확히 이해한다(최댓값 $a$와 $\pi$, $2\pi$ 비교).
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ⑥) 주어진 방정식이 서로 다른 네 실근을 가질 조건 $\pi<a<2\pi$를 구한다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

