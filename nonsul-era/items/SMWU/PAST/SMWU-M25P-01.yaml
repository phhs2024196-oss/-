intent: |
  합성함수의 정의를 이용해 방정식 $f(f(x))=0$을 「$f(x)=$($f$의 근)」 꼴의 방정식들로 바꾸고, 각 방정식의 실근의 개수를 그래프(최솟값·최댓값)로 따져 조건을 만족시키는 $a$를 구하는 능력을 본다.
key_idea: |
