stimuli:
- label: 다
  body: |
    이차함수 $y=ax^2+bx+c$의 그래프와 직선 $y=mx+n$의 교점의 $x$좌표는 방정식
    $ax^2+bx+c=mx+n$, 즉
    $$ax^2+(b-m)x+c-n=0\ \cdots\cdots\ ①$$
    의 실근과 같다. 따라서 이차함수 $y=ax^2+bx+c$의 그래프와 직선 $y=mx+n$의 위치 관계는 이차방정식 ①의 판별식
    $$D=(b-m)^2-4a(c-n)$$
    의 값의 부호에 따라 다음과 같다.
    (1) $D>0$이면 서로 다른 두 점에서 만난다.
    (2) $D=0$이면 한 점에서 만난다. (접한다.)
    (3) $D<0$이면 만나지 않는다.

stem: |
  제시문 <다>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'   # 원문 2-1
  stem: |
    두 이차함수 $y=-x^2-2$과 $y=x^2-2ax+a^2+a$의 그래프에 동시에 접하는 직선이 두 개 존재하고 서로 수직으로 만날 때, 실수 $a$의 값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: value, value: '-3/2', equivalents: ['-1.5'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 판별식을 더해 $m^2+2am-2a-4=0$을 얻고, 두 근의 곱 $-2a-4=-1$.
    steps:
    - {id: 1a, content: '$-2a-4=-1\Rightarrow a=-\tfrac32$', criteria: ['1.M1', '1.M2', '1.A1']}
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-31.png, card-32.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 이차함수의 그래프에 동시에 접하는 직선의 방정식을 $y=mx+n$이라 하면, 두 이차방정식 $-x^2-2=mx+n$과 $x^2-2ax+a^2+a=mx+n$은 각각 중근을 갖는다. 따라서 판별식을 이용하면
        $$m^2-4(n+2)=0,\quad (m+2a)^2-4(-n+a^2+a)=0$$
        이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        두 식을 더하여 $n$을 소거하면
        $$m^2+(m+2a)^2-4(a^2+a+2)=2m^2+4am-4a-8=0,$$
        즉 $m^2+2am-2a-4=0\ \cdots\cdots\ ①$이다.
        방정식 ①의 판별식은 $\dfrac{D}{4}=a^2+2a+4=(a+1)^2+3>0$이므로 모든 실수 $a$에 대하여 서로 다른 두 실근을 갖는다. $n$의 값은 $m$에 의하여 결정되므로 두 이차함수의 그래프에 동시에 접하는 직선이 두 개 존재한다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        방정식 ①의 두 근이 각각 두 직선의 기울기이므로, 두 직선이 서로 수직으로 만난다면 두 근의 곱이 $-1$이다. 따라서 근과 계수와의 관계에 의하여 $-2a-4=-1$이고, 따라서 $a=-\dfrac32$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ①) <2-1>에서 이차함수의 그래프와 직선의 위치관계를 이해하고 연립이차방정식을 구한다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ②) 연립방정식을 풀어 동시에 접하는 직선이 두 개 존재함을 확인한다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ③) 두 직선이 수직으로 만날 조건을 이용하여 $a=-\dfrac32$를 바르게 구한다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 2-2
  stem: |
    두 이차함수 $y=x^2$과 $y=ax^2-ax\,(a>0)$의 그래프에 동시에 접하는 직선의 개수와 두 이차함수의 그래프의 교점의 개수는 서로 같음을 보이시오.
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 교점은 $x((a-1)x-a)=0$, 접선 기울기는 $(1-a)m^2+2am+a^2=0$. 둘 다 $a=1$이면 1개, $a\ne1$이면 2개($\tfrac D4=a^3>0$).
    steps:
    - {id: 2a, content: '$a=1$: 교점 1, 접선 1 / $a\ne1$: 교점 2, 접선 2', criteria: ['2.M1', '2.M2', '2.R1']}
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-32.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 이차함수 $y=x^2$과 $y=ax^2-ax$의 교점의 개수는 방정식 $x^2=ax^2-ax$의 실근의 개수와 같다. 이 식을 정리하면 $x((a-1)x-a)=0$이므로, 두 이차함수의 교점의 개수는 다음과 같다.
        $a=1$이면 교점의 개수는 $1$, $a\ne1$이면 교점의 개수는 $2$.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        두 이차함수의 그래프에 동시에 접하는 직선의 방정식을 $y=mx+n$이라 하면, 두 이차방정식 $x^2=mx+n$과 $ax^2-ax=mx+n$은 각각 중근을 갖는다. 따라서 판별식을 이용하면
        $$m^2+4n=0,\quad (m+a)^2+4an=0$$
        이다. 두 식을 정리하면 $m$에 관한 방정식
        $$(m+a)^2-am^2=(1-a)m^2+2am+a^2=0\ \cdots\cdots\ ②$$
        를 얻는다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        (1) $a=1$이면 방정식 ②는 일차방정식이 되어 한 실근 $m=-\dfrac12$을 갖는다. 이때 $n=-\dfrac1{16}$이다. 따라서 두 이차함수의 그래프에 동시에 접하는 직선의 개수는 $1$이다.
        (2) $a\ne1$이면 방정식 ②는 이차방정식이 되며 판별식은 $\dfrac D4=a^2-a^2(1-a)=a^3$이다. $a>0$이므로 $\dfrac D4>0$이 되어 두 실근을 갖는다. $n$의 값은 $m$에 의하여 결정되므로 두 이차함수의 그래프에 동시에 접하는 직선의 개수는 $2$이다.
        따라서 두 이차함수의 그래프에 동시에 접하는 직선의 개수와 두 이차함수의 그래프의 교점의 개수는 서로 같다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ④) <2-2>에서 $a$의 값에 따른 두 이차함수의 그래프의 교점의 개수를 구한다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ⑤) 이차함수의 그래프와 직선의 위치관계를 이해하고 연립이차방정식(②)을 구한다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 20
      evidence: |
        (문항카드 ⑥) $a$의 값($a=1$, $a\ne1$)에 따른 공통접선의 개수를 구해 교점의 개수와 같음을 보인다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
