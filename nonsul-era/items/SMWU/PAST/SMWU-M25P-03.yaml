stimuli:
- label: 라
  body: |
    임의의 실수 $a$, $b$를 포함하는 구간에서 연속인 함수 $f(x)$의 한 부정적분을 $F(x)$라고 하면
    $$\int_a^b f(x)dx=\Big[F(x)\Big]_a^b=F(b)-F(a)$$
    이다.
- label: 마
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$와 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때 $x=g(t)$의 도함수 $g'(t)$가 $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^b f(x)dx=\int_\alpha^\beta f(g(t))g'(t)dt$$
    이다.

stem: |
  제시문 <라>와 <마>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'   # 원문 3-1
  stem: |
    실수 전체에서 연속인 함수 $f(x)$가 상수 $c$에 대하여
    $$f(x)+f(c-x)=c$$
    를 만족시킨다. $\displaystyle\int_0^c f(x)dx=2$일 때, 상수 $c$의 값을 모두 구하시오.
  points: 50
  depends_on: []
  answer: {kind: set, value: '{-2, 2}', equivalents: ['c = 2 or c = -2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 양변을 $0$부터 $c$까지 적분하고 $t=c-x$로 치환하면 $2\int_0^c f=c^2$.
    steps:
    - {id: 1a, content: '$\tfrac12c^2=2\Rightarrow c=\pm2$', criteria: ['1.M1', '1.M2', '1.A1']}
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-32.png, card-33.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$의 성질에 의하여
        $$\int_0^c\{f(x)+f(c-x)\}dx=c^2\ \cdots\cdots\ ③$$
        이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $c-x=t$라 하면 $\dfrac{dx}{dt}=-1$이고 $c-0=c$, $c-c=0$이므로 $\displaystyle\int_0^c f(c-x)dx=\int_0^c f(t)dt$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        ③에서 정적분의 성질을 이용하면
        $$\int_0^c\{f(x)+f(c-x)\}dx=\int_0^c f(x)dx+\int_0^c f(c-x)dx=2\int_0^c f(t)dt=c^2$$
        이므로 $\displaystyle\int_0^c f(x)dx=\frac12c^2$이다. 따라서 $\displaystyle\int_0^c f(x)dx=2$를 만족시키는 실수 $c$의 값은 $c=\pm2$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ①) <3-1>에서 $f(x)+f(c-x)=c$의 의미를 정확히 이해하고 활용한다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ②) 치환적분법을 적용하여 정적분의 값을 구한다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ③) 실수 $c$의 값 $c=\pm2$를 정확히 구한다.
      depends_on: [1.M1, 1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 3-2
  stem: |
    실수 전체에서 연속인 함수 $f(x)$가 상수 $c$에 대하여
    $$f(x)+f(c-x)=c$$
    를 만족시킨다. 정적분
    $$\int_{\frac c4}^{\frac{3c}{4}}f(f(x))dx$$
    의 값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'c**2/4', equivalents: ['(c/2)**2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $I=\int_{c/4}^{3c/4}f(f(x))dx$에 $f(x)=c-f(c-x)$, $t=c-x$, $f(c-f(t))=c-f(f(t))$를 차례로 쓰면 $I=\tfrac{c^2}{2}-I$.
    steps:
    - {id: 2a, content: '$2I=\tfrac{c^2}{2}\Rightarrow I=\tfrac{c^2}{4}$', criteria: ['2.M1', '2.M2', '2.A1']}
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-33.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        연속함수 $f(x)$는 모든 실수 $x$에 대하여 $f(x)+f(c-x)=c$이므로
        $$f(x)=c-f(c-x)\ \cdots\cdots\ ④$$
        이다. 따라서 정적분
        $$\int_{\frac c4}^{\frac{3c}4}f(f(x))dx=\int_{\frac c4}^{\frac{3c}4}f(c-f(c-x))dx\ \cdots\cdots\ ⑤$$
        이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        $c-x=t$라 하면 $\dfrac{dx}{dt}=-1$이고 $c-\dfrac c4=\dfrac{3c}4$, $c-\dfrac{3c}4=\dfrac c4$이므로
        $$\int_{\frac c4}^{\frac{3c}4}f(c-f(c-x))dx=\int_{\frac c4}^{\frac{3c}4}f(c-f(t))dt$$
        이다. 이때, ④에서 $x$에 $f(t)$를 대입하면 $f(c-f(t))=c-f(f(t))$이므로
        $$\int_{\frac c4}^{\frac{3c}4}f(c-f(t))dt=\int_{\frac c4}^{\frac{3c}4}\{c-f(f(t))\}dt=\frac{c^2}{2}-\int_{\frac c4}^{\frac{3c}4}f(f(t))dt$$
        이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        ⑤에 의하여
        $$\int_{\frac c4}^{\frac{3c}4}f(f(x))dx=\frac{c^2}{2}-\int_{\frac c4}^{\frac{3c}4}f(f(t))dt$$
        이다. 따라서 $\displaystyle\int_{\frac c4}^{\frac{3c}4}f(f(x))dx=\frac{c^2}{4}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ④) <3-2>에서 주어진 조건식을 이용하여 적분식을 적절히 변형한다(④, ⑤).
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (문항카드 ⑤) 치환적분법과 합성함수의 성질($f(c-f(t))=c-f(f(t))$)을 적절히 활용한다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (문항카드 ⑥) 주어진 정적분의 값 $\dfrac{c^2}{4}$를 정확히 구한다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

