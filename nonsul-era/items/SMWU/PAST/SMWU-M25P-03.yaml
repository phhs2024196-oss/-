intent: |
  함수방정식 $f(x)+f(c-x)=c$와 치환적분법을 결합해 $\int_0^c f$의 값과 합성함수의 정적분 $\int_{c/4}^{3c/4}f(f(x))dx$의 값을 구하는 능력을 본다.
key_idea: |
  $t=c-x$ 치환은 구간 $[\tfrac c4,\tfrac{3c}{4}]$, $[0,c]$를 자기 자신으로 보낸다. (3-2)에서는 $f(c-f(t))=c-f(f(t))$를 대입해 구하는 적분 $I$에 대해 $I=\tfrac{c^2}{2}-I$를 얻는다.
stuck: |
