stimuli:
- label: 가
  body: |
    이차방정식 $ax^2+bx+c=0$의 두 근을 $\alpha$, $\beta$라 하면
    $$\alpha+\beta=-\frac{b}{a},\quad \alpha\beta=\frac{c}{a}$$
    이다.
- label: 나
  body: |
    삼차방정식 $ax^3+bx^2+cx+d=0$의 세 근을 $\alpha$, $\beta$, $\gamma$라 하면
    $$ax^3+bx^2+cx+d=a(x-\alpha)(x-\beta)(x-\gamma)$$
    이다. 우변을 전개하여 정리하면 다음과 같다.
    $$ax^3+bx^2+cx+d=ax^3-a(\alpha+\beta+\gamma)x^2+a(\alpha\beta+\beta\gamma+\gamma\alpha)x-a\alpha\beta\gamma$$
    $a\neq0$이므로 양변을 $a$로 나누면
    $$x^3+\frac{b}{a}x^2+\frac{c}{a}x+\frac{d}{a}=x^3-(\alpha+\beta+\gamma)x^2+(\alpha\beta+\beta\gamma+\gamma\alpha)x-\alpha\beta\gamma$$
    이고 이 등식은 $x$에 관한 항등식이므로 양변에 있는 동류항의 계수를 비교하면
    $$\alpha+\beta+\gamma=-\frac{b}{a},\quad \alpha\beta+\beta\gamma+\gamma\alpha=\frac{c}{a},\quad \alpha\beta\gamma=-\frac{d}{a}$$
    이다. 이를 정리하면 다음과 같은 삼차방정식의 근과 계수의 관계를 알 수 있다.

    삼차방정식 $ax^3+bx^2+cx+d=0$의 세 근을 $\alpha$, $\beta$, $\gamma$라 하면
    $$\alpha+\beta+\gamma=-\frac{b}{a},\quad \alpha\beta+\beta\gamma+\gamma\alpha=\frac{c}{a},\quad \alpha\beta\gamma=-\frac{d}{a}$$
    이다.

stem: |
  제시문 <가>와 <나>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'   # 원문 1-1
  stem: |
    점 $(a,b)$가 원점을 중심으로 하고 반지름이 2인 원 위의 점일 때 $a+b$의 값의 범위를 구하시오.
  points: 50
  depends_on: []
  answer: {kind: set, value: '[-2*sqrt(2), 2*sqrt(2)]', equivalents: ['-2*sqrt(2) <= a+b <= 2*sqrt(2)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a+b=t$이면 $ab=\dfrac{t^2-4}{2}$이고 $a,b$는 $x^2-tx+\dfrac{t^2-4}{2}=0$의 실근이므로 판별식 $-t^2+8\ge0$.
    steps:
    - {id: 1a, content: '$D=t^2-2(t^2-4)=-t^2+8\ge0\Rightarrow -2\sqrt2\le t\le2\sqrt2$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $a+b$와 $ab$를 알면 $a,b$는 어떤 방정식의 근인가?
    - $a,b$가 실수라는 조건을 식으로 쓰면?
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-24.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 $(a,b)$가 원점을 중심으로 하고 반지름이 2인 원 위의 점이므로 $a^2+b^2=4$를 만족시킨다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        $a+b=t$라고 하면 $(a+b)^2=a^2+b^2+2ab$로부터 $t^2=4+2ab$이고 $ab=\dfrac{t^2-4}{2}$이다. $a,b$는 이차방정식
        $$x^2-(a+b)x+ab=x^2-tx+\frac{t^2-4}{2}=0$$
        의 두 실근이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        이차방정식이 두 실근을 가지므로 판별식 $D=t^2-\dfrac{4(t^2-4)}{2}=-t^2+8\ge0$이다. $t$에 대한 이차부등식을 풀면 $-2\sqrt2\le t\le2\sqrt2$이다. 따라서 $a+b$의 범위는 $-2\sqrt2\le a+b\le2\sqrt2$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ①) 원의 방정식 $a^2+b^2=4$를 적었다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ②) $a+b=t$, $ab=\dfrac{t^2-4}{2}$로 두고 $a,b$를 두 근으로 하는 이차방정식 $x^2-tx+\dfrac{t^2-4}{2}=0$을 세웠다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ③) 판별식 $-t^2+8\ge0$을 풀어 $-2\sqrt2\le a+b\le2\sqrt2$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 1-2
  stem: |
    $x$에 대한 삼차방정식 $x^3-(2+\sqrt2)tx^2+(1+2\sqrt2)t^2x-\sqrt2=0$의 세 실근을 $\alpha,\beta,\gamma$라고 하자. 점 $(\alpha,\beta)$가 원점을 중심으로 하고 반지름이 $\gamma>0$인 원 위의 점이 되게 하는 양의 실수 $t$를 구하시오.
  points: 50
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\alpha^2+\beta^2+\gamma^2=4t^2=2\gamma^2$에서 $\gamma=\sqrt2t$, 나머지 두 근은 $X^2-2tX+t^2=0$의 중근 $t$, $\alpha\beta\gamma=\sqrt2t^3=\sqrt2$.
    steps:
    - {id: 2a, content: '$\gamma=\sqrt2t$, $\alpha=\beta=t$, $\sqrt2t^3=\sqrt2\Rightarrow t=1$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $\alpha^2+\beta^2=\gamma^2$의 양변에 $\gamma^2$을 더해 보자.
    - 세 근의 제곱의 합은 근과 계수의 관계로 계산할 수 있다.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-24.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        삼차방정식의 근과 계수의 관계로부터
        $$\alpha+\beta+\gamma=(2+\sqrt2)t,\quad \alpha\beta+\beta\gamma+\gamma\alpha=(1+2\sqrt2)t^2,\quad \alpha\beta\gamma=\sqrt2$$
        이다.
      criteria: ['2.M2']
    - id: 2b-2
      content: |
        점 $(\alpha,\beta)$가 원점을 중심으로 하고 반지름이 $\gamma(>0)$인 원 위의 점이므로 $\alpha^2+\beta^2=\gamma^2$을 만족시킨다.
      criteria: ['2.M1']
    - id: 2b-3
      content: |
        다항식의 곱셈 공식을 이용하면
        $$\alpha^2+\beta^2+\gamma^2=(\alpha+\beta+\gamma)^2-2(\alpha\beta+\beta\gamma+\gamma\alpha)=\{(2+\sqrt2)t\}^2-2(1+2\sqrt2)t^2=4t^2$$
        이다. 따라서 $2\gamma^2=\alpha^2+\beta^2+\gamma^2=4t^2$이고 $\gamma$와 $t$가 모두 양의 실수이므로 $\gamma=\sqrt2t$이다.
      criteria: ['2.M2', '2.A1']
    - id: 2b-4
      content: |
        그러므로 $\alpha+\beta=(2+\sqrt2)t-\gamma=2t$이고 $\alpha\beta=(1+2\sqrt2)t^2-\gamma(\alpha+\beta)=t^2$이다. $\alpha,\beta$는 $X$에 대한 이차방정식 $X^2-2tX+t^2=0$의 두 근이다. 따라서 $\alpha=t$이고 $\beta=t$이다. 따라서 $\sqrt2=\alpha\beta\gamma=\sqrt2t^3$이고 이를 정리하면 $t^3-1=0$이다. $t$는 양의 실수이므로 $t=1$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ④) 원의 조건 $\alpha^2+\beta^2=\gamma^2$을 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ⑤) 삼차방정식의 근과 계수의 관계 세 식을 쓰고 $\alpha^2+\beta^2+\gamma^2=4t^2$을 계산했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1, 2b-3]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ⑥) $\gamma=\sqrt2t$, 이차방정식 $X^2-2tX+t^2=0$에서 $\alpha=\beta=t$를 구하고 $t^3=1$에서 $t=1$을 얻었다.
      depends_on: [2.M1, 2.M2]
      steps: [2b-3, 2b-4]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

