stimuli:
- label: 다
  body: |
    함수 $f(x)$의 한 부정적분을 $F(x)$라 하고, 미분가능한 함수 $g(t)$에 대하여 $x=g(t)$로 놓으면
    $$F(x)=F(g(t))$$
    이다. 이때 $F(x)$를 $t$에 대하여 미분하면
    $$\frac{d}{dt}F(x)=\frac{d}{dx}F(x)\times\frac{dx}{dt}=f(x)g'(t)=f(g(t))g'(t)$$
    이므로
    $$F(x)+C=\int f(g(t))g'(t)dt$$
    이다. 이때 $F(x)+C=\displaystyle\int f(x)dx$이므로 다음이 성립한다.
    $$\int f(x)dx=\int f(g(t))g'(t)dt$$
    이와 같이 한 변수를 다른 변수로 바꾸어 적분하는 방법을 치환적분법이라고 한다.
- label: 라
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$의 한 부정적분을 $F(x)$라고 하면
    $$\int_a^bf(x)dx=F(b)-F(a)$$
    이다. 여기서 미분가능한 함수 $g(t)$에 대하여 $x=g(t)$로 놓으면 치환적분법에 따라
    $$\int f(x)dx=\int f(g(t))g'(t)dt=F(g(t))+C$$
    가 성립한다. 이때 $g(t)$의 도함수 $g'(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때, $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_\alpha^\beta f(g(t))g'(t)dt=\Big[F(g(t))\Big]_\alpha^\beta=F(g(\beta))-F(g(\alpha))=F(b)-F(a)$$
    이다. 따라서 다음이 성립한다.
    $$\int_a^bf(x)dx=\int_\alpha^\beta f(g(t))g'(t)dt$$

stem: |
