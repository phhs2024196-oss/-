subparts:
- id: '1'   # 원문 2-1
  stem: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 다음이 성립함을 증명하시오.
    $$\int_a^bf(x)dx=\int_a^bf(a+b-x)dx$$
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=a+b-t$로 치환하면 $dx=-dt$, 구간 $a\to b$가 $b\to a$로 바뀌고 부호가 상쇄된다.
    steps:
    - {id: 1a, content: '$\displaystyle\int_a^bf(x)dx=\int_b^af(a+b-t)(-1)dt=\int_a^bf(a+b-t)dt$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $a+b-x$를 새 변수로 두어 보자.
    - $x=a$, $x=b$일 때 새 변수의 값은?
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-24.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a+b-x=t$, 즉 $x=a+b-t$로 놓으면 $\dfrac{dx}{dt}=-1$이다.
      criteria: ['1.M1', '1.A1']
    - id: 1b-2
      content: |
        $x=a$일 때 $t=b$이고 $x=b$일 때 $t=a$이므로
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        $$\int_a^bf(x)dx=\int_b^af(a+b-t)(-1)dt=\int_a^bf(a+b-t)dt$$
        이다. (적분변수의 문자를 $x$로 바꾸면 증명할 식이다.) ■
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ①) $a+b-x=t$로 치환했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ②) 적분 범위가 $x:a\to b$에서 $t:b\to a$로 바뀜을 적었다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ③) $\dfrac{dx}{dt}=-1$을 이용해 위끝·아래끝을 바꾸어 $\displaystyle\int_a^bf(a+b-t)dt$를 얻었다.
      depends_on: [1.M1, 1.M2]
