  misconceptions: []

- id: '2'   # 원문 2-2
  stem: |
    위의 적분식을 이용하여 다음의 적분값을 구하시오.
    $$\int_{-24}^{26}\frac{\sqrt{\ln(x+25)}}{\sqrt{\ln(x+25)}+\sqrt{\ln(27-x)}}dx$$
  points: 50
  depends_on: ['1']
  answer: {kind: value, value: '25', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a+b=2$이므로 $f(2-x)$는 분자가 $\sqrt{\ln(27-x)}$로 바뀐 식이고, 두 적분의 합은 $\displaystyle\int_{-24}^{26}1\,dx=50$.
    steps:
    - {id: 2a, content: '$2I=\displaystyle\int_{-24}^{26}dx=50\Rightarrow I=25$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $a+b-x$에 $x+25$를 넣으면 무엇이 되는가?
    - 원래 적분과 바뀐 적분을 더해 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-25.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        로그함수 $\ln x$는 $x>0$일 때 연속이므로, 닫힌구간 $[-24,26]$에서 $\ln(x+25)$와 $\ln(27-x)$는 모두 연속이다. 이 구간에서 두 함수 모두 $0$ 이상의 값을 가지므로 $\sqrt{\ln(x+25)}$와 $\sqrt{\ln(27-x)}$, 모두 연속이다. 또한 $\ln(x+25)$와 $\ln(27-x)$는 동시에 $0$의 값을 가질 수 없으므로 피적분함수
        $$\frac{\sqrt{\ln(x+25)}}{\sqrt{\ln(x+25)}+\sqrt{\ln(27-x)}}$$
        이 적분 구간 $[-24,26]$에서 연속임을 알 수 있다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        구하고자 하는 적분의 값을 $I$라 하자. 즉,
        $$I=\int_{-24}^{26}\frac{\sqrt{\ln(x+25)}}{\sqrt{\ln(x+25)}+\sqrt{\ln(27-x)}}dx\qquad(1)$$
        문제 2-1에서 주어진 적분식을 이용하면
        $$I=\int_{-24}^{26}\frac{\sqrt{\ln(27-x)}}{\sqrt{\ln(x+25)}+\sqrt{\ln(27-x)}}dx\qquad(2)$$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        식 (1)과 (2)의 양변을 서로 더하면
        $$2I=\int_{-24}^{26}\frac{\sqrt{\ln(x+25)}+\sqrt{\ln(27-x)}}{\sqrt{\ln(x+25)}+\sqrt{\ln(27-x)}}dx=\int_{-24}^{26}1\,dx=50$$
        즉 $2I=50$이고, 이는 $I=25$임을 의미한다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: R
      points: 15
      evidence: |
        (기준 ④) $[-24,26]$에서 로그·무리함수가 정의되고 분모가 $0$이 아니어서 피적분함수가 연속임을 밝혔다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ⑤) (2-1)의 관계식을 적용해 분자가 $\sqrt{\ln(27-x)}$인 적분으로 바꿨다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 15}
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ⑥) 구하는 값을 $I$로 두고 두 식을 더해 $2I=50$, $I=25$를 얻었다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
