stimuli:
- label: 마
  body: |
    곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 방정식은
    $$y-f(a)=f'(a)(x-a)$$
    이다.
- label: 바
  body: |
    두 함수 $f(x)$와 $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b\lvert f(x)-g(x)\rvert dx$$

stem: |
  제시문 <마>와 <바>를 읽고 다음 문제에 답하시오.

subparts:
- id: '1'   # 원문 3-1
  stem: |
    점 $A(-3,5)$를 지나고 곡선 $y=x^3-5x^2+x+8$에 접하는 세 직선을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: set, value: 'y=126*x+383; y=x+8; y=-2*x-1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접점 $(a,f(a))$의 접선에 $(-3,5)$를 대입하면 $2a(a+5)(a-3)=0$.
    steps:
    - {id: 1a, content: '$a=-5,0,3\Rightarrow y=126x+383,\ y=x+8,\ y=-2x-1$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 접점의 $x$좌표를 미지수로 두자.
    - 접선이 $A$를 지난다는 조건을 대입하면 $a$에 대한 삼차방정식이 된다.
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-25.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=x^3-5x^2+x+8$에서 $y'=3x^2-10x+1$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 곡선 위의 점 $(a,a^3-5a^2+a+8)$에서의 접선의 방정식은 $y-(a^3-5a^2+a+8)=(3a^2-10a+1)(x-a)$이다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        이 직선이 점 $A(-3,5)$를 지나므로 $5-(a^3-5a^2+a+8)=(3a^2-10a+1)(-3-a)$이다. 이 식을 정리하면 $2a(a+5)(a-3)=0$이다. 그러므로 $a=-5,0,3$이다. 각각의 $a$에 대한 직선의 방정식을 구하면
        $a=-5$일 때 $y=126x+383$, $a=0$일 때 $y=x+8$, $a=3$일 때 $y=-2x-1$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: B
      points: 15
      evidence: |
        (기준 ①) 도함수 $y'=3x^2-10x+1$을 구했다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ②) 접선을 $y-(a^3-5a^2+a+8)=(3a^2-10a+1)(x-a)$로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ③) $2a(a+5)(a-3)=0$을 풀어 세 직선 $y=126x+383$, $y=x+8$, $y=-2x-1$을 구했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 3-2
  stem: |
    위의 세 직선을 기울기가 작은 순서대로 정리하여 각각 $L_1,L_2,L_3$이라고 하자. 두 직선 $L_1,L_2$가 접하는 접점을 각각 $B,C$라고 할 때, 이 곡선 위의 점 $B$에서 점 $C$까지의 부분과 선분 $AB$, $AC$로 둘러싸인 도형의 면적을 구하시오.
  points: 50
  depends_on: ['1']
  answer: {kind: value, value: '117/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $D(0,-1)$을 잡아 삼각형 $ACD$ $\left(\tfrac{27}{2}\right)$와 $[0,3]$에서 곡선과 $L_1$ 사이 넓이 $\left(\tfrac{63}{4}\right)$의 합.
    steps:
    - {id: 2a, content: '$S=\tfrac12\cdot3\cdot9+\displaystyle\int_0^3\{(x^3-5x^2+x+8)-(-2x-1)\}dx=\tfrac{117}{4}$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 그림을 그리고 $y$축으로 도형을 나누어 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-26.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        직선 $L_1$은 $y=-2x-1$이고 직선 $L_2$는 $y=x+8$이다. [그림: 곡선 $y=x^3-5x^2+x+8$, 직선 $L_1$(점 $A$, $D(0,-1)$, 접점 $B(3,-7)$를 지남), 직선 $L_2$(점 $A$, 접점 $C(0,8)$를 지남)]
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        따라서 구하는 면적을 $S$라 하면 $S$는 삼각형 $ACD$의 면적과 닫힌구간 $[0,3]$에서 곡선 $y=x^3-5x^2+x+8$과 세 직선 $y=-2x-1$, $x=0$, $x=3$으로 둘러싸인 도형의 넓이를 합한 것과 같다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        그러므로
        $$S=\frac12\times3\times9+\int_0^3\{(x^3-5x^2+x+8)-(-2x-1)\}dx=\frac{27}{2}+\left[\frac14x^4-\frac53x^3+\frac32x^2+9x\right]_0^3=\frac{117}{4}$$
        이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ④) $L_1:y=-2x-1$, $L_2:y=x+8$과 $B(3,-7)$, $C(0,8)$을 표시한 도형을 그렸다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.A1], max_points: 15}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ⑤) 넓이를 삼각형 넓이와 정적분 $\displaystyle\int_0^3\{(x^3-5x^2+x+8)-(-2x-1)\}dx$의 합(또는 동치인 적분)으로 표시했다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ⑥) 적분구간을 나누어 계산해 $\dfrac{117}{4}$를 얻었다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

