stimuli:
- label: 다
  body: |
    두 함수 $f(x)$, $g(x)$가 미분가능할 때, 함수 $f(x)g(x)$를 $x$에 대하여 미분하면
    $$\{f(x)g(x)\}'=f'(x)g(x)+f(x)g'(x)$$
    이다. 그리고 구간 $[a,b]$에서 두 함수 $f(x)$, $g(x)$의 도함수가 연속이면
    $$\int_a^bf(x)g'(x)dx=\Big[f(x)g(x)\Big]_a^b-\int_a^bf'(x)g(x)dx$$
    이다.
- label: 라
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때 $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)dx=\int_\alpha^\beta f(g(t))g'(t)dt$$
    이다.

stem: |
  제시문을 <다>와 <라>를 읽고 다음 문제에 답하시오.

  수열 $\{a_n\}$과 $\{p_n\}$은 다음과 같이 주어져 있다.
  $$a_n=\int_0^1x^n(1-x)^ndx,\qquad p_n=\int_0^1(1-y^2)^ndy$$

subparts:
- id: '1'   # 원문 2-1
  stem: |
    $\displaystyle\int_0^1x^n(1-x)^ndx=b_n\int_0^1x^{n+1}(1-x)^{n-1}dx$를 만족시키는 $b_n$을 구하고 $a_n=c_nn!$을 만족시키는 $c_n$을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'b_n = n/(n+1); c_n = factorial(n)/factorial(2*n+1)', equivalents: ['c_n = 1/((n+1)*(n+2)*...*(2*n+1))'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 부분적분 한 번에 계수 $\dfrac{n-k}{n+k+1}$; $n$번 반복하면 $a_n=\dfrac{n!}{(n+1)(n+2)\cdots(2n)}\cdot\dfrac{1}{2n+1}=\dfrac{n!\,n!}{(2n+1)!}$.
    steps:
    - {id: 1a, content: '$b_n=\dfrac{n}{n+1}$, $c_n=\dfrac{n!}{(2n+1)!}$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $x^n$을 적분하고 $(1-x)^n$을 미분하는 부분적분을 해 보자.
    - 같은 일을 $(1-x)$의 지수가 $0$이 될 때까지 반복하면 계수는?
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-34.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        부분적분을 이용하면 자연수 $n$에 대해서,
        $$\int_0^1x^n(1-x)^ndx=\left[\frac{1}{n+1}x^{n+1}(1-x)^n\right]_0^1+\frac{n}{n+1}\int_0^1x^{n+1}(1-x)^{n-1}dx=\frac{n}{n+1}\int_0^1x^{n+1}(1-x)^{n-1}dx$$
        이므로 $b_n=n/(n+1)$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        여기서, 우변의 $\dfrac{n}{n+1}$의 분모는 좌변의 피적분함수의 $x$의 지수에 1을 더한 값이고 분자는 $(1-x)$의 지수이다. 또한, 부분적분을 거듭할수록 $x$의 지수는 1씩 증가하고 $1-x$의 지수는 1씩 감소한다. 즉, $n-1\ge k$인 $k$에 대해,
        $$\int_0^1x^{n+k}(1-x)^{n-k}dx=\left[\frac{1}{n+k+1}x^{n+k+1}(1-x)^{n-k}\right]_0^1+\frac{n-k}{n+k+1}\int_0^1x^{n+k+1}(1-x)^{n-(k+1)}dx=\frac{n-k}{n+k+1}\int_0^1x^{n+k+1}(1-x)^{n-(k+1)}dx$$
        가 성립한다.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        우변 피적분함수의 $1-x$의 지수가 $0$이 될 때까지 부분적분을 반복하면
        $$a_n=\int_0^1x^n(1-x)^ndx=\frac{n}{n+1}\frac{n-1}{n+2}\cdots\frac{1}{2n}\int_0^1x^{2n}(1-x)^0dx=\frac{n!}{(2n+1)(2n)\cdots(n+1)}$$
        가 된다. 즉,
        $$a_n=\frac{n!}{(2n+1)(2n)\cdots(n+1)}=\frac{n!\,n!}{(2n+1)!}$$
        이므로 $c_n=\dfrac{1}{(2n+1)\cdots(n+1)}=\dfrac{n!}{(2n+1)!}$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ①) 부분적분으로 $b_n=\dfrac{n}{n+1}$을 구했다(경계항이 $0$임 포함).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ②) $n-1\ge k$인 $k$에 대해 $\displaystyle\int_0^1x^{n+k}(1-x)^{n-k}dx=\frac{n-k}{n+k+1}\int_0^1x^{n+k+1}(1-x)^{n-(k+1)}dx$를 보였다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ③) 부분적분을 반복해 $c_n=\dfrac{n!}{(2n+1)!}$을 구했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 2-2
  stem: |
    치환적분법을 이용하여 $a_n=d_np_n$을 만족하는 $d_n$을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'd_n = 1/2**(2*n)', equivalents: ['1/4**n'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x=\dfrac{1+y}{2}$이면 $x(1-x)=\dfrac{1-y^2}{4}$, $dx=\dfrac12dy$, 구간 $[-1,1]$; 우함수이므로 $[0,1]$의 2배.
    steps:
    - {id: 2a, content: '$a_n=\dfrac{1}{2^{2n+1}}\displaystyle\int_{-1}^1(1-y^2)^ndy=\dfrac{1}{2^{2n}}p_n$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - $x$와 $1-x$를 $y$의 일차식으로 써서 곱이 $1-y^2$에 비례하도록 해 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-34.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $x^n(1-x)^n$의 꼴이 $(1-y^2)^n=(1+y)^n(1-y)^n$의 꼴로 표시되기 위해서는 $x=\dfrac{1+y}{2}$ 또는 $y=2x-1$의 형태로 치환해야 한다. 이때 $y$에 대한 적분구간은 $[-1,1]$이 된다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        그러므로
        $$a_n=\int_{-1}^1\left(\frac{1+y}{2}\right)^n\left(\frac{1-y}{2}\right)^n\frac12dy=\frac{1}{2^{2n+1}}\int_{-1}^1(1-y^2)^ndy$$
        이다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        한편, $(1-y^2)^n$은 우함수이므로
        $$a_n=\frac{1}{2^{2n+1}}\int_{-1}^1(1-y^2)^ndy=\frac{1}{2^{2n}}\int_0^1(1-y^2)^ndy$$
        가 되며 $d_n=\dfrac{1}{2^{2n}}$이다.
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ④) $x=\dfrac{1+y}{2}$ 또는 $y=2x-1$로 치환하고 적분구간 $[-1,1]$을 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: A
      points: 15
      evidence: |
        (기준 ⑤) $a_n=\dfrac{1}{2^{2n+1}}\displaystyle\int_{-1}^1(1-y^2)^ndy$를 보였다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ⑥) $(1-y^2)^n$이 우함수임을 이용해 $d_n=\dfrac{1}{2^{2n}}$을 구했다.
      depends_on: [2.M1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

