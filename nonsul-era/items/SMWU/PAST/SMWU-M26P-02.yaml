intent: |
  부분적분법을 이용하여 주어진 수열 간의 관계를 유도하고 이를 반복 수행하여 팩토리얼 식으로 표시할 수 있는지, 두 함수를 연결하는 치환식을 유도하고 이를 기반으로 치환적분하여 관계식을 유도할 수 있는지 평가한다.
key_idea: |
  부분적분 한 번에 $x$의 지수는 1 증가, $1-x$의 지수는 1 감소하며 계수 $\dfrac{n-k}{n+k+1}$가 붙는다. $x=\dfrac{1+y}{2}$로 치환하면 $x(1-x)=\dfrac{1-y^2}{4}$.
stuck: |
  부분적분을 $1-x$의 지수가 $0$이 될 때까지 반복해 계수의 곱을 팩토리얼로 정리하는 것, 그리고 $x^n(1-x)^n$을 $(1-y^2)^n$ 꼴로 만드는 치환 $y=2x-1$
idea_tags: [IDEA-REPEATED-INTEGRATION-BY-PARTS, IDEA-SYMMETRIC-SUBSTITUTION-EVEN]
tags: [부분적분, 치환적분, 베타적분, 약학부]
