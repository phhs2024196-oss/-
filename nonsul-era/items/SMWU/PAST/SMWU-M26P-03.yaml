stimuli:
- label: 마
  body: |
    절댓값을 포함한 함수의 그래프는 다음과 같이 절댓값을 포함하지 않는 함수로 나타낼 수 있다.
    $$y=\lvert x\rvert=\begin{cases}x & (x\ge0)\\ -x & (x<0)\end{cases}$$
- label: 바
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$를 포함하는 열린구간에서 $f(x)\ge g(x)$이고 연속이다. 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b\{f(x)-g(x)\}dx$$

stem: |
  제시문 <마>와 <바>를 읽고 다음 문제에 답하시오.

  좌표평면에 다음 곡선
  $$3\lvert y-2x\rvert+2x^2=8$$
  이 주어져 있다.

subparts:
- id: '1'   # 원문 3-1
  stem: |
    위 곡선을 좌표평면에 그리시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'y = -2/3*x**2 + 2*x + 8/3 (y >= 2*x, -2 <= x <= 2); y = 2/3*x**2 + 2*x - 8/3 (y < 2*x, -2 < x < 2)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $y\ge2x$이면 위로 볼록한 포물선, $y<2x$이면 아래로 볼록한 포물선; 둘 다 $(\pm2,\pm4)$에서 $y=2x$와 만나 닫힌 곡선을 이룬다.
    steps:
    - {id: 1a, content: '$y=-\tfrac23\left(x-\tfrac32\right)^2+\tfrac{25}{6}$ $(y\ge2x)$, $y=\tfrac23\left(x+\tfrac32\right)^2-\tfrac{25}{6}$ $(y<2x)$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - 절댓값 안의 부호로 경우를 나누자.
    - 각 경우의 포물선이 직선 $y=2x$와 어디서 만나는가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-34.png, card-35.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        절댓값을 포함하지 않는 식으로 나타내기 위해 다음의 두 가지 경우로 나누어 생각한다. (i) $y\ge2x$인 경우 (ii) $y<2x$인 경우
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        (i) $y\ge2x$이면 주어진 식은 $3(y-2x)+2x^2=8$이다. $x$에 관해 정리하면,
        $$y=-\frac23x^2+2x+\frac83=-\frac23\left(x-\frac32\right)^2+\frac{25}{6}$$
        을 얻는다.
        (ii) $y<2x$이면 주어진 식은 $-3(y-2x)+2x^2=8$이다. 같은 방식으로 정리하면,
        $$y=\frac23x^2+2x-\frac83=\frac23\left(x+\frac32\right)^2-\frac{25}{6}$$
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        (i)와 (ii)를 이용하면 주어진 곡선의 모양은 다음과 같다. [그림: 위로 볼록한 포물선(꼭짓점 $\left(\frac32,\frac{25}{6}\right)$, $y$절편 $\left(0,\frac83\right)$, $x$절편 $(-1,0)$)과 아래로 볼록한 포물선(꼭짓점 $\left(-\frac32,-\frac{25}{6}\right)$, $y$절편 $\left(0,-\frac83\right)$, $x$절편 $(1,0)$)이 직선 $y=2x$ 위의 두 점 $(-2,-4)$, $(2,4)$에서 만나 이루는 닫힌 곡선]
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 15
      evidence: |
        (기준 ①) $y\ge2x$, $y<2x$로 나누어 절댓값을 포함하지 않는 식으로 나타냈다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: A
      points: 15
      evidence: |
        (기준 ②) 각 경우의 이차함수 $y=-\frac23x^2+2x+\frac83$, $y=\frac23x^2+2x-\frac83$을 구해 그래프를 그렸다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ③) 이차함수와 직선 $y=2x$의 교점 $(-2,-4)$, $(2,4)$를 구해 각 포물선의 해당 부분만으로 닫힌 곡선을 그렸다.
      depends_on: [1.M1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'   # 원문 3-2
  stem: |
    위 곡선으로 둘러싸인 영역 중 $y\ge0$을 만족하는 도형의 넓이를 구하시오.
  points: 50
  depends_on: ['1']
  answer: {kind: value, value: '64/9', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 원점 대칭이므로 구하는 넓이는 전체의 절반이고, $y=2x$에 의해서도 이등분되므로 $\displaystyle\int_{-2}^2\left(-\tfrac23x^2+\tfrac83\right)dx$.
    steps:
    - {id: 2a, content: '$\dfrac S2=\displaystyle\int_{-2}^2\left(-\frac23x^2+2x+\frac83-2x\right)dx=\frac{64}{9}$', criteria: ['2.M1', '2.M2', '2.A1']}
    hint_ladder:
    - 곡선은 어떤 대칭성을 가지는가?
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-36.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        위 곡선으로 둘러싸인 영역의 넓이를 $S$라 하자. 이 영역은 원점 대칭이므로 $y\ge0$을 만족하는 도형의 넓이는 $\dfrac S2$가 된다. 또한 $y=2x$에 의해 이등분된다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        그러므로 구하고자 하는 넓이는 다음과 같다.
        $$\frac S2=\int_{-2}^2\left(-\frac23x^2+2x+\frac83-2x\right)dx$$
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        $$=\frac{64}{9}$$
      criteria: ['2.A1']
  - id: S2-ALT
    audience: ALT
    source_flow: 문항카드 card-36.png 참고(대칭성 없이 직접 계산)
    method_no: 2
    key_idea: $x$절편에서 구간을 나누어 직접 적분한다.
    steps:
    - id: 2c-1
      content: |
        $$\frac S2=\int_{-1}^1\left(-\frac23x^2+2x+\frac83\right)dx+\int_1^2\left\{\left(-\frac23x^2+2x+\frac83\right)-\left(\frac23x^2+2x-\frac83\right)\right\}dx=\frac{64}{9}$$
      criteria: ['2.M2', '2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: R
      points: 15
      evidence: |
        (기준 ④) 영역이 원점 대칭이고 $y=2x$에 의해 이등분됨을 적었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 15
      evidence: |
        (기준 ⑤) 두 함수로 둘러싸인 넓이를 적분 $\displaystyle\int_{-2}^2\left(-\frac23x^2+\frac83\right)dx$(또는 구간을 나눈 동치 적분)로 나타냈다.
      depends_on: []
      implied_ok: false
      ft: {allowed: true, from: [1.M2], max_points: 15}
      steps: [2b-2, 2c-1]
    - id: 2.A1
      mark_type: A
      points: 20
      evidence: |
        (기준 ⑥) 이차함수의 적분을 계산해 $\dfrac{64}{9}$를 얻었다.
      depends_on: [2.M2]
      steps: [2b-3, 2c-1]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

