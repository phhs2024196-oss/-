intent: |
  절댓값을 포함한 이차함수의 표현을 이해하고 절댓값을 포함하지 않는 함수로 표현하여 그래프를 그릴 수 있는지, 이차함수의 그래프와 직선의 위치 관계를 이해하는지, 다항함수의 정적분 계산 및 원점 대칭인 도형의 넓이를 정적분의 성질을 이용하여 구할 수 있는지 평가한다.
key_idea: |
  $y\ge2x$, $y<2x$로 나누면 두 포물선 $y=-\frac23x^2+2x+\frac83$, $y=\frac23x^2+2x-\frac83$이 되고, 둘러싸인 영역은 원점 대칭이며 $y=2x$에 의해 이등분되므로 $y\ge0$ 부분의 넓이는 $\displaystyle\int_{-2}^2\left(-\frac23x^2+\frac83\right)dx$.
stuck: |
  영역이 원점 대칭이어서 $y\ge0$ 부분과 $y=2x$ 윗부분의 넓이가 모두 전체의 절반이라는 관찰
