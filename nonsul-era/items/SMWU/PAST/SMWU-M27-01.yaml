stimuli:
- label: 가
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때,
    (1) $f(x)\ge0$이면, $\displaystyle\int_a^b f(x)dx\ge0$
    (2) $f(x)\le g(x)$이면, $\displaystyle\int_a^b f(x)dx\le\int_a^b g(x)dx$
- label: 나
  body: |
    $a>0$, $b>0$이면, $\dfrac{a+b}{2}\ge\sqrt{ab}$

stem: |
  제시문을 읽고 다음 문제에 답하시오.

subparts:
- id: '1'
  # 원문 1-1.
  stem: |
    부등식
    $$\int_{\frac{\pi}{2}}^{\pi}x^2\sin\left(\frac{1}{x}\right)dx\le\frac{3\pi^2}{8}$$
    이 성립함을 증명하시오.
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\sin t\le t\ (t\ge0)$에 $t=\frac1x$를 넣으면 $x^2\sin\left(\frac1x\right)\le x$이고, $\int_{\pi/2}^{\pi}x\,dx=\frac{3\pi^2}{8}$이다.
    steps:
    - {id: 1a, content: '$x^2\sin\left(\frac1x\right)\le x$를 $\left[\frac\pi2,\pi\right]$에서 적분', criteria: ['1.M1', '1.A1', '1.R1']}
    hint_ladder:
    - $\sin\left(\frac1x\right)$를 다루기 쉬운 식으로 위에서 눌러 보자.
    - $\sin t$와 $t$의 크기를 비교해 보자.
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-6.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=x-\sin x$라 하면, $f(0)=0$이고 $f'(x)=1-\cos x\ge0$이므로 함수 $f(x)$의 값은 $x>0$에서 항상 양수이다. 즉, $\sin x\le x$, $x\ge0$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        따라서 $\dfrac\pi2\le x\le\pi$에서 $\sin\left(\dfrac1x\right)\le\dfrac1x$이므로 $x^2\sin\left(\dfrac1x\right)\le\dfrac{x^2}{x}=x$이다.
      criteria: ['1.A1']
    - id: 1b-3
      content: |
        따라서 제시문 <가>에 의해 $\displaystyle\int_{\frac\pi2}^{\pi}x^2\sin\left(\frac1x\right)dx\le\int_{\frac\pi2}^{\pi}x\,dx$이다. 그런데 $\displaystyle\int_{\frac\pi2}^{\pi}x\,dx=\left[\frac12x^2\right]_{\frac\pi2}^{\pi}=\frac{3\pi^2}{8}$이므로 $\displaystyle\int_{\frac\pi2}^{\pi}x^2\sin\left(\frac1x\right)dx\le\frac{3\pi^2}{8}$이다.
      criteria: ['1.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 17
      evidence: |
        (채점 기준 ①) $\sin x\le x$임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 17
      evidence: |
        (채점 기준 ②) $x^2\sin\left(\frac1x\right)\le x$인 부등식을 도출했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 16
      evidence: |
        (채점 기준 ③) 정적분의 크기 관계를 이용하여 부등식을 보였다($\int_{\pi/2}^{\pi}x\,dx=\frac{3\pi^2}{8}$ 포함).
      depends_on: [1.A1]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  # 원문 1-2.
  stem: |
    부등식
    $$\int_1^2\frac{x^3}{x^6+x^3+1}dx\le\frac{1}{3}$$
    이 성립함을 증명하시오.
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 분자·분모를 $x^3$으로 나누면 $\dfrac{1}{x^3+\frac1{x^3}+1}$이고 <나>에서 $x^3+\frac1{x^3}\ge2$이다.
    steps:
    - {id: 2a, content: '$\dfrac{x^3}{x^6+x^3+1}\le\dfrac13$을 $[1,2]$에서 적분', criteria: ['2.M1', '2.A1', '2.R1']}
    hint_ladder:
    - 분자·분모를 $x^3$으로 나누어 보자.
    - $x^3$과 $\frac1{x^3}$의 합에 제시문 <나>를 적용해 보자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-7.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $1\le x\le2$일 때 $\dfrac{x^3}{x^6+x^3+1}=\dfrac{1}{\dfrac{x^6+x^3+1}{x^3}}=\dfrac{1}{x^3+\dfrac1{x^3}+1}$이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        제시문 <나>에 의해 $\dfrac{1}{\left(x^3+\dfrac1{x^3}\right)+1}\le\dfrac{1}{2+1}=\dfrac13$이다.
      criteria: ['2.A1']
    - id: 2b-3
      content: |
        따라서 제시문 <가>에 의해 $\displaystyle\int_1^2\frac{x^3}{x^6+x^3+1}dx\le\int_1^2\frac13dx=\frac13$이다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 17
      evidence: |
        (채점 기준 ④) 절대부등식을 적용할 수 있는 유리함수 $\dfrac{1}{x^3+\frac1{x^3}+1}$ 꼴로 바꾸었다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 17
      evidence: |
        (채점 기준 ⑤) 절대부등식을 이용하여 $\dfrac{1}{\left(x^3+\frac1{x^3}\right)+1}\le\dfrac13$인 부등식을 도출했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 16
      evidence: |
        (채점 기준 ⑥) 정적분의 크기 관계를 이용하여 부등식을 보였다.
      depends_on: [2.A1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

