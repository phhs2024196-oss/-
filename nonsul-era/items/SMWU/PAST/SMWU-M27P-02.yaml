stimuli:
- label: 라
  body: |
    첫째항이 $b\ (b\ne0)$, 공비가 $r\ (r\ne1)$인 등비수열의 첫째항부터 제$n$항까지의 합을 $S_n$이라고 하면
    $$S_n=\frac{b(1-r^n)}{1-r}$$
    이고, 등비급수 $\displaystyle\sum_{n=1}^{\infty}br^{n-1}$은
    $\lvert r\rvert<1$일 때 수렴하고 그 합은 $\dfrac{b}{1-r}$,
    $\lvert r\rvert\ge1$일 때 발산한다.
    $T_n=b+2br+3br^2+\cdots+nbr^{n-1}=\displaystyle\sum_{k=1}^{n}kbr^{k-1}$이라고 하면
    $$T_n-rT_n=(1-r)T_n=b+br+br^2+\cdots+br^{n-1}-nbr^n=S_n-nbr^n$$
    이 되고 $T_n=\dfrac{S_n-nbr^n}{1-r}$이 된다. $\lvert r\rvert<1$일 때, $\displaystyle\lim_{n\to\infty}nr^n=0$임이 알려져 있으므로
    $$\lim_{n\to\infty}T_n=\lim_{n\to\infty}\frac{S_n-nbr^n}{1-r}=\frac{b}{(1-r)^2}$$
    따라서 $\displaystyle\sum_{n=1}^{\infty}nbr^{n-1}$은 수렴하고 그 합은 $\dfrac{b}{(1-r)^2}$이다.

stem: |
  수열 $\{a_n\}$은 첫째항이 $a\ (a>0)$, 공비가 $r\ (r>0)$인 등비수열이다. $A_n=\dfrac1n\displaystyle\sum_{k=1}^{n}\ln a_k$, $B_n=\dfrac1n\displaystyle\sum_{k=1}^{n}a_k$일 때, 제시문을 읽고 다음 문제에 답하시오.

subparts:
- id: '1'
  # 원문 2-1.
  stem: |
    $C_n=e^{A_n}$일 때, $\dfrac{B_3}{C_3}\le\dfrac76$을 만족시키는 $r$의 값의 범위를 구하시오.
  points: 50
  depends_on: []
  answer: {kind: set, value: 'Interval(1/2, 2)', equivalents: ['1/2 <= r <= 2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $C_3=ar$, $B_3=\frac{a(1+r+r^2)}{3}$이므로 $\frac{r^2+r+1}{3r}\le\frac76\iff 2r^2-5r+2\le0$.
    steps:
    - {id: 1a, content: '$2r^2-5r+2\le0\Rightarrow\frac12\le r\le2$', criteria: ['1.M1', '1.M2', '1.A1']}
    hint_ladder:
    - $\ln a_k$는 어떤 수열인가?
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-7.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_n=ar^{n-1}$이므로 $\ln a_k=\ln a+(k-1)\ln r$이다. 따라서 $A_n=\dfrac1n\displaystyle\sum_{k=1}^{n}\ln a_k=\ln a+\dfrac{n-1}{2}\ln r$이다. 한편, $C_n=e^{A_n}=e^{\ln a+\frac{n-1}{2}\ln r}=ar^{\frac{n-1}{2}}$이다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        이므로 $\dfrac{B_3}{C_3}=\dfrac{\dfrac{a+ar+ar^2}{3}}{ar}=\dfrac{r^2+r+1}{3r}\le\dfrac76$.
      criteria: ['1.M2']
    - id: 1b-3
      content: |
        따라서 $2r^2-5r+2\le0$이므로 $\dfrac12\le r\le2$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 17
      evidence: |
        (채점 기준 ①) $C_3=ar$를 계산했다($C_n=ar^{\frac{n-1}{2}}$).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 17
      evidence: |
        (채점 기준 ②) 해당 부등식이 공비의 이차부등식 $2r^2-5r+2\le0$으로 표시됨을 보였다.
      depends_on: [1.M1]
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 16
      evidence: |
        (채점 기준 ③) 이차부등식을 만족하는 공비의 값의 범위 $\frac12\le r\le2$를 구했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  # 원문 2-2.
  stem: |
    $a+r=1$일 때, 급수 $\displaystyle\sum_{n=1}^{\infty}a_n\ln a_n$의 합을 $a$에 대한 식으로 나타내시오.
  points: 50
  depends_on: []
  answer: {kind: expression, value: 'log(a/(1 - a)*(1 - a)**(1/a))', equivalents: ['log(a) + log(1 - a)/a - log(1 - a)'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\sum a_n\ln a_n=a\ln a\sum r^{n-1}+a\ln r\sum nr^{n-1}-a\ln r\sum r^{n-1}$에 $1-r=a$를 대입한다.
    steps:
    - {id: 2a, content: '$\ln a+\frac1a\ln(1-a)-\ln(1-a)=\ln\left(\frac{a}{1-a}(1-a)^{1/a}\right)$', criteria: ['2.M1', '2.R1', '2.A1']}
    hint_ladder:
    - $\ln a_n$을 $\ln a$와 $\ln r$로 나타내 보자.
    - $\sum nr^{n-1}$ 꼴이 나오면 제시문 <라>를 쓰자.
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-7.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\displaystyle\sum_{n=1}^{\infty}a_n\ln a_n=\sum_{n=1}^{\infty}ar^{n-1}\ln(ar^{n-1})=\sum_{n=1}^{\infty}ar^{n-1}(\ln a+(n-1)\ln r)$
        $\displaystyle=a\ln a\sum_{n=1}^{\infty}r^{n-1}+a\ln r\sum_{n=1}^{\infty}nr^{n-1}-a\ln r\sum_{n=1}^{\infty}r^{n-1}$
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        문항의 조건 $a+r=1$에 의해 $0<r<1$이므로, 제시문 <라>에 의해 $\displaystyle\sum_{n=1}^{\infty}r^{n-1}=\frac{1}{1-r}$, $\displaystyle\sum_{n=1}^{\infty}nr^{n-1}=\frac{1}{(1-r)^2}$이다. 따라서
        $\displaystyle\sum_{n=1}^{\infty}a_n\ln a_n=\frac{a}{1-r}\ln a+\frac{a\ln r}{(1-r)^2}-\frac{a}{1-r}\ln r$
      criteria: ['2.R1']
      # 문항카드 원문은 이 줄의 합 기호 위끝을 n 으로 적음(∞ 의 오기로 보임)
    - id: 2b-3
      content: |
        $=\ln a+\dfrac1a\ln(1-a)-\ln(1-a)=\ln\left(\dfrac{a}{1-a}(1-a)^{1/a}\right)$
      criteria: ['2.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 17
      evidence: |
        (채점 기준 ④) $a_n\ln a_n$이 등비수열과 등차수열의 곱임을 보였다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.R1
      mark_type: R
      points: 17
      evidence: |
        (채점 기준 ⑤) $0<r<1$로 급수의 합이 수렴하는 조건을 만족함을 보이고 급수의 합을 구했다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 16
      evidence: |
        (채점 기준 ⑥) 주어진 조건 $r=1-a$를 이용하여 극한값을 첫째항 $a$에 대한 식 $\ln\left(\frac{a}{1-a}(1-a)^{1/a}\right)$(또는 동치식)으로 보였다.
      depends_on: [2.M1, 2.R1]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

