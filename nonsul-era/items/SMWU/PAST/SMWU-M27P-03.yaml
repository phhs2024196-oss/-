stimuli:
- label: 마
  body: |
    이차함수 $y=ax^2+bx+c$의 그래프와 직선 $y=mx+n$의 교점의 $x$좌표는 방정식 $ax^2+bx+c=mx+n$, 즉
    $$ax^2+(b-m)x+c-n=0$$
    의 실근과 같다. 따라서 이차함수 $y=ax^2+bx+c$의 그래프와 직선 $y=mx+n$의 위치 관계는 위 이차방정식의 판별식
    $$D=(b-m)^2-4a(c-n)$$
    의 값의 부호에 따라 다음과 같다.
    1. $D>0$이면 두 점에서 만난다.
    2. $D=0$이면 한 점에서 만난다.(접한다.)
    3. $D<0$이면 만나지 않는다.

stem: |
  제시문을 읽고 다음 문제에 답하시오.

subparts:
- id: '1'
  # 원문 3-1. (일반 문항지 SMWU-M27-03 의 3-2 와 동일)
  stem: |
    함수
    $$f(x)=\begin{cases}(x+2)^2 & (x<0)\\-(x-2)^2+k & (x\ge0)\end{cases}$$
    에 대하여 $f(x)$의 그래프와 서로 다른 네 점에서 만나는 직선이 존재하도록 하는 실수 $k$의 값의 범위를 구하시오.
  points: 50
  depends_on: []
  answer: {kind: set, value: 'Interval.open(-oo, 8)', equivalents: ['k < 8'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 직선 $y=mx+n$이 왼쪽·오른쪽 부분과 각각 두 점에서 만날 조건을 판별식·근과 계수의 관계로 쓰면 $k-4\le n<4$와 $-\frac14(m-4)^2+4<n<\frac14(m-4)^2+k-4$, $m<4$가 된다.
    steps:
    - {id: 1a, content: '$k<8$이고 $m<4-\sqrt{2(8-k)}$로 잡으면 $n$이 존재', criteria: ['1.M1', '1.M2', '1.M3', '1.A1']}
    hint_ladder:
    - 직선 하나가 각 이차 부분과 몇 점까지 만날 수 있는가?
    - 왼쪽 교점은 음수, 오른쪽 교점은 음이 아닌 수여야 한다.
  - id: S1-B
    audience: B
    source_flow: 문항카드 card-8.png
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$의 그래프와 서로 다른 네 점에서 만나는 직선이 $y=mx+n$이라고 하면, 이 직선은 함수 $f(x)$의 그래프의 왼쪽 부분($x<0$), 오른쪽 부분($x\ge0$)과 각각 두 점에서 만나야 한다. 즉, 방정식 $(x+2)^2=mx+n$이 서로 다른 두 음의 실근을 가져야 하며, 동시에 방정식 $-(x-2)^2+k=mx+n$은 서로 다른 두 음이 아닌 실근을 가져야 한다.
      criteria: ['1.M1']
    - id: 1b-2
      content: |
        방정식 $(x+2)^2=mx+n$은 $x^2-(m-4)x+4-n=0$이고 서로 다른 두 음의 실근을 갖기 위해서는 판별식이 $0$보다 크고, 두 근의 합이 음수, 두 근의 곱이 양수이어야 한다. 따라서 조건
        $(m-4)^2-4(4-n)>0$ ……①, $m-4<0$ ……②, $4-n>0$ ……③
        을 만족시켜야 한다.
      criteria: ['1.M3']
    - id: 1b-3
      content: |
        한편, 방정식 $-(x-2)^2+k=mx+n$은 $x^2+(m-4)x+n+4-k=0$이고 서로 다른 두 음이 아닌 실근을 갖기 위해서는 판별식이 $0$보다 크고, 두 근의 합이 양수, 두 근의 곱이 $0$ 이상이어야 한다. 따라서 조건
        $(m-4)^2-4(n+4-k)>0$ ……④, $m-4<0$ ……⑤, $n+4-k\ge0$ ……⑥
        을 만족시켜야 한다.
      criteria: ['1.M2']
    - id: 1b-4
      content: |
        그러므로
        $k-4\le n<4$ ……⑦ (③과 ⑥에서),
        $-\dfrac14(m-4)^2+4<n<\dfrac14(m-4)^2+k-4$ ……⑧ (①과 ④에서),
        $m<4$ ……⑨ (②와 ⑤에서)
        를 만족시키는 $m$과 $n$이 존재하여야 한다. ⑦을 만족시키는 $n$이 존재하려면 $k<8$이어야 한다. 이때 ⑧을 만족시키는 $n$이 존재하기 위해서는 $-\dfrac14(m-4)^2+4<\dfrac14(m-4)^2+k-4$이기 때문에 $k>8-\dfrac12(m-4)^2$이다.
      criteria: ['1.A1']
    - id: 1b-5
      content: |
        따라서 ⑨에 의해 $m<4-\sqrt{2(8-k)}$를 만족시키는 $m$은 존재한다. 이 $m$에 대해 $-\dfrac14(m-4)^2+4<4$이고, $k-4<\dfrac14(m-4)^2+k-4$이므로 ⑦과 ⑧을 만족시키는 $n$이 존재한다. 따라서 답은 $k<8$이다.
      criteria: ['1.A1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 12
      evidence: |
        직선이 함수의 두 부분과 각각 두 점에서 만나야 함을 설명했다(약학부 채점 기준에는 별도 항목 없음, ①②에 포함).
      depends_on: []
      implied_ok: false
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 13
      evidence: |
        (채점 기준 ①) 함수 $f(x)$의 오른쪽 부분과 직선이 두 점에서 만날 조건(④⑤⑥)을 서술했다.
      depends_on: []
      implied_ok: false
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 12
      evidence: |
        (채점 기준 ②) 함수 $f(x)$의 왼쪽 부분과 직선이 두 점에서 만날 조건(①②③)을 서술했다.
      depends_on: []
      implied_ok: false
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 13
      evidence: |
        (채점 기준 ③) 조건들을 결합하여 $k$의 값의 범위 $k<8$을 바르게 구했다.
      depends_on: [1.M2, 1.M3]
      steps: [1b-4, 1b-5]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

- id: '2'
  # 원문 3-2.
  stem: |
    평면 위의 서로 다른 두 점 $\mathrm{P}(0,0)$, $\mathrm{Q}(a,0)$에 대하여 직선 $y=mx+n$은 선분 $\overline{\mathrm{PQ}}$와 만나지 않는다. 두 점 $\mathrm{P}$, $\mathrm{Q}$를 지나고 직선 $y=mx+n$에 접하는 이차함수가 존재함을 증명하시오.
  points: 50
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $y=kx(x-a)$가 접할 조건 $(ka+m)^2+4kn=0$을 $k$의 이차방정식으로 보면 판별식 $\frac D4=4n(am+n)>0$이다.
    steps:
    - {id: 2a, content: '$a^2k^2+2(am+2n)k+m^2=0$의 판별식 $4n(am+n)>0$ → $0$이 아닌 실근 $k$ 존재', criteria: ['2.M1', '2.M2', '2.R1']}
    hint_ladder:
    - 두 점 $\mathrm{P}$, $\mathrm{Q}$를 지나는 이차함수를 한 문자로 나타내 보자.
    - 직선이 선분과 만나지 않으면 $x=0$, $x=a$에서 직선의 높이 $n$, $am+n$의 부호는?
  - id: S2-B
    audience: B
    source_flow: 문항카드 card-8.png~card-9.png
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        평면 위의 서로 다른 두 점 $\mathrm{P}(0,0)$, $\mathrm{Q}(a,0)$을 지나는 이차함수는 $y=kx(x-a)$(단 $k\ne0$)이다.
      criteria: ['2.M1']
    - id: 2b-2
      content: |
        이 이차함수의 그래프가 직선 $y=mx+n$에 접하려면 방정식 $kx(x-a)=mx+n$이 중근을 가져야 한다. 즉, $kx^2-(ka+m)x-n=0$이 중근을 가지므로 $(ka+m)^2+4kn=0$이다. 따라서 두 점 $\mathrm{P}$, $\mathrm{Q}$를 지나고 직선 $y=mx+n$에 접하는 이차함수가 존재하려면, $k$에 관한 방정식
        $a^2k^2+2(am+2n)k+m^2=0$ ……①
        이 $0$이 아닌 실근을 가져야 한다.
      criteria: ['2.M2']
    - id: 2b-3
      content: |
        한편, 이 방정식의 판별식은 $\dfrac D4=(am+2n)^2-a^2m^2=4n(am+n)$이다. 문항의 조건에 의해 직선 $y=mx+n$은 두 점 $\mathrm{P}$, $\mathrm{Q}$와 만나지 않는다. 만약 직선 $y=mx+n$이 두 점 $\mathrm{P}$, $\mathrm{Q}$의 아래쪽에 있다면 $n<0$, $ma+n<0$이므로 $\dfrac D4>0$이 성립하고, 직선이 두 점의 위쪽에 있다면 $n>0$, $ma+n>0$이므로 $\dfrac D4>0$이 성립한다. 따라서 방정식 ①은 서로 다른 두 실근을 가지므로, $0$이 아닌 실근을 갖는다.
      criteria: ['2.R1']
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 17
      evidence: |
        (채점 기준 ④) 두 점을 지나는 이차함수의 형태 $y=kx(x-a)\ (k\ne0)$를 구했다.
      depends_on: []
      implied_ok: false
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 17
      evidence: |
        (채점 기준 ⑤) 직선과 이차함수가 접할 조건 $(ka+m)^2+4kn=0$을 구했다.
      depends_on: [2.M1]
      implied_ok: false
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 16
      evidence: |
        (채점 기준 ⑥) 판별식 $4n(am+n)>0$으로 직선과 접하는 이차함수가 항상 존재함을 보였다.
      depends_on: [2.M2]
      steps: [2b-3]
    deductions: []
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []

