key_idea: 1.1 원뿔의 높이 $x$로 $S^2=6\pi^2(6x^2-x^3)$을 세워 미분한다. 1.2 두 교점의 $y$좌표가 같음을 이용해 넓이를 $\dfrac18\lvert\sin4\alpha\rvert$로 만든다. 1.3 $A$의 거리 $\dfrac a2t^2$와 $B$의 거리 $\dfrac12t^2+2t+20$을 비교한다.
stuck: 1.1 높이가 3보다 크든 작든 반지름이 $\sqrt{6x-x^2}$로 같음을 보이는 단계, 1.2 삼각형의 밑변을 PQ로 잡고 높이를 $y$좌표로 쓰는 단계, 1.3 B가 A를 추월한 시점을 시간의 기준으로 잡는 단계
