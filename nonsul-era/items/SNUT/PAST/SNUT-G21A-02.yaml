- id: '2'
  stem: 제시문 (가)를 만족하는 네 자리 번호를 임의로 입력하되 이미 입력했던 번호는 다시 입력하지 않는다. 틀린 번호를 입력한 경우 다른 네 자리 번호를 바로 입력하고, 비밀번호를 맞힌 경우에는 더 이상 입력하지 않는다. 비밀번호를 맞힐 때까지 네 자리 번호를 입력한 횟수를 확률변수 $X$라 하자. $X$의 기댓값을 구하시오.
  points: 11
  depends_on: ['1']
  answer:
    kind: value
    value: '28'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [2.2]
    steps:
    - id: 2b-1
      content: $A_i$를 $i$번째에 비밀번호를 맞히는 사건, $i\ge2$일 때 $B_i$를 $i-1$번째까지 비밀번호를 맞히지 못한 사건이라 하자. 그러면 $P(A_1)=\dfrac1{55}$이고 $2\le i\le55$일 때, $i-1$번째까지 맞히지 못하고 $i$번째에 맞히는 사건의 확률은 $P(A_i\cap B_i)=P(B_i)\times P(A_i\mid B_i)=\left\{\left(1-\dfrac1{55}\right)\left(1-\dfrac1{54}\right)\cdots\left(1-\dfrac1{55-(i-2)}\right)\right\}\times\left(\dfrac1{55-(i-1)}\right)=\dfrac1{55}$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: 따라서 $1\le i\le55$일 때 $P(X=i)=\dfrac1{55}$이다. 그러므로 기댓값은 $E(X)=\displaystyle\sum_{i=1}^{55}\left(i\times P(X=i)\right)=\sum_{i=1}^{55}\dfrac i{55}=\dfrac1{55}\times\dfrac{55(55+1)}2=28$이다.
      criteria: [2.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: 조건부확률로 $P(X=i)=\dfrac1{55}\ (1\le i\le55)$를 구했다.
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: $E(X)=\displaystyle\sum_{i=1}^{55}\dfrac i{55}=28$을 구했다.
      depends_on:
      - 2.M1
      steps: [2b-2]
    deductions:
    - code: D2-1
