key_idea: 2.1 자리 숫자의 합이 9인 $(x,y,z)$는 중복조합 ${}_3\mathrm H_9$. 2.2 $P(X=i)=\dfrac1{55}$로 균등하므로 $E(X)=28$. 2.3 5번 틀릴 때마다 20초를 더한 시간 $5i+20\lfloor(i-1)/5\rfloor$로 $E(Y)$를 계산한다.
stuck: 2.1 백의 자리가 1로 고정되어 나머지 세 자리의 합이 9가 되는 경우로 바꾸는 단계, 2.2 $i$번째에 처음 맞힐 확률이 모든 $i$에서 $\dfrac1{55}$로 같음을 보이는 단계, 2.3 대기시간 20초가 5번 틀린 뒤마다 붙는 규칙을 식으로 옮기는 단계
