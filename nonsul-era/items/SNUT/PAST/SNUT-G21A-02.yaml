stem: |
  다음 제시문을 읽고 물음에 답하시오.

  (제시문 상자의 첫머리) 설정된 네 자리의 비밀번호를 입력하면 열리는 금고가 있다. 이 금고에는 하나의 비밀번호만 설정되어 있다.
