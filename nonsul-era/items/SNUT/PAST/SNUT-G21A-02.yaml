- id: '3'
  stem: 문항 [2.2]와 같은 방식으로 네 자리 번호를 입력할 때, 비밀번호를 맞힐 때까지 걸리는 시간을 확률변수 $Y$라 하자. $Y$의 기댓값을 제시문 (나)에 따라 구하시오. (단, 번호를 처음 입력하기 전 틀린 번호 입력 횟수는 0이다.)
  points: 11
  depends_on: ['2']
  answer:
    kind: value
    value: '240'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [2.3]
    steps:
    - id: 3b-1
      content: 확률변수 $Y$는 비밀번호를 맞힐 때까지 걸리는 시간이다. 네 자리 번호를 한 번 입력하는데 5초가 걸리고, 5번 틀린 후에는 20초 동안 입력할 수 없다. 따라서 $i-1$번째까지 비밀번호를 맞히지 못하고 $i$번째 비밀번호를 입력할 경우, $i$번째 비밀번호를 입력할 때까지 걸리는 시간은 $5i\ (1\le i\le5)$, $5i+20\ (6\le i\le10)$, $\cdots$, $5i+200\ (51\le i\le55)$이다.
      criteria: [3.R1]
    - id: 3b-2
      content: 이고 $P(Y=5i)=P(X=i)=\dfrac1{55}\ (1\le i\le5)$, $P(Y=5i+20)=P(X=i)=\dfrac1{55}\ (6\le i\le10)$, $\cdots$, $P(Y=5i+200)=P(X=i)=\dfrac1{55}\ (51\le i\le55)$이다.
      criteria: [3.R1, 3.M1]
    - id: 3b-3
      content: 따라서 $E(Y)=\displaystyle\sum_{i=1}^{55}\left(\dfrac1{55}\times5i\right)+\dfrac1{55}(0\times5+20\times5+\cdots+200\times5)=240$이다.
      criteria: [3.M1, 3.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.R1
      mark_type: R
      points: 4
      evidence: $i$번째 입력까지 걸리는 시간을 $5i$에 5번 실패마다 20초씩을 더한 식으로 나타냈다.
      steps: [3b-1, 3b-2]
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: $P(Y=\cdot)=\dfrac1{55}$를 이용해 기댓값의 합식을 세웠다.
      steps: [3b-2, 3b-3]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: $E(Y)=240$을 구했다.
      depends_on:
