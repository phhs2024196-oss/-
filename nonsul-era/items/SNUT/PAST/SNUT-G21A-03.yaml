stem: |
  다음 제시문을 읽고 물음에 답하시오.

  (제시문 상자의 첫머리) 오른쪽 그림과 같이 $t>\dfrac12$일 때, 곡선 $y=t-x^2$과 직선 $y=tx$가 제1사분면에서 만나는 점을 $\mathrm{P}_1$, 제3사분면에서 만나는 점을 $\mathrm{P}_2$라 하자.
  [그림] 위로 볼록한 포물선 $y=t-x^2$(꼭짓점 $(0,t)$)과 직선 $y=tx$가 제1사분면의 $\mathrm{P}_1$, 제3사분면의 $\mathrm{P}_2$에서 만난다. $\mathrm{P}_1$에서의 접선 $l_1$(기울기 음)과 $\mathrm{P}_2$에서의 접선 $l_2$(기울기 양)가 $y$축 위쪽에서 만나며 그 사이각을 $\theta$로 표시.
# 소문항 배점 미공개 — 추정 (문제 3은 33%이며 소문항 11점씩)
subparts:
- id: '1'
  stem: 직선 $l_1$과 직선 $l_2$가 이루는 각의 크기를 $\theta$라 할 때, $\tan^2\theta$를 $t$에 대한 식으로 나타내시오.
  points: 11
  depends_on: []
  answer:
    kind: expression
    value: (4*t**2+16*t)/(16*t**2-8*t+1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5~6 [3.1]
    steps:
    - id: 1b-1
      content: 직선 $l_1$이 $x$축의 양의 방향과 이루는 각의 크기를 $\theta_1$, 직선 $l_2$가 $x$의 양의 축이 이루는 각의 크기를 $\theta_2$라 하면 $\theta=\theta_1-\theta_2$이다. $\mathrm{P}_1,\mathrm{P}_2$의 좌표를 구하기 위해 방정식 $t-x^2=tx$를 풀어 두 근을 $\alpha,\beta$라 하면 $\alpha=-\dfrac t2+\dfrac{\sqrt{t^2+4t}}2$, $\beta=-\dfrac t2-\dfrac{\sqrt{t^2+4t}}2$이다.
      criteria: [1.R1]
    - id: 1b-2
      content: $\mathrm{P}_1(\alpha,t\alpha)$과 $\mathrm{P}_2(\beta,t\beta)$에서의 $y=t-x^2$의 접선의 기울기는 각각 $-2\alpha,-2\beta$이다. 따라서 $\tan\theta_1=-2\alpha$, $\tan\theta_2=-2\beta$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: $\tan^2\theta=\tan^2(\theta_1-\theta_2)=\left(\dfrac{\tan\theta_1-\tan\theta_2}{1+\tan\theta_1\tan\theta_2}\right)^2=\left(\dfrac{-2\alpha+2\beta}{1+4\alpha\beta}\right)^2=\dfrac{4(\alpha-\beta)^2}{(1+4\alpha\beta)^2}=\dfrac{4\{(\alpha+\beta)^2-4\alpha\beta\}}{(1+4\alpha\beta)^2}$이다. 근과 계수의 관계에서 $\alpha+\beta=-t$, $\alpha\beta=-t$이므로 $\tan^2\theta=\dfrac{4(t^2+4t)}{(1-4t)^2}=\dfrac{4t^2+16t}{16t^2-8t+1}$이다.
      criteria: [1.M1, 1.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: 교점의 $x$좌표 $\alpha,\beta$를 구하고 $\theta=\theta_1-\theta_2$로 놓았다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 접선의 기울기 $-2\alpha,-2\beta$와 탄젠트의 차 공식을 세웠다.
      steps: [1b-2, 1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 근과 계수의 관계로 $\tan^2\theta=\dfrac{4t^2+16t}{16t^2-8t+1}$을 구했다.
      depends_on:
      - 1.M1
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    양의 정수 $k$에 대하여 다음 극한이 수렴하는 경우 극한값을 모두 구하시오.
    $$\lim_{t\to\infty}\dfrac{A_1(t)}{t^k}$$
  points: 11
  depends_on: []
  answer:
    kind: set
    value: '{0, 1/4}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.6 [3.2]
    steps:
    - id: 2b-1
      content: 직선 $l_1$의 방정식은 $y=(t-\sqrt{t^2+4t})x-\dfrac{(t-\sqrt{t^2+4t})\sqrt{t^2+4t}}2$이므로 $x$절편은 $\dfrac{\sqrt{t^2+4t}}2$, $y$절편은 $\dfrac{(\sqrt{t^2+4t}-t)\sqrt{t^2+4t}}2$이다.
      criteria: [2.R1]
    - id: 2b-2
      content: 따라서 $A_1(t)=\dfrac12\times\dfrac{\sqrt{t^2+4t}}2\times\dfrac{(\sqrt{t^2+4t}-t)\sqrt{t^2+4t}}2=\dfrac{(t^2+4t)(\sqrt{t^2+4t}-t)}8$이다.
      criteria: [2.M1]
    - id: 2b-3
      content: $\displaystyle\lim_{t\to\infty}\dfrac{A_1(t)}{t^k}=\lim_{t\to\infty}\left\{\dfrac{(t^2+4t)(\sqrt{t^2+4t}-t)}{8t^k}\times\dfrac{\sqrt{t^2+4t}+t}{\sqrt{t^2+4t}+t}\right\}=\lim_{t\to\infty}\dfrac{(t^2+4t)}{8t^k}\dfrac{4t}{\sqrt{t^2+4t}+t}=\dfrac14\lim_{t\to\infty}\dfrac{(t^2+4t)}{t^k}$이다.
      criteria: [2.M1]
    - id: 2b-4
      content: 위 극한은 $k<2$이면 발산하고 $k>2$이면 극한값이 0이다. $k=2$일 때 극한값은 $\dfrac14$이다. 따라서 극한값은 $0,\ \dfrac14$이다.
      criteria: [2.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: $l_1$의 방정식과 $x$절편, $y$절편을 구했다.
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: $A_1(t)=\dfrac{(t^2+4t)(\sqrt{t^2+4t}-t)}8$을 구하고 유리화로 극한식을 정리했다.
      steps: [2b-2, 2b-3]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $k$의 값에 따라 극한값이 $0$ 또는 $\dfrac14$임을 구했다.
      depends_on:
      - 2.M1
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    다음 극한값을 구하시오.
    $$\lim_{t\to\infty}\dfrac{S(t)}{A_2(t)}$$
  points: 11
  depends_on: ['1']
  answer:
    kind: value
    value: 2/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.6 [3.3]
    steps:
    - id: 3b-1
      content: 직선 $l_2$의 방정식은 $y=(t+\sqrt{t^2+4t})x+\dfrac{(t+\sqrt{t^2+4t})\sqrt{t^2+4t}}2$이므로 $x$절편은 $-\dfrac{\sqrt{t^2+4t}}2$, $y$절편은 $\dfrac{(t+\sqrt{t^2+4t})\sqrt{t^2+4t}}2$이다. 즉, 삼각형의 넓이 $A_2(t)$는 $A_2(t)=\dfrac{(t^2+4t)(t+\sqrt{t^2+4t})}8$이다.
      criteria: [3.R1]
    - id: 3b-2
      content: 곡선과 직선 사이의 넓이 $S(t)$는 적분을 이용하여 구할 수 있다. $S(t)=\displaystyle\int_\beta^\alpha(t-x^2-tx)dx=\left[tx-\dfrac13x^3-\dfrac12tx^2\right]_\beta^\alpha=\dfrac{(t^2+4t)\sqrt{t^2+4t}}6$이다.
      criteria: [3.M1]
    - id: 3b-3
      content: 따라서 $\displaystyle\lim_{t\to\infty}\dfrac{S(t)}{A_2(t)}=\lim_{t\to\infty}\dfrac{(t^2+4t)\sqrt{t^2+4t}}6\cdot\dfrac8{(t^2+4t)(t+\sqrt{t^2+4t})}=\dfrac23$이다.
      criteria: [3.A1]
