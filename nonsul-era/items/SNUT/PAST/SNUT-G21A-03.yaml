intent: 함수의 극한, 미분, 적분과 삼각함수를 이용하여 그래프로 표현된 도형의 넓이의 변화를 해석할 수 있는지 평가한다. 3.1은 탄젠트 함수의 합과 차에 관한 공식, 3.2는 분자·분모가 모두 발산하는 꼴의 극한과 접선의 절편, 3.3은 곡선과 직선으로 둘러싸인 넓이를 구하는 능력을 본다.
key_idea: 교점의 $x$좌표 $\alpha,\beta$로 접선 기울기 $-2\alpha,-2\beta$를 쓰고 근과 계수의 관계로 $\tan^2\theta$를 $t$로 나타낸다. $A_1(t)=\dfrac{(t^2+4t)(\sqrt{t^2+4t}-t)}8$, $A_2(t)=\dfrac{(t^2+4t)(t+\sqrt{t^2+4t})}8$, $S(t)=\dfrac{(t^2+4t)\sqrt{t^2+4t}}6$.
stuck: 3.1 $\theta=\theta_1-\theta_2$로 놓고 $\alpha+\beta=-t$, $\alpha\beta=-t$로 정리하는 단계, 3.2 유리화로 $\infty-\infty$ 꼴을 해소하고 $k$에 따른 극한값 분류, 3.3 $A_2(t)$와 $S(t)$의 점근 크기 비교
