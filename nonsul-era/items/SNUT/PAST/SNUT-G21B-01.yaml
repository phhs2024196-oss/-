- id: '3'
  stem: $\dfrac\pi6\le\theta<\dfrac\pi2$일 때, 두 직선 $y=(\tan\theta)x$와 $y=\dfrac{1+\tan\dfrac\theta2}{1-\tan\dfrac\theta2}(x-\sec\theta)$의 교점을 P라 하자. 원점 O와 점 $\mathrm{Q}(\sec\theta,0)$에 대하여 삼각형 OPQ의 외접원 지름의 최솟값을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: 4*sqrt(3)/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [1.3]
    steps:
    - id: 3b-1
      content: 직선 $y=(\tan\theta)x$가 $x$축의 양의 방향과 이루는 각의 크기는 $\theta$이다. 직선 $y=\dfrac{1+\tan\frac\theta2}{1-\tan\frac\theta2}(x-\sec\theta)=\tan\left(\dfrac\theta2+\dfrac\pi4\right)(x-\sec\theta)$의 기울기가 $\tan\left(\dfrac\theta2+\dfrac\pi4\right)$이므로 이 직선이 $x$축의 양의 방향과 이루는 각의 크기는 $\dfrac\theta2+\dfrac\pi4$이다.
      criteria: [3.R1]
    - id: 3b-2
      content: 여기서 $\theta<\dfrac\theta2+\dfrac\pi4$이므로 두 직선의 교점 P는 제1사분면에 있고, 삼각형 OPQ에서 $\angle\mathrm{PQO}$의 외각의 크기는 $\dfrac\theta2+\dfrac\pi4$이다. $\angle\mathrm{OPQ}=\alpha$로 놓으면 $\theta+\alpha=\dfrac\pi4+\dfrac\theta2$이므로 $\alpha=\dfrac\pi4-\dfrac\theta2$이고 $0<\alpha\le\dfrac\pi6$이다.
      criteria: [3.R1]
    - id: 3b-3
      content: 사인법칙에 의하여 외접원의 지름 $2R$은 $2R=\dfrac{\sec\left(\frac\pi2-2\alpha\right)}{\sin\alpha}=\dfrac1{\cos\left(\frac\pi2-2\alpha\right)\sin\alpha}=\dfrac1{\sin(2\alpha)\sin\alpha}$이다. 그런데 $\sin(2\alpha)=\sin(\alpha+\alpha)=\sin\alpha\cos\alpha+\cos\alpha\sin\alpha=2\sin\alpha\cos\alpha$이므로 $2R=\dfrac1{2\sin^2\alpha\cos\alpha}=\dfrac1{2(\cos\alpha-\cos^3\alpha)}$이다.
      criteria: [3.M1]
    - id: 3b-4
      content: 여기서 $\cos\alpha=t$로 치환하면 지름은 $2R=\dfrac1{2(t-t^3)},\ \dfrac{\sqrt3}2\le t<1$이므로 $f(t)=t-t^3$이 최대일 때, 외접원의 지름은 최소가 된다. $f'(t)=1-3t^2=0$에서 $t=\pm\dfrac1{\sqrt3}$이므로 $\dfrac{\sqrt3}2\le t<1$일 때 $f'(t)<0$이다. 따라서 $\dfrac{\sqrt3}2\le t<1$에서 $f(t)$는 감소함수이고, 구하는 최솟값은 $2R=\dfrac1{2\left(\frac{\sqrt3}2-\frac{3\sqrt3}8\right)}=\dfrac{4\sqrt3}3$이다.
      criteria: [3.M1, 3.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: 두 번째 직선의 기울기를 $\tan\left(\dfrac\theta2+\dfrac\pi4\right)$로 보고 삼각형 OPQ의 각 $\alpha=\dfrac\pi4-\dfrac\theta2$, $0<\alpha\le\dfrac\pi6$을 구했다.
      steps: [3b-1, 3b-2]
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: 사인법칙으로 $2R=\dfrac1{2(\cos\alpha-\cos^3\alpha)}$를 구하고 $t=\cos\alpha$로 치환했다.
      steps: [3b-3, 3b-4]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: $f(t)=t-t^3$의 증감으로 최솟값 $\dfrac{4\sqrt3}3$를 구했다.
      depends_on:
      - 3.M1
      steps: [3b-4]
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
