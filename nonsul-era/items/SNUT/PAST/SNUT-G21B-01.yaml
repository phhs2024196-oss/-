stem: 다음 물음에 답하시오.
# 소문항 배점 미공개 — 추정 (문제 1은 34%이며 소문항 11/11/12점으로 가름)
subparts:
- id: '1'
  stem: 일반항이 $a_n=\left(-\dfrac23\right)^n\sin^2\dfrac{n\pi}4$인 수열 $\{a_n\}$에 대하여 $A=\left(\dfrac23\right)^{100}$일 때, $\displaystyle\sum_{n=1}^{100}a_n$의 값을 $A$에 대한 식으로 나타내시오.
  points: 11
  depends_on: []
  answer:
    kind: expression
    value: 3/65*(A-1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.1]
    steps:
    - id: 1b-1
      content: $n$을 4로 나누었을 때의 나머지에 따라 분류해 보자. $n=4k-3$이면 $\sin^2\dfrac{(4k-3)\pi}4=\sin^2\dfrac\pi4=\dfrac12$, $n=4k-2$이면 $\sin^2\dfrac{(4k-2)\pi}4=\sin^2\dfrac\pi2=1$, $n=4k-1$이면 $\sin^2\dfrac{(4k-1)\pi}4=\sin^2\dfrac{3\pi}4=\dfrac12$, $n=4k$이면 $\sin^2\dfrac{4k\pi}4=\sin^2\pi=0$이다.
      criteria: [1.R1]
    - id: 1b-2
      content: 이므로 $\displaystyle\sum_{n=1}^{100}\left(-\dfrac23\right)^n\sin^2\dfrac{n\pi}4=\sum_{k=1}^{25}\left\{\left(-\dfrac23\right)^{4k-3}\dfrac12+\left(-\dfrac23\right)^{4k-2}+\left(-\dfrac23\right)^{4k-1}\dfrac12\right\}=\sum_{k=1}^{25}\left(-\dfrac{27}{16}+\dfrac94-\dfrac34\right)\left(-\dfrac23\right)^{4k}=-\dfrac3{16}\sum_{k=1}^{25}\left(\dfrac23\right)^{4k}$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: 따라서 $\displaystyle\sum_{n=1}^{100}\left(-\dfrac23\right)^n\sin^2\dfrac{n\pi}4=-\dfrac3{16}\cdot\dfrac{\left(\dfrac23\right)^4\left\{1-\left(\dfrac23\right)^{100}\right\}}{1-\left(\dfrac23\right)^4}=\dfrac3{65}(A-1)$이다.
      criteria: [1.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: $n$을 4로 나눈 나머지에 따라 $\sin^2\dfrac{n\pi}4$의 값 $\dfrac12,1,\dfrac12,0$을 구했다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 네 항씩 묶어 공비 $\left(\dfrac23\right)^4$인 등비수열의 합으로 나타냈다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 등비수열의 합으로 $\dfrac3{65}(A-1)$을 구했다.
      depends_on:
      - 1.M1
      steps: [1b-3]
