- id: '2'
  stem: 7개의 자리가 있고 이웃한 자리들 사이의 거리는 모두 같은 원탁이 있다. 이 원탁에 A, B, C 세 사람이 둘러앉을 때, A가 C보다 B에 더 가까이 앉을 확률을 구하시오. (단, 회전하여 일치하는 것은 같은 것으로 본다.)
  points: 11
  depends_on: []
  answer:
    kind: value
    value: 2/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2~3 [1.2]
    steps:
    - id: 2b-1
      content: A가 앉은 다음 B와 C가 앉는 방법은 아래와 같이 세 가지 경우로 나누어 생각할 수 있다.
      criteria: [2.R1]
    - id: 2b-2
      content: (i) B가 A의 옆자리에 앉은 경우, B는 6자리 중 2자리에 앉을 수 있고 C는 5자리 중 4자리에 앉을 수 있으므로 확률은 $\dfrac26\times\dfrac45=\dfrac4{15}$이다.
      criteria: [2.M1]
    - id: 2b-3
      content: (ii) B가 A와 한 칸 떨어져 앉은 경우, B는 6자리 중 2자리에 앉을 수 있고 C는 5자리 중 2자리에 앉을 수 있으므로 확률은 $\dfrac26\times\dfrac25=\dfrac2{15}$이다.
      criteria: [2.M1]
    - id: 2b-4
      content: (iii) B가 A와 두 칸 이상 떨어져 앉은 경우, C는 주어진 조건에 맞도록 앉을 수 없다. 따라서 구하는 확률은 $\dfrac{4+2}{15}=\dfrac25$이다.
      criteria: [2.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: B가 앉는 위치(A의 옆, 한 칸 떨어짐, 두 칸 이상 떨어짐)에 따라 경우를 나누었다.
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: (i), (ii)의 확률 $\dfrac4{15},\dfrac2{15}$를 구했다.
      steps: [2b-2, 2b-3]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: (iii)이 불가능함을 밝히고 합 $\dfrac25$를 구했다.
      depends_on:
