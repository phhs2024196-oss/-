# 소문항 배점 미공개 — 추정 (문제 2는 33%이며 소문항 11점씩)
subparts:
- id: '1'
  stem: '[그림 1]에서 삼각형 OPQ의 넓이가 최대가 되는 점 Q의 $x$좌표가 $u+v\sqrt w$일 때, $uvw$의 값을 구하시오. (단, $u$와 $v$는 유리수이고, $w$는 소수인 자연수이다.)'
  points: 11
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [2.1]
    steps:
    - id: 1b-1
      content: 점 P와 Q의 $x$좌표를 각각 $2-\alpha$와 $2+\alpha$라 하고 삼각형 OPQ의 넓이를 $A(\alpha)$라고 하면, 선분 PQ의 길이는 $2+\alpha-(2-\alpha)=2\alpha$이고 높이는 $b=-(2-\alpha)^2+4(2-\alpha)=-\alpha^2+4$이므로 $A(\alpha)=\dfrac12\times2\alpha\times b=\alpha b=\alpha(-\alpha^2+4)=-\alpha^3+4\alpha$이다.
      criteria: [1.R1]
    - id: 1b-2
      content: $0<\alpha<2$일 때 $A'(\alpha)=-3\alpha^2+4=0$에서 $\alpha=\dfrac23\sqrt3$이다. $0<\alpha<2$에서 $A(\alpha)$의 증가와 감소를 표로 나타내면 $\alpha=\dfrac23\sqrt3$의 좌우에서 $A'(\alpha)$의 부호가 $+$에서 $-$로 바뀐다(증가 후 감소).
      criteria: [1.M1]
    - id: 1b-3
      content: 따라서 $\alpha=\dfrac23\sqrt3$일 때 $A(\alpha)$가 최대가 되고, 이때 점 Q의 $x$좌표는 $2+\alpha=2+\dfrac23\sqrt3$이다. 따라서 $uvw=2\times\dfrac23\times3=4$이다.
      criteria: [1.A1]
  - id: S1-B2
    audience: B
    method_no: 2
    source_flow: 출제배경 및 해설 p.5 [2.1] 별해
    steps:
    - id: 1c2-1
      content: 점 P와 Q의 $x$좌표를 각각 $\alpha$와 $\beta$라고 하면, $\alpha$와 $\beta$는 $-x^2+4x=b$의 두 근이다. 따라서 $\alpha+\beta=4$이므로 $\alpha=4-\beta$이다. 여기서 $0<\alpha<2$, $2<\beta<4$이다. 삼각형 OPQ의 넓이를 $A(\beta)$라고 하면 $A(\beta)=\dfrac12(\beta-\alpha)(-\beta^2+4\beta)=-\beta^3+6\beta^2-8\beta$이다.
      criteria: []
    - id: 1c2-2
      content: $2<\beta<4$일 때 $A'(\beta)=-3\beta^2+12\beta-8=0$에서 $\beta=\dfrac{6+2\sqrt3}3$이다. $2<\beta<4$에서 $A(\beta)$의 증가와 감소를 표로 나타내면 이 값의 좌우에서 $+$에서 $-$로 바뀐다.
      criteria: []
    - id: 1c2-3
      content: 따라서 $\beta=2+\dfrac23\sqrt3$일 때 최대가 되므로 $uvw=2\times\dfrac23\times3=4$이다.
      criteria: []
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: 두 교점을 $2\mp\alpha$(또는 근과 계수의 관계)로 나타내고 삼각형의 넓이 $A(\alpha)=-\alpha^3+4\alpha$를 세웠다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $A'(\alpha)=0$에서 $\alpha=\dfrac23\sqrt3$를 구하고 증감표로 최대임을 보였다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 점 Q의 $x$좌표 $2+\dfrac23\sqrt3$에서 $uvw=4$를 구했다.
      depends_on:
      - 1.M1
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
