- id: '3'
  stem: '[그림 2]에서 $0<x<3$일 때, 곡선 $y=-x^2+4x$ 위의 점 S와 직선 OT 사이의 거리의 최댓값을 구하시오.'
  points: 11
  depends_on: []
  answer:
    kind: value
    value: 9*sqrt(2)/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5~6 [2.3]
    steps:
    - id: 3b-1
      content: 점 S에서 접선의 기울기가 1일 때 선분 SH의 길이가 최대이다. $y'=-2x+4=1$로부터 $x=\dfrac32$일 때 접선의 기울기가 1이고, 점 S의 좌표는 $\left(\dfrac32,\dfrac{15}4\right)$이다. 따라서 이때 선분 SH의 길이는 $\overline{\mathrm{SH}}=\dfrac{\frac{15}4-\frac32}{\sqrt2}=\dfrac98\sqrt2$이다.
      criteria: [3.R1, 3.M1, 3.A1]
  - id: S3-B2
    audience: B
    method_no: 2
    source_flow: 출제배경 및 해설 p.6 [2.3] 별해
    steps:
    - id: 3c2-1
      content: 직선 OT의 방정식은 $x-y=0$이다. 점 S의 좌표를 $(t,-t^2+4t)$라 하면 선분 SH의 길이는 $\overline{\mathrm{SH}}=\dfrac{\lvert t+t^2-4t\rvert}{\sqrt2}=\dfrac{\lvert t^2-3t\rvert}{\sqrt2}$이다. 그런데 $0<t<3$이므로 $\overline{\mathrm{SH}}=\dfrac{-t^2+3t}{\sqrt2}=\dfrac1{\sqrt2}\left\{-\left(t-\dfrac32\right)^2+\dfrac94\right\}$이다. 따라서 선분 SH 길이의 최댓값은 $\dfrac9{4\sqrt2}=\dfrac98\sqrt2$이다.
      criteria: []
