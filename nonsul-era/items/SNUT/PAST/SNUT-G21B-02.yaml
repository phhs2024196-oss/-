  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [2.2]
    steps:
    - id: 2b-1
      content: 점 T의 좌표는 $(3,3)$이고 직선 OT의 방정식은 $y=x$이므로 넓이 $S$는 $S=\displaystyle\int_0^3(-x^2+4x-x)\,dx=\left[-\dfrac13x^3+\dfrac32x^2\right]_0^3=\dfrac92$이다.
      criteria: [2.R1, 2.M1, 2.A1]
  - id: S2-B2
    audience: B
    method_no: 2
    source_flow: 출제배경 및 해설 p.5 [2.2] 별해
    steps:
    - id: 2c2-1
      content: 0에서 3까지 곡선 아래의 넓이에서 점 O, 점 T, 점 $(3,0)$으로 이루어진 삼각형의 넓이를 빼면 된다. 따라서 구하는 넓이 $S$는 $S=\displaystyle\int_0^3(-x^2+4x)\,dx-\dfrac12\times3\times3=\left[-\dfrac13x^3+2x^2\right]_0^3-\dfrac92=\dfrac92$이다.
      criteria: []
