stimuli:
- label: 가
  body: |
    [그림 1]과 같이 $0<b<4$일 때, 직선 $y=b$와 곡선 $y=-x^2+4x$가 만나는 두 교점을 각각 P와 Q라 하자. (단, 점 Q의 $x$좌표는 점 P의 $x$좌표보다 크다.)
- label: 나
  body: |
    [그림 2]와 같이 $x=3$일 때, 곡선 $y=-x^2+4x$ 위의 점을 T라 하자.
- label: 다
  body: |
    [그림 1]과 [그림 2]에서 점 O는 원점이다.
    [그림 1] 위로 볼록한 포물선 $y=-x^2+4x$와 수평선 $y=b$의 왼쪽 교점 P, 오른쪽 교점 Q. 원점 O, P, Q를 꼭짓점으로 하는 삼각형 OPQ의 영역을 음영 표시.
    [그림 2] 포물선 $y=-x^2+4x$와 $x=3$에서의 점 T(점선으로 $x$축의 3까지 내림), 원점 O에서 T를 지나는 직선 OT. 곡선과 직선 OT로 둘러싸인 영역을 음영 표시.
