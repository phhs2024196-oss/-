intent: 자연수들의 거듭제곱의 합과 자연수들의 합의 거듭제곱이 같기 위한 조건을 찾을 수 있는지 확인한다. 풀이 과정에서 제시문과 수학 지식을 적절히 이용해야 하며, 주어진 식을 적절히 변형하고 정적분의 개념을 활용하여 원하는 결과를 도출할 수 있는지 평가한다. 3.1은 거듭제곱과 지수방정식의 해, 3.2는 제시문 (가)와 도함수를 이용한 해의 개수, 3.3은 유리식 수열의 극한, 3.4는 제시문 (나)와 정적분(구분구적)을 이용한 조건 도출을 본다.
key_idea: 3.2 양변에 로그를 취해 $f(x)=2\ln x-x\ln2$의 감소성으로 해가 $x=4$ 하나임을 보인다. 3.3 분자·분모의 차수를 비교해 $2s=r+1$. 3.4 양변을 $n^{r+1}$로 나눈 급수의 극한을 정적분 $\displaystyle\int_0^1x^rdx=\dfrac1{r+1}$로 바꿔 $(r+1)^2=2^{r+1}$을 얻는다.
stuck: 3.2 $\ln x_1=\ln x_2\iff x_1=x_2$로 방정식을 $2\ln x=x\ln2$로 바꾸는 단계, 3.3 극한값이 0이 아니려면 분자·분모의 차수가 같아야 함, 3.4 구분구적법의 합 $\dfrac1n\sum\left(\dfrac kn\right)^r$을 만들어 정적분으로 바꾸는 단계
idea_tags: [IDEA-POWER-SUM-EQ-SUM-POWER-INTEGRAL, IDEA-LOG-MONOTONE-UNIQUE-ROOT]
tags: [지수방정식, 로그의 단조성, 수열의 극한, 정적분과 급수의 합 사이의 관계]
elements:
  materials:
  - 방정식 $x^2=2^x$($x\ge3$)
  - $\displaystyle\lim_{n\to\infty}\dfrac{\{n(n+1)\}^s}{n^{r+1}}$
  - 등식 $1^r+2^r+\cdots+n^r=(1+2+\cdots+n)^s$
  concepts:
  - 지수·로그함수의 성질
  - 도함수와 함수의 감소
  - 유리식 수열의 극한
  - 정적분과 급수의 합 사이의 관계
  - 자연수의 거듭제곱의 합
  tools:
  - $\ln x_1=\ln x_2\iff x_1=x_2$
  - $f(x)=2\ln x-x\ln2$의 감소성($\ln2=0.7$)
  - 분자·분모 차수 비교
  - $\displaystyle\lim_{n\to\infty}\sum_{k=1}^n\left(\dfrac kn\right)^r\dfrac1n=\int_0^1x^rdx$
  conditions:
  - 3.2 $x\ge3$에서 $f'(x)=\dfrac2x-\ln2<0$(필요하면 $\ln2=0.7$)
  - 3.3 극한값이 존재하고 0이 아님
  - 3.4 $r\ge2$이고 3.3의 관계식을 만족
  - 모든 자연수 $n$에 대하여 성립
  stimuli_used: [가, 나, 다]
  subpart_links: 3.1의 해 $x=4$로 3.2에서 유일성을 보이고, 3.3의 관계식 $2s=r+1$과 3.2의 결과가 3.4에서 $r=3$을 결정한다.
