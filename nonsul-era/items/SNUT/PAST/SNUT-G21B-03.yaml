- id: '2'
  stem: 제시문 (가)를 이용하여, $x\ge3$일 때 방정식 $x^2=2^x$의 해의 개수를 구하시오. (필요하면 $\ln2=0.7$로 계산한다.)
  points: 8
  depends_on: ['1']
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.7 [3.2]
    steps:
    - id: 2b-1
      content: 제시문 (가)를 이용하면 $x^2=2^x\iff\ln x^2=\ln2^x$이고 $2\ln x=x\ln2$를 만족한다. 이때 $f(x)=2\ln x-x\ln2,\ x\ge3$이라 하면 $f'(x)=\dfrac2x-\ln2<0$이므로 $f(x)$는 감소함수이다.
      criteria: [2.R1, 2.M1]
    - id: 2b-2
      content: 그런데 $f(4)=0$이므로 $f(x)=2\ln x-x\ln2=0$의 해는 $x=4$ 하나이다. 즉, $x^2=2^x$의 해는 $x=4$ 하나뿐이다.
      criteria: [2.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: 제시문 (가)로 방정식을 $f(x)=2\ln x-x\ln2=0$으로 바꾸었다.
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: $f'(x)<0$($x\ge3$)으로 $f$가 감소함수임을 보였다.
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: $f(4)=0$에서 해가 $x=4$ 하나뿐임을 밝혔다.
      depends_on:
      - 2.M1
      steps: [2b-2]
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: $\displaystyle\lim_{n\to\infty}\dfrac{\{n(n+1)\}^s}{n^{r+1}}$의 극한값이 존재하고 0이 아닐 때, 자연수 $r$과 $s$의 관계식과 극한값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: 2*s = r + 1, 1
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.7 [3.3]
    steps:
    - id: 3b-1
      content: 분자는 $2s$차이고 분모는 $r+1$차이므로 $2s=r+1$일 때 0이 아닌 극한값이 존재한다. 이때 $\displaystyle\lim_{n\to\infty}\dfrac{\{n(n+1)\}^s}{n^{r+1}}=\lim_{n\to\infty}\dfrac{\{n(n+1)\}^s}{n^{2s}}=\lim_{n\to\infty}\left(\dfrac{n+1}n\right)^s=1$이다.
      criteria: [3.R1, 3.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.R1
      mark_type: R
      points: 4
      evidence: 분자와 분모의 차수를 비교하여 관계식 $2s=r+1$을 구했다.
      steps: [3b-1]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: 극한값 1을 구했다.
      depends_on:
      - 3.R1
      steps: [3b-1]
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '4'
  stem: |
    $r$과 $s$가 문항 [3.3]에서 구한 관계식을 만족할 때, 모든 자연수 $n$에 대하여
    $$1^r+2^r+\cdots+n^r=(1+2+\cdots+n)^s$$
    을 만족하는 2보다 크거나 같은 자연수 $r$의 개수를 구하시오.
  points: 9
  depends_on: ['2', '3']
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.7 [3.4]
    steps:
    - id: 4b-1
      content: 주어진 관계식의 우변은 $\left(\dfrac{n(n+1)}2\right)^s$이다. 양변을 모두 $n^{r+1}$로 나누면 $\dfrac1n\left\{\left(\dfrac1n\right)^r+\left(\dfrac2n\right)^r+\cdots+\left(\dfrac nn\right)^r\right\}=\dfrac1{2^s}\dfrac{\{n(n+1)\}^s}{n^{r+1}}$이고, 제시문 (나)에 의하여 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^n\left(\dfrac kn\right)^r\dfrac1n=\dfrac1{2^s}\lim_{n\to\infty}\dfrac{\{n(n+1)\}^s}{n^{r+1}}$이다.
      criteria: [4.R1]
    - id: 4b-2
      content: 정적분과 급수 사이의 관계와 문항 [3.3]의 결과를 이용하면 $\displaystyle\int_0^1x^r\,dx=\dfrac1{2^s}$이므로 $\dfrac1{r+1}=\dfrac1{2^s}$이고 $(r+1)^2=2^{2s}=2^{r+1}$이다.
      criteria: [4.M1]
    - id: 4b-3
      content: 문항 [3.2]에 의해 $r\ge2$일 때 이 방정식의 해는 $r=3$ 하나뿐이다. 따라서 구하는 $r$의 개수는 1이다.
      criteria: [4.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 4.R1
      mark_type: R
      points: 3
      evidence: 양변을 $n^{r+1}$로 나누어 구분구적 꼴의 합과 제시문 (나)로 극한을 비교했다.
      steps: [4b-1]
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: 정적분 $\displaystyle\int_0^1x^rdx=\dfrac1{r+1}$로 $(r+1)^2=2^{r+1}$을 얻었다.
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 3
      evidence: '[3.2]의 결과($x\ge3$에서 $x^2=2^x$의 해는 4뿐)로 $r=3$, 개수 1을 구했다.'
      depends_on:
      - 4.M1
      steps: [4b-3]
    deductions:
    - code: D4-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D4-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
