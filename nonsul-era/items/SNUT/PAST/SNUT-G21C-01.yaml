intent: 고등학교 과정 수학에서 다루는 기본적인 내용에 대한 이해도를 평가한다. 1.1은 삼각함수의 덧셈정리를 활용해 새로운 형태로 변형하고 적용하는 능력, 1.2는 극한의 개념과 로그함수를 활용해 극한값을 계산하기 위한 조건을 찾는 능력, 1.3은 주어진 자료를 토대로 두 사건이 서로 독립인지 종속인지 판별하는 능력을 본다.
key_idea: 1.1 덧셈정리로 $\sin(x+\alpha)$를 전개하고 $x=0,\dfrac\pi2$를 대입한다. 1.2 $r=\dfrac2{\log_2k}$로 치환해 $0<r\le2$에서 $\dfrac{r^{n+1}}{999+r^n}$의 극한을 $r$의 값에 따라 구한다. 1.3 분할표로 $P(A\cap B)$와 $P(A)P(B)$를 비교한다.
stuck: 1.1 항등식 조건을 특수한 $x$ 값 대입으로 바꾸는 단계, 1.2 $k$가 짝수 자연수이므로 $r$의 범위가 $0<r\le2$임을 알아보는 단계, 1.3 제시문 (가)(나)(다)로 $2\times2$ 분할표를 완성하는 단계
