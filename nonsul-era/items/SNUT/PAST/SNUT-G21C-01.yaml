stem: 다음 물음에 답하시오.
# 소문항 배점 미공개 — 추정 (문제 1은 34%이며 소문항 11/11/12점으로 가름)
subparts:
- id: '1'
  stem: 모든 실수 $x$에 대하여 $\sin x+A\cos x-2\sin(x+\alpha)=0$이 성립할 때, $\alpha$와 $A$의 값을 구하시오. (단, $A$는 양수, $0\le\alpha<2\pi$)
  points: 11
  depends_on: []
  answer:
    kind: value
    value: (pi/3, sqrt(3))
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.1]
    steps:
    - id: 1b-1
      content: 삼각함수의 덧셈공식 $\sin(x+\alpha)=\sin x\cos\alpha+\cos x\sin\alpha$로부터 다음을 만족하는 $\alpha$와 $A$를 구한다. $\sin x+A\cos x=2\sin x\cos\alpha+2\cos x\sin\alpha$
      criteria: [1.R1]
    - id: 1b-2
      content: $x=\dfrac\pi2$를 대입하면 $1=2\cos\alpha$이므로 $\cos\alpha=\dfrac12$이다. $x=0$을 대입하면 $A=2\sin\alpha$이므로 $\sin\alpha=\dfrac A2$이다.
      criteria: [1.M1]
    - id: 1b-3
      content: $\sin^2\alpha+\cos^2\alpha=1$, $\dfrac14+\dfrac{A^2}4=1$이므로 $A=\sqrt3$이다($A>0$). 따라서 $\sin\alpha=\dfrac{\sqrt3}2$, $\cos\alpha=\dfrac12$이다. 즉, $\alpha=\dfrac\pi3$, $A=\sqrt3$이다.
      criteria: [1.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: 덧셈정리로 $\sin(x+\alpha)$를 전개하여 $\sin x$, $\cos x$의 계수를 비교하는 식을 세웠다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $x=\dfrac\pi2$, $x=0$을 대입해 $\cos\alpha=\dfrac12$, $\sin\alpha=\dfrac A2$를 구했다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $A=\sqrt3$, $\alpha=\dfrac\pi3$를 구했다.
      depends_on:
      - 1.M1
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    짝수인 자연수 $k$에 대하여 다음 극한값을 모두 구하시오.
    $$\lim_{n\to\infty}\dfrac{\left(\dfrac2{\log_2k}\right)^{n+1}}{999+\left(\dfrac2{\log_2k}\right)^n}$$
  points: 11
  depends_on: []
  answer:
    kind: set
    value: '{0, 1/1000, 2}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.2]
    steps:
    - id: 2b-1
      content: $r=\dfrac2{\log_2k}$라 치환하면, 주어진 문제는 $\displaystyle\lim_{n\to\infty}\dfrac{r^{n+1}}{999+r^n}$의 극한을 구하는 것이다. 문제의 조건에서 $k\ge2$이므로 $0<r\le2$임을 알 수 있다.
      criteria: [2.R1]
    - id: 2b-2
      content: 따라서 양의 실수 $r$에 대하여 극한값은 $0<r<1$이면 $0$, $r=1$이면 $\dfrac1{1000}$, $r=2$이면 $2$이다. 그러므로 짝수인 자연수 $k$에 대해 극한값은 $0,\ \dfrac1{1000},\ 2$이다.
      criteria: [2.M1, 2.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: $r=\dfrac2{\log_2k}$로 치환하고 $0<r\le2$임을 보였다.
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: $r$의 값($0<r<1$, $r=1$, $r=2$)에 따라 극한을 분류해 구했다.
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 극한값 $0,\dfrac1{1000},2$를 모두 구했다.
      depends_on:
      - 2.M1
      steps: [2b-2]
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    다음은 어느 대학의 한 학과 400명의 나이와 개인용 컴퓨터 소유여부를 파악한 결과이다.
    (가) 나이가 20세 이상인 사람은 150명이다.
    (나) 개인용 컴퓨터가 없는 사람은 60명이다.
    (다) 나이가 20세 이상이며, 개인용 컴퓨터가 없는 사람은 30명이다.
    400명 중 임의로 선택한 한 명이 개인용 컴퓨터를 갖고 있는 사건을 $A$, 임의로 선택한 한 명이 나이 20세 미만인 사건을 $B$라 하자. 사건 $A$와 사건 $B$가 서로 독립인지 종속인지 판별하시오.
  points: 12
  depends_on: []
  answer:
    kind: choice
    value: 종속
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.3]
    steps:
    - id: 3b-1
      content: '제시문으로부터 다음 표를 얻을 수 있다. [표] 행: 20세 미만(B) / 20세 이상 / 합, 열: 개인용 컴퓨터 있음(A) / 없음 / 합 → 20세 미만(B): 220, 30, 250 / 20세 이상: 120, 30, 150 / 합: 340, 60, 400.'
      criteria: [3.R1]
    - id: 3b-2
      content: $P(A)=\dfrac{340}{400}$, $P(B)=\dfrac{250}{400}$, $P(A\cap B)=\dfrac{220}{400}$이고, $P(A)P(B)=\dfrac{340}{400}\times\dfrac{250}{400}\ne\dfrac{220}{400}=P(A\cap B)$이므로 사건 $A$와 사건 $B$는 서로 종속사건이다.
      criteria: [3.M1, 3.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
