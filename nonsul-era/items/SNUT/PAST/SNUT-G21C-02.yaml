# 소문항 배점 미공개 — 추정 (문제 2는 33%이며 소문항 11점씩)
subparts:
- id: '1'
  stem: |
    양수 $r$에 대하여 다음 정적분의 값을 구하시오.
    $$\int_0^1\left(x^r+x^{\frac1r}\right)dx$$
  points: 11
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.1]
    steps:
    - id: 1b-1
      content: 구하고자 하는 적분값은 $\displaystyle\int_0^1\left(x^r+x^{\frac1r}\right)dx=\left[\dfrac1{r+1}x^{r+1}+\dfrac r{r+1}x^{\frac{r+1}r}\right]_0^1=1$이다.
      criteria: [1.R1, 1.M1, 1.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: 각 항의 부정적분 $\dfrac1{r+1}x^{r+1}$, $\dfrac r{r+1}x^{\frac{r+1}r}$를 구했다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 정적분 $\left[\ \right]_0^1$을 계산했다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 값 1을 구했다.
      depends_on:
      - 1.M1
      steps: [1b-1]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    집합 $X=\{x\mid0\le x\le1\}$일 때 함수 $f:X\to X$가 닫힌구간 $[0,1]$에서 연속이고, 열린구간 $(0,1)$에서 미분가능하며 다음을 만족한다.
    i) $0<x<1$인 모든 실수 $x$에 대하여, $f'(x)>0$
    ii) $f(0)=0,\ f\left(\dfrac23\right)=\dfrac57,\ f(1)=1$
    곡선 $y=f(x)$와 $x$축 및 두 직선 $x=\dfrac23,\ x=1$로 둘러싸인 도형의 넓이를 $A_1$, 곡선 $y=f^{-1}(x)$와 $x$축 및 두 직선 $x=\dfrac57,\ x=1$로 둘러싸인 도형의 넓이를 $A_2$라 하자. $A_1+A_2$를 $\dfrac qp$로 나타내시오. (단, $p$와 $q$는 서로소인 자연수)
  points: 11
  depends_on: []
  answer:
    kind: value
    value: 11/21
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.2]
    steps:
    - id: 2b-1
      content: '주어진 함수와 역함수가 표현하는 도형들 사이의 관계로부터 구하는 넓이는 $A_1+A_2=\displaystyle\int_{\frac23}^1f(x)\,dx+\int_{\frac57}^1f^{-1}(x)\,dx=1-\dfrac23\times\dfrac57=\dfrac{11}{21}$이다. [그림] 해설지 그림: $y=f(x)$의 증가 곡선, $x=\dfrac23$에서 $x=1$까지 곡선 아래의 영역 $A_1$, $y=\dfrac57$에서 $y=1$까지 곡선 왼쪽의 영역 $A_2$로 두 영역과 점 $\left(\dfrac23,\dfrac57\right)$, $(1,1)$.'
      criteria: [2.R1, 2.M1, 2.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: $f$와 $f^{-1}$의 그래프가 $y=x$에 대하여 대칭이므로 $A_2$가 $f$의 그래프와 $y$축 방향 영역의 넓이임을 보였다.
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: 두 영역의 합이 $1\times1-\dfrac23\times\dfrac57$임을 세웠다.
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $\dfrac{11}{21}$을 구했다.
      depends_on:
      - 2.M1
      steps: [2b-1]
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: 음이 아닌 실수 전체의 집합을 정의역과 공역으로 하는 함수 $f(x)=\sqrt x\,e^{\sqrt x}$에 대하여, 곡선 $y=f^{-1}(x)$와 $x$축 및 두 직선 $x=e$, $x=2e^2$으로 둘러싸인 도형의 넓이를 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: 4*exp(2)+E
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3~4 [2.3]
    steps:
    - id: 3b-1
      content: 구하는 넓이를 $A$라 하면 $A=\displaystyle\int_e^{2e^2}f^{-1}(x)\,dx$이다. $f'(x)=\dfrac1{2\sqrt x}e^{\sqrt x}+\dfrac12e^{\sqrt x}>0$이므로 $f(x)$는 증가하고 일대일대응이다. $f(1)=e$이고 $f(4)=2e^2$이다.
      criteria: [3.R1]
    - id: 3b-2
      content: '함수와 역함수 그래프들의 대칭성으로부터 $A=\displaystyle\int_e^{2e^2}f^{-1}(x)\,dx=8e^2-e-\int_1^4f(x)\,dx$이다. [그림] 해설지 그림: $y=f(x)$, $x=1$에서 $y=e$, $x=4$에서 $y=2e^2$, 직사각형 $[0,4]\times[0,2e^2]$ 안에서 $A$(회색)와 $\displaystyle\int_1^4f(x)dx$(진회색)의 영역.'
      criteria: [3.M1]
    - id: 3b-3
      content: 부분적분법을 이용하여 적분을 구하면 $\displaystyle\int_1^4f(x)\,dx=\int_1^4\sqrt x\,e^{\sqrt x}\,dx=\left[2xe^{\sqrt x}\right]_1^4-2\int_1^4e^{\sqrt x}\,dx=\left[2xe^{\sqrt x}\right]_1^4-2\left(\left[2\sqrt x\,e^{\sqrt x}\right]_1^4-\int_1^4\dfrac1{\sqrt x}e^{\sqrt x}\,dx\right)=4e^2-2e$이므로 $A=8e^2-e-(4e^2-2e)=4e^2+e$이다.
      criteria: [3.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: $f$가 증가하여 역함수가 존재하고 $f(1)=e$, $f(4)=2e^2$임을 확인했다.
      steps: [3b-1]
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: 대칭성으로 $A=8e^2-e-\displaystyle\int_1^4f(x)dx$를 세웠다.
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: 부분적분으로 $\displaystyle\int_1^4f(x)dx=4e^2-2e$를 구하고 $A=4e^2+e$를 얻었다.
      depends_on:
      - 3.M1
      steps: [3b-3]
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
