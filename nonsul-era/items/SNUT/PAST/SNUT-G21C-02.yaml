intent: 함수로 표현되는 도형의 넓이와 그 역함수로 표현되는 도형의 넓이의 관계를 이해하고 있는지, 정적분 값을 구하는 과정에서 치환적분법·부분적분법 등 여러 가지 적분법을 올바르게 적용하는지 평가한다. 2.1은 함수와 역함수의 합으로 주어진 도형의 넓이, 2.2는 주어진 조건을 만족하는 함수와 그 역함수로 표현되는 넓이의 관계, 2.3은 역함수를 구하기 어려운 함수의 역함수로 표현된 넓이를 함수의 넓이와의 관계로 구하는 능력을 본다.
key_idea: $y=f(x)$와 $y=f^{-1}(x)$의 그래프가 직선 $y=x$에 대하여 대칭임을 이용하여 역함수의 넓이를 직사각형 넓이에서 원래 함수의 넓이를 뺀 값으로 바꾼다. 2.3은 $A=8e^2-e-\displaystyle\int_1^4f(x)dx$이고 부분적분(치환)으로 $\displaystyle\int_1^4\sqrt x\,e^{\sqrt x}dx=4e^2-2e$.
stuck: 2.2 $A_2$를 $f$의 그래프의 넓이로 옮기는 대칭 변환, 2.3 $f^{-1}$을 구하지 않고 $x=1\to e$, $x=4\to2e^2$ 대응으로 적분 구간을 바꾸는 단계와 $\sqrt x$ 치환 후 부분적분
