stimuli:
- label: 가
  body: |
    함수 $f(x)$가 어떤 열린구간에서 미분가능하고 이 구간에 속하는 모든 실수 $x$에 대하여 $f'(x)>0$이면, 함수 $f(x)$는 이 구간에서 증가한다.
- label: 나
  body: |
    함수 $f:X\to Y$가 일대일대응일 때, 역함수 $f^{-1}:Y\to X$가 존재한다.
- label: 다
  body: |
    함수 $y=f(x)$의 그래프와 역함수 $y=f^{-1}(x)$의 그래프는 직선 $y=x$에 대하여 대칭이다.
