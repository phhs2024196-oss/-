- id: '4'
  stem: $b=2R$이고 $0\le t\le t_\mathrm{Q}$일 때, 점 A의 속력을 $R,\ \omega,\ t$에 대한 식으로 나타내시오. 이 결과로 얻은 점 A의 속력에 대하여, 점 A가 점 P에서 출발하여 점 Q에 도착한다고 할 때 점 A는 $x$축에 가까워질수록 속력이 감소하고, $x$축을 지나 점 Q에 가까워질수록 속력이 증가함을 보이시오.
  points: 9
  depends_on: ['3']
  answer:
    kind: proof
    value: 3*R*omega/2*sec(omega*t - pi/6)**2
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5~6 [3.4]
    steps:
    - id: 4b-1
      content: 시각 $t$에서 점 A가 선분 PQ 위를 움직이는 속력을 $v(t)$라 하면, 문제 [3.3]에서 구한 시각 $t$에서의 점 A의 $y$축 좌표를 $y(t)$라 할 때, $v(t)=\left\lvert\dfrac{dy(t)}{dt}\right\rvert=\dfrac{3R\omega}2\sec^2\left(\omega t-\dfrac\pi6\right)$이다.
      criteria: [4.M1]
    - id: 4b-2
      content: $\cos\left(\omega t-\dfrac\pi6\right)$는 $\cos$함수의 성질에 의하여 $0<\omega t<\dfrac\pi6$ 구간에서 증가함수이며, $\dfrac\pi6<\omega t<\dfrac\pi3$ 구간에서 감소함수이다. 따라서 $\sec^2\left(\omega t-\dfrac\pi6\right)$는 $0<t<\dfrac{t_\mathrm{Q}}2$ 구간에서 감소함수이며, $\dfrac{t_\mathrm{Q}}2<t<t_\mathrm{Q}$ 구간에서는 증가함수이므로, 점 A의 속력은 $0<t<\dfrac{t_\mathrm{Q}}2$ 구간인 점 P에서 출발하여 $x$축에 가까워질수록 감소하며, 시간 $\dfrac{t_\mathrm{Q}}2<t<t_\mathrm{Q}$ 구간인 $x$축을 지나 점 Q에 가까워질수록 증가함을 알 수 있다.
      criteria: [4.R1]
