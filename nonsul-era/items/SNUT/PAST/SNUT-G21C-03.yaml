- id: '3'
  stem: $b=2R$이고 $0\le t\le t_\mathrm{Q}$일 때, 점 A의 $y$좌표를 $R,\ \omega,\ t$에 대한 식으로 나타내시오.
  points: 8
  depends_on: ['2']
  answer:
    kind: expression
    value: 3*R/2*tan(omega*t - pi/6)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.3]
    steps:
    - id: 3b-1
      content: 시각 $t$에서 선분 OC가 $x$축의 양의 방향과 이루는 각의 크기는 $\omega t$이다. 따라서 시각 $t$에서의 선분 OA가 $x$축의 양의 방향과 이루는 각의 크기는 $t=0$일 때의 각의 크기에서 $\omega t$만큼 증가한다. $t=0$에서 선분 OA가 $x$축의 양의 방향과 이루는 각의 크기는 $\angle\mathrm{POD}=-\dfrac{\omega t_\mathrm{Q}}2=-\dfrac\pi6$이므로, 시각 $t$에서 선분 OA가 $x$축의 양의 방향과 이루는 각의 크기는 $\omega t-\dfrac\pi6$이다.
      criteria: [3.R1]
    - id: 3b-2
      content: '선분 PQ와 $x$축이 만나는 점을 E라 하면, $0\le t\le t_\mathrm{Q}$일 때 점 A의 $y$축 좌표는 $\overline{\mathrm{OE}}\tan\left(\omega t-\dfrac\pi6\right)$이다. $\overline{\mathrm{OE}}$를 구하기 위해 삼각형 OQE와 삼각형 ODQ의 닮음을 이용하면 $\overline{\mathrm{OQ}}:\overline{\mathrm{OD}}=\overline{\mathrm{OE}}:\overline{\mathrm{OQ}}$에서 $\overline{\mathrm{OQ}}=\sqrt{b^2-R^2}=\sqrt3R$이므로 $\overline{\mathrm{OE}}=\dfrac{b^2-R^2}b=\dfrac{3R}2$이다. 따라서 시각 $0\le t\le t_\mathrm{Q}$에서 점 A의 $y$축 좌표는 $\overline{\mathrm{OE}}\tan\left(\omega t-\dfrac\pi6\right)=\dfrac{3R}2\tan\left(\omega t-\dfrac\pi6\right)$이다. [그림] 해설지 그림: 원 $M$(중심 C), 직선 $l_1$이 선분 PQ와 만나는 점 A, PQ와 $x$축의 교점 E, 점 D, 점 O.'
      criteria: [3.M1, 3.A1]
