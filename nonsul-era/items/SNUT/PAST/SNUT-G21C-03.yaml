      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 4
      evidence: $y(t)$를 미분하여 $v(t)=\dfrac{3R\omega}2\sec^2\left(\omega t-\dfrac\pi6\right)$를 구했다.
      steps: [4b-1]
    - id: 4.R1
