stimuli:
- label: 가
  body: |
    원 $x^2+y^2=a^2$ 위의 점 C가 점 $(a,0)$에서 출발하여 원 위를 시계바늘이 도는 반대 방향으로 점 $(0,a)$까지 움직인다. 점 C의 시각 $t$에서의 위치 $(x,y)$는 $x=a\cos\omega t,\ y=a\sin\omega t$이다. (단, $a>0,\ \omega>0,\ 0\le t\le\dfrac\pi{2\omega}$)
- label: 나
  body: |
    (가)에서의 점 C를 중심으로 하고 반지름의 길이가 $r$인 원 $M$이 있다. 원점 O를 지나고 원 $M$에 접하는 두 접선 중 기울기가 작은 접선을 $l_1$, 기울기가 큰 접선을 $l_2$라 하자. 시각 $t$에 따라 점 C의 위치가 변하므로 원 $M$ 및 직선 $l_1$, 직선 $l_2$도 위치가 변한다. (단, $r<a$)
- label: 다
  body: |
    중심이 $(b,0)$이고 반지름의 길이가 $R$인 원 $S$가 있다. 시각 $t=0$일 때의 직선 $l_1$, 직선 $l_2$는 아래 [그림 1]과 같이 원 $S$에 접한다. 이때, 원 $S$와 직선 $l_1$이 접하는 점을 P, 원 $S$와 직선 $l_2$가 접하는 점을 Q라 하자. 선분 OP가 $x$축의 양의 방향과 이루는 각의 크기는 $-\dfrac\pi2$보다 크고 0보다 작다. (단, $b>a+r+R$)
- label: 라
  body: |
    시각 $t=t_\mathrm{Q}$일 때, 원 $S$와 직선 $l_1$은 아래 [그림 3]과 같이 점 Q에서 접한다. [그림 2]와 같이 시각 $t$에 대하여 $0\le t\le t_\mathrm{Q}$일 때, 직선 $l_1$과 선분 PQ의 교점을 A라 하자.
    [그림 1] 시각 $t=0$인 경우: 점선 원(반지름 $a$, 중심 O) 위의 점 C$(a,0)$에 작은 원 $M$, 원점 O에서 원 $M$에 접하는 두 직선 $l_1$(아래), $l_2$(위)이 오른쪽의 큰 원 $S$(중심 $(b,0)$, 반지름 $R$)에도 접하며 접점은 아래쪽이 P, 위쪽이 Q(접점에 직각 표시, $x$축 위 $a$, $b$, 반지름 $R$ 표시). C는 반시계 방향으로 이동한다는 화살표.
    [그림 2] 시각 $0\le t\le t_\mathrm{Q}$인 경우: C와 원 $M$이 $(0,a)$ 쪽으로 이동했고 직선 $l_1$이 선분 PQ와 점 A에서 만나며 $l_2$는 위로 올라가 있다.
    [그림 3] 시각 $t=t_\mathrm{Q}$인 경우: $l_1$이 원 $S$와 점 Q에서 접하고 $l_2$는 더 위로 올라가 있다.
