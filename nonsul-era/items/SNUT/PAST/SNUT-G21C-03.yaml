intent: 간단한 수학적 모델링을 이용하면 복잡한 자연현상을 설명할 수 있다. 학생들이 주어진 수학적 모델을 이해하고 분석할 수 있는 능력을 갖추고 있는지 확인한다. 3.1은 평면기하학의 기본원리, 3.2는 삼각함수의 정의, 3.3은 호도각의 원리와 이를 이용한 좌표평면의 표현, 3.4는 삼각함수의 기본 특성과 미분의 의미를 이해하고 있는지 평가한다.
key_idea: 원점에서 두 원에 그은 접선의 사잇각의 반이 같음 → $\dfrac rR=\dfrac ab$. $b=2R$이면 $\sin\dfrac{\omega t_Q}2=\dfrac12$, 점 A의 $y$좌표는 $\overline{\mathrm{OE}}\tan\left(\omega t-\dfrac\pi6\right)=\dfrac{3R}2\tan\left(\omega t-\dfrac\pi6\right)$, 속력은 이를 미분한 $\dfrac{3R\omega}2\sec^2\left(\omega t-\dfrac\pi6\right)$.
stuck: 3.1 원점에서 두 원에 그은 접선이 만드는 닮은 직각삼각형을 찾는 단계, 3.2 시각 $t_Q$에서 $l_1$이 $\mathrm{OQ}$와 일치함을 이용해 $\angle\mathrm{QOP}=\omega t_Q$로 놓는 단계, 3.3 $t=0$에서 $l_1$의 각이 $-\dfrac\pi6$이고 $\omega t$만큼 증가함을 표현하는 단계, 3.4 속력 함수의 증가·감소 구간을 $\cos$의 증감으로 판정하는 단계
idea_tags: [IDEA-ROTATING-TANGENT-LINE-SEGMENT-POINT-SPEED, IDEA-SIMILAR-TRIANGLES-TANGENT-CIRCLES]
tags: [접선, 삼각함수, 속도와 가속도, 수학적 모델링]
