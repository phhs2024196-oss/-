- id: '2'
  stem: $e$보다 큰 상수 $a$에 대하여 두 곡선 $y=\log_{\ln a}x,\ y=\log_{\frac1{\ln a}}x$와 직선 $x=e^2$으로 둘러싸인 도형의 넓이를 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: expression
    value: 2*(exp(2)+1)/log(log(a))
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.2]
    steps:
    - id: 2b-1
      content: 로그의 성질에 의하여 $y=\log_{\frac1{\ln a}}x=-\log_{\ln a}x$이고 $\ln a>1$이므로 두 곡선은 $x=1$에서 만난다. 또 $x>1$이면 $\log_{\ln a}x>0$이고, 두 곡선은 $x$축에 대하여 대칭이다. 따라서 구하는 넓이 $A$는 $A=2\displaystyle\int_1^{e^2}\log_{\ln a}x\,dx=\dfrac2{\ln(\ln a)}\int_1^{e^2}\ln x\,dx$이다.
      criteria: [2.R1, 2.M1]
    - id: 2b-2
      content: 여기서 부분적분을 이용하면 $\displaystyle\int_1^{e^2}\ln x\,dx=\left[x\ln x\right]_1^{e^2}-\int_1^{e^2}1\,dx=2e^2-(e^2-1)=e^2+1$이다. 따라서 구하는 넓이는 $A=\dfrac{2(e^2+1)}{\ln(\ln a)}$이다.
      criteria: [2.M1, 2.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: 두 곡선이 $x$축에 대하여 대칭이고 $x=1$에서 만남을 이용해 $A=2\displaystyle\int_1^{e^2}\log_{\ln a}x\,dx$를 세웠다.
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: 밑변환 $\dfrac{\ln x}{\ln(\ln a)}$와 부분적분으로 $\displaystyle\int_1^{e^2}\ln x\,dx=e^2+1$을 구했다.
      steps: [2b-1, 2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 넓이 $\dfrac{2(e^2+1)}{\ln(\ln a)}$를 구했다.
      depends_on:
      - 2.M1
      steps: [2b-2]
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: 빗변의 길이가 10이고 $\angle\mathrm B$가 직각인 직각삼각형 ABC에서 세 변의 길이의 합을 $l_1$이라 하고 내접원 둘레의 길이를 $l_2$라 할 때, $\dfrac{l_2}{l_1}$가 최대가 되는 $\angle\mathrm A$와 $\angle\mathrm C$의 크기를 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: (pi/4, pi/4)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2~3 [1.3]
    steps:
    - id: 3b-1
      content: $\theta=\angle\mathrm C$라 하면 $\overline{\mathrm{AB}}=10\sin\theta$이고 $\overline{\mathrm{BC}}=10\cos\theta$이므로 $l_1=10(\cos\theta+\sin\theta+1)$이다.
      criteria: [3.R1]
    - id: 3b-2
      content: '내접원의 반지름을 $r$이라 하면 $(10\cos\theta-r)+(10\sin\theta-r)=10$이므로 $r=5(\cos\theta+\sin\theta-1)$이고 $l_2=10\pi(\cos\theta+\sin\theta-1)$이다. [그림] 해설지 그림: 직각삼각형 ABC(B가 직각), 내접원(반지름 $r$)이 변 AB, BC, CA에 접하고 접점에서 꼭짓점까지의 길이가 $10\sin\theta-r$(A쪽), $10\cos\theta-r$(C쪽), 빗변 10. 따라서 $\dfrac{l_2}{l_1}=\dfrac{\pi(\cos\theta+\sin\theta-1)}{\cos\theta+\sin\theta+1},\ 0<\theta<\dfrac\pi2$이다.'
      criteria: [3.R1]
    - id: 3b-3
      content: 삼각함수의 덧셈정리에 의하여 $\cos\theta+\sin\theta=\sqrt2\left(\cos\theta\sin\dfrac\pi4+\sin\theta\cos\dfrac\pi4\right)=\sqrt2\sin\left(\theta+\dfrac\pi4\right)$이고 $\dfrac\pi4<\theta+\dfrac\pi4<\dfrac{3\pi}4$이다. $t=\sin\left(\theta+\dfrac\pi4\right)$라 하면 $\dfrac{l_2}{l_1}=\dfrac{\pi(\sqrt2t-1)}{\sqrt2t+1},\ \dfrac1{\sqrt2}<t\le1$이 최대가 되는 때를 구하면 된다.
      criteria: [3.M1]
    - id: 3b-4
      content: 그런데 $\dfrac{l_2}{l_1}=\pi\left(1-\dfrac2{\sqrt2t+1}\right)$이므로 $t=\sin\left(\theta+\dfrac\pi4\right)=1$일 때, 즉, $\theta=\dfrac\pi4$일 때 최대가 되고 이때 $\angle\mathrm A=\angle\mathrm C=\dfrac\pi4$이다.
      criteria: [3.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.R1
      mark_type: R
      points: 4
      evidence: $\overline{\mathrm{AB}},\overline{\mathrm{BC}}$로 $l_1=10(\cos\theta+\sin\theta+1)$을, 내접원 반지름으로 $l_2=10\pi(\cos\theta+\sin\theta-1)$을 구했다.
      steps: [3b-1, 3b-2]
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: 덧셈정리로 $\cos\theta+\sin\theta=\sqrt2\sin\left(\theta+\dfrac\pi4\right)$로 합성하고 $t$에 대한 식 $\dfrac{\pi(\sqrt2t-1)}{\sqrt2t+1}$로 나타냈다.
      steps: [3b-3]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: $t$가 최대일 때 $\theta=\dfrac\pi4$, $\angle\mathrm A=\angle\mathrm C=\dfrac\pi4$를 구했다.
      depends_on:
      - 3.M1
      steps: [3b-4]
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
