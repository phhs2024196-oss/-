intent: 수학을 배우는 목적 중 하나는 수학 지식과 이해력을 변형된 조건에 응용하여 문제를 푸는 능력을 배양하는 데 있다. 이 문제는 여러 가지 수학공식을 이해하고 주어진 문제에 대해 확대 적용하여 원하는 답을 얻어낼 수 있는지 묻는다. 1.1은 삼각함수의 기본 성질로 이차함수의 최대·최소를 구하는 능력, 1.2는 로그의 밑과 진수의 관계를 이해하고 정적분하는 능력, 1.3은 삼각함수로 삼각형의 세 변의 길이의 합과 내접원의 둘레의 길이의 비를 구하고 최솟값(최댓값)을 구하는 능력(덧셈정리 활용)을 평가한다.
key_idea: 1.1 $\sin^2\theta=1-\cos^2\theta$, $\sin\left(\theta+\dfrac\pi2\right)=\cos\theta$로 $\cos\theta$에 대한 이차함수로 바꾼다. 1.2 두 곡선이 $x$축에 대하여 대칭이므로 넓이는 $2\displaystyle\int_1^{e^2}\log_{\ln a}x\,dx$. 1.3 $l_1=10(\cos\theta+\sin\theta+1)$, 내접원 반지름 $r=5(\cos\theta+\sin\theta-1)$로 두고 $\cos\theta+\sin\theta=\sqrt2\sin\left(\theta+\dfrac\pi4\right)$.
stuck: 1.1 $\cos\theta$ 범위 $-1\le\cos\theta\le1$에서의 이차함수 최대·최소, 1.2 $\log_{1/\ln a}x=-\log_{\ln a}x$로 바꾸어 대칭성을 이용하는 단계, 1.3 직각삼각형의 내접원 반지름을 $r=5(\cos\theta+\sin\theta-1)$로 표현하고 덧셈정리로 합성하는 단계
