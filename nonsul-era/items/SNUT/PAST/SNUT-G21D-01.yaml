stem: 다음 물음에 답하시오.
# 소문항 배점 미공개 — 추정 (문제 1은 34%이며 소문항 11/11/12점으로 가름)
subparts:
- id: '1'
  stem: |
    다음 함수의 최댓값이 11, 최솟값이 2일 때 $ab$의 값을 구하시오. (단, $a>0,\ 0\le\theta<2\pi$)
    $$f(\theta)=a\sin^2\theta+a\sin\left(\theta+\dfrac\pi2\right)+b+1$$
  points: 11
  depends_on: []
  answer:
    kind: value
    value: '20'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.1]
    steps:
    - id: 1b-1
      content: $\sin^2\theta=1-\cos^2\theta$이고 $\sin\left(\theta+\dfrac\pi2\right)=\cos\theta$이므로 $f(\theta)=-a\cos^2\theta+a\cos\theta+a+b+1=-a\left(\cos\theta-\dfrac12\right)^2+\dfrac{5a}4+b+1,\ -1\le\cos\theta\le1$이다.
      criteria: [1.R1]
    - id: 1b-2
      content: 따라서 $\cos\theta=\dfrac12$일 때 최댓값 $\dfrac{5a}4+b+1=11$을 갖고, $\cos\theta=-1$일 때 최솟값 $-a+b+1=2$를 가지므로 $a=4,\ b=5$이다. 따라서 $ab=20$이다.
      criteria: [1.M1, 1.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: $\cos\theta$에 대한 이차식 $-a\left(\cos\theta-\dfrac12\right)^2+\dfrac{5a}4+b+1$ ($-1\le\cos\theta\le1$)로 나타냈다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 최대(cosθ=1/2)·최소(cosθ=-1)의 두 식 $\dfrac{5a}4+b+1=11$, $-a+b+1=2$를 세웠다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $a=4$, $b=5$에서 $ab=20$을 구했다.
      depends_on:
      - 1.M1
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
