intent: 함수의 미분을 통해 주어진 자료를 설명하는 함수에 대한 여러 정보를 알아낼 수 있다. 원하는 정보를 얻기 위해 함수의 도함수를 이용하는 능력을 평가한다. 2.1은 수학적 직관으로 제시문의 조건을 활용하는 능력, 2.2는 제시된 함수식을 분석하고 앞서 구한 결과를 대입하는 능력, 2.3은 도함수의 정의를 정확히 이해하고 제시된 함수에 적용하는 능력, 2.4는 제시문과 정적분의 성질을 이용해 원하는 값을 얻는 능력을 본다.
key_idea: $f(x+y)=\dfrac{f(x)+f(y)}{1+7f(x)f(y)}$에 $y=-x$를 넣어 $f$가 기함수임을 얻고, 도함수의 정의에 대입하여 $f'(x)=f'(0)\left[1-7\{f(x)\}^2\right]$를 얻는다. 이를 이용해 $\{f(x)\}^2=\dfrac17\{1-f'(x)\}$로 바꾸어 정적분한다.
stuck: 2.3 도함수의 정의에 함수방정식을 대입하고 $\dfrac{f(\Delta x)}{\Delta x}\to f'(0)$, $f(\Delta x)\to0$을 쓰는 단계, 2.4 $(1+7\alpha^2)\{f(x)\}^2$을 $f'(x)$로 바꾸어 적분하는 단계
