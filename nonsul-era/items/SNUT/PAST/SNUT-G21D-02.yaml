    source_flow: 출제배경 및 해설 p.4 [2.2]
    steps:
    - id: 2b-1
      content: $y=-x$라 하면 $0=f(0)=f(x+(-x))=\dfrac{f(x)+f(-x)}{1+7f(x)f(-x)}$이므로 $f(-x)=-f(x)$이고, $f$는 기함수이다. 따라서 $\displaystyle\int_{-1}^1f(x)\,dx=0$이다.
      criteria: [2.R1, 2.A1]
  rubric:
