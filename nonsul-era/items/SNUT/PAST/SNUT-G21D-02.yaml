      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: 기함수의 성질로 $\displaystyle\int_{-1}^1f(x)dx=0$을 구했다.
      depends_on:
      - 2.R1
      steps: [2b-1]
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
