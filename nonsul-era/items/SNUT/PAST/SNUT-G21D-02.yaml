  (제시문 상자의 첫머리) 모든 실수 $x$에서 미분가능한 함수 $f(x)$가 다음 조건을 만족한다.
# 소문항 배점 미공개 — 추정 (문제 2는 33%이며 소문항 8/8/8/9점으로 가름)
