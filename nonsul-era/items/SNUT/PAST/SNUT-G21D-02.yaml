- id: '3'
  stem: |
    $f(x)$의 도함수 $f'(x)$를 다음 형태로 나타냈을 때, 상수 $A,\ B,\ C$의 값을 구하시오.
    $$f'(0)\times\left[A\{f(x)\}^2+Bf(x)+C\right]$$
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: (-7, 0, 1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [2.3]
    steps:
    - id: 3b-1
      content: 제시문 (다)의 조건을 도함수의 정의에 적용하면 $f'(x)=\displaystyle\lim_{\Delta x\to0}\dfrac{f(x+\Delta x)-f(x)}{\Delta x}=\lim_{\Delta x\to0}\dfrac{\dfrac{f(x)+f(\Delta x)}{1+7f(x)f(\Delta x)}-f(x)}{\Delta x}$이고, 정리하면 $f'(x)=\displaystyle\lim_{\Delta x\to0}\left[\dfrac{f(\Delta x)}{\Delta x}\times\dfrac{1-7\{f(x)\}^2}{1+7f(x)f(\Delta x)}\right]$이다.
      criteria: [3.R1]
    - id: 3b-2
      content: 그런데 $\displaystyle\lim_{\Delta x\to0}\dfrac{f(\Delta x)}{\Delta x}=f'(0)$이고 $f(x)$는 연속이므로 $\displaystyle\lim_{\Delta x\to0}f(\Delta x)=f(0)=0$이다. 따라서 $f'(x)=f'(0)\times\left[-7\{f(x)\}^2+1\right]$이므로 $A=-7,\ B=0,\ C=1$이다.
      criteria: [3.M1, 3.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: 도함수의 정의에 (다)를 대입해 $f'(x)=\displaystyle\lim\left[\dfrac{f(\Delta x)}{\Delta x}\times\dfrac{1-7\{f(x)\}^2}{1+7f(x)f(\Delta x)}\right]$로 정리했다.
      steps: [3b-1]
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: $\displaystyle\lim\dfrac{f(\Delta x)}{\Delta x}=f'(0)$, $f(\Delta x)\to0$을 이용했다.
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: $A=-7,B=0,C=1$을 구했다.
      depends_on:
      - 3.M1
      steps: [3b-2]
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '4'
  stem: |
    $f'(0)=1$일 때, $f(2)$와 다음 정적분의 값을 모두 $\alpha$에 대한 식으로 나타내시오.
    $$\int_0^2(1+7\alpha^2)\{f(x)\}^2dx$$
  points: 9
  depends_on: ['3']
  answer:
    kind: expression
    value: (2*alpha/(1+7*alpha**2), 2*alpha**2 - 2*alpha/7 + 2/7)
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [2.4]
    steps:
    - id: 4b-1
      content: $x=y=1$이라 하면 $f(2)=f(1+1)=\dfrac{f(1)+f(1)}{1+7f(1)f(1)}=\dfrac{2\alpha}{1+7\alpha^2}$이다.
      criteria: [4.R1]
    - id: 4b-2
      content: 문항 [2.3]의 결과에서 $\{f(x)\}^2=\dfrac17\{1-f'(x)\}$이므로 $\displaystyle\int_0^2(1+7\alpha^2)\{f(x)\}^2dx=\dfrac{1+7\alpha^2}7\int_0^2\{1-f'(x)\}dx=\dfrac{1+7\alpha^2}7\left[x-f(x)\right]_0^2=\dfrac{1+7\alpha^2}7\{2-f(2)\}$이다.
      criteria: [4.M1]
    - id: 4b-3
      content: 그런데 $f(2)=\dfrac{2\alpha}{1+7\alpha^2}$이므로 $\displaystyle\int_0^2(1+7\alpha^2)\{f(x)\}^2dx=\dfrac{1+7\alpha^2}7\left\{2-\dfrac{2\alpha}{1+7\alpha^2}\right\}=2\alpha^2-\dfrac27\alpha+\dfrac27$이다.
      criteria: [4.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 4.R1
      mark_type: R
      points: 3
      evidence: $x=y=1$ 대입으로 $f(2)=\dfrac{2\alpha}{1+7\alpha^2}$을 구했다.
      steps: [4b-1]
    - id: 4.M1
      mark_type: M
      points: 3
      evidence: '[2.3]의 결과로 $\{f(x)\}^2=\dfrac17\{1-f''(x)\}$를 이용해 정적분을 $\dfrac{1+7\alpha^2}7\{2-f(2)\}$로 나타냈다.'
      steps: [4b-2]
    - id: 4.A1
      mark_type: A
      points: 3
      evidence: 정적분 값 $2\alpha^2-\dfrac27\alpha+\dfrac27$을 구했다.
      depends_on:
      - 4.M1
      steps: [4b-3]
    deductions:
    - code: D4-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D4-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
