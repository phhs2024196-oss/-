  materials:
  - 정사각형 $S$의 네 변과 격자점 $(a,b)$를 중심으로 하는 반지름 $r$인 원
  - 주머니 A, B에서 꺼낸 정수 $a,b$와 주머니 C의 구슬 개수 $X$
  - 표준정규분포표 $\mathrm P(0\le Z\le z)$
  concepts:
