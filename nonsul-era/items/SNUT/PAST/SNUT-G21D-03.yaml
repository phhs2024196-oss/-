intent: 주어진 상황에서 나타나는 경우의 수를 바탕으로 확률을 계산한다. 확률변수의 개념을 도입하여 이산확률분포를 구하고 이항분포와 정규분포 사이의 관계를 이용하여 확률을 구할 수 있는지 묻는다. 3.1은 경우의 수, 3.2는 경우의 수를 바탕으로 한 확률, 3.3은 이항분포에서의 확률, 3.4는 특정한 경우에서 이항분포의 확률을 통해 기댓값과 분산을 구하고 정규분포와의 관계를 이용해 확률을 계산하는 능력을 평가한다.
key_idea: 3.1 원의 중심 $(a,b)$가 정사각형 $S$로부터 $r+1$ 이상 떨어져 있으면 만나지 않는다 → $\{l-2(r+1)\}^2$. 3.2 $p=\dfrac{l^2-\{l-2(r+1)\}^2}{l^2}$. 3.3 $X\sim\mathrm B\left(4,\dfrac34\right)$. 3.4 $X\sim\mathrm B\left(1200,\dfrac34\right)\approx\mathrm N(900,15^2)$로 근사.
stuck: 3.1 원과 정사각형(네 변)이 만나지 않을 조건을 중심에서 $S$까지의 거리 $\ge r+1$(정수 좌표)로 바꾸어 세는 단계, 3.3 시행을 독립 반복으로 보고 이항분포 $\mathrm B\left(4,\dfrac34\right)$를 식별하는 단계
idea_tags: [IDEA-CIRCLE-MEETS-SQUARE-LATTICE-COUNT-BINOMIAL, IDEA-BINOMIAL-NORMAL-APPROX-TABLE]
