stimuli:
- label: 가
  body: |
    $l$과 $r$은 $r<\dfrac l2-1$ 관계를 만족하는 자연수이다.
- label: 나
  body: |
    좌표평면에 네 점 $(0,0)$, $(l-1,0)$, $(l-1,l-1)$, $(0,l-1)$을 꼭짓점으로 하는 정사각형의 네 변을 $S$라 한다.
- label: 다
  body: |
    주머니 A와 B에는 각각 0부터 $l-1$까지의 정수가 하나씩 적힌 $l$개의 공이 들어 있다. 두 주머니에서 임의로 한 개씩 공을 꺼냈을 때 주머니 A에서 꺼낸 공에 적힌 정수 $a$, 주머니 B에서 꺼낸 공에 적힌 정수 $b$를 확인하고 다시 넣는다.
- label: 라
  body: |
    제시문 (다)에서 확인한 두 정수 $a,b$에 대하여, 좌표평면에서 점 $(a,b)$를 중심으로 하고 반지름의 길이가 $r$인 원이 $S$와 만나는 경우에만 주머니 C에 구슬을 한 개 넣는다. (단, 주머니 C는 처음에는 비어 있다.)
