stem: |
  다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    수열 $\{a_n\}$과 $\{b_n\}$에 대하여 $b_1=1$이고 $a_n^{b_n}=e$ ($e$는 자연상수)이다. 수열 $\left\{\dfrac1{b_n}\right\}$이 공차가 $\ln\dfrac23$인 등차수열일 때, 급수 $\displaystyle\sum_{n=1}^{\infty}a_n$의 합을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: 3*E
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: |
        $b_1=1$이므로 $a_1=e$이다. $a_n^{b_n}=e$의 양변에 자연로그를 취하면 $b_n\ln a_n=1$이다. $\ln a_n=\dfrac1{b_n}$이고 $\left\{\dfrac1{b_n}\right\}$이 공차가 $\ln\dfrac23$인 등차수열이므로
      criteria:
      - 1.R1
    - id: 1b-2
      content: |
        $\ln a_{n+1}=\ln a_n+\ln\dfrac23$, 즉 $a_{n+1}=\dfrac23a_n$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $\{a_n\}$은 첫째항이 $e$이고 공비가 $\dfrac23$인 등비수열이므로
        $$\sum_{n=1}^{\infty}a_n=\dfrac{e}{1-\dfrac23}=3e$$
        이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        $a_n^{b_n}=e$에 로그를 취해 $\ln a_n=\dfrac1{b_n}$을 얻고 $a_1=e$를 밝혔다.
      steps:
      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $\ln a_{n+1}-\ln a_n=\ln\dfrac23$에서 $a_{n+1}=\dfrac23a_n$(첫째항 $e$, 공비 $\dfrac23$인 등비수열)을 얻었다.
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        등비급수의 합 $\dfrac{e}{1-\frac23}=3e$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    원점에서 출발하여 수직선 위를 움직이는 점 P의 시각 $t$에서의 위치는
    $$x=f(t)=2\cos(at+b)+2\quad(a>0,\ 0\le b\le2\pi\text{인 상수})$$
    이다. 점 P의 시각 $t$에서의 속도 $v=f'(t)$는 최댓값이 3이고, 음이 아닌 모든 실수 $t$에 대하여 $c(x-2)^2+2v^2=d$ ($c$, $d$는 상수)가 성립할 때, $a+b+c+d$의 값을 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: pi+24
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.2]
    steps:
    - id: 2b-1
      content: |
        $t=0$일 때 $x=0$이므로 $f(0)=2\cos b+2=0$이고 $b=\pi$이다.
      criteria:
      - 2.R1
    - id: 2b-2
      content: |
        $v=f'(t)=2a\sin at$의 최댓값은 $2a$이므로 $a=\dfrac32$이다. 즉
        $$x=2\cos\left(\dfrac32t+\pi\right)+2=-2\cos\left(\dfrac32t\right)+2,\qquad v=3\sin\left(\dfrac32t\right)$$
        이다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        이를 $c(x-2)^2+2v^2=d$에 대입하면
        $$4c\cos^2\left(\dfrac32t\right)+18\sin^2\left(\dfrac32t\right)=d$$
        이다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        $t=\dfrac\pi3$이면 $d=18$, $t=0$이면 $4c=d$ 즉 $c=\dfrac92$이다. 따라서
        $$a+b+c+d=\dfrac32+\pi+\dfrac92+18=\pi+24$$
        이다.
      criteria:
      - 2.M2
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        출발점 조건 $f(0)=0$으로부터 $b=\pi$를 구했다.
      steps:
      - 2b-1
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        속도 $v=2a\sin at$의 최댓값 $2a=3$으로 $a=\dfrac32$를 구하고 $x$, $v$를 $t$로 나타냈다.
      steps:
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $x$, $v$를 대입해 $4c\cos^2\left(\frac32t\right)+18\sin^2\left(\frac32t\right)=d$를 얻고 특정 $t$를 대입해 $c,d$를 구했다.
      steps:
      - 2b-3
      - 2b-4
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $a+b+c+d=\pi+24$를 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-4
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    자연수 $a,\ b,\ c,\ d$에 대하여 $a(b+c+d)=14$를 만족하는 순서쌍 $(a,b,c,d)$의 개수를 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: '93'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1~2 [1.3]
    steps:
    - id: 3b-1
      content: |
        14의 약수는 $1,2,7,14$로 모두 4개이며, $b+c+d\ge3$이므로 $a$는 1 또는 2이다.
      criteria:
      - 3.R1
    - id: 3b-2
      content: |
        $a=1$일 때, $b+c+d=14$를 만족하는 자연수 $b,c,d$의 순서쌍의 개수는
        $${}_3\mathrm{H}_{14-3}={}_{13}\mathrm{C}_{11}=78$$
        이다.
      criteria:
      - 3.M1
    - id: 3b-3
      content: |
        마찬가지로 $a=2$일 때, $b+c+d=7$을 만족하는 자연수 $b,c,d$의 순서쌍의 개수는
        $${}_3\mathrm{H}_{7-3}={}_6\mathrm{C}_4=15$$
        이다.
      criteria:
      - 3.M1
    - id: 3b-4
      content: |
        따라서 조건을 만족하는 순서쌍 $(a,b,c,d)$는 총 $78+15=93$개이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        $b+c+d\ge3$과 약수 조건으로 $a\in\{1,2\}$임을 보였다.
      steps:
      - 3b-1
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $a=1$, $a=2$ 각각에 대해 중복조합으로 $b,c,d$의 순서쌍 개수 $78$, $15$를 구했다.
      steps:
      - 3b-2
      - 3b-3
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        두 경우를 더해 $93$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-4
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
