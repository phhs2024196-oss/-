intent: |
  지수·로그의 성질로 주어진 수열이 등비수열임을 밝혀 등비급수의 합을 구하는 능력, 삼각함수로 주어진 위치·속도에서 미지수를 찾는 능력, 주어진 조건을 만족하는 자연수 순서쌍의 개수를 중복조합으로 세는 능력을 본다.
key_idea: |
  $a_n^{b_n}=e$에 자연로그를 취하면 $\ln a_n=\dfrac1{b_n}$이므로 $\{\ln a_n\}$이 등차수열이고 $\{a_n\}$은 첫째항 $e$, 공비 $\dfrac23$인 등비수열이다. 위치 $x=2-2\cos\left(\dfrac32t\right)$와 속도 $v=3\sin\left(\dfrac32t\right)$를 대입해 $c,d$를 정한다. 약수 성질로 $a\in\{1,2\}$로 줄이고 중복조합으로 센다.
stuck: |
  [1.1] 로그를 취해 $\ln a_n=\dfrac1{b_n}$로 바꾸는 단계, [1.2] 항등식 $c(x-2)^2+2v^2=d$에서 특정 $t$를 대입해 $c,d$를 정하는 단계, [1.3] $a$가 14의 약수이고 $b+c+d\ge3$이므로 $a\in\{1,2\}$로 줄이는 단계
