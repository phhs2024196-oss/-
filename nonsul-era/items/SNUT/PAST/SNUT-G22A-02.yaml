intent: |
  좌표평면 위에 놓인 도형을 식으로 바꾸어 방정식을 풀고, 코사인법칙·덧셈정리·사인법칙을 활용해 삼각형의 각과 외접원의 반지름을 구하는 능력을 본다.
key_idea: |
  $\mathrm{A}(\sqrt{25-t^2},t)$, $\mathrm{B}(\sqrt{64-t^2},t)$이고 $\overline{\mathrm{OA}}=\overline{\mathrm{AB}}=5$이므로 $\sqrt{64-t^2}-\sqrt{25-t^2}=5$에서 $t=\dfrac{24}5$. 코사인법칙으로 $\cos\theta_1=-\dfrac7{25}$, 이등변삼각형이므로 $\theta_1+2\theta_2=\pi$, 덧셈정리로 $\cos(\theta_1-\theta_2)=\dfrac{44}{125}$, 사인법칙으로 $R=\dfrac{25}6$.
stuck: |
  [2.1] 두 점의 좌표를 $t$로 나타내 $\overline{\mathrm{OA}}=\overline{\mathrm{AB}}=5$를 거리 방정식으로 세우는 단계, [2.2] 이등변삼각형의 각 관계 $\theta_1+2\theta_2=\pi$로 $\cos\theta_2$를 구하는 단계
