stimuli:
- label: 가
  body: |
    실수 $t$ ($0<t<5$)에 대하여 직선 $y=t$가 원 $x^2+y^2=25$, 원 $x^2+y^2=64$와 제1사분면에서 만나는 점을 각각 A, B라고 하자.
    [그림] 좌표평면에 원점 O 중심의 두 사분원(x축과의 교점이 5, 8)과 수평선 $y=t$. 안쪽 원 위의 점 A가 바깥쪽 원 위의 점 B의 왼쪽에 있고, 선분 OA가 그려져 있다.
stem: |
  다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    $\overline{\mathrm{OA}}=\overline{\mathrm{AB}}$일 때, $t$의 값을 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: 24/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [2.1]
    steps:
    - id: 1b-1
      content: |
        점 A의 좌표는 $(\sqrt{25-t^2},t)$, 점 B의 좌표는 $(\sqrt{64-t^2},t)$이고 $\overline{\mathrm{OA}}=5$이므로
        $$\sqrt{64-t^2}-\sqrt{25-t^2}=5$$
        이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        방정식을 풀면 $t=\dfrac{24}5$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        $\overline{\mathrm{AB}}=\sqrt{64-t^2}-\sqrt{25-t^2}$와 $\overline{\mathrm{OA}}=5$로 방정식을 세웠다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        방정식을 풀어 $t=\dfrac{24}5$를 구했다($0<t<5$ 확인).
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    문항 [2.1]에서 구한 $t$에 대하여 $\theta_1=\angle\mathrm{OAB}$, $\theta_2=\angle\mathrm{ABO}$라고 할 때, $\cos(\theta_1-\theta_2)$의 값을 구하시오.
  points: 11
  depends_on:
  - '1'
  answer:
    kind: value
    value: 44/125
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.2]
    steps:
    - id: 2b-1
      content: |
        코사인법칙에 의해
        $$\overline{\mathrm{OB}}^2=\overline{\mathrm{OA}}^2+\overline{\mathrm{AB}}^2-2\overline{\mathrm{OA}}\,\overline{\mathrm{AB}}\cos\theta_1,\qquad 64=25+25-2\times5\times5\cos\theta_1$$
        이고 따라서 $\cos\theta_1=-\dfrac7{25}$이다. 여기서 $\sin\theta_1=\sqrt{1-\left(-\dfrac7{25}\right)^2}=\dfrac{24}{25}$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\cos2\theta_2=\cos(\pi-\theta_1)=-\cos\theta_1=\dfrac7{25}$이고 $\cos2\theta_2=2\cos^2\theta_2-1$이므로 $\cos^2\theta_2=\dfrac{16}{25}$이다. $\theta_2$는 예각이므로 $\cos\theta_2=\dfrac45$이다. 또 $\sin\theta_2=\sqrt{1-\left(\dfrac45\right)^2}=\dfrac35$이다.
        [판독확인: 해설 원문은 중간 식을 $\cos(\theta_2+\theta_2)=2\cos\theta_2\cos\theta_2-1$로 적음(배각공식 $\cos2\theta_2=2\cos^2\theta_2-1$ 의미로 옮김)]
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        따라서
        $$\cos(\theta_1-\theta_2)=\cos\theta_1\cos\theta_2+\sin\theta_1\sin\theta_2=-\dfrac7{25}\times\dfrac45+\dfrac{24}{25}\times\dfrac35=\dfrac{44}{125}$$
        이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        코사인법칙으로 $\cos\theta_1=-\dfrac7{25}$, $\sin\theta_1=\dfrac{24}{25}$를 구했다.
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        $\theta_1+2\theta_2=\pi$와 배각공식으로 $\cos\theta_2=\dfrac45$, $\sin\theta_2=\dfrac35$를 구했다(예각 판단 포함).
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        덧셈정리로 $\cos(\theta_1-\theta_2)=\dfrac{44}{125}$를 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    문항 [2.1]에서 구한 $t$에 대하여 삼각형 AOB의 외접원의 반지름의 길이를 구하시오.
  points: 11
  depends_on:
  - '1'
  - '2'
  answer:
    kind: value
    value: 25/6
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.3]
    steps:
    - id: 3b-1
      content: |
        사인법칙에 의해 삼각형 AOB의 외접원의 반지름의 길이는
        $$\dfrac12\times\dfrac{\overline{\mathrm{OB}}}{\sin\theta_1}=\dfrac12\times\dfrac{8}{\frac{24}{25}}=\dfrac{25}6$$
        이다.
      criteria:
      - 3.M1
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 6
      evidence: |
        사인법칙 $2R=\dfrac{\overline{\mathrm{OB}}}{\sin\theta_1}$(각 $\theta_1$의 대변 $\overline{\mathrm{OB}}=8$)을 세웠다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        $R=\dfrac{25}6$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-1
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
