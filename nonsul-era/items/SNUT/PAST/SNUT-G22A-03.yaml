  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.3]
    steps:
    - id: 3b-1
      content: |
        $\dfrac{dx}{d\theta}=2\theta\cos\theta$, $\dfrac{dy}{d\theta}=2\theta\sin\theta$이고 $\theta$의 범위는 $0\le\theta\le\dfrac\pi2$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        따라서 점 P가 그리는 도형의 길이 $l_1$은
        $$l_1=\int_0^{\frac\pi2}\sqrt{\left(\dfrac{dx}{d\theta}\right)^2+\left(\dfrac{dy}{d\theta}\right)^2}\,d\theta=\int_0^{\frac\pi2}2\theta\,d\theta=\dfrac{\pi^2}4$$
        이다.
      criteria:
      - 3.A1
