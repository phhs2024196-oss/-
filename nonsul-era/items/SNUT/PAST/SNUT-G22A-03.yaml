intent: |
  제시문에 설명된 상황(실을 팽팽하게 당긴 채 움직이는 연필 끝)을 이해하고, 원 위의 점의 좌표를 삼각함수로 나타내 매개방정식을 구하며, 곡선의 길이를 정적분으로 계산하고, 조건에 따라 세 개의 곡선으로 나누어 길이를 구하는 능력을 본다.
key_idea: |
  점 Q의 접선 방향으로 팽팽하게 당긴 실의 길이는 호 QB의 길이 $2\theta$와 같으므로 $\mathrm{P}=\mathrm{Q}+2\theta(\sin\theta,-\cos\theta)=(2(\cos\theta+\theta\sin\theta),\,2(\sin\theta-\theta\cos\theta))$. 곡선의 길이 $\displaystyle\int\sqrt{(dx/d\theta)^2+(dy/d\theta)^2}\,d\theta=\int_0^{\pi/2}2\theta\,d\theta=\dfrac{\pi^2}4$. 모서리를 도는 구간은 반지름이 $2+\pi$, $6+\pi$인 원의 호로 나누어 더한다.
stuck: |
  [3.2] 실이 풀려나온 길이가 호 QB의 길이 $2\theta$임을 알아 P의 위치를 Q에서 접선 방향으로 표현하는 단계, [3.4] 실이 꺾이는 점 $(-2,2)$, A를 중심으로 반지름이 $2+\pi$, $6+\pi$인 원호로 나누는 단계
