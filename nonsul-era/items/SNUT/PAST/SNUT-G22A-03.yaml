  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.4]
    steps:
    - id: 4b-1
      content: |
        정사각형의 윗변에 있는 실이 움직이면 점 P는 반지름의 길이가 $2+\pi$인 원에서 중심각 $\dfrac\pi6$인 호를 따라 움직인 것이므로 이때의 거리 $l_2$는
        $$l_2=(2+\pi)\times\dfrac\pi6=\dfrac\pi3+\dfrac{\pi^2}6$$
        이다.
        [판독확인: 해설 원문의 「정사각형의 윗변」은 도형 윗변(점 $(-2,2)$에서 $(0,2)$까지의 수평선)을 가리키는 것으로 보임. 보충: 실 전체 길이 $6+\pi$ 중 A에서 $(-2,2)$까지가 $\sqrt{(2\sqrt3)^2+2^2}=4$이므로 $(-2,2)$를 중심으로 도는 반지름은 $2+\pi$이고, 선분 A$(-2,2)$의 기울기각이 $\dfrac\pi6$이므로 중심각은 $\dfrac\pi6$]
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        모든 실이 움직여서 점 P가 $x$축과 다시 만날 때까지 반시계방향으로 움직이면 점 P는 반지름의 길이가 $6+\pi$인 원에서 중심각 $\dfrac56\pi$인 호를 따라 움직인 것이므로 이때의 거리 $l_3$는
        $$l_3=(6+\pi)\times\dfrac56\pi=5\pi+\dfrac56\pi^2$$
        이다.
      criteria:
      - 4.M2
    - id: 4b-3
      content: |
        따라서 점 P가 그리는 도형의 길이는
        $$l_1+l_2+l_3=\dfrac{16}3\pi+\dfrac54\pi^2$$
        이다.
      criteria:
      - 4.A1
