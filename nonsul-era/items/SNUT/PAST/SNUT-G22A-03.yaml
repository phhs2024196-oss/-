  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.2]
    steps:
    - id: 2b-1
      content: |
        $\overline{\mathrm{PQ}}$는 호 QB의 길이와 같으므로 $\overline{\mathrm{PQ}}=2\theta$이다. 점 P에서 $y$축에 내린 수선의 발을 H라 하면, $\angle\mathrm{QPH}=\dfrac\pi2-\theta$이고 $0\le\theta\le\dfrac\pi2$이므로
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $$x=2\cos\theta+2\theta\cos\left(\dfrac\pi2-\theta\right)=2(\cos\theta+\theta\sin\theta)$$
        $$y=2\sin\theta-2\theta\sin\left(\dfrac\pi2-\theta\right)=2(\sin\theta-\theta\cos\theta)$$
        이다. 따라서 점 P의 좌표는 $\left(2(\cos\theta+\theta\sin\theta),\ 2(\sin\theta-\theta\cos\theta)\right)$이다.
        [판독확인: 해설 원문은 마지막 줄에서 $\theta\sin\theta$, $\theta\cos\theta$를 $\theta sin\theta$, $\theta cos\theta$처럼 정체로 적음(조판 오기로 보고 바로잡아 옮김)]
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
