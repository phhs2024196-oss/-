      points: 4
      evidence: |
        P의 좌표 $\left(2(\cos\theta+\theta\sin\theta),2(\sin\theta-\theta\cos\theta)\right)$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    deductions:
