- id: '3'
  stem: |
    문항 [3.2]에서 점 Q가 점 B에서 점 $(0,2)$까지 곡선 $y=\sqrt{4-x^2}$ 위를 움직일 때, 점 P가 그리는 도형의 길이를 구하시오.
  points: 8
