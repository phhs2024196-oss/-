stimuli:
- label: 가
  body: |
    아래 그림의 색칠한 부분과 같이 세 직선 $x=-2$, $y=0$, $y=2$와 곡선 $y=\sqrt{4-x^2}\ (0\le x\le2)$로 둘러싸인 도형이 있다.
    길이가 $6+\pi$인 실의 한쪽 끝을 점 $\mathrm{A}(-2-2\sqrt3,0)$에 고정하고, 다른 쪽 끝에는 연필 끝을 매달자. 도형의 둘레를 따라 실을 팽팽하게 당기면 연필 끝은 점 $\mathrm{B}(2,0)$에 놓인다.
    [그림] 점 $\mathrm{A}(-2-2\sqrt3,0)$에서 점 $(-2,2)$까지 굵은 선분, $(-2,2)$에서 $(0,2)$까지 수평 굵은 선분, 점 $(0,2)$에서 $\mathrm{B}(2,0)$까지 사분원의 호(굵은 곡선)가 그려져 있고, $x=-2$, $x$축, $y=2$, 호로 둘러싸인 부분이 색칠되어 있다. 호 위의 점 Q와 연필 끝 P가 표시되고, $\theta$는 $\angle\mathrm{QOB}$이다.
- label: 나
  body: |
    곡선 $y=\sqrt{4-x^2}\ (0\le x\le2)$ 위의 한 점을 Q, $\theta=\angle\mathrm{QOB}$라고 하자.
- label: 다
  body: |
    실을 팽팽하게 당기면서 움직일 때 연필 끝의 위치인 점 P가 그리는 도형을 생각하자.
