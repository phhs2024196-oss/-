intent: |
  접점에서의 접선 조건으로 무리함수의 접선·접점을 구하는 능력, 등비수열의 첫째항과 공비로 등비급수의 합을 구하는 능력, 정적분으로 곡선과 접선이 둘러싸는 도형의 넓이를 구하는 능력을 본다.
key_idea: |
  [1.1] 접점에서 기울기와 함숫값이 같다($a=g'(x)$, $f(x)=g(x)$). [1.2] $\{b_n\}$은 첫째항 $\dfrac1{a_1}$, 공비 $-r$이므로 두 급수 조건에서 $r=\pm\dfrac{\sqrt2}2$. [1.3] 접선 $y=7$과 곡선의 교점 $x=0,6$ 사이의 넓이 $\displaystyle\int_0^6(6x^2-x^3)\,dx=108$.
stuck: |
  [1.1] 접점에서 접선의 기울기와 함숫값이 같다는 두 조건을 모두 세우는 단계, [1.2] $a_2b_1+b_2a_1=0$에서 $\{b_n\}$의 공비가 $-r$임을 알아내는 단계, [1.3] 접선과 곡선의 교점으로 적분 구간을 정하는 단계
