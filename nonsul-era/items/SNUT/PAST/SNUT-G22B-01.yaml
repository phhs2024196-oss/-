stem: |
  다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    $0$이 아닌 실수 $a$에 대하여 직선 $y=ax-3$과 곡선 $y=a\sqrt x$가 접할 때, 접점의 좌표와 $a$의 값을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: set
    value: 접점 (1/4, -6), a=-12
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: |
        $f(x)=ax-3$, $g(x)=a\sqrt x$라 하자. 접점에서의 접선이 $y=f(x)$이므로
        $$a=g'(x)=\dfrac12ax^{-\frac12},\qquad x=\dfrac14$$
        이다.
      criteria:
      - 1.R1
    - id: 1b-2
      content: |
        $f(x)$와 $g(x)$에 $x=\dfrac14$을 대입하면
        $$f\left(\dfrac14\right)=\dfrac a4-3=a\sqrt{\dfrac14}=g\left(\dfrac14\right)$$
        이므로 $a=-12$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        앞서 구한 $x=\dfrac14$과 $a=-12$를 직선의 방정식에 대입하면 $y=-12\times\dfrac14-3=-6$이다. 따라서 접점의 좌표와 상수 $a$는 각각 $\left(\dfrac14,-6\right)$과 $-12$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        접점에서 기울기가 같다는 조건 $a=g^{\prime}(x)$로 접점의 $x$좌표 $\dfrac14$을 구했다.
      steps:
      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        접점에서 함숫값이 같다는 조건으로 $a=-12$를 구했다.
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        접점의 $y$좌표 $-6$을 구해 접점 $\left(\dfrac14,-6\right)$과 $a=-12$를 답했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    두 등비수열 $\{a_n\}$, $\{b_n\}$에 대하여 $a_1b_1=1$이고 $a_2b_1+b_2a_1=0$이다. 수열 $\{c_n\}$은 첫째항이 $b_1$과 같고 공비가 수열 $\{a_n\}$의 공비와 같은 등비수열이고, 수열 $\{d_n\}$은 첫째항이 $a_1$과 같고 공비가 수열 $\{b_n\}$의 공비와 같은 등비수열이다. 급수의 합이
    $$\sum_{n=1}^{\infty}c_n=1,\quad\sum_{n=1}^{\infty}d_n=2$$
    일 때, 급수 $\displaystyle\sum_{n=1}^{\infty}(a_n+2b_n)$의 합을 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: '12'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1~2 [1.2]
    steps:
    - id: 2b-1
      content: |
        수열 $\{a_n\}$의 공비를 $r$이라고 하면 수열 $\{b_n\}$의 첫째항은 $\dfrac1{a_1}$이고 공비는 $-r$이다. 따라서
        $$\sum_{n=1}^{\infty}c_n=\dfrac{\dfrac1{a_1}}{1-r}=1,\qquad\sum_{n=1}^{\infty}d_n=\dfrac{a_1}{1+r}=2\quad(-1<r<1)$$
        이다.
      criteria:
      - 2.R1
    - id: 2b-2
      content: |
        첫 번째 식으로부터 구한 $a_1=\dfrac1{1-r}$을 두 번째 식에 대입하면 $(1-r)(1+r)=\dfrac12$이므로, $r=\dfrac{\sqrt2}2$ 또는 $r=-\dfrac{\sqrt2}2$이다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        $r=\dfrac{\sqrt2}2$일 때, $a_1=2+\sqrt2$이고
        $$\sum_{n=1}^{\infty}a_n+2\sum_{n=1}^{\infty}b_n=\dfrac{a_1}{1-r}+2\dfrac{\dfrac1{a_1}}{1+r}=(6+4\sqrt2)+2(3-2\sqrt2)=12$$
        이다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        마찬가지로 $r=-\dfrac{\sqrt2}2$일 때, $a_1=2-\sqrt2$이고
        $$\sum_{n=1}^{\infty}a_n+2\sum_{n=1}^{\infty}b_n=\dfrac{a_1}{1-r}+2\dfrac{\dfrac1{a_1}}{1+r}=(6-4\sqrt2)+2(3+2\sqrt2)=12$$
        이다. 따라서 구하는 값은 $12$이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: |
        $\{b_n\}$의 첫째항 $\dfrac1{a_1}$, 공비 $-r$을 구하고 두 급수의 합 조건식을 세웠다.
      steps:
      - 2b-1
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        두 식에서 $(1-r)(1+r)=\dfrac12$를 얻어 $r=\pm\dfrac{\sqrt2}2$를 구했다.
      steps:
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $r=\dfrac{\sqrt2}2$일 때 $a_1$과 $\sum(a_n+2b_n)=12$를 구했다.
      steps:
      - 2b-3
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $r=-\dfrac{\sqrt2}2$일 때도 12임을 확인해 답 12를 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-4
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    곡선 $y=x^3-6x^2+7$과 곡선 위의 점 $(0,7)$에서의 접선으로 둘러싸인 도형의 넓이를 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: '108'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.3]
    steps:
    - id: 3b-1
      content: |
        곡선 $y=f(x)=x^3-6x^2+7$의 함수를 미분하면 $f'(x)=3x^2-12x=3x(x-4)$이다. 따라서 점 $(0,7)$에서 곡선에 접하는 접선의 기울기는 0이고 접선의 방정식은 $y=7$이다.
      criteria:
      - 3.R1
    - id: 3b-2
      content: |
        접선 $y=7$과 곡선 $y=f(x)$의 교점의 $x$좌표는 $x^3-6x^2=x^2(x-6)=0$이므로 $x=0,\ x=6$이다. 또한 $y=f(x)$의 증가와 감소를 표로 나타내면 다음과 같다.

        | $x$ | $\cdots$ | 0 | $\cdots$ | 4 | $\cdots$ |
        |---|---|---|---|---|---|
        | $f'(x)$ | + | 0 | − | 0 | + |
        | $f(x)$ | 증가 | 7(극대) | 감소 | −25(극소) | 증가 |

        이므로, $y=f(x)$는 $x=0$에서 극댓값을 갖고, 구간 $0\le x\le6$에서 $y=7$보다 아래에 위치한다.
      criteria:
      - 3.M1
    - id: 3b-3
      content: |
        따라서 구하는 도형의 넓이는
        $$\int_0^6\{7-(x^3-6x^2+7)\}dx=\int_0^6(6x^2-x^3)dx=\left[2x^3-\dfrac{x^4}4\right]_0^6=108$$
        이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: |
        $f^{\prime}(0)=0$으로부터 접선 $y=7$을 구했다.
      steps:
      - 3b-1
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        접선과 곡선의 교점 $x=0,6$을 구하고 $0\le x\le6$에서 곡선이 접선 아래에 있음을 밝혔다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        정적분으로 넓이 $108$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-3
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
