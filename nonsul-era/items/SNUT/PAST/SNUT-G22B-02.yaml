intent: |
  접선의 기울기를 알고 있는 점의 좌표를 구하는 능력, 로그함수의 그래프와 직선이 이루는 도형의 넓이를 부분적분과 로그의 성질로 정리하는 능력, 그 넓이를 나타내는 함수의 최댓값을 미분으로 구하는 능력을 본다.
key_idea: |
  [2.1] 접선 기울기 $\dfrac1x$가 직선 AB의 기울기 $\dfrac{\ln b-\ln a}{b-a}$와 같다. [2.2] 도형의 넓이는 $x$축과 곡선 사이의 넓이에서 두 직각삼각형의 넓이를 뺀 값이다. [2.3] $b=2a$를 대입한 $S(a)$는 $a=\dfrac14$에서 극대이자 최대.
stuck: |
  [2.2] 구하는 도형을 (곡선과 $x$축 사이 넓이)−(삼각형 $\mathrm{A}_1\mathrm{AC}_1$)−(삼각형 $\mathrm{C}_1\mathrm{BB}_1$)로 분해하는 단계, [2.3] $\ln$이 섞인 $S(a)$를 미분해 부호 변화를 판단하는 단계
