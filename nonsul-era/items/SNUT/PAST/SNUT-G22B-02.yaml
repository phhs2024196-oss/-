stimuli:
- label: 가
  body: |
    아래 그림과 같이 곡선 $y=\ln x$ 위에 두 점 $\mathrm{A}(a,\ln a)$와 $\mathrm{B}(b,\ln b)$ ($0<a<b<1$)가 있다.
    [그림] $y=\ln x$의 그래프 위에서 왼쪽부터 점 A, C, B가 차례로 있고, 각 점에서 $x$축에 내린 수선의 발 $\mathrm{A}_1$, $\mathrm{C}_1$, $\mathrm{B}_1$이 $x$축 위(원점과 $x=1$ 사이)에 점선으로 표시되어 있다(점 A, C, B는 $x$축 아래).
    (가) 곡선 위의 점 C에서의 접선이 직선 AB와 평행하다.
- label: 나
  body: |
    점 A, B, C에서 $x$축에 내린 수선의 발을 각각 $\mathrm{A}_1$, $\mathrm{B}_1$, $\mathrm{C}_1$이라고 하자.
stem: |
  다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    점 C의 $x$좌표를 $a$와 $b$에 대한 식으로 나타내시오.
  points: 11
  depends_on: []
  answer:
    kind: expression
    value: (b-a)/(log(b)-log(a))
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.1]
    steps:
    - id: 1b-1
      content: |
        $y'=\dfrac1x$이고 직선 AB의 기울기는 $\dfrac{\ln b-\ln a}{b-a}$이므로 $\dfrac1x=\dfrac{\ln b-\ln a}{b-a}$이고, $x=\dfrac{b-a}{\ln b-\ln a}$이다.
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        점 C에서의 접선의 기울기 $\dfrac1x$와 직선 AB의 기울기 $\dfrac{\ln b-\ln a}{b-a}$가 같다는 식을 세웠다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $x=\dfrac{b-a}{\ln b-\ln a}$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-1
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    곡선 $y=\ln x$와 두 선분 $\mathrm{AC}_1$, $\mathrm{BC}_1$으로 둘러싸인 도형의 넓이 $S$를 $a$와 $b$에 대한 식으로 나타내시오.
  points: 11
  depends_on:
  - '1'
  answer:
    kind: expression
    value: -(b*log(b)-a*log(a))/2+(b-a)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.2]
    steps:
    - id: 2b-1
      content: |
        넓이 $S$는 $x$축과 곡선 $y=\ln x$ 사이의 넓이에서 삼각형 $\mathrm{A}_1\mathrm{AC}_1$과 삼각형 $\mathrm{C}_1\mathrm{BB}_1$의 넓이를 빼면 구할 수 있다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서
        $$S=-\int_a^b\ln x\,dx-\dfrac12\left(\dfrac{b-a}{\ln b-\ln a}-a\right)\times(-\ln a)-\dfrac12\left(b-\dfrac{b-a}{\ln b-\ln a}\right)\times(-\ln b)$$
        $$=-\dfrac12(b\ln b-a\ln a)+\dfrac12(b-a)$$
        이다.
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        구하는 넓이를 (곡선과 $x$축 사이의 넓이)−(두 직각삼각형의 넓이)로 나타내고 [2.1]의 점 C의 $x$좌표를 이용했다.
      steps:
      - 2b-1
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $\displaystyle\int_a^b\ln x\,dx$를 부분적분으로 계산했다.
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        로그의 성질로 정리해 $S=-\dfrac12(b\ln b-a\ln a)+\dfrac12(b-a)$를 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-2
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    $b=2a$일 때, 문항 [2.2]의 넓이 $S$의 최댓값을 구하시오.
  points: 11
  depends_on:
  - '2'
  answer:
    kind: value
    value: 1/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.3]
    steps:
    - id: 3b-1
      content: |
        $b=2a$이므로 넓이 $S$는 $a$에 대한 함수
        $$S(a)=-\dfrac12\{2a\ln(2a)-a\ln a\}+\dfrac12a=-a\ln2-\dfrac12a\ln a+\dfrac12a$$
        이고
        $$S'(a)=-\ln2-\dfrac12\ln a$$
        이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        따라서 $a=\dfrac14$일 때, $S'(a)=0$이다. 이때 $S'(a)$의 부호는 양에서 음으로 바뀌므로 최댓값은
        $$S\left(\dfrac14\right)=-\dfrac12\left(\dfrac12\ln\dfrac12-\dfrac14\ln\dfrac14\right)+\dfrac18=\dfrac18$$
        이다.
      criteria:
      - 3.M2
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        $b=2a$를 대입한 $S(a)$와 그 도함수 $S^{\prime}(a)=-\ln2-\dfrac12\ln a$를 구했다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        $S^{\prime}(a)=0$에서 $a=\dfrac14$를 구하고 부호가 양에서 음으로 바뀜을 확인했다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        최댓값 $S\left(\dfrac14\right)=\dfrac18$을 구했다.
      depends_on:
      - 3.M2
      steps:
      - 3b-2
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
