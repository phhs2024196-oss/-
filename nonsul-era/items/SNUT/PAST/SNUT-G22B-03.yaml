- id: '2'
  stem: |
    $k=\dfrac32$일 경우에는 $x=\sqrt2$일 때 문항 [3.1]의 $f(x)$가 최소가 된다. 이때 $\theta_1$의 값을 구하시오.
  points: 11
  depends_on:
  - '1'
  answer:
    kind: value
    value: pi/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [3.2]
    steps:
    - id: 2b-1
      content: |
        $f'(x)=0$일 때, $f(x)$가 최소이므로
        $$f'(x)=\dfrac{x-d}{\sqrt{(d-x)^2+1}}+\dfrac{kx}{\sqrt{x^2+4}}=0$$
        이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        주어진 값 $k=\dfrac32$과 $x=\sqrt2$를 위 방정식에 대입하면
        $$\dfrac{\sqrt2-d}{\sqrt{(d-\sqrt2)^2+1}}+\dfrac32\times\dfrac{\sqrt2}{\sqrt{2+4}}=0$$
        이고 $d=\sqrt2\pm\sqrt3$이다.
      criteria:
      - 2.M1
      - 2.M2
    - id: 2b-3
      content: |
        $d>0$이므로 $d=\sqrt2+\sqrt3$이고, $\theta_1$이 예각인 직각삼각형에서 $\tan\theta_1=\dfrac{d-x}1=\sqrt3$이므로 $\theta_1=\dfrac\pi3$이다.
      criteria:
      - 2.M2
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $f^{\prime}(x)=\dfrac{x-d}{\sqrt{(d-x)^2+1}}+\dfrac{kx}{\sqrt{x^2+4}}$를 구하고 $f^{\prime}(\sqrt2)=0$을 세웠다.
      steps:
      - 2b-1
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        방정식을 풀어 $d=\sqrt2+\sqrt3$($d>0$)을 구했다.
      steps:
      - 2b-2
      - 2b-3
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\tan\theta_1=\sqrt3$에서 $\theta_1=\dfrac\pi3$을 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
