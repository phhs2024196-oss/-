  misconceptions: []
- id: '3'
  stem: |
    $k=\dfrac32$일 경우에는 $x=\sqrt2$일 때 문항 [3.1]의 $f(x)$가 최소가 된다. 이때 $h$의 값을 구하시오.
  points: 11
  depends_on:
  - '2'
  answer:
    kind: value
    value: sqrt(3)-1/sqrt(2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.3]
    steps:
    - id: 3b-1
      content: |
        $h$가 한 변인 직각삼각형에서 $h=\overline{\mathrm{AB}}\sin(\theta_1-\theta_2)=\overline{\mathrm{AB}}(\sin\theta_1\cos\theta_2-\cos\theta_1\sin\theta_2)$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        주어진 값 $k=\dfrac32$, $x=\sqrt2$와 문항 [3.2]에서 구한 $\theta_1=\dfrac\pi3$를 이용하면 $\overline{\mathrm{AB}}=\sqrt6$, $\sin\theta_1=\dfrac{\sqrt3}2$, $\cos\theta_1=\dfrac12$이고
        $$\sin\theta_2=\dfrac{\sqrt2}{\sqrt6}=\dfrac1{\sqrt3},\qquad\cos\theta_2=\sqrt{1-\sin^2\theta_2}=\sqrt{1-\dfrac13}=\sqrt{\dfrac23}$$
        이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        따라서
        $$h=\sqrt6\times\left(\dfrac{\sqrt3}2\times\dfrac{\sqrt2}{\sqrt3}-\dfrac12\times\dfrac1{\sqrt3}\right)=\sqrt3-\dfrac1{\sqrt2}$$
        이다.
      criteria:
      - 3.A1
  - id: S3-B2
    audience: B
    method_no: 2
    source_flow: 출제배경 및 해설 p.5 [3.3](별해)
    steps:
    - id: 3c-1
      content: |
        문항 [3.2]에서 구한 $d=\sqrt2+\sqrt3$이고 $x=\sqrt2$이므로, 점 A가 원점인 좌표계에서 점 O와 B의 좌표는 각각 $(-1,-\sqrt3)$과 $(2,\sqrt2)$이다. 따라서 직선 OA의 방정식은 $y=\sqrt3x$이고, 직선 OA에서 점 B까지의 거리는
        $$h=\dfrac{\lvert2\sqrt3-\sqrt2\rvert}{\sqrt{(\sqrt3)^2+1^2}}=\dfrac{2\sqrt3-\sqrt2}2=\sqrt3-\dfrac1{\sqrt2}$$
        이다.
      criteria:
      - 3.A1
