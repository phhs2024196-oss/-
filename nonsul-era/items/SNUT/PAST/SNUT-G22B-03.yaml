intent: |
  서술된 상황을 이해하여 함수를 설계하는 능력, 무리함수의 미분(극값 조건)을 이용해 거리를 구하고 삼각함수로 각도를 구하는 능력, 삼각함수의 덧셈정리와 사인·코사인의 관계 또는 점과 직선 사이의 거리로 직각삼각형의 한 변의 길이를 구하는 능력을 본다.
key_idea: |
  $\overline{\mathrm{OA}}=\sqrt{(d-x)^2+1}$, $\overline{\mathrm{AB}}=\sqrt{x^2+4}$이므로 $f(x)=\sqrt{(d-x)^2+1}+k\sqrt{x^2+4}$. $k=\dfrac32$, $x=\sqrt2$에서 $f'(x)=0$을 풀면 $d=\sqrt2+\sqrt3$이고 $\tan\theta_1=d-x=\sqrt3$이므로 $\theta_1=\dfrac\pi3$. $h=\overline{\mathrm{AB}}\sin(\theta_1-\theta_2)=\sqrt3-\dfrac1{\sqrt2}$.
stuck: |
  [3.2] $f'(x)=0$에 $x=\sqrt2$, $k=\dfrac32$를 대입해 $d$를 구하고 $\tan\theta_1=\dfrac{d-x}1$로 각을 읽어내는 단계, [3.3] $h=\overline{\mathrm{AB}}\sin(\theta_1-\theta_2)$로 연결하는 단계
