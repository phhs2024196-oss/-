      points: 4
      evidence: |
        $\overline{\mathrm{AB}}=\sqrt6$, $\sin\theta_1,\cos\theta_1,\sin\theta_2,\cos\theta_2$의 값을 구했다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $h=\sqrt3-\dfrac1{\sqrt2}$를 구했다.
      depends_on:
      - 3.M2
