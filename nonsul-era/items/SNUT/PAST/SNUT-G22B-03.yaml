stimuli:
- label: 가
  body: |
    아래 그림은 자동차가 점 O에서 출발하여 직선도로 OA와 AB를 거쳐 B에 이르는 경로를 보여준다.
    [그림] 직사각형 OPBQ에서 O는 왼쪽 아래, P는 오른쪽 아래, B는 오른쪽 위, Q는 왼쪽 위 꼭짓점이다. 점 A는 O에서 오른쪽으로 1 km(OP의 왼쪽 부분 길이 1 km, 나머지 2 km)에 해당하는 세로선 위에 있고, 점 A를 지나는 수평선과 변 BP가 만나는 점을 C라 한다. 굵은 선 OA, AB가 경로이며, 각 $\theta_1$은 점 A에서 직선 AC와 도로 OA가 이루는 예각, $\theta_2$는 직선 AC와 도로 AB가 이루는 예각이다. 점 B에서 직선 AC까지의 거리가 $x$ km(선분 BC), 점 B에서 직선 OA에 내린 수선의 길이가 $h$ km(점선)이고, 변 OQ의 길이가 $d$ km이다.
    (가) 직사각형 OPBQ에서 $\overline{\mathrm{OP}}=3\,\mathrm{km}$, $\overline{\mathrm{OQ}}=d\,\mathrm{km}$ ($d$는 상수)이다.
    [판독확인: 그림의 점 A의 정확한 위치(OP를 1 km와 2 km로 나누는 세로선 위, 높이 $d-x$)는 그림 라벨 1 km, 2 km, $x$ km, $d$ km로 읽음]
- label: 나
  body: |
    도로 OA와 AB에서 1 km를 주행하는 데 필요한 연료의 양은 각각 $1$과 $k$이다.
- label: 다
  body: |
    직선 AC가 도로 OA, AB와 이루는 예각의 크기는 각각 $\theta_1$과 $\theta_2$이다.
- label: 라
  body: |
    점 B와 직선 AC, 직선 OA 사이의 거리는 각각 $x$ km와 $h$ km이다.
