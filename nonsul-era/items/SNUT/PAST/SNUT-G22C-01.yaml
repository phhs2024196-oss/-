- id: '3'
  stem: |
    자연수 $n$에 대하여 직선 $y=\dfrac x{(2n-1)\pi}$가 곡선 $y=\sin x$와 만나는 점의 개수를 $a_n$이라고 할 때, 급수 $\displaystyle\sum_{n=1}^{\infty}\dfrac1{a_na_{n+1}}$의 합을 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: 1/12
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.3]
    steps:
    - id: 3b-1
      content: |
        $n=1$일 때 $y=\dfrac x\pi$의 그래프와 $y=\sin x$는 원점을 포함하여 $x\ge0$에서 두 개의 교점을 갖는다. $y=\dfrac x\pi$, $y=\sin x$ 모두 원점대칭이므로 $-\pi<x\le0$에서 원점을 포함하여 두 개의 교점을 갖게 되므로 $a_1=2+2-1=3$이다.
      criteria:
      - 3.R1
    - id: 3b-2
      content: |
        $n\ge2$인 자연수 $n$에 대하여 곡선 $y=\sin x$와 직선 $y=\dfrac1{(2n-1)\pi}x$는 $0\le x<(2n-2)\pi$에서 주기 $2\pi$마다 2개씩의 교점이 있어 원점을 포함하여 $2n-2$개의 교점을 갖는다. 또 $(2n-2)\pi<x<(2n-1)\pi$에서 2개의 교점을 갖고 $x\ge(2n-1)\pi$에서는 교점이 없다. 따라서 $x\ge0$에서 $2n$개의 교점을 갖는다. 곡선 $y=\sin x$와 직선 $y=\dfrac1{(2n-1)\pi}x$가 모두 원점대칭임을 생각하면 $x\le0$에서 원점을 포함하여 $2n$개의 교점이 있으므로 $a_n=2n+2n-1=4n-1$이다.
      criteria:
      - 3.M1
    - id: 3b-3
      content: |
        따라서 주어진 급수의 제 $n$항까지의 부분합을 $S_n$이라고 하면
        $$S_n=\sum_{k=1}^{n}\dfrac1{a_ka_{k+1}}=\sum_{k=1}^{n}\dfrac1{(4k-1)(4k+3)}=\dfrac14\sum_{k=1}^{n}\left(\dfrac1{4k-1}-\dfrac1{4k+3}\right)$$
        $$=\dfrac14\left\{\left(\dfrac13-\dfrac17\right)+\left(\dfrac17-\dfrac1{11}\right)+\left(\dfrac1{11}-\dfrac1{15}\right)+\cdots+\left(\dfrac1{4n-1}-\dfrac1{4n+3}\right)\right\}$$
        $$=\dfrac14\left(\dfrac13-\dfrac1{4n+3}\right)=\dfrac1{12}-\dfrac1{16n+12}$$
        이므로
        $$\lim_{n\to\infty}S_n=\lim_{n\to\infty}\left(\dfrac1{12}-\dfrac1{16n+12}\right)=\dfrac1{12}$$
        즉 주어진 급수의 극한값은 $\dfrac1{12}$이다.
      criteria:
      - 3.M2
      - 3.A1
