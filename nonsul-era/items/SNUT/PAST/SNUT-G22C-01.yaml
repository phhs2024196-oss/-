  음함수 미분법으로 접선의 방정식을 구하는 능력, 지수함수와 로그함수의 성질·그래프의 평행이동을 이해하는 능력, 삼각함수의 그래프로 등차수열을 찾아 수렴하는 급수의 합을 계산하는 능력을 본다.
key_idea: |
  [1.1] $y=x$를 대입해 교점 $(\pm2,\pm2)$를 찾고 음함수 미분으로 접선의 기울기 $-1$을 구한다. [1.2] $y=\left(\dfrac14\right)^{x+5}+\dfrac32$이므로 $a=\dfrac14$, $m=-5$, $n=\dfrac32$이고 $b=8$. [1.3] 교점의 개수 $a_n=4n-1$을 구해 부분분수로 급수를 합한다.
