subparts:
- id: '1'
  stem: |
    곡선 $\cos(x-y)+x^2+y^2=9$가 직선 $y=x$와 만나는 점을 모두 구하고, 각 점에서의 접선의 방정식을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: set
    value: '(2,2): y=-x+4, (-2,-2): y=-x-4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: |
        $y=x$를 $\cos(x-y)+x^2+y^2=9$에 대입하면 $\cos(x-x)+x^2+x^2=9$이므로 $x=\pm2$이다. 따라서 곡선과 직선이 만나는 점은 $(2,2)$와 $(-2,-2)$이다.
      criteria:
      - 1.R1
    - id: 1b-2
      content: |
        만나는 점에서의 접선의 기울기 $\dfrac{dy}{dx}$를 구하기 위해 곡선의 방정식 양변을 $x$에 대해 미분하면
        $$-\left(1-\dfrac{dy}{dx}\right)\sin(x-y)+2x+2y\dfrac{dy}{dx}=0$$
        이고, 이를 정리하면
        $$\dfrac{dy}{dx}=\dfrac{\sin(x-y)-2x}{\sin(x-y)+2y}$$
        이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        만나는 점 $(2,2)$와 $(-2,-2)$에서 접선의 기울기는 각각
        $$\dfrac{\sin(2-2)-4}{\sin(2-2)+4}=-1,\qquad\dfrac{\sin(-2+2)+4}{\sin(-2+2)-4}=-1$$
        이다. 따라서 접선의 방정식은 각각 $y=-x+4$, $y=-x-4$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        직선 $y=x$를 대입해 교점 $(2,2)$, $(-2,-2)$를 구했다.
      steps:
      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        음함수 미분으로 $\dfrac{dy}{dx}=\dfrac{\sin(x-y)-2x}{\sin(x-y)+2y}$를 구했다.
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        두 점에서의 기울기 $-1$과 접선 $y=-x+4$, $y=-x-4$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
    deductions:
