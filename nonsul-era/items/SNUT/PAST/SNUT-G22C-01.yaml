- id: '2'
  stem: |
    함수 $y=\dfrac1{1024}4^{-x}+\dfrac32$의 그래프는 함수 $f(x)=a^x$ ($a>0$, $a\ne1$)의 그래프를 $x$축의 방향으로 $m$만큼, $y$축의 방향으로 $n$만큼 평행이동한 것이다. 1이 아닌 양수 $b$에 대하여 $3\log_ba=\dfrac4{4a-3}$가 성립한다. 함수 $g(x)=mn\log_bx$에 대하여 $(g\circ f)(5)$의 값을 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: '25'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.2]
    steps:
    - id: 2b-1
      content: |
        $y=\dfrac1{1024}4^{-x}+\dfrac32=\left(\dfrac14\right)^{x+5}+\dfrac32$이므로 $a=\dfrac14$, $m=-5$, $n=\dfrac32$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $a=\dfrac14$을 $3\log_ba=\dfrac4{4a-3}$에 대입하면 $-3\log_b4=-2$이므로 $b=8$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        따라서 $f(x)=\left(\dfrac14\right)^x$, $g(x)=-\dfrac{15}2\log_8x$이므로
        $$(g\circ f)(5)=-\dfrac{15}2\log_84^{-5}=-\dfrac{15}2\times(-5)\times\dfrac23=25$$
        이다.
      criteria:
      - 2.A1
  rubric:
