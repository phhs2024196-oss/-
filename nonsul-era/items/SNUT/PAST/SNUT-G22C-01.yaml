    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $\displaystyle\lim_{n\to\infty}S_n=\dfrac1{12}$를 구했다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
