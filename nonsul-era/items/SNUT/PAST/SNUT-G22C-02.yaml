intent: |
  주어진 상황(단면의 넓이가 주어진 입체도형에 담긴 물)을 수식으로 기술하고, 단면적을 정적분하여 부피를 구하며, 치환적분법과 부분적분법으로 삼각함수가 포함된 정적분을 계산해 질문에 답하는 능력을 본다.
key_idea: |
  단면적을 높이에 대해 적분한다. 아래쪽 입체도형은 $\displaystyle\int_0^{\pi/2}(\pi^2-2\pi x)dx=\dfrac{\pi^3}4$, 위쪽 입체도형은 $x-\dfrac\pi2=t$로 치환하고 부분적분하여 $\dfrac{\pi^3}8+\dfrac\pi2$. 4분 뒤의 물의 부피 $\dfrac{4\pi^3}{25}$를 $\pi^2h-\pi h^2$와 같다고 놓고 $0\le h\le\dfrac\pi2$인 해를 고른다.
stuck: |
  [2.2] 높이 $x$를 $t=x-\dfrac\pi2$로 치환해 $1+\cos2x=1-\cos2t$로 바꾸고 부분적분하는 단계, [2.3] 부피 방정식 $\pi^2h-\pi h^2=\dfrac{4\pi^3}{25}$의 두 근 중 범위에 맞는 근을 고르는 단계
