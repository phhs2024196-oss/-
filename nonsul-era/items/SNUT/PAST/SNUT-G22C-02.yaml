stimuli:
- label: 가
  body: |
    아래 그림과 같이 위쪽과 아래쪽 입체도형의 높이가 각각 $\dfrac\pi2$ cm인 물시계의 내부에 물이 일부 채워져 있다.
    [그림] 모래시계 모양으로, 위쪽 입체도형(회전체 모양, 위로 갈수록 넓어지는 그릇)이 아래쪽 입체도형(바닥면이 정사각형인 사각뿔 모양, 위쪽 꼭짓점이 위쪽 도형의 꼭짓점과 만남)과 꼭짓점에서 이어져 있다. 위쪽 도형 안의 수면은 원형이고 높이 표시에 $\pi$ cm가, 아래쪽 도형 안의 수면은 정사각형이며 바닥면이 표시되어 있다.
    (가) 아래쪽 입체도형에 채워진 물의 높이가 바닥면으로부터 $x$ cm일 때, 수면은 한 변의 길이가 $\sqrt{\pi^2-2\pi x}$ cm인 정사각형이다.
- label: 나
  body: |
    위쪽 입체도형에 채워진 물의 수면으로부터 바닥면까지의 수직거리가 $x$ cm일 때, 수면은 반지름의 길이가 $\sqrt{\left(x-\dfrac\pi2\right)(1+\cos2x)}$ cm인 원이다.
- label: 다
  body: |
    크기를 무시할 수 있는 작은 구멍을 통해 위쪽 입체도형의 물은 1분에 $\dfrac{\pi^3}{25}$ cm$^3$씩 아래쪽 입체도형으로 떨어진다.
stem: |
  다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    아래쪽 입체도형의 부피를 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: pi**3/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.1]
    steps:
    - id: 1b-1
      content: |
        단면의 넓이가 $\pi^2-2\pi x$이므로
        $$\int_0^{\frac\pi2}(\pi^2-2\pi x)dx=\left[\pi^2x-\pi x^2\right]_0^{\frac\pi2}=\dfrac{\pi^3}4$$
        이다. 따라서 아래쪽 입체도형의 부피는 $\dfrac{\pi^3}4\ \mathrm{cm}^3$이다.
      criteria:
      - 1.M1
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: |
        단면의 넓이 $\pi^2-2\pi x$를 $0$에서 $\dfrac\pi2$까지 적분하는 식을 세웠다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $\dfrac{\pi^3}4$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-1
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    위쪽 입체도형의 부피를 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: pi**3/8+pi/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.2]
    steps:
    - id: 2b-1
      content: |
        단면의 넓이가 $\pi\left(x-\dfrac\pi2\right)(1+\cos2x)$이므로
        $$V=\int_{\frac\pi2}^{\pi}\pi\left(x-\dfrac\pi2\right)(1+\cos2x)dx$$
        이다. $x-\dfrac\pi2$를 $t$로 치환하면
        $$V=\int_0^{\frac\pi2}\pi t\{1+\cos(2t+\pi)\}dt=\pi\int_0^{\frac\pi2}(t-t\cos2t)dt$$
        이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        부분적분하면 $\displaystyle\int t\cos2t\,dt=\dfrac12t\sin2t+\dfrac14\cos2t+C$ ($C$는 적분상수)이므로
        $$V=\pi\left[\dfrac12t^2-\dfrac12t\sin2t-\dfrac14\cos2t\right]_0^{\frac\pi2}=\dfrac{\pi^3}8+\dfrac\pi2$$
        이다. 따라서 위쪽 입체도형의 부피는 $\left(\dfrac{\pi^3}8+\dfrac\pi2\right)\mathrm{cm}^3$이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: |
        단면적을 적분하는 식을 세우고 $t=x-\dfrac\pi2$로 치환해 $\pi\displaystyle\int_0^{\pi/2}(t-t\cos2t)dt$를 얻었다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        부분적분으로 $V=\dfrac{\pi^3}8+\dfrac\pi2$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    처음에 위쪽 입체도형에는 물이 가득 차 있었고 아래쪽 입체도형은 비어 있었다고 하자. 물이 떨어지기 시작한 후 4분이 되었을 때, 아래쪽 입체도형에 채워진 물의 높이를 구하시오.
  points: 11
  depends_on:
  - '1'
  answer:
    kind: value
    value: pi/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3~4 [2.3]
    steps:
    - id: 3b-1
      content: |
        4분 후 아래쪽 입체도형에 채워진 물의 부피는 $\dfrac{4\pi^3}{25}$이며, 물의 높이를 $h$라 하면
        $$\int_0^h(\pi^2-2\pi x)dx=\pi^2h-\pi h^2=\dfrac{4\pi^3}{25}$$
        이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        이를 정리하여 인수분해하면
        $$h^2-\pi h+\dfrac{4\pi^2}{25}=\left(h-\dfrac\pi5\right)\left(h-\dfrac{4\pi}5\right)=0$$
        이다. $0\le h\le\dfrac\pi2$이므로 물의 높이는 $\dfrac\pi5$ cm이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 6
      evidence: |
        4분 후 물의 부피 $\dfrac{4\pi^3}{25}$를 $\displaystyle\int_0^h(\pi^2-2\pi x)dx$와 같다고 놓았다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        인수분해로 $h=\dfrac\pi5$, $\dfrac{4\pi}5$를 구하고 $0\le h\le\dfrac\pi2$로 $\dfrac\pi5$를 택했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
