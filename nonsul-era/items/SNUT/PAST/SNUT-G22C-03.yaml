intent: |
  주어진 상황을 함수로 표현하여 극댓값과 극솟값 존재 조건, 근과 계수의 관계, 삼각함수의 뜻(기울기와 $\tan$)으로 식을 세우고 미분으로 최댓값을 구하는 능력을 종합적으로 본다.
key_idea: |
  $f^{\prime}(x)=3x^2+2tx+9=0$이 서로 다른 두 음의 실근을 가지려면 $t>3\sqrt3$. 근과 계수의 관계로 $\alpha^2-\beta^2=\dfrac{4t}9\sqrt{t^2-27}$. $\tan\theta_1=\dfrac{f(\alpha)}\alpha$, $\tan\theta_2=\dfrac{f(\beta)}\beta$이므로 $g(t)=-\dfrac29(t-15)\sqrt{t^2-27}$, $g^{\prime}(t)=0$에서 $t=9$이고 최댓값 $4\sqrt6$.
stuck: |
  [3.1] 극댓값·극솟값이 모두 존재하고 두 극점이 음수일 조건(판별식, 합, 곱)을 정리하는 단계, [3.3] $\tan\theta_1-\tan\theta_2$를 $\dfrac{\beta f(\alpha)-\alpha f(\beta)}{\alpha\beta}$로 통분해 $\alpha,\beta$의 대칭식으로 정리하는 단계
idea_tags:
