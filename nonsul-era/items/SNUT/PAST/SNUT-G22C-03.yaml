stimuli:
- label: 가
  body: |
    함수 $f(x)=x^3+tx^2+9x+15$ ($t$는 실수)가 다음 조건을 만족한다.
    (1) $x=\alpha$에서 함수 $f(x)$는 극댓값을 갖는다.
    (2) $x=\beta$에서 함수 $f(x)$는 극솟값을 갖는다.
    (3) $\alpha<0$이고 $\beta<0$이다.
- label: 나
  body: |
    제시문 (가)를 만족하는 실수 $t$에 대하여 점 $\mathrm{P}(\alpha,f(\alpha))$, $\mathrm{Q}(\beta,f(\beta))$가 있다. 원점 O와 점 P, Q에 대하여 동경 OP, OQ가 나타내는 각의 크기를 각각 $\theta_1$, $\theta_2$라고 하자.
stem: |
  다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    제시문 (가)를 만족하는 실수 $t$의 값의 범위를 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: t > 3*sqrt(3)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.1]
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$를 미분하면 $f'(x)=3x^2+2tx+9$이다. 함수 $f(x)$가 극댓값과 극솟값을 갖기 위해서는 $f'(x)=0$이 서로 다른 두 실근을 가져야 한다. 따라서 판별식이 양수이므로 $t^2-27>0$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        제시문 (가)로부터 $\alpha$와 $\beta$가 모두 음수이므로 $\alpha\beta=3>0$이고 $\alpha+\beta=-\dfrac23t<0$이 성립해야 한다. 따라서 $t>3\sqrt3$이다.
      criteria:
      - 1.A1
