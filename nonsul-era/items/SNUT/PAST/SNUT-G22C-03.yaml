- id: '2'
  stem: |
    제시문 (가)를 만족하는 실수 $t$에 대하여 $\alpha^2-\beta^2$을 $t$에 대한 식으로 나타내시오.
  points: 8
  depends_on:
  - '1'
  answer:
    kind: expression
    value: 4*t*sqrt(t**2-27)/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [3.2]
    steps:
    - id: 2b-1
      content: |
        $\alpha$와 $\beta$는 방정식 $f'(x)=3x^2+2tx+9=0$의 두 근이다. $f'(x)=0$의 두 근은
        $$x=\dfrac{-t\pm\sqrt{t^2-27}}3$$
        이고 $\alpha<\beta$이므로
        $$\alpha+\beta=-\dfrac{2t}3,\quad\alpha\beta=3,\quad\alpha-\beta=-\dfrac23\sqrt{t^2-27}$$
        이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        그러므로
        $$\alpha^2-\beta^2=(\alpha-\beta)(\alpha+\beta)=\dfrac{4t}9\sqrt{t^2-27}$$
        이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: |
        근의 공식과 근과 계수의 관계로 $\alpha+\beta=-\dfrac{2t}3$, $\alpha-\beta=-\dfrac23\sqrt{t^2-27}$를 구했다($\alpha<\beta$ 반영).
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\alpha^2-\beta^2=\dfrac{4t}9\sqrt{t^2-27}$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    제시문 (나)의 $\theta_1$과 $\theta_2$에 대하여 $\tan\theta_1-\tan\theta_2$를 $t$에 대한 함수 $g(t)$로 나타내시오.
  points: 8
  depends_on:
  - '2'
  answer:
    kind: expression
    value: -2*(t-15)*sqrt(t**2-27)/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.3]
    steps:
    - id: 3b-1
      content: |
        $\tan\theta_1=\dfrac{f(\alpha)}\alpha$, $\tan\theta_2=\dfrac{f(\beta)}\beta$이므로
        $$g(t)=\dfrac{f(\alpha)}\alpha-\dfrac{f(\beta)}\beta=\dfrac{\beta f(\alpha)-\alpha f(\beta)}{\alpha\beta}=\dfrac{\beta f(\alpha)-\alpha f(\beta)}3$$
        이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        이때
        $$\beta f(\alpha)-\alpha f(\beta)=\beta(\alpha^3+t\alpha^2+9\alpha+15)-\alpha(\beta^3+t\beta^2+9\beta+15)$$
        $$=(\alpha-\beta)\{\alpha\beta(\alpha+\beta)+3t-15\}=-\dfrac23(t-15)\sqrt{t^2-27}$$
        이다. 따라서
        $$g(t)=\dfrac{f(\alpha)}\alpha-\dfrac{f(\beta)}\beta=-\dfrac29(t-15)\sqrt{t^2-27}$$
        이다.
      criteria:
      - 3.M2
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $\tan\theta_1=\dfrac{f(\alpha)}\alpha$, $\tan\theta_2=\dfrac{f(\beta)}\beta$로 놓고 통분해 $\dfrac{\beta f(\alpha)-\alpha f(\beta)}3$을 얻었다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        $\beta f(\alpha)-\alpha f(\beta)=(\alpha-\beta)\{\alpha\beta(\alpha+\beta)+3t-15\}$로 인수분해했다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $g(t)=-\dfrac29(t-15)\sqrt{t^2-27}$를 구했다.
      depends_on:
      - 3.M2
      steps:
      - 3b-2
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '4'
  stem: |
    문항 [3.3]의 함수 $g(t)$의 최댓값을 구하시오.
  points: 9
  depends_on:
  - '3'
  answer:
    kind: value
    value: 4*sqrt(6)
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.4]
    steps:
    - id: 4b-1
      content: |
        먼저 $g(t)$를 미분하면
        $$g'(t)=-\dfrac{2(t-9)(2t+3)}{9\sqrt{t^2-27}}$$
        이다. $t>3\sqrt3$이므로 $\sqrt{t^2-27}$과 $2t+3$은 양수이고, 함수 $g(t)$의 증가와 감소를 표로 나타내면 다음과 같다.

        | $t$ | $\cdots$ | 9 | $\cdots$ |
        |---|---|---|---|
        | $g'(t)$ | + | 0 | − |
        | $g(t)$ | 증가 | $4\sqrt6$(극대) | 감소 |
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        따라서 함수 $g(t)$는 $t=9$에서 극댓값이자 최댓값인 $4\sqrt6$을 갖는다.
      criteria:
      - 4.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 5
      evidence: |
        $g^{\prime}(t)=-\dfrac{2(t-9)(2t+3)}{9\sqrt{t^2-27}}$를 구하고 $t>3\sqrt3$에서 부호를 판단해 증감표를 만들었다.
      steps:
      - 4b-1
    - id: 4.A1
      mark_type: A
      points: 4
      evidence: |
        $t=9$에서 극대이자 최대이며 최댓값이 $4\sqrt6$임을 구했다.
      depends_on:
      - 4.M1
      steps:
      - 4b-2
    deductions:
    - code: D4-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D4-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
