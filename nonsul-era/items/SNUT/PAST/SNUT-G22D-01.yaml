stem: |
  다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    두 함수 $f(x)=\lvert x^3-2x\rvert$, $g(x)=x^2$에 대하여 그래프 $y=f(x)$와 $y=g(x)$의 제1사분면에 있는 교점을 모두 구하고, 각 교점을 접점으로 하는 $y=f(x)$의 접선의 방정식을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: set
    value: '(1,1): y=-x+2, (2,4): y=10x-16'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: |
        $x>0$에서 방정식 $\lvert x^3-2x\rvert=x^2$의 해는 $x=1,2$이므로 교점은 $(1,1)$, $(2,4)$이다.
      criteria:
      - 1.R1
    - id: 1b-2
      content: |
        $$f(x)=\begin{cases}-x^3+2x&(0<x\le\sqrt2)\\x^3-2x&(x>\sqrt2)\end{cases}$$
        이다. 미분하면
        $$f'(x)=\begin{cases}-3x^2+2&(0<x<\sqrt2)\\3x^2-2&(x>\sqrt2)\end{cases}$$
        이므로, $(1,1)$에서 접선의 기울기는 $f'(1)=-1$이고 $(2,4)$에서 접선의 기울기는 $f'(2)=10$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        따라서 접선의 방정식은 $y=-x+2$와 $y=10x-16$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: |
        구간을 나누어 교점 $(1,1)$, $(2,4)$를 구했다.
      steps:
      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $f(x)$를 구간별로 나타내 미분하고 접선의 기울기 $f^{\prime}(1)=-1$, $f^{\prime}(2)=10$을 구했다.
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        접선의 방정식 $y=-x+2$, $y=10x-16$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    첫째항이 0이 아닌 수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
    $$\sum_{k=1}^{n}\dfrac{(k+2)a_{k+1}}{(k+1)a_k}=n^2+5n$$
    일 때, $\dfrac{a_{10}}{a_8}$의 값을 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: '360'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.2]
    steps:
    - id: 2b-1
      content: |
        주어진 식에서
        $$\dfrac{11a_{10}}{10a_9}=\sum_{k=1}^{9}\dfrac{(k+2)a_{k+1}}{(k+1)a_k}-\sum_{k=1}^{8}\dfrac{(k+2)a_{k+1}}{(k+1)a_k}=(9^2+5\times9)-(8^2+5\times8)=22$$
        이고
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $$\dfrac{10a_9}{9a_8}=\sum_{k=1}^{8}\dfrac{(k+2)a_{k+1}}{(k+1)a_k}-\sum_{k=1}^{7}\dfrac{(k+2)a_{k+1}}{(k+1)a_k}=(8^2+5\times8)-(7^2+5\times7)=20$$
        이므로
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $a_{10}=20a_9$, $a_9=18a_8$이다. 따라서 $\dfrac{a_{10}}{a_8}=360$이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $n=9$와 $n=8$일 때의 합의 차로 $\dfrac{11a_{10}}{10a_9}=22$, 즉 $a_{10}=20a_9$를 얻었다.
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        $n=8$과 $n=7$일 때의 합의 차로 $\dfrac{10a_9}{9a_8}=20$, 즉 $a_9=18a_8$을 얻었다.
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $\dfrac{a_{10}}{a_8}=360$을 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    클레이 사격선수 A와 B가 표적을 명중시킬 확률은 각각 $\dfrac12$과 $p$이다. A가 4회의 사격 중 1회 이상 명중시킬 확률과 B가 2회의 사격 중 1회 이상 명중시킬 확률이 같기 위한 $p$를 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: 3/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.3]
    steps:
    - id: 3b-1
      content: |
        A가 4회의 사격 중 1회 이상 명중시킬 확률은
        $${}_4\mathrm{C}_1\left(\dfrac12\right)^4+{}_4\mathrm{C}_2\left(\dfrac12\right)^4+{}_4\mathrm{C}_3\left(\dfrac12\right)^4+{}_4\mathrm{C}_4\left(\dfrac12\right)^4=\dfrac{15}{16}\quad\text{또는}\quad1-{}_4\mathrm{C}_0\left(\dfrac12\right)^4=\dfrac{15}{16}$$
        이고
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        B가 2회의 사격 중 1회 이상 명중시킬 확률은
        $${}_2\mathrm{C}_1p(1-p)+{}_2\mathrm{C}_2p^2=p(2-p)\quad\text{또는}\quad1-{}_2\mathrm{C}_0(1-p)^2=p(2-p)$$
        이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $p(2-p)=\dfrac{15}{16}$를 풀면 $p=\dfrac34,\dfrac54$이고 $p\le1$이므로 $p=\dfrac34$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        이항분포로 A의 확률 $\dfrac{15}{16}$를 구했다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: |
        이항분포로 B의 확률 $p(2-p)$를 구했다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $p(2-p)=\dfrac{15}{16}$를 풀어 $p\le1$인 $p=\dfrac34$를 구했다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
