intent: |
  절댓값이 포함된 방정식의 해를 구하고 원하는 점에서의 접선의 방정식을 구하는 능력, 수열의 합으로부터 원하는 수열의 성질을 얻어내는 능력, 이항분포를 이해하고 원하는 확률을 구하는 능력을 본다.
key_idea: |
  [1.1] 제1사분면에서 $x\le\sqrt2$와 $x>\sqrt2$로 나누어 교점 $(1,1)$, $(2,4)$를 구하고 각 구간의 도함수로 접선을 구한다. [1.2] $n$번째 합과 $n-1$번째 합의 차로 $\dfrac{(k+2)a_{k+1}}{(k+1)a_k}=2k+4$, 즉 $\dfrac{a_{k+1}}{a_k}=2(k+1)$. [1.3] 1회 이상 명중할 확률 $=1-$(모두 실패할 확률).
stuck: |
  [1.1] $f(x)=\lvert x^3-2x\rvert$의 정의를 $x=\sqrt2$에서 나누어 각 교점이 속하는 구간의 식으로 미분하는 단계, [1.2] 합의 차로 일반항 $\dfrac{a_{k+1}}{a_k}$를 꺼내는 단계
