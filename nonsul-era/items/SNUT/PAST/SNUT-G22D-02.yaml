  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2~3 [2.2]
    steps:
    - id: 2b-1
      content: |
        $h(x)=2x^2+x+1-e^x$이라고 하면 $h'(x)=4x+1-e^x$, $h''(x)=4-e^x$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        열린구간 $(0,1)$에서 $h''(x)>0$이므로 $h'(x)$는 구간 $(0,1)$에서 증가한다. 한편 $h'(0)=0$이므로 $0<x<1$에서 $h'(x)>0$이다. 따라서 $h(x)$는 열린구간 $(0,1)$에서 극값을 가지지 않는다. 여기서 $h(0)=0$, $h(1)>0$이므로 함수 $h(x)$의 최솟값은 $0$이다.
      criteria:
      - 2.M2
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $h^{\prime}(x)=4x+1-e^x$와 $h^{\prime\prime}(x)=4-e^x>0$을 구했다.
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $h^{\prime}(0)=0$과 $h^{\prime}$의 증가로 $(0,1)$에서 $h^{\prime}(x)>0$임을 보였다.
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $h(0)=0$, $h(1)>0$을 비교해 최솟값 $0$을 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-2
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
