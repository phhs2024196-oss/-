intent: |
  접선의 방정식과 최솟값을 미분으로 구하는 능력, 최솟값을 구하는 능력, 함수를 이용해 부등식을 증명하는 능력, 부등식과 수열의 극한(수렴하는 두 수열 사이에 낀 수열)을 이용해 극한값을 계산하는 능력을 본다. 복잡한 지수함수의 크기를 간단한 다항함수와 미분으로 파악하는 것이 핵심이다.
key_idea: |
  $f(x)=x+1$이므로 $g(x)=e^x-x-1$의 최솟값은 $g(0)=0$. $h(x)=2x^2+x+1-e^x$는 $h'(0)=0$이고 $h''(x)=4-e^x>0$이므로 $[0,1]$에서 최솟값 $0$. 따라서 $e^x\le1+x+2x^2$에 $x=\dfrac1n$를 대입하고 $e^x\ge1+x$와 함께 $1\le n(\sqrt[n]e-1)\le1+\dfrac2n$로 조인다.
stuck: |
  [2.2] $h'(x)$의 부호를 직접 판정하기 어려워 $h''(x)=4-e^x>0$으로 $h'$의 증가를 이용하는 단계, [2.4] [2.1]과 [2.3]을 합쳐 $1\le c_n\le1+\dfrac2n$로 조이는 단계
