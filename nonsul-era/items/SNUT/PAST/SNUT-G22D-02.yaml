      steps:
      - 3b-1
    - id: 3.R1
      mark_type: R
      points: 4
      evidence: |
        $0<\dfrac1n\le1$임을 확인하고 $x=\dfrac1n$을 대입해 결론을 이끌었다.
      steps:
      - 3b-2
