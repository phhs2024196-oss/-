stimuli:
- label: 가
  body: |
    곡선 $y=e^x$ ($e$는 자연상수) 위의 점 $(0,1)$에서의 접선의 방정식을 $y=f(x)$라고 하자.
- label: 나
  body: |
    수렴하는 두 수열 $\{a_n\}$, $\{b_n\}$에 대하여 $\displaystyle\lim_{n\to\infty}a_n=\lim_{n\to\infty}b_n=\alpha$이고, 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이면 $\displaystyle\lim_{n\to\infty}c_n=\alpha$이다.
stem: |
  다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    제시문 (가)의 $f(x)$에 대하여 $e^x-f(x)$의 최솟값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [2.1]
    steps:
    - id: 1b-1
      content: |
        $y=e^x$을 미분하면 $y'=e^x$이므로 점 $(0,1)$에서 접선의 기울기는 1이다. 따라서 $f(x)=x+1$이다. $g(x)=e^x-x-1$이라고 하자. $g(x)$를 미분하면 $g'(x)=e^x-1$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $g(x)$의 증가와 감소를 표로 나타내면 다음과 같다.

        | $x$ | $\cdots$ | 0 | $\cdots$ |
        |---|---|---|---|
        | $g'(x)$ | − | 0 | + |
        | $g(x)$ | 감소 | 0(극소) | 증가 |

        따라서 $g(0)=0$은 극솟값이자 최솟값이다.
      criteria:
      - 1.A1
  rubric:
    rules:
