- id: '4'
  stem: |
    문항 [2.1], [2.3]과 제시문 (나)를 이용하여 다음 극한값을 구하시오.
    $$\lim_{n\to\infty}n\left(\sqrt[n]e-1\right)$$
  points: 9
  depends_on:
  - '1'
  - '3'
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.4]
    steps:
    - id: 4b-1
      content: |
        문항 [2.1]에 의해서 $e^x\ge1+x$가 성립한다. 여기서 $x=\dfrac1n$을 대입하면, 모든 자연수 $n$에 대하여 $\dfrac1n\le\sqrt[n]e-1$이 성립함을 알 수 있다. 또 문항 [2.3]에 의하여 $\sqrt[n]e-1\le\dfrac1n+\dfrac2{n^2}$가 모든 자연수 $n$에 대하여 성립한다.
      criteria:
      - 4.M1
    - id: 4b-2
      content: |
        $c_n=n\left(\sqrt[n]e-1\right)$이라고 하면 모든 자연수 $n$에 대하여 $1\le c_n\le1+\dfrac2n$가 성립한다.
      criteria:
      - 4.M1
    - id: 4b-3
      content: |
        $a_n=1$, $b_n=1+\dfrac2n$라고 하면 $\displaystyle\lim_{n\to\infty}a_n=\lim_{n\to\infty}b_n=1$이므로 제시문 (나)에 의하여 $\displaystyle\lim_{n\to\infty}n\left(\sqrt[n]e-1\right)=1$이다.
      criteria:
      - 4.A1
