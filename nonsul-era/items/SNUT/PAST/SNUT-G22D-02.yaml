    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.3]
    steps:
    - id: 3b-1
      content: |
        문항 [2.2]에 의해서 $0\le x\le1$에서 $2x^2+x+1-e^x\ge0$이므로 부등식 $e^x\le1+x+2x^2$이 성립한다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        모든 자연수 $n$에 대하여 $0<\dfrac1n\le1$이므로 $x=\dfrac1n$을 위 부등식에 대입하면 $\sqrt[n]e\le1+\dfrac1n+\dfrac2{n^2}$가 성립한다. ■
      criteria:
      - 3.R1
