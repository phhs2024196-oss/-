      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        접선의 방정식 $f(x)=x+1$을 구하고 $g(x)=e^x-x-1$의 도함수 $g^{\prime}(x)=e^x-1$을 구했다.
      steps:
      - 1b-1
    - id: 1.A1
