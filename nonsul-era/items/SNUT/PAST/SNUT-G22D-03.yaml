stimuli:
- label: 가
  body: |
    아래 그림은 중심이 원점이고 반지름의 길이가 1인 원, 그리고 $x$축의 양의 방향을 시초선으로 하여 반시계방향으로 회전하는 동경 OA를 나타낸다.
    [그림] 단위원, 원점 O, $x$축 위의 점 $\mathrm{C}(-1,0)$과 $\mathrm{D}(3,0)$, 제2사분면 원 위의 점 B. 동경 OA가 시초선과 이루는 각 $\theta_k$, 원 위의 점 $\mathrm{P}_k$(동경 OA와 원의 교점)가 표시되고, 선분 $\mathrm{CP}_k$와 선분 OB가 만나는 점이 $\mathrm{R}_k$이며 점 $\mathrm{P}_k$와 점 D가 선분으로 연결되어 삼각형 $\mathrm{CDP}_k$가 그려져 있다.
    (가) 점 B, C, D의 좌표는 각각 $\left(-\dfrac1{\sqrt2},\dfrac1{\sqrt2}\right)$, $(-1,0)$, $(3,0)$이다.
- label: 나
  body: |
    시초선을 출발한 동경 OA는 매 초마다 같은 크기의 각으로 회전하여 $n$초 후에 선분 OB와 겹친다. $1\le k\le n$인 $k$에 대하여 $k$초 후에 동경 OA가 시초선과 이루는 각은 $\theta_k\left(0\le\theta_k\le\dfrac{3\pi}4\right)$이고 원과 만나는 교점은 $\mathrm{P}_k$이다. (단, $k$와 $n$은 자연수)
- label: 다
  body: |
    $1\le k\le n$인 $k$에 대하여 선분 $\mathrm{CP}_k$와 선분 OB의 교점은 $\mathrm{R}_k$이고 선분 $\mathrm{OR}_k$의 길이를 $L_k$, 선분 $\mathrm{CR}_k$의 길이를 $M_k$, 삼각형 $\mathrm{CDP}_k$의 넓이를 $S_k$라고 하자.
stem: |
  다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    $L_k$를 $\theta_k$에 대한 식으로 나타내시오.
  points: 11
  depends_on: []
  answer:
    kind: expression
    value: sqrt(2)*sin(theta_k)/(sin(theta_k)+cos(theta_k)+1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.1]
    steps:
    - id: 1b-1
      content: |
        점 $\mathrm{P}_k$의 좌표는 $(\cos\theta_k,\sin\theta_k)$이고 $\mathrm{C}(-1,0)$이므로 점 C와 점 $\mathrm{P}_k$를 지나는 직선의 방정식은 $y=\dfrac{\sin\theta_k}{\cos\theta_k+1}(x+1)$이다. 점 O와 점 B를 지나는 직선의 방정식은 $y=-x$이고, 이 두 직선의 교점 $\mathrm{R}_k$의 좌표는
        $$\left(-\dfrac{\sin\theta_k}{\sin\theta_k+\cos\theta_k+1},\ \dfrac{\sin\theta_k}{\sin\theta_k+\cos\theta_k+1}\right)$$
        이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서
        $$L_k=\dfrac{\sqrt2\sin\theta_k}{\sin\theta_k+\cos\theta_k+1}$$
        이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
