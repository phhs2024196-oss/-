      mark_type: M
      points: 5
      evidence: |
        $S_k=2\sin\dfrac{3k\pi}{4n}$로 나타내 $T_n$을 세웠다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        $\dfrac{T_n}n$을 구분구적법(정적분과 급수의 합의 관계)으로 $\displaystyle\int_0^12\sin\dfrac{3\pi x}4dx$로 바꿨다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $\dfrac{8+4\sqrt2}{3\pi}$를 구했다.
      depends_on:
      - 3.M2
      steps:
      - 3b-2
    deductions:
