intent: |
  주어진 상황(원 위를 회전하는 동경)을 이해하고 수학적으로 기술하는 능력을 본다. 직선의 방정식, 삼각함수의 정의와 코사인법칙, 정적분과 급수의 합 사이의 관계가 쓰인다.
key_idea: |
  $\mathrm{P}_k(\cos\theta_k,\sin\theta_k)$, 직선 $\mathrm{CP}_k$와 $y=-x$의 교점으로 $L_k=\dfrac{\sqrt2\sin\theta_k}{\sin\theta_k+\cos\theta_k+1}$. 삼각형 $\mathrm{R}_k\mathrm{CO}$에서 코사인법칙으로 $M_k^2-L_k^2=1-\sqrt2L_k$. $S_k=2\sin\theta_k$, $\theta_k=\dfrac{3k\pi}{4n}$이므로 구분구적법으로 $\displaystyle\lim\dfrac{T_n}n=\int_0^12\sin\dfrac{3\pi x}4dx$.
stuck: |
  [3.1] 두 직선 $\mathrm{CP}_k$, $\mathrm{OB}$($y=-x$)의 교점 $\mathrm{R}_k$의 좌표를 구하는 단계, [3.2] 삼각형 $\mathrm{R}_k\mathrm{CO}$에서 $\angle\mathrm{R}_k\mathrm{OC}=\dfrac\pi4$로 코사인법칙을 쓰는 단계, [3.3] $\dfrac1n\sum f\left(\dfrac kn\right)$ 꼴로 정적분으로 바꾸는 단계
