    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    $n=3$일 때, $\displaystyle\sum_{k=1}^{3}\left(M_k^2-L_k^2\right)$의 값을 구하시오.
  points: 11
  depends_on:
  - '1'
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.2]
    steps:
    - id: 2b-1
      content: |
        삼각형 $\mathrm{R}_k\mathrm{CO}$에서 코사인법칙을 이용하면
        $$M_k^2=L_k^2+1-2L_k\cos\left(\dfrac\pi4\right)=L_k^2+1-\sqrt2L_k$$
        이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\theta_k=\dfrac{3\pi}{4n}k$이므로 $n=3$일 때 $\theta_k=\dfrac\pi4k$이다. 따라서 구하고자 하는 값은
        $$\sum_{k=1}^{3}\left(M_k^2-L_k^2\right)=\sum_{k=1}^{3}\left(1-\sqrt2L_k\right)=3-2\sum_{k=1}^{3}\dfrac{\sin\left(\dfrac\pi4k\right)}{\sin\left(\dfrac\pi4k\right)+\cos\left(\dfrac\pi4k\right)+1}=3-2\left(1-\dfrac{\sqrt2}2+\dfrac12+\dfrac{\sqrt2}2\right)=0$$
        이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: |
        삼각형 $\mathrm{R}_k\mathrm{CO}$에서 코사인법칙으로 $M_k^2-L_k^2=1-\sqrt2L_k$를 얻었다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $n=3$일 때 $\theta_k=\dfrac\pi4k$를 대입해 합이 $0$임을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    자연수 $n$에 대하여 $T_n=\displaystyle\sum_{k=1}^{n}S_k$일 때, $\displaystyle\lim_{n\to\infty}\dfrac{T_n}{n}$의 값을 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: (8+4*sqrt(2))/(3*pi)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [3.3]
    steps:
    - id: 3b-1
      content: |
        $\theta_k=\dfrac{3\pi}{4n}k$이므로
        $$S_k=\dfrac12\times4\times\sin\dfrac{3k\pi}{4n}=2\sin\dfrac{3k\pi}{4n},\qquad T_n=\sum_{k=1}^{n}S_k=\sum_{k=1}^{n}2\sin\dfrac{3k\pi}{4n}$$
        이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        따라서 정적분을 이용하여 극한값을 구하면
        $$\lim_{n\to\infty}\dfrac{T_n}n=\lim_{n\to\infty}\sum_{k=1}^{n}2\sin\dfrac{3k\pi}{4n}\cdot\dfrac1n=\int_0^12\sin\left(\dfrac{3\pi x}4\right)dx=-\dfrac8{3\pi}\left[\cos\left(\dfrac{3\pi x}4\right)\right]_0^1=\dfrac{8+4\sqrt2}{3\pi}$$
        이다.
      criteria:
      - 3.M2
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
