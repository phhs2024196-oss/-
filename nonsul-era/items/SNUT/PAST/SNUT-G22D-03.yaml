      mark_type: M
      points: 6
      evidence: |
        직선 $\mathrm{CP}_k$와 직선 $y=-x$의 방정식을 세우고 교점 $\mathrm{R}_k$의 좌표를 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: |
        $\mathrm{OR}_k$의 길이 $L_k=\dfrac{\sqrt2\sin\theta_k}{\sin\theta_k+\cos\theta_k+1}$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
