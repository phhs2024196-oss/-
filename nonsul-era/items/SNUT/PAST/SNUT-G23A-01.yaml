- id: '3'
  stem: |-
    아래 그림은 곡선 $y=14\sqrt{x}e^{x}$과 $x$축, 두 직선 $x=\dfrac12$, $x=1$로 둘러싸인 도형을 밑면으로 하는 입체도형을 나타낸다. 이 입체도형을 $x$축에 수직인 평면으로 자른 단면은 $\overline{\mathrm{PQ}}:\overline{\mathrm{QR}}:\overline{\mathrm{RP}}=5:6:7$인 삼각형 $\mathrm{PQR}$일 때, 이 입체도형의 부피를 구하시오.
    [그림] 좌표평면(xy평면)에서 곡선 $y=14\sqrt{x}e^{x}$ 아래, $x$축 위의 $\dfrac12\le x\le1$ 부분이 밑면이다. 밑면에 수직으로 세운 입체도형이며, $x$축 위의 점 R에서 $x$축에 수직인 평면으로 자른 단면이 삼각형 PQR이다(점 R은 $x$축 위, 점 Q는 곡선 위에 표시되고 점 P는 단면 삼각형의 나머지 꼭짓점). [판독확인: 그림에서 삼각형의 어느 변이 밑면 위의 선분인지 명시되지 않음. 공식 해설은 $\overline{\mathrm{RP}}=14\sqrt{x}e^{x}$로 계산함]
  points: 12
  depends_on: []
  answer: {kind: value, value: 6*sqrt(6)*exp(2), equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.3]
    steps:
    - id: 3b-1
      content: 삼각형 $\mathrm{PQR}$에서 코사인법칙에 의하여 $\cos(\angle\mathrm{PQR})=\dfrac{\overline{\mathrm{PQ}}^2+\overline{\mathrm{QR}}^2-\overline{\mathrm{RP}}^2}{2\overline{\mathrm{PQ}}\cdot\overline{\mathrm{QR}}}=\dfrac15$이고 $\sin(\angle\mathrm{PQR})=\sqrt{1-\cos^2(\angle\mathrm{PQR})}=\dfrac{2\sqrt6}{5}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 입체도형을 $x$축에 수직인 평면으로 자른 단면의 넓이를 $S(x)$라 하면 $S(x)=\dfrac12\overline{\mathrm{PQ}}\cdot\overline{\mathrm{QR}}\cdot\sin(\angle\mathrm{PQR})=24\sqrt6\,xe^{2x}$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: 부피는 $\displaystyle\int_{\frac12}^{1}24\sqrt6\,xe^{2x}dx=24\sqrt6\left[\dfrac12xe^{2x}-\dfrac14e^{2x}\right]_{\frac12}^{1}=6\sqrt6e^2$이다.
      criteria:
      - 3.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: 코사인법칙으로 $\cos$, $\sin(\angle\mathrm{PQR})$을 구함
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: $S(x)=24\sqrt6\,xe^{2x}$
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: 부분적분으로 $6\sqrt6e^2$
      depends_on:
      - 3.M2
      steps:
      - 3b-3
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
