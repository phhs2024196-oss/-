- id: '2'
  stem: 함수 $f(x)=\dfrac{\sin x+3}{\cos x-1}$ $(0<x<2\pi)$이 $x=\alpha$에서 극값을 가질 때, $\sin\left(2\alpha+\dfrac{\pi}{4}\right)$의 값을 구하시오.
  points: 11
  depends_on: []
  answer: {kind: value, value: 31*sqrt(2)/50, equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.2]
    steps:
    - id: 2b-1
      content: 함수 $f(x)$를 미분하면 $f'(x)=\dfrac{\cos x(\cos x-1)-(\sin x+3)(-\sin x)}{(\cos x-1)^2}=\dfrac{1-\cos x+3\sin x}{(\cos x-1)^2}$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: $f'(\alpha)=0$에서 $\cos\alpha-1=3\sin\alpha$의 양변을 제곱하여 정리하면 $10\cos^2\alpha-2\cos\alpha-8=2(5\cos\alpha+4)(\cos\alpha-1)=0$이다. $\cos\alpha\neq1$이므로 $\cos\alpha=-\dfrac45$, $\sin\alpha=-\dfrac35$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: $\cos2\alpha=\cos^2\alpha-\sin^2\alpha=\dfrac{7}{25}$, $\sin2\alpha=2\sin\alpha\cos\alpha=\dfrac{24}{25}$이므로 $\sin\left(2\alpha+\dfrac{\pi}{4}\right)=\sin2\alpha\cos\dfrac{\pi}{4}+\cos2\alpha\sin\dfrac{\pi}{4}=\dfrac{31}{50}\sqrt{2}$이다.
      criteria:
      - 2.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 몫의 미분법으로 $f'(x)$를 구함
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: $\cos\alpha=-\dfrac45$, $\sin\alpha=-\dfrac35$를 구함
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: 덧셈정리로 $\dfrac{31\sqrt{2}}{50}$
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
