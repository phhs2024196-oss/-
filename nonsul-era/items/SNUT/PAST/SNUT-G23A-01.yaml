stem: 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: 곡선 $y=\sqrt{x}$ 위의 점 $\mathrm{P}_1(a_1,b_1)$에서의 접선이 $y$축과 만나는 점을 $\mathrm{Q}_2(0,b_2)$라 하고, 점 $\mathrm{Q}_2$를 지나며 $x$축에 평행한 직선과 곡선의 교점을 $\mathrm{P}_2(a_2,b_2)$라 하자. 곡선 $y=\sqrt{x}$ 위의 점 $\mathrm{P}_2(a_2,b_2)$에서의 접선이 $y$축과 만나는 점을 $\mathrm{Q}_3(0,b_3)$이라 하고, 점 $\mathrm{Q}_3$을 지나며 $x$축에 평행한 직선과 곡선의 교점을 $\mathrm{P}_3(a_3,b_3)$이라 하자. 이와 같은 과정을 반복하여 얻은 점 $\mathrm{P}_n(a_n,b_n)$에 대하여 급수 $\displaystyle\sum_{n=1}^{\infty}a_n$의 합을 구하시오. (단, $a_1=4$)
  points: 11
  depends_on: []
  answer: {kind: value, value: 16/3, equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: $y'=\dfrac{1}{2\sqrt{x}}$이므로 점 $\mathrm{P}_n(a_n,b_n)$에서의 접선의 방정식은 $y=\dfrac{1}{2\sqrt{a_n}}(x-a_n)+b_n=\dfrac{1}{2\sqrt{a_n}}x+\dfrac{\sqrt{a_n}}{2}$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 접선의 $y$절편 $b_{n+1}=\dfrac{\sqrt{a_n}}{2}$이고 $b_{n+1}=\sqrt{a_{n+1}}$이므로 $\sqrt{a_{n+1}}=\dfrac{\sqrt{a_n}}{2}$, 즉 $a_{n+1}=\dfrac14a_n$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 수열 $\{a_n\}$은 첫째항이 $4$이고 공비가 $\dfrac14$인 등비수열이므로 급수의 합은 $\displaystyle\sum_{n=1}^{\infty}a_n=\dfrac{4}{1-\dfrac14}=\dfrac{16}{3}$이다.
      criteria:
      - 1.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 접선의 방정식을 $a_n$으로 나타냄
      steps:
