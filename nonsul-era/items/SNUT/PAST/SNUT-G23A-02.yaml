stimuli:
- label: 가
  body: |-
    아래 그림과 같이 램프에서 나온 빔이, $xy$평면에서 중심이 원점이고 반지름의 길이가 $2$인 원과 원의 내부를 비추고 있다.
    [그림] 램프에서 나온 빔이 $xy$평면에서 원점 O를 중심으로 하는 반지름 $2$인 원과 그 내부를 비춘다. $x$축 위의 점 P를 중심으로 하는 불투명 원판이 $x$축 방향으로 좌우로 움직인다.
    반지름의 길이가 $2$인 불투명 원판의 중심인 점 P는 $x$축 위를 연속적으로 움직인다. $x=7$에서 출발한 점 P의 시각 $t$ $(0\le t\le8)$에서의 위치를 $x=f(t)$라 할 때, 점 P의 속도 $v(t)$는
    $$v(t)=\begin{cases}-2t&(0\le t<2)\\2t-8&(2\le t<6)\\-2t+16&(6\le t\le8)\end{cases}$$
    이다.
- label: 나
  body: 원판이 빔에 닿거나 비추어질 때, 원판에 연결된 센서에서 소리가 난다.
stem: 다음 제시문을 읽고 물음에 답하시오.
