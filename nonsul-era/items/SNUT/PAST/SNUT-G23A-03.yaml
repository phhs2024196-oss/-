- id: '3'
  stem: 문항 [3.1]을 만족시키는 상수 $a$, $b$에 대하여 방정식 $f(x)=g(x)$가 $1$개의 실근을 가질 때, 두 곡선 $y=f(x)$, $y=g(x)$와 직선 $x=\dfrac12$로 둘러싸인 도형의 넓이를 구하시오.
  points: 11
  depends_on:
  - '1'
  - '2'
  answer: {kind: value, value: 45/8-3*log(2), equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5~6 [3.3]
    steps:
    - id: 3b-1
      content: 방정식 $f(x)=g(x)$가 $1$개의 실근을 가지는 것은 $c=0$일 때이고, 두 곡선은 $x=2$에서 접한다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 넓이는 $\displaystyle\int_{\frac12}^{2}\{f(x)-g(x)\}dx=\int_{\frac12}^{1}(-6\ln x+6)dx+\int_1^2(-6x+12)dx-\int_{\frac12}^{2}(-3x^2+6x)dx$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: $=\left[-6x\ln x+12x\right]_{\frac12}^{1}+\left[-3x^2+12x\right]_1^2-\left[-x^3+3x^2\right]_{\frac12}^{2}=\dfrac{45}8-3\ln2$이다.
      criteria:
      - 3.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
