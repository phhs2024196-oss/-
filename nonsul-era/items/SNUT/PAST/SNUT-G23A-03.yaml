stem: 두 함수 $f(x)=\begin{cases}a\ln x+6&(0<x\le1)\\bx+12&(x>1)\end{cases}$, $g(x)=-3x^2+6x+c$에 대하여 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: 함수 $f(x)$가 $x=1$에서 미분가능할 때, 상수 $a$, $b$의 값을 구하시오.
  points: 11
  depends_on: []
  answer: {kind: value, value: 'a=-6, b=-6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.1]
    steps:
    - id: 1b-1
      content: $f(x)$가 $x=1$에서 미분가능하면 $x=1$에서 연속이므로 $\displaystyle\lim_{x\to1-}\{a\ln x+6\}=\lim_{x\to1+}\{bx+12\}$로부터 $b=-6$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\displaystyle\lim_{x\to1-}\dfrac{f(x)-f(1)}{x-1}=\lim_{t\to0-}\dfrac{a\ln(1+t)}{t}=a\ln\left\{\lim_{t\to0-}(1+t)^{\frac1t}\right\}=a$, $\displaystyle\lim_{x\to1+}\dfrac{f(x)-f(1)}{x-1}=\lim_{x\to1+}\dfrac{(-6x+12)-6}{x-1}=-6$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 미분계수가 존재하므로 $a=-6$이다.
      criteria:
      - 1.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 연속 조건으로 $b=-6$
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 좌·우 미분계수를 각각 계산
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $a=-6$, $b=-6$
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    deductions:
