- id: '2'
  stem: 문항 [3.1]을 만족시키는 상수 $a$, $b$에 대하여, 방정식 $f(x)=g(x)$의 서로 다른 실근의 개수를 실수 $c$의 값의 범위에 따라 구하시오.
  points: 11
  depends_on:
  - '1'
  answer: {kind: expression, value: 'c<0: 0개, c=0: 1개, c>0: 2개', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.2]
    steps:
    - id: 2b-1
      content: 함수 $h(x)=f(x)-g(x)+c=\begin{cases}-6\ln x+3x^2-6x+6&(0<x\le1)\\3x^2-12x+12&(x>1)\end{cases}$를 정의하면 방정식 $f(x)=g(x)$의 해는 방정식 $h(x)=c$의 해와 같다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: $h'(x)=\begin{cases}-\dfrac6x+6x-6&(0<x\le1)\\6x-12&(x>1)\end{cases}$이므로 $h'(x)=0$을 만족시키는 $x$의 값은 $2$이다. 또 $\displaystyle\lim_{x\to0+}h(x)=\infty$, $\displaystyle\lim_{x\to\infty}h(x)=\infty$이므로 증감표를 나타내고 그래프를 그리면 $h(x)$는 $x=2$에서 최솟값 $0$을 갖는다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 서로 다른 실근의 개수는 $c<0$일 때 $0$, $c=0$일 때 $1$, $c>0$일 때 $2$이다.
      criteria:
      - 2.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
