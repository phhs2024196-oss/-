- id: '3'
  stem: |-
    실수 전체에서 미분가능한 두 함수 $f(x)$, $g(x)$가 다음 두 조건을 모두 만족시킬 때, $g'(3)$의 값을 구하시오.
    (가) 모든 실수 $x$에 대하여 $g(x)=x^2f(x)-16$
    (나) $\displaystyle\lim_{x\to3}\dfrac{f(x)-g(x)}{x-3}=-4$
  points: 11
  depends_on: []
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.3]
    steps:
    - id: 3b-1
      content: 주어진 조건으로부터 $g(3)=9f(3)-16$, $f(3)=g(3)$이므로 $g(3)=f(3)=2$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 첫 번째 조건식의 양변을 $x$에 관하여 미분하고 $x=3$을 대입하면 $g'(3)=12+9f'(3)$이다. 두 번째 조건으로부터 $\displaystyle\lim_{x\to3}\dfrac{f(x)-g(x)}{x-3}=\lim_{x\to3}\left\{\dfrac{f(x)-f(3)}{x-3}-\dfrac{g(x)-g(3)}{x-3}\right\}=f'(3)-g'(3)=-4$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: 따라서 $g'(3)=3$이다.
      criteria:
      - 3.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: (나)에서 $f(3)=g(3)$, 그리고 $f(3)=g(3)=2$
      steps:
      - 3b-1
    - id: 3.M2
