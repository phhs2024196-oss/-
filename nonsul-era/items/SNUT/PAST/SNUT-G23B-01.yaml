- id: '2'
  stem: |-
    수열 $\{a_n\}$이 모든 자연수 $n$에 대하여
    $$a_1+\dfrac{a_2}{2}+\cdots+\dfrac{a_n}{n}=\dfrac{n(n+5)}{2}$$
    를 만족시키고
    $$T_n=\dfrac{1}{a_1}+\dfrac{1}{a_2}+\cdots+\dfrac{1}{a_n}$$
    이라 할 때, $\displaystyle\lim_{n\to\infty}T_n$의 값을 구하시오.
  points: 11
  depends_on: []
  answer: {kind: value, value: 3/4, equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.2]
    steps:
    - id: 2b-1
      content: $a_1=\dfrac{1\times6}{2}=3$이고, $n\ge2$일 때 $\dfrac{a_n}{n}=\left(a_1+\dfrac{a_2}{2}+\cdots+\dfrac{a_n}{n}\right)-\left(a_1+\dfrac{a_2}{2}+\cdots+\dfrac{a_{n-1}}{n-1}\right)=\dfrac{n(n+5)}{2}-\dfrac{(n-1)(n+4)}{2}=n+2$이므로 $a_n=n(n+2)$이다. 이것은 $n=1$인 경우도 포함하므로 $a_n=n(n+2)$ $(n\ge1)$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: $T_n=\displaystyle\sum_{k=1}^{n}\dfrac{1}{k(k+2)}=\dfrac12\sum_{k=1}^{n}\left(\dfrac1k-\dfrac1{k+2}\right)=\dfrac12\left(1+\dfrac12-\dfrac1{n+1}-\dfrac1{n+2}\right)$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 $\displaystyle\lim_{n\to\infty}T_n=\lim_{n\to\infty}\dfrac12\left(\dfrac32-\dfrac1{n+1}-\dfrac1{n+2}\right)=\dfrac34$이다.
      criteria:
      - 2.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: $a_n=n(n+2)$ $(n\ge1)$ 도출
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: 부분분수로 $T_n$을 구함
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 극한값 $\dfrac34$
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
