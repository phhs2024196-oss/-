subparts:
- id: '1'
  stem: |-
    서로 다른 강아지 $4$마리와 고양이 $5$마리 중에서 일부를 선물하려고 한다. 다음을 구하시오.
    (1) 연수에게 $3$마리를 주려고 할 때, 강아지와 고양이를 적어도 $1$마리씩 주는 경우의 수
    (2) 민수와 창수에게 각각 $2$마리를 주는 경우의 수 (단, 민수에게 고양이를 적어도 $1$마리 준다면, 창수에게는 강아지를 적어도 $1$마리 준다.)
  points: 12
  depends_on: []
  answer: {kind: expression, value: '(1) 70, (2) 606', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: (1) 연수에게 강아지 $1$마리와 고양이 $2$마리, 그리고 강아지 $2$마리와 고양이 $1$마리를 주는 경우의 수는 ${}_4\mathrm{C}_1\times{}_5\mathrm{C}_2+{}_4\mathrm{C}_2\times{}_5\mathrm{C}_1=70$이다.
      criteria:
      - 1.B1
    - id: 1b-2
      content: (2) 두 사람에게 각각 $2$마리를 주는 전체 경우의 수는 ${}_9\mathrm{C}_2\times{}_7\mathrm{C}_2$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: 이 중 (a) 고양이와 강아지를 $1$마리씩 민수에게 주고, 고양이를 $2$마리 창수에게 주는 경우, (b) 고양이 $2$마리를 민수에게 주고, 나머지 고양이 중 $2$마리를 창수에게 주는 경우를 모두 빼면 ${}_9\mathrm{C}_2\times{}_7\mathrm{C}_2-({}_5\mathrm{C}_1\times{}_4\mathrm{C}_1\times{}_4\mathrm{C}_2+{}_5\mathrm{C}_2\times{}_3\mathrm{C}_2)=756-(120+30)=606$이다.
      criteria:
      - 1.A1
  rubric:
