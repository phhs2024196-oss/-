- id: '4'
  stem: $0<\theta<\dfrac\pi2$일 때, 함수 $f(\theta)$의 최댓값을 구하시오.
  points: 9
  depends_on:
  - '2'
  answer: {kind: value, value: 6*sqrt(3), equivalents: [], tolerance: null}
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.4]
    steps:
    - id: 4b-1
      content: 점 $\mathrm{P}$의 좌표는 $x=2-2\cos2\theta$, $y=2\sin2\theta$이고 점 $\mathrm{Q}$의 좌표는 $(0,4\theta)$이므로 직선 PQ의 기울기는 $\dfrac{2\sin2\theta-4\theta}{2-2\cos2\theta}=\dfrac{\sin2\theta-2\theta}{1-\cos2\theta}$이고 직선의 방정식은 $y=\dfrac{\sin2\theta-2\theta}{1-\cos2\theta}x+4\theta$이다.
      criteria:
      - 4.M1
    - id: 4b-2
      content: 점 $\mathrm{R}$의 $x$좌표는 $x=\dfrac{4\theta(1-\cos2\theta)}{2\theta-\sin2\theta}$이고, $S_2=\dfrac12\times\dfrac{4\theta(1-\cos2\theta)}{2\theta-\sin2\theta}\times2\sin2\theta=\dfrac{4\theta\sin2\theta(1-\cos2\theta)}{2\theta-\sin2\theta}$이다.
      criteria:
      - 4.M2
    - id: 4b-3
      content: 따라서 $f(\theta)=\dfrac{S_1\times S_2}{\theta}=8\sin2\theta(1-\cos2\theta)$이다.
      criteria:
      - 4.M3
    - id: 4b-4
      content: $f'(\theta)=16\cos2\theta(1-\cos2\theta)+16\sin^22\theta=16(1-\cos2\theta)(1+2\cos2\theta)$이고, $0<\theta<\dfrac\pi2$에서 $\cos2\theta\ne1$이므로 $\cos2\theta=-\dfrac12$, 즉 $\theta=\dfrac\pi3$일 때 $f'(\theta)=0$이다. $f'(\theta)$의 부호를 조사하면 $f(\theta)$는 $\theta=\dfrac\pi3$에서 증가에서 감소로 바뀌어 극대이다.
      criteria:
      - 4.M4
    - id: 4b-5
      content: $f\left(\dfrac\pi3\right)=8\sin\dfrac{2\pi}3\left(1-\cos\dfrac{2\pi}3\right)=6\sqrt3$이다.
      criteria:
      - 4.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 2
      evidence: 직선 PQ의 방정식
      steps:
      - 4b-1
    - id: 4.M2
      mark_type: M
      points: 2
      evidence: $S_2$를 구함
      steps:
      - 4b-2
    - id: 4.M3
      mark_type: M
      points: 2
      evidence: $f(\theta)=8\sin2\theta(1-\cos2\theta)$
      steps:
      - 4b-3
    - id: 4.M4
      mark_type: M
      points: 2
      evidence: $f'(\theta)=0$ 해 $\theta=\dfrac\pi3$와 증감표
      steps:
      - 4b-4
    - id: 4.A1
      mark_type: A
      points: 1
      evidence: 최댓값 $6\sqrt3$
      depends_on:
      - 4.M4
      steps:
      - 4b-5
