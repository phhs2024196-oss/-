stimuli:
- label: 가
  body: |-
    아래 그림은 중심이 점 $\mathrm{C}(2,0)$이고 반지름의 길이가 $2$인 원과 그 위의 점 $\mathrm{P}$를 지나는 직선을 나타낸다.
    [그림] $xy$평면에서 중심이 $\mathrm{C}(2,0)$인 반지름 $2$의 원. 제1사분면 위의 원 위의 점 P, $y$축 위의 점 Q(P보다 위쪽), $x$축 위의 점 R(원 오른쪽 바깥)이 있고, 세 점 Q, P, R는 한 직선 위에 있다. 선분 OP가 그려져 있고 $y$축과 선분 OP가 이루는 예각이 $\theta$로 표시되어 있다.
    점 $\mathrm{P}$는 제$1$사분면에 있고, $y$축과 선분 $\mathrm{OP}$가 이루는 예각을 $\theta$라 하자.
- label: 나
  body: 점 $\mathrm{Q}$는 $y$축 위에 있고, 선분 $\mathrm{OQ}$의 길이는 호 $\mathrm{OP}$의 길이와 같다.
- label: 다
  body: 두 점 $\mathrm{P}$, $\mathrm{Q}$를 지나는 직선이 $x$축과 만나는 점은 $\mathrm{R}$이다.
- label: 라
  body: 호 $\mathrm{OP}$와 선분 $\mathrm{OP}$로 둘러싸인 도형의 넓이를 $S_1$, 삼각형 $\mathrm{ORP}$의 넓이를 $S_2$, $f(\theta)=\dfrac{S_1\times S_2}{\theta}$라 하자.
stem: 다음 제시문을 읽고 물음에 답하시오.
