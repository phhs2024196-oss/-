  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [3.2]
    steps:
    - id: 2b-1
      content: $g(x)$는 $f(x)$의 역함수이고 선분 AB의 기울기가 $-1$이므로 두 점 A와 B는 직선 $y=x$에 대하여 대칭이다. 따라서 $\mathrm{A}(p,t)$라 하면 $\mathrm{B}(t,p)$이다. (단, $t>p$)
      criteria:
      - 2.M1
    - id: 2b-2
      content: $\overline{\mathrm{AB}}=\sqrt{2(p-t)^2}$이다. $\overline{\mathrm{AB}}=\overline{\mathrm{BC}}=\sqrt2$이므로 $t=p+1$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 한편 A는 $y=f(x)$ 위의 점이므로 $t=\dfrac19(p+1)^2+2$에서 $t=\dfrac19t^2+2$, $t^2-9t+18=(t-3)(t-6)=0$이다. 그런데 $\dfrac52<t<5$이므로 $t=3$이다.
      criteria:
      - 2.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
