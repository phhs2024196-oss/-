  points: 11
  depends_on: []
  answer: {kind: value, value: sqrt(2), equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.1]
    steps:
    - id: 1b-1
      content: $g(x)$는 함수 $f(x)=\dfrac19(x+1)^2+2$의 역함수이므로 $g(x)=3\sqrt{x-2}-1$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 직선 BC의 기울기가 $-1$이므로 점 C는 점 B를 $x$축의 방향으로 $c$(상수)만큼, $y$축의 방향으로 $-c$만큼 평행이동한 점이다. 점 B는 $y=g(x)$ 위에 있고 점 C는 $y=h(x)$ 위에 있는데, $h(x)=3\sqrt{x-3}-2$의 그래프는 $g(x)=3\sqrt{x-2}-1$의 그래프를 $x$축의 방향으로 $1$만큼, $y$축의 방향으로 $-1$만큼 평행이동한 것이므로 $c=1$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 따라서 $\overline{\mathrm{BC}}=\sqrt2$이다.
      criteria:
      - 1.A1
  rubric:
