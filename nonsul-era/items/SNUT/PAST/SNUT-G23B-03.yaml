    steps:
    - id: 3b-1
      content: $t=3$을 대입하면 $\mathrm{A}(2,3)$이다. 곡선 $y=f(x)$ 위의 점 $\mathrm{A}(2,3)$에서의 접선의 기울기는 $f'(2)=\dfrac29(2+1)=\dfrac23$이므로 접선의 방정식은 $y=\dfrac23x+\dfrac53$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 도형의 넓이는 $\displaystyle\int_0^2\left\{\dfrac19(x+1)^2+2-\dfrac23x-\dfrac53\right\}dx$이다.
      criteria:
