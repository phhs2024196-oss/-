stimuli:
- label: 가
  body: |-
    아래 그림은 세 곡선 $y=f(x)$, $y=g(x)$, $y=h(x)$와 직선 $y=t$를 나타낸다. (단, $\dfrac52<t<5$)
    [그림] 제1사분면에 세 곡선과 수평선 $y=t$. $y=f(x)$는 점 A에서 직선 $y=t$와 만나는 증가 곡선이고, 점 A를 지나는 기울기 $-1$의 직선이 곡선 $y=g(x)$와 점 B에서, 곡선 $y=h(x)$와 점 C에서 만난다(A, B, C 순으로 오른쪽 아래로 늘어섬). 세 곡선은 오른쪽 위로 증가하며 $y=g(x)$, $y=h(x)$는 $x$축 위쪽의 시작점에서 출발한다.
    $f(x)=\dfrac19(x+1)^2+2$ $(x\ge0)$, $g(x)$는 함수 $f(x)$의 역함수, $h(x)=3\sqrt{x-3}-2$이다.
- label: 나
  body: 직선 $y=t$와 곡선 $y=f(x)$가 만나는 점을 A라 하자.
- label: 다
  body: 점 A를 지나고 기울기가 $-1$인 직선이 두 곡선 $y=g(x)$, $y=h(x)$와 만나는 점을 각각 B, C라 하자.
stem: 다음 제시문을 읽고 물음에 답하시오.
