stem: 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: 이차함수 $f(x)=kx^2-(k+4)x+k+2$에 대하여, $y=f(x)$의 그래프와 $x$축의 교점이 $(\sin\theta,0)$, $(\cos\theta,0)$이다. 이때 모든 $\theta$값들의 합을 구하시오. (단, $0<\theta<2\pi$, $k$는 상수)
  points: 11
  depends_on: []
  answer: {kind: value, value: 5*pi/2, equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: $\sin\theta$, $\cos\theta$는 이차방정식 $f(x)=0$의 두 근이다. 이차방정식의 근과 계수의 관계를 이용하면 $\sin\theta+\cos\theta=\dfrac{k+4}{k}$, $\sin\theta\cos\theta=\dfrac{k+2}{k}$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 $\dfrac{(k+4)^2}{k^2}=1+\dfrac{2(k+2)}{k}$, $(k-4)(k+2)=0$이다. $k=4$일 때 $f(x)=4x^2-8x+6=4(x-1)^2+2>0$이므로 $x$축과의 교점이 없다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $k=-2$일 때 $f(x)=-2x^2-2x$가 되어 $x$축과의 교점은 $(0,0)$, $(-1,0)$이다. 그러므로 $\sin\theta=0$, $\cos\theta=-1$일 때 $\theta=\pi$, $\sin\theta=-1$, $\cos\theta=0$일 때 $\theta=\dfrac32\pi$이다. 따라서 모든 $\theta$값들의 합은 $\pi+\dfrac32\pi=\dfrac52\pi$이다.
      criteria:
      - 1.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 근과 계수의 관계로 두 식 설정
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $(\sin\theta+\cos\theta)^2=1+2\sin\theta\cos\theta$로 $k=4,-2$를 구하고 $k=4$ 제외
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $\theta=\pi,\dfrac32\pi$, 합 $\dfrac52\pi$
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |-
    최고차항의 계수가 $1$인 사차함수 $f(x)$가 다음 두 조건을 만족할 때, $f(x)$를 구하시오.
    (가) $f'(-x)=-f'(x)$이다.
    (나) $f(x)$는 $x=2$에서 극솟값 $-13$을 갖는다.
  points: 11
  depends_on: []
  answer: {kind: expression, value: x**4-8*x**2+3, equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.2]
    steps:
    - id: 2b-1
      content: $f(x)$는 최고차항의 계수가 $1$인 사차함수이므로 $f'(x)$는 최고차항의 계수가 $4$인 삼차함수이다. 조건 (가)에 의해 $f'(x)$의 이차항의 계수와 상수항은 $0$이다. 따라서 $f'(x)=4x^3+ax$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 조건 (나)에 의해 $f'(2)=0$이므로 $a=-16$이다. 즉 $f'(x)=4x^3-16x$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 이를 적분하면 $f(x)=x^4-8x^2+C$이고 다시 조건 (나)에 의해 $f(2)=16-32+C=-13$이므로 $C=3$이다. 즉 $f(x)=x^4-8x^2+3$이다.
      criteria:
      - 2.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: (가)로 $f'(x)=4x^3+ax$
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: $f'(2)=0$에서 $a=-16$
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $C=3$, $f(x)=x^4-8x^2+3$
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: 높이가 $1$인 입체도형이 있다. 밑면으로부터의 높이가 $x$ $(0\le x\le1)$인 지점에서 밑면과 평행한 평면으로 자른 단면이 가로의 길이가 $2^x$이고 세로의 길이가 $x+1$인 직사각형일 때, 이 입체도형의 부피를 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: (3*log(2)-1)/log(2)**2, equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.3]
    steps:
    - id: 3b-1
      content: 단면의 넓이는 $(x+1)2^x$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 따라서 부피는 $V=\displaystyle\int_0^1(x+1)2^xdx=\left[(x+1)\dfrac{2^x}{\ln2}\right]_0^1-\int_0^1\dfrac{2^x}{\ln2}dx$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: $=\dfrac3{\ln2}-\left[\dfrac{2^x}{(\ln2)^2}\right]_0^1=\dfrac3{\ln2}-\dfrac1{(\ln2)^2}=\dfrac{3\ln2-1}{(\ln2)^2}$이다.
      criteria:
      - 3.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: 단면적 $(x+1)2^x$
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: 부분적분으로 식 전개
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: $\dfrac{3\ln2-1}{(\ln2)^2}$
      depends_on:
      - 3.M2
      steps:
      - 3b-3
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
