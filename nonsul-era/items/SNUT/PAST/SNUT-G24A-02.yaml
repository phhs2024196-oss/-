- id: '3'
  stem: $\angle\mathrm{APB}$를 $\theta$라 하자. $\cos\theta+\dfrac1{\cos\theta}=-\dfrac{10}3$일 때, $t$의 값을 구하시오.
  points: 11
  depends_on:
  - '1'
  answer: {kind: value, value: 1/2, equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.3]
    steps:
    - id: 3b-1
      content: $k=\cos\theta$로 두어 $k+\dfrac1k=-\dfrac{10}3$의 해를 구하면 $k=-3$, $-\dfrac13$이다. $-1\le\cos\theta\le1$이므로 $\cos\theta=-\dfrac13$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: $\overline{\mathrm{AP}}=\sqrt{t+4t^2}$, $\overline{\mathrm{BP}}=\sqrt{9t+36t^2}$, $\overline{\mathrm{AB}}=\sqrt{4t+64t^2}$이므로 코사인법칙에 의해 $\cos\theta=\dfrac{\overline{\mathrm{AP}}^2+\overline{\mathrm{BP}}^2-\overline{\mathrm{AB}}^2}{2\overline{\mathrm{AP}}\times\overline{\mathrm{BP}}}=\dfrac{1-4t}{1+4t}=-\dfrac13$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: 마지막 등식을 풀면 $t=\dfrac12$이다.
      criteria:
      - 3.A1
  - id: S3-B2
    audience: B
    method_no: 2
    source_flow: 출제배경 및 해설 p.3 [2.3] (별해)
    steps:
    - id: 3b2-1
      content: $k=\cos\theta$로 두어 $k+\dfrac1k=-\dfrac{10}3$의 해를 구하면 $k=-3$, $-\dfrac13$이다. $-1\le\cos\theta\le1$이므로 $\cos\theta=-\dfrac13$이고 이로부터 $\tan\theta=-2\sqrt2$이다.
      criteria: []
    - id: 3b2-2
      content: '$x$축의 양의 방향과 $l_1$, $l_2$가 이루는 각을 각각 $\theta_1$, $\theta_2$라 하면 $\tan\theta_1=-\dfrac1{2\sqrt t}$, $\tan\theta_2=\dfrac1{2\sqrt t}$이고 $\theta=\theta_1-\theta_2$이므로 $\tan\theta=\dfrac{\tan\theta_1-\tan\theta_2}{1+\tan\theta_1\tan\theta_2}=\dfrac{4\sqrt t}{1-4t}=-2\sqrt2$이다. (여기서 $1-4t<0$이어야 한다) [판독확인: 공식 해설 원문은 $l_1$, $l_2$로 표기하나 기울기 $\mp\dfrac1{2\sqrt t}$는 직선 PA, PB의 기울기임 — 공식 해설 표기 오기 의심]'
      criteria: []
    - id: 3b2-3
      content: 양변을 제곱하여 $t$에 관한 방정식을 풀면 $t=\dfrac12,\dfrac18$이고 $1-4t<0$이어야 하므로 $t=\dfrac12$이다.
      criteria: []
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
