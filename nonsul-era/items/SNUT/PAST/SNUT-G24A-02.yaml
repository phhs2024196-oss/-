- label: 가
  body: |-
    곡선 $y=\sqrt{x}$ 위에 서로 다른 두 점 $\mathrm{A}(t,\sqrt{t})$, $\mathrm{B}(9t,3\sqrt{t})$가 있다.
    [그림] 곡선 $y=\sqrt{x}$ 위에 점 A, B(B가 A보다 오른쪽 위)가 있고, $x$축 위의 점 P에 대하여 선분 AP, BP, AB가 삼각형 APB를 이룬다(P는 A와 B 사이의 $x$좌표 부근, $x$축 위).
- label: 나
  body: $x$축 위의 점 $\mathrm{P}$는 삼각형 $\mathrm{APB}$의 둘레의 길이를 최소로 하는 위치에 있다.
stem: 다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: '1'
  stem: 점 $\mathrm{P}$의 $x$좌표를 $t$에 대한 식으로 나타내시오.
  points: 11
  depends_on: []
  answer: {kind: expression, value: 3*t, equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2~3 [2.1]
    steps:
    - id: 1b-1
      content: 점 $\mathrm{A}$를 $x$축 대칭시켜 얻은 점 $\mathrm{A}'(t,-\sqrt t)$와 점 $\mathrm{B}$를 지나는 직선의 $x$절편이 점 $\mathrm{P}$의 $x$좌표이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 이 직선의 방정식은 $y=\dfrac1{2\sqrt t}(x-t)-\sqrt t=\dfrac1{2\sqrt t}x-\dfrac32\sqrt t$이므로, $y=0$을 대입하면 점 $\mathrm{P}$의 $x$좌표는 $3t$이다.
      criteria:
      - 1.A1
