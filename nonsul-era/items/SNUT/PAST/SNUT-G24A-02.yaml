- id: '2'
  stem: 곡선 $y=\sqrt{x}$ 위의 두 점 $\mathrm{A}$, $\mathrm{B}$에서의 접선을 각각 $l_1$, $l_2$라 하자. $l_1$과 $l_2$의 교점을 점 $\mathrm{Q}$라 할 때, $\tan(\angle\mathrm{PQO})$를 $t$에 대한 식으로 나타내시오. (단, $\mathrm{O}$는 원점)
  points: 11
  depends_on:
  - '1'
  answer: {kind: expression, value: 3*sqrt(t)/2, equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.2]
    steps:
    - id: 2b-1
      content: $f(x)=\sqrt x$라 놓으면 $f'(x)=\dfrac1{2\sqrt x}$이므로 점 $\mathrm{A}$에서의 접선 $l_1$의 방정식과 점 $\mathrm{B}$에서의 접선 $l_2$의 방정식은 각각 $y=\dfrac1{2\sqrt t}x+\dfrac{\sqrt t}2$, $y=\dfrac1{6\sqrt t}x+\dfrac32\sqrt t$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 이 두 직선의 방정식을 연립하면 점 $\mathrm{Q}$의 좌표는 $(3t,2\sqrt t)$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 삼각형 $\mathrm{PQO}$는 각 $\mathrm{OPQ}$가 직각인 직각삼각형이고 $\overline{\mathrm{PQ}}=2\sqrt t$이므로 $\tan(\angle\mathrm{PQO})=\dfrac{\overline{\mathrm{OP}}}{\overline{\mathrm{PQ}}}=\dfrac{3t}{2\sqrt t}=\dfrac32\sqrt t$이다.
      criteria:
      - 2.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 2.M1
