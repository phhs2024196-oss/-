stimuli:
- label: 가
  body: 중심이 원점 $\mathrm{O}(0,0)$이고 반지름의 길이가 $3,9,27,\cdots,3^n,\cdots$인 원이 좌표평면 위에 있다. (단, $n$은 자연수)
- label: 나
  body: 좌표평면 위를 시각 $t=0$에서 $t=\pi$까지 점 $\mathrm{P}$가 움직인다. 이 점 $\mathrm{P}$의 위치 $(x,y)$는 $x=e^{2t}\cos t$, $y=e^{2t}\sin t$이다.
- label: 다
  body: 점 $\mathrm{P}$가 움직이는 동안 만난 원의 개수를 $N$이라 하자.
- label: 라
  body: 필요할 경우, $1.09<\ln3<1.10$을 이용한다.
stem: 다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: '1'
  stem: $N$을 구하시오.
  points: 11
  depends_on: []
  answer: {kind: value, value: '5', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.1]
    steps:
    - id: 1b-1
      content: 원점과 점 $\mathrm{P}$ 사이의 거리는 $\overline{\mathrm{OP}}=\sqrt{(e^{2t}\cos t)^2+(e^{2t}\sin t)^2}=e^{2t}$이다. $t=0$에서 $t=\pi$일 때까지 점 $\mathrm{P}$가 움직이므로, $t=\pi$일 때 원점과 점 $\mathrm{P}$ 사이의 거리 $e^{2\pi}$이 원의 반지름 $3^N$ 이상이 되는 최대 자연수 $N$을 구하자.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $3^N\le e^{2\pi}$ $\Rightarrow$ $N\ln3\le2\pi$ $\Rightarrow$ $N\le\dfrac{2\pi}{\ln3}$이고, 주어진 조건 $1.09<\ln3<1.10$에서 $\dfrac{2\pi}{1.10}<\dfrac{2\pi}{\ln3}<\dfrac{2\pi}{1.09}$이므로 $5<\dfrac{2\pi}{\ln3}<6$임을 알 수 있다. 따라서 점 $\mathrm{P}$가 만난 원의 개수 $N=5$이다.
      criteria:
      - 1.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $\overline{\mathrm{OP}}=e^{2t}$, $3^N\le e^{2\pi}$ 조건
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: (라)로 $5<\dfrac{2\pi}{\ln3}<6$, $N=5$
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
