  misconceptions: []
- id: '2'
  stem: 점 $\mathrm{P}$가 반지름의 길이가 $3^N$인 원을 만날 때까지, 점 $\mathrm{P}$가 움직인 거리를 구하시오.
  points: 11
  depends_on:
  - '1'
  answer: {kind: value, value: 121*sqrt(5), equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [3.2]
    steps:
    - id: 2b-1
      content: 반지름의 길이가 $3^5$인 원을 마지막으로 만나므로, 이때의 시각 $t$를 구하면 $e^{2t}=3^5$ $\Rightarrow$ $t=\dfrac52\ln3$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 또한 $\dfrac{dx}{dt}=2e^{2t}\cos t-e^{2t}\sin t$, $\dfrac{dy}{dt}=2e^{2t}\sin t+e^{2t}\cos t$이고 $\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}=\sqrt{4e^{4t}+e^{4t}}=\sqrt5e^{2t}$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 점 $\mathrm{P}$가 움직인 거리는 $\displaystyle\int_0^{\frac52\ln3}\sqrt5e^{2t}dt=\sqrt5\left[\dfrac{e^{2t}}{2}\right]_0^{\frac52\ln3}=\dfrac{\sqrt5}{2}(243-1)=121\sqrt5$이다.
      criteria:
      - 2.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: $t=\dfrac52\ln3$
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: 속력 $\sqrt5e^{2t}$
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $121\sqrt5$
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: 급수 $\displaystyle\sum_{k=N}^{\infty}\left(-\dfrac12\right)^{k-1}\int_{k-1}^{k}\pi\sin(\pi x)dx$의 합을 구하시오.
  points: 11
  depends_on:
  - '1'
  answer: {kind: value, value: 1/4, equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.3]
    steps:
    - id: 3b-1
      content: 정적분을 계산하면 $\displaystyle\int_{k-1}^{k}\pi\sin(\pi x)dx=\left[-\cos(\pi x)\right]_{k-1}^{k}=-\cos(k\pi)+\cos(k-1)\pi=2(-1)^{k-1}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: $N=5$이므로 $\displaystyle\sum_{k=5}^{\infty}\left(-\dfrac12\right)^{k-1}\times\{2(-1)^{k-1}\}=\sum_{k=5}^{\infty}\left(\dfrac12\right)^{k-2}=\dfrac{\dfrac18}{1-\dfrac12}=\dfrac14$이다.
      criteria:
      - 3.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: 정적분 $2(-1)^{k-1}$
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 6
      evidence: 등비급수의 합 $\dfrac14$
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    deductions:
