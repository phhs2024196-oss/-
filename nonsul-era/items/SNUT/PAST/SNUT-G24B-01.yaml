- id: '2'
  stem: 함수 $f(x)=a^x+b$ $(a>0)$에 대하여 $y=f(x)$의 그래프와 그 역함수의 그래프가 두 점에서 만난다. 이 두 점의 $x$좌표가 각각 $1$, $2$일 때, $a-b$의 값을 구하시오.
  points: 11
  depends_on: []
