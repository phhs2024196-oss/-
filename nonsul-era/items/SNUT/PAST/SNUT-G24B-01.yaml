  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.2]
    steps:
    - id: 2b-1
      content: 함수 $f(x)=a^x+b$의 그래프 $y=f(x)$와 그 역함수의 그래프와의 교점은 함수 $f(x)=a^x+b$의 그래프 $y=f(x)$와 직선 $y=x$의 교점과 같다. 방정식 $a^x+b=x$의 두 근이 $1$, $2$이므로 다음 연립이차방정식을 얻을 수 있다. $\begin{cases}a+b=1\\a^2+b=2\end{cases}$
      criteria:
      - 2.M1
    - id: 2b-2
      content: $a=\dfrac{1+\sqrt5}2$, $b=\dfrac{1-\sqrt5}2$ 또는 $a=\dfrac{1-\sqrt5}2$, $b=\dfrac{1+\sqrt5}2$이다. $a>0$이므로 $a-b$의 값은 $\sqrt5$이다.
      criteria:
      - 2.A1
