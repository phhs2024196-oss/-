      points: 3
      evidence: $\tan\theta=x$로 치환, $-1\le x\le1$
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: $g'(x)$와 $x=2-\sqrt6$ 및 구간 끝점 후보
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: 최솟값 $2(\sqrt6-2)$
      depends_on:
