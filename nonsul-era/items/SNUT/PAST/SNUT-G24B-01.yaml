subparts:
- id: '1'
  stem: 함수 $f(x)=\dfrac14x^2+x+3$에 대하여 $y=f(x)$의 그래프와 이를 $x$축에 대하여 대칭이동한 후 $x$축의 방향으로 $2$만큼 평행이동한 $y=g(x)$의 그래프가 있다. 이 두 그래프와 동시에 접하는 직선의 방정식을 모두 구하시오.
  points: 11
  depends_on: []
  answer: {kind: set, value: '{y=-x-1, y=2*x+2}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: $y=g(x)$의 그래프는 $y=f(x)$의 그래프를 $x$축에 대하여 대칭이동한 후 $x$축의 방향으로 $2$만큼 평행이동한 그래프이므로 $g(x)=-\left\{\dfrac14(x-2)^2+(x-2)+3\right\}=-\dfrac14x^2-2$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 직선의 방정식 $y=ax+b$와 $y=f(x)$를 연립하면 $\dfrac14x^2+x+3=ax+b\Rightarrow\dfrac14x^2+(1-a)x+3-b=0$이고, 이 이차방정식의 판별식이 $0$이어야 하므로 $a^2-2a-2+b=0$이다. 직선의 방정식 $y=ax+b$와 $y=g(x)$를 연립하면 $-\dfrac14x^2-2=ax+b\Rightarrow-\dfrac14x^2-ax-2-b=0$이고, 이 이차방정식의 판별식이 $0$이어야 하므로 $a^2-2-b=0$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 정리된 두 판별식을 연립하면 $a=-1$, $b=-1$ 또는 $a=2$, $b=2$이다. 따라서 두 그래프와 동시에 접하는 직선의 방정식은 $y=-x-1$ 또는 $y=2x+2$이다.
      criteria:
      - 1.A1
  - id: S1-B2
    audience: B
    method_no: 2
    source_flow: '출제배경 및 해설 p.1~2 [1.1] (별해: 미분하여 구한 기울기 이용)'
    steps:
    - id: 1b2-1
      content: $y=g(x)$를 찾은 이후 미분하여 구한 기울기를 이용하는 방법이다. $f(x)$와 $g(x)$의 두 그래프와의 접점을 각각 $(a,f(a))$, $(b,g(b))$로 가정하면 $\dfrac{f(a)-g(b)}{a-b}=f'(a)=g'(b)$가 성립한다. $f'(x)=\dfrac12x+1$, $g'(x)=-\dfrac12x$이며 $f'(a)=g'(b)$의 관계를 통해 $\dfrac12a+1=-\dfrac12b$임을 알 수 있다.
      criteria: []
    - id: 1b2-2
      content: 이를 대입하면 $\dfrac{f(a)-g(b)}{a-b}=\dfrac{\dfrac14a^2+a+3-\left(-\dfrac14(-a-2)^2-2\right)}{a+a-2}=\dfrac{\dfrac12a^2+2a+6}{2a+2}$이고, 위 식과 $f'(a)$와의 관계를 통해 $\dfrac{\dfrac12a^2+2a+6}{2a+2}=\dfrac12a+1\Rightarrow a^2+2a-8=0\Rightarrow(a+4)(a-2)=0$임을 알 수 있다.
      criteria: []
    - id: 1b2-3
      content: 결과적으로 $a$는 $-4$ 또는 $2$의 경우가 되며, (i) $a=-4$일 때, 점 $(-4,3)$을 $-1$의 기울기로 지나는 직선이므로 $y=-x-1$, (ii) $a=2$일 때, 점 $(2,6)$을 $2$의 기울기로 지나는 직선이므로 $y=2x+2$가 된다.
      criteria: []
