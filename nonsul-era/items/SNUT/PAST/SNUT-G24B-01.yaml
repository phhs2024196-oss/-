- id: '3'
  stem: 함수 $f(\theta)=\dfrac{2+\tan^2\theta}{2-\tan\theta}$의 최솟값을 구하시오. (단, $-\dfrac\pi4\le\theta\le\dfrac\pi4$)
  points: 12
  depends_on: []
  answer: {kind: value, value: 2*(sqrt(6)-2), equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.3]
    steps:
    - id: 3b-1
      content: $\tan\theta$를 $x$로 치환하면 $-1\le x\le1$인 범위에서 $g(x)=\dfrac{2+x^2}{2-x}$의 최솟값을 구하면 된다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: $g'(x)=\dfrac{-x^2+4x+2}{(2-x)^2}$이므로 $x=2\pm\sqrt6$에서 $g'(x)=0$이다. $2+\sqrt6>1$이므로 $x=-1$, $x=2-\sqrt6$, $x=1$에서 $g(x)$의 함숫값 중 최댓값과 최솟값이 있다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: 여기서 $g(-1)=1$, $g(2-\sqrt6)=2(\sqrt6-2)$, $g(1)=3$이므로 구하는 최솟값은 $2(\sqrt6-2)$이다.
      criteria:
      - 3.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
