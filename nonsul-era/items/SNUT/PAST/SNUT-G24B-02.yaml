stimuli:
- label: 가
  body: |-
    <그림 1>은 넓이가 $1$인 정사각형을 작은 정사각형 $n^2$개로 등분한 것이다. (단, $n$은 자연수)
    [그림] <그림 1> 한 변의 길이가 $1$인 정사각형을 가로·세로로 각각 $n$등분하여 한 변이 $\dfrac1n$인 작은 정사각형 $n^2$개로 나눈 격자(왼쪽 위 칸의 가로·세로가 각각 $\dfrac1n$로 표시됨).
- label: 나
  body: |-
    <그림 1>에 있는 선분만으로 이루어진 서로 다른 사각형을 찾으려고 한다. <그림 2>와 같이 $n=2$인 경우 모두 $9$개의 서로 다른 사각형을 찾을 수 있다.
    [그림] <그림 2> $n=2$인 $2\times2$ 격자에서 음영으로 표시한 서로 다른 사각형 9개: 단일 칸 4개(왼쪽 위, 오른쪽 위, 왼쪽 아래, 오른쪽 아래), 세로로 두 칸인 직사각형 2개(왼쪽 열, 오른쪽 열), 가로로 두 칸인 직사각형 2개(위쪽 행, 아래쪽 행), 전체 정사각형 1개.
- label: 다
  body: $n=k$일 때 찾을 수 있는 가장 작은 사각형의 넓이를 $a_k$라 하자.
