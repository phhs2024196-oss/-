- id: '3'
  stem: |-
    $m\ge2$인 모든 자연수 $m$에 대하여 다음 명제 $p(m)$이 성립함을 수학적 귀납법으로 증명하시오.
    $p(m)$: $n=m$일 때 찾을 수 있는 두 번째로 넓이가 큰 사각형의 넓이는 $S_m=\displaystyle\sum_{k=2}^{m}a_k$보다 항상 크다.
  points: 11
  depends_on: []
  answer: {kind: proof, value: 'p(m): 1-1/m > sum_{k=2}^m 1/k^2 (m>=2) 를 수학적 귀납법으로 증명', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.3]
    steps:
    - id: 3b-1
      content: $a_k$는 $\dfrac1{k^2}$이고, $m\ge2$인 모든 자연수 $m$에 대하여 $n=m$일 때 찾을 수 있는 두 번째로 넓이가 큰 사각형의 넓이는 $1-\dfrac1m$이다. 따라서 주어진 명제 $p(m)$은 $n=m$일 때 $1-\dfrac1m>\dfrac1{2^2}+\dfrac1{3^2}+\cdots+\dfrac1{m^2}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: (i) $m=2$일 때 $\dfrac12>\dfrac1{2^2}$이므로 $p(2)$가 성립한다.
      criteria:
      - 3.R1
    - id: 3b-3
      content: (ii) $m=k$일 때 $p(k)$가 성립한다고 가정하자. $1-\dfrac1k>\dfrac1{2^2}+\dfrac1{3^2}+\cdots+\dfrac1{k^2}$ 양변에 $\dfrac1{(k+1)^2}$을 더하면 $1-\dfrac1k+\dfrac1{(k+1)^2}>\dfrac1{2^2}+\dfrac1{3^2}+\cdots+\dfrac1{k^2}+\dfrac1{(k+1)^2}$이다.
      criteria:
      - 3.R2
    - id: 3b-4
      content: 이때 $1-\dfrac1k+\dfrac1{(k+1)^2}=1-\dfrac{k^2+k+1}{k(k+1)^2}$이고, $\dfrac{k^2+k+1}{k(k+1)^2}>\dfrac{k^2+k}{k(k+1)^2}=\dfrac1{k+1}$이므로 $1-\dfrac1{k+1}>1-\dfrac1k+\dfrac1{(k+1)^2}>\dfrac1{2^2}+\dfrac1{3^2}+\cdots+\dfrac1{k^2}+\dfrac1{(k+1)^2}$이다. 따라서 $p(k+1)$이 성립한다.
      criteria:
      - 3.R3
    - id: 3b-5
      content: (i), (ii)에 의해서 $p(m)$은 $m\ge2$인 모든 자연수 $m$에 대하여 성립한다.
      criteria:
      - 3.R4
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
