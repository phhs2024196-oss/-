      points: 2
      evidence: $1-\dfrac1{k+1}>1-\dfrac1k+\dfrac1{(k+1)^2}$ 부등식 처리
      steps:
      - 3b-4
    - id: 3.R4
      mark_type: R
      points: 1
      evidence: 수학적 귀납법 결론
      steps:
      - 3b-5
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 타당한 설명 없이 답만 기술
