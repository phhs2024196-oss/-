    steps:
    - id: 2b-1
      content: $n=9$일 때 찾을 수 있는 가장 작은 사각형의 넓이 $a_9$는 $\dfrac19\times\dfrac19=\dfrac1{81}$이고, 두 번째로 작은 사각형의 넓이는 $\dfrac19\times\dfrac29=\dfrac2{81}>a_8=\dfrac1{64}$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서 문제의 조건을 만족하는 사각형의 개수는, 문항 [2.1]에서 구한 사각형의 개수에서 넓이가 가장 작은 사각형의 개수 $81$을 뺀 값과 같으므로 $2025-81=1944$이다.
      criteria:
      - 2.A1
  rubric:
