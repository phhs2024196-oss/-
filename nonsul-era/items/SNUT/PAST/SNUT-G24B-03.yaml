- id: '2'
  stem: $A_n$을 구하시오.
  points: 11
  depends_on:
  - '1'
  answer: {kind: expression, value: exp(2*n*pi)*(1+exp(pi))**2, equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.2]
    steps:
    - id: 2b-1
      content: $e^x>0$이므로 $[2n\pi,(2n+1)\pi]$에서 $2e^x\sin x\ge0$이고 $[(2n+1)\pi,(2n+2)\pi]$에서 $2e^x\sin x\le0$이다. 따라서 구하는 도형의 넓이는 $A_n=\displaystyle\int_{2n\pi}^{(2n+1)\pi}2e^x\sin x\,dx-\int_{(2n+1)\pi}^{(2n+2)\pi}2e^x\sin x\,dx$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: $=\left[e^x(\sin x-\cos x)\right]_{2n\pi}^{(2n+1)\pi}-\left[e^x(\sin x-\cos x)\right]_{(2n+1)\pi}^{(2n+2)\pi}=e^{(2n+1)\pi}+e^{2n\pi}+e^{(2n+2)\pi}+e^{(2n+1)\pi}=e^{2n\pi}(1+e^\pi)^2$이다.
      criteria:
      - 2.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 부호를 구간별로 확인하고 넓이를 두 적분의 차로 설정
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 6
      evidence: $A_n=e^{2n\pi}(1+e^\pi)^2$
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    deductions:
