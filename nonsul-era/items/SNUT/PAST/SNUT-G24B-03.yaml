  answer: {kind: value, value: 16*pi**7, equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [3.3]
    steps:
    - id: 3b-1
      content: 문항 [3.2]로부터 $\ln A_k-2\ln(1+e^\pi)=\ln\dfrac{A_k}{(1+e^\pi)^2}=2k\pi$이므로
      criteria:
      - 3.M1
    - id: 3b-2
      content: $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac1{n^8}\left\{\ln A_k-2\ln(1+e^\pi)\right\}^7=(2\pi)^7\lim_{n\to\infty}\sum_{k=1}^{n}\left(\dfrac kn\right)^7\dfrac1n$이 성립한다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: 정적분과 급수의 합 사이의 관계에 의하여, 구하는 극한값은 $(2\pi)^7\displaystyle\int_0^1x^7dx=16\pi^7$이다.
      criteria:
      - 3.A1
  rubric:
