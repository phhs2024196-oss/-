  stem: 극한값 $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac1{n^8}\left\{\ln A_k-2\ln(1+e^\pi)\right\}^7$을 구하시오.
  points: 11
  depends_on:
