subparts:
- id: '1'
  stem: 부정적분 $\displaystyle\int2e^x\sin x\,dx$를 구하시오.
  points: 11
  depends_on: []
  answer: {kind: expression, value: exp(x)*(sin(x)-cos(x))+C, equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.1]
    steps:
    - id: 1b-1
      content: 부분적분법을 적용하면 $\displaystyle\int2e^x\sin x\,dx=2e^x\sin x-\int2e^x\cos x\,dx$이다. 우변의 부정적분식에서 부분적분법을 적용하면 $\displaystyle\int2e^x\cos x\,dx=2e^x\cos x+\int2e^x\sin x\,dx$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 이를 첫 번째 식에 대입하면 $\displaystyle\int2e^x\sin x\,dx=e^x(\sin x-\cos x)+C$ (단, $C$는 적분상수)를 얻는다.
      criteria:
      - 1.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
