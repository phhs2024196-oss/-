  [1.1] 삼차방정식을 인수분해해 정수가 아닌 두 근의 합·곱을 얻는 단계. [1.2] $k$와 $10-k$를 짝지어 $f$, $g$의 대칭성을 쓰는 단계. [1.3] 명제가 거짓이 되는 반례 가능성이 있는 카드(대우 포함)를 빠짐없이 고르는 단계.
