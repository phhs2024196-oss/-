intent: |
  교과서에서 기본적으로 학습하는 이차방정식의 근과 계수의 관계, 지수함수와 역함수의 원리, 명제의 역과 대우의 관계를 올바르게 이해하고 적용할 수 있는지 평가한다. (출제배경)
key_idea: |
  [1.1] 조립제법으로 $(x+2)(x^2-20x+20)=0$, 근과 계수의 관계로 $\alpha+\beta=\alpha\beta=20$. [1.2] 역함수 $g(x)=\dfrac12\ln\dfrac{ex}{1-x}$, $f(x)+f(1-x)=1$, $g(x)+g(1-x)=1$로 짝지어 합 구하기. [1.3] 명제와 그 대우를 모두 확인하는 카드를 찾는다.
