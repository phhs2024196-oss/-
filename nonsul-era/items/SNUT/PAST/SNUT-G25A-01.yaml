subparts:
- id: '1'
  stem: |
    방정식 $x^3-18x^2-20x+40=0$의 정수가 아닌 두 실근을 $\alpha$, $\beta$ ($\alpha>\beta$)라고 하자.
    $\dfrac{\sqrt{\alpha}+\sqrt{\beta}}{\sqrt{\alpha}-\sqrt{\beta}}=p+q\sqrt{r}$일 때 $p+q+r$의 값을 구하시오. (단, $p$, $q$는 유리수이고 $r$은 소수이다.)
  points: 11   # 소문항 배점 미공개 — 추정(34점을 11·11·12로 균등 추정)
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: |
        인수분해하면 $(x+2)(x^2-20x+20)=0$이다. (조립제법으로 $x=-2$가 근임을 확인: $x^3-18x^2-20x+40=(x+2)(x^2-20x+20)$.) 정수가 아닌 두 실근은 $x^2-20x+20=0$의 두 근이므로 이차방정식의 근과 계수의 관계에 의하여 $\alpha+\beta=20$, $\alpha\beta=20$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $(\alpha-\beta)^2=(\alpha+\beta)^2-4\alpha\beta=320$이고 $\alpha>\beta$이므로 $\alpha-\beta=8\sqrt5$이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        분자·분모에 $\sqrt\alpha+\sqrt\beta$를 곱하면
        $$\dfrac{\sqrt{\alpha}+\sqrt{\beta}}{\sqrt{\alpha}-\sqrt{\beta}}=\dfrac{\alpha+\beta+2\sqrt{\alpha\beta}}{\alpha-\beta}=\dfrac{20+4\sqrt5}{8\sqrt5}=\dfrac12+\dfrac12\sqrt5$$
        이므로 $p=\dfrac12$, $q=\dfrac12$, $r=5$이다. 따라서 $p+q+r=6$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 4, evidence: '$(x+2)(x^2-20x+20)=0$으로 인수분해하고 $\alpha+\beta=20$, $\alpha\beta=20$을 적었다.', steps: [1b-1]}
    - {id: 1.M2, mark_type: M, points: 3, evidence: '$(\alpha-\beta)^2=320$에서 $\alpha-\beta=8\sqrt5$를 구했다.', depends_on: [1.M1], steps: [1b-2]}
    - {id: 1.A1, mark_type: A, points: 4, evidence: '유리화하여 $p=q=\dfrac12$, $r=5$, $p+q+r=6$을 구했다.', depends_on: [1.M2], steps: [1b-3]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    함수 $f(x)=\dfrac{e^{2x}}{e^{2x}+e}$의 역함수를 $g(x)$라고 하자. $0<x<1$인 $x$에 대하여
    $$f(x)+f(1-x)=a,\qquad g(x)+g(1-x)=b,\qquad \sum_{k=1}^{9}\left\{f\left(\dfrac{k}{10}\right)+g\left(\dfrac{k}{10}\right)\right\}=c$$
    일 때, $a+b+c$의 값을 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: value, value: '11', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.2]
    steps:
    - id: 2b-1
      content: |
        $y=\dfrac{e^{2x}}{e^{2x}+e}$를 $x$에 대해 풀면 $e^{2x}(1-y)=ey$, 즉 $x=\dfrac12\ln\dfrac{ey}{1-y}$이므로 역함수는 $g(x)=\dfrac12\ln\dfrac{ex}{1-x}$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $$a=f(x)+f(1-x)=\dfrac{e^{2x}}{e^{2x}+e}+\dfrac{e^{2-2x}}{e^{2-2x}+e}=1$$
        $$b=g(x)+g(1-x)=\dfrac12\ln\dfrac{ex}{1-x}+\dfrac12\ln\dfrac{e(1-x)}{x}=1$$
        (둘째 항의 분자·분모에 $e^{2x}$를 곱하면 $\dfrac{e^{2-2x}}{e^{2-2x}+e}=\dfrac{e}{e^{2x}+e}$이므로 합이 1이 된다.)
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $k$와 $10-k$를 짝지으면
        $$c=\sum_{k=1}^{9}\left\{f\left(\dfrac{k}{10}\right)+g\left(\dfrac{k}{10}\right)\right\}=\dfrac12\sum_{k=1}^{9}\left\{f\left(\dfrac{k}{10}\right)+f\left(1-\dfrac{k}{10}\right)+g\left(\dfrac{k}{10}\right)+g\left(1-\dfrac{k}{10}\right)\right\}=9$$
        이다. 따라서 $a+b+c=11$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 3, evidence: '역함수 $g(x)=\dfrac12\ln\dfrac{ex}{1-x}$를 구했다.', steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 4, evidence: '$a=1$, $b=1$임을 계산으로 보였다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 4, evidence: '$k$와 $10-k$를 짝지어 $c=9$, $a+b+c=11$을 구했다.', depends_on: [2.M2], steps: [2b-3]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    한쪽 면에는 자연수가 적혀 있고, 다른 쪽 면에는 해, 달, 별, 구름 중 하나의 모양이 그려진 카드 8장이 그림과 같이 놓여 있다.
    [그림] 카드 8장이 왼쪽부터 일렬로 놓여 있고 보이는 면은 차례로 2, 해, 달, 7, 별, 10, 3, 구름이다. (2, 7, 10, 3은 숫자가 적힌 면, 해·달·별·구름은 모양이 그려진 면)
    다음 두 명제가 참인지 확인하기 위해 반드시 뒤집어 볼 필요가 있는 카드를 모두 찾고, 그 이유를 설명하시오.
    - 짝수가 적힌 카드의 뒷면에는 해 또는 달이 그려져 있다.
    - 별이 그려진 카드의 뒷면에는 7 이상의 자연수가 적혀 있다.
  points: 12   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: set, value: '2, 3, 10, 별, 구름', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.3]
    steps:
    - id: 3b-1
      content: |
        명제 '짝수가 적힌 카드의 뒷면에는 해 또는 달이 그려져 있다'가 참인지 확인하는 데 필요한 카드는 2, 10이 적혀 있는 카드이다. 또한 이 명제의 대우인 '해도 아니고 달도 아닌 모양이 그려진 카드의 뒷면에는 홀수가 적혀 있다.'가 참인지 확인하는 데 필요한 카드는 별, 구름이 그려진 카드이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        명제 '별이 그려진 카드의 뒷면에는 7 이상의 자연수가 적혀 있다'가 참인지 확인하는 데 필요한 카드는 별이 그려진 카드이다. 또한 이 명제의 대우인 '7 미만의 자연수가 적힌 카드의 뒷면에는 별이 그려져 있지 않다'가 참인지 확인하는 데 필요한 카드는 2, 3이 적힌 카드이다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        따라서 반드시 뒤집어 볼 필요가 있는 카드는 2, 3, 10, 별, 구름이다.
      criteria: [3.A1]
