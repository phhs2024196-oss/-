- id: '3'
  stem: |
    문항 [2.1]에서 구한 $k$의 값에 대하여 곡선 $y=2\ln x$의 $x=1$에서 $x=k$까지의 길이를 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: ['1']
  answer: {kind: value, value: 'sqrt(5)+2*log((3+sqrt(5))/2)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.3]
    steps:
    - id: 3b-1
      content: |
        곡선 $y=2\ln x$의 $x=1$에서 $x=4$까지의 길이 $L$은
        $$L=\int_1^4\sqrt{1+\left(\dfrac{dy}{dx}\right)^2}\,dx=\int_1^4\dfrac{\sqrt{x^2+4}}{x}\,dx$$
        이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $\sqrt{x^2+4}=t$로 놓으면 $\dfrac{dt}{dx}=\dfrac{x}{\sqrt{x^2+4}}$이고, $x=1$일 때 $t=\sqrt5$, $x=4$일 때 $t=2\sqrt5$이므로
        $$L=\int_1^4\dfrac{x^2+4}{x^2}\cdot\dfrac{x}{\sqrt{x^2+4}}\,dx=\int_{\sqrt5}^{2\sqrt5}\dfrac{t^2}{t^2-4}\,dt$$
        (제시문 (라)의 치환적분법. $x^2=t^2-4$.)
      criteria: [3.M2]
    - id: 3b-3
      content: |
        $$L=\left[t+\ln\dfrac{t-2}{t+2}\right]_{\sqrt5}^{2\sqrt5}=\sqrt5+2\ln\dfrac{3+\sqrt5}{2}$$
        (보충: $\dfrac{t^2}{t^2-4}=1+\dfrac1{t-2}-\dfrac1{t+2}$이고, $\dfrac{(\sqrt5-1)/(\sqrt5+1)}{(\sqrt5-2)/(\sqrt5+2)}=\dfrac{7+3\sqrt5}{2}=\left(\dfrac{3+\sqrt5}{2}\right)^2$.)
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 3.M1, mark_type: M, points: 3, evidence: '곡선의 길이 공식으로 $L=\displaystyle\int_1^4\dfrac{\sqrt{x^2+4}}{x}dx$를 세웠다.', steps: [3b-1]}
