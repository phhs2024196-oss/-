stimuli:
- label: 가
  body: |
    곡선 $y=2\ln x$는 서로 다른 세 점 $\mathrm{A}\left(\dfrac12,-2\ln2\right)$, $\mathrm{B}(1,0)$, $\mathrm{C}(k,2\ln k)$를 지나고 직선 $l_1$과는 두 점 A와 C에서 만난다. (단, $k$는 상수이고 $k>1$이다.)
- label: 나
  body: |
    $x$축 위의 점 D에 대하여 점 A는 선분 DC를 $1:3$으로 외분하는 점이다.
- label: 다
  body: |
    곡선 $y=2\ln x$ 위의 점 C에서의 접선을 직선 $y=x$에 대하여 대칭이동한 직선을 $l_2$라고 하자.
    [그림] 좌표평면에 곡선 $y=2\ln x$(위로 볼록, 증가)가 그려져 있다. 곡선은 $x$축과 점 B에서 만나고, 곡선 위에서 $x$축 아래쪽에 점 A, 위쪽 오른쪽에 점 C가 있다. 직선 $l_1$은 점 A, 점 D, 점 C를 차례로 지나며 점 D는 $x$축 위에서 B의 오른쪽에 있다. 원점 O, $x$축·$y$축 표시.
- label: 라
  body: |
    정적분의 치환적분법
    미분가능한 함수 $t=g(x)$의 도함수 $g'(x)$가 닫힌구간 $[a,b]$에서 연속이고, $g(a)=\alpha$, $g(b)=\beta$에 대하여 함수 $f(t)$가 $\alpha$와 $\beta$를 양 끝으로 하는 닫힌구간에서 연속일 때
    $$\int_a^bf(g(x))g'(x)\,dx=\int_\alpha^\beta f(t)\,dt$$

stem: |
  다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    상수 $k$의 값과 직선 $l_1$의 방정식을 각각 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정(33점을 11점씩 균등 추정)
  depends_on: []
  answer: {kind: expression, value: 'k=4; y=(12*log(2)/7)*x-20*log(2)/7', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [2.1]
    steps:
    - id: 1b-1
      content: |
        점 D를 $(d,0)$이라 하면 점 A의 좌표는 $\left(\dfrac{k-3d}{1-3},\dfrac{2\ln k}{1-3}\right)$이다. 이것이 $\left(\dfrac12,-2\ln2\right)$이므로 $\ln k=2\ln2$에서 $k=4$이고, $\dfrac{4-3d}{-2}=\dfrac12$에서 $d=\dfrac53$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        직선 $l_1$은 $\mathrm{A}\left(\dfrac12,-2\ln2\right)$, $\mathrm{C}(4,4\ln2)$를 지나므로 기울기는 $\dfrac{6\ln2}{7/2}=\dfrac{12\ln2}{7}$이고, 방정식은 $y=\dfrac{12\ln2}{7}x-\dfrac{20\ln2}{7}$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 6, evidence: '외분점 공식으로 $k=4$(및 $d=\dfrac53$)를 구했다.', steps: [1b-1]}
    - {id: 1.A1, mark_type: A, points: 5, evidence: '$l_1$의 기울기 $\dfrac{12\ln2}{7}$와 방정식 $y=\dfrac{12\ln2}{7}x-\dfrac{20\ln2}{7}$을 구했다.', depends_on: [1.M1], steps: [1b-2]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    점 C와 직선 $l_2$ 사이의 거리를 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: ['1']
  answer: {kind: value, value: '(12-12*log(2))/sqrt(5)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [2.2]
    steps:
    - id: 2b-1
      content: |
        곡선 $y=2\ln x$의 도함수는 $y'=\dfrac2x$이므로 점 $\mathrm{C}(4,4\ln2)$에서의 접선의 기울기는 $\dfrac12$이고 접선의 방정식은 $y=\dfrac12x+4\ln2-2$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        직선 $y=x$에 대해 대칭이동하면 $x$와 $y$를 바꾸어 $x=\dfrac12y+4\ln2-2$, 즉 $l_2:\ 2x-y+4-8\ln2=0$이다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        점 $\mathrm{C}(4,4\ln2)$와 직선 $l_2$ 사이의 거리는
        $$\dfrac{\lvert8-4\ln2+4-8\ln2\rvert}{\sqrt5}=\dfrac{12-12\ln2}{\sqrt5}$$
        이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 3, evidence: '점 C에서의 접선의 방정식 $y=\dfrac12x+4\ln2-2$를 구했다.', steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 4, evidence: '$x$와 $y$를 바꾸어 $l_2:\ 2x-y+4-8\ln2=0$을 구했다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 4, evidence: '점과 직선 사이의 거리 공식으로 $\dfrac{12-12\ln2}{\sqrt5}$를 구했다.', depends_on: [2.M2], steps: [2b-3]}
