    - {id: 3.A1, mark_type: A, points: 4, evidence: '부분분수로 적분하여 $L=\sqrt5+2\ln\dfrac{3+\sqrt5}{2}$를 구했다.', depends_on: [3.M2], steps: [3b-3]}
