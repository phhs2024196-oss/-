intent: |
  로그함수 및 직선으로 이루어진 상황을 외분점의 정의, 접선 및 대칭이동, 곡선 길이의 적분 등을 이용해서 파악할 수 있는지 평가한다. [2.1] 외분점의 정의로 좌표값과 직선의 방정식을 구하는지, [2.2] 앞 문항의 값을 활용해 점과 직선 사이의 거리를 구하는지, [2.3] 정적분(치환적분)으로 곡선의 길이를 구하는지 본다. (출제배경)
key_idea: |
  외분점 공식으로 $k=4$, $D\left(\dfrac53,0\right)$를 구해 $l_1$을 정한다. $C(4,4\ln2)$에서의 접선 $y=\dfrac12x+4\ln2-2$를 $y=x$에 대칭이동한 $l_2$와 $C$ 사이의 거리를 점과 직선 사이의 거리 공식으로 구한다. 곡선의 길이 $\int_1^4\dfrac{\sqrt{x^2+4}}{x}dx$는 $t=\sqrt{x^2+4}$로 치환해 유리함수의 적분으로 바꾼다.
stuck: |
  [2.1] $\mathrm{A}$가 선분 $\mathrm{DC}$를 $1:3$으로 외분한다는 조건을 좌표식으로 옮기는 단계. [2.2] 접선을 $y=x$에 대칭이동할 때 $x$, $y$를 바꾸는 단계. [2.3] $\sqrt{x^2+4}=t$ 치환 후 $\dfrac{t^2}{t^2-4}$를 부분분수로 적분하는 단계.
