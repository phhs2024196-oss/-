intent: |
  삼각함수와 삼각함수를 포함하는 함수의 특성을 방정식, 도함수, 수열 및 수열의 합 등의 개념을 이용해 논리적으로 탐구해 나갈 수 있는지 평가한다. 삼각함수를 포함하는 방정식의 해와 이들의 도함수를 구할 수 있고, 삼각함수의 주기성으로 비롯된 수열의 규칙성을 발견하여 부분합 및 급수를 구할 수 있는지 평가한다. (출제배경)
key_idea: |
  $\cos x=0$이므로 $x_n=\dfrac{(2n-1)\pi}{2}$. 접선의 $y$절편 $y_n=\dfrac{\sin x_n}{x_n}$이므로 $x_ny_n=\sin x_n=(-1)^{n+1}$. 삼각형의 넓이 $A_n=\dfrac1{2n-1}$이고 $A_nA_{n+1}$을 부분분수로 분해해 부분합과 극한을 구한다.
stuck: |
  [3.2] 접선의 $y$절편이 $\dfrac{\sin x_n}{x_n}$로 정리되는 것(분모의 $\cos x_n=0$ 소거)과 $\sin x_n$의 부호가 번갈아 나타남을 보는 단계. [3.3] $\lvert y_n\rvert$로 삼각형의 높이를 잡고 $A_nA_{n+1}$을 부분분수로 쪼개는 단계.
