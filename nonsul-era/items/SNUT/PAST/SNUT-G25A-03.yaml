stimuli:
- label: 가   # 원문에는 라벨이 없는 단일 제시문 상자
  body: |
    함수 $f(x)=\dfrac{\cos x}{x^2}$ ($x>0$)에 대하여 곡선 $y=f(x)$와 $x$축이 만나는 점의 $x$좌표를 작은 것부터 차례로 $x_1,x_2,x_3,\cdots$이라고 하자. 또, 자연수 $n$에 대하여 곡선 $y=f(x)$ 위의 점 $\mathrm{P}_n(x_n,0)$에서의 접선과 $y$축이 만나는 점을 $\mathrm{Q}_n(0,y_n)$이라고 하자.

stem: |
  다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    자연수 $n$에 대하여 $x_n$을 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정(33점을 11점씩 균등 추정)
  depends_on: []
  answer: {kind: expression, value: '(2*n-1)*pi/2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.1]
    steps:
    - id: 1b-1
      content: |
        $\cos x=0$이 되는 $x$를 찾으면 된다. 따라서 $x>0$에서 작은 것부터 $x_n=\dfrac{(2n-1)\pi}{2}$이다.
      criteria: [1.M1, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 5, evidence: '$f(x)=0$이 $\cos x=0$과 동치임을 이용해 $x=\dfrac\pi2+m\pi$ 꼴의 해를 적었다.', steps: [1b-1]}
    - {id: 1.A1, mark_type: A, points: 6, evidence: '$x>0$에서 작은 것부터 번호를 붙여 $x_n=\dfrac{(2n-1)\pi}{2}$를 구했다.', depends_on: [1.M1], steps: [1b-1]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    $\displaystyle\sum_{n=1}^{2025}x_ny_n$의 값을 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: ['1']
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.2]
    steps:
    - id: 2b-1
      content: |
        $f(x)$를 미분하면 $f'(x)=-\dfrac{\sin x}{x^2}-\dfrac{2\cos x}{x^3}$이므로 $f'(x_n)=-\dfrac{\sin x_n}{x_n^2}-\dfrac{2\cos x_n}{x_n^3}=-\dfrac{\sin x_n}{x_n^2}$이다. ($\cos x_n=0$)
      criteria: [2.M1]
    - id: 2b-2
      content: |
        점 $\mathrm{P}_n$에서 곡선 $y=f(x)$의 접선의 방정식은 $y=-\dfrac{\sin x_n}{x_n^2}(x-x_n)$이고 이 직선의 $y$절편은 $y_n=\dfrac{\sin x_n}{x_n}$이다. 따라서
        $$x_ny_n=\sin x_n=\begin{cases}1&(n=1,3,5,\cdots)\\-1&(n=2,4,6,\cdots)\end{cases}$$
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $\displaystyle\sum_{n=1}^{2025}x_ny_n=1$이다. (보충: 2025항에서 인접한 $(+1)+(-1)$ 1012쌍은 0이고 마지막 제2025항이 $+1$이다.)
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 3, evidence: '$f''(x)=-\dfrac{\sin x}{x^2}-\dfrac{2\cos x}{x^3}$를 구하고 $f''(x_n)=-\dfrac{\sin x_n}{x_n^2}$로 정리했다.', steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 4, evidence: '접선의 $y$절편 $y_n=\dfrac{\sin x_n}{x_n}$와 $x_ny_n=\sin x_n=(-1)^{n+1}$을 적었다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 4, evidence: '합 $\displaystyle\sum_{n=1}^{2025}x_ny_n=1$을 구했다.', depends_on: [2.M2], steps: [2b-3]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    자연수 $n$에 대하여 삼각형 $\mathrm{P}_n\mathrm{P}_{n+1}\mathrm{Q}_n$의 넓이를 $A_n$이라고 할 때, $\displaystyle\sum_{n=1}^{25}A_nA_{n+1}$과 $\displaystyle\sum_{n=1}^{\infty}A_nA_{n+1}$의 값을 각각 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: ['1', '2']
  answer: {kind: value, value: '25/51; 1/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.3]
    steps:
    - id: 3b-1
      content: |
        두 점 $\mathrm{P}_n$과 $\mathrm{P}_{n+1}$ 사이의 거리는 $\pi$이고 $\lvert y_n\rvert=\dfrac{\lvert\sin x_n\rvert}{x_n}=\dfrac{2}{(2n-1)\pi}$이므로
        $$A_n=\dfrac12\times\pi\times\dfrac{2}{(2n-1)\pi}=\dfrac1{2n-1}$$
        이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        부분합은
        $$S_n=\sum_{k=1}^nA_kA_{k+1}=\sum_{k=1}^n\dfrac1{(2k-1)(2k+1)}=\sum_{k=1}^n\dfrac12\left(\dfrac1{2k-1}-\dfrac1{2k+1}\right)=\dfrac{n}{2n+1}$$
        이므로 $\displaystyle\sum_{n=1}^{25}A_nA_{n+1}=\dfrac{25}{51}$이다.
      criteria: [3.M2, 3.A1]
    - id: 3b-3
      content: |
        급수의 합은 $\displaystyle\sum_{n=1}^{\infty}A_nA_{n+1}=\lim_{n\to\infty}S_n=\lim_{n\to\infty}\dfrac{n}{2n+1}=\dfrac12$이다.
      criteria: [3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 3.M1, mark_type: M, points: 3, evidence: '밑변 $\pi$, 높이 $\lvert y_n\rvert=\dfrac{2}{(2n-1)\pi}$로 $A_n=\dfrac1{2n-1}$을 구했다.', steps: [3b-1]}
    - {id: 3.M2, mark_type: M, points: 3, evidence: '$A_kA_{k+1}=\dfrac12\left(\dfrac1{2k-1}-\dfrac1{2k+1}\right)$로 부분분수 분해하여 부분합 $S_n=\dfrac{n}{2n+1}$을 구했다.', depends_on: [3.M1], steps: [3b-2]}
    - {id: 3.A1, mark_type: A, points: 2, evidence: '$\displaystyle\sum_{n=1}^{25}A_nA_{n+1}=\dfrac{25}{51}$을 구했다.', depends_on: [3.M2], steps: [3b-2]}
    - {id: 3.A2, mark_type: A, points: 3, evidence: '$\displaystyle\lim_{n\to\infty}S_n$으로 급수의 합 $\dfrac12$을 구했다.', depends_on: [3.M2], steps: [3b-3]}
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
