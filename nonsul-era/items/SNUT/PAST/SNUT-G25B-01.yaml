subparts:
- id: '1'
  stem: |
    수직선 위를 움직이는 점 P의 시각 $t$ ($t\ge0$)에서의 속도가 $v(t)=\lvert t-5\rvert$일 때, 점 P의 위치를 $x(t)$라고 하자. $x(0)=0$일 때, $x(t)\le8$ 또는 $x(t)\ge14$를 만족하는 $t$의 범위를 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정(34점을 11·11·12로 균등 추정)
  depends_on: []
  answer: {kind: set, value: '0<=t<=2 or t>=5+sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: |
        $v(t)$의 절댓값 기호 안의 식을 0 이상인 경우와 0 미만인 경우로 범위를 나누면
        $$v(t)=\begin{cases}-t+5&(0\le t<5)\\t-5&(t\ge5)\end{cases},\qquad x(t)=\begin{cases}-\dfrac{t^2}2+5t&(0\le t<5)\\\dfrac{t^2}2-5t+25&(t\ge5)\end{cases}$$
        이다. (보충: $x(t)=\int_0^tv(s)\,ds$, $x(5)=\dfrac{25}2$)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $x(5)=\dfrac{25}2$이므로 $x(t)\le8$은 $0\le t<5$일 때 가능하고 $x(t)\ge14$는 $t\ge5$일 때 가능하다. 각 경우에 대하여 $-\dfrac{t^2}2+5t\le8$에서 $t\le2$이고, $\dfrac{t^2}2-5t+25\ge14$에서 $t\ge5+\sqrt3$이다. 따라서 $0\le t\le2$ 또는 $t\ge5+\sqrt3$이다.
      criteria: [1.M2, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 4, evidence: '$t=5$를 경계로 속도를 나누어 구간별 위치 $x(t)$를 구했다.', steps: [1b-1]}
    - {id: 1.M2, mark_type: M, points: 4, evidence: '$x(5)=\dfrac{25}2$로 각 부등식이 가능한 구간을 판단하고 이차부등식을 세워 풀었다.', depends_on: [1.M1], steps: [1b-2]}
    - {id: 1.A1, mark_type: A, points: 3, evidence: '$0\le t\le2$ 또는 $t\ge5+\sqrt3$을 구했다.', depends_on: [1.M2], steps: [1b-2]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    1보다 큰 자연수 $n$에 대하여 두 직선 $y=x$와 $y=\dfrac xn$가 이루는 예각의 크기를 $\theta_n$이라고 할 때, $\tan\theta_2\times\tan\theta_3\times\cdots\times\tan\theta_{20}$의 값을 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: value, value: '1/210', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.2]
    steps:
    - id: 2b-1
      content: |
        직선 $y=\dfrac xn$와 $x$축이 이루는 예각의 크기를 $\alpha_n$이라고 하면
        $$\tan\theta_n=\tan\left(\dfrac\pi4-\alpha_n\right)=\dfrac{\tan\dfrac\pi4-\tan\alpha_n}{1+\tan\dfrac\pi4\tan\alpha_n}=\dfrac{1-\dfrac1n}{1+\dfrac1n}=\dfrac{n-1}{n+1}$$
        이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 $\tan\theta_2\times\tan\theta_3\times\cdots\times\tan\theta_{20}=\dfrac13\times\dfrac24\times\dfrac35\times\cdots\times\dfrac{19}{21}=\dfrac1{210}$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 6, evidence: '$\theta_n=\dfrac\pi4-\alpha_n$와 덧셈정리로 $\tan\theta_n=\dfrac{n-1}{n+1}$를 구했다.', steps: [2b-1]}
    - {id: 2.A1, mark_type: A, points: 5, evidence: '곱을 소거하여 $\dfrac1{210}$을 구했다.', depends_on: [2.M1], steps: [2b-2]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    그림과 같이 정사각형의 각 변을 각각 4등분하는 16개의 점이 있다. 이 중 서로 다른 4개의 점을 꼭짓점으로 하는 사각형의 개수를 구하시오.
    [그림] 정사각형이 있고 각 변을 4등분하는 점이 찍혀 있다. 네 꼭짓점을 포함해 각 변 위에 점이 5개씩(꼭짓점은 두 변에 공통) 있으며 모두 16개이다.
  points: 12   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: value, value: '1360', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1~2 [1.3]
    steps:
    - id: 3b-1
      content: |
        서로 다른 4개의 점을 택하는 모든 경우의 수는 $_{16}\mathrm{C}_4=1{,}820$이다. 이 중에서 사각형이 이루어지지 않는 조건은 다음의 두 경우로 나눌 수 있다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        i) 4개의 점이 한 변 위에 있는 경우의 수는 $_5\mathrm{C}_4\times4=20$이다.
        ii) 3개의 점이 한 변 위에 있고 1개의 점은 다른 변 위에 있는 경우의 수는 $_5\mathrm{C}_3\times11\times4=440$이다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        따라서 사각형의 개수는 $1{,}820-20-440=1{,}360$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 3.M1, mark_type: M, points: 3, evidence: '전체 경우의 수 $_{16}\mathrm{C}_4=1820$과 사각형이 안 되는 경우(세 점 이상이 한 직선 위)를 구분했다.', steps: [3b-1]}
    - {id: 3.M2, mark_type: M, points: 6, evidence: '한 변 위 4점 20가지, 한 변 위 3점과 다른 점 1개 440가지를 중복 없이 셌다.', depends_on: [3.M1], steps: [3b-2]}
    - {id: 3.A1, mark_type: A, points: 3, evidence: '$1820-20-440=1360$을 구했다.', depends_on: [3.M2], steps: [3b-3]}
    deductions:
