intent: |
  이공계열에서 대학 수준의 학문을 다루기 위해 필수적으로 알아야 하는 고등학교 수학 교과과정의 내용을 충분히 이해하고, 이를 다양한 문제상황에 적용할 수 있는지 확인한다. 이차부등식, 속도와 거리, 여러 가지 함수의 정적분, 삼각함수의 덧셈정리, 조합 등의 개념을 이해하고 주어진 문항에 적용할 수 있는지 평가한다. [1.1] 속도와 거리의 관계를 정적분으로 나타내고 이차부등식과 절댓값을 포함한 일차부등식을 푸는지, [1.2] 직선의 기울기와 삼각함수 사이의 관계와 덧셈정리로 기본적인 수열의 합(곱)을 구하는지, [1.3] 조건을 분석해 조합의 수를 구하는지 본다. (출제배경)
key_idea: |
  [1.1] 속도의 부호가 $t=5$에서 바뀌므로 구간을 나누어 $x(t)$를 구하고 이차부등식을 푼다. [1.2] $\theta_n=\dfrac\pi4-\alpha_n$이므로 $\tan\theta_n=\dfrac{n-1}{n+1}$로 곱이 소거된다. [1.3] 전체 $_{16}\mathrm{C}_4$에서 사각형이 안 되는 경우(한 변 위의 점 4개, 3개)를 뺀다.
stuck: |
  [1.1] 절댓값 때문에 $t=5$를 경계로 $x(t)$를 분리하고 각 구간에서 부등식의 해를 구간과 맞추는 단계. [1.2] 두 직선이 이루는 예각을 $\dfrac\pi4-\alpha_n$으로 보는 단계. [1.3] 한 직선 위에 있는 3점·4점 경우를 빠짐없이 세는 단계.
