stimuli:
- label: 가   # 원문에는 라벨이 없는 단일 제시문 상자
  body: |
    그림과 같이 가로와 세로의 길이가 각각 4, 5인 직사각형 ABCD가 있다. 두 점 P, U는 변 AB 위에 있고 점 Q는 변 CD 위에 있다. 두 점 X, Y는 각각 두 변 AD, BC 위를 움직인다. $\overline{\mathrm{AP}}=1$이고 $\overline{\mathrm{CQ}}=2$이다.
    [그림] 직사각형 ABCD (왼쪽 위 A, 왼쪽 아래 B, 오른쪽 아래 C, 오른쪽 위 D; 가로 4, 세로 5). 변 AB 위에 위에서부터 점 P, U가 있고(P가 A에 가깝다), 변 CD 위에 점 Q(C 쪽에 가깝다), 윗변 AD 위에 점 X, 아랫변 BC 위에 점 Y가 있다. 선분 PX, 선분 XY, 선분 YQ가 그려져 있다.

stem: |
  다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $\overline{\mathrm{PX}}+\overline{\mathrm{XY}}+\overline{\mathrm{YQ}}$의 최솟값을 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정(33점을 11점씩 균등 추정)
  depends_on: []
  answer: {kind: value, value: '4*sqrt(5)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.1]
    steps:
    - id: 1b-1
      content: |
        점 B를 원점, 직선 BC를 $x$축, 직선 AB를 $y$축으로 하는 좌표평면에서 점 $\mathrm{P}'$은 $(0,6)$, 점 $\mathrm{Q}'$은 $(4,-2)$라고 하자. ($\mathrm{P}'$은 $\mathrm{P}(0,4)$를 직선 AD에 대해, $\mathrm{Q}'$은 $\mathrm{Q}(4,2)$를 직선 BC에 대해 대칭이동한 점이다.)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\overline{\mathrm{PX}}=\overline{\mathrm{P'X}}$, $\overline{\mathrm{YQ}}=\overline{\mathrm{YQ'}}$이므로
        $$\overline{\mathrm{PX}}+\overline{\mathrm{XY}}+\overline{\mathrm{YQ}}=\overline{\mathrm{P'X}}+\overline{\mathrm{XY}}+\overline{\mathrm{YQ'}}\ge\overline{\mathrm{P'Q'}}$$
        이다. 따라서 구하는 최솟값은 $\overline{\mathrm{P'Q'}}=4\sqrt5$이다.
      criteria: [1.M2, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 4, evidence: '좌표를 설정하고 대칭점 $\mathrm{P}''(0,6)$, $\mathrm{Q}''(4,-2)$를 구했다.', steps: [1b-1]}
    - {id: 1.M2, mark_type: M, points: 4, evidence: '$\overline{\mathrm{PX}}+\overline{\mathrm{XY}}+\overline{\mathrm{YQ}}\ge\overline{\mathrm{P''Q''}}$를 적었다(등호 성립 가능 확인 포함).', depends_on: [1.M1], steps: [1b-2]}
    - {id: 1.A1, mark_type: A, points: 3, evidence: '최솟값 $4\sqrt5$를 구했다.', depends_on: [1.M2], steps: [1b-2]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    문항 [2.1]의 $\overline{\mathrm{PX}}+\overline{\mathrm{XY}}+\overline{\mathrm{YQ}}$가 최솟값을 가질 때의 점 X, Y에 대하여 선분 XY와 선분 UD의 교점을 M이라고 하자. 삼각형 MUY에서 등식
    $$\overline{\mathrm{UY}}\sin M=\overline{\mathrm{YM}}\sin U+\overline{\mathrm{MU}}\sin Y$$
    가 성립할 때, 삼각형 MUY의 외접원의 반지름의 길이를 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: ['1']
  answer: {kind: value, value: '3*sqrt(2)/2', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.2]
    steps:
    - id: 2b-1
      content: |
        삼각형 MUY에서 외접원의 반지름의 길이를 $R$이라 할 때, 주어진 등식에 사인법칙을 이용하면
        $$\dfrac{\overline{\mathrm{UY}}^2}{2R}=\dfrac{\overline{\mathrm{YM}}^2}{2R}+\dfrac{\overline{\mathrm{MU}}^2}{2R}$$
        이므로 삼각형 MUY는 $\angle\mathrm{M}$이 직각인 직각삼각형이고 $\overline{\mathrm{UY}}=2R$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        한편, 직선 $\mathrm{P'Q'}$의 방정식은 $y=-2x+6$이고, 직선 $\mathrm{P'Q'}$ 위의 점 Y의 좌표는 $\mathrm{Y}(3,0)$이다. 점 U는 직선 XY에 수직이고 점 D를 지나는 직선 $y=\dfrac12x+3$ 위의 점이므로, 점 U의 좌표는 $(0,3)$이다. 따라서 $R=\dfrac{\overline{\mathrm{UY}}}2=\dfrac{3\sqrt2}2$이다.
      criteria: [2.M2, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 4, evidence: '사인법칙으로 $\overline{\mathrm{UY}}^2=\overline{\mathrm{YM}}^2+\overline{\mathrm{MU}}^2$을 얻어 $\angle\mathrm{M}=90^\circ$, $\overline{\mathrm{UY}}=2R$임을 보였다.', steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 4, evidence: '직선 $\mathrm{P''Q''}$로 $\mathrm{Y}(3,0)$을, 직선 UD($y=\dfrac12x+3$)로 $\mathrm{U}(0,3)$을 구했다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 3, evidence: '$\overline{\mathrm{UY}}=3\sqrt2$, $R=\dfrac{3\sqrt2}2$를 구했다.', depends_on: [2.M2], steps: [2b-2]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    문항 [2.2]의 삼각형 MUY의 외접원에서 호 UY의 길이를 $n$등분하여 양 끝점과 각 분점을 차례로 $\mathrm{U}=\mathrm{V}_0,\mathrm{V}_1,\cdots,\mathrm{V}_{n-1},\mathrm{V}_n=\mathrm{Y}$라고 하자. 삼각형 $\mathrm{UYV}_k$ ($1\le k\le n-1$)의 넓이를 $S_k$라고 할 때, $\displaystyle\lim_{n\to\infty}\dfrac1n\sum_{k=1}^{n-1}S_k$의 값을 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: ['2']
  answer: {kind: value, value: '9/pi', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.3]
    steps:
    - id: 3b-1
      content: |
        문항 [2.2]에 의해 호 UY는 반원의 호이다. 반원의 중심을 O라고 하면 $\angle\mathrm{UOV}_k=\dfrac kn\pi$이고, 점 $\mathrm{V}_k$에서 선분 UY에 내린 수선의 발을 $\mathrm{H}_k$라고 하면 $\overline{\mathrm{V_kH_k}}=\dfrac{3\sqrt2}2\sin\dfrac kn\pi$이므로, 삼각형 $\mathrm{UYV}_k$의 넓이 $S_k$는
        $$S_k=\dfrac12\times\overline{\mathrm{UY}}\times\overline{\mathrm{V_kH_k}}=\dfrac12\times3\sqrt2\times\dfrac{3\sqrt2}2\sin\dfrac kn\pi=\dfrac92\sin\dfrac kn\pi$$
        이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $\sin\pi=0$이므로
        $$\lim_{n\to\infty}\dfrac1n\sum_{k=1}^{n-1}S_k=\lim_{n\to\infty}\dfrac1n\sum_{k=1}^{n-1}\dfrac92\sin\dfrac kn\pi=\dfrac1\pi\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac\pi n\cdot\dfrac92\sin\dfrac kn\pi=\dfrac9{2\pi}\int_0^\pi\sin x\,dx=\dfrac9\pi$$
        이다.
      criteria: [3.M2, 3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 3.M1, mark_type: M, points: 5, evidence: '높이 $\dfrac{3\sqrt2}2\sin\dfrac kn\pi$로 $S_k=\dfrac92\sin\dfrac kn\pi$를 구했다.', steps: [3b-1]}
    - {id: 3.M2, mark_type: M, points: 3, evidence: '$\dfrac1n\sum$을 구분구적법으로 정적분 $\dfrac9{2\pi}\displaystyle\int_0^\pi\sin x\,dx$로 바꾸었다.', depends_on: [3.M1], steps: [3b-2]}
    - {id: 3.A1, mark_type: A, points: 3, evidence: '극한값 $\dfrac9\pi$를 구했다.', depends_on: [3.M2], steps: [3b-2]}
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
