intent: |
  제시문에 설명한 도형을 이해하고 주어진 조건으로부터 필요한 결과를 도출하는 과정에서 고등학교 수학에서 익힌 기본 개념을 활용할 수 있는지 평가한다. 특히 도형의 대칭이동, 직선의 방정식, 두 점 사이의 거리, 삼각함수, 사인법칙, 여러 가지 함수의 적분, 정적분과 급수의 합 사이의 관계를 잘 알고 적용할 수 있는지 평가한다. [2.1] 대칭이동으로 거리의 합이 최소가 되는 점의 좌표를 구하는지, [2.2] 사인법칙으로 삼각형이 직각삼각형임을 구하고 조건에 맞는 직선의 방정식과 점의 좌표, 거리를 구하는지, [2.3] 삼각함수, 정적분과 급수의 합 사이의 관계를 이해하고 삼각함수의 적분을 구하는지 본다. (출제배경)
key_idea: |
  $\mathrm{P}$, $\mathrm{Q}$를 각각 변 $\mathrm{AD}$, $\mathrm{BC}$에 대해 대칭이동한 $\mathrm{P}'$, $\mathrm{Q}'$로 $\overline{\mathrm{PX}}+\overline{\mathrm{XY}}+\overline{\mathrm{YQ}}\ge\overline{\mathrm{P'Q'}}=4\sqrt5$. 사인법칙으로 $\angle\mathrm{M}=90^\circ$, $\overline{\mathrm{UY}}=2R$. 호를 $n$등분한 삼각형의 넓이 $S_k=\dfrac92\sin\dfrac kn\pi$를 구분구적법으로 정적분 $\dfrac9{2\pi}\int_0^\pi\sin x\,dx=\dfrac9\pi$로 바꾼다.
stuck: |
  [2.1] 두 변에 대한 반사를 동시에 써서 꺾인 경로를 직선으로 펴는 단계. [2.2] 주어진 등식을 사인법칙으로 바꿔 직각삼각형임을 알아내고 $\mathrm{U}$의 위치(직선 $\mathrm{XY}$에 수직이고 $\mathrm{D}$를 지나는 직선과 변 $\mathrm{AB}$의 교점)를 정하는 단계. [2.3] 호 위의 점에서 현까지의 높이를 $\dfrac{3\sqrt2}2\sin\dfrac kn\pi$로 쓰고 $\dfrac1n\sum$을 정적분으로 바꾸는 단계.
