- id: '2'
  stem: |
    문항 [3.1]의 방정식 $f(x)=0$은 열린구간 $(0,1)$에서 오직 하나의 실근을 가짐을 보이시오.
  points: 8   # 소문항 배점 미공개 — 추정
  depends_on: ['1']
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.2]
    steps:
    - id: 2b-1
      content: |
        문항 [3.1]에서 $f(x)=0$은 열린구간 $(0,1)$에서 실근을 가짐을 알았다. $f(x)$를 미분하면
        $$f'(x)=1-\dfrac1{x+3}>0,\qquad 0<x<1$$
        이므로 $f(x)$는 열린구간 $(0,1)$에서 증가함수이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 실근은 오직 하나이다.
      criteria: [2.R1]
  rubric:
