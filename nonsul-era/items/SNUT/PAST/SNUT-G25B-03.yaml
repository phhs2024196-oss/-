    criteria:
    - {id: 2.M1, mark_type: M, points: 5, evidence: '$f''(x)=1-\dfrac1{x+3}>0$ ($0<x<1$)임을 보여 $f$가 증가함수라고 적었다.', steps: [2b-1]}
    - {id: 2.R1, mark_type: R, points: 3, evidence: '[3.1]의 근의 존재와 증가함수임을 결합해 실근이 오직 하나라는 결론을 적었다.', depends_on: [2.M1], steps: [2b-2]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    문항 [3.1]의 $f(x)$와 $g(x)=\ln(x+3)-1$에 대하여 방정식 $f(x)=0$, 즉, $g(x)=x$의 실근을 $\alpha$라고 하자. $t>\alpha$일 때, 부등식
    $$0<g(t)-\alpha<\dfrac1p(t-\alpha)$$
    가 항상 성립하도록 하는 가장 큰 자연수 $p$의 값을 구하시오.
  points: 8   # 소문항 배점 미공개 — 추정
  depends_on: ['2']
  answer: {kind: value, value: '3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.3]
    steps:
    - id: 3b-1
      content: |
        문항 [3.2]에서 구한 실근을 $\alpha$라고 하면, 평균값 정리에 의하여
        $$g(t)-\alpha=g(t)-g(\alpha)=g'(c)(t-\alpha)$$
        인 $c$가 열린구간 $(\alpha,t)$에 적어도 하나 존재하는데
        $$0<g'(c)=\dfrac1{c+3}<\dfrac13\qquad(0<\alpha<c<t)$$
        이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        특히 $c<t<1$이면 $\dfrac1{c+3}>\dfrac14$이므로 $0<g(t)-\alpha<\dfrac1p(t-\alpha)$가 항상 성립하도록 하는 가장 큰 자연수 $p$의 값은 3이다. (참고로, 구간 $(-3,-2)$에 있는 실근을 택하면 $t<-2$일 경우에는 $g'(c)>g'(-2)=1$이므로 문제의 조건을 만족하지 않는다.)
      criteria: [3.M2, 3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 3.M1, mark_type: M, points: 4, evidence: '평균값 정리로 $g(t)-\alpha=g''(c)(t-\alpha)$, $0<g''(c)=\dfrac1{c+3}<\dfrac13$을 보였다.', steps: [3b-1]}
    - {id: 3.M2, mark_type: M, points: 2, evidence: '$g''(c)$의 범위와 $\dfrac1p$를 비교해 $p$의 조건을 세웠다.', depends_on: [3.M1], steps: [3b-2]}
    - {id: 3.A1, mark_type: A, points: 2, evidence: '가장 큰 자연수 $p=3$을 구했다.', depends_on: [3.M2], steps: [3b-2]}
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '4'
  stem: |
    문항 [3.3]의 $g(x)$에 대하여 수열 $\{a_n\}$은 $a_1=1$이고 $a_{n+1}=g(a_n)$을 만족한다. 부등식
    $$0<a_n-\alpha<M(1-\alpha)\qquad(n=1,2,3,\cdots)$$
    가 성립하도록 하는 $M$을 $n$에 대한 식으로 나타내고, 이를 이용하여 $\displaystyle\lim_{n\to\infty}a_n$의 값을 구하시오.
  points: 9   # 소문항 배점 미공개 — 추정
  depends_on: ['3']
  answer: {kind: expression, value: 'M=(1/3)**(n-1); alpha', equivalents: [], tolerance: null}
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [3.4]
    steps:
    - id: 4b-1
      content: |
        문항 [3.3]에 의하여
        $$0<a_n-\alpha=g(a_{n-1})-\alpha<\dfrac13(a_{n-1}-\alpha)<\cdots<\left(\dfrac13\right)^{n-1}(a_1-\alpha)=\left(\dfrac13\right)^{n-1}(1-\alpha)$$
        이므로 $M=\left(\dfrac13\right)^{n-1}$이다.
      criteria: [4.M1, 4.A1]
    - id: 4b-2
      content: |
        따라서 수열의 극한의 대소 관계(제시문 (다))에 의하여 $\displaystyle\lim_{n\to\infty}(a_n-\alpha)=0$이므로 $\displaystyle\lim_{n\to\infty}a_n=\alpha$이다.
      criteria: [4.M2, 4.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 4.M1, mark_type: M, points: 3, evidence: '[3.3]의 부등식을 $a_{n-1}$, $a_{n-2}$, $\cdots$에 반복 적용하는 식을 적었다.', steps: [4b-1]}
    - {id: 4.A1, mark_type: A, points: 2, evidence: '$M=\left(\dfrac13\right)^{n-1}$을 구했다.', depends_on: [4.M1], steps: [4b-1]}
    - {id: 4.M2, mark_type: M, points: 2, evidence: '$0<a_n-\alpha<\left(\dfrac13\right)^{n-1}(1-\alpha)$와 제시문 (다)로 $\displaystyle\lim_{n\to\infty}(a_n-\alpha)=0$을 보였다.', depends_on: [4.A1], steps: [4b-2]}
    - {id: 4.A2, mark_type: A, points: 2, evidence: '$\displaystyle\lim_{n\to\infty}a_n=\alpha$를 구했다.', depends_on: [4.M2], steps: [4b-2]}
