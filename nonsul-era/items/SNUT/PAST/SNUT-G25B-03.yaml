intent: |
  제시문에 설명한 성질들을 충분히 이해하고 활용하여 필요한 결과를 수학적으로 도출할 수 있는 능력은 이공계 대학 교육을 받는 학생에게 필수적인 것이다. 함수의 연속, 함수의 미분가능, 평균값 정리, 수열의 극한, 부등식의 성질 등 고등학생이 알아야 할 기본적인 개념을 알아야 한다. 이러한 성질들을 적절히 활용하여 문제에서 제시하는 과정을 거쳐 결론을 이끌어 낼 수 있는지 평가한다. [3.1] 사잇값 정리로 실근의 존재를, [3.2] 로그함수의 도함수로 실근의 유일성을, [3.3] 평균값 정리로 주어진 부등식을 만족하는 가장 큰 자연수를, [3.4] 등비수열의 극한과 수열의 극한의 대소 관계로 수열의 극한을 구할 수 있는지 평가한다. (출제배경)
key_idea: |
  $f$가 $[0,1]$에서 연속, $f(0)=1-\ln3<0$, $f(1)=2-\ln4>0$이므로 사잇값 정리로 $(0,1)$에서 근이 존재하고, $f'(x)=1-\dfrac1{x+3}>0$이라 유일하다. 평균값 정리로 $g(t)-\alpha=g'(c)(t-\alpha)$, $0<g'(c)<\dfrac13$이므로 $p=3$. 이를 반복하면 $0<a_n-\alpha<\left(\dfrac13\right)^{n-1}(1-\alpha)$이므로 $\lim a_n=\alpha$.
stuck: |
  [3.3] 평균값 정리로 얻은 $g'(c)=\dfrac1{c+3}$의 범위($c>0$이면 $<\dfrac13$)와 $\dfrac1p$를 비교해 가장 큰 $p$를 정하는 단계. [3.4] $g(a_{n-1})-\alpha<\dfrac13(a_{n-1}-\alpha)$를 반복 적용해 $M=\left(\dfrac13\right)^{n-1}$을 얻고 극한의 대소 관계(조임)를 쓰는 단계.
