stimuli:
- label: 가
  body: |
    사잇값 정리
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 $f(a)\ne f(b)$이면 $f(a)$와 $f(b)$ 사이의 임의의 실수 $k$에 대하여
    $$f(c)=k$$
    인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: 나
  body: |
    평균값 정리
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능할 때,
    $$\dfrac{f(b)-f(a)}{b-a}=f'(c)$$
    인 $c$가 열린구간 $(a,b)$에 적어도 하나 존재한다.
- label: 다
  body: |
    수열의 극한의 대소 관계
    $\displaystyle\lim_{n\to\infty}a_n=L$, $\displaystyle\lim_{n\to\infty}b_n=M$ ($L$, $M$은 실수)일 때, 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이고 $L=M$이면 $\displaystyle\lim_{n\to\infty}c_n=L$이다.
- label: 라
  body: |
    필요하면 $\ln2=0.693$, $\ln3=1.099$로 계산한다.

stem: |
  다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $f(x)=x-\ln(x+3)+1$에 대하여, 다음은 방정식 $f(x)=0$이 열린구간 $(0,1)$에서 적어도 하나의 실근을 가짐을 보이는 과정이다. ①~④에 알맞은 것을 각각 **보기**에서 골라 쓰시오.
    [상자 안 서술] 함수 $f(x)$는 닫힌구간 $[0,1]$에서 [①]이고 $f(0)=-\ln3+1$ [②], $f(1)=2-\ln4$ [③]이므로 [④]에 의하여 열린구간 $(0,1)$에서 적어도 하나의 실근을 갖는다.
    **보기**: 미분가능, 연속, 사잇값 정리, 평균값 정리, $<0$, $=0$, $>0$
  points: 8   # 소문항 배점 미공개 — 추정(33점을 8·8·8·9로 균등 추정)
  depends_on: []
  answer: {kind: choice, value: '① 연속, ② <0, ③ >0, ④ 사잇값 정리', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.1]
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)$는 닫힌구간 $[0,1]$에서 [연속]이고
        $$f(0)=-\ln3+1=-1.099+1\ \boxed{<0},\qquad f(1)=2-\ln4=2-2\ln2=2-2\times0.693\ \boxed{>0}$$
        이므로 [사잇값 정리]에 의하여 열린구간 $(0,1)$에서 적어도 하나의 실근을 갖는다.
      criteria: [1.B1, 1.B2, 1.B3, 1.B4]
  rubric:
