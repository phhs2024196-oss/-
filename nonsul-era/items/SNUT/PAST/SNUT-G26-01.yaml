subparts:
- id: '1'
  stem: |
    다음 부등식을 푸시오.
    $$\sqrt{\log_3x\times\log_381x+4}+\sqrt{4\log_3x\times\log_3\dfrac x3+1}\ \le\ 4$$
  points: 10   # 소문항 배점 미공개 — 추정(40점을 10점씩 균등 추정)
  depends_on: []
  answer: {kind: set, value: '1/3<=x<=3', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: |
        로그의 성질을 이용하여 주어진 부등식을 정리하면
        $$\sqrt{\log_3x\times\log_381x+4}+\sqrt{4\log_3x\times\log_3\dfrac x3+1}=\sqrt{(\log_3x+2)^2}+\sqrt{(2\log_3x-1)^2}=\lvert\log_3x+2\rvert+\lvert2\log_3x-1\rvert\le4$$
        이다. $\log_3x=t$로 놓으면 $\lvert t+2\rvert+\lvert2t-1\rvert\le4$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (1) $t<-2$일 때, $-(t+2)-(2t-1)=-3t-1\le4$에서 $t\ge-\dfrac53$이므로 만족하지 않는다.
        (2) $-2\le t<\dfrac12$일 때, $(t+2)-(2t-1)=-t+3\le4$에서 $t\ge-1$이므로 $-1\le t<\dfrac12$이다.
        (3) $t\ge\dfrac12$일 때, $(t+2)+(2t-1)=3t+1\le4$에서 $t\le1$이므로 $\dfrac12\le t\le1$이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 (1), (2), (3)에 의해 $-1\le t\le1$이고, 구하고자 하는 해는 $\dfrac13\le x\le3$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 3, evidence: '로그의 성질로 근호 안을 완전제곱식으로 만들어 $\lvert t+2\rvert+\lvert2t-1\rvert\le4$ ($t=\log_3x$)를 얻었다.', steps: [1b-1]}
    - {id: 1.M2, mark_type: M, points: 4, evidence: '$t<-2$, $-2\le t<\dfrac12$, $t\ge\dfrac12$로 나누어 각각 부등식을 풀었다.', depends_on: [1.M1], steps: [1b-2]}
    - {id: 1.A1, mark_type: A, points: 3, evidence: '$-1\le t\le1$에서 $\dfrac13\le x\le3$을 구했다.', depends_on: [1.M2], steps: [1b-3]}
    deductions:
