      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    상수 $a$와 $b$는 $4^a-4^b=240$과 $2^a2^b=64$를 만족시킨다. 점 $\mathrm{P}(a,b)$를 지나는 직선 $y=mx+\dfrac23$가 $x$축과 만나는 점을 A라고 할 때, $\cos(\angle\mathrm{OPA})$의 값을 구하시오. (단, O는 원점)
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: value, value: '7*sqrt(2)/10', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.2]
    steps:
    - id: 2b-1
      content: |
        $4^a=X$, $4^b=Y$로 놓으면 $X-Y=240$, $XY=4096$이다. (보충: $2^a2^b=2^{a+b}=64$에서 $4^a4^b=2^{2(a+b)}=4096$)
        $$Y^2+240Y-4096=(Y+256)(Y-16)=0$$
        이므로 $Y=16$, $X=256$이다. 따라서 $4^a=256$, $4^b=16$이고 $a=4$, $b=2$이므로 $\mathrm{P}(4,2)$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $2=4m+\dfrac23$에서 $m=\dfrac13$이므로 직선의 방정식은 $y=\dfrac13x+\dfrac23$이고 $\mathrm{A}(-2,0)$이다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $\overline{\mathrm{OA}}=2$, $\overline{\mathrm{OP}}=\sqrt{4^2+2^2}=2\sqrt5$, $\overline{\mathrm{AP}}=\sqrt{\{4-(-2)\}^2+(2-0)^2}=2\sqrt{10}$이므로 코사인법칙을 적용하면
        $$\cos(\angle\mathrm{OPA})=\dfrac{\overline{\mathrm{AP}}^2+\overline{\mathrm{OP}}^2-\overline{\mathrm{OA}}^2}{2\times\overline{\mathrm{AP}}\times\overline{\mathrm{OP}}}=\dfrac{40+20-4}{2\times2\sqrt{10}\times2\sqrt5}=\dfrac{7\sqrt2}{10}$$
        이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 4, evidence: '$4^a=X$, $4^b=Y$로 놓고 연립해 $a=4$, $b=2$를 구했다.', steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 2, evidence: '$m=\dfrac13$과 $\mathrm{A}(-2,0)$을 구했다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 4, evidence: '세 변의 길이를 구해 코사인법칙으로 $\dfrac{7\sqrt2}{10}$을 구했다.', depends_on: [2.M2], steps: [2b-3]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    두 수열 $\{a_n\}$과 $\{b_n\}$에 대하여
    $$a_n=\int_{-1}^{1}\left\{2+6x+12x^2+\cdots+n(n+1)x^{n-1}\right\}dx,\qquad b_n=\dfrac{a_{2n}}{n}$$
    일 때, $b_1+b_2+b_3+\cdots+b_{25}$의 값을 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: value, value: '700', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.3]
    steps:
    - id: 3b-1
      content: |
        자연수 $k$에 대하여
        $$\int_{-1}^1x^{2k-1}dx=\left[\dfrac1{2k}x^{2k}\right]_{-1}^1=\dfrac1{2k}\{1^{2k}-(-1)^{2k}\}=0$$
        이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        이므로
        $$a_{2n}=\int_{-1}^1\{2+6x+12x^2+20x^3+\cdots+(2n-1)\times2nx^{2n-2}+2n\times(2n+1)x^{2n-1}\}dx=\int_{-1}^1\{2+12x^2+\cdots+(2n-1)\times2nx^{2n-2}\}dx$$
        $$=\Big[2x+4x^3+\cdots+2nx^{2n-1}\Big]_{-1}^1=(2+4+\cdots+2n)-(-2-4-\cdots-2n)=2n(n+1)$$
        이다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        $b_n=\dfrac{a_{2n}}n=2(n+1)$이므로
        $$b_1+b_2+\cdots+b_{25}=\sum_{n=1}^{25}2(n+1)=2\sum_{n=1}^{25}n+\sum_{n=1}^{25}2=2\times\dfrac{25\times26}2+2\times25=700$$
        이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 3.M1, mark_type: M, points: 3, evidence: '홀수 차수 항의 정적분 $\displaystyle\int_{-1}^1x^{2k-1}dx=0$을 이용했다(또는 항별 적분을 바르게 했다).', steps: [3b-1]}
    - {id: 3.M2, mark_type: M, points: 3, evidence: '$a_{2n}=2n(n+1)$을 구했다.', depends_on: [3.M1], steps: [3b-2]}
    - {id: 3.A1, mark_type: A, points: 4, evidence: '$b_n=2(n+1)$로 합을 계산해 $700$을 구했다.', depends_on: [3.M2], steps: [3b-3]}
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '4'
  stem: |
    등번호가 각각 $1,2,3,\cdots,12$인 열두 명의 선수로 이루어진 한 대학팀이 팀당 다섯 명씩 겨루는 스포츠 대회에 참가하고 있다. 이 팀에서 경기마다 다섯 명이 선발되어 모두 경기에 출전한다. 같은 선수가 두 경기 연속으로 출전할 수는 없으며, 첫 번째 경기와 두 번째 경기에 출전한 선수들의 상황은 다음과 같다.
    - (가) 첫 번째 경기: 등번호가 각각 $4,5,6,7,8$인 선수가 출전했다.
    - (나) 두 번째 경기: 등번호가 각각 $1,2,3$인 선수를 포함하여 출전했다.
    세 번째 경기에 등번호가 4인 선수를 선발하지 않을 때, 세 번째 경기에 출전하는 다섯 명의 선수를 선발하는 경우의 수를 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: []
