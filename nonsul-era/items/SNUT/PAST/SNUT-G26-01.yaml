intent: |
  대학에서 이공계 전공과목을 수학하기 위해서는 주어진 문제를 이해하고 수학적인 표현법을 활용하여 수식화할 수 있어야 하며, 기본 개념과 원리를 통해 답을 도출하는 수학적 능력이 필요하다. 본 문항에서는 고등학교 수학 교과과정 중 지수, 로그, 일차부등식, 삼각함수, 등차수열, 다항식의 정적분, 경우의 수의 정의와 핵심 개념을 충분히 이해하고, 이를 다양한 문제상황에 적용할 수 있는지 확인하고자 하였다. [1.1] 로그법칙으로 식을 간단하게 정리하고 절댓값을 포함한 일차부등식의 해를 구하는지, [1.2] 지수법칙으로 직선의 방정식을 결정하고 꼭짓점의 좌표를 알고 있는 삼각형의 내각의 코사인값을 구하는지, [1.3] 다항식의 정적분과 등차수열의 $n$항까지의 합을 구하는지, [1.4] 합의 법칙과 곱의 법칙으로 주어진 상황을 만족하는 경우의 수를 구하는지 평가한다. (출제배경)
key_idea: |
  [1.1] $\log_3x=t$로 놓으면 근호 안이 완전제곱이므로 $\lvert t+2\rvert+\lvert2t-1\rvert\le4$. [1.2] $4^a=X$, $4^b=Y$로 보고 연립해 $a=4$, $b=2$, 코사인법칙. [1.3] 홀수 차수는 $[-1,1]$에서 적분이 0이라 $a_{2n}=2n(n+1)$. [1.4] 연속 출전 금지 조건으로 세 번째 경기에 나갈 수 있는 선수를 추려 합의 법칙과 곱의 법칙으로 센다.
stuck: |
  [1.1] 근호 안을 $t$에 대한 완전제곱식으로 보는 단계. [1.2] $4^a$, $4^b$를 새 변수로 놓아 이차방정식으로 푸는 단계. [1.3] 대칭구간에서 홀함수의 적분이 0임을 이용해 $a_{2n}$을 정리하는 단계. [1.4] 출전 가능한 선수 집합을 조건 (가), (나), 연속 출전 금지로 정하는 단계.
