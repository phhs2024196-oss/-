  answer: {kind: value, value: '28', equivalents: [], tolerance: null}
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.4]
    steps:
    - id: 4b-1
      content: |
