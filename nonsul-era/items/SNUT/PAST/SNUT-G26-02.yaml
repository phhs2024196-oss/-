stimuli:
- label: 가
  body: |
    실수 $k$에 대하여 $\sin\alpha=\sin\beta=k$와 $4\sin(\alpha+2\beta)=3\cos(2\alpha+\beta)$가 성립한다. (단, $0<\alpha<\beta<\pi$)
- label: 나
  body: |
    아래 그림과 같이, 기울기가 $-\dfrac34$인 직선 $l$은 $x$축 위의 점 A와 $y$축 위의 점 B를 지나며 곡선 $y=\dfrac38x^2+5k$와 점 P에서 접한다.
- label: 다
  body: |
    삼각형 OAB에 내접하고 반지름의 길이가 $r$인 원을 $x$축의 방향으로 $a$만큼, $y$축의 방향으로 $b$만큼 평행이동한 도형은 $x$축과 직선 $l$에 동시에 접한다. (단, $0<a<5$, $b<0$)
    [그림] 좌표평면에 직선 $l$이 오른쪽 아래로 향하며 $x$축과 점 A, $y$축과 점 B에서 만난다. 곡선 $y=\dfrac38x^2+5k$는 $y$축 위쪽에서 아래로 볼록하며 $y$축 부근에서 직선 $l$과 점 P에서 접한다(P는 $y$축의 왼쪽, B보다 위). 삼각형 OAB 안에 반지름 $r$인 내접원이 그려져 있다. 원점 O.

stem: |
  다음 제시문을 읽고 물음에 답하시오.

