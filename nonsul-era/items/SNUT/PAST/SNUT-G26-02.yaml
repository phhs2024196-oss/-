      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    상수 $a$와 $b$의 값을 각각 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: ['1', '2']
  answer: {kind: value, value: 'a=7/3; b=-7/4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.3]
    steps:
    - id: 3b-1
      content: |
        직각삼각형 OAB에 내접하는 원의 중심은 $\left(\dfrac78,\dfrac78\right)$이다. $b<0$이고 평행이동한 원은 $x$축에 접하므로 중심은 $\left(c,-\dfrac78\right)$이라 할 수 있고 $b=-2r=-\dfrac74$이다.
      criteria: [3.M1, 3.A1]
    - id: 3b-2
      content: |
        또 평행이동한 원은 직선 $l:\ 6x+8y-21=0$에 접하므로 원의 중심 $\left(c,-\dfrac78\right)$에서 직선 $l$까지의 거리는 $r$과 같아야 한다. 따라서
        $$\dfrac{\left\lvert6c-8\times\dfrac78-21\right\rvert}{\sqrt{6^2+8^2}}=\dfrac{\lvert6c-28\rvert}{10}=\dfrac78$$
        이므로 $c=\dfrac{49}8,\ \dfrac{77}{24}$이다. 이때 $a=c-r=\dfrac{21}4,\ \dfrac73$이므로 $0<a<5$를 만족하는 $a=\dfrac73$이다.
      criteria: [3.M2, 3.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
