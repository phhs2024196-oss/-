    - {id: 1.M2, mark_type: M, points: 3, evidence: '주어진 식에서 $\tan\alpha=\dfrac34$를 얻었다.', depends_on: [1.M1], steps: [1b-2]}
    - {id: 1.A1, mark_type: A, points: 3, evidence: '$k=\sin\alpha=\dfrac35$를 구했다.', depends_on: [1.M2], steps: [1b-2]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
