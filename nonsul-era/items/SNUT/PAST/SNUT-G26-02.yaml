intent: |
  자연 현상이나 여러 공학 분야에서 다루는 모델들은 도형의 방정식과 이를 기술하는 수학적인 도구를 활용하여 기술하고 해석하는 일이 많다. 이공계를 전공하는 학생들에게 원, 직선, 이차함수와 삼각함수 등의 수학적 지식을 바르게 이해하고 주어진 문제를 해석하는 능력은 전공을 깊이 이해하려면 반드시 필요하다. 본 문항에서는 이차함수, 직선 및 내접하는 원으로 이루어진 상황을 삼각함수의 관계식, 내접하는 원의 성질과 접선의 방정식, 평행이동 등을 이용해서 문제를 해결할 수 있는지 평가한다. [2.1] 삼각함수의 성질로 주어진 값을 구하는지, [2.2] 앞 문항의 값을 활용하여 접선의 방정식과 내접하는 원의 성질을 활용하는지, [2.3] 평행이동의 특성으로 이동한 원의 중심의 좌표와 이동한 거리를 구하는지 평가한다. (출제배경)
key_idea: |
  $\alpha+\beta=\pi$로 $\sin(\alpha+2\beta)=-\sin\alpha$, $\cos(2\alpha+\beta)=-\cos\alpha$이므로 $\tan\alpha=\dfrac34$, $k=\dfrac35$. 접선의 기울기 $-\dfrac34$로 접점 $\mathrm{P}\left(-1,\dfrac{27}8\right)$, 직선 $l:y=-\dfrac34x+\dfrac{21}8$. 직각삼각형 OAB의 내접원 반지름 $r=\dfrac{a+b-c}2=\dfrac78$. 평행이동한 원이 $x$축에 접하므로 $b=-2r$이고 직선 $l$과의 거리 조건으로 $a$를 정한다.
stuck: |
  [2.1] $\alpha+\beta=\pi$를 이끌어 $\sin(\alpha+2\beta)$, $\cos(2\alpha+\beta)$를 $\alpha$로 줄이는 단계. [2.3] 이동한 원이 $x$축과 직선 $l$에 동시에 접하는 조건(중심의 $y$좌표 $-r$, 직선까지의 거리 $r$)에서 두 후보를 얻고 $0<a<5$로 걸러내는 단계.
idea_tags: [IDEA-TRIG-SUPPLEMENT-TAN, IDEA-RIGHT-TRIANGLE-INRADIUS, IDEA-TRANSLATED-CIRCLE-TANGENT-TWO-LINES]
tags: [삼각함수, 접선의 방정식, 직각삼각형의 내접원, 점과 직선 사이의 거리, 평행이동, '출제근거: 삼각함수의 뜻과 그래프(수학Ⅰ, 지학사 2020 p.68~91)', '출제근거: 접선의 방정식(수학Ⅱ, 비상교육 2020 p.71~73)', '출제근거: 평행이동(수학, 천재교육 2021 p.155~158)']
elements:
  materials:
  - '$\sin\alpha=\sin\beta=k$ ($0<\alpha<\beta<\pi$), $4\sin(\alpha+2\beta)=3\cos(2\alpha+\beta)$'
  - '곡선 $y=\dfrac38x^2+5k$, 기울기 $-\dfrac34$인 접선 $l$, 접점 P, $l$과 축의 교점 A, B'
  - '삼각형 OAB의 내접원(반지름 $r$)을 $x$축으로 $a$, $y$축으로 $b$만큼 평행이동한 원'
  concepts: [삼각함수의 성질(π−θ, π+θ), 이차함수의 접선, 직선의 방정식, 직각삼각형의 내접원, 점과 직선 사이의 거리, 평행이동]
  tools:
  - '$\alpha+\beta=\pi$ → $\sin(\pi+\beta)=-\sin\beta$, $\cos(\pi+\alpha)=-\cos\alpha$'
  - '$y''=\dfrac34x$ = 접선의 기울기 $-\dfrac34$ → 접점의 $x$좌표'
  - '직각삼각형 내접원 반지름 $r=\dfrac{(\text{밑변}+\text{높이}-\text{빗변})}2$, $\overline{\mathrm{OA}}:\overline{\mathrm{OB}}:\overline{\mathrm{AB}}=4:3:5$'
  - '평행이동한 원의 중심 $\left(\dfrac78+a,\dfrac78+b\right)$이 $x$축에 접: $\lvert y\rvert=r$, 직선까지 거리 $=r$'
  conditions:
  - '$\sin\alpha=\sin\beta$, $\alpha<\beta$ → $\alpha+\beta=\pi$, $\alpha$는 예각 → $k>0$'
  - '$0<a<5$, $b<0$ → 두 해 중 하나 선택'
  - '[2.2], [2.3]은 [2.1]에서 구한 $k$ 사용'
  stimuli_used: [가, 나, 다]
  subpart_links: '[2.1]의 $k$ → [2.2]의 곡선 $y=\dfrac38x^2+3$, 접점 P, 직선 $l$, 내접원 반지름 $r$ → [2.3]의 평행이동 조건'

