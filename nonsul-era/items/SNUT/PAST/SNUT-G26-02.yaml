  misconceptions: []
- id: '2'
  stem: |
    ※ 문항 [2.2]와 [2.3]은 [2.1]에서 구한 $k$를 이용하시오.
    반지름의 길이 $r$의 값을 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: ['1']
  answer: {kind: value, value: '7/8', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.2]
    steps:
    - id: 2b-1
      content: |
        $y=\dfrac38x^2+3$에서 $y'=\dfrac34x$이고, 점 P의 $x$좌표를 $t$라 하면 직선 $l$의 기울기가 $-\dfrac34$이므로 $\dfrac34t=-\dfrac34$, 즉 $t=-1$이다. 직선 $l$은 점 $\mathrm{P}\left(-1,\dfrac{27}8\right)$을 지나므로 직선 $l$의 방정식은 $y=-\dfrac34x+\dfrac{21}8$이고 $\mathrm{A}\left(\dfrac72,0\right)$, $\mathrm{B}\left(0,\dfrac{21}8\right)$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        직각삼각형 OAB의 각 변의 길이의 비는 $\overline{\mathrm{OA}}:\overline{\mathrm{OB}}:\overline{\mathrm{AB}}=4:3:5$이므로 $\overline{\mathrm{AB}}=\dfrac{35}8$이다. 따라서, 직각삼각형 OAB에 내접하는 원의 반지름의 길이는
        $$r=\dfrac{\dfrac72+\dfrac{21}8-\dfrac{35}8}2=\dfrac78$$
        이다.
      criteria: [2.M2, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 4, evidence: '접선의 기울기 조건으로 $t=-1$, $\mathrm{P}\left(-1,\dfrac{27}8\right)$, $l:y=-\dfrac34x+\dfrac{21}8$, $\mathrm{A}\left(\dfrac72,0\right)$, $\mathrm{B}\left(0,\dfrac{21}8\right)$를 구했다.', depends_on: [1.A1], steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 3, evidence: '직각삼각형 OAB의 세 변 $\dfrac72$, $\dfrac{21}8$, $\dfrac{35}8$을 구하고 내접원 반지름 공식을 세웠다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 3, evidence: '$r=\dfrac78$을 구했다.', depends_on: [2.M2], steps: [2b-2]}
    deductions:
