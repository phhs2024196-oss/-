- id: '1'
  stem: |
    제시문 (가)의 실수 $k$의 값을 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정(30점을 10점씩 균등 추정)
  depends_on: []
  answer: {kind: value, value: '3/5', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.1]
    steps:
    - id: 1b-1
      content: |
        $\sin\alpha=\sin\beta$이고 $0<\alpha<\beta<\pi$이므로 $\alpha+\beta=\pi$이다. $\sin(\alpha+2\beta)=\sin(\pi+\beta)=-\sin\beta=-\sin\alpha$, $\cos(2\alpha+\beta)=\cos(\pi+\alpha)=-\cos\alpha$이므로
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $4\sin(\alpha+2\beta)=3\cos(2\alpha+\beta)$에서 $\tan\alpha=\dfrac34$이다. 따라서 $k=\sin\alpha=\dfrac35$이다.
      criteria: [1.M2, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
