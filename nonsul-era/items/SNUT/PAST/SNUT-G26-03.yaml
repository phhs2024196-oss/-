- id: '3'
  stem: |
    문항 [3.2]에서 구한 $S(t)$에 대하여 $\displaystyle\lim_{t\to\infty}\dfrac{S(t)}{t^k}$가 존재하게 하는 가장 작은 자연수 $k$의 값과 이때의 극한값을 각각 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: ['2']
  answer: {kind: value, value: 'k=4; 57/4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.3]
    steps:
    - id: 3b-1
      content: |
        $S(t)=\dfrac{57}4t^4$이므로
        $$\lim_{t\to\infty}\dfrac{S(t)}{t^k}=\lim_{t\to\infty}\dfrac{57t^4}{4t^k}$$
        이 존재하게 하는 가장 작은 자연수 $k$의 값은 4이고, 이때의 극한값은 $\displaystyle\lim_{t\to\infty}\dfrac{57t^4}{4t^4}=\dfrac{57}4$이다.
      criteria: [3.M1, 3.A1]
