intent: |
  제시문에 설명한 성질들을 충분히 이해하고 활용하여 필요한 결과를 수학적으로 도출할 수 있는 능력은 이공계 대학 교육을 받는 학생에게 필수적이다. 이 문제를 풀기 위한 개념은 이차방정식의 근과 계수의 관계, 선분의 내분점, 곡선으로 둘러싸인 영역의 넓이, 함수의 극한 등 고등학생이 알아야 할 기본적인 내용이다. 본 문항에서는 주어진 조건을 만족시키는 함수를 구하고 함수의 그래프를 이해하여 곡선으로 둘러싸인 영역의 넓이를 구할 수 있는지, 또한 극한을 구할 수 있는지 평가한다. [3.1] 이차방정식의 근과 계수의 관계, 선분의 내분점으로 조건을 만족시키는 함수를 구하는지, [3.2] 그래프를 이해하고 정적분으로 곡선과 $x$축 사이의 영역의 넓이를 구하는지, [3.3] 분모와 분자의 차수를 비교하여 극한이 존재하기 위한 조건을 구하고 극한을 계산하는지 평가한다. (출제배경)
key_idea: |
  $f'(x)=0$의 두 근이 $\alpha,\beta$이므로 근과 계수의 관계, 내분점 조건에서 $\beta=-2\alpha$, $\alpha=-t$이므로 $a=-\dfrac32t$, $b=-6t^2$. $f(x)=x^3-\dfrac32tx^2-6t^2x$는 $[-t,0]$에서 $f\ge0$, $[0,2t]$에서 $f\le0$이므로 $S(t)=\displaystyle\int_{-t}^0f\,dx-\int_0^{2t}f\,dx=\dfrac{57}4t^4$. $\lim\dfrac{S(t)}{t^k}$가 존재하는 가장 작은 $k=4$, 극한값 $\dfrac{57}4$.
stuck: |
  [3.1] 선분 AB를 $1:2$로 내분하는 점의 $x$좌표가 0이라는 조건에서 $\beta=-2\alpha$를, $y$좌표 조건에서 $\alpha=-t$를 이끌어 내는 단계. [3.2] 극댓값·극솟값 위치로 $f$의 부호를 구간별로 판단해 절댓값 없이 넓이를 세우는 단계.
