stimuli:
- label: 가   # 원문에는 라벨이 없는 단일 상자 안의 조건 (가), (나)
  body: |
    실수 $a,b$에 대하여 함수 $f(x)=x^3+ax^2+bx$가 다음 두 조건을 만족시킨다.
    (가) 함수 $f(x)$는 $x=\alpha$에서 극댓값을 갖고, $x=\beta$에서 극솟값을 갖는다.
    (나) 두 점 $\mathrm{A}(\alpha,f(\alpha))$, $\mathrm{B}(\beta,f(\beta))$를 이은 선분 AB를 $1:2$로 내분하는 점은 $\mathrm{P}(0,-t^3)$이다. (단, $t>0$)

stem: |
  다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $a,b$를 $t$에 관한 식으로 각각 나타내시오.
  points: 10   # 소문항 배점 미공개 — 추정(30점을 10점씩 균등 추정)
  depends_on: []
  answer: {kind: expression, value: 'a=-3*t/2; b=-6*t**2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [3.1]
    steps:
    - id: 1b-1
      content: |
        $f'(x)=3x^2+2ax+b=0$의 두 근이 $\alpha,\beta$이므로 이차방정식의 근과 계수의 관계에 의하여 $\alpha+\beta=-\dfrac{2a}3$, $\alpha\beta=\dfrac b3$이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        두 점 $\mathrm{A}(\alpha,f(\alpha))$, $\mathrm{B}(\beta,f(\beta))$를 이은 선분 AB를 $1:2$로 내분하는 점의 좌표가 $(0,-t^3)$이므로
        $$\dfrac{\beta+2\alpha}3=0,\qquad\dfrac{f(\beta)+2f(\alpha)}3=-t^3$$
        이다. 따라서 $\beta=-2\alpha$이고
        $$a=-\dfrac32(\alpha+\beta)=\dfrac32\alpha,\qquad b=3\alpha\beta=-6\alpha^2$$
        이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        또
        $$-t^3=\dfrac{f(\beta)+2f(\alpha)}3=\dfrac13\{f(-2\alpha)+2f(\alpha)\}=-2\alpha^3+2a\alpha^2=\alpha^3$$
        이므로 $\alpha=-t$이고
        $$a=\dfrac32\alpha=-\dfrac32t,\qquad b=-6\alpha^2=-6t^2$$
        이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 2, evidence: '$f''(x)=0$의 두 근 $\alpha,\beta$에 대해 근과 계수의 관계 $\alpha+\beta=-\dfrac{2a}3$, $\alpha\beta=\dfrac b3$을 적었다.', steps: [1b-1]}
    - {id: 1.M2, mark_type: M, points: 4, evidence: '내분점의 좌표 조건에서 $\beta=-2\alpha$를 얻고 $a=\dfrac32\alpha$, $b=-6\alpha^2$으로 나타냈다.', depends_on: [1.M1], steps: [1b-2]}
    - {id: 1.A1, mark_type: A, points: 4, evidence: '$y$좌표 조건에서 $\alpha=-t$를 얻어 $a=-\dfrac32t$, $b=-6t^2$을 구했다.', depends_on: [1.M2], steps: [1b-3]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    문항 [3.1]에서 구한 $a,b$에 대하여 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=\alpha$, $x=\beta$로 둘러싸인 도형의 넓이 $S(t)$를 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: ['1']
  answer: {kind: expression, value: '57*t**4/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.2]
    steps:
    - id: 2b-1
      content: |
        $f(x)=x^3-\dfrac32tx^2-6t^2x$이므로 곡선 $y=f(x)$는 원점을 지난다. 또 $x=\alpha=-t$에서 극댓값, $x=\beta=2t$에서 극솟값을 가지므로 닫힌구간 $[-t,0]$에서 $f(x)\ge0$이고 닫힌구간 $[0,2t]$에서 $f(x)\le0$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서
        $$S(t)=\int_{-t}^0f(x)\,dx+\int_0^{2t}\{-f(x)\}dx=\Big[\dfrac14x^4-\dfrac12tx^3-3t^2x^2\Big]_{-t}^0-\Big[\dfrac14x^4-\dfrac12tx^3-3t^2x^2\Big]_0^{2t}=\dfrac{57}4t^4$$
        이다.
      criteria: [2.M2, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 4, evidence: '$f(x)=x^3-\dfrac32tx^2-6t^2x$의 극값 위치로 $[-t,0]$에서 $f\ge0$, $[0,2t]$에서 $f\le0$임을 밝혔다.', depends_on: [1.A1], steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 3, evidence: '$S(t)=\displaystyle\int_{-t}^0f\,dx+\int_0^{2t}(-f)\,dx$로 세우고 부정적분을 구했다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 3, evidence: '$S(t)=\dfrac{57}4t^4$을 구했다.', depends_on: [2.M2], steps: [2b-2]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
