  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [1.3]
    steps:
    - id: 3b-1
      content: 새우버거를 $k$개 구매한 경우 소고기버거와 치킨버거를 구매하는 경우의 수는 ${}_2\mathrm H_{20-k}={}_{21-k}\mathrm C_1=21-k$ (단, $0\le k\le17$)이다.
      criteria: [3.R1]
    - id: 3b-2
      content: 따라서 햄버거를 주문하는 경우의 수는 $\displaystyle\sum_{k=0}^{17}(21-k)=\sum_{k=4}^{21}k=\dfrac{21\times22}2-(1+2+3)=225$가지다.
      criteria: [3.M1, 3.A1]
