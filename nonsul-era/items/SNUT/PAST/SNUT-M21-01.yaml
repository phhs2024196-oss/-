stem: 다음 물음에 답하시오.
# 소문항 배점 미공개 — 추정 (문제 1은 34%이며 소문항 11/11/12점으로 가름)
subparts:
- id: '1'
  stem: |
    아래 그림과 같이 $0\le x\le\pi$에 대하여 $y=\cos x,\ y=\cos2x,\ y=\cos^2x$의 그래프를 한 좌표평면에 그릴 때, 세 곡선 모두에 의해 둘러싸인 도형은 두 개이다. 도형 A의 넓이를 $a$, 도형 B의 넓이를 $b$라 할 때 $a-b$의 값을 구하시오.
    [그림] $0\le x\le\pi$에서 세 곡선이 모두 $(0,1)$에서 출발한다. 도형 A는 $x$축 아래쪽에서 $x=\dfrac\pi2$ 부근에 $y=\cos2x$의 최저점(−1)을 포함하는 짙은 음영 영역이고, 도형 B는 $x$축 위쪽 $x=\dfrac\pi2$와 $x=\pi$ 사이에서 빗금 친 영역이다. $x=\pi$ 근처에서 두 곡선이 $y=1$에서 만나고 $y=\cos x$는 $-1$로 내려간다. (원 그림 이미지 대조)
  points: 11
  depends_on: []
  answer:
    kind: value
    value: (3*sqrt(3)-4)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.1]
    steps:
    - id: 1b-1
      content: 세 곡선의 교점은 다음 세 삼각방정식을 풀어 구할 수 있다. $\cos x=\cos^2x\iff x=0,\dfrac\pi2$, $\cos x=\cos2x\iff x=0,\dfrac23\pi$, $\cos2x=\cos^2x\iff x=0,\pi$. 따라서 교점은 $x=0,\dfrac\pi2,\dfrac23\pi,\pi$일 때 생긴다.
      criteria: [1.R1]
    - id: 1b-2
      content: 도형 A, B의 넓이는 각각 $a=\displaystyle\int_0^{\frac\pi2}(\cos^2x-\cos2x)dx+\int_{\frac\pi2}^{\frac{2\pi}3}(\cos x-\cos2x)dx=\dfrac\pi4+\dfrac{3\sqrt3}4-1$, $b=\displaystyle\int_{\frac\pi2}^{\frac{2\pi}3}(\cos^2x-\cos x)dx+\int_{\frac{2\pi}3}^\pi(\cos^2x-\cos2x)dx=\dfrac\pi4-\dfrac{3\sqrt3}4+1$이다.
      criteria: [1.M1, 1.A1]
    - id: 1b-3
      content: 이므로 $a-b=\dfrac{3\sqrt3-4}2$이다.
      criteria: [1.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: 세 삼각방정식으로 교점 $x=0,\dfrac\pi2,\dfrac{2\pi}3,\pi$를 구했다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 구간별로 위·아래 곡선을 판정하여 $a,b$를 정적분으로 나타냈다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $a=\dfrac\pi4+\dfrac{3\sqrt3}4-1$, $b=\dfrac\pi4-\dfrac{3\sqrt3}4+1$에서 $a-b=\dfrac{3\sqrt3-4}2$를 구했다.
      depends_on:
      - 1.M1
      steps: [1b-2, 1b-3]
    deductions:
