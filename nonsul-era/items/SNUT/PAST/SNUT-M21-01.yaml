- id: '2'
  stem: 극한 $\displaystyle\lim_{n\to\infty}\dfrac{\ln\{(2n)!\}-n\ln n-\ln(n!)}n$의 값을 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: 2*log(2)-1
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2~3 [1.2]
    steps:
    - id: 2b-1
      content: 로그의 성질을 이용하여 간단히 하면 $\ln\{(2n)!\}-n\ln n-\ln(n!)=\ln2n+\ln(2n-1)+\ln(2n-2)+\cdots+\ln(n+1)-n\ln n=(\ln2n-\ln n)+\{\ln(2n-1)-\ln n\}+\cdots+\{\ln(n+1)-\ln n\}=\displaystyle\sum_{k=1}^n\ln\left(1+\dfrac kn\right)$이다.
      criteria: [2.R1]
    - id: 2b-2
      content: 따라서 $\displaystyle\lim_{n\to\infty}\dfrac{\ln\{(2n)!\}-n\ln n-\ln(n!)}n=\lim_{n\to\infty}\dfrac1n\sum_{k=1}^n\ln\left(1+\dfrac kn\right)=\int_1^2\ln x\,dx$이고, 부분적분 하면 $\displaystyle\int_1^2\ln x\,dx=\left[x\ln x-x\right]_1^2=2\ln2-1$이다.
      criteria: [2.M1, 2.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: $\ln\{(2n)!\}-n\ln n-\ln(n!)=\displaystyle\sum_{k=1}^n\ln\left(1+\dfrac kn\right)$로 정리했다.
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: 정적분과 급수의 관계로 $\displaystyle\int_1^2\ln x\,dx$로 나타냈다.
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 부분적분으로 $2\ln2-1$을 구했다.
      depends_on:
      - 2.M1
      steps: [2b-2]
