- id: '3'
  stem: 소고기버거, 치킨버거, 새우버거만을 판매하는 햄버거가게가 있다. 소고기버거와 치킨버거는 원하는 만큼 주문할 수 있지만, 새우버거는 17개까지만 주문이 가능하다고 한다. 이 햄버거가게에서 20개의 햄버거를 구매하는 경우의 수를 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '225'
