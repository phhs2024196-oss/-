key_idea: 1.1 세 방정식으로 교점 $x=0,\dfrac\pi2,\dfrac{2\pi}3,\pi$를 구하고 구간별로 위·아래 곡선을 판정해 $a,b$를 적분한다. 1.2 $\ln\{(2n)!\}-n\ln n-\ln(n!)=\displaystyle\sum_{k=1}^n\ln\left(1+\dfrac kn\right)$로 바꿔 구분구적법으로 $\displaystyle\int_1^2\ln x\,dx$. 1.3 새우버거 수 $k$로 분류해 $\displaystyle\sum_{k=0}^{17}(21-k)$.
