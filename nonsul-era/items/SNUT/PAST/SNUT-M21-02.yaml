- id: '3'
  stem: 원 $\mathrm C_1$ 위의 점 $\mathrm R_1$과 $\mathrm R_2$에서의 접선이 원 $\mathrm C_2$와 각각 한 점에서 만난다고 할 때, $\mathrm R_1$과 $\mathrm R_2$의 $x$좌표의 합을 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: -24/25
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [2.3]
    steps:
    - id: 3b-1
      content: 원 $\mathrm C_1$ 위의 한 점 $(a,b)$에서 접선의 방정식은 $ax+by=9$이다. 이 접선이 원 $\mathrm C_2$와 한 점에서 만나므로, 이 직선과 원 $\mathrm C_2$의 중심 P 사이의 거리는 4이다. $\dfrac{\lvert4a+3b-9\rvert}{\sqrt{a^2+b^2}}=4$
      criteria: [3.R1]
    - id: 3b-2
      content: 점 $(a,b)$가 원 $\mathrm C_1$ 위에 있으므로 $a^2+b^2=9$이다. 따라서 점 $\mathrm R_1$과 $\mathrm R_2$의 좌표를 찾기 위해서는 연립방정식 $\lvert4a+3b-9\rvert=12,\ a^2+b^2=9$를 만족하는 $a$와 $b$를 찾으면 된다.
      criteria: [3.R1]
    - id: 3b-3
      content: 먼저 $4a+3b-9=12$인 경우를 살펴보면 $b=7-\dfrac43a$이고 이를 $a^2+b^2=9$에 대입하면 $\dfrac{25}9a^2-\dfrac{56}3a+40=0$이므로 실근이 없다.
      criteria: [3.M1]
    - id: 3b-4
      content: 이제 $4a+3b-9=-12$인 경우를 살펴보면, $b=-1-\dfrac43a$이다. 이를 다시 $a^2+b^2=9$에 대입하면 $\dfrac{25}9a^2+\dfrac83a-8=0$을 얻는다. 이 방정식은 실근을 두 개 가지고, 근과 계수와의 관계로부터 점 $\mathrm R_1$과 점 $\mathrm R_2$의 $x$좌표의 합은 $-\dfrac{24}{25}$이다.
      criteria: [3.M1, 3.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: 접선 $ax+by=9$와 중심 P 사이의 거리 4로 $\lvert4a+3b-9\rvert=12$, $a^2+b^2=9$를 세웠다.
      steps: [3b-1, 3b-2]
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: 절댓값을 경우로 나누어 $+12$의 경우 실근이 없음을, $-12$의 경우 $\dfrac{25}9a^2+\dfrac83a-8=0$을 구했다.
      steps: [3b-3, 3b-4]
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: 근과 계수의 관계로 $x$좌표의 합 $-\dfrac{24}{25}$를 구했다.
      depends_on:
      - 3.M1
      steps: [3b-4]
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
