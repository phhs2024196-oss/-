subparts:
- id: '1'
  stem: $\angle\mathrm{OQA}=\alpha$라고 할 때, $\sin\alpha$의 값을 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: sqrt(10)/10
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [2.1]
    steps:
    - id: 1b-1
      content: '원 $\mathrm C_2$의 방정식은 $(x-4)^2+(y-3)^2=4^2$이므로 중심이 $(4,3)$이고 반지름이 4인 원이다. 원 $\mathrm C_1$은 중심이 원점 O이고 반지름이 3인 원이다. [그림] 해설지 그림: 두 원 $\mathrm C_1,\mathrm C_2$와 점 O, P, A, Q(A는 두 원의 교점, P는 $\mathrm C_2$의 중심, Q는 직선 OP 위 $\mathrm C_2$의 점으로 O에서 가장 먼 점)를 점선으로 연결한 그림.'
      criteria: [1.R1]
    - id: 1b-2
      content: 원 $\mathrm C_1$의 반지름이 3이므로 $\overline{\mathrm{OA}}=3$이고, 원 $\mathrm C_2$의 반지름이 4이므로 $\overline{\mathrm{AP}}=4$이다. 두 점 사이의 거리로부터 $\overline{\mathrm{OP}}=\sqrt{3^2+4^2}=5$이다. 따라서 피타고라스의 정리에 의해 $\triangle\mathrm{OAP}$는 직각삼각형이다. 원주각과 중심각 사이의 관계로부터 $\angle\mathrm{APO}=2\angle\mathrm{AQO}=2\alpha$이다. 따라서 $\cos2\alpha=\dfrac45$이다.
      criteria: [1.R1, 1.M1]
    - id: 1b-3
      content: 삼각함수의 덧셈공식으로부터 $\cos(\alpha+\alpha)=\cos^2\alpha-\sin^2\alpha=1-2\sin^2\alpha$이므로 $\sin\alpha=\dfrac{\sqrt{10}}{10}$이다. ($\alpha<\pi$이기 때문에 $\sin\alpha$는 양수이다.)
      criteria: [1.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: 두 원의 중심·반지름을 읽고 $\overline{\mathrm{OA}}=3,\overline{\mathrm{AP}}=4,\overline{\mathrm{OP}}=5$를 구했다.
      steps: [1b-1, 1b-2]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 원주각과 중심각의 관계로 $\angle\mathrm{APO}=2\alpha$이고 $\cos2\alpha=\dfrac45$임을 보였다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 덧셈정리(배각)로 $\sin\alpha=\dfrac{\sqrt{10}}{10}$을 구했다.
      depends_on:
      - 1.M1
      steps: [1b-3]
