intent: 평면기하 문제를 좌표평면을 도입하여 해석적인 방법(미분과 적분 등)과 대수적인 방법(도형의 방정식 등)으로 해결하는 능력을 본다. 직선과 원 같은 기본적인 도형의 방정식을 이해하고 이를 삼각함수와 도형의 방정식, 미분 등을 활용하여 해석하고 문제를 해결할 수 있는지 평가한다. 2.1은 문제의 상황을 이해하고 삼각함수의 성질을 이용, 2.2는 평면기하와 삼각함수로 삼각형의 6요소를 구하는 방법, 2.3은 원과 직선 사이의 거리 관계와 기본적인 대수 방정식을 해결하는 능력을 평가한다.
key_idea: $\mathrm C_2$의 중심 $\mathrm P(4,3)$, 반지름 4. $\triangle\mathrm{OAP}$는 $3,4,5$ 직각삼각형이고 $\angle\mathrm{APO}=2\angle\mathrm{AQO}$(원주각과 중심각)이므로 $\cos2\alpha=\dfrac45$로 $\sin\alpha$를 구한다. 접선 $ax+by=9$와 $\mathrm C_2$의 중심 사이의 거리 4로 $a$에 대한 이차방정식을 세운다.
stuck: 2.1 $\mathrm C_2$의 중심·반지름을 읽고 $\angle\mathrm{APO}=2\alpha$(원주각·중심각)로 연결하는 단계, 2.2 $\angle\mathrm{OAQ}=\dfrac\pi2+\alpha$를 알아보는 단계, 2.3 접선의 방정식 $ax+by=9$와 점과 직선 사이의 거리 조건에서 절댓값을 경우 나누기
