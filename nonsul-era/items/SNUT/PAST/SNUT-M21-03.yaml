stimuli:
- label: 가
  body: |
    원점에서 출발하여 다음의 규칙에 따라 좌표평면 위를 움직이는 점이 있다.
    (1) 첫 단계에서 출발점을 $\mathrm P_0(0,0)$이라 하고, 도착점을 $\mathrm P_1$이라 할 때, $n$번째 단계에서 $\mathrm P_{n-1}$에서 출발하여 $\mathrm P_n$까지 움직인다.
    (2) $n$이 짝수일 때 $\overline{\mathrm P_{n-1}\mathrm P_n}=\dfrac34\overline{\mathrm P_{n-2}\mathrm P_{n-1}}$, $n$이 홀수일 때 $\overline{\mathrm P_{n-1}\mathrm P_n}=\dfrac23\overline{\mathrm P_{n-2}\mathrm P_{n-1}}$이다.
    (3) $\mathrm P_0$에서 $\mathrm P_1$까지 $x$축의 양의 방향으로 1만큼 이동하고, $\mathrm P_1$에서 $\mathrm P_2$까지 $y$축과 평행한 양의 방향으로 이동한다. $\mathrm P_2$에서 $\mathrm P_3$까지 $x$축과 평행한 음의 방향으로 이동한다. $\mathrm P_3$에서 $\mathrm P_4$까지 $y$축과 평행한 음의 방향으로 이동한다.
    (4) (3)과 같이 $x$축과 평행한 양의 방향, $y$축과 평행한 양의 방향, $x$축과 평행한 음의 방향, $y$축과 평행한 음의 방향을 반복하여 움직인다.
- label: 나
  body: |
    수열 $\{a_n\}$이 수렴할 때, $\displaystyle\lim_{n\to\infty}a_n=\lim_{n\to\infty}a_{2n}=\lim_{n\to\infty}a_{2n-1}$이다.
stem: 다음 제시문을 읽고 물음에 답하시오.
# 소문항 배점 미공개 — 추정 (문제 3은 33%이며 소문항 8/8/8/9점으로 가름)
subparts:
- id: '1'
  stem: 자연수 $n$에 대하여, $\mathrm P_{2n}(x_{2n},y_{2n})$과 $\mathrm P_{2n-1}(x_{2n-1},y_{2n-1})$을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: ((2/3)*(1-(-1)**n/2**n), (1/2)*(1-(-1)**n/2**n), (2/3)*(1-(-1)**n/2**n), (1/2)*(1-(-1)**(n-1)/2**(n-1)))
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5~6 [3.1]
    steps:
    - id: 1b-1
      content: 처음 다섯 개 점의 좌표를 살펴보면 $\mathrm P_0(0,0)$, $\mathrm P_1(1,0)$, $\mathrm P_2\left(1,\dfrac34\right)$, $\mathrm P_3\left(1-\dfrac12,\dfrac34\right)$, $\mathrm P_4\left(1-\dfrac12,\dfrac34-\dfrac38\right)$이다.
      criteria: [1.R1]
    - id: 1b-2
      content: 이므로 $x_{2n-1}=x_{2n}$, $y_{2n}=y_{2n+1}$이고, $x_{2n}=1-\dfrac12+\dfrac14-\cdots+\dfrac{(-1)^{n-1}}{2^{n-1}}=\dfrac{1-(-1/2)^n}{1-(-1/2)}=\dfrac23\left(1-\dfrac{(-1)^n}{2^n}\right)$, $y_{2n}=\dfrac34-\dfrac38+\dfrac3{16}-\cdots+(-1)^{n+1}\dfrac3{2^{n+1}}=\dfrac34\left(1-\dfrac12+\dfrac14-\cdots+\dfrac{(-1)^{n-1}}{2^{n-1}}\right)=\dfrac12\left(1-\dfrac{(-1)^n}{2^n}\right)$이다.
      criteria: [1.R1, 1.M1]
    - id: 1b-3
      content: 따라서 $\mathrm P_{2n}\left(\dfrac23\left[1-\dfrac{(-1)^n}{2^n}\right],\dfrac12\left[1-\dfrac{(-1)^n}{2^n}\right]\right)$, $\mathrm P_{2n-1}\left(\dfrac23\left[1-\dfrac{(-1)^n}{2^n}\right],\dfrac12\left[1-\dfrac{(-1)^{n-1}}{2^{n-1}}\right]\right)$이다. (정답 값은 $(x_{2n},y_{2n},x_{2n-1},y_{2n-1})$ 순)
      criteria: [1.A1]
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: 처음 몇 개 점의 좌표를 구해 $x_{2n-1}=x_{2n}$, $y_{2n}=y_{2n+1}$을 찾았다.
      steps: [1b-1, 1b-2]
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 등비수열의 합으로 $x_{2n}$, $y_{2n}$을 구했다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $\mathrm P_{2n}$과 $\mathrm P_{2n-1}$의 좌표를 모두 구했다.
      depends_on:
      - 1.M1
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
