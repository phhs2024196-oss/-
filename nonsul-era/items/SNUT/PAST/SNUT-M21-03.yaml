  - 매개변수 $t=1-\dfrac{(-1)^n}{2^n}$ 소거
  - $\displaystyle\lim a_n=\lim a_{2n}=\lim a_{2n-1}$
  conditions:
  - $\overline{\mathrm P_0\mathrm P_1}=1$
  - $n$이 짝수일 때 비 $\dfrac34$, 홀수일 때 비 $\dfrac23$
