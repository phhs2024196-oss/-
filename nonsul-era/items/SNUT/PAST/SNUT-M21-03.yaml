- id: '4'
  stem: '[3.2]와 [3.3]에서 구한 $y=f(x)$와 $y=g(x)$의 교점 Q를 구하고, 점 $\mathrm P_n$이 점 Q로 한없이 가까워짐을 설명하시오.'
  points: 9
