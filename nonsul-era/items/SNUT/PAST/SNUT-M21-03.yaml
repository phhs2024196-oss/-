intent: 우리 주변의 상황을 수치화하여 변화의 추이를 수학적으로 예측하는 것은 수학을 배우는 중요한 이유 중 하나이다. 등비수열은 인구수, 원금과 이자의 합과 같은 자료를, 수열의 합은 현재의 자료를 설명하는 수치가 된다. 본 문제에서는 수열로 주어진 자료의 성격을 파악하고, 대상을 보다 직관적으로 파악하는 시각을 평가하고자 했다. 3.1은 등비수열의 일반항과 합, 3.2·3.3은 매개변수 방정식 등을 이용하여 주어진 점들의 관계식을 찾는 능력, 3.4는 수렴하는 수열의 극한값을 이용하여 부분 수열들의 극한값을 이용하는 능력을 평가한다.
key_idea: 점 $\mathrm P_n$을 직접 나열해 짝수 번째 점이 한 직선 위, 홀수 번째 점이 다른 직선 위에 있음을 보인다. $x_{2n}=\dfrac23\left(1-\dfrac{(-1)^n}{2^n}\right)$를 매개변수 $t=1-\dfrac{(-1)^n}{2^n}$로 보아 $f(x)=\dfrac34x$, 홀수 번째는 $g(x)=-\dfrac32x+\dfrac32$이고 교점 $\mathrm Q\left(\dfrac23,\dfrac12\right)$. 제시문 (나)로 수렴점이 두 직선의 교점임을 설명한다.
stuck: 3.1 처음 몇 점을 직접 구해 $x_{2n-1}=x_{2n}$, $y_{2n}=y_{2n+1}$ 규칙과 등비수열의 합을 읽어내는 단계, 3.2·3.3 점의 좌표를 매개변수로 놓아 직선의 방정식으로 바꾸는 단계, 3.4 수렴하는 수열의 부분수열의 극한이 같음을 이용하는 단계
