  stem: 다항함수 $y=f(x)$의 그래프가 점 $\mathrm P_0,\mathrm P_2,\mathrm P_4,\ldots,\mathrm P_{2n},\ldots$을 지날 때, $f(x)$를 구하시오.
  points: 8
  depends_on: ['1']
  answer:
    kind: expression
    value: 3*x/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.6 [3.2]
    steps:
    - id: 2b-1
      content: '[3.1]로부터 짝수 번째 점은 $\mathrm P_{2n}\left(\dfrac23\left[1-\dfrac{(-1)^n}{2^n}\right],\dfrac12\left[1-\dfrac{(-1)^n}{2^n}\right]\right)$이므로 $t=1-\dfrac{(-1)^n}{2^n}$으로 두면 $x=\dfrac23t$, $y=\dfrac12t$인 매개변수방정식으로 표현된다. 따라서 모든 자연수 $n$에 대하여 점 $\mathrm P_{2n}$은 직선 $y=\dfrac34x$ 위에 있다. 즉, $f(x)=\dfrac34x$이다.'
      criteria: [2.M1, 2.A1]
  rubric:
