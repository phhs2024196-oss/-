      points: 4
      evidence: $t=1-\dfrac{(-1)^n}{2^n}$로 두어 $x=\dfrac23t$, $y=\dfrac12t$의 매개변수 표현으로 나타냈다.
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 4
