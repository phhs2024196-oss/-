  - 짝수 번째 점 $\mathrm P_{2n}$을 지나는 다항함수 $f(x)$, 홀수 번째 점 $\mathrm P_{2n-1}$을 지나는 다항함수 $g(x)$
  - 교점 Q와 $\mathrm P_n$의 극한점
  concepts:
