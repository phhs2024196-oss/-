  stem: 다항함수 $y=g(x)$의 그래프가 점 $\mathrm P_1,\mathrm P_3,\mathrm P_5,\ldots,\mathrm P_{2n-1},\ldots$을 지날 때, $g(x)$를 구하시오.
  points: 8
  depends_on: ['1']
  answer:
