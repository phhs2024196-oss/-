  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.6 [3.4]
    steps:
    - id: 4b-1
      content: '[3.2]와 [3.3]에서 구한 $y=f(x)$와 $y=g(x)$의 교점 Q의 좌표는 $\left(\dfrac23,\dfrac12\right)$이다.'
      criteria: [4.M1]
    - id: 4b-2
      content: 제시문 (나)에 의해 점 $\mathrm P_n$이 한없이 가까워지는 점의 좌표를 $(a,b)$라 할 때, $a=\displaystyle\lim_{n\to\infty}x_n=\lim_{n\to\infty}x_{2n}$, $b=\lim_{n\to\infty}y_n=\lim_{n\to\infty}y_{2n}$이므로 $(a,b)$는 직선 $y=\dfrac34x$ 위에 있다. 또 $a=\displaystyle\lim_{n\to\infty}x_n=\lim_{n\to\infty}x_{2n-1}$, $b=\lim_{n\to\infty}y_n=\lim_{n\to\infty}y_{2n-1}$이므로 $(a,b)$는 직선 $y=-\dfrac32x+\dfrac32$ 위에 있다.
      criteria: [4.R1]
    - id: 4b-3
      content: 따라서 $(a,b)$는 두 직선의 교점 중 하나이고, 두 직선의 교점이 유일하므로 점 $\mathrm P_n$이 한없이 가까워지는 점은 Q가 된다.
      criteria: [4.R1]
