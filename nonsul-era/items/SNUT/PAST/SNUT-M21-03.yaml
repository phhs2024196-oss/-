    source_flow: 출제배경 및 해설 p.6 [3.3]
    steps:
    - id: 3b-1
      content: '[3.1]로부터 홀수 번째 점은 $\mathrm P_{2n-1}\left(\dfrac23\left[1-\dfrac{(-1)^n}{2^n}\right],\dfrac12\left[1-\dfrac{(-1)^{n-1}}{2^{n-1}}\right]\right)$이므로 $s=\dfrac{(-1)^n}{2^n}$으로 두면 $x=\dfrac23(1-s)$, $y=\dfrac12(1+2s)$로 표현된다. 따라서 모든 자연수 $n$에 대하여 점 $\mathrm P_{2n-1}$은 직선 $y=-\dfrac32x+\dfrac32$ 위에 있다. 즉, $g(x)=-\dfrac32x+\dfrac32$이다.'
      criteria: [3.M1, 3.A1]
