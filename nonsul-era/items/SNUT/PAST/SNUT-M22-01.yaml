- id: '2'
  stem: |
    곡선 $x^3+xy+y^3-8=0$과 $x$축과의 교점을 P라 하자. 점 P에서 이 곡선의 접선을 $l_1$, 직선 $l_1$과 수직이고 점 P를 지나는 직선을 $l_2$라 할 때, 두 직선 $l_1$, $l_2$와 $y$축으로 둘러싸인 도형의 넓이를 구하시오.
  points: 11
  depends_on: []
  answer:
    kind: value
    value: 37/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.2]
    steps:
    - id: 2b-1
      content: |
        점 P의 좌표를 $(a,0)$이라 하면 $a^3-8=0$이므로 $a=2$이다. 주어진 곡선의 방정식을 음함수 미분하면
        $$3x^2+y+xy^{\prime}+3y^2y^{\prime}=0$$
        이므로 $(x,y)=(2,0)$을 대입하여 점 $(2,0)$에서의 접선의 기울기 $y^{\prime}=-6$을 얻는다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서 $l_1$의 방정식은 $y=-6x+12$이다. 직선 $l_1$과 $l_2$는 수직이므로 $l_2$의 기울기는 $\dfrac16$이 되고 다시 $l_2$는 점 P를 지나므로 $l_2$의 방정식은 $y=\dfrac16x-\dfrac13$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $l_1$과 $l_2$의 교점 좌표는 $\mathrm{P}(2,0)$이고 $l_1$의 $y$절편은 12, $l_2$의 $y$절편은 $-\dfrac13$이므로 직선 $l_1$, $l_2$와 $y$축으로 둘러싸인 도형의 넓이는
        $$\dfrac12\times\left(12+\dfrac13\right)\times2=\dfrac{37}3$$
        이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: |
        $x$축과의 교점 $\mathrm{P}(2,0)$을 구하고 음함수 미분으로 접선의 기울기 $-6$을 구했다.
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        $l_1$: $y=-6x+12$, $l_2$: $y=\dfrac16x-\dfrac13$을 구했다.
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        두 직선의 $y$절편으로 삼각형의 넓이 $\dfrac{37}3$을 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    deductions:
