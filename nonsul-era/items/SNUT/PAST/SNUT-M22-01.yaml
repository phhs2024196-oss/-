- id: '3'
  stem: |
    다음 정적분을 구하시오.
    $$\int_{-1}^{1}\left(1+4x+9x^2+16x^3+\cdots+2022^2x^{2021}\right)dx$$
  points: 11
  depends_on: []
  answer:
    kind: value
    value: '2044242'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1~2 [1.3]
    steps:
    - id: 3b-1
      content: |
        자연수 $k$에 대하여
        $$\int_{-1}^{1}k^2x^{k-1}dx=\left[kx^k\right]_{-1}^{1}=\begin{cases}2k&(k\text{는 홀수})\\0&(k\text{는 짝수})\end{cases}$$
        이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        이로부터 구하는 정적분의 값은
        $$\int_{-1}^{1}\left(1+4x+9x^2+\cdots+2022^2x^{2021}\right)dx=2(1+3+\cdots+2021)=2\sum_{k=1}^{1011}(2k-1)$$
        $$=2\times\left\{2\times\dfrac{1011\times(1011+1)}2-1011\right\}=2\times1011^2=2044242$$
        이다.
      criteria:
      - 3.A1
  rubric:
