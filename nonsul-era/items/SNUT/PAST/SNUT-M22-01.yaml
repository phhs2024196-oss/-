      points: 6
      evidence: |
        일반항 $k^2x^{k-1}$의 정적분이 $k$의 홀짝에 따라 $2k$ 또는 $0$임을 보였다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: |
        홀수의 합 $2(1+3+\cdots+2021)=2\times1011^2=2044242$를 구했다.
      depends_on:
