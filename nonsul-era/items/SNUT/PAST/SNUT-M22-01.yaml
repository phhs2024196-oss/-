intent: |
  물질의 처음 상태와 나중 상태에 대한 설명을 만족하는 함수의 식을 찾고 이를 이용해 원하는 정보를 찾는 능력, 음함수 미분법으로 함수의 그래프가 아닌 곡선의 접선을 구하는 능력, 다항함수의 정적분과 간단한 수열의 합을 구하는 능력을 본다.
key_idea: |
  [1.1] $T(0)=88$, $T(5)=72$로 $a=64$, $e^b=\left(\dfrac34\right)^{1/5}$를 구하면 $T(15)=24+64\left(\dfrac34\right)^3$. [1.2] $\mathrm{P}(2,0)$, 음함수 미분으로 접선의 기울기 $-6$, 수직인 직선의 기울기 $\dfrac16$. [1.3] $\displaystyle\int_{-1}^1k^2x^{k-1}dx=\left[kx^k\right]_{-1}^1$은 $k$가 홀수이면 $2k$, 짝수이면 $0$.
stuck: |
  [1.1] $e^{5b}$를 먼저 구하고 $e^{15b}=\left(e^{5b}\right)^3$으로 처리하는 단계, [1.2] 곡선이 함수 그래프가 아니므로 음함수 미분이 필요함을 알아채는 단계, [1.3] 항별 적분이 홀수 차수에서만 남음을 알아채는 단계
