subparts:
- id: '1'
  stem: |
    어떤 음료수를 온도가 24℃로 일정하게 유지되는 장소에 놓은 지 $t$분 후 음료수의 온도 $T(t)$는
    $$T(t)=24+ae^{bt}\ (℃)$$
    이다. (단, $a$와 $b$는 상수이다.) $t=0$일 때 88℃인 음료수가 $t=5$일 때 72℃가 되었다고 하자. $t=15$일 때 음료수의 온도를 구하시오.
    [판독확인: 문제 원문이 시각을 $t$분으로 정의하고도 「$t=0$일 때」, 「$t=5$일 때」, 「$t=15$일 때」로 적음(「일」은 원문 표기 그대로, 의미는 시각 $t$)]
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '51'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: |
        $T(0)=88$이므로 $88=24+a$, $a=64$이고, $T(5)=72$이므로
        $$24+64e^{5b}=72,\qquad e^b=\left(\dfrac34\right)^{1/5}$$
        이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 $T(t)=24+64\left(\dfrac34\right)^{t/5}$이다. $t=15$일 때
        $$T(15)=24+64\left(\dfrac34\right)^3=51$$
        이므로 음료수의 온도는 51℃이다.
      criteria:
      - 1.A1
