stimuli:
- label: 가
  body: |
    두 곡선의 교점에서 두 곡선의 접선이 서로 수직일 때, 두 곡선은 그 점에서 서로 수직이라 한다.
- label: 나
  body: |
    양수 $a$에 대하여, $f(x)=\dfrac1{\sqrt3}x^3-ax^2+1$, $g(x)=\dfrac1{\sqrt3}x^3+ax^2-1$이라 하자.
stem: |
  다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    두 곡선 $y=f(x)$와 $y=g(x)$의 교점의 좌표를 모두 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: set
    value: (1/sqrt(a), 1/(a*sqrt(3*a))), (-1/sqrt(a), -1/(a*sqrt(3*a)))
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2~3 [2.1]
    steps:
    - id: 1b-1
      content: |
        교점은 $\dfrac1{\sqrt3}x^3-ax^2+1=\dfrac1{\sqrt3}x^3+ax^2-1$일 때이므로 $x=\pm\dfrac1{\sqrt a}$이고, 이때 $y=\pm\dfrac1{a\sqrt{3a}}$이다.
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-2
      content: |
        따라서 교점의 좌표는 $\left(\dfrac1{\sqrt a},\dfrac1{a\sqrt{3a}}\right)$, $\left(-\dfrac1{\sqrt a},-\dfrac1{a\sqrt{3a}}\right)$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        $f(x)=g(x)$에서 $x^2=\dfrac1a$, 즉 $x=\pm\dfrac1{\sqrt a}$를 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        각 $x$에 대응하는 $y=\pm\dfrac1{a\sqrt{3a}}$를 구해 두 교점의 좌표를 답했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-1
      - 1b-2
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    두 곡선 $y=f(x)$와 $y=g(x)$의 모든 교점에서 두 곡선이 서로 수직이 되는 상수 $a$의 값을 구하시오.
  points: 8
  depends_on:
  - '1'
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.2]
    steps:
    - id: 2b-1
      content: |
        $f(x)$와 $g(x)$를 미분하면
        $$f'(x)=\sqrt3x^2-2ax,\qquad g'(x)=\sqrt3x^2+2ax$$
        이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        모든 교점에서 두 곡선의 접선이 수직이 되려면
        $$\left(\dfrac{\sqrt3}a-2\sqrt a\right)\times\left(\dfrac{\sqrt3}a+2\sqrt a\right)=-1,\qquad\left(\dfrac{\sqrt3}a+2\sqrt a\right)\times\left(\dfrac{\sqrt3}a-2\sqrt a\right)=-1$$
        이어야 한다. 정리하면 $\dfrac3{a^2}-4a=-1$이므로
        $$4a^3-a^2-3=(a-1)(4a^2+3a+3)=0$$
        이어야 한다. 그런데 $4a^2+3a+3\ne0$이므로 $a=1$이다.
      criteria:
      - 2.M2
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $f^{\prime}(x)=\sqrt3x^2-2ax$, $g^{\prime}(x)=\sqrt3x^2+2ax$를 구했다.
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        두 교점에서 접선의 기울기의 곱이 $-1$이라는 조건을 세워(두 교점 모두 같은 식) $\dfrac3{a^2}-4a=-1$을 얻었다.
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $4a^3-a^2-3=(a-1)(4a^2+3a+3)=0$에서 $a=1$을 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-2
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    문항 [2.2]에서 구한 $a$에 대하여, $f(x)\ge g(x)$인 $x$값의 범위를 구하시오.
  points: 8
  depends_on:
  - '2'
  answer:
    kind: expression
    value: -1 <= x <= 1
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.3]
    steps:
    - id: 3b-1
      content: |
        [2.2]에서 $a=1$이다. $\dfrac1{\sqrt3}x^3-x^2+1\ge\dfrac1{\sqrt3}x^3+x^2-1$이려면 $x^2\le1$이다. 따라서 $f(x)\ge g(x)$이기 위한 $x$값의 범위는 $-1\le x\le1$이다.
      criteria:
      - 3.M1
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $a=1$을 대입해 $f(x)\ge g(x)\iff x^2\le1$로 정리했다.
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        범위 $-1\le x\le1$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-1
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '4'
  stem: |
    문항 [2.2]에서 구한 $a$에 대하여, 두 곡선 $y=f(x)$, $y=g(x)$와 두 직선 $x=-2$, $x=2$로 둘러싸인 도형의 넓이를 구하시오.
  points: 9
  depends_on:
  - '2'
  - '3'
  answer:
    kind: value
    value: '8'
    equivalents: []
    tolerance: null
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.4]
    steps:
    - id: 4b-1
      content: |
        $-1\le x\le1$이면 $f(x)\ge g(x)$이고, $x<-1$ 또는 $x>1$이면 $f(x)<g(x)$이므로 구하는 도형의 넓이 $A$는
        $$A=\int_{-2}^{2}\lvert f(x)-g(x)\rvert dx=\int_{-2}^{2}\lvert-2x^2+2\rvert dx$$
        $$=\int_{-2}^{-1}(2x^2-2)dx+\int_{-1}^{1}(-2x^2+2)dx+\int_{1}^{2}(2x^2-2)dx=8$$
        이다.
      criteria:
      - 4.M1
      - 4.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 4.M1
      mark_type: M
      points: 5
      evidence: |
        [2.3]의 대소 관계로 구간을 $[-2,-1]$, $[-1,1]$, $[1,2]$로 나누어 $\lvert f-g\rvert$를 풀고 적분식을 세웠다.
      steps:
      - 4b-1
    - id: 4.A1
      mark_type: A
      points: 4
      evidence: |
        정적분을 계산해 넓이 $8$을 구했다.
      depends_on:
      - 4.M1
      steps:
      - 4b-1
    deductions:
    - code: D4-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D4-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
