  subpart_links: '[2.1]의 교점의 $x$좌표 $\pm\dfrac1{\sqrt a}$에서 [2.2]의 수직 조건을 세우고, [2.2]의 $a=1$이 [2.3]의 대소 판별과 [2.4]의 넓이로 이어진다.'
