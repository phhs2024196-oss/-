intent: |
  두 곡선이 서로 수직이 되기 위한 조건을 찾고, 두 곡선으로 둘러싸인 도형의 넓이를 구하는 능력을 본다. 제시문과 고등학교 수학 지식을 적절히 이용해야 하며 삼차함수의 그래프를 이해해야 한다.
key_idea: |
  두 식을 같게 놓아 교점 $x=\pm\dfrac1{\sqrt a}$를 구하고, 두 접선의 기울기의 곱이 $-1$이라는 조건이 두 교점에서 모두 같은 식 $\dfrac3{a^2}-4a=-1$이 되어 $a=1$. 이때 $f(x)-g(x)=-2x^2+2$로 $-1\le x\le1$에서 $f\ge g$이고 넓이는 $\displaystyle\int_{-2}^2\lvert-2x^2+2\rvert dx=8$.
stuck: |
  [2.2] 두 교점 모두에서 수직이 되어야 함을 이해하고 두 식이 같아짐을 확인하는 단계, [2.4] $x=\pm1$을 경계로 절댓값을 풀어 적분 구간을 나누는 단계
idea_tags:
