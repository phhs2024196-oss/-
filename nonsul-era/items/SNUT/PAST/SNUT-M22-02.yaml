  - $f^{\prime}(x)g^{\prime}(x)=-1$ ($x=\pm\dfrac1{\sqrt a}$ 모두)
  - $4a^3-a^2-3=(a-1)(4a^2+3a+3)$
  - $\displaystyle\int_{-2}^2\lvert f(x)-g(x)\rvert dx$를 구간 분할
  conditions:
  - (가) 두 곡선이 교점에서 서로 수직이 되는 정의
  - 모든 교점에서 수직이어야 함
  - $a>0$이고 $4a^2+3a+3\ne0$
  - '[2.3], [2.4]는 [2.2]에서 구한 $a$ 사용'
  stimuli_used:
