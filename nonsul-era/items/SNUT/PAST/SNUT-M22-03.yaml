elements:
  materials:
  - 한 변의 길이가 1인 정사각형 $\mathrm{A}_0\mathrm{B}_0\mathrm{C}_0\mathrm{D}_0$의 각 변을 $\alpha:1-\alpha$로 내분하는 점을 이은 정사각형 $\mathrm{A}_1\mathrm{B}_1\mathrm{C}_1\mathrm{D}_1$
  - 이 과정을 반복한 정사각형 열 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n\mathrm{D}_n$
  - 변 $\mathrm{A}_{n-1}\mathrm{A}_n$의 길이 $l_n$, 삼각형 $\mathrm{A}_{n-1}\mathrm{A}_n\mathrm{D}_n$의 넓이 $S_n$
  concepts:
