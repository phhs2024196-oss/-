  stem: |
    $\theta=\angle\mathrm{A}_0\mathrm{D}_1\mathrm{A}_1$, $t=\tan\theta$에 대하여 $\alpha$를 $t$에 관한 식으로 나타내시오.
  points: 11
  depends_on: []
