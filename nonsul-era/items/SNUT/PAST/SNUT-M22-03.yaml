  - 직각삼각형의 삼각비
  - 도형의 닮음(길이비·넓이비)
  - 등비수열
  - 등비급수의 합
  tools:
  - $t=\tan\theta=\dfrac\alpha{1-\alpha}$
  - $\sqrt{\alpha^2+(1-\alpha)^2}=\sqrt{2\alpha^2-2\alpha+1}$
  - $l_{n+1}=\sqrt{2\alpha^2-2\alpha+1}\,l_n$
  - 등비급수 $\dfrac{a}{1-r}$ ($\lvert r\rvert<1$)
  conditions:
  - $0<\alpha<\dfrac12$
  - 삼각형 $\mathrm{A}_{n-1}\mathrm{A}_n\mathrm{D}_n$과 $\mathrm{A}_n\mathrm{A}_{n+1}\mathrm{D}_{n+1}$의 닮음
