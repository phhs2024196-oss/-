  misconceptions: []
- id: '2'
  stem: |
    변 $\mathrm{A}_{n-1}\mathrm{A}_n$의 길이를 $l_n$이라 할 때, $\displaystyle\sum_{n=1}^{\infty}l_n$을 $t$에 관한 식으로 나타내시오.
  points: 11
  depends_on:
  - '1'
  answer:
    kind: expression
    value: t/(1+t-sqrt(1+t**2))
    equivalents:
    - (1+t+sqrt(1+t**2))/2
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.2]
    steps:
    - id: 2b-1
      content: |
        자연수 $n$에 대하여 삼각형 $\mathrm{A}_{n-1}\mathrm{A}_n\mathrm{D}_n$에서 $\overline{\mathrm{A}_{n-1}\mathrm{A}_n}:\overline{\mathrm{A}_n\mathrm{D}_n}=\alpha:\sqrt{2\alpha^2-2\alpha+1}$이므로
        $$\alpha\,\overline{\mathrm{A}_n\mathrm{D}_n}=\sqrt{2\alpha^2-2\alpha+1}\,\overline{\mathrm{A}_{n-1}\mathrm{A}_n}$$
        이다. 또 $l_{n+1}=\overline{\mathrm{A}_n\mathrm{A}_{n+1}}=\alpha\,\overline{\mathrm{A}_n\mathrm{D}_n}$이므로 $l_{n+1}=\sqrt{2\alpha^2-2\alpha+1}\times l_n$이 된다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $l_1=\alpha$이므로 수열 $\{l_n\}$은 첫째항이 $\alpha$, 공비가 $\sqrt{2\alpha^2-2\alpha+1}$인 등비수열이 된다. 이를 [3.1]에서의 관계식을 이용하여 $t$로 표현하면
        $$\alpha=\dfrac t{1+t},\qquad\sqrt{2\alpha^2-2\alpha+1}=\dfrac{\sqrt{1+t^2}}{1+t}$$
        이고 따라서 구하고자 하는 등비급수의 합은
        $$\sum_{n=1}^{\infty}l_n=\dfrac t{1+t-\sqrt{1+t^2}}=\dfrac12\left(1+t+\sqrt{1+t^2}\right)$$
        이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 6
      evidence: |
        삼각형의 닮음(또는 피타고라스 정리)으로 $l_{n+1}=\sqrt{2\alpha^2-2\alpha+1}\,l_n$, 즉 첫째항 $\alpha$, 공비 $\sqrt{2\alpha^2-2\alpha+1}$인 등비수열임을 보였다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: |
        $\alpha=\dfrac t{1+t}$로 바꿔 등비급수의 합 $\dfrac t{1+t-\sqrt{1+t^2}}$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    삼각형 $\mathrm{A}_{n-1}\mathrm{A}_n\mathrm{D}_n$의 넓이를 $S_n$이라 할 때, $\displaystyle\sum_{n=1}^{\infty}S_{2n-1}=\dfrac2{13}$가 되는 $\alpha$를 구하시오.
  points: 11
  depends_on:
  - '2'
  answer:
    kind: value
    value: 1/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.3]
    steps:
    - id: 3b-1
      content: |
        [3.2]에서 삼각형 $\mathrm{A}_{n-1}\mathrm{A}_n\mathrm{D}_n$과 삼각형 $\mathrm{A}_n\mathrm{A}_{n+1}\mathrm{D}_{n+1}$의 닮음비는 $1:\sqrt{2\alpha^2-2\alpha+1}$이므로 넓이의 비는 $1:(2\alpha^2-2\alpha+1)$이다. 따라서 수열 $\{S_{2n-1}\}$은 첫째항 $S_1$이 $\dfrac{\alpha(1-\alpha)}2$, 공비가 $(2\alpha^2-2\alpha+1)^2$인 등비수열이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        등비급수가 $\displaystyle\sum_{n=1}^{\infty}S_{2n-1}=\dfrac2{13}$를 만족해야 하므로
        $$\sum_{n=1}^{\infty}S_{2n-1}=\dfrac{\dfrac{\alpha(1-\alpha)}2}{1-(2\alpha^2-2\alpha+1)^2}=\dfrac1{8(\alpha^2-\alpha+1)}=\dfrac2{13}$$
        을 풀면 $\alpha=\dfrac14,\dfrac34$이다. $\alpha$의 범위가 $0<\alpha<\dfrac12$이므로 $\alpha=\dfrac14$이다.
      criteria:
      - 3.M2
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 1
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: |
        넓이의 닮음비 $1:(2\alpha^2-2\alpha+1)$로 $\{S_{2n-1}\}$이 첫째항 $\dfrac{\alpha(1-\alpha)}2$, 공비 $(2\alpha^2-2\alpha+1)^2$인 등비수열임을 보였다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        등비급수의 합 $\dfrac1{8(\alpha^2-\alpha+1)}$을 구했다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        $\dfrac1{8(\alpha^2-\alpha+1)}=\dfrac2{13}$를 풀어 $0<\alpha<\dfrac12$인 $\alpha=\dfrac14$를 구했다.
      depends_on:
      - 3.M2
      steps:
      - 3b-2
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
