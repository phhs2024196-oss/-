stimuli:
- label: 가
  body: |
    $0<\alpha<\dfrac12$인 $\alpha$에 대하여 다음의 단계를 시행한다.
    (가) 아래 그림과 같이 한 변의 길이가 1인 정사각형 $\mathrm{A}_0\mathrm{B}_0\mathrm{C}_0\mathrm{D}_0$에 대하여 변 $\mathrm{A}_0\mathrm{B}_0$을 $\alpha:1-\alpha$로 내분하는 점을 $\mathrm{A}_1$, 변 $\mathrm{B}_0\mathrm{C}_0$을 $\alpha:1-\alpha$로 내분하는 점을 $\mathrm{B}_1$, 변 $\mathrm{C}_0\mathrm{D}_0$을 $\alpha:1-\alpha$로 내분하는 점을 $\mathrm{C}_1$, 변 $\mathrm{D}_0\mathrm{A}_0$을 $\alpha:1-\alpha$로 내분하는 점을 $\mathrm{D}_1$이라 하자.
    [그림] 정사각형 $\mathrm{A}_0\mathrm{B}_0\mathrm{C}_0\mathrm{D}_0$(왼쪽 위 $\mathrm{A}_0$, 왼쪽 아래 $\mathrm{B}_0$, 오른쪽 아래 $\mathrm{C}_0$, 오른쪽 위 $\mathrm{D}_0$) 안에 각 변의 내분점 $\mathrm{A}_1$($\mathrm{A}_0\mathrm{B}_0$ 위, $\mathrm{A}_0$에서 $\alpha$만큼), $\mathrm{B}_1$, $\mathrm{C}_1$, $\mathrm{D}_1$을 이은 기울어진 정사각형 $\mathrm{A}_1\mathrm{B}_1\mathrm{C}_1\mathrm{D}_1$이 있고, 같은 방법으로 안쪽에 $\mathrm{A}_2\mathrm{B}_2\mathrm{C}_2\mathrm{D}_2$ 등 더 작은 정사각형들이 반복해서 그려져 있다. $\mathrm{A}_0\mathrm{A}_1$은 $\alpha$, $\mathrm{A}_1\mathrm{B}_0$은 $1-\alpha$로 표시되어 있다.
- label: 나
  body: |
    (나) 정사각형 $\mathrm{A}_1\mathrm{B}_1\mathrm{C}_1\mathrm{D}_1$에 대하여 변 $\mathrm{A}_1\mathrm{B}_1$, $\mathrm{B}_1\mathrm{C}_1$, $\mathrm{C}_1\mathrm{D}_1$ 및 $\mathrm{D}_1\mathrm{A}_1$을 $\alpha:1-\alpha$로 내분하는 점을 각각 $\mathrm{A}_2$, $\mathrm{B}_2$, $\mathrm{C}_2$ 및 $\mathrm{D}_2$라 하자.
- label: 다
  body: |
    (다) 이 과정을 반복하여 정사각형 $\mathrm{A}_{n-1}\mathrm{B}_{n-1}\mathrm{C}_{n-1}\mathrm{D}_{n-1}$에 대하여 각 변을 $\alpha:1-\alpha$로 내분하는 네 점을 연결하여 정사각형 $\mathrm{A}_n\mathrm{B}_n\mathrm{C}_n\mathrm{D}_n$을 얻을 수 있다. (단, $n$은 자연수이다.)
stem: |
  다음 제시문을 읽고 물음에 답하시오.
