intent: |
  극한은 사회과학, 자연과학 등 여러 분야의 현상 분석에 많이 이용된다. 주어진 현상에서 규칙을 발견하고 현상을 이해·예측하기 위해 등비수열과 등비급수를 바르게 이해하는지 평가한다. 직각삼각형에서 삼각비로 식을 얻고, 삼각형의 닮음으로 등비급수의 합을 구하며, 등비급수로 표현되는 도형의 넓이의 합이 특정한 값이 되는 조건을 구하는 능력을 본다.
key_idea: |
  $\tan\theta=\dfrac\alpha{1-\alpha}=t$에서 $\alpha=\dfrac t{1+t}$. 삼각형 $\mathrm{A}_{n-1}\mathrm{A}_n\mathrm{D}_n$의 닮음비 $1:\sqrt{2\alpha^2-2\alpha+1}$로 $\{l_n\}$은 첫째항 $\alpha$, 공비 $\sqrt{2\alpha^2-2\alpha+1}$인 등비수열이고 $\displaystyle\sum l_n=\dfrac t{1+t-\sqrt{1+t^2}}$. 넓이 비는 $1:(2\alpha^2-2\alpha+1)$이므로 $\{S_{2n-1}\}$은 공비 $(2\alpha^2-2\alpha+1)^2$인 등비수열, $\displaystyle\sum S_{2n-1}=\dfrac1{8(\alpha^2-\alpha+1)}=\dfrac2{13}$에서 $\alpha=\dfrac14$.
stuck: |
  [3.1] 직각삼각형 $\mathrm{A}_0\mathrm{D}_1\mathrm{A}_1$의 두 변($\alpha$, $1-\alpha$)으로 $\tan\theta$를 세우는 단계, [3.2] 닮음비 $1:\sqrt{2\alpha^2-2\alpha+1}$를 구해 공비로 읽는 단계, [3.3] 넓이의 닮음비(제곱)와 홀수 번째 항만의 공비 $(2\alpha^2-2\alpha+1)^2$를 구하는 단계
