- id: '3'
  stem: 함수 $f(x)=\dfrac{1}{1+e^{-x}}$, $g(x)=\ln\dfrac{x}{1-x}$에 대하여, $h(x)=g(f(x))$로 정의할 때 $h'(x)$를 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.3]
    steps:
    - id: 3b-1
      content: '$y=f(x)$, $z=h(x)=g(y)$라 놓으면 $h''(x)=g''(y)y''=\dfrac{d}{dy}[\ln y-\ln(1-y)]\times\dfrac{dy}{dx}$이다. 여기서 $\dfrac{d}{dy}[\ln y-\ln(1-y)]=\dfrac{y''}{y}+\dfrac{y''}{1-y}=\dfrac{y''}{y(1-y)}$이고 $\dfrac{dy}{dx}=\dfrac{e^{-x}}{(1-e^{-x})^2}$이다. [판독확인: 공식 해설 원문의 분모는 $(1-e^{-x})^2$로 표기되어 있으나 $f(x)=\dfrac1{1+e^{-x}}$의 미분은 $\dfrac{e^{-x}}{(1+e^{-x})^2}$임 — 공식 해설 오기 의심]'
      criteria:
      - 3.M1
    - id: 3b-2
      content: '한편 $y(1-y)=\dfrac{1}{1-e^{-x}}\times\dfrac{e^{-x}}{1-e^{-x}}$이므로 $h''(x)=1$이다. [판독확인: 공식 해설 원문은 $1-e^{-x}$로 표기, 정확히는 $y(1-y)=\dfrac{1}{1+e^{-x}}\times\dfrac{e^{-x}}{1+e^{-x}}$]'
      criteria:
      - 3.A1
  - id: S3-B2
    audience: B
    method_no: 2
    source_flow: 출제배경 및 해설 p.2 [1.3] (별해)
    steps:
    - id: 3b2-1
      content: 지수-로그함수의 성질을 이용하면 $h(x)=g(f(x))=x$임을 보일 수 있다. 이로부터 $h'(x)=1$을 얻는다.
      criteria: []
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 8
      evidence: 합성함수의 미분법으로 $h'(x)=\dfrac{1}{y(1-y)}\cdot\dfrac{dy}{dx}$ 구성, $\dfrac{dy}{dx}$ 계산
      steps:
      - 3b-1
    - id: 3.A1
