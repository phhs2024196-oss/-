subparts:
- id: '1'
  stem: 집합 $\{-1,1,3\}$이 함수 $f(x)=a\sin x+a^2-3$의 치역에 포함되기 위한 $a$의 최솟값을 구하시오.
  points: 11
  depends_on: []
  answer: {kind: value, value: '-2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: 집합이 주어진 함수의 치역에 포함되기 위해서는 함수의 최댓값은 $3$이상, 함수의 최솟값은 $-1$이하여야 한다. 주어진 함수의 최댓값은 $a^2+\lvert a\rvert-3$이므로 $a^2+\lvert a\rvert-3\ge3$을 만족해야 한다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $a\ge0$인 경우 $a^2+a-6=(a+3)(a-2)\ge0$으로부터 $a\ge2$를 얻고, $a<0$인 경우 $a^2-a-6=(a-3)(a+2)\ge0$으로부터 $a\le-2$를 얻는다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 비슷한 방법으로 부등식 $a^2-\lvert a\rvert-3\le-1$을 풀면 $-2\le a\le2$이므로 $a=2$ 또는 $a=-2$가 된다. 따라서 구하고자 하는 최솟값은 $-2$이다.
      criteria:
      - 1.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 최댓값 $\ge3$, 최솟값 $\le-1$ 조건 설정, 최댓값 $a^2+\lvert a\rvert-3$
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 최댓값 조건에서 $a\ge2$ 또는 $a\le-2$
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: 최솟값 조건과 합쳐 $a=\pm2$, 최솟값 $-2$
      depends_on:
      - 1.M2
      steps:
      - 1b-3
