- id: '2'
  stem: |-
    등비수열 $\{a_n\}$과 수열 $\{b_n\}$이 다음 조건을 만족할 때, $\{a_n\}$의 공비를 구하시오. (단, $a_1\ne0$)
    (1) 급수 $\displaystyle\sum_{n=1}^{\infty}a_n$이 수렴
    (2) $\displaystyle\lim_{n\to\infty}b_n=2a_1$
    (3) $\displaystyle\sum_{n=1}^{\infty}a_n=\lim_{n\to\infty}(a_n+b_n)$
  points: 11
  depends_on: []
  answer: {kind: value, value: 1/2, equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.2]
    steps:
    - id: 2b-1
      content: 등비급수 $\displaystyle\sum_{n=1}^{\infty}a_n$이 수렴하므로 수열 $a_n$의 공비 $r$은 $-1<r<1$을 만족한다. 따라서 등비수열 $a_n$의 극한은 $\displaystyle\lim_{n\to\infty}a_n=0$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 수열 $a_n$과 $b_n$이 모두 수렴하므로 $\displaystyle\lim_{n\to\infty}(a_n+b_n)=\lim_{n\to\infty}a_n+\lim_{n\to\infty}b_n=2a_1$이 성립한다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 $\displaystyle\sum_{n=1}^{\infty}a_n=\dfrac{a_1}{1-r}=2a_1$로부터 $r=\dfrac12$을 얻는다.
      criteria:
      - 2.A1
  rubric:
