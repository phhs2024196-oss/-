stimuli:
- label: 가
  body: |-
    곡선 $y=\dfrac12x^2+\dfrac12$ 위의 점 $\mathrm{A}\left(a,\dfrac12a^2+\dfrac12\right)$에서의 접선을 $l_1$이라 하자. (단, $a\ne0$) 직선 $l_1$과 수직이고, 곡선 $y=\dfrac12x^2+\dfrac12$에 접하는 직선을 $l_2$라 하자. 이때 점 $\mathrm{B}$는 $l_2$와 곡선 $y=\dfrac12x^2+\dfrac12$의 접점이다.
    [그림] 포물선 $y=\dfrac12x^2+\dfrac12$ 위에 제1사분면 쪽의 점 A와 제2사분면 쪽의 점 B가 있고, A에서의 접선 $l_1$(기울기 양수)과 B에서의 접선 $l_2$(기울기 음수)가 $x$축 위 부근에서 직각으로 만난다.
stem: 다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: '1'
  stem: 직선 $l_2$의 방정식을 구하시오.
  points: 8
  depends_on: []
  answer: {kind: expression, value: y=-x/a-1/(2*a**2)+1/2, equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.1]
    steps:
    - id: 1b-1
      content: $y=\dfrac12x^2+\dfrac12$일 때 $y'=x$이다. 직선 $l_1$은 점 $\mathrm{A}\left(a,\dfrac12a^2+\dfrac12\right)$에서 곡선에 접하므로 접선의 기울기가 $a$가 되어 $l_1$의 방정식은 $y=ax-\dfrac12a^2+\dfrac12$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 비슷하게 직선 $l_2$와 곡선의 접점을 $\left(b,\dfrac12b^2+\dfrac12\right)$이라 하면 $l_2$의 방정식은 $y=bx-\dfrac12b^2+\dfrac12$이다. $l_1$과 $l_2$가 수직이므로 $ab=-1$, 즉 $b=-\dfrac1a$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 따라서 $l_2$의 방정식은 $y=-\dfrac1ax-\dfrac1{2a^2}+\dfrac12$이다.
      criteria:
      - 1.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: '$y''=x$로 $l_1$: $y=ax-\dfrac12a^2+\dfrac12$'
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $l_2$ 접점 $b$ 설정, 수직 조건 $ab=-1$
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: '$l_2$: $y=-\dfrac1ax-\dfrac1{2a^2}+\dfrac12$'
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: 두 직선 $l_1$과 $l_2$의 교점을 $\mathrm{P}$라 할 때, 점 $\mathrm{P}$는 항상 $x$축 위의 점임을 보이시오.
  points: 8
  depends_on:
  - '1'
  answer: {kind: proof, value: 점 P의 y좌표가 0 (두 접선의 식을 변변 더하면 (a^2+1)y=0), equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.2]
    steps:
    - id: 2b-1
      content: $l_1$과 $l_2$의 교점 $\mathrm{P}$의 $y$좌표가 $0$임을 보이면 된다. $l_2$의 방정식 $y=-\dfrac1ax-\dfrac1{2a^2}+\dfrac12$의 양변에 $a^2$을 곱하여 $a^2y=-ax-\dfrac12+\dfrac12a^2$을 얻는다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 이 식과 $l_1$의 방정식 $y=ax-\dfrac12a^2+\dfrac12$을 더하면 $(a^2+1)y=0$, 즉 $y=0$이다. 따라서 $\mathrm{P}$의 $y$좌표는 항상 $0$이므로 $\mathrm{P}$는 $x$축 위의 점이다.
      criteria:
      - 2.R1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: $l_2$의 양변에 $a^2$을 곱한 식 $a^2y=-ax-\dfrac12+\dfrac12a^2$
      steps:
      - 2b-1
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: $(a^2+1)y=0$에서 $y=0$ 결론
      steps:
      - 2b-2
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
