key_idea: $x=1$에서 $f(1)=\dfrac{\sin k+1}2$, $x>1$에서 $x^n$으로 나누어 $f(x)=x\sin kx$, 연속 조건 $\sin k=1$로 $k=\dfrac\pi2$, 부분적분으로 넓이 $\dfrac4\pi-\dfrac4{\pi^2}$.
