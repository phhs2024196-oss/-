      content: 부분적분하면 $S=\left[x\cdot\left(-\dfrac2\pi\cos\dfrac{\pi x}2\right)\right]_1^2-\displaystyle\int_1^2\left(-\dfrac2\pi\cos\dfrac{\pi x}2\right)dx=\left[-\dfrac2\pi x\cos\dfrac{\pi x}2+\left(\dfrac2\pi\right)^2\sin\dfrac{\pi x}2\right]_1^2$
