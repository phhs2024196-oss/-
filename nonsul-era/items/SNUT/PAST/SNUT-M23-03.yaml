stimuli:
- label: 가
  body: 수렴하는 두 수열 $\{a_n\}$, $\{b_n\}$에 대하여 $\displaystyle\lim_{n\to\infty}a_n=\lim_{n\to\infty}b_n=\alpha$이고, 수열 $\{c_n\}$이 모든 자연수 $n$에 대하여 $a_n\le c_n\le b_n$이면 $\displaystyle\lim_{n\to\infty}c_n=\alpha$이다.
- label: 나
  body: 등비수열 $\{r^n\}$에서 $-1<r<1$이면 $\displaystyle\lim_{n\to\infty}r^n=0$이고, $r>1$이거나 $r\le-1$이면 수열 $\{r^n\}$은 발산한다.
- label: 다
  body: |-
    양의 상수 $k$에 대하여
    $$f(x)=\lim_{n\to\infty}\dfrac{x^{n+1}\sin kx+x}{x^n+x\cos\dfrac{\pi x}{2}+1}$$
    라 하자. (단, $1\le x\le2$, $n$은 자연수)
stem: 다음 제시문을 읽고 물음에 답하시오.
