      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |-
    그림과 같이 반지름의 길이가 $1$이고 중심각이 $\dfrac\pi4$인 부채꼴 $\mathrm{P}_1\mathrm{OQ}_1$이 있다. 점 $\mathrm{Q}_1$에서 선분 $\mathrm{OP}_1$에 내린 수선의 발을 $\mathrm{P}_2$라 하고, 선분 $\mathrm{OQ}_1$ 위에 $\overline{\mathrm{OP}_2}=\overline{\mathrm{OQ}_2}$인 점 $\mathrm{Q}_2$를 택하여 중심각이 $\dfrac\pi4$인 부채꼴 $\mathrm{P}_2\mathrm{OQ}_2$를 부채꼴 $\mathrm{P}_1\mathrm{OQ}_1$의 내부에 그린다. 점 $\mathrm{Q}_2$에서 선분 $\mathrm{OP}_2$에 내린 수선의 발을 $\mathrm{P}_3$, 선분 $\mathrm{OQ}_2$ 위에 $\overline{\mathrm{OP}_3}=\overline{\mathrm{OQ}_3}$인 점 $\mathrm{Q}_3$을 택하여 중심각인 $\dfrac\pi4$인 부채꼴 $\mathrm{P}_3\mathrm{OQ}_3$을 부채꼴 $\mathrm{P}_2\mathrm{OQ}_2$의 내부에 그린다. 이와 같은 방법으로 부채꼴을 한없이 그려 나간다. 삼각형 $\mathrm{Q}_n\mathrm{P}_n\mathrm{P}_{n+1}$의 넓이를 $a_n$이라 할 때, 급수 $\displaystyle\sum_{n=1}^{\infty}a_n$의 합을 구하시오.
    [그림] 점 O를 꼭짓점으로 하고 반직선 $\mathrm{OQ}_1$(수평 방향, 오른쪽)과 반직선 $\mathrm{OP}_1$(수평선과 $\dfrac\pi4$를 이루는 방향)이 이루는 부채꼴 $\mathrm{P}_1\mathrm{OQ}_1$. 수평선 위에 $\mathrm{Q}_1,\mathrm{Q}_2,\mathrm{Q}_3,\cdots$가 오른쪽에서 왼쪽(O쪽)으로, 반직선 $\mathrm{OP}_1$ 위에 $\mathrm{P}_1,\mathrm{P}_2,\mathrm{P}_3,\mathrm{P}_4,\cdots$가 위에서 아래(O쪽)로 늘어서 있고 삼각형 $\mathrm{Q}_n\mathrm{P}_n\mathrm{P}_{n+1}$들이 음영으로 칠해져 있다.
  points: 11
  depends_on: []
  answer: {kind: value, value: (sqrt(2)-1)/2, equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1~2 [1.2]
    steps:
    - id: 2b-1
      content: 삼각형 $\mathrm{Q}_1\mathrm{P}_2\mathrm{O}$는 각 $\mathrm{Q}_1\mathrm{P}_2\mathrm{O}$가 직각인 직각이등변삼각형이고 빗변의 길이가 $1$이므로 $\overline{\mathrm{Q}_1\mathrm{P}_2}=\overline{\mathrm{OP}_2}=\dfrac1{\sqrt2}$, $\overline{\mathrm{P}_1\mathrm{P}_2}=1-\dfrac1{\sqrt2}$이다. 따라서 $a_1=\dfrac{\sqrt2-1}{4}$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 모든 자연수 $n$에 대하여 삼각형 $\mathrm{Q}_n\mathrm{P}_{n+1}\mathrm{O}$이 각 $\mathrm{Q}_n\mathrm{P}_{n+1}\mathrm{O}$가 직각인 직각이등변삼각형이므로 $\overline{\mathrm{Q}_n\mathrm{P}_{n+1}}=\overline{\mathrm{OP}_{n+1}}$, $\overline{\mathrm{OP}_{n+1}}=\dfrac1{\sqrt2}\overline{\mathrm{OQ}_n}$이고, 문제의 조건에서 $\overline{\mathrm{OP}_n}=\overline{\mathrm{OQ}_n}$이다. 따라서 $\overline{\mathrm{OP}_{n+1}}=\dfrac1{\sqrt2}\overline{\mathrm{OP}_n}$, $\overline{\mathrm{Q}_{n+1}\mathrm{P}_{n+2}}=\overline{\mathrm{OP}_{n+2}}=\dfrac1{\sqrt2}\overline{\mathrm{OP}_{n+1}}=\dfrac1{\sqrt2}\overline{\mathrm{Q}_n\mathrm{P}_{n+1}}$이다. $a_n=\dfrac12\times\overline{\mathrm{P}_n\mathrm{P}_{n+1}}\times\overline{\mathrm{Q}_n\mathrm{P}_{n+1}}=\dfrac12\times(\overline{\mathrm{OP}_n}-\overline{\mathrm{OP}_{n+1}})\times\overline{\mathrm{Q}_n\mathrm{P}_{n+1}}$로부터 $a_{n+1}=\dfrac14\times(\overline{\mathrm{OP}_n}-\overline{\mathrm{OP}_{n+1}})\times\overline{\mathrm{Q}_n\mathrm{P}_{n+1}}=\dfrac12a_n$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 즉 수열 $\{a_n\}$은 첫째항이 $\dfrac{\sqrt2-1}{4}$이고 공비가 $\dfrac12$인 등비수열이므로, 급수 $\displaystyle\sum_{n=1}^{\infty}a_n$의 합은 $\dfrac{\frac{\sqrt2-1}{4}}{1-\frac12}=\dfrac{\sqrt2-1}{2}$이다.
      criteria:
      - 2.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
