      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: 닮음비 $\dfrac1{\sqrt2}$로 $a_{n+1}=\dfrac12a_n$
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 등비급수의 합 $\dfrac{\sqrt2-1}{2}$
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
