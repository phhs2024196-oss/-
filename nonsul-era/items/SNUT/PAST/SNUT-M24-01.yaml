  misconceptions: []
- id: '3'
  stem: 높이가 $a^2$인 입체도형이 있다. 이 입체도형의 밑면으로부터 높이가 $x$인 지점에서 밑면에 평행한 평면으로 자른 단면이, 반지름의 길이가 $\sqrt{a^2-x}$인 원일 때, 이 입체도형의 부피를 $V_1$이라 하자. 또 다른 입체도형은, 높이가 $a$이며, 밑면으로부터 높이가 $x$인 지점에서 밑면에 평행한 평면으로 자른 단면이, 반지름의 길이가 $(a-x)^2$인 원일 때, 이 입체도형의 부피를 $V_2$라 하자. $V_1=V_2$일 때, 양수 $a$를 구하시오.
  points: 12
  depends_on: []
  answer: {kind: value, value: 5/2, equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.3]
    steps:
    - id: 3b-1
      content: 첫 번째 입체도형의 부피 $V_1$을 구하기 위하여, 밑면으로부터 높이가 $x$일 때 단면의 넓이를 $S_1(x)$라 하면 $S_1(x)=\pi(a^2-x)$이므로 $V_1=\displaystyle\int_0^{a^2}\pi(a^2-x)dx=\dfrac12\pi a^4$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 또 두 번째 입체도형의 부피 $V_2$를 구하기 위하여, 밑면으로부터 높이가 $x$일 때 단면의 넓이를 $S_2(x)$라 하면 $S_2(x)=\pi(a-x)^4$이므로 $V_2=\displaystyle\int_0^{a}\pi(a-x)^4dx$이다. $t=a-x$로 놓으면 $\dfrac{dt}{dx}=-1$이므로 $V_2=\displaystyle\int_a^0\pi t^4(-dt)=\int_0^a\pi t^4dt=\dfrac15\pi a^5$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: $V_1=V_2$를 만족하는 양의 실수인 $a$는 $\dfrac52$이다.
      criteria:
      - 3.A1
  rubric:
