stem: 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |-
    두 집합 $X=\{1,2,3,4,5,6\}$, $Y=\{2,3,4,5,6,7,8\}$에 대하여 다음 조건을 만족하는 함수 $f:X\to Y$의 개수를 구하시오.
    (가) $x$가 홀수일 때 $f(x)$는 소수이다.
    (나) $x$가 짝수일 때 $f(x)$는 짝수이다.
    (다) $x_1<x_2$이면 $f(x_1)<f(x_2)$이다.
  points: 11
  depends_on: []
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: $1$은 홀수이므로 $f(1)$의 가능한 값은 조건 (가)로부터 $2,3,5,7$ 중 하나이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f(1)=2$인 경우, 차례로 $f(2)=4$, $f(3)=5$, $f(4)=6$, $f(5)=7$, $f(6)=8$이다. 또 $f(1)=3$인 경우, $f(2)=4$, $f(3)=5$, $f(4)=6$, $f(5)=7$, $f(6)=8$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $f(1)=5$인 경우, $f(3)=7$이다. 그러나 조건 (다)에 의해 $f(5)$는 $7=f(3)<f(5)$인 소수이고 $7$보다 큰 소수는 $Y$의 원소가 아니므로 $f$는 함수가 아니다. $f(1)=7$인 경우, $f(3)$은 $7=f(1)<f(3)$인 소수이고 마찬가지로 $7$보다 큰 소수는 $Y$의 원소가 아니므로 $f$는 함수가 아니다. 따라서 함수 $f$의 개수는 $2$개이다.
      criteria:
      - 1.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $f(1)\in\{2,3,5,7\}$로 경우 분류
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $f(1)=2,3$일 때 각각 함수 하나씩
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $f(1)=5,7$ 불가 확인, 개수 $2$
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    deductions:
