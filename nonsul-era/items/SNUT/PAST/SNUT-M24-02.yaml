key_idea: $f(x)=x^3-3ax$의 극댓값 $2a\sqrt a$가 $c$. 교점 $-\sqrt a$, $2\sqrt a$ 사이의 넓이 $S=\dfrac{27}4a^2$. $\dfrac{4S}{27(a-2)^2(6-a)}=\dfrac{a^2}{(a-2)^2(6-a)}$를 미분하여 $a=4$에서 최솟값 $2$.
stuck: '[2.1] $c>0$이므로 극댓값과 같아야 한다는 판단, [2.3] 분수함수를 미분하여 $x-2$로 약분하고 $x=4$를 찾는 단계'
