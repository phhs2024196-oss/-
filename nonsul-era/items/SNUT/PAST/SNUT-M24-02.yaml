- label: 가
  body: 양수 $a$에 대하여, 함수 $f(x)$를 다음과 같이 정의한다. $$f(x)=x^3-3ax$$
stem: 다음 제시문을 읽고 물음에 답하시오.
subparts:
- id: '1'
  stem: 양수 $c$에 대하여 직선 $y=c$와 곡선 $y=f(x)$의 교점의 개수가 $2$개일 때, $c$를 $a$에 관한 식으로 나타내시오.
  points: 11
  depends_on: []
  answer: {kind: expression, value: 2*a*sqrt(a), equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.1]
    steps:
    - id: 1b-1
      content: 곡선 $y=f(x)$의 도함수 $f'(x)=3x^2-3a=3(x+\sqrt a)(x-\sqrt a)$로부터 $y=f(x)$의 증감표를 만든다. $x=-\sqrt a$에서 극대, $x=\sqrt a$에서 극소이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 이를 이용하여 곡선 $y=f(x)$의 그래프를 그려 보면 직선 $y=c$와 곡선 $y=f(x)$가 두 점에서 만나기 위해서는 $c$가 $y=f(x)$의 극댓값 혹은 극솟값과 같아야 한다. 극댓값은 $f(-\sqrt a)=2a\sqrt a$이고 극솟값은 $f(\sqrt a)=-2a\sqrt a$이므로 구하는 값은 $c=2a\sqrt a$이다.
      criteria:
      - 1.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
