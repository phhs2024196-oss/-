      points: 4
      evidence: 적분식 설정과 부정적분
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $S=\dfrac{27}{4}a^2$
      depends_on:
      - 2.M2
      steps:
      - 2b-3
