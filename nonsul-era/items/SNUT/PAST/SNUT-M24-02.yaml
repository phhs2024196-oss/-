- id: '2'
  stem: 문항 [2.1]에서 구한 $c$에 대하여, 직선 $y=c$와 곡선 $y=f(x)$로 둘러싸인 도형의 넓이 $S$를 $a$에 관한 식으로 나타내시오.
  points: 11
  depends_on:
  - '1'
  answer: {kind: expression, value: 27*a**2/4, equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.2]
    steps:
    - id: 2b-1
      content: 직선 $y=2a\sqrt a$와 곡선 $y=f(x)$의 교점의 $x$좌표는 $x^3-3ax-2a\sqrt a=(x+\sqrt a)^2(x-2\sqrt a)=0$으로부터 $x=-\sqrt a$ 또는 $x=2\sqrt a$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 이 구간에서 직선 $y=2a\sqrt a$가 곡선 $y=f(x)$보다 위쪽에 위치하므로 $S=\displaystyle\int_{-\sqrt a}^{2\sqrt a}\left(2a\sqrt a-(x^3-3ax)\right)dx=\left[2a\sqrt ax-\dfrac{x^4}4+\dfrac{3ax^2}2\right]_{-\sqrt a}^{2\sqrt a}$
      criteria:
      - 2.M2
    - id: 2b-3
      content: $=\dfrac{27}4a^2$이다.
      criteria:
      - 2.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 2.M1
