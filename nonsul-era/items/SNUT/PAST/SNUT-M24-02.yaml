- id: '3'
  stem: 문항 [2.2]에서 구한 $S$에 대하여, $3\le a\le5$인 범위에서 $\dfrac{4S}{27(a-2)^2(6-a)}$의 최솟값을 구하시오.
  points: 11
  depends_on:
  - '2'
  answer: {kind: value, value: '2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3~4 [2.3]
    steps:
    - id: 3b-1
      content: $g(x)=\dfrac{x^2}{(x-2)^2(6-x)}$의 최솟값을 구간 $3\le x\le5$에서 구하면 된다. 함수 $y=g(x)$가 닫힌구간에서 연속이므로 최솟값은 구간의 양 끝점 혹은 $g'(x)=0$을 만족하는 점에서의 함숫값 중 가장 작은 값이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: $g'(x)=\dfrac{2x(x-2)^2(6-x)-x^2\{2(x-2)(6-x)-(x-2)^2\}}{(x-2)^4(6-x)^2}=\dfrac{x(x^2+2x-24)}{(x-2)^3(6-x)^2}=\dfrac{x(x+6)(x-4)}{(x-2)^3(6-x)^2}$이므로 $g'(x)=0$을 만족하는 값은 구간 $3\le x\le5$ 내에서 $x=4$ 뿐이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: 그러므로 $g(3)=3$, $g(4)=2$, $g(5)=\dfrac{25}{9}$ 중 가장 작은 값인 $2$가 최솟값이다.
      criteria:
      - 3.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: $g(x)=\dfrac{x^2}{(x-2)^2(6-x)}$로 정리, 최솟값 후보 설정
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: $g'(x)=\dfrac{x(x+6)(x-4)}{(x-2)^3(6-x)^2}$, $x=4$
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: 최솟값 $2$
      depends_on:
      - 3.M2
      steps:
      - 3b-3
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 타당한 설명 없이 답만 기술
