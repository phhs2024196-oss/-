stimuli:
- label: 가
  body: 함수 $f(x)=\dfrac{\cos x}{x^2}$ $(x>0)$에 대하여 곡선 $y=f(x)$와 $x$축의 교점을 $x$좌표가 작은 것부터 차례대로 $\mathrm{P}_1(x_1,0),\mathrm{P}_2(x_2,0),\mathrm{P}_3(x_3,0),\cdots$이라고 하자. 또 $n=1,2,3,\cdots$에 대하여 점 $\mathrm{P}_n$에서 곡선 $y=f(x)$의 접선이 $y$축과 만나는 점을 $\mathrm{Q}_n(0,y_n)$이라고 하자.
stem: 다음 제시문을 읽고 물음에 답하시오.
