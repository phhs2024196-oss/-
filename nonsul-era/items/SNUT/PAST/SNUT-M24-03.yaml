- id: '2'
  stem: $n=1,2,3,\cdots$에 대하여 $y_n$을 구하시오.
  points: 8
  depends_on:
  - '1'
  answer: {kind: expression, value: (-1)**(n-1)*2/((2*n-1)*pi), equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [3.2]
    steps:
    - id: 2b-1
      content: $f(x)$를 미분하면 $f'(x)=-\dfrac{\sin x}{x^2}-\dfrac{2\cos x}{x^3}$이므로 $f'(x_n)=\dfrac{-\sin x_n}{x_n^2}-\dfrac{2\cos x_n}{x_n^3}=-\dfrac{\sin x_n}{x_n^2}=-\left(\dfrac2{(2n-1)\pi}\right)^2\sin\dfrac{(2n-1)\pi}2$이고, 사인값을 계산하면 $f'(x_n)=\begin{cases}-\left(\dfrac2{(2n-1)\pi}\right)^2&(n=1,3,5,\cdots)\\\left(\dfrac2{(2n-1)\pi}\right)^2&(n=2,4,6,\cdots)\end{cases}$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서 $n=1,3,5,\cdots$일 때 점 $\mathrm{P}_n$에서 곡선 $y=f(x)$의 접선의 방정식은 $y=-\left(\dfrac2{(2n-1)\pi}\right)^2\left(x-\dfrac{(2n-1)\pi}2\right)$이고 이 직선의 $y$절편은 $y_n=\dfrac2{(2n-1)\pi}$이다. 또 $n=2,4,6,\cdots$일 때 접선의 방정식은 $y=\left(\dfrac2{(2n-1)\pi}\right)^2\left(x-\dfrac{(2n-1)\pi}2\right)$이고 이 직선의 $y$절편은 $y_n=-\dfrac2{(2n-1)\pi}$이다. 따라서 $y_n=\begin{cases}\dfrac2{(2n-1)\pi}&(n=1,3,5,\cdots)\\-\dfrac2{(2n-1)\pi}&(n=2,4,6,\cdots)\end{cases}$이다.
      criteria:
      - 2.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: $f'(x)$와 $f'(x_n)$을 홀짝으로 구분하여 구함
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $y_n$을 $n$이 홀수/짝수로 나누어 서술
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: $n=1,2,3,\cdots$에 대하여 삼각형 $\mathrm{P}_n\mathrm{P}_{n+1}\mathrm{Q}_n$의 넓이를 $A_n$이라고 할 때, $\displaystyle\sum_{n=1}^{10}A_nA_{n+1}$의 값을 구하시오.
  points: 8
  depends_on:
  - '2'
  answer: {kind: value, value: 10/21, equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.3]
    steps:
    - id: 3b-1
      content: 두 점 $\mathrm{P}_n$과 $\mathrm{P}_{n+1}$ 사이의 거리는 $\pi$이므로 $A_n=\dfrac12\times\pi\times\dfrac2{(2n-1)\pi}=\dfrac1{2n-1}$이고 $\displaystyle\sum_{n=1}^{10}A_nA_{n+1}=\sum_{n=1}^{10}\dfrac1{(2n-1)(2n+1)}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 부분분수로 바꾸어 계산하면 $\displaystyle\sum_{n=1}^{10}A_nA_{n+1}=\sum_{n=1}^{10}\dfrac12\left(\dfrac1{2n-1}-\dfrac1{2n+1}\right)=\dfrac12\left\{\left(1-\dfrac13\right)+\left(\dfrac13-\dfrac15\right)+\cdots+\left(\dfrac1{19}-\dfrac1{21}\right)\right\}=\dfrac{10}{21}$이다.
      criteria:
      - 3.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: $A_n=\dfrac1{2n-1}$
      steps:
      - 3b-1
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: 부분분수 합 $\dfrac{10}{21}$
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 타당한 설명 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '4'
  stem: 문항 [3.3]에서 구한 $A_n$에 대하여 급수 $\displaystyle\sum_{n=1}^{\infty}A_nA_{n+1}$의 합을 구하시오.
  points: 9
  depends_on:
  - '3'
  answer: {kind: value, value: 1/2, equivalents: [], tolerance: null}
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.4]
    steps:
    - id: 4b-1
      content: 부분합을 구하면 $S_n=\displaystyle\sum_{k=1}^{n}\dfrac1{(2k-1)(2k+1)}=\sum_{k=1}^{n}\dfrac12\left(\dfrac1{2k-1}-\dfrac1{2k+1}\right)=\dfrac n{2n+1}$이다.
      criteria:
      - 4.M1
    - id: 4b-2
      content: 이므로 $\displaystyle\sum_{n=1}^{\infty}A_nA_{n+1}=\lim_{n\to\infty}\dfrac n{2n+1}=\dfrac12$이다.
      criteria:
      - 4.A1
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - id: 4.M1
      mark_type: M
      points: 5
      evidence: 부분합 $S_n=\dfrac n{2n+1}$
      steps:
      - 4b-1
    - id: 4.A1
