key_idea: $x_n=\dfrac{(2n-1)\pi}2$, $f(x_n)=0$이므로 접선은 $y=f'(x_n)(x-x_n)$이고 $y_n=(-1)^{n-1}\dfrac2{(2n-1)\pi}$. $A_n=\dfrac1{2n-1}$, 부분분수로 $\sum_{n=1}^{10}=\dfrac{10}{21}$, 무한급수 $\dfrac12$.
stuck: '[3.2] $\sin x_n=(-1)^{n-1}$로 접선의 기울기 부호가 번갈아 바뀜을 처리하는 단계, [3.3] $\mathrm{P}_n\mathrm{P}_{n+1}=\pi$를 밑변, $\lvert y_n\rvert$를 높이로 하는 넓이 계산'
