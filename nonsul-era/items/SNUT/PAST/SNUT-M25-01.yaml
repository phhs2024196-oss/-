intent: |
  대학에서 배우는 수학 및 수학의 활용을 이해하기 위해서는 고등학교 교육과정의 기본적인 내용을 이해하고 있는지 평가하고자 하였다. 특히 수열의 극한을 바탕으로 한 정적분의 정의, 미분을 통한 함수의 증가와 감소 구간의 분석, 수열의 성질과 극한의 개념을 이해하는지 본다. [1.1] 정적분과 급수의 관계를 이해하고 간단한 함수의 정적분을 계산하는지, [1.2] 도함수로 함수의 증감을 조사하고 부등식의 풀이에 적용하는지, [1.3] 등차수열의 성질과 극한의 개념으로 주어진 관계식을 분석하는지 평가한다. (출제배경)
key_idea: |
  [1.1] 로그의 성질로 $a_n=\dfrac1n\sum\ln\left(1+\dfrac kn\right)$로 바꾸어 정적분 $\displaystyle\int_0^1\ln(1+x)\,dx=2\ln2-1$. [1.2] $f'(x)=\dfrac{1-\ln x}{x^2}$로 $x=e$ 전후의 증감을 조사하고 $f(a)>f(b)$를 로그 부등식으로 바꾼다. [1.3] 등차수열의 일반항과 합으로 극한을 $\dfrac{d_1^2}{d_2^2}$로 정리한다.
stuck: |
  [1.1] 곱을 로그의 합으로 바꾸고 $\dfrac1n\sum f\left(\dfrac kn\right)$ 꼴을 정적분으로 인식하는 단계. [1.2] $f(a)>f(b)$에서 $\ln b>\ln a>0$를 이용해 $\dfrac ab$와 $\dfrac{\ln a}{\ln b}$ 비교로 바꾸는 단계. [1.3] 분모의 $b_{n+2}-b_n=2d_2$와 $S_n$의 최고차항을 정리하는 단계.
