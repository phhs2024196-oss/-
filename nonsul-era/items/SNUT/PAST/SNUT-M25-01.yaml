subparts:
- id: '1'
  stem: |
    자연수 $n$에 대하여
    $$a_n=\dfrac1n\ln\left(1+\dfrac1n\right)\left(1+\dfrac2n\right)\cdots\left(1+\dfrac nn\right)$$
    이라고 할 때, 극한 $\displaystyle\lim_{n\to\infty}a_n$의 값을 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정(34점을 11·11·12로 균등 추정)
  depends_on: []
  answer: {kind: value, value: '2*log(2)-1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.1]
    steps:
    - id: 1b-1
      content: |
        로그의 성질에 의하여
        $$a_n=\dfrac1n\left\{\ln\left(1+\dfrac1n\right)+\ln\left(1+\dfrac2n\right)+\cdots+\ln\left(1+\dfrac nn\right)\right\}=\dfrac1n\sum_{k=1}^n\ln\left(1+\dfrac kn\right)$$
        이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        적분과 급수의 관계로부터
        $$\lim_{n\to\infty}a_n=\lim_{n\to\infty}\dfrac1n\sum_{k=1}^n\ln\left(1+\dfrac kn\right)=\int_0^1\ln(1+x)\,dx\ \left(=\int_1^2\ln x\,dx\right)=2\ln2-1$$
        이다. (보충: $\displaystyle\int_1^2\ln x\,dx=\Big[x\ln x-x\Big]_1^2=2\ln2-1$)
      criteria: [1.M2, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 3, evidence: '곱을 로그의 합으로 바꾸어 $a_n=\dfrac1n\displaystyle\sum_{k=1}^n\ln\left(1+\dfrac kn\right)$로 적었다.', steps: [1b-1]}
    - {id: 1.M2, mark_type: M, points: 4, evidence: '구분구적법으로 $\displaystyle\int_0^1\ln(1+x)\,dx$로 바꾸었다.', depends_on: [1.M1], steps: [1b-2]}
    - {id: 1.A1, mark_type: A, points: 4, evidence: '정적분을 계산해 $2\ln2-1$을 구했다.', depends_on: [1.M2], steps: [1b-2]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    함수 $f(x)=\dfrac{\ln x}x$, $x>0$가 증가하는 구간과 감소하는 구간을 구하시오. 그리고 이를 이용하여 $e<a<b$인 상수 $a$와 $b$에 대하여, $\dfrac{\ln a}{\ln b}$와 $\dfrac ab$의 대소 관계를 밝히시오.
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: expression, value: '증가 0<x<e, 감소 x>e; a/b<log(a)/log(b)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.2]
    steps:
    - id: 2b-1
      content: |
        $f'(x)=\dfrac{1-\ln x}{x^2}$이므로 $x>e$이면 $f'(x)<0$이고 $0<x<e$이면 $f'(x)>0$이다. 따라서 $x>e$인 범위에서 $f(x)$는 감소하고, $0<x<e$인 범위에서 함수는 증가한다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $e<a<b$이므로 $f(a)>f(b)$가 성립하고, $f(a)=\dfrac{\ln a}a>\dfrac{\ln b}b=f(b)$이고, $\ln b>\ln a>0$이므로 $\dfrac ab<\dfrac{\ln a}{\ln b}$가 성립한다.
      criteria: [2.M2, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 5, evidence: '$f''(x)=\dfrac{1-\ln x}{x^2}$으로 증가 구간 $(0,e)$, 감소 구간 $(e,\infty)$를 구했다.', steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 3, evidence: '$e<a<b$에서 $f(a)>f(b)$를 쓰고 $\ln b>\ln a>0$임을 이용해 변형했다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 3, evidence: '$\dfrac ab<\dfrac{\ln a}{\ln b}$를 구했다.', depends_on: [2.M2], steps: [2b-2]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    공차가 각각 $d_1$과 $d_2$인 등차수열 $\{a_n\}$, $\{b_n\}$에 대하여 수열 $\{b_n\}$의 첫째항부터 제$n$항까지의 합을 $S_n$이라 하자.
    $$\lim_{n\to\infty}\dfrac{a_n^2}{(b_{n+2}-b_n)S_n}=27$$
    일 때, $\dfrac{d_1}{d_2}$의 값을 구하시오. (단, $d_1>0$, $d_2>0$)
  points: 12   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: value, value: '3*sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2~3 [1.3]
    steps:
    - id: 3b-1
      content: |
        등차수열 $\{a_n\}$과 $\{b_n\}$의 일반항은 $a_n=a_1+(n-1)d_1$, $b_n=b_1+(n-1)d_2$이다. 수열 $\{b_n\}$의 첫째항부터 제$n$항까지의 합 $S_n$과 $b_{n+2}-b_n$은
        $$S_n=\dfrac n2(b_1+b_n)=\dfrac n2\{2b_1+(n-1)d_2\},\qquad b_{n+2}-b_n=2d_2$$
        이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        주어진 식에 대입하여 정리하면
        $$\lim_{n\to\infty}\dfrac{\{a_1+(n-1)d_1\}^2}{2d_2\cdot\dfrac n2\{2b_1+(n-1)d_2\}}=\lim_{n\to\infty}\dfrac{n^2\left\{\dfrac{a_1}n+\left(1-\dfrac1n\right)d_1\right\}^2}{n^2d_2\left\{\dfrac{2b_1}n+\left(1-\dfrac1n\right)d_2\right\}}=\dfrac{d_1^2}{d_2^2}=27$$
        이때, $d_1>0$, $d_2>0$이므로 $\dfrac{d_1}{d_2}=3\sqrt3$이다.
      criteria: [3.M2, 3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 3.M1, mark_type: M, points: 4, evidence: '$a_n$, $S_n$, $b_{n+2}-b_n=2d_2$를 등차수열의 성질로 적었다.', steps: [3b-1]}
    - {id: 3.M2, mark_type: M, points: 5, evidence: '$n^2$으로 묶어 극한을 계산해 $\dfrac{d_1^2}{d_2^2}=27$을 얻었다.', depends_on: [3.M1], steps: [3b-2]}
    - {id: 3.A1, mark_type: A, points: 3, evidence: '$d_1,d_2>0$에서 $\dfrac{d_1}{d_2}=3\sqrt3$을 구했다.', depends_on: [3.M2], steps: [3b-2]}
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
