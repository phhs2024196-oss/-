stimuli:
- label: 가   # 원문에는 라벨이 없는 단일 제시문 상자
  body: |
    다음과 같이 정의된 두 함수가 있다.
    $$f(x)=\dfrac{5^x}{1+5^x}-\dfrac12,\qquad g(x)=mx\ (\text{단, }m>0)$$

stem: |
  다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    곡선 $y=f(x)$의 그래프가 원점에 대해서 대칭임을 보이시오.
  points: 11   # 소문항 배점 미공개 — 추정(33점을 11점씩 균등 추정)
  depends_on: []
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.1]
    steps:
    - id: 1b-1
      content: |
        곡선 $y=f(x)$가 원점에 대해서 대칭일 필요충분조건은 $f(-x)=-f(x)$가 성립하는 것이다. 여기서
        $$f(-x)=\dfrac{5^{-x}}{1+5^{-x}}-\dfrac12=\dfrac1{1+5^x}-\dfrac12=\dfrac{1+5^x-5^x}{1+5^x}-\dfrac12=\dfrac12-\dfrac{5^x}{1+5^x}=-f(x)$$
        가 성립하므로 $y=f(x)$의 그래프는 원점에 대해서 대칭이다.
      criteria: [1.M1, 1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 6, evidence: '원점대칭의 필요충분조건 $f(-x)=-f(x)$를 적고 $f(-x)$를 $5^x$로 정리했다.', steps: [1b-1]}
    - {id: 1.R1, mark_type: R, points: 5, evidence: '$f(-x)=-f(x)$를 보이고 원점대칭이라고 결론지었다.', depends_on: [1.M1], steps: [1b-1]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    곡선 $y=f(x)$의 그래프와 직선 $y=g(x)$의 그래프가 세 점에서 만나기 위한 $m$의 범위를 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: ['1']
  answer: {kind: expression, value: '0<m<log(5)/4', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3~4 [2.2]
    steps:
    - id: 2b-1
      content: |
        $h(x)=f(x)-g(x)$라고 놓으면 $h(x)=0$을 만족하는 $x$가 세 개임을 보이면 된다. $y=h(x)$의 그래프는 원점대칭이므로 원점을 지나고, $h(x)=0$을 만족하는 $x$가 $x>0$인 범위에서 오직 하나뿐임을 보이면 충분하다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        이때
        $$h'(x)=\dfrac{(\ln5)5^x}{(1+5^x)^2}-m,\qquad h''(x)=-\dfrac{(\ln5)^2(5^x-1)5^x}{(1+5^x)^3}$$
        이다. 여기서 $x>0$인 범위에서 $h''(x)<0$이므로 $h'(x)$는 $x>0$인 범위에서 감소한다. 또한 $\displaystyle\lim_{x\to\infty}h'(x)=-m<0$이므로 $h'(0)=\dfrac14\ln5-m>0$이면 $y=h(x)$는 $x>0$인 범위에서 $h'(x)=0$을 만족하는 $x=x_0$ ($x_0>0$)이 유일하게 존재한다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $-\dfrac12<f(x)<\dfrac12$로부터, 함수 $h(x)$의 증감표는 다음과 같다.
        [표] $x$: $0$, $\cdots$, $x_0$, $\cdots$, $\dfrac1m$, $\cdots$ / $h'(x)$: $\dfrac14\ln5-m$, $+$, $0$, $-$, $-$, $-$ / $h(x)$: $0$, 증가, 극댓값 $>0$, 감소, $-$, 감소
        따라서 그래프의 개형으로부터 $y=h(x)$의 그래프는 $0<x<\dfrac1m$인 범위에서 $x$축과 단 한 번 만난다는 것을 알 수 있다.
      criteria: [2.M3]
    - id: 2b-4
      content: |
        한편, $m\ge\dfrac14\ln5$이면 $h'(0)\le0$이므로 $h(x)$가 $x>0$에서 감소함수이다. 그런데 $h(0)=0$이므로 $x>0$인 범위에서 $x$축과 만나지 않는다. 따라서 $0<m<\dfrac14\ln5$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 2, evidence: '$h=f-g$를 정의하고 원점대칭이므로 $x>0$에서 근이 하나임을 보이면 충분하다고 적었다.', steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 3, evidence: '$h''(x)$, $h''''(x)$를 구하고 $x>0$에서 $h''''<0$, $\displaystyle\lim_{x\to\infty}h''(x)=-m<0$을 이용해 $h''(0)>0$이면 $h''=0$인 $x_0>0$이 유일함을 보였다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.M3, mark_type: M, points: 3, evidence: '증감표(극댓값 $>0$)로 $x>0$에서 $h(x)=0$의 근이 단 하나임을 보였다.', depends_on: [2.M2], steps: [2b-3]}
    - {id: 2.A1, mark_type: A, points: 3, evidence: '$m\ge\dfrac14\ln5$이면 $x>0$에서 근이 없음을 보이고 $0<m<\dfrac14\ln5$를 구했다.', depends_on: [2.M3], steps: [2b-4]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
