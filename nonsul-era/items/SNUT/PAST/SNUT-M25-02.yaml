intent: |
  함수의 미분과 적분은 변화하는 현상을 수학적으로 설명하고 분석할 때 사용하는 필수적인 개념이다. 주어진 상황을 함수로 표현하고 원하는 정보를 얻기 위해서 미분 및 적분을 활용하는 능력을 평가한다. [2.1] 함수의 그래프의 대칭성을 이해하고 있는지, [2.2] 함수의 그래프의 대칭성과 미분을 활용하여 원하는 정보를 찾아낼 수 있는지, [2.3] 적분을 이용하여 필요한 값을 구할 수 있는지 평가한다. (출제배경)
key_idea: |
  $f(-x)=-f(x)$로 원점대칭을 보인다. $h(x)=f(x)-mx$도 원점대칭이므로 $x>0$에서 $h(x)=0$의 근이 정확히 하나일 조건을 찾는다. $h''<0$ ($x>0$)이고 $h'(0)=\dfrac14\ln5-m$이므로 $0<m<\dfrac14\ln5$. 도형의 넓이는 $\displaystyle\int_{-c}^c\dfrac{5^x}{1+5^x}dx=c$이므로 $c=2$, $m=\dfrac{f(2)}2=\dfrac3{13}$.
stuck: |
  [2.2] 교점 세 개를 원점대칭을 써서 "$x>0$에서 근이 오직 하나"로 바꾸고 $h'(0)$의 부호와 $h''<0$으로 근의 개수를 판정하는 단계. [2.3] $t=-x$ 치환으로 $\displaystyle\int_{-c}^0\dfrac{5^x}{1+5^x}dx=\int_0^c\dfrac1{1+5^t}dt$를 얻어 $\displaystyle\int_{-c}^c\dfrac{5^x}{1+5^x}dx=c$를 보이는 단계.
