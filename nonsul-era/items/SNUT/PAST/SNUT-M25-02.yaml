- id: '3'
  stem: |
    곡선 $y=f(x)$의 그래프와 직선 $y=g(x)$의 그래프가 세 점 $(a,ma)$, $(b,mb)$, $(c,mc)$에서 만나고, 직선 $x=a$, $y=-\dfrac12$, $x=c$ 및 곡선 $y=f(x)$로 둘러싸인 도형의 넓이가 2일 때, 실수 $m$의 값을 구하시오. (단, $a<b<c$)
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: ['1', '2']
  answer: {kind: value, value: '3/13', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [2.3]
    steps:
    - id: 3b-1
      content: |
        $y=f(x)$의 그래프와 $y=g(x)$의 그래프가 모두 원점대칭이므로 $a=-c$이다. 또한 $f(x)>-\dfrac12$로부터 문제에 제시된 도형의 넓이는 $\displaystyle\int_{-c}^c\dfrac{5^x}{1+5^x}dx$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $$\int_{-c}^c\dfrac{5^x}{1+5^x}dx=\int_{-c}^0\dfrac{5^x}{1+5^x}dx+\int_0^c\dfrac{5^x}{1+5^x}dx$$
        이고 우변의 첫 번째 적분에서 $t=-x$로 치환하면
        $$\int_{-c}^0\dfrac{5^x}{1+5^x}dx=\int_0^c\dfrac{5^{-t}}{1+5^{-t}}dt=\int_0^c\dfrac1{1+5^t}dt$$
        이 성립한다. 도형의 넓이가 2이므로
        $$\int_{-c}^c\dfrac{5^x}{1+5^x}dx=\int_0^c\dfrac1{1+5^x}dx+\int_0^c\dfrac{5^x}{1+5^x}dx=\int_0^c1\,dx=c=2$$
        이다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        따라서 $f(2)=\dfrac{25}{1+25}-\dfrac12=g(2)=2m$으로부터 $m=\dfrac3{13}$이다.
      criteria: [3.A1]
