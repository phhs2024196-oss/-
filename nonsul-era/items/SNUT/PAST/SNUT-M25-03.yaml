stimuli:
- label: 가   # 원문에는 라벨이 없는 단일 제시문 상자
  body: |
    아래 그림과 같이 중심이 점 $\mathrm{B}\left(\dfrac43,0\right)$이고 반지름의 길이가 1인 원 위에 있는 제1사분면의 한 점을 P라고 하자. $0<t<\dfrac43$에 대하여 $x$축 위의 한 점을 $\mathrm{A}\left(\dfrac43-t,0\right)$라 하고, $\theta=\angle\mathrm{ABP}$라고 하자. (단, $0<\theta<\dfrac\pi2$)
    [그림] 좌표평면에 원점 O, 중심이 B인 원(반지름 1)이 그려져 있다. $x$축 위에 왼쪽부터 O, A, B가 차례로 있고, 원 위의 제1사분면의 점 P가 있다. 선분 OP, 선분 AP, 선분 BP가 그려져 있다.

stem: |
  다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    $\overline{\mathrm{AP}}^2$과 $\overline{\mathrm{OP}}^2$을 $t$와 $\theta$를 이용하여 나타내시오.
  points: 11   # 소문항 배점 미공개 — 추정(33점을 11점씩 균등 추정)
  depends_on: []
  answer: {kind: expression, value: 'APsq=t**2+1-2*t*cos(theta); OPsq=25/9-8/3*cos(theta)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.1]
    steps:
    - id: 1b-1
      content: |
        $t=\overline{\mathrm{AB}}$이므로 코사인 법칙에 의하여 $\overline{\mathrm{AP}}^2=t^2+1-2t\cos\theta$이고
        $$\overline{\mathrm{OP}}^2=\left(\dfrac43\right)^2+1-\dfrac83\cos\theta=\dfrac{25}9-\dfrac83\cos\theta$$
        이다.
      criteria: [1.M1, 1.M2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 5, evidence: '삼각형 ABP에서 $\overline{\mathrm{AB}}=t$, $\overline{\mathrm{BP}}=1$로 코사인법칙을 써서 $\overline{\mathrm{AP}}^2=t^2+1-2t\cos\theta$를 구했다.', steps: [1b-1]}
    - {id: 1.M2, mark_type: M, points: 6, evidence: '삼각형 OBP에서 $\overline{\mathrm{OB}}=\dfrac43$, $\overline{\mathrm{BP}}=1$, $\angle\mathrm{OBP}$와 $\theta$의 관계를 고려해 $\overline{\mathrm{OP}}^2=\dfrac{25}9-\dfrac83\cos\theta$를 구했다.', steps: [1b-1]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    삼각형 PAB에 대하여 세 변의 길이의 제곱의 합을 $l_1$, $l_2=\overline{\mathrm{OP}}^2+\dfrac79$이라고 할 때, 점 A에 대하여 $l_1>l_2$가 되기 위한 $\cos\theta$의 범위를 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: ['1']
  answer: {kind: expression, value: '2/3<cos(theta)<1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5~6 [3.2]
    steps:
    - id: 2b-1
      content: |
        삼각형의 세 변의 길이의 제곱의 합은
        $$l_1=\overline{\mathrm{PA}}^2+\overline{\mathrm{AB}}^2+\overline{\mathrm{BP}}^2=t^2+1-2t\cos\theta+t^2+1=2t^2-2t\cos\theta+2$$
        이고
        $$l_2=\overline{\mathrm{OP}}^2+\dfrac79=\dfrac{32}9-\dfrac83\cos\theta$$
        이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 모든 점 A에 대하여 $l_1>l_2$가 되기 위해서는, $0<t<\dfrac43$에 대하여 $2t^2-2t\cos\theta+2>\dfrac{32}9-\dfrac83\cos\theta$ 또는
        $$t^2-t\cos\theta+\dfrac43\cos\theta-\dfrac79=\left(t-\dfrac12\cos\theta\right)^2-\dfrac14\cos^2\theta+\dfrac43\cos\theta-\dfrac79>0$$
        가 성립해야 한다. 그런데 $0<\theta<\dfrac\pi2$일 때 $0<\dfrac12\cos\theta<\dfrac12$이므로
        $$-\dfrac14\cos^2\theta+\dfrac43\cos\theta-\dfrac79>0$$
        즉, $\cos^2\theta-\dfrac{16}3\cos\theta+\dfrac{28}9<0$이면 된다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        인수분해하면 $\left(\cos\theta-\dfrac23\right)\left(\cos\theta-\dfrac{14}3\right)<0$이므로 $\dfrac23<\cos\theta<\dfrac{14}3$이다. 그런데 $\cos\theta<1$이므로 $\cos\theta$의 범위는 $\dfrac23<\cos\theta<1$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 3, evidence: '$l_1=2t^2-2t\cos\theta+2$, $l_2=\dfrac{32}9-\dfrac83\cos\theta$를 적었다.', depends_on: [1.M1], steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 5, evidence: '$t$에 대한 이차식을 완성제곱하고 꼭짓점 $t=\dfrac12\cos\theta$가 구간 $\left(0,\dfrac43\right)$ 안에 있음을 확인해 $\cos^2\theta-\dfrac{16}3\cos\theta+\dfrac{28}9<0$을 얻었다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 3, evidence: '이차부등식을 풀고 $\cos\theta<1$을 고려해 $\dfrac23<\cos\theta<1$을 구했다.', depends_on: [2.M2], steps: [2b-3]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    $\theta=\dfrac\pi6,\ \dfrac\pi4,\ \dfrac\pi3$ 중에서 문항 [3.2]의 조건을 만족하는 것을 모두 구하시오.
  points: 11   # 소문항 배점 미공개 — 추정
  depends_on: ['2']
  answer: {kind: set, value: 'pi/6, pi/4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.6 [3.3]
    steps:
    - id: 3b-1
      content: |
        $\theta=\dfrac\pi6,\dfrac\pi4,\dfrac\pi3$에 대해서 $\cos^2\theta$의 값을 구하면 각각 $\dfrac34,\dfrac12,\dfrac14$이다. 이 중 $\left(\dfrac23\right)^2$보다 큰 값은 $\dfrac34$와 $\dfrac12$이므로, 조건을 만족하는 $\theta$는 $\dfrac\pi6$와 $\dfrac\pi4$이다.
      criteria: [3.M1, 3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 3.M1, mark_type: M, points: 6, evidence: '각 $\theta$에서 $\cos\theta$(또는 $\cos^2\theta$)의 값을 구해 $\dfrac23$(또는 $\dfrac49$)와 비교했다.', depends_on: [2.A1], steps: [3b-1]}
    - {id: 3.A1, mark_type: A, points: 5, evidence: '조건을 만족하는 $\theta=\dfrac\pi6,\dfrac\pi4$를 구했다.', depends_on: [3.M1], steps: [3b-1]}
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
