intent: |
  기하적 대상을 삼각함수를 이용하여 표현하고, 이를 대수적으로 분석할 수 있는 능력은 이공계 대학과정을 공부하는 데 필수적인 능력이다. 특히 삼각함수, 부등식, 코사인 법칙 등에 관한 내용을 알고 있는지 평가하는 문제이다. 코사인 법칙을 활용하여 문제에서 요구되는 값을 표현하고, 간단한 이차부등식을 풀이할 수 있는지 평가한다. [3.1] 코사인 법칙을 적용할 수 있는지, [3.2] 주어진 정보를 삼각함수를 포함하는 부등식 문제로 변환할 수 있는지와 함께 간단한 부등식을 풀이할 수 있는지, [3.3] 삼각함수의 값을 구할 수 있는지 평가한다. (출제배경)
key_idea: |
  코사인법칙으로 $\overline{\mathrm{AP}}^2=t^2+1-2t\cos\theta$, $\overline{\mathrm{OP}}^2=\dfrac{25}9-\dfrac83\cos\theta$. $l_1-l_2>0$이 $0<t<\dfrac43$에서 항상 성립하려면 $t$에 대한 이차식의 최솟값 $-\dfrac14\cos^2\theta+\dfrac43\cos\theta-\dfrac79>0$이어야 하므로 $\dfrac23<\cos\theta<1$.
stuck: |
  [3.2] "모든 점 A에 대하여"를 "$0<t<\dfrac43$에서 $t$에 대한 이차식이 항상 양수"로 읽고 꼭짓점 $t=\dfrac12\cos\theta$가 구간 안에 있음을 확인해 최솟값을 $\cos\theta$의 부등식으로 바꾸는 단계.
