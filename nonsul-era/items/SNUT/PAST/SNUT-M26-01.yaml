- id: '2'
  stem: |
    첫째항부터 제4항까지의 합이 214, 첫째항부터 제6항까지의 합이 303인 등차수열의 제$n$항을 $a_n$이라 할 때
    $$S=\lvert a_1\rvert+\lvert a_2\rvert+\cdots+\lvert a_{40}\rvert$$
    의 값을 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: value, value: '1200', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.2]
    steps:
    - id: 2b-1
      content: |
        첫째항을 $a$, 공차를 $d$, 첫째항부터 제$n$항까지의 합을 $S_n$이라고 하면
        $$S_4=\dfrac{4(2a+3d)}2=214,\ 2a+3d=107,\qquad S_6=\dfrac{6(2a+5d)}2=303,\ 2a+5d=101$$
        이므로 $d=-3$, $a=58$이다. 일반항은 $a_n=58-3(n-1)=61-3n$이므로 $a_1=58,\ \cdots,\ a_{20}=1,\ a_{21}=-2,\ \cdots,\ a_{40}=-59$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서
        $$S=\lvert a_1\rvert+\lvert a_2\rvert+\cdots+\lvert a_{40}\rvert=(a_1+\cdots+a_{20})-(a_{21}+\cdots+a_{40})=\dfrac{20(58+1)}2-\dfrac{20(-2-59)}2=590+610=1200$$
        이다.
      criteria: [2.M2, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 4, evidence: '두 합의 조건에서 $a=58$, $d=-3$, $a_n=61-3n$을 구하고 $a_{20}>0>a_{21}$임을 확인했다.', steps: [2b-1]}
