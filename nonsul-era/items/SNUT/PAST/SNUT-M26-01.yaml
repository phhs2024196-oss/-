- id: '3'
  stem: |
    수열 $\{a_n\}$에 대하여 $\displaystyle\sum_{n=1}^{\infty}\left(a_n-\dfrac{2n^2+2n-1}{n^2+n}\right)=5$일 때, $\displaystyle\lim_{n\to\infty}\left\{a_n+\sum_{k=1}^{n}(a_k-2)\right\}$의 값을 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1~2 [1.3]
    steps:
    - id: 3b-1
      content: |
        급수와 수열의 극한 사이의 관계로부터 급수 $\displaystyle\sum_{n=1}^{\infty}\left(a_n-\dfrac{2n^2+2n-1}{n^2+n}\right)$가 수렴하면 $\displaystyle\lim_{n\to\infty}\left(a_n-\dfrac{2n^2+2n-1}{n^2+n}\right)=0$이므로,
        $$\lim_{n\to\infty}a_n=\lim_{n\to\infty}\left(a_n-\dfrac{2n^2+2n-1}{n^2+n}+\dfrac{2n^2+2n-1}{n^2+n}\right)=0+2=2$$
        이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $\displaystyle\sum_{n=1}^{\infty}\dfrac1{n(n+1)}=\sum_{n=1}^{\infty}\left(\dfrac1n-\dfrac1{n+1}\right)=\lim_{n\to\infty}\left(1-\dfrac1{n+1}\right)=1$이므로
        $$\lim_{n\to\infty}\left(\sum_{k=1}^n(a_k-2)\right)=\sum_{n=1}^{\infty}(a_n-2)=\sum_{n=1}^{\infty}\left(a_n-\dfrac{2n^2+2n}{n^2+n}\right)=\sum_{n=1}^{\infty}\left(a_n-\dfrac{2n^2+2n-1}{n^2+n}-\dfrac1{n^2+n}\right)=5-1=4$$
        이다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        따라서 $\displaystyle\lim_{n\to\infty}\left\{a_n+\sum_{k=1}^n(a_k-2)\right\}=\lim_{n\to\infty}a_n+\lim_{n\to\infty}\left(\sum_{k=1}^n(a_k-2)\right)=2+4=6$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 3.M1, mark_type: M, points: 3, evidence: '급수가 수렴하므로 일반항의 극한이 0임을 이용해 $\displaystyle\lim_{n\to\infty}a_n=2$를 구했다.', steps: [3b-1]}
    - {id: 3.M2, mark_type: M, points: 4, evidence: '$\dfrac1{n(n+1)}$의 급수의 합 1을 구하고 $\displaystyle\sum_{n=1}^{\infty}(a_n-2)=5-1=4$를 얻었다.', depends_on: [3.M1], steps: [3b-2]}
    - {id: 3.A1, mark_type: A, points: 3, evidence: '두 극한을 더해 $6$을 구했다.', depends_on: [3.M2], steps: [3b-3]}
