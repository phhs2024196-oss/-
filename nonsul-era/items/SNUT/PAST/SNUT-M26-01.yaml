- id: '4'
  stem: |
    곡선 $y=1-x^2$ ($x\ge0$)에 중심이 원점인 원이 제 1사분면에서 접하고 있다. 곡선과 원, $y$축으로 둘러싸인 부분의 넓이를 $S_1$, 곡선과 원, $x$축으로 둘러싸인 부분의 넓이를 $S_2$라고 할 때, $S_1+S_2$를 구하시오
    [그림] 제1사분면에 곡선 $y=1-x^2$ ($x\ge0$)이 $y$축 위의 점 $(0,1)$에서 $x$축 위의 점 $(1,0)$까지 그려져 있고, 원점 중심의 원이 이 곡선과 한 점에서 접한다. 접점 부근을 경계로 $y$축 쪽에 곡선과 원 사이의 부분 $S_1$(원 바깥, $y$축 가까이 곡선 아래 얇은 부분), $x$축 쪽에 곡선과 원 사이의 부분 $S_2$가 색칠되어 있다. 원은 $y$축과 $(0,1)$보다 아래 점에서, $x$축과 $(1,0)$보다 왼쪽 점에서 만난다.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: value, value: '2/3-3*pi/16', equivalents: [], tolerance: null}
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.4]
    steps:
    - id: 4b-1
      content: |
        곡선 $y=1-x^2$과 원 모두에 접하는 점을 $\mathrm{P}(t,1-t^2)$이라고 하면, 제1사분면에서 접하므로 $t>0$이다. 이 점에서 곡선 $y=1-x^2$의 접선의 기울기는 $-2t$이다. 또 선분 OP는 이 접선과 직교하며, 기울기는 $\dfrac{1-t^2}t$이므로
        $$\dfrac{1-t^2}t\times(-2t)=-1$$
        즉 $t=\dfrac1{\sqrt2}$이다. 따라서 $\mathrm{P}\left(\dfrac1{\sqrt2},\dfrac12\right)$이고 $\overline{\mathrm{OP}}=\dfrac{\sqrt3}2$이다.
      criteria: [4.M1]
    - id: 4b-2
      content: |
        구하고자 하는 영역은 제1사분면에서 포물선에 의해 둘러싸인 부분에서 사분원을 제외한 부분의 넓이가 된다.
        $$S_1+S_2=\int_0^1(1-x^2)\,dx-\dfrac14\pi\times\left(\dfrac{\sqrt3}2\right)^2=\dfrac23-\dfrac14\pi\times\dfrac34=\dfrac23-\dfrac{3\pi}{16}$$
      criteria: [4.M2, 4.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
