intent: |
  대학에서 이공계 교육과정을 이수하는 데 있어 수학적 모델링과 응용능력은 핵심적인 역량이다. 이에 본 문항은 고등학교 수학에서 다루는 기본적인 내용에 대한 이해도를 평가하고자 하였다. 구체적으로 고등학교 수학에서 배우는 순열과 조합, 수열, 수열의 극한, 도형의 방정식 등을 잘 알고 이를 문제풀이에 적용할 수 있는지 평가하고자 하였다. [1.1] 원에 내접하는 직각삼각형의 빗변은 반드시 원의 지름이 되어야 함을 이해하고, 조합을 이용해 조건을 만족하는 삼각형의 개수를 구하는지, [1.2] 등차수열의 일반항을 구하고 부분합을 계산하는지(각 항이 언제 양수이고 언제 음수인지 판별), [1.3] 급수의 수렴 조건과 부분분수를 이용한 합에 대한 이해를 바탕으로 주어진 정보를 변형하여 새로운 극한값을 구하는지, [1.4] 좌표평면에서 원과 직선의 위치관계를 이해하는지와 적분을 이용하여 곡선으로 둘러싸인 도형의 넓이를 구하는지 평가한다. (출제배경)
key_idea: |
  [1.1] 직각삼각형의 빗변은 지름이므로 지름 6개 × 나머지 점 10개 = 60. [1.2] $a=58$, $d=-3$, 부호가 바뀌는 항($a_{20}=1$, $a_{21}=-2$)에서 나누어 절댓값 합 1200. [1.3] 급수 수렴 → $\lim a_n=2$, $\sum(a_n-2)=5-\sum\dfrac1{n(n+1)}=4$, 합 6. [1.4] 접점 $t=\dfrac1{\sqrt2}$, 반지름 $\dfrac{\sqrt3}2$, $S_1+S_2=\displaystyle\int_0^1(1-x^2)dx-\dfrac14\pi\left(\dfrac{\sqrt3}2\right)^2$.
stuck: |
  [1.1] 직각삼각형이 되는 조건을 "한 변이 지름"으로 바꾸는 단계. [1.2] 절댓값 합을 부호가 바뀌는 지점에서 나누는 단계. [1.3] 급수가 수렴하면 일반항의 극한이 0임을 쓰고 $\dfrac1{n^2+n}$을 부분분수로 합하는 단계. [1.4] 곡선과 원이 접하는 조건(접선과 반지름의 수직)으로 접점을 정하고 $S_1+S_2$를 하나의 넓이 식으로 묶는 단계.
