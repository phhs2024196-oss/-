intent: |
  집합과 함수는 수학에서의 기본 언어이다. 주어진 수식을 만족하는 값을 구하기 위해 함수의 정의역, 치역 등에 대한 이해는 필수적이다. 두 함수의 그래프의 교점의 좌표를 이용하여 주어진 방정식의 해를 구하는 방법은 고교 과정에서 요구되는 해법 중 하나이다. 치역이 실수의 진부분집합인 두 함수가 있을 때 이 두 함수의 교점을 구하기 위해서는 먼저 두 함수의 치역들의 교집합을 알아야 한다. 본 문항에서는 절댓값을 포함한 함수와 삼각함수를 이용하여 문제에서 원하는 값을 수열과 같이 표현할 수 있고 이를 변형하여 얻은 수열의 부분합을 구할 수 있는지 평가하고자 하였다. [2.1] 절댓값을 포함하여 정의된 함수의 그래프를 구간에 따라 대응되는 함수를 찾을 수 있는지, [2.2] 코사인 함수의 정의를 알고 그 그래프와 치역을 알고 있는지, [2.3] 여러 가지 수열의 합을 구할 수 있는지 평가한다. (출제배경)
key_idea: |
  절댓값을 구간별로 풀어 $f(x)$가 $[-2n\pi,2n\pi]$에서 상수 1이고 그 밖에서는 1보다 크다는 것을 안다. $\cos x\le1$이므로 교점은 $f=1$인 구간에서 $\cos x=1$인 $x=2k\pi$ ($-n\le k\le n$)이므로 $a_n=2n+1$. $\displaystyle\sum_{n=1}^{26}\dfrac1{(2n+1)(2n+3)}$은 부분분수로 $\dfrac{26}{165}$.
stuck: |
  [2.2] $f(x)\ge1\ge\cos x$이므로 교점은 $f=1$이고 $\cos x=1$인 점뿐이라는 치역 비교의 발상 단계.
