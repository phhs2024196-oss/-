stimuli:
- label: 가   # 원문에는 라벨이 없는 단일 제시문 상자
  body: |
    자연수 $n$에 대하여 함수 $f(x)$가
    $$f(x)=\lvert x+2n\pi\rvert+\lvert x-2n\pi\rvert+1-4n\pi$$
    일 때, 두 함수 $y=f(x)$와 $y=\cos x$의 그래프가 만나는 점의 개수를 $a_n$이라고 하자.

stem: |
  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    함수 $f(x)$를 다음과 같이 구간을 이용하여 표현할 때 (ㄱ), (ㄴ), (ㄷ)에 알맞은 식을 구하시오.
    $$f(x)=\begin{cases}(\text{ㄱ})&(x<-2n\pi)\\(\text{ㄴ})&(-2n\pi\le x\le2n\pi)\\(\text{ㄷ})&(x>2n\pi)\end{cases}$$
  points: 10   # 소문항 배점 미공개 — 추정(30점을 10점씩 균등 추정)
  depends_on: []
  answer: {kind: expression, value: 'g1=-2*x+1-4*n*pi; g2=1; g3=2*x+1-4*n*pi', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.1]
    steps:
    - id: 1b-1
      content: |
        1) $x<-2n\pi$이면 $x+2n\pi<0$, $x-2n\pi<0$이므로 $f(x)=-x-2n\pi-x+2n\pi+1-4n\pi=-2x+1-4n\pi$. 따라서 (ㄱ)$=-2x+1-4n\pi$
      criteria: [1.B1]
    - id: 1b-2
      content: |
        2) $-2n\pi\le x\le2n\pi$이면 $x+2n\pi\ge0$, $x-2n\pi\le0$이므로 $f(x)=x+2n\pi-x+2n\pi+1-4n\pi=1$. 따라서 (ㄴ)$=1$
      criteria: [1.B2]
    - id: 1b-3
      content: |
        3) $x>2n\pi$이면 $x+2n\pi>0$, $x-2n\pi>0$이므로 $f(x)=x+2n\pi+x-2n\pi+1-4n\pi=2x+1-4n\pi$. 따라서 (ㄷ)$=2x+1-4n\pi$
        이므로
        $$f(x)=\begin{cases}-2x+1-4n\pi&(x<-2n\pi)\\1&(-2n\pi\le x\le2n\pi)\\2x+1-4n\pi&(x>2n\pi)\end{cases}$$
        이다.
      criteria: [1.B3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.B1, mark_type: B, points: 3, evidence: '(ㄱ) $-2x+1-4n\pi$', steps: [1b-1]}
    - {id: 1.B2, mark_type: B, points: 3, evidence: '(ㄴ) $1$', steps: [1b-2]}
    - {id: 1.B3, mark_type: B, points: 4, evidence: '(ㄷ) $2x+1-4n\pi$ (절댓값 부호 판단 과정 포함)', steps: [1b-3]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    수열 $a_n$의 일반항을 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: ['1']
  answer: {kind: expression, value: 'a_n=2*n+1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3~4 [2.2]
    steps:
    - id: 2b-1
      content: |
        모든 실수 $x$에 대해 $\cos x\le1$이다. [2.1]에 의해 $y=f(x)$는 $x<-2n\pi$이면 $f(x)=-2x+1-4n\pi>1$, $-2n\pi\le x\le2n\pi$이면 $f(x)=1$, $x>2n\pi$이면 $f(x)=2x+1-4n\pi>1$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        이므로 $y=f(x)$와 $y=\cos x$의 그래프가 만나려면 $-2n\pi\le x\le2n\pi$인 실수 $x$ 중 $\cos x=1$이 되는 $x$의 개수를 구하면 된다. 정수 $k$에 대해 $x=2k\pi$일 때 $\cos x=1$이므로 $-2n\pi\le2k\pi\le2n\pi\Rightarrow-n\le k\le n$인 정수 $k$는 모두 $2n+1$개이고 따라서 교점의 개수는 $2n+1$이다.
      criteria: [2.M2, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 4, evidence: '$\cos x\le1$과 [2.1]의 결과로 $-2n\pi\le x\le2n\pi$ 밖에서는 $f(x)>1$이라 교점이 없음을 밝혔다.', depends_on: [1.B1], steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 3, evidence: '구간 안에서 $\cos x=1$인 $x=2k\pi$, $-n\le k\le n$을 세었다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 3, evidence: '$a_n=2n+1$을 구했다.', depends_on: [2.M2], steps: [2b-2]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    $\displaystyle\sum_{n=1}^{26}\dfrac1{a_na_{n+1}}$의 값을 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: ['2']
  answer: {kind: value, value: '26/165', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [2.3]
    steps:
    - id: 3b-1
      content: |
        $$\sum_{n=1}^{26}\dfrac1{a_na_{n+1}}=\sum_{n=1}^{26}\dfrac1{(2n+1)(2n+3)}=\dfrac12\sum_{n=1}^{26}\left(\dfrac1{2n+1}-\dfrac1{2n+3}\right)$$
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $$=\dfrac12\left\{\left(\dfrac13-\dfrac15\right)+\left(\dfrac15-\dfrac17\right)+\cdots+\left(\dfrac1{53}-\dfrac1{55}\right)\right\}=\dfrac{26}{165}$$
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 3.M1, mark_type: M, points: 5, evidence: '$a_n=2n+1$을 대입하고 부분분수로 $\dfrac12\left(\dfrac1{2n+1}-\dfrac1{2n+3}\right)$로 분해했다.', depends_on: [2.A1], steps: [3b-1]}
    - {id: 3.A1, mark_type: A, points: 5, evidence: '소거하여 $\dfrac12\left(\dfrac13-\dfrac1{55}\right)=\dfrac{26}{165}$을 구했다.', depends_on: [3.M1], steps: [3b-2]}
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
