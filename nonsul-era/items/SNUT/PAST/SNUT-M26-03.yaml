intent: |
  제시문에 주어진 도형의 개형을 이해하고, 주어진 조건을 적절히 활용하여 필요한 결과를 수학적으로 도출할 수 있는 능력은 이공계 대학 교육을 받는 학생에게 필수적이다. 나머지 정리를 이용한 인수분해, 도함수와 접선의 방정식, 정적분을 이용한 곡선으로 둘러싸인 도형의 넓이 구하기 등의 개념은 본 문제를 풀기 위해 고등학생이 알아야 할 기본적인 내용이다. [3.1] 두 곡선의 접점에서 각 곡선의 접선이 같을 때 두 함수의 미정계수를 구하는지, [3.2] 도함수를 이용하여 접선의 방정식을 구하고 곡선과 직선의 교점을 구하는지, [3.3] 곡선과 직선으로 둘러싸인 도형을 이해하고 정적분을 이용하여 그 넓이를 구하는지 평가한다. (출제배경)
key_idea: |
  접점에서 $f'(2)=g'(2)$, $f(2)=g(2)$로 $a=1$, $b=-4$. 접선 $y=12x-16$과 $y=x^3$의 교점은 $x^3-12x+16=(x-2)^2(x+4)=0$에서 제3사분면의 점 $(-4,-64)$. 세 곡선으로 둘러싸인 도형의 넓이는 위쪽 경계가 $f$에서 $g$로 바뀌는 $x=-1$에서 나누어 $\displaystyle\int_{-4}^{-1}(f-l)\,dx+\int_{-1}^2(g-l)\,dx=\dfrac{405}4$.
stuck: |
  [3.3] 세 곡선의 위치 관계(구간 $[-4,-1]$에서는 $f$, $[-1,2]$에서는 $g$가 위쪽 경계)를 파악해 적분 구간을 나누는 단계.
