stimuli:
- label: 가   # 원문에는 라벨이 없는 단일 제시문 상자
  body: |
    두 함수 $f,\ g$에 대하여 $f(x)=ax^3$, $g(x)=3x^2+b$라고 하자 (단, $a,\ b$는 실수)

stem: |
  다음 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    곡선 $y=f(x)$ 위의 점 $(2,f(2))$에서의 접선과 곡선 $y=g(x)$ 위의 점 $(2,g(2))$에서의 접선이 같을 때, $a$와 $b$의 값을 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정(30점을 10점씩 균등 추정)
  depends_on: []
  answer: {kind: value, value: 'a=1; b=-4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [3.1]
    steps:
    - id: 1b-1
      content: |
        $f'(x)=3ax^2$이고 $g'(x)=6x$이므로 $x=2$일 때 접선의 기울기가 같으려면 $12a=12\Rightarrow a=1$이다.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        또 이때 $f(2)=g(2)$이어야 하므로 $8a=8=12+b\Rightarrow b=-4$이다.
      criteria: [1.M2, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 2, evidence: '$f''(2)=g''(2)$, 즉 $12a=12$를 세웠다.', steps: [1b-1]}
    - {id: 1.A1, mark_type: A, points: 3, evidence: '$a=1$을 구했다.', depends_on: [1.M1], steps: [1b-1]}
    - {id: 1.M2, mark_type: M, points: 2, evidence: '접점이 같아야 하므로 $f(2)=g(2)$, 즉 $8a=12+b$를 세웠다.', steps: [1b-2]}
    - {id: 1.A2, mark_type: A, points: 3, evidence: '$b=-4$를 구했다.', depends_on: [1.M2], steps: [1b-2]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    문항 [3.1]에서 구한 상수 $a$와 $b$에 대하여 $x=2$일 때의 접선의 방정식을 구하고, 이 접선과 곡선 $y=f(x)$가 제3사분면에서 만나는 점의 좌표를 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: ['1']
  answer: {kind: expression, value: 'y=12*x-16; (-4,-64)', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4~5 [3.2]
    steps:
    - id: 2b-1
      content: |
        문항 [3.1]에 의하여 $f(x)=x^3$이다. $x=2$에서의 접선의 기울기는 12이고 접점의 좌표는 $(2,8)$이므로 접선의 방정식은 $y=12(x-2)+8$, $y=12x-16$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 교점의 $x$좌표는 $x^3=12x-16$을 만족하므로 $x^3-12x+16=(x-2)^2(x+4)=0$이다. 따라서 제3사분면의 교점의 $x$좌표는 $-4$이고 교점의 좌표는 $(-4,-64)$이다.
      criteria: [2.M2, 2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 4, evidence: '접선의 방정식 $y=12x-16$을 구했다.', depends_on: [1.A1], steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 3, evidence: '$x^3-12x+16=(x-2)^2(x+4)=0$으로 인수분해했다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 3, evidence: '제3사분면의 교점 $(-4,-64)$를 구했다.', depends_on: [2.M2], steps: [2b-2]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    문항 [3.1]에서 구한 상수 $a,b$에 대하여 두 곡선 $y=f(x)$와 $y=g(x)$와 문항 [3.2]에서 구한 접선으로 둘러싸인 도형의 넓이를 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: ['1', '2']
  answer: {kind: value, value: '405/4', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.5 [3.3]
    steps:
    - id: 3b-1
      content: |
        문항 [3.1]에 의하여 $f(x)=x^3$, $g(x)=3x^2-4$이고 접선의 방정식은 $y=12x-16$이다. 두 곡선의 교점을 구하면 $x^3=3x^2-4$, $x^3-3x^2+4=(x-2)^2(x+1)=0$이므로 $x=-1,2$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        또 $-4\le x\le-1$일 때 $12x-16\le x^3\le3x^2-4$이고, $-1\le x\le2$일 때 $12x-16\le3x^2-4\le x^3$이다. 따라서 두 곡선과 접선으로 둘러싸인 영역의 넓이는
        $$\int_{-4}^{-1}(x^3-12x+16)\,dx+\int_{-1}^2(3x^2-4-12x+16)\,dx$$
      criteria: [3.M2]
    - id: 3b-3
      content: |
        $$=\Big[\dfrac14x^4-6x^2+16x\Big]_{-4}^{-1}+\Big[x^3-6x^2+12x\Big]_{-1}^{2}=\dfrac{405}4$$
        이다. (보충: 앞의 적분 $\dfrac{297}4$, 뒤의 적분 $27$)
      criteria: [3.A1]
