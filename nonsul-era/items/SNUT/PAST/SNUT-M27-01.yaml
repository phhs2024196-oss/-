subparts:
- id: '1'
  stem: |
    두 양수 $a,b$에 대하여 $(a+2b+1)^2-8ab+\dfrac{18}{a+2b}$이 최소가 되는 $a,b$의 값을 각각 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정(40점을 10점씩 균등 추정)
  depends_on: []
  answer: {kind: value, value: 'a=3/2; b=3/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1 [1.1]
    steps:
    - id: 1b-1
      content: |
        주어진 식을 전개하면
        $$(a+2b+1)^2-8ab+\dfrac{18}{a+2b}=(a-2b)^2+2(a+2b)+1+\dfrac{18}{a+2b}$$
        이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $a,b$가 양수이므로 $a+2b>0$이고 산술평균과 기하평균의 관계식에 의해서
        $$2(a+2b)+\dfrac{18}{a+2b}\ge2\sqrt{2(a+2b)\left(\dfrac{18}{a+2b}\right)}=12$$
        이고 등호는 $2(a+2b)=\dfrac{18}{a+2b}$일 때 생긴다. 또한 $(a-2b)^2\ge0$이므로 $(a-2b)^2+2(a+2b)+1+\dfrac{18}{a+2b}\ge13$이고, 이 식이 최솟값 13을 가지려면 $a-2b=0$, $2(a+2b)=\dfrac{18}{a+2b}$이어야 한다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 $a=2b$, $a+2b=3$이고, 두 식을 풀면 $a=\dfrac32$, $b=\dfrac34$이다.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 3, evidence: '$(a-2b)^2+2(a+2b)+1+\dfrac{18}{a+2b}$로 정리했다.', steps: [1b-1]}
    - {id: 1.M2, mark_type: M, points: 4, evidence: '산술·기하평균으로 $2(a+2b)+\dfrac{18}{a+2b}\ge12$와 $(a-2b)^2\ge0$를 쓰고 두 등호 조건을 함께 적었다.', depends_on: [1.M1], steps: [1b-2]}
    - {id: 1.A1, mark_type: A, points: 3, evidence: '$a=\dfrac32$, $b=\dfrac34$를 구했다.', depends_on: [1.M2], steps: [1b-3]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    자연수 $n$에 대하여 다항식 $(x+1^2)(x+2^2)(x+3^2)\cdots(x+n^2)$의 $x^{n-1}$의 계수를 $a_n$이라 하고, $b_n=\displaystyle\int_0^{(2n+1)^2\pi}x\cos\dfrac{x}{2n+1}\,dx$라 할 때, 극한 $\displaystyle\lim_{n\to\infty}\dfrac{nb_n}{a_n}$을 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: value, value: '-24', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.1~2 [1.2]
    steps:
    - id: 2b-1
      content: |
        $n$개의 인수 중에서 $(n-1)$개를 택하여 $x$끼리 곱하고 나머지 인수에서 상수항을 곱했을 때 $x^{n-1}$의 항이 생기므로
        $$a_n=1+2^2+3^2+\cdots+n^2=\dfrac{n(n+1)(2n+1)}6$$
        이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        부분적분하면
        $$b_n=\int_0^{(2n+1)^2\pi}x\cos\dfrac x{2n+1}dx=\Big[(2n+1)x\sin\dfrac x{2n+1}+(2n+1)^2\cos\dfrac x{2n+1}\Big]_0^{(2n+1)^2\pi}=(2n+1)^2\{\cos(2n+1)\pi-1\}=-2(2n+1)^2$$
        이다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        따라서
        $$\lim_{n\to\infty}\dfrac{nb_n}{a_n}=\lim_{n\to\infty}\dfrac{-2n(2n+1)^2}{\dfrac{n(n+1)(2n+1)}6}=\lim_{n\to\infty}\dfrac{-12(2n+1)}{n+1}=-24$$
        이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 3, evidence: '$a_n=\displaystyle\sum_{k=1}^nk^2=\dfrac{n(n+1)(2n+1)}6$을 구했다.', steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 4, evidence: '부분적분으로 $b_n=-2(2n+1)^2$을 구했다.', steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 3, evidence: '극한값 $-24$를 구했다.', depends_on: [2.M1, 2.M2], steps: [2b-3]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    상수 $a\ (0<a<5)$에 대하여 수직선 위를 움직이는 점 P의 시각 $t$에서의 속도가
    $$v(t)=-\dfrac{a}{(5-a)^2}t^2+a$$
    이다. 시각 $t=0$에서 $t=10-2a$까지 점 P가 움직인 거리를 최대로 하는 $a$의 값을 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: value, value: '5/2', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.3]
    steps:
    - id: 3b-1
      content: |
        점 P가 방향을 바꾸는 때는 $v(t)=-\dfrac a{(5-a)^2}t^2+a=0$, $t^2=(5-a)^2$ 즉, $t=5-a$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        점 P가 이동한 거리는 다음과 같다.
        $$S=\int_0^{5-a}\left\{-\dfrac a{(5-a)^2}t^2+a\right\}dt-\int_{5-a}^{10-2a}\left\{-\dfrac a{(5-a)^2}t^2+a\right\}dt=2a(5-a)=-2\left(a-\dfrac52\right)^2+\dfrac{25}2$$
        (보충: $T=5-a$로 놓으면 $\int_0^Tv\,dt=\dfrac{2aT}3$, $\int_T^{2T}v\,dt=-\dfrac{4aT}3$)
      criteria: [3.M2]
    - id: 3b-3
      content: |
        따라서 $a=\dfrac52$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 3.M1, mark_type: M, points: 3, evidence: '속도가 0이 되는 시각 $t=5-a$에서 방향이 바뀜을 밝혔다.', steps: [3b-1]}
    - {id: 3.M2, mark_type: M, points: 4, evidence: '부호가 바뀌는 시각에서 나누어 움직인 거리 $S=2a(5-a)$를 구했다.', depends_on: [3.M1], steps: [3b-2]}
    - {id: 3.A1, mark_type: A, points: 3, evidence: '이차함수의 최대로 $a=\dfrac52$를 구했다.', depends_on: [3.M2], steps: [3b-3]}
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '4'
  stem: |
    남학생 5명과 여학생 4명 중에서 6명을 선택하여 일렬로 세우려고 한다. 이때 다음 조건을 모두 만족시키는 경우의 수를 구하시오.
    - (가) 여학생 3명과 남학생 3명을 선택한다.
    - (나) 어느 두 여학생도 서로 이웃하지 않게 선다.
    - (다) 전체 9명의 학생 중 합창단원은 남학생 2명뿐이며, 합창단원은 많아야 1명까지만 선택될 수 있다.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: []
  answer: {kind: value, value: '4032', equivalents: [], tolerance: null}
  solutions:
  - id: S4-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.2 [1.4]
    steps:
    - id: 4b-1
      content: |
        먼저 여학생 3명과 남학생 3명을 선택한다. 남학생 5명 중 3명을 선택하는 경우의 수는 $_5\mathrm{C}_3$이고, 이 중에서 합창단원 2명이 모두 선택되는 경우는 나머지 남학생 3명 중 1명을 더 선택하는 경우이므로 $_3\mathrm{C}_1$이다. 따라서 조건 (다)를 만족하면서 남학생 3명을 선택하는 경우의 수는 $_5\mathrm{C}_3-{}_3\mathrm{C}_1=7$이다. 또 여학생 4명 중 3명을 선택하는 경우의 수는 $_4\mathrm{C}_3=4$이다.
      criteria: [4.M1]
    - id: 4b-2
      content: |
        이제 선택한 남학생 3명과 여학생 3명을 일렬로 세운다. 남학생 3명을 일렬로 세우는 경우의 수는 $3!=6$이다. 남학생 3명을 일렬로 세우면 여학생이 들어갈 수 있는 자리는 양끝과 남학생 사이를 합하여 4곳이다. (그림: 빈자리, 남, 빈자리, 남, 빈자리, 남, 빈자리 순서) 어느 두 여학생도 서로 이웃하지 않으려면 이 4곳 중 3곳을 선택하여 여학생을 한 명씩 세우면 되므로 이 경우의 수는 $_4\mathrm{P}_3=24$이다.
      criteria: [4.M2]
