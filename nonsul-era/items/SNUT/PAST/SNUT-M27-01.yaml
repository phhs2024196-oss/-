intent: |
  이공계 대학 교육과정을 이수하는 데 필요한 핵심 역량은 수학적 상황을 표현·수식화하고, 기본 개념을 바탕으로 해를 도출하는 능력이다. 이에 따라 본 문항에서는 고등학교 수학 과정의 핵심 개념인 부등식, 다항식, 극한, 속도와 거리, 정적분, 경우의 수를 올바르게 이해하고, 다양한 문제 상황에 유연하게 적용할 수 있는지를 검증하고자 하였다. [1.1] 주어진 식을 간단히 정리하고, 산술평균과 기하평균의 관계식을 활용하여 최솟값을 도출할 수 있는지, [1.2] 곱의 형태로 표현된 다항식에서 특정 항의 계수를 구하고, 삼각함수가 포함된 부분적분을 구하여 주어진 극한값을 계산할 수 있는지, [1.3] 속도와 거리의 관계를 이해하고, 문제에서 제시한 조건을 만족하는 특정 값을 구할 수 있는지, [1.4] 순열과 조합의 의미를 이해하고, 주어진 조건에 따라 경우를 나누어 세며 이웃하지 않게 배열하는 경우의 수를 구할 수 있는지 평가한다. (출제배경)
key_idea: |
  [1.1] $(a+2b+1)^2-8ab=(a-2b)^2+2(a+2b)+1$로 정리한 뒤 산술·기하평균으로 $2s+\dfrac{18}s\ge12$. [1.2] $x^{n-1}$의 계수 $a_n=\sum k^2$, 부분적분으로 $b_n=-2(2n+1)^2$. [1.3] 속도가 0이 되는 $t=5-a$에서 방향이 바뀌므로 거리 $=2a(5-a)$. [1.4] 선택(합창단원 제한)과 배열(이웃하지 않게)을 곱의 법칙으로 센다.
stuck: |
  [1.1] $(a+2b+1)^2-8ab$를 $(a-2b)^2$와 $a+2b$의 식으로 바꾸는 단계. [1.2] $x^{n-1}$의 계수가 "$n-1$개는 $x$, 나머지 하나는 상수항"에서 $\sum k^2$임을 보는 단계. [1.3] 속도의 부호가 바뀌는 시각을 경계로 거리를 나누는 단계. [1.4] 합창단원 조건을 여사건으로 처리하고 이웃하지 않는 배열을 "남학생 사이 빈자리 4곳 중 3곳"으로 바꾸는 단계.
