intent: |
  제시문에 설명한 도형에 대하여 충분히 이해하고, 주어진 조건을 적절히 활용하여 필요한 결과를 수학적으로 도출할 수 있는 능력은 이공계 대학 교육을 받는 학생에게 필수적인 능력이다. 이 문제에서 요구하는 핵심 개념은 삼각함수, 삼각형의 내심의 성질, 삼각함수 사이의 관계 등 고등학교 교육과정에서 다루는 기본적인 내용으로 구성되어 있다. [2.1] 삼각함수의 정의를 이용하여 주어진 성질을 만족하는 점의 좌표를 구할 수 있는지, [2.2] 삼각형의 내심의 성질을 이용하여 삼각형의 넓이를 표현하고, 삼각함수에 관한 식을 적절히 정리하고 간단히 나타낼 수 있는지, [2.3] 주어진 조건을 이용하여 사인과 코사인의 값을 구하고, 이를 바탕으로 탄젠트의 값을 구할 수 있는지 평가한다. (출제배경)
key_idea: |
  $\mathrm{P}(2\cos\theta,2\sin\theta)$. 삼각형 APB의 넓이를 직접($2\sin\theta\cos\theta$)과 내접원 반지름을 이용한 합($r\sin\theta+r\cos\theta+r$)으로 두 번 표현해 $r=\sin\theta+\cos\theta-1$. 내심 $\mathrm{C}(\cos\theta-\sin\theta+1,\sin\theta-\cos\theta+1)$이므로 $\overline{\mathrm{OC}}^2=4-4\sin\theta\cos\theta$에서 $\sin\theta\cos\theta=\dfrac3{10}$, $\sin\theta+\cos\theta=\dfrac4{\sqrt{10}}$이고 $\tan\theta=\dfrac13$.
stuck: |
  [2.2] 직각삼각형의 넓이를 "직각을 낀 두 변의 곱의 절반"과 "내접원 반지름 × 둘레의 절반" 두 가지로 쓰는 발상, 분모의 $\sin\theta+\cos\theta+1$을 $(\sin\theta+\cos\theta)^2-1$로 정리해 약분하는 단계. [2.3] $\overline{\mathrm{OC}}$로부터 $\sin\theta\cos\theta$, $\sin\theta+\cos\theta$를 얻어 이차방정식으로 $\sin\theta$, $\cos\theta$를 분리하는 단계.
idea_tags: [IDEA-INCIRCLE-AREA-TWO-WAYS, IDEA-SUM-PRODUCT-SIN-COS-QUADRATIC]
tags: [삼각함수의 정의, 삼각형의 내접원, 직각삼각형의 넓이, 사인·코사인의 합과 곱, 이차방정식의 근과 계수의 관계, '출제근거: 삼각함수(수학Ⅰ, 미래엔 2021 p.74~79)', '출제근거: 이차방정식의 근과 계수의 관계(수학, 비상 2021 p.52~54)', '출제근거: 두 점 사이의 거리(수학, 비상 2021 p.99~101)']
elements:
  materials:
  - '반지름 2, 중심 O인 원 위의 제1사분면의 점 P, P에서 $x$축·$y$축에 내린 수선의 발 A, B'
  - '$\angle\mathrm{ABP}=\theta$, 삼각형 ABP의 내심 C와 내접원의 반지름 $r$'
  - '$r=a\sin\theta+b\cos\theta+c$, $\overline{\mathrm{OC}}=\dfrac{\sqrt{70}}5$ ($0<\theta<\dfrac\pi4$)'
  concepts: [삼각함수의 정의(좌표), 직각삼각형의 넓이, 삼각형의 내접원과 넓이, 삼각함수 사이의 관계, 곱셈공식 $(\sin\theta+\cos\theta)^2=1+2\sin\theta\cos\theta$, 이차방정식의 근과 계수의 관계, 두 점 사이의 거리]
  tools:
  - '$\mathrm{P}(2\cos\theta,2\sin\theta)$, $\overline{\mathrm{AP}}=2\sin\theta$, $\overline{\mathrm{BP}}=2\cos\theta$, $\overline{\mathrm{AB}}=2$'
  - '$S=\dfrac12r(\overline{\mathrm{AP}}+\overline{\mathrm{BP}}+\overline{\mathrm{AB}})$ 와 $S=\dfrac12\overline{\mathrm{AP}}\cdot\overline{\mathrm{BP}}$'
  - '내심 $\mathrm{C}=(2\cos\theta-r,\ 2\sin\theta-r)$'
  - '$\sin\theta\cos\theta=\dfrac3{10}$, $\sin\theta+\cos\theta=\dfrac4{\sqrt{10}}$ → $t^2-\dfrac4{\sqrt{10}}t+\dfrac3{10}=0$'
  conditions:
  - '$0<\theta<\dfrac\pi4$ → $\sin\theta<\cos\theta$ (두 근 중 작은 것이 $\sin\theta$)'
  - '직각은 꼭짓점 P에서 (OAPB는 직사각형, $\overline{\mathrm{AB}}=\overline{\mathrm{OP}}=2$)'
  stimuli_used: [가, 나, 다]
  subpart_links: '[2.1]의 점 P → [2.2]의 $r$을 $\theta$로 표현 → [2.3]의 $r$로 내심 C의 좌표와 $\overline{\mathrm{OC}}$ 계산'

