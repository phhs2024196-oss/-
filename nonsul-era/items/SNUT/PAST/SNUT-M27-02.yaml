stimuli:
- label: 가
  body: |
    점 P는 반지름의 길이가 2이고 중심이 원점 O인 원 위의 제1사분면의 점이다.
- label: 나
  body: |
    점 A, B는 점 P에서 각각 $x$축과 $y$축에 내린 수선의 발이며 $\angle\mathrm{ABP}=\theta$이다.
- label: 다
  body: |
    삼각형 ABP의 내접원의 중심은 C이며 반지름의 길이는 $r$이다.
    [그림] 제1사분면에 중심이 원점 O인 반지름 2의 사분원 호가 그려져 있고($x$축·$y$축의 교점에 2 표시), 호 위에 점 P가 있다. P에서 $y$축으로 내린 수선의 발 B(P의 왼쪽, $y$축 위), $x$축으로 내린 수선의 발 A(P의 아래쪽, $x$축 위)가 있다. 선분 BP, 선분 PA, 선분 AB가 그려져 삼각형 ABP(P에서 직각)가 되고, 그 안에 내접원(중심 C, 반지름 $r$)이 그려져 있다. 점 B에서 선분 BA와 선분 BP가 이루는 각이 $\theta$로 표시되어 있다.

stem: |
  다음 제시문을 읽고 물음에 답하시오.

subparts:
- id: '1'
  stem: |
    점 P의 좌표를 $\theta$에 대한 식으로 나타내시오.
  points: 10   # 소문항 배점 미공개 — 추정(30점을 10점씩 균등 추정)
  depends_on: []
  answer: {kind: expression, value: 'x=2*cos(theta); y=2*sin(theta)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3 [2.1]
    steps:
    - id: 1b-1
      content: |
        $\angle\mathrm{POA}=\angle\mathrm{PBA}=\theta$이고 $\overline{\mathrm{OP}}=2$이므로 점 P의 좌표는 $(2\cos\theta,2\sin\theta)$이다.
        (보충: 사각형 OAPB는 직사각형이므로 $\overline{\mathrm{AB}}=\overline{\mathrm{OP}}$이고 $\angle\mathrm{PBA}=\angle\mathrm{BAO}=\angle\mathrm{POA}$)
      criteria: [1.M1, 1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 1.M1, mark_type: M, points: 5, evidence: '$\angle\mathrm{POA}=\theta$임을 보였다(또는 같은 취지의 설명).', steps: [1b-1]}
    - {id: 1.A1, mark_type: A, points: 5, evidence: '$\mathrm{P}(2\cos\theta,2\sin\theta)$를 구했다.', depends_on: [1.M1], steps: [1b-1]}
    deductions:
    - code: D1-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D1-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '2'
  stem: |
    $r$와 $\theta$가 $r=a\sin\theta+b\cos\theta+c$를 만족할 때, 상수 $a,b,c$의 값을 각각 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: ['1']
  answer: {kind: value, value: 'a=1; b=1; c=-1', equivalents: [], tolerance: null}
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.3~4 [2.2]
    steps:
    - id: 2b-1
      content: |
        $\triangle\mathrm{APB}$의 넓이를 $S$라 하자. $\overline{\mathrm{AP}}=2\sin\theta$, $\overline{\mathrm{BP}}=2\cos\theta$이므로 $S=2\sin\theta\cos\theta$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        또 $\overline{\mathrm{AB}}=2$이고 $S$는 $\triangle\mathrm{APC}$, $\triangle\mathrm{PBC}$, $\triangle\mathrm{BAC}$의 넓이의 합과 같으므로 $S=r\sin\theta+r\cos\theta+r$이다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        따라서
        $$r=\dfrac{2\sin\theta\cos\theta}{\sin\theta+\cos\theta+1}=\dfrac{2\sin\theta\cos\theta(\sin\theta+\cos\theta-1)}{(\sin\theta+\cos\theta)^2-1}=\sin\theta+\cos\theta-1$$
        이므로 $a=b=1$이고 $c=-1$이다.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 2.M1, mark_type: M, points: 3, evidence: '$\overline{\mathrm{AP}}=2\sin\theta$, $\overline{\mathrm{BP}}=2\cos\theta$로 $S=2\sin\theta\cos\theta$를 구했다.', depends_on: [1.A1], steps: [2b-1]}
    - {id: 2.M2, mark_type: M, points: 4, evidence: '내심 C로 삼각형을 셋으로 나누어 $S=r\sin\theta+r\cos\theta+r$을 세웠다.', depends_on: [2.M1], steps: [2b-2]}
    - {id: 2.A1, mark_type: A, points: 3, evidence: '$r=\sin\theta+\cos\theta-1$로 정리해 $a=b=1$, $c=-1$을 구했다.', depends_on: [2.M2], steps: [2b-3]}
    deductions:
    - code: D2-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D2-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
      value: 0
  outcome_codes:
  - {code: '20', meaning: 만점}
  misconceptions: []
- id: '3'
  stem: |
    $0<\theta<\dfrac\pi4$이고 $\overline{\mathrm{OC}}=\dfrac{\sqrt{70}}5$일 때, $\tan\theta$의 값을 구하시오.
  points: 10   # 소문항 배점 미공개 — 추정
  depends_on: ['2']
  answer: {kind: value, value: '1/3', equivalents: [], tolerance: null}
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 출제배경 및 해설 p.4 [2.3]
    steps:
    - id: 3b-1
      content: |
        문항 [2.2]에서 구한 $r$을 이용하여 점 C의 좌표를 $\theta$로 나타내면 $(2\cos\theta-r,\ 2\sin\theta-r)=(\cos\theta-\sin\theta+1,\ \sin\theta-\cos\theta+1)$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $$\overline{\mathrm{OC}}^2=(\cos\theta-\sin\theta+1)^2+(\sin\theta-\cos\theta+1)^2=-4\sin\theta\cos\theta+4=\dfrac{70}{25}$$
        이므로 $\sin\theta\cos\theta=\dfrac3{10}$이다. 또 $(\sin\theta+\cos\theta)^2=1+2\sin\theta\cos\theta=\dfrac{16}{10}$이고 $0<\theta<\dfrac\pi4$이므로 $\sin\theta+\cos\theta=\dfrac4{\sqrt{10}}$이다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        따라서 $\sin\theta$와 $\cos\theta$는 이차방정식 $t^2-\dfrac4{\sqrt{10}}t+\dfrac3{10}=\left(t-\dfrac1{\sqrt{10}}\right)\left(t-\dfrac3{\sqrt{10}}\right)=0$의 두 근이고, $0<\theta<\dfrac\pi4$에서 $\sin\theta<\cos\theta$이므로 $\sin\theta=\dfrac1{\sqrt{10}}$, $\cos\theta=\dfrac3{\sqrt{10}}$이다. 따라서 $\tan\theta=\dfrac13$이다.
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 1, isw: true}
    criteria:
    - {id: 3.M1, mark_type: M, points: 2, evidence: '내심의 좌표 $(\cos\theta-\sin\theta+1,\ \sin\theta-\cos\theta+1)$을 구했다.', depends_on: [2.A1], steps: [3b-1]}
    - {id: 3.M2, mark_type: M, points: 4, evidence: '$\overline{\mathrm{OC}}^2=4-4\sin\theta\cos\theta$에서 $\sin\theta\cos\theta=\dfrac3{10}$, $\sin\theta+\cos\theta=\dfrac4{\sqrt{10}}$를 구했다.', depends_on: [3.M1], steps: [3b-2]}
    - {id: 3.A1, mark_type: A, points: 4, evidence: '이차방정식으로 $\sin\theta=\dfrac1{\sqrt{10}}$, $\cos\theta=\dfrac3{\sqrt{10}}$를 구하고 $\tan\theta=\dfrac13$을 구했다.', depends_on: [3.M2], steps: [3b-3]}
    deductions:
    - code: D3-1
      condition: 단순한 계산 실수와 같은 사소한 실수(건당)
      effect: minus
      value: 1
    - code: D3-2
      condition: 풀이 과정 없이 답만 기술
      effect: zero
