intent: |
  이공계 대학 교육과정을 이수하는 데 필요한 역량은 주어진 조건을 해석하고, 수학적 개념을 연결하여 문제를 해결하는 능력이다. 본 문항에서는 로그의 성질, 접선의 기울기, 이차함수의 결정, 정적분을 이용한 넓이, 급수의 합을 단계적으로 활용할 수 있는지를 평가하고자 하였다. [3.1] 로그의 성질과 로그의 밑의 변환을 이용하여 주어진 방정식을 정리하고 이차방정식의 해를 구할 수 있는지, [3.2] 곡선 위의 점과 그 점에서의 접선의 기울기 조건을 해석하여 이차함수의 계수를 결정할 수 있는지, [3.3] 곡선과 $x$축으로 둘러싸인 도형의 넓이를 정적분으로 나타내고, 부분합을 이용하여 급수의 합을 구할 수 있는지 평가한다. (출제배경)
key_idea: |
  $4\log_4(1-r)=2\log_2(1-r)$로 밑을 통일하고 진수 조건 $-1<r<1$에서 $\dfrac{(1+r)(3-r)}{(1-r)^2}=15$, $r=\dfrac12$. $f\left(\dfrac12\right)=1$, $f'\left(\dfrac12\right)=0$으로 $f(x)=-4x^2+4x$. $S_n=\displaystyle\int_0^1x^nf(x)dx=4\left(\dfrac1{n+2}-\dfrac1{n+3}\right)$이므로 부분합이 소거되어 $\displaystyle\sum_{n=1}^{\infty}S_n=\dfrac43$.
stuck: |
  [3.1] $\log_4(1-r)$을 밑 2로 변환하고 진수 조건으로 $r$의 범위를 먼저 제한하는 단계. [3.2] "점 $(r,1)$에서의 접선의 기울기 0"을 $f(r)=1$, $f'(r)=0$ 두 식으로 옮기는 단계. [3.3] 구간 $0\le x\le1$에서 $f(x)\ge0$임을 확인하고 $S_n$을 부분분수 꼴로 정리하는 단계.
idea_tags: [IDEA-LOG-BASE-CHANGE-DOMAIN-QUADRATIC, IDEA-TANGENT-SLOPE-ZERO-VALUE-ONE, IDEA-TELESCOPING-INTEGRAL-SERIES]
