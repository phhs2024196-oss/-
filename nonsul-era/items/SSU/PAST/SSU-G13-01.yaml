- id: B1
  stem: |
    (1) 임의의 실수 $x$에 대하여 $f(x)=\displaystyle\int_2^x\sqrt{3+t^2}\,dt$이고, 그 역함수 $g(x)=f^{-1}(x)$라고 할 때, 미분계수 $g'(0)$을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1/sqrt(7)', equivalents: ['√7/7'], tolerance: null}
  solutions:
  - id: SB1-A
    audience: A
    method_no: 1
    key_idea: $f(2)=0\Rightarrow g(0)=2$, 대칭인 두 접선의 기울기는 역수이므로 $g'(0)=\dfrac1{f'(2)}=\dfrac1{\sqrt7}$.
    steps:
    - {id: b1a, content: '$g''(0)=\dfrac1{\sqrt7}$', criteria: [B1.M1, B1.M2, B1.A1]}
    hint_ladder:
    - $f(x)=0$이 되는 $x$는? 그것이 $g(0)$이다.
  - id: SB1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.108
    steps:
    - id: b1b-1
      content: |
        $f(2)=\int_2^2\sqrt{3+t^2}\,dt=0$이므로 $g(0)=2$이다.
      criteria: [B1.M1]
    - id: b1b-2
      content: |
        제시문에 의해 곡선 $y=f(x)$ 위의 점 $(2,0)$에서의 접선과 곡선 $y=g(x)$ 위의 점 $(0,2)$에서의 접선은 직선 $y=x$에 대하여 대칭이므로 $g'(0)=\dfrac1{f'(2)}$이다.
      criteria: [B1.M2]
    - id: b1b-3
      content: |
        미적분의 기본정리에 의해 $f'(x)=\sqrt{3+x^2}$이므로 $f'(2)=\sqrt7$, $g'(0)=\dfrac1{\sqrt7}$이다.
      criteria: [B1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: B1.M1
      mark_type: M
      points: 3
      evidence: $f(2)=0$에서 $g(0)=2$를 얻었다.
      steps: [b1b-1]
    - id: B1.M2
