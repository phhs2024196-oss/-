stimuli:
- label: 1-A 제시문
  body: |
    [문제1-A] 다음 제시문을 읽고 아래 논제에 답하시오 (30점)

    일반적으로 공장에서 사용하는 장비는 시간이 지날수록 운영유지비가 증가하므로 적당한 때에 교체하는 것이 경제적이다 장비의 교체시기를 결정할 때 고려해야 하는 비용에는 장비의 초기투자비와 운영유지비가 있다 초기투자비는 장비를 처음 도입하는데 사용되는 비용을 말하고 운영유지비는 장비를 운영하고 유지 보수하는데 드는 각종 비용을 의미한다 장비를 오래 사용할수록 연평균 초기투자비는 낮아지지만 장비의 노후화로 인해 연평균 운영유지비는 해가 갈수록 증가한다. 여기서 연평균 비용은 장비의 도입 시점을 포함하여 사용기간 $x$년 동안 발생하는 비용을 $x$로 나눈 것이다 이때 $x$는 양의 실수이다 장비의 연평균 총비용은 연평균 초기투자비와 연평균 운영유지비의 합이며 연평균 총비용을 최소화하는 장비의 수명을 경제수명이라 한다.

    어떤 장비의 초기투자비는 20이고 $x$ 년 동안 발생하는 운영유지비는 $\displaystyle\int_0^xf(t)\,dt$이다.
    $$f(t)=\begin{cases}6t&(t\le2)\\3t^2&(t>2)\end{cases}$$
    일 때 다음 물음에 답하시오
- label: 1-B 제시문
  body: |
    [문제1-B] 다음 제시문을 읽고 아래 논제에 답하시오 (20점)

    함수 $y=f(x)$의 그래프와 그 역함수 $y=f^{-1}(x)$의 그래프 사이의 관계는 다음과 같이 설명할 수 있다 점 $(a,b)$ 가 함수 $y=f(x)$의 그래프 위의 한 점이면 $b=f(a)$이다 역함수의 정의로부터 $a=f^{-1}(b)$ 이므로 점 $(b,a)$는 역함수 $y=f^{-1}(x)$ 의 그래프 위에 있다. 점 $(a,b)$ 와 점 $(b,a)$는 직선 $y=x$에 대하여 대칭이므로 <그림 1>과 같이 $y=f^{-1}(x)$ 의 그래프와 $y=f(x)$의 그래프는 직선 $y=x$에 대하여 서로 대칭인 위치에 놓여있음을 알 수 있다

    [그림 설명] <그림 1>: 증가하는 곡선 $y=f(x)$ 위의 점 $(a,b)$와, 직선 $y=x$에 대해 대칭인 곡선 $y=f^{-1}(x)$ 위의 점 $(b,a)$, 두 점을 잇는 $y=x$에 수직인 선분.

stem: |
  【문제 1】 [문제1-A], [문제1-B]의 물음에 답하시오.

subparts:
- id: A1
  stem: |
    (1) 이 장비를 $x$년 동안 사용할 때의 연평균 총비용 $S(x)$를 구하시오
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'Piecewise((20/x + 3*x, x <= 2), (24/x + x**2, True))', equivalents: [], tolerance: null}
  solutions:
  - id: SA1-A
    audience: A
    method_no: 1
    key_idea: $0<x\le2$이면 운영유지비 $3x^2$, $x>2$이면 $12+(x^3-8)=x^3+4$. $x$로 나누고 $\tfrac{20}x$를 더한다.
    steps:
    - {id: a1a, content: '$S(x)=\tfrac{20}x+3x\ (0<x\le2)$, $\tfrac{24}x+x^2\ (x>2)$', criteria: [A1.M1, A1.A1, A1.A2]}
    hint_ladder:
    - $x>2$이면 적분 구간을 $[0,2]$와 $[2,x]$로 나누자.
  - id: SA1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.106
    steps:
    - id: a1b-1
      content: |
        초기투자비는 20이므로 연평균 초기투자비는 $I(x)=\dfrac{20}x\ (x>0)$이다. $x$년 동안 운영유지비는 $\int_0^xf(t)\,dt$이므로
        (i) $0<x\le2$일 때 $\int_0^x6t\,dt=3x^2$이고 연평균 운영유지비는 $M(x)=\dfrac{3x^2}x=3x$이다.
      criteria: [A1.M1]
    - id: a1b-2
      content: |
        (ii) $x>2$일 때 운영유지비는 $\int_0^26t\,dt+\int_2^x3t^2\,dt=12+x^3-8=x^3+4$이므로 $M(x)=\dfrac{x^3+4}x=x^2+\dfrac4x$이다.
      criteria: [A1.A1]
    - id: a1b-3
      content: |
        연평균 총비용 $S(x)=I(x)+M(x)$이므로
        $$S(x)=\begin{cases}\dfrac{20}x+3x,&0<x\le2\\\dfrac{24}x+x^2,&x>2\end{cases}$$
      criteria: [A1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: A1.M1
      mark_type: M
      points: 3
      evidence: 연평균 초기투자비 $\tfrac{20}x$와 $0<x\le2$에서의 운영유지비 $3x^2$을 구했다.
      steps: [a1b-1]
    - id: A1.A1
      mark_type: A
      points: 4
      evidence: $x>2$에서 적분 구간을 나누어 운영유지비 $x^3+4$를 구했다.
      depends_on: [A1.M1]
      steps: [a1b-2]
    - id: A1.A2
      mark_type: A
      points: 3
      evidence: 두 구간의 $S(x)$를 모두 올바르게 썼다.
      depends_on: [A1.M1]
      steps: [a1b-3]
    deductions:
    - code: DA1-1
      condition: 정의역(구간) 표기 누락
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0827}
  misconceptions:
  - id: MC-CAL-0827
    outcome_code: '71'
    wrong_work: '$x>2$에서 운영유지비를 $\int_2^x3t^2\,dt=x^3-8$로만 계산해 $S=\tfrac{12}x+x^2$'
    detect_cue: $x>2$ 구간에 $\tfrac{12}x$ 또는 $x^3-8$
    feedback: 운영유지비는 0년부터 누적됩니다. $[0,2]$ 구간의 $\int_0^26t\,dt=12$를 더하세요.
    remedy: [RL-1]
- id: A2
  stem: |
    (2) 이 장비의 연평균 총비용 함수 $S(x)$의 $x=2$에서의 미분가능성에 대해 논하시오
  points: 10
  depends_on: [A1]
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: SA2-A
    audience: A
    method_no: 1
    key_idea: 좌극한 $\lim_{h\to0-}\dfrac{-4+3h}{2+h}=-2$, 우극한 $\lim_{h\to0+}\dfrac{-4+6h+h^2}{2+h}=-2$가 같으므로 미분가능, $S'(2)=-2$.
    steps:
    - {id: a2a, content: '좌·우 미분계수 모두 $-2$ → 미분가능', criteria: [A2.M1, A2.A1, A2.A2, A2.R1]}
    hint_ladder:
    - $S(2)=16$. 미분계수의 정의로 $h\to0-$, $h\to0+$를 따로 계산하자.
  - id: SA2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.106~107
    steps:
    - id: a2b-1
      content: |
        미분계수의 정의 $S'(2)=\displaystyle\lim_{h\to0}\dfrac{S(2+h)-S(2)}h$에 의해 미분가능성을 조사한다. $S(2)=10+6=16$. 좌극한을 구하면
        $$\lim_{h\to0-}\dfrac{\frac{20}{2+h}+3(2+h)-16}h=\lim_{h\to0-}\dfrac{-4+3h}{2+h}=-2.$$
      criteria: [A2.M1, A2.A1]
    - id: a2b-2
      content: |
        우극한을 구하면 ($2+h>2$이므로 아래 식을 씀)
        $$\lim_{h\to0+}\dfrac{\frac{24}{2+h}+(2+h)^2-16}h=\lim_{h\to0+}\dfrac{-4+6h+h^2}{2+h}=-2.$$
      criteria: [A2.A2]
    - id: a2b-3
      content: |
        좌극한과 우극한이 일치하므로 극한이 존재하여 함수 $S(x)$는 $x=2$에서 미분가능하고 $S'(2)=-2$이다. ■
        ([별해] $\displaystyle\lim_{x\to2-}\dfrac{S(x)-S(2)}{x-2}$, $\displaystyle\lim_{x\to2+}\dfrac{S(x)-S(2)}{x-2}$를 계산해도 모두 $-2$.)
      criteria: [A2.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: A2.M1
      mark_type: M
      points: 3
      evidence: 미분계수의 정의로 좌극한·우극한을 따로 계산하는 식을 세웠다.
      steps: [a2b-1]
    - id: A2.A1
      mark_type: A
      points: 2
      evidence: 좌극한 $-2$.
      depends_on: [A2.M1]
      steps: [a2b-1]
    - id: A2.A2
      mark_type: A
      points: 2
      evidence: 우극한 $-2$.
      depends_on: [A2.M1]
      steps: [a2b-2]
    - id: A2.R1
      mark_type: R
      points: 3
      evidence: 좌·우 극한이 같으므로 미분가능하다고 결론지었다.
      depends_on: [A2.M1]
      ft: {from: [A1.A2], max_points: 3}
      steps: [a2b-3]
    deductions:
    - code: DA2-1
      condition: 연속성만 보이고 미분가능하다고 결론
      effect: cap
      value: 3
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0823}
  misconceptions:
  - id: MC-CAL-0823
    outcome_code: '71'
    wrong_work: '$S(2^-)=S(2^+)=16$이므로 미분가능'
    detect_cue: 함숫값의 좌·우 극한만 비교, 미분계수의 극한식 없음
    feedback: 연속은 미분가능의 필요조건일 뿐입니다. 미분계수의 좌·우 극한을 비교하세요.
    remedy: [RL-2]
- id: A3
  stem: |
    (3) 이 장비의 경제수명을 구하시오
  points: 10
  depends_on: [A1]
  answer: {kind: value, value: '12**(1/3)', equivalents: ['∛12 년'], tolerance: null}
  solutions:
  - id: SA3-A
    audience: A
    method_no: 1
    key_idea: $0<x\le2$에서 $S'=-\tfrac{20}{x^2}+3<0$ (임계점 $\sqrt{20/3}>2$), $x>2$에서 $S'=-\tfrac{24}{x^2}+2x=0\iff x=\sqrt[3]{12}$, 음→양.
    steps:
    - {id: a3a, content: '경제수명 $\sqrt[3]{12}$년', criteria: [A3.M1, A3.R1, A3.M2, A3.A1]}
    hint_ladder:
    - 두 구간에서 각각 $S'(x)$의 부호를 조사하자.
  - id: SA3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.107
    steps:
    - id: a3b-1
      content: |
        (i) $0<x\le2$일 때 $S'(x)=-\dfrac{20}{x^2}+3=0$에서 $x=\pm\sqrt{\dfrac{20}3}$. $\sqrt{\dfrac{20}3}>2$이므로 $0<x\le2$에서는 극값이 없으며 $S'(x)<0$이므로 이 구간에서 $S(x)$는 감소한다.
      criteria: [A3.M1, A3.R1]
    - id: a3b-2
      content: |
        (ii) $x>2$일 때 $S'(x)=-\dfrac{24}{x^2}+2x=0$에서 $x^3=12$, $x=\sqrt[3]{12}>2$. $2<x<\sqrt[3]{12}$에서 $S'<0$, $x>\sqrt[3]{12}$에서 $S'>0$이다.
      criteria: [A3.M2]
    - id: a3b-3
      content: |
