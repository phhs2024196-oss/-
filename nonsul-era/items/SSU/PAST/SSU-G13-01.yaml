- id: B2
  stem: |
    (2) 수직선 위를 움직이는 점 $P$에 대하여 임의의 위치 $s$에서 속도 $v$를 측정하여
    $$v=\dfrac{ds}{dt}=s^2-1,\ 2\le s\le3$$
    의 결과를 얻었다. 시각 $t=0$일 때, 위치 $s=2$인 점 $P$가 $s=3$에 도달하는 시간 $T$를 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: 'log(Rational(3,2))/2', equivalents: ['(1/2)ln(3/2)'], tolerance: null}
  solutions:
  - id: SB2-A
    audience: A
    method_no: 1
    key_idea: $t$를 $s$의 함수로 보면 $\dfrac{dt}{ds}=\dfrac1{s^2-1}$, $T=\int_2^3\dfrac{ds}{s^2-1}=\dfrac12\left[\ln\dfrac{s-1}{s+1}\right]_2^3=\dfrac12\ln\dfrac32$.
    steps:
    - {id: b2a, content: '$T=\dfrac12\ln\dfrac32$', criteria: [B2.M1, B2.M2, B2.A1]}
    hint_ladder:
    - 시각 $t$를 위치 $s$의 함수로 생각하자(역함수).
    - $\dfrac1{s^2-1}$은 부분분수로 나눌 수 있다.
  - id: SB2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.108
    steps:
    - id: b2b-1
      content: |
        $2\le s\le3$에서 $v=s^2-1>0$이므로 $s$는 $t$의 증가함수이고, 시각 $t$를 위치 $s$의 함수로 생각하면 $\dfrac{dt}{ds}=\dfrac1{s^2-1}$이 된다.
      criteria: [B2.M1]
    - id: b2b-2
      content: |
        점 $P$가 $s=3$에 도달하는 시각 $T$를 구하기 위하여 $s=2$부터 $s=3$까지 이 식을 적분하면
        $$T=t(3)-t(2)=\int_2^3\dfrac{dt}{ds}\,ds=\int_2^3\dfrac1{s^2-1}\,ds=\int_2^3\dfrac12\left(\dfrac1{s-1}-\dfrac1{s+1}\right)ds.$$
      criteria: [B2.M2]
    - id: b2b-3
      content: |
        $$T=\dfrac12\left[\ln\left(\dfrac{s-1}{s+1}\right)\right]_2^3=\dfrac12\left(\ln\dfrac12-\ln\dfrac13\right)=\dfrac12\ln\dfrac32.$$
      criteria: [B2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: B2.M1
      mark_type: M
      points: 4
      evidence: $\dfrac{dt}{ds}=\dfrac1{s^2-1}$ (역함수의 미분)로 바꾸었다.
      steps: [b2b-1]
    - id: B2.M2
      mark_type: M
      points: 3
      evidence: $T=\int_2^3\dfrac{ds}{s^2-1}$을 세우고 부분분수로 나누었다.
      steps: [b2b-2]
    - id: B2.A1
      mark_type: A
      points: 3
      evidence: $T=\dfrac12\ln\dfrac32$.
      depends_on: [B2.M1, B2.M2]
      cao: true
      steps: [b2b-3]
    deductions:
    - code: DB2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 2
