# 숭실대 2016학년도 수시논술고사(자연) 문제 1 — 원문은 내부 분석용(allowed_use: internal_only)
# 학년도 판정: 교재 p.76 머리글 「2016 숭실대학교 수시논술고사 문제지[수학]」, 해설 p.101 「2016 숭실대학교 수시논술고사 문제 해설」(학년도 표기 없음).
#   제시문 출처가 「미적분과 통계 기본」(2007 개정, 2016학년도까지 수능 과목)이고 교재 배열(2017 모의 → 2016 → 2015 모의)도 맞아 2016학년도 실전(수시) 논술로 판정. 「수시」 표기로 실전 확정.
# 원문 문제 1 = 문제 1-A(20점) + 문제 1-B(30점) = 50점. 소문항 id: A = 1-A, B1·B2·B3 = 1-B (1)(2)(3).
# [확인필요] 1-B 의 (1)(2)(3) 배점 표기 없음 → 10·10·10 임의 배분.
# [판독확인] 1-B (3) 등식 「G(t)=F(t)−T(t−2)」: 원문 그대로 T. 문맥·해설(p.104)상 F(t−2)의 오기 → 해설은 G(t)=F(t)−F(t−2)로 풂.
# 1-A 정답: 해설교재는 영역을 (x−6)²+y²>12 로만 적음. 점 A(0,0)에서는 W 가 정의되지 않으므로 엄밀히는 A 제외(메모만, 정답은 해설교재대로).
