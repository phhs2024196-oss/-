      points: 3
      evidence: 제시문 (가)의 정의로 $t=2$에서 좌·우 극한을 각각 계산했다(둘 다 $\tfrac43$).
      steps: [b2b-1]
    - id: B2.R1
      mark_type: R
      points: 2
