    feedback: 미분가능성은 제시문 (가)의 극한 $\lim\dfrac{F(2+h)-F(2)}h$의 좌·우 극한이 같은지로 판정합니다.
    remedy: [RL-3]
- id: B3
  stem: |
    (3) $\triangle ABC$ 의 내부에서 두 직선 $y=x$와 $y=x-2$사이에 위치하는 영역(<그림 2> 참조)의 넓이를 $t$에 대한 함수 $G(t)$로 나타낼 때, 다음 등식
    $$G(t)=F(t)-T(t-2)$$
    가 성립한다. 이 등식과 문항 (2)의 결과를 활용하여 함수 $G(t)$가 최대가 되는 $t$를 구하시오.
  points: 10
  depends_on: [B2]
  answer: {kind: value, value: '10/3', equivalents: [], tolerance: null}
  solutions:
  - id: SB3-A
    audience: A
    method_no: 1
    key_idea: $G'(t)=F'(t)-F'(t-2)$. 두 그래프는 $[2,4]$에서 $-\tfrac13t+2=\tfrac23(t-2)$, $t=\tfrac{10}3$에서 만나고 그 좌우로 $G'$이 양→음.
    steps:
    - {id: b3a, content: '$t=\dfrac{10}3$', criteria: [B3.M1, B3.A1, B3.R1]}
    hint_ladder:
    - 등식의 $T$는 $F$로 읽는다. $G'(t)$를 $F'$으로 나타내자.
    - (2)에서 그린 두 그래프 중 어느 쪽이 위에 있는지 보자.
  - id: SB3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.104
    steps:
    - id: b3b-1
      content: |
        $G(t)=F(t)-F(t-2)$이므로 $G'(t)=F'(t)-F'(t-2)$이다. 따라서 $G'(t)=0$, 즉 $F'(t)=F'(t-2)$를 만족하는 $t$를 찾고 증감을 조사하면 된다.
      criteria: [B3.M1]
    - id: b3b-2
      content: |
        (2)의 그래프에서 $t\le0$, $t\ge8$일 때 $G'(t)=0$이고, 구간 $[2,4]$에 있는 교점을 기준으로 $G'$이 양에서 음으로 바뀐다. 이 구간에서 $F'(t)=-\dfrac13t+2$, $F'(t-2)=\dfrac23(t-2)$이므로 교점은 $-\dfrac13t+2=\dfrac23(t-2)$, $t=\dfrac{10}3$.
      criteria: [B3.A1]
    - id: b3b-3
      content: |
        증감표: $t\le0$에서 $G=0$, $0<t<\dfrac{10}3$에서 $F'(t)>F'(t-2)$이므로 $G$ 증가, $\dfrac{10}3<t<8$에서 $F'(t)<F'(t-2)$이므로 $G$ 감소, $t\ge8$에서 $G=0$. 따라서 $G(t)$는 $t=\dfrac{10}3$에서 최댓값을 갖는다.
      criteria: [B3.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
