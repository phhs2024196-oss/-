stimuli:
- label: 1-B (가)
  body: |
    함수 $f(x)$의 $x=a$에서의 미분계수
    $$f'(a)=\lim_{h\to0}\dfrac{f(a+h)-f(a)}h$$
    가 존재할 때, 함수 $f(x)$는 $x=a$에서 미분가능하다고 한다. 또한 함수 $f(x)$가 어떤 구간에 속하는 모든 $x$에 대하여 미분가능할 때, 함수 $f(x)$는 그 구간에서 미분가능하다고 한다.
    【출처 : 미적분과 통계 기본 「미분계수와 도함수」】
- label: 1-B (나)
  body: |
    방정식 $g(x,y)=0$이 나타내는 도형을 $x$축 방향으로 $a$만큼, $y$축 방향으로 $b$만큼 평행이동한 도형의 방정식은 다음과 같다.
    $$g(x-a,y-b)=0$$
    【출처 : 수학 「도형의 이동」】

stem: |
  【문제 1】 문제 1-A, 문제 1-B에 답하시오.

subparts:
- id: A
  stem: |
    문제 1- A. 다음을 읽고 논제에 답하시오. (20점)

    좌표평면 위의 점 $Q(x,y)$에 위치한 단말기가 점 $(x_0,y_0)$에 위치한 기지국으로부터 수신하는 신호의 세기 $W(Q)$는
    $$W(Q)=\dfrac c{(x-x_0)^2+(y-y_0)^2}\quad(\text{단, }c\text{ : 기지국의 송신출력})$$
    이다. 송신출력이 3인 기지국 $A(0,0)$와 송신출력이 1인 기지국 $B(4,0)$가 있다고 할 때, 다음에 답하시오.

    기지국 $A$로부터 수신하는 신호의 세기가 기지국 $B$로부터 수신하는 신호의 세기보다 큰 $Q(x,y)$의 영역을 좌표평면에 나타내시오.
  points: 20
  depends_on: []
  answer: {kind: set, value: '(x-6)**2+y**2>12', equivalents: ['중심 (6,0), 반지름 2√3인 원의 외부(경계 제외)'], tolerance: null}
  solutions:
  - id: SA-A
    audience: A
    method_no: 1
    key_idea: $\dfrac3{x^2+y^2}>\dfrac1{(x-4)^2+y^2}$의 양변에 두 양수 분모를 곱하면 $(x-6)^2+y^2>12$, 즉 원의 외부.
    steps:
    - {id: aa, content: '$(x-6)^2+y^2>12$ (경계 제외)', criteria: [A.M1, A.A1, A.A2]}
    hint_ladder:
    - 두 신호 세기를 식으로 쓰고 분모를 정리해 보자.
  - id: SA-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.101
    steps:
    - id: ab-1
      content: |
        기지국 A로부터 수신하는 신호의 세기가 기지국 B로부터 수신하는 신호보다 커지는 단말기 위치 $Q(x,y)$의 영역은
        $$\left\{(x,y)\ \middle|\ \dfrac3{x^2+y^2}>\dfrac1{(x-4)^2+y^2}\right\}.$$
      criteria: [A.M1]
    - id: ab-2
      content: |
        두 분모는 양수이므로 곱해 정리하면 $3\{(x-4)^2+y^2\}>x^2+y^2$, 전개하면 $x^2-12x+y^2+24>0$, 즉 $(x-6)^2+y^2>12$.
      criteria: [A.A1]
    - id: ab-3
      content: |
        따라서 구하는 영역은 중심 $(6,0)$, 반지름 $2\sqrt3$인 원의 외부(경계선 제외)이다. [그림 설명] 좌표평면 전체를 칠하고, 점선 원 $(x-6)^2+y^2=12$의 내부(점 $B(4,0)$ 포함)를 비워 둔다. 원은 $x$축과 $(6-2\sqrt3,0)$, $(6+2\sqrt3,0)$에서 만난다.
      criteria: [A.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: A.M1
      mark_type: M
      points: 6
      evidence: 두 신호 세기의 대소를 $\dfrac3{x^2+y^2}>\dfrac1{(x-4)^2+y^2}$로 나타냈다.
      steps: [ab-1]
    - id: A.A1
      mark_type: A
      points: 7
      evidence: $(x-6)^2+y^2>12$로 정리했다.
      depends_on: [A.M1]
      steps: [ab-2]
    - id: A.A2
      mark_type: A
      points: 7
      evidence: 중심 $(6,0)$, 반지름 $2\sqrt3$인 원의 외부를 경계 제외(점선)로 그렸다.
      depends_on: [A.M1]
      steps: [ab-3]
    deductions:
    - code: DA-1
      condition: 경계 포함 여부 누락 또는 실선으로 그림
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-0821}
  misconceptions:
  - id: MC-ALG-0821
    outcome_code: '71'
    wrong_work: '거리 비교로 $\sqrt{x^2+y^2}<3\sqrt{(x-4)^2+y^2}$로 두어 $(x-4.5)^2+y^2>2.25$'
    detect_cue: 계수 9가 나오는 식, 중심 $\left(\tfrac92,0\right)$
    feedback: 세기는 거리의 제곱에 반비례합니다. $3r_B^2>r_A^2$로 비교해야 합니다.
    remedy: [RL-1]
- id: B1
  stem: |
    문제 1- B 다음 제시문을 읽고 아래 논제에 답하시오. (30점)

    그림과 같이 $\angle ABC=90^\circ$인 직각삼각형 $ABC$의 밑변 $BC$가 $x$축 위에 놓여 있다. $\overline{AB}=4$, $\overline{BC}=2$ 이고 꼭짓점 $C$의 좌표가 $C(t,0)$ $(-\infty<t<\infty)$일 때, 다음 문항에 답하시오.

    [그림 설명] <그림 1>: $A(t-2,4)$, $B(t-2,0)$, $C(t,0)$인 직각삼각형과 직선 $y=x$. 삼각형 내부에서 $y=x$ 아래의 부분(회색)이 $F(t)$. <그림 2>: 같은 삼각형과 두 직선 $y=x$, $y=x-2$. 두 직선 사이의 부분(회색)이 $G(t)$.

    (1) $\triangle ABC$의 내부에서 직선 $y=x$ 아래에 위치하는 영역(<그림 1> 참조)의 넓이를 $t$에 대한 함수 $F(t)$ 로 나타내시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'Piecewise((0, t < 0), (t**2/3, t < 2), (-t**2/6 + 2*t - 2, t < 6), (4, True))', equivalents: [], tolerance: null}
  solutions:
  - id: SB1-A
    audience: A
    method_no: 1
    key_idea: 빗변 $AC$의 방정식 $y=-2(x-t)$와 $y=x$의 교점 $\left(\tfrac23t,\tfrac23t\right)$. $0\le t<2$이면 삼각형 $O,C,P_t$의 넓이 $\tfrac13t^2$, $2\le t<6$이면 여기서 $x<t-2$ 부분 $\tfrac12(t-2)^2$을 뺀다.
    steps:
    - {id: b1a, content: '$F(t)=0,\ \tfrac13t^2,\ -\tfrac16t^2+2t-2,\ 4$', criteria: [B1.M1, B1.A1, B1.M2, B1.A2]}
    hint_ladder:
    - 꼭짓점 $B$가 원점의 왼쪽에 있을 때와 오른쪽에 있을 때 모양이 다르다.
  - id: SB1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.102
    steps:
    - id: b1b-1
      content: |
        $t<0$이면 삼각형이 제2사분면 쪽에 있어 $y=x$ 아래 부분이 없으므로 $F(t)=0$, $t>6$이면 삼각형 전체가 $y=x$ 아래에 있으므로 $F(t)=\dfrac12\cdot2\cdot4=4$. $0\le t\le6$에서는 $t=2$를 기점으로 모양과 넓이의 식이 바뀐다.
      criteria: [B1.M1]
    - id: b1b-2
      content: |
        (i) $0\le t<2$: 꼭짓점 $A(t-2,4)$, $C(t,0)$을 잇는 직선 $y=-2(x-t)$와 $y=x$의 교점은 $P_t\left(\dfrac23t,\dfrac23t\right)$. $y=x$ 아래 영역은 $O(0,0)$, $C(t,0)$, $P_t$로 이루어진 삼각형이고 넓이는 $\dfrac12\cdot t\cdot\dfrac23t=\dfrac13t^2$.
      criteria: [B1.A1]
    - id: b1b-3
      content: |
        (ii) $2\le t<6$: 변 $AB$ ($x=t-2$)와 $y=x$의 교점은 $Q_t(t-2,t-2)$. $y=x$ 아래 영역은 $B(t-2,0)$, $C(t,0)$, $P_t$, $Q_t$로 이루어진 사각형이고 넓이는 $\dfrac13t^2-\dfrac12(t-2)^2=-\dfrac16t^2+2t-2$. 따라서
        $$F(t)=\begin{cases}0&(t<0)\\\dfrac13t^2&(0\le t<2)\\-\dfrac16t^2+2t-2&(2\le t<6)\\4&(6\le t)\end{cases}$$
      criteria: [B1.M2, B1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: B1.M1
      mark_type: M
      points: 2
      evidence: $t<0$, $t\ge6$에서 $F=0$, $F=4$이고 $t=2$에서 모양이 바뀜을 밝혔다.
      steps: [b1b-1]
    - id: B1.A1
      mark_type: A
      points: 3
      evidence: 교점 $P_t\left(\tfrac23t,\tfrac23t\right)$과 $0\le t<2$에서 $F=\tfrac13t^2$.
      depends_on: [B1.M1]
      steps: [b1b-2]
    - id: B1.M2
      mark_type: M
      points: 2
      evidence: $2\le t<6$에서 삼각형 $OCP_t$에서 $x<t-2$ 부분을 빼는 식을 세웠다.
      steps: [b1b-3]
    - id: B1.A2
      mark_type: A
      points: 3
      evidence: $F=-\tfrac16t^2+2t-2$와 네 구간을 모은 $F(t)$.
      depends_on: [B1.M2]
      steps: [b1b-3]
    deductions:
    - code: DB1-1
      condition: 구간의 등호(경계) 표기 누락
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0822}
  misconceptions:
  - id: MC-CAL-0822
    outcome_code: '71'
    wrong_work: '$0\le t<6$ 전체에서 $F(t)=\tfrac13t^2$'
    detect_cue: $t=2$에서 구간을 나누지 않음, $F(6)=12\ne4$
    feedback: $t>2$이면 꼭짓점 $B$가 원점 오른쪽으로 가서 $x<t-2$ 부분은 삼각형 밖입니다. 그 부분을 빼세요.
    remedy: [RL-2]
- id: B2
  stem: |
    (2) 문항 (1)에서 구한 함수 $F(t)$ 는 실수 전체에서 미분가능하고 그 도함수가 연속이다. $t=2$ 에서의 미분가능성을 증명하고, 도함수 $y=F'(t)$와 $y=F'(t-2)$ 의 그래프를 하나의 좌표평면에 그리시오.
  points: 10
  depends_on: [B1]
  answer: {kind: proof, value: null, equivalents: [], tolerance: null}
  solutions:
  - id: SB2-A
    audience: A
    method_no: 1
    key_idea: (가)의 정의로 좌·우 극한 $\lim\tfrac13(h+4)=\tfrac43$, $\lim\left\{-\tfrac16(h+4)+2\right\}=\tfrac43$이 같다. $F'$은 $0\to\tfrac43\to0$ 꺾은선($t=0,2,6$), $F'(t-2)$는 이를 오른쪽으로 2만큼 평행이동.
    steps:
    - {id: b2a, content: '$F''(2)=\dfrac43$, 꼭짓점 $(2,\tfrac43)$·$(4,\tfrac43)$인 두 꺾은선', criteria: [B2.M1, B2.R1, B2.A1, B2.M2, B2.A2]}
    hint_ladder:
    - 제시문 (가)의 극한을 $h\to0-$와 $h\to0+$로 나누어 계산하자.
    - $y=F'(t-2)$는 제시문 (나)에 의해 어떻게 얻어지는가?
  - id: SB2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.103
    steps:
    - id: b2b-1
      content: |
        제시문 (가)에 의해 미분계수의 존재 여부, 즉 정의의 극한식의 좌극한과 우극한이 일치하는지 판정해야 한다. $F(2)=\dfrac43$이므로
        $$\lim_{h\to0-}\dfrac{F(2+h)-F(2)}h=\lim_{h\to0-}\dfrac{\frac13(2+h)^2-\frac43}h=\lim_{h\to0-}\dfrac13(h+4)=\dfrac43,$$
        $$\lim_{h\to0+}\dfrac{F(2+h)-F(2)}h=\lim_{h\to0+}\dfrac{-\frac16(2+h)^2+2(2+h)-2-\frac43}h=\lim_{h\to0+}\left\{-\dfrac16(h+4)+2\right\}=\dfrac43.$$
      criteria: [B2.M1]
    - id: b2b-2
      content: |
        두 값이 일치하므로 $F'(2)$가 존재하고 $F$는 $t=2$에서 미분가능하다. ■
      criteria: [B2.R1]
    - id: b2b-3
      content: |
        (1)의 식을 미분하면
        $$F'(t)=\begin{cases}0&(t<0)\\\dfrac23t&(0\le t<2)\\-\dfrac13t+2&(2\le t<6)\\0&(6\le t)\end{cases}$$
      criteria: [B2.A1]
    - id: b2b-4
      content: |
        제시문 (나)에 의해 $y=F'(t-2)$의 그래프는 $y=F'(t)$의 그래프를 $t$축 방향으로 2만큼 평행이동한 것이다. [그림 설명] $y=F'(t)$: $(0,0)$에서 $\left(2,\tfrac43\right)$까지 선분, $\left(2,\tfrac43\right)$에서 $(6,0)$까지 선분, 그 밖에서는 $0$. $y=F'(t-2)$: $(2,0)$–$\left(4,\tfrac43\right)$–$(8,0)$의 꺾은선(점선), 그 밖에서는 $0$.
      criteria: [B2.M2, B2.A2]
  rubric:
