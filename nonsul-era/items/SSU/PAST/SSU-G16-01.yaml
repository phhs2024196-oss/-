      depends_on: [B2.M1]
      steps: [b2b-2]
    - id: B2.A1
      mark_type: A
      points: 2
      evidence: $F'(t)$의 구간별 식.
      depends_on: [B2.M1]
      ft: {from: [B1.A2], max_points: 2}
      steps: [b2b-3]
    - id: B2.M2
      mark_type: M
      points: 1
      evidence: $y=F'(t-2)$가 $y=F'(t)$를 $t$축 방향으로 2만큼 평행이동한 것임을 밝혔다.
      steps: [b2b-4]
    - id: B2.A2
      mark_type: A
      points: 2
