stem: |
  [문제 1] 다음 논제에 답하시오.[50점]

  <그림>과 같이 중심이 $(2,0)$이고 반지름이 2인 원과 중심이 원점이고 반지름의 길이가 $2\sqrt3$인 부채꼴을 겹쳐 놓았다. 부채꼴의 한변이 $x$축 위에 있고 중심각의 크기가 $\theta$ $\left(0\le\theta\le\dfrac\pi3\right)$일 때, 부채꼴에서 원과 겹치지 않는 영역의 넓이를 $S_1(\theta)$, 부채꼴과 원이 겹치는 영역의 넓이를 $S_2(\theta)$라 하자. $S_1(\theta)-S_2(\theta)$가 최대가 될 때의 $\theta$에 대하여 $\cos2\theta$의 값을 구하시오.

  [그림 설명] 원은 원점에서 $x$축에 접하고 $y$축 위에 중심이 있는 원(중심 $(0,2)$)으로 그려져 있다. 부채꼴은 원점이 중심, 한 반지름이 $x$축의 양의 방향 위, 다른 반지름이 $x$축과 각 $\theta$를 이루며 시계 반대 방향 화살표로 각이 커짐을 나타낸다. 다른 반지름이 원과 만나 생긴 원점 쪽 활꼴이 $S_2$, 부채꼴의 나머지 빗금 부분이 $S_1$이다.

subparts:
- id: '1'
  stem: |
    $S_1(\theta)-S_2(\theta)$가 최대가 될 때의 $\theta$에 대하여 $\cos2\theta$의 값을 구하시오.
  points: 50
  depends_on: []
  answer: {kind: value, value: '1/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접선($x$축)과 현 $OB$가 이루는 각 $\theta$ = 원주각 $\Rightarrow$ 중심각 $\angle BCO=2\theta$. $T(\theta)=4\sin2\theta-2\theta$, $T'=8\cos2\theta-2$가 $\cos2\theta=\dfrac14$에서 양→음.
    steps:
    - {id: 1a, content: '$T''(\theta)=8\cos2\theta-2=0\iff\cos2\theta=\dfrac14$', criteria: [1.M1, 1.A1, 1.M2, 1.A2, 1.M3, 1.R1, 1.A3]}
    hint_ladder:
    - 원과 부채꼴의 반지름 $OB$가 만나는 점 $B$와 원의 중심 $C$를 잇자.
    - $x$축은 원의 접선이다. 접선과 현이 이루는 각은 무엇과 같은가?
    - $S_1+S_2$는 부채꼴 전체의 넓이이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.95
    steps:
    - id: 1b-1
      content: |
        그림의 원은 중심 $C(0,2)$, 반지름 2이고 원점에서 $x$축에 접한다. 부채꼴의 반지름 $OB$가 원과 만나는 원점이 아닌 점을 $B$라 하자. 원과 $y$축의 다른 교점을 $A(0,4)$라 하면 $OA$는 지름이므로 $\angle OBA=\dfrac\pi2$이고, $\angle AOB=\dfrac\pi2-\theta$이므로 $\angle BAO=\theta$. 중심각은 원주각의 2배이므로 $\angle BCO=2\theta$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이때 $OB=4\sin\theta\le4\sin\dfrac\pi3=2\sqrt3$이므로 $0\le\theta\le\dfrac\pi3$에서 $B$는 항상 부채꼴 안에 있다. 겹치는 부분은 현 $OB$와 호가 만드는 활꼴이므로
        $$S_2(\theta)=\dfrac12\cdot2^2\cdot2\theta-\dfrac12\cdot2^2\sin2\theta=4\theta-2\sin2\theta.$$
      criteria: [1.A1]
    - id: 1b-3
      content: |
        부채꼴의 넓이는 $\dfrac12(2\sqrt3)^2\theta=6\theta$이므로 $S_1(\theta)=6\theta-S_2(\theta)=2\theta+2\sin2\theta$이고
        $$T(\theta)=S_1(\theta)-S_2(\theta)=4\sin2\theta-2\theta.$$
      criteria: [1.M2, 1.A2]
    - id: 1b-4
      content: |
        $T'(\theta)=8\cos2\theta-2$. $0\le2\theta\le\dfrac{2\pi}3$에서 $\cos2\theta$는 감소하므로 $T'$은 감소하고 $T'(0)=6>0$, $T'\left(\dfrac\pi3\right)=-6<0$이다.
      criteria: [1.M3]
    - id: 1b-5
      content: |
        따라서 $T'(\theta_0)=0$인 $\theta_0$이 구간 안에 하나 있고 $T$는 $\theta_0$의 왼쪽에서 증가, 오른쪽에서 감소하므로 $\theta_0$에서 최대이다. 이때 $\cos2\theta_0=\dfrac14$.
      criteria: [1.R1, 1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 12
      evidence: 원주각(또는 접선과 현이 이루는 각)으로 중심각 $\angle BCO=2\theta$를 근거와 함께 구했다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 10
      evidence: $S_2(\theta)=4\theta-2\sin2\theta$ (부채꼴 $-$ 삼각형).
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: 부채꼴 넓이 $6\theta$에서 $S_2$를 빼서 $S_1$을 구했다.
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 6
      evidence: $S_1-S_2=4\sin2\theta-2\theta$.
      depends_on: [1.M2, 1.M1]
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 8
      evidence: $T'(\theta)=8\cos2\theta-2$를 구하고 구간 양 끝에서의 부호(또는 단조성)를 조사했다.
      steps: [1b-4]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: $T'$의 부호가 양에서 음으로 바뀌므로 그 점에서 최대임을 밝혔다.
      depends_on: [1.M3]
      steps: [1b-5]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: $\cos2\theta=\dfrac14$.
      depends_on: [1.M3]
      cao: true
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
