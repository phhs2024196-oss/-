# [판독확인] 머리글: 교재 p.70 머리글은 「2018 숭실대학교 논술고사 문제지[수학]」(학년도 표기 없음). 교재 배열(2019 논술→2019 모의→2018 논술→2018 모의)과 p.76 「2016 … 수시논술고사」 표기 관행으로 2018학년도 실전 논술로 판정.
# [판독확인] 발문 「중심이 (2, 0)이고 반지름이 2인 원」: 그림과 해설(p.95, 원과 y축의 교점 A, 중심 C가 y축 위)은 중심 (0, 2)인 원. 중심 (2,0)이면 θ=0 에서 현의 길이 4>2√3 이 되어 그림과 모순 → 원문 오기로 보고 해설은 중심 (0, 2)로 풂. 발문은 원문 그대로 둠.
# [판독확인] 발문 「반지름의; 깅리; 가」: 원문 PDF 의 글자 깨짐. 「반지름의 길이가」로 옮김.
