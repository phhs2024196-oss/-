stem: |
  【문제 1】 다음 논제에 답하시오.

  임의의 연속함수 $f(t)$에 대하여 함수 $F(x)$를
  $$F(x)=\int_0^1f(t)|t-x|\,dt$$
  라고 할 때, 다음 문항에 답하시오.

subparts:
- id: '1'
  stem: |
    (1) 함수 $f(t)=2t$에 대하여 $F\left(\dfrac12\right)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '1/4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t=\dfrac12$에서 구간을 나누어 $\displaystyle\int_0^{1/2}2t\left(\dfrac12-t\right)dt+\int_{1/2}^12t\left(t-\dfrac12\right)dt=\dfrac1{24}+\dfrac5{24}$.
    steps:
    - {id: 1a, content: '$\dfrac1{24}+\dfrac5{24}=\dfrac14$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $\left|t-\dfrac12\right|$은 $t=\dfrac12$의 앞뒤에서 식이 바뀐다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.93
    steps:
    - id: 1b-1
      content: |
        $0\le t\le\dfrac12$이면 $\left|t-\dfrac12\right|=\dfrac12-t$, $\dfrac12<t\le1$이면 $\left|t-\dfrac12\right|=t-\dfrac12$이므로
        $$F\left(\tfrac12\right)=\int_0^{1/2}(t-2t^2)\,dt+\int_{1/2}^1(2t^2-t)\,dt.$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\displaystyle\int_0^{1/2}(t-2t^2)\,dt=\left[\dfrac{t^2}2-\dfrac{2t^3}3\right]_0^{1/2}=\dfrac18-\dfrac1{12}=\dfrac1{24}$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $\displaystyle\int_{1/2}^1(2t^2-t)\,dt=\left[\dfrac{2t^3}3-\dfrac{t^2}2\right]_{1/2}^1=\dfrac16-\left(\dfrac1{12}-\dfrac18\right)=\dfrac5{24}$. 따라서 $F\left(\dfrac12\right)=\dfrac1{24}+\dfrac5{24}=\dfrac14$.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $t=\dfrac12$을 기준으로 절댓값을 풀어 적분을 두 구간으로 나눈 식이 있다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 첫 구간의 적분값 $\dfrac1{24}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: 둘째 구간의 적분값 $\dfrac5{24}$과 합 $\dfrac14$을 구했다.
      depends_on: [1.M1]
      cao: true
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0810}
  misconceptions:
  - id: MC-CAL-0810
    outcome_code: '71'
    wrong_work: '$\displaystyle\int_0^12t\left(t-\dfrac12\right)dt=\dfrac16$'
    detect_cue: 구간을 나누지 않고 하나의 적분으로 계산, 답 $\dfrac16$
    feedback: 절댓값 안의 부호가 바뀌는 $t=\dfrac12$에서 적분 구간을 나누어야 합니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    (2) 연속함수 $f(t)$에 대하여 $\displaystyle\int_0^{\frac12}f(t)\,dt=A$이고 $\displaystyle\int_{\frac12}^1f(t)\,dt=B$일 때, 미분계수 $F'\left(\dfrac12\right)$의 값을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: 'A-B', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $0\le x\le1$에서 $F(x)=x\int_0^xf-\int_0^xtf+\int_x^1tf-x\int_x^1f$, 미분하면 $tf$ 항이 상쇄되어 $F'(x)=\int_0^xf-\int_x^1f$.
    steps:
    - {id: 2a, content: '$F''\left(\tfrac12\right)=A-B$', criteria: [2.M1, 2.M2, 2.A1, 2.A2]}
    hint_ladder:
    - 구간 $[0,1]$ 안의 $x$에 대해 $|t-x|$를 $t\le x$와 $t>x$로 나누어 보자.
    - $\int_0^x(x-t)f(t)\,dt$에서 $x$는 적분 변수가 아니므로 밖으로 꺼낼 수 있다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.93
    steps:
    - id: 2b-1
      content: |
        $0<x<1$일 때 $t\le x$이면 $|t-x|=x-t$, $t>x$이면 $|t-x|=t-x$이므로
        $$F(x)=\int_0^x(x-t)f(t)\,dt+\int_x^1(t-x)f(t)\,dt.$$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $x$는 적분 변수가 아니므로 밖으로 꺼내면
        $$F(x)=x\int_0^xf(t)\,dt-\int_0^xtf(t)\,dt+\int_x^1tf(t)\,dt-x\int_x^1f(t)\,dt.$$
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $f$가 연속이므로 미적분의 기본정리와 곱의 미분법에 의해
        $$F'(x)=\int_0^xf(t)\,dt+xf(x)-xf(x)-xf(x)-\int_x^1f(t)\,dt+xf(x)=\int_0^xf(t)\,dt-\int_x^1f(t)\,dt.$$
      criteria: [2.A1]
    - id: 2b-4
      content: |
        $x=\dfrac12$을 대입하면 $F'\left(\dfrac12\right)=\displaystyle\int_0^{1/2}f(t)\,dt-\int_{1/2}^1f(t)\,dt=A-B$.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: $t=x$를 기준으로 적분을 두 구간으로 나누어 $F(x)$를 썼다.
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: 적분 기호 안의 $x$를 밖으로 꺼낸 식을 썼다.
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: 곱의 미분과 미적분의 기본정리로 $F'(x)=\int_0^xf(t)\,dt-\int_x^1f(t)\,dt$를 얻었다.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: $F'\left(\dfrac12\right)=A-B$.
      depends_on: [2.M2, 2.A1]
      cao: true
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0811}
  misconceptions:
  - id: MC-CAL-0811
    outcome_code: '71'
    wrong_work: '$F''(x)=f(x)|x-x|=0$이므로 $F''\left(\tfrac12\right)=0$'
    detect_cue: 피적분함수에 $t=x$를 바로 대입함, 답 0
    feedback: 피적분함수에 $x$가 있으면 먼저 $x$를 적분 밖으로 꺼낸 뒤 미분해야 합니다.
    remedy: [RL-2]

