stem: |
  【문제 1-B】 다음 논제에 답하시오.

  좌표공간에서 구 $(x-3)^2+(y-1)^2+(z+2)^2=5^2$을 $S_1$이라 하고, 두 점 $\mathrm A(1,-2,3)$, $\mathrm B(3,2,-1)$로부터 같은 거리에 있는 점들로 이루어진 평면을 $S_2$라 하자. 구 $S_1$과 평면 $S_2$가 만나서 생기는 원을 $\alpha$라 할 때, 다음 문항에 답하시오.

subparts:
- id: '1'
  stem: |
    (1) 점 $\mathrm P(4,-3,8)$에서 평면 $S_2$에 내린 수선의 발을 $\mathrm T$라고 할 때, 점 $\mathrm T$의 좌표를 구하시오.
  points: 8
  depends_on: []
  answer: {kind: value, value: '(6, 1, 4)', equivalents: ['\mathrm T(6,1,4)'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S_2$는 $\mathrm{AB}$의 수직이등분면 $x+2y-2z=0$. $\mathrm P$에서 법선 방향 $(1,2,-2)$로 그은 직선 $(4+t,-3+2t,8-2t)$를 대입하면 $9t-18=0$.
    steps:
    - {id: 1a, content: '$S_2:\ x+2y-2z=0$, $t=2$ → $\mathrm T(6,1,4)$', criteria: [1.M1, 1.A1, 1.M2, 1.A2]}
    hint_ladder:
    - 두 점에서 같은 거리에 있는 점들은 선분 $\mathrm{AB}$의 중점을 지나고 $\overrightarrow{\mathrm{AB}}$에 수직인 평면 위에 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 자료집 p.40 예시답안
    steps:
    - id: 1b-1
      content: |
        평면 $S_2$는 두 점 $\mathrm A$, $\mathrm B$의 중점 $(2,0,1)$을 지나고 법선벡터가 $\vec n=(1,2,-2)$($\overrightarrow{\mathrm{AB}}=(2,4,-4)$에 평행)이므로
        $$(x-2)+2y-2(z-1)=0,\ \text{즉}\ x+2y-2z=0.$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        이 식이 맞는지 확인: $\overline{\mathrm{XA}}^2=\overline{\mathrm{XB}}^2$을 전개하면 $-2x+4y-6z+14=-6x-4y+2z+14$, 즉 $4x+8y-8z=0$이므로 $x+2y-2z=0$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        점 $\mathrm P(4,-3,8)$을 지나고 평면 $S_2$에 수직인 직선 위의 점들은 $(x,y,z)=(4+t,\,-3+2t,\,8-2t)$ ($t$는 실수)로 표현되고, 이를 평면의 식에 대입하면
        $$(4+t)+2(-3+2t)-2(8-2t)=9t-18=0.$$
      criteria: [1.M2]
    - id: 1b-4
      content: |
        $t=2$이므로 점 $\mathrm P$에서 평면 $S_2$에 내린 수선의 발은 $\mathrm T(6,1,4)$이다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 중점 $(2,0,1)$과 법선 $(1,2,-2)$(또는 $\overline{\mathrm{XA}}=\overline{\mathrm{XB}}$)로 평면의 방정식을 세웠다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $S_2:\ x+2y-2z=0$.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: $\mathrm P$를 지나고 $S_2$에 수직인 직선 $(4+t,-3+2t,8-2t)$를 평면에 대입했다.
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $\mathrm T(6,1,4)$.
      depends_on: [1.M2]
      cao: true
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '2'
  stem: |
    (2) 원 $\alpha$의 중심의 좌표와 반지름의 길이를 구하시오.
  points: 8
  depends_on: ['1']
  answer: {kind: value, value: '((2, -1, 0), 4)', equivalents: ['중심 $\mathrm C(2,-1,0)$, 반지름 $4$'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 원의 중심은 구의 중심 $C_1(3,1,-2)$에서 $S_2$에 내린 수선의 발 $(3+t,1+2t,-2-2t)$, $9t+9=0$. 반지름은 $\sqrt{5^2-3^2}$.
    steps:
    - {id: 2a, content: '중심 $\mathrm C(2,-1,0)$, $\overline{C_1\mathrm C}=3$, 반지름 $4$', criteria: [2.M1, 2.A1, 2.M2, 2.A2]}
    hint_ladder:
    - 구의 중심과 단면인 원의 중심을 잇는 선분은 평면에 수직이다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 자료집 p.40 예시답안
    steps:
    - id: 2b-1
      content: |
        원 $\alpha$의 중심 $\mathrm C(x,y,z)$는 구 $S_1$의 중심 $C_1(3,1,-2)$를 평면 $S_2$에 내린 수선의 발이다. 구의 중심 $C_1$을 지나고 평면 $S_2$에 수직인 직선 위의 점들은 $(x,y,z)=(3+t,\,1+2t,\,-2-2t)$ ($t$는 실수)로 표현되고, 이를 평면의 식에 대입하면
        $$(3+t)+2(1+2t)-2(-2-2t)=9t+9=0.$$
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $t=-1$이므로 원 $\alpha$의 중심은 $\mathrm C(2,-1,0)$이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        구 $S_1$의 반지름의 길이는 $r_1=5$이고, $\overline{C_1\mathrm C}=\sqrt{1^2+2^2+2^2}=3$이므로 원 $\alpha$의 반지름의 길이 $r$은 피타고라스 정리에 의해
        $$r=\sqrt{r_1^2-\overline{C_1\mathrm C}^2}=\sqrt{5^2-3^2}=4.$$
      criteria: [2.M2, 2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: 원의 중심을 구의 중심 $C_1$에서 $S_2$에 내린 수선의 발로 보고 직선을 대입했다.
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: 중심 $\mathrm C(2,-1,0)$.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: $r=\sqrt{r_1^2-\overline{C_1\mathrm C}^2}$ (구의 중심과 평면 사이 거리 $3$)을 썼다.
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: 반지름 $4$.
      depends_on: [2.M2]
      cao: true
      steps: [2b-3]
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
- id: '3'
  stem: |
    (3) 점 $\mathrm P(4,-3,8)$와 원 $\alpha$ 위의 점 사이의 거리의 최솟값을 구하시오.
  points: 9
  depends_on: ['1', '2']
  answer: {kind: value, value: '2*sqrt(10)', equivalents: ['2\sqrt{10}'], tolerance: null}
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 원 위의 점 $\mathrm X$에 대해 $\overline{\mathrm{PX}}^2=\overline{\mathrm{PT}}^2+\overline{\mathrm{TX}}^2$이고 $\overline{\mathrm{PT}}=6$ 고정. $\overline{\mathrm{TX}}\ge\overline{\mathrm{CT}}-r=6-4=2$.
    steps:
    - {id: 3a, content: '$\sqrt{6^2+2^2}=2\sqrt{10}$', criteria: [3.M1, 3.M2, 3.A1]}
    hint_ladder:
    - $\overline{\mathrm{PX}}$를 높이 $\overline{\mathrm{PT}}$와 평면 위의 거리 $\overline{\mathrm{TX}}$로 나누어 보자.
    - 평면 위의 점 $\mathrm T$와 원 위의 점 사이 거리가 가장 짧은 곳은 직선 $\mathrm{CT}$ 위에 있다.
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 자료집 p.41 예시답안
    steps:
    - id: 3b-1
      content: |
        점 $\mathrm P(4,-3,8)$과 원 $\alpha$ 위의 점 사이의 거리의 최솟값은 점 $\mathrm P$의 평면 $S_2$로의 수선의 발 $\mathrm T(6,1,4)$와 원 $\alpha$ 위의 점 사이의 거리의 최솟값에 의해 결정된다. 즉, 점 $\mathrm T$와 원 $\alpha$의 중심 $\mathrm C$를 연결한 선분 $\mathrm{CT}$와 원 $\alpha$가 만나는 점을 $\mathrm G$라고 하면, 점 $\mathrm P$와 원 $\alpha$ 위의 점 사이의 거리의 최솟값은 $\overline{\mathrm{PG}}$이다.
      criteria: [3.M1]
    - id: 3b-2
      content: |
        $\overline{\mathrm{PG}}^2=\overline{\mathrm{PT}}^2+\overline{\mathrm{TG}}^2$에서 $\overline{\mathrm{PT}}=\sqrt{2^2+4^2+4^2}=6$이므로 $\overline{\mathrm{TG}}$의 값을 구하면 된다. $\overline{\mathrm{CT}}=\sqrt{4^2+2^2+4^2}=6$이고 $\overline{\mathrm{CG}}=r=4$이므로 $\overline{\mathrm{TG}}=2$이다.
      criteria: [3.M2]
    - id: 3b-3
      content: |
        따라서 점 $\mathrm P$와 원 $\alpha$ 위의 점 사이의 거리의 최솟값은
        $$\overline{\mathrm{PG}}=\sqrt{6^2+2^2}=2\sqrt{10}.$$
      criteria: [3.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: 최솟값을 주는 점이 선분 $\mathrm{CT}$와 원의 교점 $\mathrm G$임을 근거($\overline{\mathrm{PX}}^2=\overline{\mathrm{PT}}^2+\overline{\mathrm{TX}}^2$)와 함께 밝혔다.
      steps: [3b-1]
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: $\overline{\mathrm{PT}}=6$, $\overline{\mathrm{CT}}=6$, $\overline{\mathrm{CG}}=4$로 $\overline{\mathrm{TG}}=2$를 구했다.
      steps: [3b-2]
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: 최솟값 $2\sqrt{10}$.
      depends_on: [3.M1, 3.M2]
      cao: true
      steps: [3b-3]
    deductions:
    - code: D3-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 3
  outcome_codes:
  - {code: '20', meaning: 만점}

