key_idea: '$f''(x)=e^{-x^2}$이므로 $A(\alpha)=\alpha f(\alpha)-\displaystyle\int_0^\alpha xe^{-x^2}dx=\alpha f(\alpha)-\dfrac12(1-e^{-\alpha^2})$, $B(\alpha)=\alpha f(\alpha)-A(\alpha)$, 극한은 $\dfrac{f(\alpha)}\alpha\to f''(0)=1$과 $\dfrac{1-e^{-\alpha^2}}{\alpha^2}\to1$.'
stuck: 닫힌 형태가 없는 $f(x)$를 직접 적분하지 않고 부분적분에서 $f'(x)=e^{-x^2}$만 쓰는 발상
