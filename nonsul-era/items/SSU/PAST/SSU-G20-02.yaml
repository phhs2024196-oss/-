key_idea: '$2\alpha f(x)f''(x)=\dfrac{d}{dx}\left[\alpha\{f(x)\}^2\right]$이므로 $x>0$에서 $g=\alpha f^2+C$, $x=0$에서의 연속성으로 $C=5-\alpha^3$. $g$는 $[-1,1]$에서 증가하므로 최솟값 $g(-1)=1-\alpha^3$, 넓이 $S(\alpha)=-2\alpha^3+3\alpha+7$.'
stuck: $g'(x)=2\alpha f(x)f'(x)$를 합성함수 미분의 결과로 보고 $g$를 복원한 뒤, $x=0$에서의 연속성으로 적분상수를 정하는 단계
