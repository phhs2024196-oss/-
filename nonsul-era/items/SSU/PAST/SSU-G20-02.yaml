stimuli:
- label: 제시문
  body: |
    미분가능한 두 함수 $y=h(u)$, $u=k(x)$에 대하여 합성함수 $y=h(k(x))$는 미분가능하고, 그 도함수는
    $$\dfrac{dy}{dx}=\dfrac{dy}{du}\cdot\dfrac{du}{dx}\quad\text{또는}\quad\{h(k(x))\}'=h'(k(x))k'(x)$$
    【출처: 미적분Ⅱ 「여러 가지 미분법」】

stem: |
  함수 $f(x)$는 미분가능한 증가함수이고, $f(0)=0$, $f(1)=2$, $\displaystyle\int_0^1\{f(x)\}^2dx=3$이다.
  미분가능한 함수 $g(x)$는 음이 아닌 실수 $\alpha\ (\alpha\ge0)$에 대하여 조건 (i), (ii)를 만족한다.

  (i) $x>0$일 때, $g'(x)=2\alpha f(x)f'(x)$

  (ii) $x\le0$일 때, $g(x)=-\{f(-x)\}^2+(5-\alpha^3)$

  이때 다음 문항에 답하시오.

subparts:
- id: '1'
  stem: |
    닫힌 구간 $[-1,1]$에서 부등식 $g(x)\ge0$이 성립하도록 하는 음이 아닌 실수 $\alpha$의 값의 범위를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: set, value: 'Interval(0, 1)', equivalents: ['0\le\alpha\le1'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x>0$에서 $g=\alpha f^2+(5-\alpha^3)$, $g$는 $[-1,1]$에서 증가이므로 $g(-1)=1-\alpha^3\ge0$.
    steps:
    - {id: 1a, content: '$g\ge g(-1)=1-\alpha^3\ge0\iff0\le\alpha\le1$', criteria: [1.M1, 1.M2, 1.R1, 1.A1]}
    hint_ladder:
    - $2\alpha f(x)f'(x)$는 어떤 함수의 도함수인가?
    - $g$는 미분가능하므로 $x=0$에서 연속이다.
    - $g$가 $[-1,1]$에서 증가함수라면 최솟값은 어디서?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.90
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        제시문에 의해 $x>0$일 때 $g'(x)=2\alpha f(x)f'(x)=\dfrac{d}{dx}\left[\alpha\{f(x)\}^2\right]$이므로 $g(x)=\alpha\{f(x)\}^2+C\ (x>0)$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        미분가능한 함수는 연속이므로 $f$, $g$의 $x=0$에서의 연속성과 (ii)에서 $5-\alpha^3=g(0)=\displaystyle\lim_{x\to0+}g(x)=\alpha\{f(0)\}^2+C=C$. 따라서 $x>0$에서 $g(x)=\alpha\{f(x)\}^2+(5-\alpha^3)$, $x\le0$에서 $g(x)=-\{f(-x)\}^2+(5-\alpha^3)$ …①.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $\alpha\ge0$이고 $f$가 증가하며 $[0,1]$에서 $f\ge f(0)=0$이므로 $[0,1]$에서 $\alpha\{f(x)\}^2$과 $g$는 증가함수(또는 상수함수)이다. $[-1,0]$에서는 $\{f(-x)\}^2$이 감소함수이므로 $-\{f(-x)\}^2$과 $g$가 증가함수이다. 따라서 $[-1,1]$에서 $g$는 $x=-1$일 때 최소이고 $g(x)\ge g(-1)=-\{f(1)\}^2+5-\alpha^3=1-\alpha^3$.
      criteria: [1.R1]
    - id: 1b-4
      content: |
        $g(x)\ge0$이 $[-1,1]$에서 성립할 조건은 $1-\alpha^3\ge0$이므로 $0\le\alpha\le1$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 제시문을 써서 $x>0$에서 $g(x)=\alpha\{f(x)\}^2+C$를 얻었다.
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $x=0$에서의 연속성으로 $C=5-\alpha^3$을 정했다.
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: $[-1,0]$과 $[0,1]$에서 각각 $g$가 증가함을 근거와 함께 밝혀 최솟값이 $g(-1)=1-\alpha^3$임을 보였다.
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $0\le\alpha\le1$.
      depends_on: [1.R1]
      cao: true
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0728}
  misconceptions:
  - id: MC-CAL-0728
    outcome_code: '71'
    wrong_work: '$x>0$에서 $g(x)=\alpha\{f(x)\}^2$으로 적분상수를 빠뜨림'
    detect_cue: $x>0$인 식에 $5-\alpha^3$이 없음
    feedback: 도함수로부터 함수를 구하면 적분상수가 생깁니다. $g$가 $x=0$에서 연속이라는 조건으로 상수를 정하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    문항 (1)에서 구한 $\alpha$의 값의 범위에서, 곡선 $y=g(x)$와 $x$축 및 $x=-1$, $x=1$로 둘러싸인 도형의 넓이를 최대로 하는 $\alpha$의 값을 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '1/sqrt(2)', equivalents: ['\dfrac{\sqrt2}2'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g\ge0$이므로 $S(\alpha)=\displaystyle\int_{-1}^1g=(\alpha-1)\int_0^1f^2+10-2\alpha^3=-2\alpha^3+3\alpha+7$, $S'=0$에서 $\alpha=\dfrac1{\sqrt2}$.
    steps:
    - {id: 2a, content: '$S(\alpha)=-2\alpha^3+3\alpha+7$, $S''(\alpha)=-6\alpha^2+3$, $\alpha=\dfrac1{\sqrt2}$', criteria: [2.M1, 2.A1, 2.M2, 2.A2]}
    hint_ladder:
    - $[-1,0]$의 적분은 $x\to-x$ 치환으로 $\displaystyle\int_0^1\{f(x)\}^2dx$로 바꿀 수 있다.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.90
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $0\le\alpha\le1$이면 $[-1,1]$에서 $g\ge0$이므로 ①과 치환적분($x\to-x$)을 이용하면
        $S(\alpha)=\displaystyle\int_{-1}^1\lvert g(x)\rvert\,dx=\int_{-1}^0\left(-\{f(-x)\}^2+5-\alpha^3\right)dx+\int_0^1\left(\alpha\{f(x)\}^2+5-\alpha^3\right)dx=(\alpha-1)\int_0^1\{f(x)\}^2dx+10-2\alpha^3$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $\displaystyle\int_0^1\{f(x)\}^2dx=3$이므로 $S(\alpha)=-2\alpha^3+3\alpha+7$.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        $S'(\alpha)=-6\alpha^2+3$이므로 $0\le\alpha\le1$에서 $S'(\alpha)=0$인 것은 $\alpha=\dfrac1{\sqrt2}$. $0\le\alpha<\dfrac1{\sqrt2}$에서 $S'>0$, $\dfrac1{\sqrt2}<\alpha\le1$에서 $S'<0$이고 $S(0)=7$, $S\left(\dfrac1{\sqrt2}\right)=7+\sqrt2$, $S(1)=8$.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        따라서 $S(\alpha)$는 $\alpha=\dfrac1{\sqrt2}$에서 최댓값을 갖는다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 넓이를 두 구간의 정적분으로 세우고 $[-1,0]$의 적분을 $\displaystyle\int_0^1\{f(x)\}^2dx$로 바꾸었다.
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $S(\alpha)=-2\alpha^3+3\alpha+7$.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: $S'(\alpha)=-6\alpha^2+3$의 부호로 $0\le\alpha\le1$에서 증감을 조사했다(끝점 값 비교 포함).
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: $\alpha=\dfrac1{\sqrt2}$.
      depends_on: [2.M2]
      cao: true
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-0729}
  misconceptions:
  - id: MC-CAL-0729
    outcome_code: '72'
    wrong_work: '$\displaystyle\int_{-1}^0\{f(-x)\}^2dx$를 $-\int_0^1\{f(x)\}^2dx$로 부호를 잘못 바꾸어 $S(\alpha)=-2\alpha^3+3\alpha+13$ 등 틀린 식을 얻음'
    detect_cue: $S(\alpha)$의 상수항이 $7$이 아님
    feedback: $t=-x$로 치환하면 $dx=-dt$와 적분 구간의 뒤집힘으로 부호가 두 번 바뀌어 $\displaystyle\int_{-1}^0\{f(-x)\}^2dx=\int_0^1\{f(t)\}^2dt$입니다.
    remedy: [RL-2]

