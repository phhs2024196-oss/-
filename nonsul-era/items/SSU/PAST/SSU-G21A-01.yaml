stimuli:
- label: 제시문
  body: |
    수직선 위를 움직이는 점 P의 시각 $t$에서의 속도가 $v(t)$이고 시각 $t=a$에서 점 P의 위치가 $x_0$일 때, 시각 $t=b$에서 점 P의 위치 $x$는
    $$x=x_0+\int_a^b v(t)\,dt$$
    【출처: 수학Ⅱ 「정적분의 활용」】

stem: |
  원점에서 출발하여 수직선 위를 움직이는 두 점 A와 B는 다음 조건을 모두 만족한다.

  (i) 점 A의 시각 $t$에서의 속도는 $6t-2$이다.

  (ii) 점 B의 시각 $t$에서의 위치는 점 A의 시각 $t^2$에서의 위치와 같다.

  다음 문항에 답하시오.

subparts:
- id: '1'
  stem: |
    두 점 A와 B가 시각 $t=0$ 이후에 만나는 시각을 모두 구하시오.
  points: 12
  depends_on: []
  answer: {kind: set, value: '[(sqrt(33)-3)/6, 1]', equivalents: ['t=\dfrac{-3+\sqrt{33}}{6},\ t=1'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $A(t)=3t^2-2t$, $B(t)=3t^4-2t^2$의 차 $t(t-1)(3t^2+3t-2)$의 양의 근.
    steps:
    - {id: 1a, content: '$d(t)=3t^4-5t^2+2t=t(t-1)(3t^2+3t-2)=0$의 양수 해 $t=\dfrac{\sqrt{33}-3}{6},\ 1$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - 제시문으로 점 A의 위치를 시각 $t$의 식으로 써 보자.
    - 점 B의 위치는 점 A의 위치 식에 무엇을 대입한 것인가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.76
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 A는 원점에서 출발하므로 제시문에 의해 $A(t)=0+\displaystyle\int_0^t(6s-2)\,ds=3t^2-2t$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        조건 (ii)에서 $B(t)=A(t^2)=3t^4-2t^2$. 두 점이 만나는 것은 $d(t)=B(t)-A(t)=3t^4-5t^2+2t=0$일 때이다.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $d(t)=t(3t^3-5t+2)=t(t-1)(3t^2+3t-2)$이고 $3t^2+3t-2=0$의 근은 $t=\dfrac{-3\pm\sqrt{33}}{6}$이다. $t=0$은 출발 시각이므로, $t>0$에서 만나는 시각은 $t=\dfrac{-3+\sqrt{33}}{6}$, $t=1$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 제시문의 식으로 점 A의 위치 $A(t)=3t^2-2t$를 구했다.
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $B(t)=A(t^2)=3t^4-2t^2$로 놓고 $B(t)=A(t)$인 방정식을 세웠다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $t(t-1)(3t^2+3t-2)=0$으로 인수분해하여 양수 해 $\dfrac{-3+\sqrt{33}}{6}$, $1$을 모두 구했다.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0710}
  misconceptions:
  - id: MC-CAL-0710
    outcome_code: '71'
    wrong_work: '점 B의 속도를 $6t^2-2$로 보고 $B(t)=2t^3-2t$로 적분'
    detect_cue: $B(t)$에 $t^3$ 항이 있음
    feedback: 조건 (ii)는 위치에 대한 조건입니다. 속도 식이 아니라 위치 식 $A(t)$에 $t^2$을 대입하세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    두 점 A와 B가 시각 $t=0$ 이후에 마지막으로 만날 때까지 두 점 사이의 거리가 최대가 되는 시각과 그 때 두 점 사이의 거리를 구하시오.
  points: 18
  depends_on: ['1']
  answer: {kind: value, value: '[(3+sqrt(3))/6, (1+2*sqrt(3))/12]', equivalents: ['시각 $\dfrac{3+\sqrt3}{6}$, 거리 $\dfrac{1+2\sqrt3}{12}$'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $d'(t)=2(t+1)(6t^2-6t+1)$의 근 $t_{1,2}=\dfrac{3\mp\sqrt3}{6}$에서 $d(t_1)=\dfrac{2\sqrt3-1}{12}$, $d(t_2)=-\dfrac{1+2\sqrt3}{12}$이고 절댓값은 $t_2$ 쪽이 크다.
    steps:
    - {id: 2a, content: '$\lvert d(t_2)\rvert=\dfrac{1+2\sqrt3}{12}>\lvert d(t_1)\rvert$, 최대 시각 $t_2=\dfrac{3+\sqrt3}{6}$', criteria: [2.M1, 2.M2, 2.A1, 2.R1, 2.A2]}
    hint_ladder:
    - 마지막으로 만나는 시각은 언제인가?
    - 거리는 $\lvert d(t)\rvert$이다. $d$가 음수인 구간도 있는가?
    - $6t^2-6t+1=0$의 근에서 $d$의 값을 줄여 계산하려면 $t^2=t-\dfrac16$을 이용하자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.76
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1)에서 $\dfrac{-3+\sqrt{33}}{6}<1$이므로 마지막으로 만나는 시각은 $t=1$이고, 구하는 것은 $0\le t\le1$에서 거리 $\lvert d(t)\rvert$의 최댓값이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $d'(t)=12t^3-10t+2=2(t+1)(6t^2-6t+1)$이므로 $0<t<1$에서 $d'(t)=0$인 $t$는 $t_1=\dfrac{3-\sqrt3}{6}$, $t_2=\dfrac{3+\sqrt3}{6}$이고 $0<t_1<t_2<1$. $d$는 $t_1$에서 극대, $t_2$에서 극소이며 $d(0)=d(1)=0$이므로 $\lvert d\rvert$의 최댓값은 $\lvert d(t_1)\rvert$, $\lvert d(t_2)\rvert$ 중 큰 값이다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $t_i^2=t_i-\dfrac16$을 쓰면 $d(t_i)=(t_i^2-t_i)(3t_i^2+3t_i-2)=-\dfrac16\left(6t_i-\dfrac52\right)=-t_i+\dfrac5{12}$. 따라서 $d(t_1)=\dfrac{-1+2\sqrt3}{12}$, $d(t_2)=\dfrac{-1-2\sqrt3}{12}$.
      criteria: [2.A1]
    - id: 2b-4
      content: |
        $\lvert d(t_2)\rvert=\dfrac{1+2\sqrt3}{12}>\dfrac{2\sqrt3-1}{12}=\lvert d(t_1)\rvert$이므로 거리는 시각 $t=\dfrac{3+\sqrt3}{6}$에서 최대이고, 그때의 거리는 $\dfrac{1+2\sqrt3}{12}$이다.
      criteria: [2.R1, 2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 마지막으로 만나는 시각이 $t=1$임을 밝히고 구간 $[0,1]$에서 $\lvert d(t)\rvert$의 최대를 구하는 문제로 바꾸었다.
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: $d'(t)=2(t+1)(6t^2-6t+1)$에서 임계점 $t=\dfrac{3\pm\sqrt3}{6}$을 구했다.
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 4
      evidence: $d\left(\dfrac{3-\sqrt3}{6}\right)=\dfrac{2\sqrt3-1}{12}$, $d\left(\dfrac{3+\sqrt3}{6}\right)=-\dfrac{1+2\sqrt3}{12}$을 구했다.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: 거리가 $\lvert d\rvert$이므로 극댓값과 음의 극솟값의 절댓값을 비교해야 함을 적고 비교했다.
      steps: [2b-4]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: 시각 $\dfrac{3+\sqrt3}{6}$, 거리 $\dfrac{1+2\sqrt3}{12}$.
      depends_on: [2.A1, 2.R1]
      cao: true
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-0711}
  misconceptions:
  - id: MC-CAL-0711
    outcome_code: '72'
    wrong_work: '$d(t)$의 극댓값만 보고 시각 $\dfrac{3-\sqrt3}{6}$, 거리 $\dfrac{2\sqrt3-1}{12}$로 답함'
    detect_cue: 극솟값 $d(t_2)$를 계산하지 않았거나 절댓값 비교가 없음
    feedback: 거리는 $\lvert B(t)-A(t)\rvert$입니다. 차가 음수인 구간의 극솟값도 절댓값으로 비교하세요.
    remedy: [RL-2]

