stimuli:
- label: 제시문
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 미분가능한 함수 $x=g(t)$에 대하여 $a=g(\alpha)$, $b=g(\beta)$일 때 도함수 $g'(t)$가 $\alpha$, $\beta$를 포함하는 구간에서 연속이면
    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
    【출처: 미적분 「여러 가지 적분법」】

stem: |
  $0\le x\le2$에서 정의된 증가함수 $f(x)$는 $2$보다 큰 실수 $a$에 대하여 다음 조건을 모두 만족한다.

  (i) $f(x)$는 닫힌구간 $[0,2]$에서 연속이고 열린구간 $(0,2)$에서 미분가능하다.

  (ii) $f(0)=0$

  (iii) 닫힌구간 $[0,1]$에 속하는 모든 $x$에 대하여 $f(1+x)+af(1-x)=3$ (단, $a>2$)

  (iv) $\displaystyle\int_0^2f(x)\,dx=2$

  함수 $f(x)$의 역함수를 $g(x)$라고 할 때, 정적분 $\displaystyle\int_0^{f(1)}g(x)\,dx$가 최대가 되는 실수 $a$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    $\displaystyle\int_0^{f(1)}g(x)\,dx$가 최대가 되는 $a$의 값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '2+sqrt(3)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $h(a)=f(1)-\int_0^1f=\dfrac3{a+1}-\dfrac1{a-1}=\dfrac{2a-4}{a^2-1}$, $h'(a)=0\iff a^2-4a+1=0$, $a>2$에서 $a=2+\sqrt3$.
    steps:
    - {id: 1a, content: '$h(a)=\dfrac{2a-4}{a^2-1}$, $h''(a)=\dfrac{-2(a^2-4a+1)}{(a^2-1)^2}$, 최대 $a=2+\sqrt3$', criteria: [1.M1, 1.B1, 1.M2, 1.A1, 1.M3, 1.A2]}
    hint_ladder:
    - $y=f(x)$의 그래프에서 $\int_0^{f(1)}g(x)\,dx$는 어떤 넓이인가?
    - (iii)에 $x=0$을 넣으면 무엇을 알 수 있는가?
    - (iii)의 양변을 $0$부터 $1$까지 적분해 보자.
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.77
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f$는 증가하고 $f(0)=0$이므로 $y=f(x)$의 그래프에서 $\displaystyle\int_0^1f(x)\,dx$는 그래프 아래, $\displaystyle\int_0^{f(1)}g(x)\,dx$는 그래프 왼쪽(y축 쪽)의 넓이이고 두 넓이의 합은 가로 $1$, 세로 $f(1)$인 직사각형의 넓이이다. 따라서 $\displaystyle\int_0^{f(1)}g(x)\,dx=f(1)-\int_0^1f(x)\,dx$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        (iii)에 $x=0$을 대입하면 $(1+a)f(1)=3$, 즉 $f(1)=\dfrac3{a+1}$.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        (iii)의 양변을 $0$부터 $1$까지 적분하면 $\displaystyle\int_0^1f(1+x)\,dx+a\int_0^1f(1-x)\,dx=3$. 제시문의 치환적분($u=1+x$, $u=1-x$)으로 $\displaystyle\int_0^1f(1+x)\,dx=\int_1^2f(u)\,du$, $\displaystyle\int_0^1f(1-x)\,dx=\int_0^1f(u)\,du$.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        $I=\displaystyle\int_0^1f(x)\,dx$라 하면 (iv)에서 $\displaystyle\int_1^2f=2-I$이므로 $2-I+aI=3$, 즉 $I=\dfrac1{a-1}$.
      criteria: [1.A1]
    - id: 1b-5
      content: |
        $h(a)=\dfrac3{a+1}-\dfrac1{a-1}=\dfrac{2a-4}{a^2-1}$ $(a>2)$. $h'(a)=\dfrac{2(a^2-1)-2a(2a-4)}{(a^2-1)^2}=\dfrac{-2(a^2-4a+1)}{(a^2-1)^2}$이고 $a>2$에서 $h'(a)=0$인 것은 $a=2+\sqrt3$뿐이다.
      criteria: [1.M3]
    - id: 1b-6
      content: |
        $2<a<2+\sqrt3$에서 $h'(a)>0$, $a>2+\sqrt3$에서 $h'(a)<0$이므로 $h$는 $a=2+\sqrt3$에서 최대(최댓값 $2-\sqrt3$). 답: $a=2+\sqrt3$.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $\displaystyle\int_0^{f(1)}g(x)\,dx=1\cdot f(1)-\int_0^1f(x)\,dx$ 관계를 근거(넓이 또는 치환)와 함께 적었다.
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $f(1)=\dfrac3{a+1}$.
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: (iii)을 $[0,1]$에서 적분하고 치환으로 $\displaystyle\int_1^2f+a\int_0^1f=3$을 얻었다.
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: (iv)와 결합하여 $\displaystyle\int_0^1f(x)\,dx=\dfrac1{a-1}$.
      depends_on: [1.M2]
      steps: [1b-4]
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: $h(a)=\dfrac{2a-4}{a^2-1}$을 미분하여 $h'(a)=0$인 $a$를 구했다.
      steps: [1b-5]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: 증감을 확인하여 $a=2+\sqrt3$에서 최대임을 밝혔다.
      depends_on: [1.M3]
      cao: true
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
    - code: D1-2
      condition: $a>2$ 조건으로 $a=2-\sqrt3$을 제외하는 근거 누락
      effect: minus
      value: 2
