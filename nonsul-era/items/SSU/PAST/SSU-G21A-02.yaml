    wrong_work: '$\displaystyle\int_0^{f(1)}g(x)\,dx=\int_0^1f(x)\,dx$로 놓음(역함수 그래프가 대칭이므로 넓이가 같다고 착각)'
    detect_cue: 직사각형 넓이 $1\cdot f(1)$이 식에 없음
    feedback: 역함수의 정적분은 $y=f(x)$ 그래프의 y축 쪽 넓이입니다. 직사각형 넓이에서 그래프 아래 넓이를 빼세요.
    remedy: [RL-1]
  - id: MC-CAL-0713
    outcome_code: '72'
