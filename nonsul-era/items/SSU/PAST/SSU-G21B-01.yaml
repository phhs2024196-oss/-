stimuli:
- label: 제시문
  body: |
    함수 $f(x)$가 임의의 세 실수 $a,b,c$를 포함하는 구간에서 연속일 때
    $$\int_a^cf(x)\,dx+\int_c^bf(x)\,dx=\int_a^bf(x)\,dx$$
    【출처: 수학Ⅱ 「부정적분과 정적분」】

stem: |
  주기가 $1$인 주기함수 $f(x)$는 $0\le x\le1$에서 $f(x)=a-\lvert2x-1\rvert$이다. 함수 $g(x)$를 다음과 같이 정의하자. ($[x]$는 $x$를 넘지 않는 최대의 정수이다.)
  $$g(x)=\dfrac{f(x)}{[x+1][x+2]}\quad(x\ge0)$$
  다음 문항에 답하시오.

subparts:
- id: '1'
  stem: |
    임의의 자연수 $k$에 대하여, 함수 $g(x)$가 $x=k$에서 연속이 되도록 상수 $a$의 값을 정하시오.
  points: 9
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f$는 연속($f(0)=f(1)=a-1$)이므로 $x=k$의 좌·우극한은 $\dfrac{a-1}{k(k+1)}$, $\dfrac{a-1}{(k+1)(k+2)}$. 같으려면 $a=1$.
    steps:
    - {id: 1a, content: '$\dfrac{a-1}{k(k+1)}=\dfrac{a-1}{(k+1)(k+2)}\iff a=1$', criteria: [1.B1, 1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - $x$가 $k$보다 조금 작을 때와 조금 클 때 $[x+1]$의 값은 각각 무엇인가?
    - $f(x)$ 자체는 정수점에서 연속인가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.79
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $0\le x\le1$에서 $f(x)=a-\lvert2x-1\rvert$이고 $f(0)=f(1)=a-1$이므로 주기 $1$로 이어 붙인 $f$는 실수 전체에서 연속이고 $f(k)=a-1$.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $k-1\le x<k$이면 $[x+1]=k$, $[x+2]=k+1$이므로 $\displaystyle\lim_{x\to k-}g(x)=\dfrac{f(k)}{k(k+1)}=\dfrac{a-1}{k(k+1)}$.
        $k\le x<k+1$이면 $[x+1]=k+1$, $[x+2]=k+2$이므로 $\displaystyle\lim_{x\to k+}g(x)=g(k)=\dfrac{a-1}{(k+1)(k+2)}$.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $x=k$에서 연속이려면 $\dfrac{a-1}{k(k+1)}=\dfrac{a-1}{(k+1)(k+2)}$. $k(k+1)\ne(k+1)(k+2)$이므로 $a-1=0$이어야 한다.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        따라서 $a=1$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: $f$가 연속이고 $f(k)=a-1$임을 적었다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 가우스 기호의 값을 구간별로 정해 $x=k$에서의 좌극한과 우극한(함숫값)을 각각 구했다.
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: 좌극한 $=$ 우극한 $=$ 함숫값 조건으로 $a-1=0$을 이끌었다.
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: $a=1$.
      depends_on: [1.M2]
      cao: true
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0715}
  misconceptions:
  - id: MC-CAL-0715
    outcome_code: '71'
    wrong_work: '$x\to k-$에서도 $[x+1]=k+1$, $[x+2]=k+2$로 두어 좌극한과 우극한이 항상 같다고 결론'
    detect_cue: 좌극한 분모가 $(k+1)(k+2)$, 「모든 $a$」 또는 $a$를 정하지 못함
    feedback: 가우스 기호는 정수에서 값이 뛰므로 $x\to k-$일 때 $[x+1]=k$입니다. 왼쪽 구간의 값을 따로 쓰세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    문항 (1)에서 구한 상수 $a$에 대하여, $n$이 자연수일 때 $\displaystyle\int_0^ng(x)\lvert\sin\pi x\rvert\,dx$를 $n$의 식으로 나타내시오.
  points: 21
  depends_on: ['1']
  answer: {kind: expression, value: '4*n/(pi**2*(n+1))', equivalents: ['\dfrac{4n}{\pi^2(n+1)}'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $[k-1,k)$에서 $g=\dfrac{f}{k(k+1)}$이고 $\displaystyle\int_{k-1}^kf\lvert\sin\pi x\rvert\,dx=\int_0^1f(t)\sin\pi t\,dt=\int_0^{1/2}4t\sin\pi t\,dt=\dfrac4{\pi^2}$.
    steps:
    - {id: 2a, content: '$\displaystyle\sum_{k=1}^n\dfrac1{k(k+1)}\cdot\dfrac4{\pi^2}=\dfrac4{\pi^2}\cdot\dfrac n{n+1}$', criteria: [2.M1, 2.M2, 2.M3, 2.A1, 2.M4, 2.A2]}
    hint_ladder:
    - 제시문으로 $[0,n]$을 길이 1인 구간들로 나누자.
    - $x=t+(k-1)$로 치환하면 $f$와 $\lvert\sin\pi x\rvert$는 어떻게 되는가?
    - $\left[\dfrac12,1\right]$의 적분은 $u=1-t$로 바꾸어 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.80
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $a=1$이면 $0\le x\le1$에서 $f(x)=1-\lvert2x-1\rvert$, 즉 $0\le x\le\dfrac12$에서 $2x$, $\dfrac12\le x\le1$에서 $2-2x$. 제시문에 의해 $\displaystyle\int_0^ng(x)\lvert\sin\pi x\rvert\,dx=\sum_{k=1}^n\int_{k-1}^kg(x)\lvert\sin\pi x\rvert\,dx$이고 $k-1\le x<k$에서 $g(x)=\dfrac{f(x)}{k(k+1)}$이므로 $=\displaystyle\sum_{k=1}^n\dfrac1{k(k+1)}\int_{k-1}^kf(x)\lvert\sin\pi x\rvert\,dx$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $x=t+(k-1)$로 치환하면 주기성에서 $f(t+k-1)=f(t)$, $\lvert\sin\pi(t+k-1)\rvert=\lvert\sin\pi t\rvert=\sin\pi t\ (0\le t\le1)$이므로 $\displaystyle\int_{k-1}^kf(x)\lvert\sin\pi x\rvert\,dx=\int_0^1f(t)\sin\pi t\,dt$ ($k$와 무관).
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $\displaystyle\int_{1/2}^1(2-2t)\sin\pi t\,dt$에서 $u=1-t$로 치환하면 $\displaystyle\int_0^{1/2}2u\sin\pi u\,du$이므로 $\displaystyle\int_0^1f(t)\sin\pi t\,dt=\int_0^{1/2}4t\sin\pi t\,dt$. 부분적분으로 $=\left[-\dfrac{4t}\pi\cos\pi t\right]_0^{1/2}+\dfrac4\pi\int_0^{1/2}\cos\pi t\,dt=0+\dfrac4{\pi^2}\left[\sin\pi t\right]_0^{1/2}=\dfrac4{\pi^2}$.
      criteria: [2.M3, 2.A1]
    - id: 2b-4
      content: |
        $\displaystyle\sum_{k=1}^n\dfrac1{k(k+1)}=\sum_{k=1}^n\left(\dfrac1k-\dfrac1{k+1}\right)=1-\dfrac1{n+1}=\dfrac n{n+1}$이므로 구하는 값은 $\dfrac4{\pi^2}\cdot\dfrac n{n+1}=\dfrac{4n}{\pi^2(n+1)}$.
      criteria: [2.M4, 2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 적분 구간을 $[k-1,k]$로 나누고 각 구간에서 $g(x)=\dfrac{f(x)}{k(k+1)}$로 바꾸었다.
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: 치환과 주기성으로 각 구간의 적분이 $\displaystyle\int_0^1f(t)\sin\pi t\,dt$로 같음을 보였다.
      steps: [2b-2]
    - id: 2.M3
      mark_type: M
      points: 4
      evidence: 부분적분(또는 대칭 치환 후 부분적분)으로 $\displaystyle\int_0^1f(t)\sin\pi t\,dt$를 계산하는 식을 세웠다.
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: $\dfrac4{\pi^2}$.
      depends_on: [2.M3]
      steps: [2b-3]
    - id: 2.M4
      mark_type: M
      points: 3
      evidence: $\dfrac1{k(k+1)}=\dfrac1k-\dfrac1{k+1}$로 합을 $\dfrac n{n+1}$로 구했다.
      steps: [2b-4]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: $\dfrac{4n}{\pi^2(n+1)}$.
      depends_on: [2.A1, 2.M4]
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-0716}
  misconceptions:
  - id: MC-CAL-0716
    outcome_code: '72'
    wrong_work: '$\lvert\sin\pi x\rvert$의 절댓값을 무시하고 $\displaystyle\int_{k-1}^kf(x)\sin\pi x\,dx=(-1)^{k-1}\dfrac4{\pi^2}$로 교대합을 만듦'
    detect_cue: 합에 $(-1)^{k-1}$이 있음
    feedback: $\lvert\sin\pi x\rvert$는 주기 1인 함수입니다. 치환 후 $\lvert\sin\pi t\rvert=\sin\pi t\ (0\le t\le1)$가 되어 모든 구간의 적분이 같습니다.
    remedy: [RL-2]

