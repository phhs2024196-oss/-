stimuli:
- label: 제시문
  body: |
    두 함수 $f(x)$, $g(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 두 곡선 $y=f(x)$, $y=g(x)$ 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는
    $$S=\int_a^b\lvert f(x)-g(x)\rvert\,dx$$
    【출처: 수학Ⅱ 「정적분의 활용」】

stem: |
  곡선 $C:y=x^3+ax$ 위의 점 $P$에서의 접선 $\ell$과 곡선 $C$가 만나는 다른 점을 $Q$라고 하자. 선분 $PQ$의 중점 $R$의 $x$좌표를 $b$라고 할 때, 다음 문항에 답하시오.

subparts:
- id: '1'
  stem: |
    점 $P$와 점 $Q$의 $x$좌표를 각각 $b$의 식으로 나타내시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: '[-2*b, 4*b]', equivalents: ['P의 $x$좌표 $-2b$, Q의 $x$좌표 $4b$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접점 $t$에서 $x^3+ax-\ell(x)=(x-t)^2(x+2t)$, $Q=-2t$, $b=-\dfrac t2$.
    steps:
    - {id: 1a, content: '$t=-2b$, $Q$의 $x$좌표 $-2t=4b$', criteria: [1.M1, 1.M2, 1.A1, 1.A2]}
    hint_ladder:
    - 접선의 방정식을 세우고 곡선과 연립해 보자.
    - 접점의 $x$좌표는 몇 중근인가?
  - id: S1-B
    audience: B
    source_flow: 해설교재 p.81
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $P(t,\ t^3+at)$라 하면 $y'=3x^2+a$이므로 $\ell:y=(3t^2+a)(x-t)+t^3+at=(3t^2+a)x-2t^3$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $x^3+ax=(3t^2+a)x-2t^3\iff x^3-3t^2x+2t^3=0\iff(x-t)^2(x+2t)=0$. $Q$가 $P$와 다른 점이므로 $t\ne0$이고 $Q$의 $x$좌표는 $-2t$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $b=\dfrac{t+(-2t)}2=-\dfrac t2$이므로 $t=-2b$. 따라서 $P$의 $x$좌표는 $-2b$, $Q$의 $x$좌표는 $4b$.
      criteria: [1.A1, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 접선 $\ell$의 방정식 $y=(3t^2+a)x-2t^3$을 세웠다.
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 연립하여 $(x-t)^2(x+2t)=0$을 얻고 $Q$의 $x$좌표를 $-2t$로 구했다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $b=-\dfrac t2$, $P$의 $x$좌표 $-2b$.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $Q$의 $x$좌표 $4b$.
      depends_on: [1.M2]
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-0717}
  misconceptions:
  - id: MC-ALG-0717
    outcome_code: '71'
    wrong_work: '$x^3-3t^2x+2t^3=0$을 $x=t$로 한 번만 나누고 남은 이차식의 근을 $Q$로 잘못 구함(예: $Q=-t$)'
    detect_cue: $Q$의 $x$좌표가 $-2t$가 아님, 중근 언급 없음
    feedback: 접점은 곡선과 접선의 교점 방정식의 중근입니다. $(x-t)^2$을 인수로 가지므로 나머지 근은 근과 계수의 관계로 $-2t$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    곡선 $C$와 선분 $PR$ 및 직선 $x=b$로 둘러싸인 도형의 넓이를 $K$, 곡선 $C$와 선분 $QR$ 및 직선 $x=b$로 둘러싸인 도형의 넓이를 $L$이라 할 때, 극한값 $\displaystyle\lim_{b\to\infty}\dfrac KL$을 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '5/11', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 직선$-$곡선 $=(x+2b)^2(4b-x)\ge0$ ($-2b\le x\le4b$)이므로 $K=\dfrac{135}4b^4$, $L=\dfrac{297}4b^4$.
    steps:
    - {id: 2a, content: '$K/L=135/297=5/11$', criteria: [2.M1, 2.A1, 2.A2, 2.A3]}
    hint_ladder:
    - 선분 $PR$, $QR$은 모두 접선 $\ell$ 위에 있다.
    - 접선과 곡선의 차를 (1)의 인수분해로 써 보자.
  - id: S2-B
    audience: B
    source_flow: 해설교재 p.81
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $b>0$이라 하자($b\to\infty$). $t=-2b$이므로 $\ell:y=(12b^2+a)x+16b^3$이고, 선분 $PR$, $QR$은 $\ell$ 위에 있다. (1)에서 $\ell(x)-(x^3+ax)=-(x+2b)^2(x-4b)=(x+2b)^2(4b-x)\ge0\ (-2b\le x\le4b)$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        제시문에 의해 $K=\displaystyle\int_{-2b}^b(-x^3+12b^2x+16b^3)\,dx=\left[-\dfrac{x^4}4+6b^2x^2+16b^3x\right]_{-2b}^b=\dfrac{135}4b^4$.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        $L=\displaystyle\int_b^{4b}(-x^3+12b^2x+16b^3)\,dx=\left[-\dfrac{x^4}4+6b^2x^2+16b^3x\right]_b^{4b}=\dfrac{297}4b^4$.
      criteria: [2.A2]
    - id: 2b-4
      content: |
        $\dfrac KL=\dfrac{135}{297}=\dfrac5{11}$ (모든 $b>0$에서 일정)이므로 $\displaystyle\lim_{b\to\infty}\dfrac KL=\dfrac5{11}$.
      criteria: [2.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: $K$, $L$을 접선과 곡선의 차 $(x+2b)^2(4b-x)$(또는 $-x^3+12b^2x+16b^3$)의 정적분으로 세웠다.
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $K=\dfrac{135}4b^4$.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: $L=\dfrac{297}4b^4$.
      depends_on: [2.M1]
      steps: [2b-3]
    - id: 2.A3
      mark_type: A
      points: 1
      evidence: $\dfrac5{11}$.
      depends_on: [2.M1, 2.A1, 2.A2]
      cao: true
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 3
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-0718}
  misconceptions:
  - id: MC-CAL-0718
    outcome_code: '72'
    wrong_work: '$K$를 곡선과 $x$축 사이 넓이로 계산하거나 $\displaystyle\int(\text{곡선}-\text{직선})$의 부호를 반대로 써서 음수 넓이를 얻음'
    detect_cue: $K$ 또는 $L$이 음수이거나 $a$가 남아 있음
    feedback: 두 도형은 곡선과 접선(선분) 사이의 영역입니다. 구간에서 어느 쪽이 위인지 확인하고 (위)$-$(아래)를 적분하세요.
    remedy: [RL-2]

