    method_no: 1
    key_idea: '$f''(3)g''(2)=1$, $g''(1)=\dfrac23g''(2)$를 곱하면 $\dfrac23$.'
    steps:
    - id: 1a
      content: '$f''(3)\times g''(1)=\dfrac1{g''(2)}\times\dfrac23g''(2)=\dfrac23$'
      criteria:
      - 1.B1
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - '$g(2)$의 값은?'
    - '(ii)를 미분해 $x=2$를 대입하자.'
    - '$g(x)=\dfrac13g(2x)$를 미분하면?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.57
    steps:
    - id: 1b-1
      content: '모든 $x\ge0$에 대하여 $g(2x)=3g(x)$이므로 $x=1$일 때 $g(2)=3g(1)=3$.'
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        합성함수의 미분법에 의해 $f'(g(x))g'(x)=1$이므로 $x=2$를 대입하면
        $$f'(g(2))g'(2)=f'(3)g'(2)=1,\quad f'(3)=\dfrac1{g'(2)}$$
      criteria:
      - 1.M1
    - id: 1b-3
      content: '$g(x)=\dfrac13g(2x)$의 양변을 $x$에 대하여 미분하면 $g''(x)=\dfrac23g''(2x)$이고, $x=1$을 대입하면 $g''(1)=\dfrac23g''(2)$.'
      criteria:
      - 1.M2
    - id: 1b-4
      content: '따라서 $f''(3)\times g''(1)=\dfrac1{g''(2)}\times\dfrac23g''(2)=\dfrac23$.'
      criteria:
      - 1.A1
