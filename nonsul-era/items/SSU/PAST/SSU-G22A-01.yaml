stimuli:
- label: 제시문
  body: |
    두 함수 $y=f(u)$, $u=g(x)$가 미분 가능할 때, 합성함수 $y=f(g(x))$도 미분가능하며 그 도함수는
    $$\dfrac{dy}{dx}=\dfrac{dy}{du}\times\dfrac{du}{dx}\ \text{ 또는 }\ y'=f'(g(x))g'(x)$$
    【출처: 미적분 「합성함수의 미분법」】
stem: |
  구간 $[0,\infty)$에서 연속이고 구간 $(0,\infty)$에서 미분가능한 두 함수 $f(x)$, $g(x)$는 다음 조건을 모두 만족시킨다.

  (i) $g(1)=1$이고 모든 $x\ge0$에 대하여 $g(2x)=3g(x)$이다.

  (ii) 모든 $x\ge0$에 대하여 $f(g(x))=x$이다.

  이때 다음 문항에 답하시오.

  (1) $f'(3)\times g'(1)$의 값을 구하시오.

  (2) $\displaystyle\int_1^2g(x)\,dx=A$일 때 $\displaystyle\int_0^1g(x)\,dx$의 값을 $A$에 대한 식으로 나타내시오.
