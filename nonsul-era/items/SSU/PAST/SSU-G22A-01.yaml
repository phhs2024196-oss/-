- id: '2'
  stem: |
    $\displaystyle\int_1^2g(x)\,dx=A$일 때 $\displaystyle\int_0^1g(x)\,dx$의 값을 $A$에 대한 식으로 나타내시오.
  points: 13
  depends_on: []
  answer:
    kind: expression
    value: A/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$B=\displaystyle\int_0^1\dfrac13g(2x)dx$에서 $2x=t$로 치환하면 $B=\dfrac16\int_0^2g(t)dt=\dfrac16(B+A)$.'
    steps:
    - id: 2a
      content: '$B=\dfrac16B+\dfrac16A\Rightarrow B=\dfrac15A$'
      criteria:
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.A2
    hint_ladder:
    - '$g(x)=\dfrac13g(2x)$를 적분해 보자.'
    - '$\int_0^2$를 $\int_0^1+\int_1^2$로 나누자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.57
    steps:
    - id: 2b-1
      content: |
        $B=\displaystyle\int_0^1g(x)\,dx$라 하자. $g(x)=\dfrac13g(2x)$이므로 $B=\displaystyle\int_0^1\dfrac13g(2x)\,dx$. $2x=t$로 놓으면 $x=0$일 때 $t=0$, $x=1$일 때 $t=2$, $\dfrac{dx}{dt}=\dfrac12$이므로
        $$B=\int_0^2\dfrac13g(t)\cdot\dfrac12\,dt=\dfrac16\int_0^2g(t)\,dt$$
      criteria:
      - 2.M1
      - 2.A1
    - id: 2b-2
      content: '$$B=\dfrac16\int_0^1g(t)\,dt+\dfrac16\int_1^2g(t)\,dt=\dfrac16B+\dfrac16A$$'
      criteria:
      - 2.M2
    - id: 2b-3
      content: '따라서 $\displaystyle\int_0^1g(x)\,dx=B=\dfrac15A$.'
      criteria:
      - 2.A2
  rubric:
