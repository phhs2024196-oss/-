stimuli:
- label: 제시문
  body: |
    함수 $f(x)$가 실수 $a$에 대하여 다음 세 조건을 모두 만족시킬 때, $f(x)$는 $x=a$에서 연속이라고 한다.

    ① 함수 $f(x)$가 $x=a$에서 정의되어 있다.

    ② 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재한다.

    ③ $\displaystyle\lim_{x\to a}f(x)=f(a)$

    【출처: 수학Ⅱ 「함수의 연속」】
stem: |
  삼차함수 $f(x)$와 이차함수 $g(x)$는 다음 조건을 모두 만족시킨다.

  (i) $f(x)$의 최고차항의 계수는 $1$이다.

  (ii) 곡선 $y=f(x)$와 곡선 $y=g(x)$의 교점은 두 개이며, 두 교점의 $x$좌표 중 더 큰 값은 $2$이다.

  (iii) 함수 $h(x)=\begin{cases}\dfrac1{x-2}\left(\dfrac{e^{f(x)}}{e^{g(x)}}-1\right) & (x\ne2)\\ 16 & (x=2)\end{cases}$ 는 연속함수이다.

  이때 곡선 $y=f(x)$와 곡선 $y=g(x)$로 둘러싸인 도형의 넓이를 구하시오.
subparts:
- id: '1'
  stem: |
    곡선 $y=f(x)$와 곡선 $y=g(x)$로 둘러싸인 도형의 넓이를 구하시오.
  points: 25
  depends_on: []
  answer:
    kind: value
    value: 64/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$p=f-g$가 $(x-a)(x-2)^2$이면 $p''(2)=0$이라 모순, $p=(x-a)^2(x-2)$에서 $(2-a)^2=16$, $a=-2$. 넓이 $\int_{-2}^2-p=\dfrac{64}3$.'
    steps:
    - id: 1a
      content: '$p''(2)=16\Rightarrow p=(x+2)^2(x-2)$, 넓이 $\dfrac{64}3$'
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.R1
      - 1.A2
      - 1.M3
      - 1.A3
    hint_ladder:
    - '$p(x)=f(x)-g(x)$로 놓으면 $p$는 어떤 다항식인가?'
    - '$\dfrac{e^{f}}{e^{g}}=e^{p}$이고 $p(2)=0$이다. 남은 극한은 무엇의 미분계수인가?'
    - '두 꼴 중 $p''(2)=16$이 가능한 것은?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.58
    steps:
    - id: 1b-1
      content: |
        $p(x)=f(x)-g(x)$라 하면 $p(x)$는 최고차항의 계수가 1인 삼차함수이다. 방정식 $p(x)=0$의 서로 다른 해가 두 개이고 큰 값이 2이므로, 작은 값을 $a\,(a<2)$라 하면
        $$p(x)=(x-a)(x-2)^2\ \text{ 또는 }\ p(x)=(x-a)^2(x-2)$$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $p(2)=0$이므로
        $$\lim_{x\to2}h(x)=\lim_{x\to2}\dfrac{e^{f(x)-g(x)}-1}{x-2}=\lim_{x\to2}\dfrac{e^{p(x)}-e^{p(2)}}{x-2}$$
        이고, 이는 $e^{p(x)}$의 $x=2$에서의 미분계수이므로 $p'(2)e^{p(2)}=p'(2)$이다. $h$가 $x=2$에서 연속이므로 $p'(2)=16$.
      criteria:
      - 1.M2
      - 1.A1
    - id: 1b-3
      content: '$p(x)=(x-a)(x-2)^2$이면 $p''(x)=(x-2)^2+2(x-a)(x-2)$, $p''(2)=0\ne16$이므로 불가능하다. 따라서 $p(x)=(x-a)^2(x-2)$이고 $p''(x)=2(x-a)(x-2)+(x-a)^2$, $p''(2)=(2-a)^2=16$에서 $a=-2$ 또는 $a=6$. $a<2$이므로 $p(x)=(x+2)^2(x-2)$.'
      criteria:
      - 1.R1
      - 1.A2
    - id: 1b-4
      content: |
        구간 $[-2,2]$에서 $p(x)\le0$이므로 구하는 넓이는
        $$\int_{-2}^2|f(x)-g(x)|\,dx=-\int_{-2}^2(x^3+2x^2-4x-8)\,dx=-\left[\dfrac{x^4}4+\dfrac{2x^3}3-2x^2-8x\right]_{-2}^2=\dfrac{64}3$$
      criteria:
      - 1.M3
      - 1.A3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: '$p=f-g$를 놓고 중근을 갖는 두 꼴 $(x-a)(x-2)^2$, $(x-a)^2(x-2)$를 제시했다.'
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: '$\dfrac{e^{f}}{e^{g}}-1=e^{p}-1$로 바꾸고 극한을 $e^{p(x)}$의 미분계수(또는 동치 방법)로 계산했다.'
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: '$p''(2)=16$을 얻었다.'
      depends_on:
      - 1.M2
      steps:
      - 1b-2
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: '$(x-a)(x-2)^2$ 꼴은 $p''(2)=0$이므로 제외됨을 밝혔다.'
      steps:
      - 1b-3
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: '$a=-2$, $p(x)=(x+2)^2(x-2)$.'
      depends_on:
      - 1.R1
      - 1.M2
      steps:
      - 1b-3
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: '$[-2,2]$에서 $p\le0$임을 고려해 넓이를 $\int_{-2}^2|p|$ 또는 $-\int_{-2}^2p$로 세웠다.'
      steps:
      - 1b-4
    - id: 1.A3
      mark_type: A
      points: 2
      evidence: '$\dfrac{64}3$.'
      depends_on:
      - 1.M3
      cao: true
      steps:
      - 1b-4
