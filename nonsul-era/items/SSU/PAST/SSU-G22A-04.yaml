stimuli:
- label: 제시문
  body: |
    첫째항이 $a$, 공비가 $r$인 등비수열의 첫째항부터 제$n$항까지의 합을 $S_n$이라고 하면

    ① $r\ne1$일 때 $S_n=\dfrac{a(1-r^n)}{1-r}=\dfrac{a(r^n-1)}{r-1}$

    ② $r=1$일 때 $S_n=na$

    【출처: 수학Ⅰ 「등비수열」】
stem: |
  모든 자연수 $n$에 대하여 $x_n=3\pi\left(1-\dfrac1{2^{n-1}}\right)$이다. 실수 전체에서 미분가능한 함수 $f(x)$는 모든 자연수 $n$에 대하여 다음 조건을 모두 만족시킨다.

  (i) 닫힌구간 $[x_n,x_{n+1}]$에서 실수 $a_n$, 양수 $b_n$에 대하여 $f(x)=a_n\sin(b_nx)$이다.

  (ii) $f(x_n)=f(x_{n+1})=0$이고, 열린구간 $(x_n,x_{n+1})$에서 방정식 $f(x)=0$은 서로 다른 $2$개의 해를 갖는다.

  (iii) $f'(x_1)=\dfrac12$

  이때 다음 문항에 답하시오.

  (1) $b_{10}$을 구하시오.

  (2) 정적분 $\displaystyle\int_{x_1}^{x_{10}}f(x)\,dx$의 값을 구하시오.
