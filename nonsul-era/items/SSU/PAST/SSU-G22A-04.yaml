- id: '2'
  stem: |
    정적분 $\displaystyle\int_{x_1}^{x_{10}}f(x)\,dx$의 값을 구하시오.
  points: 18
  depends_on:
  - '1'
  answer:
    kind: value
    value: 52429/262144
    equivalents:
    - (1/5)*(1+(1/4)**9)
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\cos(b_nx_n)=1$, $\cos(b_nx_{n+1})=-1$; $x_n$에서 미분가능 ⇒ $-2^{n-1}a_{n-1}=2^na_n$, $a_1=\dfrac14$ ⇒ $a_n=\left(-\dfrac12\right)^{n+1}$. 구간별 적분 $\dfrac{a_n}{2^{n-1}}=\dfrac14\left(-\dfrac14\right)^{n-1}$.'
    steps:
    - id: 2a
      content: '$\displaystyle\sum_{k=1}^9\dfrac14\left(-\dfrac14\right)^{k-1}=\dfrac15\left(1+\left(\dfrac14\right)^9\right)$'
      criteria:
      - 2.B1
      - 2.M1
      - 2.A1
      - 2.B2
      - 2.M2
      - 2.M3
      - 2.A2
    hint_ladder:
    - '$b_nx_n$과 $b_nx_{n+1}$을 계산해 $\cos$ 값을 구하자.'
    - '$x_n$에서 왼쪽 식과 오른쪽 식의 미분계수를 같게 놓자.'
    - 각 구간의 적분이 등비수열을 이룬다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.60~61
    steps:
    - id: 2b-1
      content: '$b_nx_n=2^n\times3\pi\left(1-\dfrac1{2^{n-1}}\right)=3\pi(2^n-2)$, $b_nx_{n+1}=b_nx_n+3\pi=3\pi(2^n-1)$이므로 모든 $n\ge1$에 대하여 $\cos(b_nx_n)=1$, $\cos(b_nx_{n+1})=-1$.'
      criteria:
      - 2.B1
    - id: 2b-2
      content: |
        $n\ge2$일 때 $[x_{n-1},x_n]$에서 $f(x)=a_{n-1}\sin(2^{n-1}x)$, $[x_n,x_{n+1}]$에서 $f(x)=a_n\sin(2^nx)$이다. $f$는 $x_n$에서 미분가능하므로 좌미분계수와 우미분계수가 같고
        $$f'(x_n)=2^{n-1}a_{n-1}\cos(2^{n-1}x_n)=-2^{n-1}a_{n-1},\qquad f'(x_n)=2^na_n\cos(2^nx_n)=2^na_n$$
        따라서 $a_n=-\dfrac12a_{n-1}$.
      criteria:
      - 2.M1
      - 2.A1
    - id: 2b-3
      content: '또한 $f''(x_1)=2a_1\cos0=2a_1=\dfrac12$이므로 $a_1=\dfrac14$. 따라서 $\{a_n\}$은 첫째항 $\dfrac14$, 공비 $-\dfrac12$인 등비수열이고 $a_n=\left(-\dfrac12\right)^{n+1}$.'
      criteria:
      - 2.B2
    - id: 2b-4
      content: |
        구간 $[x_n,x_{n+1}]$에서
        $$\int_{x_n}^{x_{n+1}}f(x)\,dx=\dfrac{a_n}{2^n}\Big[-\cos(2^nx)\Big]_{x_n}^{x_{n+1}}=\dfrac{a_n}{2^n}\cdot2=\dfrac{a_n}{2^{n-1}}=\dfrac14\left(-\dfrac14\right)^{n-1}$$
      criteria:
      - 2.M2
    - id: 2b-5
      content: |
        따라서 제시문의 등비수열의 합에 의하여
        $$\int_{x_1}^{x_{10}}f(x)\,dx=\sum_{k=1}^9\dfrac14\left(-\dfrac14\right)^{k-1}=\dfrac{\frac14\left(1-\left(-\frac14\right)^9\right)}{1+\frac14}=\dfrac15\left(1+\left(\dfrac14\right)^9\right)\left(=\dfrac{52429}{262144}\right)$$
      criteria:
      - 2.M3
      - 2.A2
