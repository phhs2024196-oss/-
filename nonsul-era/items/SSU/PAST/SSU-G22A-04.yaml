    steps:
    - id: 1a
      content: '$b_{10}=2^{10}=1024$'
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - '$\sin(b_nx)$의 이웃한 영점 사이 간격은?'
    - '$x_{n+1}-x_n$을 계산하자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.60
    steps:
    - id: 1b-1
      content: |
        구간 $[x_n,x_{n+1}]$에서 $f(x)=a_n\sin(b_nx)$이고, $\sin(b_nx)$의 이웃한 영점 사이 간격은 $\dfrac\pi{b_n}$이다. 조건 (ii)에 의해
        $$f(x_n)=f\left(x_n+\dfrac\pi{b_n}\right)=f\left(x_n+\dfrac{2\pi}{b_n}\right)=f\left(x_n+\dfrac{3\pi}{b_n}\right)=0$$
        이고 내부 영점이 정확히 두 개이므로 $x_{n+1}=x_n+\dfrac{3\pi}{b_n}$.
      criteria:
      - 1.M1
    - id: 1b-2
      content: '$x_{n+1}-x_n=3\pi\left(1-\dfrac1{2^n}\right)-3\pi\left(1-\dfrac1{2^{n-1}}\right)=\dfrac{3\pi}{2^n}$이므로 $b_n=2^n$, $b_{10}=2^{10}=1024$.'
      criteria:
      - 1.M2
      - 1.A1
