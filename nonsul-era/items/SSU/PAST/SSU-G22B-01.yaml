stimuli:
- label: 제시문
  body: |
    미분가능한 함수 $g(x)$에 대하여 $g(x)=t$로 놓으면
    $$\int f(g(x))g'(x)\,dx=\int f(t)\,dt$$
    【출처: 미적분 「치환적분법」】
stem: |
  함수 $f(x)$가 구간 $[1,\infty)$에서 $f(x)=x\ln x$로 정의되어 있다. 구간 $[0,\infty)$에서 연속이고 구간 $(0,\infty)$에서 미분 가능한 함수 $g(x)$는 모든 $x\ge0$에 대하여
  $$g(x)\ge1,\quad f(g(x))=x^2$$
  을 만족시킨다. 이때 다음 문항에 답하시오.

  (1) 곡선 $y=g(x)$ 위의 점 $(\sqrt e,e)$에서의 접선의 방정식을 구하시오.

  (2) 정적분 $\displaystyle\int_0^{\sqrt e}2x\{g(x)\}^2\,dx$의 값을 구하시오.
subparts:
- id: '1'
  stem: |
    곡선 $y=g(x)$ 위의 점 $(\sqrt e,e)$에서의 접선의 방정식을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: y=sqrt(E)*x
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$f''(g(\sqrt e))g''(\sqrt e)=2\sqrt e$, $f''(e)=2$이므로 $g''(\sqrt e)=\sqrt e$.'
    steps:
    - id: 1a
      content: '$y=\sqrt e(x-\sqrt e)+e=\sqrt ex$'
      criteria:
      - 1.M1
      - 1.B1
      - 1.A1
      - 1.A2
    hint_ladder:
    - '$f(g(x))=x^2$을 미분하자.'
    - '$f''(x)=1+\ln x$'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.62
    steps:
    - id: 1b-1
      content: '합성함수의 미분법에 의하여 $\{f(g(x))\}''=f''(g(x))g''(x)=2x$이므로 $f''(g(\sqrt e))g''(\sqrt e)=2\sqrt e$.'
      criteria:
      - 1.M1
    - id: 1b-2
      content: '$g(\sqrt e)=e$이고 $f''(x)=1+\ln x$이므로 $g''(\sqrt e)=\dfrac{2\sqrt e}{f''(e)}=\dfrac{2\sqrt e}{1+\ln e}=\sqrt e$.'
      criteria:
      - 1.B1
      - 1.A1
    - id: 1b-3
      content: '따라서 접선의 방정식은 $y=\sqrt e(x-\sqrt e)+e=\sqrt e\,x$.'
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
