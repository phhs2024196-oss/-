# (2) 해설교재(p.62)는 ∫t^2 ln t dt = 2e^3/9+1/9 까지만 쓰고 끝남(∫t^2 dt=(e^3-1)/3 합산 누락). 최종값 (5e^3-2)/9 는 직접 계산·sympy 확인
