- id: '2'
  stem: |
    정적분 $\displaystyle\int_0^{\sqrt e}2x\{g(x)\}^2\,dx$의 값을 구하시오.
  points: 13
  depends_on: []
  answer:
    kind: value
    value: (5*E**3-2)/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$2x=f''(g(x))g''(x)$로 바꾸고 $g(x)=t$로 치환: $\int_1^et^2f''(t)\,dt=\int_1^e(t^2\ln t+t^2)\,dt$.'
    steps:
    - id: 2a
      content: '$\dfrac29e^3+\dfrac19+\dfrac{e^3-1}3=\dfrac{5e^3-2}9$'
      criteria:
      - 2.B1
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.A2
    hint_ladder:
    - '$2x$를 무엇으로 바꿀 수 있는가?'
    - '$g(0)$과 $g(\sqrt e)$를 구해 적분 구간을 바꾸자.'
    - '$\int t^2\ln t\,dt$는 부분적분.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.62
    steps:
    - id: 2b-1
      content: '$g(x)=t$로 놓으면 $\dfrac{dt}{dx}=g''(x)$. $g(0)=\alpha$로 놓으면 $f(\alpha)=\alpha\ln\alpha=0$이고 $\alpha\ge1$이므로 $g(0)=1$. 또한 $g(\sqrt e)=e$.'
      criteria:
      - 2.B1
    - id: 2b-2
      content: |
        $2x=f'(g(x))g'(x)$이므로 치환적분법에 의하여
        $$\int_0^{\sqrt e}2x\{g(x)\}^2dx=\int_0^{\sqrt e}\{g(x)\}^2f'(g(x))g'(x)\,dx=\int_1^et^2f'(t)\,dt=\int_1^e(t^2\ln t+t^2)\,dt$$
      criteria:
      - 2.M1
      - 2.A1
    - id: 2b-3
      content: |
        부분적분법을 이용하면
        $$\int_1^et^2\ln t\,dt=\left[\dfrac13t^3\ln t\right]_1^e-\int_1^e\dfrac13t^3\cdot\dfrac1t\,dt=\dfrac13e^3-\dfrac19(e^3-1)=\dfrac29e^3+\dfrac19$$
      criteria:
      - 2.M2
    - id: 2b-4
      content: '$\displaystyle\int_1^et^2\,dt=\dfrac{e^3-1}3$이므로 구하는 값은 $\dfrac29e^3+\dfrac19+\dfrac{e^3-1}3=\dfrac{5e^3-2}9$.'
      criteria:
      - 2.A2
