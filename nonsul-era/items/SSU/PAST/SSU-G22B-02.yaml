stimuli:
- label: 제시문
  body: |
    삼각형 $\mathrm{ABC}$의 외접원의 반지름의 길이를 $R$라고 하면
    $$\dfrac a{\sin A}=\dfrac b{\sin B}=\dfrac c{\sin C}=2R$$
    [그림 설명] 중심이 $\mathrm{O}$인 원에 삼각형 $\mathrm{ABC}$가 내접하고, $\overline{\mathrm{BC}}=a$, $\overline{\mathrm{CA}}=b$, $\overline{\mathrm{AB}}=c$, $\overline{\mathrm{OC}}=R$로 표시되어 있다.
    【출처: 수학Ⅰ 「사인법칙과 코사인법칙」】
stem: |
  함수 $f(x)$가 구간 $[-1,1]$에서 다음과 같이 정의되어 있다.
  $$f(x)=\begin{cases}1-x^2 & (-1\le x\le0)\\ \sqrt{1-x^2} & (0<x\le1)\end{cases}$$
  곡선 $y=f(x)$ 위에 오각형 $\mathrm{ABCDE}$의 모든 꼭짓점이 놓여 있다. 점 $\mathrm A$의 좌표는 $(1,0)$, 점 $\mathrm E$의 좌표는 $(-1,0)$이고 두 점 $\mathrm B$, $\mathrm C$의 $x$좌표는 모두 양수이며 $\angle\mathrm{ABC}=150^\circ$이다. 이때 다음 문항에 답하시오.

  (1) 삼각형 $\mathrm{ACE}$의 넓이를 구하시오.

  (2) 오각형 $\mathrm{ABCDE}$의 넓이가 최대가 되도록 하는 꼭짓점 $\mathrm B$, $\mathrm C$, $\mathrm D$의 좌표를 구하시오.
