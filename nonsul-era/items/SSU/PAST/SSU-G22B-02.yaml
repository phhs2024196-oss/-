- id: '2'
  stem: |
    오각형 $\mathrm{ABCDE}$의 넓이가 최대가 되도록 하는 꼭짓점 $\mathrm B$, $\mathrm C$, $\mathrm D$의 좌표를 구하시오.
  points: 15
  depends_on:
  - '1'
  answer:
    kind: set
    value: B=(sqrt(3)/2, 1/2), C=(1/2, sqrt(3)/2), D=(-sqrt(3)/6, 11/12)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\triangle\mathrm{ACE}$ 고정 → $\triangle\mathrm{ABC}$, $\triangle\mathrm{CDE}$ 각각 최대. $\mathrm B$는 $\mathrm{OB}\perp\mathrm{AC}$인 점, $\mathrm D$는 $f''(x)=\dfrac1{\sqrt3}$인 점.'
    steps:
    - id: 2a
      content: '$\mathrm B(\cos30^\circ,\sin30^\circ)$, $-2x=\dfrac1{\sqrt3}\Rightarrow x=-\dfrac1{2\sqrt3}$'
      criteria:
      - 2.R1
      - 2.M1
      - 2.A1
      - 2.B1
      - 2.M2
      - 2.A2
      - 2.A3
    hint_ladder:
    - (1)에서 고정된 것은 무엇인가?
    - 현에서 가장 먼 호 위의 점은?
    - '점 $\mathrm D$에서의 접선이 직선 $\mathrm{CE}$와 평행할 때를 보자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.63~64
    steps:
    - id: 2b-1
      content: '(1)에 의해 삼각형 $\mathrm{ACE}$는 고정되어 있으므로, 두 삼각형 $\mathrm{ABC}$, $\mathrm{CDE}$의 넓이가 각각 최대일 때 오각형의 넓이가 최대이다.'
      criteria:
      - 2.R1
    - id: 2b-2
      content: '삼각형 $\mathrm{ABC}$의 넓이는 직선 $\mathrm{AC}$와 점 $\mathrm B$ 사이의 거리가 최대일 때 최대이고, 호 $\mathrm{AC}$ 위의 점 $\mathrm B$에서 현 $\mathrm{AC}$까지의 거리는 선분 $\mathrm{OB}$가 현 $\mathrm{AC}$를 수직이등분할 때 최대이다. $\mathrm C=(\cos60^\circ,\sin60^\circ)$이므로 $\mathrm B=(\cos30^\circ,\sin30^\circ)=\left(\dfrac{\sqrt3}2,\dfrac12\right)$.'
      criteria:
      - 2.M1
      - 2.A1
    - id: 2b-3
      content: |
        삼각형 $\mathrm{CDE}$의 넓이가 최대이려면 직선 $\mathrm{CE}$와 점 $\mathrm D$ 사이의 거리가 최대여야 한다. $f(x)$는 $x=0$에서 $\displaystyle\lim_{x\to0+}\dfrac{\sqrt{1-x^2}-1}{x}=\lim_{x\to0+}\dfrac{-x}{\sqrt{1-x^2}+1}=0$, $\displaystyle\lim_{x\to0-}\dfrac{(1-x^2)-1}{x}=0$이므로 $(-1,1)$에서 미분가능하고
        $$f'(x)=\begin{cases}-2x & (-1<x\le0)\\ -\dfrac{x}{\sqrt{1-x^2}} & (0<x<1)\end{cases}$$
      criteria:
      - 2.B1
    - id: 2b-4
      content: '따라서 점 $\mathrm D$에서의 접선이 직선 $\mathrm{CE}$와 평행할 때 넓이가 최대이다. 직선 $\mathrm{CE}$의 기울기는 $\dfrac{\frac{\sqrt3}2-0}{\frac12-(-1)}=\dfrac1{\sqrt3}$이고, $f''(x)>0$이려면 $x<0$이어야 하므로 $-2x=\dfrac1{\sqrt3}$, $x=-\dfrac1{2\sqrt3}$. 즉 $\mathrm D\left(-\dfrac1{2\sqrt3},\dfrac{11}{12}\right)$.'
      criteria:
      - 2.M2
      - 2.A2
    - id: 2b-5
      content: '따라서 $\mathrm B\left(\dfrac{\sqrt3}2,\dfrac12\right)$, $\mathrm C\left(\dfrac12,\dfrac{\sqrt3}2\right)$, $\mathrm D\left(-\dfrac{\sqrt3}6,\dfrac{11}{12}\right)$.'
      criteria:
      - 2.A3
