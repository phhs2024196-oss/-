      - 1.A1
      - 1.B1
      - 1.A2
    hint_ladder:
    - '$\mathrm A,\mathrm B,\mathrm C$는 어떤 원 위에 있는가?'
    - '사인법칙으로 $\overline{\mathrm{AC}}$를 구하자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.63
    steps:
    - id: 1b-1
      content: '오각형 $\mathrm{ABCDE}$를 대각선 $\mathrm{AC}$, $\mathrm{CE}$로 세 삼각형 $\mathrm{ABC}$, $\mathrm{ACE}$, $\mathrm{CDE}$로 나눈다.'
      criteria: []
    - id: 1b-2
      content: '점 $\mathrm A,\mathrm B,\mathrm C$가 곡선 $y=\sqrt{1-x^2}\,(x>0)$ 위에 있으므로 삼각형 $\mathrm{ABC}$는 중심이 $\mathrm O(0,0)$, 반지름이 1인 원에 내접한다. 사인법칙에 의해 $\dfrac{\overline{\mathrm{AC}}}{\sin150^\circ}=2$, 즉 $\overline{\mathrm{AC}}=1$.'
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-3
      content: '$\overline{\mathrm{OA}}=\overline{\mathrm{OC}}=1$이므로 삼각형 $\mathrm{OAC}$는 정삼각형이고 $\mathrm C=\left(\dfrac12,\dfrac{\sqrt3}2\right)$. 삼각형 $\mathrm{ACE}$의 넓이는 $\dfrac12\times2\times\dfrac{\sqrt3}2=\dfrac{\sqrt3}2$.'
      criteria:
      - 1.B1
      - 1.A2
