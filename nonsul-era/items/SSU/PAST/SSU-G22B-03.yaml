stimuli:
- label: 제시문
  body: |
    미분가능한 함수 $f(x)$에 대하여 $f'(a)=0$이고 $x=a$의 좌우에서

    ① $f'(x)$의 부호가 양에서 음으로 바뀌면 $f(x)$는 $x=a$에서 극대이다.

    ② $f'(x)$의 부호가 음에서 양으로 바뀌면 $f(x)$는 $x=a$에서 극소이다.

    【출처: 수학Ⅱ 「함수의 극대와 극소」】
stem: |
  원 $x^2+y^2=1$ 위의 점 $\mathrm P(\cos\theta,\sin\theta)$에서의 접선을 $\ell$이라고 하고, 점 $\mathrm A(-1,0)$에서 직선 $\ell$에 내린 수선의 발을 $\mathrm H$라고 하자. (단, $0<\theta<\pi$)

  이때 다음 문항에 답하시오.

  (1) 점 $\mathrm H$의 좌표를 $\theta$를 이용하여 나타내시오.

  (2) 삼각형 $\mathrm{APH}$의 넓이의 최댓값을 구하시오.
subparts:
- id: '1'
  stem: |
    점 $\mathrm H$의 좌표를 $\theta$를 이용하여 나타내시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: H=(cos(theta)-sin(theta)**2, sin(theta)*(1+cos(theta)))
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\ell:(\cos\theta)x+(\sin\theta)y=1$, 수선 $\ell'':(\cos\theta)y-(\sin\theta)(x+1)=0$의 교점.'
    steps:
    - id: 1a
      content: '$\mathrm H(\cos\theta-\sin^2\theta,\ \sin\theta(1+\cos\theta))$'
      criteria:
      - 1.B1
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - '원 위의 점 $(x_1,y_1)$에서의 접선은 $x_1x+y_1y=1$.'
    - '$\ell$에 수직이고 $\mathrm A$를 지나는 직선을 쓰자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.65
    steps:
    - id: 1b-1
      content: '원 위의 점 $\mathrm P(\cos\theta,\sin\theta)$에서의 접선은 $\ell:(\cos\theta)x+(\sin\theta)y=1$ $\left(y=-\dfrac{\cos\theta}{\sin\theta}x+\dfrac1{\sin\theta}\right)$.'
      criteria:
      - 1.B1
    - id: 1b-2
      content: '점 $\mathrm A(-1,0)$을 지나고 $\ell$에 수직인 직선은 $\ell'':(\cos\theta)y-(\sin\theta)(x+1)=0$.'
      criteria:
      - 1.M1
    - id: 1b-3
      content: '두 식을 연립하면 $(\sin^2\theta)(x+1)=-(\cos^2\theta)x+\cos\theta$에서 $x=\cos\theta-\sin^2\theta$이고, $\cos\theta(\cos\theta-\sin^2\theta)+(\sin\theta)y=1$에서 $y=\sin\theta(1+\cos\theta)$. 따라서 $\mathrm H(\cos\theta-\sin^2\theta,\ \sin\theta(1+\cos\theta))$.'
      criteria:
      - 1.M2
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: '접선 $\ell$의 방정식.'
      steps:
      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: '$\mathrm A$를 지나고 $\ell$에 수직인 직선의 방정식을 세웠다.'
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: 두 직선을 연립했다.
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: '$\mathrm H(\cos\theta-\sin^2\theta,\ \sin\theta(1+\cos\theta))$ 또는 동치식.'
      depends_on:
      - 1.M1
      - 1.M2
      cao: true
      steps:
      - 1b-3
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - code: '20'
    meaning: 만점
