  misconceptions:
  - id: MC-CAL-0636
    outcome_code: '71'
    wrong_work: '수선의 기울기를 $-\dfrac{\cos\theta}{\sin\theta}$(접선과 같은 기울기)로 씀'
    detect_cue: '$\ell''$이 $\ell$과 평행'
    feedback: '수직인 두 직선의 기울기의 곱은 $-1$입니다. 수선의 기울기는 $\dfrac{\sin\theta}{\cos\theta}$입니다.'
    remedy:
    - RL-0636
- id: '2'
  stem: |
    삼각형 $\mathrm{APH}$의 넓이의 최댓값을 구하시오.
  points: 10
  depends_on:
  - '1'
  answer:
    kind: value
    value: 3*sqrt(3)/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\overline{\mathrm{HA}}=1+\cos\theta$, $\overline{\mathrm{HP}}=\sin\theta$, $f(\theta)=\dfrac12(1+\cos\theta)\sin\theta$, $f''(\theta)=(\cos\theta-\frac12)(\cos\theta+1)$.'
    steps:
    - id: 2a
      content: '$\theta=\dfrac\pi3$에서 최댓값 $\dfrac{3\sqrt3}8$'
      criteria:
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.R1
      - 2.A2
    hint_ladder:
    - '$\angle\mathrm{AHP}=90^\circ$이다.'
    - '$f''(\theta)$를 $\cos\theta$에 대한 이차식으로 정리하자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.65~66
    steps:
    - id: 2b-1
      content: |
        삼각형 $\mathrm{APH}$는 $\angle\mathrm{AHP}=90^\circ$인 직각삼각형이다.
        $\overline{\mathrm{HA}}=\sqrt{(\cos\theta-\sin^2\theta+1)^2+(\sin\theta+\sin\theta\cos\theta)^2}=1+\cos\theta$, $\overline{\mathrm{HP}}=\sqrt{(\cos\theta-\sin^2\theta-\cos\theta)^2+(\sin\theta+\sin\theta\cos\theta-\sin\theta)^2}=\sin\theta$
        이므로 넓이는 $f(\theta)=\dfrac12(1+\cos\theta)\sin\theta$.
      criteria:
      - 2.M1
      - 2.A1
    - id: 2b-2
      content: '$f''(\theta)=-\dfrac12\sin^2\theta+\dfrac12(1+\cos\theta)\cos\theta=\cos^2\theta+\dfrac12\cos\theta-\dfrac12=\left(\cos\theta-\dfrac12\right)(\cos\theta+1)$.'
      criteria:
      - 2.M2
    - id: 2b-3
      content: '$\left(0,\dfrac\pi3\right)$에서 $f''(\theta)>0$, $\left(\dfrac\pi3,\pi\right)$에서 $f''(\theta)<0$이므로 $f$는 $\theta=\dfrac\pi3$에서 극대이자 최대이고, 최댓값은 $f\left(\dfrac\pi3\right)=\dfrac12\left(1+\dfrac12\right)\dfrac{\sqrt3}2=\dfrac{3\sqrt3}8$.'
      criteria:
      - 2.R1
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: '직각삼각형임을 이용해 두 변 $\overline{\mathrm{HA}}$, $\overline{\mathrm{HP}}$를 구했다.'
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: '넓이 $\dfrac12(1+\cos\theta)\sin\theta$.'
      depends_on:
      - 2.M1
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: '$f''(\theta)$를 구해 $\left(\cos\theta-\frac12\right)(\cos\theta+1)$ 등으로 부호를 판단할 수 있게 정리했다.'
      steps:
      - 2b-2
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: '증감(부호 변화)으로 $\theta=\dfrac\pi3$에서 최대임을 밝혔다.'
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: '$\dfrac{3\sqrt3}8$.'
      depends_on:
      - 2.R1
      cao: true
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
