key_idea: '$f(2)=\dfrac4\pi$, $f''(2)=\left|\cos\pi\right|=1$이므로 원은 $\left(2,\dfrac4\pi\right)$에서 기울기 1인 접선을 가짐 → 중심 $(a,0)$과의 직선 기울기 $-1$; $\int_2^{a+r}$은 직각삼각형+부채꼴.'
stuck: '정적분으로 정의된 함수의 $x=2$에서의 미분계수가 $\left|\cos\pi\right|=1$이고, 원의 반지름이 접선에 수직이라는 점에서 중심을 찾는 단계'
