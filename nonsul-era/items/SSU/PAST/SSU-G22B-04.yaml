stimuli:
- label: 제시문
  body: |
    함수 $y=f(x)$가 닫힌구간 $[a,b]$에서 연속일 때, 곡선 $y=f(x)$와 $x$축 및 두 직선 $x=a$, $x=b$로 둘러싸인 도형의 넓이 $S$는 다음과 같다.
    $$S=\int_a^b|f(x)|\,dx$$
    【출처: 미적분 「넓이」】
stem: |
  $a+r>2$인 두 양수 $a$, $r$에 대하여 함수 $f(x)$가 구간 $[0,a+r]$에서 다음과 같이 정의되어 있다.
  $$f(x)=\begin{cases}\displaystyle\int_0^x\left|\cos\dfrac{\pi t}2\right|dt & (0\le x\le2)\\ \sqrt{r^2-(x-a)^2} & (2<x\le a+r)\end{cases}$$
  함수 $f(x)$가 구간 $[0,a+r]$에서 연속이고 구간 $(0,a+r)$에서 미분가능할 때, 다음 문항에 답하시오.

  (1) $a$와 $r$의 값을 구하시오.

  (2) 정적분 $\displaystyle\int_0^{a+r}f(x)\,dx$의 값을 구하시오.
subparts:
- id: '1'
  stem: |
    $a$와 $r$의 값을 구하시오.
  points: 15
  depends_on: []
  answer:
    kind: set
    value: a=2+4/pi, r=4*sqrt(2)/pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$f(2)=\dfrac4\pi$, $f''(2)=1$ → 원은 $\left(2,\frac4\pi\right)$에서 기울기 1인 접선, 중심 $(a,0)$과 잇는 직선 기울기 $-1$.'
    steps:
    - id: 1a
      content: '$a=2+\dfrac4\pi$, $r=\dfrac{4\sqrt2}\pi$'
      criteria:
      - 1.B1
      - 1.M1
      - 1.A1
      - 1.M2
      - 1.R1
      - 1.A2
    hint_ladder:
    - '$f(2)$를 구간을 나누어 계산하자.'
    - '$g(x)=\int_0^x\left|\cos\frac{\pi t}2\right|dt$의 $x=2$에서의 미분계수는?'
    - 원의 반지름은 접선과 수직이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.67
    steps:
    - id: 1b-1
      content: '$f(2)=\displaystyle\int_0^2\left|\cos\dfrac{\pi t}2\right|dt=\int_0^1\cos\dfrac{\pi t}2dt-\int_1^2\cos\dfrac{\pi t}2dt=\left[\dfrac2\pi\sin\dfrac{\pi t}2\right]_0^1-\left[\dfrac2\pi\sin\dfrac{\pi t}2\right]_1^2=\dfrac4\pi$. 따라서 $x=2$에서 연속이려면 $\displaystyle\lim_{x\to2+}f(x)=\dfrac4\pi$.'
      criteria:
      - 1.B1
    - id: 1b-2
      content: '$f$는 $x=2$에서 미분가능하므로 $f''(2)=\displaystyle\lim_{x\to2-}\dfrac{f(x)-f(2)}{x-2}=\lim_{x\to2+}\dfrac{f(x)-f(2)}{x-2}$. 실수 전체에서 정의된 $g(x)=\displaystyle\int_0^x\left|\cos\dfrac{\pi t}2\right|dt$는 $x=2$에서 미분가능하고 정적분과 미분의 관계에 의해 $g''(2)=\left|\cos\dfrac{2\pi}2\right|=1$이므로 $f''(2)=1$.'
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-3
      content: '$2<x\le a+r$에서 $y=\sqrt{r^2-(x-a)^2}$는 $(x-a)^2+y^2=r^2\ (y\ge0)$으로, 점 $\left(2,\dfrac4\pi\right)$를 지나고 그 점에서 접선의 기울기가 1인 원의 일부이다.'
      criteria:
      - 1.M2
    - id: 1b-4
      content: '점 $\left(2,\dfrac4\pi\right)$와 중심 $(a,0)$ 사이의 거리는 $r$이고 두 점을 지나는 직선의 기울기는 $-1$이므로 $a=2+\dfrac4\pi$, $r=\sqrt{(a-2)^2+\dfrac{16}{\pi^2}}=\dfrac{4\sqrt2}\pi$.'
      criteria:
      - 1.R1
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: '$f(2)=\dfrac4\pi$를 구했다.'
      steps:
      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: '정적분과 미분의 관계로 $x=2$에서의 미분계수를 구하는 식을 세웠다.'
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: '$f''(2)=1$.'
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: '원의 일부가 $\left(2,\dfrac4\pi\right)$를 지나고 그 점에서 접선의 기울기가 1이어야 함(또는 동치 방정식)을 세웠다.'
      steps:
      - 1b-3
    - id: 1.R1
      mark_type: R
      points: 2
      evidence: '반지름이 접선에 수직이므로 중심과 접점을 잇는 직선의 기울기가 $-1$임을 이용했다(또는 미분 조건을 풀었다).'
      steps:
      - 1b-4
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: '$a=2+\dfrac4\pi$, $r=\dfrac{4\sqrt2}\pi$.'
      depends_on:
      - 1.M2
      - 1.R1
      cao: true
      steps:
      - 1b-4
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
