- id: '2'
  stem: |
    정적분 $\displaystyle\int_0^{a+r}f(x)\,dx$의 값을 구하시오.
  points: 15
  depends_on:
  - '1'
  answer:
    kind: value
    value: 8*(1+2*pi)/pi**2
    equivalents:
    - 4*(2+4*pi)/pi**2
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\int_0^1+\int_1^2=\dfrac4\pi$, $\int_2^{a+r}$은 밑변·높이 $\dfrac r{\sqrt2}$인 직각삼각형과 중심각 $\dfrac{3\pi}4$인 부채꼴.'
    steps:
    - id: 2a
      content: '$\dfrac4\pi+\dfrac14r^2+\dfrac12r^2\cdot\dfrac{3\pi}4=\dfrac{4(2+4\pi)}{\pi^2}$'
      criteria:
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.A2
      - 2.A3
    hint_ladder:
    - '$[0,1]$과 $[1,2]$에서 $f$의 식을 구하자.'
    - '$x=2$부터 $a+r$까지의 원 부분 아래 넓이를 도형으로 나누자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.67~68
    steps:
    - id: 2b-1
      content: '$0\le x<1$에서 $f(x)=\displaystyle\int_0^x\cos\dfrac{\pi t}2dt=\dfrac2\pi\sin\dfrac{\pi x}2$, $1\le x\le2$에서 $f(x)=\displaystyle\int_0^1\cos\dfrac{\pi t}2dt-\int_1^x\cos\dfrac{\pi t}2dt=\dfrac4\pi-\dfrac2\pi\sin\dfrac{\pi x}2$.'
      criteria:
      - 2.M1
    - id: 2b-2
      content: '$\displaystyle\int_0^{a+r}f(x)\,dx=\int_0^1f(x)\,dx+\int_1^2f(x)\,dx+\int_2^{a+r}f(x)\,dx$로 나눈다. $\displaystyle\int_0^1f(x)\,dx=\left[-\dfrac4{\pi^2}\cos\dfrac{\pi x}2\right]_0^1=\dfrac4{\pi^2}$, $\displaystyle\int_1^2f(x)\,dx=\left[\dfrac4\pi x+\dfrac4{\pi^2}\cos\dfrac{\pi x}2\right]_1^2=\dfrac4\pi-\dfrac4{\pi^2}$.'
      criteria:
      - 2.A1
    - id: 2b-3
      content: '$\displaystyle\int_2^{a+r}f(x)\,dx$는 밑변과 높이가 $\dfrac r{\sqrt2}$인 직각삼각형의 넓이와 반지름이 $r$이고 중심각이 $\dfrac{3\pi}4$인 부채꼴의 넓이의 합이므로 $\dfrac14r^2+\dfrac12r^2\cdot\dfrac{3\pi}4=\dfrac{4(2+3\pi)}{\pi^2}$.'
      criteria:
      - 2.M2
      - 2.A2
    - id: 2b-4
      content: '따라서 $\displaystyle\int_0^{a+r}f(x)\,dx=\dfrac4\pi+\dfrac{4(2+3\pi)}{\pi^2}=\dfrac{4(2+4\pi)}{\pi^2}$.'
      criteria:
      - 2.A3
