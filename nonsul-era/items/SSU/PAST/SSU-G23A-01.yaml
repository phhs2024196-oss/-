  misconceptions:
  - id: MC-GEO-0515
    outcome_code: '71'
    wrong_work: '$p=4$일 때 $\overline{\mathrm{OC}}^2=\overline{\mathrm{OP}}^2+\overline{\mathrm{PC}}^2$인데 예각으로 판정해 함수가 2개라고 답함'
    detect_cue: 답에 $(x^2-4x-1)(x-8)$ 포함, 또는 「$\le$」로 비교
    feedback: 가장 긴 변의 제곱이 나머지 두 변 제곱의 합과 같으면 직각삼각형입니다. 예각은 「$<$」일 때만입니다.
    remedy: [RL-1]
  - id: MC-CAL-0516
    outcome_code: '72'
    wrong_work: '변곡점을 $f^\prime(x)=0$인 점(극점)으로 구함'
    detect_cue: $f^\prime(x)=0$을 풀어 P를 잡음, $f^{\prime\prime}$이 없음
    feedback: 변곡점은 $f^{\prime\prime}(x)$의 부호가 바뀌는 점입니다. 삼차함수에서는 세 근의 평균이 변곡점의 $x$좌표입니다.
    remedy: [RL-2]

