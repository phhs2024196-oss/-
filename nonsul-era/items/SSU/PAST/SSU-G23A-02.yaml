stimuli: []

stem: |
  좌표평면 위의 점 $\mathrm{P}$가 다음 조건을 모두 만족시키며 움직인다고 하자.

  (i) 시각 $t=0$에서의 점 $\mathrm{P}$의 위치는 $(0,h)$이며 $0\le h\le1$이다.

  (ii) 점 $\mathrm{P}$는 시각 $t$에서 속력 $v(t)=t$로 $x$축과 평행한 직선 위를 움직이다가 곡선 $y=\sqrt{-x^2+2x}$ $(1\le x\le2)$를 만나면 곡선을 따라 일정한 속력 $\sqrt3$으로 움직인다.

  (iii) 시각 $t$에서의 점 $\mathrm{P}$의 $x$좌표 $x(t)$는 $t_1<t_2$일 때 $x(t_1)<x(t_2)$이다.

  [그림 설명] 좌표평면에 곡선 $y=\sqrt{-x^2+2x}$가 점 $(1,1)$에서 점 $(2,0)$까지 그려져 있고, 높이 $h$인 수평선 위의 점 P가 오른쪽(화살표)으로 움직여 곡선과 만난 뒤 곡선을 따라 $(2,0)$까지 내려가는 경로가 굵은 선으로 표시되어 있다. $y$축에 1과 $h$, $x$축에 1, 2가 표시되어 있다.

  점 $\mathrm{P}$가 점 $(0,h)$에서 점 $(2,0)$까지 이동하는데 걸리는 시간이 최대가 되도록 하는 $h$를 구하시오.

subparts:
- id: '1'
  stem: |
    이동 시간이 최대가 되도록 하는 $h$를 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '\dfrac{2\sqrt{2}}{3}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t(\theta)=\sqrt{2+2\cos\theta}+\dfrac{\theta}{\sqrt3}$, $t^\prime(\theta_1)=0$에서 $\dfrac{1-\cos\theta_1}{2}=\dfrac13$, $\cos\theta_1=\dfrac13$, $h=\sin\theta_1=\dfrac{2\sqrt2}{3}$.
    steps:
    - {id: 1a, content: '$t(\theta)=\sqrt{2+2\cos\theta}+\dfrac{\theta}{\sqrt3}$ → $\cos\theta_1=\dfrac13$ → $h=\dfrac{2\sqrt2}{3}$', criteria: [1.M1, 1.M2, 1.M3, 1.A1, 1.R1, 1.A2]}
    hint_ladder:
    - 곡선 $y=\sqrt{-x^2+2x}$는 어떤 원의 일부인가?
    - 속력 $v(t)=t$로 움직일 때 $x$좌표를 $t$의 식으로 나타내 보자.
    - 원호 위에서 이동한 거리는 중심각과 어떤 관계인가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.38
    steps:
    - id: 1b-1
      content: |
        출발점을 $\mathrm{A}(0,h)$, 곡선을 만날 때의 위치를 Q라 하자. $1\le x\le2$에서 곡선 $y=\sqrt{-x^2+2x}$는 중심이 $\mathrm{C}(1,0)$이고 반지름이 1인 원의 일부이므로, $\angle\mathrm{QCB}=\theta$ ($\mathrm{B}(2,0)$)라 하면 $\mathrm{Q}(1+\cos\theta,\sin\theta)$, $0\le\theta\le\dfrac{\pi}{2}$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        곡선을 만나는 시각을 $T$라 하면 (ii)에 의해 $0\le t\le T$에서 P의 $x$좌표는 $x_0+\displaystyle\int_0^tu\,du=\dfrac{t^2}{2}$ ($x_0=0$). 따라서 P의 위치는 $\left(\dfrac{t^2}{2},h\right)$이고 $h=\sin\theta$. 또 $\dfrac{T^2}{2}=1+\cos\theta$에서 $T=\sqrt{2(1+\cos\theta)}$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        Q에서 $(2,0)$까지 곡선 위를 속력 $\sqrt3$으로 움직이고, 이동 거리는 $r\theta=\theta$이므로 걸리는 시간은 $\dfrac{\theta}{\sqrt3}$. 따라서 총 시간은
        $$t(\theta)=\sqrt{2+2\cos\theta}+\dfrac{\theta}{\sqrt3},\quad t'(\theta)=\dfrac{-\sin\theta}{\sqrt{2+2\cos\theta}}+\dfrac{1}{\sqrt3},\quad t''(\theta)=-\dfrac{\sqrt{2(1+\cos\theta)}}{4}.$$
      criteria: [1.M3]
    - id: 1b-4
      content: |
        $t'(\theta_1)=0$이면 $\dfrac{\sin\theta_1}{\sqrt{2+2\cos\theta_1}}=\dfrac{1}{\sqrt3}$, 제곱하면 $\dfrac{1-\cos^2\theta_1}{2(1+\cos\theta_1)}=\dfrac13$. $0\le\theta_1\le\dfrac{\pi}{2}$에서 $1+\cos\theta_1\ne0$이므로 $\dfrac{1-\cos\theta_1}{2}=\dfrac13$, 즉 $\cos\theta_1=\dfrac13$, $\sin\theta_1=\dfrac{2\sqrt2}{3}$.
      criteria: [1.A1]
    - id: 1b-5
      content: |
        $t(\theta_1)$은 $0\le\theta\le\dfrac{\pi}{2}$에서 유일한 극값이고 $t''(\theta_1)<0$이므로 극댓값이다. 그러므로 $t(\theta)$는 $\theta=\theta_1$에서 최댓값을 가지고, 이때 $h=\sin\theta_1=\dfrac{2\sqrt2}{3}$.
      criteria: [1.R1, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 곡선이 중심 $(1,0)$, 반지름 1인 원의 일부임을 이용해 만나는 점을 $(1+\cos\theta,\sin\theta)$ 등으로 나타냈다.
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: 속력을 적분해 $x(t)=\dfrac{t^2}{2}$를 얻고 수평 구간 시간 $T=\sqrt{2(1+\cos\theta)}$ (또는 $h$의 식)를 구했다.
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 5
      evidence: 원호 구간 시간 $\dfrac{\theta}{\sqrt3}$를 더해 총 시간을 한 변수의 함수로 나타내고 미분했다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $t^\prime(\theta)=0$에서 $\cos\theta=\dfrac13$을 얻었다.
      depends_on: [1.M3]
      steps: [1b-4]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: 유일한 극값이 극댓값($t^{\prime\prime}<0$ 또는 부호 변화)이므로 최댓값임을 밝혔다.
      depends_on: [1.A1]
      steps: [1b-5]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: $h=\dfrac{2\sqrt2}{3}$.
      depends_on: [1.A1, 1.M2]
      cao: true
      steps: [1b-5]
