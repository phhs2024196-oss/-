stimuli: []

stem: |
  혜성과 혜성을 관측하기 위한 우주선의 위치를 좌표평면 위에서 나타낼 수 있다고 하자.
  시각 $t$에서의 혜성의 위치 $(x,y)$가 $x=2\sqrt2t-4\sqrt2$, $y=t^2-2t+3$으로 주어져 있다. 우주선은 직선 $\ell:\ y=\sqrt2x-1$ 위를 움직이며, 시각 $t$에서의 우주선의 속도는 $(\sqrt2,2)$로 주어진다고 하자. 직선 $\ell$과 혜성이 움직이는 곡선은 서로 만나지 않는다.

  이때 다음 문항에 답하시오. (단, 혜성과 우주선의 크기는 무시한다.)

  (1) 시각 $t=0$에서의 우주선의 위치가 $(-2\sqrt2,-5)$라고 하자. 이때 혜성과 우주선 사이의 거리가 최소가 되는 시각 $t$와, 그 때의 혜성과 우주선 사이의 거리를 구하시오.

  (2) 이번에는 시각 $t=0$에서의 우주선의 위치를 직선 $\ell$ 위에서 조정하여 혜성을 더 가까운 거리에서 관측하려고 한다. 혜성과 우주선이 가장 가까워질 수 있도록 하는 시각 $t=0$에서의 우주선의 위치와, 이때 혜성과 우주선이 가장 가까워지는 시각 $t$를 구하시오.

