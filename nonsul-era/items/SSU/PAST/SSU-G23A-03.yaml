  points: 10
  depends_on: []
  answer: {kind: set, value: 't=2,\ 4', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 우주선 $(\sqrt2t-2\sqrt2,\ 2t-5)$. 거리 제곱 $s(t)=2(t-2)^2+(t^2-4t+8)^2$, $s^\prime(t)=4(t-2)(t^2-4t+9)$ → $t=2$에서 최소 $s=16$, 거리 4.
    steps:
    - {id: 1a, content: '$s^\prime(t)=4(t-2)(t^2-4t+9)$ → $t=2$, 거리 $4$', criteria: [1.M1, 1.M2, 1.A1, 1.A2]}
    hint_ladder:
    - 속도가 일정하면 위치는 (처음 위치) + (속도)×$t$이다.
    - 거리 대신 거리의 제곱을 미분하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.39
    steps:
    - id: 1b-1
      content: |
        우주선의 시각 $t$에서의 위치는 $x=\sqrt2t-2\sqrt2$, $y=2t-5$이다. 시각 $t$에서 우주선과 혜성 사이의 거리를 $r(t)$라 하면
        $$(r(t))^2=2(t-2)^2+(t^2-4t+8)^2.$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $s(t)=(r(t))^2$이라 하면 $s'(t)=4(t-2)+2(t^2-4t+8)(2t-4)=4(t-2)(t^2-4t+9)$. $t^2-4t+9=(t-2)^2+5>0$이므로 $s'(t)$는 $t=2$의 좌우에서 $-$에서 $+$로 바뀐다.
      criteria: [1.M2, 1.A1]
    - id: 1b-3
      content: |
        따라서 $s(t)$는 $t=2$에서 최솟값 $16$을 가지고 $r(2)=4$. 즉 거리가 최소가 되는 시각은 $t=2$, 그 때의 거리는 $4$.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
