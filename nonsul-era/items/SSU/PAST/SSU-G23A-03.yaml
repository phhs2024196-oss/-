    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: 곡선 위에서 $\ell$에 가장 가까운 점은 접선의 기울기가 $\sqrt2$인 점이라는 조건을 세웠다.
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 매개변수 미분으로 $t=3$, $\mathrm{P}(2\sqrt2,6)$을 구했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: P에서 $\ell$에 내린 수선의 방정식을 세웠다.
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: 수선의 발 $\mathrm{Q}(3\sqrt2,5)$.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: 우주선이 같은 시각 $t=3$에 Q를 지나야 한다는 조건(또는 $s^\prime(3)=0$)으로 시작점을 결정했다.
      depends_on: [2.A1]
      steps: [2b-4, 2c-1]
    - id: 2.A3
      mark_type: A
      points: 2
      evidence: 시작 위치 $(0,-1)$과 시각 $t=3$.
      depends_on: [2.R1]
      cao: true
      steps: [2b-5, 2c-1]
