- id: '2'
  stem: |
    (2) 혜성과 우주선이 가장 가까워질 수 있도록 하는 시각 $t=0$에서의 우주선의 위치와, 이때 가장 가까워지는 시각 $t$를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: set, value: '(0,-1),\ t=3', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 곡선 위 점 중 $\ell$에 가장 가까운 점은 접선 기울기 $\dfrac{dy}{dx}=\dfrac{2t-2}{2\sqrt2}=\sqrt2$인 $t=3$, $\mathrm{P}(2\sqrt2,6)$. 그 수선의 발 $\mathrm{Q}(3\sqrt2,5)$를 우주선이 $t=3$에 지나야 하므로 시작점 $(0,-1)$.
    steps:
    - {id: 2a, content: '$t=3$, $\mathrm{P}(2\sqrt2,6)$, $\mathrm{Q}(3\sqrt2,5)$ → $x_0=0$, 시작점 $(0,-1)$', criteria: [2.M1, 2.A1, 2.M2, 2.A2, 2.R1, 2.A3]}
    hint_ladder:
    - 곡선 위의 점 중 직선에 가장 가까운 점에서의 접선은 직선과 어떤 관계인가?
    - 혜성과 우주선이 각각 가장 가까운 두 점을 같은 시각에 지나야 한다.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.39~40
    steps:
    - id: 2b-1
      content: |
        혜성을 가능한 가장 가까운 거리에서 관측하려면, 혜성이 움직이는 곡선 $C$ 위의 점과 직선 $\ell$ 위의 점 중 가장 가까운 두 점을 혜성과 우주선이 각각 같은 시각에 지나야 한다. 곡선 $C$ 위의 점 중 $\ell$과 가장 가까운 점을 P라 하면, P에서의 접선의 기울기는 $\ell$의 기울기 $\sqrt2$와 같다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        매개변수로 나타낸 함수의 미분법에 의하여 $\dfrac{dy}{dx}=\dfrac{dy/dt}{dx/dt}=\dfrac{2t-2}{2\sqrt2}$. $\dfrac{dy}{dx}=\sqrt2$이면 $t=3$이고, 이때 혜성의 위치는 $\mathrm{P}(2\sqrt2,6)$.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        P에서 $\ell$에 내린 수선 $\ell'$은 기울기 $-\dfrac{1}{\sqrt2}$이고 P를 지나므로 $\ell':\ y=-\dfrac{1}{\sqrt2}(x-2\sqrt2)+6=-\dfrac{1}{\sqrt2}x+8$. $\ell$과 $\ell'$을 연립하면 교점 $\mathrm{Q}(3\sqrt2,5)$.
      criteria: [2.M2, 2.A2]
    - id: 2b-4
      content: |
        시각 $t=0$에서의 우주선의 위치를 $(x_0,\sqrt2x_0-1)$이라 하면 시각 $t$에서의 위치는 $x=\sqrt2t+x_0$, $y=2t+\sqrt2x_0-1$. $t=3$일 때 Q를 지나야 하므로 $3\sqrt2=3\sqrt2+x_0$, $5=6+\sqrt2x_0-1$.
      criteria: [2.R1]
    - id: 2b-5
      content: |
        따라서 $x_0=0$이고 시각 $t=0$에서의 우주선의 위치는 $(0,-1)$, 가장 가까워지는 시각은 $t=3$이다.
      criteria: [2.A3]
  - id: S2-ALT
    audience: ALT
    method_no: 2
    source_flow: 해설교재 p.40 다른 풀이
    key_idea: (해설교재 다른 풀이) 시작점을 $(a,\sqrt2a-1)$로 두고 거리 제곱 $s(t)$가 $t=3$에서 최소이어야 하므로 $s^\prime(3)=0$.
    steps:
    - id: 2c-1
      content: |
        $(r(t))^2=(\sqrt2t-4\sqrt2-a)^2+(t^2-4t+4-\sqrt2a)^2$, $s'(t)=2\sqrt2(\sqrt2t-4\sqrt2-a)+2(t^2-4t+4-\sqrt2a)(2t-4)$. $s'(3)=-3\sqrt2a=0$에서 $a=0$, 시작 위치 $(0,-1)$, 시각 $t=3$.
      criteria: [2.R1, 2.A3]
