stimuli: []

stem: |
  함수 $g(x)$는 $x\le0$에서 정의된 연속함수이며, 일반항이 $a_n=n(n-1)$인 수열 $\{a_n\}$과 $S_n=\displaystyle\sum_{i=1}^na_i$에 대하여 함수 $f(x)$가 다음 조건을 모두 만족시키는 연속함수라고 하자.

  (i) $x\le0$일 때 $f(x)=g(x)$

  (ii) $1$보다 크거나 같은 정수 $n$에 대하여 $n-1\le x<n$일 때
  $$f(x)=g(-S_n+(n-1-x)a_{n+1})$$

  (iii) $2$보다 크거나 같은 정수 $n$에 대하여 $\displaystyle\int_0^{a_n}f(x-S_n)dx=1$

  이때 다음 문항에 답하시오.

  (1) $2$보다 크거나 같은 정수 $n$에 대하여 정적분 $\displaystyle\int_{-S_{n-1}}^{-S_n}g(x)dx$의 값을 구하시오.

  (2) 정적분 $\displaystyle\int_0^{2023}f(x)dx$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    (1) $2$보다 크거나 같은 정수 $n$에 대하여 정적분 $\displaystyle\int_{-S_{n-1}}^{-S_n}g(x)dx$의 값을 구하시오.
  points: 10
  depends_on: []
  answer: {kind: value, value: '-1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $t=x-S_n$로 치환하면 (iii)은 $\displaystyle\int_{-S_n}^{-S_{n-1}}f(t)dt=1$이고 구간이 $x\le0$이므로 $f=g$. 적분 방향을 바꾸면 $-1$.
    steps:
    - {id: 1a, content: '$\displaystyle\int_{-S_n}^{-S_{n-1}}g=1$ → $\displaystyle\int_{-S_{n-1}}^{-S_n}g=-1$', criteria: [1.M1, 1.R1, 1.A1]}
    hint_ladder:
    - $x-S_n=t$로 치환하면 적분 구간은 어떻게 바뀌는가?
    - $-S_n+a_n$은 무엇과 같은가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.41
    steps:
    - id: 1b-1
      content: |
        $t=x-S_n$으로 치환하면 $\displaystyle\int_0^{a_n}f(x-S_n)dx=\int_{-S_n}^{-S_n+a_n}f(t)dt$이고, $-S_n+a_n=-S_{n-1}$이므로 $\displaystyle\int_{-S_n}^{-S_n+a_n}f(t)dt=\int_{-S_n}^{-S_{n-1}}f(t)dt$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $a_n$은 모두 0보다 크거나 같으므로 $-S_n\le-S_{n-1}\le0$이다. 조건 (i)에 의하여 $\displaystyle\int_{-S_n}^{-S_{n-1}}f(t)dt=\int_{-S_n}^{-S_{n-1}}g(t)dt$.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        따라서 $\displaystyle\int_{-S_n}^{-S_{n-1}}g(x)dx=\int_0^{a_n}f(x-S_n)dx=1$이고, $\displaystyle\int_{-S_{n-1}}^{-S_n}g(x)dx=-1$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $t=x-S_n$ 치환과 $-S_n+a_n=-S_{n-1}$로 적분 구간을 $[-S_n,-S_{n-1}]$로 바꾸었다.
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 3
      evidence: 구간이 $x\le0$에 있으므로 (i)에 의해 $f=g$임을 밝혔다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 적분 방향을 바꾸어 $-1$을 얻었다.
      depends_on: [1.M1, 1.R1]
      cao: true
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0520}
  misconceptions:
  - id: MC-CAL-0520
    outcome_code: '71'
    wrong_work: '(iii)을 그대로 옮겨 $\displaystyle\int_{-S_{n-1}}^{-S_n}g=1$이라 답함'
    detect_cue: 답이 $1$, 위끝·아래끝 순서 확인 없음
    feedback: $-S_n<-S_{n-1}$입니다. (iii)은 아래끝 $-S_n$에서 위끝 $-S_{n-1}$까지의 적분이므로 끝을 바꾸면 부호가 바뀝니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    (2) 정적분 $\displaystyle\int_0^{2023}f(x)dx$의 값을 구하시오.
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '\dfrac{2023}{2024}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\displaystyle\int_{n-1}^nf(x)dx$에서 $t=-S_n+(n-1-x)a_{n+1}$로 치환하면 $\dfrac{1}{a_{n+1}}\displaystyle\int_{-S_{n+1}}^{-S_n}g(t)dt=\dfrac{1}{n(n+1)}$. 합은 $1-\dfrac{1}{2024}$.
    steps:
    - {id: 2a, content: '$\displaystyle\int_{n-1}^nf=\dfrac1n-\dfrac{1}{n+1}$ → $\displaystyle\int_0^{2023}f=\dfrac{2023}{2024}$', criteria: [2.M1, 2.M2, 2.A1, 2.R1, 2.A2]}
    hint_ladder:
    - $[0,2023]$을 길이 1인 구간으로 나누어 보자.
    - 각 구간에서 $g$ 안의 일차식을 $t$로 치환하면 적분 구간의 끝은 무엇이 되는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.41~42
    steps:
    - id: 2b-1
      content: |
        정적분의 성질에 의하여 $\displaystyle\int_0^{2023}f(x)dx=\sum_{n=1}^{2023}\int_{n-1}^nf(x)dx$이고, $n\ge1$일 때 $\displaystyle\int_{n-1}^nf(x)dx=\int_{n-1}^ng(-S_n+(n-1-x)a_{n+1})dx$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $t=-S_n+(n-1-x)a_{n+1}$이라 두면 $dt=-a_{n+1}dx$, $x=n-1$일 때 $t=-S_n$, $x=n$일 때 $t=-S_n-a_{n+1}$이므로
        $$\int_{n-1}^nf(x)dx=\int_{-S_n}^{-S_n-a_{n+1}}\left(-\dfrac{g(t)}{a_{n+1}}\right)dt=\int_{-S_n-a_{n+1}}^{-S_n}\dfrac{g(t)}{a_{n+1}}dt.$$
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $-S_n-a_{n+1}=-S_{n+1}$이고, $n\ge2$일 때 (1)의 결과에 의하여 $\displaystyle\int_{-S_n}^{-S_{n-1}}g(t)dt=1$이므로 $n\ge1$일 때 $\displaystyle\int_{-S_{n+1}}^{-S_n}g(t)dt=1$. 그러므로
        $$\int_{-S_n-a_{n+1}}^{-S_n}\dfrac{g(t)}{a_{n+1}}dt=\dfrac{1}{a_{n+1}}\int_{-S_{n+1}}^{-S_n}g(t)dt=\dfrac{1}{a_{n+1}}.$$
      criteria: [2.A1, 2.R1]
    - id: 2b-4
      content: |
        따라서 $\displaystyle\int_{n-1}^nf(x)dx=\dfrac{1}{a_{n+1}}=\dfrac{1}{n(n+1)}=\dfrac1n-\dfrac{1}{n+1}$이고
        $$\int_0^{2023}f(x)dx=\sum_{n=1}^{2023}\left(\dfrac1n-\dfrac{1}{n+1}\right)=1-\dfrac{1}{2024}=\dfrac{2023}{2024}.$$
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: 적분을 $\displaystyle\sum_{n=1}^{2023}\int_{n-1}^nf(x)dx$로 나누었다.
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: $t=-S_n+(n-1-x)a_{n+1}$ 치환으로 $dt=-a_{n+1}dx$와 바뀐 적분 구간을 바르게 적었다.
      steps: [2b-2]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: $-S_n-a_{n+1}=-S_{n+1}$을 확인했다.
      depends_on: [2.M2]
      steps: [2b-3]
    - id: 2.R1
      mark_type: R
      points: 3
      evidence: (1)의 결과로 $\displaystyle\int_{-S_{n+1}}^{-S_n}g=1$ ($n\ge1$)을 써서 $\displaystyle\int_{n-1}^nf=\dfrac{1}{a_{n+1}}$을 얻었다.
      depends_on: [2.M2]
      ft: {allowed: true, from: [1.A1], max_points: 3}
      steps: [2b-3]
    - id: 2.A2
      mark_type: A
      points: 3
      evidence: 부분분수로 합을 구해 $\dfrac{2023}{2024}$.
      depends_on: [2.R1]
      cao: true
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 3
