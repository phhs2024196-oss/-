  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-0521}
  misconceptions:
  - id: MC-CAL-0521
    outcome_code: '72'
    wrong_work: '치환에서 $dx=-\dfrac{dt}{a_{n+1}}$의 계수를 빠뜨려 각 구간 적분을 1로 보고 $2023$이라 답함'
    detect_cue: 답이 $2023$ 또는 $\pm2023$, $\dfrac{1}{a_{n+1}}$이 없음
    feedback: $t=(\text{일차식})$으로 치환하면 $dt=(\text{기울기})\,dx$입니다. 기울기 $-a_{n+1}$로 나누는 것을 잊지 마세요.
    remedy: [RL-2]

