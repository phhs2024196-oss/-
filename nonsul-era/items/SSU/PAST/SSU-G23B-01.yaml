# 해설교재(p.43)와 답 일치: (2+√3)/16.
# 참고: 교점 P_m 은 원 x^2-x+y^2=0 에서 점 (1,0) 을 제외한 부분만 지난다(m→±∞ 극한). 해설교재는 이를 언급하지 않으나 최대 삼각형을 (1,0) 을 피해 배치할 수 있으므로 답에는 영향 없음 — B 해설에 한 줄 보충.
