stem: |
  다음 조건을 모두 만족시키는 삼각형의 넓이의 최댓값을 구하시오.

  (i) 실수 $m$에 대하여 두 직선 $x+2my=0$과 $2mx-y-2m=0$의 교점을 $\mathrm{P}_m$이라고 할 때, 서로 다른 세 실수 $m_1$, $m_2$, $m_3$에 대하여 $\mathrm{P}_{m_1}$, $\mathrm{P}_{m_2}$, $\mathrm{P}_{m_3}$을 꼭짓점으로 갖는다.

  (ii) 한 각의 크기는 $\dfrac{\pi}{6}$이다.

subparts:
- id: '1'
  stem: |
    삼각형의 넓이의 최댓값을 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '\dfrac{2+\sqrt{3}}{16}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 자취는 지름이 1인 원. 사인법칙으로 $\dfrac{\pi}{6}$의 대변 $=\dfrac12$, 그 대변에서 가장 먼 원 위의 점이 꼭짓점일 때(이등변) 높이 $\dfrac14\tan\dfrac{5\pi}{12}=\dfrac{2+\sqrt3}{4}$, 넓이 $\dfrac{2+\sqrt3}{16}$.
    steps:
    - {id: 1a, content: '$2R=1$, $a=\dfrac12$, 높이 $\dfrac{\tan(5\pi/12)}{4}$ → $\dfrac{2+\sqrt3}{16}$', criteria: [1.M1, 1.A1, 1.M2, 1.R1, 1.A2]}
    hint_ladder:
    - 두 직선이 $m$에 관계없이 지나는 점을 찾아보자.
    - 두 직선의 기울기의 곱은?
    - 외접원이 정해지면 사인법칙으로 한 변의 길이가 정해진다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.43
    steps:
    - id: 1b-1
      content: |
        직선 $\ell:\ x+2my=0$과 $\ell':\ 2mx-y-2m=0$은 $m$에 관계없이 각각 점 $(0,0)$과 $(1,0)$을 지난다. $m\ne0$이면 두 직선의 기울기는 $-\dfrac{1}{2m}$, $2m$이므로 항상 수직으로 만나고, $m=0$이면 두 직선은 $y$축, $x$축이므로 역시 수직으로 만난다. 따라서 교점 $\mathrm{P}_m$은 점 $(0,0)$과 점 $(1,0)$을 이은 선분을 지름으로 하는 원 위에 있다.
        (보충: 교점을 직접 구하면 $\mathrm{P}_m\left(\dfrac{4m^2}{4m^2+1},\dfrac{-2m}{4m^2+1}\right)$이므로 이 원에서 점 $(1,0)$만 제외한 모든 점이 나타난다.)
      criteria: [1.M1]
    - id: 1b-2
      content: |
        세 점 $\mathrm{P}_{m_1}$, $\mathrm{P}_{m_2}$, $\mathrm{P}_{m_3}$을 A, B, C라 하면 삼각형 ABC의 외접원은 위의 원(반지름 $\dfrac12$)이므로 사인법칙에서 $\dfrac{a}{\sin A}=2R=1$. $A=\dfrac{\pi}{6}$이면 $a=\sin A=\dfrac12$. 그러므로 조건을 만족하는 삼각형은 반지름 $\dfrac12$인 원에 내접하고 변 BC의 길이가 $\dfrac12$인 삼각형이다.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        넓이가 최대이려면 변 BC로부터 거리가 최대인 원 위의 점이 나머지 꼭짓점 A가 되어야 하고, 이때 삼각형 ABC는 이등변삼각형이다($\angle\mathrm{B}=\angle\mathrm{C}=\dfrac{5\pi}{12}$). 이 배치는 점 $(1,0)$을 꼭짓점으로 쓰지 않도록 원 위에서 돌려 잡을 수 있다.
      criteria: [1.M2, 1.R1]
    - id: 1b-4
      content: |
        밑변 $\dfrac12$, 밑각 $\dfrac{5\pi}{12}$인 이등변삼각형의 높이는 $\dfrac14\tan\dfrac{5\pi}{12}$이고, 덧셈정리에 의하여
        $$\tan\dfrac{5\pi}{12}=\tan\left(\dfrac{\pi}{6}+\dfrac{\pi}{4}\right)=\dfrac{\tan\frac{\pi}{6}+\tan\frac{\pi}{4}}{1-\tan\frac{\pi}{6}\tan\frac{\pi}{4}}=2+\sqrt3.$$
        따라서 넓이의 최댓값은 $\dfrac12\cdot\dfrac12\cdot\dfrac{2+\sqrt3}{4}=\dfrac{2+\sqrt3}{16}$.
      criteria: [1.A2]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: (코사인법칙) 이등변삼각형의 같은 두 변을 $b$라 하면 $\left(\dfrac12\right)^2=2b^2\left(1-\cos\dfrac{\pi}{6}\right)$에서 $b^2=\dfrac{2+\sqrt3}{4}$, 넓이 $\dfrac12b^2\sin\dfrac{\pi}{6}=\dfrac{2+\sqrt3}{16}$. 덧셈정리 없이 수학Ⅰ 범위로 끝난다.
    steps:
    - id: 1c-1
      content: |
        $b^2=\dfrac{1/4}{2-\sqrt3}=\dfrac{2+\sqrt3}{4}$, 넓이 $=\dfrac12\cdot\dfrac{2+\sqrt3}{4}\cdot\dfrac12=\dfrac{2+\sqrt3}{16}$.
      criteria: [1.A2]
