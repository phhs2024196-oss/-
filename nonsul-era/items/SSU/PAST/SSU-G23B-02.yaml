stimuli: []

stem: |
  실수 $k$에 대하여 방정식 $\dfrac{\lvert2x\rvert}{x^2+1}=k$의 서로 다른 실수해의 개수를 $f(k)$라고 하자.
  이때 다음 문항에 답하시오.

  (1) 함수 $f(k)$의 그래프를 그리시오.

  (2) 다음 조건을 모두 만족시키는 함수 $g(x)$에 대하여 항상 $g(0)>c$가 되도록 하는 실수 $c$ 중 가장 큰 값을 구하시오.

  (i) 함수 $g(x)$는 최고차항의 계수가 $1$인 사차함수이다.

  (ii) 모든 정수 $n$에 대하여 $g(n)\ge0$이다.

  (iii) 합성함수 $g\circ f$는 실수 전체에서 연속이다.

  (iv) 함수 $h(x)=[x]$에 대하여 합성함수 $f\circ g\circ h$는 실수 전체에서 연속이다. (단, 실수 $x$에 대하여 $[x]$는 $x$보다 크지 않은 정수 중 가장 큰 정수이다.)

subparts:
- id: '1'
  stem: |
    (1) 함수 $f(k)$의 그래프를 그리시오.
  points: 10
  depends_on: []
  answer: {kind: expression, value: 'f(k)=0\ (k<0);\ 1\ (k=0);\ 4\ (0<k<1);\ 2\ (k=1);\ 0\ (k>1)', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $y=\dfrac{\lvert2x\rvert}{x^2+1}$은 우함수, $x=0$에서 0, $x=\pm1$에서 최댓값 1, 양 끝에서 0으로 수렴. 직선 $y=k$와의 교점 수를 센다.
    steps:
    - {id: 1a, content: '$f(k)=0\ (k<0)$, $1\ (k=0)$, $4\ (0<k<1)$, $2\ (k=1)$, $0\ (k>1)$', criteria: [1.M1, 1.A1, 1.A2]}
    hint_ladder:
    - $y=\dfrac{\lvert2x\rvert}{x^2+1}$의 그래프는 $y$축에 대칭이다.
    - $x>0$에서 $\dfrac{2x}{x^2+1}\le1$을 보여 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.44
    steps:
    - id: 1b-1
      content: |
        $p(x)=\dfrac{\lvert2x\rvert}{x^2+1}$은 $p(-x)=p(x)$인 우함수이고 $p(x)\ge0$, $p(0)=0$. $1-p(x)=\dfrac{(\lvert x\rvert-1)^2}{x^2+1}\ge0$이므로 $x=1$과 $x=-1$에서 최댓값 1을 가지고, $x\to\infty$ 혹은 $x\to-\infty$일 때 0으로 수렴한다. 또 $0<k<1$이면 $x>0$에서 $kx^2-2x+k=0$은 판별식이 양수이고 두 근의 합·곱이 양수이므로 양의 근이 2개이다.
        [그림 설명] $y=p(x)$의 그래프: 원점에서 0, $x=\pm1$에서 높이 1인 두 봉우리를 가지며 양쪽으로 $x$축에 가까워지는 $y$축 대칭 곡선.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        직선 $y=k$와의 교점 개수를 세면
        $$f(k)=\begin{cases}0 & (k<0)\\ 1 & (k=0)\\ 4 & (0<k<1)\\ 2 & (k=1)\\ 0 & (k>1)\end{cases}$$
        [그림 설명] $f(k)$의 그래프: $k<0$과 $k>1$에서 높이 0인 반직선, $0<k<1$에서 높이 4인 선분(양 끝 빈 점), $k=0$에서 점 $(0,1)$, $k=1$에서 점 $(1,2)$ (채운 점), $(0,0)$, $(1,0)$, $(0,4)$, $(1,4)$는 빈 점.
      criteria: [1.A1, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $y=\dfrac{\lvert2x\rvert}{x^2+1}$의 대칭성, 최댓값 1($x=\pm1$), 점근 행동(0으로 수렴)을 밝혔다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $k<0$, $0<k<1$, $k>1$에서 $f(k)=0,\ 4,\ 0$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $f(0)=1$, $f(1)=2$를 그래프에 채운 점·빈 점과 함께 바르게 나타냈다.
      depends_on: [1.M1]
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: 그래프(또는 식)만 있고 근거 없음
      effect: cap
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-0523}
  misconceptions:
  - id: MC-ALG-0523
    outcome_code: '71'
    wrong_work: '$k=0$, $k=1$에서의 값(1, 2)을 빠뜨리고 구간의 값만 이어 그림'
    detect_cue: $f(0)$, $f(1)$을 따로 적지 않음, 빈 점·채운 점 구분 없음
    feedback: 직선 $y=k$가 최댓값·최솟값 높이를 지날 때는 교점이 접점이 되어 개수가 달라집니다. 경계값을 따로 세세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    (2) 조건 (i)~(iv)를 모두 만족시키는 함수 $g(x)$에 대하여 항상 $g(0)>c$가 되도록 하는 실수 $c$ 중 가장 큰 값을 구하시오.
  points: 20
  depends_on: ['1']
  answer: {kind: value, value: '7', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: (iii)에서 $g(0)=g(1)=g(2)=g(4)$, $g(x)=x(x-1)(x-2)(x-4)+a$. (iv)에서 $f(g(n))$ 일정 → $g(n)>1$ ($n$은 정수). 정수점 최솟값 $g(3)=a-6>1$ → $g(0)=a>7$ → $c=7$.
    steps:
    - {id: 2a, content: '$g(x)=x(x-1)(x-2)(x-4)+a$, $g(3)=a-6>1$ → $g(0)>7$ → $c=7$', criteria: [2.M1, 2.A1, 2.M2, 2.R1, 2.R2, 2.A2]}
    hint_ladder:
    - $f$가 끊기는 점 $k=0$, $k=1$에서 $g\circ f$의 좌극한, 우극한, 함숫값을 비교하자.
    - $h(x)=[x]$는 정수에서만 끊긴다. $x=n$에서 $f\circ g\circ h$의 좌극한과 함숫값은?
    - $f(g(n))$이 0이 아닐 수 있는가?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.44~45
    steps:
    - id: 2b-1
      content: |
        (iii)에서 $g\circ f$는 $x=0$에서 연속이므로 $\displaystyle\lim_{x\to0+}(g\circ f)(x)=\lim_{x\to0-}(g\circ f)(x)=(g\circ f)(0)$. 그런데 $\displaystyle\lim_{x\to0+}(g\circ f)(x)=g(4)$, $\displaystyle\lim_{x\to0-}(g\circ f)(x)=g(0)$, $(g\circ f)(0)=g(1)$이므로 $g(0)=g(1)=g(4)$.
        마찬가지로 $x=1$에서 연속이므로 $\displaystyle\lim_{x\to1+}(g\circ f)(x)=g(0)$, $\displaystyle\lim_{x\to1-}(g\circ f)(x)=g(4)$, $(g\circ f)(1)=g(2)$에서 $g(0)=g(2)=g(4)$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        따라서 $g(0)=g(1)=g(2)=g(4)$이고, (i)과 (iii)을 만족시키는 함수는 실수 $a$에 대하여 $g(x)=x(x-1)(x-2)(x-4)+a$이다.
      criteria: [2.A1]
    - id: 2b-3
      content: |
        (iv)에서 $f\circ g\circ h$가 연속이면 정수 $n$에서도 연속이고 $\displaystyle\lim_{x\to n-}(f\circ g\circ h)(x)=f(g(n-1))$, $\displaystyle\lim_{x\to n+}(f\circ g\circ h)(x)=f(g(n))$이므로 $f(g(n-1))=f(g(n))$, 즉 $f(g(n))$의 값이 모든 정수 $n$에 대하여 같다.
      criteria: [2.M2]
    - id: 2b-4
      content: |
        $g$가 (i)을 만족하면 $g(m)>1$인 정수 $m$이 항상 존재하고 이때 $f(g(m))=0$이다. $g$가 (ii)를 만족하고 $g(m')\le1$인 정수 $m'$이 있으면 $0\le g(m')\le1$이므로 $f(g(m'))=1,\ 2$ 혹은 $4$가 되어 $f(g(m))\ne f(g(m'))$이 된다. 따라서 (i)~(iv)를 만족시키는 함수는 $g(x)=x(x-1)(x-2)(x-4)+a$이면서 모든 정수 $n$에 대하여 $g(n)>1$인 함수이다. (이때 $(f\circ g\circ h)(x)=0$.)
      criteria: [2.R1]
    - id: 2b-5
      content: |
        $g(x)=x(x-1)(x-2)(x-4)+a$의 그래프의 개형으로부터 정수에서의 함숫값 중 가장 작은 값은 $g(3)$이다($g(0)=g(1)=g(2)=g(4)=a$, $g(-1)=a+30$, $g(5)=a+60$, 나머지 정수에서는 더 크다). 따라서 모든 정수 $n$에 대하여 $g(n)>1$인 것은 $g(3)=3\cdot2\cdot1\cdot(-1)+a=a-6>1$, 즉 $a=g(0)>7$과 동치이다.
      criteria: [2.R2]
    - id: 2b-6
      content: |
        그러므로 조건을 만족시키는 모든 $g$에 대하여 $g(0)>c$이려면 $c\le7$이어야 하고, 구하는 $c$의 값은 $7$이다.
      criteria: [2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: $k=0$, $k=1$에서 $g\circ f$의 좌·우극한과 함숫값을 비교해 $g(0)=g(1)=g(4)$, $g(0)=g(2)=g(4)$를 얻었다.
      ft: {allowed: true, from: [1.A1, 1.A2], max_points: 4}
      steps: [2b-1]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $g(x)=x(x-1)(x-2)(x-4)+a$.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: 정수 $n$에서 $f\circ g\circ h$의 연속 조건을 $f(g(n-1))=f(g(n))$으로 바꾸었다.
      steps: [2b-3]
    - id: 2.R1
      mark_type: R
      points: 4
      evidence: 공통값이 0이어야 하므로 모든 정수 $n$에서 $g(n)>1$임을 (ii)와 함께 논증했다.
      depends_on: [2.M2]
      steps: [2b-4]
    - id: 2.R2
      mark_type: R
      points: 3
      evidence: 정수점에서 최솟값이 $g(3)=a-6$임을 밝혀 $a>7$을 얻었다.
      depends_on: [2.A1, 2.R1]
      steps: [2b-5]
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: $c=7$.
      depends_on: [2.R2]
      cao: true
      steps: [2b-6]
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 4
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '72', misconception: MC-CAL-0524}
  misconceptions:
  - id: MC-CAL-0524
    outcome_code: '72'
    wrong_work: '정수점의 최솟값을 근 0, 1, 2, 4에서의 값 $a$로 보고 $a>1$에서 $c=1$이라 답함'
    detect_cue: $g(3)$을 계산하지 않음, 답 $1$
    feedback: $g(x)-a$는 $2<x<4$에서 음수입니다. 정수 $3$에서의 값 $g(3)=a-6$이 가장 작습니다.
    remedy: [RL-2]

