      points: 6
      evidence: 윗면 $8+a$, 아랫면 $8-b$에 대해 부피 보존 식을 두 구간의 정적분 합으로 세웠다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $b=-2+\sqrt{-2a^2-4a+52}$ (부호 선택 근거 포함)와 두께 $h(a)$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $h^\prime(a)$를 구하고 $h^\prime(a)=0$에서 $a=2$를 얻었다.
      depends_on: [1.A1]
      steps: [1b-4]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: 증감표(또는 끝값 비교)로 $a=2$에서 최대임을 밝혔다.
      depends_on: [1.M2]
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 윗면이 8보다 낮아지는 경우 두께가 감소함을 언급하고 최댓값 $6$을 답했다.
      depends_on: [1.R1]
      cao: true
      steps: [1b-5]
