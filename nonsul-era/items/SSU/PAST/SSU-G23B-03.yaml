stem: |
  오른쪽 그림과 같이 높이가 $12$인 용기가 있다. 이 용기를 밑면에 평행한 평면으로 자른 단면은 원이며, 밑면으로부터 높이가 $x$인 지점에서 단면의 반지름 $R(x)$는 다음과 같이 주어져 있다.

  $$R(x)=\begin{cases}\sqrt{\dfrac{8-x}{2}+1} & (0\le x\le8)\\ \sqrt{x-7} & (8\le x\le12)\end{cases}$$

  용기의 높이가 $0\le x\le8$인 부분과 $8\le x\le12$인 부분에는 각각 물과 기름이 가득 차 있다.

  [그림 설명] 세로축을 중심축으로 하는 모래시계 모양의 용기. 아래쪽 높이 8인 부분(물, 짙은 색)은 위로 갈수록 좁아지고, 위쪽 높이 4인 부분(기름, 옅은 색)은 위로 갈수록 넓어진다. 높이 $x$에서의 단면 반지름 $R(x)$가 표시되어 있다.

  이제 용기의 바닥, 즉 높이 $x=0$인 부분에 구멍을 뚫어 천천히 물을 용기 밖으로 내보낸다고 하자. 물을 내보냄에 따라 기름층도 아래로 이동하면서 기름층의 두께가 변하게 된다.
  (단, 기름층의 두께는 기름층의 윗면의 높이와 아랫면의 높이의 차이를 의미한다. 기름과 물은 항상 위와 아래로 분리되어 층을 이루며 기름층의 윗면과 아랫면은 항상 밑면과 평행하다고 가정하자.)
  이때 기름층의 두께의 최댓값을 구하시오.

subparts:
- id: '1'
  stem: |
    기름층의 두께의 최댓값을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '6', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $V=\displaystyle\int_8^{12}\pi(x-7)dx=12\pi$. 윗면 $8+a$, 아랫면 $8-b$이면 $\pi\left(\dfrac{a^2}{2}+a+\dfrac{b^2}{4}+b\right)=12\pi$ → $h(a)=a-2+\sqrt{-2a^2-4a+52}$, $h^\prime(2)=0$, $h(2)=6$.
    steps:
    - {id: 1a, content: '$h(a)=a-2+\sqrt{-2a^2-4a+52}$ $(0\le a\le4)$ → 최댓값 $h(2)=6$', criteria: [1.B1, 1.M1, 1.A1, 1.M2, 1.R1, 1.A2]}
    hint_ladder:
    - 기름의 부피는 변하지 않는다.
    - 윗면과 아랫면의 높이를 8을 기준으로 $8+a$, $8-b$로 두어 보자.
    - 윗면이 8보다 아래로 내려가면 두께는 어떻게 되는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.46
    steps:
    - id: 1b-1
      content: |
        기름의 부피를 $V$라 하면 $V=\displaystyle\int_8^{12}\pi(\sqrt{x-7})^2dx=\int_8^{12}\pi(x-7)dx=\pi\left[\dfrac12x^2-7x\right]_8^{12}=12\pi$.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        1) 기름층의 윗면의 높이가 8보다 크거나 같을 때: $0\le a\le4$에 대해 윗면 높이 $8+a$, 아랫면 높이 $8-b$ $(b\ge0)$라 하면
        $$12\pi=\int_8^{8+a}\pi(\sqrt{x-7})^2dx+\int_{8-b}^8\pi\left(\sqrt{\dfrac{8-x}{2}+1}\right)^2dx.$$
        $x-8=t$로 치환하면
        $$12\pi=\int_0^a\pi(t+1)dt+\int_{-b}^0\pi\left(-\dfrac t2+1\right)dt=\pi\left[\dfrac{t^2}{2}+t\right]_0^a+\pi\left[-\dfrac{t^2}{4}+t\right]_{-b}^0=\pi\left(\dfrac{a^2}{2}+a+\dfrac{b^2}{4}+b\right).$$
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $b^2+4b+2a^2+4a-48=0$에서 $b=-2\pm\sqrt{-2a^2-4a+52}$인데, $0\le a\le4$일 때 $-2a^2-4a+52\ge4$이므로 $b\ge0$이 되는 것은 $b=-2+\sqrt{-2a^2-4a+52}$. 따라서 윗면 높이가 $8+a$일 때 두께는
        $$h(a)=a+b=a-2+\sqrt{-2a^2-4a+52}\quad(0\le a\le4).$$
      criteria: [1.A1]
    - id: 1b-4
      content: |
        $h'(a)=1-\dfrac{2a+2}{\sqrt{-2a^2-4a+52}}$. $h'(a)=0$이면 $2a+2=\sqrt{-2a^2-4a+52}$, $4(a+1)^2=-2a^2-4a+52$, 즉 $a^2+2a-8=(a+4)(a-2)=0$이고 $0\le a\le4$이므로 $a=2$. $0<a<2$에서 $h'>0$, $2<a\le4$에서 $h'<0$이므로 $h(a)$는 $a=2$에서 최댓값 $h(2)=6$을 가진다. ($h(0)=-2+2\sqrt{13}$, $h(4)=4$.) 즉 윗면이 높이 8일 때의 두께 $-2+2\sqrt{13}$은 6보다 작다.
      criteria: [1.M2, 1.R1]
    - id: 1b-5
      content: |
        2) 기름층의 윗면의 높이가 8보다 작으면, 기름층이 아래로 이동할수록 용기의 단면적이 점점 커지므로 기름층의 두께가 감소한다.
        1), 2)로부터 기름층의 두께의 최댓값은 $6$이다.
      criteria: [1.A2]
