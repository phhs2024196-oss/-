stimuli: []

stem: |
  좌표평면에서 점 $\mathrm{P}$가 다음 조건을 만족시키며 움직인다고 하자.

  점 $\mathrm{P}$는 원점 $\mathrm{O}$를 출발하여 함수 $y=3-x^4$의 그래프의 한 점 $\mathrm{Q}$까지 선분 $\mathrm{OQ}$를 따라 일정한 속력 $a$로 움직인 후, 직선 $\ell:\ y=-3x+10$의 한 점 $\mathrm{R}$까지 선분 $\mathrm{QR}$을 따라 속력 $1$로 움직인다. (단, $a$는 양수)

  [그림 설명] 좌표평면에 곡선 $y=3-x^4$(파란색, $y$절편 3, $x$축과 $x=\sqrt[4]{3}$ 부근에서 만남)과 직선 $y=-3x+10$(빨간색, 곡선의 오른쪽 위를 지남)이 그려져 있다.

  점 $\mathrm{P}$가 직선 $\ell$ 위의 한 점 $\mathrm{R}$까지 가장 빨리 도착할 때 점 $\mathrm{Q}$의 좌표는 $(1,2)$라고 하자. 이때 다음 문항에 답하시오.

  (1) $\theta=\angle\mathrm{OQR}$일 때 $\tan\theta$의 값을 구하시오. (단, $0\le\theta\le\pi$)

  (2) $a$를 구하시오.

subparts:
- id: '1'
  stem: |
    (1) $\theta=\angle\mathrm{OQR}$일 때 $\tan\theta$의 값을 구하시오. (단, $0\le\theta\le\pi$)
  points: 10
  depends_on: []
  answer: {kind: value, value: '-1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: QR $\perp\ell$이므로 QR의 기울기 $\dfrac13$, OQ의 기울기 2. $\theta=\pi-\theta_1+\theta_2$ ($\tan\theta_1=2$, $\tan\theta_2=\dfrac13$)이므로 $\tan\theta=\tan(\theta_2-\theta_1)=-1$.
    steps:
    - {id: 1a, content: '$\tan\theta=\dfrac{\frac13-2}{1+\frac23}=-1$', criteria: [1.M1, 1.M2, 1.A1]}
    hint_ladder:
    - Q가 정해져 있을 때 Q에서 직선 $\ell$까지 가장 빨리 가는 경로는?
    - 두 선분과 $x$축이 이루는 각을 이용해 $\theta$를 나타내 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.47
    steps:
    - id: 1b-1
      content: |
        점 P가 조건을 만족시키면서 직선 $\ell$ 위의 점까지 가장 빨리 도착하려면 점 Q와 R을 잇는 직선이 $\ell$과 수직이어야 한다. 이때 QR의 기울기는 $\dfrac13$이고 O와 Q를 잇는 직선의 기울기는 2이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        직선 $\ell$과 $x$축의 교점을 T, $\theta_1=\angle\mathrm{QOT}$라 하고, 점 Q를 지나고 $x$축에 평행한 직선이 $\ell$과 만나는 점을 S, $\theta_2=\angle\mathrm{RQS}$라 하자. 그러면 $\tan\theta_1=2$, $\tan\theta_2=\dfrac13$이고 $\tan\theta=\tan(\pi-\theta_1+\theta_2)=\tan(\theta_2-\theta_1)$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        삼각함수의 덧셈정리에 의하여
        $$\tan(\theta_2-\theta_1)=\dfrac{\tan\theta_2-\tan\theta_1}{1+\tan\theta_2\tan\theta_1}=\dfrac{\frac13-2}{1+\frac23}=-1.$$
        그러므로 $\tan\theta=-1$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: 가장 빨리 도착하려면 QR이 $\ell$에 수직(기울기 $\dfrac13$)이어야 함을 밝혔다.
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $\theta$를 두 직선이 $x$축과 이루는 각으로 나타냈다(예 $\theta=\pi-\theta_1+\theta_2$).
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 덧셈정리로 $\tan\theta=-1$.
      depends_on: [1.M1, 1.M2]
      cao: true
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0526}
  misconceptions:
  - id: MC-CAL-0526
    outcome_code: '71'
    wrong_work: '두 직선이 이루는 예각의 공식 $\left\lvert\dfrac{m_1-m_2}{1+m_1m_2}\right\rvert$을 써서 $\tan\theta=1$이라 답함'
    detect_cue: 절댓값을 씌운 끼인각 공식, 답 $1$
    feedback: $\angle\mathrm{OQR}$은 둔각일 수 있습니다. 각을 $\pi-\theta_1+\theta_2$처럼 방향을 맞춰 나타낸 뒤 덧셈정리를 쓰세요.
    remedy: [RL-1]
- id: '2'
  stem: |
    (2) $a$를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '7\sqrt{2}', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 총 시간 $t(x)=\dfrac{\sqrt{x^2+x^8-6x^4+9}}{a}-\dfrac{3x+(3-x^4)-10}{\sqrt{10}}$가 $x=1$에서 최소 → $t^\prime(1)=\dfrac{-14}{2a\sqrt5}+\dfrac{1}{\sqrt{10}}=0$ → $a=7\sqrt2$.
    steps:
    - {id: 2a, content: '$t^\prime(1)=\dfrac{-14}{2a\sqrt5}+\dfrac{1}{\sqrt{10}}=0$ → $a=7\sqrt2$', criteria: [2.M1, 2.M2, 2.R1, 2.M3, 2.A1]}
    hint_ladder:
    - Q의 $x$좌표를 변수로 두고 OQ의 길이와 Q에서 $\ell$까지의 거리를 식으로 써 보자.
    - 절댓값 안의 부호는 그림에서 판단할 수 있다.
    - $x=1$에서 최소이면 $t^\prime(1)$은?
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.47~48
    steps:
    - id: 2b-1
      content: |
        원점과 그래프 위의 점 $(x,3-x^4)$을 잇는 선분의 길이는 $\sqrt{x^2+x^8-6x^4+9}$이고, 점 $(x,3-x^4)$과 직선 $\ell:\ y=-3x+10$ 사이의 거리는 $\dfrac{\lvert3x+(3-x^4)-10\rvert}{\sqrt{10}}$이다.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        점 P가 원점을 출발하여 $\mathrm{Q}(x,3-x^4)$까지 움직인 후 Q에서 $\ell$에 내린 수선을 따라 R에 도착하기까지 걸리는 시간은
        $$t(x)=\dfrac{\sqrt{x^2+x^8-6x^4+9}}{a}+\dfrac{\lvert3x+(3-x^4)-10\rvert}{\sqrt{10}}.$$
        문제의 그림으로부터(곡선은 직선 $\ell$의 아래쪽에 있음) $3x+(3-x^4)-10<0$이므로
        $$t(x)=\dfrac{\sqrt{x^2+x^8-6x^4+9}}{a}-\dfrac{3x+(3-x^4)-10}{\sqrt{10}}$$
        이고 함수 $t(x)$는 미분가능하다.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $t(x)$는 $x=1$일 때 최솟값을 가지므로 $t'(1)=0$이다.
      criteria: [2.R1]
    - id: 2b-4
      content: |
        $$t'(x)=\dfrac{8x^7-24x^3+2x}{2a\sqrt{x^8-6x^4+x^2+9}}+\dfrac{4x^3-3}{\sqrt{10}},\qquad t'(1)=\dfrac{-14}{2a\sqrt5}+\dfrac{1}{\sqrt{10}}=0.$$
      criteria: [2.M3]
    - id: 2b-5
      content: |
        따라서 $a=\dfrac{14\sqrt{10}}{2\sqrt5}=7\sqrt2$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: OQ의 길이와 Q에서 $\ell$까지의 거리를 Q의 $x$좌표로 나타냈다.
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: 총 시간 $t(x)$를 세우고 절댓값 안의 부호($<0$)를 판정해 정리했다.
      depends_on: [2.M1]
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: Q가 $(1,2)$일 때 가장 빠르므로 $t^\prime(1)=0$이라는 근거를 적었다.
      steps: [2b-3]
    - id: 2.M3
      mark_type: M
      points: 3
      evidence: $t^\prime(x)$를 합성함수의 미분으로 구하고 $t^\prime(1)$을 계산했다.
      depends_on: [2.M2]
      steps: [2b-4]
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $a=7\sqrt2$.
      depends_on: [2.M3, 2.R1]
      cao: true
      steps: [2b-5]
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 3
