stimuli:
- label: 제시문
  body: |
    닫힌구간 $[a,b]$에서 연속인 함수 $f(x)$에 대하여 미분가능한 함수 $x=g(t)$의 도함수 $g'(t)$가 $a=g(\alpha)$, $b=g(\beta)$일 때, $\alpha$와 $\beta$를 포함하는 구간에서 연속이면

    $$\int_a^bf(x)\,dx=\int_\alpha^\beta f(g(t))g'(t)\,dt$$
    【출처: 미적분 「적분법」】

stem: |
  $0<t<1$에 대하여 $(-1,0)$과 $(t,0)$을 지름의 양 끝 점으로 하는 원과, $(t,0)$과 $(1,0)$을 지름의 양 끝 점으로 하는 원이 있다. 이 두 원에 동시에 접하고 기울기가 음수인 접선을 $\ell$이라고 하자.

  이때 다음 문항에 답하시오.

subparts:
- id: '1'
  stem: |
    직선 $\ell$의 방정식을 구하시오.
  points: 15
  depends_on: []
  answer: {kind: expression, value: '-t*x/sqrt(1 - t**2) + (t**2 + 1)/(2*sqrt(1 - t**2))', equivalents: ['$y=-\dfrac{t}{\sqrt{1-t^2}}x+\dfrac{t^2+1}{2\sqrt{1-t^2}}$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 접점까지의 반지름이 만드는 직각삼각형의 닮음비 $\frac{1+t}2:\frac{1-t}2$로 $x$절편 $x_0=\frac{t^2+1}{2t}$, 작은 원 쪽에서 $\sin\theta=t$이므로 기울기 $-\tan\theta=-\frac{t}{\sqrt{1-t^2}}$.
    steps:
    - {id: 1a, content: '$x_0=\frac{t^2+1}{2t}$, 기울기 $-\frac{t}{\sqrt{1-t^2}}$', criteria: [1.B1, 1.M1, 1.A1, 1.M2, 1.A2]}
    hint_ladder:
    - 두 원의 중심과 반지름을 먼저 구하자.
    - 접점과 중심을 이으면 접선에 수직이다. 접선이 $x$축과 만나는 점 A를 꼭짓점으로 하는 두 직각삼각형을 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.24
    steps:
    - id: 1b-1
      content: |
        [그림 설명] 큰 원의 중심 $\mathrm{C}\left(\dfrac{t-1}2,0\right)$, 반지름 $\dfrac{1+t}2$; 작은 원의 중심 $\mathrm{E}\left(\dfrac{t+1}2,0\right)$, 반지름 $\dfrac{1-t}2$. 직선 $\ell$은 큰 원과 점 B, 작은 원과 점 D에서 접하고 $x$축과 점 $\mathrm{A}(x_0,0)$ ($x_0>\frac{t+1}{2}$)에서 만나며, $\angle\mathrm{DAE}=\theta$.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        $\mathrm{CB}\perp\ell$, $\mathrm{ED}\perp\ell$이므로 두 직각삼각형 ABC, ADE는 닮음이고 닮음비는 $\dfrac{1+t}2:\dfrac{1-t}2$. 빗변 $\mathrm{AC}=x_0+\dfrac{1-t}2$, $\mathrm{AE}=x_0-\dfrac{t+1}2$이므로 $\left(x_0+\dfrac{1-t}2\right):\left(x_0-\dfrac{t+1}2\right)=\dfrac{1+t}2:\dfrac{1-t}2$.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        $(t+1)(2x_0-(t+1))=(1-t)(2x_0+(1-t))$를 정리하면 $4tx_0=2t^2+2$, 즉 $x_0=\dfrac{t^2+1}{2t}$.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        $\mathrm{AE}=\dfrac{t^2+1}{2t}-\dfrac{t+1}2=\dfrac{1-t}{2t}$, $\mathrm{DE}=\dfrac{1-t}2$이므로 $\sin\theta=\dfrac{\mathrm{DE}}{\mathrm{AE}}=t$. $\ell$의 기울기는 $-\tan\theta=-\dfrac{t}{\sqrt{1-t^2}}$.
      criteria: [1.M2]
    - id: 1b-5
      content: |
        따라서 $\ell$: $y=-\dfrac{t}{\sqrt{1-t^2}}\left(x-\dfrac{t^2+1}{2t}\right)=-\dfrac{t}{\sqrt{1-t^2}}x+\dfrac{t^2+1}{2\sqrt{1-t^2}}$.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: 두 원의 중심과 반지름을 구했다.
      steps: [1b-1]
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 접점 반지름이 접선에 수직이어서 생기는 두 직각삼각형의 닮음비 식을 세웠다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $x$절편 $x_0=\frac{t^2+1}{2t}$.
      depends_on: [1.M1]
      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $\sin\theta=t$ (또는 동치)에서 기울기 $-\frac{t}{\sqrt{1-t^2}}$를 구했다.
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: 직선 $\ell$의 방정식.
      depends_on: [1.M1, 1.M2]
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 3
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-GEO-0427}
  misconceptions:
  - id: MC-GEO-0427
    outcome_code: '71'
    wrong_work: '두 중심을 $\frac{1+t}2:\frac{1-t}2$로 내분하는 점 $(t,0)$을 접선이 지난다고 봄'
    detect_cue: 직선이 $(t,0)$을 지나거나 $x_0=t$
    feedback: 내분점을 지나는 것은 두 원 사이를 가로지르는 내접 공통접선입니다. 같은 쪽에서 접하는 접선은 외분점을 지납니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    직선 $\ell$의 $y$절편을 $f(t)$라고 할 때, $\displaystyle\int_{\frac12}^{\frac{\sqrt2}{2}}f(t)\,dt$를 구하시오.
  points: 10
  depends_on: ['1']
  answer: {kind: value, value: '(pi - 2 + sqrt(3))/16', equivalents: ['$\dfrac{\pi-2+\sqrt3}{16}$'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $t=\sin\theta$로 치환하면 $\frac12\int_{\pi/6}^{\pi/4}(\sin^2\theta+1)\,d\theta=\frac14\left[3\theta-\frac12\sin2\theta\right]_{\pi/6}^{\pi/4}$.
    steps:
    - {id: 2a, content: '$\frac{\pi-2+\sqrt3}{16}$', criteria: [2.M1, 2.M2, 2.B1, 2.A1]}
    hint_ladder:
    - $\sqrt{1-t^2}$이 보이면 어떤 치환이 좋은가?
    - $\sin^2\theta=\frac{1-\cos2\theta}{2}$.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 pp.24~25
    steps:
    - id: 2b-1
      content: |
        (1)에서 $f(t)=\dfrac{t^2+1}{2\sqrt{1-t^2}}$이므로 $\displaystyle\int_{1/2}^{\sqrt2/2}f(t)\,dt=\int_{1/2}^{\sqrt2/2}\frac{t^2+1}{2\sqrt{1-t^2}}\,dt$.
      criteria: [2.M1]
    - id: 2b-2
      content: |
        $t=\sin\theta$ ($\frac{\pi}{6}\le\theta\le\frac{\pi}{4}$)로 치환하면 $\dfrac{dt}{d\theta}=\cos\theta$, $\sqrt{1-\sin^2\theta}=\cos\theta>0$이므로 제시문에 의해 $\displaystyle\int_{\pi/6}^{\pi/4}\frac{(\sin^2\theta+1)\cos\theta}{2\sqrt{1-\sin^2\theta}}\,d\theta=\frac12\int_{\pi/6}^{\pi/4}(\sin^2\theta+1)\,d\theta$.
      criteria: [2.M2]
    - id: 2b-3
      content: |
        $\sin^2\theta+1=\dfrac{3-\cos2\theta}2$이므로 $=\dfrac14\displaystyle\int_{\pi/6}^{\pi/4}(3-\cos2\theta)\,d\theta=\dfrac14\left[3\theta-\dfrac12\sin2\theta\right]_{\pi/6}^{\pi/4}$.
      criteria: [2.B1]
    - id: 2b-4
      content: |
        $=\dfrac14\left\{\left(\dfrac{3\pi}4-\dfrac12\right)-\left(\dfrac{\pi}2-\dfrac{\sqrt3}4\right)\right\}=\dfrac{\pi-2+\sqrt3}{16}$.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: $y$절편 $f(t)=\frac{t^2+1}{2\sqrt{1-t^2}}$로 적분식을 세웠다.
      ft: {allowed: true, from: [1.A2], max_points: 2}
      steps: [2b-1]
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: $t=\sin\theta$로 치환하고 적분 구간을 $[\frac{\pi}{6},\frac{\pi}{4}]$로 바꾸었다.
      steps: [2b-2]
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: 반각 공식으로 $\frac14\int(3-\cos2\theta)\,d\theta$의 원시함수를 구했다.
      steps: [2b-3]
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: $\frac{\pi-2+\sqrt3}{16}$.
      depends_on: [2.M2]
      cao: true
      steps: [2b-4]
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 3
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0428}
  misconceptions:
  - id: MC-CAL-0428
    outcome_code: '71'
    wrong_work: '$t=\sin\theta$로 치환한 뒤 적분 구간을 $\frac12$부터 $\frac{\sqrt2}2$까지로 그대로 둠'
    detect_cue: $\theta$에 대한 적분의 위끝·아래끝이 $\frac12$, $\frac{\sqrt2}2$
    feedback: 치환하면 적분 구간도 새 변수의 값으로 바꿔야 합니다. $\sin\theta=\frac12$이면 $\theta=\frac{\pi}{6}$입니다.
    remedy: [RL-2]

