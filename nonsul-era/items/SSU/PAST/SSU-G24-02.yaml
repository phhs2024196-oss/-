stimuli:
- label: 제시문
  body: |
    미분가능한 함수 $f(x)$의 역함수 $f^{-1}(x)$가 존재하고 미분가능할 때, 역함수 $y=f^{-1}(x)$의 도함수는

    $$\frac{dy}{dx}=\frac{1}{\frac{dx}{dy}}\quad\text{또는}\quad(f^{-1})'(x)=\frac{1}{f'(f^{-1}(x))}$$
    【출처: 미적분 「여러 가지 미분법」】

stem: |
  정의역이 $\{x\mid x\ge0\}$인 두 함수 $f(x)$와 $g(x)$가 아래와 같이 주어져 있다.

  $$f(x)=1-\lvert x-2n-1\rvert\quad(2n\le x<2n+2,\ n=0,1,2,3,\cdots)$$

  $$g(x)=x^2+kx+1\quad(\text{단, }k>1)$$

  함수 $h(x)$가 함수 $g(x)$의 역함수이고 $u(x)=h(x)-f(x)$ (단, $x\ge1$)일 때, 다음 문항에 답하시오.

subparts:
- id: '1'
  stem: |
    양의 정수 $n$에 대하여 $2n\le x\le2n+2$일 때 함수 $u(x)$의 증가와 감소를 조사하시오.
  points: 16
  depends_on: []
  answer: {kind: proof, value: '[2n, 2n+1]에서 감소, [2n+1, 2n+2]에서 증가', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $0<h'(x)<1$이고 $f'=\pm1$이므로 $u'=h'-1<0$ ($2n<x<2n+1$), $u'=h'+1>0$ ($2n+1<x<2n+2$).
    steps:
    - {id: 1a, content: '$u$는 $[2n,2n+1]$에서 감소, $[2n+1,2n+2]$에서 증가, 극솟값 $h(2n+1)-1$', criteria: [1.M1, 1.A1, 1.B1, 1.R1]}
    hint_ladder:
    - $h'(x)$의 범위를 역함수의 미분법으로 구해 보자.
    - $f(x)$를 $[2n,2n+1]$과 $[2n+1,2n+2]$로 나누어 쓰자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.26
    steps:
    - id: 1b-1
      content: |
        $x>0$일 때 $g'(x)=2x+k>1$. $g'$이 항상 양수이므로 $x>1$에서 역함수 $h(x)$의 미분계수가 존재하고, 제시문에 의해 $h'(x)=\dfrac1{g'(h(x))}$. $g'(h(x))>1$이므로 $0<h'(x)<1$.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        $2n\le x\le2n+2$에서 $f(x)=x-2n$ ($2n\le x<2n+1$), $f(x)=-x+2n+2$ ($2n+1\le x\le2n+2$) ($x=2n+2$에서는 다음 구간의 식으로도 $f(2n+2)=0$). 따라서 $2n<x<2n+1$에서 $u'(x)=h'(x)-1$, $2n+1<x<2n+2$에서 $u'(x)=h'(x)+1$.
      criteria: [1.B1]
    - id: 1b-3
      content: |
        $h'(x)-1<0$, $h'(x)+1>0$이므로 $u(x)$는 $[2n,2n+1]$에서 감소하고 $[2n+1,2n+2]$에서 증가한다. 증감표: $x=2n$에서 $u=h(2n)$, ↘, $x=2n+1$에서 $u=h(2n+1)-1$, ↗, $x=2n+2$에서 $u=h(2n+2)$ ($u'$은 $x=2n,2n+1,2n+2$에서 존재하지 않음).
      criteria: [1.R1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 역함수의 미분법으로 $h'(x)=\frac1{g'(h(x))}$를 썼다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $g'>1$에서 $0<h'(x)<1$을 얻었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $f(x)$를 두 구간으로 나누어 쓰고 $u'(x)=h'(x)\mp1$을 구했다.
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: $[2n,2n+1]$에서 감소, $[2n+1,2n+2]$에서 증가함을 근거와 함께(증감표) 밝혔다.
      steps: [1b-3]
    deductions:
    - code: D1-1
      condition: 결론만 쓰고 근거 없음
      effect: cap
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0429}
  misconceptions:
  - id: MC-CAL-0429
    outcome_code: '71'
    wrong_work: '$h''(x)=\frac{1}{g''(x)}=\frac1{2x+k}$로 계산'
    detect_cue: $h'$ 식에 $h(x)$가 아니라 $x$가 들어감
    feedback: 역함수의 도함수는 $\frac{1}{g'(h(x))}$입니다. $g'$에 넣는 값은 $x$가 아니라 $h(x)$입니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    함수 $u(x)$의 그래프와 $x$축이 1001개의 서로 다른 점에서 만나도록 하는 실수 $k$의 값의 범위를 구하시오.
  points: 9
  depends_on: ['1']
  answer: {kind: set, value: 'Interval.open(999, 1001)', equivalents: ['$999<k<1001$'], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $[1,2]$에서 1개, $[2n,2n+2]$에서 $h(2n+1)-1$의 부호에 따라 0·1·2개. $h$ 증가이므로 $h(3),\dots,h(1001)<1<h(1003)$, 즉 $1001<k+2<1003$.
    steps:
    - {id: 2a, content: '$999<k<1001$', criteria: [2.B1, 2.M1, 2.R1, 2.M2, 2.A1]}
    hint_ladder:
    - $1\le x\le2$에서 $u$의 증감과 $u(1)$, $u(2)$의 부호는?
    - 한 구간 $[2n,2n+2]$에서 교점 개수는 극솟값 $h(2n+1)-1$의 부호로 정해진다.
    - $h(a)<1$을 $g$에 대한 부등식으로 바꾸자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 pp.26~27
    steps:
    - id: 2b-1
      content: |
        $1<x<2$에서 $f(x)=2-x$이므로 $u'(x)=h'(x)+1>0$, 즉 $[1,2]$에서 $u$는 증가. $u(1)=h(1)-f(1)=0-1=-1<0$, $u(2)=h(2)-0>0$이므로 $[1,2]$에서 $u$의 그래프는 $x$축과 한 점에서 만난다.
      criteria: [2.B1]
    - id: 2b-2
      content: |
        양의 정수 $n$에 대하여 (1)에 의해 $u$는 $[2n,2n+1]$에서 감소, $[2n+1,2n+2]$에서 증가하고 $u(2n)=h(2n)>0$, $u(2n+2)=h(2n+2)>0$. 따라서 $[2n,2n+2]$에서 교점의 개수는 (a) $h(2n+1)-1>0$이면 0개, (b) $=0$이면 1개, (c) $<0$이면 2개.
      criteria: [2.M1]
    - id: 2b-3
      content: |
        $h$는 증가함수이므로 $h(2n+1)<h(2n+3)$. 따라서 어떤 구간에서 (a) 또는 (b)가 일어나면 그다음 구간부터는 반드시 (a)이다. (구간의 끝점 $2n$에서는 $u>0$이므로 교점이 겹쳐 세어지지 않는다.)
      criteria: [2.R1]
    - id: 2b-4
      content: |
        그러므로 교점이 1001개이려면 $[1,2]$에서 1개, 경우 (c)가 정확히 500번($n=1,\dots,500$) 일어나야 하고 (b)는 일어나지 않아야 한다($1+2m+1=1001$을 만족하는 정수 $m$은 없음). 즉 $h(3)<1,\ \dots,\ h(1001)<1$, $h(1003)>1$이고, $h$가 증가함수이므로 $h(1001)<1$, $h(1003)>1$이면 충분하다.
      criteria: [2.M2]
    - id: 2b-5
      content: |
        $g$가 증가함수이므로 $h(1001)<1\iff1001<g(1)$, $h(1003)>1\iff1003>g(1)$. $g(1)=k+2$이므로 $1001<k+2<1003$, 즉 $999<k<1001$ ($k>1$ 만족).
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: $[1,2]$에서 $u$가 증가하고 $u(1)=-1$, $u(2)>0$이므로 교점이 1개임을 밝혔다.
      steps: [2b-1]
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: $[2n,2n+2]$에서 극솟값 $h(2n+1)-1$의 부호에 따라 교점이 0·1·2개임을 분류했다.
      ft: {allowed: true, from: [1.R1], max_points: 2}
      steps: [2b-2]
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: $h$가 증가하므로 교점 2개인 구간이 $n=1$부터 연속으로 나타나고 이후 0개임을 설명했다.
      steps: [2b-3]
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: 개수 조건을 $h(1001)<1$, $h(1003)>1$로 바꾸었다.
      steps: [2b-4]
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: $1001<k+2<1003$에서 $999<k<1001$.
      depends_on: [2.M2]
      cao: true
      steps: [2b-5]
    deductions:
    - code: D2-1
      condition: 등호 조건(양 끝값 포함 여부) 오류
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0430}
  misconceptions:
  - id: MC-CAL-0430
    outcome_code: '71'
    wrong_work: '$[1,2]$의 교점을 세지 않아 $1001=2\cdot500+1$로 보고 $h(1003)=1$, 즉 $k=1001$'
    detect_cue: 답이 $k=1001$ 한 값이거나 경우 (b)를 사용
    feedback: $u$는 $x\ge1$에서 정의되고 첫 구간 $[1,2]$에서도 $x$축과 한 번 만납니다. 첫 구간을 따로 확인하세요.
    remedy: [RL-1]

