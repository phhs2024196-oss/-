intent: 역함수의 미분법으로 $0<h'(x)<1$을 얻어 톱니 모양 함수와의 차의 증감을 판정하고, 증가하는 극솟값의 부호 변화로 교점 개수를 세어 매개변수 범위를 구하는 능력을 본다.
key_idea: '$h''(x)=\frac{1}{g''(h(x))}=\frac1{2h(x)+k}\in(0,1)$이므로 $u$는 $[2n,2n+1]$에서 감소, $[2n+1,2n+2]$에서 증가. 극솟값 $h(2n+1)-1$이 증가하므로 교점은 $[1,2]$에서 1개, 이후 $h(2n+1)<1$인 구간마다 2개. $1001=1+2\cdot500$에서 $h(1001)<1<h(1003)$, 즉 $1001<g(1)<1003$.'
stuck: 극솟값 $h(2n+1)-1$이 $n$에 대해 증가하므로 교점 2개인 구간이 앞쪽에 연속으로 모이고, 개수 조건을 $h(1001)<1<h(1003)$으로 바꾸는 단계
