  - id: MC-CAL-0431
    outcome_code: '71'
    wrong_work: '$x\le0$이므로 $f(g(x))=1-\left(-x+\frac12\right)^2$로 두어 $a$를 정하지 못하거나 $a=1$이라 씀'
    detect_cue: $f(g(x))$의 $x\le0$ 식에 $a$가 없음
    feedback: 합성함수 $f(g(x))$에서 $f$의 식은 $f$에 넣는 값 $g(x)$의 부호로 고릅니다. $x\le0$이면 $g(x)>0$입니다.
    remedy: [RL-1]
  - id: MC-CAL-0432
    outcome_code: '72'
    wrong_work: '직사각형을 $y$축 대칭으로 보고 $S=2m\left(1-\frac{m^2}4\right)$ 등으로 계산'
    detect_cue: 왼쪽 꼭짓점을 $-m$으로 둠
    feedback: $x<0$ 쪽은 $y=1-x^2$, $x>0$ 쪽은 $y=1-\frac14x^2$로 곡선이 다릅니다. 높이가 같은 점을 각각 찾으세요.
    remedy: [RL-2]

