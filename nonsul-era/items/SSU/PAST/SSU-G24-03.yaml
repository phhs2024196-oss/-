stimuli:
- label: 제시문
  body: |
    함수 $f(x)$가 실수 $a$에 대하여 다음 세 조건을 모두 만족시킬 때, $f(x)$는 $x=a$에서 연속이라고 한다.

    (i) 함수 $f(x)$가 $x=a$에서 정의되어 있다.

    (ii) 극한값 $\displaystyle\lim_{x\to a}f(x)$가 존재한다.

    (iii) $\displaystyle\lim_{x\to a}f(x)=f(a)$
    【출처: 수학Ⅱ 「함수의 연속」】

stem: |
  함수 $f(x)$와 $g(x)$가 아래와 같이 주어져 있다.

  $$f(x)=\begin{cases}1-x^2&(x\le0)\\1-ax^2&(x>0)\end{cases}\ (\text{단, }a\text{는 상수}),\qquad g(x)=\begin{cases}-x+\dfrac12&(x\le0)\\[2mm]-x-\dfrac14&(x>0)\end{cases}$$

  합성함수 $f(g(x))$는 연속이라고 하자.

  이때 한 변이 $x$축 위에 있고, 함수 $f(x)$의 그래프와 $x$축으로 둘러싸인 도형에 내접하는 직사각형의 넓이의 최댓값을 구하시오.

subparts:
- id: '1'
  stem: |
    직사각형의 넓이의 최댓값을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '2*sqrt(3)/3', equivalents: ['$\dfrac{2}{\sqrt3}$', '$\dfrac{2\sqrt3}{3}$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a=\frac14$. 오른쪽 위 꼭짓점 $(m,1-\frac{m^2}4)$, 왼쪽 위 꼭짓점 $(-\frac m2,\cdot)$이므로 $S(m)=\frac{3m}2\left(1-\frac{m^2}4\right)$, $S'=0$에서 $m=\frac2{\sqrt3}$, 최댓값 $\frac2{\sqrt3}$.
    steps:
    - {id: 1a, content: '$a=\frac14$, $S(m)=\frac32m-\frac38m^3$, $S\left(\frac2{\sqrt3}\right)=\frac2{\sqrt3}$', criteria: [1.M1, 1.A1, 1.M2, 1.B1, 1.R1, 1.A2]}
    hint_ladder:
    - $x\le0$일 때 $g(x)$의 부호는? 그러면 $f$의 어느 식에 넣어야 하는가?
    - 직사각형의 위쪽 두 꼭짓점은 같은 높이에 있다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.28
    steps:
    - id: 1b-1
      content: |
        $x\le0$이면 $g(x)=-x+\dfrac12>0$, $x>0$이면 $g(x)=-x-\dfrac14<0$이므로 $f(g(x))=1-a\left(-x+\dfrac12\right)^2$ ($x\le0$), $f(g(x))=1-\left(-x-\dfrac14\right)^2$ ($x>0$).
      criteria: [1.M1]
    - id: 1b-2
      content: |
        각 식은 다항식이므로 $x\ne0$에서 연속이고, $x=0$에서 연속이려면 $\displaystyle\lim_{x\to0^-}f(g(x))=f(g(0))=\lim_{x\to0^+}f(g(x))$, 즉 $1-\dfrac{a}{2^2}=1-\dfrac1{4^2}$. 따라서 $a=\dfrac14$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $f(x)=1-x^2$ ($x\le0$), $f(x)=1-\dfrac14x^2$ ($x>0$)의 그래프와 $x$축으로 둘러싸인 도형은 $-1\le x\le2$ 부분이다. 직사각형의 오른쪽 변의 $x$좌표를 $m$ ($0<m<2$)이라 하면 오른쪽 위 꼭짓점은 $\mathrm{A}\left(m,1-\dfrac14m^2\right)$. 왼쪽 위 꼭짓점 $\mathrm{B}\left(n,1-\dfrac14m^2\right)$ ($n<0$)은 곡선 $y=1-x^2$ 위에 있으므로 $1-n^2=1-\dfrac14m^2$, $n=-\dfrac m2$.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        넓이 $S(m)=\left(1-\dfrac{m^2}4\right)\left(m+\dfrac m2\right)=\dfrac32m-\dfrac38m^3$ ($0<m<2$), $S'(m)=\dfrac32-\dfrac98m^2$.
      criteria: [1.B1]
    - id: 1b-5
      content: |
        $S'(m)=0$에서 $m=\dfrac2{\sqrt3}$. $0<m<\dfrac2{\sqrt3}$에서 $S'>0$, $\dfrac2{\sqrt3}<m<2$에서 $S'<0$이므로 $S$는 $m=\dfrac2{\sqrt3}$에서 극대이자 최대.
      criteria: [1.R1]
    - id: 1b-6
      content: |
        최댓값 $S\left(\dfrac2{\sqrt3}\right)=\dfrac32\cdot\dfrac2{\sqrt3}\cdot\left(1-\dfrac13\right)=\dfrac2{\sqrt3}=\dfrac{2\sqrt3}3$.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: $g(x)$의 부호에 따라 $f(g(x))$를 구간별 식으로 나타냈다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $x=0$에서 좌우극한·함숫값 비교로 $a=\frac14$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 위쪽 두 꼭짓점의 높이가 같다는 조건에서 왼쪽 꼭짓점의 $x$좌표 $-\frac m2$를 구했다.
      steps: [1b-3]
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: 넓이 $S(m)=\frac32m-\frac38m^3$ ($0<m<2$)과 $S'(m)$을 구했다.
      steps: [1b-4]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: $S'$의 부호 변화(증감표)로 $m=\frac2{\sqrt3}$에서 최대임을 밝혔다.
      steps: [1b-5]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 최댓값 $\frac2{\sqrt3}$.
      depends_on: [1.M2, 1.R1]
      cao: true
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
