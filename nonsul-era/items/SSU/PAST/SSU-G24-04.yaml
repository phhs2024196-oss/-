stimuli:
- label: 제시문
  body: |
    서로 다른 $n$개에서 $r$ ($0\le r\le n$)개를 택하는 순열의 수는

    $${}_n\mathrm{P}_r=n(n-1)(n-2)\cdots(n-r+1)=\frac{n!}{(n-r)!}$$

    서로 다른 $n$개에서 $r$ ($0\le r\le n$)개를 택하는 조합의 수는

    $${}_n\mathrm{C}_r=\frac{{}_n\mathrm{P}_r}{r!}=\frac{n!}{r!(n-r)!}$$
    【출처: 수학 「경우의 수」】

stem: |
  다음 조건을 만족시키는 함수 $f$의 개수를 세려고 한다.

  $$f:\{1,2,3,4,5,6\}\to\{1,2,3,4,5,6\},\quad f\circ f\text{는 항등함수}$$

  이를 위하여 학생 A는 다음과 같은 방법을 제시하였다.

  (가) $f(a)=b$이면 $f(b)=a$여야 한다.

  (나) 그러므로 $\{1,2,3,4,5,6\}$의 모든 원소를 두 개씩 세 쌍으로 나누는 경우의 수를 구하면 된다.

  (다) 따라서 조건을 만족시키는 함수 $f$의 개수는 ${}_6\mathrm{C}_2\times{}_4\mathrm{C}_2\times{}_2\mathrm{C}_2=15\times6\times1=90$개이다.

  이때 다음 문항에 답하시오.

subparts:
- id: '1'
  stem: |
    학생 A의 방법에서 잘못된 점을 모두 찾아서 설명하시오.
  points: 10
  depends_on: []
  answer: {kind: proof, value: '(나) f(i)=i 인 원소의 가능성 누락, (다) 쌍을 택하는 순서를 구별해 3!로 나누지 않음', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: (나)는 고정점 $f(i)=i$를 빠뜨렸고, (다)는 세 쌍을 고르는 순서를 구별했다(쌍의 집합은 순서와 무관하므로 $3!$로 나누어야 함).
    steps:
    - {id: 1a, content: '오류 1: 고정점 누락, 오류 2: 쌍의 순서 중복', criteria: [1.R1, 1.R2]}
    hint_ladder:
    - $f(1)=1$인 함수도 조건을 만족하는가?
    - '{1,2},{3,4},{5,6}과 {3,4},{1,2},{5,6}은 다른 함수인가?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.29
    steps:
    - id: 1b-1
      content: |
        첫 번째 잘못: (나)에서 $f(i)=i$인 $i$가 있을 가능성을 고려하지 않고 원소를 두 개씩 세 쌍으로 나누는 경우만 고려했다. $f(i)=j$일 때 $i\ne j$이면 두 원소가 쌍을 이루어야 하지만, $i=j$인 경우에는 다른 원소와 쌍을 이루지 않는다(예: 항등함수 자체도 조건을 만족).
      criteria: [1.R1]
    - id: 1b-2
      content: |
        두 번째 잘못: 두 개씩 세 쌍으로 나누는 경우의 수는 쌍을 택하는 순서와 무관해야 하는데, (다)에서 ${}_6\mathrm{C}_2\times{}_4\mathrm{C}_2\times{}_2\mathrm{C}_2$로 쌍의 순서를 고려해 계산했다. 같은 세 쌍이 $3!$번씩 중복되어 세어지므로 $3!$로 나누어야 한다.
      criteria: [1.R2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: (나)에서 $f(i)=i$인 원소(고정점)의 가능성을 빠뜨렸음을 설명했다.
      steps: [1b-1]
    - id: 1.R2
      mark_type: R
      points: 5
      evidence: (다)에서 쌍을 택하는 순서를 구별해 $3!$배 중복 계산했음을 설명했다.
      steps: [1b-2]
    deductions:
    - code: D1-1
      condition: 잘못된 점을 지적만 하고 이유(반례·중복 원인) 없음
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-0433}
  misconceptions:
  - id: MC-CNT-0433
    outcome_code: '71'
    wrong_work: '(다)의 계산은 옳다고 보고 고정점 누락만 지적'
    detect_cue: 「$3!$로 나눔」 또는 「순서 중복」 언급이 없음
    feedback: 쌍 {1,2},{3,4},{5,6}을 고르는 순서만 바꾼 경우는 같은 함수입니다. 같은 크기의 묶음은 묶음 수의 계승으로 나눕니다.
    remedy: [RL-1]
- id: '2'
  stem: |
    위의 조건을 만족시키는 함수 $f$의 개수를 구하시오.
  points: 15
  depends_on: ['1']
  answer: {kind: value, value: '76', equivalents: [], tolerance: null}
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(i)\ne i$인 원소 수(짝수) 0, 2, 4, 6에 따라 $1+15+45+15=76$.
    steps:
    - {id: 2a, content: '$1+15+45+15=76$', criteria: [2.R1, 2.B1, 2.B2, 2.B3, 2.A1]}
    hint_ladder:
    - $f(i)\ne i$인 원소는 쌍을 이루므로 그 개수는 짝수이다.
    - 쌍이 2개, 3개일 때 각각 $2!$, $3!$로 나누자.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.29
    steps:
    - id: 2b-1
      content: |
        $f(i)=j$이고 $i\ne j$인 원소 $i$는 쌍을 이루므로 그 개수는 짝수이고, 따라서 $f(i)=i$인 원소의 개수도 짝수이다.
      criteria: [2.R1]
    - id: 2b-2
      content: |
        (a) $f(i)\ne i$인 원소가 0개($f(i)=i$인 원소 6개): 항등함수 1개. (b) 2개($f(i)=i$인 원소 4개): 쌍 하나를 만드는 경우의 수 ${}_6\mathrm{C}_2=15$개.
      criteria: [2.B1]
    - id: 2b-3
      content: |
        (c) 4개($f(i)=i$인 원소 2개): 두 원소의 쌍을 하나 만들고 나머지 4개 중 두 번째 쌍을 만든 뒤, 두 쌍을 순서대로 나열하는 경우의 수로 나누어 $\dfrac{{}_6\mathrm{C}_2\times{}_4\mathrm{C}_2}{2!}=\dfrac{15\times6}{2}=45$개.
      criteria: [2.B2]
    - id: 2b-4
      content: |
        (d) 6개($f(i)=i$인 원소 없음): 6개의 원소를 두 개씩 세 쌍으로 나누는 경우의 수 $\dfrac{{}_6\mathrm{C}_2\times{}_4\mathrm{C}_2\times{}_2\mathrm{C}_2}{3!}=\dfrac{15\times6\times1}{6}=15$개.
      criteria: [2.B3]
    - id: 2b-5
      content: |
        종합하면 $1+15+45+15=76$개.
      criteria: [2.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 2.R1
