      steps: [2b-2]
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: 쌍이 2개일 때 $\frac{15\times6}{2!}=45$개.
      steps: [2b-3]
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: 쌍이 3개일 때 $\frac{15\times6\times1}{3!}=15$개.
      steps: [2b-4]
