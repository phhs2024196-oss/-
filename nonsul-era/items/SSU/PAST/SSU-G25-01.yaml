  - {code: '72', misconception: MC-CNT-0411}
  misconceptions:
  - id: MC-CNT-0410
    outcome_code: '71'
    wrong_work: '$h$의 개수를 ${}_{10}\mathrm{C}_2=45$로만 세어 $5\times45=225$'
    detect_cue: $h$의 개수가 45, 중근 $(x-r)^2$ 경우가 없음
    feedback: 「모든 해가 정수」는 중근인 경우도 만족합니다. $(x-r)^2$ 꼴 10개를 더하세요.
    remedy: [RL-1]
  - id: MC-CNT-0411
    outcome_code: '72'
    wrong_work: '$b$가 정수여야 한다고 보고 $b=0,1$만 고려해 $g$를 4개로 세어 $4\times55=220$'
    detect_cue: $x^2-x+2$가 빠짐, $b=\dfrac12$ 검토 없음
    feedback: 계수가 정수라는 조건은 $x$의 계수 $-2b$가 정수라는 뜻입니다. $b$는 $\dfrac12$일 수도 있습니다.
    remedy: [RL-1]

