key_idea: '(1) $x=-1$에서 좌우극한 일치로 $g(-1)=0$, $g(-1)=g(2)$. (2) $f$가 $u=-1$에서만 불연속이고 그 왼쪽 값이 더 작으므로 $f(g(x)+3)$이 연속 $\iff$ $g(x)\ge-4$ (모든 $x$).'
