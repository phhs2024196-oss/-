stimuli:
- label: 제시문
  body: |
    이차방정식 $ax^2+bx+c=0$의 두 근을 $\alpha$, $\beta$라고 하면
    $$\alpha+\beta=-\frac ba,\quad \alpha\beta=\frac ca$$
    【출처: 수학 「이차방정식의 근과 계수의 관계」】

stem: |
  직선 $l:y=mx+m\ (0<m<1)$과 원 $C:x^2+y^2=1$의 교점 중 $x$좌표가 더 큰 점을 $P$, 직선 $l$과 $y$축의 교점을 $Q$, 좌표가 $(0,1)$인 점을 $R$이라고 하자.
  점 $P$와 직선 $y=1$ 사이의 거리를 $f(m)$, 삼각형 $PQR$의 넓이를 $g(m)$이라고 할 때, $\displaystyle\lim_{m\to1-}\frac{f(m)}{g(m)}$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{m\to1-}\frac{f(m)}{g(m)}$의 값을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '1', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 한 근이 $-1$이므로 곱 $\dfrac{m^2-1}{m^2+1}$에서 $P\left(\dfrac{1-m^2}{1+m^2},\dfrac{2m}{1+m^2}\right)$. $f=\dfrac{(1-m)^2}{1+m^2}$, $g=\dfrac{(1-m)^2(1+m)}{2(1+m^2)}$, 비 $=\dfrac2{1+m}\to1$.
    steps:
    - {id: 1a, content: '$\dfrac{f(m)}{g(m)}=\dfrac{2}{1+m}\to1$', criteria: [1.M1, 1.A1, 1.B1, 1.M2, 1.A2, 1.A3]}
    hint_ladder:
    - 직선 $y=m(x+1)$이 $m$에 관계없이 지나는 점은?
    - 그 점이 원 위에 있으면 이차방정식의 한 근을 이미 아는 셈이다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.6
    steps:
    - id: 1b-1
      content: |
        $x^2+(mx+m)^2=1$에서 $(1+m^2)x^2+2m^2x+m^2-1=0$. 직선은 점 $(-1,0)$을 지나고 이 점은 원 위에 있으므로 $x=-1$이 한 근이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        다른 근을 $\beta$라 하면 근과 계수의 관계에서 $-1\cdot\beta=\dfrac{m^2-1}{m^2+1}$, $\beta=\dfrac{1-m^2}{1+m^2}>-1$. 따라서 $P\left(\dfrac{1-m^2}{1+m^2},\ \dfrac{2m}{1+m^2}\right)$ ($y$좌표는 $m\beta+m$).
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $0<m<1$이면 $\dfrac{2m}{1+m^2}<1$이므로 $f(m)=1-\dfrac{2m}{1+m^2}=\dfrac{(1-m)^2}{1+m^2}$.
      criteria: [1.B1]
    - id: 1b-4
      content: |
        $Q(0,m)$, $R(0,1)$이므로 밑변 $\overline{QR}=1-m$, 높이는 $P$의 $x$좌표 $\dfrac{1-m^2}{1+m^2}$. 따라서 $g(m)=\dfrac12(1-m)\cdot\dfrac{1-m^2}{1+m^2}=\dfrac{(1-m)^2(1+m)}{2(1+m^2)}$.
      criteria: [1.M2, 1.A2]
    - id: 1b-5
      content: |
        $\dfrac{f(m)}{g(m)}=\dfrac{2}{1+m}$ ($0<m<1$에서 $(1-m)^2\ne0$으로 약분)이므로 $\displaystyle\lim_{m\to1-}\frac{f(m)}{g(m)}=\frac22=1$.
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 교점의 $x$좌표에 대한 이차방정식을 세우고 $x=-1$이 한 근임을 밝혔다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 근과 계수의 관계(또는 인수분해)로 $P\left(\dfrac{1-m^2}{1+m^2},\dfrac{2m}{1+m^2}\right)$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.B1
      mark_type: B
      points: 4
      evidence: $f(m)=\dfrac{(1-m)^2}{1+m^2}$ (또는 $1-\dfrac{2m}{1+m^2}$)을 구했다.
      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: 삼각형 $PQR$의 밑변을 $\overline{QR}=1-m$, 높이를 $P$의 $x$좌표로 잡았다.
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: $g(m)=\dfrac{(1-m)^2(1+m)}{2(1+m^2)}$ (또는 동치식)을 구했다.
      depends_on: [1.M2]
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 5
      evidence: $(1-m)^2$을 약분해 $\dfrac{2}{1+m}$으로 정리하고 극한값 $1$을 얻었다.
      depends_on: [1.M1, 1.M2, 1.A1, 1.A2]
      cao: true
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
