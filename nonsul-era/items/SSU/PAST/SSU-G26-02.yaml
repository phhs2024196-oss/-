stimuli:
- label: 제시문
  body: |
    두 점 $A(x_1,y_1)$, $B(x_2,y_2)$를 이은 선분 $AB$를 $m:n\ (m>0,\ n>0)$으로 내분하는 점 $P$의 좌표는
    $$\left(\frac{mx_2+nx_1}{m+n},\ \frac{my_2+ny_1}{m+n}\right)$$
    【출처: 수학 「선분의 내분점과 외분점」】

stem: |
  수열 $\{x_k\}$는 첫째항이 0, 공차가 $\dfrac1n$인 등차수열이다 (단, $n$은 자연수). 점 $P_k(x_k,0)$과 함수 $f(x)=\lvert2x-1\rvert e^{2x}$의 그래프 위의 점 $G_{k+1}(x_{k+1},f(x_{k+1}))$에 대하여 점 $H_k$는 선분 $P_kG_{k+1}$을 $2:1$로 내분하는 점이라고 하자.
  삼각형 $P_kH_kP_{k+1}$의 넓이를 $A_k$라고 할 때, $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}A_k$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}A_k$의 값을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '(exp(1)-1)/3', equivalents: ['$\dfrac{e-1}{3}$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $A_k=\dfrac1{3n}f\left(\dfrac kn\right)$, 합의 극한은 $\dfrac13\displaystyle\int_0^1\lvert2x-1\rvert e^{2x}dx$. $\int(2x-1)e^{2x}dx=(x-1)e^{2x}$이므로 $\dfrac13(e-1)$.
    steps:
    - {id: 1a, content: '$\dfrac13\left\{[(1-x)e^{2x}]_0^{1/2}+[(x-1)e^{2x}]_{1/2}^1\right\}=\dfrac{e-1}{3}$', criteria: [1.M1, 1.A1, 1.M2, 1.M3, 1.A2, 1.A3]}
    hint_ladder:
    - 삼각형의 밑변 $P_kP_{k+1}$의 길이와 높이는 각각 무엇인가?
    - $\sum\dfrac1nf\left(\dfrac kn\right)$은 어떤 정적분으로 수렴하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.7
    steps:
    - id: 1b-1
      content: |
        $x_k=\dfrac{k-1}{n}$이므로 $P_k\left(\dfrac{k-1}{n},0\right)$, $G_{k+1}\left(\dfrac kn,f\left(\dfrac kn\right)\right)$. 제시문에 의해 $H_k\left(\dfrac{3k-1}{3n},\ \dfrac23f\left(\dfrac kn\right)\right)$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        밑변 $\overline{P_kP_{k+1}}=\dfrac1n$, 높이는 $H_k$의 $y$좌표이므로 $A_k=\dfrac12\cdot\dfrac1n\cdot\dfrac23f\left(\dfrac kn\right)=\dfrac1{3n}f\left(\dfrac kn\right)$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $f$는 $[0,1]$에서 연속이므로 정적분과 급수의 관계에 의해
        $$\lim_{n\to\infty}\sum_{k=1}^{n}A_k=\lim_{n\to\infty}\sum_{k=1}^{n}\frac13f\left(\frac kn\right)\frac1n=\frac13\int_0^1\lvert2x-1\rvert e^{2x}\,dx.$$
      criteria: [1.M2]
    - id: 1b-4
      content: |
        부분적분법으로 $\displaystyle\int(2x-1)e^{2x}\,dx=\frac12(2x-1)e^{2x}-\int e^{2x}\,dx=(x-1)e^{2x}+C$. $x=\dfrac12$에서 부호가 바뀌므로
        $$\int_0^1\lvert2x-1\rvert e^{2x}\,dx=\Big[(1-x)e^{2x}\Big]_0^{\frac12}+\Big[(x-1)e^{2x}\Big]_{\frac12}^{1}.$$
      criteria: [1.M3, 1.A2]
    - id: 1b-5
      content: |
        $=\left(\dfrac e2-1\right)+\left(0+\dfrac e2\right)=e-1$이므로 구하는 값은 $\dfrac{e-1}{3}$.
      criteria: [1.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 내분점 공식으로 $H_k$의 $y$좌표 $\dfrac23f\left(\dfrac kn\right)$을 구했다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $A_k=\dfrac1{3n}f\left(\dfrac kn\right)$을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 정적분과 급수의 관계로 극한을 $\dfrac13\displaystyle\int_0^1\lvert2x-1\rvert e^{2x}dx$로 바꾸었다.
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: $x=\dfrac12$에서 적분 구간을 나누어 절댓값을 없앴다.
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 부분적분으로 원시함수 $(x-1)e^{2x}$ (또는 $(1-x)e^{2x}$)를 구했다.
      depends_on: [1.M3]
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: 최종값 $\dfrac{e-1}{3}$.
      depends_on: [1.M2, 1.A2]
      cao: true
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
