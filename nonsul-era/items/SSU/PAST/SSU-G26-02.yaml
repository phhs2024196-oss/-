    remedy: [RL-1]
  - id: MC-CAL-0315
    outcome_code: '72'
    wrong_work: '삼각형의 높이를 $G_{k+1}$의 $y$좌표 $f\left(\dfrac kn\right)$로 잡아 $\dfrac{e-1}{2}$'
    detect_cue: $A_k=\dfrac1{2n}f\left(\dfrac kn\right)$, 내분점 계산 없음
    feedback: 삼각형의 꼭짓점은 $G_{k+1}$이 아니라 $H_k$입니다. 높이는 $H_k$의 $y$좌표 $\dfrac23f\left(\dfrac kn\right)$입니다.
    remedy: [RL-2]

