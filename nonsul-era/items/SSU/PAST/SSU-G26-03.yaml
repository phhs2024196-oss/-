stimuli:
- label: 제시문
  body: |
    수열 $\{a_n\}$의 첫째항부터 제$N$항까지의 합 $a_1+a_2+a_3+\cdots+a_N$을 합의 기호 $\sum$를 사용하여 다음과 같이 간단히 나타낼 수 있다.
    $$a_1+a_2+a_3+\cdots+a_N=\sum_{n=1}^{N}a_n$$
    【출처: 수학Ⅰ 「수열의 합」】

stem: |
  수열 $\{a_n\}$이 $a_{2n-1}=0$, $a_{2n}-a_n=n\ (n=1,2,3,\cdots)$을 만족시킨다. 이때 $\displaystyle\sum_{n=1}^{128}a_n$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    $\displaystyle\sum_{n=1}^{128}a_n$의 값을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '2794', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $S_k=\sum_{n=1}^{k}a_n$이라 하면 $S_{2m}=S_m+\dfrac{m(m+1)}2$, $S_1=0$에서 $S_{128}=1+3+10+36+136+528+2080$.
    steps:
    - {id: 1a, content: '$S_{128}=0+1+3+10+36+136+528+2080=2794$', criteria: [1.M1, 1.A1, 1.M2, 1.A2]}
    hint_ladder:
    - 1부터 128까지의 합을 홀수 번째 항의 합과 짝수 번째 항의 합으로 나누어 보자.
    - 짝수 번째 항의 합에 $a_{2n}=a_n+n$을 대입하면 무엇이 보이는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.8
    steps:
    - id: 1b-1
      content: |
        $S_k=\displaystyle\sum_{n=1}^{k}a_n$이라 하자. 자연수 $m$에 대하여
        $$S_{2m}=\sum_{n=1}^{m}a_{2n-1}+\sum_{n=1}^{m}a_{2n}=0+\sum_{n=1}^{m}(a_n+n)=S_m+\frac{m(m+1)}{2}.$$
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        $S_1=a_1=0$ ($n=1$일 때 $a_{2n-1}=a_1=0$). 관계식을 $m=1,2,4,\dots,64$에 차례로 적용하면
        $S_2=0+1=1$, $S_4=1+3=4$, $S_8=4+10=14$, $S_{16}=14+36=50$, $S_{32}=50+136=186$, $S_{64}=186+528=714$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $S_{128}=714+\dfrac{64\cdot65}{2}=714+2080=2794$.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: 부분합을 홀수항의 합과 짝수항의 합으로 나누고 $a_{2n}=a_n+n$을 대입했다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: $S_{2m}=S_m+\dfrac{m(m+1)}{2}$ (또는 $S_{128}=S_{64}+2080$ 등 구체적 관계식)을 얻었다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 7
      evidence: $S_1=0$에서 출발해 관계식을 반복 적용해 $S_2,S_4,\dots,S_{64}$ (또는 합 $1+3+10+\cdots+2080$)을 구했다.
      depends_on: [1.A1]
      steps: [1b-2]
    - id: 1.A2
      mark_type: A
      points: 5
      evidence: $S_{128}=2794$.
      depends_on: [1.M2]
      cao: true
      steps: [1b-3]
    deductions:
