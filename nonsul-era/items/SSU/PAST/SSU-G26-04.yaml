stimuli:
- label: 제시문
  body: |
    함수 $f:X\to Y$에서 정의역 $X$의 원소 $x$에 공역 $Y$의 원소 $y$가 대응할 때, 이것을 기호로 $y=f(x)$와 같이 나타낸다. 이때 $f(x)$를 $x$에서의 함숫값이라 하고, 함숫값 전체의 집합 $\{f(x)\mid x\in X\}$를 함수 $f$의 치역이라고 한다.
    【출처: 수학 「함수」】

stem: |
  집합 $A=\{1,2,3,4,5,6\}$에 대하여 다음 조건을 모두 만족시키는 함수 $f:A\to A$의 개수를 구하시오.

  ① 집합 $A$의 모든 원소 $x$에 대하여 $f(f(x))=f(x)$

  ② 집합 $A$의 모든 원소 $x$에 대하여 $f(x)\le3$

subparts:
- id: '1'
  stem: |
    함수 $f$의 개수를 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '78', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 치역 $S$는 $\{1,2,3\}$의 공집합이 아닌 부분집합, $S$ 위에서 항등. 개수 $=\sum_{s=1}^{3}{}_3\mathrm C_s\,s^{6-s}=3+48+27$.
    steps:
    - {id: 1a, content: '$3\cdot1^5+3\cdot2^4+1\cdot3^3=78$', criteria: [1.M1, 1.R1, 1.A1, 1.A2, 1.A3, 1.A4]}
    hint_ladder:
    - $y$가 치역의 원소이면 $f(y)$는 무엇이어야 하는가?
    - 치역을 먼저 정하고, 치역 밖의 원소가 갈 곳을 세어 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.9
    steps:
    - id: 1b-1
      content: |
        $y$가 $f$의 치역의 원소이면 $y=f(b)$인 $b$가 있고, ①에 의해 $f(y)=f(f(b))=f(b)=y$. 즉 치역의 원소는 자기 자신으로 대응한다. 역으로 치역의 모든 원소 $y$가 $f(y)=y$이면 $f(f(x))=f(x)$가 성립한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        ②에 의해 치역은 $\{1,2,3\}$의 공집합이 아닌 부분집합이다. 치역 $S$가 정해지면 $S$의 원소는 고정되고, 나머지 원소는 $S$의 원소 중 아무 곳으로 대응하면 된다(치역이 정확히 $S$가 되는 것은 $S$의 원소가 자기 자신으로 가므로 자동). 치역의 원소 개수로 경우를 나눈다.
      criteria: [1.R1]
    - id: 1b-3
      content: |
        (i) 원소 1개: 치역 $\{1\},\{2\},\{3\}$, 상수함수 3개.
      criteria: [1.A1]
    - id: 1b-4
      content: |
        (ii) 원소 2개: 치역은 3가지이고, 각각 치역 밖 4개 원소가 2곳 중 하나로 가므로 $2^4=16$. 합 $3\cdot16=48$.
      criteria: [1.A2]
    - id: 1b-5
      content: |
        (iii) 원소 3개: 치역 $\{1,2,3\}$, $f(4),f(5),f(6)$이 각각 3가지이므로 $3^3=27$.
      criteria: [1.A3]
    - id: 1b-6
      content: |
        세 경우는 동시에 일어나지 않으므로 $3+48+27=78$.
      criteria: [1.A4]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 7
      evidence: ①로부터 치역의 원소 $y$에 대해 $f(y)=y$임을 보였다.
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: ②에서 치역이 $\{1,2,3\}$의 부분집합임을 밝히고 치역의 크기로 경우를 나누었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 치역의 원소가 1개인 경우 3개.
      depends_on: [1.R1]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 치역의 원소가 2개인 경우 $3\cdot2^4=48$개.
      depends_on: [1.R1]
      steps: [1b-4]
    - id: 1.A3
      mark_type: A
      points: 4
      evidence: 치역의 원소가 3개인 경우 $3^3=27$개.
      depends_on: [1.R1]
      steps: [1b-5]
    - id: 1.A4
      mark_type: A
      points: 3
      evidence: 합 $78$.
      depends_on: [1.R1, 1.A1, 1.A2, 1.A3]
      cao: true
      steps: [1b-6]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
