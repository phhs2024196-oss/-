subparts:
- id: A1
  stem: |
    문제 1- A 다음 논제에 답하시오. (30점)

    집합 $A$는 $2x+2y+z=100$을 만족하는 자연수 $x$, $y$, $z$의 순서쌍 $(x,y,z)$의 집합이다. 이때, 다음 문항에 답하시오.

    (1) 집합 $A$의 원소 중에서 $x+y+z=60$을 만족하는 자연수 $x$, $y$, $z$의 순서쌍 $(x,y,z)$의 개수를 구하시오.
  points: 15
  depends_on: []
  answer: {kind: value, value: '39', equivalents: [], tolerance: null}
  solutions:
  - id: SA1-A
    audience: A
    method_no: 1
    key_idea: 두 식을 빼면 $x+y=40$, $z=20$. $(x,y)$는 39개.
    steps:
    - {id: a1a, content: '$x+y=40$, $z=20$ $\Rightarrow$ 39개', criteria: [A1.M1, A1.A1, A1.A2]}
    hint_ladder:
    - 두 방정식을 연립해 한 변수를 없애 보자.
  - id: SA1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.99
    steps:
    - id: a1b-1
      content: |
        이 문항은 연립방정식 $\begin{cases}2x+2y+z=100\\x+y+z=60\end{cases}$의 자연수 해의 개수를 구하는 것이다. 위의 식에서 아래의 식을 빼면 $x+y=40$이고, 이로부터 $z=20$을 얻는다.
      criteria: [A1.M1, A1.A1]
    - id: a1b-2
      content: |
        따라서 구하는 개수는 $x+y=40$을 만족하는 자연수 순서쌍 $(x,y)$의 개수와 같고, $x=1,2,\ldots,39$이므로 39개이다.
      criteria: [A1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: A1.M1
      mark_type: M
      points: 5
      evidence: 두 방정식을 연립해 한 변수를 소거했다.
      steps: [a1b-1]
    - id: A1.A1
      mark_type: A
      points: 5
      evidence: $x+y=40$, $z=20$.
      depends_on: [A1.M1]
      steps: [a1b-1]
    - id: A1.A2
      mark_type: A
      points: 5
      evidence: 개수 39.
      depends_on: [A1.M1]
      cao: true
      steps: [a1b-2]
    deductions:
    - code: DA1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-0818}
  misconceptions:
  - id: MC-CNT-0818
    outcome_code: '71'
    wrong_work: '$x+y=40$의 해를 $x=0,1,\ldots,40$으로 세어 41개'
    detect_cue: 답 41 또는 $x=0$을 포함
    feedback: 자연수는 1부터입니다. $x$와 $y$가 모두 1 이상이 되도록 범위를 다시 잡으세요.
    remedy: [RL-1]
- id: A2
  stem: |
    (2) 집합 $A$의 원소 중에서 $x+y+z=60$을 만족하지 않는 자연수 $x$, $y$, $z$의 순서쌍 $(x,y,z)$의 개수를 구하시오.
  points: 15
  depends_on: [A1]
  answer: {kind: value, value: '1137', equivalents: [], tolerance: null}
  solutions:
  - id: SA2-A
    audience: A
    method_no: 1
    key_idea: $x+y=k$이면 $z=2(50-k)\ge1$에서 $2\le k\le49$, $|A|=\sum_{k=2}^{49}(k-1)=1176$, 답 $1176-39=1137$.
    steps:
    - {id: a2a, content: '$1176-39=1137$', criteria: [A2.M1, A2.A1, A2.M2, A2.A2]}
    hint_ladder:
    - $x+y$를 하나의 문자 $k$로 두면 $z$가 정해진다.
    - 「만족하지 않는」 것은 전체에서 (1)을 빼면 된다.
  - id: SA2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.99
    steps:
    - id: a2b-1
      content: |
        집합 $A$의 원소의 개수는 $2x+2y+z=100$을 만족하는 자연수 순서쌍의 개수이다. $x+y=k$라 하면 $x$, $y$가 자연수이고 $z=100-2x-2y=2(50-k)$도 자연수이므로 $k$는 2 이상 49 이하의 모든 자연수, 즉 $2\le x+y=k\le49$이다. 따라서 $z$는 2 이상 96 이하의 짝수이고, $|A|$는 $2\le x+y=k\le49$를 만족하는 자연수 순서쌍 $(x,y)$의 개수와 같다.
      criteria: [A2.M1]
    - id: a2b-2
      content: |
        $x+y=k$를 만족하는 자연수 순서쌍은 $k-1$개이므로
        $$\sum_{k=2}^{49}(k-1)=\sum_{n=1}^{48}n=\dfrac{48\times49}2=1176.$$
      criteria: [A2.A1]
    - id: a2b-3
      content: |
        이 중에서 $x+y+z=60$을 만족하는 것은 (1)에서 39개이므로, 만족하지 않는 것은 $1176-39=1137$개이다.
      criteria: [A2.M2, A2.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: A2.M1
      mark_type: M
      points: 5
      evidence: $x+y=k$로 두고 $z$가 자연수인 조건에서 $2\le k\le49$를 얻었다.
      steps: [a2b-1]
    - id: A2.A1
      mark_type: A
      points: 4
      evidence: $|A|=1176$.
      depends_on: [A2.M1]
      steps: [a2b-2]
    - id: A2.M2
      mark_type: M
      points: 3
      evidence: 전체에서 (1)의 개수를 빼는 식을 세웠다.
      ft: {from: [A1.A2], max_points: 3}
      steps: [a2b-3]
    - id: A2.A2
      mark_type: A
      points: 3
      evidence: 답 1137.
      depends_on: [A2.M1, A2.M2]
      cao: true
      steps: [a2b-3]
    deductions:
    - code: DA2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CNT-0819}
  misconceptions:
  - id: MC-CNT-0819
    outcome_code: '71'
    wrong_work: '$k$의 범위를 $2\le k\le50$으로 잡아 $|A|=1225$, 답 1186'
    detect_cue: $k=50$ ($z=0$)을 포함, 1225 또는 1186
    feedback: $z=2(50-k)$도 자연수여야 하므로 $k\le49$입니다.
    remedy: [RL-2]
- id: B
  stem: |
    문제 1- B 다음 논제에 답하시오. (30점)

    시각 $t=0$(초)에 10L의 물이 들어있는 물탱크의 유입구와 배출구를 모두 열었다. 시각 $t>0$(초)에서 $f(t)=4(t+2)\cdot\ln(t+2)$ (L/초)의 속도로 새로운 물이 유입되고 $g(t)=\dfrac{2\ln(t+1)}{(t+1)}$ (L/초)의 속도로 물탱크의 물이 배출된다. 시각 $t=2$(초)에 물탱크에 들어있는 물의 양(L)을 구하시오.
  points: 30
  depends_on: []
  answer: {kind: value, value: '56*log(2) - 2 - log(3)**2', equivalents: ['56ln2-2-(ln3)^2'], tolerance: null}
  solutions:
  - id: SB-A
    audience: A
    method_no: 1
    key_idea: 물의 양 $=10+\int_0^2(f-g)\,dt$. $x=t+2$로 바꾸어 부분적분하면 $\int_2^44x\ln x\,dx=56\ln2-12$, $u=\ln(t+1)$로 치환하면 $\int_0^2g=(\ln3)^2$.
    steps:
    - {id: ba, content: '$10+56\ln2-12-(\ln3)^2=56\ln2-2-(\ln3)^2$', criteria: [B.M1, B.M2, B.A1, B.M3, B.A2, B.A3]}
    hint_ladder:
    - 물의 양의 순간변화율은 $f(t)-g(t)$이다.
    - $\int x\ln x\,dx$는 부분적분, $\int\dfrac{\ln(t+1)}{t+1}dt$는 치환적분.
  - id: SB-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.100
    steps:
    - id: bb-1
      content: |
        시각 $t$에서 물탱크 안의 물의 양의 순간변화율은 $f(t)-g(t)$이다. 따라서 $t=0$에서 $t=2$까지 물의 변화량은 순간변화율을 적분하여 얻고, 처음 물의 양 10L를 더하면 $t=2$에서 물의 양은
        $$10+\int_0^2\{f(t)-g(t)\}\,dt.$$
      criteria: [B.M1]
    - id: bb-2
      content: |
        $x=t+2$로 치환하고 부분적분하면
        $$\int_0^2f(t)\,dt=\int_2^44x\ln x\,dx=\left[2x^2\ln x-x^2\right]_2^4=(32\ln4-16)-(8\ln2-4)=56\ln2-12.$$
      criteria: [B.M2, B.A1]
    - id: bb-3
      content: |
        $u=\ln(t+1)$로 치환하면 $du=\dfrac{dt}{t+1}$이고 $t:0\to2$일 때 $u:0\to\ln3$이므로
        $$\int_0^2g(t)\,dt=\int_0^{\ln3}2u\,du=(\ln3)^2.$$
      criteria: [B.M3, B.A2]
    - id: bb-4
      content: |
        따라서 $t=2$에 물탱크에 들어 있는 물의 양은 $10+(56\ln2-12)-(\ln3)^2=56\ln2-2-(\ln3)^2$ (L)이다.
      criteria: [B.A3]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: B.M1
      mark_type: M
      points: 6
      evidence: 물의 양을 $10+\int_0^2(f-g)\,dt$로 세웠다.
      steps: [bb-1]
    - id: B.M2
      mark_type: M
      points: 5
      evidence: $\int(t+2)\ln(t+2)\,dt$를 부분적분으로 계산하는 식을 썼다.
      steps: [bb-2]
    - id: B.A1
      mark_type: A
      points: 6
      evidence: $\int_0^2f(t)\,dt=56\ln2-12$.
      depends_on: [B.M2]
      steps: [bb-2]
    - id: B.M3
      mark_type: M
      points: 4
      evidence: $u=\ln(t+1)$ 치환을 썼다.
      steps: [bb-3]
    - id: B.A2
      mark_type: A
      points: 5
      evidence: $\int_0^2g(t)\,dt=(\ln3)^2$.
      depends_on: [B.M3]
      steps: [bb-3]
    - id: B.A3
      mark_type: A
      points: 4
      evidence: $56\ln2-2-(\ln3)^2$ (L).
      depends_on: [B.M1, B.M2, B.M3]
      cao: true
      steps: [bb-4]
    deductions:
    - code: DB-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-CAL-0820}
  misconceptions:
  - id: MC-CAL-0820
    outcome_code: '71'
    wrong_work: '$\int_0^2(f-g)\,dt=56\ln2-12-(\ln3)^2$를 답으로 씀'
    detect_cue: 처음 물의 양 10이 빠짐(상수항 $-12$)
    feedback: 적분값은 변화량입니다. 처음 들어 있던 10L를 더해야 합니다.
    remedy: [RL-3]

