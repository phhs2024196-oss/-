  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-0815}
  misconceptions:
  - id: MC-ALG-0815
    outcome_code: '71'
    wrong_work: '맨 아래층 $n^2$개, 전체 $\dfrac{n(n+1)(2n+1)}6$개'
    detect_cue: $n^2$ 또는 $\sum k^2$이 등장
    feedback: 정사면체의 각 층은 정사각형이 아니라 정삼각형 모양입니다. 한 줄에 놓인 공이 $1,2,\ldots,k$개입니다.
    remedy: [RL-2]

