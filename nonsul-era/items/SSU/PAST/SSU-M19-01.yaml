stem: |
  [문제 1] 다음 논제에 답하시오. (25점)

  점 $P$는 단위원 $x^2+y^2=1$ 위의 한점이다. 점 $P$와 직선 $3x+4y-8=0$ 사이의 거리를 $d_1$, 점 $P$와 직선 $4x-3y+6=0$ 사이의 거리를 $d_2$라고 하자. 이 때, $d_1+d_2$가 최소가 되는 점 $P$의 좌표를 구하시오.

subparts:
- id: '1'
  stem: |
    $d_1+d_2$가 최소가 되는 점 $P$의 좌표를 구하시오.
  points: 25
  depends_on: []
  answer: {kind: expression, value: '(-sqrt(2)/10, 7*sqrt(2)/10)', equivalents: ['(-1/sqrt(50), 7/sqrt(50))'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $P(\cos\theta,\sin\theta)$로 두면 덧셈정리로 $|3\cos\theta+4\sin\theta|\le5<8$, $|4\cos\theta-3\sin\theta|\le5<6$이라 부호가 고정되어 $d(\theta)=\dfrac{14}5+\dfrac{\cos\theta-7\sin\theta}5$. $d'(\theta)=0\iff\sin\theta=-7\cos\theta$에서 최솟값 $\dfrac{14}5-\sqrt2$.
    steps:
    - {id: 1a, content: '$P=\left(-\dfrac1{\sqrt{50}},\dfrac7{\sqrt{50}}\right)$, 최솟값 $\dfrac{14}5-\sqrt2$', criteria: [1.M1, 1.R1, 1.A1, 1.M2, 1.A2]}
    hint_ladder:
    - 단위원 위의 점을 $(\cos\theta,\sin\theta)$로 놓자.
    - $3\cos\theta+4\sin\theta$는 $5\sin(\theta+\alpha)$ 꼴이다. 절댓값 안의 부호는?
    - $d(\theta)$를 미분해 극값이 생기는 $\theta$의 조건을 찾자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.94
    steps:
    - id: 1b-1
      content: |
        점 $(p,q)$와 직선 $ax+by+c=0$ 사이의 거리는 $\dfrac{|ap+bq+c|}{\sqrt{a^2+b^2}}$이다. 단위원 위의 점을 $P(\cos\theta,\sin\theta)$로 나타내면
        $$d_1(\theta)=\left|\dfrac{3\cos\theta+4\sin\theta-8}5\right|,\quad d_2(\theta)=\left|\dfrac{4\cos\theta-3\sin\theta+6}5\right|.$$
      criteria: [1.M1]
    - id: 1b-2
      content: |
        사인의 덧셈정리에 의해 $|3\cos\theta+4\sin\theta|=\left|5\left(\tfrac35\cos\theta+\tfrac45\sin\theta\right)\right|=|5\sin(\alpha+\theta)|\le5$, $|4\cos\theta-3\sin\theta|=|5\sin(\beta+\theta)|\le5$ (단, $\sin\alpha=\tfrac35$, $\cos\alpha=\tfrac45$, $\sin\beta=\tfrac45$, $\cos\beta=-\tfrac35$). 따라서 $3\cos\theta+4\sin\theta-8<0$, $4\cos\theta-3\sin\theta+6>0$이고
        $$d_1=\dfrac{-3\cos\theta-4\sin\theta+8}5,\quad d_2=\dfrac{4\cos\theta-3\sin\theta+6}5,$$
        $$d(\theta)=d_1+d_2=\dfrac{14}5+\dfrac{\cos\theta-7\sin\theta}5.$$
      criteria: [1.R1, 1.A1]
    - id: 1b-3
      content: |
        $d'(\theta)=\dfrac15(-\sin\theta-7\cos\theta)$이므로 극값은 $\sin\theta=-7\cos\theta$일 때 생긴다. $\cos^2\theta+\sin^2\theta=1$에서 $\cos\theta=\pm\dfrac1{\sqrt{50}}$, $\sin\theta=\mp\dfrac7{\sqrt{50}}$(복부호 동순)이고 이때 $d(\theta)=\dfrac{14}5\pm\sqrt2$이다. $d$는 주기 $2\pi$인 연속함수이므로 최솟값은 극값 중 작은 값 $\dfrac{14}5-\sqrt2$이다.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        최솟값은 $\cos\theta=-\dfrac1{\sqrt{50}}$, $\sin\theta=\dfrac7{\sqrt{50}}$일 때이므로 $d_1+d_2$가 최소가 되는 점은 $P\left(-\dfrac1{\sqrt{50}},\dfrac7{\sqrt{50}}\right)=\left(-\dfrac{\sqrt2}{10},\dfrac{7\sqrt2}{10}\right)$이다.
      criteria: [1.A2]
  - id: S1-ALT
    audience: ALT
    method_no: 2
    key_idea: 「수학」 범위만으로 — 원 위에서 $3x+4y-8<0$, $4x-3y+6>0$이므로 $d_1+d_2=\dfrac{14+x-7y}5$. 직선 $x-7y=k$가 단위원과 만나려면 $\dfrac{|k|}{\sqrt{50}}\le1$이므로 $k\ge-\sqrt{50}$이고, 등호는 접점(원점에서 내린 수선의 발) $\dfrac k{50}(1,-7)=\left(-\dfrac1{\sqrt{50}},\dfrac7{\sqrt{50}}\right)$에서 성립.
    steps:
    - {id: 1c, content: '$x-7y\ge-\sqrt{50}$, 접점 $\left(-\dfrac1{\sqrt{50}},\dfrac7{\sqrt{50}}\right)$', criteria: [1.M2, 1.A2]}
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 점과 직선 사이의 거리 공식으로 $d_1$, $d_2$를 식으로 썼다(매개변수 $\cos\theta$, $\sin\theta$ 사용도 인정).
      steps: [1b-1]
    - id: 1.R1
      mark_type: R
      points: 6
      evidence: 원 위의 모든 점에서 $3x+4y-8<0$, $4x-3y+6>0$임을 근거(거리 또는 합성)와 함께 밝혔다.
      steps: [1b-2]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $d_1+d_2=\dfrac{14+\cos\theta-7\sin\theta}5$ (또는 $\dfrac{14+x-7y}5$).
      depends_on: [1.R1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: $d'(\theta)=0$에서 $\sin\theta=-7\cos\theta$를 얻고 두 극값 $\dfrac{14}5\pm\sqrt2$ 중 작은 쪽을 골랐다(원과 직선의 접하는 조건으로 $x-7y\ge-\sqrt{50}$을 보인 것도 인정).
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 6
      evidence: 최소가 되는 점 $P\left(-\dfrac{\sqrt2}{10},\dfrac{7\sqrt2}{10}\right)$.
      depends_on: [1.M2]
      cao: true
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
