intent: 원과 로그함수의 그래프가 공통접선을 갖는 조건을 음함수의 미분으로 식으로 세워 미지수를 결정하고, 원과 곡선 및 x축으로 둘러싸인 넓이를 직사각형·활꼴·정적분의 합차로 구하는 능력을 본다.
key_idea: '공통접선이면 기울기가 같으므로 $\dfrac{x_1}{a-y_1}=\dfrac1{x_1}$, 즉 $x_1^2=a-y_1$. 원의 식과 연립하면 $(a-y_1)^2+(a-y_1)-2=0$에서 $a-y_1=1$.'
stuck: $y_1=a$인 경우(원의 접선이 $y$축과 평행)를 배제하고, $x_1^2=a-y_1$을 원의 방정식에 넣어 $a-y_1$에 대한 이차방정식으로 보는 단계
