  - id: MC-CAL-0722
    outcome_code: '72'
    wrong_work: '$t=2x-1$ 치환에서 $dx=\dfrac12dt$를 빠뜨려 $S=\dfrac19(7e\sqrt e-4)$'
    detect_cue: 답이 정답의 2배
    feedback: 일차식 치환 $t=2x-1$이면 $dt=2\,dx$이므로 $\dfrac12$이 곱해집니다.
    remedy: [RL-2]

