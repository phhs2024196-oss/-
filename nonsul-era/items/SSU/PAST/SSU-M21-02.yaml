stimuli: []

stem: |
  좌표평면 위에 중심이 원점 $O$이고 곡선 $y=x\tan x\ \left(0\le x<\dfrac\pi2\right)$ 위의 점 $P(u,\,u\tan u)$를 지나는 원 $C$가 있다. <그림 1>과 같이 평면도형 $F$는 원 $C$와 선분 $OP$ 및 $y$축으로 둘러싸인 부채꼴이고, 입체도형 $S$는 밑면이 $F$이고 높이가 $h(u)$인 부채꼴 기둥이다. $S$의 부피 $V(u)$의 순간변화율 $\dfrac{dV}{du}$가 항상 $0$이고 $V(1)=1$일 때, $\displaystyle\lim_{u\to\frac\pi2-}\dfrac{dh}{du}$를 구하시오.

  [그림 설명] <그림 1> 왼쪽: 원점 $O$ 중심의 원 $C$와 원점에서 출발해 위로 휘어 오르는 곡선 $y=x\tan x$가 제1사분면의 점 $P(u,\,u\tan u)$에서 만난다. 원 $C$와 $y$축의 양의 부분의 교점을 $Q$라 하고, 선분 $OP$, 선분 $OQ$($y$축), 호 $PQ$로 둘러싸인 부채꼴 $F$에 빗금이 그어져 있다. $P$에서 $x$축에 수선(발 $u$), $y$축에 수평선(높이 $u\tan u$)이 점선으로 표시되어 있다. 오른쪽: 부채꼴 $F$(꼭짓점 $O$, 호의 양 끝 $Q$, $P$)를 밑면으로 하고 높이 $h(u)$인 부채꼴 기둥 $S$.

subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{u\to\frac\pi2-}\dfrac{dh}{du}$를 구하시오.
  points: 20
  depends_on: []
  answer: {kind: value, value: '-8/pi**2', equivalents: ['-\dfrac8{\pi^2}'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $A(u)=\dfrac12u^2\sec^2u\left(\dfrac\pi2-u\right)$, $V\equiv1$에서 $h=\dfrac1A$. $s=\dfrac\pi2-u$로 두면 $h=\dfrac{2\sin^2s}{u^2s}$이고 몫의 미분 후 $\dfrac{\sin s}s\to1$.
    steps:
    - {id: 1a, content: '$\dfrac{dh}{du}=-\dfrac{4\cos s}{u^2}\cdot\dfrac{\sin s}{s}-\dfrac{2(\pi-3u)}{u^3}\cdot\dfrac{\sin^2s}{s^2}\to-\dfrac{16}{\pi^2}+\dfrac8{\pi^2}=-\dfrac8{\pi^2}$', criteria: [1.M1, 1.A1, 1.M2, 1.M3, 1.M4, 1.A2]}
    hint_ladder:
    - 선분 $OP$의 기울기는? 그 기울기가 $x$축과 이루는 각은?
    - 부피가 항상 일정하면 $h(u)$는 밑넓이와 어떤 관계인가?
    - $\cos u=\sin\left(\dfrac\pi2-u\right)$를 이용하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.86
    steps:
    - id: 1b-1
      content: |
        직선 $OP$의 기울기는 $\dfrac{u\tan u-0}{u-0}=\tan u$이므로 선분 $OP$가 $x$축의 양의 방향과 이루는 각은 $u$이고, 부채꼴 $F$의 중심각은 $\dfrac\pi2-u$. 반지름은 $\overline{OP}=\sqrt{u^2+(u\tan u)^2}=u\sqrt{1+\tan^2u}=u\sec u$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $F$의 넓이 $A(u)=\dfrac12(u\sec u)^2\left(\dfrac\pi2-u\right)=\dfrac12u^2\dfrac{\frac\pi2-u}{\cos^2u}=\dfrac12u^2\dfrac{\frac\pi2-u}{\sin^2\left(\frac\pi2-u\right)}$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $\dfrac{dV}{du}=0$이므로 $V(u)$는 상수이고 $V(1)=1$에서 $V(u)=1$. 따라서 $h(u)=\dfrac{V(u)}{A(u)}=\dfrac{2\sin^2\left(\frac\pi2-u\right)}{u^2\left(\frac\pi2-u\right)}$.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        분모 $u^2\left(\dfrac\pi2-u\right)$의 도함수는 $\pi u-3u^2$이므로 몫의 미분법에 의해
        $\dfrac{dh}{du}=\dfrac{-4\sin\left(\frac\pi2-u\right)\cos\left(\frac\pi2-u\right)\cdot u^2\left(\frac\pi2-u\right)-2\sin^2\left(\frac\pi2-u\right)(\pi u-3u^2)}{u^4\left(\frac\pi2-u\right)^2}=-\dfrac{4\cos\left(\frac\pi2-u\right)}{u^2}\cdot\dfrac{\sin\left(\frac\pi2-u\right)}{\frac\pi2-u}-\dfrac{2(\pi-3u)}{u^3}\cdot\dfrac{\sin^2\left(\frac\pi2-u\right)}{\left(\frac\pi2-u\right)^2}$.
      criteria: [1.M3]
    - id: 1b-5
      content: |
        $u\to\dfrac\pi2-$이면 $\dfrac\pi2-u\to0+$이므로 $\dfrac{\sin\left(\frac\pi2-u\right)}{\frac\pi2-u}\to1$. 함수의 곱의 극한에 대한 성질로
        $\displaystyle\lim_{u\to\frac\pi2-}\dfrac{dh}{du}=-\dfrac{4\cos0}{\left(\frac\pi2\right)^2}\cdot1-\dfrac{2\left(\pi-\frac{3\pi}2\right)}{\left(\frac\pi2\right)^3}\cdot1=-\dfrac{16}{\pi^2}+\dfrac8{\pi^2}=-\dfrac8{\pi^2}$.
      criteria: [1.M4, 1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 부채꼴의 중심각 $\dfrac\pi2-u$와 반지름 $u\sec u$(또는 $\sqrt{u^2+u^2\tan^2u}$)를 구했다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $A(u)=\dfrac12u^2\sec^2u\left(\dfrac\pi2-u\right)$.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $V(u)\equiv1$에서 $h(u)=\dfrac1{A(u)}$로 나타냈다.
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: 몫의 미분법(또는 곱의 미분)으로 $\dfrac{dh}{du}$를 바르게 구했다.
      steps: [1b-4]
    - id: 1.M4
      mark_type: M
      points: 4
      evidence: $\dfrac{\sin\left(\frac\pi2-u\right)}{\frac\pi2-u}\to1$을 써서 각 항의 극한을 구했다.
      steps: [1b-5]
    - id: 1.A2
      mark_type: A
      points: 2
      evidence: $-\dfrac8{\pi^2}$.
      depends_on: [1.M3, 1.M4]
      cao: true
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
