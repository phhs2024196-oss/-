# 숭실대 2021학년도 모의논술고사 문제 4 — 원문은 내부 분석용(allowed_use: internal_only)
# 원문에 제시문 없음. 문제 3(확률과통계)은 교재에서 제외됨.
# 해설교재는 분자 전개에 이항정리(확률과통계)를 씀 → 숭실 범위(확통 제외)에 맞춰 B 해설은 같은 흐름에서 인수분해 공식
#   A^{m}-B^{m}=(A-B)(A^{m-1}+A^{m-2}B+…+B^{m-1}) 로 최고차항 (k+1)n^k 을 얻도록 바꿈.
# 답은 "극한값이 1"이 되는 (a,b) 이므로 b=k+2 와 a=1/(k+1) 이 유일(b 가 다르면 극한이 0 또는 발산).
