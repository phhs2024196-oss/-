stimuli: []

stem: |
  <그림 2>와 같이, 유리함수 $y=\dfrac1{x^k}$의 그래프 위의 점 $P_n\left(n,\,\dfrac1{n^k}\right)$이 있다. (단, $k,n$은 자연수이다.) 원점 $O$와 점 $P_n$을 이은 선분이 $y$축의 양의 방향과 이루는 각을 $\theta_n$이라 할 때,
  $$\lim_{n\to\infty}\left\{an^b\tan(\theta_{n+1}-\theta_n)\right\}=1$$
  을 만족하는 $a$, $b$를 $k$에 대한 식으로 각각 나타내시오.

  [그림 설명] <그림 2>: 제1사분면에서 감소하는 곡선 $y=\dfrac1{x^k}$ 위의 점 $P_n\left(n,\,\dfrac1{n^k}\right)$과 원점 $O$를 잇는 선분이 그려져 있고, 이 선분과 $y$축의 양의 방향 사이의 각이 $\theta_n$으로 표시되어 있다. $P_n$에서 두 축으로 점선(높이 $\dfrac1{n^k}$, 가로 위치 $n$)이 그어져 있다.

subparts:
- id: '1'
  stem: |
    $a$, $b$를 $k$에 대한 식으로 각각 나타내시오.
  points: 20
  depends_on: []
  answer: {kind: expression, value: '[1/(k+1), k+2]', equivalents: ['a=\dfrac1{k+1},\ b=k+2'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\tan(\theta_{n+1}-\theta_n)$의 분자 최고차항 $(k+1)n^k$, 분모 최고차항 $n^{2k+2}$이므로 $an^b\tan(\cdot)\sim a(k+1)n^{b-k-2}$.
    steps:
    - {id: 1a, content: '$b=k+2$, $a(k+1)=1$', criteria: [1.M1, 1.M2, 1.M3, 1.R1, 1.A1]}
    hint_ladder:
    - $\theta_n$은 $y$축과 이루는 각이다. $\tan\theta_n$은?
    - 탄젠트의 덧셈정리로 $\tan(\theta_{n+1}-\theta_n)$을 $n$의 식으로 써 보자.
    - 분자 $(n+1)^{k+1}-n^{k+1}$의 최고차항은?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.87
    steps:
    - id: 1b-1
      content: |
        $\theta_n$은 선분 $OP_n$이 $y$축의 양의 방향과 이루는 각이므로 $\tan\theta_n=\dfrac{n}{1/n^k}=n^{k+1}$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        탄젠트함수의 덧셈정리에 의해
        $\tan(\theta_{n+1}-\theta_n)=\dfrac{\tan\theta_{n+1}-\tan\theta_n}{1+\tan\theta_{n+1}\tan\theta_n}=\dfrac{(n+1)^{k+1}-n^{k+1}}{1+(n+1)^{k+1}n^{k+1}}$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        $A^{m}-B^{m}=(A-B)(A^{m-1}+A^{m-2}B+\cdots+B^{m-1})$에서 $A=n+1$, $B=n$, $m=k+1$로 두면 $(n+1)^{k+1}-n^{k+1}=(n+1)^k+(n+1)^{k-1}n+\cdots+n^k$이고, 우변은 $n$에 대한 $k$차 다항식으로 최고차항이 $(k+1)n^k$이다(각 항의 최고차항이 $n^k$이고 $k+1$개). 따라서
        $an^b\tan(\theta_{n+1}-\theta_n)=\dfrac{a\left\{(k+1)n^{k+b}+(\text{차수가 낮은 항})\right\}}{1+(n+1)^{k+1}n^{k+1}}$.
        (해설교재는 이 단계를 이항정리로 전개함.)
      criteria: [1.M3]
    - id: 1b-4
      content: |
        분자와 분모의 최고차항은 각각 $a(k+1)n^{k+b}$와 $n^{2k+2}$이므로 극한값이 $0$이 아닌 상수일 조건은 $a\ne0$, $k+b=2k+2$이고 이때 극한값은 $a(k+1)$이다($k+b<2k+2$이면 $0$, $k+b>2k+2$이면 발산).
      criteria: [1.R1]
    - id: 1b-5
      content: |
        $a(k+1)=1$이므로 $a=\dfrac1{k+1}$, $b=k+2$.
      criteria: [1.A1]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $\tan\theta_n=n^{k+1}$을 구했다.
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 덧셈정리로 $\tan(\theta_{n+1}-\theta_n)=\dfrac{(n+1)^{k+1}-n^{k+1}}{1+(n+1)^{k+1}n^{k+1}}$을 얻었다.
      steps: [1b-2]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: 인수분해(또는 전개)로 분자의 최고차항이 $(k+1)n^k$임을 밝혔다.
      accept:
      - 이항정리로 전개한 풀이(교과 외 도구지만 결과가 맞으면 인정)
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 5
      evidence: 분자·분모의 최고차항 비교로 극한이 0이 아닌 상수가 될 조건 $k+b=2k+2$와 극한값 $a(k+1)$을 근거와 함께 적었다.
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $a=\dfrac1{k+1}$, $b=k+2$.
      depends_on: [1.R1]
      cao: true
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
