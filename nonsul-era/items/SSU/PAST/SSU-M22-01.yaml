    wrong_work: '$\left(\cos\frac{4\pi x}3\right)''=-\sin\frac{4\pi x}3$로 속미분 $\frac{4\pi}3$을 빠뜨림'
    detect_cue: '좌미분계수가 $\dfrac{\sqrt3}2c$'
