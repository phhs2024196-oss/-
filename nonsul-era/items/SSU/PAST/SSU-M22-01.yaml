    outcome_code: '71'
    wrong_work: '$x>1$에서 $c\cos\frac{4\pi x}3$ 항을 그대로 남기거나 $x=1$에서 $f(1)=-1+a+b+c\cos\frac{4\pi}3$으로 계산'
    detect_cue: '$f(1)$의 분모 2가 없음'
    feedback: '$x=1$이면 분모 $x^n+1\to2$입니다. $x>1$에서는 유계인 $\cos$ 항을 $x^n$으로 나누면 0으로 갑니다.'
    remedy:
    - RL-0641
- id: '2'
  stem: |
    함수 $f(x)$가 구간 $(0,\infty)$에서 미분가능하도록 하는 $a$, $b$, $c$에 대하여 $b$를 $c$의 식으로 나타내시오.
  points: 10
  depends_on:
  - '1'
  answer:
    kind: expression
    value: b=-1-(1/2+2*sqrt(3)*pi/3)*c
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '좌미분계수 $-\dfrac{4\pi c}3\sin\dfrac{4\pi}3=\dfrac{2\pi c}{\sqrt3}$, 우미분계수 $-2+a=-1-b-\dfrac c2$.'
    steps:
    - id: 2a
      content: '$b=-1-\left(\dfrac12+\dfrac{2\pi}{\sqrt3}\right)c$'
      criteria:
      - 2.R1
      - 2.M1
      - 2.M2
      - 2.A1
    hint_ladder:
    - 미분가능하면 연속이므로 (1)의 ㉢을 쓴다.
    - '$x=1$에서 좌우 미분계수를 계산하자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.70
    steps:
    - id: 2b-1
      content: '$f$는 $(0,1)$과 $(1,\infty)$에서 미분가능하므로 $x=1$에서 미분가능하면 된다. 미분가능하면 연속이므로 ㉡에서 $f(1)=c\cos\dfrac{4\pi}3=-1+a+b$이고 ㉢이 성립한다.'
      criteria:
      - 2.R1
    - id: 2b-2
      content: |
        $$\lim_{x\to1-}\dfrac{f(x)-f(1)}{x-1}=\lim_{x\to1-}\dfrac{c\cos\frac{4\pi x}3-c\cos\frac{4\pi}3}{x-1}=-\dfrac{4\pi c}3\sin\dfrac{4\pi}3=\dfrac{2\pi c}{\sqrt3}$$
        $$\lim_{x\to1+}\dfrac{f(x)-f(1)}{x-1}=\lim_{x\to1+}\dfrac{(-x^2+ax+b)-(-1+a+b)}{x-1}=-2+a=-1-b-\dfrac c2$$
      criteria:
      - 2.M1
      - 2.M2
    - id: 2b-3
      content: '두 값이 같아야 하므로 $b=-1-\left(\dfrac12+\dfrac{2\pi}{\sqrt3}\right)c$ $\cdots$ ㉣.'
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: '$x=1$에서만 확인하면 되고, 연속 조건(㉢)이 필요함을 밝혔다.'
      steps:
      - 2b-1
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: '좌미분계수 $\dfrac{2\pi c}{\sqrt3}$을 구했다.'
      steps:
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: '우미분계수 $-2+a$를 구하고 ㉢으로 $b,c$의 식으로 바꿨다.'
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: '$b=-1-\left(\dfrac12+\dfrac{2\pi}{\sqrt3}\right)c$.'
      depends_on:
      - 2.M1
      - 2.M2
      cao: true
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
