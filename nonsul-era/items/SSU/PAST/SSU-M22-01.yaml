      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: '$x=1$에서 좌극한·우극한·함숫값이 같아야 한다는 식을 세웠다.'
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: '$a=1-b-\dfrac c2$.'
      depends_on:
      - 1.M2
      cao: true
      steps:
      - 1b-4
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
