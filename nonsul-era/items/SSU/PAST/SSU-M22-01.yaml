stimuli:
- label: 제시문
  body: |
    함수 $f(x)$에 대하여 다음이 성립한다.
    $$\lim_{x\to a}f(x)=L\iff\lim_{x\to a+}f(x)=\lim_{x\to a-}f(x)=L\ (L\text{은 실수})$$
    【출처: 수학Ⅱ 「함수의 극한」】
stem: |
  구간 $[0,\infty)$에서 함수 $f(x)$가 아래와 같이 주어져 있다.
  $$f(x)=\lim_{n\to\infty}\dfrac{-x^{n+2}+ax^{n+1}+bx^n+c\cos\left(\dfrac{4\pi x}3\right)}{x^n+1}\quad(a,\ b,\ c\text{는 상수})$$
  이때 다음 문항에 답하시오.

  (1) 함수 $f(x)$가 구간 $[0,\infty)$에서 연속이 되도록 하는 $a$, $b$, $c$에 대하여 $a$를 $b$와 $c$의 식으로 나타내시오.

  (2) 함수 $f(x)$가 구간 $(0,\infty)$에서 미분가능하도록 하는 $a$, $b$, $c$에 대하여 $b$를 $c$의 식으로 나타내시오.

  (3) 함수 $f(x)$가 구간 $(0,\infty)$에서 미분가능할 때, 구간 $[0,\infty)$에서 방정식 $f(x)=0$이 서로 다른 두 개의 해를 갖도록 하는 양수 $c$의 값을 구하시오.
subparts:
- id: '1'
  stem: |
    함수 $f(x)$가 구간 $[0,\infty)$에서 연속이 되도록 하는 $a$, $b$, $c$에 대하여 $a$를 $b$와 $c$의 식으로 나타내시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: a=1-b-c/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$f$를 구간별로 구하면 $x=1$에서 좌극한 $-\dfrac c2$, 우극한 $-1+a+b$.'
    steps:
    - id: 1a
      content: '$-\dfrac c2=-1+a+b\Rightarrow a=1-b-\dfrac c2$'
      criteria:
      - 1.B1
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - '$0\le x<1$, $x=1$, $x>1$에서 $x^n$의 극한은?'
    - '$x>1$이면 분자·분모를 $x^n$으로 나누자.'
    - '$x=1$에서 좌극한·함숫값·우극한을 비교하자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.69~70
    steps:
    - id: 1b-1
      content: '$0\le x<1$일 때 $\displaystyle\lim_{n\to\infty}x^n=0$이므로 $f(x)=c\cos\left(\dfrac{4\pi x}3\right)$. $x=1$일 때 $\displaystyle\lim_{n\to\infty}x^n=1$이므로 $f(1)=\dfrac{-1+a+b-\frac c2}2$.'
      criteria:
      - 1.B1
    - id: 1b-2
      content: '$x>1$일 때 $\displaystyle\lim_{n\to\infty}\dfrac1{x^n}=0$이고 $-\dfrac1{x^n}\le\dfrac{\cos(4\pi x/3)}{x^n}\le\dfrac1{x^n}$이므로 $\displaystyle\lim_{n\to\infty}\dfrac{\cos(4\pi x/3)}{x^n}=0$. 분자·분모를 $x^n$으로 나누면 $f(x)=\displaystyle\lim_{n\to\infty}\dfrac{-x^2+ax+b+\frac{c\cos(4\pi x/3)}{x^n}}{1+\frac1{x^n}}=-x^2+ax+b$.'
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        따라서
        $$f(x)=\begin{cases}c\cos\dfrac{4\pi x}3 & (0\le x<1)\\ \dfrac{-2+2a+2b-c}4 & (x=1)\\ -x^2+ax+b & (x>1)\end{cases}\quad\cdots\ \text{㉠}$$
        $f$는 $[0,1)$과 $(1,\infty)$에서 연속이므로, $[0,\infty)$에서 연속이려면 $\displaystyle\lim_{x\to1-}f(x)=f(1)=\lim_{x\to1+}f(x)$이면 된다. $\displaystyle\lim_{x\to1-}f(x)=c\cos\dfrac{4\pi}3=-\dfrac c2$, $\displaystyle\lim_{x\to1+}f(x)=-1+a+b$ $\cdots$ ㉡
      criteria:
      - 1.M2
    - id: 1b-4
      content: '이므로 $-\dfrac c2=-1+a+b$ (이때 $f(1)$도 같은 값), 즉 $a=1-b-\dfrac c2$ $\cdots$ ㉢.'
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
