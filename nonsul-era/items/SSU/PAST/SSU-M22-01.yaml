- id: '3'
  stem: |
    구간 $[0,\infty)$에서 방정식 $f(x)=0$이 서로 다른 두 개의 해를 갖도록 하는 양수 $c$의 값을 구하시오.
  points: 10
  depends_on:
  - '1'
  - '2'
  answer:
    kind: value
    value: 3/(2*pi**2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$[0,1]$의 해는 $x=\dfrac38$ 하나. $x>1$에서 $f(x)=-\left(x-1-\dfrac{\pi c}{\sqrt3}\right)^2+\dfrac{\pi^2c^2}3-\dfrac c2$의 최댓값이 0.'
    steps:
    - id: 3a
      content: '$\dfrac{\pi^2c^2}3-\dfrac c2=0\Rightarrow c=\dfrac3{2\pi^2}$'
      criteria:
      - 3.B1
      - 3.M1
      - 3.R1
      - 3.A1
    hint_ladder:
    - '$c>0$일 때 $[0,1]$에서 해는 몇 개인가? $f(1)$의 부호는?'
    - '㉢, ㉣을 대입해 $x>1$의 식을 완전제곱꼴로.'
    - '$f(1)<0$이므로 $x>1$에서 해가 하나이려면 최댓값은?'
  - id: S3-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.70
    steps:
    - id: 3b-1
      content: '$c>0$일 때 구간 $[0,1]$에서 $f(x)=0$의 해는 $c\cos\dfrac{4\pi x}3=0$에서 $x=\dfrac38$ 하나뿐이다($f(1)=-\dfrac c2\ne0$).'
      criteria:
      - 3.B1
    - id: 3b-2
      content: '$x>1$일 때 ㉠, ㉢, ㉣로부터 $f(x)=-x^2+\left(2+\dfrac{2\pi c}{\sqrt3}\right)x-1-\left(\dfrac12+\dfrac{2\pi}{\sqrt3}\right)c=-\left(x-1-\dfrac{\pi c}{\sqrt3}\right)^2+\dfrac{\pi^2c^2}3-\dfrac c2$.'
      criteria:
      - 3.M1
    - id: 3b-3
      content: '따라서 $f$는 $x=1+\dfrac{\pi c}{\sqrt3}\,(>1)$에서 최댓값 $\dfrac{\pi^2c^2}3-\dfrac c2$를 갖는다. $\displaystyle\lim_{x\to1+}f(x)=-\dfrac c2<0$이므로, $(1,\infty)$에서 $f(x)=0$이 꼭 하나의 해를 갖는 것은 최댓값이 0일 때이다(양수이면 해 2개, 음수이면 0개).'
      criteria:
      - 3.R1
    - id: 3b-4
      content: '$\dfrac{\pi^2c^2}3-\dfrac c2=0$, $c>0$에서 $c=\dfrac3{2\pi^2}$. (이때 해는 $x=\dfrac38$, $x=1+\dfrac{\pi c}{\sqrt3}$ 두 개뿐이다.)'
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: '$[0,1]$에서의 해가 $x=\dfrac38$ 하나뿐임을 밝혔다.'
      steps:
      - 3b-1
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: '$x>1$에서 $f$를 $c$만의 식으로 쓰고 완전제곱꼴(또는 판별식)로 정리했다.'
      depends_on:
      - 2.A1
      steps:
      - 3b-2
    - id: 3.R1
      mark_type: R
      points: 3
      evidence: '$f(1+)<0$과 최댓값의 부호로 $x>1$의 해의 개수를 분류해 최댓값 $=0$ 조건을 이끌었다.'
      depends_on:
      - 3.M1
      steps:
      - 3b-3
    - id: 3.A1
