stimuli:
- label: 제시문
  body: |
    두 함수 $f(x)$, $g(x)$가 모두 미분가능할 때
    $$\int f(x)g'(x)\,dx=f(x)g(x)-\int f'(x)g(x)\,dx$$
    【출처: 미적분 「여러 가지 적분법」】
stem: |
  (1) 이차함수 $p(t)=t^2+bt+c$에 대하여 정적분 $\displaystyle\int_0^x\dfrac{p(t)+p'(t)}3e^t\,dt$를 구하시오. ($b$, $c$는 상수)

  (2) $f(0)=0$, $f\left(\frac12\right)=3$이고 도함수가 실수 전체에서 연속인 함수 $f(t)$에 대하여
  $$f_1(x)=\int_0^x\dfrac{f(t)+f'(t)}3e^t\,dt$$
  $$f_{n+1}(x)=\int_0^x\dfrac{f_n(t)+f_n{}'(t)}3e^t\,dt\ (n\text{은 자연수})$$
  로 정의하자. 이때 급수 $\displaystyle\sum_{n=1}^\infty f_n\left(\frac12\right)$의 합을 구하시오.
subparts:
- id: '1'
  stem: |
    정적분 $\displaystyle\int_0^x\dfrac{p(t)+p'(t)}3e^t\,dt$를 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: ((x**2+b*x+c)*exp(x)-c)/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '제시문에 $f=p$, $g=\dfrac13e^t$를 넣으면 $\dfrac13\int pe^t=\dfrac13pe^t-\dfrac13\int p''e^t$.'
    steps:
    - id: 1a
      content: '$\dfrac13\big[p(t)e^t\big]_0^x=\dfrac13\left((x^2+bx+c)e^x-c\right)$'
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - '$g(t)=\dfrac13e^t$이면 $g''=g$이다.'
    - '$p''e^t$ 항을 옮기면?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.71
    steps:
    - id: 1b-1
      content: '제시문에 $f(t)=p(t)$, $g(t)=\dfrac13e^t$를 대입하고 $g''(t)=g(t)$를 이용하면 $\dfrac13\displaystyle\int p(t)e^t\,dt=\dfrac13p(t)e^t-\dfrac13\int p''(t)e^t\,dt$.'
      criteria:
      - 1.M1
    - id: 1b-2
      content: '$$\int_0^x\dfrac{p(t)+p''(t)}3e^t\,dt=\dfrac13\Big[p(t)e^t\Big]_0^x=\dfrac13\left(p(x)e^x-p(0)\right)=\dfrac13\left((x^2+bx+c)e^x-c\right)\quad\cdots\ \text{㉠}$$'
      criteria:
      - 1.M2
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: '부분적분(또는 $(pe^t)''=(p+p'')e^t$)을 적용했다.'
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: '$\dfrac13\big[p(t)e^t\big]_0^x$ 꼴로 정리했다.'
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: '$\dfrac13\left((x^2+bx+c)e^x-c\right)$.'
      depends_on:
      - 1.M2
      cao: true
      steps:
      - 1b-2
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - code: '20'
