  misconceptions:
  - id: MC-CAL-0644
    outcome_code: '71'
    wrong_work: '아래끝 $t=0$의 값 $p(0)=c$를 빼지 않음'
    detect_cue: '답에 $-c$ 항이 없음'
    feedback: '정적분은 위끝 값에서 아래끝 값을 뺍니다. $p(0)e^0=c$입니다.'
    remedy:
    - RL-0644
- id: '2'
  stem: |
    급수 $\displaystyle\sum_{n=1}^\infty f_n\left(\frac12\right)$의 합을 구하시오.
  points: 12
  depends_on:
  - '1'
  answer:
    kind: value
    value: 3*sqrt(E)/(3-sqrt(E))
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '㉠은 도함수가 연속인 모든 $f$에 성립: $f_1\left(\frac12\right)=\dfrac{\sqrt e}3f\left(\frac12\right)$, $f_{n+1}\left(\frac12\right)=\dfrac{\sqrt e}3f_n\left(\frac12\right)$.'
    steps:
    - id: 2a
      content: '$\displaystyle\sum=\dfrac{\frac{\sqrt e}3\cdot3}{1-\frac{\sqrt e}3}=\dfrac{3\sqrt e}{3-\sqrt e}$'
      criteria:
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.R1
      - 2.M3
      - 2.A2
    hint_ladder:
    - '(1)의 계산에서 $p$가 이차함수라는 사실을 썼는가?'
    - '$f_n(0)$의 값은?'
    - 공비가 1보다 작은 등비급수.
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.71
    steps:
    - id: 2b-1
      content: '식 ㉠은 도함수가 실수 전체에서 연속인 함수 $f(t)$에 대해서도 성립하므로 구간 $\left[0,\frac12\right]$에서 $f_1\left(\frac12\right)=\displaystyle\int_0^{\frac12}\dfrac{f(t)+f''(t)}3e^t\,dt=\dfrac13\Big[f(t)e^t\Big]_0^{\frac12}=\dfrac13\left(f\left(\frac12\right)\sqrt e-f(0)\right)$ $\cdots$ ㉡'
      criteria:
      - 2.M1
    - id: 2b-2
      content: '$f(0)=0$이므로 $f_1\left(\frac12\right)=\dfrac{\sqrt e}3f\left(\frac12\right)$.'
      criteria:
      - 2.A1
    - id: 2b-3
      content: '$f_n(x)$의 정의에 따라 모든 자연수 $n$에 대해 $f_n(0)=0$이므로 ㉡을 $f_n$에 적용하면 $f_{n+1}\left(\frac12\right)=\dfrac{\sqrt e}3f_n\left(\frac12\right)=\left(\dfrac{\sqrt e}3\right)^{n+1}f\left(\frac12\right)$.'
      criteria:
      - 2.M2
      - 2.R1
    - id: 2b-4
      content: '따라서 $f_n\left(\frac12\right)$은 첫째항 $\dfrac{\sqrt e}3f\left(\frac12\right)$, 공비 $\dfrac{\sqrt e}3$인 등비수열이고, 공비가 1보다 작으므로 급수는 수렴하며 합은 $\displaystyle\sum_{n=1}^\infty f\left(\frac12\right)\left(\dfrac{\sqrt e}3\right)^n=\dfrac{\sqrt e}3f\left(\frac12\right)\cdot\dfrac1{1-\frac{\sqrt e}3}=\dfrac{3\sqrt e}{3-\sqrt e}$.'
      criteria:
      - 2.M3
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: '(1)의 결과(부분적분)를 일반 함수 $f$에 적용해 $f_1\left(\frac12\right)=\dfrac13\left(f\left(\frac12\right)\sqrt e-f(0)\right)$을 얻었다.'
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: '$f_1\left(\frac12\right)=\sqrt e$ (또는 $\dfrac{\sqrt e}3f\left(\frac12\right)$).'
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: '$f_{n+1}\left(\frac12\right)=\dfrac{\sqrt e}3f_n\left(\frac12\right)$을 세웠다.'
      steps:
      - 2b-3
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: '$f_n(0)=0$임을 근거로 들었다.'
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    - id: 2.M3
      mark_type: M
      points: 2
      evidence: '공비 $\dfrac{\sqrt e}3<1$을 확인하고 등비급수의 합 공식을 적용했다.'
      steps:
      - 2b-4
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: '$\dfrac{3\sqrt e}{3-\sqrt e}$.'
      depends_on:
      - 2.M3
      cao: true
      steps:
      - 2b-4
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
