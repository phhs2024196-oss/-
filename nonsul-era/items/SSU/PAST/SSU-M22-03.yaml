    detect_cue: '넓이 식에 $1+r$, $c$가 구간 끝값'
    feedback: '$Q$는 $x<0$ 쪽 곡선 위의 점이므로 $P$와 $Q$의 $x$좌표 차는 $1-r=1+|r|$입니다.'
    remedy:
    - RL-0647
