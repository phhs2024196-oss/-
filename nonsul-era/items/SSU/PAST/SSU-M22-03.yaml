stimuli:
- label: 제시문
  body: |
    함수 $f(x)$의 $x=a$에서의 미분계수 $f'(a)$는 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 기울기와 같다.
    【출처: 수학Ⅱ 「미분계수와 도함수」】
stem: |
  함수 $f(x)$와 $g(x)$가 아래와 같이 주어져 있다.
  $$f(x)=x^2\ (x\ge0)$$
  $$g(x)=-ax^2+c\ (x<0)\quad\left(a,\ c\text{는 상수이고 }a>0,\ \dfrac14<c<\dfrac32\right)$$
  이때 다음 문항에 답하시오.

  (1) 곡선 $y=f(x)$ 위의 점 $P=(1,1)$에 대하여 다음 조건을 만족하는 곡선 $y=g(x)$ 위의 한 점 $Q$를 찾을 수 있을 때 함수 $g(x)$의 계수 $a$와 $c$의 관계식을 구하시오.

  조건 : 곡선 $y=f(x)$ 위의 점 $P=(1,1)$에서의 접선과 $y$축의 교점을 $R$, 곡선 $y=g(x)$ 위의 점 $Q$에서의 접선과 $y$축의 교점을 $S$라고 할 때, 점 $P$, $Q$, $R$, $S$를 지나고 중심이 $y$축 위에 있는 원이 존재한다.

  (2) 점 $P=(1,1)$에 대하여 문항 (1)로부터 주어지는 사각형 $PRQS$의 넓이가 최대가 되도록 하는 함수 $g(x)$의 계수 $a$와 $c$를 구하시오.
subparts:
- id: '1'
  stem: |
    함수 $g(x)$의 계수 $a$와 $c$의 관계식을 구하시오.
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: a*(4*c-1)=1
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$\mathrm{RS}$가 지름이므로 $\mathrm{PS}\perp\mathrm{PR}$, $\mathrm{QR}\perp\mathrm{QS}$. $y$절편 비교: $-1=-ar^2-\dfrac1{2a}+c$, $\dfrac32=ar^2+c$.'
    steps:
    - id: 1a
      content: '두 식에서 $ar^2$ 소거: $-\dfrac1{2a}+c=\dfrac12-c\Rightarrow a(4c-1)=1$'
      criteria:
      - 1.R1
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - '원의 중심과 $R$, $S$가 모두 $y$축 위에 있다면 $RS$는?'
    - '$\angle RPS$와 $\angle SQR$의 크기는?'
    - '네 직선의 $y$절편을 비교하자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.72
    steps:
    - id: 1b-1
      content: '점 $P$, $Q$, $R$, $S$가 모두 한 원 위의 점이고 원의 중심과 $R$, $S$가 $y$축 위에 있으므로 $RS$는 지름이고 $\angle RPS$, $\angle SQR$은 직각이다. 조건을 만족하는 점 $Q$를 $(r,-ar^2+c)\,(r<0)$이라 하자.'
      criteria:
      - 1.R1
    - id: 1b-2
      content: |
        네 직선의 방정식은 다음과 같다.
        직선 $PR$ (점 $P$에서의 접선): $y=2x-1$
        직선 $PS$ (점 $P$에서의 접선에 수직이고 $P$를 지나는 직선): $y=-\dfrac12x+\dfrac32$
        직선 $QS$ (점 $Q$에서의 접선): $y=-2arx+ar^2+c$
        직선 $QR$ (점 $Q$에서의 접선에 수직이고 $Q$를 지나는 직선): $y=\dfrac1{2ar}x-ar^2-\dfrac1{2a}+c$
      criteria:
      - 1.M1
    - id: 1b-3
      content: '[점 $R$의 $y$좌표] = [직선 $PR$의 $y$절편] = [직선 $QR$의 $y$절편], [점 $S$의 $y$좌표] = [직선 $QS$의 $y$절편] = [직선 $PS$의 $y$절편]이므로 $-1=-ar^2-\dfrac1{2a}+c$, 즉 $ar^2=-\dfrac1{2a}+c+1$ $\cdots$ ㉠, $\dfrac32=ar^2+c$, 즉 $ar^2=\dfrac32-c$ $\cdots$ ㉡.'
      criteria:
      - 1.M2
    - id: 1b-4
      content: '㉠, ㉡에서 $-\dfrac1{2a}+c=\dfrac12-c$, 즉 $a(4c-1)=1$ $\cdots$ ㉢. (참고: ㉢과 $a>0$에서 $c>\dfrac14$이고, $c<\dfrac32$이면 ㉡의 $ar^2>0$이므로 이를 만족하는 $r<0$이 존재한다.)'
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: '$RS$가 지름이므로 $\angle RPS=\angle SQR=90^\circ$임을 밝혔다.'
      steps:
      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: '$P$, $Q$에서의 접선과 법선(수직인 직선)의 방정식을 세웠다.'
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: '$R$, $S$의 $y$좌표를 두 가지로 나타내 ㉠, ㉡ 두 식을 세웠다.'
      depends_on:
      - 1.R1
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: '$a(4c-1)=1$ 또는 동치식.'
      depends_on:
      - 1.M2
      cao: true
      steps:
      - 1b-4
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - code: '20'
    meaning: 만점
  - code: '71'
    misconception: MC-GEO-0646
  misconceptions:
  - id: MC-GEO-0646
    outcome_code: '71'
    wrong_work: '원의 중심을 $(0,k)$로 두고 네 점까지의 거리를 직접 같게 놓다가 지름·직각 관계를 쓰지 못해 미완'
    detect_cue: '$k$와 $r$이 남은 채 미완'
    feedback: '$R$, $S$가 $y$축 위에 있고 중심도 $y$축 위이면 $RS$는 지름입니다. 지름에 대한 원주각은 직각입니다.'
    remedy:
    - RL-0646
- id: '2'
  stem: |
    사각형 $PRQS$의 넓이가 최대가 되도록 하는 함수 $g(x)$의 계수 $a$와 $c$를 구하시오.
  points: 15
  depends_on:
  - '1'
  answer:
    kind: set
    value: a=2/5, c=7/8
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$R(0,-1)$, $S\left(0,\frac32\right)$ 고정, 넓이 $\dfrac12\cdot\dfrac52(1-r)$ → $r$ 최소 ⇔ $r^2=\dfrac{(3-2c)(4c-1)}2$ 최대.'
    steps:
    - id: 2a
      content: '$(3-2c)(4c-1)=-8\left(c-\frac78\right)^2+\frac{25}8$, $c=\dfrac78$, $a=\dfrac25$'
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
    hint_ladder:
    - '$R$, $S$의 좌표는 $a,c$와 무관한가?'
    - '사각형을 대각선 $RS$로 나누어 넓이를 쓰자.'
    - '㉡, ㉢에서 $r^2$을 $c$의 식으로.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.73
    steps:
    - id: 2b-1
      content: '$P=(1,1)$, $Q=(r,-ar^2+c)$일 때 $R=(0,-1)$, $S=\left(0,\dfrac32\right)$이다. 따라서 사각형 $PRQS$의 넓이는 $\dfrac12\cdot\dfrac52\cdot(1-r)$이므로, 점 $Q$의 $x$좌표 $r$이 가장 작을 때 넓이가 최대이다.'
      criteria:
      - 2.M1
    - id: 2b-2
      content: '식 ㉡, ㉢으로부터 $r^2=\dfrac{3-2c}{2a}=\dfrac{(3-2c)(4c-1)}2$이므로 $r=-\sqrt{\dfrac{(3-2c)(4c-1)}2}\ \left(\dfrac14<c<\dfrac32\right)$.'
      criteria:
      - 2.M2
    - id: 2b-3
      content: '따라서 $(3-2c)(4c-1)$이 최댓값을 가질 때 $r$은 최솟값을 갖는다. $(3-2c)(4c-1)=-8\left(c-\dfrac78\right)^2+\dfrac{25}8$은 $c=\dfrac78$일 때 최대이고, ㉢으로부터 $a=\dfrac25$. 따라서 $a=\dfrac25$, $c=\dfrac78$.'
      criteria:
      - 2.M3
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: '$R$, $S$의 좌표를 구하고 넓이를 $\dfrac54(1-r)$ 등 $r$의 식으로 나타내 $r$ 최소 조건으로 바꿨다.'
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: '$r^2=\dfrac{(3-2c)(4c-1)}2$ (또는 동치식)을 얻었다.'
      depends_on:
      - 1.A1
      steps:
      - 2b-2
    - id: 2.M3
      mark_type: M
      points: 3
      evidence: '이차식 $(3-2c)(4c-1)$의 최댓값을 완전제곱 등으로 구했다.'
      steps:
      - 2b-3
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: '$a=\dfrac25$, $c=\dfrac78$.'
      depends_on:
      - 2.M2
      - 2.M3
      cao: true
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
