stimuli:
- label: 제시문
  body: |
    삼각형 $ABC$의 외접원의 반지름의 길이를 $R$라고 하면
    $$\dfrac a{\sin A}=\dfrac b{\sin B}=\dfrac c{\sin C}=2R$$
    [그림 설명] 중심이 $O$인 원에 삼각형 $ABC$가 내접하고, $\overline{BC}=a$, $\overline{CA}=b$, $\overline{AB}=c$, $\overline{OC}=R$로 표시되어 있다.
    【출처: 수학Ⅰ 「사인법칙과 코사인법칙」】
stem: |
  〈그림 1〉과 같이 삼각형 $ABC$에서 $\angle BAC$의 이등분선이 변 $BC$와 만나는 점을 $P$라고 하고, 점 $P$를 지나고 직선 $AB$에 평행한 직선이 변 $AC$와 만나는 점을 $Q$라고 하자. 또한, $\angle PQC$의 이등분선이 변 $BC$와 만나는 점을 $R$라고 하고, 점 $R$를 지나고 직선 $PQ$에 평행한 직선이 변 $AC$와 만나는 점을 $S$라고 하자.

  [그림 설명] 〈그림 1〉: 밑변 $BC$가 수평인 삼각형 $ABC$($A$가 위). $A$에서 $BC$ 위의 점 $P$로 각의 이등분선, $P$에서 $AB$에 평행하게 $AC$ 위의 점 $Q$로 선분, $Q$에서 $\angle PQC$의 이등분선이 $BC$ 위의 점 $R$로, $R$에서 $PQ$에 평행하게 $AC$ 위의 점 $S$로 선분이 그려져 있다. 변 $BC$ 위의 순서는 $B$, $P$, $R$, $C$이고 변 $AC$ 위의 순서는 $A$, $Q$, $S$, $C$이다.

  이때 다음 문항에 답하시오.

  (1) 사인법칙을 이용하여 $\overline{AB}:\overline{AC}=\overline{BP}:\overline{PC}$가 성립함을 보이시오.

  (2) $\overline{AB}=4$, $\overline{BC}=5$이고 삼각형 $ABP$와 삼각형 $QRS$의 넓이의 비가 $27:1$일 때, 삼각형 $ABC$의 넓이를 구하시오.
