- id: '2'
  stem: |
    $\overline{AB}=4$, $\overline{BC}=5$이고 삼각형 $ABP$와 삼각형 $QRS$의 넓이의 비가 $27:1$일 때, 삼각형 $ABC$의 넓이를 구하시오.
  points: 12
  depends_on:
  - '1'
  answer:
    kind: value
    value: sqrt(231)/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$\overline{AC}=b$; $\triangle ABC\sim\triangle QPC$의 닮음비 $\dfrac{4+b}b$. 넓이비 $ABP:APQ:QPR:QRS$가 모두 $\dfrac{4+b}b$ ⇒ $\left(\dfrac{4+b}b\right)^3=27$, $b=2$.'
    steps:
    - id: 2a
      content: '$\cos B=\dfrac{37}{40}$, 넓이 $\dfrac12\cdot4\cdot5\cdot\dfrac{\sqrt{231}}{40}=\dfrac{\sqrt{231}}4$'
      criteria:
      - 2.M1
      - 2.M2
      - 2.R1
      - 2.A1
      - 2.M3
      - 2.A2
    hint_ladder:
    - '(1)에서 $\overline{BP}:\overline{PC}$는?'
    - '$AB\parallel QP$이면 $\triangle ABP$와 $\triangle APQ$의 높이는?'
    - '$\angle PQC=\angle BAC$이므로 $QR\parallel AP$이다.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.74~75
    steps:
    - id: 2b-1
      content: '$\overline{AC}=b$로 두면 $\overline{AB}=4$이므로 (1)의 비례식에서 $\overline{BP}:\overline{PC}=4:b$. 두 삼각형 $ABC$와 $QPC$는 닮음이고 닮음비는 $\overline{BC}:\overline{PC}=(4+b):b$이다.'
      criteria:
      - 2.M1
    - id: 2b-2
      content: '$\overline{AB}\parallel\overline{QP}$이므로 두 삼각형 $ABP$, $APQ$의 넓이의 비는 $\overline{AB}:\overline{QP}$와 같고, 이는 닮음비 $\dfrac{4+b}b:1$이다.'
      criteria:
      - 2.M2
    - id: 2b-3
      content: '$\overline{AB}\parallel\overline{QP}$이고 $\overline{AP}$, $\overline{QR}$은 각각 $\angle BAC$, $\angle PQC$의 이등분선이므로 $\overline{AP}\parallel\overline{QR}$. 마찬가지로 $\triangle APQ:\triangle QPR=\overline{AP}:\overline{QR}=\dfrac{4+b}b:1$ ($\triangle APC\sim\triangle QRC$), $\triangle QPR:\triangle QRS=\overline{QP}:\overline{SR}=\dfrac{4+b}b:1$.'
      criteria:
      - 2.R1
    - id: 2b-4
      content: '따라서 $\triangle ABP:\triangle QRS=\left(\dfrac{4+b}b\right)^3:1=27:1$이므로 $\dfrac{4+b}b=3$, $b=2$.'
      criteria:
      - 2.A1
    - id: 2b-5
      content: '$\angle B=\theta$라 하면 코사인법칙에 의해 $\cos\theta=\dfrac{4^2+5^2-2^2}{2\times4\times5}=\dfrac{37}{40}$, $0<\theta<\pi$에서 $\sin\theta=\dfrac{\sqrt{231}}{40}$. 따라서 삼각형 $ABC$의 넓이는 $\dfrac12\times4\times5\times\dfrac{\sqrt{231}}{40}=\dfrac{\sqrt{231}}4$.'
      criteria:
      - 2.M3
      - 2.A2
