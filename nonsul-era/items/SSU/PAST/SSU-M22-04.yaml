    key_idea: '$\theta_1=\angle BAP=\angle PAC$, $\theta_2=\angle BPA$로 두고 $\triangle ABP$, $\triangle APC$에 사인법칙.'
    steps:
    - id: 1a
      content: '$\dfrac{\overline{AB}}{\sin\theta_2}=\dfrac{\overline{BP}}{\sin\theta_1}$, $\dfrac{\overline{AC}}{\sin\theta_2}=\dfrac{\overline{PC}}{\sin\theta_1}$ ⇒ 비례식'
      criteria:
      - 1.M1
      - 1.R1
      - 1.A1
    hint_ladder:
    - '$\angle APC$와 $\angle BPA$의 관계는?'
    - '$\sin(\pi-\theta)=\sin\theta$'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.74
    steps:
    - id: 1b-1
      content: '〈그림 1〉에서 $\theta_1=\angle BAP=\angle PAC$, $\theta_2=\angle BPA$라 하자. 두 삼각형 $ABP$와 $APC$에 사인법칙을 적용하면 $\dfrac{\overline{AB}}{\sin\theta_2}=\dfrac{\overline{BP}}{\sin\theta_1}$ $\cdots$ ㉠, $\dfrac{\overline{AC}}{\sin(\pi-\theta_2)}=\dfrac{\overline{PC}}{\sin\theta_1}$ $\cdots$ ㉡.'
      criteria:
      - 1.M1
    - id: 1b-2
      content: '㉡에서 $\sin(\pi-\theta_2)=\sin\theta_2$이므로 $\dfrac{\overline{AC}}{\sin\theta_2}=\dfrac{\overline{PC}}{\sin\theta_1}$ $\cdots$ ㉢.'
      criteria:
      - 1.R1
    - id: 1b-3
      content: '㉠과 ㉢으로부터 $\dfrac{\sin\theta_1}{\sin\theta_2}=\dfrac{\overline{BP}}{\overline{AB}}=\dfrac{\overline{PC}}{\overline{AC}}$이고, 따라서 $\overline{AB}:\overline{AC}=\overline{BP}:\overline{PC}$가 성립한다. ■'
      criteria:
      - 1.A1
