      points: 1
      evidence: '$\left(\dfrac{4+b}b\right)^3=27$에서 $b=2$.'
      depends_on:
      - 2.R1
      steps:
      - 2b-4
    - id: 2.M3
      mark_type: M
      points: 2
      evidence: '코사인법칙으로 $\cos B$(또는 다른 각)를 구해 넓이를 계산했다.'
      steps:
      - 2b-5
    - id: 2.A2
      mark_type: A
      points: 1
      evidence: '$\dfrac{\sqrt{231}}4$.'
      depends_on:
      - 2.M3
      cao: true
      steps:
      - 2b-5
