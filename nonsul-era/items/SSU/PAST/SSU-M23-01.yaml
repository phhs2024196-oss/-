      depends_on:
      - 1.M1
      steps:
      - 1b-5
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: '$\lim\dfrac{\tan(\theta/2)}{\theta}=\dfrac12$ 등을 이용해 극한값 $\dfrac14$를 얻었다.'
      depends_on:
      - 1.M3
      cao: true
