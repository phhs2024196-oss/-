stimuli: []
stem: |
  원 $\mathrm{C}$와 원 $\mathrm{C'}$이 다음 조건을 만족시킨다. (그림 1 참조)

  (i) 원 $\mathrm{C}$는 반직선 $\mathrm{OX}$ 및 반직선 $\mathrm{OP}$와 접하고 있으며, 반직선 $\mathrm{OX}$ 위에서 접하는 점 $\mathrm{A}$에 대하여 $\overline{\mathrm{OA}}=1$이다.

  (ii) 원 $\mathrm{C'}$은 반직선 $\mathrm{OX}$ 및 반직선 $\mathrm{OP}$와 접하고 있으며, 원 $\mathrm{C}$와 한 점에서 만난다.

  (iii) 원 $\mathrm{C'}$의 반지름은 원 $\mathrm{C}$의 반지름보다 작다.

  [그림 설명] 〈그림 1〉: 점 $\mathrm{O}$에서 오른쪽으로 반직선 $\mathrm{OX}$, 그 위쪽으로 각 $\theta$를 이루며 반직선 $\mathrm{OP}$가 그려져 있다. 두 반직선 사이에 큰 원(중심 $\mathrm{D}$)과 그보다 $\mathrm{O}$에 가까운 작은 원(중심 $\mathrm{D'}$)이 서로 접해 있고, 큰 원은 $\mathrm{OX}$와 점 $\mathrm{A}$에서 접한다. 선분 $\mathrm{DA}$($\mathrm{OX}$에 수직), $\mathrm{D'D}$, $\mathrm{D'A}$가 그려져 삼각형 $\mathrm{D'AD}$를 이룬다.

  두 반직선 $\mathrm{OX}$와 $\mathrm{OP}$가 이루는 $\angle\mathrm{XOP}$의 크기를 $\theta$라고 하자. (단, $0<\theta<\pi$)

  원 $\mathrm{C}$와 원 $\mathrm{C'}$의 중심을 각각 $\mathrm{D}$, $\mathrm{D'}$이라고 하고 삼각형 $\mathrm{D'AD}$의 넓이를 $S(\theta)$라고 할 때, $\displaystyle\lim_{\theta\to0+}\dfrac{S(\theta)}{\theta^2}$의 값을 구하시오.
subparts:
- id: '1'
  stem: |
    $\displaystyle\lim_{\theta\to0+}\dfrac{S(\theta)}{\theta^2}$의 값을 구하시오.
  points: 25
  depends_on: []
  answer:
    kind: value
    value: 1/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$S=\dfrac12\left(\tan\dfrac\theta2-r\right)$, 닮음으로 $r$을 구해 $S=\dfrac{\tan^2\frac\theta2}{\sec\frac\theta2+\tan\frac\theta2}$, 극한 $\dfrac14$.'
    steps:
    - id: 1a
      content: '$R=\tan\frac\theta2$, $\tan\frac\theta2:r=\sec\frac\theta2:\left(\sec\frac\theta2-\tan\frac\theta2-r\right)$, $\lim\dfrac{S}{\theta^2}=\dfrac12\cdot\dfrac12\cdot1=\dfrac14$'
      criteria:
      - 1.B1
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.M3
      - 1.A2
    hint_ladder:
    - '원 $\mathrm{C}$의 중심은 $\angle\mathrm{XOP}$의 이등분선 위에 있다. 반지름은?'
    - '삼각형 $\mathrm{D''AD}$를 $\triangle\mathrm{OAD}-\triangle\mathrm{OAD''}$로 보자.'
    - '$\triangle\mathrm{OAD}$와 $\triangle\mathrm{OA''D''}$의 닮음비로 $r$을 구하자.'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.49~50
    steps:
    - id: 1b-1
      content: '원 $\mathrm{C}$의 중심 $\mathrm{D}$는 $\angle\mathrm{XOP}$의 이등분선 위에 있으므로 삼각형 $\mathrm{OAD}$는 $\angle\mathrm{OAD}=90^\circ$, $\overline{\mathrm{OA}}=1$, $\angle\mathrm{AOD}=\dfrac\theta2$인 직각삼각형이다. 따라서 원 $\mathrm{C}$의 반지름은 $\overline{\mathrm{AD}}=\tan\dfrac\theta2$.'
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        원 $\mathrm{C'}$의 반지름을 $r$이라 하자. $\mathrm{D'}$도 이등분선 $\mathrm{OD}$ 위에 있으므로 $\triangle\mathrm{D'AD}=\triangle\mathrm{OAD}-\triangle\mathrm{OAD'}$이고, $\triangle\mathrm{OAD}=\dfrac12\cdot1\cdot\tan\dfrac\theta2$, $\triangle\mathrm{OAD'}=\dfrac12\cdot\overline{\mathrm{OA}}\cdot r=\dfrac12r$이다. 따라서
        $$S(\theta)=\dfrac12\left(\tan\dfrac\theta2-r\right)\quad\cdots\ \text{①}$$
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        원 $\mathrm{C'}$과 반직선 $\mathrm{OX}$의 접점을 $\mathrm{A'}$이라 하면 $\triangle\mathrm{OAD}\sim\triangle\mathrm{OA'D'}$이므로 $\overline{\mathrm{AD}}:\overline{\mathrm{A'D'}}=\overline{\mathrm{OD}}:\overline{\mathrm{OD'}}$. 두 원이 외접하므로 $\overline{\mathrm{OD'}}=\overline{\mathrm{OD}}-\left(\tan\dfrac\theta2+r\right)$이고 $\overline{\mathrm{OD}}=\sec\dfrac\theta2$. 즉
        $$\tan\dfrac\theta2:r=\sec\dfrac\theta2:\left(\sec\dfrac\theta2-\tan\dfrac\theta2-r\right)$$
      criteria:
      - 1.M2
    - id: 1b-4
      content: '이를 풀면 $r=\dfrac{\tan\frac\theta2\sec\frac\theta2-\tan^2\frac\theta2}{\sec\frac\theta2+\tan\frac\theta2}\quad\cdots\ \text{②}$.'
      criteria:
      - 1.A1
    - id: 1b-5
      content: |
        ②를 ①에 대입하면
        $$S(\theta)=\dfrac12\tan\dfrac\theta2\left(1-\dfrac{\sec\frac\theta2-\tan\frac\theta2}{\sec\frac\theta2+\tan\frac\theta2}\right)=\dfrac{\tan^2\frac\theta2}{\sec\frac\theta2+\tan\frac\theta2}$$
      criteria:
      - 1.M3
    - id: 1b-6
      content: '$\displaystyle\lim_{\theta\to0+}\dfrac{S(\theta)}{\theta^2}=\lim_{\theta\to0+}\dfrac{\tan\frac\theta2}{\theta}\cdot\dfrac{\tan\frac\theta2}{\theta}\cdot\dfrac1{\sec\frac\theta2+\tan\frac\theta2}$이고 $\displaystyle\lim_{\theta\to0+}\dfrac{\tan\frac\theta2}{\theta}=\dfrac12$, $\displaystyle\lim_{\theta\to0+}\sec\dfrac\theta2=1$, $\displaystyle\lim_{\theta\to0+}\tan\dfrac\theta2=0$이므로 구하는 값은 $\dfrac12\cdot\dfrac12\cdot1=\dfrac14$.'
      criteria:
      - 1.A2
