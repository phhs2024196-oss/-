stimuli:
- label: 제시문
  body: |
    함수 $f(x)$의 $x=a$에서의 미분계수 $f'(a)$는 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 기울기와 같다.
    【출처: 수학Ⅱ 「미분계수와 도함수」】
stem: |
  구간 $(0,\infty)$에서 미분가능한 함수 $f(x)$가 다음과 같이 정의되어 있다. (단, $a,b,c,d$는 실수이고 $a\ne0$)
  $$f(x)=\begin{cases}x^2-1 & (0<x<2)\\ ax^3+bx^2+cx+d & (x\ge2)\end{cases}$$
  함수 $y=f(x)$의 그래프는 $x$축과 서로 다른 두 점에서 만나고, 함수 $f(x)$는 $x=5$에서 극솟값을 가진다.
  이때 다음 문항에 답하시오.

  (1) 실수 $a,b,c,d$의 값을 구하시오.

  (2) 곡선 $y=f(x)$ 위의 점 $(x,f(x))$에서의 접선과 수직이면서 점 $(x,f(x))$를 지나는 직선의 $x$절편의 최솟값을 구하시오. (단, $0<x<\dfrac83$)
subparts:
- id: '1'
  stem: |
    실수 $a,b,c,d$의 값을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: set
    value: a=2/3, b=-23/3, c=80/3, d=-25
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$x\ge2$ 부분은 $x=5$에서 $x$축에 접한다: $f(x)=\alpha(x-\beta)(x-5)^2$, $f(2)=3$, $f''(2)=4$.'
    steps:
    - id: 1a
      content: '$9\alpha(2-\beta)=3$, $\alpha(9-6(2-\beta))=4\Rightarrow\alpha=\dfrac23,\ \beta=\dfrac32$'
      criteria:
      - 1.R1
      - 1.M1
      - 1.M2
      - 1.A1
    hint_ladder:
    - '$0<x<2$에서 $x$축과 만나는 점은 몇 개인가?'
    - '$x\ge2$ 부분이 $x$축과 한 점에서만 만나고 $x=5$에서 극소이면 그 점은?'
    - '$x=2$에서 미분가능하려면 어떤 두 식이 필요한가?'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.51
    steps:
    - id: 1b-1
      content: |
        $0<x<2$에서 $f(x)=x^2-1$은 $x$축과 점 $(1,0)$ 한 곳에서 만나므로, $x\ge2$에서 $f(x)$는 $x$축과 오직 한 점에서만 만나야 한다. $f$는 $x=5$에서 극솟값을 가지므로 $x=5$에서 $x$축에 접해야 하고
        $$f(x)=\alpha(x-\beta)(x-5)^2\quad(x\ge2)$$
        로 나타낼 수 있다. (보충: $f'(2)>0$이므로 $a<0$이면 $x=5$가 극소일 수 없고, $a>0$이면 $f(2)>0$에서 증가→극대→$x=5$ 극소→증가이므로 $f(5)<0$이면 교점 2개, $f(5)>0$이면 0개가 되어 $f(5)=0$이어야 한다.)
      criteria:
      - 1.R1
    - id: 1b-2
      content: |
        $f$는 $(0,2)$와 $(2,\infty)$에서 미분가능하므로 $x=2$에서 미분가능하면 된다. 미분가능하면 연속이므로
        $$f(2)=\alpha(2-\beta)(2-5)^2=3\quad\cdots\ \text{㉡}$$
        이고, 좌우 미분계수가 같아야 하므로
        $$f'(2)=\alpha(2-5)(3\cdot2-2\beta-5)=4\quad\cdots\ \text{㉠}$$
      criteria:
      - 1.M1
      - 1.M2
    - id: 1b-3
      content: |
        ㉠, ㉡을 연립하면 $\alpha=\dfrac23$, $\beta=\dfrac32$. 따라서 $x\ge2$에서
        $$f(x)=\dfrac23\left(x-\dfrac32\right)(x-5)^2=\dfrac23x^3-\dfrac{23}3x^2+\dfrac{80}3x-25$$
        이므로 $a=\dfrac23$, $b=-\dfrac{23}3$, $c=\dfrac{80}3$, $d=-25$.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.R1
      mark_type: R
      points: 4
      evidence: '$x\ge2$ 부분이 $x=5$에서 $x$축에 접함(중근)을 근거와 함께 밝혀 $\alpha(x-\beta)(x-5)^2$ 꼴로 놓았다.'
      steps:
      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: '$x=2$에서의 연속 조건 $f(2)=3$을 식으로 썼다.'
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: '$x=2$에서의 미분계수 조건 $f''(2)=4$를 식으로 썼다.'
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: '$a=\dfrac23,\ b=-\dfrac{23}3,\ c=\dfrac{80}3,\ d=-25$.'
      depends_on:
      - 1.M1
      - 1.M2
      - 1.R1
      steps:
      - 1b-3
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
