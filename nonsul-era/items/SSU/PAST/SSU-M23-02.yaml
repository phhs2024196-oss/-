  misconceptions:
  - id: MC-CAL-0612
    outcome_code: '71'
    wrong_work: '미분가능 조건으로 $f''(2)=4$만 쓰고 연속 조건 $f(2)=3$을 빠뜨림'
    detect_cue: 미지수 수보다 식이 부족하여 답이 정해지지 않음
    feedback: 미분가능하면 연속입니다. 연결점에서 함숫값과 미분계수를 모두 맞추세요.
    remedy:
    - RL-0612
  - id: MC-CAL-0613
    outcome_code: '72'
    wrong_work: '$x\ge2$ 부분이 $x$축과 만나는 점이 두 개라고 보고 $f(5)<0$으로 둠'
    detect_cue: '$f(5)=0$을 쓰지 않음'
    feedback: '$(0,2)$에서 이미 $x=1$에서 만나므로 $x\ge2$에서는 한 점뿐이고, 극소점에서 접해야 합니다.'
    remedy:
    - RL-0613
- id: '2'
  stem: |
    점 $(x,f(x))$에서의 접선과 수직이면서 그 점을 지나는 직선의 $x$절편의 최솟값을 구하시오. (단, $0<x<\dfrac83$)
  points: 13
  depends_on:
  - '1'
  answer:
    kind: value
    value: -sqrt(6)/9
    equivalents:
    - -2/(3*sqrt(6))
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '$x\ge2$ 부분에서는 $x$절편이 2보다 크므로 $0<t<2$만 보면 되고, $x$절편 $g(t)=2t^3-t$의 최솟값은 $g\left(\dfrac1{\sqrt6}\right)$.'
    steps:
    - id: 2a
      content: '$y=-\dfrac1{2t}(x-t)+t^2-1$, $g(t)=2t^3-t$, $g''(t)=6t^2-1$, 최솟값 $-\dfrac{2}{3\sqrt6}$'
      criteria:
      - 2.R1
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.A2
    hint_ladder:
    - '(1)의 $f''(x)$로 $x\ge2$에서의 증감을 보자. $\dfrac83$은 무엇인가?'
    - '$0<t<2$에서 법선의 방정식을 쓰고 $y=0$을 대입하자.'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.51~52
    steps:
    - id: 2b-1
      content: '$x\ge2$에서 $f''(x)=\dfrac23(x-5)^2+\dfrac43\left(x-\dfrac32\right)(x-5)=\dfrac23(x-5)(3x-8)$이므로 $x=\dfrac83$에서 극댓값, $x=5$에서 극솟값을 갖는다. 주어진 구간 $\left(0,\dfrac83\right)$은 0부터 극대점까지이다. $2\le t<\dfrac83$에서는 $f(t)>0$, $f''(t)>0$이므로 법선의 $x$절편 $t+f(t)f''(t)$는 $2$보다 크고, 최솟값은 이차함수 구간 $0<t<2$에서 찾으면 된다.'
      criteria:
      - 2.R1
    - id: 2b-2
      content: |
        $0<t<2$에서 점 $(t,f(t))$에서의 접선의 기울기는 $f'(t)=2t$이므로, 접선과 수직이면서 이 점을 지나는 직선은
        $$y=-\dfrac1{2t}(x-t)+t^2-1$$
        이고 $y=0$을 대입하면 $x$절편은 $g(t)=2t^3-t\ (0<t<2)$.
      criteria:
      - 2.M1
      - 2.A1
    - id: 2b-3
      content: '$g''(t)=6t^2-1$이므로 $0<t<\dfrac1{\sqrt6}$에서 감소, $\dfrac1{\sqrt6}<t<2$에서 증가한다. 따라서 최솟값은 $g\left(\dfrac1{\sqrt6}\right)=\dfrac{2}{6\sqrt6}-\dfrac1{\sqrt6}=-\dfrac{2}{3\sqrt6}\left(=-\dfrac{\sqrt6}9\right)$.'
      criteria:
      - 2.M2
      - 2.A2
