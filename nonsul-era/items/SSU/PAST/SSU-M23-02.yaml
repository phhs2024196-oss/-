    - id: 2.R1
      mark_type: R
      points: 3
      evidence: '$x\ge2$ 부분($2\le x<\dfrac83$)에서는 $x$절편이 최소가 될 수 없음(또는 그 구간의 $x$절편 범위)을 밝혔다.'
      steps:
      - 2b-1
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: '접선에 수직인 직선(법선)의 방정식을 기울기 $-\dfrac1{2t}$로 세웠다.'
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: '$x$절편 $2t^3-t$를 얻었다.'
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: '$x$절편 함수를 미분하여 증감을 조사했다.'
      steps:
      - 2b-3
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: '최솟값 $-\dfrac{2}{3\sqrt6}$ (또는 $-\dfrac{\sqrt6}9$).'
      depends_on:
      - 2.M2
      cao: true
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
