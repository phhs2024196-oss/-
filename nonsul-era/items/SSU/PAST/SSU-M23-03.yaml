stimuli:
- label: 제시문1
  body: |
    이차방정식 $ax^2+bx+c=0\,(a\ne0)$의 두 근을 $\alpha$, $\beta$라고 하면, 다음의 식이 성립한다.
    $$\alpha+\beta=-\dfrac ba,\quad\alpha\beta=\dfrac ca$$
    【출처: 수학 「이차방정식의 근과 계수의 관계」】
- label: 제시문2
  body: |
    좌표평면에서 두 직선이 $x$축의 양의 방향과 이루는 각의 크기를 각각 $\alpha$, $\beta\,(\alpha>\beta)$라고 할 때, 두 직선이 이루는 예각의 크기를 $\theta\,(=\alpha-\beta)$라고 하면 다음 식이 성립한다.
    $$\tan\theta=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$$
    【출처: 미적분 「두 직선이 이루는 예각의 크기」】
stem: |
  점 $\mathrm{P}(a,b)$를 지나고 곡선 $y=x^2$에 접하는 직선이 두 개가 존재한다고 하자. 두 접선이 곡선 $y=x^2$과 만나는 점을 각각 $\mathrm{A}$와 $\mathrm{B}$라고 할 때, 두 접선의 사잇각 $\mathrm{APB}$가 $\dfrac\pi3$라고 하자.

  (1) $a$와 $b$의 관계식을 구하시오.

  (2) 두 접선과 곡선 $y=x^2$으로 둘러싸인 도형의 넓이를 $b$에 관한 식으로 나타내시오. (단, $b<-\dfrac12$)
subparts:
- id: '1'
  stem: |
    $a$와 $b$의 관계식을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 16*a**2-48*b**2-40*b-3=0
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '접점 $x$좌표는 $x^2-2ax+b=0$의 두 근 $\alpha,\beta$, $\sqrt3=\left|\dfrac{2\alpha-2\beta}{1+4\alpha\beta}\right|$를 제곱해 근과 계수의 관계 적용.'
    steps:
    - id: 1a
      content: '$4(4a^2-4b)=3(1+4b)^2\iff16a^2-48b^2-40b-3=0$'
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
    hint_ladder:
    - '접점을 $(x,x^2)$로 두고 기울기를 두 가지로 나타내 보자.'
    - '두 기울기 $2\alpha,2\beta$에 제시문 2를 적용하자.'
    - '$(\alpha-\beta)^2=(\alpha+\beta)^2-4\alpha\beta$'
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.53
    steps:
    - id: 1b-1
      content: |
        접점을 $\mathrm{Q}(x,x^2)$이라 하면 접선의 기울기는 $\mathrm{P}$, $\mathrm{Q}$를 지나는 직선의 기울기 $\dfrac{x^2-b}{x-a}$와 접선의 기울기 $2x$로 두 번 나타낼 수 있고, 이 둘이 같으므로
        $$\dfrac{x^2-b}{x-a}=2x\ \Rightarrow\ x^2-2ax+b=0$$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이 이차방정식의 두 근을 $\alpha$, $\beta$라 하면 두 접선의 기울기는 $2\alpha$, $2\beta$이다. 두 접선이 $x$축의 양의 방향과 이루는 각을 $\theta_1,\theta_2$라 하면 $|\theta_1-\theta_2|=\dfrac\pi3$이므로 제시문에 의해
        $$\sqrt3=\tan\dfrac\pi3=\left|\dfrac{\tan\theta_1-\tan\theta_2}{1+\tan\theta_1\tan\theta_2}\right|=\left|\dfrac{2\alpha-2\beta}{1+4\alpha\beta}\right|$$
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        양변을 제곱하고 근과 계수의 관계 $\alpha+\beta=2a$, $\alpha\beta=b$를 적용하면
        $$4\{(\alpha+\beta)^2-4\alpha\beta\}=3(1+4\alpha\beta)^2,\quad 4(4a^2-4b)=3(1+4b)^2$$
        따라서 $16a^2-48b^2-40b-3=0$.
      criteria:
      - 1.M3
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
