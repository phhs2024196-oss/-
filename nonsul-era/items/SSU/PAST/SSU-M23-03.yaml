      points: 3
      evidence: '두 접선의 기울기 $2\alpha,2\beta$에 탄젠트 공식을 적용해 $\sqrt3=\left|\dfrac{2(\alpha-\beta)}{1+4\alpha\beta}\right|$ 또는 동치식을 썼다.'
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: '근과 계수의 관계로 $\alpha,\beta$를 소거했다.'
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: '$16a^2-48b^2-40b-3=0$ 또는 동치식.'
      depends_on:
      - 1.M3
      steps:
      - 1b-3
    deductions:
