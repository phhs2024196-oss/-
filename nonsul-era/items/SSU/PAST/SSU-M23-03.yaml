  misconceptions:
  - id: MC-ALG-0616
    outcome_code: '71'
    wrong_work: '$\tan\dfrac\pi3=\dfrac1{\sqrt3}$ 또는 $\tan\dfrac\pi3$ 대신 $\cos$ 값을 씀'
    detect_cue: '관계식의 계수가 $3$ 대신 $\dfrac13$ 등'
    feedback: '$\tan\dfrac\pi3=\sqrt3$입니다. 특수각의 삼각비를 확인하세요.'
    remedy:
    - RL-0616
  - id: MC-ALG-0617
    outcome_code: '72'
    wrong_work: '$(\alpha-\beta)^2=(\alpha+\beta)^2-2\alpha\beta$로 계산'
    detect_cue: '$4a^2-2b$가 나타남'
    feedback: '$(\alpha-\beta)^2=(\alpha+\beta)^2-4\alpha\beta$입니다.'
    remedy:
    - RL-0617
- id: '2'
  stem: |
    두 접선과 곡선 $y=x^2$으로 둘러싸인 도형의 넓이를 $b$에 관한 식으로 나타내시오. (단, $b<-\dfrac12$)
  points: 10
  depends_on:
  - '1'
  answer:
    kind: expression
    value: -sqrt(3)*(4*b+1)**3/32
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '넓이 $S=\dfrac23(a^2-b)^{3/2}$에 (1)의 $a^2=\dfrac{48b^2+40b+3}{16}$을 대입하면 $a^2-b=\dfrac{3(4b+1)^2}{16}$.'
    steps:
    - id: 2a
      content: '$S=\dfrac23\left(\dfrac{3(4b+1)^2}{16}\right)^{3/2}=-\dfrac{\sqrt3(4b+1)^3}{32}$'
      criteria:
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.M3
      - 2.A2
    hint_ladder:
    - '두 접선은 $y=2\alpha(x-a)+b$, $y=2\beta(x-a)+b$이다. $x=a$에서 적분 구간을 나누자.'
    - '$\alpha-\beta$, $\alpha^2-\beta^2$, $\alpha^3-\beta^3$을 $\sqrt{a^2-b}$로 나타내자.'
    - '$b<-\dfrac12$이면 $4b+1$의 부호는?'
  - id: S2-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.53~54
    steps:
    - id: 2b-1
      content: |
        $x^2-2ax+b=0$의 두 근을 $\alpha,\beta\,(\alpha<\beta)$라 하면 두 접선은 $y=2\alpha(x-a)+b$, $y=2\beta(x-a)+b$이고, 넓이는
        $$S=\int_\alpha^a\left(x^2-2\alpha x+2a\alpha-b\right)dx+\int_a^\beta\left(x^2-2\beta x+2a\beta-b\right)dx$$
        $$=\dfrac23(\alpha^3-\beta^3)-2a(\alpha^2-\beta^2)+(a^2+b)(\alpha-\beta)$$
      criteria:
      - 2.M1
      - 2.A1
    - id: 2b-2
      content: |
        $\alpha+\beta=2a$, $\alpha\beta=b$에서 $\alpha-\beta=-2\sqrt{a^2-b}$, $\alpha^2-\beta^2=-4a\sqrt{a^2-b}$, $\alpha^3-\beta^3=-2\sqrt{a^2-b}\,(4a^2-b)$이므로
        $$S=\sqrt{a^2-b}\left\{\dfrac43(b-4a^2)+8a^2-2(a^2+b)\right\}=\dfrac23(a^2-b)^{\frac32}$$
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        (1)의 관계식에서 $a^2=\dfrac{48b^2+40b+3}{16}$이므로 $a^2-b=\dfrac{48b^2+24b+3}{16}=\dfrac{3(4b+1)^2}{16}$. $b<-\dfrac12$에서 $4b+1<0$이므로
        $$S=\dfrac23\left(\dfrac{3(4b+1)^2}{16}\right)^{\frac32}=-\dfrac{\sqrt3\,(4b+1)^3}{32}$$
      criteria:
      - 2.M3
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: '두 접선의 방정식을 쓰고 $x=a$에서 나누어 넓이를 정적분 식으로 세웠다.'
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: '적분을 계산해 $\alpha,\beta,a,b$의 식으로 정리했다.'
      depends_on:
      - 2.M1
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: '근과 계수의 관계로 넓이를 $\dfrac23(a^2-b)^{3/2}$로 정리했다.'
      steps:
      - 2b-2
    - id: 2.M3
      mark_type: M
      points: 1
      evidence: '(1)의 관계식을 대입해 $a^2-b$를 $b$의 식으로 바꿨다.'
      depends_on:
      - 1.A1
      steps:
      - 2b-3
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: '$4b+1<0$을 고려하여 $-\dfrac{\sqrt3(4b+1)^3}{32}$를 얻었다.'
      depends_on:
      - 2.M3
      cao: true
      steps:
      - 2b-3
    deductions:
    - code: D2-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
