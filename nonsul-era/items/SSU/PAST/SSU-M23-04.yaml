stimuli:
- label: 제시문
  body: |
    물탱크는 물을 저장하는 용기이다. 급수관을 통하여 물탱크에 물을 채워 넣고, 배수관을 통하여 저장된 물탱크의 물을 밖으로 빼낼 수 있다. 물탱크의 급수/배수량을 조절하기 위하여 펌프를 급수/배수관에 설치한다. 급수 및 배수 속도는 급수관과 배수관에 설치하는 펌프에 따라 달라질 수 있다.
    [그림 설명] 펌프가 달린 급수관이 물탱크 위쪽으로 물을 넣고(화살표 →), 물탱크 아래쪽의 배수관이 펌프를 거쳐 물을 밖으로 빼내는(화살표 ←) 그림.
stem: |
  용량이 5 리터(liter)인 물탱크가 있다. 물탱크에는 급수관과 배수관이 각각 한 개씩 존재한다. 아래에 주어진 세 개의 펌프 중 두 개를 골라서 그 중 한 개를 급수관에, 나머지 한 개를 배수관에 설치한다.

  펌프의 시간 $t$에서의 급수 또는 배수량의 순간변화율은 다음과 같다.

  1번 펌프: $8t+1$ liter/hour

  2번 펌프: $4t+2$ liter/hour

  3번 펌프: $6t+4$ liter/hour

  $t=0$에서 물탱크에 저장된 물은 0.1 리터이다. $t=0$에서 $t=1$까지 1시간(hour) 동안 펌프를 작동시킨다고 하자. 펌프가 작동하는 동안 물탱크의 물이 넘치거나 바닥나지 않도록 펌프를 설치하는 경우의 수를 구하시오.
subparts:
- id: '1'
  stem: |
    펌프를 설치하는 경우의 수를 구하시오.
  points: 30
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '1시간 급수량 5, 4, 7 리터로 $t=1$ 판정 → 후보 3가지, 중간 시각까지 확인하면 (1→2)는 $t=\dfrac14$에서 바닥남.'
    steps:
    - id: 1a
      content: '후보 (1,2), (3,1), (3,2) 중 $W=2t^2-t+\dfrac1{10}$은 최솟값 $-\dfrac1{40}$ → 답 2'
      criteria:
      - 1.M1
      - 1.B1
      - 1.M2
      - 1.R1
      - 1.R2
      - 1.A1
    hint_ladder:
    - 1시간 동안의 급수·배수량은 순간변화율의 정적분이다.
    - 끝 시각에서 통과한 배치도 중간에 바닥나지 않는지 확인하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.55~56
    steps:
    - id: 1b-1
      content: |
        1시간 동안의 급수(배수)량은 순간변화율을 정적분한 값이다.
        $\displaystyle\int_0^1(8t+1)\,dt=5$, $\displaystyle\int_0^1(4t+2)\,dt=4$, $\displaystyle\int_0^1(6t+4)\,dt=7$ (리터).
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        세 펌프 중 두 개를 골라 급수관·배수관에 하나씩 연결하는 경우는 ${}_3\mathrm P_2=6$가지이고, $t=1$에서의 양은 $0.1+(\text{급수량})-(\text{배수량})$이다.
        (1,2): 1.1, (1,3): −1.9, (2,1): −0.9, (2,3): −2.9, (3,1): 2.1, (3,2): 3.1 (리터).
        $t=1$에서 0 이하가 되거나 5를 넘지 않는 조합은 (급수 1, 배수 2), (급수 3, 배수 1), (급수 3, 배수 2)의 세 가지이다.
      criteria:
      - 1.B1
    - id: 1b-3
      content: |
        작동 중간에 바닥나는 경우도 고려해야 한다. 급수 1번–배수 2번: 시각 $t$에서의 물의 양은
        $$\int_0^t(8s+1)\,ds-\int_0^t(4s+2)\,ds+\dfrac1{10}=2t^2-t+\dfrac1{10}=2\left(t-\dfrac14\right)^2-\dfrac1{40}$$
        이므로 $t=\dfrac14$에서 $-\dfrac1{40}<0$이 되어 중간에 바닥난다.
      criteria:
      - 1.M2
      - 1.R1
    - id: 1b-4
      content: '급수 3번–배수 1번: $-t^2+3t+\dfrac1{10}$, 급수 3번–배수 2번: $t^2+2t+\dfrac1{10}$은 모두 $0\le t\le1$에서 0과 5 사이에 있으므로(각각 증가하여 $t=1$에서 2.1, 3.1) 넘치거나 바닥나지 않는다.'
      criteria:
      - 1.R2
    - id: 1b-5
      content: 따라서 조건을 만족하는 경우는 (3번 급수, 1번 배수), (3번 급수, 2번 배수)의 2가지이다.
      criteria:
      - 1.A1
