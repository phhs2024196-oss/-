    wrong_work: '삼각형 HEG의 넓이를 최소화하여 $m$이 점 H에 가까워지는 극단(넓이 최소가 존재하지 않음) 또는 다른 접선을 답함'
    detect_cue: 잘려 나가는 부분의 넓이 $S(\theta)$에 대해 $S'=0$인 점에서 「최소」라고 씀, 증감표의 부호가 반대
