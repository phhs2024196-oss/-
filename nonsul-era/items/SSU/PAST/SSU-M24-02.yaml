# 해설교재(p.33~34)와 답 일치: (2-1) 10π<b≤11π, (2-2) d 최댓값 21π/2.
# 해설교재 (a)의 부등식 「19π/2 ≤ b < 21π/2」는 표에서 2b 로 표기가 섞여 있으나 내용은 같다(19π/(2b)≤1<21π/(2b)).
# 소문항 배점은 원문에 없음(문제 전체 25점) → (2-1) 15점, (2-2) 10점으로 임의 배분. [확인필요]
