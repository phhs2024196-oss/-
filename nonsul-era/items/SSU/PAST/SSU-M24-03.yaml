stimuli:
- label: 제시문
  body: |
    함수 $f:X\to Y$가 일대일대응일 때 역함수 $f^{-1}:Y\to X$가 존재한다.
    【출처: 수학 「역함수」】

stem: |
  실수 $b$에 대하여 $x>0$에서 정의된 함수 $f(x)=-2x^2+bx+2\ln2-\ln x$의 역함수가 존재할 때 $\displaystyle\int_1^2f(x)dx$의 최댓값을 구하시오.

subparts:
- id: '1'
  stem: |
    $\displaystyle\int_1^2f(x)dx$의 최댓값을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '\dfrac{7}{3}', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 양 끝 극한이 $+\infty$, $-\infty$이므로 $f$는 감소해야 한다. $-4x^2+bx-1\le0$ $(x>0)$ ⇔ $b\le4$. $\displaystyle\int_1^2f(x)dx=\dfrac{3b}{2}-\dfrac{11}{3}$이므로 $b=4$에서 최댓값 $\dfrac73$.
    steps:
    - {id: 1a, content: '$b\le4$, $\displaystyle\int_1^2f=\dfrac{3b}{2}-\dfrac{11}{3}\le\dfrac73$', criteria: [1.M1, 1.M2, 1.R1, 1.M3, 1.A1, 1.A2]}
    hint_ladder:
    - $x\to0+$, $x\to\infty$일 때 $f(x)$는 어떻게 되는가?
    - 역함수가 존재하려면 $f$가 증가 또는 감소해야 한다.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.35
    steps:
    - id: 1b-1
      content: |
        제시문에 의해 역함수가 존재하려면 $f$가 일대일대응, 즉 (연속함수이므로) 증가함수이거나 감소함수여야 한다. $\displaystyle\lim_{x\to0+}f(x)=\infty$이고 $\displaystyle\lim_{x\to\infty}f(x)=-\infty$이므로 $f$는 감소함수이어야 한다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $x>0$에서 $f$가 감소하려면 $f'(x)=\dfrac{-4x^2+bx-1}{x}\le0$, 즉 $x>0$이므로
        $$-4x^2+bx-1=-4\left(x-\dfrac b8\right)^2+\dfrac{b^2}{16}-1\le0.$$
      criteria: [1.M2]
    - id: 1b-3
      content: |
        ㄱ) $b\le0$: $-4x^2+bx-1$은 $x>0$에서 감소하고 $\displaystyle\lim_{x\to0+}(-4x^2+bx-1)=-1$이므로 $-4x^2+bx-1<0$, $f$는 감소함수이다.
        ㄴ) $b>0$: $x=\dfrac b8$에서 최댓값 $\dfrac{b^2}{16}-1$을 가지므로 $\dfrac{b^2}{16}-1\le0$, 즉 $0<b\le4$. ($b=4$이면 $f'(x)=0$은 $x=\dfrac12$에서만 성립하므로 여전히 감소함수.)
        ㄱ), ㄴ)에서 역함수가 존재할 조건은 $b\le4$.
      criteria: [1.R1]
    - id: 1b-4
      content: |
        $$\int_1^2f(x)dx=\left[-\dfrac{2x^3}{3}+\dfrac{bx^2}{2}+(2\ln2)x-x\ln x+x\right]_1^2=-\dfrac{16}{3}+\dfrac23+b\left(2-\dfrac12\right)+2\ln2-2\ln2+1=\dfrac{3b}{2}-\dfrac{11}{3}.$$
      criteria: [1.M3, 1.A1]
    - id: 1b-5
      content: |
        이 값은 $b$에 대해 증가하므로 $b=4$일 때 최댓값 $6-\dfrac{11}{3}=\dfrac73$을 갖는다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 양 끝 극한을 근거로 $f$가 감소함수이어야 함을 밝혔다.
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $f'(x)=\dfrac{-4x^2+bx-1}{x}\le0$ $(x>0)$ 조건을 세웠다.
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 6
      evidence: $b\le0$, $b>0$로 나누거나 최댓값 조건으로 $b\le4$를 이끌었다(등호 $b=4$ 포함 근거 포함).
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: $\int\ln x\,dx=x\ln x-x$를 써서 적분을 계산했다.
      steps: [1b-4]
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $\displaystyle\int_1^2f(x)dx=\dfrac{3b}{2}-\dfrac{11}{3}$.
      depends_on: [1.M3]
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: 최댓값 $\dfrac73$.
      depends_on: [1.R1, 1.A1]
      cao: true
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
  outcome_codes:
  - {code: '20', meaning: 만점}
