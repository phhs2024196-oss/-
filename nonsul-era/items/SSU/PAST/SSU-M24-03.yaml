  misconceptions:
  - id: MC-CAL-0513
    outcome_code: '71'
    wrong_work: '역함수 존재 조건을 $f^\prime(x)<0$ (모든 $x>0$)으로 두어 $b<4$를 얻고 최댓값이 없다고 하거나 $b=4$를 제외함'
