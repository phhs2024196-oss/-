stem: |
  숭실대학교 축구부 감독은 30명의 스포츠학부 학생 중에서 11명의 선수를 선발하고, 이 중에서 역할이 동등한 두 명의 리더를 지명하기로 하였다. 이렇게 팀을 구성하는 경우의 수를 감독은 다음과 같이 생각하였다.

  감독: 30명의 학생 중에서 11명의 선수를 먼저 선발하고 이 중에서 리더 2명을 지명한다.
  이때 경우의 수는 $A={}_{30}\mathrm{C}_{11}\times{}_{11}\mathrm{C}_2$이다.

  반면 학생들은 팀을 구성하는 다른 방법을 제시하고, 그 때의 경우의 수를 올바르게 계산하였다.

  (1) 방법1: 감독이 리더 2명을 먼저 지명하고, 두 리더가 상의하여 나머지 9명의 선수를 선발한다.
  이때 경우의 수는 $P={}_{30}\mathrm{C}_2\times{}_{28}\mathrm{C}_9$이다.

  (2) 방법2: 감독이 리더 1명을 먼저 지명하고, 이 리더가 나머지 10명의 선수를 선발한 뒤 이 중에서 리더 1명을 마저 지명한다.
  이때 경우의 수는 $Q={}_{30}\mathrm{C}_1\times{}_{29}\mathrm{C}_{10}\times{}_{10}\mathrm{C}_1$이다.

  (3) 방법3: 감독이 선수 5명을 먼저 선발하고 선발된 선수 중에서 리더 2명을 지명한 뒤, 두 리더가 상의하여 나머지 6명의 선수를 선발한다.
  이때 경우의 수는 $R={}_{30}\mathrm{C}_5\times{}_5\mathrm{C}_2\times{}_{25}\mathrm{C}_6$이다.

  이때 아래 식에서 괄호에 들어가는 값이 1이 아니라면 (즉, 감독의 경우의 수와 각 방법의 경우의 수가 다르다면) 그 이유를 논하고, 괄호에 들어가야 할 값을 ${}_n\mathrm{C}_r$ 혹은 ${}_n\mathrm{P}_r$의 형태로 나타내시오.

  $A\times(\qquad)=P$

  $A\times(\qquad)=Q$

  $A\times(\qquad)=R$

subparts:
- id: '1'
  stem: |
    세 괄호에 들어갈 값을 구하고, 1이 아닌 경우 그 이유를 논하시오.
  points: 25
  depends_on: []
  answer: {kind: set, value: '1,\ {}_{2}\mathrm{C}_{1},\ {}_{9}\mathrm{C}_{3}', equivalents: ['1,\ 2,\ 84'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 모두 $\dfrac{30!}{(\cdots)}$ 꼴로 바꾸어 비교한다. $P=A$, $Q=A\times{}_2\mathrm{C}_1$ (두 리더 중 누가 먼저 지명되었는지 구분), $R=A\times{}_9\mathrm{C}_3$ (리더 아닌 9명 중 먼저 뽑힌 3명을 구분).
    steps:
    - {id: 1a, content: '$A=P=\dfrac{30!}{2!\,9!\,19!}$, $Q=\dfrac{30!}{9!\,19!}$, $R=\dfrac{30!}{2!\,3!\,6!\,19!}$', criteria: [1.B1, 1.M1, 1.A1, 1.R1, 1.M2, 1.A2, 1.R2]}
    hint_ladder:
    - 각 경우의 수를 $\dfrac{30!}{\cdots}$ 꼴로 정리해 보자.
    - 완성된 팀 하나가 각 방법에서 몇 번 세어지는지 생각해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.36
    steps:
    - id: 1b-1
      content: |
        감독: $A={}_{30}\mathrm{C}_{11}\times{}_{11}\mathrm{C}_2=\dfrac{30!}{11!\,19!}\times\dfrac{11!}{2!\,9!}=\dfrac{30!}{2!\,9!\,19!}$.
        방법1: $P={}_{30}\mathrm{C}_2\times{}_{28}\mathrm{C}_9=\dfrac{30!}{2!\,28!}\times\dfrac{28!}{9!\,19!}=\dfrac{30!}{2!\,9!\,19!}$이므로 $P=A$, 괄호의 값은 $1$.
      criteria: [1.B1]
    - id: 1b-2
      content: |
        방법2: $Q={}_{30}\mathrm{C}_1\times{}_{29}\mathrm{C}_{10}\times{}_{10}\mathrm{C}_1=\dfrac{30!}{1!\,29!}\times\dfrac{29!}{10!\,19!}\times\dfrac{10!}{1!\,9!}=\dfrac{30!}{9!\,19!}$.
      criteria: [1.M1]
    - id: 1b-3
      content: |
        따라서 $Q\ne A$이고 $A\times\dfrac{2!}{1!\,1!}=A\times{}_2\mathrm{C}_1=Q$. 방법2는 처음 지명된 리더와 마지막에 지명된 리더의 순서를 구분하므로 같은 팀 구성을 두 번씩 센다. ${}_2\mathrm{C}_1$은 두 리더 중 하나가 첫 번째로 뽑히는 경우의 수이다.
      criteria: [1.A1, 1.R1]
    - id: 1b-4
      content: |
        방법3: $R={}_{30}\mathrm{C}_5\times{}_5\mathrm{C}_2\times{}_{25}\mathrm{C}_6=\dfrac{30!}{5!\,25!}\times\dfrac{5!}{2!\,3!}\times\dfrac{25!}{6!\,19!}=\dfrac{30!}{2!\,3!\,6!\,19!}$.
      criteria: [1.M2]
    - id: 1b-5
      content: |
        따라서 $R\ne A$이고 $A\times\dfrac{9!}{3!\,6!}=A\times{}_9\mathrm{C}_3=R$. 리더가 아닌 선수 9명이 처음에 뽑힌 집단(3명)과 나중에 뽑힌 집단(6명)으로 구분되어 같은 구성을 ${}_9\mathrm{C}_3=84$번 중복해서 세기 때문이며, ${}_9\mathrm{C}_3$은 리더가 아닌 9명 중 3명이 첫 번째로 뽑히는 경우의 수이다.
      criteria: [1.A2, 1.R2]
