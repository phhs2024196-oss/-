      steps: [1b-3]
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $R$을 $\dfrac{30!}{2!\,3!\,6!\,19!}$ 등으로 정리해 $A$와 비교했다.
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
