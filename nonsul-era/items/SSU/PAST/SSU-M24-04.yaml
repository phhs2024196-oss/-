      mark_type: R
      points: 4
      evidence: 리더 아닌 9명 중 먼저 뽑힌 3명과 나중 6명이 구분되어 같은 구성이 ${}_9\mathrm{C}_3$번 세어진다는 이유를 적었다.
      steps: [1b-5]
