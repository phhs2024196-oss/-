    detect_cue: $x=\pi$에서의 연속 조건이 없음, $k$가 정수라는 근거 없음
    feedback: $f$는 $x=\pi$에서도 불연속입니다. 그 점에서도 $g(\pi)=0$이어야 하므로 $k$가 정수가 됩니다.
    remedy: [RL-1]

