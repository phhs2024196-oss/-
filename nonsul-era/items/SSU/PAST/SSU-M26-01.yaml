stimuli:
- label: 제시문
  body: |
    이차방정식 $ax^2+bx+c=0$의 판별식 $D=b^2-4ac$의 값의 부호에 따라 이차함수 $y=ax^2+bx+c\ (a>0)$의 그래프와 $x$축의 위치 관계는 다음과 같다.

    [그림 설명] 아래로 볼록한 포물선 $y=f(x)$ 세 개가 나란히 그려져 있다. 왼쪽($D<0$)은 그래프가 $x$축과 만나지 않고 $x$축 위쪽에 있다. 가운데($D=0$)는 그래프가 $x$축에 한 점에서 접한다. 오른쪽($D>0$)은 그래프가 $x$축과 서로 다른 두 점에서 만난다.
    【출처: 수학 「이차방정식과 이차함수」】

stem: |
  곡선 $C_1:y=x^2+x+1$과 $C_2:y=-x^2+4x-3$이 주어져 있다. 곡선 $C_1$ 위의 점 $\mathrm A$를 지나고 $y$축에 평행한 직선 $\ell$과 곡선 $C_2$의 교점을 $\mathrm B$라고 하자. $x$축에 평행하고 점 $\mathrm A$를 지나는 직선과 곡선 $C_1$의 또 다른 교점을 $\mathrm P$, $x$축에 평행하고 점 $\mathrm B$를 지나는 직선과 곡선 $C_2$의 또 다른 교점을 $\mathrm Q$라고 할 때, 선분 $\mathrm{PQ}$의 길이가 최소가 되는 직선 $\ell$의 방정식을 구하시오.

subparts:
- id: '1'
  stem: |
    선분 $\mathrm{PQ}$의 길이가 최소가 되는 직선 $\ell$의 방정식을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: expression, value: 'Eq(x, Rational(3,4))', equivalents: ['$x=\dfrac34$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\ell:x=a$이면 $P(-a-1,\,a^2+a+1)$, $Q(4-a,\,-a^2+4a-3)$. $\overline{\mathrm{PQ}}^2=25+(2a^2-3a+4)^2$이고 $2a^2-3a+4>0$이므로 $a=\dfrac34$에서 최소.
    steps:
    - {id: 1a, content: '$\overline{\mathrm{PQ}}^2=5^2+(2a^2-3a+4)^2$, $a=\dfrac34$ → $\ell:x=\dfrac34$', criteria: [1.M1, 1.A1, 1.M2, 1.R1, 1.A2]}
    hint_ladder:
    - 포물선 위에서 $y$좌표가 같은 두 점은 무엇에 대해 대칭인가?
    - $P$와 $Q$의 $x$좌표 차는 $a$에 따라 변하는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.10
    steps:
    - id: 1b-1
      content: |
        $\mathrm A$의 $x$좌표를 $a$라 하면 $\mathrm A(a,\,a^2+a+1)$, $\ell:x=a$, $\mathrm B(a,\,-a^2+4a-3)$.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $x^2+x+1=\left(x+\dfrac12\right)^2+\dfrac34$, $-x^2+4x-3=-(x-2)^2+1$이므로 $C_1$, $C_2$는 각각 $x=-\dfrac12$, $x=2$에 대해 대칭이다. 같은 높이의 다른 점은 대칭점이므로 $\mathrm P(-a-1,\,a^2+a+1)$, $\mathrm Q(4-a,\,-a^2+4a-3)$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $\overline{\mathrm{PQ}}^2=\{(4-a)-(-a-1)\}^2+\{(a^2+a+1)-(-a^2+4a-3)\}^2=25+(2a^2-3a+4)^2$.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        $g(a)=2a^2-3a+4$의 판별식은 $9-32<0$이고 최고차항 계수가 양수이므로 제시문에 의해 $g(a)>0$이다. 따라서 $\overline{\mathrm{PQ}}$가 최소 $\iff g(a)$가 최소이고, $g(a)=2\left(a-\dfrac34\right)^2+\dfrac{23}{8}$이므로 $a=\dfrac34$에서 최소.
      criteria: [1.R1]
    - id: 1b-5
      content: |
        ($a=\dfrac34$이면 $\mathrm A\ne\mathrm P$, $\mathrm B\ne\mathrm Q$이므로 「또 다른 교점」이 존재한다.) 구하는 직선은 $\ell:x=\dfrac34$.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $\mathrm A(a,a^2+a+1)$, $\mathrm B(a,-a^2+4a-3)$으로 좌표를 놓았다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: 대칭축(또는 이차방정식의 근과 계수의 관계)으로 $\mathrm P$의 $x$좌표 $-a-1$, $\mathrm Q$의 $x$좌표 $4-a$를 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: $\overline{\mathrm{PQ}}^2=25+(2a^2-3a+4)^2$을 세웠다.
      steps: [1b-3]
    - id: 1.R1
      mark_type: R
      points: 6
      evidence: 판별식(또는 완전제곱식)으로 $2a^2-3a+4>0$임을 보이고, 이것이 최소일 때 $\overline{\mathrm{PQ}}$가 최소임을 밝혀 $a=\dfrac34$를 얻었다.
      depends_on: [1.M2]
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 직선의 방정식 $x=\dfrac34$로 답했다.
      depends_on: [1.R1]
      cao: true
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
    - code: D1-2
      condition: 직선의 방정식이 아니라 $a=\dfrac34$ 값만 답으로 씀
      effect: minus
      value: 2
  outcome_codes:
  - {code: '20', meaning: 만점}
  - {code: '71', misconception: MC-ALG-0318}
  misconceptions:
  - id: MC-ALG-0318
    outcome_code: '71'
    wrong_work: '같은 높이의 다른 점을 $y$축 대칭으로 보아 $\mathrm P(-a,\cdot)$, $\mathrm Q(-a,\cdot)$'
    detect_cue: $\mathrm P$, $\mathrm Q$의 $x$좌표가 $-a$, 가로 거리 0 또는 $a$에 의존
    feedback: 포물선은 꼭짓점을 지나는 대칭축에 대해 대칭입니다. 완전제곱식으로 대칭축을 먼저 찾으세요.
