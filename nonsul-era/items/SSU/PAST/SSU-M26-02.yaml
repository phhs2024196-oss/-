stimuli:
- label: 제시문
  body: |
    함수 $f(x)$가 닫힌구간 $[a,b]$에서 연속이고 열린구간 $(a,b)$에서 미분가능하면
    $$\frac{f(b)-f(a)}{b-a}=f^\prime(c)$$
    인 $c$가 $a$와 $b$ 사이에 적어도 하나 존재한다.
    【출처: 수학Ⅱ 「도함수의 활용」】

stem: |
  극한값 $\displaystyle\lim_{n\to\infty}\sqrt n\sum_{k=0}^{n-1}\left\{e^{\left(\frac{k+1}{n}\right)^2}-e^{\left(\frac kn\right)^2}\right\}^2$을 구하시오.

subparts:
- id: '1'
  stem: |
    주어진 극한값을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '0', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 각 차 $=\dfrac1n\cdot2c_ke^{c_k^2}$, $0<2c_ke^{c_k^2}<2e$이므로 식은 $0$과 $\dfrac{4e^2}{\sqrt n}$ 사이 → $0$.
    steps:
    - {id: 1a, content: '$0<\sqrt n\sum\{\cdots\}^2<\sqrt n\cdot n\cdot\dfrac{4e^2}{n^2}=\dfrac{4e^2}{\sqrt n}\to0$', criteria: [1.M1, 1.A1, 1.M2, 1.R1, 1.A2]}
    hint_ladder:
    - 중괄호 안은 어떤 함수의 두 함숫값의 차인가? 제시문을 적용해 보자.
    - 평균값 정리로 얻은 $f^\prime(c_k)$는 얼마보다 작은가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.11
    steps:
    - id: 1b-1
      content: |
        $f(x)=e^{x^2}$이라 하면 $f^\prime(x)=2xe^{x^2}$. $f$는 실수 전체에서 미분가능하므로 각 $k=0,1,\dots,n-1$에 대해 제시문(평균값 정리)에 의해
        $$e^{\left(\frac{k+1}{n}\right)^2}-e^{\left(\frac kn\right)^2}=\frac1nf^\prime(c_k)=\frac1n\cdot2c_ke^{c_k^2}$$
        인 $c_k\in\left(\dfrac kn,\dfrac{k+1}{n}\right)$이 존재한다.
      criteria: [1.M1, 1.A1]
    - id: 1b-2
      content: |
        $0<c_k<1$이고 $x>0$에서 $f^\prime(x)=2xe^{x^2}$은 증가함수($2x$, $e^{x^2}$이 모두 양수이고 증가)이므로 $0=f^\prime(0)<f^\prime(c_k)<f^\prime(1)=2e$.
      criteria: [1.M2]
    - id: 1b-3
      content: |
        따라서 $0<\displaystyle\sum_{k=0}^{n-1}\left\{\frac1nf^\prime(c_k)\right\}^2<n\cdot\frac{4e^2}{n^2}=\frac{4e^2}{n}$이고, $\sqrt n$을 곱하면
        $$0<\sqrt n\sum_{k=0}^{n-1}\left\{e^{\left(\frac{k+1}{n}\right)^2}-e^{\left(\frac kn\right)^2}\right\}^2<\frac{4e^2}{\sqrt n}.$$
      criteria: [1.R1]
    - id: 1b-4
      content: |
        $\displaystyle\lim_{n\to\infty}\frac{4e^2}{\sqrt n}=0$이므로 함수의 극한의 대소 관계에 의해 구하는 극한값은 $0$.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 6
      evidence: $f(x)=e^{x^2}$에 평균값 정리를 적용해 각 차를 $\dfrac1nf^\prime(c_k)$로 나타냈다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: $f^\prime(x)=2xe^{x^2}$을 구했다.
      depends_on: [1.M1]
      steps: [1b-1]
    - id: 1.M2
      mark_type: M
      points: 6
      evidence: $0<c_k<1$에서 $0<f^\prime(c_k)<2e$ (또는 다른 유한한 상계)를 근거와 함께 밝혔다.
      steps: [1b-2]
    - id: 1.R1
      mark_type: R
      points: 6
      evidence: 주어진 식이 $0$과 $\dfrac{C}{\sqrt n}$ 꼴의 상계 사이에 있음을 보였다.
      depends_on: [1.M2]
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 대소 관계(조임)로 극한값 $0$을 얻었다.
      depends_on: [1.R1]
      cao: true
      steps: [1b-4]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
