# 숭실대 2026학년도 모의논술고사(자연) 문제 3 — 원문은 내부 분석용(allowed_use: internal_only)
# [확인필요] 소문항 배점: 원문은 문제 전체 25점만 표시. (1) 10점, (2) 15점으로 임의 배분
