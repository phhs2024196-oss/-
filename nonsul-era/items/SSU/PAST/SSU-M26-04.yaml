  misconceptions:
  - id: MC-CNT-0322
    outcome_code: '71'
    wrong_work: '세 원소 $\{a,b,c\}$를 고른 뒤 순환을 1가지로 세어 $1+4=5$'
    detect_cue: 답 5, $a\to b\to c$와 $a\to c\to b$를 구분하지 않음
    feedback: 세 원소의 순환은 $a\to b\to c\to a$와 $a\to c\to b\to a$의 두 가지로 서로 다른 함수입니다.
    remedy: [RL-1]

