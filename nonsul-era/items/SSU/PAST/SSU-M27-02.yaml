stimuli:
- label: 제시문
  body: |
    함수 $f(x)$가 $x=a$에서 미분가능할 때, $x=a$에서의 미분계수 $f'(a)$는 곡선 $y=f(x)$ 위의 점 $(a,f(a))$에서의 접선의 기울기와 같다.
    【출처: 미적분 「미분법」】

stem: |
  함수 $f(x)=b^x\ (b>1)$와 그 역함수로 정의되는 함수 $g(x)=-f^{-1}(x)$의 그래프의 교점 $\mathrm{P}(\alpha,\beta)$가 $\alpha\beta^2=1$을 만족시킨다. 이때 점 $\mathrm{P}$에서 곡선 $y=f(x)$에 접하는 접선 $\ell_1$의 기울기와 점 $\mathrm{P}$에서 곡선 $y=g(x)$에 접하는 접선 $\ell_2$의 기울기의 곱을 구하시오.

subparts:
- id: '1'
  stem: |
    두 접선 $\ell_1$, $\ell_2$의 기울기의 곱을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: '-2', equivalents: [], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\log_b\alpha=-\beta$, $\log_b\beta=\alpha$를 $\log_b(\alpha\beta^2)=0$에 넣으면 $\beta=2\alpha$. 기울기 곱 $=\beta\ln b\cdot\left(-\dfrac1{\alpha\ln b}\right)=-\dfrac\beta\alpha=-2$.
    steps:
    - {id: 1a, content: '$-\beta+2\alpha=0$, 곱 $=-\beta/\alpha=-2$', criteria: [1.M1, 1.A1, 1.M2, 1.M3, 1.A2]}
    hint_ladder:
    - 점 P가 두 그래프 위에 있다는 조건을 각각 식으로 써 보자.
    - $\alpha\beta^2=1$의 양변에 $\log_b$를 취해 보자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.3
    steps:
    - id: 1b-1
      content: |
        $f^{-1}(x)=\log_bx$이므로 $g(x)=-\log_bx\ (x>0)$. 점 P가 두 그래프 위에 있으므로 $\beta=b^\alpha$, $\beta=-\log_b\alpha$. 따라서 $\log_b\beta=\alpha$, $\log_b\alpha=-\beta$ (이때 $\alpha>0$, $\beta>0$).
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $\alpha\beta^2=1$의 양변에 $\log_b$를 취하면 $\log_b\alpha+2\log_b\beta=0$, 즉 $-\beta+2\alpha=0$이므로 $\beta=2\alpha$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        제시문에 의해 $\ell_1$의 기울기는 $f'(\alpha)=b^\alpha\ln b=\beta\ln b$.
      criteria: [1.M2]
    - id: 1b-4
      content: |
        $g'(x)=-\dfrac1{x\ln b}$이므로 $\ell_2$의 기울기는 $g'(\alpha)=-\dfrac1{\alpha\ln b}$.
      criteria: [1.M3]
    - id: 1b-5
      content: |
        두 기울기의 곱은 $\beta\ln b\cdot\left(-\dfrac1{\alpha\ln b}\right)=-\dfrac\beta\alpha=-2$.
        (참고: $\alpha\cdot(2\alpha)^2=1$에서 $\alpha=2^{-2/3}$, $\beta=2^{1/3}$이고 $b=\beta^{1/\alpha}>1$이 실제로 존재한다.)
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 교점 조건 $\beta=b^\alpha$, $\beta=-\log_b\alpha$를 식으로 썼다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 7
      evidence: $\alpha\beta^2=1$에 로그를 취하고 교점 조건을 대입해 $\beta=2\alpha$를 얻었다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: $\ell_1$의 기울기 $b^\alpha\ln b$ (또는 $\beta\ln b$)를 구했다.
      implied_ok: true
      steps: [1b-3]
    - id: 1.M3
      mark_type: M
      points: 5
      evidence: $g'(\alpha)=-\dfrac1{\alpha\ln b}$를 구했다.
      implied_ok: true
      steps: [1b-4]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 곱을 $-\beta/\alpha$로 정리해 $-2$를 얻었다.
      depends_on: [1.A1, 1.M2, 1.M3]
      cao: true
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
