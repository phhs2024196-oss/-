stimuli:
- label: 제시문
  body: |
    두 수열 $\{a_n\}$, $\{b_n\}$에 대하여

    ① $\displaystyle\sum_{n=1}^{N}(a_n\pm b_n)=\sum_{n=1}^{N}a_n\pm\sum_{n=1}^{N}b_n$

    ② $\displaystyle\sum_{n=1}^{N}ca_n=c\sum_{n=1}^{N}a_n$ (단, $c$는 상수)

    ③ $\displaystyle\sum_{n=1}^{N}c=cN$ (단, $c$는 상수)
    【출처: 수학Ⅰ 「합의 기호 $\sum$」】

stem: |
  첫째항과 공비 $r$이 모두 1보다 큰 실수인 등비수열 $\{a_n\}$과 함수 $f(x)=2\ln x$에 대하여 $f(a_{2027})=19$이고, 좌표평면 위의 점 $\mathrm{P}_n(n,f(a_n))$에서 $x$축에 내린 수선의 발을 $\mathrm{Q}_n$이라고 하자. 사각형 $\mathrm{P}_n\mathrm{Q}_n\mathrm{Q}_{n+1}\mathrm{P}_{n+1}$의 넓이 $b_n$에 대하여 $\displaystyle\sum_{n=1}^{2027}b_n=20270$이라 할 때, 실수 $r$의 값을 구하시오.

subparts:
- id: '1'
  stem: |
    실수 $r$의 값을 구하시오.
  points: 25
  depends_on: []
  answer: {kind: value, value: 'exp(Rational(1,225))', equivalents: ['$e^{\frac{1}{225}}$', '$\ln r=\dfrac{9}{2025}$'], tolerance: null}
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $b_n=2\ln a_1+(2n-1)\ln r$이므로 $\sum b_n=2027(2\ln a_1+2027\ln r)$. $f(a_{2027})=2\ln a_1+4052\ln r=19$와 연립하면 $2025\ln r=9$.
    steps:
    - {id: 1a, content: '$2\ln a_1+2027\ln r=10$, $2\ln a_1+4052\ln r=19\Rightarrow\ln r=\dfrac{1}{225}$', criteria: [1.M1, 1.A1, 1.M2, 1.B1, 1.M3, 1.A2]}
    hint_ladder:
    - 사각형 $\mathrm{P}_n\mathrm{Q}_n\mathrm{Q}_{n+1}\mathrm{P}_{n+1}$은 어떤 모양이고 높이는 얼마인가?
    - 등비수열에 로그를 취하면 어떤 수열이 되는가?
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 해설교재 p.4
    steps:
    - id: 1b-1
      content: |
        $a_n=a_1r^{n-1}$이고 $a_1>1$, $r>1$이므로 $f(a_n)=2\ln a_1+2(n-1)\ln r>0$. 따라서 점 $\mathrm{P}_n$은 $x$축 위쪽에 있고, 사각형 $\mathrm{P}_n\mathrm{Q}_n\mathrm{Q}_{n+1}\mathrm{P}_{n+1}$은 평행한 두 변의 길이가 $f(a_n)$, $f(a_{n+1})$이고 높이가 $\overline{\mathrm{Q}_n\mathrm{Q}_{n+1}}=1$인 사다리꼴이다.
      criteria: [1.M1]
    - id: 1b-2
      content: |
        $b_n=\dfrac12\{f(a_n)+f(a_{n+1})\}=\dfrac12\{4\ln a_1+(4n-2)\ln r\}=2\ln a_1+(2n-1)\ln r$.
      criteria: [1.A1]
    - id: 1b-3
      content: |
        $b_n$은 첫째항 $b_1=2\ln a_1+\ln r$, 공차 $2\ln r$인 등차수열이다. 또 $f(a_{2027})=2\ln(a_1r^{2026})=2(\ln a_1+2026\ln r)=19$이므로 $2\ln a_1=19-4052\ln r$.
      criteria: [1.M3]
    - id: 1b-4
      content: |
        제시문의 성질 ①②③에 의해
        $$\sum_{n=1}^{N}b_n=2N\ln a_1+\ln r\sum_{n=1}^{N}(2n-1)=2N\ln a_1+N^2\ln r.$$
        $N=2027$, $2\ln a_1=19-4052\ln r$를 대입하면 $2027(19-4052\ln r)+2027^2\ln r=2027(19-2025\ln r)=20270$.
      criteria: [1.M2, 1.B1]
    - id: 1b-5
      content: |
        $19-2025\ln r=10$에서 $\ln r=\dfrac{9}{2025}=\dfrac{1}{225}$이므로 $r=e^{\frac{1}{225}}$. 이때 $2\ln a_1=19-\dfrac{4052}{225}=\dfrac{223}{225}>0$이므로 $a_1>1$, $r>1$ 조건도 만족한다.
      criteria: [1.A2]
  rubric:
    rules: {ft_scope: cross_subpart_only, ft_requires_working: true, a_requires_m: true, misread_penalty: 2, isw: true}
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 사각형이 높이 1, 평행한 변 $f(a_n)$, $f(a_{n+1})$인 사다리꼴임을 밝혀 $b_n=\dfrac{f(a_n)+f(a_{n+1})}{2}$로 썼다.
      steps: [1b-1]
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: $b_n=2\ln a_1+(2n-1)\ln r$ (또는 동치식)을 구했다.
      depends_on: [1.M1]
      steps: [1b-2]
    - id: 1.M2
      mark_type: M
      points: 4
      evidence: 합의 기호의 성질로 $\sum b_n$을 $\ln a_1$, $\ln r$에 대한 식으로 정리했다.
      steps: [1b-4]
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: $\displaystyle\sum_{n=1}^{2027}(2n-1)=2027^2$ (또는 등차수열의 합 공식)을 써서 $\ln r$에 대한 일차방정식을 얻었다.
      steps: [1b-4]
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: $f(a_{2027})=2\ln a_1+4052\ln r=19$를 세웠다.
      steps: [1b-3]
    - id: 1.A2
      mark_type: A
      points: 4
      evidence: 연립하여 $\ln r=\dfrac{1}{225}$, $r=e^{\frac{1}{225}}$을 얻었다.
      depends_on: [1.M2, 1.M3]
      cao: true
      steps: [1b-5]
    deductions:
    - code: D1-1
      condition: 답만 쓰고 과정 없음
      effect: cap
      value: 5
