  misconceptions:
  - id: MC-CAL-0311
    outcome_code: '71'
    wrong_work: '$\displaystyle\int_{-1}^{1}\lvert ax+b\rvert\,dx=\left\lvert\int_{-1}^{1}(ax+b)\,dx\right\rvert=2b$로 계산해 답 5'
    detect_cue: 경우 분류 없이 $2b=10$만 있음, 답 5
    feedback: 적분 구간 안에서 부호가 바뀌면 절댓값을 적분 밖으로 뺄 수 없습니다. 부호가 바뀌는 점에서 구간을 나누세요.
    remedy: [RL-1]
  - id: MC-CNT-0312
    outcome_code: '72'
    wrong_work: '$b^2=a(10-a)$의 해 $(1,3),(2,4),(5,5),(8,4),(9,3)$을 모두 세어 $5+5=10$'
    detect_cue: 답 10 또는 9(중복 $(5,5)$만 뺌), $a>b$ 확인 없음
    feedback: 식 $\dfrac{a^2+b^2}{a}$는 $a>b$라는 가정 아래에서만 성립합니다. 구한 해가 그 경우의 조건을 만족하는지 다시 확인하세요.
    remedy: [RL-2]

