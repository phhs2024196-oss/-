stem: |
  ※ 〈문제 1〉부터 〈문제 4〉까지 총 4개의 문제가 있고, 각 문제마다 3개의 세부 문항이 있습니다. 답안지의 지정된 양식 안에 각 세부 문항 별로 해당 문항 번호를 쓰고 답을 작성하십시오. 수식과 논리를 명확히 전개하고 근거와 과정을 제시하십시오. (시험 시간: 100분, 답안 분량: 지정된 답안 양식 내 작성)

  두 함수 $f(x)=\dfrac{x+3}{4x+8}$, $g(x)=-\dfrac{x-3}{x-4}$에 대하여 다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: |
    (1) 두 함수 $y=f(x)$, $y=g(x)$의 그래프의 점근선으로 둘러싸인 도형의 넓이를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: 15/2
    equivalents:
    - '7.5'
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 함수를 $\frac{k}{x-p}+q$ 꼴로 바꿔 점근선을 구하면 직사각형이 된다.
    steps:
    - id: 1a
      content: 점근선 $x=-2,\ y=\frac14$ / $x=4,\ y=-1$ → 가로 $6$, 세로 $\frac54$ → 넓이 $\frac{15}{2}$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g21.pdf p.32 예시답안 문제 1(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $f(x)=\dfrac{x+3}{4x+8}=\dfrac{1}{4(x+2)}+\dfrac14$이므로 점근선의 방정식은 $x=-2,\ y=\dfrac14$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $g(x)=-\dfrac{x-3}{x-4}=-\dfrac{1}{x-4}-1$이므로 점근선의 방정식은 $x=4,\ y=-1$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        따라서 두 그래프의 점근선으로 둘러싸인 영역은 직사각형이고, 그 넓이는 $6\times\dfrac54=\dfrac{15}{2}$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $f$의 점근선 $x=-2,\ y=\frac14$과 $g$의 점근선 $x=4,\ y=-1$을 구했다.
      depends_on: []
      steps:
      - 1b-1
      - 1b-2
      implied_ok: false
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        가로 $6$, 세로 $\frac54$인 직사각형의 넓이 $\frac{15}{2}$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) 함수 $y=f(x)$의 점근선의 교점을 P라 하자. 네 변이 각각 좌표축에 평행하고, 대각선의 교점이 P인 정사각형 ABCD의 두 꼭짓점 A, C가 함수 $y=f(x)$의 그래프 위에 있을 때, 꼭짓점 B의 좌표를 구하시오. 단, 점 A의 $x$좌표는 $-2$보다 작고, 점 B의 $x$좌표는 $-2$보다 크다.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: (-3/2, -1/4)
    equivalents:
    - $\mathrm{B}\left(-\frac32,-\frac14\right)$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '정사각형의 대각선 교점이 P이므로 A, C는 P에 대해 대칭: $\mathrm{A}(-2-a,\frac14-a)$, $\mathrm{C}(-2+a,\frac14+a)$, C를 $f$에 대입해 $a$를 구한다.'
    steps:
    - id: 2a
      content: $a=\frac12$ → $\mathrm{A}(-\frac52,-\frac14)$, $\mathrm{C}(-\frac32,\frac34)$ → $\mathrm{B}(-\frac32,-\frac14)$
      criteria:
      - 2.B1
      - 2.M1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g21.pdf p.33 예시답안 문제 1(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 P의 좌표는 $\mathrm{P}\left(-2,\dfrac14\right)$이다.
      criteria:
      - 2.B1
    - id: 2b-2
      content: |
        정사각형 ABCD의 네 변이 각각 좌표축에 평행하고, 대각선 AC의 교점이 P이며, 점 A의 $x$좌표가 $-2$보다 작으므로, 점 A, C의 좌표를 각각 $\mathrm{A}\left(-2-a,\dfrac14-a\right)$, $\mathrm{C}\left(-2+a,\dfrac14+a\right)$ $(a>0)$로 둘 수 있다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        C가 함수 $y=f(x)$의 그래프 위에 있으므로 $\dfrac14+a=\dfrac{-2+a+3}{4(-2+a)+8}=\dfrac{a+1}{4a}$이다. 따라서 $4a\left(\dfrac14+a\right)=a+1$, $4a^2=1$이므로 $a=\dfrac12$이다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        그러므로 $\mathrm{A}\left(-\dfrac52,-\dfrac14\right)$, $\mathrm{C}\left(-\dfrac32,\dfrac34\right)$인데, 꼭짓점 B의 $x$좌표는 C의 $x$좌표와 같고, B의 $y$좌표는 A의 $y$좌표와 같으므로 $\mathrm{B}\left(-\dfrac32,-\dfrac14\right)$이다.
      criteria:
      - 2.A1
    - id: 2b-5
      content: |
        [다른 풀이 ①②⑤ 위와 동일] ③ 점 C를 $x$축의 방향으로 $2$만큼, $y$축의 방향으로 $-\dfrac14$만큼 평행이동한 점 $\mathrm{C}^{\prime}(a,a)$는 $y=\dfrac{1}{4x}$의 그래프 위에 있다. ④ 따라서 $a=\dfrac{1}{4a}$, $4a^2=1$ $(a>0)$이므로 $a=\dfrac12$이다.
      criteria:
      - 2.M2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.B1
      mark_type: B
      points: 1
      evidence: |
        점근선의 교점 $\mathrm{P}\left(-2,\frac14\right)$를 구했다.
      depends_on: []
      steps:
      - 2b-1
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        대칭성을 이용해 $\mathrm{A}\left(-2-a,\frac14-a\right)$, $\mathrm{C}\left(-2+a,\frac14+a\right)$ $(a>0)$로 두었다.
      depends_on: []
      steps:
      - 2b-2
      implied_ok: false
    - id: 2.M2
      mark_type: M
      points: 4
      evidence: |
        C가 $y=f(x)$ 위에 있다는 조건으로 $4a^2=1$, $a=\frac12$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-3
      - 2b-5
      implied_ok: false
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        A, C의 좌표를 구하고 $\mathrm{B}\left(-\frac32,-\frac14\right)$를 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (3) 함수 $y=h(x)$의 그래프는 함수 $y=f(x)$의 그래프를 $x$축에 대하여 대칭이동한 것이고, 함수 $y=k(x)$의 그래프는 함수 $y=g(x)$의 그래프를 $y$축의 방향으로 $b$만큼 평행이동한 것이라고 할 때, 두 함수 $y=h(x)$, $y=k(x)$의 그래프의 점근선으로 둘러싸인 도형이 정사각형이 되도록 하는 실수 $b$의 값을 모두 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: set
    value: 27/4; -21/4
    equivalents:
    - $b=\frac{27}{4},\ -\frac{21}{4}$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h$의 점근선 $x=-2,\ y=-\frac14$, $k$의 점근선 $x=4,\ y=-1+b$. 가로 $6$과 세로 $\left\lvert b-\frac34\right\rvert$가 같아야 한다.
    steps:
    - id: 3a
      content: $6=\left\lvert b-\frac34\right\rvert$ → $b=\frac{27}{4},\ -\frac{21}{4}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g21.pdf p.33 예시답안 문제 1(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        함수 $y=h(x)$의 그래프는 함수 $y=f(x)$의 그래프를 $x$축에 대하여 대칭이동한 것이므로, $y=h(x)$의 그래프의 점근선의 방정식은 $x=-2,\ y=-\dfrac14$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        함수 $y=k(x)$의 그래프는 함수 $y=g(x)$의 그래프를 $y$축의 방향으로 $b$만큼 평행이동한 것이므로, $y=k(x)$의 그래프의 점근선의 방정식은 $x=4,\ y=-1+b$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        두 함수 $y=h(x)$, $y=k(x)$의 그래프의 점근선으로 둘러싸인 영역이 정사각형이 되려면 $4-(-2)=\left\lvert(-1+b)-\left(-\dfrac14\right)\right\rvert$을 만족해야 한다. 따라서 $6=\left\lvert b-\dfrac34\right\rvert$로부터 $b=\dfrac{27}{4},\ -\dfrac{21}{4}$이다.
      criteria:
      - 3.M3
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
