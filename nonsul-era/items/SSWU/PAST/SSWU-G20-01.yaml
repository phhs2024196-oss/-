intent: |
  수학Ⅰ에서 도형의 평행이동과 대칭이동을 공부하고, 수학Ⅱ에서 유리함수의 그래프를 그리고 그 그래프의 성질을 다루었다. 본 문제는 유리함수의 그래프에 대한 중요한 개념인 점근선을 찾을 수 있는지 알아보고, 유리함수의 그래프의 성질과 도형의 평행이동, 대칭이동을 활용하는 통합적인 사고를 통한 문제해결능력을 평가하고자 한다.
