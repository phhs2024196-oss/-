key_idea: |
  $f(x)=\dfrac{1}{4(x+2)}+\dfrac14$, $g(x)=-\dfrac{1}{x-4}-1$로 변형하면 점근선이 바로 보인다. 정사각형의 대각선 교점이 점근선의 교점 P이므로 A, C는 P에 대해 대칭이고, 대칭이동·평행이동한 그래프의 점근선도 같은 방식으로 구해 가로·세로 길이를 비교한다.
stuck: |
  (2)에서 정사각형의 대칭성을 이용해 A, C의 좌표를 $\left(-2\mp a,\ \frac14\mp a\right)$로 미지수 하나로 나타내는 단계
