elements:
  materials:
  - $f(x)=\dfrac{x+3}{4x+8}$, $g(x)=-\dfrac{x-3}{x-4}$
  - 점근선의 교점 P를 대각선의 교점으로 하고 네 변이 좌표축에 평행한 정사각형 ABCD (두 꼭짓점 A, C가 $y=f(x)$ 위)
  - '$h(x)$: $f$를 $x$축에 대해 대칭이동, $k(x)$: $g$를 $y$축 방향으로 $b$만큼 평행이동'
  concepts:
  - 유리함수 $y=\frac{k}{x-p}+q$의 점근선
  - 평행이동·대칭이동한 도형의 방정식
  - 정사각형의 대칭성(대각선의 교점)
  tools:
  - 분자·분모 변형 $\dfrac{x+3}{4x+8}=\dfrac{1}{4(x+2)}+\dfrac14$
  - $\dfrac14+a=\dfrac{a+1}{4a}$에서 $4a^2=1$
  - 직사각형 넓이 $6\times\dfrac54$
  - 정사각형 조건 $6=\left\lvert b-\dfrac34\right\rvert$
  conditions:
  - 점 A의 $x$좌표는 $-2$보다 작고, 점 B의 $x$좌표는 $-2$보다 크다
  - (3) 두 점근선으로 둘러싸인 도형이 정사각형
