stem: |
  오른쪽 그림과 같이 반지름의 길이가 1인 원 O 위에 고정된 점 A가 있다. 원 O 위를 움직이는 두 점 P, Q에 대하여 호 PQ는 점 A를 포함하고, 호 AQ의 길이는 호 AP의 길이의 2배이다. 점 P에서 $\overline{\mathrm{OQ}}$에 내린 수선의 발을 H, 호 AP의 길이를 $a$(단, $0<a<\dfrac{\pi}{6}$)로 둘 때, 부채꼴 OPQ에서 삼각형 OPQ를 제외한 활꼴의 넓이를 $f(a)$라 하고, 삼각형 PHQ의 넓이를 $g(a)$라 한다.

  [그림 1: 중심 O, 반지름 1인 원. 점 A는 O의 오른쪽 수평선(OA) 위의 원 위의 점. A의 위쪽에 점 P(호 AP의 길이 $a$), 아래쪽에 점 Q(호 AQ의 길이 $2a$). 선분 OP, OQ, PQ를 그리고 P에서 OQ에 내린 수선의 발이 H(직각 표시). 선분 PQ와 호 PQ 사이의 활꼴 넓이가 $f(a)$, 삼각형 PHQ의 넓이가 $g(a)$]

  다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: |
    (1) $f(a)$, $g(a)$를 각각 $a$에 대한 식으로 나타내시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: f=(3*a-sin(3*a))/2; g=sin(3*a)*(1-cos(3*a))/2
    equivalents:
    - $f(a)=\frac12(3a-\sin3a)$, $g(a)=\frac12\sin3a(1-\cos3a)$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\angle\mathrm{POQ}=3a$. 활꼴 = 부채꼴 $-$ 삼각형 OPQ, 삼각형 PHQ = 삼각형 OPQ $-$ 삼각형 OPH.
    steps:
    - id: 1a
      content: $f(a)=\frac12(3a-\sin3a)$, $g(a)=\frac12\sin3a-\frac12\sin3a\cos3a$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
  - id: S1-B
    audience: B
    source_flow: g21.pdf p.34 예시답안 문제 2(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $\angle\mathrm{AOP}=\theta$라 하자. 호 AP의 길이는 $a=1\times\theta=\theta$이다. 또 호 AQ의 길이는 $2a=1\times\angle\mathrm{AOQ}$이므로 $\angle\mathrm{AOQ}=2a$이다. 따라서 $\angle\mathrm{POQ}=a+2a=3a$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        부채꼴 OPQ의 넓이는 $\dfrac12\times1^2\times3a=\dfrac{3a}{2}$이고 삼각형 OPQ의 넓이는 $\dfrac12\times1^2\times\sin3a=\dfrac{\sin3a}{2}$이므로 활꼴의 넓이는 $f(a)=\dfrac12(3a-\sin3a)$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\overline{\mathrm{PH}}=\sin3a$, $\overline{\mathrm{OH}}=\cos3a$이고 삼각형 PHQ의 넓이는 삼각형 OPQ의 넓이에서 삼각형 OPH의 넓이를 뺀 것이므로 $g(a)=\dfrac12\sin3a-\dfrac12\sin3a\cos3a=\dfrac12\sin3a(1-\cos3a)$이다.
      criteria:
      - 1.M3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        $\angle\mathrm{POQ}=3a$임을 호의 길이와 중심각의 관계로 보였다.
      depends_on: []
      steps:
      - 1b-1
      implied_ok: false
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        부채꼴과 삼각형 OPQ의 넓이로 $f(a)=\frac12(3a-\sin3a)$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
      implied_ok: false
    - id: 1.M3
      mark_type: M
      points: 4
      evidence: |
        $\overline{\mathrm{PH}}=\sin3a$, $\overline{\mathrm{OH}}=\cos3a$를 이용해 $g(a)=\frac12\sin3a(1-\cos3a)$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
      implied_ok: false
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) $\displaystyle\lim_{a\to0+}\dfrac{f(a)}{a}$의 값을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '0'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\frac{f(a)}{a}=\frac12\left(\frac{3a}{a}-3\cdot\frac{\sin3a}{3a}\right)$로 나누어 극한을 구한다.
    steps:
    - id: 2a
      content: $\frac12(3-3)=0$
      criteria:
      - 2.M1
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g21.pdf p.34 예시답안 문제 2(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\displaystyle\lim_{a\to0+}\dfrac{f(a)}{a}=\lim_{a\to0+}\dfrac{\frac12(3a-\sin3a)}{a}=\dfrac12\left(\lim_{a\to0+}\dfrac{3a}{a}-3\lim_{a\to0+}\dfrac{\sin3a}{3a}\right)=\dfrac12(3-3)=0$이다.
      criteria:
      - 2.M1
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $\frac{f(a)}{a}$를 $\lim\frac{3a}{a}$와 $\lim\frac{\sin3a}{3a}$로 나누어 나타냈다.
      depends_on: []
      steps:
      - 2b-1
      implied_ok: false
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        극한값 $0$을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-1
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (3) $\displaystyle\lim_{a\to0+}\dfrac{g(a)}{a^3}$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 27/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $1-\cos3a=\frac{\sin^23a}{1+\cos3a}$로 바꿔 $\left(\frac{\sin3a}{a}\right)^3\cdot\frac1{1+\cos3a}$ 꼴을 만든다.
    steps:
    - id: 3a
      content: $\frac12\cdot27\cdot1\cdot\frac12=\frac{27}{4}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g21.pdf p.34 예시답안 문제 2(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\displaystyle\lim_{a\to0+}\dfrac{g(a)}{a^3}=\lim_{a\to0+}\dfrac{\frac12\sin3a(1-\cos3a)}{a^3}=\dfrac12\lim_{a\to0+}\dfrac{\sin3a\times\sin^23a}{a^3(1+\cos3a)}$
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $=\dfrac12\displaystyle\lim_{a\to0+}\left(\dfrac{\sin3a}{a}\right)^3\times\dfrac{1}{1+\cos3a}$
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $=\dfrac12\displaystyle\lim_{a\to0+}27\times\left(\dfrac{\sin3a}{3a}\right)^3\times\dfrac{1}{1+\cos3a}=\dfrac{27}{4}$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: |
        $1-\cos3a=\frac{\sin^23a}{1+\cos3a}$를 이용해 $\frac12\lim\frac{\sin3a\times\sin^23a}{a^3(1+\cos3a)}$로 바꿨다.
      depends_on: []
      steps:
      - 3b-1
      implied_ok: false
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        $\left(\frac{\sin3a}{a}\right)^3\times\frac{1}{1+\cos3a}$ 꼴로 정리했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
      implied_ok: false
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        극한값 $\frac{27}{4}$를 구했다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
