intent: |
  미적분 Ⅱ의 삼각함수 단원에는 삼각함수의 미분을 학습하기 위한 전 단계로 삼각함수에 관한 여러 가지 극한값을 다루고 있다. 이 문제는 도형의 넓이를 삼각함수를 이용하여 나타내도록 하고, 삼각함수의 극한값을 써서 함수의 극한을 계산하도록 구성하였다. 먼저 원에서 호의 길이와 중심각의 크기가 비례함을 이용하여 함수의 식을 찾고, 그것을 이용하여 극한값을 계산하도록 하였으므로 삼각함수의 미분법에 대한 폭 넓은 이해도와 적용능력을 측정하는 문제이다.
