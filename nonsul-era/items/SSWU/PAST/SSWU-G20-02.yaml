key_idea: |
  단위원에서 호의 길이는 중심각이므로 $\angle\mathrm{POQ}=3a$. 활꼴은 부채꼴 $-$ 삼각형 OPQ, 삼각형 PHQ는 삼각형 OPQ $-$ 삼각형 OPH. 극한은 $\lim\frac{\sin 3a}{3a}=1$과 $\sin^2 3a=1-\cos^2 3a$로 처리한다.
stuck: |
