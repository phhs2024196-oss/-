intent: |
  미적분 Ⅰ의 미분법 단원에서는 함수의 그래프에서 접선의 방정식을 구하는 것을 학습하고 있다. 또 적분법 단원에서는 정적분을 이용하여 곡선으로 둘러싸인 영역의 넓이를 계산하는 방법을 다루고 있다. 이 문제는 미분을 이용하여 삼차함수의 그래프 위의 점에서 접선의 방정식을 구하고, 삼차함수의 그래프와 그 접선으로 둘러싸인 도형의 넓이를 적분을 이용하여 계산하게 함으로써 미분법과 적분법을 정확하게 알고 있으며 그것을 이용하여 문제를 해결할 수 있는지를 평가하는 문제이다.
