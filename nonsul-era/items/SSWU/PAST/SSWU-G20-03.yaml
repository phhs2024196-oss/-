stem: |
  곡선 $y=\dfrac13x^3-x+10$ 위의 $x$좌표가 2인 점 A에서의 접선과 이 곡선의 교점 중 A와 다른 것을 B라고 한다.

  다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: |
    (1) 곡선 $y=\dfrac13x^3-x+10$의 점 A에서의 접선의 방정식을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 3*x+14/3
    equivalents:
    - $y=3x+\frac{14}{3}$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: A의 $y$좌표 $\frac{32}{3}$, 기울기 $y^{\prime}(2)=3$.
    steps:
    - id: 1a
      content: $y=3(x-2)+\frac{32}{3}=3x+\frac{14}{3}$
      criteria:
      - 1.B1
      - 1.B2
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g21.pdf p.35 예시답안 문제 3(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        점 A는 곡선 $y=\dfrac13x^3-x+10$ 위에 있으므로 A의 $y$좌표는 $\dfrac83-2+10=\dfrac{32}{3}$이다.
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $y^{\prime}=x^2-1$이므로 $x=2$인 점 A에서의 접선의 기울기는 $2^2-1=3$이고,
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        접선의 방정식은 $y=3(x-2)+\dfrac{32}{3}$, 즉 $y=3x+\dfrac{14}{3}$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: |
        점 A의 $y$좌표 $\frac{32}{3}$를 구했다.
      depends_on: []
      steps:
      - 1b-1
    - id: 1.B2
      mark_type: B
      points: 3
      evidence: |
        $y^{\prime}=x^2-1$에서 A에서의 접선의 기울기 $3$을 구했다.
      depends_on: []
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: |
        접선의 방정식 $y=3x+\frac{14}{3}$를 구했다.
      depends_on:
      - 1.B1
      - 1.B2
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) 점 B의 $x$좌표를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '-4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 접선과 곡선을 연립하면 $x=2$가 중근.
    steps:
    - id: 2a
      content: $\frac13(x-2)^2(x+4)=0$ → B의 $x$좌표 $-4$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g21.pdf p.35 예시답안 문제 3(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        접선과 이 곡선이 만나는 점의 $x$좌표는 $\dfrac13x^3-x+10=3x+\dfrac{14}{3}$를 만족한다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\dfrac13(x^3-12x+16)=0$에서 $\dfrac13(x-2)^2(x+4)=0$
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $x=2,\ x=-4$이므로 B의 $x$좌표는 $-4$이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 1
      evidence: |
        접선과 곡선의 방정식을 연립했다.
      depends_on: []
      steps:
      - 2b-1
      implied_ok: false
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $\frac13(x-2)^2(x+4)=0$으로 인수분해했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
      implied_ok: false
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        B의 $x$좌표 $-4$를 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (3) 곡선 $y=\dfrac13x^3-x+10$과 선분 AB로 둘러싸인 도형의 넓이를 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '36'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 구간 $[-4,2]$에서 곡선이 접선 위에 있으므로 $\int_{-4}^2\frac13(x-2)^2(x+4)dx$.
    steps:
    - id: 3a
      content: $\left[\frac1{12}x^4-2x^2+\frac{16}3x\right]_{-4}^{2}=36$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g21.pdf p.35 예시답안 문제 3(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\left(\dfrac13x^3-x+10\right)-\left(3x+\dfrac{14}{3}\right)=\dfrac13(x-2)^2(x+4)$이므로 구간 $[-4,2]$에서 $\left(\dfrac13x^3-x+10\right)-\left(3x+\dfrac{14}{3}\right)\ge0$, 즉 $\dfrac13x^3-x+10\ge3x+\dfrac{14}{3}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        곡선 $y=\dfrac13x^3-x+10$과 선분 AB로 둘러싸인 도형의 넓이는 $\displaystyle\int_{-4}^{2}\left\{\dfrac13x^3-x+10-\left(3x+\dfrac{14}{3}\right)\right\}dx$
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $=\left[\dfrac1{12}x^4-2x^2+\dfrac{16}{3}x\right]_{-4}^{2}$
      criteria:
      - 3.M2
    - id: 3b-4
      content: |
        $=\dfrac{16}{12}-8+\dfrac{32}{3}-\dfrac{256}{12}+32+\dfrac{64}{3}=36$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        구간 $[-4,2]$에서 곡선이 접선 위(또는 절댓값 적분)임을 밝혔다.
      depends_on: []
      steps:
      - 3b-1
      implied_ok: false
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        정적분의 식을 세우고 부정적분을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
      - 3b-3
      implied_ok: false
    - id: 3.A1
      mark_type: A
      points: 4
      evidence: |
        넓이 $36$을 구했다.
      depends_on:
      - 3.M2
      steps:
      - 3b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
