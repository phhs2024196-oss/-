key_idea: |
  접선과 곡선의 교점은 방정식 $\frac13x^3-x+10=3x+\frac{14}{3}$, 즉 $(x-2)^2(x+4)=0$에서 접점 $x=2$가 중근이다. 구간 $[-4,2]$에서 곡선이 접선 위에 있으므로 두 식의 차를 적분한다.
stuck: |
  (2)에서 접점이 중근이므로 삼차식을 $(x-2)^2(x+4)$로 인수분해하는 단계
