key_idea: |
  최단 경로는 왼쪽 아래 $a$ $(n-k)$번, 오른쪽 아래 $b$ $k$번으로만 이루어지므로 $f(k)={}_n\mathrm{C}_k$(파스칼 삼각형). $g(n)=\sum{}_n\mathrm{C}_k=2^n$이고 $\sum\frac1{2^n}=1$. 가장 긴 경로는 모든 꼭짓점을 지나는 경로이고, 꼭짓점 수 $\frac{(n+1)(n+2)}2$에서 1을 뺀 $\frac{n(n+3)}2$가 상한이며 실제로 구현된다.
stuck: |
  (3)에서 길이의 상한이 꼭짓점 수 $-1$임을 보이고, 그 길이의 경로가 실제로 존재함을 구성하는 단계
