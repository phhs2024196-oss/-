stimuli: []
stem: |
  $n$이 자연수일 때 좌표평면에서 원점 O와 점 $\mathrm{A}(n,0)$을 두 꼭짓점으로 하는 정삼각형 OAB를 그리고, 이것을 아래 그림 $\mathrm{R}_n$과 같이 한 변의 길이가 1인 $n^2$개의 합동인 정삼각형으로 분할하였다.

  [그림 2: 세 그림 $\mathrm{R}_1$, $\mathrm{R}_2$, ⋯, $\mathrm{R}_n$. 각 그림은 원점 O와 점 A(n,0)을 밑변의 양 끝으로 하는 정삼각형 OAB를 한 변의 길이 1인 $n^2$개의 정삼각형으로 분할한 것이다. $x$축 위에 점 $1,2,3,\cdots,n-1,n$이 표시되어 있고 꼭대기가 B이다. $\mathrm{R}_1$은 O, 1(=A), B, $\mathrm{R}_2$는 $x$축 위의 1, 2(=A)가 표시됨]

  다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: |
    (1) 그려진 삼각형들의 변을 따라 B에서 점 $(k,0)$에 이르는 최단 경로의 개수를 $f(k)$라 할 때, 그림 $\mathrm{R}_1$의 $f(0)$, $f(1)$의 값과 그림 $\mathrm{R}_2$의 $f(0)$, $f(1)$, $f(2)$의 값을 각각 구하고, 그림 $\mathrm{R}_n$의 $f(k)$를 $k$에 대한 식으로 나타내시오. $(k=0,1,\cdots,n)$.
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: R1=1,1; R2=1,2,1; f=binomial(n,k)
    equivalents:
    - '$\mathrm{R}_1$: $f(0)=1,\ f(1)=1$; $\mathrm{R}_2$: $f(0)=1,\ f(1)=2,\ f(2)=1$; $f(k)={}_n\mathrm{C}_k=\frac{n!}{k!(n-k)!}$'
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: B에서 내려오는 최단 경로는 왼쪽 아래 $a$와 오른쪽 아래 $b$ 두 방향만 쓰며, $(n-k)$개의 $a$와 $k$개의 $b$를 나열한다.
    steps:
    - id: 1a
      content: $f(k)={}_n\mathrm{C}_k=\dfrac{n!}{k!(n-k)!}$
      criteria:
      - 1.B1
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g21.pdf p.35~36 예시답안 문제 4(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $n=1$인 경우: $f(0)=1,\ f(1)=1$
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $n=2$인 경우: $f(0)=1,\ f(1)=2,\ f(2)=1$
      criteria:
      - 1.B1
    - id: 1b-3
      content: |
        왼쪽 아래로 한 칸 이동하는 것을 $a$, 오른쪽 아래로 한 칸 이동하는 것을 $b$라 하면, B에서 $(k,0)$으로 가는 최단경로는 $a$와 $b$ 형태의 선분만 사용하여 $(k,0)$에 도달해야 하므로 최단경로의 가짓수는 $(n-k)$개의 $a$와 $k$개의 $b$를 일렬로 늘어놓는 순열의 수이다. (또는 $n$개의 자리 중에서 $b$를 놓을 $k$개의 자리를 선택하는 조합의 수로 설명해도 됨.)
      criteria:
      - 1.M1
    - id: 1b-4
      content: |
        따라서 $f(k)={}_n\mathrm{C}_k=\dfrac{n!}{k!(n-k)!}$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        $\mathrm{R}_1$: $f(0)=f(1)=1$, $\mathrm{R}_2$: $f(0)=1,\ f(1)=2,\ f(2)=1$을 구했다.
      depends_on: []
      steps:
      - 1b-1
      - 1b-2
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        최단 경로가 $a$ $(n-k)$개와 $b$ $k$개를 일렬로 나열하는 것임을 설명했다.
      depends_on: []
      steps:
      - 1b-3
      implied_ok: false
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $f(k)={}_n\mathrm{C}_k$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-4
