  misconceptions: []
- id: '2'
  stem: |
    (2) 그림 $\mathrm{R}_n$에서 $g(n)=\displaystyle\sum_{k=0}^{n}f(k)$를 $n$에 대한 식으로 나타내고, $\displaystyle\sum_{n=1}^{\infty}\dfrac{1}{g(n)}$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: g=2**n; sum=1
    equivalents:
    - $g(n)=2^n$, $\sum_{n=1}^{\infty}\frac1{g(n)}=1$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(n)=\sum{}_n\mathrm{C}_k=2^n$, 공비 $\frac12$인 등비급수.
    steps:
    - id: 2a
      content: $\sum_{n=1}^{\infty}\frac1{2^n}=\frac{1/2}{1-1/2}=1$
      criteria:
      - 2.M1
      - 2.B1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g21.pdf p.36 예시답안 문제 4(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $g(n)=\displaystyle\sum_{k=0}^{n}f(k)=\sum_{k=0}^{n}{}_n\mathrm{C}_k={}_n\mathrm{C}_0+{}_n\mathrm{C}_1+\cdots+{}_n\mathrm{C}_n=2^n$이다.
      criteria:
      - 2.M1
      - 2.B1
    - id: 2b-2
      content: |
        이로부터 $\displaystyle\sum_{n=1}^{\infty}\dfrac1{g(n)}=\sum_{n=1}^{\infty}\dfrac1{2^n}=\dfrac{\frac12}{1-\frac12}=1$이다.
      criteria:
      - 2.M2
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $g(n)=\sum_{k=0}^{n}{}_n\mathrm{C}_k$로 나타냈다.
      depends_on: []
      steps:
      - 2b-1
      implied_ok: false
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        이항정리로 $g(n)=2^n$을 구했다.
      depends_on: []
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $\sum\frac1{2^n}$을 공비 $\frac12$인 등비급수로 보았다.
      depends_on: []
      steps:
      - 2b-2
      implied_ok: false
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        급수의 합 $1$을 구했다.
      depends_on:
      - 2.M2
      - 2.B1
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (3) 그림 $\mathrm{R}_n$에서 한 번 지난 점은 다시 지나지 않고, 그려진 삼각형들의 변을 따라 B에서 A로 가는 경로 중 가장 긴 것의 길이를 $n$에 대한 식으로 나타내시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: n*(n+3)/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 모든 꼭짓점 $\frac{(n+1)(n+2)}2$개를 지나는 경로가 가장 길고 길이는 꼭짓점 수 $-1$. 그런 경로가 실제로 존재함을 보인다.
    steps:
    - id: 3a
      content: $\frac{(n+1)(n+2)}2-1=\frac{n(n+3)}2$
      criteria:
      - 3.M1
      - 3.M2
      - 3.R1
  - id: S3-B
    audience: B
    source_flow: g21.pdf p.36 예시답안 문제 4(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $n^2$개의 합동인 정삼각형으로 분할된 정삼각형 OAB에는 $\displaystyle\sum_{k=1}^{n+1}k=\dfrac{(n+1)(n+2)}{2}$개의 꼭짓점이 있다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        한 번 지난 점은 다시 지나지 않고 모든 꼭짓점을 지나는 경로가 존재하면 이 경로가 가장 긴 경로이고, 이 경로에는 길이가 1인 선분이 $\dfrac{(n+1)(n+2)}{2}-1=\dfrac{n(n+3)}{2}$개 있다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        이제 점 B에서 점 A로 가는 길이가 $\dfrac{n(n+3)}{2}$인 경로가 존재함을 보이자. $x$축과 평행한 선분은 $\dfrac{n(n+1)}{2}$개가 있다. $x$축과 평행한 모든 선분을 변 OB 또는 AB 위의 $n$개의 선분을 이용해 연결하여 B에서 A로 가는 하나의 경로로 만들면 길이가 $\dfrac{n(n+3)}{2}$인 경로가 된다. (다른 형태의 경로를 제시해도 됨.) [그림 3: $n=5$인 경우 B에서 A로 가는 최장경로 예시 3가지. 첫째 그림은 $x$축에 평행한 선분을 모두 지나며 변 OB, AB 위의 선분으로 번갈아 연결한 경로이고, 나머지 둘은 같은 길이의 다른 형태의 경로]
      criteria:
      - 3.R1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        꼭짓점의 개수 $\frac{(n+1)(n+2)}2$를 구했다.
      depends_on: []
      steps:
      - 3b-1
      implied_ok: false
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        모든 꼭짓점을 지나는 경로가 가장 길며 길이가 $\frac{n(n+3)}2$임을 보였다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
      implied_ok: false
    - id: 3.R1
      mark_type: R
      points: 4
      evidence: |
        길이 $\frac{n(n+3)}2$인 경로가 실제로 존재함을 예(그림 또는 구성)로 보였다.
      depends_on:
      - 3.M2
      steps:
      - 3b-3
