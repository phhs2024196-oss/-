elements:
  materials:
  - 한 변의 길이가 1인 $n^2$개의 합동인 정삼각형으로 분할된 정삼각형 OAB (그림 $\mathrm{R}_n$)
  - B에서 점 $(k,0)$에 이르는 최단 경로의 개수 $f(k)$
  - $g(n)=\sum_{k=0}^{n}f(k)$
  concepts:
  - 최단 경로의 수와 조합
  - 이항정리 $\sum_{k=0}^{n}{}_n\mathrm{C}_k=2^n$
  - 등비급수의 합
  - 한 번 지난 점을 다시 지나지 않는 최장 경로(꼭짓점 수)
  tools:
  - $a$($n-k$개), $b$($k$개)를 일렬로 나열하는 같은 것이 있는 순열 ${}_n\mathrm{C}_k$
  - $\displaystyle\sum_{n=1}^{\infty}\dfrac1{2^n}=\dfrac{\frac12}{1-\frac12}=1$
  - 꼭짓점의 수 $\displaystyle\sum_{k=1}^{n+1}k=\dfrac{(n+1)(n+2)}2$
  - $x$축에 평행한 선분 $\frac{n(n+1)}{2}$개를 이용한 경로 구성
  conditions:
  - $n$은 자연수, $k=0,1,\cdots,n$
  - (3) 한 번 지난 점은 다시 지나지 않고 B에서 A로 가는 경로
  stimuli_used: []
  subpart_links: (1)의 $f(k)$를 (2)에서 합하여 $g(n)$을 구한다. (3)은 (1)(2)와 독립
