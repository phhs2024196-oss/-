      points: 2
      evidence: |
        $a_n=\pi\left(\cos\dfrac{\pi}{n}\right)^2$, $b_n=2\pi\cos\dfrac{\pi}{n}$를 구했다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: |
        $b_6-2a_6=\dfrac{\pi(2\sqrt3-3)}{2}$를 구했다.
      depends_on:
