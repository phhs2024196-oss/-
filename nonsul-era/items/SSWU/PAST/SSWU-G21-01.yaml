stem: |
  중심이 점 $\mathrm{O}$이고 반지름의 길이가 $1$인 원에 내접하는 정$n$각형에서 이웃한 두 꼭짓점을 각각 $\mathrm{P}_n$, $\mathrm{Q}_n$이라고 하고, 점 $\mathrm{O}$에서 선분 $\mathrm{P}_n\mathrm{Q}_n$에 내린 수선의 발을 $\mathrm{R}_n$이라고 하자. 이 정$n$각형에 내접하는 원 $\mathrm{O}_n$의 넓이를 $a_n$, 둘레의 길이를 $b_n$이라 하자. (단, $n$은 $3$ 이상의 자연수)

  [그림 1: 반지름 1인 원에 정삼각형($n=3$), 정사각형($n=4$), 정오각형($n=5$)이 각각 내접하고 그 안에 내접원 $\mathrm{O}_n$이 그려져 있다. 꼭짓점 $\mathrm{P}_n$은 원의 위쪽 끝, $\mathrm{Q}_n$은 이웃한 왼쪽 꼭짓점이며, 선분 $\mathrm{P}_n\mathrm{Q}_n$이 내접원에 접하는 점이 $\mathrm{R}_n$이다. 직각삼각형 $\mathrm{OP}_n\mathrm{R}_n$이 색칠되어 있다.]

  다음 물음에 답하시오. [총25점]
