        중심 $\mathrm{O}$ 주위의 중심각 $2\pi$를 $n$등분하여 $\angle\mathrm{P}_n\mathrm{OQ}_n=\frac{2\pi}{n}$이므로, $\angle\mathrm{P}_n\mathrm{OR}_n=\frac12\times\frac{2\pi}{n}=\frac{\pi}{n}$이고, $\mathrm{OP}_n=1$,
