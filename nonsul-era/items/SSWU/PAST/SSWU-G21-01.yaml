  - $\mathrm{OP}_n=1$, $\mathrm{P}_n\mathrm{R}_n=\sin\frac{\pi}{n}$, $\mathrm{OR}_n=\cos\frac{\pi}{n}$
  - $\dfrac{1-\cos x}{x^2}=\dfrac{\sin^2x}{x^2(1+\cos x)}$, $x=\frac{\pi}{n}$로 치환
  conditions:
