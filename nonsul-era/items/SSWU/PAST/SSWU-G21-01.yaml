- id: '3'
  stem: |
    $\displaystyle\lim_{n\to\infty}n^2(b_n-2a_n)$을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: pi**3
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $n^2(b_n-2a_n)=2\pi^3\cos\frac{\pi}{n}\cdot\dfrac{1-\cos\frac{\pi}{n}}{(\pi/n)^2}$로 바꾸고 $\lim_{x\to0}\frac{1-\cos x}{x^2}=\frac12$를 쓴다.
    steps:
    - id: 3a
      content: $2\pi^3\times1\times\frac12=\pi^3$
      criteria:
      - 3.M1
      - 3.B1
      - 3.M2
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g22.pdf p.50 예시답안 문제 1(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $n^2(b_n-2a_n)=n^2\left(2\pi\cos\frac{\pi}{n}-2\pi\left(\cos\frac{\pi}{n}\right)^2\right)=2\pi^3\times\cos\frac{\pi}{n}\times\dfrac{1-\cos\frac{\pi}{n}}{\left(\frac{\pi}{n}\right)^2}$이고,
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $x=\frac{\pi}{n}$로 두면 $\lim_{x\to0}\cos x=1$이므로 $\lim_{n\to\infty}\cos\frac{\pi}{n}=1$이고,
      criteria:
      - 3.B1
    - id: 3b-3
      content: |
        $\lim_{x\to0}\dfrac{1-\cos x}{x^2}=\lim_{x\to0}\dfrac{1-\cos^2x}{x^2(1+\cos x)}=\lim_{x\to0}\dfrac{\sin^2x}{x^2(1+\cos x)}$인데, 여기에서 $\lim_{x\to0}\dfrac{\sin x}{x}=1$이므로 $\lim_{x\to0}\dfrac{1-\cos x}{x^2}=\left(\lim_{x\to0}\dfrac{\sin x}{x}\right)^2\times\lim_{x\to0}\dfrac{1}{1+\cos x}=1^2\times\dfrac12=\dfrac12$이다.
      criteria:
      - 3.M2
    - id: 3b-4
      content: |
        따라서 $\lim_{n\to\infty}\dfrac{1-\cos\frac{\pi}{n}}{\left(\frac{\pi}{n}\right)^2}=\dfrac12$이므로 $\lim_{n\to\infty}n^2(b_n-2a_n)=2\pi^3\times1\times\dfrac12=\pi^3$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $n^2(b_n-2a_n)=2\pi^3\cos\dfrac{\pi}{n}\cdot\dfrac{1-\cos\frac{\pi}{n}}{\left(\frac{\pi}{n}\right)^2}$로 변형했다.
      steps:
      - 3b-1
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        $x=\dfrac{\pi}{n}$로 치환하여 $\lim_{n\to\infty}\cos\dfrac{\pi}{n}=1$임을 보였다.
      steps:
      - 3b-2
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: |
        $\lim_{x\to0}\dfrac{1-\cos x}{x^2}=\dfrac12$임을 $\lim_{x\to0}\dfrac{\sin x}{x}=1$로 보였다.
      steps:
      - 3b-3
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: |
        극한값 $\pi^3$을 구했다.
      depends_on:
      - 3.M1
      - 3.M2
      steps:
      - 3b-4
