  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 내접원의 반지름은 $\mathrm{OR}_n=\cos\frac{\pi}{n}$이므로 $a_n=\pi\cos^2\frac{\pi}{n}$, $b_n=2\pi\cos\frac{\pi}{n}$.
    steps:
    - id: 2a
      content: $b_6-2a_6=\frac{\pi(2\sqrt3-3)}{2}$
      criteria:
      - 2.B1
      - 2.M1
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g22.pdf p.50 예시답안 문제 1(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        정$n$각형에 내접하는 원 $\mathrm{O}_n$의 반지름의 길이는 $\mathrm{OR}_n=\cos\frac{\pi}{n}$이므로, 원 $\mathrm{O}_n$의 넓이는 $a_n=\pi\left(\cos\frac{\pi}{n}\right)^2$이고, 둘레의 길이는 $b_n=2\pi\cos\frac{\pi}{n}$이다.
      criteria:
      - 2.B1
      - 2.M1
    - id: 2b-2
      content: |
        따라서 $b_6-2a_6=2\pi\cos\frac{\pi}{6}-2\pi\left(\cos\frac{\pi}{6}\right)^2=\pi\sqrt3-\frac32\pi=\frac{\pi(2\sqrt3-3)}{2}$이다. (다른 방법: $n=6$을 먼저 대입하면 $\mathrm{OR}_6=\frac{\sqrt3}{2}$, $a_6=\frac{3\pi}{4}$, $b_6=\pi\sqrt3$이므로 같은 값이다.)
      criteria:
      - 2.A1
  rubric:
