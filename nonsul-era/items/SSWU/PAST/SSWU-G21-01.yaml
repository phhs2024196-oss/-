intent: |
  직각삼각형에서의 삼각비의 개념을 바탕으로 직각삼각형의 넓이, 원의 넓이와 둘레의 길이에 대한 수열의 일반항을 나타낼 수 있고, 미적분에서 다루는 삼각함수의 극한에 대한 성질을 통합적으로 활용하는 문제해결능력을 평가한다. 문제를 정확히 이해하고 필요한 성질을 적용하여 해결하는 단계를 논리적으로 서술할 수 있는지도 평가한다.
key_idea: $\angle\mathrm{P}_n\mathrm{OR}_n=\frac{\pi}{n}$이므로 $\mathrm{OR}_n=\cos\frac{\pi}{n}$이고 $a_n=\pi\cos^2\frac{\pi}{n}$, $b_n=2\pi\cos\frac{\pi}{n}$이다. $n^2(b_n-2a_n)=2\pi^3\cos\frac{\pi}{n}\cdot\dfrac{1-\cos\frac{\pi}{n}}{(\pi/n)^2}$이고 $\lim_{x\to0}\dfrac{1-\cos x}{x^2}=\dfrac12$이다.
stuck: (3)에서 $1-\cos\frac{\pi}{n}$을 $\left(\frac{\pi}{n}\right)^2$으로 나눈 꼴로 바꾸어 $\lim_{x\to0}\frac{1-\cos x}{x^2}$를 이용하는 단계
