    - $a=\pi$, $b=-5$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x=1$에서 연속이므로 $-b=4-\cos\pi=5$, $F(1)=\int_0^1(a\sin\pi t-5\cos\pi t)dt=\frac{2a}{\pi}=2$.
    steps:
    - id: 2a
      content: $b=-5$, $a=\pi$
      criteria:
      - 2.M1
      - 2.A1
      - 2.M2
      - 2.A2
  - id: S2-B
    audience: B
    source_flow: g22.pdf p.51 예시답안 문제 2(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        구간 $[0,1]$에서 $f(x)=a\sin\pi x+b\cos\pi x$이므로 $f(1)=b\cos\pi=-b$이며,
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        구간 $[1,2]$에서 $f(x)=4-\cos\pi x$이므로 $f(1)=4-\cos\pi=4-(-1)=5$이다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        이때 $f$가 $x=1$에서 연속이므로 $b=-5$이다.
      criteria:
      - 2.A1
    - id: 2b-4
      content: |
        그리고 조건 (다)에 의하여 $2=F(1)=\displaystyle\int_0^1(a\sin\pi t-5\cos\pi t)\,dt=\left[-\frac a\pi\cos\pi t-\frac5\pi\sin\pi t\right]_0^1=\frac{2a}{\pi}$이므로 $a=\pi$이다.
      criteria:
      - 2.M2
      - 2.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
