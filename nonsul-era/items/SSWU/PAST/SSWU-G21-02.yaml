- id: '3'
  stem: |
    $F\left(\dfrac12\right)+F\left(\dfrac32\right)$의 값을 구하시오.
  points: 7
  depends_on:
  - '1'
  - '2'
  answer:
    kind: expression
    value: 5 - 4/pi
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $F\left(\frac12\right)=1-\frac5\pi$, $F\left(\frac32\right)=F(1)+\int_1^{3/2}(4-\cos\pi t)\,dt=4+\frac1\pi$.
    steps:
    - id: 3a
      content: $5-\frac4\pi$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g22.pdf p.51 예시답안 문제 2(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $F\left(\frac12\right)=\displaystyle\int_0^{\frac12}f(t)\,dt=\int_0^{\frac12}(\pi\sin\pi t-5\cos\pi t)\,dt=\left[-\cos\pi t-\frac5\pi\sin\pi t\right]_0^{\frac12}=-\frac5\pi+1$
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $F\left(\frac32\right)=\displaystyle\int_0^{\frac32}f(t)\,dt=\int_0^1f(t)\,dt+\int_1^{\frac32}(4-\cos\pi t)\,dt$
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $=F(1)+\left[4t-\frac1\pi\sin\pi t\right]_1^{\frac32}=2+2+\frac1\pi=4+\frac1\pi$
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        따라서 $F\left(\frac12\right)+F\left(\frac32\right)=5-\frac4\pi$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
