      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $f(1)=-b$와 $f(1)=5$(좌극한·우극한)를 구했다.
      steps:
      - 2b-1
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        연속성으로 $b=-5$를 구했다.
      depends_on: &id001
      - 2.M1
      - 2.M2
      steps:
      - 2b-3
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $F(1)=\displaystyle\int_0^1(a\sin\pi t-5\cos\pi t)\,dt=\dfrac{2a}{\pi}$를 계산했다.
      steps:
      - 2b-4
    - id: 2.A2
      mark_type: A
      points: 2
      evidence: |
        $a=\pi$를 구했다.
      depends_on: *id001
      steps:
      - 2b-4
