      points: 2
      evidence: |
        $F\left(\dfrac32\right)=\displaystyle\int_0^1f+\int_1^{\frac32}(4-\cos\pi t)\,dt$로 구간을 나누었다.
      steps:
      - 3b-2
    - id: 3.M3
      mark_type: M
      points: 1
      evidence: |
        $F\left(\dfrac32\right)=4+\dfrac1\pi$를 계산했다.
      steps:
