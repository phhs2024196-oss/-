stimuli: []
stem: |
  구간 $[0,2]$에서 연속인 함수 $f(x)$에 대하여 $F(x)=\displaystyle\int_0^xf(t)\,dt$로 정의할 때 다음 조건이 모두 성립한다고 하자.

  (가) $1\le x\le2$이면 $f(x)\le4-\cos\pi x$이다.

  (나) $0\le x\le1$이면 $f(x)=a\sin\pi x+b\cos\pi x$이다. ($a$, $b$는 상수)

  (다) $F(1)=2$, $F(2)=6$

  다음 물음에 답하시오. [총25점]
subparts:
- id: '1'
  stem: |
    $f\left(\dfrac32\right)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g=4-\cos\pi x-f\ge0$이고 $G(1)=G(2)$이므로 $G$는 $[1,2]$에서 상수, 따라서 $g=0$.
    steps:
    - id: 1a
      content: $f(x)=4-\cos\pi x$ ($1\le x\le2$) $\Rightarrow f\left(\frac32\right)=4$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.R1
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g22.pdf p.51 예시답안 문제 2(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        구간 $[1,2]$에서 연속인 함수 $g(x)=4-\cos\pi x-f(x)$에 대하여 조건 (가)에 의하여 $g(x)\ge0$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $G(x)=\displaystyle\int_0^xg(t)\,dt$로 두면 $1\le a<b\le2$일 때 $G(b)-G(a)=\displaystyle\int_a^bg(t)\,dt\ge0$, 즉 $G(a)\le G(b)$가 성립한다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        그런데 조건 (다)에 의하여 $G(1)=\displaystyle\int_0^1(4-\cos\pi t-f(t))\,dt=\left[4t-\frac1\pi\sin\pi t\right]_0^1-F(1)=4-2=2$, $G(2)=\displaystyle\int_0^2(4-\cos\pi t-f(t))\,dt=\left[4t-\frac1\pi\sin\pi t\right]_0^2-F(2)=8-6=2$,
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        즉 $G(1)=2=G(2)$이므로 $1\le x\le2$인 모든 $x$에 대하여 $G(x)=2$인 상수함수이다. ($G$가 $[1,2]$에서 증가하는데 양 끝값이 같기 때문이다.)
      criteria:
      - 1.R1
    - id: 1b-5
      content: |
        따라서 $1<x<2$인 모든 $x$에 대하여 $0=G^{\prime}(x)=g(x)=4-\cos\pi x-f(x)$이고, $f(x)=4-\cos\pi x$이다. 그러므로 $f\left(\frac32\right)=4$이다.
      criteria:
      - 1.A1
