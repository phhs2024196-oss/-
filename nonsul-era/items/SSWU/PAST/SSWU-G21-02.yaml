intent: |
  미적분에서 다루는 삼각함수의 미분과 적분을 이해하며, 연속함수의 정적분의 기하학적 의미 또는 함수의 증감에 관한 성질을 파악하여 함수를 정할 수 있고, 적분과 미분의 관계를 이용하는 통합적 문제해결능력을 평가한다. 문제 상황을 정확히 이해하고 주어진 조건을 종합하여 추론할 수 있는지, 그 과정을 논리적으로 서술할 수 있는지도 평가한다.
key_idea: $g(x)=4-\cos\pi x-f(x)\ge0$, $G(x)=\int_0^xg$가 $[1,2]$에서 증가하는데 $G(1)=G(2)=2$이므로 $G$는 상수이고 $g=0$, 곧 $[1,2]$에서 $f(x)=4-\cos\pi x$이다. 연속성으로 $b=-5$, $F(1)=2$로 $a=\pi$를 구한다.
stuck: (1)에서 $g=4-\cos\pi x-f$의 적분 $G$가 $G(1)=G(2)$인 증가함수임을 이용해 $f=4-\cos\pi x$로 결론짓는 단계
