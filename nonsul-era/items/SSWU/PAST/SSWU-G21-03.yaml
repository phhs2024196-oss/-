      mark_type: B
      points: 2
      evidence: |
        $\overline{\mathrm{AB}}=2\pi\sqrt3$을 구했다.
      steps:
      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: |
        접선 조건과 $\mathrm{BC}\parallel x$축으로 $\angle\mathrm{P}_0\mathrm{O}_1\mathrm{O}_0=\dfrac\pi6$을 보였다.
      steps:
      - 1b-2
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $\angle\mathrm{P}_0\mathrm{O}_1\mathrm{P}_1=\dfrac{2\pi}{3}$, 호 $\mathrm{P}_0\mathrm{P}_1=r\times\dfrac{2\pi}{3}$을 구했다.
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        $r=3\sqrt3$을 구했다.
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-4
