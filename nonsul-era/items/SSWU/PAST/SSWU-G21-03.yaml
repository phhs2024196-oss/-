- id: '3'
  stem: |
    위의 그림과 같이 원 $C_1$ 위의 점 $\mathrm{R}$와 원 $C_2$ 위의 점 $\mathrm{S}$를 연결한 직선이 두 원 $C_1$과 $C_2$에 동시에 접하고, 점 $\mathrm{Q}$는 두 원 $C_1$과 $C_2$의 두 교점 중 $\mathrm{P}_1$이 아닌 점이다. 선분 $\mathrm{RS}$, 호 $\mathrm{RQ}$, 호 $\mathrm{QS}$로 둘러싸인 색칠된 도형의 넓이를 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: 9*(9*sqrt(3) - 4*pi)/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 직사각형 $\mathrm{RSO}_2\mathrm{O}_1$에서 부채꼴 $\mathrm{O}_1\mathrm{RQ}$, $\mathrm{O}_2\mathrm{QS}$와 삼각형 $\mathrm{O}_1\mathrm{QO}_2$를 뺀다.
    steps:
    - id: 3a
      content: $27\sqrt3-9\pi-\frac{27\sqrt3}{4}=\frac94(9\sqrt3-4\pi)$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.M4
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g22.pdf p.52 예시답안 문제 3(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        구하는 도형의 넓이는 사각형 $\mathrm{RSO}_2\mathrm{O}_1$의 넓이에서 부채꼴 $\mathrm{O}_1\mathrm{RQ}$의 넓이와 부채꼴 $\mathrm{O}_2\mathrm{QS}$의 넓이, 그리고 삼각형 $\mathrm{O}_1\mathrm{QO}_2$의 넓이의 합을 빼면 된다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        사각형 $\mathrm{RSO}_2\mathrm{O}_1$의 넓이: 주어진 사각형은 직각사각형이고 $\overline{\mathrm{O}_1\mathrm{O}_2}=\overline{\mathrm{P}_0\mathrm{P}_1}$, $\overline{\mathrm{O}_1\mathrm{R}}=r$이므로 $\overline{\mathrm{O}_1\mathrm{O}_2}\times\overline{\mathrm{O}_1\mathrm{R}}=9\times3\sqrt3=27\sqrt3$
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        부채꼴 $\mathrm{O}_1\mathrm{RQ}$와 부채꼴 $\mathrm{O}_2\mathrm{QS}$의 넓이는 같고 이 부채꼴의 반지름의 길이는 $r=3\sqrt3$, 중심각은 $\frac\pi3$이므로 각각의 넓이는 $\frac12r^2\theta=\frac12\times(3\sqrt3)^2\times\frac\pi3=\frac{9\pi}{2}$
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        $\triangle\mathrm{O}_1\mathrm{QO}_2$의 넓이: $\frac12\times\overline{\mathrm{PQ}}\times r\sin\frac\pi6=\frac12\times9\times3\sqrt3\times\frac12=\frac{27\sqrt3}{4}$ (보충: 공식 해설의 $\overline{\mathrm{PQ}}$는 계산상 $\overline{\mathrm{O}_1\mathrm{O}_2}=9$를 뜻한다. 원문 표기 그대로 둔다.)
      criteria:
      - 3.M4
    - id: 3b-5
      content: |
        따라서 구하는 넓이는 $\frac{81\sqrt3}{4}-9\pi=\frac94\times(9\sqrt3-4\pi)$이다.
      criteria:
      - 3.A1
