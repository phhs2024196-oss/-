stimuli: []
stem: |
  아래 그림과 같이 반지름의 길이가 $2\pi$인 원에 내접하는 정삼각형 $\mathrm{ABC}$를 다음 세 조건을 만족하는 반지름의 길이가 $r$인 원의 호로 이루어진 길 위로 굴리려고 한다.

  (가) 정수 $n$에 대하여 원 $C_n$은 $x$축 위에 차례대로 놓인 점 $\mathrm{O}_n$을 중심으로 하고 반지름의 길이가 $r$인 원이고, 선분 $\mathrm{O}_n\mathrm{O}_{n+1}$의 길이는 $n$의 값과 관계없이 모두 같다.

  (나) 원 $C_n$과 원 $C_{n+1}$의 두 교점 중 $x$축 위쪽에서 만나는 점을 $\mathrm{P}_n$이라 할 때, 중심각의 크기가 $\pi$보다 작은 부채꼴 $\mathrm{O}_n\mathrm{P}_n\mathrm{P}_{n-1}$의 호 $\mathrm{P}_{n-1}\mathrm{P}_n$의 길이는 정삼각형 $\mathrm{ABC}$의 한 변 $\mathrm{AB}$의 길이와 같다.

  (다) 정삼각형 $\mathrm{ABC}$의 한 꼭짓점 $\mathrm{A}$가 점 $\mathrm{P}_0$에 있을 때, 직선 $\mathrm{AB}$는 원 $C_1$에 접하고, 직선 $\mathrm{AC}$는 원 $C_0$에 접한다.

  [그림 1: $x$축 위에 점 $\mathrm{O}_0,\mathrm{O}_1,\mathrm{O}_2,\mathrm{O}_3$가 왼쪽부터 같은 간격으로 놓여 있고, 각 점을 중심으로 하는 원 $C_n$(점선)이 이웃한 원과 겹친다. 이웃한 두 원의 위쪽 교점 $\mathrm{P}_0$, $\mathrm{P}_1$, $\mathrm{P}_2$를 잇는 호(실선)가 $x$축 위쪽에 물결 모양 길을 이룬다. 점 $\mathrm{A}=\mathrm{P}_0$ 위에 정삼각형 $\mathrm{ABC}$(꼭짓점 $\mathrm{C}$가 왼쪽 위, $\mathrm{B}$가 오른쪽 위, $\mathrm{BC}$는 $x$축과 평행)가 놓여 있고 선분 $\mathrm{O}_0\mathrm{A}$가 그려져 있다. 아래쪽에는 원 $C_1$ 위의 점 $\mathrm{R}$(점 $\mathrm{O}_1$ 바로 아래)과 원 $C_2$ 위의 점 $\mathrm{S}$(점 $\mathrm{O}_2$ 바로 아래)를 잇는 선분 $\mathrm{RS}$, 두 원의 아래쪽 교점 $\mathrm{Q}$가 있고, 선분 $\mathrm{RS}$와 호 $\mathrm{RQ}$, 호 $\mathrm{QS}$로 둘러싸인 도형이 색칠되어 있다.]

  다음 물음에 답하시오. [총25점]
subparts:
- id: '1'
  stem: |
    선분 $\mathrm{AB}$의 길이와 반지름의 길이 $r$ (선분 $\mathrm{O}_n\mathrm{P}_n$의 길이)를 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: AB = 2*pi*sqrt(3); r = 3*sqrt(3)
    equivalents:
    - $\overline{\mathrm{AB}}=2\sqrt3\pi$, $r=3\sqrt3$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{AB}}=2\cdot2\pi\sin\frac\pi3$. 접선 조건과 $\mathrm{BC}\parallel x$축으로 $\angle\mathrm{P}_0\mathrm{O}_1\mathrm{P}_1=\frac{2\pi}{3}$, 호의 길이 $=\overline{\mathrm{AB}}$.
    steps:
    - id: 1a
      content: $r\cdot\frac{2\pi}{3}=2\pi\sqrt3\Rightarrow r=3\sqrt3$
      criteria:
      - 1.B1
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g22.pdf p.51 예시답안 문제 3(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        반지름의 길이가 $2\pi$인 원에 내접하는 삼각형 $\mathrm{ABC}$의 한 변의 길이는 $\overline{\mathrm{AB}}=2\times2\pi\times\sin\frac\pi3=2\times2\pi\times\cos\frac\pi6=2\pi\sqrt3$이다.
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        직선 $\mathrm{AB}$가 점 $\mathrm{P}_0$에서 원 $C_1$에 접하므로 직선 $\mathrm{AB}$와 직선 $\mathrm{O}_1\mathrm{P}_0$은 서로 수직이고 직선 $\mathrm{BC}$와 $x$축은 서로 평행하므로 각 $\mathrm{P}_0\mathrm{O}_1\mathrm{O}_0$의 크기는 $\frac\pi6$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        그러므로 각 $\mathrm{P}_0\mathrm{O}_1\mathrm{P}_1$의 크기는 $\frac{2\pi}{3}$이고 호 $\mathrm{P}_0\mathrm{P}_1$의 길이는 $r\times\frac{2\pi}{3}$이다.
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        문제의 조건으로부터 선분 $\mathrm{AB}$의 길이와 호 $\mathrm{P}_0\mathrm{P}_1$의 길이가 같으므로 $2\pi\sqrt3=r\times\frac{2\pi}{3}$이고 이로부터 $r=3\sqrt3$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
