intent: |
  호도법과 삼각함수의 관계를 이용하여 주어진 길이에 대응하는 원의 중심각, 주어진 원에 내접하는 삼각형의 한 변의 길이, 주어진 중심각에 대응하는 현의 길이를 구하고, 주어진 도형을 계산 가능한 도형으로 분할하여 도형의 넓이를 구하는 문제풀이 능력을 복합적으로 측정한다.
key_idea: $\overline{\mathrm{AB}}=2\pi\sqrt3$이고 접선 조건에서 $\angle\mathrm{P}_0\mathrm{O}_1\mathrm{P}_1=\frac{2\pi}{3}$이므로 $r\cdot\frac{2\pi}{3}=2\pi\sqrt3$에서 $r=3\sqrt3$. 현 $\mathrm{P}_0\mathrm{P}_1=9$이므로 $\mathrm{AA}^{\prime}=27$, 색칠 도형은 직사각형에서 부채꼴 둘과 삼각형을 뺀다.
stuck: (1)에서 접선 조건과 $\mathrm{BC}\parallel x$축으로 $\angle\mathrm{P}_0\mathrm{O}_1\mathrm{O}_0=\frac\pi6$을 얻는 단계
