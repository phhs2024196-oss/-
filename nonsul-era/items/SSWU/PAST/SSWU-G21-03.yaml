- id: '2'
  stem: |
    조건 (가)~(다)를 만족하는 원의 호로 이루어진 길을 따라 정삼각형 $\mathrm{ABC}$가 한 바퀴 굴렀을 때 점 $\mathrm{A}$가 점 $\mathrm{A}^{\prime}$으로 옮겨졌다. 선분 $\mathrm{AA}^{\prime}$의 길이를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '27'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 현 $\mathrm{P}_0\mathrm{P}_1=2\cdot3\sqrt3\sin\frac\pi3=9$이고 한 바퀴 구르면 $\mathrm{A}$가 세 칸 이동한다.
    steps:
    - id: 2a
      content: $\overline{\mathrm{AA}^{\prime}}=3\times9=27$
      criteria:
      - 2.M1
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g22.pdf p.52 예시답안 문제 3(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        선분 $\mathrm{P}_0\mathrm{P}_1$의 길이는 반지름의 길이가 $3\sqrt3$인 원의 중심각 $\frac{2\pi}{3}$에 대응하는 현의 길이이므로 $2\times3\sqrt3\times\sin\frac\pi3=9$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서 $\triangle\mathrm{ABC}$가 주어진 길을 따라 한 바퀴 돌 때 선분 $\mathrm{AA}^{\prime}$의 길이는 $3\times\overline{\mathrm{P}_0\mathrm{P}_1}=3\times9=27$이다.
      criteria:
      - 2.A1
