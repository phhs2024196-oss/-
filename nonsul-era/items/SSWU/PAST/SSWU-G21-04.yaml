intent: |
  평면에 제시된 도형 위에 놓인 $x$, $y$좌표가 모두 정수인 점의 개수를 집합, 경우의 수, 수열의 합 등을 적절히 활용하여 구하는 능력을 측정한다. 주어진 문제를 해결하기 위한 방법을 고안하고 경우를 잘 나누어 원하는 답을 구체적으로 계산할 수 있는지 평가한다.
key_idea: '$x=n$ 위의 격자점 개수를 구간별로 세어 합한다: (1) $x=n$마다 $n+1$ 또는 $21-n$개, (2) $x=k$마다 $2n-2\lvert k\rvert+1$개, (3) $x=2s+1$, $y=2t+2$로 두고 소수 $z$로 나누어 센다.'
stuck: (3)에서 홀수 $x$, 짝수 $y$를 $2s+1$, $2t+2$로 두어 $2s+2t+z=17$로 바꾸고 소수 $z$로 경우를 나누는 단계
