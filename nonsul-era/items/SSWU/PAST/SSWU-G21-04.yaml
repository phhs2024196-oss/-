    audience: A
    method_no: 1
    key_idea: $x=2s+1$, $y=2t+2$로 두면 $2s+2t+z=17$이므로 $z\in\{3,5,7,11,13,17\}$마다 $s+t=(17-z)/2$의 해를 센다.
    steps:
    - id: 3a
      content: $8+7+6+4+3+1=29$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.M4
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g22.pdf p.53 예시답안 문제 4(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        음이 아닌 정수 $s$, $t$에 대해 $x=2s+1$, $y=2t+2$라 두면
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $(2s+1)+(2t+2)+z=20$으로부터 $2s+2t+z=17$을 만족하는 음이 아닌 정수 $s$, $t$와 소수 $z$의 쌍의 개수를 구하면 된다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $z$는 $17$보다 작거나 같은 홀수인 소수이므로 $3$, $5$, $7$, $11$, $13$, $17$ 중 하나이다.
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        $z=3$인 경우: $s+t=7$인 음이 아닌 정수해의 개수는 $8$개, $z=5$인 경우: $s+t=6$인 음이 아닌 정수해의 개수는 $7$개, $z=7$인 경우: $s+t=5$인 음이 아닌 정수해의 개수는 $6$개, $z=11$인 경우: $s+t=3$인 음이 아닌 정수해의 개수는 $4$개, $z=13$인 경우: $s+t=2$인 음이 아닌 정수해의 개수는 $3$개, $z=17$인 경우: $s+t=0$인 음이 아닌 정수해의 개수는 $1$개
      criteria:
      - 3.M4
    - id: 3b-5
      content: |
        따라서 구하는 수는 $8+7+6+4+3+1=29$이다.
      criteria:
      - 3.A1
