    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x=n$ 위의 격자점을 $0\le n\le10$에서 $n+1$개, $11\le n\le20$에서 $21-n$개로 센다.
    steps:
    - id: 1a
      content: $\sum_{n=0}^{10}(n+1)+\sum_{n=11}^{20}(21-n)=121$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g22.pdf p.52 예시답안 문제 4(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $0\le n\le20$인 정수 $n$에 대하여 주어진 도형의 둘레와 내부에 놓인 각 좌표가 정수인 순서쌍 중 $x=n$인 점의 개수를 세면 직선 $\mathrm{PR}$의 방정식은 $2x+y=20$, 직선 $\mathrm{QR}$의 방정식은 $x+y=20$이므로
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $0\le n\le10$인 경우 $n+1$개, $11\le n\le20$인 경우 $21-n$개를 만족한다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        따라서 구하고자 하는 각 좌표가 정수인 점의 개수는 $\displaystyle\sum_{n=0}^{10}(n+1)+\sum_{n=11}^{20}(21-n)=2\sum_{n=1}^{10}n+11=121$개이다.
      criteria:
      - 1.A1
