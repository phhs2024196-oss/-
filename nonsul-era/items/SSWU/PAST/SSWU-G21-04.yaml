- id: '2'
  stem: |
    자연수 $n$에 대하여 좌표평면 위의 네 점 $\mathrm{A}(n,0)$, $\mathrm{B}(0,n)$, $\mathrm{C}(-n,0)$, $\mathrm{D}(0,-n)$을 꼭짓점으로 하는 정사각형 $\mathrm{ABCD}$의 둘레와 내부에 놓여 있는 $x$, $y$좌표가 모두 정수인 점의 개수를 $N(n)$이라 할 때, $\displaystyle\sum_{k=1}^{11}N(k)$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '1155'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x=k$ 위 격자점은 $2n-2\lvert k\rvert+1$개이므로 $N(n)=2n^2+2n+1$.
    steps:
    - id: 2a
      content: $\sum_{k=1}^{11}(2k^2+2k+1)=1155$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g22.pdf p.53 예시답안 문제 4(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $-n\le k\le n$인 정수 $k$에 대하여 정사각형 $\mathrm{ABCD}$의 둘레와 내부에 놓인 각 좌표가 정수인 점 중 $x=k$인 점의 개수는 $2n-2\lvert k\rvert+1$개다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서 $N(n)=\displaystyle\sum_{k=-n}^{n}(2n-2\lvert k\rvert+1)=2n+1+2\sum_{k=1}^{n}(2n-2k+1)=2n^2+2n+1$이고, 이로부터
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $\displaystyle\sum_{k=1}^{n}N(k)=2\times\frac{n(n+1)(2n+1)}{6}+2\times\frac{n(n+1)}{2}+n$이다. $n=11$인 경우 계산하면 $1155$이다.
      criteria:
      - 2.M3
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $x=k$ 위의 점의 개수 $2n-2\lvert k\rvert+1$을 구했다.
      steps:
      - 2b-1
    - id: 2.M2
