      points: 2
      evidence: |
        $N(n)=2n^2+2n+1$을 구했다.
      steps:
      - 2b-2
    - id: 2.M3
      mark_type: M
      points: 2
      evidence: |
        $\displaystyle\sum_{k=1}^{n}N(k)$의 공식을 세웠다.
      steps:
      - 2b-3
    - id: 2.A1
