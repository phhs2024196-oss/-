- id: '3'
  stem: |
    $x+y+z=20$을 만족하는 자연수 $x$, $y$, $z$에 대하여 $x$는 홀수, $y$는 짝수, $z$는 소수인 순서쌍 $(x,y,z)$의 개수를 구하시오.
