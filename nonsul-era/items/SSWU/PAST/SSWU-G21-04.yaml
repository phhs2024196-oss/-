  - $N(n)=\sum_{k=-n}^{n}(2n-2\lvert k\rvert+1)=2n^2+2n+1$
  - $x=2s+1$, $y=2t+2$ ($s,t\ge0$)로 두어 $2s+2t+z=17$
  conditions:
