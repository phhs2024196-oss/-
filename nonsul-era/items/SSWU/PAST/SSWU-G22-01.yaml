- id: '3'
  stem: |-
    $g(x)=\dfrac12\left\{f\left(\dfrac13-x\right)+f\left(\dfrac13+x\right)\right\}$라 하고, 모든 실수 $k$에 대해 함수 $p(k)$를 집합

    $$\{x\mid\lvert f(x)-g(x)\rvert=k,\ x\text{는 실수}\}$$

    의 원소의 개수라고 정의하자. 함수 $p(k)$를 구하고, 이 함수가 불연속이 되게 하는 $k$의 값을 모두 찾으시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: pneg=0; pzero=3; pmid=6; pone=4; phigh=2; disc=0,1/108
    equivalents:
    - $p(k)=0\ (k<0)$, $p(0)=3$, $p(k)=6\ \left(0<k<\frac1{108}\right)$, $p\left(\frac1{108}\right)=4$, $p(k)=2\ \left(k>\frac1{108}\right)$; 불연속인 $k=0,\frac1{108}$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: (2)로 $g(x)=f\left(\frac13\right)=\frac1{108}$. $y=\lvert f(x)-\frac1{108}\rvert$와 $y=k$의 교점 수를 구간별로 센다.
    steps:
    - id: 3a
      content: $p(k)=0,3,6,4,2$ ($k<0$, $k=0$, $0<k<\frac1{108}$, $k=\frac1{108}$, $k>\frac1{108}$) $\Rightarrow$ 불연속 $k=0,\frac1{108}$
      criteria:
      - 3.M1
      - 3.B1
      - 3.B2
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g23.pdf p.53 예시답안 문제 1(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: 위로부터 $g(x)=f\left(\dfrac13\right)=\dfrac1{108}$임을 알 수 있다. 따라서, $k$의 값이 주어졌을 때, $y=\left\lvert f(x)-f\left(\dfrac13\right)\right\rvert$의 그래프와 $y=k$의 그래프가 만나는 점의 개수를 구하면 된다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |-
        (ⅰ) $k<0$ : 이 경우에는 $k$의 값이 음수이므로 두 그래프는 만나지 않는다. 따라서, $p(k)=0$이다.
        (ⅱ) $k=0$ : 이 경우에는 세 점에서 만나는 것을 확인할 수 있다. 따라서, $p(0)=3$이다.
      criteria:
      - 3.B1
    - id: 3b-3
      content: '(ⅲ) $0<k<\dfrac1{108}$ : 이 경우에는 6개의 점에서 만나므로, $p(k)=6$이다.'
      criteria:
      - 3.B2
    - id: 3b-4
      content: |-
        (ⅳ) $k=\dfrac1{108}$ : 이 경우에는 4개의 점에서 만나므로, $p\left(\dfrac1{108}\right)=4$이다.
        (ⅴ) $k>\dfrac1{108}$ : 이 경우에는 두 점에서 만나므로, $p(k)=2$이다.
        이를 통해 함수 $p(k)$는 $k=0,\dfrac1{108}$에서 불연속임을 알 수 있다. [그림 3: $y=\lvert f(x)-g(x)\rvert$의 그래프와 수평선 $y=k$ ($k>\frac1{108}$, $k=\frac1{108}$, $0<k<\frac1{108}$), 그리고 $p(k)$의 그래프: $(0,3)$ 점, $0<k<\frac1{108}$에서 $6$, $\left(\frac1{108},4\right)$ 점, $k>\frac1{108}$에서 $2$]
      criteria:
      - 3.A1
