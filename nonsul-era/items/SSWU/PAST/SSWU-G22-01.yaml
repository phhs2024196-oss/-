- id: '2'
  stem: 함수 $y=f(x)$의 그래프의 개형을 그리고, 그래프 위에 극대 및 극소를 나타내는 점의 좌표와 변곡점의 좌표를 표시하시오. 또한, 곡선 $y=f(x)$의 변곡점을 $\mathrm{P}(a,f(a))$라 할 때 $f(a-x)=2f(a)-f(a+x)$가 성립함을 설명하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: xmax=1/6; ymax=1/54; xmin=1/2; ymin=0; xinfl=1/3; yinfl=1/108
    equivalents:
    - 극대점 $\left(\frac16,\frac1{54}\right)$, 극소점 $\left(\frac12,0\right)$, 변곡점 $\left(\frac13,\frac1{108}\right)$, $f(a-x)+f(a+x)=2f(a)$ 설명
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f'(x)=\frac14(2x-1)(6x-1)$, $f''(x)=6x-2$로 극점·변곡점을 구하고 $a=\frac13$에서 $f(a-x)+f(a+x)=2f(a)$를 전개로 확인.
    steps:
    - id: 2a
      content: 극대 $\left(\frac16,\frac1{54}\right)$, 극소 $\left(\frac12,0\right)$, 변곡점 $\left(\frac13,\frac1{108}\right)$, $f(\frac13-x)+f(\frac13+x)=\frac1{54}=2f(\frac13)$
      criteria:
      - 2.M1
      - 2.M2
      - 2.B1
      - 2.R1
  - id: S2-B
    audience: B
    source_flow: g23.pdf p.52 예시답안 문제 1(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: $f(x)=x^3-x^2+\dfrac14x=x\left(x-\dfrac12\right)^2$이고, $f'(x)=3x^2-2x+\dfrac14=\dfrac14(12x^2-8x+1)=\dfrac14(2x-1)(6x-1)$이 된다. $f'(x)$의 그래프를 통해 $x=\dfrac16$일 때 $f(x)$는 극댓값 $f\left(\dfrac16\right)=\dfrac1{54}$을 갖고, $x=\dfrac12$일 때 극솟값 $f\left(\dfrac12\right)=0$을 갖는다. 따라서 극대 및 극소를 나타내는 점의 좌표는 $\left(\dfrac16,\dfrac1{54}\right)$, $\left(\dfrac12,0\right)$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 또한 $f''(x)=6x-2$이므로, $f''(x)$의 그래프를 통해 $x=\dfrac13$에서 $f''(x)$의 부호가 바뀌므로 변곡점의 좌표는 $\left(\dfrac13,\dfrac1{108}\right)$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: '따라서 함수 $y=f(x)$의 그래프의 개형을 다음과 같이 그릴 수 있다. [그림 2: 원점 $\mathrm{O}(0,0)$을 지나는 삼차함수 그래프. $\left(\frac16,\frac1{54}\right)$에서 극대, $\left(\frac13,\frac1{108}\right)$에서 변곡, $\left(\frac12,0\right)$에서 $x$축에 접하며 극소이고 $x$가 커지면 증가]'
      criteria:
      - 2.B1
    - id: 2b-4
      content: 변곡점의 좌표가 $\left(\dfrac13,\dfrac1{108}\right)$이므로, 직접 계산을 통해 다음과 같이 보일 수 있다. $f\left(\dfrac13-x\right)+f\left(\dfrac13+x\right)=\left(\dfrac13-x\right)\left(x+\dfrac16\right)^2+\left(\dfrac13+x\right)\left(x-\dfrac16\right)^2=\dfrac1{54}=2\cdot\dfrac1{108}=2f\left(\dfrac13\right)$. 또는 $f(a-x)+f(a+x)=2a^3-2a^2+\dfrac a2+(6a-2)x^2=2f(a)+(6a-2)x^2$이므로 $a=\dfrac13$을 대입하면 된다.
      criteria:
      - 2.R1
