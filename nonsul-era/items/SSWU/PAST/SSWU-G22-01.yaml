stimuli: []
stem: |-
  다항함수 $f(x)$가 다음 조건을 만족시킨다.

  (가) $\displaystyle\lim_{x\to\infty}\left\{\dfrac{f(x)}{x^2}-x\right\}=-1$

  (나) $\displaystyle\lim_{x\to0}\dfrac{f(x)}{x}=\dfrac14$

  다음 물음에 답하시오. [총25점]
subparts:
- id: '1'
  stem: $f(x)$를 $x$에 대한 식으로 나타내시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: x**3 - x**2 + x/4
    equivalents:
    - f(x)=x^3-x^2+\frac14x
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\frac{f(x)-x^3}{x^2}\to-1$에서 $f(x)=x^3-x^2+bx+c$, $f(0)=0$, $f'(0)=\frac14$로 $c=0$, $b=\frac14$.
    steps:
    - id: 1a
      content: $f(x)=x^3+ax^2+bx+c$, $a=-1$, $c=0$, $b=\frac14$ $\Rightarrow f(x)=x^3-x^2+\frac14x$
      criteria:
      - 1.M1
      - 1.B1
      - 1.B2
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g23.pdf p.52 예시답안 문제 1(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: 조건 (가)를 $\displaystyle\lim_{x\to\infty}\frac{f(x)-x^3}{x^2}=-1$로 변형할 수 있다. 이로부터 $f(x)$는 최고차항이 $x^3$인 다항함수가 되어, $f(x)=x^3+ax^2+bx+c$로 놓을 수 있다. (단, $a,b,c$는 상수)
      criteria:
      - 1.M1
    - id: 1b-2
      content: 조건 (가)의 극한값이 $-1$이므로, $f(x)$의 이차항의 계수가 $-1$이 되어 $a=-1$이다.
      criteria:
      - 1.B1
    - id: 1b-3
      content: 조건 (나)를 통하여 $f(0)=0$이므로 $c=0$이고,
      criteria:
      - 1.B2
    - id: 1b-4
      content: $f'(0)=\dfrac14$이므로 $b=\dfrac14$이 된다. 따라서 $f(x)=x^3-x^2+\dfrac14x$이다.
      criteria:
      - 1.A1
