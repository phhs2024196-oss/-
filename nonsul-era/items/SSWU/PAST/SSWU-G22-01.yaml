intent: 다항함수에 관한 극한이 주어져 있을 때 다항함수의 식을 찾을 수 있는지를 확인한다. 그리고 도함수를 활용하여 삼차함수의 극댓값, 극솟값, 변곡점을 찾고 그래프의 개형을 그릴 수 있는지를 알아본다. 마지막으로 절댓값을 취한 함수의 그래프를 그릴 수 있는지를 알아보고, 함수가 불연속이 되게 하는 값을 모두 찾을 수 있는지를 확인한다.
