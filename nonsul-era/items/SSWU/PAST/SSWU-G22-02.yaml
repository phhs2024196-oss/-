intent: 치환적분과 정적분의 성질을 이용하여 정적분 계산이 쉬운 형태로 식을 변형할 수 있는지를 확인한다. 그리고 부분적분법 및 정적분의 정의를 이용하여 주어진 적분을 간단한 형태로 변형할 수 있는지를 알아본다. 마지막으로 삼각함수의 성질을 이용하여 등비급수의 합을 구할 수 있는지를 확인한다.
