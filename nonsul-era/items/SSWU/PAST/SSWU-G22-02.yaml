key_idea: $2n-x=u$ 치환으로 두 적분의 구간을 $[0,n]$으로 맞추면 피적분함수가 $\{f(x)g(2n-x)\}'$이 되어 $H(n)=f(n)g(n)-f(0)g(2n)$. 이를 $f=a^x$, $g=\sin\frac\pi4x$에 적용하고 $a_{n+1}=-\frac14a_n$인 등비급수로 합을 구한다.
stuck: 두 번째 적분을 치환으로 구간 $[0,n]$으로 옮겨 $f'g-fg'$ 꼴(곱의 미분)로 묶는 발상, (3)에서 $a_{n+1}=-\frac14a_n$을 찾는 단계
