stimuli: []
stem: |-
  함수 $f(x)$와 $g(x)$가 실수 전체집합에서 미분가능하고 도함수 $f'(x)$와 $g'(x)$가 실수 전체집합에서 연속이다. 모든 자연수 $n$에 대하여 함수 $H(n)$을 다음과 같이 정의하자.

  $$H(n)=\int_0^nf'(x)g(2n-x)dx-\int_n^{2n}g'(x)f(2n-x)dx$$

  다음 질문에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: $f(0)=1$, $f(1)=2$, $g(1)=5$, $g(2)=-1$일 때, $H(1)$의 값을 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: '11'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $2-x=u$ 치환 후 $H(1)=\left[f(x)g(2-x)\right]_0^1=f(1)g(1)-f(0)g(2)$.
    steps:
    - id: 1a
      content: $H(1)=f(1)g(1)-f(0)g(2)=2\cdot5-1\cdot(-1)=11$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g23.pdf p.53 예시답안 문제 2(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: $2-x=u$로 치환을 하면, 다음과 같은 식을 얻을 수 있다. $\displaystyle\int_1^2g'(x)f(2-x)dx=\int_1^0g'(2-u)f(u)(-du)=\int_0^1g'(2-u)f(u)du$
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서, $H(1)$을 다음과 같이 나타낼 수 있다. $H(1)=\displaystyle\int_0^1f'(x)g(2-x)dx-\int_1^2g'(x)f(2-x)dx=\int_0^1f'(x)g(2-x)dx-\int_0^1g'(2-u)f(u)du=\int_0^1\{f'(x)g(2-x)-f(x)g'(2-x)\}dx$
      criteria:
      - 1.M2
    - id: 1b-3
      content: 부분적분법을 이용하여 다음의 정적분을 계산하면 $H(1)=\displaystyle\int_0^1\{f'(x)g(2-x)-f(x)g'(2-x)\}dx=\Big[f(x)g(2-x)\Big]_0^1=f(1)g(1)-f(0)g(2)$
      criteria:
      - 1.M3
    - id: 1b-4
      content: $f(1)$, $g(1)$, $f(0)$, $g(2)$의 값을 이용하면 $H(1)=2\cdot5-1\cdot(-1)=11$이 된다.
      criteria:
      - 1.A1
