- id: '3'
  stem: 위의 $H(n)$에 대하여 $a=\dfrac{1}{\sqrt2}$일 때, 급수 $\displaystyle\sum_{n=1}^{\infty}\{H(4n-3)+H(4n-1)\}$의 합을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 3/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a_n=H(4n-3)+H(4n-1)$에서 사인 합이 0이 되어 $a_{n+1}=-\frac14a_n$, $a_1=\frac34$인 등비급수.
    steps:
    - id: 3a
      content: $a_{n+1}=-\frac14a_n$, $a_1=\frac34$ $\Rightarrow\ \dfrac{3/4}{1+1/4}=\dfrac35$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g23.pdf p.54 예시답안 문제 2(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: 〈문제 2〉 (2)에서 $H(n)=\left(\dfrac1{\sqrt2}\right)^n\sin\dfrac{n\pi}4-\sin\dfrac{n\pi}2$임을 알 수 있고, $a_n=H(4n-3)+H(4n-1)$이라 하자.
      criteria:
      - 3.M1
    - id: 3b-2
      content: $a_n=H(4n-3)+H(4n-1)=\left(\dfrac1{\sqrt2}\right)^{4n-3}\sin\dfrac{(4n-3)\pi}{4}-\sin\dfrac{(4n-3)\pi}{2}+\left(\dfrac1{\sqrt2}\right)^{4n-1}\sin\dfrac{(4n-1)\pi}{4}-\sin\dfrac{(4n-1)\pi}{2}$가 되는데, 삼각함수의 대칭성과 주기성에 의해 모든 자연수 $n$에 대해 $\sin\dfrac{(4n-3)\pi}{2}+\sin\dfrac{(4n-1)\pi}{2}=0$이 성립하므로 $a_n=H(4n-3)+H(4n-1)=\left(\dfrac1{\sqrt2}\right)^{4n-3}\sin\dfrac{(4n-3)\pi}{4}+\left(\dfrac1{\sqrt2}\right)^{4n-1}\sin\dfrac{(4n-1)\pi}{4}$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: 이 때, $a_{n+1}$을 계산해보면, $a_{n+1}=H(4n+1)+H(4n+3)=\left(\dfrac1{\sqrt2}\right)^{4n+1}\sin\dfrac{(4n+1)\pi}{4}+\left(\dfrac1{\sqrt2}\right)^{4n+3}\sin\dfrac{(4n+3)\pi}{4}$이다. 한편, $\sin(\pi+\theta)=-\sin\theta$이므로 $\sin\dfrac{(4n+1)\pi}{4}=-\sin\dfrac{(4n-3)\pi}{4}$이고, $\sin\dfrac{(4n+3)\pi}{4}=-\sin\dfrac{(4n-1)\pi}{4}$이 성립한다. 따라서, $a_{n+1}=-\dfrac14a_n$임을 알 수 있다.
      criteria:
      - 3.M3
    - id: 3b-4
      content: 첫째항은 $a_1=H(1)+H(3)=\dfrac1{\sqrt2}\sin\dfrac\pi4+\left(\dfrac1{\sqrt2}\right)^3\sin\dfrac{3\pi}{4}=\dfrac12+\dfrac14=\dfrac34$이고 공비가 $-\dfrac14$이므로 주어진 급수의 합은 $\dfrac{\frac34}{1+\frac14}=\dfrac35$이다.
      criteria:
      - 3.A1
