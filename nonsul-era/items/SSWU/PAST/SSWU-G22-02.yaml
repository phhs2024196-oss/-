elements:
  materials:
  - $H(n)=\displaystyle\int_0^nf'(x)g(2n-x)dx-\int_n^{2n}g'(x)f(2n-x)dx$
  - $f(0)=1$, $f(1)=2$, $g(1)=5$, $g(2)=-1$
  - $f(x)=a^x$, $g(x)=\sin\frac\pi4x$
  - 급수 $\displaystyle\sum_{n=1}^{\infty}\{H(4n-3)+H(4n-1)\}$, $a=\frac1{\sqrt2}$
  concepts:
  - 치환적분법
  - 부분적분법(곱의 미분)
  - 삼각함수의 대칭성·주기성
  - 등비급수의 합
  tools:
  - $2n-x=u$ 치환으로 $\int_n^{2n}g'(x)f(2n-x)dx=\int_0^ng'(2n-u)f(u)du$
  - $H(n)=\displaystyle\int_0^n\{f'(x)g(2n-x)-f(x)g'(2n-x)\}dx=\Big[f(x)g(2n-x)\Big]_0^n$
  - $\sin(\pi+\theta)=-\sin\theta$로 $a_{n+1}=-\frac14a_n$
  - 등비급수 $\dfrac{a_1}{1-r}$
  conditions:
  - $f'$, $g'$가 실수 전체집합에서 연속
  - $a>0$, $a\ne1$ ((2))
  - $a=\frac1{\sqrt2}$ ((3))
  stimuli_used: []
  subpart_links: (1)의 일반형을 (2)에서 $H(n)=f(n)g(n)-f(0)g(2n)$로 쓰고, (3)은 (2)의 $H(n)$을 사용한다
