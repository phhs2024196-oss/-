stimuli: []
stem: |-
  중심이 $\mathrm{A}(0,1)$이고 원점 $\mathrm{O}(0,0)$을 지나는 원 $C$ 위에 $\angle\mathrm{OAP_1}=\angle\mathrm{OAP_2}=\theta$인 두 점 $\mathrm{P_1}$, $\mathrm{P_2}$가 그림과 같이 놓여 있다. 다음 질문에 답하시오. (단, $0<\theta<\dfrac{\pi}{2}$이다.) [총 25점]

  [그림 1: 좌표평면에서 중심 $\mathrm{A}(0,1)$, 원점 $\mathrm{O}(0,0)$을 지나는 원 $C$. 원 위에 $y$축 대칭인 두 점 $\mathrm{P_1}$($x>0$)과 $\mathrm{P_2}$($x<0$)가 있고 $\angle\mathrm{OAP_1}=\angle\mathrm{OAP_2}=\theta$. 위로 열린 포물선 $y=f(x)$가 $\mathrm{P_1}$, $\mathrm{P_2}$를 지나며 원의 아래쪽(원점 아래)을 지난다. $\mathrm{P_1}$, $\mathrm{P_2}$에서의 접선 두 개가 원점 아래 $y$축 위에서 만난다]
subparts:
- id: '1'
  stem: 원 $C$와 $f(x)=ax^2+bx+c$의 그래프가 두 점 $\mathrm{P_1}$, $\mathrm{P_2}$에서 만나고, 점 $\mathrm{P_1}$, $\mathrm{P_2}$에서 원 $C$의 접선과 곡선 $y=f(x)$의 접선이 일치한다. $\theta=\dfrac{\pi}{3}$일 때, 점 $\mathrm{P_1}$에서 원 $C$의 접선의 방정식과 함수 $f(x)$를 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: tangent=sqrt(3)*x-1; f=x**2-1/4
    equivalents:
    - 접선 $y=\sqrt3x-1$, $f(x)=x^2-\frac14$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P_1}=\left(\frac{\sqrt3}2,\frac12\right)$, 접선 기울기 $\tan\frac\pi3=\sqrt3$. $f$는 $y$축 대칭($b=0$), $2a\cdot\frac{\sqrt3}2=\sqrt3$, $\mathrm{P_1}$ 지남.
    steps:
    - id: 1a
      content: 접선 $y=\sqrt3x-1$; $b=0$, $a=1$, $c=-\frac14$ $\Rightarrow f(x)=x^2-\frac14$
      criteria:
      - 1.M1
      - 1.B1
      - 1.B2
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g23.pdf p.55 예시답안 문제 3(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: 점 $\mathrm{P_1}$의 좌표는 $\left(\sin\dfrac\pi3,1-\cos\dfrac\pi3\right)=\left(\dfrac{\sqrt3}2,\dfrac12\right)$이고, 이 점에서 원 $C$의 접선의 기울기는 $\tan\dfrac\pi3=\sqrt3$이므로 접선의 방정식은 $y=\sqrt3x-1$이다. 같은 방법으로 점 $\mathrm{P_2}$에서의 접선의 방정식은 $y=-\sqrt3x-1$이다. 이제 곡선 $y=f(x)$의 방정식을 구하자.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 이 곡선은 $y$축에 대칭인 두 점 $\mathrm{P_1}$, $\mathrm{P_2}$를 지나므로 $b=0$이다.
      criteria:
      - 1.B1
    - id: 1b-3
      content: 그리고 점 $\mathrm{P_1}$에서의 기울기는 $2a\left(\dfrac{\sqrt3}2\right)=\sqrt3$이므로 $a=1$이다.
      criteria:
      - 1.B2
    - id: 1b-4
      content: 마지막으로 이 곡선은 점 $\mathrm{P_1}$을 지나므로 $\dfrac12=\left(\dfrac{\sqrt3}2\right)^2+c$로부터 $c=-\dfrac14$이다. 따라서 $f(x)=x^2-\dfrac14$이다.
      criteria:
      - 1.A1
