- id: '2'
  stem: $\theta=\dfrac{\pi}{3}$일 때, 원 $C$와 곡선 $y=f(x)$로 둘러싸인 영역의 넓이를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 3*sqrt(3)/4 - pi/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 두 접선의 교점 $\mathrm{Q}$에 대해 (사각형 $\mathrm{AP_2QP_1}$) − (부채꼴 $\mathrm{AP_2P_1}$) − (곡선과 두 접선 사이 넓이) $=\sqrt3-\frac\pi3-\frac{\sqrt3}4$.
    steps:
    - id: 2a
      content: $\sqrt3-\dfrac\pi3-\dfrac{\sqrt3}4=\dfrac{3\sqrt3}4-\dfrac\pi3$
      criteria:
      - 2.M1
      - 2.B1
      - 2.B2
      - 2.B3
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g23.pdf p.55 예시답안 문제 3(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: 두 접선의 교점을 $\mathrm{Q}$라 두면 구하는 영역의 넓이는 사각형 $\mathrm{AP_2QP_1}$의 넓이에서 부채꼴 $\mathrm{AP_2P_1}$의 넓이와 $y=f(x)$와 두 접선 사이의 넓이를 빼주면 된다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 사각형 $\mathrm{AP_2QP_1}$의 넓이는 $\tan\dfrac\pi3=\sqrt3$이고
      criteria:
      - 2.B1
    - id: 2b-3
      content: 부채꼴의 넓이는 $\dfrac\pi3$,
      criteria:
      - 2.B2
    - id: 2b-4
      content: 곡선과 두 접선 사이의 넓이는 $2\displaystyle\int_0^{\frac{\sqrt3}2}\left\{x^2-\dfrac14-(\sqrt3x-1)\right\}dx=\dfrac{\sqrt3}4$이므로
      criteria:
      - 2.B3
    - id: 2b-5
      content: '구하는 넓이는 $\dfrac{3\sqrt3}4-\dfrac\pi3$이다. (다른 방법: 직선 $y=1-\cos\dfrac\pi3=\dfrac12$와 $y=f(x)$ 사이의 넓이 $2\displaystyle\int_0^{\frac{\sqrt3}2}\left\{\dfrac12-\left(x^2-\dfrac14\right)\right\}dx=\dfrac{3\sqrt3}4-\dfrac{\sqrt3}4=\dfrac{\sqrt3}2$에서 부채꼴 $\mathrm{AP_2P_1}$의 넓이를 빼고 삼각형 $\mathrm{AP_2P_1}$의 넓이를 더해주면 된다. 부채꼴 $\mathrm{AP_2P_1}$의 넓이는 $\dfrac\pi3$이고 삼각형의 넓이는 $\sin\dfrac\pi3\cos\dfrac\pi3=\dfrac{\sqrt3}4$이므로 구하는 넓이는 $\dfrac{3\sqrt3}4-\dfrac\pi3$이다.)'
      criteria:
      - 2.A1
