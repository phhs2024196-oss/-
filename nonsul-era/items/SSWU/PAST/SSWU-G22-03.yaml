intent: 원의 접선이 갖는 성질과 직각삼각형의 삼각비, 접선의 의미, 이차함수의 성질 등을 이해하고 있는지를 확인하고자 한다. 그리고 호도법을 이용한 부채꼴의 넓이와 적분의 활용을 통한 두 곡선 사이의 넓이를 구함으로써 주어진 도형의 넓이를 구할 수 있는지 알아본다. 마지막으로 삼각비의 활용을 통해 주어진 문제를 해결할 수 있는지를 확인한다.
