- id: '3'
  stem: 원 $C$와 $y$축 위의 한 점에서 만나고, 원 $C$ 위의 점 $\mathrm{P_1}$과 $\mathrm{P_2}$에서의 두 접선에 모두 접하는 원 중 작은 원의 반지름을 $r_1$, 큰 원의 반지름을 $r_2$라 하자. $\dfrac{r_2}{r_1}=4$일 때, $\cos\theta$의 값을 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: 1/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 두 접선의 교점 $\mathrm{Q}$와 닮은 직각삼각형에서 $r_1=\frac{1-\cos\theta}{1+\cos\theta}$, $r_2=\frac{1+\cos\theta}{1-\cos\theta}$, $\frac{r_2}{r_1}=4$.
    steps:
    - id: 3a
      content: $r_1=\frac{1-\cos\theta}{1+\cos\theta}$, $r_2=\frac{1+\cos\theta}{1-\cos\theta}$, $3\cos^2\theta-10\cos\theta+3=0$ $\Rightarrow\cos\theta=\frac13$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g23.pdf p.55 예시답안 문제 3(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: 닮은 직각삼각형에 비례식을 적용하면 작은 원의 반지름은 $1:\sec\theta=r_1:(\sec\theta-1-r_1)$으로부터 $r_1=\dfrac{1-\cos\theta}{1+\cos\theta}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 큰 원의 반지름은 $1:\sec\theta=r_2:(\sec\theta+1+r_2)$으로부터 $r_2=\dfrac{1+\cos\theta}{1-\cos\theta}$이다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: '$\dfrac{r_2}{r_1}=\dfrac{(1+\cos\theta)^2}{(1-\cos\theta)^2}=4$로부터 $3\cos^2\theta-10\cos\theta+3=(3\cos\theta-1)(\cos\theta-3)=0$이 성립하고 이로부터 $\cos\theta=\dfrac13$이다. (다른 방법: $\cos\theta=\dfrac{r-r_1}{r+r_1}=\dfrac{r_2-r}{r_2+r}$이 성립하고 $\dfrac{r_2}{r_1}=4$이므로 이 식에 $r=1$과 $r_2=4r_1$을 대입하고 정리하면 $(1-r_1)(4r_1+1)=(r_1+1)(4r_1-1)$으로부터 $8r_1^2=2$가 되고 이로부터 $r_1=\dfrac12$, $r_2=2$가 된다. 따라서 $\cos\theta=\dfrac13$이다.)'
      criteria:
      - 3.A1
