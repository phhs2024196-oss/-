- id: '3'
  stem: 위에서 구한 확률변수 $X$의 확률분포표로부터 $X$의 기댓값(평균)과 표준편차를 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: E=5/2; sd=1
    equivalents:
    - $\mathrm{E}(X)=\frac52$, $\sigma(X)=1$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{E}(X)=\frac{160}{64}=\frac52$, $\mathrm{V}(X)=\mathrm{E}(X^2)-\mathrm{E}(X)^2=1$.
    steps:
    - id: 3a
      content: $\mathrm{E}(X)=\frac52$, $\mathrm{V}(X)=1$, $\sigma(X)=1$
      criteria:
      - 3.M1
      - 3.B1
      - 3.M2
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g23.pdf p.56 예시답안 문제 4(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: '기댓값(평균): $\mathrm{E}(X)=2\times\dfrac{50}{64}+4\times\dfrac{12}{64}+6\times\dfrac2{64}=\dfrac{160}{64}=\dfrac52$'
      criteria:
      - 3.M1
      - 3.B1
    - id: 3b-2
      content: '분산: $\mathrm{V}(X)=\left(2-\dfrac52\right)^2\times\dfrac{50}{64}+\left(4-\dfrac52\right)^2\times\dfrac{12}{64}+\left(6-\dfrac52\right)^2\times\dfrac2{64}=\dfrac{1\times50+9\times12+49\times2}{256}=1$ (다른방법: $\mathrm{V}(X)=\mathrm{E}(X^2)-\mathrm{E}(X)^2=\dfrac{4\times50+16\times12+36\times2}{64}-\dfrac{25}4=1$)'
      criteria:
      - 3.M2
    - id: 3b-3
      content: '표준편차: $\sigma(X)=\sqrt{\mathrm{V}(X)}=1$'
      criteria:
      - 3.A1
