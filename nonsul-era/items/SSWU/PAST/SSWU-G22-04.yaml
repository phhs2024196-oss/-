- id: '2'
  stem: 성신이가 거리 3 만큼 이동한 후 멈춘 지점을 $\mathrm{P}$라 하고, 수정이가 거리 3 만큼 이동한 후 멈춘 지점을 $\mathrm{Q}$라 하자. 성신이(지점 $\mathrm{P}$)와 수정이(지점 $\mathrm{Q}$) 사이의 거리를 확률변수 $X$라 할 때, $X$의 확률분포표를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 2:50/64; 4:12/64; 6:2/64
    equivalents:
    - $\mathrm{P}(X=2)=\frac{50}{64}$, $\mathrm{P}(X=4)=\frac{12}{64}$, $\mathrm{P}(X=6)=\frac2{64}$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{P}$는 $(i,3-i)$ (확률 ${}_3\mathrm{C}_i/2^3$), $\mathrm{Q}$는 $(4-j,1+j)$. 거리 6은 $\frac2{64}$, 거리 4는 $\frac{12}{64}$, 나머지는 거리 2로 $\frac{50}{64}$.
    steps:
    - id: 2a
      content: $X=2,4,6$일 확률은 $\frac{50}{64},\frac{12}{64},\frac{2}{64}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.B1
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g23.pdf p.56 예시답안 문제 4(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: 성신이가 거리 3 만큼 이동한 후 멈춘 지점 $\mathrm{P}$는 $(0,3)$, $(1,2)$, $(2,1)$, $(3,0)$ 중 하나이고 수정이가 거리 3 만큼 이동한 후 멈춘 지점 $\mathrm{Q}$는 $(1,4)$, $(2,3)$, $(3,2)$, $(4,1)$ 중 하나이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: 가능한 $\mathrm{P}$와 $\mathrm{Q}$의 쌍은 16가지이고 $\mathrm{P}$와 $\mathrm{Q}$ 사이의 거리는 $2$, $4$, $6$ 중 하나이다. (성신이와 수정이가 각각 거리 3 만큼 이동한 후 멈추었으므로 전체 경우의 수는 $2^3\times2^3=64$가지이다.)
      criteria:
      - 2.M2
    - id: 2b-3
      content: $X=6$인 경우는 $(0,3)-(4,1)$, $(3,0)-(1,4)$ 등 총 2가지이고 각각의 경우의 수는 1, 1로 총 2가지이다. $X=4$인 경우는 $(0,3)-(3,2)$, $(1,2)-(4,3)$ 등 총 4가지이고 각각의 경우의 수는 3, 3, 3, 3가지로 총 12가지이다. 거리가 2인 경우는 여사건을 이용하여 $64-(2+12)=50$으로 계산해도 된다. (이 경우는 총 10가지이고 각각의 경우의 수는 1, 3, 3, 9, 9, 9, 9, 3, 3, 1가지로 총 50가지이다.)
      criteria:
      - 2.B1
    - id: 2b-4
      content: '따라서 확률변수 $X$의 확률분포표는 다음과 같다. [표 1: $X$ = 2, 4, 6, 합계 / $\mathrm{P}(X=x)$ = $\frac{50}{64}$, $\frac{12}{64}$, $\frac{2}{64}$, 1]'
      criteria:
      - 2.A1
