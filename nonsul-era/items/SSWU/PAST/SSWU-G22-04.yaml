intent: 확률의 의미를 알고 조건을 만족하는 경우의 수와 확률을 계산하는 능력이 있는지를 평가한다. 그리고 두 지점 사이의 최단 경로의 길이로 주어지는 거리를 이해하고 주어진 상황을 분석하여 확률분포표를 완성할 수 있는지를 확인한다. 마지막으로 확률분포표로부터 기댓값(평균)과 표준편차를 구할 수 있는지를 알아본다.
