stimuli: []
stem: |-
  다음 그림과 같이 $\mathrm{A}(0,0)$, $\mathrm{B}(4,4)$를 연결하는 도로망이 주어졌다. 성신이는 지점 $\mathrm{A}$에서 출발하여 지점 $\mathrm{B}$로 도로망을 따라 최단 경로로 이동하고, 수정이는 지점 $\mathrm{B}$에서 출발하여 지점 $\mathrm{A}$로 도로망을 따라 최단 경로로 이동한다. 도로망에서 두 지점 사이의 거리는 도로망을 따라 이동할 수 있는 최단 경로의 길이로 정의한다. 예를 들면 두 지점 $(1,2)$와 $(3,3)$ 사이의 거리는 $\lvert3-1\rvert+\lvert3-2\rvert=3$이다. 다음 질문에 답하시오. (단, 두 사람은 동시에 출발하여 같은 속력으로 이동하고, 갈림길에서 가능한 다음 경로는 모두 같은 확률로 선택된다.) [총 25점]

  [그림 1: $x$축·$y$축 각각 $0$부터 $4$까지의 눈금이 있는 $4\times4$ 정사각 격자 도로망. 왼쪽 아래 꼭짓점이 $\mathrm{A}(0,0)$, 오른쪽 위 꼭짓점이 $\mathrm{B}(4,4)$]
subparts:
- id: '1'
  stem: 성신이와 수정이가 거리 4 만큼 이동한 후 멈추었을 때, 서로 만날 확률을 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: 35/128
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 각자 $2^4$가지, 만나는 점 $(i,4-i)$마다 ${}_4\mathrm{C}_i^2$가지, 합 $70$.
    steps:
    - id: 1a
      content: $\dfrac{1+16+36+16+1}{2^8}=\dfrac{70}{256}=\dfrac{35}{128}$
      criteria:
      - 1.M1
      - 1.M2
      - 1.B1
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g23.pdf p.56 예시답안 문제 4(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: 성신이가 거리 4 만큼 이동하는 경우의 수는 $2^4$가지이고 수정이가 거리 4 만큼 이동하는 경우의 수도 $2^4$가지이다. 이 두 사건은 독립이므로 전체 경우의 수는 $2^8$가지이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 성신이와 수정이가 거리 4 만큼 진행해서 만나는 점은 $(0,4)$, $(1,3)$, $(2,2)$, $(3,1)$, $(4,0)$ 중 하나이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: $(0,4)$ 또는 $(4,0)$에서 만나는 경우의 수는 각각 1가지, $(1,3)$ 또는 $(3,1)$에서 만나는 경우의 수는 각각 ${}_4\mathrm{C}_1\times{}_4\mathrm{C}_3=16$가지, $(2,2)$에서 만나는 경우의 수는 ${}_4\mathrm{C}_2\times{}_4\mathrm{C}_2=36$가지로 총 $70$가지이다.
      criteria:
      - 1.B1
    - id: 1b-4
      content: '따라서 만날 확률은 $\dfrac{70}{2^8}=\dfrac{35}{128}$이다. (참고: ${}_n\mathrm{C}_r$을 $\dfrac{n!}{r!(n-r)!}$로 표현해도 된다.)'
      criteria:
      - 1.A1
