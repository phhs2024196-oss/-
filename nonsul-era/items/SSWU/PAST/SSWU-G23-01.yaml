intent: 다항함수의 그래프가 지나는 점, 차수에 대한 조건과 적분의 성질을 이용하여 $g(x)$와 $f(x)$의 최고차항을 결정하고 함수의 식을 구할 수 있는지(1), 구간 $[0,3]$에서의 $f(x)$의 평균변화율의 정의와 평균값 정리를 이해하고 그 식을 만족하는 실수 $b$의 값을 구간 $(0,3)$에서 구할 수 있는지(2), $f''(x)$의 부호를 구간별로 구분하여 절댓값이 포함된 함수의 식을 정리하고 정적분 값을 구할 수 있는지(3) 확인한다.
key_idea: $g$의 차수가 $n$이면 $f$의 차수가 $n+2$이므로 $n=2$, $g(x)=x^2+ax$이고 $f(3)=0$에서 $a=-2$. $f'(b)=\dfrac{f(3)-f(0)}{3}=0$의 해 중 $(0,3)$의 값이 $b=\dfrac94$. $f''$의 부호로 $|f''|-f''=-2f''$ (구간 $[0,\frac32]$), $0$ (그 밖)으로 가른다.
stuck: $f(x)=x\int_0^x g(t)dt$의 차수가 $\deg g+2$임을 이용해 $g$의 차수를 정하는 단계, $|f''|-f''$를 구간별로 나누는 단계
