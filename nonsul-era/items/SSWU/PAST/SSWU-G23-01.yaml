stimuli: []
stem: 최고차항의 계수가 $1$인 다항함수 $g(x)$의 그래프가 원점을 지나고, 함수 $g(x)$에 대하여 사차함수 $f(x)$를 $f(x)=x\displaystyle\int_0^x g(t)\,dt$로 정의할 때 $f(3)=0$이라 하자. 다음 질문에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: (1) 다항함수 $g(x)$와 $f(x)$를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: g = x**2-2*x; f = x**4/3-x**3
    equivalents:
    - $g(x)=x^2-2x$, $f(x)=\frac13x^4-x^3$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 차수 $n$이면 $f$는 $n+2$차 → $n=2$, $g=x^2+ax$, $f(3)=0$에서 $a=-2$.
    steps:
    - id: 1a
      content: $g(x)=x^2-2x$, $f(x)=\dfrac13x^4-x^3$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $g(x)$의 최고차항을 $x^n$이라 하면 $f(x)=x\displaystyle\int_0^x g(t)\,dt$로부터 $f(x)$의 최고차항은 $x\cdot\dfrac{1}{n+1}x^{n+1}=\dfrac{1}{n+1}x^{n+2}$이고, 이것이 사차항이 되려면 $n=2$이다.
      source_flow: g24.pdf p.47 예시답안 문제 1(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서 $g(x)=x^2+ax$ 꼴이다. ($a$는 상수)
      source_flow: g24.pdf p.47 예시답안 문제 1(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: 그리고 $f(x)=x\displaystyle\int_0^x g(t)\,dt=x\left[\dfrac13t^3+\dfrac a2t^2\right]_0^x=\dfrac16x^3(2x+3a)$이다.
      source_flow: g24.pdf p.47 예시답안 문제 1(1)
      criteria:
      - 1.M2
    - id: 1b-4
      content: 주어진 조건 $f(3)=0$으로부터 $a=-2$이다. 따라서 $g(x)=x^2-2x$이고, $f(x)=\dfrac13x^4-x^3$이다.
      source_flow: g24.pdf p.47 예시답안 문제 1(1)
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: $g$의 최고차항을 $x^n$으로 두고 $f$의 최고차항이 $\frac{1}{n+1}x^{n+2}$임을 보여 $n=2$를 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $g(x)=x^2+ax$ 꼴로 두고 $f(x)=\frac16x^3(2x+3a)$를 구했다.
      steps:
      - 1b-2
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 4
      evidence: $f(3)=0$에서 $a=-2$, $g(x)=x^2-2x$, $f(x)=\frac13x^4-x^3$을 구했다.
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-4
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: (2) 구간 $[0,3]$에서의 $f(x)$의 평균변화율을 구하고, 그 값과 $f'(b)$가 같게 되는 실수 $b$의 값을 구간 $(0,3)$에서 구하시오. [7점]
  points: 7
  depends_on:
  - '1'
  answer:
    kind: value
    value: 9/4
    equivalents:
    - 평균변화율 0, $b=\frac94$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(0)=f(3)=0$이므로 평균변화율 0, $f'(b)=0$의 해 중 $(0,3)$ 의 값.
    steps:
    - id: 2a
      content: 평균변화율 $0$, $f'(x)=\frac13x^2(4x-9)=0$ → $b=\dfrac94$
      criteria:
      - 2.B1
      - 2.B2
      - 2.B3
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $f(x)=\dfrac13x^4-x^3$이므로 $f(0)=0$, $f(3)=0$이다. 따라서 구간 $[0,3]$에서의 $f(x)$의 평균변화율은 $\dfrac{f(3)-f(0)}{3-0}=\dfrac{0-0}{3}=0$이다.
      source_flow: g24.pdf p.47 예시답안 문제 1(2)
      criteria:
      - 2.B1
    - id: 2b-2
      content: $f'(x)=\dfrac43x^3-3x^2=\dfrac13x^2(4x-9)$이다.
      source_flow: g24.pdf p.47 예시답안 문제 1(2)
      criteria:
      - 2.B2
    - id: 2b-3
      content: $f'(x)=0$은 $x=0$ 또는 $x=\dfrac94$에서 성립한다. 이 중에서 구간 $(0,3)$에 속하는 것은 $x=\dfrac94$뿐이다. 따라서 $b=\dfrac94$이다.
      source_flow: g24.pdf p.47 예시답안 문제 1(2)
      criteria:
      - 2.B3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: 구간 $[0,3]$에서의 평균변화율 $0$을 구했다.
      steps:
      - 2b-1
    - id: 2.B2
      mark_type: B
      points: 2
      evidence: $f'(x)=\frac43x^3-3x^2$을 구했다.
      steps:
      - 2b-2
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: $f'(x)=0$의 해 $x=0,\frac94$ 중 $(0,3)$에 속하는 $b=\frac94$를 구했다.
      steps:
      - 2b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: (3) $\displaystyle\int_0^3(|f''(x)|-f''(x))dx$의 값을 구하시오. [8점]
  points: 8
  depends_on:
  - '1'
  answer:
    kind: value
    value: 9/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f''=2x(2x-3)$는 $[0,\frac32]$에서 $\le0$, 그 밖에서 $>0$ → 적분은 $-2\int_0^{3/2}f''dx$.
    steps:
    - id: 3a
      content: $-2[f'(x)]_0^{3/2}=-2\cdot\left(-\dfrac94\right)=\dfrac92$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $f(x)=\dfrac13x^4-x^3$으로부터 $f''(x)=4x^2-6x=2x(2x-3)$이므로
      source_flow: g24.pdf p.47 예시답안 문제 1(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: $0\le x\le\dfrac32$에서는 $f''(x)\le0$이고, $x<0$ 또는 $x>\dfrac32$이면 $f''(x)>0$이다.
      source_flow: g24.pdf p.47 예시답안 문제 1(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: 따라서 $|f''(x)|-f''(x)=\begin{cases}-2f''(x), & 0\le x\le\dfrac32\\ 0, & x<0\text{ 또는 }x>\dfrac32\end{cases}$
      source_flow: g24.pdf p.47 예시답안 문제 1(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: 그러므로 $\displaystyle\int_0^3(|f''(x)|-f''(x))dx=-2\int_0^{\frac32}f''(x)dx=-2\Big[f'(x)\Big]_0^{\frac32}=-2\left[\dfrac13x^2(4x-9)\right]_0^{\frac32}=\dfrac92$이다.
      source_flow: g24.pdf p.47 예시답안 문제 1(3)
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: $f''(x)=4x^2-6x=2x(2x-3)$을 구했다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 2
      evidence: $0\le x\le\frac32$에서 $f''\le0$, 그 밖에서 $f''>0$임을 판단했다.
      steps:
      - 3b-2
    - id: 3.M3
      mark_type: M
      points: 2
      evidence: $|f''(x)|-f''(x)$를 구간별로 $-2f''(x)$, $0$으로 정리했다.
      steps:
      - 3b-3
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: 정적분 값 $\frac92$를 구했다.
      depends_on:
      - 3.M1
      - 3.M2
      - 3.M3
      steps:
      - 3b-4
    deductions: []
