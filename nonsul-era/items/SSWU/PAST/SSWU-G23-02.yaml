  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\int e^{-x}(\sin x+\cos x)dx=-e^{-x}\cos x$ → $a_n=1-(-e^{-\pi})^n\to1$.
    steps:
    - id: 2a
      content: $a_n=1-(-e^{-\pi})^n$, $|-e^{-\pi}|<1$이므로 극한 $1$
      criteria:
      - 2.M1
      - 2.M2
      - 2.B1
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 부분적분을 통해 $\displaystyle\int e^{-x}\sin x\,dx=-e^{-x}\sin x+\int e^{-x}\cos x\,dx$가 됨을 알 수 있고, 비슷하게 $\displaystyle\int e^{-x}\cos x\,dx=-e^{-x}\cos x-\int e^{-x}\sin x\,dx$가 된다. 따라서 $\displaystyle\int e^{-x}\sin x\,dx=-\dfrac12e^{-x}(\sin x+\cos x)+C_1$이고, $\displaystyle\int e^{-x}\cos x\,dx=-\dfrac12e^{-x}(\cos x-\sin x)+C_2$이므로
      source_flow: g24.pdf p.52 문제 해설·p.55 예시 답안 문제 2(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: $\displaystyle\int e^{-x}(\sin x+\cos x)dx=-e^{-x}\cos x+C_3$가 된다. 또는 부분적분을 이용하여 $\displaystyle\int e^{-x}(\sin x+\cos x)dx=\int e^{-x}\sin x\,dx+\int e^{-x}\cos x\,dx=\int e^{-x}(-\cos x)'dx+\int e^{-x}\cos x\,dx=-e^{-x}\cos x-\int e^{-x}\cos x\,dx+\int e^{-x}\cos x\,dx=-e^{-x}\cos x+C_4$임을 알 수 있다. (단, $C_1,C_2,C_3,C_4$는 적분상수)
      source_flow: g24.pdf p.52 문제 해설·p.55 예시 답안 문제 2(2)
      criteria:
      - 2.M1
    - id: 2b-3
      content: 그러므로 $a_n=\displaystyle\int_0^{n\pi}e^{-x}(\sin x+\cos x)dx=\Big[-e^{-x}\cos x\Big]_0^{n\pi}=1-(-1)^ne^{-n\pi}=1-(-e^{-\pi})^n$이고,
      source_flow: g24.pdf p.52 문제 해설·p.55 예시 답안 문제 2(2)
      criteria:
      - 2.M2
    - id: 2b-4
      content: $|-e^{-\pi}|<1$이므로
      source_flow: g24.pdf p.52 문제 해설·p.55 예시 답안 문제 2(2)
      criteria:
      - 2.B1
    - id: 2b-5
      content: 극한값은 $\displaystyle\lim_{n\to\infty}a_n=\lim_{n\to\infty}\left(1-(-e^{-\pi})^n\right)=1$이다.
      source_flow: g24.pdf p.52 문제 해설·p.55 예시 답안 문제 2(2)
      criteria:
      - 2.A1
