  - $\int e^{-x}(\sin x+\cos x)dx=-e^{-x}\cos x+C$
  - $|r|<1$이면 $r^n\to0$, $\sum r^n=\frac{r}{1-r}$ ($r=-e^{-\pi}$)
  conditions:
  - $n$은 자연수
  - $|-e^{-\pi}|<1$
