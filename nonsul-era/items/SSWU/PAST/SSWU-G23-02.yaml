intent: 치환적분을 통하여 정적분을 원하는 형태로 바꿀 수 있는지를 확인하고(1), 부분적분을 활용하여 주어진 정적분을 계산할 수 있는지(2) 물어본다. 마지막으로 수열의 일반항을 구하여 주어진 등비급수의 합을 구할 수 있는지를 확인한다(3).
key_idea: $x\to x+\frac{\pi}{4}$ 치환과 덧셈정리로 $a_n=\int_0^{n\pi}e^{-x}(\sin x+\cos x)dx$ ($A=B=1$). 피적분함수의 부정적분이 $-e^{-x}\cos x$이므로 $a_n=1-(-e^{-\pi})^n$, 극한 $1$. $a_n-a_{n+1}=-(1+e^{-\pi})(-e^{-\pi})^n$는 공비 $-e^{-\pi}$인 등비급수.
stuck: $\sqrt2e^{\pi/4}$ 상수를 흡수하도록 $x+\frac{\pi}{4}$ 치환 방향을 잡는 단계, $e^{-x}(\sin x+\cos x)$의 부정적분 찾기
