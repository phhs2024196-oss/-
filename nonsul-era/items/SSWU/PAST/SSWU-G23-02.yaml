    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x+\frac{\pi}{4}$ 치환 후 덧셈정리로 $\sqrt2e^{\pi/4}\cdot e^{-\pi/4}\cdot\frac{1}{\sqrt2}=1$.
    steps:
    - id: 1a
      content: $a_n=\displaystyle\int_0^{n\pi}e^{-x}(\sin x+\cos x)dx$ → $A=B=1$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 치환적분을 통해 $a_n=\sqrt2\,e^{\frac{\pi}{4}}\displaystyle\int_{\frac{\pi}{4}}^{n\pi+\frac{\pi}{4}}e^{-x}\sin x\,dx=\sqrt2\,e^{\frac{\pi}{4}}\displaystyle\int_0^{n\pi}e^{-\left(x+\frac{\pi}{4}\right)}\sin\left(x+\dfrac{\pi}{4}\right)dx$으로 나타낼 수 있다.
      source_flow: g24.pdf p.52 문제 해설·p.55 예시 답안 문제 2(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\sin\left(x+\dfrac{\pi}{4}\right)=\dfrac{1}{\sqrt2}(\sin x+\cos x)$임을 이용하면 $a_n=\displaystyle\int_0^{n\pi}e^{-x}(\sin x+\cos x)dx$가 성립하므로 $A=1$, $B=1$임을 알 수 있다.
      source_flow: g24.pdf p.52 문제 해설·p.55 예시 답안 문제 2(1)
      criteria:
      - 1.A1
