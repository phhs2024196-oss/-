# 채점기준: 가이드북은 하위문항 배점(7·10·8)과 등급제(①~⑤ 단계)만 제시. criteria 의 단계별 배점 분할은 추정. 가이드북 문제 해설 (1)(2)의 적분 상한이 인쇄상 n+π/4 로 보이나 문제·평가기준은 nπ+π/4 (해설 오식으로 보고 문제 기준으로 기록)
