intent: 원의 성질을 활용하여 주어진 삼각형의 넓이를 구할 수 있는지를 확인해보며, 삼각비의 정의 또는 사인법칙과 코사인법칙 등을 이용하여 주어진 선분의 길이와 삼각형의 넓이를 식으로 표현할 수 있는지를 알아본다. 마지막으로 삼각함수의 극한을 계산할 수 있는지도 확인한다.
key_idea: 현 $\mathrm{P_2Q}$의 중점 $\mathrm{M}$에 대해 $\overline{\mathrm{O_2M}}=2\sin\theta$, $\overline{\mathrm{MQ}}=\sqrt{1-4\sin^2\theta}$, $\overline{\mathrm{O_1M}}=2\cos\theta$로 모든 길이를 $\theta$로 표현하고, 넓이의 합의 극한은 $\frac{\sin\theta}{\theta}\to1$로 처리한다.
stuck: 중심선에서 현에 내린 수선으로 $\overline{\mathrm{O_2M}}$, $\overline{\mathrm{O_1M}}$을 잡는 단계, $\ell(\theta)/\theta^2$ 극한에서 근호를 유리화하는 단계
