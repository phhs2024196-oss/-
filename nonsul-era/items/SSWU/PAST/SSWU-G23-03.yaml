stimuli: []
stem: |
  아래 그림과 같이 한 직선 $m$위에 지름이 놓인 두 반원의 반지름이 모두 $1$이며, 중심이 각각 $\mathrm{O_1}$, $\mathrm{O_2}$이고, 직선 $m$위의 한 점 $\mathrm{A}$에 대하여 $\overline{\mathrm{O_1A}}=\overline{\mathrm{O_2A}}=1$이다. 반원 $\mathrm{O_1}$ 위의 한 점 $\mathrm{P_1}$에 대해 $\angle\mathrm{P_1O_1A}=\theta$라고 할 때, 반직선 $\overrightarrow{\mathrm{O_1P_1}}$이 반원 $\mathrm{O_2}$와 만나는 두 점 중 점 $\mathrm{P_1}$에 가까운 순서대로 각각 $\mathrm{P_2}$, $\mathrm{Q}$라 하자. 다음 질문에 답하시오. (단, $0<\theta<\dfrac{\pi}{6}$이다.) [총 25점]

  [그림 1: 직선 $m$ 위에 왼쪽부터 $\mathrm{O_1}$, $\mathrm{A}$, $\mathrm{O_2}$가 놓이고 $\mathrm{O_1}$, $\mathrm{O_2}$를 중심으로 하는 반지름 $1$인 두 반원이 위쪽에 그려져 $\mathrm{A}$에서 접한다. $\mathrm{O_1}$에서 나가는 반직선이 $m$과 이루는 각이 $\theta$이고 이 반직선이 반원 $\mathrm{O_1}$ 위의 $\mathrm{P_1}$, 반원 $\mathrm{O_2}$ 위의 $\mathrm{P_2}$, $\mathrm{Q}$를 차례로 지난다.]
subparts:
- id: '1'
  stem: (1) $\sin\theta=\dfrac{1}{\sqrt5}$일 때, 삼각형 $\mathrm{P_2O_2Q}$의 넓이를 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: 2/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 이등변삼각형 $\mathrm{P_2O_2Q}$의 높이 $\overline{\mathrm{O_2M}}=2\sin\theta$와 밑변의 절반 $\overline{\mathrm{MQ}}$.
    steps:
    - id: 1a
      content: $\overline{\mathrm{O_2M}}=\frac{2}{\sqrt5}$, $\overline{\mathrm{MQ}}=\frac{1}{\sqrt5}$ → 넓이 $\frac12\cdot2\cdot\frac{1}{\sqrt5}\cdot\frac{2}{\sqrt5}=\frac25$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 선분 $\mathrm{P_2Q}$의 중점을 $\mathrm{M}$이라 할 때, 이등변삼각형 $\mathrm{P_2O_2Q}$에서 중선 $\mathrm{O_2M}$의 길이는 $\overline{\mathrm{O_2M}}=\overline{\mathrm{O_1O_2}}\sin\theta=2\sin\theta$이다.
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: 그러므로 $\sin\theta=\dfrac{1}{\sqrt5}$이면 $\overline{\mathrm{O_2M}}=2\sin\theta=\dfrac{2}{\sqrt5}$이다.
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: 따라서 $\overline{\mathrm{MQ}}=\sqrt{\overline{\mathrm{O_2Q}}^2-\overline{\mathrm{O_2M}}^2}=\sqrt{1-\dfrac45}=\dfrac{1}{\sqrt5}$이므로,
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(1)
      criteria:
      - 1.M3
    - id: 1b-4
      content: 삼각형 $\mathrm{P_2O_2Q}$의 넓이는 $\dfrac12\times2\times\overline{\mathrm{MQ}}\times\overline{\mathrm{O_2M}}=\dfrac{1}{\sqrt5}\times\dfrac{2}{\sqrt5}=\dfrac25$이다.
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(1)
      criteria:
      - 1.A1
