- id: '3'
  stem: (3) 삼각형 $\mathrm{O_1AP_1}$의 넓이를 $f(\theta)$, 삼각형 $\mathrm{O_1O_2Q}$의 넓이를 $g(\theta)$, 사각형 $\mathrm{AO_2P_2P_1}$의 넓이를 $h(\theta)$라고 하자. 이때, $f(\theta)$, $g(\theta)$, $h(\theta)$를 구하고, $\displaystyle\lim_{\theta\to0+}\dfrac{f(\theta)+g(\theta)+h(\theta)}{\theta}$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: f = sin(t)/2; g = (2*cos(t)+sqrt(1-4*sin(t)**2))*sin(t); h = 2*sin(t)*cos(t)-sin(t)*sqrt(1-4*sin(t)**2)-sin(t)/2; lim = 4
    equivalents:
    - $f=\frac12\sin\theta$, $g=(2\cos\theta+\sqrt{1-4\sin^2\theta})\sin\theta$, $h=g-2\sin\theta\sqrt{1-4\sin^2\theta}-f$, 극한값 $4$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f=\frac12\sin\theta$, $g=\frac12\overline{\mathrm{O_1Q}}\cdot\overline{\mathrm{O_2M}}$, $h=g-\triangle\mathrm{P_2O_2Q}-f$ → 합은 $2g-2\sin\theta\sqrt{1-4\sin^2\theta}=4\sin\theta\cos\theta$.
    steps:
    - id: 3a
      content: $f+g+h=4\sin\theta\cos\theta$, 극한 $4$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.M4
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: 점 $\mathrm{A}$에서 선분 $\mathrm{O_1Q}$에 내린 수선의 발을 $\mathrm{N}$이라 할 때, 직각삼각형 $\mathrm{O_1AN}$에서 $\overline{\mathrm{AN}}=\overline{\mathrm{O_1A}}\sin\theta=\sin\theta$이므로, 삼각형 $\mathrm{O_1AP_1}$의 넓이는 $f(\theta)=\dfrac12\times\overline{\mathrm{O_1P_1}}\times\overline{\mathrm{AN}}=\dfrac12\sin\theta$이다.
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: 삼각형 $\mathrm{O_1O_2Q}$의 넓이는 $g(\theta)=\dfrac12\times\overline{\mathrm{O_1Q}}\times\overline{\mathrm{O_2M}}$인데, $\overline{\mathrm{O_1Q}}=\overline{\mathrm{O_1M}}+\overline{\mathrm{MQ}}=2\cos\theta+\sqrt{\overline{\mathrm{O_2Q}}^2-\overline{\mathrm{O_2M}}^2}=2\cos\theta+\sqrt{1-4\sin^2\theta}$이므로 $g(\theta)=\left(2\cos\theta+\sqrt{1-4\sin^2\theta}\right)\sin\theta$이다.
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: 삼각형 $\mathrm{P_2O_2Q}$의 넓이는 $\dfrac12\times\overline{\mathrm{P_2Q}}\times\overline{\mathrm{O_2M}}=\overline{\mathrm{MQ}}\times\overline{\mathrm{O_2M}}=\sqrt{1-4\sin^2\theta}\times2\sin\theta$이고, 사각형 $\mathrm{AO_2P_2P_1}$의 넓이는 $h(\theta)=$(삼각형 $\mathrm{O_1O_2Q}$의 넓이)$-$(삼각형 $\mathrm{P_2O_2Q}$의 넓이)$-$(삼각형 $\mathrm{O_1AP_1}$의 넓이)이므로 $h(\theta)=g(\theta)-\sqrt{1-4\sin^2\theta}\times2\sin\theta-f(\theta)$이다.
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: 따라서 $\displaystyle\lim_{\theta\to0+}\dfrac{f(\theta)+g(\theta)+h(\theta)}{\theta}=\lim_{\theta\to0+}\dfrac{2g(\theta)-2\sin\theta\sqrt{1-4\sin^2\theta}}{\theta}=\lim_{\theta\to0+}\dfrac{4\sin\theta\cos\theta}{\theta}$
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(3)
      criteria:
      - 3.M4
    - id: 3b-5
      content: $=\displaystyle\lim_{\theta\to0+}\left(4\times\dfrac{\sin\theta}{\theta}\times\cos\theta\right)=4\times1\times1=4$이다.
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(3)
      criteria:
      - 3.A1
