    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\ell=\overline{\mathrm{O_1M}}-\overline{\mathrm{P_2M}}-1$, 극한은 $\frac{2(\cos\theta-1)}{\theta^2}\to-1$과 유리화한 항 $\to2$의 합.
    steps:
    - id: 2a
      content: $\ell(\theta)=2\cos\theta-\sqrt{1-4\sin^2\theta}-1$, $\dfrac{\ell}{\theta^2}\to-1+2=1$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.M4
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 직각삼각형 $\mathrm{O_1O_2M}$에서 $\overline{\mathrm{O_2M}}=\overline{\mathrm{O_1O_2}}\sin\theta=2\sin\theta$이고,
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: $\overline{\mathrm{O_1M}}=\overline{\mathrm{O_1O_2}}\cos\theta=2\cos\theta$이다.
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: 그리고 $\overline{\mathrm{P_2M}}=\sqrt{\overline{\mathrm{O_2P_2}}^2-\overline{\mathrm{O_2M}}^2}=\sqrt{1-4\sin^2\theta}$이다.
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: 따라서 $\ell(\theta)=\overline{\mathrm{P_1P_2}}=\overline{\mathrm{O_1M}}-\overline{\mathrm{P_2M}}-\overline{\mathrm{O_1P_1}}=2\cos\theta-\sqrt{1-4\sin^2\theta}-1$이다.
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(2)
      criteria:
      - 2.M4
    - id: 2b-5
      content: $\dfrac{\ell(\theta)}{\theta^2}=\dfrac{2\cos\theta-1-\sqrt{1-4\sin^2\theta}}{\theta^2}=\dfrac{2(\cos\theta-1)}{\theta^2}+\dfrac{1-\sqrt{1-4\sin^2\theta}}{\theta^2}=\dfrac{2(\cos\theta-1)}{\theta^2}+\dfrac{4\sin^2\theta}{\theta^2\left(1+\sqrt{1-4\sin^2\theta}\right)}$이 되고, $\displaystyle\lim_{\theta\to0+}\dfrac{2(\cos\theta-1)}{\theta^2}=\lim_{\theta\to0+}\dfrac{2(\cos\theta-1)(\cos\theta+1)}{\theta^2(\cos\theta+1)}=\lim_{\theta\to0+}\dfrac{-2\sin^2\theta}{\theta^2(\cos\theta+1)}=-1$이므로 $\displaystyle\lim_{\theta\to0+}\dfrac{\ell(\theta)}{\theta^2}=-1+2=1$이 된다.
      source_flow: g24.pdf p.58~61 예시 답안 문제 3(2)
      criteria:
      - 2.A1
