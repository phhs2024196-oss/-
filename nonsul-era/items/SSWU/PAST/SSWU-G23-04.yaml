    - id: 3b-1
      content: 주어진 보안정책에 따라 수정이가 비밀번호를 정할 때 가능한 비밀번호의 길이는 다섯 자리(같은 숫자가 세 번 이상 연속해서 나타나지 않는 비밀번호)와 일곱 자리(앞 다섯 자리에 같은 숫자가 세 번 이상 연속해서 나타나는 비밀번호)이다.
      source_flow: g24.pdf p.70 문제 해설·p.73 예시 답안 문제 4(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: 일곱 자리의 비밀번호는 앞의 다섯 자리에 같은 숫자가 세 번 이상 연속해서 나타나고 뒤에 두 자리가 추가된 비밀번호이다.
      source_flow: g24.pdf p.70 문제 해설·p.73 예시 답안 문제 4(3)
      criteria:
      - 3.M1
    - id: 3b-3
      content: 아무 숫자나 사용할 수 있는 모든 다섯 자리 비밀번호의 가짓수는 $10^5=100000$이고, 여기에서 같은 숫자가 세 번 이상 연속해서 나타나는 비밀번호는 허용되지 않으므로 (2)에서 구한 $2800$개를 제외하여 허용된 다섯 자리의 비밀번호의 가짓수 $100000-2800=97200$가지를 구할 수 있다.
      source_flow: g24.pdf p.70 문제 해설·p.73 예시 답안 문제 4(3)
      criteria:
      - 3.M2
    - id: 3b-4
      content: 일곱 자리의 비밀번호는 같은 숫자가 세 번 이상 연속해서 나타나는 다섯 자리 비밀번호의 뒤쪽에 두 자리가 더해졌으므로 가능한 가짓수는 $2800\times10^2=280000$가지로 구할 수 있다.
      source_flow: g24.pdf p.70 문제 해설·p.73 예시 답안 문제 4(3)
      criteria:
      - 3.M3
