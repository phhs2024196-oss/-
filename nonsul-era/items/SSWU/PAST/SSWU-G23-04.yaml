intent: 하나의 조건에서 다른 조건을 추가함에 따라 각각 해당 조건들을 만족하는 경우의 수를 계산하는 능력이 있는지 평가한다. 이러한 조건들을 조합하여 하나의 정책으로 적용했을 때, 수학적 의미를 이해하여 해당하는 경우의 수를 구할 수 있는지 평가한다.
key_idea: 같은 숫자 $a$가 세 번 이상이면 그 숫자는 하나뿐이므로 $a$가 $3,4,5$번 나오는 경우를 나누어 $10$배 한다. 연속 3회 이상은 $aaa$의 위치(앞·가운데·뒤)와 양옆이 $a$가 아니라는 조건으로 나눈다. (3)은 연속 3회 이상이 없는 5자리 $97200$과 있는 5자리에 두 자리를 붙인 $2800\times10^2$의 합.
stuck: 연속 조건에서 $aaa$ 앞뒤 칸에 $a$가 오지 않도록 위치별로 나누어 세는 단계, (3)에서 5자리와 7자리 비밀번호의 경우를 분리하는 단계
