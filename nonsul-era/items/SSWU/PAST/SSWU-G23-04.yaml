- id: '3'
  stem: (3) 이 사이트의 보안정책은 사용자가 다섯 자리 비밀번호를 사용하도록 하지만, 사용자가 선택한 비밀번호에 같은 숫자가 세 번 이상 연속하여 나타나면 뒤쪽에 두 자리를 추가하여 일곱 자리의 비밀번호를 사용하도록 강제한다. 이러한 보안정책에 따라 수정이가 선택할 수 있는 모든 비밀번호의 가짓수를 구하시오. [8점]
