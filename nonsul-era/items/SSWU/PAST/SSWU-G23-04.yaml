    audience: A
    method_no: 1
    key_idea: 연속 조건을 어기지 않는 5자리 $10^5-2800$과, 연속 조건을 만족하는 5자리 $2800$에 두 자리를 붙인 $2800\times10^2$의 합.
    steps:
    - id: 3a
      content: $97200+280000=377200$
      criteria:
