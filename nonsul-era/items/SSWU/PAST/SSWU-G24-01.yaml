subparts:
- id: '1'
  stem: (1) $x$축 위의 점 $(a,0)$에서 곡선 $y=f(x)$에 그을 수 있는 접선의 개수가 1인 실수 $a$의 범위를 구하시오. [7점]
  points: 7
  depends_on: []
  answer:
    kind: value
    value: 1/3<a<3
    equivalents:
    - 1/3 < a < 3
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접점의 $x$좌표 $t$가 $-t(2t^2-3(a+1)t+6a)=0$을 만족하고, $t=0$ 외에 실근이 없을 조건은 판별식 $D<0$이다.
    steps:
    - id: 1a
      content: $D=3(3a-1)(a-3)<0$ $\Rightarrow$ $\frac13<a<3$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.M4
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=f(x)$ 위의 점 $(t,f(t))$에서의 접선의 방정식은 $y-(t^3-3t^2)=(3t^2-6t)(x-t)$, 즉 $y=(3t^2-6t)x-2t^3+3t^2$이다.
      source_flow: g25.pdf p.46 예시답안 문제 1(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        접선이 $(a,0)$을 지나므로 $0=(3t^2-6t)a-2t^3+3t^2=-t\left(2t^2-3(a+1)t+6a\right)$을 만족하는 $t$가 접점의 $x$좌표이다.
      source_flow: g25.pdf p.46 예시답안 문제 1(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $t=0$이 접점의 $x$좌표이고, $t=0$이 이차방정식 $2t^2-3(a+1)t+6a=0$의 중근이 될 수 없으므로, 접선의 개수가 1이려면 이차방정식 $2t^2-3(a+1)t+6a=0$의 실근이 없어야 한다.
      source_flow: g25.pdf p.46 예시답안 문제 1(1)
      criteria:
      - 1.M3
    - id: 1b-4
      content: 이 이차방정식의 판별식이 $D=9(a+1)^2-48a=9a^2-30a+9=3(3a-1)(a-3)$이므로
      source_flow: g25.pdf p.46 예시답안 문제 1(1)
      criteria:
      - 1.M4
    - id: 1b-5
      content: 접선의 개수가 1이려면 $D<0$으로부터 $\dfrac13<a<3$이다.
      source_flow: g25.pdf p.46 예시답안 문제 1(1)
      criteria:
      - 1.A1
