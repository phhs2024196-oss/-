- id: '3'
  stem: (3) $y$축 위의 점 $(0,b)$에서 곡선 $y=f(x)$에 그을 수 있는 접선의 개수가 3인 실수 $b$의 범위를 구하시오. [8점]
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 0<b<1
    equivalents:
    - 0 < b < 1
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      접선이 $(0,b)$를 지나면 $-2t^3+3t^2=b$이므로, $g(t)=-2t^3+3t^2$의 그래프와 직선 $y=b$가 서로 다른 세 점에서 만날 조건을 본다.
    steps:
    - id: 3a
      content: 극솟값 $g(0)=0$, 극댓값 $g(1)=1$ $\Rightarrow$ $0<b<1$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        곡선 $y=f(x)$ 위의 점 $(t,f(t))$에서의 접선의 방정식 $y=(3t^2-6t)x-2t^3+3t^2$이 $(0,b)$를 지나므로 $-2t^3+3t^2=b$의 서로 다른 근의 개수가 3인 $b$의 범위를 찾으면 된다.
      source_flow: g25.pdf p.46 예시답안 문제 1(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $g(t)=-2t^3+3t^2$이라 할 때, $g^{\prime}(t)=-6t^2+6t=-6t(t-1)$이므로 $y=g(t)$의 그래프의 증감을 표로 나타내면 다음과 같다. [표: $t<0$에서 $g^{\prime}(t)<0$(감소), $t=0$에서 $g^{\prime}(t)=0$, $g(0)=0$, $0<t<1$에서 $g^{\prime}(t)>0$(증가), $t=1$에서 $g^{\prime}(t)=0$, $g(1)=1$, $t>1$에서 $g^{\prime}(t)<0$(감소)]
      source_flow: g25.pdf p.46 예시답안 문제 1(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        이를 바탕으로 $y=g(t)$의 그래프의 개형을 그리면 다음과 같다. [그림: $y=g(t)$는 $t=0$에서 극솟값 0, $t=1$에서 극댓값 1(점 $(1,1)$)을 갖는 삼차함수 그래프(최고차항 계수 음수)]
      source_flow: g25.pdf p.46 예시답안 문제 1(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: 따라서 $g(t)=b$의 서로 다른 근의 개수가 3인 $b$의 범위는 $0<b<1$이다.
      source_flow: g25.pdf p.46 예시답안 문제 1(3)
      criteria:
      - 3.A1
