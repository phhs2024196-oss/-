- id: '2'
  stem: |
    (2) $x$축 위의 점 $(a,0)$에서 곡선 $y=f(x)$에 그은 모든 접선에 대하여 접점들의 $x$좌표의 합이 1이 되는 실수 $a$의 값을 모두 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: -1/3; 1/3
    equivalents:
    - a=-1/3 또는 a=1/3
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $t=0$은 합에 영향이 없으므로 이차방정식 $2t^2-3(a+1)t+6a=0$의 근을 본다. $D>0$이면 두 근의 합 $\frac32(a+1)=1$, $D=0$이면 중근 $t=\frac{3(a+1)}{4}$가 1이어야 한다.
    steps:
    - id: 2a
      content: |
        $D>0$: $a=-\frac13$, $D=0$: $a=\frac13$(합 1), $a=3$(합 $3\ne1$) $\Rightarrow$ $a=-\frac13,\ \frac13$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.M4
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        앞의 문제 (1)에서 접점의 $x$좌표 $t$는 $t\left(2t^2-3(a+1)t+6a\right)=0$을 만족한다. 여기에서 $t=0$은 접점의 $x$좌표의 합에 영향을 주지 않는다. 따라서 $2t^2-3(a+1)t+6a=0$을 만족하는 접점의 $x$좌표 $t$를 살펴보면 된다.
      source_flow: g25.pdf p.46 예시답안 문제 1(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        이 이차방정식의 판별식이 $D=3(3a-1)(a-3)$이므로 $a<\dfrac13$ 또는 $a>3$일 때 $D>0$이며, 이차방정식의 서로 다른 두 실근의 합 $\dfrac{3(a+1)}{2}$이 1이 되는 $a$의 값은 $a=-\dfrac13$이다.
      source_flow: g25.pdf p.46 예시답안 문제 1(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: $a=\dfrac13$일 때는 $D=0$이고, $2t^2-4t+2=2(t-1)^2=0$에서 $t=1$이 중근이므로 접점의 $x$좌표의 합이 1이다.
      source_flow: g25.pdf p.46 예시답안 문제 1(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: $a=3$일 때는 $D=0$이고, $2t^2-12t+18=2(t-3)^2=0$에서 $t=3$이 중근이므로 접점의 $x$좌표의 합이 1이 아니다.
      source_flow: g25.pdf p.46 예시답안 문제 1(2)
      criteria:
      - 2.M4
    - id: 2b-5
      content: 따라서 문제의 조건을 만족하는 $a$의 값은 $a=-\dfrac13$과 $a=\dfrac13$이다.
      source_flow: g25.pdf p.46 예시답안 문제 1(2)
      criteria:
      - 2.A1
