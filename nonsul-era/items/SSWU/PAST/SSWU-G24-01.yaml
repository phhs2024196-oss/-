intent: |
  다항함수의 그래프 위 점에서의 접선의 방정식을 구하고, 그 접선이 주어진 점을 지나는 조건을 방정식으로 나타내어 접선의 개수가 1이 될 $a$의 범위를 논리적으로 서술할 수 있는지 살펴본다. 또한 접점의 $x$좌표의 합을 나타내는 식을 표현하고 그 합이 주어진 조건을 만족하는 $a$의 값을 구할 수 있는지 평가한다. 그리고 $y$축 위의 점에서 그을 수 있는 접선의 개수를 분석하기 위해 함수의 그래프의 개형을 활용할 수 있는지 평가한다.
