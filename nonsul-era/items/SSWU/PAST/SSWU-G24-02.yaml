- id: '2'
  stem: |
    (2) 위의 (1)에서 구한 식으로부터 함수 $f(t)$의 최댓값을 구하고, 함수 $f(t)$가 최대일 때 두 정삼각형의 내부의 공통부분으로 이루어진 도형의 둘레의 길이를 구하시오. [7점]
  points: 7
