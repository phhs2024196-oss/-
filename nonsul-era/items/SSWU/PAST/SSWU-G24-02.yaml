  stem: |
    (3) 다음 그림과 같이 한 변의 길이가 1인 정육각형 $\mathrm{A_1B_1C_1D_1E_1F_1}$에 놓인 두 삼각형 $\mathrm{A_1C_1E_1}$과 $\mathrm{B_1D_1F_1}$의 내부로 이루어진 도형에서 이 두 삼각형의 내부의 공통부분인 정육각형 $\mathrm{A_2B_2C_2D_2E_2F_2}$의 내부를 뺀 도형의 넓이를 $S_1$이라 하고, 정육각형 $\mathrm{A_2B_2C_2D_2E_2F_2}$에 놓인 두 삼각형 $\mathrm{A_2C_2E_2}$와 $\mathrm{B_2D_2F_2}$의 내부로 이루어진 도형에서 이 두 삼각형의 내부의 공통부분인 정육각형 $\mathrm{A_3B_3C_3D_3E_3F_3}$의 내부를 뺀 도형의 넓이를 $S_2$라 하자. 이와 같은 과정을 계속하여 $n$번째 얻은 도형의 넓이를 $S_n$이라 할 때, $\displaystyle\sum_{n=1}^{\infty}S_n$을 구하시오. [8점]

    [그림 2: 왼쪽 그림 $S_1$은 정육각형 $\mathrm{A_1B_1C_1D_1E_1F_1}$(꼭짓점이 $\mathrm{A_1}$(왼쪽 위), $\mathrm{F_1}$(오른쪽 위), $\mathrm{E_1}$(오른쪽 끝), $\mathrm{D_1}$(오른쪽 아래), $\mathrm{C_1}$(왼쪽 아래), $\mathrm{B_1}$(왼쪽 끝)) 안의 두 삼각형 $\mathrm{A_1C_1E_1}$, $\mathrm{B_1D_1F_1}$이 겹쳐 이루는 육각별 모양에서 안쪽 정육각형 $\mathrm{A_2B_2C_2D_2E_2F_2}$(꼭짓점 $\mathrm{F_2}$ 위, $\mathrm{A_2}$ 왼쪽 위, $\mathrm{B_2}$ 왼쪽 아래, $\mathrm{C_2}$ 아래, $\mathrm{D_2}$ 오른쪽 아래, $\mathrm{E_2}$ 오른쪽 위)를 뺀 여섯 개의 작은 삼각형(색칠)이다. 오른쪽 그림 $S_2$는 같은 과정을 정육각형 $\mathrm{A_2B_2C_2D_2E_2F_2}$ 안에서 한 번 더 반복하여 안쪽 정육각형 $\mathrm{A_3B_3C_3D_3E_3F_3}$을 뺀 여섯 개의 작은 삼각형(색칠)이다.]
