  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $0<t\le\frac32$에서 증가, $\frac32<t<3$에서 $f(t)=-\frac{\sqrt3}{2}((t-2)^2-1)$이므로 $t=2$에서 최대. 이때 도형은 한 변이 $\frac{\sqrt3}{3}$인 정육각형이다.
    steps:
    - id: 2a
      content: 최댓값 $\frac{\sqrt3}{2}$($t=2$), 정육각형 한 변 $\frac{\sqrt3}{3}$, 둘레 $2\sqrt3$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $f(t)=\begin{cases}\dfrac{t^2}{2\sqrt3}, & 0<t\le\dfrac32\\[2mm] -\dfrac{\sqrt3}{2}(t^2-4t+3), & \dfrac32<t<3\end{cases}$의 그래프는 $0<t\le\dfrac32$에서 증가함수이고 $f\left(\dfrac32\right)=\dfrac{3\sqrt3}{8}$이다.
      source_flow: g25.pdf p.41 예시답안 문제 2(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\dfrac32<t<3$일 때 $f(t)=-\dfrac{\sqrt3}{2}(t^2-4t+3)=-\dfrac{\sqrt3}{2}\left((t-2)^2-1\right)$이므로 $t=2$일 때, 극댓값 $\dfrac{\sqrt3}{2}$을 갖는다. 따라서 이 함수의 최댓값은 $\dfrac{\sqrt3}{2}$이다. [그림: $y=f(t)$의 그래프, $0<t\le\frac32$에서 증가하는 곡선이 이어져 $t=2$에서 최댓값 $\frac{\sqrt3}{2}$, $t=3$에서 0]
      source_flow: g25.pdf p.41 예시답안 문제 2(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        이때 6개의 삼각형 MFN, NBO, ODP, PCK, KEL, LAM은 모두 높이가 $\dfrac12$인 정삼각형이므로, 함수가 최대가 될 때의 도형은 한 변의 길이가 $\dfrac{\sqrt3}{3}$인 정육각형이다. 따라서 둘레의 길이는 $2\sqrt3$이다.
      source_flow: g25.pdf p.41 예시답안 문제 2(2)
      criteria:
      - 2.A1
