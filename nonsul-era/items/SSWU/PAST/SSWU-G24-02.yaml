stimuli: []
stem: 다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: |
    (1) 좌표 평면 위에 한 변의 길이가 $\sqrt3$인 두 정삼각형 ABC, DEF가 다음 그림과 같이 변 AB와 변 DE는 $x$축에 수직이고, 꼭짓점 C, F는 $x$축 위에 있으며, F의 $x$좌표가 0이 되도록 놓여 있다. 실수 $t$에 대하여 점 C의 $x$좌표를 $t$라 할 때, 두 정삼각형의 내부의 공통부분으로 이루어진 도형의 넓이 $f(t)$를 $t$에 대한 식으로 표현하시오. (단, $0<t<3$이다.) [10점]

    [그림 1: 두 그림 모두 변 AB(A가 위, B가 아래)와 변 ED(E가 위, D가 아래)는 $x$축에 수직이고, F는 원점(0), C는 $x$축 위의 $x=t$이다. 왼쪽 그림은 $t$가 작아 두 정삼각형의 공통부분(색칠)이 꼭짓점 F, C를 지나는 마름모이고, 오른쪽 그림은 $t$가 커서 공통부분(색칠)이 육각형이다.]
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: f1=t^2/(2*sqrt(3)); f2=-sqrt(3)/2*(t^2-4*t+3)
    equivalents:
    - $f(t)=\frac{t^2}{2\sqrt3}\ (0<t\le\frac32),\ -\frac{\sqrt3}{2}(t^2-4t+3)\ (\frac32<t<3)$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $0<t\le\frac32$이면 마름모 $=$ 높이 $\frac t2$인 정삼각형 2개, $\frac32<t<3$이면 육각형 $=$ 사다리꼴 2개의 합이다.
    steps:
    - id: 1a
      content: |
        $f(t)=\dfrac{t^2}{2\sqrt3}\ (0<t\le\frac32)$, $f(t)=-\dfrac{\sqrt3}{2}(t^2-4t+3)\ (\frac32<t<3)$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $0<t\le\dfrac32$인 경우: 두 정삼각형의 내부의 공통부분으로 이루어진 도형은 마름모이고, 이 마름모는 2개의 높이가 $\dfrac t2$인 정삼각형으로 나누어지므로 이의 넓이는 $f(t)=2\times\dfrac t2\times\dfrac1{\sqrt3}\times\dfrac t2=\dfrac{t^2}{2\sqrt3}$이다.
      source_flow: g25.pdf p.41 예시답안 문제 2(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\dfrac32<t<3$인 경우: 두 사다리꼴 MNOL과 LOPK의 면적의 합을 구하면 된다. [그림: 육각형 KLMNOP가 공통부분(색칠)이며, 점 T, U는 $x$축 위의 점이고 $t-\frac32$와 $\frac32$가 $x$축 위에 표시되어 있다.]
      source_flow: g25.pdf p.41 예시답안 문제 2(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\overline{\mathrm{MN}}=\dfrac{2t-3}{\sqrt3}$, $\overline{\mathrm{LO}}=\dfrac{t}{\sqrt3}$, 사다리꼴의 높이는 $\dfrac{3-t}{2}$이므로 육각형 KLMNOP의 넓이는 $\dfrac{\left(\dfrac{2t-3}{\sqrt3}+\dfrac{t}{\sqrt3}\right)}{2}\times\dfrac{(3-t)}{2}\times2$이다.
      source_flow: g25.pdf p.41 예시답안 문제 2(1)
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        정리하면 $\dfrac32<t<3$인 경우 육각형 KLMNOP의 넓이는 $f(t)=-\dfrac{\sqrt3}{2}(t^2-4t+3)$이다. 그러므로 $f(t)=\begin{cases}\dfrac{t^2}{2\sqrt3}, & 0<t\le\dfrac32\\[2mm] -\dfrac{\sqrt3}{2}(t^2-4t+3), & \dfrac32<t<3\end{cases}$이다.
      source_flow: g25.pdf p.41 예시답안 문제 2(1)
      criteria:
      - 1.A1
  - id: S1-B2
    audience: B
    method_no: 2
    steps:
    - id: 1c-1
      content: |
        $\dfrac32<t<3$인 경우 [풀이 방법 1] 육각형 KLMNOP의 넓이는 정삼각형 LFO의 넓이에서 정삼각형 MFN의 넓이를 뺀 것의 2배이다. $\triangle\mathrm{LFO}$의 넓이는 $\left(\dfrac t2\right)^2\times\dfrac1{\sqrt3}=\dfrac{t^2}{4\sqrt3}$이고 $\triangle\mathrm{MFN}$의 넓이는 $\left(t-\dfrac32\right)^2\times\dfrac1{\sqrt3}$이므로 육각형 KLMNOP의 넓이는 $2\times\left(\dfrac{t^2}{4\sqrt3}-\left(t-\dfrac32\right)^2\times\dfrac1{\sqrt3}\right)$이다.
      source_flow: g25.pdf p.43 채점 기준 문제 2(1) 풀이 방법 1
      criteria:
      - 1.M3
