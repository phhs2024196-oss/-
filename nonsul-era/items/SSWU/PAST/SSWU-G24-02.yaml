intent: |
  문제의 조건에 따라 변수 $t$의 범위를 나누어 $t$에 따라 도형이 어떻게 변하는지를 이해하고 각각의 경우에 주어진 도형의 넓이를 잘 구할 수 있는지 확인한다. 그리고 이렇게 정의된 함수가 이차함수이므로 함수의 그래프 또는 함수의 증감과 극대를 활용하여 이 함수 $f(t)$의 최댓값을 구할 수 있는지 확인한다. 마지막으로 함수 $f(t)$가 최댓값을 가질 때의 $t$의 값을 두 삼각형의 공통부분으로 주어지는 도형에 적용하여 이 도형이 어떤 모양인지를 유추하는 능력을 확인한다. 그리고 정육각형 $\mathrm{A_nB_nC_nD_nE_nF_n}$에 놓인 두 정삼각형의 내부로 이루어진 도형에서 공통부분을 뺀 도형의 넓이 $S_n$으로 주어진 수열이 등비수열임을 확인하고 이 수열의 초항과 공비를 구하여 주어진 급수의 합을 구할 수 있는지 확인한다.
