- id: '2'
  stem: (2) $\displaystyle\lim_{n\to\infty}\dfrac{\theta_n}{\alpha_n}$을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $\mathrm{C}_n(t,nt)$, $\mathrm{B}_n(-2t,-2nt)$로 두고 $\tan\theta_n$을 두 직각삼각형에서 각각 구해 같다고 놓으면 $t=\frac1{4n}$, $\tan\theta_n=\frac1{3n}$이다.
    steps:
    - id: 2a
      content: |
        $\tan\theta_n=\frac1{3n}$, $\tan\alpha_n=\frac1n$, $\theta_n,\alpha_n\to0$ $\Rightarrow$ 극한 $\frac13$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\overline{\mathrm{OB}_n}:\overline{\mathrm{OC}_n}=2:1$이므로, $\mathrm{C}_n$의 $x$좌표를 $t_n$으로 두면 $\mathrm{C}_n(t_n,nt_n)$이고, $\mathrm{B}_n$의 좌표는 $\mathrm{B}_n(-2t_n,-2nt_n)$으로 쓸 수 있다.
      source_flow: g25.pdf p.47 예시답안 문제 3(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\mathrm{B}_n$에서 $y$축에 내린 수선과 $y$축이 만나는 점을 $\mathrm{D}_n$, $\mathrm{C}_n$에서 $y$축에 내린 수선과 $y$축이 만나는 점을 $\mathrm{E}_n$이라 하면 직각삼각형 $\mathrm{AB_nD_n}$에서 $\tan\theta_n=\dfrac{2t_n}{1+2nt_n}$이고, 직각삼각형 $\mathrm{AC_nE_n}$에서 $\tan\theta_n=\dfrac{t_n}{1-nt_n}$이다.
      source_flow: g25.pdf p.47 예시답안 문제 3(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $\dfrac{2t_n}{1+2nt_n}=\dfrac{t_n}{1-nt_n}$로부터 $t_n=\dfrac1{4n}$을 얻고, $\tan\theta_n=\dfrac1{3n}$이다.
      source_flow: g25.pdf p.47 예시답안 문제 3(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: |
        $0<\theta_n<\theta_n+\angle\mathrm{AB_nO}=\alpha_n$이고 $\displaystyle\lim_{n\to\infty}\alpha_n=0$이므로 $\displaystyle\lim_{n\to\infty}\theta_n=0$이다. 따라서 구하는 극한 값은 $\displaystyle\lim_{n\to\infty}\dfrac{\tan\alpha_n}{\alpha_n}=1$, $\displaystyle\lim_{n\to\infty}\dfrac{\theta_n}{\tan\theta_n}=1$, $\displaystyle\lim_{n\to\infty}\dfrac{\tan\theta_n}{\tan\alpha_n}=\lim_{n\to\infty}\dfrac{1/3n}{1/n}=\dfrac13$이므로 $\displaystyle\lim_{n\to\infty}\dfrac{\theta_n}{\alpha_n}=\lim_{n\to\infty}\dfrac{\tan\alpha_n}{\alpha_n}\cdot\dfrac{\theta_n}{\tan\theta_n}\cdot\dfrac{\tan\theta_n}{\tan\alpha_n}=\dfrac13$이다.
      source_flow: g25.pdf p.47 예시답안 문제 3(2)
      criteria:
      - 2.A1
