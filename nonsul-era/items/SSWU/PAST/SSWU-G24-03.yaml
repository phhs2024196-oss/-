stimuli: []
stem: |
  오른쪽 그림과 같이 자연수 $n$과 원점 $\mathrm{O}$, 점 $\mathrm{A}(0,1)$에 대하여 직선 $y=nx$ 위에 $\overline{\mathrm{OB}_n}:\overline{\mathrm{OC}_n}=2:1$이면서 $\angle\mathrm{OAB}_n=\angle\mathrm{OAC}_n$이 되도록 제3사분면의 점 $\mathrm{B}_n$과 제1사분면의 점 $\mathrm{C}_n$을 잡는다. $\angle\mathrm{OAB}_n=\theta_n$, $\angle\mathrm{AOC}_n=\alpha_n$이라 하자. $\left(0<\theta_n<\dfrac\pi2,\ 0<\alpha_n<\dfrac\pi2\right)$

  [그림 1: 좌표평면에 $y$축 위의 점 $\mathrm{A}(0,1)$, 원점 $\mathrm{O}$, 오른쪽 위로 향하는 직선 $y=nx$가 있다. 직선 위의 제1사분면의 점 $\mathrm{C}_n$($y$축 가까이)과 제3사분면의 점 $\mathrm{B}_n$이 있고, 선분 $\mathrm{AB}_n$과 $\mathrm{AC}_n$이 그려져 있다. $\angle\mathrm{OAB}_n=\theta_n$(점 A에서의 각)과 $\angle\mathrm{AOC}_n=\alpha_n$($y$축과 직선 $OC_n$ 사이의 각)이 표시되어 있다.]

  다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: (1) $\sin\alpha_n$과 $\tan\alpha_n$을 각각 $n$에 대한 식으로 나타내시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: sin=1/sqrt(n^2+1); tan=1/n
    equivalents:
    - $\sin\alpha_n=\frac{1}{\sqrt{n^2+1}}$, $\tan\alpha_n=\frac1n$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 직선 $y=nx$ 위의 점 $(1,n)$과 $y$축 위의 점 $(0,n)$으로 직각삼각형을 만들어 $\alpha_n$의 삼각비를 읽는다.
    steps:
    - id: 1a
      content: $\tan\alpha_n=\frac1n$, $\sin\alpha_n=\frac{1}{\sqrt{n^2+1}}$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직선 $y=nx$ 위에서 예를 들어 한 점 $\mathrm{P}_n(1,n)$을 잡으면 $y$축 위의 점 $\mathrm{Q}_n(0,n)$에 대하여 삼각형 $\mathrm{OP_nQ_n}$은 직각삼각형이다. [그림: $\mathrm{Q}_n(0,n)$이 위 왼쪽, $\mathrm{P}_n(1,n)$이 위 오른쪽, $\mathrm{O}(0,0)$이 아래이고 $\angle\mathrm{Q_nOP_n}=\alpha_n$인 직각삼각형]
      source_flow: g25.pdf p.47 예시답안 문제 3(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 $\tan\alpha_n=\dfrac{\overline{\mathrm{Q_nP_n}}}{\overline{\mathrm{OQ_n}}}=\dfrac1n$이다.
      source_flow: g25.pdf p.47 예시답안 문제 3(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        삼각형의 빗변의 길이는 $\sqrt{n^2+1}$이므로 $\sin\alpha_n=\dfrac{\overline{\mathrm{Q_nP_n}}}{\overline{\mathrm{OP_n}}}=\dfrac1{\sqrt{n^2+1}}$이다.
      source_flow: g25.pdf p.47 예시답안 문제 3(1)
      criteria:
      - 1.A1
