- id: '3'
  stem: |
    (3) 삼각형 $\mathrm{AB}_n\mathrm{C}_n$의 넓이를 $S_n$이라 할 때, $\displaystyle\sum_{n=1}^{\infty}S_nS_{n+1}$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 9/64
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      $t_n=\frac1{4n}$으로 두 점의 좌표를 구하면 $S_n=\frac3{8n}$이고, $S_nS_{n+1}=\frac9{64}\left(\frac1n-\frac1{n+1}\right)$로 부분분수 합이다.
    steps:
    - id: 3a
      content: $S_n=\frac3{8n}$ $\Rightarrow$ $\sum S_nS_{n+1}=\frac9{64}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $t_n=\dfrac1{4n}$을 이용하면 $\mathrm{B}_n\left(-\dfrac1{2n},-\dfrac12\right)$, $\mathrm{C}_n\left(\dfrac1{4n},\dfrac14\right)$로 주어진다.
      source_flow: g25.pdf p.47 예시답안 문제 3(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        삼각형 $\mathrm{OAB}_n$의 넓이는 $\dfrac12\cdot\overline{\mathrm{OA}}\cdot\overline{\mathrm{B_nD_n}}=\dfrac12\cdot1\cdot\dfrac1{2n}=\dfrac1{4n}$이고, 삼각형 $\mathrm{OAC}_n$의 넓이는 $\dfrac12\cdot\overline{\mathrm{OA}}\cdot\overline{\mathrm{C_nE_n}}=\dfrac12\cdot1\cdot\dfrac1{4n}=\dfrac1{8n}$이다.
      source_flow: g25.pdf p.47 예시답안 문제 3(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: 두 삼각형의 넓이를 더하여 삼각형 $\mathrm{AB_nC_n}$의 넓이는 $S_n=\dfrac1{4n}+\dfrac1{8n}=\dfrac3{8n}$이다.
      source_flow: g25.pdf p.47 예시답안 문제 3(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        문제에서 제시한 급수의 값을 구하면 $\displaystyle\sum_{n=1}^{\infty}S_nS_{n+1}=\sum_{n=1}^{\infty}\dfrac3{8n}\cdot\dfrac3{8(n+1)}=\lim_{n\to\infty}\sum_{k=1}^{n}\dfrac3{8k}\cdot\dfrac3{8(k+1)}=\dfrac9{64}\lim_{n\to\infty}\sum_{k=1}^{n}\left(\dfrac1k-\dfrac1{k+1}\right)=\dfrac9{64}\lim_{n\to\infty}\left(1-\dfrac1{n+1}\right)=\dfrac9{64}$이다.
      source_flow: g25.pdf p.47 예시답안 문제 3(3)
      criteria:
      - 3.A1
