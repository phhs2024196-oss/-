intent: |
  주어진 조건을 바탕으로 삼각함수의 값을 계산할 수 있는지 평가한다. 삼각함수와 관련된 극한값을 구할 수 있는지 확인한다. 삼각형의 넓이를 계산할 수 있는지 확인하고 급수의 합을 적절히 계산할 수 있는지 평가한다.
