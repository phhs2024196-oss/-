      source_flow: g25.pdf p.47 예시답안 문제 4(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: 따라서 $\displaystyle\int_0^1xh^{\prime}(x)\,dx=1$로부터 $\displaystyle\int_0^1h(x)\,dx=-1$이다.
      source_flow: g25.pdf p.47 예시답안 문제 4(2)
      criteria:
      - 2.A1
  - id: S2-B2
    audience: B
    method_no: 2
    steps:
    - id: 2c-1
      content: |
        (다)에서 부분적분법을 이용하면 $1=\displaystyle\int_0^1xf^{\prime}(x)\,dx=\Big[xf(x)\Big]_0^1-\int_0^1f(x)\,dx$
      source_flow: g25.pdf p.45 채점 기준 문제 4(2) 풀이 방법 2
