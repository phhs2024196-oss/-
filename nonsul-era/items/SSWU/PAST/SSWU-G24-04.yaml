    - id: 2c-2
      content: |
        여기에서 $f(1)=2$이므로 $\displaystyle\int_0^1xf^{\prime}(x)\,dx=f(1)-\int_0^1f(x)\,dx=2-\int_0^1f(x)\,dx$
      source_flow: g25.pdf p.45 채점 기준 문제 4(2) 풀이 방법 2
      criteria:
