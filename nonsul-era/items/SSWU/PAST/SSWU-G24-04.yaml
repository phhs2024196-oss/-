      content: 주어진 조건 (가)로부터 $f(0)+f(0)=4$이므로 $f(0)=2$이다.
      source_flow: g25.pdf p.47 예시답안 문제 4(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        또 주어진 조건 (가)로부터 $f(1)+f(-1)=4$이고, 그리고 주어진 조건 (나)로부터 $f(1)=f(-1+2)=f(-1)$이므로 $f(1)=f(-1)=2$이다.
      source_flow: g25.pdf p.47 예시답안 문제 4(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        즉 $f(-1)=f(0)=f(-1)=2$ [판독확인: 예시답안 원문이 $f(-1)=f(0)=f(-1)=2$로 인쇄되어 있음 — 문맥상 마지막은 $f(1)$의 오기로 보이나 원문 그대로 둠]
      source_flow: g25.pdf p.47 예시답안 문제 4(1)
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        따라서 롤의 정리에 의하여 $f^{\prime}(x)=0$의 근이 열린구간 $(-1,0)$과 $(0,1)$에 각각 하나 이상 존재한다. 그러므로 $f^{\prime}(x)=0$의 서로 다른 실근이 열린구간 $(-1,1)$에 두 개 이상 존재한다.
      source_flow: g25.pdf p.47 예시답안 문제 4(1)
      criteria:
      - 1.A1
