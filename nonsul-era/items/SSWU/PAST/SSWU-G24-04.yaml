    key_idea: $h^{\prime}=f^{\prime}$이므로 (다)에 부분적분을 쓰고 $h(1)=0$을 대입한다.
    steps:
    - id: 2a
      content: $\int_0^1xh^{\prime}(x)dx=h(1)-\int_0^1h=-\int_0^1h=1$ $\Rightarrow$ $-1$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $h^{\prime}(x)=f^{\prime}(x)$이므로 주어진 조건 (다)에서 $\displaystyle\int_0^1xf^{\prime}(x)\,dx=\int_0^1xh^{\prime}(x)\,dx=1$이다.
      source_flow: g25.pdf p.47 예시답안 문제 4(2)
      criteria:
