  - $h(x)=f(x)-2$
  concepts:
  - 평균값 정리(롤의 정리, 12수학Ⅱ02-07)
  - 부분적분법(12미적03-02)
  - 치환적분법(12미적03-01)
  tools:
  - '롤의 정리: $f(a)=f(b)$이면 $f^{\prime}(c)=0$인 $c$가 $(a,b)$에 존재'
  - 부분적분 $\int_0^1xh^{\prime}=[xh]_0^1-\int_0^1h$
  - '주기 2: $\int_4^9h=\int_4^5+\int_5^7+\int_7^9$'
  - $h(x)=-h(-x)$이면 $\int_{-1}^1h=0$
  conditions:
  - $f$는 모든 실수에서 미분가능, $f^{\prime}$은 연속
  - $f(0)=2$, $f(\pm1)=2$
