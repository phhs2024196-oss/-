      content: $\displaystyle\int_0^1h(x)\,dx=\int_0^1\{f(x)-2\}dx=\int_0^1f(x)\,dx-2=-1$
      source_flow: g25.pdf p.45 채점 기준 문제 4(2) 풀이 방법 2
      criteria:
      - 2.A1
