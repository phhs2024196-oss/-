- id: '3'
  stem: (3) $\displaystyle\int_4^9f(x)\,dx$의 값을 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '9'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f=h+2$, $h$는 주기 2이고 원점대칭($h(x)=-h(-x)$)이므로 $\int_4^9h=\int_0^1h$이다.
    steps:
    - id: 3a
      content: $\int_4^9f=10+\int_4^9h=10+\int_0^1h=10-1=9$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(x)=h(x)+2$이므로 $\displaystyle\int_4^9f(x)\,dx=\int_4^9\{h(x)+2\}dx=10+\int_4^9h(x)\,dx$이다.
      source_flow: g25.pdf p.48 예시답안 문제 4(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        그리고 $\displaystyle\int_4^9h(x)\,dx=\int_4^5h(x)\,dx+\int_5^7h(x)\,dx+\int_7^9h(x)\,dx$에서 우변의 첫 번째 정적분을 $x-4=u$로 두는 치환적분법과 조건 (나)를 이용하여 계산하면 $\displaystyle\int_4^5h(x)\,dx=\int_0^1h(u+4)\,du=\int_0^1h(u+2)\,du=\int_0^1h(u)\,du=\int_0^1h(x)\,dx$이다. 마찬가지로 우변의 각 정적분을 구간 $[-1,1]$ 내의 정적분으로 다음과 같이 나타낼 수 있다. $\displaystyle\int_4^9h(x)\,dx=\int_0^1h(x)\,dx+\int_{-1}^1h(x)\,dx+\int_{-1}^1h(x)\,dx$
      source_flow: g25.pdf p.48 예시답안 문제 4(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        주어진 조건 (가)로부터 모든 실수 $x$에 대하여 $f(x)-2=-\{f(-x)-2\}$, 즉 $h(x)=-h(-x)$이므로, 함수 $h(x)$의 그래프는 원점에 대하여 대칭이다. 따라서 $\displaystyle\int_{-1}^1h(x)\,dx=0$이다.
      source_flow: g25.pdf p.48 예시답안 문제 4(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        그러므로 $\displaystyle\int_4^9h(x)\,dx=\int_0^1h(x)\,dx+0+0=-1$이다. 따라서 $\displaystyle\int_4^9f(x)\,dx=10-1=9$이다.
      source_flow: g25.pdf p.48 예시답안 문제 4(3)
      criteria:
      - 3.A1
