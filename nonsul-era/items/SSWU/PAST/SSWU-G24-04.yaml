stimuli: []
stem: |
  함수 $f(x)$가 모든 실수에서 미분가능하며, $f^{\prime}(x)$가 모든 실수에서 연속이고, $f(x)$가 다음 조건을 모두 만족시킨다.

  (가) 모든 실수 $x$에 대하여 $f(x)+f(-x)=4$

  (나) 모든 실수 $x$에 대하여 $f(x+2)=f(x)$

  (다) $\displaystyle\int_0^1xf^{\prime}(x)\,dx=1$

  다음 물음에 답하시오. [총 25점]
