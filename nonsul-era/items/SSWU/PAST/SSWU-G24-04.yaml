key_idea: |
  (가)(나)로 $f(-1)=f(0)=f(1)=2$이므로 롤의 정리를 두 구간에 쓴다. $h=f-2$는 주기 2인 기함수이고 $h(1)=0$이므로 $\int_0^1xh^{\prime}dx=-\int_0^1h=1$에서 $\int_0^1h=-1$, $\int_4^9h=\int_0^1h$이다.
