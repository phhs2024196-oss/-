intent: |
  함수 $f(x)$에 대한 조건으로부터 닫힌구간 $[-1,0]$과 $[0,1]$에서 롤의 정리를 적용할 수 있는지를 평가한다. 그리고 함수 $f(x)$의 그래프를 $y$축 방향으로 $-2$만큼 평행이동한 함수 $h(x)=f(x)-2$에 대하여 $h^{\prime}(x)=f^{\prime}(x)$임을 이용하여 $f(x)$에 대하여 주어진 정적분 값의 조건으로부터 $h(x)$의 정적분을 부분적분법으로 구할 수 있는지 살펴본다. 또, 문제의 주어진 조건으로부터 $h(x)$의 주기성과 대칭성을 파악하고, 이를 활용하여 주어진 구간에서 $h(x)$의 정적분을 구하여, 결과적으로 $f(x)$의 정적분을 구하는 과정을 논리적으로 설명할 수 있는지 평가하고자 한다.
