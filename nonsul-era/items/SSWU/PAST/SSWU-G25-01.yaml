stimuli: []
stem: |
  자연수 $n$에 대하여 점 $(n,\ 0)$을 지나는 직선 $\ell$이 곡선 $y=e^{-x}$ 위의 점 $\mathrm{P}$에서 이 곡선과 접한다고 할 때, 다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: |
    (1) 접선 $\ell$의 방정식과 접점 $\mathrm{P}$의 좌표를 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: l=-exp(1-n)*(x-n); Px=n-1; Py=exp(1-n)
    equivalents:
    - '$\ell: y=-e^{1-n}(x-n)$, $\mathrm{P}(n-1,e^{1-n})$'
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 접점을 $(c,e^{-c})$로 두면 접선이 $(n,0)$을 지나는 조건에서 $c=n-1$이다.
    steps:
    - id: 1a
      content: $y=-e^{1-n}(x-n)$, $\mathrm{P}(n-1,\,e^{1-n})$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g26.pdf p.80 예시답안 문제 1(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=e^{-x}$ 위의 점 $\mathrm{P}(c,\,e^{-c})$에서의 접선의 기울기를 $m$이라 하면 $(e^{-x})\,'=-e^{-x}$으로부터 $m=-e^{-c}$이고, 접선의 방정식은 $y=-e^{-c}(x-c)+e^{-c}$이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        이 직선이 점 $(n,0)$을 지나므로 $0=-e^{-c}(n-c)+e^{-c}=e^{-c}(c-n+1)$이고 $e^{-c}\ne0$이므로 $c=n-1$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        접선의 방정식은 $y=-e^{1-n}(x-n)$, 접점은 $\mathrm{P}(n-1,\,e^{1-n})$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        접점 $(c,e^{-c})$에서 기울기 $m=-e^{-c}$와 접선의 방정식 $y=-e^{-c}(x-c)+e^{-c}$을 세웠다. (또는 $y=m(x-n)$으로 놓고 접선 조건으로 $m$을 구함)
      depends_on: []
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $(n,0)$을 대입해 $c=n-1$을 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: |
        접선 $y=-e^{1-n}(x-n)$과 접점 $\mathrm{P}(n-1,e^{1-n})$을 모두 구했다.
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-3
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) 곡선 $y=e^{-x}$과 접선 $\ell$ 및 두 직선 $y=0,\ x=2n$으로 둘러싸인 도형 중 제1사분면에 놓인 부분의 넓이를 $a_n$이라 할 때, $\displaystyle\lim_{n\to\infty}e^na_n$의 값을 구하시오.
  points: 8
  depends_on:
  - '1'
  answer:
    kind: value
    value: e/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $a_n=\dfrac{e^{1-n}}{2}-e^{-2n}$이므로 $e^na_n=\dfrac e2-e^{-n}\to\dfrac e2$
    steps:
    - id: 2a
      content: $\dfrac e2$
      criteria:
      - 2.M1
      - 2.B1
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g26.pdf p.80 예시답안 문제 1(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $[n-1,n]$에서는 곡선이 접선 위에 있고 $x\ge n$에서는 접선이 $x$축 아래이므로 제1사분면의 넓이는 $a_n=\displaystyle\int_{n-1}^{n}\{e^{-x}-(-e^{1-n}x+ne^{1-n})\}dx+\int_n^{2n}e^{-x}dx$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\displaystyle\int_{n-1}^{n}\{e^{-x}-(-e^{1-n}x+ne^{1-n})\}dx=e^{1-n}-e^{-n}-\dfrac{e^{1-n}}{2}$이고 $\displaystyle\int_n^{2n}e^{-x}dx=e^{-n}-e^{-2n}$이다.
      criteria:
      - 2.B1
    - id: 2b-3
      content: |
        따라서 $a_n=\dfrac{e^{1-n}}{2}-e^{-2n}$이다.
      criteria:
      - 2.A1
    - id: 2b-4
      content: |
        그러므로 $e^na_n=\dfrac e2-e^{-n}$이고 $0<\dfrac1e<1$이므로 $\displaystyle\lim_{n\to\infty}e^na_n=\dfrac e2-\lim_{n\to\infty}e^{-n}=\dfrac e2$이다.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 3
      evidence: |
        $a_n$을 $\int_{n-1}^{n}\{e^{-x}-(-e^{1-n}x+ne^{1-n})\}dx+\int_n^{2n}e^{-x}dx$로 세웠다.
      depends_on: []
      steps:
      - 2b-1
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: |
        두 정적분의 값 $e^{1-n}-e^{-n}-\dfrac{e^{1-n}}2$, $e^{-n}-e^{-2n}$을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $a_n=\dfrac{e^{1-n}}2-e^{-2n}$과 $\lim e^na_n=\dfrac e2$를 구했다.
      depends_on:
      - 2.M1
      - 2.B1
      steps:
      - 2b-3
      - 2b-4
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (3) 점 $\mathrm{P}$를 지나고 접선 $\ell$에 수직인 직선과 점 $\mathrm{P}$를 지나고 $y$축에 평행한 직선 및 $x$축으로 둘러싸인 도형의 넓이를 $b_n$이라 할 때, $\displaystyle\sum_{n=1}^{\infty}b_n$의 값을 구하시오.
  points: 9
  depends_on:
  - '1'
  answer:
    kind: value
    value: exp(3)/(2*(exp(3)-1))
    equivalents:
    - $\dfrac{e^3}{2(e^3-1)}$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 법선의 $x$절편 $n-1-e^{2-2n}$, 높이 $e^{1-n}$ → $b_n=\dfrac12e^{3-3n}$, 공비 $e^{-3}$인 등비급수
    steps:
    - id: 3a
      content: $\dfrac{e^3}{2(e^3-1)}$
      criteria:
      - 3.M1
      - 3.B1
      - 3.B2
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g26.pdf p.80 예시답안 문제 1(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        점 $\mathrm{P}$를 지나고 접선 $\ell$에 수직인 직선의 방정식은 $y=e^{n-1}(x-n+1)+e^{1-n}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        이 직선의 $x$절편은 $n-1-e^{2-2n}$이다.
      criteria:
      - 3.B1
    - id: 3b-3
      content: |
        삼각형의 밑변의 길이는 $(n-1)-(n-1-e^{2-2n})=e^{2-2n}$, 높이는 $e^{1-n}$이므로 $b_n=\dfrac12\times e^{2-2n}\times e^{1-n}=\dfrac12e^{3-3n}$이다.
      criteria:
      - 3.B2
    - id: 3b-4
      content: |
        $b_n=\dfrac{e^3}{2}\left(\dfrac{1}{e^3}\right)^n$이고 $0<\dfrac1{e^3}<1$이므로
      criteria:
      - 3.B2
    - id: 3b-5
      content: |
        $\displaystyle\sum_{n=1}^{\infty}b_n=\sum_{n=1}^{\infty}\dfrac{e^3}{2}\left(\dfrac{1}{e^3}\right)^n=\dfrac{e^3}{2(e^3-1)}$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $\mathrm{P}$를 지나는 법선 $y=e^{n-1}(x-n+1)+e^{1-n}$를 구했다.
      depends_on: []
      steps:
      - 3b-1
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        법선의 $x$절편 $n-1-e^{2-2n}$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.B2
      mark_type: B
      points: 2
      evidence: |
        $b_n=\dfrac12e^{3-3n}$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-3
      - 3b-4
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        등비급수의 합 $\dfrac{e^3}{2(e^3-1)}$을 구했다.
      depends_on:
      - 3.M1
      - 3.B2
      steps:
      - 3b-5
    deductions: []
