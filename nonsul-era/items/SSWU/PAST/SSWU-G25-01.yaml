intent: |
  두 직선의 수직 조건, 지수함수의 접선의 방정식, 곡선으로 둘러싸인 도형의 넓이와 수열의 극한, 급수의 합 등 수학과 미적분 교과에서 기본이 되는 개념을 충실하게 학습하고 이를 활용할 수 있는 능력을 갖추고 있는지를 평가하기 위해 출제하였다.
key_idea: |
  접점 $(c,e^{-c})$에서의 접선이 $(n,0)$을 지나면 $c=n-1$이다. $a_n$은 접선과 곡선 사이 넓이와 $[n,2n]$ 구간의 넓이의 합이고, $b_n$은 접점·수선의 발·법선의 $x$절편이 이루는 직각삼각형의 넓이로 공비 $e^{-3}$인 등비수열이다.
stuck: (2)에서 접선이 곡선 아래에 있어 $x=n$ 앞뒤로 적분구간을 나누는 단계, (3)에서 법선의 $x$절편 $n-1-e^{2-2n}$을 구해 삼각형의 밑변으로 쓰는 단계
tags:
- 지수함수의 접선
- 정적분과 넓이
- 수열의 극한
- 등비급수
elements:
  materials:
  - 곡선 $y=e^{-x}$와 점 $(n,\,0)$을 지나는 접선 $\ell$, 접점 $\mathrm{P}$
  - $y=0$, $x=2n$으로 둘러싸인 제1사분면의 도형의 넓이 $a_n$
  - $\mathrm{P}$를 지나는 법선, $\mathrm{P}$를 지나는 $y$축에 평행한 직선, $x$축이 이루는 삼각형의 넓이 $b_n$
  concepts:
  - 지수함수의 미분과 접선의 방정식
  - 정적분과 곡선으로 둘러싸인 도형의 넓이
  - 수열의 극한의 성질
  - 등비급수의 합
  - 두 직선의 수직 조건
  tools:
  - 접선 $y=-e^{-c}(x-c)+e^{-c}$에 $(n,0)$을 대입해 $c=n-1$을 얻기
  - $a_n=\int_{n-1}^{n}\{e^{-x}-(-e^{1-n}x+ne^{1-n})\}dx+\int_n^{2n}e^{-x}dx$
  - 수직인 직선의 기울기 $-\dfrac{1}{m}=e^{n-1}$
  - $b_n=\dfrac{e^3}{2}\left(\dfrac1{e^3}\right)^n$인 등비급수
  conditions:
  - $n$은 자연수
  - 점 $(n,0)$은 곡선 위의 점이 아니다(접선이 $x$축과 만나는 점)
  - $0<\dfrac{1}{e}<1$, $0<\dfrac{1}{e^3}<1$이므로 극한·급수가 수렴
  subpart_links: (2), (3)은 (1)의 접선 $y=-e^{1-n}(x-n)$과 접점 $\mathrm{P}(n-1,e^{1-n})$을 사용
  stimuli_used: []
