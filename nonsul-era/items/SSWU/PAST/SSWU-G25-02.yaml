  - id: S2-B
    audience: B
    source_flow: g26.pdf p.81 예시답안 문제 2(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 직선 $y=2\sqrt3(x-1)$과 $y=\dfrac{\sqrt3}{7}x$의 교점 $\mathrm{P}(x,y)$의 좌표는 $2\sqrt3(x-1)=\dfrac{\sqrt3}{7}x$, $14(x-1)=x$로부터
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $x=\dfrac{14}{13}$이고 $y=\dfrac{2\sqrt3}{13}$이다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        따라서 $\overline{\mathrm{PQ}}=\sqrt{\left(\dfrac1{13}\right)^2+\left(\dfrac{2\sqrt3}{13}\right)^2}=\dfrac{\sqrt{13}}{13}$이다.
      criteria:
      - 2.B1
    - id: 2b-4
      content: |
        그리고 (1)에서 $\angle\mathrm{OPQ}=\dfrac\pi3$이므로 $\angle\mathrm{RPQ}=\dfrac\pi3$이고 코사인법칙에 의하여 $\overline{\mathrm{RQ}}^2=2^2+\overline{\mathrm{PQ}}^2-2\times2\times\overline{\mathrm{PQ}}\times\cos\dfrac\pi3=4+\dfrac1{13}-\dfrac{2\sqrt{13}}{13}=\dfrac{53-2\sqrt{13}}{13}$이다.
      criteria:
      - 2.M2
      - 2.A1
