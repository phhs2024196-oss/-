elements:
  materials:
  - 두 직선 $y=a(x-1)$, $y=mx$ ($0<m<a$)와 교점 $\mathrm{P}$, $\mathrm{O}(0,0)$, $\mathrm{Q}(1,0)$
  - $a=2\sqrt3,\ m=\dfrac{\sqrt3}{7}$인 경우의 삼각형 $\mathrm{OPQ}$와 제3사분면의 점 $\mathrm{R}$
  - $a=\tan k\theta,\ m=\tan\theta$일 때 선분 $\mathrm{OP}$의 길이 $f(\theta)$
  concepts:
  - 직선의 기울기와 탄젠트
  - 삼각함수의 덧셈정리
  - 코사인법칙
  - 사인법칙
  - 삼각함수의 극한
  tools:
  - $\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}$
  - $\overline{\mathrm{RQ}}^2=2^2+\overline{\mathrm{PQ}}^2-2\times2\times\overline{\mathrm{PQ}}\cos\dfrac\pi3$
  - $\dfrac{\overline{\mathrm{OP}}}{\sin(\pi-k\theta)}=\dfrac{1}{\sin(k-1)\theta}$
  - $\displaystyle\lim_{x\to0}\dfrac{\sin x}{x}=1$
  conditions:
  - $0<m<a$
  - $\mathrm{R}$는 제3사분면에서 직선 $y=mx$ 위의 점, $\overline{\mathrm{RP}}=2$
  - $k>1$, $0<\theta<\dfrac{\pi}{2k}$
  subpart_links: (2)는 (1)에서 구한 $\angle\mathrm{OPQ}=\dfrac\pi3$를 코사인법칙에 사용
