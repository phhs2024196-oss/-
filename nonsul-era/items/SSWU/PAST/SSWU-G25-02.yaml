stem: |
  그림과 같이 두 직선 $y=a(x-1)$과 $y=mx$의 교점을 $\mathrm{P}$라 하고, $\mathrm{O}(0,\ 0)$, $\mathrm{Q}(1,\ 0)$이라 하자. (단, $0<m<a$이다.)

  [그림 1: 좌표평면에서 원점 $\mathrm{O}(0,0)$을 지나는 완만한 우상향 직선 $y=mx$와 점 $\mathrm{Q}(1,0)$을 지나는 가파른 우상향 직선 $y=a(x-1)$이 제1사분면에서 만나는 점이 $\mathrm{P}$이다. $x$축 위에 $\mathrm{O}$와 $\mathrm{Q}$가 표시되어 있다.]

  다음 물음에 답하시오. [총 25점]
