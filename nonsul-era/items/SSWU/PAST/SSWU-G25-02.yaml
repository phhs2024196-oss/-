      steps:
      - 3b-4
    - id: 3.M3
      mark_type: M
      points: 2
      evidence: |
        $\dfrac{\sin k\theta}{k\theta}$, $\dfrac{\sin(k-1)\theta}{(k-1)\theta}$ 꼴로 바꾸어 극한을 처리했다.
      depends_on:
      - 3.B1
      steps:
      - 3b-5
    - id: 3.A1
      mark_type: A
      points: 1
      evidence: |
        $\dfrac{k}{k-1}$을 구했다.
      depends_on:
      - 3.M3
      steps:
      - 3b-5
