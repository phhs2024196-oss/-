intent: |
  직선의 기울기로 주어진 탄젠트 값과 삼각함수의 덧셈정리를 이용하여 각을 구할 수 있는지 살펴본다. 또, 삼각형에서 코사인법칙을 이용하여 삼각형의 변의 길이를 구할 수 있는지 그리고 사인법칙을 이용하여 변의 길이를 나타내고, 삼각함수의 극한을 구하는 과정을 논리적으로 설명할 수 있는지 평가하고자 한다.
key_idea: |
  직선이 $x$축의 양의 방향과 이루는 각의 탄젠트가 기울기이므로 $\angle\mathrm{OPQ}=\alpha-\beta$를 덧셈정리로 구하고, 코사인법칙·사인법칙으로 변의 길이를 구한다. 극한은 $\dfrac{\sin k\theta}{k\theta}\to1$을 이용한다.
stuck: (3)에서 $\angle\mathrm{OQP}=\pi-k\theta$, $\angle\mathrm{OPQ}=(k-1)\theta$를 읽어 사인법칙을 세우는 단계
