- id: '3'
  stem: |
    (3) $k>1$인 상수 $k$와 $0<\theta<\dfrac{\pi}{2k}$인 실수 $\theta$에 대하여 $a=\tan k\theta,\ m=\tan\theta$라 하자.
    선분 $\mathrm{OP}$의 길이를 $f(\theta)$라 할 때, $\displaystyle\lim_{\theta\to0+}f(\theta)$의 값을 $k$에 대한 식으로 나타내시오.
  points: 10
  depends_on:
  - '1'
  answer:
    kind: expression
    value: k/(k-1)
    equivalents:
    - $\dfrac{k}{k-1}$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\angle\mathrm{OPQ}=(k-1)\theta$, $\angle\mathrm{OQP}=\pi-k\theta$, 사인법칙으로 $f(\theta)=\dfrac{\sin k\theta}{\sin(k-1)\theta}\to\dfrac{k}{k-1}$
    steps:
    - id: 3a
      content: $\dfrac{k}{k-1}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.B1
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g26.pdf p.81 예시답안 문제 2(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        두 직선 $y=(\tan k\theta)(x-1)$과 $y=(\tan\theta)x$가 $x$축의 양의 방향과 이루는 각의 크기는 각각 $k\theta,\ \theta$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        따라서 $\angle\mathrm{OPQ}=k\theta-\theta=(k-1)\theta$, $\angle\mathrm{OQP}=\pi-k\theta$이므로
      criteria:
      - 3.M1
    - id: 3b-3
      content: |
        $\triangle\mathrm{OPQ}$에서 사인법칙에 의하여 $\dfrac{\overline{\mathrm{OP}}}{\sin(\pi-k\theta)}=\dfrac{f(\theta)}{\sin k\theta}=\dfrac{1}{\sin(k-1)\theta}$이다.
      criteria:
      - 3.M2
    - id: 3b-4
      content: |
        따라서 $f(\theta)=\dfrac{\sin k\theta}{\sin(k-1)\theta}$이므로
      criteria:
      - 3.B1
    - id: 3b-5
      content: |
        $\displaystyle\lim_{\theta\to0+}f(\theta)=\lim_{\theta\to0+}\dfrac{\sin k\theta}{\sin(k-1)\theta}=\lim_{\theta\to0+}\dfrac{k\times\frac{\sin k\theta}{k\theta}}{(k-1)\times\frac{\sin(k-1)\theta}{(k-1)\theta}}=\dfrac{k\times\lim\limits_{\theta\to0+}\frac{\sin k\theta}{k\theta}}{(k-1)\times\lim\limits_{\theta\to0+}\frac{\sin(k-1)\theta}{(k-1)\theta}}=\dfrac{k}{k-1}$이다.
      criteria:
      - 3.M3
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        두 직선이 이루는 각 $k\theta,\theta$로부터 $\angle\mathrm{OPQ}=(k-1)\theta$, $\angle\mathrm{OQP}=\pi-k\theta$를 구했다.
      depends_on: []
      steps:
      - 3b-1
      - 3b-2
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        $\triangle\mathrm{OPQ}$에서 사인법칙의 식 $\dfrac{\overline{\mathrm{OP}}}{\sin(\pi-k\theta)}=\dfrac{1}{\sin(k-1)\theta}$을 세웠다.
      depends_on:
      - 3.M1
      steps:
      - 3b-3
    - id: 3.B1
      mark_type: B
      points: 1
      evidence: |
        $f(\theta)=\dfrac{\sin k\theta}{\sin(k-1)\theta}$를 구했다.
      depends_on:
