      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g26.pdf p.81 예시답안 문제 2(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 직선 $y=2\sqrt3(x-1)$과 $y=\dfrac{\sqrt3}{7}x$가 $x$축의 양의 방향과 이루는 각의 크기를 각각 $\alpha,\ \beta$라 하면 $\angle\mathrm{OPQ}=\alpha-\beta$이고,
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\tan\alpha=2\sqrt3,\ \tan\beta=\dfrac{\sqrt3}{7}$이므로
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        삼각함수의 덧셈정리에 의하여 $\tan(\alpha-\beta)=\dfrac{\tan\alpha-\tan\beta}{1+\tan\alpha\tan\beta}=\dfrac{2\sqrt3-\frac{\sqrt3}{7}}{1+2\sqrt3\times\frac{\sqrt3}{7}}=\sqrt3$이다.
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        따라서 $\alpha-\beta=\angle\mathrm{OPQ}=\dfrac\pi3$이므로 $\cos(\angle\mathrm{OPQ})=\dfrac12$이다.
      criteria:
      - 1.A1
