    - id: 3.M2
      mark_type: M
      points: 2
      evidence: |
        $t<0$일 때 좌미분계수가 $f\,'(c)$임을 보였다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.M3
      mark_type: M
      points: 2
      evidence: |
        $t>0$일 때 우미분계수가 $-f\,'(c)$임을 보였다.
      depends_on:
      - 3.M1
      steps:
      - 3b-3
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $f\,'(c)=0$에서 $c=0,\ \dfrac{28}{3}$을 구했다.
      depends_on:
      - 3.M2
      - 3.M3
      steps:
      - 3b-4
    deductions: []
