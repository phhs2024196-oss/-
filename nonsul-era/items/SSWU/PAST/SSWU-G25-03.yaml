intent: |
  정적분을 활용하여 도형의 넓이를 구하는 과정을 이해하고 이를 이용하여 다항함수들이 포함된 문제를 해결할 수 있는지 살펴본다. 또한, 도함수를 활용하여 두 함수가 공통접선을 가지는 조건을 해석할 수 있는지 확인한다. 미분계수의 정의를 정확하게 이용하여 함수의 미분가능성을 확인할 수 있는지 평가하고자 한다.
key_idea: |
  $f-g=x\{x^2-(2a-1)x+3a\}$로 교점의 위치를 파악해 $[-2,0]$에서 $g\ge f$임을 보이고 적분하여 $a=5$를 얻는다. 공통접선은 함숫값과 접선의 기울기가 같을 조건이며, $h$의 미분가능성은 $x=c$에서 좌·우 미분계수가 $f\,'(c)$와 $-f\,'(c)$로 같을 조건($f\,'(c)=0$)으로 바뀐다.
stuck: (3)에서 $t>0$일 때 $h(c+t)=f(c-t)$로 바꾸어 우미분계수가 $-f\,'(c)$임을 이끌어 내는 단계
