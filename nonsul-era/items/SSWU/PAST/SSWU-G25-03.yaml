- id: '3'
  stem: |
    (3) 실수 $c$와 함수 $f(x)$에 대하여 함수 $h(x)$를

    $$h(x)=\begin{cases}f(x)&(x<c)\\f(2c-x)&(x\ge c)\end{cases}$$

    라 하자. 미분계수의 정의를 이용하여 함수 $h(x)$가 실수 전체의 집합에서 미분가능하도록 하는 $c$의 값을 모두 구하시오.
  points: 9
  depends_on:
  - '1'
  answer:
    kind: set
    value: 0, 28/3
    equivalents:
    - $c=0$ 또는 $c=\dfrac{28}{3}$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $h$는 연속이므로 $x=c$에서 좌·우미분계수가 $f\,'(c)$, $-f\,'(c)$로 같을 조건 $f\,'(c)=0$
    steps:
    - id: 3a
      content: $c=0,\ \dfrac{28}{3}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g26.pdf p.82 예시답안 문제 3(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        주어진 함수 $h(x)$는 실수 전체의 집합에서 연속이다. 그리고 함수 $f(x)$가 실수 전체의 집합에서 미분가능하므로, 함수 $h(x)$가 실수 전체의 집합에서 미분가능하도록 하려면 $h(x)$가 $x=c$에서 미분가능하면 된다. $\displaystyle\lim_{t\to0-}\dfrac{h(c+t)-h(c)}{t}=\lim_{t\to0+}\dfrac{h(c+t)-h(c)}{t}\cdots$ (가)가 성립하도록 하는 실수 $c$를 찾으면 된다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        실수 $t$가 음수인 경우, $c+t<c$이므로 $\dfrac{h(c+t)-h(c)}{t}=\dfrac{f(c+t)-f(c)}{t}$가 되어, (가)의 좌변은 $f'(c)$가 된다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        실수 $t$가 양수인 경우, $c+t>c$이므로 $\dfrac{h(c+t)-h(c)}{t}=\dfrac{f(c-t)-f(c)}{t}=(-1)\times\dfrac{f(c-t)-f(c)}{-t}$가 되어, (가)의 우변은 $-f'(c)$가 된다.
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        따라서 (가)가 성립하기 위해서는 $f'(c)=-f'(c)$가 성립해야 하고, $f'(c)=0$이 되는 실수 $c$를 찾는다. $f'(x)=3x^2-28x$이므로, $f'(c)=0$인 실수 $c$는 $c=0,\ \dfrac{28}{3}$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        $h$가 $x=c$에서 미분가능할 조건을 좌·우미분계수의 일치 (가)로 바꾸었다.
      depends_on: []
      steps:
