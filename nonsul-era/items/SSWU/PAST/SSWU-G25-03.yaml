      points: 2
      evidence: |
        공통접선의 조건(함숫값 일치, 미분계수 일치)을 세웠다.
      depends_on: []
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        $f'(x)=g'(x)$에서 $x=1,5$를 구하고 $b=7$ (또는 $b=-25$ 중 양수)을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.B1
      mark_type: B
      points: 1
      evidence: |
        $f(x)-\{g(x)+7\}=(x-1)^2(x-7)$로 교점 $x=1,7$을 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-3
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        넓이 $108$을 구했다.
      depends_on:
