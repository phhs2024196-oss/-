- id: '2'
  stem: |
    (2) 양수 $b$에 대하여 곡선 $y=g(x)+b$와 곡선 $y=f(x)$가 어떤 한 점에서 공통접선을 가질 때 상수 $b$의 값을 구하고, 두 곡선 $y=f(x)$와 $y=g(x)+b$로 둘러싸인 도형의 넓이를 구하시오.
  points: 8
  depends_on:
  - '1'
  answer:
    kind: value
    value: b=7; area=108
    equivalents:
    - $b=7$, 넓이 $108$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f\,'=g\,'$에서 $x=1,5$, $b=7$($x=1$), 두 곡선은 $x=1$에서 접하고 $x=7$에서 만나므로 넓이 $\int_1^7(-x^3+9x^2-15x+7)dx=108$
    steps:
    - id: 2a
      content: $b=7$, 넓이 $108$
      criteria:
      - 2.M1
      - 2.M2
      - 2.B1
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g26.pdf p.82 예시답안 문제 3(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        두 곡선 $y=f(x)$와 $y=g(x)+b$가 어떤 한 점에서 공통접선을 가지려면 그 점에서 함숫값이 같고 접선의 기울기가 같아야 한다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $f'(x)=g'(x)$인 $x$값을 찾는다. $3x^2-28x=-10x-15$로부터 $x=1$ 또는 $x=5$이다. $x=1$일 때 $f(1)=g(1)+b$가 되어야 하므로 $1-14=-5-15+b$로부터 $b=7$이다. $x=5$일 때 $f(5)=g(5)+b$가 되어야 하므로 $125-350=-200+b$로부터 $b=-25$이다. 이 중 양수는 $b=7$이다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        두 곡선 $y=f(x)$와 $y=g(x)+7$이 $x=1$에서 공통접선을 가지므로 $f(x)-\{g(x)+7\}=x^3-14x^2-(-5x^2-15x+7)=x^3-9x^2+15x-7=(x-1)^2(x-7)$이다. 따라서 두 곡선 $y=f(x),\ y=g(x)+7$의 교점의 $x$좌표는 $x=1$ 또는 $x=7$이다.
      criteria:
      - 2.B1
    - id: 2b-4
      content: |
        구간 $[1,7]$에서 $g(x)+7\ge f(x)$이므로 이 두 곡선으로 둘러싸인 도형의 넓이는 $\displaystyle\int_1^7(-x^3+9x^2-15x+7)dx=\left[-\dfrac14x^4+3x^3-\dfrac{15}{2}x^2+7x\right]_1^7=108$이다.
      criteria:
      - 2.A1
