stimuli: []
stem: |
  $a>4$인 실수 $a$에 대하여 두 함수 $f(x),\ g(x)$는 $f(x)=x^2(x-3a+1),\ g(x)=-ax(x+3)$이다. 다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: |
    (1) 두 곡선 $y=f(x)$와 $y=g(x)$ 및 직선 $x=-2$로 둘러싸인 도형의 넓이가 $58$일 때, 상수 $a$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $[-2,0]$에서 $g\ge f$이므로 $\int_{-2}^{0}\{g(x)-f(x)\}dx=4+\dfrac83(2a-1)+6a=58$
    steps:
    - id: 1a
      content: $a=5$
      criteria:
      - 1.M1
      - 1.M2
      - 1.B1
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g26.pdf p.82 예시답안 문제 3(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        두 곡선 $y=f(x),\ y=g(x)$의 교점의 $x$좌표는 $f(x)-g(x)=x\{x^2-(2a-1)x+3a\}=0$의 근이다. 이때 $4$보다 큰 양의 실수 $a$에 대하여 $x^2-(2a-1)x+3a=0$에서 두 근의 합이 $2a-1>0$이고, 두 근의 곱이 $3a>0$이므로 두 근은 모두 양수이다. 따라서 두 곡선의 교점의 $x$좌표 중 $x=0$을 제외한 두 값은 $0$보다 크다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        구간 $[-2,0]$에서 $f(x)\le g(x)$이므로 직선 $x=-2$와 두 곡선으로 둘러싸인 도형의 넓이는 $\displaystyle\int_{-2}^{0}\{g(x)-f(x)\}dx=58$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $\displaystyle\int_{-2}^{0}\{-ax^2-3ax-x^3+(3a-1)x^2\}dx=\int_{-2}^{0}\{-x^3+(2a-1)x^2-3ax\}dx=\left[-\dfrac14x^4+\dfrac13(2a-1)x^3-\dfrac32ax^2\right]_{-2}^{0}=4+\dfrac83(2a-1)+6a=58$이므로
      criteria:
      - 1.B1
    - id: 1b-4
      content: |
        $a=5$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        교점의 $x$좌표가 $f-g=x\{x^2-(2a-1)x+3a\}=0$의 근이고 $x=0$ 외의 두 근이 양수임을 보여 $[-2,0]$의 위치 관계를 판단했다.
      depends_on: []
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        $[-2,0]$에서 $f\le g$임을 이용해 $\int_{-2}^{0}\{g(x)-f(x)\}dx=58$을 세웠다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
    - id: 1.B1
      mark_type: B
      points: 3
      evidence: |
        정적분을 계산해 $4+\dfrac83(2a-1)+6a$를 구했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        $a=5$를 구했다.
      depends_on:
      - 1.M2
      - 1.B1
      steps:
      - 1b-4
    deductions: []
