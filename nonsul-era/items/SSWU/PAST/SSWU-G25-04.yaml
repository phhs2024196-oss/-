  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $y=\dfrac1{x-1}$과 대칭곡선 $y=\dfrac1x+1$의 교점 $\left(\dfrac{1+\sqrt5}2,\dfrac{1+\sqrt5}2\right)$를 경계로 $A_1+A_2$를 적분
    steps:
    - id: 2a
      content: $\dfrac{-2+\sqrt5}{2}+2\ln\dfrac{1+\sqrt5}{2}$
      criteria:
      - 2.M1
      - 2.B1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g26.pdf p.83 예시답안 문제 4(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $n=1$일 때 $f(x)=\dfrac1{x-1}$이다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        곡선 $y=\dfrac{1}{x-1}$을 직선 $y=x$에 대하여 대칭이동한 곡선은 $y=\dfrac1x+1$이다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        이 두 곡선의 교점은 직선 $y=x$ 위에 있으므로 $\dfrac{1}{x-1}=x$로부터 $\left(\dfrac{1+\sqrt5}{2},\ \dfrac{1+\sqrt5}{2}\right)$, $\left(\dfrac{1-\sqrt5}{2},\ \dfrac{1-\sqrt5}{2}\right)$이고 제1사분면 위의 점은 $\left(\dfrac{1+\sqrt5}{2},\ \dfrac{1+\sqrt5}{2}\right)$이다.
      criteria:
      - 2.B1
    - id: 2b-4
      content: |
        도형의 넓이는 $A_1+A_2$이고 $A_1=\displaystyle\int_1^{\frac{1+\sqrt5}{2}}\left\{1+\dfrac1x-(x-1)\right\}dx=\left[\ln|x|+2x-\dfrac{x^2}{2}\right]_1^{\frac{1+\sqrt5}{2}}=\dfrac{-5+3\sqrt5}{4}+\ln\left(\dfrac{1+\sqrt5}{2}\right)$, $A_2=\displaystyle\int_{\frac{1+\sqrt5}{2}}^{2}\left\{\dfrac1{x-1}-(x-1)\right\}dx=\left[\ln|x-1|-\dfrac{x^2}{2}+x\right]_{\frac{1+\sqrt5}{2}}^{2}=\dfrac{1-\sqrt5}{4}+\ln\left(\dfrac{1+\sqrt5}{2}\right)$이므로 도형의 넓이는 $A_1+A_2=\dfrac{-2+\sqrt5}{2}+2\ln\left(\dfrac{1+\sqrt5}{2}\right)$이다. (별해: $\displaystyle\int_1^{\frac{1+\sqrt5}{2}}\left(\dfrac1x+1\right)dx+\int_{\frac{1+\sqrt5}{2}}^{2}\dfrac1{x-1}dx-\dfrac12$을 계산하여도 된다.)
      criteria:
      - 2.M2
      - 2.A1
