stem: |
  함수 $f(x)=\dfrac{ax+b}{cx+d}$ (단, $ad-bc\ne0,\ c\ne0$)가 자연수 $n$에 대하여 다음 조건을 만족한다.

  (가) 함수 $y=f(x)$의 그래프의 점근선은 두 직선 $x=n,\ y=0$이다.

  (나) 점 $\mathrm{N}(n,\ 0)$과 함수 $y=f(x)$의 그래프 위의 점 $\mathrm{P}(2n,\ f(2n))$에 대하여 선분 $\mathrm{PN}$을 $2:1$로 외분하는 점을 $\mathrm{Q}$라 하자. 이때 직선 $\mathrm{PQ}$와 점 $\mathrm{P}$를 지나고 $y$축에 평행한 직선 및 점 $\mathrm{Q}$를 지나고 $x$축에 평행한 직선으로 둘러싸인 도형의 넓이는 $\dfrac{2}{n^2}$이다. (단, $f(2n)>0$이다.)

  다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: |
    (1) $f(x)$를 구하시오.
  points: 8
