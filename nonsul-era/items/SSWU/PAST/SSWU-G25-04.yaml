intent: |
  유리함수의 성질을 이해하고 이를 이용하여 주어진 조건을 만족하는 유리함수를 구할 수 있는지 살펴보고자 한다. 또한 도형의 이동과 정적분을 활용하여 곡선으로 둘러싸인 영역의 넓이를 구할 수 있는지 확인한다. 그리고 부등식을 이용하여 요구하는 조건을 만족하는 자연수의 범위를 구할 수 있는지 평가한다.
key_idea: |
  점근선 $x=n,\ y=0$으로 $f(x)=\dfrac{k}{x-n}$ 꼴임을 알고 외분점·삼각형의 넓이로 $k=\dfrac1{n^2}$을 구한다. $n=1$일 때 $y=\dfrac1{x-1}$과 그 대칭곡선 $y=\dfrac1x+1$ 사이의 넓이는 교점 $\left(\dfrac{1+\sqrt5}{2},\dfrac{1+\sqrt5}{2}\right)$에서 둘로 나누어 적분한다. (3)은 $x>n+1$에서 $\dfrac{1}{x-n-1}\ge\dfrac{(n+1)^2}{n^2(x-n)}$을 풀어 $x\le\dfrac{3n^2+3n+1}{2n+1}$를 얻는다.
stuck: (2)에서 두 곡선의 교점을 경계로 적분구간을 나누고 선분 $\mathrm{AB}$($y=x-1$)를 아래 경계로 잡는 단계, (3)에서 구간 $[n+2,n+3]$ 전체가 부등식의 해에 들어갈 조건 $n+3\le\dfrac{3n^2+3n+1}{2n+1}$로 바꾸는 단계
tags:
