  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 점근선으로 $f(x)=\dfrac{k}{x-n}$, $\mathrm{P}\left(2n,\dfrac kn\right)$, $\mathrm{Q}\left(0,-\dfrac kn\right)$, 넓이 $2k=\dfrac{2}{n^2}$
    steps:
    - id: 1a
      content: $f(x)=\dfrac{1}{n^2(x-n)}$
      criteria:
      - 1.M1
      - 1.B1
      - 1.B2
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g26.pdf p.83 예시답안 문제 4(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        구하는 유리함수는 $y=\dfrac{k}{x-p}+q$ (단, $k\ne0$인 상수) 형태로 표현되고 조건 (가)에 의하여 $p=n,\ q=0$이다.
      criteria:
      - 1.M1
      - 1.B1
    - id: 1b-2
      content: |
        조건 (나)로부터 $\mathrm{P}\left(2n,\ \dfrac kn\right)$, $\mathrm{Q}\left(0,\ -\dfrac kn\right)$이고
      criteria:
      - 1.B2
    - id: 1b-3
      content: |
        $k>0$이므로 주어진 도형의 넓이는 $\dfrac12\times(2n)\times\dfrac{2k}{n}\left(=2k\right)=\dfrac{2}{n^2}$이고 $k=\dfrac1{n^2}$이다.
      criteria:
      - 1.B2
    - id: 1b-4
      content: |
        따라서 $f(x)=\dfrac{\frac1{n^2}}{x-n}=\dfrac{1}{n^2(x-n)}$이다.
      criteria:
      - 1.A1
