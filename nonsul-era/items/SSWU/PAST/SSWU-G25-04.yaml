- id: '3'
  stem: |
    (3) $n+2\le x\le n+3$인 모든 실수 $x$에 대하여 $(n+1)^2f(x)\le n^2f(x-1)$이 성립하는 자연수 $n$의 최솟값을 구하시오.
  points: 9
  depends_on:
  - '1'
  answer:
    kind: value
    value: '5'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $x>n+1$에서 부등식을 풀면 $x\le\dfrac{3n^2+3n+1}{2n+1}$이므로 $n+3\le\dfrac{3n^2+3n+1}{2n+1}$, 즉 $n^2-4n-2\ge0$
    steps:
    - id: 3a
      content: $5$
      criteria:
      - 3.M1
      - 3.B1
      - 3.M2
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g26.pdf p.83 예시답안 문제 4(3) (p.84)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f(x)=\dfrac{1}{n^2(x-n)}$, $\dfrac{n^2}{(n+1)^2}f(x-1)=\dfrac{1}{(n+1)^2\{x-(n+1)\}}$이므로 $x>n+1$이면 $f(x)>0,\ f(x-1)>0$이다. $x>n+1$일 때 $n^2f(x-1)\ge(n+1)^2f(x)$가 성립하는 $x$의 범위를 구하면 $\dfrac{1}{(n+1)^2x-(n+1)^3}\ge\dfrac{1}{n^2x-n^3}$이므로 $n^2x-n^3\ge(n+1)^2x-(n+1)^3$이고 이를 정리하면 $(2n+1)x\le3n^2+3n+1$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $n$이 자연수이므로 $2n+1>0$이고 양변을 $2n+1$로 나누면 $x\le\dfrac{3n^2+3n+1}{2n+1}$이다.
      criteria:
      - 3.B1
    - id: 3b-3
      content: |
        $n+2\le x\le n+3$인 모든 실수 $x$에 대하여 $n^2f(x-1)\ge(n+1)^2f(x)$가 성립하려면 $n+3\le\dfrac{3n^2+3n+1}{2n+1}$이어야 하고, 이를 정리하면 $n^2-4n-2\ge0$이다.
      criteria:
      - 3.M2
    - id: 3b-4
      content: |
        따라서 $n\le2-\sqrt6$ 또는 $n\ge2+\sqrt6$이므로 이를 만족하는 자연수 $n$의 최솟값은 $5$이다.
      criteria:
      - 3.A1
