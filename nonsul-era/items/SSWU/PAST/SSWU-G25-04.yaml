      depends_on: []
      steps:
      - 3b-1
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        $x\le\dfrac{3n^2+3n+1}{2n+1}$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        구간 $[n+2,n+3]$이 해에 포함될 조건 $n+3\le\dfrac{3n^2+3n+1}{2n+1}$, 즉 $n^2-4n-2\ge0$을 얻었다.
      depends_on:
