stimuli: []
stem: |
  그림과 같이 두 곡선 $y=e^{\frac{x}{2}}+e^{-\frac{x}{2}}$, $y=-e^{\frac{x}{2}}-e^{-\frac{x}{2}}+a$와 $x$축, $y$축, 직선 $x=3$으로 둘러싸인 도형을 $S$라 하자. 다음 물음에 답하시오. (단, $a>4$이고, $e$는 자연상수이다.) [총 25점]

  [그림 1: 좌표평면에서 아래쪽 곡선 $y=e^{\frac{x}{2}}+e^{-\frac{x}{2}}$는 $y$절편 2에서 시작해 증가하고, 위쪽 곡선 $y=-e^{\frac{x}{2}}-e^{-\frac{x}{2}}+a$는 $y$축 위에서 시작해 감소하며, 두 곡선은 제1사분면 위의 점 P에서 만난다. 도형 $S$는 $x$축, $y$축, 직선 $x=3$과 P 왼쪽에서는 아래쪽 곡선, P 오른쪽에서는 위쪽 곡선으로 둘러싸인 음영 부분이다.]
subparts:
- id: '1'
  stem: (1) 두 곡선 $y=e^{\frac{x}{2}}+e^{-\frac{x}{2}}$와 $y=-e^{\frac{x}{2}}-e^{-\frac{x}{2}}+a$의 교점 중 제1사분면 위의 점 P에서의 두 곡선의 접선의 기울기의 곱이 $-\dfrac14\left(e-\dfrac1e\right)^2$이 되도록 하는 상수 $a$의 값을 구하시오.
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: 2*(E+1/E)
    equivalents:
    - $a=2\left(e+\frac1e\right)$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 교점의 $x$좌표를 $x_0$이라 하면 두 접선의 기울기는 서로 부호만 다르므로 곱은 $-\frac14\left(e^{\frac{x_0}{2}}-e^{-\frac{x_0}{2}}\right)^2$.
    steps:
    - id: 1a
      content: $x_0=2$, $a=2\left(e+\frac1e\right)$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 교점 P의 $x$좌표를 $x_0$이라 하자. 이때 $e^{\frac{x_0}{2}}+e^{-\frac{x_0}{2}}=-e^{\frac{x_0}{2}}-e^{-\frac{x_0}{2}}+a$이다.
      source_flow: g27.pdf p.80 예시답안 문제 1(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: 두 곡선의 $x=x_0$에서의 접선의 기울기는 각각 $\frac12e^{\frac{x_0}{2}}-\frac12e^{-\frac{x_0}{2}}$, $-\frac12e^{\frac{x_0}{2}}+\frac12e^{-\frac{x_0}{2}}$이므로, 두 접선의 기울기의 곱은 $-\dfrac{\left(e^{\frac{x_0}{2}}-e^{-\frac{x_0}{2}}\right)^2}{4}$이다. 따라서 $-\dfrac{\left(e^{\frac{x_0}{2}}-e^{-\frac{x_0}{2}}\right)^2}{4}=-\dfrac{\left(e-\frac1e\right)^2}{4}$이다.
      source_flow: g27.pdf p.80 예시답안 문제 1(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: 양변에 $-4$를 곱하고 양변의 제곱근을 구하면 $e^{\frac{x_0}{2}}-e^{-\frac{x_0}{2}}=\pm\left(e-\frac1e\right)$이고 $x_0>0$이므로 $e^{\frac{x_0}{2}}-e^{-\frac{x_0}{2}}>0$이 되어, $e^{\frac{x_0}{2}}-e^{-\frac{x_0}{2}}=e-\frac1e$이다.
      source_flow: g27.pdf p.80 예시답안 문제 1(1)
      criteria:
      - 1.M3
    - id: 1b-4
      content: 따라서 $x_0=2$이고 $a=2\left(e+\frac1e\right)$이다.
      source_flow: g27.pdf p.80 예시답안 문제 1(1)
      criteria:
      - 1.A1
