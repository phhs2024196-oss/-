  stem: (2) 소문항 (1)에서 구한 $a$의 값을 이용하여, 도형 $S$의 넓이를 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: 6*E - 2/E - 2*(E**(3/2) - E**(-3/2))
    equivalents:
    - $6e-\frac2e-2\left(e^{\frac32}-e^{-\frac32}\right)$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $x=2$를 기준으로 $S_1$, $S_2$로 나누어 정적분한다.
    steps:
    - id: 2a
      content: $S=4\left(e-\frac1e\right)-2\left(e^{\frac32}-e^{-\frac32}\right)+a=6e-\frac2e-2\left(e^{\frac32}-e^{-\frac32}\right)$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 그림에서와 같이 도형 $S$를 점 P를 기준으로 두 부분으로 나누어 계산하자. 도형 $S_1$의 넓이는 $y=e^{\frac x2}+e^{-\frac x2}$를 $x=0$에서 $x=2$까지 적분하고, 도형 $S_2$의 넓이는 $y=-e^{\frac x2}-e^{-\frac x2}+a$를 $x=2$에서 $x=3$까지 적분하여 구한다.
      source_flow: g27.pdf p.80 예시답안 문제 1(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: 이때 $S_1$의 넓이는 $\displaystyle\int_0^2\left(e^{\frac x2}+e^{-\frac x2}\right)dx=\left[2e^{\frac x2}-2e^{-\frac x2}\right]_0^2=2\left(e-\frac1e\right)$이고,
      source_flow: g27.pdf p.80 예시답안 문제 1(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: $S_2$의 넓이는 $\displaystyle\int_2^3\left(-e^{\frac x2}-e^{-\frac x2}+a\right)dx=\left[-2e^{\frac x2}+2e^{-\frac x2}+ax\right]_2^3=-2\left(e^{\frac32}-e^{-\frac32}\right)+2\left(e-\frac1e\right)+a$이다.
      source_flow: g27.pdf p.80 예시답안 문제 1(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: 따라서 $a=2\left(e+\frac1e\right)$이므로 $S$의 넓이는 $\displaystyle\int_0^2\left(e^{\frac x2}+e^{-\frac x2}\right)dx+\int_2^3\left(-e^{\frac x2}-e^{-\frac x2}+a\right)dx=4\left(e-\frac1e\right)-2\left(e^{\frac32}-e^{-\frac32}\right)+a=6e-\dfrac2e-2\left(e^{\frac32}-e^{-\frac32}\right)$이다.
      source_flow: g27.pdf p.80 예시답안 문제 1(2)
      criteria:
      - 2.A1
