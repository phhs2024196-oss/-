    equivalents:
    - $5+2\left(e+\frac1e\right)-2e^{-\frac32}$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 직선 부분 $\overline{\mathrm{BC}}+\overline{\mathrm{AO}}+\overline{\mathrm{OB}}$와 곡선 부분의 길이를 더한다. 곡선 길이의 피적분함수는 완전제곱이 되어 $\frac12\left(e^{\frac x2}+e^{-\frac x2}\right)$.
    steps:
    - id: 3a
      content: $5-e^{\frac32}-e^{-\frac32}+a+\left[e^{\frac x2}-e^{-\frac x2}\right]_0^3=5+2\left(e+\frac1e\right)-2e^{-\frac32}$
      criteria:
      - 3.B1
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: 그림에서와 같이 둘레의 길이 중 직선부분은 $\overline{\mathrm{BC}}=-e^{\frac32}-e^{-\frac32}+a$, $\overline{\mathrm{AO}}=2$, $\overline{\mathrm{OB}}=3$으로 이루어져 있다.
      source_flow: g27.pdf p.81 예시답안 문제 1(3)
      criteria:
      - 3.B1
    - id: 3b-2
      content: 둘레의 길이 중 곡선부분은 (a) $y=e^{\frac x2}+e^{-\frac x2}$의 $x=0$에서 $x=2$까지의 길이와 (b) $y=-e^{\frac x2}-e^{-\frac x2}+a$의 $x=2$에서 $x=3$까지의 길이로 이루어져 있다.
      source_flow: g27.pdf p.81 예시답안 문제 1(3)
      criteria:
      - 3.M1
    - id: 3b-3
      content: 곡선부분 중 (a) 부분의 길이는 $\displaystyle\int_0^2\sqrt{\left(\frac12e^{\frac x2}-\frac12e^{-\frac x2}\right)^2+1}\,dx=\int_0^2\sqrt{\left(\frac12e^{\frac x2}+\frac12e^{-\frac x2}\right)^2}\,dx=\int_0^2\left(\frac12e^{\frac x2}+\frac12e^{-\frac x2}\right)dx$이다.
      source_flow: g27.pdf p.81 예시답안 문제 1(3)
      criteria:
      - 3.M2
    - id: 3b-4
      content: 곡선부분 중 (b) 부분의 길이는 $\displaystyle\int_2^3\sqrt{\left(\frac12e^{\frac x2}-\frac12e^{-\frac x2}\right)^2+1}\,dx=\int_2^3\left(\frac12e^{\frac x2}+\frac12e^{-\frac x2}\right)dx$이다.
      source_flow: g27.pdf p.81 예시답안 문제 1(3)
      criteria:
      - 3.M3
    - id: 3b-5
      content: 직선부분과 곡선부분의 길이를 더하여 도형 $S$의 둘레의 길이를 구하면, $a=2\left(e+\frac1e\right)$이므로 $5-e^{\frac32}-e^{-\frac32}+a+\displaystyle\int_0^3\left(\frac12e^{\frac x2}+\frac12e^{-\frac x2}\right)dx=5-e^{\frac32}-e^{-\frac32}+2\left(e+\frac1e\right)+\left[e^{\frac x2}-e^{-\frac x2}\right]_0^3=5+2\left(e+\frac1e\right)-2e^{-\frac32}$이다.
      source_flow: g27.pdf p.81 예시답안 문제 1(3)
      criteria:
      - 3.A1
