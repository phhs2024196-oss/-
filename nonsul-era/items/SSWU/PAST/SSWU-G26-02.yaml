  stem: (2) 소문항 (1)에서 구한 교점 중 하나를 P라 하고 점 P의 $x$좌표를 $t$라 할 때, 원 $C$의 반지름의 길이를 $t$와 $f(t)$에 관한 식으로 나타낸 함수 $r(t)$를 구하시오.
  points: 7
