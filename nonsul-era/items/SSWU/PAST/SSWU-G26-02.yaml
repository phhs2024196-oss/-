stimuli: []
stem: |
  중심이 $\mathrm{O}(0,r)$이고 반지름의 길이가 $r$인 원 $C:x^2+(y-r)^2=r^2$와 실수 전체의 집합에서 미분가능한 함수 $f(x)$가 다음 조건을 만족시킨다. (단, $r>0$이다.)

  (가) $f(0)=0$

  (나) $f^{\prime}(0)=1$

  (다) $f(r)<r$

  다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: (1) 원 $C$와 곡선 $y=f(x)$가 $0<x<r$에서 적어도 하나의 교점을 가짐을 보이시오.
  points: 10
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(x)=r-\sqrt{r^2-x^2}$, $h=f-g$로 두면 $h(0)=0$, $h^{\prime}(0)=1>0$, $h(r)<0$이므로 $h(c)>0$인 $c$가 있고 사잇값의 정리로 $h(x)=0$인 $x$가 $(c,r)$에 있다.
    steps:
    - id: 1a
      content: 귀류법으로 $h(c)>0$인 $c\in(0,r)$의 존재를 보인 뒤 사잇값의 정리를 적용한다.
      criteria:
      - 1.M1
      - 1.M2
      - 1.R1
      - 1.R2
      - 1.R3
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 도형 $x^2+(y-r)^2=r^2$ 위의 점 중 $y\le r$인 부분을 나타내는 함수를 $g(x)=r-\sqrt{r^2-x^2}$라 하자.
      source_flow: g27.pdf p.82 예시답안 문제 2(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: 함수 $h(x)=f(x)-g(x)$에 대하여, 조건 (다)에 의해 $h(r)=f(r)-g(r)<r-r=0$을 만족한다.
      source_flow: g27.pdf p.82 예시답안 문제 2(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: 만약 $0<c<r$인 모든 실수 $c$에 대하여 $h(c)\le0$이라면, $h(0)=f(0)-g(0)=0$이므로 $h^{\prime}(0)=\displaystyle\lim_{t\to0+}\frac{h(t)-h(0)}{t}=\lim_{t\to0+}\frac{h(t)}{t}\le0$이다. 그런데 $h^{\prime}(0)=f^{\prime}(0)-g^{\prime}(0)=1>0$이므로 모순이다.
      source_flow: g27.pdf p.82 예시답안 문제 2(1)
      criteria:
      - 1.R1
    - id: 1b-4
      content: 따라서 $h(c)>0$인 실수 $c$가 열린구간 $(0,r)$에 적어도 하나 존재한다.
      source_flow: g27.pdf p.82 예시답안 문제 2(1)
      criteria:
      - 1.R2
    - id: 1b-5
      content: 함수 $h(x)$는 닫힌구간 $[c,r]$에서 연속이므로, (사잇값의 정리에 의해) $h(x)=0$인 $x$가 열린구간 $(c,r)$에서 적어도 하나 존재한다. 따라서 방정식 $h(x)=0$은 열린구간 $(c,r)$에서 적어도 하나의 실근을 가지므로 원 $C$와 곡선 $y=f(x)$는 $0<x<r$에서 적어도 하나의 교점을 가진다.
      source_flow: g27.pdf p.82 예시답안 문제 2(1)
      criteria:
      - 1.R3
