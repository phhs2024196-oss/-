    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: P$(t,f(t))$가 원 위의 점이므로 $t^2+\{f(t)-r\}^2=r^2$을 $r$에 대해 푼다.
    steps:
    - id: 2a
      content: $t^2-2r(t)f(t)+\{f(t)\}^2=0$, $t\ne0$이므로 $f(t)>0$, $r(t)=\frac{t^2+\{f(t)\}^2}{2f(t)}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.R1
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 점 P의 좌표를 $(t,f(t))$라 하자.
      source_flow: g27.pdf p.82 예시답안 문제 2(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: 점 P는 원 $C$ 위의 점이므로 $t^2+\{r(t)-f(t)\}^2=\{r(t)\}^2$을 만족한다.
      source_flow: g27.pdf p.82 예시답안 문제 2(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 $t^2-2r(t)f(t)+\{f(t)\}^2=0$이다.
      source_flow: g27.pdf p.82 예시답안 문제 2(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: 이때, $t$가 $0$이 아니므로, $f(t)>0$이다.
      source_flow: g27.pdf p.82 예시답안 문제 2(2)
      criteria:
      - 2.R1
    - id: 2b-5
      content: 따라서 $r(t)=\dfrac{t^2+\{f(t)\}^2}{2f(t)}$이다.
      source_flow: g27.pdf p.82 예시답안 문제 2(2)
      criteria:
      - 2.A1
