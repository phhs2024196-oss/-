- id: '2'
  stem: (2) 소문항 (1)에서 구한 다항함수 $g(x)$에 대하여, 정적분 $\displaystyle\int_{-1}^{0}\frac{g(x)+3}{f(x)+2}dx$의 값을 구하시오.
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: 8*log(2)/3
    equivalents:
    - $\frac83\ln2$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\frac{g+3}{f+2}=\frac{(x-1)(2x-3)}{(x-1)^2(x+2)}=\frac{2x-3}{3}\left(\frac1{x-1}-\frac1{x+2}\right)$로 부분분수 분해한 뒤 적분한다.
    steps:
    - id: 2a
      content: $\left(\frac23+\frac13\ln2\right)-\left(\frac23-\frac73\ln2\right)=\frac83\ln2$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 닫힌구간 $[-1,0]$에서 유리함수 $\dfrac{g(x)+3}{f(x)+2}=\dfrac{2x^2-5x+3}{x^3-3x+2}$을 정리하면 $\dfrac{g(x)+3}{f(x)+2}=\dfrac{(x-1)(2x-3)}{(x-1)^2(x+2)}=(2x-3)\times\dfrac1{(x-1)(x+2)}$이고,
      source_flow: g27.pdf p.83 예시답안 문제 3(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서 $\dfrac{g(x)+3}{f(x)+2}=\dfrac{2x-3}{3}\left(\dfrac1{x-1}-\dfrac1{x+2}\right)$이다.
      source_flow: g27.pdf p.83 예시답안 문제 3(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: 각각의 유리함수의 정적분의 값을 계산하면, $\displaystyle\int_{-1}^0\frac{2x-3}{3(x-1)}dx=\int_{-1}^0\left(\frac23-\frac1{3(x-1)}\right)dx=\left[\frac23x-\frac13\ln\lvert x-1\rvert\right]_{-1}^0=\frac23+\frac13\ln2$와 $\displaystyle\int_{-1}^0\frac{2x-3}{3(x+2)}dx=\int_{-1}^0\left(\frac23-\frac7{3(x+2)}\right)dx=\left[\frac23x-\frac73\ln\lvert x+2\rvert\right]_{-1}^0=\frac23-\frac73\ln2$이다.
      source_flow: g27.pdf p.83 예시답안 문제 3(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: 따라서, 정적분의 값은 $\displaystyle\int_{-1}^0\frac{g(x)+3}{f(x)+2}dx=\left(\frac23+\frac13\ln2\right)-\left(\frac23-\frac73\ln2\right)=\frac83\ln2$이다.
      source_flow: g27.pdf p.83 예시답안 문제 3(2)
      criteria:
      - 2.A1
