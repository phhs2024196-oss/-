- id: '3'
  stem: (3) 소문항 (1)에서 구한 $g(x)$에 대하여, 두 곡선 $y=f(x)$와 $y=g(x)+kx$가 한 점에서 접하고 또 다른 한 점에서 만나도록 하는 상수 $k$의 값을 모두 구하고, $k$의 값에 따라 두 곡선 $y=f(x)$와 $y=g(x)+kx$로 둘러싸인 도형의 넓이를 각각 구하시오.
  points: 9
  depends_on: []
  answer:
    kind: set
    value: k1=1; A1=1/12; k2=2; A2=4/3
    equivalents:
    - $k=1$일 때 $\frac1{12}$, $k=2$일 때 $\frac43$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$f(x)-g(x)-kx=x\left(x^2-2x+2-k\right)$에서 $x=0$이 근이므로 이차식이 $x=0$을 근으로 갖거나 중근을 가져야 한다: $k=1,2$.'
    steps:
    - id: 3a
      content: '$k=1$: $x(x-1)^2$, 넓이 $\frac1{12}$. $k=2$: $x^2(x-2)$, 넓이 $\frac43$.'
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
      - 3.A2
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: 소문항 (1)에 의해 $g(x)=2x^2-5x$이다. 두 곡선 $y=f(x)$와 $y=g(x)+kx$가 한 점에서 접하고 또 다른 한 점에서 만나므로, 방정식 $f(x)-g(x)-kx=0$은 서로 다른 실근의 개수가 $2$이고 이 중 하나는 중근이다.
      source_flow: g27.pdf p.83 예시답안 문제 3(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: $f(x)-g(x)-kx=x^3-2x^2+(2-k)x=x\left(x^2-2x+(2-k)\right)$이므로, $x=0$이 방정식 $f(x)-g(x)-kx=0$의 하나의 근이다.
      source_flow: g27.pdf p.83 예시답안 문제 3(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: 따라서, 이차방정식 $x^2-2x+(2-k)=0$이 $0$이 아닌 중근을 갖거나 $x=0$을 근으로 가져야 하므로 $k=1$ 또는 $k=2$이다.
      source_flow: g27.pdf p.83 예시답안 문제 3(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: $k=1$인 경우, $f(x)-g(x)-x=x(x-1)^2=x^3-2x^2+x$이므로, 넓이는 $\displaystyle\int_0^1\lvert x^3-2x^2+x\rvert dx=\left[\frac14x^4-\frac23x^3+\frac12x^2\right]_0^1=\frac1{12}$이다.
      source_flow: g27.pdf p.83 예시답안 문제 3(3)
      criteria:
      - 3.A1
    - id: 3b-5
      content: $k=2$인 경우, $f(x)-g(x)-2x=x^2(x-2)=x^3-2x^2$이므로, 넓이는 $\displaystyle\int_0^2\lvert x^3-2x^2\rvert dx=\left[-\frac14x^4+\frac23x^3\right]_0^2=\frac43$이다.
      source_flow: g27.pdf p.83 예시답안 문제 3(3)
      criteria:
      - 3.A2
