  tools:
  - $g(x)=2x^2+bx$로 두고 축 $x=-\frac b2$의 위치(2보다 작은지)에 따라 $x=3$ 또는 $x=1$에서 최솟값
  - $\frac{g(x)+3}{f(x)+2}=\frac{2x-3}{3}\left(\frac1{x-1}-\frac1{x+2}\right)$
  - $f(x)-g(x)-kx=x\left(x^2-2x+(2-k)\right)$
  conditions:
  - $a\ne0$, $n$은 자연수(최고차항 $ax^n$)
  - $b>-4$일 때와 $b\le-4$일 때로 나누어 최솟값 계산
  - $k=1$ 또는 $k=2$
