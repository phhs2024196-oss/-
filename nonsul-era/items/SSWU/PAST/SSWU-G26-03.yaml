stimuli: []
stem: |
  두 다항함수 $f(x)$와 $g(x)$가 다음 조건을 만족시킨다.

  (가) $f(x)=x^3-3x$

  (나) $\displaystyle\lim_{x\to\infty}\frac{\int_0^xf(t)g(t)dt}{\{f(x)\}^2}=\frac13$

  (다) $g(0)=0$

  다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: (1) 닫힌구간 $[1,3]$에서 함수 $h(x)=x^2-g(x)$의 최솟값이 $4$가 되도록 하는 다항함수 $g(x)$를 구하시오.
  points: 9
  depends_on: []
  answer:
    kind: expression
    value: 2*x**2 - 5*x
    equivalents:
    - $g(x)=2x^2-5x$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 최고차항 비교로 $g(x)=2x^2+bx$. $h(x)=-x^2-bx$의 축 위치로 나누어 최솟값 4가 되는 $b=-5$를 택한다.
    steps:
    - id: 1a
      content: $g(x)=2x^2+bx$, $b>-4$이면 $h(3)=-3b-9=4$에서 $b=-\frac{13}3$(부적합), $b\le-4$이면 $h(1)=-b-1=4$에서 $b=-5$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 다항함수 $g(x)$의 최고차항을 $ax^n$이라고 하면, 조건 (가)에 의해 다항함수 $\displaystyle\int_0^xf(t)g(t)dt$의 최고차항은 $\dfrac{a}{n+4}x^{n+4}$이고, 다항함수 $\{f(x)\}^2$의 최고차항은 $x^6$이다. (단, $a$는 $0$이 아닌 상수이고, $n$은 자연수이다.) 따라서, 조건 (나)에 의해 $n=2$, $a=2$이고 조건 (다)에 의해 $g(x)=2x^2+bx$라 둘 수 있다. (단, $b$는 상수이다.)
      source_flow: g27.pdf p.83 예시답안 문제 3(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: 다항함수 $h(x)=-x^2-bx$의 이차항의 계수가 음수이므로 이차함수 $y=h(x)$의 축 $x=-\frac b2$가 2보다 작으면 $x=3$에서 최솟값을 갖고, 축 $x=-\frac b2$가 $2$ 이상이면 $x=1$에서 최솟값을 갖는다.
      source_flow: g27.pdf p.83 예시답안 문제 3(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: 즉, 최솟값은 $b>-4$일 때 $h(3)=-3b-9$이고, $b\le-4$일 때 $h(1)=-b-1$이다. 최솟값이 $4$이므로 $b>-4$일 때 $b=-\dfrac{13}{3}$이고, $b\le-4$일 때 $b=-5$이다.
      source_flow: g27.pdf p.83 예시답안 문제 3(1)
      criteria:
      - 1.M3
    - id: 1b-4
      content: 이 중 조건을 만족하는 것은 $b=-5$이다. 따라서 $g(x)=2x^2-5x$이다.
      source_flow: g27.pdf p.83 예시답안 문제 3(1)
      criteria:
      - 1.A1
