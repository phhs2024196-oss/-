  - $h(x)=x^2-g(x)$의 닫힌구간 $[1,3]$에서의 최솟값 4
  - $\frac{g(x)+3}{f(x)+2}$, 두 곡선 $y=f(x)$, $y=g(x)+kx$
  concepts:
  - 다항함수의 극한(최고차항 비교)
  - 이차함수의 최대·최소
