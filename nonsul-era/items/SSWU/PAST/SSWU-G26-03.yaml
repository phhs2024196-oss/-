key_idea: $g$의 최고차항을 $ax^n$이라 하면 $\int_0^xfg\,dt$의 최고차항 $\frac{a}{n+4}x^{n+4}$과 $\{f\}^2$의 최고차항 $x^6$의 비교로 $n=2$, $a=2$. 최솟값 조건으로 $b=-5$. $\frac{g+3}{f+2}=\frac{(x-1)(2x-3)}{(x-1)^2(x+2)}$를 부분분수로 적분하고, $f-g-kx=x(x^2-2x+2-k)$에서 $k=1,2$.
stuck: (2) 분모 $x^3-3x+2=(x-1)^2(x+2)$와 약분 후 부분분수 분해, (3) 접하고 또 만나는 조건을 $x=0$이 근이라는 사실로 바꾸는 단계
