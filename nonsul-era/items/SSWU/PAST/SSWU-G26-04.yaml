    - id: 3b-2
      content: $\tan\alpha(t)=\dfrac t{\frac12}=2t$, $\tan\beta(t)=\dfrac t{1+\frac12}=\dfrac{2t}3$이므로 $\tan\theta(t)=\dfrac{\tan\alpha(t)-\tan\beta(t)}{1+\tan\alpha(t)\tan\beta(t)}=\dfrac{4t}{3+4t^2}$이다.
