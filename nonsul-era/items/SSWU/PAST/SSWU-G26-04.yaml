stem: 중심이 $\mathrm{O}(0,0)$이고 반지름의 길이가 $1$인 원 $C:x^2+y^2=1$에 대하여 다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: |
    (1) $0<x<\dfrac\pi2$인 실수 $x$에 대하여 $\sin x<x<\tan x$임을 보이고, 실수 $t$에 대하여 $\displaystyle\lim_{t\to0}\frac{\sin t}{t}=1$임을 보이시오.

    [그림 2: 원 $C$ 위의 점 A$(1,0)$, 반직선 OA와 각 $x$를 이루는 원 위의 점 B, 점 A에서 $x$축에 세운 수선 위의 점 T(반직선 OB 위). 삼각형 OAB, 부채꼴 OAB, 삼각형 OAT를 비교.]
  points: 9
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 삼각형 OAB $<$ 부채꼴 OAB $<$ 삼각형 OAT의 넓이로 $\sin x<x<\tan x$, 이로부터 $\cos x<\frac{\sin x}{x}<1$과 조임정리.
    steps:
    - id: 1a
      content: 넓이 비교 후 $\sin x$로 나누어 $\cos x<\frac{\sin x}{x}<1$, 우극한 1, $x=-t$ 치환으로 좌극한 1.
      criteria:
      - 1.M1
      - 1.M2
      - 1.R1
      - 1.R2
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $0<x<\dfrac\pi2$일 때, 그림으로부터 삼각형 OAB의 넓이는 $\dfrac12\sin x$, 부채꼴 OAB의 넓이는 $\dfrac12x$, 삼각형 OAT의 넓이는 $\dfrac12\tan x$이므로 $\sin x<x<\tan x$가 성립하고,
      source_flow: g27.pdf p.84 예시답안 문제 4(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: $\sin x>0$이므로, 이 부등식의 세 항을 $\sin x$로 나누면 $1<\dfrac{x}{\sin x}<\dfrac1{\cos x}$가 된다. 세 항의 역수를 취하면 $\cos x<\dfrac{\sin x}{x}<1$이고
      source_flow: g27.pdf p.84 예시답안 문제 4(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: $\displaystyle\lim_{x\to0+}\cos x=1$이므로 $\displaystyle\lim_{x\to0+}\frac{\sin x}{x}=1$이다.
      source_flow: g27.pdf p.84 예시답안 문제 4(1)
      criteria:
      - 1.R1
    - id: 1b-4
      content: $-\dfrac\pi2<x<0$인 경우, $x=-t$라 두면 $\dfrac{\sin(-t)}{-t}=\dfrac{\sin t}{t}$이므로 $\displaystyle\lim_{x\to0-}\frac{\sin x}{x}=\lim_{t\to0+}\frac{\sin t}{t}=1$이다.
      source_flow: g27.pdf p.84 예시답안 문제 4(1)
      criteria:
      - 1.R2
    - id: 1b-5
      content: 따라서 $\displaystyle\lim_{t\to0}\frac{\sin t}{t}=1$이다.
      source_flow: g27.pdf p.84 예시답안 문제 4(1)
      criteria:
      - 1.A1
