- id: '2'
  stem: |
    (2) $n\ge2$인 모든 자연수 $n$에 대하여 원 $C$ 위에 순서대로 놓인 $2n$개의 점 $\mathrm{P}_0$, $\mathrm{P}_1$, $\cdots$, $\mathrm{P}_{2n-1}$이 다음 조건을 만족시킨다.

    (가) 자연수 $k$가 홀수이면 $\angle\mathrm{P_0OP}_k=\dfrac{3k-1}{3n}\pi$

    (나) 자연수 $k$가 짝수이면 $\angle\mathrm{P_0OP}_k=\dfrac kn\pi$

    $2n$각형 $\mathrm{P_0P_1}\cdots\mathrm{P}_{2n-1}$의 넓이를 $S(n)$이라 할 때 $S(n)$을 구하고, $\displaystyle\lim_{n\to\infty}S(2026n)$의 값을 구하시오.
  points: 7
  depends_on: []
  answer:
    kind: set
    value: S=n*sin(2*pi/(3*n))/2+n*sin(4*pi/(3*n))/2; L=pi
    equivalents:
    - $S(n)=\frac n2\sin\frac{2\pi}{3n}+\frac n2\sin\frac{4\pi}{3n}$, $\lim_{n\to\infty}S(2026n)=\pi$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 꼭지각 $\frac{2\pi}{3n}$인 합동 삼각형 $n$개와 꼭지각 $\frac{4\pi}{3n}$인 합동 삼각형 $n$개로 나뉜다.
    steps:
    - id: 2a
      content: $S(n)=\frac n2\sin\frac{2\pi}{3n}+\frac n2\sin\frac{4\pi}{3n}$, $\lim S(2026n)=\frac\pi3+\frac{2\pi}3=\pi$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
      - 2.M3
      - 2.A2
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 합동인 $n$개의 삼각형 $\triangle\mathrm{OP_0P_1}$, $\triangle\mathrm{OP_2P_3}$, $\cdots$, $\triangle\mathrm{OP}_{2n-2}\mathrm{P}_{2n-1}$은 모두 꼭지각이 $\dfrac{2\pi}{3n}$이고 두 등변의 길이가 $1$인 이등변삼각형이므로 각각의 넓이는 $\dfrac12\sin\dfrac{2\pi}{3n}$이다.
      source_flow: g27.pdf p.84 예시답안 문제 4(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: 합동인 $n$개의 삼각형 $\triangle\mathrm{OP_1P_2}$, $\triangle\mathrm{OP_3P_4}$, $\cdots$, $\triangle\mathrm{OP}_{2n-3}\mathrm{P}_{2n-2}$, $\triangle\mathrm{OP}_{2n-1}\mathrm{P_0}$은 모두 꼭지각이 $\dfrac{4\pi}{3n}$이고 두 등변의 길이가 $1$인 이등변삼각형이므로 각각의 넓이는 $\dfrac12\sin\dfrac{4\pi}{3n}$이다.
      source_flow: g27.pdf p.84 예시답안 문제 4(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: 따라서 $S(n)=\dfrac n2\sin\dfrac{2\pi}{3n}+\dfrac n2\sin\dfrac{4\pi}{3n}$이다.
      source_flow: g27.pdf p.84 예시답안 문제 4(2)
      criteria:
      - 2.A1
    - id: 2b-4
      content: $s=\dfrac{2\pi}{3\times2026n}$라 하면 $n\to\infty$일 때 $s\to0$이므로 $\displaystyle\lim_{n\to\infty}\frac{2026n}{2}\sin\frac{2\pi}{3\times2026n}=\frac\pi3\lim_{s\to0}\frac{\sin s}{s}=\frac\pi3$이고, $t=\dfrac{4\pi}{3\times2026n}$라 하면 $n\to\infty$일 때 $t\to0$이므로 $\displaystyle\lim_{n\to\infty}\frac{2026n}{2}\sin\frac{4\pi}{3\times2026n}=\frac{2\pi}3\lim_{t\to0}\frac{\sin t}{t}=\frac{2\pi}3$이다.
      source_flow: g27.pdf p.84 예시답안 문제 4(2)
      criteria:
      - 2.M3
    - id: 2b-5
      content: 따라서 $\displaystyle\lim_{n\to\infty}S(2026n)=\frac\pi3+\frac{2\pi}3=\pi$이다.
      source_flow: g27.pdf p.84 예시답안 문제 4(2)
      criteria:
      - 2.A2
