key_idea: 삼각형·부채꼴 넓이 비교로 $\cos x<\frac{\sin x}{x}<1$을 얻어 $\lim\frac{\sin t}{t}=1$. 합동인 이등변삼각형 $n$개씩 두 종류로 $S(n)=\frac n2\sin\frac{2\pi}{3n}+\frac n2\sin\frac{4\pi}{3n}$. $\theta=\alpha-\beta$로 $\tan\theta(t)=\frac{4t}{3+4t^2}$, $f(t)=\frac{4t}{3+4t^2}$의 최대·최소로 $\theta$의 최대·최소를 구한다.
