intent: |
  공통 과목인 ‘수학’에서 배운 이차함수의 그래프를 바탕으로 최대, 최소를 이해하고, 절댓값이 포함된 일차부등식을 다룰 수 있으며, 수학 Ⅰ의 수열의 합을 통합적으로 활용하는 문제해결 능력을 평가하고자 한다. 주어진 문제를 정확히 이해하고 수학적으로 가능한 모든 경우를 분석하여 종합하여 해결할 수 있는지 평가하고자 한다. 또한, 문제를 해결하는 단계를 전개해 나가며 그에 대한 설명을 논리적으로 명확하게 서술할 수 있는지도 평가하고자 한다.
