stem: |
  ※ 〈문제 1〉에서부터 〈문제 4〉까지 총 4개의 문제가 있고, 각 문제마다 3개의 세부 문항이 있습니다. 답안지의 지정된 양식 안에 각 세부 문항 별로 해당 문항 번호를 쓰고 답을 작성하십시오. 수식과 논리를 명확히 전개하고 근거와 과정을 제시하십시오. (시험 시간: 100분, 답안 분량: 지정된 답안 양식 내 작성)

  실수 $a$와 이차함수 $f(x)=x^2-2ax+2a$에 대하여 구간 $1\le x\le2$에서의 $\lvert f(x)\rvert$의 최댓값을 $M(a)$라고 할 때, 다음 물음에 답하시오. [총25점]
subparts:
- id: '1'
  stem: |
    (1) $a\le1$일 때, $M(a)$를 $a$에 대한 식으로 나타내시오.
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: 4-2*a
    equivalents:
    - $M(a)=4-2a$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 대칭축 $x=a\le1$이므로 구간에서 $f$는 증가, $f(2)=4-2a>f(1)=1$.
    steps:
    - id: 1a
      content: $M(a)=\lvert f(2)\rvert=f(2)=4-2a$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g21.pdf p.52 채점기준(예시답안) 문제 1(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $y=f(x)=(x-a)^2-a^2+2a$의 그래프의 대칭축은 $x=a$이고
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f(1)=1$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $a\le1$일 때, 구간 $1\le x\le2$에서 $f(x)$는 증가함수이고
      criteria:
      - 1.M1
    - id: 1b-4
      content: |
        $f(2)>f(1)=1$이므로, $M(a)=\lvert f(2)\rvert=f(2)=4-2a$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        대칭축 $x=a$, $f(1)=1$, $a\le1$에서 구간 $[1,2]$의 증가를 보였다.
      depends_on: []
      steps:
      - 1b-1
      - 1b-2
      - 1b-3
      implied_ok: false
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $f(2)>f(1)=1$로부터 $M(a)=4-2a$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) $1<a$일 때, $M(a)$를 $a$에 대한 식으로 나타내시오.
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: M1=4-2*a; M2=1; M3=2*a-4
    equivalents:
    - $M(a)=4-2a$ $\left(1<a\le\frac32\right)$, $M(a)=1$ $\left(\frac32<a\le\frac52\right)$, $M(a)=2a-4$ $\left(a>\frac52\right)$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\lvert f(1)\rvert=1$, $\lvert f(2)\rvert=\lvert4-2a\rvert$를 비교하고 꼭짓점 $f(a)$의 부호를 확인하며 $\frac32,\ \frac52$에서 경우를 나눈다.
    steps:
    - id: 2a
      content: '$1<a\le\frac32$: $4-2a$, $\frac32<a\le\frac52$: $1$, $a>\frac52$: $2a-4$'
      criteria:
      - 2.B1
      - 2.B2
      - 2.B3
      - 2.B4
  - id: S2-B
    audience: B
    source_flow: g21.pdf p.52~53 채점기준(예시답안) 문제 1(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        ① $1<a\le\dfrac32$인 경우: 구간 $1\le x\le2$에서 $f(1)=1$, $f(a)=-a^2+2a=a(2-a)>0$, $f(2)=4-2a\ge4-2\cdot\dfrac32=1$이므로 $M(a)=\lvert f(2)\rvert=f(2)=4-2a$이다.
      criteria:
      - 2.B1
    - id: 2b-2
      content: |
        ② $\dfrac32<a\le2$인 경우: 구간 $1\le x\le2$에서 $f(1)=1$, $f(a)=-a^2+2a=a(2-a)>0$, $f(2)=4-2a\le4-2\cdot\dfrac32=1$이므로 $M(a)=\lvert f(1)\rvert=1$이다.
      criteria:
      - 2.B2
    - id: 2b-3
      content: |
        ③ $2<a\le\dfrac52$인 경우: 구간 $1\le x\le2$에서 $f(x)$는 감소함수이고 $f(1)=1$이다. 그리고 $f(2)=4-2a$에 대하여 $-1\le f(2)<0$이다. 따라서 $M(a)=\lvert f(1)\rvert=1$이다.
      criteria:
      - 2.B3
    - id: 2b-4
      content: |
        ④ $\dfrac52<a$인 경우: 구간 $1\le x\le2$에서 $f(x)$는 감소함수이고 $f(1)=1$이다. 그리고 $f(2)=4-2a$에 대하여 $f(2)<-1$이다. 따라서 $M(a)=\lvert f(2)\rvert=-f(2)=2a-4$이다.
      criteria:
      - 2.B4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.B1
      mark_type: B
      points: 3
      evidence: |
        $1<a\le\frac32$에서 $M(a)=4-2a$를 구했다.
      depends_on: []
      steps:
      - 2b-1
    - id: 2.B2
      mark_type: B
      points: 3
      evidence: |
        $\frac32<a\le2$에서 $M(a)=1$을 구했다.
      depends_on: []
      steps:
      - 2b-2
    - id: 2.B3
      mark_type: B
      points: 3
      evidence: |
        $2<a\le\frac52$에서 $M(a)=1$을 구했다.
      depends_on: []
      steps:
      - 2b-3
    - id: 2.B4
      mark_type: B
      points: 3
      evidence: |
        $a>\frac52$에서 $M(a)=2a-4$를 구했다.
      depends_on: []
      steps:
      - 2b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (3) 10 이상의 자연수 $n$에 대하여 $\displaystyle\sum_{k=1}^{n}M(k-7)$을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: n**2-17*n+145
    equivalents:
    - $n^2-17n+145$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $k\le8$이면 $a=k-7\le1$, $k=9$이면 $a=2$, $k\ge10$이면 $a\ge3>\frac52$로 나누어 합한다.
    steps:
    - id: 3a
      content: $\sum_{k=1}^{8}(18-2k)+1+\sum_{k=10}^{n}(2k-18)=n^2-17n+145$
      criteria:
      - 3.B1
      - 3.M1
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g21.pdf p.53 채점기준(예시답안) 문제 1(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        ① $\displaystyle\sum_{k=1}^{8}M(k-7)=\sum_{k=1}^{8}(18-2k)$
      criteria:
      - 3.B1
    - id: 3b-2
      content: |
        ② $k=9$이면 $M(k-7)=M(2)=1$
      criteria:
      - 3.B1
    - id: 3b-3
      content: |
        ③ $\displaystyle\sum_{k=10}^{n}M(k-7)=\sum_{k=10}^{n}(2k-18)$
      criteria:
      - 3.B1
    - id: 3b-4
      content: |
        ④ $\displaystyle\sum_{k=1}^{n}M(k-7)=\left(\sum_{k=1}^{8}(18-2k)\right)+1+\left(\sum_{k=10}^{n}(2k-18)\right)$ $=1+18\cdot8-18(n-9)-2\displaystyle\sum_{k=1}^{8}k+2\sum_{k=10}^{n}k$ $=1+18\cdot8-18(n-9)-2\displaystyle\sum_{k=1}^{8}k+2\left(\sum_{k=1}^{n}k-\sum_{k=1}^{9}k\right)$ $=1+18\cdot8-18(n-9)-2\cdot9-4\displaystyle\sum_{k=1}^{8}k+2\sum_{k=1}^{n}k$
      criteria:
      - 3.M1
    - id: 3b-5
      content: |
        ⑤ 그러므로 $\displaystyle\sum_{k=1}^{n}M(k-7)=1+18(8+9-1)-18n-4\cdot\dfrac{8\cdot9}{2}+2\cdot\dfrac{n(n+1)}{2}=n^2-17n+145$
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.B1
      mark_type: B
      points: 3
      evidence: |
        $k\le8$, $k=9$, $k\ge10$ 세 구간의 $M(k-7)$을 구했다.
      depends_on: []
      steps:
      - 3b-1
      - 3b-2
      - 3b-3
    - id: 3.M1
      mark_type: M
      points: 3
      evidence: |
        세 구간의 합을 $\sum k$로 정리하는 식을 세웠다.
      depends_on:
      - 3.B1
      steps:
      - 3b-4
      implied_ok: false
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $n^2-17n+145$를 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-5
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
