key_idea: |
  $f(x)=(x-a)^2-a^2+2a$는 대칭축 $x=a$, $f(1)=1$. 구간 $[1,2]$에서 $\lvert f(x)\rvert$의 최댓값은 $\max\{\lvert f(1)\rvert,\lvert f(2)\rvert,\lvert f(a)\rvert\}$이므로 $a$의 범위를 $a\le1,\ 1<a\le\frac32,\ \frac32<a\le\frac52,\ a>\frac52$로 나누어 $M(a)$를 구하고, 수열의 합에서 $k-7$의 범위(≤1, =2, ≥3)로 구간을 나누어 더한다.
stuck: |
  (2)에서 $\lvert f(1)\rvert=1$과 $\lvert f(2)\rvert=\lvert4-2a\rvert$의 대소가 바뀌는 $a=\frac32,\ \frac52$를 찾아 경우를 나누는 단계
