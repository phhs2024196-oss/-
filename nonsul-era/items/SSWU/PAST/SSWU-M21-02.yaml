intent: |
  공통 과목인 ‘수학’에서 배운 무리함수 $f(x)=\sqrt{x}$의 그래프에 대한 이해를 바탕으로 접선의 기울기와 미분의 관계를 이해하고, 구간 $[a,b]$에서 평균값 정리를 만족하는 점 $c$를 찾을 수 있는지 확인한다. 수학 Ⅱ에서 다룬 함수의 극한과 접선의 방정식, 평균값 정리를 통합적으로 활용하는 문제해결 능력을 평가한다. 그리고 미적분에서 다룬 곡선으로 둘러싸인 도형의 넓이를 근사적인 사다리꼴의 넓이와 비교할 수 있는 분석능력을 살펴본다. 또한, 문제를 해결하는 단계를 전개해 나가며 그에 대한 설명을 논리적으로 명확하게 서술할 수 있는지도 평가하고자 한다.
