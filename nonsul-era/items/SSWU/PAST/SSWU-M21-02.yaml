key_idea: |
  평균값 정리의 점 $c$는 $f^{\prime}(c)=\frac{1}{2\sqrt c}=\frac{\sqrt{a+h}-\sqrt a}{h}$에서 $\sqrt c=\frac12(\sqrt{a+h}+\sqrt a)$. $b=4a$이면 $c=\frac94a$이고 $S=\frac{14}{3}a\sqrt a$, $S_1=\frac{25}{16}a\sqrt a$, $S_2=\frac{49}{16}a\sqrt a$.
stuck: |
  (1)에서 분자의 유리화로 $\sqrt c=\frac12(\sqrt{a+h}+\sqrt a)$를 얻고 양변을 제곱해 $c$를 $a$, $h$로 나타내는 단계
