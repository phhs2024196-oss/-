stimuli: []
stem: |
  함수 $f(x)=\sqrt{x}$의 그래프 위의 두 점 $(a,f(a))$와 $(b,f(b))$를 지나는 직선과 같은 기울기를 가지는 접선의 접점의 $x$좌표를 $c$라고 할 때, 다음 물음에 답하시오. 단, $0<a<c<b$이다. [총25점]
subparts:
- id: '1'
  stem: |
    (1) $b-a=h$로 두고, $c$를 $a$와 $h$에 대한 식으로 나타내시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: (2*a+h+2*sqrt(a**2+a*h))/4
    equivalents:
    - $c=\frac14\left(2a+h+2\sqrt{a^2+ah}\right)$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\frac{f(b)-f(a)}{b-a}=f^{\prime}(c)=\frac1{2\sqrt c}$에서 $\sqrt c=\frac12(\sqrt{a+h}+\sqrt a)$, 양변 제곱.
    steps:
    - id: 1a
      content: $c=\frac14(2a+h+2\sqrt{a^2+ah})$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g21.pdf p.53 채점기준(예시답안) 문제 2(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        ① 두 점 $(a,f(a))$, $(b,f(b))$를 지나는 직선의 기울기는 $\dfrac{f(b)-f(a)}{b-a}$이고,
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        ② $x=c$인 점에서의 접선의 기울기는 $f^{\prime}(c)=\dfrac{1}{2\sqrt c}$이다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        ③ 따라서 $b-a=h$라 하면 $\dfrac{f(b)-f(a)}{b-a}=\dfrac{\sqrt{a+h}-\sqrt a}{h}=f^{\prime}(c)=\dfrac{1}{2\sqrt c}$이다.
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        ④ $\sqrt c=\dfrac{h}{2(\sqrt{a+h}-\sqrt a)}=\dfrac12(\sqrt{a+h}+\sqrt a)$이므로 양변을 제곱하면 $c=\dfrac14\left(2a+h+2\sqrt{a^2+ah}\right)$이다.
      criteria:
      - 1.M2
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 3
      evidence: |
        직선의 기울기 $\frac{f(b)-f(a)}{b-a}$와 접선의 기울기 $f^{\prime}(c)=\frac1{2\sqrt c}$를 나타냈다.
      depends_on: []
      steps:
      - 1b-1
      - 1b-2
      implied_ok: false
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: |
        $\sqrt c=\frac12(\sqrt{a+h}+\sqrt a)$를 유도했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-3
      - 1b-4
      implied_ok: false
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $c=\frac14(2a+h+2\sqrt{a^2+ah})$를 구했다.
      depends_on:
      - 1.M2
      steps:
      - 1b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) $\displaystyle\lim_{b\to a}\dfrac{c-a}{b-a}$의 값을 구하시오.
  points: 7
  depends_on: []
  answer:
    kind: value
    value: 1/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $c-a=\frac14(-2a+h+2\sqrt{a^2+ah})$를 $h$로 나누어 유리화한다.
    steps:
    - id: 2a
      content: $\lim_{h\to0}\frac{8a-h}{4(2\sqrt{a^2+ah}+2a-h)}=\frac{8a}{4\cdot4a}=\frac12$
      criteria:
      - 2.M1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g21.pdf p.53 채점기준(예시답안) 문제 2(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        ① $c-a=\dfrac14\left(-2a+h+2\sqrt{a^2+ah}\right)$이므로
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        ② $\displaystyle\lim_{b\to a}\dfrac{c-a}{b-a}=\lim_{h\to0}\dfrac{2\sqrt{a^2+ah}-(2a-h)}{4h}$
      criteria:
      - 2.M1
    - id: 2b-3
      content: |
        ③ $=\displaystyle\lim_{h\to0}\dfrac{4(a^2+ah)-(2a-h)^2}{4h\left(2\sqrt{a^2+ah}+(2a-h)\right)}$
      criteria:
      - 2.M2
    - id: 2b-4
      content: |
        ④ $=\displaystyle\lim_{h\to0}\dfrac{8a-h}{4\left(2\sqrt{a^2+ah}+(2a-h)\right)}=\dfrac12$
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $b\to a$를 $h\to0$으로 바꾸어 $\lim_{h\to0}\frac{2\sqrt{a^2+ah}-(2a-h)}{4h}$를 세웠다.
      depends_on: []
      steps:
      - 2b-1
      - 2b-2
      implied_ok: false
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: |
        분자를 유리화했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-3
      implied_ok: false
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        극한값 $\frac12$을 구했다.
      depends_on:
      - 2.M2
      steps:
      - 2b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (3) $b=4a$라고 하고, 구간 $[a,b]$와 곡선 $y=f(x)$ 사이의 넓이를 $S$, 네 점 $(a,0)$, $(c,0)$, $(c,f(c))$, $(a,f(a))$를 꼭짓점으로 하는 사다리꼴의 넓이를 $S_1$, 네 점 $(c,0)$, $(b,0)$, $(b,f(b))$, $(c,f(c))$를 꼭짓점으로 하는 사다리꼴의 넓이를 $S_2$라고 할 때, $S:(S_1+S_2)$를 정수의 비율로 나타내시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 112:111
    equivalents:
    - $224:222$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $b=4a$이면 $c=\frac94a$. $S=\int_a^{4a}\sqrt x\,dx$, 두 사다리꼴의 넓이를 구해 비를 정수로 나타낸다.
    steps:
    - id: 3a
      content: $S=\frac{14}{3}a\sqrt a$, $S_1+S_2=\frac{74}{16}a\sqrt a$ → $112:111$
      criteria:
      - 3.B1
      - 3.B2
      - 3.B3
      - 3.B4
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g21.pdf p.54 채점기준(예시답안) 문제 2(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        ① $c=\dfrac14\left(2a+3a+2\sqrt{a^2+3a^2}\right)=\dfrac14(5a+4a)=\dfrac94a$
      criteria:
      - 3.B1
    - id: 3b-2
      content: |
        ② $S=\displaystyle\int_a^{4a}\sqrt x\,dx=\left[\dfrac23x\sqrt x\right]_a^{4a}=\dfrac23(8-1)a\sqrt a=\dfrac{14}{3}a\sqrt a$
      criteria:
      - 3.B2
    - id: 3b-3
      content: |
        ③ $S_1=\dfrac{f(a)+f(c)}{2}\cdot(c-a)=\dfrac{\sqrt a+\frac32\sqrt a}{2}\cdot\left(\dfrac94a-a\right)=\dfrac54\sqrt a\cdot\dfrac54a=\dfrac{25}{16}a\sqrt a$
      criteria:
      - 3.B3
    - id: 3b-4
      content: |
        ④ $S_2=\dfrac{f(c)+f(b)}{2}\cdot(b-c)=\dfrac{\frac32\sqrt a+2\sqrt a}{2}\cdot\left(4a-\dfrac94a\right)=\dfrac74\sqrt a\cdot\dfrac74a=\dfrac{49}{16}a\sqrt a$ $\therefore S_1+S_2=\left(\dfrac{25}{16}+\dfrac{49}{16}\right)a\sqrt a=\dfrac{74}{16}a\sqrt a$
      criteria:
      - 3.B4
    - id: 3b-5
      content: |
        ⑤ 따라서 $S:(S_1+S_2)=\dfrac{14}{3}:\dfrac{74}{16}=224:222$ 또는 $112:111$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        $c=\frac94a$를 구했다.
      depends_on: []
      steps:
      - 3b-1
    - id: 3.B2
      mark_type: B
      points: 2
      evidence: |
        $S=\frac{14}{3}a\sqrt a$를 구했다.
      depends_on: []
      steps:
      - 3b-2
    - id: 3.B3
      mark_type: B
      points: 2
      evidence: |
        $S_1=\frac{25}{16}a\sqrt a$를 구했다.
      depends_on:
      - 3.B1
      steps:
      - 3b-3
    - id: 3.B4
      mark_type: B
      points: 2
      evidence: |
        $S_2=\frac{49}{16}a\sqrt a$를 구했다.
      depends_on:
      - 3.B1
      steps:
      - 3b-4
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $S:(S_1+S_2)=112:111$을 구했다.
      depends_on:
      - 3.B2
      - 3.B3
      - 3.B4
      steps:
      - 3b-5
