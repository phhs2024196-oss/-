key_idea: |
  정육각형의 대각선 $\overline{\mathrm{A_0C_0}}=\sqrt3$, 지름 $\overline{\mathrm{A_0D_0}}=2$. 대각선들의 교점으로 이루어진 안쪽 정육각형은 한 변이 $\frac{1}{\sqrt3}$배로 닮은꼴이므로 $\overline{\mathrm{A}_k\mathrm{A}_{k+1}}=\frac{2}{\sqrt3^{\,k+1}}$인 등비수열이고 합은 $\frac{2/\sqrt3}{1-1/\sqrt3}=\sqrt3+1$.
stuck: |
  (3)에서 $\overline{\mathrm{A}_k\mathrm{A}_{k+1}}=\frac23\overline{\mathrm{A}_k\mathrm{C}_k}$와 $\overline{\mathrm{A}_k\mathrm{C}_k}=\sqrt3\,\overline{\mathrm{A}_k\mathrm{B}_k}$, $\overline{\mathrm{A}_k\mathrm{B}_k}=\frac13\overline{\mathrm{A}_{k-1}\mathrm{C}_{k-1}}$로 공비 $\frac1{\sqrt3}$을 얻는 단계
