intent: |
  수학 Ⅰ에서 다루는 삼각함수의 활용과 미적분의 등비급수의 극한에 대한 활용 능력을 평가하고자 한다. 문제의 상황을 분석하고 이해하는 능력, 사인법칙과 삼각비를 활용한 선분의 길이 계산과 삼각형의 면적 계산, 그리고 주어진 상황을 적절하게 해석하여 규칙성을 찾고 식을 세우는 능력, 이를 활용한 급수의 합 도출 능력 등을 종합적으로 평가한다.
