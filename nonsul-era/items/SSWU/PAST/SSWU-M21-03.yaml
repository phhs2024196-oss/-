- id: '3'
  stem: |
    (3) 자연수 $n$에 대하여 위의 과정을 $n$번 반복하여 얻어지는 정육각형의 꼭짓점을 위의 그림과 같이 순서대로 각각 $\mathrm{A}_n,\ \mathrm{B}_n,\ \mathrm{C}_n,\ \mathrm{D}_n,\ \mathrm{E}_n,\ \mathrm{F}_n$이라 할 때, $\displaystyle\lim_{n\to\infty}\sum_{k=0}^{n}\overline{\mathrm{A}_k\mathrm{A}_{k+1}}$을 구하시오.
