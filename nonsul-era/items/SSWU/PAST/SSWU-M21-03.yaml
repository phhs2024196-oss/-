    method_no: 1
    key_idea: 정육각형의 한 변은 반지름과 같고 $\mathrm{A_0D_0}$는 지름. 직각삼각형 $\mathrm{A_0C_0D_0}$에 피타고라스 정리.
    steps:
    - id: 1a
      content: $1,\ \sqrt3,\ 2$, 정삼각형 $\mathrm{A_0C_0E_0}$의 넓이 $\frac12(\sqrt3)^2\sin\frac\pi3=\frac{3\sqrt3}4$
      criteria:
      - 1.B1
      - 1.M1
      - 1.A1
      - 1.A2
  - id: S1-B
    audience: B
    source_flow: g21.pdf p.54 채점기준(예시답안) 문제 3(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        ① 반지름이 1인 원의 중심을 O라 하면 삼각형 $\mathrm{OA_0B_0}$는 정삼각형이므로 선분 $\mathrm{A_0B_0}$의 길이는 1이다
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        ② 삼각형 $\mathrm{A_0C_0D_0}$는 $\mathrm{A_0D_0}$가 주어진 원의 지름이므로 각 $\mathrm{A_0C_0D_0}$가 직각이고
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        ③ 빗변 $\mathrm{A_0D_0}$의 길이가 2, 선분 $\mathrm{C_0D_0}$의 길이는 1인 직각삼각형이다.
      criteria:
      - 1.M1
    - id: 1b-4
      content: |
        ④ 따라서 피타고라스 정리에 의하여 선분 $\mathrm{A_0C_0}$의 길이는 $\sqrt3$이다.
      criteria:
      - 1.A1
    - id: 1b-5
      content: |
        ⑤ 삼각형 $\mathrm{A_0C_0E_0}$는 한 변의 길이가 $\sqrt3$인 정삼각형이므로 면적은 $\dfrac12(\sqrt3)^2\sin\left(\dfrac\pi3\right)=\dfrac{3\sqrt3}{4}$이다.
      criteria:
      - 1.A2
