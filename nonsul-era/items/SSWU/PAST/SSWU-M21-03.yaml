stem: |
  반지름의 길이가 1인 원에 내접하는 정육각형의 꼭짓점을 그림과 같이 반시계방향으로 $\mathrm{A_0,\ B_0,\ C_0,\ D_0,\ E_0,\ F_0}$라 하자. 그리고 그림과 같이 $\overline{\mathrm{A_0C_0}}$와 $\overline{\mathrm{B_0D_0}}$의 교점을 $\mathrm{A_1}$, $\overline{\mathrm{B_0D_0}}$과 $\overline{\mathrm{C_0E_0}}$의 교점을 $\mathrm{B_1}$, $\overline{\mathrm{C_0E_0}}$와 $\overline{\mathrm{D_0F_0}}$의 교점을 $\mathrm{C_1}$, $\overline{\mathrm{D_0F_0}}$와 $\overline{\mathrm{E_0A_0}}$의 교점을 $\mathrm{D_1}$, $\overline{\mathrm{E_0A_0}}$와 $\overline{\mathrm{F_0B_0}}$의 교점을 $\mathrm{E_1}$, $\overline{\mathrm{F_0B_0}}$와 $\overline{\mathrm{A_0C_0}}$의 교점을 $\mathrm{F_1}$이라 하자. [총25점]

  [그림 1: 원에 내접하는 정육각형 $\mathrm{A_0B_0C_0D_0E_0F_0}$. $\mathrm{A_0}$는 왼쪽 아래, $\mathrm{B_0}$는 오른쪽 아래, $\mathrm{C_0}$는 오른쪽 끝, $\mathrm{D_0}$는 오른쪽 위, $\mathrm{E_0}$는 왼쪽 위, $\mathrm{F_0}$는 왼쪽 끝(반시계방향). 대각선 $\mathrm{A_0C_0}$, $\mathrm{B_0D_0}$, $\mathrm{C_0E_0}$, $\mathrm{D_0F_0}$, $\mathrm{E_0A_0}$, $\mathrm{F_0B_0}$를 그려 안쪽에 육각별 모양이 생기고, 안쪽 정육각형의 꼭짓점이 $\mathrm{A_1}$(오른쪽 아래), $\mathrm{B_1}$(오른쪽 위), $\mathrm{C_1}$(위), $\mathrm{D_1}$(왼쪽 위), $\mathrm{E_1}$(왼쪽 아래), $\mathrm{F_1}$(아래)이다. 점선으로 같은 과정을 한 번 더 한 $\mathrm{A_2},\cdots,\mathrm{F_2}$ 표시. 삼각형 $\mathrm{A_0C_0E_0}$ 부분에 색칠]
