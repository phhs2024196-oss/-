  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\overline{\mathrm{A}_k\mathrm{A}_{k+1}}=\frac{2}{\sqrt3^{\,k+1}}$로 공비 $\frac1{\sqrt3}$인 등비수열.
    steps:
    - id: 3a
      content: $\sum_{k=0}^{\infty}\frac{2}{\sqrt3^{\,k+1}}=\frac{2}{\sqrt3-1}=\sqrt3+1$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g21.pdf p.54~55 채점기준(예시답안) 문제 3(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        ① $\overline{\mathrm{A_1B_1}}=\dfrac13\overline{\mathrm{A_0C_0}}=\dfrac{\sqrt3}{3}$이고 $\overline{\mathrm{A_0A_1}}=\dfrac23\overline{\mathrm{A_0C_0}}=\dfrac{2\sqrt3}{3}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        ② 이런 작업을 반복하면 $\overline{\mathrm{A}_k\mathrm{C}_k}=\sqrt3\times\overline{\mathrm{A}_k\mathrm{B}_k}$, $\overline{\mathrm{A}_k\mathrm{B}_k}=\dfrac13\overline{\mathrm{A}_{k-1}\mathrm{C}_{k-1}}$, $\overline{\mathrm{A}_k\mathrm{A}_{k+1}}=\dfrac23\overline{\mathrm{A}_k\mathrm{C}_k}$로부터
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        ③ $\overline{\mathrm{A}_k\mathrm{A}_{k+1}}=\dfrac23\overline{\mathrm{A}_k\mathrm{C}_k}=\dfrac{2\sqrt3}{3}\overline{\mathrm{A}_k\mathrm{B}_k}=\dfrac{2\sqrt3}{9}\overline{\mathrm{A}_{k-1}\mathrm{C}_{k-1}}=\dfrac{\sqrt3}{3}\overline{\mathrm{A}_{k-1}\mathrm{A}_k}$이므로 $\overline{\mathrm{A}_k\mathrm{A}_{k+1}}=2\dfrac{1}{\sqrt3^{\,k+1}}$, $(k\ge0)$이다.
      criteria:
      - 3.M2
    - id: 3b-4
      content: |
        ④ 따라서 $\displaystyle\sum_{k=0}^{n}\overline{\mathrm{A}_k\mathrm{A}_{k+1}}=\sum_{k=0}^{n}\dfrac{2}{\sqrt3^{\,k+1}}=\dfrac{\frac{2\sqrt3}{3}\left(1-\left(\frac{1}{\sqrt3}\right)^{n+1}\right)}{1-\frac{1}{\sqrt3}}=\dfrac{2\left(1-\left(\frac{1}{\sqrt3}\right)^{n+1}\right)}{\sqrt3-1}$이고
      criteria:
      - 3.M3
    - id: 3b-5
      content: |
        ⑤ 이로부터 $\displaystyle\lim_{n\to\infty}\sum_{k=0}^{n}\overline{\mathrm{A}_k\mathrm{A}_{k+1}}=\sqrt3+1$이다.
      criteria:
      - 3.A1
