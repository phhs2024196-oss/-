- id: '3'
  stem: |
    (3) 주어진 자연수 $n$에 대해 $\displaystyle\sum_{k=1}^{n}a_k$를 $n$에 대한 식으로 표현하시오.
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: even=n*(n+2)*(2*n-1)/24+n; odd=(n-1)*(n+1)*(2*n+3)/24+n
    equivalents:
    - '$n$이 짝수: $\frac{n(n+2)(2n-1)}{24}+n$, $n$이 홀수: $\frac{(n-1)(n+1)(2n+3)}{24}+n$'
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $n$의 홀짝으로 나누어 $k\le m$에서 $a_k=$ 삼각수$+1$, $k>m$에서 $a_k=1$로 합한다.
    steps:
    - id: 3a
      content: '짝수 $n=2m$: $\frac{n(n+2)(2n-1)}{24}+n$, 홀수 $n=2m+1$: $\frac{(n-1)(n+1)(2n+3)}{24}+n$'
      criteria:
      - 3.M1
      - 3.B1
      - 3.B2
      - 3.B3
      - 3.B4
  - id: S3-B
    audience: B
    source_flow: g21.pdf p.55 채점기준(예시답안) 문제 4(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        ① $n$이 짝수인 경우와 홀수인 경우로 나누어 생각하자.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        ② 경우 1. $n$이 짝수인 경우 $n=2m$이라 두자. 그러면 $1\le k\le m$인 자연수 $k$에 대해 $a_k=(1+2+\cdots+(n-2k+1)))+1=\dfrac{(n-2k+1)(n-2k+2)}{2}+1$ 이고 $m+1\le k\le n$인 자연수 $k$에 대해 $a_k=1$이다.
      criteria:
      - 3.B1
    - id: 3b-3
      content: |
        ③ 따라서 $\displaystyle\sum_{k=1}^{n}a_k=\sum_{k=1}^{m}\dfrac{(2k-1)(2k)}{2}+n=\dfrac{m(m+1)(4m-1)}{6}+n=\dfrac{n(n+2)(2n-1)}{24}+n$
      criteria:
      - 3.B2
    - id: 3b-4
      content: |
        ④ 경우 2. $n$이 홀수인 경우 $n=2m+1$이라 두자. 그러면 $1\le k\le m$인 자연수 $k$에 대해 $a_k=(1+2+\cdots+(n-2k+2))+1=\dfrac{(n-2k+2)(n-2k+3)}{2}+1$ 이고 $m+1\le k\le n$인 자연수 $k$에 대해 $a_k=1$이다.
      criteria:
      - 3.B3
    - id: 3b-5
      content: |
        ⑤ 따라서 $\displaystyle\sum_{k=1}^{n}a_k=\sum_{k=1}^{m}\dfrac{(2k)(2k+1)}{2}+n=\dfrac{m(m+1)(2m+1)}{3}+\dfrac{m(m+1)}{2}+n=\dfrac{m(m+1)(4m+5)}{6}+n$ 이고 이를 정리하면 $\dfrac{(n-1)(n+1)(2n+3)}{24}+n$이다.\n\n[보충: 홀수 $n=2m+1$의 개별 $a_k$는 $(n-2k+1)(n-2k+2)/2+1$이다. 예: $n=5$이면 $a_1=11$, $a_2=4$. ④ 줄의 원문 식은 인덱스가 어긋나 있으나 ⑤의 합과 최종 식은 옳다(검산 참조).]
      criteria:
      - 3.B4
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $n$의 홀짝으로 나누어 $k\le\lfloor n/2\rfloor$에서 삼각수$+1$, 그 밖에서 $a_k=1$임을 보였다.
      depends_on: []
      steps:
      - 3b-1
      implied_ok: false
    - id: 3.B1
      mark_type: B
      points: 2
      evidence: |
        $n=2m$에서 $a_k=\frac{(n-2k+1)(n-2k+2)}{2}+1$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.B2
      mark_type: B
      points: 3
      evidence: |
        $n$이 짝수일 때 $\sum a_k=\frac{n(n+2)(2n-1)}{24}+n$을 구했다.
      depends_on:
      - 3.B1
      steps:
      - 3b-3
    - id: 3.B3
      mark_type: B
      points: 2
      evidence: |
        $n=2m+1$에서 $a_k$를 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-4
    - id: 3.B4
      mark_type: B
      points: 3
      evidence: |
        $n$이 홀수일 때 $\sum a_k=\frac{(n-1)(n+1)(2n+3)}{24}+n$을 구했다.
      depends_on:
      - 3.B3
      steps:
      - 3b-5
