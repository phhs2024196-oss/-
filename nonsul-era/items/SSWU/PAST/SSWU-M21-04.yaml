intent: |
  수학에서 가장 기본이 되는 논리적인 사고력과 경우의 수, 이항정리, 수열의 일반항 및 수열의 합 도출 능력 등을 복합적으로 확인하기 위하여 출제하였다. (1)번 문제를 해결하려면 경우의 수에서 합의 법칙을 적절히 활용하고, 이항정리를 이용하면 된다. (2)번 문제는 주어진 도로망에 주어진 크기의 정사각형이 몇 개나 있는지를 세는 문제이다. 수학적 사고를 통해 규칙성을 도출할 수 있는지를 측정한다. (3)번은 (2)번의 해결을 통해 얻어진 규칙성을 이용해 수열을 정의하고 이 수열의 합을 구체적으로 구할 수 있는지의 여부를 확인한다.
