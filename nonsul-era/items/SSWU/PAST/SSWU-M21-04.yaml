key_idea: |
  A에서 C로 가는 최단 경로는 $(0,n),(1,n-1),\cdots,(n,0)$ 중 꼭 한 점을 지나므로 합의 법칙과 이항정리로 $\sum{}_n\mathrm{C}_k=2^n$. 한 변이 $k$인 정사각형의 수 $a_k$는 $n$의 홀짝에 따라 $\frac{(n-2k+1)(n-2k+2)}2+1$ 꼴이 되며 $k>\frac n2$이면 $a_k=1$.
