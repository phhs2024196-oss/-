stem: |
  자연수 $n$에 대하여 $\mathrm{A}(0,0)$, $\mathrm{B}(n,0)$, $\mathrm{C}(n,n)$, $\mathrm{D}(0,n)$을 꼭짓점으로 갖는 정사각형 ABCD의 네 변과 $1\le k\le n-1$을 만족하는 자연수 $k$에 대하여 점 $(0,k)$와 점 $(n,k)$를 연결하는 $x$축에 평행한 $(n-1)$개의 선분, 점 $(k,0)$과 점 $(k,n-k)$를 연결하는 $y$축에 평행한 $(n-1)$개의 선분을 추가하여 오른쪽 그림과 같은 도로망을 만들었다. (그림은 $n=6$인 경우의 예시임) [총25점]

  [그림 1: $n=6$인 경우. 정사각형 ABCD(A는 왼쪽 아래, B는 오른쪽 아래, C는 오른쪽 위, D는 왼쪽 위)의 내부에 가로선 $y=1,2,\cdots,5$가 왼쪽 변에서 오른쪽 변까지 이어져 있고, 세로선은 $x=k$ $(k=1,\cdots,5)$에서 $y=0$부터 $y=6-k$까지($x=1$은 높이 5, $x=2$는 4, $x=3$은 3, $x=4$는 2, $x=5$는 1) 그어져 계단 모양을 이룬다. 눈금은 $x$축·$y$축에 $1,\cdots,6$]
