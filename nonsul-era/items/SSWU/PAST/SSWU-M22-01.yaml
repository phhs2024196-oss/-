- id: '3'
  stem: |
    $\theta=\dfrac\pi8$일 때, 급수 $\displaystyle\sum_{n=1}^{20}\log_2\left(\left(\dfrac12\right)^{n+1}+\cos(2\theta n)\times N(n)\right)$의 합을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 5*log(3)/log(2) - 240
    equivalents:
    - $5\log_23-240$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 로그 안을 $\left(\frac12\right)^{n+2}\left(2+\sin\frac\pi2n\right)$로 묶으면 $-(n+2)+\log_2\left(2+\sin\frac\pi2n\right)$, 주기 4의 합을 5번 더한다.
    steps:
    - id: 3a
      content: $-250+5\log_23+10=5\log_23-240$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.M4
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g22.pdf p.68 예시답안 문제 1(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $N(x)=\left(\frac12\right)^{x+1}\times\sin(2\theta x)$에서 $\left(\frac12\right)^{x+1}+\cos(2\theta x)\times N(x)=\left(\frac12\right)^{x+1}+\cos(2\theta x)\times\left(\frac12\right)^{x+1}\times\sin(2\theta x)=\left(\frac12\right)^{x+1}\left(1+\frac12\sin(4\theta x)\right)=\left(\frac12\right)^{x+2}(2+\sin(4\theta x))$
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        따라서 $\log_2\left(\left(\frac12\right)^{x+1}+\cos(2\theta x)\times N(x)\right)=\log_2\left(\frac12\right)^{x+2}(2+\sin(4\theta x))=-(x+2)+\log_2(2+\sin(4\theta x))$
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $\theta=\frac\pi8$일 때 $2+\sin(4\theta x)=2+\sin\left(\frac\pi2x\right)$이므로 $\displaystyle\sum_{n=1}^{20}\left(-(n+2)+\log_2\left(2+\sin\left(\frac\pi2n\right)\right)\right)=-\frac{20\times21}{2}-2\times20+\sum_{n=1}^{20}\log_2\left(2+\sin\left(\frac\pi2n\right)\right)$
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        $2+\sin\left(\frac\pi2n\right)$은 $n$이 $1$부터 $1$씩 증가함에 따라 $3,2,1,2,3,2,1,2,\ldots$로 나타나므로 $\displaystyle\sum_{n=1}^{20}\log_2\left(2+\sin\left(\frac\pi2n\right)\right)=(\log_23+1+0+1)\times5=5\log_23+10$이다.
      criteria:
      - 3.M4
    - id: 3b-5
      content: |
        따라서 구하는 식의 값은 $5\log_23-240$이다.
      criteria:
      - 3.A1
