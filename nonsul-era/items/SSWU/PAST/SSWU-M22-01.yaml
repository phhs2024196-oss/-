    - id: 3.M4
      mark_type: M
      points: 2
      evidence: |
        $2+\sin\dfrac\pi2n$의 주기 $3,2,1,2$로 $5\log_23+10$을 구했다.
      steps:
      - 3b-4
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
