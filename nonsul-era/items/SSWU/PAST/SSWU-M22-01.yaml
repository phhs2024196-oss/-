      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g22.pdf p.68 예시답안 문제 1(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\theta=\frac\pi4$일 때, $N(x)=\left(\frac12\right)^{x+1}\times\sin\left(\frac\pi2x\right)$
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\sin\left(\frac\pi2x\right)$는 $x$가 $1$부터 $1$씩 증가함에 따라 $1,0,-1,0,1,0,\ldots$로 나타난다
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        따라서 $\displaystyle\sum_{n=1}^{\infty}\lvert N(n)\rvert=\left(\frac12\right)^2+0+\left(\frac12\right)^4+0+\left(\frac12\right)^6+\cdots$
      criteria:
      - 2.M3
    - id: 2b-4
      content: |
        주어진 급수는 첫째항이 $\frac14$이고 공비가 $\frac14$인 무한등비급수이다.
      criteria:
      - 2.M4
    - id: 2b-5
      content: |
        $\displaystyle\sum_{n=1}^{\infty}\lvert N(n)\rvert=\sum_{n=1}^{\infty}\frac14\left(\frac14\right)^{n-1}=\frac{\frac14}{1-\frac14}=\frac13$
      criteria:
      - 2.A1
