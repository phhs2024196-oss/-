    method_no: 1
    key_idea: $N(x)=\left(\frac12\right)^{x+1}\sin(2\theta x)$로 바꾸고 $\lim\frac{\sin2\theta x}{x}=2\theta$를 쓴다.
    steps:
    - id: 1a
      content: $\frac12\times2\theta=\theta$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.M4
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g22.pdf p.67 예시답안 문제 1(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $N(x)=\left(\frac12\right)^x\times\sin(\theta x)\times\sin\left(\frac\pi2-\theta x\right)=\left(\frac12\right)^x\times\sin(\theta x)\times\cos(\theta x)=\left(\frac12\right)^{x+1}\times\sin(2\theta x)$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to0}\frac{N(x)}{x}=\frac12\times\lim_{x\to0}\left(\frac12\right)^x\times\lim_{x\to0}\frac{\sin2\theta x}{x}=\frac12\times\lim_{x\to0}\frac{\sin2\theta x}{x}$
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $t=2\theta x$로 놓으면 $x\to0$일 때 $t\to0$이므로
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        $\displaystyle\lim_{x\to0}\frac{\sin2\theta x}{x}=\lim_{x\to0}\left(2\theta\times\frac{\sin2\theta x}{2\theta x}\right)=2\theta\times\lim_{t\to0}\frac{\sin t}{t}=2\theta$
      criteria:
      - 1.M4
    - id: 1b-5
      content: |
        $\displaystyle\lim_{x\to0}\frac{N(x)}{x}=\frac12\times2\theta=\theta$
      criteria:
      - 1.A1
