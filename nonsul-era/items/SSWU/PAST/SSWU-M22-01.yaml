intent: |
  삼각함수와 로그의 성질을 이해하고 극한과 수열의 합을 활용하는 문제해결 능력을 평가한다. 주어진 조건에 따라 삼각함수를 포함한 수열에서 나타나는 규칙성을 파악하여 적절한 수열의 합을 적용하는 능력과, 문제를 해결하는 단계를 논리적으로 명확하게 서술할 수 있는지를 평가한다.
key_idea: $N(x)=\left(\frac12\right)^{x+1}\sin(2\theta x)$로 정리한다. (1) $\lim_{x\to0}\frac{N(x)}{x}=\theta$, (2) $\theta=\frac\pi4$이면 홀수 항만 남는 공비 $\frac14$인 등비급수, (3) 로그 안을 $\left(\frac12\right)^{n+2}(2+\sin(4\theta n))$로 묶어 주기 4인 합으로 계산한다.
stuck: (3)에서 $\left(\frac12\right)^{n+1}+\cos(2\theta n)N(n)$을 배각공식으로 $\left(\frac12\right)^{n+2}(2+\sin4\theta n)$로 묶는 단계
