- id: '3'
  stem: |
    직선 $y=x$와 평행한 직선 중 곡선 $y=f(x)$와 접하는 두 직선과, 직선 $y=-x$와 평행한 직선 중 곡선 $y=f(x)$와 접하는 두 직선으로 둘러싸인 직사각형의 넓이를 구하시오.
  points: 10
  depends_on:
  - '1'
  answer:
    kind: expression
    value: 40*sqrt(15)/9
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 기울기 $\pm1$인 접선은 $y=x\pm\frac{10\sqrt{15}}{9}$, $y=-x\pm2$이고 두 쌍의 거리의 곱이 넓이.
    steps:
    - id: 3a
      content: $\frac{40\sqrt{15}}{9}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.M4
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g22.pdf p.70 예시답안 문제 2(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $f^{\prime}(x)=3x^2-4$로부터 $f^{\prime}(x)=1$을 만족하는 값은 $x=\pm\sqrt{\frac53}$이고 $f^{\prime}(x)=-1$을 만족하는 값은 $x=\pm1$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        따라서 기울기가 $1$인 직선 중 이 곡선에 접하는 직선의 방정식은 $y=x\pm\frac{10\sqrt{15}}{9}$이고,
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        이 두 직선의 $x$절편 사이의 거리에 삼각함수를 적용하면 직사각형의 두 변 중 기울기가 $-1$인 직선 위에 놓여있는 변의 길이는 $\left(\frac{10\sqrt{15}}{9}-\frac{-10\sqrt{15}}{9}\right)\times\sin\left(\frac\pi4\right)$이다.
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        같은 방법으로 기울기가 $-1$인 직선 중 이 곡선에 접하는 직선의 방정식은 $y=-x\pm2$이고, 이로부터 직사각형의 두 변 중 기울기가 $1$인 직선 위에 놓여있는 변의 길이는 $(2-(-2))\times\sin\left(\frac\pi4\right)$이다.
      criteria:
      - 3.M4
    - id: 3b-5
      content: |
        따라서 주어진 직사각형의 넓이는 $2\times2\sin\left(\frac\pi4\right)\times2\times\frac{10\sqrt{15}}{9}\sin\left(\frac\pi4\right)=\frac{40\sqrt{15}}{9}$이다. (원문 해설에 삼각형의 넓이를 이용하거나 원점에서 네 접선까지의 거리를 계산해도 된다는 주석이 있다.)
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
