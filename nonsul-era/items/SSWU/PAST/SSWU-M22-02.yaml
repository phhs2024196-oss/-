    - id: 3.M2
      mark_type: M
      points: 2
      evidence: |
        기울기 $1$인 접선 $y=x\pm\frac{10\sqrt{15}}{9}$를 구했다.
      steps:
      - 3b-2
    - id: 3.M3
      mark_type: M
      points: 2
      evidence: |
        이 두 접선 사이의 직사각형 한 변의 길이를 구했다.
      steps:
      - 3b-3
    - id: 3.M4
      mark_type: M
      points: 2
      evidence: |
        기울기 $-1$인 접선 $y=-x\pm2$와 다른 변의 길이를 구했다.
      steps:
      - 3b-4
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        넓이 $\dfrac{40\sqrt{15}}{9}$를 구했다.
      depends_on:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.M4
      steps:
      - 3b-5
