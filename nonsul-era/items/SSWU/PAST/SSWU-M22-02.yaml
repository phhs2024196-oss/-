      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        교점 조건을 $g(x)=x^3-2x^2-4x=k$의 실근 조건으로 바꾸었다.
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $g^{\prime}(x)=0$에서 극값 위치 $x=-\frac23$, $2$를 구했다.
      steps:
      - 2b-2
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        $k=\dfrac{40}{27}$, $-8$을 구했다.
      steps:
      - 2b-3
    - id: 2.M3
      mark_type: M
      points: 2
      evidence: |
        $k=-8$에서 교점 $x=-2$, $2$와 위아래 관계를 파악했다.
      steps:
      - 2b-4
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        넓이 $\dfrac{64}{3}$을 구했다.
      depends_on:
      - 2.M1
      - 2.M2
      - 2.M3
      steps:
      - 2b-5
