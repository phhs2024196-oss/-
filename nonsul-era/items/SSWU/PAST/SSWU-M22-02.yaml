stimuli: []
stem: |
  주어진 $3$차 함수 $f(x)=x^3+ax^2+bx+c$는 다음 조건을 만족한다.

  가. 모든 실수 $x$에 대해 $f(-x)=-f(x)$

  나. $\displaystyle\lim_{x\to2}\dfrac{f(x)}{x-2}=8$

  질문에 답하시오. [총25점]
subparts:
- id: '1'
  stem: |
    $f(x)$를 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: x**3 - 4*x
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 기함수이므로 $a=c=0$, $f(2)=0$에서 $b=-4$.
    steps:
    - id: 1a
      content: $f(x)=x^3-4x$
      criteria:
      - 1.M1
      - 1.B1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g22.pdf p.69 예시답안 문제 2(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        모든 실수 $x$에 대하여 $f(-x)=-f(x)$가 성립하므로
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $(-x)^3+a(-x)^2+b(-x)+c=-(x^3+ax^2+bx+c)$로부터 $2ax^2+2c=0$이고
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        이로부터 $a=0$, $c=0$이다.
      criteria:
      - 1.B1
    - id: 1b-4
      content: |
        $\displaystyle\lim_{x\to2}\frac{f(x)}{x-2}=8$로부터 $f(2)=0$이 됨을 알 수 있고 이로부터 $8+2b=0$이므로 $b=-4$이다.
      criteria:
      - 1.M2
    - id: 1b-5
      content: |
        따라서 $f(x)=x^3-4x$가 된다.
      criteria:
      - 1.A1
