intent: |
  함수의 성질과 극한의 정의, 접선의 방정식과 함수의 극대·극소, 두 곡선 사이에 놓인 영역의 넓이 등 수학, 수학Ⅰ, 수학Ⅱ에서 학습한 기본 내용을 활용하여 제시된 문제를 논리적으로 해결하는 능력을 측정한다. 또한 두 직선이 서로 수직인 조건을 이해하고 삼각함수 등을 활용하여 직사각형의 넓이를 구할 수 있는지도 평가한다.
key_idea: 기함수 조건으로 $a=c=0$, 극한 조건으로 $b=-4$이므로 $f(x)=x^3-4x$. $f(x)=2x^2+k\iff g(x)=x^3-2x^2-4x=k$이므로 극값 $\frac{40}{27}$, $-8$에서 두 점에서 만난다. 접선은 기울기 $\pm1$인 것을 구해 직사각형의 두 변 길이를 곱한다.
stuck: (2)에서 두 곡선의 교점 조건을 3차 곡선 $y=g(x)$와 수평선 $y=k$의 교점 조건으로 바꾸는 단계
