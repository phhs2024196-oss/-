- id: '2'
  stem: |
    $y=f(x)$와 $y=2x^2+k$가 서로 다른 두 점에서 만날 $k$의 조건을 찾고, 이 중 $k<0$인 경우에 이 두 곡선으로 둘러싸인 영역의 넓이를 구하시오.
  points: 10
  depends_on:
  - '1'
  answer:
    kind: value
    value: k = 40/27, -8; area = 64/3
    equivalents:
    - $k=\frac{40}{27}$ 또는 $k=-8$, 넓이 $\frac{64}{3}$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(x)=x^3-2x^2-4x=k$의 서로 다른 실근이 2개이려면 $k$가 극값. $k=-8$에서 $x=-2,2$.
    steps:
    - id: 2a
      content: $\int_{-2}^{2}\left(-2x^2+8\right)dx=\frac{64}{3}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.B1
      - 2.M3
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g22.pdf p.69 예시답안 문제 2(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $y=f(x)$와 $y=2x^2+k$가 서로 다른 두 점에서 만나려면 $x^3-4x=2x^2+k$가 두 실근을 가지면 된다. 따라서 $3$차 곡선 $y=x^3-2x^2-4x$의 그래프와 $x$축에 평행한 직선 $y=k$가 서로 다른 두 점에서 만나는 $k$의 값을 구하면 된다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $g(x)=x^3-2x^2-4x$라 두면 $g^{\prime}(x)=3x^2-4x-4=(3x+2)(x-2)=0$으로부터 $x=-\frac23$ 또는 $x=2$에서 극값을 갖고
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $g\left(-\frac23\right)=\frac{40}{27}$, $g(2)=-8$이므로 $k=\frac{40}{27}$ 또는 $k=-8$이면 서로 다른 두 점에서 만난다.
      criteria:
      - 2.B1
    - id: 2b-4
      content: |
        $k=-8$인 경우 두 곡선 $y=f(x)$와 $y=2x^2-8$은 $x=-2$와 $x=2$에서 만나고 그래프는 [그림: $-2\le x\le2$에서 $y=f(x)$가 $y=2x^2-8$ 위쪽]이 되므로 (보충: $f(x)-(2x^2-8)=(x-2)^2(x+2)\ge0$)
      criteria:
      - 2.M3
    - id: 2b-5
      content: |
        두 곡선으로 둘러싸인 영역의 넓이는 $\displaystyle\int_{-2}^{2}\left(x^3-4x-(2x^2-8)\right)dx=\frac{64}{3}$이다.
      criteria:
      - 2.A1
  rubric:
