intent: |
  문제의 조건으로부터 정삼각형의 한 변의 길이를 구하고, 규칙성을 발견하여 점화식을 찾아가는 논리력을 측정한다. 그리고 등비급수의 합을 구하고, 이 결과를 해석하여 도함수의 성질 또는 삼각함수의 증감 등을 활용하여 문제에 제시된 명제를 증명할 수 있는지를 평가한다.
key_idea: $\mathrm{OO}_2=a-\frac{\sqrt3}{2}r_1=\frac{r_1}{2\tan(\theta/2)}$에서 $r_1=\frac{2a\tan(\theta/2)}{\sqrt3\tan(\theta/2)+1}$이고 $r_{n+1}=\frac{r_n}{\sqrt3\tan(\theta/2)+1}$이다. 등비급수의 합 $\sum r_n=\frac{2a}{\sqrt3}$, 넓이의 합 $\frac{a^2}{\sqrt3+2\cot(\theta/2)}<\frac{a^2}{\sqrt3}$.
stuck: (1)에서 $\mathrm{OO}_2$를 $a-\frac{\sqrt3}{2}r_1$과 $\frac{r_1}{2\tan(\theta/2)}$ 두 가지로 나타내어 $r_1$을 구하는 단계
