stem: |
  다음 질문에 답하시오. [총25점]

  오른쪽 그림과 같이 반지름이 $a$이고 중심각이 $\theta$인 부채꼴 $\mathrm{POQ}$에 내접하는 정삼각형 $\triangle\mathrm{O_1P_1Q_1}$의 꼭지점 중 호 $\mathrm{PQ}$의 중점을 $\mathrm{O_1}$, 선분 $\mathrm{OP}$위의 점을 $\mathrm{P_1}$, 선분 $\mathrm{OQ}$위의 점을 $\mathrm{Q_1}$이라 하자. 그리고 삼각형 $\triangle\mathrm{OP_1Q_1}$에 내접하는 정삼각형 $\triangle\mathrm{O_2P_2Q_2}$의 꼭지점 중 선분 $\mathrm{P_1Q_1}$의 중점을 $\mathrm{O_2}$, 선분 $\mathrm{OP_1}$위의 점을 $\mathrm{P_2}$, 선분 $\mathrm{OQ_1}$위의 점을 $\mathrm{Q_2}$라 하자. 이러한 작업은 무한히 반복할 수 있다.
  (단, $a>0$이고 $0<\theta<\pi$이다).

  [그림 1: 점 $\mathrm{O}$를 꼭짓점으로 하고 반직선 $\mathrm{OP}$가 수평(오른쪽), $\mathrm{OQ}$가 위쪽으로 각 $\theta$를 이루는 부채꼴 $\mathrm{POQ}$. 호 $\mathrm{PQ}$의 중점 $\mathrm{O_1}$, 선분 $\mathrm{OP}$ 위의 $\mathrm{P_1}$, 선분 $\mathrm{OQ}$ 위의 $\mathrm{Q_1}$을 꼭짓점으로 하는 정삼각형 $\mathrm{O_1P_1Q_1}$(선분 $\mathrm{Q_1O_1}$이 수평). 그 안쪽 삼각형 $\mathrm{OP_1Q_1}$에 내접하는 정삼각형 $\mathrm{O_2P_2Q_2}$($\mathrm{O_2}$는 $\mathrm{P_1Q_1}$의 중점, $\mathrm{P_2}$는 $\mathrm{OP_1}$ 위, $\mathrm{Q_2}$는 $\mathrm{OQ_1}$ 위)가 그려져 있고, 점 $\mathrm{O}$ 쪽으로 같은 작업이 계속됨을 점선(⋯)으로 표시. 각 $\theta$가 $\mathrm{O}$에 표시되어 있다.]
subparts:
- id: '1'
  stem: |
    자연수 $n$에 대하여 정삼각형 $\triangle\mathrm{O}_n\mathrm{P}_n\mathrm{Q}_n$의 한 변의 길이를 $r_n$이라 할 때, $r_1$, $r_2$의 값을 구하시오.
  points: 7
  depends_on: []
  answer:
    kind: value
    value: r1 = 2*a*tan(theta/2)/(sqrt(3)*tan(theta/2)+1); r2 = 2*a*tan(theta/2)/(sqrt(3)*tan(theta/2)+1)**2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{OO}_2=a-\frac{\sqrt3}{2}r_1=\frac{r_1}{2\tan(\theta/2)}$에서 $r_1$, 같은 논의를 $a\to\mathrm{OO}_2$로 반복해 $r_2=\frac{r_1}{\sqrt3\tan(\theta/2)+1}$.
    steps:
    - id: 1a
      content: $r_1=\frac{2a\tan\frac\theta2}{\sqrt3\tan\frac\theta2+1}$, $r_2=\frac{r_1}{\sqrt3\tan\frac\theta2+1}$
      criteria:
      - 1.M1
      - 1.M2
      - 1.B1
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g22.pdf p.71 예시답안 문제 3(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직각삼각형 $\triangle\mathrm{OO_2P_1}$에서 선분 $\mathrm{O_2P_1}$의 길이는 $\frac{r_1}{2}$, 각 $\angle\mathrm{P_1OO_2}$의 크기는 $\frac\theta2$이고
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        선분 $\mathrm{OO_2}$의 길이는 $a-r_1\sin\frac\pi3=a-\frac{\sqrt3}{2}r_1=\frac{r_1}{2\tan\left(\frac\theta2\right)}$이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        이로부터 $r_1=\dfrac{2a\tan\left(\frac\theta2\right)}{\sqrt3\tan\left(\frac\theta2\right)+1}$이다.
      criteria:
      - 1.B1
    - id: 1b-4
      content: |
        $\mathrm{OO_2}$를 반지름으로 갖는 부채꼴에 위의 논의를 반복하면 $r_2=\dfrac{2\left(a-\frac{\sqrt3}{2}r_1\right)\tan\left(\frac\theta2\right)}{\sqrt3\tan\left(\frac\theta2\right)+1}=\dfrac{2a\tan\left(\frac\theta2\right)}{\sqrt3\tan\left(\frac\theta2\right)+1}\times\dfrac{1}{\sqrt3\tan\left(\frac\theta2\right)+1}=r_1\times\dfrac{1}{\sqrt3\tan\left(\frac\theta2\right)+1}$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        직각삼각형 $\triangle\mathrm{OO_2P_1}$에서 $\mathrm{O_2P_1}=\dfrac{r_1}{2}$, $\angle\mathrm{P_1OO_2}=\dfrac\theta2$를 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 1
      evidence: |
        $\mathrm{OO_2}=a-\dfrac{\sqrt3}{2}r_1=\dfrac{r_1}{2\tan(\theta/2)}$를 세웠다.
      steps:
      - 1b-2
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
        $r_1$을 구했다.
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: |
        $r_2$를 구했다.
      depends_on:
      - 1.M1
      - 1.M2
      steps:
      - 1b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    급수 $\displaystyle\sum_{n=1}^{\infty}r_n$의 합은 각 $\theta$와 상관없이 일정함을 보이시오.
  points: 8
  depends_on:
  - '1'
  answer:
    kind: proof
    value: 2*a/sqrt(3)
    equivalents:
    - 합은 $\frac{2a}{\sqrt3}$ ($\theta$와 무관)
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 초항 $r_1$, 공비 $q=\frac{1}{\sqrt3\tan(\theta/2)+1}\in(0,1)$인 등비급수이고 합은 $\frac{r_1}{1-q}=\frac{2a}{\sqrt3}$.
    steps:
    - id: 2a
      content: 합 $\frac{2a}{\sqrt3}$는 $\theta$를 포함하지 않는다
      criteria:
      - 2.B1
      - 2.R1
      - 2.A1
      - 2.R2
  - id: S2-B
    audience: B
    source_flow: g22.pdf p.71 예시답안 문제 3(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        급수 $\displaystyle\sum_{n=1}^{\infty}r_n$은 초항이 $r_1=\dfrac{2a\tan\left(\frac\theta2\right)}{\sqrt3\tan\left(\frac\theta2\right)+1}$이고
      criteria:
      - 2.B1
    - id: 2b-2
      content: |
        공비가 $\dfrac{1}{\sqrt3\tan\left(\frac\theta2\right)+1}$이고 $0<\dfrac{1}{\sqrt3\tan\left(\frac\theta2\right)+1}<1$이므로
      criteria:
      - 2.R1
    - id: 2b-3
      content: |
        이 급수의 합은 $\dfrac{2a}{\sqrt3}$이다.
      criteria:
      - 2.A1
    - id: 2b-4
      content: |
        따라서 각 $\theta$와 상관없이 일정하다. (다른 풀이: 자연수 $n$에 대하여 선분 $\mathrm{O}_n\mathrm{O}_{n+1}$의 길이는 $r_n\sin\left(\frac\pi3\right)=\frac{\sqrt3}{2}r_n$이고 이의 합은 선분 $\mathrm{OO_1}$의 길이가 된다. 따라서 $a=\displaystyle\sum_{n=1}^{\infty}\frac{\sqrt3}{2}r_n=\frac{\sqrt3}{2}\sum_{n=1}^{\infty}r_n$이고 이로부터 $\displaystyle\sum_{n=1}^{\infty}r_n=\frac{2\sqrt3a}{3}$이다.)
      criteria:
      - 2.R2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        초항 $r_1$을 적었다.
      steps:
      - 2b-1
    - id: 2.R1
      mark_type: R
      points: 2
      evidence: |
        공비와 $0<$공비$<1$(수렴 조건)을 보였다.
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        합 $\dfrac{2a}{\sqrt3}$를 구했다.
      steps:
      - 2b-3
    - id: 2.R2
      mark_type: R
      points: 2
      evidence: |
        합이 $\theta$를 포함하지 않으므로 일정하다고 결론지었다.
      steps:
      - 2b-4
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    자연수 $n$에 대하여 정삼각형 $\triangle\mathrm{O}_n\mathrm{P}_n\mathrm{Q}_n$의 넓이 $A_n$의 합 $\displaystyle\sum_{n=1}^{\infty}A_n$을 구하고 이 값은 $\dfrac{a^2}{\sqrt3}$보다 작음을 보이시오.
  points: 10
  depends_on:
  - '1'
  - '2'
  answer:
    kind: expression
    value: a**2*tan(theta/2)/(sqrt(3)*tan(theta/2)+2)
    equivalents:
    - $\frac{a^2}{\sqrt3+2\cot(\theta/2)}$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $A_n=\frac{\sqrt3}{4}r_n^2$은 공비 $q^2$인 등비수열이므로 합 $=\frac{a^2}{\sqrt3+2\cot(\theta/2)}$, $\cot\frac\theta2>0$이므로 $<\frac{a^2}{\sqrt3}$.
    steps:
    - id: 3a
      content: $\sum A_n=\frac{a^2}{\sqrt3+2\cot\frac\theta2}<\frac{a^2}{\sqrt3}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
      - 3.R1
      - 3.R2
  - id: S3-B
    audience: B
    source_flow: g22.pdf p.72 예시답안 문제 3(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        정삼각형 $\triangle\mathrm{O}_n\mathrm{P}_n\mathrm{Q}_n$의 넓이 $A_n$은 $\frac12r_n^2\sin\left(\frac\pi3\right)=\frac{\sqrt3}{4}r_n^2$이므로
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        급수 $\displaystyle\sum_{n=1}^{\infty}A_n$은 초항이 $\dfrac{\sqrt3a^2\tan^2\left(\frac\theta2\right)}{\left(\sqrt3\tan\left(\frac\theta2\right)+1\right)^2}$이고 공비가 $\dfrac{1}{\left(\sqrt3\tan\left(\frac\theta2\right)+1\right)^2}$인 등비급수이고
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        이의 합은 $\dfrac{\dfrac{\sqrt3a^2\tan^2\left(\frac\theta2\right)}{\left(\sqrt3\tan\left(\frac\theta2\right)+1\right)^2}}{1-\dfrac{1}{\left(\sqrt3\tan\left(\frac\theta2\right)+1\right)^2}}=\dfrac{a^2\tan\left(\frac\theta2\right)}{\sqrt3\tan\left(\frac\theta2\right)+2}=\dfrac{a^2}{\sqrt3+2\cot\left(\frac\theta2\right)}$이다.
      criteria:
      - 3.A1
    - id: 3b-4
      content: |
        $0<\theta<\pi$에서 $\cot\left(\frac\theta2\right)>0$이므로
      criteria:
      - 3.R1
    - id: 3b-5
      content: |
        $\dfrac{a^2}{\sqrt3+2\cot\left(\frac\theta2\right)}<\dfrac{a^2}{\sqrt3}$이다.
      criteria:
      - 3.R2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
