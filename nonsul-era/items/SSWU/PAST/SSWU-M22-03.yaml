      points: 2
      evidence: |
        $A_n=\dfrac{\sqrt3}{4}r_n^2$을 구했다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 2
      evidence: |
        $\sum A_n$이 초항과 공비 $\dfrac{1}{\left(\sqrt3\tan\frac\theta2+1\right)^2}$인 등비급수임을 보였다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        합 $\dfrac{a^2}{\sqrt3+2\cot\frac\theta2}$를 구했다.
      depends_on:
