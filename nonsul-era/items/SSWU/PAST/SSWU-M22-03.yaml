      - 3.M2
      steps:
      - 3b-3
    - id: 3.R1
      mark_type: R
      points: 2
      evidence: |
        $0<\theta<\pi$에서 $\cot\dfrac\theta2>0$임을 언급했다.
      steps:
      - 3b-4
    - id: 3.R2
      mark_type: R
      points: 2
      evidence: |
        $\dfrac{a^2}{\sqrt3}$보다 작음을 결론지었다.
      steps:
      - 3b-5
