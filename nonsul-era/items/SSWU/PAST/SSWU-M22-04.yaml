  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $k\log_n2=m\iff n^m=2^k$이므로 $n=2^l$, $l$은 $k$의 약수. $N_k=$ $k$의 약수의 개수.
    steps:
    - id: 2a
      content: $N_1,\ldots,N_{10}=1,2,2,3,2,4,2,4,3,4$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g22.pdf p.73 예시답안 문제 4(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        자연수 $m$에 대하여 $k\log_n2=m$이라면 $n^m=2^k$가 성립한다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서 $n$은 $2^k$의 약수이므로 $n=2^l$형태이고 $(2^l)^m=2^k$로부터 $l$은 $k$의 약수이어야 한다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        그러므로 $N_k$는 $k$의 약수의 개수와 같고
      criteria:
      - 2.M3
    - id: 2b-4
      content: |
        이로부터 $N_1=1$, $N_2=2$, $N_3=2$, $N_4=3$, $N_5=2$, $N_6=4$, $N_7=2$, $N_8=4$, $N_9=3$, $N_{10}=4$이다.
      criteria:
      - 2.A1
