    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $N_{2^{k+1}}=k+2$이므로 부분분수로 쪼개어 망원급수로 계산.
    steps:
    - id: 3a
      content: $\frac12\left(1+\frac12\right)=\frac34$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g22.pdf p.73 예시답안 문제 4(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2)의 논의로부터 $N_{2^{k+1}}$는 $2^{k+1}$의 약수의 개수이므로 $k+2$이다. 따라서
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\displaystyle\sum_{k=1}^{\infty}\frac{1}{k\cdot N_{2^{k+1}}}=\sum_{k=1}^{\infty}\frac{1}{k\cdot(k+2)}$
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $=\displaystyle\sum_{k=1}^{\infty}\frac12\left(\frac1k-\frac1{k+2}\right)=\lim_{n\to\infty}\sum_{k=1}^{n}\frac12\left(\frac1k-\frac1{k+2}\right)$
      criteria:
      - 3.M2
    - id: 3b-4
      content: |
        $=\displaystyle\lim_{n\to\infty}\frac12\left(1+\frac12-\frac1{n+1}-\frac1{n+2}\right)=\frac34$이다.
      criteria:
      - 3.M3
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $N_{2^{k+1}}=k+2$를 구했다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 2
      evidence: |
        $\dfrac{1}{k(k+2)}=\dfrac12\left(\dfrac1k-\dfrac1{k+2}\right)$로 분해했다.
      steps:
      - 3b-2
      - 3b-3
    - id: 3.M3
      mark_type: M
      points: 2
      evidence: |
        부분합을 망원급수로 계산했다.
      steps:
      - 3b-4
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        극한 $\dfrac34$를 구했다.
      depends_on:
      - 3.M1
      - 3.M2
      - 3.M3
      steps:
      - 3b-4
