intent: |
  로그함수의 정의와 성질, 경우의 수 등 기초적인 수학 지식을 활용하여 문제에서 요구하는 원소의 개수를 구하고 규칙성을 발견하는 능력을 측정한다. 그리고 발견한 규칙성을 활용하여 주어진 급수의 합을 구할 수 있는지를 평가한다.
key_idea: (1) $A_n$을 $n=1,\ldots,10$마다 직접 구해 합집합은 $\{0,1,2,3\}$. (2) $k\log_n2=m\iff n^m=2^k$이므로 $n=2^l$ ($l\mid k$)이고 $N_k$는 $k$의 약수의 개수. (3) $N_{2^{k+1}}=k+2$이므로 $\sum\frac{1}{k(k+2)}=\frac34$.
stuck: (2)에서 $k\log_n2$가 자연수라는 조건을 $n^m=2^k$로 바꾸어 $N_k$를 약수의 개수로 연결하는 단계
