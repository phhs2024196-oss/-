  - $k\log_n2=m\Rightarrow n^m=2^k\Rightarrow n=2^l$, $l\mid k$
  - $\frac{1}{k(k+2)}=\frac12\left(\frac1k-\frac1{k+2}\right)$
  conditions:
  - $n\in\{x\mid1\le x\le10\text{인 자연수}\}$
  - $n\ge2$인 자연수
  - $1\le k\le10$
