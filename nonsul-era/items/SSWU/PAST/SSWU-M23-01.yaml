stimuli: []
stem: |-
  $f(0)=-12$인 다항함수 $f(x)$에 대하여 최고차항의 계수가 $1$인 사차함수 $g(x)$를

  $$g(x)=\int_a^x(x^2-tx)f(t)dt\quad(\text{단, }a\text{는 상수})$$

  라 할 때, 다음 물음에 답하시오. [총25점]
subparts:
- id: '1'
  stem: '[10점] $f(x)$와 $g(x)$를 구하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: f=6*x-12; g=x*(x-a)**2*(x+2*a-6)
    equivalents:
    - $f(x)=6x-12$, $g(x)=x(x-a)^2(x+2a-6)$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 최고차항 비교로 $f(x)=6x-12$, 대입해 $g(x)=x(x-a)^2(x+2a-6)$.
    steps:
    - id: 1a
      content: $f(x)=6x-12$, $g(x)=x(x-a)^2(x+2a-6)$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g23.pdf p.72 채점기준 문제 1(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(x)$의 최고차항을 $px^n$이라고 하자. 그러면, $g(x)=\displaystyle\int_a^x(x^2-tx)(pt^n+\cdots)dt$이므로 $g(x)$의 최고차항을 보면 $\left(\dfrac p{n+1}-\dfrac p{n+2}\right)x^{n+3}$이 된다. 한편, $g(x)$의 최고차항은 문제에서 $x^4$이라고 했으므로 이 둘을 비교해보면 $n=1$이고 $p=6$이 되므로, $f(x)=6x-12$가 된다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f(x)=6x-12$를 $g(x)$의 식에 대입하면 $g(x)=x\displaystyle\int_a^x(x-t)(6t-12)dt=x\int_a^x(-6t^2+12t+6xt-12x)dt=x\left[-2t^3+6t^2+3xt^2-12xt\right]_a^x=x(-2x^3+2a^3)+x(6x^2-6a^2)+3x^2(x^2-a^2)-12x^2(x-a)=x(x-a)(-2x^2-2ax-2a^2+6(x+a)+3x(x+a)-12x)=x(x-a)(x^2+(a-6)x-2a^2+6a)=x(x-a)^2(x+2a-6)$
      criteria:
      - 1.M2
      - 1.A1
  # 채점기준 미공개(등급제 1~7등급, 단계별 배점 없음) — 단계별 추정
