- id: '2'
  stem: '[7점] 모든 실수 $x$에 대해 $\lvert g(x)\rvert=g(x)$가 성립할 때, 곡선 $y=g(x)$와 $x$축으로 둘러싸인 부분의 넓이를 구하시오.'
  points: 7
  depends_on: []
  answer:
    kind: value
    value: 81/10
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $g(x)\ge0$이려면 $a=3$, $g(x)=x^2(x-3)^2$, 넓이 $\int_0^3x^2(x-3)^2dx$.
    steps:
    - id: 2a
      content: $a=3$, $\int_0^3x^2(x-3)^2dx=\frac{81}{10}$
      criteria:
      - 2.M1
      - 2.B1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g23.pdf p.73 채점기준 문제 1(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: '$g(x)=x(x-a)^2(x+2a-6)$이기 때문에 모든 실수 $x$에 대하여 $\lvert g(x)\rvert=g(x)$가 성립하려면 아래와 같은 그래프가 그려져야만 한다. [그림 4: $y=x^2(x-3)^2$의 그래프. 원점 O와 $(3,0)$에서 $x$축에 접하고 그 사이에서 위로 볼록한 사차함수]'
      criteria:
      - 2.M1
    - id: 2b-2
      content: 따라서, $2a-6=0$ 즉, $a=3$이 되고, $g(x)=x^2(x-3)^2$이 된다.
      criteria:
      - 2.B1
    - id: 2b-3
      content: 그래프의 개형을 통해 구하고자 하는 넓이는 $\displaystyle\int_0^3x^2(x-3)^2dx$이다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: 이를 계산하면 $\displaystyle\int_0^3x^2(x-3)^2dx=\int_0^3(x^4-6x^3+9x^2)dx=\left[\dfrac{x^5}5-\dfrac{3x^4}2+3x^3\right]_0^3=\dfrac{81}{10}$이 된다.
      criteria:
      - 2.A1
