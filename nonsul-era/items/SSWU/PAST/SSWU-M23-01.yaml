- id: '3'
  stem: '[8점] 함수 $y=\lvert g(x)\rvert$가 미분가능하지 않은 점이 $1$개 이하가 되도록 하는 $a$의 값을 모두 구하시오.'
  points: 8
  depends_on: []
  answer:
    kind: value
    value: 0, 2, 3
    equivalents:
    - $a=0$ 또는 $a=2$ 또는 $a=3$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 영점 $0,a,6-2a$의 중복도를 보아 단순근이 1개 이하이려면 $a=0,2,3$.
    steps:
    - id: 3a
      content: $a=0$, $a=2$, $a=3$
      criteria:
      - 3.M1
      - 3.M2
      - 3.B1
      - 3.B2
      - 3.B3
  - id: S3-B
    audience: B
    source_flow: g23.pdf p.73 채점기준 문제 1(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: $g(x)=x(x-a)^2(x+2a-6)$이므로 $g(x)=0$의 해는 $x=0,a,-2a+6$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: $y=\lvert g(x)\rvert$가 미분가능하지 않은 점이 $0$개, $1$개인 경우로 나누어서 생각하자.
      criteria:
      - 3.M2
    - id: 3b-3
      content: $y=\lvert g(x)\rvert$가 미분가능하지 않은 점이 $1$개라면, 삼중근을 가져야 한다. 즉, $a=0$이거나 $a=-2a+6$을 만족해야한다. 따라서, $a=0$ 또는 $a=2$이다.
      criteria:
      - 3.B1
      - 3.B2
    - id: 3b-4
      content: 미분가능하지 않은 점이 $0$개이기 위해서는 〈문제 1〉(2)의 경우에 해당되므로 이 경우에는 $a=3$이 된다.
      criteria:
      - 3.B3
