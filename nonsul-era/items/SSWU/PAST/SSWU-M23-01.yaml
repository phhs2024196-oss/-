key_idea: $f$의 최고차항 비교로 $f(x)=6x-12$, $g(x)=x(x-a)^2(x+2a-6)$. $\lvert g\rvert=g$이면 $a=3$, $\lvert g\rvert$는 차수 1인(단순) 영점에서만 미분불가능.
stuck: $g(x)$를 $x(x-a)^2(x+2a-6)$로 인수분해한 뒤 단순근 개수로 $\lvert g\rvert$의 미분불가능한 점을 세는 단계
