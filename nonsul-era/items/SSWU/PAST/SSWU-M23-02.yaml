    - id: 2b-2
      content: $y=2^{-x}$와 $y=-x+n$의 교점의 $y$좌표는 $n-b_n$인데, 이것과 $y=2^{-x}$가 $y$축과 만나는 점인 $(0,1)$의 $y$좌표와 비교해보면 $n-b_n<1$, 즉, $n-1<b_n$임을 확인할 수 있다.
      criteria:
      - 2.M2
    - id: 2b-3
      content: 이를 종합해보면 $n-1<b_n<n$이 된다.
      criteria:
      - 2.R1
