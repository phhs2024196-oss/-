      - 2.R1
  - id: S2-B
    audience: B
    source_flow: g23.pdf p.74 채점기준 문제 2(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: $y=2^{-x}$와 $y=-x+n$의 교점의 $x$좌표인 $b_n$과 $y=-x+n$의 $x$절편인 $n$과 비교해보면 $2$ 이상의 자연수 $n$에 대해 $b_n<n$이 성립함을 확인할 수 있다.
      criteria:
