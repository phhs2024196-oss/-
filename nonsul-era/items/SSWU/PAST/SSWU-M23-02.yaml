- id: '3'
  stem: '[10점] 삼각형 $\mathrm{OC}_n\mathrm{R}_n$의 넓이를 $S_n$, 삼각형 $\mathrm{OC}_n\mathrm{Q}_n$의 넓이를 $T_n$이라고 할 때, $\displaystyle\lim_{n\to\infty}\dfrac{S_n\times T_n}{n^2}$의 값을 구하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 1/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $S_nT_n=\frac14b_n^2$, $\frac{b_n}n\to1$이므로 극한 $\frac14$.
    steps:
    - id: 3a
      content: $S_nT_n=\frac14b_n^2$, $\lim\frac{b_n}n=1$ $\Rightarrow\frac14$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.M4
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g23.pdf p.74 채점기준 문제 2(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: 삼각형 $\mathrm{OC}_n\mathrm{R}_n$의 넓이 $S_n=\dfrac12\times\overline{\mathrm{OC}_n}\times\overline{\mathrm{R}_n\mathrm{C}_n}=\dfrac12b_n\times2^{b_n}$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: 마찬가지로 삼각형 $\mathrm{OC}_n\mathrm{Q}_n$의 넓이 $T_n=\dfrac12\times\overline{\mathrm{OC}_n}\times\overline{\mathrm{Q}_n\mathrm{C}_n}=\dfrac12b_n\times2^{-b_n}$이 된다.
      criteria:
      - 3.M2
    - id: 3b-3
      content: 따라서, $S_n\times T_n=\dfrac14b_n^2$이 되고
      criteria:
      - 3.M3
    - id: 3b-4
      content: 위의 〈문제 2〉(2)에서 $\dfrac{n-1}n<\dfrac{b_n}n<1$이 성립하므로 $\displaystyle\lim_{n\to\infty}\dfrac{b_n}n=1$이 된다.
      criteria:
      - 3.M4
    - id: 3b-5
      content: 따라서, $\displaystyle\lim_{n\to\infty}\dfrac{S_n\times T_n}{n^2}=\dfrac14$이다
      criteria:
      - 3.A1
