stimuli: []
stem: |-
  좌표평면에서 곡선 $y=2^x$과 직선 $y=-x+n$이 만나는 점을 $\mathrm{P}_n(a_n,2^{a_n})$이라 하고, 곡선 $y=2^{-x}$과 직선 $y=-x+n$이 만나는 점 중 $x$좌표가 양수인 점을 $\mathrm{Q}_n(b_n,2^{-b_n})$ $(b_n>0)$이라 하자. 또한, 점 $\mathrm{Q}_n$에서 $x$축에 내린 수선의 발을 $\mathrm{C}_n$이라 하고, 직선 $x=b_n$과 곡선 $y=2^x$이 만나는 점을 $\mathrm{R}_n$이라 하자. (단, $n$은 $2$이상의 자연수이다.)

  [그림 1: 곡선 $y=2^x$(증가), $y=2^{-x}$(감소), 직선 $y=-x+n$(감소)이 그려진 좌표평면. 두 곡선은 $y$축 위의 점 $(0,1)$에서 만난다. 직선과 $y=2^x$의 교점이 $\mathrm{P}_n$, 직선과 $y=2^{-x}$의 교점이 $\mathrm{Q}_n$이고 $\mathrm{Q}_n$이 $\mathrm{P}_n$보다 오른쪽 아래에 있다. 수직선 $x=b_n$이 $\mathrm{Q}_n$을 지나 $x$축과 만나는 점이 $\mathrm{C}_n$, $y=2^x$와 만나는 점이 $\mathrm{R}_n$]

  다음 물음에 답하시오. [총25점]
subparts:
- id: '1'
  stem: '[10점] 선분 $\mathrm{P}_n\mathrm{P}_{n+1}$의 길이가 $\sqrt2$보다 작음을 보이시오.'
  points: 10
  depends_on: []
  answer:
    kind: proof
    value: 증명
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $0<a_{n+1}-a_n<1$, $0<2^{a_{n+1}}-2^{a_n}<1$로 길이 $<\sqrt2$.
    steps:
    - id: 1a
      content: '증명: 두 좌표 차가 모두 $(0,1)$ 안'
      criteria:
      - 1.B1
      - 1.M1
      - 1.M2
      - 1.R1
  - id: S1-B
    audience: B
    source_flow: g23.pdf p.74 채점기준 문제 2(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: 점 $\mathrm{P}_n$의 좌표는 $\mathrm{P}_n(a_n,-a_n+n)$이고 점 $\mathrm{P}_{n+1}$의 좌표는 $\mathrm{P}_{n+1}(a_{n+1},-a_{n+1}+n+1)$이다.
      criteria:
      - 1.B1
    - id: 1b-2
      content: 곡선 $y=2^x$는 증가함수이므로, $-a_n+n<-a_{n+1}+n+1$, 즉, $0<a_{n+1}-a_n<1$이 성립한다.
      criteria:
      - 1.M1
    - id: 1b-3
      content: 한편, $2^{a_n}=-a_n+n$이고, $2^{a_{n+1}}=-a_{n+1}+n+1$ 이므로 $2^{a_{n+1}}-2^{a_n}=1-(a_{n+1}-a_n)$ 이 되어, $0<2^{a_{n+1}}-2^{a_n}<1$이 성립한다.
      criteria:
      - 1.M2
    - id: 1b-4
      content: 마지막으로, 선분 $\mathrm{P}_n\mathrm{P}_{n+1}$의 길이는 $\sqrt{(a_n-a_{n+1})^2+(2^{a_n}-2^{a_{n+1}})^2}$ 이므로 위의 두 부등식을 이용하면 선분 $\mathrm{P}_n\mathrm{P}_{n+1}$의 길이가 $\sqrt2$보다 작음을 보일 수 있다.
      criteria:
      - 1.R1
