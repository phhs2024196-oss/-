stem: |-
  그림과 같이 $\angle\mathrm{D_1A_1B_1}=\angle\mathrm{B_1C_1D_1}=90^\circ$이고, $\overline{\mathrm{A_1B_1}}=\overline{\mathrm{B_1C_1}}$, $\overline{\mathrm{C_1D_1}}=\overline{\mathrm{D_1A_1}}$인 사각형 $\mathrm{A_1B_1C_1D_1}$이 중심이 $\mathrm{O_1}$인 원 $O_1$에 내접한다. 네 변 $\mathrm{A_1B_1}$, $\mathrm{B_1C_1}$, $\mathrm{C_1D_1}$, $\mathrm{D_1A_1}$을 각각 지름으로 하고 사각형 $\mathrm{A_1B_1C_1D_1}$의 외부에 그려진 $4$개의 반원의 내부와 원 $O_1$의 외부의 공통부분에 색칠하여 얻은 그림 [그림 1: 색칠된 네 개의 달 모양 조각으로 이루어진 도형 아이콘]을 $R_1$이라 하자.

  또 사각형 $\mathrm{A_1B_1C_1D_1}$에 내접하는 중심이 $\mathrm{O_2}$인 원 $O_2$에 대하여 선분 $\mathrm{O_2B_1}$, 선분 $\mathrm{O_2D_1}$과 원 $O_2$가 만나는 점을 각각 $\mathrm{B_2},\mathrm{D_2}$라고 하자. 점 $\mathrm{D_2}$에서 선분 $\mathrm{A_1D_1}$과 평행한 직선이 원 $O_2$와 만나는 점 중 점 $\mathrm{D_2}$가 아닌 점을 점 $\mathrm{A_2}$라 하고, 점 $\mathrm{D_2}$에서 선분 $\mathrm{D_1C_1}$과 평행한 직선이 원 $O_2$와 만나는 점 중 점 $\mathrm{D_2}$가 아닌 점을 점 $\mathrm{C_2}$라 하자. 이렇게 만들어지는 사각형 $\mathrm{A_2B_2C_2D_2}$의 네 변 $\mathrm{A_2B_2}$, $\mathrm{B_2C_2}$, $\mathrm{C_2D_2}$, $\mathrm{D_2A_2}$을 각각 지름으로 하고 사각형 $\mathrm{A_2B_2C_2D_2}$의 외부에 그려진 $4$개의 반원의 내부와 원 $O_2$의 외부의 공통부분에 색칠하여 얻은 그림 [그림 2: 색칠된 네 개의 달 모양 조각으로 이루어진 도형 아이콘]을 $R_2$라 하자.

  이와 같은 과정을 계속하여 $n$번째 얻은 그림 $R_n$에 색칠되어 있는 부분의 넓이를 $S_n$이라 할 때, 다음 물음에 답하시오. [총25점]

  [그림 3: 왼쪽은 $R_1$, 오른쪽은 $R_2$($\cdots$). $R_1$은 원 $O_1$에 내접하는 연 모양 사각형 $\mathrm{A_1B_1C_1D_1}$(꼭짓점 $\mathrm{A_1}$ 위, $\mathrm{B_1}$ 왼쪽 아래, $\mathrm{C_1}$ 오른쪽 아래, $\mathrm{D_1}$ 오른쪽 위)의 네 변 바깥에 반원이 붙고 원 $O_1$ 바깥 부분이 색칠되어 있다. 사각형 안에 내접원 $O_2$와 그 위의 $\mathrm{B_2}$, $\mathrm{D_2}$, $\mathrm{A_2}$, $\mathrm{C_2}$가 표시되고 $\mathrm{B_1D_1}$ 위에 $\mathrm{O_1}$, $\mathrm{O_2}$가 있다. $R_2$는 같은 모양으로 원 $O_2$ 기준]
