intent: 피타고라스 정리를 이용하여 주어진 도형의 넓이를 구할 수 있는지를 알아본다. 원에 내접하는 도형의 기하학적 성질을 이용하여 사각형에 내접하는 반지름을 구할 수 있는지를 확인한다. 또한, 반지름 사이의 규칙성을 발견하여 이웃하는 두 항 사이의 관계를 찾는 논리력도 측정하고, 주어진 급수의 값을 계산할 수 있는지도 알아본다.
