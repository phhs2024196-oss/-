key_idea: 히포크라테스의 달 모양 넓이 $S_1=a_1b_1$. 사각형의 외접원 반지름 $r_1=\frac{\sqrt{a_1^2+b_1^2}}2$, 내접원 반지름 $r_2=\frac{a_1b_1}{a_1+b_1}$. 닮음으로 $\{S_n\}$은 공비 $\left(\frac{r_2}{r_1}\right)^2$인 등비수열.
