    audience: A
    method_no: 1
    key_idea: 반원 합이 외접원 넓이와 같아 달 모양 넓이 합은 사각형 넓이 $a_1b_1$.
    steps:
    - id: 1a
      content: $S_1=a_1b_1$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g23.pdf p.75 채점기준 문제 3(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: 대칭성에 의해 $\dfrac12S_1$은 선분 $\mathrm{A_1B_1}$을 지름으로 하는 반원 중 원 $O_1$의 바깥 부분과 선분 $\mathrm{A_1D_1}$을 지름으로 하는 반원 중 원 $O_1$의 바깥 부분의 넓이의 합과 같다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: 따라서, $\dfrac12S_1$은 삼각형 $\mathrm{A_1B_1D_1}$의 넓이와 지름이 $a_1$인 반원의 넓이와 지름이 $b_1$인 반원의 넓이를 더한 것에서 지름이 $\mathrm{B_1D_1}$인 반원의 넓이를 뺀 것이다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: 즉, $\dfrac12S_1=\dfrac12a_1b_1+\dfrac12\left(\dfrac{a_1}2\right)^2\pi+\dfrac12\left(\dfrac{b_1}2\right)^2\pi-\dfrac12\left(\dfrac{\sqrt{a_1^2+b_1^2}}2\right)^2\pi=\dfrac12a_1b_1$이 되어 $S_1=a_1b_1$이 된다.
      criteria:
      - 1.A1
