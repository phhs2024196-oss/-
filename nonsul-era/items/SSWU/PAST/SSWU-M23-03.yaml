- id: '3'
  stem: '[10점] $a_1=2$이고 $b_1=1$일 때, $\displaystyle\sum_{n=1}^{\infty}S_n$의 값을 구하시오.'
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 90/29
