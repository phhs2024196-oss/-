  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $S_1=2$, $\{S_n\}$은 공비 $\left(\frac{r_2}{r_1}\right)^2=\frac{16}{45}$인 등비수열.
    steps:
    - id: 3a
      content: $\dfrac{2}{1-\frac{16}{45}}=\dfrac{90}{29}$
      criteria:
      - 3.B1
      - 3.M1
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g23.pdf p.76 채점기준 문제 3(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: $a_1=2$이고 $b_1=1$이므로 첫 번째 항은 $S_1=a_1b_1=2$가 된다.
      criteria:
      - 3.B1
    - id: 3b-2
      content: 삼각형 $\mathrm{A_1B_1D_1}$과 삼각형 $\mathrm{A_2B_2D_2}$가 닮았고, 같은 이유로 삼각형 $\mathrm{B_1C_1D_1}$과 삼각형 $\mathrm{B_2C_2D_2}$가 닮았으므로, 수열 $\{S_n\}$은 등비수열임을 알 수 있고, 공비는 $\left(\dfrac{r_2}{r_1}\right)^2$이 된다.
      criteria:
      - 3.M1
    - id: 3b-3
      content: 이 때, $r_1=\dfrac{\sqrt5}2$이고, $r_2=\dfrac{a_1b_1}{a_1+b_1}=\dfrac23$이므로 공비는 $\dfrac{16}{45}$가 되므로, $\displaystyle\sum_{n=1}^{\infty}S_n=\dfrac{2}{1-\frac{16}{45}}=\dfrac{90}{29}$가 된다.
      criteria:
      - 3.A1
