- id: '2'
  stem: '[8점] 원 $O_1$과 원 $O_2$의 반지름을 각각 $r_1$, $r_2$라고 할 때, $r_1$과 $r_2$를 $a_1$과 $b_1$로 나타내시오.'
  points: 8
  depends_on: []
  answer:
    kind: value
    value: r1=sqrt(a1**2+b1**2)/2; r2=a1*b1/(a1+b1)
    equivalents:
    - $r_1=\frac{\sqrt{a_1^2+b_1^2}}2$, $r_2=\frac{a_1b_1}{a_1+b_1}$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{B_1D_1}=2r_1$, 내접원은 닮음 $\frac{r_2}{a_1-r_2}=\frac{b_1-r_2}{r_2}$.
    steps:
    - id: 2a
      content: $r_1=\frac{\sqrt{a_1^2+b_1^2}}2$, $r_2=\frac{a_1b_1}{a_1+b_1}$
      criteria:
      - 2.B1
      - 2.M1
      - 2.M2
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g23.pdf p.75 채점기준 문제 3(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: 원에 내접하는 직각삼각형의 성질을 이용하면 선분 $\mathrm{B_1D_1}$의 길이가 원 $O_1$의 지름인 $2r_1$이 된다. 따라서, $r_1=\dfrac{\sqrt{a_1^2+b_1^2}}2$이 된다.
      criteria:
      - 2.B1
    - id: 2b-2
      content: 한편, 사각형 $\mathrm{A_1B_1C_1D_1}$에 내접하는 원 $O_2$의 반지름이 $r_2$이다. 원 $O_2$가 선분 $\mathrm{B_1C_1}$, 선분 $\mathrm{C_1D_1}$과 접하는 점을 각각 점 $\mathrm P$, $\mathrm Q$라고 한다면, 삼각형 $\mathrm{O_2B_1P}$와 삼각형 $\mathrm{O_2QD_1}$은 닮음이다.
      criteria:
      - 2.M1
    - id: 2b-3
      content: 그러므로 $\dfrac{\overline{\mathrm{PO_2}}}{\overline{\mathrm{B_1P}}}=\dfrac{\overline{\mathrm{QD_1}}}{\overline{\mathrm{O_2Q}}}$, 즉, $\dfrac{r_2}{a_1-r_2}=\dfrac{b_1-r_2}{r_2}$가 성립한다.
      criteria:
      - 2.M2
    - id: 2b-4
      content: 따라서, $r_2=\dfrac{a_1b_1}{a_1+b_1}$이 된다.
      criteria:
      - 2.A1
