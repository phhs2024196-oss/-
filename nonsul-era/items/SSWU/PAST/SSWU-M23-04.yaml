- id: '3'
  stem: |-
    [10점] (2)의 규칙에 따라 게임을 진행하여 수정이와 성신이의 말이 같은 좌표에 놓였을 때의 좌표를 $Z$라 하자. 수정이와 성신이의 말이 좌표 $Z$에 같이 위치하게 되는 경우의 수를 각각 구한 후 아래의 표를 참고하여 표로 나타내시오.
    (단, 수정의의 말은 처음에 좌표 $0$에 위치하고 성신이의 말은 처음에 좌표 $12$에 위치한다.)

    [표 7: 첫 행 $Z$ = 3, 4, 5, $\cdots$ / 둘째 행 경우의 수 = (빈칸)]
  points: 10
  depends_on: []
  answer:
