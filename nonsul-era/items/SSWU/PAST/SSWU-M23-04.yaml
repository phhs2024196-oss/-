intent: 원하는 조건을 만족하는 경우의 수를 계산하는 능력이 있는지를 확인한다. 사건의 시행 조건이 바뀌었을 때 주어진 상황을 분석하여 각 경우의 수의 변화를 이해하고 구할 수 있는지 확인한다. 마지막으로 두 개의 다른 사건에서 발생할 수 있는 경우의 수를 구할 수 있는지 알아본다.
