- id: '3'
  stem: (3) [8점] 좌표평면의 곡선 $\ln\left(e-1+x^2+y^2\right)=1+y$가 직선 $y=1$과 만나는 점을 $\mathrm{A}(a,1)$이라 할 때, 점 $\mathrm{A}(a,1)$에서의 이 곡선에 대한 접선의 기울기를 구하시오. (단, $a>0$)
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: 2*sqrt(exp(2)-exp(1))/(exp(2)-2)
    equivalents:
    - $\dfrac{2\sqrt{e^2-e}}{e^2-2}$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 교점 $a=\sqrt{e^2-e}$, 음함수 미분 $\frac{2x+2yy'}{e-1+x^2+y^2}=y'$에 대입.
    steps:
    - id: 3a
      content: $y'=\dfrac{2\sqrt{e^2-e}}{e^2-2}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: 곡선이 직선 $y=1$과 만나는 점의 $x$좌표는 $\ln(e+x^2)=2$로부터 $x^2=e^2-e$이므로 $a=\sqrt{e^2-e}$이다.
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: 주어진 곡선에 대하여 음함수의 미분을 구하면 $\dfrac{2x+2yy'}{e-1+x^2+y^2}=y'$이다.
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: $\mathrm{A}\left(\sqrt{e^2-e},1\right)$에서의 접선의 기울기는 $\dfrac{2\sqrt{e^2-e}+2y'}{e^2}=y'$으로부터 $2\sqrt{e^2-e}=(e^2-2)y'$이므로
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: $\mathrm{A}\left(\sqrt{e^2-e},1\right)$에서 접선의 기울기는 $y'=\dfrac{2\sqrt{e^2-e}}{e^2-2}$이다.
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(3)
      criteria:
      - 3.A1
