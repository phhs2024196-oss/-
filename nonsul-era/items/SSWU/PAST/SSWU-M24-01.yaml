- id: '2'
  stem: (2) [10점] 좌표평면의 곡선 $\ln\left(e-1+x^2+y^2\right)=1+y$가 $y$축과 단 한 점에서 만나며, 그 점의 $y$좌표는 $-1<y<0$인 범위에 있음을 보이시오.
  points: 10
  depends_on:
  - '1'
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $y$축 위의 점은 $e-1+y^2=e^{1+y}$, $g(y)=e^{1+y}-e+1-y^2$로 두면 $g'=f>0$, $g(-1)<0<g(0)$.
    steps:
    - id: 2a
      content: $g$가 증가하고 $g(-1)<0<g(0)$이므로 $(-1,0)$에서 유일한 근
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.M4
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 주어진 곡선이 $y$축과 만나는 점의 $y$좌표는 $\ln(e-1+y^2)=1+y$로부터 $e-1+y^2=e^{1+y}$, 즉 방정식 $e^{1+y}-e+1-y^2=0$의 근이다.
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: 이때 $g(y)=e^{1+y}-e+1-y^2$도 두면 함수 $g(y)$는 $y$에 대하여 실수 전체에서 연속이며 미분가능한 함수이다.
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: $g(-1)=1-e<0$이고, $g(0)=1>0$이므로 사잇값 정리에 의하여 $-1<k<0$이며 $g(k)=0$을 만족하는 실수 $k$가 존재한다.
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: (1)의 결과로부터 모든 실수 $y$에 대하여 $g'(y)=f(y)=e^{1+y}-2y>0$이므로 $g(k)=0$을 만족하는 실수 $k$는 단 하나뿐이다.
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(2)
      criteria:
      - 2.M4
    - id: 2b-5
      content: 따라서 주어진 곡선은 $y$축과 단 한 점에서 만나며, 그 점의 $y$좌표는 $-1<y<0$인 범위에 있다.
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(2)
      criteria:
      - 2.A1
