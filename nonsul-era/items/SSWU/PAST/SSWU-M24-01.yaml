intent: 연속함수에 대한 사잇값 정리와 함수의 미분을 이용하여 방정식과 부등식에 대한 문제를 해결할 수 있는지 평가하며, 음함수의 미분을 구할 수 있는지 평가한다.
key_idea: $f(t)=e^{1+t}-2t$는 $t=-1+\ln2$에서 최솟값 $4-2\ln2>0$을 가진다. $y$축 위의 교점은 $g(y)=e^{1+y}-e+1-y^2=0$의 근이고 $g'(y)=f(y)>0$이므로 증가하며 $g(-1)<0<g(0)$에서 근이 유일하게 $(-1,0)$에 존재한다. (3)은 음함수 미분 후 $(a,1)$을 대입한다.
stuck: (2)에서 $g'(y)=f(y)$가 (1)의 함수임을 알아채는 단계
