stem: 실수 $t$에 대한 함수 $f(t)=e^{1+t}-2t$와 좌표평면의 곡선 $\ln\left(e-1+x^2+y^2\right)=1+y$에 대하여 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: (1) [7점] 모든 실수 $t$에 대하여 $f(t)>0$임을 보이시오.
  points: 7
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'(t)=0$인 $t=-1+\ln2$에서 최솟값 $4-2\ln2>0$.
    steps:
    - id: 1a
      content: 최솟값 $f(-1+\ln2)=4-2\ln2>0$이므로 $f(t)>0$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f(t)=e^{1+t}-2t$에 대하여 $f'(t)=e^{1+t}-2$이다.
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: $t=-1+\ln2$에서 $f'(t)=0$이며 $t<-1+\ln2$일 때 $f'(t)<0$이고, $t>-1+\ln2$일 때 $f'(t)>0$이다.
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: 따라서 $f(t)$는 $t=-1+\ln2$에서 최솟값 $f(-1+\ln2)=2-2(-1+\ln2)=4-2\ln2>0$을 가진다.
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(1)
      criteria:
      - 1.M3
    - id: 1b-4
      content: 따라서 모든 실수 $t$에 대하여 $f(t)>0$이다.
      source_flow: g24.pdf p.93~95 평가기준(예시답안) 문제 1(1)
      criteria:
      - 1.A1
