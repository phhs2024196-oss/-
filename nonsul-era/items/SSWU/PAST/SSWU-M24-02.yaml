- id: '2'
  stem: (2) [9점] 모든 자연수 $n$에 대하여 $\mathrm{Q}_n$과 $\mathrm{R}_n$의 $x$좌표의 차는 $2\sqrt2$임을 보이시오.
  points: 9
  depends_on:
  - '1'
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 접선 $y=-\sqrt nx+\sqrt n(n+1)$을 $C_{n+1}$에 대입하면 $x^2-2nx+n^2=2$.
    steps:
    - id: 2a
      content: $x=n\pm\sqrt2$이므로 $x$좌표의 차는 $2\sqrt2$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.M4
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 원 $C_n$ 위의 점 $\mathrm{P}_n(n,\sqrt n)$에서의 접선의 기울기는 $-\dfrac{n}{\sqrt n}=-\sqrt n$이므로
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: 접선의 방정식은 $y=-\sqrt n(x-n)+\sqrt n$, 즉 $y=-\sqrt nx+\sqrt n(n+1)$이다.
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: 원 $C_{n+1}$의 방정식은 $x^2+y^2=(n+1)(n+2)$이다.
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: $y=-\sqrt nx+\sqrt n(n+1)$을 대입하여 정리하면 $x^2-2nx+n^2=2$이다.
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(2)
      criteria:
      - 2.M4
    - id: 2b-5
      content: 따라서 $x=n\pm\sqrt2$이고, 접선이 원 $C_{n+1}$과 만나는 두 점 $\mathrm{Q}_n$과 $\mathrm{R}_n$의 $x$좌표의 차는 $2\sqrt2$이다.
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(2)
      criteria:
      - 2.A1
