- id: '3'
  stem: (3) [9점] $\cos\theta_n$을 $n$에 대한 식으로 나타내고, $\displaystyle\lim_{n\to\infty}\cos\theta_n$의 값을 구하시오.
  points: 9
  depends_on:
  - '1'
  answer:
    kind: expression
    value: cos = (n-2)/(n+2); lim = 1
    equivalents:
    - $\cos\theta_n=\frac{n-2}{n+2}$, 극한값 $1$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\mathrm{OP}_n\perp\mathrm{Q}_n\mathrm{R}_n$, $\angle\mathrm{P}_n\mathrm{OR}_n=\frac{\theta_n}{2}$, $\cos\frac{\theta_n}{2}=\frac{\overline{\mathrm{OP}_n}}{\overline{\mathrm{OR}_n}}$ 후 배각공식.
    steps:
    - id: 3a
      content: $\cos\theta_n=\frac{n-2}{n+2}\to1$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: 원 $C_{n+1}$에서 $\overline{\mathrm{OQ}_n}=\overline{\mathrm{OR}_n}$이고, 원 $C_n$에서 $\overline{\mathrm{OP}_n}\perp\overline{\mathrm{Q}_n\mathrm{R}_n}$이므로 $\angle\mathrm{P}_n\mathrm{OR}_n=\dfrac{\theta_n}{2}$이다.
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: $\cos\dfrac{\theta_n}{2}=\dfrac{\overline{\mathrm{OP}_n}}{\overline{\mathrm{OR}_n}}=\dfrac{\sqrt{n(n+1)}}{\sqrt{(n+1)(n+2)}}=\dfrac{\sqrt n}{\sqrt{n+2}}$
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: $\cos\theta_n=2\left(\cos\dfrac{\theta_n}{2}\right)^2-1=\dfrac{2n}{n+2}-1=\dfrac{n-2}{n+2}$
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: $\displaystyle\lim_{n\to\infty}\cos\theta_n=\lim_{n\to\infty}\dfrac{n-2}{n+2}=1$
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(3)
      criteria:
      - 3.A1
