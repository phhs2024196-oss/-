stem: |
  아래 그림과 같이 원점 $\mathrm{O}$를 중심으로 하고 반지름이 $\sqrt{n(n+1)}$인 원을 $C_n$ $(n=1,2,\cdots)$이라 하자. 원 $C_n$이 $y=\sqrt x$의 그래프와 만나는 점을 $\mathrm{P}_n$, 점 $\mathrm{P}_n$에서 원 $C_n$에 접하는 직선과 원 $C_{n+1}$이 만나는 두 점을 각각 $\mathrm{Q}_n$, $\mathrm{R}_n$이라 하고, $\theta_n=\angle\mathrm{Q}_n\mathrm{OR}_n$이라 하자. (단, $\mathrm{Q}_n$의 $x$좌표는 $\mathrm{R}_n$의 $x$좌표보다 작고, $0<\theta_n<\pi$이다.) 다음 물음에 답하시오.

  [그림 1: 원점 $\mathrm{O}$를 중심으로 하는 동심원 $C_1,C_2,C_3,C_4,\cdots$(바깥으로 갈수록 반지름 증가)와 제1사분면의 곡선 $y=\sqrt x$가 $\mathrm{P}_1,\mathrm{P}_2,\mathrm{P}_3,\mathrm{P}_4$에서 각 원과 만난다. $\mathrm{P}_2$에서 $C_2$에 접하는 직선이 원 $C_3$과 만나는 두 점이 $\mathrm{Q}_2$(제2사분면 쪽, $y$축 근처)와 $\mathrm{R}_2$(제4사분면 쪽, $x$축 근처)이고, $\theta_2=\angle\mathrm{Q}_2\mathrm{OR}_2$가 표시되어 있다.]
subparts:
- id: '1'
  stem: (1) [7점] $\mathrm{P}_n$의 좌표를 구하시오.
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: x = n; y = sqrt(n)
    equivalents:
    - $\mathrm{P}_n(n,\sqrt n)$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $x^2+y^2=n(n+1)$에 $y=\sqrt x$를 대입하면 $(x-n)(x+n+1)=0$, $x>0$.
    steps:
    - id: 1a
      content: $\mathrm{P}_n(n,\sqrt n)$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 원 $C_n$의 방정식은 $x^2+y^2=n(n+1)$이다.
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: $y=\sqrt x$를 원의 방정식에 대입하면 $x^2+x-n(n+1)=0$
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: $(x-n)(x+n+1)=0$이므로 $x=n$ 또는 $x=-n-1$이다.
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(1)
      criteria:
      - 1.M3
    - id: 1b-4
      content: $x>0$이므로 $x=n$을 $y=\sqrt x$에 대입하면 교점은 $\mathrm{P}_n(n,\sqrt n)$이다.
      source_flow: g24.pdf p.95~96 평가기준(예시답안) 문제 2(1)
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
