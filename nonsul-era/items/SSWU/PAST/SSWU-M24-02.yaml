intent: 원의 방정식을 나타내고 원의 접선의 방정식을 도출할 수 있는지 평가하고, 두 곡선의 교점을 구하는 방식을 이해하고 있는지 평가한다. 삼각함수의 덧셈정리를 적용하고 수열의 극한값을 구하는 능력을 평가한다.
key_idea: '$C_n$: $x^2+y^2=n(n+1)$과 $y=\sqrt x$의 교점은 $\mathrm{P}_n(n,\sqrt n)$. 접선 $y=-\sqrt n\,x+\sqrt n(n+1)$과 $C_{n+1}$의 교점의 $x$좌표는 $n\pm\sqrt2$. $\overline{\mathrm{OP}_n}\perp\mathrm{Q}_n\mathrm{R}_n$이고 $\overline{\mathrm{OQ}_n}=\overline{\mathrm{OR}_n}$이므로 $\cos\frac{\theta_n}{2}=\sqrt{\frac{n}{n+2}}$.'
stuck: $\theta_n$을 이등분하는 $\mathrm{OP}_n$으로 직각삼각형을 만들어 $\cos\frac{\theta_n}{2}$를 길이의 비로 잡는 단계
