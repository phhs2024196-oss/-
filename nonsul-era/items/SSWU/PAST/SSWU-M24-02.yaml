    - id: 1.M2
      mark_type: M
      points: 2
      evidence: 대입하여 $x$에 대한 방정식을 얻었다.
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 1
      evidence: 인수분해로 $x=n,-n-1$을 구했다.
      steps:
      - 1b-3
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $\mathrm{P}_n(n,\sqrt n)$을 구했다.
      depends_on:
      - 1.M1
