stem: $f(1)=-1$인 다항함수 $f(x)$에 대하여 $\displaystyle\lim_{x\to1}\dfrac{\{f(x)\}^3+1}{x^2-1}=3$이 성립하고, 구간 $(0,2)$에서 $g(x)\ne0$인 다항함수 $g(x)$에 대하여 $\displaystyle\lim_{x\to1}\dfrac{\left(e^x-e\right)\{f(x)+g(x)\}}{(x-1)^2g(x)}=2$가 성립할 때, 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: (1) [8점] $f'(1)$의 값을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\{f\}^3+1=(f+1)(f^2-f+1)$로 인수분해, $f(1)=-1$이므로 $f^2-f+1\to3$.
    steps:
    - id: 1a
      content: $3=\frac32f'(1)$ → $f'(1)=2$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $\displaystyle\lim_{x\to1}\dfrac{\{f(x)\}^3+1}{x^2-1}=\lim_{x\to1}\dfrac{\left(\{f(x)\}^2-f(x)+1\right)(f(x)+1)}{(x+1)(x-1)}=3$이다.
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: $f(x)$가 다항함수이므로 $f'(1)=\displaystyle\lim_{x\to1}\dfrac{f(x)-f(1)}{x-1}=\lim_{x\to1}\dfrac{f(x)+1}{x-1}$의 값이 존재한다.
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: 따라서 $\displaystyle\lim_{x\to1}\dfrac{\{f(x)\}^2-f(x)+1}{x+1}\times\lim_{x\to1}\dfrac{f(x)-f(1)}{x-1}$이므로
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(1)
      criteria:
      - 1.M3
    - id: 1b-4
      content: $3=\dfrac32f'(1)$로부터 $f'(1)=2$이다.
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(1)
      criteria:
      - 1.A1
  rubric:
