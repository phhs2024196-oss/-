  - $f(1)=-1$인 다항함수 $f(x)$와 $\displaystyle\lim_{x\to1}\frac{\{f(x)\}^3+1}{x^2-1}=3$
  - 구간 $(0,2)$에서 $g(x)\ne0$인 다항함수 $g(x)$와 $\displaystyle\lim_{x\to1}\frac{(e^x-e)\{f(x)+g(x)\}}{(x-1)^2g(x)}=2$
  - $h(x)=\frac{f(x)}{g(x)}$, $k(x)=f(g(x))$
  concepts:
  - 미분계수의 정의
  - 다항함수의 연속
  - 극한값이 존재하기 위한 조건
