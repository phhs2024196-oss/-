- id: '2'
  stem: (2) [10점] 구간 $(0,2)$에서 함수 $h(x)$를 $h(x)=\dfrac{f(x)}{g(x)}$로 정의할 때, $h'(1)$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 2/exp(1)
    equivalents:
    - $\dfrac2e$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $f(1)+g(1)=0$으로 $g(1)=1$, $h(1)=-1$, $e^x-e$와 $h(x)-h(1)$로 나누어 미분계수 정의 사용.
    steps:
    - id: 2a
      content: $e\,h'(1)=2$ → $h'(1)=\frac2e$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.M4
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: 함수 $e^x$의 $x=1$에서의 미분계수의 정의에 의하여 $\displaystyle\lim_{x\to1}\dfrac{e^x-e}{x-1}=e$이다.
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: $\displaystyle\lim_{x\to1}\dfrac{\left(e^x-e\right)\{f(x)+g(x)\}}{(x-1)^2g(x)}=2$에서 극한 $\displaystyle\lim_{x\to1}\dfrac{f(x)+g(x)}{(x-1)g(x)}$이 존재해야 하므로 $\displaystyle\lim_{x\to1}(f(x)+g(x))=0$이다.
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: $f(x)$와 $g(x)$가 다항함수이므로 실수 전체에서 연속이므로 $\displaystyle\lim_{x\to1}(f(x)+g(x))=f(1)+g(1)=0$으로부터 $g(1)=1$이다.
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: 그러므로 $h(1)=\dfrac{f(1)}{g(1)}=-1$이다.
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(2)
      criteria:
      - 2.M4
    - id: 2b-5
      content: 따라서 $\displaystyle\lim_{x\to1}\dfrac{\left(e^x-e\right)\{f(x)+g(x)\}}{(x-1)^2g(x)}=\lim_{x\to1}\dfrac{e^x-e}{x-1}\times\lim_{x\to1}\dfrac{\frac{f(x)}{g(x)}-(-1)}{x-1}=\lim_{x\to1}\dfrac{e^x-e}{x-1}\times\lim_{x\to1}\dfrac{h(x)-h(1)}{x-1}=e\,h'(1)=2$이므로 $h'(1)=\dfrac2e$이다.
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(2)
      criteria:
      - 2.A1
