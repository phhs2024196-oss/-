    method_no: 1
    key_idea: $h'(1)=2+g'(1)=\frac2e$에서 $g'(1)$, 합성함수 미분 $k'(1)=f'(g(1))g'(1)$.
    steps:
    - id: 3a
      content: $k'(1)=2\left(\frac2e-2\right)=\frac4e-4$
