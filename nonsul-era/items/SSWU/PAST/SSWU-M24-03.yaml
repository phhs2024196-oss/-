      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: $h'(1)=\dfrac{f'(1)g(1)-f(1)g'(1)}{g(1)^2}=2+g'(1)=\dfrac2e$이다.
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: $g'(1)=\dfrac2e-2$이다.
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: $k'(x)=f'(g(x))g'(x)$이므로
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: $k'(1)=f'(g(1))g'(1)=f'(1)\left(\dfrac2e-2\right)=2\left(\dfrac2e-2\right)=\dfrac4e-4$이다.
      source_flow: g24.pdf p.96~98 평가기준(예시답안) 문제 3(3)
      criteria:
