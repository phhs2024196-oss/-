intent: 미분계수와 함수의 연속의 뜻을 알고 함수의 극한을 구할 수 있는지를 평가하고, 몫의 미분법과 합성함수의 미분법을 이용하여 미분계수를 구할 수 있는지 평가한다.
key_idea: $\{f\}^3+1=(f+1)(f^2-f+1)$로 인수분해하여 미분계수의 정의 $f'(1)=\lim\frac{f(x)+1}{x-1}$을 만들고 $f'(1)=2$. 둘째 극한이 존재하려면 $f(1)+g(1)=0$, $g(1)=1$, $e^x$의 미분계수 $e$를 분리하면 $h'(1)=\frac2e$. 몫의 미분법으로 $g'(1)$, 합성함수 미분으로 $k'(1)$.
stuck: 둘째 극한에서 분모의 $(x-1)^2$를 $e^x-e$와 $h(x)-h(1)$의 곱 $(x-1)\cdot(x-1)$로 나누어 미분계수의 정의에 연결하는 단계
