intent: 로그함수가 포함된 함수의 개형을 미분을 이용하여 구할 수 있는지를 평가하고, 이를 통한 함수의 최솟값을 구할 수 있는지를 평가한다. 정적분을 활용한 문제해결 능력을 평가하고, 함수의 요철의 특성을 이해하고 명확하게 서술할 수 있는지 평가한다.
key_idea: $f(x)=x-\ln x$는 $x=1$에서 최솟값 $1$을 가지므로 $f\ge1$. (2) $\int_a^bf(x)dx\ge b-a$를 계산하면 부등식이 된다. (3) $f$는 아래로 볼록하므로 구간 $[k,k+1]$에서 $f$ 그래프 아래의 넓이가 사다리꼴의 넓이 $\frac{f(k)+f(k+1)}{2}$ 이하이고, 이를 $k=1,\dots,n-1$에 대해 더한다.
stuck: (3)에서 사다리꼴의 넓이와 정적분을 아래로 볼록한 그래프의 성질로 비교하는 단계
