stem: 양의 실수 $x$에 대한 함수 $f(x)$를 $f(x)=x-\ln x$라고 할 때, 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: (1) [8점] 함수 $y=f(x)$의 그래프의 개형을 그리고, 모든 양의 실수 $x$에 대하여 $f(x)\ge1$임을 보이시오.
  points: 8
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $f'=1-\frac1x$, $f''=\frac1{x^2}$로 증감·요철표를 만들어 $x=1$에서 최솟값 $1$.
    steps:
    - id: 1a
      content: 최솟값 $f(1)=1$이므로 $f(x)\ge1$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $f'(x)=1-\dfrac1x$, $f''(x)=\dfrac{1}{x^2}$이다.
      source_flow: g24.pdf p.98~100 평가기준(예시답안) 문제 4(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: '그래프의 개형을 표로 나타내면 다음 표와 같다. [표: $x$가 $0$에서 $1$까지 $f''(x)<0$, $f''''(x)>0$이고 $f(x)$ 감소; $x=1$에서 $f''(x)=0$, $f(1)=1$; $x>1$에서 $f''(x)>0$, $f''''(x)>0$이고 $f(x)$ 증가]'
      source_flow: g24.pdf p.98~100 평가기준(예시답안) 문제 4(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: '그래프의 개형은 다음 그림과 같다. [그림 2: $x\to0+$에서 $f(x)\to\infty$, $x=1$에서 최솟값 $1$을 갖고 이후 증가하는 아래로 볼록한 곡선]'
      source_flow: g24.pdf p.98~100 평가기준(예시답안) 문제 4(1)
      criteria:
      - 1.M3
    - id: 1b-4
      content: 구간 $(0,\infty)$에서 $f(x)$의 최솟값은 $f(1)=1$이므로 모든 양의 실수 $x$에 대하여 $f(x)\ge1$이 성립한다.
      source_flow: g24.pdf p.98~100 평가기준(예시답안) 문제 4(1)
      criteria:
      - 1.A1
