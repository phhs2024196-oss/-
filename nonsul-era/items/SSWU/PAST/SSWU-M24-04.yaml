- id: '3'
  stem: (3) [10점] 함수 $y=f(x)$의 그래프를 이용하여 $2$ 이상의 자연수 $n$에 대하여 $\displaystyle\sum_{k=1}^{n-1}\dfrac{f(k)+f(k+1)}{2}\ge\int_1^nf(x)dx$가 성립함을 보이시오.
  points: 10
  depends_on:
  - '1'
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $f$가 아래로 볼록하므로 사다리꼴 넓이 $\ge\int_k^{k+1}f$, $k=1,\dots,n-1$ 합.
    steps:
    - id: 3a
      content: $\sum\frac{f(k)+f(k+1)}2\ge\sum\int_k^{k+1}f=\int_1^nf$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: (1)에 의해 $x>1$에서 $f(x)$는 양의 값을 가지며 아래로 볼록하다.
      source_flow: g24.pdf p.98~100 평가기준(예시답안) 문제 4(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: '네 점 $(k,0)$, $(k+1,0)$, $(k,f(k))$, $(k+1,f(k+1))$을 꼭짓점으로 하는 사다리꼴의 넓이는 구간 $(k,k+1)$에서 $y=f(x)$와 $x$축 사이의 넓이보다 크거나 같으므로, $\dfrac{f(k)+f(k+1)}{2}\ge\displaystyle\int_k^{k+1}f(x)dx$ $(k=1,2,\cdots)$이다. [그림 3: 구간 $[k,k+1]$에서 아래로 볼록한 곡선 $y=f(x)$와 그 위쪽의 현(두 점 $(k,f(k))$, $(k+1,f(k+1))$을 잇는 선분), 이 선분 아래의 사다리꼴]'
      source_flow: g24.pdf p.98~100 평가기준(예시답안) 문제 4(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: 따라서 $\displaystyle\sum_{k=1}^{n-1}\dfrac{f(k)+f(k+1)}{2}\ge\sum_{k=1}^{n-1}\int_k^{k+1}f(x)dx=\int_1^nf(x)dx$
      source_flow: g24.pdf p.98~100 평가기준(예시답안) 문제 4(3)
      criteria:
      - 3.A1
