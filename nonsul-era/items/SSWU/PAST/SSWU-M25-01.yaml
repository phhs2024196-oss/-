stimuli: []
stem: |
  자연수 $n$에 대하여 함수 $f(x)$를 다음과 같이 정의한다.

  $$f(x)=\sum_{k=1}^{n}\sin\left(kx+\frac\pi4\right)\sin\left((k+1)x+\frac\pi4\right)$$

  다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: (1) $n=1$일 때, $f(0)$과 $f^{\prime}(0)$의 값을 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: f0=1/2; fp0=3/2
    equivalents:
    - $f(0)=\frac12$, $f^{\prime}(0)=\frac32$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $n=1$이면 $f(x)=\sin(x+\frac\pi4)\sin(2x+\frac\pi4)$, 곱의 미분법으로 $f^{\prime}(0)$을 구한다.
    steps:
    - id: 1a
      content: $f(0)=\frac12$, $f^{\prime}(0)=\frac12(1+2)=\frac32$
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $n=1$일 때, $f(0)=\sin\dfrac\pi4\sin\dfrac\pi4$이고 $\sin\dfrac\pi4=\dfrac{\sqrt2}{2}$이므로 $f(0)=\dfrac12$이다.
      source_flow: g25.pdf p.61 예시답안 문제 1(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $f^{\prime}(0)=\cos\dfrac\pi4\sin\dfrac\pi4+2\sin\dfrac\pi4\cos\dfrac\pi4$이고 $\sin\dfrac\pi4=\cos\dfrac\pi4=\dfrac{\sqrt2}{2}$이므로 $f^{\prime}(0)=\dfrac12(1+2)=\dfrac32$이다.
      source_flow: g25.pdf p.61 예시답안 문제 1(1)
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
