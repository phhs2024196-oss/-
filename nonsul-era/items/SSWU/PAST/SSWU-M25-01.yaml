- id: '2'
  stem: (2) $f(0)$과 $f^{\prime}(0)$을 $n$에 대한 식으로 나타내시오. [12점]
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: f0=n/2; fp0=n*(n+2)/2
    equivalents:
    - $f(0)=\frac n2$, $f^{\prime}(0)=\frac{n(n+2)}{2}$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      $f(0)=n\sin^2\frac\pi4$, $f^{\prime}(0)=\sum\left(k+(k+1)\right)\sin\frac\pi4\cos\frac\pi4=\frac12\sum(2k+1)$.
    steps:
    - id: 2a
      content: $f(0)=\frac n2$, $f^{\prime}(0)=\frac12\{n(n+1)+n\}=\frac{n(n+2)}{2}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.M4
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: $f(0)=n\left(\sin\dfrac\pi4\right)^2=\dfrac n2$이다.
      source_flow: g25.pdf p.61 예시답안 문제 1(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $f^{\prime}(0)=\left(\cos\dfrac\pi4\sin\dfrac\pi4+2\sin\dfrac\pi4\cos\dfrac\pi4\right)+\left(2\cos\dfrac\pi4\sin\dfrac\pi4+3\sin\dfrac\pi4\cos\dfrac\pi4\right)+\cdots+\left(n\cos\dfrac\pi4\sin\dfrac\pi4+(n+1)\sin\dfrac\pi4\cos\dfrac\pi4\right)$
      source_flow: g25.pdf p.61 예시답안 문제 1(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $f^{\prime}(0)=\left(\dfrac12+1\right)+\left(1+\dfrac32\right)+\cdots+\left(\dfrac n2+\dfrac{n+1}{2}\right)$
      source_flow: g25.pdf p.61 예시답안 문제 1(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: 따라서 $f^{\prime}(0)=\dfrac12\{1+2(2+3+\cdots+n)+n+1\}$이므로
      source_flow: g25.pdf p.61 예시답안 문제 1(2)
      criteria:
      - 2.M4
    - id: 2b-5
      content: $f^{\prime}(0)=\dfrac12\times\{n(n+1)+n\}=\dfrac{n(n+2)}{2}$이다.
      source_flow: g25.pdf p.61 예시답안 문제 1(2)
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
