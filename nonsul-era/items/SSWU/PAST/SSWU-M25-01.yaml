      content: 함수 $y=f(x)$의 그래프 위의 점 $(0,f(0))$에서의 접선의 방정식은 $y=f^{\prime}(0)(x-0)+f(0)$이므로
      source_flow: g25.pdf p.61 예시답안 문제 1(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: 접선의 방정식은 $y=\dfrac{n(n+2)}{2}x+\dfrac n2$이다.
      source_flow: g25.pdf p.61 예시답안 문제 1(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: 이 접선의 $x$절편은 $\left(-\dfrac1{n+2},0\right)$, $y$절편은 $\left(0,\dfrac n2\right)$이다.
      source_flow: g25.pdf p.61 예시답안 문제 1(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        접선과 $x$축 및 $y$축으로 둘러싸인 도형인 삼각형의 넓이 $A_n$은 $A_n=\dfrac12\times\dfrac1{n+2}\times\dfrac n2=\dfrac{n}{4(n+2)}$이므로,
      source_flow: g25.pdf p.61 예시답안 문제 1(3)
      criteria:
      - 3.M4
    - id: 3b-5
      content: $\displaystyle\lim_{n\to\infty}A_n=\lim_{n\to\infty}\dfrac{n}{4(n+2)}=\dfrac14$이다.
      source_flow: g25.pdf p.61 예시답안 문제 1(3)
      criteria:
