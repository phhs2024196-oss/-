  stem: |
    (3) 함수 $y=f(x)$의 그래프 위의 점 $(0,f(0))$에서의 접선과 $x$축 및 $y$축으로 둘러싸인 도형의 넓이를 $A_n$이라 할 때, $\displaystyle\lim_{n\to\infty}A_n$의 값을 구하시오. [8점]
  points: 8
