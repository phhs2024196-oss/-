    method_no: 1
    key_idea: 접선 $y=\frac{n(n+2)}{2}x+\frac n2$의 절편으로 삼각형 넓이 $A_n=\frac{n}{4(n+2)}$을 구해 극한을 취한다.
    steps:
    - id: 3a
      content: $A_n=\frac12\cdot\frac1{n+2}\cdot\frac n2=\frac{n}{4(n+2)}\to\frac14$
      criteria:
      - 3.M1
