      criteria:
      - 2.M1
    - id: 2b-2
      content: $3x^2+2x-7=2x-4$의 해를 구하면 $x=1$, $x=-1$이다.
      source_flow: g25.pdf p.62 예시답안 문제 2(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: $x=1$에서 두 곡선이 만나려면 $①$의 방정식으로부터 $-5+c=0$, 즉 $c=5$이고,
      source_flow: g25.pdf p.62 예시답안 문제 2(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: $x=-1$에서 두 곡선이 만나려면 $①$의 방정식으로부터 $7+c=8$, 즉 $c=1$이다. 따라서 $c=1$과 $c=5$이다.
      source_flow: g25.pdf p.62 예시답안 문제 2(2)
      criteria:
      - 2.A1
