key_idea: |
  $f(3)=0$, $f^{\prime}(3)=2$로 $f(x)=x^2-4x+3$. 공통접선이면 기울기 $3x^2+2x-7=2x-4$에서 $x=\pm1$, 그 점에서 만나도록 $c=5,\ 1$. $c=1$이면 차가 $(x+1)^2(x-2)$이므로 넓이 $\frac{27}{4}$.
stuck: (2)에서 "접한다"를 접점에서 함숫값과 기울기가 모두 같다는 두 조건으로 풀어쓰는 곳
