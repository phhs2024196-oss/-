stimuli: []
stem: |
  함수 $f(x)=x^2+ax+b$에 대하여 $\displaystyle\lim_{x\to3}\frac{f(x)}{x-3}=2$가 성립한다. 다음 물음에 답하시오. (단, $a$, $b$는 실수) [총 25점]
subparts:
- id: '1'
  stem: (1) $a$와 $b$의 값을 구하시오. [5점]
  points: 5
  depends_on: []
  answer:
    kind: value
    value: a=-4; b=3
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 극한이 존재하려면 $f(3)=0$이므로 $f(x)=(x-3)(x-k)$로 놓고 극한값 $3-k=2$.
    steps:
    - id: 1a
      content: $f(x)=(x-3)(x-1)=x^2-4x+3$ $\Rightarrow$ $a=-4,\ b=3$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: $\displaystyle\lim_{x\to3}\dfrac{f(x)}{x-3}=2$로부터 $f(3)=0$이므로 $f(x)=(x-3)(x-k)$가 성립한다.
      source_flow: g25.pdf p.62 예시답안 문제 2(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $\displaystyle\lim_{x\to3}\dfrac{f(x)}{x-3}=\lim_{x\to3}\dfrac{(x-3)(x-k)}{x-3}=3-k=2$이다. 따라서 $k=1$이므로
      source_flow: g25.pdf p.62 예시답안 문제 2(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: $f(x)=(x-3)(x-1)=x^2-4x+3$이다. 즉 $a=-4$, $b=3$이다.
      source_flow: g25.pdf p.62 예시답안 문제 2(1)
      criteria:
      - 1.A1
