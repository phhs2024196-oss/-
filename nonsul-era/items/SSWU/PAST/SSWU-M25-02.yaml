    key_idea: $c=1$이면 두 곡선의 차 $x^3-3x-2=(x+1)^2(x-2)$이므로 교점 $x=-1,2$ 사이에서 적분한다.
    steps:
    - id: 3a
      content: $\int_{-1}^2(x^3-3x-2)dx=-\frac{27}{4}$ $\Rightarrow$ 넓이 $\frac{27}{4}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.M4
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: 위 (2)에서 구한 $c$의 값 중에서 가장 작은 것은 $c=1$이다.
      source_flow: g25.pdf p.62 예시답안 문제 2(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: 따라서 두 곡선 $y=x^3+x^2-7x+1$과 $y=x^2-4x+3$으로 둘러싸인 영역의 넓이를 구한다.
      source_flow: g25.pdf p.62 예시답안 문제 2(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: $x^3+x^2-7x+1=x^2-4x+3$, 즉 $x^3-3x-2=(x+1)^2(x-2)=0$으로부터 두 곡선의 교점의 $x$좌표는 $x=-1$, $x=2$이다.
      source_flow: g25.pdf p.62 예시답안 문제 2(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        $\displaystyle\int_{-1}^2(x^3-3x-2)\,dx=\left[\dfrac14x^4-\dfrac12x^2-2x\right]_{-1}^2=-\dfrac{27}{4}$이므로 [판독확인: 예시답안 원문이 $x^2$ 항 계수를 $\frac12$로 인쇄함 — $\int 3x\,dx=\frac32x^2$이므로 오기로 보이나 결과값 $-\frac{27}{4}$는 맞아 원문 그대로 둠]
      source_flow: g25.pdf p.62 예시답안 문제 2(3)
      criteria:
      - 3.M4
    - id: 3b-5
      content: |
        구하는 넓이는 $\dfrac{27}{4}$이다. [그림: $y=f(x)$와 $y=x^3+x^2-7x+1$의 그래프. $x=-1$, $x=2$에서 만나며 두 곡선 사이가 닫힌 영역]
      source_flow: g25.pdf p.62 예시답안 문제 2(3)
      criteria:
      - 3.A1
