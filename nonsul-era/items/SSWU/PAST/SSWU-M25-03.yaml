- id: '3'
  stem: (3) $t=0$에서 $t=1$까지 점 P가 움직인 거리를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 3/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: |
      움직인 거리 $L=\int_0^1f(t)\,dt$이고 $\int_0^12t\,dt=1$, $u=t^2+1$ 치환으로 $\int_0^1\frac{2t}{(t^2+1)^2}dt=\frac12$.
    steps:
    - id: 3a
      content: $L=1+\frac12=\frac32$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.M4
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $t=0$에서 $t=1$까지 점 P가 움직인 거리 $L$은 $L=\displaystyle\int_0^1\sqrt{\left(\dfrac{dx}{dt}\right)^2+\left(\dfrac{dy}{dt}\right)^2}\,dt$이다.
      source_flow: g25.pdf p.63 예시답안 문제 3(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        앞의 (2)의 결과를 이용하여 $L$을 구하면 $L=\displaystyle\int_0^1\sqrt{(f(t))^2}\,dt=\int_0^1f(t)\,dt=\int_0^1\left(2t+\dfrac{2t}{(t^2+1)^2}\right)dt=\int_0^12t\,dt+\int_0^1\dfrac{2t}{(t^2+1)^2}\,dt$
      source_flow: g25.pdf p.63 예시답안 문제 3(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: 여기에서 $\displaystyle\int_0^12t\,dt=\Big[t^2\Big]_0^1=1$이고,
      source_flow: g25.pdf p.63 예시답안 문제 3(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        $t^2+1=u$로 두고 치환적분법을 이용하면 $\displaystyle\int_0^1\dfrac{2t}{(t^2+1)^2}\,dt=\int_1^2\dfrac1{u^2}\,du=\left[-\dfrac1u\right]_1^2=\dfrac12$이다.
      source_flow: g25.pdf p.63 예시답안 문제 3(3)
      criteria:
      - 3.M4
    - id: 3b-5
      content: 따라서 $L=1+\dfrac12=\dfrac32$이다.
      source_flow: g25.pdf p.63 예시답안 문제 3(3)
      criteria:
      - 3.A1
