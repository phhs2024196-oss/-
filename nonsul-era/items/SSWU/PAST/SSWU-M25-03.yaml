key_idea: |
  $\frac{dx}{dt}=\frac{4t}{t^2+1}$, $\frac{dy}{dt}=2t-\frac{2t}{(t^2+1)^2}$이고 속력의 제곱이 완전제곱식 $4t^2\left(1+\frac1{(t^2+1)^2}\right)^2$이 되어 $f(t)=2t+\frac{2t}{(t^2+1)^2}$, 거리는 $\int_0^1f(t)dt=1+\frac12$.
stuck: (2)에서 $\left(\frac{dx}{dt}\right)^2+\left(\frac{dy}{dt}\right)^2$이 완전제곱식이 됨을 알아채는 곳
