stem: |
  좌표평면 위를 움직이는 점 $\mathrm{P}$의 시각 $t$에서의 위치 $(x,y)$가

  $$x=2\ln(t^2+1),\quad y=t^2+\frac{1}{t^2+1}\quad(t\ge0)$$

  일 때, 다음 물음에 답하시오.
