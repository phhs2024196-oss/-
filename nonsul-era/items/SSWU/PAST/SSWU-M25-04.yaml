stimuli: []
stem: |
  그림과 같이 한 변의 길이가 1인 정육각형 $R_1$에서 각 변을 5등분했을 때의 가운데 부분의 선분과 각 변의 길이의 $\dfrac25$인 길이의 선분 2개로 이루어진 이등변삼각형을 정육각형의 내부에 그리고, 정육각형의 모든 변에서 그 변을 5등분했을 때의 가운데 부분의 선분을 지워서 얻은 도형을 $R_2$라 하자. 다시 도형 $R_2$에서 각 변을 5등분했을 때의 가운데 부분의 선분과 각 변의 길이의 $\dfrac25$인 길이의 선분 2개로 이루어진 이등변삼각형을 도형 $R_2$의 내부에 그리고, 도형 $R_2$의 모든 변에서 그 변을 5등분했을 때의 가운데 부분의 선분을 지워서 얻은 도형을 $R_3$이라 하자. 이와 같은 과정을 반복하여 $n$번째 도형 $R_n$을 만든다.

  [그림 1: 도형 $R_1$(한 변의 길이 1인 정육각형), $R_2$(각 변의 가운데에 안쪽으로 파인 이등변삼각형 모양의 홈이 있고 변 위에 길이 $\frac25$, $\frac15$, $\frac25$ 표시), $R_3$, $R_4$(홈이 점점 더 많아지는 눈송이 모양), 이어서 $\cdots$]
