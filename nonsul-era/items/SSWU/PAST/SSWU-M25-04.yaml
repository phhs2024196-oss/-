- id: '2'
  stem: |
    (2) 도형 $R_n$으로부터 도형 $R_{n+1}$을 얻는 과정에서 새로 그려지는 모든 이등변삼각형의 넓이의 합을 $x_n$이라 할 때, $\{x_n\}$은 등비수열이다. 이 수열에 대하여 $x_1$과 공비를 구하시오. [10점]
  points: 10
  depends_on: []
  answer:
    kind: value
    value: x1=3*sqrt(15)/50; r=16/25
    equivalents:
    - $x_1=6\times\frac{\sqrt{15}}{10^2}$, 공비 $\frac{16}{25}$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: |
      한 변이 $\frac25$배로 줄어 삼각형의 넓이는 $\left(\frac25\right)^2$배, 개수는 4배이므로 공비는 $4\times\frac4{25}$이다.
    steps:
    - id: 2a
      content: 첫 삼각형 넓이 $\frac{\sqrt{15}}{10^2}$, $x_1=6\cdot\frac{\sqrt{15}}{10^2}$, 공비 $\frac{16}{25}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.M4
      - 2.A1
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        도형 $R_n$으로부터 도형 $R_{n+1}$을 얻는 과정에서 새로 그려지는 한 이등변삼각형을 $\mathrm{A_nB_nC_n}$이라고 하자. 오른쪽 그림의 삼각형 $\mathrm{A_1B_1C_1}$에서 삼각형의 높이는 $\sqrt{\left(\dfrac25\right)^2-\left(\dfrac1{10}\right)^2}=\dfrac{\sqrt{15}}{10}$이므로 [그림: 이등변삼각형 $\mathrm{A_1B_1C_1}$, 밑변 $\overline{\mathrm{A_1B_1}}=\frac15$, 두 변 $\overline{\mathrm{A_1C_1}}=\overline{\mathrm{B_1C_1}}=\frac25$]
      source_flow: g25.pdf p.64 예시답안 문제 4(2)
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        삼각형 $\mathrm{A_1B_1C_1}$의 넓이는 $\dfrac12\times\dfrac15\times\dfrac{\sqrt{15}}{10}=\dfrac{\sqrt{15}}{10^2}$이다.
      source_flow: g25.pdf p.64 예시답안 문제 4(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        그리고 삼각형 $\mathrm{A_nB_nC_n}$과 삼각형 $\mathrm{A_{n+1}B_{n+1}C_{n+1}}$의 닮음비는 $1:\dfrac25$이므로, 넓이의 비는 $1:\left(\dfrac25\right)^2$이다. 따라서 삼각형 $\mathrm{A_nB_nC_n}$의 넓이는 $\dfrac{\sqrt{15}}{10^2}\left(\dfrac25\right)^{2(n-1)}$이다.
      source_flow: g25.pdf p.64 예시답안 문제 4(2)
      criteria:
      - 2.M3
    - id: 2b-4
      content: |
        그러므로 도형 $R_n$으로부터 도형 $R_{n+1}$을 얻는 과정에서 새로 그려지는 모든 이등변삼각형의 넓이의 합 $x_n$은 $x_n=N_n\times\dfrac{\sqrt{15}}{10^2}\left(\dfrac25\right)^{2(n-1)}=6\times4^{n-1}\times\dfrac{\sqrt{15}}{10^2}\left(\dfrac25\right)^{2(n-1)}=6\times\dfrac{\sqrt{15}}{10^2}\left(\dfrac45\right)^{2(n-1)}$
      source_flow: g25.pdf p.64 예시답안 문제 4(2)
      criteria:
      - 2.M4
    - id: 2b-5
      content: 따라서 $x_1=6\times\dfrac{\sqrt{15}}{10^2}$이고, 수열 $\{x_n\}$의 공비는 $\dfrac{16}{25}$이다.
      source_flow: g25.pdf p.64 예시답안 문제 4(2)
      criteria:
      - 2.A1
