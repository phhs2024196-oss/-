- id: '3'
  stem: (3) 도형 $R_n$의 넓이를 $S_n$이라 할 때, $\displaystyle\lim_{n\to\infty}S_n$을 구하시오. [15점]
  points: 15
  depends_on: []
  answer:
    kind: value
    value: 3*sqrt(3)/2-sqrt(15)/6
    equivalents:
    - $\frac{3\sqrt3}{2}-\frac{\sqrt{15}}{6}$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $S_{n+1}=S_n-x_n$이므로 $\lim S_n=S_1-\sum x_n=S_1-\frac{x_1}{1-r}$.
    steps:
    - id: 3a
      content: |
        $S_1=\frac{3\sqrt3}{2}$, $\sum x_n=6\cdot\frac{\sqrt{15}}{10^2}\cdot\frac{25}{9}=\frac{\sqrt{15}}{6}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        도형 $R_1$은 한 변의 길이가 1인 정육각형이므로 그 넓이 $S_1$은 $S_1=6\times\dfrac12\times1\times\dfrac{\sqrt3}{2}=\dfrac{3\sqrt3}{2}$이다.
      source_flow: g25.pdf p.64 예시답안 문제 4(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        도형 $R_{n+1}$의 넓이 $S_{n+1}$은 도형 $R_n$의 넓이 $S_n$에서 (2)에서 구한 $x_n$을 뺀 값이므로 $S_2=S_1-x_1$, $S_3=S_2-x_2=S_1-(x_1+x_2)$, $S_4=S_3-x_3=S_1-(x_1+x_2+x_3)$, $\vdots$ 이다.
      source_flow: g25.pdf p.64 예시답안 문제 4(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: 따라서 $n\ge2$일 때 $S_n=S_1-\displaystyle\sum_{k=1}^{n-1}x_k$이다.
      source_flow: g25.pdf p.64 예시답안 문제 4(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        그러므로 $\displaystyle\lim_{n\to\infty}S_n=S_1-\sum_{k=1}^{\infty}x_n=S_1-x_1\times\dfrac1{1-r}=S_1-6\times\dfrac{\sqrt{15}}{10^2}\times\dfrac1{1-\dfrac{16}{25}}=S_1-\dfrac{\sqrt{15}}{6}=\dfrac{3\sqrt3}{2}-\dfrac{\sqrt{15}}{6}$
      source_flow: g25.pdf p.64 예시답안 문제 4(3)
      criteria:
      - 3.A1
