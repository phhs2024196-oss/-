  - $b=d>0$일 때 $\displaystyle\sum_{k=1}^{10}\dfrac{1}{\sqrt{a_{k+1}}+\sqrt{a_k}}$
  concepts:
  - 수열의 합과 일반항의 관계 $a_n=S_n-S_{n-1}$
  - 등차수열의 일반항
  - 수열의 극한
  - 분모의 유리화와 소거되는 합
