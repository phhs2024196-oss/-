stem: |
  ※ <문제 1>에서부터 <문제 4>까지 총 4개의 문제가 있고, 각 문제마다 3개의 세부 문항이 있습니다. 답안지의 지정된 양식 안에 각 세부 문항 별로 해당 문항 번호를 쓰고 답을 작성하십시오. 수식과 논리를 명확히 전개하고 근거와 과정을 제시하십시오. (시험 시간: 100분, 답안 분량: 지정된 답안 양식 내 작성)

  수열 $\{a_n\},\ \{b_n\}$이 다음 조건을 만족시킨다.

  (가) 모든 자연수 $n$에 대해서 $\displaystyle\sum_{k=1}^{n}a_kb_k=n(n+1)(2n+1)$이다.

  (나) 수열 $\{b_n\}$은 첫째항이 $b$이고 공차가 $d$인 등차수열이다. (단, $d$는 $0$이 아닌 실수이다.)

  (다) 수열 $\{b_n\}$은 모든 자연수 $n$에 대하여 $b_n\ne0$이다.

  다음 물음에 답하시오. [총 25점]
