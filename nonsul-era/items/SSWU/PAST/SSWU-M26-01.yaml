intent: |
  수열의 합에서 수열의 일반항을 추론할 수 있는지 평가하며, 수열의 극한을 구할 수 있는지 평가한다. 수열의 합을 구할 수 있는지 평가한다.
key_idea: |
  $a_nb_n=S_n-S_{n-1}=6n^2$ ($n\ge2$)이고 $n=1$에서도 성립하므로 $a_n=\dfrac{6n^2}{b+(n-1)d}$이다. $\dfrac{a_n}{b_n}=\dfrac{6n^2}{b_n^2}$의 극한은 $\dfrac6{d^2}$이고, $b=d$이면 $a_n=\dfrac{6n}{d}$이므로 분모의 유리화로 합이 소거된다.
stuck: (1)에서 $\sum a_kb_k$의 차로 $a_nb_n$을 구하고 $n=1$일 때도 성립함을 확인하는 단계, (3)에서 $\dfrac1{\sqrt{a_{k+1}}+\sqrt{a_k}}$를 유리화해 합을 소거하는 단계
