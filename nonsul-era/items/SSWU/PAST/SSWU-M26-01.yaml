    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $a_nb_n=S_n-S_{n-1}=6n^2$ ($n\ge2$), $a_1b_1=6$이므로 $a_n=\dfrac{6n^2}{b+(n-1)d}$
    steps:
    - id: 1a
      content: $a_n=\dfrac{6n^2}{b+(n-1)d}$
      criteria:
      - 1.M1
      - 1.M2
      - 1.B1
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g26.pdf p.109 채점 기준(예시답안) 문제 1(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $b_n=b+(n-1)d$이고
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a_nb_n=\displaystyle\sum_{k=1}^{n}a_kb_k-\sum_{k=1}^{n-1}a_kb_k$ ($n\ge2$)이므로
      criteria:
      - 1.M1
    - id: 1b-3
      content: |
        $a_nb_n=n(n+1)(2n+1)-n(n-1)(2n-1)=6n^2$ ($n\ge2$)
      criteria:
      - 1.M2
    - id: 1b-4
      content: |
        $b_n\ne0$이므로 양변을 $b_n$으로 나누면 $a_n=\dfrac{6n^2}{b+(n-1)d}$ ($n\ge2$)
      criteria:
      - 1.B1
    - id: 1b-5
      content: |
        $a_1b_1=1\times2\times3=6$, $b_1=b$이므로 $a_1=\dfrac6b$이고 위 식은 $n=1$일 때도 성립하므로 $a_n=\dfrac{6n^2}{b+(n-1)d}$ ($n\ge1$)
      criteria:
      - 1.A1
