    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $a_n=\dfrac{6n^2}{b+(n-1)d}$에서 $b=d$이므로 $a_n=\dfrac{6n^2}{nd}=\dfrac{6n}{d}$
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\sqrt{a_{k+1}}-\sqrt{a_k}\ne0$이므로
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $\displaystyle\sum_{k=1}^{10}\dfrac{1}{\sqrt{a_{k+1}}+\sqrt{a_k}}=\sum_{k=1}^{10}\dfrac{\sqrt{a_{k+1}}-\sqrt{a_k}}{a_{k+1}-a_k}$
      criteria:
      - 3.M2
    - id: 3b-4
      content: |
        $a_{k+1}-a_k=\dfrac6d$이므로
      criteria:
      - 3.B1
    - id: 3b-5
      content: |
        $\dfrac d6\displaystyle\sum_{k=1}^{10}\left(\sqrt{a_{k+1}}-\sqrt{a_k}\right)=\dfrac d6\left(\sqrt{a_{11}}-\sqrt{a_1}\right)=\sqrt{\dfrac d6}\left(\sqrt{11}-1\right)=\dfrac{\sqrt{6d}\left(\sqrt{11}-1\right)}{6}$
      criteria:
      - 3.A1
