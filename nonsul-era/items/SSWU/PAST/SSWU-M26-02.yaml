- id: '3'
  stem: |
    (3) 함수 $v(t)$가 $t\ge0$에서 연속이고 $t>0$에서 $t=1$을 제외하고 미분가능할 때, 시각 $t=0$에서 원점을 출발한 점 $\mathrm{P}$가 $2<t<8$에서 적어도 한 번 원점을 다시 통과하는 것을 보이시오. (단, $e$는 자연상수이고, $2<e<3$이다.)
  points: 10
  depends_on:
  - '1'
  - '2'
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a=-10,\ b=6,\ c=4e$이고 $D(2)=-\dfrac12<0$, $D(8)=-\dfrac12+32-\dfrac{48}e>0$이므로 사잇값 정리
    steps:
    - id: 3a
      content: 증명
      criteria:
      - 3.M1
      - 3.B1
      - 3.B2
      - 3.M2
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g26.pdf p.111 채점 기준(예시답안) 문제 2(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $v(t)$가 $t\ge0$에서 연속이므로 $a-b=-16,\ b-e^{-1}c=2$를 만족한다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $v(t)$가 $t=2$에서 미분가능하므로 $c=4e$이다. 따라서 $b=6,\ a=-10$이다.
      criteria:
      - 3.B1
    - id: 3b-3
      content: |
        이때 $\displaystyle\int_0^2v(t)dt=\int_0^1v(t)dt+\int_1^2v(t)dt=\int_0^1(15t^2-10)dt+\int_1^2(-t+6)dt=-5+\dfrac92=-\dfrac12$
      criteria:
      - 3.B2
    - id: 3b-4
      content: |
        또한 $\displaystyle\int_2^8v(t)dt=4e\int_2^8e^{-\sqrt{t/2}}dt=16e\int_1^2xe^{-x}dx=16e\times\dfrac{2e-3}{e^2}=32-\dfrac{48}{e}>8$ ($\because\ 2<e<3$)
      criteria:
      - 3.M2
    - id: 3b-5
      content: |
        거리를 나타내는 함수 $D(t)=\displaystyle\int_0^tv(s)ds$가 $t\ge0$에서 연속이고, $D(2)<0<D(8)$이므로 사잇값 정리에 의해 원점에서 출발한 점 $\mathrm{P}$가 $2<t<8$일 때, 원점을 적어도 한 번 다시 통과한다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
