- id: '2'
  stem: |
    (2) 함수 $v(t)$가 $t=2$에서 미분가능할 때, 미분계수의 정의를 이용하여 실수 $c$의 값을 구하시오.
  points: 10
  depends_on:
  - '1'
  answer:
    kind: value
    value: 4*e
    equivalents:
    - $c=4e$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: 좌미분계수 $-1$, 우미분계수 $f\,'(2)=-\dfrac{c}{4e}$가 같을 조건
    steps:
    - id: 2a
      content: $c=4e$
      criteria:
      - 2.M1
      - 2.M2
      - 2.M3
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g26.pdf p.111 채점 기준(예시답안) 문제 2(2)
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $v(t)$가 $t=2$에서 미분가능하기 위해서는 $\displaystyle\lim_{h\to0-}\dfrac{v(2+h)-v(2)}{h}=\lim_{h\to0+}\dfrac{v(2+h)-v(2)}{h}$를 만족해야 한다.
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\displaystyle\lim_{h\to0-}\dfrac{v(2+h)-v(2)}{h}=-1$이고,
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $f(t)=ce^{-\sqrt{t/2}}$라고 하면 $\displaystyle\lim_{h\to0+}\dfrac{v(2+h)-v(2)}{h}=\lim_{h\to0+}\dfrac{ce^{-\sqrt{\frac{2+h}{2}}}-ce^{-\sqrt{\frac22}}}{h}=f'(2)$
      criteria:
      - 2.M3
    - id: 2b-4
      content: |
        $f'(t)=-\dfrac{c}{2\sqrt{2t}}e^{-\sqrt{t/2}}$이므로
      criteria:
      - 2.M3
    - id: 2b-5
      content: |
        $-\dfrac{c}{4e}=-1$. 따라서 $c=4e$.
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        미분가능 조건으로 좌미분계수와 우미분계수가 같음 (미분계수의 정의)을 세웠다.
      depends_on: []
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $t=2$에서 좌미분계수 $-1$을 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-2
    - id: 2.M3
      mark_type: M
      points: 4
      evidence: |
        우미분계수가 $f'(2)$ ($f(t)=ce^{-\sqrt{t/2}}$)와 같음을 보이고 $f'(t)=-\dfrac{c}{2\sqrt{2t}}e^{-\sqrt{t/2}}$를 구했다.
      depends_on:
      - 2.M1
      steps:
      - 2b-3
      - 2b-4
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        $-\dfrac{c}{4e}=-1$에서 $c=4e$를 구했다.
      depends_on:
      - 2.M2
      - 2.M3
      steps:
      - 2b-5
    deductions: []
