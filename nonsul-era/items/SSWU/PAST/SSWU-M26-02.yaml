      points: 2
      evidence: |
        $c=4e$, $b=6$, $a=-10$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.B2
      mark_type: B
      points: 2
      evidence: |
        $\int_0^2v(t)dt=-\dfrac12$를 구했다.
      depends_on:
      - 3.B1
      steps:
      - 3b-3
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: |
        $\int_2^8v(t)dt=32-\dfrac{48}{e}>8$를 보였다. (치환적분과 $2<e<3$ 사용)
      depends_on:
      - 3.B1
      steps:
      - 3b-4
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: |
        $D(t)$의 연속성과 $D(2)<0<D(8)$로부터 사잇값 정리를 적용해 결론을 맺었다.
      depends_on:
      - 3.B2
