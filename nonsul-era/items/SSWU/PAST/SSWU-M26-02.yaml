stimuli: []
stem: |
  수직선 위를 움직이는 점 $\mathrm{P}$의 시각 $t\ (t\ge0)$에서의 속도 $v(t)$가

  $$v(t)=\begin{cases}15t^2+a&(0\le t<1)\\-t+b&(1\le t\le2)\\ce^{-\sqrt{t/2}}&(t>2)\end{cases}$$

  이고, 점 $\mathrm{P}$는 시각 $t=0$일 때, 원점에 위치한다. 다음 물음에 답하시오. (단, $a,\ b,\ c$는 실수이다.) [총 25점]
subparts:
- id: '1'
  stem: |
    (1) 함수 $v(t)$가 $t\ge0$에서 연속일 때, $a$와 $b$의 관계식 및 $b$와 $c$의 관계식을 구하시오.
  points: 5
  depends_on: []
  answer:
    kind: expression
    value: a-b=-16; b-c*exp(-1)=2
    equivalents:
    - $a-b=-16$, $b-e^{-1}c=2$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '$t=1$에서 연속: $15+a=-1+b$, $t=2$에서 연속: $-2+b=ce^{-1}$'
    steps:
    - id: 1a
      content: $a-b=-16$, $b-e^{-1}c=2$
      criteria:
      - 1.M1
      - 1.B1
      - 1.B2
  - id: S1-B
    audience: B
    source_flow: g26.pdf p.110 채점 기준(예시답안) 문제 2(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $v(t)$가 $t\ge0$에서 연속이기 위한 필요충분조건은 $v(t)$가 $t=1,\ t=2$에서 연속인 것이다.
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $v(t)$가 $t=1$에서 연속이면 $\displaystyle\lim_{t\to1-}v(t)=\lim_{t\to1+}v(t)=v(1)$을 만족해야 하므로
      criteria:
      - 1.B1
    - id: 1b-3
      content: |
        $15+a=-1+b$ 따라서 $a-b=-16$이다.
      criteria:
      - 1.B1
    - id: 1b-4
      content: |
        $v(t)$가 $t=2$에서 연속이면 $\displaystyle\lim_{t\to2-}v(t)=\lim_{t\to2+}v(t)=v(2)$를 만족해야 하므로
      criteria:
      - 1.B2
    - id: 1b-5
      content: |
        $-2+b=ce^{-1}$. 따라서 $b-e^{-1}c=2$이다.
      criteria:
      - 1.B2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 1
      evidence: |
        $t=1,\ 2$에서의 연속이 $t\ge0$에서 연속일 필요충분조건임을 밝혔다.
      depends_on: []
      steps:
      - 1b-1
    - id: 1.B1
      mark_type: B
      points: 2
      evidence: |
