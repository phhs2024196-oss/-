intent: |
  주어진 한 점 또는 구간에서 함수의 연속과 미분가능의 의미를 알고 있는지 평가하며, 사잇값 정리를 이용하여 문제를 해결할 수 있는지 평가한다.
key_idea: |
  연속 조건으로 $a-b=-16$, $b-e^{-1}c=2$를 얻고, $t=2$에서 좌미분계수 $-1$과 우미분계수 $-\dfrac{c}{4e}$가 같을 조건으로 $c=4e$를 구한다. $D(t)=\int_0^tv(s)ds$가 연속이고 $D(2)<0<D(8)$이므로 사잇값 정리를 적용한다.
stuck: (2)에서 $t>2$ 쪽의 우미분계수를 $f(t)=ce^{-\sqrt{t/2}}$의 $t=2$에서의 미분계수로 보는 단계, (3)에서 $\int_2^8v(t)dt$를 치환적분으로 계산해 $8$보다 큼을 $2<e<3$으로 보이는 단계
