      depends_on:
      - 1.M1
      steps:
      - 1b-2
      - 1b-3
    - id: 1.B2
      mark_type: B
      points: 2
      evidence: |
        $t=2$에서의 연속 조건으로 $b-e^{-1}c=2$를 구했다.
      depends_on:
      - 1.M1
      steps:
      - 1b-4
      - 1b-5
    deductions: []
