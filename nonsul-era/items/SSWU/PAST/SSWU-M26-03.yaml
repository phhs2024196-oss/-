stimuli: []
stem: |
  실수 전체의 집합에서 정의된 함수 $f(x)$와 양의 실수 전체의 집합에서 정의된 함수 $g(x)$를

  $$f(x)=2^x,\ g(x)=\log_2x$$

  라 하자. 다음 물음에 답하시오. [총 25점]
subparts:
- id: '1'
  stem: |
    (1) 자연수 $n$에 대하여 두 곡선 $y=f(x),\ y=g(x)$와 직선 $y=-x+n+2^n,\ y=-x+1$으로 둘러싸인 부분의 넓이를 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: 2*(2**n-1)/log(2) + (2**n*(2**n-2*n)-n**2-1)/2
    equivalents:
    - $\dfrac{2(2^n-1)}{\ln2}+\dfrac{2^n(2^n-2n)-n^2-1}{2}$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '넓이=(가)+(나)−(다)−(라): $\dfrac{2^n-1}{\ln2}+\dfrac12(2^n-n)(n+2^n)-\left(n2^n-\dfrac{2^n-1}{\ln2}\right)-\dfrac12$'
    steps:
    - id: 1a
      content: $\dfrac{2(2^n-1)}{\ln2}+\dfrac{2^n(2^n-2n)-n^2-1}{2}$
      criteria:
      - 1.M1
      - 1.M2
      - 1.M3
      - 1.B1
      - 1.A1
  - id: S1-B
    audience: B
    source_flow: g26.pdf p.112 채점 기준(예시답안) 문제 3(1)
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        (가) $x$축과 $y$축, $x=n$, $y=2^x$으로 둘러싸인 부분의 넓이는 $\displaystyle\int_0^n2^xdx=\left[\dfrac{2^x}{\ln2}\right]_0^n=\dfrac{2^n-1}{\ln2}$
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        (나) $x$축과 $x=n$, $x=2^n$, $y=-x+n+2^n$로 둘러싸인 부분은 사다리꼴이고 넓이는 $\dfrac12\times(2^n-n)\times(n+2^n)$
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        (다) $x$축과 $x=2^n$, $y=\log_2x$로 둘러싸인 부분의 넓이는 직선 $y=x$에 대하여 대칭이동하면 $y$축과 $y=2^n$, $y=2^x$로 둘러싸인 부분의 넓이와 같고 이는 $n\times2^n-\displaystyle\int_0^n2^xdx=n\times2^n-\dfrac{2^n-1}{\ln2}$이다. 또는 부분적분을 사용하여 적분하면 $\displaystyle\int_1^{2^n}\log_2x\,dx=\left[x\log_2x-\dfrac{x}{\ln2}\right]_1^{2^n}=n\times2^n-\dfrac{2^n-1}{\ln2}$
      criteria:
      - 1.M3
    - id: 1b-4
      content: |
        (라) $x$축과 $y$축, $y=-x+1$로 둘러싸인 부분의 넓이는 $\dfrac12$
      criteria:
      - 1.B1
    - id: 1b-5
      content: |
        따라서 구하는 넓이는 (가)+(나)−(다)−(라)이므로 $\dfrac{2(2^n-1)}{\ln2}+\dfrac{2^n(2^n-2n)-n^2-1}{2}$이다.
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: |
        (가) $\int_0^n2^xdx=\dfrac{2^n-1}{\ln2}$를 구했다.
      depends_on: []
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 2
      evidence: |
        (나) 사다리꼴의 넓이 $\dfrac12(2^n-n)(n+2^n)$를 구했다.
      depends_on: []
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 2
      evidence: |
        (다) 역함수 대칭(또는 부분적분)으로 $n2^n-\dfrac{2^n-1}{\ln2}$를 구했다.
      depends_on: []
      steps:
      - 1b-3
    - id: 1.B1
      mark_type: B
      points: 1
      evidence: |
        (라) 넓이 $\dfrac12$을 구했다.
      depends_on: []
      steps:
      - 1b-4
    - id: 1.A1
      mark_type: A
      points: 1
      evidence: |
        (가)+(나)−(다)−(라)로 최종 넓이를 구했다.
      depends_on:
      - 1.M1
      - 1.M2
      - 1.M3
      steps:
      - 1b-5
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (2) $0$보다 크거나 같은 정수 $n$에 대하여 곡선 $y=g(x)$ 위의 점 $(2^n,\ g(2^n))$에서의 접선의 방정식과 곡선 $y=f(x)$ 위의 점 $(g(2^n),\ f(g(2^n)))$에서의 접선의 방정식을 각각 구하고, $n=0$인 경우 이 두 접선과 직선 $y=-x+n+2^n$으로 둘러싸인 삼각형의 넓이를 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: l1=(x-2**n)/(2**n*log(2))+n; l2=2**n*log(2)*(x-n)+2**n; area=(1+log(2))/(2-2*log(2))
    equivalents:
    - $y=\dfrac{1}{2^n\ln2}(x-2^n)+n$, $y=2^n\ln2\,(x-n)+2^n$, 넓이 $\dfrac{1+\ln2}{2-\ln4}$
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: '두 접선: $y=\dfrac{x-2^n}{2^n\ln2}+n$, $y=2^n\ln2(x-n)+2^n$. $n=0$이면 $y=\dfrac{x-1}{\ln2}$, $y=\ln2\,x+1$, $y=-x+1$'
    steps:
    - id: 2a
      content: 넓이 $\dfrac{1+\ln2}{2-\ln4}$
      criteria:
      - 2.M1
      - 2.M2
      - 2.B1
      - 2.A1
  - id: S2-B
    audience: B
    source_flow: g26.pdf p.112 채점 기준(예시답안) 문제 3(2)~113
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $(2^n,g(2^n))$에서 곡선 $y=g(x)$의 접선의 방정식은 $g'(2^n)=\dfrac{1}{2^n\ln2}$이고 $g(2^n)=n$이므로 $y=\dfrac{1}{2^n\ln2}(x-2^n)+n$
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        점 $(g(2^n),f(g(2^n)))$에서 곡선 $y=f(x)$의 접선의 방정식은 $g(2^n)=n$, $f(g(2^n))=2^n$, $f'(n)=2^n\ln2$이므로 $y=2^n\ln2\,(x-n)+2^n$
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $n=0$일 때, 두 접선은 $y=\dfrac{1}{\ln2}(x-1)$과 $y=\ln2\,x+1$이므로 두 직선의 교점은 $\left(\dfrac{1}{1-\ln2},\ \dfrac{1}{1-\ln2}\right)$이고
      criteria:
      - 2.B1
    - id: 2b-4
      content: |
        삼각형의 넓이는 $\left(\dfrac1{1-\ln2}\right)^2-\left(\dfrac{1}{1-\ln2}-1\right)\left(\dfrac1{1-\ln2}\right)-\dfrac12=\dfrac{1+\ln2}{2(1-\ln2)}=\dfrac{1+\ln2}{2-\ln4}$이다. (또는, 삼각형의 밑변의 길이는 $\sqrt2$이고 높이는 $\sqrt2\left(\dfrac{1}{1-\ln2}-\dfrac12\right)$이므로 넓이는 $\dfrac12\times\sqrt2\times\sqrt2\left(\dfrac1{1-\ln2}-\dfrac12\right)=\dfrac{1+\ln2}{2-\ln4}$이다.)
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: |
        $y=g(x)$의 접선 $y=\dfrac{1}{2^n\ln2}(x-2^n)+n$를 구했다.
      depends_on: []
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 2
      evidence: |
        $y=f(x)$의 접선 $y=2^n\ln2\,(x-n)+2^n$를 구했다.
      depends_on: []
      steps:
      - 2b-2
    - id: 2.B1
      mark_type: B
      points: 2
      evidence: |
        $n=0$일 때 두 접선의 교점 $\left(\dfrac1{1-\ln2},\dfrac1{1-\ln2}\right)$를 구했다.
      depends_on:
      - 2.M1
      - 2.M2
      steps:
      - 2b-3
    - id: 2.A1
      mark_type: A
      points: 2
      evidence: |
        삼각형의 넓이 $\dfrac{1+\ln2}{2-\ln4}$를 구했다.
      depends_on:
      - 2.M1
      - 2.M2
      - 2.B1
      steps:
      - 2b-4
    deductions: []
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (3) 수열 $\{a_n\},\ \{b_n\}$이 다음 조건을 만족시킨다.

    $a_1=g(2),\ a_n=g(2f(a_{n-1}))\ (n\ge2)$

    $b_1=f(0),\ b_n=f(-1+g(b_{n-1}))\ (n\ge2)$

    $s_n=\displaystyle\sum_{k=1}^{n}a_k$라 할 때, $\displaystyle\sum_{n=1}^{\infty}\dfrac1{s_n}$과 $\displaystyle\sum_{n=1}^{\infty}b_n$의 값을 각각 구하시오.
  points: 9
  depends_on: []
  answer:
    kind: value
    value: sum1=2; sum2=2
    equivalents:
    - $\sum\dfrac1{s_n}=2$, $\sum b_n=2$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $a_n=n$, $s_n=\dfrac{n(n+1)}2$, $\sum\dfrac1{s_n}=2$; $b_n$은 첫째항 $1$, 공비 $\dfrac12$인 등비수열, $\sum b_n=2$
    steps:
    - id: 3a
      content: $2$, $2$
      criteria:
      - 3.M1
      - 3.B1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g26.pdf p.113 채점 기준(예시답안) 문제 3(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $a_1=1$이고 $n\ge2$일 때 $a_n=g(2)+g(f(a_{n-1}))=1+a_{n-1}$이므로 $a_n$은 첫째항이 $1$이고 공차가 $1$인 등차수열이고 $a_n=n$이다.
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        따라서 $s_n=\displaystyle\sum_{k=1}^{n}k=\dfrac{n(n+1)}{2}$이고
      criteria:
      - 3.B1
    - id: 3b-3
      content: |
        $\displaystyle\sum_{n=1}^{\infty}\dfrac{2}{n(n+1)}=\lim_{k\to\infty}\sum_{n=1}^{k}2\left(\dfrac1n-\dfrac1{n+1}\right)=\lim_{k\to\infty}2\left(1-\dfrac1{k+1}\right)=2$이다.
      criteria:
      - 3.M2
    - id: 3b-4
      content: |
        $b_1=1$이고 $n\ge2$일 때 $b_n=f(-1)f(g(b_{n-1}))=\dfrac{b_{n-1}}{2}$이므로 수열 $b_n$은 첫째항이 $1$이고 공비가 $\dfrac12$인 등비수열이다.
      criteria:
      - 3.M3
    - id: 3b-5
      content: |
        따라서 $\displaystyle\sum_{n=1}^{\infty}b_n=\dfrac{1}{1-\frac12}=2$이다.
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: |
        $a_n=1+a_{n-1}$을 이용해 $a_n=n$임을 구했다.
      depends_on: []
      steps:
      - 3b-1
    - id: 3.B1
      mark_type: B
      points: 1
      evidence: |
        $s_n=\dfrac{n(n+1)}{2}$을 구했다.
      depends_on:
      - 3.M1
      steps:
      - 3b-2
    - id: 3.M2
      mark_type: M
