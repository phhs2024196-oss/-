intent: |
  지수함수와 로그함수의 의미를 알고 $f(x)=2^x$, $g(x)=\log_2x$가 서로 역함수 관계인 것을 이해한 후 미분을 활용하여 접선의 방정식을 구하고 정적분을 활용하여 넓이를 구할 수 있는지를 평가한다. 그리고 귀납적으로 정의된 수열이 등차수열 및 등비수열임을 알고, 이를 활용하여 급수의 합을 구할 수 있는지를 평가한다.
key_idea: |
  $y=2^x$와 $y=\log_2x$가 $y=x$에 대하여 대칭임을 이용해 넓이를 (가) $\int_0^n2^xdx$, (나) 사다리꼴, (다) $n2^n-\int_0^n2^xdx$, (라) $\frac12$의 합·차로 구한다. 접선은 $g^{\prime}(2^n)=\frac{1}{2^n\ln2}$, $f^{\prime}(n)=2^n\ln2$로 구한다. $a_n=1+a_{n-1}$, $b_n=\frac12b_{n-1}$로 등차·등비수열임을 이용한다.
stuck: (1)에서 로그함수 아래 넓이를 역함수 대칭으로 바꾸어 네 부분의 합·차로 나누는 단계, (3)에서 $a_n=g(2f(a_{n-1}))=1+a_{n-1}$로 단순화하는 단계
tags:
- 지수·로그함수의 역함수
- 접선의 방정식
- 정적분과 넓이
- 등차수열
- 등비급수
elements:
  materials:
  - $f(x)=2^x$, $g(x)=\log_2x$
  - 두 곡선과 직선 $y=-x+n+2^n$, $y=-x+1$로 둘러싸인 부분
  - $y=g(x)$ 위의 점 $(2^n,g(2^n))$와 $y=f(x)$ 위의 점 $(g(2^n),f(g(2^n)))$에서의 접선과 직선 $y=-x+n+2^n$이 이루는 삼각형
  - $a_1=g(2)$, $a_n=g(2f(a_{n-1}))$, $b_1=f(0)$, $b_n=f(-1+g(b_{n-1}))$
  concepts:
  - 지수함수와 로그함수의 역함수 관계(직선 $y=x$ 대칭)
  - 접선의 방정식
  - 정적분과 도형의 넓이
  - 귀납적으로 정의된 등차수열·등비수열
  - 급수의 합(부분분수, 등비급수)
  tools:
  - $\int_0^n2^xdx=\dfrac{2^n-1}{\ln2}$
  - $(\text{구하는 넓이})=(\text{가})+(\text{나})-(\text{다})-(\text{라})$
  - $\dfrac{2}{n(n+1)}=2\left(\dfrac1n-\dfrac1{n+1}\right)$
  - $g(2f(a))=1+a$, $f(-1+g(b))=\dfrac b2$
  conditions:
  - $n$은 자연수((1)), $0$보다 크거나 같은 정수((2))
  - (2)에서 삼각형은 $n=0$일 때
  - $s_n=\sum_{k=1}^{n}a_k$
  subpart_links: (1)~(3)은 서로 독립(공통 조건 $f(x)=2^x$, $g(x)=\log_2x$)
