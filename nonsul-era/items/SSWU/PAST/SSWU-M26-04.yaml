    method_no: 1
    steps:
    - id: 1b-1
      content: |
        각 $\mathrm{QAB}$의 크기를 $\theta$라디안이라 하면, $\mathrm{AB}$가 원의 지름이므로 각 $\mathrm{AQB}$와 각 $\mathrm{APB}$는 직각이고
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 삼각형 $\mathrm{AQB}$에서 $\cos\theta=\dfrac a2,\ \sin\theta=\dfrac{\sqrt{4-a^2}}{2}$이다.
      criteria:
      - 1.B1
    - id: 1b-3
      content: |
        삼각형 $\mathrm{ABP}$에서 $\cos2\theta=\dfrac{\overline{\mathrm{AP}}}{2}$이므로
      criteria:
      - 1.B2
    - id: 1b-4
      content: |
        $\overline{\mathrm{AP}}=2\cos2\theta=2(2\cos^2\theta-1)$
      criteria:
      - 1.B3
    - id: 1b-5
      content: |
        $\overline{\mathrm{AP}}=a^2-2$
      criteria:
      - 1.A1
