  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $\cos\theta=\dfrac{\sqrt{10}}4$에서 $\overline{\mathrm{AQ}}=\dfrac{\sqrt{10}}2$, $\overline{\mathrm{AP}}=\dfrac12$, $\overline{\mathrm{PQ}}=\dfrac{3\sqrt6}4$, 넓이 $\dfrac{\overline{\mathrm{AP}}\,\overline{\mathrm{AQ}}\,\overline{\mathrm{PQ}}}{4}$
    steps:
    - id: 3a
      content: $\dfrac{3\sqrt{15}}{32}$
      criteria:
      - 3.M1
      - 3.B1
      - 3.B2
      - 3.M2
      - 3.A1
  - id: S3-B
    audience: B
    source_flow: g26.pdf p.115 채점 기준(예시답안) 문제 4(3)
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        위의 (2)의 결과로부터 $\cos\theta=\dfrac{\sqrt{10}}{4}$이므로
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $\overline{\mathrm{AQ}}=a=2\cos\theta=\dfrac{\sqrt{10}}{2}$, $\overline{\mathrm{AP}}=2\cos2\theta=2(2\cos^2\theta-1)=a^2-2=\dfrac12$이고,
      criteria:
      - 3.B1
    - id: 3b-3
      content: |
        $\sin\theta=\dfrac{\sqrt6}{4},\ \cos2\theta=\dfrac14,\ \sin2\theta=\dfrac{\sqrt{15}}{4}$가 성립한다.
      criteria:
      - 3.B2
    - id: 3b-4
      content: |
        $\overline{\mathrm{PQ}}$는 밑변이 $\dfrac98$이고 높이가 $\overline{\mathrm{PH}}+\overline{\mathrm{QK}}$인 직각삼각형의 대각선이며 $\overline{\mathrm{PH}}+\overline{\mathrm{QK}}=\overline{\mathrm{AP}}\sin2\theta+\overline{\mathrm{AQ}}\sin\theta=\dfrac12\times\dfrac{\sqrt{15}}{4}+\dfrac{\sqrt{10}}{2}\times\dfrac{\sqrt6}{4}=\dfrac{3\sqrt{15}}{8}$이므로 피타고라스 정리에 의해 $\overline{\mathrm{PQ}}=\dfrac{3\sqrt6}{4}$이다.
      criteria:
      - 3.M2
    - id: 3b-5
      content: |
        삼각형 $\mathrm{PAQ}$의 넓이는 $\dfrac{\overline{\mathrm{AP}}\times\overline{\mathrm{AQ}}\times\overline{\mathrm{PQ}}}{4}=\dfrac{3\sqrt{15}}{32}$이다. (다른 풀이: 덧셈정리로 $\sin(\theta+2\theta)=\sin\theta\cos2\theta+\cos\theta\sin2\theta=\dfrac{3\sqrt6}{8}$, 넓이 $\dfrac12\times\overline{\mathrm{AP}}\times\overline{\mathrm{AQ}}\times\sin(\theta+2\theta)=\dfrac{3\sqrt{15}}{32}$)
      criteria:
      - 3.A1
