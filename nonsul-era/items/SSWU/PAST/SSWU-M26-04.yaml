stimuli: []
stem: |
  지름 $\mathrm{AB}$의 길이가 $2$인 원 위에 놓인 두 점 $\mathrm{P},\ \mathrm{Q}$는 다음 조건을 만족시킨다.

  (가) $\overline{\mathrm{AQ}}=a$ ($a$는 양의 실수)

  (나) $\angle\mathrm{PAB}=2\angle\mathrm{QAB}$

  (다) 선분 $\mathrm{AB}$와 선분 $\mathrm{PQ}$는 원의 내부의 한 점에서 만난다.

  [그림 1: 지름 $\mathrm{AB}$가 수평이고 $\mathrm{A}$가 왼쪽, $\mathrm{B}$가 오른쪽이다. 점 $\mathrm{P}$는 원의 위쪽 호, 점 $\mathrm{Q}$는 아래쪽 호 위에 있고 $\mathrm{AQ}$의 길이가 $a$로 표시되어 있다. 선분 $\mathrm{AP}$, $\mathrm{PB}$, $\mathrm{AQ}$, $\mathrm{QB}$, $\mathrm{PQ}$를 그렸고 $\mathrm{P}$에서 $\mathrm{AB}$에 내린 수선의 발 $\mathrm{H}$, $\mathrm{Q}$에서 $\mathrm{AB}$에 내린 수선의 발 $\mathrm{K}$($\mathrm{K}$는 $\mathrm{H}$보다 $\mathrm{B}$ 쪽)에 직각 표시가 있다.]

  다음 물음에 답하시오. [총 25점]
