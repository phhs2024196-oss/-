  - id: S2-B
    audience: B
    source_flow: g26.pdf p.114 채점 기준(예시답안) 문제 4(2)~115
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $\overline{\mathrm{HK}}=a\cos\theta-\overline{\mathrm{AP}}\cos2\theta$이고 $a=2\cos\theta$, $\overline{\mathrm{AP}}=2\cos2\theta$이므로
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $\overline{\mathrm{HK}}=2\cos^2\theta-2\cos^22\theta=2\cos^2\theta-2(2\cos^2\theta-1)^2$
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $=-8\left(\cos^2\theta-\dfrac58\right)^2+\dfrac98$
      criteria:
      - 2.B1
    - id: 2b-4
      content: |
        각 $\mathrm{PAB}$는 직각보다 작으므로 $2\theta<\dfrac\pi2$이고 따라서 $0<\theta<\dfrac\pi4$이다. 이 때, $\dfrac{\sqrt2}{2}<\cos\theta<1$이므로
      criteria:
      - 2.B2
    - id: 2b-5
      content: |
        선분 $\mathrm{HK}$의 길이의 최댓값은 $\cos\theta=\dfrac{\sqrt{10}}{4}$일 때 $\dfrac98$이다. (다른 풀이: $a$에 대한 식으로 $\overline{\mathrm{HK}}=\dfrac{a^2}{2}-\dfrac{\overline{\mathrm{AP}}^2}{2}=\dfrac12\{a^2-(a^2-2)^2\}=-\dfrac12\left(a^2-\dfrac52\right)^2+\dfrac98$, $\sqrt2<a<2$이므로 $2<a^2<4$이고 $a^2=\dfrac52$일 때 최댓값 $\dfrac98$)
      criteria:
      - 2.A1
