intent: |
  삼각함수의 뜻을 이해하고, 삼각함수의 덧셈정리를 이해하고 있는지를 평가한다. 그리고 주어진 선분의 길이를 삼각함수의 성질을 이용하여 함수로 표현하고, 이 함수의 변수의 범위를 정할 수 있고, 정의역이 제한된 함수의 최댓값을 구할 수 있는지를 평가한다. 마지막으로 삼각함수의 성질 또는 사인법칙 등을 이용하여 원에 내접하는 삼각형의 넓이를 구할 수 있는지를 평가한다.
key_idea: |
  $\angle\mathrm{QAB}=\theta$로 두면 $\overline{\mathrm{AQ}}=2\cos\theta$, $\overline{\mathrm{AP}}=2\cos2\theta$이다. $\overline{\mathrm{HK}}=a\cos\theta-\overline{\mathrm{AP}}\cos2\theta=-8\left(\cos^2\theta-\frac58\right)^2+\frac98$이고 $\frac{\sqrt2}{2}<\cos\theta<1$에서 $\cos\theta=\frac{\sqrt{10}}{4}$일 때 최대이다.
stuck: (1)에서 지름에 대한 원주각이 직각임을 이용해 $\overline{\mathrm{AP}}=2\cos2\theta$를 얻는 단계, (2)에서 $\theta$의 범위($0<\theta<\frac\pi4$)를 정하는 단계
