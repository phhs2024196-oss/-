stem: 두 이차함수 $f(x)=x^2+4x+8$과 $g(x)=x^2-4x+16$에 대하여 직선 $y=ax+b$가 두 곡선 $y=f(x)$, $y=g(x)$에 모두 접할 때, 다음 물음에 답하시오. (단, $a$, $b$는 상수) [총 25점]
subparts:
- id: '1'
  stem: (1) 방정식 $f(x)=ax+b$와 방정식 $g(x)=ax+b$가 각각 중근을 가진다는 사실을 이용하여 $a$, $b$의 값을 각각 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: set
    value: a=2; b=7
    equivalents:
    - $a=2$, $b=7$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: '두 방정식의 판별식이 모두 0: $a^2-8a+4b-16=0$, $a^2+8a+4b-48=0$을 연립한다.'
    steps:
    - id: 1a
      content: $16a-32=0$이므로 $a=2$, $4b=-a^2+8a+16=28$이므로 $b=7$
      criteria:
      - 1.M1
      - 1.M2
      - 1.A1
      - 1.A2
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 방정식 $f(x)=ax+b$, 즉 $x^2+(4-a)x+8-b=0$은 중근을 가지므로 판별식 $D_1=0$. $D_1=(4-a)^2-4(8-b)=0$, 즉 $a^2-8a+4b-16=0$이다.
      source_flow: g27.pdf p.120 예시답안 문제 1(1)
      criteria:
      - 1.M1
    - id: 1b-2
      content: 방정식 $g(x)=ax+b$, 즉 $x^2-(4+a)x+16-b=0$도 중근을 가지므로 판별식 $D_2=0$. $D_2=(4+a)^2-4(16-b)=0$, 즉 $a^2+8a+4b-48=0$이다.
      source_flow: g27.pdf p.120 예시답안 문제 1(1)
      criteria:
      - 1.M2
    - id: 1b-3
      content: 두 식을 연립하면 $16a-32=0$이므로 $a=2$이고,
      source_flow: g27.pdf p.120 예시답안 문제 1(1)
      criteria:
      - 1.A1
    - id: 1b-4
      content: $4b=-a^2+8a+16=28$이므로 $b=7$이다.
      source_flow: g27.pdf p.120 예시답안 문제 1(1)
      criteria:
      - 1.A2
