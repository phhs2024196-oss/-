- id: '3'
  stem: (3) 직선 $y=ax+b$, 곡선 $y=f(x)$, 곡선 $y=g(x)$로 둘러싸인 부분의 넓이를 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 16/3
    equivalents:
    - $\frac{16}{3}$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: 교점 $x=1$을 경계로 $[-1,1]$에서 $f-(2x+7)$, $[1,3]$에서 $g-(2x+7)$을 적분한다.
    steps:
    - id: 3a
      content: $\int_{-1}^1(x+1)^2dx+\int_1^3(x-3)^2dx=\frac83+\frac83=\frac{16}3$
      criteria:
      - 3.M1
      - 3.M2
      - 3.A1
      - 3.A2
      - 3.A3
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: 먼저 두 곡선 $y=f(x)$와 $y=g(x)$의 교점의 $x$좌표를 구하면 $x^2+4x+8=x^2-4x+16$에서 $8x=8$, 즉 $x=1$이다.
      source_flow: g27.pdf p.120 예시답안 문제 1(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: 따라서 넓이는 $\displaystyle\int_{-1}^1\{f(x)-(2x+7)\}dx+\int_1^3\{g(x)-(2x+7)\}dx$이다.
      source_flow: g27.pdf p.121 예시답안 문제 1(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: $\displaystyle\int_{-1}^1\{f(x)-(2x+7)\}dx=\int_{-1}^1(x+1)^2dx=\left[\frac{(x+1)^3}{3}\right]_{-1}^1=\frac83$
      source_flow: g27.pdf p.121 예시답안 문제 1(3)
      criteria:
      - 3.A1
    - id: 3b-4
      content: $\displaystyle\int_1^3\{g(x)-(2x+7)\}dx=\int_1^3(x-3)^2dx=\left[\frac{(x-3)^3}{3}\right]_1^3=\frac83$
      source_flow: g27.pdf p.121 예시답안 문제 1(3)
      criteria:
      - 3.A2
    - id: 3b-5
      content: 따라서 직선 $y=2x+7$과 곡선 $y=f(x)$ 및 곡선 $y=g(x)$로 둘러싸인 부분의 넓이는 $\dfrac83+\dfrac83=\dfrac{16}3$이다.
      source_flow: g27.pdf p.121 예시답안 문제 1(3)
      criteria:
      - 3.A3
    # 채점기준: 가이드북은 등급제(1~7등급)와 단계(①~⑤) 서술만 공개 — 아래 단계별 배점은 추정
