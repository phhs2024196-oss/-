      content: $\displaystyle\lim_{\theta\to0+}\frac{\sin\theta}{\theta}=1$이고, $\displaystyle\lim_{\theta\to0+}\sin(\alpha-\theta)=\sin\alpha=\frac45$이므로
      source_flow: g27.pdf p.121 예시답안 문제 2(2)
      criteria:
      - 2.M2
    - id: 2b-3
      content: $\displaystyle\lim_{\theta\to0+}\frac{S(\theta)}{\theta}=\lim_{\theta\to0+}40\frac{\sin\theta}{\theta}\sin(\alpha-\theta)=40\times1\times\frac45=32$이다.
      source_flow: g27.pdf p.121 예시답안 문제 2(2)
