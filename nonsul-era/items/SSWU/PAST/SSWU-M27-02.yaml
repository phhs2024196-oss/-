- id: '3'
  stem: (3) $T(\theta)$가 최대일 때 $\sin\theta$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: sqrt(2)/10
    equivalents:
    - $\frac{\sqrt2}{10}$
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: $T(\theta)=25\sin(\alpha-\theta)\cos(\alpha-\theta)=\frac{25}2\sin2(\alpha-\theta)$가 최대이려면 $\alpha-\theta=\frac\pi4$, $\sin\theta=\sin\left(\alpha-\frac\pi4\right)$.
    steps:
    - id: 3a
      content: $\sin\theta=\sin\alpha\cos\frac\pi4-\cos\alpha\sin\frac\pi4=\frac45\cdot\frac{\sqrt2}2-\frac35\cdot\frac{\sqrt2}2=\frac{\sqrt2}{10}$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.M4
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: 삼각형 $\mathrm{PAO}$의 넓이는 $T(\theta)=\dfrac12\times\overline{\mathrm{AO}}\times\overline{\mathrm{AP}}\times\sin(\angle\mathrm{PAO})=\dfrac12\times\overline{\mathrm{AO}}\times\overline{\mathrm{AP}}\times\sin\left(\dfrac\pi2-\alpha+\theta\right)$이므로
      source_flow: g27.pdf p.122 예시답안 문제 2(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: $T(\theta)=\dfrac12\times5\times10\sin(\alpha-\theta)\times\cos(\alpha-\theta)=25\sin(\alpha-\theta)\cos(\alpha-\theta)$이다.
      source_flow: g27.pdf p.122 예시답안 문제 2(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: 여기에서 삼각함수의 덧셈정리를 적용하면 $T(\theta)=\dfrac{25}2\sin(2(\alpha-\theta))$이다.
      source_flow: g27.pdf p.122 예시답안 문제 2(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: 그리고 $0<\alpha-\theta<\alpha$이며, $\alpha$는 $\dfrac\pi4<\alpha<\dfrac\pi3$인 상수이므로 ($\because\ \dfrac{\sqrt2}2<\sin\alpha=\dfrac45<\dfrac{\sqrt3}2$), $\alpha-\theta=\dfrac\pi4$일 때, 즉 $2(\alpha-\theta)=\dfrac\pi2$일 때, $T(\theta)$는 최댓값을 갖는다.
      source_flow: g27.pdf p.122 예시답안 문제 2(3)
      criteria:
      - 3.M4
    - id: 3b-5
      content: 이때 $\theta=\alpha-\dfrac\pi4$이므로 삼각함수의 덧셈정리에 의하여 $\sin\theta=\sin\left(\alpha-\dfrac\pi4\right)=\sin\alpha\cos\dfrac\pi4-\cos\alpha\sin\dfrac\pi4=\dfrac45\times\dfrac{\sqrt2}2-\dfrac35\times\dfrac{\sqrt2}2=\dfrac{\sqrt2}{10}$이다.
      source_flow: g27.pdf p.122 예시답안 문제 2(3)
      criteria:
      - 3.A1
