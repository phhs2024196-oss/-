stimuli: []
stem: |
  중심이 점 $\mathrm{O}$이고 반지름의 길이가 $5$인 원 위의 두 점 $\mathrm{A}$, $\mathrm{B}$가 $\overline{\mathrm{AB}}=8$을 만족시키고, 점 $\mathrm{P}$가 작은 호 $\mathrm{AB}$ 위를 움직인다. $\angle\mathrm{PAB}=\theta$라 하고, 삼각형 $\mathrm{PAB}$의 넓이를 $S(\theta)$, 삼각형 $\mathrm{PAO}$의 넓이를 $T(\theta)$라 할 때, 다음 물음에 답하시오. (단, 점 $\mathrm{P}$는 점 $\mathrm{A}$와 $\mathrm{B}$가 아니다.) [총 25점]

  [그림 1: 중심 O, 반지름 5인 원. 현 AB(길이 8)가 수평이고 O는 AB 위쪽에 있으며, 점 P는 AB 아래쪽의 작은 호 위에 있다. 선분 OA(길이 5), AB(길이 8), AP, BP, PAB 꼭짓점 A에서의 각 $\theta$를 표시.]
subparts:
- id: '1'
  stem: (1) 선분 $\mathrm{AB}$의 중점을 $\mathrm{M}$이라 하고 $\angle\mathrm{AOM}=\alpha$라고 할 때 $\sin\alpha$의 값을 구하고, 또 선분 $\mathrm{AP}$의 길이를 $\theta$와 $\alpha$를 이용하여 나타내시오.
  points: 8
  depends_on: []
  answer:
    kind: set
    value: sin_alpha=4/5; AP=10*sin(alpha-theta)
    equivalents:
    - $\sin\alpha=\frac45$, $\overline{\mathrm{AP}}=10\sin(\alpha-\theta)$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $\sin\alpha=\frac{\overline{\mathrm{AM}}}{\overline{\mathrm{OA}}}=\frac45$, $\angle\mathrm{BPA}=\pi-\alpha$이므로 $\angle\mathrm{ABP}=\alpha-\theta$, 사인법칙에서 $\overline{\mathrm{AP}}=10\sin(\alpha-\theta)$.
    steps:
    - id: 1a
      content: $\overline{\mathrm{AP}}=2\times5\times\sin(\angle\mathrm{ABP})=10\sin(\alpha-\theta)$
      criteria:
      - 1.B1
      - 1.M1
      - 1.M2
      - 1.A1
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: 직각삼각형 $\mathrm{AOM}$에서 $\sin\alpha=\dfrac45$이다.
      source_flow: g27.pdf p.121 예시답안 문제 2(1)
      criteria:
      - 1.B1
    - id: 1b-2
      content: 원주각과 중심각의 관계에 의하여 $\angle\mathrm{BPA}=\pi-\alpha$이고,
      source_flow: g27.pdf p.121 예시답안 문제 2(1)
      criteria:
      - 1.M1
    - id: 1b-3
      content: 삼각형 $\mathrm{PAB}$에서 $\angle\mathrm{ABP}=\pi-(\angle\mathrm{PAB}+\angle\mathrm{BPA})=\pi-(\pi-\alpha+\theta)=\alpha-\theta$이다.
      source_flow: g27.pdf p.121 예시답안 문제 2(1)
      criteria:
      - 1.M2
    - id: 1b-4
      content: 한편, 사인법칙에 의하여 $\dfrac{\overline{\mathrm{AP}}}{\sin(\angle\mathrm{ABP})}=2\times(\text{외접원의 반지름})=10$이므로 $\overline{\mathrm{AP}}=10\sin(\angle\mathrm{ABP})=10\sin(\alpha-\theta)$이다.
      source_flow: g27.pdf p.121 예시답안 문제 2(1)
      criteria:
      - 1.A1
    # 채점기준: 가이드북은 등급제(1~7등급)와 단계(①~⑤) 서술만 공개 — 아래 단계별 배점은 추정
