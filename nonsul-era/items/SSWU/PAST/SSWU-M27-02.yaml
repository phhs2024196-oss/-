intent: 삼각함수의 정의를 이용하여 $\sin\alpha$를 구하고, 원주각과 중심각의 관계를 이용하여 각을 찾은 후 사인법칙을 활용하여 삼각형의 변의 길이를 구할 수 있는지 확인한다. 그리고 삼각함수를 활용하여 삼각형의 넓이를 구한 후 삼각함수의 극한을 구할 수 있는지, 삼각함수의 덧셈정리와 삼각함수의 그래프를 활용하여 삼각형의 넓이가 최대가 될 때를 찾을 수 있는지 확인한다.
