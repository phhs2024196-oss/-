- id: '2'
  stem: (2) $\displaystyle\lim_{\theta\to0+}\frac{S(\theta)}{\theta}$의 값을 구하시오.
  points: 7
  depends_on: []
  answer:
    kind: value
    value: '32'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-A
    audience: A
    method_no: 1
    key_idea: $S(\theta)=\frac12\overline{\mathrm{AB}}\,\overline{\mathrm{AP}}\sin\theta=40\sin(\alpha-\theta)\sin\theta$이므로 $\lim\frac{S}{\theta}=40\sin\alpha=32$.
    steps:
    - id: 2a
      content: $\lim_{\theta\to0+}40\frac{\sin\theta}{\theta}\sin(\alpha-\theta)=40\times1\times\frac45=32$
      criteria:
