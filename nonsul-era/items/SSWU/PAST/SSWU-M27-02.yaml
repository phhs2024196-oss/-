      content: $S(\theta)=\dfrac12\times\overline{\mathrm{AB}}\times\overline{\mathrm{AP}}\times\sin\theta$로 구할 수 있으므로 $S(\theta)=\dfrac12\times8\times10\sin(\alpha-\theta)\times\sin\theta=40\sin(\alpha-\theta)\times\sin\theta$이다.
      source_flow: g27.pdf p.121 예시답안 문제 2(2)
