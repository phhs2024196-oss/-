- id: '3'
  stem: (3) 문제 (2)에서 구한 상수 $p$에 대하여 $\displaystyle\lim_{x\to p}\frac{e^{f(x)}-e^{g(x)}}{f(x)-g(x)}$의 값을 실수 $t$에 대한 함수 $e^t$에 평균값 정리를 적용하여 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '1'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-A
    audience: A
    method_no: 1
    key_idea: '$f(x)>g(x)$ ($x\ne1$)이므로 $e^t$에 $[g(x),f(x)]$에서 평균값 정리를 적용: $e^{g(x)}<\frac{e^{f(x)}-e^{g(x)}}{f(x)-g(x)}<e^{f(x)}$, 양 끝이 1로 수렴.'
    steps:
    - id: 3a
      content: $\lim_{x\to1}e^{g(x)}=\lim_{x\to1}e^{f(x)}=1$이므로 구하는 극한은 $1$
      criteria:
      - 3.M1
      - 3.M2
      - 3.M3
      - 3.A1
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: (2)의 결과에서 $p=1$이고, $x\ne1$인 양수 $x$에 대해 항상 $f(x)>g(x)$이다. 이때 실수 $t$에 대한 함수 $e^t$는 닫힌구간 $[g(x),f(x)]$에서 연속이고 열린구간 $(g(x),f(x))$에서 미분가능하다.
      source_flow: g27.pdf p.123 예시답안 문제 3(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: 따라서 실수 $t$에 대한 함수 $e^t$에 평균값 정리에 의해 $\dfrac{e^{f(x)}-e^{g(x)}}{f(x)-g(x)}=e^z$를 만족시키는 실수 $z$가 열린구간 $(g(x),f(x))$에 적어도 하나 존재한다. 이때 $g(x)<z<f(x)$가 성립한다.
      source_flow: g27.pdf p.123 예시답안 문제 3(3)
      criteria:
      - 3.M2
    - id: 3b-3
      content: 그리고 실수 $t$에 대한 함수 $e^t$는 증가함수이므로 $e^{g(x)}<e^z<e^{f(x)}$이다. 따라서 $e^{g(x)}<\dfrac{e^{f(x)}-e^{g(x)}}{f(x)-g(x)}<e^{f(x)}$이다.
      source_flow: g27.pdf p.123 예시답안 문제 3(3)
      criteria:
      - 3.M3
    - id: 3b-4
      content: $\displaystyle\lim_{x\to1}e^{g(x)}=e^{g(1)}=e^0=1$이고, $\displaystyle\lim_{x\to1}e^{f(x)}=e^{f(1)}=e^0=1$이므로, $\displaystyle\lim_{x\to p}\frac{e^{f(x)}-e^{g(x)}}{f(x)-g(x)}=1$이다.
      source_flow: g27.pdf p.123 예시답안 문제 3(3)
      criteria:
      - 3.A1
