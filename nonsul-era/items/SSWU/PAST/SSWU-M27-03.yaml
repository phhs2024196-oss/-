key_idea: 평균변화율 조건으로 $a=\frac12$, $b=-\frac12$, $c=1$. $h(x)=\frac{x^2-1}2-\ln x$는 $h^{\prime}(x)=x-\frac1x$로 $x=1$에서 최솟값 $h(1)=0$. 이때 $f(x)>g(x)$이므로 $e^t$에 평균값 정리를 적용해 $e^{g(x)}<\frac{e^{f(x)}-e^{g(x)}}{f(x)-g(x)}<e^{f(x)}$, 조임으로 극한 1.
