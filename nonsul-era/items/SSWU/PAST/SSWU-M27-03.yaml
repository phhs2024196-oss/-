intent: 평균변화율을 이용하여 주어진 조건을 만족시키는 상수를 구할 수 있는지 확인한다. 주어진 함수에서 도함수를 활용하여 최솟값을 구할 수 있는지 평가한다. 마지막으로 평균값 정리를 이해하고 있는지 확인한 후, 극한의 개념을 이해하고 함수의 극한값을 구할 수 있는지 평가한다.
