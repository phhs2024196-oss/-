stimuli: []
stem: |
  양의 실수 $x$에 대하여 함수 $f(x)=ax^2+b$와 $g(x)=c\ln x$가 다음의 조건을 만족시킨다.

  (가) $f(1)=0$이고, 닫힌구간 $[1,2]$에서 함수 $f(x)$의 평균변화율은 $\dfrac32$이다.

  (나) 닫힌구간 $[1,e]$에서 함수 $g(x)$의 평균변화율은 $\dfrac1{e-1}$이다.

  다음 물음에 답하시오. (단, $a$, $b$, $c$는 상수) [총 25점]
