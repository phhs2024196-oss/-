elements:
  materials:
  - 곡선 $y=\frac1{x+p}$와 세 직선 $x=n$, $x=n+1$, $y=0$으로 둘러싸인 부분의 넓이 $a_n$
  - $e^{a_1+a_6}=\frac32$ ($p>-1$)
  - $b_n=e^{a_n}-1$, $S_n=\sum_{k=1}^nb_kb_{k+1}$, $q=\lim_{n\to\infty}S_n$
  - 곡선 $y=x^3$ 위의 점 $(b_n,b_n^3)$에서의 접선 $l_n$과 넓이 $A_n$
  concepts:
  - 정적분과 넓이
  - 로그함수와 지수함수
  - 수열의 합(부분분수)
  - 접선의 방정식
  - 수열의 극한
  tools:
  - $a_n=\int_n^{n+1}\frac1{x+p}dx=\ln\frac{n+1+p}{n+p}$
  - $e^{a_1+a_6}=\frac{2+p}{1+p}\cdot\frac{7+p}{6+p}=\frac32$를 정리한 $(p-2)(p+5)=0$
  - $\frac1{(k+2)(k+3)}=\frac1{k+2}-\frac1{k+3}$
  - $l_n:y=3b_n^2x-2b_n^3$
  - $A_n=\int_0^{b_n}(x^3-3b_n^2x+2b_n^3)dx=\frac34b_n^4$
  conditions:
  - $p>-1$이므로 $n+p>0$
  - $b_n>0$이므로 곡선 $y=x^3$은 접선 $l_n$보다 위쪽
  stimuli_used: []
  subpart_links: (2)는 (1)의 $a_n$, (3)은 (2)의 $b_n$, $S_n$, $q$를 사용
