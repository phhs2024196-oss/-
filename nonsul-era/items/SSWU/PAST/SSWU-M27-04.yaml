      content: 직선 $l_n$의 방정식은 $y-b_n^3=3b_n^2(x-b_n)$이므로, 정리하면 $y=3b_n^2x-2b_n^3$이다.
      source_flow: g27.pdf p.124 예시답안 문제 4(3)
      criteria:
      - 3.M1
    - id: 3b-2
      content: (2)에서 $b_n=\dfrac1{n+2}>0$이므로, 곡선 $y=x^3$은 접선 $l_n$보다 위에 위치한다.
      source_flow: g27.pdf p.124 예시답안 문제 4(3)
      criteria:
      - 3.R1
    - id: 3b-3
      content: 따라서 $A_n=\displaystyle\int_0^{b_n}\left(x^3-3b_n^2x+2b_n^3\right)dx=\frac34b_n^4=\frac34\left(\frac1{n+2}\right)^4$이다.
      source_flow: g27.pdf p.124 예시답안 문제 4(3)
      criteria:
      - 3.M2
    - id: 3b-4
      content: 이때 $q-S_n=\dfrac13-\dfrac13+\dfrac1{n+3}=\dfrac1{n+3}$이므로, $\displaystyle\lim_{n\to\infty}\frac{A_n}{(q-S_n)^4}=\lim_{n\to\infty}\frac34\left(\frac{n+3}{n+2}\right)^4=\frac34$이다.
      source_flow: g27.pdf p.124 예시답안 문제 4(3)
      criteria:
      - 3.A1
