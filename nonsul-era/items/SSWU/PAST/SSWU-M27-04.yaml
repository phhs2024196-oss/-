key_idea: $a_n=\ln\frac{n+1+p}{n+p}$이고 $e^{a_1+a_6}=\frac32$에서 $p=2$. $b_n=\frac1{n+2}$이므로 부분분수로 $S_n=\frac13-\frac1{n+3}$, $q=\frac13$. $A_n=\frac34b_n^4$, $q-S_n=\frac1{n+3}$이므로 극한은 $\frac34$.
stuck: (3) 접선 $l_n$과 곡선 $y=x^3$ 사이 넓이 $A_n=\frac34b_n^4$를 구하고 $q-S_n=\frac1{n+3}$과 비교하는 단계
