    method_no: 1
    key_idea: $l_n:y=3b_n^2x-2b_n^3$, $A_n=\frac34b_n^4=\frac34\left(\frac1{n+2}\right)^4$, $q-S_n=\frac1{n+3}$이므로 극한은 $\frac34$.
    steps:
    - id: 3a
      content: $\lim_{n\to\infty}\frac34\left(\frac{n+3}{n+2}\right)^4=\frac34$
      criteria:
