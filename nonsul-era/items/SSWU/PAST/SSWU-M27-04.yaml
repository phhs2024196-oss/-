  stem: (3) (2)에서 구한 $b_n$, $S_n$, $q$에 대하여 곡선 $y=x^3$ 위의 점 $(b_n,b_n^3)$에서의 접선을 $l_n$이라 하고, 곡선 $y=x^3$과 직선 $l_n$ 및 $y$축으로 둘러싸인 부분의 넓이를 $A_n$이라 할 때, $\displaystyle\lim_{n\to\infty}\frac{A_n}{(q-S_n)^4}$의 값을 구하시오.
