stimuli: []
stem: |
  수직선 위의 원점을 $\mathrm{O}(0)$라 할 때, 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    점 $\mathrm{A}_1(1)$에 대하여 선분 $\mathrm{OA}_1$을 4:1로 외분하는 점을 $\mathrm{A}_2$라 하고, $n\ge3$인 모든 자연수 $n$에 대하여 선분 $\mathrm{A}_{n-2}\mathrm{A}_{n-1}$을 4:1로 외분하는 점을 $\mathrm{A}_n$이라 한다. 모든 자연수 $n$에 대하여 점 $\mathrm{A}_n$의 좌표를 $a_n$이라고 할 때, $a_2,\,a_3,\,a_4$를 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: a2=4/3; a3=13/9; a4=40/27
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $a_2$는 $\mathrm{OA}_1$을 4:1로 외분하는 점의 좌표이므로 $a_1$에 $\dfrac{\overline{\mathrm{OA}_1}}{3}$을 더한 값과 같다. 따라서 $a_2=a_1+\dfrac13(a_1-0)=1+\dfrac13=\dfrac43$이다.
      source_flow: 대학 제시 답안 p.27~28
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $a_3$은 $\mathrm{A}_1\mathrm{A}_2$를 4:1로 외분하는 점의 좌표이므로 $a_2$에 $\dfrac{\overline{\mathrm{A}_1\mathrm{A}_2}}{3}$을 더한 값과 같다. 따라서 $a_3=a_2+\dfrac13(a_2-a_1)=\left(1+\dfrac13\right)+\left(\dfrac13\right)^2=\displaystyle\sum_{n=1}^{3}\left(\dfrac13\right)^{n-1}=\dfrac{13}{9}$이다.
      source_flow: 대학 제시 답안 p.27~28
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        같은 방식으로 $a_4=a_3+\dfrac13(a_3-a_2)=\displaystyle\sum_{n=1}^{3}\left(\dfrac13\right)^{n-1}+\left(\dfrac13\right)^3=\displaystyle\sum_{n=1}^{4}\left(\dfrac13\right)^{n-1}=\dfrac{40}{27}$을 얻는다.
      source_flow: 대학 제시 답안 p.27~28
      criteria:
      - 1.M3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: $a_2=\dfrac43\left(=1+\dfrac13\right)$을 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 3
      evidence: $a_3=\dfrac{13}{9}\left(=\displaystyle\sum_{n=1}^{3}\left(\dfrac13\right)^{n-1}\right)$을 구했다.
      steps:
      - 1b-2
    - id: 1.M3
      mark_type: M
      points: 3
      evidence: $a_4=\dfrac{40}{27}\left(=\displaystyle\sum_{n=1}^{4}\left(\dfrac13\right)^{n-1}\right)$을 구했다.
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    점 $\mathrm{B}_1(1)$에 대하여 선분 $\mathrm{OB}_1$을 2:1로 내분하는 점을 $\mathrm{B}_2$라 하고, $n\ge3$인 모든 자연수 $n$에 대하여 선분 $\mathrm{B}_{n-2}\mathrm{B}_{n-1}$을 2:1로 내분하는 점을 $\mathrm{B}_n$이라 한다. 모든 자연수 $n$에 대하여 점 $\mathrm{B}_n$의 좌표를 $b_n$이라고 할 때, $b_2,\,b_3,\,b_4$를 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: b2=2/3; b3=7/9; b4=20/27
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $b_2$는 $\mathrm{OB}_1$을 2:1로 내분하는 점의 좌표이므로 $b_1$에서 $\dfrac{\overline{\mathrm{OB}_1}}{3}$을 뺀 값이다. 따라서 $b_2=b_1-\dfrac13(b_1-0)=1-\dfrac13=\dfrac23$이다.
      source_flow: 대학 제시 답안 p.27~28
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $b_3$은 $\mathrm{B}_1\mathrm{B}_2$를 2:1로 내분하는 점의 좌표이고 $b_1>b_2$이므로 $b_2$에 $\dfrac{\overline{\mathrm{B}_1\mathrm{B}_2}}{3}$을 더한 값과 같다. 따라서 $b_3=b_2+\dfrac13(b_1-b_2)=\left(1-\dfrac13\right)+\left(\dfrac13\right)^2=\displaystyle\sum_{n=1}^{3}\left(-\dfrac13\right)^{n-1}=\dfrac79$이다.
      source_flow: 대학 제시 답안 p.27~28
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        $b_4$는 $\mathrm{B}_2\mathrm{B}_3$을 2:1로 내분하는 점의 좌표이고 $b_2<b_3$이므로 $b_3$에서 $\dfrac{\overline{\mathrm{B}_2\mathrm{B}_3}}{3}$을 뺀 값과 같다. 따라서 $b_4=b_3-\dfrac13(b_3-b_2)=\displaystyle\sum_{n=1}^{3}\left(-\dfrac13\right)^{n-1}+\left(-\dfrac13\right)^3=\displaystyle\sum_{n=1}^{4}\left(-\dfrac13\right)^{n-1}=\dfrac{20}{27}$이다.
      source_flow: 대학 제시 답안 p.27~28
      criteria:
      - 2.M3
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 2
      evidence: $b_2=\dfrac23\left(=1-\dfrac13\right)$을 구했다.
      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 5
      evidence: $b_3=\dfrac79\left(=\displaystyle\sum_{n=1}^{3}\left(-\dfrac13\right)^{n-1}\right)$을 구했다.
      steps:
      - 2b-2
    - id: 2.M3
      mark_type: M
      points: 5
      evidence: $b_4=\dfrac{20}{27}\left(=\displaystyle\sum_{n=1}^{4}\left(-\dfrac13\right)^{n-1}\right)$을 구했다.
      steps:
      - 2b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    $a_{2025}+2b_{2025}$의 값을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '3'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (1)의 과정에 따르면 $a_{2025}=1+\dfrac13+\cdots+\left(\dfrac13\right)^{2024}=\dfrac32\left\{1-\left(\dfrac13\right)^{2025}\right\}$을 얻는다.
      source_flow: 대학 제시 답안 p.27~28
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        (2)의 과정에 따르면 $b_{2025}=1+\left(-\dfrac13\right)+\cdots+\left(-\dfrac13\right)^{2024}=\dfrac34\left\{1-\left(-\dfrac13\right)^{2025}\right\}=\dfrac34\left\{1+\left(\dfrac13\right)^{2025}\right\}$을 얻는다.
      source_flow: 대학 제시 답안 p.27~28
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        위에서 구한 $a_{2025}$와 $b_{2025}$에 의해 $a_{2025}+2b_{2025}=3$이다.
      source_flow: 대학 제시 답안 p.27~28
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: $a_{2025}=1+\dfrac13+\cdots+\left(\dfrac13\right)^{2024}=\dfrac32\left\{1-\left(\dfrac13\right)^{2025}\right\}$임을 제시했다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 4
      evidence: $b_{2025}=1+\left(-\dfrac13\right)+\cdots+\left(-\dfrac13\right)^{2024}=\dfrac34\left\{1+\left(\dfrac13\right)^{2025}\right\}$임을 제시했다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 2
      evidence: $a_{2025}+2b_{2025}=3$을 구했다.
      steps:
      - 3b-3
