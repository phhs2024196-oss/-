stimuli: []
stem: |
  곡선 $y=x^4-6x^2$에 대하여 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    곡선 위의 점 $\mathrm{A}(-1,\,-5)$에서의 접선을 구하고, 접선과 곡선의 교점 중 $\mathrm{A}$가 아닌 점의 좌표를 구하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: line=8x+3; point=(3,27)
    equivalents:
    - y=8x+3, (3, 27)
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        주어진 사차함수를 미분하면 $y'=4x^3-12x$이므로 곡선 위의 점 $\mathrm{A}(-1,\,-5)$에서의 접선의 기울기는 8이다.
      source_flow: 대학 제시 답안 p.31
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 접선의 식은 $y+5=8(x+1)$, 즉 $y=8x+3$이다.
      source_flow: 대학 제시 답안 p.31
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        곡선과 접선의 교점을 구하기 위해 $x^4-6x^2=8x+3$을 인수분해하면 $(x+1)^3(x-3)=0$을 얻는다. 따라서 교점의 $x$좌표는 3이고 교점은 $(3,\,27)$이다.
      source_flow: 대학 제시 답안 p.31
      criteria:
      - 1.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 접선의 기울기 8을 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 5
      evidence: 접선의 방정식 $y=8x+3$을 정확히 작성했다.
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 5
      evidence: 교점의 좌표 $(3,\,27)$을 구했다.
      steps:
      - 1b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (1)에서 구한 접선과 곡선으로 둘러싸인 도형의 넓이 $S_1$을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: 256/5
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $x$좌표가 $-1$보다 크고 3보다 작은 범위에서는 접선이 곡선보다 $y$좌표가 크므로 $S_1=\displaystyle\int_{-1}^{3}\{(8x+3)-(x^4-6x^2)\}\,dx$이다.
      source_flow: 대학 제시 답안 p.31
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $S_1=\left[4x^2+3x-\dfrac15x^5+2x^3\right]_{-1}^{3}=\dfrac{256}{5}$이다.
      source_flow: 대학 제시 답안 p.31
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 적분 구간과 적분식을 정확히 작성했다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: $S_1=\dfrac{256}{5}$을 정확히 구했다.
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (1)에서 구한 교점과 곡선 위의 점 $\mathrm{B}(1,\,-5)$를 지나는 직선의 방정식을 구하고, 이 직선과 곡선으로 둘러싸인 도형의 넓이를 $S_2$라 할 때 두 넓이의 비율 $\dfrac{S_1}{S_2}$을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: line=16x-21; S2=128/5; ratio=2
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        점 $(1,\,-5)$와 점 $(3,\,27)$을 지나는 직선은 기울기가 $\dfrac{27-(-5)}{3-1}=16$이므로 직선의 식은 $y-(-5)=16(x-1)$, 즉 $y=16x-21$이다.
      source_flow: 대학 제시 답안 p.31
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        이 직선과 곡선으로 둘러싸인 도형의 넓이는 $S_2=\displaystyle\int_{1}^{3}\{(16x-21)-(x^4-6x^2)\}\,dx=\left[8x^2-21x-\dfrac15x^5+2x^3\right]_{1}^{3}=\dfrac{128}{5}$이다.
      source_flow: 대학 제시 답안 p.31
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        따라서 $\dfrac{S_1}{S_2}=2$이다.
      source_flow: 대학 제시 답안 p.31
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 2
      evidence: 두 점을 지나는 직선의 방정식 $y=16x-21$을 구했다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: $S_2=\dfrac{128}{5}$를 정확히 구했다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: 넓이의 비 $\dfrac{S_1}{S_2}=2$를 정확히 구했다.
      steps:
      - 3b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
