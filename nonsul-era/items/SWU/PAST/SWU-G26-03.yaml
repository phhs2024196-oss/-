stimuli: []
stem: |
  두 양수 $p,\,q$와 세 실수 $a,\,b,\,c\ (a\ne0)$에 대하여 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    이차함수 $y=ax^2+bx+c$에 대하여 원점에서 이차함수의 그래프에 그은 두 접선의 방정식이 $y=px$와 $y=-qx$이고, 두 접점의 $x$좌표가 각각 $t\,(t>0)$와 $-t$일 때, $a,\,b,\,c$를 각각 $p,\,q,\,t$에 대한 식으로 나타내시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: a=(p+q)/(4*t); b=(p-q)/2; c=(p+q)*t/4
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        이차함수 $y=ax^2+bx+c$를 미분하면 $y'=2ax+b$이고, 이차함수의 그래프 위의 $x$좌표가 $t,\,-t$인 점에서 접선의 기울기가 각각 $p,\,-q$이므로 $p=2at+b$, $-q=-2at+b$이다. 따라서 $a=\dfrac{p+q}{4t}$, $b=\dfrac{p-q}{2}$이다.
      source_flow: 대학 제시 답안 p.34
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        또한 이차함수의 그래프 위의 $x$좌표가 $t$인 점에서의 접선이 $y=px$이므로 $pt=at^2+bt+c$이다. 따라서 $c=\dfrac{p+q}{4}t$이다.
      source_flow: 대학 제시 답안 p.34
      criteria:
      - 1.M2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: 접선의 기울기로부터 $a=\dfrac{p+q}{4t}$, $b=\dfrac{p-q}{2}$를 구했다.
      steps:
      - 1b-1
    - id: 1.M2
      mark_type: M
      points: 10
      evidence: 접선의 성질을 활용하여 등식 $pt=at^2+bt+c$를 이끌어 내고 $c=\dfrac{p+q}{4}t$를 구했다.
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    (1)에서 구한 이차함수의 그래프를 생각할 때, 그 꼭짓점의 좌표 $(x,\,y)$를 $p,\,q,\,t$에 대한 식으로 나타내시오.
  points: 5
  depends_on: []
  answer:
    kind: value
    value: x=(q-p)*t/(p+q); y=p*q*t/(p+q)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $y=\dfrac{p+q}{4t}x^2+\dfrac{p-q}{2}x+\dfrac{p+q}{4}t$이다. 이를 변형하면 $y=\dfrac{p+q}{4t}\left(x+\dfrac{p-q}{p+q}t\right)^2+\dfrac{pq}{p+q}t$를 얻는다.
      source_flow: 대학 제시 답안 p.34
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        따라서 이차함수의 그래프의 꼭짓점의 좌표 $(x,\,y)$는 $\left(\dfrac{-p+q}{p+q}t,\ \dfrac{pq}{p+q}t\right)$이다.
      source_flow: 대학 제시 답안 p.34
      criteria:
      - 2.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 4
      evidence: $y=ax^2+bx+c$를 $y=a(x-p)^2+q$꼴로 변형했다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 1
      evidence: 꼭짓점의 좌표를 구했다.
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    (1)의 두 접선이 서로 수직일 때, (2)에서 구한 꼭짓점의 $y$좌표의 최댓값을 $t$에 대한 식으로 나타내시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: t/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        두 접선 $y=px$와 $y=-qx$가 서로 수직이면 $pq=1$이다.
      source_flow: 대학 제시 답안 p.34
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $p,\,q>0$이므로 산술기하평균의 성질에 의해 $p+q\ge2\sqrt{pq}=2$이다. 따라서 이차함수의 그래프에서 꼭짓점의 $y$좌표는 부등식 $\dfrac{pq}{p+q}t\le\dfrac12t$를 만족한다.
      source_flow: 대학 제시 답안 p.34
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        $p=q=1$일 때 두 직선 $y=px$와 $y=-qx$는 서로 수직이며 $\dfrac{pq}{p+q}t=\dfrac12t$이다. 따라서 최댓값은 $\dfrac12t$이다.
      source_flow: 대학 제시 답안 p.34
      criteria:
      - 3.A1
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 5
      evidence: 두 직선이 서로 수직이면 $pq=1$임을 안다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 5
      evidence: 산술기하평균에 관한 절대부등식 $p+q\ge2\sqrt{pq}$를 이용했다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 5
      evidence: 등호 성립 조건을 확인하고 최댓값 $\dfrac12t$를 구했다.
      steps:
      - 3b-3
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
