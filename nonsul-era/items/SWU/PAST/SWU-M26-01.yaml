  misconceptions: []
- id: '3'
  stem: |
    곡선 $y=-ax^3+bx$와 선분 OA에 의해 둘러싸인 부분의 넓이 $S_2$를 구하고, $\dfrac{S_1}{S_2}$을 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: expression
    value: S2=b**2/(4*a); ratio=2
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        곡선 $y=-ax^3+bx$와 선분 OA에 의해 둘러싸인 부분의 넓이 $S_2$는 $S_2=\displaystyle\int_0^{\sqrt{\frac{b}{a}}}(-ax^3+bx)\,dx=\left[-\dfrac{a}{4}x^4+\dfrac{b}{2}x^2\right]_0^{\sqrt{\frac{b}{a}}}=-\dfrac{b^2}{4a}+\dfrac{b^2}{2a}=\dfrac{b^2}{4a}$이다.
      source_flow: 대학 제시 답안 p.4
      criteria:
      - 3.M1
      - 3.A1
    - id: 3b-2
      content: |
        따라서 $\dfrac{S_1}{S_2}=2$이다.
      source_flow: 대학 제시 답안 p.4
      criteria:
      - 3.A2
