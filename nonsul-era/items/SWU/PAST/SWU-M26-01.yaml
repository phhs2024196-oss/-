      steps:
      - 2b-1
    - id: 2.M2
      mark_type: M
      points: 3
      evidence: 직선 $y=bx$에 A의 $x$좌표를 대입하여 B의 좌표를 적었다.
      steps:
      - 2b-2
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: 밑변과 높이로 직각삼각형의 넓이를 계산하여 $S_1=\dfrac{b^2}{2a}$를 구했다.
      depends_on:
