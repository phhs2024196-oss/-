stimuli: []
stem: |
  양의 실수 $a,b$에 대하여 곡선 $y=-ax^3+bx$를 생각하자. 곡선이 $x$축 양의 부분과 만나는 점을 A라 하고, 곡선 위의 원점 O에서 그은 접선을 $l$이라 할 때 점 A를 지나면서 $x$축에 수직인 직선과 접선 $l$의 교점을 B라 한다. 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    접선 $l$의 방정식을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: b*x
    equivalents:
    - y=bx
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        함수 $f(x)=-ax^3+bx$의 도함수는 $f'(x)=-3ax^2+b$이므로 원점 $(0,0)$에서 곡선의 접선의 기울기는 $f'(0)=b$이다.
      source_flow: 대학 제시 답안 p.4
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        따라서 접선 $l$의 식은 $y-0=b(x-0)$, 즉 $y=bx$이다.
      source_flow: 대학 제시 답안 p.4
      criteria:
      - 1.A1
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    steps:
    - id: 1c1-1
      content: |
        원점에서의 접선의 식을 $y=mx$로 두고 곡선 $y=-ax^3+bx$와 연립하여 $-ax^3+bx=mx$, 즉 $ax^3+(m-b)x=0$, $x(ax^2+m-b)=0$이 $x=0$을 삼중근으로 가지려면 $m=b$이다($m<b$이면 추가로 실근 두 개, $m>b$이면 추가로 허근 두 개). 따라서 접선의 식은 $y=bx$이다.
      source_flow: 대학 제시 답안 p.4
      criteria: []
  # 채점기준 미공개 — 단계별 추정(소문항 배점·배점 합도 추정)
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 5
      evidence: $f'(x)=-3ax^2+b$를 구하고 $f'(0)=b$를 적었다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 3
      evidence: 접선의 식 $y=bx$를 적었다.
      depends_on:
      - 1.M1
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    점 A와 B의 좌표를 구하고, 삼각형 OAB의 넓이 $S_1$을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: Ax=sqrt(b/a); Ay=0; Bx=sqrt(b/a); By=b*sqrt(b)/sqrt(a); S1=b**2/(2*a)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        식 $-ax^3+bx=0$을 인수분해하여 $x(\sqrt{a}x+\sqrt{b})(-\sqrt{a}x+\sqrt{b})=0$의 양수 근을 구하면 $\mathrm{A}\left(\sqrt{\dfrac{b}{a}},0\right)$이다.
      source_flow: 대학 제시 답안 p.4
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        직선의 식 $y=bx$에 $x=\sqrt{\dfrac{b}{a}}$를 대입하면 $\mathrm{B}\left(\sqrt{\dfrac{b}{a}},\dfrac{b\sqrt{b}}{\sqrt{a}}\right)$이다.
      source_flow: 대학 제시 답안 p.4
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        직각삼각형 OAB의 넓이 $S_1$은 $S_1=\dfrac12\times\sqrt{\dfrac{b}{a}}\times\dfrac{b\sqrt{b}}{\sqrt{a}}=\dfrac{b^2}{2a}$이다.
      source_flow: 대학 제시 답안 p.4
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정(소문항 배점·배점 합도 추정)
