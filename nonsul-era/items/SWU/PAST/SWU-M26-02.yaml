    (2)에서 구한 점들 $\mathrm{A}(a,a^2-1)$을 생각하자. 각 점에서의 접선들과 곡선 $y=x^2-1$로 둘러싸인 부분의 넓이를 구하시오. (단, $a\ge0$)
