- id: '2'
  stem: |
    원점 O에 대하여 부채꼴 OPQ의 넓이가 $\dfrac{4\pi}{3}$일 때 이를 만족하는 실수 $a$를 모두 구하시오. (단, 부채꼴 OPQ의 중심각은 $\pi$보다 작다.)
  points: 16
  depends_on: []
  answer:
    kind: set
    value: '{0, sqrt(2), -sqrt(2)}'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        부채꼴 넓이 공식으로부터 $\dfrac{4\pi}{3}=\dfrac12r^2\theta$에 $r=2$를 대입하여 중심각 POQ는 $\theta=\dfrac{2\pi}{3}$이다.
      source_flow: 대학 제시 답안 p.8
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        원점에서 접선까지 수직으로 선분을 내렸을 때 만나는 점을 S라 하면, 선분 OS의 길이 $d$는 $\dfrac{a^2+1}{\sqrt{4a^2+1}}$이다.
      source_flow: 대학 제시 답안 p.8
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        접선과 원 중심 사이의 거리와 중심각의 관계는 $d=r\cos\left(\dfrac{\theta}{2}\right)$이다. 이때, 중심각 $\theta=\dfrac{2\pi}{3}$이므로 $d=r\cos\left(\dfrac{\theta}{2}\right)=r\cos\left(\dfrac{\pi}{3}\right)=1$이다.
      source_flow: 대학 제시 답안 p.8
      criteria:
      - 2.M3
    - id: 2b-4
      content: |
        따라서 $\dfrac{a^2+1}{\sqrt{4a^2+1}}=1$로부터 $a^2+1=\sqrt{4a^2+1}$, $a^4+2a^2+1=4a^2+1$, $a^4-2a^2=0$, $a^2(a^2-2)=0$[정정: 대학 제시 답안 p.8 원문은 $a^2(a^2-4)=0$ — 오기, 독립 교차검증 2건 일치]이므로 $a=0,\sqrt{2},-\sqrt{2}$이다.
      source_flow: 대학 제시 답안 p.8
      criteria:
      - 2.A1
  - id: S2-ALT1
    audience: ALT
    method_no: 2
    steps:
    - id: 2c1-1
      content: |
        코사인법칙을 이용하면 $\cos\left(\dfrac{2\pi}{3}\right)=\dfrac{\overline{OP}^2+\overline{OQ}^2-\overline{PQ}^2}{2\times\overline{OP}\times\overline{OQ}}$이다. 이때 $\overline{OP}=\overline{OQ}=2$이다. 따라서 이를 풀면 $\overline{PQ}^2=12$이다. 접선 $l:y=2ax-(a^2+1)$을 원 $C:x^2+y^2=4$에 대입하면 $x^2+(2ax-(a^2+1))^2=4$이므로, $(1+4a^2)x^2-4a(a^2+1)x+(a^2+1)^2-4=0$이다. 만나는 점 P, Q를 각각 $(x_1,y_1)$, $(x_2,y_2)$라 하면 $\overline{PQ}^2=(x_1-x_2)^2+(y_1-y_2)^2=(x_1-x_2)^2+(2a(x_1-x_2))^2=(1+4a^2)(x_1-x_2)^2$이다. 또한 $x_1+x_2=\dfrac{4a(a^2+1)}{1+4a^2}$ 및 $x_1x_2=\dfrac{(a^2+1)^2-4}{1+4a^2}$를 만족한다. 따라서 $12=\overline{PQ}^2=(1+4a^2)(x_1-x_2)^2=(1+4a^2)((x_1+x_2)^2-4x_1x_2)$이므로, $a$에 대한 식을 풀면 $a^2(a^2-2)=0$이다. 즉 $a=0,\sqrt{2},-\sqrt{2}$이다.
      source_flow: 대학 제시 답안 p.8
      criteria: []
  - id: S2-ALT2
    audience: ALT
    method_no: 3
    steps:
    - id: 2c2-1
      content: |
        사인법칙에 따라 $\dfrac{\overline{PQ}}{\sin(\angle POQ)}=\dfrac{\overline{OP}}{\sin(\angle OPQ)}$이고, 중심각 POQ는 $\theta=\dfrac{2\pi}{3}$이므로 $\overline{PQ}=2\sqrt{3}$이다. (삼각형 POQ는 이등변 삼각형이며, $\overline{OP}=\overline{OQ}=2$). 이후 풀이는 별해 1과 동일하다.
      source_flow: 대학 제시 답안 p.8
      criteria: []
    - id: 2c2-2
      content: |
        원점에서 접선까지 수직으로 선분을 내렸을 때 만나는 점을 S라 하면, $\overline{PS}=r\sin\left(\dfrac{\theta}{2}\right)$이다(이때, $\theta=\dfrac{2\pi}{3}$). 따라서, $\overline{PQ}=2r\sin\left(\dfrac{\pi}{3}\right)=2\sqrt{3}$이다. 이후 풀이는 별해 1과 동일하다.
      source_flow: 대학 제시 답안 p.8
      criteria: []
