stimuli: []
stem: |
  곡선 $y=x^2-1$ 위의 점 $\mathrm{A}(a,a^2-1)$에서 그은 접선 $l$이 원 $C:x^2+y^2=4$와 서로 다른 두 점 P,Q에서 만난다. 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    접선 $l$의 방정식을 구하시오.
  points: 7
  depends_on: []
  answer:
    kind: expression
    value: 2*a*x-(a**2+1)
    equivalents:
    - y=2ax-(a^2+1)
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        곡선 $y=x^2-1$을 미분하면 $y'=2x$이므로, 점 $\mathrm{A}(a,a^2-1)$에서의 접선의 방정식은 $y-(a^2-1)=2a(x-a)$, 즉 $y=2ax-(a^2+1)$이다.
      source_flow: 대학 제시 답안 p.8
      criteria:
      - 1.M1
      - 1.A1
  - id: S1-ALT1
    audience: ALT
    method_no: 2
    steps:
    - id: 1c1-1
      content: |
        $y=x^2-1$과 $y=mx+b$를 연립하면 $x^2-mx-(1+b)=0$이며, 해당 이차방정식이 중근을 가져야 한다. 즉, 판별식 $m^2+4(1+b)=0$이므로 접선의 방정식은 $y=mx-\dfrac{m^2}{4}-1$이다. 해당 방정식이 점 $\mathrm{A}(a,a^2-1)$을 지나야 하므로, $a^2=ma-\dfrac{m^2}{4}$이므로, $m=2a$이다. 따라서 $y=2ax-(a^2+1)$이다.
      source_flow: 대학 제시 답안 p.8
      criteria: []
  # 채점기준 미공개 — 단계별 추정(소문항 배점·배점 합도 추정)
  rubric:
    rules:
