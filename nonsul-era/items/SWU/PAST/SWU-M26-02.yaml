      content: |
        (A) 정적분 $\displaystyle\int_0^{\sqrt{2}}((x^2-1)-(2\sqrt{2}x-3))\,dx=\int_0^{\sqrt{2}}(x^2-2\sqrt{2}x+2)\,dx=\dfrac{2\sqrt{2}}{3}$이고,
      source_flow: 대학 제시 답안 p.8
      criteria:
      - 3.M1
      - 3.A1
    - id: 3b-2
      content: |
        (B) 삼각형의 넓이는 $\dfrac12\times\dfrac{1}{\sqrt{2}}\times2=\dfrac{\sqrt{2}}{2}$이므로 넓이는 (A)$-$(B)$=\dfrac{2\sqrt{2}}{3}-\dfrac{\sqrt{2}}{2}=\dfrac{\sqrt{2}}{6}$이다.
      source_flow: 대학 제시 답안 p.8
      criteria:
