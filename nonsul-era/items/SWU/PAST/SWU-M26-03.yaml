stimuli: []
stem: |
  삼각형 ABC에 대해 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    상수 $a$에 대하여 $\overline{BC}=a$이고 $\angle C=\dfrac{\pi}{6}$인 삼각형 ABC가 주어져 있다. 삼각형 ABC의 외접원 반지름의 길이를 $R$이라 할 때 $R$의 최댓값과 최솟값을 $a$에 대한 식으로 표현하시오. (단, 삼각형 ABC는 둔각 삼각형이 아니다.)
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: Rmax=sqrt(3)*a/3; Rmin=a/2
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        사인 법칙에 의해 $2R=\dfrac{c}{\sin C}=\dfrac{c}{\sin(\pi/6)}=2c$이므로 $R=c$를 얻는다.
      source_flow: 대학 제시 답안 p.11~12
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        삼각형 ABC가 둔각삼각형이 아니므로 $\mathrm{B}=\dfrac{\pi}{2}$일 때 $c$는 최댓값 $a\tan\dfrac{\pi}{6}=\dfrac{a}{\sqrt{3}}=\dfrac{\sqrt{3}}{3}a$이다.
      source_flow: 대학 제시 답안 p.11~12
      criteria:
      - 1.A1
    - id: 1b-3
      content: |
        그리고 $\angle\mathrm{A}=\dfrac{\pi}{2}$일 때 $c$는 최솟값 $a\sin\dfrac{\pi}{6}=\dfrac{a}{2}$이다.
      source_flow: 대학 제시 답안 p.11~12
      criteria:
      - 1.A2
  # 채점기준 미공개 — 단계별 추정(소문항 배점·배점 합도 추정)
