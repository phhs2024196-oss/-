- id: '3'
  stem: |
    상수 $a,d$에 대하여 $\overline{AB}+\overline{CA}=d$이고 $\overline{BC}=a$인 삼각형 ABC에 대하여 삼각형 ABC의 외접원 반지름의 길이 $R$과 내접원 반지름의 길이 $r$의 곱 $Rr$의 최댓값을 $a,d$에 대한 식으로 표현하시오.
  points: 15
  depends_on: []
  answer:
    kind: expression
    value: a*d**2/(8*(a+d))
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $\dfrac{(a+b+c)r}{2}=\dfrac{(a+d)r}{2}=\dfrac{bc\sin\mathrm{A}}{2}$에서 $r=\dfrac{bc\sin\mathrm{A}}{a+d}$이고 사인 법칙에 의해 $R=\dfrac{a}{2\sin\mathrm{A}}$이다. 따라서 $Rr=\dfrac{abc}{2(a+d)}=\dfrac{a}{2(a+d)}\cdot bc$를 얻는다. (여기서 $b=\overline{CA}$, $c=\overline{AB}$)
      source_flow: 대학 제시 답안 p.11~12
      criteria:
      - 3.M1
      - 3.M2
    - id: 3b-2
      content: |
        $a,a+d$는 상수이므로 $bc$가 최대일 때 $Rr$이 최대가 된다. 산술기하평균에 의해 $bc\le\left(\dfrac{b+c}{2}\right)^2$이고 $b=c=\dfrac{d}{2}$일 때 $bc$는 최댓값 $\dfrac{d^2}{4}$가 된다. 따라서 $Rr$의 최댓값은 $\dfrac{ad^2}{8(a+d)}$이다.
      source_flow: 대학 제시 답안 p.11~12
      criteria:
      - 3.M3
      - 3.A1
