      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 3
      evidence: $R$이 최대일 때 $\sqrt{a^2+b^2}$, 최소일 때 $\sqrt{a^2-b^2}$를 구했다.
