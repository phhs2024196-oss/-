- id: '2'
  stem: |
    상수 $a,b$에 대하여 $\overline{BC}=a$, $\overline{CA}=b$인 삼각형 ABC가 주어져 있다. 삼각형 ABC의 외접원 반지름의 길이 $R$이 최대일 때와 최소일 때의 $\overline{AB}$의 값을 $a,b$에 대한 식으로 표현하시오. (단, $\overline{BC}>\overline{CA}$이고 삼각형 ABC는 둔각 삼각형이 아니다.)
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: AB_Rmax=sqrt(a**2+b**2); AB_Rmin=sqrt(a**2-b**2)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        사인 법칙에 의해 $R=\dfrac{a}{2\sin A}$이다. 한편 삼각형 ABC가 둔각삼각형이 아니므로 $\angle\mathrm{A}=\dfrac{\pi}{2}$일 때 $\sin\mathrm{A}$는 최대이고 $\angle\mathrm{C}=\dfrac{\pi}{2}$일 때 $\sin\mathrm{A}$는 최소이다.
      source_flow: 대학 제시 답안 p.11~12
      criteria:
      - 2.M1
      - 2.M2
    - id: 2b-2
      content: |
        따라서 $R$이 최대일 때 $c=\sqrt{a^2+b^2}$이고 최소일 때 $c=\sqrt{a^2-b^2}$이다. (여기서 $c=\overline{AB}$)
      source_flow: 대학 제시 답안 p.11~12
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정(소문항 배점·배점 합도 추정)
