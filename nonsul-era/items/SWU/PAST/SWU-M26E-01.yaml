stimuli: []
stem: |
  곡선 $y=x^2$과 직선 $l$이 만나는 서로 다른 두 점을 $\mathrm{A},\,\mathrm{B}$라 하고, 두 점 $\mathrm{A},\,\mathrm{B}$의 $x$좌표를 각각 $a,\,b\ (a>b)$라 하자. 선분 $\mathrm{AB}$의 중점을 $\mathrm{C}$라 하고, 점 $\mathrm{C}$에서 $y$축에 평행한 직선이 곡선 $y=x^2$과 만나는 점을 $\mathrm{D}$라 하자.
  두 점 $\mathrm{A},\,\mathrm{B}$에서 각각 곡선 $y=x^2$에 접하는 직선을 $m$과 $n$이라 하고, 직선 $m$과 $n$의 교점을 $\mathrm{E}$라 하자. 다음 물음에 대하여 답하시오.
subparts:
- id: '1'
  stem: |
    직선 $l$의 방정식을 구하고, 곡선 $y=x^2$과 직선 $l$로 둘러싸인 부분의 넓이를 $S_1$ 라 할 때, $S_1$ 을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: l=(a+b)*x-a*b; S1=(a-b)**3/6
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직선 $l$의 기울기가 $\dfrac{a^2-b^2}{a-b}=a+b$이고, 점 $\mathrm{A}(a,\,a^2)$을 지나므로 직선 $l$의 방정식은 $y=(a+b)x-ab$이다.
      source_flow: 예시 답안 p.2
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        넓이 $S_1=\displaystyle\int_{b}^{a}\{(a+b)x-ab-x^2\}\,dx=(a+b)\left\{\dfrac12(a^2-b^2)\right\}-ab(a-b)-\dfrac13(a^3-b^3)=\dfrac16(a-b)^3$이다.
      source_flow: 예시 답안 p.2
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 1.M1
      mark_type: M
      points: 4
      evidence: 직선 $l$의 방정식 $y=(a+b)x-ab$를 구했다.
      steps:
      - 1b-1
    - id: 1.A1
      mark_type: A
      points: 6
      evidence: $S_1=\dfrac16(a-b)^3$을 구했다.
      steps:
      - 1b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '2'
  stem: |
    삼각형 $\mathrm{ABD}$ 의 넓이를 $S_2$ 라 할 때, $S_2$ 와 $\dfrac{S_1}{S_2}$ 을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: S2=(a-b)**3/8; ratio=4/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        점 $\mathrm{C}$의 $y$좌표는 $\dfrac{a^2+b^2}{2}$이고, 점 $\mathrm{D}$의 $y$좌표는 $\left(\dfrac{a+b}{2}\right)^2$이므로 선분 $\mathrm{CD}$의 길이는 $\dfrac{a^2+b^2}{2}-\left(\dfrac{a+b}{2}\right)^2=\dfrac{(a-b)^2}{4}$이다.
      source_flow: 예시 답안 p.2
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        점 $\mathrm{A}$와 $\mathrm{B}$의 $x$좌표의 차는 $a-b$이므로 삼각형 $\mathrm{ABD}$의 넓이 $S_2=\dfrac12\times\dfrac{(a-b)^2}{4}\times(a-b)=\dfrac18(a-b)^3$이고, $\dfrac{S_1}{S_2}=\dfrac43$이다.
      source_flow: 예시 답안 p.2
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 2.M1
      mark_type: M
      points: 5
      evidence: 선분 $\mathrm{CD}$의 길이 $\dfrac{(a-b)^2}{4}$을 구했다.
      steps:
      - 2b-1
    - id: 2.A1
      mark_type: A
      points: 5
      evidence: $S_2=\dfrac18(a-b)^3$과 $\dfrac{S_1}{S_2}=\dfrac43$을 구했다.
      steps:
      - 2b-2
  outcome_codes:
  - code: '20'
    meaning: 만점
  misconceptions: []
- id: '3'
  stem: |
    점 $\mathrm{E}$의 좌표를 구하고, 삼각형 $\mathrm{ABE}$ 넓이를 $S_3$ 라 할 때, $\dfrac{S_1}{S_3}$ 을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: E=((a+b)/2, a*b); S3=(a-b)**3/4; ratio=2/3
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        이차함수 $y=x^2$의 도함수는 $\dfrac{dy}{dx}=2x$이므로 직선 $m$의 방정식은 $y=2ax-a^2$이고, 직선 $n$의 방정식은 $y=2bx-b^2$이다. 교점 $\mathrm{E}$의 $x$좌표는 $\dfrac{a+b}{2}$이고 $y$좌표는 $ab$이다. 즉 $\mathrm{E}\left(\dfrac{a+b}{2},\,ab\right)$이다.
      source_flow: 예시 답안 p.2
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        선분 $\mathrm{CE}$의 길이는 $\dfrac{a^2+b^2}{2}-ab=\dfrac{(a-b)^2}{2}$이다.
      source_flow: 예시 답안 p.2
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        삼각형 $\mathrm{ABE}$의 넓이 $S_3=\dfrac12\times\dfrac{(a-b)^2}{2}\times(a-b)=\dfrac14(a-b)^3$이고, $\dfrac{S_1}{S_3}=\dfrac23$이다.
      source_flow: 예시 답안 p.2
      criteria:
      - 3.A1
  # 채점기준 미공개 — 단계별 추정
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
      a_requires_m: true
      misread_penalty: 2
      isw: true
    criteria:
    - id: 3.M1
      mark_type: M
      points: 4
      evidence: 점 $\mathrm{E}\left(\dfrac{a+b}{2},\,ab\right)$를 구했다.
      steps:
      - 3b-1
    - id: 3.M2
      mark_type: M
      points: 3
      evidence: 선분 $\mathrm{CE}$의 길이 $\dfrac{(a-b)^2}{2}$을 구했다.
      steps:
      - 3b-2
    - id: 3.A1
      mark_type: A
      points: 3
      evidence: $S_3=\dfrac14(a-b)^3$을 구했다.
      steps:
      - 3b-3
