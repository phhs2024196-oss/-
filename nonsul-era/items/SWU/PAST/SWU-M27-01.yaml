- id: '2'
  stem: |
    삼각형 ABO의 내부와 삼각형 COD의 내부의 공통부분의 넓이를 $t$에 대한 식으로 나타내시오.
  points: 10
  depends_on: []
  answer:
    kind: expression
    value: 1/(t**2+1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        (1)에서 구한 교점을 $\mathrm{E}\left(\dfrac{t}{t^2+1},\dfrac{t}{t^2+1}\right)$라고 하자.
      source_flow: 대학 제시 답안 p.5
      criteria: []
    - id: 2b-2
      content: |
        이때, 삼각형 ABO와 삼각형 COD가 겹치는 영역의 넓이는 삼각형 BOE의 넓이와 삼각형 EOD의 넓이의 합과 같다. 삼각형 BOE와 삼각형 EOD는 밑변의 길이가 $\dfrac1t$이고 높이가 $\dfrac{t}{t^2+1}$인 삼각형이므로, 이 둘의 넓이는 모두 $\dfrac12\cdot\dfrac1t\cdot\dfrac{t}{t^2+1}=\dfrac{1}{2(t^2+1)}$이다.
      source_flow: 대학 제시 답안 p.5
      criteria:
      - 2.M1
      - 2.M2
    - id: 2b-3
      content: |
        따라서 삼각형 ABO와 삼각형 COD가 겹치는 영역의 넓이를 $t$에 대한 식으로 표현하면 $\dfrac{1}{t^2+1}$이다.
      source_flow: 대학 제시 답안 p.5
      criteria:
      - 2.A1
  # 채점기준 미공개 — 단계별 추정(소문항 배점·배점 합도 추정)
