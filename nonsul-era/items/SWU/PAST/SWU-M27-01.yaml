stimuli: []
stem: |
  $t>1$일 때, 좌표평면 위에 점 $\mathrm{A}(t,0)$, $\mathrm{B}\left(0,\dfrac1t\right)$, $\mathrm{C}(0,t)$, $\mathrm{D}\left(\dfrac1t,0\right)$, $\mathrm{O}(0,0)$가 있다.
subparts:
- id: '1'
  stem: |
    점 A와 점 B를 지나는 직선과 점 C와 점 D를 지나는 직선의 교점을 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: expression
    value: x=t/(t**2+1); y=t/(t**2+1)
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        직선 AB의 방정식은 $y=\dfrac{-\frac1t}{t}(x-t)=-\dfrac{1}{t^2}(x-t)$이고, 직선 CD의 방정식은 $y=\dfrac{-t}{\frac1t}\left(x-\dfrac1t\right)=-t^2\left(x-\dfrac1t\right)$이다.
      source_flow: 대학 제시 답안 p.5
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        두 직선의 교점의 $x$좌표는 $-\dfrac{1}{t^2}(x-t)=-t^2\left(x-\dfrac1t\right)$의 해인 $x=\dfrac{t}{t^2+1}$이다. 이를 직선 AB의 방정식에 대입하면 $y=\dfrac{t}{t^2+1}$임을 알 수 있다.
      source_flow: 대학 제시 답안 p.5
      criteria:
      - 1.M2
      - 1.A1
