- id: '3'
  stem: |
    (2)에서 구한 영역의 넓이를 함수 $f(t)$라 하자. 이때,
    $$\lim_{t\to\infty}\dfrac{f(t)}{f(2t)}$$
    를 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '4'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        (2)에서 구한 식을 $f(t)$라 하면, $\dfrac{f(t)}{f(2t)}=\dfrac{\dfrac{1}{t^2+1}}{\dfrac{1}{4t^2+1}}=\dfrac{4t^2+1}{t^2+1}$이다.
      source_flow: 대학 제시 답안 p.5
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        따라서 $\displaystyle\lim_{t\to\infty}\dfrac{f(t)}{f(2t)}=\lim_{t\to\infty}\dfrac{4t^2+1}{t^2+1}=4$이다.
      source_flow: 대학 제시 답안 p.5
      criteria:
      - 3.A1
