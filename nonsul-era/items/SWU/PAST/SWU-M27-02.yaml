stimuli: []
stem: |
  모든 자연수 $n$에 대하여 다음 각각을 수학적 귀납법으로 증명하시오.
subparts:
- id: '1'
  stem: |
    등식
    $$1^2+3^2+5^2+\cdots+(2n-1)^2=\dfrac13n(2n-1)(2n+1)$$
    이 성립한다.
  points: 10
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        $n=1$일 때, (좌변)$=1^2=1$, (우변)$=\dfrac13\times1\times1\times3=1$이므로 주어진 등식이 성립한다.
      source_flow: 대학 제시 답안 p.8~9
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        $n=k$일 때 등식 $1^2+3^2+5^2+\cdots+(2k-1)^2=\dfrac13k(2k-1)(2k+1)$이 성립한다고 가정하자. 그러면 $1^2+3^2+5^2+\cdots+(2k-1)^2+(2k+1)^2=\dfrac13k(2k-1)(2k+1)+(2k+1)^2=\dfrac{2k+1}{3}(2k^2+5k+3)=\dfrac13(k+1)(2k+1)(2k+3)$
      source_flow: 대학 제시 답안 p.8~9
      criteria:
      - 1.M2
      - 1.A1
    - id: 1b-3
      content: |
        이므로 주어진 등식이 $n=k+1$인 경우에도 성립한다. 그러므로 모든 자연수 $n$에 대하여 주어진 등식이 성립한다.
      source_flow: 대학 제시 답안 p.8~9
      criteria:
      - 1.A1
  # 채점기준 미공개 — 단계별 추정(소문항 배점·배점 합도 추정)
