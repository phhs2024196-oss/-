- id: '3'
  stem: |
    자연수
    $$5^{2n-1}+4^{n+1}$$
    은 21의 배수이다.
  points: 13
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        $n=1$일 때 $5^{2n-1}+4^{n+1}$의 값은 $5+4^2=21$이므로 이것은 21의 배수이다.
      source_flow: 대학 제시 답안 p.8~9
      criteria:
      - 3.M1
    - id: 3b-2
      content: |
        $n=k$일 때 $5^{2k-1}+4^{k+1}$이 21의 배수라고 가정하자. 즉 $5^{2k-1}+4^{k+1}=21q$로 놓자(단, $q$는 자연수). 그러면 $5^{2k+1}+4^{k+2}=25\cdot5^{2k-1}+4\cdot4^{k+1}=(21+4)\cdot5^{2k-1}+4\cdot4^{k+1}=4(5^{2k-1}+4^{k+1})+21\cdot5^{2k-1}=4\cdot21q+21\cdot5^{2k-1}=21(4q+5^{2k-1})$
      source_flow: 대학 제시 답안 p.8~9
      criteria:
      - 3.M2
      - 3.A1
    - id: 3b-3
      content: |
        이므로 $n=k+1$인 경우도 $5^{2n-1}+4^{n+1}$이 21의 배수가 된다. 그러므로 모든 자연수 $n$에 대하여 $5^{2n-1}+4^{n+1}$은 21의 배수이다.
      source_flow: 대학 제시 답안 p.8~9
      criteria:
      - 3.A1
