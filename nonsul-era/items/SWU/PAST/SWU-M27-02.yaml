- id: '2'
  stem: |
    자연수 $m$에 대하여 수열의 합
    $$S_m=1+\dfrac12+\dfrac13+\cdots+\dfrac1m$$
    에 대해, 부등식
    $$S_{2^n}\ge1+\dfrac{n}{2}$$
    이 성립한다.
  points: 12
  depends_on: []
  answer:
    kind: proof
    value: null
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        $n=1$일 때, (좌변)$=S_{2^1}=S_2=1+\dfrac12=\dfrac32$, (우변)$=1+\dfrac12=\dfrac32$이므로 주어진 부등식이 성립한다.
      source_flow: 대학 제시 답안 p.8~9
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        $n=k$일 때 부등식 $S_{2^k}\ge1+\dfrac{k}{2}$이 성립한다고 가정하자. 그러면 $S_{2^{k+1}}=S_{2^k}+\dfrac{1}{2^k+1}+\dfrac{1}{2^k+2}+\dfrac{1}{2^k+3}+\cdots+\dfrac{1}{2^k+2^k}\ge1+\dfrac{k}{2}+\dfrac{1}{2^k+2^k}+\dfrac{1}{2^k+2^k}+\dfrac{1}{2^k+2^k}+\cdots+\dfrac{1}{2^k+2^k}=1+\dfrac{k}{2}+\dfrac{2^k}{2^k+2^k}=1+\dfrac{k+1}{2}$
      source_flow: 대학 제시 답안 p.8~9
      criteria:
      - 2.M2
      - 2.A1
    - id: 2b-3
      content: |
        이므로 주어진 부등식이 $n=k+1$인 경우에도 성립한다. 그러므로 모든 자연수 $n$에 대하여 부등식이 성립한다.
      source_flow: 대학 제시 답안 p.8~9
      criteria:
      - 2.A1
