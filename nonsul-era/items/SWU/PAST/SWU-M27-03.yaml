- id: '2'
  stem: |
    다섯 자리 자연수에서 숫자 1, 2, 3이 왼쪽부터 차례대로 나타나고, 숫자 1과 숫자 3 사이에 정확히 두 개의 숫자가 있는 경우의 수를 구하시오.
  points: 12
  depends_on: []
  answer:
    kind: value
    value: '120'
    equivalents: []
    tolerance: null
  solutions:
  - id: S2-B
    audience: B
    method_no: 1
    steps:
    - id: 2b-1
      content: |
        숫자 1과 숫자 3 사이에 정확히 두 개의 숫자가 있어야 하므로, 숫자 1과 숫자 3의 위치는 $1\square\square3\square$ 또는 $\square1\square\square3$의 두 가지뿐이다.
      source_flow: 대학 제시 답안 p.13
      criteria:
      - 2.M1
    - id: 2b-2
      content: |
        첫 번째의 경우, 숫자 2는 둘째 자리 또는 셋째 자리에 올 수 있다. 따라서 숫자 2의 위치는 2가지 경우가 가능하다. 나머지 두 자리는 4, 5, 6, 7, 8, 9 중 서로 다른 두 숫자를 선택하여 배열하므로 ${}_6\mathrm{P}_2=6\times5=30$가지이다. 따라서 이 경우 원하는 배열을 얻는 경우의 수는 $2\times30=60$가지이다.
      source_flow: 대학 제시 답안 p.13
      criteria:
      - 2.M2
    - id: 2b-3
      content: |
        두 번째의 경우도 같은 방식으로 경우의 수가 60임을 보일 수 있다. 따라서 가능한 다섯 자리 자연수의 개수는 $60+60=120$이다.
      source_flow: 대학 제시 답안 p.13
      criteria:
      - 2.M2
      - 2.A1
