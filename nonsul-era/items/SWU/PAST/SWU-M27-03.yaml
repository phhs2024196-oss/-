- id: '3'
  stem: |
    다섯 자리 자연수에서 숫자 1과 숫자 2가 서로 이웃하여 나타나고, 숫자 3이 숫자 2 또는 숫자 4와 이웃하여 나타나는 경우의 수를 구하시오.
  points: 15
  depends_on: []
  answer:
    kind: value
    value: '280'
    equivalents: []
    tolerance: null
  solutions:
  - id: S3-B
    audience: B
    method_no: 1
    steps:
    - id: 3b-1
      content: |
        먼저 숫자 3이 숫자 2와 이웃하는 경우를 생각하자. 숫자 1과 숫자 2도 서로 이웃해야 하므로, 숫자 1, 2, 3은 반드시 $1\,2\,3$ 또는 $3\,2\,1$의 형태로 연속하여 나타난다. 이를 하나의 블록으로 생각하면, 이 블록의 위치를 정하는 경우의 수는 3이고, 나머지 두 자리를 4부터 9까지의 숫자로 채우는 경우의 수는 ${}_6\mathrm{P}_2=30$이다. 따라서 이 경우 원하는 배열을 얻는 경우의 수는 $2\times3\times{}_6\mathrm{P}_2=2\times3\times30=180$이다.
      source_flow: 대학 제시 답안 p.13
      criteria:
      - 3.M1
      - 3.A1
    - id: 3b-2
      content: |
        다음으로 숫자 3이 숫자 4와 이웃하고, 숫자 2와는 이웃하지 않는 경우를 생각하자. 이 경우에는 12 또는 21을 하나의 블록으로, 34 또는 43을 하나의 블록으로 생각할 수 있다. 두 블록을 12와 34로 정하거나, 21과 43으로 정할 경우, 또한 두 블록이 1234 혹은 4321로 붙어 있으면 숫자 3과 숫자 2가 이웃하게 되므로, 앞의 경우에서 고려한 경우와 중복된다. 이 경우를 제외하고 가능한 배열은
      source_flow: 대학 제시 답안 p.13
      criteria:
      - 3.M2
    - id: 3b-3
      content: |
        12, 34를 선택한 경우: $12\square34$, $\square3412$, $34\square12$, $3412\square$,
        12, 43을 선택한 경우: $\square1243$, $12\square43$, $1243\square$, $\square4312$, $43\square12$, $4312\square$,
        21, 34를 선택한 경우: $\square2134$, $21\square34$, $2134\square$, $\square3421$, $34\square21$, $3421\square$,
        21, 43을 선택한 경우: $\square2143$, $21\square43$, $2143\square$, $43\square21$
        의 20가지이다.
      source_flow: 대학 제시 답안 p.13
      criteria:
      - 3.M3
    - id: 3b-4
      content: |
        빈 자리에 들어갈 숫자는 5부터 9까지의 숫자 중 하나이므로 각 경우마다 5가지 방법으로 빈 자리를 채울 수 있다. 따라서 원하는 배열을 얻는 경우의 수는 $20\times5=100$이다. 따라서 문제에서 원하는 배열을 모두 얻는 경우의 수는 $180+100=280$이다.
      source_flow: 대학 제시 답안 p.13
      criteria:
      - 3.A2
