stimuli: []
stem: |
  1부터 9까지의 자연수 중 서로 다른 다섯개의 숫자를 선택하여 다섯 자리 자연수를 만든다. 다음 물음에 답하시오.
subparts:
- id: '1'
  stem: |
    다섯 자리 자연수에서 연속한 세 자리 숫자가 왼쪽부터 차례대로 1, 2, 3인 경우의 수를 구하시오.
  points: 8
  depends_on: []
  answer:
    kind: value
    value: '90'
    equivalents: []
    tolerance: null
  solutions:
  - id: S1-B
    audience: B
    method_no: 1
    steps:
    - id: 1b-1
      content: |
        숫자 123을 하나의 블록으로 생각한다. 나머지 두 자리는 4부터 9까지의 숫자 중 서로 다른 두 숫자를 선택하여 채워야 하므로 그 경우의 수는 ${}_6\mathrm{P}_2=6\times5=30$이다.
      source_flow: 대학 제시 답안 p.13
      criteria:
      - 1.M1
    - id: 1b-2
      content: |
        또한 블록 123은 $123\square\square$ 또는 $\square123\square$ 또는 $\square\square123$의 세 위치에 놓일 수 있다. 따라서 가능한 다섯 자리 자연수의 개수는 $3\times{}_6\mathrm{P}_2=3\times6\times5=90$이다.
      source_flow: 대학 제시 답안 p.13
      criteria:
      - 1.M2
      - 1.A1
