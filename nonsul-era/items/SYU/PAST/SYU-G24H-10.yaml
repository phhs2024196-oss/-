subparts:
- id: '1'
  stem: 위 문제의 답을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: set
    value: d=1/3; k=3/2
    equivalents:
    - 움직인 거리 $\dfrac{1}{3}$, $k=\dfrac{3}{2}$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 변위 0 조건으로 $k=\frac32$, 거리는 $t=1$에서 구간을 나눠 $\lvert v\rvert$를 적분한다.
    steps:
    - id: 1a
      content: $\int_0^k(-t^2+t)dt=-\frac16k^2(2k-3)=0\Rightarrow k=\frac32$; $d=\int_0^{3/2}\lvert -t^2+t\rvert dt=2\int_0^1(-t^2+t)dt=\frac13$
      criteria:
      - 1.M1
      - 1.A1
      - 1.M2
      - 1.A2
    hint_ladder:
    - 원점으로 돌아온다는 것은 위치의 변화량이 얼마라는 뜻인가?
    - 움직인 거리는 속도가 아니라 속력 $\lvert v(t)\rvert$를 적분한다.
    - $v(t)$의 부호가 바뀌는 $t=1$에서 구간을 나누자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 p.49 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        위치의 변화량이 0이므로
        $$\int_0^k(-t^2+t)dt=\left[-\frac13t^3+\frac12t^2\right]_0^k=-\frac13k^3+\frac12k^2=-\frac16k^2(2k-3)=0$$
        $k>0$이므로 $k=\dfrac32$.
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-2
      content: |
        점 $\mathrm{P}$가 움직임이 바뀌는 순간 $v(t)=0$이므로 $v(t)=-t^2+t=-t(t-1)$에서 $t=1$일 때 운동 방향이 바뀐다.
      criteria:
      - 1.M2
    - id: 1b-3
      content: |
        $t=0$에서 $t=\frac32$까지 움직인 거리를 $d$라 할 때,
        $$d=\int_0^{\frac32}\lvert -t^2+t\rvert dt=2\int_0^1(-t^2+t)dt=2\left[-\frac13t^3+\frac12t^2\right]_0^1=2\cdot\frac16=\frac13$$
        (위치의 변화량이 0이므로 $\int_1^{3/2}\lvert v\rvert dt=\int_0^1 v\,dt$, 즉 두 구간의 거리가 같다.)
      criteria:
      - 1.M2
      - 1.A2
