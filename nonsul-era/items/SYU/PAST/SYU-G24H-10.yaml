stem: |
  수직선 위를 움직이는 점 $\mathrm{P}$의 시각 $t\,(t\ge0)$에서의 속도 $v(t)$가 $v(t)=-t^2+t$이다. 점 $\mathrm{P}$가 $t=0$일 때 원점을 출발하여 다시 원점으로 돌아오는 시각을 $k$라 하자. $t=0$에서 $t=k$까지 점 $\mathrm{P}$가 움직인 거리와 시각 $k$를 각각 구하시오. [10점]
elements:
  materials:
  - 수직선 위를 움직이는 점의 속도 $v(t)=-t^2+t$(이차함수)
  concepts:
  - 위치의 변화량 = 속도의 정적분
  - 움직인 거리 = 속도의 절댓값의 정적분
  - 운동 방향이 바뀌는 시각($v(t)=0$)
  tools:
  - 다항함수의 정적분
  - 절댓값이 있는 함수의 정적분(구간 나누기)
  - 대칭성 이용
  conditions:
  - 원점으로 다시 돌아옴 → $\int_0^k v(t)dt=0$, $k>0$
  - $t=1$에서 $v(t)$의 부호가 바뀜
