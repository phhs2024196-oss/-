subparts:
- id: '1'
  stem: 위 문제의 답을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: value
    value: '2'
    equivalents:
    - $f(22)=2$ ($a=-1$, $b=10$)
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: 두 경계점 $x=1$, $x=4$의 연속 조건으로 $a+b=9$, $4a+b=6$을 얻는다.
    steps:
    - id: 1a
      content: $3=\frac{a+b}{3}$, $\frac{4a+b}{6}=f(-1)=1$ → $a=-1,b=10$, $f(22)=f(2)=\frac{2a+b}{4}=2$
      criteria:
      - 1.B1
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - $x=1$에서 좌극한과 우극한을 비교해 보자.
    - $x=4$의 오른쪽 값은 (가)에 의해 어느 점의 값과 같은가?
    - $22$를 5로 나눈 나머지를 생각하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 p.51 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        조건 (나)에서 $f(x)$는 $x=1$에서 연속이므로 $\lim_{x\to1-}f(x)=\lim_{x\to1+}f(x)$
        $$3=\frac{a+b}{3}\quad\therefore a+b=9\ \cdots ①$$
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $f(x)$는 $x=4$에서 연속이고 조건 (가)에 의해
        $$\lim_{x\to4-}f(x)=\lim_{x\to4+}f(x)=\lim_{x\to-1+}f(x)$$
        $$\frac{4a+b}{6}=(-1)^2-1+1=1\quad\therefore 4a+b=6\ \cdots ②$$
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-3
      content: |
        ①, ②를 연립하면 $a=-1$, $b=10$.
        $$f(22)=f(2)=\frac{2a+b}{4}=\frac14(-2+10)=2$$
      criteria:
      - 1.A2
  rubric:
    rules:
      ft_scope: cross_subpart_only
      ft_requires_working: true
