key_idea: $x=1$에서의 연속과, 주기 5를 이용한 $x=4$에서의 연속($\lim_{x\to4+}f=\lim_{x\to-1+}f$)으로 $a,b$를 정한다.
stuck: $x=4$에서의 우극한을 주기성으로 $x=-1$에서의 우극한으로 바꾸는 것
