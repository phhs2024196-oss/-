    wrong_work: $x=1$에서의 연속만 쓰고 $x=4$에서는 조건을 세우지 못해 $a,b$를 정하지 못함(또는 $\frac{4a+b}{6}=f(4)$를 (나)의 첫 식에 $x=4$를 넣어 계산)
    detect_cue: $4a+b$에 관한 식이 없거나 $4^2+4+1=21$이 등장한다
    feedback: 주기함수에서는 한 주기 끝점 $x=4$와 다음 주기 시작점 $x=-1+5$가 이어지는 지점에서도 연속이어야 합니다. (가)로 $x=4$ 근방을 $x=-1$ 근방으로 옮기세요.
