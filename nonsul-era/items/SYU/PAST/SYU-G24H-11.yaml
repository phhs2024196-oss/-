      - 1b-1
    - id: 1.M1
      mark_type: M
      points: 2
      evidence: 조건 (가)의 주기성으로 $\lim_{x\to4+}f(x)=\lim_{x\to-1+}f(x)$(또는 $f(4)=f(-1)$)를 써서 $x=4$에서의 연속 조건을 세웠다. (공식 배점 4점을 식 2 + 값 2로 나눔, 추정)
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: $4a+b=6$ 을 구했다.
      depends_on:
      - 1.M1
      implied_ok: false
