      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $a=-1$, $b=10$ 을 구하고 $f(22)=f(2)=2$ 를 구했다.
      depends_on:
      - 1.M1
      - 1.B1
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
