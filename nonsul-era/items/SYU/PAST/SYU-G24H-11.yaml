stem: |
  함수 $f(x)$가 모든 실수 $x$에 대하여 다음을 만족시킨다.

  (가) $f(x)=f(x+5)$

  (나) $f(x)=\begin{cases}x^2+x+1 & (-1\le x<1)\\ \dfrac{ax+b}{x+2} & (1\le x<4)\end{cases}$

  함수 $f(x)$가 실수 전체의 집합에서 연속일 때, $f(22)$의 값을 구하시오. (단, $a,b$는 상수이다.) [10점]
elements:
  materials:
  - 주기가 5인 함수
  - 구간별로 정의된 이차함수·유리함수 $\dfrac{ax+b}{x+2}$
  concepts:
  - 함수의 연속(좌극한=우극한=함숫값)
  - 주기함수
  tools:
  - 구간 경계에서 좌·우극한 비교
  - 주기를 이용한 함숫값 환원
  - 연립일차방정식
  conditions:
  - $x=1$에서 연속 → $a+b=9$
  - $x=4$에서 연속, (가)에 의해 $\lim_{x\to4+}f(x)=\lim_{x\to-1+}f(x)=1$ → $4a+b=6$
  - $f(22)=f(2)$
