stem: |
  함수 $f(x)=\sin3x$에 대하여 $y=f(x)$의 그래프를 $x$축 방향으로 $\dfrac{\pi}{6}$만큼 평행이동한 그래프를 $y=g(x)$라 하자. $0\le x<\dfrac{2}{3}\pi$일 때, 방정식 $\{f(x)\}^2=g(x)+\dfrac54$를 만족시키는 모든 실수 $x$의 값을 구하시오. [10점]
elements:
  materials:
  - $f(x)=\sin3x$와 그 평행이동 $g(x)$
  - 삼각함수에 관한 이차방정식
  concepts:
  - 그래프의 평행이동
  - 삼각함수의 성질 $\sin\left(\theta-\frac\pi2\right)=-\cos\theta$
  - $\sin^2\theta+\cos^2\theta=1$
  tools:
  - 치환 후 완전제곱식
  - $3x$의 범위로 바꿔 해 구하기
  conditions:
