subparts:
- id: '1'
  stem: 위 문제의 답을 구하시오.
  points: 10
  depends_on: []
  answer:
    kind: set
    value: '{pi/9, 5*pi/9}'
    equivalents:
    - $x=\dfrac{\pi}{9},\ \dfrac{5}{9}\pi$
    tolerance: null
  solutions:
  - id: S1-A
    audience: A
    method_no: 1
    key_idea: $g(x)=-\cos3x$, 방정식은 $\left(\cos3x-\frac12\right)^2=0$.
    steps:
    - id: 1a
      content: $1-\cos^23x=-\cos3x+\frac54\Rightarrow\cos3x=\frac12$, $0\le3x<2\pi$에서 $3x=\frac\pi3,\frac53\pi$, $x=\frac\pi9,\frac59\pi$
      criteria:
      - 1.B1
      - 1.M1
      - 1.A1
      - 1.A2
    hint_ladder:
    - $x$축 방향 평행이동은 $x$를 무엇으로 바꾸는가?
    - $\sin^2 3x$를 $\cos3x$로 나타내 보자.
    - $3x$의 범위를 먼저 구하자.
  - id: S1-B
    audience: B
    method_no: 1
    source_flow: 「2024 선행학습 영향평가 보고서」 p.53 문항 해설 및 풀이과정
    steps:
    - id: 1b-1
      content: |
        $$g(x)=\sin3\left(x-\frac\pi6\right)=\sin\left(3x-\frac\pi2\right)=-\cos3x$$
      criteria:
      - 1.B1
    - id: 1b-2
      content: |
        $\{f(x)\}^2=g(x)+\dfrac54$에서 $\sin^23x=-\cos3x+\dfrac54$, $\sin^23x=1-\cos^23x$이므로 주어진 방정식을 정리하면
        $$1-\cos^23x=-\cos3x+\frac54,\quad \cos^23x-\cos3x+\frac14=\left(\cos3x-\frac12\right)^2=0$$
        $$\therefore\cos3x=\frac12$$
      criteria:
      - 1.M1
      - 1.A1
    - id: 1b-3
      content: |
        $0\le x<\dfrac23\pi$에서 $0\le3x<2\pi$이므로
        $$3x=\frac\pi3,\ \frac53\pi\qquad\therefore x=\frac\pi9,\ \frac59\pi$$
      criteria:
      - 1.A2
