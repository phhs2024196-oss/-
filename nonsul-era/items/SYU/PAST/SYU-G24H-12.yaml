      points: 2
      evidence: $\sin^23x=1-\cos^23x$ 를 대입해 $\cos3x$에 관한 이차방정식으로 정리했다. (공식 배점 4점을 식 2 + 값 2로 나눔, 추정)
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A1
      mark_type: A
      points: 2
      evidence: 주어진 방정식을 $\cos3x=\dfrac12$ 로 정리했다.
      depends_on:
      - 1.M1
      implied_ok: false
      steps:
      - 1b-2
    - id: 1.A2
      mark_type: A
      points: 3
      evidence: $0\le3x<2\pi$에서 해 $x=\dfrac\pi9,\ \dfrac59\pi$ 를 모두 구했다.
      depends_on:
      - 1.M1
      - 1.A1
      implied_ok: false
      steps:
      - 1b-3
