intent: 삼각함수의 성질을 이용하여 삼각함수의 방정식의 해를 구할 수 있다.
key_idea: $g(x)=\sin3\left(x-\frac\pi6\right)=-\cos3x$로 바꾸고 $\sin^2=1-\cos^2$를 써서 $\cos3x$에 관한 완전제곱식을 만든다.
stuck: 평행이동 후 $\sin\left(3x-\frac\pi2\right)=-\cos3x$로 바꾸는 것과 $3x$의 범위 변환
